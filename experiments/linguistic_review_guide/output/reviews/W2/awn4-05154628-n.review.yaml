# ── المرحلة ١: المراجعة والتوليد ───────────────────────
stage1_review:
  assessment:
    concerns:
      - "إِثْمَار تُقابَل في المعاجم التقنية (ARABTERM) بـ«fructification» (تكوين الثمار وإنتاجها)
         لا بـ«fruitfulness» (صفة الإثمار)، مما يُشير إلى انزياح طفيف بين الدلالة العملية
         للمصطلح والمفهوم المقصود في المجموعة."
      - "التعريف الحالي «صفة الشيء الذي يسبب أو يساعد على النمو الصحي» يبدو مُترجَماً حرفياً
         من الإنجليزية ولا يتبع أسلوب المعجم الوسيط في الجنس القريب والفصل النوعي."
    observations: >
      المجموعة تُمثّل مفهوماً مجرداً هو «خاصية الخصب والإنتاجية». اللمّتان الموجودتان تُقدّمان
      وجهتَي نظر دلاليتين متكاملتَين: خُصُوبَة (الصفة الوصفية المجردة للإنجاب والإنتاج)
      وإِثْمَار (البُعد الفاعل لإخراج النتاج والثمار). والجذر ثمر يدل في مقاييس اللغة على
      «شيء يتولد عن شيء متجمعاً» وهو معنىً يشمل كلّ إنتاج. أما الجذر خصب فيدل على
      ضد الجدب وما يتصل بالنماء والبركة. الاثنان حقيقيان لغوياً لكن إثمار أكثر ميلاً
      نحو الإجراء (مصدر فعل)، بينما خصوبة هي الصفة الثابتة.

  blind_candidates:
    - lemma: "نَمَاء"
      generation_method: ishtiqaq
      justification: >
        من جذر نما/ينمو، وزن فَعَال، يدل على الزيادة والارتفاع. مقاييس اللغة: «النون والميم
        والحرف المعتل أصل واحد يدل على ارتفاع وزيادة». قُدِّر كمرشح لأن مفهوم المجموعة
        يتمحور حول النمو الصحي.
    - lemma: "خِصْب"
      generation_method: majaz
      justification: >
        الجذر خ-ص-ب يدل أصلاً على ضد الجدب. خِصْب وزن فِعْل مصدري يُستعمل وصفاً وصفةً،
        وقد استُعمل في العربية القديمة للدلالة على حالة النماء والبركة. إحياء الصيغة
        المصدرية القديمة بديلاً عن خُصُوبَة المُستحدَثة.
    - lemma: "إِنْبَاتِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن الاسم المنسوب من «أنبَتَ» (فعل رباعي من جذر ن-ب-ت). يدل على
        الخاصية المتعلقة بالإنبات والقدرة على إخراج النبات، وهي وثيقة الصلة بمساعدة النمو
        الصحي.
    - lemma: "نَضَارَة"
      generation_method: majaz
      justification: >
        من جذر نضر (نضارة)، والأصل في مقاييس اللغة «حسن وجمال وخلوص». مجاز دلالي:
        النضارة تعني حيوية النمو والاخضرار، وهي تلازم الصحة والنماء. استُعمل مجازاً
        للتعبير عن حال الشيء المُعين على النمو الصحي.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "إِثْمَار"
      confirm:
        - text: "«بَاب إثمار الشّجر والنبات: أينع الثَّمر وأدْركَ وأجنى وينع ونضج وطاب وأزهى»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (ت 1274م)"
        - text: "«الثَّاءُ وَالْمِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ شَيْءٌ يَتَوَلَّدُ عَنْ شَيْءٍ مُتَجَمِّعًا،
                  ثُمَّ يُحْمَلُ عَلَيْهِ غَيْرُهُ اسْتِعَارَةً.»"
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
      contradicts:
        - text: "«تكون وإنتاج الفواكه والبذور الذي يتلو تلقيح أزهار النباتات المثمرة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ArabTerm (translation_en: fructification)"
          conflict: >
            يُرادف إثمار في هذا المعجم التقني «fructification» أي عملية تكوين الثمار،
            لا «fruitfulness» التي هي صفة الشيء المُثمِر. الفارق: الفعل مقابل الصفة.
      expands:
        - text: "«إثمار؛ إنتاجية؛ خِصْب»"
          source: "المورد الحديث (2008) — translation_en: fecundity"
          addition: >
            المورد يعدّ إثمار وإنتاجية وخصب مُترادفات في سياق fecundity، مما يؤكد
            قابلية توسيع دلالة إثمار لتشمل الصفة المجردة، ليس الفعل وحده.

    - lemma: "خُصُوبَة"
      confirm:
        - text: "«الخصوبة أو القدرة على الإخصاب»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ArabTerm (fecundity)"
        - text: "«القدرة الإنجابية المحتملة والإنتاجية لكائن حي أو لمجموعة من السكان»"
          source: "مسرد المناخ والبيئة — ArabTerm (fecundity)"
        - text: "«إنتاج الفرد أو المجموعة لأنسال حية، ويستعمل الاصطلاح للدلالة على أصغر عدد
                  من الأنسال تولده أنثى خلال فترة إنسالها»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ArabTerm (fertility)"
        - text: "«الْخَاءُ وَالصَّادُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ ضِدُّ الْجَدْبِ»"
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
      expands:
        - text: "«(الخصب) النَّمَاء والبركة ورَغَدُ العيش، جمعه أخصاب»"
          source: "المعجم الوسيط"
          addition: >
            يُضيف «النماء والبركة» كتفسير للخصب في المعجم الوسيط، مما يربط الجذر مباشرةً
            بمفهوم النمو المُعان.

    - lemma: "نَمَاء"
      contradicts:
        - text: "«النَّمَاء: الذي يتحدَّث مع القوم فينمَّ عليهم فيكشف ما يكرهون كشفَه»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
          conflict: >
            الإدخال الوحيد الموجود لـ«النماء» بكسر النون في هذا المعجم يشير إلى النمّام
            (المغتاب)، لا إلى النمو. والمعنى الصحيح لنَمَاء (من نمى/نما) = الزيادة،
            إلا أن دلالته ترتكز على النتيجة (النمو ذاته) لا على الخاصية المُسبِّبة للنمو،
            مما يُخالف تعريف المجموعة.
      expands:
        - text: "«النُّونُ وَالْمِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَزِيَادَةٍ»"
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
          addition: >
            الجذر نمي/نما يدل على الارتفاع والزيادة، وهو يصف النمو بوصفه نتيجة،
            لا الخاصية المُسبِّبة له.

    - lemma: "خِصْب"
      confirm:
        - text: "«الخِصْبُ: كثرةُ العُشب ورفاغةُ العيش»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
        - text: "«الخِصْبُ: نقيض الجَدْبِ، وهو كثرة العُشب، ورفاهة العيش، والإخصابُ والاختِصابُ منه»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي (ت 786م)"
        - text: "«الخِصْبُ: النَّماء والبركة رَغَدُ العيش»"
          source: "المعجم الوسيط"
        - text: "«١- كَثْرَةُ العُشْبِ. ٢- النَّماءُ والبَركَةُ»"
          source: "المعجم الكبير"
        - text: "«تربة قادرة على إنتاج محاصيل وفيرة بانتظام، كائنات قادرين على توالد وتكاثر
                  عاليين بالنسبة للنوع…»"
          source: "مسرد المناخ والبيئة — ArabTerm (translation_en: fertile)"
      expands:
        - text: "«(1) خِصْب. (2) نسبة المواليد [في بلدٍ]»"
          source: "المورد الحديث (2008) — translation_en: fertility"
          addition: >
            يُبيّن أن خصب يُترجم بـfertility ويشمل معنى معدل الخصوبة الديموغرافي،
            مما يُوسّع نطاقه إلى ما هو أبعد من الأرض الزراعية.

    - lemma: "إِنْبَاتِيَّة"
      evidence_status: "no_material_found"

    - lemma: "نَضَارَة"
      contradicts:
        - text: "«النُّونُ وَالضَّادُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى حُسْنٍ وَجَمَالٍ وَخُلُوصٍ.
                  مِنْهُ النَّضْرَةُ: حُسْنُ اللَّوْنِ»"
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
          conflict: >
            الجذر نضر يدل على الحسن والجمال وبهاء اللون، لا على الخاصية المُسبِّبة
            للنمو. نضارة صفة الاخضرار والرونق، وليست مصطلحاً للإنتاجية البيولوجية.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إِثْمَار"
      decision: confirmed
      decision_reason: >
        رغم أن المعاجم التقنية تُرادف إثمار بـfructification (عملية تكوين الثمار)، فإن
        الجذر ثمر في مقاييس اللغة يدل على كل شيء يتولد نتاجاً؛ وقد يُستعمل إثمار في
        العربية المعاصرة بمعنى الخاصية المُثمِرة (إثمار الجهود = فاعليتها). فضلاً عن ذلك
        يُدرجه المورد الحديث مرادفاً لـfecundity. يُبقى على اللمّة مع توثيق الفارق الدلالي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز الجانب الفاعل الديناميكي (إخراج النتاج وإظهار الثمرة)؛ يُستعمل كثيراً في
        السياق النباتي والزراعي، ويمتد مجازاً إلى إثمار المساعي الفكرية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِثْمَار"

    - lemma: "خُصُوبَة"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة توثيقاً واسعاً في أكثر من عشرة مصادر ARABTERM تتراوح بين البيولوجيا
        والطب والاقتصاد والجغرافيا، وكلها تُرادفها بـfecundity/fertility. والجذر خصب يمتد
        في المعجمية الكلاسيكية إلى كتاب العين. تشكيلها الحالي كامل ودقيق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُبرز الجانب الوصفي المجرد للقدرة الإنتاجية؛ تُستعمل في السياق البيولوجي والديموغرافي
        وعلوم التربة. هي الصيغة الأسمية المجردة (فُعُولة) المُستخلَصة من الجذر خصب.

    - lemma: "نَمَاء"
      source: stage1
      decision: removed
      decision_reason: >
        نَمَاء يدل على النمو والزيادة بوصفها نتيجة، لا على الخاصية أو الصفة المُسبِّبة لذلك
        النمو. المجموعة تطلب «صفة الشيء الذي يُسبّب أو يُساعد على النمو»، والنماء هو النمو
        ذاته. الإسناد الخاطئ لو أُدرج سيُبدل المفهوم المطلوب.

    - lemma: "خِصْب"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثّق في أقدم معاجم اللغة (العين، القاموس، الوسيط، الكبير، مقاييس اللغة) بمعنى
        «النماء والبركة» و«ضد الجدب». يُضيف للمجموعة السجلّ الكلاسيكي العريق إلى جانب
        خصوبة الأحدث صياغةً. التشكيل: خِصْب (بكسر الخاء).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن حالة الخصب الملموسة في الأرض والبيئة الطبيعية (مقابله الجدب)؛ يُستعمل
        وصفاً وصفةً، وهو أعمّ تاريخياً من خصوبة التي تخصصت في السياق البيولوجي الحديث.
      actions:
        - command: create_entry
          params:
            lemma: "خِصْب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05154628-n"

    - lemma: "إِنْبَاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أثر للمصطلح في قواعد البيانات المعجمية المستعلَمة. اختبار التثبيت المعجمي يُخفق:
        يمكن إحلال «قابلية الإنبات» أو «قدرة الإنبات» محلها مع الحفاظ على المعنى، مما يدل
        على أنها عبارة وصفية حرة لا مصطلح مسكوك. لا إجراء مطلوب.

    - lemma: "نَضَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر نضر يدل في مقاييس اللغة على «حسن وجمال وخلوص» — أي الرونق والبهاء.
        نضارة تعني جمال اللون والطراوة، لا الخاصية المُسبِّبة للنمو الصحي.
        الانتماء الدلالي للمصطلح إلى حقل الجمال والبهاء لا الإنتاجية. لا إجراء مطلوب.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────
