      entry_id: "{auto}"
      root: "حبب"
      maqayis_quote: "«الْحَاءُ وَالْبَاءُ أُصُولٌ ثَلَاثَةٌ، أَحَدُهَا اللُّزُومُ وَالثَّبَاتُ... وَأَمَّا اللُّزُومُ فَالْحُبُّ وَالْمَحَبَّةُ، اشْتِقَاقُهُ مِنْ أَحَبَّهُ إِذَا لَزِمَهُ.»"
    - lemma: "عَزِيز"
      entry_id: "{auto}"
      root: "عزز"
      maqayis_quote: "«الْعَيْنُ وَالزَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى شِدَّةٍ وَقُوَّةٍ وَمَا ضَاهَاهُمَا، مِنْ غَلَبَةٍ وَقَهْرٍ.»"
    - lemma: "قَرِيب"
      entry_id: "{auto}"
