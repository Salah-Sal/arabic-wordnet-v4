stage1_review:
  assessment:
    concerns:
      - "المجموعة المترادفة العليا (hypernym) الحالية غير صحيحة دلالياً، حيث تشير إلى 'عامل' أو 'فاعل' (person who works)، بينما يُفترض أن تكون 'قريب' أو 'شخص' (person/relative)."
      - "التعريف الحالي بسبقه بكلمة 'شخص' جيد، لكن صياغته تميل قليلاً إلى البساطة التفسيرية، ويحتاج إلى صياغة معجمية أكثر رصانة."
    observations: "المفهوم الإنجليزي 'loved one' يغطي كلاً من الأحباء (بالمعنى العام) والأقارب (بالمعنى الخاص)، وهو ما تفتقر إليه المجموعة الحالية بحصرها في 'حبيب' و'عزيز'. الألفاظ العربية مثل 'حميم' و'قريب' ضرورية لاستكمال الشبكة الدلالية للمفهوم، خاصة مع نص التعريف على كونه 'فرداً من العائلة'."
  blind_candidates:
    - lemma: "قَرِيب"
      generation_method: ishtiqaq
      justification: "المصطلح الأكثر شيوعاً في العربية للتعبير عن 'loved one' في سياق العائلة (كما ورد في التعريف)."
    - lemma: "حَمِيم"
      generation_method: ishtiqaq
      justification: "يشير إلى القرب الشديد والمودة الخالصة، ويستخدم لوصف الأصدقاء المقربين والأقارب."
    - lemma: "صَفِيّ"
      generation_method: ishtiqaq
      justification: "الحبيب الخالص أو الصديق المختار، وهو تعبير تراثي رصين."
    - lemma: "مَحْبُوب"
      generation_method: ishtiqaq
      justification: "الاسم المفعول المباشر من الفعل 'حبّ'، وهو المقابل الحرفي لـ 'loved one'."

stage2_evidence:
  per_lemma:
    - lemma: "حَبِيب"
      confirm:
        - text: "«(الحبيب) المحبوب والمحب... (ج) أحباء وأحبة»"
          source: "المعجم الوسيط"
        - text: "«الحَبِيبُ: المُحِبُّ المَحْبُوبُ , والأُنثَى حَبِيبَة الرَّفِيقُ»"
          source: "المعجم الكبير"
    - lemma: "عَزِيز"
      confirm:
        - text: "«(الْعَزِيز) من أَسمَاء الله تَعَالَى وَمَعْنَاهُ الْغَالِب الَّذِي لَا يقهر»"
          source: "المعجم الوسيط"
      expands:
        - text: "«عزيز: عزيز النفس، عزيز عليّ (أي غالٍ)»"
          source: "الاستعمال المعاصر"
    - lemma: "قَرِيب"
      confirm:
        - text: "«(الْقَرِيب) الداني فِي الْمَكَان أَو الزَّمَان أَو النّسَب... (ج) أقرباء»"
          source: "المعجم الوسيط"
        - text: "«فُلَانٌ ذُو قَرَابَتِي، وَهُوَ مَنْ يَقْرُبُ مِنْكَ رَحِمًا»"
          source: "مقاييس اللغة"
    - lemma: "حَمِيم"
      confirm:
        - text: "«(الحَمِيم) القريبُ الذى تودُّه ويودُّك. وقيل: القريبُ الذى تهتمُّ لأمره»"
          source: "المعجم الكبير"
        - text: "«(الْحَمِيم) القريب الَّذِي توده ويودك... (ج) أحماء»"
          source: "المعجم الوسيط"
    - lemma: "صَفِيّ"
      confirm:
        - text: "«الصديقُ المختارُ. الحبيبُ الخالصُ الذى يُحسِنُ ويُخْلِصُ الإخاءَ»"
          source: "المعجم الكبير"
        - text: "«الصديقُ المختصُّ. يقال: هو صَفِيِّي»"
          source: "المعجم الوسيط"
    - lemma: "مَحْبُوب"
      confirm:
        - text: "«حَبِيب: المحبوب والمحب»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "حَبِيب"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشامل يعبر عن الشخص المحبوب، وهو فصيح وشائع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَبِيب"
    - lemma: "عَزِيز"
      decision: confirmed
      decision_reason: "يستخدم لوصف الشخص الذي له مكانة عالية في القلب، وهو مرادف قوي لـ 'loved one'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَزِيز"
    - lemma: "قَرِيب"
      source: stage1
      decision: confirmed
      decision_reason: "يدعم الشق الثاني من التعريف 'عادة ما يكون فرداً من عائلتك'، وهو المصطلح الرسمي والاجتماعي الأكثر دقة في هذا السياق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "قَرِيب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09646098-n"}
    - lemma: "حَمِيم"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن القرب النفسي والمودة المتبادلة، وهو رصين وفصيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حَمِيم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09646098-n"}
    - lemma: "صَفِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "يضيف بعداً من الصفاء والإخلاص في المحبة، وهو مرادف كلاسيكي غني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "صَفِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09646098-n"}

stage4_content:
  definition:
    current: "شخص تحبه، عادة ما يكون فرداً من عائلتك"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً ويميل للترجمة الحرفية، يحتاج لصياغة معجمية تجمع بين المحبة والقرابة."
    authored:
      - type: linguistic
        text: "الشخصُ الذي تَودُّه وتُخلص له المحبَّة، وغالباً ما يكون من الأهل أو الأقارب."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "حَبِيب"
        examples:
          - text: "وَدَّعَ المسافِرُ أحبابَه وأهْلَه بدموعِ الحُزْنِ."
            type: usage
      - lemma: "عَزِيز"
        examples:
          - text: "فَقَدْتُ صديقاً عزيزاً كان بمثابةِ الأخِ لي."
            type: usage
      - lemma: "قَرِيب"
        examples:
          - text: "حَضَرَ الأقرباءُ جميعاً للاحتفالِ بنجاحِ ابنهِ."
            type: usage
      - lemma: "حَمِيم"
        examples:
          - text: "لا يُفشي المرءُ أسرارَه إلا لصديقٍ حَمِيمٍ."
            type: usage
      - lemma: "صَفِيّ"
        examples:
          - text: "هو صَفِيِّي الذي أثقُ برأيهِ وأستشيرُه في معضلاتي."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09646098-n", definition_index: 0, text: "الشخصُ الذي تَودُّه وتُخلص له المحبَّة، وغالباً ما يكون من الأهل أو الأقارب."}

stage5_enrichment:
  per_entry:
