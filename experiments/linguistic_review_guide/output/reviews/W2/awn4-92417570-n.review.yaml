# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'معاداة الدين' تبدو عبارةً وصفيَّةً حرَّةً لا مصطلحاً مسكوكاً مُثبَّتاً؛ إذ يمكن إبدال 'معاداة' بـ'عداوة' أو 'رفض' دون أن يُفقَد المعنى الوصفي"
      - "اللمّة الموجودة خاليةٌ من التشكيل الكامل"
      - "المجموعة تفتقر إلى ألفاظ تراثيَّة معجميَّة راسخة كالزَّنْدَقَة رغم وفرة التراث العربي في هذا الباب"
      - "قيمة ILI غير محدَّدة (null)"
    observations: "المجموعة الترادفيَّة تُعبِّر عن المفهوم الإنجليزي irreligion، أي الحالة الكُلِّيَّة لمعارضة الدِّين ورفضه. وللعربية في هذا الباب تراثٌ غنيٌّ يشمل الزَّنْدَقَة والمُرُوق واللَّادِينِيَّة، غير أنَّ كلَّ واحد منها يحمل ظلالاً دلاليَّة خاصَّة. المشترك الأعلى 'خاصِّيَّة جوهريَّة' يُشير إلى أنَّ المطلوب اسمٌ لخاصِّيَّة أو حالة لا للشخص المتَّصف بها."
  blind_candidates:
    - lemma: "الزَّنْدَقَة"
      generation_method: majaz
      justification: "إحياءٌ لفظٍ تراثيٍّ أصيل يدلُّ على معارضة الدِّين برُمَّتِهِ؛ اتَّسعت دلالته من المانويَّة الثَّنَويَّة لتشمل كلَّ رافضٍ للدين، فإحياؤه يُجنِّبنا الاشتراك اللفظي في الألفاظ الحديثة غير المسكوكة"
    - lemma: "اللَّادِينِيَّة"
      generation_method: tarkib
      justification: "مُركَّب وصفيٌّ شفَّاف من أداة النفي 'لا' واسم 'دين' مع المصدر الصناعي '-يَّة'؛ يُعبِّر بصورة محايدة عن الحالة الكُلِّيَّة لغياب الدين أو معارضته على غرار 'اللاأدريَّة' و'اللاعنفيَّة'"
    - lemma: "الكُفْر"
      generation_method: majaz
      justification: "من جذر كفر = ستر وجحد، يُطلق في العربية على جحود الإله والدِّين مجازاً، وقد يُوظَّف للدلالة على رفض الدين في عمومه"
    - lemma: "المُرُوق"
      generation_method: ishtiqaq
      justification: "مصدر من مَرَقَ = خرج واخترق؛ يُقال 'مرق من الدِّين' أي خرج منه؛ وزن فُعُول يناسب المصادر الدالة على حالة الانفصال والخروج"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُعَادَاة الدِّين"
      evidence_status: "no_material_found"

    - lemma: "الزَّنْدَقَة"
      confirm:
        - text: "«الزَّنْدَقَةُ: القولُ بأزَلِيَّة العالم, وأطلق على الزردشتية, والمانوية وغيرهم من الثنوية, وتُوسع فيه فأطلق على كل شاكٍّ, أو ضالٍّ, أو ملحد. (مج)»"
          source: "المعجم الوسيط"
        - text: "«الزَّنْدَقَةُ: الضِّيقُ، القولُ بِأَزَلِيَّةِ العالمِ, وقد أُطلق على الزَّرْدشتية, والمانويَّة وغيرهم مـن الثَّنَويَّة (القائلين بإلهين: النور, والظلمة), ثم توسَّع فيه فأُطلق على كل شاكٌّ أو ضالِّ, أو مُلحِدٍ. (مج)»"
          source: "المعجم الكبير"
        - text: "«الزندقة: أَن لَا يُؤمن بِالآخِرَة ووحدانية الْخَالِق.»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الزِنْديقُ، بالكسر: من الثَّنَوِيَّةِ، أو القائلُ بالنُّورِ والظُّلْمَةِ، أو مَن لا يُؤْمِنُ بالآخِرَةِ وبالرُّبوبِيَّةِ، أو مَن يُبْطِنُ الكُفْرَ ويُظْهِرُ الإِيمانَ... والاسْمُ: الزَّنْدَقَةُ.»"
          source: "القاموس المحيط للفيروزآبادي"
      expands:
        - text: "«زَنْدَقة؛ مُروق؛ لادِين.»"
          source: "المورد الحديث (2008) — مقابل irreligion"
          addition: "يُدرج المورد الحديث الزَّنْدَقَة ضمن المقابلات الأولى لكلمة irreligion الإنجليزية، مما يُثبت دلاليَّتها الحديثة في هذا المجال إلى جانب طابعها التراثي"

    - lemma: "اللَّادِينِيَّة"
      expands:
        - text: "«زَنْدَقة؛ مُروق؛ لادِين.»"
          source: "المورد الحديث (2008) — مقابل irreligion"
          addition: "يُثبت المورد 'لادين' (الصفة) مقابلاً لـirreligion، وهو الأساس الاشتقاقي المباشر لـ'اللادينيَّة' بالمصدر الصناعي '-يَّة'؛ كما يُثبت كذلك '(1) زِنديق؛ مارق (2) تجديفيّ' لـirreligious"

    - lemma: "الكُفْر"
      contradicts:
        - text: "«الكُفْرُ، (بالضم): ضِدُّ الإِيمان... وكافِرٌ: جاحِدٌ لِأَنْعُمِ اللهِ تعالى»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الكُفر لفظٌ عقديٌّ إسلاميٌّ محدَّد يدلُّ على الجحود بالله أو نعمه، وهو أعمُّ وأخصُّ في آنٍ من مفهوم 'معارضة الدين' عموماً؛ فقد يكون الكُفرُ رفضاً لدين بعينه لا لكلِّ الأديان"

    - lemma: "المُرُوق"
      expands:
        - text: "«زَنْدَقة؛ مُروق؛ لادِين.»"
          source: "المورد الحديث (2008) — مقابل irreligion"
          addition: "يُدرج المورد 'مروق' ضمن مقابلات irreligion"
      contradicts:
        - text: "«رِدّة؛ ارتداد؛ مُروق؛ انشقاق.»"
          source: "المورد الحديث (2008) — مقابل apostasy"
          conflict: "المورد نفسه يُدرج 'مروق' تحت مقابلات apostasy (الردة/الارتداد)، مما يُشير إلى أنَّ دلالته الأصيلة هي الخروج من دينٍ بعينه (فعل انتقالي) لا الحالة العامة لمعارضة الدين"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
