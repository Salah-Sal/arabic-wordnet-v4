# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-06727915-n
# disrespect / discourtesy — تعبير عن عدم الاحترام
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«قِلَّة احْتِرَام» تركيب إضافي وصفي حرّ وليس مصطلحاً مسكوكاً؛ يمكن استبدال «قلّة» بـ«عدم» أو «انعدام» فيبقى المعنى نفسه"
      - "«وَقَاحَة» تدلّ على صلابة الوجه وقلّة الحياء، وهي سمة شخصية أكثر منها تعبيراً تواصلياً عن عدم الاحترام"
      - "التعريف العربي الحالي «تعبير عن عدم الاحترام» ترجمة حرفية للتعريف الإنجليزي وقد يحتاج صياغة أدقّ"
    observations: "المجموعة تقع تحت مفرط «رسالة / مضمون»، فالمطلوب لفظ يدلّ على الفعل التواصلي الذي يُظهِر انتقاصاً من قدر المخاطب، لا على السمة النفسية المجردة. الوقاحة أقرب إلى صفة الشخص، بينما قلّة الاحترام عبارة وصفية شفّافة. يُفتقر إلى مصطلح عربي مفرد دقيق يقابل disrespect بوصفه فعلاً تواصلياً."
  blind_candidates:
    - lemma: "إِهَانَة"
      generation_method: ishtiqaq
      justification: "مصدر أَهانَ من الجذر «هون»، على وزن إفعالة، يدلّ على فعل الحطّ من قدر المخاطب وهو تعبير تواصلي مباشر عن عدم الاحترام"
    - lemma: "جَفَاء"
      generation_method: ishtiqaq
      justification: "من الجذر «جفو» على وزن فَعال، يدلّ على الغلظة في المعاشرة وترك الرفق، وهو أسلوب سلوكي يُعبّر عن عدم الاحترام"
    - lemma: "سُوءُ أَدَب"
      generation_method: tarkib
      justification: "تركيب إضافي شائع في الاستعمال يقابل discourtesy مباشرةً"
    - lemma: "فَظَاظَة"
      generation_method: ishtiqaq
      justification: "من الجذر «فظظ» على وزن فَعالة، يدلّ على الخشونة والغلظة في القول والفعل"

stage2_evidence:
  per_lemma:
    - lemma: "قِلَّة احْتِرَام"
      evidence_status: "no_material_found"

    - lemma: "وَقَاحَة"
      confirm:
        - text: "«الوَقَاحَةُ: إلحاح النَّفس فِي تعَاطِي الْقَبِيح.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الوَقَاحة: هي صلابةُ الوجه وقلةُ الحياء.»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«الْوَاوُ وَالْقَافُ وَالْحَاءُ: كَلِمَةٌ تَدُلُّ عَلَى صَلَابَةٍ فِي الشَّيْءِ. وَالْحَافِرُ الصُّلْبُ وَقَاحٌ، شُبِّهَ بِهِ الرَّجُلُ الْقَلِيلُ الْحَيَاءِ فَقِيلَ وَقَاحٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل في الوقاحة صلابة الحافر ثم استُعير للإنسان قليل الحياء، فالمعنى مجازي أصلاً"

    - lemma: "إِهَانَة"
      confirm:
        - text: "«الإهانة: الاطراح إذلالا واحتقارا، ذكره الحرالي رحمه الله.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«أسلوب يتبعه المتكلم عن قصد للحط من قدر مخاطبه، وعادة ما يكون بإطلاق أوصاف مذمومة وأحكام غير مقبولة.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      contradicts:
        - text: "«الإهانة: هي عند أهل الشرع ما يظهر على يد الكفرة أو الفجرة من خرق العادة مخالفا لدعواه»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "في الاصطلاح الكلامي الإهانة أمر خارق للعادة على يد الكذّاب، وهو معنى اصطلاحي مغاير"
      expands:
        - text: "«الْهَاءُ وَالْوَاوُ وَالنُّونُ أُصَيْلٌ يَدُلُّ عَلَى سُكُونٍ أَوْ سَكِينَةٍ أَوْ ذُلٍّ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «هون» يدلّ على الذلّ والسكون، والإهانة منه بمعنى إلحاق الذلّ"

    - lemma: "جَفَاء"
      confirm:
        - text: "«الجفاء بالفتح، الغلظ في العشرة والخرق في المعاملة وترك الرفق في الأمور.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«نَقِيضُ الصَّلَةِ وخِلافُ البِرِّ»"
          source: "المعجم الكبير"
          conflict: "الجفاء نقيض الصلة والبرّ، فهو سلوك عام لا يقتصر على التعبير اللفظي عن عدم الاحترام"
      expands:
        - text: "«الْجِيمُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ يَدُلُّ عَلَى أَصْلٍ وَاحِدٍ: نُبُوُّ الشَّيْءِ عَنِ الشَّيْءِ. وَالْجَفَاءُ: خِلَافُ الْبِرِّ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل في الجذر «جفو» التباعد والنبوّ، فالجفاء تباعد عن الآخر لا تعبير تواصلي بالضرورة"

    - lemma: "سُوءُ أَدَب"
      evidence_status: "no_material_found"

    - lemma: "فَظَاظَة"
      confirm:
        - text: "«فَظاظَة؛ جَلافة» (ترجمة discourtesy)"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«فَظاظة؛ جَلافة» (ترجمة brusquerie)"
          source: "المورد الحديث (2008)"
          addition: "الفظاظة تُستعمل في الترجمة مرادفةً للجلافة وعدم اللباقة"

stage3_analysis:
  per_lemma:
    - lemma: "قِلَّةُ احْتِرَام"
      decision: confirmed
      decision_reason: "رغم أنّها تركيب إضافي وصفي شفّاف، فإنّها العبارة الأكثر مباشرة للدلالة على مفهوم «disrespect» في العربية المعاصرة، وتتّسق مع رتبة المجموعة تحت مفرط «رسالة/مضمون»"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تدلّ على نقص الاحترام عموماً بوصفه مضموناً تواصلياً، دون تحديد درجة الحدّة أو الصفاقة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِلَّةُ احْتِرَام"

    - lemma: "وَقَاحَة"
      decision: confirmed
      decision_reason: "لفظة عربية فصيحة مؤصَّلة من الجذر «وقح» بمعنى الصلابة، استُعيرت لقلّة الحياء. تناسب المجموعة بوصفها تعبيراً عن عدم الاحترام مقترناً بالصفاقة. مؤيَّدة بتعريفات السيوطي والبركتي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تختصّ بعدم الاحترام المقترن بالجرأة وصلابة الوجه وقلّة الحياء، وهي أشدّ حدّةً من مجرّد قلّة الاحترام"

    - lemma: "إِهَانَة"
      source: stage1
      decision: removed
      decision_reason: "الإهانة أخصّ من مفهوم المجموعة؛ تدلّ على فعل قصدي لإلحاق الذلّ والاحتقار (insult/humiliation)، بينما المجموعة تشمل التعبير عن عدم الاحترام ولو كان غير مقصود أو خفيفاً. الإهانة أقرب إلى كونها مندرجاً تحت هذه المجموعة لا مرادفاً لها."

    - lemma: "جَفَاء"
      source: stage1
      decision: removed
      decision_reason: "الجفاء في أصله نبوّ الشيء عن الشيء وتباعد، ومعناه السلوكي «الغلظ في العشرة وترك الرفق» أعمّ من التعبير التواصلي عن عدم الاحترام؛ يشمل الإهمال والتباعد دون كلام، فلا يتّسق مع كون المجموعة تحت مفرط «رسالة/مضمون»."

    - lemma: "سُوءُ أَدَب"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حرّ يفشل في اختبار السكّ (يمكن إبدال «سوء» بـ«قلّة» أو «انعدام»)، ولم يُعثر له على مدخل معجمي ثابت."

    - lemma: "فَظَاظَة"
      source: stage1
      decision: removed
      decision_reason: "الفظاظة سمة شخصية تدلّ على الخشونة والغلظة في الطبع عموماً (coarseness/rudeness)، وليست تعبيراً تواصلياً محدّداً عن عدم الاحترام. وردت ترجمةً لـ discourtesy في المورد لكنّها أعمّ دلالياً."

