      - type: terminological
        text: "مَادَّةٌ كِيمْيَائِيَّةٌ أَوْ فِيزْيَائِيَّةٌ تُضَافُ إِلَى السَّوَائِلِ أَوِ الْمَحَالِيلِ لِإِحْدَاثِ تَخَثُّرِهَا أَوِ تَجَلُّطِهَا."
