stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية تفتقر إلى التشكيل."
      - "مصطلح 'عامل تجلط' يُستخدم غالباً في السياق الطبي للدم، في حين أن المفهوم عام (Coagulant)."
    observations: "المفهوم يشير إلى أي مادة تُحدث التخثر أو التجلط، سواء في الدم، أو في معالجة المياه، أو في صناعة الأغذية. الجذران (خثر) و(جلط) مستخدمان بكثرة للتعبير عن هذه الدلالة، وصيغة (مُفَعِّل) هي القياسية للتعبير عن العامل المحدِث للفعل."
  blind_candidates:
    - lemma: "مُخَثِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (خَثَّرَ)، على وزن (مُفَعِّل) ليدل على المادة التي تُحدث التخثر."
    - lemma: "مُجَلِّط"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (جَلَّطَ)، ويشيع استخدامه طبياً وكيميائياً."
    - lemma: "عَامِلُ تَخَثُّرٍ"
      generation_method: tarkib
      justification: "مركب إضافي يصف المادة من خلال وظيفتها بدقة، ويشيع في معالجة المياه."
    - lemma: "عَامِلُ تَجَلُّطٍ"
      generation_method: tarkib
      justification: "مركب إضافي مستخدم في السياق الطبي للدلالة على المواد التي تسبب تجلط الدم."

stage2_evidence:
  per_lemma:
    - lemma: "مخثر"
      confirm:
        - text: "مادة تضاف إلى المحاليل الغروية تؤدي إلى ترسب الطور المعلَّق أو تحول السائل إلى هُلام."
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "مادة كيميائية تضاف إلى المياه المعالجة بغرض ضم المواد الغروانية والمستحلبات بعضها إلى بعض لتحسين قابلية الترسيب."
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
    - lemma: "عامل تجلط"
      confirm:
        - text: "coagulant / precipitant"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
    - lemma: "مُجَلِّط"
      confirm:
        - text: "مادة كيميائية تضاف لزعزعة الاستقرار والتسبب في الركام في البداية مع المواد الغروانية والمستحلبات لتحسين الترشيح."
          source: "المعجم الموحد لمصطلحات المياه (2000)"
    - lemma: "عَامِلُ تَخَثُّرٍ"
      confirm:
        - text: "coagulant / precipitating agent"
          source: "المعجم الموحد لمصطلحات المياه (2000)"

stage3_analysis:
  per_lemma:
    - lemma: "عامل تجلط"
      decision: confirmed
      decision_reason: "مصطلح مركّب صحيح وشائع، لا سيما في السياقات الطبية والحيوية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِلُ تَجَلُّطٍ"

    - lemma: "مخثر"
      decision: confirmed
      decision_reason: "مصطلح قياسي دقيق ومثبت في المعاجم العلمية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَثِّر"

    - lemma: "عَامِلُ تَخَثُّرٍ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير دقيق ومستخدم في المصطلحات الكيميائية والهندسية لمعالجة المياه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "عَامِلُ تَخَثُّرٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُجَلِّط"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف صحيح لمُخَثِّر، وله استخدامات علمية موثقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُجَلِّط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

