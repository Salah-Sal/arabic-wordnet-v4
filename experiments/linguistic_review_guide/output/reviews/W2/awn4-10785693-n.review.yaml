stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي واسع جداً ليشمل من 'يريد' (want) ومن 'يحتاج' (need)، وهما دلالتان متمايزتان في العربية وإن اجتمعتا في سياق الطلب."
    observations: "المجموعة تهدف للتعبير عن الشخص في حالة السعي لتحصيل شيء ما. اللمات الموجودة (راغب، محتاج) تغطي جانبي الرغبة والحاجة. يمكن إثراء المجموعة بلمات تعبر عن القصد والطلب."
  blind_candidates:
    - lemma: "رَاغِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (رغب)، وهو المصطلح العربي الأساسي لمن يريد شيئاً."
    - lemma: "مُرِيد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (أراد)، يعبر عن صاحب الإرادة والقصد، وهو المقابل الدقيق لـ (wanter)."
    - lemma: "مُبْتَغٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (ابتغى)، يعبر عن الساعي لطلب الشيء بجدية."
    - lemma: "طَالِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (طلب)، وهو عام يشمل كل من يسعى لتحصيل شيء."

stage2_evidence:
  per_lemma:
    - lemma: "رَاغِب"
      confirm:
        - text: "«رَاغِب: من (ر غ ب) الحريص على الشيء الطامع فيه الطالب له.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُحْتَاج"
      confirm:
        - text: "«مُحْتَاج: من (ح و ج) المفتقر.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُرِيد"
      confirm:
        - text: "«مُرِيد: من (ر و د) الراغب المحب.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«المُرِيد (عند الصوفية) على موجب الاشتقاق: من له إرادة.»"
          source: "المعجم الكبير"
    - lemma: "طَالِب"
      confirm:
        - text: "«طَالِب: من (ط ل ب) الذي يطلب العلم... ومن يهم بتحصيل الشيء أو يلتمسه ويريده.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُبْتَغٍ"
      confirm:
        - text: "«ابتغى الشيء: أراده وطلبه.»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "رَاغِب"
      decision: confirmed
      decision_reason: "مصطلح أصيل وشائع يعبر عن الإرادة والرغبة في الشيء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَاغِب"
    - lemma: "مُحْتَاج"
      decision: confirmed
      decision_reason: "يعبر عن جانب 'الحاجة' (need) المذكور في التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحْتَاج"
    - lemma: "مُرِيد"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل قياسي من (أراد)، وهو دقيق جداً في مقابلة (wanter) بعيداً عن السياق الصوفي الضيق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُرِيد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "طَالِب"
      source: stage1
      decision: confirmed
      decision_reason: "مفهوم الطلب يتضمن الإرادة والحاجة والسعي، وهو مستعمل بكثرة في اللغة المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "طَالِب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُبْتَغٍ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ فصيح يعبر عن الاجتهاد في الطلب والإرادة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُبْتَغٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يريد أو يحتاج شيئاً ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً، ويفضل صياغته بأسلوب معجمي يجمع بين الرغبة والحاجة والسعي."
    authored:
      - type: terminological
        text: "شَخْصٌ ذُو رَغْبَةٍ أَوْ حَاجَةٍ إِلَى شَيْءٍ مَا، يَسْعَى فِي طَلَبِهِ وَتَحْصِيلِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "رَاغِب"
        examples:
          - text: "هُوَ رَاغِبٌ فِي دِرَاسَةِ الطِّبِّ مُنْذُ صِغَرِهِ."
            type: usage
      - lemma: "مُحْتَاج"
        examples:
          - text: "قَدَّمَ المُحْسِنُونَ العَوْنَ لِكُلِّ مُحْتَاجٍ فِي القَرْيَةِ."
            type: usage
      - lemma: "مُرِيد"
        examples:
          - text: "مَا كُلُّ مُرِيدٍ لِلنَّجَاحِ بِمُدْرِكِهِ بِلَا عَمَلٍ."
            type: usage
      - lemma: "طَالِب"
        examples:
          - text: "جَاءَ طَالِبًا لِلصُّلْحِ وَالعَفْوِ."
            type: usage
      - lemma: "مُبْتَغٍ"
        examples:
          - text: "سَافَرَ مُبْتَغِيًا لِلرِّزْقِ فِي بِلَادٍ بَعِيدَةٍ."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ ذُو رَغْبَةٍ أَوْ حَاجَةٍ إِلَى شَيْءٍ مَا، يَسْعَى فِي طَلَبِهِ وَتَحْصِيلِهِ."}

stage5_enrichment:
  per_entry:
    - lemma: "رَاغِب"
      entry_id: "{auto}"
      root: "رغب"
      maqayis_quote: "«الرَّاءُ وَالْغَيْنُ وَالْبَاءُ أَصْلَانِ: أَحَدُهُمَا طَلَبٌ لِشَيْءٍ وَالْآخَرُ سَعَةٌ فِي شَيْءٍ. فَالْأَوَّلُ الرَّغْبَةُ فِي الشَّيْءِ: الْإِرَادَةُ لَهُ.»"
    - lemma: "مُحْتَاج"
      entry_id: "{auto}"
      root: "حوج"
      maqayis_quote: "«الْحَاءُ وَالْوَاوُ وَالْجِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ الِاضْطِرَارُ إِلَى الشَّيْءِ، فَالْحَاجَةُ وَاحِدَةُ الْحَاجَاتِ.»"
    - lemma: "مُرِيد"
      entry_id: "{auto}"
      root: "رود"
      maqayis_quote: "«الرَّاءُ وَالْوَاوُ وَالدَّالُ مُعْظَمُ بَابِهِ [يَدُلُّ] عَلَى مَجِيءٍ وَذَهَابٍ... تَقُولُ: رَاوَدْتُهُ عَلَى أَنْ يَفْعَلَ كَذَا، إِذَا أَرَدْتَهُ عَلَى فِعْلِهِ.»"
    - lemma: "طَالِب"
      entry_id: "{auto}"
      root: "طلب"
      maqayis_quote: "«الطَّاءُ وَاللَّامُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ابْتِغَاءِ الشَّيْءِ. يُقَالُ: طَلَبْتُ الشَّيْءَ أَطْلُبُهُ طَلَبًا.»"
    - lemma: "مُبْتَغٍ"
      entry_id: "{auto}"
      root: "بغي"
      maqayis_quote: "«الْبَاءُ وَالْغَيْنُ وَالْيَاءُ أَصْلَانِ: أَحَدُهُمَا طَلَبُ الشَّيْءِ، وَالثَّانِي جِنْسٌ مِنَ الْفَسَادِ. فَمِنَ الْأَوَّلِ بَغَيْتُ الشَّيْءَ أَبْغِيهِ: إِذَا طَلَبْتَهُ.»"
  per_sense:
    - lemma: "رَاغِب"
      sense_id: "{auto}"
      nuance: "يركز على الميل النفسي والإرادة الداخلية للشيء."
      mwe: false
    - lemma: "مُحْتَاج"
      sense_id: "{auto}"
      nuance: "يركز على جانب الاضطرار والافتقار الفعلي للشيء."
      mwe: false
    - lemma: "مُرِيد"
      sense_id: "{auto}"
      nuance: "يعبر عن صاحب الإرادة القصدية، وهو مصطلح فصيح وقوي الدلالة."
      mwe: false
    - lemma: "طَالِب"
      sense_id: "{auto}"
      nuance: "يركز على الفعل الخارجي والسعي لتحصيل المبتغى."
      mwe: false
    - lemma: "مُبْتَغٍ"
      sense_id: "{auto}"
      nuance: "يعبر عن التوجه الجاد والمقصد المحدد للوصول إلى الغاية."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"رغب","maqayis":"«الرَّاءُ وَالْغَيْنُ وَالْبَاءُ أَصْلَانِ: أَحَدُهُمَا طَلَبٌ لِشَيْءٍ... فَالْأَوَّلُ الرَّغْبَةُ فِي الشَّيْءِ: الْإِرَادَةُ لَهُ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حوج","maqayis":"«الْحَاءُ وَالْوَاوُ وَالْجِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ الِاضْطِرَارُ إِلَى الشَّيْءِ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"رود","maqayis":"«الرَّاءُ وَالْوَاوُ وَالدَّالُ مُعْظَمُ بَابِهِ... تَقُولُ: رَاوَدْتُهُ عَلَى أَنْ يَفْعَلَ كَذَا، إِذَا أَرَدْتَهُ عَلَى فِعْلِهِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"طلب","maqayis":"«الطَّاءُ وَاللَّامُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ابْتِغَاءِ الشَّيْءِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"بغي","maqayis":"«الْبَاءُ وَالْغَيْنُ وَالْيَاءُ أَصْلَانِ: أَحَدُهُمَا طَلَبُ الشَّيْءِ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على الميل النفسي والإرادة الداخلية للشيء","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
