        (المصطلح التشريحي الطبي المعتمد). (٢) عبارة «أساس بعض الاختبارات» مبهمة لا تذكر
        الجراثيم المستهدفة ولا طريقة الرصد. (٣) يفتقر إلى تعريف موسوعي يوضح القيمة
        التشخيصية والاكتشاف التاريخي.

