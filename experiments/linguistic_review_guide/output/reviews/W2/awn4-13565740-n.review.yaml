# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # ب. التقييم الأولي (بعد الاطلاع على المجموعة الكاملة)
  assessment:
    concerns:
      - "اللمّة الموجودة «تفاعل الانتفاخ» تستعمل «انتفاخ» (من جذر نفخ) بدلاً من المصطلح الطبي المعتمد «انتباج» (من جذر نبج = intumescence)، وهو ما يُثبته المعجم الطبي الموحد صراحةً."
      - "اللمّة الموجودة خالية من التشكيل."
      - "مكوّنا المركب (تفاعل + انتفاخ/تورم) مقتبسان مباشرة من كلمات التعريف، مما يُوقع في الدوران الاصطلاحي."
      - "المجموعة تفتقر إلى المصطلح العلَمي (الإسنادي) «تفاعل نويفلد» الموثَّق في المراجع الطبية العربية."

    observations: >
      المفهوم هو ظاهرة إناعية جرثومية محددة: انتباج (تضخم) محفظة الجرثوم عند ملامسته ضداً
      نوعياً. اكتشفها فريدريش نويفلد عام 1902م في المكوّرات الرئوية.
      المعجم الطبي الموحد (2009) يُثبت ثلاثة مصطلحات لهذا المفهوم: «تفاعل الانتباج»
      و«تفاعل محفظي» و«تفاعل نويفلد»، وهي جميعها تستعمل «انتباج» لا «انتفاخ».
      أما «تفاعل الانتفاخ» الموجود في AWN فمصطلحٌ غير معتمد في المراجع الطبية.

  # أ. اللمّات المرشحة (توليد أعمى — بناءً على التعريف فقط قبل الاطلاع على اللمّات)
  blind_candidates:

    - lemma: "تَفَاعُلُ الانْتِبَاجِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي: تَفَاعُل (مصدر تفاعَل — الحدث الإناعي) + الانتباج (مصدر انتبج من جذر نبج
        — المصطلح التشريحي الطبي لظاهرة التورم/البروز، يقابل intumescence).
        يُبرز آلية الظاهرة الفيزيائية (انتباج الغلاف) المقترنةَ بالتفاعل مع الجسم المضاد.
        يتجنّب كلمتَي «تورم» و«انتفاخ» الواردتين في التعريف.

    - lemma: "تَفَاعُلٌ مِحْفَظِيٌّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي: تَفَاعُل + مِحْفَظِيّ (نسبة إلى مِحْفَظَة — المصطلح العربي لـcapsule
        من جذر حفظ). يُبرز طبيعة الموضع (المحفظة/الغلاف) دون تحديد نوع التغيّر.
        الوزن: تَفَاعُل (مصدر الباب السادس) + نسبة مِفْعَلِيّ.

    - lemma: "تَفَاعُلُ نُوَيْفِلْد"
      generation_method: taarib
      justification: >
        مركّب إضافي: تَفَاعُل + نُوَيْفِلْد (تعريب اسم مكتشفه فريدريش نويفلد Neufeld).
        المصطلحات العلَمية الإسنادية مقبولة حين يكون المفهوم مرتبطاً تاريخياً باسم مكتشفه،
        وقد جرت العادة في المعاجم الطبية تسميةُ التفاعلات بأسماء أصحابها.

    - lemma: "اِنتِبَاجُ الغِلَافِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي: اِنتِبَاج (مصدر الظاهرة ذاتها من نبج) + الغِلَاف (بديل لـ«الكبسولة»
        من التعريف، من غَلَفَ). يصف الظاهرة المشاهدة (تضخم الغلاف) مباشرةً، لكنه أقلُّ دقةً
        دلالياً من «تفاعل الانتباج» كونه يصف الأثرَ لا التفاعل الإناعي كاملاً.


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────
stage2_evidence:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "تفاعل الانتفاخ"
      contradicts:
        - text: "«تَفاعُلُ الانْتِباج [جراثيم]» = quellung reaction"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >
            المعجم الطبي الموحد يُثبت «انتباج» لا «انتفاخ» في المصطلح المقابل لـquellung reaction،
            مما يناقض صياغة AWN الحالية ويُبيّن أن «انتفاخ» ليس المصطلح الطبي المعتمد لهذا المفهوم.
      expands:
        - text: "«انتفاخ» [علم الأحياء] = deplasmolysis"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: >
            يُظهر أن «انتفاخ» في البيولوجيا يُقابل deplasmolysis لا quellung،
            مما يدل على عدم تخصّصه للمفهوم الإناعي الكبسولي المقصود.
        - text: "«انتفاخ» [علم الأحياء] = turgidity"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: >
            يُقابل «انتفاخ» في البيولوجيا turgidity (تُرجر) لا التفاعل الإناعي الجرثومي.
        - text: "«تَوَرُّم ؛ انْتِبَاج» = oncoides"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُقرن المعجم الطبي بين «تورم» و«انتباج» كمترادفَين في سياق الأورام، لكنه يفرد
            «انتباج» للسياق التشريحي الدقيق (intumescence) دون «انتفاخ».

    # ── المرشح ١ ──
    - lemma: "تَفَاعُلُ الانْتِبَاجِ"
      confirm:
        - text: "«تَفاعُلُ الانْتِباج [جراثيم]» = quellung reaction"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَفاعُلُ الانْتِباج (انتباج محفظة الجراثيم بوجود الأضداد)» = quellung reaction"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«اخْتِبارُ الانْتِباج (في محفظة المكورات الرئوية)» = quellung test"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُثبت أن «انتباج» هو الجذر الاصطلاحي الموحَّد في هذا الحقل،
            وأنه يمتد من التفاعل (quellung reaction) إلى الاختبار (quellung test).
        - text: "«انْتِباج: تَوَرُّم عاديّ أو غير عاديّ - ناتئ الورم» = intumescence"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          addition: >
            يُؤكد أن «انتباج» هو المقابل العربي لـintumescence في علم التشريح،
            وهو وصف دقيق لانتباج محفظة الجرثوم.

    # ── المرشح ٢ ──
    - lemma: "تَفَاعُلٌ مِحْفَظِيٌّ"
      confirm:
        - text: "«تَفاعُلٌ مِحْفَظِيّ (في الجراثيم)» = capsular reaction"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«مِحْفَظَة (ال...): غشاء ليفي عادة يغشي العضو أو المفصل من الداخل» = capsule"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          addition: >
            يُثبت أن «مِحفظة» هو المصطلح التشريحي الراسخ لـcapsule، وأن «محفظي»
            نسبة صحيحة منها في الاستعمال الطبي العربي.

    # ── المرشح ٣ ──
    - lemma: "تَفَاعُلُ نُوَيْفِلْد"
      confirm:
        - text: "«تَفاعُلُ نوِيفْلِد (انتباج محفظة الجراثيم بوجود الأضداد)» = Neufeld's reaction"
          source: "المعجم الطبي الموحد (2009)"

    # ── المرشح ٤ ──
    - lemma: "اِنتِبَاجُ الغِلَافِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "تفاعل الانتفاخ"
      decision: removed
      decision_reason: >
        (١) المعجم الطبي الموحد (2009) يُثبت «تفاعل الانتباج» لا «تفاعل الانتفاخ» مقابلاً
        لـquellung reaction. (٢) «انتفاخ» (من نفخ) مصطلح فيزيائي عام يقابل heave/turgescence/
        swelling في الجيولوجيا والفيزياء ولا يختصّ بالانتباج الإناعي الكبسولي الجرثومي.
        (٣) «انتباج» (من نبج) هو المصطلح التشريحي-الطبي المعتمد لـintumescence.
        (٤) المركّب يُعيد كلمتَي التعريف (تفاعل + انتفاخ≈تورم) مما يُوقع في الدوران.
        (٥) غياب التشكيل الكامل.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── المرشح ١ ──
    - lemma: "تَفَاعُلُ الانْتِبَاجِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        أدلة قاطعة: المعجم الطبي الموحد (2009) يُثبت هذا المصطلح صراحةً بصيغتَين مقابلاً
        لـquellung reaction. «انتباج» هو المصطلح التشريحي الموحَّد لـintumescence.
        المركّب الإضافي سليم، الوحدة المعجمية ثابتة في مرجع رسمي.
        يجتاز بوابة الجودة: اطّراد (موثّق)، يُسر التداول، ملاءمة تشريحية، عربي الجذرَين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز آلية الظاهرة الفيزيائية (الانتباج) المقترنة بتفاعل إناعي —
        أدق المصطلحات الثلاثة وأشيعها في المراجع الطبية العربية الحديثة.
        هو المصطلح الوصفي المباشر الذي يصف الظاهرة نفسها.
      actions:
        - command: create_entry
          params:
            lemma: "تَفَاعُلُ الانْتِبَاجِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── المرشح ٢ ──
    - lemma: "تَفَاعُلٌ مِحْفَظِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في المعجم الطبي الموحد (2009) بوصفه «capsular reaction» في سياق الجراثيم.
        «مِحْفَظِيّ» نسبة صحيحة إلى «مِحفَظَة» (= capsule) وهو مصطلح تشريحي راسخ.
        الوزن الوصفي (تَفَاعُلٌ + نسبة فِعَلِيّ) ملائم دلالياً. يجتاز اختبار التثبيت المعجمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز موضعَ التفاعل (المحفظة/الغلاف) دون تفصيل آليته — أعمُّ من «تفاعل الانتباج»
        إذ قد يشمل تفاعلات كبسولية أخرى. مناسب في السياقات التي يُراد فيها التركيز
        على العنصر التشريحي (المحفظة) لا على طبيعة التغيّر (الانتباج).
      actions:
        - command: create_entry
          params:
            lemma: "تَفَاعُلٌ مِحْفَظِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── المرشح ٣ ──
    - lemma: "تَفَاعُلُ نُوَيْفِلْد"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في المعجم الطبي الموحد (2009) بوصفه «Neufeld's reaction» مع الوصف الكامل
        «انتباج محفظة الجراثيم بوجود الأضداد». المصطلح الإسنادي العلَمي مقبول حين يُنسَب
        إلى مكتشفه المسجَّل في الأدبيات الطبية. تعريب Neufeld إلى نُوَيْفِلْد مقبول صوتياً.
        يجتاز بوابة الجودة: ملاءمة، مسكوك في مرجع طبي رسمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        مصطلح إسنادي ينسب الظاهرة إلى مكتشفها فريدريش نويفلد — يُستخدم في السياقات
        التاريخية والسريرية الأوروبية الأصل وفي النصوص التي تُحيل إلى الأدبيات الألمانية.
        يختلف عن «تفاعل الانتباج» في أنه لا يصف الآلية بل يُسنده إلى شخص، وعن «تفاعل
        محفظي» في كونه خاصاً بهذه الظاهرة تحديداً لا أعمَّ.
      actions:
        - command: create_entry
          params:
            lemma: "تَفَاعُلُ نُوَيْفِلْد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── المرشح ٤ ──
    - lemma: "اِنتِبَاجُ الغِلَافِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوثَّق هذا المركّب في أي مرجع معجمي. يصف الأثرَ (انتباج الغلاف) لا التفاعل
        الإناعي كاملاً. يفشل اختبار التثبيت المعجمي: يمكن إبدال «الغلاف» بـ«الكبسولة» أو
        «المحفظة» ويبقى وصفاً صالحاً — إذن ليس مصطلحاً مسكوكاً.
        «تفاعل الانتباج» الموثَّق يُغني عنه.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:

  definition:
    current: "تورم الكبسولة المحيطة بالكائن الحي الدقيق بعد التفاعل مع جسم مضاد؛ أساس بعض الاختبارات لتحديد الكائنات الحية الدقيقة"
