# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-06378026-n  |  ILI: i69933  |  POS: n
# Concept: allegory (أليغوريا / حكاية رمزية)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «تمثيل» مُثقلة بتعدد المعاني: تُستخدم للقياس المنطقي ولاستعارة التشبيه البلاغي وللتمثيل المسرحي وللأيض البنائي (التمثيل الضوئي) في المعجم الوسيط، ولا تختص بدلالة الأليغوريا في أيٍّ من المعاجم الموثوقة"
      - "لمّة «أليغوريا» بدون تشكيل ودون توثيق صرفي كافٍ بوصفها مُعرَّباً"
      - "لمّة «حكاية رمزية» بدون تشكيل كامل"
      - "التعريف العربي الحالي مترجم حرفياً من الإنجليزية ولا يسير على أسلوب المعجمية العربية من حيث صياغة الجنس والفصل"
    observations: >-
      المجموعة تُمثّل مفهوم الأليغوريا البلاغي: الأسلوب الأدبي الذي يُشفِّر معانيَ
      مجردةً في شخصياتٍ وأحداثٍ حكائيةٍ رمزية. التراث البلاغي العربي يعرف ما يقترب من
      هذا الأسلوب من خلال «التمثيل» (المجاز المركب بوجه منتزع من متعدد) و«الاستعارة
      التمثيلية» لكنهما لا يُطابقانه تماماً إذ ينصبّان على صورة مركبة لا على نصٍّ سردي
      كامل. الأجدر إيثار «حكاية رمزية» لاستخدامها الموثَّق في معاجم اللسانيات الحديثة،
      والمصطلح المُعرَّب «أليغوريا» لتغطية استخدامه في النقد الأدبي المقارن. أما «تمثيل»
      فلا يُمثّل هذا المفهوم بدقة ويستوجب الحذف.

  blind_candidates:
    - lemma: "الأُمْثُولَةُ"
      generation_method: majaz
      justification: >-
        وزن أُفْعُولَة من جذر م-ث-ل؛ إحياء للفظ عربي قديم ورد في القاموس المحيط بمعنى
        الحكاية الضربية ذات المغزى («وهي الأمثولة»). يُلتمس منها المشابهة الوظيفية مع
        الأليغوريا بوصفها حكايةً تحمل معنىً خفياً وراء ظاهرها.
    - lemma: "الاسْتِعَارَةُ التَّمْثِيلِيَّةُ"
      generation_method: tarkib
      justification: >-
        مركب وصفي من جذرَي سعر (استعارة) ومثل (تمثيلية)؛ مصطلح بلاغي عربي أصيل يُعبِّر
        عن الاستعارة التي يكون وجه شبهها منتزعاً من متعدد أمور (صورة مركبة)، وهي أقرب
        المصطلحات البلاغية العربية لمفهوم الاستعارة الممتدة التي تُعدّ ركيزة الأليغوريا.
    - lemma: "التَّجْسِيدُ الإِيحَائِيُّ"
      generation_method: tarkib
      justification: >-
        مركب وصفي من جسد (التجسيد: إعطاء صورة محسوسة للمعنى المجرد) وإيحائي (الدال على
        الإيحاء والتلميح)؛ يلتقط البُعدَيْن الرئيسيَّيْن في التعريف: الخيال والتشابه الإيحائي.
    - lemma: "التَّرْمِيزُ الأَدَبِيُّ"
      generation_method: tarkib
      justification: >-
        مركب وصفي من رمز (الترميز: توظيف الرموز للتعبير عن المعاني الخفية) وأدبي؛ يُبرز
        الطابع الأدبي لهذا الأسلوب التعبيري الذي يُشفِّر الأفكار في قالب سردي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة (٥ استعلامات):
#   ١. مطابقة دفعية: أليغوريا + تمثيل + حكاية رمزية + المرشحات الأربعة
#   ٢. جسر إنجليزي: allegory / allegorical / extended metaphor / parable
#   ٣. FTS عربي: امثولة + رمزية + استعارة تمثيلية + حكاية رمزية
#   ٤. إثراء بالمعرِّف: تعريفات وأمثلة للمداخل المُجتلَبة
#   ٥. مقاييس اللغة: جذر مثل + جذر رمز (dictionary_id = 151)
stage2_evidence:
  per_lemma:

    - lemma: "أليغوريا"
      evidence_status: "no_material_found"
      # لم يُعثر على مدخل معجمي لـ«أليغوريا» أو «اليغوريا» في قاعدة البيانات.
      # المورد الحديث يُترجم «allegory» بـ«(1) مجاز (2) قصة رمزية (3) رمز» دون إيراد المعرَّب.

    - lemma: "تمثيل"
      contradicts:
        - text: >-
            «التَّمْثِيل: إِثْبَات حكم جزئي فِي جزئي آخر لِمَعْنى مُشْتَرك بَينهمَا»
          source: "معجم مقاليد العلوم للسيوطي (ت ١٥٠٥م)"
          conflict: "التمثيل هنا منطقي/أصولي (قياس) لا علاقة له بالأسلوب الأدبي الرمزي"
        - text: >-
            «التَّمْثِيل (فِي علم النَّبَات): عَملية حيوية يجريها النَّبَات الأَخْضَر مكوناً
            غذاءه العضوي من عناصر بسيطة...»
          source: "المعجم الوسيط (المعجم الكبير، ت ١٩٩٨م)"
          conflict: "الدلالة العلمية الحديثة للتمثيل الضوئي تزيد الاشتراك اللفظي وتُبعد عن دلالة الأليغوريا"
        - text: >-
            «التّمثيل: [عند أهل البيان] يُطلق على معانٍ. الأول: المجاز المركّب المسمّى
            بالمثل والتمثيل على سبيل الاستعارة... الثالث: قسم من التشبيه وهو التشبيه
            الذي وجهه منتزع من متعدّد أمرين أو أمور»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت ١٧٧٧م)"
          conflict: >-
            الاستعارة التمثيلية (التشبيه ذو الوجه المنتزع من متعدد) هي صورة بلاغية مركبة
            لا أسلوب سردي طويل؛ الأليغوريا أعمّ منها وتشمل نصاً كاملاً بشخصيات ورمزية
            متكاملة، فالمصطلحان لا يتطابقان

    - lemma: "حكاية رمزية"
      confirm:
        - text: >-
            «قصص رمزيّ: يعود أصل الاصطلاح إلى اليونان، يحيل على طريقة أدبية تقتضي الكلام
            عن شيء بالإشارة إلى غيره. وهو مجاز وتأويل لنشر وإعادة قراءة النصوص العقائدية،
            وقد تبنت البلاغة المرموز كوسيلة لتمثيل الواقع»
          source: "المعجم الموحد لمصطلحات اللسانيات — ALECSO (٢٠٠٢م)"
        - text: >-
            «(1) مَجاز / (2) قصة رمزية / (3) رمز» [ترجمة للمدخل allegory]
          source: "المورد الحديث (٢٠٠٨م)"
      expands:
        - text: >-
            «المثل: حكاية رمزية ذات مغزًى أخلاقي» [ترجمة للمدخل parable]
          source: "المورد الحديث (٢٠٠٨م)"
          addition: >-
            التمييز بين «حكاية رمزية» (allegory — أليغوريا ممتدة) و«المثَل» (parable —
            حكاية رمزية قصيرة ذات مغزى أخلاقي) يُثبت أن «حكاية رمزية» يُستخدم بالمعنى
            الأوسع الشامل للأليغوريا وليس للمثل وحده

    - lemma: "الأُمْثُولَةُ"
      contradicts:
        - text: >-
            «أُمْثُوْلَةُ النَّفْس (قُدْوَةٌ مِثالِيَّةٌ نَفْسانِيَّة)» [مقابل anagoge/anagogy]
          source: "المعجم الطبي الموحد — ALECSO (٢٠٠٩م)"
          conflict: "الأمثولة في الاستخدام المُعجمي المعاصر تُقابل «المثال النفسي/الروحي» (anagogy) لا الأليغوريا"
        - text: >-
            «وامْتَثَلَ عندَهُم مَثَلاً حَسَناً وتَمَثَّلَ: أنْشَدَ بَيْتاً ثم آخَرَ ثم آخَرَ،
            وهي الأمْثُولَةُ»
          source: "القاموس المحيط للفيروزآبادي (ت ١٤١٤م)"
          conflict: "الأمثولة في القاموس المحيط تعني إنشاد الأبيات الشعرية المتتالية، لا الحكاية الرمزية"

    - lemma: "الاسْتِعَارَةُ التَّمْثِيلِيَّةُ"
      expands:
        - text: >-
            «التّمثيل [عند أهل البيان]: قسم من التشبيه وهو التشبيه الذي وجهه منتزع من
            متعدّد أمرين أو أمور... والاستعارة يجب أن يكون لفظ المشبّه به المستعمل في
            المشبّه»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت ١٧٧٧م)"
          addition: >-
            يكشف المصدر عن وجود المفهوم البلاغي للاستعارة التمثيلية في التراث العربي لكنها
            مقيَّدة بصورة مركبة ذات وجه منتزع من متعدد، لا بنصٍّ سردي طويل كامل

    - lemma: "التَّجْسِيدُ الإِيحَائِيُّ"
      evidence_status: "no_material_found"

    - lemma: "التَّرْمِيزُ الأَدَبِيُّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "أليغوريا"
      decision: confirmed
      decision_reason: >-
        المعرَّب «أليغوريا» راسخ في الكتابة النقدية الأدبية العربية المعاصرة للإشارة إلى
        النوع الأدبي الغربي المُسمَّى allegory. لا توجد مفردة عربية واحدة تؤدي هذه الدلالة
        بدقة: الأمثولة لا تُطابقه (تعني anagogy أو إنشاد الشعر)، والمثل أضيق منه، وحكاية
        رمزية عبارة لا مفردة. اشتقاقية «أليغوريا»: تقبل لام التعريف (الأليغوريا)، والنسبة
        (أليغوري)، والجمع بالواو والنون أو الألف والتاء (أليغوريات). يُقترح تحقيق تشكيله.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: taarib
        status: مقبول
        note: "يقبل لام التعريف والنسبة والجمع السالم، وقد جرى استخدامه في النقد الأدبي العربي المعاصر"
      term_quality:
        consistency: "مطّرد في الاستخدام النقدي الأدبي"
        ease_of_use: "مقبول لاختصاره مقارنةً بالعبارة المركبة"
        fit: "يلائم السياق الأدبي المقارن"
        native_preference: "لا يوجد بديل عربي مُفرد مُثبَّت"
        arabic_preference: "حكاية رمزية أفضل للسياق العربي العام"
        derivability: "اشتقاقي محدود (تعريب)"
      nuance_differentiation: >-
        يُستخدم تحديداً في الخطاب النقدي الأدبي المقارن والترجمي للإشارة إلى النوع الأدبي
        الأوروبي المُسمَّى allegory، وكثيراً ما يُقترن بأعمال بعينها كفارم الحيوانات
        وكوميديا دانتي الإلهية. له طابع اصطلاحي أكاديمي غربي المرجعية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَلِيغُورِيَا"

    - lemma: "تمثيل"
      decision: removed
      decision_reason: >-
        لا يُؤدي «تمثيل» دلالةَ الأليغوريا في أيٍّ من المعاجم الموثوقة. معانيه المُثبَتة
        هي: (١) القياس المنطقي/الأصولي، (٢) الاستعارة التمثيلية بوصفها صورةً بلاغية مركبة
        لا نصاً سردياً، (٣) التمثيل المسرحي/الأدائي (المعنى الحديث السائد)، (٤) التمثيل
        الضوئي في علم النبات. لم يرد «تمثيل» في معاجم ALECSO ولا المورد الحديث مقابلاً
        للـ allegory. الإبقاء عليه يُفضي إلى التباس خطير مع المعاني السائدة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حكاية رمزية"
      decision: confirmed
      decision_reason: >-
        «حكاية رمزية» (أو صيغتها المرادفة «قصة رمزية») موثَّقة في معجم اللسانيات ALECSO
        ٢٠٠٢م والمورد الحديث ٢٠٠٨م كمقابل مباشر للـ allegory. تُجمع بين بُعد السرد
        (حكاية) وبُعد الترميز (رمزية)، وهي مُعبِّرة عن المفهوم بصورة شفافة. مركبٌ إضافي
        وصفي ثابت الاستخدام في الكتابة الأكاديمية العربية. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        التعبير العربي الأصيل الذي يُبرز بنيةَ الحكاية السردية (حكاية) وطابعها الرمزي
        (رمزية) معاً. يُستخدم بشكل أوسع لوصف هذا الأسلوب في أيّ أدب أو ثقافة، ولا يرتبط
        بالموروث الأدبي الغربي تحديداً خلافاً للمصطلح المُعرَّب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِكَايَةٌ رَمْزِيَّةٌ"

    - lemma: "الأُمْثُولَةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        الأمثولة في الاستخدام المعجمي المُوثَّق تعني إما «المثال النفسي/الروحي» (anagogy)
        في المعجم الطبي الموحد، أو إنشاد الأبيات الشعرية المتتالية في القاموس المحيط.
        لا يُؤيد أيٌّ من المصادر ربطَها بالأليغوريا بوصفها أسلوباً سردياً رمزياً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الاسْتِعَارَةُ التَّمْثِيلِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        الاستعارة التمثيلية في البلاغة العربية هي صورة مركبة (تشبيه ذو وجه منتزع من
        متعدد) لا نصٌّ سردي طويل. فضلاً عن ذلك، لم تُوجَد كمدخل مُعجمي مستقل ثابت
        في قاعدة البيانات. الفارق الجوهري: الأليغوريا تشمل نصاً بأكمله، بينما الاستعارة
        التمثيلية هي صورة واحدة ضمن النص.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "التَّجْسِيدُ الإِيحَائِيُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا شواهد معجمية. التعبير وصفي حر يخفق في اختبار السكّ: يمكن إبدال «إيحائي» بـ
        «رمزي» أو «دلالي» فيبقى وصفاً صالحاً، مما يُثبت أنه ليس مصطلحاً مسكوكاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "التَّرْمِيزُ الأَدَبِيُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا شواهد معجمية. «الترميز الأدبي» أوسع دلالةً من الأليغوريا إذ يشمل كل أشكال
        الرمزية في الأدب. يخفق في اختبار الاختصاص: «الترميز الشعري» أو «الترميز السردي»
        وصف متساوٍ في الصحة مما يُثبت افتقاره للتثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "أسلوب تعبيري يستخدم شخصيات وأحداث خيالية لوصف موضوع ما عن طريق التشابهات الإيحائية؛ استعارة ممتدة"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة حرفية شبه مباشرة للإنجليزية («an expressive style that uses
        fictional characters and events...»). يفتقر إلى: (١) الجنس القريب المُحدَّد من خلال
        التصنيف الأدبي، (٢) التمييز بين الظاهر السردي والباطن الدلالي وهو جوهر الأليغوريا،
        (٣) الأسلوب المعجمي العربي. كذلك يستخدم «يستخدم» وهي أقل دقةً من «يُوظِّف».
    authored:
      - type: terminological
        text: >-
          أُسْلُوبٌ أَدَبِيٌّ يُوَظِّفُ شَخْصِيَّاتٍ وَأَحْدَاثاً خَيَالِيَّةً حَامِلَةً
          لِمَعَانٍ رَمْزِيَّةٍ إِيحَائِيَّةٍ، يَتَجَاوَزُ فِيهِ ظَاهِرُ السَّرْدِ إِلَى
          حَقَائِقَ مُجَرَّدَةٍ أَوْ قِيَمٍ كُلِّيَّةٍ تَكْشِفُهَا الْمُشَابَهَاتُ
          الرَّمْزِيَّةُ؛ وَهُوَ اسْتِعَارَةٌ مُمْتَدَّةٌ تَشْمَلُ النَّصَّ كُلَّهُ أَوْ
          جُلَّهُ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
