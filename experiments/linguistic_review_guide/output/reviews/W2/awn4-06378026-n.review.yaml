          maqayis_quote: >-
            لم يُوجَد مدخل «حكي» في مقاييس اللغة لابن فارس ضمن نتائج الاستعلام
            — يُحتمل ورود الجذر تحت «حكى» بالألف المقصورة
        - word: "رمزية"
          root: "رمز"
          maqayis_quote: >-
            «الرَّاءُ وَالْمِيمُ وَالزَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَرَكَةٍ
            وَاضْطِرَابٍ. يُقَالُ كَتِيبَةٌ رَمَّازَةٌ: تَمُوجُ مِنْ نَوَاحِيهَا»

  per_sense:
    - lemma: "أَلِيغُورِيَا"
      sense_id: "{auto}"
      nuance: >-
        يُستخدم تحديداً في الخطاب النقدي الأدبي المقارن والترجمي للإشارة إلى النوع
        الأدبي الغربي المُسمَّى allegory؛ يحمل دلالةً أكاديميةً ذات مرجعية ثقافية
        أوروبية، ويُفضَّل في السياق النقدي الذي يستدعي التمييز بين هذا الشكل
        الأدبي وما يقاربه في الموروث العربي.
