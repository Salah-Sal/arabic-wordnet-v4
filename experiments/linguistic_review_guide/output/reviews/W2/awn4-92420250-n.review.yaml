# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — بناءً على الملف المُقنَّع فقط
  # التعريف المرئي: "جودة الارتباط بتنظيم وتحديد وتفسير المعلومات الحسية"
  # الفائق الدلالي: "خاصّيّة أساسيّة مشتركة بين جميع أفراد صنف ما"
  # المفهوم: الصفة الجوهرية المتعلقة بمعالجة المعلومات الحسية وتفسيرها (perceptual quality)

  blind_candidates:
    - lemma: "إِدْرَاكِيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي من "إِدْرَاك" (جذر: درك) على وزن فِعَالِيَّة.
        الإدراك هو بلوغ الشيء وحصوله في النفس، ومن ثَمَّ "إِدْرَاكِيَّة" هي صفة كل ما يتعلق
        بهذا البلوغ والتحصيل من تنظيم المعلومات الحسية وتصنيفها وتفسيرها.
        الوزن (-يَّة) المصدر الصناعي مناسب لتحويل الوصف إلى مفهوم مجرد جامع.

    - lemma: "حِسِّيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي من "حِسّ" (جذر: حسس) على وزن فِعِّيَّة.
        الحِسُّ هو القوة المُدرِكة الأولية؛ و"حِسِّيَّة" جودة الاتصال بالحواس والاستجابة
        لمنبّهاتها. تستحضر الطابع الحسي المذكور في التعريف (المعلومات الحسية).

    - lemma: "مَعْرِفِيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي من "مَعْرِفَة" (جذر: عرف) على وزن مَفْعِلِيَّة.
        المعرفة تستلزم التمييز والتحديد والتفسير — وهي العناصر الثلاثة الواردة
        في التعريف (تنظيم، تحديد، تفسير). تُوافق الإنجليزية "cognitive".

    - lemma: "إِحْسَاسِيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي من "إِحْسَاس" (جذر: حسس) على وزن إِفْعَالِيَّة.
        الإحساس مرحلة الاستقبال الحسي الأولى التي تسبق التنظيم والتفسير؛
        تُشير إلى صفة الاستجابة للمثيرات الحسية قبل بلوغ مرحلة الإدراك التفسيري.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الموجودة «إدراكية» تفتقر إلى تشكيل كامل — يجب تحديثها إلى إِدْرَاكِيَّة."
      - "التعريف الحالي «جودة الارتباط بتنظيم وتحديد وتفسير المعلومات الحسية» صياغة ترجمية
         حرفية من الإنجليزية («quality of pertaining to…»)؛ عبارة «جودة الارتباط» ركيكة
         معجمياً ولا تلاءم أسلوب المعجم الوسيط."
      - "المجموعة تضم لمّة واحدة فقط، مما قد يُفضي إلى فقر ترادفي في السياقات المتخصصة
         (علم النفس المعرفي، اللسانيات، الطب النفسي)."
    observations: >
      المجموعة تُجسِّد مفهوماً نفسياً-معرفياً حديثاً يُعبِّر عن الصفة الجوهرية المتعلقة
      بمعالجة المعلومات الواردة عن الحواس وتنظيمها وتفسيرها (perceptual quality / perceptiveness).
      اللمّة "إدراكية" مشتقة اشتقاقاً سليماً من الجذر "درك" الذي يدور حول معنى "لحوق الشيء
      بالشيء ووصوله إليه"، وقد وردت في المعجم الطبي الموحد (2009) بما يقابل "perceptiveness"
      و"perceptivity" في الإنجليزية، كما استُعملت صيغة النسبة منها (إدراكيّ) بمعنى "perceptual"
      في المعجم الطبي ومعجم اللسانيات. ومن ثَمَّ فإن إِدْرَاكِيَّة هي الخيار الأدق والأوثق.
      اللمّات المرشّحة الأخرى (حسية، معرفية، إحساسية) تتقاطع مع المفهوم لكن لا تعادله:
      فـ"حسية" تُركّز على الطرف الحسي الخام، و"معرفية" أشمل وتطال المنظومة الذهنية كلها،
      و"إحساسية" تتضمن معنى الحساسية الوجدانية الذي يُبعدها عن الدقة المطلوبة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: نُفِّذت الاستعلامات التالية (٤ استعلامات):
  # ١. مطابقة دفعية لـ: إدراكية، إدراك، حسية، حس، معرفية، إحساسية + صيغ ال-
  # ٢. جسر إنجليزي: perceptual, perceptiveness, cognitive, perception, sensory perception
  # ٣. FTS عربي: إدراك، حسي، تفسير، معلومات حسية، ادراكي
  # ٤. مقاييس اللغة لابن فارس (dictionary_id=151) — جذر درك

  per_lemma:

    - lemma: "إِدْرَاكِيَّة"
      confirm:
        - text: "«إِدْراكِيَّة» — translation_en: perceptiveness"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إِدْراكِيَّة» — translation_en: perceptivity"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«إِدْراكِيّ» — translation_en: perceptual"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُثبّت أن الاشتقاق الكامل (إدراكي / إدراكية) راسخ في المصطلحية الطبية الموحّدة."
        - text: "«إِدْراكيّ» — translation_en: cognitive — كُلّ عملية تقتضي الإلمام بمقاييس ترتيب المقولات السِّيمية التي تحدد العالم السيمانتيكي، قصد تسهيل التعرف على معنى (تعييني / مفهومي) يرتبط بالقيم العاطفية."
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يوسّع الاستخدام ليشمل السياق اللساني، مما يُثري نطاق اللمّة."
        - text: "«الإدراك: إحاطة الشيء بكماله.»"
          source: "كتاب التعريفات للشريف الجرجاني (ت. 1413م)"
          addition: "يُؤسِّس المعنى الجذري: الإدراك هو الشمول والإحاطة — مما يجعل «الإدراكية» صفةَ ما يُحيط بالشيء ويستوعبه."
        - text: "«الإدراك: هو حصول الصورة عند النفس الناطقة.»"
          source: "كتاب التعريفات للشريف الجرجاني (ت. 1413م)"
          addition: "يُحدِّد الطابع الذهني للإدراك: تحصّل الصورة في النفس، وهو ما تُعبِّر عنه الإدراكية كصفة."
        - text: "«الإدراك: تمثيل حقيقة الشيء وحده من غير حكم عليه بنفي أو إثبات، ويسمى تصوراً، ومع الحكم بأحدهما يسمى تصديقاً.»"
          source: "كتاب التعريفات للشريف الجرجاني (ت. 1413م)"
          addition: "يُميِّز بين طوري الإدراك (التصور والتصديق)، مما يُعمِّق الطابع المعرفي للمصطلح."
        - text: "«أتمتة إدراكية» — استخدام تقنيات الذكاء الاصطناعي لأتمتة المهام التي تتطلب قدرات إدراكية بشرية. — translation_en: Cognitive Automation"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "يُجسِّد استخدام «إدراكي/إدراكية» في المصطلحية التقنية الحديثة."
        - text: "«إدراك الدوْر» — عملية تحقيق وعي أو فهم للبيئة من خلال تنظيم المعلومات الحسية وتفسيرها. — translation_en: role perception"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "التعريف يحوي المكوّنَيْن الأساسيَّيْن للمفهوم (تنظيم المعلومات الحسية + تفسيرها) مما يصل به مباشرةً بتعريف المجموعة."

    - lemma: "حِسِّيَّة"
      expands:
        - text: "«الحواسُّ: السَّمْعُ، والبَصَرُ، والشَّمُّ، والذَّوْقُ، واللمْسُ، جمعُ حاسَّةٍ.»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يُؤسِّس المرجعية اللغوية للجذر حسس، لكن «حسية» كصفة مجردة لا تُفيد التنظيم والتفسير."
        - text: "«الحِسُّ: القوة المدركة النفسانية.»"
          source: "كشاف اصطلاحات الفنون (منقول عن بحر الجواهر)"
          addition: "يُبيِّن أن «الحِسّ» يتضمن بُعداً إدراكياً، لكنه يبقى أضيق من «الإدراكية» التي تعالج التنظيم والتفسير."

    - lemma: "مَعْرِفِيَّة"
      evidence_status: "no_material_found"

    - lemma: "إِحْسَاسِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ─── اللمّة الموجودة ───────────────────────────────────────
    - lemma: "إدراكية"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في المعجم الطبي الموحد (2009) بما يقابل "perceptiveness" و"perceptivity"
        في الإنجليزية مباشرةً، وهما المعنيان المطلوبان للمجموعة. الجذر "درك" راسخ في المعجمية
        العربية، والمصدر الصناعي (-يَّة) هو المسلك الاشتقاقي الأنسب لتحويل الصفة إلى مفهوم
        مجرد. التوثيق متعدد المصادر (طبي، لساني، تقني) يُثبّت التداول المصطلحي.
        اللمّة تحتاج إلى تشكيل كامل فقط.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُبرز البُعد التنظيمي-التفسيري للإدراك الحسي
        (organizing + identifying + interpreting sensory information) في مقابل:
        - حِسِّيَّة: تنصبّ على الطرف الحسي الخام (raw sensation) دون التفسير.
        - مَعْرِفِيَّة: أشمل، تُغطي المنظومة الذهنية كلها بما فيها الذاكرة واللغة والتفكير.
        - إِحْسَاسِيَّة: تنزع نحو الحساسية الوجدانية أكثر من الإدراك الموضوعي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِدْرَاكِيَّة"

    # ─── مرشحات المرحلة ١ ──────────────────────────────────────
    - lemma: "إِدْرَاكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المرشّح مطابق للمّة الموجودة "إدراكية" بعد التصحيح المقترح؛ ليس إضافةً مستقلة.
        تمت معالجته ضمن اللمّة الموجودة أعلاه.

    - lemma: "حِسِّيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        "حِسِّيَّة" تُعبِّر عن الصفة الحسية الأولية (raw sensory quality) وتنصبُّ
        على الطرف الحسي المجرد دون التضمين الإدراكي التنظيمي-التفسيري. التعريف يُصرِّح بأن
        المفهوم يشمل "تنظيم وتحديد وتفسير" المعلومات — وهي مراحل ما بعد الحس الخام.
        فضلاً عن أن "حسية" لم تُوثَّق كصفة مجردة قائمة بذاتها في المعاجم المتاحة
        بالمعنى المقصود هنا، بل وردت في سياق الجمع (الحواسّ) والوصف (حسيّ).
      evidence_assessment:
        case: no_material

    - lemma: "مَعْرِفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        "مَعْرِفِيَّة" مصطلح أشمل يُغطي المنظومة المعرفية الذهنية بأكملها (cognitive)
        بما فيها اللغة والذاكرة والتخطيط والتفكير المجرد. المجموعة تُحدِّد نطاقها
        بـ"المعلومات الحسية" تحديداً — وهو ما يُميِّز الإدراكية الحسية عن المعرفية العامة.
        لا أدلة معجمية تُثبِّت استخدام "معرفية" بالمعنى المضيَّق المطلوب.
      evidence_assessment:
        case: no_material

    - lemma: "إِحْسَاسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        "إِحْسَاسِيَّة" تنزع نحو معنى الحساسية الوجدانية أو الاستجابة الانفعالية
        (sensibility / sensitivity) في الاستخدام الفصيح المعاصر، لا الإدراك الحسي المعرفي.
        الجذر "حسس" محتمَل، لكن الوزن الاشتقاقي "إِفْعَالِيَّة" يُجنِّح المصطلح
        نحو فاعلية الإحساس لا جودة الاتصال بالمنظومة الحسية. لا أدلة تُثبّته.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
