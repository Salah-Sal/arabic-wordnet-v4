# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "نسخ"
      decision: confirmed
      decision_reason: >
        المصطلح راسخ ومُعتمَد في المعجمية العلمية العربية المعاصرة: الوراثة، البيطرة، AGROVOC.
        يستند إلى الجذر العربي الأصيل ن-س-خ بدلالته الكلاسيكية (نقل المحتوى أميناً من وعاء إلى
        آخر) مما يجعل توظيفه للعملية الجزيئية توظيفاً مجازياً طبيعياً مُسوَّغاً. لا يوجد مرشح
        بديل موثَّق بنفس درجة الرسوخ. يلزم إضافة التشكيل الكامل: نَسْخ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: >
        مصدر فَعَلَ على وزن فَعْل (نَسَخَ → نَسْخ)؛ الوزن قياسي للمصادر الدالة على حدث مقطعي
        محدد. يناسب التسمية الاصطلاحية للعمليات البيولوجية ذات الحدث الواحد المستمر.
      borrowing_check:
        lexical_borrowing: "لفظ عربي أصيل، لا اقتراض"
        calque_check: "مُقابَلة تحليلية لـ transcription لكنها قائمة على جذر عربي حقيقي لا على بنية مستعارة"
        semantic_accuracy: >
          transcription (من trans-scribere = الكتابة عَبر) تُقابَل بـ نَسْخ (النقل الأمين من مصدر
          إلى آخر)؛ المطابقة الدلالية وثيقة ومُسوَّغة
      quality_gate:
        consistency: "مستعمَل في معاجم متعددة بصيغة موحدة"
        ease_of_use: "أحادي المقطع الصرفي، سهل النطق والاشتقاق"
        appropriateness: "ملائم للسياق العلمي"
        heritage_preference: "جذر تراثي أصيل"
        arabic_preference: "عربي غير مُعرَّب"
        derivability: "يشتق منه: ناسخ، منتسِخ، استنساخ، نُسْخة، ناسخة الرنا (RNA polymerase)"
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة. تتمايز دلالياً عن: الاستنساخ (replication = تضاعف الدنا إلى
        دنا)، والترجمة (translation = تحويل الرنا إلى بروتين)، والنسخ العكسي (reverse transcription
        = رنا → دنا)؛ إذ تُحدِّد تحديداً دقيقاً مرحلة دنا → رنا مرسال في التعبير الجيني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَسْخ"

    - lemma: "إِمْلَاءٌ جِيني"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية في المعاجم المتخصصة على هذا التوظيف. لا يجتاز اختبار التثبيت المعجمي.
        المصطلح الراسخ «نسخ» يُغني عنه تماماً.
      evidence_assessment:
        case: no_material

    - lemma: "اسْتِنْطَاقٌ وِرَاثِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        مصطلح الاستنطاق محتجَز في الاستعمال القانوني (المعجم الموحد للقانون). توظيفه في الوراثة
        ينشئ تداخلاً مصطلحياً. لا شواهد في الحقل الجيني ولا في المعاجم العلمية.
      evidence_assessment:
        case: contradicts_only

    - lemma: "اسْتِكْتَابٌ جِيني"
      source: stage1
      decision: removed
      decision_reason: >
        التوليد الاشتقاقي سليم صرفياً لكن المصطلح غير موثَّق في أي معجم علمي متخصص.
        لا يُجاوز مرتبة الوصف الحر إلى الاصطلاح المثبَّت. «نسخ» القائم يُغني عنه.
      evidence_assessment:
        case: no_material

    - lemma: "قِرَاءَةٌ جِينِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد في المعاجم المتخصصة. لا يجتاز اختبار السكّ: يمكن إبدال «جينية» بـ«وراثية» أو
        «خلوية» ويبقى التعبير وصفياً صالحاً، دليل على أنه ليس وحدة معجمية ثابتة.
        «نسخ» القائم يُغني عنه.
      evidence_assessment:
        case: no_material


