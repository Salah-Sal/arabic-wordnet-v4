        (٢) ازدواج غير مُضيف — الجملتان تصفان العملية ذاتها من زاويتين ولا تُضيف الثانية
        معلومة مستقلة فعلاً. (٣) «العملية العضوية» ترجمة حرفية لـ organic process؛
