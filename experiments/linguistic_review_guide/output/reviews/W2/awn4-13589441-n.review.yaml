# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة «نسخ» خالية من التشكيل الكامل؛ الصواب «نَسْخ» (مصدر فَعَلَ على وزن فَعْل)"
      - "التعريف العربي الحالي يحتوي على الفعل «نسخ» لتعريف الاسم «نسخ» مما يُوقع في الدوران اللغوي"
      - "التعريف مزدوج ومتكرر: الجملتان تصفان العملية ذاتها من زاويتين دون إضافة معلومة جديدة في الثانية"
      - "مصطلح «نسخ» متعدد الدلالات (نسخ الكتب، النسخ الشرعي، النسخ الجيني) ولا يوجد تمييز سياقي كافٍ في المدخل"
    observations: >
      المصطلح «نسخ» في سياق علم الوراثة الجزيئية راسخ ومُعتمَد في المعاجم العربية المتخصصة
      (المعجم الموحد لمصطلحات علم الوراثة 2009، المكنز الزراعي AGROVOC، الطب البيطري 2010).
      يقوم التوظيف الاصطلاحي على الدلالة اللغوية الأصيلة للجذر ن-س-خ التي يصفها ابن فارس
      بأنها «تحويل شيء إلى شيء» مما يُسوِّغ توظيفه للعملية الجزيئية دنا→رنا. التعريف بحاجة إلى
      مراجعة لإزالة الدوران وتوحيد الجملتين، وتفتقر المجموعة إلى مثال استعمالي.

  blind_candidates:
    - lemma: "إِمْلَاءٌ جِيني"
      generation_method: majaz
      justification: >
        مجاز وظيفي: يُشبَّه الحمض النووي بالمُمْلي والبوليميريز بالكاتب والرنا المرسال بالمستملَى.
        الإملاء هو إلقاء النص على كاتبٍ يدوِّنه، وهو ما يحدث وظيفياً في توليد سلسلة الرنا
        على قالب الدنا. الجذر م-ل-و/م-ل-ي راسخ في العربية وفعل «أملى» له دلالة التحميل
        والإيداع.
    - lemma: "اسْتِنْطَاقٌ وِرَاثِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من الاستنطاق (Form X من ن-ط-ق = استخلاص الكلام) ووراثي (نسبة إلى الوراثة).
        «استنطق الجين» أي استخلص معلومته الوراثية في صورة رنا؛ الخلية تُجبر خيط الدنا على
        الإفصاح عما يحمله من شفرة.
    - lemma: "اسْتِكْتَابٌ جِيني"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن استفعال من الجذر ك-ت-ب؛ «استكتبَه» = طلب منه أن يكتب أو أملى عليه.
        يصف العملية من حيث إن الخلية «تستكتب» الجينوم لإنتاج سلسلة رنا مكتوبة.
        الوزن يناسب المفاهيم التي تنطوي على طلب أو استدعاء عملية.
    - lemma: "قِرَاءَةٌ جِينِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي: إنزيم بوليميريز الرنا «يقرأ» قالب الدنا قاعدةً بقاعدة لإنتاج سلسلة الرنا،
        تماماً كما يُقرأ نص خطياً لاستخلاص مضمونه. الجذر ق-ر-أ وثيق الصلة بمفهوم استنطاق
        التسلسل الخطي للمعلومات.


