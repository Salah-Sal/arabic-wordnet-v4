stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - غياب المرادفات الشائعة في المجالات التقنية والنفسية (مثل إزالة الحساسية والتبليد).
    observations: "المفهوم (desensitization) يغطي مجالات طبية ونفسية وتقنية، واللمة الحالية 'إزالة التحسس' تمثل الجانب الطبي المناعي بشكل أساسي."
  blind_candidates:
    - lemma: "إِزَالَةُ التَّحَسُّسِ"
      generation_method: tarkib
      justification: "الترجمة المعتمدة في المعاجم الطبية (المعجم الطبي الموحد) لمفهوم desensitization."
    - lemma: "إِزَالَةُ الحَسَّاسِيَّةِ"
      generation_method: tarkib
      justification: "مصطلح شائع الاستخدام في الفيزياء والطب والكهرباء."
    - lemma: "تَقْلِيلُ الحَسَّاسِيَّةِ"
      generation_method: tarkib
      justification: "تعبير وصفي دقيق يطابق التعريف الإنجليزي 'reducing sensitivity'."
    - lemma: "تَبْلِيد"
      generation_method: ishtiqaq
      justification: "يُستخدم في علم النفس للتعبير عن عملية تقليل الاستجابة الانفعالية (systematic desensitization)."

stage2_evidence:
  per_lemma:
    - lemma: "إزالة التحسس"
      confirm:
        - text: "«إِزالَةُ التَّحَسُّس (desensitization)»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "إزالة الحساسية"
      confirm:
        - text: "«إزالة الحساسية (desensitization)»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«إزالة الحساسية: عملية تقليل أو التخلص من حساسية جهاز أو مادة.»"
          source: "موسوعة الكهرباء (IEC 60050)"
    - lemma: "نقص الحساسية"
      expands:
        - text: "«نقص الحساسية (desensitization)»"
          source: "المورد الحديث (2008)"
          addition: "يستخدم 'نقص' كمرادف لإزالة في سياق التقليل."
    - lemma: "تبليد"
      expands:
        - text: "«تبلد: صار بليدا وتصنع البلادة»"
          source: "المعجم الوسيط"
          addition: "يُشتق منه التبليد (جعله بليداً) في سياق تبليد المشاعر."

stage3_analysis:
  per_lemma:
    - lemma: "إِزَالَةُ التَّحَسُّسِ"
      decision: confirmed
      decision_reason: "مصطلح طبي تقني دقيق ومعتمد في المعاجم المتخصصة."
