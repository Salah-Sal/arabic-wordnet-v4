            synset_id: "awn4-13484458-n"
    - lemma: "تَقْلِيلُ الحَسَّاسِيَّةِ"
      source: stage1
      decision: confirmed
      decision_reason: "يتسق تماماً مع التعريف اللغوي للمجموعة ويشيع في السياقات العلمية العامة."
      evidence_assessment:
        case: no_material
      mwe_check:
