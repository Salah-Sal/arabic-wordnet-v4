stage4_content:
  definition:
    current: "عملية تقليل الحساسية"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً؛ يفضل تعريفه بأسلوب اصطلاحي يشمل الجوانب الطبية والنفسية والتقنية."
    authored:
      - type: terminological
        text: "عملية إضعاف استجابة كائن حي أو جهاز لمؤثر معين، سواء كانت استجابة مناعية أو نفسية أو فيزيائية، من خلال التعرض المتكرر أو المعالجة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13484458-n"
          definition_index: 0
          text: "عملية إضعاف استجابة كائن حي أو جهاز لمؤثر معين، سواء كانت استجابة مناعية أو نفسية أو فيزيائية، من خلال التعرض المتكرر أو المعالجة."
  examples:
    per_lemma:
      - lemma: "إِزَالَةُ التَّحَسُّسِ"
        examples:
          - text: "يخضع المريض لجلسات إزالة التحسس للتخلص من الحساسية الموسمية."
            type: usage
      - lemma: "إِزَالَةُ الحَسَّاسِيَّةِ"
        examples:
          - text: "تتطلب معايرة الأجهزة الدقيقة إزالة الحساسية الزائدة تجاه الضوضاء المحيطة."
            type: usage
      - lemma: "تَبْلِيد"
        examples:
          - text: "يُستخدم التبليد المنهجي في العلاج السلوكي لتقليل خوف المريض من الأماكن المرتفعة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-13484458-n"
          text: "تهدف عملية إزالة التحسس إلى تقليل رد فعل الجسم المفرط تجاه مادة معينة."

