step0_evidence:
  per_lemma:
    - lemma: "رَائِد"
      confirm:
        - text: "«الرائد: من يتقدم القوم يبصر لهم الكلأ ومساقط الغيث»"
          source: "المعجم الوسيط"
        - text: "«الرسول مقدمة الشيء؛ وفي الخبر: الحمى رائد الموت أي مقدمته»"
          source: "المعجم الكبير"
        - text: "«من يقدم - غير مسبوق - على عمل فيمهد الطريق لمن بعده كرائد الفضاء»"
          source: "المعجم الكبير"
    - lemma: "سَابِق"
      confirm:
        - text: "«السابق: المتقدم في الخير»"
          source: "المعجم الوسيط"
        - text: "«السابق: [في الإنكليزية] Predecessor»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "سَلَف"
      confirm:
        - text: "«السلف: التقدم»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«كل من تقدمك من آبائك وذوي قرابتك في السن أو الفضل»"
          source: "المعجم الوسيط"
        - text: "«كل من شغل منصبا قبل من يشغله حاليا»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مُهَمِّد"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "طَلِيعَة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«طَلِيعَة: من الجيش ونحوه أول ما يطلع ومقدمته» — المعجم الوسيط"
    - lemma: "بَشِير"
      source_section: "step5_english_bridge"
      evidence_citation: "«البشير: مركبات تشتق منها مركبات ذات تأثير فعال تأتي في مرحلة تالية لها (Precursor)» — المعجم الموحد لمصطلحات علم الصيدلة"
    - lemma: "بَادِر"
      source_section: "step5_english_bridge"
      evidence_citation: "«البادر: شيء يمهد ظهوره لظهور غيره» — المورد الحديث"
  knowledge_candidates:
    - lemma: "مُمَهِّد"
      justification: "اشتقاق من مهد (مهد الطريق): من يقوم بتمهيد السبيل لمن يأتي بعده، وهو المعنى الدقيق لرائد/precursor."
  generation_notes: "تبين أن 'مهمد' الواردة في اللمات الأصلية هي على الأرجح تصحيف لـ 'ممهد' أو 'مهمد' (من همد) التي لا تناسب السياق."

step1_lemma_validation:
  per_lemma:
    - lemma: "رَائِد"
      decision: confirmed
      decision_reason: "مصطلح أصيل يعبر عن المتقدم الذي يستكشف الطريق ويمهد لمن بعده."
      evidence_assessment:
        case: "confirm_only"
      nuance_differentiation: "يركز على وظيفة الاستكشاف والتمهيد وفتح آفاق جديدة."
      example: "كان هذا العالم رائداً في مجال الفيزياء النووية."
    - lemma: "سَابِق"
      decision: confirmed
      decision_reason: "يدل على الأسبقية الزمنية أو الرتبوية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على مجرد الأسبقية في الزمن أو الحدث دون ضرورة التمهيد."
      example: "المدير السابق هو من وضع حجر الأساس لهذه المنشأة."
    - lemma: "سَلَف"
      decision: confirmed
      decision_reason: "مصطلح معجمي ثابت لمن تقدم في المنصب أو القرابة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يغلب استعماله في سياق الأجداد (الأسلاف) أو من شغل منصباً حكومياً أو إدارياً قبل الحالي."
      example: "لقد ورثنا هذه القيم عن السلف الصالح."
    - lemma: "مُهَمِّد"
      decision: removed
      decision_reason: "لا يوجد دليل معجمي يؤكد استعمال 'مهمد' (من هـ م د) بهذا المعنى، والأرجح أنها تصحيف لـ 'ممهد'."
      evidence_assessment:
        case: "no_material"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "طَلِيعَة"
      source: step05
      decision: confirmed
      decision_reason: "من أقوى المرادفات لـ precursor وforerunner في السياق العسكري والفكري والعلمي."
      step05_citation: "«الطليعة: من الجيش ونحوه أول ما يطلع ومقدمته» — المعجم الوسيط"
      nuance_differentiation: "تعني الجزء الأول الذي يظهر من شيء ما (مثل طليعة الجيش أو طليعة النهضة)."
      example: "هذه القصيدة هي طليعة الشعر الحديث في أدبنا."
      actions:
        - command: create_entry
          params:
            lemma: "طَلِيعَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09650305-n"
    - lemma: "مُمَهِّد"
      source: step05
      decision: confirmed
      decision_reason: "بديل صحيح وموثق للمة 'مهمد' المصحفة، ويناسب تماماً معنى 'رائد'."
      step05_citation: "«المُمَهَّد: المُهَيَّأُ المُسَوَّى» — المعجم الوسيط"
      nuance_differentiation: "يركز على فعل 'التوطئة' وتسهيل الأمور لمن سيأتي لاحقاً."
      example: "كانت هذه الاكتشافات ممهداً للثورة الصناعية."
      actions:
        - command: create_entry
          params:
            lemma: "مُمَهِّد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09650305-n"
    - lemma: "بَشِير"
      source: step05
      decision: confirmed
      decision_reason: "تستخدم في السياق العلمي (Precursor) وفي السياق اللغوي لمن يعلن عن قدوم شيء."
      step05_citation: "«البشير: مركبات تشتق منها مركبات ذات تأثير فعال تأتي في مرحلة تالية لها» — المعجم الموحد لمصطلحات علم الصيدلة"
      nuance_differentiation: "تركز على جانب 'الإعلان' أو 'التبشير' بقدوم الشيء (خاصة إذا كان خيراً)."
      example: "هذا الجزيء هو بشير لهرمون النمو في الجسم."
      actions:
        - command: create_entry
          params:
            lemma: "بَشِير"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09650305-n"

