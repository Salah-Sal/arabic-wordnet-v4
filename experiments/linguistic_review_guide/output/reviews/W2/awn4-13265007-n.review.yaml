# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "جميع اللمّات الموجودة في المجموعة صيغُ جمعٍ (أملاك، مقتنيات، ممتلكات)، ولا يوجد لمّة بصيغة المفرد المباشر"
      - "لا تشكيل كامل لأيٍّ من اللمّات الثلاث"
      - "التعريف الحالي دائريٌّ: يستخدم «مملوك» و«يمتلكها» في تعريف مفهوم الملك"
      - "يستخدم التعريف «حيازة» وهو لفظ الفرد الأعلى (hypernym)، مما يُضعف التمييز الدلالي"
      - "الفروق الدلالية بين اللمّات الثلاث غير موثَّقة"
    observations: >
      تضمّ المجموعة ثلاث لمّات عربية فصيحة تدور حول مفهوم الملك والحوز، وكلّها جموع؛
      وهو مألوف في الشبكات الدلالية العربية لمفاهيم التصنيف العامة.
      الفرد الأعلى (حِيَازَة / مِلْكِيَّة) أشمل وعلاقته بالمجموعة سليمة.
      التعريف الحالي مترجمٌ حرفيًّا من الإنجليزية ويحتاج إعادة تأليف بأسلوب معجمي عربي.
      التمييز الدلالي الثلاثي الثري (أملاك/مقتنيات/ممتلكات) يعكس ثراءً في الموروث
      العربي الفقهي والمعجمي يستحق التوثيق.

  blind_candidates:
    - lemma: "مُقْتَنًى"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الفعل «اقتنى» على وزن مُفْتَعَل، وهو ما يتّخذه المرءُ لنفسه لا للتجارة، يناسب دلالة «شيء مملوك يحتفظ به صاحبه»"
    - lemma: "مِلْكٌ"
      generation_method: ishtiqaq
      justification: "اسم من الجذر م-ل-ك على وزن فِعْل، يدل في الموروث الفقهي والمعجمي على «ما مُلِكَ من مال»، وهو المقابل المفرد المباشر للمعنى المقصود"
    - lemma: "مَتَاعٌ"
      generation_method: majaz
      justification: "لفظ عربي أصيل من م-ت-ع يدل أصلًا على «ما ينتفع به»، يُستخدم بمعنى المتعلقات والمقتنيات الشخصية؛ إحياء دلالي من المعنى الأصلي نحو معنى الملكية"
    - lemma: "مَحُوزٌ"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الجذر ح-و-ز (حازَ يَحوزُ) على وزن مَفْعُول، يعني «الشيء الذي ضُمَّ إلى النفس وأُحرِز»، مناسب لمعنى الشيء المملوك المحوز"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١. دفعة headword_norm لجميع اللمّات الموجودة والمرشحات (استعلام ١)
# ٢. الإثراء بالمعرّف — definitions + examples لمداخل مختارة (استعلام ٤)
# ٣. الجسر الإنجليزي — property / belongings / holding / possession / asset (استعلام ٧)
# ٤. مداخل أملاك + مقتنيات + مقتنى + محوز + ملكية (استعلام ١ تكميلي)
# ٥. مقاييس اللغة للجذور: ملك، قنا، متع، حوز (dictionary_id = 151)
# ٦. البحث الكلمي FTS: مملوك، تملّك، مقتنى، ممتلك (استعلام ٦)
stage2_evidence:

  per_lemma:

    - lemma: "أملاك"
      confirm:
        - text: "«أملاك الدولة = state property; domanial property»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
        - text: "«فَالْمِلْكُ: مَا مُلِكَ مِنْ مَالٍ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مادة م-ل-ك"
        - text: "«مِلْك؛ ممتلكات» [ترجمة possession]"
          source: "المورد الحديث (2008) — ARABTERM"

    - lemma: "مقتنيات"
      confirm:
        - text: "«مُقْتَنَيات — الجذر: ق ن ي — المعنى: ما يحتفظ به من الأشياء القَيِّمة أو الثمينة — الصواب والرتبة: -أقيم مزاد لبيع المقتنيات الفنية [فصيحة] — التعليق: لم ترد هذه الكلمة في المعاجم بصيغة المفرد ولا بصيغة الجمع ولكن ورد الفعل: اقتنى الشيء بمعنى: قناه؛ أي كسبه وجمعه واتخذه لنفسه لا للتجارة، وحيث وجد الفعل «اقتنى» في اللغة بمعنى: قنى، فلا مانع من استخدام اسم المفعول منه، وهو: مُقْتَنًى وجمعه مقتنيات، للدلالة على ما يتم الحصول عليه من تحف أو أعمال فنية أو أشياء ثمينة. وقد أجاز مجمع اللغة المصري استعمال هذه الكلمة كما ذكرتها المعاجم الحديثة.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر — hawramani"
        - text: "«قَنَا الشَّيْءَ وَاقْتَنَاهُ، إِذَا كَانَ ذَلِكَ مُعَدًّا لَهُ لَا لِلتِّجَارَةِ. وَمَالٌ قُنْيَانٌ: يُتَّخَذُ قُنْيَةً»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مادة ق-ن-ا"

    - lemma: "ممتلكات"
      confirm:
        - text: "«مُمْتَلَكات = asset»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "«أمتعة؛ ملابس؛ ممتلكات» [ترجمة belongings]"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: "«ممتلكات [كالسندات وأسهم الشركات]» [ترجمة holding]"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: "«المُمْتَلَك: شيء في حَوْزة المرء فعلًا»"
          source: "المورد الحديث (2008) — ARABTERM"

    - lemma: "مُقْتَنًى"
      confirm:
        - text: "«لا مانع من استخدام اسم المفعول منه، وهو: مُقْتَنًى وجمعه مقتنيات» [الإحالة إلى الفعل اقتنى]"
          source: "معجم الصواب اللغوي لأحمد مختار عمر — hawramani"

    - lemma: "مِلْكٌ"
      confirm:
        - text: "«فَالْمِلْكُ: مَا مُلِكَ مِنْ مَالٍ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مادة م-ل-ك"
        - text: "«الملك بكسر الميم في اصطلاح المتكلمين: حالة تعرض للشيء بسبب ما يحيط به وينتقل بانتقاله... وفي اصطلاح الفقهاء: اتصال شرعي بين الإنسان وبين شيء يكون مطلقًا لتصرفه وعاجزًا عن تصرف غيره فيه»"
          source: "التوقيف على مهمات التعاريف للمناوي — hawramani"
        - text: "«المِلْكُ: نِسْبَة الشَّيْء إِلَى ملاصق ينْتَقل انْتِقَاله»"
          source: "معجم مقاليد العلوم للسيوطي — hawramani"
      expands:
        - text: "«مِلْك؛ ممتلكات» [ترجمة possession، المعنى الثاني بعد التملّك]"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يؤكد أن مِلْك يُستخدم بمعنى الشيء المملوك (possession) في عربية المعاصرة، لا فقط بمعنى حالة الملكية"

    - lemma: "مَتَاعٌ"
      confirm:
        - text: "«كلُّ ما يُنْتَفع به ويُرْغب فى اقتنائه , كالطعام , وأَثاث البيت , والسلعة , والأداة , والمال»"
          source: "المعجم الوسيط — OCR"
      contradicts:
        - text: "«الْمِيمُ وَالتَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَنْفَعَةٍ وَامْتِدَادِ مُدَّةٍ فِي خَيْرٍ...وَالْمَتَاعُ: الِانْتِفَاعُ بِمَا فِيهِ لَذَّةٌ عَاجِلَةٌ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مادة م-ت-ع"
          conflict: "الأصل الدلالي لمتاع هو المنفعة والانتفاع لا الملكية؛ شيء ما قد يكون متاعًا دون أن يكون مملوكًا لصاحبه"

    - lemma: "مَحُوزٌ"
      confirm:
        - text: "«مَحُوز — من (ح و ز) الممتلك، والمضموم»"
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani"
      contradicts:
        - text: "«مُحَوَّز — من (ح و ز) الأمر المحكم»"
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani"
          conflict: "الصيغة مُحَوَّز (بالتشديد) تعني «المحكم» لا «المملوك»، وهو اشتراك في الصورة الصرفية بين مَحُوز ومُحَوَّز يُحدث التباسًا"
      expands:
        - text: "«وَكُلُّ مَنْ ضَمَّ شَيْئًا إِلَى نَفْسِهِ فَقَدْ حَازَهُ حَوْزًا»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مادة ح-و-ز"
          addition: "الجذر ح-و-ز يفيد الجمع والضم إلى النفس، وهو مناسب دلاليًّا، لكن مَحُوز وردَ فقط في معجم أسماء الأعلام لا في المعاجم اللغوية العامة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    # ─── اللمّات الموجودة ───

    - lemma: "أملاك"
      decision: confirmed
      decision_reason: >
        جمع مِلْك الكلاسيكي الراسخ بمعنى «ما مُلِكَ من مال»، مدعوم من مقاييس اللغة
        والاستخدام القانوني المعاصر (أملاك الدولة). يخصّ الممتلكات العقارية والأموال
        المُسجَّلة رسميًّا. اللمّة فصيحة راسخة غير لهجية. يجب تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الممتلكات العقارية والأموال والحقوق الثابتة رسميًّا؛ شائعة في الخطاب القانوني والإداري، وتُستخدم عادةً للأصول الكبيرة كالأراضي والعقارات والأموال العامة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَمْلاك"

    - lemma: "مقتنيات"
      decision: confirmed
      decision_reason: >
        أجاز مجمع اللغة المصري هذا الاستخدام صراحةً؛ مشتق قياسي من «اقتنى»
        (قَنَا واقتنى: اتخذه لنفسه لا للتجارة). الكلمة حيّة في العربية المعاصرة
        بدلالة الأشياء الثمينة أو الفنية التي يجمعها المرء لنفسه. يجب تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تخصّ ما يجمعه المرء لنفسه انتقاءً واختيارًا، ولا سيما الأشياء الثمينة والتحف والأعمال الفنية؛ تنطوي على دلالة التراكم الانتقائي المقصود لا للتجارة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقْتَنَيَات"

    - lemma: "ممتلكات"
      decision: confirmed
      decision_reason: >
        موثّقة بكثافة في المعاجم المعاصرة والمصطلحية بمعنى «asset/belongings/holding».
        الأشيع استخدامًا في العربية المعاصرة من بين لمّات المجموعة، وتشمل كلَّ ما يمتلكه
        الفرد أو المؤسسة ماديًّا ومعنويًّا. مشتق قياسي من امتلك (الجذر م-ل-ك). يجب تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الأعمّ استخدامًا والأشمل دلالةً في العربية المعاصرة؛ تشمل كلَّ ما يمتلكه الفرد أو المؤسسة ماديًّا كان أو معنويًّا، وتُستخدم في السياقات القانونية والمالية والإدارية والصحفية"

      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُمْتَلَكَات"

    # ─── مرشحات المرحلة ١ ───

    - lemma: "مُقْتَنًى"
      source: stage1
      decision: removed
      decision_reason: >
        المفرد مُقْتَنى مؤكَّد لغويًّا، غير أن جمعه «مُقْتَنَيَات» موجود بالفعل في المجموعة؛
        إضافة المفرد إلى جانب الجمع تُحدث تكرارًا في نفس المجموعة الترادفية دون قيمة دلالية مضافة.

    - lemma: "مِلْكٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الكلمة فصيحة ومدعومة من مقاييس اللغة («فَالْمِلْكُ: مَا مُلِكَ مِنْ مَالٍ»)،
        غير أن جمعه «أَمْلاك» موجود بالفعل في المجموعة؛ إضافة المفرد إلى جانب الجمع تُحدث
        ازدواجًا غير مبرر في المجموعة الترادفية ذاتها.

    - lemma: "مَتَاعٌ"
      source: stage1
      decision: removed
      decision_reason: >
        أصل المتاع في مقاييس اللغة المنفعةُ والانتفاعُ لا الملكية («الْمَتَاعُ: الِانْتِفَاعُ
        بِمَا فِيهِ لَذَّةٌ عَاجِلَةٌ»)؛ شيء ما قد يكون متاعًا دون أن يكون مملوكًا لصاحبه.
        الدلالة المحورية مختلفة عن دلالة هذه المجموعة (الملكية لا المنفعة).

    - lemma: "مَحُوزٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يَرِد مَحُوز بوصفه اسمًا شائعًا في المعاجم اللغوية العامة؛ وُجِدَ فقط في موسوعة
        السلطان قابوس لأسماء الأعلام العربية بمعنى «الممتلك»، وهو سياق التسمية لا الاستعمال
        المعجمي المشترك. علاوة على ذلك يلتبس بالصيغة مُحَوَّز (الأمر المحكم).


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "شيء مملوك؛ أي حيازة ملموسة أو غير ملموسة يمتلكها شخص ما"
