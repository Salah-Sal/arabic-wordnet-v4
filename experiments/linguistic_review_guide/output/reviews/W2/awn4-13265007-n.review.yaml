# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
stage5_enrichment:

  per_entry:
    - lemma: "أَمْلاك"
      entry_id: "{auto}"
      root: "ملك"
      maqayis_quote: "«الْمِيمُ وَاللَّامُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ وَصِحَّةٍ... فَالْمِلْكُ: مَا مُلِكَ مِنْ مَالٍ»"

    - lemma: "مُقْتَنَيَات"
      entry_id: "{auto}"
      root: "قنو"
      maqayis_quote: "«قَنَا الشَّيْءَ وَاقْتَنَاهُ، إِذَا كَانَ ذَلِكَ مُعَدًّا لَهُ لَا لِلتِّجَارَةِ. وَمَالٌ قُنْيَانٌ: يُتَّخَذُ قُنْيَةً»"

    - lemma: "مُمْتَلَكَات"
      entry_id: "{auto}"
      root: "ملك"
      maqayis_quote: "«الْمِيمُ وَاللَّامُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ وَصِحَّةٍ... فَالْمِلْكُ: مَا مُلِكَ مِنْ مَالٍ»"

  per_sense:
    - lemma: "أَمْلاك"
      sense_id: "{auto}"
      nuance: "تدل على الممتلكات العقارية والأموال والحقوق الثابتة رسميًّا؛ شائعة في الخطاب القانوني والإداري، وتُستخدم عادةً للأصول الكبيرة كالأراضي والعقارات والأموال العامة"
      mwe: false

    - lemma: "مُقْتَنَيَات"
      sense_id: "{auto}"
      nuance: "تخصّ ما يجمعه المرء لنفسه انتقاءً واختيارًا، ولا سيما الأشياء الثمينة والتحف والأعمال الفنية؛ تنطوي على دلالة التراكم الانتقائي المقصود لا للتجارة — اشتراط ضمني للقيمة والتميّز"
      mwe: false

    - lemma: "مُمْتَلَكَات"
      sense_id: "{auto}"
      nuance: "الأعمّ استخدامًا والأشمل دلالةً في العربية المعاصرة؛ تشمل كلَّ ما يمتلكه الفرد أو المؤسسة ماديًّا كان أو معنويًّا، دون تخصيص بنوع معيّن أو سياق بعينه"
      mwe: false

  synset:
    cultural_fit: native

  actions:
    # ── بيانات المداخل ──
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ملك","maqayis":"«الْمِيمُ وَاللَّامُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ وَصِحَّةٍ...فَالْمِلْكُ: مَا مُلِكَ مِنْ مَالٍ»"}'
        # ← لأَمْلاك

    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قنو","maqayis":"«قَنَا الشَّيْءَ وَاقْتَنَاهُ، إِذَا كَانَ ذَلِكَ مُعَدًّا لَهُ لَا لِلتِّجَارَةِ. وَمَالٌ قُنْيَانٌ: يُتَّخَذُ قُنْيَةً»"}'
        # ← لمُقْتَنَيَات

    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ملك","maqayis":"«الْمِيمُ وَاللَّامُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ وَصِحَّةٍ...فَالْمِلْكُ: مَا مُلِكَ مِنْ مَالٍ»"}'
        # ← لمُمْتَلَكَات

    # ── بيانات المعاني ──
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تدل على الممتلكات العقارية والأموال والحقوق الثابتة رسميًّا؛ شائعة في الخطاب القانوني والإداري","mwe":false}'
        # ← معنى أَمْلاك

    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تخصّ ما يجمعه المرء لنفسه انتقاءً واختيارًا ولا سيما الأشياء الثمينة والتحف والأعمال الفنية؛ دلالة التراكم الانتقائي المقصود لا للتجارة","mwe":false}'
        # ← معنى مُقْتَنَيَات

    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الأعمّ استخدامًا والأشمل دلالةً في العربية المعاصرة؛ تشمل كل ما يمتلكه الفرد أو المؤسسة ماديًّا كان أو معنويًّا","mwe":false}'
        # ← معنى مُمْتَلَكَات

    # ── بيانات المجموعة ──
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'

    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.82
