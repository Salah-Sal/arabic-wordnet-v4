        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح العامّ للتجزئة الكيميائية؛ يشمل جميع طرائق الفصل (تقطير، بلورة، تنبيذ) ولا يقتصر على الحراريّة"
