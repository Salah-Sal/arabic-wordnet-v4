      decision: confirmed
      decision_reason: "مركّب مصطلحيّ ثابت في معاجم النفط والفيزياء والكيمياء والبيئة. وإن كان يقابل fractional distillation (أخصّ من fractionation)، فإنّ التعريف العربيّ للمجموعة ينصّ على استخدام الحرارة، ممّا يجعله متوافقاً مع هذا المفهوم التخصيصي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يدلّ تحديداً على فصل مكوّنات الخليط السائل بتكرار التبخير والتكثيف مستغلّاً فروق درجات الغليان؛ أخصّ من «تجزئة» لأنّه يقتصر على آليّة التقطير"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْطِير تَجْزِيئِيّ"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "تَجْزِيء"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسجّل في المعجم الطبي الموحد ومعجم المصطلحات الطبية بمعنى fractionation صراحةً، وعُرِّف بأنّه فصل مكوّنات مادة بواسطة التقطير أو البلورة. وزنه تَفْعِيل بديلٌ صرفيّ طبيعيّ لـتَفْعِلَة من الجذر نفسه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مرادف لـ«تجزئة» بالمعنى العلميّ ذاته لكنّه أشيع في السجلّ الطبّي والصيدلاني"
      actions:
        - command: create_entry
          params: {lemma: "تَجْزِيء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "اسْتِقْطَار"
      source: stage1
      decision: removed
      decision_reason: "الاستقطار يدلّ على التقطير (distillation) أي تنقية السائل بالتبخير والتكثيف، وليس على التجزئة (fractionation) التي هي فصل الخليط إلى مكوّناته المتعدّدة. الفرق جوهريّ بين المفهومين."


