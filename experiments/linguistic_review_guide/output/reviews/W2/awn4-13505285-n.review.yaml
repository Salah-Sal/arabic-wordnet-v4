# مراجعة المجموعة الترادفية awn4-13505285-n
# fractionation / fractional process
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تقطير تجزيئي» تترجم fractional distillation لا fractionation؛ التقطير التجزيئي نوعٌ خاصّ من التجزئة وليس مرادفاً تامّاً لها"
      - "اللمّتان بلا تشكيل"
      - "التعريف العربي يخصّ الحرارة حصراً، بينما التجزئة تشمل البلورة والتنبيذ أيضاً"
    observations: "المجموعة تمثّل مفهوم التجزئة الكيميائية (fractionation) وهي عملية فصل خليط إلى مكوّناته. اللمّة «تجزئة» مصطلح معتمد في معاجم الكيمياء والأغذية والطبّ بهذا المعنى. أمّا «تقطير تجزيئي» فهو أخصّ، إذ يدلّ على التقطير التجزيئيّ (fractional distillation) الذي يعتمد على فرق درجات الغليان. العلاقة بينهما عمومٌ وخصوص."

  blind_candidates:
    - lemma: "تَجْزِئَة"
      generation_method: ishtiqaq
      justification: "مصدر جَزَّأَ على وزن تَفْعِلَة من الجذر ج ز أ، يدلّ على تقسيم الشيء إلى أجزاء؛ مصطلح كيميائي معتمد للدلالة على فصل الخلائط"
    - lemma: "تَقْطِير تَجْزِيئِيّ"
      generation_method: tarkib
      justification: "مركّب إضافيّ وصفيّ: التقطير (من ق ط ر، تبخير ثمّ تكثيف) + تجزيئيّ (نسبة إلى التجزيء)؛ يدلّ على فصل الخليط بتكرار التبخير والتكثيف"
    - lemma: "تَجْزِيء"
      generation_method: ishtiqaq
      justification: "مصدر جَزَّأَ على وزن تَفْعِيل من الجذر ج ز أ؛ بديل صرفيّ لـ«تجزئة» شائع في المعاجم الطبّية والعلمية بمعنى fractionation"
    - lemma: "اسْتِقْطَار"
      generation_method: ishtiqaq
      justification: "مصدر اسْتَقْطَرَ على وزن اسْتِفْعَال من الجذر ق ط ر؛ يدلّ على طلب القطر أي استخلاص السائل بالتبخير والتكثيف"


stage2_evidence:
  per_lemma:
    - lemma: "تَجْزِئَة"
      confirm:
        - text: "«فصل الخلائط بطرق مختلفة كالبلورة أو التقطير.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«(translation_en: fractionation)»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«(translation_en: fractionation)»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«عمود تجزئة — fractionating column»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يُشتقّ منها مصطلح «عمود التجزئة» ممّا يؤكّد ثبات المصطلح في مجال الكيمياء"
        - text: "«وحدة تجزئة، وحدة التقطير الأولي — topping plant»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "يُستعمل في صناعة النفط مركّباً إضافيّاً"

    - lemma: "تَقْطِير تَجْزِيئِيّ"
      confirm:
        - text: "«(translation_en: fractional distillation)»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«عملية تعتمد على تسخين خليط من السوائل. غليان الخليط وانبعاث البخار ينتج بخاراً يختلف في تكوينه عن تكوين الخليط السائل الأصلي، وبتلاحق التبخير والتكثيف يمكن الفصل بين اثنين أو أكثر من السوائل بنقط غليان مختلفة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«التقطير التجزيئيّ أو التفاصلي (ك).»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(translation_en: fractional distillation) — المصطلح الإنجليزي هو fractional distillation وليس fractionation»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "المصطلح يقابل fractional distillation (التقطير التجزيئي) وهو أخصّ من fractionation (التجزئة) الذي هو مفهوم المجموعة"

    - lemma: "تَجْزِيء"
      confirm:
        - text: "«(ب) (في علم الكيمياء) فصل مكونات مادة بواسطة التقطير أو البلورة. (ج) (في علم الأنسجة) فصل مكونات خلايا حية بواسطة الطرد المركزي.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«(translation_en: fractionation)»"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "اسْتِقْطَار"
      contradicts:
        - text: "«الاستقطار تنقية الماء وتصفيته مما قد يعلق به من مواد غريبة ضارة تحويل السائل إلى بخار بالحرارة ثم تبريده ليعود سائلاً كما كان»"
          source: "المعجم الوسيط"
          conflict: "الاستقطار يدلّ على التقطير (distillation) أي تنقية السائل لا على التجزئة (fractionation) أي فصل الخليط إلى مكوّناته"


stage3_analysis:
