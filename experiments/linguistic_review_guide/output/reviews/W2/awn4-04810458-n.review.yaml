# ── المرحلة ١: المراجعة والتوليد ────────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة (دقة) خالية من التشكيل الكامل، وهو ما يجعل اللفظ مشتركاً مع الدقة
        بمعنى التوابل (الدقاقة) أو الدِّقة بمعنى الخيط. التشكيل الصحيح دِقَّة ضروري."
      - "التعريف العربي مصاغ بأسلوب ترجمي (يبدأ بقوسين تشريحيين)؛ ينبغي صياغته
        على نمط المعجم الوسيط."
      - "اللمّة الإنجليزية (accuracy) ليست الأدق للمفهوم المعرَّف؛ إذ تعني دقة الأرقام
        المعنوية (significant figures) حقيقةً مفهوم precision لا accuracy بالمعنى
        المترولوجي الدقيق. الخلط واردٌ في المصدر الإنجليزي وليس في الترجمة العربية."
    observations: >
      المجموعة تمثّل مفهوماً رياضياً/مترولوجياً دقيقاً: «عدد الأرقام المعنوية في عدد ما».
      هذا هو تعريف precision (الدقة) لا accuracy (الضبط) بالمصطلح المعاصر.
      والتمييز حاسم: الدِّقَّة = درجة التفصيل/عدد الأرقام الدالة، والضبط = مدى الصواب
      أو القرب من القيمة الحقيقية. تستند اللمّة العربية دقة إلى جذر دقق الدال على الصغر
      والغموض والخفاء، وهو ما ينسجم مع «دِقَّة» بمعنى تفاصيل الأرقام المعنوية الدقيقة.

  blind_candidates:
    - lemma: "ضَبْط"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر ضبط (ضبط الشيء ضبطاً = أتقن إمساكه وحفظه). يُستخدم في معاجم
        تقنية عربية معتمدة لترجمة accuracy؛ وهو المرشح الأوفر ظهوراً في المصطلحية
        العربية للدلالة على الدقة الكمية.
    - lemma: "إِحْكَام"
      generation_method: majaz
      justification: >
        مصدر من الجذر حكم، أُحكم الشيء = أتقنه وأجاد صنعه. يمكن أن يُفيد بالمجاز
        دلالة إحكام التعبير العددي وإتقان ضبط الأرقام. وُظِّف حديثاً في معجم البيانات
        والذكاء الاصطناعي لترجمة precision.
    - lemma: "دِقَّةٌ رَقَمِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من دِقَّة + النسبة رَقَمِيّ، يخصّص دلالة الدقة بالمجال الرقمي/الرياضي
        ويُزيل الاشتراك اللفظي مع معاني دقة الأخرى (التوابل، الخيط الدقيق).
    - lemma: "مَضْبُوطِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من مضبوط (المنسوب إلى ضبط)، يُفيد «صفة الضبط/الدقة» بوصفها
        خاصيةً مجردة للعدد أو القياس. وُجد في المعجم الطبي الموحد (2009) بترجمة accuracy.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────────
stage2_evidence:

  # ── الاستعلامات المُنفَّذة ──
  # Q1: Batch headword lookup:
  #   headword_norm IN ('دقة','الدقة','ضبط','الضبط','احكام','الاحكام',
  #                     'موثوقية','الموثوقية','دقة رقمية','الدقة الرقمية')
  # Q2: English bridge:
  #   entries_translations_fts MATCH
  #     'translation_en:"accuracy" OR translation_en:"significant figures"
  #      OR translation_en:"significant digits" OR translation_en:"precision"
  #      OR translation_en:"numerical precision"'
  # Q3: Arabic FTS:
  #   entries_fts MATCH '"ارقام معنوية" OR "دقة رياضيات"
  #                       OR "ارقام دالة" OR "خانات ذات دلالة"'
  # Q4: Enrichment (definitions + examples):
  #   entry_id IN (9321,819672,414793,530901,462307,528999,398554,765545)
  # Q5: Maqayis:
  #   dictionary_id=151 AND headword_norm IN ('دق','دقق','ضبط')

  per_lemma:

    # ── اللمّة الموجودة: دقة ──
    - lemma: "دقة"
      confirm:
        - text: >
            «دِقَّة — precision (of measurements): القياس»
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) [ARABTERM]"
        - text: >
            «دِقَّة — accuracy [Mathematics and Astronomy]»
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) [ARABTERM]"
        - text: >
            «دقة — precision: 1- مدى التفصيل المستعمَل في التعبير عن عدد. فمثلاً، تعطي
            القيمة 3.14159265 دقةً أكبر (تفصيلاً أكثر) عن قيمة pi مما تعطيه القيمة
            3.14. ترتبط الدقةُ بالضبط accuracy، وإن كانت مختلفةً عنها. فالدقةُ تعني
            درجةَ التفصيل، أما الضبطُ فيعني الصحة. فالعدد 2.83845 أدق من العدد 3.14
            ولكنه أقل ضبطاً لقيمة pi.»
          source: "معجم مصطلحات المعلوماتية (2000) [ARABTERM]"
        - text: >
            «دِقّة — accuracy [Electronic Warfare]»
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004) [ARABTERM]"
        - text: >
            «دِقّة — accuracy [Commerce and Accounting]»
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) [ARABTERM]"
        - text: >
            «دقة — accuracy: مهارة عالية في إنجاز عمل ما وفقاً للمعايير الموضوعة له»
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم [ARABTERM]"
        - text: >
            «دقة — accuracy: (1) الفرق بين القيمة الحقيقية والقيمة التي يتم قياسها
            (إيزو ISO 1981)؛ (2) مدى تطابق أو اقتراب قياس، أو تقدير على أساس قياسات،
            من القيمة الحقيقية للخاصية التي هي موضوع القياس (إيزو 1988)»
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة [ARABTERM]"
        - text: >
            «دقة — Accuracy: معدل التنبؤات الصحيحة التي يقدمها نموذج التصنيف»
          source: "معجم البيانات والذكاء الاصطناعي (2024) [ARABTERM]"
        - text: >
            «أرقام ذات دلالة — significant figures (calculations): ذات مغزى»
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) [ARABTERM — تحت مدخل أرقام دالة]"
        - text: >
            «الأرقام ذات الدلالة — significant digits: تتالي الخاناتِ في عددٍ ابتداءً من
            أولِ خانةٍ مختلفة عن الصفر وحتى آخر خانةٍ مختلفة عن الصفر»
          source: "معجم مصطلحات المعلوماتية (2000) [ARABTERM — تحت مدخل الأرقام ذات الدلالة]"
      expands:
        - text: >
            «دقّة مزدوجة — double precision: مضاعفة عدد الأرقام الثنائية المستخدمة لتمثيل
            الأعداد وذلك لتحقيق دقة حسابية أعلى»
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم [ARABTERM]"
          addition: "تُثبت هذا المدخل كلمة دقة أساساً في مصطلحية «الدقة العددية للأرقام»"
        - text: >
            «ضبط الدقة — accuracy control: تحديد مدى الدقة لبيان ما على الحاسوب طبقاً
            للغرض من استخدام هذا البيان وذلك بتوفير درجات مختلفة من الدقة للأرقام
            المتناهية في الكبر أو الصغر»
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم [ARABTERM]"
          addition: "يُثبت أن «الدقة» هي الوحدة المصطلحية الجوهرية في هذا المجال"

    # ── مرشح المرحلة ١: ضَبْط ──
    - lemma: "ضَبْط"
      confirm:
        - text: >
            «ضبط — accuracy: الدرجةُ التي تَقترب فيها نتيجةُ الحساب أو القياس من القيمة
            الحقيقية»
          source: "معجم مصطلحات المعلوماتية (2000) [ARABTERM]"
        - text: >
            «ضبط — accuracy: درجة دقة وسيلة قياس / مدى دقة النتائج المحصل عليها»
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) [ARABTERM]"
        - text: >
            «دقة، ضبط — accuracy [Chemistry]»
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) [ARABTERM]"
      contradicts:
        - text: >
            «دقة — precision: 1- مدى التفصيل المستعمَل في التعبير عن عدد... ترتبط الدقةُ
            بالضبط accuracy، وإن كانت مختلفةً عنها. فالدقةُ تعني درجةَ التفصيل، أما
            الضبطُ فيعني الصحة.»
          source: "معجم مصطلحات المعلوماتية (2000) [ARABTERM]"
          conflict: >
            يُثبت هذا النص صراحةً الفرق بين ضبط (=accuracy, صحة القيمة) ودقة
            (=precision, عدد الأرقام المعنوية). المجموعة تعرّف مفهوم precision
            (الأرقام المعنوية)، فضبط مرفوض لهذا المعنى.
        - text: >
            «الضبط: في اللغة الحزم. وفي اصطلاح أصول الحديث سماع الكلام كما هو حق
            سماعه ثم فهم معناه الذي أريد به»
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي [Hawramani]"
          conflict: >
            المعنى الاصطلاحي الكلاسيكي لضبط يدور حول الإتقان والحفظ، لا حول
            درجة تفصيل التعبير العددي.

    # ── مرشح المرحلة ١: إِحْكَام ──
    - lemma: "إِحْكَام"
      confirm:
        - text: >
            «إحكام — Precision: مقياس لتحديد نسبة القيم الإيجابية المحدَّدة التي كانت
            صحيحة فعلاً»
          source: "معجم البيانات والذكاء الاصطناعي (2024) [ARABTERM]"
      contradicts:
        - text: >
            «إحكام — tightness [Water Engineering]»
          source: "المعجم الموحد لمصطلحات المياه (2000) [ARABTERM]"
          conflict: >
            الاستخدام السائد لإحكام في المعاجم التقنية هو «الإحكام» بمعنى الإغلاق
            المحكم أو التسنين، لا درجة التفصيل في الأرقام المعنوية.
        - text: >
            «إحكام — tightening [Medical Dictionary]»
          source: "المعجم الطبي الموحد (2009) [ARABTERM]"
          conflict: >
            المعنى في المعجم الطبي هو الشد/التضييق لا الدقة الرياضية.
      expands:
        - text: >
            «متوسط الإحكام — Average Precision: مقياس يلخص أداء تسلسل مُرتَّب للنتائج
            عن طريق حساب متوسط قيم الدقة لكل نتيجة ذات صلة»
          source: "معجم البيانات والذكاء الاصطناعي (2024) [ARABTERM]"
          addition: >
            استخدام إحكام لـ precision قاصر على مجال تعلم الآلة (مقياس أداء النماذج)
            ولا يُغطي مفهوم الأرقام المعنوية في الرياضيات.

    # ── مرشح المرحلة ١: دِقَّةٌ رَقَمِيَّة ──
    - lemma: "دِقَّةٌ رَقَمِيَّة"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١: مَضْبُوطِيَّة ──
    - lemma: "مَضْبُوطِيَّة"
      confirm:
        - text: >
            «مَضْبوطِيَّة — accuracy [The Unified Medical Dictionary]»
          source: "المعجم الطبي الموحد (2009) [ARABTERM]"
      contradicts:
        - text: >
            «دقة — precision: 1- مدى التفصيل المستعمَل في التعبير عن عدد...
            الدقةُ تعني درجةَ التفصيل، أما الضبطُ فيعني الصحة»
          source: "معجم مصطلحات المعلوماتية (2000) [ARABTERM]"
          conflict: >
            مضبوطية مشتقة من ضبط الذي يعني accuracy (الصحة) لا precision
            (الأرقام المعنوية). المجموعة عن precision فمضبوطية غير مناسبة.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة: دقة ──
    - lemma: "دقة"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة توثيقاً راسخاً في المعجمية التقنية العربية لترجمة accuracy
        وprecision معاً عبر ما لا يقل عن اثني عشر معجماً متخصصاً. والشاهد الأوفى
        ورد في معجم مصطلحات المعلوماتية (2000) الذي يعرّف دقة تعريفاً مطابقاً
        لتعريف المجموعة: «مدى التفصيل المستعمَل في التعبير عن عدد» = عدد الأرقام
        المعنوية. الجذر دقق في مقاييس اللغة يدل على الصغر والخفاء وهو معنى
        ينسجم مع دقائق الأرقام المعنوية. اللمّة تحتاج تشكيلاً كاملاً: دِقَّة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check: >
        وزنها فِعْلَة (فِقَّة)، مصدر نوع من الجذر المضعف دقق. الوزن يُلائم الاسم
        المجرد الدال على صفة أو حال، وهو مناسب لمصطلح يعبّر عن خاصية رقمية.
      nuance_differentiation: >
        دِقَّة هي اللمّة الوحيدة المؤكدة في هذه المجموعة؛ تتميز دلالتها في السياق
        الرياضي بأنها تخصّ «مقدار التفصيل» (عدد الأرقام الدالة) لا «صحة القيمة»
        (وهو مجال ضبط). وتمتد دلالتها إلى precision بمعنى نقيّ.
      loan_check:
        lexical_borrowing: "عربي خالص من جذر دقق"
        calque_check: "لا. المصطلح عربي اشتقاقي يسبق التوطين التقني"
        blind_calque: "غير وارد"
      quality_gate:
        consistency: "سائد في الفصيح والمصطلحية"
        ease_of_use: "مقطع واحد، سهل التداول والإعراب والجمع (دِقَّات)"
        appropriateness: "ملائم للسياق الرياضي والقياسي"
        heritage_preference: "تراثي موثّق في معاجم اللغة"
        arabic_preference: "عربي خالص مشتق"
        derivability: "قابل للاشتقاق: دقيق، تدقيق، مدقَّق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دِقَّة"

    # ── مرشح ١: ضَبْط ──
    - lemma: "ضَبْط"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ظهور ضبط بترجمة accuracy في عدة معاجم، إلا أن المصدر الأكثر تخصصاً
        (معجم مصطلحات المعلوماتية 2000) يُفرّق صراحةً بين ضبط=accuracy (الصحة)
        ودقة=precision (الأرقام المعنوية). والمجموعة تعرّف مفهوم الأرقام المعنوية
        (significant figures) الذي هو precision لا accuracy. إدراج ضبط سيُدخل
        تلبيساً مصطلحياً في شبكة دلالية تميّز بين المفهومين.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # ── مرشح ٢: إِحْكَام ──
    - lemma: "إِحْكَام"
      source: stage1
      decision: removed
      decision_reason: >
        استخدام إحكام لترجمة precision قاصر على مجال تعلم الآلة وفق معجم البيانات
        والذكاء الاصطناعي (2024) حيث يدل على مقياس أداء النماذج (نسبة الإيجابيات
        الحقيقية). هذا سياق مختلف كلياً عن «عدد الأرقام المعنوية» في الرياضيات.
        السياقات الأخرى لإحكام (إحكام الإغلاق، التضييق الطبي) تزيد الاشتراك اللفظي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # ── مرشح ٣: دِقَّةٌ رَقَمِيَّة ──
    - lemma: "دِقَّةٌ رَقَمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود لهذا التركيب في قواعد البيانات المعجمية المستعلَمة بوصفه وحدة معجمية
        مستقلة. اختبار السكّ يفشل: يمكن استبدال «رقمية» بـ«حسابية» أو «عددية» وتبقى
        الجملة وصفاً لا مصطلحاً. ودِقَّة منفردة كافية ومستقرة في المصطلحية التقنية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشح ٤: مَضْبُوطِيَّة ──
    - lemma: "مَضْبُوطِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصدر الصناعي من مضبوط يُفيد «حالة الانضباط/الصواب»، وهو ما يناسب
        دلالة accuracy (الصواب/القرب من القيمة الحقيقية). وبما أن الجذر ضبط
        يُناقض دلالة المجموعة (الأرقام المعنوية/التفصيل)، فمضبوطية مرفوضة أيضاً.
        وجودها في معجم طبي واحد لا يمثّل استخداماً راسخاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────────
stage4_content:
  definition:
    current: "(في الرياضيات) عدد الأرقام المعنوية المعطاة في عدد ما"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح مضموناً لكنه يعاني ثلاث مشكلات أسلوبية: (١) القوس
        في بداية التعريف ليس نمط المعجم الوسيط في توجيه المجال، (٢) «المعطاة»
        وزن سلبي (اسم مفعول مجهول الفاعل) يضعف التعريف، (٣) يصف العدد لا المفهوم
        الرياضي. والأفضل صياغة تعريف مصطلحي يُدرج المفهوم ضمن جنسه القريب
        (خاصية، مقياس) ويُضيف الفصل النوعي.
    authored:
