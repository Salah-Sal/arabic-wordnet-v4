            type: usage
          - text: "أَطْلَقَ الْبَوَّاقُ نِدَاءَ الْبُوقِ الْأَخِيرَ إِيذَاناً بِبَدْءِ مَرَاسِمِ الدَّفْنِ الْعَسْكَرِيِّ"
            type: usage
    actions:
      - command: add_synset_example
