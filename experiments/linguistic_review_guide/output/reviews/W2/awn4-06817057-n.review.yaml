# ili: i72246
# pos: n
# definition_en: a signal broadcast by the sound of a bugle
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (نداء البوق) مصطلح تركيبي إضافي غير مُقيَّد بتشكيل كامل"
      - "المجموعة تضمّ لمّة واحدة فقط دون بدائل، مما يُفقرها دلالياً"
      - "التعريف العربي الحالي (إشارة تُبث بصوت البوق) ضعيف: لا يُميّز الإشارة العسكرية الاصطلاحية عن مجرد الصوت"
      - "البوق لفظ دخيل وفق ابن فارس، مما يستوجب التنبيه عند بناء المصطلح عليه"
    observations: >
      المجموعة تُعالج مفهوم الإشارة الصوتية العسكرية المؤدَّاة بالبوق (bugle call)، وهي
      إشارات موسيقية قصيرة ذات أغراض عسكرية وبروتوكولية محددة كالاستيقاظ والزحف
      والتجمّع والتكريم الجنائزي. الحقل الأعلى "إشارة/علامة غير لفظية" يناسب المفهوم.
      لم يُسجَّل المصطلح المُركّب في المعاجم المعتمدة، وإن كان شفّافاً لغوياً؛ فنداء
      (مصدر من ندا/ندو بمعنى البُعد في الصوت والمناداة) + البوق (آلة نفخية) تركيبٌ
      إضافي مفهوم. الجذر ند-و/ند-ي يُغطّي دلالة المناداة والصوت البعيد.

  blind_candidates:
    - lemma: "نَفِيرٌ"
      generation_method: majaz
      justification: >
        لفظ عربي قديم من جذر نفر يدلّ على الخروج والتنبيه؛ يُستخدم كلاسيكياً
        للتعبير عن نداء الحشد العسكري والإنذار عبر الأبواق. المجاز هنا إزاحة من
        "المجموعة المنتفرة" إلى "نداء الانتفار".
    - lemma: "إِشَارَةُ الْبُوقِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من إشارة (الجنس القريب الموافق للتعريف العربي) + البوق (الفصل
        الآلي). يُصرّح بطبيعة الدلالة الإشارية ولا يقتصر على المناداة.
    - lemma: "نَقْرُ الْبُوقِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من نَقْر (ضربة/أداء على آلة موسيقية) + البوق. نَقَرَ مستخدَم
        في السياق الموسيقي العربي الكلاسيكي ويعبّر عن العزف الفرداني.
    - lemma: "بُوقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من بوق على وزن فُعْلِيَّة، قياساً على درامية/موسيقية، يُشير
        إلى ما يتعلق بالبوق. قد يُستخدم للدلالة على الإشارة البوقية مجازاً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "نداء البوق"
      evidence_status: "no_material_found"
      # لم يُعثر على المصطلح المركّب مُقيَّداً في أيٍّ من معاجم قاعدة البيانات
      # بصيغتَي "نداء البوق" أو "النداء البوق"

    - lemma: "نَفِيرٌ"
      confirm:
        - text: "«النفير: الكُفْء في المفاخرة، القوم يَنْفِرُون للقتال. (النَّفِير العَامُّ): قيام عامة الناس لقتال العدوِّ»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(النفير) الكُفْء في المفاخرة والقوم ينفرون للقتال و(النفير العَام) قيام عامَّة النَّاس لقِتَال العَدو»"
          source: "المعجم الوسيط — هوراماني"
        - text: "«translation_en: trumpet»"
          source: "مسرد الفن، التسلية والرياضة — ARABTERM"
      contradicts:
        - text: "«هو جهاز إشارات سمعية... يُصدر صوتاً أو أصواتاً مُتتابعة بواسطة ضغّاط... إلا أن الفارق الرئيسي بين النفير والبوق يكمن في عملية إنتاج الأصوات، ففي البوق تنتج الأصوات عن طريق مغناطيس كهربائي يقوم بهز غشاء رقي»"
          source: "مسرد هندسة وتكنولوجيا السيارات — ARABTERM"
          conflict: "ARABTERM تُميّز صراحةً بين النفير (بوق هوائي ضغطي) والبوق (آلة كهرومغناطيسية). استخدام نفير لنداء البوق يُحدث خلطاً اصطلاحياً"
        - text: "«النَّفِير: translation_en: pharyngotympanic tube (Eustachian tube) / auditory tube / tuba auditiva»"
          source: "المعجم الطبي الموحد — ARABTERM (متعدد مداخل)"
          conflict: "النفير مُستخدَم في المصطلحية الطبية للقناة السمعية (استاكيوس)، مما يُثقِّل عليه الدلالة"
      expands:
        - text: "«نَفَرَ: النُّونُ وَالْفَاءُ وَالرَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَجَافٍ وَتَبَاعُدٍ... وَالنَّفِيرُ: النَّفَرُ، وَكَذَا النَّفْرُ وَالنَّفْرَةُ: كُلُّ ذَلِكَ قِيَاسُهُ وَاحِدٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر نفر يدلّ على التجافي والتباعد؛ النفير بمعنى الحشد العسكري استعمال مجازي لا صوتي في الأصل"

    - lemma: "إِشَارَةُ الْبُوقِ"
      evidence_status: "no_material_found"

    - lemma: "نَقْرُ الْبُوقِ"
      evidence_status: "no_material_found"

    - lemma: "بُوقِيَّة"
      contradicts:
        - text: "«translation_en: sarracenia — نباتات آكلة لحوم. تنمو في شرق والجنوب الشرقي للولايات المتحدة... تطورت أوراق النبات لتأخذ شكل قمع أو بوق»"
          source: "مسرد المناخ والبيئة — ARABTERM"
          conflict: "بوقية مُسجَّل معجمياً كاسم لجنس النباتات الآكلة sarracenia، لا علاقة له بالإشارة البوقية العسكرية"
        - text: "«translation_en: sarracenia — جنس نباتات مائية للتزيين من الفصيلة البوقية»"
          source: "المعجم الموحد لمصطلحات علم الأحياء — ARABTERM"
          conflict: "التعارض ذاته في المعجم البيولوجي"

  # أدلة إضافية ذات صلة بالسياق العام للمجموعة (من استعلامات البوق):
  context_evidence:
    - text: "«البَوْجَل: آلة شبيهة بالبوق — translation_en: bugle»"
      source: "المورد الحديث — ARABTERM"
      note: "البَوْجَل هو الآلة ذاتها (البوق/بوجل)، لا الإشارة"
    - text: "«المُبَوَّق: لحن قصير يُعْزَف على الأبواق — translation_en: fanfare»"
      source: "المورد الحديث — ARABTERM"
      note: "قريب من المفهوم لكنه fanfare لا bugle call"
    - text: "«نَفْخ البُوق؛ قَرْع الطَّبل [في الجنائز العسكرية أو إيذانًا بضرورة إطفاء الأضواء ليلًا] — translation_en: taps»"
      source: "المورد الحديث — ARABTERM"
      note: "نموذج لنداء بوق عسكري محدد (taps)"
    - text: "«(بُوقٌ) الْبَاءُ وَالْوَاوُ وَالْقَافُ لَيْسَ بِأَصْلٍ مُعَوَّلٍ عَلَيْهِ، وَلَا فِيهِ عِنْدِي كَلِمَةٌ صَحِيحَةٌ. وَقَدْ ذَكَرُوا أَنَّ الْبُوقَ الْكَذِبُ وَالْبَاطِلُ... وَهَذَا إِنْ صَحَّ فَكَأَنَّهُ حِكَايَةُ صَوْتٍ»"
      source: "مقاييس اللغة لابن فارس"
      note: "البوق ليس أصلاً عربياً معوَّلاً عليه بحسب ابن فارس — محتمل الاستعارة"
    - text: "«(نَدِيَ) النُّونُ وَالدَّالُ وَالْحَرْفُ الْمُعْتَلُّ يَدُلُّ عَلَى تَجَمُّعٍ... وَمِنَ الْبَابِ نَدَى الصَّوْتِ: بُعْدُ مَذْهَبِهِ. وَهُوَ أَنْدَى صَوْتًا مِنْهُ، أَيْ أَبْعَدُ»"
      source: "مقاييس اللغة لابن فارس"
      note: "جذر ند-ي يشمل دلالة بُعد الصوت والمناداة، مما يُسوّغ نداء في المركّب"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "نداء البوق"
      decision: confirmed
      decision_reason: >
        المركّب الإضافي (نداء + البوق) شفّاف ومفهوم ويؤدّي دلالة المفهوم المطلوب
        بدقة. نداء (مصدر من ندا/ندو) يعني المناداة والنداء ذا الصوت البعيد، وهو
        يُغطّي بُعد الإشارة التواصلية. لم يُوجد في القاعدة المعجمية ما يعارضه أو
        يُزاحمه. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      borrowing_check:
        loanword: "البوق محتمل الدخالة وفق ابن فارس، لكنه راسخ في العربية قروناً وتقبّل الاشتقاق والجمع والنسبة"
        calque_check: "المركّب ليس ترجمة حرفية عمياء بل يُعبّر بصدق عن الدلالة"
      quality_gate:
        consistency: "مطّرد مع نمط (فعل + آلة) في العربية: نداء الصلاة، نداء الجهاد"
        ease_of_use: "سهل التداول، مألوف للمتلقّي العربي"
        appropriateness: "ملائم لسياق الإشارات العسكرية"
        heritage_preference: "نداء لفظ عربي أصيل قديم"
        arabic_preference: "مُؤثَر على أي اقتراض"
        derivability: "نداء قابل للاشتقاق: منادٍ، مُنادى، تناديَ"
      morphological_fit: "إضافي اسمي — مناسب للاسم الذي يدلّ على فعل/حدث"
      nuance_differentiation: >
        نداء البوق هو اللمّة الوحيدة في المجموعة؛ الفرق الدلالي يظهر مقارنةً بالمفاهيم
        المجاورة: يختلف عن (صوت البوق) بتأكيده الوظيفة الإشارية التواصلية لا مجرد
        الصدى الصوتي، ويختلف عن (نفخ البوق) بكونه ناتج الفعل لا الفعل ذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِدَاءُ الْبُوقِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَفِيرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        نفير شديد التعدّد الدلالي: (١) الحشد العسكري المنتفر في المعاجم الكلاسيكية،
        (٢) القناة السمعية (استاكيوس) في المصطلحية الطبية، (٣) جهاز الإشارة الصوتي
        الضغطي في هندسة السيارات — وهذا الأخير يُميَّز صراحةً عن البوق. لا يمكن
        تخصيصه لنداء البوق دون خلط اصطلاحي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "إِشَارَةُ الْبُوقِ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي شفّاف لكنه غير مسجّل في أيٍّ من المعاجم. اجتياز اختبار السكّ:
        يمكن إبداله بـ(علامة البوق) أو (رسالة البوق) مع بقائه وصفاً صادقاً، مما
        يعني أنه عبارة وصفية حرّة لا مصطلح مسكوك. كما أن نداء البوق الموجودة
        تؤدّي الوظيفة ذاتها بصورة أدق (نداء يُشير إلى الوظيفة التواصلية).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "نَقْرُ الْبُوقِ"
      source: stage1
      decision: removed
      decision_reason: >
        غير مُسجَّل معجمياً. نَقْر يُستخدم للوتريات والإيقاعيات لا لآلات النفخ
        (يُقال نفخ في البوق لا نقر البوق)، لذا فيه خطأ في الملاءمة الصرفية-الدلالية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "بُوقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        تعارض معجمي مباشر: بوقية مسجَّلة في ARABTERM لجنس النبات الآكل sarracenia
        في معجمَيْ البيولوجيا والبيئة. الاستخدام لنداء البوق سيُحدث اشتراكاً لفظياً
        مع مصطلح علمي راسخ.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "إشارة تُبث بصوت البوق"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في جوهره لكنه ناقص: (أ) لا يُشير إلى الطابع العسكري
        أو الرسمي للإشارة، (ب) عبارة "تُبث" غريبة للإشارة الصوتية — الأفضل
        "تُؤدَّى" أو "تُعزف"، (ج) لا يُفرّق الإشارة المقصودة ذات الغرض المحدَّد
        عن أي صوت بوق اعتباطي. يُقدَّم تعريف مصطلحي وآخر موسوعي.
    authored:
      - type: terminological
        text: "إِشَارَةٌ صَوْتِيَّةٌ تُؤدَّى بِالنَّفْخِ فِي الْبُوقِ لِغَرَضٍ عَسْكَرِيٍّ أَوْ رَسْمِيٍّ مُحَدَّدٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          لَحْنٌ قَصِيرٌ مُحَدَّدُ النَّغَمَاتِ يُعْزَفُ عَلَى الْبُوقِ إِيذَاناً
          بِأَمْرٍ عَسْكَرِيٍّ كَالِاسْتِيقَاظِ أَوِ الزَّحْفِ أَوِ التَّجَمُّعِ
          أَوِ التَّكْرِيمِ الْجَنَائِزِيِّ؛ وَكُلُّ نِدَاءٍ لَهُ نَغَمَةٌ خَاصَّةٌ
          تُمَيِّزُهُ وَتُعَرِّفُ الْجُنُودَ بِمَضْمُونِهِ.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-06817057-n"
          definition_index: 0
          text: "إِشَارَةٌ صَوْتِيَّةٌ تُؤدَّى بِالنَّفْخِ فِي الْبُوقِ لِغَرَضٍ عَسْكَرِيٍّ أَوْ رَسْمِيٍّ مُحَدَّدٍ"
      - command: add_definition
        params:
          synset_id: "awn4-06817057-n"
          text: "لَحْنٌ قَصِيرٌ مُحَدَّدُ النَّغَمَاتِ يُعْزَفُ عَلَى الْبُوقِ إِيذَاناً بِأَمْرٍ عَسْكَرِيٍّ كَالِاسْتِيقَاظِ أَوِ الزَّحْفِ أَوِ التَّجَمُّعِ أَوِ التَّكْرِيمِ الْجَنَائِزِيِّ؛ وَكُلُّ نِدَاءٍ لَهُ نَغَمَةٌ خَاصَّةٌ تُمَيِّزُهُ وَتُعَرِّفُ الْجُنُودَ بِمَضْمُونِهِ"

  examples:
