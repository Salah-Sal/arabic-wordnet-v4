# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13435159-n (premium)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «قيمة إضافية» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ يمكن إبدال «إضافية» بـ«زائدة» أو «فائضة» دون تغيير المعنى"
      - "التعريف العربي ترجمة حرفية نسبياً من الإنجليزي، ويمكن تحسين صياغته بأسلوب معجمي"
      - "اللمّة «علاوة» بدون تشكيل — والصواب بكسر العين «عِلَاوَة»"
    observations: "المفهوم اقتصادي واضح: الفرق بين القيمة السوقية والقيمة الاسمية لشيء نادر. في العربية يُعبَّر عنه تقليدياً بـ«العِلَاوَة» وهو مصطلح مستعمل في المعاجم الاقتصادية الحديثة. اللمّة الثانية «قيمة إضافية» تفشل اختبار السكّ لأنها وصف حر وليست وحدة معجمية ثابتة."
  blind_candidates:
    - lemma: "عِلَاوَة"
      generation_method: ishtiqaq
      justification: "من جذر «علو» على وزن فِعالة، تدل على الزيادة والارتفاع فوق الأصل. وردت في المعاجم بمعنى «ما زاد على الشيء»، واستُعملت في الاقتصاد بمعنى زيادة السعر على القيمة القانونية."
    - lemma: "فَارِقُ القِيمَة"
      generation_method: tarkib
      justification: "مركب إضافي من «فارق» (اسم فاعل من فرق) و«القيمة»، يدل على الفرق بين القيمة الاسمية والسوقية. مستعمل في سياق الصرف والعملات."
    - lemma: "هَامِش"
      generation_method: majaz
      justification: "مجاز من الهامش بمعنى الحاشية والطرف الزائد، يُستعمل في التجارة بمعنى الفرق بين سعر التكلفة وسعر البيع (profit margin). لكنه أعمّ من المفهوم المطلوب."
    - lemma: "بَدَلُ نُدْرَة"
      generation_method: tarkib
      justification: "مركب إضافي من «بَدَل» (العِوَض) و«نُدْرة» (قلة الوجود)، يُصرِّح بعلة العلاوة وهي ندرة العرض. غير مسكوك في المعاجم."

stage2_evidence:
  per_lemma:
    - lemma: "عِلَاوَة"
      confirm:
        - text: "«(العلاوة) من كل شَيْء مَا زَاد عَلَيْهِ وَمَا يوضع على الْبَعِير بعد تَمام حمله من سقاء وَغَيره (ج) علاوى وعلاوة الذَّهَب (فِي الاقتصاد) زِيَادَة سعره على قِيمَته القانونية (مج)»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة، 1998)"
        - text: "«من كل شيء: ما زاد عليه [...] علاوة الذَّهب: (فى الاقتصاد): زيادة سعره على قيمته القانونية»"
          source: "المعجم الوسيط (OCR)"
        - text: "«علاوة، عمولة — premium»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«مكافآت، علاوات — premium; bounties — فوق المبلغ الأصلي»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«علاوة إصدار — share premium — المبلغ الذي يتعين على مكتتب الأسهم أداؤه زيادة على القيمة الاسمية للسهم، وذلك كمقابل للاستفادة من الحقوق التي سيكتسبها على الاحتياطات المتوفرة لدى الشركة»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«العِلاوة: بالكسر — أعلى الرأس أو العنق وما وضع بين العدلين، وعُلاوة الشيء أرفعُه نقيض سُفالته»"
          source: "التعريفات الفقهية للبركتي"
          addition: "الدلالة الحسية الأصلية: ما يُعلى ويُحمَل فوق الحمل"
        - text: "«عِلاوة وردت في المعاجم بكسر العين لا فتحها»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "التشكيل الصحيح بكسر العين: عِلَاوَة"
    - lemma: "قِيمَة إِضَافِيَّة"
      evidence_status: "no_material_found"
    - lemma: "فَارِقُ القِيمَة"
      confirm:
        - text: "«(1) فَرْق القيمة [بين نوع من العملة وآخر] (2) صِرافة (3) عمولة الصِّرافة — agio»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(3) فرق القيمة [بين شكلين من أشكال العملة لهما نفس القيمة الاسمية] — premium»"
          source: "المورد الحديث (2008)"
          addition: "المورد يستعمل «فرق القيمة» كأحد معاني premium لكن مقيداً بالعملات"
    - lemma: "هَامِش"
      evidence_status: "no_material_found"
    - lemma: "بَدَلُ نُدْرَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عِلَاوَة"
      decision: confirmed
      decision_reason: "لمّة متمكنة في الفصحى، مؤيَّدة بالمعجم الوسيط والمعاجم المصطلحية الاقتصادية. دلالتها تنطبق تماماً على المفهوم: «ما زاد على الشيء»، وخُصَّ في الاقتصاد بـ«زيادة السعر على القيمة القانونية/الاسمية»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح اقتصادي معياري يدل على الزيادة في القيمة فوق الأصل، يُستعمل في سياقات متعددة: علاوة الذهب، علاوة الإصدار، علاوة الصرف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عِلَاوَة"
    - lemma: "قِيمَة إِضَافِيَّة"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل اختبار السكّ والتثبيت المعجمي. يمكن إبدال «إضافية» بـ«زائدة» أو «فائضة» دون تغيير المعنى، مما يثبت أنها ليست وحدة معجمية ثابتة. لم تُوثَّق في أي معجم كمصطلح مستقل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "فَارِقُ القِيمَة"
      source: stage1
      decision: removed
      decision_reason: "مسكوك في سياق الصرف والعملات (agio) وليس في سياق تقييم السلع النادرة عموماً. دلالته أضيق من المجموعة الترادفية المطلوبة ومقيّدة بفرق العملة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
    - lemma: "هَامِش"
      source: stage1
      decision: removed
      decision_reason: "لم تُوثَّق أدلة معجمية لاستعماله بمعنى premium الاقتصادي. دلالته في التجارة (هامش الربح = profit margin) مختلفة عن مفهوم العلاوة على القيمة الاسمية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "بَدَلُ نُدْرَة"
      source: stage1
      decision: removed
      decision_reason: "مركب غير مسكوك ولا مُوثَّق في أي معجم. لا يستوفي شرط التثبيت المعجمي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

