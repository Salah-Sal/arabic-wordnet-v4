# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "لمة «وسيلة» مجردةٌ من أي قيد فني أو أسلوبي — عامة جداً وغير كافية للتمييز عن الوسائل في سياقات أخرى (دينية، علمية، تقنية)"
      - "لمة «أداة فنية» مقبولة لكن «أداة» تحمل إيحاءً بالمادية والآلية أكثر من الإيحاء الجمالي الأسلوبي في السياق النقدي"
      - "كلتا اللمتين خاليتان من التشكيل"
      - "غياب مصطلح «تقنية» الأكثر تداولاً في الدراسات الأدبية والنقد العربي المعاصر لمفهوم device"
    observations: >
      المجموعة تصف مفهوم «الأداة الفنية» (artistic device) بمعناه النقدي المحدد: كل عنصر
      أسلوبي مقصود يوظّفه الفنان أو الأديب لاستجلاء تأثير جمالي بعينه. الأب المباشر
      (أسلوب/نمط تعبيري) يُشير إلى أن المجموعة تُخصِّص ضرباً من الأساليب المُصمَّمة
      لغرض تأثيري، لا الأساليب العامة. في النقد العربي الحديث يُعادَل هذا المفهوم بـ«تقنية»
      (في سياق أدوات الكتابة والتشكيل) و«أداة فنية» (في سياق التحليل البنائي) وأحياناً
      «وسيلة فنية». التعريف الحالي «شيء في عمل فني مصمم لتحقيق تأثير معين» ترجمة
      حرفية من الإنجليزية تفتقر إلى الجنس القريب الدقيق والأسلوب المعجمي العربي.
  blind_candidates:
    - lemma: "حِيلَة"
      generation_method: majaz
      justification: >
        الحيلة في أصلها اللغوي «وسيلة بارعة تُحيل الشيء عن ظاهره ابتغاء الوصول إلى
        المقصود» (المعجم الوسيط) — وهذا ينطبق على الأداة الفنية التي تُوظَّف بذكاء لتحقيق
        تأثير غير مباشر (كالمفارقة والاسترجاع وتيار الوعي). إحياء للفظ الكلاسيكي في
        المجال الجمالي بإزاحة دلالية من ميدان الدهاء العملي إلى الإتقان الأسلوبي.
    - lemma: "تَقْنِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «تقن» على وزن فَعْلِيَّة — الإتقان والحِذق في إنجاز الشيء وإحكامه.
        «أتقنت الشيء أحكمته، ورجل تِقن: حاذق» (مقاييس اللغة). التقنية = طريقة محكَمة
        مقصودة لتحقيق غاية، مما يناسب تماماً «شيء مصمَّم لتحقيق تأثير» في عمل فني.
    - lemma: "صَنْعَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «صنع» على وزن فَعْلَة — ما يُصنع ويُتقن بالحِرفة. في النقد العربي القديم
        كانت «الصنعة الشعرية» تشير إلى البراعة الأسلوبية؛ يمكن إحياء هذا المصطلح ليدل
        على الأداة الفنية كعنصر مُصنوع ومُحكَم في البنية الأسلوبية للعمل.
    - lemma: "تَدْبِير"
      generation_method: majaz
      justification: >
        من الجذر «دبر» — التدبير = التخطيط والترتيب المحكم لبلوغ غاية. بالإزاحة المجازية
        إلى المجال الفني: «تدبير» = وسيلة فنية مُدبَّرة مقصودة لتحقيق أثر معين، على
        نحو قول العرب «دبّر الأمر» أي رتّبه ونظّمه. مُبرَّر بفكرة تدبير الأثر الجمالي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١. مطابقة دفعية لجميع اللمات الموجودة والمرشحة (entries + dictionaries)
