#    OR "rhetorical device" OR "technique"
# ٣. بحث FTS بمفتاحيات: "عمل فني" OR "تأثير" OR "اسلوب" OR "حيلة" OR "اداة فنية"
# ٤. استعلام مقاييس اللغة لجذور: أدو، وسل، حول، تقن، اود
# ٥. مطابقة دفعية لمفردة أداة / الأداة للتعمق
stage2_evidence:
  per_lemma:
    - lemma: "أداة فنية"
      expands:
        - text: "«آلة الحرفة التي يقيم بها صاحبها حرفته»"
          source: "كتاب العين"
          addition: >
            يُعرِّف الأداةَ بارتباطها بالحِرفة وممارستها، مما يُسوِّغ توسيع الدلالة
            لتشمل الأدوات الأسلوبية التي يمارس بها الفنان فنه.
        - text: "«الْهَمْزَةُ وَالدَّالُ وَالْوَاوُ كَلِمَةٌ وَاحِدَةٌ... وَهَذَا شَيْءٌ مُشْتَقٌّ مِنَ الْأَدَاةِ، لِأَنَّهَا تَعْمَلُ أَعْمَالًا حَتَّى يُوصَلَ بِهَا إِلَى مَا يُرَادُ. وَأَدَاةُ [الْحَرْبِ]: السِّلَاحُ»"
          source: "مقاييس اللغة (جذر أدو)"
          addition: >
            يُعرِّف الأداةَ بوظيفتها الغائية: ما يُستعمل للوصول إلى مراد صاحبه —
            وهذا يتطابق بدقة مع مفهوم المجموعة «شيء مصمَّم لتحقيق تأثير معين».
        - text: "«(الأداة) الْآلَة الصَّغِيرَة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يدعم الأداة كمصطلح للأداة الوظيفية الدقيقة، مما يُناسب السياق الأسلوبي."

    - lemma: "وسيلة"
      confirm:
        - text: "«الوسيلة ما يتقرب به إلى الغير ليحصل الوصول إليه»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«الوسيلة: التوصل إلى الشيء برغبة. والوسيلة ما يتقرب به إلى الغير»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الْوَاوُ وَالسِّينُ وَاللَّامُ: كَلِمَتَانِ مُتَبَايِنَتَانِ جِدَّا. الْأُولَى الرَّغْبَةُ وَالطَّلَبُ. يُقَالُ وَسَلَ، إِذَا رَغِبَ... وَمِنْ ذَلِكَ الْقِيَاسِ الْوَسِيلَةُ»"
          source: "مقاييس اللغة (جذر وسل)"
      contradicts:
        - text: "«الواسِلة والوُصلة والقُرْبَى درجة النبي صلى الله عليه وسلم في الجنَّة»"
          source: "المعجم الوسيط"
          conflict: >
            الدلالة السائدة في المعجمية الكلاسيكية تنصبّ على القربى والمنزلة الدينية،
            لا على أداة فنية أسلوبية، مما يُضعف قيمتها الاصطلاحية في هذا السياق.
      expands:
        - text: "«means» / «وسيلة»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
          addition: >
            الاستعمال التقني الحديث يثبّت وسيلة كمرادف لـ means/medium بمعنى الأداة
            الوظيفية العامة، وإن ظلّت دون تخصيص فني.

    - lemma: "حِيلَة"
      confirm:
        - text: "«الحِذْق وجَوْدَةُ النَّظَرِ، والقُدْرَةُ على دِقَّةِ التَّصرُّفِ. وَسِيلةٌ بارعةٌ تُحِيلُ الشَّيءَ عن ظاهره ابْتِغَاءَ الوُصُولِ إلى المَقْصودِ»"
          source: "المعجم الكبير (جذر حول)"
        - text: "«(الْحِيلَة) الحذق وجودة النّظر وَالْقُدْرَة على دقة التَّصَرُّف فِي الْأُمُور ووسيلة بارعة تحيل الشَّيْء عَن ظَاهره ابْتِغَاء الْوُصُول إِلَى الْمَقْصُود والخديعة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الحيلة: اسم من الاحتيال، وهي التي تحول المرء عما يكرهه إلى ما يحبه»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«وَالْحِيلَةُ وَالْحَوِيلُ وَالْمُحَاوَلَةُ مِنْ طَرِيقٍ وَاحِدٍ، وَهُوَ الْقِيَاسُ الَّذِي ذَكَرْنَاهُ; لِأَنَّهُ يَدُورُ حَوَالَيِ الشَّيْءِ لِيُدْرِكَهُ»"
          source: "مقاييس اللغة (جذر حول)"
      contradicts:
        - text: "«(1) حيلة (2) مكر؛ خداع (3) «أ» وسيلة أو أداة بارعة. «ب» بَراعة»"
          source: "المورد الحديث (2008) — ترجمة: artifice"
          conflict: >
            ارتباط الحيلة بالخداع والمكر في الاستخدام الحديث (الحقل الدلالي المُهيمن)
            يعيق توظيفها مصطلحاً نقدياً محايداً في سياق الأداة الفنية الجمالية.
        - text: "«(1) حيلة؛ خُدعة (2) ذريعة»"
          source: "المورد الحديث (2008) — ترجمة: subterfuge"
          conflict: "تأكيد إضافي على انجراف الدلالة الحديثة نحو الخداع والتلاعب."

    - lemma: "تَقْنِيَّة"
      confirm:
        - text: "«وسيلة تكيف حسب غاية، وطريقة خاصة تستعمل لإنجاز عمل جيد في الأدب كصناعة للنثر والشعر، وصناعة أسلوبية للمباشر الضمني»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ترجمة: technique"
        - text: "«التِّقْنِيّة: «أ» أسلوبُ [أو طريقة] معالجة التفاصيل الفنية من قِبَل الكاتب أو الفنان. «ب» البراعة الفنّيّة. «ج» الطرائق التّقنيّة وبخاصة في البحث العلمي. «د» طريقة لإنجاز غَرَضٍ منشود»"
          source: "المورد الحديث (2008) — ترجمة: technique"
        - text: "«الوسائل التقنية التي يستخدمها الفنان والتي تعطيه شخصيته المستقلة»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ترجمة: technique"
        - text: "«التَّاءُ وَالْقَافُ وَالنُّونُ أَصْلَانِ: أَحَدُهُمَا إِحْكَامُ الشَّيْءِ، وَالثَّانِي الطِّينُ وَالْحَمْأَةُ. فَالْقَوْلُ الْأَوَّلُ أَتْقَنْتُ الشَّيْءَ أَحْكَمْتُهُ. وَرَجُلٌ تِقْنٌ: حَاذِقٌ»"
          source: "مقاييس اللغة (جذر تقن)"
        - text: "«إجراءٌ تقنِيٌّ وإداريٌّ مستعملٌ لإنجاز هدف معيّن»"
          source: "معجم مصطلحات المعلوماتية (2000) — ترجمة: technique"

    - lemma: "صَنْعَة"
      contradicts:
        - text: "«كلُّ ما عُمِلَ من خير أو إحسان»"
          source: "المعجم الوسيط"
          conflict: >
            الصنيعة تعني الإحسان والمعروف لا أداة فنية أسلوبية.
            الدلالة الأساسية تتعارض تعارضاً صريحاً مع دلالة المجموعة.
        - text: "«الإحسانُ والْمَعْرُوفُ»"
          source: "المعجم الكبير (أحد معاني صنيعة)"
          conflict: "لا صلة للإحسان بمفهوم الأداة الفنية في العمل الأدبي."
        - text: "«كلُّ مَا عمل من خير أَو إِحْسَان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "تكرار النمط الدلالي غير الملائم في المصادر المتعددة."

    - lemma: "تَدْبِير"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "أداة فنية"
      decision: confirmed
      decision_reason: >
        مركب وصفي مقبول راسخ في النقد الأدبي العربي الحديث، يؤدي المعنى المقصود
        بوضوح ودقة. الجذر أدو يحمل في مقاييس اللغة دلالة غائية صريحة: «تعمل أعمالاً
        حتى يُوصَل بها إلى ما يُراد» — وهو ما يوافق تماماً مفهوم أداة مصمَّمة لغاية فنية.
        المركب اجتاز اختبار التثبيت المعجمي: «أداة فنية» تعبير اصطلاحي شائع في النقد
        العربي (التناص أداة فنية، الاسترجاع أداة فنية). يحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تُركّز على البُعد الأداتي الإجرائي: تضع العنصر الفني في موقع «الآلة» التي
        يستخدمها الفنان، مما يُبرز طابع الصنعة والتصميم المقصود. تُناسب سياقات
        التحليل البنائي (حبكة، تناص، راوٍ عليم بوصفها أدوات بنائية).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَدَاةٌ فَنِّيَّةٌ"

    - lemma: "وسيلة"
      decision: confirmed
      decision_reason: >
        وسيلة مفردة عربية أصيلة تؤدي المعنى العام لـ«device» بوصفها ما يُتوصَّل به
        إلى الغاية. رغم عموميتها واشتباهها بالسياقات الدينية الكلاسيكية، فإن الاستعمال
        النقدي العربي الحديث يقبلها مرادفاً أوسع لـ«أداة فنية» في جمل مثل «وسيلة
        تعبيرية». الإبقاء عليها لتغطية هذا الطيف الدلالي الأوسع.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعم دلالةً من «أداة فنية»، تنصرف إلى فكرة التوسط في تحقيق الغاية التعبيرية
        دون التقييد بالطابع الأداتي المادي أو البنائي. تُناسب الإشارة إلى العناصر
        التعبيرية التواصلية (الإيقاع وسيلة، الحوار الداخلي وسيلة).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَسِيلَةٌ"

    - lemma: "حِيلَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم قيمتها الدلالية الكلاسيكية (وسيلة بارعة تُحيل الشيء عن ظاهره ابتغاء
        الوصول إلى المقصود)، فإن الحيلة ارتبطت ارتباطاً راسخاً في الذهن العربي المعاصر
        بالخداع والمكر (artifice, subterfuge). هذا الاشتراك الضار يجعلها غير صالحة
        مصطلحاً نقدياً محايداً. اختبار الاستبدال يُثبت ضعفها: «يستخدم الكاتب حيلة
        في روايته» يوحي بالخداع لا بالتقنية الأسلوبية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَقْنِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصطلح الأقوى دليلاً والأوسع تداولاً في النقد العربي الحديث. المعجم الموحد
        للسانيات (2002) يُعرِّفها تعريفاً صريحاً يتطابق مع دلالة المجموعة: «وسيلة تكيف
        حسب غاية، وطريقة خاصة تستعمل لإنجاز عمل جيد في الأدب». المورد الحديث (2008)
        يُطابقها مع «أسلوب معالجة التفاصيل الفنية من قِبَل الكاتب أو الفنان». الجذر تقن
        يحمل معنى الإحكام والحذق مما يلائم الصنعة الفنية المقصودة. اجتازت اختبار
        الاشتقاقية (تقنيات، تقني) واختبار التشكيل. غياب هذه اللمة من المجموعة ثغرة حقيقية.
      evidence_assessment:
