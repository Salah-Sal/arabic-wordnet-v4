      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُبرز الجانب الإجرائي المُتقَن وحِرفية الإنجاز، وتنصرف إلى الأسلوب المنهجي
        المُكتسَب بالمران والحذق (أتقن الشيء = أحكمه). تُناسب سياق الحديث عن طريقة
        الكتّاب والمبدعين في التعامل مع مادتهم (تقنية السرد، تقنية الوصف).
      actions:
