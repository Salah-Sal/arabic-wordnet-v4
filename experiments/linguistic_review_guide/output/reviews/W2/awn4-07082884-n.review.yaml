            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07082884-n"

    - lemma: "صَنْعَة"
      source: stage1
      decision: removed
      decision_reason: >
        الصنيعة في المعاجم تُحمَل على معنى الإحسان والمعروف والنعمة التي يصنعها المرء
        لغيره، ولا تحمل في تراثنا المعجمي دلالة الأداة الفنية الأسلوبية. المعنى الوحيد
        المُسجَّل في المعجمات الكبرى «الإحسان والمعروف» يتعارض تعارضاً صريحاً مع
        المقصود. لم يُوثَّق استعمالها نقدياً بهذا المعنى.
