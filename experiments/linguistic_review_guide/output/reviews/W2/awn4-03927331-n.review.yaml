    current: "مجموعة أو مخزون من الأدوية"
    assessment:
      decision: revise
      reason: "التعريف الحالي هو ترجمة حرفية مقبولة ولكن يمكن تحسين سبكه اللغوي ليصبح تعريفاً وافياً."
    authored:
      - type: linguistic
        text: "مِقْدَارٌ مُدَّخَرٌ أَو مَجْمُوعَةٌ مُحْتَفَظٌ بِهَا مِنَ الْأَدْوِيَةِ وَالْعَقَاقِيرِ الطِّبِّيَّةِ لِلِاسْتِعْمَالِ مَتَى دَعَتِ الْحَاجَةُ."
