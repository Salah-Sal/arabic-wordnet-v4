stage1_review:
  assessment:
    concerns:
      - "اللمة (دستور الأدوية) تطلق حصراً على الكتاب أو المرجع الرسمي الذي يضم قائمة بالأدوية ومواصفاتها، وهو ما يختلف عن الدلالة المطلوبة هنا وهي (مخزون الأدوية أو المجموعة الدوائية بحد ذاتها)."
      - "الخلط جاء من الاشتراك اللفظي في الترجمة الإنجليزية لكلمة pharmacopoeia التي تعني المرجع الطبي (المعنى الأساسي)، وتعني أيضاً المخزون الدوائي (بمعنى مجازي أو ثانوي)."
    observations: "المفهوم يشير إلى مجموعة الأدوية المادية المخزنة للاستعمال. التعبير عنه في العربية يكون عادة عبر التراكيب الإضافية أو الوصفية لعدم وجود لفظ مفرد مسكوك لهذا المعنى بدقة."
  blind_candidates:
    - lemma: "ذَخِيرَةٌ دَوَائِيَّةٌ"
      generation_method: majaz
      justification: "استعارة من الذخيرة (العتاد) للتعبير عن المخزون الدوائي المحتفظ به لوقت الحاجة أو الطوارئ."
    - lemma: "مَخْزُونٌ دَوَائِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي مباشر ودقيق للتعبير عن كمية الأدوية المخزنة."
    - lemma: "صَيْدَلِيَّةٌ"
      generation_method: majaz
      justification: "تستخدم مجازاً وبشكل شائع للدلالة على مجموعة الأدوية المحتفظ بها (مثل: صيدلية منزلية)."
    - lemma: "مَجْمُوعَةٌ دَوَائِيَّةٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر بدقة عن مجموعة الأدوية."

stage2_evidence:
  per_lemma:
    - lemma: "دستور الأدوية"
      contradicts:
        - text: "«مرجع رسميّ موثوق يحتوي على كل ما يتعلق بالأدوية ومستحضراتها.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "المعنى هنا يشير إلى الكتاب/المرجع، وليس إلى الأدوية المادية المخزنة."
    - lemma: "مخزون أدوية"
      confirm:
        - text: "«(2) مجموعة [أو مخزون] أدوية.»"
          source: "المورد الحديث (2008)"
    - lemma: "ذَخِيرَةٌ دَوَائِيَّةٌ"
      expands:
        - text: "«الذَّخِيرَةُ: ما ادُّخِر»"
          source: "المعجم الكبير"
          addition: "يدعم الاستعمال المجازي للذخيرة لتعني كل ما يُدَّخَر ويُخزَّن، بما في ذلك الأدوية."
    - lemma: "مَخْزُونٌ دَوَائِيٌّ"
      evidence_status: "no_material_found"
    - lemma: "صَيْدَلِيَّةٌ"
      contradicts:
        - text: "«(الصيدلية) الْمَكَان يُبَاشر فِيهِ الصيدلي عمله ويحفظ مَا يمتلك من عقاقير وأدوية وَنَحْوهَا»"
          source: "المعجم الوسيط"
          conflict: "المعجم يحصر المعنى في المكان الفيزيائي للصيدلة، ولا يذكر المعنى المجازي لمجموعة الأدوية."
    - lemma: "مَجْمُوعَةٌ دَوَائِيَّةٌ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "دستور الأدوية"
      decision: removed
      decision_reason: "اللمة تعني المرجع أو الكتاب الرسمي للأدوية، وهذا يتعارض مع دلالة المجموعة التي تقصد المخزون المادي من الأدوية، وقد نتج الخلط عن ترجمة عمياء لأحد معاني الكلمة الإنجليزية."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    
    - lemma: "مخزون أدوية"
      decision: confirmed
      decision_reason: "تعبير إضافي صحيح ومطابق تماماً لتعريف المجموعة وللمعنى المراد إيصاله."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَخْزُونُ أَدْوِيَةٍ"
            
    - lemma: "ذَخِيرَةٌ دَوَائِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير بلاغي مستعمل وصحيح يعكس فكرة تخزين الأدوية للضرورة أو للطوارئ قياساً على الذخيرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "ذَخِيرَةٌ دَوَائِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-03927331-n"}
          
    - lemma: "مَخْزُونٌ دَوَائِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب وصفي دقيق ومباشر ومألوف الاستعمال في السياقات الطبية والإدارية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مَخْزُونٌ دَوَائِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-03927331-n"}
          
    - lemma: "مَجْمُوعَةٌ دَوَائِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير مباشر يطابق دلالة المجموعة (collection) ويوضح كونها من الأدوية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مَجْمُوعَةٌ دَوَائِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-03927331-n"}

    - lemma: "صَيْدَلِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "المعنى الأساسي والمعجمي هو المكان الذي تباع أو تُحفظ فيه الأدوية، واستخدامها للدلالة على مجموعة الأدوية بحد ذاتها هو استخدام مجازي واسع قد يسبب لبساً مع المعنى المكاني."
      evidence_assessment:
        case: contradicts_only

stage4_content:
