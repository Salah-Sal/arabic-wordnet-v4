# visual signal — إشارة بصرية / إشارة مرئية
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «إشارة بصرية» لم تُوجد لها شواهد معجمية في قاعدة البيانات، خلافاً لـ«إشارة مرئية» المُثبَّتة في Electropedia."
      - "التعريف الحالي «إشارة تتضمن تواصلاً بصرياً» ينطوي على تكرار دلالي جزئي: المُعرَّف (إشارة) مُدرج في التعريف والمُقيِّد (بصري) مُدرج في اللمّتين، مما يُقرّب الدائرية."
      - "الفارق الدلالي بين «مرئية» و«بصرية» غير موثَّق في المجموعة: الأولى صفة مفعولية (ما يُرى)، والثانية نسبة إلى حاسة البصر."
    observations: >
      المجموعة تُعبِّر عن مفهوم «الإشارة البصرية» بمصطلحَيْن مركَّبَيْن
      (وصفيَّيْن) وهو أسلوب عربي مطّرد في المصطلحات التقنية. يُعدّ
      المصطلحان صحيحَيْن بنيويًّا، لكنّ الجمع بينهما في مجموعة واحدة
      يستوجب تثبيت الفارق النوعي بين «بصرية» (نسبة إلى حاسة البصر، منظور
      المُستقبِل) و«مرئية» (وصف بالرؤية، منظور الإشارة ذاتها). أما الأب
      «إشارة» فتعريفه دقيق ويُسعف في بناء التمييز.
  blind_candidates:
    - lemma: "إِيمَاء"
      generation_method: majaz
      justification: >
        «إيماء» من الجذر و-م-أ، أصله الإشارة الخفيفة بالرأس أو اليد لنقل
        معنى؛ وهو في جوهره تواصل بصري صامت. إحياء هذا اللفظ الكلاسيكي
        وتوسيع دلالته ليشمل أي إشارة تعتمد الرؤية يُخلِّص من الاشتراك مع
        «الإشارة» العامة.
    - lemma: "إِلْمَاح"
      generation_method: ishtiqaq
      justification: >
        «إلماح» مصدر الفعل «ألمح» (الرباعي من ل-م-ح) بمعنى إظهار شيء
        لمعةً وإخفائه — أي إرسال وميض بصري خاطف. الاشتقاق على وزن
        إِفْعَال يُناسب الإجراء الاتصالي القصير، وهو قريب من مفهوم الإشارة
        البصرية الآنية.
    - lemma: "رَمْز مَرْئِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «رمز» (إشارة رمزية) و«مرئي» (ما يُرى)؛ يُعبّر عن
        إشارة اتصالية تُدرَك بالعين. «رمز» من أصل ر-م-ز بمعنى التلويح
        والإشارة الخفية، وإضافة «مرئي» تُحدد القناة الحسية.
    - lemma: "لَمْح"
      generation_method: ishtiqaq
      justification: >
        «لمح» مصدر الفعل ل-م-ح، أصله لمعان البرق ونظرة البصر الخاطفة.
        دلالته الأصلية تنطوي على الحدث البصري الآني؛ وبالإزاحة الدلالية
        يمكن توظيفه للإشارة البصرية القصيرة، على غرار «signal» في لغات أخرى
        المشتق من «signum» (العلامة المرئية).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  queries_run:
    - "Q1: batch headword lookup — إشارة مرئية + إشارة بصرية + الإيماء + إلماح + رمز مرئي + لمح (مع صيغ ال-)"
    - "Q2: English bridge — visual signal / visual cue / optical signal / visual communication"
    - "Q3: Arabic FTS — إشارة مرئية / إشارة بصرية / تواصل بصري"
    - "Q4: Maqayis dictionary_id=151 — جذور شور، رأي، بصر"
  per_lemma:
    - lemma: "إِشَارَة مَرْئِيَّة"
      confirm:
        - text: "«إشارة مرئية» → visual signal"
          source: "موسوعة الكهرباء — IEC 60050 (Electropedia)"
      contradicts:
        - text: "«إشارة مرئية» → video signal; picture signal"
          source: "موسوعة الكهرباء — IEC 60050 (Electropedia)"
          conflict: >
            entry_id 520846 يُرجمها «video signal / picture signal» لا «visual signal»؛
            هذا يشير إلى استخدام المصطلح في حقل الكهرباء بمعنى أضيق (إشارة
            الفيديو) لا المعنى العام (إشارة تتضمن تواصلاً بصرياً).
      expands:
        - text: "«إشارة مرئية راديوية التردد» → radio-frequency vision signal; «إشارة مرئية كاملة» → complete video signal; «إشارة مرئية ملونة» → colour video signal"
          source: "موسوعة الكهرباء — IEC 60050 (Electropedia)"
          addition: >
            تتفرع من «إشارة مرئية» مصطلحات متعددة في مجال هندسة الإلكترونيات
            والتلفزة، مما يعني أن المصطلح مُعتمَد وله عائلة اصطلاحية في العربية
            التقنية. هذا يُرسّخ استخدامه في AWN4.

    - lemma: "إِشَارَة بَصَرِيَّة"
      evidence_status: "no_material_found"

    - lemma: "إِيمَاء"
      confirm:
        - text: "«الإشارة باليد أو بالرأس»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«الإيماءُ: هُوَ الْكَلَامُ الْمُشَارُ بِهِ إِلَى الْمَطْلُوبِ مِنْ قُرْبٍ لَا مَعَ الخَفَاءِ»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الإيماء: هو التنبيه وأن تشير برأسك أو بيدك أو بحابك»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الإيماء: الإشارة الخفيفة أو الإشارة بالرأس»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«إيماء» → mimicry"
          source: "مسرد الفن والتسلية والرياضة، ALECSO ArabTerm"
          conflict: >
            ترجمة ARABTERM «mimicry» تعني المحاكاة/التقليد لا الإشارة البصرية،
            مما يشير إلى انزياح دلالي في السياق الفني. «إيماء» إذن تُوظَّف
            بمعانٍ متعددة بحسب الحقل.
      expands:
        - text: "«الْإِيمَاء: إِلْقَاءُ الْمَعْنَى فِي النَّفْسِ بِخَفَاءٍ وَسُرْعَة»"
          source: "دستور العلماء للأحمدنكري"
          addition: >
            التعريف يُبرز الطابع الخفي والسريع للإيماء — إرسال معنى دون توضيح
            صريح — وهو وجه من وجوه الاتصال البصري الضمني. يُميّز «إيماء» عن
            الإشارة الصريحة.

    - lemma: "إِلْمَاح"
      contradicts:
        - text: "«الماح: الْمَادَّةُ الصَّفْرَاءُ فِي الْبَيْضَةِ»"
          source: "المعجم الوسيط (Hawramani) + المعجم الوسيط (OCR)"
          conflict: >
            المصطلح «إلماح» (مصدر أَلْمَحَ) يُنَرَّم إلى «الماح» فيتطابق مع
            كلمة «الماح» = صفار البيضة. الاشتراك اللفظي في الصورة المنرَّمة
            يُفضي إلى لبس معجمي خطير يجعله غير صالح كلمّة مستقلة.

    - lemma: "رَمْز مَرْئِيّ"
      evidence_status: "no_material_found"

    - lemma: "لَمْح"
      confirm:
        - text: "«اللَّامُ وَالْمِيمُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى لَمْعِ شَيْءٍ. يُقَالُ: لَمَحَ الْبَرْقُ وَالنَّجْمُ لَمْحًا إِذَا لَمَعَا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«اللَّمْحَةُ: النَّظْرَةُ بِالْعَجَلَةِ»"
          source: "لسان العرب لابن منظور"
        - text: "«لمَح الشّخصَ: أبصره بنظرٍ خفيفٍ أو اختلس النَّظَرَ إليه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«ألمح إليه شيئًا / ألمح به شيئًا: أشار دون أن يصرِّح»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: >
            التعدية «ألمح إلى / ب» تُولّد معنى الإشارة غير الصريحة، مما يقرّب
            «لمح» من دلالة الإشارة البصرية الضمنية. لكن هذا المعنى مصدره
            «ألمح» لا «لمح» المجرد.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إِشَارَة مَرْئِيَّة"
      decision: confirmed
      decision_reason: >
        مُثبَّتة في Electropedia (IEC 60050) بالمعنى المطلوب «visual signal»
        مباشرةً. المركب الوصفي صحيح صرفياً (إشارة + مرئية) ومتداول في
        الأدبيات التقنية العربية. الملاحظة بشأن «video signal» تخصّ حقل
        الإلكترونيات التلفزيوني وتندرج تحت المعنى الأعم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تُركِّز على الإشارة من حيث كونها مرئية ومُدرَكة بالعين (منظور
        خصائص الإشارة ذاتها — قابلة للرؤية)؛ وتُستخدم كثيراً في الحقل
        التقني والهندسي حيث تُقابَل «الإشارة السمعية» أو «الإشارة
        الكهربائية».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَة مَرْئِيَّة"

    - lemma: "إِشَارَة بَصَرِيَّة"
      decision: confirmed
      decision_reason: >
        رغم غياب شاهد معجمي مباشر في قاعدة البيانات، يظل المركب صحيحاً
        صرفياً ودلالياً: «بصرية» نسبة إلى «البصر» (حاسة الرؤية)، وهو توصيف
        من منظور المُستقبِل (المتلقي يستخدم بصره). المصطلح متداول في الأدبيات
        العربية لعلم الإشارة وتعليم الصمّ. غياب الأدلة المعجمية الكلاسيكية
        لا يعني البطلان في المصطلح الحديث.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تُركِّز على القناة الحسية من منظور المُستقبِل: تصل الإشارة عبر
        «البصر» أي الحاسة البصرية. تُستخدم في علم الإشارة وإعادة التأهيل
        والتواصل البشري حيث يُشدَّد على دور الإدراك البصري كالإشارة في
        لغة الإشارة للصمّ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَة بَصَرِيَّة"

    - lemma: "إِيمَاء"
      source: stage1
      decision: removed
      decision_reason: >
        «إيماء» أخص من المطلوب: هو إشارة جسدية (بالرأس أو اليد) بهدف نقل
        رسالة، وهو نوع واحد من أنواع الإشارات البصرية لا مرادف للمفهوم
        برمّته. فضلاً عن ذلك، ARABTERM يُترجمه «mimicry» في الحقل الفني
        مما يُنبئ بانزياح دلالي عن المفهوم المستهدف. لا يجوز إضافة مصطلح
        أخص كمرادف لمفهوم أعم.
      evidence_assessment:
        case: mixed

    - lemma: "إِلْمَاح"
      source: stage1
      decision: removed
      decision_reason: >
        الصورة المنرَّمة «الماح» تتطابق مع «الماح» = صفار البيضة (جذر م-ح
        مختلف)، مما يُحدث اشتراكاً لفظياً خطيراً في قواعد البيانات
        المعجمية. اختبار التثبيت المعجمي يرفضه: لا يمكن استخدامه استقلالاً
        دون إشكال.
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَمْز مَرْئِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية. «رمز» يُركّز على الدلالة الرمزية/الترميزية أكثر
        من كونه مجرد إشارة بصرية. المركب لم يُعثر عليه في المصادر التقنية
        العربية المُراجَعة. اختبار التثبيت المعجمي سلبي.
      evidence_assessment:
        case: no_material

    - lemma: "لَمْح"
      source: stage1
      decision: removed
      decision_reason: >
        «لمح» في المعاجم = النظرة الخاطفة والتمييز البصري، وهو فعل إدراك
        لا إشارة اتصالية. دلالته على الإشارة غير مباشرة وتحتاج تأويلاً
        مجازياً بعيداً، مما يُخلّ بوضوح المصطلح في السياق الاتصالي.
        فضلاً عن ذلك، لا يحمل معنى «إرسال رسالة» بل «استقبال/إدراك» فقط.
      evidence_assessment:
        case: confirm_only


