# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06734935-n
# interpolation / insertion — إدراج / إقحام
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «إضافة» عامة جداً وتعني الإلحاق أو الضم، لا الإدراج في سياق نص أو كلام بعينه"
      - "المصادر الثلاثة (إدراج، إضافة، إقحام) تدل أولاً على الفعل لا على الرسالة المُدرَجة ذاتها، والتعريف يصف الرسالة لا الفعل"
      - "التعريف العربي ترجمة حرفية للإنجليزي ويحتاج صياغة معجمية أصيلة"
    observations: "المجموعة تمثّل مفهوم النص أو الكلام الذي يُدخَل في سياق قائم — وهو مفهوم لساني وإعلامي وأدبي. المصادر العربية تتسع لتشمل الفعل والنتيجة معاً (إدراج = فعل الإدراج وما أُدرج)، لكن «إضافة» أعمّ من أن تكون مرادفاً دقيقاً لـ interpolation/insertion."
  blind_candidates:
    - lemma: "مُقْحَمَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول مؤنث من أقحم، يدل على الرسالة أو اللفظة التي أُقحمت في سياق — مطابق لتعريف المجموعة باعتبار المفهوم رسالةً لا فعلاً"
    - lemma: "تَدْخِيل"
      generation_method: ishtiqaq
      justification: "مصدر دخّل (فعّل من دخل)، يدل على إدخال شيء في شيء آخر بتدرّج — استُعمل في الهندسة الكهربائية مرادفاً للإقحام"
    - lemma: "تَضْمِين"
      generation_method: ishtiqaq
      justification: "مصدر ضمّن، أصله في مقاييس اللغة: جعل الشيء في شيء يحويه — يمكن أن يدل على إدراج رسالة في سياق آخر"
    - lemma: "دَسِيسَة"
      generation_method: ishtiqaq
      justification: "فَعِيلة بمعنى مفعولة من دسّ، أي ما دُسّ في كلام أو نص — لكن فيها حمولة سلبية"


stage2_evidence:
  per_lemma:
    - lemma: "إِدْرَاج"
      confirm:
        - text: "«قد تعني إدراج كلمة أو نص أو رسم في نص، أو تسجيلة في قاعدة معطيات، أو عمود أو سطر في لوحة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
        - text: "«إضافة لشيئين أو دخول في سلسلة نصوص لإعطاء نص معتمد سلطته الإحالية وبُعده المعرفي عبر تقنية فنّ الشاهد»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«(1) تصنيف؛ إدراج (2) البَنْد: شيء مُدْرَج ضمن مبدأ عامّ أو تحت فئة أكثر شمولاً»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الدال والراء والجيم أصل واحد يدل على مضيّ الشيء والمضيّ في الشيء... فأمّا الدُّرْجُ لبعض الأصوِنة والآلات... أدرجتُ الكتابَ وأدرجتُ الحبل»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «درج» يتضمن معنى اللف والطي والإدخال في شيء آخر"

    - lemma: "إِضَافَة"
      contradicts:
        - text: "«(الإضافة) (عند النحاة) ربط اسمين أحدهما بالآخر على وجه يفيد تعريفاً أو تخصيصاً و(عند الحكماء) نسبة بين شيئين يقتضي وجودُ أحدهما وجود الآخر»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي الأصيل للإضافة هو النسبة النحوية أو ضم شيء إلى شيء عموماً، وليس الإدراج في سياق نصي"
        - text: "«الإضافة: ضم شيء إلى شيء ومنه الإضافة في اصطلاح النحاة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الدلالة المعجمية هي الضم والإلحاق لا الإدراج والإقحام في سياق نصي"
      expands:
        - text: "«الضاد والياء والفاء أصل واحد صحيح يدل على ميل الشيء إلى الشيء. يقال: أضفت الشيء إلى الشيء: أملته»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «ضيف» يدل على الميل والإسناد لا على الإدخال في سياق"

    - lemma: "إِقْحَام"
      confirm:
        - text: "«الإقحام: إقحام صوت إلخ في صُلْب كلمة»"
          source: "المورد الحديث (2008)"
        - text: "«إقحام الصوت: ظاهرة تقوم على إدراج صوت غير أصلي في الكلمة أو عدة كلمات لدواعٍ صوتية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«(1) تحريف؛ دسّ؛ إقحام (2) الاستكمال؛ الاستيفاء»"
          source: "المورد الحديث (2008) — مقابل interpolation"
      expands:
        - text: "«القاف والحاء والميم أصل صحيح يدل على تورّد الشيء بأدنى جفاء وإقدام. يقال: قحم في الأمور قحوماً: رمى بنفسه فيها من غير دُربة»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الإقحام يتضمن معنى الإدخال بقوة أو بغير تمهيد"

    - lemma: "مُقْحَمَة"
      confirm:
        - text: "«يقال: لفظة مُقحَمة: زائدة لا تناسب السياق»"
          source: "المعجم الوسيط"
        - text: "«المُقْحَم: تطريز إلخ مُقْحَم على سبيل التزيين بين قطعتي نسيج»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«لفظة مقحمة: زائدة لا تناسب السياق»"
          source: "المعجم الوسيط"
          conflict: "المعجم يصفها بأنها زائدة لا تناسب السياق، مما يحمل دلالة سلبية لا تنطبق بالضرورة على كل إدراج"

    - lemma: "تَدْخِيل"
      confirm:
        - text: "«إقحام (تدخيل) في التيليفزيون الرقمي»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«إقحام (تدخيل)» وردت مقترنة بالإقحام كمرادف تقني"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "تدخيل مستعمل في السياق التقني فقط وغير مسجل في المعاجم اللغوية العامة"

    - lemma: "تَضْمِين"
      contradicts:
        - text: "«التضمين (عند علماء العربية) على معان: منها إيقاع لفظ موقع غيره ومعاملته معاملته لتضمّنه معناه... ومنها أن يتعلق معنى البيت بالذي بعده»"
          source: "المعجم الوسيط"
          conflict: "التضمين في العربية مصطلح بلاغي ونحوي مستقر بمعانٍ مختلفة عن insertion/interpolation"
        - text: "«التضمين: لغة جعل الشيء في ضمن الشيء مشتملاً عليه. التضمين في الشعر أن يتعلق معنى البيت بالذي قبله»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى البلاغي والعروضي راسخ ويسبب اشتراكاً لفظياً مُربكاً"
      expands:
        - text: "«الضاد والميم والنون أصل صحيح وهو جعل الشيء في شيء يحويه»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي للجذر يدل على الاحتواء والإيعاء لا على الإدراج في سياق"

    - lemma: "دَسِيسَة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "إِدْرَاج"
      decision: confirmed
      decision_reason: "مصدر أدرج، مسجّل في المعاجم التقنية واللسانية بمعنى إدخال نص أو كلمة في سياق آخر، وهو المعنى المطابق للمجموعة. يمكن أن يدل على الفعل وعلى النتيجة معاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على إدخال شيء في سياق بتدرج وانسجام، دون إيحاء بالقسر أو عدم الملاءمة — أعمّ من إقحام وأكثر حيادية"
      actions: []

    - lemma: "إِضَافَة"
      decision: removed
      decision_reason: "معناها المعجمي الأصيل هو الضم والإلحاق والنسبة النحوية، وهي أعمّ بكثير من مفهوم الإدراج/الإقحام (insertion/interpolation). لا تحمل دلالة إدخال رسالة في سياق نصي قائم، بل تعني مجرد الإلحاق أو الزيادة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِقْحَام"
      decision: confirmed
      decision_reason: "مصدر أقحم، مسجّل في المعاجم اللسانية والتقنية بمعنى إدخال عنصر في سياق ما. يقابل interpolation مباشرة في المورد الحديث واللسانيات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يتضمن معنى الإدخال بقوة أو بغير تمهيد أو في غير موضعه الطبيعي — أخصّ من إدراج ويحمل ظلالاً من الجفاء أو التطفل"
      actions: []

    - lemma: "مُقْحَمَة"
      source: stage1
      decision: removed
      decision_reason: "اسم مفعول مؤنث (صفة) وليس مصدراً أو اسماً مستقلاً، ولا يتسق مع نمط اللمّات الموجودة (مصادر). كما أن المعجم الوسيط يحصرها في الدلالة السلبية (زائدة لا تناسب السياق)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَدْخِيل"
      source: stage1
      decision: removed
      decision_reason: "ورد مرة واحدة في موسوعة الكهرباء مقترناً بالإقحام في سياق تقني ضيق (التيليفزيون الرقمي)، وغير مسجل في المعاجم اللغوية العامة. لا يتمتع بتثبيت معجمي كافٍ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "تَضْمِين"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مستقر في البلاغة والعروض والنحو بمعانٍ مختلفة (إيقاع لفظ موقع غيره، تعلّق البيت بما قبله). وفي الاستعمال التقني الحديث يعني modulation أو implication. الاشتراك اللفظي الكثيف يجعله غير صالح كمرادف واضح لـ insertion."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "دَسِيسَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية، وتحمل حمولة سلبية قوية (المكر والحيلة) لا تناسب المفهوم المحايد للإدراج."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


