stage1_review:
  assessment:
    concerns:
      - "المصطلح الحالي 'تسوندري' هو تعريب صوتي (Transliteration) لمفهوم ياباني محدد، وقد لا يكون مفهوماً لغير المطلعين على ثقافة الأنمي."
      - "التعريف الحالي يمزج بين وصف العملية (عملية تطور) ووصف الشخص (تصف شخصاً)، ويفضل توحيد الصياغة."
    observations: "المجموعة تصف نمطاً سلوكياً مشهوراً في الأدب المعاصر، وخصوصاً في الثقافة الشعبية اليابانية، يعتمد على التضاد بين الجفاء الأولي والود المتأخر. المصطلح المعرب 'تسوندري' هو الأكثر شيوعاً كاسم لهذا النموذج، لكن توجد تعابير عربية أصيلة تصف نفس الحالة النفسية والتحول في 'العريكة'."
  blind_candidates:
    - lemma: "تَسُونْدِيرِي"
      generation_method: taarib
      justification: "التعريب الشائع في الأوساط الثقافية المهتمة بالأنمي والمانغا لوصف هذا النموذج من الشخصيات."
    - lemma: "مُتَلَيِّن العَرِيكَة"
      generation_method: tarkib
      justification: "تعبير عربي تراثي يصف من يتحول طبعه من القسوة أو الإباء (خشانة العريكة) إلى اللين والمودة، وهو ما يطابق جوهر المفهوم."
    - lemma: "شَكِس-وَدُود"
      generation_method: tarkib
      justification: "مركب وصفي يجمع بين 'الشكاسة' (الجفاء وسوء الخلق) و'المودة'، وهما ركنا هذا المفهوم (Tsun-Dere)."
    - lemma: "مُتَمَنِّع"
      generation_method: ishtiqaq
      justification: "يصف الشخص الذي يظهر الصد والجفاء ترفعاً أو تمنعاً وهو يبطن المودة، وهو مفهوم قريب جداً من الشق الأول للمصطلح الياباني."

stage2_evidence:
  per_lemma:
    - lemma: "تَسُونْدِيرِي"
      evidence_status: "no_material_found"
    - lemma: "شَكِس"
      confirm:
        - text: "«شَكِسَ: ساء خُلُقُه وعَسُر في معاملته»"
          source: "المعجم الوسيط"
        - text: "«الشين والكاف والسين أصل يدل على ضيق وعسر»"
          source: "مقاييس اللغة"
    - lemma: "وَدُود"
      confirm:
        - text: "«الوَدُودُ: الكثير الحُبّ»"
          source: "المعجم الوسيط"
        - text: "«الواو والدال: كلمة تدل على محبة»"
          source: "مقاييس اللغة"
    - lemma: "عَرِيكَة"
      confirm:
        - text: "«فلان لَيِّنُ العَرِيكَةِ، إِذَا لَمْ يَكُنْ ذَا إِبَاءٍ، وَكَانَ سَلِسًا»"
          source: "مقاييس اللغة"
        - text: "«العَرِيكَةُ: شِدَّةُ النَّفْسِ»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "تسوندري"
      decision: confirmed
      decision_reason: "المصطلح هو المسمى التقني العالمي لهذا المفهوم، وهو واسع الانتشار في المحتوى العربي المعاصر الموجه للشباب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسُونْدِيرِي"
    - lemma: "مُتَلَيِّن العَرِيكَة"
      source: stage1
      decision: confirmed
      decision_reason: "بديل عربي فصيح وبليغ يصف بدقة التحول في الطبع من الشدة إلى اللين، وهو ما تقصده المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "مُتَلَيِّن العَرِيكَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "شَكِس-وَدُود"
      source: stage1
      decision: confirmed
      decision_reason: "وصف تركيبي مباشر يجمع بين حالتي الشخصية، مما يسهل فهم المصطلح الياباني الأصلي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: create_entry
          params: {lemma: "شَكِس-وَدُود", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عملية تطور شخصية تصف شخصاً يكون بارداً أو حتى عدائياً في البداية تجاه شخص آخر قبل أن يظهر جانباً أكثر دفئاً تدريجياً بمرور الوقت."
    assessment:
      decision: revise
      reason: "لتحسين الصياغة لتكون أكثر اصطلاحية ودقة في وصف العملية كظاهرة سلوكية."
    authored:
      - type: terminological
        text: "عملية في تطور الشخصية تصف تحول سلوك الفرد من الجفاء أو العدائية في البداية إلى إظهار المودة واللين تدريجياً بمرور الوقت."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَسُونْدِيرِي"
        examples:
          - text: "تُعد شخصية 'أوساكا' مثالاً كلاسيكياً على نمط التسونديري، حيث بدأت علاقتها بالبطل بالعداء ثم انتهت بالوفاء."
            type: usage
      - lemma: "مُتَلَيِّن العَرِيكَة"
        examples:
          - text: "كان يُعرف بخشونة الطبع، لكنه صار متلين العريكة بعد أن وثق بصديقه الجديد."
            type: usage
      - lemma: "شَكِس-وَدُود"
        examples:
          - text: "يمتاز بطل الرواية بطابع شكس-ودود يجعل من الصعب التكهن بردود أفعاله العاطفية."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية في تطور الشخصية تصف تحول سلوك الفرد من الجفاء أو العدائية في البداية إلى إظهار المودة واللين تدريجياً بمرور الوقت."}

