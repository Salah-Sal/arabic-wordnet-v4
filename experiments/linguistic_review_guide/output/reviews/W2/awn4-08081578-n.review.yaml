stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يركز حصرياً على 'المحامين' (الأشخاص) بينما اللمّات الحالية 'الادعاء' و'النيابة' تشير غالباً إلى الهيئة أو الوظيفة (Senses shifting between Institution/Group/Act)."
      - "اللمّات الموجودة غير مشكولة."
    observations: "تعد 'النيابة' و'الادعاء' من المصطلحات المركزية في النظم القانونية العربية، حيث تشير إلى سلطة الاتهام التي تحرك الدعوى الجنائية. المصطلح الرسمي الكامل غالباً ما يكون مركباً (النيابة العامة أو الادعاء العام)، والتعريف الإنجليزي يخص 'فئة المحامين' (the lawyers) وهو ما يعادل وظيفياً 'هيئة النيابة' أو 'جهاز الادعاء'."
  blind_candidates:
    - lemma: "النِّيَابَةُ العَامَّةُ"
      generation_method: tarkib
      justification: "المصطلح الرسمي الشائع في معظم الدول العربية (مثل مصر والشام) للدلالة على الهيئة القضائية التي تمثل المجتمع في الادعاء."
    - lemma: "الِادِّعَاءُ العَامُّ"
      generation_method: tarkib
      justification: "المصطلح الرسمي المعتمد في دول الخليج العربي والمغرب العربي كمرادف للنيابة العامة."
    - lemma: "سُلْطَةُ الِاتِّهَامِ"
      generation_method: tarkib
      justification: "وصف قانوني دقيق للدور الوظيفي الذي تقوم به هذه المجموعة من المحامين."
    - lemma: "جِهَةُ الِادِّعَاءِ"
      generation_method: tarkib
      justification: "تعبير اصطلاحي يشير بوضوح إلى الطرف (المدعي ومحاموه) في سياق التقاضي، وهو الأقرب لترجمة definition_en حرفياً."

stage2_evidence:
  per_lemma:
    - lemma: "النيابة"
      confirm:
        - text: "(النِّيَابَة) هَيْئَة قضائية تقوم بِإِقَامَة الدَّعْوَى على مُتَّهم وَنَحْوه نِيَابَة عَن الْمَجْنِي عَلَيْهِ فَردا كَانَ أَو مجتمعا"
          source: "المعجم الوسيط"
    - lemma: "الادعاء"
      confirm:
        - text: "(الادعاء) (فِي القانون) تَوْجِيه الطّلب ضد الْخصم أَمَام الْقَضَاء"
          source: "المعجم الوسيط"
    - lemma: "النِّيَابَةُ العَامَّةُ"
      confirm:
        - text: "نيابة (ال..) العمومية، ادعاء (ال..) العام: الجهاز الذي يمثل المجتمع بالمحكمة وتتولى إقامة وممارسة الدعاوى العمومية نيابة عنه."
          source: "معجم مصطلحات القانون (ArabTerm)"
    - lemma: "الِادِّعَاءُ العَامُّ"
      confirm:
        - text: "الدعوى التي تقيمها النيابة العامة أو الادعاء العام باسم المجتمع من أجل توقيع العقاب الملائم على مرتكب فعل جرمي معين."
          source: "معجم مصطلحات القانون (ArabTerm)"
    - lemma: "جِهَةُ الِادِّعَاءِ"
      confirm:
        - text: "جهة الادّعاء: المدعي ومحاموه"
          source: "المورد الحديث"
    - lemma: "سُلْطَةُ الِاتِّهَامِ"
      confirm:
        - text: "سلطة الاتهام (prosecution): هي الجهة المناط بها قانوناً تحريك الدعوى الجنائية."
          source: "معجم المصطلحات القانونية"

