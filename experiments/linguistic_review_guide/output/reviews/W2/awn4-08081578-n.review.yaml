stage4_content:
  definition:
    current: "المحامون الذين يعملون لصالح الدولة لرفع القضية ضد المدعى عليه"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية؛ الأفضل استخدام المصطلحات القانونية العربية المستقرة التي تدمج بين 'المحامين' و'الهيئة القضائية' التي يمثلونها."
    authored:
      - type: terminological
        text: "الهيئة القضائية أو مجموعة المحامين الذين يمثلون الدولة أو المجتمع في تحريك الدعوى الجنائية ومتابعتها ضد المتهمين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الهيئة القضائية أو مجموعة المحامين الذين يمثلون الدولة أو المجتمع في تحريك الدعوى الجنائية ومتابعتها ضد المتهمين."

  examples:
    per_lemma:
      - lemma: "النِّيَابَةُ"
        examples:
          - text: "أمرت النيابة بحبس المتهم على ذمة التحقيق."
            type: usage
      - lemma: "الِادِّعَاءُ"
        examples:
          - text: "قدم الادعاء أدلة جديدة تثبت تورط الجاني في الجريمة."
            type: usage
      - lemma: "النِّيَابَةُ العَامَّةُ"
        examples:
          - text: "تتولى النيابة العامة إقامة الدعوى العمومية ومباشرتها أمام المحاكم."
            type: usage
      - lemma: "الِادِّعَاءُ العَامُّ"
        examples:
          - text: "طالب الادعاء العام بتوقيع أقصى عقوبة ينص عليها القانون."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "قدمت جهة الادعاء مرافعتها الختامية قبل نطق الحكم."

