stage1_review:
  assessment:
    concerns:
      - "المصطلح الإنجليزي (wardrobe) يعبر عن الدلالتين: خزانة الملابس، ومجموعة الملابس نفسها (سواء لشخص أو لفرقة مسرحية). في العربية، لا توجد كلمة واحدة تغطي الدلالتين معاً في هذا السياق المتخصص، لذا يجب الاعتماد على التركيب."
      - "اللمة الحالية (مجموعة أزياء) صحيحة ودقيقة دلالياً وتعد ترجمة وظيفية مقبولة لمعنى (collection of costumes)."
    observations: "صياغة المفهوم كمركب إضافي (مجموعة أزياء) هي الأنسب لسد هذه الفجوة المعجمية في اللغة العربية، ويمكن تخصيصها أكثر بسياق المسرح إذا لزم الأمر، لكن اللمة الحالية كافية عند ارتباطها بالتعريف."
  blind_candidates:
    - lemma: "خِزَانَةُ أَزْيَاءٍ"
      generation_method: majaz
      justification: "استخدام كلمة (خزانة) مجازاً (علاقة المكانية) للتعبير عن محتواها من الملابس، وهو مجاز شائع الاستخدام في المصطلحات المسرحية."
    - lemma: "أَزْيَاءٌ مَسْرَحِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر بشكل مباشر عن نوع الملابس المستخدمة في هذا المجال."
    - lemma: "خِزَانَةُ مَلَابِسَ"
      generation_method: tarkib
      justification: "الترجمة المعجمية الأكثر شيوعاً لكلمة (wardrobe)، والتي قد تمتد دلالتها لتشمل مجموعة الملابس."
    - lemma: "مَلَابِسُ الفِرْقَةِ"
      generation_method: tarkib
      justification: "تعبير إضافي يخصص الملابس بالفرقة المسرحية المالكة لها، وهو ما يطابق التعريف بدقة."

stage2_evidence:
  per_lemma:
    - lemma: "مجموعة أزياء"
      evidence_status: "no_material_found"
    - lemma: "خزانة أزياء"
      evidence_status: "no_material_found"
    - lemma: "أزياء مسرحية"
      evidence_status: "no_material_found"
    - lemma: "خزانة ملابس"
      confirm:
        - text: "(1) «أ» خزانة الثِّياب. «ب» حجرة الملابس. «ج» حقيبة الملابس... (2) ملابس المرء أو الفرقة المسرحيّة (3) دائرة الملابس أو الحُليِّ [في بلاط إلخ]."
          source: "المورد الحديث (2008)"
    - lemma: "ملابس الفرقة"
      confirm:
        - text: "(2) ملابس المرء أو الفرقة المسرحيّة"
          source: "المورد الحديث (2008)"
      expands:
        - text: "ورد هذا التعبير في سياق شرح دلالة (wardrobe) في معجم المورد."
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "مجموعة أزياء"
      decision: confirmed
      decision_reason: "التركيب يطابق بدقة دلالة المجموعة الترادفية ويشير صراحةً إلى تشكيلة الملابس، وهو تعبير واضح ويفي بالغرض في غياب كلمة مفردة متخصصة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "العبارة الأدق لترجمة مفهوم (collection of costumes) بشكل مباشر وواضح."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوعَةُ أَزْيَاءٍ"
    - lemma: "خِزَانَةُ أَزْيَاءٍ"
      source: stage1
      decision: removed
      decision_reason: "المركب يشير غالباً إلى قطعة الأثاث المادية، ورغم إمكانية استخدامه مجازاً للتعبير عن مجموعة الأزياء، فإن اللمة الأصلية (مجموعة أزياء) أوضح وأقل التباساً."
    - lemma: "أَزْيَاءٌ مَسْرَحِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "المركب يصف نوع الملابس عموماً ولا يركز على كونها (مجموعة) أو (تشكيلة) تملكها فرقة كما يقصد في هذا السياق."
    - lemma: "خِزَانَةُ مَلَابِسَ"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الأساسية هي قطعة الأثاث، واستخدامها للتعبير عن التشكيلة قد يسبب غموضاً في السياقات غير المسرحية."
    - lemma: "مَلَابِسُ الفِرْقَةِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير سياقي حر لا يرقى ليكون مصطلحاً مستقلاً مسكوكاً."

stage4_content:
  definition:
    current: "مجموعة الأزياء المملوكة لشركة مسرحية"
    assessment:
      decision: revise
      reason: "تعديل أسلوبي بسيط لاستبدال كلمة (شركة) بـ (فرقة) المسرحية، وهو اللفظ الأصح في السياق الثقافي والفني العربي."
    authored:
      - type: terminological
        text: "مَجْمُوعَةُ الأَزْيَاءِ وَالمَلَابِسِ الَّتِي تَمْتَلِكُهَا فِرْقَةٌ مَسْرَحِيَّةٌ لِاسْتِخْدَامِهَا فِي عُرُوضِهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَجْمُوعَةُ الأَزْيَاءِ وَالمَلَابِسِ الَّتِي تَمْتَلِكُهَا فِرْقَةٌ مَسْرَحِيَّةٌ لِاسْتِخْدَامِهَا فِي عُرُوضِهَا."
  examples:
    per_lemma:
      - lemma: "مَجْمُوعَةُ أَزْيَاءٍ"
        examples:
          - text: "تَضُمُّ مَجْمُوعَةُ أَزْيَاءِ الفِرْقَةِ قِطَعاً تَارِيخِيَّةً نَادِرَةً اُسْتُخْدِمَتْ فِي مَسْرَحِيَّاتٍ شَهِيرَةٍ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تَضُمُّ مَجْمُوعَةُ أَزْيَاءِ الفِرْقَةِ قِطَعاً تَارِيخِيَّةً نَادِرَةً اُسْتُخْدِمَتْ فِي مَسْرَحِيَّاتٍ شَهِيرَةٍ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَضُمُّ مَجْمُوعَةُ أَزْيَاءِ الفِرْقَةِ قِطَعاً تَارِيخِيَّةً نَادِرَةً اُسْتُخْدِمَتْ فِي مَسْرَحِيَّاتٍ شَهِيرَةٍ."

