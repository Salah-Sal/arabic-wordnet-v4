        key: note
        value: '{"root":"قسم","maqayis":"«الْقَافُ وَالسِّينُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ... يَدُلُّ ... عَلَى تَجْزِئَةِ شَيْءٍ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نشر","maqayis":"«النُّونُ وَالشِّينُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَتْحِ شَيْءٍ وَتَشَعُّبِهِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فرق","maqayis":"«الْفَاءُ وَالرَّاءُ وَالْقَافُ أُصَيْلٌ صَحِيحٌ يَدُلُّ عَلَى تَمْيِيزٍ وَتَزْيِيلٍ بَيْنَ شَيْئَيْنِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
