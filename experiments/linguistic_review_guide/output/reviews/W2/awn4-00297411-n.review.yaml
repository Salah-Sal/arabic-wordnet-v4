stage1_review:
  assessment:
    concerns:
      - اللمات الحالية (مسيرة، موكب) تغطي الجانب الاحتفالي والسياسي، ولكنها قد لا تغطي تماماً الجانب التنظيمي للمركبات أو الحيوانات في تشكيل طولي (column).
    observations: "المفهوم يشمل تحرك مجموعة في تشكيل منتظم. كلمة 'رَتَل' مناسبة جداً لوصف تحرك المركبات أو الوحدات في صف منتظم، وهو ما تشمله التعريفات الإنجليزية (vehicles moving ahead in formation)."
  blind_candidates:
    - lemma: "مَوْكِبٌ"
      generation_method: majaz
      justification: "اللفظ التقليدي لجماعة من الناس أو الركبان تسير في احتفال أو زينة."
    - lemma: "مَسِيرَةٌ"
      generation_method: ishtiqaq
      justification: "تستخدم بكثرة في العصر الحديث للمشي الجماعي المنظم لأغراض مطلبية أو احتفالية."
    - lemma: "رَتَلٌ"
      generation_method: ishtiqaq
      justification: "يدل في أصله على التناسق والانتظام، واستخدم حديثاً لوصف صفوف المركبات أو الخيل التي تتبع بعضها بعضاً."
    - lemma: "اسْتِعْرَاضٌ"
      generation_method: ishtiqaq
      justification: "يطلق على المسير المنظم الذي يهدف لإظهار القوة أو الاحتفاء بشيء ما (Parade)."

stage2_evidence:
  per_lemma:
    - lemma: "مَسِيرَةٌ"
      confirm:
        - text: "«سَيْرُ مجمعةٍ من الناس؛ تعبيرًا عن مطالبَ أو مشاعِرَ معيَّنَةٍ.»"
          source: "المعجم الكبير"
    - lemma: "مَوْكِبٌ"
      confirm:
        - text: "«الجماعة من النَّاس يسيرون رُكباناً ومُشاةً في زينة أو احتفال.»"
          source: "المعجم الوسيط"
        - text: "«جماعة يركبون على نحو الخيل للزينة.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "رَتَلٌ"
      confirm:
        - text: "«جماعة من الخيل أو السيارات يتبع بعضها أثر بعض (محدثة).»"
          source: "المعجم الوسيط"
        - text: "«جماعَةُ الخَيْل - أو المَرْكَبات - يسير بعضُها إثرَ بَعْضٍ.»"
          source: "المعجم الكبير"
        - text: "«جماعة من الخيل أو السيارات أو نحوهما يتبع بعضُها بعضًا.»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«والتَّرْكيبُ يَدُلُّ على تَساوٍ فِي أَشْياءَ مُتَناسِقَةٍ.»"
          source: "تاج العروس"
          addition: "يوضح الأصل الدلالي للكلمة المرتبط بالتناسق."
    - lemma: "اسْتِعْرَاضٌ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مَسِيرَةٌ"
      decision: confirmed
      decision_reason: "مصطلح شائع جداً وموثق في المعاجم الحديثة للدلالة على المسير الجماعي المنظم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَسِيرَةٌ"
    - lemma: "مَوْكِبٌ"
      decision: confirmed
      decision_reason: "المصطلح العربي الأصيل لوصف الجماعة التي تسير في زينة أو احتفال، وهو في صلب معنى المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْكِبٌ"
    - lemma: "رَتَلٌ"
      source: stage1
      decision: confirmed
      decision_reason: "يغطي الجانب المتعلق بانتظام المركبات والحيوانات (الخيل) في صفوف منتظمة، وهو ما يفتقر إليه المصطلحان الآخران جزئياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رَتَلٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00297411-n"}
    - lemma: "اسْتِعْرَاضٌ"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من دلالته على المسير المنظم، إلا أنه يميل أكثر لكونه نوعاً خاصاً من الموكب (Parade) وليس مرادفاً عاماً لـ Procession."

stage4_content:
  definition:
    current: "العمل الجماعي لمجموعة من الناس أو الحيوانات أو المركبات التي تتحرك للأمام في تشكيل منتظم إلى حد ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو مترجماً حرفياً وغير رصين لغوياً."
    authored:
      - type: terminological
        text: "جماعة من الناس أو الحيوانات أو المركبات تسير منتظمة في استعراض أو احتفال أو لغرض معين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-00297411-n", definition_index: 0, text: "جماعة من الناس أو الحيوانات أو المركبات تسير منتظمة في استعراض أو احتفال أو لغرض معين."}
  examples:
    per_lemma:
      - lemma: "مَسِيرَةٌ"
        examples:
          - text: "انطلقت مسيرةٌ سلمية حاشدة في وسط المدينة."
            type: usage
      - lemma: "مَوْكِبٌ"
        examples:
          - text: "مرَّ موكبُ الزفاف في الشوارع ترافقه الأناشيد."
            type: usage
      - lemma: "رَتَلٌ"
        examples:
          - text: "تحرَّك رتلٌ من المدرَّعات العسكرية نحو الحدود."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-00297411-n", text: "تقدّم الموكبُ ببطء عبر شوارع العاصمة المزدحمة."}

stage5_enrichment:
  per_entry:
    - lemma: "مَسِيرَةٌ"
      entry_id: "{auto}"
      root: "سير"
      maqayis_quote: "«السِّينُ وَالْيَاءُ وَالرَّاءُ أَصْلٌ يَدُلُّ عَلَى مُضِيٍّ وَجَرَيَانٍ، يُقَالُ سَارَ يَسِيرُ سَيْرًا، وَذَلِكا يَكُونُ لَيْلًا وَنَهَارًا.»"
    - lemma: "مَوْكِبٌ"
      entry_id: "{auto}"
      root: "وكب"
      maqayis_quote: "«الْوَاوُ وَالْكَافُ وَالْبَاءُ: كَلِمَتَانِ تَدُلُّ إِحْدَاهُمَا عَلَى الِانْتِصَابِ وَالْأُخْرَى عَلَى ضَرْبٍ مِنَ السَّيْرِ.»"
    - lemma: "رَتَلٌ"
      entry_id: "{auto}"
      root: "رتل"
      maqayis_quote: "«والتَّرْكيبُ يَدُلُّ على تَساوٍ فِي أَشْياءَ مُتَناسِقَةٍ.» (من تاج العروس لعدم وجود المادة في مقاييس اللغة)."
