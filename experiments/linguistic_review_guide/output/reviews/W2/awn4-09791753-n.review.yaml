step0_evidence:
  per_lemma:
    - lemma: "مُتَبَنَّى"
      confirm:
        - text: "«طفل مُتبنّى: الطفل الذي يكون موضوع تبنٍّ من جهة ما.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«المُتَبَنَّى: امرؤ تبنّاه شخص آخر.»"
          source: "المورد الحديث (2008)"
    - lemma: "ابْن بِالتَّبَنِّي"
      confirm:
        - text: "«مُتَبَنًّى an adopted son.»"
          source: "المورد الحديث (2008)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "دَعِيّ"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الدَّعِيُّ: المتَّهم فى نسبه المنسوب إلى غير أبيه المتبنى» — المعجم الوسيط"
      justification: "لفظ تراثي استُخدم تاريخياً للإشارة إلى المتبنى (آلية التوليد: إحياء التراث)."
  knowledge_candidates:
    - lemma: "رَبِيب"
      justification: "قد يُطلق مجازاً على من يُربى في كنف غير أبيه (آلية التوليد: مجاز/توسيع دلالي)."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُتَبَنَّى"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع للتعبير عن المفهوم."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اسم مفعول عام ينطبق على أي شخص ذكراً كان أو أنثى وقع عليه فعل التبني."
      example: "كَفَلَتِ الأُسْرَةُ طِفْلاً مُتَبَنَّى وَرَعَتْهُ بِحُبٍّ."

    - lemma: "ابْن بِالتَّبَنِّي"
      decision: confirmed
      decision_reason: "تعبير مستقر وشائع الاستعمال يوضح العلاقة بصراحة."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يحدد بصراحة جنس المتبنى (ذكر) ونوع العلاقة التي تربطه بمن تبناه."
      example: "عَامَلَ الرَّجُلُ ابْنَهُ بِالتَّبَنِّي بِكُلِّ عَدْلٍ."

    - lemma: "دَعِيّ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تراثي أصيل ورد في القرآن الكريم للتعبير عن المتبنى."
      step05_citation: "«الدَّعِيُّ: المتَّهم فى نسبه المنسوب إلى غير أبيه المتبنى» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "لفظ تراثي تاريخي، قد يحمل اليوم ظلالاً سلبية (ادعاء النسب)."
      example: "﴿وَمَا جَعَلَ أَدْعِيَاءَكُمْ أَبْنَاءَكُمْ﴾"
      actions:
        - command: create_entry
          params:
            lemma: "دَعِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09791753-n"

    - lemma: "رَبِيب"
      source: step05
      decision: removed
      decision_reason: "الربيب في الأصل هو ابن الزوجة من غيره، ولا يشترط فيه التبني الدقيق بالمعنى القانوني، مما يجعله أوسع دلالة وأقل دقة."
      step05_citation: "«الرَّبيب: ابنٌ بالرَّضاع أو التربية.» — المورد الحديث (2008)"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "دَعِيّ"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

step3_definition:
  definition_review_flag: true
  current_definition: "شخص (مثل طفل) تم تبنيه"
  assessment:
    decision: revise
    reason: "التعريف الحالي ركيك لغوياً («تم تبنيه»). يجب صياغته بأسلوب المعاجم العربية الأصيلة."
  authored_definitions:
    - type: terminological
      text: "مَنْ يُتَّخَذُ ابناً ويُنْسَبُ إلى غَيْرِ أَبِيهِ الحَقِيقِيِّ."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-09791753-n"
        definition_index: 0
        text: "مَنْ يُتَّخَذُ ابناً ويُنْسَبُ إلى غَيْرِ أَبِيهِ الحَقِيقِيِّ."

