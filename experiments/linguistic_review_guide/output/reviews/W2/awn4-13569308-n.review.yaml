stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقبول ولكنه أقرب إلى الترجمة الحرفية وعبارة 'كما هو الحال' غير سباكة، ويمكن صياغته بأسلوب معجمي عربي أدق."
      - "اللمّات الموجودة تفتقر للتشكيل الكامل."
    observations: "المفهوم يشير إلى عمليات إزالة الشوائب من المواد للحصول على مادة نقية أو خالصة. المصطلحات العربية الشائعة لهذا المفهوم هي التكرير (للنفط والمعادن والسكر) والتنقية (للمياه والغازات والمواد الدوائية) والتصفية (لفصل الشوائب الفيزيائية)."
  blind_candidates:
    - lemma: "تَصْفِيَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (صفو) على وزن تَفْعِلَة، وتدل على تخليص السوائل والمواد من الشوائب العالقة."
    - lemma: "تَنْقِيَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (نقي) على وزن تَفْعِلَة، وتعني إزالة الملوثات والشوائب للوصول إلى النقاء."
    - lemma: "تَكْرِير"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (كرر) على وزن تَفْعِيل، وتستخدم اصطلاحياً للعمليات الصناعية التي تتضمن تكرار المعالجة لفصل المكونات كالمعادن والنفط."
    - lemma: "تَخْلِيص"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (خلص) على وزن تَفْعِيل، بمعنى جعل المادة خالصة من غيرها."

stage2_evidence:
  per_lemma:
    - lemma: "تكرير"
      confirm:
        - text: "«تخليص المادة من الشوائب.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«المصطلح تكرير (تصفية أو تهذيب) يدل عموما على عملية تقنية لتنقية وتكرير وفصل و/أو تركيز المواد الخام والمواد الغذائية والمنتجات الصناعية. في مصفاة تكرير يمكن أن توجد منشآت لتكرير السكر أو الزيت أو المعادن أو غيرها من المواد.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "تنقية"
      confirm:
        - text: "«إزالة الشوائب من المادة الغذائية.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«عملية إزالة ملوثات للحصول على وسط نظيف أو أقل تلوثا مما كان عليه.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
    - lemma: "تصفية"
      confirm:
        - text: "«أو ترشيح وهو فصل وإزالة الجسيمات العالقة من السوائل أو من الغازات.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      expands:
        - text: "«بمعنى ما تؤول إليه التصفية وهو الإنهاء والإخلاء والإزالة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "استخدام اللفظة للدلالة على الإزالة والإخلاء"
    - lemma: "تخليص"
      confirm:
        - text: "«إزالة انتقائية لبعض مكونات الشيء»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      expands:
        - text: "«عملية إخراج مادة من الجسم.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "يغلب استخدامها في السياق الطبي والتخليص الجمركي"

stage3_analysis:
  per_lemma:
    - lemma: "تكرير"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع جداً، وموثق معجمياً للدلالة على العمليات الصناعية لإزالة الشوائب وتنقية المواد كالنفط والمعادن."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكْرِير"
    - lemma: "تنقية"
      decision: confirmed
      decision_reason: "مصطلح أساسي وشامل يدل على إزالة الشوائب والملوثات من المواد ليجعلها نقية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنْقِيَة"
    - lemma: "تَصْفِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح صحيح ومستعمل بكثرة في سياق إزالة الشوائب العالقة من السوائل والغازات بطرق فيزيائية، ويتقاطع دلالياً مع المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَصْفِيَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَخْلِيص"
      source: stage1
      decision: removed
      decision_reason: "استخدامه لعمليات التنقية وإزالة الشوائب أقل شيوعاً، إذ يغلب عليه المعنى الإداري (التخليص الجمركي) أو الحيوي (إخراج المواد من الجسم)."
      evidence_assessment:
        case: mixed

stage4_content:
  definition:
    current: "عملية إزالة الشوائب (كما هو الحال من الزيت أو المعادن أو السكر، إلخ)"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو ترجمة حرفية بأسلوب ركيك (كما هو الحال)، وينبغي صياغته بلغة عربية اصطلاحية رصينة."
    authored:
      - type: terminological
        text: "عملية معالجة المواد لفصل الشوائب عنها وتخليصها منها، كما في تكرير النفط والمعادن والسكر ونحوها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية معالجة المواد لفصل الشوائب عنها وتخليصها منها، كما في تكرير النفط والمعادن والسكر ونحوها."}

  examples:
    per_lemma:
      - lemma: "تَكْرِير"
        examples:
          - text: "تعتمد جودة المشتقات البترولية على دقة تقنيات تَكْرِير النفط الخام."
            type: usage
      - lemma: "تَنْقِيَة"
        examples:
          - text: "ابتكرت الشركة طرقاً حديثة لتَنْقِيَة مياه الشرب من الملوثات الكيميائية."
            type: usage
      - lemma: "تَصْفِيَة"
        examples:
          - text: "تتم تَصْفِيَة الزيوت النباتية من الرواسب قبل تعبئتها في العبوات الزجاجية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تعتمد جودة المشتقات البترولية على دقة تقنيات تَكْرِير النفط الخام."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "ابتكرت الشركة طرقاً حديثة لتَنْقِيَة مياه الشرب من الملوثات الكيميائية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تتم تَصْفِيَة الزيوت النباتية من الرواسب قبل تعبئتها في العبوات الزجاجية."}

