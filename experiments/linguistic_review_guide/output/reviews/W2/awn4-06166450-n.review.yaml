# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "كل ما يتم تذكره من الماضي كما هو محفوظ في الكتابة؛ مجموعة من المعرفة"
    assessment:
