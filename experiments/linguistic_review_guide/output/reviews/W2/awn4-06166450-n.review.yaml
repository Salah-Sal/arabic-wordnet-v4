# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة 'تاريخ' مسجّلة بدون تشكيل كامل؛ الصيغة الصحيحة المشكّلة: تَارِيخ"
      - "المجموعة تضمّ لمة واحدة فقط، مما يُضعف شبكتها الترادفية"
      - "التعريف العربي الحالي مترجَم حرفياً عن الإنجليزية، وأسلوبه لا يتوافق مع معجمية المعجم الوسيط"
      - "مصطلح 'تاريخ' معرَّب عن الفارسية (ماه روز) كما نبّه إليه ابن فارس، مما يستدعي إشارةً في البيانات الوصفية"
    observations: >
      تتمحور المجموعة awn4-06166450-n حول مفهوم 'التاريخ' بوصفه مجموعةً من المعرفة المدوَّنة
      المستقاة من الماضي، وهو ما يُقابله في المعجم الكبير: «علم يُسَجِّل ما وقع في العالم أو في
      بعضه مما يستحق أن يَبْقَى في ذِكْر الناس». المقوّل الأعلى (إدراك / معرفة) يؤكد أن
      المقصود هو المعرفة التاريخية لا العلم بمعناه الإجرائي وحده. 'تاريخ' هو المصطلح العربي
      الراسخ لهذا المفهوم وإن كان أصله المعرَّب موضعَ خلافٍ عند المعجميين القدامى.

  blind_candidates:
    - lemma: "مَأْثُورَات"
      generation_method: majaz
      justification: >
        جمع مأثور، من الجذر أثر، يُطلق على ما انتقل عن الأسلاف من أقوال وأخبار
        وأحداث محفوظة. الإزاحة الدلالية: من «ما تركه الأسلاف» إلى «ما حُفظ وسُجِّل
        من وقائع الماضي في الكتابة»، وهو قريب من المعنى المقصود.
    - lemma: "حَوْلِيَّات"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي جمع من 'حَوْل' (السنة)، على وزن فَعْلِيَّات، يدل على السجلات
        التاريخية المرتبة سنةً سنة. من أبرز استعمالاته العربية 'حوليات زهير بن أبي
        سلمى'. يتيح الاشتقاق من جذر عربي صميم (ح-و-ل).
    - lemma: "تُرَاث"
      generation_method: majaz
      justification: >
        من الجذر (و-ر-ث)، يحمل معنى ما ورثه الخلف عن السلف من علم ومعرفة وحضارة.
        الإزاحة الدلالية: من الإرث المادي إلى المعرفة التاريخية المتوارَثة المحفوظة،
        مستثمرةً معنى الحفظ والنقل عبر الأجيال.
    - lemma: "مُدَوَّنَات"
      generation_method: ishtiqaq
      justification: >
        جمع مُدَوَّنة، من الجذر (د-و-ن) على وزن مُفَعَّلَات. المدوّنة هي ما جُمع وكُتب
        وحُفظ في وثائق. الاشتقاق يُبرز عنصر التدوين الكتابي المطابق لمعنى «كما هو
        محفوظ في الكتابة» في التعريف.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تاريخ"
      confirm:
        - text: "«علم يُسَجِّل ما وقع في العالم، أو في بعضه، مما يستحق أن يَبْقَى في ذِكْر الناس»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«جملة الأحوال والأحداث التي يمر بها كائن ما، ويصدق على الفرد والمجتمع، كما يصدق على الظواهر الطبيعية والإنسانية»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(1) قِصّة؛ حكاية (2) تاريخ: سجلّ كرونولوجيّ للأحداث الهامة، مؤلَّف في التاريخ، بيان بالماضي الطبّي لمريض (3) علم التاريخ (4) التاريخ: الأحداث الماضية»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التاريخ: تعريف الوقت. تاريخ كل شيء: غايته ووقته الذي ينتهي إليه. فلانٌ تاريخُ قومِه، أي ينتهي إليه شَرَفُهم ورياستهم»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "يُضيف البُعد الزمني الكرونولوجي للمصطلح، وهو معنى مغاير لكنه جذريٌّ في اشتقاق الكلمة"
        - text: "«التاريخ: ذكر ابتداء مدة الشيء ليعرف بها مقدار ما بين ذلك الابتداء وبين أي وقت أريد منه»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
          addition: "يُبرز المعنى الأصلي الدقيق للتاريخ (التأريخ = تحديد الوقت) المغاير لمعنى المجموعة"
        - text: "«تاريخ (مراحل): تاريخ اللغة هو مجموعة التغيرات التي تؤثر على بنيتها مع الزمن»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُبيّن اتساع استعمال 'تاريخ' للدلالة على مجموع التطورات المتراكمة في أي ميدان"

    - lemma: "حَوْلِيَّات"
      confirm:
        - text: "«حوليّات: annals»"
          source: "مسرد الإعلام والتواصل (موقع ArabTerm)"
        - text: "«تشير الحوليات إلى سجلات سنوية تغطي إنتاج ثلاثة أجيال عبر تحليل موضوعاتي لأهم الأحداث الجارية بغرضٍ تدويني. وقد ارتبطت الحوليات بقصائد شعراء الجاهلية في حوليات زهير بن أبي سلمى»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«النباتات السنوية أو الحولية، هي التي تزهر في السنة التي تنبت فيها ثم تموت عقب الإثمار»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "حوليات تحمل في المعجمية العلمية المعاصرة معنى 'النباتات الحولية' (annuals)، مما يُفضي إلى اشتراك لفظي خطير مع المعنى التاريخي"
        - text: "«حوليات: annuals»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          conflict: "التضارب بين translation_en=annuals (نباتات حولية) وannals (سجلات تاريخية) يُظهر غموض الكلمة في المعجمية الاصطلاحية"

    - lemma: "تُرَاث"
      contradicts:
        - text: "«التُّرَاث: الإراث»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "التراث = الميراث، مفهوم أشمل لا يخص المعرفة التاريخية المدوّنة تحديداً"
        - text: "«الأشياء ذات القيمة التي ورثها الناس ويريدون الاحتفاظ بها والحفاظ عليها. التراث يمكن أن يكون طبيعياً وثقافياً وملموساً، أو غير مادي، شخصي أو جماعي»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (موقع ArabTerm)"
          conflict: "التراث أوسع من 'ما يُتذكَّر من الماضي في الكتابة': يشمل الموروثات المادية وغير المادية والتقاليد، وهو ليس مقتصراً على التدوين الكتابي"
      expands:
        - text: "«مَوْروث مُشترك (فني، ثقافي، أدبي) يحيل على الجذور والمكونات، ويُعتبر ذاكرة كل القارات (الشفوية والكتابية) الإثنية والأنثروبولوجية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُقرّ بأن التراث قد يكون شفهياً لا مكتوباً، خلافاً لشرط الكتابة في المجموعة"
        - text: "«تُرَاث: ما يبقى مما يتركه السابقون من علم ومعرفة ومال ومجد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُضيف المال والمجد إلى دائرة التراث، مما يتجاوز مفهوم 'مجموعة المعرفة التاريخية'"

    - lemma: "مَأْثُورَات"
      evidence_status: "no_material_found"

    - lemma: "مُدَوَّنَات"
