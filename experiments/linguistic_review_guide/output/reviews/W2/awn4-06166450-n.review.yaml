# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تاريخ"
      decision: confirmed
      decision_reason: >
        'تاريخ' هو المصطلح العربي الوحيد الراسخ لمفهوم المعرفة التاريخية المدوّنة.
        يُؤكده تعريف المعجم الكبير «علم يُسَجِّل ما وقع في العالم مما يستحق أن يَبْقَى
        في ذِكْر الناس» وهو تعريف يُطابق مضمون المجموعة. كذلك يُثبّته استعماله في
        عشرات المعاجم العربية الكلاسيكية والمعاصرة. التشكيل الكامل مفقود فيُصحَّح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمة الوحيدة في المجموعة؛ تَارِيخ يجمع بُعدَيْن: العلمَ الذي يُسجِّل الماضي،
        ومضمونَ ذلك التسجيل كمجموعة معرفة. وهو مغاير لـتَأْرِيخ (المصدر: فعل التوقيت).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَارِيخ"

    - lemma: "حَوْلِيَّات"
      source: stage1
      decision: removed
      decision_reason: >
        حوليات أضيق دلالةً من المجموعة: هي سجلات تاريخية مرتبة سنوياً (annals)
        لا 'كل ما يُتذكَّر من الماضي في الكتابة'. علاوةً على ذلك تحمل في المعجمية
        العلمية المعاصرة معنى 'النباتات الحولية' (annuals)، وهو اشتراك لفظي مانع.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تُرَاث"
      source: stage1
      decision: removed
      decision_reason: >
        تُرَاث يدل على الموروث الحضاري الشامل (علم + مال + مجد + ممارسات شفهية
        وكتابية) وهو أوسع نطاقاً من 'مجموعة المعرفة التاريخية المحفوظة في الكتابة'.
        لا يشترط التدوين الكتابي، والمفهومان يتقاطعان ولا يتطابقان.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مَأْثُورَات"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد مداخل معجمية تُثبّت 'مأثورات' بوصفها لمة مستقلة بالمعنى المقصود.
        المأثور في التراث العربي يحيل أساساً على الرواية الشفهية للأقوال والأحاديث،
        بخلاف التعريف الذي يشترط الكتابة. لا اجتياز لاختبار التثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُدَوَّنَات"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُضبط معجمياً كمصطلح مكافئ لـ'history'. في الاستعمال العربي المعاصر
        مدوّنات تعني 'blogs' (المدوّنة الإلكترونية) أو مجموعات نصية متخصصة (corpus)،
        مما يُفضي إلى اشتراك لفظي سائد. لا اجتياز لاختبار التثبيت المعجمي.
