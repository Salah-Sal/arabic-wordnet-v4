        لفظة دخيلة أسلوبياً، وصيغة 'كل ما...' تُحاكي بنية الجملة الإنجليزية. التعريف
        لا يُصرّح بجنس قريب صريح، ومقطع «مجموعة من المعرفة» مكرَّر مقتضب. يُعاد
        صياغته بأسلوب المعجم الوسيط بجنس قريب وفصل نوعي.
