      mwe: false
    - lemma: "نَشْرٌ"
      sense_id: "{auto}"
      nuance: "يُركّز على الفعل المادي لإتاحة المحتوى وتوزيعه طباعةً أو بثاً؛ أكثر ارتباطاً بالمؤسسة الإعلامية (دار نشر، وكالة أنباء) لا بالشخص المُقدِّم"
      mwe: false

