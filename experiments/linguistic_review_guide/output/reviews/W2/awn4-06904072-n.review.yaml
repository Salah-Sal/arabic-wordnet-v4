      maqayis_quote: "«النُّونُ وَالشِّينُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَتْحِ شَيْءٍ وَتَشَعُّبِهِ. وَمِنْهُ نَشَرْتُ الْكِتَابَ، خِلَافَ طَوَيْتُ»"

  per_sense:
