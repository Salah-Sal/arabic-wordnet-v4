# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تقديم» تظهر حرفياً في التعريف العربي («تقديم الأخبار أو المعلومات»)، مما يُفضي إلى دوران معجمي صريح"
      - "اللمّة «عرض» مشتركة بين هذه المجموعة والمجموعة الأم (awn4-06900776-n) التي تحمل أيضاً لمّة «عرض»، وهو ما يُربك الحدود الدلالية بين المجموعتين"
      - "التعريف العربي الحالي مبني على الترجمة الحرفية للإنجليزية، ويستهل بصيغة «فعل جعل شيء» غير المعهودة في أسلوب المعجم الوسيط"
      - "التعريف يجمع مفهومَين بفاصلة منقوطة دون وحدة أسلوبية، وهو غير مألوف في المعجمية العربية"
      - "اللمّات الحالية خاليةٌ من التشكيل"
    observations: >
      تنتمي هذه المجموعة إلى حقل الإعلام والبث والنشر، وتدور حول مفهوم «إتاحة الأخبار والمعلومات للجمهور».
      الملاحظ أن اللمّة «تقديم» تُلائم سياق العرض الشفهي (كتقديم نشرة الأخبار)، فيما «عرض» أعمّ دلالةً وأكثر شيوعاً في
      سياق إظهار المعلومات للمتلقي. غير أن المفهوم يشمل الطباعة والنشر المكتوب إلى جانب البث، وهو ما لا تعكسه اللمّتان
      الحاليتان وحدهما. يُضاف إلى ذلك الإشكالية التراكبية مع المجموعة الأم. يُوصى بإضافة «نشر» لتغطية الجانب المطبوع
      والإعلامي العام، وتصحيح التعريف ليجري على أسلوب المعجم الوسيط.

  blind_candidates:
    - lemma: "نَشْرٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (ن ش ر) على وزن فَعْل؛ يُعبّر عن نشر الأخبار والكتب والصحف وإتاحتها
        للجمهور، ويجمع بين دلالة البث والطباعة معاً، وهو ما يُطابق المفهوم المقصود.
    - lemma: "إِذَاعَةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (ذ ي ع) على وزن إفاعة، يعني نشر الخبر وإشاعته؛ استُعمل في العربية المعاصرة
        للبث الإذاعي. يُلائم الشق الإعلامي من المفهوم.
    - lemma: "بَثٌّ"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (ب ث ث) على وزن فَعْل؛ معناه الأصلي تفريق الشيء وإظهاره، واستُعمل في
        العربية المعاصرة للبث الإذاعي والتلفزيوني، مما يُلائم الجانب الإذاعي من المفهوم.
    - lemma: "تَوزِيعٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر (و ز ع) على وزن تفعيل؛ يعني تفريق الشيء وتقسيمه، وقد يُحمل على توزيع
        المعلومات وإيصالها للجمهور، بيد أن دلالته على الإتاحة العامة أضعف من «نشر».


