# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تقديم"
      decision: confirmed
      decision_reason: >
        «تقديم» راسخةٌ في الاستعمال العربي المعاصر بمعنى عرض الأخبار والبرامج الإعلامية شفهياً
        (كما في: «تقديم نشرة الأخبار»، و«مقدِّم البرنامج»). أثبتها المورد الحديث ترجمةً أولى
        لـpresentation. وإن كان معناها الاشتقاقي الأصلي «نقل الشيء إلى ما قبله»، فقد توسّع
        في العربية المعاصرة ليشمل الإلقاء الإعلامي. تحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على هيئة المقدِّم وفعل الإلقاء الشفهي، وتُستخدم غالباً حين يكون ثمة شخص يُقدّم
        المحتوى مباشرةً أمام جمهور (مقدِّم نشرة، مقدِّم برنامج)، خلافاً لـ«نشر» و«عرض»
        اللتين تصفان العملية دون إبراز دور الشخص المُقدِّم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْدِيمٌ"

    - lemma: "عرض"
      decision: confirmed
      decision_reason: >
        «عرض» مُثبَتة في المعاجم المعاصرة بدلالة إظهار المعلومات وبسطها للمتلقي
        («عرض الموضوع», «عرض المعلومات»). وإن كانت تشترك مع المجموعة الأم في اللفظ، إلا أن
        المعنى الوارد هنا أخصّ (إتاحة الأخبار بوسائل إعلامية) من معنى الأم (العرض العام).
        تحتاج إلى إضافة تشكيل كامل. تظل الدلالة واسعة وتستلزم التمييز بالسياق.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على جانب الإظهار والإبراز البصري أو المكتوب للمعلومات، وتُستخدم في سياق وضع
        المحتوى أمام المتلقي (عرض تقرير، عرض البيانات)، دون التركيز على وسيلة البث أو هوية
        المُقدِّم. أكثر شيوعاً في الوثائق المكتوبة والعروض التقديمية، خلافاً لـ«تقديم» المرتبطة
        بالإلقاء الشفهي و«نشر» المرتبطة بالإتاحة الإعلامية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرْضٌ"

    - lemma: "نشر"
      source: stage1
      decision: confirmed
      decision_reason: >
        «نشر» هي الأنسب لتغطية الجانب المطبوع من المفهوم («نشر الكتب والصحف»)، وكذلك
        البثّ الإعلامي بمفهومه الأشمل («نشر الأخبار»). أثبتتها المعاجم التخصصية الحديثة
        (القانون، الإعلام، الاتصال) ترجمةً لـpublication. أصلها الاشتقاقي (الفتح والتشعب)
        يُلائم دلالة الإتاحة والانتشار دلالةً طبيعية. لا دوران ولا اشتراك مع المجموعة الأم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على الفعل المادي لإتاحة المحتوى وتوزيعه (طباعةً أو بثاً)، وتجمع بين دلالة
        الطباعة والنشر ودلالة الانتشار. أكثر اللمّات الثلاث ارتباطاً بالمؤسسة الإعلامية
        (دار نشر، وكالة أنباء) لا بشخص الإلقاء. تُستخدم للأعمال الإعلامية بعمومها بخلاف
        «تقديم» المرتبطة بالأداء الشفهي و«عرض» المرتبطة بالإظهار البصري.
      actions:
        - command: create_entry
          params:
            lemma: "نَشْرٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06904072-n"

    - lemma: "إذاعة"
      source: stage1
      decision: removed
      decision_reason: >
        «إذاعة» مقيَّدة في جميع المعاجم الحديثة بالبث عبر الجهاز اللاسلكي (راديو/تلفزيون)،
        ولا تشمل الطباعة. المجموعة الترادفية تشمل «البث والطباعة» معاً، فلا يصلح ما هو أخص
        للتعبير عن ما هو أعمّ.

    - lemma: "بث"
      source: stage1
      decision: removed
      decision_reason: >
        «بث» في الاستعمال المعاصر مقصور على البث الإلكتروني (تلفزيوني/رقمي)، ولا يغطي
        الطباعة. كما أن «بث» يصف وسيلة الإيصال لا الفعل العام لإتاحة المعلومات، وهو ما يجعله
        أضيق وأدق من أن يُمثّل المجموعة ككل.

    - lemma: "توزيع"
      source: stage1
      decision: removed
      decision_reason: >
        «توزيع» يدور حول التقسيم والتفريق المادي، وهو حقل دلالي مختلف عن الإتاحة الإعلامية
        للجمهور. لا يوجد في المعاجم التخصصية ما يُثبت استعمال «توزيع» مقابل presentation
        أو publication بالمعنى الإعلامي المقصود.


