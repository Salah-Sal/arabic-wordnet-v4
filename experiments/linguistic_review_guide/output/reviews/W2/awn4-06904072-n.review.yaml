      nuance: "يُركّز على هيئة المقدِّم وفعل الإلقاء الشفهي المباشر؛ غالباً ما يتضمّن وجود شخص يُقدّم المحتوى أمام جمهور أو كاميرا (مقدِّم نشرة، مقدِّم برنامج)"
      mwe: false
    - lemma: "عَرْضٌ"
