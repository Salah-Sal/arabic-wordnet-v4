# مراجعة المجموعة الترادفية — awn4-15196904-n (access time)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «وقت الوصول» موثّقة في معاجم النقل بمعنى arrival time لا access time؛ فثمة التباس دلالي"
      - "استعمال «وقت» يوحي بنقطة زمنية محدّدة لا بفترة زمنية/فاصل، والمفهوم فاصل زمني"
      - "المجموعة تضمّ لمّة واحدة فقط؛ الإثراء ضروري"
    observations: "المفهوم تقني حاسوبي صِرف: الفاصل الزمني بين طلب البيانات وتوفّرها من محرّك الأقراص. المصطلح الإنجليزي access time راسخ في أدبيات الحوسبة. في العربية التقنية تُستعمل عدّة مقابلات: زمن النفاذ، مدّة الولوج، زمن الوصول. يحتاج المدخل إلى تدقيق المقابل العربي واختيار الأدقّ اصطلاحاً."
  blind_candidates:
    - lemma: "زَمَنُ النَّفَاذِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «زمن» (فترة) و«نفاذ» (مصدر نَفَذَ: المُضِيّ والاختراق)؛ النفاذ يعبّر عن الوصول إلى البيانات عبر طبقات التخزين"
    - lemma: "مُدَّةُ الوُلُوجِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «مدّة» (فترة زمنية) و«ولوج» (مصدر وَلَجَ: الدخول)؛ الولوج مصطلح حاسوبي شائع بمعنى access"
    - lemma: "زَمَنُ الوُصُولِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «زمن» و«وصول»؛ أقرب للمصطلح الحالي لكن باستعمال «زمن» بدل «وقت» للدلالة على الفترة لا النقطة الزمنية"
    - lemma: "تَلَبُّث"
      generation_method: ishtiqaq
      justification: "مصدر تَلَبَّثَ على وزن تَفَعُّل من الجذر ل ب ث (المُكث والانتظار)؛ يعبّر عن التأخّر الزمني اللازم لتوفّر البيانات"


stage2_evidence:
  per_lemma:
    - lemma: "وَقْتُ الوُصُولِ"
      contradicts:
        - text: "«وقت الوصول — arrival time»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "المدخل يُقابل arrival time (وقت الوصول المادّي) لا access time الحاسوبي"
        - text: "«وقْت الوصول — الوقت اللازم لوصول درجة الحرارة داخل جهاز التعقيم للحد المطلوب — come up time»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "المدخل بمعنى come up time في سياق التعقيم لا في الحوسبة"
      expands:
        - text: "«وقْت الوصول — أحد المعايير المحسوبة من الفارينوجرام ويعبر عن سرعة امتصاص الطحين للماء — arrival time (farinograph)»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "استعمال آخر في تقانات الأغذية بمعنى arrival time"

    - lemma: "زَمَنُ النَّفَاذِ"
      confirm:
        - text: "«1 زمن النفاذ ؛ 2 زمن النفاذ — 1- الزمنُ الذي تستغرقه المعلوماتُ لكي تُنقَل من الذاكرة إلى المعالِج بعد انتقاء عنوان موقع المعلومات. 2- الزمنُ اللازمُ لرأس القراءة/الكتابة في مِسْوَق قرص التخزين disk drive ليصل إلى مسلك ما على القرص. يقاس زمنُ النفاذ عادةً بالملّي ثانية، ويُستخدَمُ مقياسَ أداءٍ للأقراص الصُّلبة، ومَساوِقِ القرص المتراصّ — access time»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«زمن النفاذ إلى القرص — انظر: access time — disk access time»"
          source: "معجم مصطلحات المعلوماتية (2000)"

    - lemma: "مُدَّةُ الوُلُوجِ"
      confirm:
        - text: "«مُدَّةُ الْوُلُوج — الزمن اللازم للوصول إلى مواقع التخزين بهدف التعامل معها — access time»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
      expands:
        - text: "«وُلُوج — الوصول إلى مواقع تخزين المعطيات والمعلومات بهدف التعامل معها — access»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
          addition: "يُثبت أنّ «الولوج» مصطلح حاسوبي رسمي بمعنى access"

    - lemma: "زَمَنُ الوُصُولِ"
      confirm:
        - text: "«زمن الوُصول — المدة اللازمة للوصول إلى مكان تخزين البيانات — access time»"
          source: "مسرد التربية، أليكسو (ArabTerm)"
        - text: "«زمن الوصول — access time»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"

    - lemma: "تَلَبُّث"
      expands:
        - text: "«تَلَبُّث — الزمنُ اللازمُ لعبور إشارة من نقطة إلى أخرى على الشبكة — latency»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "المصطلح يُقابل latency (الكُمون/التأخّر) لا access time تحديداً؛ المفهومان متقاربان لكنّهما مختلفان"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "وَقْتُ الوُصُولِ"
      decision: removed
      decision_reason: "المركّب «وقت الوصول» موثّق في معاجم النقل والأغذية بمعنى arrival time وcome up time، ولم يُوثَّق في أيّ معجم حاسوبي بمعنى access time. كما أنّ «وقت» يدلّ على نقطة زمنية لا على فترة/فاصل زمني، بينما المفهوم المطلوب هو فاصل زمني. البدائل المعتمدة «زمن النفاذ» و«مدّة الولوج» و«زمن الوصول» أدقّ وأوثق توثيقاً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "زَمَنُ النَّفَاذِ"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق بتعريف مفصّل في معجم مصطلحات المعلوماتية (2000) بدلالة access time تحديداً في سياق الذاكرة ومسوق الأقراص؛ يطابق تعريف المجموعة الترادفية تطابقاً شبه كامل. «النفاذ» يعبّر عن المُضيّ والاختراق وهو أدقّ من «الوصول» في السياق الحاسوبي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُستعمل في أدبيات الحوسبة المتخصّصة بمعنى تقني دقيق يشمل النفاذ إلى الذاكرة والأقراص؛ هو الأكثر تخصّصاً بين الأشقاء"
      actions:
        - command: create_entry
          params:
            lemma: "زَمَنُ النَّفَاذِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُدَّةُ الوُلُوجِ"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق في المعجم الموحد لمصطلحات تقانة المعلومات (2011) الصادر عن أليكسو؛ تعريفه «الزمن اللازم للوصول إلى مواقع التخزين» يطابق المفهوم. «الولوج» مصطلح حاسوبي رسمي بمعنى access."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُستعمل في المصطلحية الرسمية لتقانة المعلومات (أليكسو)؛ «مدّة» تؤكّد البُعد الزمني الممتدّ و«الولوج» يدلّ على الدخول إلى منظومة التخزين"
      actions:
        - command: create_entry
          params:
            lemma: "مُدَّةُ الوُلُوجِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "زَمَنُ الوُصُولِ"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق كمقابل لـ access time في مسرد التربية (أليكسو) ومعجم النفط. «الوصول» أعمّ من «النفاذ» و«الولوج» لكنّه مقبول في السياقات غير المتخصّصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "أعمّ دلالةً من «زمن النفاذ»؛ يُستعمل في السياقات التعليمية والعامّة حيث لا يُشترط التمييز الدقيق بين أنواع النفاذ"
      actions:
        - command: create_entry
          params:
            lemma: "زَمَنُ الوُصُولِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَلَبُّث"
      source: stage1
      decision: removed
      decision_reason: "المصطلح موثّق بمعنى latency (الكُمون الشبكي) لا access time. وإن تقاربَ المفهومان، فالتلبّث يدلّ على تأخّر الإشارة في الشبكة لا على زمن الوصول إلى بيانات القرص تحديداً."
      evidence_assessment:
        case: contradicts_only


