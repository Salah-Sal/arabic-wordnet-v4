# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-05100231-n
# fair chance / sporting chance — احتمال معقول للنجاح
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (احتمال معقول، فرصة عادلة) عبارتان وصفيتان حرّتان وليستا مصطلحين مسكوكين"
      - "«فرصة عادلة» ترجمة حرفية لـ fair chance؛ «عادلة» بمعنى المُنصِفة لا تتلاءم دلالياً مع «فرصة» في العربية"
      - "التعريف العربي الحالي (احتمال معقول للنجاح) يكاد يكون تكراراً للمّة الأولى مع إضافة المتعلّق"
    observations: "المفهوم الإنجليزي (fair chance / sporting chance) تعبير اصطلاحي يدلّ على احتمال لا بأس به للنجاح، وهو مفهوم يُعبَّر عنه في العربية بتراكيب وصفية متعددة (حظ معقول، احتمال لا بأس به، فرصة معقولة) لا بمصطلح مفرد ثابت. الحقل الدلالي يقع بين الاحتمال (probability) والحظ (chance/fortune) والفرصة (opportunity)."
  blind_candidates:
    - lemma: "حَظٌّ مَعْقُولٌ"
      generation_method: tarkib
      justification: "تركيب وصفي من «حظّ» (النصيب والبخت) و«معقول» (المقبول عقلاً)؛ يؤدي معنى «فرصة معقولة للنجاح» بصورة طبيعية في الاستعمال العربي المعاصر"
    - lemma: "فُرْصَةٌ سَانِحَةٌ"
      generation_method: tarkib
      justification: "تركيب وصفي من «فرصة» (النوبة والوقت المناسب) و«سانحة» (مواتية)؛ لكنه يدلّ على فرصة متاحة أكثر من كونه احتمالاً إحصائياً"
    - lemma: "أَرْجَحِيَّةٌ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «أرجح» (الأكثر رجحاناً)؛ يدلّ على الاحتمال الأرجح أو الأكثر ترجيحاً؛ مستعمل في المعجمية المعاصرة بمعنى likelihood"
    - lemma: "مَظِنَّةُ نَجَاحٍ"
      generation_method: tarkib
      justification: "تركيب إضافي من «مظنّة» (الموضع الذي يُظنّ فيه الشيء) و«نجاح»؛ يدلّ على المكان أو الحال الذي يُتوقَّع فيه النجاح"

stage2_evidence:
  per_lemma:
    - lemma: "اِحْتِمَالٌ مَعْقُولٌ"
      confirm:
        - text: "«(في الفلسفة): ما يمكن توقع حدوثه. قال الجرجاني: ما لا يكون تصور طرفيه كاملاً, بل يتردد في النسبة بينهما. ويراد به الإمكان»"
          source: "المعجم الكبير"
        - text: "«احتمال: أرجحيةُ وقوعِ حادثة، يمكِن تقديرُها رياضياً غالباً»"
          source: "معجم مصطلحات المعلوماتية"
      expands:
        - text: "«الاحتمال: لغة: العفو والإغضاء وإتعاب النفس في الحسيات ونحو ذلك، وفي اصطلاح الفقهاء يستعمل بمعنى الوهم والجواز فيكون لازما، وبمعنى الاقتضاء والتضمين فيكون متعديا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الاحتمال في الاصطلاح الفقهي يشمل معنى الجواز والوهم، وهو أوسع من المعنى الإحصائي المراد هنا"
    - lemma: "فُرْصَة عَادِلَة"
      contradicts:
        - text: "«الفُرْصَة: النوبة تكون بين القوم يتناوبونها على الماء. ويقال: انتهز فلان الفرصة: اغتنمها وفاز بها»"
          source: "المعجم الوسيط"
          conflict: "الفرصة في العربية تدلّ على الوقت المناسب أو النوبة، لا على الاحتمال الإحصائي؛ والوصف بـ«عادلة» لا يتلاءم معها دلالياً"
      expands:
        - text: "«ثُمَّ يُقَالُ لِلنُّهْزَةِ فُرْصَةٌ، لِأَنَّهَا خِلْسَةٌ، كَأَنَّهَا اقْتِطَاعُ شَيْءٍ بِعَجَلَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الفرصة من الاقتطاع والنُّهزة، مما يبعدها عن دلالة الاحتمال المحايد"
    - lemma: "حَظٌّ مَعْقُولٌ"
      confirm:
        - text: "«الحَظُّ: النَّصِيبُ من الفضْلِ والخيْرِ، عِلْمًا أو مالاً أو غيرهما. البَخْتُ والجدُّ»"
          source: "المعجم الكبير"
      expands:
        - text: "«(حَظَّ) الْحَاءُ وَالظَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ النَّصِيبُ وَالْجَدُّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر حظظ يدور حول النصيب والجَدّ، فيناسب الحظ بمعنى chance في الإنجليزية"
    - lemma: "فُرْصَةٌ سَانِحَةٌ"
      contradicts:
        - text: "«الفرصة: اختلاس الشيء حذرا من فواته»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الفرصة السانحة تعني الفرصة المتاحة الآن، لا الاحتمال المعقول للنجاح"
    - lemma: "أَرْجَحِيَّةٌ"
      confirm:
        - text: "«أرجحية: احتمال حدوث حدث ما ضمن فئة أو صنف معين»"
          source: "معجم البيانات والذكاء الاصطناعي"
      contradicts:
        - text: "«احتمال؛ توقُّع؛ إمكانيّة؛ ترجُّح؛ أرجحيّة»"
          source: "المورد الحديث"
          conflict: "أرجحية مرادف لـ likelihood وهو مفهوم أعمّ من «احتمال معقول للنجاح» — لا يتضمّن شرط المعقولية ولا يتقيّد بالنجاح"
    - lemma: "مَظِنَّةُ نَجَاحٍ"
      confirm:
        - text: "«مَظِنَّةُ الشيء: مَوْضِعُهُ ومَأْلَفُه الذي يُظَن كونه فيه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(مَظَنَّة) الشَّيْء مَوْضِعه ومألفه الَّذِي يظنّ كَونه فِيهِ»"
          source: "المعجم الوسيط (مجموعة المؤلفين)"
          conflict: "المظنّة تدلّ على المكان أو المرجع الذي يُتوقَّع فيه وجود الشيء، لا على درجة الاحتمال ذاتها"

stage3_analysis:
  per_lemma:
    - lemma: "اِحْتِمَالٌ مَعْقُولٌ"
      decision: confirmed
      decision_reason: "تركيب وصفي طبيعي يؤدي المعنى المطلوب بدقة: الاحتمال (probability) + معقول (reasonable). مستعمل في الخطاب العربي المعاصر العلمي والإعلامي. لا يوجد مصطلح مفرد عربي يغني عنه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على البُعد الإحصائي والعقلاني للاحتمال؛ أقرب إلى لغة التحليل والتقدير الموضوعي"
      actions:
        - command: update_lemma
