            entry_id: "{auto}"
            new_lemma: "اِحْتِمَالٌ مَعْقُولٌ"
    - lemma: "فُرْصَة عَادِلَة"
      decision: removed
      decision_reason: "ترجمة حرفية عمياء لـ fair chance؛ كلمة «عادلة» (مُنصِفة) لا تتلاءم دلالياً مع «فرصة» في العربية، إذ لا يُقال «فرصة عادلة» بل «فرصة جيدة» أو «فرصة معقولة». التركيب لا يمثّل وحدة معجمية ثابتة وليس له شاهد في المعاجم العربية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "حَظٌّ مَعْقُولٌ"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب وصفي طبيعي من «حظ» (النصيب والبخت) و«معقول» (المقبول عقلاً). أقرب إلى الاستعمال العامّ من «احتمال معقول» الأكثر تخصصاً. يُستعمل في اللغة المعاصرة بمعنى a fair/reasonable chance."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على البُعد الحَدْسي والعُرفي للحظ والبخت؛ أقرب إلى لغة الحياة اليومية من «احتمال معقول» ذي الطابع التحليلي"
      actions:
        - command: create_entry
          params: {lemma: "حَظٌّ مَعْقُولٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فُرْصَةٌ سَانِحَةٌ"
      source: stage1
      decision: removed
      decision_reason: "الفرصة السانحة تدلّ على فرصة متاحة الآن ينبغي اغتنامها، لا على درجة احتمال النجاح. الدلالة مختلفة جوهرياً عن المفهوم المطلوب."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
    - lemma: "أَرْجَحِيَّةٌ"
      source: stage1
