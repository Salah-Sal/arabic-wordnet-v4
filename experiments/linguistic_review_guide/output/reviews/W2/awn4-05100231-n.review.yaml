      decision_reason: "أرجحية مرادف لـ likelihood وهو مفهوم أعمّ يدلّ على درجة الاحتمال عموماً، ولا يتضمّن شرط «المعقولية» ولا التقييد بالنجاح. يناسب المجموعة الأمّ (awn4-05098974-n) أكثر من هذه المجموعة الفرعية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "مَظِنَّةُ نَجَاحٍ"
      source: stage1
