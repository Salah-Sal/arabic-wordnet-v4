# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي (صفة الامتثال للقانون) مقتضبٌ ويفتقر إلى الجنس القريب الصريح والفصل النوعي الكافي"
      - "قد يُثير التداخلُ بين قانونية (الامتثال للقانون الوضعي المُقنَّن) ومشروعية (legitimacy — الموافقة للمنظومة القانونية والمبادئ العامة) لَبْسًا في الحدود الدلالية داخل المجموعة"
      - "لمّة شرعية (جذر شرع) غائبة عن المجموعة رغم أن معاجم القانون ترصدها مقابلاً مباشراً لـlegality؛ تستحق دراسة الإضافة في مراجعة مستقلة"
    observations: "المفهوم المطلوب (صفة الامتثال للقانون = lawfulness) يتوقَّع له في العربية مصطلحان رئيسيان: مشروعية المشتقة من الجذر العربي الأصيل شرع (وهو الأوفر تأصيلاً وتوثيقاً)، وقانونية المبنية على 'قانون' المعرَّب من اليونانية κανών. يُمثِّل الوزن الصرفي مَفْعُولِيَّة في 'مشروعية' قياساً منتجاً لبناء المصادر الصناعية الدالة على الخصائص المجردة (legitimacy/lawfulness). تجدر مراقبة لمّة شرعية التي تربطها بـlegalityعلاقة ترادف مباشر في معجم القانون الموحَّد."
  blind_candidates:
    - lemma: "مَشْرُوعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'مشروع' (اسم مفعول على وزن مَفْعُول من الجذر شرع) على نمط مَفْعُولِيَّة؛ يدل على خاصية كون الفعل أو التصرف موافقاً للشريعة والقانون"
    - lemma: "قَانُونِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'قانوني' النسبي على نمط فَاعُولِيَّة؛ يدل على صفة المطابقة للقانون الوضعي المكتوب، وإن كان 'قانون' معرَّباً من اليونانية قبل الاشتقاق"
    - lemma: "نَظَامِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'نظامي' (جذر نظم)؛ يدل نظرياً على خاصية الانسجام مع النظام القانوني والتشريعي، والنظام يُستعمل في العربية بمعنى القانون واللائحة"
    - lemma: "اِسْتِقَامَة"
      generation_method: majaz
      justification: "إزاحة دلالية: الاستقامة في الأصل مجاورةُ الصراط المستقيم وعدم الانحراف عنه، يمكن توسيعها مجازاً لتشمل الالتزام بأحكام القانون والسير في حدوده"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "قَانُونِيَّة"
      confirm:
        - text: "«(1) التزام القانون [أو المحافظة عليه] (2) قانونية؛ شرعية — legality of an act (3) pl.: التزامات مفروضة قانونًا»"
          source: "المورد الحديث (2008) — ترجمة مدخل legality"
        - text: "«(1) قانوني: مطابق للقانون أو مرخَّص به قانونًا — lawful acts (2) شرعي — the lawful king (3) مطيع للقانون — lawful citizens»"
          source: "المورد الحديث (2008) — ترجمة مدخل lawful"

    - lemma: "مَشْرُوعِيَّة"
      confirm:
        - text: "«مشروعية — legitimacy [domain: Law]»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«مشروعية — legitimacy [domain: Philosophy and Psychology]»"
          source: "مسرد الفلسفة وعلم النفس — المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«رقابة المشروعية — legality audit [domain: Commerce and Accounting]»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يُثبت استخدام مشروعية بمعنى الامتثال القانوني في سياق المراجعة والرقابة القانونية، لا الشرعية الدينية وحدها؛ ويعكس توسُّع الدلالة ليشمل الـlegality"
        - text: "«الشرط المخالف للقانون أو النظام العام أو للأخلاق والآداب العامة»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — تعريف 'شرط غير مشروع، شرط غير جائز'"
          addition: "تعريف اللامشروعية بالمخالفة للقانون يُثبت بالمفهوم السلبي أن المشروعية = الموافقة للقانون الوضعي"

    - lemma: "نَظَامِيَّة"
      contradicts:
        - text: "«نِظامِيَّة — normalcy [domain: The Unified Medical Dictionary]»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "تدل نظامية في المصطلحية الطبية على الحالة الطبيعية (normalcy) لا على الامتثال القانوني؛ معنى مختلف تماماً عن المطلوب"
        - text: "«نِظَامِيَّة — normality [domain: Pharmacy]»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "تُستعمل في الصيدلة بمعنى الطبيعية (normality) كذلك؛ وهذا يُرسِّخ معناً موازياً يُعيق توظيفها قانونياً"
        - text: "«النظامية: أصحاب إبراهيم النظام، وهو من شياطين القدرية. طالع كتب الفلسفة وخلط كلامهم بكلام المعتزلة»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت ١٠٣١هـ)"
          conflict: "في التراث الكلاسيكي تحيل النظامية إلى فرقة معتزلية؛ هذا الحِمل التراثي يجعلها غير صالحة للتوظيف القانوني الحديث"

    - lemma: "اِسْتِقَامَة"
      contradicts:
        - text: "«استقامة — alignment [domain: Civil Engineering]»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "تعني المحاذاة الهندسية في الاصطلاح التقني، لا الامتثال القانوني"
        - text: "«استقامة — rectitude [domain: Philosophy and Psychology]»"
          source: "مسرد الفلسفة وعلم النفس — المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "تعني النزاهة الأخلاقية والاستقامة الخُلقية؛ هذا المعنى أخلاقي لا قانوني"
      expands:
        - text: "«الاستقامة: هي كون الخط بحيث تنطبق أجزاؤه المفروضة بعضها على بعض. وفي اصطلاح أهل الحقيقة: هي الوفاء بالعهود كلها، وملازمة الصراط المستقيم برعاية حد التوسط في كل الأمور من الطعام والشراب واللباس، وفي كل أمر ديني ودنيوي»"
          source: "كتاب التعريفات للشريف الجرجاني (ت ٨١٦هـ)"
          addition: "يُثبت أن الاستقامة تُستعمل في التراث في السياق الروحاني والأخلاقي لا القانوني الوضعي؛ الإزاحة الدلالية المقترحة تفتقر إلى سابقة معجمية موثَّقة في هذا الحقل"


