      - "اللمّتان الموجودتان كلتاهما مركّبتان؛ لا توجد لمّة مفردة تغطّي المفهوم"
      - "التشكيل غائب عن اللمّتين الموجودتين"
    observations: "المفهوم — اللغة التي ينشأ عليها المتكلم منذ طفولته — مفهوم لسانيّ حديث يُعبَّر عنه في العربية بمركّبات إضافية أو وصفية. الاستعمال الأكثر شيوعاً في المصادر المصطلحية العربية هو «لغة أمّ» ويليه «لغة المنشإ» و«لغة المولد». أما «لغة أصلية» فيحمل دلالة مصطلحية مختلفة في اللسانيات."
  blind_candidates:
    - lemma: "لُغَةُ المَهْدِ"
      generation_method: majaz
      justification: "مجاز مرسل: المهد يرمز إلى مرحلة الطفولة المبكرة التي يكتسب فيها الإنسان لغته الأولى، فسُمّيت اللغة باسم ظرف اكتسابها"
    - lemma: "لُغَةٌ أُمّ"
      generation_method: tarkib
      justification: "مركب إضافي ثابت، من أكثر التعبيرات شيوعاً للدلالة على لغة المرء الأولى، بإضافة اللغة إلى الأمّ بوصفها أصل النشأة"
    - lemma: "لِسَانٌ أَوَّل"
      generation_method: tarkib
      justification: "مركب وصفي يصف اللسان (اللغة) بالأوّلية الزمنية، أي أنها أول لغة اكتسبها المتكلم"
    - lemma: "لُغَةٌ فِطْرِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «لغة» + «فطرية» (مصدر صناعي من فِطْرة)، يدل على أن اللغة مكتسبة بالفطرة والنشأة الطبيعية لا بالتعلم المتعمد"


