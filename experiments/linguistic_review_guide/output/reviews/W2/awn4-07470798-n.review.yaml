# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-07470798-n
# المفهوم: حدث تم بيع جميع تذاكره (sellout)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان عبارتان وصفيتان مطوّلتان ('حدث كامل العدد'، 'عرض مباع بالكامل') بدلاً من مصطلحات معجمية مركّزة."
      - "اللمّة 'عرض مباع بالكامل' تقيّد المفهوم بالعروض فقط، بينما المجموعة تشمل أيّ حدث نفدت تذاكره."
      - "التعريف العربي الحالي ('حدث تم بيع جميع تذاكره') أقرب إلى الترجمة الحرفية منه إلى التعريف المعجمي المُحكم."
    observations: "المفهوم يدور حول حدث اجتماعي بلغ الحدّ الأقصى من الحضور ببيع جميع تذاكره. في الاستعمال العربي المعاصر يُستخدم تعبير 'كامل العدد' للدلالة على هذا المفهوم في مجال الفنون والترفيه والرياضة، وهو مصطلح مسجّل لدى المنظمة العربية للتربية والثقافة والعلوم (أليكسو). كما يُستخدم 'نافد' بمعنى ما نفدت تذاكره."
  blind_candidates:
    - lemma: "كَامِلُ الْعَدَدِ"
      generation_method: tarkib
      justification: "تركيب إضافي مسكوك في مجال الترفيه والرياضة يدل على الحدث الذي اكتمل عدد حضوره ببيع جميع تذاكره، مقابل المصطلح الإنجليزي full house."
    - lemma: "نَافِدُ التَّذَاكِرِ"
      generation_method: tarkib
      justification: "تركيب إضافي من اسم الفاعل 'نافد' (من نَفِدَ: فنِيَ وانقطع) مضافاً إلى 'التذاكر'، يصف الحدث الذي نفدت تذاكره كلّها."
    - lemma: "مُكْتَظٌّ"
      generation_method: majaz
      justification: "إزاحة دلالية من الاكتظاظ المادي (الامتلاء) إلى المفهوم المجازي: حدث امتلأ بالحضور حتى نفدت تذاكره."
    - lemma: "مَحْجُوزٌ بِالْكَامِلِ"
      generation_method: tarkib
      justification: "تركيب وصفي من اسم المفعول 'محجوز' (من حَجَزَ) مع شبه الجملة 'بالكامل'، يدل على حجز جميع المقاعد."

stage2_evidence:
  per_lemma:
    - lemma: "حَدَثٌ كَامِلُ الْعَدَدِ"
      expands:
        - text: "«كامل العدد»"
          source: "مسرد الفن والتسلية والرياضة، أليكسو (ArabTerm)"
          addition: "المصطلح 'كامل العدد' مسجّل مقابل full house في مجال الفنون والرياضة (entry 493897)، لكنّه مسجّل بدون كلمة 'حدث' قبله."
    - lemma: "عَرْضٌ مُبَاعٌ بِالْكَامِلِ"
      contradicts:
        - text: "«مَبيع، نافِد — عرض مسرحي أو سينمائي نفدت كل بطاقاته (بيعت كل بطاقاته)»"
          source: "مسرد الإعلام والتواصل، أليكسو (ArabTerm)"
          conflict: "المصدر يستخدم 'مبيع' أو 'نافد' كمصطلح مركّز، لا 'عرض مباع بالكامل' كعبارة وصفية كاملة. كما أنّ 'عرض' يقيّد المفهوم بالعروض المسرحية والسينمائية فقط."
    - lemma: "كَامِلُ الْعَدَدِ"
      confirm:
        - text: "«كامل العدد»"
          source: "مسرد الفن والتسلية والرياضة، أليكسو (ArabTerm)"
        - text: "«كامل العدد»"
          source: "مسرد الفن والتسلية والرياضة، أليكسو (ArabTerm) — entry 493899"
      expands:
        - text: "«(كَمَلَ) الْكَافُ وَالْمِيمُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَمَامِ الشَّيْءِ. يُقَالُ: كَمَلَ الشَّيْءُ وَكَمُلَ فَهُوَ كَامِلٌ، أَيْ تَامٌّ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (كمل) يدل على التمام والاكتمال، مما يدعم دلالة 'كامل العدد' على بلوغ الحدّ الأقصى من العدد."
    - lemma: "نَافِدُ التَّذَاكِرِ"
      confirm:
        - text: "«مَبيع، نافِد — عرض مسرحي أو سينمائي نفدت كل بطاقاته (بيعت كل بطاقاته)»"
          source: "مسرد الإعلام والتواصل، أليكسو (ArabTerm)"
      expands:
        - text: "«(نَفِدَ) النُّونُ وَالْفَاءُ وَالدَّالُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْقِطَاعِ شَيْءٍ وَفَنَائِهِ. وَنَفِدَ الشَّيْءُ يَنْفَدُ نَفَادًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (نفد) يدل على الفناء والانقطاع، مما يدعم دلالة 'نافد' على نفاد التذاكر."
        - text: "«نَفِدَ الشيْءُ نفدا ونفاداً: فنِيَ وذهب»"
          source: "المعجم الوسيط"
          addition: "المعجم الوسيط يؤكد أنّ نَفِدَ بمعنى فنِي وذهب، واسم الفاعل 'نافد' بمعنى فانٍ."
    - lemma: "مُكْتَظٌّ"
      contradicts:
        - text: "«قاعة غاصّة — ملأى حتّى لم يبق فيها مكان خال»"
          source: "مسرد الإعلام والتواصل، أليكسو (ArabTerm)"
          conflict: "المصدر يستخدم 'غاصّة' لا 'مكتظ' للدلالة على الامتلاء، و'مكتظ' يدل على الازدحام المادي لا على نفاد التذاكر بالضرورة."
    - lemma: "مَحْجُوزٌ بِالْكَامِلِ"
      confirm:
        - text: "«محجوزٌ بالكامل — a sold-out house for both performances»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«المَحْجُوزُ: المصابُ في مَوْضِعِ الحُجْزَةِ من وسطه»"
          source: "المعجم الكبير"
          conflict: "الدلالة الأصلية لـ'محجوز' في المعاجم الكلاسيكية بعيدة عن معنى الحجز بمفهومه المعاصر (reservation)."

