stage1_review:
  assessment:
    concerns:
      - "قائمة اللمات الحالية محدودة، ويمكن إثراؤها بمترادفات أخرى تعبر عن نفس المفهوم من جذور مختلفة (مثل فتر، نحل)."
    observations: "المجموعة تعبر عن الفاعل أو السبب الذي يؤدي إلى الضعف. اللمتان الموجودتان (مُضْعِف ومُوْهِن) صحيحتان ودقيقتان، وتستخدمان في سياقات لغوية عامة وتقنية (طبية وفيزيائية)."
  blind_candidates:
    - lemma: "مُضْعِف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'أضعف'، وهو التعبير المباشر عن المفهوم."
    - lemma: "مُوْهِن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'أوهن'، ويعبر عن إضعاف القوة أو العزيمة، وهو فصيح وشائع."
    - lemma: "مُفَتِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'فتر' (بمعنى أضعف وأسكن)، ويستخدم غالباً فيما يضعف الجسم أو الحواس."
    - lemma: "عَامِلُ إِضْعَاف"
      generation_method: tarkib
      justification: "تركيب وصفي تحليلي يعبر عن المفهوم بوضوح في السياقات العلمية."

stage2_evidence:
  per_lemma:
    - lemma: "مُضْعِف"
      confirm:
        - text: "«مُضْعِف: debilitant»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُضْعِف: attenuator»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«المُضْعِفُ: مَنْ هَزُلَتْ دابَّتُه ونحوها، أو مرِضَتْ وذهبتْ قُوَّتُها.»"
          source: "المعجم الكبير"
    - lemma: "مُوْهِن"
      confirm:
        - text: "«مُوْهِن: attenuator / hypostheniant»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُوهِن: attenuator»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      expands:
        - text: "«أَوْهَنْتُهُ أَنَا. وَمِنْ هَذَا الْوَاهِنَةُ...»"
          source: "مقاييس اللغة"
    - lemma: "مُفَتِّر"
      confirm:
        - text: "«فَتَّرَ ... الشرابُ الجسمَ: جعله خامداً خاملاً»"
          source: "المعجم الوسيط"
        - text: "«أَفْتَرَ ... الداءُ ونحوه فلاناً: أضعفه»"
          source: "المعجم الوسيط"
    - lemma: "مُنْحِل"
      confirm:
        - text: "«أَنْحَلَ فلاناً: أضعفه وأهزله»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "مُضْعِف"
      decision: confirmed
      decision_reason: "مصطلح أساسي ومباشر، تؤكده المعاجم الطبية والتقنية كترجمة لـ weakener و attenuator."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُضْعِف"
    - lemma: "مُوْهِن"
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر عن إضعاف القوة (الوهن)، وشائع في المعاجم العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوْهِن"
    - lemma: "مُفَتِّر"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل فصيح (من فتّر)، يعبر عن التسبب في الفتور والضعف، وله أصل في الحديث الشريف والمعاجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُفَتِّر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09499651-n"}
    - lemma: "مُنْحِل"
      source: stage1
      decision: confirmed
      decision_reason: "من الفعل 'أنحل' بمعنى أضعف وأهزل، وهو دقيق لوصف ما يسلب القوة والبدن عافيته."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُنْحِل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09499651-n"}

stage4_content:
  definition:
    current: "ما يُضعف أو يسبب فقدان القوة"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح ولكنه يحتاج إلى إثراء لبيان شموله لضعف البدن والعزيمة."
    authored:
      - type: terminological
        text: "كُلُّ ما يَقِلُّ بِهِ الجُهْدُ أو تَنْحَلُّ بِهِ القُوَّةُ ويُفْقَدُ بِهِ النَّشاطُ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09499651-n", definition_index: 0, text: "كُلُّ ما يُسَبِّبُ الضَّعْفَ أو يُؤَدِّي إلى فُقْدانِ القُوَّةِ والنَّشاطِ."}
  examples:
    per_lemma:
      - lemma: "مُضْعِف"
        examples:
          - text: "يُعْتَبَرُ الجُوعُ الشَّدِيدُ مُضْعِفاً لِقُدْرَةِ الجُسْمِ على التَّحَمُّلِ."
            type: usage
      - lemma: "مُوْهِن"
        examples:
          - text: "كانَتِ الصَّدَمَاتُ المُتَتَالِيَةُ مُوهِناً لِعَزِيمَتِهِ القَوِيَّةِ."
            type: usage
      - lemma: "مُفَتِّر"
        examples:
          - text: "نَهَى الطَّبِيبُ المَرِيضَ عَنْ تَعَاطِي بَعْضِ الأَدْوِيَةِ الَّتِي تَعْمَلُ كَمُفَتِّراتٍ لِلأَعْصَابِ."
            type: usage
      - lemma: "مُنْحِل"
        examples:
          - text: "يُعَدُّ المَرَضُ العُضَالُ مُنْحِلاً لِلْبَدَنِ ومُذْهِباً لِلْعَافِيَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-09499651-n", text: "تُعَدُّ بَعْضُ المَوادِّ الكِيمِيائِيَّةِ مُضْعِفاً لِلرَّوابِطِ الجُزَيْئِيَّةِ."}

