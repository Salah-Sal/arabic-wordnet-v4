stage1_review:
  assessment:
    concerns:
      - اللمة الوحيدة الموجودة تفتقر إلى التشكيل الكامل.
      - التعريف الحالي يميل إلى الوصفية البسيطة ويمكن تحسينه بأسلوب معجمي رصين.
    observations: "المجموعة تعبر عن مفهوم 'عربون المحبة' أو 'تذكار الحب' (love-token)، وهو شيء مادي يقدم كرمز للمودة. المصطلح العربي الأكثر شيوعاً هو 'عربون محبة' وهو استخدام مجازي للفظ العربون (الذي يعني في الأصل مقدم الثمن)."
  blind_candidates:
    - lemma: "عُرْبُونُ مَحَبَّةٍ"
      generation_method: majaz
      justification: "استخدام مجازي شائع لكلمة 'عربون' للتعبير عن الالتزام أو العلامة الصادقة على المحبة."
    - lemma: "تِذْكَارُ حُبٍّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين الجنس (تذكار) والنوع (حب) ليعبر بدقة عن التعريف."
    - lemma: "أَمَارَةُ وُدٍّ"
      generation_method: tarkib
      justification: "استخدام لفظ 'أمارة' بمعنى العلامة مضافاً إلى 'الود' للتعبير عن الرمز العاطفي."
    - lemma: "رَمْزُ مَحَبَّةٍ"
      generation_method: tarkib
      justification: "ترجمة دقيقة ومباشرة للمفهوم الإنجليزي (token of love) باستخدام كلمات فصيحة."

