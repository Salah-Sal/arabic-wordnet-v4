stage1_review:
  assessment:
    concerns:
      - "الخلط الشائع بين التجربة (الحدث الفردي) والخبرة (المعرفة المتراكمة)."
    observations: "المجموعة الترادفية تمثل مفهوم التجربة كحدث مدرك أو معاش، وهو ما يتفق مع مدلول 'تجربة' في السياق الشخصي و'معايشة' في السياق الزمني والوجداني."
  blind_candidates:
    - lemma: "تَجْرِبَة"
      generation_method: ishtiqaq
      justification: "اللفظ الأساسي المعبر عن المرور بحدث معين واختباره."
    - lemma: "خِبْرَة"
      generation_method: ishtiqaq
      justification: "تُستخدم للدلالة على الحدث المعاش وما ينتج عنه من معرفة."
    - lemma: "مُعَايَشَة"
      generation_method: ishtiqaq
      justification: "المصدر من 'عايش'، ويدل على الانخراط في الحدث وعيش تفاصيله."
    - lemma: "مُعَايَنَة"
      generation_method: ishtiqaq
      justification: "الإدراك المباشر للحدث بالرؤية أو الحضور."

stage2_evidence:
  per_lemma:
    - lemma: "تجربة"
      confirm:
        - text: "«المعرفة أو المهارة أو الخبرة التى يستخلصها الإنسان من مشاركته فى أحداث الحياة أو ملاحظته لها ملاحظة مباشرة»"
          source: "المعجم الكبير"
    - lemma: "خبرة"
      confirm:
        - text: "«العِلْم بالشيء. يقال: لى بالشيءِ خِبْرَةٌ العِلْمُ بالظاهر والباطن بالخفايا الباطنة»"
          source: "المعجم الكبير"
      expands:
        - text: "«مهارة تكتسب من المشاركة في أحداث وملاحظات تميز بين مصدرين لتجربتها عبر (المعاينة / التّقصي).»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "معايشة"
      confirm:
        - text: "«عاش الأحداثَ: عاصرها، أدركها»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«المُعاصَرة: معايشة الحاضر بالوجدان والسُّلوك والإفادة من كلّ منجزاته العلميَّة والفكريَّة وتسخيرها لخدمة الإنسان ورقيّه.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "معاينة"
      contradicts:
        - text: "«فحص بالعين.»"
          source: "معجم المصطلحات الطبية"
          conflict: "المعاينة تقتصر على الفحص البصري أو المعملي بينما التجربة أعم وأشمل وجدانياً وعملياً."

stage3_analysis:
  per_lemma:
    - lemma: "تجربة"
      decision: confirmed
      decision_reason: "اللفظ الأصيل والمعاصر للتعبير عن الحدث المعاش أو المختبر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجْرِبَة"
    - lemma: "خبرة"
      decision: confirmed
      decision_reason: "على الرغم من دلالتها الغالبة على المهارة، إلا أنها تُستخدم في السياق المعجمي كمرادف للتجربة المباشرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خِبْرَة"
    - lemma: "معايشة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ دقيق يعبر عن الجانب الوجداني والزمني للحدث (Lived experience)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُعَايَشَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07300108-n"
    - lemma: "معاينة"
      decision: removed
      decision_reason: "دلالتها الفنية في العصر الحديث انحصرت في الفحص المادي أو الطبي أو أخذ العينات."

stage4_content:
  definition:
    current: "حدث كما يتم إدراكه أو عيشه"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية، ويحتاج لصياغة معجمية عربية تعكس ماهية التجربة كحدث تراكمي أو انفعالي."
    authored:
      - type: terminological
        text: "مَا يَمُرُّ بِهِ الْإِنْسَانُ مِنْ أَحْدَاثٍ أَوْ مَوَاقِفَ حَيَاتِيَّةٍ يَنْفَعِلُ بِهَا وَيَكْتَسِبُ مِنْهَا مَعْرِفَةً أَوْ مَهَارَةً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَجْرِبَة"
        examples:
          - text: "كَانَتْ رِحْلَتُهُ إِلَى الْقُطْبِ تَجْرِبَةً فَرِيدَةً لَا تُنْسَى."
            type: usage
      - lemma: "خِبْرَة"
        examples:
          - text: "اكْتَسَبَ الْعَالِمُ خِبْرَةً وَاسِعَةً مِنْ خِلَالِ سَنَوَاتِ الْبَحْثِ الْمَيْدَانِيِّ."
            type: usage
      - lemma: "مُعَايَشَة"
        examples:
          - text: "تَتَطَلَّبُ كِتَابَةُ الرِّوَايَةِ الْوَاقِعِيَّةِ مُعَايَشَةً دَقِيقَةً لِلْمُجْتَمَعِ."
            type: usage
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-07300108-n"
        definition_index: 0
        text: "مَا يَمُرُّ بِهِ الْإِنْسَانُ مِنْ أَحْدَاثٍ أَوْ مَوَاقِفَ حَيَاتِيَّةٍ يَنْفَعِلُ بِهَا وَيَكْتَسِبُ مِنْهَا مَعْرِفَةً أَوْ مَهَارَةً."

