# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائري: يستخدم لفظ 'إسقاط' في صياغة التعريف بينما 'إسقاط' هي اللمة الأولى للمجموعة ذاتها"
      - "اللمة المركبة 'عرض ضوئي' لم تُعثر عليها بهذا التركيب المقيَّد في المعاجم المتخصصة المستعلَمة"
      - "اللمتان الحاليتان خاليتان من التشكيل الكامل"
    observations: >
      تُمثّل هذه المجموعة مفهومَ الإسقاط السينمائي (film projection) تحديدًا، وهو عملية تحويل صور
      الشريط الفوتوغرافي إلى صور مُضاءة على شاشة العرض. اللمة 'إسقاط' مصطلح تقني راسخ توثِّقه
      معاجم المصطلحات الحديثة (ARABTERM) في مجالات متعددة بمعنى projection، وله شاهد مباشر في
      مجال الطباعة والكهرباء بالتعريف "عملية اسقاط صورة فوتوغرافية بطريقة الاسقاط الضوئي".
      أما 'عرض ضوئي' فتركيب وصفي حديث يُركّز على الطابع البصري-الضوئي للنتيجة من منظور المشاهِد،
      ويُستخدم في العربية الإعلامية والسينمائية. يستحق كلا المصطلحَيْن التأكيد مع تمييز دقيق
      في الظلال الدلالية. المجموعة الأعلى (اتصال مرئي) ملائمة.
  blind_candidates:
    - lemma: "إِلْقَاءٌ"
      generation_method: majaz
      justification: "من 'ألقى يُلقي' بمعنى رمى وطرح؛ التوسع الدلالي المجازي يُحيل إلى 'إلقاء الصورة/الضوء' على الشاشة، نظير ما يُقال 'ألقى الضوء على الموضوع'. الجذر لقي يدل أصلاً على التوافي والطرح."
    - lemma: "تَجْلِيَةٌ"
      generation_method: ishtiqaq
      justification: "من جذر جلو/جلا على وزن تَفْعِلة (مصدر باب التفعيل)؛ الجلاء في المعاجم: انكشاف الشيء وبروزه. وإسقاط الصورة على الشاشة يُجلّيها للمشاهد ويكشفها أمامه. الوزن تَفْعِلة صالح للعمليات (كالتصفية والتنقية)."
    - lemma: "عَرْضٌ فِيلْمِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي (عرض + نسبة إلى فيلم): يُحدّد العرض البصري بكونه مصدره الفيلم السينمائي، ويُميّزه عن العروض الرقمية أو المسرحية. صيغة وصفية منتجة في المصطلحية العربية الحديثة."
    - lemma: "انْبِثَاقٌ"
      generation_method: majaz
      justification: "من 'بثق' بمعنى انفتح واندفع الماء فجأة؛ مجازاً: الضوء 'ينبثق' من جهاز العرض ليملأ الشاشة بالصورة. وقد ورد 'الانبثاق' في معجم المناخ لـ'انبعاث ضوء من جسم'."


