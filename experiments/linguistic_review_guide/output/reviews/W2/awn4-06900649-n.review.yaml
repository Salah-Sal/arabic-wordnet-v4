# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إسقاط"
      decision: confirmed
      decision_reason: >
        اللمة موثَّقة توثيقًا قاطعًا في المعاجم التقنية الحديثة بمعنى projection، ولها شاهد مباشر
        في مجال الطباعة والكهرباء بتعريف "عملية اسقاط صورة فوتغرافية بطريقة الاسقاط الضوئي".
        التعارض مع المعنيين الطبي والفقهي لا يُخلّ بالقبول إذ اشتراك اللفظ مقبول في المصطلحية
        بحكم السياق المُحدِّد. اللمة تجتاز جميع بوابات الجودة: اطّراد، يُسر تداول، اشتقاقية (سقط
        → إسقاط)، إيثار التراثي، ملاءمة، شيوع فصيح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُصوِّر العمليةَ التقنية للإسقاط من منظور آليّ-ميكانيكي (الجهاز يُسقط الصورة على السطح)؛
        يشيع في المصطلحية العلمية والهندسية والتصويرية؛ يُعبّر عن الفعل لا النتيجة البصرية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِسْقَاطٌ"

    - lemma: "عرض ضوئي"
      decision: confirmed
      decision_reason: >
        على الرغم من غياب التركيب "عرض ضوئي" مدخلاً مستقلاً في قاعدة البيانات، فإن مكوّنيه
        موثَّقان: 'عرض' له معنى إسقاط صور الفيلم (ARABTERM: مسرد الإعلام والتواصل)، و'ضوئي'
        نسبة إلى الضوء (ضوأ). التركيب الوصفي يجتاز اختبار السكّ (لا يمكن إبدال 'ضوئي' بـ'حرّي'
        أو 'بصري' دون تغيير المعنى التقني)، ويشكّل وحدة اصطلاحية راسخة في الإعلام والسينما
        العربية للدلالة على العروض التي تعتمد تسليط الضوء. يُقبل مع تحديد التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركّز على النتيجة البصرية الضوئية من منظور المشاهِد (ما يُرى على الشاشة)؛ يُبرز طابع
        العرض وليس آلية الإسقاط؛ يُستخدم في السياقات الإعلامية والفنية والنقدية؛ أشمل من إسقاط
        إذ يصلح للعروض السينمائية والشرائح الضوئية (slide show).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرْضٌ ضَوْئِيٌّ"

    - lemma: "إلقاء"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال التقني لـ'إلقاء' في المعاجم الحديثة استقرّ على 'إلقاء الكلمة/الخطبة' (diction,
        reciting)، لا الإسقاط البصري؛ مما يُوقع في لبس دلالي حادّ مع الإسقاط السينمائي. فضلاً عن
        أن المجاز المقترح بعيد ولا يُعرَف له استعمال مسكوك في هذا المعنى.

    - lemma: "تجلية"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر لها أدلة في قاعدة البيانات المعجمية. الجذر جلو يدل على الانكشاف الذاتي
        (تجلّى الشيء = انكشف من نفسه)، وليس على إسقاط فاعل خارجي للصورة على سطح؛ فالتجلية لا
        تتضمّن دلالة الوسيط الضوئي والفيلم والشاشة المطلوبة في هذا المفهوم.

    - lemma: "عرض فيلمي"
      source: stage1
      decision: removed
      decision_reason: >
        لا يُمثّل وحدة معجمية ثابتة مسجَّلة؛ يفشل في اختبار السكّ إذ يمكن إبدال 'فيلمي' بـ
        'سينمائي' أو 'وثائقي' أو 'تسجيلي' مع الاحتفاظ بمدلول وصفي حرّ — ليس مصطلحًا مسكوكًا.

    - lemma: "انبثاق"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال التقني الموثَّق لـ'انبثاق' يخص انبعاث الغازات والأبخرة والإشارات الجيولوجية
        والإشعاع. لا شاهد واحد يربطه بالإسقاط السينمائي. المجاز مقبول لغةً لكنه مجهول المسار
        في المصطلحية السينمائية.


