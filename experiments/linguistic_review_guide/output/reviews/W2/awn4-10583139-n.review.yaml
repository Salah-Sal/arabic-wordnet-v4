# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (حَاكّ) تحمل في المعاجم الكبرى دلالةً مجازية غالبة هي (الملحّ في الطلب، النزّاع إلى الشر)، لا الدلالةَ الحرفية لمن يحكّ جلده."
      - "قيد «لتخفيف حكة» في التعريف الحالي يُضيِّق المفهوم تضييقاً قد لا يلائم مستوى التجريد المعجمي — المعاجم لا تُقيِّد اسم الفاعل حَاكّ بهذا الشرط."
      - "المُشترَك الأعلى (awn4-09786620-n: عَامِل / فَاعِل) يُلمِح إلى «العامل/المنجِز» لا إلى مجرد «الشخص»، مما قد يُشكِّل تصنيفاً هرمياً مُجحِفاً لمفهوم بسيط."
      - "المجموعة تحتوي لمّة واحدة فقط؛ يُستحسَن الفحص عن مرادفات أو بدائل اشتقاقية."
    observations: >
      المفهوم — شخص يحكّ جلده إزالةً للحكّة — مفهوم شائع في الاستعمال اليومي
      لكنه نادر التقييد المعجمي المستقل في المعاجم العربية. اللمّة حَاكّ صحيحة
      اشتقاقاً (فاعل من حكّ) وإن كانت المعاجم تُبرز الدلالة المجازية (النزّاع
      إلى الشر) أكثر من الحرفية. مقاييس اللغة يُثبت الفعل حكّ بمعنى «إمرار شيء
      على شيء» ويوثِّق الربط بالحكّ الجلدي في شاهد صريح «أحكّني رأسي فحككتُه»،
      مما يُسوِّغ الاشتقاق ويُرسِّخ الأصل الدلالي. الجذر ح-ك-ك غنيّ بالمشتقات
      وتشهد له المعاجم الطبية الحديثة أيضاً (حِكَّة = pruritus, حُكاك = itching).

  blind_candidates:
    - lemma: "حَكَّاكٌ"
      generation_method: ishtiqaq
      justification: "وزن فَعَّال من جذر حكك للدلالة على المبالغة والاعتياد؛ الحكّاك من يُكثر حكّ جلده، وهو تمييز دلالي صريح عن اسم الفاعل حاكّ."
    - lemma: "خَادِشٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من خدش (يخدش جلده بأظفاره)؛ الخدش نوع من الحكّ يُحدِث أثراً سطحياً، وقد يُستعمَل عرفاً بمعنى الحكّ بالأظافر."
    - lemma: "مُهَرِّشٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من هرّش (يُهرِّش جلده)؛ الهرش في العربية الحكّ الشديد بالأظافر، وقد وردت في تعريف المورد الحديث لـ scratch: «يحكّ أو يهرش جلده»."
    - lemma: "قَاشِرٌ"
      generation_method: majaz
      justification: "اسم فاعل من قشر؛ مجاز وظيفي من القشر (نزع الطبقة الخارجية) إلى الحكّ الذي يُمرَّر فيه الظفر على سطح الجلد."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفَّذة (٤ استعلامات):
#   Q1 — مطابقة دفعية: حاك/الحاك + حكاك/الحكاك + خادش/الخادش + مهرش/المهرش + قاشر/القاشر
#   Q2 — جسر إنجليزي: scratcher / scratch / itch / itching
#   Q3 — FTS عربي: «يحك» «حك جلده» «يهرش» «تخفيف» «حكة»
#   Q4 — مقاييس اللغة: جذر حكك (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "حَاكّ"
      confirm:
        - text: "«حاكَ: باراه في الحكّ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«أَحَكَّنِي رَأْسِي فَحَكَكْتُهُ»"
          source: "مقاييس اللغة لابن فارس (جذر حكك)"
      contradicts:
        - text: "«الحَاكُّ: الملحُّ في الطَّلَبِ صاحبُ الشَّرِّ (مجاز)»"
          source: "المعجم الكبير"
          conflict: "الدلالة الغالبة المدوَّنة مجازية (النزّاع إلى الشر)، لا الحرفية لمن يحكّ جلده"
        - text: "«الحاك: الملح في الطلب والنزاع إلى الشر»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "التقييد المعجمي المدوَّن مجازي؛ المعنى الحرفي لا يُفصَّل في المداخل المستقلة"
      expands:
        - text: "«الْحَاءُ وَالْكَافُ أَصْلٌ وَاحِدٌ، وَهُوَ أَنْ يَلْتَقِيَ شَيْئَانِ يَتَمَرَّسُ كُلُّ وَاحِدٍ مِنْهُمَا بِصَاحِبِهِ. الْحَكُّ: حَكُّكَ شَيْئًا عَلَى شَيْءٍ. يُقَالُ مَا بَقِيَتْ فِي فِيهِ حَاكَّةٌ، أَيْ سِنٌّ. وَأَحَكَّنِي رَأْسِي فَحَكَكْتُهُ. وَالْحُكَاكَةُ: مَا يُسْقَطُ مِنَ الشَّيْئَيْنِ تَحُكُّهُمَا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن حاكّة = كل شيء يحكّ (السنّ المحاكّة)، وأن حكّ الرأس (الحكّ الجلدي) مثالٌ معياريٌّ في المادة؛ الجذر مُرسَّخ دلالياً في الحركة التفريكية."

    - lemma: "حَكَّاكٌ"
      contradicts:
        - text: "«يقال: هو حَكَّاكُ شرٍّ: نَزَّاعٌ إليه مُتَسَبِّبٌ فيه»"
          source: "المعجم الكبير"
          conflict: "حَكَّاك مستعمَل حصراً في مركّب «حكاك شرّ» للنزّاع؛ لا شاهد مستقل بمعنى كثير الحكّ الجلدي"
        - text: "«يقال: هو حكاك شرّ: نزّاع إليه متسبب فيه»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال المعجمي المدوَّن مقيَّد بالمجاز؛ لا توثيق للدلالة الحرفية"
      expands:
        - text: "«حُكَاكُ: داءٌ في الجِلْد يدعُو إلى الحَكِّ، ما يسقُط من الشيء عند حكّه بآخر»"
          source: "المعجم الكبير"
          addition: "حُكاك (بضم الحاء) = داء الجلد المُوجِب للحكّ؛ يختلف عن حَكَّاك (بفتح وتشديد) الذي يعني النزّاع إلى الشر"
        - text: "«حُكاك: itching = pruritus»"
          source: "معجم المصطلحات الطبية (ARABTERM)"
          addition: "في المصطلحية الطبية الحديثة حُكاك = الحكّة مرضاً/حالةً، لا الشخص الحاكّ"

    - lemma: "خَادِشٌ"
      contradicts:
        - text: "«خادَشَ فلانٌ فلانًا مخادشةً وخِداشاً: خدَشَ كلٌّ منهما صاحبه»"
          source: "المعجم الكبير"
          conflict: "خادش في المعاجم صيغة فاعل لفعل المفاعلة (التخادش المتبادل)، لا اسم فاعل مستقل لمن يخدش نفسه"
        - text: "«خادِش: جهاز تمر فيه حبوب القمح حيث تخدش سطوحها لتسهيل دخول الماء إليها في أثناء الترطيب»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (ARABTERM)"
          conflict: "خادش في المصطلحية الحديثة جهاز ميكانيكي (scourer)، لا شخص"

    - lemma: "مُهَرِّشٌ"
      evidence_status: "no_material_found"

    - lemma: "قَاشِرٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "حَاكّ"
      decision: confirmed
      decision_reason: >
        حَاكّ هو اسم الفاعل الطبيعي والمباشر من الفعل حكّ (يحكّ)، والاشتقاق
        سليم بلا إشكال صرفي. وإن كانت المعاجم تُقدِّم الدلالة المجازية (النزّاع
        إلى الشر) في المداخل المستقلة، فإن المعنى الحرفي «مَن يحكّ» قائم في أصل
        اللفظ وموثَّق في مقاييس اللغة («أحكّني رأسي فحككتُه»). لا بديل أرسخ
        في الفصيح لهذا المفهوم. يحتاج تصحيح التشكيل (إضافة التنوين).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ حَاكّ (فاعل) يُعبِّر عن الفاعلية الآنية أو
        الوصفية لمن يحكّ جلده في سياق بعينه، في مقابل حَكَّاك (فعّال = الاعتياد
        والمبالغة) الذي يدلّ على سمة ثابتة، ومقابل خَادِش الذي يُركِّز على
        إحداث أثر ظاهر في الجلد (جرح سطحي خفيف).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَاكٌّ"

    - lemma: "حَكَّاكٌ"
      source: stage1
      decision: removed
      decision_reason: >
        حَكَّاك في المعاجم مقيَّد بالمركّب الاصطلاحي «حَكَّاك شرٍّ» (النزّاع
        المُتَسَبِّب في الشر)؛ لا شاهد مستقل على استخدامه بمعنى «من يكثر حكّ
        جلده». إضافته ستُوجِد تداخلاً مع هذه الدلالة المجازية الراسخة، ولا
        يصمد أمام اختبار التثبيت المعجمي بمعناه الحرفي.

    - lemma: "خَادِشٌ"
      source: stage1
      decision: removed
      decision_reason: >
        خَادِش في المعاجم صيغة فاعل فعل المفاعلة (التخادش المتبادل)، وفي
        المصطلحية الحديثة جهاز ميكانيكي (scourer). فضلاً عن ذلك، الخدش يعني
        إحداث أثر ظاهر في الجلد (scratch بمعنى الجرح السطحي)، بينما المجموعة
        تُعنى بالحكّ التفريكي لتخفيف الحكّة — فارق دلالي دقيق لكنه حاسم.

    - lemma: "مُهَرِّشٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوثَّق في أيّ مصدر معجمي متاح. هرّش يُستعمَل فعلاً (أُحصي في المورد
        الحديث ضمن معاني scratch: «يحكّ أو يهرش جلده»)، لكن مُهَرِّش كاسم فاعل
        مستقل للشخص الحاكّ ليس مسكوكاً في المعاجم وينتفي شرط التثبيت المعجمي.

    - lemma: "قَاشِرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        القشر يعني نزع الطبقة الخارجية (تقشير الجلد)، وهو مفهوم مختلف دلالياً
        عن الحكّ التفريكي لتخفيف الحكّة. لا شاهد معجمي على استعمال قاشر
        بدلالة «من يحكّ جلده»، والمجاز الدلالي يستلزم قرباً وظيفياً غير متحقّق.


