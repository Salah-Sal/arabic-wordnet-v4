# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان (تربية، تنشئة) بدون تشكيل كامل — يجب تحديثهما"
      - "لفظ «تربية» يحمل دلالات أعم وأشمل في الاستخدام الحديث: تربية الحيوان، تربية النبات، علم التربية بمعنى education — مما قد يُضبَب الدلالة المطلوبة"
      - "المجموعة تفتقر إلى لمّة تُبرز الجانب المكتسَب تحديداً في مقابل الموروث، وهو جوهر المفهوم"
    observations: >
      المجموعة تعبّر عن مفهوم «التنشئة» بمعناه النفسي-الاجتماعي؛ أي الخصائص والسمات
      التي يكتسبها الفرد خلال مراحل نموه الأولى بتأثير البيئة الأسرية والاجتماعية.
      ويمتاز هذا المفهوم بأنه مقابل الموروث الفطري (الطبع) وقد وثّقه الاستخدام المعجمي
      الحديث في ثنائية «الطبع مقابل التنشئة» (nature vs nurture). كلتا اللمتين المتاحتين
      من حقل المصطلحات التربوية المعتمدة، وتنشئة أدق في التعبير عن الجانب الاجتماعي
      والقيمي، في حين تربية أعم وأشمل.
  blind_candidates:
    - lemma: "التَّأدِيب"
      generation_method: ishtiqaq
      justification: >
        من جذر أ-د-ب على وزن التَّفعيل؛ يدل على عملية تلقين الأدب وتهذيب السلوك
        خلال مراحل التكوين — وهو وجه من وجوه اكتساب الخصائص الشخصية في سنوات النشأة.
    - lemma: "الصِّيَاغَة"
      generation_method: majaz
      justification: >
        من جذر ص-و-غ؛ المجاز من تشكيل المعدن النفيس على صورة معيّنة إلى تشكيل شخصية
        الإنسان وصياغة طباعه خلال السنوات التكوينية — ويعضده قولهم «كلام حسن الصياغة».
    - lemma: "التَّطَبُّع"
      generation_method: ishtiqaq
      justification: >
        من جذر ط-ب-ع على وزن التَّفَعُّل؛ يدل على اكتساب الطِّبَاع والسجايا من
        الخارج وليس عن فطرة — وهو بالضبط ما تعنيه الخصائص المكتسبة في مقابل
        الموروث، ويتّسق مع ثنائية الطبع والتطبّع في التراث العربي.
    - lemma: "الحَضَانَة"
      generation_method: majaz
      justification: >
        من جذر ح-ض-ن؛ أصل المعنى الاحتضان والرعاية الوقائية، ثم استُعير للدلالة
        على الرعاية الشاملة في مراحل التكوين الأولى التي تُشكّل خصائص الفرد.


