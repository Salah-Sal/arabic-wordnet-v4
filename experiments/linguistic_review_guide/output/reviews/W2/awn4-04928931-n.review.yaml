stage2_evidence:
  per_lemma:

    - lemma: "تربية"
      confirm:
        - text: "«التربية: إنشاء الشيء حالا فحالا إلى حد التمام»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«عِلْم التَّربية: عِلْمٌ يختصّ بِبِناءِ الإنسان بناءً مُتوازِنًا متكامِلًا ومُتطَوِّرًا من جميع الوجوه, جِسميًّا, ونَفْسِيًّا, وفِكْرِيًّا, واجتماعيًّا, وقَوْمِيًّا, وإِنسانيًّا»"
          source: "المعجم الكبير"
        - text: "«مجموعة الأنشطة التي تهدف إلى توفير المعرفة وتنمية الحس بالقيم وفهم المبادئ المعمول بها في جميع مناحي الحياة»"
          source: "مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«الأنشطة التي تهدف إلى توفير المعرفة وتنمية الحس بالقيم» [translation_en: education]"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، ArabTerm"
          addition: "تُستخدم تربية في المصطلحية الحديثة بمعنى education (أعم من upbringing)، مما يُظهر توسّع دلالي ملحوظ"
        - text: "[translation_en: breeding; husbandry, rearing — domain: Veterinary Medicine]"
          source: "المكنز الزراعي متعدد اللغات (ArabTerm)"
          addition: "يكشف عن دلالة تربية في مجال الحيوان، مما يُعزز ضرورة السياق لضبط الدلالة المطلوبة"

    - lemma: "تنشئة"
      confirm:
        - text: "[translation_en: upbringing — domain: Education]"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "[translation_en: nurturing — domain: The Unified Medical Dictionary]"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«الطَّبْعُ مُقَابِلَ التَّنْشِئَةِ» [translation_en: nature-nurture]"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«تَنْشِئَةٌ اجْتِمَاعِيَّةٌ» [translation_en: socialization]"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية (ArabTerm)"
          addition: "تُكوّن تنشئة مركبات اصطلاحية راسخة كـ«التنشئة الاجتماعية» مما يُثبّت استخدامها في حقل علم النفس والاجتماع"
        - text: "«تَنْشِئَةٌ تَنْظِيمِيَّةٌ» [translation_en: organizational socialization]"
          source: "المعجم الموحد لمصطلحات حوكمة التعليم (ArabTerm)"
          addition: "يُظهر إنتاجية اللفظ واتساع استخدامه"

    - lemma: "التَّأدِيب"
      contradicts:
        - text: "«التَّأْدِيب: التَّهْذِيب والمجازاة ومجلس التَّأْدِيب شبه محكمَة يُرَاد مِنْهُ الْمُحَافَظَة على الْمصلحَة الْعَامَّة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          conflict: "التأديب في المعاجم يجمع التهذيب والمجازاة (العقوبة)؛ أما المجموعة فتعنى بالخصائص المكتسبة عموماً لا بالتهذيب بالعقاب"
        - text: "«(فى القانون): إجراء يرمى إلى معاقبة المقصر أو غير المنتج من عمال الدولة, تقويما له وتأمينا لسيادة النظام»"
          source: "المعجم الكبير"
          conflict: "الدلالة القانونية الغالبة في المعاجم الحديثة تتعلق بالعقوبة لا بالتنشئة"

    - lemma: "الصِّيَاغَة"
      contradicts:
        - text: "«الصياغة: عمل الحُلِيِّ من فِضَّةٍ وذهب ونحوهما يقال: كلامٌ حسنُ الصياغةِ: جيّدٌ مُحْكَمٌ»"
          source: "المعجم الوسيط"
          conflict: "الصياغة دلالتها حرفية (صوغ المعدن) أو مجازية في الأسلوب (صياغة الكلام)، ولا يُوجد توثيق لاستخدامها في التنشئة البشرية"
        - text: "«وضع صيغة لمستحضر صيدلانيّ» [translation_en: formulation]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          conflict: "المصطلحية الحديثة تستخدم الصياغة بمعنى formulation في العلوم لا بمعنى upbringing"

    - lemma: "التَّطَبُّع"
      confirm:
        - text: "«(تطبع) بِكَذَا أَو بطباعه تخلق»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«فلانٌ بِكَذَا: تَخَلَّقَ بِه وليس من سَجِيَّتِه»"
          source: "المعجم الكبير"
      expands:
        - text: "«طَبَعَ: طَبْعُ الْإِنْسَانِ وَسَجِيَّتُهُ [...] وهو مثل على نهاية ينتهي إليها الشيء حتى يُختم عندها»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: "يكشف عن ثنائية الطبع (الخِلقة الأصيلة) والتطبّع (الاكتساب)، وهو جوهر المقابل الدلالي للمفهوم المطلوب"

    - lemma: "الحَضَانَة"
      contradicts:
        - text: "«الحضانة: الْولَايَة على الطِّفْل لتربيته وتدبير شئونه ودور الْحَضَانَة مدارس ينشأ فِيهَا صغَار الْأَطْفَال (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          conflict: "الحضانة تختص بالرعاية القانونية للطفل الصغير وبمراحل ما قبل المدرسة — أضيق من المفهوم المطلوب الذي يشمل سنوات التكوين كافة"
        - text: "«حفظ الولد مما قد يضره، والقيام بتربيته وضمان ومراعاة مصالحه من قبل الأبوين أو أحدهما في حالة الانفصال» [translation_en: custody]"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "المصطلحية الحديثة تُثبّت دلالة الحضانة على الحضانة القانونية (custody/childcare) لا على الخصائص المكتسبة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تربية"
      decision: confirmed
      decision_reason: >
        لفظ راسخ في التراث والمعجمية الحديثة، يدل على العملية التدريجية الشاملة لبناء
        الإنسان جسدياً وعقلياً وأخلاقياً. مؤكَّد في ARABTERM ضمن مجالات التعليم والتربية.
        رغم تعدد دلالاته في مجالات الحيوان والنبات، فإن السياق النفسي-الاجتماعي يضبط
        دلالته بما يلائم المجموعة. يستلزم تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على العملية التدريجية الشاملة لتنمية الإنسان من جميع الأوجه (جسدياً
        ونفسياً وفكرياً واجتماعياً) — مشتقة من جذر «رب» بمعنى إصلاح الشيء والقيام عليه؛
        أعم وأشمل من تنشئة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْبِيَة"

    - lemma: "تنشئة"
      decision: confirmed
      decision_reason: >
        المصطلح الأدق للمفهوم المطلوب؛ مُعتمَد في ARABTERM بالمقابل المباشر upbringing
        (مسرد التربية، 2020)، وتشكّل ثنائية «الطبع مقابل التنشئة» (nature-nurture)
        في المعجم الطبي الموحد. تشمل المركبات الاصطلاحية الراسخة: التنشئة الاجتماعية،
        التنشئة التنظيمية. يستلزم تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أخص من تربية؛ تُركّز على الجانب الاجتماعي والقيمي في تشكيل شخصية الفرد خلال
        مراحل نشأته — مشتقة من جذر «نشأ» بمعنى الارتفاع والسمو؛ تُستخدم تحديداً
        في سياق البناء النفسي-الاجتماعي للشخصية كمقابل للموروث الفطري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنْشِئَة"

    - lemma: "التَّأدِيب"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم توثّق التأديب على معنيين لا ثالث لهما: التهذيب والمجازاة (العقوبة)
        والإجراء القانوني. لا يعبّر عن مفهوم الخصائص المكتسبة الشاملة في سنوات النشأة،
        بل عن وجه واحد منها هو الضبط الأخلاقي بالعقاب — وهو أضيق من المجموعة.

    - lemma: "الصِّيَاغَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد معجمية لاستخدام الصياغة بمعنى التنشئة البشرية؛ دلالتها
        في المعاجم الكلاسيكية صناعةُ الحلي، وفي المجازات الأسلوبية إحكامُ الكلام،
        وفي المصطلحية الحديثة formulation (الصيدلة والعلوم). المجاز المقترح
        لا يمتلك تثبيتاً معجمياً يكفي لاعتباره وحدة معجمية ثابتة.

    - lemma: "التَّطَبُّع"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن التطبّع يعبّر بدقة عن «اكتساب الطباع» في مقابل الطبع الفطري، إلا أنه
        في المعجمية مصدر فعلي يدل على الفعل لا على الظاهرة بما يكافئ upbringing.
        علاوة على ذلك يحمل اللفظ إيحاءً سلبياً بالتكلف وادعاء ما ليس من الطبع،
        كما في قولهم «وليس من سجيّته» — مما يُناقض الحياد المطلوب في مصطلح المجموعة.

    - lemma: "الحَضَانَة"
      source: stage1
      decision: removed
      decision_reason: >
        الحضانة في المعجمية الحديثة تختص بالرعاية القانونية للطفل الصغير وبدور
        الحضانة (childcare centers/custody) — أضيق من المجموعة التي تشمل سنوات
        التكوين كافة. فضلاً عن تعارض الدلالة مع الاستخدام القانوني المسيطر (custody).


