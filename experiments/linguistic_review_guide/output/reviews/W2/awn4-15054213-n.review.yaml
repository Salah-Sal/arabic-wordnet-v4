stage1_review:
  assessment:
    concerns:
      - غياب التشكيل الدقيق عن اللمات الحالية.
      - الحاجة لتمييز "ليسين" (المادة المحللة) عن "لايسين" (الحمض الأميني).
      - المصطلح "حالّ" قد يلتبس مع معانيه اللغوية القديمة (المقيم)، ويحتاج لتثبيت دلالته الحديثة.
    observations: "تعتمد المجموعة على مصطلحات علمية حديثة ناتجة عن إزاحة دلالية لجذر (حلل) أو تعريب مباشر. اللمات المقترحة تتماشى مع المعاجم الطبية والبيوكيميائية المعاصرة."
  blind_candidates:
    - lemma: "حَالّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من حلّ (فكك)، يستخدم في الكيمياء والبيولوجيا لما يسبب التحلل."
    - lemma: "مُحَلِّلَة"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة أو اسم فاعل للمواد التي تقوم بعملية التفكيك الخلوي."
    - lemma: "لِيسِين"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح العالمي (lysin)."
    - lemma: "مَادَّة حَالَّة"
      generation_method: tarkib
      justification: "وحدة معجمية مركبة تصف المادة بوظيفتها."

stage2_evidence:
  per_lemma:
    - lemma: "حالّ"
      confirm:
        - text: "«حالّ: lytic»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "حَالَّة"
      confirm:
        - text: "«حالَّة: lysin»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«الحالَّة: مادة تُحدث الانحلال في الخلايا.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الحالَّة المناعية (immune lysin)، حالَّة النطفة (sperm lysin)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "توضيح تخصصية المادة حسب المصدر."
    - lemma: "لِيسِين"
      confirm:
        - text: "«ليزين: lysin»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
    - lemma: "ليسين"
      confirm:
        - text: "«ليزين: lysin»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"

stage3_analysis:
