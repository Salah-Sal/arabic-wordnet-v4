    - lemma: "حالّ"
      decision: confirmed
      decision_reason: "مصطلح علمي مستقر يعبر عن الوظيفة التحليلية للمادة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالّ"
    - lemma: "ليسين"
      decision: confirmed
      decision_reason: "تعريب صوتي مقبول وشائع في الأدبيات العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لِيسِين"
    - lemma: "حَالَّة"
      source: stage1
      decision: confirmed
      decision_reason: "هي الصيغة الاسمية الأدق والأكثر شيوعاً في المعاجم المتخصصة لوصف مادة الـ lysin."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "حَالَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-15054213-n"
    - lemma: "لِيزِين"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة بديلة للتعريب مستخدمة في بعض المعاجم الموحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
