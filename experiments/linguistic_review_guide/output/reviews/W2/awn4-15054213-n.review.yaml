            lemma: "لِيزِين"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-15054213-n"

stage4_content:
  definition:
    current: "أي مادة (مثل الأجسام المضادة) أو عامل يمكن أن يسبب التحلل"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية، يحتاج لصياغة معجمية تركز على الوظيفة البيولوجية."
    authored:
      - type: terminological
        text: "مادة كيميائية حيوية أو عامل (مثل الأجسام المضادة) يعمل على تحلل الخلايا أو البكتيريا أو الأنسجة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-15054213-n"
          definition_index: 0
          text: "مادة كيميائية حيوية أو عامل (مثل الأجسام المضادة) يعمل على تحلل الخلايا أو البكتيريا أو الأنسجة."
  examples:
    per_lemma:
      - lemma: "حَالّ"
        examples:
          - text: "يفرز الفيروس إنزيماً حالاً للجدار الخلوي ليتمكن من حقن مادته الوراثية."
            type: usage
      - lemma: "حَالَّة"
        examples:
          - text: "تفرز بعض أنواع البكتيريا حَالَّة قادرة على تدمير كرات الدم الحمراء."
            type: usage
      - lemma: "لِيسِين"
        examples:
          - text: "يعد الليسين المناعي جزءاً هاماً من استجابة الجسم للأجسام الغريبة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-15054213-n"
          text: "يؤدي تفاعل الجسم المضاد مع المستضد أحياناً إلى تكوين حالَّة تحلل الخلية الغريبة."

