        - text: "«كلام — trans: parole — def: حصيلة فعل التكلم — domain: Information and Communication»"
          source: "مسرد الإعلام والتواصل — ArabTerm (entry 488594)"
        - text: "«الكلام — trans: Talk, speech, speaking»"
