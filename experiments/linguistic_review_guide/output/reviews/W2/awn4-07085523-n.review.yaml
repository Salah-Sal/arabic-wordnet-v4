      contradicts:
        - text: "«الكلام في أصل اللغة الأصوات المفيدة؛ عند المتكلمين: المعنى القائم بالنفس الذي يُعبَّر عنه بألفاظ؛ في اصطلاح النحاة: الجملة المركبة المفيدة»"
          source: "المعجم الوسيط (entry 25224)"
          conflict: "كلام يدل على النطق المفيد بإطلاق وعلى صيغ اصطلاحية في علم الكلام والنحو، ولا يحمل دلالة الأسلوب الشخصي المميَّز في التعبير الشفهي."
        - text: "«الكلام: الألفاظ التامة المركبة، وحروف دالة على معانٍ مفيدة»"
          source: "معجم مقاليد العلوم للسيوطي (entry 807394)"
          conflict: "التعريف اللغوي الأصيل للكلام يُقصَر على الأصوات والألفاظ الدالة بإطلاق، وليس على الأسلوب الفردي المميَّز."

    - lemma: "نَبْرَة"
      confirm:
        - text: "«نبرة — trans: accent — domain: Education»"
          source: "مسرد التربية — ArabTerm (entry 396410)"
        - text: "«نبرة — trans: accent — domain: Arts, Recreation and Sports»"
          source: "مسرد الفن والتسلية — ArabTerm (entry 491873)"
        - text: "«نبرة — trans: stress — domain: Arts, Recreation and Sports»"
          source: "مسرد الفن والتسلية — ArabTerm (entry 492597)"
        - text: "«رفع الصَّوت حين النطق بالكلمة، وقد يكون بالاعتماد على حرف من حروفها؛ وباختلاف موضع النَّبر من الكلمة يتميَّز اللهجات»"
