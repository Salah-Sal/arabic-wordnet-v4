      confirm:
        - text: "«إلقاء — trans: diction — domain: Arts, Recreation and Sports»"
          source: "مسرد الفن والتسلية والرياضة — ArabTerm (entry 492176)"
        - text: "«إلقاء — trans: reciting — def: تِلاوة خِطاب أمام جمهور — domain: Information and Communication»"
          source: "مسرد الإعلام والتواصل — ArabTerm (entry 488071)"
        - text: "«(2) الإلقاء [في الخطابة]» (تحت مدخل diction)"
          source: "المورد الحديث (entry 683341)"
        - text: "«(2) طريقة الإلقاء» (تحت مدخل elocution)"
          source: "المورد الحديث (entry 685608)"
        - text: "«أسلوب في الإلقاء يُراعي خصوصية الخطاب وينسجم مع فحواه»"
          source: "مسرد الإعلام والتواصل — ArabTerm (entry 487735, أسلوب خطابي)"
      expands:
        - text: "«الإلقاء: هو الإملاء والتعليم؛ ألقى إليه القولَ: أبلغه إياه وعَّمه، وإلقاءُ الشيء على الأرض: طرحُه عليها»"
          source: "التعريفات الفقهية للبركتي (entry 833876)"
          addition: "يكشف أن الإلقاء أصله الطرح والإيصال، وقد تخصَّص في إيصال القول وتعليمه؛ مما يُثبت صلته بالتعبير الشفهي."

    - lemma: "طريقة التحدث"
      evidence_status: "no_material_found"

    - lemma: "كلام"
