# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إلقاء"
      decision: confirmed
      decision_reason: >
        الإلقاء موثَّق في عدة مصادر معجمية حديثة وكلاسيكية بمعنى إيصال الكلام وطريقة
        تأديته (diction, reciting, elocution). يُستعمل خاصةً في سياقات الخطابة والإنشاد.
        يحتاج إلى تشكيل كامل: إِلْقَاء.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check: "وزن إفعال من الجذر لقي (ألقى-يُلقي)؛ الوزن يناسب المصدر الدال على الفعل المتعدي"
      nuance_differentiation: >
        يُركِّز على فعل طرح الكلام وإيصاله إلى السامعين، ويُستعمل تحديداً في سياق الخطابة
        والإنشاد والمحاضرات؛ أقرب إلى delivery بوصفه فعلاً أدائياً أمام جمهور.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِلْقَاء"

    - lemma: "طريقة التحدث"
      decision: removed
      decision_reason: >
        عبارةٌ وصفيةٌ حرَّة وليست مصطلحاً مسكوكاً: يمكن إبدال «التحدث» بـ«الكلام» أو
        «الحديث» أو «القول» وتبقى العبارةُ صالحةً وصفاً دون أن تكون وحدةً معجميةً ثابتة.
        لم تُعثَر لها على مدخل في قاعدة البيانات. تفشل اختبار السك والتثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كلام"
      decision: removed
      decision_reason: >
        كلام في العربية يُعبِّر عن النطق المفيد بإطلاقه (الأصوات المفيدة / الجمل المركبة)
        دون أن يحمل دلالة الأسلوب الشخصي المميَّز. أما المقابل الإنجليزي «speech» في هذه
        المجموعة فيُقصَد به «manner of speaking» لا «the act/product of speaking».
        وجود كلام في هذه المجموعة يُشكِّل اشتراكاً لفظياً مُخِلاً مع synsets أخرى.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "نَبْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        النبرة ظاهرةٌ صوتيةٌ صرفيةٌ على مستوى الكلمة المفردة (stress, accent) وليست
        الأسلوبَ الشاملَ المميَّز للشخص في تعبيره الشفهي. إنها مكوِّنٌ واحد من مكوِّنات
        الأسلوب الشفهي لا الأسلوبُ ذاته. دلالتها أضيق من المفهوم المطلوب.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "أَدَاء"
      source: stage1
      decision: confirmed
      decision_reason: >
        الأداء مُوثَّقٌ توثيقاً مباشراً بمعنى «delivery» بمفهوم طريقة الإلقاء الكلامي
        الشخصي: «الأداء: طريقة الإلقاء أو الغناء» (المورد الحديث)، وهو بالضبط ما تعنيه
        هذه المجموعة. الجذر أدي: «إيصال الشيء إلى الشيء» يُعزِّز الدلالةَ. المعجم الوسيط:
        «هو قارئٌ حَسَنُ الأداء» يُثبت استعماله في سياق التعبير الشفهي المتميِّز.
        يحقق جميع معايير جودة المصطلح: عربي، مشتق، مألوف، مطَّرد، ملائم، اشتقاقي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check: "وزن فَعَال من الجذر أدي (أدَّى-يُؤَدِّي)؛ الوزن يناسب المصادر الدالة على الفعل المتمكِّن من نفسه"
      nuance_differentiation: >
        يعبِّر عن الطريقة الشاملة لإيصال الكلام الشفهي بما يشمل النبرة والإيقاع وبناء الجُمَل
        وجماليات التعبير؛ يُستعمل في سياقات الغناء والتلاوة والخطابة على السواء. أشمل من
        إلقاء ويُركِّز على الجانب التقني الشخصي لا على الجمهور أو المناسبة.
      actions:
        - command: create_entry
          params:
            lemma: "أَدَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "بَيَان"
      source: stage1
      decision: removed
      decision_reason: >
        البيان في العربية يدل على الإيضاح والفصاحة والبلاغة الخطابية، وهو أقرب إلى
        eloquence/rhetoric منه إلى طريقة التعبير الشفهي الشخصية. لم يُستعمل مصطلحاً
        ثابتاً بالمعنى المطلوب في هذه المجموعة. المورد الحديث يُدرجه بين مقابلات diction
        لكن الاستعمال الطاغي له في العربية المعاصرة يختلف.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "لَهْجَة"
      source: stage1
      decision: removed
      decision_reason: >
        اللهجة في معاجم القدامى تحمل المعنى المطلوب (طريقة الشخص المميَّزة في الكلام)،
        غير أن الاستعمال الاصطلاحي الحديث الغالب لها هو «dialect» (الشِّق الجغرافي من
        اللغة)، مما يُنشئ اشتراكاً لفظياً مُخِلاً يُضعِف دقة التمثيل في شبكة WordNet.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "أسلوبك أو طريقتك المميزة في التعبير عن نفسك شفهياً"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مكتوب بضمير المخاطَب («أسلوبك / طريقتك») وهو غير مناسب لأسلوب
        معاجم الوسيط التي تعتمد الغيبة والتجريد. كما أن «التعبير عن النفس» عبارةٌ
        ترجمية وليست أسلوباً معجمياً أصيلاً. يحتاج إلى إعادة صياغة بأسلوب المعجم الوسيط
