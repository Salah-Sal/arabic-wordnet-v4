# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «طريقة التحدث» عبارةٌ وصفيةٌ حرّةٌ لا مصطلحٌ مسكوك، وتفشل اختبار السكّ (يمكن إبدال «التحدث» بـ«الكلام» أو «الحديث» وتبقى صالحةً وصفاً)."
      - "لمّة «كلام» عامةٌ جداً، إذ تعني الأصواتَ المفيدةَ والكلامَ بإطلاق، ولا تحمل دلالة الأسلوب الشخصي المميَّز الذي يُقصَد في هذه المجموعة."
      - "لمّة «إلقاء» تُركِّز على فعل إيصال الكلام وطرحه لا على الأسلوب الشخصي؛ التشكيل غائب."
      - "المجموعة تفتقر إلى اللمّة الأنسب دلاليًا للمفهوم وهي «أداء» التي تترجم مباشرةً مقابلَ delivery بمعنى طريقة الإلقاء."
    observations: >
      المجموعة ترادفية تُعبِّر عن الأسلوب الشفهي الشخصي المميَّز للمتكلِّم. الأبُ المباشر هو
      «أسلوب» الذي يعني طريقة التعبير العامة؛ فهذه المجموعة تُخصِّصه بقيدَي الشفهية والتمييز
      الشخصي. المقابلات الإنجليزية (manner of speaking / delivery / speech) تكشف أن المعنى
      الجوهري هو «delivery» أي الأداء الكلامي الشخصي. «إلقاء» مقبول لكنه يميل إلى السياق
      الخطابي والإنشادي. «كلام» مقابل «speech» لكنه في العربية عامٌّ لا يحمل دلالة الأسلوب
      المميَّز. «طريقة التحدث» غير مسكوكة معجمياً.

  blind_candidates:
    - lemma: "نَبْرَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ن ب ر) على وزن فَعْلَة؛ والمقاييس: «أصل صحيح يدل على رفعٍ وعلو». النَّبْرَة
        هي رفع الصوت حين النطق وما يُميِّز طريقةَ التعبير الشفهي من تنغيم؛ ارتبطت بالهوية
        الصوتية للمتكلِّم وبتمييز اللهجات.
    - lemma: "أَدَاء"
      generation_method: ishtiqaq
      justification: >
        من الجذر (أ د ي) على وزن فَعَال؛ الأصل «إيصال الشيء إلى الشيء». الأداء في اللغة هو
        التأدية والتلاوة، ويُقال «قارئٌ حَسَنُ الأداء» أي حَسَنُ الإلقاء؛ وهو يعكس المفهومَ
        الجوهري لـ delivery = طريقة إيصال الكلام الشفهي.
    - lemma: "بَيَان"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ب ي ن) على وزن فَعَال؛ الأصل «انكشاف الشيء». البيان هو المنطق الفصيح الذي
        يكشف عن المقصود، ويُستعمل مقابلاً لـ diction بمعنى أسلوب التعبير الخاص.
    - lemma: "لَهْجَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ل ه ج) على وزن فَعْلَة؛ الأصل «المثابرة على الشيء وملازمته». اللهجة في
        معاجم القدامى هي لغةُ الإنسان التي جُبل عليها وتمرَّس بها، وطريقةُ الأداء التي يتميَّز
        بها كلامُه؛ فهي تُعبِّر عن الأسلوب الشخصي في التعبير الشفهي.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

