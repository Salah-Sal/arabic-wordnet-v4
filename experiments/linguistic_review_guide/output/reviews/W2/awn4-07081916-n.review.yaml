              تلجأ اللغة الإنجليزية إلى التحليل في التعبير عن الملكية والجهة،
              فتقول «the colour of the sky» بدلاً من إلحاق لاحقة الحالة بالاسم
              كما في اللغات التصريفية.
            type: usage
      - lemma: "التَّحْلِيلِيَّة"
        examples:
          - text: >-
              تُعدّ التحليليةُ أبرزَ سمات اللغات العازلة كالصينية المندرينية،
              إذ تعتمد كلياً على ترتيب الكلمات والأدوات النحوية المستقلة دون
              أي ملاحق صرفية.
            type: usage
    actions:
