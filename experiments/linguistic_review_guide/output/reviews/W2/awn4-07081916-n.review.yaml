# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-07081916-n  |  ILI: i73822  |  POS: n
# المفهوم: التحليلية الصرفية — استخدام كلمات مستقلة بدلاً من التصريفات
# تاريخ المراجعة: 2026-03-19
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'تحليل' خالية من التشكيل"
      - "اللمّة 'تحليل' شديدة التعدد الدلالي: تُستعمل في الكيمياء والرياضيات وعلم النفس والفلسفة والاتصال وعشرات الحقول، مما يُضعف دلالتها على المفهوم اللساني التصنيفي تحديداً"
      - "المصطلح الأنسب للمفهوم هو 'التحليلية' (اسم مصدر صناعي) وليس 'التحليل' (مصدر الفعل) لأن المطلوب الإشارة إلى الخاصية/الصفة لا العملية"
      - "التعريف العربي الحالي مبتسر، لا يُوضح الطابع اللساني التصنيفي للمفهوم (مقابلة اللغات التحليلية باللغات التصريفية)"
    observations: >-
      المفهوم المقصود هو التحليلية الصرفية (analyticity) في تصنيف اللغات، وهو
      الميل إلى التعبير عن العلاقات النحوية بكلمات مستقلة (حروف جر، أفعال
      مساعدة) عوضاً عن ملاحق صرفية (لاحقات الحالة الإعرابية، تصريف الأفعال).
      المثال المعطى في التعريف الإنجليزي ("the father of the bride" بدلاً من
      "the bride's father") يوضح استبدال علامة الجر الإضافية بحرف الجر المنفصل.
      في المعجمية اللسانية العربية الحديثة استقرّ المصطلح على 'تحليلي' صفةً
      و'التحليلية' اسماً للخاصية (مقابل 'تأليفي'/'تصريفي')، كما في المعجم الموحد
      لمصطلحات اللسانيات (أليكسو 2002). اللمّة الموجودة 'تحليل' مقبولة من باب
      قياس مصطلح الإنجليزية analysis، لكنها لا تُميّز المفهوم بكفاية.
  blind_candidates:
    - lemma: "التَّحْلِيلِيَّة"
      generation_method: ishtiqaq
      justification: >-
        اشتقاق اسم مصدر صناعي بإضافة ياء النسب والتاء (فَعْلِيَّة) إلى الصفة
        'تحليلي'. الوزن الصناعي (-يَّة) ينقل الصفة إلى مفهوم مجرد يدل على
        الخاصية والصفة، وهو مناسب تماماً لتعبئة مفهوم كيفي كالتحليلية الصرفية.
        الجذر: ح-ل-ل (فتح الشيء وحلّه) يتسق مع التحليل بمعنى تفكيك البنية
        الصرفية المدمجة إلى كلمات منفصلة.
    - lemma: "البَسْطُ"
      generation_method: majaz
      justification: >-
        مجاز من 'بسط' بمعنى نشر الشيء ومدّه وتوسيعه (الأصل في مقاييس اللغة:
        امتداد الشيء). يُحيل مجازياً على نشر المحتوى النحوي في كلمات مستقلة
        بدلاً من طيّه في الصيغة الصرفية. محاولة إحياء اللفظ القديم بدلالة
        لسانية حديثة.
    - lemma: "التَّفْرِيقِيَّةُ الصَّرْفِيَّة"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من 'تفريقية' (خاصية التفريق بين الوحدات الصرفية ووضع كل
        وظيفة في كلمة مستقلة) و'صرفية' فاصلاً للحقل. يؤكد أن التفريق يخص
        الوحدات الصرفية تحديداً لا التفريق في معنى آخر.
    - lemma: "الإِطَالَةُ التَّرْكِيبِيَّة"
      generation_method: tarkib
      justification: >-
        تركيب وصفي: الإطالة = توسيع التعبير بإضافة كلمات منفصلة، والتركيبية =
        على مستوى التركيب النحوي لا الصرف الداخلي. يُشير إلى مدّ التعبير
        عبر الجملة بدلاً من تكثيفه في صيغة واحدة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفّذة:
#  Q1 — مطابقة دفعية: تحليل + التحليل + تحليليه + التحليليه + بسط + البسط + اطاله + تفريقيه
#  Q2 — جسر إنجليزي: analysis OR periphrasis OR analytic OR analyticity OR analytical
#  Q3 — إثراء بالمعرّف: entry_ids المُختارة + مقاييس (حلل, ردف, بسط)
#  Q4 — FTS عربي: تصريفات OR تصريف OR إعرابي OR معرب OR تحليلي OR عازلة OR إلحاقي
#  Q5 — مقاييس اللغة: headword_norm IN ('حلل','حل')
stage2_evidence:
  per_lemma:

    - lemma: "تَحْلِيل"
      confirm:
        - text: >-
            «(التَّحْلِيل) في الفلسفة: Analysis: مَنْهَجٌ عامٌّ يُرادُ بِهِ
            تَقْسيمُ الكُلِّ إِلى أَجْزائِهِ وَرَدُّ المركَّبات إِلى
            بسائطها»
          source: "المعجم الكبير، مجمع اللغة العربية"
        - text: >-
            «تحليل = analysis: طريقة مستعملة في وصف موضوع سيميائي لإيجاد
            علاقة بين الجزء والكل وتتحدد أنماط التحليل باختيار منهجية
            ومستويات معرفية»
          source: "المعجم الموحد لمصطلحات اللسانيات، أليكسو 2002"
      expands:
        - text: >-
            «(تَحْلِيل الجملة) بيان أجزائها ووظيفة كلٍّ منها. (التَّحْلِيل
            النفساني) فرع من علم النفس الحديث يبحث في العقل الباطن»
          source: "المعجم الوسيط"
          addition: >-
            يُثبت الاستعمال اللساني لتحليل الجملة، لكنه يكشف تعدد الدلالات
            (جملة، نفسي) مما يُضعف تخصصه للمفهوم المقصود
        - text: >-
            «التّحليل: وعند المحاسبين هو العكس. وعند المنطقيين ويسمّى
            بالانحلال أيضاً»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: >-
            يؤكد تعدد معاني تحليل عبر العلوم (حساب، منطق، طب) مما يستوجب
            ضبط السياق عند استعماله بالمعنى اللساني التصنيفي

    - lemma: "التَّحْلِيلِيَّة"
      source: stage1
      confirm:
        - text: >-
            «تحليلية = analytic: مصطلح يطلق على حكم تعبير جازم وحقيقي
            ودائم من حيث مضمونه، لا في علاقته بالأحداث وتحديد الوحدات
            الدنيا، لهذا يتحدد دائما في التفكيك»
          source: "المعجم الموحد لمصطلحات اللسانيات، أليكسو 2002"
        - text: >-
            «تحليلي = Analytic: سمة تمتاز بها اللغات العازلة. ضد: تأليفي»
          source: "المعجم الموحد لمصطلحات اللسانيات، أليكسو 2002"
        - text: >-
            «analytic: (3) إعرابيّ؛ مُعْرَب — an analytic language»
          source: "المورد الحديث 2008"
          addition: >-
            يُثبت استعمال 'تحليلي' (الأساس الاشتقاقي للتحليلية) في الدلالة
            على اللغة التحليلية مقابلاً للمعرَّب بمعنى ذي إعراب تحليلي

    - lemma: "البَسْطُ"
      source: stage1
      contradicts:
        - text: >-
            «(الْبسط) (فِي علم الْحساب) الْعدَد الْأَعْلَى فِي الْكسر
            الاعتيادي (مو)»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: >-
            الدلالة الراسخة لـ'البسط' في المعاصرة هي البسط الحسابي (numerator
            في الكسر) لا معنى لسانياً تصنيفياً
        - text: >-
            «البسط: توسعة المجتمع إلى حد غاية. وقال الراغب: بسط الشيء نشره
            وتوسيعه، فتارة يتصور منه الأمران وتارة أحدهما»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >-
            المعنى القاموسي (نشر/توسيع) يبقى عاماً وبعيداً عن الدلالة اللسانية
            التحليلية المطلوبة دون قرينة صارفة

    - lemma: "التَّفْرِيقِيَّةُ الصَّرْفِيَّة"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "الإِطَالَةُ التَّرْكِيبِيَّة"
      source: stage1
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تَحْلِيل"
      decision: confirmed
      decision_reason: >-
        اللمّة مُستعملة في المعجمية اللسانية العربية الحديثة بترجمة 'analysis'،
        وهي الموازي المقرر في AWN للمقابل الإنجليزي. مقبولة في السياق اللساني
        التصنيفي مع الأخذ بعين الاعتبار تعدد معانيها في حقول أخرى. تحتاج
        إضافة تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُشير إلى العملية أو المنهج التحليلي (process noun) — مناسب حين يُراد
        الإشارة إلى التحليل كفعل أو إجراء لغوي يتمثل في استعمال كلمات مستقلة.
        أقل دقة من 'التحليلية' في التعبير عن الخاصية المجردة للغة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْلِيل"

    - lemma: "التَّحْلِيلِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        مُدرجة في المعجم الموحد لمصطلحات اللسانيات (أليكسو 2002) بترجمة
        'analytic'، والصفة الأساسية 'تحليلي' مُعرَّفة صراحةً بأنها "سمة تمتاز
        بها اللغات العازلة. ضد: تأليفي" — وهو جوهر المفهوم المطلوب. الاسم
        الصناعي 'التحليلية' (بياء النسب والتاء) هو النمط الأقعد للتعبير عن
        الخاصية المجردة (property noun)، ويُوازي مباشرة الـ analyticity الإنجليزية.
        اجتاز اختبار السكّ: التحليلية وحدة معجمية لسانية ثابتة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُشير إلى الخاصية المجردة (property noun) — مناسب حين يُراد وصف اللغة
        أو الأسلوب بالصفة التحليلية الكلية. أكثر تحديداً من 'تحليل' لأنه يُغلق
        باب التعدد الدلالي ويُحيل إلى الطابع اللساني التصنيفي مباشرة.
      actions:
        - command: create_entry
          params:
            lemma: "التَّحْلِيلِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "البَسْطُ"
      source: stage1
      decision: removed
      decision_reason: >-
        الدلالة الراسخة في المعجمية المعاصرة هي 'بسط الكسر' (numerator)، والمعنى
        القديم (نشر/توسيع) لا يُحيل على المفهوم اللساني التصنيفي دون قرينة
        مصطنعة. لم يُعثر على أي استعمال معجمي يربط 'البسط' بالتحليلية الصرفية.
        إحياؤه بهذه الدلالة سيُوقع في اشتراك لفظي مع البسط الحسابي.

    - lemma: "التَّفْرِيقِيَّةُ الصَّرْفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود معجمي لهذا التركيب في القاموسية العربية المتاحة. وإن نجح
        اختبار الوصف الحر (يمكن إبدال 'صرفية' بـ'نحوية' أو 'تصريفية') مما
        يُشير إلى أنه ليس مصطلحاً مسكوكاً بل عبارة وصفية.

    - lemma: "الإِطَالَةُ التَّرْكِيبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود معجمي لهذا التركيب. فضلاً عن ذلك فإن 'إطالة' تحمل دلالة
        سلبية (الإسهاب غير المرغوب) قد تُلوّن المصطلح بمعنى مرذول غير مقصود.
        يفشل اختبار السكّ لأن 'التركيبية' قابلة للاستبدال دون تغيير المعنى.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "استخدام كلمات مستقلة بدلاً من التصريفات"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مبتسر ومبهم: لا يُحدد الغرض الوظيفي من الكلمات المستقلة
        (التعبير عن العلاقات النحوية)، ولا يُميّز المفهوم عن التركيب الإسنادي
        العادي، ولا يُشير إلى حقل اللسانيات. كما أن 'التصريفات' غامض (قد تُفهم
        أشكال الفعل لا لواحق الحالة الإعرابية).
    authored:
      - type: terminological
        text: >-
          أسلوبٌ لغويٌّ تُعبَّر فيه عن العلاقات النحوية والوظائف الصرفية
          بكلماتٍ مستقلةٍ (كحروف الجر والأفعال المساعدة وأدوات التعريف) عوضاً
          عن الصيغ الصرفية المُلحقة بالكلمة، وهو سمةٌ مميِّزة للغات التحليلية
          في مقابل اللغات التصريفية.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          في تصنيف اللغات، تتسم اللغات التحليلية (كالإنجليزية والصينية) بالتحليلية
          الصرفية: أي اعتماد كلمات مستقلة ذات معنى نحوي (أدوات، حروف جر، مساعدات
          فعلية) للتعبير عن العلاقات التي تُؤديها في اللغات التصريفية الملاحق
          الصرفية (كلاحقات الحالة الإعرابية وضمائر الفعل المتصلة). مثال ذلك
          استعمال 'of the bride' بدلاً من لاحقة الملكية '-'s' في الإنجليزية.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >-
            أسلوبٌ لغويٌّ تُعبَّر فيه عن العلاقات النحوية والوظائف الصرفية
            بكلماتٍ مستقلةٍ (كحروف الجر والأفعال المساعدة وأدوات التعريف) عوضاً
            عن الصيغ الصرفية المُلحقة بالكلمة، وهو سمةٌ مميِّزة للغات التحليلية
            في مقابل اللغات التصريفية.
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >-
            في تصنيف اللغات، تتسم اللغات التحليلية (كالإنجليزية والصينية) بالتحليلية
            الصرفية: أي اعتماد كلمات مستقلة ذات معنى نحوي (أدوات، حروف جر،
            مساعدات فعلية) للتعبير عن العلاقات التي تُؤديها في اللغات التصريفية
            الملاحق الصرفية كلاحقات الحالة الإعرابية وضمائر الفعل المتصلة.

  examples:
