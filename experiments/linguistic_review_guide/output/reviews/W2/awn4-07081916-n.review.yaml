# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "تَحْلِيل"
      entry_id: "{auto}"
      root: "حلل"
      maqayis_quote: >-
        «(حَلَّ) الْحَاءُ وَاللَّامُ لَهُ فُرُوعٌ كَثِيرَةٌ وَمَسَائِلُ،
        وَأَصْلُهَا كُلُّهَا عِنْدِي فَتْحُ الشَّيْءِ، لَا يَشِذُّ عَنْهُ
        شَيْءٌ. يُقَالُ حَلَلْتُ الْعُقْدَةَ أَحُلُّهَا حَلًّا»
    - lemma: "التَّحْلِيلِيَّة"
      entry_id: "{auto}"
      root: "حلل"
