# ── المرحلة ١: المراجعة والتوليد (أعمى) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "إيزوكرونية تعريب غير موثَّق في أي معجم عربي مُعتمَد، ولا مسوِّغ له مع وجود بدائل عربية أصيلة"
      - "تساوي الزمن يفتقر إلى التشكيل الكامل المطلوب في المخرجات"
      - "التعريف الحالي مطوَّل ويحمل سمات الترجمة الحرفية، ويمكن صياغته بأسلوب معجمي أوجز وفق نمط الجنس القريب والفصل النوعي"
    observations: "تمثِّل هذه المجموعة الترادفية مفهوماً تقنياً دقيقاً هو الإيزوكرونية = تساوي الفترات الزمنية بين الحوادث المتتالية في ظاهرة منتظمة. يرِدُ المفهوم في فيزياء الحركة (البندول الإيزوكروني) والهندسة الكهربائية (الإشارات الرقمية) وعلوم الأرض. يُلاحَظ أن اللمَّة إيزوكرونية تعريب مباشر للإنجليزية isochrony دون أي توثيق معجمي عربي، بينما اللمَّة تساوي الزمن مركب إضافي مقبول صرفياً لكنه يفتقر إلى التشكيل. التعريف المقدَّم مترجم حرفياً ويستعمل عبارة (قابلة للقياس) غريبة عن النمط المعجمي العربي."
  blind_candidates:
    - lemma: "اِسْتِوَاءٌ زَمَنِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من مصدر اِسْتَوَى (جذر س-و-ي) بمعنى تحقُّق المساواة التامة بين شيئَيْن، مضافاً إليه وصف زَمَنِيٌّ؛ يُعبِّر عن حالة التعادل الكامل في الأبعاد الزمنية للظاهرة المُتكرِّرة"
    - lemma: "انْتِظَامُ الأَزْمِنَة"
      generation_method: tarkib
      justification: "مركب إضافي من مصدر انْتَظَمَ (جذر ن-ظ-م) الدال على التأليف والتناسق، وجمع زَمَن (أَزْمِنَة)؛ يُعبِّر عن انتظام الفترات الزمنية وتناسقها كما يقتضيه التعريف"
    - lemma: "ثَبَاتُ الدَّوْرِ"
      generation_method: tarkib
      justification: "مركب إضافي من مصدر ثَبَتَ (جذر ث-ب-ت) الدال على الدوام وعدم الزوال، والدَّوْر من (د-و-ر) بمعنى الفترة الزمنية لدورة واحدة؛ يُعبِّر مباشرةً عن ثبات الفاصل الزمني الذي هو جوهر الخاصية"
    - lemma: "تَكَافُؤٌ زَمَنِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من مصدر تَكَافَأَ (جذر ك-ف-أ) بمعنى التعادل والتماثل بين طرفَيْن، مضافاً إليه وصف زَمَنِيٌّ؛ يُعبِّر عن التعادل في الأبعاد الزمنية للحوادث المتتالية رغم تباين الظروف الأخرى"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات مُنجَزة (٥ استعلامات):
#   ١. مطابقة دفعية: ايزوكرونية، تساوي الزمن، وكلمات المرشحات
#   ٢. الجسر الإنجليزي: isochrony / isochronous / isochronism / isochrone
#   ٣. بحث FTS بالكلمات المفتاحية: فترات زمنية، تساوي الزمن، ثابت الدورة
#   ٤. إثراء بمعرِّفات: 517265, 431522, 436248, 421978, 696238, 596920
#   ٥. مقاييس اللغة: جذور وقت، سوي، نظم، ثبت، زمن
stage2_evidence:
  per_lemma:
    - lemma: "إيزوكرونية"
      evidence_status: "no_material_found"

    - lemma: "تساوي الزمن"
      confirm:
        - text: "«(1) متساوي الزمن (2) متساوي الديمومة: متساوٍ من حيث مدة استمراره (3) ثابت الدورة: متكرّر في فترات منتظمة — isochronal | isochronous»"
          source: "المورد الحديث (2008)"
        - text: "«متساوي الزمن — isochronous»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«متساوي الزمن: وصف للإشارة الرقمية عندما تكون ثابتة الدورة الزمنية، أي عندما تكون لحظاتها المؤثرة — أي لحظات الانتقال من عنصر إشارة إلى العنصر التالي له — على فتراتٍ زمنية ثابتة — isochron»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«متجانس الفترات — isochronous; DEPRECATED: synchronous»"
          source: "موسوعة الكهرباء IEC 60050 (Electropedia)"
        - text: "«مُتَّسِقُ الزَّمَنَة (تحدث في نفس الوقت وبنفس المدة) — isochronous»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«تساوي التزامن — isochronism, isochronisme m»"
          source: "موسوعة الكهرباء IEC 60050 (Electropedia)"
          addition: "توثِّق موسوعة IEC مصطلح تساوي التزامن مقابلاً لـ isochronism، وإن كان يُدمج مفهومَي تساوي الزمن والتزامن، مما قد يُوقع في التباس مع synchronism"
        - text: "«تواقُت: تكافؤ في الوقت — isochronism, isochronisme»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "يكشف عن مصطلح تواقت العربي الأصيل (جذر و-ق-ت، وزن تَفَاعُل) مقابلاً موثَّقاً لـ isochronism في المعجم الجيولوجي"
        - text: "«تواقت: تكافؤ في الوقت — isochronism, isochronisme»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
          addition: "يُؤكِّد توثيق تواقت في معجمَيْن تقنيَّيْن عربيَّيْن مُعتمَدَيْن بوصفه مقابلاً عربياً أصيلاً لـ isochronism"

    - lemma: "تَوَاقُت"
      confirm:
        - text: "«تواقُت: تكافؤ في الوقت — isochronism, isochronisme»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) [entry_id: 431522]"
        - text: "«تواقت: تكافؤ في الوقت — isochronism, isochronisme»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999) [entry_id: 436248]"

    - lemma: "اِسْتِوَاءٌ زَمَنِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "انْتِظَامُ الأَزْمِنَة"
      evidence_status: "no_material_found"

    - lemma: "ثَبَاتُ الدَّوْرِ"
      evidence_status: "no_material_found"

    - lemma: "تَكَافُؤٌ زَمَنِيٌّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إيزوكرونية"
      decision: removed
      decision_reason: "أربعة أسباب تستوجب الحذف: (١) لا أدلة معجمية — غائبة من كل المعاجم العربية الكلاسيكية والحديثة والتقنية. (٢) تُخالف مبدأ إيثار العربي: توجد بدائل عربية موثَّقة (تساوي الزمن، تواقت). (٣) تفشل بوابة الجودة المصطلحية: لا اشتقاقية (لا جذر عربي)، لا ملاءمة صرفية (التاء المربوطة الملحقة لا تُضفي أصالةً). (٤) الإبقاء على تعريب مع وجود أصيل يُكرِّس الاعتماد على الدخيل"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تساوي الزمن"
      decision: confirmed
      decision_reason: "مركب إضافي موثَّق في معاجم الفيزياء والهندسة الكهربائية والطب بصيغته الصفية (متساوي الزمن) ترجمةً لـ isochronous/isochronal، والاسم المصدري تساوي الزمن هو الاشتقاق الطبيعي للصيغة الاسمية (isochrony). اجتياز بوابة جودة المصطلح: اطِّراد (ورد في خمسة معاجم تقنية)؛ يُسر التداول؛ ملاءمة صرفية (تَفَاعُل للمشاركة)؛ إيثار العربي؛ اشتقاقية (جذر س-و-ي المنتج). يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُؤكِّد جانبَ التسوية والتعادل الحاصل بين الفترات الزمنية من منظور الناتج والحالة المُقاسة؛ أكثر شيوعاً في الهندسة الكهربائية والفيزياء التطبيقية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسَاوِي الزَّمَنِ"

    - lemma: "تَوَاقُت"
      source: stage2
      decision: confirmed
      decision_reason: "موثَّق في معجمَيْن تقنيَّيْن مُعتمَدَيْن بترجمة مباشرة لـ isochronism. مشتق من الجذر العربي الأصيل و-ق-ت على وزن تَفَاعُل الدال على التشارك والمتبادلية (تواقَتَ = توافقت الأشياء في وقتها). التعريف المعجمي (تكافؤ في الوقت) يُعبِّر بدقة متناهية عن جوهر المفهوم. يجتاز بوابة الجودة: إيثار التراثي (جذر وقت الأصيل بمقاييس ابن فارس)؛ الاشتقاقية (وزن تَفَاعُل المنتج)؛ يُسر التداول (ثلاثي المقطع)؛ الملاءمة (يُشير إلى التشارك الزمني لا مجرد وصف)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُؤكِّد جانبَ التوافق المتبادل في التوقيت والتكافؤ الزمني بين الأحداث المتتالية؛ موثَّق في علوم الأرض ويُشير إلى التطابق الداخلي في توقيت الظاهرة"
      actions:
        - command: create_entry
          params:
            lemma: "تَوَاقُت"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اِسْتِوَاءٌ زَمَنِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي لهذا التركيب مصطلحاً مسكوكاً لـ isochrony. يفشل اختبار التثبيت المعجمي: إبدال زمني بـ كمّي أو فضائي يُبقي العبارة وصفاً صحيحاً، مما يكشف أنها عبارة وصفية حرة لا مصطلح ثابت. علاوةً على أن الاستواء انصرف في المعاجم إلى خط الاستواء الجغرافي"

    - lemma: "انْتِظَامُ الأَزْمِنَة"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي بوصفه مصطلحاً لـ isochrony. الانتظام أعمُّ من الإيزوكرونية ويشمل الدورية (periodicity) والإيقاعية (rhythmicity). المفهوم المطلوب ليس مجرد الانتظام بل تساوي الفترات تحديداً رغم تباين عوامل أخرى"

    - lemma: "ثَبَاتُ الدَّوْرِ"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي للتركيب الاسمي. وإن كان المورد الحديث يستعمل ثابت الدورة وصفاً صفةً لـ isochronous، إلا أن التركيب الاسمي يفشل اختبار السكّ: إبدال الدور بالفترة أو الزمن مع بقاء المعنى الوصفي صحيحاً يدل على عدم التثبُّت الاصطلاحي"

    - lemma: "تَكَافُؤٌ زَمَنِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي بوصفه مصطلحاً لـ isochrony. التعريف المعجمي لـ تواقت هو (تكافؤ في الوقت) مما يُشير إلى أن هذه العبارة تحليلية لتواقت لا مصطلح مستقل. المصطلح المسكوك هو تواقت، لا هذه الصياغة التحليلية"


