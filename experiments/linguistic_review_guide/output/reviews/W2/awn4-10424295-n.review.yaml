        value: '{"roots":[{"word":"منتحل","root":"نحل","maqayis":"«النُّونُ وَالْحَاءُ وَاللَّامُ... وَالثَّالِثَةُ قَوْلُهُمْ: انْتَحَلَ كَذَا، إِذَا تَعَاطَاهُ وَادَّعَاهُ»"},{"word":"عرقي","root":"عرق","maqayis":"«الْعَيْنُ وَالرَّاءُ وَالْقَافُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى أُصُولِ الْأَشْيَاءِ... مِنْهُ عِرْقُ الشَّجَرَةِ وَغَيْرِهَا»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح حديث ومركب يركز بشكل دقيق ومباشر على الجانب العرقي والإثني للإخفاء والانتحال.","mwe":true}'
    - command: set_metadata
      params:
