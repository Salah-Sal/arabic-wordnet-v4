      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دعو","maqayis":"«الدَّالُ وَالْعَيْنُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ... وَالِادِّعَاءُ فِي الْحَرْبِ: الِاعْتِزَاءُ، وَهُوَ أَنْ تَقُولَ: أَنَا ابْنُ فُلَانٍ»"}'
