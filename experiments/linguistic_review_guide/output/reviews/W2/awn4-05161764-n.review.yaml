# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset: awn4-05161764-n  |  ili: i64069  |  pos: n
# definition_en: a useful or valuable quality  (asset, plus)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «رَصِيد» ذاتُ دلالةٍ ماليةٍ راسخة في المعاجم المعاصرة (الرصيد المصرفي)، ولا يُوجَد لها توثيقٌ معجمي بمعنى «الصفة المفيدة»؛ استعمالها المجازي في هذا المعنى استعمالٌ صحفي مُحدَث لا أساسَ له في المعاجم"
      - "لمّة «مَكْسَب» تدور في حقل الكسب والاقتناء والمكافأة المادية، ومدلولها «ما يُكسَب»، وهذا يُباعد بينها وبين دلالة «الصفة الذاتية المفيدة» التي هي وصفٌ كامن لا نتيجةُ اكتساب"
      - "غيابُ «مَزِيَّة» وهي الأصلُ الكلاسيكي الأثبتُ لهذا المفهوم؛ وثَّقَها الفيروزآبادي والمناوي والمعجم الوسيط وابن فارس جميعاً بمعنى «الفضيلة التي يمتاز بها الشخص على غيره»"
    observations: "المجموعةُ تمثِّل المفهومَ الإنجليزي (asset/plus) بمعناه الوصفي — أي «الصفة المفيدة ذاتُ القيمة» — لا بمعناه المالي. تعريفُها الحالي ترجمةٌ مقبولة لكنها مجردة. أبرزُ ما فيها من خللٍ: أن «رصيداً» و«مكسباً» ينتميان لحقلَي الماليات والاكتساب لا لحقل الصفات الذاتية، وأن «مَزِيَّة» الأوفرَ حظاً في الشواهد الكلاسيكية ساقطةٌ منها. وقد أفادت الترجمات في المورد الحديث أن المقابلات العربية الأمتن لـ(asset/advantage/merit) هي: مَزِيَّة، مِيزَة، حَسَنَة — وليس رصيداً أو مكسباً."
  blind_candidates:
    - lemma: "مَزِيَّة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر م-ز-و/م-ز-ي، وزن فَعِيلة، دالَّةٌ على الفضيلة التي يتميَّز بها الشخص أو الشيء على غيره؛ تنطبق انطباقاً تاماً على «صفة مفيدة ذات قيمة»"
    - lemma: "مَنْقَبَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن-ق-ب، وزن مَفْعَلَة، تعني الفعل الكريم المشهود والمفخرة؛ قريبة دلالياً من الصفة الحميدة ذات القيمة"
    - lemma: "فَضِيلَة"
      generation_method: ishtiqaq
      justification: "من الجذر ف-ض-ل، وزن فَعِيلة، تعني الخصلة الرفيعة الحميدة التي يتفوق بها الإنسان؛ تندرج ضمن «الصفات ذات القيمة»"
    - lemma: "مَكْرُمَة"
      generation_method: ishtiqaq
      justification: "من الجذر ك-ر-م، وزن مَفْعُلَة، تعني الخصلة الكريمة وفعل الخير المُشرِّف؛ مرشَّحة لـ«الصفة ذات القيمة» وإن كانت أكثر تخصُّصاً"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "رَصِيد"
      contradicts:
        - text: "«الرَّاصد (يقال: سبُعٌ رصيدٌ: يَرْصُدُ ليثب. وحيّةٌ رصيد. وهو رصيدٌ: يَرْصُدُ المارّة) ما يبقى للمُودِع فى المصرف من حسابه الجارى (مو) رصيد الذهب (فى الاقتصاد السياسي): الذَّهَبُ الضامنُ لإصدار الأوراق النقدية (مج)»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
          conflict: "المعنيان الأساسيان (الكامن الراصد، والرصيد المصرفي) لا صلةَ لهما بـ«الصفة المفيدة»؛ المعنى المالي مُوَلَّد حديث (مو) وليس أصيلاً"
        - text: "«يملك رصيداً كبيراً في البنك [فصيحة] التعليق: يمكن تصويب هذه الكلمة من جهة القياس... وقد أقرَّها مجمع اللغة المصري، وذكرها الوسيط على أنها مولَّدة»"
          source: "معجم الصواب اللغوي — أحمد مختار عمر"
          conflict: "تقرير الصواب مقتصر على الاستعمال المصرفي؛ لا ذِكرَ البتةَ لمعنى «الصفة المفيدة»"

    - lemma: "مَكْسَب"
      contradicts:
        - text: "«(المكسب) ما يكسب (ج) مكاسب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعنى الوحيد الموثَّق هو «ما يُكسَب» أي الربح والاقتناء؛ وهو مغايرٌ جوهرياً لـ«الصفة الكامنة المفيدة» التي هي وصفٌ ذاتي لا نتيجةُ فعل"

    - lemma: "مِيزَة"
      confirm:
        - text: "ميزة — advantage [Commerce and Accounting]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«مَيْزَة... الصواب والرتبة: مَيْزة السفر بالطائرة اقتصاد الوقت [فصيحة] — مِيزة السفر بالطائرة اقتصاد الوقت [فصيحة] — التعليق: اتفقت المعاجم القديمة والحديثة على أن الضبط الصحيح لكلمة «ميزة» بكسر الميم»"
          source: "معجم الصواب اللغوي — أحمد مختار عمر"
      expands:
        - text: "«(الميزة) الميز»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الإحالةُ إلى «الميز» (التمييز والفرز) تكشف أن المِيزَة هي الخاصية التي تُميِّز الشيءَ أو الشخصَ عن غيره وتمنحه طابعاً انفرادياً"
        - text: "«مَيْزَة من (م ي ز) المرة من الميز بمعنى العزل والفرز والتفضيل، والميزة: الرفعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "إضافة معنى «الرفعة» يُثبت أن المِيزَة ليست مجرد صفة فارقة بل صفة راقية ذات قيمة مضافة"

    - lemma: "مَزِيَّة"
      confirm:
        - text: "«المَزِيَّةُ، كغَنِيَّة: الفَضيلةُ»"
          source: "القاموس المحيط — الفيروزآبادي (ت 817هـ)"
        - text: "«المزية: التمام والفضيلة، ولفلان مزية أي فضيلة يمتاز بها على غيرها»"
          source: "التوقيف على مهمات التعاريف — المناوي (ت 1031هـ)"
        - text: "«(المزية) في كل شيء المزو والفضيلة يمتاز بها على غيره والطعام يخص به الرجل (ج) مزايا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«المَزِيَّةُ في كل شيء: المَزْو الفضيلةُ يمتاز بها على غيره»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
        - text: "«مَزِيَّة من (م ز ي) التمام، والفضيلة يمتاز بها الرجل على غيره»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الْمِيمُ وَالزَّاءُ أَصْلَانِ: أَحَدُهُمَا طَعْمٌ مِنَ الطَّعُومِ، وَالْآخُرُ يَدُلُّ عَلَى مَزِيَّةٍ وَفَضْلٍ. وَالْأَصْلُ الْآخَرُ الْفَضْلُ. وَلَهُ عَلَيْهِ مِزٌّ، أَيْ فَضْلٌ»"
          source: "مقاييس اللغة — ابن فارس (ت 395هـ)"
      expands:
        - text: "عامل المزيَّة (advantage factor) — Physics"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "توظيفٌ تقني حديث يُثبت حيوية مَزِيَّة الاصطلاحية وانتقالها إلى حقول علمية متخصصة"
        - text: "مزية اجتماعية قصوى (maximum social advantage) — Economics"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "التوظيف الاقتصادي يُقرِّبها أكثر من دلالة synset (الصفة ذات القيمة)"

    - lemma: "مَنْقَبَة"
      expands:
        - text: "«(المنقبة) الطريقُ الضيِّق بين دارَيْن لا يستطاع سلوكُه والفعلُ الكريمُ والمفخرةُ (ج) مناقب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "المنقبةُ تتمحور حول الفعل الكريم والمفخرة المُعلَنة، وهي أقرب لـ«achievement» منها لـ«صفة مفيدة كامنة»"
        - text: "«الْمَنْقَبَةُ: الْفَعْلَةُ الْكَرِيمَةُ، وَقِيَاسُهَا صَحِيحٌ، لِأَنَّهَا شَيْءٌ حَسَنٌ قَدْ شُهِرَ، كَأَنَّهُ نُقِّبَ عَنْهُ»"
          source: "مقاييس اللغة — ابن فارس (ت 395هـ)"
          addition: "تأكيدُ ابن فارس على الاشتهار والجهر يُرسِّخ انتماءَ المنقبة لحقل الإنجاز الظاهر لا الصفة الكامنة"

    - lemma: "فَضِيلَة"
      confirm:
        - text: "فضيلة — virtue [Philosophy and Psychology]"
          source: "مسرد الفلسفة وعلم النفس — المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«الفَضِيلَة: الدرجةُ الرفيعةُ في حسن الخُلُق. فضيلةُ الشيء: مزيَّتُه أو وظيفتُه التى قُصِدت منه»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
          conflict: "الفضيلة مُقيَّدة بحسن الخلق الأخلاقي أولاً، في حين أن المجموعةَ تشمل أيَّ صفة مفيدة بما فيها الوظيفية والمهارية"
        - text: "«الفضيلة: مَا يحصل به للإنسان مزية على غيره متوصِّلاً به إلى السعادة»"
          source: "معجم مقاليد العلوم — السيوطي (ت 911هـ)"
          conflict: "قيدُ «السعادة» يُخصِّص الفضيلة بالأبعاد الأخلاقية الغائية دون الصفات الوظيفية العامة"

    - lemma: "مَكْرُمَة"
      contradicts:
        - text: "«(المكرمة) فعلُ الخير (ج) مكارم وفي الأثر (بعثت لأتمم مكارم الأخلاق)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المكرمةُ فعلٌ خيِّر وإنعامٌ لا وصفٌ ذاتي ثابت؛ تنتمي لحقل الأفعال الكريمة لا الخصال الكامنة"
        - text: "«مَكْرُمَة من (ك ر م) فعل الخير، والكريم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "تأكيدٌ على ارتباطها بفعل الخير لا بالصفة الذاتية"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "رَصِيد"
      decision: removed
      decision_reason: "الرصيدُ مصطلحٌ مالي موثَّق ومُوَلَّد (مو) يعني «ما يبقى للمودِع في المصرف من حسابه الجاري»، ولا يرد في معجم معتمد بمعنى «صفة مفيدة». استعمالُه المجازي في الصحافة العربية («رصيده من الخبرة») استعمالٌ طارئ لا يصلح سنداً للتسجيل في شبكة دلالية. دلالتُه ترتبط بالحقل المالي والاحتياطي، لا بحقل الصفات الذاتية"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مَكْسَب"
      decision: removed
      decision_reason: "مكسبٌ بمعنى «ما يُكسَب» يدور في حقل الكسب والاقتناء؛ وهو يصف نتيجةَ فعل اكتسابي (gain/profit) لا خصلةً ذاتية كامنة في الشيء أو الشخص. المجموعةُ تعبِّر عن «صفة مفيدة» كـ«صبره ميزة» و«خبرته أصل»، وليس عن مكسب مكتسَب"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مِيزَة"
      decision: confirmed
      decision_reason: "مِيزَة موثَّقةٌ في المعاجم التقنية بمعنى «advantage» وتعني الخاصية التي تُميِّز الشيءَ أو الشخصَ وتمنحه قيمةً مضافة؛ يتطابق هذا مع «صفة مفيدة ذات قيمة». صيغتُها بكسر الميم مُقرَّرة في معجم الصواب اللغوي"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مِيزَة تُؤكِّد الجانبَ التمييزيَّ — أي الخاصيةُ التي تُفرِّق الشيءَ أو الشخصَ عن الآخرين وتمنحه طابعاً انفرادياً — مع تلمُّح معنى الرفعة"

    - lemma: "مَزِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مَزِيَّة مدعومةٌ بشواهد كلاسيكية وافرة: القاموس المحيط والوسيط والمناوي وابن فارس يُعرِّفونها كلُّهم بـ«الفضيلة التي يمتاز بها الشخص على غيره»، وهذا هو جوهر «صفة مفيدة ذات قيمة». اشتقاقها راسخٌ والوزن فَعِيلة مناسب للاسم الذاتي. وظَّفتها المعاجم التقنية الحديثة (عامل المزيَّة، مزيَّة اجتماعية) مما يُثبت فعاليتها الاصطلاحية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مَزِيَّة تُؤكِّد التفوُّقَ والفضلَ الذاتيَّ (مَزَّ الشيءُ = فضَل)؛ أعمُّ دلالةً وأرسخُ في التراث الكلاسيكي، وتلمح معنى التكامل والتمام"
      actions:
        - command: create_entry
          params:
            lemma: "مَزِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَنْقَبَة"
      source: stage1
      decision: removed
      decision_reason: "المنقبةُ تدور في حقل الفعل الكريم والمفخرة المُعلَنة — أي الإنجاز الظاهر الذي يُباهَى به — لا الصفةَ الكامنة الثابتة. الفرقُ الجوهري: هذا synset يصف خاصيةً (quality) أما المنقبةُ فإنجازٌ (achievement)"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "فَضِيلَة"
      source: stage1
      decision: removed
      decision_reason: "فضيلةٌ أخصُّ من المطلوب: معناها المعجمي «الدرجة الرفيعة في حسن الخلق»، وهذا أضيقُ من «أيِّ صفة مفيدة ذات قيمة» الذي يشمل الصفات الوظيفية والمهارية وليست الأخلاقية فقط. يؤكد ذلك توثيقُها في المعاجم التقنية تحت «virtue — Philosophy» لا «quality» العامة"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مَكْرُمَة"
      source: stage1
      decision: removed
      decision_reason: "المكرمةُ فعلٌ خيِّر وإنعام (act of generosity)، وانتماؤها لحقل الأفعال الكريمة لا الصفات الذاتية يُخرجها من نطاق هذا synset"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
