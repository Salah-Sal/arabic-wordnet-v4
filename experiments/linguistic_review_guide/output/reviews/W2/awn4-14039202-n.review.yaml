# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «حالة مؤقتة» مركبٌ وصفي حرّ لا مصطلحٌ مسكوك؛ إذ يمكن إبدال «مؤقتة» بـ«زائلة» أو «عارضة» ويبقى الوصف صالحاً، ما يُضعف خاصيته المعجمية."
      - "غياب التشكيل الكامل في اللمّة."
      - "المجموعة مكتفية بلمّة واحدة فريدة دون أي مرادف أو بديل اشتقاقي."
      - "التعريف الحالي «حالة تستمر لفترة محدودة» هو ترجمة حرفية للتعريف الإنجليزي، يفتقر إلى أسلوب المعجم الوسيط."
    observations: >
      المجموعة تمثّل مفهوماً كلياً مجرداً هو «الحالة المؤقتة»، وهو مفهوم راسخ في الفكر العربي الكلاسيكي
      والمعاصر على حدٍّ سواء. تُعبِّر عنه العربية بعدة طرائق: الوصف (مؤقت، وقتي، عارض)، والاشتقاق
      (العَرَض الفلسفي)، والتعبير الحرّ. اللمّة الموجودة «حالة مؤقتة» معقولة لغوياً لكنها عبارة وصفية
      لا مصطلح ثابت. المفهوم ينتمي إلى الحقل الدلالي للكيفيات الزائلة (states/conditions) في علم
      الوجود والنفس والطب.

  blind_candidates:
    - lemma: "عَرَض"
      generation_method: majaz
      justification: >
        إحياء للمصطلح الفلسفي الكلاسيكي الراسخ في المعجمية الإسلامية. العَرَض في منطق ابن سينا وعلم الكلام
        هو «ما يقوم بغيره ولا يدوم»، وهو بطبيعته حالة مؤقتة تعترض الموصوف ثم تزول. الجذر عرض،
        والوزن فَعَل يناسب المصادر الدالة على الحوادث والأعراض. اللفظ مسجَّل في المعاجم التعريفية
        الكلاسيكية بهذه الدلالة بالذات.

    - lemma: "طَارِئَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر «طرأ» على وزن فَاعِلَة، يعني ما يطرأ على الشيء من أحوال ليست من طبيعته
        الراسخة وتكون محدودة الأجل. وزن فَاعِلَة يُنتِج أسماء الأحداث والحالات الطارئة. الاستخدام
        المعاصر «حالة الطوارئ» يشهد لثبوت الجذر في هذا الحقل.

    - lemma: "وَقتِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «وَقْت» بإضافة ياء النسب وتاء التأنيث، على غرار «رسميَّة» و«مرحليَّة».
        الجذر وقت يدل على «حدّ الشيء وكنهه في الزمان»، فـ«الوقتية» تعني الاتصاف بكون الشيء محدوداً
        بوقت معلوم. المصطلح مستخدم في السياقات الأكاديمية والتقنية.

    - lemma: "مَرْحَلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «مرحلة» على وزن فَعَلِيَّة. يعني الحالة المرتبطة بمرحلة محددة، أي أن
        لها بداية ونهاية زمنية. يُستخدم في لغة التخطيط والتحليل الاستراتيجي لوصف الظواهر ذات
        الأمد المحدود.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  # ── استعلامات قاعدة البيانات المُنفَّذة ──
  # ١. مطابقة دفعية: حالة موقتة، عرض، طارئة/الطارئة، وقتية، مرحلية، طارئ/الطارئ، عارض/العارض
  # ٢. جسر إنجليزي: temporary state, temporary, transient state, transient, ephemeral
  # ٣. كلمات مفتاحية FTS: مؤقت، وقتي، زائل، عابر، محدود، قصير الأمد
  # ٤. إثراء مركّب: definitions + examples بالـ entry_ids
  # ٥. مقاييس اللغة: جذور عرض، وقت، حول

  per_lemma:

    - lemma: "حالة مؤقتة"
      confirm:
        - text: "«مُؤَقَّت، وقتي» — ترجمة: temporary"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (أرابترم)"
        - text: "«وقتي ؛ مؤقت» — ترجمة: temporary"
          source: "المعجم الطبي الموحد (أرابترم)"
        - text: "«مؤقت، وقتي» — ترجمة: temporary"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (أرابترم)"
        - text: "«مؤقّت؛ وقتيّ a temporary solution.»"
          source: "المورد الحديث (أرابترم)"
      expands:
        - text: "«عمل مؤقت، شغل مؤقت» — تعريف: عمل يتم، بحسب طبيعته، لمدة محدودة من الزمن."
          source: "المعجم الموحد لمصطلحات القانون (أرابترم)"
          addition: "يُثبِت أن وصف «مؤقت» ينصرف إلى ما له أجل محدود بطبيعته، وهو الفصل النوعي في تعريف المجموعة."
        - text: "«قصير الديمومة ؛ عابر» — ترجمة: ephemeral"
          source: "المعجم الطبي الموحد (أرابترم)"
          addition: "يُبيّن أن العربية تستعمل «قصير الأمد» و«عابر» في سياق ما يوازي temporary/ephemeral، مما يوسّع مرادفات المجموعة."

    - lemma: "عَرَض"
      confirm:
        - text: "«العَرَضُ: هُوَ الْحَال فِي المتحيز.»"
          source: "معجم مقاليد العلوم للسيوطي (ت 911هـ)"
        - text: "«العَرَضُ: مُمكن يكون فِي مَوْضُوع.»"
          source: "معجم مقاليد العلوم للسيوطي (ت 911هـ)"
        - text: "«العرض: بالتحريك، الموجود الذي يحتاج في وجوده إلى موضع أي محل يقوم به كاللون المحتاج في وجوده إلى جسم يحله ويقوم هو به.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1031هـ)"
        - text: "«وَالْعَرَضُ مِنْ أَحْدَاثِ الدَّهْرِ، كَالْمَرَضِ وَنَحْوِهِ، سُمِّيَ عَرَضًا لِأَنَّهُ يَعْتَرِضُ.»"
          source: "مقاييس اللغة لابن فارس (ت 395هـ)"
        - text: "«العَرَض: مَا يتبع الْمَرَض.»"
          source: "معجم مقاليد العلوم للسيوطي (ت 911هـ)"
      contradicts:
        - text: "«العارض: للشيء ما يكون محمولاً عليه خارجاً عنه، والعارضُ من الأشياء: خلافُ الأصلي، ومن الحوادث خلاف الثابت.»"
          source: "التعريفات الفقهية للبركتي (ت 1969م)"
          conflict: "يُميِّز الفقهاء بين العَرَض (الحادثة الفلسفية التي تقوم بموضوع) والحالة المؤقتة العامة؛ فالعَرَض مفهوم أضيق دلالةً من «temporary state» في السياق الحديث، إذ يقتصر على السياق الفلسفي-الوجودي."

    - lemma: "طَارِئَة"
      contradicts:
        - text: "«الدَّاهيةُ التي لا يُعرَب من أين أتت»"
          source: "المعجم الكبير (مجمع القاهرة)"
          conflict: "الطارئة في معاجم الفصحى تعني الداهية والمصيبة المفاجئة، وهي أخصّ من «الحالة المؤقتة»؛ فليس كل حالة مؤقتة داهية."
        - text: "«(الطارئة) مؤنث الطَّارِئ والداهية الَّتِي لَا يعرف من أَيْن أَتَت (ج) طوارئ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (الهوراماني)"
          conflict: "التعريف يؤكد الطارئة = الداهية المنكرة، لا مجرد حالة محدودة الزمن."
      expands:
        - text: "«حالَة الطَّوارِئ: حالَةٌ من التَّأَهُّبِ»"
          source: "المعجم الكبير (مجمع القاهرة)"
          addition: "التعبير المركّب «حالة الطوارئ» استقلّ بدلالة إدارية/قانونية خاصة، لا علاقة له بالمفهوم الكلي «حالة مؤقتة»."

    - lemma: "وَقتِيَّة"
      confirm:
        - text: "«وقتي ؛ مؤقت» — ترجمة: temporary"
          source: "المعجم الطبي الموحد (أرابترم)"
        - text: "«مُؤَقَّت، وقتي» — ترجمة: temporary"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (أرابترم)"
        - text: "«عابِر، وقتي» — ترجمة: transient"
          source: "المعجم الموحد لمصطلحات النفط (أرابترم)"
      contradicts:
        - text: "«وقتي» يُستخدم في المعاجم كـصفة (adjective) لا كاسم جامد للحالة."
          source: "شواهد أرابترم المتعددة — الاستعمال السياقي"
          conflict: "«وقتية» كمصدر صناعي يعني صفة التأقيت لا الحالة المؤقتة ذاتها، فهو مفهوم مجرد (abstractum) لا مقابل للـ «temporary state»."

    - lemma: "مَرْحَلِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حالة مؤقتة"
      decision: confirmed
      decision_reason: >
        المركّب الوصفي «حالة مؤقتة» هو التعبير المتداول والمستقرّ في الفصحى الحديثة للدلالة على
        «temporary state»، ويُستخدم في اللغة التقنية والإدارية والطبية والقانونية. وإن كان عبارة
        وصفية لا مصطلحاً مسكوكاً بالمعنى الدقيق، إلا أنه وحدة معجمية مستقرة في الاستعمال.
        غياب البديل المفرد المتداول يجعله الخيار الأفضل. يحتاج إلى ضبط التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالَة مُؤَقَّتَة"

    - lemma: "عَرَض"
      source: stage1
      decision: removed
      decision_reason: >
        «العَرَض» مصطلح فلسفي-منطقي يعني «ما يحتاج في وجوده إلى موضوع يقوم به ويزول»، وهو
        أخصّ دلالةً من «الحالة المؤقتة» الكلية في هذه المجموعة. فكل عَرَض فلسفي حالة مؤقتة،
        لكن ليس كل حالة مؤقتة عَرَضاً بالمعنى الفلسفي. الاشتراك اللفظي كبير (العرض = الاتساع،
        والعرض = الشيء المعروض، والعَرَض الفلسفي)، مما يُعرِّض المصطلح لسوء الفهم خارج
        سياق الفلسفة. لا يصلح كمرادف عام للـ «temporary state».

    - lemma: "طَارِئَة"
      source: stage1
      decision: removed
      decision_reason: >
        «الطارئة» في معاجم الفصحى تُعرَّف بالداهية والمصيبة المفاجئة التي لا يُعرف مأتاها.
        هذا التحميل الدلالي السلبي يجعلها غير ملائمة لتمثيل «الحالة المؤقتة» المحايدة كالفرح
        والراحة والتعب. فضلاً عن أن «حالة الطوارئ» قد ثبت له معنى إداري-قانوني مستقل لا علاقة
        له بهذه المجموعة.

    - lemma: "وَقتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «وقتية» مصدر صناعي يدل على صفة التأقيت (the quality of being temporary) لا على حالة
        مؤقتة بعينها. هو مفهوم مجرد من الدرجة الثانية (meta-concept). البنية الصرفية (فَعَلِيَّة
        المصدر الصناعي) لا تُنشئ اسماً للحالة بل اسماً للخاصية، مما يبعده عن مقابلة «temporary
        state» مباشرةً.

    - lemma: "مَرْحَلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «مرحلية» تعني الانتماء إلى مرحلة (phase) أو التحقق في مرحلة زمنية معينة، وهي أعمّ
        ولا تضمن التأقيت بالضرورة؛ فالمرحلة قد تكون طويلة وشبه دائمة. لا أدلة معجمية على
        استعمالها مقابلاً لـ «temporary state»، ولم يُجدِ البحث شيئاً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "حالة تستمر لفترة محدودة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية مباشرة للتعريف الإنجليزي «a state that continues for a limited time»،
        لا يتجاوز الدوران بين «حالة» و«تستمر» دون فصل نوعي حاسم. يفتقر إلى أسلوب المعجم
        الوسيط، ولا يُميِّز الحالة المؤقتة من الدائمة بجامع واضح.
    authored:
      - type: terminological
        text: >
          كيفيَّةٌ تعرض للكائن أو الشيء فتلازمه مدةً معلومةً ثم تزول، في مقابل الحالة الدائمة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          كلُّ حالٍ يعرض للشيء في حينٍ معلوم وتنتهي باستيفاء أمدها، كالسرور والحزن والتعب
          والمرض ونحوها، خلافَ ما يلازم الشيء ملازمةً دائمة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
