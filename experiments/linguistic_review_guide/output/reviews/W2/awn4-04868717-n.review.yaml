stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائرى (استخدام الكلمة المشتقة في التعريف)."
      - "نقص التشكيل في اللمات الموجودة."
    observations: "المجموعة تدور حول صفة القوة والضبط في اتخاذ القرار وتنفيذه. اللمات الموجودة (حزم، عزم) أساسية، لكن ينقصها التشكيل وبعض المترادفات القوية مثل (عزيمة) و(صرامة)."
  blind_candidates:
    - lemma: "حَزْم"
      generation_method: ishtiqaq
      justification: "المصدر الأصلي للفعل حزم، ويعبر عن ضبط الأمر وإحكامه."
    - lemma: "عَزِيمَة"
      generation_method: ishtiqaq
      justification: "تعبير عن الإرادة المؤكدة والقصد الجازم."
    - lemma: "صَرَامَة"
      generation_method: ishtiqaq
      justification: "تعبر عن الحزم والشدة والقطع في الأمور دون تردد."
    - lemma: "مَضَاء"
      generation_method: majaz
      justification: "تعبير عن نفاذ القرار واستمراره كالسيف الصارم."

stage2_evidence:
  per_lemma:
    - lemma: "حَزْم"
      confirm:
        - text: "«الحَزْمُ: ضَبْطُ الأَمْرِ، والأَخْذُ فيه بالثِّقَةِ»"
          source: "القاموس المحيط"
        - text: "«الحَزْمُ: جَوْدَةُ الرَّأْيِ... وَذَلِكَ اجْتِمَاعُهُ وَأَلَّا يَكُونَ مُضْطَرِبًا مُنْتَشِرًا»"
          source: "مقاييس اللغة"
    - lemma: "عَزْم"
      confirm:
        - text: "«العَزْمُ: هو جزمُ الإرادة بعد تردد.»"
          source: "التعريفات الفقهية"
        - text: "«العَزْمُ: مَا عُقِدَ عَلَيْهِ الْقَلْبُ مِنْ أَمْرٍ أَنْتَ فَاعِلُهُ»"
          source: "مقاييس اللغة"
    - lemma: "عَزِيمَة"
      confirm:
        - text: "«العزيمة: في اللغة عبارة عن الإرادة المؤكدة»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«عَزِيمَة: إرادة فعل الشيء وعقد النية عليه»"
          source: "موسوعة السلطان قابوس"
    - lemma: "صَرَامَة"
      confirm:
        - text: "«الصَّارِمُ: رجلٌ صارمٌ: شجاعٌ، أو باتٌّ فى أمره ماضٍ»"
          source: "المعجم الكبير"
      expands:
        - text: "«الصَّرِيمَة: العزيمة على الأمر وإحكام إبرامه. الرأي النافذ.»"
          source: "المعجم الكبير"
    - lemma: "مَضَاء"
      confirm:
        - text: "«ماضي العزيمة: نافذ الإرادة، حاسم»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "حزم"
      decision: confirmed
      decision_reason: "كلمة أساسية تعبر عن جوهر المفهوم، تحتاج فقط للتشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَزْم"
    - lemma: "عزم"
      decision: confirmed
      decision_reason: "تعبر عن الإرادة والنية المؤكدة، وهي ركن في الحزم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَزْم"
    - lemma: "عَزِيمَة"
      source: stage1
      decision: confirmed
      decision_reason: "من أكثر الكلمات شيوعاً للتعبير عن قوة الإرادة والتصميم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "عَزِيمَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04868717-n"
    - lemma: "صَرَامَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن الجانب التنفيذي والقاطع في الحزم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "صَرَامَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04868717-n"

stage4_content:
  definition:
    current: "سمة كون المرء حازماً"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري ولا يشرح المفهوم بوضوح."
    authored:
      - type: terminological
        text: "ضَبْطُ الأمرِ وإحكامُهُ، والأخذُ فيه بالثِّقةِ، والمَضاءُ في تَنفيذهِ دونَ تَردُّدٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "حَزْم"
        examples:
          - text: "أظهرَ القائدُ حَزْمًا كبيرًا في التصدِّي للأزمةِ ومنعِ تفاقمِها."
            type: usage
      - lemma: "عَزْم"
        examples:
          - text: "عقَدَ الطالِبُ العَزْمَ على التفوُّقِ في دراستِهِ هذا العام."
            type: usage
      - lemma: "عَزِيمَة"
        examples:
          - text: "بِالعَزِيمَةِ القويَّةِ يُمكِنُ للإنسانِ تَجاوزُ كلِّ العقبات."
            type: usage
      - lemma: "صَرَامَة"
        examples:
          - text: "تُطبَّقُ القوانينُ بِصَرَامَةٍ لِضمانِ العدالةِ والنِّظام."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04868717-n"
          definition_index: 0
          text: "ضَبْطُ الأمرِ وإحكامُهُ، والأخذُ فيه بالثِّقةِ، والمَضاءُ في تَنفيذهِ دونَ تَردُّدٍ."
      - command: add_synset_example
        params:
          synset_id: "awn4-04868717-n"
          text: "لا يَصِلُ المرءُ إلى غاياتِهِ الكُبرى إلَّا بِالحَزْمِ والعَزِيمَة."

