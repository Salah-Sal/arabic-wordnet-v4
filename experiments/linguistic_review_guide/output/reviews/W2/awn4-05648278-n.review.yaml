stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي حرفي للغاية (حالة كونه ماهراً معرفياً) ويبدو ترجمة مباشرة للتعريف الإنجليزي."
      - "نقص التشكيل في اللمات الموجودة."
    observations: "المفهوم يشير إلى التمكن الذهني والإتقان في الأداء، وهو ما تعبر عنه كلمات مثل البراعة والمهارة والحذق."
  blind_candidates:
    - lemma: "بَرَاعَة"
      generation_method: ishtiqaq
      justification: "مصدر برع، وهو التميز والتفوق في العلم أو الفن."
    - lemma: "مَهَارَة"
      generation_method: ishtiqaq
      justification: "المصدر الشائع للتعبير عن الحذق والإتقان في العمل."
    - lemma: "حِذْق"
      generation_method: ishtiqaq
      justification: "لفظ تراثي دقيق يعبر عن مهارة الصانع ومعرفته بدقائق الأمور."
    - lemma: "حَذَاقَة"
      generation_method: ishtiqaq
      justification: "صيغة مصدرية أخرى للحذق، شائعة في الاستعمال المعاصر والقاموس المحيط."

stage2_evidence:
  per_lemma:
    - lemma: "براعة"
      confirm:
        - text: "«البراعة: كمال الفضل والتبرز... وقال أبو البقاء البراعة حسن الفصاحة الخارجة عن نظائرها.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«براعة: [في الانكليزية] Excellence ،eloquence... في اللغة التفوّق.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«براعة: mastery»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
    - lemma: "مهارة"
      confirm:
        - text: "«قدرة على أداء عمل بكيفية محددة وبدقة و بحذق وإتقان وسرعة في التنفيذ.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«التمكن من إنجاز مهمة بكيفية محددة وبدقة متناهية، وسرعة في التنفيذ...»"
          source: "مسرد التربية (ArabTerm)"
      expands:
        - text: "«مهارة معرفية: cognitive skill»"
          source: "مسرد الفن (ArabTerm)"
    - lemma: "حذق"
      confirm:
        - text: "«الحِذْقُ والحَذاقةُ: مَهارةٌ في كُلِّ شيءٍ. والحِذَقْ مصدر حَذَقَ وحَذِقَ معاً في عمله فهو حاذق.»"
          source: "كتاب العين للخليل بن أحمد"
        - text: "«الرجل الحاذق في صناعته، وهو الماهر، وذلك أنه يحذق الأمر يقطعه لا يدع فيه متعلقاً.»"
          source: "مقاييس اللغة لابن فارس"
    - lemma: "حذاقة"
      confirm:
        - text: "«حذَق عملَه... يجب أن يتصرّف بحذاقة كبيرة.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«الحِذْقُ والحَذاقةُ: مَهارةٌ في كُلِّ شيءٍ.»"
          source: "لسان العرب"

stage3_analysis:
  per_lemma:
    - lemma: "بَرَاعَة"
      decision: confirmed
      decision_reason: "مصطلح أصيل يعبر عن التفوق والتميز في الأداء المعرفي واللغوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَرَاعَة"
    - lemma: "مَهَارَة"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً في العصر الحديث للتعبير عن الكفاءة والقدرة العالية في التنفيذ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَهَارَة"
    - lemma: "حِذْق"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي دقيق يعبر عن التمكن من دقائق العلم والصنعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حِذْق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-05648278-n"}
    - lemma: "حَذَاقَة"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة فصيحة مدعومة بالمعاجم المعاصرة، وتستخدم للتعبير عن استمرار صفة الحذق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حَذَاقَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-05648278-n"}

stage4_content:
  definition:
    current: "حالة كونه ماهراً معرفياً"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية ركيكة."
    authored:
      - type: terminological
        text: "إِتْقَانُ المَرْءِ لِعَمَلِهِ أَوْ عِلْمِهِ، وَتَمَكُّنُهُ مِنْ دَقَائِقِهِ وَتَفَوُّقُهُ فِيهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-05648278-n", definition_index: 0, text: "إِتْقَانُ المَرْءِ لِعَمَلِهِ أَوْ عِلْمِهِ، وَتَمَكُّنُهُ مِنْ دَقَائِقِهِ وَتَفَوُّقُهُ فِيهِ."}
  examples:
    per_lemma:
      - lemma: "بَرَاعَة"
        examples:
          - text: "أظهر الكاتب براعة فائقة في صياغة أفكاره المعقدة."
            type: usage
      - lemma: "مَهَارَة"
        examples:
          - text: "تتطلب حل المشكلات الرياضية مهارة ذهنية عالية."
            type: usage
      - lemma: "حِذْق"
        examples:
          - text: "لا يصل المرء إلى درجة الحذق في العلم إلا بالممارسة الطويلة."
            type: usage
      - lemma: "حَذَاقَة"
        examples:
          - text: "أدار القائد الأزمة بحذاقة لافتة."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-05648278-n", text: "يتطلب البحث العلمي براعة في التحليل وحذقاً في الاستنباط."}

