stage1_review:
  assessment:
    concerns:
      - المصطلحات الحالية تركز على الجانب الإحصائي/التقني (شريحة، فئة) وتغفل الألفاظ اللغوية الأصيلة الأكثر دقة.
      - لفظ "فوج" واسع الدلالة ويحتاج لتقييد سياقي ليدل على "المجموعة العمرية" (Cohort).
    observations: "المجموعة الترادفية تعبر عن مفهوم 'Cohort' الإنجليزي، والذي يشمل معنيين في العربية: الأول هو التساوي المحض في السن (أتراب، لدات)، والثاني هو الاشتراك في خصائص زمنية أو اجتماعية (جيل، طبقة، فئة عمرية). التوليد ركز على إحياء الألفاظ التراثية الدقيقة."
  blind_candidates:
    - lemma: "جِيل"
      generation_method: majaz
      justification: "لفظ شائع يدل على أهل الزمان الواحد أو الأمة، وهو المرادف الأقرب لـ generation وcohort في السياق العام."
    - lemma: "أَتْرَاب"
      generation_method: ishtiqaq
      justification: "جمع 'تِرْب'، وهو المماثل في السن، وهو لفظ قرآني بليغ لهذا المعنى."
    - lemma: "لِدَات"
      generation_method: ishtiqaq
      justification: "جمع 'لِدَة'، وهم المولودون في وقت واحد، ويطلق على الأقران في السن."
    - lemma: "طَبَقَة"
      generation_method: majaz
      justification: "تستخدم معجمياً واصطلاحياً (عند المحدثين) للدلالة على الجماعة المشتركة في السن واللقاء."

stage2_evidence:
  per_lemma:
    - lemma: "أَتْرَاب"
      confirm:
        - text: "«أتراب: المماثل في السن... هؤلاء الطلاب أتراب»"
          source: "معجم الصواب اللغوي"
        - text: "«التِّرْب: اللِّدَةُ والسِّنُّ، ومَنْ وُلِدَ مَعَكَ»"
          source: "القاموس المحيط"
        - text: "«أتراب: (جمع) المماثل في السن»"
          source: "المعجم الوسيط"
    - lemma: "جِيل"
      confirm:
        - text: "«الجِيل: أهل الزَّمان الواحد أو ثلث القرن يتعايش فيه النّاسُ»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«الجِيل: القرن، وقيل: أهل الزمان الواحد»"
          source: "تاج العروس"
      expands:
        - text: "«في علم الاجتماع generation: الفترة الزمنية التي يستطيع الابن أن يخلف فيها أباه»"
          source: "المعجم الكبير"
    - lemma: "لِدَات"
      confirm:
        - text: "«اللَّدَّةُ: المساوي في السنِّ تِرْبُ الرجل: مَنْ وُلد مَعه»"
          source: "المعجم الكبير"
        - text: "«اللِّدَة: من ولد معك»"
          source: "القاموس المحيط"
    - lemma: "طَبَقَة"
      confirm:
        - text: "«جماعة اشتركوا في السن ولقاء المشايخ»"
          source: "كشاف اصطلاحات الفنون"
        - text: "«فئة من الأشخاص أو الأشياء تشترك في عدة خصائص»"
          source: "مسرد الإعلام (ArabTerm)"
    - lemma: "فِئَة عُمْرِيَّة"
      confirm:
        - text: "«age group: فِئَةٌ عُمْرِيَّة»"
          source: "المعجم الطبي الموحد"
        - text: "«تقسيم أعمار الأشجار والغابات إلى فئات من أجل التصنيف»"
          source: "مسرد المناخ (ArabTerm)"
    - lemma: "فَوْج"
      confirm:
        - text: "«الفَوْجُ: الجماعة من الناس»"
          source: "لسان العرب"
      expands:
        - text: "«جماعة من الناس تأتي في وقت واحد»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "شَرِيحَة عُمْرِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "شَرِيحَة عُمْرِيَّة"
      decision: confirmed
      decision_reason: "مصطلح حديث شائع جداً في الدراسات الاجتماعية والإحصائية، وهو استعارة (مجاز) لكلمة شريحة بمعنى قطعة أو جزء."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَرِيحَة عُمْرِيَّة"
    - lemma: "فِئَة عُمْرِيَّة"
      decision: confirmed
      decision_reason: "مصطلح تقني معياري مستخدم في المعاجم الطبية والإحصائية (ArabTerm)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِئَة عُمْرِيَّة"
    - lemma: "فَوْج"
      decision: confirmed
      decision_reason: "يستخدم للدلالة على الدفعة أو الجماعة التي تمر بمرحلة معينة معاً (Cohort)، خاصة في سياق التعليم (فوج التخرج)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَوْج"
    - lemma: "جِيل"
      source: stage1
      decision: confirmed
      decision_reason: "أحد أكثر الألفاظ دقة للدلالة على 'أهل الزمان الواحد'، وهو مرادف أساسي لـ generation."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "جِيل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "أَتْرَاب"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ فصيح بليغ يدل صراحة على التساوي في السن، وهو مناسب جداً للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أَتْرَاب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "لِدَات"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي دقيق يدل على المواليد في وقت واحد، ويستخدم كمرادف للأقران."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "لِدَات", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "طَبَقَة"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم في السياقات العلمية (كعلم الحديث وعلم الاجتماع) للدلالة على المشتركين في السن أو المرحلة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "طَبَقَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "مجموعة من الناس لديهم نفس العمر تقريباً"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً، ويفضل صياغته بأسلوب معجمي يجمع بين الجانبين اللغوي والاصطلاحي."
    authored:
      - type: terminological
        text: "مجموعةٌ من الأفرادِ المُتساوِينَ أو المُتقارِبِينَ في السنِّ، أو الذينَ يشتركونَ في مرحلةٍ زمنيّةٍ أو خصائصَ اجتماعيّةٍ واحدةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "شَرِيحَة عُمْرِيَّة"
        examples:
          - text: "تستهدف الحملة الصحية الشريحة العمرية ما بين العشرين والثلاثين عاماً."
            type: usage
      - lemma: "فِئَة عُمْرِيَّة"
        examples:
          - text: "أظهرت الإحصاءات نمواً ملحوظاً في الفئة العمرية الشابة."
            type: usage
      - lemma: "فَوْج"
        examples:
          - text: "تخرج هذا العام فوج جديد من الأطباء المتخصصين."
            type: usage
      - lemma: "جِيل"
        examples:
          - text: "يسعى الجيل الحالي إلى مواكبة التطورات التكنولوجية المتسارعة."
            type: usage
      - lemma: "أَتْرَاب"
        examples:
          - text: "نشأ الصديقان أتراباً في حي واحد، فلا يكاد أحدهما يسبق الآخر في شيء."
            type: usage
      - lemma: "لِدَات"
        examples:
          - text: "هؤلاء النسوة لِداتٌ، ولدن كلهن في عام المجاعة."
            type: usage
      - lemma: "طَبَقَة"
        examples:
          - text: "صنّف المحدثون الرواة إلى طبقات بحسب السن واللقاء."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "مجموعةٌ من الأفرادِ المُتساوِينَ أو المُتقارِبِينَ في السنِّ، أو الذينَ يشتركونَ في مرحلةٍ زمنيّةٍ أو خصائصَ اجتماعيّةٍ واحدةٍ."}

stage5_enrichment:
  per_entry:
    - lemma: "جِيل"
      entry_id: "{auto}"
      root: "جيل"
      maqayis_quote: "«الْجِيمُ وَالْيَاءُ وَاللَّامُ يَدُلُّ عَلَى التَّجَمُّعِ. فَالْجِيلُ الْجَمَاعَةُ. وَالْجِيلُ هَذِهِ الْأُمَّةُ»"
    - lemma: "أَتْرَاب"
      entry_id: "{auto}"
      root: "ترب"
      maqayis_quote: "«التَّاءُ وَالرَّاءُ وَالْبَاءُ أَصْلَانِ... وَالْآخَرُ تَسَاوِي الشَّيْئَيْنِ... وَالتِّرْبُ الْخِدْنُ، وَالْجَمْعُ أَتْرَابٌ»"
    - lemma: "لِدَات"
      entry_id: "{auto}"
      root: "ولد"
      maqayis_quote: "«الْوَاوُ وَاللَّامُ وَالدَّالُ: أَصْلٌ صَحِيحٌ، وَهُوَ دَلِيلُ النَّجْلِ وَالنَّسْلِ... وَاللِّدَةُ نُقْصَانُهُ الْوَاوُ لِأَنَّ أَصْلَهُ وِلْدَةٌ»"
    - lemma: "طَبَقَة"
      entry_id: "{auto}"
      root: "طبق"
      maqayis_quote: "«الطَّاءُ وَالْبَاءُ وَالْقَافُ أَصْلٌ صَحِيحٌ وَاحِدٌ، وَهُوَ يَدُلُّ عَلَى وَضْعِ شَيْءٍ مَبْسُوطٍ عَلَى مِثْلِهِ حَتَّى يُغَطِّيَهُ... وَالطَّبَقُ: الْحَالُ... وَالطَّبَقُ: الْجَمَاعَةُ مِنَ الْجَرَادِ»"
    - lemma: "فَوْج"
      entry_id: "{auto}"
      root: "فوج"
      maqayis_quote: "«الْفَاءُ وَالْوَاوُ وَالْجِيمُ كَلِمَةٌ تَدُلُّ عَلَى تَجَمُّعٍ. مِنْ ذَلِكَ الْفَوْجُ، الْجَمَاعَةُ مِنَ النَّاسِ»"
    - lemma: "فِئَة عُمْرِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "فئة"
          root: "فيأ"
        - word: "عمرية"
          root: "عمر"
    - lemma: "شَرِيحَة عُمْرِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "شريحة"
          root: "شرح"
        - word: "عمرية"
          root: "عمر"
  per_sense:
    - lemma: "شَرِيحَة عُمْرِيَّة"
      sense_id: "{auto}"
      nuance: "مصطلح إحصائي واجتماعي حديث يدل على قطاع من السكان ضمن مدى عمري محدد."
      mwe: true
    - lemma: "فِئَة عُمْرِيَّة"
      sense_id: "{auto}"
      nuance: "مصطلح تقني ومعياري يستخدم في التصنيفات العلمية والطبية."
      mwe: true
    - lemma: "فَوْج"
      sense_id: "{auto}"
      nuance: "يدل على مجموعة تمر معاً بمرحلة أو تجربة محددة (مثل فوج دراسي)، وهو أقرب لمعنى cohort في السياق التنظيمي."
      mwe: false
    - lemma: "جِيل"
      sense_id: "{auto}"
      nuance: "يدل على أهل الزمان الواحد، ويشمل عادة مدى زمنياً أوسع (نحو 30 سنة) ويرتبط بخصائص ثقافية وتاريخية مشتركة."
      mwe: false
    - lemma: "أَتْرَاب"
      sense_id: "{auto}"
      nuance: "تؤكد على التساوي التام في السن، وغالباً ما تستخدم في سياق الرفقة والصحبة."
      mwe: false
    - lemma: "لِدَات"
      sense_id: "{auto}"
      nuance: "دقيقة جداً في الدلالة على التساوي في وقت الولادة، وتجمع 'لدة'."
      mwe: false
    - lemma: "طَبَقَة"
      sense_id: "{auto}"
      nuance: "تدل على جماعة تشترك في السن والمنزلة أو تجتمع في طبقة زمنية محددة."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جيل","maqayis":"«الْجِيمُ وَالْيَاءُ وَاللَّامُ يَدُلُّ عَلَى التَّجَمُّعِ. فَالْجِيلُ الْجَمَاعَةُ. وَالْجِيلُ هَذِهِ الْأُمَّةُ»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يدل على أهل الزمان الواحد، ويشمل عادة مدى زمنياً أوسع ويرتبط بخصائص ثقافية وتاريخية مشتركة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
