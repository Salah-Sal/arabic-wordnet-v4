stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمة واحدة فقط، بينما يغطي المفهوم الإنجليزي 'anal personality' و'anal retentive personality'."
    observations: "المفهوم متعلق بالتحليل النفسي الفرويدي، والمصطلح العربي الشائع هو 'شخصية شرجية'، وهو مصطلح مركب (وصف). كما يبرز مفهوم 'anal retentive' كصفة فرعية تترجم غالباً بـ 'احتباسية' أو 'حاصرة'."
  blind_candidates:
    - lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ"
      generation_method: tarkib
      justification: "الترجمة المباشرة والمصطلح المستقر في كتب علم النفس لمفهوم 'anal personality'."
    - lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ احْتِبَاسِيَّةٌ"
      generation_method: tarkib
      justification: "ترجمة دقيقة لمصطلح 'anal retentive personality' باستخدام الصفة 'احتباسية' للتعبير عن الاحتجاز (retention)."
    - lemma: "النَّمَطُ الشَّرْجِيُّ"
      generation_method: tarkib
      justification: "استخدام 'النمط' كبديل لـ 'الشخصية' في السياقات العلمية."
    - lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ حَاصِرَةٌ"
      generation_method: tarkib
      justification: "استخدام 'حاصرة' كمرادف لـ 'احتباسية' في وصف الميول الاحتجازية."

stage2_evidence:
  per_lemma:
    - lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ"
      confirm:
        - text: "«المرحلة الشرجية: anal stage»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«الشبقية الشرجية: تثبيت الرغبة الجنسية عند المرحلة الشرجية، وهو أحد مفاهيم مدرسة التحليل النفسي.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«الشرجي: ما يتعلق بالشرج أو ينتمي إليه»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
    - lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ احْتِبَاسِيَّةٌ"
      confirm:
        - text: "«احتباسيّ: retentive»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«احتباسي: متعلق بالاحتفاظ أو الاحتجاز»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "النَّمَطُ الشَّرْجِيُّ"
      confirm:
        - text: "«الطور الشرجي: anal phase (anal stage)»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ حَاصِرَةٌ"
      confirm:
        - text: "«حابسة: retentive»"
          source: "المعجم الطبي الموحد (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "شخصية شرجية"
      decision: confirmed
      decision_reason: "المصطلح العربي المستقر في علم النفس لتمثيل 'anal personality'. مكونات المصطلح (شخصية + شرجية) مؤكدة في المعاجم المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ"
    - lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ احْتِبَاسِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "إضافة ضرورية لتمثيل المفهوم الإنجليزي 'anal retentive personality' بدقة، حيث تعبر 'احتباسية' عن جوهر المفهوم الفرويدي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ احْتِبَاسِيَّةٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "(التحليل النفسي) شخصية تتميز بالدقة المتناهية والشك والتحفظ؛ يقال إنها تتشكل في الطفولة المبكرة عن طريق التثبيت خلال المرحلة الشرجية من التطور (عادة نتيجة للتدريب على استخدام المرحاض)"
    assessment:
      decision: revise
      reason: "تحسين الصياغة الأسلوبية لتكون أكثر اتساقاً مع الأسلوب المعجمي العربي، مع الحفاظ على الدقة العلمية."
    authored:
      - type: terminological
        text: "(في علم النفس) نمطٌ من الشخصية يرتبط بمرحلة الطفولة المبكرة، ويتميز أصحابه بالنظام المفرط، والعناد، والميل إلى التملك، والحرص الشديد والشك."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "(في علم النفس) نمطٌ من الشخصية يرتبط بمرحلة الطفولة المبكرة، ويتميز أصحابه بالنظام المفرط، والعناد، والميل إلى التملك، والحرص الشديد والشك."
  examples:
    per_lemma:
      - lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ"
        examples:
          - text: "يصف علماء النفس الشخصية الشرجية بأنها نمط يتسم بالدقة المفرطة والحرص."
            type: usage
      - lemma: "شَخْصِيَّةٌ شَرَجِيَّةٌ احْتِبَاسِيَّةٌ"
        examples:
          - text: "تتميز الشخصية الشرجية الاحتباسية بميل مرضي للسيطرة والتدقيق في التفاصيل."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يصف علماء النفس الشخصية الشرجية بأنها نمط يتسم بالدقة المفرطة والحرص."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتميز الشخصية الشرجية الاحتباسية بميل مرضي للسيطرة والتدقيق في التفاصيل."

