  per_entry:
    - lemma: "نَسَق"
      entry_id: "{auto}"
      root: "نسق"
      maqayis_quote: "«النُّونُ وَالسِّينُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَتَابُعٍ فِي الشَّيْءِ.»"
