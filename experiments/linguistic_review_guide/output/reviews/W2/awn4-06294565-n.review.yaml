# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06294565-n
# source language — لغة المصدر
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «لغة المصدر» خالية من التشكيل"
      - "المجموعة تحتوي لمّة واحدة فقط، والمفهوم قد يُعبَّر عنه بصيغ متعدّدة في العربية"
    observations: >
      المفهوم ينتمي إلى حقل الترجمة واللسانيات التطبيقية، ويُقابل اللغة التي يُنقَل منها النصّ
      إلى لغة أخرى تُسمّى «اللغة الهدف». المصطلح شائع في الأدبيات اللسانية العربية الحديثة
      بصيغ متعدّدة، ويحتاج إلى تدقيق لاختيار الأنسب منها.
  blind_candidates:
    - lemma: "لُغَةُ الأَصْلِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي يُشير إلى اللغة التي يعود إليها النصّ الأصلي قبل ترجمته،
        على وزن «بلد الأصل» و«نسخة الأصل». الأصل يدلّ على ما يُبنى عليه غيره.
    - lemma: "اللُّغَةُ الأَصْلِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «لغة» و«أصلية»، يدلّ على اللغة التي كُتب بها النصّ أصلاً
        قبل نقله. شائع في الاستعمال الإعلامي والأكاديمي.
    - lemma: "اللُّغَةُ المَنْقُولُ مِنْهَا"
      generation_method: tarkib
      justification: >
        تعبير وصفي يستخدم اسم المفعول «المنقول» من جذر «نقل» الذي يدلّ على التحويل
        والترجمة في التراث العربي. غير أنّه أقرب إلى العبارة الوصفية منه إلى المصطلح المسكوك.
    - lemma: "لُغَةُ المَصْدَرِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «لغة» و«المصدر» بمعنى المنبع الذي يُؤخذ منه النصّ.
        يوازي المصطلح الإنجليزي «source language» بنيوياً.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "لُغَةُ المَصْدَرِ"
      confirm:
        - text: "«هي اللغة التي تؤخذ منها النصوص الأصلية قبل نقلها إلى لغة أخرى تسمى اللغة الهدف.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«في الترجمة، هي اللغة التي تؤخذ منها النصوص الأصلية قبل نقلها إلى لغة أخرى تسمى اللغة الهدف.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«لغة المصدر — source language»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«نقل نص مكتوب من لغة مصدر إلى لغة هدف، مع الحفاظ على التكافؤ الدلالي والأسلوبي.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يؤكّد أنّ المصطلح مستقرّ في حقل اللسانيات العربية الحديثة بصيغة «لغة مصدر» بالإضافة"

    - lemma: "لُغَةُ الأَصْلِ"
      evidence_status: "no_material_found"

    - lemma: "اللُّغَةُ الأَصْلِيَّة"
      confirm:
        - text: "«اللّغةُ الأصليّة: لغة النصّ المراد ترجمتُه.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«لغة أصلية: لغة تنحدر منها لغات أخرى. مثال: اللاتينية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "في المعجم الموحد للسانيات، «لغة أصلية» تعني اللغة الأمّ التي تنحدر منها لغات أخرى (ancestor language)، لا اللغة المُراد ترجمتها"

    - lemma: "اللُّغَةُ المَنْقُولُ مِنْهَا"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "لُغَةُ المَصْدَرِ"
      decision: confirmed
      decision_reason: >
        مصطلح مستقرّ ومعتمد في المعاجم الموحّدة (اللسانيات 2002، الإعلام والتواصل)
        بتعريف مطابق تماماً لدلالة المجموعة. ورد في ثلاثة معاجم مصطلحية على الأقل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُغَةُ المَصْدَرِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لُغَةُ الأَصْلِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تدعم هذا المركّب بوصفه مصطلحاً ثابتاً في حقل الترجمة.
        المصطلح المعتمد في المعاجم الموحّدة هو «لغة المصدر» لا «لغة الأصل».
      evidence_assessment:
        case: no_material

    - lemma: "اللُّغَةُ الأَصْلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وروده في المورد الحديث بدلالة «لغة النصّ المُراد ترجمته»، إلا أنّ المعجم الموحّد
        لمصطلحات اللسانيات يخصّص «لغة أصلية» لدلالة مختلفة تماماً (ancestor language =
        لغة تنحدر منها لغات أخرى كاللاتينية). هذا الاشتراك اللفظي يجعل المصطلح ملتبساً
        في السياق اللساني التخصّصي، فيُستبعد تجنّباً للّبس.
      evidence_assessment:
        case: mixed

    - lemma: "اللُّغَةُ المَنْقُولُ مِنْهَا"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ وليس مصطلحاً مسكوكاً. يمكن استبدال «المنقول» بـ«المترجَم»
        أو «المحوَّل» مع بقاء العبارة صالحة وصفياً، ما يُثبت أنّها ليست وحدة معجمية ثابتة
        (فشل اختبار السكّ).
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "لغة يراد ترجمتها إلى لغة أخرى"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه لكنّه مبنيّ للمجهول بصيغة ركيكة «يُراد ترجمتها».
        يُفضَّل صياغة أدقّ تُبيّن العلاقة مع «اللغة الهدف» كما في المعاجم الموحّدة.
    authored:
      - type: terminological
        text: "اللُّغَةُ الَّتِي يُؤخَذُ مِنْهَا النَّصُّ الأَصْلِيُّ لِنَقْلِهِ إِلَى لُغَةٍ أُخْرَى تُسَمَّى اللُّغَةَ الهَدَفَ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "اللُّغَةُ الَّتِي يُؤخَذُ مِنْهَا النَّصُّ الأَصْلِيُّ لِنَقْلِهِ إِلَى لُغَةٍ أُخْرَى تُسَمَّى اللُّغَةَ الهَدَفَ"

  examples:
    per_lemma:
      - lemma: "لُغَةُ المَصْدَرِ"
        examples:
          - text: "يَجِبُ أَنْ يُتْقِنَ المُتَرْجِمُ لُغَةَ المَصْدَرِ وَلُغَةَ الهَدَفِ إِتْقَاناً تَامّاً لِضَمَانِ دِقَّةِ النَّقْلِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يَجِبُ أَنْ يُتْقِنَ المُتَرْجِمُ لُغَةَ المَصْدَرِ وَلُغَةَ الهَدَفِ إِتْقَاناً تَامّاً لِضَمَانِ دِقَّةِ النَّقْلِ."

