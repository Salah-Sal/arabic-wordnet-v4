            new_lemma: "تَصْرِيح"

    - lemma: "قَوْل"
      decision: confirmed
      decision_reason: "لمّة فصيحة أصيلة بمعنى الكلام المنطوق. وإن كانت أعمّ دلالياً من statement، فإنها تُستعمل في سياقات كثيرة بمعنى القول المحدَّد أو التصريح (مثل: أقوال الشهود، قول فلان في المسألة). الإبقاء عليها مبرَّر لتغطية الطرف الأعم من المجموعة."
