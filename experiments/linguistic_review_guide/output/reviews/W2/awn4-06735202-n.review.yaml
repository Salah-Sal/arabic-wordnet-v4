# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06735202-n (statement)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (بيان، تصريح، قول) تفتقر إلى التشكيل الكامل"
      - "لمّة «قول» واسعة الدلالة جدّاً وقد لا تتطابق تطابقاً دقيقاً مع مفهوم statement بالمعنى المحدّد"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج إلى صياغة معجمية عربية أصيلة"
    observations: "المجموعة تدلّ على رسالة مُصرَّح بها أو مُعلَنة، أي تواصل شفهي أو كتابي يطرح تفاصيل أو حقائق. اللمّات الثلاث الموجودة تتفاوت في درجة العمومية: «قول» أعمّ من «بيان» و«تصريح»، و«تصريح» أخصّ بالسياق الرسمي. المفهوم أصيل في العربية وله مقابلات طبيعية متعدّدة."
  blind_candidates:
    - lemma: "بَيَان"
      generation_method: ishtiqaq
      justification: "من الجذر ب-ي-ن الدالّ على الإيضاح والكشف، على وزن فَعَال المصدري. البيان هو الكلام الذي يكشف عن حقيقة حال، وهو مطابق لمفهوم الرسالة المُصرَّح بها."
    - lemma: "تَصْرِيح"
      generation_method: ishtiqaq
      justification: "من الجذر ص-ر-ح الدالّ على الظهور والبروز والخلوص، على وزن تَفْعِيل. التصريح هو الإدلاء بالقول صراحةً وإظهار ما في النفس، ويُستعمل خاصّة في البيانات الرسمية."
    - lemma: "إِفَادَة"
      generation_method: ishtiqaq
      justification: "من الجذر ف-ي-د، على وزن إِفَالة (إفعالة). تدلّ على الإخبار والإبلاغ بالمعلومات، وتُستعمل في السياق القانوني والإداري بمعنى الشهادة أو الإدلاء بالمعلومات."
    - lemma: "بَلَاغ"
      generation_method: ishtiqaq
      justification: "من الجذر ب-ل-غ الدالّ على الوصول والإيصال، على وزن فَعَال. البلاغ في المعجم الوسيط: بيان يُذاع في رسالة ونحوها، وهو مطابق لمفهوم الرسالة المُعلَنة."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بَيَان"
      confirm:
        - text: "«الحجة المنطق الفصيح الكلام يكشف عن حقيقة حال, أو يحمل في طيَّاته بلاغاً علم يُعرف به إيراد المعنى الواحد بطرق مختلفة من تشبيه, ومجاز, وكناية»"
          source: "المعجم الوسيط"
        - text: "«البَيَان: عبارة عن إظهار المتكلم المراد للسامع»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الْبَيَان الْحجَّة والمنطق الفصيح وَالْكَلَام يكْشف عَن حَقِيقَة حَال أَو يحمل فِي طياته بلاغا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
        - text: "«البيان: المنطق الفصيح المعرب عما في الضمير»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«بيان = statement (EN) / énoncé (FR)»"
          source: "مسرد الفن والتسلية والرياضة (ARABTERM)"
          addition: "يؤكّد المكافئ الاصطلاحي الحديث"
        - text: "«بيان = declaration (EN) / déclaration (FR)»"
          source: "مسرد المناخ والبيئة (ARABTERM)"
          addition: "يُستعمل أيضاً بمعنى declaration في السياقات الرسمية"

    - lemma: "تَصْرِيح"
      confirm:
        - text: "«إدلاء حكومة أو رجل مسؤول ببيان عن أمر إدارى أو سياسى الإذن بعملٍ ممن يملك الإذن»"
          source: "المعجم الوسيط"
        - text: "«إدْلاءُ مَسْؤولٍ ببيانٍ عـنْ أمرٍ مُهمٍّ الإذْنُ بعملٍ مِمَّنْ يَمْلِكُ الإِذْنَ»"
          source: "المعجم الكبير"
        - text: "«تصريح = declaration; statement»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
      expands:
        - text: "«التصريح في اللغة: التبيين وانكشاف الأمر، واستعمل حديثاً بمعنى الإذن بعمل ممن يملك الإذن، وقد أوردته المعاجم الحديثة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "المعنى الاصطلاحي محدَث ومقبول عند المجامع"
        - text: "«التصريح: الإتيان بلفظ خالص للمعنى عار عن تعلقات غيره لا يحتمل المجاز ولا التأويل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "في البلاغة: التصريح مقابل الكناية، وهو معنى أقدم مختلف عن الاصطلاحي المعاصر"

    - lemma: "قَوْل"
      confirm:
        - text: "«القَوْل الْكَلَام والرأي والمعتقد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«القول: الكلام على الترتيب، وهو عند المحقق كل لفظ قال به اللسان، تامّاً كان أو ناقصاً»"
          source: "لسان العرب لابن منظور"
      contradicts:
        - text: "«القَوْلُ: الكَلامُ، أو كُلُّ لَفْظٍ مَذَلَ به اللِسانُ، تامّاً أو ناقِصاً»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "القول أعمّ من statement؛ فهو يشمل كلّ لفظ سواء أكان رسالة مكتملة أم لا، بينما statement رسالة مُعلَنة محدَّدة"

    - lemma: "إِفَادَة"
      confirm:
        - text: "«(3) رواية؛ إفادة (4) بيان؛ تصريح» [ترجمة statement]"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«إفادة = deposition»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "إفادة في المصطلحات القانونية تعني الشهادة أمام القضاء (deposition)، وهي أخصّ من المعنى العام لـ statement"
        - text: "«شهادة، إفادة» [ترجمة testimony]"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "ترتبط بالشهادة القضائية لا بالبيان العام"

    - lemma: "بَلَاغ"
      confirm:
        - text: "«التبليغ ما يُتوصَّل به إلى الغاية في هذا الأمر بلاغ: كفايةٌ بيانٌ يُذاع في رسالة ونحوها. (مج)»"
          source: "المعجم الوسيط"
        - text: "«الإبلاغ والتبليغ ما بلَغَك من خبرٍ ونحوه»"
          source: "المعجم الكبير"
        - text: "«بلاغ، تصريح = statement / communiqué; déclaration — إعلان رسمي مكتوب أو شفهي عن موقف معين من قضية محددة، أو إخبار بإجراءات جديدة»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
        - text: "«بلاغ، بيان = communiqué — تصريح رسمي صادر عن جهة مسؤولة يُنشر في الصحافة أو في وسائل الإعلام الأخرى»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
      expands:
        - text: "«(الْبَلَاغ) التَّبْلِيغ وَمِنْه {هَذَا بَلَاغ للنَّاس} وَمَا يتَوَصَّل بِهِ إِلَى الْغَايَة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
          addition: "البلاغ مؤصَّل قرآنياً بمعنى التبليغ والإيصال"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
