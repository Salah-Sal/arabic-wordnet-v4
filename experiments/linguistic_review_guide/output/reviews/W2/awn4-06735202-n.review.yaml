      mwe_check:
        is_mwe: false
      nuance_differentiation: "أخصّ من «بيان»؛ يرتبط بالسياق الرسمي والإداري والسياسي، ويفترض صدوره من جهة مسؤولة أو شخص ذي صفة. يحمل دلالة الصراحة والوضوح."
