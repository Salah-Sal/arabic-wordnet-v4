        entity_id: "{auto}"
        key: note
        value: '{"root":"صحح","maqayis":"«الصَّادُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى الْبَرَاءَةِ مِنَ الْمَرَضِ وَالْعَيْبِ، وَعَلَى الِاسْتِوَاءِ.»"}'
    - command: set_metadata
