    - lemma: "مُعَدِّل"
      entry_id: "{auto}"
      root: "عدل"
      maqayis_quote: "«الْعَيْنُ وَالدَّالُ وَاللَّامُ أَصْلَانِ صَحِيحَانِ... أَحَدُهُمَا يَدُلُّ عَلَى اسْتِوَاءٍ... يُقَالُ: عَدَلْتُهُ حَتَّى اعْتَدَلَ، أَيْ أَقَمْتُهُ حَتَّى اسْتَقَامَ وَاسْتَوَى.»"
  per_sense:
