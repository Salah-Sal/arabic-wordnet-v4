stage1_review:
  assessment:
    concerns:
      - "خلو المجموعة من لفظ 'أعضاء' وهو اللفظ الأدق والمباشر للتعبير عن الانتماء لمجموعة."
      - "لفظ 'دماء' استعمال مجازي يغلب عليه سياق التجديد (دماء جديدة)، ويحتاج لتوثيق الفرق بينه وبين الألفاظ الحقيقية."
    observations: "المجموعة تدور حول المكونات البشرية لأي تجمع أو هيئة. الألفاظ الموجودة (أفراد، دماء) تغطي الجانبين الحقيقي والمجازي، لكن ينقصها المصطلح المؤسسي الأكثر شيوعاً وهو 'أعضاء'."
  blind_candidates:
    - lemma: "أَفْرَاد"
      generation_method: ishtiqaq
      justification: "الجمع القياسي لـ'فرد'، ويستخدم للتعبير عن الوحدات البشرية المكونة لأي مجموعة."
    - lemma: "أَعْضَاء"
      generation_method: ishtiqaq
      justification: "المصطلح العربي الأصيل والمباشر للتعبير عن الانتماء لهيئة أو منظمة أو جماعة (من تعضية الشيء أي تقسيمه إلى أجزاء)."
    - lemma: "عَنَاصِر"
      generation_method: ishtiqaq
      justification: "يستخدم في السياقات الحديثة للتعبير عن الأفراد المنتمين لمجموعة وظيفية أو أمنية أو سياسية."
    - lemma: "دِمَاء"
      generation_method: majaz
      justification: "استعارة دلالية شائعة (خاصة في سياق التجديد) للتعبير عن أشخاص جدد ينضمون لمجموعة."

stage2_evidence:
  per_lemma:
    - lemma: "أَفْرَاد"
      confirm:
        - text: "أفراد: [في الإنكليزية] individuals."
          source: "المكنز الزراعي متعدد اللغات (ArabTerm)"
      expands:
        - text: "الأفراد: النجوم الدراري في آفاق السماء (من باب الانفراد والوحدة)."
          source: "مقاييس اللغة لابن فارس"
    - lemma: "أَعْضَاء"
      confirm:
        - text: "أعضاء: [في الإنكليزية] members."
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "ليسوا أعضاءً في المنظمة [فصيحة]."
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "الأعضاء: أجزاء متماسكة يتألف منها البدن."
          source: "معجم مقاليد العلوم للسيوطي"
    - lemma: "دِمَاء"
      confirm:
        - text: "new (or fresh) blood: دم جديد؛ عنصرٌ جديد."
          source: "المورد الحديث (منير البعلبكي)"
      expands:
        - text: "النفس: الدم، وهو صحيح، وذلك أنه إذا فقد الدم من بدن الإنسان فقد نفسه."
          source: "مقاييس اللغة لابن فارس"
    - lemma: "عَنَاصِر"
      confirm:
        - text: "العناصر: ... من حيث إنها ينحل إليه المركبات تسمى عناصر."
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "new (or fresh) blood: ... عنصرٌ جديد."
          source: "المورد الحديث (منير البعلبكي)"

stage3_analysis:
  per_lemma:
    - lemma: "أَفْرَاد"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع جداً للتعبير عن المكونات البشرية للمجموعات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَفْرَاد"
    - lemma: "دِمَاء"
      decision: confirmed
      decision_reason: "استخدام مجازي مقبول وفصيح للتعبير عن الأشخاص كمكونات حيوية للمجموعة، خاصة في سياق التجديد."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دِمَاء"
    - lemma: "أَعْضَاء"
      source: stage1
      decision: confirmed
      decision_reason: "هو المصطلح المعياري للتعبير عن 'عضوية' الأفراد في أي مجموعة أو هيئة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أَعْضَاء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "عَنَاصِر"
      source: stage1
      decision: confirmed
      decision_reason: "شائع الاستخدام في السياقات الحديثة والمؤسسية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عَنَاصِر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الناس باعتبارهم أعضاء في مجموعة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب ويميل للترجمة الحرفية. يفضل تعريف يبرز مفهوم المكونات البشرية للكيانات."
    authored:
      - type: terminological
        text: "مجموعة من الأشخاص يُنظر إليهم بوصفهم لبناتٍ مُكوّنة أو مُنتمية إلى هيئة أو جماعة أو كيان ما."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "أَفْرَاد"
        examples:
          - text: "يضم هذا القسم أفراداً من ذوي الخبرة العالية."
            type: usage
      - lemma: "أَعْضَاء"
        examples:
          - text: "اجتمع أعضاء الجمعية العمومية لانتخاب مجلس الإدارة."
            type: usage
      - lemma: "دِمَاء"
        examples:
          - text: "قرر النادي ضخ دماء جديدة في صفوف الفريق لتحسين النتائج."
            type: usage
      - lemma: "عَنَاصِر"
        examples:
          - text: "قامت عناصر القوات المسلحة بتأمين المنشآت الحيوية."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "مجموعة من الأشخاص يُنظر إليهم بوصفهم لبناتٍ مُكوّنة أو مُنتمية إلى هيئة أو جماعة أو كيان ما."}
    - command: add_synset_example
      params: {synset_id: "{synset_id}", text: "اجتمع أعضاء المنظمة لمناقشة السياسات الجديدة."}

stage5_enrichment:
  per_entry:
    - lemma: "أَفْرَاد"
      entry_id: "{auto}"
      root: "فرد"
      maqayis_quote: "«الفاء والراء والدال أصل صحيح يدل على وحدة. منه الفرد وهو الوتر... وأفراد النجوم: الدراري في آفاق السماء.»"
    - lemma: "أَعْضَاء"
      entry_id: "{auto}"
      root: "عضو"
      maqayis_quote: "«العين والضاد والحرف المعتل أصل واحد يدل على تجزئة الشيء. من ذلك العضو والعضو... وتعضية الشيء: تقسيمه أجزاء.»"
    - lemma: "دِمَاء"
      entry_id: "{auto}"
      root: "دمي"
      maqayis_quote: "«النون والفاء والسين أصل واحد يدل على خروج النسيم... والنفس: الدم، وهو صحيح، وذلك أنه إذا فقد الدم من بدن الإنسان فقد نفسه.» (ملاحظة: الربط بين الدم والنفس في المقاييس يبرر المجاز)."
    - lemma: "عَنَاصِر"
      entry_id: "{auto}"
      root: "عنصر"
      maqayis_quote: "«العنصر: الأصل والنسب... وكل شيء يرجع إليه تركيب الشيء فهو عنصره.» (من المعجم الوسيط لعدم توفر مادة 'عنصر' في ثلاثي المقاييس)."
  per_sense:
    - lemma: "أَفْرَاد"
      sense_id: "{auto}"
      nuance: "تركز على الاستقلال الذاتي لكل وحدة بشرية داخل المجموعة."
      mwe: false
    - lemma: "أَعْضَاء"
      sense_id: "{auto}"
      nuance: "تؤكد على الارتباط الوظيفي والمؤسسي بالهيئة أو الكيان."
      mwe: false
    - lemma: "دِمَاء"
      sense_id: "{auto}"
      nuance: "استعارة تستخدم غالباً في سياق الحيوية والنشاط والتجديد داخل المجموعة."
      mwe: false
    - lemma: "عَنَاصِر"
      sense_id: "{auto}"
      nuance: "تستخدم غالباً في السياقات الأمنية أو العسكرية أو التنظيمية الدقيقة."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فرد","maqayis":"«الفاء والراء والدال أصل صحيح يدل على وحدة...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عضو","maqayis":"«العين والضاد والحرف المعتل أصل واحد يدل على تجزئة الشيء...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تؤكد على الارتباط الوظيفي والمؤسسي بالهيئة أو الكيان.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
