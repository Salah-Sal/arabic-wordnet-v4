stage1_review:
  assessment:
    concerns:
      - "المصطلح الحالي 'زمن بيولوجي' يفتقر للتشكيل الكامل."
      - "الاعتماد الحصري على اللفظ المعرّب 'بيولوجي' يغفل البدائل العربية الأصيلة مثل 'حيوي'."
    observations: "المفهوم يشير إلى البعد الزمني للعمليات الفسيولوجية، وهو مصطلح علمي حديث يتطلب دقة في صياغة التعريف والتمييز بينه وبين 'الساعة البيولوجية' كآلية."
  blind_candidates:
    - lemma: "زَمَنٌ بِيُولُوجِيّ"
      generation_method: taarib
      justification: "ترجمة حرفية مباشرة للمصطلح الإنجليزي (Biological time) مع تعريب الصفة."
    - lemma: "زَمَنٌ حَيَوِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يستخدم اللفظ العربي الأصيل 'حيوي' بديلاً عن 'بيولوجي'."
    - lemma: "تَوْقِيتٌ بِيُولُوجِيّ"
      generation_method: tarkib
      justification: "استخدام 'توقيت' للدلالة على النظام المنظم للعمليات الحيوية."
    - lemma: "إِيقَاعٌ حَيَوِيّ"
      generation_method: majaz
      justification: "استعارة لفظ 'إيقاع' للدلالة على الصفة الدورية للزمن في الكائنات الحية."

stage2_evidence:
  per_lemma:
    - lemma: "زمن بيولوجي"
      confirm:
        - text: "«الزمن البيولوجي: نظام توقيت داخلي في الكائنات الحية ينظم تتابع العمليات الحيوية.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "الساعة البيولوجية"
      confirm:
        - text: "«السَّاعَةُ البَيولوجِيَّة (biological clock)»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "إيقاع حيوي"
      confirm:
        - text: "«إيقاع حيوي: تواتر منتظم للظواهر الحيوية في الكائن الحي.»"
          source: "المعجم الغني"
    - lemma: "زمن"
      confirm:
        - text: "«(زَمَنَ) الزَّاءُ وَالْمِيمُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى وَقْتٍ مِنَ الْوَقْتِ.»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "زمن بيولوجي"
      decision: confirmed
      decision_reason: "المصطلح العلمي الشائع والمعتمد في المعاجم العربية المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَمَنٌ بِيُولُوجِيّ"
    - lemma: "زَمَنٌ حَيَوِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "البديل العربي الأصيل للمصطلح المعرب، وهو مستخدم في الأدبيات العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "زَمَنٌ حَيَوِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "إِيقَاعٌ حَيَوِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق يصف الجانب الدوري (Rhythmic) للزمن البيولوجي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "إِيقَاعٌ حَيَوِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَوْقِيتٌ بِيُولُوجِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم للدلالة على عملية التوقيت والضبط الزمني للوظائف الحيوية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "تَوْقِيتٌ بِيُولُوجِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "وقت العمليات البيولوجية المختلفة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ولا يوضح طبيعة هذا الزمن كنظام توقيت داخلي."
    authored:
      - type: terminological
        text: "نظامُ توقيتٍ داخليّ في الكائنات الحيّة، يُقدّرُ به تتابعُ العملياتِ الفسيولوجيّةِ والسلوكيّةِ وفقَ دوراتٍ زمنيّةٍ منتظمةٍ لا تعتمدُ كليّاً على المؤثراتِ الخارجيّة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نظامُ توقيتٍ داخليّ في الكائنات الحيّة، ينظمُ تتابعَ العملياتِ الحيويةِ والفسيولوجيةِ والسلوكيةِ وفقَ دوراتٍ زمنيةٍ منتظمة."
  examples:
    per_lemma:
      - lemma: "زَمَنٌ بِيُولُوجِيّ"
        examples:
          - text: "يؤدي اضطرابُ الزمنِ البيولوجيِّ بسببِ السفرِ عبرَ المناطقِ الزمنيةِ إلى اضطرابِ النوم."
            type: usage
      - lemma: "إِيقَاعٌ حَيَوِيّ"
        examples:
          - text: "تخضعُ معظمُ الكائناتِ الحيّةِ لإيقاعٍ حيويٍّ يتوافقُ مع تعاقبِ الليلِ والنهار."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعدُّ فَهْمُ الزمنِ البيولوجيِّ أمراً أساسياً لدراسةِ فسيولوجيا الكائنِ الحي."}

