  per_entry:
    - lemma: "زَمَنٌ بِيُولُوجِيّ"
      entry_id: "{auto}"
      roots:
        - word: "زمن"
          root: "زمن"
          maqayis_quote: "«الزَّاءُ وَالْمِيمُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى وَقْتٍ مِنَ الْوَقْتِ. مِنْ ذَلِكَ الزَّمَانِ، وَهُوَ الْحِينُ.»"
    - lemma: "زَمَنٌ حَيَوِيّ"
      entry_id: "{auto}"
      roots:
