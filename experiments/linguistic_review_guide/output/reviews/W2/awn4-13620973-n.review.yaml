# مراجعة المجموعة الترادفية — awn4-13620973-n (magnetic flux)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي لمّة واحدة فقط (تدفق مغناطيسي)، بينما يوجد مرادف شائع هو «فيض مغناطيسي» المعتمد في الموسوعة الكهربائية الدولية"
      - "اللمّة الموجودة بدون تشكيل"
      - "التعريف العربي يصف المفهوم بأنه «مقياس» وهو تبسيط؛ التدفق المغناطيسي كمية فيزيائية وليس مقياساً بالمعنى الأداتي"
    observations: "المفهوم فيزيائي تقني بحت يتعلق بكمية خطوط المجال المغناطيسي العابرة لمساحة معينة. المصطلح العربي مستقر في الأدبيات العلمية بصيغتين: «تدفق مغناطيسي» (أليكسو) و«فيض مغناطيسي» (IEC). كلاهما تركيب وصفي شائع في الفيزياء والهندسة الكهربائية. الأب المباشر (تمغنط/مغنطة) يصف درجة المغنطة لا التدفق، فالعلاقة دلالية صحيحة لكنها غير مباشرة."
  blind_candidates:
    - lemma: "فَيْض مِغْنَاطِيسِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «فَيْض» (مصدر فاض: جريان الشيء بسهولة) و«مغناطيسي». لفظ «فَيْض» أصيل في العربية ويدل على الجريان والكثرة، وقد استُعمل في الاصطلاح الفيزيائي الحديث بمعنى flux"
    - lemma: "دَفْق مِغْنَاطِيسِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «دَفْق» (مصدر دفق: انصباب بشدة) و«مغناطيسي». الجذر د-ف-ق يدل على دفع الشيء قُدُماً وانصبابه، وهو أصل التسمية في «تدفق»"
    - lemma: "سُرْيَان مِغْنَاطِيسِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «سُرْيان» (مصدر سرى: جرى وسال) و«مغناطيسي». يصف جريان خطوط المجال عبر المساحة"
    - lemma: "مَسْرَى مِغْنَاطِيسِيّ"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن مَفْعَل من «سرى» بمعنى مكان/مقدار السريان، مع وصف «مغناطيسي». الوزن يناسب الكمية الفيزيائية"

stage2_evidence:
  per_lemma:
    - lemma: "تَدَفُّق مِغْنَاطِيسِيّ"
      confirm:
        - text: "«المُتغيّر الفيزيائي الذي يصف المجال المغناطيسي، حيث أنه يُمثّل 'التأثير المغناطيسي'، أي إجمالي عدد خطوط المجال المغناطيسي. ويُشار للتدّفق المغناطيسي بالرمز F، ووحدة قياسه هي Vs. ويتشابه الفيض المغناطيسي مع التيار الكهربائي في أن ناتج الجُهد المغناطيسي يسري عبر مُقاومة مغناطيسية.»"
          source: "مسرد الهندسة الكهربائية — أليكسو (ArabTerm)"
        - text: "«تدفق مغنطيسي — magnetic flux»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«تدفق مغنطيسي — magnetic flux»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1: طباعة - كهرباء (1996)"
      expands:
        - text: "«كمية مقدار سلمي أو متجهي تعبر خلال وحدة من الزمن مساحة معينة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "تعريف عام لـ«تدفق» كمصطلح فيزيائي يشمل أي كمية عابرة لمساحة"
        - text: "«(تدفق) المَاء وَنَحْوه مُطَاوع دفقه والأتن أسرعت وَفُلَان يتدفق فِي الْبَاطِل يُسَارع إِلَيْهِ»"
          source: "المعجم الوسيط"
          addition: "الأصل اللغوي: تدفّق مطاوع دفق، يدل على الانصباب والجريان"

    - lemma: "فَيْض مِغْنَاطِيسِيّ"
      confirm:
        - text: "«فيض مغناطيسي — magnetic flux»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«كثافة فيض مغناطيسي، حث مغناطيسي — magnetic flux density; magnetic induction»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«(فَيَضَ) الْفَاءُ وَالْيَاءُ وَالضَّادُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى جَرَيَانِ الشَّيْءِ بِسُهُولَةٍ، ثُمَّ يُقَاسُ عَلَيْهِ. مِنْ ذَلِكَ فَاضَ الْمَاءُ يَفِيضُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي: جريان الشيء بسهولة، وهو المعنى المحوري المنقول إلى الاصطلاح الفيزيائي"
        - text: "«فاضَ الماءُ والدَّمْعُ ونحوهما فَيْضاً وفُيُوضَةً وفُيُوضاً وفَيَضانا جَرَى وقيل تَدفَّقَ»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "يربط صراحة بين فاض وتدفّق، مما يؤكد ترادفهما اللغوي"

    - lemma: "دَفْق مِغْنَاطِيسِيّ"
      confirm:
        - text: "«الدَّفْق المغنطيسيّ — magnetic flux»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(دَفَقَ) الدَّالُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ قِيَاسُهُ، وَهُوَ دَفْعُ الشَّيْءِ قُدُمًا. مِنْ ذَلِكَ: دَفَقَ الْمَاءُ، وَهُوَ مَاءٌ دَافِقٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل: دفع الشيء قُدُماً وانصبابه"
        - text: "«الدَّفْقُ: إخراجُ السَّوائِل بِشِدَّة على دَفَعاتٍ»"
          source: "المعجم الكبير"
          addition: "دلالة الشدة والدفع تميز «الدَّفْق» عن «الفَيْض» الذي يدل على الجريان بسهولة"

    - lemma: "سُرْيَان مِغْنَاطِيسِيّ"
      evidence_status: "no_material_found"

    - lemma: "مَسْرَى مِغْنَاطِيسِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَدَفُّق مِغْنَاطِيسِيّ"
      decision: confirmed
      decision_reason: "مصطلح معتمد من أليكسو والمعاجم الموحدة (الفيزياء، الكهرباء، الطباعة). مسنود بتعريف تفصيلي في مسرد الهندسة الكهربائية. الجذر «دفق» عربي أصيل، والمصدر «تدفّق» على وزن تَفَعُّل مناسب دلالياً للكمية الفيزيائية المتعلقة بالجريان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح الأشيع في المعاجم الموحدة العربية (أليكسو)، يركز على الجانب الحركي (التدفق = الجريان المتتابع). يُستعمل في السياقات الأكاديمية والتعليمية العربية على نطاق واسع."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَدَفُّق مِغْنَاطِيسِيّ"

    - lemma: "فَيْض مِغْنَاطِيسِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد في موسوعة الكهرباء الدولية (IEC 60050) ومسرد الهندسة الكهربائية (أليكسو). لفظ «فَيْض» أقدم وأصيل في العربية بمعنى الجريان بسهولة (ابن فارس)، وقد ربط ابن سيده صراحة بين «فاض» و«تدفّق». المصطلح مستعمل في السياقات الهندسية المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُفضَّل في الأدبيات الهندسية الكهربائية ومعايير IEC. لفظ «فَيْض» أخصر وأقرب إلى المعنى الأصلي (جريان بسهولة بلا دلالة الشدة)، ويُستعمل كثيراً في التركيبات المشتقة (كثافة الفيض المغناطيسي)."
      actions:
        - command: create_entry
          params:
            lemma: "فَيْض مِغْنَاطِيسِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "دَفْق مِغْنَاطِيسِيّ"
      source: stage1
      decision: removed
      decision_reason: "ورد في المورد الحديث فقط (مصدر واحد)، ولم يُعتمد في المعاجم الموحدة لأليكسو ولا في IEC. لفظ «دَفْق» يحمل دلالة الشدة والعنف (إخراج السوائل بشدة — المعجم الكبير)، وهي غير ملائمة للمفهوم الفيزيائي. كفاية المجموعة بمصطلحين معتمدين (تدفق + فيض)."
      evidence_assessment:
        case: mixed

    - lemma: "سُرْيَان مِغْنَاطِيسِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعمال هذا التركيب في الأدبيات الفيزيائية أو الهندسية. «سُرْيان» يُستعمل في سياقات مختلفة (سريان التيار الكهربائي) ولا يُستعمل مع المجال المغناطيسي."
      evidence_assessment:
        case: no_material

    - lemma: "مَسْرَى مِغْنَاطِيسِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي. «مَسْرَى» على وزن مَفْعَل يدل على المكان أو الزمان لا على الكمية، فلا يناسب المفهوم الفيزيائي المطلوب."
      evidence_assessment:
        case: no_material

