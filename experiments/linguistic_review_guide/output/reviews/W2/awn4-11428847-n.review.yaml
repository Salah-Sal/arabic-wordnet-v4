    - lemma: "اِرْتِفَاعٌ كَرَامَاتِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "يفشل اختبار السكّ: يمكن إبدال ارتفاع بـ صعود أو تعالٍ أو تحليق ويبقى الوصف صحيحاً نحوياً ودلالياً، مما يُثبت أنه عبارة وصفية حرة لا مصطلح مسكوك. المركب بكامله غير مُعجمي. إضافةً إلى ذلك، الصفة كراماتي تُضيِّق الدلالة للسياق الإسلامي فحسب في حين المفهوم أوسع (يشمل باراسيكولوجيا وتقاليد دينية متعددة)."
