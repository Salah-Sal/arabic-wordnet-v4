      decision: confirmed
      decision_reason: "الجذر حلق في أصله الثالث (مقاييس اللغة) يدل صراحةً على العلو والارتفاع (حالق = مكان مشرف؛ حلَّق = صار في حالق). وحلَّق يُستعمل للطيور الصاعدة عالياً في الهواء وهو أنسب الألفاظ العربية لمفهوم الارتفاع الخارق. الشواهد الشعرية الكلاسيكية تؤكد استعماله للارتفاع في الهواء. اللمّة تحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تحليق يُركِّز على فعل الصعود والطيران الحر في الفضاء بدلالة حركة الطيور الصاعدة إلى العلو، مع إيحاء بالتحرر من قيد الأرض. يختلف عن صُعُود الذي يضمر الوصول إلى غاية محددة، وعن عُرُوج الخاص بالتجربة الدينية الإسلامية، وعن تَحَوُّم الذي يعني الدوران في منطقة لا الارتفاع. إسناده للبشر في سياق خارق للطبيعة يُفيد المعنى المقصود بقرينة السياق."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْلِيقٌ"

    - lemma: "طفو"
      decision: removed
      decision_reason: "جميع المصادر المعجمية من مقاييس اللغة إلى المعجم الوسيط والمعجم الكبير تُثبِّت معنى طفا/طفو على الطفو على سطح الماء (علا فوق الماء ولم يرسب). والاستخدام المجازي الوحيد الموثَّق (طفا الثور فوق الرملة) هو حركة أفقية على الأرض لا تعلُّق في الهواء. المصطلحات الفنية الحديثة تستخدمه لعمليات الفصل المائية (flotation). استخدامه للدلالة على التحليق الخارق في الهواء سيولد إبهاماً دلالياً."
