# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة طفو تدل بالأساس على الطفو على سطح الماء (علا فوق الماء ولم يرسب)، لا على الارتفاع والتعلق في الهواء، مما يُشكّل تنافراً دلالياً مع المفهوم المقصود"
      - "كلتا اللمّتين (تحليق، طفو) خاليتان من التشكيل الكامل في السجل"
      - "اللمّتان لا تحملان بذاتيهما دلالة الخروج عن الطبيعة، وهو المكوّن الجوهري في تعريف المجموعة"
      - "لا يوجد في المعجمية العربية الكلاسيكية مصطلح مُسكَّك خاص بالتحليق الخارق للطبيعة، مما يُشير إلى فجوة معجمية"
      - "التعريف الحالي ترجمة شبه حرفية للنص الإنجليزي، يمكن تحسين صياغته بأسلوب المعجم العربي"
    observations: "المجموعة تُعبِّر عن ظاهرة باراسيكولوجية هي ارتفاع الأجساد في الهواء بقوة تبدو خارقة، وللمفهوم جذور ثقافية في التراث الصوفي الإسلامي (كرامات الأولياء) وفي الموروث المسيحي (قديسون كيوسف الكوبرتيني). تحليق من جذر حلق (أصل ثالث: العلو) هو أنسب اللمّتين لمعنى الارتفاع في الهواء. أما طفو فمجاله المعجمي محصور في الطفو على الماء وإن احتمل بعض التوسع. التعريف الحالي مقبول مع إمكانية تحسين صياغته."
  blind_candidates:
    - lemma: "تَحَوُّمٌ"
      generation_method: ishtiqaq
      justification: "من جذر ح-و-م؛ مصدر تحوَّمَ. مقاييس اللغة: حام الطائر حول الشيء يحوم. التحوّم يُعبِّر عن الدوران والتعلق في منطقة من الهواء دون مغادرتها، وقد يصف حالة التعليق الثابتة في الهواء التي تُميّز التحليق الخارق عن الطيران الطبيعي المتنقل."
    - lemma: "اِرْتِفَاعٌ كَرَامَاتِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي: ارتفاع (الفعل المادي للصعود) + كَرامَاتِيّ (نسبة إلى الكرامة التي هي المعجزة الصادرة عن الأولياء في الاصطلاح الصوفي). يربط الظاهرة بأنسب إطار ثقافي عربي إسلامي ويُضفي الطابع الخارق صراحةً على الفعل المادي."
    - lemma: "خِفَّةٌ جَوِّيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي: الخِفَّة (ضد الثقل، القوة الدافعة للأعلى عند القدماء) + الجوية (نسبة للجو/الهواء). يستحضر المفهوم الفلسفي القديم للخفة كقوة تُحرِّك الجسم صعوداً، ويُقيِّده بمجال الهواء تمييزاً عن الخفة المجازية."
    - lemma: "لِيفِيتَيشَن"
      generation_method: taarib
      justification: "تعريب للمصطلح الإنجليزي/الفرنسي levitation المشتق من اللاتينية levitas (خفة). يقبل لام التعريف والنسبة والجمع. يُستخدم في أدبيات الباراسيكولوجيا العربية الحديثة. ملاذ أخير بعد استنفاد البدائل العربية."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# استعلامات مُنفَّذة: ٤ استعلامات
#   ١. مطابقة دقيقة دفعية: تحليق، طفو، تحوم، خفة، ارتفاع، رفع
#   ٢. جسر إنجليزي: levitation, levitate, floating, hover
#   ٣. بحث بكلمات مفتاحية: ارتفاع خارق طيران رفع تحلق يحوم
#   ٤. مقاييس اللغة: جذور حلق، حوم، رفع، طفو
stage2_evidence:
  per_lemma:

    - lemma: "تحليق"
      confirm:
        - text: "«الحاءُ واللامُ والقافُ أصولٌ ثلاثة... والثالثُ يدلُّ على العلوِّ. حالقٌ: مكانٌ مُشرِف. يُقال حلَّقَ إذا صار في حالق»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«إذا ما غزا بالجيش حلَّقَ فوقَه عصائبُ طيرٍ تهتدي بعصائب» (شاهد النابغة الذبياني)"
          source: "مقاييس اللغة لابن فارس (شاهد شعري)"
      contradicts:
        - text: "«قطع الأنسجة الخارجية في شكل حلقة حول محيط الساق»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "المعجم يُسجِّل تحليق بمعنى التحليق النباتي (الإزالة الحلقية للقشرة من حول ساق الشجرة)، وهو معنى مختلف تماماً ينتمي للجذر حلق-الحلقة لا حلق-العلو، مما يُنبِّه إلى احتمال الاشتراك اللفظي"

    - lemma: "طفو"
      confirm:
        - text: "«طَفَوَ: الطاءُ والفاءُ والحرفُ المعتلُّ أصلٌ صحيح، وهو يدلُّ على الشيءِ الخفيفِ يعلو الشيءَ. من ذلك قولهم: طفا الشيءُ فوق الماءِ يطفو طفواً وطفوًّا، إذا علاه ولم يَرسُب»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«طفا الشيءُ فوق الماء - طَفْواً وطُفُوًّا: علا ولم يَرسُب. الثور الوحشي: علا الأكم. الفرس: شمخ برأسه»"
          source: "المعجم الوسيط"
          conflict: "الشواهد الكلاسيكية تحصر معنى طفا في الارتفاع على سطح الماء أو الأرض، لا في التعلق في الهواء؛ والمجموعة تُعنى بالارتفاع في الهواء وليس بالطفو على الماء"
        - text: "«السمكُ الطافي: وهو الذي يموت في الماء فيعلوَ فوقه»"
          source: "المغرب في ترتيب المعرب للمطرزي"
          conflict: "الاستخدام الاصطلاحي الأشهر (السمك الطافي = الميت الطافي على الماء) يُرسِّخ ارتباط طفو بالماء لا بالهواء"
        - text: "«طفو: طريقة فيزيائية من طُرق معالجة المياه، تهدف إلى التخلّص من جسيمات القاذورات عبر إلصاق فقاعات الهواء بها» [translation_en: flotation]"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "المعجم الحديث يُسجِّل طفو بمعنى flotation (عملية صناعية مائية) لا بمعنى aerial levitation"
      expands:
        - text: "«طفا الثورُ الوحشيُّ إذا علا الأكَمةَ»"
          source: "المعجم الوسيط (نقلاً عن الاستخدام الكلاسيكي)"
          addition: "يمتد الاستخدام خارج الماء (الثور يعلو التلة) مما يُشير إلى إمكانية تعميم المعنى نحو أي ارتفاع خفيف؛ لكنه يظل في مجال الحركة على الأرض لا التعلق في الهواء"

    - lemma: "تَحَوُّمٌ"
      confirm:
        - text: "«الحاءُ والواوُ والميمُ كلمةٌ واحدةٌ تقرُب من الذي قبلها، وهو الدورُ بالشيء. يقال: حامَ الطائرُ حولَ الشيءِ يَحوم. والحَوْمَة: مُعظَم القتال، لأنهم يُطيف بعضهم ببعض»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«(1) يرفرف (2) «أ» يحوم [حول مكان]» — ترجمة hover"
          source: "المورد الحديث (2008)"
          conflict: "حوم يعني الدوران في منطقة ما والبقاء قريباً منها كالجوّال حول الفريسة، لا الارتفاع العمودي وبقاء الجسم معلقاً في الهواء دون حركة دائرية؛ هذا يُبعِده عن مفهوم التحليق الخارق"

    - lemma: "اِرْتِفَاعٌ كَرَامَاتِيٌّ"
      confirm:
        - text: "«اِرْتِفاع: يظل جسمٌ عالق (سابح) في الهواء بشكل حر. يتم ذلك عن طريق استخدام قوة مؤثرة، معادلة في القيمة المطلقة ومضادة في الاتجاه لقوة الوزن، تحافظ على وضع الجسم في الفضاء، مع عدم وجود اتصال مباشر مع الأرض» [translation_en: levitation]"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — أدلة على مكوّن ارتفاع منفرداً لا على المركب كاملاً"

    - lemma: "خِفَّةٌ جَوِّيَّةٌ"
      expands:
        - text: "«الخِفَّة: قوةٌ طبيعيةٌ يتحركُ بها الجسمُ عن الوسطِ بالطبع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُشير إلى المفهوم الفلسفي للخفة كقوة دافعة للأعلى، مما يُقرِّب المصطلح من معنى الارتفاع الخارق؛ لكن المركب خِفَّة جَوِّيَّة ذاته غير مُسجَّل"
        - text: "«الخِفَّة: هي ضدُّ الثِّقلِ وهما من الكيفيات الملموسة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "الخفة كيفية فيزيائية مقابل الثقل؛ في الفلسفة الأرسطية هي السبب في ارتفاع الأجسام الهوائية طبعاً"

    - lemma: "لِيفِيتَيشَن"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

