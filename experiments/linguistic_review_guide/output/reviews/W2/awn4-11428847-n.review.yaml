    - lemma: "تَحَوُّمٌ"
      source: stage1
      decision: removed
      decision_reason: "مقاييس اللغة يُحدد حوم بـ«الدور بالشيء» لا الارتفاع عنه. التحوّم يصف دوران الطير حول مكان ما والبقاء قريباً منه، لا الارتفاع العمودي وبقاء الجسم معلقاً في الهواء. المورد الحديث يُترجم hover بـ«يحوم [حول مكان]» مما يُثبت دلالة الدوران لا الارتفاع. لا يُعبِّر عن الجوهر المقصود للمجموعة."
