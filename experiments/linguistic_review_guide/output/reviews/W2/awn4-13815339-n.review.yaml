    - query_id: 6
      purpose: "مقاييس اللغة للجذور ربط، سلس، تبع، لحق، وصل"
      entry_ids_maqayis: ["ربط", "سلس", "تبع", "لحق", "وصل"]

  per_lemma:

    - lemma: "تَرَابُط"
      contradicts:
        - text: "«(في علم الفلسفة): قيام علاقة بين مدرَكين لاقترانهما في الذهن بسبب ما»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            المعنى المسجَّل هو الترابط التداعوي في علم النفس والفلسفة (mental association)،
            وهو يصف العلاقة بين مدركَيْن لاقترانهما في الذهن، لا فعلَ ربط متتالية من الرموز.
        - text: "«فى عِلْم الفلسفة: قِيامُ عَلاقَةٍ بين مُدْرَكَيْنِ لاقْتِرانِهما فى الذِّهْنِ بِسَبَبِ ما»"
          source: "المعجم الكبير (OCR)"
          conflict: "توافق المعجم الوسيط في تخصيص الدلالة بالترابط الفلسفي الذهني دون معنى التسلسل الرابط"
      expands:
        - text: "«تتابع مجموعات ترتبط، بعضها ببعض، كتلاحق ظروف وأحداث قصصية، حسب قواعد انسجامية تتوخى في خطواتها بلوغ صورة كاملة، قد تكون عاطفية أو أخلاقية في مقاطع وأحاديث وموضوعات دون توقف»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM 2002)، translation_en: linking"
          addition: >
            في علم اللسانيات تتسع دلالة ترابط لتشمل التتابع المترابط للوحدات اللغوية؛
            وهذا أقرب من المعنى الفلسفي لكنه يظل يصف الخاصية لا فعل الإلحاق.

    - lemma: "تَسَلْسُل"
      confirm:
        - text: "«التسلسل: ترتيب أمور غير متناهية»"
          source: "التوقيف على مهمات التعاريف للمناوي (Hawramani)"
      contradicts:
        - text: >
            «التّسلسل:[في الانكليزية] Chronological order، succession، chain ... وعند المحدّثين
            عبارة عن توارد رجال إسناد الحديث واحداً فواحداً على حالة وصفة واحدة عند رواية ذلك
            الحديث ... وعند الحكماء عبارة عن ترتّب أمور غير متناهية مجتمعة في الوجود والترتيب»
          source: "كشّاف اصطلاحات الفنون (Hawramani)"
          conflict: >
            المعنى المصطلحي الراسخ لتسلسل في التراث العربي هو إما تواتر رجال الإسناد
            (مصطلح حديثي)، أو الترتّب اللانهائي (مصطلح فلسفي)، وكلاهما يختلف
            جوهرياً عن مفهوم 'الإلحاق المتتابع لمتتالية من الرموز'.
        - text: "«تتابع تطوريّ متواصل من نوع سلفيّ عبر كل الأنواع الوسطية حتى الأنواع النسيلة المولدة منها»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (ARABTERM 2009)، translation_en: lineage"
          conflict: "في علم الوراثة تسلسل = lineage (السلالة)، بعيد كل البعد عن concatenation"

    - lemma: "سَلْسَلَة"
      confirm:
        - text: "«دمج أو جمع بتات أو محارف لتكوين سلسلة واحدة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (ARABTERM 2011)، translation_en: concatenation"
        - text: "«يعني رمز السلسلة (+) في قاعدة إعادة الكتابة أن العناصر المكونة هي متسلسلة ومرتبطة ببعضها تبعاً لنظام تحدده الصياغة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM 2002)، translation_en: Concatenative series"

    - lemma: "تَتَابُع"
      expands:
        - text: "«تتابع، تعاقب»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (ARABTERM 2000)، translation_en: sequence"
          addition: "يُستخدم مقابلاً لـ sequence/succession لا لـ concatenation"
        - text: "«خطوات معينة لا بد من إنجاز إحداها قبل الانتقال إلى الخطوة التالية وهكذا»"
          source: "مسرد مصطلحات الحاسوب (ARABTERM)"
          addition: "يصف فكرة التتابع وليس فعل الربط/الإلحاق"

    - lemma: "رَبْطٌ تَعَاقُبِيّ"
      expands:
        - text: "«وصل تعاقبي» — translation_en: concatenation"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1 (ARABTERM 1996)، entry_id: 506317"
          addition: >
            ARABTERM يستخدم 'وصل تعاقبي' (وليس 'ربط تعاقبي') ترجمةً لـ concatenation في
            مجال الطباعة والكهرباء؛ مما يؤكد قابلية أسلوب المركب الوصفي ويشير إلى
            'وصل تعاقبي' بوصفه البديل الأمثن للمركب.

    - lemma: "تَلاحُق"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تَرَابُط"
      decision: removed
      decision_reason: >
        عِلَّتان مزدوجتان تستوجبان الحذف:
        (١) التعارض الهيكلي: تَرَابُط تظهر في لمّات المجموعة الأمّ المباشرة
        (awn4-13813601-n) بالتزامن مع وجودها في هذه المجموعة الابنة، وهو تعارض بنيوي
        يُخلّ بعلاقة التضمّن الدلالي.
        (٢) عدم الملاءمة الدلالية: المعنى المعجمي الراسخ لـ'ترابط' في المصادر الموثوقة هو
        'الترابط التداعوي الذهني' (mental association) في الفلسفة وعلم النفس،
        وهو مفهوم مختلف جوهرياً عن 'الإلحاق المتتابع' (concatenation). المعنى اللساني
        الموسَّع (linking) أقرب، لكنه عام وغير مخصَّص لهذا الفهوم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَسَلْسُل"
      decision: confirmed
      decision_reason: >
        يصف تَسَلْسُل في استعماله الحديث الشائع التتابع المتسلسل للعناصر، وعلى الرغم
        من تخصّصه الكلاسيكي بالمعنى الفلسفي والحديثي، فإنه باتت له دلالة عامة معاصرة
        تُلائم مفهوم 'التسلسل الرابط'. تشير بعض المعاجم إلى الانجليزية: succession, chain.
        يُقبل بوصفه اللمّة الأصلية ذات الجذور التراثية الراسخة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز جانب التتابع والترتيب المنطقي/الزمني للعناصر المتسلسلة؛ أنسب
        لسياقات الأحداث والأفكار والمراحل المتعاقبة.
      actions: []

    - lemma: "سَلْسَلَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        أقوى الأدلة الموثَّقة: معجم تقانة المعلومات (ARABTERM 2011) يُقابلها صراحةً بـ
        concatenation ويُعرّفها بـ'دمج أو جمع بتات أو محارف لتكوين سلسلة واحدة'، وهو
        تطابق دلالي تام مع تعريف المجموعة. هي مصدر الفعل الرباعي 'سَلْسَلَ' على وزن
        فَعْلَلَة مما يُعبّر عن الحدث بذاته. تجتاز اختبار السكّ: مصطلح مُثبَّت لا
        عبارة وصفية حرة. تمتاز عن سِلْسِلَة (الاسم المحسوس) بكونها مصدراً يدلّ على
        الفعل والعملية لا على الأداة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز جانب الإلحاق والدمج المادي لعناصر متمايزة في وحدة واحدة؛ أخصّ استخداماً
        في السياق الحاسوبي والتقني، ويحمل معنى العملية التحويلية (ضمّ المتفرقات).
      actions:
        - command: create_entry
          params:
            lemma: "سَلْسَلَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَتَابُع"
      source: stage1
      decision: removed
      decision_reason: >
        تَتَابُع يعني 'التوالي والتعاقب' (sequence/succession)، وهو يصف الخاصية الزمنية
        لتوالي العناصر لا فعلَ ربطها وإلحاقها بعضها ببعض. الفارق دقيق لكن حاسم:
        concatenation ليست مجرد توالٍ بل ربط فاعل. يفتقر المصطلح إلى مكوّن 'الربط'.
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَبْطٌ تَعَاقُبِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ المعجمي: يمكن إبدال 'ربط' بـ'وصل' أو 'إلحاق' ويظل التعبير
        صالحاً كوصف (وصل تعاقبي هو الأكثر شيوعاً عند ARABTERM)، مما يدلّ على أنه
        عبارة وصفية لا مصطلح مسكوك. كذلك هو مركب وصفي (wasfi) ينافسه وصل تعاقبي
        الأكثر توثيقاً في ARABTERM ولا ترجيح هنا لأحدهما دون سند صريح باعتماده.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "تَلاحُق"
      source: stage1
      decision: removed
      decision_reason: >
        تَلاحُق يعني 'اللحاق المتتالي' (consecutive following/pursuit)، ويصف الحالة
        الديناميكية للتعاقب لا فعل الضمّ والإلحاق. لا أدلة معجمية تربطه بمفهوم
        concatenation. يُستعمل غالباً مع الأحداث المتسارعة لا مع ربط الرموز.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "ربط سلسلة متتالية من الرموز أو الأحداث أو الأفكار معاً"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية بأسلوب غير معجمي: 'ربط ... معاً' لا
        يُميّز جنساً قريباً واضحاً، وإضافة 'معاً' في نهاية الجملة ركيكة. يفتقر إلى
        الجنس القريب والفصل النوعي على أسلوب المعجم الوسيط. كذلك الفعل 'ربط' يُطابق
        مصدر اللمّة المرفوضة (تَرَابُط) مما يُضعف ارتباطه باللمّات المعتمدة.
    authored:
      - type: terminological
        text: "إلحاقُ عناصر متتالية — كرموز أو أحداث أو أفكار — بعضها ببعض تشكيلاً لسلسلة متواصلة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          عملية ضمّ متتالية من العناصر المنفصلة — كالمحارف أو الكلمات أو الأحداث أو
          الأفكار — بعضها في أثر بعض لتكوين وحدة تسلسلية مترابطة؛ وتُستعمل في
          الحوسبة للدلالة على إلحاق سلسلتين نصيتين أو أكثر بعضها ببعض.
    actions:
      - command: update_definition
        params:
