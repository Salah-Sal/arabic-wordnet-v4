# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13815339-n  |  ILI: i109390  |  POS: n
# Lemmas: تَرَابُط، تَسَلْسُل  |  EN: concatenation
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "تَرَابُط تظهر في كلٍّ من هذه المجموعة ومن الأب المباشر (awn4-13813601-n) في آنٍ واحد، مما يُشكّل تعارضاً هيكلياً صريحاً في بنية الشبكة الدلالية"
      - "المعنى المعجمي الأصيل لـ'تَرَابُط' في المعاجم الحديثة (الوسيط والكبير) هو 'قيام علاقة بين مدرَكَيْن لاقترانهما في الذهن' أي الترابط التداعوي الفلسفي، لا التسلسل الرابط لمتتالية من الرموز"
      - "تَسَلْسُل في المصادر الكلاسيكية يعني الترتيب اللانهائي (الفلسفة) أو تواتر رجال الإسناد (الحديث)، وهو بعيد عن معنى 'الإلحاق المتتابع' المقصود هنا"
      - "التعريف الحالي هو ترجمة حرفية من الإنجليزية وليس بأسلوب المعجم العربي"
    observations: >
      المجموعة تُعبّر عن مفهوم 'التسلسل الرابط' (Concatenation)، وهو ضمّ متتالية من العناصر
      المتمايزة — رموزاً أو أحداثاً أو أفكاراً — بعضها إلى بعض لتشكيل سلسلة متواصلة. هذا
      المفهوم راسخ في التراث العربي (سلسلة الإسناد، تسلسل الأحداث)، غير أن اللمّتين الحاليتين
      تحملان حمولات دلالية متخصصة تتعارض مع هذا المفهوم. يحتاج المجمع إلى لمّة أدق تعكس
      جانب الإلحاق والدمج المتتابع بوضوح. الجذر (سلس/سلسل) هو الأنسب لاشتقاق المصطلح.
  blind_candidates:
    - lemma: "سَلْسَلَة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من 'السَّلْسَلَة' (الشيء المسلسَل كالحديد) إلى 'فعل السلسلة'،
        أي الإلحاق المتتابع لعناصر متمايزة. مصدر الفعل الرباعي 'سَلْسَلَ' على وزن
        فَعْلَلَة، يُعبّر عن الحدث بذاته (التعمّل في التسلسل) ويُميَّز عن الاسم
        'سِلْسِلَة'. يُحيي استعمالاً تراثياً وظيفياً مباشراً.
    - lemma: "تَتَابُع"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر (تبع) على وزن تَفَاعُل، يُعبّر عن التلاحق والتوالي المتبادل.
        يُلائم جانب 'المتتالية المتعاقبة' في التعريف، ويُستعمل في معاجم حديثة
        للدلالة على الاستمرار المنظّم.
    - lemma: "رَبْطٌ تَعَاقُبِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من 'ربط' (المصدر المباشر من التعريف) + 'تعاقبي' (نسبة إلى التعاقب).
        يُعبّر صراحةً عن المفهومَيْن معاً: فعل الربط وصفة التعاقب. مطابق لأسلوب
        مصطلحات الحاسوب والاتصالات.
    - lemma: "تَلاحُق"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر (لحق) على وزن تَفَاعُل، يُعبّر عن التلاحق المتتالي حيث يلحق
        كلٌّ من العناصر بما قبله. يُلائم فكرة الرموز والأحداث المتلاحقة المرتبطة.


