          text: >
            عملية ضمّ متتالية من العناصر المنفصلة — كالمحارف أو الكلمات أو الأحداث أو
            الأفكار — بعضها في أثر بعض لتكوين وحدة تسلسلية مترابطة؛ وتُستعمل في
            الحوسبة للدلالة على إلحاق سلسلتين نصيتين أو أكثر بعضها ببعض.

  examples:
