stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمة واحدة فقط على الرغم من غنى المصطلح بالمرادفات في العربية."
    observations: "المفهوم الأساسي هو العلاقة التعاونية (partnership)، وهو مفهوم مركزي في الاجتماع والاقتصاد والسياسة."
  blind_candidates:
    - lemma: "شَرَاكَة"
      generation_method: ishtiqaq
      justification: "المصدر الأكثر شيوعاً للتعبير عن علاقة الشرك بين طرفين."
    - lemma: "تَشَارُكِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي يعبر عن المفهوم كنمط أو نظام تعاوني."
    - lemma: "عَلَاقَة تَعَاوُنِيَّة"
      generation_method: tarkib
      justification: "تعبير وصفي مباشر لمفهوم الشراكة كما ورد في التعريف."
    - lemma: "تَحَالُف"
      generation_method: ishtiqaq
      justification: "يستخدم غالباً للتعبير عن الشراكة بين المجموعات أو الدول لتحقيق هدف محدد."

stage2_evidence:
  per_lemma:
    - lemma: "شَرَاكَة"
      confirm:
        - text: "«الشَّرَاكة: مصدر للفعل 'شرِك' بعد تحويله إلى وزن 'فعُل' اعتمادًا على إجازة مجمع اللغة المصري...»"
          source: "معجم الصواب اللغوي"
        - text: "«شراكة: partnership»"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية"
    - lemma: "شِرْكَة"
      confirm:
        - text: "«الشِّرْكة: عقدٌ بين اثنينِ أو أكثرَ للقيام بعمل مشتركٍ.»"
          source: "المعجم الوسيط"
        - text: "«عقد الشركة: deed of partnership»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
    - lemma: "تَحَالُف"
      confirm:
        - text: "«تَحالَفَ القومُ: تعاهَدُوا وتقاسَمُوا على النُّصْرَةِ»"
          source: "المعجم الكبير"
        - text: "«شراكة دولية لتغير المناخ: تحالف عالمي يتكون من شركات ومجموعات تجارية...»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
    - lemma: "مُشَارَكَة"
      confirm:
        - text: "«مُشَارَكَةُ: partnership»"
          source: "المعجم الطبي الموحد"
        - text: "«تكون المشاركة حقيقية وفعالة عندما يكون لأعضاء المجموعة فرصة وافية ومتساوية...»"
          source: "مسرد المناخ والبيئة (ArabTerm)"

stage3_analysis:
  per_lemma:
    - lemma: "شَرَاكَة"
      decision: confirmed
      decision_reason: "اللمة موجودة وصحيحة لغوياً وشائعة الاستعمال في السياقات الحديثة للتعبير عن مفهوم الشراكة كعلاقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَرَاكَة"
    - lemma: "شِرْكَة"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الأصيل والفصيح في المعاجم العربية القديمة للتعبير عن عقد الشراكة والتعاون."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "شِرْكَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَحَالُف"
      source: stage1
      decision: confirmed
      decision_reason: "يغطي الجانب المتعلق بالشراكة بين المجموعات أو الهيئات (groups) الوارد في التعريف، خاصة في السياقات الاستراتيجية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَحَالُف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُشَارَكَة"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم في السياقات التنموية والتقنية للتعبير عن الشراكة القائمة على المساهمة الفعلية والمسؤولية المشتركة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُشَارَكَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "علاقة تعاونية بين أشخاص أو مجموعات يتفقون على تقاسم المسؤولية لتحقيق هدف محدد"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يميل للترجمة الحرفية؛ يفضل صياغته بأسلوب معجمي يبرز طبيعة العقد أو الاتفاق وتقاسم التبعات."
    authored:
      - type: terminological
        text: "عقد أو اتفاق بين طرفين أو أكثر (أفراد أو هيئات) على التعاون وتقاسم التبعات والمغانم للوصول إلى غرض مشترك."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عقد أو اتفاق بين طرفين أو أكثر (أفراد أو هيئات) على التعاون وتقاسم التبعات والمغانم للوصول إلى غرض مشترك."}
  examples:
    per_lemma:
      - lemma: "شَرَاكَة"
        examples:
          - text: "وَقَّعَتِ الشَّرِكَتَانِ اتِّفَاقَ شَرَاكَةٍ اسْتِرَاتِيجِيَّةٍ لِتَطْوِيرِ التِّقْنِيَّاتِ الجَدِيدَةِ."
            type: usage
      - lemma: "شِرْكَة"
        examples:
          - text: "تَقُومُ الشِّرْكَةُ عَلَى أَسَاسِ المَسْؤُولِيَّةِ المُتَضَامِنَةِ بَيْنَ الشُّرَكَاءِ."
            type: usage
      - lemma: "تَحَالُف"
        examples:
          - text: "شَكَّلَتِ المُنَظَّمَاتُ البِيئِيَّةُ تَحَالُفًا لِحِمَايَةِ المَحْمِيَّاتِ الطَّبِيعِيَّةِ."
            type: usage
      - lemma: "مُشَارَكَة"
        examples:
          - text: "تَعْمَلُ الدُّوَلُ عَلَى تَعْزِيزِ المُشَارَكَةِ الدَّوْلِيَّةِ فِي مُوَاجَهَةِ الأَوْبِئَةِ."
            type: usage

