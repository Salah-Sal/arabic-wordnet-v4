stage4_content:
  definition:
    current: "سمة التفكير بعناية قبل التصرف"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أدق يعكس جانب التمهل وتدبر العواقب كسمة شخصية."
    authored:
      - type: terminological
        text: "سمة تتسم بالتفكير المتأني وتدبر العواقب قبل الإقدام على فعل أو اتخاذ قرار."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-04667893-n", definition_index: 0, text: "سمة تتسم بالتفكير المتأني وتدبر العواقب قبل الإقدام على فعل أو اتخاذ قرار."}

  examples:
    per_lemma:
      - lemma: "رَوِيَّة"
        examples:
          - text: "اتخذ قراره بروية بعد دراسة كل الخيارات المتاحة."
            type: usage
      - lemma: "تَرَوٍّ"
        examples:
          - text: "طلب المدير من فريقه التروي قبل إصدار البيان النهائي."
            type: usage
      - lemma: "أَنَاة"
        examples:
          - text: "عُرف القاضي بالأناة في إصدار الأحكام."
            type: usage
      - lemma: "تَبَصُّر"
        examples:
          - text: "يجب التبصر في عواقب الأمور قبل الإقدام عليها."
            type: usage
      - lemma: "تَعَقُّل"
        examples:
          - text: "أظهر تعقلاً كبيراً في التعامل مع الأزمة."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-04667893-n", text: "اتخذ قراره بروية بعد دراسة كل الخيارات المتاحة."}

