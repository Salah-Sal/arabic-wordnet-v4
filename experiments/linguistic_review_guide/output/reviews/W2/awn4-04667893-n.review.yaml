          params: {entry_id: "{auto}", synset_id: "awn4-04667893-n"}

    - lemma: "تَبَصُّر"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر يدل على التأمل في العواقب وتبين الخير والشر قبل الإقدام، ويطابق سمة التفكير العميق والحذر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَبَصُّر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04667893-n"}

    - lemma: "تَعَقُّل"
      source: stage1
      decision: confirmed
      decision_reason: "تدل على استخدام العقل والتدبر لضبط النفس وتجنب التسرع، وتوافق المفهوم تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
