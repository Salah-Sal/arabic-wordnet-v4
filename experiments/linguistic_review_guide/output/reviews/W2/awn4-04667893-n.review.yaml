stage1_review:
  assessment:
    concerns:
      - "اللمة (تفكير) عامة جداً وتشير إلى مجرد إعمال العقل، ولا تفي بدلالة (thoughtfulness) التي تعني التروي والتمهل والتفكير العميق قبل التصرف."
    observations: "المفهوم يشير إلى سمة شخصية تتسم بالتمهل والتدبر وعدم التسرع في اتخاذ القرارات أو الأفعال (deliberation / thoughtfulness). توجد في العربية عدة ألفاظ دقيقة تعبر عن هذا المعنى مثل الروية والأناة."
  blind_candidates:
    - lemma: "تَرَوٍّ"
      generation_method: ishtiqaq
      justification: "مصدر مشتق يدل على التمهل والتفكر قبل الإقدام على الفعل وعدم التعجل فيه."
    - lemma: "أَنَاة"
      generation_method: majaz
      justification: "مأخوذة من التأني والحلم وتستعمل للدلالة على السمة الشخصية المتمثلة في عدم العجلة والتفكير بعناية."
    - lemma: "تَبَصُّر"
      generation_method: ishtiqaq
      justification: "مشتقة من البصر والبصيرة، وتعني التأمل في عواقب الأمور وتبينها قبل التصرف."
    - lemma: "تَعَقُّل"
      generation_method: ishtiqaq
      justification: "مصدر يدل على استخدام العقل لضبط التصرفات وتدبرها وتجنب التسرع."

stage2_evidence:
  per_lemma:
    - lemma: "تفكير"
      expands:
        - text: "إِعْمَال الْعقل فِي مشكلة للتوصل إِلَى حلهَا"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يبين أن التفكير هو إعمال العقل بشكل عام ولا يحمل بالضرورة دلالة التمهل أو السمة الشخصية (التفكير بعناية قبل التصرف)."
    - lemma: "روية"
      confirm:
        - text: "النَّظَرُ والتَّفَكُّـرُ في الأَمْرِ, وهى خلاف البديهة... مرحلة مِنْ مَراحِلِ العَمَلِ الإرادِيِّ, تقومُ على تفكيرٍ وأَنَاةٍ قَبْلَ اتِّخاذِ قرارٍ ما"
          source: "المعجم الكبير"
        - text: "النظر والتفكير في الأمور , وهي خلاف البديهة"
          source: "المعجم الوسيط"
    - lemma: "تَرَوٍّ"
      confirm:
        - text: "التروي: والتروية التفكر في الشيء والإمالة بين خواطر النفس في تحصيل الرأي."
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "أَنَاة"
      confirm:
        - text: "الحلم والوقار . التُّؤَدَة , يقال : إنَّه لذو أناةٍ ورفق . الرِّفق . الانتظار"
          source: "المعجم الكبير"
        - text: "الأناة: لغةً الحِلْمُ والوقار والانتظار... هو معنى باعثٌ على الاحتياط في الأمور، والتأنّي هو إتباعها بعد الدخول فيه والتوقف قبله وهي ضد العَجَلة."
          source: "التعريفات الفقهيّة للبركتي"
    - lemma: "تَبَصُّر"
      confirm:
        - text: "تَأمل وتعرف وَيُقَال تبصر الشَّيْء وتبصر فِي رَأْيه تبين مَا يَأْتِيهِ من خير أَو شَرّ"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "تَعَقُّل"
      confirm:
        - text: "التعقل: التدبر، وتعقلت الشيء تدبرته."
          source: "التوقيف على مهمات التعاريف للمناوي"

stage3_analysis:
  per_lemma:
    - lemma: "تفكير"
      decision: removed
      decision_reason: "كلمة عامة تعني مطلق إعمال العقل، ولا تحمل دلالة السمة الشخصية (التروي وعدم التسرع) التي يشير إليها المفهوم (thoughtfulness)."
      evidence_assessment:
        case: mixed
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
            
    - lemma: "روية"
      decision: confirmed
      decision_reason: "دقيقة جداً في التعبير عن المفهوم، حيث تعني النظر والتفكر في الأمر بتأنٍّ قبل اتخاذ القرار، وهي السمة المطلوبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَوِيَّة"

    - lemma: "تَرَوٍّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر يدل على التمهل والتفكر في الأمر قبل الإقدام عليه، ويعبر بدقة عن السمة الشخصية المطلوبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَرَوٍّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-04667893-n"}

    - lemma: "أَنَاة"
      source: stage1
      decision: confirmed
      decision_reason: "تعني الحلم والوقار والتمهل وعدم العجلة، وتعد من أدق الألفاظ المعبرة عن سمة التفكير بعناية قبل التصرف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
