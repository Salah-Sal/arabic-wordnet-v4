      maqayis_quote: "«الْبَاءُ وَالصَّادُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا الْعِلْمُ بِالشَّيْءِ; يُقَالُ: هُوَ بَصِيرٌ بِهِ... وَأَصْلُ ذَلِكَ كُلِّهِ وُضُوحُ الشَّيْءِ.»"
