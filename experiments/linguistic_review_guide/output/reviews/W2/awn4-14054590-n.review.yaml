# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    - lemma: "اِسْتِعْدَاد"
      entry_id: "{auto}"
      root: "عدد"
      maqayis_quote: "«الْعَيْنُ وَالدَّالُ أَصْلٌ صَحِيحٌ وَاحِدٌ لَا يَخْلُو مِنَ الْعَدِّ الَّذِي هُوَ الْإِحْصَاءُ. وَمِنَ الْإِعْدَادِ الَّذِي هُوَ تَهْيِئَةُ الشَّيْءِ. وَإِلَى هَذَيْنِ الْمَعْنَيَيْنِ تَرْجِعُ فُرُوعُ الْبَابِ كُلُّهَا»"

    - lemma: "تَأَهُّب"
      entry_id: "{auto}"
      root: "أهب"
      maqayis_quote: "«الْهَمْزَةُ وَالْهَاءُ وَالْبَاءُ كَلِمَتَانِ مُتَبَايِنَتَا الْأَصْلِ، فَالْأُولَى الْإِهَابُ... وَالْكَلِمَةُ الثَّانِيَةُ الْأُهْبَةُ وَهِيَ الْعُدَّةُ، وَقَدْ أَهَّبَ لِلْأَمْرِ تَأْهِيبًا وَتَأَهَّبَ»"

    - lemma: "جَاهِزِيَّة"
