# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائر على نفسه: يستخدم «جاهزية» و«استعداد» وكلاهما من لمّات المجموعة ذاتها"
      - "لمّة «جاهزية» لم تُعثر عليها مفردةً مستقلة في المعاجم الكلاسيكية المُستعلَمة؛ تظهر فقط في مركبات حديثة"
      - "اللمّات الثلاث مُرسَلة بلا تشكيل مما يُعسِّر التحديد الصرفي"
    observations: >
      المجموعة تُغطّي مفهوم «الجاهزية للعمل» بثلاث لمّات تتكامل دلالياً. «استعداد» و«تأهب» أصيلان في التراث اللغوي
      العربي وتؤيدهما شواهد معجمية متعددة كلاسيكية وحديثة. أما «جاهزية» فلفظ حديث مشتق من «جاهز» على وزن
      فَاعِلِيَّة، اكتسب شيوعاً في العربية المعاصرة في السياقين التقني والعسكري، لكنه يفتقر إلى الحضور المعجمي
      الكلاسيكي. الدوران في التعريف مشكلة منهجية تستوجب إعادة الصياغة.
  blind_candidates:
    - lemma: "تَهَيُّؤ"
      generation_method: ishtiqaq
      justification: "مصدر تهيَّأ (باب التفعُّل من هيَّأ)، يدل على حالة الاستعداد والتأهب لاستقبال الفعل أو الانخراط فيه"
    - lemma: "أُهْبَة"
      generation_method: majaz
      justification: "إحياء لفظ تراثي من الجذر أَهَبَ، كان يُستخدم في سياق الحرب تحديداً (أُهبة الحرب = عُدَّتها)؛ مشابهة وظيفية واضحة مع المفهوم المطلوب"
    - lemma: "عُدَّة"
      generation_method: majaz
      justification: "اسم من عَدَّ/أَعَدَّ (الجذر عدد)، المعجم الوسيط: «الاستعداد، ما أُعِدَّ لأمرٍ يحدُثُ»؛ يُعبِّر عن الاستعداد المادي للأمر"
    - lemma: "تَعْبِئَة"
      generation_method: ishtiqaq
      justification: "مصدر عبَّأَ (الجذر عبأ، باب التفعيل)، ورد في المعجم الوسيط: «تهيئة موارد الدولة وإعدادها عند الحرب»؛ يناسب السياق العسكري المذكور في التعريف"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "استعداد"
      confirm:
        - text: "«الاستعداد: لغة، طلب التأهب، وعرفاً كون الشيء بالقوة القريبة أو البعيدة متهيأ إلى الفعل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الاستعداد: هو كون الشيء بالقوة القريبة أو البعيدة إلى الفعل»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«اِسْتِعْدَادٌ» — EN: preparedness — domain: The Unified Medical Dictionary"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(1) استعداد (2) تأهُّب [للحرب]» — EN: preparedness"
          source: "المورد الحديث (2008)"
        - text: "«(1) استعداد (2) مَيْل؛ رغبة؛ نزوع» — EN: readiness"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الاستعداد في علم التربية): اتجاه نحو سلوك خاص نتيجة عوامل عضوية أو نفسية أو هما معاً»"
          source: "المعجم الوسيط"
          addition: "في علم التربية يُحيل إلى الاستعداد النفسي الفطري (aptitude/disposition)، وهو امتداد دلالي جانبي لا يلغي الدلالة الأصلية على الجاهزية للعمل"

    - lemma: "تأهب"
      confirm:
        - text: "«تأهب له: استعد، يقال: تأهب للسفر وللأمر»"
          source: "المعجم الوسيط"
        - text: "«الاستعداد لأحداث معينة أو غير متوقعة» — EN: preparedness"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm / ALECSO)"
        - text: "«التأهب للكوارث» — EN: disaster preparedness"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«تأهب لَهُ: استعد»"
          source: "المعجم الكبير"

    - lemma: "جاهزية"
      evidence_status: "no_material_found"

    - lemma: "تَهَيُّؤ"
      confirm:
        - text: "«بَاب التهيؤ: تأهب وتهيأ وتعبأ واحتشد واستعد وأعد»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (hawramani)"
      contradicts:
        - text: "«استثارة الاستعداد للانطلاق» — EN: warming up — domain: Arts, Recreation and Sports"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm / ALECSO)"
          conflict: "يُضيِّق المصطلح التقني الحديث دلالة «تهيؤ» إلى الإحماء الرياضي، مما يُنشئ تعارضاً مع السياق العسكري للمجموعة"

    - lemma: "أُهْبَة"
      confirm:
        - text: "«العُدَّة، يقال أخَذَ لذلك الأمر أُهْبَتَه — أهْبَة الحرب: عُدَّتها»"
          source: "المعجم الكبير"
        - text: "«الأهبة: العدة، يقال: أخذ للأمر أهبته»"
          source: "المعجم الوسيط"
        - text: "«رأيتُ أخا الدُّنيا... / بلا أُهْبَةِ الثاوِي المقيم ولا السَّفْرِ» (شاهد شعري)"
          source: "المعجم الكبير"
        - text: "«الوارد في المعاجم: أُهبة (بالضم) — الصواب: أَخَذَ للأمر أُهْبَتَه»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"

    - lemma: "عُدَّة"
      confirm:
        - text: "«العُدَّةُ: الاستعداد، ما أُعِدَّ لأمرٍ يحدُثُ»"
          source: "المعجم الوسيط"
        - text: "«العدة: بالضم، ما أعددته لحوادث الدهر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«العدة: تربص يلزم المرأة عند زوال النكاح المتأكد أو شبهته»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "عِدَّة المرأة الشرعية اشتراك لفظي قوي وشائع يُربك الدلالة المقصودة"
        - text: "EN: kit / apparatus / armamentarium / tools — domain: اللغات التقنية"
          source: "معاجم ArabTerm متعددة (المعلوماتية، الطب، الكيمياء)"
          conflict: "في السياقات التقنية الحديثة تحوّلت العُدَّة إلى أدوات ومعدات مادية بعيدة عن دلالة الاستعداد المجردة"

    - lemma: "تَعْبِئَة"
      confirm:
        - text: "«التعبئة: تهيئة موارد الدولة وإعدادها عند الحرب»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "EN: packaging — EN: filling — domain: Pharmacy / Nutrition Technologies"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) / المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "المعنى الحديث الغالب للتعبئة هو التغليف التجاري والصناعي، لا الاستعداد العسكري؛ الاستخدام العسكري أصبح هامشياً"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "استعداد"
      decision: confirmed
      decision_reason: >
        مصدر فصيح موثَّق على وزن اِسْتِفْعَال (Form X) من الجذر عدد؛ مؤكَّد في عشرات المعاجم الكلاسيكية والحديثة
        بمعنى الجاهزية والتأهب. يؤيده EN: preparedness وEN: readiness في المعاجم الحديثة. الأكثر تداولاً
        في العربية المعاصرة للدلالة على هذا المفهوم. الاشتراك الدلالي مع aptitude/disposition موثَّق لكنه فرعي
        لا يمنع الإدراج.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبِّر عن الجاهزية بمفهومها الأشمل (النفسي والمادي والتشغيلي)؛ أعلى تجريداً وأوسع تداولاً من مرادفيه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِعْدَاد"

    - lemma: "تأهب"
      decision: confirmed
      decision_reason: >
        مصدر فصيح على وزن تَفَعُّل (Form V) من الجذر أهب؛ يدل على الاستعداد الذاتي الموجَّه لحدثٍ وشيك.
        مؤكَّد في المعجم الوسيط والكبير والمسرد البيئي (preparedness) والمكنز الزراعي (disaster preparedness).
        الوزن الصرفي (تفعّل = تحقيق الفعل لنفسه) مناسب لمفهوم «التهيؤ الإرادي لأمرٍ وشيك».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُؤكِّد الاستعداد الموجَّه لحدثٍ وشيك؛ أكثر خصوصية في سياقات الطوارئ والتحضير العملي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَأَهُّب"

    - lemma: "جاهزية"
      decision: confirmed
      decision_reason: >
        مصدر صناعي حديث من «جاهز» (اسم فاعل من جهّز) على وزن فَاعِلِيَّة، شائع في العربية المعاصرة
        في السياقين التقني والعسكري. ورد في مركبات موثَّقة: «مرحلة الجاهزية» (EN: preparation phase)،
        «مراجعة جاهزية الاختبار» (EN: test readiness review). عدم ظهورها مفردةً في المعاجم الكلاسيكية
        متوقَّع نظراً لحداثة صيغة المصدر الصناعي. الجذر جهز موثَّق في ابن فارس والمعاجم.
        اختبار السكّ: «جاهزية» وحدة معجمية ثابتة لا يمكن إبدال مكوّناتها ← مقبولة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُركِّز على القدرة التشغيلية الفعلية للأنظمة والأجهزة؛ الأكثر استخداماً في الخطاب التقني والعسكري المعاصر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَاهِزِيَّة"

    - lemma: "تَهَيُّؤ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ثبوته مرادفاً كلاسيكياً لدى ابن مالك، فإن المصطلح التقني الحديث ضيَّق دلالته إلى «الإحماء
        الرياضي» (EN: warming up) في سياق الفن والرياضة، مما يُنشئ تعارضاً مع السياق العسكري للمجموعة.
        فضلاً عن ذلك، تَأَهُّب يؤدي الوظيفة ذاتها بأدلة أقوى وأقل اشتباهاً.

    - lemma: "أُهْبَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ تراثي فصيح موثَّق بمعنى العُدَّة والاستعداد للحرب: «أهبة الحرب: عُدَّتها» (المعجم الكبير)،
        «الأهبة: العدة» (الوسيط). الوزن الصرفي فُعْلَة يدل على حالة أو نتيجة. أدلة مؤكِّدة فقط بلا
        تعارض. يُثري المجموعة بدلالة تراثية راسخة في الأدب والشعر العربي. اختبار الاقتراض: لفظ عربي
        صميم. ضبطه الصحيح أُهْبَة (بالضم) مؤكَّد من معجم الصواب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُعبِّر عن الجاهزية المادية والحربية تحديداً (السلاح والعُدة)؛ الأرسخ في التراث الأدبي والشعري"
      actions:
        - command: create_entry
          params: {lemma: "أُهْبَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عُدَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «الاستعداد، ما أُعِدَّ لأمرٍ يحدُثُ» (الوسيط) دقيق، فإن الاشتراك اللفظي مع «عِدَّة» المرأة
        الشرعية (قوي وشائع) ومع «عُدَّة» الأدوات والمعدات التقنية بالغ الخطورة ومُضلِّل في الاستخدام
        الحديث. إدراجها في هذه المجموعة سيُربك المستخدم لا يُرشده.

    - lemma: "تَعْبِئَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الوسيط يُثبت «تهيئة موارد الدولة وإعدادها عند الحرب»، فإن المعنى الحديث الغالب
        (packaging/filling في الصناعة والصيدلة) يتعارض تعارضاً صريحاً مع الدلالة المطلوبة. إدراجها
        سيوهم بأن المجموعة تخصّ التعبئة التجارية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
