# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13955246-n  |  ILI: i110158  |  POS: n
# المفهوم: dystopia (ديستوبيا / مدينة فاسدة)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «ديستوبيا» تفتقر إلى التشكيل الكامل"
      - "اللمّة «مدينة فاسدة» تُحيل إلى مكان (city) لا إلى حالة (state)، وهو ما يتعارض مع الجنس القريب في التعريف وفي المعنى الأصيل لـ dystopia"
      - "«فاسدة» في المعجمية العربية الكلاسيكية تُستخدم في السياق القانوني الشرعي (ضدّ الباطل) لا وصفاً لظروف حياة مُستبدّة"
      - "التعريف العربي لا يُشير إلى العلاقة التضادية مع اليوتوبيا التي تُشكّل أصل المصطلح ومقابله"
      - "التعريف العربي لا يُبيّن الطابع السياسي الاجتماعي المنظَّم للمفهوم"
    observations: >
      المجموعة تُغطّي مفهوم الديستوبيا (dystopia) — المصطلح الذي صاغه جون ستيوارت ميل
      عام ١٨٦٨م نقيضاً لليوتوبيا. اللمّة المعرَّبة «ديستوبيا» مقبولة وتتوافق مع نمط
      تعريب «يوتوبيا» المُسجَّل في معجم اللغة العربية المعاصرة لأحمد مختار عمر. أما
      «مدينة فاسدة» فتركيبٌ وصفي غير مُثبَّت معجمياً كوحدة اصطلاحية، وفيه مخالفتان
      للتعريف: دلالة المكان (مدينة) عوضاً عن الحالة (state)، وإيحاء «فاسدة» بالفساد
      القانوني/الأخلاقي لا بالاستبداد والحرمان. المفهوم أدبيٌّ وسياسيٌّ غربي النشأة
      لكن قيمه (ذمّ الاستبداد، الدفاع عن الحرية) قيمٌ عالمية.

  blind_candidates:
    - lemma: "دِيسْتُوبِيَا"
      generation_method: taarib
      justification: "مصطلح ذو صيغة عالمية (dystopia) مستخدَم في الأدب والإعلام والأكاديميا العربية، يقبل لام التعريف والنسبة والجمع بالألف والتاء، ويتوازى مع «يوتوبيا» المتداوَلة في العربية المعاصرة"
    - lemma: "بُؤسِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي (-يَّة) من جذر بؤس الدالّ على الشقاء والفقر الشديد؛ وزن المصدر الصناعي مناسب لتحويل الصفة إلى مفهوم مجرد مُرادف لـ«حالة البؤس الاجتماعي»"
    - lemma: "مَدِينَةُ الشَّرِّ"
      generation_method: tarkib
      justification: "تركيب إضافي نقيض «المدينة الفاضلة» (يوتوبيا الفارابي)؛ يُجسّد الحالة الاجتماعية البائسة في شكل وحدة معجمية تُحاكي المصطلح الفلسفي العربي الأصيل"
    - lemma: "البَوَار"
      generation_method: majaz
      justification: "إحياء لفظ قرآني دالٍّ على الهلاك التام ﴿وَكُنْتُمْ قَوْمًا بُورًا﴾ وانعدام صلاحية الأرض وتعطُّل الخير فيها؛ إزاحةٌ دلالية نحو المجتمع المتهالك المُستبدّ الذي أهلك نفسه"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المُنفَّذة: ٤ استعلامات
#   ١. مطابقة دفعية للمّات + المرشحات (headword_norm)
#   ٢. جسر إنجليزي: dystopia / dystopian
#   ٣. بحث FTS بكلمات مفتاحية: قمع / حرمان / مدينة فاضلة
#   ٤. مقاييس اللغة: بور / فسد / مدن / ضنك
stage2_evidence:
  per_lemma:
    - lemma: "ديستوبيا"
      evidence_status: "no_material_found"

    - lemma: "مدينة فاسدة"
      contradicts:
        - text: "«الفاسد: فِي الْبَاطِل وَعند الشَّافِعِي رَحمَه الله لَا فرق بَين الْفَاسِد وَالْبَاطِل»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "«فاسدة» في التراث المعجمي مرتبطة بالسياق القانوني الشرعي (مقابل الباطل)، لا بوصف ظروف الحياة الاجتماعية"
        - text: "«الفاسد: ما كان مشروعًا في نفسه فاسد المعنى من وجه الملازمة، وما ليس بمشروع إتيانه بحكم الحال مع تصور الانفصال في الجملة، كالبيع عند أذان الجمعة»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "التوثيق الكلاسيكي لـ«فاسد» حصريٌّ في الفقه الإسلامي، بعيدٌ عن وصف أحوال المعيشة الاجتماعية"

    - lemma: "دِيسْتُوبِيَا"
      expands:
        - text: "«يوتوبيا [مفرد]: (مع) أفكار متعالية تتجاوز نطاقَ الوجود المادّيّ للمكان، وتحتوي على أهداف ونوازع العصر غير المحقَّقة، ويكون لها تأثير تحويليّ على النِّظام الاجتماعيّ القائم»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "توثيق «يوتوبيا» في المعجم المعاصر يُثبت قبول نمط التعريب الإغريقي-الإنجليزي (-topos → -توبيا)، مما يُجيز تعريب نقيضه (dystopia → دِيسْتُوبِيَا) بالنمط ذاته"

    - lemma: "بُؤسِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مَدِينَةُ الشَّرِّ"
      evidence_status: "no_material_found"

    - lemma: "البَوَار"
      confirm:
        - text: "«البوار: الهلاك الكساد في التجارة التجربة»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي (ت. 786م)"
        - text: "«البوار: اسم المَهْلَكة، يُقال: نَزَلَت بوارِ على النَّاسِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«الْبَوَار: الأَرْض الَّتِي لم تزرع أَو الَّتِي تركت سنة لتزرع من قَابل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«الأرض الخراب التى لم تُزْرَع — دارُ البَوار: دارُ الهَلاك، وهى جهنم»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "«البوار» في المعاجم يدلّ على الهلاك المطلق والأرض العاطلة، لا على الحالة السياسية/الاجتماعية المنظَّمة التي تُميّز الديستوبيا"
        - text: "«البوار: فرط الكساد، ولما كان فرطه يؤدي إلى الفساد كما قيل كسد حتى فسد، عبر بالبوار عن الهلاك»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
          conflict: "الدلالة الأصلية اقتصادية (الكساد)، والمجازية كونية (الهلاك)؛ لا يختص بالاستبداد السياسي الذي هو جوهر الديستوبيا"
      expands:
        - text: "«الْبَاءُ وَالْوَاوُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا هَلَاكُ الشَّيْءِ وَمَا يُشْبِهُهُ مِنْ تَعَطُّلِهِ وَخُلُوِّهِ. وَالْآخَرُ ابْتِلَاءُ الشَّيْءِ وَامْتِحَانُهُ. فَأَمَّا الْأَوَّلُ فَقَالَ الْخَلِيلُ: الْبَوَارُ الْهَلَاكُ، تَقُولُ: بَارُوا، وَهُمْ بُورٌ، أَيْ ضَالُّونَ هَلْكَى»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر بور يحمل معنى التعطّل والخلوّ من الخير؛ قريبٌ دلالياً من الديستوبيا لكنه أعمّ وأشمل، وانتمائه إلى مجال الهلاك الفردي/الكوني لا السياسي يُضعف مطابقته"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "ديستوبيا"
      decision: confirmed
      decision_reason: >
        لفظٌ معرَّب عن الإنجليزية (dystopia ← اليونانية dys- + topos) مقبولٌ في الاستخدام
        الأكاديمي والإعلامي العربي المعاصر. يتوافق مع نمط تعريب «يوتوبيا» الموثَّق في معجم
        اللغة العربية المعاصرة. التعريب هو الوسيلة الأنسب هنا بعد استنفاد البدائل: لا يُوجد
        جذر عربي يُغطّي هذا المفهوم السياسي-الأدبي تحديداً دون تكلُّف أو اشتراك لفظي.
        اللمّة تحتاج تحديث التشكيل وحسب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المُؤكَّدة في المجموعة؛ مصطلحٌ تقني في الأدب التخيُّلي والفكر
        السياسي يُشير إلى المجتمع أو الدولة المُستبدّة البائسة نقيضَ اليوتوبيا؛ يُقتصَر
        استخدامه على السياق الاصطلاحي المتخصص دون الاستخدام اليومي العام
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دِيسْتُوبِيَا"

    - lemma: "مدينة فاسدة"
      decision: removed
      decision_reason: >
        مخالفتان جوهريتان: (١) «مدينة» تُحيل إلى مكان جغرافي (city) لا إلى حالة (state)،
        وهو ما يتعارض مع الجنس القريب في التعريف ومع المعنى الأصيل لـ dystopia الذي يصف
        حالةً اجتماعية لا مكاناً بعينه. (٢) «فاسدة» في المعجمية العربية الكلاسيكية موثَّقة
        في السياق القانوني الشرعي (ضدّ الباطل) لا وصفاً اجتماعياً. فضلاً عن ذلك، المركَّب
        لم يُثبَّت معجمياً كوحدة اصطلاحية ثابتة؛ واختبار الاستبدال يكشف أنه وصفٌ حرٌّ
        (يمكن قول «مدينة ظالمة» أو «مدينة قمعية» بالمعنى ذاته)، لا مصطلحٌ مسكوك.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "دِيسْتُوبِيَا"
      source: stage1
      decision: removed
      decision_reason: "المرشح يتطابق مع اللمّة الموجودة «ديستوبيا» ذاتها، وتوليده عمياء يُصادق على إبقائها مع تحديث التشكيل؛ لا حاجة إلى إنشاء مدخل جديد."

    - lemma: "بُؤسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصدر الصناعي من جذر بؤس غير مُسجَّل في المعاجم كمصطلح ثابت، ولا يجتاز اختبار التثبيت المعجمي. الوزن وجيهٌ اشتقاقياً لكن اللفظ لم يُسَكّ بعدُ."

    - lemma: "مَدِينَةُ الشَّرِّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على التعبير في المعاجم كوحدة اصطلاحية ثابتة؛ ويُخالف التعريف بإحالته إلى مكان لا حالة، بالقدر ذاته الذي تُخالفه «مدينة فاسدة»."

    - lemma: "البَوَار"
      source: stage1
      decision: removed
      decision_reason: >
        «البوار» في المعجمية العربية يعني الهلاك المطلق والكساد وتعطُّل الأرض؛ وهو أعمّ
        من الديستوبيا ولا يختص بالحالة السياسية/الاجتماعية المنظَّمة. الإزاحة الدلالية
        المقترحة ممكنة نظرياً لكنها تكلُّفٌ لغوي يفتقر إلى سابقة معجمية. وجود «دِيسْتُوبِيَا»
        المعرَّبة المُتداوَلة يُغني عنه.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
