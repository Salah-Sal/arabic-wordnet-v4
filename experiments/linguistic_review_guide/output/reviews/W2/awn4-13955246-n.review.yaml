  definition:
    current: "حالة تكون فيها ظروف الحياة سيئة للغاية بسبب الحرمان أو القمع أو الإرهاب"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح جنساً وفصلاً لكنه يعاني ثلاثة قصور: (١) لا يُبيّن الطابع
        السياسي الاجتماعي المنظَّم — فقد يُحمَل التعريف على أي كارثة طبيعية أو مجاعة،
        بينما الديستوبيا تستلزم استبداداً منهجياً مُتعمَّداً. (٢) لا يُشير إلى مقابله
        اليوتوبيا، وهو تمييزٌ حاسم في فهم المصطلح ومنشئه. (٣) «سيئة» صفةٌ عامة جداً،
        والأنسب «تردَّت أحوال المعيشة» للتعبير عن الطابع المُزمَن الشامل.
