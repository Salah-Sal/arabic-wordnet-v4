stage4_content:
  definition:
    current: "حساب لمرور الوقت بناءً على موقع الشمس في السماء"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يميل للتبسيط؛ يفضل تعريفه بأسلوب معجمي أكثر دقة يذكر الأرض أو خط الطول."
    authored:
      - type: terminological
        text: "نظام لحساب الزمن يعتمد على الحركة الظاهرية للشمس في السماء، ويقاس بالوقت الذي تستغرقه الشمس للعودة إلى نفس خط الطول."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَوْقِيتٌ شَمْسِيٌّ"
        examples:
          - text: "تعتمد الساعات الشمسية القديمة (المزاول) على التوقيت الشمسي لتحديد ساعات النهار."
            type: usage
      - lemma: "زَمَنٌ شَمْسِيٌّ"
        examples:
          - text: "يختلف الزمن الشمسي عن الزمن القانوني الذي تتبعه الدول في ساعاتها الرسمية."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-92406053-n", definition_index: 0, text: "نظام لحساب الزمن يعتمد على الحركة الظاهرية للشمس في السماء، ويقاس بالوقت الذي تستغرقه الشمس للعودة إلى نفس خط الطول."}

