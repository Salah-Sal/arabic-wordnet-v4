stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - التعريف الحالي دقيق لوصف "التوقيت الشمسي الظاهري" (Apparent Solar Time) ولكنه مقبول للمفهوم العام.
    observations: "المفهوم مركزي في علم الفلك العربي والتوقيت الشرعي، وتوجد عدة مترادفات اصطلاحية له بحسب السياق (فلكي أو هندسي أو عام)."
  blind_candidates:
    - lemma: "تَوْقِيتٌ شَمْسِيٌّ"
      generation_method: tarkib
      justification: "التركيب الوصفي المباشر للتعبير عن الزمن المنسوب للشمس."
    - lemma: "زَمَنٌ شَمْسِيٌّ"
      generation_method: tarkib
      justification: "استخدام 'الزمن' كمرادف للوقت والتوقيت في السياقات العلمية والفلكية."
    - lemma: "وَقْتٌ شَمْسِيٌّ"
      generation_method: tarkib
      justification: "تعبير شائع في المعاجم الفنية (مثل معجم الرياضيات والفلك)."
    - lemma: "تَوْقِيتٌ ظَاهِرِيٌّ"
      generation_method: tarkib
      justification: "يشير بدقة إلى الوقت المحسوب بناءً على موقع الشمس الفعلي (الظاهري) في السماء كما ورد في التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "تَوْقِيتٌ شَمْسِيٌّ"
      confirm:
        - text: "الزمن المحسوب على أساس دوران الأرض حول الشمس، حيث يكون اليوم الشمسي هو الوقت الذي تستغرقه الشمس للعودة إلى نفس خط الطول في السماء."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "زَمَنٌ شَمْسِيٌّ"
      confirm:
        - text: "زمن شمسي ظاهري (apparent solar time)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "زمن شمسي متوسط (mean solar time)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
    - lemma: "وَقْتٌ شَمْسِيٌّ"
      confirm:
        - text: "وقت شمسي (solar time)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
    - lemma: "تَوْقِيتٌ ظَاهِرِيٌّ"
      confirm:
        - text: "وقت ظاهري (apparent time)"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"

