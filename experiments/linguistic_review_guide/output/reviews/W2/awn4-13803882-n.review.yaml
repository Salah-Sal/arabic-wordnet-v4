stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'عَلَاقَة شَخْصِيَّة' صحيحة ولكنها تبدو ترجمة حرفية للمصطلح الإنجليزي، وتفتقر للأصالة المعجمية العربية."
      - "التعريف الحالي 'علاقة بين الأشخاص' بسيط جداً ويكاد يكون تكراراً للمصطلح."
    observations: "المفهوم يعبر عن الروابط الإنسانية والاجتماعية بين الأفراد، وهناك مصطلحات عربية أصيلة وغنية دلالياً مثل 'آصرة' و'رابطة' و'صلة' تعبر عن هذا المعنى بدقة أكبر من التركيب الوصفي البسيط."
  blind_candidates:
    - lemma: "آصِرَة"
      generation_method: ishtiqaq
      justification: "من الجذر (أصر) الذي يعني الحبس والعطف، وتستخدم الآصرة للتعبير عن كل ما يربط بين الأشخاص من رحم أو عهد أو مودة."
    - lemma: "رَابِطَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ربط)، وتعني لغوياً ما يربط بين شيئين، وتستخدم اصطلاحاً للعلاقات المتينة بين الأفراد أو الجماعات."
    - lemma: "صِلَة"
      generation_method: ishtiqaq
      justification: "من الجذر (وصل)، وتعني الاتصال والارتباط، وتشيع في سياق العلاقات الاجتماعية (مثل صلة الرحم)."
    - lemma: "عَلَاقَة بَيْنَ الأَشْخَاص"
      generation_method: tarkib
      justification: "تعريب دقيق ومصطلح فني مستخدم في علم النفس والاجتماع (Interpersonal relationship)."

stage2_evidence:
  per_lemma:
    - lemma: "عَلَاقَة شَخْصِيَّة"
      confirm:
        - text: "«علاقة شخصية، أُلفة: مرحلة متطورة من علاقة بين شخصين تتميز بتقاسمهما معلوماتهما الخاصة.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "آصِرَة"
      confirm:
        - text: "«الآصِرَةُ: ما عَطَفَك على رجل من رَحِم أَو قرابة أَو صِهْر أَو معروف، والجمع الأَواصِرُ.»"
          source: "لسان العرب"
        - text: "«آصِرة: رابطة كالقرابة أو المصاهرة أو غيرهما؛ سيبذل قصارى جهده لدعم أواصر الصداقة بين البلدين.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "رَابِطَة"
      confirm:
        - text: "«الرابطة: العلاقة والوصلة بَين الشَّيْئَيْنِ.»"
          source: "المعجم الوسيط"
        - text: "«رابطة: bond»"
          source: "المعجم الموحد لمصطلحات الكيمياء والجيولوجيا (بمعنى عام للربط)"
    - lemma: "صِلَة"
      confirm:
        - text: "«الصّلة: Relation, contact, conjunction؛ وفي اللغة الفارسية بمعنى: الاتصال، والوصل، والقرابة.»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "عَلَاقَة بَيْنَ الأَشْخَاص"
      confirm:
        - text: "«علاقة بين الأشخاص: ترابط بين عدة أفراد داخل جمعية يحاولون فيها تلبية الحاجات الاجتماعية لبعضهم بعض.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"

stage3_analysis:
  per_lemma:
    - lemma: "عَلَاقَة شَخْصِيَّة"
      decision: confirmed
      decision_reason: "مصطلح معاصر وشائع الاستخدام في السياقات الاجتماعية والنفسية لترجمة (personal relation)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَلَاقَة شَخْصِيَّة"
    - lemma: "آصِرَة"
      source: stage1
      decision: confirmed
      decision_reason: "من أقوى الكلمات العربية تعبيراً عن الروابط الإنسانية، وتتميز ببعد دلالي عميق يشير إلى العطف والمودة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "آصِرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "رَابِطَة"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة أصيلة تعبر عن الوصل بين شيئين، وتستخدم بكثرة في السياق الاجتماعي للتعبير عن العلاقات المتينة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رَابِطَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "صِلَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ شائع وأصيل يعبر عن الارتباط والاتصال بين الأفراد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "صِلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "عَلَاقَة بَيْنَ الأَشْخَاص"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فني دقيق في العلوم الاجتماعية يطابق تعريف المجموعة تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "عَلَاقَة بَيْنَ الأَشْخَاص", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "علاقة بين الأشخاص"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويقترب من الدورانية."
    authored:
      - type: terminological
        text: "ترابط أو اتصال قائم بين فردين أو أكثر، يهدف إلى تلبية احتياجات اجتماعية أو نفسية متبادلة، ويقوم على العاطفة أو العهد أو المصلحة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "ترابط أو اتصال قائم بين فردين أو أكثر، يهدف إلى تلبية احتياجات اجتماعية أو نفسية متبادلة، ويقوم على العاطفة أو العهد أو المصلحة."}
  examples:
    per_lemma:
      - lemma: "عَلَاقَة شَخْصِيَّة"
        examples:
          - text: "تطورت بين الزميلين علاقة شخصية قوية خارج نطاق العمل."
            type: usage
      - lemma: "آصِرَة"
        examples:
          - text: "تسعى الدولة لتقوية أواصر المحبة والتعاون بين أفراد المجتمع."
            type: usage
      - lemma: "رَابِطَة"
        examples:
          - text: "تعتبر رابطة الدم من أقوى الروابط التي تجمع بين البشر."
            type: usage
      - lemma: "صِلَة"
        examples:
          - text: "انقطعت الصلة بين الصديقين بعد سفرهما إلى بلدين مختلفين."
            type: usage
      - lemma: "عَلَاقَة بَيْنَ الأَشْخَاص"
        examples:
          - text: "يدرس علم الاجتماع طبيعة العلاقة بين الأشخاص وتأثيرها على سلوك الجماعة."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تطورت بين الزميلين علاقة شخصية قوية خارج نطاق العمل."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تسعى الدولة لتقوية أواصر المحبة والتعاون بين أفراد المجتمع."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تعتبر رابطة الدم من أقوى الروابط التي تجمع بين البشر."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "انقطعت الصلة بين الصديقين بعد سفرهما إلى بلدين مختلفين."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يدرس علم الاجتماع طبيعة العلاقة بين الأشخاص وتأثيرها على سلوك الجماعة."}

stage5_enrichment:
  per_entry:
    - lemma: "آصِرَة"
      entry_id: "{auto}"
      root: "أصر"
      maqayis_quote: "«الْهَمْزَةُ وَالصَّادُ وَالرَّاءُ، أَصْلٌ وَاحِدٌ يَتَفَرَّعُ مِنْهُ أَشْيَاءُ مُتَقَارِبَةٌ. فَالْأَصْرُ الْحَبْسُ وَالْعَطْفُ وَمَا فِي مَعْنَاهُمَا. وَتَفْسِيرُ ذَلِكَ أَنَّ الْعَهْدَ يُقَالُ لَهُ إِصْرٌ، وَالْقَرَابَةُ تُسَمَّى آصِرَةٌ.»"
    - lemma: "رَابِطَة"
      entry_id: "{auto}"
      root: "ربط"
      maqayis_quote: "«الرَّاءُ وَالْبَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى شَدِّ شَيْءٍ بِشَيْءٍ.»"
    - lemma: "صِلَة"
      entry_id: "{auto}"
      root: "وصل"
      maqayis_quote: "«الْوَاوُ وَالصَّادُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ضَمِّ شَيْءٍ إِلَى شَيْءٍ حَتَّى يَتَّصِلَ.»"
    - lemma: "عَلَاقَة بَيْنَ الأَشْخَاص"
      entry_id: "{auto}"
      roots:
        - word: "علاقة"
          root: "علق"
          maqayis_quote: "«الْعَيْنُ وَاللَّامُ وَالْقَافُ أَصْلٌ كَبِيرٌ يَدُلُّ عَلَى تَعَلُّقِ شَيْءٍ بِشَيْءٍ.»"
        - word: "أشخاص"
          root: "شخص"
          maqayis_quote: "«الشِّينُ وَالْخَاءُ وَالصَّادُ أَصْلٌ يَدُلُّ عَلَى ارْتِفَاعِ شَيْءٍ.»"
    - lemma: "عَلَاقَة شَخْصِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "علاقة"
          root: "علق"
          maqayis_quote: "«الْعَيْنُ وَاللَّامُ وَالْقَافُ أَصْلٌ كَبِيرٌ يَدُلُّ عَلَى تَعَلُّقِ شَيْءٍ بِشَيْءٍ.»"
        - word: "شخصية"
          root: "شخص"
          maqayis_quote: "«الشِّينُ وَالْخَاءُ وَالصَّادُ أَصْلٌ يَدُلُّ عَلَى ارْتِفَاعِ شَيْءٍ.»"

  per_sense:
    - lemma: "عَلَاقَة شَخْصِيَّة"
      sense_id: "{auto}"
      nuance: "تستخدم غالباً في السياق الحديث للتعبير عن العلاقات التي تنشأ بين الأفراد بناء على التفاعل الشخصي المباشر."
      mwe: true
