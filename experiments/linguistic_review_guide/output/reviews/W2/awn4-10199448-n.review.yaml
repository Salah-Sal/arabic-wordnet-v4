stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة عبارة عن تعبير مركب (مشغل رافعة) تفتقر للتشكيل التام."
      - "التعريف العربي (مشغل لآلة الرفع) هو ترجمة لفظية للتعريف الإنجليزي وليس صياغة معجمية."
    observations: "المفهوم يشير إلى مهنة فنية متخصصة في تشغيل معدات الرفع الثقيلة. في العربية المعاصرة، يُستخدم المصطلح المركب (مشغل) أو (سائق) متبوعاً بنوع الآلة (رافعة، مرفاع، ونش). اللفظ المفرد (رَفَّاع) قديم وأصيل ولكنه ابتعد في الاستعمال المعاصر عن الدلالة التقنية المباشرة لمشغل الآلة."
  blind_candidates:
    - lemma: "سَائِقُ رَافِعَةٍ"
      generation_method: tarkib
      justification: "الاستعمال الشائع في قطاع الإنشاءات لتعريف الشخص الذي يتحكم في الروافع الكبيرة."
    - lemma: "عَامِلُ رَافِعَةٍ"
      generation_method: tarkib
      justification: "تسمية عامة للمهني المسؤول عن معدات الرفع."
    - lemma: "رَفَّاعٌ"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن (فَعَّال) للدلالة على الاحتراف، وهي لفظة عربية قديمة لمن يرفع الزرع أو الأثقال."
    - lemma: "مُشَغِّلُ مِرْفَاعٍ"
      generation_method: tarkib
      justification: "صياغة تقنية دقيقة تترجم (hoist operator) باستخدام لفظ (مرفاع) المخصص لآلات الرفع الأصغر أو الصناعية."

stage2_evidence:
  per_lemma:
    - lemma: "مشغل رافعة"
      confirm:
        - text: "«مُشغّل: operator»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«الرَّافِعَةُ: آلة يُرفَعُ بها الشيءُ»"
          source: "المعجم الوسيط"
    - lemma: "سَائِقُ رَافِعَةٍ"
      evidence_status: "no_material_found"
    - lemma: "عَامِلُ رَافِعَةٍ"
      confirm:
        - text: "«عامل: operator»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
    - lemma: "رَفَّاعٌ"
      confirm:
        - text: "«رَفَّاع: من (ر ف ع) معلي الشيء ومطوله»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«الرَّفاعُ: رفع الزرع بعد الحصاد إلى الجرن»"
          source: "المعجم الوسيط"
          conflict: "الدلالة التراثية محصورة في رفع الزرع يدوياً وليست تشغيل آلة."
    - lemma: "مُشَغِّلُ مِرْفَاعٍ"
      confirm:
        - text: "«المِرْفاعُ: أداةٌ لرفع الأحمال الثقيلة»"
          source: "المعجم الكبير"
        - text: "«مرفاع: رافعة تقليدية حيث تتم عملية الحمل عن طريق سلك مرورا بذراع اارافعة»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"

stage3_analysis:
  per_lemma:
    - lemma: "مشغل رافعة"
      decision: confirmed
      decision_reason: "المصطلح الأكثر قبولاً في المعجمية التقنية المعاصرة (مشغل + اسم الآلة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُشَغِّلُ رَافِعَةٍ"
    - lemma: "سَائِقُ رَافِعَةٍ"
      source: stage1
      decision: confirmed
      decision_reason: "شائع جداً في الاستعمال المهني للروافع المتحركة والكبيرة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "سَائِقُ رَافِعَةٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10199448-n"}
    - lemma: "عَامِلُ رَافِعَةٍ"
      source: stage1
      decision: confirmed
      decision_reason: "استعمال عامي وفني مقبول لوصف المشغل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "عَامِلُ رَافِعَةٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10199448-n"}
    - lemma: "مُشَغِّلُ مِرْفَاعٍ"
      source: stage1
      decision: confirmed
      decision_reason: "أكثر دقة في ترجمة (hoist) الذي يقابله (مرفاع) في المعاجم الموحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "مُشَغِّلُ مِرْفَاعٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10199448-n"}
    - lemma: "رَفَّاعٌ"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من أصالته، إلا أنه لا يُستخدم تقنياً لوصف مشغل الآلة في السياق الحديث."

