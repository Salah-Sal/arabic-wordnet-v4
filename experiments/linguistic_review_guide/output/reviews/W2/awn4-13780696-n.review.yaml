# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13780696-n
# المفهوم: النهاية الرياضية (limit)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«حد رياضي» ليس مركباً اصطلاحياً ثابتاً في المعاجم المتخصصة؛ المعجم الموحد لمصطلحات الرياضيات والفلك (1990) يُدرج «حدّ» مجرداً بمعنى limit وبمعنى bound وterm"
      - "لفظ «حدّ» شديد الاشتراك في الاصطلاح الرياضي: يُطلق على الحدّ (term) من متتالية أو متعددة حدود، وعلى القيد (bound)، وعلى النهاية (limit)"
      - "اللمّة «نهاية» بدون تشكيل — ينبغي إضافة التشكيل الكامل: نِهَايَة"
    observations: "المجموعة تصف مفهوم النهاية (limit) في التحليل الرياضي، وهو مفهوم مركزي في حساب التفاضل والتكامل. المصطلح العربي المعياري المستقر في التعليم والبحث الرياضي هو «نهاية» (نِهَايَة)، ويُشتق منه: نهاية دالة (limit of a function)، نهاية متتالية (limit of a sequence)، نهاية محدودة (finite limit). أما «حدّ» فهو لفظ مشترك يحتاج سياقاً للتمييز، وإضافة «رياضي» إليه ليست عرفاً اصطلاحياً ثابتاً."
  blind_candidates:
    - lemma: "نِهَايَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن-ه-ي الدال على الغاية والبلوغ، على وزن فِعالة. المصطلح الرياضي المعياري للقيمة التي تؤول إليها الدالة"
    - lemma: "نُقْطَة تَرَاكُم"
      generation_method: tarkib
      justification: "مركب إضافي ثابت يقابل accumulation point / point of accumulation، مسجل في المعجم الموحد لمصطلحات الرياضيات والفلك"
    - lemma: "حَدّ"
      generation_method: majaz
      justification: "مجاز من الحدّ بمعنى منتهى الشيء وطرفه إلى الاصطلاح الرياضي؛ مسجل في المعاجم المتخصصة بمعنى limit"
    - lemma: "غَايَة"
      generation_method: majaz
      justification: "الغاية لغةً نهاية الشيء وآخره؛ مجاز لِما تتّجه إليه الدالة ولا تتجاوزه"


stage2_evidence:
  per_lemma:
    - lemma: "نِهَايَة"
      confirm:
        - text: "«النِّهَايَةُ: غايةُ الشيء وآخِرُه. من الدَّار: حدُّها. العَقْلُ. الخشَبة تُحمَل عليها الأحمال»"
          source: "المعجم الوسيط"
        - text: "«النهايةُ: غَايَة يصير الشَّيْء ذُو الكمية إِلَى حَيْثُ لَا يُوجد وَرَاءه شَيْء مِنْهُ»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«النهاية: ما به يصير الشيء ذا كمية، أي حيث لا يوجد وراءه شيء منه. وقيل نهاية الشيء آخره أصلا من النهي وهو المنع، والشيء إذا بلغ آخره امتنع من الزيادة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«نهاية دالة» = limit of a function"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«نهاية متتالية» = limit of a sequence"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«نهاية محدودة» = finite limit"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      expands:
        - text: "«نهاية قصوى» = extremum، «نهاية دنيا» = inferior limit / lower limit، «نهاية عليا» = upper limit، «نهاية صغرى» = minimum، «نهاية كبرى» = maximum، «نهاية منتظمة» = uniform limit"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "شبكة اشتقاقية واسعة تؤكد أن «نهاية» هي الأساس المصطلحي الثابت في الرياضيات العربية"

    - lemma: "حد رياضي"
      contradicts:
        - text: "«حدّ» = limit (بدون وصف «رياضي») و«حدّ» = bound و«حدّ» = term — ثلاثة مداخل منفصلة في نفس المعجم"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "المركب «حد رياضي» غير مسجل في أي معجم متخصص؛ المعاجم تُدرج «حدّ» مجرداً"
      expands:
        - text: "«الحدّ: الحاجِزُ بينَ شَيْئَيْنِ، ومُنْتَهى الشيءِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الأصل اللغوي يدعم استعمال «حدّ» بمعنى المنتهى لكن بدون وصف «رياضي»"

    - lemma: "نُقْطَة تَرَاكُم"
      confirm:
        - text: "«نقطة تراكم» = accumulation point"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«نقطة تراكم» = point of accumulation"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«نقطة التراكُم» = accumulation point"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"

    - lemma: "حَدّ"
      confirm:
        - text: "«حدّ» = limit"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«الحدّ: [...] وعند المهندسين نهاية المقدار وهو الخطّ والسطح والجسم التعليمي ويسمّى طرفا أيضا»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(5) النهاية؛ الحدّ (ر)» = limit"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«حدّ» = bound و«حدّ» = term — مداخل منفصلة في نفس المعجم"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "«حدّ» مشترك لفظي شديد في الاصطلاح الرياضي؛ يُطلق على term وbound وlimit"
      expands:
        - text: "«الحَدُّ: الحاجِزُ بينَ الشَّيْئَيْنِ، ومُنْتَهى الشيءِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الدلالة اللغوية الأصلية (المنتهى) تدعم الاستعمال الرياضي"
        - text: "«الحدُّ: الحاجز بين الشيئين الذي يمنع اختلاط أحدهما بالآخر [...] وحد الشيء الوصف المحيط بمعناه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "دلالة المنع والفصل تُغاير دلالة النهاية (القيمة المقصودة)"

    - lemma: "غَايَة"
      confirm:
        - text: "«الْغَايَة: النِّهَايَة وَالْآخر. فغاية كل شَيْء نهايته وَآخره. والراية»"
          source: "المعجم الوسيط"
        - text: "«الغَايَة: مَا يكون مؤثرا فِي مؤثرية الشَّيْء»"
          source: "معجم مقاليد العلوم للسيوطي"
      contradicts:
        - text: "لا يوجد أي مدخل في المعاجم الرياضية المتخصصة يستعمل «غاية» بمعنى limit"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "«غاية» لفظ عام يدل على النهاية والمقصد، لكنه غير مسكوك اصطلاحاً في الرياضيات"


