stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان 'خاصية' و'ميزة الجهاز' خاليتان من التشكيل الكامل."
      - "التعريف العربي الحالي يحتوي على كلمة 'خاصية' ذاتها التي هي إحدى اللمات المعرَّفة، مما يُفضي إلى دوران جزئي."
      - "التعريف يكرر فعل 'تقاس' مضمناً في 'قابلة للقياس' ثم 'تقاس في ظل ظروف'، مما يجعله أقل إحكاماً."
      - "ضبط لمة 'ميزة' يحتاج تحقيقاً: مَيزة أم مِيزة؟ معجم الصواب يرجّح الكسر."
    observations: >
      المجموعة تمثّل مفهوماً تقنياً هندسياً/فيزيائياً راسخاً في الأدبيات العربية المتخصصة: «خاصية الجهاز» أو «مميزاته» كما يرد في المعاجم الموحدة
      ALECSO ومعاييرها. المصطلح المحوري هو «خاصية» (جذر خصص) المستخدم في الفيزياء والكيمياء والكهرباء. أما «ميزة الجهاز» فتركيب إضافي
      يستحضر بُعد التمييز والتفريق (جذر مز/ميز). المفهوم محدود بـ«ظروف تشغيل مضبوطة»، وهذا الشرط ضروري ليُميَّز عن «الخاصية» بمعناها العام.

  blind_candidates:
    - lemma: "سِمَةٌ قِيَاسِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «سِمَة» (جذر وسم، بمعنى العلامة المميِّزة) و«قِيَاسِيَّة» (نسبة إلى القياس)
        للتعبير عن صفة يمكن قياسها كميًّا. «سمة» تُستخدم في المعاجم التقنية (تقانة المعلومات)
        لمعنى attribute/trait، و«قياسية» تُضيف دلالة قابلية القياس الكمّي.

    - lemma: "مُعَامَلُ الْجِهَازِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُعَامَل» (جذر عمل، وزن مُفَاعَل، يُستخدم في الهندسة للمعامِل/coefficient)
        و«الجهاز». يُفيد الجمع بين فكرة «المعامل الرقمي القابل للقياس» وارتباطه بجهاز بعينه،
        على غرار الاستخدام في معاجم الهندسة الكهربائية.

    - lemma: "مَعْلَمَة"
      generation_method: ishtiqaq
      justification: >
        مَفْعَلة من جذر «علم»، على القياس الاشتقاقي للأسماء الدالة على مواضع الحدث أو أدواته.
        المعلمة بمعنى parameter وردت في بعض الاستخدامات التقنية الحديثة للتعبير عن قيمة
        قابلة للقياس تُحدِّد سلوك نظام أو جهاز.

    - lemma: "مَقِيسَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من «قاس يقيس» على وزن مَفْعِلَة للدلالة على «ما يُقاس» أو «الشيء المقيس».
        يُجسّد الوصف الوارد في التعريف «قابلة للقياس» في صيغة اسمية مشتقة مباشرة من الجذر قيس.


stage2_evidence:
  per_lemma:
    - lemma: "خاصية"
      confirm:
        - text: "«الخاصيّة: [في الانكليزية] Characteristic، property [في الفرنسية] Caractéristique، propriété. بإلحاق الياء تستعمل في الموضع الذي يكون السبب فيه مخفياً كقول الأطباء: هذا الدواء يعمل بالخاصية.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
        - text: "«خاصية» = characteristic"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (ALECSO 1989) — ARABTERM"
        - text: "«خاصية» = property"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ALECSO 1990) — ARABTERM"
        - text: "«خاصية» = characteristic"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ALECSO 1995) — ARABTERM"
        - text: "«خاصية» = characteristic"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"
        - text: "«خاصية التشبّع» = saturation characteristic; «خاصية قفز» = jumping characteristic; «خاصية مركبة» = composite characteristic"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"
        - text: "«خاصية» = Feature"
          source: "معجم البيانات والذكاء الاصطناعي (2024) — ARABTERM"
        - text: "«خصائص ( ميزات )» = characteristic; «خصائص حركية» = dynamic characteristic; «خصائص ساكنة» = static characteristic; «خصائص تحويل» = transfer characteristic"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"
      expands:
        - text: "«الخاصية: كلية مقولة على أفراد حقيقة واحدة فقط قولاً عرضياً سواء وُجد في جميع الأفراد... فخرج بفقط الجنسُ والعرضُ العام...»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
          addition: "يوضّح الاستخدام الفلسفي-المنطقي للمصطلح (خاصة كلية ذات طابع عرضي)، مما يدل على عمقه الاصطلاحي في التراث العربي."
        - text: "«الخاصيّة: نسبة إلى الخاصّة» وتعليق معجم الصواب: «يمكن تصحيح كلمة خاصّيّة بناءً على ورودها في الوسيط... وقد وردت في الأساسي على أنها مصدر صناعي لـ خاصّة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (hawramani)"
          addition: "يؤكد أن خاصّيّة مصدر صناعي مقبول على الرغم من أن الأصل الفصيح هو 'خاصّة'؛ المعجم الوسيط يوثّق صحتها."
        - text: "«الخاصّة الشعرية (في الفيزيقا): ظاهرة ارتفاع السوائل في بعض الأنابيب الشعرية وانخفاضها في البعض الآخر»"
          source: "المعجم الكبير (ocr)"
          addition: "يُظهر استخدام 'خاصية' (بالنسبة إلى خاصّة) في سياق الفيزياء الوصفي."

    - lemma: "ميزة الجهاز"
      confirm:
        - text: "«ميزة طيفية» = spectral characteristic"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (ALECSO 1989) — ARABTERM"
        - text: "«خاصية؛ ميزة» = characteristic"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"
        - text: "«مميزات ( خواص ) الاستمرار» = persistence characteristic; decay characteristic"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"
      expands:
        - text: "«مَيْزَة / مِيزَة السفر بالطائرة اقتصاد الوقت. الرأي: الأكثرون يرون أن الضبط الصحيح بكسر الميم لا بفتحها. ويمكن تصويبها بفتح الميم على أنها اسم مرة.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (hawramani)"
          addition: "يفيد أن الضبط الصحيح الكلاسيكي مِيزَة (بكسر الميم) وهو الوزن الفصيح؛ اللمة في AWN تحتاج تصحيح التشكيل."
        - text: "«الميزة: الميز» — والميز: التمييز والفرز"
          source: "المعجم الوسيط (hawramani)"
          addition: "يؤكد أن ميزة مشتقة من الميز بمعنى التمييز والتفريق، مما يجعل دلالتها في 'خاصية مميِّزة للجهاز' دقيقةً."

    - lemma: "سِمَةٌ قِيَاسِيَّة"
      expands:
        - text: "«سمة» بمعنى attribute — خاصية تعطى لملف أو مجلد... ومن بين هذه السمات: أرشفة، إخفاء، قراءة فقط."
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (ALECSO 2011) — ARABTERM"
          addition: "تدعم 'سمة' لمعنى attribute/trait في نطاق تقنية المعلومات، لكن التركيب 'سمة قياسية' غير موثَّق كوحدة معجمية ثابتة."
        - text: "«سِمَات» = characteristic (educational/computer techniques)"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ALECSO 1999) — ARABTERM"
          addition: "صيغة الجمع 'سمات' موثّقة لـ characteristic لكن المفرد المركّب 'سمة قياسية' لا يرد كمصطلح مسكوك."

    - lemma: "مُعَامَلُ الْجِهَازِ"
      contradicts:
        - text: "«معامل» = coefficient; modulus; operator; operand — في مجالات: المياه، الهندسة الكهربائية، الهندسة المدنية."
          source: "معاجم ALECSO المتعددة — ARABTERM"
          conflict: "معامل يدل على coefficient/operator/operand وليس على 'خاصية قابلة للقياس' بمعناها الوصفي؛ المدلول مختلف جوهرياً."

    - lemma: "مَعْلَمَة"
      contradicts:
        - text: "«معلمة» = school-dame"
          source: "مسرد التربية — ARABTERM"
          conflict: "معلمة (بمعنى parameter) غير موثّقة في قاعدة البيانات؛ المدخل الوحيد يُحيل إلى مُعَلِّمَة (المعلمة الأنثى) لا إلى المعلمة بمعنى parameter."

    - lemma: "مَقِيسَة"
      expands:
        - text: "«مَقِيس، قابل للقياس» = commensurable (mathematics)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ALECSO 1990) — ARABTERM"
          addition: "مقيس موثَّق بمعنى commensurable (الكمية المقيسة بالقياس)، لكن مَقِيسَة كاسم لـ«خاصية قابلة للقياس لجهاز» غير موثَّقة."


stage3_analysis:
  per_lemma:
    - lemma: "خاصية"
      decision: confirmed
      decision_reason: >
        اللمة راسخة في المعجمية التقنية العربية لترجمة characteristic/property في الفيزياء والكهرباء والرياضيات
        والكيمياء وغيرها. موثَّقة في موسوعة الكهرباء IEC 60050 ومعاجم ALECSO المتعددة. جذرها خصص
        يحمل دلالة التخصيص والتميّز الذاتي. تحتاج تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الأكثر شيوعاً وعمومًا في الاستخدام التقني؛ تُحيل إلى الصفة الكامنة في الشيء بذاته
        (سواء أكانت مرتبطة بجهاز أم بمادة أم بظاهرة)، وتستخدم مفردةً دون قيد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاصِّيَّة"

    - lemma: "ميزة الجهاز"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي 'ميزة الجهاز' مقبول كمقابل للمصطلح الإنجليزي المركّب device characteristic:
        'ميزة' موثَّقة لـ characteristic في معاجم الفيزياء وموسوعة الكهرباء IEC 60050 بجانب 'خاصية'،
        والتركيب يُقيِّد المفهوم بالجهاز. يحتاج تصحيح ضبط الميم (كسر لا فتح) وإضافة التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على بُعد التمييز والتفريق (من مَيَّزَ = to distinguish)؛ التركيب الإضافي يُقيِّد
        الخاصية بالجهاز بعينه ويُضفي دلالة أن هذه الخاصية هي ما يُميِّز هذا الجهاز
        عن غيره تحت ظروف قياس محددة، بينما 'خاصية' تبقى أعمّ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيزَةُ الْجِهَازِ"

    - lemma: "سِمَةٌ قِيَاسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        'سمة' موثَّقة لـ attribute/trait لكن التركيب 'سمة قياسية' لا يرد كوحدة معجمية ثابتة مسكوكة
        في المعاجم التقنية. يفشل اختبار السكّ: يمكن إبدال 'قياسية' بـ'قابلة للقياس' أو 'رقمية'
        وإبدال 'سمة' بـ'صفة' أو 'خاصية' مع بقاء الوصف صالحاً، مما يُثبت أنه وصف حر لا مصطلح.

    - lemma: "مُعَامَلُ الْجِهَازِ"
      source: stage1
      decision: removed
      decision_reason: >
        معامل يدل في المعاجم التقنية على coefficient/modulus/operator/operand، وهي مفاهيم مختلفة
        عن 'خاصية قابلة للقياس'. الاستبدال الدلالي غير ممكن دون تشويه المعنى.

    - lemma: "مَعْلَمَة"
      source: stage1
      decision: removed
      decision_reason: >
        معلمة غير موثَّقة بمعنى parameter في قاعدة البيانات؛ المدخل الوحيد يُحيل إلى
        مُعَلِّمَة (المدرّسة الأنثى). استخدام معلمة بمعنى parameter موجود في بعض الكتابات الحديثة
        لكنه غير موحَّد ولا موثَّق في المعاجم الموحدة ALECSO.

    - lemma: "مَقِيسَة"
      source: stage1
      decision: removed
      decision_reason: >
        مقيسة غير موثَّقة كاسم مستقل يُعبِّر عن 'خاصية الجهاز'. مقيس في المعاجم = commensurable
        (رياضيات)، وليس له استخدام تقني راسخ بالمعنى المطلوب. الاشتقاق صحيح قياسياً لكنه
        لم يُسكَّ بعدُ كمصطلح فني معياري.


