stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يترجم كلمة (adult) حرفيًا إلى (شخص بالغ)، وهو ما لا يناسب السياق البيولوجي للحيوانات، والصواب (حيوان بالغ) أو (حشرة بالغة) أو (طور البلوغ)."
      - "استخدام كلمة (مسخ) يشيع أكثر في الدلالة على التحول إلى صورة مشوهة أو قبيحة، بينما (تحوّل) هو المصطلح العلمي الأدق والأكثر حيادية في علم الأحياء."
    observations: "المجموعة الترادفية تعبر عن المفهوم البيولوجي (Metamorphosis) الذي يشير إلى التغير الجذري في شكل الحيوان من مرحلة اليرقة إلى مرحلة البلوغ، كما يحدث في الحشرات والبرمائيات. اللمّة 'تَحَوُّل' هي الأدق."
  blind_candidates:
    - lemma: "تَحَوُّل"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل 'تحوّل'، وهو المصطلح العلمي الشائع في علم الأحياء للتعبير عن تغير الطور."
    - lemma: "اِسْتِحَالَة"
      generation_method: ishtiqaq
      justification: "مصدر مشتق من 'استحال'، يُستخدم في السياقات الطبية والعلمية للدلالة على التحول والتغير من حالة إلى أخرى."
    - lemma: "مَسْخ"
      generation_method: majaz
      justification: "استخدام لمعنى تغير الخلقة، ورغم دلالته التراثية السلبية، استُخدم في بعض المعاجم كمرادف للتحول."
    - lemma: "اِنْسِلاخ"
      generation_method: majaz
      justification: "استعارة من عملية تخلص الحيوان من جلده (Ecdysis) التي تصاحب عملية التحول أحياناً."

stage2_evidence:
  per_lemma:
    - lemma: "تحول"
      confirm:
        - text: "في علم الأحياءِ metamorphosis: ١-في النَّبات: تغيَّرُ عُضْوٍ في شَكْلِهِ إلى شَكْلِ عُضْوٍ آخَرَ كتَغيُّرِ السَّاقِ إلى شَكْلِ الوَرَقَةِ أو السَّداةِ إلى شَكْلِ البَتَلَةِ. ٢-في الحيوان: تَغَيُّرُ الكائِنِ من طَوْرٍ إلى طَوْرٍ كما في الحَشَراتِ والبَرْمائِيَّاتِ."
          source: "المعجم الكبير"
    - lemma: "مسخ"
      confirm:
        - text: "«أ» المَسْخ؛ الانمساخ. «ب» التحوُّل؛ الاستحالة: تغيّر صارخ في المظهر أو الصفة أو الظروف (2) الانسلاخ: تحوُّلات الحيوانات الدنيا منذ ولادتها حتى بلوغها سنّ النّضج."
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "المَسْخُ: تَحْوِيلُ صُورَةٍ إِلَى مَا هُوَ أَقْبَحُ مِنْهَا، وَبَابُهُ قَطَعَ يُقَالُ: (مَسَخَهُ) اللَّهُ قِرْدًا."
          source: "مختار الصحاح للرازي"
          conflict: "المصطلح تراثياً يحمل دلالة سلبية تتمثل في التشويه والتغيير إلى الأقبح، وليس التغير البيولوجي الطبيعي."
    - lemma: "استحالة"
      confirm:
        - text: "(في العُلُوم الطبيعيّة) transformation: تغيَّرُ المادةِ من حالةٍ إلى أخرى"
          source: "المعجم الكبير"
        - text: "اسْتِحَالَة (metamorphosis)"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "انسلاخ"
      confirm:
        - text: "عملية تحدث في الحشرات وغيرها من الحيوانات أثناء النمو، وفيها يتخلص الحيوان من جلده الخارجي لتحل محله طبقة مرنة تسمح بالنمو والتشكيل وتتصلب فيما بعد"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      contradicts:
        - text: "عملية تحدث في الحشرات وغيرها من الحيوانات أثناء النمو، وفيها يتخلص الحيوان من جلده الخارجي"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "الانسلاخ (Ecdysis) يقتصر على التخلص من الهيكل الخارجي، وهو مجرد جزء من عملية التحول، ولا يشمل التحول الشكلي الكامل."

stage3_analysis:
  per_lemma:
    - lemma: "تَحَوُّل"
      decision: confirmed
      decision_reason: "هو المصطلح البيولوجي المعتمد في المعاجم العلمية واللغوية المعاصرة للتعبير عن metamorphosis بدقة وموضوعية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحَوُّل"
    - lemma: "مَسْخ"
      decision: confirmed
      decision_reason: "رغم دلالته التراثية التي ترتبط بالتشويه أو التحول إلى الأسوأ، فإنه موثق في بعض المعاجم الحديثة كالمورد بوصفه مرادفاً للتحول (metamorphosis)، لذا يُبقى عليه."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَسْخ"
    - lemma: "اِسْتِحَالَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد في المعاجم الطبية واللغوية المعاصرة كمرادف دقيق لـ metamorphosis."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اِسْتِحَالَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13536083-n"}
    - lemma: "اِنْسِلاخ"
      source: stage1
      decision: removed
      decision_reason: "الانسلاخ يشير علمياً إلى التخلص من الهيكل الخارجي (ecdysis)، وهو يختلف بيولوجياً عن عملية التحول الكامل (metamorphosis)."
      evidence_assessment:
        case: contradicts_only

