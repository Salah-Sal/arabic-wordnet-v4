# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-06042282-n | ILI: i68473 | POS: n
# covariation — التباين المترابط (في الإحصاء)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تباين مشترك، تغاير مشترك) خاليتان من التشكيل الكامل"
      - "التعريف العربي الحالي صيغةٌ وصفية ركيكة لا تستوفي شروط التعريف المعجمي (جنس + فصل)"
      - "استخدام كلمة «المترابط» في التعريف يخالف مصطلح «المشترك» المُعتمد في اللمّتين ذاتهما"
      - "الفرق الدلالي بين اللمّتين (تباين/تغاير) غير موثَّق ولا مبرَّر"
      - "المجموعة قد تخلط بين covariation (الظاهرة) وcovariance (المقياس)؛ اللمّات أقرب إلى covariance"
    observations: >
      المجموعة الترادفية تُمثّل مفهوماً إحصائياً حديثاً هو التغيُّر المشترك بين متغيرين
      عشوائيين. اللمّتان الموجودتان مركَّبتان وصفيّتان تشتركان في الجزء الثاني (مشترك)
      وتختلفان في الجزء الأول (تباين/تغاير). التباين أكثر انتشاراً في السياق الرياضي
      والإحصائي الرسمي والطبي، بينما التغاير أكثر حضوراً في السياقات التعليمية
      والاجتماعية. كلتا اللمّتين بحاجة إلى تشكيل كامل. التعريف الحالي يستدعي إعادة
      صياغة بأسلوب المعجم الوسيط مع توفير الجنس القريب والفصل النوعي.

  blind_candidates:
    - lemma: "تَغَايُر مُقْتَرِن"
      generation_method: tarkib
      justification: >
        تركيب وصفي من تغاير + مقترن (من ق-ر-ن: مُلازِم ومُرتبط). يُعبّر عن التغاير
        المرتبط بمتغير آخر، مقابل مباشر لـ"correlated variation". غير أن «مقترن»
        قد يُوهم بمعنى الاقتران الرياضي (function) لا الترابط الإحصائي.

    - lemma: "تَقَارُن"
      generation_method: ishtiqaq
      justification: >
        مصدر تفاعل من ق-ر-ن على وزن تَفَاعُل، يفيد التلازم المتبادل (المعجم الوسيط:
        تقارن الشيئان: تلازما). لفظة أحادية تُعبّر عن جوهر المفهوم. تخشى أن تكون
        محتلّة بمعنى آخر في تخصصات مجاورة.

    - lemma: "تَبَايُن مُشْتَرَك"
      generation_method: tarkib
      justification: >
        تركيب وصفي من تباين (مصدر تفاعل ب-ي-ن) + مشترك (اسم مفعول VIII من ش-ر-ك:
        المتقاسَم). يُعبّر مباشرةً عن التباين الذي يشترك فيه متغيران. المصطلح منتشر
        في المعاجم العلمية العربية للإحصاء.

    - lemma: "تَبَايُن تَعَاضُدِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من تباين + تعاضدي (نسبة إلى تعاضد من ع-ض-د: التساند المتبادل).
        يُبرز الطابع التبادلي للتباين المشترك. غير أن «تعاضدي» نادر في الأدبيات
        الإحصائية العربية ويُخشى غياب توثيقه المعجمي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تباين مشترك"
      confirm:
        - text: "«تبايُن مُشْتَرِك [إحصاء] — covariance»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "«تباين مشترك — covariance»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ARABTERM"
      expands:
        - text: "«تغاير (ال...) — مقياس لما بين متغيرين عشوائيين (أو إشارتين) من تغاير مشترك.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: >
            يستخدم هذا المعجم عبارة «تغاير مشترك» في تعريف مصطلح التغاير الإحصائي،
            مما يُثبت أن كلا المصطلحين في التداول المعجمي الرسمي.

    - lemma: "تغاير مشترك"
      confirm:
        - text: "«تغاير (ال...) — مقياس لما بين متغيرين عشوائيين (أو إشارتين) من تغاير مشترك. — covariance»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      expands:
        - text: "«تحليل التغاير — analysis of covariance»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: >
            يؤكد أن جذر «التغاير» راسخٌ في المصطلحية الإحصائية التعليمية العربية،
            وأن المصطلحات المشتقة منه كـ«تحليل التغاير» موثَّقة في مراجع ألكسو.
        - text: "«تغاير — شذوذ في التركيب أو الترتيب أو طريقة التكوين. — heterology»"
          source: "معجم المصطلحات الطبية ج.3 (1997) — ARABTERM"
          addition: >
            في السياق الطبي يُستخدم «التغاير» بمعنى heterology (الشذوذ التركيبي)،
            وهو معنى مختلف تماماً عن المعنى الإحصائي. يستوجب الحرص على توثيق المجال.

    - lemma: "تَغَايُر مُقْتَرِن"
      evidence_status: "no_material_found"

    - lemma: "تَقَارُن"
      contradicts:
        - text: "«تقارُن — عملية تزاوج بين صبغيين متماثلين يبدأ من نهايتهما الأوليتين ويستمر على طولهما... — pairing»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — ARABTERM"
          conflict: >
            المصطلح محتلٌّ بمعنى «تزاوج الصبغيات» (pairing/synapsis) في علم الوراثة؛
            استخدامه للتعبير عن covariation سيُحدث اشتراكاً لفظياً ضاراً.
        - text: "«تقارُن — coupling»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          conflict: "مستخدم بمعنى coupling في المعجم الطبي، وليس للتباين الإحصائي المشترك."
      expands:
        - text: "«تقارن الشيئان: تلازما»"
          source: "المعجم الوسيط"
          addition: >
            المعنى اللغوي الأصل (التلازم) قريب من فكرة الترابط الإحصائي، غير أن
            المعنى الاصطلاحي المستقر في الوراثة والطب يحول دون استخدامه لـcovariation.

    - lemma: "تَبَايُن تَعَاضُدِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تباين مشترك"
      decision: confirmed
      decision_reason: >
        مؤكَّد بمصدرين مستقلّين من ARABTERM (المعجم الطبي الموحد 2009 ومعجم الوراثة 2009)
        يترجمانه بـcovariance. المصطلح راسخٌ في المعجمية العربية العلمية الحديثة،
        وتركيبه الوصفي (اسم + صفة) شائعٌ وقياسي. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركّز على الجانب الكمي للمفهوم (القيمة الإحصائية للتشتت المشترك)؛ أكثر
        استخداماً في السياقات الرياضية والطبية والوراثية. أقرب دلالةً إلى covariance
        (المقياس العددي) منه إلى covariation (الظاهرة العامة).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبَايُن مُشْتَرَك"

    - lemma: "تغاير مشترك"
      decision: confirmed
      decision_reason: >
        مؤكَّد بوروده صراحةً في تعريف «تغاير» الإحصائي في مسرد التربية لألكسو،
        ومدعومٌ باستخدام ARABTERM لجذره في مصطلحات إحصائية متعددة (تحليل التغاير).
        يُضيف تنويعاً اشتقاقياً مفيداً يوافق الإنجليزي الدقيق للمجموعة (covariation).
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركّز على الجانب الوصفي والديناميكي (ظاهرة التغيُّر المتبادل المنتظم)؛ أكثر
        تداولاً في السياقات التعليمية والاجتماعية والإنسانية. أقرب إلى covariation
        (الظاهرة) ويوافق الإنجليزي الدقيق للمجموعة أكثر من «تباين مشترك».
        التحذير: في السياق الطبي قد يُوهم «التغاير» بـheterology، لذا يُستحسن
        إيراده مع تحديد المجال «في الإحصاء».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَغَايُر مُشْتَرَك"

    - lemma: "تَغَايُر مُقْتَرِن"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية توثّق هذا التركيب بمعنى covariation في قواعد البيانات المتاحة.
        فضلاً عن ذلك قد يُوهم «مقترن» بمعنى الاقتران الرياضي (mathematical function)
        أو الاقتران الكيميائي، مما يُولّد لبساً مصطلحياً. المجموعة تكتفي بالصيغتين
        الموجودتين الموثَّقتين في مصادر ARABTERM المتعددة.

    - lemma: "تَقَارُن"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح محتلٌّ بمعنى مختلف ومستقر في علم الوراثة (pairing/synapsis للصبغيات)
        وفي الطب (coupling)، وهو ما أثبتته الأدلة المعجمية من ARABTERM بوضوح.
        استخدامه للتعبير عن التباين الإحصائي المشترك سيُحدث اشتراكاً لفظياً ضاراً
        بالمصطلحية العلمية.

    - lemma: "تَبَايُن تَعَاضُدِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية لهذا التركيب في قواعد البيانات المتاحة. النعت «تعاضدي» نادر
        الاستخدام في المصطلحية الإحصائية العربية، وغيابه من ARABTERM يُضعف قبوله
        في المجتمع العلمي العربي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "(في الإحصاء) التباين المترابط"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي جملةٌ وصفية مقتضبة لا تستوفي شروط التعريف المعجمي؛ تفتقر
        إلى الفصل النوعي الذي يُبيّن آلية العلاقة بين المتغيرين وطبيعتها (موجبة/سالبة).
        كذلك يستخدم «المترابط» بينما المصطلح المعتمد في اللمّتين هو «المشترك».
        يستوجب إعادة صياغة بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: >
          (في الإحصاء) ظاهرةُ التغيُّر المشترك المنتظم لمتغيرين عشوائيين؛ إذ يقترن
          تغيُّرُ أحدهما بتغيُّر مواكبٍ في الآخر، فيكون التغاير موجبًا حين يسيران
          في اتجاه واحد، وسالبًا حين يتعاكسان.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مصطلح إحصائي يصف العلاقة الكمية بين تغيُّرات متغيرين عشوائيين معًا؛ وهو
          الأساس الذي يُبنى عليه معامل الارتباط لبيرسون ومحور الانحدار الخطي.
          يُقاس بالتباين المشترك الذي يمثّل المتوسط الحسابي لحاصل ضرب انحرافات
          كلا المتغيرين عن وسطيهما الحسابيين.
