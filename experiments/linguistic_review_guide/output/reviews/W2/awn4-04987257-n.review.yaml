# المراجع: أي خاصية تكتشف بواسطة الجهاز الشمي
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «أريج» تعني تحديداً الرائحة الطيبة العطرة، وهي أخص من «أي خاصية شمية» الذي يشمل الكريهة أيضاً"
      - "لمّة «شم» تُشير إلى فعل الإدراك الشمي (حاسة الشم / olfaction) لا إلى الخاصية المُدرَكة، وهو خلط بين المفهوم وأداة إدراكه"
      - "جميع اللمّات الثلاث مكتوبة بدون تشكيل"
      - "التعريف العربي الحالي صياغته ركيكة — «تكتشف بواسطة الجهاز الشمي» ترجمة آلية غير عربية الأسلوب"
    observations: >
      المجموعة تمثل المفهوم الأوسع لـ«الخاصية الشمية» وهو كل ما تُدركه حاسة الشم من أوصاف الأشياء
      سواء أكانت طيبة أم كريهة. «رائحة» هي اللمّة المحورية الأنسب لأنها مطلقة لا تتخصص بالطيب دون الكريه،
      وقد جاء في المعجم الكبير تعريفها: «عَرَضٌ يُدْرَك بحاسَّة الشَّمِّ»، وهو شبه مطابق لمفهوم المجموعة.
      أما «أريج» فتقابل lemma «aroma» الإنجليزية وتختص بالطيب. وأما «شم» فانتماؤه إلى مجموعة الحاسة
      والجهاز الشمي لا إلى مجموعة الخاصية الشمية.
  blind_candidates:
    - lemma: "فَوْح"
      generation_method: majaz
      justification: "اسم مصدر من فَاحَ يَفُوح، يعني انتشار الرائحة وانبعاثها من المادة؛ تُحيله دلالته إلى الخاصية الشمية من حيث هي ما يُفوح من الشيء فيُدرَك بالأنف"
    - lemma: "شَمِيم"
      generation_method: ishtiqaq
      justification: "من الجذر شمم على وزن فَعِيل، يعني «ما يُشَمّ» من الأشياء؛ المعنى الاشتقاقي يدل مباشرة على الخاصية القابلة للشم"
    - lemma: "نَفَحَة"
      generation_method: majaz
      justification: "النفحة وهبة من الرائحة تنبعث لحظةً وتُحَسّ؛ وقد وردت في التنزيل مرتبطة بالعذاب مما يدل على شمولها لغير الطيب، وهي قريبة من مفهوم «أي خاصية شمية» بحيث تدل على ما يُصيب حاسة الشم"
    - lemma: "شَذَا"
      generation_method: majaz
      justification: "الشذا في الأصل حدة الرائحة وقوة ذكائها؛ وهو من الألفاظ المنتمية إلى الحقل الدلالي الشمي، استُحضر بالمجاز ليدل على الخاصية الشمية المُدركة"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "أريج"
      confirm:
        - text: "«ريح العطر الطيب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الرِّيحُ الطَّيِّبَة»"
          source: "المعجم الكبير"
        - text: "translation_en: fragrance | domain: Biology"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM"
      contradicts:
        - text: "«ريح العطر الطيب» / «الرِّيحُ الطَّيِّبَة»"
          source: "المعجم الكبير، موسوعة قابوس"
          conflict: "جميع المصادر تقصر أريج على الرائحة الطيبة تحديداً، والمجموعة الترادفية تشمل أي خاصية شمية بما فيها الكريهة"

    - lemma: "رائحة"
      confirm:
        - text: "«النسيمُ طيِّباً أو نَتْناً»"
          source: "المعجم الوسيط"
        - text: "«عَرَضٌ يُدْرَك بحاسَّة الشَّمِّ. وهو ما يتطاير من جزيئات الأجسام, وتُحِسُّ به الأغشية المخاطية لأعضاء الشَّمِّ فَيُسْتَدلُّ بها عليه. وهى: النَّسِيمُ طَيِّبًا كان أو نَتْنًا»"
          source: "المعجم الكبير"
        - text: "«صفة للمواد يمكن تمييزها بواسطة حاسة الشَّم»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM"
        - text: "translation_en: odor / odour / smell — في مجالات: الكيمياء، الجيولوجيا، الأحياء، الطاقة المتجددة، الطب البيطري"
          source: "ARABTERM — معاجم موحدة متعددة المجالات"

    - lemma: "شم"
      contradicts:
        - text: "«إدراك الروائح»"
          source: "المعجم الوسيط"
          conflict: "يدل على فعل الإدراك الشمي (الحاسة وعملها) لا على الخاصية الشمية ذاتها"
        - text: "translation_en: olfaction | domain: The Unified Medical Dictionary"
          source: "المعجم الطبي الموحد (2009) — ARABTERM (entry_id 618449)"
          conflict: "الترجمة المقابلة olfaction وosmesis تخص حاسة الشم أو فعلها، لا الخاصية الشمية"
        - text: "«قوة مودعة في الزائدتين النابتتين في مقدم الدماغ الشبيهتين بحلمتي الثدي، بها تدرك الروائح بطريق وصول الهواء المتكيف ذي الرائحة إلى الخيشوم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "يدل على قوة الشم (الجهاز) لا على الرائحة (الخاصية)"

    - lemma: "فَوْح"
      expands:
        - text: "«(الفَوْح) انتشار الرَّائِحَة، وفوح الحرِّ: شدَّة سطوعه»"
          source: "المعجم الوسيط"
          addition: "الفوح يصف عملية انتشار/انبعاث الرائحة لا الرائحة ذاتها بوصفها خاصية ثابتة للمادة"
        - text: "«الفَوْحُ: انتشار الرائحة. فوحُ الحرِّ: شدةُ سطوعه»"
          source: "المعجم الوسيط (OCR)"
          addition: "تأكيد بأن الفوح حدث/فعل لا خاصية"

    - lemma: "شَمِيم"
      confirm:
        - text: "«(الشميم) ما يشم والمرتفع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الشَّمِيمُ: ما يُشَمُّ — الرائحةُ الطيِّبةُ — الشَّيءُ المرتفعُ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الرائحةُ الطيِّبةُ — الشَّيءُ المرتفعُ»"
          source: "المعجم الكبير"
          conflict: "المعنى الثاني يخص الرائحة الطيبة حصراً، ويشارك المعنى الثالث (المرتفع) فيُحدث اشتراكاً لفظياً يُضعفه"

    - lemma: "نَفَحَة"
      confirm:
        - text: "«النَّفْحَةُ: الطِّيب الذي ترتاح له النَّفْس — أصابتنا نفحة من سموم: حَرٌّ وغَمٌّ وكرب — العَطِيَّةُ»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الطِّيب الذي ترتاح له النَّفْس»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية التعيشية هي الرائحة الطيبة أو العطاء، لا الخاصية الشمية العامة"

    - lemma: "شَذَا"
      contradicts:
        - text: "«حِدَّةُ ذَكَاءِ الرَّائِحَة» — والشذا: الأذى والشر — والشذاة: ذباب أزرق يقع على الدواب"
          source: "مختار الصحاح، الصحاح، لسان العرب"
          conflict: "الشذا يعني شدة/حدة الرائحة خاصةً (ليس أي خاصية شمية)، وتعدد معانيه المتباعدة يُفسد صلاحيته مصطلحاً"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "أريج"
      decision: confirmed
      decision_reason: >
        أريج تعني الريح الطيبة العطرة وتقابل lemma «aroma» في المجموعة الإنجليزية. رغم أنها أخص من
        «أي خاصية شمية»، فإن WordNet يُدرج المصطلحات ذات التلوين الإيجابي (كـaroma) ضمن هذه المجموعة.
        فحص الاشتقاق: أريج من جذر أرج — وأرج وأريج رائحة الطيب كما في مقاييس اللغة — الوزن فَعِيل يناسب
        الصفة الدالة على القابلية. فحص التحيّز الاقتراضي: كلمة عربية أصيلة لا إشكال فيها.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختص بالرائحة الطيبة العطرة الزكية، ولا يُطلق على الكريهة؛ يقابل «aroma» لا «odor»"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَرِيج"

    - lemma: "رائحة"
      decision: confirmed
      decision_reason: >
        اللمّة المحورية للمجموعة؛ تعمّ الطيب والكريه كما نصّ المعجم الوسيط: «النسيمُ طيِّباً أو نَتْناً».
        المعجم الكبير يُعرِّفها: «عَرَضٌ يُدْرَك بحاسَّة الشَّمِّ» — وهو شبه مطابق للتعريف الإنجليزي
        "any property detected by the olfactory system". موثّقة في ARABTERM عبر مجالات متعددة
        بالترجمات: odor/odour/smell. الجذر روح، وزن فَاعِلَة — مناسب للصفة الدالة على الخاصية.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المطلق الجامع لأي خاصية شمية سواء طيبة أم كريهة؛ اللمّة المحورية للمجموعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَائِحَة"

    - lemma: "شم"
      decision: removed
      decision_reason: >
        «شم» في المعاجم يدل على إدراك الروائح أي فعل الحاسة الشمية، لا على الخاصية الشمية المُدرَكة.
        ARABTERM يُترجمه بـ«olfaction» و«osmesis» و«smelling» وهي مصطلحات تخص الحاسة وفعلها
        لا الخاصية. والمعاجم الفلسفية (المناوي، الجرجاني) تُعرّفه بـ«قوة مودعة في مقدم الدماغ»،
        أي الجهاز لا المحتوى. انتماؤه الدلالي إلى مجموعة حاسة الشم/الجهاز الشمي لا إلى مجموعة
        الخاصية الشمية. فحص الاستبدال: لا يمكن استبدال «شم» بـ«رائحة» في جملة «فاحت رائحة المسك» فيقال
        «فاح شم المسك» — غير مقبول.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فَوْح"
      source: stage1
      decision: removed
      decision_reason: >
        الفوح يعني انتشار الرائحة وانبعاثها (فعل/حدث)، لا الخاصية الشمية كمفهوم مجرد ثابت.
        اختبار السك: «فاح الفوح» دوري لا يصح. اختبار الاستبدال: «رائحة المسك» ≠ «فوح المسك»
        لأن الأول وصف والثاني حدث.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "شَمِيم"
      source: stage1
      decision: removed
      decision_reason: >
        شميم يعني «ما يُشمّ» وهي دلالة قريبة، لكن التعريف الأكثر شيوعاً يخص «الرائحة الطيبة»
        لا «أي خاصية شمية»، فضلاً عن أن وزن فَعِيل يُستعمل في المعاجم أكثر للمرتفع/العالي
        مما يُحدث اشتراكاً لفظياً يُضعفه. بوابة الجودة: تخفق في «الاطّراد وشيوع الفصيح»
        لصالح رائحة الأرسخ توثيقاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "نَفَحَة"
      source: stage1
      decision: removed
      decision_reason: >
        النفحة تدل على وهبة لطيفة أو مسّة خفيفة من الرائحة أو العطاء، وهي أخص وأضيق من
        «أي خاصية شمية». اختبار السك: يصح قول «نفحة من المسك» لكن لا يصح «نفحة كريهة» إلا
        في الاستعمال الموسّع. لا تعكس الشمولية التي يقتضيها المفهوم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "شَذَا"
      source: stage1
      decision: removed
      decision_reason: >
        الشذا يدل على حدة الرائحة وقوتها لا على أي خاصية شمية. يخفق في فحص اللهجية الاصطلاحية
        إذ تعددت معانيه تعدداً متبايناً (حدة الرائحة / ذباب / أذى / مسك). بوابة الجودة:
        يخفق في «إيثار الاشتقاقية» و«الملاءمة» للدلالة العامة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


