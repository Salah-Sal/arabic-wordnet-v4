# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-15314760-n — lead time
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«المهلة الزمنية» تعبير وصفي عام غير مسكوك في المعاجم المتخصصة؛ «المهلة» تدل على التأخير والإمهال لا على مدة الإنتاج"
      - "«فترة التسليم» تركيب إضافي يدل على مدة التوريد لا على الفاصل الزمني الكامل من بدء الإنتاج حتى إتمامه"
      - "المجموعة تفتقر إلى المصطلح التقني المعياري «زمن السبق» المثبت في معاجم أليكسو"
    observations: "المفهوم المقصود هو الفاصل الزمني بين بدء عملية الإنتاج وإتمامها، وهو مصطلح صناعي-لوجستي دقيق. اللمّتان الموجودتان تميلان إلى التعميم والوصف الحر أكثر من التسكيك الاصطلاحي. المصطلح الإنجليزي lead time له مقابلات عربية معيارية في معاجم النقل والتجارة ينبغي تمثيلها."
  blind_candidates:
    - lemma: "زَمَنُ السَّبْقِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «زمن» (وقت) و«سبق» (تقدُّم) على نمط المصطلحات التقنية العربية؛ يعكس فكرة الزمن اللازم للتقدم في سلسلة الإنتاج قبل التسليم"
    - lemma: "أَجَلُ التَّسْلِيمِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «أجل» (مدة محددة) و«التسليم»؛ يدل على المدة المحددة حتى موعد التسليم، وهو قريب من مفهوم lead time"
    - lemma: "مُدَّةُ الإِنْجَازِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «مدة» (مقدار من الزمان) و«الإنجاز» (الإتمام)؛ يعبّر عن الفترة اللازمة لإتمام العملية الإنتاجية"
    - lemma: "أَمَدُ الإِنْتَاجِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «أمد» (غاية زمنية) و«الإنتاج»؛ يشير إلى المدى الزمني للعملية الإنتاجية من بدايتها إلى نهايتها"


stage2_evidence:
  per_lemma:
    - lemma: "المُهْلَةُ الزَّمَنِيَّةُ"
      expands:
        - text: "«المُهْلَة: التُّؤَدَة والرِّفْق. يقال: خذ المُهْلَة في أمرك. أخذ عليه المُهْلَة: تقدُّمُهُ في سِنٍّ أو أدب. بقيَّةُ جمرٍ في الرَّماد»"
          source: "المعجم الوسيط"
          addition: "المهلة في أصلها تعني التؤدة والرفق والإمهال، لا الفاصل الزمني الإنتاجي"
        - text: "«مهلة — time limit»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "في الاصطلاح التجاري تعني الموعد النهائي لا مدة الإنتاج"
    - lemma: "فَتْرَةُ التَّسْلِيمِ"
      confirm:
        - text: "«فترة تسليم — delivery period، أو التوريد»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«الفَتْرَة: الضعف والانكسار. والمدة تقع بين زمنيْن أو نبيين»"
          source: "المعجم الوسيط"
          addition: "الفترة في أصلها تعني المدة الواقعة بين حقبتين، وهي مناسبة للدلالة الزمنية"
        - text: "«التسليم — delivery»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "التسليم مصطلح تجاري يدل على تسليم البضاعة"
    - lemma: "زَمَنُ السَّبْقِ"
      confirm:
        - text: "«زمن سبق — lead time: هو الزمن اللازم لتصنيع وإعداد الخامات حتى أخر يوم عمل محدد»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      expands:
        - text: "«إزاحة وقت الانتاج هو الفاصل الزمني اللازم لتصنيع أي جزء تابع للسلعة بمهلة تقل عن مهلة التسليم المذكورة»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "مصطلح مشتق «إزاحة وقت الإنتاج» يؤكد استعمال «زمن السبق» في المجال نفسه"
    - lemma: "أَجَلُ التَّسْلِيمِ"
      confirm:
        - text: "«أجلُ التسليم — lead time»"
          source: "مسرد الإعلام والتواصل، أليكسو"
        - text: "«أَجَلُ التسليم — delivery time»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "«أجل التسليم — term of delivery»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«أجلُ التسليم — term of delivery»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
    - lemma: "مُدَّةُ الإِنْجَازِ"
      expands:
        - text: "«المدة اللازمة لإنجاز المشروع — lead time of a project»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "المركب الأطول «المدة اللازمة لإنجاز المشروع» مستعمل لكنه أطول من المطلوب"
        - text: "«إزاحة وقت الانتاج/ مدة الانجاز — lead time displacement»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "«مدة الإنجاز» ترد ضمن مركبات أطول في السياق نفسه"
    - lemma: "أَمَدُ الإِنْتَاجِ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "المُهْلَةُ الزَّمَنِيَّةُ"
      decision: removed
      decision_reason: "«المهلة» تدل في أصلها على التؤدة والإمهال وفي الاصطلاح التجاري على الموعد النهائي (time limit)، لا على الفاصل الزمني بين بدء الإنتاج وإتمامه. والتركيب «المهلة الزمنية» وصفي حر غير مسكوك في أي معجم متخصص، ولا ينطبق عليه اختبار التثبيت المعجمي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فَتْرَةُ التَّسْلِيمِ"
      decision: confirmed
      decision_reason: "مثبت في المعجم الموحد لمصطلحات التجارة والمحاسبة بصيغة «فترة تسليم = delivery period». وإن كان أقرب إلى مدة التوريد منه إلى lead time بمعناه الدقيق، فهو مقبول كمترادف تقريبي يغطي جانب التسليم من المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركز على المدة المتعلقة بتسليم المنتج أو توريده، بينما «زمن السبق» يشمل المدة الكاملة من بدء التصنيع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَتْرَةُ التَّسْلِيمِ"

    - lemma: "زَمَنُ السَّبْقِ"
      source: stage1
      decision: confirmed
      decision_reason: "مثبت حرفياً في المعجم الموحد لمصطلحات النقل (أليكسو 2010) مقابلاً لـ lead time بتعريف مطابق: «الزمن اللازم لتصنيع وإعداد الخامات حتى آخر يوم عمل محدد». هذا هو المصطلح المعياري الأدق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح المعياري الأشمل الذي يغطي كامل الفاصل الزمني من بدء التصنيع إلى إتمامه"
      actions:
        - command: create_entry
          params:
            lemma: "زَمَنُ السَّبْقِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أَجَلُ التَّسْلِيمِ"
      source: stage1
      decision: confirmed
      decision_reason: "مثبت في أربعة معاجم موحدة من أليكسو (نقل، تجارة، قانون، إعلام) مقابلاً لـ lead time و delivery time و term of delivery. وهو مصطلح راسخ في الاستعمال التجاري والقانوني العربي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركز على البعد القانوني-التجاري ويدل على الموعد أو الأجل المحدد للتسليم، مع دلالة على الالتزام التعاقدي"
      actions:
        - command: create_entry
          params:
            lemma: "أَجَلُ التَّسْلِيمِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُدَّةُ الإِنْجَازِ"
      source: stage1
      decision: removed
      decision_reason: "لم يرد «مدة الإنجاز» مصطلحاً مستقلاً في أي معجم متخصص. ورد ضمن تركيبات أطول («المدة اللازمة لإنجاز المشروع»، «إزاحة وقت الإنتاج/ مدة الإنجاز») لكنه لم يُسكّ وحده. وجود «زمن السبق» و«أجل التسليم» يغني عنه."
      evidence_assessment:
        case: no_material

    - lemma: "أَمَدُ الإِنْتَاجِ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استعمال هذا التركيب. «الأمد» يدل على الغاية والمنتهى لا على الفترة الزمنية، كما في مقاييس اللغة: «الأمدُ: الغاية، كلمة واحدة لا يُقاس عليها»."
      evidence_assessment:
        case: no_material


