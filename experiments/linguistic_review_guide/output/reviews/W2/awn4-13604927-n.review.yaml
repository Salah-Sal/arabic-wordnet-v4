# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13604927-n — وَحْدَة قِيَاس
# Review Pipeline v2 — unit of measurement
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة مركبة واحدة فقط (وَحْدَة قِيَاس)، وقد يكون من المناسب إضافة بدائل مفردة إن وُجدت"
      - "التعريف العربي مقبول لكنه يحتاج مراجعة أسلوبية لتقريبه من أسلوب المعجم الوسيط"
    observations: "المفهوم يمثّل قسمة كمّيّة معيارية تُتّخذ أساسًا للقياس أو التبادل. هو مفهوم علمي أساسي في المقاييس والموازين، وله جذور عميقة في التراث العربي (الذراع، الرطل، المكيال). التعبير 'وَحْدَة قِيَاس' هو المركب الإضافي المتداول في المعجمية العلمية العربية المعاصرة."
  blind_candidates:
    - lemma: "مِعْيَار"
      generation_method: ishtiqaq
      justification: "من الجذر ع-ي-ر على وزن مِفْعَال، يدلّ على ما يُقاس به غيره ويُستوى به، وهو وزن الأدوات والأجهزة القياسية في العربية"
    - lemma: "مِقْيَاس"
      generation_method: ishtiqaq
      justification: "من الجذر ق-و-س/ق-ي-س على وزن مِفْعَال، يدلّ على ما يُقاس به الشيء من أداة أو آلة أو مقدار"
    - lemma: "وَحْدَة"
      generation_method: ishtiqaq
      justification: "من الجذر و-ح-د، تدلّ على المقدار المفرد الذي تُنسب إليه الكمّيّات، وهي الترجمة المباشرة لـ unit"
    - lemma: "وَحْدَة مِعْيَارِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يجمع بين مفهوم الوحدة ومفهوم المعيارية، أي المقدار المفرد المعتمد أساسًا للقياس"

stage2_evidence:
  per_lemma:
    - lemma: "وَحْدَة قِيَاس"
      confirm:
        - text: "«مقدارٌ حقيقيّ معياريّ ومُتّفقٌ عليه، يُمكن معه مُقارنة كل مقدار آخر من نفس نوعه، بهدف الحصول على علاقة المقدار الثاني بالمقدار الأول في شكل عدد. ويُعبَّر عن وحدات القياس من خلال أسماء ورموز وحدات مُتفَق عليها.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
        - text: "«قيمة مرجعية يُمكن باستخدامها تعيين وذِكر قيمة مقدار مُقاسٌ بالأعداد.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm) — وحدة (قياس)"
      expands:
        - text: "«unit of measurement; measurement unit; unit»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يُثبت أن المصطلح يقابل ثلاث صيغ إنجليزية: unit of measurement, measurement unit, unit"
        - text: "«وحدة قياس = unit of measure»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "المصطلح مُعتمد في المعاجم الموحدة للرياضيات"
        - text: "«وحدة قياس = measure unit»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "صيغة بديلة في نفس المعجم"
        - text: "«وحدة قياس = unit of measurement»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "المصطلح مُعتمد في معجم الهندسة المدنية"

    - lemma: "مِعْيَار"
      contradicts:
        - text: "«(المعيار) الْعيار و (فِي الفلسفة) نموذج مُتَحَقق أَو مُتَصَوّر لما يَنْبَغِي أَن يكون عَلَيْهِ الشَّيْء وَمِنْه الْعُلُوم المعيارية وَهِي الْمنطق والأخلاق وَالْجمال وَنَحْوهَا (مج)»"
          source: "المعجم الوسيط"
          conflict: "المعيار يدلّ على النموذج والقاعدة المعيارية لا على وحدة القياس ذاتها"
        - text: "«المعيار: مَا يُقَاس بِهِ غَيره وَيَسْتَوِي بِهِ»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "المعيار هو ما يُقاس به (أداة/نموذج مرجعي)، وليس الوحدة المحددة الكمّيّة"
      expands:
        - text: "«المرجع الذي تقاس عليه الأشياء.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
          addition: "يؤكد أن المعيار = مرجع قياسي عام، وليس وحدة قياس محددة"

    - lemma: "مِقْيَاس"
      contradicts:
        - text: "«(المقياس) الْمِقْدَار وَمَا قيس بِهِ من أَدَاة أَو آلَة (ج) مقاييس»"
          source: "المعجم الوسيط"
          conflict: "المقياس يدلّ على الأداة أو الآلة التي يُقاس بها، أو على المقدار العام، لا على وحدة القياس المعيارية"
        - text: "«ويطلق المقياس أيضا على قسم من المقدار كما مرّ وهو ما يمسح به الشيء كالذراع والجريب.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "هنا المقياس بمعنى أداة المسح لا وحدة القياس المعيارية المجردة"
      expands:
        - text: "«scale / gauge / measure»"
          source: "معاجم ARABTERM المتعددة"
          addition: "المقياس في الاصطلاح الحديث يقابل scale أو gauge أكثر من unit of measurement"

    - lemma: "وَحْدَة"
      confirm:
        - text: "«وحدة = unit»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«وحدة = unit»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      contradicts:
        - text: "«(الْوحدَة) المربعة (فِي الرياضة والهندسة) مربع طول أحد أضلاعه وحدة من وحدات الْقيَاس الطولي... و(فِي النظام السياسي) اتِّحَاد أمتين أَو أَكثر... و(وحدة النَّقْد) (فِي الاقتصاد السياسي) وزن ثَابت من مَعْدن معِين»"
          source: "المعجم الوسيط"
          conflict: "الوحدة لفظ مشترك شديد التعدد الدلالي (وحدة سياسية، وحدة رياضية، وحدة نقدية، انفراد...)، يحتاج دائمًا إلى مضاف إليه لتحديد المعنى"
      expands:
        - text: "«الْوَاوُ وَالْحَاءُ وَالدَّالُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدلّ على الانفراد، والوحدة هي المقدار المنفرد الذي يُبنى عليه"

    - lemma: "وَحْدَة مِعْيَارِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "وَحْدَة قِيَاس"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت ومعتمد في جميع المعاجم الموحدة العربية (هندسة مدنية، كهربائية، رياضيات، فيزياء) بمقابل unit of measurement. له تعريف مفصّل في مسرد الهندسة الكهربائية. هو المصطلح المعياري المتداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَحْدَة قِيَاس"

    - lemma: "مِعْيَار"
      source: stage1
      decision: removed
      decision_reason: "المعيار يدلّ على النموذج المرجعي أو القاعدة المعيارية (norm/criterion/standard)، وليس على الوحدة الكمّيّة المحددة المقبولة أساسًا للقياس. الفرق الدلالي جوهري: المعيار هو المبدأ، ووحدة القياس هي الكمّية المعيارية نفسها."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مِقْيَاس"
      source: stage1
      decision: removed
      decision_reason: "المقياس يدلّ على أداة القياس أو الآلة (gauge/scale) أو على المقدار العام، لا على الوحدة المعيارية المحددة. في الاصطلاح الحديث يقابل scale وgauge أكثر من unit."
      evidence_assessment:
        case: contradicts_only

    - lemma: "وَحْدَة"
      source: stage1
      decision: removed
      decision_reason: "لفظ مشترك شديد التعدد الدلالي (وحدة سياسية، وحدة عسكرية، وحدة رياضية، انفراد...). لا يصلح وحده للدلالة على وحدة القياس دون مضاف إليه. إدراجه يُفقد المجموعة دقّتها الدلالية."
      evidence_assessment:
        case: mixed

    - lemma: "وَحْدَة مِعْيَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي لهذا المركب. ليس مصطلحًا مسكوكًا في أيٍّ من المعاجم الموحدة. يفشل في اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material

