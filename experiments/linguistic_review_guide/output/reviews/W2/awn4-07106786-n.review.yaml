            synset_id: "awn4-07106786-n"

    # ── المرشح ٣: صنف — مرفوض ──
    - lemma: "صِنْفٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الصنف دالّ على الطائفة والضرب من كل شيء بصورة عامة جداً، ولم يُسجَّل في أي
        مصدر معجمي مصطلحاً خاصاً بالأنواع الأدبية أو أساليب الكتابة. يفتقر إلى
        الخصوصية الدلالية اللازمة للمصطلح في هذه المجموعة.

    # ── المرشح ٤: مذهب — مرفوض ──
    - lemma: "مَذْهَبٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المذهب في الاستعمال العربي يُحيل إلى التيار الفكري أو المدرسة العقدية أو
        الفلسفية (المذهب الرومانسي، المذهب الواقعي)، أي الاتجاه والمنهج، لا القالب
        الأدبي المحدد. الدلالة أوسع وأقل انضباطاً من genre؛ يُسبِّب التباساً مع
