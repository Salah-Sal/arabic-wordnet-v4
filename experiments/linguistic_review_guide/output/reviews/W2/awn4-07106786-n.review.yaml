# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان الموجودتان (أسلوب الكتابة، نوع أدبي) تفتقران إلى التشكيل الكامل"
      - "مصطلح «أسلوب الكتابة» تركيب إضافي وصفي ولا يجتاز اختبار التثبيت المعجمي اجتيازاً تاماً"
      - "التعريف الحالي «نمط للتعبير عن النفس في الكتابة» ترجمة حرفية للإنجليزية لا تعكس الفارق الدقيق بين «أسلوب الكتابة» و«الجنس الأدبي» (genre vs. writing style)"
      - "غياب مصطلح «جنس أدبي» الذي هو الأدق في الاصطلاح اللساني لمفهوم genre"
    observations: >
      تضمّ المجموعة مفهومَيْن متداخلَيْن في الإنجليزية: «writing style» (الأسلوب الشخصي في الكتابة)
      و«literary genre» (القالب الأدبي كالرواية والشعر والمسرحية). اللمّة الإنجليزية «genre» هي
      المحور الدلالي الأبرز، ويقابلها في العربية الاصطلاحية «الجنس الأدبي» لا «نوع أدبي» المستعملة
      وصفاً لا مصطلحاً راسخاً. المجموعة تحتاج إلى إضافة «جنس أدبي» وتحديث التعريف.

  blind_candidates:
    - lemma: "طِرَازٌ"
      generation_method: majaz
      justification: >
        الطِّراز أصلاً ورش النسيج الملكية ذات الأنماط المميزة، ثم امتدّ دلالياً ليعني
        كل نمط مميز أو أسلوب راقٍ في القول والكتابة؛ مقول في العربية «من الطراز الأول»
        أي النمط الرفيع. إحياء دلالي للفظ المعرَّب المتجذّر في الاستعمال العربي.
    - lemma: "جِنْسٌ أَدَبِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (جنس + أدبي) يوازي مباشرة المصطلح الإنجليزي literary genre؛
        الجنس في المنطق العربي الضرب الجامع للأنواع، فجنس أدبي = القالب الجامع
        للأعمال الكتابية ذات الخصائص المشتركة (شعر، رواية، مسرحية).
    - lemma: "صِنْفٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر صنف (صَنَفَ أي ميَّز وصنَّف)؛ الصنف الطائفة المتميزة من الشيء؛
        مستعمل في المعاجم بمعنى النوع والضرب ويصلح للدلالة على فئة أدبية متميزة.
    - lemma: "مَذْهَبٌ"
      generation_method: majaz
      justification: >
        المذهب أصله ما يُذهب إليه ثم اتّسع للطريقة والمعتقد والمدرسة الفكرية؛
        يُستعمل في النقد الأدبي «مذهب رومانسي / واقعي» دالاً على اتجاه أسلوبي.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:

  # ميزانية الاستعلامات المستخدمة:
  # Q1: مطابقة دفعية لكل اللمّات (الموجودة + المرشحات)
  # Q2: جسر إنجليزي (writing style / literary genre / genre)
  # Q3: FTS عربي بالكلمات المفتاحية (نمط، أسلوب الكتابة، جنس أدبي، نوع أدبي)
  # Q4: استعلام مفرد OCR لمكوّنات اللمّات (أسلوب، نوع، جنس، نمط)
  # Q5: مقاييس اللغة لجذور (جنس، نوع، سلب/أسلوب، نمط، طرز، ذهب، صنف)

  per_lemma:

    # ── اللمّة الأولى الموجودة ──
    - lemma: "أسلوب الكتابة"
      confirm:
        - text: "«الأُسْلُوبُ: الطريقةُ الفنُّ في الأدب — style: مجموعةٌ من الملامح التعبيرية التى يختارُها المتكلِّمُ أو الكاتبُ من العناصر اللغوية القابلة للتبادل لنقل مقاصده إلى المتلقى»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«الأُسْلُوبُ: الطريق. ويقال: سلكتُ أسلوب فلان في كذا: طريقته ومذهبه — طريقة الكاتب في كتابته»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الأُسْلُوبُ: الطريقُ والوَجْهُ والمَذْهَبُ»"
          source: "المعجم الكبير"
          addition: "يكشف عن الجذر الدلالي للأسلوب بوصفه المذهب والطريقة، مما يدعم استخدامه في سياق الكتابة"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "نوع أدبي"
      confirm:
        - text: "«النَّوع الأدبي [كالرواية والمسرحية والمقالة]» — مقابلاً للمصطلح الإنجليزي genre"
          source: "المورد الحديث (2008)"
        - text: "«هَزْلي: نوع أدبي مثير للضحك ونازعٌ إلى التسلية وسخرية غير لاذعة تستهدف الفرجة والمتعة في المسرح»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«مسرحيـة: نوع أدبي يشير إلى كوميديا أو تراجيديا تشهد حبكتهما على معرفة عملية قابلة للاستهلاك»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«تراجيديا: نوع أدبي أسطوري يرتبط بالمأساة واستحالة مواجهة القدر»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُظهر أن «نوع أدبي» مستعمل في المعاجم العلمية الحديثة كوصف ثابت، وإن لم يُسجَّل مدخلاً مستقلاً"

    # ── المرشح ١: طراز ──
    - lemma: "طِرَازٌ"
      confirm:
        - text: "«الطِّراز: النمط والشكل والجيِّد من كل شيء... وقولهم: من الطراز الأول أي من شكلهم أو من النمط الأول»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الطِّراز: النَّمَطُ أو القاعدة أو الأسلوب»"
          source: "المعجم الكبير"
        - text: "«الطِّراز: النَّمط والشَّكْل الجيِّد من كل شيء»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الطَّاءُ وَالرَّاءُ وَالزَّاءُ كَلِمَةٌ يُظَنُّ أَنَّهَا فَارِسِيَّةٌ مُعَرَّبَةٌ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الكلمة معرَّبة من الفارسية، لا عربية الأصل، وهو ما يُضعف الأولوية بوجود بديل عربي راسخ"
        - text: "«فارسي معرب — الهيئة»"
          source: "مجمل اللغة لابن فارس"
          conflict: "تأكيد على التعريب الفارسي للكلمة"

    # ── المرشح ٢: جنس أدبي ──
    - lemma: "جِنْسٌ أَدَبِيٌّ"
      confirm:
        - text: "«جِنْس أدبيّ: قالب أدبي للآثار والإنتاجات المتميزة تقسم الأنواع إلى 'كبرى/صغرى' 'بسيطة/مركبة'، كأشكال تعبير عصر قديم (تراجيديا، كوميديا) حديث (رواية، مسرحية، شعر)»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«الجنس الأدبي: أحد القوالب التي تُصَبُّ فيها الآثارُ الأدبيَّة، فالمسرحيَّة جنس، والقصَّة جنس، والشِّعْر جنس»"
          source: "المعجم الكبير"
        - text: "«أدبٌ تعاقدي: جنس أدبي يقوم على الاعتماد الإرادي لشكل أو نظرية أو موضوع محرك للإبداع»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(جِنْسٌ) الجيم والنون والسين أصل واحد وهو الضَّرب من الشيء. قال الخليل: كل ضرب جنس، وهو من الناس والطير والأشياء جملةً. والجمع أجناس»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر الأصيل للجنس يدل على الضرب والفئة الجامعة، مما يؤهله تأصيلاً للمصطلح الأدبي"

    # ── المرشح ٣: صنف ──
    - lemma: "صِنْفٌ"
      confirm:
        - text: "«الصِّنف: من الشيء ضرب منه متميز والصفة والنوع»"
          source: "المعجم الوسيط"
        - text: "«الصِّنفُ: النَّوْعُ، والضَّرْبُ»"
          source: "القاموس المحيط للفيروزآبادي"
      contradicts:
        - text: "«الصنف: الطائفة من كل شيء أو النوع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الصنف عام لكل ضرب وطائفة دون تخصيص أدبي أو كتابي، ولا شاهد على استعماله مصطلحاً لفن الكتابة"

    # ── المرشح ٤: مذهب ──
    - lemma: "مَذْهَبٌ"
      confirm:
        - text: "«المذهب: الطريقةُ والمعتقدُ الذي يذهب إليه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«المذهب اليومي: مذهب في الرسم يتَّخذ من الحياة اليومية مادةً له»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(مجموعة من الآراء والنظريات العلمية والفلسفية ارتبط بعضها ببعض ارتباطاً يجعلها وحدة منسقة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المذهب يُحيل إلى مدرسة فكرية أو تيار أيديولوجي، لا إلى قالب أدبي محدد؛ دلالته أوسع وأقل تقنية"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الأولى الموجودة ──
    - lemma: "أسلوب الكتابة"
      decision: confirmed
      decision_reason: >
        التعبير المركب «أسلوب الكتابة» تعبير إضافي شائع في النقد الأدبي العربي
        يُحيل تحديداً إلى الأسلوب الفردي في الكتابة (writing style) بما يميّز المؤلف.
        لا يجتاز اختبار الاستبدال الكامل (يمكن إبدال «أسلوب» بـ«طريقة»)، لكنه يعكس
        استعمالاً شبه ثابت في المصادر العلمية العربية. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الطابع الشخصي للكاتب وطريقته التعبيرية الفريدة؛ أقرب إلى «writing style»
        منه إلى «literary genre»؛ يُستعمل في تقييم الأسلوب لا في تصنيف الأعمال
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُسْلُوبُ الكِتَابَة"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "نوع أدبي"
      decision: confirmed
      decision_reason: >
        «نوع أدبي» مستعمل استعمالاً واسعاً في المعاجم اللسانية الحديثة وصفاً لأشكال
        الكتابة الأدبية (مسرحية، شعر، رواية)؛ المورد الحديث يورده مقابلاً لـ«genre».
        رغم قابليته الاستبدالية النسبية فإنه حقّق قدراً من التثبيت في الخطاب الأدبي
        العربي المعاصر. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        أعم من «أسلوب الكتابة» وأكثر تداولاً في التصنيف الأدبي؛ يُستعمل وصفاً للقالب
        الشكلي (نوع أدبي قصصي / شعري) دون التركيز على الأسلوب الشخصي؛ أقل تقنية
        من «جنس أدبي» في الاستعمال اللساني الصارم
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَوْعٌ أَدَبِيٌّ"

    # ── المرشح ١: طراز — مرفوض ──
    - lemma: "طِرَازٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الطراز كلمة معرَّبة من الفارسية (تراز)، أقرّ ذلك ابن فارس صراحةً في مقاييس اللغة
        وفي مجمل اللغة. وبوجود المصطلحَيْن العربيَّيْن الأصيلَيْن «جنس أدبي» و«نوع أدبي»،
        يُحال إلى مبدأ إيثار العربي الأصيل على المعرَّب؛ فضلاً عن أن الطراز في الاستعمال
        المعاصر يُحيل أولاً إلى الطراز المعماري والتصميمي، لا إلى القالب الأدبي.

    # ── المرشح ٢: جنس أدبي — مقبول ──
    - lemma: "جِنْسٌ أَدَبِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        «جنس أدبي» مُسجَّل مدخلاً مستقلاً في المعجم الموحد لمصطلحات اللسانيات (2002)
        بتعريف تقني دقيق؛ والمعجم الكبير يُعرِّف «الجنس الأدبي» تعريفاً علمياً صريحاً.
        جذر جنس (الجيم والنون والسين) عربي أصيل يدل على الضرب الجامع عند الخليل وابن فارس.
        اجتاز اختبار التثبيت المعجمي إذ يُسجَّل مدخلاً لغوياً لا عبارة وصفية. هو أدق
        المصطلحات العربية مقابلاً لـ«literary genre / genre».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الأكثر دقةً مصطلحياً؛ يُحيل إلى القوالب الكبرى الجامعة ذات الضوابط الشكلية والتاريخية
        (شعر، رواية، مسرحية)؛ أشمل من «أسلوب الكتابة» الذي يقتصر على الأسلوب الفردي، وأكثر
        تقنيةً من «نوع أدبي» في الاصطلاح اللساني المعاصر
      actions:
