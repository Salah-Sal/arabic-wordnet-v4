stage1_review:
  assessment:
    concerns:
      - "لمّة «كلمات» جمع تكسير لـ«كلمة»، وليست مصطلحاً قائماً بذاته؛ الأصل في المعجم أن يُدرَج المفرد لا الجمع"
      - "التعريف العربي يستخدم أسلوب «يتم + مصدر» وهو أسلوب ضعيف في الفصحى"
      - "اللمّتان بدون تشكيل"
    observations: "المفهوم واضح ومباشر: اللغة بوصفها ألفاظاً منطوقة أو مكتوبة. هو أقرب إلى المعنى العام لـ«الكلام» في التراث العربي، حيث الكلام يشمل ما يُنطَق ويُكتَب من الألفاظ المفيدة. لمّة «كلمات» ترجمة حرفية للإنجليزية words ولا تصلح لمّة معجمية مستقلة."
  blind_candidates:
    - lemma: "أَلْفَاظ"
      generation_method: ishtiqaq
      justification: "جمع لَفْظ من جذر «لفظ»، يدلّ على الكلمات المنطوقة والمكتوبة عموماً؛ شائع في التراث البلاغي والنحوي"
    - lemma: "قَوْل"
      generation_method: ishtiqaq
      justification: "مصدر من جذر «قول»، يدلّ على كلّ لفظ صدر عن اللسان تامّاً أو ناقصاً؛ ذكر الفيروزابادي: القول الكلام"
    - lemma: "عِبَارَة"
      generation_method: ishtiqaq
      justification: "من جذر «عبر»، الألفاظ الدالّة على المعاني كما في كشّاف التهانوي؛ تفيد معنى التعبير اللغوي"
    - lemma: "مَنْطُوق"
      generation_method: ishtiqaq
      justification: "اسم مفعول من جذر «نطق» على وزن مَفْعُول، يدلّ على ما يُفهَم من اللفظ في محلّ النطق"

stage2_evidence:
  per_lemma:
    - lemma: "كَلَام"
      confirm:
        - text: "«الكَلامُ: القولُ، أو ما كان مُكْتَفياً بنَفْسِه»"
          source: "القاموس المحيط"
        - text: "«الكَلامُ: الْأَلْفَاظ التَّامَّة المركبة، وحروف دَالَّة على معَان مفيدة»"
          source: "التعريفات للجرجاني"
        - text: "«الكلامُ: هُوَ الْمركب من كَلِمَتَيْنِ أسندت إحديهما إِلَى الْأُخْرَى»"
          source: "التعريفات للجرجاني"
      expands:
        - text: "«(كَلَمَ) الْكَافُ وَاللَّامُ وَالْمِيمُ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى نُطْقٍ مُفْهِمٍ، وَالْآخَرُ عَلَى جِرَاحٍ. فَالْأَوَّلُ الْكَلَامُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكّد أنّ الأصل الأوّل للجذر هو النطق المفهم"
        - text: "«يشتبه الكلام مع اللغة، كما هو شائع عموماً. ويعدّ الكلام، في النظرية الفطرية القدرة الطبيعية على التكلم»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "يبيّن العلاقة بين الكلام واللغة في المصطلح اللساني الحديث"

    - lemma: "كَلِمَات"
      contradicts:
        - text: "«الكلمات الإلهية: ما تعيّن من الحقيقة الجوهرية وصار موجوداً»"
          source: "اصطلاحات الصوفية للقاشاني"
          conflict: "المدخل الوحيد المعجمي لـ«كلمات» يخصّ الاستعمال الصوفي لا المعنى العام"
      expands:
        - text: "«والكَلِمَةُ: اللَّفْظَةُ، والقَصيدةُ ج: كَلِمٌ... ويجمعون الكلمة كلمات وكلماً»"
          source: "القاموس المحيط / مقاييس اللغة"
          addition: "كلمات جمع كلمة وليست وحدة معجمية مستقلة"

    - lemma: "أَلْفَاظ"
      evidence_status: "no_material_found"

    - lemma: "قَوْل"
      confirm:
        - text: "«القَوْلُ: الكَلامُ، أو كُلُّ لَفْظٍ مَذَلَ به اللِسانُ، تامّاً أو ناقصاً»"
          source: "القاموس المحيط"
        - text: "«(قَوَلَ) الْقَافُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ... وَهُوَ الْقَوْلُ مِنَ النُّطْقِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«القول عند المنطقيين هو اللفظ المركّب ويسمّى المؤلّف أيضاً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "القول عند المناطقة اصطلاح خاصّ يعني اللفظ المركّب، وليس مطلق اللغة المنطوقة"

    - lemma: "عِبَارَة"
      confirm:
        - text: "«العِبَارة: هي الألفاظ الدالَّةُ على المعاني، لأنها تفسيرُ ما في الضمير الذي هو مستور»"
          source: "التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«(الْعبارَة) الْكَلَام الَّذِي يبين بِهِ مَا فِي النَّفس من معَان»"
          source: "المعجم الوسيط"
          conflict: "العبارة كلام مخصوص يبيّن ما في النفس، وليست مطلق اللغة المنطوقة أو المكتوبة"

    - lemma: "مَنْطُوق"
      contradicts:
        - text: "«المَنْطُوقُ: مَا يفهم من اللَّفْظ فِي مَحل النُّطْق»"
          source: "التعريفات للجرجاني"
          conflict: "مصطلح أصولي خاصّ بدلالة الألفاظ، لا يعني اللغة المنطوقة عموماً"
        - text: "«المنطوق عند الأصوليين خلاف المفهوم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "مصطلح تقني في أصول الفقه، بعيد عن المعنى المطلوب"

stage3_analysis:
  per_lemma:
    - lemma: "كَلَام"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل من جذر «كلم» الدالّ على النطق المفهم. أكّدته المعاجم الكلاسيكية والحديثة بمعنى القول والألفاظ التامّة المفيدة. يصحّ للدلالة على اللغة المنطوقة والمكتوبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على مطلق اللغة المنطوقة أو المكتوبة بوصفها ألفاظاً مفيدة مركّبة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَلَام"

    - lemma: "كَلِمَات"
      decision: removed
      decision_reason: "جمع تكسير لـ«كلمة» وليست وحدة معجمية مستقلة. لم يُعثَر على مدخل معجمي يدعم «كلمات» بمعنى اللغة المنطوقة أو المكتوبة. يبدو أنها ترجمة حرفية للإنجليزية words."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "أَلْفَاظ"
      source: stage1
      decision: removed
      decision_reason: "جمع لَفْظ، ليست وحدة معجمية مستقلة بمعنى اللغة المنطوقة أو المكتوبة. الجمع لا يصلح لمّة معجمية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "قَوْل"
      source: stage1
      decision: removed
      decision_reason: "وإن كان القول يرادف الكلام في بعض السياقات، فإنّه أخصّ منه: يدلّ على الملفوظ المفرد أو المركّب (القَول = ما قيل)، لا على مطلق اللغة. كما أنّ له استعمالاً اصطلاحياً خاصّاً عند المناطقة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "عِبَارَة"
      source: stage1
      decision: removed
      decision_reason: "العبارة أخصّ من الكلام: هي الكلام المخصوص الذي يبيّن ما في النفس، أو الألفاظ الفصيحة المركّبة عند البلغاء. لا تصلح مرادفاً للمفهوم العامّ «اللغة المنطوقة أو المكتوبة»."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مَنْطُوق"
      source: stage1
      decision: removed
      decision_reason: "مصطلح أصولي خاصّ يعني ما دلّ عليه اللفظ في محلّ النطق (مقابل المفهوم). بعيد تماماً عن المعنى المطلوب."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

