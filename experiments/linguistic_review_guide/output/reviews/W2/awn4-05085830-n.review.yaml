        value: '{"root":"خرج","maqayis":"«الْخَاءُ وَالرَّاءُ وَالْجِيمُ أَصْلَانِ... فَالْأَوَّلُ: النَّفَاذُ عَنِ الشَّيْءِ.»"}'
