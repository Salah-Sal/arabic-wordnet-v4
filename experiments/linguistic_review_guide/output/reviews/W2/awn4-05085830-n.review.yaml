    - lemma: "خَارِجَانِيَّة"
      sense_id: "{auto}"
      nuance: "مصطلح تقني يستعمل غالباً في السياقات الفلسفية والمعرفية للدلالة على الخارجية الموضوعية."
      mwe: false
  synset:
    cultural_fit: native
  actions:
