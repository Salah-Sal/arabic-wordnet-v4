stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة مناسبة جداً، ولكن يمكن تعزيزها بمصطلحات تقنية (فلسفية) أكثر تخصيصاً."
    observations: "المفهوم مكاني تجريدي (Spatial relationship) يعبر عن حالة الخارج مقابل الداخل. اللمات المقترحة تغطي الجانب العام والجانب المتعلق بالظهور."
  blind_candidates:
    - lemma: "خَارِجِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (خارج) ليدل على حالة الوجود في الخارج أو الصفة المتعلقة به."
    - lemma: "ظَاهِرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (ظاهر) ليدل على التوجه نحو الخارج أو ما يبدو للعيان من الخارج."
    - lemma: "بَرَّانِيَّة"
      generation_method: ishtiqaq
      justification: "مصطلح يستعمل في بعض السياقات (خاصة التشريحية أو المناطقية) ليدل على الطبقة أو الحالة الخارجية."
    - lemma: "خَارِجَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصطلح تقني وفلسفي يعبر عن 'البرانية' أو الوجود المستقل خارج الذات (Externality)."

stage2_evidence:
  per_lemma:
    - lemma: "خَارِجِيَّة"
      confirm:
        - text: "«الخارجية: العلاقات مع الدول الأجنبية. ومأمور الخارجية: متولي المصالح المتعلقة بالدول الأجنبية»"
          source: "تكملة المعاجم العربية لدرزي"
      expands:
        - text: "«(1) الخارجية؛ الظاهرية؛ المادية (2) الاهتمام بالأمور المادية.»"
          source: "المورد الحديث (ترجمة outwardness)"
    - lemma: "ظَاهِرِيَّة"
      confirm:
        - text: "«ظاهري: سطحي»"
          source: "تكملة المعاجم العربية لدوزي"
        - text: "«(1) الخارجية؛ الظاهرية؛ المادية»"
          source: "المورد الحديث (ترجمة outwardness)"
      contradicts:
        - text: "«الظَّاهِرِيَّة من الْفُقَهَاء منسوبون إِلَى القَوْل بِالظَّاهِرِ وهم أَتبَاع دَاوُد بن عَليّ...»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال الفقهي المذهبي يختلف عن الاستعمال المكاني العام."
    - lemma: "خَارِجَانِيَّة"
      confirm:
        - text: "«(1) الخارجانيّة: كون الشيء خارجيًا. وبخاصة: الموضوعيّة the externality of some writers»"
          source: "المورد الحديث (2008)"
    - lemma: "بَرَّانِيَّة"
      confirm:
        - text: "«بَرَّانِيَّة: غِلاَف ليفيّ محيطيّ لعضو أنبوبيّ عادة...»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني"
      expands:
        - text: "«برّانية: الطبقة الخارجية لعضو ما وبخاصة الأوعية الدموية.»"
          source: "معجم المصطلحات الطبية"

stage3_analysis:
  per_lemma:
    - lemma: "خَارِجِيَّة"
      decision: confirmed
      decision_reason: "مصطلح قياسي وشائع للتعبير عن حالة الخارجية (Externality) في مختلف السياقات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَارِجِيَّة"
    - lemma: "ظَاهِرِيَّة"
      decision: confirmed
      decision_reason: "تستخدم للتعبير عن سمة الخارجية المتعلقة بما يظهر من الشيء (Outwardness)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ظَاهِرِيَّة"
    - lemma: "خَارِجَانِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "إضافة هامة كمصطلح تقني فلسفي يعبر عن 'الخارجية' كحالة تجريدية أو موضوعية، وهو أدق في سياق الترجمة التقنية لـ Externality."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خَارِجَانِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بَرَّانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من دقتها الدلالية، إلا أنها تميل إلى التخصص التشريحي أو الطابع المحلي في بعض المناطق، ويفضل عنها 'الخارجية'."

stage4_content:
  definition:
    current: "صفة أو حالة الوجود في الخارج أو التوجه نحو الخارج أو التعلق به"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكنه يحتاج إلى صياغة أكثر دقة ومصطلحية لتعكس الجانب التجريدي للمفهوم."
    authored:
      - type: terminological
        text: "صِفَةُ أَوْ حَالَةُ كَوْنِ الشَّيْءِ خَارِجًا أَوْ مُنْزَاحًا نَحْوَ الخَارِجِ، أَوْ مَا يَتَعَلَّقُ بِمَا هُوَ ظَاهِرٌ عَنِ الذَّاتِ أَوْ المَرْكَزِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "صِفَةُ أَوْ حَالَةُ كَوْنِ الشَّيْءِ خَارِجًا أَوْ مُنْزَاحًا نَحْوَ الخَارِجِ، أَوْ مَا يَتَعَلَّقُ بِمَا هُوَ ظَاهِرٌ عَنِ الذَّاتِ أَوْ المَرْكَزِ."}

  examples:
    per_lemma:
      - lemma: "خَارِجِيَّة"
        examples:
          - text: "تَتَمَيَّزُ بَعْضُ النَّظَرِيَّاتِ اللِّسَانِيَّةِ بِخَارِجِيَّتِهَا فِي تَفْسِيرِ الظَّوَاهِرِ اللُّغَوِيَّةِ."
            type: usage
      - lemma: "ظَاهِرِيَّة"
        examples:
          - text: "لَمْ تَكُنْ ظَاهِرِيَّةُ المَبْنَى تَعْكِسُ مَدَى تَعْقِيدِ تَجْهِيزاتِهِ الدَّاخِلِيَّةِ."
            type: usage
      - lemma: "خَارِجَانِيَّة"
        examples:
          - text: "يُعَالِجُ المَبْحَثُ الفَلْسَفِيُّ مَسْأَلَةَ الخَارِجَانِيَّةِ فِي عِلَاقَةِ العَقْلِ بِالعَالَمِ المَادِّيِّ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَتَمَيَّزُ بَعْضُ النَّظَرِيَّاتِ اللِّسَانِيَّةِ بِخَارِجِيَّتِهَا فِي تَفْسِيرِ الظَّوَاهِرِ اللُّغَوِيَّةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "خَارِجِيَّة"
      entry_id: "{auto}"
      root: "خرج"
      maqayis_quote: "«الْخَاءُ وَالرَّاءُ وَالْجِيمُ أَصْلَانِ... فَالْأَوَّلُ: النَّفَاذُ عَنِ الشَّيْءِ.»"
    - lemma: "ظَاهِرِيَّة"
      entry_id: "{auto}"
      root: "ظهر"
      maqayis_quote: "«الظَّاءُ وَالْهَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى قُوَّةٍ وَبُرُوزٍ... ظَهَرَ الشَّيْءُ يَظْهَرُ ظُهُورًا فَهُوَ ظَاهِرٌ، إِذَا انْكَشَفَ وَبَرَزَ.»"
    - lemma: "خَارِجَانِيَّة"
      entry_id: "{auto}"
      root: "خرج"
      maqayis_quote: "«الْخَاءُ وَالرَّاءُ وَالْجِيمُ أَصْلَانِ... فَالْأَوَّلُ: النَّفَاذُ عَنِ الشَّيْءِ.»"
  per_sense:
