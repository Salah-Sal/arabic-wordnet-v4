# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07965746-n (network army)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «جيش الشبكة» ترجمة حرفية لـ network army ولا تبدو مصطلحاً مسكوكاً في الاستعمال العربي"
      - "المفهوم حديث جداً ولا يوجد له مقابل تراثي أو مصطلح مستقرّ في المعاجم العربية"
      - "التعريف العربي طويل ويميل إلى الشرح الموسوعي أكثر من التعريف المعجمي المحكم"
      - "المجموعة تحتوي على لمّة واحدة فقط مما يضعف تغطيتها الترادفية"
    observations: >
      المفهوم يصف ظاهرة رقمية حديثة: تجمّع أشخاص متوافقي الفكر عبر الإنترنت يمارسون تأثيراً جماعياً.
      هذا المفهوم قريب مما يُعرف إعلامياً بـ«الجيش الإلكتروني» أو «الذباب الإلكتروني» في السياق العربي.
      التحدي الأساسي هو إيجاد مصطلح عربي مسكوك يغطي هذا المفهوم بدقة دون الاقتصار على الترجمة الحرفية.
  blind_candidates:
    - lemma: "جَيْشٌ إِلِكْتِرُونِيّ"
      generation_method: tarkib
      justification: >
        مركب إضافي وصفي شائع في الإعلام العربي المعاصر، يُستخدم للدلالة على مجموعات منظمة على الإنترنت
        تمارس تأثيراً سياسياً أو اجتماعياً. أكثر المصطلحات تداولاً في هذا الحقل الدلالي.
    - lemma: "حَشْدٌ رَقَمِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «حشد» (الاجتماع والتعاون — جذر ح ش د) و«رقمي». يركّز على البُعد الجماعي والتعاوني
        للظاهرة بدلاً من البُعد العسكري، وهو أدق في وصف المجموعات غير العنيفة.
    - lemma: "جُنْد الشَّابِكَة"
      generation_method: tarkib
      justification: >
        مركب إضافي يجمع «جند» (الأعوان والأنصار — جذر ج ن د) و«الشابكة» (مصطلح مجمعي للإنترنت).
        يُحيي لفظاً تراثياً (جند = الأعوان والنُّصّار) في سياق رقمي حديث.
    - lemma: "كَتِيبَة شَبَكِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من «كتيبة» (الجماعة المنظّمة من الجيش — وزن فَعِيلة) و«شبكية» نسبةً إلى الشبكة.
        يؤكد البُعد التنظيمي والجماعي للمفهوم مع الإشارة إلى الفضاء الرقمي.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "جَيْش الشَّبَكَة"
      evidence_status: "no_material_found"

    - lemma: "جَيْشٌ إِلِكْتِرُونِيّ"
      expands:
        - text: "«الجَيْشُ: الجند جماعة الناس في الحرب»"
          source: "المعجم الوسيط"
          addition: "الجيش في أصله جماعة الناس في الحرب، واستُعمل مجازاً للمجموعة المنظمة على الإنترنت"
        - text: "«الجَيْشُ: الجُنْدُ جُنْدٌ يَسِيرُونَ لِحَرْبٍ أو غَيْرِها جماعةُ النَّاسِ في الحَرْبِ»"
          source: "المعجم الكبير"
          addition: "زيادة «أو غيرها» تفتح باب الاستعمال المجازي للجيش في غير الحرب"
        - text: "«(جَيَشَ) الْجِيمُ وَالْيَاءُ وَالشِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ الثَّوَرَانُ وَالْغَلَيَانُ... وَالْجَيْشُ مَعْرُوفٌ، وَهُوَ مِنَ الْبَابِ، لِأَنَّهَا جَمَاعَةٌ تَجِيشُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجيش الثوران والغليان، ومنه سُمّيت الجماعة جيشاً لأنها تثور وتتحرك"

    - lemma: "حَشْدٌ رَقَمِيّ"
      expands:
        - text: "«عندي حَشْدٌ من الناس، أي جماعةٌ، وهو في الأصل مصدر. وحشدوا يحشدون بالكسر حشد: أي اجتمعوا، وكذلك احتَشَدوا وتحشّدوا»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "الحشد في أصله الجماعة المجتمعة، وفيه معنى التعاون والخفّة في الإجابة"
        - text: "«(حَشَدَ) الْحَاءُ وَالشِّينُ وَالدَّالُ... يُقَالُ حَشَدَ الْقَوْمُ إِذَا اجْتَمَعُوا وَخَفُّوا فِي التَّعَاوُنِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "فيه زيادة معنى التعاون على الاجتماع، وهو أنسب للمجموعات التطوعية عبر الإنترنت"

    - lemma: "جُنْد الشَّابِكَة"
      expands:
        - text: "«(جَنَدَ) الْجِيمُ وَالنُّونُ وَالدَّالُ يَدُلُّ عَلَى التَّجَمُّعِ وَالنُّصْرَةِ. يُقَالُ هُمْ جُنْدُهُ، أَيْ أَعْوَانُهُ وَنُصَّارُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجند أصله التجمّع والنصرة، فيه بُعد الولاء والعون الجماعي"

    - lemma: "كَتِيبَة شَبَكِيَّة"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "جَيْش الشَّبَكَة"
      decision: confirmed
      decision_reason: >
        ترجمة حرفية لـ network army لكنها مفهومة ومركبة تركيباً إضافياً صحيحاً.
        تحتاج إلى تصحيح التشكيل. رغم عدم ورودها في المعاجم التقليدية، فهي تعبير مقبول
        لمفهوم حديث، والتركيب الإضافي (جيش + الشبكة) واضح الدلالة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يركّز على البُعد العسكري المجازي مع ربط مباشر بالشبكة (الإنترنت)،
        وهو الأقرب للمصطلح الإنجليزي الأصلي network army.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَيْش الشَّبَكَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "جَيْشٌ إِلِكْتِرُونِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح شائع ومتداول بكثرة في الإعلام العربي المعاصر للدلالة على مجموعات منظمة
        على الإنترنت. أكثر تداولاً من «جيش الشبكة» وأقرب إلى الاستعمال الفعلي.
        أدلة المعاجم التقليدية تدعم استعمال «الجيش» للجماعة المنظمة (المعجم الكبير: «أو غيرها»).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُستخدم غالباً في السياق السياسي والإعلامي للدلالة على مجموعات مدفوعة أو منظمة
        تعمل لصالح جهة محددة، وقد يحمل دلالة سلبية أحياناً.
      actions:
        - command: create_entry
          params: {lemma: "جَيْشٌ إِلِكْتِرُونِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07965746-n"}

    - lemma: "حَشْدٌ رَقَمِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        مركب وصفي غير مسكوك وغير متداول. رغم أن «حشد» يحمل دلالة الاجتماع والتعاون،
        فإن التركيب «حشد رقمي» لا يمثل وحدة معجمية ثابتة، ويمكن إبدال «رقمي»
        بـ«إلكتروني» أو «افتراضي» دون تغيير المعنى (فشل اختبار السكّ).

    - lemma: "جُنْد الشَّابِكَة"
      source: stage1
      decision: removed
      decision_reason: >
        مركب إضافي مصطنع لم يرد في أي مصدر. لفظ «الشابكة» نفسه لم يشع بعد بديلاً عن «الإنترنت»،
        والتركيب يبدو تكلّفاً لا يخدم التداول الفعلي. لا أدلة معجمية على استعماله.

    - lemma: "كَتِيبَة شَبَكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مركب وصفي غير مسكوك ولا متداول. يفشل في اختبار السكّ (يمكن قول «كتيبة إلكترونية»
        أو «كتيبة رقمية» بالمعنى نفسه). لا أدلة معجمية تدعمه.

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
