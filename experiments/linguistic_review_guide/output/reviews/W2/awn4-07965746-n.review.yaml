      - type: terminological
        text: "جماعةٌ مُنظَّمةٌ من مُستخدِمي الإنترنت المُتوافِقينَ فكرياً، تسعى إلى التأثير في الرأي العامّ حولَ قضيّةٍ مُشترَكة"
