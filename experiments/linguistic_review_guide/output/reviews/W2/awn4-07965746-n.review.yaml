          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "تجمُّعٌ افتراضيٌّ لأشخاصٍ يوحّدهم اهتمامٌ مُشترَك عبرَ الشبكة العالمية، يتّخذ شكلَ حملاتٍ مُنسَّقة على منصّات التواصل الاجتماعيّ بهدف التأثير في قضايا سياسيّة أو اجتماعيّة أو تجاريّة"
    actions:
      - command: update_definition
