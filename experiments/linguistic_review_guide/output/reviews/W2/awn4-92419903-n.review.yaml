# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-92419903-n
# المراجع: نظام AWN4 Review Pipeline v2 (5-Stage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «الطابع اليوناني» مركب وصفي حر يفشل اختبار السك المعجمي: يمكن
        إبدال «الطابع» بـ«الطبيعة» أو «الهوية» أو «السمة» دون فقدان المعنى، مما يُثبت
        أنه عبارة وصفية وليس وحدة معجمية ثابتة."
      - "المركب «الطابع اليوناني» قابل للالتباس بـ«طابع البريد اليوناني» (postage stamp)
        إذ يحمل «الطابع» هذا المعنى الشائع في العربية المعاصرة."
      - "لا توجد لمّة بمفرد تُعبّر عن المفهوم المجرد «كون الشيء يونانياً»؛ فجوة معجمية
        حقيقية تستوجب الاشتقاق أو الترادف الصريح."
      - "الـili فارغة (null) مما يُشير إلى أن المجموعة مُضافة محلياً، وتحتاج إلى تدقيق
        دلالي مستقل عن ربط OEWN."
    observations: "المجموعة awn4-92419903-n تُمثّل الخاصية المجردة «كون الشيء يونانياً»
      (Greekness بالإنجليزية)، وهي اسم جوهري مُجرَّد مشتق من صفة النسبة بإضافة ياء
      المصدر الصناعي. تنتمي هذه المجموعة إلى مجموعة الخصائص الجوهرية (أمّها
      خَاصِّيَّة جَوْهَرِيَّة)، وهو صنف يضم مفاهيم مجردة تعبّر عن خصائص جوهرية مشتركة
      بين أفراد صنف. تستدعي طبيعة المفهوم صوغَ لمّة مفردة مستقة بالمصدر الصناعي."

  blind_candidates:
    - lemma: "الإِغْرِيقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «إغريقي» على وزن فُعْلِيَّة (-يَّة) المنتج في توليد
        الخصائص المجردة: ديمقراطي → ديمقراطية، يوناني → يونانية، إغريقي → إغريقية.
        يُميَّز «إغريقي» بأنه يحيل أساساً على اليونان الكلاسيكية مما يُضيق الدلالة
        تجنباً للالتباس مع الدولة اليونانية الحديثة."
    - lemma: "اليُونَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «يوناني» بالطريقة ذاتها. يُستعمل «اليونانية» بصورة
        أوسع في اللغة العربية المعاصرة ويشمل اليونان القديمة والحديثة، مما يجعله
        أشمل ولكن أكثر التباساً مع «اللغة اليونانية»."
    - lemma: "الهِلِّينِيَّة"
      generation_method: taarib
      justification: "تعريب من اليونانية Ἑλληνική (Hellēnikḗ) عبر الإنجليزية Hellenic؛
        يقبل الكلمةُ لامَ التعريف والنسبةَ (الهيليني) والجمعَ. يُستعمل «الهيلينية»
        في المعاجم العربية المعاصرة للدلالة على الحضارة اليونانية القديمة أو الشعور
        بالانتماء إليها."
    - lemma: "الطَّابع الإِغْرِيقي"
      generation_method: tarkib
      justification: "مركب وصفي (إضافة موصوفة) يجمع «الطابع» (الخُلُق الغالب، الطبيعة)
        و«الإغريقي» (المنسوب إلى الإغريق). يُعبّر عن الخاصية بالإشارة إلى الطابع
        الثقافي المميز لليونان الكلاسيكية."


stage2_evidence:
  per_lemma:
    - lemma: "الطابع اليوناني"
      expands:
        - text: "«الطَّابَعُ: ما يُطبَع به أو يُخْتَمُ. الميسم. الخُلُق الغالب. طابع البريد:
            ما يُلصَقُ بالرسائل وغيرها من بطاقاتٍ صغيرة ترسمها الدولة وتجعلها رمزًا
            لأداء أجر الإرسال ونحوه.»"
          source: "المعجم الوسيط (OCR)"
          addition: "«الطابع» له معنيان بارزان في العربية المعاصرة: (١) الخُلُق الغالب
            والطبيعة، (٢) طابع البريد. المعنى الأول يدعم استخدام «الطابع» في التعبير
            عن خاصية الشيء، لكن الاشتراك مع المعنى الثاني يُوقع التباساً في المركب
            «الطابع اليوناني»."
        - text: "«(الطابع) الطابع والطبيعة، يُقَال لَهُ طَابع حسن»"
          source: "المعجم الوسيط (Hawramani)"
          addition: "يُرادف «الطابع» مباشرةً «الطبيعة» في هذه الرواية، مما يُثبت أن
            «الطابع اليوناني» يعني «الطبيعة اليونانية»، لكنه يثبت أيضاً إمكانية الإبدال
            الحر وبالتالي عدم الثبات المعجمي."

    - lemma: "الإِغْرِيقِيَّة"
      evidence_status: "no_material_found"

    - lemma: "اليُونَانِيَّة"
      contradicts:
        - text: "«اليونانيّة الحديثة [منذ نهاية القرون الوسطى].»"
          source: "المورد الحديث (2008)"
          conflict: "يدل على «اللغة اليونانية الحديثة»، لا على الخاصية المجردة «كون
            الشيء يونانياً»؛ وهو ما يُنشئ اشتراكاً لفظياً صريحاً مع المعنى
            المطلوب."
      expands:
        - text: "«(1) الإغريقيّ؛ اليونانيّ. (2) اللغة اليونانية. (3) not cap.: شيء غير
            مفهوم. (4) إغريقيّ؛ يونانيّ. (5) روميّ؛ أرثوذكسيّ: خاصّ بالكنيسة الشرقية
            الأرثوذكسية.»"
          source: "المورد الحديث (2008) — ترجمة Greek"
          addition: "العربية «اليوناني/الإغريقي» تقابل الإنجليزية Greek. غياب المصطلح
            المفرد للخاصية المجردة Greekness في القاموس الثنائي يدل على الفجوة المعجمية."

    - lemma: "الهِلِّينِيَّة"
      contradicts:
        - text: "«(1) الهِلِّينيّة: ولاء أو محاكاة للفكر الإغريقيّ والعادات والأساليب
            الإغريقية القديمة. (2) الحضارة الإغريقية.»"
          source: "المورد الحديث (2008) — ترجمة Hellenism"
          conflict: "«الهِلِّينيّة» مُسجَّلة بمعنى «ولاء الفكر الإغريقي» (Hellenism)،
            وهو أشمل من الخاصية المجردة «كون الشيء يونانياً» (Greekness). الأولى تتضمن
            موقفاً ثقافياً أو انتماءً حضارياً، فيما الثانية خاصية جوهرية بسيطة."
      expands:
        - text: "«(1) الهِلِّينيّ: كل شخص من أصل غير إغريقيّ عاش في العصر الهلّيني وتبنّى
            لغة الإغريق وأسلوبهم في الحياة. وبخاصة: يهوديّ مُتهلِّن. (2) العالِم
            باللغة أو الحضارة اليونانية القديمة.»"
          source: "المورد الحديث (2008) — ترجمة Hellenist"
          addition: "توجد عائلة اشتقاقية راسخة: هيليني/متهلن/يتهلن، مما يثبت أن
            «الهيلينية» جزء من منظومة اصطلاحية معترف بها في المعجمية العربية الحديثة،
            لكنها تختص بالحقبة الهلينية الكلاسيكية وما تبعها."

    - lemma: "الطَّابع الإِغْرِيقي"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "الطابع اليوناني"
      decision: removed
      decision_reason: "يخفق الاختبارين المعياريين: (١) اختبار الاستبدال — تشتغل
        «الطبيعة اليونانية» و«الهوية اليونانية» و«السمة اليونانية» بديلاً مساوياً في
        كل سياق، فالتعبير عبارة وصفية حرة لا وحدة معجمية ثابتة. (٢) اختبار التثبيت
        المعجمي — لا يرد «الطابع اليوناني» كمصطلح مسكوك في أي مصدر من قواعد البيانات
        المستعلَمة. يُضاف إلى ذلك احتمال الالتباس بـ«طابع البريد اليوناني» في القراءة
        السريعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الإِغْرِيقِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي قياسي من «إغريقي» على وزن (-يَّة) المنتج في العربية
        لتوليد أسماء الخصائص المجردة (ديمقراطيّة، اشتراكيّة، إسلاميّة). لا يعاني من
        الاشتراك اللفظي: «الإغريقية» لا تحيل على اللغة في المعجمية الراهنة، بل تحيل على
        الحضارة الكلاسيكية تحديداً مما يلائم موضع المجموعة في التسلسل الهرمي تحت
        «خاصّيّة جوهريّة». اجتاز اختبار السك: لا يمكن إبدال «إغريقية» بكلمة أخرى
        بسهولة، إذ هي الاسم ذاته لا وصف حر. يقبل لام التعريف والنسبة (إغريقي) والجمع
        (إغريقيات)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة المُقرَّرة في المجموعة، تُعبّر عن الخاصية
        المجردة لكون الشيء ذا أصل أو طابع يوناني/إغريقي، بتفضيل دلالي نحو الحضارة
        الكلاسيكية (إغريق) على الدولة الحديثة."
      actions:
        - command: create_entry
          params:
            lemma: "الإِغْرِيقِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اليُونَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم صحة الوزن الصرفي، تُستعمل «اليونانية» في اللغة العربية
        المعاصرة للدلالة في المقام الأول على «اللغة اليونانية» (اليونانية الحديثة،
        اليونانية القديمة...)، وهو ما تثبته شواهد المعجم. إدراجها لمّةً لهذه المجموعة
        يُنشئ اشتراكاً لفظياً يُوهم القارئ بأن المجموعة تعني اللغة لا الخاصية
        المجردة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "الهِلِّينِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مُسجَّلة في المورد الحديث بمعنى «ولاء أو محاكاة للفكر الإغريقي
        والعادات القديمة» أي Hellenism (مجموعة ترادفية مختلفة)، وليس المعنى البسيط
        «كون الشيء يونانياً». إضافتها هنا يُدمج مفهومَين: الخاصية الجوهرية البسيطة
        (Greekness) والظاهرة الحضارية المركبة (Hellenism)."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الطَّابع الإِغْرِيقي"
      source: stage1
      decision: removed
      decision_reason: "يعاني من الإشكالية ذاتها التي أفضت إلى رفض «الطابع اليوناني»:
        مركب وصفي حر يجتاز اختبار الاستبدال (الطبيعة الإغريقية، الهوية الإغريقية)، ولا
        وجود له كوحدة معجمية مسكوكة في قواعد البيانات."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


