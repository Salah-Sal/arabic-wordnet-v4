# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'كوميديا سوداء' تعتمد على المُعرَّب 'كوميديا' في حين يتوفر البديل العربي الأصيل 'فكاهة'"
      - "كلتا اللمّتين كلْكَةٌ (calque) من الإنجليزية 'black humor' دون توثيق في معاجم اللغة الكلاسيكية"
      - "التعريف الحالي ترجمة شبه حرفية من الإنجليزي ولا يتبع أسلوب المعجم الوسيط (جنس + فصل)"
      - "غياب التشكيل الكامل عن كلتا اللمّتين"
    observations: >
      المجموعة تمثّل مفهوماً أدبيًّا غربيًّا دخل العربية عبر الترجمة في القرن العشرين.
      لمّة «فكاهة سوداء» مؤصَّلة في المعجم الموحد لمصطلحات اللسانيات (ALECSO 2002) بترجمة إنجليزية «black humour»،
      بينما «كوميديا سوداء» تستعير اللفظ اليوناني-اللاتيني «κωμωδία» ولم تُرصد في أيٍّ من المعاجم المتخصصة المستعلَمة.
      الجذر «فكه» يدل على الطيب والاستطابة (ابن فارس) وهو مناسب للمفهوم، أما «أسود/سوداء» فتحمل دلالة اللون
      المجازية بمعنى الحزن والشؤم كما يُثبته ابن فارس أيضاً.

  blind_candidates:
    - lemma: "مُجُونٌ"
      generation_method: majaz
      justification: >
        إحياء للفظ عربي كلاسيكي أصيل (مجن)؛ قال ابن فارس: «أن المُجُون: أَلَّا يُبَالِيَ الْإِنْسَانُ مَا صَنَعَ».
        الإزاحة الدلالية: تمديد المعنى من «اللامبالاة بالمعايير الأخلاقية في الكلام والفعل» نحو «الهزل المتجاوز
        الذي يخلط المرضيَّ بالمضحك دون اكتراث». غير أن الانزياح الدلالي واسع.
    - lemma: "الهَزَلُ الكَئِيبُ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (هزل + كئيب): يجمع «الهزل» (نقيض الجدّ في المنطق، ابن فارس) مع «الكئيب» (الحزين المغموم)
        ليصف الجوهر الدلالي للفكاهة السوداء: هزل حزين مقلق. اختبار الاستبدال: يمكن قول «الهزل المحزون»
        أو «الهزل المظلم» فلا ثبات تعبيري → ضعيف الاصطلاحية.
    - lemma: "الضَّحِكُ الأَلِيمُ"
      generation_method: tarkib
      justification: >
        تركيب وصفي يُعبِّر عن المفارقة الجوهرية: الضحك الذي ينطوي على الألم. يُضمِّن الجانبين (الهزل + المرضي)
        في وحدة دلالية واحدة. غير أنه تعبير وصفي حر لا مصطلح مسكوك، ويمر اختبار الاستبدال: «الضحك المؤلم» يؤدي المعنى.
    - lemma: "فُكاهةٌ مُظْلِمَةٌ"
      generation_method: tarkib
      justification: >
        تركيب وصفي موازٍ للمصطلح الموجود «فكاهة سوداء» لكن يستعيض عن الوصف اللوني «سوداء» بـ«مظلمة»
        (من الظلام، بمعنى مخيف/قاتم) مما يُصرِّح بالدلالة المجازية بدلاً من الاستعارة اللونية.
        اختبار التثبيت المعجمي: غير مسجّل في المعاجم المتخصصة المتاحة.


