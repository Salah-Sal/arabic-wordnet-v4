# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: فكاهة سوداء ──
    - lemma: "فكاهة سوداء"
      decision: confirmed
      decision_reason: >
        المصطلح مؤصَّل معجمياً في المعجم الموحد لمصطلحات اللسانيات (ALECSO 2002) بترجمة «black humour»
        وتعريف اصطلاحي واضح. المكوّنان عربيان أصيلان (فكه + سود)، وجاء التركيب الوصفي «فكاهة سوداء»
        كلكةً مُعرَّبة ثابتة الاستخدام في النقد الأدبي العربي الحديث. اجتاز اختبار التثبيت المعجمي (مسجّل
        في قاموس متخصص). يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «فُكاهةٌ سَوداءُ» هي الصيغة العربية المصطلحية الموثقة للمفهوم، وتُعبِّر عن الأسلوب الأدبي
        بمكوّنَيه العربيّين مع الاستعارة اللونية (سوداء = قاتمة/مظلمة). تختلف عن «سُخرية» أو «هجاء»
        في كونها تُقرِن الهزل بالموضوع المأساوي/المرضي تحديداً لإنتاج أثر مقلق لا مجرد انتقاد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُكاهةٌ سَوداءُ"

    # ── لمّة موجودة: كوميديا سوداء ──
    - lemma: "كوميديا سوداء"
      decision: removed
      decision_reason: >
        «كوميديا» كلمة معرَّبة من اليونانية-اللاتينية-الإيطالية، ولا تُعدّ عربية أصيلة.
        فضلاً عن ذلك لم يُعثر على توثيق معجمي لـ«كوميديا سوداء» كمصطلح مسكوك في أيٍّ من
        المعاجم المستعلَمة (107 معجم)، بينما «فكاهة سوداء» مؤصَّلة ومتاحة.
        مبدأ إيثار العربي على الأجنبي يوجب إزالتها حين يتوفر البديل العربي الموثَّق.
        المعجم المعاصر لأحمد مختار عمر يُحيل «كوميديا» إلى «مَلْهاة» دون تعريف مستقل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: مُجون ──
    - lemma: "مُجُونٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن «مجون» يعني «اللامبالاة بالمعايير» و«البذاءة والسفاهة» لا الأسلوب الأدبي
        المتمثل في تجاور المرضي والهزلي. الانزياح الدلالي المطلوب واسع جداً ويُنتج اشتراكاً لفظياً مع معنى
        راسخ مغاير. لا يجتاز اختبار الملاءمة ومبدأ الاطّراد.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١: الهَزَل الكئيب ──
    - lemma: "الهَزَلُ الكَئِيبُ"
      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي للتعبير المركب. يخفق في اختبار التثبيت المعجمي: «الهزل المحزون»، «الهزل المظلم»،
        «الهزل القاتم» تؤدي الوصف ذاته، مما يُثبت أنه عبارة وصفية حرة لا مصطلح مسكوك.
        «فكاهة سوداء» هي الصيغة المعجمية المتداولة والموثقة للمفهوم ذاته.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشح المرحلة ١: الضَّحك الأَليم ──
    - lemma: "الضَّحِكُ الأَلِيمُ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي أدبي لا مصطلح مسكوك؛ لا توثيق معجمي. «الضحك المؤلم»، «الضحك المر»، «الضحك الحزين»
        تُعبِّر عن المعنى ذاته، مما يُسقطه من اختبار الاستبدال. لا يُضيف قيمة على «فكاهة سوداء» المؤصَّلة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشح المرحلة ١: فُكاهة مُظلِمة ──
    - lemma: "فُكاهةٌ مُظْلِمَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «مظلمة» أكثر تصريحاً بالدلالة المجازية من «سوداء»، فإن المصطلح المسكوك المُعتمد معجمياً هو
        «فكاهة سوداء» (ALECSO). «فكاهة مظلمة» غير مسجلة في أي معجم متخصص ولا تجتاز اختبار التثبيت المعجمي.
        الترادف مع الصيغة الموثقة يجعل إضافتها تكراراً لا قيمة مضافة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


