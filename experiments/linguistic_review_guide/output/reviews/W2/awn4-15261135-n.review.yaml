# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15261135-n (millisecond)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «ملي ثانية» بدون تشكيل — تحتاج إلى تشكيل كامل"
      - "المصطلح مبني على سابقة معرَّبة (مِلِّي) من اللاتينية — ينبغي التحقق من وجود بديل عربي صرف"
      - "المجموعة تحتوي على لمّة واحدة فقط — قد يكون هناك صيغ بديلة (مدموجة أو بهجاء مختلف)"
    observations: "المفهوم هو وحدة قياس زمنية دقيقة تساوي جزءاً من ألف من الثانية. هذا المصطلح تقني حديث لا مقابل له في التراث العربي، إذ لم تكن وحدات القياس الزمنية الدقيقة معروفة قبل العصر الحديث. الصيغة العربية تعتمد على تعريب السابقة اللاتينية milli- وإلحاقها بكلمة «ثانية» العربية، على غرار وحدات مشابهة كنانو ثانية وبيكو ثانية."
  blind_candidates:
    - lemma: "مِلِّي ثَانِيَة"
      generation_method: taarib
      justification: "تعريب السابقة اللاتينية milli- (بمعنى جزء من ألف) وتركيبها مع «ثَانِيَة» العربية. هذا النمط مُنتِج في المصطلحات العلمية العربية الحديثة."
    - lemma: "مِلِّيثَانِيَة"
      generation_method: taarib
      justification: "الصيغة المدمجة (بلا فراغ) من المرشح السابق، على نمط الكتابة في بعض المعاجم الحديثة. الدمج يجعلها وحدة معجمية واحدة أوضح."
    - lemma: "أُلْفِيَّةُ الثَّانِيَة"
      generation_method: tarkib
      justification: "مركب إضافي من «أُلْفِيَّة» (مصدر صناعي من أَلْف بمعنى جزء من ألف) و«الثانية». محاولة لصكّ مصطلح عربي صرف، لكنه غير مسكوك ولا شائع."
    - lemma: "ثُوَيْنِيَة"
      generation_method: ishtiqaq
      justification: "تصغير «ثانية» على وزن فُعَيْلِيَة للدلالة على الوحدة الزمنية الصغيرة جداً. لكنه لا يحدد النسبة (واحد على ألف) بدقة، فهو أقرب إلى «لحيظة» منه إلى مصطلح دقيق."

stage2_evidence:
  per_lemma:
    - lemma: "مِلِّي ثَانِيَة"
      confirm:
        - text: "«مِلّي ثانية — مختصره: ms أو msec. جزءٌ من ألفٍ من الثانية.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«مِلِّي ثانية — انظر: millisecond.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«ميلِّي ثانِيَة — millisecond / milliseconde»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "مِلِّيثَانِيَة"
      confirm:
        - text: "«المِلّيثانية: جزء من ألف من الثانية.»"
          source: "المورد الحديث (2008)"
    - lemma: "أُلْفِيَّةُ الثَّانِيَة"
      evidence_status: "no_material_found"
    - lemma: "ثُوَيْنِيَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مِلِّي ثَانِيَة"
      decision: confirmed
      decision_reason: "اللمّة الموجودة «ملي ثانية» مؤكدة بعد تصحيح التشكيل. وردت في معجم مصطلحات المعلوماتية والمعجم الطبي الموحد بتعريف مطابق تماماً لدلالة المجموعة الترادفية. هي الصيغة الأكثر شيوعاً في المصطلحات العلمية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الصيغة المفصولة (بفراغ) وهي الأكثر شيوعاً في المعاجم المصطلحية الرسمية مثل معجم المعلوماتية والمعجم الطبي الموحد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِلِّي ثَانِيَة"

    - lemma: "مِلِّيثَانِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "الصيغة المدمجة وردت في المورد الحديث (2008) بتعريف مطابق: «جزء من ألف من الثانية». هي صيغة بديلة مقبولة تُستخدم في بعض المعاجم والنصوص التقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة المدمجة (بلا فراغ) — أقل شيوعاً لكنها مسجلة في المورد الحديث، وتُعامل كوحدة معجمية مفردة"
      actions:
        - command: create_entry
          params: {lemma: "مِلِّيثَانِيَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "أُلْفِيَّةُ الثَّانِيَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي لهذا المصطلح. هو تركيب مقترح لم يُسكّ ولم يتداوله أحد. كلمة «أُلْفِيَّة» مشهورة بدلالتها على المنظومة الشعرية (ألفية ابن مالك) لا على الكسر العشري."

    - lemma: "ثُوَيْنِيَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على شاهد معجمي. التصغير لا يحدد النسبة الدقيقة (واحد على ألف) ويمكن أن يدل على أي وحدة زمنية صغيرة. لا يصلح مصطلحاً علمياً دقيقاً."

stage4_content:
