    current: "جزء من ألف (10^-3) من الثانية"
    assessment:
      decision: retain
      reason: "التعريف الحالي واضح ودقيق ومطابق لما ورد في المعاجم المصطلحية (معجم المعلوماتية والمورد الحديث). يتضمن الجنس القريب (جزء من الثانية) والفصل النوعي (واحد على ألف / 10^-3)."
  examples:
    per_lemma:
      - lemma: "مِلِّي ثَانِيَة"
        examples:
          - text: "يبلغ زمن استجابة الخادم للطلبات الواردة نحو مئتي مِلِّي ثانية في الظروف الاعتيادية."
            type: usage
      - lemma: "مِلِّيثَانِيَة"
        examples:
          - text: "يمكن للحواسيب الحديثة تنفيذ ملايين العمليات في بضع مِلِّيثانيات."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يبلغ زمن استجابة الخادم للطلبات الواردة نحو مئتي مِلِّي ثانية في الظروف الاعتيادية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يمكن للحواسيب الحديثة تنفيذ ملايين العمليات في بضع مِلِّيثانيات."}

