# مراجعة المجموعة الترادفية: awn4-15197711-n
# المفهوم: إدراج في التقويم (مثل يوم كبيس) — an insertion into a calendar
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «إقحام» دلالتها الأصلية التورد في الشيء بجفاء وإقدام، وقد تُستعمل للإدراج في سياق تشريحي/طبي، لكن لم تُوثَّق في المعاجم الكلاسيكية بمعنى الإدراج التقويمي"
      - "لمّة «كبس» دلالتها الأساسية الطمّ والردم بالتراب والضغط، والربط بالتقويم يأتي عبر المشتق «كبيسة» (سنة كبيسة) لا عبر المصدر «كَبْس» نفسه"
      - "التعريف العربي الحالي يستخدم «إدراج» وهو أوضح من كلتا اللمّتين الموجودتين"
    observations: >
      المفهوم يتعلق بعملية زيادة وحدة زمنية (يوم أو شهر) في التقويم لتصحيح الفارق بين السنة الشمسية والتقويمية.
      في التراث العربي هناك مصطلحان مرتبطان: «النَّسِيء» وهو تأخير حرمة الشهر الحرام وإن كان مفهومه أوسع،
      و«الكَبْس» الذي اشتُقّت منه «سنة كبيسة». كلمة «إقحام» في المعاجم القديمة تدل على الاقتحام والتورد لا على الإدراج المنظم.
  blind_candidates:
    - lemma: "نَسِيء"
      generation_method: majaz
      justification: >
        لفظ قرآني (التوبة:٣٧) يدل على تأخير الأشهر الحرم وتعديل التقويم عند العرب.
        ابن فارس ربطه بالتأخير والزيادة، والتهانوي صرّح بأنه يُطلق على شهر الكبيسة.
        فيه إزاحة دلالية من التأخير إلى الزيادة التقويمية.
    - lemma: "إِلْحَاق"
      generation_method: ishtiqaq
      justification: >
        من الجذر «لحق» على وزن إفعال، بمعنى ضمّ شيء إلى شيء وإضافته.
        المورد الحديث ترجم embolism بـ«الإلحاق: إضافة الأيام أو الشهور أو السنوات إلى حساب زمني».
    - lemma: "تَخْلِيل"
      generation_method: ishtiqaq
      justification: >
        من الجذر «خلل» على وزن تفعيل، بمعنى إدخال شيء بين شيئين.
        ورد في المعجم الموحد لمصطلحات الرياضيات والفلك (١٩٩٠) ترجمةً لـ intercalation.
    - lemma: "تَدَاخُل"
      generation_method: ishtiqaq
      justification: >
        من الجذر «دخل» على وزن تفاعل، بمعنى دخول شيء في شيء آخر.
        ورد في عدة معاجم موحدة (الجيولوجيا، المناخ) ترجمةً لـ intercalation.


stage2_evidence:
  per_lemma:
    - lemma: "إِقْحَام"
      confirm:
        - text: "«إِقْحام — intercalation»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«إِقْحام — intercalation»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُقْحَمٌ [بين عناصر أخرى] intercalary matter in a text»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الجهاز العصبيّ الكلامي الذي يحتوي الكلمة أَو الصوت الذي يتوَسَّط الكلمات أَو العبارات»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          conflict: "التعريف خاص بالتشريح العصبي لا بالتقويم"
      expands:
        - text: "«(قَحَمَ) الْقَافُ وَالْحَاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَوَرُّدِ الشَّيْءِ بِأَدْنَى جَفَاءٍ وَإِقْدَامٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الجذري يدل على التورد والاقتحام لا على الإدراج المنظم"

    - lemma: "كَبْس"
      confirm:
        - text: "«كبَس السنة بيوم: زاد في أيامها يوماً»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«(كَبَسَ) الْكَافُ وَالْبَاءُ وَالسِّينِ أَصْلٌ صَحِيحٌ، وَهُوَ مِنَ الشَّيْءِ يُعْلَى بِالشَّيْءِ الرَّزِينِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدل على الطمّ والردم، لكن المعاصر وسّعه ليشمل الزيادة التقويمية"
        - text: "«البِئْرَ ونحوَها -ِ كَبْساً: رَدَمَها بالتراب. الشىءَ: ضَغَطَهُ»"
          source: "المعجم الوسيط"
          addition: "الوسيط لم يذكر الدلالة التقويمية في مادة كَبَس مباشرة"
        - text: "«كبيس: مضافٌ إلى التقويم an intercalary day. كبيسة: مضافٌ إليها يوم an intercalary year»"
          source: "المورد الحديث (2008)"
          addition: "الصفة «كبيس/كبيسة» هي المستعملة تقويمياً لا المصدر «كَبْس»"

    - lemma: "نَسِيء"
      confirm:
        - text: "«النّسيء: بالسين على وزن فعيل في اللغة بمعنى التأخير وقيل بمعنى الزيادة، والعرب يطلقونه أيضا على شهر الكبيسة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(النسيء) التَّأْخِير وَتَأْخِير حُرْمَة الْمحرم إِلَى صفر أَيَّام الْجَاهِلِيَّة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«وَالنَّسِيءُ فِي كِتَابِ اللَّهِ: التَّأْخِيرُ، كَانُوا إِذَا صَدَرُوا عَنْ مِنَى يَقُومُ رَجُلٌ مِنْ كِنَانَةَ فَيَقُولُ: أَنَا الَّذِي لَا يُرَدُّ لِي قَضَاءٌ. فَيَقُولُونَ: أَنْسِئْنَا شَهْرًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "النسيء مفهوم تقويمي عربي أصيل يتعلق بتعديل ترتيب الأشهر لا بإدراج أيام زائدة"

    - lemma: "إِلْحَاق"
      confirm:
        - text: "«الإلحاق: إضافة الأيام أو الشّهور أو السَّنوات إلى حسابٍ زمنيّ. الزمنُ المُضاف»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الإلحاق: جعل مثال على مثال أزيد ليعامل معاملته»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "المعنى الأصلي صرفي/نحوي (جعل كلمة على وزن أخرى)"

    - lemma: "تَخْلِيل"
      confirm:
        - text: "«تخليل — intercalation»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"

    - lemma: "تَدَاخُل"
      confirm:
        - text: "«تداخل — intercalation: عملية إدراج أو إضافة جزء إلى جسم متكون من عدد من الأجزاء»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
        - text: "«تَدَخُّل — intercalation: تدخل طبقة لابية (بركانية) بين طبقات رسوبية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      contradicts:
        - text: "«تداخل/تدخل» في سياقات الجيولوجيا والكيمياء لا التقويم"
          source: "المعاجم الموحدة"
          conflict: "المصطلح مستعمل في مجالات غير تقويمية وقد يلتبس"


stage3_analysis:
  per_lemma:
    - lemma: "إِقْحَام"
      decision: confirmed
      decision_reason: >
        رغم أن الأصل الجذري يدل على التورد بجفاء، فإن اللفظ مثبت في معاجم علمية موحدة
        (التشريح، الطب) بمعنى intercalation، وفي المورد بمعنى «مُقْحَم». المصطلح مقبول
        في الاستعمال المعاصر بمعنى الإدراج القسري لعنصر بين عناصر أخرى.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستعمل للدلالة على إدراج عنصر بين عناصر أخرى بنوع من القسر أو الإكراه،
        يحمل ظلالاً من التدخل غير العضوي. أقرب إلى السياق العلمي والرسمي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِقْحَام"

    - lemma: "كَبْس"
      decision: confirmed
      decision_reason: >
        ثبت في معجم اللغة العربية المعاصرة تعبير «كبس السنة بيوم» أي زاد في أيامها يوماً.
        والمشتقات «كبيس/كبيسة/سنة كبيسة» شائعة ومثبتة في معاجم متعددة. المصدر «كَبْس»
        مقبول بوصفه اسماً للعملية التقويمية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصطلح عربي أصيل مرتبط بالتقويم تحديداً عبر المشتق «كبيسة».
        أكثر تخصيصاً وشيوعاً في السياق التقويمي من «إقحام».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَبْس"

    - lemma: "نَسِيء"
      source: stage1
      decision: removed
      decision_reason: >
        النسيء مفهوم مختلف: تأخير حرمة شهر حرام إلى شهر آخر (تبديل ترتيب الأشهر)،
        لا إضافة أيام زائدة إلى التقويم. وإن ذكر التهانوي أنه يُطلق على شهر الكبيسة،
        فإن الدلالة القرآنية والمعجمية الغالبة هي التأخير لا الإدراج.
        إدراجه قد يُوهم بالخلط بين مفهومين مختلفين.

    - lemma: "إِلْحَاق"
      source: stage1
      decision: confirmed
      decision_reason: >
        المورد الحديث صرّح بأن embolism بمعناه التقويمي هو «الإلحاق: إضافة الأيام أو الشهور
        أو السنوات إلى حساب زمني». اللفظ عربي فصيح من الجذر «لحق»، والمعنى واضح
        ومباشر (ضمّ شيء إلى شيء). مقبول لغوياً ومعجمياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على إضافة عنصر زمني إلى منظومة قائمة بسلاسة، دون ظلال القسر الموجودة في «إقحام».
        أقرب إلى المعنى الحيادي للعملية التقويمية.
      actions:
        - command: create_entry
          params: {lemma: "إِلْحَاق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَخْلِيل"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وروده في المعجم الموحد لمصطلحات الرياضيات والفلك، فإن دلالة الجذر «خلل»
        على الفرجة بين الشيئين لا تناسب مفهوم الإضافة التقويمية بدقة.
        كما أن اللفظ قليل الشيوع في هذا السياق مقارنة بـ«كبس» و«إلحاق».

    - lemma: "تَدَاخُل"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ مستعمل في الجيولوجيا والكيمياء (تداخل الطبقات) وفيه التباس مع معان أخرى
        (التدخل، التداخل المتبادل). المفهوم التقويمي ليس تداخلاً بل إضافة، فالمصطلح غير دقيق.


