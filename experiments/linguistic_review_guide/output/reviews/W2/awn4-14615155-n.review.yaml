stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة (غرواني مائي) تفتقر إلى التشكيل الكامل."
      - "الاكتفاء بلمّة واحدة قد لا يغطي الاستخدامات التقنية المتعددة (مثل هلام مائي)."
    observations: "المفهوم علمي دقيق يشير إلى حالة تشتت غروانية يكون فيها الماء هو وسط الانتشار. المصطلحات العربية المسجلة تتبع الترجمة الحرفية (غرواني مائي) أو الوصف الوظيفي (هلام مائي)."
  blind_candidates:
    - lemma: "غَرَوَانِيّ مَائِيّ"
      generation_method: tarkib
      justification: "ترجمة مباشرة للمصطلح العلمي الإنجليزي (Hydrocolloid)."
    - lemma: "هُلَام مَائِيّ"
      generation_method: tarkib
      justification: "وصف للحالة الفيزيائية التي تتشكل عند خلط المادة بالماء (Hydro-gel)."
    - lemma: "مُهَلِّم مَائِيّ"
      generation_method: tarkib
      justification: "وصف وظيفي للمادة كعامل مسبب للهلام في الوسط المائي."
    - lemma: "غَرَوَانِيّ"
      generation_method: ishtiqaq
      justification: "اللفظ العام للغرويات، ويُستخدم أحياناً للإشارة لهذا النوع بالتحديد."

stage2_evidence:
  per_lemma:
    - lemma: "غرواني مائي"
      confirm:
        - text: "«غَرَوانِيٌّ مائِيّ: hydrocolloid»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«طَبْعَةٌ غَرَوانِيَّةٌ مائِيَّة: hydrocolloid impression»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يوضح استخدامه في طب الأسنان."
    - lemma: "هلام مائي"
      confirm:
        - text: "«هُلام مائيّ، جَلٌّ مائيّ: هلام مشكل من غرويات أليفة للماء.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
    - lemma: "غرواني"
      expands:
        - text: "«حالة تكون فيها المادة بين الاذابة الحقيقية والتعليق وغالبا ما تكون من جزيئات مجتمعة على شكل جسيمات صغيرة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "تعريف عام للغرواني."
    - lemma: "مهلم"
      confirm:
        - text: "«مُهَلِّم: gel-forming agent; gellant; gelling agent»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "غرواني مائي"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد في المعاجم الطبية والتقنية كترجمة دقيقة لـ Hydrocolloid."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَرَوَانِيّ مَائِيّ"
    - lemma: "هُلَام مَائِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني مستخدم في تقانات الأغذية والكيمياء لوصف نفس المادة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "هُلَام مَائِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14615155-n"

stage4_content:
  definition:
    current: "مادة تشكل هلاماً مع الماء"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لكنه يفتقر إلى الصياغة المصطلحية الدقيقة التي تربط بين الحالة الغروانية والوسط المائي."
    authored:
      - type: terminological
        text: "مَادَّةٌ غَرَوَانِيَّةٌ تَتَشَتَّتُ فِي المَاءِ فَتُكَوِّنُ هُلَامًا (جِلًا)، وَتُستَخدَمُ فِي الصِّنَاعَاتِ الغِذَائِيَّةِ وَالطِّبِّيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-14615155-n"
          definition_index: 0
          text: "مَادَّةٌ غَرَوَانِيَّةٌ تَتَشَتَّتُ فِي المَاءِ فَتُكَوِّنُ هُلَامًا (جِلًا)، وَتُستَخدَمُ فِي الصِّنَاعَاتِ الغِذَائِيَّةِ وَالطِّبِّيَّةِ."
  examples:
    per_lemma:
      - lemma: "غَرَوَانِيّ مَائِيّ"
        examples:
          - text: "يُستَخْدَمُ الأَلْجِينَاتُ كَغَرَوَانِيٍّ مَائِيٍّ فِي صِنَاعَةِ قَوَالِبِ الأَسْنَانِ."
            type: usage
      - lemma: "هُلَام مَائِيّ"
        examples:
          - text: "يَتَمَيَّزُ الهُلَامُ المَائِيُّ بِقُدْرَتِهِ العَالِيَةِ عَلَى امْتِصَاصِ السَّوَائِلِ فِي الضِّمَادَاتِ الطِّبِّيَّةِ."
