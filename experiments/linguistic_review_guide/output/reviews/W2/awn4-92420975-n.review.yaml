# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'الطابع الألماني' عبارةٌ وصفية حرة لا تستوفي معيار السكّ والتثبيت المعجمي، إذ يمكن إبدال 'الألماني' بأي وصف قومي آخر ('الطابع الياباني'، 'الطابع الفرنسي') دون أن يفقد التعبيرُ قبولَه أو دلالتَه الوصفية."
      - "التعريف الحالي 'الجودة أو الخاصية لكون الشيء ألمانياً' ترجمةٌ حرفية للإنجليزية؛ وكلمة 'الجودة' في العربية المعاصرة تحمل دلالة التميّز والإتقان (excellence) لا الخاصية المجردة (property/quality)."
      - "المجموعة تفتقر إلى لمّة مفردة أو مصدر صناعي يُعبّر عن الخاصية المجردة 'الأَلْمَانِيَّة' بوصفها وحدة معجمية ثابتة."
    observations: >-
      المجموعة ترادفية تُعبّر عن مفهوم مجرد هو «الأَلْمَانِيَّة» (Germanness)، وهو
      خاصية انتسابية تندرج تحت الخواص الجوهرية. تمتلك العربية نمطًا صرفيًا
      منتجًا ومطّردًا لتوليد هذه المفاهيم: إلحاق تاء المصدريّة (-يَّة) بالصفة
      النسبية، فتصير «أَلْمَانِيّ» → «أَلْمَانِيَّة»، قياسًا على: الفرنسيّة،
      الإنجليزيّة، الصينيّة، اليابانيّة. اللمّة الموجودة «الطابع الألماني» شائعة
      في الاستخدام لكنها تعبير وصفي حر لا مصطلح مسكوك، وهي تحيل في الغالب إلى
      الشخصية الألمانية الملموسة لا إلى الخاصية المجردة.

  blind_candidates:
    - lemma: "الأَلْمَانِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من الصفة النسبية «أَلْمَانِيّ» بإلحاق تاء المصدرية، على النمط
        الصرفي المنتج للدلالة على الخاصية المجردة المنتسبة لشعب أو ثقافة. معتمد
        قياسًا على: الفرنسيّة، الإنجليزيّة، اليابانيّة.
    - lemma: "الجَرْمَانِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من «جَرْمَان» الصيغة الكلاسيكية للشعوب الجرمانية في المصادر
        العربية القديمة، يدل على الخاصية المنتسبة إلى الحضارة الجرمانية الأوروبية.
    - lemma: "الطَّابَعُ الأَلْمَانِيّ"
      generation_method: tarkib
      justification: >-
        مركّب وصفي من «طابع» (= الخاصية المميّزة، الطبيعة الغالبة) و«ألماني»،
        يدل على مجموع السمات المميِّزة المنتسبة إلى الثقافة الألمانية.
    - lemma: "السِّمَةُ الأَلْمَانِيَّة"
      generation_method: tarkib
      justification: >-
        مركّب وصفي من «سِمَة» (= العلامة المميّزة، الصفة الغالبة) و«ألمانية»،
        يؤدي دلالة الخاصية المجردة للانتساب إلى الألمانية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────

stage2_evidence:
  queries_run:
    - "Q1: Batch headword lookup — الطابع الألماني + الألمانية + الجرمانية + السمة الألمانية + طابع + جرماني"
    - "Q2: English bridge — Germanness / German character / German quality / Germanic"
    - "Q3: Arabic FTS — الألمانية / الجرمانية / الطابع الألماني"
    - "Q4: Maqayis lookup — جذر طبع (dictionary_id=151)"

  per_lemma:
    - lemma: "الطابع الألماني"
      expands:
        - text: "«الطَّابَع: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ. العَلَامَةُ الْمُمَيِّزَةُ.»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
          addition: "يُثبت أن 'طابع' يفيد الخاصية المميزة والطبيعة الغالبة، مما يجعله مرتبطًا بالمفهوم الكلّي، لكن الدليل يخص المفردة المجردة لا المركّب."
        - text: "«الطابَع: الطبيعة. ويقال له طَابع حسن. ما يُطبَع به أو يُخْتَمُ، الميسم، الخلق الغالب.»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة)"
          addition: "يُثبت أن 'الطابع' يفيد الطبيعة الغالبة والخلق الراسخ، وهو أقرب المعاني للدلالة المقصودة في المركّب."

    - lemma: "الأَلْمَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الجَرْمَانِيَّة"
      expands:
        - text: "«جِرْمَانِيّ: نسبة إلى الجرمان: مجموعة كبيرة من الأجناس بأوربا لهم دور كبير في التاريخ الأوربي منذ العهد الروماني وحتى الآن.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (جامعة السلطان قابوس، 1985)"
          addition: "يكشف أن 'الجرماني' يحيل إلى مجموعة أجناس أوروبية أوسع من الألمان وحدهم، مما يُميّزه عن 'الألماني'."

    - lemma: "السِّمَةُ الأَلْمَانِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────

stage3_analysis:
  per_lemma:

    - lemma: "الطابع الألماني"
      decision: removed
      decision_reason: >-
        يفشل في اختبار السكّ: يمكن إبدال «الألماني» بأي صفة قومية أخرى
        («الطابع الياباني»، «الطابع الفرنسي»، «الطابع الإيطالي») دون أن يفقد
        التعبير مقبوليّته النحوية أو الدلالية، وهذا دليل على أنه عبارة وصفية
        حرة لا مصطلح مسكوك. فضلًا عن ذلك، لا يوجد مدخل معجمي ثابت للمركّب
        في المعاجم المتخصصة. حذف الحلقة الدلالية (sense) يُبقي مدخل «الطابع»
        المفرد في قاعدة البيانات دون تعديل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الأَلْمَانِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        مصدر صناعي منتج ومطّرد من الصفة النسبية «أَلْمَانِيّ» بإلحاق تاء
        المصدرية، معتمد في العربية المعاصرة لصياغة الخواص الانتسابية المجردة
        للأمم والحضارات (الفرنسية، الإنجليزية، الصينية...). يستوفي معيار
        الاطّراد الصرفي، ويُسر التداول، والملاءمة لدلالة المجموعة الترادفية.
        غياب مدخل معجمي مستقل له لا يُضعف قبوله إذ النمط الصرفي بالغ الإنتاجية
        في العربية المعاصرة ولا يُتوقع له مدخل في المعاجم الكلاسيكية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        «الأَلْمَانِيَّة» تُعبّر عن الخاصية المجردة الانتسابية في أنقى صورها
        المفهومية (كون الشيء أو الشخص ألمانيًا بالأصل أو الانتماء)، في حين كان
        «الطابع الألماني» المحذوف يميل إلى الوصف الملموس للشخصية أو الأسلوب
        الألماني دون الإحالة إلى الخاصية المجردة ذاتها.
      actions:
        - command: create_entry
          params:
            lemma: "الأَلْمَانِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-92420975-n"

    - lemma: "الجَرْمَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        «الجرماني» في المصادر العربية يحيل إلى مجموعة الأجناس الجرمانية
        الأوروبية الواسعة (Germanic peoples) وليس إلى الألمان تحديدًا. المجموعة
        الترادفية تُحدّد المفهوم بـ«ألماني» (German) لا «جرماني» (Germanic)،
        وثمة فارق دلالي معتبر: الجرمانية تشمل الأنجلوسكسونية والنوردية
        والهولندية وغيرها، بينما الألمانية خاصة بألمانيا.

    - lemma: "السِّمَةُ الأَلْمَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        عبارة وصفية حرة تفشل في اختبار السكّ (السمة الفرنسية، السمة اليابانية
        صيغتان صحيحتان نحويًا بنفس الهيكل). لا تثبت صياغتها الاصطلاحية ولا
        يوجد لها مدخل في المعاجم.


