stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يحتوي على خطأ طباعي: «تًكتب» والصواب «تُكتب»"
      - "المجموعة تضم لمّة واحدة فقط (كتابة)، وقد يكون مصطلح «خَطّ» أدقّ أو مكمّلاً لها"
    observations: >
      المفهوم يتناول الحروف والرموز المكتوبة على سطح لتمثيل أصوات اللغة أو كلماتها،
      وهو مفهوم أساسي في الحضارة العربية ذات التراث الخطّي الغني.
      العلاقة الرأسية (hypernym) هي «التواصل الكتابي / اللغة المكتوبة»، فهذا المفهوم
      أخصّ منها إذ يركّز على الرموز ذاتها لا على فعل التواصل.
  blind_candidates:
    - lemma: "خَطّ"
      generation_method: ishtiqaq
      justification: >
        من الجذر خ-ط-ط على وزن فَعْل، ومعناه الأصلي تصوير اللفظ بحروف هجائه،
        وهو مصطلح عربي أصيل يدلّ على الكتابة والرسم الخطّي تحديداً.
    - lemma: "كِتَابَة"
      generation_method: ishtiqaq
      justification: >
        مصدر كَتَبَ على وزن فِعَالَة، يدلّ على صناعة الكاتب وعلى المكتوب ذاته.
        الجذر ك-ت-ب أصله الجمع، فالكتابة جمع الحروف والرموز.
    - lemma: "رَسْم"
      generation_method: ishtiqaq
      justification: >
        من الجذر ر-س-م على وزن فَعْل، يدلّ على الأثر والعلامة وتمثيل الشيء بالقلم.
        قد يصلح للدلالة على الرموز المكتوبة بمعنى «رسم الخطّ».
    - lemma: "نَقْش"
      generation_method: majaz
      justification: >
        من الجذر ن-ق-ش، أصله استخراج الشيء وتحسينه، ثم أُطلق على ما يُحفر
        ويُرسم على الأسطح، فقد يُمَدّ مجازاً إلى الحروف المطبوعة على سطح.

stage2_evidence:
  per_lemma:
    - lemma: "كِتَابَة"
      confirm:
        - text: "«(الكِتَابَة) صناعة الكاتب»"
          source: "المعجم الوسيط"
        - text: "«كتابة عامة أو خاصة، كتعبير عن حضارة ونقلة نوعية من الشفهي إلى المرآة المدادية قبل ظهور الإلكترونية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«(1) كتابة (2) خَطّ (3) رسالة؛ مذكِّرة (4) كتاب؛ مؤلَّف ... (9) صناعة الكتابة أو التّأليف»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(كَتَبَ) الكافُ والتاءُ والباءُ أصلٌ صحيحٌ واحدٌ يدلُّ على جمعِ شيءٍ إلى شيء. من ذلك الكتابُ والكتابةُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدلّ على الجمع، فالكتابة جمع الحروف"

    - lemma: "خَطّ"
      confirm:
        - text: "«الكتابة ونحوها مما يُخَطّ، تصويرُ اللفظِ بحروفِ هجائِه، رسومٌ وأشكالٌ حرفيّةٌ تدلُّ على الكلماتِ المسموعةِ الدّالّةِ على ما في النّفس»"
          source: "المعجم الكبير"
        - text: "«السطر، الكتابة ونحوها مما يُخَطّ»"
          source: "المعجم الوسيط"
        - text: "«الخط: تصوير اللفظ بحروف هجائه. ويقال تصوير أشكال الحروف الهجائية الدالة على اللفظ»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الخط: لغة تصوير اللفظ بحروف هجائه. [في الإنكليزية] Writing, handwriting [في الفرنسية] Écriture, calligraphie»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«كل تمثيل خطي للكلمة أو للجملة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(خَطَّ) الخاءُ والطاءُ أصلٌ واحدٌ؛ وهو أثرٌ يمتدُّ امتداداً. فمن ذلك الخطُّ الذي يخطُّه الكاتبُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي: أثر ممتدّ، ومنه خطّ الكاتب"

    - lemma: "رَسْم"
      contradicts:
        - text: "«الأثر الباقي من الدار بعد أن عَفَت ... تمثيل شيءٍ أو شخص بالقلم ونحوه»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأساسي هو الأثر والعلامة والرسم بالقلم (التصوير)، لا الكتابة والحروف"
        - text: "«(رَسَمَ) الراءُ والسينُ والميمُ أصلان: أحدهما الأثر، والآخر ضربٌ من السير»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الاشتقاقي بعيد عن مفهوم الحروف والكتابة"

    - lemma: "نَقْش"
      contradicts:
        - text: "«النَّقْشُ: تلوينُ الشيءِ بلونَيْن أو بألوان»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "المعنى الأساسي هو التلوين والزخرفة، لا تمثيل أصوات اللغة"
        - text: "«(نَقَشَ) النون والقاف والشين أصلٌ صحيحٌ يدلّ على استخراج شيءٍ واستيعابه... ثم نقش الشيء: تحسينه»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل هو الاستخراج والتحسين، لا الكتابة"

stage3_analysis:
  per_lemma:
    - lemma: "كِتَابَة"
      decision: confirmed
      decision_reason: >
        لمّة ثابتة مسجّلة في المعاجم الكبرى بمعنى صناعة الكاتب والمكتوب.
        وإن كان تعريف المعجم الوسيط يركّز على «صناعة الكاتب» (الفعل/الحِرفة)،
        فإن الاستعمال المعاصر يشمل النتيجة (المكتوب) كما يتبيّن من المورد الحديث
        ومعجم اللسانيات. اللمّة تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تركّز على فعل الكتابة وصناعتها ونتيجتها بوصفها عملية تواصلية شاملة،
        في مقابل «خطّ» الذي يركّز على الشكل المرئي للحروف المرسومة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِتَابَة"

    - lemma: "خَطّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        أدلّة معجمية قوية جداً ومتعددة المصادر: المعجم الوسيط والمعجم الكبير
        والتهانوي والمناوي ومعجم اللسانيات كلها تعرّف الخطّ بأنه «تصوير اللفظ
        بحروف هجائه» و«رسوم وأشكال حرفية تدلّ على الكلمات المسموعة»،
        وهو مطابق تماماً لتعريف هذه المجموعة الترادفية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على الشكل المرئي للحروف والرموز المرسومة على السطح (تصوير اللفظ
        بحروف هجائه)، وعلى جمالية الرسم الخطّي، في مقابل «كتابة» التي تشمل
        العملية والصناعة بأكملها.
      actions:
        - command: create_entry
          params:
            lemma: "خَطّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رَسْم"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى الأساسي في المعاجم هو الأثر والعلامة والتصوير بالقلم (الرسم البصري)،
        لا تمثيل أصوات اللغة بحروف. كلمة «رسم» لا تُستعمل استعمالاً معجمياً ثابتاً
        بمعنى الكتابة كنظام رموز، وإنما بمعنى التمثيل البصري أو الأثر.
      evidence_assessment:
        case: contradicts_only

    - lemma: "نَقْش"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى الأساسي هو التلوين والزخرفة والحفر على الأسطح لأغراض جمالية،
        وأصله الاشتقاقي (الاستخراج والتحسين) بعيد عن مفهوم تمثيل أصوات اللغة.
        لا دليل معجمي على استعماله بمعنى الكتابة كنظام لغوي.
      evidence_assessment:
        case: contradicts_only

