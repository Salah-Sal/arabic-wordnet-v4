        value: '{"root":"زفي","maqayis":"«الزَّاءُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ يَدُلُّ عَلَى خِفَّةٍ وَسُرْعَةٍ. مِنْ ذَلِكَ زَفَتِ الرِّيحُ التُّرَابَ...»"}'
    - command: set_metadata
