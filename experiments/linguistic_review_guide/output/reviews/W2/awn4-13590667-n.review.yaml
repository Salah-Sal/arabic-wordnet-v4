      mwe: true
    - lemma: "اِنْتِقَال كُرُومُوسُومِيّ"
      sense_id: "{auto}"
      nuance: "شائع في الاستعمال الأكاديمي، ويعتمد على اللفظ المعرب للصبغي."
      mwe: true
  synset:
    cultural_fit: native
  actions:
