stage1_review:
  assessment:
    concerns:
      - "الاعتماد على مصطلح معرّب 'كروموسومي' في حين توجد بدائل عربية أصيلة مثل 'صبغي'."
    observations: "المفهوم يشير إلى 'translocation' في علم الوراثة، وهو انتقال شدفة أو جزء من صبغي إلى صبغي آخر غير مماثل. المعاجم المتخصصة تستخدم 'إزفاء' و'انتقال صبغي'."
  blind_candidates:
    - lemma: "مُبَادَلَة صِبْغِيَّة"
      generation_method: ishtiqaq
      justification: "ترجمة حرفية دقيقة للعملية التي يتم فيها تبادل الأجزاء."
    - lemma: "اِنْتِقَال صِبْغِيّ"
      generation_method: tarkib
      justification: "وصف للعملية التي ينتقل فيها جزء من الصبغي، وهو شائع في المصطلحات العلمية."
    - lemma: "زَحْزَحَة صِبْغِيَّة"
      generation_method: tarkib
      justification: "مصطلح يشير إلى تحريك أو إزاحة الأجزاء الصبغية من مكانها."
    - lemma: "إِزْفَاء"
      generation_method: majaz
      justification: "استخدام مجازي لجذر يدل على السرعة والنقل، وقد استُقر عليه في بعض المعاجم الطبية للتعبير عن translocation."

stage2_evidence:
  per_lemma:
    - lemma: "إزفاء"
      confirm:
        - text: "إزْفاء: translocation"
          source: "المعجم الطبي الموحد (2009)"
        - text: "إِزْفاءٌ صِبْغَوِيّ: chromosome translocation"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "انتقال كروموسومي"
      contradicts:
        - text: "لا يوجد توثيق مباشر للتركيب 'انتقال كروموسومي' في المعاجم، لكنه مستخدم بالقياس على 'انتقال صبغي'."
          source: "البحث الشامل"
          conflict: "الاعتماد على اللفظ الأجنبي بدلاً من 'صبغي'."
    - lemma: "مبادلة صبغية"
      evidence_status: "no_material_found"
    - lemma: "انتقال صبغي"
      confirm:
        - text: "انتقال صبغي: chromosome translocation"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "زحزحة صبغية"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "إِزْفَاء"
      decision: confirmed
      decision_reason: "مصطلح طبي وعلمي موثق ومستقر في المعجم الطبي الموحد للتعبير عن 'translocation'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِزْفَاء"
    - lemma: "اِنْتِقَال كُرُومُوسُومِيّ"
      decision: confirmed
      decision_reason: "بالرغم من كونه معرباً، إلا أنه شائع الاستخدام ومفهوم في الأوساط العلمية لوصف الحدث، ويمكن إبقاؤه كمرادف."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْتِقَال كُرُومُوسُومِيّ"
    - lemma: "مُبَادَلَة صِبْغِيَّة"
      source: stage1
      decision: removed
      decision_reason: "غير موثق معجمياً، والمعاجم تفضل 'انتقال صبغي'."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
    - lemma: "اِنْتِقَال صِبْغِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح علمي دقيق وموثق في المعجم الموحد لمصطلحات علم الأحياء يعبر عن المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "اِنْتِقَال صِبْغِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "زَحْزَحَة صِبْغِيَّة"
      source: stage1
      decision: removed
      decision_reason: "غير موثق معجمياً ولا يتماشى مع المصطلحات العلمية المعتمدة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

stage4_content:
  definition:
    current: "(علم الوراثة) تبادل أجزاء الكروموسوم"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق إلى حد ما لكنه مقتضب، ويمكن صياغته بأسلوب علمي أدق يشمل انتقال الأجزاء الصبغية."
    authored:
      - type: terminological
        text: "زيغ صبغي يحدث فيه انتقال قطعة من صبغي ما والتحامها بصبغي آخر غير مماثل له، مما يؤدي إلى تبادل الأجزاء الصبغية وإعادة ترتيب المادة الوراثية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "زيغ صبغي يحدث فيه انتقال قطعة من صبغي ما والتحامها بصبغي آخر غير مماثل له، مما يؤدي إلى تبادل الأجزاء الصبغية وإعادة ترتيب المادة الوراثية."
  examples:
    per_lemma:
      - lemma: "إِزْفَاء"
        examples:
          - text: "يُعد الإزفاء الصبغي أحد الأسباب الرئيسية لحدوث بعض الأمراض الوراثية."
            type: usage
      - lemma: "اِنْتِقَال صِبْغِيّ"
        examples:
          - text: "أظهر التحليل الوراثي حدوث انتقال صبغي بين الصبغيين التاسع والثاني والعشرين."
            type: usage
      - lemma: "اِنْتِقَال كُرُومُوسُومِيّ"
        examples:
          - text: "تم تشخيص الحالة بوجود انتقال كروموسومي غير متوازن أدى إلى تشوهات خلقية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعد الإزفاء الصبغي أحد الأسباب الرئيسية لحدوث بعض الأمراض الوراثية."

stage5_enrichment:
  per_entry:
    - lemma: "إِزْفَاء"
      entry_id: "{auto}"
      root: "زفي"
      maqayis_quote: "«الزَّاءُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ يَدُلُّ عَلَى خِفَّةٍ وَسُرْعَةٍ. مِنْ ذَلِكَ زَفَتِ الرِّيحُ التُّرَابَ...»"
    - lemma: "اِنْتِقَال صِبْغِيّ"
      entry_id: "{auto}"
      roots:
        - word: "انتقال"
          root: "نقل"
          maqayis_quote: "«النُّونُ وَالْقَافُ وَاللَّامُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَحْوِيلِ شَيْءٍ مِنْ مَكَانٍ إِلَى مَكَانٍ...»"
        - word: "صبغي"
          root: "صبغ"
          maqayis_quote: "«الصَّادُ وَالْبَاءُ وَالْغَيْنُ، أَصْلٌ وَاحِدٌ، وَهُوَ تَلْوِينُ الشَّيْءِ بِلَوْنٍ مَا...»"
  per_sense:
    - lemma: "إِزْفَاء"
      sense_id: "{auto}"
      nuance: "مصطلح طبي دقيق ومكافئ لـ (translocation) يكثر في المعاجم الطبية."
      mwe: false
