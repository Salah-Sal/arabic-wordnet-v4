          text: "في نظرية الزمر، الزمرةُ الجزئية هي مجموعة جزئية H غير خالية من زمرة (G, ∘)، بحيث تكون H مُغلَقةً تحت العملية ∘ وتحت أخذ النظير (العكس)، فتُكوِّن H بدورها زمرةً تحت تلك العملية ذاتها"

