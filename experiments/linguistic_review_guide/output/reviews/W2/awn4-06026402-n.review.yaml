# ── المرحلة ١: المراجعة والتوليد (عمياء) ───────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة 'زمرة جزئية' خالية من التشكيل"
      - "التعريف العربي ناقص: يصف الزمرةَ الجزئية بأنها 'مجموعة جزئية غير خالية' دون التصريح بأنها يجب أن تُحقق بدورها شروط الزمرة كاملةً (الإغلاق، التجميع، العنصر المحايد، النظير) تحت العملية ذاتها"
      - "استخدام 'مجموعة جزئية' في التعريف يُوقع في لبس مع Subset في نظرية المجموعات العامة، إذ هي مفهوم أوسع لا يشترط خصائص الزمرة"
    observations: "المجموعة الترادفية تُمثل مفهوماً دقيقاً من نظرية الزمر الجبرية (Group Theory). الزمرة الجزئية (Subgroup) تختلف عن المجموعة الجزئية البسيطة (Subset) اختلافاً جوهرياً: الأولى مجموعة جزئية مُغلَقة تُحقق شروط الزمرة كاملةً، أما الثانية فمجرد احتواء دون اشتراط بنية جبرية. الزمرة المشوفة (awn4-06026202-n) معرَّفة بخصائصها الأربع، ويجدر أن يُبنى تعريف الزمرة الجزئية عليها بالتصريح بأنها 'زمرةٌ بحد ذاتها'. اللمة الحالية 'زمرة جزئية' مركبٌ وصفي يتسق مع أسلوب معاجم الرياضيات العربية في توصيف الأنواع الفرعية."
  blind_candidates:
    - lemma: "زُمَيِّرَة"
      generation_method: ishtiqaq
      justification: "تصغير 'زمرة' على وزن فُعَيِّلَة، يُفيد دلالة 'الزمرة الصغيرة المضمَّنة في أخرى'؛ التصغير في العربية يُعبِّر أحياناً عن العلاقة الجزئية والاندراج، كما في طُوَيِّفة وشُوَيِّبة."
    - lemma: "زُمْرَة فَرْعِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي: فَرْعِيَّة نسبة إلى الفرع بمعنى الجزء التابع للأصل، يُقابل البادئة sub- في اللغات الأوروبية."
    - lemma: "فَرْعُ الزُّمْرَةِ"
      generation_method: tarkib
      justification: "مركب إضافي: فرع + الزمرة. يستند إلى استعمال 'الفرع' للدلالة على الجزء المنبثق عن الكل في المصطلحية العلمية العربية."
    - lemma: "زُمْرَة مُنْدَرِجَة"
      generation_method: tarkib
      justification: "مركب وصفي من 'اندرج' بمعنى انضوى وانتظم ضمن؛ يُوحي باندراج هذه الزمرة داخل زمرة أشمل وانتظامها ضمن بنيتها الجبرية."


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────────
# الاستعلامات المُنفَّذة (٤ استعلامات):
#  ١. مطابقة دقيقة دفعية: اللمة الموجودة + المرشحات الأربعة
#  ٢. جسر إنجليزي: subgroup / sub-group / sub group (entries_translations_fts)
#  ٣. مقاييس اللغة (dictionary_id=151): جذرا زمر وجزأ
#  ٤. بحث FTS عربي: زمرة، زمرة جزئية، زمرة فرعية
stage2_evidence:
  per_lemma:
    - lemma: "زمرة جزئية"
      confirm:
        - text: "«زمرة جزئية — subgroup — Mathematics and Astronomy»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«(1) العشيرة [في تصنيف النباتات والحيوانات]\n(2) الطُّوَيْئفة: جزء من طائفة أو جماعة أو مجموعة\n(3) الزُّمرة الجزئية (ر).»"
          source: "المورد الحديث (2008)"

    - lemma: "زُمَيِّرَة"
      expands:
        - text: "«زُمَيرة — subgroup — Gross Anatomy»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          addition: "الصيغة التصغيرية مستخدمة في المعجمية العلمية العربية للدلالة على subgroup، لكن حصراً في مجال التشريح العياني لا الرياضيات. كذلك ورد الشكل في المعجم 'زُمَيرة' (دون شدة على الياء) لا 'زُمَيِّرَة' (بالشدة القياسية)."

    - lemma: "زُمْرَة فَرْعِيَّة"
      evidence_status: "no_material_found"

    - lemma: "فَرْعُ الزُّمْرَةِ"
      evidence_status: "no_material_found"

    - lemma: "زُمْرَة مُنْدَرِجَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "زمرة جزئية"
      decision: confirmed
      decision_reason: "مصطلح رياضي موثَّق في المعجم الموحد لمصطلحات الرياضيات والفلك (1990) ومُدرَج في المورد الحديث (2008) بالرمز (ر) للدلالة على الاختصاص الرياضي. هو الترجمة العربية المعيارية لـ subgroup في نظرية الزمر. يُبقى مع تصحيح التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُميِّز هذا المصطلح الزمرةَ الجزئية (subgroup: مجموعة جزئية تُحقق شروط الزمرة كاملةً) عن المجموعة الجزئية البسيطة (subset: احتواء دون شروط جبرية)، وعن الزمرة الأصل (awn4-06026202-n). النعت 'جزئية' يُرسِّخ العلاقة الاحتوائية مع الزمرة الأشمل ضمن عائلة مصطلح 'الزمرة'."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زُمْرَة جُزْئِيَّة"

    - lemma: "زُمَيِّرَة"
      source: stage1
      decision: removed
      decision_reason: "الصيغة التصغيرية موثَّقة في معجم التشريح العياني (2015) بصيغة 'زُمَيرة' (دون شدة)، لا في الرياضيات. تمييز المجال ضروري في AWN4 حتى لا يُخلَط بين مصطلح التشريح ومصطلح الجبر. فضلاً عن ذلك يخالف الشكلُ المعجمي 'زُمَيرة' الوزنَ التصغيري القياسي 'فُعَيِّلَة' المُقترَح."

    - lemma: "زُمْرَة فَرْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي لهذا المركب في الرياضيات. مصطلح 'مجموعة فرعية' موثَّق في الكيمياء والصيدلة والكهرباء، غير أن في الرياضيات تختلف 'المجموعة' (set) عن 'الزمرة' (group) اختلافاً جوهرياً، مما يجعل النقل باستبدال 'مجموعة' بـ'زمرة' غير سائغ دون توثيق مستقل."

    - lemma: "فَرْعُ الزُّمْرَةِ"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي. التعبير لا يجتاز اختبار السكِّ: يمكن إبدال 'فرع' بـ'جزء' أو 'قسم' وتبقى العبارة وصفاً مقبولاً، مما ينفي كونها مصطلحاً مسكوكاً."

    - lemma: "زُمْرَة مُنْدَرِجَة"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي. المصطلح غير مستعمَل في المعجمية الرياضية العربية."


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "مجموعة جزئية (غير خالية) من زمرة رياضية"
    assessment:
      decision: revise
      reason: "التعريف الحالي قاصر من ناحيتين: أولاً، يصف الزمرة الجزئية بأنها 'مجموعة جزئية' فحسب دون التصريح بأنها يجب أن تُحقق بدورها شروط الزمرة (الإغلاق وما يترتب عليه)، وهو الفارق الجوهري بين subgroup وsubset؛ ثانياً، صياغة 'مجموعة جزئية (غير خالية)' تُحيل إلى مفهوم subset وتُوقع في اشتباه مصطلحي."
    authored:
      - type: terminological
        text: "مجموعةٌ جزئيةٌ لا تخلو من زمرةٍ رياضيةٍ، تُشكِّل هي بدورها زمرةً تحت العملية ذاتها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "في نظرية الزمر، الزمرةُ الجزئية هي مجموعة جزئية H غير خالية من زمرة (G, ∘)، بحيث تكون H مُغلَقةً تحت العملية ∘ وتحت أخذ النظير (العكس)، فتُكوِّن H بدورها زمرةً تحت تلك العملية ذاتها"
