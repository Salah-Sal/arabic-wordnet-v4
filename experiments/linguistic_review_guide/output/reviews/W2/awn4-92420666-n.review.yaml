# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'تعذر القياس' خالية من التشكيل؛ الصواب: تَعَذُّرُ الْقِيَاسِ"
      - "اللمّة 'لا قياسية' مكتوبة كلمتين بلا تشكيل؛ الأصح كتابتها لَاقِيَاسِيَّة كلمةً واحدةً، على قياس: لاسلكية، لاشعورية"
      - "كلتا اللمّتين تشتملان على 'قياس' من التعريف مما يُوجد دوريّةً في الصياغة تستوجب تحسين التعريف"
      - "المجموعة بلا ILI، مما يحول دون ربطها بـ OEWN وتوحيد دلالتها دولياً"
      - "المورد الحديث (2008) يُثبّت 'اللامَقِيسيَّة' مقابل incommensurability — صيغة مشتقة من 'مَقِيس' (اسم مفعول من قاس) أقوى صرفياً من 'قياسية'"
    observations: >-
      المجموعة تمثّل مفهوم «عدم قابلية القياس» بوصفه صفةً مجردةً، وهي فرع من مفهوم
      الجودة والنوعية. المحوران الجذريّان هما: (أ) قوس/قيس — القياس = تقدير الشيء
      بالشيء عند ابن فارس — و(ب) عذر بمعنى الشيء الذي لا يستقيم ولا يتحدَّد. تستحق
      المجموعة إعادة صياغة تعريفها هرباً من الدورية، وضبط كتابة لمّاتها وتشكيلها.
  blind_candidates:
    - lemma: "اللَّاقِيَاسِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي (-يَّة) من الصفة المنفية 'لاقياسيّ' (لا + قياسيّ)؛ يُعبِّر مباشرةً
        عن الخاصية المجردة لعدم قابلية الشيء للقياس، على قياس: لاسلكية، لاشعورية،
        لاتناظرية. جذره قوس/قيس موثَّق في مقاييس اللغة.
    - lemma: "عَجْزُ الْقِيَاسِ"
      generation_method: tarkib
      justification: >-
        مركب إضافي: مصدر 'عجز' (الجنس القريب) + المضاف إليه 'القياس' (المحدِّد)؛
        يُصوِّر العجزَ عن إنجاز فعل القياس بوصفه الحالةَ الجوهرية للمفهوم. أسلوب
        تركيبي منتِج في المصطلحات العلمية العربية.
    - lemma: "الإِطْلَاقِيَّة"
      generation_method: majaz
      justification: >-
        مصدر صناعي من 'مُطلَق' بمعنى مُتَحَرِّر من كل حدٍّ وقيد — إزاحة دلالية:
        ما لا يُقاس هو ما يَعلو عن كل حدٍّ ومقياس، أي ما كان في حال الإطلاق المطلق؛
        إيثاراً للفظٍ عربي قديم على الاشتقاق المباشر.
    - lemma: "اللَّاتَقْدِيرِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من 'لاتقديريّ' (لا + تقديريّ)؛ التقدير يُرادف القياس في اللغة
        — 'قاس الشيء قياساً: قدَّره' — ويُعبِّر بوجه آخر عن عدم إمكانية الإحاطة
        بالشيء تقديراً وضبطاً.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تعذر القياس"
      confirm:
        - text: "«مُتعذّرٌ قياسُهُ؛ لا حدَّ له.»"
          source: "المورد الحديث (2008) — مقابل: immeasurable"
        - text: "«تَعَذَّرَ عليه الأمرُ: صعُب... الشيءُ: انمحى»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الْعَيْنُ وَالذَّالُ وَالرَّاءُ بِنَاءٌ صَحِيحٌ لَهُ فُرُوعٌ كَثِيرَةٌ... وَبَابٌ آخَرُ لَا يُشْبِهُ الَّذِي قَبْلَهُ: تَعَذَّرَ الْأَمْرُ، إِذَا لَمْ يَسْتَقِمْ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            يُثبّت ابن فارس أن 'تعذُّر الأمر' يعني عدم استقامته وصعوبته — أساس
            دلالي كلاسيكي راسخ يُقوِّي المركّب الاصطلاحي 'تعذُّر القياس'

    - lemma: "لا قياسية"
      confirm:
        - text: "«الْقَافُ وَالْوَاوُ وَالسِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَقْدِيرِ شَيْءٍ بِشَيْءٍ... وَمِنْهُ الْقِيَاسُ، وَهُوَ تَقْدِيرُ الشَّيْءِ بِالشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(1) اللامَقِيسيّة: عدم القابليّة للقَيْس المشترَك (2) اللاتناسب؛ اللاتكافؤ.»"
          source: "المورد الحديث (2008) — مقابل: incommensurability"
          addition: >-
            المورد الحديث يستعمل 'اللامقيسية' (من مَقِيس لا من قياسية) كصيغة معيارية
            موثَّقة للمفهوم ذاته؛ يُشير إلى أن 'لا قياسية' تتوازى مع هذا الاستعمال
            دون أن تطابقه، وأن الصيغة الصرفية الأمثل هي المصدر الصناعي المدغم
        - text: "«غير مقيس: غير قابل للقياس»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — مقابل: incommensurable"
          addition: >-
            يُثبّت وجود المفهوم في المعاجم الرياضية المتخصصة، مما يدعم المصطلح
            الاسمي المجرد المقابل له

    - lemma: "اللَّاقِيَاسِيَّة"
      expands:
        - text: "«(1) اللامَقِيسيّة: عدم القابليّة للقَيْس المشترَك (2) اللاتناسب؛ اللاتكافؤ.»"
          source: "المورد الحديث (2008) — مقابل: incommensurability"
          addition: >-
            المقابل المعياري في المعجم الحديث هو 'اللامقيسية' لا 'اللاقياسية' — غير
            أن هذا المرشح يُمثِّل الصيغة الكتابية الموحَّدة لللمّة الموجودة 'لا قياسية'
            بعد إصلاحها، فيكون مُمَاثِلاً لها لا مستقلاً عنها

    - lemma: "عَجْزُ الْقِيَاسِ"
      evidence_status: "no_material_found"

    - lemma: "الإِطْلَاقِيَّة"
      contradicts:
        - text: "«اطلاقية» — translation_en: absolutism — domain: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس (ALECSO/ArabTerm)"
          conflict: >-
            المصطلح 'اطلاقية' موثَّق في المعجم الفلسفي بمعنى 'absolutism' (المذهب
            المطلق في الفلسفة السياسية)، لا بمعنى عدم قابلية القياس — تعارض دلالي
            مباشر يمنع الاستعمال

    - lemma: "اللَّاتَقْدِيرِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تعذر القياس"
      decision: confirmed
      decision_reason: >-
        مركب إضافي راسخ (مصدر تَعَذُّر + مضاف إليه القياس)، تُثبِّته المعاجم الحديثة
        بصيغة الوصف 'متعذِّرٌ قياسُهُ = immeasurable' (المورد الحديث) و'يَتَعَذَّرَ قِيَاسُهُ =
        spanless' (المورد الحديث). الجذر عذر موثَّق في مقاييس اللغة بمعنى ما لا يستقيم.
        الوحدة المعجمية ثابتة ولا تتفكك إلى وصف حر. يستوجب إضافة التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُصوِّر المفهوم من منظور إجرائي-عملي: استعصاء فعل القياس وعجزه عن الاكتمال،
        مع ظلال الصعوبة والاستعصاء الموروثة من الجذر (عَذَرَ = قدَّم العذر / لم يستقم).
        أنسب للسياقات العلمية والتقنية والتحليلية حين يُوصف الشيء من حيث تعذُّر قياسه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَذُّرُ الْقِيَاسِ"

    - lemma: "لا قياسية"
      decision: confirmed
      decision_reason: >-
        المصدر الصناعي 'لاقياسية' هو الصيغة الاسمية المجردة للمفهوم، يوازيه 'اللامقيسية'
        في المورد الحديث. يستوفي معايير الاشتقاقية (جذر قوس/قيس + سابقة النفي لا +
        لاحقة -يَّة) واليُسر والاطّراد. الكتابة بكلمتين منفصلتين غير معيارية؛ تُوحَّد
        إلى كلمة واحدة 'لاقياسية' بتشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبِّر عن الصفة الجوهرية المجردة لذات الشيء: كون الشيء من طبيعته غير قابل
        للانضباط بمعيار موضوعي، دون إحالة إلى عملية القياس الفعلية. أنسب للسياقات
        الفلسفية والوجودية والوصفية، ولصياغة النسبة (لاقياسيّ) والظرف (لاقياسياً).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاقِيَاسِيَّة"

    - lemma: "اللَّاقِيَاسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        هذا المرشح هو الصيغة الكتابية الموحَّدة لللمّة الموجودة 'لا قياسية' بعد إصلاحها؛
        لا مسوِّغ لإنشاء مدخل مستقل لمفهوم تغطيه لمّة موجودة ستُحدَّث لتتطابق معه.
        إضافته تخلق ازدواجاً معجمياً غير مبرَّر.

    - lemma: "عَجْزُ الْقِيَاسِ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا توثيق معجمي لهذا التركيب. فضلاً عن ذلك، دلالة 'عجز' تُبرز قصور الفاعل
        القائم بالقياس لا صفة الشيء نفسه — وهو إزاحة في مستوى الدلالة لا تخدم
        المعنى المطلوب. لا يجتاز اختبار التثبيت المعجمي.

    - lemma: "الإِطْلَاقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        موثَّق في مسرد الفلسفة (ALECSO) بمعنى 'absolutism'؛ التعارض الدلالي المعجمي
        الصريح يُوجب الرفض حتماً. المجاز المقترح (ما لا يُقاس = المطلق) لا يصمد أمام
        هذا التعارض المعجمي المسجَّل.

    - lemma: "اللَّاتَقْدِيرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا دليل معجمي. وإن كانت مفردة 'التقدير' تلتقي مع 'القياس' في الأصل اللغوي،
        فإن 'اللاتقديرية' غائبة عن المعاجم المتخصصة ومجهولة في الاستعمال المعاصر.
        الأولى التمسك بالصيغ الموثَّقة.


