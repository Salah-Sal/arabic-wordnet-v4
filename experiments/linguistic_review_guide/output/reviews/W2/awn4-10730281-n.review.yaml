stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جداً ولا يعكس الأبعاد الدلالية المختلفة (بين سوء الخلق والجرأة)."
      - "كلمة 'نمر' في هذا السياق استعارة دلالية تحتاج إلى توثيق دقيق لتمييزها عن الحيوان."
    observations: "المجموعة تجمع بين صفة الشراسة (بمعنى حدة الطبع) والجرأة (بمعنى الإقدام). اللمّات الحالية قوية ولكنها تحتاج إلى إثراء بلمّات تعكس جانب الإقدام الشجاع الذي يوحي به التعريف الإنجليزي (audacious)."
  blind_candidates:
    - lemma: "بَاسِل"
      generation_method: ishtiqaq
      justification: "من البسالة، وهي الشدة والشجاعة، وتناسب وصف الشخص الجريء."
    - lemma: "مِقْدَام"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة تدل على كثرة الإقدام والجرأة في مواطن الخطر."
    - lemma: "غَشُوم"
      generation_method: ishtiqaq
      justification: "للشخص الذي يخبط الناس بشراسة ولا يبالي بالعواقب."
    - lemma: "صِنْدِيد"
      generation_method: majaz
      justification: "تستخدم للشجاع الشديد والزعيم الجريء."

stage2_evidence:
  per_lemma:
    - lemma: "شَرِس"
      confirm:
        - text: "«الشَّرِسُ: الجرىءُ فى القِتَال الشَّدِيد»"
          source: "المعجم الكبير"
        - text: "«رجل شَرِس الخلق، وإنه لأشرس، وإنه لشريس، أي: عسر شديد الخلاف»"
          source: "كتاب العين"
    - lemma: "نَمِر"
      confirm:
        - text: "«فلان غضب وساء خلقه فصار كالنمر الغاضب»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«تَنَمَّرَ لَهُ: تَنَكَّرَ وتغيَّر وأَوْعَده، لأنّ النَّمرَ لَا يُلقى أبدا إلاّ مُتنَكِّراً غَضْبَان»"
          source: "تاج العروس"
    - lemma: "مِقْدَام"
      confirm:
        - text: "«المِقْدَامُ: الكثيرُ الإقدام على العدوّ، الجرىء فى الحرب»"
          source: "المعجم الوسيط"
    - lemma: "بَاسِل"
      confirm:
        - text: "«البَاسِلُ: الشجاع الأسد الشديد»"
          source: "المعجم الكبير"
    - lemma: "أَشْرَس"
      confirm:
        - text: "«الأَشْرَسُ: الجَريءُ في القِتالِ، والأسَدُ»"
          source: "القاموس المحيط"

stage3_analysis:
  per_lemma:
    - lemma: "شَرِس"
      decision: confirmed
      decision_reason: "لمة أساسية مطابقة للتعريف اللغوي والاصطلاحي، وموثقة بكثرة في المعاجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَرِس"
    - lemma: "نَمِر"
      decision: confirmed
      decision_reason: "استخدام مجازي فصيح ومستمر في العربية المعاصرة لوصف الشخص الغاضب أو الشرس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَمِر"
    - lemma: "مِقْدَام"
      source: stage1
      decision: confirmed
      decision_reason: "تعكس جانب الجرأة (audacious) المذكور في التعريفين العربي والإنجليزي بدقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مِقْدَام"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10730281-n"
    - lemma: "أَشْرَس"
      decision: confirmed
      decision_reason: "وردت كصفة محددة للجريء في القتال في أمهات المعاجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَشْرَس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10730281-n"

stage4_content:
  definition:
    current: "شخص شرس أو جريء"
    assessment:
      decision: revise
      reason: "التعريف الحالي يفتقر للحبكة المعجمية (الجنس والفصل)."
    authored:
      - type: terminological
        text: "شخصٌ اتَّصفَ بسُوءِ الخُلُقِ وشِدَّةِ الشَّكِيمَةِ، أو غَلَبَتْ عليه الجُرْأَةُ والإقْدَامُ في مَواطِنِ الشِّدَّةِ والحَرْب."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10730281-n"
          definition_index: 0
          text: "شخصٌ اتَّصفَ بسُوءِ الخُلُقِ وشِدَّةِ الشَّكِيمَةِ، أو غَلَبَتْ عليه الجُرْأَةُ والإقْدَامُ في مَواطِنِ الشِّدَّةِ والحَرْب."
  examples:
    per_lemma:
      - lemma: "شَرِس"
        examples:
          - text: "واجَهَ المُلاكمُ خَصْمًا شَرِسًا لم يَتَرَاجَعْ لَحْظَةً."
            type: usage
      - lemma: "نَمِر"
        examples:
          - text: "تَنَمَّرَ الجُنْدِيُّ في وَجْهِ أَعْدائِهِ حَتَّى قَذَفَ فِي قُلوبِهِمُ الرُّعْبَ."
            type: usage
      - lemma: "مِقْدَام"
        examples:
          - text: "كانَ القائِدُ مِقْدَامًا يَسِيرُ في طَلِيعَةِ جَيْشِهِ."
            type: usage
      - lemma: "أَشْرَس"
        examples:
          - text: "إنَّهُ مِنْ أَشْرَسِ المُقاتِلِينَ الَّذِينَ عَرَفَتْهُمُ الصَّحراءُ."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "شَرِس"
      entry_id: "{auto}"
      root: "شرس"
      maqayis_quote: "«الشِّينُ وَالرَّاءُ وَالسِّينُ أَصْلٌ قَرِيبٌ مِنَ الَّذِي قَبْلَهُ. مِنْ ذَلِكَ الشَّرْسُ: شِدَّةُ الدَّعْكِ لِلشَّيْءِ... وَالشَّرِيسُ: الشَّكِسُ الْكَثِيرُ الْخِلَافِ.»"
    - lemma: "نَمِر"
      entry_id: "{auto}"
      root: "نمر"
      maqayis_quote: "«النُّونُ وَالْمِيمُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا لَوْنٌ مِنَ الْأَلْوَانِ... فَالْأَوَّلُ النَّمِرُ، مَعْرُوفٌ، مِنَ اخْتِلَاطِ السَّوَادِ وَالْبَيَاضِ فِي لَوْنِهِ... وَتَنَمَّرَ لِي فُلَانٌ: تَهَدَّدَنِي.»"
