# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "كلمة «قاسي» في التعريف مشحونةٌ دلالياً بمعنى الشدة العاطفية لا الصلابة الجسدية فقط؛ والأدق «جامد» أو «صلد»"
      - "التعريف «عملية التحول إلى صلب أو قاسي» يستخدم الصفة مجردةً بلا موصوف مما يجعل البناء النحوي قلقاً في سياق معجمي رسمي"
      - "اللمة «تصلد» غير موثقة كمدخل مستقل في المعاجم اللغوية الكلاسيكية المُستعلمة، وإنما ترد في مركبات اصطلاحية (تصلد الإسمنت، تصلد الثدي)"
    observations: >
      المجموعة تصف عمليةً طبيعيةً من الفئة الفوقية «عملية طبيعية»، وهي تصلُّب المادة أو
      العضو أو النسيج من حالة اللين إلى حالة الصلابة. الجذران الرئيسيان (صلب، صلد) كلاهما
      عريقان في العربية؛ وقد أثبت ابن فارس أن صلب يدل على «الشدة والقوة» وأن صلد يدل على
      «الصلابة واليبس»، مما يلائم مفهوم المجموعة تمام الملاءمة. يُلاحَظ اختلاف في توزيع
      الاستخدام: فتصلّب واسع الانتشار في المعاجم التقنية بمعانٍ متعددة (تصلب الشرايين،
      تصلب الفولاذ، تصلب الرسوبات)، في حين يقتصر تصلد عموماً على سياقات طبية وهندسية
      أضيق. تحتاج كلتا اللمّتَين إضافة تشكيل كامل.

  blind_candidates:
    - lemma: "تَصَلُّب"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل تَصَلَّبَ على وزن تَفَعُّل، وهو الوزن القياسي للدلالة على المطاوعة
        والتحوّل التدريجي في العربية. الجذر صلب يعني الشدة والقوة، فتصلُّب = صيرورة الشيء
        صلباً. يستوفي اختبار السكّ: لا يمكن إبدال «تصلُّب» بوصف آخر دون تغيير المعنى.
    - lemma: "تَيَبُّس"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل تَيَبَّسَ على وزن تَفَعُّل من جذر يبس، ومعناه الجفاف والصلابة الناجمة
        عن فقدان الرطوبة. يُوظَّف في وصف تصلُّب الأنسجة الحية (العضلات، المفاصل) بفعل
        الجفاف. التعريف يذكر «صلب أو قاسي» وكلاهما يشمل اليبوسة جزئياً.
    - lemma: "تَحَجُّر"
      generation_method: majaz
      justification: >
        إزاحة دلالية من الجذر حجر؛ فالحجر صلد يابس بامتياز، وتَحَجَّرَ (وزن تفعَّل) يعني
        «صار كالحجر» أي جمد وتصلَّب. يستوفي التعريف لأن التحجّر هو أقصى صور التصلُّب.
        وظيفة المجاز هنا تجاوز الاشتراك اللفظي في سياقات كيميائية وطبية.
    - lemma: "تَقَسٍّ"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل تَقَسَّى على وزن تَفَعُّل من جذر قسو/قسا، وقسا الشيءُ بمعنى اشتدّ
        وصلُب. وزن التفعُّل يدل على التحول التدريجي مما يناسب «عملية التحول». مرشَّح
        إحيائي للجذر الفصيح قسا.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة (٤ استعلامات ضمن الميزانية):
#  ١. مطابقة دفعية شاملة: تصلب/التصلب، تصلد/التصلد + جميع مرشحات المرحلة ١
#  ٢. إثراء مُدمج بالمعرّف: definitions + examples لمداخل entry_id مختارة
#  ٣. جسر إنجليزي: stiffening, rigidifying, rigidification, hardening, solidification, induration
#  ٤. بحث FTS بالكلمات المفتاحية: تيبس، تصلد، صلابة، يبوسة
stage2_evidence:
  per_lemma:

    - lemma: "تصلب"
      confirm:
        - text: "«تيَبُّسٌ وقساوة فى الأنسجة اللينة لبعض أجزاء الجسمِ، ويحدث ذلك بسبب تغيُّرات مَرَضية فيه»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«تَصَلُّب الشَّرايين (فى الطِّب): فـقـدُ الشَّـرايين مرونتهـا بسـبب زيـادة سُـمْك وصـلابة جدرانها»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«تحوُّل المادة من الحالة السائلة إلى الحالة الصلبة»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — ترجمة: solidification"
        - text: "«(2) عملية يتحول الجسم المائع (سائل أو غاز) من خلالها كيميائياً و/أو فيزيائياً إلى مادة صلبة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ترجمة: solidification"
        - text: "«في مجال تصنيع الفولاذ فيُقصد به تصلّب الفولاذ بواسطة التبريد السريع»"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ترجمة: hardening"
      expands:
        - text: "«(1) صلابة؛ تيبُّس؛ جُسوء (2) صرامة (3) قسوة (4) تصلُّب»"
          source: "المورد الحديث (2008) — ترجمة: rigidity"
          addition: "يربط المعجم تصلُّب بكل من الصلابة الجسدية والصرامة المعنوية، مما يوسّع الحقل الدلالي للمصطلح"
        - text: "«هو تصلّد غير مرغوب فيه للألواح الصُلب من خلال التسخين والتبريد المفاجئ للمعدن. يؤدي التصلُّب إلى حدوث تَصَدُّعٍ إجهادي»"
          source: "مسرد هندسة وتكنولوجيا السيارات — ترجمة: embrittlement"
          addition: "يُميّز هذا السياق بين التصلُّب (embrittlement) والتصليد (hardening المقصود)، مما يكشف عن دقة استخدام اللمّة وتعدد دلالاتها"

    - lemma: "تصلد"
      confirm:
        - text: "«(2) تصلُّد؛ تحجُّر»"
          source: "المورد الحديث (2008) — ترجمة: concretion"
        - text: "تصلد الإسمنت، شكّ الإسمنت — setting of cement"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.٢: بناء - تجارة (1999)"
        - text: "تَصَلُّدُ الثَّدْي — mastoscirrhus"
          source: "المعجم الطبي الموحد (2009)"
        - text: "تَصَلُّدُ الخُصْيَة — orchioscirrhus"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الصَّادُ وَاللَّامُ وَالدَّالُ أَصْلٌ وَاحِدٌ صَحِيحٌ، يَدُلُّ عَلَى صَلَابَةٍ وَيُبْسٍ. مِنْ ذَلِكَ الْحَجَرُ الصَّلْدُ، وَهُوَ الصُّلْبُ. ثُمَّ يُحْمَلُ عَلَيْهِ قَوْلُهُمْ: صَلِدَ الزَّنْدُ، إِذَا لَمْ يُخْرِجْ نَارَهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر صلد يجمع معنى الصلابة واليبس معاً، مما يُميّزه دلالياً عن صلب الذي يُركّز على الشدة والقوة فحسب"

    - lemma: "تَيَبُّس"
      confirm:
        - text: "تيبَّس — stiffening / support (tech.)"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "تَيَبُّس — stiffness"
          source: "المعجم الطبي الموحد (2009)"
        - text: "تَيَبُّس — stiffness"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      contradicts:
        - text: "«الْيَاءُ وَالْبَاءُ وَالسِّينُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى جَفَافٍ. يُقَالُ: يَبِسَ الشَّيْءُ يَيْبَسُ وَيَيْبِسُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يبس يدل في الأصل على الجفاف لا الصلابة الهيكلية؛ وتيبُّس في المعاجم التقنية يُقابل stiffness (الحالة) لا stiffening/rigidification (العملية)"
        - text: "تَيَبُّسُ المَفْصِل — joint stiffness | تَيَبُّسٌ رِمّيّ — rigor mortis"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الاستخدام الغالب يُقابل stiffness (اسم الحالة) أو rigor (التصلب الرِّمّي)، وكلاهما نتيجة لا عملية، مما يُخرجه عن نطاق المجموعة"

    - lemma: "تَحَجُّر"
      expands:
        - text: "«تغير المواد العضوية إلى مادة حجرية بإحلال مواد معدنية محل أنسجتها العضوية التي تحتفظ ببنيتها المجهرية الأصلية»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — ترجمة: petrification"
        - text: "«التّحجّر: [في الانكليزية] Petrification, hardening, stiffness [في الفرنسية] Petrification, durcissement, ankylose. هو ورم صغير ينجمد ويتحجّر في العين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777م)"
      contradicts:
        - text: "«صلب كالحجر... الجرح: اجتمع والتأم. الرجل: اتخذ حجرة لنفسه»"
          source: "المعجم الوسيط"
          conflict: "التحجُّر مخصوص بعملية petrification (التحوّل إلى حجر بالتعدين)، وهي أخص من المفهوم العام للتصلُّب؛ فضلاً عن استخدامه المجازي للجفاء العاطفي"

    - lemma: "تَقَسٍّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تصلب"
      decision: confirmed
      decision_reason: >
        تَصَلُّب موثَّق توثيقاً وافراً في المعاجم الحديثة التقنية والطبية بمعنى «عملية التحوّل
        إلى الصلابة» في سياقات متعددة (طبي، هندسي، كيميائي، بيولوجي، فيزيائي). مصدر قياسي
        على وزن تَفَعُّل من جذر صلب، وهو الوزن المنتج للأفعال المطاوعة والعمليات التحولية.
        يستوفي جميع معايير بوابة جودة المصطلح: اطّراد الوزن، يُسر التداول، ملاءمة السياق،
        الأصالة، الاشتقاقية. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَصَلُّب يُركّز على الصلابة الهيكلية المطلقة وفقدان المرونة؛ أوسع انتشاراً وأعمّ
        تطبيقاً يشمل المعادن والأنسجة والمواد الكيميائية والسوائل. أصله (صلب) يدل على
        القوة والصمود، فهو تصلُّب دائم وقاطع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصَلُّب"

    - lemma: "تصلد"
      decision: confirmed
      decision_reason: >
        تَصَلُّد موثَّق في مركبات اصطلاحية طبية وهندسية متعددة (تصلد الإسمنت، تصلد الثدي،
        تصلد الخصية) مع شواهد في المورد الحديث تُقابله بـ concretion. الجذر صلد أثبته ابن
        فارس بأنه يدل على «الصلابة واليبس»، وهو ما يُميّزه نوعياً عن صلب. غياب المدخل
        المستقل في المعاجم اللغوية الكلاسيكية لا يُسقطه لأن المعاجم التقنية الموحّدة اعتمدته
        مصطلحاً راسخاً. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَصَلُّد يجمع بين الصلابة واليبوسة، ويُستخدم حين يقترن التصلُّب بجفاف المادة أو
        فقدان رطوبتها أو تكلّسها. أضيق دلالةً من تصلُّب وأكثر تخصصاً في السياقات الطبية
        (تصلُّد الأنسجة الغدية) والإنشائية (تصلُّد الإسمنت).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصَلُّد"

    - lemma: "تَيَبُّس"
      source: stage1
      decision: removed
      decision_reason: >
        تيبُّس يدل في الأصل على الجفاف (مقاييس: «يدل على جفاف»)، وفي المعاجم التقنية
        يُقابل stiffness (الحالة الساكنة) أو rigor mortis (التصلب الرِّمّيّ)، وكلاهما نتيجةٌ
        لا عملية تدريجية من اللين إلى الصلابة. كما أن الجذر يبس لا يشترط الصلابة الهيكلية
        (الخبز اليابس مثلاً). وجوده في المجموعة سيخلط بين مفهومَي الجفاف والتصلُّب.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَحَجُّر"
      source: stage1
      decision: removed
      decision_reason: >
        التحجُّر في المعاجم التقنية مخصوص بعملية petrification/lithification (تحوّل المواد
        العضوية إلى حجر بالتعدين)، وهي عملية أكثر خصوصيةً من المفهوم العام للتصلُّب. كما أن
        تحجَّرَ في الاستعمال الفصيح يُستخدم مجازاً للجفاء العاطفي وقسوة القلب، مما يولّد
        اشتراكاً لفظياً مُربكاً في سياق الشبكة الدلالية.
      evidence_assessment:
        case: mixed

    - lemma: "تَقَسٍّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شواهد معجمية لتَقَسٍّ بمعنى عملية التصلُّب. المعجمون يستخدمون تَقْسِية
        (مصدر الفعل المتعدي قسَّى) لا تَقَسٍّ (المصدر اللازم)، كما في المعجم الموحد للكيمياء
        والجيولوجيا. فضلاً عن ذلك، قسا يصف في الغالب القسوة العاطفية والصرامة لا الصلابة
        المادية الجسدية.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "عملية التحول إلى صلب أو قاسي"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح مضموناً لكنه يستخدم الصفة مجردةً بلا موصوف («إلى صلب أو قاسي»)،
        وهذا البناء غير رسمي معجمياً. علاوةً على ذلك، «قاسي» في العربية محمّلة بدلالة القسوة
        المعنوية والعاطفية، وهي دلالة غير مقصودة هنا. والأدق «جامد» لوصف الصلابة الجسدية.
        يُقترح تعريف مصطلحي يُبيّن الجنس القريب (عملية طبيعية) والفصل النوعي (التحوّل من
        اللين إلى الصلابة).
