# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. المرشحات الأعمى (من التعريف المُقنَّع فقط: "استخدام كلمات طويلة")
  blind_candidates:
    - lemma: "تَقَعُّر"
      generation_method: ishtiqaq
      justification: >
        مصدر تفعُّل من الجذر ق-ع-ر؛ يُستعمل في البلاغة العربية للدلالة على التعمق
        في الكلام والتكلف بالألفاظ الغريبة الصعبة. الوزن تفعُّل يناسب السلوك
        اللغوي المتكرر (pattern habitual)، وهو قريب الدلالة من sesquipedality.

    - lemma: "حَوْشِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من حَوْشِيّ (الكلام الوحشي النادر الصعب)؛ يُستعمل للدلالة
        على استعمال الألفاظ الغريبة النادرة المنفّرة. يُحيي لفظاً بلاغياً
        تراثياً مرتبطاً بظاهرة استخدام الألفاظ المتكلَّفة.

    - lemma: "تَعْقِيدٌ لَفْظِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي: تعقيد (مصدر من ع-ق-د) + لفظي (نسبة). يصف ظاهرة تعقيد الكلام
        بتوظيف ألفاظ معقدة طويلة المقاطع. الصيغة التركيبية وصفية معروفة في
        المصطلحية العربية الحديثة.

    - lemma: "إِطَالَة"
      generation_method: ishtiqaq
      justification: >
        مصدر إفعالة من الجذر ط-و-ل، يدل على التطويل؛ يمكن أن يُستعمل
        للدلالة على إطالة الألفاظ واختيار الكلمات الطويلة، وهو مشتق مباشر
        يناسب الدلالة المحورية للمفهوم.

  # ب. التقييم الأولي (بعد رؤية synset_info الكامل)
  assessment:
    concerns:
      - >
        اللمّة 'استخدام كلمات طويلة' عبارة وصفية حرة تفتقر إلى التثبيت المعجمي؛
        تفشل اختبار السكّ: يمكن إبدال 'كلمات' بـ'ألفاظ' أو 'مفردات' مع بقاء
        المعنى، مما يدل على أنها ليست وحدة معجمية مسكوكة.
      - >
        اللمّة 'تفيهق' مسجّلة في المعجم الوسيط (OCR) بوصفها فعلاً (pos: verb).
        إدراجها في مجموعة اسمية (pos: n) يستلزم اعتبارها مصدراً (تَفَيْهُق)
        وتصحيح POS وتشكيلها تشكيلاً كاملاً.
      - >
        التعريف العربي الحالي 'استخدام كلمات طويلة' ترجمة حرفية من الإنجليزية
        يفتقر إلى الأسلوب المعجمي الوسيط ولا يعكس الدلالة الكاملة للمفهوم
        (التنطع والتكلف في الألفاظ الطويلة).
    observations: >
      يحيل هذا المصطلح إلى ظاهرة بلاغية عربية معروفة في التراث، وهي ملء الفم
      بالكلام والتوسع فيه بالألفاظ المتنطعة الطويلة. الجذر فهق (فاء+هاء+قاف)
      دالّ عند ابن فارس على السعة والامتلاء، ومنه المتفيهق الذي يملأ فمه بالكلام.
      يشهد الحديث النبوي الصحيح على المصطلح: «إن أبغضكم إليّ الثرثارون
      المتفيهقون». أما اللمّة 'استخدام كلمات طويلة' فلا مسوّغ لبقائها لمّةً
      لأنها وصف حر لا مصطلح مسكوك.


