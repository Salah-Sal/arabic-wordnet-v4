# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "استخدام كلمات طويلة"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تفشل اختبار السكّ: يمكن إبدال 'كلمات' بـ'ألفاظ' أو
        'مصطلحات' مع بقاء المعنى الوصفي، دليلٌ على أنها ليست وحدة معجمية
        ثابتة. لا يوجد أي أثر لها في قواعد البيانات المعجمية بوصفها مصطلحاً
        مسكوكاً. يُكتفى بـتَفَيْهُق لتمثيل المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تفيهق"
      decision: confirmed
      decision_reason: >
        المصدر تَفَيْهُق (مصدر الفعل تفيهقَ على وزن تفيعُل) مُثبَت في المعاجم
        الكبرى بدلالة التوسع والتنطع في الكلام، وهو أقرب مصطلح عربي أصيل لمفهوم
        sesquipedality. الجذر فهق يدل على السعة والامتلاء (ابن فارس)، والمتفيهق
        هو من يملأ فمه بالكلام ويتنطع فيه. الشاهد النبوي المشهور يرسّخه في
        الاستعمال. يستلزم تصحيح التشكيل وضبط POS.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَفَيْهُق هو المصطلح الوحيد المُقرَّر في هذه المجموعة؛ دلالته أشمل قليلاً
        من sesquipedality الإنجليزية لأنه يجمع: (أ) استخدام ألفاظ طويلة متكلفة،
        (ب) التوسع والإسراف في الكلام، (ج) التفخيم والتكبر في الخطاب.
        وهذه الأبعاد الثلاثة تجعله التقابل الأدق في العربية.
      morphological_check: >
        الوزن الصرفي: تَفَيْعُل (مصدر تفيهقَ). هذا الوزن نادر في العربية
        ويخص مصادر صيغة تفيعَل النادرة. المصدر صحيح ومستخدَم اسماً للحدث.
        يجب ضبطه بالشكل الكامل: تَفَيْهُق (بضمة الهاء).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَيْهُق"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: "n"

    - lemma: "تَقَعُّر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود الدلالة البلاغية (التعمق والتكلف في الكلام)، يعاني تَقَعُّر من
        تلوث دلالي حاد: وحَّدت معاجم الاصطلاح الحديث (الرياضيات، الطب) هذه
        اللفظة للدلالة على concavity. إدراجها في المجموعة سيُحدث لبساً مصطلحياً
        في المجالين العلمي والبلاغي. يُرفض.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "حَوْشِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُثبِت قواعد البيانات الدلالةَ البلاغية لحوشية؛ الوحيد المُسجَّل
        هو المعنى الحيواني (وحشية الإبل). الدلالة البلاغية المفترَضة غير مؤكدة
        في المصادر المتاحة، والإدراج بدون دليل معجمي مخالف لمنهج المراجعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَعْقِيدٌ لَفْظِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        التعقيد اللفظي مصطلح بلاغي محدد يعني غموض التركيب اللفظي (lexical
        obscurity)، وهو غير sesquipedality المرتبطة بطول الكلمات تحديداً.
        خلط دلالي بين ظاهرتين بلاغيتين مختلفتين. لا دليل معجمي يربطه
        باستخدام الألفاظ الطويلة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "إِطَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        إطالة مصدر عام يدل على التطويل المطلق (إطالة الكلام، إطالة الانتظار،
        إطالة الفعل...). لا يختص باستخدام ألفاظ طويلة المقاطع تنطعاً. غياب
        الخصوصية الدلالية يجعله غير صالح كمصطلح للمجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


