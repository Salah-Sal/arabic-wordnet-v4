stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يعتبر ترجمة حرفية للتعريف الإنجليزي ويفتقر إلى الدقة المعجمية العربية."
      - "المفهوم يشمل دلالات 'يخترع' (مخترع/مبتكر) و'يصنع' (صانع)، لكن 'يزرع' غير معتاد في هذا السياق باللغة العربية للإشارة إلى 'creator' البشري العام."
    observations: "المجموعة الترادفية تغطي مفهوم 'المُوجِد' أو 'الخالق' أو 'الصانع' بمعنى الشخص الذي يبتكر الأشياء أو يصنعها. المصطلحات الموجودة (صانع، مبتكر، مبدع) مناسبة وتغطي جوانب مختلفة من المفهوم الإنجليزي."
  blind_candidates:
    - lemma: "مُنْشِئ"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل 'أنشأ'، ويدل على من يبتدئ الشيء ويوجده."
    - lemma: "مُوجِد"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل 'أوجد'، ويعني من تسبب في وجود الشيء."
    - lemma: "مُخْتَرِع"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل 'اخترع'، ويركز على جانب ابتكار الأشياء المذكور في التعريف."
    - lemma: "فَاطِر"
      generation_method: majaz
      justification: "مجاز من 'فطر' أي ابتدأ الخلق، ويستخدم للإشارة إلى المبدع، وإن كان يغلب في السياق الديني."

stage2_evidence:
  per_lemma:
    - lemma: "صَانِع"
      confirm:
        - text: "«مَن يصنع بيديه مَنْ يحترف الصناعة»"
          source: "المعجم الوسيط"
        - text: "«كُلُّ مُحْتَرِفٍ بيده مُتَكَسِّبٌ من حِرْفَتِه»"
          source: "المعجم الكبير"
    - lemma: "مُبْتَكِر"
      confirm:
        - text: "«شخص واسع الخيال»"
          source: "مسرد الإعلام والتواصل"
      expands:
        - text: "«(1) أصليّ (2) جديد؛ مبتكر (3) أصيل؛ مُبْدِع؛ مُوَلِّد؛ قادرٌ على توليد المعاني الجديدة»"
          source: "المورد الحديث"
    - lemma: "مُبْدِع"
      confirm:
        - text: "«شخص واسع الخيال»"
          source: "مسرد الإعلام والتواصل"
        - text: "«(1) مُبْدِع؛ خلّاق (2) إبداعيّ.»"
          source: "المورد الحديث"
    - lemma: "مُنْشِئ"
      confirm:
        - text: "«الذى يجيد استنباط المعانى وتأليفها والتعبير عنها بكلام بليغ»"
          source: "المعجم الوسيط"
    - lemma: "مُوجِد"
      confirm:
        - text: "«المنشيء، والمقوى والمكره على الأمر.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُخْتَرِع"
      confirm:
        - text: "«(1) مُخْتَرَع؛ اختراع. وبخاصة: أداة ميكانيكية (2) وسيلة؛ حيلة (3) اختراع؛ استنباط.»"
          source: "المورد الحديث"
    - lemma: "فَاطِر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "صَانِع"
      decision: confirmed
      decision_reason: "يتطابق مع دلالة صنع الأشياء المذكورة في التعريف المعجمي وهو مصطلح فصيح وشائع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَانِع"

    - lemma: "مُبْتَكِر"
      decision: confirmed
      decision_reason: "يتطابق مع دلالة ابتكار واختراع الأشياء الجديدة ويستخدم بكثرة للتعبير عن 'creator/innovator'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُبْتَكِر"

    - lemma: "مُبْدِع"
      decision: confirmed
      decision_reason: "يعبر عن الإبداع والإيجاد على غير مثال سابق، وهو صميم دلالة المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُبْدِع"

    - lemma: "مُنْشِئ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق وفصيح يعبر عن إيجاد الشيء من العدم أو إنشائه وتأسيسه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُنْشِئ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُوجِد"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على الإيجاد والخلق، وهو مرادف قوي ودقيق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُوجِد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُخْتَرِع"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر بدقة عن جانب اختراع الأشياء الجديدة المذكور في التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُخْتَرِع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "فَاطِر"
      source: stage1
      decision: removed
      decision_reason: "يغلب استخدامه في السياق الديني كاسم من أسماء الله الحسنى أو بمعنى المفطر في رمضان، ولا يناسب السياق العام البشري."

stage4_content:
  definition:
    current: "شخص يزرع أو يصنع أو يخترع أشياء"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك ومترجم حرفيا، واستخدام كلمة 'يزرع' غير ملائم في السياق العام. يجب صياغته بأسلوب معجمي عربي سليم يعكس الجوهر الحقيقي للمفهوم."
    authored:
      - type: terminological
        text: "الشخص الذي يبتكر، أو يصنع، أو يُوجِد أشياءً جديدة أو أعمالاً أصلية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "الشخص الذي يبتكر، أو يصنع، أو يُوجِد أشياءً جديدة أو أعمالاً أصلية."}

  examples:
    per_lemma:
      - lemma: "صَانِع"
        examples:
          - text: "يُعَدُّ صَانِعُ هذا العمل الفني من أبرز فناني عصره."
            type: usage
      - lemma: "مُبْتَكِر"
        examples:
          - text: "حاز المُبْتَكِرُ الشاب على جائزة تقديرية لاختراعه الجديد."
            type: usage
      - lemma: "مُبْدِع"
        examples:
          - text: "تتطلب كتابة الروايات خيالاً مُبْدِعاً وقدرة على التصوير."
            type: usage
      - lemma: "مُنْشِئ"
        examples:
          - text: "يُعَدُّ مُنْشِئُ هذا الموقع الإلكتروني من رواد التقنية في البلاد."
            type: usage
      - lemma: "مُوجِد"
        examples:
          - text: "ابن الهيثم هو مُوجِدُ علم البصريات الحديث."
            type: usage
      - lemma: "مُخْتَرِع"
        examples:
          - text: "سُجّلت براءة الاختراع باسم مُخْتَرِعِ الجهاز."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعَدُّ صَانِعُ هذا العمل الفني من أبرز فناني عصره."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "حاز المُبْتَكِرُ الشاب على جائزة تقديرية لاختراعه الجديد."}

stage5_enrichment:
  per_entry:
    - lemma: "صَانِع"
      entry_id: "{auto}"
      root: "صنع"
      maqayis_quote: "«الصَّادُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، وَهُوَ عَمَلُ الشَّيْءِ صُنْعًا.»"
    - lemma: "مُبْتَكِر"
      entry_id: "{auto}"
      root: "بكر"
      maqayis_quote: "«الْبَاءُ وَالْكَافُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَرْجِعُ إِلَيْهِ فَرْعَانِ هُمَا مِنْهُ. فَالْأَوَّلُ أَوَّلُ الشَّيْءِ وَبَدْؤُهُ.»"
    - lemma: "مُبْدِع"
      entry_id: "{auto}"
      root: "بدع"
      maqayis_quote: "«الْبَاءُ وَالدَّالُ وَالْعَيْنُ أَصْلَانِ: أَحَدُهُمَا ابْتِدَاءُ الشَّيْءِ وَصُنْعُهُ لَا عَنْ مِثَالٍ، وَالْآخَرُ الِانْقِطَاعُ والْكَلَالُ.»"
    - lemma: "مُنْشِئ"
      entry_id: "{auto}"
      root: "نشا"
      maqayis_quote: "«النُّونُ وَالشِّينُ وَالْهَمْزَةُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي شَيْءٍ وَسُمُوٍّ.»"
    - lemma: "مُوجِد"
      entry_id: "{auto}"
      root: "وجد"
      maqayis_quote: "«الْوَاوُ وَالْجِيمُ وَالدَّالُ، يَدُلُّ عَلَى أَصْلٍ وَاحِدٍ، وَهُوَ الشَّيُّ يُلْفِيهِ.»"
    - lemma: "مُخْتَرِع"
      entry_id: "{auto}"
      root: "خرع"
      maqayis_quote: "«الْخَاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، وَهُوَ يَدُلُّ عَلَى الرَّخَاوَةِ، ثُمَّ يُحْمَلُ عَلَيْهِ.»"

  per_sense:
    - lemma: "صَانِع"
      sense_id: "{auto}"
      nuance: "يُركز على الجانب العملي والحرفي في إيجاد الأشياء وصنعها."
      mwe: false
    - lemma: "مُبْتَكِر"
      sense_id: "{auto}"
      nuance: "يُركز على جانب التجديد والإتيان بما لم يُسبق إليه في أفكاره وأعماله."
      mwe: false
    - lemma: "مُبْدِع"
      sense_id: "{auto}"
      nuance: "يُشير إلى القدرة الفائقة على التخيّل وابتكار الأشياء على غير مثال سابق بلمسة فنية أو جمالية."
