stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة حرفية ركيكة للتعبير الإنجليزي (organic process)، فاستخدام كلمة 'عضوية' هنا غير دقيق في السياق النباتي العربي."
      - "عبارة 'لحمل الزهور' ترجمة حرفية لـ (bearing flowers) والأفضل استخدام ألفاظ تعبر عن خروج الزهر أو تفتحه."
    observations: "توجد مصطلحات عربية أصيلة ودقيقة للتعبير عن هذه العملية مثل الإزهار والتفتح والتنوير."
  blind_candidates:
    - lemma: "إِزْهَار"
      generation_method: ishtiqaq
      justification: "مصدر الفعل أزهر، وهو يدل مباشرة على خروج زهر النبات."
    - lemma: "تَفَتُّح"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تفتّح، وهو يعبر عن تشقق أكمام الزهر وانبساط أوراقه."
    - lemma: "تَزْهِير"
      generation_method: ishtiqaq
      justification: "مصدر زَهَّرَ، ويستخدم للإشارة إلى عملية خروج الزهر بكثافة."
    - lemma: "تَنْوِير"
      generation_method: ishtiqaq
      justification: "مصدر نوَّر الشجر، أي أخرج نَوْرَهُ (زهره)."

stage2_evidence:
  per_lemma:
    - lemma: "إزهار"
      confirm:
        - text: "«هو تفتح الزهر أو أوان أزهار النبات»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«الإزهار: تَفَتُّح الزُّهور أو زمانُهُ.»"
          source: "المورد الحديث (2008)"
    - lemma: "تفتح"
      confirm:
        - text: "«(تفتح) ... والأكمام عَن النُّور أَو اللوزة عَن الْقطن تشققت عَنهُ»"
          source: "المعجم الوسيط"
        - text: "«تفتح الزهور أو زمانه»"
          source: "المورد الحديث (2008)"
    - lemma: "تزهير"
      contradicts:
        - text: "«تَزَهُّر: تبلور الدهن أو السكر على شكل طبقة بيضاء على سطح الشوكولاتة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "يُستخدم غالباً في سياقات كيميائية أو صناعية (efflorescence/blooming) للتعبير عن التغبر أو التبلور السطحي، وليس المعنى النباتي المباشر."
    - lemma: "تنوير"
      expands:
        - text: "«(التَّنْوِير) وَقت إسفار الصُّبْح»"
          source: "المعجم الوسيط"
          addition: "له معانٍ أخرى شائعة تغلب على المعنى النباتي."

stage3_analysis:
  per_lemma:
    - lemma: "إزهار"
      decision: confirmed
      decision_reason: "مصدر فصيح ومعتمد في المعاجم العلمية والعامة للتعبير عن عملية خروج الزهر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِزْهَار"
    - lemma: "تفتح"
      decision: confirmed
      decision_reason: "مصدر فصيح يعبر بدقة عن الحركة الفيزيائية لظهور الزهرة وتشقق أكمامها، وهو متداول بكثرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَتُّح"
    - lemma: "تزهير"
      source: stage1
      decision: removed
      decision_reason: "مصطلح 'إزهار' يفي بالغرض وهو أفصح وأكثر شيوعاً في السياق النباتي، بينما 'تزهر' و'تزهير' تميل للاستخدام في الكيمياء والصناعة."
      evidence_assessment:
        case: contradicts_only
    - lemma: "تنوير"
      source: stage1
      decision: removed
      decision_reason: "بالرغم من صحته اللغوية (نوّر الشجر)، إلا أن مصطلحي 'إزهار' و'تفتح' أدق وأكثر اختصاصاً في التعبير عن العملية الحيوية."
      evidence_assessment:
        case: mixed

stage4_content:
  definition:
    current: "العملية العضوية لحمل الزهور"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك ومترجم حرفياً ('عملية عضوية' و'حمل الزهور'). الأفضل صياغته بأسلوب علمي عربي سليم."
    authored:
      - type: terminological
        text: "عملية حيوية تتمثل في خروج أزهار النبات وتفتحها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13460563-n"
          definition_index: 0
          text: "عملية حيوية تتمثل في خروج أزهار النبات وتفتحها."
  examples:
    per_lemma:
      - lemma: "إزهار"
        examples:
          - text: "تتأثر عملية إزهار النباتات بالتغيرات في درجات الحرارة."
            type: usage
      - lemma: "تفتح"
        examples:
          - text: "راقبنا تفتح أزهار النرجس مع بداية فصل الربيع."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتأثر عملية إزهار النباتات بالتغيرات في درجات الحرارة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "راقبنا تفتح أزهار النرجس مع بداية فصل الربيع."

