# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13805471-n  |  ILI: i109340  |  POS: n
# English: contradictory   |  Arabic: تَنَاقُض
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي يصف صِفَة القضيتين ('تكون القضيتان متناقضتين إذا...') بدلاً من تعريف العلاقة المنطقية ذاتها، وهي ما تقتضيه هوية الجنس القريب (علاقة منطقية) الواردة في الفوق-مجموعة."
      - "استخدام 'صائبتين/خاطئتين' بدلاً من المصطلح المنطقي الراسخ 'صادقتين/كاذبتين'."
      - "الصياغة تعتمد الترجمة الحرفية من الإنجليزية ولا تستحضر أسلوب المعجمية المنطقية العربية الكلاسيكية."
      - "غياب الشرط التمييزي الذي يُفرّق بين التناقض والتضاد: وهو استحالة ارتفاع المتناقضَيْن معاً (لا يجتمعان ولا يرتفعان)."
    observations: >
      هذه المجموعة تخص علاقةً منطقيةً محوريةً في المنطق الأرسطي وما توارثه من الفلسفة
      الإسلامية، ألا وهي علاقة التناقض بين القضايا. الجذر (نقض) في مقاييس ابن فارس
      يدل على 'نكث الشيء وإبطاله'، وهو جوهر معنى التناقض المنطقي: كلتا القضيتين
      تنقض الأخرى نقضاً تاماً. اللمّة الوحيدة الموجودة (تَنَاقُض) مصطلح راسخ مستخدم
      في عشرات المصنّفات المنطقية الكلاسيكية منذ السيوطي (ت 1505م) إلى عصرنا. يمكن
      إثراء المجموعة بلمّة (نَقِيض) الدالّة على القضية الواحدة بالنسبة إلى نظيرتها
      المتناقضة معها.

  blind_candidates:
    - lemma: "تَنَاقُض"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعُل من جذر (ن-ق-ض) على الوزن الصرفي المعبِّر عن التشارك المتبادل،
        يدل على أن كلاً من القضيتين تنقض الأخرى. هو المصطلح الأنسب للعلاقة المنطقية
        موضع التعريف، إذ يُعبّر عن الطرفين معاً لا عن أحدهما.

    - lemma: "نَقِيض"
      generation_method: ishtiqaq
      justification: >
        اسم على وزن فَعِيل من جذر (نقض)، يدل على ما يُناقض الشيء ويُبطله. مستخدم في
        المنطق الكلاسيكي للدلالة على القضية التي تُعارض أخرى تناقضاً تاماً. وردت
        'النقيضان' في المعجم الوسيط بمعنى 'المتناقضان' في علم المنطق.

    - lemma: "تَعَارُض"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعُل من جذر (ع-ر-ض)، يدل على التنافي والتقابل بين شيئين. يُستعمل في
        أصول الفقه والمنطق للدلالة على التنافي بين الدليلين أو القضيتين. ذكرته معاجم
        الاصطلاحات المنطقية مرادفاً للتناقض.

    - lemma: "نَقِيضَة"
      generation_method: ishtiqaq
      justification: >
        اسم على وزن فَعِيلَة من جذر (نقض)، صيغة المؤنث تدل على القضية أو المبدأ
        الذي ينقض آخر. وردت في المعاجم الفلسفية للدلالة على علاقة التناقض والتقابل
        بين المبادئ.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # الاستعلامات المنفَّذة:
  # Q1 — مطابقة دفعية: headword_norm IN ('تناقض','التناقض','نقيض','النقيض','تعارض','التعارض','نقيضة','النقيضة')
  # Q2 — الجسر الإنجليزي: translation_en:"contradictory" OR "contradiction" OR "contradictories"
  # Q3 — مقاييس اللغة: dictionary_id=151, headword_norm IN ('نقض','عرض')
  # Q4 — مداخل OCR وARABTERM لنقيض/نقيضة/تعارض (استعلام مكمّل)

  per_lemma:
    - lemma: "تَنَاقُض"
      confirm:
        - text: "«اخْتِلَاف قضيتين بالسلب، والإيجاب بِحَيْثُ يَقْتَضِي لذاته أَن تكون إِحْدَاهمَا صَادِقَة وَالْأُخْرَى كَاذِبَة»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
        - text: "«اختلاف قضيتين بإيجاب وسلب بحيث يقتضي لذاته صدق أحدهما وكذب الأخرى، نحو زيد إنسان زيد غير إنسان وأصله قولهم تناقض الكلامان إذا تدافعا كأن كل واحد ينقض الآخر. وفي كلامه تناقض إذا كان بعضه يقتضي إبطال بعض»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«(فِي الْمنطق) النِّسْبَة بَين المتناقضين»"
          source: "المعجم الوسيط لمجمع اللغة العربية (OCR)"
        - text: "«التّناقض: هو عند الأصوليين تقابل الدليلين المتساويين على وجه لا يمكن الجمع بينهما بوجه ويسمّى بالتعارض والمعارضة أيضا. وعند المنطقيين يطلق على تناقض المفردات وتناقض القضايا»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
        - text: "تناقض — contradiction / contradiction — مجالات: التجارة والمحاسبة، الرياضيات والفلك، القانون، اللسانيات، الفلسفة وعلم النفس، الإعلام والتواصل"
          source: "معاجم ARABTERM المتعددة (ALECSO)"
      expands:
        - text: "«التَّنَاقُض: أَن يكون أحد الْأَمريْنِ مفردين أَو قضيتين أَو مُخْتَلفين رفعا للْآخر صَرِيحًا أَو ضمنا... وَلَا بُد لتحَقّق الِاخْتِلَاف الْمَذْكُور من اخْتِلَاف القضيتين فِي الْكمّ والكيف والجهة واتحادهما فِيمَا عدا الْأُمُور الثَّلَاثَة...»"
          source: "كشاف اصطلاحات الفنون للتهانوي — التحليل المفصّل للوحدات الثماني"
          addition: "يضيف الشرط الصرفي لصحة التناقض: ثماني وحدات (الموضوع والمحمول والزمان والمكان والشرط والإضافة والجزء والكل والقوة والفعل)."
        - text: "«التناقض الذاتيّ» — self-contradiction"
          source: "المورد الحديث (2008)"
          addition: "يوسّع الاستخدام ليشمل التناقض الذاتي كمصطلح مركّب."

    - lemma: "نَقِيض"
      confirm:
        - text: "«النَّقِيضُ: المخالف (نقيض الدعوى): (في الفلسيفة): قضيَّة تُعارِض دَعْوًى معيَّنة... النَّقِيضان (في المنطق): المتناقضان»"
          source: "المعجم الوسيط (OCR)"
        - text: "«contradictory: (1) متناقض contradictory reports، (2) متنافٍ أو متعارض مع contradictory to common sense، (4) نقيض»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«النَّقِيضُ: الْمَنْقُوضُ، وَلِذَلِكَ يُقَالُ لِلْبَعِيرِ الْمَهْزُولِ نِقْضٌ، كَأَنَّ الْأَسْفَارَ نَقَضَتْهُ. وَالنَّقِيضُ: صَوْتُ الْمَفَاصِلِ»"
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
          addition: "الجذر الأصلي يدل على النكث والإبطال، وهو مناسب للدلالة على القضية الناقضة لأختها."

    - lemma: "تَعَارُض"
      contradicts:
        - text: "«التعارض: ويسمَّى بالمعارضة والتناقضُ وهو عند الأصوليين: كونُ الدليلين بحيث يقتضي أحدهما ثبوتَ أمر والآخرُ انتفاءه في محل واحد في زمان واحد بشرط تساويهما في القوة»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
          conflict: "التعارض في الاصطلاح الأصولي والمنطقي يخص تقابل الدليلين المتساويين في القوة، ولا يتطابق مع مفهوم التناقض المنطقي بين القضايا (الذي يشترط صدق إحداهما وكذب الأخرى حتماً)."
        - text: "تعارض — translation_en: 'opposition' (مجال: التقنيات التربوية)؛ 'isothety' (مجال: اللسانيات)"
          source: "معاجم ARABTERM"
          conflict: "الترجمات الإنجليزية لـ'تعارض' في ARABTERM لا تُحيل إلى 'contradictory' بل إلى 'opposition' و'isothety'، مما يؤكد اختلاف دلالته عن التناقض المنطقي موضع المجموعة."

    - lemma: "نَقِيضَة"
      contradicts:
        - text: "«النَّقِيضَةُ (في الفلسفة): تناقض القوانين والمبادئ عند تطبيقها (كانت)»"
          source: "المعجم الوسيط (OCR)"
          conflict: "النقيضة في الاصطلاح الفلسفي المعاصر تدل على Antinomy (التناقض الكانطي بين مبادئ العقل الخالص)، لا على Contradictory (العلاقة المنطقية بين قضيتين)."
        - text: "نقيضة — translation_en: 'antinomy' / 'antithesis'"
          source: "مسرد الفلسفة وعلم النفس (ARABTERM)"
          conflict: "تُرجمت 'نقيضة' في ARABTERM إلى antinomy وantithesis، وليس إلى contradictory. هذا يُثبت أنها مصطلح مختلف عن موضوع المجموعة."


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تَنَاقُض"
      decision: confirmed
      decision_reason: >
        اللمّة مستوفية لجميع معايير القبول: موثّقة في المعاجم الكلاسيكية منذ القرن
        العاشر الميلادي وحتى المعاجم الحديثة، وهي المصطلح الاصطلاحي الراسخ في
        التراث المنطقي العربي للدلالة على العلاقة التناقضية بين القضايا. الوزن الصرفي
        (تَفَاعُل) مناسب للدلالة على التشارك والتبادل بين طرفين. التشكيل صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَنَاقُض يُعبِّر عن العلاقة المجردة بين القضيتين من حيث هي نسبة تنافٍ تام
        (لا اجتماع ولا ارتفاع)، ويُسمّي الظاهرة في كليّتها. أما نَقِيض فيُسمّي
        أحد طرفَي هذه العلاقة من حيث نسبته إلى الطرف الآخر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنَاقُض"

    - lemma: "نَقِيض"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَت في المعجم الوسيط بوصفه مصطلحاً منطقياً: «قضيَّة تُعارِض دَعْوًى
        معيَّنة» و«النَّقِيضان: المتناقضان»، وأورده المورد الحديث ترجمةً لـ
        contradictory. الوزن فَعِيل مناسب للدلالة على الوصفية والثبوت. اختبار
        التثبيت المعجمي ناجح: النقيض وحدة معجمية موثّقة في المعاجم العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        نَقِيض يُسمّي القضية الواحدة من منظور علاقتها بمقابلتها: هو 'ما ينقض
        الآخر'. أما تَنَاقُض فيُسمّي العلاقة بين الطرفين معاً في كليّتها.
        استخدام نقيض يُبرز منظور الثنائية (النقيضان)؛ واستخدام تناقض يُبرز
        الظاهرة العلائقية المجرّدة.
      actions:
        - command: create_entry
          params:
            lemma: "نَقِيض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13805471-n"

    - lemma: "تَعَارُض"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود 'التعارض' أحياناً مرادفاً لـ'التناقض' في بعض المصنّفات الأصولية،
        إلا أن دلالته الاصطلاحية الأخص تنصبّ على تقابل الدليلين المتساويين في القوة
        (في أصول الفقه)، ولا يشترط صدق أحدهما وكذب الآخر بالضرورة. كذلك تُرجم في
        ARABTERM إلى 'opposition' و'isothety' لا إلى 'contradictory'. يؤدي إدراجه
        في المجموعة إلى خلط مفاهيمي بين مصطلحات منطقية متمايزة.

    - lemma: "نَقِيضَة"
      source: stage1
      decision: removed
      decision_reason: >
        النقيضة في المعجمية العربية المعاصرة استقرّت على الدلالة على Antinomy
        (التناقض الكانطي بين مبادئ العقل الخالص) وليس Contradictory. كما تدل في
        التراث الأدبي على قصيدة النقائض (نقائض جرير والفرزدق). إدراجها في مجموعة
        'contradictory' يخلط بين مصطلحات فلسفية متباينة.


