step0_evidence:
  per_lemma:
    - lemma: "لغوي"
      expands:
        - text: "«(1) اللُّغويّ (2) المتكلّم لغاتٍ متعدّدة.»"
          source: "المورد الحديث (2008)"
          addition: "يورد المعجم المعنيين للكلمة الإنجليزية، لكن في العربية (لغوي) تعني عالم اللغة، وتوسيعها لتعني (متعدد اللغات) هو تأثر بالإنجليزية."
    - lemma: "متعدد اللغات"
      confirm:
        - text: "«المتكلم بأكثر من لغتين.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«متعلق بمن لديه القدرة على استخدام عدة لغات.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "كثير اللغات"
      source_section: "step5_english_bridge"
      evidence_citation: "«كثير اللغات: متكلِّم [أو كاتبٌ بِـ] عدة لغات.» — المورد الحديث (2008)"
      justification: "تركيب إضافي ثابت ورد في المعاجم ثنائية اللغة للتعبير عن المفهوم (آلية: تركيب)."
  knowledge_candidates:
    - lemma: "ملم باللغات"
      justification: "تركيب وصفي يُستخدم في السياقات العامة (آلية: تركيب)، لكن الأفضلية للمركبات الإضافية مثل متعدد اللغات."
  generation_notes: "التركيب الإضافي هو الأكثر إنتاجية ودقة لترجمة هذه الصفة."

step1_lemma_validation:
  per_lemma:
    - lemma: "متعدد اللغات"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع للتعبير عن المفهوم، وهو مركب إضافي مقبول ومثبت في المعاجم."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح الأساسي والأكثر شيوعاً للتعبير عن إتقان لغات عدة."
      example: "المرشد السياحي الناجح غالباً ما يكون متعدد اللغات ليسهل تواصله مع الزوار."

    - lemma: "لغوي"
      decision: removed
      decision_reason: "اقتراض دلالي أعمى (Blind Literal)؛ فكلمة linguist الإنجليزية تعني المتخصص بعلم اللغة وتعني أيضاً متعدد اللغات، بينما (لغوي) في العربية تقتصر على المتخصص في علوم اللغة ولا تعني بالضرورة التحدث بلغات عدة."
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "fail"
      nuance_differentiation: "اللغوي هو المتخصص في علوم اللغة وقد لا يتحدث إلا لغة واحدة، بينما متعدد اللغات هو من يتقن لغات عدة."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كثير اللغات"
      source: step05
      decision: confirmed
      decision_reason: "مركب إضافي صحيح ومثبت كمرادف لمتعدد اللغات، ويشيع استخدامه."
      step05_citation: "«كثير اللغات: متكلِّم [أو كاتبٌ بِـ] عدة لغات.» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يرادف (متعدد اللغات) وقد يوحي بكثرة اللغات المتقنة قياساً بمجرد التعدد."
      example: "كان الرحالة قديماً كثير اللغات لاحتكاكه بشعوب مختلفة خلال أسفاره."
      actions:
        - command: create_entry
          params:
            lemma: "كثير اللغات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10283916-n"

  synset_flags:
    definition_review_needed: false
    split_needed: false

  added_lemmas:
    - lemma: "كثير اللغات"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

