stage1_review:
  assessment:
    concerns:
      - "المصطلحان المعروضان عبارة عن مركبات وصفية شائعة الاستخدام في علم النفس، وهي تمثل ترجمة دقيقة ومستقرة للمصطلحات الإنجليزية."
      - "اللمّات الحالية تفتقر إلى التشكيل الكامل."
    observations: "التعريف الحالي دقيق وموجز ويعكس المفهوم بشكل جيد. المصطلحان «طاقة عقلية» و«طاقة نفسية» يعبران عن المفهوم من زاويتين متقاربتين؛ فالأول يميل للجانب الإدراكي والذهني، بينما يميل الثاني إلى الجانب الوجداني والانفعالي (وهو الأكثر شيوعاً في التحليل النفسي)."
  blind_candidates:
    - lemma: "طَاقَة نَفْسِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يتكون من 'طاقة' للتعبير عن القوة الكامنة، و'نفسية' لتحديد مجالها."
    - lemma: "طَاقَة عَقْلِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي شائع يستخدم للتعبير عن الجهد أو القوة الذهنية المبذولة."
    - lemma: "دَافِعِيَّة نَفْسِيَّة"
      generation_method: tarkib
      justification: "استخدام مفهوم الدافعية الذي يمثل المحرك الأساسي للسلوك."
    - lemma: "قُوَّة مُحَرِّكَة"
      generation_method: tarkib
      justification: "ترجمة حرفية دقيقة للجانب الوظيفي للمفهوم في التعريف (actuating force)."

stage2_evidence:
  per_lemma:
    - lemma: "طاقة عقلية"
      confirm:
        - text: "«تركيز الطاقة العقلية [على شخص أو شيء].»"
          source: "المورد الحديث (2008)"
    - lemma: "طاقة نفسية"
      confirm:
        - text: "«طاقَةٌ نَفْسِيَّة: psychic energy»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "دافعية نفسية"
      evidence_status: no_material_found
    - lemma: "قوة محركة"
      confirm:
        - text: "«الْقُوَّة المحركة: نَوْعَانِ باعثة وفاعلة»"
          source: "دستور العلماء للأحمدنكري"

stage3_analysis:
  per_lemma:
    - lemma: "طاقة عقلية"
      decision: confirmed
      decision_reason: "مصطلح معتمد وشائع الاستخدام في علم النفس واللغة العامة للتعبير عن الجهد والقوة الذهنية الكامنة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَاقَة عَقْلِيَّة"
    - lemma: "طاقة نفسية"
      decision: confirmed
      decision_reason: "مصطلح علمي ثابت ومسجل في المعاجم الطبية والنفسية للتعبير عن الطاقة الوجدانية والانفعالية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَاقَة نَفْسِيَّة"
    - lemma: "دافعية نفسية"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير مسجل معجمياً كتركيب ثابت لهذه الدلالة، وكلمة 'طاقة' تفي بالغرض بشكل أدق وأكثر شيوعاً."
    - lemma: "قوة محركة"
      source: stage1
      decision: removed
      decision_reason: "مفهوم عام ينطبق على الجانب الفيزيائي والآلات أكثر من تخصصه في الجانب النفسي ما لم يقيّد، ولا يعبر عن دلالة المجموعة الترادفية بنفس الدقة."

stage4_content:
  definition:
    current: "قوة أو عامل محرك في النفس"
    assessment:
      decision: retain
      reason: "التعريف دقيق وموجز ويشمل الجانبين النفسي والعقلي للقوة المحركة بشكل وافٍ، ولا يحتاج لتعديل."
  examples:
    per_lemma:
      - lemma: "طاقة عقلية"
        examples:
          - text: "يَتَطَلَّبُ حَلُّ هَذِهِ الْمُشْكِلَةِ الْمُعَقَّدَةِ طَاقَةً عَقْلِيَّةً كَبِيرَةً."
            type: usage
      - lemma: "طاقة نفسية"
        examples:
          - text: "يَسْتَنْزِفُ التَّوَتُّرُ الْمُسْتَمِرُّ الطَّاقَةَ النَّفْسِيَّةَ لِلْإِنْسَانِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يَسْتَنْزِفُ التَّوَتُّرُ الْمُسْتَمِرُّ الطَّاقَةَ النَّفْسِيَّةَ لِلْإِنْسَانِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يَتَطَلَّبُ حَلُّ هَذِهِ الْمُشْكِلَةِ الْمُعَقَّدَةِ طَاقَةً عَقْلِيَّةً كَبِيرَةً."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يَسْتَنْزِفُ التَّوَتُّرُ الْمُسْتَمِرُّ الطَّاقَةَ النَّفْسِيَّةَ لِلْإِنْسَانِ."

