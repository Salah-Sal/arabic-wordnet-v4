        - word: "نفسية"
          root: "نفس"
          maqayis_quote: "«النُّونُ وَالْفَاءُ وَالسِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خُرُوجِ النَّسِيمِ كَيْفَ كَانَ، مِنْ رِيحٍ أَوْ غَيْرِهَا، وَإِلَيْهِ يَرْجِعُ فُرُوعُهُ. مِنْهُ التَّنَفُّسُ: خُرُوجُ النَّسِيمِ مِنَ الْجَوْفِ.»"
  per_sense:
