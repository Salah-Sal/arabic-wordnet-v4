          maqayis_quote: "«الطَّاءُ وَالْوَاوُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مِثْلِ مَا دَلَّ عَلَيْهِ الْبَابُ الَّذِي قَبْلَهُ. فَكُلُّ مَا اسْتَدَارَ بِشَيْءٍ فَهُوَ طَوْقٌ... فَأَمَّا قَوْلُهُمْ: أَطَاقَ هَذَا الْأَمْرَ إِطَاقَةً، وَهُوَ فِي طَوْقِهِ... لِأَنَّهُ إِذَا أَطَاقَهُ فَكَأَنَّهُ قَدْ أَحَاطَ بِهِ وَدَارَ بِهِ مِنْ جَوَانِبِهِ.»"
        - word: "عقلية"
          root: "عقل"
          maqayis_quote: "«الْعَيْنُ وَالْقَافُ وَاللَّامُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ مُطَّرِدٌ، يَدُلُّ عُظْمُهُ عَلَى حُبْسَةٍ فِي الشَّيْءِ أَوْ مَا يُقَارِبُ الْحُبْسَةَ. مِنْ ذَلِكَ الْعَقْلِ، وَهُوَ الْحَابِسُ عَنْ ذَمِيمِ الْقَوْلِ وَالْفِعْلِ.»"
    - lemma: "طَاقَة نَفْسِيَّة"
