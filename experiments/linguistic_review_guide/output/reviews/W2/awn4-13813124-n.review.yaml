stage1_review:

  # أ. المرشحات العمياء — توليد انطلاقاً من التعريف فقط (قبل الاطلاع على اللمّات)
  # التعريف في الملف المقنّع: "علاقة توفر الأساس لشيء ما"
  blind_candidates:
    - lemma: "إِسْنَاد"
      generation_method: ishtiqaq
      justification: >
        من الجذر س-ن-د على وزن إِفْعَال؛ الإسناد في اللغة العربية هو انضمام
        شيء إلى شيء واستناد أحدهما إلى الآخر — وهو بذلك علاقة تجعل أحد
        طرفيها سنداً وركيزةً للآخر. يُستعمل في المنطق والنحو للدلالة على
        ارتباط شيء بآخر ارتباطاً تأسيسياً.

    - lemma: "مَرْتَكَز"
      generation_method: ishtiqaq
      justification: >
        من الجذر ر-ك-ز على وزن مَفْتَعَل (مصدر ميمي/اسم مكان من ارتكز)؛
        يفيد نقطة الاستناد التي يقوم عليها شيء ما — أي العلاقة التي تجعل
        أحد الطرفين محور ارتكاز للآخر. قياسي على وزن معروف للدلالة على
        موضع الفعل.

    - lemma: "تَقَوُّم"
      generation_method: ishtiqaq
      justification: >
        من الجذر ق-و-م على وزن تَفَعُّل؛ مصدر تقوَّمَ، بمعنى كون الشيء
        قِوَامًا لغيره وأساسًا يقوم عليه. مستعمل في الفلسفة الإسلامية
        للدلالة على العلاقة التأسيسية بين الشيء وما يستند عليه وجوده.

    - lemma: "دِعَامَة"
      generation_method: majaz
      justification: >
        من الجذر د-ع-م؛ الأصل اللغوي "شيء يكون قياماً لشيء ومِسَاكًا".
        بالمجاز: الدعامة هي العلاقة الداعمة التي تمسك شيئاً وتجعله قائماً
        على ما يسنده. وُظِّف في كلام العرب مجازاً للسيد والسند، مما يؤكد
        امتداده الدلالي للعلاقات التأسيسية المجردة.

  # ب. التقييم الأولي بعد الاطلاع على اللمّات الكاملة
  assessment:
    concerns:
      - "الدوران الدلالي: التعريف الحالي «علاقة توفر الأساس لشيء ما» يستخدم لفظة «الأساس» التي هي إحدى لمّات المجموعة ذاتها."
      - "اشتراك اللمّات مع المجموعة الأعلى: المجموعة الأعلى (awn4-13812924-n) تحمل اللمّتين أَنفُسَهما (أَسَاس، قَاعِدَة)، مما يُفقد التمييزَ الهرمي بين المفهومين."
      - "غياب الفارق الدلالي الموثَّق: لا يُبيَّن في سجل المجموعة ما يميز أَسَاس عن قَاعِدَة من منظور هذا المعنى الاصطلاحي."
      - "التعريف وصفي وليس تعريفاً معجمياً منضبطاً: يفتقر إلى الجنس القريب والفصل النوعي."
    observations: >
      المجموعة تعبّر عن مفهوم العلاقة التأسيسية المجردة (relation providing
      the foundation for something)، وهو مفهوم منطقي وفلسفي راسخ في التراث
      العربي. اللمّتان أَسَاس وقَاعِدَة من أمهات الألفاظ العربية الموثّقة
      توثيقاً عريقاً، غير أن الإشكال يكمن في: (١) تداخلهما مع المجموعة
      الأعلى في نفس المنظومة، و(٢) أن التعريف الحالي دائر ولا يُحدِّد
      الفارق بين المفهوم "الأصل الوطيد" (hypernym) والمفهوم "العلاقة التي
      توفّر ذلك الأصل" (هذه المجموعة). يُستحسن إعادة صياغة التعريف بأسلوب
      يُبرز الطابع العلائقي الاصطلاحي.


