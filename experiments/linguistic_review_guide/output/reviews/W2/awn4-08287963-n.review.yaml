stage1_review:
  assessment:
    concerns:
      - "الاكتفاء بلمّة واحدة فقط للمفهوم بالرغم من وجود مترادفات تاريخية وعلمية."
    observations: "المصطلح 'مجرة' هو المصطلح القياسي والوحيد الشائع حالياً، ولكن دلالياً يرتبط تاريخياً بلفظ 'سديم' قبل التمييز الدقيق بين المجرات والسدم داخل المجرة."
  blind_candidates:
    - lemma: "مَجَرَّة"
      generation_method: majaz
      justification: "الاسم العربي الأصيل للتشكيل النجمي في السماء (درب التبانة)، ثم عُمم ليشمل كل الأنظمة المماثلة."
    - lemma: "سَدِيم خَارِجِيّ"
      generation_method: tarkib
      justification: "ترجمة للمصطلح العلمي التاريخي (extragalactic nebula) الذي كان يطلق على المجرات."
    - lemma: "نِظَام نَجْمِيّ"
      generation_method: tarkib
      justification: "وصف دقيق للمجرات باعتبارها أنظمة تضم بلايين النجوم."
    - lemma: "جَزِيرَة كَوْنِيَّة"
      generation_method: majaz
      justification: "استعارة فلكية كلاسيكية لوصف المجرات المنعزلة في الفضاء (Cosmic islands)."

stage2_evidence:
  per_lemma:
    - lemma: "مجرة"
      confirm:
        - text: "«(في عِلْمِ الفلك): تَجَمُّع هائل من النجوم والسُّدُم والغازات والغُبار الكَوْني، تُعَدُّ النجومُ فيه بالملايين أو ملايين البلايين، وتتَّخِذُ أشكالاً مختلفةً، ويوجد في الكون منها بلايين.»"
          source: "المعجم الكبير"
        - text: "«منظومة كونية تتكون من تجمع هائل من النجوم، والكواكب والنيازك والغبار، والغازات، والمادة المظلمة، وترتبط معاً بقوى الجذب المتبادلة وتدور حول مركز مشترك.»"
          source: "ArabTerm"
      expands:
        - text: "«يُطلق اللفظُ المُعَرَّفُ عِلْمًا على المَجَرَّة التي تَضُمُّ شَمْسَنا، والتي عرفها العَرَبُ باسم 'دَرْبِ التَّبَّانَةِ'.»"
          source: "المعجم الكبير"
    - lemma: "سديم خارجي"
      confirm:
        - text: "«سديم خارج المجرة: extragalactic nebula»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
    - lemma: "نظام نجمي"
      confirm:
        - text: "«النَّجم الثُّنائيّ: نظام نجميّ يحتوي على نجمتين تدوران حول المركز نفسه»"
          source: "معجم اللغة العربية المعاصرة"
          conflict: "المصطلح يستخدم للأنظمة الصغرى (نجمين أو أكثر) بينما المجرة هي تجمع لهذه الأنظمة."

stage3_analysis:
  per_lemma:
    - lemma: "مجرة"
      decision: confirmed
      decision_reason: "المصطلح العربي الفصيح والقياسي للمفهوم في علم الفلك الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجَرَّة"
    - lemma: "سَدِيم خَارِجِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف علمي وتاريخي دقيق للمصطلح الإنجليزي 'extragalactic nebula' المذكور في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "سَدِيم خَارِجِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08287963-n"}

stage4_content:
  definition:
    current: "(علم الفلك) مجموعة من الأنظمة النجمية؛ أي من مليارات الأنظمة التي تحتوي كل منها على العديد من النجوم والسدم والغبار"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكنه يفتقر للتركيز على الجاذبية والدوران حول مركز مشترك، وهو ما يميز المجرة عن مجرد الحشود النجمية."
    authored:
      - type: terminological
        text: "(في علم الفلك) تَجَمُّعٌ هائِلٌ مِنَ النُّجومِ والسُّدُمِ والغازاتِ والغُبارِ الكَوْنِيِّ تَرْتَبِطُ بِقُوَّةِ الجَذْبِ المُتَبادَلَةِ وتَدورُ حَوْلَ مَرْكَزٍ مُشْتَرَكٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "مَجَرَّة"
        examples:
          - text: "تَبْعُدُ مَجَرَّةُ أَنْدُرُومِيدَا عَنْ مَجَرَّتِنَا دَرْبِ التَّبَّانَةِ بِمَلَايِينِ السِّنِينَ الضَّوْئِيَّةِ."
            type: usage
      - lemma: "سَدِيم خَارِجِيّ"
        examples:
          - text: "كَانَ الفَلَكِيُّونَ قَدِيمًا يُسَمُّونَ المَجَرَّاتِ البَعِيدَةَ بِالسُّدُمِ الخَارِجِيَّةِ لِشَبَهِهَا بِالضَّبَابِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08287963-n", definition_index: 0, text: "(في علم الفلك) تَجَمُّعٌ هائِلٌ مِنَ النُّجومِ والسُّدُمِ والغازاتِ والغُبارِ الكَوْنِيِّ تَرْتَبِطُ بِقُوَّةِ الجَذْبِ المُتَبادَلَةِ وتَدورُ حَوْلَ مَرْكَزٍ مُشْتَرَكٍ."}

