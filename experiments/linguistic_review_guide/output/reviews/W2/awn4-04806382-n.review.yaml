# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمة الموجودة 'عرقية' مكتوبة بلا تشكيل، مما يُوقع في اشتراك لفظي خطير بين عَرَقِيَّة (ما يُلبس على الرأس تحت العمامة لامتصاص العرق) وعِرْقِيَّة (الصفة النسبية إلى العِرق السلالي)؛ وهما من ناحية المعجم مدخلان مستقلان بدلالتين متباينتين"
      - "التعريف الحالي 'صفة عرقية' يحتوي دوراناً جزئياً إذ تشتقّ 'عرقية' من نفس الجذر الذي تنتسب إليه اللمة المُعرَّفة"
      - "المعجمية الحديثة تستعمل 'إثنية' (تعريب من اليونانية ethnos) بوصفها مصطلحاً موازياً أكثر حياداً تجاه التمييز بين البُعدين البيولوجي والثقافي؛ وهو غائب عن المجموعة"
    observations: >-
      المجموعة تُعبّر عن مفهوم 'ethnicity' الإنجليزي الذي يجمع بُعدَين: السلالي (نسب الدم والأصل الوراثي) والثقافي (الموروث والهوية المشتركة).
      الجذر العربي عِرق يرد في مقاييس اللغة لابن فارس بأربعة أصول، أحدها الأصل والسنخ المتشعّب (عريق في الكرم، أعراق الخير)، مما يجعل اشتقاق 'عِرْقِيَّة' بمعنى صفة الانتساب الجنسي مشروعاً لغوياً. غير أن غياب التشكيل يُفضي إلى خلط مع العَرَقِيَّة (لباس الرأس). ثمة منافسة مصطلحية مع 'إثنية' الأكاديمية التعريبية الشائعة في المعاجم المتخصصة. المفهوم موجود في الثقافة العربية عبر مفاهيم القبيلة والقوم والنسب، لكنه يفتقر إلى مصطلح واحد مستقرّ (فجوة معجمية).

  blind_candidates:
    - lemma: "سُلَالِيَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق من جذر سلل → سلالة → مصدر صناعي على وزن فُعَالِيَّة، يُعبّر عن 'صفة النسب السلالي' المُستمدة من الشق السلالي في التعريف ('روابط سلالية')"
    - lemma: "قَوْمِيَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق من جذر قوم → قومية على وزن فَعْلِيَّة؛ يحمل معنى الانتماء إلى القوم/الجماعة البشرية المترابطة بالروابط الاجتماعية والثقافية"
    - lemma: "الهُوِيَّةُ القَوْمِيَّةُ"
      generation_method: tarkib
      justification: "مركب وصفي (هوية + قومية) يُعبّر عن الهوية الجماعية المنبثقة عن الروابط الثقافية والسلالية المشتركة، مُحاكياً مضمون التعريف"
    - lemma: "إِثْنِيَّة"
      generation_method: taarib
      justification: "تعريب من اليونانية ethnos (أمة/شعب/جماعة)؛ شائع في المعاجم التخصصية العربية الحديثة للتعبير عن ethnicity بحياد دلالي يتجاوز البُعد البيولوجي البحت"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفَّذة: ٤ (headword batch ١، English bridge ١، FTS Arabic ١، enrichment ١)
stage2_evidence:

  per_lemma:

    - lemma: "عرقية"
      contradicts:
        - text: "«العَرَقِيَّةُ: ما يلبس على الرأس تحت العمامة ليمتص العرق؛ ما يوضع على ظهر الفرس أو الحمار تحت السرج أو البرذعة (مو)»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط (OCR) يُثبّت 'العرقية' بالفتح (عَرَقِيَّة) بمعنى لباس الرأس من اشتقاق عَرَق = تعرُّق، لا بمعنى الصفة العِرقية المنسوبة إلى عِرق = أصل سلالي؛ وهذا يُثبّت الاشتراك اللفظي الخطير الناجم عن غياب التشكيل"
      expands:
        - text: "«سلالي، عرقي: انتماء أصلي لمجموعة في بلد أو منطقة ما»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          addition: "يُوثّق المعجم الصفةَ 'عرقي' للدلالة على الانتماء الأصلي، مما يُسوّغ اشتقاق الاسم المجرد 'عِرْقِيَّة' منها"
        - text: "«الصِّفة [أو الرابطة] العرقية أوالأَثْنيّة»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "المورد الحديث يُترجم 'ethnicity' بـ 'الصفة العرقية أو الأثنية'، مما يُثبت شيوع 'عرقية' في هذا السياق وإن كان في صيغة تركيبية لا إفرادية"
        - text: "«عِرْقِيّ، إثنـيّ»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
          addition: "يُسوّي مصطلح القانون بين 'عرقي' و'إثني' كمعادلَين للصفة ethnic"
        - text: "«الْعَيْنُ وَالرَّاءُ وَالْقَافُ أَرْبَعَةُ أُصُولٍ صَحِيحَةٌ... فُلَانٌ مُعْرِقٌ لَهُ فِي الْكَرَمِ، أَيْ لَهُ فِيهِ أَصْلٌ وَسِنْخٌ. وَالْعَرِيقُ مِنَ الْخَيْلِ وَالنَّاسِ: الَّذِي لَهُ عِرْقٌ فِي الْكَرَمِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُؤصّل ابن فارس دلالة الأصل الوراثي والسنخ في جذر عرق، مما يُعمّق المسوّغ اللغوي لاشتقاق 'عِرْقِيَّة' بمعنى صفة الانتساب الأصلي"

    - lemma: "سُلَالِيَّة"
      evidence_status: "no_material_found"

    - lemma: "قَوْمِيَّة"
      confirm:
        - text: "«القَوْمِيَّةُ: صلة اجتماعية عاطفية تنشأ من الاشتراك في الوطن والجنس واللغة والمنافع. وقد تنتهي بالتضامن والتعاون إلى الوحدة، كالقومية العربية. (محدثة)»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«قومية: nationalism»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — ARABTERM"
          conflict: "ARABTERM يُقابل 'قومية' بـ nationalism لا ethnicity؛ القومية = الولاء السياسي والشعور الجمعي للدولة/الأمة، أما العِرقية = صفة الانتماء الجنسي الثقافي/السلالي بمعزل عن البُعد السياسي"
        - text: "«قومية: nationalism»"
          source: "مسرد الفلسفة وعلم النفس — ARABTERM"
          conflict: "تأكيد ثانٍ: 'قومية' في المصطلحية العربية الحديثة تُقابل nationalism، لا ethnicity"
        - text: "«قومية: nationalism»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — ARABTERM"
          conflict: "تأكيد ثالث من مصدر مستقل"

    - lemma: "الهُوِيَّةُ القَوْمِيَّةُ"
      evidence_status: "no_material_found"

    - lemma: "إِثْنِيَّة"
      confirm:
        - text: "«نزعة إثنية: كل ما يشير إلى أصل عرقي أو قبلي لجماعة أفراد ينخرطون في نوع من المركزية العرقية (هنود، عرب)، لهذا كثيراً ما يكشف الأدب عن هذه الإثنية وخاصة في الآداب الشفوية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
        - text: "«أَثَنِيّ: ethnic»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
      expands:
        - text: "«الْهَمْزَةُ وَالثَّاءُ وَالنُّونُ لَيْسَ بِأَصْلٍ، وَإِنَّمَا جَاءَتْ فِيهِ كَلِمَةٌ مِنَ الْإِبْدَالِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُؤكّد ابن فارس أن أثن ليس جذراً عربياً أصيلاً؛ هذا يُثبّت أن 'إثنية' تعريبٌ لمفهوم أجنبي (ethnos اليوناني) لا اشتقاق، وهو أمر مقبول للمصطلحات الدولية المعيارية المأخوذة بصيغتها"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "عرقية"
      decision: confirmed
      decision_reason: >-
        اللمة مستعملة فعلاً في الخطاب العربي الحديث (قانوني، إعلامي، لسانياتي) للتعبير عن مفهوم ethnicity،
        وجذر عِرق يُؤصّل دلالة الأصل والنسب في العربية القديمة (عريق في الكرم، أعراق الخير).
        المشكلة الوحيدة هي غياب التشكيل المُفضي إلى الاشتراك مع عَرَقِيَّة (لباس الرأس)؛
        يُحلّ بإضافة تشكيل كامل: عِرْقِيَّة (بكسر العين وسكون الراء). دليل المورد الحديث ومعجم اللسانيات يُسوّغ الاستعمال.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "عِرْقِيَّة تُركّز على البُعد البيولوجي/النسَبي للانتماء وتنطوي على إيحاء عِرق = أصل وراثي؛ أكثر شيوعاً في الخطاب الإعلامي العام والتقارير الحقوقية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عِرْقِيَّة"

    - lemma: "سُلَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح غير موثق في المعاجم كاسم مجرد بمعنى ethnicity؛ 'سلالي' موجود فقط كصفة (adjective) في ARABTERM. علاوة على ذلك يقصر على البُعد البيولوجي/النسَبي ويُهمل البُعد الثقافي المنصوص عليه في التعريف."

    - lemma: "قَوْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: "القومية في المعجمية العربية الحديثة تُقابل nationalism (ثلاثة معاجم ARABTERM مستقلة)، وليس ethnicity. الدلالتان متقاطعتان لكنهما غير متطابقتين: القومية تنحو نحو الولاء السياسي الجمعي، والعِرقية صفة انتماء ثقافي/نسبي أوسع وأقدم."

    - lemma: "الهُوِيَّةُ القَوْمِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: "التعبير غير ثابت كمصطلح مسكوك لـ ethnicity؛ يفشل اختبار السكّ (يمكن إبدال 'قومية' بـ 'ثقافية' أو 'عرقية' ويبقى وصفاً صالحاً). المُثبَّت في ARABTERM هو 'هوية عرقية' لـ ethnic identity وهو مفهوم مختلف."

    - lemma: "إِثْنِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        التعريب مقبول للمصطلحات ذات الأصل الدولي من اليونانية ethnos.
        مسرد اللسانيات (2002) يستعمل 'الإثنية' اسماً مجرداً صريحاً في سياق تعريف ethnicity.
        المعجم الطبي يُثبّت الصيغة الصفية 'أَثَنِيّ = ethnic'. يقبل لام التعريف والجمع (إثنيات) والنسبة (إثني).
        الاشتراك الخطّي مع 'أثنية = وثنية' (paganism) خطّيٌّ لا دلالي.
        مقاييس اللغة تؤكد عدم أصالة الجذر، مما يُثبّت وضعه كتعريب لا اشتقاق — وهو المسار الأخير المقبول لمثل هذه المصطلحات.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "إِثْنِيَّة محايدة دلالياً بين البُعدين البيولوجي والثقافي؛ مُفضَّلة في السياقات الأكاديمية وعلمَي الاجتماع والأنثروبولوجيا؛ تُقابل الاستعمال الغربي المعاصر لـ ethnicity"
      actions:
        - command: create_entry
          params: {lemma: "إِثْنِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}


