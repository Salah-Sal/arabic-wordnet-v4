          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "النزاع يحمل معاني متعددة (نزوع وشوق + مخاصمة) — في سياق المجموعة يُقصد المخاصمة والخلاف"
        - text: "«النُّونُ وَالزَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قَلْعِ شَيْءٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الجذري انتزاع الشيء — الخلاف والمنازعة مجاز منه، كأن كل طرف ينزع الحق لنفسه"

    - lemma: "شِقَاق"
      confirm:
