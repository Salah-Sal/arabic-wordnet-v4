      nuance_differentiation: >
        الصراع يحمل دلالة المواجهة الحادة المباشرة وقد تكون مسلحة أو فكرية أو نفسية. هو أوسع
        الثلاثة نطاقاً وأشدها عمومية، ويُستخدم للتعبير عن التصادم الشامل بين جماعات أو قوى
        أو رؤى متعارضة. يُرادف conflict في الأدبيات العلمية بمختلف تخصصاتها.
