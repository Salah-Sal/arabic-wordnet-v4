        التصادم والمواجهة، ومستخدمة على نطاق واسع في المصطلحات التقنية (طب، اجتماع، قانون،
        تربية) بمعنى conflict. الأدلة من ARABTERM كثيفة ومتوافقة. بوابة الجودة مستوفاة:
        الاطّراد تام، يُسر التداول عالٍ، ملاءمة عامة واسعة، عربي أصيل من جذر صرع.
        تحتاج اللمّة إضافة التشكيل الكامل.
