        - text: "«(فـي الأدب): التَّصادمُ بـين الشَّخصيَّات, أو النِّزاع الذى يؤدّى إلى تعقيد الحدثِ في المسرحيةِ أو القصة. وهو ينقسمُ قسمين: صراعٌ داخليٌّ, وصراعٌ خارجيٌّ»"
          source: "المعجم الكبير"
        - text: "«حالة شعورية مؤلمة تنشأ عن تضاد الدوافع النفسية عند شخص ما»"
