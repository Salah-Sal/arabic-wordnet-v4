# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (صراع، نزاع) تفتقران إلى التشكيل الكامل"
      - "المجموعة تضم لمّتين فقط مع إمكانية إثرائها بمصطلح ثالث أصيل ورد في القرآن الكريم وكتب المعاجم"
    observations: >
      المجموعة تُعبّر عن مفهوم «التعارض والخلاف» وهو مفهوم أصيل في العربية ذو إرث واسع
      من الاستخدام الكلاسيكي والمعاصر. يشمل المفهوم ثلاثة أبعاد: الخلاف بين الأشخاص،
      وتعارض الأفكار، وتنافر المصالح. كلا اللمّتين الموجودتين راسختان لكنهما تستحقان تشكيلاً
      كاملاً وتمييزاً دلالياً صريحاً. التعريف الحالي دقيق في مضمونه وإن أمكن تعزيزه أسلوبياً.
      لاحظت أن لفظ «شقاق» الوارد في القرآن الكريم وكتب المعاجم قد يُثري هذه المجموعة.

  blind_candidates:
    - lemma: "شِقَاق"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ش ق ق) على وزن فِعَال الدال على المصدرية مع دلالة التكرار والثبوت.
        الشقاق في أصله الانصداع والتفرق، ثم استُعمل استعمالاً راسخاً للدلالة على الخلاف
        والمخالفة حين ينشق الفريقان فيصير كل منهما في «شق» مغاير. ورد في القرآن الكريم
        وكتب المعاجم الكلاسيكية بهذا المعنى.
    - lemma: "تَضَادّ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ض د د) على وزن تَفَاعُل الدال على التبادلية والاشتراك. التضادّ يعني
        قيام التقابل والتنافر بين شيئين، وهو مناسب لجانب تعارض الأفكار والمفاهيم في التعريف
        الذي يشمل الأفكار والمصالح.
    - lemma: "خِصَام"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (خ ص م) على وزن فِعَال وهو مصدر خاصَمَ. الخصام يدل على المنازعة
        والتجاذب بين الأطراف، وهو مرادف للنزاع والصراع في كثير من السياقات. جذره في
        المقاييس يجعل المنازعة أصلاً راسخاً.
    - lemma: "مُنَاوَأَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ن و أ) على وزن مُفَاعَلَة الدال على المشاركة والتقابل. المناوأة
        تعني المعارضة والمناهضة، وهي مناسبة للتعبير عن حالة التعارض الفعلي بين أطراف
        تقف كل منها في مواجهة الأخرى.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────

