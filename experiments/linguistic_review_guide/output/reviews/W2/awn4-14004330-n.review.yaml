      expands:
        - text: "«مُعالجةُ القِرْنَيْن أيهما يطرحُ صاحبَه»"
          source: "المعجم الكبير"
          addition: "الدلالة الأصلية المصارعة الجسدية امتدت استعارةً لتشمل كل مواجهة وتصادم بين الأطراف"
        - text: "«الصَّادُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى سُقُوطِ شَيْءٍ إِلَى الْأَرْضِ عَنْ مِرَاسِ اثْنَيْنِ، ثُمَّ يُحْمَلُ عَلَى ذَلِكَ وَيُشْتَقُّ مِنْهُ»"
