# مراجعة المجموعة الترادفية: awn4-06799486-n
# direction / instruction — إِرْشَادَات / تَعْلِيمَات / تَوْجِيه
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تَوْجِيه» مفردة بينما المفهوم يدلّ على رسائل متعددة الخطوات؛ الصيغة الجمعية «تَوْجِيهَات» أنسب"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي ويفتقر لأسلوب المعجم العربي"
    observations: "المجموعة تدلّ على نوع من الرسائل يصف كيفية أداء عمل ما، أي الإرشادات والتعليمات. اللمّات الثلاث الموجودة تنتمي لحقل دلالي واحد لكنّ كلاً منها يحمل ظلالاً خاصة: الإرشادات تُركّز على الهداية والنصح، والتعليمات على الأمر والإلزام، والتوجيه أعمّ وأشمل. المصدر المفرد «توجيه» أقلّ ملاءمة من الجمع في هذا السياق."
  blind_candidates:
    - lemma: "تَوْجِيهَات"
      generation_method: ishtiqaq
      justification: "جمع تَوْجِيهة من جذر و-ج-ه على وزن تَفْعِيلة، يدلّ على مجموعة أوامر أو خطوات مرشدة لأداء عمل"
    - lemma: "وَصَايَا"
      generation_method: majaz
      justification: "جمع وَصِيَّة من جذر و-ص-ي، أصلها ما يُعهَد به إلى الغير، تُستعمل مجازاً بمعنى التعليمات والنصائح المُلزمة"
    - lemma: "دَلِيل"
      generation_method: ishtiqaq
      justification: "من جذر د-ل-ل على وزن فَعِيل، يدلّ على ما يُستَرشَد به ويُهتدى بمضمونه في أداء عمل"
    - lemma: "هِدَايَات"
      generation_method: ishtiqaq
      justification: "جمع هِدَاية من جذر ه-د-ي، يدلّ على ما يُرشِد إلى الطريق الصحيح لأداء الفعل"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "إِرْشَادَات"
      confirm:
        - text: "«النُّصْح والتَّوعِيَة بِالصَّواب والتوجيه إليه»"
          source: "المعجم الكبير (مادة: الإرشاد)"
        - text: "«الثوابت التي يتم العمل على أساسها، على سبيل المثال: إرشادات التشغيل، إرشادات العمل، الإرشادات التنفيذية الموحّدة.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«إِرْشَادَات الاسْتِعْمَال — directions for use»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      expands:
        - text: "«الإرشادات المَسْرحيّة: أوصاف الممثِّلين وحركاتهم مطبوعةً في ثنايا المسرحيّة ليستعين بها المخرج إلخ.»"
          source: "المورد الحديث (2008)"
          addition: "توسيع الدلالة إلى إرشادات مكتوبة في نصّ"

    - lemma: "تَعْلِيمَات"
      confirm:
        - text: "«تعليمات — instructions»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«تعليمات — instructions»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«تعليمات — instructions»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«تَعْلِيمَات — instructions»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«تعليمات — briefing / instruction (teaching)»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«التعليم: تنبيه النفس لتصور المعاني. والتعلم تنبه النفس لتصور ذلك. وربما استعمل في معنى الإعلام لكن الإعلام اختص بما كان بإخبار سريع، والتعليم اختص بما يكون بتكرير وتكثير حتى يحصل منه أثر في نفس المتعلم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "التعليم يتضمن التكرار والتأثير، أعمق من مجرد الإخبار"

    - lemma: "تَوْجِيه"
      confirm:
        - text: "«توجيه — briefing; instruction (teaching)»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«تقديم إرشادات تساعد المتكلم على إقامة تواصل ناجح مع مخاطب معين.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      contradicts:
        - text: "«(التَّوْجِيه) (في الشِّعْر): حركة الحرف قبل الروِيِّ المُقَيَّد. (في البَلاغَة): إِيراد الكلام محتمِلاً لوجهين مختلفين»"
          source: "المعجم الوسيط"
          conflict: "الدلالة المعجمية الأصلية للتوجيه مصطلح بلاغي/عروضي لا علاقة له بالتعليمات"
        - text: "«نشاط في قطاع بناء الطرق أو في تخطيط الطرق، لتثبيت مسار طرقات النَّقل»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "توجيه يعني routing/orientation في أغلب المعاجم التقنية، لا instructions"
      expands:
        - text: "«عملية مخططة ومنظمة وتفاعلية تنشأ عن علاقات مهنية بناءة بين مرشد ومسترشد يقوم فيها المرشد بمساعدة الطالب على فهم ذاته ومعرفة قدراته»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (2020)"
          addition: "التوجيه بمعنى الإرشاد التربوي عملية تفاعلية لا مجرد رسالة"

    - lemma: "تَوْجِيهَات"
      confirm:
        - text: "«توجيهات قارّة — standing instructions»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«توجيهات تقنية: الهواء — technical instructions: air»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"

    - lemma: "وَصَايَا"
      evidence_status: "no_material_found"

    - lemma: "دَلِيل"
      contradicts:
        - text: "«(1) الدَّليل؛ الخط الهادي (2) موجَز [لنهجٍ أو سياسة].»"
          source: "المورد الحديث (2008)"
          conflict: "دَلِيل يعني guideline (مبدأ موجّه) لا instruction (تعليمات تفصيلية)"

    - lemma: "هِدَايَات"
      expands:
        - text: "«هِدَايات — من (ه د ي) جمع هِدَاية.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "اللفظة مسجّلة كاسم علم، لا كمصطلح معجمي عامّ"

