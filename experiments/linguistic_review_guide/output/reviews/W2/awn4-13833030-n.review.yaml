        الحرفية للإنجليزية؛ ينبغي تحويله إلى أسلوب المعجم الوسيط المصطلحي"

    observations: >
      المجموعة تُعبِّر عن مفهوم 'ما تبقّى بعد أخذ أجزاء من الشيء أو طرحها'، وهو مفهوم
      راسخ في التراث المعجمي العربي ذو غنى اشتقاقي بالغ من جذرَي (ب ق ي) و(ف ض ل). الجذر
