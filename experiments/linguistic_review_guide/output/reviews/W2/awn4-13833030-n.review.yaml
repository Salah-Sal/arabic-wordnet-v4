        ونحوه'، مما يُلقي ظلالاً سلبية عند الاستخدام الحيادي؛
        (٣) التضارب في الضبط: معجم الصواب يرفض صيغة الفتح (فَضْلَة) ويجيز الضم
        (فُضْلَة) فحسب. بالمقارنة، فُضَالَة أكثر ثباتاً وتخصصاً في دلالة residue/remainder
        دون هذه الإشكاليات.
      evidence_assessment:
        case: mixed

    # ── مُتَبَقٍّ (مرشح المرحلة ١) ──
    - lemma: "مُتَبَقٍّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        اسم فاعل من تَبَقَّى (المزيد الخامس من بقي) على وزن مُتَفَعِّل، مُثبَت في
        المعاجم التقنية المتعددة بصفته مقابلاً لـ residual وremainder. يتميّز بقدرته
        على الوصف والتسمية في آنٍ، ويتصرّف صرفاً عربياً سليماً (المتبقّي، المتبقّيات).
        لا تناقض في الأدلة. ضروري لتغطية الاستخدام التقني العلمي الحديث.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستخدم خاصةً في الأسلوب العلمي والتقني المعاصر (الكيمياء والبيئة والهندسة
        والطب)؛ يُعبِّر عن النتيجة الديناميكية لعملية مستمرة أُزيلت فيها مادة ما
        ('ما آل إلى البقاء بعد عملية')، بينما بَاقٍ وبَقِيَّة أكثر ثباتاً ومطلقيةً
        في دلالتهما.
      actions:
        - command: create_entry
          params:
            lemma: "مُتَبَقٍّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13833030-n"

    # ── رَاسِب (مرشح المرحلة ١) ──
    - lemma: "رَاسِب"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت بصورة قاطعة أن 'رَاسِب' في الاصطلاح الحديث يُقابل
        precipitate (المادة التي تنفصل من المحلول كيميائياً) وsediment (الرواسب
        الجيولوجية)، لا remainder أو residue بمعناهما العام. التعدّي الدلالي
        المُفترَض (من الثبوت والرسوخ إلى معنى البقية) لا يُسنده أي شاهد معجمي
        في هذه الدلالة. فضلاً عن ذلك، الاستخدام الراسخ (precipitate) يُفضي
        إلى التباس مفاهيمي مع مجموعات ترادفية أخرى في AWN4.
      evidence_assessment:
        case: contradicts_only

    # ── فُضَالَة (مرشح المرحلة ١) ──
    - lemma: "فُضَالَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        'فُضَالَة' على وزن فُعَالَة من جذر (ف ض ل) ذات أصالة كلاسيكية واضحة
        ('البقيّة من الشيء' في المعجم الوسيط وغيره)، ومُثبَتة في المعاجم التقنية
        الحديثة مقابلاً لـ residue في الكيمياء والجيولوجيا والهندسة والطب البيطري
        والمورد الحديث. تمتاز بتخصّصها في سياق ما بقي بعد عملية صناعية
        (تقطير، ترشيح، احتراق)، مما يُكمِّل 'بَقِيَّة' في الحقل التقني العلمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تحمل دلالة ما فاض وزاد عن الكفاية ثم بقي بعد عملية معالجة أو إزالة
        (تقطير، ترشيح، حرق)؛ أكثر استخداماً في الكيمياء والجيولوجيا والبيئة
        من بَقِيَّة، وأقل شيوعاً في الاستخدام اليومي منها. تختلف عن مُتَبَقٍّ
        بكونها اسماً جامداً لا صفة مُحوَّلة إلى اسم.
      actions:
        - command: create_entry
          params:
            lemma: "فُضَالَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13833030-n"


