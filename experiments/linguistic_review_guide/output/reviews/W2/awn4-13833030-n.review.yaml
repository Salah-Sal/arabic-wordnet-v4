        في لغة العلوم الطبيعية.

    - lemma: "فُضَالَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من جذر (ف ض ل) على وزن فُعَالَة، وهو وزن منتج في العربية للدلالة على
        المتبقّيات والفضلات؛ تدل على ما فاض وتبقّى بعد الكفاية أو بعد عملية صناعية،
        وتُستخدم في الكيمياء والجيولوجيا للدلالة على المتبقّي بعد التقطير أو الترشيح.


