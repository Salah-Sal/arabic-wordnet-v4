      بَاقٍ وبَقِيَّة ومُتَبَقٍّ وبَقَايَا. أما الجذر الثاني فيحمل دلالة الزيادة عن الكفاية،
      فيُولِّد: فَضْل وفُضَالَة وفُضْلَة. اللمّتان الحاليتان صحيحتان من حيث الجوهر، لكنهما
      تفتقران إلى التشكيل الكامل الإلزامي، وتُمثّلان دلالة الاستخدام العام دون أن تغطّيا
      الحقل التقني والعلمي. لم يُلاحَظ خطأ في POS — المجموعة اسمية صحيحة.

