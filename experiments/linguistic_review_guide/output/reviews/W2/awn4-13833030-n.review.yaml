        الاستخدام أو الأخذ. وردت في المعاجم الكلاسيكية بمعنى 'ما بقي من الشيء'، وهي
        قريبة من المعنى المستهدف للمجموعة.

    - lemma: "مُتَبَقٍّ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل تَبَقَّى (الباب الخامس من جذر ب ق ي) على وزن مُتَفَعِّل،
        يدل على ما آل إلى حالة البقاء ولم يُزَل؛ مصطلح منتج في الأسلوب التقني
