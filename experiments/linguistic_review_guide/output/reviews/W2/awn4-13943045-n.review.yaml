# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريفُ الحالي «حالة الانقسام أو الانشطار» دائري؛ إذ يستخدم اللمّتَيْن المُدرجتَيْن في المجموعة تعريفاً للمجموعة ذاتها."
      - "غياب التشكيل الكامل عن كلتا اللمّتَيْن الموجودتَيْن."
      - "«انقسام» مصطلح أشمل من المفهوم المقصود؛ فهو يشمل سياقات متعددة (قانونية، رياضية، إدارية) قد لا تنتمي إلى هذا المعنى."
      - "«انشطار» مرتبط في الاستعمال الحديث بالانشطار النووي وانشطار الخلايا تحديداً، وهو أضيق من المفهوم العام «the state of being split or cleft»."
      - "غياب المصطلح الأدق لمفهوم «الانفلاق» (cleavage في الأحياء والمعادن) من لمّات المجموعة."
    observations: >
      هذه المجموعة تُمثّل مفهوماً مجرداً هو «حالة الانشطار أو الانقسام»، وهو
      المقابل العربي لـ cleavage في دلالته الاسمية العامة (ILI i110105). تعتمد
      العربية على مصادر من جذور متعددة للتعبير عن هذه الحالة: شَطَرَ (النصف)،
      وشَقَّ (الانصداع)، وفَلَقَ (الفرجة والبينونة)، وقَسَمَ (التجزئة)، وصَدَعَ
      (الانفراج). الأنسب لهذا المجال هو إثراء المجموعة بلمّتَيْ «انشقاق» و«انفلاق»
      لاستيعاب الدلالة الكاملة لـ cleavage في الكيمياء وعلم الأحياء والجيولوجيا.
      المجموع الترادفي الوارد يفتقر إلى التمييز الدلالي الدقيق بين لمّاته.

  blind_candidates:
    - lemma: "اِنشِقَاق"
      generation_method: ishtiqaq
      justification: "مصدر على وزن اِنْفِعَال من جذر ش-ق-ق، يدل على الحالة الناجمة عن الشق؛ يُناسب دلالة «حالة كون الشيء مشقوقاً» مناسبةً صرفية ودلالية."
    - lemma: "تَصَدُّع"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَعُّل من جذر ص-د-ع، يدل على التشقق التدريجي؛ أصله «الانفراج في الشيء» كما في مقاييس اللغة، وقد يُعبّر عن الحالة المطلوبة."
    - lemma: "اِنفِلَاق"
      generation_method: ishtiqaq
      justification: "مصدر على وزن اِنْفِعَال من جذر ف-ل-ق، يدل على الفرجة والبينونة في الشيء؛ يُستعمل في علم الأحياء للتعبير عن cleavage بصورة مباشرة."
    - lemma: "صَدْع"
      generation_method: majaz
      justification: "توسيع دلالي من معنى «الشق في الشيء الصلب» إلى وصف حالة الانقسام؛ أصيل في العربية الكلاسيكية، وله شاهد قرآني ومعجمي وافر."


