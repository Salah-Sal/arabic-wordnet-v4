        فِي الشَّيْءِ، ثُمَّ يُحْمَلُ عَلَيْهِ وَيُشْتَقُّ مِنْهُ عَلَى مَعْنَى
        الِاسْتِعَارَةِ. تَقُولُ شَقَقْتُ الشَّيْءَ أَشُقُّهُ شَقًّا، إِذَا
        صَدَعْتَهُ.»

