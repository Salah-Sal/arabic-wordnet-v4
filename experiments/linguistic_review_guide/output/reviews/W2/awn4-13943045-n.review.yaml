      maqayis_quote: >
        «الْقَافُ وَالسِّينُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا
        عَلَى جَمَالٍ وَحُسْنٍ وَالْآخَرُ عَلَى تَجْزِئَةِ شَيْءٍ. فَالْأَوَّلُ
        الْقَسَامُ، وَهُوَ الْحُسْنُ وَالْجَمَالُ… وَالثَّانِي الْقِسْمَةُ.»

