        «الشِّينُ وَالطَّاءُ وَالرَّاءُ أَصْلَانِ، يَدُلُّ أَحَدُهُمَا عَلَى
        نِصْفِ الشَّيْءِ، وَالْآخَرُ عَلَى الْبُعْدِ وَالْمُوَاجَهَةِ. فَالْأَوَّلُ
        قَوْلُهُمْ شَطَرَ الشَّيْءَ، لِنِصْفِهِ، وَشَاطَرْتُ فُلَانًا الشَّيْءَ،
        إِذَا أَخَذْتَ مِنْهُ نِصْفَهُ وَأَخَذَ هُوَ النِّصْفَ.»

    - lemma: "اِنْقِسَام"
