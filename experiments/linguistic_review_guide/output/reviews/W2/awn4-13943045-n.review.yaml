        وَبَيْنُونَةٍ فِي الشَّيْءِ، وَعَلَى تَعْظِيمِ شَيْءٍ. مِنْ ذَلِكَ:
        فَلَقْتُ الشَّيْءَ أَفْلِقُهُ فَلْقًا. وَالْفَلَقُ: الصُّبْحُ; لِأَنَّ
