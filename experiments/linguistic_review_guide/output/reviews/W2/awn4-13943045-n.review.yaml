# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "انشطار"
      decision: confirmed
      decision_reason: >
        مُثبَت في ARABTERM بمعنى cleavage (صيدلة) وfission (أحياء، فيزياء).
        الجذر شطر يدل على النصف والتقسيم الثنائي، وهو ملائم لجزء من دلالة المجموعة.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختص بالانقسام الثنائي إلى نصفين أو شطرين متقاربَيْن في الحجم، ولا سيما
        في سياق الفيزياء النووية (nuclear fission) والانقسام الخلوي اللانوي؛ مشتق
        من «شَطَرَ» أي أخذ النصف.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنشِطَار"

    - lemma: "انقسام"
      decision: confirmed
      decision_reason: >
        مُثبَت في معاجم ARABTERM بمعنى division وfission وscission. هو المصطلح
        الأعم الدلالة في هذه المجموعة، ويُغطي الحالة العامة لأي تقسيم.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الأشمل والأكثر تجريداً في المجموعة؛ يدل على أي تجزئة لشيء إلى قسمين
        أو أكثر بصرف النظر عن الكيفية أو العدد. مشتق من «قَسَمَ» أي جزَّأ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْقِسَام"

    - lemma: "انشقاق"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَت في ARABTERM بمعنى cleavage وsplitting في مجالي الكيمياء والطب،
        ومساوٍ للمصطلح «انفصام» في بعض السياقات. جذره ش-ق-ق من أصل صحيح
        يدل على الانصداع في الشيء (مقاييس اللغة). يُكمّل المجموعة في سياق
        التشقق المعدني والكيميائي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على التشقق على طول مستوٍ محدد كما في انشقاق البلورات والمعادن
        والخشب؛ أدق في وصف التشقق الخطي المنتظم دون الانفصال التام. مشتق من
        «شَقَّ» أي صَدَعَ.
      actions:
        - command: create_entry
          params:
            lemma: "اِنشِقَاق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13943045-n"

    - lemma: "انفلاق"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَت مباشرةً بمعنى «cleavage» في المعجم الموحد لمصطلحات علم الأحياء
        (1993)، وبمعنى «fissility» في معجم المصطلحات المهنية. جذره ف-ل-ق من
        أصل صحيح يدل على «فُرجة وبَيْنُونة في الشيء» (مقاييس اللغة). استخدامه
        في علم الأحياء للانقسام الخلوي الأول بعد الإخصاب يجعله لمّةً دقيقة
        ومستعملة في المجال العلمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستعمل تحديداً لوصف الانقسام الخلوي الأول (cleavage division في الأجنة)
        وتشقق المواد ذات الطبقات البلورية. يُوحي بالانفتاح والبينونة أكثر من
        الانكسار. مشتق من «فَلَقَ» أي فَرَقَ الشيء.
      actions:
        - command: create_entry
          params:
            lemma: "اِنفِلَاق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13943045-n"

    - lemma: "تصدع"
      source: stage1
      decision: removed
      decision_reason: >
        «التصدع» في المعاجم الحديثة مُخصَّص في الغالب للعملية الجيولوجية
        (Faulting = تكسر الصخور بقوة)، وهو فعل/مصدر للعملية الجارية أكثر منه
        اسماً للحالة الثابتة. كما أنه في العربية أشيع استعمالاً كفعل (تَصَدَّعَ)
        لا كحالة اسمية. لا يُكمّل المجموعة بل يُضيف تخصصاً جيولوجياً غير مقصود.

    - lemma: "صدع"
      source: stage1
      decision: removed
      decision_reason: >
        «الصدع» يدل على الشق المادي الملموس (الفجوة أو الكسر) لا على الحالة
        المجردة للانقسام. هو اسم للنتيجة (the cleft) لا لحالة الكيان
        (the state of being cleft). كما أن اللفظ مُشترك بين معانٍ متعددة
        (الصداع، الرجل القوي، الفتى الشاب) مما يُوجب الحذر. يقابل بالإنجليزية
        «cleft» أو «fissure» لا «cleavage» بمعناه الاسمي المجرد.


