# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04730898-n  |  ili: i61870  |  pos: n
# المراجع: protectiveness — صفة توفير الحماية أو الوقاية
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (أعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة (حماية) مصدرٌ يدل على فعل الحماية وعمليتها، لا على الخاصية المجردة للكون وقائياً؛ فهي مفهوم مختلف (protection ≠ protectiveness)"
      - "اللمّة (وقائية) صيغةٌ نسبية صِفِيَّة بالدرجة الأولى وليست اسماً مجرداً للخاصية، وإن كانت تُقبل استعمالاً في دور الاسم الصناعي في العربية المعاصرة"
      - "كلتا اللمّتين خاليتان من التشكيل الكامل"
      - "التعريف الحالي دوري: يستخدم (الحماية) و(الوقاية) لتعريف مفهوم ينبثق منهما دون تمييز بين الفعل والصفة المجردة"
    observations: "المفهوم المستهدف هو (protectiveness) بوصفه خاصيَّةً نوعيَّةً مجرَّدةً تعني النُّزوع إلى توفير الوقاية والذَّوْد عن الغير؛ وهو غير حماية (فعل/مصدر عملية) وغير وقائي (صفة). وأقرب التعبيرات العربية عنه هو (وِقَائِيَّة) بالمعنى الاسمي الصناعي المجرَّد. أما (حمائية) فقد استُعمل مصطلحاً اقتصادياً راسخاً لـ(protectionism). والمجموعة تنتمي إلى الوصف النفسي للخصائص الشخصية والنوعية، وهو حقل يُعاني فيه المعجم العربي من ثغرات في التعبير المصطلحي الدقيق."
  blind_candidates:
    - lemma: "وِقَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الصفة النسبية (وقائي) على النمط: وقى ← وقائي ← وقائية. يعبّر عن الخاصية المجردة للكون واقياً دافعاً للأذى. الاشتقاق مطَّرد في العربية المعاصرة (كالاشتراكية من اشتراكي، والديمقراطية من ديمقراطي)."
    - lemma: "حِمَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الصفة النسبية (حمائي): حمى ← حمائي ← حمائية. يعبّر عن الخاصية المجردة للكون حامياً. غير أن هذا الشكل تعرَّض لاستعمال مصطلحي مكثَّف في الحقل الاقتصادي بمعنى protectionism، مما قد يُحدث التباساً."
    - lemma: "مَنَعَة"
      generation_method: majaz
      justification: "لفظ عربي كلاسيكي أصيل يدل على العز والقوة والامتناع من الأذى. يمتلك جوهر المعنى المطلوب (الصَّون والحَوْل دون الخطر) ويمكن مد دلالته مجازاً إلى الخاصية الوقائية المجردة، مع إحياء استعماله الكلاسيكي."
    - lemma: "دَرْئِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (درأ) بمعنى درء الأذى وصرفه: درأ ← درئي ← درئية. يعبّر عن الخاصية المجردة لدرء الأذى وإبعاده. جذر عربي أصيل (درأ) يدل على الدفع والإبعاد، لكن التثبيت المعجمي لهذا الشكل يحتاج تحقق."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "حماية"
      contradicts:
        - text: "«ضريبَةٌ عُرِفَتْ في العَصْرِ الملوكِيِّ يَفْرِضُها شخْصٌ على إقليمٍ معيَّنٍ يختصُّ به لِنَفْسِهِ لَا يُشْرِكَهُ فيهِ أحَدٌ ويَجْبِيها لِنَفْسِهِ»"
          source: "المعجم الكبير"
          conflict: "حماية هنا نظامٌ إداري وعملية، لا خاصية وصفية مجردة؛ مما يؤكد أن المعنى الجوهري للكلمة فعلٌ/إجراء لا صفة"
        - text: "«في القانونِ الدَّوليِّ: قيامُ دَوْلةٍ بموجبِ معاهدَةٍ أو عَمَلٍ انْفِرادِيٍّ من جانبِها بوضْعِ دَوْلَةٍ أُخْرَى دُونَها في القُوَّةِ تحت كَنَفِها, لتَقُومَ بحمايتها من أى عُدْوانٍ خارجىٍّ قد يقعُ عليها»"
          source: "المعجم الكبير"
          conflict: "تصف الحماية فعلاً مؤسسياً (قيامُ دولة)، وهذا حدثٌ لا صفة؛ التعريف يؤكد الطابع الإجرائي لا الوصفي المجرد"
        - text: "«الحِمايَةُ: أَن يحمي ضَيْعَة فَلَا يدخلهَا عَامل، وَيُوضَع عَلَيْهَا شَيْء يُؤدى فِي السّنة إِلَى بَيت المَال»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "يُعرَّف الحماية بوصفه فعلاً (أن يحمي)، لا بوصفه خاصية أو صفة"
        - text: "«من (ح م ي) المنع والدفع ومنع الضر عن الشيء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الاشتقاق من جذر الفعل (المنع والدفع)، فحماية مصدرٌ للفعل لا اسمٌ للصفة المجردة"

    - lemma: "وقائية"
      confirm:
        - text: "«وِقَائِيَّة: من (و ق ي) نسبة إلى وِقَاء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«الْوَاوُ وَالْقَافُ وَالْيَاءُ: كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى دَفْعِ شَيْءٍ عَنْ شَيْءٍ بِغَيْرِهِ. وَوَقَيْتُهُ أَقِيهِ وَقْيًا. وَالْوِقَايَةُ: مَا يَقِي الشَّيْءَ. وَاتَّقِ اللَّهَ: تَوَقَّهُ، أَيِ اجْعَلْ بَيْنَكَ وَبَيْنَهُ كَالْوِقَايَةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (وقي) راسخٌ في دلالة الدفع والصَّون والحيلولة دون الأذى، مما يدعم وِقَائِيَّة اسماً مجرداً للخاصية الوقائية"

    - lemma: "حِمَائِيَّة"
      contradicts:
        - text: "«مذهب الحماية الاقتصادية ضد المنافسة الخارجية، نسمي المذهب حمائية من الحماء، أحد مصادر الفعل، ونسمي اجراءاته حماية»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — آرابترم"
          conflict: "حمائية مصطلحٌ اقتصادي راسخ يقابل (protectionism) لا (protectiveness)؛ اعتماده في هذا السياق يُشوِّش على المصطلح المعتمد"

    - lemma: "مَنَعَة"
      expands:
        - text: "«(المنعة) الْعِزّ وَالْقُوَّة يُقَال هُوَ فِي مَنْعَة وَيُقَال أَزَال منعته قوته الَّتِي يمْتَنع بهَا على من يُريدهُ وَلَهُم منعات معاقل ومحارز»"
          source: "المعجم الوسيط — هورماني"
          addition: "تدل المَنَعَة على العز والاقتدار والامتناع لا على خاصية الوقاية المجردة؛ المجال الدلالي مجاورٌ لا متطابق"
        - text: "«مَنْعَة: من (م ن ع) العزة والقوة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكد أن المنعة تدور في فلك العزة والقوة لا في فلك الوقاية كخاصية نوعية"
        - text: "«(الْمِيمُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ هُوَ خِلَافُ الْإِعْطَاءِ. وَمَنَعْتُهُ الشَّيْءَ مَنْعًا، وَهُوَ مَانِعٌ وَمَنَّاعٌ. وَمَكَانٌ مَنِيعٌ. وَهُوَ فِي عِزٍّ وَمَنْعَةٍ)»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (منع) يدل على الإمساك والمنع لا على الوقاية الإيجابية؛ الصِّفة مُنيع لا وقائي"

    - lemma: "دَرْئِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "حماية"
      decision: removed
      decision_reason: "حماية مصدرٌ للفعل حَمَى يدل على عملية الحماية وفعلها، وهو مفهوم مختلف تماماً عن (protectiveness) بوصفها خاصيَّةً وصفيَّةً مجرَّدة. الانتماء إلى المجموعة الترادفية الحالية (صفة جوهرية مميِّزة) يقتضي اسم صفة مجردة، لا مصدر فعل. أدلة المعاجم الأربعة تؤكد بصورة حاسمة أن حماية = act of protection لا protectiveness. لا تجوز إقامة الحدث مقام الخاصية في التصنيف المعجمي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وقائية"
      decision: confirmed
      decision_reason: "وِقَائِيَّة مصدر صناعي من الصفة النسبية (وقائي)، يُعبِّر عن الخاصية المجردة للكون واقياً دافعاً للأذى. موثَّق في موسوعة السلطان قابوس (نسبة إلى وِقَاء)، وجذره (وقي) من أعمق الجذور في دلالة الصَّون والدفع (مقاييس ابن فارس). يجتاز اختبار السكِّ: لا يمكن إبدال مكوَّناته بمرادفات وهو يُحافظ على معنى الصفة المجردة. يحتاج تصحيح التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "وِقَائِيَّة تدل على الخاصية المجردة للكون وقائياً صائناً للغير، مع تركيز على الطابع النزوعي الفطري نحو صرف الأذى ودفعه. تتميز عن حماية (المحذوفة) التي تدل على الفعل/العملية، وعن حمائية (المرشحة المرفوضة) التي اكتُسِبت دلالة الحمائية الاقتصادية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِقَائِيَّة"

    - lemma: "حِمَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: "حمائية مصطلحٌ معجمي راسخ بمعنى (protectionism) الاقتصادي في المراجع الحديثة الموثَّقة، وليس بمعنى (protectiveness) بوصفها صفة نوعية مجردة. اعتمادها في AWN4 سيُحدث التباساً مع المصطلح الاقتصادي المعتمد ويعكس ترجمة حرفية غير دقيقة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مَنَعَة"
      source: stage1
      decision: removed
      decision_reason: "مَنَعَة تدور في فلك العزة والاقتدار والامتناع من العدوان، وهي دلالة مجاورة لا مطابقة لـ(protectiveness). فضلاً عن ذلك، مَنَعَة مفردة جمعية (جمع مانع) في بعض المصادر، وهو ما يُعيق استخدامها اسماً للصفة المجردة. الإزاحة الدلالية ليست دقيقة بما يكفي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "دَرْئِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي توثيق معجمي لهذه الصيغة في قاعدة البيانات. وإن كان الاشتقاق من جذر (درأ) سليماً ومطَّرداً صرفياً، إلا أن المصطلح لم يُسَكَّ بعدُ في معجم معتمد، ولا يمكن قبوله في AWN4 دون تثبيت معجمي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


