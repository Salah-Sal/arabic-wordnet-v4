      entry_id: "{auto}"
      roots:
        - word: "انتقاء"
          root: "نقي"
          maqayis_quote: "«النُّونُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى نَظَافَةٍ وَخُلُوصٍ. مِنْهُ نَقَّيْتُ الشَّيْءَ: خَلَّصْتُهُ مِمَّا يَشُوبُهُ...»"
        - word: "طبيعي"
          root: "طبع"
          maqayis_quote: "«الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ مَثَلٌ عَلَى نِهَايَةٍ يَنْتَهِي إِلَيْهَا الشَّيْءُ...»"
    - lemma: "اِصْطِفَاءٌ طَبِيعِيٌّ"
      entry_id: "{auto}"
      roots:
        - word: "اصطفاء"
          root: "صفو"
          maqayis_quote: "«الصَّادُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خُلُوصٍ مِنْ كُلِّ شَوْبٍ...»"
        - word: "طبيعي"
          root: "طبع"
          maqayis_quote: "«الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ...»"
    - lemma: "اِنْتِخَابٌ طَبِيعِيٌّ"
      entry_id: "{auto}"
      roots:
        - word: "انتخاب"
          root: "نخب"
          maqayis_quote: "«النُّونُ وَالْخَاءُ وَالْبَاءُ كَلِمَةٌ تَدُلُّ عَلَى تَعَظُّمٍ يُقَالُ أَحَدُهُمَا عَلَى خِيَارِ شَيْءٍ...»"
        - word: "طبيعي"
          root: "طبع"
          maqayis_quote: "«الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ...»"
    - lemma: "بَقَاءُ الأَصْلَحِ"
      entry_id: "{auto}"
      roots:
        - word: "بقاء"
          root: "بقي"
          maqayis_quote: "«الْبَاءُ وَالْقَافُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الدَّوَامُ. قَالَ الْخَلِيلُ: يُقَالُ: بَقِيَ الشَّيْءُ يَبْقَى بَقَاءً، وَهُوَ ضِدُّ الْفَنَاءِ.»"
