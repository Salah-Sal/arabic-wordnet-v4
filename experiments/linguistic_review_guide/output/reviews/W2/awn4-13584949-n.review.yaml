stage1_review:
  assessment:
    concerns:
      - "اللمة (بقاء) عامة جداً ولا تدل بمفردها على المفهوم العلمي الدقيق للانتقاء الطبيعي."
      - "المفهوم يُعبَّر عنه في العربية علمياً بمركبات إضافية أو وصفية مسكوكة مثل (انتقاء طبيعي) و(اصطفاء طبيعي) و(بقاء الأصلح)."
    observations: "مفهوم التطور البيولوجي وبقاء الكائنات الأقوى يُعبر عنه في المعاجم المتخصصة بمصطلحات مركبة. مصطلح (انتقاء طبيعي) ممتاز وشائع، وكذلك (بقاء الأصلح) كمرادف لمفهوم survival of the fittest."
  blind_candidates:
    - lemma: "اِنْتِقَاءٌ طَبِيعِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يُقابل المصطلح العلمي (natural selection)، وهو الأكثر شيوعاً في كتب الأحياء."
    - lemma: "اِصْطِفَاءٌ طَبِيعِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي دقيق، إذ يدل (الاصطفاء) على اختيار الصفوة أو الأفضل، وهو ما يتناسب مع المفهوم."
    - lemma: "اِنْتِخَابٌ طَبِيعِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي شائع ومستعمل في المعاجم العلمية الحديثة للتعبير عن نفس المفهوم."
    - lemma: "بَقَاءُ الأَصْلَحِ"
      generation_method: tarkib
      justification: "تركيب إضافي يُقابل بدقة المفهوم الإنجليزي (survival of the fittest) المتفرع من الانتقاء الطبيعي."

stage2_evidence:
  per_lemma:
    - lemma: "انتقاء طبيعي"
      confirm:
        - text: "انتقاء طبيعي: natural selection"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "انْتِقاءٌ طَبيعِيّ: natural selection"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "بقاء"
      contradicts:
        - text: "البقاء: ثبات الشيء على الحالة الأولى ويضاده الفناء."
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الكلمة بمفردها تعني الاستمرار والثبات ولا تدل على آلية التطور واختيار الأصلح."
    - lemma: "اِصْطِفَاءٌ طَبِيعِيٌّ"
      confirm:
        - text: "الاصطفاء الطبيعيّ: العملية الطبيعية المُفْضِية، في رأي داروين، إلى «بقاء الأنسب أو الأصلح» وإلى انقراض الأشكال الأقلّ قوةً وتكيُّفًا (أح)."
          source: "المورد الحديث (2008)"
    - lemma: "اِنْتِخَابٌ طَبِيعِيٌّ"
      confirm:
        - text: "الانتخاب الطبيعي: بقاء وتكاثر تفاضليين للكائنات بفعل الفوارق في الخصائص التي تؤثر في قدرة الكائنات على استغلال الموارد البيئية. انتقاء طبيعي (المرادف العربي)"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (موقع ArabTerm)"
    - lemma: "بَقَاءُ الأَصْلَحِ"
      confirm:
        - text: "بقاء الأصلح: الانتخاب الطبيعي (survival of the fittest)"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"

stage3_analysis:
  per_lemma:
    - lemma: "انتقاء طبيعي"
      decision: confirmed
      decision_reason: "مصطلح علمي دقيق وموثق في المعاجم المتخصصة، يعبر بوضوح عن آلية التطور واختيار الكائنات الأنسب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْتِقَاءٌ طَبِيعِيٌّ"
    - lemma: "بقاء"
      decision: removed
      decision_reason: "كلمة (بقاء) بمفردها تعني الاستمرار في الوجود ولا تدل على عملية الانتقاء الطبيعي أو آلية التطور، فهي أعم وأشمل من المفهوم المحدد."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "اِصْطِفَاءٌ طَبِيعِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد وموثق في معاجم حديثة مثل المورد الحديث، ويمتاز بدلالة (الاصطفاء) أي اختيار الأفضل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "اِصْطِفَاءٌ طَبِيعِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "اِنْتِخَابٌ طَبِيعِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسكوك ومستعمل بكثرة في علم الأحياء والوراثة كمرادف للانتقاء الطبيعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "اِنْتِخَابٌ طَبِيعِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بَقَاءُ الأَصْلَحِ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير اصطلاحي موثق يقابل المفهوم (survival of the fittest) وهو من صميم مفهوم الانتقاء الطبيعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "بَقَاءُ الأَصْلَحِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "عملية طبيعية تؤدي إلى تطور الكائنات الحية الأكثر تكيفاً مع البيئة"
    assessment:
      decision: revise
      reason: "تطوير التعريف ليكون أكثر دقة علمية بإضافة صفتي (البقاء والتكاثر) باعتبارهما جوهر عملية الانتقاء الطبيعي."
    authored:
      - type: terminological
        text: "عملية حيوية طبيعية تضمن بقاء وتكاثر الكائنات الحية الأكثر تكيفاً مع بيئتها، مما يؤدي إلى تطور أنواعها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية حيوية طبيعية تضمن بقاء وتكاثر الكائنات الحية الأكثر تكيفاً مع بيئتها، مما يؤدي إلى تطور أنواعها."}
  examples:
    per_lemma:
      - lemma: "اِنْتِقَاءٌ طَبِيعِيٌّ"
        examples:
          - text: "تفسر نظرية الانتقاء الطبيعي كيف تتكيف الكائنات الحية مع التغيرات البيئية بمرور الزمن."
            type: usage
      - lemma: "اِصْطِفَاءٌ طَبِيعِيٌّ"
        examples:
          - text: "يُعَدُّ الاصطفاء الطبيعي الآلية الأساسية في عملية التطور البيولوجي."
            type: usage
      - lemma: "اِنْتِخَابٌ طَبِيعِيٌّ"
        examples:
          - text: "أدى الانتخاب الطبيعي إلى ظهور سلالات جديدة من الكائنات المقاومة للظروف الصعبة."
            type: usage
      - lemma: "بَقَاءُ الأَصْلَحِ"
        examples:
          - text: "يُحكم التنافس بين الأنواع في الطبيعة بمبدأ بقاء الأصلح."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تفسر نظرية الانتقاء الطبيعي كيف تتكيف الكائنات الحية مع التغيرات البيئية بمرور الزمن."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعَدُّ الاصطفاء الطبيعي الآلية الأساسية في عملية التطور البيولوجي."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أدى الانتخاب الطبيعي إلى ظهور سلالات جديدة من الكائنات المقاومة للظروف الصعبة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُحكم التنافس بين الأنواع في الطبيعة بمبدأ بقاء الأصلح."}

