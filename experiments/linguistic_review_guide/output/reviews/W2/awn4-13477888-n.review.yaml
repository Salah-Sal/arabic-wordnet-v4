# مراجعة المجموعة الترادفية: awn4-13477888-n (decay)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (اضمحلال، تضاؤل) بدون تشكيل كامل"
      - "تضاؤل دلالتها الأولى النقص في الحجم أو الكمّ، لا التحوّل إلى حالة أدنى بالمعنى الكيفي"
      - "غياب لفظ «تدهور» الشائع والمطابق للمفهوم"
    observations: "المجموعة تمثّل مفهوم العملية التدريجية نحو حالة أدنى، وهي مندرجة تحت العمليات الطبيعية. اللمّتان الموجودتان تغطيان جانبَي الذهاب والتلاشي (اضمحلال) والنقص الكمّي (تضاؤل)، لكن ينقص المصطلح الدالّ على التراجع الكيفي وهو تدهور."
  blind_candidates:
    - lemma: "تَدَهْوُر"
      generation_method: ishtiqaq
      justification: "مصدر تَدَهْوَرَ من الجذر (دهر) على وزن تَفَعْلُل، دالّ على السقوط التدريجي من حال عالية إلى أدنى. المعجم الكبير: صِحَّةُ فلانٍ ساءَت (محدثة)، الأمور تأزَّمَت."
    - lemma: "اِنْحِطَاط"
      generation_method: ishtiqaq
      justification: "مصدر انحطَّ من الجذر (حطط) على وزن اِنْفِعَال، يدلّ على الهبوط والتراجع. شائع في سياق الانحطاط الحضاري والأخلاقي."
    - lemma: "تَرَدٍّ"
      generation_method: ishtiqaq
      justification: "مصدر تردّى من الجذر (ردي) على وزن تَفَعُّل، يدلّ على السقوط والهبوط. المعجم الطبي الموحد: depravation/deterioration."
    - lemma: "اِنْحِلَال"
      generation_method: ishtiqaq
      justification: "مصدر انحلَّ من الجذر (حلل) على وزن اِنْفِعَال، يدلّ على التفكّك والذهاب. التهانوي: تفرّق اتصال يحدث الأعضاء المتشابهة."


stage2_evidence:
  per_lemma:
    - lemma: "اِضْمِحْلَال"
      confirm:
        - text: "«ضَعُفَ وانحلَّ شيئًا فشيئًا حتَّى تلاشى»"
          source: "المعجم الوسيط"
        - text: "«الشَّيْءُ: ذَهَبَ وانْحَلَّ. وقيل: ضَعُفَ وانحلَّ شيئًا فشيئًا حتَّى تلاشی»"
          source: "المعجم الكبير"
        - text: "«اضْمَحَلَّ الشيء: ذهب»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«اضْمَحَلَّ الشيءُ واضْمَحَنَّ، على البدل؛ عن يعقوب، وامْضَحَلَّ، على القلب، كُلُّ ذلك: ذَهَب»"
          source: "لسان العرب لابن منظور"
        - text: "«اضْمَحَلَّ وامْضَحَلَّ واضْمَحَنَّ: ذَهَبَ وانْحَلَّ»"
          source: "القاموس المحيط للفيروزآبادي"
      expands:
        - text: "«تناقصٌ في مطال الإشارة مع الزمن»"
          source: "معجم مصطلحات المعلوماتية"
          addition: "استعمال تقني محدد في مجال المعلوماتية"
        - text: "«الاضمحلال: (حي) انحطاط الكائنات الحيَّة، وعجزها عن أداء وظائفها، يقابله التَّطوُّر»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "معنى اصطلاحي بيولوجي يطابق مفهوم المجموعة"

    - lemma: "تَضَاؤُل"
      confirm:
        - text: "«الضَّادُ وَالْهَمْزَةُ وَاللَّامُ أُصَيْلٌ يَدُلُّ عَلَى ضَعْفٍ وَدِقَّةٍ فِي جِسْمٍ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الرجلُ ضآلة وضؤولة: صغُر جسمه ونحُف وحقُر. ويقال ضؤل رأيُه»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأولى على صغر الجسم والنحافة، والمجازية على ضعف الرأي"
        - text: "«نقص مستمر في مدى تذبذب موجات الطاقة المختلفة مثل الكهرباء والصوت»"
          source: "معجم المصطلحات الطبية"
          addition: "استعمال تقني بمعنى damping"

    - lemma: "تَدَهْوُر"
      confirm:
        - text: "«الشَّىءُ: سَقَط مِن أَعْلَى إلى أَسْفَل. صِحَّةُ فلانٍ: ساءَت. (محدثة). الأُمُورُ, أو العلاقاتُ: تَأَزَّمَت. (محدثة)»"
          source: "المعجم الكبير"
        - text: "«انخفاض تدريجي في فعالية بعض المواد بمضي الزمن كما في حالة بعض الأدوية عند تخزينها»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
        - text: "«التدهور أو الشيخوخة يشير إلى انخفاض كفاءة الخلايا الشمسية مع مرور الوقت»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«نوع معين من التحلل التدريجي الذي ينطلق ويعبر عادة مراحل متعددة»"
          source: "مسرد المناخ والبيئة"
      expands:
        - text: "«الدَّالُ وَالْهَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْغَلَبَةُ وَالْقَهْرُ. وَسُمِّيَ الدَّهْرُ دَهْرًا لِأَنَّهُ يَأْتِي عَلَى كُلِّ شَيْءٍ وَيَغْلِبُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدلّ على الغلبة والقهر، والتدهور انتقال من حال عالية إلى أدنى بفعل الزمن"

    - lemma: "اِنْحِطَاط"
      confirm:
        - text: "«ارتبط الاصطلاح بعصر الانحطاط وتقهقر القيم خلال العصر الوسيط»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      contradicts:
        - text: "«الانحطاط: هو عند أهل الهيئة مقابل الارتفاع»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المعنى الاصطلاحي عند أهل الهيئة فلكي (هبوط الكواكب)، لا عملية تدريجية عامة"

    - lemma: "تَرَدٍّ"
      confirm:
        - text: "«depravation (deterioration)»"
          source: "المعجم الطبي الموحد"
      contradicts:
        - text: "«مرحلة من العلاقة بين شخصين تتميز بضعف روابط القربى بينهما»"
          source: "مسرد الإعلام والتواصل"
          conflict: "التردّي أكثر تخصّصاً بالسياق الاجتماعي والأخلاقي، لا عملية طبيعية عامة"

    - lemma: "اِنْحِلَال"
      contradicts:
        - text: "«الانحلال: عند المنطقيين هو التحليل. وانحلال الفرد عند الأطباء تفرق اتصال يحدث الأعضاء المتشابهة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الانحلال يدلّ على التفكّك والتحلّل إلى مكوّنات، لا على التحوّل التدريجي إلى حالة أدنى"
        - text: "«سلسلة عمليات، كيميائية وحيوية، يتم من خلالها تقسيم المواد العضوية بعد موت الكائن الحي إلى جزيئات صغيرة وبسيطة»"
          source: "مسرد المناخ والبيئة"
          conflict: "الانحلال عملية تفكيكية كيميائية لا تدريجية كيفية"


stage3_analysis:
  per_lemma:
    - lemma: "اِضْمِحْلَال"
      decision: confirmed
      decision_reason: "لفظ فصيح مثبت في المعاجم الكلاسيكية والمعاصرة، دالّ على الذهاب والتلاشي التدريجي. مصدر اضمحلَّ من الجذر (ضمحل) الرباعي. شائع في الاستعمال العلمي والعام، ومعتمد في معاجم المصطلحات بمعنى decay."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على التلاشي التدريجي حتى الفناء — أي الذهاب الكلّي. يركّز على النتيجة النهائية (الزوال) لا على مجرّد الهبوط."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِضْمِحْلَال"

    - lemma: "تَضَاؤُل"
      decision: confirmed
      decision_reason: "مصدر تضاءَلَ من الجذر (ضأل) على وزن تَفَاعُل. دالّ على النقص التدريجي. مثبت في المعاجم ومعتمد في ARABTERM بمعنى decay وdamping."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد الكمّي: النقص المتدرّج في الحجم أو القوّة أو الشأن. أقرب إلى diminution منه إلى التحوّل الكيفي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَضَاؤُل"

    - lemma: "تَدَهْوُر"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر تدهورَ من الجذر (دهر) على وزن تَفَعْلُل، دالّ على السقوط من حال عالية إلى أدنى. أثبته المعجم الكبير بمعنى ساءت صحّته (محدثة) وتأزّمت الأمور. شائع جداً في الاستعمال المعاصر ومعتمد في عشرات معاجم المصطلحات بمعنى deterioration وdegradation. يملأ فجوة دلالية في المجموعة بتغطية البُعد الكيفي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على التراجع الكيفي: انتقال الشيء من حال حسنة إلى حال سيئة. يركّز على البُعد النوعي لا الكمّي ولا الزوال الكلّي."
      actions:
        - command: create_entry
          params:
            lemma: "تَدَهْوُر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اِنْحِطَاط"
      source: stage1
      decision: removed
      decision_reason: "دلالته الغالبة حضارية وأخلاقية (عصر الانحطاط، الانحطاط الأخلاقي). التهانوي خصّصه بمعنى فلكي. لا يناسب مفهوم العملية الطبيعية التدريجية العامة."

    - lemma: "تَرَدٍّ"
      source: stage1
      decision: removed
      decision_reason: "دلالته الأولى السقوط من عَلٍ (المعجم الوسيط). استعماله المعاصر مرتبط بالتدنّي الأخلاقي أو الاجتماعي. لا يتسق مع مفهوم العملية الطبيعية العامة."

    - lemma: "اِنْحِلَال"
      source: stage1
      decision: removed
      decision_reason: "دلالته التفكّك والتحلّل إلى مكوّنات (dissolution/decomposition)، لا التحوّل التدريجي إلى حالة أدنى. مفهوم مختلف يناسب synset آخر."


