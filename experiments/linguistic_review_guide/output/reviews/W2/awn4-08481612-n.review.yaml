stage1_review:
  assessment:
    concerns:
      - "كلمة «حركة» تدل في الأصل على الانتقال المادي والفيزيائي، وتحتاج إلى سياق لتدل على التنظيم الاجتماعي، غير أنها شائعة الاستخدام في هذا المجال."
      - "كلمة «جبهة» تميل أكثر إلى الدلالة على التكتلات ذات الطابع السياسي أو العسكري أو التحالفات لمواجهة خصم."
      - "التعريف الحالي يبدو مترجماً حرفياً نوعاً ما في قوله «يحاولون معاً» كترجمة لـ «try together»."
    observations: "تتعدد المترادفات في العربية للتعبير عن هذا المفهوم بحسب طبيعة التنظيم ودرجة تماسكه؛ فالحركة تدل على الدينامية والسعي للتغيير، والجبهة تدل على التكتل والتحالف، بينما يدل التيار على الاتجاه الفكري أو الشعبي الواسع."
  blind_candidates:
    - lemma: "تَيَّار"
      generation_method: majaz
      justification: "استعارة من تيار الماء للتدلال على الاتجاه الجماهيري أو الفكري الجارف الذي يسير فيه مجموعة من الناس."
    - lemma: "حَرَاك"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (حرك) ويدل على حالة النشاط والفعل الاجتماعي أو السياسي المستمر."
    - lemma: "تَكَتُّل"
      generation_method: ishtiqaq
      justification: "من الكتلة، ويدل على تجمع وتضام أفراد أو جماعات لتحقيق هدف مشترك."
    - lemma: "حِزْب"
      generation_method: majaz
      justification: "يطلق على الجماعة التي تتفق في الرؤى والأهداف، وإن كان يميل اليوم للتنظيم السياسي البحت."

stage2_evidence:
  per_lemma:
    - lemma: "جبهة"
      confirm:
        - text: "«الجماعة المُؤَلَّفة لجلب خير أو دفع شرٍّ عن قومهم»"
          source: "المعجم الوسيط"
        - text: "«جَبْهَة التَّحرُّر الوطنى الجزائرية : الهيئة الوطنية الجزائرية التى قادت الثورة المسلّحة ضدّ الحكم الفرنسى»"
          source: "المعجم الكبير"
    - lemma: "حركة"
      confirm:
        - text: "«وتطْلَقُ الكلمة مَجازا على حَرَكاتِ النَّفْسِ والذَّهْنِ والحركاتِ الاجتماعية»"
          source: "المعجم الكبير"
    - lemma: "حركة اجتماعية"
      confirm:
        - text: "«وتطْلَقُ الكلمة مَجازا على حَرَكاتِ النَّفْسِ والذَّهْنِ والحركاتِ الاجتماعية»"
          source: "المعجم الكبير (ضمن مادة حركة)"
    - lemma: "تيار"
      expands:
        - text: "«حركة سطحية فى ماء المحيط... وتطلق مجازا للاتجاه» (مستنتج من الاستعمال المعاصر وشرح الكبير للموج والتيار)"
          source: "المعجم الوسيط"
    - lemma: "حراك"
      expands:
        - text: "«حركة انبعاث ونهضة»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا"

stage3_analysis:
  per_lemma:
    - lemma: "جَبْهَة"
      decision: confirmed
      decision_reason: "مصطلح أصيل ومستعمل بكثرة للدلالة على التحالفات والتنظيمات التي تجمع أفراداً لتحقيق أهداف مشتركة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَبْهَة"
    - lemma: "حَرَكَة"
      decision: confirmed
      decision_reason: "أحد أشهر المصطلحات المستخدمة للدلالة على التجمعات الاجتماعية أو السياسية ذات الأهداف التغييرية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَرَكَة"
    - lemma: "حَرَكَة اِجْتِمَاعِيَّة"
      decision: confirmed
      decision_reason: "تعبير مركب دقيق يقابل المصطلح الإنجليزي ويحدد المجال الذي تنشط فيه هذه الحركة بوضوح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَرَكَة اِجْتِمَاعِيَّة"
    - lemma: "تَيَّار"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح شائع للدلالة على المجموعات التي يحركها توجه فكري أو أيديولوجي مشترك، ويشمل الحركات بمفهومها العريض."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَيَّار"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "حَرَاك"
      source: stage1
      decision: removed
      decision_reason: "يشير إلى حالة النشاط والتغير نفسها أكثر من إشارته إلى «المنظمة» أو «الجماعة» من الناس."
    - lemma: "تَكَتُّل"
      source: stage1
      decision: removed
      decision_reason: "مفهوم عام قد يشير لتجمع اقتصادي أو سياسي مؤقت، وليس بالضرورة حركة اجتماعية ذات أيديولوجية."
    - lemma: "حِزْب"
      source: stage1
      decision: removed
      decision_reason: "يرتبط غالباً بالتنظيمات السياسية البحتة التي تسعى للسلطة، وهو أضيق دلالة من الحركة الاجتماعية."

stage4_content:
  definition:
    current: "مجموعة من الناس لديهم أيديولوجية مشتركة يحاولون معاً تحقيق أهداف عامة معينة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على ركاكة وعبارات تبدو مترجمة حرفياً مثل «يحاولون معاً»، وتفتقر لأسلوب التعريف المعجمي الرصين."
    authored:
      - type: terminological
        text: "جماعة من الناس يجمعهم فكر أو مبدأ مشترك، ويسعون متضامنين لتحقيق أهداف عامة محدّدة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "جماعة من الناس يجمعهم فكر أو مبدأ مشترك، ويسعون متضامنين لتحقيق أهداف عامة محدّدة."

  examples:
    per_lemma:
      - lemma: "جَبْهَة"
        examples:
          - text: "انضوى العديد من المثقفين والنقابيين تحت لواء الجبهة الوطنية."
            type: usage
      - lemma: "حَرَكَة"
        examples:
          - text: "أسهمت الحركة في نشر الوعي البيئي بين الشباب."
            type: usage
      - lemma: "حَرَكَة اِجْتِمَاعِيَّة"
        examples:
          - text: "تُعد المطالبة بالحقوق المدنية من أبرز الحركات الاجتماعية في التاريخ الحديث."
            type: usage
      - lemma: "تَيَّار"
        examples:
          - text: "برز تيار إصلاحي جديد يطالب بتحديث التعليم."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "انضوى العديد من المثقفين والنقابيين تحت لواء الجبهة الوطنية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أسهمت الحركة في نشر الوعي البيئي بين الشباب."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعد المطالبة بالحقوق المدنية من أبرز الحركات الاجتماعية في التاريخ الحديث."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "برز تيار إصلاحي جديد يطالب بتحديث التعليم."

