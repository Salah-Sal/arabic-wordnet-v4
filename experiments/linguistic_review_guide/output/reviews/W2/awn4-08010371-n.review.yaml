          root: "جمع"
          maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ»"
        - word: "حيوانية"
          root: "حيي"
          maqayis_quote: "«الْحَاءُ وَالْيَاءُ وَالْوَاوُ أَصْلٌ وَاحِدٌ، وَهُوَ خِلَافُ الْمَوْتِ»"
    - lemma: "أُمَّةٌ"
      entry_id: "{auto}"
      root: "أمم"
      maqayis_quote: "«الْهَمْزَةُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ تَقَدُّمُ الشَّيْءِ، وَهُوَ الْأَصْلُ الْمَرْجُوعُ إِلَيْهِ»"
    - lemma: "تَجَمُّعٌ حَيَوَانِيٌّ"
