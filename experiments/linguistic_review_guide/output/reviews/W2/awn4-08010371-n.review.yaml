# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «جَمَاعَةٌ مِنَ الحَيَوَانَاتِ» عبارة وصفية فضفاضة وليست مصطلحاً معجمياً مكثفاً."
      - "اللمّة «مجموعة حيوانية» تفتقر إلى التشكيل الكامل."
      - "تكرار كلمة «مجموعة» و«حيوانات» من التعريف في اللمّات (دوران دلالي)."
    observations: "المفهوم عام جداً (animal group) ويمثل جنساً للأصناف الفرعية مثل القطيع والسرب. يتطلب البحث عن مصطلحات تجمع بين الدقة العلمية والجذور التراثية التي وصفت تجمعات الحيوان."
  blind_candidates:
    - lemma: "قَطِيعٌ"
      generation_method: majaz
      justification: "لفظ تراثي يطلق على جماعة الحيوانات (خاصة الثدييات والماشية)، ويمكن استخدامه دلالياً للمجموعات الأكبر."
    - lemma: "سِرْبٌ"
      generation_method: majaz
      justification: "لفظ يطلق على جماعة الطير أو الوحش، وهو مصطلح معجمي صلب."
    - lemma: "أُمَّةٌ"
      generation_method: majaz
      justification: "لفظ قرآني صريح في وصف جماعات الحيوان وأصنافها {إِلَّآ أُمَمٌ أَمْثَالُكُم}."
    - lemma: "تَجَمُّعٌ حَيَوَانِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي حديث يعبر عن المفهوم البيولوجي العام (Animal gathering/assembly)."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "أُمَّةٌ"
      confirm:
        - text: "«الأمة: كل جماعة يجمعها أمر... وقوله تعالى {إِلَّا أُمَمٌ أَمْثَالُكُم} أي كل نوع منها على طريقة مسخرة بالطبع...»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الأُمَّةُ: الجِنسُ من كُلِّ حَىٍّ»"
          source: "المعجم الكبير"
    - lemma: "سِرْبٌ"
      confirm:
        - text: "«السِّرْبُ: القَطِيعُ من الظِّبَاءِ وَالشَّاءِ... والطَّيْرِ»"
          source: "مقاييس اللغة"
        - text: "«السِّرْبُ: الجماعةُ منَ الظِّباءِ والقَطا والخَيْلِ والوَحْشِ»"
          source: "الصحاح للجوهري"
    - lemma: "قَطِيعٌ"
      confirm:
        - text: "«قَطِيع: طائفة من الغنم والنعم»"
          source: "كتاب العين"
        - text: "«قطيع: flock; livestock»"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
    - lemma: "مَجْمُوعَةٌ حَيَوَانِيَّةٌ"
      confirm:
        - text: "«فُونة: مجموعة حيوانية تعيش في زمان ومكان ما»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
        - text: "«تطور مجموعة حيوانية في اتجاهات متباينة...»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
    - lemma: "جَمَاعَةٌ حَيَوَانِيَّةٌ"
      confirm:
        - text: "«عائلة حيوانية: جماعة الحيوانات في قطر أو كورة...»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
    - lemma: "فُونَة"
      confirm:
        - text: "«فونة: مجموعة حيوانية تعيش في زمان ومكان ما»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
      expands:
        - text: "«وحيش: مجموعة الكائنات الحية الحيوانية التي تعيش في موضع ما.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مجموعة حيوانية"
      decision: confirmed
      decision_reason: "مصطلح تقني مستقر في المعاجم الحديثة والموحدة لوصف تجمعات الحيوان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوعَةٌ حَيَوَانِيَّةٌ"
    - lemma: "جماعة من الحيوانات"
      decision: removed
      decision_reason: "عبارة وصفية طويلة، يفضل استبدالها بمركبات أكثر كثافة أو ألفاظ مفردة."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "جَمَاعَةٌ حَيَوَانِيَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب وصفي بديل وأكثر دقة من العبارة المجرورة، وله شواهد في التعريفات التقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "جَمَاعَةٌ حَيَوَانِيَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "أُمَّةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ أصيل وقرآني يعبر عن الجنس والجماعة من الحيوانات، وهو أدق لفظ مفرد للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أُمَّةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَجَمُّعٌ حَيَوَانِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح حديث يصف التجمعات المؤقتة أو الدائمة للحيوانات في سياق السلوك والبيئة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "تَجَمُّعٌ حَيَوَانِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "مجموعة من الحيوانات"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويفتقر للبعد الاصطلاحي."
    authored:
      - type: terminological
        text: "أيُّ كُتْلَةٍ أَوْ جَمَاعَةٍ مِنَ الأَحْيَاءِ تَنْتَمِي إِلَى عَالَمِ الحَيَوَانِ، تَجْمَعُهَا رَوَابِطُ بِيُولُوجِيَّةٌ، أَوْ جُغْرَافِيَّةٌ، أَوْ سُلُوكِيَّةٌ مُشْتَرَكَةٌ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "أَيُّ كُتْلَةٍ أَوْ جَمَاعَةٍ مِنَ الأَحْيَاءِ تَنْتَمِي إِلَى عَالَمِ الحَيَوَانِ، تَجْمَعُهَا رَوَابِطُ بِيُولُوجِيَّةٌ، أَوْ جُغْرَافِيَّةٌ، أَوْ سُلُوكِيَّةٌ مُشْتَرَكَةٌ."}

  examples:
    per_lemma:
      - lemma: "أُمَّةٌ"
        examples:
          - text: "«وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ وَلَا طَائِرٍ يَطِيرُ بِجَنَاحَيْهِ إِلَّا أُمَمٌ أَمْثَالُكُمْ»"
            type: quran
            source: "القرآن الكريم، سورة الأنعام، الآية ٣٨"
      - lemma: "مَجْمُوعَةٌ حَيَوَانِيَّةٌ"
        examples:
          - text: "تَمَيَّزَتِ المَجْمُوعَةُ الحَيَوَانِيَّةُ فِي القُطْبِ الجَنُوبِيِّ بِتَكَيُّفِهَا الشَّدِيدِ مَعَ البَرْدِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "«وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ وَلَا طَائِرٍ يَطِيرُ بِجَنَاحَيْهِ إِلَّا أُمَمٌ أَمْثَالُكُمْ»"}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تَمَيَّزَتِ المَجْمُوعَةُ الحَيَوَانِيَّةُ فِي القُطْبِ الجَنُوبِيِّ بِتَكَيُّفِهَا الشَّدِيدِ مَعَ البَرْدِ."}

# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    - lemma: "مَجْمُوعَةٌ حَيَوَانِيَّةٌ"
      entry_id: "{auto}"
      roots:
