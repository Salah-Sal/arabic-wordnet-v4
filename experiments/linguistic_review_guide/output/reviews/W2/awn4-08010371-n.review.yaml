        - word: "حيواني"
          root: "حيي"
          maqayis_quote: "«الْحَاءُ وَالْيَاءُ وَالْوَاوُ أَصْلٌ وَاحِدٌ، وَهُوَ خِلَافُ الْمَوْتِ»"

  per_sense:
