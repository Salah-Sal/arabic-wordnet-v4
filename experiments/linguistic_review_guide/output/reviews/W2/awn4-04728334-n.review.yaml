# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04728334-n  |  ILI: i61858  |  POS: n
# unsuitability / unsuitableness / ineptness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عدم ملاءمة / عدم مناسبة) كلتاهما تركيبٌ إضافي من عدم + مصدر، ولا توجد لمّة مفردة واحدة تُعبِّر عن المفهوم"
      - "التشكيل منقوص: عدم في الإضافة تأخذ الضمة (عَدَمُ) لكنها مكتوبة بفتحة في المجموعة"
      - "التداخل الدلالي بين اللمّتين واضح — الفرق الدلالي بين ملاءمة ومناسبة ضئيل في الاستعمال المعاصر وقد يُوهم الترادف المطلق"
      - "غياب لمّة مفردة يُمثِّل ثغرةً معجمية (lexical gap)؛ العربية لم تسكّ مصطلحاً أحادياً شائعاً لهذا المفهوم"
      - "التعريف الحالي 'خصائص خاطئة' يوظِّف لفظ خاطئة بمعنى غير ملائمة وهو توظيف قاصر — 'خاطئ' في العربية يدل على الغلط لا على عدم الملاءمة"
    observations: >
      المجموعة تعبِّر عن مفهوم مجرد هو «انتفاء الملاءمة بين خصائص الشيء والغرض المنوط به».
      اللمّتان الموجودتان نمطٌ تركيبي إضافي مشروع في العربية (عدم + مصدر) ومستعملٌ في المعاجم الحديثة،
      لكنهما ليستا مصطلحَيْن مسكوكَيْن بالمعنى الاصطلاحي الضيِّق — بل تعبيران وصفيان منتِجان.
      وُجِد في المورد الحديث (2008) استعمال «لاملاءمة؛ عدم مناسبة» كترجمتَيْن مترادفتَيْن لـimpropriety،
      مما يدل على توطُّن هذين التركيبَيْن في المعجمية العربية الحديثة.
      اللمّتان المجموعة تحت نفس المجموعة لهما فارقٌ دقيق: ملاءمة تُركِّز على التلاؤم الطبيعي/التقني،
      ومناسبة تُركِّز على التوافق السياقي/الاجتماعي.

  blind_candidates:
    - lemma: "نُبُوٌّ"
      generation_method: majaz
      justification: >
        من الفعل «نبا عن»: تجافى عنه ولم يُوافقه. قال ابن فارس إن نَبَوَ يدل على «ارتفاع في الشيء
        عن غيره أو تنحٍّ عنه»، ونبا السيفُ عن الضريبة: تجافى ولم يمضِ فيها، ونبا به منزله: لم يوافقه.
        هذا إحياءٌ لمجاز قديم يصف حال الشيء الذي لا يُلائم غرضه. على وزن فُعُول (مصدر).
    - lemma: "قُصُور"
      generation_method: ishtiqaq
      justification: >
        من جذر ق-ص-ر على وزن فُعُول (مصدر العجز والتقصير). قصرَ عن الشيء قصوراً: عجز عن بلوغ
        مداه. يُمكن استعماله للشيء الذي يقصر عن الوفاء بمتطلبات الغرض المطلوب — وهو قريب من
        مفهوم «خصائص لا تُؤدِّي الغرض».
    - lemma: "عَدَمُ اللِّيَاقَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «عدم + اللياقة». جذر ل-ي-ق: «لا يليق به كذا، كأنه لا يصلح له» (مقاييس اللغة).
        اللياقة في أصلها اللغوي تعني الصلاحية والملاءمة للشيء، فعدم اللياقة = عدم الصلاحية للغرض.
        مستعمل في العربية الحديثة كتعبير اصطلاحي ثابت.
    - lemma: "تَنَافُر"
      generation_method: ishtiqaq
      justification: >
        من جذر ن-ف-ر على وزن تَفَاعُل (التشارك والتبادل). يدل على عدم التوافق والتجاذب السلبي
        بين الشيء وما يُراد منه. أصله في اللغة «تجافٍ وتباعد» (مقاييس). يُمكن توسيعه مجازاً
        ليدل على التنافر بين خصائص الشيء ومتطلبات الغرض.


stage2_evidence:
  per_lemma:

    - lemma: "عَدَم مُلَاءَمَة"
      confirm:
        - text: >
            «(2) لاملاءمة؛ عدم مناسبة» [ترجمة عربية لـ impropriety]
          source: "المورد الحديث (2008)"
        - text: >
            «غَيرُ مُلاَئِم» [ترجمة لـ improper / inappropriate / inapt / inadequate]
          source: "المعجم الطبي الموحد (2009)"
        - text: >
            «(لَأَمَ) اللَّامُ وَالْأَلِفُ وَالْمِيمُ أَصْلَانِ: أَحَدُهُمَا الِاتِّفَاقُ وَالِاجْتِمَاعُ...
            وَإِذَا اتَّفَقَ الشَّيْئَانِ فَقَدِ الْتَأَمَا. وَسُمِّيَتْ لَأْمَةً لِالْتِئَامِهَا.»
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «وَفَقَ: كَلِمَةٌ تَدُلُّ عَلَى مُلَاءَمَةِ الشَّيْئَيْنِ. مِنْهُ الْوَفْقُ: الْمُوَافَقَةُ.
            وَاتَّفَقَ الشَّيْئَانِ: تَقَارَبَا وَتَلَاءَمَا.»
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: >
            «مُعَاكِس، غير ملائم» [ترجمة لـ adverse في سياق الطب البيطري]
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          addition: "يُظهر أن 'غير ملائم' يُستعمل في السياقات التقنية المتخصصة جنباً إلى جنب مع 'معاكس'"
        - text: >
            «(1) غير ملائم أو وافٍ بالمرام (2) ضيِّق؛ غير مريح» [ترجمة لـ incommodious]
          source: "المورد الحديث (2008)"
          addition: "يُبيِّن أن دلالة عدم الملاءمة موسَّعة لتشمل عدم الوفاء بالمرام أي بالغرض المطلوب"

    - lemma: "عَدَم مُنَاسَبَة"
      confirm:
        - text: >
            «(2) لاملاءمة؛ عدم مناسبة» [ترجمة عربية لـ impropriety]
          source: "المورد الحديث (2008)"
        - text: >
            «(1) غير مناسب أو موفَّق؛ في غير محلّه (2) فيه علة أو نقص» [ترجمة لـ infelicitous]
          source: "المورد الحديث (2008)"
        - text: >
            «(1) اللامناسبيّة: كون الشيء غير مناسب أو غير موفق (2) ملاحظة غير موفقة؛ شيء غير مناسب»
            [ترجمة لـ infelicity]
          source: "المورد الحديث (2008)"
        - text: >
            «نَسَبَ: النُّونُ وَالسِّينُ وَالْبَاءُ كَلِمَةٌ وَاحِدَةٌ قِيَاسُهَا اتِّصَالُ شَيْءٍ بِشَيْءٍ.
            مِنْهُ النَّسَبُ، سُمِّيَ لِاتِّصَالِهِ وَلِلِاتِّصَالِ بِهِ.»
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: >
            «(1) متنافر؛ متضارب (2) متعارض مع (3) متناقض مع نفسه (4) غير مناسب أو لائق»
            [ترجمة لـ incongruous]
          source: "المورد الحديث (2008)"
          addition: "تُبيِّن أن عدم المناسبة قد يرتبط بالتضارب والتعارض — أوسع من مجرد عدم صلاحية الخصائص"

    - lemma: "نُبُوٌّ"
      confirm:
        - text: >
            «نَبَوَ: النُّونُ وَالْبَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ
            فِي الشَّيْءِ عَنْ غَيْرِهِ أَوْ تَنَحٍّ عَنْهُ. وَنَبَا السَّيْفُ عَنِ الضَّرِيبَةِ: تَجَافَى
            وَلَمْ يَمْضِ فِيهَا. وَنَبَا بِهِ مَنْزِلُهُ: لَمْ يُوَافِقْهُ، وَكَذَا فِرَاشُهُ.»
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: >
            «النَّبَأُ، مُحَرَّكَةً: الخَبَرُ. وَنَبَأَ، كمنع، نَبْئاً وَنُبُوءاً: ارْتَفَعَ.
            ومنه النَّبِيءُ: المُخْبِرُ عن الله تعالى... وَالنَّبِيءُ: الطريقُ الواضِحُ»
          source: "القاموس المحيط للفيروزآبادي"
          conflict: >
            «نبو» كمصطلح مستقل سيُلتبَس بنبوءة/نبوة/نبأ. الجذر ن-ب-و/أ شديد الاشتراك اللفظي،
            ولا يُفيد بمفرده دلالةَ المجموعة دون قرينة لفظية.

    - lemma: "قُصُور"
      confirm:
        - text: >
            «قَصَرَ: الْقَافُ وَالصَّادُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى
            أَلَّا يَبْلُغَ الشَّيْءُ مَدَاهُ وَنِهَايَتَهُ... وَقَصَرْتُ عَنْهُ قُصُورًا: عَجَزْتُ.»
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «القُصور: العجزُ.»
          source: "التعريفات الفقهية للبركتي"
      contradicts:
        - text: >
            «القُصورُ: الخُلوُّ عن المعانِي الباعثة على تحرِّي الخَيَرات والفضائل وعدم التمكن
            من أسبابها.»
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: >
            قصور يعني العجز عن بلوغ الغاية وليس امتلاك خصائص خاطئة — الفرق جوهري: المجموعة تصف
            حال الشيء الذي لا تتوافق خصائصه مع الغرض، لا الشيء الذي يعجز عن أداء مهمة لقصوره.

    - lemma: "عَدَمُ اللِّيَاقَة"
      confirm:
        - text: >
            «لَيَقَ: اللَّامُ وَالْيَاءُ وَالْقَافُ كَلِمَتَانِ: ...وَالْأُخْرَى قَوْلُهُمْ: لَا يَلِيقُ
            بِهِ كَذَا، كَأَنَّهُ لَا يَصْلُحُ لَهُ، وَلَا يُلْصِقُ بِهِ.»
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «(3) قلّة احتشام أو لياقة» [ضمن ترجمة impropriety]
          source: "المورد الحديث (2008)"
      contradicts:
        - text: >
            «(اللياقة) سلوكُ الإنسانِ في حياته مع غيره سلوكاً متَّسِماً بالأدب»
          source: "المعجم الوسيط"
          conflict: >
            اللياقة في المعجم الوسيط (المرجع الأساسي لمعيار الفصحى) ضيَّق دلالتها على السلوك
            الاجتماعي المؤدَّب، فـ«عدم اللياقة» أصبح يُحمَل على الخروج عن آداب السلوك لا على
            انعدام الملاءمة لغرض تقني. تباعدت الدلالة عن المجموعة الترادفية.

    - lemma: "تَنَافُر"
      contradicts:
        - text: >
            «التنافر: في اللغة أصله التحاكم في الحسب ثم كثر حتى استُعمل في كل تحاكم. وعند أهل
            المعاني، وصف في الكلمة يوجب ثقلها على اللسان وعسر النطق بها.»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            تنافر مصطلح تقني راسخ في علم البلاغة والبديع يدل على الثقل الصوتي في الكلام.
            استعماله بمعنى عدم الملاءمة المفهومية سيوقع في اشتراك لفظي مع هذا الاصطلاح المستقر.
        - text: >
            «التنافر: إيراد الكلام على وجه لا يسهل على اللسان، إما لبعد شديد بين المخرجين أو
            لقرب بليغ بينهما.»
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: >
            جميع المصادر المعجمية المستعلَمة تُثبِّت تنافر في دلالة الثقل الصوتي البلاغي. لا شاهد
            على استعماله بمعنى انعدام الملاءمة للغرض.


stage3_analysis:
  per_lemma:

    - lemma: "عَدَم مُلَاءَمَة"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي «عدم ملاءمة» موثَّق في المعاجم الحديثة (المورد الحديث 2008، المعجم الطبي
        الموحد 2009) كمقابل عربي لـ improper/inappropriate/unsuitable. الجذر ل-أ-م في مقاييس ابن
        فارس يُؤسِّس لمعنى الاتفاق والتلاؤم، فـ«عدم الملاءمة» ضده الطبيعي. يُعبِّر بدقة عن
        المفهوم في السياقات التقنية والعلمية. يحتاج تصحيح التشكيل: إضافة الضمة على عدم (عَدَمُ).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على انعدام التلاؤم والانسجام الذاتي بين طبيعة الشيء والغرض المطلوب منه —
        متجذِّر في معنى الاتفاق والانصهار (لأم = التأم = اتفق واجتمع). أنسب للسياقات التقنية
        (ملاءمة المادة، ملاءمة الأداة) حيث يُقاس الانسجام الموضوعي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ مُلَاءَمَةٍ"

    - lemma: "عَدَم مُنَاسَبَة"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي «عدم مناسبة» موثَّق في المورد الحديث (2008) كمقابل لـ impropriety/
        infelicity/incongruous. الجذر ن-س-ب يدل على اتصال الشيء بالشيء وانتمائه إليه،
        فـ«عدم المناسبة» = انعدام هذا الاتصال والتوافق. يُعبِّر عن المفهوم في السياقات
        الاجتماعية والسياقية. يحتاج تصحيح تشكيل: إضافة الضمة على عدم (عَدَمُ).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على انعدام التوافق السياقي والنسبة بين الشيء وظرفه أو موضعه — متجذِّر في معنى
        الاتصال والانتماء (نسب = انتسب واتصل). أنسب للسياقات الاجتماعية والسلوكية والأدبية
        (مناسبة الوقت، مناسبة الشخص للمنصب).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ مُنَاسَبَةٍ"

    - lemma: "نُبُوٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن جذر ن-ب-و يحمل دلالة التجافي وعدم الموافقة (نبا به منزله: لم يوافقه)، فإن
        «نبوٌّ» كمصطلح مفرد مستقل لا يُفيد هذا المعنى دون قرينة. الجذر ن-ب-أ/و شديد الاشتراك
        اللفظي (نبأ، نبوة، نبوء) مما يُوقع في لبس. كما أن «نبو» لم يُثبَّت معجمياً كوحدة
        مسكوكة بهذا المعنى — الأدلة الموجودة فعلية (نبا السيف عن الضريبة) لا اسمية.
        اختبار الاستبدال يفشل: النبو ليس تعبيراً اصطلاحياً ثابتاً في هذا المجال.
      evidence_assessment:
        case: mixed

    - lemma: "قُصُور"
      source: stage1
      decision: removed
      decision_reason: >
        قصور يعني العجز عن بلوغ الغاية والتقصير في الأداء، وهو مفهوم مختلف عن امتلاك خصائص
        خاطئة لغرض معين. المجموعة تصف الشيء الذي تتنافى خصائصه مع متطلبات الغرض (خصائص
        خاطئة)، أما القصور فيصف الشيء الذي يعجز عن الأداء الكامل مع احتمال امتلاكه خصائص
        صحيحة ناقصة. فارق دلالي جوهري. كذلك القصور استُعمل في المعجم الموحد للنقل بمعنى
        «inertia» (quصور المادة) مما يزيد الاشتراك اللفظي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "عَدَمُ اللِّيَاقَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الجذر ل-ي-ق في مقاييس اللغة يحمل معنى الصلاحية والملاءمة (لا يليق به: لا يصلح
        له)، فإن «اللياقة» في المعجم الوسيط الحديث — المرجع المعياري — ضيَّقت دلالتها على
        «سلوك الإنسان في حياته مع غيره سلوكاً متسماً بالأدب»، وعلى اللياقة البدنية. وبذلك
        «عدم اللياقة» في الاستعمال المعاصر يُحمَل أولاً على انعدام الأدب الاجتماعي لا على
        عدم الملاءمة لغرض تقني أو وظيفي. الانزياح الدلالي يُبعِده عن مفهوم المجموعة.
      evidence_assessment:
        case: mixed

    - lemma: "تَنَافُر"
      source: stage1
      decision: removed
      decision_reason: >
        المصادر المعجمية المتعددة (المناوي، السيوطي، التهانوي، الأحمدنكري) تُجمع على أن
        التنافر مصطلح بلاغي راسخ يدل على ثقل الكلمة أو الكلام على اللسان. استعماله بمعنى
        عدم الملاءمة المفهومية سيوقع في اشتراك لفظي حاد مع مصطلح بلاغي مستقر منذ القرن
        العاشر الميلادي. لا شاهد معجمي على استعماله بالمعنى المطلوب.
      evidence_assessment:
        case: contradicts_only


