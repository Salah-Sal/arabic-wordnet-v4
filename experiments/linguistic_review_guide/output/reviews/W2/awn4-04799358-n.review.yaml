# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "لمّة «إِرْضَاء» مصدر للفعل الرباعي أَرْضَى (وزن إفعال) يدل على عملية الإرضاء لا على الصفة أو الخاصية المجردة؛ وهذا ينافر الهايبرنيم «جَوْدَة / نَوْعِيَّة» الذي يستلزم اسمًا دالًّا على صفة لا على حدث."
      - "لمّة «كِفَايَة» أدق ملاءمةً للمعنى، لكنها تنزع نحو الكفاية الكميّة (meeting a threshold) أكثر منها نحو الجودة الإرضائية، وقد وثّقتها المعاجم التقنية في الغالب ضمن حقل adequacy/sufficiency."
      - "التعريف العربي الحالي «صفة إعطاء الرضا الكافي لتلبية طلب أو حاجة» ترجمة حرفية مباشرة لا تتناسب مع أسلوب المعجم الوسيط في الصياغة المصطلحية."
    observations: >
      المجموعة ترادفية تُعبِّر عن المفهوم الإنجليزي satisfactoriness = الصفة المجردة الدالة على كون
      الشيء مُرضيًا ووافيًا بالمتطلبات. يتبع هذا المفهوم في WordNet الأمريكي نوعَ الجودة (quality).
      اللمّتان الموجودتان تُغطيان جانبَيْن مختلفَيْن من المعنى: «إرضاء» للجانب الوجداني، و«كفاية» للجانب
      الكمي/الوظيفي. لم يُعثر في قاعدة البيانات على مصطلح عربي مسكوك مباشر لـ satisfactoriness كمفهوم
      فلسفي مجرد، مما يجعل الحقل دلاليًّا يميل إلى lexical_gap بين المفردتين الحاليتين.

  blind_candidates:
    - lemma: "الاسْتِيفَاء"
      generation_method: ishtiqaq
      justification: >
        من الجذر (وفى)، وزن استفعال، يدل على بلوغ حد الوفاء الكامل بالمتطلبات والحاجات تمامًا؛
        مناسب دلاليًّا لأن المفهوم يتضمن الوفاء بما يُطلب.
    - lemma: "المَقْبولِيَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (قبل)، على وزن المصدر الصناعي (مَفْعولِيَّة)، تدل على صفة كون الشيء مقبولًا وكافيًا
        ووافيًا بالمتطلبات؛ قريبة من نطاق satisfactoriness بوصفها خاصية تجريدية.
    - lemma: "الوَفَاء"
      generation_method: ishtiqaq
      justification: >
        من الجذر (وفى)، المصدر الأصيل، يدل على الوفاء بالالتزامات والحاجات؛ فيه معنى الاكتمال
        والإتيان بما يُطلب ما يجعله قريبًا من مفهوم تلبية المتطلبات.
    - lemma: "الاكْتِفَاء"
      generation_method: ishtiqaq
      justification: >
        من الجذر (كفى)، وزن افتعال، يدل على بلوغ حد الكفاية في إشباع الطلب والحاجة؛
        يُعبِّر عن الجانب الكمي من satisfactoriness.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "إِرْضَاء"
      expands:
        - text: "«الرَّاءُ وَالضَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ السُّخْطِ. تَقُولُ رَضِيَ يَرْضَى رِضًى. وَهُوَ رَاضٍ، وَمَفْعُولُهُ مَرْضِيٌّ عَنْهُ. وَيُقَالُ إِنَّ أَصْلَهُ الْوَاوُ; لِأَنَّهُ يُقَالُ مِنْهُ رِضْوَانٌ. قَالَ أَبُو عُبَيْدٍ: رَاضَانِي فُلَانٌ فَرَضَوْتُهُ»"
          source: "مقاييس اللغة لابن فارس (entry 986561)"
          addition: >
            الجذر رضو/رضي يدل على ضد السخط، ومن هذا الجذر يُشتق إرضاء (الإفعال) بمعنى
            إحداث الرضا وجعل الغير راضيًا. الدليل يؤكد الأصل الدلالي للجذر دون ذكر صريح
            لـ «إرضاء» كمصدر مجرد للصفة.
        - text: "«ضِدُّ السَّخَطِ»"
          source: "المعجم الكبير (entry 94103)"
          addition: "يُثبت أن الرضا هو الأصل المعنوي لهذا الاشتقاق: ضد الغضب والسخط."
        - text: "«(فى عِلْم النَّفْس): حالَةٌ نَفْسِيَّةٌ مِنَ الرَّاحَةِ والطُّمَأْنينَةِ»"
          source: "المعجم الكبير (entry 94104)"
          addition: >
            يوسّع المعنى ليشمل الحالة النفسية من الراحة والاطمئنان، مما يدعم استخدام
            «إرضاء» في سياق الجودة الوجدانية.

    - lemma: "كِفَايَة"
      confirm:
        - text: "«الْكَافُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الْحَسْبِ الَّذِي لَا مُسْتَزَادَ فِيهِ. يُقَالُ: كَفَاكَ الشَّيْءُ يَكْفِيكَ. وَقَدْ كَفَى كِفَايَةً، إِذَا قَامَ بِالْأَمْرِ. وَالْكُفْيَةُ: الْقُوتُ الْكَافِي»"
          source: "مقاييس اللغة لابن فارس (entry 988511)"
        - text: "«من (ك ف ي) الاستغناء بالشيء عن غيره، وأن يحفظ الله من كيد الغير وشره، والقيام بالأمر»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry 941114)"
      expands:
        - text: "كِفاية — en: adequacy"
          source: "المعجم الموحد لمصطلحات المياه 2000 (entry 387418) [ARABTERM]"
          addition: "يربط كفاية بـ adequacy وهو مصطلح إنجليزي أقرب إلى satisfactoriness من sufficiency."
        - text: "كفاية — en: sufficiency"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة 1995 (entry 410691) [ARABTERM]"
          addition: "الاستخدام الاقتصادي يربط كفاية بالكفاية الكمية، وهو جانب من المفهوم المطلوب."
        - text: "«صفة تطلق على الأنحاء من حيث قدرتها على الملاحظة أو الوصف أو التفسير»"
          source: "مسرد الإعلام والتواصل - ألكسو (entry 487230) [ARABTERM]"
          addition: "يُظهر استخدام «كفاية» كصفة وخاصية في السياق التقني، يدعم ضمّها للمجموعة."

    - lemma: "الاسْتِيفَاء"
      contradicts:
        - text: "استيفاء — en: interpolation"
          source: "مسرد المناخ والبيئة - ألكسو (entry 361058) [ARABTERM]"
          conflict: >
            المصطلح التقني الثابت لـ «استيفاء» في العربية المعاصرة هو التحليل الرقمي/الإحصائي
            (interpolation)، وهذا يناقض تمامًا دلالة satisfactoriness.
        - text: "الاستيفاء — en: Exhaustion of the subject (بلاغة)"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry 818922)"
          conflict: >
            في البلاغة العربية «الاستيفاء» مصطلح خاص باستيعاب المعنى شعريًّا، لا علاقة له
            بالإرضاء أو تلبية المتطلبات.

    - lemma: "المَقْبولِيَّة"
      contradicts:
        - text: "مقبولية — en: acceptability — «خاصية الجملة التي تكون مولدة بواسطة قواعد النحو، وتكون مفهومة بسهولة من لدن المتكلم ومتداولة بشكل طبيعي»"
          source: "مسرد الإعلام والتواصل - ألكسو (entry 487193) [ARABTERM]"
          conflict: >
            «المقبولية» راسخة في اللسانيات العربية المعاصرة بمعنى acceptability النحوية/التداولية،
            وهي مفهوم مختلف عن satisfactoriness. الاستخدام لهذا المصطلح في مجموعة satisfactoriness
            سيُحدث تصادمًا مع المصطلح اللساني المُستقرّ.

    - lemma: "الوَفَاء"
      contradicts:
        - text: "الوفاء — en: Faithfulness, loyalty, fulfilment — «ملازمة طريق المواساة، ومحافظة عهود الخلطاء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry 821183)"
          conflict: >
            «الوفاء» راسخ في العربية بمعنى الوفاء بالعهود والإخلاص (faithfulness/loyalty)، وليس
            بمعنى الخاصية العامة لتلبية المتطلبات. استخدامه في مجموعة satisfactoriness سيُحدث
            التباسًا مع مفهوم الإخلاص والأمانة.

    - lemma: "الاكْتِفَاء"
      contradicts:
        - text: "الاكتفاء — en: Ellipsis (بلاغة) — «نوع من أنواع الحذف وهو أن يقتضي المقام الاكتفاء بأحد الشيئين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry 818952)"
          conflict: >
            في البلاغة العربية «الاكتفاء» مصطلح راسخ للحذف البلاغي، مما يُحدث تصادمًا
            لو استُخدم بمعنى satisfactoriness.
        - text: "اكتفاء — en: sufficiency — «التقليل من استهلاك المواد الخام والطاقة عن طريق خفض الاستهلاك»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة 1996 (entry 379583) [ARABTERM]"
          conflict: >
            الاستخدام التقني لـ «اكتفاء» يتجه نحو الاكتفاء الذاتي (self-sufficiency) وهو أبعد
            من satisfactoriness المرتبطة بالإرضاء العام.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إِرْضَاء"
      decision: confirmed
      decision_reason: >
        على الرغم من أن «إِرْضَاء» مصدر فعلي يدل أصلًا على عملية الإرضاء (verbal noun من أَرْضَى
        الرباعي)، إلا أنه مقبول في العربية المعاصرة بوصفه اسمَ صفة مجردة تدل على خاصية
        إحداث الرضا؛ وهو في هذا السياق أقرب المتاح لمفهوم satisfactoriness بجانبه الوجداني.
        ورود الجذر في ابن فارس بدلالة «ضد السخط» يدعم هذا التوظيف.
      evidence_assessment:
        case: mixed
      morphological_fit: >
        وزن الإفعال (إفعال) يُستخدم في العربية المعاصرة للتعبير عن الخصائص المجردة في سياقات
        الجودة وخدمة العملاء (نحو: إبداع، إتقان، إنجاز). المصدر الصناعي مقبول في هذا السياق
        حتى وإن كانت دلالته الأصيلة عملية لا وصفية.
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركز على الجانب الوجداني والنفسي لتحقيق الرضا؛ يُستخدم في سياقات رضا العملاء وتقييم
        الخدمات من حيث تحقيقها للشعور بالارتياح والقناعة. يختلف عن «كفاية» بأنه ذو طابع
        شخصي/نوعي لا كمّي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِرْضَاء"

    - lemma: "كِفَايَة"
      decision: confirmed
      decision_reason: >
        «كِفَايَة» مُوثَّقة في المعاجم التقنية العربية بمقابل adequacy/sufficiency، وهي أكثر انسجامًا
        مع الجانب الوظيفي لمفهوم satisfactoriness المتعلق بالوفاء الكمي بالمتطلبات. ابن فارس
        يؤكد دلالتها «الحسب الذي لا مستزاد فيه» وهو تعبير دقيق عن اكتمال الأداء.
      evidence_assessment:
        case: confirm_only
      morphological_fit: >
        مصدر كَفَى على وزن فِعَالَة يُستخدم في العربية للتعبير عن الخصائص المجردة (نحو: جدارة،
        براعة، قدرة). الوزن مناسب لاسم الصفة المجردة ويُلائم وظيفة دلالية المجموعة.
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركز على الجانب الكمي والوظيفي: هل يبلغ الشيء الحد المطلوب منه؟ يُستخدم في السياقات
        الإدارية والتقنية للحكم على وفاء منتج أو أداء بمعايير محددة. يختلف عن «إرضاء» بكونه
        موضوعيًّا قياسيًّا لا ذاتيًّا وجدانيًّا.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِفَايَة"

    - lemma: "الاسْتِيفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة تُثبت رسوخ «الاستيفاء» في العربية المعاصرة بمعنى interpolation (تحليل رقمي)
        وفي البلاغة بمعنى استيعاب المعنى الشعري. استخدامه في مجموعة satisfactoriness سيُحدث
        تصادمًا حادًّا مع المصطلحَيْن الراسخَيْن.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "المَقْبولِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «المقبولية» مصطلح لساني راسخ بمعنى acceptability النحوية والتداولية، ومتمايز دلاليًّا عن
        satisfactoriness. ضمّها لهذه المجموعة سيُلبّس على القارئ بين مفهومَيْن مختلفَيْن.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الوَفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        «الوفاء» راسخ في العربية بمعنى الوفاء بالعهود والإخلاص (faithfulness/loyalty) وهو مفهوم
        أخلاقي مختلف عن satisfactoriness التي هي خاصية وظيفية. إدراجه سيحدث لبسًا شديدًا.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الاكْتِفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        «الاكتفاء» متصادم مع مصطلح البلاغة (الحذف البلاغي) ومع مفهوم self-sufficiency الاقتصادي.
        علاوة على ذلك، كِفَايَة الموجودة بالفعل تُغطي الجانب الكمي ذاته دون التصادم المذكور.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "صفة إعطاء الرضا الكافي لتلبية طلب أو حاجة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية لـ «the quality of giving satisfaction sufficient to meet a demand
        or requirement». الأسلوب العربي يستوجب الصياغة التعريفية بالجنس القريب والفصل النوعي،
        كما أن «إعطاء الرضا» تعبير غير مألوف في المعجمية العربية. يُفضَّل تعريف يصف الصفة
        بالإشارة إلى الجنس (صِفَة / خاصِّيَّة) ثم الفصل (الوفاء بالمتطلبات + تحقيق الرضا).
    authored:
      - type: terminological
        text: "صِفَةُ الشَّيْءِ الَّذِي يَفِي بِمُتَطَلَّبَاتِ الطَّلَبِ أَوِ الحَاجَةِ وَيُحَقِّقُ الرِّضَا عَنْهُ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كَوْنُ الشَّيْءِ مُرْضِيًا وَكَافِيًا لِتَلْبِيَةِ مَا يُطْلَبُ مِنْهُ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04799358-n"
          definition_index: 0
          text: "صِفَةُ الشَّيْءِ الَّذِي يَفِي بِمُتَطَلَّبَاتِ الطَّلَبِ أَوِ الحَاجَةِ وَيُحَقِّقُ الرِّضَا عَنْهُ"
