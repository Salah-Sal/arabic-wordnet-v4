    - lemma: "رغبة ملحة"
      decision: removed
      decision_reason: >
        «رغبة ملحة» تعني الرغبة الشديدة الملحّة (intense desire/craving)، وهي تُؤكد
        البُعد الكمّي (الشدة) لا البُعد النوعي الغريزي. لا توجد في المعاجم شواهد
        تربط هذا التركيب بمفهوم الدافع الغريزي. يُصنَّف المفهوم في سينسيت مستقل
        (craving/desire) لا في (instinctive motive). فشل اختبار التثبيت المعجمي.
