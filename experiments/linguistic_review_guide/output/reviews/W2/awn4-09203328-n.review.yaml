      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن البُعد الوجداني الشعوري للدافع الغريزي: الحالةُ التي يُحسّ فيها
        الكائن الانجذابَ الداخلي نحو سلوكٍ ما. يُستعمل في السياقات التربوية والنفسية
        للإشارة إلى القوة الداخلية قبل تحوّلها إلى فعل. يختلف عن «باعث» في التأكيد
        على الحالة الشعورية لا المحرّك الفكري، وعن «الدافع الغريزي» في كونه مفرداً
        ذا جذر راسخ.
      actions:
        - command: create_entry
          params:
            lemma: "نُزُوع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حَافِزٌ فِطْرِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «حافز» موجود بالفعل في السينسيت الهرمي (awn4-00023953-n) كلمة من لماته،
        مما يُضعف إضافته هنا بأي صيغة. إضافةً لذلك فشل التركيب اختبار التثبيت
        المعجمي (لم يُوجد في قواعد البيانات)، واختبار السكّ (يمكن إبدال «فطري»
        بـ «نفسي» أو «خارجي» ويبقى وصفاً صالحاً).

    - lemma: "غَرِيزَة"
      source: stage1
      decision: removed
      decision_reason: >
        «الغريزة» تعني instinct بوصفه طبيعة فطرية موروثة شاملة (الجنس)، لا دافعاً
        غريزياً بعينه (النوع). مثلاً: غريزة البقاء هي الجنس، والجوع دافع غريزي
        يصدر عنها. تصنيف غريزة في هذا السينسيت يخلط بين الجنس (instinct) والنوع
        (instinctive motive). كذلك فإن السينسيت الأعلى يحتوي على مستوى الطبيعة
        الفطرية، لا هذا السينسيت.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────
stage4_content:
  definition:
    current: "دافع غريزي"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يُعيد صياغة اسم المجموعة نفسه دون إضافة معلومة جنسية أو
        فصلية. إنه دائري تماماً ولا يُمكّن القارئ من فهم الحدود الدلالية للمفهوم.
        يحتاج إلى جنس قريب (دافع نفسي) وفصل نوعي (فطري غير مكتسب، صادر عن الطبيعة
        البيولوجية، يحثّ على سلوك بعينه).
    authored:
      - type: terminological
        text: >
