      decision: confirmed
      decision_reason: >
        موثَّق في المعجم الوسيط (التربية) بمعنى «حالة شعورية ترمى إلى سلوك معين
        لتحقيق رغبة ما»، وفي المعجم الطبي (ARABTERM) بمعنى conation «القوة الداخلية
