# ── المرحلة ١: المراجعة والتوليد ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمة «دافع غريزي» هي عين التعريف، مما يُفضي إلى دوران منطقي (circular definition as lemma)"
      - "لمة «رغبة ملحة» تؤكد الإلحاح لا الغريزية؛ وهي أقرب إلى synset الرغبة الشديدة منها إلى الدافع الغريزي"
      - "لمة «نزوة» ترجمتها المعجمية «caprice» (هوى مفاجئ عابر)، لا «instinctive motive»، وهي أقرب إلى مفهوم النزق والأهواء العابرة"
      - "التعريف العربي «دافع غريزي» مبتور ومكرور — يستحق صياغة تعريفية وافية"
    observations: >
      المجموعة تُعبِّر عن مفهوم «الدافع الغريزي» (urge/impulse) بوصفه محرِّكاً نفسياً فطرياً
      يستوجب وجود مصطلحات ذات جذور راسخة في المعجمية العربية. الهرم الدلالي
      (awn4-00023953-n) يحتوي بالفعل على «حافز» و«دافع» و«دافعية»، لذا ينبغي ألا
      تكون لمات هذه المجموعة متطابقة مع لمات الهرم. المعجم الوسيط يوثّق «النُّزُوع»
      في التربية بمعنى «حالة شعورية ترمى إلى سلوك معين» وهو توثيق دقيق يناسب
      هذا المفهوم. كذلك يوثّق المعجم الكبير «الباعث» نفسياً بمعنى Motif.

  blind_candidates:
    - lemma: "بَاعِث"
      generation_method: majaz
      justification: >
        إحياء الاستعمال المجازي للفظ «باعث» (اسم فاعل من بعث = أثار ونهّض) بمعناه
        النفسي؛ الكائن الذي يَبْعث النفسَ نحو فعلٍ ما. الجذر بعث على وزن فَاعِل
        يُفيد الديمومة والفاعلية، وهو يختلف عن «دافع» في كونه داخلياً ذاتياً.
    - lemma: "نُزُوع"
      generation_method: ishtiqaq
      justification: >
        من جذر نزع (قَلَع وشَدَّ) على وزن فُعُول المصدري، يدل على الميل الذاتي القوي
        والنزعة الداخلية نحو فعل ما. الوزن فُعُول يناسب الحالات الشعورية المستمرة
        كالجوع والعطش والشوق؛ مقابل «نزوع» الصفة المشبهة الدال على الاشتياق.
    - lemma: "حَافِزٌ فِطْرِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «حافز» (فاعل من حَفَزَ = دفع من خلف) و«فطري» (منسوب إلى الفطرة).
        يُميِّز هذا التركيب الدوافع الفطرية الموروثة عن الدوافع المكتسبة.
    - lemma: "غَرِيزَة"
      generation_method: ishtiqaq
      justification: >
        من جذر غرز (رَزَّ الشيء في الشيء) على وزن فَعِيلَة للطبيعة المغروزة في الكائن.
        «الغريزة» مصطلح راسخ في علم النفس العربي للدلالة على الطبيعة الفطرية التي
        تُحرِّك الكائن نحو أفعال بعينها، وهي من أقرب الألفاظ لمفهوم instinct/urge.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────
# استعلامات مُنفَّذة: (١) batch headword lookup لجميع اللمّات والمرشحات،
# (٢) English bridge [urge/impulse/instinct/drive]،
# (٣) component words lookup [نزوة، دافع، رغبة، اندفاع، هاجس]،
# (٤) Maqayis للجذور الرئيسية [بعث، دفع، رغب، غرز، نزع]
stage2_evidence:
  per_lemma:

    - lemma: "دافع غريزي"
      expands:
        - text: >
            «(الدَّافِع) (فِي الفَلْسَفَة) mobile: الداعي، وما له يختار القادرُ الفعلَ.
            وهو العاملُ الخاصُّ بالإنسانِ والمَوْقِفِ. وقد اصطُلِحَ على إطلاقِ لفظِ
            الحافزِ على الدَّافِعِ الخاصِّ بالإنسانِ ولفظِ «الباعث» على الدَّافِعِ
            الصَّادرِ عن المَوْقِفِ. ويَنْقَسِمُ إلى: أ – دَوافِعُ نَقْص...
            ب – دَوافِعُ الغَزارة»
          source: "المعجم الكبير، مجمع اللغة العربية"
          addition: >
            يُوثّق المعجم الكبير مصطلح «الدافع» نفسياً وفلسفياً، غير أن المجموعة
            تخصّصه بالوصف «غريزي». هذا التخصيص لم يُوثَّق كمصطلح مسكوك في المعاجم،
            لكن التركيب شائع في الأدبيات النفسية العربية.

    - lemma: "رغبة ملحة"
      contradicts:
        - text: >
            «الرَّغْبَة: إرادة الشيء، والرُّغبى: السعة في الإرادة. فإذا قيل رغب فيه
            وإليه اقتضى الحرص عليه، وإذا قيل رغب عنه اقتضى صرف الرغبة عنه والزهد فيه»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            الرغبة عند المناوي وغيره إرادةٌ وطلب، لا دافع غريزي. ولا يوجد في المعاجم
            توثيق لتركيب «رغبة ملحة» بوصفه مصطلحاً مسكوكاً. يفتقر التركيب إلى المكوّن
            الغريزي/الفطري الذي يُميّز هذا السينسيت.
        - text: >
            «(الرَّغْبَة) السؤالُ والطَّمَع. كثرةُ السؤال والحِرْصُ على الجَمْعِ
            مع مَنْعِ الحق»
          source: "المعجم الكبير، مجمع اللغة العربية"
          conflict: >
            سياق المعجم الكبير يُؤكد أن الرغبة هي الطلب والحرص، بينما الدافع الغريزي
            (urge/impulse) هو محرك نفسي فطري لا إرادي في الغالب.

    - lemma: "نزوة"
      contradicts:
        - text: >
            «نَزْوَة (في علم النفس): هوًى مفاجئ شديد لشيء ما مثل زيٍّ أو أغنية أو
            كتاب أو حلية وسرعان ما يزول»
          source: "معجم اللغة العربية المعاصرة، أحمد مختار عمر"
          conflict: >
            النزوة عند المعاصرين هوًى عابر وزائل (fad/caprice)، بينما الدافع الغريزي
            (urge/impulse) هو محرك فطري مستمر نسبياً. كذلك ترجمة ARABTERM للنزوة
            هي «caprice» لا «impulse» أو «urge».
        - text: >
            «نزوة والجمع نزوات: هجمة، ضربة. نزوة: تمرد، ثورة.
            نزوة: نزق، حدة، وقاحة، سفاهة، تصرف فظ»
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          conflict: >
            الدلالات التاريخية للنزوة (هجمة، تمرد، نزق) لا تتوافق مع instinctive motive
            الذي يدل على الدافع الغريزي كالجوع والعطش والتناسل.

    - lemma: "بَاعِث"
      confirm:
        - text: >
            «فى علم النَّفس (Motif): عاملٌ نَفْسِيّ، وهو فِكرة تَنْزِع إلى إحداث
            عَمَل إراديّ، فى حين أن الدافع قد يكون خارجِيّاً»
          source: "المعجم الكبير، مجمع اللغة العربية"
      expands:
        - text: "«باعث» — motive (Law domain)"
          source: "المعجم الموحد لمصطلحات القانون (2017)، ARABTERM"
          addition: >
            يوثّق المعجم القانوني «باعث» بمعنى motive، مما يؤكد توطّن اللفظ في الاستعمال
            التخصصي العربي. أصله الفاعلي من «بعث = أثار ونهّض» يناسب الدلالة النفسية.

    - lemma: "نُزُوع"
      confirm:
        - text: >
            «(النُّزُوع) (فِي التربية): حالة شعورية ترمى إلى سلوك معين لتحقيق رغبةٍ ما»
          source: "المعجم الوسيط، مجمع اللغة العربية"
        - text: >
            «القوة الداخلية التي تدفع الإنسان إلى القيام بعمل ما في مجال الشعور»
          source: "معجم المصطلحات الطبية ج.1 (1985)، ARABTERM — translation_en: conation"
      expands:
        - text: >
            «(النُّزُوع): الاشتياق الشديد، وذلك هو المعبَّر عنه بارتحال النفس مع الحبيب»
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: >
            يُوسّع المناوي دلالة النزوع لتشمل الاشتياق الشديد (القوة الجذبية الداخلية)،
            وهو ما يتقاطع مع مفهوم urge في بُعده الانجذابي.

    - lemma: "حَافِزٌ فِطْرِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "غَرِيزَة"
      expands:
        - text: >
            «(الغريزة): الطبيعة والقريحة والسجية. (فى الفلسفة): صورة من صور النشاط
            النفسى، وطراز من السلوك يعتمد على الفطرة والوراثة البيولوجية (مج)»
          source: "المعجم الوسيط، مجمع اللغة العربية"
          addition: >
            الغريزة مصطلح راسخ بمعنى instinct (الطبع الفطري الموروث)، أي الجنس
            الأعلى للمفهوم. أما الدافع الغريزي فهو نمط سلوكي واحد صادر عن الغريزة،
            لا الغريزةُ ذاتُها.
        - text: >
            «الغريزة: [في الإنجليزية] Instinct, impulse. [في الفرنسية] Instinct, pulsion.
            بالراء المهملة الطبيعة... ملكة تصدر عنها صفات ذاتية»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: >
            التهانوي يترجم الغريزة بـ impulse أيضاً، مما يُلمح إلى احتمال تداخل
            دلالي مع هذا السينسيت في الاستعمال الكلاسيكي.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────
stage3_analysis:
