            sense_id: "{auto}"

    - lemma: "نزوة"
      decision: removed
      decision_reason: >
        توثّق المعاجم الحديثة (معجم المعاصر، ARABTERM - Sociology/Psychology) «نزوة»
        بمعنى «caprice» (هوى عابر)، وليس «instinctive motive». الفارق جوهري: النزوة
        هوًى مفاجئ عابر زائل، بينما الدافع الغريزي محرّك فطري بيولوجي مستمر. أصلها
