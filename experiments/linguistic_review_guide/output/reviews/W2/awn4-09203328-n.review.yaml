      decision: confirmed
      decision_reason: >
        يُوثّق المعجم الكبير «الباعث» في علم النفس بمعنى Motif: «عاملٌ نفسيّ، وهو
        فكرة تنزع إلى إحداث عمل إرادي». وهذا التوثيق النفسي المتخصص — مع ثبوته في
        المعجم القانوني بمعنى motive — يُرسّخ قبوله. الوزن فَاعِل من الجذر الصحيح
