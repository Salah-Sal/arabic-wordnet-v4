        mwe_type: wasfi
      nuance_differentiation: >
        يؤدي وظيفة المصطلح الأكاديمي الوصفي للمفهوم؛ يُستعمل في الكتابة العلمية
        والتربوية للإشارة إلى جنس الدوافع الفطرية (كدافع الجوع والعطش والتناسل)،
        بينما يُعبّر «النُّزُوع» عن حالة الانجذاب الداخلي الشعوري، و«بَاعِث» يُركّز
