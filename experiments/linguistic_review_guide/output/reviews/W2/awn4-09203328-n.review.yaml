    - lemma: "دافع غريزي"
      decision: confirmed
      decision_reason: >
        رغم أن التركيب وصفي حرّ وليس وحدة معجمية مسكوكة (فشل اختبار السكّ: يمكن إبدال
        «غريزي» بـ «نفسي» أو «مكتسب» ويبقى وصفاً)، إلا أنه يُمثّل التعبير العربي
        الاصطلاحي الأكثر شيوعاً في الأدبيات النفسية والتربوية العربية للدلالة على هذا
        المفهوم. يُقبل بوصفه مدخلاً مركّباً وصفياً مع تسجيل التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
