  per_entry:
    - lemma: "شَكْلٌ مُسْتَدِير"
      entry_id: "{auto}"
      roots:
        - word: "شكل"
          root: "شكل"
          maqayis_quote: "«الشين والكاف واللام أصلان: أحدهما يدلُّ على الشَّبَه، والآخر على عَقْل الشيء.»"
        - word: "مستدير"
          root: "دور"
          maqayis_quote: "«الدال والواو والراء أصلٌ واحد يدل على إحداق الشيء بالشيء من حواليه.»"
    - lemma: "اسْتِدارَة"
      entry_id: "{auto}"
