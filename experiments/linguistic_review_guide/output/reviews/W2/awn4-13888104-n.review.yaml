    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دور","maqayis":"«الدال والواو والراء أصلٌ واحد يدل على إحداق الشيء بالشيء من حواليه.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبير وصفي عام يستخدم للإشارة إلى أي جسم أو خط يتسم بالاستدارة.","mwe":true}'
    - command: set_metadata
