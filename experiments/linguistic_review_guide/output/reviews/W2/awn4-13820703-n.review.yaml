# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (تَعَدٍّ) مشتركة بين الاستخدام الرياضي-المنطقي (خاصية التعدِّي) والاستخدام النحوي (تعدِّي الفعل)، مما قد يُوجد اشتراكاً لفظياً لدى القارئ غير المتخصص"
      - "التعريف الحالي يُقدِّم التعدِّيَ كأنه 'علاقة بين ثلاثة عناصر' في حين أنه دقيقاً هو 'خاصية للعلاقة الثنائية' تتحقق حين تُربط ثلاثة عناصر بتلك العلاقة"
      - "المجموعة تحتوي لمّة واحدة فقط، وشواهد معجمية تُثبت أن تَعْدِيَة تُستخدم هي الأخرى مقابلاً لـ transitivity في معجمَي الرياضيات والفلسفة (ARABTERM)"
    observations: "مفهوم التَّعَدِّي خاصيةٌ رياضية-منطقية أساسية في دراسة علاقات الترتيب والتكافؤ. وقد أفلح المصطلحيون العرب في توطينه بالاشتقاق من جذر عدو/عدي الذي يدل على التجاوز والإفضاء من طرف إلى آخر؛ فقال الخليل كما نقل ابن فارس: 'التَّعَدِّي: تَجَاوُزُ مَا يَنْبَغِي أَنْ يُقْتَصَرَ عَلَيْهِ'. والمصطلح ثابت في المعجم الموحد لمصطلحات الرياضيات والفلك (1990) وفي مسرد الفلسفة وعلم النفس. ويُلاحَظ تلاقٍ دلالي مُثمر بين التعدِّي النحوي (تجاوز أثر الفعل إلى المفعول) والتعدِّي الرياضي (تجاوز العلاقة من الحد الأول إلى الثالث عبر الثاني)."
  blind_candidates:
    - lemma: "التَّعَدِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من تَعَدٍّ بإلحاق ياء النسبة وتاء التأنيث، يُحوِّل المصدر إلى اسم خاصية مجردة على قياس 'قابلية' و'إمكانية' و'انعكاسية'؛ يُعبِّر عن التعدِّي بوصفه خاصية نوعية للعلاقات الثنائية في المنطق الرياضي"
    - lemma: "الانتقاليَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من انتقَلَ (على وزن الانفعالية)، يُعبِّر عن جوهر الخاصية وهو انتقال إسناد العلاقة من العنصر الأول عبر الثاني إلى الثالث؛ ويقابل المصطلح الفرنسي transitivité في بعض الأدبيات الفلسفية"
    - lemma: "التَّناقُليَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من تَنَاقَلَ (تَفَاعَل من نَقَلَ)، يُشير إلى التناقل المتسلسل للعلاقة بين حلقات السلسلة الثلاثية؛ وزن التفاعل يُلائم الدلالة على اشتراك الحلقات في حمل العلاقة"
    - lemma: "التَّسَلسُل"
      generation_method: majaz
      justification: "مجاز دلالي من التسلسل بمعنى ترتّب الأمور وتتابعها؛ الخاصية التعدِّية تضمن أن العلاقة 'تنساب' عبر سلسلة العناصر من الأول إلى الأخير دون انقطاع، ويستحضر هذا المجاز الصورة البصرية لحلقات السلسلة"


