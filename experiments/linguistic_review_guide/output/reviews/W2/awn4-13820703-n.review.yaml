stage2_evidence:
  per_lemma:
    - lemma: "تَعَدٍّ"
      confirm:
        - text: "«تعدّ، تعدية» — translation_en: transitivity — domain: Mathematics and Astronomy"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM entry_id:417939"
        - text: "«تعدية» — translation_en: transitivity — domain: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM entry_id:490493"
        - text: "«مفهوم التعدي» — translation_en: concept of transitivity — التعريف: عندما يفضل المستهلكون سلعة 'أ' على سلعة 'ب' ويفضلون 'ب' على 'ج' فإنهم يفضلون أيضا 'أ' على 'ج' وهو سلوك رشيد"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — ARABTERM entry_id:400932"
      expands:
        - text: "«الْعَيْنُ وَالدَّالُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ صَحِيحٌ يَرْجِعُ إِلَيْهِ الْفُرُوعُ كُلُّهَا، وَهُوَ يَدُلُّ عَلَى تَجَاوُزٍ فِي الشَّيْءِ وَتَقَدُّمٍ لِمَا يَنْبَغِي أَنْ يُقْتَصَرَ عَلَيْهِ. [...] وَقَالَ الْخَلِيلُ: التَّعَدِّي: تَجَاوُزُ مَا يَنْبَغِي أَنْ يُقْتَصَرَ عَلَيْهِ»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ) — entry_id:987669"
          addition: "يُؤصِّل المعنى الأصلي للتعدِّي اشتقاقياً بأنه التجاوز والإفضاء إلى ما وراء الحدّ، وهو الجوهر الدلالي المُرخَّص للتعدِّي الرياضي-المنطقي"
        - text: "«خاصية الفعل المتعدي، وهي في أصل اللغة التجاوز، والمتعدي من الأفعال عند النحاة ما جاوز فاعله أو ما ينزل منزلته إلى غيره من المعمولات أو المحلات»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM entry_id:497441"
          addition: "يكشف الصلة البنيوية بين التعدِّي النحوي (تجاوز أثر الفعل إلى المفعول) والتعدِّي المنطقي (تجاوز العلاقة من الحد الأول إلى الثالث)؛ وكلاهما مشترك في معنى التخطِّي والنفاذ"

    - lemma: "التَّعَدِّيَّة"
      evidence_status: "no_material_found"

    - lemma: "الانتقاليَّة"
      contradicts:
        - text: "«انتقال» بلا تعريف — domain: Civil Engineering / Water / Chemistry / Geology / Seismology / Anatomy / Media"
          source: "المعاجم الموحدة المتعددة (ARABTERM) — entry_ids: 353650، 388742، 401185، 429269، 433846، 438553، 476358، 486809، 501540"
          conflict: "مصطلح الانتقال راسخ في الفيزياء والهندسة والعلوم التطبيقية للدلالة على النقل المكاني أو الانتقال بين الحالات المادية، ولا يرتبط معجمياً بخاصية التعدِّي الرياضي-المنطقي في أي من المعاجم المستعلَمة"

    - lemma: "التَّناقُليَّة"
      evidence_status: "no_material_found"

    - lemma: "التَّسَلسُل"
      contradicts:
        - text: "«التسلسل: ترتيب أمور غير متناهية»"
          source: "التوقيف على مهمات التعاريف للمناوي — hawramani entry_id:813270"
          conflict: "التسلسل في المنطق التقليدي العربي يدل على التراتب اللانهائي (infinite regress) لا على خاصية التعدِّي الرياضية"
        - text: "«وعند الحكماء عبارة عن ترتّب أمور غير متناهية مجتمعة في الوجود والترتيب سواء كان الترتّب وضعيا أو عقليا [...] وهذا تعريف للتسلسل المستحيل عند الحكماء»"
          source: "كشاف اصطلاحات الفنون — hawramani entry_id:819180"
          conflict: "التسلسل اصطلاح فلسفي-منطقي عربي متحقِّق المعنى يدل على التراتب اللانهائي؛ توظيفه للدلالة على transitivity يُفضي إلى خلط مصطلحي خطير في الأدب الفلسفي-الرياضي العربي"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تَعَدٍّ"
      decision: confirmed
      decision_reason: "المصطلح مؤصَّل ومُثبَّت في المعجمية العربية الرياضية والفلسفية: موثَّق في المعجم الموحد للرياضيات والفلك (1990) ومسرد الفلسفة وعلم النفس بوصفه مقابلاً لـ transitivity. جذره عدو يدل على التجاوز وهو الجوهر الدلالي للخاصية. التشكيل كامل وصحيح صرفياً (تَعَدٍّ = مصدر تعدَّى Form V معتل اللام، وزن تَفَعُّل المعتل → تَفَعٍّ). لا حاجة إلى تحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة في المجموعة؛ تجمع بين الظل النحوي (تعدِّي الفعل = تجاوز أثره إلى المفعول) والمعنى الرياضي-المنطقي (انتقال العلاقة من الحد الأول إلى الثالث عبر الثاني)، وهو تلاقٍ دلالي يُعزِّز التمكين المصطلحي ويجعل المصطلح شفافاً للمستخدم العربي ذي الخلفية النحوية"

    - lemma: "التَّعَدِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "الصيغة غير موثَّقة في أي معجم تخصصي. والمعيار الرائج هو تَعَدٍّ (مصدر تعدَّى) أو تَعْدِيَة (مصدر عَدَّى). فضلاً عن ذلك فإن إلحاق ياء النسبة والتاء بمصدر معتل اللام كتَعَدٍّ يُنتج تَعَدِّيَّة (بكسر الدال والتشديد) لا التَّعَدِّيَّة بمعنى مستقل؛ وقد يُخلط بينها وبين تَعْدِيَة (من عدَّى Form II) المختلفة صرفياً ودلالياً"
      evidence_assessment:
        case: no_material

    - lemma: "الانتقاليَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح الانتقال مستقر في الفيزياء والهندسة وعلوم الأرض للدلالة على النقل المكاني والانتقال بين الحالات، ولا يُستخدم في المعجمية العربية الرياضية المعاصرة للدلالة على خاصية التعدِّي المنطقية. اعتماده سيُفضي إلى تداخل مع مصطلحات قائمة في حقول أخرى وغياب في حقل المنطق الرياضي"
      evidence_assessment:
        case: contradicts_only

    - lemma: "التَّناقُليَّة"
      source: stage1
      decision: removed
      decision_reason: "الصيغة مُفتعلة وغير موثَّقة في أي معجم تخصصي عربي. وزن التفاعل (تناقل) يوحي بالتبادل والمشاركة المتبادلة بين طرفين متقابلين (reciprocity) لا بانتقال خاصية من الأول إلى الثالث عبر الوسيط، مما يُقرِّبه دلالياً من مفهوم التماثل أو الارتداد لا التعدِّي"
      evidence_assessment:
        case: no_material

    - lemma: "التَّسَلسُل"
      source: stage1
      decision: removed
      decision_reason: "التسلسل مصطلح راسخ في المنطق العربي الكلاسيكي والحديث للدلالة على التسلسل اللانهائي (infinite regress) وهو المحال عند الحكماء. استخدامه بديلاً عن التعدِّي سيُوجد تشويشاً مصطلحياً خطيراً في الأدب الفلسفي-الرياضي العربي لأن المصطلحَيْن يندرجان في الحقل ذاته (المنطق) مع تمييز واضح بينهما"
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
