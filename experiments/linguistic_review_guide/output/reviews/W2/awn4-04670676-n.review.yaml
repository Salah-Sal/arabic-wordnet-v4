stage3_analysis:
  per_lemma:
    - lemma: "شرود"
      decision: confirmed
      decision_reason: >
        وثّقته المعجمان الوسيط والكبير في سياق علم النفس بمعنى «عدم الانتباه إلى
        الظروف المحيطة»؛ ويُستخدم في العربية المعاصرة للتعبير عن الانصراف عن
        الآخرين. الشاهد المعجمي كافٍ للإبقاء عليه مع تصحيح التشكيل وإضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        شُرُود يُركّز على الجانب الذهني والنفسي للإهمال: انصراف الذهن وشرود
        الانتباه عن المحيطين؛ وهو أقرب إلى وصف الحالة الآنية منه إلى السمة الراسخة،
        ومن جذر يدل على التنفير والنفار والابتعاد في انتشار.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شُرُود"

    - lemma: "عدم انتباه"
      decision: removed
      decision_reason: >
        تعبيرٌ وصفي حرٌّ لا وحدةً معجميةً مسكوكة: يمكن إبدال «انتباه» بـ«مبالاة» أو
        «رعاية» وتبقى العبارة صحيحة وصفياً — تفشل اختبار السكّ. لا وجود لها
        كمصطلح ثابت في قواعد البيانات المعجمية. اللمّة الأعمّ «غفلة» تؤدي المعنى
        ذاته بصياغة معجمية راسخة عريقة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غَفْلَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظٌ عربيٌّ أصيل موثَّق في أمّهات المعاجم الكلاسيكية والحديثة. عرّفه المناوي
        والجرجاني والتهانوي تعريفات دقيقة تتطابق مع دلالة المجموعة؛ وصنّفه التهانوي
        مرادفاً مباشراً لـ inattention. وزن فَعْلَة مناسب للسمة والخَصْلَة الراسخة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        غَفْلَة تُشير إلى السمة الأعمق والأكثر رسوخاً في الشخصية: غياب الوعي الداخلي
        بما يجب الشعور به تجاه الآخرين، وقد تكون لاشعورية لا متعمّدة — وهذا ما
        يميّزها عن اللامبالاة التي تنطوي على قدر من التعمد.
      actions:
        - command: create_entry
          params:
            lemma: "غَفْلَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "لَامُبَالاة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح راسخ في العربية المعاصرة؛ أجاز مجمع اللغة المصري استخدامه، وورد في
        معاجم المصطلحات التقنية (الاجتماع، الطب، الاقتصاد). يُعبّر بدقة عن الاستخفاف
        بالآخرين وعدم الاكتراث بهم بوصفه سمةً شخصية واضحة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        لَامُبَالاة تُبرز الطابع الواعي الإرادي في عدم الاكتراث بالآخرين؛ أثقل وطأةً
        من الغفلة، وتُوحي بالاستهتار الذي قد يصل إلى الازدراء — وفيها دلالة إرادية
        لا تحملها الغفلة بالضرورة.
      actions:
        - command: create_entry
          params:
            lemma: "لَامُبَالاة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إِهْمَال"
      source: stage1
      decision: removed
      decision_reason: >
        إهمال يصف فعلاً سلوكياً (ترك الشيء سُدىً) لا سمةً شخصية راسخة؛ والمعاجم
        التقنية توثّقه في سياق القانون والطب بمعنى negligence الإجرائي. وجود معنى
        لساني مختلف (إهمال الحرف) يُضعف من ملاءمته. السمة الشخصية أفضل ما يعبّر
        عنها بـ«غفلة» أو «لامبالاة».

    - lemma: "جَفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الجفاء في أمّهات المعاجم «الغلظ في العشرة والخرق في المعاملة»؛ دلالته الأصلية
        على الخشونة والقسوة لا على الإهمال والغفلة. ضمّه للمجموعة يُدخل تحيّزاً
        دلالياً نحو القسوة في التعامل بدلاً من عدم الاكتراث الذهني.


