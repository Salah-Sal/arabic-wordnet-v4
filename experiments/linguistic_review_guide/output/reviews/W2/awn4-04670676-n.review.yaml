          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«شرود الذهن (في علم النفس): عدمُ الانتباه إلى الظروف المحيطة, أو الملابسات الطارئة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
      expands:
