        - text: "translation_en: fugue — domain: The Unified Medical Dictionary"
          source: "المعجم الطبي الموحد — أرابترم"
          addition: "في السياق الطبي يُستخدم لحالة الهروب النفسي (fugue) وهو معنى متخصص أبعد عن دلالة المجموعة"

    - lemma: "عدم انتباه"
      expands:
        - text: "«الانتباه: زجر الحق عبده بما يزعجه وينشطه عناية منه به»"
          source: "التوقيف على مهمات التعاريف — المناوي"
          addition: "المعاجم الكلاسيكية تعرّف الانتباه في سياق صوفي ديني؛ لا يوجد توثيق لـ«عدم انتباه» بوصفها وحدة معجمية مستقلة"
        - text: "translation_en: attention — domain: Education / Philosophy and Psychology"
          source: "مسرد التربية / مسرد الفلسفة وعلم النفس — أرابترم"
          addition: "«انتباه» مُدخَل كمصطلح تقني بمعنى attention؛ أما «عدم انتباه» فلا وجود لها كمصطلح مستقل في قواعد البيانات"

    - lemma: "غفلة"
      confirm:
        - text: "«الغفلة: فقد الشعور بما حقه أن يشعر به، قاله الحرالي. وقال أبو البقاء: الذهول عن الشيء. وقال الراغب: سهو يعتري من قلة التحفظ والتيقظ»"
          source: "التوقيف على مهمات التعاريف — المناوي (ت 1622م)"
        - text: "«الغفلة عن الشيء: هي ألا يخطر ذلك بباله»"
          source: "كتاب التعريفات — الشريف الجرجاني (ت 1413م)"
        - text: "«الغفلة:[في الانكليزية] Distraction، inattention [في الفرنسية] Distraction، inattention»"
