stage1_review:
  assessment:
    concerns:
      - "لمّة «عدم انتباه» تعبيرٌ وصفيٌّ حرٌّ وليست وحدةً معجميةً مسكوكة؛ يمكن إبدال «انتباه» بـ«مبالاة» أو «رعاية» وتبقى العبارة صحيحة وصفياً — تفشل اختبار السكّ"
      - "لمّة «شرود» تصف حالةً نفسيةً طارئة (شرود الذهن) لا سمةً ثابتةً في الشخصية؛ والمعاجم تثبّتها في المركّب «شرود الذهن» لا منفردةً كسمة شخصية"
      - "مفهوم المجموعة هو السمة الشخصية لعدم مراعاة الآخرين (inconsiderateness)، لكن lemmas_en تقول «inattentiveness» وهو أعمّ — تعارض دلالي بين التعريف الإنجليزي والمرادف الإنجليزي"
      - "كلتا اللمّتين خاليتان من التشكيل الكامل"
    observations: >
      المجموعة الترادفية تقع ضمن تراتبية السمات الشخصية (خصلة/سمة) وتُعبّر عن
      الإهمال الذاتي للآخرين وعدم الاكتراث بهم كخَصْلَة راسخة. التراثُ العربي غنيٌّ
      في هذا الباب: «الغَفْلَة» عند المناوي هي «فقد الشعور بما حقه أن يشعر به» مما
      يطابق المعنى المقصود تماماً، و«اللَّامُبَالاة» راسخةٌ في العربية المعاصرة. أما
      «شرود» فمقبول بوصفه اشتقاقاً من التنفير والابتعاد، وقد وثّقته المعاجم الحديثة في
      سياق علم النفس، غير أن «عدم انتباه» يجب حذفها لأنها وصفٌ لا مصطلح.

  blind_candidates:
    - lemma: "غَفْلَة"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل غَفَلَ على وزن فَعْلَة، يدل على السهو والإهمال وترك الشيء
        بلا انتباه. وزن فَعْلَة يفيد الهيئة والسمة الراسخة، مما يجعله مناسباً للتعبير
        عن الخَصْلَة الثابتة. مستخدَم في الكلاسيكية والمعاصرة لوصف الغافل عن الآخرين.
    - lemma: "لَامُبَالاة"
      generation_method: tarkib
      justification: >
        مركّب إضافي-نفي من «لا» النافية و«مُبَالاة» (مصدر بالى)؛ وحدة معجمية ثابتة
        في العربية المعاصرة لا يمكن إبدال مكوّناتها بمرادفات وتبقى المصطلح ذاته.
        مجمع اللغة المصري أجاز دخول ال- عليها. تُعبّر عن عدم الاكتراث بالآخرين
        بوصفه سمةً شخصية.
    - lemma: "إِهْمَال"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل أَهْمَلَ (باب الإفعال) من جذر همل، بمعنى ترك الشيء سُدىً دون
        رعاية. الأصل في مقاييس اللغة «خلّيت بينه وبين نفسه»؛ يُستخدم في الأطر
        القانونية والنفسية للدلالة على إهمال الآخرين وعدم الاعتناء بهم.
    - lemma: "جَفَاء"
      generation_method: majaz
      justification: >
        إزاحة دلالية من الأصل المادي «جفا الشيء = نبا عنه وابتعد» نحو معنى الجفاء
        في المعاملة؛ عرّفه المناوي بـ«الغلظ في العشرة والخرق في المعاملة وترك الرفق
        في الأمور» مما يلامس عدم مراعاة الآخرين.


