# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أثر، علامة) تفتقران إلى التشكيل الكامل"
      - "علامة مُدرجة أيضاً في المجموعة الأمّ المباشرة (awn4-06810027-n)، ما يُفضي إلى تشويش في الشبكة الدلالية"
      - "التعريف الحالي (دلالة مرئية مصنوعة على سطح) ترجمة حرفية من الإنجليزية، ولا يتوافق أسلوبه مع معجم الوسيط"
      - "المجموعة تفتقر إلى لمّات تُغطّي معنى النقش والوسم اللذين يمثّلان أنواعاً جوهرية من الآثار المرئية على السطح"
    observations: >
      المجموعة تمثّل مفهوماً عربياً أصيلاً هو «الأثر المرئي المصنوع على سطح»، وهو
      مفهوم موثّق في التراث اللغوي العربي بلمّات عدة. الإشكالية الرئيسية وجود «علامة»
      في كلٍّ من هذه المجموعة ومجموعتها الأمّ، وهو ما يُضعف الحدود الدلالية. اللمّة
      الأجدر بهذه المجموعة هي «أثر» بمعنى بقية الشيء ورسمه الباقي، وليس «علامة»
      التي تعني كل ما يدلّ على الشيء بصرف النظر عن كونه أثراً مادياً على سطح.

  blind_candidates:
    - lemma: "نَقْشٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ن-ق-ش) على وزن فَعْل؛ يدل على الأثر المنقوش أو الملوَّن الذي
        يُحدَث على السطح، وهو نوع بارز من «الدلالة المرئية المصنوعة على سطح».
        الاشتقاق منتج والوزن مناسب للمصدر الذي يدل على الحدث والنتيجة معاً.

    - lemma: "وَسْمٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (و-س-م) على وزن فَعْل؛ يدل على العلامة التي تُطبَع أو تُحرَق
        على السطح لغرض التمييز. يتضمّن بالضرورة كون الأثر مصنوعاً ومرئياً على السطح،
        وهو ما يوافق التعريف بدقة.

    - lemma: "طَبْعَةٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ط-ب-ع) على وزن فَعْلة؛ إذ يدل الطبع أصلاً على بلوغ نهاية الشيء
        وختمه، ومن ذلك طبع السكة والدرهم. يُحيل إلى الأثر المطبوع المصنوع على سطح.

    - lemma: "رَقْمٌ"
      generation_method: majaz
      justification: >
        مجاز بالإحياء؛ كان الرقم في أصله العربي يعني الخط والنقش والكتابة على السطح
        (مقاييس اللغة: «يدل على خط وكتابة وما أشبه ذلك»)، وهو أثر مرئي مصنوع على
        سطح. إحياء هذه الدلالة الأصيلة يوفّر مصطلحاً عريقاً.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "أَثَرٌ"
      confirm:
        - text: "«الأَثَرُ، محرَّكةً: بَقِيَّةُ الشيءِ»"
          source: "القاموس المحيط للفيروزآبادي (ت817هـ)"
        - text: "«الأثر: حصول ما يدل على وجود الشيء والنتيجة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الأثر له أربعة معانٍ: الأول بمعنى النتيجة وهو الحاصل من الشيء، والثاني بمعنى العلامة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الهمزة والثاء والراء، له ثلاثة أصول: تقديم الشيء، وذكر الشيء، ورسم الشيء الباقي... والأثر بقية ما يُرى من كل شيء»"
          source: "مقاييس اللغة لابن فارس (ت395هـ)"
        - text: "translation_en: imprint — domain: Transport and Infrastructure"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "translation_en: trace — definition: فيزيائياً، بصمة يتركها مرور إنسان، حيوان أو جسم متحرك بموقع المرور"
          source: "مسرد المناخ والبيئة (ArabTerm)"

    - lemma: "عَلامَةٌ"
      confirm:
        - text: "«العين واللام والميم أصل صحيح واحد، يدل على أثر بالشيء يتميز به عن غيره. من ذلك العلامة، وهي معروفة»"
          source: "مقاييس اللغة لابن فارس (ت395هـ)"
        - text: "translation_en: designation / identification / marking"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      contradicts:
        - text: "«العلامة بالفتح عند الأصوليين ما تعلّق بالشيء من غير تأثير فيه ولا توقّف له عليه إلّا من جهة أنّه يدلّ على وجود ذلك الشيء»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            تعريف الأصوليين يجعل العلامة ما «لا تأثير فيه»، أي لا أثر مادي على السطح،
            وهذا يناقض قيد «مصنوعة على سطح» الوارد في تعريف المجموعة.
        - text: "«العلامة: الأمارة وهي ما يعرف الوجود من تعلق وجود لا وجوب»"
          source: "التعريفات الفقهية للبركتي"
          conflict: >
            تعريف العلامة هنا ينصبّ على الدلالة المعنوية لا الأثر المادي المرئي على السطح.

    - lemma: "نَقْشٌ"
      confirm:
        - text: "«النَّقْشُ: الأَثَرُ، يُقال: ذهب الرَّماد حتَّى ما نرى له نَقْشاً»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(النقش) الأثر يقال ذهب الرماد حتى ما نرى له نقشاً»"
          source: "المعجم الوسيط (نسخة حوراماني)"
        - text: "«النَّقْشُ: تَلْوينُ الشيء بِلَوْنَيْنِ أو بألْوانٍ»"
          source: "القاموس المحيط للفيروزآبادي (ت817هـ)"
        - text: "«النون والقاف والشين أصل صحيح يدل على استخراج شيء واستيعابه... ومنه نقش الشيء: تحسينه، كأنه ينقشه، أي ينفي عنه معايبه ويحسّنه»"
          source: "مقاييس اللغة لابن فارس (ت395هـ)"

    - lemma: "وَسْمٌ"
      confirm:
        - text: "«الواو والسين والميم: أصل واحد يدل على أثر ومعلم. ووسمت الشيء وسماً: أثّرت فيه بسمة»"
          source: "مقاييس اللغة لابن فارس (ت395هـ)"
        - text: "«الوَسْمُ: أثَرُ الكَيِّ»"
          source: "القاموس المحيط للفيروزآبادي (ت817هـ)"
        - text: "«الوسم: التأثير والسمة الأثر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "translation_en: marking"
          source: "المكنز الزراعي متعدد اللغات (AGROVOC)"

    - lemma: "طَبْعَةٌ"
      contradicts:
        - text: "«مجموعُ النُّسَخِ الْمَطْبوَعَة في مرَّة واحدة من كِتابٍ أو جريدة. يُقال: الطَّبْعَة الأولى، أو الأخيرة»"
          source: "المعجم الكبير (OCR)"
          conflict: >
            المعنى الراسخ في المعجمية الحديثة هو «طبعة الكتاب» أي نسخة الطبع، لا الأثر
            المرئي على السطح. الدلالة المقصودة انزاحت إلى معنى آخر.
        - text: "translation_en: print — domain: Geography and History"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
          conflict: "المعنى في السياق هو طبعة الكتاب (edition) لا الأثر المرئي على السطح."

    - lemma: "رَقْمٌ"
      confirm:
        - text: "«الرقم: الخط الغليظ، وقيل هو تعجيم الكتاب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الراء والقاف والميم أصل واحد يدل على خط وكتابة وما أشبه ذلك. فالرقم: الخط... وكل ثوب وُشي فهو رقم. والأرقم من الحيات: ما على ظهره كالنقش»"
          source: "مقاييس اللغة لابن فارس (ت395هـ)"
      contradicts:
        - text: "«الرقم: في الأصل الكتابة والنقش والختم، ثم قيل للنقش الذي يرقم التاجر على الثياب علامة على أن ثمنها كذا»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            الدلالة الأصلية للرقم (خط/نقش) هجرها الاستعمال العربي الحديث لصالح «العدد/الرقم
            الحسابي»، فالإبقاء على هذه اللمّة يُفضي إلى اشتراك لفظي مع الاستعمال الشائع.
        - text: "translation_en: digit / figure / number"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) + معاجم ARABTERM"
          conflict: "الاستعمال المصطلحي الراسخ في العربية الحديثة: رقم = عدد، لا أثر مرئي."


