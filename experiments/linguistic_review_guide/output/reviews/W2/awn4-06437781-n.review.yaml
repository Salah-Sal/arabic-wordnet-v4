# ══════════════════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد
# ══════════════════════════════════════════════════════════════
stage1_review:

  # أ. التوليد الأعمى — بُني على التعريف وحده قبل الاطلاع على اللمّات
  blind_candidates:
    - lemma: "رَقْمٌ هَاتِفِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من "رَقْم" (اسم) و"هَاتِفِيّ" (نسبة إلى هاتف). الوحدة
        الاصطلاحية مستقاة من نمط موسوعة الكهرباء IEC 60050 التي تستخدم
        "رقم الدليل الهاتفي" لرقم الاشتراك، مما يثبت إنتاجية هذه الصيغة
        في الخطاب التقني العربي الرسمي.

    - lemma: "تَرْقِيمَةٌ هَاتِفِيَّةٌ"
      generation_method: tarkib
      justification: >
        مركب وصفي؛ قاعدته "تَرْقِيمَة" مشتقة من جذر (رقم) على وزن
        تَفْعِيلة، تدل على الرمز الرقمي المُعيَّن. إضافة "هاتفية" تخصّص
        المفهوم. الاشتقاق يُبعد عن الدوران مع التعريف.

    - lemma: "مُعَرِّفٌ هَاتِفِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من "مُعَرِّف" (اسم فاعل من عرف، وزن مُفَعِّل) بمعنى
        الرمز المُعرِّف (identifier) و"هاتفي". يُبرز وظيفة الرقم التعريفية
        ويتوافق مع اصطلاح تقنية المعلومات.

    - lemma: "نُمْرَةُ الهَاتِفِ"
      generation_method: taarib
      justification: >
        تعريب أُنتج عبر الملاذ الأخير: "نُمْرَة" معرَّبة عن numéro/numero
        (إيطالي ولاتيني)، تقبل لام التعريف والنسبة والجمع السالم (نُمَر).
        شائعة في العربية المصرية الدارجة والأوسط شرقية.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "لمّة «رقم التليفون» تستخدم «تليفون» المُعرَّب الدخيل بدلاً من «هاتف» الفصيح"
      - "كلتا اللمّتين مفتقرتان إلى تشكيل كامل في السجل الحالي"
      - "الحاكم المباشر (awn4-06804229-n: إشارة/علامة) غير ملائم دلالياً؛ رقم الهاتف ليس «فعلاً أو إيماءة غير لفظية» بل رمز رقمي تعريفي"
      - "التعريف الإنجليزي يحتوي خطأً نحوياً: «the number is used» بدلاً من «the number that is used» أو «a number used»"
      - "التعريف العربي الحالي مقتضب ولا يُبيّن طبيعة الرقم الرقمية ولا وظيفته التعريفية"
    observations: >
      المجموعة الترادفية تضم لمّتين إضافيتين متباينتين في اختيار المكوّن
      الثاني (هاتف فصيح / تليفون معرَّب) مع تطابق تام في الدلالة. كلاهما
      مركّب إضافي شفاف. معجم الصواب اللغوي يُصرّح بأن «هاتف» هو الأفصح
      وأولى بالاستخدام، في حين «تليفون» صحيحة مقبولة. موسوعة الكهرباء IEC
      60050 توثّق نمط «رقم ... الهاتفي» لمفاهيم الأرقام الهاتفية، مما يُقوّي
      الأساس الاصطلاحي لكلا اللمّتين. المرشح الأعمى «رقم هاتفي» منسجم مع
      هذا النمط لكنه مكرّر. «ترقيمة هاتفية» بحاجة إلى تثبيت معجمي.
      «معرف هاتفي» موثّق في ARABTERM لكنه مخصص للسياق الحاسوبي. «نمرة الهاتف»
      دارجة وغير فصيحة.


# ══════════════════════════════════════════════════════════════
# المرحلة ٢: جمع الأدلة
# استعلامات نُفِّذت: ٤ استعلامات
#   ١. مطابقة دقيقة دفعية (اللمّات الموجودة + المرشحات)
#   ٢. جسر إنجليزي (phone number / telephone number / number)
#   ٣. FTS عربي (رقم / هاتف / تليفون)
#   ٤. مقاييس اللغة (جذرا رقم وهتف)
# ══════════════════════════════════════════════════════════════
stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ───────────────────────────────────────

    - lemma: "رقم التليفون"
      expands:
        - text: >
            «تِليفون — الرأي: مرفوضةٌ؛ السبب: لاستخدام مصطلح أجنبي مع وجود ما
            يقابله في العربية. المعنى: هاتف أو مِسرَّة. الصواب والرتبة:
            -استعملت الهاتفَ [فصيحة] -استعملت التِّلِيفون [صحيحة]
            -استعملت المِسَرَّة [فصيحة مهملة]. التعليق: كلمة هاتف هي الشائعة
            الآن على مستوى العالم العربي، وهي أولى بالاستخدام. أما كلمة
            «تليفون» فكلمة معربة تنافس الكلمة الأولى في الشيوع، وقد أدخلها
            مجمع اللغة المصري في معجمه الوسيط.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر (entry 852034)"
          addition: >
            يُثبت القبول الرسمي لـ«تليفون» المعرَّب، غير أن «هاتف» الفصيح
            هو الأولى اصطلاحاً. مكوّن «رقم» نفسه غير مُشكَّل في السجل.
        - text: >
            «تليفون [مفرد]، ج تليفونات: هاتف، تِلِفون، جهاز كهربيّ ينقل
            الأصوات من مكان إلى آخر "تُنجَز الكثير من الأعمال بواسطة
            التليفون".»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (entry 857318)"
          addition: "يُثبت إدراج «تليفون» معجمياً مع شيوع استخدامه في الخطاب العام."
        - text: >
            «رقم الدليل الهاتفي — directory number; catalogue number
            (term deprecated)»
          source: "موسوعة الكهرباء IEC 60050 — مسرد الإعلام والتواصل (entry 520404)"
          addition: >
            يُثبت أن المعيار الدولي IEC 60050 يستخدم نمط «رقم + ... + الهاتفي»
            للأرقام التعريفية الهاتفية، مما يُقوّي البنية التركيبية للمّة.

    - lemma: "رقم الهاتف"
      confirm:
        - text: >
            «هاتف — [فصيحة]؛ الصواب والرتبة: -استعملت الهاتفَ [فصيحة].
            كلمة هاتف هي الشائعة الآن على مستوى العالم العربي، وهي أولى
            بالاستخدام.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر (entry 852034)"
      expands:
        - text: >
            «رقم الدليل الهاتفي — directory number; catalogue number
            (term deprecated)»
          source: "موسوعة الكهرباء IEC 60050 — مسرد الإعلام والتواصل (entry 520404)"
          addition: >
            يُثبت أن نمط «رقم الدليل الهاتفي» يُعادل directory number وهو
            مرادف قريب لـphone number في السياق التلفوني الاتصالاتي.
        - text: >
            «هَتَفَ — الهاءُ والتاءُ والفاءُ: كلمةٌ واحدةٌ، هي الهَتْفُ:
            الصَّوتُ. وهَتَفَتِ الحمامةُ: صوَّتَتْ تَهتِفُ.»
          source: "مقاييس اللغة لابن فارس (entry 989327)"
          addition: >
            يكشف الجذر الأصلي لـ«هاتف»: الهاتف هو الصوتُ المنادي/الصائح،
            وهو توصيف دقيق للجهاز الناقل للصوت.

    # ── مرشحات المرحلة ١ ─────────────────────────────────────

    - lemma: "رَقْمٌ هَاتِفِيٌّ"
      expands:
        - text: >
            «رقم الدليل الهاتفي — directory number; catalogue number
            (term deprecated)»
          source: "موسوعة الكهرباء IEC 60050 (entry 520404)"
          addition: >
            الصيغة الوصفية «...الهاتفي» الواردة في المعيار الدولي تُثبت
            إنتاجية الصفة «هاتفي» في السياق الاصطلاحي. غير أن المعيار اختار
            المركّب الإضافي المُطوَّل لا الوصفي.

    - lemma: "تَرْقِيمَةٌ هَاتِفِيَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "مُعَرِّفٌ هَاتِفِيٌّ"
      contradicts:
        - text: >
            «مُعَرِّف — معطياتٌ تُمكِّن نظاماً حاسوبياً من التعرف على
            المستعمل أو المشترك. [translation_en: log in]»
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (entry 484858)"
          conflict: >
            «مُعَرِّف هاتفي» في ARABTERM يختص بتعريف المستخدم في الأنظمة
            الحاسوبية (login)، لا برقم الهاتف نفسه. الاستخدام في هذا
            السياق يُولّد اشتراكاً لفظياً مع المصطلح التقني المُثبَّت.

    - lemma: "نُمْرَةُ الهَاتِفِ"
      contradicts:
        - text: >
            «النُّمْرَةُ، بالضم: النُّكتةُ من أيِّ لَوْنٍ كان. والأنمرُ: ما
            فيه نُمرةٌ بيضاءُ وأخرى سوداء.»
          source: "القاموس المحيط للفيروزآبادي (entry 801811)"
          conflict: >
            «نمرة» في المعاجم العربية الكلاسيكية تدل على اللون/البقع في
            الحيوان والكساء، لا على «رقم» بالمعنى العددي. الاستخدام العامي
            للمعنى العددي دخيل مستعار من numéro الأجنبية.
        - text: >
            «النَّمِرة: هي كساءٌ مخطَّط مُلوَّن.»
          source: "التعريفات الفقهية للبركتي (entry 836226)"
          conflict: "تؤكد الدلالة الفصيحة المحدودة بالكساء الملوّن."


