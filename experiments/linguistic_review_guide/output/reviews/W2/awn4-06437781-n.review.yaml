# المرحلة ٣: التحليل اللغوي للمّات
# ══════════════════════════════════════════════════════════════
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى الموجودة ──────────────────────────────
    - lemma: "رقم التليفون"
      decision: confirmed
      decision_reason: >
        مركّب إضافي شائع الاستخدام في العربية المعاصرة؛ «تليفون» مُدرَجة في
        معجم الوسيط وصرَّح معجم الصواب بقبولها (صحيحة). المركّب وحدة
        اصطلاحية ثابتة مستقاة من الخطاب اليومي والإعلامي والرسمي المصري
        والشامي. لا يجوز حذفها لأنها تمثّل التنوع المعجمي المشروع الذي
        تُوثّقه AWN، وإن كان الأفصح «رقم الهاتف».
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يستخدم المكوّن «التليفون» المعرَّب المرتبط بالتقليد المصري والشامي؛
        يُفضَّل في السياقات الشعبية والإعلامية العامية الرسمية، بينما
        «رقم الهاتف» أوثق فصاحةً وأشيع في الخطاب الرسمي الموحَّد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَقْمُ التِّلِيفُون"

    # ── اللمّة الثانية الموجودة ─────────────────────────────
    - lemma: "رقم الهاتف"
      decision: confirmed
      decision_reason: >
        مركّب إضافي فصيح معياري؛ «هاتف» مُثبَّت في معجم الوسيط ومقاييس
        اللغة وكتب الصواب اللغوي باعتباره الأفصح. يتوافق مع نمط موسوعة
        IEC 60050 (رقم الدليل الهاتفي). اجتاز اختبار السكّ الاصطلاحي:
        لا يمكن إبدال «الهاتف» بـ«الجوّال» أو «المحمول» في هذا السياق إلا
        بتغيير الدلالة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يستخدم «الهاتف» الفصيح المُوحَّد على مستوى الخطاب العربي الرسمي
        والتقني؛ هو اللمّة المرجعية المعيارية في AWN.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَقْمُ الْهَاتِفِ"

    # ── مرشحات المرحلة ١ ─────────────────────────────────────
    - lemma: "رَقْمٌ هَاتِفِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        مكرّر دلالياً مع «رقم الهاتف» المُثبَّت؛ المركّب الوصفي أقل
        طبيعيةً في العربية مقارنةً بالإضافي. لا تُضيف قيمةً تمييزية
        للمجموعة.

    - lemma: "تَرْقِيمَةٌ هَاتِفِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا يوجد توثيق معجمي لـ«ترقيمة» بمعنى رقم أو رمز عددي. «تَفْعِيلة»
        على هذا الجذر غير مُثبَّتة في المعاجم المعاصرة. فشل اختبار التثبيت
        المعجمي.

    - lemma: "مُعَرِّفٌ هَاتِفِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        موثَّق في ARABTERM بمعنى «بيانات تعريف المستخدم في النظام الحاسوبي»
        (log in). استخدامه لـ«رقم الهاتف» يُولّد اشتراكاً لفظياً مع المصطلح
        التقني المُثبَّت ويُخالف مبدأ التمييز الدلالي.

    - lemma: "نُمْرَةُ الهَاتِفِ"
      source: stage1
      decision: removed
      decision_reason: >
        «نُمْرَة» في الفصيح تعني البقعة اللونية أو الكساء الملوّن. استخدامها
        بمعنى «رقم» ظاهرة دارجة عامية مستعارة من numéro الأجنبية. لا تجتاز
        اختبار اللهجية ولا اختبار الفصاحة.


