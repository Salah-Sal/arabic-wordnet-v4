stage4_content:
  definition:
    current: "الرقم المستخدم للاتصال بهاتف معين"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقتضب ومبهَم: «الرقم» لا تُبيَّن فيه طبيعته
        الرقمية/التسلسلية؛ «الاتصال» يحتاج إلى سياق تلفوني أوضح؛ «هاتف
        معين» يُغفل وظيفة التخصيص والتعريف. فضلاً عن ذلك تغيب الفصيلة
        القريبة (genus) الواضحة. يُضاف تعريف موسوعي يُبيّن البنية التقنية.
    authored:
      - type: terminological
        text: >
          تَسَلْسُلٌ رَقْمِيٌّ مُخَصَّصٌ لِخَطٍّ هَاتِفِيٍّ أَوِ اشْتِرَاكٍ
          بِعَيْنِهِ فِي شَبَكَةِ الِاتِّصَالَاتِ، يُدْخَلُ لِإِجْرَاءِ
          الِاتِّصَالِ بِذَلِكَ الْخَطِّ أَوِ الِاشْتِرَاكِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          يُخصَّص لكل خط هاتفي رقمٌ فريد يميّزه عن سائر الخطوط في الشبكة؛
          يتألف من سلسلة أرقام تشمل رمز الدولة ورمز المنطقة ورقم الاشتراك
          المحلي، وتُحدِّد معاييرُ الاتحاد الدولي للاتصالات (ITU-T E.164)
          تنسيقَه الدولي الأقصى باثني عشر رقماً
