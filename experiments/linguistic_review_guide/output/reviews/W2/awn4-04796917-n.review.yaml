# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-04796917-n
# ili: i62176
# lemmas_en: wholesomeness
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «فَائِدَة صِحِّيَّة» عبارةٌ وصفيةٌ حرَّة وليست مصطلحًا مسكوكًا؛ إذ تدل على «فائدة صحية» (مفرد يُعدّ) لا على الخاصية المجرَّدة المعبَّر عنها بـwholesomeness."
      - "لمّة «صَلَاح» صحيحة بناءً على الجذر (صلح = ضد الفساد) لكنها أعمّ من المفهوم المطلوب إذ تغطي الاستقامة الأخلاقية والدينية أيضًا."
      - "التعريف الحالي يستعمل «بشكل عام» وهو تعبيرٌ ركيك يحاكي الترجمة الحرفية للإنجليزية generally، ويُستحسن استبداله بصياغة معجمية أقوم."
    observations: >
      المجموعة الترادفية تمثّل مفهومًا مجرَّدًا هو «صفة كون الشيء نافعًا للصحة وسليمًا من الضرر».
      اللمّتان الحاليتان غير متكافئتَين: «صَلَاح» لفظٌ قديم راسخ يدل على خلوص الشيء من الفساد،
      وقد وُظِّف في سياقات الطعام والثمر؛ أما «فَائِدَة صِحِّيَّة» فتعبيرٌ توصيفي لا يتمتع
      بثبات اصطلاحي. من المرتقب وجود مصطلح أكثر تخصصًا في معاجم التغذية والطب.

  blind_candidates:
    - lemma: "صِحِّيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الجذر «صحح» على صيغة النسبة المصدرة بـ«-يَّة»؛ بنية قياسية معتمدة
        مجمعيًا لصوغ مفاهيم مجرَّدة (كرهبانية، جاهلية). تُعبِّر مباشرةً عن «صفة الصحة
        والسلامة» المحورية في التعريف، وتتميز بالاشتقاقية القوية من مفردة «الصحة» الواردة
        صراحةً في التعريف.
    - lemma: "نَفَاعَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر «نفع» على وزن «فَعَالَة» الذي يدل على الصفة الجوهرية للشيء
        (كشجاعة وفصاحة). يُعبِّر عن «صفة النفع والإفادة» وهو مكوّن أساسي في التعريف
        «مفيداً». يتفادى الاشتراك اللفظي لأن المادة نفع تنتهج معنى ثابتًا.
    - lemma: "طِيبِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «طيب» (صافٍ، لا يُؤذي، نافع) + «-يَّة». الجذر «طيب» ورد في
        القرآن الكريم بمعنى الحلال النافع الخالي من الضرر ﴿كُلُوا مِمَّا فِي الأَرْضِ
        حَلالاً طَيِّبًا﴾. يُجسِّد الجانب الإيجابي من المفهوم (جيد ونافع).
    - lemma: "صَلَاحِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «صلح» + «-يَّة»، يدل على «صفة الصلاح والملاءمة». يقابل
        في دلالته «quality of being good/fit» وهو جزء من التعريف المعطى، إذ «جيد»
        مقابل «good» تندرج ضمن معجم مادة صلح.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────
    - lemma: "صَلَاح"
      confirm:
        - text: "«(الصّلاح) الاسْتقَامَة والسلامة من الْعَيْب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الاستقامة السلامة من العيب»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«لا يصلُح بيعُ الثَّمر حتَّى يتبينَ صلاحُهُ»"
          source: "المعجم الكبير (مجمع اللغة العربية) — شاهد حديثي"
        - text: "«الصَّادُ وَاللَّامُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الْفَسَادِ. يُقَالُ: صَلُحَ الشَّيْءُ يَصْلُحُ صَلَاحًا»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«نقيضُ الفساد الاسْتِقَامَةُ السَّلامَةُ مِنَ العَيْب نُضْجُ الثَّمَر»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "إضافة معنى «نضج الثمر» يدعم ارتباط اللمة بجودة الغذاء وصلاحيته، وهو قريب من مفهوم wholesomeness في سياق الطعام."
        - text: "«الصلاح: ضد الفساد، ويختصان في أكثر الاستعمال بالأفعال، وقوبل في القرآن تارة بالفساد وأخرى بالتشبيه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُبيّن أن الصلاح مقابل الفساد في الاستعمال القرآني، مما يرسّخ مفهوم «الخلوص من الضرر»."
        - text: "«هو سلوك طريق الهدى. وقيل هو استقامة الحال على ما يدعو إليه العقل والشرع»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يكشف عن البُعد الأخلاقي-الديني للصلاح، وهو امتداد دلالي يُميّزه عن المفهوم الصحي الخالص."

    - lemma: "فَائِدَة صِحِّيَّة"
      evidence_status: "no_material_found"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────
    - lemma: "صِحِّيَّة"
      confirm:
        - text: "«خاصية كون الشيء مأموناً أو صحياً»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM — translation_en: wholesomeness"
        - text: "«صحيّ: يعطي الصحة ولا ينطوي على مخاطرة»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — translation_en: wholesome"

    - lemma: "نَفَاعَة"
      evidence_status: "no_material_found"

    - lemma: "طِيبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "صَلَاحِيَّة"
      contradicts:
        - text: "«الاتِّساق في عملٍ ما — الصلاحية للعمل: حسن التهيُّؤ له — الصلاحية لذِي السلطان: مَدَى ما يخوِّله القانون التصرف فيه»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "الصلاحية تعني الأهلية والكفاءة القانونية/المهنية والاستحقاق، لا «صفة كون الشيء نافعًا للصحة»."
        - text: "«(فى التَّربية وعلم النَّفْس) Aptitude: قدرةٌ طبيعيةٌ على اكتسابِ أنماطِ معينةٍ من السلوكِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "الصلاحية في المعاجم الحديثة راسخة بمعنى الأهلية والسلطة، لا الجودة الصحية."


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "صَلَاح"
      decision: confirmed
      decision_reason: >
        صَلَاح لفظٌ تراثي عريق (الصاد واللام والحاء = خلاف الفساد في مقاييس ابن فارس) يصلح
        للتعبير عن «صفة كون الشيء سليمًا خاليًا من الضرر». ويعضده الشاهد الحديثي
        «لا يصلح بيع الثمر حتى يتبين صلاحه» الذي يربطه ربطًا مباشرًا بجودة الغذاء
        وصلاحيته للاستهلاك. وهو مفردة أحادية مستوفية لشروط الاشتقاقية والتراثية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صَلَاح لفظٌ أشمل وأوسع دلالةً؛ يُستعمل في السياقات العامة (الصلاح الأخلاقي، صلاح
        المجتمع، نضج الثمر وصلاحه للأكل). أما في سياق هذه المجموعة فيُؤدي معنى «الخلوص
        من العيب والفساد» الذي هو جوهر wholesomeness، غير أنه لا يحمل الدلالة الصحية
        التخصصية بوضوح كامل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَلَاح"

    - lemma: "فَائِدَة صِحِّيَّة"
      decision: removed
      decision_reason: >
        تعبيرٌ توصيفي حر لا يجتاز اختبار السكّ: يمكن إبدال «فائدة» بـ«نفع» أو «مصلحة» وتبقى
        الجملة وصفًا صحيحًا، مما يكشف أنها ليست وحدة معجمية ثابتة. فضلًا عن ذلك تدل
        «فَائِدَة» على نفع مفرد قابل للعدّ (benefit)، لا على الخاصية المجرَّدة للمفهوم
        (wholesomeness كاسم مجرد). لم يُعثر على قيد معجمي لهذا المركب.

    - lemma: "صِحِّيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصدر صناعي قياسي من الجذر «صحح»، معتمد مجمعيًا وموثّق في المعجم الموحد لتقانات
        الأغذية (ARABTERM) بالتعريف الدقيق «خاصية كون الشيء مأموناً أو صحياً» وبالترجمة
        المباشرة wholesomeness. يخضع للتصريف الكامل ويقبل لام التعريف والجمع والنسبة.
        يتوافق مع المفهوم العلمي للمصطلح في سياق الغذاء والصحة العامة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صِحِّيَّة مصطلحٌ تخصصي أضيق دلالةً من صَلَاح؛ يدور حول «السلامة من الضرر
        والنفع الصحي» تحديدًا في مجال الغذاء والتغذية. لا يحمل الامتداد الأخلاقي أو الديني
        الذي يحمله صَلَاح. يُفيد في السياقات العلمية والتقنية أكثر من الاستعمال الأدبي.
      actions:
        - command: create_entry
          params:
            lemma: "صِحِّيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نَفَاعَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على قيد معجمي للمفردة في أيٍّ من مصادر قاعدة البيانات. وإن كان الاشتقاق
        صحيحًا من حيث الوزن (فَعَالَة من نفع)، إلا أن غياب التوثيق يجعل سكَّها جديدًا غير
        مضمون القبول، لا سيما أن البديل المصطلحي المدعوم بالأدلة (صِحِّيَّة) متاح.

    - lemma: "طِيبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي لهذا المصدر الصناعي. وبينما يحمل جذر «طيب» دلالةً مناسبة،
        يظل سكّ «طِيبِيَّة» مقترحًا جديدًا غير مسجَّل، وقد وُجد البديل الأوثق توثيقًا.

    - lemma: "صَلَاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        تعارضت الأدلة المعجمية بشكل قاطع مع المعنى المطلوب: «الصلاحية» راسخة في المعاجم
        الحديثة بمعنى الكفاءة القانونية والأهلية المهنية (authority / validity / aptitude)،
        لا «صفة كون الشيء نافعًا للصحة». استعمالها في سياق المجموعة سيُفضي إلى لبس دلالي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة كون الشيء مفيداً وجيداً للصحة بشكل عام"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ركيك: «بشكل عام» ترجمة حرفية لـ generally غير ملائمة لأسلوب المعجم.
        كما أن «مفيداً وجيداً» تكرارٌ يفتقر إلى الضبط الاصطلاحي. يحتاج التعريف إلى بنية
        أوضح (جنس قريب + فصل نوعي) بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: "خاصِيَّةُ كَوْنِ الشيءِ نافعًا للصِّحَّةِ سليمًا منَ الضَّرَرِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما كانَ مُوافِقًا للصِّحَّةِ وَمُعِينًا عليها خاليًا منَ الفَسادِ والأذَى"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خاصِيَّةُ كَوْنِ الشيءِ نافعًا للصِّحَّةِ سليمًا منَ الضَّرَرِ"

  examples:
    per_lemma:
      - lemma: "صَلَاح"
        examples:
          - text: "يُشترط في الغذاءِ المُعبَّأِ إثباتُ تاريخِ صَلاحِهِ وانعدامِ أيِّ مُؤشِّرٍ على فسادِه."
            type: usage
      - lemma: "صِحِّيَّة"
        examples:
          - text: "تُعدُّ صِحِّيَّةُ الغذاءِ المتوازنِ ركيزةً أساسيَّةً في معايير سلامة الأغذية التي تُحدِّدها منظمة الصحة العالمية."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُشترط في الغذاءِ المُعبَّأِ إثباتُ تاريخِ صَلاحِهِ وانعدامِ أيِّ مُؤشِّرٍ على فسادِه."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعدُّ صِحِّيَّةُ الغذاءِ المتوازنِ ركيزةً أساسيَّةً في معايير سلامة الأغذية التي تُحدِّدها منظمة الصحة العالمية."


