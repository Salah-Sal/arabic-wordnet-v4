# ═══════════════════════════════════════════════════════════
# مراجعة AWN4 — awn4-92443586-n  (injectivity / التباين الرياضي)
# Pipeline v2 — 5 مراحل
# ═══════════════════════════════════════════════════════════

stage1_review:

  assessment:
    concerns:
      - "اللمّتان (تباين، خاصية التباين) كلتاهما بدون تشكيل كامل — تشكيل إلزامي."
      - "تباين مصطلح متعدد الدلالات: يُستخدم في الإحصاء للـ(variance)، وفي المنطق للتباين الكلي/الجزئي، وفي الإنجليزية/الهندسة للـ(contrast/anisotropy) — يحمل خطر الاشتراك اللفظي مع مصطلح الحقن الرياضي."
      - "خاصية التباين عبارة وصفية حرة لا وحدة معجمية مسكوكة — تفشل اختبار السكّ (يمكن إبدال 'خاصية' بـ'صفة' أو 'ميزة' وتبقى الجملة صالحة)."
      - "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) يُثبّت 'تطبيق متباين' للدالة الحاقنة (injection) لا 'تباين' للخاصية المجردة (injectivity)."
      - "لا يوجد في قواعد البيانات المعجمية مدخل عربي صريح يُقابل 'injectivity' بمعناها الرياضي المحض."
    observations: >
      المجموعة تُعبِّر عن مفهوم رياضي دقيق هو خاصية الحقن (injectivity): صفة الدالة
      التي تُنتج صوراً مختلفة للعناصر المختلفة في مجالها. المصطلح العربي الأكثر رسوخاً
      في المعاجم الموحدة هو «تطبيق متباين» (injection بوصفه دالة)، وليس «تباين» بوصفه
      خاصية مجردة. تشتقّ «تباين» من الجذر ب-ي-ن (البُعد والافتراق) وهو اشتقاق دالٌّ
      لكنّه يُفضي إلى تنافس دلالي شديد مع الاستخدام الإحصائي (variance) والاستخدام
      المنطقي (التباين الكلي/الجزئي). اللمّة الأولى تحتاج تشكيلاً، والثانية تحتاج حذفاً.

  blind_candidates:
    - lemma: "الحَقْنِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بـ(-يَّة) من الجذر ح-ق-ن الذي أصله «جمع الشيء وحبسه».
        الاشتقاق يُحيي المعنى العلمي القائم على مقابلة المصطلح الدولي «injection»
        (الحقن) بالمعنى الرياضي. الوزن «فُعلِيَّة» يُنتج اسم خاصية مناسباً
        لوظيفة وصف صفة مجردة للدوال.
    - lemma: "التَّفَرُّدِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «التَّفَرُّد» (وزن تَفَعُّل من جذر ف-ر-د). الجذر «فرد» يدلّ
        على الوحدة والانفراد، وهو يُعبِّر عن الخاصية الجوهرية للحقن: أن كل صورة
        لا تُقابلها إلا عنصر واحد. الوزن «تَفَعُّليَّة» منتج في المصطلحية المعاصرة.
    - lemma: "الأُحادِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «أُحادي» (نسبة إلى أُحاد). الجذر و-ح-د يدلّ على
        الانفراد (مقاييس اللغة: «أصل يدلّ على الانفراد»). يُعبِّر عن صفة «واحد
        لواحد» (one-to-one) التي تُميِّز الحقن.
    - lemma: "الانْفِرادِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «الانفراد» (مصدر انفعال من ف-ر-د). يُعبِّر عن كون كل عنصر
        في المدى «منفرداً» بصورته لا يُشاركه فيها عنصر آخر من المجال. أكثر دقةً
        من «التفرديّة» بإبراز البُعد العلائقي.


