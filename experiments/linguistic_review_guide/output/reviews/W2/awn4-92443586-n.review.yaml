stage3_analysis:

  per_lemma:

    - lemma: "تباين"
      decision: confirmed
      decision_reason: >
        رغم تعدد دلالاته (variance/contrast/divergence)، يستند «تباين» إلى المصطلح
        الموحد «تطبيق متباين» (injection) في المعجم الموحد للرياضيات، فالمصدر الفعلي
        «تباين» يُمثِّل الخاصية المجردة اشتقاقاً صحيحاً. القرار بالإبقاء مشروط
        بإضافة التشكيل الكامل (تَبَايُن) لإزالة الإبهام الصرفي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُشير إلى الخاصية من منظور الدالة ذاتها: كون عناصر المجال متباينةَ الصور،
        أي غير مُنهارة في قيمة واحدة — وهو المنظور الاشتقاقي الأصيل من الجذر
        (البُعد والافتراق). يختلف عن 'خاصية التباين' من حيث إنه لمّة مفردة حقيقية
        لا عبارة وصفية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبَايُن"

    - lemma: "خاصية التباين"
      decision: removed
      decision_reason: >
        فشلت اختبارَيْ السكّ والتثبيت المعجمي: (أ) يمكن إبدال «خاصية» بـ«صفة» أو
        «ميزة» وتبقى العبارة صالحة وصفياً → ليست مصطلحاً مسكوكاً. (ب) لا وجود
        لها في أيٍّ من المعاجم الموحدة أو الكلاسيكية. (ج) المجموعة تحتاج لمّة
        معجمية واحدة لا عبارة وصفية حرة — وتلك اللمّة هي «تَبَايُن» وحده.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الحَقْنِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد مُثبَّت في المعاجم للمصطلح بالمعنى الرياضي. الجذر ح-ق-ن محتجز في
        المعاجم الموحدة للحقن الطبي والجيولوجي والهندسي (injection بمعناه المادي)،
        ولا يمكن نقله للمعنى الرياضي المجرد دون التباس شديد مع «قابلية الحقن»
        الجيولوجية وسائر مركبات الحقن الحرفية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "التَّفَرُّدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «التفرد» مُثبَّت بمعنى uniqueness وsingularity ومحتجز في الاستخدام التقني
        الحديث لـ«طفرة الذكاء الاصطناعي» (Singularity). استخدامه للحقن الرياضي
        سيُوقعه في اشتراك لفظي مضاعف، فضلاً عن أن مفهوم «التفرد» أعمّ من
        الحقن (كل دالة حاقنة تُفرِد الصور لكن ليس كل تفرُّد حقناً).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "الأُحادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الشاهد الوحيد المُثبَّت يُحيل على «monism» (الفلسفة). استخدامها للحقن
        سيُنافس هذا المعنى الراسخ في المعاجم الموحدة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الانْفِرادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي يُثبِّت هذا المصطلح في أي سياق. وإن كانت الاشتقاقية
        سليمة لغوياً، فإن القواعد الحاسمة تمنع إضافة مصطلح بدون شاهد مُثبَّت.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


