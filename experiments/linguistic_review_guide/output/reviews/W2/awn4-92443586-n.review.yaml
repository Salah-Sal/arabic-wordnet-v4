stage2_evidence:

  per_lemma:

    - lemma: "تباين"
      confirm:
        - text: >
            «التّباين: [في الانكليزية] Difference، divergence، gap [في الفرنسية]
            Difference، divergence، écart. يرادف المباينة عند المحاسبين وكذا عند
            المنطقيين، وكذا الحال في المتباين فإنه مرادف للمباين.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
        - text: >
            «التباين: ما إذا نسب أحد الشيئين إلى الآخر لم يصدق أحدهما على شيء
            مما صدق عليه الآخر، فإن لم يصدقا على شيء أصلاً فبينهما تباين كليّ
            كالإنسان والفرس، وإن صدقا في الجملة فبينهما تباين جزئي.»
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: >
            «تطبيق متباين — injection» [مدخل في معجم الرياضيات والفلك الموحد]
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك — ALECSO (1990)"
          addition: "يُثبِّت أن 'متباين' هو الوصف العربي المعتمد للدالة الحاقنة؛ مما يُسوِّغ اشتقاق 'تباين' للخاصية المجردة، غير أنه يُثبِّته للدالة لا للخاصية ذاتها."
      contradicts:
        - text: "«تَبَايُن — variation»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك — ALECSO (1990)، قسم الرياضيات"
          conflict: "المعجم ذاته يستخدم 'تباين' بمعنى 'variation' (تغاير/تنوع)، لا 'injectivity'؛ مما يكشف تعارضاً داخلياً."
        - text: "«تَبَايُن — variance: مربع الانحراف المعياري لمتحول»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية — ALECSO"
          conflict: "في الإحصاء والهندسة المدنية 'تباين' = variance (التباين الإحصائي)، وهو مصطلح راسخ قد يتعارض مع الاستخدام الرياضي الحاقني."
        - text: "«تبايُن — Covariance: مقياس لمدى التباين بين متغيرين غير مرتبطين ببعضهما»"
          source: "مسرد البيانات والذكاء الاصطناعي — ALECSO (Data and AI Glossary)"
          conflict: "في السياق التقني الحديث 'تباين' مُنزَع للـcovariance والـvariance، مما يُنشئ تنافساً دلالياً حاداً مع المعنى الحاقني."

    - lemma: "خاصية التباين"
      evidence_status: "no_material_found"

    - lemma: "الحَقْنِيَّة"
      evidence_status: "no_material_found"

    - lemma: "التَّفَرُّدِيَّة"
      expands:
        - text: "«تفرُّد — uniqueness»"
          source: "المعجم الموحد لمصطلحات الجغرافيا والتاريخ — ALECSO"
          addition: "يُثبِّت أن 'التفرد' يُستخدم بمعنى uniqueness، وهو مفهوم مجاور للحقن (كل صورة لها صورة مقعر تفردية)، لكنه أعمّ منه."
        - text: "«تفرُّد — Singularity»"
          source: "مسرد البيانات والذكاء الاصطناعي — ALECSO"
          addition: "في السياق التقني الحديث 'التفرد' = طفرة الذكاء الاصطناعي (AI Singularity)، مما يُنشئ اشتراكاً لفظياً مع المعنى الرياضي."
      contradicts:
        - text: "«تفرُّد — singularity: انظر طفرة الذكاء»"
          source: "مسرد البيانات والذكاء الاصطناعي — ALECSO"
          conflict: "المصطلح محتجز للـSingularity في الذكاء الاصطناعي وللـsingularity الرياضية (النقاط الشاذة)، لا للحقن."

    - lemma: "الأُحادِيَّة"
      contradicts:
        - text: "«أحادية — monism»"
          source: "المعجم الموحد لمصطلحات المياه — ALECSO"
          conflict: "المصطلح الوحيد المُثبَّت لـ'أحادية' في المعاجم الموحدة هو 'monism' (المذهب الأحادي الفلسفي)، وهو معنى مختلف كلياً."

    - lemma: "الانْفِرادِيَّة"
      evidence_status: "no_material_found"


