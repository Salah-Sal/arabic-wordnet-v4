    assessment:
      decision: revise
      reason: >
        ثلاث مشكلات: (أ) عبارة «المجال المقابل (أو المدى)» مُشوِّشة — «المجال المقابل»
        ليس مصطلحاً رياضياً معياريًا؛ الصواب «المدى». (ب) «حالة أو صفة» غير محدد،
        يفضّل «صفة» وحدها للإيجاز الاصطلاحي. (ج) التعريف يصف الخاصية من جهة المدى
        (لكل عنصر في المدى صورة عكسية واحدة على الأكثر) وهو صحيح رياضياً لكن لا
        يُبرز التعريف الاكتمالي: الدالة حاقنة إذا كان «إذا ساوت الصورتان تساوى
        الأصلان» — وهو الأكثر وضوحاً وشيوعاً في المراجع الرياضية العربية.
