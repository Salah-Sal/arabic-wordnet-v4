step0_evidence:
  per_lemma:
    - lemma: "حبيب"
      confirm:
        - text: "«(الحبيب) المحبوب والمحب»"
          source: "المعجم الوسيط"
        - text: "«المُحِبُّ المَحْبُوبُ»"
          source: "المعجم الكبير"
      expands:
        - text: "«الرفيق»"
          source: "المعجم الكبير"
          addition: "يدل على معنى الرفقة كبعد دلالي إضافي للحبيب."
      peripheral_observations:
        - "حبيب بن أوس (أبو تمام): اسم لشاعر مشهور."
        - "حبيب: بلد من أعمال حلب."

    - lemma: "عاشق"
      confirm:
        - text: "«عَاشِق: المحب أشد الحب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      peripheral_observations:
        - "شلل العشاق: مصطلح طبي."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "محب"
      source_section: "step9_specialized"
      evidence_citation: "«مُحِبّ: العاشق والشغوف بالشيء المولع به» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "اسم فاعل مباشر يعبر عن طرف المحب في العلاقة."
    - lemma: "محبوب"
      source_section: "step9_specialized"
      evidence_citation: "«مَحْبُوب: المودود» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "اسم مفعول مباشر يعبر عن طرف المحبوب في العلاقة، وهو مشمول في تعريف المجموعة."
  knowledge_candidates:
    - lemma: "عشيق"
      justification: "صيغة مبالغة على وزن فعيل (عشيق) تستخدم كمرادف للعاشق والمعشوق كما ورد في المعجم الوسيط، وهي شائعة الاستعمال في الأدب."
  generation_notes: "تم التركيز على الاشتقاق من الجذور (ح ب ب) و (ع ش ق) لتغطية طرفي العلاقة (المحب والمحبوب)."

step1_lemma_validation:
  per_lemma:
    - lemma: "حبيب"
      decision: confirmed
      decision_reason: "مصطلح مركزي مؤكد في المعاجم القديمة والحديثة يغطي طرفي العلاقة (المحب والمحبوب)."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ الأكثر عمومية وشمولاً، يطلق على المحب والمحبوب معاً."
      example: "أتهجر ليلى بالفراق حبيبها، وما كان نفسا بالفراق تطيب."

    - lemma: "عاشق"
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على من أفرط في الحب، وهو ركن أساسي في مفهوم lover."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على شدة العاطفة (العشق) وغلبة الشوق، وهو في اللغة للمحب حصراً (جهة الصدور)."
      example: "قَالَ العَاشِقُ لِمَحْبُوبَتِهِ كَلِماتٍ مِنَ الشِّعْر."

    - lemma: "محب"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل فصيح ومباشر يؤدي معنى (person who loves) بدقة عالية."
      step05_citation: "«مُحِبّ: العاشق والشغوف بالشيء» — موسوعة السلطان قابوس"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اسم فاعل قياسي، يركز على الفعل (الحب) والجهة الصادر عنها، وهو أقل حدة من 'عاشق'."
      example: "إِنَّهُ مُحِبٌّ لِلخَيْرِ وَلِلنَّاس."
      actions:
        - command: create_entry
          params:
            lemma: "محب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09645472-n"

    - lemma: "محبوب"
      source: step05
      decision: confirmed
      decision_reason: "اسم مفعول فصيح يؤدي معنى (person who is loved) المذكور في التعريف."
      step05_citation: "«مَحْبُوب: المودود» — موسوعة السلطان قابوس"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اسم مفعول، يركز على جهة الوقوع (من يتلقى الحب)، وهو مكمل لمعنى المجموعة."
      example: "كانَ الرَّسُولُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَحْبُوبًا عِنْدَ أَصْحَابِهِ."
      actions:
        - command: create_entry
          params:
            lemma: "محبوب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09645472-n"

    - lemma: "عشيق"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح ورد في المعاجم (الوسيط) بمعنى العاشق والمعشوق، وله حضور قوي في الأدب العربي."
      step05_citation: "«العَشِيقُ: العاشق والمعشوق» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "صيغة فعيل، قد تحمل دلالة على طول الملازمة أو كثرة العشق، وفي الاستعمال الحديث قد توحي بعلاقة خارج إطار الزواج (paramour)."
      example: "لِكُلِّ عَشِيقٍ مَعْشُوقَة."
      actions:
        - command: create_entry
          params:
            lemma: "عشيق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09645472-n"

  synset_flags:
