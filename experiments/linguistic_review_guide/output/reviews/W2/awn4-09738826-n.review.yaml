stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة حرفية لعبارة 'member of' باستخدام 'عضو في'، والأفصح استخدام 'فرد من'."
    observations: "المفهوم يشير إلى الفرد المنتمي للقومية الكردية، واللمة الحالية صحيحة ومناسبة."
  blind_candidates:
    - lemma: "كُرْدِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الكُرد، وهو الاسم الدال على الفرد المنتمي إلى هذا الشعب."
    - lemma: "كُرْد"
      generation_method: ishtiqaq
      justification: "اسم الجنس الجمعي الدال على الشعب، وقد يُطلق مجازاً على الفرد."
    - lemma: "كُرْدِسْتَانِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى إقليم كردستان، وهو موطن الأكراد."
    - lemma: "مِنَ الأَكْرَاد"
      generation_method: tarkib
      justification: "تعبير وصفي يشير إلى الانتماء إلى القومية الكردية."

stage2_evidence:
  per_lemma:
    - lemma: "كُرْدِيّ"
      confirm:
        - text: "الكُرْديّ: واحد الأكراد."
          source: "المورد الحديث (2008)"
        - text: "كُرْدِيّ: واحد الأكراد."
          source: "محيط المحيط (بواسطة تكملة المعاجم)"
        - text: "من (ك ر د) نسبة إلى الكُرْد بمعنى شعب يسكن هضبة آسيا."
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "الكُرْد، بالضم: جيل من الناس معروف، والجمع أكراد"
          source: "لسان العرب لابن منظور"
    - lemma: "كُرْد"
      confirm:
        - text: "والكُرْدُ: جِيْلٌ من الناس."
          source: "المحيط في اللغة للصاحب بن عباد"
      contradicts:
        - text: "الكُرْد، بالضم: جيل من الناس معروف، والجمع أكراد"
          source: "لسان العرب لابن منظور"
          conflict: "الكلمة تدل على اسم الجنس الجمعي (الشعب)، بينما المجموعة الترادفية مخصصة للفرد الواحد من هذا الشعب."
    - lemma: "كُرْدِسْتَانِيّ"
      evidence_status: "no_material_found"
    - lemma: "مِنَ الأَكْرَاد"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "كردي"
      decision: confirmed
      decision_reason: "اللمة دقيقة ومطابقة للمفهوم، فهي ياء النسبة التي تدل على الفرد من الشعب الكردي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الفرد المنتمي للقومية الكردية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كُرْدِيّ"
    - lemma: "كُرْد"
      source: stage1
      decision: removed
      decision_reason: "الكلمة تدل على المجموع (الشعب) لا على الفرد الواحد."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "كُرْدِسْتَانِيّ"
      source: stage1
      decision: removed
      decision_reason: "النسبة إلى المكان لا تتطابق بالضرورة مع العرق (قد يكون الكردستاني من عرق آخر)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "مِنَ الأَكْرَاد"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر وليس وحدة معجمية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "عضو في شعب إسلامي رعوي إلى حد كبير يعيش في كردستان؛ أكبر مجموعة عرقية ليس لها دولة خاصة بها"
    assessment:
      decision: revise
      reason: "تعديل الصياغة لتكون أكثر طبيعية في العربية، واستبدال 'عضو في' بـ 'فرد من'."
    authored:
      - type: encyclopedic
        text: "فردٌ من الأكراد، وهم شعبٌ ذو أغلبية مسلمة يغلب عليه الطابع الرعوي ويستوطن إقليم كردستان، ويُعدّ أكبر مجموعة عرقية لا تملك دولة مستقلة."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "فردٌ من الأكراد، وهم شعبٌ ذو أغلبية مسلمة يغلب عليه الطابع الرعوي ويستوطن إقليم كردستان، ويُعدّ أكبر مجموعة عرقية لا تملك دولة مستقلة."
  examples:
    per_lemma:
      - lemma: "كُرْدِيّ"
        examples:
          - text: "يفتخر كلُّ كُرْدِيٍّ بتراثه الثقافي ولغته الأصيلة وتاريخ شعبه."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يفتخر كلُّ كُرْدِيٍّ بتراثه الثقافي ولغته الأصيلة وتاريخ شعبه."

stage5_enrichment:
  per_entry:
    - lemma: "كُرْدِيّ"
      entry_id: "{auto}"
      root: "كرد"
      maqayis_quote: "«الْكَافُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مُدَافَعَةٍ وَإِطْرَادٍ... وَيَزْعُمُونَ أَنَّ الْكُرْدَ، هَؤُلَاءِ الْقَوْمَ، مُشْتَقٌّ مِنَ الْمُكَارَدَةِ»"
  per_sense:
    - lemma: "كُرْدِيّ"
      sense_id: "{auto}"
      nuance: "الاسم المنسوب الدال على الفرد من الشعب الكردي"
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"كرد","maqayis":"«الْكَافُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مُدَافَعَةٍ وَإِطْرَادٍ... وَيَزْعُمُونَ أَنَّ الْكُرْدَ، هَؤُلَاءِ الْقَوْمَ، مُشْتَقٌّ مِنَ الْمُكَارَدَةِ»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم المنسوب الدال على الفرد من الشعب الكردي","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
