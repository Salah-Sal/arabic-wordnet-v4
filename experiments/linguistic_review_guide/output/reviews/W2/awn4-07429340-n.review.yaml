          source: "مسرد المناخ والبيئة (ArabTerm)"
    - lemma: "تَقَارُب"
      confirm:
        - text: "تطور ينتج تشابه متزايد في الشكل... بين مجموعات من الكائنات الحية"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "التقارب بين الاتجاهات المتضادة إلى نقطة مشتركة"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
        - text: "يَحصُلُ التقاربُ بين فروعٍ وتقانات مختلفة"
          source: "معجم مصطلحات المعلوماتية"
    - lemma: "تَلَاقٍ"
      confirm:
        - text: "ظهور صفات متماثلة بصفة مستقلة في سلالتين أو أكثر"
