# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13878517-n  (gradable opposition)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحوي لمّة واحدة فقط (تَقَابُل مُتَدَرِّج)، والمفهوم اللساني يحتمل أكثر من تسمية"
      - "التعريف العربي الحالي ترجمة حرفية للإنجليزي (تعارض قابل للتدرج) ولا يوضّح المراد اللساني"
    observations: "المفهوم يندرج في علم الدلالة (semantics) ويصف نوعاً من التقابل بين الأضداد يسمح بدرجات وسطى، كالتقابل بين «حارّ» و«بارد» حيث يوجد «فاتر» و«دافئ» بينهما، في مقابل التقابل الحادّ (ungradable) كـ«حيّ» و«ميّت». مصطلح «تقابل» هو الشائع في المعجمات اللسانية العربية الموحّدة لترجمة opposition، ويتّسق مع سلسلة: تقابل ثنائي، تقابل سالب، تقابل تناسبي."
  blind_candidates:
    - lemma: "تَضَادّ مُتَدَرِّج"
      generation_method: tarkib
      justification: "تركيب وصفي من «تضادّ» (antonymy/opposition) و«متدرّج» (graded). تضادّ مصطلح لساني راسخ في المعاجم الموحّدة، ومتدرّج يفيد قبول التفاوت في الدرجة."
    - lemma: "تَقَابُل تَدَرُّجِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «تقابل» (opposition) و«تدرّجي» (نسبة إلى التدرّج). يوازي نمط: تقابل ثنائي، تقابل تناسبي."
    - lemma: "مُقَابَلَة مُتَدَرِّجَة"
      generation_method: tarkib
      justification: "تركيب وصفي من «مقابلة» (opposition/antithesis) و«متدرّجة». مقابلة مستعملة في البلاغة والمنطق بمعنى التقابل."
    - lemma: "تَضَادّ تَدَرُّجِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «تضادّ» و«تدرّجي» (gradable). يجمع بين المصطلح الدلالي الشائع والنسبة إلى التدرّج."


stage2_evidence:
  per_lemma:
    - lemma: "تَقَابُل مُتَدَرِّج"
      confirm:
        - text: "«تقابل — اختلاف بين وحدتين أو عدة وحدات مميزة.» (Opposition)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«متدرّج — graded»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«التقابل: من قال بانحصاره في الأعراض عرفه بعدم إمكان اجتماع الأمرين في موضوع واحد من جهة واحدة... والتقابل أقسام أربعة»"
          source: "التعريفات الفقهية (الجرجاني)"
      expands:
        - text: "«تقابل ثنائي — في الصواتة البنيوية، من منظور تروبتزكوي، تقابل بين صوتيتين يميز بينهما بواسطة سمة أو سمات صوتية محددة.» (Bilateral opposition)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يدلّ على أنّ «تقابل» هو الأساس المعجمي المعتمد لأنواع الـ opposition اللسانية"
        - text: "«تقابل سالب — تقابل بين لفظين، يتميز أحدهما بوجود سمة مميزة تدعى علامة لا توجد في الآخر» (Privative opposition)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "نمط اصطلاحي موازٍ: تقابل + صفة"
        - text: "«تقابل تناسبي — تقابل قائم بين عنصرين تربط بينهما علاقة شبيهة بتلك التي تربط بين عنصرين آخرين» (Proportional opposition)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "نمط اصطلاحي ثالث يؤكّد سلسلة «تقابل + نعت»"
        - text: "«قد يخلو عنهما معاً إمّا مع اتّصافه بوسط ويُعبَّر عن ذلك الوسط إمّا باسم وجودي كالفاتر المتوسّط بين الحارّ والبارد»"
          source: "التعريفات الفقهية (الجرجاني) — مادة التضاد"
          addition: "وصف دقيق لمفهوم التقابل المتدرّج: وجود درجات وسطى بين القطبين"

    - lemma: "تَضَادّ مُتَدَرِّج"
      confirm:
        - text: "«تَضَادٌّ — علاقة الضدين من حيث الدلالة.» (Antonymy)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«التَّضادُّ (في المنطق): التَّقابلُ بين مَعْنَيَيْن يندرجان تحت جنسٍ واحدٍ, وبينهما بعضُ الخلافِ»"
          source: "المعجم الكبير (الوسيط)"
      contradicts:
        - text: "«تضادّ — opposition» (الفيزياء)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "تضادّ في المعاجم الموحّدة يقابل opposition عامّة أو antonymy، لا يميّز بين المتدرّج وغيره؛ والاستعمال اللساني المعياري يفضّل «تقابل» لـ opposition"

    - lemma: "تَقَابُل تَدَرُّجِيّ"
      contradicts:
        - text: "«تَدَرُّجي — الصيغة الفعلية التدرجية هي التي تدل على عمل أثناء الحدوث غير تام.» (Progressive)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "«تدرّجي» في اللسانيات يعني progressive (الصيغة التدرّجية)، فاستعماله بمعنى gradable يوقع لبساً اصطلاحياً"

    - lemma: "مُقَابَلَة مُتَدَرِّجَة"
      expands:
        - text: "«المقابلة — أن يُؤتى بمعنيين متوافقين أو أكثر ثمّ يُقابَل ذلك على الترتيب»"
          source: "كشّاف اصطلاحات الفنون (الحنفي)"
          addition: "مقابلة مصطلح بلاغي (oxymoron/antithesis) لا لساني دلالي"
        - text: "«التقابل عند أهل البديع والحكماء هو المقابلة»"
          source: "كشّاف اصطلاحات الفنون (الحنفي)"
          addition: "يؤكّد أنّ المقابلة تستعمل في البلاغة والفلسفة، لا في اللسانيات الحديثة"

    - lemma: "تَضَادّ تَدَرُّجِيّ"
      contradicts:
        - text: "«تَدَرُّجي — Progressive»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "«تدرّجي» يعني progressive في اللسانيات، لا gradable"


stage3_analysis:
  per_lemma:
    - lemma: "تَقَابُل مُتَدَرِّج"
      decision: confirmed
      decision_reason: "مصطلح مبني على النمط المعتمد في المعجم الموحّد للّسانيات (تقابل + نعت: تقابل ثنائي، تقابل سالب، تقابل تناسبي). «تقابل» هو المقابل المعياري لـ opposition في اللسانيات، و«متدرّج» مقابل مثبت لـ graded. التركيب واضح ولا يوقع لبساً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
