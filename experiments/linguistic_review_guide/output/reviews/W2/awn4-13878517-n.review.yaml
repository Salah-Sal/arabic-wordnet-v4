      source: stage1
      decision: confirmed
      decision_reason: "«تضادّ» مصطلح لساني راسخ يقابل antonymy في المعجم الموحّد للّسانيات والمعجم الوسيط. المفهوم (gradable opposition) يُعرف في الأدبيات العربية أيضاً بـ «التضاد المتدرّج»، وهو مستعمل في الدراسات الدلالية العربية الحديثة. يضيف بُعد الترادف التخصّصي إذ يُبرز العلاقة بوصفها نوعاً من التضادّ لا مجرّد تقابل."
