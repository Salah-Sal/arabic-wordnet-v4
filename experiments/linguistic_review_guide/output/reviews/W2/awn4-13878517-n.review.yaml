    - lemma: "تَقَابُل تَدَرُّجِيّ"
      source: stage1
      decision: removed
      decision_reason: "«تدرّجي» مثبت في المعجم الموحّد للّسانيات بمعنى progressive (الصيغة التدرّجية)، فاستعماله بمعنى gradable يوقع التباساً اصطلاحياً خطيراً في الحقل نفسه."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُقَابَلَة مُتَدَرِّجَة"
      source: stage1
      decision: removed
      decision_reason: "«مقابلة» مصطلح بلاغي (antithesis/oxymoron) لا لساني دلالي. المعاجم الموحّدة تستعمل «تقابل» لا «مقابلة» في السياق اللساني الصوتي والدلالي."
      evidence_assessment:
        case: mixed

    - lemma: "تَضَادّ تَدَرُّجِيّ"
      source: stage1
      decision: removed
      decision_reason: "نفس إشكال «تدرّجي» = progressive في اللسانيات. لا يصلح مقابلاً لـ gradable."
      evidence_assessment:
        case: contradicts_only


