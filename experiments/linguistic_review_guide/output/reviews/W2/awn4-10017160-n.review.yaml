step0_evidence:
  per_lemma:
    - lemma: "مدين"
      confirm:
        - text: "«الشخص الذي يكون ملزما بتنفيذ التزام معين أو تأدية التعويض. وبشكل خاص، هو من كان عليه دين لفائدة شخص الدائن.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«(1) الآثم (2) المدين؛ المديون.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«من (د ي ن) العبد والذي يبيع بدين.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "معنى تاريخي إضافي (العبد)."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مديون"
      source_section: "step4_fts_keyword"
      evidence_citation: "«المديون: من عليه دينٌ.» — التعريفات الفقهيّة للبركتي"
      justification: "اشتقاق: اسم مفعول تام من الفعل الثلاثي (دان)، وهو لغة صحيحة (تميمية) ومستعملة بكثرة في الفقه والاستعمال العام للدلالة على من ركبه الدَّين."
  knowledge_candidates:
    - lemma: "مستدين"
      justification: "اشتقاق: اسم فاعل من السداسي (استدان). يُطلق على من طلب الدَّين والتزمه، ويعبر بدقة عن حالة من يتحمل الالتزام المالي."
    - lemma: "غارم"
      justification: "تخصيص: لفظ فقهي يُطلق على المديون الذي يعجز عن سداد دينه، ولا سيما في سياق مصارف الزكاة، ولكنه يشارك المدين في أصل المعنى (من عليه دين)."

step1_lemma_validation:
  per_lemma:
    - lemma: "مدين"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع في لغة القانون والاقتصاد للإشارة إلى من عليه التزام مالي."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح الأعم والأكثر رسمية في الاستعمال المعاصر للإشارة لمن عليه التزام مالي."
      example: "سدَّد المدينُ التزامَهُ الماليَّ في الموعد المحدَّد."

    - lemma: "مديون"
      source: step05
      decision: confirmed
      decision_reason: "فصيحة (لغة بني تميم) ومستعملة على نطاق واسع في لغة الفقه والتراث والاستعمال اليومي."
      step05_citation: "«المديون: من عليه دينٌ.» — التعريفات الفقهيّة للبركتي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُفضّل في السياقات الفقهية والشرعية والعامة، بينما يُفضّل «مدين» في القانون والاقتصاد."
      example: "يسعى المديونُ لسداد ما عليه من أموال لإبراء ذمته."
      actions:
        - command: create_entry
          params:
            lemma: "مديون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10017160-n"

    - lemma: "مستدين"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل فصيح يدل على من طلب الدَّين وتكلفه."
      step05_citation: "«الْغَارِم: الْمُعسر المستدين لنَفسِهِ أَو لله.» — معجم مقاليد العلوم للسيوطي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تؤكد على فعل طلب الدين (الاستدانة)، بينما «مدين» تؤكد على حالة شغل الذمة بالدين."
      example: "أصبح المستدينُ عاجزاً عن الوفاء بالتزاماته."
      actions:
        - command: create_entry
          params:
            lemma: "مستدين"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10017160-n"

    - lemma: "غارم"
      source: step05
      decision: removed
      decision_reason: "مصطلح أخص من «مدين»، فهو يشير غالباً للمدين المعسر العاجز عن السداد (في الفقه)، ولا يصلح كمرادف تام."
      step05_citation: "«الذى يلتزم ما ضمنه وتكفَّل به» — المعجم الوسيط"
      substitution_test:
        result: "fail"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
