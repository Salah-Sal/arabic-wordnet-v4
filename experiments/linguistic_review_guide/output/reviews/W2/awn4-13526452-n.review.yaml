# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'تقرن' مكتوبة بلا تشكيل، وصيغتها المضبوطة تَقَرُّن (مصدر الباب الخامس) غائبة"
      - "بعض المعاجم تخلط بين تقرُّن (keratinization) وتقرُّن بمعنى keratosis (نمو قرني مرضي)، مما يوحي بتعدد دلالي في المصطلح"
      - "التعريف العربي الحالي يستخدم صيغة 'يتم فيها' المقتبسة من أسلوب الترجمة الحرفية، بدلاً من الأسلوب المعجمي العربي الأصيل"
    observations: >-
      المجموعة تمثّل مصطلحاً بيولوجياً-طبياً دقيقاً يُعنى بعملية تحوّل الخلايا إلى مادة قرنية
      بفعل ترسّب الكيراتين، وهي العملية الطبيعية المسؤولة عن بناء الأظافر والشعر والطبقة القرنية
      من الجلد. الجذر المحوري ق-ر-ن يحمل معنى البروز القوي (القرن) وهو أصل صحيح في مقاييس
      اللغة. الاشتقاق بصيغة تَفَعُّل (تَقَرُّن) طبيعي للإشارة إلى عملية تحوّل ذاتية تدريجية.
      المصطلح موثَّق في أكثر من سبعة معاجم طبية عربية حديثة.

  blind_candidates:
    - lemma: "تَقَرُّن"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل تَقَرَّنَ (الباب الخامس) من جذر ق-ر-ن، على النمط تَفَعُّل الدال على
        التحوّل الذاتي التدريجي. يصف بدقة عملية اكتساب الخلايا للطابع القرني، وهو
        اشتقاق مطّرد في اللغة الطبية (تَكلُّس، تَصلُّب، تَقَرُّح).

    - lemma: "تَقْرِين"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل قَرَّنَ (الباب الثاني) من جذر ق-ر-ن، على النمط تَفْعِيل الدال على
        التحويل والإحداث. يركّز على البُعد التحويلي (جعل الشيء قرنياً)، ومناسب لوصف
        عملية ترسيب الكيراتين بوصفها تحويلاً في البنية الخلوية.

    - lemma: "قَرْنَنَة"
      generation_method: ishtiqaq
      justification: >-
        مصدر رباعي على وزن فَعْلَلَة باعتبار قَرَّنَ جذراً رباعياً مرتجَلاً.
        النمط فَعْلَلَة منتج في المصطلحية العلمية الحديثة للدلالة على عمليات
        تحويلية تقنية، غير أنه يفترض رباعية الجذر وهو أقل طبيعية من تَقَرُّن.

    - lemma: "كَيْرَتَنَة"
      generation_method: taarib
      justification: >-
        تعريب من الأصل اليوناني-اللاتيني keratinization عبر انتزاع جذع
        كَيْرَتِن (keratin بعد حذف اللاحقة -in) وإلحاق لاحقة المصدر العربي -نة.
        يُذكر كملاذ أخير، إذ يتقبّل لام التعريف والنسبة (كيرتني). وجود اشتقاق
        عربي أصيل يجعل هذا التعريب غير ضروري.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
# استعلامات منفّذة: 4
#   1. مطابقة دفعية (تقرن + المرشحات الأربعة + صيغ ال-)
#   2. الجسر الإنجليزي (keratinization / keratinisation / cornification / keratinize)
#   3. FTS بالكلمات المفتاحية (كيراتين، قرني، تقرن)
#   4. مقاييس اللغة (dictionary_id=151، جذر قرن)
stage2_evidence:
  per_lemma:

    - lemma: "تقرن"
      confirm:
        - text: "«تقرن — keratinization — Hygienics and Human Body»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
        - text: "«تقرُّن — keratinisation — Veterinary Medicine»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«تَقَرُّن — keratinization — The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَقَرُّن — cornification — The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تقرّن — cornification — انسطاح الطباقية وتحولها إلى خلايا قشرية»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«تقرن — keratinization — نمو الكيراتين أو التحول إليه»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«التَّقَرُّن: التحوُّل إلى مادة قَرْنيّة — cornification»"
          source: "المورد الحديث (2008)"
        - text: "«تقرُّن — hornification = cornification — انظر: cornification»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
      contradicts:
        - text: "«تقرن — keratosis — كل نمو قرني مثل الثؤلول والجسأة»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: >-
            هذا المدخل يربط تقرن بـ keratosis (نمو قرني مرضي)، وهو مفهوم مختلف
            عن keratinization (العملية الخلوية الطبيعية). يكشف عن تعدد دلالي
            في استخدامات المصطلح بين المعاجم الطبية.
        - text: "«تَقَرُّن — keratoplasia — The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >-
            keratoplasia تشير إلى التكوّن القرني بمعنى أوسع وأحياناً مرضي،
            وليست مرادفاً دقيقاً لـ keratinization بمعناها الخلوي المحدد.
      expands:
        - text: "«تَقَرُّنُ الجِلْد — keratoderma»"
          source: "المعجم الطبي الموحد (2009)"
          addition: >-
            يُظهر استخدام تقرن في مركبات مقيّدة (تقرّن الجلد، تقرّن فراش الظفر)
            للدلالة على مواضع بعينها، مما يدل على خصوبة اشتقاقية للمصطلح.
        - text: "«اختِبارُ التَّقَرُّنِ المَهْبِلِيّ (لفعالية الاستروجين) — vaginal cornification test»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يستخدم المصطلح في تركيبات طبية مركّبة مضافة تؤكد انتشاره المصطلحي."

    - lemma: "تَقَرُّن"
      confirm:
        - text: "«تقرُّن — keratinization / keratinisation / cornification (متعدد)»"
          source: "المعجم الطبي الموحد 2009؛ معجم المصطلحات الطبية ج.1 وج.3؛ المورد الحديث 2008"

    - lemma: "تَقْرِين"
      evidence_status: "no_material_found"

    - lemma: "قَرْنَنَة"
      evidence_status: "no_material_found"

    - lemma: "كَيْرَتَنَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تقرن"
      decision: confirmed
      decision_reason: >-
        اللمّة موثّقة بصيغة تَقَرُّن في أكثر من سبعة معاجم طبية عربية حديثة معتمدة
        تقابل keratinization وkeratinisation وcornification. الاشتقاق صحيح على
        وزن تَفَعُّل من الجذر ق-ر-ن، والوزن مطّرد لعمليات التحوّل الخلوي
        (تَكلُّس، تَصلُّب). الرسم في السجل مجرّد من التشكيل؛ يُحدَّث إلى تَقَرُّن.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        اللمّة الوحيدة في المجموعة؛ تختص بالعملية الخلوية الطبيعية لتراكم الكيراتين
        وتحوّل الخلايا إلى مادة قرنية، في مقابل تقرُّن الجلد (keratoderma)
        الذي يستخدمها في سياق مرضي مقيَّد، والكيراتوز (keratosis) الذي يعني
        النمو القرني الشاذ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقَرُّن"

    - lemma: "تَقَرُّن"
      source: stage1
      decision: removed
      decision_reason: >-
        هذا المرشح مطابق للمّة الموجودة (تقرن) بعد إضافة التشكيل الكامل؛ تمت
        معالجته عبر إجراء update_lemma على اللمّة الأصلية. لا إجراء إضافي مطلوب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "تَقْرِين"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية على استخدام تَقْرِين بمعنى keratinization في أي معجم طبي
        أو علمي. وزن تَفْعِيل يفيد التعدية ولا يناسب العملية الخلوية الذاتية.
        تَقَرُّن (الباب الخامس) أدق وأوسع تداولاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "قَرْنَنَة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود لهذا المصطلح في المعاجم المستعلَمة. الجذر الرباعي المفترَض (قرنن)
        غير وارد في قوائم الجذور المعتمدة. لا يجتاز اختبار التثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "كَيْرَتَنَة"
      source: stage1
      decision: removed
      decision_reason: >-
        تعريب مقترح غير مسجَّل في المعاجم. وجود الاشتقاق العربي الأصيل تَقَرُّن
        يغني عن التعريب وفق مبدأ إيثار العربي على الدخيل. لا يجتاز بوابة الضرورة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
stage4_content:
  definition:
    current: "عملية عضوية يتم فيها ترسيب الكيراتين في الخلايا وتصبح الخلايا قرنية (كما في الأظافر والشعر)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي يعتمد صياغة ترجمية ('يتم فيها') غير مألوفة في المعجمية العربية.
        وصف 'عملية عضوية' أقل دقة من 'عملية خلوية' في السياق البيولوجي. يستحسن
        صياغة تعريف مصطلحي بجنس قريب وفصل نوعي واضح بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: >-
          عَمَلِيَّةٌ خَلَوِيَّةٌ تَتَّخِذُ فِيهَا خَلَايَا الأَنسِجَةِ الطَّابَعَ القَرنِيَّ
          بِتَرَاكُمِ مَادَّةِ الكِيرَاتِينِ فِيهَا، وَيَجرِي ذَلِكَ طَبِيعِيّاً فِي تَكَوُّنِ
          الأَظَافِرِ وَالشَّعَرِ وَالطَّبَقَةِ القَرنِيَّةِ مِنَ الجِلد.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          التَّقَرُّنُ عمليةٌ تتحوّل فيها الخلايا الطلائية إلى خلايا قرنية متقشِّرة
          عديمة النواة؛ يبدأ الكيراتين بروتيناً ليفياً داخل الخلايا ثم يتراكم حتى
          يملأها فتفقد وظائفها الحيوية وتتصلَّب. ومن نماذجه: تكوُّن صفيحة الظفر،
          ونمو قضيب الشعر، وتجديد الطبقة القرنية من البشرة.
