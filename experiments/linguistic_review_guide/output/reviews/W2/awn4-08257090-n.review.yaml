stage1_review:
  assessment:
    concerns:
      - "كلمة «شلة» غالباً ما تُعتبر عامية أو غير فصيحة في بعض المعاجم القديمة، لكن المعجم الكبير أثبتها."
      - "التعريف الحالي هو ترجمة حرفية للتعريف الإنجليزي ويحتاج صياغة معجمية عربية."
    observations: "المجموعة تدور حول التجمعات الاجتماعية غير الرسمية التي تربطها أواصر الصداقة أو الاهتمام المشترك. المصطلحات الموجودة تغطي هذا الجانب، ولكن يمكن إثراؤها بمصطلحات تعبر عن «الدائرة الاجتماعية» مثل حلقة."
  blind_candidates:
    - lemma: "حَلْقَة"
      generation_method: majaz
      justification: "تُستخدم للتعبير عن الدائرة الاجتماعية أو مجموعة الأشخاص المرتبطين فكرياً أو اجتماعياً (circle)."
    - lemma: "ثُلَّة"
      generation_method: ishtiqaq
      justification: "من المصطلحات القرآنية والمعجمية التي تدور حول معنى الجماعة من الناس (lot/set)."
    - lemma: "بِطَانَة"
      generation_method: majaz
      justification: "تُعبر عن الحلقة المقربة أو الخاصة من الأتباع والأصدقاء (coterie/inner circle)."
    - lemma: "طُغْمَة"
      generation_method: ishtiqaq
      justification: "تُطلق على الجماعة التي يتحد شأنها، وغالباً ما تُستخدم في سياق المجموعات المنغلقة أو ذات الصبغة المعينة."

stage2_evidence:
  per_lemma:
    - lemma: "زُمْرَة"
      confirm:
        - text: "«الزمرة: الفوج والجماعة»"
          source: "المعجم الوسيط"
        - text: "«الزمرة: الجماعة القليلة»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "شِلَّة"
      confirm:
        - text: "«الشلة: جماعة من الأصدقاء ذات ميول وأفكار واحدة»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«لم ترد كلمة «شلة» في المعاجم [بهذا المعنى]، وورد في معناها «ثلة»»"
          source: "معجم الصواب اللغوي"
          conflict: "يشير إلى أنها عامية المنشأ، لكن إثبات المعجم الكبير لها يجعلها مقبولة فصيحة."
    - lemma: "عُصْبَة"
      confirm:
        - text: "«العُصْبة: الجماعة من الناس أو الخيل أو الطير تزيد على عشرة»"
          source: "المعجم الوسيط"
        - text: "«مجموعة متماسكة تُكوِّن بالنسبة إلى أعضائها جزءا من هويتهم الاجتماعية»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "حَلْقَة"
      confirm:
        - text: "«حلقة القوم: دائرتهم»"
          source: "المعجم الوسيط"
        - text: "«حلقة القوم: دائرة مجلسهم»"
          source: "المعجم الكبير"
    - lemma: "ثُلَّة"
      confirm:
        - text: "«الثلة: الجماعة من الناس»"
          source: "المعجم الوسيط"
        - text: "«الثناء واللام أصلان... أحدهما التجمع... والثلة: الجماعة من الناس»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "زمرة"
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر عن الجماعة أو الفوج، ويناسب تماماً معنى band أو set."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زُمْرَة"
    - lemma: "شلة"
      decision: confirmed
      decision_reason: "رغم تحفظ بعض اللغويين، إلا أنها المصطلح الأدق للتعبير عن الرابطة غير الرسمية بين الأصدقاء (clique/set) وقد أثبتها مجمع اللغة العربية في المعجم الكبير."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شِلَّة"
    - lemma: "عصبة"
      decision: confirmed
      decision_reason: "تعبر عن الجماعة المتماسكة التي تربطها رابطة عصبية أو اهتمام مشترك، وتناسب معنى band."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُصْبَة"
    - lemma: "حَلْقَة"
      source: stage1
      decision: confirmed
      decision_reason: "تمثل الترادف الدقيق لكلمة circle في السياق الاجتماعي، وهي مستخدمة بكثرة في العربية المعاصرة والتراثية (حلقة العلم، حلقة الأصدقاء)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حَلْقَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ثُلَّة"
      source: stage1
      decision: confirmed
      decision_reason: "جماعة من الناس، وتفيد معنى المجموعة أو الدفعة (lot/set) في السياقات القرآنية والأدبية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ثُلَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "رابطة غير رسمية من الناس أو المجموعات"
    assessment:
      decision: revise
      reason: "الصياغة الحالية تبدو مترجمة حرفياً، يفضل صياغتها بأسلوب يوضح طبيعة الرابطة الاجتماعية."
    authored:
      - type: terminological
        text: "تجمُّع أو رابطة اجتماعية غير رسمية تضم مجموعة من الأشخاص تجمعهم اهتمامات أو علاقات مشتركة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "تجمُّع أو رابطة اجتماعية غير رسمية تضم مجموعة من الأشخاص تجمعهم اهتمامات أو علاقات مشتركة."}
  examples:
    per_lemma:
      - lemma: "زُمْرَة"
        examples:
          - text: "انضمَّ الشابُّ إلى زُمْرَةٍ من الفنَّانين المبدعين الذين يتبادلون الأفكار بحرية."
            type: usage
      - lemma: "شِلَّة"
        examples:
          - text: "اعتاد أعضاء الشِّلَّةِ الاجتماعَ كلَّ مساءٍ في النادي لمناقشة آخر المستجدات."
            type: usage
      - lemma: "عُصْبَة"
        examples:
          - text: "تشكلت عُصْبَةٌ من الناشطين للعمل على حماية البيئة في الحي."
            type: usage
      - lemma: "حَلْقَة"
        examples:
          - text: "اتسعت حَلْقَةُ أصدقائه لتشمل أدباء ومفكرين من مختلف المشارب."
            type: usage
      - lemma: "ثُلَّة"
        examples:
          - text: "كرّمَتِ الجامعةُ ثُلَّةً من الخريجين المتفوقين في حفلٍ مهيب."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "انضمَّ الشابُّ إلى زُمْرَةٍ من الفنَّانين المبدعين الذين يتبادلون الأفكار بحرية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "اعتاد أعضاء الشِّلَّةِ الاجتماعَ كلَّ مساءٍ في النادي لمناقشة آخر المستجدات."}

stage5_enrichment:
  per_entry:
    - lemma: "زُمْرَة"
      entry_id: "{auto}"
      root: "زمر"
      maqayis_quote: "«الزَّاءُ وَالْمِيمُ وَالرَّاءُ أَصْلَانِ... وَأَمَّا الزُّمْرَةُ فَالْجَمَاعَةُ، وَهِيَ مُشْتَقَّةٌ مِنْ هَذَا [الصوت] لِأَنَّهَا إِذَا اجْتَمَعَتْ كَانَتْ لَهَا جَلَبَةٌ وَزِمَارٌ»"
    - lemma: "شِلَّة"
      entry_id: "{auto}"
      root: "شلل"
      maqayis_quote: "«الشِّينُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَبَاعُدٍ... وَالشُّلَّةُ: النَّوَى نَوَى الْفِرَاقِ»"
    - lemma: "عُصْبَة"
      entry_id: "{auto}"
      root: "عصب"
      maqayis_quote: "«الْعُصْبَةُ، قَالَ الْخَلِيلُ: هُمْ مِنَ الرِّجَالِ عَشَرَةٌ... وَإِنَّمَا سُمِّيَتْ عُصْبَةً لِأَنَّهَا قَدْ عُصِبَتْ، أَيْ كَأَنَّهَا رُبِطَ بَعْضُهَا بِبَعْضٍ»"
    - lemma: "حَلْقَة"
      entry_id: "{auto}"
      root: "حلق"
      maqayis_quote: "«الْحَلْقَةُ حَلْقَةُ الْحَدِيدِ... وَالْحِلْقُ: خَاتَمُ الْمُلْكِ، وَهُوَ لِأَنَّهُ مُسْتَدِيرٌ. حلقة القوم: دائرتهم»"
    - lemma: "ثُلَّة"
      entry_id: "{auto}"
      root: "ثلل"
      maqayis_quote: "«الثَّاءُ وَاللَّامُ أَصْلَانِ... أَحَدُهُمَا التَّجَمُّعُ... وَالثُّلَّةُ: الْجَمَاعَةُ مِنَ النَّاسِ»"
  per_sense:
    - lemma: "زُمْرَة"
      sense_id: "{auto}"
      nuance: "تُستخدم للجماعة المنضمة لبعضها، وقد توحي أحياناً بجمع يسير له جلبة أو صيت."
      mwe: false
    - lemma: "شِلَّة"
      sense_id: "{auto}"
      nuance: "تُستخدم للأصدقاء المقربين جداً ذوي الميول الواحدة، وهي الأكثر دلالة على عدم الرسمية."
      mwe: false
    - lemma: "عُصْبَة"
      sense_id: "{auto}"
      nuance: "تؤكد على التماسك والتعاضد بين أفراد المجموعة."
      mwe: false
    - lemma: "حَلْقَة"
      sense_id: "{auto}"
      nuance: "تعبر عن الدائرة الاجتماعية أو الفكرية، وتناسب ترجمة circle."
      mwe: false
    - lemma: "ثُلَّة"
      sense_id: "{auto}"
      nuance: "تفيد معنى المجموعة المختارة أو المتميزة من وسط جماعة أكبر."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
