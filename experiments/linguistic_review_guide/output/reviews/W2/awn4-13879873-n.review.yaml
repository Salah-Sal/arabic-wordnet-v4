# مراجعة المجموعة الترادفية — awn4-13879873-n
# contradiction — التعارض بين قوتين أو فكرتين متضاربتين
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (تَنَاقُض)، وقد يكون من المفيد إثراؤها بمرادفات تغطي سجلات أسلوبية مختلفة"
      - "التعريف العربي يستخدم لفظ «التعارض» وهو لمّة في المجموعة الأعلى (hypernym)، مما يخلق دوراناً جزئياً بين المستويَيْن"
    observations: "المفهوم المستهدف هو التعارض بين قوتين أو فكرتين متضاربتين — وهو مفهوم فلسفي ومنطقي عريق في التراث العربي. وزن تَفَاعُل يناسب الدلالة على التبادل والمشاركة بين طرفين متقابلين. الجذر ن ق ض غني بالمشتقات الدالة على النكث والإبطال، وهو الأنسب لهذا المفهوم. يقع المفهوم تحت «التضادّ» مباشرة، فالتناقض أخصّ منه لاقتضائه استحالة الجمع والرفع معاً."
  blind_candidates:
    - lemma: "تَنَاقُض"
      generation_method: ishtiqaq
      justification: "من الجذر ن ق ض على وزن تَفَاعُل الدال على المشاركة والتبادل؛ يفيد أنّ كل طرف ينقض الآخر، وهو اللفظ الأدق للتعبير عن التعارض الذي يستحيل فيه الجمع بين الطرفين"
    - lemma: "مُنَاقَضَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن ق ض على وزن مُفَاعَلَة الدال على المشاركة؛ ورد في التراث بمعنى إبطال أحد القولين بالآخر، فقد يصلح للدلالة على التعارض بين فكرتين"
    - lemma: "تَصَادُم"
      generation_method: majaz
      justification: "من الجذر ص د م على وزن تَفَاعُل؛ أصله في الاصطدام المادي بين الأجسام الصلبة، ويُستعمل مجازاً في تصادم الآراء والأفكار، فقد يصلح للتعارض بين قوتين"
    - lemma: "تَنَافٍ"
      generation_method: ishtiqaq
      justification: "من الجذر ن ف ي على وزن تَفَاعُل؛ يفيد التبادل في النفي بحيث يستلزم وجود أحدهما عدم الآخر، كما بين السواد والبياض"

stage2_evidence:
  per_lemma:
    - lemma: "تَنَاقُض"
      confirm:
        - text: "«بعضُ الكلام يقتضى إبطال بعض (في المنطق): النسبة بين المتناقضين»"
          source: "المعجم الوسيط"
        - text: "«التناقض: هو اختلاف القضيتين بالإيجاب والسلب، بحيث يقتضي لذاته صدق إحداهما وكذب الأخرى، كقولنا: زيد إنسان، زيد ليس بإنسان.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«التناقض: اختلاف قضيتين بإيجاب وسلب بحيث يقتضي لذاته صدق أحدهما وكذب الأخرى، نحو زيد إنسان زيد غير إنسان وأصله قولهم تناقض الكلامان إذا تدافعا كأن كل واحد ينقض الآخر. وفي كلامه تناقض إذا كان بعضه يقتضي إبطال بعض.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«التَّنَاقُضُ: اخْتِلَاف قضيتين بالسلب، والإيجاب بِحَيْثُ يَقْتَضِي لذاته أَن تكون إِحْدَاهمَا صَادِقَة وَالْأُخْرَى كَاذِبَة.»"
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "«(تنَاقض) الشَّيْء انْتقض وَالْقَوْلَان تخالفا وتعارضا والشاعران قَالَ كل مِنْهُمَا قصيدة ينْقض بهَا قصيدة الآخر ويعارضها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يبيّن أن للفعل تَنَاقَضَ معنى إضافياً في سياق الشعر (المناقضات الشعرية)"
        - text: "«هو عند الأصوليين تقابل الدليلين المتساويين على وجه لا يمكن الجمع بينهما بوجه ويسمّى بالتعارض والمعارضة أيضاً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يوسّع الدلالة إلى الأصول حيث التناقض يساوي تقابل الدليلين مع استحالة الجمع"
    - lemma: "مُنَاقَضَة"
      contradicts:
        - text: "«المُنَاقَضَةُ: منع مُقَدّمَة مُعينَة من مُقَدمَات دَلِيل الْخصم.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المناقضة في الاصطلاح تعني منع مقدمة من مقدمات الدليل لا التعارض بين قوتين"
        - text: "«المناقضة: لغة: إبطال أحد القولين بالآخر. واصطلاحا: منع مقدمة معينة من مقدمات الدليل.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى اللغوي (إبطال) قريب لكن المعنى الاصطلاحي يبتعد عن التعارض بين قوتين متضاربتين"
      expands:
        - text: "«المناقضة: لغة: إبطال أحد القولين بالآخر، واصطلاحًا: هي منع مقدمة معينة من مقدمات الدليل، وشرطٌ في المناقضة ألا تكون المقدمة من الأوليات ولا من المسلمات»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يبيّن أنّ المناقضة مصطلح في آداب البحث والمناظرة لا في المنطق العام"
    - lemma: "تَصَادُم"
      contradicts:
        - text: "«(في علم الطاقة) (Impact): الفرعُ الذي يبحثُ في تصادمِ الأجسام؛ ونظريتُه أنَّ التَّغَيُّرَ في كَمِّيَّةِ التَّحرُّكِ في أحد الجسمين يعادلُ التَّغيُّرَ في كَمِّيَّةِ التَّحرُّكِ في الجسمِ الآخرِ»"
          source: "المعجم الكبير"
          conflict: "التصادم في المعجم يدل أساساً على الاصطدام المادي بين الأجسام لا على التعارض الفكري"
      expands:
        - text: "«الشيئان: اصْطَدما الآراء ونحوها: اصطدمتْ الشَّهادة: تضاربتْ, وتَعارَضَتْ النَّاسُ: تزاحموا»"
          source: "المعجم الكبير"
          addition: "الفعل تَصَادَمَ يُستعمل مجازياً للآراء بمعنى التضارب والتعارض، لكنه استعمال مجازي لا يرقى إلى مصطلح مستقل"
    - lemma: "تَنَافٍ"
      confirm:
        - text: "«التنافي: هو اجتماع الشيئين في واحد في زمان واحد، كما بين السواد والبياض، والوجود والعدم.»"
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: "«incompatibility»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
          addition: "التنافي يُقابل incompatibility لا contradiction، فدلالته أوسع وأعمّ من التناقض المنطقي"

stage3_analysis:
  per_lemma:
    - lemma: "تَنَاقُض"
      decision: confirmed
      decision_reason: "لمّة ثابتة في المعاجم الكلاسيكية والحديثة بمعنى التعارض الذي يقتضي صدق أحد الطرفين وكذب الآخر. مؤيَّدة بنصوص المعجم الوسيط والتعريفات والتوقيف وكشّاف الاصطلاحات. تشكيلها الحالي صحيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لمّة وحيدة في المجموعة؛ تدل على التعارض التامّ بين قولين أو قوتين بحيث يستلزم صدق أحدهما كذب الآخر، وتمتاز عن أمّها (التضادّ/التعارض) بأنها أخصّ — إذ تقتضي استحالة الجمع والرفع معاً"
      actions: []

    - lemma: "مُنَاقَضَة"
      source: stage1
      decision: removed
      decision_reason: "المناقضة في الاصطلاح تعني منع مقدمة معيّنة من مقدمات دليل الخصم (في آداب البحث والمناظرة)، ومعناها اللغوي (إبطال أحد القولين بالآخر) أقرب إلى الفعل الإجرائي منه إلى العلاقة بين القوتين. لا تصلح مرادفاً للتناقض بمعناه المنطقي/الفلسفي المطلوب هنا."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَصَادُم"
      source: stage1
      decision: removed
      decision_reason: "التصادم دلالته الأصلية مادية (اصطدام الأجسام)، واستعماله للآراء مجازي غير مستقر في المعاجم كمصطلح مستقل. كما أنّ المعاجم المصطلحية الحديثة تقصره على collision المادي. لا يصلح بديلاً عن التناقض في هذه المجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "تَنَافٍ"
      source: stage1
      decision: removed
      decision_reason: "التنافي يدل على عدم إمكان اجتماع شيئين (incompatibility)، وهو أعمّ من التناقض (contradiction) الذي يقتضي فوق ذلك استحالة الرفع. كما أن التنافي يقع في مستوى دلالي أقرب إلى التضادّ (contrariety) منه إلى التناقض الصريح. ينتمي إلى مجموعة ترادفية أخرى."
      evidence_assessment:
        case: mixed

