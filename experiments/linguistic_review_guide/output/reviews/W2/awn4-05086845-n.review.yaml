          source: "المورد الحديث"
    - lemma: "عَمُودِيَّة"
      confirm:
        - text: "«العموديّة؛ الرّأسيّة؛ الشّاقوليّة: verticality»"
          source: "المورد الحديث"
    - lemma: "رَأْسِيَّة"
      confirm:
        - text: "«العموديّة؛ الرّأسيّة؛ الشّاقوليّة: verticality»"
          source: "المورد الحديث"
    - lemma: "شَاقُولِيَّة"
      confirm:
        - text: "«العموديّة؛ الرّأسيّة؛ الشّاقوليّة: verticality»"
          source: "المورد الحديث"
    - lemma: "انْتِصَاب"
      confirm:
        - text: "«توازن عموديّ: stance»"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
        - text: "«النصب: إقامة شيء وإهدف في استواء»"
          source: "مقاييس اللغة"

