# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تغطي المفهوم بشكل جيد، ولكن يمكن إثراؤها بمصطلحات أكثر تخصصاً (مثل الشاقولية) أو تصف الهيئة الحيوية (مثل الانتصاب)."
    observations: "المجموعة تعبر عن وضعية هندسية وحيزية (العمودية)، وهي تتقاطع دلالياً مع معاني الاستقامة والاعتدال."
  blind_candidates:
    - lemma: "عَمُودِيَّة"
      generation_method: ishtiqaq
      justification: "المصدر الصناعي من (عمود)، وهو اللفظ الأشهر للتعبير عن العلاقة القائمة مع الأفق."
    - lemma: "انْتِصَاب"
      generation_method: ishtiqaq
      justification: "مصدر (انتصب)، ويُستخدم لوصف الحالة القائمة للأجسام والهياكل، ويقابل erectness."
    - lemma: "تَعَامُد"
      generation_method: ishtiqaq
      justification: "يعبر عن العلاقة الهندسية بزاوية قائمة، وهو صريح في موافقة التعريف."
    - lemma: "رَأْسِيَّة"
      generation_method: ishtiqaq
      justification: "نسبة إلى الرأس (الأعلى)، وتُستخدم في الفيزياء والرياضيات مقابلاً لـ verticality."

