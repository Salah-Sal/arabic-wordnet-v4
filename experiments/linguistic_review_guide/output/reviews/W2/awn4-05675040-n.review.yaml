        مُتَّصِلًا بَعْضُهُ بِبَعْضٍ، وَالْآخَرُ عَلَى السُّكُونِ وَالطُّمَأْنِينَةِ. فَالْأَوَّلُ الْعُرْفُ:
        عُرْفُ الْفَرَسِ، وَسُمِّيَ بِذَلِكَ لِتَتَابُعِ الشَّعْرِ عَلَيْهِ»

