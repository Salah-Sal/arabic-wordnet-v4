# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عرف، ممارسة) خاليتان من التشكيل الكامل"
      - "تعريف (الممارسة) في المعاجم الكلاسيكية (المعجم الوسيط) مقيَّد بالمعنى القانوني/التجاري (عملية بيع أو شراء بدون مزايدة) وهو يناقض دلالة المجموعة"
      - "المجموعة تفتقر إلى مصطلح (دِرَايَة) الذي يُعبّر تعبيراً مباشراً عن مفهوم (معرفة كيفية القيام بشيء ما)"
      - "التعريف العربي الحالي (معرفة كيفية القيام بشيء ما عادة) ركيكٌ لغوياً؛ عبارة (القيام بشيء ما) مشتركة غير دقيقة، وكلمة (عادة) معلّقة في نهاية الجملة"
    observations: >
      المجموعة تُعبّر عن مفهوم «المعرفة الإجرائية العرفية»، أي معرفة الطريقة المتعارف
      عليها لأداء شيء ما؛ وهو مفهوم راسخ في العربية من خلال جذرَي (ع-ر-ف) و(د-ر-ي).
      لمّة (عُرْف) أكثر الكلمتين الموجودتين ملاءمةً للدلالة الاجتماعية/الثقافية للمفهوم،
      فيما تُغطّي (مُمَارَسَة) الجانب التطبيقي منه. الفجوة المعجمية الحقيقية هي غياب
      (دِرَايَة) التي تُعبّر بدقة عن الجانب الإدراكي للمفهوم.
  blind_candidates:
    - lemma: "دُرْبَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر (د-ر-ب) على وزن فُعْلَة، والجذر يدلّ على مُلازمة الشيء والإغراء
        به؛ وقد عرّفها العرب بأنها «العادة والتجربة» — وهي تعبّر عن المعرفة المكتسبة
        بالتكرار والمداومة التي يصف بها التعريفُ المفهومَ المقصود.
    - lemma: "سُنَّة"
      generation_method: majaz
      justification: >
        من الجذر (س-ن-ن)، مجاز من معنى «الطريق الذي خطّه الأوائل فصار مسلكاً لمن
        بعدهم»، والعرب استعملوها بمعنى الطريقة والعادة المتّبعة؛ وهو قريب من «الكيفية
        المعتادة» في التعريف.
    - lemma: "مَرَانٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر (م-ر-ن)، والمُرُون يدلّ على الاستمرار والتليّن بالتكرار، وكان
        المقصود اسماً دالاً على المداومة والتكرار الذي يُفضي إلى المعرفة الإجرائية.
        [ملاحظة: تبيّن في مرحلة الأدلة أن (مَرَانٌ/المُرَّانُ) يعني الرماح الصلبة اللدنة
        لا الدُّرْبَة — الصواب اشتقاق تَمْرِين أو مُرُونَة]
    - lemma: "دِرَايَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر (د-ر-ي) على وزن فِعَالَة، وفعل «دَرَى/يَدْرِي» يعني العلم
        والمعرفة الوثيقة بالأمر؛ فدِرَايَة هي المعرفة التامة بكيفية الشيء، وتنسجم
        مباشرةً مع التعريف «معرفة كيفية القيام بشيء ما» — وهي الأقرب إلى know-how.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة (6 استعلامات):
#   Q1 – headword_norm IN (عرف، العرف، ممارسة، الممارسة، دربة، الدربة،
#                          سنة، السنة، مران، المران، اعتياد، الاعتياد) → 109 نتيجة
#   Q2 – enrichment (definitions + examples) by entry_id لأبرز النتائج
#   Q3 – English bridge: translation_en IN ("practice","custom","convention",
#                        "usage","know-how","customary practice") → 29 نتيجة
#   Q4 – Arabic FTS: "دراية" OR "معرفة عملية" OR "خبرة" OR "حذق" → 20 نتيجة
#   Q5 – headword_norm IN (دراية، الدراية) → 4 نتائج
#   Q6 – Maqayis (dict_id=151): headword_norm IN (عرف، مرس، درب، دري، در) → 5 نتائج
stage2_evidence:
  per_lemma:
    - lemma: "عُرْف"
      confirm:
        - text: "«المعروف: وهو خلاف النُكر — ما تعارف عليه الناس في عاداتهم ومعاملاتهم»"
          source: "المعجم الوسيط (OCR، entry 18629)"
        - text: "«العرف: ما استقرت النفوس عليه بشهادة العقول، وتلقته الطبائع بالقبول»"
          source: "كتاب التعريفات للشريف الجرجاني (entry 795256)"
        - text: "«العُرف: ما استقرَّت النفوسُ عليه بشهادة العقول وتَلَقَّتْه الطبائع السليمة بالقبول»"
          source: "التعريفات الفقهيّة للبركتي (entry 835180)"
        - text: "«العرف:[في الانكليزية] Use، custom، tradition، convention — بالضم وسكون الراء هو العادة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry 820195)"
        - text: "«عادة درج الناس على اتباعها والعمل بها معتقدين في قوتها الإلزامية»"
          source: "المعجم الموحد لمصطلحات القانون، translation_en: custom (entry 412351)"
        - text: "«عُرف؛ عادة / الاستعمال: طريقة استعمال الألفاظ» — translation_en: usage/custom"
          source: "المورد الحديث (entry 726724)"

    - lemma: "مُمَارَسَة"
      confirm:
        - text: "«translation_en: practice — domain: Educational and Computer Techniques»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (entry 395964)"
        - text: "«translation_en: practice — domain: The Unified Dictionary Of Educational Strategies Terms»"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (entry 731242)"
        - text: "«مجموعة الحيوانات التي تشكل مجال ممارسة الطبيب البيطريّ — translation_en: practice»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (entry 470269)"
      contradicts:
        - text: "«عملية البيع أو الشراء بدون مزايدة ولا مناقصة»"
          source: "المعجم الوسيط (OCR، entry 27227)"
          conflict: "التعريف الكلاسيكي يحصر المُمَارَسَة في معنى قانوني/تجاري ضيّق مغاير تماماً لدلالة المجموعة"

    - lemma: "دُرْبَة"
      confirm:
        - text: "«التَّجْرِبةُ والمِرانُ لإتْقان العَمَل»"
          source: "المعجم الكبير (OCR، entry 86880)"
        - text: "«الدربة: الضراوة والجرأة، والدارب الحاذق بصناعته»"
          source: "التوقيف على مهمات التعاريف للمناوي (entry 813849)"
      expands:
        - text: "«يَقظانُ ما زالَ تُغْنِيه قَريحَتُه / عن التَّجارِبِ يَلْقاهُنَّ والدُّرَبِ» (ابن الرومي)"
          source: "المعجم الكبير (OCR، شاهد شعري على entry 86880)"
          addition: "الشاهد الشعري يقرن دُرَب (جمع دُرْبَة) بالتجارب، مما يؤكد الحقل الدلالي المشترك"

    - lemma: "سُنَّة"
      contradicts:
        - text: "«السُّنَّةُ: مَا واظب عَلَيْهِ رَسُول الله - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم»"
          source: "معجم مقاليد العلوم للسيوطي (entry 807050)"
          conflict: "الدلالة الدينية الراسخة تطغى في الوعي العربي المعاصر على المعنى اللغوي العام، مما يجعل إدراجها في شبكة دلالية علمانية مضللاً"
        - text: "«السُّنَّة:[في الانكليزية] Road، religion، divine law، AL-Sunna (the tradition of the prophet Mohammed)»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry 819912)"
          conflict: "المعاجم المصطلحية ذاتها تُدرج السُّنَّة ضمن المصطلحات الدينية بالدرجة الأولى"
      expands:
        - text: "«السُّنَّةُ: الطريقُ خطَّه أوائلُ الناس, فصار مَسْلَكًا لمن بعدهم — نَهْجٌ أو تصرُّف أو طريقة — العادة السِّيرَةُ, حسَنَةً كانت أو قبيحةً»"
          source: "المعجم الكبير (OCR، entry 48526)"
          addition: "المعنى اللغوي الأصلي صالح دلالياً غير أنه انحسر لصالح الدلالة الدينية في الاستعمال المعاصر"

    - lemma: "مَرَانٌ"
