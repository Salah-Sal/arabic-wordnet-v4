        - text: "«(المران) الرماح الصلبة اللدنة يُقَال تطاعنوا بالمران واحدته مرانة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry 882615)"
          conflict: "تأكيد ثانٍ — المران = الرماح، وليس التدريب"

    - lemma: "دِرَايَة"
      confirm:
        - text: "«الدراية هو معرفة كيفية القيام بشيء ما بسلاسة وكفاءة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — translation_en: know-how (entry 361060)"
        - text: "«translation_en: know-how — domain: Economics»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (entry 401665)"
        - text: "«translation_en: know-how — domain: Information and Communication»"
