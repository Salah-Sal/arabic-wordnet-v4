        وَيَلْزَمُهُ. يُقَالُ دَرِبَ بِالشَّيْءِ، إِذَا لَزِمَهُ، وَلَصِقَ بِهِ. وَمِنْ هَذَا الْبَابِ
        تَسْمِيَتُهُمُ الْعَادَةَ وَالتَّجْرِبَةَ دُرْبَةً»

