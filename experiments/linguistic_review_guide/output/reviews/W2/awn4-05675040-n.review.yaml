# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "عُرْف"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة بأدلة وافرة من المعاجم الكلاسيكية والحديثة على دلالة «ما تعارف
        عليه الناس في عاداتهم». تعبّر مباشرةً عن الجانب الاجتماعي/المؤسسي للمفهوم.
        تحتاج فقط إضافة تشكيل كامل (عُرْف بضم العين وسكون الراء).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الطابع الاجتماعي الجماعي: ما استقرّ الناسُ عليه وتعارفوا في معاملاتهم؛
        يحمل إيحاء بالإلزامية الضمنية الناشئة عن التواضع الجماعي — بخلاف مُمَارَسَة
        (التطبيق الفردي المتكرر) ودُرْبَة (الإتقان الحركي) ودِرَايَة (الإدراك الكيفي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُرْف"

    - lemma: "مُمَارَسَة"
      decision: confirmed
      decision_reason: >
        رغم التعارض في المصادر الكلاسيكية (المعنى القانوني/التجاري)، المصادرُ المعاصرة
        المتخصصة تؤكد بشكل متكرر وفي مجالات متعددة (التربية، الطب، التجارة) مقابلتها
        لـ «practice». والجذر (م-ر-س) الدالّ على الملازمة والمضامّة بقوة يُثبت الأساس
        الاشتقاقي لمعنى التطبيق المتكرر. اللمّة راسخة في الاستعمال المعاصر. تحتاج تشكيلاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على العملية التطبيقية المتكررة ذاتها وما ينشأ عنها من خبرة؛ بينما عُرف
        يُركّز على الناتج الجماعي، ودُرْبَة على الإتقان الفردي الحاصل بالمُلازمة،
        ودِرَايَة على الإدراك الكيفي المكتسب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُمَارَسَة"

    - lemma: "دُرْبَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مؤكَّدة بنصٍّ صريح من المعجم الكبير (OCR) «التجربة والمران لإتقان العمل»، ونصّ
        ابن فارس في المقاييس «تسميتهم العادة والتجربة دُرْبَةً» — وهو أقوى دليل اشتقاقي
        ممكن. يُضاف إليه الشاهد الشعري من ابن الرومي. المعنى يُغطّي الجانب الإتقاني
        المكتسب بالتكرار في المجموعة. التشكيل الصحيح: دُرْبَة (بضم الدال) لا دَرْبَة
        (بفتحها) التي تعني الجرأة وسنام الثور.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على الإتقان والحذق الفردي المُكتسَب بالمداومة على الشيء والإغراء به
        (proficiency)؛ أقرب إلى الجانب الحركي/التطبيقي من know-how، بخلاف دِرَايَة
        (الجانب الإدراكي) وعُرف (الجانب الجماعي).
      actions:
        - command: create_entry
          params:
            lemma: "دُرْبَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "سُنَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم صحة المعنى اللغوي الأصلي (الطريقة المتّبعة، العادة)، الاستعمال الغالب في
        العربية المعاصرة مرتبط بالتراث الديني الإسلامي ارتباطاً حاسماً (سنة النبي).
        إدراجها في شبكة دلالية علمانية يُوجد تعارضاً ثقافياً واضحاً ويُشوّش على
        المستخدمين. تعارض ثقافي مانع من الإدراج.

    - lemma: "مَرَانٌ"
      source: stage1
      decision: removed
      decision_reason: >
        خطأ في التوليد الاشتقاقي: (مَرَانٌ / المُرَّانُ) يعني في جميع المعاجم الرماح
        الصلبة اللدنة حصراً، وليس المداومة على التدريب أو الإتقان. الاشتقاق الصحيح
        من الجذر (م-ر-ن) لمعنى التدريب والمداومة هو «تَمْرِين» (مصدر فعّل).

    - lemma: "دِرَايَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مؤكَّدة بدليل شبه مطابق للتعريف من مصدر ALECSO: «الدراية هو معرفة كيفية القيام
        بشيء ما بسلاسة وكفاءة». مستعملة في مصادر عربية معاصرة متعددة بمعنى know-how.
        والجذر (دَرَى/يَدْرِي) يدلّ مباشرةً على العلم والمعرفة الوثيقة بالأمر. هي الأدق
        تعبيراً عن التعريف الأصلي للمجموعة بين جميع اللمّات.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على الجانب الإدراكي/المعرفي لكيفية أداء الأمور (know-how بمعنى العلم
        بالكيفية)؛ أدقّ المصطلحات الأربعة تعبيراً عن التعريف، دون أن تحمل الطابع
        الجماعي (عُرف) أو التركيز على الإتقان الحركي (دُرْبَة) أو العملية التطبيقية
        (مُمَارَسَة).
      actions:
        - command: create_entry
          params:
            lemma: "دِرَايَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معرفة كيفية القيام بشيء ما عادة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية ضعيفة البنية؛ عبارة «القيام بشيء ما» مشتركة مبهمة،
        وكلمة «عادة» معلّقة في النهاية دون ربط نحوي واضح. يحتاج إلى تعريف مصطلحي
        يُحدّد الجنس القريب (نوع من الإدراك) والفصل النوعي (تعلّقه بالكيفية المعتادة
        المتعارف عليها).
    authored:
      - type: terminological
        text: "إِدْرَاكٌ بكيفية أداء الأمور على الوجه المعتاد والمتعارف عليه بين الناس"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "معرفةٌ عمليةٌ راسخةٌ بطريقة إنجاز الأشياء وفق ما جرى به العُرف والعادة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "إِدْرَاكٌ بكيفية أداء الأمور على الوجه المعتاد والمتعارف عليه بين الناس"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "معرفةٌ عمليةٌ راسخةٌ بطريقة إنجاز الأشياء وفق ما جرى به العُرف والعادة"

  examples:
    per_lemma:
