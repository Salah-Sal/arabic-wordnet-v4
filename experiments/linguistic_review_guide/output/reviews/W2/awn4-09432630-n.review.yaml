  generation_notes: "المصطلح الأصلي ترجمة حرفية، وتم استخراج البدائل من المعاجم العلمية والقواميس ثنائية اللغة."

step1_lemma_validation:
  per_lemma:
    - lemma: "خط التلال"
      decision: removed
      decision_reason: "مركب إضافي يمثل ترجمة حرفية للمصطلح الإنجليزي (ridgeline) ولم يثبت معجميا، والأفصح والأشيع استخدام مصطلح (حيد) أو (سلسلة تلال)."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "تعبير مترجم حرفياً يقصد به الامتداد الخطي للمرتفعات، لكنه يفتقر إلى الأصالة والاستقرار المعجمي."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حَيْد"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح علمي وتراثي دقيق ومعتمد في مجامع اللغة للإشارة إلى المرتفعات الممتدة كالسلسلة."
      step05_citation: "«الحَيْد: تل منخفض متطاول» — المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الحيد هو المرتفع الطويل والضيق الشاخص كالحرف من الجبل أو في قاع المحيط، ويغلب عليه الاستعمال العلمي الطبوغرافي."
      example: "سار المتسلقون على طول الحيد الجبلي للوصول إلى القمة."
      actions:
        - command: create_entry
          params:
            lemma: "حَيْد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09432630-n"

    - lemma: "سلسلة تلال"
      source: step05
      decision: confirmed
      decision_reason: "تركيب إضافي فصيح ومستعمل ومطابق تماماً لتعريف المجموعة الترادفية."
      step05_citation: "«سلسلة تلال أو جبال» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      mwe_check:
        is_mwe: true
        accepted: true
      nuance_differentiation: "السلسلة تدل على تتابع التلال واتصالها ببعضها في خط ممتد، وهو تعبير وصفي أعم وأكثر تداولاً في السياق العام."
      example: "تفصل سلسلة تلال بين السهول الساحلية والمناطق الداخلية."
      actions:
        - command: create_entry
          params:
            lemma: "سلسلة تلال"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09432630-n"

