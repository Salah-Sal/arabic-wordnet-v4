stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جداً ولا يوضح الطبيعة البيولوجية للعملية كآلية لحفظ النوع."
      - "اللمّات تفتقر إلى التشكيل الكامل لتجنب اللبس."
    observations: "المجموعة تعبر عن المفهوم الأحيائي لإنتاج النسل، والمصطلحات الشائعة كـ 'تكاثر' و 'تناسل' دقيقة وتعكس أبعاداً مختلفة للمفهوم كالزيادة العددية وامتداد السلالة."
  blind_candidates:
    - lemma: "إِخْلَاف"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (خ ل ف) للتعبير عن ترك خلف أو نسل، وهو استخدام مجازي للمفهوم."
    - lemma: "إِنْجَاب"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ن ج ب) على وزن إفعال، وهو من أشهر المصطلحات الدالة على إنتاج الذرية."
    - lemma: "إِنْسَال"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ن س ل) على وزن إفعال، بمعنى إنتاج النسل وتوليده."
    - lemma: "تَفْرِيخ"
      generation_method: majaz
      justification: "مستعار من عملية فقس البيض، ويستخدم مجازاً للدلالة على الإكثار والإنتاج الغزير للنسل."

stage2_evidence:
  per_lemma:
    - lemma: "تكاثر"
      confirm:
        - text: "عملية متميزة ومميزة، تتكون من عدد من الراحل وتستلزم العديد من الشروط، لكنها أساس استمرار الحياة وتطورها، إذ تمكن الكائنات الحية من إنتاج مثيلاتها"
          source: "مسرد المناخ والبيئة، عرب تيرم"
        - text: "reproduction"
          source: "المعجم الطبي الموحد"
    - lemma: "تناسل"
      confirm:
        - text: "(تناسل) الْقَوْم تَوَالَدُوا وأنسل بَعضهم بَعْضًا وَبَنُو فلَان كثر نسلهم"
          source: "المعجم الوسيط"
    - lemma: "إنجاب"
      confirm:
        - text: "procreation"
          source: "المعجم الطبي الموحد"
    - lemma: "إنسال"
      evidence_status: "no_material_found"
    - lemma: "إخلاف"
      evidence_status: "no_material_found"
    - lemma: "تفريخ"
      contradicts:
        - text: "sprouting, hatching"
          source: "المعجم الطبي الموحد"
          conflict: "يقتصر على معنى الفقس والتبرعم، ولا يعبر عن عملية التكاثر الكلية"

stage3_analysis:
  per_lemma:
    - lemma: "تكاثر"
      decision: confirmed
      decision_reason: "مصطلح بيولوجي معتمد وشائع للدلالة على عملية الإكثار وإنتاج النسل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَاثُر"
    - lemma: "تناسل"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومعتمد يدل على توالد الأجيال وامتداد النسل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنَاسُل"
    - lemma: "إنجاب"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد ومستعمل بكثرة للتعبير عن إنتاج الذرية، وقد أقرته المعاجم المتخصصة لمفهوم procreation."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِنْجَاب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "إنسال"
      source: stage1
      decision: removed
      decision_reason: "عدم ورود أدلة معجمية كافية تدعم استخدامه كمصطلح مسكوك لهذا المفهوم مقارنة باللمّات الأخرى."
    - lemma: "إخلاف"
      source: stage1
      decision: removed
      decision_reason: "استخدام غير شائع في السياق العلمي والبيولوجي الدقيق."
    - lemma: "تفريخ"
      source: stage1
      decision: removed
      decision_reason: "يقتصر في المعاجم على الإفراخ والتفقيس للطيور ونحوها ولا يشمل المعنى العام البيولوجي لإنتاج النسل."

stage4_content:
  definition:
    current: "عملية توليد النسل"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جدًا. المراجعة تقدم تعريفاً اصطلاحياً دقيقاً يوضح الجنس القريب (عملية حيوية) والفصل النوعي (إنتاج أفراد من نفس النوع لحفظ السلالة)."
    authored:
      - type: terminological
        text: "عملية حيوية تقوم من خلالها الكائنات الحية بإنتاج أفراد جديدة من نفس النوع لضمان استمرار النسل وحفظه من الانقراض."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية حيوية تقوم من خلالها الكائنات الحية بإنتاج أفراد جديدة من نفس النوع لضمان استمرار النسل وحفظه من الانقراض."}
  examples:
    per_lemma:
      - lemma: "تَكَاثُر"
        examples:
          - text: "تعد القدرة على التكاثر من أهم خصائص الكائنات الحية."
            type: usage
      - lemma: "تَنَاسُل"
        examples:
          - text: "يدرس علم الوراثة طرق التناسل وانتقال الصفات عبر الأجيال المتتابعة."
            type: usage
      - lemma: "إِنْجَاب"
        examples:
          - text: "يُعَدُّ الإنجاب ضرورة لاستمرار الوجود البشري."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تعد القدرة على التكاثر من أهم خصائص الكائنات الحية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يدرس علم الوراثة طرق التناسل وانتقال الصفات عبر الأجيال المتتابعة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعَدُّ الإنجاب ضرورة لاستمرار الوجود البشري."}

stage5_enrichment:
  per_entry:
    - lemma: "تَكَاثُر"
      entry_id: "{auto}"
      root: "كثر"
      maqayis_quote: "«الْكَافُ وَالثَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ خِلَافَ الْقِلَّةِ. مِنْ ذَلِكَ الشَّيْءُ الْكَثِيرُ»"
    - lemma: "تَنَاسُل"
      entry_id: "{auto}"
