    - lemma: "إِنْجَاب"
      entry_id: "{auto}"
      root: "نجب"
      maqayis_quote: "«النُّونُ وَالْجِيمُ وَالْبَاءُ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى خُلُوصِ شَيْءٍ وَكَرَمٍ... الْأُوَلُ النَّجَابَةُ: مَصْدَرُ الرَّجُلِ النَّجِيبِ، أَيِ الْكَرِيمِ»"
