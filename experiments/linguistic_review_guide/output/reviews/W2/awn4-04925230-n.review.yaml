        دلالة التعددية والشبكية (كل جزء يرتبط بسواه) بخلاف «اتصال» الذي يُحيل
        على اتحاد طرفين. يُستعمل في السياق الفلسفي الحديث للدلالة على «تداعي
        المعاني»، مما يُضفي عليه بُعداً ذهنياً/معرفياً غائباً في «اتصال».

