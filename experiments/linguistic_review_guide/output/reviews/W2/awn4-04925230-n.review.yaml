  definition:
    current: "خاصية كون الشيء متصلاً أو الدرجة التي يمتلك بها الشيء اتصالات"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دائري: يستخدم «متصلاً» و«اتصالات» لتعريف مجموعة إحدى لمّاتها
        «اتصال»، مما يُشكِّل دوراناً معجمياً. كذلك هو ترجمة حرفية للإنجليزية، خالٍ
        من الجنس القريب والفصل النوعي الحقيقيَّين. يحتاج إلى تعريف مصطلحي مُؤلَّف
        بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
