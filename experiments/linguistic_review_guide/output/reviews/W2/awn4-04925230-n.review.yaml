# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائري: يستخدم «متصلاً» و«اتصالات» لتعريف مجموعة تضم «اتصال» أحد لمّاتها."
      - "«ترابط» في المعاجم المعيارية (الوسيط، الكبير) يُحيل على «قيام علاقة بين مدركين لاقترانهما في الذهن» وهو المفهوم الفلسفي لتداعي المعاني، لا خاصية الاتصال الشبكي."
      - "«اتصال» في المعجمية التقنية الحديثة (أربتيرم) يُترجم بـ communication لا connectivity، مما يولّد اشتراكاً لفظياً مع مفهوم التواصل."
      - "كلتا اللمّتين مجرَّدتان من التشكيل في سجل AWN4."
    observations: >
      المجموعة تُعبِّر عن مفهوم «connectivity» بمعنييه: (أ) الخاصية المجردة لكون الشيء
      واصلاً بغيره، و(ب) درجة الروابط التي يمتلكها كيان ما في شبكة أو منظومة.
      هذا المفهوم حاضر في الفلسفة العربية تحت مصطلح «الاتصال» بمعناه الفيزيائي/المنطقي
      (اتحاد الأشياء بعضها ببعض)، غير أن الاستعمال التقني الحديث أفقده هذه الدلالة
      لصالح «communication». أما «ترابط» فيُعبِّر عن الترابط الفلسفي بين المدركات أو
      الارتباط الإحصائي (correlation) في السياق التقني. اللمّة الأدق للمفهوم المعلوماتي
      الحديث هي «ترابطية» المُثبَّتة في معجم مصطلحات المعلوماتية (2000) بالترجمة
      الصريحة connectivity.

  blind_candidates:
    - lemma: "وَصْلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من جذر وصل على وزن فَعْلِيَّة (مصدر صناعي) للدلالة على الخاصية المجردة.
        وزن فَعْلِيَّة مُنتج لتحويل المصادر إلى خصائص مجردة، مثل: حريّة، أصليّة، مرونة.
        تُعبِّر الوَصْلِيَّة عن «خاصية الوصل» دون تداخل مع «الاتصال» الذي طغت عليه دلالة
        التواصل الاتصالي (communication).
    - lemma: "تَرَابُطِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من تَرَابُط (مصدر تَفَاعَلَ من ربط) بإلحاق ياء النسب المُعرَّفة (-يَّة)
        لتحويله إلى خاصية مجردة. أصيلة في العربية ومقيسة وصوغها على نمط المصطلحات
        المعاصرة (اشتقاقيَّة، تناصِّيَّة، ترادفيَّة). تُعبِّر تحديداً عن خاصية
        الترابط المتبادل بين عناصر المنظومة.
    - lemma: "تَعَالُق"
      generation_method: majaz
      justification: >
        من جذر علق (تَعَالَق: تعلّق بعضها ببعض بمجاز الاشتباك). يُحيي معنى التشابك
        والالتصاق المتبادل الذي تضمّنه الجذر القديم. المجاز الدلالي: كما أن الأشياء
        المتعالقة تمسك بعضها ببعض فلا تنفك، كذلك الشبكة المتصلة تتماسك عناصرها.
        الصيغة تفاعلية تُفيد المشاركة والاشتراك.
    - lemma: "اِتِّصَالِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من اِتِّصَال (مصدر افتعل من وصل) بإلحاق ياء النسبة الصناعية (-يَّة)
        للدلالة على الخاصية المجردة. تُميَّز دلالياً عن «اتصال» (الحدث/العملية)
        بكونها اسم الخاصية لا اسم الحدث، على نمط: اتزان ← اتزانية، اتساق ← اتساقية.


