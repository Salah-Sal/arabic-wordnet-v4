        الآني أو الاستمرارية غير المنقطعة. يُركِّز على الجانب الوجودي والبنيوي
        (كون الشيء متصلاً)، أكثر من تركيزه على الخاصية القابلة للقياس الكمي.
        أقدم المصطلحين في الاستخدام الفلسفي العربي.

    - lemma: "تَرَابُط"
