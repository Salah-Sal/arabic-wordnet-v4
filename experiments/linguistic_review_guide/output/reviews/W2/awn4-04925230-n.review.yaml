        البُعد التقني والشبكي (درجة الاتصال، قدرة الأنظمة على التواصل). بينما
        «اتصال» و«ترابط» يُحيلان على الحالة أو النتيجة، تُحيل «ترابطية» على
        الخاصية ذاتها كمقياس للنظام. الأنسب في السياقات التقنية والرياضية
        (connectivity in graph theory, network connectivity).

