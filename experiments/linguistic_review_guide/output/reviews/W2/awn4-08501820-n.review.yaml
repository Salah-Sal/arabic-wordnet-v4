stage1_review:
  assessment:
    concerns:
      - "خلو اللمة الحالية من التشكيل."
    observations: "اللمة «طاجيك» هي التعريب الصحيح والمعتمد والمستخدم على نطاق واسع للدلالة على هذه المجموعة العرقية، وهي تُعامل في العربية معاملة اسم الجمع (مثل: عرب، ترك، فرس)."
  blind_candidates:
    - lemma: "طَاجِيك"
      generation_method: taarib
      justification: "التعريب المباشر لاسم العرقية، ويُستخدم كاسم جمع للدلالة على الشعب."
    - lemma: "طَاجِيكِيّ"
      generation_method: taarib
      justification: "النسبة إلى طاجيك، ويُستخدم للدلالة على الفرد أو العرقية."
    - lemma: "شَعْبُ الطَّاجِيكِ"
      generation_method: tarkib
      justification: "تركيب إضافي يوضح الدلالة على المجموعة العرقية ككل."
    - lemma: "قَوْمُ الطَّاجِيكِ"
      generation_method: tarkib
      justification: "تركيب إضافي مرادف."

