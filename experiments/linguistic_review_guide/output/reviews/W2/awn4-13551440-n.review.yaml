stage1_review:
  assessment:
    concerns: []
    observations: "اللمتان (إباضة) و(تبويض) دقيقتان وتعبران عن المفهوم الطبي بشكل سليم. (إباضة) هي المصطلح الطبي القياسي، بينما (تبويض) مصطلح شاع استخدامه وأقره مجمع اللغة العربية كاشتقاق من الاسم الجامد (بويضة). التعريف الحالي مقبول، ولكن لفظ (طرد) يبدو غير دقيق طبيا والأفضل استخدام (إطلاق) أو (خروج)."
  blind_candidates:
    - lemma: "إِبَاضَة"
      generation_method: ishtiqaq
      justification: "مصدر قياسي على وزن (إفعالة) من الفعل (أباض) ليدل على إخراج البيضة، وهو المصطلح الطبي المعتمد."
    - lemma: "تَبْوِيض"
      generation_method: ishtiqaq
      justification: "مصدر على وزن (تفعيل)، مُشتق من الاسم الجامد (بويضة)، وهو شائع الاستخدام في التثقيف الطبي."
    - lemma: "إِفْرَازُ البُوَيْضَة"
      generation_method: tarkib
      justification: "تركيب إضافي يصف العملية الفسيولوجية لخروج البويضة، ولكنه أقرب للوصف من كونه مصطلحا."
    - lemma: "نُزُولُ البُوَيْضَة"
      generation_method: tarkib
      justification: "تركيب إضافي دارج في اللغة اليومية للتعبير عن عملية الإباضة."

stage2_evidence:
  per_lemma:
    - lemma: "إباضة"
      confirm:
        - text: "«عملية خروج البويضة (أمشاج الإناث) من المبيض.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«إخراج البيضة الناتجة من جُريب المبيض إلى سطحه ومن هناك تجذبها عادة الأطراف المهدبة لقناة فالوب.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة"
    - lemma: "تبويض"
      confirm:
        - text: "«عمليَّة التَّبْويض خاصّة بالأنثى [فصيحة] التعليق: اعتمد مجمع اللغة المصري على كثرة اشتقاق العرب من الأسماء الجامدة ... ويخرج لفظ «تَبْويض» على أنه اشتقاق من البويضة.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"

stage3_analysis:
  per_lemma:
    - lemma: "إباضة"
      decision: confirmed
      decision_reason: "المصطلح الطبي المعياري المعتمد في المعاجم العلمية المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِبَاضَة"

    - lemma: "تبويض"
      decision: confirmed
      decision_reason: "مصطلح صحيح فصيح أقرّه مجمع اللغة العربية بالقاهرة على أنه اشتقاق من الاسم الجامد (بويضة)، وهو شائع الاستخدام جداً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبْوِيض"

stage4_content:
  definition:
    current: "طرد البويضة من المبيض (عادة في منتصف الدورة الشهرية)"
    assessment:
      decision: revise
      reason: "استبدال كلمة (طرد) بـ (إطلاق) أو (خروج) لأنها أدق من الناحية الطبية والفسيولوجية، ولجعل الصياغة أقرب للأسلوب المعجمي."
    authored:
      - type: terminological
        text: "عملية إطلاق البويضة الناضجة من المبيض، وتحدث عادة في منتصف الدورة الشهرية في إناث الثدييات."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية إطلاق البويضة الناضجة من المبيض، وتحدث عادة في منتصف الدورة الشهرية في إناث الثدييات."

  examples:
    per_lemma:
      - lemma: "إباضة"
        examples:
          - text: "تزداد احتمالية حدوث الحمل إذا تم الإخصاب خلال فترة الإِبَاضَة."
            type: usage
      - lemma: "تبويض"
        examples:
          - text: "تتابع بعض النساء أيام التَّبْوِيض لتحديد فترة الخصوبة القصوى."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تزداد احتمالية حدوث الحمل إذا تم الإخصاب خلال فترة الإِبَاضَة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتابع بعض النساء أيام التَّبْوِيض لتحديد فترة الخصوبة القصوى."

