stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'ماضي' تفتقر إلى التشكيل."
      - "المجموعة فقيرة جداً باللمّات، حيث لا تضم سوى لمة واحدة."
    observations: "المجموعة تعبر عن مفهوم 'الزمن الماضي' أو 'الماضي' كاسم (Past). اللمة الحالية صحيحة لكنها تحتاج إلى ضبط وإثراء بمرادفات عربية فصيحة تعبر عن ظلال دلالية مختلفة لهذا المفهوم."
  blind_candidates:
    - lemma: "المَاضِي"
      generation_method: ishtiqaq
      justification: "الاسم القياسي المشتق من (م ض ي) للدلالة على الزمن الذي ذهب."
    - lemma: "الغَابِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (غ ب ر) يُستخدم للتعبير عن الزمن البعيد المنقضي."
    - lemma: "السَّالِف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (س ل ف) يعبر عن الزمن المتقدم أو السابق."
    - lemma: "الأَمْس"
      generation_method: majaz
      justification: "استعمال مجازي لليوم السابق للتعبير عن كل ما مضى من الزمن."

stage2_evidence:
  per_lemma:
    - lemma: "ماضي"
      confirm:
        - text: "«(الْمَاضِي) الزَّمَان الذَّاهِب يُقَال كَانَ ذَلِك فِي الزَّمَان الْمَاضِي»"
          source: "المعجم الوسيط"
        - text: "«الماضي: الدال على اقتران حدث بزمان قبل زمانك.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "الغَابِر"
      confirm:
        - text: "«والماضي يُقَال كَانَ ذَلِك فِي الزَّمَن الغابر»"
          source: "المعجم الوسيط"
        - text: "«الغابر: الماضي والباقي (ضِد)»"
          source: "التعريفات الفقهية للبركتي"
    - lemma: "السَّالِف"
      confirm:
        - text: "«السَّالِف: المتقدِّم»"
          source: "المعجم الكبير"
        - text: "«سَالِف: من (س ل ف) المتقدم والسابق.»"
          source: "موسوعة السلطان قابوس"
    - lemma: "المُنْصَرِم"
      confirm:
        - text: "«(1) منصرم؛ منقضٍ منذ عهد قريب for the past»"
          source: "المورد الحديث"
        - text: "«زمان ذاهب منصرم، عكسه مُقبل أو قادم»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "الأَمْس"
      confirm:
        - text: "«(أمس) الْيَوْم الَّذِي قبل الْيَوْم الْحَاضِر وَقد يدل على الْمَاضِي مُطلقًا»"
          source: "المعجم الوسيط"
        - text: "«وقد يُطلق على الماضي عامّةً على سبيل المجاز»"
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "ماضي"
      decision: confirmed
      decision_reason: "اللمة الأساسية للمفهوم، تم تأكيدها في المعاجم كاسم للزمن الذاهب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "المَاضِي"
    - lemma: "الغَابِر"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح يُستخدم للتعبير عن الزمن الماضي، وخاصة البعيد منه، وهو من الأضداد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "الغَابِر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15145765-n"}
    - lemma: "السَّالِف"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الزمن المتقدم والسابق، وهو كثير الاستعمال في التركيب 'السالف من الزمان'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "السَّالِف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15145765-n"}
    - lemma: "المُنْصَرِم"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم للتعبير عن الزمن الذي انقضى وانقطع لتوه عن الحاضر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "المُنْصَرِم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15145765-n"}
    - lemma: "الأَمْس"
      source: stage1
      decision: confirmed
      decision_reason: "استعمال مجازي واسع الانتشار للتعبير عن الماضي في مقابلة الحاضر (اليوم) والمستقبل (الغد)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "الأَمْس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15145765-n"}

stage4_content:
  definition:
    current: "الزمن الذي انقضى"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً، ويحتاج إلى صياغة معجمية أكثر دقة وشمولاً."
    authored:
      - type: linguistic
        text: "الزمنُ الذَّاهبُ المنقضي، وهو مجموع الأوقاتِ السابقةِ على الحاضرِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-15145765-n", definition_index: 0, text: "الزمنُ الذَّاهبُ المنقضي، وهو مجموع الأوقاتِ السابقةِ على الحاضرِ."}
  examples:
    per_lemma:
      - lemma: "المَاضِي"
        examples:
          - text: "لا تَبْكِ على المَاضِي بل اتَّعِظْ منه لِبناءِ مُستقبلِكَ."
            type: usage
      - lemma: "الغَابِر"
        examples:
          - text: "دَرَسَ المؤرِّخُ أحداثَ الزَّمنِ الغَابِرِ وما فيه من عِبَرٍ."
            type: usage
      - lemma: "السَّالِف"
        examples:
          - text: "كانَ النَّاسُ في سَالِفِ الدَّهْرِ يَعِيشُونَ حَيَاةً بَسِيطَةً وهادِئَةً."
            type: usage
      - lemma: "المُنْصَرِم"
        examples:
          - text: "تَحَقَّقَتْ إنجازاتٌ اقْتصاديَّةٌ كَبيرةٌ في العَامِ المُنْصَرِمِ."
            type: usage
      - lemma: "الأَمْس"
        examples:
          - text: "نَسِيَ بَعضُ النَّاسِ آلامَ الأَمْسِ مَعَ إشراقَةِ اليَوْمِ الجَديدِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-15145765-n", text: "الماضي مدرسةٌ لمن أرادَ أن يتعلمَ الحكمةَ."}

stage5_enrichment:
  per_entry:
    - lemma: "المَاضِي"
      entry_id: "{auto}"
      root: "مضي"
      maqayis_quote: "«الْمِيمُ وَالضَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نَفَاذٍ وَمُرُورٍ. وَمَضَى يَمْضِي مُضِيَّا.»"
    - lemma: "الغَابِر"
      entry_id: "{auto}"
      root: "غبر"
      maqayis_quote: "«الْغَيْنُ وَالْبَاءُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى الْبَقَاءِ...»"
    - lemma: "السَّالِف"
      entry_id: "{auto}"
      root: "سلف"
      maqayis_quote: "«السِّينُ وَاللَّامُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى تَقَدُّمٍ وَسَبْقٍ. مِنْ ذَلِكَ السَّلَفُ: الَّذِينَ مَضَوْا.»"
    - lemma: "المُنْصَرِم"
      entry_id: "{auto}"
      root: "صرم"
      maqayis_quote: "«الصَّادُ وَالرَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ صَحِيحٌ مُطَّرِدٌ، وَهُوَ الْقَطْعُ...»"
    - lemma: "الأَمْس"
      entry_id: "{auto}"
      root: "أمس"
      maqayis_quote: "«(لم يُذكر الجذر في المقاييس مستقلاً، وهو في المعاجم اسم للوقت القريب قبل اليوم الحاضر)»"
  per_sense:
