# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07962404-n
# المفهوم: people who are still living — الناس الذين لا يزالون على قيد الحياة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «أحياء» بدون تشكيل — يجب إضافة التشكيل الكامل: أَحْيَاء"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو أمر مقبول لأن المفهوم بسيط والتعبير العربي واحد راسخ"
      - "لفظة أحياء متعددة الدلالة: جمع حَيّ (ضد الميت)، وجمع حَيّ (بطن من بطون العرب)، واسم مكان. السياق يحدد المراد"
    observations: "المفهوم يدل على الناس الذين هم على قيد الحياة مقابل الأموات. وهو مفهوم أصيل في العربية ورد في القرآن الكريم مراراً: ﴿وَلَا تَقُولُوا لِمَنْ يُقْتَلُ فِي سَبِيلِ اللَّهِ أَمْوَاتٌ بَلْ أَحْيَاءٌ﴾. اللفظة «أحياء» هي الجمع القياسي لـ«حَيّ» على وزن أَفْعِلاء (المعتل)، وهي التعبير العربي الوحيد الثابت لهذا المفهوم الجماعي."
  blind_candidates:
    - lemma: "أَحْيَاء"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«حَيّ» على وزن أَفْعَال، من الجذر ح ي ي، وهو الجمع المعروف للدلالة على من هم على قيد الحياة مقابل الأموات"
    - lemma: "عَائِشُون"
      generation_method: ishtiqaq
      justification: "جمع مذكر سالم لاسم الفاعل «عائش» من عَاشَ يَعِيش، بمعنى من يحيا ويعيش"
    - lemma: "أَهْلُ الحَيَاةِ"
      generation_method: tarkib
      justification: "تركيب إضافي يدل على أصحاب الحياة، أي الذين لا يزالون أحياء"
    - lemma: "بَاقُون"
      generation_method: majaz
      justification: "مجاز من البقاء بمعنى الاستمرار في الحياة، جمع مذكر سالم لـ«باقٍ»"

stage2_evidence:
  per_lemma:
    - lemma: "أَحْيَاء"
      confirm:
        - text: "«أَحْياءُ — الجذر: ح ي ي — مثال: الشُّهَداءُ أَحْيَاءُ عند ربهم — تستحق كلمة أحياء الصرف؛ لأنَّ همزتها منقلبة عن أصل، فهي ليست زائدة كما توهَّمها من منعها من الصرف، ووزنها: أَفْعال»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«الأَحياءُ: جمع حيّ من أحياء العرب، أو حيّ ضد الميت»"
          source: "معجم البلدان لياقوت الحموي"
        - text: "«والحَيُّ من كل شيء: نقيض الميت. والجمع أحياء. وقوله تعالى: ﴿ومَا يستَوِي الأحياءُ ولا الأمواتُ﴾ فسره ثعلب فقال: الحيّ هو المسلم والميت هو الكافر... وقوله عز وجل: ﴿ولا تقولوا لمن يقتل في سبيل الله أموات بل أحياء﴾»"
          source: "المحكم والمحيط الأعظم لابن سيده"
        - text: "«الحَيُّ: ضِدُّ المَيِّتِ ج: أحْياء»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الحَيُّ: كل متكلم ناطق... الواحد من أحياء العرب أو البطن من بطونهم»"
          source: "المعجم الكبير"
        - text: "«الواحد من أحياء العرب نقيض الميت»"
          source: "كتاب العين"
      expands:
        - text: "«عِلْمُ الأحياء biology: هو العلمُ الذى يَبْحَثُ في دراسة الكائنات الحَيَّة والحياة في جميع صُورِها»"
          source: "المعجم الكبير"
          addition: "دلالة اصطلاحية حديثة لـ«الأحياء» في سياق العلوم الطبيعية"
        - text: "«أحياء أحفورية، أحياء مستحاثية: أحياء انحدرت من أصول قديمة جدا دون تغير يذكر ولا تزال تعيش إلى الآن»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          addition: "استعمال اصطلاحي لـ«أحياء» بمعنى كائنات حية عموماً لا بشر فقط"
    - lemma: "عَائِشُون"
      evidence_status: "no_material_found"
    - lemma: "أَهْلُ الحَيَاةِ"
      evidence_status: "no_material_found"
    - lemma: "بَاقُون"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أَحْيَاء"
      decision: confirmed
      decision_reason: "لمّة ثابتة مؤيَّدة بأدلة معجمية وافرة من المعاجم الكلاسيكية والحديثة. أحياء جمع حَيّ هو التعبير العربي الأصيل الوحيد للدلالة على الناس الذين هم على قيد الحياة، وقد ورد في القرآن الكريم والحديث الشريف والشعر العربي"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَحْيَاء"

    - lemma: "عَائِشُون"
      source: stage1
      decision: removed
      decision_reason: "ليس مصطلحاً مسكوكاً ولا تعبيراً ثابتاً. «عائشون» جمع مذكر سالم لاسم الفاعل «عائش»، وهو وصف نحوي حرّ لا يُستعمل اسماً جمعياً للدلالة على الأحياء من الناس. لم تُوجد له أدلة معجمية"

    - lemma: "أَهْلُ الحَيَاةِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حرّ يفشل في اختبار السكّ المعجمي — يمكن إبدال «أهل» بـ«أصحاب» أو «ذوو» ويبقى التعبير صالحاً كوصف، مما يدل على أنه ليس وحدة معجمية ثابتة"

    - lemma: "بَاقُون"
      source: stage1
      decision: removed
      decision_reason: "انزياح دلالي غير دقيق. «باقون» تدل على الاستمرار والبقاء عموماً لا على كون المرء حياً بالتحديد. يمكن أن يبقى شيء غير حيّ (مثل: الأثر الباقي). لا يصلح بديلاً دقيقاً لـ«أحياء»"

