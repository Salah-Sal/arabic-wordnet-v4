stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (انفصال) صحيحة لغوياً وعلمياً، ولكن في علم الوراثة هناك مصطلحات أكثر دقة وتخصصاً مثل (انعزال) الذي ارتبط بقوانين مندل (قانون الانعزال)."
    observations: "المفهوم يشير إلى عملية (Segregation) في سياق الانقسام المنصف. الترجمة الأشهر والمستقرة هي (انعزال)، كما يستخدم مصطلح (توزع) أيضاً."
  blind_candidates:
    - lemma: "انْعِزَال"
      generation_method: ishtiqaq
      justification: "اشتقاق من (عزل) على وزن (انفعال) للدلالة على انفصال الأليلات عن بعضها وانفرادها، وهو المصطلح القياسي في علم الوراثة المندلية."
    - lemma: "تَوَزُّع"
      generation_method: ishtiqaq
      justification: "اشتقاق من (وزع) على وزن (تفعّل) للدلالة على طريقة قسمة الأليلات وانتقالها إلى الأمشاج المختلفة."
    - lemma: "تَفَرُّق"
      generation_method: majaz
      justification: "نقل دلالي من التفرق الحسي المادي ليدل على الافتراق البيولوجي بين الكروموسومات."
    - lemma: "افْتِرَاق"
      generation_method: majaz
      justification: "نقل دلالي من الافتراق العام ليدل على العملية الحيوية."

stage2_evidence:
  per_lemma:
    - lemma: "انفصال"
      confirm:
        - text: "عملية انفصال الأشياء، وفي علم الناسلات تطلق على تباعد الصبغيات في أول طور من الانقسام."
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
    - lemma: "انعزال"
      confirm:
        - text: "segregation"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "توزع"
      confirm:
        - text: "انفصال عضوي زوج ما من مورثات أو صبغيات، على سبيل المثال في الانقسام الميوزيّ."
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
    - lemma: "تفرق"
      expands:
        - text: "الشيء: تبدَّدَ الرجلان: ذهب كلٌّ منهما في طريق"
          source: "المعجم الوسيط"
    - lemma: "افتراق"
      expands:
        - text: "الافتراق: كون الجوهرين في حيزين بحيث يمكن التفاضل بينهما."
          source: "كتاب التعريفات للشريف الجرجاني"

stage3_analysis:
  per_lemma:
    - lemma: "انْفِصَال"
      decision: confirmed
      decision_reason: "مصطلح دقيق ومستخدم في السياقات الطبية والعلمية لوصف تباعد الصبغيات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْفِصَال"
    - lemma: "انْعِزَال"
      source: stage1
      decision: confirmed
      decision_reason: "وهو المصطلح الأشهر في علم الوراثة المندلية (Mendelian segregation) ويُدرَّس كقانون الانعزال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "انْعِزَال", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَوَزُّع"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد في معاجم علم الوراثة للتعبير عن توزع الأليلات على الأمشاج."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَوَزُّع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَفَرُّق"
      source: stage1
      decision: removed
      decision_reason: "كلمة عامة تفتقر إلى التخصيص العلمي المطلوب، وهناك مصطلحات أكثر دقة."
    - lemma: "افْتِرَاق"
      source: stage1
      decision: removed
      decision_reason: "مصطلح يميل إلى الاستخدام في الفلسفة والكلام القديم، ولا يشيع في علم الوراثة."

stage4_content:
  definition:
    current: "(علم الوراثة) انفصال الأليلات المزدوجة أثناء الانقسام المنصف بحيث تظهر أعضاء كل زوج من الأليلات في أمشاج مختلفة"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويشرح المفهوم العلمي بصورة ممتازة."
  examples:
    per_lemma:
      - lemma: "انْفِصَال"
        examples:
          - text: "يحدث انفصال الأليلات المزدوجة خلال مرحلة الانقسام المنصف."
            type: usage
      - lemma: "انْعِزَال"
        examples:
          - text: "ينص قانون الانعزال لمندل على أن كل زوج من الجينات ينفصل أثناء تكوين الأمشاج."
            type: usage
      - lemma: "تَوَزُّع"
        examples:
          - text: "يؤدي توزع الصبغيات العشوائي أثناء الانقسام الخلوي إلى زيادة التنوع الوراثي."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يحدث انفصال الأليلات المزدوجة خلال مرحلة الانقسام المنصف."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "ينص قانون الانعزال لمندل على أن كل زوج من الجينات ينفصل أثناء تكوين الأمشاج."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يؤدي توزع الصبغيات العشوائي أثناء الانقسام الخلوي إلى زيادة التنوع الوراثي."}

