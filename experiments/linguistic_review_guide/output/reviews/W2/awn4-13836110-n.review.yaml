# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13836110-n (fatherhood / paternity)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحوي لمّة واحدة فقط (أُبُوَّة)، وقد يكون من المفيد إثراؤها بمرادفات أو مصطلحات قريبة"
      - "التعريف العربي الحالي مقبول لكنه يستخدم لفظ «النسل» الذي قد يُوحي بالجمع لا بالمفرد"
    observations: "المفهوم واضح ومألوف في الثقافة العربية: علاقة قرابة الأب بولده. اللفظ «أُبُوَّة» هو المصدر القياسي من «أب» على وزن فُعُولة، وهو لفظ عريق مذكور في كتب اللغة القديمة كمقاييس اللغة لابن فارس. المفهوم يقابل fatherhood/paternity في الإنجليزية، وهما يفترقان بأن paternity أقرب للسياق القانوني والطبي بينما fatherhood أعم."

  blind_candidates:
    - lemma: "أُبُوَّة"
      generation_method: ishtiqaq
      justification: "مصدر من «أب» على وزن فُعُولة، يدل على حالة كون المرء أباً وعلى رابطة الأبوة بالولد. وهو الاشتقاق القياسي الأول الذي يتبادر إلى الذهن من التعريف."
    - lemma: "أَبَوِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «أبوي» (النسبة إلى أب)، قد يدل على صفة الأبوة أو رابطتها. يحتاج تحقيقاً في المعاجم لتمييزه عن أُبُوَّة."
    - lemma: "وَالِدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «والد»، قد يشير إلى علاقة الوالد بولده. لكنه قد يشمل الأمومة أيضاً فيكون أعمّ من المطلوب."
    - lemma: "نَسَبٌ أَبَوِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «نسب» و«أبوي» يدل على رابطة النسب من جهة الأب. يحتاج تحقيقاً في مدى تثبيته المعجمي."


stage2_evidence:
  per_lemma:
    - lemma: "أُبُوَّة"
      confirm:
        - text: "«أُبوَّة» — paternity"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«الأُبُوّة.» — fatherhood"
          source: "المورد الحديث (2008)"
        - text: "«(1) الأُبوّة؛ الأَبَوية (2) أصل؛ منشأ.» — paternity"
          source: "المورد الحديث (2008)"
        - text: "«أبُوّة؛ والِديّة.» — parentage"
          source: "المورد الحديث (2008)"
        - text: "«(1) نَسَب (2) أَصْل (3) أُبوَّة؛ والديَّة.» — parentage"
          source: "المورد الحديث (2008)"
        - text: "«(أَبَوَ) الْهَمْزَةُ وَالْبَاءُ وَالْوَاوُ يَدُلُّ عَلَى التَّرْبِيَةِ وَالْغَذْوِ. أَبَوْتُ الشَّيْءَ آبُوهُ أَبْوًا: إِذَا غَذَوْتُهُ. وَبِذَلِكَ سُمِّيَ الْأَبُ أَبًا... وَالْجَمْعُ آبَاءٌ وَأُبُوَّةٌ... مَا كُنْتَ أَبًا وَلَقَدْ أَبَيْتَ أُبُوَّةً»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(2) تعيين البُنُوّة: تحديد أبوّة ولد مجهول الأب (ق)... (5) تحدُّر من أُبوّةٍ أو أصلٍ ما.»"
          source: "المورد الحديث (2008)"
          addition: "يُبيّن استعمال «أبوّة» في السياق القانوني (تحديد أبوّة ولد مجهول الأب)"
        - text: "«أبوة غير راجعة — والد هجين لا يشارك ثانية في التهجين العكسيّ.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "استعمال «أبوة» في السياق العلمي الوراثي"

    - lemma: "أَبَوِيَّة"
      contradicts:
        - text: "«(الأبوية) نظام اجتماعي يتألف من جمَاعَة أَو جماعات أَصْلهَا أسر مُشْتَركَة فِي الدَّم بِحَيْثُ تخضع جَمِيعهَا لسلطة حَاكم هُوَ أكبر الذُّكُور فِيهَا»"
          source: "المعجم الوسيط"
          conflict: "الأبوية في الوسيط والكبير تعني النظام الأبوي (patriarchy)، لا علاقة الأبوة (fatherhood)"
        - text: "«نظام اجتماعىّ يتألف من جماعة أو جماعات, أصلها أُسرٌ مشتركة في الدّم بحيث تخضع جميعها لسلطة حاكم هو أكبر الذكور فيها»"
          source: "المعجم الكبير"
          conflict: "التعريف ذاته — نظام اجتماعي لا علاقة قرابة"
      expands:
        - text: "«أَبَوِيَة: أبُوّة نسبة إلى الأب (بوشر).»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "دوزي ينقل عن بوشر أنها مرادفة لأبوّة، لكن هذا استعمال قديم مهجور طغى عليه معنى النظام الاجتماعي"

    - lemma: "وَالِدِيَّة"
      contradicts:
        - text: "«وَالِدِيَّة — parenthood — paternité, maternité»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "والدية تعني الوالدية بعمومها (أبوة + أمومة = parenthood)، وليست مقصورة على الأب"

    - lemma: "نَسَبٌ أَبَوِيّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "أُبُوَّة"
      decision: confirmed
      decision_reason: "لمّة عريقة مؤكدة بنصوص معجمية متعددة: مقاييس اللغة لابن فارس، المعجم الموحد لمصطلحات القانون، المورد الحديث. هي المصدر القياسي من «أب» على وزن فُعُولة، ودلالتها على علاقة القرابة بين الأب وولده ثابتة في الفصيحة القديمة والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُبُوَّة"

    - lemma: "أَبَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الأبوية في المعاجم العربية المعاصرة (الوسيط والكبير) تعني النظام الاجتماعي الأبوي (patriarchy/patrilineality)، لا علاقة الأبوة. واستعمال دوزي عن بوشر قديم مهجور طغى عليه المعنى الاجتماعي المعاصر. إدراجها سيُحدث لبساً دلالياً."

    - lemma: "وَالِدِيَّة"
      source: stage1
      decision: removed
      decision_reason: "والدية تعني «parenthood» أي الوالدية بعمومها (أبوة وأمومة معاً) كما هو مثبت في المعجم الطبي الموحد. وهي أعمّ من المطلوب الذي يقتصر على جانب الأب فقط."

    - lemma: "نَسَبٌ أَبَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر لا سند معجمياً له كوحدة اصطلاحية ثابتة. يمكن إبدال «نسب» بـ«قرابة» أو «صلة» ويبقى صالحاً، مما يدل على عدم تثبّته المعجمي (فشل في اختبار السكّ)."


