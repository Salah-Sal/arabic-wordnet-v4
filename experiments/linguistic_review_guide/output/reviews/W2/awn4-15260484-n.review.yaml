stage3_analysis:
  per_lemma:
    - lemma: "فِيمْتُوثَانِيَة"
      decision: confirmed
      decision_reason: "مصطلح معرّب مقبول يتبع النمط المعياري لتسمية أجزاء الثانية في النظام الدولي (نانوثانية، ميكروثانية، بيكوثانية...). رغم عدم وروده بهذا الإملاء في المعاجم المتاحة، فإن الصيغة بالياء (فيمتو) واردة في المعجم الطبي الموحد وموسوعة الكهرباء. الوصل في كلمة واحدة هو النمط السائد في الاستعمال العلمي العربي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِيمْتُوثَانِيَة"

    - lemma: "فِمْتُوثَانِيَة"
      source: stage1
      decision: removed
      decision_reason: "صيغة مكررة للمّة الموجودة بإملاء مختلف (بدون ياء). الإملاء بالياء «فيمتو» أكثر شيوعاً في المصادر الرسمية (المعجم الطبي الموحد، موسوعة الكهرباء)."

    - lemma: "فَمْتُوثَانِيَة"
      source: stage1
      decision: removed
      decision_reason: "صيغة إملائية ثالثة بفتح الفاء. الأدلة المعجمية الموجودة تستخدم «فمتو ثانية» (بالفصل) لا بالوصل، والإملاء بالياء «فيمتو» أرجح في المصادر الرسمية."

    - lemma: "ثَانِيَة فِمْتِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ وليس مصطلحاً مسكوكاً؛ يفشل في اختبار السكّ إذ يمكن إبدال «فمتيّة» بأي صفة أخرى. لا أدلة معجمية تدعمه."

    - lemma: "فَمْتُو ثَانِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "وردت في معجم مصطلحات المعلوماتية (2000) بهذا الإملاء (بالفصل) مع تعريف صريح «جزء من مليون مليار من الثانية». صيغة بديلة مقبولة للإملاء الموصول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "صيغة إملائية بديلة بفصل السابقة عن الوحدة، شائعة في المعاجم المصطلحية الرسمية"
