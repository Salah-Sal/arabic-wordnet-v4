stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «فيمتوثانية» معرَّبة بالكامل من المصطلح الأجنبي femtosecond؛ لا يوجد بديل عربي صرفي أو مجازي"
      - "اللمّة بدون تشكيل كامل — يجب إضافة التشكيل"
      - "التعريف العربي يستخدم لفظ «كوادريليون» المعرَّب؛ يمكن تحسينه بذكر القيمة الرقمية فقط"
    observations: "المجموعة تمثّل وحدة قياس زمنية متناهية الصغر من وحدات النظام الدولي (SI). السابقة «فمتو/فيمتو» من الدنماركية femten (خمسة عشر)، وليس لها أصل عربي. المفهوم علمي بحت لا مقابل تراثي له، فالتعريب هو المسلك الطبيعي. المجموعة تحتوي على لمّة واحدة فقط، وهو أمر مقبول في المصطلحات العلمية الدقيقة."
  blind_candidates:
    - lemma: "فِمْتُوثَانِيَة"
      generation_method: taarib
      justification: "تعريب مباشر للسابقة الدولية femto- مُركّبة مع «ثانية» بوصلهما في كلمة واحدة على نمط بيكوثانية ونانوثانية، وهو النمط السائد في المعاجم العلمية العربية"
    - lemma: "فَمْتُوثَانِيَة"
      generation_method: taarib
      justification: "صيغة تعريب بديلة بفتح الفاء بدلاً من كسرها، وردت في بعض المصادر العلمية العربية"
    - lemma: "ثَانِيَة فِمْتِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «ثانية» مع نسبة «فمتيّة» إلى السابقة فمتو، لكنه تعبير وصفي حرّ وليس مصطلحاً مسكوكاً"
    - lemma: "فَمْتُو ثَانِيَة"
      generation_method: taarib
      justification: "صيغة تعريب بكتابة السابقة منفصلة عن الوحدة، كما وردت في معجم مصطلحات المعلوماتية"


