# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-05734290-n  |  ILI: i67003
# التركيب المعقد للمعرفة كعناصر ومجموعاتها
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (بنية، هيكل) مجرّدتان من التشكيل في قاعدة البيانات، مما يُوجب تحديثهما"
      - "التعريف الحالي يفتقر إلى الجنس القريب والفصل النوعي الصريحَيْن، وبناؤه يوحي بأنه ترجمة حرفية للإنجليزية"
      - "صيغة «كعناصر ومجموعاتها» ركيكة ولا تجري على أسلوب المعاجم العربية المحكمة"
      - "هيكل يميل في الاستعمال الحديث نحو المعنى المادي (إطار، هيكل عظمي)، وحضوره في سياق التركيب المعرفي المجرد يستدعي توثيقاً دقيقاً"
    observations: >
      المجموعة تمثّل مفهوماً نفسياً معرفياً يقع ضمن فئة المعرفة وإنتاجها الذهني.
      كلتا اللمّتين الموجودتين (بنية، هيكل) مصطلحان عربيان أصيلان يُغطّيان دلالة «التركيب» و«الإطار»
      من زاويتين مختلفتين: بنية تُبرز التأليف الداخلي والطبيعة التركيبية العضوية، أما هيكل فيُبرز
      الإطار الكلي والبنية الهرمية الظاهرة. المفهوم حاضر في التراث العربي من خلال علم الكلام
      (تركيب الأجسام وبنيتها) وفي الدراسات اللسانية المعاصرة (البنيوية/الهيكلية).
  blind_candidates:
    - lemma: "نَسَق"
      generation_method: majaz
      justification: >
        من الجذر نسق، بمعنى التتابع والانتظام في شيء. المجاز: من الانتظام الخطّي الكلاسيكي
        (ثغر نسق، درٌّ نسق) نحو التنظيم الكلّي للعناصر المعرفية في نظام متسق. مستخدم في
        مسرد الفلسفة (ALECSO) بمعنى system، مما يدعم الإزاحة الدلالية.
    - lemma: "مَبْنَى"
      generation_method: ishtiqaq
      justification: >
        من الجذر ب-ن-ي على وزن مَفْعَل. يُعبّر عن النتيجة المبنيّة أي الهيئة المُقامة.
        مستخدم في المصطلحية اللسانية (مبنى ودلالة)، وقد يُوظَّف لوصف الهيكل التركيبي
        للمعرفة بوصفه «ما بُنِي» من عناصر ومجموعات.
    - lemma: "مَنْظُومَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن-ظ-م على وزن مَفْعُولَة. تحمل معنى المرتّب المضموم بعضه إلى بعض.
        شائعة في الاستعمال المعاصر للإشارة إلى الأنظمة المعرفية والفكرية (منظومة تعليمية،
        منظومة فكرية)، مما قد يوافق التركيب المعقد للمعرفة.
    - lemma: "نَسِيج"
      generation_method: majaz
      justification: >
        من الجذر ن-س-ج (النسج: وصل شيء بشيء). المجاز: حياكة عناصر المعرفة الجزئية في كلٍّ
        متماسك بوصفها «نسيجاً» معرفياً، كما يُقال «نسيج وحده» أي لا نظير له في التأليف.
        إحياء لفظ قديم لتجنّب الاشتراك اللفظي مع الاستعمالات الحديثة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── لمّات موجودة ──
    - lemma: "بنية"
      confirm:
        - text: "«ما بُنِي، هيئة البناء، ومنه بنية الكلمة: أي صيغتها»"
          source: "المعجم الوسيط (OCR)"
        - text: "«ما بنيته طبيعة الجسم، يقال: فلانٌ صحيحُ البِنْية؛ وفي الجيولوجيا العامة: مجموعةُ الظواهر التركيبية السَّطحيَّة في منطقةٍ ما»"
          source: "المعجم الكبير (OCR)"
        - text: "«البنية — بالكسر — الفطرة. وعند الحكماء هي الجسم المركّب على وجه يحصل من تركيبها مزاج وهي شرط للحياة عندهم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
        - text: "«الطريقة المناسبة والتنسيق الفعّال للمُكوِّنات داخل نظام ما»"
          source: "مسرد الهندسة الكهربائية — ALECSO (arabterm) [en: structure]"
        - text: "«المكونات الأساسية التي يعتمد عليها نظام أو برمجية حاسوب»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (arabterm) [en: architecture]"
        - text: "«بنية، هيكل» [كمصطلحَيْن مترادفَيْن]"
          source: "المعجم الموحد لمصطلحات الكيمياء (arabterm) [en: structure]"
      expands:
        - text: "«بِنْيَةٌ مَعْرِفِيَّةٌ» [مصطلح مستقل]"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (arabterm) [en: cognitive structure]"
          addition: "يؤكد وجود المركّب الاصطلاحي «بنية معرفية» الذي يطابق مجال هذه المجموعة مباشرة"
        - text: "«بناء معرفيّ: كل ما يوجد داخل العقل البشري من معلومات وخبرات معرفية يتأثر بها المتعلم في تعلمه في أي وقت من عمره»"
          source: "مسرد التربية — ALECSO (arabterm) [en: cognitive structure]"
          addition: "يُثبت المعنى المعرفي لهذه المجموعة ويمنح التعريفَ بُعداً تربوياً"

    - lemma: "هيكل"
      confirm:
        - text: "«الهيكل: الضخم من كل شيء، والفرس الطويل، والنبات الطويل البالغ العبل، والبناء المشرف»"
          source: "القاموس المحيط للفيروزآبادي (hawramani)"
        - text: "«الهيكل: الضخم من كل شيء... والبناء المشرف وبيت الأصنام والبيت الضخم المقدّس»"
          source: "المعجم الوسيط — مجموعة مؤلفين (hawramani)"
        - text: "«بنية، هيكل» [كمصطلحَيْن مترادفَيْن]"
          source: "المعجم الموحد لمصطلحات الكيمياء (arabterm) [en: structure]"
        - text: "[هيكل =] configuration; formation"
          source: "المعجم الموحد لمصطلحات المياه (arabterm)"
      expands:
        - text: "[هيكل =] skeleton — «هيكل لدعم قوام الحيوانات، والذي بتكامل مع العضلات يُمكِّن الجسم من الحركة والقيام بعدد من الأعمال»"
          source: "مسرد المناخ والبيئة — ALECSO (arabterm)"
          addition: "يُبيّن أن هيكل يحمل معنى الإطار الحامل الداعم، وهو تدقيق دلالي مهم عند مقارنته بـ«بنية»"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَسَق"
      confirm:
        - text: "«ما كان على نظام واحد من كل شيء، يقال: جاء القوم نسقاً وزُرِعَتِ الأشجار نسقاً، ويقال: شعر نسق مستوي النبتة حسن التركيب»"
          source: "المعجم الوسيط (OCR)"
        - text: "«نسق: system — كل نظام دالّ ومعقد يفرض نفسه على العالم وهو ما يعتبر سيميائية كبرى بحكم شفراته السوسيوثقافية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (arabterm)"
        - text: "«نسق: system»"
          source: "مسرد الفلسفة وعلم النفس — ALECSO (arabterm)"
      contradicts:
        - text: "«النون والسين والقاف أصل صحيح يدل على تتابع في الشيء... خرز نسق: منظّم، أصله ثغر نسق إذا كانت الأسنان متناسقة متساوية»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدل على التتابع الخطّي والتسلسل المتماثل، لا على التأليف المعقد للعناصر في وحدات مركّبة"

    - lemma: "مَبْنَى"
      contradicts:
        - text: "«المبنيّ: ما كان حركته وسكونه لا بعامل... المبنى: ما ناسب مبنى الأصل أو وقع غير مركب»"
          source: "كتاب التعريفات للجرجاني (hawramani)"
          conflict: "الاستعمال الراسخ في المعجمية العربية حصر «مبنى» في المصطلح النحوي (مبني/معرب)"
        - text: "«المبنى: ما كان حركته وسكونه لا بعامل. المبني اللازم: ما تضمن معنى الحرف»"
          source: "دستور العلماء للأحمدنكري (hawramani)"
          conflict: "الدلالة النحوية راسخة وتحجب الاستخدام المعرفي المجرد المطلوب"
        - text: "«مبنيّ: Invariable — كل كلمة لا تلحقها علامة إعرابية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (arabterm) [en: Invariable]"
          conflict: "يُثبت أن الاستعمال المعاصر للمبنى/المبنيّ هو نحوي حصراً"

    - lemma: "مَنْظُومَة"
      confirm:
        - text: "«منظومة: المؤلّفة المرتّبة المضموم بعضها إلى بعض، والمقطوعة الشعرية»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
      contradicts:
        - text: "«منظومة: controlled system; controlled process; control system — هو ذلك الجزء من مسار الفعل... الذي يقع التأثير عليه لتحقيق المهام»"
          source: "مسرد الهندسة الكهربائية — ALECSO (arabterm)"
          conflict: "الاستعمال التقني الراسخ لمنظومة هو النظام المُتحكَّم به في الهندسة، مما يُبعدها عن دلالة التركيب المعرفي"

    - lemma: "نَسِيج"
      contradicts:
        - text: "«النسيج: المنسوج، ويقال هو نسيج وحده لا نظير له في علم وغيره»"
          source: "المعجم الوسيط — مجموعة مؤلفين (hawramani)"
          conflict: "الدلالة الأولى مادية (المنسوج = the woven thing)، والتعبير الاصطلاحي الوحيد (نسيج وحده) يعني اللاتناظر/الفرادة لا التركيب"
        - text: "«نسيج: tissue — مجموعة من خلايا متماثلة منتظمة في وحدة هيكلية ووظيفية»"
          source: "مسرد المناخ والبيئة — ALECSO (arabterm)"
          conflict: "الاستعمال العلمي الحديث ربط نسيج بالأنسجة البيولوجية ربطاً وثيقاً"
        - text: "«نسيج: texture; fabric»"
          source: "معاجم ALECSO المتعددة (arabterm)"
          conflict: "تعدد السياقات المادية (نسيج الخشب، نسيج الصخر، نسيج القماش) يُرسّخ المعنى الجسداني ويمنع التجريد"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "بنية"
      decision: confirmed
      decision_reason: >
        شواهد وفيرة ومتنوعة من المعاجم اللغوية والمصطلحية تؤكد بنية بمعنى التركيب الداخلي
        للشيء وهيئته المبنية. وجود «بنية معرفية» (cognitive structure) كمصطلح مستقل في
        ALECSO يُثبت التخصّص في مجال هذه المجموعة. الجذر بني ودلالته (ضم بعضه إلى بعض)
        يناسب «التركيب المعقد للمعرفة كعناصر ومجموعات». تحتاج إلى تشكيل كامل: بُنْيَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        بُنْيَة تُركّز على التأليف الداخلي العضوي للمعرفة وطريقة تكوّن عناصرها وترابطها
        في كلٍّ متماسك — أي الجانب التركيبي الجوهري. مستخدمة في البنيوية واللسانيات
        وعلم النفس المعرفي للإشارة إلى الهيئة التكوينية الداخلية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُنْيَة"

    - lemma: "هيكل"
      decision: confirmed
      decision_reason: >
        مشهود له في المعاجم الكلاسيكية والحديثة بمعنى البناء والإطار الكلي والتنظيم.
        تأكيد مباشر في ALECSO (structure = هيكل، configuration، formation). اقتران
        «بنية، هيكل» معاً في معجم الكيمياء يُثبت الترادف الاصطلاحي. الجذر هكل يدل
        على الإشراف والعلو مما يناسب الطابع الهرمي الكلي للبنية المعرفية. يحتاج تشكيلاً: هَيْكَل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        هَيْكَل يُركّز على الإطار الكلي الخارجي والتنظيم الهرمي للمعرفة — أي كيفية توزيع
        المفاهيم الكبرى وتفريع المسائل منها. يحمل دلالة البنية القائمة بذاتها الحاملة
        لعناصرها، مقارنةً ببُنْيَة التي تُبرز طريقة التأليف الداخلي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَيْكَل"

    - lemma: "نَسَق"
      source: stage1
      decision: removed
      decision_reason: >
        نسق يدل في أصله اللغوي على التتابع الخطّي والتسلسل المتماثل (تناسق الأسنان،
        انتظام الخرز) لا على التأليف المعقد للعناصر في وحدات مركّبة. استخدامه في مسرد
        الفلسفة (system) قريب لكنه عام غير متخصص. وجود بُنْيَة وهَيْكَل يسدّان المسدّ
        بدلالة أدق وتوثيق أوفر، مما يجعل إضافة نسق تكراراً مع فقدان الدقة المصطلحية.
      evidence_assessment:
        case: mixed

    - lemma: "مَبْنَى"
      source: stage1
      decision: removed
      decision_reason: >
        الشواهد المعجمية وثّقت مبنى حصراً في الاستعمال النحوي (المبني في مقابل المعرب)،
        وهو ما أكدّه معجم اللسانيات الحديث (Invariable). استعمال مبنى في سياق التركيب
        المعرفي المجرد لا مستند له ويُفضي إلى لبس نحوي. مرفوض.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَنْظُومَة"
      source: stage1
      decision: removed
      decision_reason: >
        منظومة مشغولة في الاستعمال التقني الحديث بمعنى «النظام المُتحكَّم به» في الهندسة،
        وفي الاستعمال الأدبي بمعنى «القصيدة المنظومة». هذا الاشتراك يمنع توظيفها لدلالة
        «التركيب الداخلي للمعرفة» دون تشويش. مرفوضة.
      evidence_assessment:
        case: mixed

    - lemma: "نَسِيج"
      source: stage1
      decision: removed
      decision_reason: >
        نسيج رسّخه الاستعمال العلمي الحديث في دلالة الأنسجة البيولوجية وملمس المواد
        (texture, tissue, fabric). إضافته للدلالة المعرفية تُشكّل اشتراكاً لفظياً
        غير مبرر ولم يُوثَّق مثيله في أيٍّ من المعاجم المتخصصة. الاستعارة الحياكية
        جمالية لكنها غير مُسكَّكة اصطلاحياً. مرفوض.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "التركيب المعقد للمعرفة كعناصر ومجموعاتها"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يبدو ترجمة حرفية للنص الإنجليزي (the complex composition of knowledge
        as elements and their combinations). صيغة «كعناصر ومجموعاتها» ركيكة إذ «الكاف»
        تُشبّه لا تُعرَّف. يفتقر التعريف إلى الجنس القريب الصريح والفصل النوعي الكافي.
        لا يتّبع أسلوب المعجم الوسيط في الصياغة التعريفية.
    authored:
      - type: terminological
        text: "هيئةُ انتظام المعرفة وطريقةُ تأليف عناصرها الجزئية ومجموعاتها في كلٍّ مترابط يُشكّل نسقاً ذهنياً متكاملاً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "طريقة تركُّب المعرفة وانتظام أجزائها ووحداتها في نظام معرفي واحد"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
