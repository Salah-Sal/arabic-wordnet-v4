# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-04727812-n
# ili       : i61855
# pos       : n
# concept   : the quality of being open to public view (publicity)
# reviewed  : 2026-03-17
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان مكتوبتان بلا تشكيل"
      - "لمّة 'عمومية' تحمل دلالة الشمولية والعموم لا الانكشاف للأنظار؛ معجم ARABTERM يترجمها بـ universality"
      - "المجموعة تفتقر إلى توثيق تشكيل صريح مع أن معجم الصواب يُفصّل ضبط الكلمة"
    observations: >
      يعبّر المفهوم عن صفة تجريدية (quality of being public) يقابلها عربياً مصدرُ الفعل
      "عَلَنَ" أو "أَعْلَنَ". وقد وردت كلمة "العَلانِيَة" مصدراً فصيحاً في القرآن الكريم
      {وَأَنْفَقُوا مِمَّا رَزَقْنَاهُمْ سِرًّا وَعَلَانِيَةً} [فاطر:29]، كما أثبتتها
      المعاجم الكبرى بمعنى "ضد السر". في المقابل، "عمومية" تنتمي في الاستعمال المعجمي
      والمصطلحي إلى حقل "الشمول والعموم" (universality) وهو مفهوم مختلف. الجذور
      الواعدة التي يمكن أن يُستمد منها مرشحون: ظ‌هر (البروز والانكشاف)، ج‌هر (الإعلان
      والكشف)، ش‌يع (البث والانتشار في الناس).
  blind_candidates:
    - lemma: "جَهَارَة"
      generation_method: ishtiqaq
      justification: >
        من جذر "جهر" على وزن فَعَالَة؛ وأصل الجهر في اللغة إعلانُ الشيء وكشفُه وعلوُّه
        (ابن فارس: «إِعْلَانُ الشَّيْءِ وَكَشْفُهُ وَعُلُوُّهُ»). فالجهارة تناسب صفة
        الظهور الجلي أمام الناس قياساً مباشراً.
    - lemma: "إِعْلَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بالياء والتاء من "إعلان" (على صيغة فِعَالِيَّة)؛ تعني صفة كون الشيء
        في دائرة الإعلان والكشف للعامة، قياساً على "رسمية" و"مصطلحية".
    - lemma: "شِيَاع"
      generation_method: ishtiqaq
      justification: >
        مصدر "شاع يشيع" الدال على الذيوع والانتشار؛ وقد أثبت ابن فارس أن أحد أصلَي
        الجذر "ش ي ع" هو «بَثٌّ وَإِشَادَة» وأن "شاع الحديثُ إذا ذاع وانتشر"، مما
        يجعله قريباً من صفة الانكشاف للعامة.
    - lemma: "ظُهُورِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من "ظهر" (وزن فُعُولِيَّة)؛ وأصل الظهور في اللغة البروزُ والانكشافُ
        كما في «ظَهَرَ الشَّيْءُ إِذَا انْكَشَفَ وَبَرَزَ». تُجسّد صفة الظهور أمام
        العامة ببناء صرفي واضح.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — batch headword lookup: علانية / العلانية / عمومية / العمومية /
#         جهارة / الجهارة / اعلانية / الاعلانية / شياع / الشياع / ظهورية / الظهورية
#   Q2 — English bridge: publicity / public visibility / openness / publicness
#   Q3 — enrichment (defs + examples) for entry_ids from Q1
#   Q4 — Maqayis al-Lugha: علن / عمم / شيع / ظهر / جهر
#   Q5 — headword lookup: شيوع / ذيوع / علنية
stage2_evidence:
  per_lemma:

    - lemma: "علانية"
      confirm:
        - text: >
            «خلاف السّر، يوصف به فيقال: رجل عَلانِيَة: ظاهرُ أمره»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >
            «العلانية: ضد السر، وأكثر ما يستعمل في المعاني دون الأعيان،
            وعلوان الكتاب من علن اعتباراً بظهور المعنى الذي فيه، لا بظهور ذاته»
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: >
            «(الْعَلَانِيَة) خلاف السِّرّ ويوصف بِهِ فَيُقَال رجل عَلَانيَة ظَاهر
            أمره (ج) علانون»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35)"
      expands:
        - text: >
            «الصواب والرتبة: عَلانِيَة [فصيحة]. جاءت كلمة «عَلانِيَة» بتخفيف الياء
            في المعاجم مصدراً للفعل «عَلَنَ»، ومنه قوله تعالى:
            {وَأَنْفَقُوا مِمَّا رَزَقْنَاهُمْ سِرًّا وَعَلانِيَةً} فاطر/29»
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت 2003م)"
          addition: >
            يحسم معجم الصواب ضبط المصدر بتخفيف الياء (عَلانِيَة)، ويرفض التشديد
            (عَلانِيَّة)؛ كما يثبت الشاهد القرآني الفصيح.

    - lemma: "عمومية"
      contradicts:
        - text: >
            «مصطلح يشير إلى الشفرة الوراثية، والشفرات الثلاثية والتي تُتَرجم للحامض
            الأميني ذاته (باستثناءات طفيفة) في كافة الأنواع تقريباً.
            شمولية (المرادف العربي)» — [translation_en: universality]
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، ALECSO (ArabTerm)"
          conflict: >
            المصطلح في أكثر توثيق مُصطلحي له يُترجَم بـ "universality" (الشمولية)، وهو
            مفهوم مختلف عن "openness to public view". لم يُعثر لـ"عمومية" على أي توثيق
            بمعنى الانكشاف للأنظار.

    - lemma: "جَهَارَة"
      contradicts:
        - text: >
            «الجهارة: ارتفاع الصوت. حسن المنظر»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            الجهارة في المعاجم تختص بوصف المنظر الحسن وعلو الصوت، لا تفيد الانكشاف
            للأنظار العامة كصفة مجردة.
        - text: >
            «جهارة: درجة من الوضوح السمعي يصل إليها الصوت اللغوي»
            [translation_en: sonority]
          source: "مسرد الإعلام والتواصل، ALECSO (ArabTerm)"
          conflict: >
            المصطلح في السياق المصطلحي الحديث يُستخدم في حقل الصوتيات (sonority)،
            ولا علاقة له بالمفهوم المطلوب.

    - lemma: "إِعْلَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "شِيَاع"
      contradicts:
        - text: >
            «الشِّياع: النداء والبوق يُدعى به وما تُشَبّ به النار من الوقود الخفيف»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            المعنى الأول في المعاجم هو البوق والوقود الخفيف، وليس الانكشاف للعامة.
        - text: >
            «الشِّياع: دِقُّ الحطَبِ (الصغيرُ منه) تُوقَد به النَّارُ؛
            مِزْمارُ الراعي أو صَوتُه»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المعاجم الكلاسيكية والحديثة تُثبّت "شياع" بمعنى أدوات الرعاة والوقود،
            لا بمعنى صفة الظهور للعامة.
      expands:
        - text: >
            «الشِّينُ وَالْيَاءُ وَالْعَيْنُ أَصْلَانِ: يَدُلُّ أَحَدُهُمَا عَلَى
            مُعَاضَدَةٍ وَمُسَاعَفَةٍ، وَالْآخَرُ عَلَى بَثٍّ وَإِشَادَةٍ.
            فَأَمَّا الْآخَرُ: شَاعَ الْحَدِيثُ، إِذَا ذَاعَ وَانْتَشَرَ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يُثبت ابن فارس أن أحد أصلَي "شيع" هو البث والإشادة والانتشار في الناس،
            مما يدعم الجانب الدلالي من المرشح؛ غير أن التثبيت المعجمي للمصطلح
            نفسه "شياع" بهذا المعنى غائب.

    - lemma: "ظُهُورِيَّة"
      contradicts:
        - text: >
            «ظُهُورِيّة: من (ظ ه ر) مؤنث ظهوري نسبة إلى ظهور»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            الورود الوحيد في قاعدة البيانات لـ"ظهورية" هو بوصفها اسم علم مؤنث نسبياً،
            لا مصطلحاً مسكوكاً.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "علانية"
      decision: confirmed
      decision_reason: >
        موثقة في المعجم الوسيط والتوقيف للمناوي بمعنى "ضد السر" و"ظهور الأمر للناس"،
        وهو يطابق المفهوم تماماً. الشاهد القرآني {سِرًّا وَعَلانِيَةً} يُثبّت فصاحتها
        ورسوخها. يستلزم تحديث التشكيل إلى الصواب المُقرَّر (تخفيف الياء).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على الطابع الإعلاني الصريح للشيء في مواجهة السرية؛ تنتمي إلى
        الحقل الأخلاقي والقانوني والاجتماعي بوصفها نقيض السر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَلانِيَة"

    - lemma: "عمومية"
      decision: removed
      decision_reason: >
        تنصرف "عمومية" في المصطلحية العربية الحديثة إلى معنى "الشمولية" (universality)
        وهو مفهوم مختلف. لم يُعثر على توثيق يربطها بالانكشاف للأنظار. إبقاؤها يُوقع
        في خلط دلالي مع المفهوم المجاور "universality".
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جَهَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم تُثبّت "الجهارة" بمعنى حسن المنظر وعلو الصوت، وفي المصطلحية الحديثة
        بمعنى sonority. لا تدل على "كون الشيء مفتوحاً للأنظار العامة".
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "إِعْلَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا التركيب مسكوكاً في أي معجم. وهو وإن كان قياسياً صرفياً فإنه
        يفتقر إلى التثبيت المعجمي المطلوب. فضلاً عن ذلك فإن "الإعلانية" صفة نسبية
        تنتمي إلى حقل الإعلام والإعلان التجاري لا إلى صفة "الانكشاف للعامة" المجردة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "شِيَاع"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الجذر "شيع" يحمل عند ابن فارس أصل "البث والإشادة"، فإن المصطلح "شياع"
        مستعمل في المعاجم الحديثة بمعنى البوق والوقود الخفيف. الاشتراك اللفظي الشديد
        يجعله غير صالح، ويُفضّل عليه "شُيُوع" أو "ذُيُوع" إن أُريد هذا الحقل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "ظُهُورِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُسجَّل في المعاجم كمصطلح مسكوك لأي مفهوم؛ وردودها الوحيدة كاسم علم مؤنث
        نسبي. يفشل اختبار التثبيت المعجمي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "صفة كون الشيء مفتوحاً للأنظار العامة أو متاحاً للجمهور"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية من الإنجليزية (open to public view)، وتعبير
        "مفتوحاً للأنظار" ركيك. الأسلوب العربي الفصيح يستعمل "ظاهراً مكشوفاً" أو
        يرتكز على الثنائية الراسخة "السر والعلانية". كذلك جاء التعريف بصيغة "صفة كون"
        وهي صيغة مصدرية مُسهبة يمكن تكثيفها.
    authored:
      - type: linguistic
        text: >
          ضِدُّ السِّرِّيَّة؛ صفةُ كلِّ أمرٍ كان ظاهراً مكشوفاً لأنظار العامة
          لا يُحجَب عن الجمهور
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: terminological
        text: >
          كيفيةٌ تجعل الشيءَ بارزاً في متناول الجمهور لا يُحاط به سِرًّا؛
          نقيضُ الخفاء والسرية
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04727812-n"
          definition_index: 0
          text: "ضِدُّ السِّرِّيَّة؛ صفةُ كلِّ أمرٍ كان ظاهراً مكشوفاً لأنظار العامة لا يُحجَب عن الجمهور"
      - command: add_definition
        params:
          synset_id: "awn4-04727812-n"
          text: "كيفيةٌ تجعل الشيءَ بارزاً في متناول الجمهور لا يُحاط به سِرًّا؛ نقيضُ الخفاء والسرية"

  examples:
    per_lemma:
      - lemma: "عَلانِيَة"
        examples:
          - text: "نظرت المحكمةُ في القضية عَلانِيَةً أمام الرأي العام دون أي إجراء سري"
            type: usage
          - text: "قرَّر المجلسُ أن تُنشَر وثائق المداولات عَلانِيَةً لضمان الشفافية"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-04727812-n"
          text: "نظرت المحكمةُ في القضية عَلانِيَةً أمام الرأي العام دون أي إجراء سري"
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "قرَّر المجلسُ أن تُنشَر وثائق المداولات عَلانِيَةً لضمان الشفافية"


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "عَلانِيَة"
      entry_id: "{auto}"
      root: "علن"
      maqayis_quote: >
        «الْعَيْنُ وَاللَّامُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِظْهَارِ
        الشَّيْءِ وَالْإِشَارَةِ [إِلَيْهِ] وَظُهُورِهِ. يُقَالُ عَلَنَ الْأَمْرُ
        يَعْلُنُ. وَأَعْلَنْتُهُ أَنَا. وَالْعِلَانُ: الْمُعَالَنَةُ»

  per_sense:
    - lemma: "عَلانِيَة"
      sense_id: "{auto}"
      nuance: >
        تُمثّل القطب الإيجابي الصريح لثنائية (السر / العلانية) الراسخة في الوجدان
        العربي والشريعة الإسلامية؛ تنتمي بامتياز إلى الحقلين القانوني والأخلاقي.
        تختلف عن "شُهرة" التي تعني الذيوع الإيجابي، وعن "إعلان" الذي يعني فعل الكشف
        لا صفته.

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: >-
          {"root":"علن","maqayis":"«الْعَيْنُ وَاللَّامُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِظْهَارِ الشَّيْءِ وَالْإِشَارَةِ [إِلَيْهِ] وَظُهُورِهِ. يُقَالُ عَلَنَ الْأَمْرُ يَعْلُنُ. وَأَعْلَنْتُهُ أَنَا. وَالْعِلَانُ: الْمُعَالَنَةُ»"}
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: >-
          {"nuance":"القطب الإيجابي لثنائية السر/العلانية؛ تختص بالحقلين القانوني والأخلاقي","mwe":false}
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-04727812-n"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "awn4-04727812-n"
        score: 0.85
