stage1_review:
  assessment:
    concerns:
      - "خلو اللمات الحالية من التشكيل الكامل."
      - "احتمال اللبس بين المصطلح اللاهوتي المسيحي والاستخدام الصوفي لمصطلح 'التجلي'."
    observations: "المصطلح يشير إلى حدث محدد في العهد الجديد (الإنجيل)، وهو تجلي يسوع المسيح أمام تلاميذه على الجبل، حيث تغيرت هيئته وانبعث منه النور. اللمات المقترحة يجب أن تعكس هذا الطابع الاصطلاحي الديني."
  blind_candidates:
    - lemma: "التَّجَلِّي"
      generation_method: majaz
      justification: "اللفظ العربي الشائع والمستقر في الأدبيات المسيحية للتعبير عن هذا الحدث (Transfiguration)، وهو من المجاز الذي انتقل من المعنى العام (الانكشاف) إلى هذا المعنى الاصطلاحي المخصوص."
    - lemma: "تَجَلِّي الْمَسِيح"
      generation_method: tarkib
      justification: "تعبير إضافي يحدد الشخصية موضوع التجلي، وهو يسوع المسيح، وهو مستخدم بكثرة في السياقات الكنسية."
    - lemma: "تَجَلِّي السَّيِّد"
      generation_method: tarkib
      justification: "تعبير إضافي شائع في المصادر اللاهوتية (تجلّي الرب أو السيد)، ويعتبر وحدة معجمية في هذا السياق."
    - lemma: "الِاسْتِنَارَة"
      generation_method: majaz
      justification: "يُستخدم أحياناً في السياقات اللاهوتية والميتافيزيقية للتعبير عن الانبعاث النوراني، لكنه أقل تخصصاً من 'التجلي'."

stage2_evidence:
  per_lemma:
    - lemma: "التَّجَلِّي"
      confirm:
        - text: "«(2) «أ», cap.: «ب» التَّجَلِّي: تغيُّر هيئة المسيح على الجبل. «ج» عيد التَّجَلّي (نص)»"
          source: "المورد الحديث"
        - text: "«التّجلّي:[في الانكليزية] Manifestation ،transfiguration ... في اللغة بمعنى الظهور. وعند السالكين عبارة عن ظهور ذات الله وصفاته، وهذا هو التجلّي الرباني»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "تجلي المسيح"
      confirm:
        - text: "«تغير هيئة المسيح على الجبل»"
          source: "المورد الحديث (تعريف للتجلي)"
    - lemma: "تَجَلِّي السَّيِّد"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "التجلي"
      decision: confirmed
      decision_reason: "هو المصطلح الرئيسي والمستقر في المعاجم الحديثة وفي الأدبيات الدينية المسيحية المقابلة للمصطلح الإنجليزي Transfiguration."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "التَّجَلِّي"
    - lemma: "تجلي المسيح"
      decision: confirmed
      decision_reason: "تعبير مركب مستخدم لتمييز الحدث وربطه بشخص المسيح، وهو مطابق للتعريف الإنجليزي (Transfiguration of Jesus)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجَلِّي الْمَسِيح"
    - lemma: "تَجَلِّي السَّيِّد"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير لاهوتي فصيح شائع الاستخدام في النصوص الكنسية العربية، حيث يُشار إلى المسيح بلقب 'السيد'."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "تَجَلِّي السَّيِّد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "(في العهد الجديد) الانبعاث المفاجئ للنور من شخص يسوع"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط، ويفضل إضافة السياق المكاني (الجبل) وفعل التغير في الهيئة ليكون أكثر دقة مصطلحية."
    authored:
      - type: terminological
        text: "(في المسيحية) حادثة وقعت ليسوع المسيح على الجبل، حيث تغيَّرت هيئته أمام ثلاثة من تلاميذه وانبعث منه نورٌ إلهيٌّ بَهِيّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "التَّجَلِّي"
        examples:
          - text: "يُعد التَّجَلِّي من الأحداث المحورية في حياة يسوع المسيح وفقاً للأناجيل."
            type: usage
      - lemma: "تَجَلِّي الْمَسِيح"
        examples:
          - text: "رأى التلاميذ في تَجَلِّي الْمَسِيح على جبل ثابور تأكيداً لألوهيته."
            type: usage
      - lemma: "تَجَلِّي السَّيِّد"
        examples:
          - text: "ألقى الكاهن عظةً بليغةً في تذكار تَجَلِّي السَّيِّد."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "(في المسيحية) حادثة وقعت ليسوع المسيح على الجبل، حيث تغيَّرت هيئته أمام ثلاثة من تلاميذه وانبعث منه نورٌ إلهيٌّ بَهِيّ."

stage5_enrichment:
  per_entry:
    - lemma: "التَّجَلِّي"
      entry_id: "{auto}"
      root: "جلو"
      maqayis_quote: "«الْجِيمُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ، وَقِيَاسٌ مُطَّرِدٌ، وَهُوَ انْكِشَافُ الشَّيْءِ وَبُرُوزُهُ.»"
    - lemma: "تَجَلِّي الْمَسِيح"
      entry_id: "{auto}"
      roots:
        - word: "تجلي"
          root: "جلو"
          maqayis_quote: "«الْجِيمُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ، وَقِيَاسٌ مُطَّرِدٌ، وَهُوَ انْكِشَافُ الشَّيْءِ وَبُرُوزُهُ.»"
        - word: "المسيح"
          root: "مسح"
          maqayis_quote: "«الْمِيمُ وَالسِّينُ وَالْحَاءُ أَصْلٌ صَحِيحٌ، وَهُوَ إِمْرَارُ الشَّيْءِ عَلَى الشَّيْءِ بَسْطًا... وَلِذَلِكَ سُمِّيَ الْمَسِيحُ عَلَيْهِ السَّلَامُ مَسِيحًا، كَأَنَّ عَلَيْهِ مَسْحَةً مِنْ جَمَالٍ.»"
    - lemma: "تَجَلِّي السَّيِّد"
      entry_id: "{auto}"
      roots:
        - word: "تجلي"
          root: "جلو"
          maqayis_quote: "«الْجِيمُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ، وَقِيَاسٌ مُطَّرِدٌ، وَهُوَ انْكِشَافُ الشَّيْءِ وَبُرُوزُهُ.»"
        - word: "السيد"
          root: "سود"
          maqayis_quote: "«السِّينُ وَالْوَاوُ وَالدَّالُ أَصْلٌ وَاحِدٌ، وَهُوَ يَدُلُّ عَلَى عِظَمٍ وَكِبَرٍ... وَالسَّيِّدُ: الرَّئِيسُ، وَسُمِّيَ بِذَلِكَ لِعِظَمِ قَدْرِهِ.»"
  per_sense:
    - lemma: "التَّجَلِّي"
      sense_id: "{auto}"
      nuance: "اللفظ المفرد المطلق الذي ينصرف ذهنياً إلى هذه المعجزة بصفة خاصة في السياق الديني."
      mwe: false
    - lemma: "تَجَلِّي الْمَسِيح"
      sense_id: "{auto}"
      nuance: "تعبير وصفي يحدد الموصوف بدقة لرفع أي لبس مع التجليات الإلهية الأخرى."
      mwe: true
    - lemma: "تَجَلِّي السَّيِّد"
      sense_id: "{auto}"
      nuance: "تعبير توقيري يُستخدم غالباً في الخطاب الكنسي الرسمي والصلوات."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جلو","maqayis":"«الْجِيمُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ... وَهُوَ انْكِشَافُ الشَّيْءِ وَبُرُوزُهُ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"تجلي","root":"جلو","maqayis":"«...»"},{"word":"المسيح","root":"مسح","maqayis":"«...»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"تجلي","root":"جلو","maqayis":"«...»"},{"word":"السيد","root":"سود","maqayis":"«...»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ المفرد المطلق الذي ينصرف ذهنياً إلى هذه المعجزة بصفة خاصة في السياق الديني.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبير وصفي يحدد الموصوف بدقة لرفع أي لبس مع التجليات الإلهية الأخرى.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: sense
