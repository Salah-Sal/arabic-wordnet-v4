stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'قاعدة' دقيقة جداً ولكنها تحتاج إلى تشكيل كامل."
      - "التعريف الحالي جيد ولكنه يفتقر إلى الصياغة المعجمية الرصينة."
    observations: "المفهوم يشير إلى نقطة الارتكاز المكاني للقيام بمهام محددة والعودة إليها، وهو ما يغطيه مصطلح 'قاعدة' و'مقر' و'مركز'. كما أن 'منطلق' يركز على جانب البداية."
  blind_candidates:
    - lemma: "مَقَرّ"
      generation_method: ishtiqaq
      justification: "من الفعل 'قرّ' بمعنى استقرّ، وهو المكان الذي يُتخذ للاستقرار والعمل."
    - lemma: "مَرْكَز"
      generation_method: ishtiqaq
      justification: "من الفعل 'ركز' بمعنى ثبت، وهو المكان الذي تتركز فيه القوى أو الأعمال."
    - lemma: "مُنْطَلَق"
      generation_method: ishtiqaq
      justification: "اسم مكان من 'انطلق'، ويشير إلى نقطة البداية للمهمات كما ورد في التعريف."
    - lemma: "مَعْقِل"
      generation_method: majaz
      justification: "يُستخدم مجازاً للتعبير عن القاعدة الحصينة أو المركز الأساسي."

stage2_evidence:
  per_lemma:
    - lemma: "قاعدة"
      confirm:
        - text: "«قاعدة: (في الجغرافيا والتاريخ) base»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
        - text: "«قاعدة: (في المورد الحديث) القاعدة: الأساس أو الجزء الذي يرتكز عليه شيء... قاعدة بحرية أو جوية.»"
          source: "المورد الحديث"
    - lemma: "مَقَرّ"
      confirm:
        - text: "«المَقَرُّ: مَوْضِعُ الاستقرار محلّ يتَّخِذُهُ الإنسان مكاناً لإقامته»"
          source: "المعجم الوسيط"
        - text: "«المقر الرئيسي: home»"
          source: "المورد الحديث"
    - lemma: "مَرْكَز"
      confirm:
        - text: "«تمركز في المكان: اتَّخذه مَقرًّا ثابتًا أو نقطة أساسيّة له، استقرّ في مركزه»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«مَرْكَزُ الْجُنْدِ: الْمَوْضِعُ الَّذِي أُلْزِمُوهُ.»"
          source: "مقاييس اللغة"
    - lemma: "مُنْطَلَق"
      confirm:
        - text: "«المُنْطَلَق: المُنْطَلَق؛ نقطة الانطلاق. [في ترجمة base]»"
          source: "المورد الحديث"
        - text: "«المُنْطَلَقُ: أَوَّلُ نُقْطَةٍ فِي الاتْجاه نحو الفِعْل»"
          source: "المعجم الكبير"
    - lemma: "مَعْقِل"
      confirm:
        - text: "«معقل: blockhouse, casemat, entrenchment»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"

stage3_analysis:
  per_lemma:
    - lemma: "قاعدة"
      decision: confirmed
      decision_reason: "هي المصطلح الأساسي والأكثر شيوعاً للتعبير عن المفهوم (base)، وهي مستخدمة في السياقات العسكرية والعلمية والتقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَاعِدَة"
    - lemma: "مَقَرّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح رصين يعبر عن مكان الاستقرار الثابت الذي يُتخذ منطلقاً للأعمال (home/headquarters)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَقَرّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08507412-n"}
    - lemma: "مَرْكَز"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن نقطة الارتكاز التي تتمركز فيها القوات أو الفرق للقيام بمهامها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَرْكَز", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08507412-n"}
    - lemma: "مُنْطَلَق"
      source: stage1
      decision: confirmed
      decision_reason: "يشير بدقة إلى الجانب الحركي الوارد في التعريف (تبدأ منه المهام)، وهو مرادف فني لـ base."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُنْطَلَق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08507412-n"}
    - lemma: "مَعْقِل"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من صحة استخدامه المجازي، إلا أنه يميل أكثر لمعنى الحصن أو المكان الدفاعي، وهو أضيق من المفهوم العام المطلوب."

stage4_content:
  definition:
    current: "المكان الذي تتمركز فيه ومنه تبدأ المهام وتنتهي"
    assessment:
      decision: revise
      reason: "الصياغة الحالية مقبولة ولكن يمكن جعلها أكثر دقة ومعجمية."
    authored:
      - type: terminological
        text: "الموضع الذي يُتخذ مَقَرًّا ثابتاً لانطلاق المهام والعودة إليها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "قَاعِدَة"
        examples:
          - text: "اتخذ الجيش من المطار المهجور قاعدة عسكرية لعملياته الجوية."
            type: usage
      - lemma: "مَقَرّ"
        examples:
          - text: "جعلت البعثة الاستكشافية من هذا الكهف مقراً دائماً لعملياتها."
            type: usage
      - lemma: "مَرْكَز"
        examples:
          - text: "يُعد هذا الميناء مركزاً حيوياً لانطلاق سفن الإغاثة الدولية."
            type: usage
      - lemma: "مُنْطَلَق"
        examples:
          - text: "كانت تلك النقطة هي المنطلق الأساسي للرحلة العلمية."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-08507412-n", definition_index: 0, text: "الموضع الذي يُتخذ مَقَرًّا ثابتاً لانطلاق المهام والعودة إليها."}

stage5_enrichment:
  per_entry:
    - lemma: "قَاعِدَة"
      entry_id: "{auto}"
      root: "قعد"
      maqayis_quote: "«الْقَافُ وَالْعَيْنُ وَالدَّالُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ لَا يُخْلَفُ، وَهُوَ يُضَاهِي الْجُلُوسَ... وَقَوَاعِدُ الْبَيْتِ: أَسَاسُهُ.»"
    - lemma: "مَقَرّ"
      entry_id: "{auto}"
      root: "قرر"
      maqayis_quote: "«الْقَافُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ... وَالْأَصْلُ الْآخَرُ التَّمَكُّنُ، يُقَالُ قَرَّ وَاسْتَقَرَّ.»"
    - lemma: "مَرْكَز"
      entry_id: "{auto}"
      root: "ركز"
      maqayis_quote: "«الرَّاءُ وَالْكَافُ وَالزَّاءُ أَصْلَانِ: أَحَدُهُمَا إِثْبَاتُ شَيْءٍ فِي شَيْءٍ يَذْهَبُ سُفْلًا... وَمَرْكَزُ الْجُنْدِ: الْمَوْضِعُ الَّذِي أُلْزِمُوهُ.»"
