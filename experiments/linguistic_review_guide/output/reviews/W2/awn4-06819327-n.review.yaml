    - lemma: "طَابَع"
      source: stage1
      decision: removed
      decision_reason: >
        الطابع له معنيان سائدان: (١) الخاتم/آلة الطبع، (٢) الطبيعة والسجية الفطرية.
        المعجم الوسيط نفسه يصف طابع البريد بأنه «رمز»، أي أن الطابع يُوصف بالرمز
        لا أنه مرادف له. لا صلاحية دلالية لإحلاله محل رمز.

    - lemma: "شِعَار"
      source: stage1
