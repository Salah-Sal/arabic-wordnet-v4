# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (رمز) مكتوبة بدون تشكيل؛ يجب ضبطها بالكامل: رَمْز"
      - "التعريف العربي يبدو ترجمةً حرفيةً لنظيره الإنجليزي؛ كلمة «اعتباطية» كلق غير معهود في أسلوب المعاجم العربية"
      - "لا توجد أمثلة استعمالية مرفقة بالمجموعة"
    observations: >
      المجموعة تمثّل مفهوم «الرمز» بمعناه السيميائي الخاص (Peircean symbol)، وهو يقع في
      تضاد دقيق مع جنسه القريب (إشارة/علامة) من حيث الخصائص الثلاث: الاعتباطية، والوسيط
      المكتوب أو المطبوع، وكونها مكتسبة عرفاً لا طبيعةً. اللمّة الموجودة (رمز) هي الحل
      المصطلحي الأوحد والراسخ في العربية المعاصرة، إذ تجمع بين الأصل الكلاسيكي وعشرات
      التوثيقات التقنية الحديثة في مختلف التخصصات.

  # ── التوليد الأعمى (من التعريف وحده، قبل الاطلاع على اللمّات) ──
  blind_candidates:
    - lemma: "سِمَة"
      generation_method: majaz
      justification: >
        من الجذر (وسم). السِّمَة في الأصل العلامة التي تُوضَع على الحيوان للتعريف؛ إزاحة
        دلالية إلى «الأثر الخطي المتفق على دلالته»، إذ يجمع المعنيين تحمّلُ الأثرِ لمدلولٍ
        اصطلاحي. يُميز المجاز هنا انتقالَ الأثر الجسدي إلى الأثر الكتابي.
    - lemma: "رُقُم"
      generation_method: ishtiqaq
      justification: >
        من الجذر (رقم) بمعنى الكتابة والنقش. جمع رَقْم على وزن فُعُل الجمعي، أو مصدر
        بمعنى الشيء المرقوم (المنقوش). الكتابة أصل دلالة الرقم في كلام العرب مما يجعله
        مرشّحاً لأي علامة مكتوبة ذات دلالة متعارف عليها.
    - lemma: "طَابَع"
      generation_method: majaz
      justification: >
        من الجذر (طبع) بمعنى الختم والطبع. المجاز من آلة الطبع إلى نتيجته (الأثر
        المطبوع)، ثم من الأثر المطبوع إلى العلامة الخطية ذات الدلالة العرفية. يدعمه
        أن التعريف يُصرّح بالوسيط «مطبوعة».
    - lemma: "شِعَار"
      generation_method: majaz
      justification: >
        من الجذر (شعر). في معناه الثانوي «علامة تتميز بها جماعة»، يمكن توسيع شِعَار
        ليشمل كل علامة مكتوبة يُتعارف عليها للدلالة على مفهوم. إحياء للمعنى الكلاسيكي
        القائم على التميّز الاصطلاحي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت:
#   Q1 — مطابقة دفعية: رمز+الرمز+سمة+السمة+رقم+الرقم+طابع+الطابع+شعار+الشعار
#   Q2 — إثراء بـ entry_id لمداخل رمز المعيارية (11490, 39320, 39321, 874286, 986644)
#   Q3 — جسر إنجليزي: translation_en:"symbol" OR "symbols"
#   Q4 — مطابقة دفعية للمرشحات: سيما+السيما+شارة+الشارة+ميسم+الميسم+سيمة+السيمة
stage2_evidence:
  per_lemma:

    - lemma: "رمز"
      confirm:
        - text: >
            «عَلامَةٌ تَدُلُّ على مَعْنًى له وجُودٌ قائمٌ بِذاتِه، فتُمثِّلُه وتَحِلَّ
            محلّه، كما يقومُ الرَّمزُ الكتابىُّ مقام الصَّوْتِ المنطُوقِ»
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
        - text: >
            «الإيماء والإشارة، العلامة، الكناية الخفيَّة (في علم البيان)»
          source: "المعجم الوسيط"
        - text: >
            «الرَّمزُ: مَا يشار بِهِ إِلَى الْمَطْلُوب من قرب مَعَ الخفاء»
          source: "معجم مقاليد العلوم للسيوطي"
        - text: >
            «يدخل الرمز، عند Peirce، في تقابل مع الأيقونة والإمارة. فالرمز هو تدوين
            علاقة قارة بين العنصرين في ثقافة معينة»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: >
            «اصطلاح متعدِّد السمات، غير مستقر، لاستحالة رسم مفارقات معناه، وهو علامة
            تحيل على موضوع وتسجله طبقاً لقانون ما. ويُعدّ الرمز وسيطاً تجريدياً للإشارة
            إلى عالم الأشياء»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل مستقل"
        - text: "رَمْز — symbol"
          source: >
            ARABTERM: المعجم الموحد لمصطلحات الرياضيات والفلك (1990)؛ المعجم الموحد
            لمصطلحات الكيمياء (1992)؛ مسرد الفلسفة وعلم النفس (ALECSO)؛ المعجم
            الطبي الموحد (2009)؛ موسوعة الكهرباء IEC 60050 — وغيرها (>15 مصدر تقني)
        - text: >
            «(فِي علم الرياضيات) حرف يدل على كمية معينة أو غير معينة مثل «X» أو «س»
            للدلالة على كمية مجهولة»
          source: "المعجم الكبير"
        - text: >
            «(فى الفلسفة): علامة يُتَّفق عليها للدلالة على شيء أو فكرة ما، ومنها
            الرموز العددية والرموز الجبرية، ويقابل الحقيقة الواقعية»
          source: "المعجم الكبير"

    - lemma: "سِمَة"
      contradicts:
        - text: >
            «(السِّمَة) مَا وُسِم به الحيوان من ضروب الصور والعلامة»
          source: "المعجم الوسيط"
          conflict: >
            الدلالة مقيّدة بأثر الوسم الجسدي على الحيوان، ولا تمتد عرفاً إلى العلامة
            الخطية الاصطلاحية. لا توثيق لاستعمالها في دلالة الرمز المكتوب.
        - text: >
            «السِّمَة: العلامة. أثر الحُسن والجمال»
          source: "المعجم الكبير"
          conflict: >
            استعمالان: الوسم الجسدي وأثر الجمال. كلاهما بعيد عن الرمز الكتابي
            الاصطلاحي. غياب توثيق تقني أو لساني بهذا المعنى.

    - lemma: "رُقُم"
      contradicts:
        - text: >
            «الرَّقْم (في علم الحساب): هو الرمز المستعمل للتعبير عن أحد الأعداد البسيطة
            (١، ٢، ٣، ٤، ٥، ٦، ٧، ٨، ٩ والصفر)»
          source: "المعجم الوسيط"
          conflict: >
            انحصر معنى الرقم في العربية المعاصرة في «العدد» (digit/number)، وهو
            مفهوم تابع للرمز لا مرادف له. الاستعمال الراهن يُفضي إلى اشتراك لفظي.
      expands:
        - text: >
            «الرَّقْم: في الأصل الكتابةُ والنَّقشُ ثم قيل للنقش الذي يرقم التاجر على
            الثياب علامةً على أن ثمنها كذا»
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: >
            يُبرز الأصل الدلالي المشترك مع مفهوم العلامة الاصطلاحية (نقش التاجر =
            علامة اتفاقية على الثمن)، لكن هذا المعنى غير حيّ في الاستعمال الراهن.

    - lemma: "طَابَع"
      contradicts:
        - text: >
            «الطابَع: ما يُطبَع به أو يُخْتَم، الميسمُ، الخُلُق الغالب. طابع البريد:
            ما يُلصَق بالرسائل وغيرها من بطاقات صغيرة ترسمها الدولة وتجعلها رمزاً
            لأداء أجر الإرسال»
          source: "المعجم الوسيط"
          conflict: >
            المعجم نفسه يُعرِّف طابع البريد بأنه «رمز» — أي الطابع يُوصف بالرمز لا
            أن يكون مرادفاً له. الدلالة الأساسية: آلة الختم أو طبيعة الشيء الغالبة.
        - text: >
            «الطابَع: الخليقةُ والسجيةُ التي جُبِل عليها الإنسان»
          source: "المعجم الكبير"
          conflict: >
            الدلالة المعاصرة الأغلب هي «الطبيعة الفطرية» (character/nature)، وهي
            بعيدة جداً عن معنى الرمز السيميائي.

    - lemma: "شِعَار"
      contradicts:
        - text: >
            «الشِّعار: علامة تتميز بها دولة أو جماعة، عبارة يتعارف بها القوم في الحرب
            أو السفر»
          source: "المعجم الوسيط"
          conflict: >
            الشِّعار أخص دلالةً من الرمز؛ مقيّد بالهوية الجماعية (دولة/جماعة) ولا
            يشمل الرموز الكتابية العامة كالحروف والأرقام والرموز الرياضية والكيميائية.
        - text: >
            «الشِّعار: علامة تتميز بها جماعة أو مؤسسة. فعله تحت شِعار كذا: باسمه
            وتحت رايته»
          source: "المعجم الكبير"
          conflict: >
            التعريفات تُثبت أن الشِّعار هو الشعار المؤسسي (logo/slogan) لا الرمز
            السيميائي الذي يقابل sign في نظرية Peirce.


