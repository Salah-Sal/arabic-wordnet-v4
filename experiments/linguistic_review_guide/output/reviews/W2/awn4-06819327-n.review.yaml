        والكيميائية والكمبيوترية. استعمال شعار مكان رمز انزياح دلالي غير مقبول.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "علامة اعتباطية (مكتوبة أو مطبوعة) اكتسبت دلالة عرفية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة مباشرة للنظير الإنجليزي؛ كلمة «اعتباطية» (calque of
        'arbitrary') ليست من أسلوب المعاجم العربية الكلاسيكية. يفتقر التعريف إلى
        الفصل النوعي الدقيق الذي يُميّز الرمز عن سائر العلامات بتحديد غياب العلاقة
        الطبيعية أو التشابهية، كما لا يُشير إلى كونها وحدة في منظومة اتفاقية.
    authored:
      - type: terminological
        text: >
          عَلامَةٌ مَكْتُوبَةٌ أَو مَرْسُومَةٌ تَدُلُّ عَلَى مَعْنًى مُحَدَّدٍ
          أَو مَفْهُومٍ بِحُكْمِ الِاتِّفَاقِ وَالعُرْفِ، لَا بِحُكْمِ الطَّبِيعَةِ
