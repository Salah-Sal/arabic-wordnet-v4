    # ── مرشحات المرحلة ١ (مرفوضة) ──

    - lemma: "سِمَة"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الراسخة لسِمَة هي أثر الوسم الجسدي على الحيوان، ولا توثيق على
        استعمالها للرمز الخطي الاصطلاحي في أي معجم تقني أو لساني. قبولها يُفضي إلى
        اشتراك لفظي مع الميسم والوسم.

    - lemma: "رُقُم"
      source: stage1
      decision: removed
      decision_reason: >
        انحصر الرقم في العربية المعاصرة بمعنى العدد/الرقم الحسابي (digit/number)، وهو
        مفهوم فرعي من مفاهيم الرمز لا مرادف له. الاستعمال في معنى الرمز السيميائي
