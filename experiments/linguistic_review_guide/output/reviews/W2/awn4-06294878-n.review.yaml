# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # المرشحات العمياء — ولّدت قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "عُنْصُرٌ لِسَانِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (إضافي-وصفي) من "عُنْصُر" (جزء أو مكوّن كلّيّ) و"لِسانيّ"
        (منسوب إلى اللسان/اللغة). يتجنّب كلمة "وحدة" الواردة في التعريف،
        ويستعمل "عنصر" الذي يوحي بمكوّن أساسيٍّ في بنية أكبر.
    - lemma: "مُكَوِّنٌ كَلَامِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من "مُكَوِّن" (وزن مُفَعِّل من كَوَّن، أي ما يدخل في تكوين
        شيء ما) و"كَلاميّ" (منسوب إلى الكلام). يجتنب مفردتَي "وحدة" و"لغوية"
        الواردتين في التعريف، ويفيد معنى الجزء الداخل في بنية الخطاب.
    - lemma: "خَلِيَّةٌ لِسَانِيَّةٌ"
      generation_method: tarkib
      justification: >
        تركيب وصفي بنكهة مجازية: "خَلِيَّة" (وزن فَعِيلَة من خَلا، وهي أصغر
        وحدة بنائية في الكائن الحيّ) تُستعمل استعارةً للدلالة على أصغر لبنة
        تحليلية في الخطاب اللغوي، مع "لسانية" كصفة تخصيصية.
    - lemma: "صِيغَةٌ لِسَانِيَّةٌ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من "صِيغَة" (مصدر من صَاغَ، وزن فِعْلَة، وتفيد الشكل
        المُنسَق المُكَوَّن) و"لسانية". تُشير "الصيغة" إلى وحدة ذات شكل
        محدد قابل للتعرف والتحليل، وتبتعد عن ألفاظ التعريف.

  # التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة 'وحدة لغوية' مكتوبة بلا تشكيل كامل."
      - "المجموعة تضمّ لمّةً واحدةً فحسب، وهو فقرٌ معجميٌّ لمفهوم مركزي في اللسانيات."
      - "التعريف العربي الحالي يقع في دوران جزئيٍّ: يُعرِّف 'وحدة' باستخدام كلمة 'الوحدات'."
      - "التعريف الحالي يبدو ترجمةً حرفيةً للتعريف الإنجليزي، ولا يتّبع أسلوب المعجم الوسيط."
    observations: >
      المجموعة تمثّل مفهوماً جامعاً في علم اللسانيات، إذ تشير إلى أيّ قِطاع من
      الخطاب يصلح لأن يكون موضوع تحليل في مستوى من مستويات الدرس اللغوي
      (صوتيّ، صرفيّ، نحويّ، دلاليّ). اللمّة المقترنة "وحدة لغوية" صائبة في
      توجّهها، غير أنّها تفتقر إلى التشكيل الكامل وتستحق مرافقة لمّة بديلة تستعمل
      الصفة "لسانية" وهي الأكثر تخصّصاً في أدبيات اللسانيات العربية الحديثة.
      والملاحظ أنّ المجموعة تكاد تخلو من تعريف عربي جيد الصياغة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
