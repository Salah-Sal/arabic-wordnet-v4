# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:

  per_entry:
    - lemma: "وَحْدَةٌ لُغَوِيَّةٌ"
      entry_id: "{auto}"
      roots:
        - word: "وَحْدَة"
