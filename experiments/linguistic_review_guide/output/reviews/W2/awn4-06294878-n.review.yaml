        - وحدة لغوية / الوحدة اللغوية
        - وحدة لسانية / الوحدة اللسانية
        - عنصر لساني / العنصر اللساني
        - مكون كلامي / المكون الكلامي
        - خلية لسانية / الخلية اللسانية
        - صيغة لسانية / الصيغة اللسانية
      result: "لم تُوجَد أيٌّ من المداخل بوصفها مدخلاً مستقلاً في أيِّ قاموس."
    - id: Q2
