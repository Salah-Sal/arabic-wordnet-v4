    - id: Q3
      type: arabic_fts
      description: "بحث FTS بعبارة 'وحدة لغوية' و'وحدة لسانية' في التعريفات"
      result: "عُثِر على تسعة مداخل في المعجم الموحد لمصطلحات اللسانيات 2002 تستعمل 'وحدة لغوية' في تعريفاتها."
    - id: Q4
      type: component_arabterm
      description: "بحث عن مكوّنات: وحدة، لغوي، لساني، عنصر في ARABTERM"
      result: "وجدت مداخل لـ'عنصر' و'لساني' كمفردات بدون دليل على التركيب المطلوب."
    - id: Q5
      type: maqayis_roots
      description: "مقاييس اللغة لابن فارس: وحد ولغو"
      result: "وجدت المدخلين."

  per_lemma:
    - lemma: "وحدة لغوية"
      confirm:
        - text: >
            «رمز يوضح بداية ونهاية وحدة لغوية ما.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: علامة الحد"
        - text: >
            «سيرورة تدخل بموجبها وحدة لغوية في علاقة مع وحدات أخرى،
            على مستوى الكلام.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: تأليف"
        - text: >
            «وحدة لغوية محددة من خلال بنيتها وسماتها الصورية.
            يجد التقابل المؤسس بين المادة والشكل أصوله في صياغة دو سوسير:
            'اللغة شكل وليست مادة'.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: صيغة، شكل"
        - text: >
            «وحدة لغوية ذات معنى معاكس لوحدة أخرى.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: مضاد"
        - text: >
            «وحدة لغوية دالة مؤلفة من عناصر صوتية قابلة للتسجيل الكتابي.»
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — مدخل: كلمة"
        - text: >
            «مجموع العناصر التي تؤلف وحدة لغوية تأخذ علامة النبر.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: مجموعة نبرية"
        - text: >
            «ينطبق التوزيع التكاملي في مختلف مستويات التحليل اللساني وهو يكون
            عندما يعني اختفاء وحدة لغوية مع ظهور أخرى، وهذا يفسر وجود
            البدائل الصرفية والصوتية.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: توزيع تكاملي"
        - text: >
            «استبدال وحدة لغوية بأخرى في سياقات مختلفة، دون قيد أو شرط.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: بديل حر"

    - lemma: "عُنْصُرٌ لِسَانِيٌّ"
      expands:
        - text: >
            «العنصر جزء من المكوّن أو مكوّن في وحدة ذات درجة أعلى، مثل
            (ك) الاسم مكوّن أو عضو في المركب الاسمي.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: عنصر"
          addition: >
            يُعرَّف 'العنصر' في اللسانيات بوصفه مكوّناً في وحدة أعلى منه درجةً،
            أي أنّه أخصّ من المفهوم المطلوب الذي هو الوحدة في أيّ مستوى.
        - text: >
            «صفة صامت يعتمد في تلفظه على حركة اللسان مثل [ت، ك].»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: لساني"
          addition: >
            "لساني" في المعجم اللساني يعني "مرتبط بعضو اللسان جهازياً" وليس
            "لغوياً/ألسنياً"، ممّا يجعل التركيب "عنصر لساني" مضلِّلاً في السياق.

    - lemma: "مُكَوِّنٌ كَلَامِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "خَلِيَّةٌ لِسَانِيَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "صِيغَةٌ لِسَانِيَّةٌ"
      expands:
        - text: >
            «وحدة لغوية محددة من خلال بنيتها وسماتها الصورية.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل: صيغة، شكل"
          addition: >
            "الصيغة" في هذا السياق هي نوع مخصوص من الوحدة اللغوية، إذ تتحدد
            بسماتها الصورية/الشكلية. وهذا يثبت أنّها أخصّ من المفهوم المطلوب
            (الوحدة اللغوية الكلية) وليست مرادفةً له.


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "وحدة لغوية"
      decision: confirmed
      decision_reason: >
        اللمّة مصطلح تقني راسخ في الأدب اللساني العربي الحديث، وتظهر في ثمانية
        مداخل على الأقلّ في المعجم الموحد لمصطلحات اللسانيات (2002) بوصفها
        المصطلح الجامع لأيّ وحدة من وحدات التحليل اللغوي. التركيب وصفيٌّ صحيح
        (موصوف + صفة) وتفي المفردتان باختبار السكِّ والتثبيت المعجمي.
        المطلوب الوحيد هو إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      substitution_test: >
        لا يمكن إبدال "لغوية" بـ"كلامية" أو "لسانية" دون تغيير الدلالة أو
        إيقاع التباس (لسانية تعني جهازياً مرتبطة بعضو اللسان)، مما يُثبت
        أنّ التركيب وحدة اصطلاحية ثابتة لا وصفاً حرّاً.
      borrowing_check:
        loan_type: calque
        assessment: >
          المصطلح ترجمة إضافية (calque) لـ"linguistic unit"، غير أنّه
          يستوفي الاطّراد الصرفي العربي ويقبل الإعراب والنسبة والجمع
          (الوحدات اللغوية)، فهو مقبول.
      term_quality_gate:
        الاطراد_والفصاحة: "مطّرد — وحدات لغوية جمع سالم منتظم"
        يسر_التداول: "سهل النطق والكتابة"
        الملاءمة: "ملائم للسياق الأكاديمي والتعليمي"
        ايثار_التراثي: "وحدة ولغة مفردتان عربيتان أصيلتان"
        ايثار_العربي: "يُفضَّل على 'يونيت لنغويستيك'"
        الاشتقاقية: "يقبل الجمع والتثنية والنسبة"
      nuance_differentiation: >
        لمّة وحيدة في المجموعة؛ لا توجد أخوات للمقارنة. تُستعمل بوصفها
        المصطلح الجامع (Hypernym) الذي تندرج تحته: الصوتيمة، الصرفيمة،
        الكلمة، العبارة، الجملة — أيّ مستوى من مستويات التحليل اللغوي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَحْدَةٌ لُغَوِيَّةٌ"

    # ── مرشّحو المرحلة ١ ──
    - lemma: "عُنْصُرٌ لِسَانِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        مشكلتان رئيسيتان: (١) "العنصر" في اللسانيات العربية يعني مكوّناً
        في وحدة أعلى درجةً (hyponym)، وهو أخصّ من المفهوم المطلوب.
        (٢) "لِسانيّ" في المعاجم المتخصصة — وفي ARABTERM تحديداً — يعني
        "مرتبطاً بعضو اللسان" (glossal/lingual) لا "لغوياً" (linguistic)؛
        وهذا خلط مصطلحي خطير. الصفة المعيارية للتعريب في اللسانيات هي
        "لُغَوِيّ" لا "لِسانيّ".
      evidence_assessment:
        case: mixed

    - lemma: "مُكَوِّنٌ كَلَامِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        "كلاميّ" تنسب إلى الكلام (speech act) لا إلى اللغة بوصفها نظاماً
        (language system)، وهي شاملة لكلّ ما يتعلق بالكلام الإنسانيّ بصرف النظر
        عن التحليل اللساني. لا أدلة مسجَّلة على توظيف هذا التركيب مصطلحاً.
      evidence_assessment:
        case: no_material

    - lemma: "خَلِيَّةٌ لِسَانِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المجاز بـ"الخلية" جريء ولكنّه غير مُثبَّت معجمياً. يُضاف إلى ذلك
        عودة مشكلة "لسانية" الإشكالية ذاتها. لا دليل مسجَّل على هذا التركيب
        في مصادر اللسانيات العربية.
      evidence_assessment:
        case: no_material

    - lemma: "صِيغَةٌ لِسَانِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        "الصيغة" في اللسانيات العربية مصطلح أخصّ يعني "وحدة لغوية محدَّدة من
        خلال بنيتها وسماتها الصورية" (المعجم الموحد 2002)؛ وبذلك هي نوع من
        الوحدات اللغوية لا مرادفٌ لها. يُضاف إلى ذلك الإشكال نفسه في "لسانية".
      evidence_assessment:
        case: mixed


