# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «علاقة القرابة بين الفرد وأسلافه» يجمع بين كلمتي «علاقة» و«قرابة» وكلتاهما تُعبّران عن مفهوم الصلة، مما يُفضي إلى تكرار دلالي. يُستحسن توحيد المصطلح الجنسي."
      - "الدلالة الأساسية للفظ «سُلَالَة» في المعاجم الحديثة انزاحت نحو المعنى البيولوجي والعرقي (race, strain, breed) بعيداً عن معنى «علاقة القرابة» المجردة التي يُعبّر عنها المصطلح الإنجليزي lineage/filiation. هذا التباين يستحق التوثيق."
      - "المصطلح الإنجليزي «filiation» يُقابله في العربية «بُنُوَّة» (صلة النسب بين الولد وأبويه) غير أن هذا اللفظ لا يرد ضمن لمّات المجموعة، مع أنه يُترجم أحد المصطلحات الإنجليزية المدرجة."
    observations: >
      تدور المجموعة حول مفهوم «الصلة النسبية الصاعدة» بين الفرد وأسلافه، وهو مفهوم محوري في
      التراث العربي والإسلامي تتضافر فيه ألفاظ متعددة: النسب (الكتاب المرجعي للمعجم العربي)،
      والسلالة (الخط الوراثي والتوارث)، والحسب (ما يُعدّ من الشرف المكتسب).
      يلفت الانتباه أن التعريف العربي يصف «العلاقة بين الفرد وأسلافه» وهي الصيغة الدقيقة لمصطلح
      filiation/lineage في مقابل النسب الأشمل الذي يمتد أفقياً وعمودياً.
      لمّة «نَسَب» هي الأدق توافقاً مع المفهوم بموجب شواهد المعاجم الكلاسيكية التي تحدّه بـ«القرابة
      في الآباء خاصة»، في حين تحمل «سُلَالَة» دلالة الخط الوراثي الانبثاقي من السلف.

  blind_candidates:
    - lemma: "انْتِسَاب"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر ن-س-ب على وزن افْتِعَال، يُعبّر عن حالة الارتباط والانتماء إلى الأصل.
        الاشتقاق منتج ودال على صِلَة تربط الفرد بمن ينتسب إليهم، وهو فعل متعدٍّ يستلزم
        طرفاً أصلياً (المنتسِب) وطرفاً مرجعياً (السلف). الوزن افتعال يُلمح إلى الفاعلية الذاتية
        في إقامة الصلة، بخلاف النسب الجامد.
    - lemma: "عِرْق"
      generation_method: majaz
      justification: >
        لفظ عربي أصيل يعني أصل الشجرة والأصل الكامن فيما يمتد عمقاً. استُعمل في الفصيح
        مجازاً للنسب والأصل الموروث: «تداركته أعراق صدق أو سوء»، «فلان معرق في الكرم»
        بمعنى له أصل نسبي فيه. اقتراح إحياء المعنى الجذري المجازي (أصل كل شيء) ليغطّي
        علاقة الفرد بسلفه من حيث الانبثاق والتجذّر.
    - lemma: "تَحَدُّر"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر ح-د-ر على وزن تَفَعُّل، معناه التنازل والسيلان من الأعلى إلى الأسفل.
        يُستعمل في العربية المعاصرة تعبيراً عن صلة الانحدار من الأصل: «تحدّر من سلالة كريمة».
        الوزن تفعّل يُفيد الاستمرار والتدرّج، وهو مناسب للتعبير عن العلاقة التراتبية بين الفرد
        وأسلافه.
    - lemma: "سِلْسِلَةُ النَّسَب"
      generation_method: tarkib
      justification: >
        مركّب إضافي (سِلْسِلَة + النَّسَب) يُعبّر عن التواصل المتسلسل بين الأجيال في خطّ
        نسبي مباشر. الاستخدام موثّق في المعاجم المتخصصة بهذا الشكل المضاف ليدل على
        الخط الواصل بين الفرد وأسلافه. اختبار السكّ: مفهوم التسلسل والانتظام النسبي لا يُعوَّض
        بمرادف آخر دون تغيير الدلالة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "سُلَالَة"
      confirm:
        - text: "«جَمَاعَةٌ من الكائنات الحيَّةِ تَتَّفِق فى صفاتِها العِرْقِيَّةِ الموروثة»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«جماعةٌ من الكائنات الحية تتفق فى صفاتها العرفية الموروثة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(السلالة) ما استل من الشيء وانتزع والنطفة وفي التنزيل العزيز {ثم جعل نسله من سلالة من ماء مهين} وجماعة من الكائنات الحية تتفق في صفاتها العرفية الموروثة (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
        - text: "سُلالة → lineage (Gross Anatomy)"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (ARABTERM)"
        - text: "سُلالَة → lineage (The Unified Medical Dictionary)"
          source: "المعجم الطبي الموحد (ARABTERM)"
      contradicts:
        - text: "«ما سُلَّ من الشىءِ أو انْتُزِعَ منه. النُّطْفَةُ. الوَلَدُ. وقيل: الوَلَدُ حين يخرجُ من بطن أُمِّه.»"
          source: "المعجم الكبير"
          conflict: >
            المعنى الكلاسيكي الأول للسلالة هو «ما انتُزع» ثم «النطفة» ثم «الولد»؛ وهذه المعاني
            تدور حول المنتَج المستخرَج لا العلاقة المجردة بين الفرد وأسلافه.
        - text: "سلالة → race / strain / breed / ethny / gens / subspecies"
          source: "معاجم ARABTERM المتعددة (علم الأحياء، علم الاجتماع، علم الوراثة)"
          conflict: >
            في المعاجم التخصصية الحديثة تُترجم «سلالة» إلى race وstrain وbreed وethny
            وgens وsubspecies — وكلها أوسع من مفهوم «علاقة القرابة بين الفرد وأسلافه» أو
            تختلف عنه دلالياً. هذا التشعّب الدلالي يجعل السلالة أقل دقةً لتمثيل مفهوم المجموعة.
      expands:
        - text: "«وَلَقَدْ خَلَقْنَا الْإِنسَانَ مِن سُلَالَةٍ مِّن طِينٍ»"
          source: "القرآن الكريم (المؤمنون: ١٢) — شاهد من المعجم الكبير"
          addition: >
            الشاهد القرآني يُرسّخ معنى «ما انتُزع من أصل» وهو يُشير إلى المادة الأصلية
            المُشتقّ منها الفرد، وهو قريب من مفهوم الانبثاق من السلف وإن كان على مستوى
            الجنس البشري كله لا على مستوى العلاقة الفردية بالأسلاف.

    - lemma: "نَسَب"
      confirm:
        - text: "«القَرابَة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«النَّسَبُ، محركةً، والنِّسْبَةُ، بالكسرِ والضمِّ: القَرابَةُ، أو في الآباءِ خاصَّةً»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«النسب: والنسبة، إدراك من جهة أحد الأبوين، وذلك ضربان: نسب بالطول كالاشتراك بين الآباء والأبناء، ونسب بالعرض كالنسب بين بني الأعمام»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«النَّسَب: محركةً القرابةُ وما يَصِل من الأبوين من الشرافة والدناءة، ويقابله الحسبُ الحاصل بالكسب»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«(النّسَب) القَرَابَة ويقال نسبه في بني فلان هو منهم (ج) أنساب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
        - text: "النسب → lineage / genealogy (AGROVOC, Sociology)"
          source: "المَكنَز الزراعي / مسرد علم الاجتماع (ARABTERM)"
      expands:
        - text: "«النُّونُ وَالسِّينُ وَالْبَاءُ كَلِمَةٌ وَاحِدَةٌ قِيَاسُهَا اتِّصَالُ شَيْءٍ بِشَيْءٍ. مِنْهُ النَّسَبُ، سُمِّيَ لِاتِّصَالِهِ وَلِلِاتِّصَالِ بِهِ. تَقُولُ: نَسَبْتُ أَنْسُِبُ. وَهُوَ نَسِيبُ فُلَانٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يكشف ابن فارس أن جذر «نسب» يدور على معنى «اتصال شيء بشيء» وهو الأصل الدلالي
            للمفهوم برمّته؛ مما يُؤكد أن النسب هو التعبير العربي الأصيل عن علاقة الاتصال
            التي تربط الفرد بسلفه. كما يشير إلى «النسيب» بمعنى القريب النسبي.

    - lemma: "انْتِسَاب"
      confirm:
        - text: "«بَاب الانتساب: انْتَمَى واعتزى وانتسب وادّعى وتنحل وانتحل»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن أبي ثابت (هورماني)"
      expands:
        - text: "انتساب بالنسب → pedigree selection (genetics)"
          source: "المعجم الموحد لمصطلحات علم الوراثة (ARABTERM)"
          addition: >
            الاستعمال التخصصي «تربية بالنسب» و«انتقاء بالنسب» يُظهر أن الاشتقاق من نسب
            يستعمل كثيراً في سياقات الاختيار الوراثي لا في وصف العلاقة القرابية المجردة.

    - lemma: "عِرْق"
      confirm:
        - text: "«أصلُ كل شيءٍ: يقال: تداركته أعراق صدق أو سوء»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«وَالْعَرِيقُ مِنَ الْخَيْلِ وَالنَّاسِ: الَّذِي لَهُ عِرْقٌ فِي الْكَرَمِ. وَفُلَانٌ مُعْرِقٌ لَهُ فِي الْكَرَمِ، أَيْ لَهُ فِيهِ أَصْلٌ وَسِنْخٌ. وَقَدْ عَرَّقَ فِيهِ أَعْمَامُهُ وَأَخْوَالُهُ تَعْرِيقًا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«مجموعة بشرية تتميز بخصائص تاريخية أو جغرافية أو سُلالية معينة»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
      contradicts:
        - text: "عرق → race / sweat / sudor / vein / lode / arak"
          source: "معاجم ARABTERM المتعددة"
          conflict: >
            الاستعمال التقني الغالب لـ«عرق» في المعاجم المتخصصة إما «عَرَق» بمعنى عرق الجسم
            (sweat/sudor) أو «عِرق» بمعنى وريد/عرق معدني (vein/lode) أو الجماعة العرقية
            (race). ليس له استعمال ثابت بمعنى «علاقة القرابة بين الفرد وأسلافه» كمصطلح مستقل.

    - lemma: "تَحَدُّر"
      expands:
        - text: "«تحدُّرٌ [من سُلالةٍ ما]» — (3) من معاني descent"
          source: "المورد الحديث (2008) (ARABTERM)"
          addition: >
            يُستعمل «تحدّر» لوصف سياق الانحدار من سلالة بعينها؛ إلا أن الاستعمال المعجمي يُثبّته
            فعلاً (التحدّر = الفعل) لا اسماً لعلاقة قرابة مستقلة.
      evidence_status: "no_material_found"

    - lemma: "سِلْسِلَةُ النَّسَب"
      confirm:
        - text: "«سلسلة النّسب» → lineage; lignage (Sociology and Anthropology)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
        - text: "«سلسلة النسب» → genealogy (Geography and History)"
          source: "مسرد الجغرافيا والتاريخ (ARABTERM)"
      contradicts:
        - text: "«سلسلة النسب» — اسم المقيّد وليس اسم المفهوم المجرد"
          source: "تحليل البنية التركيبية"
          conflict: >
            المركّب «سلسلة النسب» يُعبّر عن «الخط الجينيالوجي» المحسوس وليس عن «علاقة القرابة
            المجردة» بين الفرد وأسلافه. فضلاً عن أنه يفشل اختبار السكّ: «سلسلة القرابة» /
            «خط النسب» تعمل وصفاً للمفهوم ذاته، مما يعني أنه ليس مصطلحاً محكماً.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
