      decision_reason: >
        تَحَدُّر مصدر (verbal noun) يصف فعل الانحدار والنزول من الأعلى، وهو حدث لا علاقة.
        استعمالاته المعجمية تُثبته في سياق «تحدّر من سلالة ما» أي فعل الانبثاق، لا وصف
        الرابطة القرابية الثابتة. اختبار الاستبدال: «تحدّر عن آبائه» ≠ «علاقة قرابته بأسلافه»؛
        الأول يصف الحدث، والثاني يصف الرابطة.
      evidence_assessment:
        case: no_material

    - lemma: "سِلْسِلَةُ النَّسَب"
      source: stage1
      decision: removed
      decision_reason: >
        مركّب إضافي يدلّ على «الشجرة النسبية» أو «خط النسب المحسوس» وليس على العلاقة
        القرابية المجردة. يفشل اختبار التثبيت المعجمي: يُمكن إبداله بـ«سلسلة القرابة» أو
        «خط النسب» في السياقات ذاتها دون تغيير الدلالة، مما يُثبت أنه تعبير وصفي حرّ
        لا مصطلح مسكوك. ARABTERM يُثبّته كمقابل لـ«genealogy» لا لـ«kinship relation».
        فضلاً عن ذلك، الاستعمال في المجموعة الترادفية يُثبّت «lineage» لا «genealogy».
      evidence_assessment:
        case: mixed


