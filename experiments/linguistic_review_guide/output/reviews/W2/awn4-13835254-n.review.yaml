        ARABTERM بترجمة lineage. وعلى الرغم من أن المعنى الكلاسيكي الأول هو «ما انتُزع»
        والمعنى الحديث الطاغي هو «strain/race»، فإن السلالة تُستعمل في العربية المعاصرة
