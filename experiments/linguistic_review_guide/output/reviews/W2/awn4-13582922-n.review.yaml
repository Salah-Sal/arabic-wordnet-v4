stage1_review:
  assessment:
    concerns:
      - "اللمتان (تحفيز) و(تنبيه) تفتقران إلى التشكيل الكامل."
      - "المفهوم متعلق بـ (physiology) وتأثير المُنَبِّه على الأعصاب، وكلمة (تنبيه) هي الأدق طبياً، وكلمة (استثارة) دقيقة جداً أيضاً في هذا السياق، في حين أن (تحفيز) أكثر عمومية أو تميل للتفاعلات الكيميائية والحيوية."
    observations: "مصطلح (تنبيه) هو المصطلح القياسي الفسيولوجي (Stimulation) المستخدم للتعبير عن التأثير العصبي. (استثارة) تستخدم لوصف استجابة العضو لهذا التنبيه."
  blind_candidates:
    - lemma: "اِسْتِثَارَة"
      generation_method: ishtiqaq
      justification: "مشتقة من (استثار)، وتُستخدم فسيولوجياً للتعبير عن إحداث استجابة في عصب أو نسيج."
    - lemma: "تَنْبِيه"
      generation_method: ishtiqaq
      justification: "مشتق من (نبّه)، وهو اللفظ الشائع والمقابل المعتمد لـ Stimulation في السياق الطبي."
    - lemma: "تَحْفِيز"
      generation_method: ishtiqaq
      justification: "مشتق من (حفز)، ويعني الحث وزيادة النشاط، ويشيع استخدامه في السياق الحيوي."
    - lemma: "إِثَارَة"
      generation_method: ishtiqaq
      justification: "مشتقة من (أثار)، وتفيد استدعاء رد فعل حركي أو عصبي."

stage2_evidence:
  per_lemma:
    - lemma: "تنبيه"
      confirm:
        - text: "«تَنْبيه [ج:تَنْبيهات]» — translation_en: stimulation"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تنبيه عصبى» — translation_en: neural stimulation"
          source: "موسوعة الكهرباء (IEC 60050)"
    - lemma: "استثارة"
      confirm:
        - text: "«عملية تنبيه أو تهيج أو استجابة لمنبه.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«اسْتِثارَة» — translation_en: stimulation"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "تحفيز"
      confirm:
        - text: "«تَحْفيز» — translation_en: stimulation"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "إثارة"
      confirm:
        - text: "«إِثارَة» — translation_en: stimulation"
          source: "المعجم الطبي الموحد (2009)"

stage3_analysis:
  per_lemma:
    - lemma: "تنبيه"
      decision: confirmed
      decision_reason: "مصطلح طبي أساسي ومعتمد في المعاجم للتعبير عن التأثير الفسيولوجي المباشر على العصب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنْبِيه"
    - lemma: "تحفيز"
      decision: confirmed
      decision_reason: "مصطلح معتمد ومستخدم على نطاق واسع في المعاجم العلمية والحيوية للدلالة على الاستحثاث والتحفيز."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْفِيز"
    - lemma: "اِسْتِثَارَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق جداً في علم وظائف الأعضاء لوصف استجابة النسيج أو العصب للمنبهات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اِسْتِثَارَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13582922-n"}
    - lemma: "إِثَارَة"
      source: stage1
      decision: removed
      decision_reason: "رغم صحتها، إلا أن (استثارة) و(تنبيه) أدق في السياق الفسيولوجي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "(في علم وظائف الأعضاء) تأثير منبه (على الأعصاب أو الأعضاء وما إلى ذلك)"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد، لكن يمكن صياغته بأسلوب معجمي عربي أمتن وتجنب الأقواس المتعددة."
    authored:
      - type: terminological
        text: "التأثير الفسيولوجي الذي يُحدثه المُنبِّه في الأعصاب أو الأعضاء الحيوية لإثارة استجابة معينة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13582922-n", definition_index: 0, text: "التأثير الفسيولوجي الذي يُحدثه المُنبِّه في الأعصاب أو الأعضاء الحيوية لإثارة استجابة معينة."}
  examples:
    per_lemma:
      - lemma: "تَنْبِيه"
        examples:
          - text: "استجاب العضَل لعمليّة تَنْبِيه العَصَب المرتبط به."
            type: usage
      - lemma: "تَحْفِيز"
        examples:
          - text: "يؤدي تَحْفِيز الخلايا إلى زيادة إفراز الهرمونات."
            type: usage
      - lemma: "اِسْتِثَارَة"
        examples:
          - text: "تعتمد الاستجابة الحركية على اِسْتِثَارَة الألياف العصبية المباشرة."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "استجاب العضَل لعمليّة تَنْبِيه العَصَب المرتبط به."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يؤدي تَحْفِيز الخلايا إلى زيادة إفراز الهرمونات."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تعتمد الاستجابة الحركية على اِسْتِثَارَة الألياف العصبية المباشرة."}

