stage1_review:
  assessment:
    concerns:
      - "خلو اللمات من التشكيل الكامل (جزء، قطعة)."
      - "التعريف يستعمل كلمة 'جزء' وهي إحدى اللمات، مما يوقع في الدوران المعجمي."
      - "اللمتان تعبران عن المفهوم، لكن 'قطعة' أقرب وأدق لبيان دلالة الانفصال المادي عن الكل مقارنة بـ 'جزء' التي قد تدل على مجرد القسم أو الحصة المجردة."
    observations: "المفهوم يشير إلى جزء مقتطع أو منفصل من شيء كامل (piece). اللمتان الموجودتان تعبران عن هذا المعنى، والكلمات العربية غنية بتخصيص أنواع القطع حسب طبيعة الشيء المقطوع."
  blind_candidates:
    - lemma: "قِسْم"
      generation_method: ishtiqaq
      justification: "مشتقة من القسمة، وتعبر عن جزء من كل يعين بالحصة أو التقسيم."
    - lemma: "فِلْقَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الفلق، وتدل على الجزء المنفصل من الشيء المكسور أو المشقوق كالحبوب ونحوها."
    - lemma: "بَضْعَة"
      generation_method: ishtiqaq
      justification: "تدل على القطعة من الشيء، وغالبا ما تستعمل للَّحم ولكنها تمتد لتشمل القطعة من كل شيء."
    - lemma: "شِقَّة"
      generation_method: ishtiqaq
      justification: "مشتقة من الشق، وتدل على النصف أو القطعة المشقوقة من الشيء مستطيلا."

stage2_evidence:
  per_lemma:
    - lemma: "جزء"
      confirm:
        - text: "«(الْجُزْء) الْقطعَة من الشَّيْء وَمَا يتركب الشَّيْء مِنْهُ وَمن غَيره والنصيب»"
          source: "المعجم الوسيط"
        - text: "«الجُزْءُ: القِطعةُ من الشيء.»"
          source: "المعجم الكبير"
    - lemma: "قطعة"
      confirm:
        - text: "«(الْقطعَة) الْحصَّة من الشَّيْء»"
          source: "المعجم الوسيط"
        - text: "«القِطْعَة: طائفة من كل شيء»"
          source: "كتاب العين"
    - lemma: "بَضْعَة"
      confirm:
        - text: "«القطعة المجتمعة من اللَّحْم كالهَبْرة القِطعة من كلّ شيء»"
          source: "المعجم الكبير"
    - lemma: "فِلْقَة"
      expands:
        - text: "«القطعة من الجفنة: أحد نصفيها إذا انفلقت»"
          source: "المعجم الوسيط"
    - lemma: "شِقَّة"
      expands:
        - text: "«نِصْف الشيء إذا شُقَّ القطعة المشقوقة أو المنشقة»"
          source: "المعجم الوسيط"
    - lemma: "قِسْم"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "جزء"
      decision: confirmed
      decision_reason: "كلمة فصيحة وشائعة ومناسبة للتعبير عن المفهوم، ووردت في المعاجم بمعنى القطعة من الشيء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُزْء"
    - lemma: "قطعة"
      decision: confirmed
      decision_reason: "أدق اللمات تعبيراً عن الجزء المنفصل أو المقطوع من الشيء المادي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِطْعَة"
    - lemma: "قِسْم"
      source: stage1
      decision: removed
      decision_reason: "القسم أقرب إلى الحصة أو التصنيف ولا يفيد بالضرورة الانفصال المادي كدلالة القطعة."
    - lemma: "فِلْقَة"
      source: stage1
      decision: removed
      decision_reason: "تختص بالجزء المشقوق أو المكسور كالأخشاب واللقم ونحوها، فهي أخص من المفهوم المطلوب."
    - lemma: "بَضْعَة"
      source: stage1
      decision: removed
      decision_reason: "رغم دلالتها على القطعة، إلا أن غلبتها على قطعة اللحم تجعلها غير مناسبة لتكون مرادفا عاما ومباشرا للقطعة من أي شيء."
    - lemma: "شِقَّة"
      source: stage1
      decision: removed
      decision_reason: "تختص بالجزء المشقوق مستطيلا، ولا تصلح لعموم القطع."

stage4_content:
  definition:
    current: "جزء منفصل من كل"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على كلمة 'جزء' وهي إحدى لمات المجموعة، مما يوقع في الدوران المعجمي."
    authored:
      - type: terminological
        text: "طائفة أو حصة مقتطعة ومنفصلة من شيء كامل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "طائفة أو حصة مقتطعة ومنفصلة من شيء كامل."

  examples:
    per_lemma:
      - lemma: "جُزْء"
        examples:
          - text: "انفصل جُزْءٌ من الماكينة أثناء التشغيل."
            type: usage
      - lemma: "قِطْعَة"
        examples:
          - text: "أعطى السائلَ قِطْعَةً من الرغيف."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "انفصل جُزْءٌ من الماكينة أثناء التشغيل."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أعطى السائلَ قِطْعَةً من الرغيف."

stage5_enrichment:
  per_entry:
    - lemma: "جُزْء"
      entry_id: "{auto}"
      root: "جزأ"
      maqayis_quote: "«الْجِيمُ وَالزَّاءُ وَالْهَمْزَةُ أَصْلٌ وَاحِدٌ، هُوَ الِاكْتِفَاءُ بِالشَّيْءِ... وَالْجَُزْءُ: الطَّائِفَةُ مِنَ الشَّيْءِ.»"
    - lemma: "قِطْعَة"
      entry_id: "{auto}"
      root: "قطع"
      maqayis_quote: "«الْقَافُ وَالطَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى صَرْمٍ وَإِبَانَةِ شَيْءٍ مِنْ شَيْءٍ.»"

  per_sense:
    - lemma: "جُزْء"
      sense_id: "{auto}"
      nuance: "تعبير عام عن بعض الشيء، وقد تدل على مقدار أو مكون سواء كان منفصلا أو متصلا."
      mwe: false
    - lemma: "قِطْعَة"
      sense_id: "{auto}"
      nuance: "أكثر تخصيصاً للدلالة على الجزء المقتطع أو المنفصل ماديا عن الشيء."
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جزأ","maqayis":"«الْجِيمُ وَالزَّاءُ وَالْهَمْزَةُ أَصْلٌ وَاحِدٌ، هُوَ الِاكْتِفَاءُ بِالشَّيْءِ... وَالْجَُزْءُ: الطَّائِفَةُ مِنَ الشَّيْءِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قطع","maqayis":"«الْقَافُ وَالطَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى صَرْمٍ وَإِبَانَةِ شَيْءٍ مِنْ شَيْءٍ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبير عام عن بعض الشيء، وقد تدل على مقدار أو مكون سواء كان منفصلا أو متصلا.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"أكثر تخصيصاً للدلالة على الجزء المقتطع أو المنفصل ماديا عن الشيء.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95