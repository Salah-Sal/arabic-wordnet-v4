# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إشارة الدخل"
      decision: confirmed
      decision_reason: >-
        مُثبَّتة في المعيار الدولي IEC 60050 (موسوعة الكهرباء) بصيغتها الحرفية
        «إشارة الدخل» كمقابل لـ«input signal»، وتتكرر في مشتقاتها الوصفية (تناظرية،
        رقمية، ثنائية...) مما يؤكد تثبيتها المعجمي في المعيار التقني الدولي المعتمد.
        اجتازت اختبار السكّ: «إشارة الدخل» وحدة اصطلاحية لا يمكن إبدال «الدخل» فيها
        بـ«الإدخال» أو «الوارد» مع الحفاظ على الدلالة التقنية المحددة ذاتها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُرَكِّز على الإشارة في حد ذاتها بوصفها كيانًا كهربائيًا مُرسَلًا إلى النظام،
        ويُستخدم خصوصًا في معايير الهندسة الكهربائية وأنظمة الإرسال والوقاية.
        له مشتقات وصفية (إشارة دخل رقمية / تناظرية / ثنائية).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَةُ الدَّخْلِ"

    - lemma: "مُدْخَل"
      decision: confirmed
      decision_reason: >-
        موثَّق في معاجم عربية تقنية متعددة بمعنى «input» في الاقتصاد والمعلوماتية
        والاتصالات والتربية، فضلًا عن المعجم الكبير الذي يُثبته مصطلحًا حاسوبيًا.
        وزنه الصرفي (مُفْعَل = اسم مفعول من أَفْعَل) دقيق: مُدْخَل = ما أُدخِل إلى النظام.
        يُكمِل «إشارة الدخل» بتغطية المفهوم العام بدلًا من الإشارة المحددة.
        اختبار الاشتقاقية: وزن مُفْعَل إيجابي (قياسي، مُنتِج، قابل للجمع: مُدْخَلات).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يدل على «المُدخَل» كمفهوم وظيفي عام — أي كل ما يُدخَل إلى النظام أو تُغَذَّى
        به الآلة — سواء أكان إشارةً كهربائية أم بيانات أم طاقة، دون تخصيص نوع
        الإشارة. أشمل نطاقًا من «إشارة الدخل» وأكثر شيوعًا في الاستخدام المعلوماتي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدْخَل"

    - lemma: "إِشَارَةٌ وَارِدَةٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُوثَّق هذا التركيب في أي معجم تقني. «الواردة» في المعاجم الكلاسيكية
        تعني «القوم يَرِدون الماء» أو «الجادّة»، بلا أثر إلكتروني. فضلًا عن ذلك،
        فشل اختبار السكّ: يمكن إبدال «واردة» بـ«داخلة» أو «آتية» مع بقاء العبارة
        وصفًا صالحًا → ليس مصطلحًا مسكوكًا. وجود «إشارة الدخل» الراسخة يُغني عنه.

    - lemma: "دَاخِلَةٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        المعاجم الكلاسيكية والحديثة تُثبِّت «الداخلة» بمعانٍ مادية ولسانية متعددة
        (طرف الإزار / غامض الأرض / صوت زائد في الكلمة) مما يُعيق توظيفها
        مصطلحًا للإشارة الإلكترونية دون التباس. يفشل اختبار الاشتراك اللفظي:
        الكلمة حيّة بدلالات راسخة تتعارض مع الاستخدام التقني المقترح.

    - lemma: "وَلِيجَةٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثَر على أي توثيق تقني للفظ في قواعد البيانات. رغم ملاءمة الجذر
        (ولج = دخل بعمق)، فإن «وليجة» ثابتة بمعنى «البطانة/الدخلاء» (مَن يُدخَلون
        في السر)، وهو مجاز يَبعُد عن المفهوم الهندسي. غياب أي سابقة استخدام
        تقني يجعل اعتمادها غير مستوفٍ لمعيار التثبيت المعجمي.

    - lemma: "مُغَذَّى"
      source: stage1
      decision: removed
      decision_reason: >-
        لم تُوثَّق «مُغَذَّى» مصطلحًا قائمًا بذاته لـ«input signal». رغم أن
        المعجمية التقنية تستخدم «التغذية» للإدخال (المورد الحديث)، فإن الجذر
        المستقر في هذا الاستخدام هو «دخل» (مُدخَل/مُدخَلات) لا «غذو/غذي».
        اعتماد مُغَذَّى سيوقع في تعارض مع مصطلح «التغذية» المستخدم لـ«power supply»
        في الهندسة الكهربائية → التباس مرفوض.


