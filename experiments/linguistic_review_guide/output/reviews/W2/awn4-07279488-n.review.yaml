# مراجعة المجموعة الترادفية — Synset Review
# ID: awn4-07279488-n  |  ILI: i74852  |  POS: n
# التعريف الإنجليزي: signal going into an electronic system
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «مُدْخَل» ذات نطاق دلالي واسع تمتد عبر مجالات عدة (دخول، مدخل، مُدخَل) مما يستدعي تدقيق السياق الإلكتروني"
      - "لمّة «إشارة الدخل» تعبير مركب إضافي — يجب التحقق من تثبيتها المعجمي في المصادر التقنية"
      - "التعريف الحالي يستخدم «تدخل» (فعل) بدلاً من مصطلح أدق كـ«تُرسَل» أو «تُغَذَّى»، مما يُضعف دقته الاصطلاحية"
      - "المجموعة تجمع بين دلالتَي «input signal» (محدد) و«input» (عام) في مجموعة واحدة دون تمييز"
    observations: >-
      المجموعة تمثّل مفهومًا تقنيًا راسخًا في الهندسة الكهربائية والمعلوماتية.
      التوجّه العام صائب: اللمتان تغطيان البُعدَين المتكاملَين — الإشارة بوصفها
      وحدةً كهربائية (إشارة الدخل)، والمدخل بوصفه مفهومًا وظيفيًا عامًا (مُدْخَل).
      لكن التعريف قابل للتحسين ليكون أكثر دقةً اصطلاحية.
  blind_candidates:
    - lemma: "إِشَارَةٌ وَارِدَةٌ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من إشارة + وارد (اسم فاعل من ورد = يفد/يأتي). يعكس فكرة
        «الإشارة التي تِرد إلى النظام»، ويوازي المصطلح الإنجليزي «incoming signal».
        الوصف وارد حيٌّ في الاستخدام التقني العربي (واردات/صادرات).
    - lemma: "دَاخِلَةٌ"
      generation_method: ishtiqaq
      justification: >-
        اسم فاعل مؤنث من دخل (يَدخل): «ما يدخل إلى الشيء». وزن فَاعِلَة يصف
        الإشارة بفعلها: الدخول إلى النظام. مقابل «خارجة» للمخرجات، مما يجعل
        الثنائية الاصطلاحية متناسقة.
    - lemma: "وَلِيجَةٌ"
      generation_method: majaz
      justification: >-
        إحياء للفظ عربي كلاسيكي: الوَلِيجَة = من يَلِج إلى الباطن (البطانة/الدخلاء).
        يُوظَّف مجازًا للإشارة التي تَلِجُ إلى داخل النظام الإلكتروني. جذر ولج يحمل
        دلالة الدخول العميق التي تناسب مفهوم «الإدخال» أكثر من مجرد «الدخول».
    - lemma: "مُغَذَّى"
      generation_method: ishtiqaq
      justification: >-
        اسم مفعول من غذَّى (II): «ما يُغذَّى به النظام/الجهاز». جذر غذو/غذي يحمل
        دلالة التزويد والتغذية. تستخدم معاجم تقنية «التغذية» للإدخال في الحاسوب
        (المورد الحديث)، فمُغَذَّى = ما يُدخَل تغذيةً للنظام.


