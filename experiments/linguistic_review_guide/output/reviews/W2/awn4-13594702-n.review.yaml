stage1_review:
  assessment:
    concerns:
      - "المصطلح الحالي غير مشكّل ويحتاج إلى ضبط إملائي."
      - "التعريف الحالي ركيك ويبدو مترجماً ترجمة حرفية من الإنجليزية."
    observations: "المصطلح عبارة عن مركب إضافي (رقمنة + فيديو) يعبر عن المفهوم التقني الحديث بشكل مباشر ودقيق، وهو مستعمل ومقبول في الأدبيات التقنية والمعلوماتية المعاصرة."
  blind_candidates:
    - lemma: "رَقْمَنَةُ الْفِيدْيُو"
      generation_method: tarkib
      justification: "تركيب إضافي من 'رقمنة' (تحويل إلى الصيغة الرقمية) و'فيديو'، وهو المقابل المباشر والشائع للمصطلح الإنجليزي."
    - lemma: "تَحْوِيلٌ رَقْمِيٌّ مَرْئِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يوضح عملية التحويل إلى الصيغة الرقمية للمواد المرئية."
    - lemma: "تَرْقِيمُ الْفِيدْيُو"
      generation_method: tarkib
      justification: "استخدام المصدر 'ترقيم' من الفعل 'رقّم' كبديل لـ 'رقمنة'."
    - lemma: "رَقْمَنَةٌ مَرْئِيَّةٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يدمج بين عملية الرقمنة وطبيعة المادة المرئية كبديل لذكر كلمة 'فيديو' المعربة."

stage2_evidence:
  per_lemma:
    - lemma: "رقمنة الفيديو"
      expands:
        - text: "«(في علوم الحاسب الآلى): تحويل النُّصوص والصُّوَر إلى لغة الحاسوب الرقميَّة بما لها من قُدرة على الحفظ والنَّقْل والاسترجاع»"
          source: "المعجم الكبير"
          addition: "يدعم استخدام كلمة 'رقمنة' للدلالة على التحويل الرقمي."
        - text: "«جهاز يسجّل المناسبات والأحداث صوتًا وصورة على أشرطة ممغنطة، ويقوم بعرض ما سُجِّل على هذه الأشرطة تلفزيونيًّا أو على شاشة عرض سينمائيّة»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "يثبت تعريب كلمة 'فيديو' واستخدامها في المعاجم الحديثة."
    - lemma: "رَقْمَنَةُ الْفِيدْيُو"
      evidence_status: "no_material_found"
    - lemma: "تَحْوِيلٌ رَقْمِيٌّ مَرْئِيٌّ"
      evidence_status: "no_material_found"
    - lemma: "تَرْقِيمُ الْفِيدْيُو"
      evidence_status: "no_material_found"
    - lemma: "رَقْمَنَةٌ مَرْئِيَّةٌ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "رقمنة الفيديو"
      decision: confirmed
      decision_reason: "مركب إضافي دقيق وواضح يعبر عن المفهوم المتمثل في تحويل محتوى الفيديو إلى صيغة رقمية. اللفظان مكونان معتمدان معجمياً في المعاجم الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَقْمَنَةُ الْفِيدْيُو"
    - lemma: "رَقْمَنَةُ الْفِيدْيُو"
      source: stage1
      decision: removed
      decision_reason: "مكرر مع اللمة الموجودة في المجموعة بعد التشكيل."
    - lemma: "تَحْوِيلٌ رَقْمِيٌّ مَرْئِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك كمركب اصطلاحي ثابت."
    - lemma: "تَرْقِيمُ الْفِيدْيُو"
      source: stage1
      decision: removed
      decision_reason: "كلمة 'رقمنة' أصبحت أدق وأكثر شيوعاً للدلالة على التحويل الرقمي (Digitization) مقارنة بـ 'ترقيم' التي تعني وضع الأرقام."
    - lemma: "رَقْمَنَةٌ مَرْئِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي عام لا يخصص مفهوم 'الفيديو' المعين بدقة كما يفعل المركب الإضافي المباشر."

stage4_content:
  definition:
    current: "عملية التقاط وتحويل وتخزين صور الفيديو لاستخدامها بواسطة الكمبيوتر"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك ويبدو مترجماً ترجمة حرفية من الإنجليزية. تمت إعادة صياغته بلغة معجمية علمية دقيقة ومناسبة."
    authored:
      - type: terminological
        text: "عملية تحويل الإشارات المرئية المتصلة في مقاطع الفيديو إلى بيانات رقمية قابلة للمعالجة والتخزين عبر الحاسوب."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية تحويل الإشارات المرئية المتصلة في مقاطع الفيديو إلى بيانات رقمية قابلة للمعالجة والتخزين عبر الحاسوب."

  examples:
    per_lemma:
      - lemma: "رَقْمَنَةُ الْفِيدْيُو"
        examples:
          - text: "سهّلت رَقْمَنَةُ الْفِيدْيُو عملية حفظ الأرشيف التلفزيوني وتعديله باستخدام برامج المونتاج الحديثة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "سهّلت رَقْمَنَةُ الْفِيدْيُو عملية حفظ الأرشيف التلفزيوني وتعديله باستخدام برامج المونتاج الحديثة."

