# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (ضعف) مكتوبة بدون تشكيل كامل، وهو إخلال بمعيار الضبط الصرفي المطلوب"
      - "المجموعة تحتوي لمّة واحدة رغم أن المفهوم له مرادفات راسخة في التراث كالوَهْن"
      - "التعريف الحالي ترجمة حرفية للنص الإنجليزي وليس تأليفاً معجمياً عربياً أصيلاً؛ عبارة (القابلية للفشل تحت الضغط) ركيكة أسلوبياً"
    observations: >-
      مجموعة ترادفية للمفهوم الجوهري «الضعف» — خلاف القوة — وهو من أعرق المفاهيم في
      المعجم العربي وأوفرها توثيقاً. الجذر (ض ع ف) مسجّل في جميع المعاجم الكبرى منذ
      كتاب العين، ولابن فارس في المقاييس نصّ صريح. غياب مرادف فعلي كالوَهْن — المُثبَت
      قرآنياً وطبياً — يُفقر المجموعة دلالياً ويُضيّق نطاق الاسترجاع المعلوماتي.
      يستحق التعريف مراجعة جذرية لاستبدال الأسلوب الترجمي بصياغة معجمية عربية.
  blind_candidates:
    - lemma: "وَهْن"
      generation_method: ishtiqaq
      justification: >-
        مصدر من الجذر (وهن) على وزن فَعْل، يدل على الضعف وفتور القوى. موثّق قرآنياً
        (وَلَا تَهِنُوا وَلَا تَحْزَنُوا) وفي كبرى المعاجم الكلاسيكية، ويُستخدم طبياً
        معاصراً للدلالة على وهن القوى العضلية والحيوية (asthenia, adynamia). يناسب
        بالضبط الدلالة: خلاف القوة البدنية.
    - lemma: "هَشَاشَة"
      generation_method: majaz
      justification: >-
        أصل المعنى القابلية للتفتت والكسر (brittleness/fragility)، وقد تُمتدّ دلالتها
        مجازاً لتشمل ضعف البنية وانعدام المقاومة تحت الضغط — وهو ما تصفه المجموعة في
        شقها الثاني (القابلية للفشل تحت الضغط أو الإجهاد).
    - lemma: "خَوَر"
      generation_method: ishtiqaq
      justification: >-
        مصدر من الجذر (خور) يدل على الرخاوة والضعف. قال ابن فارس: «الخَوَّارُ: الضَّعِيفُ
        مِنْ كُلِّ شَيْءٍ. يُقَالُ رُمْحٌ خَوَّارٌ». يُستخدم للدلالة على الضعف العام
        في الأجسام والأشياء.
    - lemma: "ضَعَافَة"
      generation_method: ishtiqaq
      justification: >-
        مصدر على وزن فَعَالَة من الجذر (ضعف)، يدل على خاصية الضعف المجردة بوصفها
        صفة ثابتة للموصوف. ورد في القاموس المحيط ضمن تصاريف (ضَعُفَ): «ضَعَافَةً
        وضَعَافِيَةً». الوزن (فَعَالَة) عربي منتج للخصائص المجردة الملازمة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "ضعف"
      confirm:
        - text: >-
            «الضَّادُ وَالْعَيْنُ وَالْفَاءُ أَصْلَانِ مُتَبَايِنَانِ، يَدُلُّ أَحَدُهُمَا عَلَى
            خِلَافِ الْقُوَّةِ... فَالْأَوَّلُ: الضَّعْفُ وَالضُّعْفُ، وَهُوَ خِلَافُ الْقُوَّةِ.
            يُقَالُ: ضَعُفَ يَضْعُفُ، وَرَجُلٌ ضَعِيفٌ، وَقَوْمٌ ضُعَفَاءُ وَضِعَافٌ»
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
        - text: >-
            «الضَّعْفُ والضُّعْفُ: خلاف القوَّة. وقد ضَعُفَ فهو ضعيفٌ، وأضْعَفَهُ غيره.
            وقومٌ ضِعافٌ وضُعَفاءُ وضَعَفَةٌ»
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: >-
            «الضعف: وهن القوة حسا أو معنى... وتكون في النفس وفي البدن وفي الحال.
            وقيل بالضم في البدن، وبالفتح في العقل والرأي»
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: >-
            «الضَّعْفُ، ويُضَمُّ، ويُحَرَّكُ: ضِدُّ القُوَّةِ. ضَعُفَ، ككَرُمَ وَنَصَرَ،
            ضَعْفاً ضُعْفاً وضَعَافَةً وضَعَافِيَةً، فهو ضعيفٌ»
          source: "القاموس المحيط للفيروزآبادي"
        - text: >-
            «الضُّعْفُ: خلاف القوّة. الضَّعْفُ في العقل والرأي، والضُّعْفُ في الجسد»
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "ضَعْف — translation_en: asthenia; weakness (domain: Veterinary Medicine)"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "ضَعْف — translation_en: hypodynamia"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: >-
            «الضّعف: خلاف القوة، ويسمّى لا قوة أيضاً، وهو قسم من الاستعداد... وعند أهل
            الصرف كون الكلمة بحيث يقع في ثبوتها كلام... وعند المحدثين كون الحديث بحيث لا
            يوجد فيه شرط واحد أو أكثر من شروط الصحيح»
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: >-
            يكشف المدخل أن لـ«الضعف» استخدامات اصطلاحية متعددة (صرفية، بلاغية، حديثية)
            مما يدل على أن اللمّة مُشتركة لفظياً، وأن الدلالة في هذه المجموعة هي المعنى
            الأول فقط (خلاف القوة)

    # ── مرشح المرحلة ١ — وهن ──
    - lemma: "وَهْن"
      confirm:
        - text: >-
            «الْوَاوُ وَالْهَاءُ وَالنُّونُ: كَلِمَتَانِ تَدُلُّ إِحْدَاهُمَا عَلَى ضَعْفٍ...
            فَالْأُولَى: وَهَنَ الشَّيْءُ يَهِنُ وَهْنًا: ضَعُفَ، وَأَوْهَنْتُهُ أَنَا»
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
        - text: >-
            «الوَهْنُ: الضَّعْفُ في العَمَلِ، ويُحَرَّكُ... وَوَهَنَه وأوْهَنَهُ ووَهَّنَهُ:
            أضْعَفَهُ. وهو واهِنٌ ومَوْهُونٌ: لا بَطْشَ عندَهُ»
          source: "القاموس المحيط للفيروزآبادي"
        - text: "الوهن — translation_en: adynamia (vital debility) — «ضعف القوة العضلية، كما يحدث في بعض الأمراض»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "الوهن — translation_en: athenia — «الضعف وذبول الحيوية»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "الوهن — translation_en: debility — «فقد القوة أو نقصها»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "وَهَن — translation_en: adynamia (asthenia)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "وهن (جسمي أو نفسي) — translation_en: asthenia"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "(1) عجْز؛ وَهَن؛ ضَعف / (2) مَرَض؛ سقم — translation_en: infirmity"
          source: "المورد الحديث (2008)"

    # ── مرشح المرحلة ١ — هشاشة ──
    - lemma: "هَشَاشَة"
      contradicts:
        - text: >-
            «الهشاشة: مقابل اللزوجة ويرادفها الملاسة، والهشّ يقابل اللّزج...
            والهشّ عند الأطباء دواء يتفتّت أي يتحوّل إلى أجزاء صغار بأدنى مسّ كالصبر»
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >-
            الهشاشة تدل على القابلية للتفتت والكسر (fragility/friability) وليست مرادفاً
            لخلاف القوة البدنية أو العقلية
        - text: "هَشَاشَة — translation_en: fragility"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "fragility ≠ weakness؛ الدلالة هي سهولة الكسر لا انعدام القوة"
        - text: "هَشَاشَة — translation_en: crispiness (domain: Food Technology)"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "الاستخدام الغذائي والدوائي يؤكد أن الدلالة هشاشة مادية لا ضعف بدني/عقلي"
        - text: "«هشاشة الْعِظَام مرض خلقي نادر يُصِيب الهيكل العظمي»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (الحوراني)"
          conflict: "الاستخدام الوحيد للمصطلح في المعجم الوسيط هو مرض عظمي محدد لا الضعف العام"

    # ── مرشح المرحلة ١ — خور ──
    - lemma: "خَوَر"
      contradicts:
        - text: >-
            «الخور — translation_en: hypobulia — نقص في الإرادة»
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: >-
            ARABTERM يربط الخور بـhypobulia (نقص الإرادة) لا بـweakness؛ مفهوم مختلف
        - text: >-
            «الخَوْرُ: المُنْخَفَضُ المُطْمَئِنُّ من الأَرْضِ بين نَشْزَيْنِ... مَصَبُّ الماءِ
            فى البَحْرِ... الخَلِيجُ من البَحْر»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "الدلالة الغالبة في المعاجم الكبرى هي التضاريس الجغرافية، لا الضعف"
      expands:
        - text: >-
            «الْخَوَّارَ: الضَّعِيفُ مِنْ كُلِّ شَيْءٍ. يُقَالُ رُمْحٌ خَوَّارٌ، وَأَرْضٌ
            خَوَّارَةٌ... إِذَا جَعَلَتْ خُورَ الرِّجَالِ تَهِيعُ»
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
          addition: >-
            ابن فارس يُثبت أصلاً ثانياً للجذر دالاً على الضعف (خوّار = الضعيف من كل شيء)،
            غير أن هذا الأصل مرتبط بالصفة (خوّار) لا بالمصدر المجرد (خَوَر)

    # ── مرشح المرحلة ١ — ضعافة ──
    - lemma: "ضَعَافَة"
      confirm:
        - text: "ضَعَافَةٌ — translation_en: debilitation"
          source: "المعجم الطبي الموحد (2009)"
        - text: "ضَعَافَةٌ — translation_en: debility"
          source: "المعجم الطبي الموحد (2009)"
        - text: >-
            «ضَعُفَ، ككَرُمَ وَنَصَرَ، ضَعْفاً ضُعْفاً وضَعَافَةً وضَعَافِيَةً»
          source: "القاموس المحيط للفيروزآبادي"
      contradicts:
        - text: "المعجم الطبي المصدر الوحيد الذي يوثّق ضعافة بصورة مستقلة في ARABTERM"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >-
            ضعافة شكل مصدري موثَّق صرفياً لكنه أقل تداولاً من ضعف في المتون الكلاسيكية
            والاستخدام المعاصر؛ ويتداخل مع ضعف دون إضافة فارق دلالي واضح


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة: ضعف ──
    - lemma: "ضعف"
      decision: confirmed
      decision_reason: >-
        اللمّة راسخة في جميع طبقات التراث المعجمي من كتاب العين إلى المعاجم المعاصرة، وهي
        الترجمة العربية القياسية لـweakness في المصطلحات الطبية والعلمية. تحتاج فقط إضافة
        التشكيل الكامل (ضَعْف بالفتح للمعنى الشامل العقلي والبدني، أو ضُعْف بالضم للبدن)؛
        اخترنا ضَعْف بناءً على استخدام الخليل وكثير من المعجميين لصيغة الفتح في الدلالة
        العامة، مع ملاحظة أن الصحاح يجيز الصيغتين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        المصطلح العام الأشمل لخلاف القوة، يستوعب ضعف البدن والعقل والرأي والحال. هو
        المرجع الأول عند الإطلاق، ويرادف «weakness» في جميع السياقات العلمية والعامة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ضَعْف"

    # ── مرشح المرحلة ١: وهن ──
    - lemma: "وَهْن"
      source: stage1
      decision: confirmed
      decision_reason: >-
        موثَّق في مقاييس اللغة لابن فارس، والقاموس المحيط، وكبرى المعاجم الكلاسيكية،
        ومجموعة واسعة من معاجم ARABTERM الطبية (asthenia, adynamia, debility). يحمل
        دلالة مخصوصة هي فتور القوى الحيوية والعضلية والجسدية، مما يُثري المجموعة.
        تجاوز اختبار السكّ: وهن مصدر جامد لا يقبل إبدال مكوناته (ليس تعبيراً وصفياً).
        لا لهجية فيه، فصيح قرآني وكلاسيكي وطبي. الوزن (فَعْل) مناسب للمصادر الدالة
        على الأحوال البدنية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يركز على فتور الطاقة الحيوية وضعف القوى العضلية والجسدية تحديداً، وهو أدق من
        ضعف في السياق الطبي عند وصف الإنهاك الجسدي. ضَعْف أشمل وأعم، أما وَهْن فيُلمح
        إلى استنزاف الطاقة الحيوية بوجه خاص.
      actions:
        - command: create_entry
          params:
            lemma: "وَهْن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: هشاشة — مرفوض ──
    - lemma: "هَشَاشَة"
      source: stage1
      decision: removed
      decision_reason: >-
        دلالة هشاشة في المعاجم هي القابلية للتفتت والكسر (fragility/brittleness) —
        وهي خاصية مادية مخالفة لمفهوم الضعف البدني والعقلي. ARABTERM يربطها بالهشاشة
        الدوائية وهشاشة العظام (مرض محدد). لا يصح المجاز هنا لأن الفارق الدلالي حادّ
        ويوجد خطر اشتراك لفظي مع المرض العظمي.

    # ── مرشح المرحلة ١: خور — مرفوض ──
    - lemma: "خَوَر"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم أن ابن فارس يُثبت للجذر أصلاً دالاً على الضعف، إلا أن المصدر المجرد (خَوَر)
        يُستخدم في الجغرافيا (خور = منخفض/خليج)، وARابTERM يربطه بـhypobulia (نقص
        الإرادة) لا بالضعف العام. كما أن الصفة (خوّار) أكثر حضوراً من المصدر في سياق
        الضعف. الإدراج سيُفضي إلى التباس دلالي.

    # ── مرشح المرحلة ١: ضعافة — مرفوض ──
    - lemma: "ضَعَافَة"
      source: stage1
      decision: removed
      decision_reason: >-
        موثَّق صرفياً في القاموس المحيط وطبياً في ARABTERM، غير أنه لا يُضيف فارقاً
        دلالياً عن ضَعْف؛ كلاهما يدل على خاصية الضعف من الجذر ذاته. الوزن (فَعَالَة)
        أقل تداولاً وأثقل لفظاً في الاستخدام الاصطلاحي المعاصر. إدراجه سيُحدث ازدواجاً
        لا إثراءً دلالياً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "خاصية الافتقار إلى القوة البدنية أو العقلية؛ القابلية للفشل تحت الضغط أو الإجهاد أو التوتر"
    assessment:
      decision: revise
      reason: >-
        التعريف ترجمة حرفية للإنجليزية وليس تأليفاً معجمياً عربياً. «القابلية للفشل تحت الضغط»
        عبارة ركيكة لا تناسب أسلوب المعجم العربي. يجب الاستئناس بتعريف المناوي «وهن القوة
        حسا أو معنى» وتعريف المقاييس «خلاف القوة» مع إضافة الفصل النوعي المناسب.
    authored:
      - type: terminological
        text: >-
          خِلَافُ القُوَّةِ البَدَنِيَّةِ أَوِ العَقْلِيَّةِ؛ قُصُورُ الطَّاقَةِ الجِسْمِيَّةِ
          أَوِ الذِّهْنِيَّةِ عَنِ احْتِمَالِ الجَهْدِ وَمُقَاوَمَةِ الضَّغْطِ وَالإِجْهَادِ
        quality_check:
          genus_present: true
          differentia_present: true
