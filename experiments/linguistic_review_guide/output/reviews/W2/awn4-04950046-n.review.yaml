stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث الموجودة (استعداد، ميل، نزعة) جميعها خالية من التشكيل — يجب تحديثها."
      - "لمّة «نزعة» في المعاجم الكلاسيكية تُعرَّف أساساً بـ«موضع انحسار الشعر من جانبي الجبهة»، لا بالاستعداد النفسي — الدعم الكلاسيكي ضعيف."
      - "المجموعة تفتقر إلى ألفاظ تراثية راسخة تغطي البُعد الفطري الثابت للمفهوم (كالسجية والطبع والشيمة)."
      - "التعريف العربي الحالي قائم على ترجمة حرفية من الإنجليزية، واستخدامه كلمة «ميل» في التعريف يوقع في الدوران لأن «ميل» لمّةٌ في المجموعة ذاتها."
    observations: >-
      المجموعة تُعبِّر عن مفهوم «الاستعداد أو الميل الكامن في الشخص أو الشيء»، وهو مفهوم موثَّق في العربية التراثية بكثير من الألفاظ الدقيقة. اللمّة المحورية «استعداد» معتمدةٌ وصحيحة، وتشهد لها كتب الاصطلاحات الكلاسيكية صراحةً (التهانوي يربطها بـDisposition إنجليزاً وفرنساً). أما «ميل» فهو صحيح لكنه يحتمل الإيهام لتعدد دلالاته (المسافة، الانحراف الهندسي، الميل النفسي). و«نزعة» تكتسب دلالتها الحديثة في النزوع الفكري والأيديولوجي لا في الاستعداد العام. يُقترح إثراء المجموعة بمصطلحات تراثية أكثر خصوصية.
  blind_candidates:
    - lemma: "سَجِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مشتقة من جذر (سجو) على وزن فَعِيلَة، وتدل على ما رسخ في طبيعة الشخص وسكن فيه من عادة وخلق. تحقق معنى «الميل الطبيعي الراسخ» في التعريف دون أن تقع في الدوران مع ألفاظ المجموعة.
    - lemma: "طَبْع"
      generation_method: ishtiqaq
      justification: >-
        من جذر (طبع) على وزن فَعْل، ويعبِّر عن «السجية التي جُبِل عليها الإنسان»، أي الطابع الأصيل أو المكتسب الذي يسِم الشخص أو الشيء — وهو قلب دلالة «الاستعداد الكامن» في المجموعة.
    - lemma: "جِبِلَّة"
      generation_method: ishtiqaq
      justification: >-
        من جذر (جبل) على وزن فِعِلَّة، وتعني «الطبيعة الفطرية التي جُبِل عليها الإنسان»، كالخليقة والغريزة. تغطي البُعد الفطري في التعريف («عادة طبيعية») بصورة مباشرة.
    - lemma: "شِيمَة"
      generation_method: ishtiqaq
      justification: >-
        من جذر (شيم) على وزن فِعْلَة، وتعني «الخلق والطبيعة الراسخة»، وقد استُعملت في الشعر العربي القديم للدلالة على الميل الثابت في شخصية الإنسان.


