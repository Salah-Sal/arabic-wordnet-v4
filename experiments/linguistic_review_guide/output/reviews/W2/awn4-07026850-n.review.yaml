stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (سلسلة كلمات، سلسلة لغوية) مركبات إضافية/وصفية وصفية حرة لا ثابتة، تجتاز اختبار الإبدال (سلسلة ألفاظ، سلسلة نحوية) مما يشكّك في تثبيتها المعجمي"
      - "اللمّتان تفتقران إلى التشكيل الكامل"
      - "المفهوم (تتابع خطي للكلمات) مفهوم لساني تقني لا يوجد له لفظ عربي مفرد مسكوك، بل يُعبَّر عنه بتركيب وصفي"
    observations: "المفهوم المقصود هو التتابع الخطي للكلمات كما تُنطق أو تُكتب، وهو مصطلح من اللسانيات البنيوية (string) يُقابل في الاستعمال العربي مصطلح «السلسلة الكلامية» عند هاريس وغيره. الجنس القريب هو «تواصل لغوي» وهذا يجعل المفهوم نوعاً فرعياً منه. اللمّتان الموجودتان تترجمان المصطلح الإنجليزي ترجمة حرفية مقبولة في الاستعمال التقني."
  blind_candidates:
    - lemma: "نَظْم"
      generation_method: majaz
      justification: "من نَظْمِ اللؤلؤ في سِلك — استعارة كلاسيكية لضمّ الكلمات بعضها إلى بعض في ترتيب خطي، مستعمل عند عبد القاهر الجرجاني وغيره"
    - lemma: "سِلْسِلَة كَلامِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي-وصفي: سلسلة (تتابع حلقات متصلة) + كلامية (منسوبة إلى الكلام)، مصطلح مستعمل في اللسانيات العربية عند ترجمة speech chain"
    - lemma: "مُتَوَالِيَة كَلِمَات"
      generation_method: tarkib
      justification: "مركب إضافي: متوالية (من التوالي والتتابع) + كلمات، يؤدي معنى التتابع الخطي بدقة"
    - lemma: "مَنْظُومَة لَفْظِيَّة"
      generation_method: ishtiqaq
      justification: "اسم مفعول من نَظَمَ على وزن مَفْعُولَة + نسبة، أي ألفاظ منظومة في سلك واحد"


stage2_evidence:
  per_lemma:
    - lemma: "سِلْسِلَة كَلِمَات"
      expands:
        - text: "«(السلسلة) حلقات ونحوها يتصل بعضها ببعض ويعبر بها عن الأشياء المتتابعة فيقال سلسلة مقالات أو مؤلفات وما أشبه (محدثة)»"
          source: "المعجم الوسيط"
          addition: "السلسلة تُستعمل مجازاً للأشياء المتتابعة، واستعمالها مع الكلمات امتداد طبيعي لهذا المجاز المحدَث"
        - text: "«اللغة عبارة عن سلسلة من الأصوات المكونة للألفاظ والتي نعطيها تعريف السلسلة الكلامية. التحليل بالسلسلة عند هاريس يقوم على وصف الألفاظ بأنها سلاسل من الصرفيات أو متواليات من الصرفيات.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "تأكيد استعمال «سلسلة» في السياق اللساني بمعنى التتابع الخطي للوحدات اللغوية"
        - text: "«بنية معطيات لغات البرمجة المتطورة التي توجد فيها متتالية محارف. السلسلات تقوم بدور مهم عند إنجاز بعض الوظائف»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "تأكيد استعمال «سلسلة» بمعنى string التقني"

    - lemma: "سِلْسِلَة لُغَوِيَّة"
      expands:
        - text: "«اللغة عبارة عن سلسلة من الأصوات المكونة للألفاظ والتي نعطيها تعريف السلسلة الكلامية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "المعجم اللساني يستعمل «سلسلة كلامية» لا «سلسلة لغوية»، مما يشير إلى أن الصفة «كلامية» أدق في هذا السياق"

    - lemma: "نَظْم"
      confirm:
        - text: "«النَّظْم: التأليف، وضمُّ شيء إلى شيء آخر»"
          source: "القاموس المحيط"
        - text: "«النّظم: يطلق على تأليف الكلمات والجُمل مرتبة المعاني متناسبة الدلالات على حسب ما يقتضيه العقلُ»"
          source: "التعريفات الفقهيّة للبركتي"
      contradicts:
        - text: "«النّظم: المنظوم والكلام الموزون المقفى وهو خلاف النثر»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال المعاصر يخصّص «النظم» للشعر الموزون، لا لمطلق تتابع الكلمات"
      expands:
        - text: "«(نَظَمَ) النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتَأْلِيفِهِ، وَنَظَمْتُ الْخَرَزَ نَظْمًا، وَنَظَمْتُ الشِّعْرَ وَغَيْرَهُ. وَالنِّظَامُ: الْخَيْطُ يَجْمَعُ الْخَرَزَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدل على ضمّ أشياء في سلك — مطابق للمفهوم، لكن اللفظ توسّع فشمل الشعر والنثر والكلام عموماً"

    - lemma: "سِلْسِلَة كَلامِيَّة"
      confirm:
        - text: "«اللغة عبارة عن سلسلة من الأصوات المكونة للألفاظ والتي نعطيها تعريف السلسلة الكلامية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(السلسلة) حلقات ونحوها يتصل بعضها ببعض ويعبر بها عن الأشياء المتتابعة»"
          source: "المعجم الوسيط"
          addition: "يؤكد صلاحية «سلسلة» للتعبير عن التتابع"

    - lemma: "مُتَوَالِيَة كَلِمَات"
      evidence_status: "no_material_found"

    - lemma: "مَنْظُومَة لَفْظِيَّة"
      evidence_status: "no_material_found"


