stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي يتسم بالدوران (Circular definition) حيث يستخدم اللمة 'انزلاق' في تعريف المفهوم نفسه 'بسبب الانزلاق'."
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
    observations: "تمثل هذه المجموعة الترادفية مفهماً هندسياً دقيقاً يتعلق بكفاءة نقل الطاقة في الأنظمة الميكانيكية. في سياق الفيزياء والهندسة، 'slippage' (الانزلاق) ليس مجرد فعل، بل هو مقدار النقص الكمي في القدرة المنقولة نتيجة عدم التماسك الكامل بين الأجزاء المتلامسة (مثل السيور أو القوابض)."
  blind_candidates:
    - lemma: "انْزِلَاق"
      generation_method: ishtiqaq
      justification: "المصطلح القياسي في الهندسة الميكانيكية للتعبير عن ظاهرة (slip) وعن الفقد الناتج عنها (slippage)."
    - lemma: "تَفَالُت"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (فلت) لوصف فقدان التماسك الميكانيكي أو 'إفلات' الطاقة من مسارها المنقول."
    - lemma: "فَقْدُ الِانْزِلَاق"
      generation_method: tarkib
      justification: "تعبير مركب يصف بدقة الجانب الكمي للمفهوم (نقصان القدرة) المذكور في التعريف."
    - lemma: "تَسَرُّبُ الطَّاقَة"
      generation_method: majaz
      justification: "إزاحة دلالية لوصف ضياع الطاقة المنقولة في النظام الميكانيكي كأنها تتسرب منه."

stage2_evidence:
  per_lemma:
    - lemma: "انزلاق"
      confirm:
        - text: "يُقصد به الفارق في سرعة الدوران بين العمود المرفقي وعمود دخل صندوق التروس أثناء عملية تعشيق القابض... وفي حالة التعشيق، يتصل العمود المرفقي احتكاكيا... وهنا يتم نقل عزم الدوران بالكامل ويكون الفارق في سرعة الدوران صفراً."
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
        - text: "الفرق النسبي بين سرعة القيادة وسرعة الإنطلاق إلى سرعة القيادة."
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      expands:
        - text: "التأثير الانزلاقي الحادث في مُولِّد تزامني أو آلة تزامنية."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "تَفَالُت"
      evidence_status: "no_material_found"
    - lemma: "فَقْدُ الِانْزِلَاق"
      evidence_status: "no_material_found"
    - lemma: "تَسَرُّبُ الطَّاقَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "انزلاق"
      decision: confirmed
      decision_reason: "المصطلح الفني الوحيد المستخدم في المعاجم المتخصصة (السيارات، النقل، الطاقة) للتعبير عن مفهوم الانزلاق الميكانيكي وفقدان القدرة الناتج عنه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْزِلَاق"
    - lemma: "تَفَالُت"
      source: stage1
      decision: removed
      decision_reason: "رغم كونه اشتقاقاً صحيحاً، إلا أنه غير مستخدم اصطلاحاً في السياق الهندسي الميكانيكي مقارنة بكلمة انزلاق."
    - lemma: "فَقْدُ الِانْزِلَاق"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي وليس مصطلحاً معجمياً مسكوكاً."
    - lemma: "تَسَرُّبُ الطَّاقَة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مجازي عام لا يختص بظاهرة الانزلاق الميكانيكي حصراً."

stage4_content:
  definition:
    current: "انخفاض الطاقة المنقولة في نظام ميكانيكي بسبب الانزلاق"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري (يستخدم المعرَّف في التعريف) ويفتقر للدقة التقنية في وصف كيفية حدوث هذا الانخفاض."
    authored:
      - type: terminological
        text: "نقصان القدرة أو عزم الدوران المنقول في نظام ميكانيكي نتيجة عدم التماسك الكامل بين الأسطح المتلامسة، مما يؤدي إلى تفاوت في سرعات الأجزاء المتصلة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13577452-n"
          definition_index: 0
          text: "نقصان القدرة أو عزم الدوران المنقول في نظام ميكانيكي نتيجة عدم التماسك الكامل بين الأسطح المتلامسة، مما يؤدي إلى تفاوت في سرعات الأجزاء المتصلة."
  examples:
    per_lemma:
      - lemma: "انزلاق"
        examples:
          - text: "يؤدي انزلاق سير المروحة في محرك السيارة إلى انخفاض كفاءة التبريد وزيادة استهلاك الوقود."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يؤدي انزلاق سير المروحة في محرك السيارة إلى انخفاض كفاءة التبريد وزيادة استهلاك الوقود."

