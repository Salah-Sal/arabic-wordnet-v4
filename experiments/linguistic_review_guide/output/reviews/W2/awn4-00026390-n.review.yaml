      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن الإدراك الأولي للحالة، سواء كانت جسدية أو نفسية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِحْسَاس"
    - lemma: "شُعُور"
      decision: confirmed
      decision_reason: "الكلمة المركزية في اللغة العربية للتعبير عن الفطنة للأشياء وتجربة الحالات الوجدانية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شُعُور"
    - lemma: "عَاطِفَة"
      decision: confirmed
      decision_reason: "تعبر عن الانفعال النفسي والميل الوجداني الموجه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَاطِفَة"
    - lemma: "وِجْدَان"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق يعبر عن المحتوى العاطفي للنفس البشرية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "وِجْدَان", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00026390-n"}
    - lemma: "مَشَاعِر"
      source: stage1
      decision: confirmed
      decision_reason: "استخدام فصيح معاصر يعبر عن مجموع الأحاسيس الوجدانية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَشَاعِر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-00026390-n"}

stage4_content:
  definition:
    current: "تجربة الحالات الوجدانية والعاطفية"
    assessment:
      decision: revise
      reason: "التعريف الحالي موجز جداً؛ يفضل استخدام صياغة معجمية تجمع بين الإدراك والتجربة."
    authored:
      - type: linguistic
        text: "إدراك الأحاسيس والانفعالات النفسية أو الوجدانية وتجربتها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-00026390-n", definition_index: 0, text: "إدراك الأحاسيس والانفعالات النفسية أو الوجدانية وتجربتها."}
  examples:
    per_lemma:
      - lemma: "إِحْسَاس"
        examples:
          - text: "كان لديه إحساس عميق بالمسؤولية تجاه وطنه."
            type: usage
      - lemma: "شُعُور"
        examples:
          - text: "داهمه شعور بالفرح لم يختبره من قبل."
            type: usage
      - lemma: "عَاطِفَة"
        examples:
          - text: "تغلبت عاطفة الشفقة على غضبه."
            type: usage
      - lemma: "وِجْدَان"
        examples:
          - text: "هزت هذه المأساة وجدان المجتمع بأسره."
            type: usage
      - lemma: "مَشَاعِر"
        examples:
          - text: "أفصح عن مشاعره الصادقة تجاه صديقه."
            type: usage

