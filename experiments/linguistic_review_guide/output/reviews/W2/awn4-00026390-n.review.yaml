stage1_review:
  assessment:
    concerns:
      - اللمات الحالية تغطي الجوانب الأساسية ولكن ينقصها مصطلح "الوجدان" الذي يعبر عن الجانب العاطفي الصرف في علم النفس العربي.
      - "إحساس" قد يميل أحياناً للجانب الحسي الجسدي، بينما "شعور" و"عاطفة" يميلان للجانب النفسي.
    observations: "المجموعة تصف الحالة الوجدانية (affective state). المصطلحات الموجودة مترادفة في السياق العام مع فروق دقيقة في التركيز (حسي vs نفسي vs وجداني)."
  blind_candidates:
    - lemma: "شُعُور"
      generation_method: ishtiqaq
      justification: "المصدر الصريح للفعل 'شعر' وهو الأكثر شيوعاً للتعبير عن تجربة العواطف."
    - lemma: "إِحْسَاس"
      generation_method: ishtiqaq
      justification: "يدل على إدراك النفس لحالاتها الداخلية أو المؤثرات الخارجية."
    - lemma: "وِجْدَان"
      generation_method: ishtiqaq
      justification: "مصطلح فلسفي ونفسي يعبر عن الجانب العاطفي من النفس في مقابل الجانب الإدراكي."
    - lemma: "عَاطِفَة"
      generation_method: ishtiqaq
      justification: "تعبر عن الميل النفسي القوي والانفعالات الموجهة."

stage2_evidence:
  per_lemma:
    - lemma: "إحساس"
      confirm:
        - text: "«الإحساس: إدراك الشيء بإحدى الحواس، فإن كان الإحساس للحس الظاهر فهو المشاهدات، وإن كان للحس الباطن فهو الوجدانيات.»"
          source: "التعريفات للجرجاني"
        - text: "«ظاهرةٌ فسيولوجية سيكولوجيةٌ، مُتَرتِّبةٌ على إثارةِ إحدى الحواس، ويصاحبها الوجدان أحيانًا كالإحساس بالألم.»"
          source: "المعجم الكبير"
    - lemma: "شعور"
      confirm:
        - text: "«الشعور: إدراك الشيء من غير ثبات... وهو أوّل مراتب وصول النفس إلى المعنى.»"
          source: "كشاف اصطلاحات الفنون"
        - text: "«يطلق على العلم بما في النفس أو بما في البيئة وعلى ما يشتمل عليه العقل من إدراكات ووجدانيات ونزعات.»"
          source: "المعجم الوسيط"
    - lemma: "عاطفة"
      confirm:
        - text: "«استعداد نفسي ينزع بصاحبه إلى الشعور بانفعالات معينة والقيام بسلوك خاص حيال فكرة أو شيء.»"
          source: "المعجم الوسيط"
        - text: "«ظاهرة وُجدانية كاللذة والألم والفرح والخوف والحب والانفعال.»"
          source: "مسرد علم اللسانيات (ArabTerm)"
    - lemma: "وِجْدَان"
      confirm:
        - text: "«الوجدان: إحساس الباطن بما هو فيه.»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«يطلق... على ضرب من الحالات النفسية من حيث تأثرها باللذة أو الألم في مقابل حالات أخرى تمتاز بالإدراك والمعرفة.»"
          source: "المعجم الوسيط"
    - lemma: "مَشَاعِر"
      confirm:
        - text: "«أوردت المعاجم الحديثة... 'المشعر' بمعنى الحاسّة وجمعه 'المشاعر'، وقد حدث تطور دلالي لهذه الكلمة فأصبحت تعني العواطف والأحاسيس.»"
          source: "معجم الصواب اللغوي"

