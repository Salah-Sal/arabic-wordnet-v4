stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل."
      - "غياب اللفظ المفرد الجامع (جمهور) الذي يُستخدم غالباً للتعبير عن هذا المفهوم."
    observations: "المجموعة تعبّر عن مفهوم 'القاعدة الجماهيرية' أو 'الفاندم' (Fandom)، وهو مفهوم حديث نسبياً في صياغته المصطلحية لكنه متجذر في مفاهيم الجمهور والأتباع والمحبين."
  blind_candidates:
    - lemma: "جُمْهُور"
      generation_method: majaz
      justification: "اللفظ العربي الأشهر للتعبير عن مجموع المتابعين أو المشاهدين أو المعجبين."
    - lemma: "قَاعِدَة جَمَاهِيرِيَّة"
      generation_method: tarkib
      justification: "مصطلح معاصر شاع في الصحافة والإعلام للتعبير عن حجم المتابعة والولاء لجهة ما."
    - lemma: "مُتَابِعُون"
      generation_method: ishtiqaq
      justification: "جمع (متابع)، ويُستخدم كاسم فاعل للتعبير عن الكتلة البشرية المخلصة لشيء ما، خاصة في السياق الرقمي."
    - lemma: "مُرِيدُون"
      generation_method: majaz
      justification: "يُستخدم في السياق التقليدي (الصوفي أو الحزبي) للتعبير عن المخلصين لزعيم أو فكرة، ويمكن سحبه على المعجبين المتحمسين."

stage2_evidence:
  per_lemma:
    - lemma: "جُمْهُور"
      confirm:
        - text: "«الجُمْهُور من النَّاس: جُلُّهم»"
          source: "المعجم الوسيط"
        - text: "«يشير إلى مشاهدين وقراء يمثلون قاعدة عامّة العامة، يتوجه إليهم العمل الأدبي.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "قَاعِدَة جَمَاهِيرِيَّة"
      confirm:
        - text: "«قواعد البيت: أساسه» (باعتبار الجمهور أساساً لشهرة الشخصية أو نجاحها)"
          source: "مقاييس اللغة (قياساً)"
    - lemma: "مُتَابِعُون"
      confirm:
        - text: "«مجموع المتابعين: gross audience»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "جمهور المعجبين"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "جمهور المعجبين"
      decision: confirmed
      decision_reason: "تعبير مركب دقيق وواضح الدلالة على المفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُمْهُور المُعْجَبِين"
    - lemma: "قاعدة جماهيرية"
      decision: confirmed
      decision_reason: "مصطلح ثابت ومعاصر يعبر عن القاعدة العريضة من المحبين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَاعِدَة جَمَاهِيرِيَّة"
    - lemma: "جُمْهُور"
      source: stage1
      decision: confirmed
      decision_reason: "الكلمة الأساسية والأكثر شيوعاً للتعبير عن جمهور الفن أو الرياضة أو الأدب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "جُمْهُور"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-91000501-n"
    - lemma: "مُتَابِعُون"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ شائع جداً في العصر الحديث للتعبير عن جمهور المنصات والشخصيات العامة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُتَابِعُون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-91000501-n"

stage4_content:
  definition:
    current: "جميع المعجبين أو المخلصين لشيء ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي بسيط جداً؛ يحتاج إلى تفصيل يشمل تنوع مجالات الإعجاب (فن، رياضة، فكر)."
    authored:
      - type: terminological
        text: "المجموعة الكلية من المخلصين أو المعجبين بشخصية مشهورة أو فريق رياضي أو عمل فني أو فكرة معينة، والذين يشكلون وحدة اجتماعية مترابطة باهتمامها المشترك."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "جُمْهُور"
        examples:
          - text: "احتشد جُمْهُور الفريق في الملعب لمؤازرته في المباراة النهائية."
            type: usage
      - lemma: "قَاعِدَة جَمَاهِيرِيَّة"
        examples:
          - text: "يتمتع هذا الكاتب بقَاعِدَة جَمَاهِيرِيَّة واسعة في أوساط الشباب."
            type: usage
      - lemma: "جُمْهُور المُعْجَبِين"
        examples:
          - text: "أثار قرار الفنان اعتزال الفن حزن جُمْهُور المُعْجَبِين به."
            type: usage
      - lemma: "مُتَابِعُون"
        examples:
          - text: "تجاوز عدد مُتَابِعِيه على منصات التواصل الاجتماعي عدة ملايين."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-91000501-n"
          definition_index: 0
          text: "المجموعة الكلية من المخلصين أو المعجبين بشخصية مشهورة أو فريق رياضي أو عمل فني أو فكرة معينة."
      - command: add_synset_example
        params:
          synset_id: "awn4-91000501-n"
          text: "يسعى المشاهير دائماً للحفاظ على تواصل مستمر مع قاعدتهم الجماهيرية."

stage5_enrichment:
  per_entry:
    - lemma: "جُمْهُور"
      entry_id: "{auto}"
      root: "جمهر"
      maqayis_quote: "«لم يرد في مقاييس اللغة كونه رباعياً، ولكن في المعاجم المتأخرة: الجُمْهُور من النَّاس جُلُّهم.»"
    - lemma: "قَاعِدَة جَمَاهِيرِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "قاعدة"
          root: "قعد"
          maqayis_quote: "«الْقَافُ وَالْعَيْنُ وَالدَّالُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ... وَقَوَاعِدُ الْبَيْتِ: أَسَاسُهُ.»"
        - word: "جماهيرية"
          root: "جمهر"
          maqayis_quote: "«(رباعي) يدل على الجمع والكثرة.»"
    - lemma: "مُتَابِعُون"
      entry_id: "{auto}"
      root: "تبع"
      maqayis_quote: "«التَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ لَا يَشِذُّ عَنْهُ مِنَ الْبَابِ شَيْءٌ، وَهُوَ التُّلُوُّ وَالْقَفْوُ.»"
  per_sense:
    - lemma: "جُمْهُور"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشامل لمجموع الحاضرين أو المعجبين."
      mwe: false
    - lemma: "قَاعِدَة جَمَاهِيرِيَّة"
      sense_id: "{auto}"
      nuance: "تركز على الاستقرار والاتساع والأساس الداعم للنجاح."
      mwe: true
    - lemma: "جُمْهُور المُعْجَبِين"
      sense_id: "{auto}"
      nuance: "تعبير صريح يحدد طبيعة العلاقة (الإعجاب)."
      mwe: true
    - lemma: "مُتَابِعُون"
      sense_id: "{auto}"
      nuance: "تعبير حديث يركز على رصد النشاط (متابعة)، وشائع في الفضاء الرقمي."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جمهر","maqayis":"الجُمْهُور من النَّاس جُلُّهم"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"قاعدة","root":"قعد","maqayis":"قواعد البيت أساسه"},{"word":"جماهيرية","root":"جمهر","maqayis":"يدل على الجمع والكثرة"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ العام والشامل لمجموع الحاضرين أو المعجبين","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-91000501-n"
        key: note
