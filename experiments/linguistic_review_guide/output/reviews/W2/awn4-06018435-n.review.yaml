# ── المرحلة ١: المراجعة والتوليد ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «نقطة الأصل» مبتورة التشكيل ولا تحمل ضبطاً كاملاً"
      - "المجموعة تقتصر على لمّة مركّبة واحدة، في حين أن «الأصل» مفرداً هو المصطلح الأكثر تداولاً في الأدبيات الرياضية العربية المتخصصة"
    observations: "المصطلح يتعلق بمفهوم هندسي رياضي بحت هو نقطة الأصل في نظام الإحداثيات
      الديكارتي. اللمّة «نقطة الأصل» تركيبٌ إضافي فصيح شائع في المناهج التربوية، غير أن «الأصل»
      وحده يُستعمل كثيراً في الأدبيات الرياضية المتخصصة بوصفه المصطلح المختصر المعتمد في
      المعجمية الرياضية العربية (ALECSO). التعريف الحالي صحيح في محتواه غير أن الفاصلة المنقوطة
      تُضعف تماسكه، ويحتاج إلى مراجعة أسلوبية مع إضافة تعريف موسوعي يستوعب البُعد التطبيقي
      للمفهوم في أبعاد المستوى والفضاء."
  blind_candidates:
    - lemma: "الأَصْلُ"
      generation_method: majaz
      justification: "إزاحة دلالية من «الأصل» بمعنى الأساس والجذر نحو نقطة البداية في الفضاء
        الإحداثي؛ المقابل الإنجليزي «origin» يحمل المعنى نفسه (الأصل، المنشأ)، فجاءت اللفظة
        العربية ترجمةً مجازية طبيعية مرشَّحة للاستقرار في المعجمية الرياضية"
    - lemma: "المَبْدَأُ"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ب-د-أ) على وزن مَفعَل الدال على الموضع، يعني موضع الابتداء؛
        يُحتمَل استخدامه للدلالة على النقطة التي ينطلق منها الفضاء الإحداثي بوصفها موضع البداية"
    - lemma: "المَنْشَأُ"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ن-ش-أ) على وزن مَفعَل، يدل على موضع النشأة والارتفاع؛
        يُحتمَل استخدامه قياساً على «منشأ الأنواع» و«منشأ البضاعة» للدلالة على نقطة انطلاق
        الإحداثيات"
    - lemma: "نُقْطَةُ الصِّفْرِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف النقطة بصفر الإحداثيات؛ مبنيٌّ على الخاصيّة المميِّزة
        للنقطة وهي كون جميع إحداثياتها صفراً، مما يجعله وصفاً مُسكوكاً محتملاً"


