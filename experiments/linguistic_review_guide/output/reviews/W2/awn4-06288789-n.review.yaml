    current: "الجزء المسموع من إشارة مرسلة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح إجمالًا لكنه مؤلَّف بأسلوب ترجمي مباشر من الإنجليزية («the audible part»). لفظة «مسموع» في اللغة العربية صفة مفعولية (audible) وليست الجنس المألوف في تعريفات المعجم الوسيط؛ والأوضح صرفًا أن يُقال «الجزء الصوتي» أو «المكوّن الصوتي». يفتقر التعريف أيضًا إلى الفصل النوعي الذي يُميِّز هذا المفهوم عن الصوت المطلق، إذ لا يذكر المقابل (الصورة/النص). بناءً على تعريف arabterm «إشارة تُسمع في مقابل المحرف والصورة» يمكن تحسين التعريف.
