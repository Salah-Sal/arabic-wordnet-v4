# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (إشارة صوتية / صوت) بلا تشكيل"
      - "تفاوت في مستوى التخصص: 'صوت' عام جداً مقابل 'إشارة صوتية' مصطلح تقني محدد؛ هذا التجاور قد يُشكّل اشتراكاً لفظياً مع مجموعات أخرى تضم 'صوت' بمعناه الأوسع"
      - "التعريف الحالي 'الجزء المسموع من إشارة مرسلة' مؤلَّف بأسلوب ترجمي مباشر من الإنجليزية، ولا يستوفي أسلوب المعجم الوسيط"
      - "لم يُضَف أي مثال استعمالي للمجموعة أو للمعاني المفردة"
    observations: >
      تنتمي هذه المجموعة إلى الحقل الدلالي لتقانة الاتصالات والبث الرقمي؛ وتُعبِّر عن مفهوم «الصوت» بوصفه مكوِّنًا قابلًا للمعالجة في إشارة مرسلة، في مقابل المكوّن المرئي أو النصي. اللفظ الإنجليزي «audio» ذو استخدامين: اسمي (الجانب السمعي) وصفي (متعلق بالصوت). ترجمته العربية الأكثر شيوعاً «الصوت» صحيحة في السياق الإعلامي، غير أن «إشارة صوتية» هي المصطلح التقني الدقيق في هندسة الاتصالات. ينبغي الإبقاء على كليهما مع تمييز الفارق الدلالي بينهما.

  blind_candidates:
    - lemma: "صَوْتِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي (فَعْلِيَّة) من جذر صوت، قياسي في الإشارة إلى الجانب أو المكوّن الصوتي كمفهوم مجرد. يُشابه توظيف «مرئية» في مقابل «صوتية» في سياقات الإعلام الرقمي.
    - lemma: "مَسْمُوع"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من جذر سمع (على وزن مفعول)، يُحوَّل إلى اسم للدلالة على «ما يُسمَع» من إشارة مرسلة؛ توظيف اسم المفعول بوصفه اسمًا يوافق الوزن الصرفي للوظيفة الدلالية.
    - lemma: "صَوْتُ الإِرْسَال"
      generation_method: tarkib
      justification: >
        مركب إضافي من «صوت» + «الإرسال»، يُحدِّد صراحةً أن المقصود هو الجانب الصوتي في عملية الإرسال لا الصوت الطبيعي المطلق؛ يعكس التمييز التقني بين audio وsound.
    - lemma: "نَبَرَة"
      generation_method: majaz
      justification: >
        إحياء للفظ «نبرة» من جذر نبر الذي يدل على ارتفاع الصوت وصدوره؛ يمكن توسيعه دلالياً بالمجاز ليشمل المحتوى الصوتي المُبَثَّ، مستلهَمًا من أصل المعنى: الصوت المُخرَج والمُرسَل.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────

stage2_evidence:
  per_lemma:

    - lemma: "إِشَارَة صَوْتِيَّة"
      confirm:
        - text: "«إشارة تُسمع في مقابل المحرف والصورة»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011) — translation_en: audio signal"
        - text: "«إشارة إذاعيَّة»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — translation_en: audio signal"

    - lemma: "صَوْت"
      confirm:
        - text: "«الصَّادُ وَالْوَاوُ وَالتَّاءُ أَصْلٌ صَحِيحٌ، وَهُوَ الصَّوْتُ، وَهُوَ جِنْسٌ لِكُلِّ مَا وَقَرَ فِي أُذُنِ السَّامِعِ»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ)"
        - text: "«الصوْتُ معروف»"
          source: "تاج اللغة وصحاح العربية للجوهري (ت. 393هـ)"
        - text: "«الصَّوتُ: الجَرْسُ، معروف، مذكر»"
          source: "لسان العرب لابن منظور (ت. 711هـ)"
      expands:
        - text: "«(1) سَمْعيّ؛ صوتيّ  (2) صوت»"
          source: "المورد الحديث (2008) — translation_en: audio"
          addition: "يؤكد صحة استخدام 'صوت' كترجمة اسمية للمصطلح الإنجليزي audio في السياقات التقنية والإعلامية"
        - text: "«صوت — translation_en: sound»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "يُثبت توظيف 'صوت' مصطلحاً موحَّداً في المعجمية العلمية العربية"

    - lemma: "صَوْتِيَّة"
      contradicts:
        - text: "«أصغر وحدة غير ذات معنى يمكن الحصول عليها عبر تقطيع السلسلة الكلامية. وتقدم كل لغة، حسب سننها، عددًا محدودًا ومقيدًا من الصوتيات — translation_en: Phonem»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "'صوتية' محجوزة في الاستخدام المعجمي العربي للدلالة على 'الفونيم' (phoneme) في علم اللغويات؛ توظيفها هنا سيُفضي إلى اشتراك لفظي خطير مع مصطلح لساني راسخ"

    - lemma: "مَسْمُوع"
      expands:
        - text: "«مَسْموع — translation_en: audible»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "ورد 'مسموع' صفةً بمعنى 'قابل للسمع/audible' في السياق الطبي، لا اسمًا للجزء الصوتي من إشارة مرسلة؛ يدل على صفة الإدراك السمعي لا على الكيان التقني ذاته"

    - lemma: "صَوْتُ الإِرْسَال"
      evidence_status: "no_material_found"

    - lemma: "نَبَرَة"
      contradicts:
        - text: "«كلُّ مرتفع من شىء — الوَرَمُ — وسط النُّقْرَة في ظاهر الشَّفَة — الهمزة — رفع الصَّوت حين النطق بالكلمة، وقد يكون بالاعتماد على حرف من حروفها، وباختلاف موضع النَّبر من الكلمة يتميَّز اللهجات»"
          source: "المعجم الوسيط (OCR)"
          conflict: "'النبرة' في المعجم الوسيط ترادف 'النبر' بمعنى الشدة الصوتية في التنغيم وارتفاع الصوت حال النطق بالكلمة؛ هي مصطلح لساني صوتي لا يُعبِّر عن الجانب الصوتي المُرسَل"
        - text: "«نَبْرَةُ: والنبرة عند العرب: ارتفاع الصوت»"
          source: "معجم البلدان لياقوت الحموي (ت. 626هـ)"
          conflict: "يُثبّت المعنى الأصلي: ارتفاع الصوت لا إشارة صوتية مرسلة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────

stage3_analysis:
  per_lemma:

    - lemma: "إشارة صوتية"
      decision: confirmed
      decision_reason: >
        مصطلح تقني مُثبَت في معجمية الاتصالات وتقانة المعلومات العربية، موثَّق في المعجم الموحد لمصطلحات تقانة المعلومات (2011) بتعريف دقيق يُطابق تعريف المجموعة. المركب وصفي ثابت وليس عبارة وصفية حرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُستخدم في السياقات الهندسية والتقنية للإشارة إلى الإشارة الصوتية بوصفها كيانًا قابلًا للقياس والمعالجة والترميز؛ يؤكد الطابع الإلكتروني/الرقمي للمحتوى الصوتي في منظومات البث والاتصالات، وهو أكثر تخصصاً وتقنيةً من «صوت».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَة صَوْتِيَّة"

    - lemma: "صوت"
      decision: confirmed
      decision_reason: >
        اللفظ العربي الأصيل الجامع لمعنى الصوت، موثَّق في أمهات المعاجم الكلاسيكية والمعاصرة. يُستخدم على نطاق واسع في الإعلام والإنتاج الرقمي للإشارة إلى الجانب السمعي من بث أو تسجيل في مقابل الصورة؛ وهو التوظيف الأقرب للمعنى العام لـ «audio» في الاستخدام المتداول.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللفظ الأعم والأيسر تداولًا؛ يُستخدم في الإعلام والحوسبة والإنتاج الفني للإشارة إلى المكوّن السمعي عمومًا في مقابل الصورة («الصوت والصورة»)، دون أن يحمل بالضرورة الطابع الهندسي لـ«إشارة صوتية».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَوْت"

    - lemma: "صَوْتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح محجوز في المعجمية اللسانية العربية للدلالة على «الفونيم» (phoneme)، كما أثبت المعجم الموحد لمصطلحات اللسانيات (2002). توظيفه هنا يُفضي إلى اشتراك لفظي خطير مع مصطلح لساني راسخ. فضلًا عن ذلك، لا تملك «صوتية» بمعنى «الجانب الصوتي من إشارة مرسلة» أي تثبيت معجمي.

    - lemma: "مَسْمُوع"
      source: stage1
      decision: removed
      decision_reason: >
        ورد في المعاجم صفةً (audible) لا اسمًا للجزء الصوتي من إشارة مرسلة. لا يوجد تثبيت معجمي لـ«مسموع» بوصفه مصطلحًا اسميًا مستقلًا في هذا المجال. استخدامه سيُلبَس بالصفة ويُوقع في التباس نحوي.

    - lemma: "صَوْتُ الإِرْسَال"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على أي توثيق معجمي لهذا المركب الإضافي. اختبار السك: يمكن إبدال «الإرسال» بـ«البث» أو «التوجيه» وتبقى العبارة صالحة وصفًا لا مصطلحًا محكمًا. غير مستوفٍ لشرط التثبيت المعجمي.

    - lemma: "نَبَرَة"
      source: stage1
      decision: removed
      decision_reason: >
        متعارض تمامًا مع المفهوم المقصود؛ «النبرة» في المعجمية العربية الكلاسيكية والمعاصرة تعني ارتفاع الصوت عند النطق والتنغيم والنبر اللساني (stress/accent)، لا الجزء الصوتي من إشارة مرسلة. المجاز المقترح مُتعسَّف ومغلوط.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────

stage4_content:
