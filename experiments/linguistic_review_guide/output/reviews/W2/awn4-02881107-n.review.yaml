stage1_review:
  assessment:
    concerns:
      - اللمة الحالية (عنق الزجاجة) هي تعبير مركب مستخدم بكثرة، لكن المجموعة تفتقر إلى مرادفات فصيحة أخرى تشير إلى نفس الجزء من أوعية السوائل.
    observations: "المفهوم يشير إلى الجزء الضيق من الزجاجة. التعبير 'عنق الزجاجة' هو تعبير اصطلاحي شائع (idafi construction). يمكن أيضاً استخدام 'عنق القارورة' نظراً لترادف الزجاجة والقارورة في سياق أوعية السوائل، وكذلك يمكن استخدام 'رقبة' كمرادف لـ'عنق' في بعض السياقات المعجمية."
  blind_candidates:
    - lemma: "عُنُقُ الزُّجَاجَةِ"
      generation_method: tarkib
      justification: "التعبير العربي القياسي والشيوعي لهذا الجزء من الزجاجة."
    - lemma: "عُنُقُ القَارُورَةِ"
      generation_method: tarkib
      justification: "استبدال 'الزجاجة' بـ'القارورة' وهي الوعاء الزجاجي التقليدي، وهو تعبير مستعمل في المعاجم التقنية."
    - lemma: "رَقَبَةُ القَارُورَةِ"
      generation_method: tarkib
      justification: "استخدام 'رقبة' كمرادف لـ'عنق'، وهو وصف معجمي لتركيب القارورة."
    - lemma: "حَلْقُ الزُّجَاجَةِ"
      generation_method: majaz
      justification: "استخدام 'الحلق' مجازاً للجزء الضيق الذي يسبق الفتحة."

stage2_evidence:
  per_lemma:
    - lemma: "عنق الزجاجة"
      confirm:
        - text: "«المُخْتَنَق؛ عُنُق الزجاجة: نقطة ازدحام في طريق»"
          source: "المورد الحديث (2008)"
        - text: "«مرحلة يتعطل فيها تدفق الانتاج... يعبر عنه في الأدبيات الاقتصادية بـ'عنق الزجاجة'»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
    - lemma: "عنق القارورة"
      confirm:
        - text: "«ينشأ الاختناق (عنق القارورة) عندما يقوم المعالج بإيجاد الحل الوسط...»"
          source: "معجم مصطلحات المعلوماتية (2000)"
    - lemma: "رقبة القارورة"
      expands:
        - text: "«قارورة: إناء زجاجي ذو رقبة ضيقة يستخدم لحفظ السوائل.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "يؤكد وجود 'رقبة ضيقة' كجزء تكويني للقارورة."
    - lemma: "عنق"
      confirm:
        - text: "«(العُنُق) الرقبة... ومن كل شيء أوله.»"
          source: "المعجم الوسيط"
        - text: "«عُنُقُ الرَّحِمِ [The neck of the womb;] the slender part of the رحم...»"
          source: "Lane's Lexicon"

stage3_analysis:
  per_lemma:
    - lemma: "عنق الزجاجة"
      decision: confirmed
      decision_reason: "هو المصطلح الأكثر شيوعاً واستقراراً في اللغة العربية المعاصرة للدلالة على هذا الجزء، ويدعمه الاستخدام في المعاجم الحديثة والتقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُنُقُ الزُّجَاجَةِ"
    - lemma: "عُنُقُ القَارُورَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق وفصيح، مستخدم في السياقات التقنية والمعجمية (مثل معجم المعلوماتية) كبديل لـ'عنق الزجاجة'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "عُنُقُ القَارُورَةِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "رَقَبَةُ القَارُورَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق مستمد من تعريفات القارورة في المعاجم الطبية والتقنية، حيث توصف بأنها إناء ذو رقبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "رَقَبَةُ القَارُورَةِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "الجزء الضيق من الزجاجة بالقرب من القمة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول ولكنه يحتاج إلى صياغة معجمية أكثر دقة تحدد الموضع بالنسبة للفوهة."
    authored:
      - type: terminological
        text: "القِسْمُ الضَّيِّقُ مِنَ الزُّجَاجَةِ أَوْ القَارُورَةِ يَلِي فُوَّهَتَهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "القِسْمُ الضَّيِّقُ مِنَ الزُّجَاجَةِ أَوْ القَارُورَةِ يَلِي فُوَّهَتَهَا."
  examples:
    per_lemma:
      - lemma: "عُنُقُ الزُّجَاجَةِ"
        examples:
          - text: "تَحَطَّمَ عُنُقُ الزُّجَاجَةِ عِنْدَمَا حَاوَلَ فَتْحَهَا بِقُوَّةٍ."
            type: usage
      - lemma: "عُنُقُ القَارُورَةِ"
        examples:
          - text: "يُسَاعِدُ ضِيقُ عُنُقِ القَارُورَةِ عَلَى التَّحَكُّمِ فِي كَمِّيَّةِ السَّائِلِ المَسْكُوبِ."
            type: usage
      - lemma: "رَقَبَةُ القَارُورَةِ"
        examples:
          - text: "كَانَتْ رَقَبَةُ القَارُورَةِ طَوِيلَةً وَمُزَخْرَفَةً."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَحَطَّمَ عُنُقُ الزُّجَاجَةِ عِنْدَمَا حَاوَلَ فَتْحَهَا بِقُوَّةٍ."

stage5_enrichment:
  per_entry:
    - lemma: "عُنُقُ الزُّجَاجَةِ"
      entry_id: "{auto}"
      roots:
        - word: "عنق"
          root: "عنق"
          maqayis_quote: "«الْعَيْنُ وَالنُّونُ وَالْقَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى امْتِدَادٍ فِي شَيْءٍ، إِمَّا فِي ارْتِفَاعٍ وَإِمَّا فِي انْسِيَاحٍ.»"
        - word: "زجاجة"
          root: "زجج"
          maqayis_quote: "«الزَّاءُ وَالْجِيمُ أَصلٌ يَدُلُّ عَلَى رِقَّةٍ فِي شَيْءٍ، مِنْ ذَلِكَ زُجُّ الرُّمْحِ وَالسَّهْمِ.»"
    - lemma: "عُنُقُ القَارُورَةِ"
      entry_id: "{auto}"
      roots:
        - word: "عنق"
          root: "عنق"
          maqayis_quote: "«الْعَيْنُ وَالنُّونُ وَالْقَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى امْتِدَادٍ فِي شَيْءٍ...»"
        - word: "قارورة"
          root: "قرر"
          maqayis_quote: "«الْقَافُ وَالرَّاءُ أَصلانِ صَحِيحَانِ، يَدُلُّ أَحَدَهُمَا عَلَى بَرْدٍ، وَالْآخَرُ عَلَى تَمَكُّنٍ... سُمِّيَتِ الْقَارُورَةُ لِاسْتِقْرَارِ الْمَاءِ فِيهَا.»"
    - lemma: "رَقَبَةُ القَارُورَةِ"
      entry_id: "{auto}"
      roots:
        - word: "رقبة"
          root: "رقب"
          maqayis_quote: "«الرَّاءُ وَالْقَافُ وَالْبَاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى انْتِصَابٍ لِمُرَاعَاةِ شَيْءٍ... اشْتِقَاقُ الرَّقَبَةِ، لِأَنَّهَا مُنْتَصِبَةٌ.»"
        - word: "قارورة"
          root: "قرر"
          maqayis_quote: "«الْقَافُ وَالرَّاءُ أَصلانِ صَحِيحَانِ... سُمِّيَتِ الْقَارُورَةُ لِاسْتِقْرَارِ الْمَاءِ فِيهَا.»"
  per_sense:
