# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06377253-n (prescription)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «روشتة» عامية مصرية من الإيطالية ricetta، لا تُعرف في بقية الأقطار العربية ولا تَرِد في المعاجم الفصيحة"
      - "اللمّة «وصفة طبية» مركب إضافي-وصفي ثابت لكنه يحتاج تشكيلاً كاملاً"
      - "لا توجد لمّة مفردة فصيحة مثل «وَصْفَة» بمفردها رغم شيوعها في المعاجم المصطلحية"
    observations: "المفهوم يدور حول تعليمات مكتوبة يصدرها الطبيب للصيدلي لصرف دواء بمقادير محددة. العربية تملك مصطلحاً مسكوكاً ثابتاً هو «وَصْفَة طِبِّيَّة» مسجّلاً في معاجم مصطلحية رسمية عديدة. أما «روشتة» فهي دخيلة عامية لا ترقى للتسجيل في شبكة دلالية فصيحة. المفهوم قريب من «نُسْخَة» في الاستعمال الطبي القديم لكن هذا الاستعمال اندثر."
  blind_candidates:
    - lemma: "وَصْفَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (و ص ف) على وزن فَعْلَة بمعنى المرة من الوصف، ثم خُصّصت في الاستعمال الطبي للدلالة على ورقة التعليمات الدوائية. مسجّلة في المعجم الموحد لمصطلحات الصيدلة والطب البيطري بمعنى prescription."
    - lemma: "وَصْفَة طِبِّيَّة"
      generation_method: tarkib
      justification: "مركب إضافي-وصفي ثابت يُقيّد «وصفة» بنسبتها إلى الطب، فيُزيل الاشتراك مع وصفة الطهي. مسجّل في المعجم الموحد لمصطلحات الصيدلة بمقابل medical prescription."
    - lemma: "تَذْكِرَة دَوَائِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي-وصفي من «تذكرة» (ما يُستذكر به الحاجة) + «دوائية» نسبةً إلى الدواء. يُحاكي النمط التسموي في المعاجم القديمة حيث كانت التذكرة تُستخدم لكل ورقة مدوّنة بها تعليمات."
    - lemma: "رُوشِتَّة"
      generation_method: taarib
      justification: "تعريب للإيطالية ricetta عبر التركية reçete. شائعة في الاستعمال المصري الدارج، ذكرها المورد الحديث بصيغة «رُشتّة» مقرونةً بـ«وصفة طبية»."

stage2_evidence:
  per_lemma:
    - lemma: "رُوشِتَّة"
      expands:
        - text: "«(4) «أ» وصفة طبيّة؛ «رُشتّة». «ب» دواء موصوف [من قِبل الطبيب]»"
          source: "المورد الحديث (2008)"
          addition: "المورد يذكر «رُشتّة» كمرادف عامي لـ«وصفة طبية» في سياق ترجمة prescription، مما يؤكد أنها دخيلة عامية لا مصطلح فصيح مستقل"

    - lemma: "وَصْفَة طِبِّيَّة"
      confirm:
        - text: "«وَصْفَة طِبِّيَّة — medical prescription»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«وصفة طبية — تركيبة دوائية تحدد مقادير العقاقير المختلفة المستخدمة في علاج حالة مرضية.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«(4) «أ» وصفة طبيّة؛ «رُشتّة». «ب» دواء موصوف [من قِبل الطبيب]»"
          source: "المورد الحديث (2008)"
        - text: "«(1) «أ», الوَصْفة: «ب» وصفة طبّيّة. «ج» صيغة طَهْوِية [تصف كيفية إعداد لون من ألوان الطعام]»"
          source: "المورد الحديث (2008) — مدخل recipe"
      expands:
        - text: "«أَدْوِيَّة دُونَ وَصْفَة — over-the-counter (OTC) product»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يؤكد أن «وصفة» مصطلح محوري في الحقل الصيدلي العربي، تُبنى عليه تراكيب متعددة"

    - lemma: "وَصْفَة"
      confirm:
        - text: "«وَصْفة — توجيه مُحرّر لكيفية تحضير وإعطاء العلاج. — prescription»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«وصفة — prescription»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«وَصْفة — لائحة تحتوي على مكونات دواء مركب وطريقة تحضيره واستعماله. — recipe»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "المعنى هنا أقرب إلى «تركيبة» لا «وصفة طبيب» — فالوصفة بدون تقييد «طبية» قد تعني تركيبة أو صيغة طهوية"
        - text: "«وَصْفَة — من (و ص ف) المرة من الوصف بمعنى نعت الشيء بما فيه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المعنى اللغوي الأصلي: المرة من الوصف، ثم تخصّص في الاستعمال الحديث"

    - lemma: "تَذْكِرَة دَوَائِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَذْكِرَة"
      contradicts:
        - text: "«(التَّذْكِرَة) مَا تستذكر بِهِ الْحَاجة وَمَا يَدْعُو إِلَى الذّكر وَالْعبْرَة وبطاقة يثبت فِيهَا أجر الرّكُوب فِي السكَك الحديدية وَمَا جرى مجْراهَا (ج) تَذَاكر (محدثة)»"
          source: "المعجم الوسيط"
          conflict: "التذكرة في الاستعمال الحديث تخصّصت في معنى بطاقة السفر (ticket)، ولا تُستعمل بمعنى الوصفة الطبية"

stage3_analysis:
  per_lemma:
    - lemma: "رُوشِتَّة"
      decision: removed
      decision_reason: "لفظة دخيلة عامية مصرية من الإيطالية ricetta عبر التركية reçete. لم تُسجَّل في أي معجم عربي فصيح كمدخل مستقل. المورد الحديث يذكرها بين علامتَي تنصيص كمرادف عامي فقط. لا تقبل الاشتقاق ولا تنتمي لنظام صرفي عربي. وجود البديل الفصيح «وصفة طبية» يُغني عنها تماماً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وَصْفَة طِبِّيَّة"
      decision: confirmed
      decision_reason: "مركب إضافي-وصفي ثابت مسجّل في عدة معاجم مصطلحية رسمية (الصيدلة، الطب، المورد الحديث). يُزيل اللبس مع «وصفة الطهي» بتقييده بالنسبة «طبية». هو الشكل الأدق والأوضح للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الشكل المقيَّد الرسمي الذي لا لَبْس فيه؛ يُستعمل في السياقات الرسمية والقانونية والصيدلانية حصراً للدلالة على تعليمات الطبيب للصيدلي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَصْفَة طِبِّيَّة"

    - lemma: "وَصْفَة"
      source: stage1
      decision: confirmed
      decision_reason: "مسجّلة في المعجم الموحد للطب البيطري والمكنز الزراعي بمعنى prescription مباشرة. شائعة في الاستعمال الطبي المعاصر بدون تقييد «طبية» حين يكون السياق واضحاً. أقصر وأيسر تداولاً من المركب."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الشكل المفرد المختصر؛ يصلح في السياق الطبي الواضح لكنه مشترك مع وصفة الطهي خارج هذا السياق"
      actions:
        - command: create_entry
          params:
            lemma: "وَصْفَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَذْكِرَة دَوَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركب غير مسكوك ولم يُسجَّل في أي معجم مصطلحي. لفظة «تذكرة» تخصّصت حديثاً في معنى بطاقة السفر/الدخول، واستعمالها بمعنى الوصفة الطبية سيُحدث لبساً."

    - lemma: "رُوشِتَّة"
      source: stage1
      decision: removed
      decision_reason: "مكرّرة مع اللمّة الموجودة «روشتة» التي قُرّر حذفها. دخيلة عامية لا تصلح للشبكة الدلالية الفصيحة."

