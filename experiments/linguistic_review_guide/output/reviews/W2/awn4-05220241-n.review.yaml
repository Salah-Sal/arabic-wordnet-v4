# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة الاستجابة أو التفاعل بسرعة؛ بالنسبة للأشخاص، تتضمن التجاوب العاطفي مع الناس والأحداث"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي يستخدم «الاستجابة» و«التجاوب» وهما لمّتان في المجموعة ذاتها،
        مما يُنشئ دوراناً دلالياً جزئياً. كما أن أسلوبه ترجمي من الإنجليزية ولا
        يتّسق مع أسلوب المعجم الوسيط. يحتاج إلى تعريف مُصطلحي بجنس قريب وفصل
        نوعي واضح، وآخر لغوي للسياق الإنساني.
    authored:
      - type: terminological
        text: >-
          خاصيَّةٌ في الشخص أو النظام تتجلَّى في سرعة التفاعل مع المثيرات والمواقف
          بما يُناسبها؛ وفي الناس تشمل الانفعالَ العاطفيَّ تجاه الآخرين والأحداث
          واستشعارَ مقتضياتها والبادرةَ إلى ما تستدعيه
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >-
          كونُ الشخص أو الشيء سريعَ الأثر في ردّ الفعل، منفتحاً على ما يُحيط به
          من مواقف ومشاعر، لا يتأخر في إدراك مقتضياتها والإفصاح عمّا تستوجبه
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >-
            خاصيَّةٌ في الشخص أو النظام تتجلَّى في سرعة التفاعل مع المثيرات والمواقف
            بما يُناسبها؛ وفي الناس تشمل الانفعالَ العاطفيَّ تجاه الآخرين والأحداث
            واستشعارَ مقتضياتها والبادرةَ إلى ما تستدعيه
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >-
            كونُ الشخص أو الشيء سريعَ الأثر في ردّ الفعل، منفتحاً على ما يُحيط به
            من مواقف ومشاعر، لا يتأخر في إدراك مقتضياتها والإفصاح عمّا تستوجبه

