      decision_reason: >-
        لم تُوجَد مستقلّةً — الشاهد الوحيد يُستخدمها مضافةً في تركيب مصطلحي
        (إستجابية صوتية). المستجيبية الموثَّقة في المورد الحديث أدقّ وأكمل.
      evidence_assessment:
