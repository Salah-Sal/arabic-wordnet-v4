              تُصدر ردّها في أقل من ثانية واحدة
            type: usage
      - lemma: "تَجَاوُب"
        examples:
          - text: >-
              أذهل الجمهورَ تجاوبُ الفنان مع مشاعر الحاضرين فور صعوده إلى المسرح،
