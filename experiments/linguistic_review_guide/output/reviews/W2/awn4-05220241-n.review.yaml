# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (استجابة، تجاوب) خاليتان من التشكيل الكامل"
      - >-
        «استجابة» مصدرٌ للفعل استجاب يدلّ على الحدث (act of responding) أكثر من
        الصفة المجردة (responsiveness)؛ وأكثر المعاجم التقنية تُترجمه بـ response لا
        responsiveness
      - >-
        «تجاوب» في المعجم الوسيط والمعجم الكبير مُقيَّد بوصفه فعلاً (تفاعَل) لا
        اسماً خالصاً، وإن قُبل استعماله مصدراً
      - >-
        يغيب من المجموعة مصطلح يُعبّر صراحةً عن «صفة الاستجابة» كمفهوم مجرد
        مستقلّ عن الحدث
    observations: >-
      المجموعة تُحدّد مفهوماً مجرداً مركّباً: (أ) القدرة على الردّ السريع على
      المثيرات، و(ب) الانفعال العاطفي مع الناس والأحداث. اللمّتان المُدرجتان
      تُقاربان المفهوم من زاويتَيْن مختلفتَيْن — «استجابة» تُحيل إلى مسار ردّ
      الفعل، و«تجاوب» يُركّز على التبادلية الاجتماعية — وكلتاهما صحيحة عربياً
      لكنّهما تفتقران إلى الصياغة الصرفية التي تُجرّد الصفة كمفهوم مستقل. اللغة
      العربية تملك أدوات صرفية منتجة لهذا الغرض، أبرزها المصدر الصناعي على
      (-يَّة) من الصفة أو المصدر.
  blind_candidates:
    - lemma: "التَّجَاوُبِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من الفعل (تجاوب) على وزن الاسم المجرّد المنتسب (-يَّة)، يُعبّر
        عن صفة التجاوب المتبادل كمفهوم مجرد، على غرار: التفاعلية، التشاركية،
        التكاملية
    - lemma: "الاِسْتِجَابِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من (استجابة) يُجرّد صفة القابلية للاستجابة عن حدثها، مستوحى من
        النمط الإنتاجي نفسه: الاستدامية، الاستيعابية، الاستيعابية
    - lemma: "الرَّهَافَة"
      generation_method: majaz
      justification: >-
        من جذر رهف بمعنى الدقة وحدّة الحسّ وسرعة التأثر؛ وظّف التراث العربي
        «الرهافة» للتعبير عن رقّة المشاعر وحدّة الحسّ، وهي مشابِهة وظيفياً
        للتجاوب العاطفي السريع — إحياء للفظ التراثي بدلاً من الاشتقاق الحديث
    - lemma: "التَّلَقِّيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من (تلقّى) يُعبّر عن القابلية للاستقبال والردّ، مستوحى من
        استعمال «التلقّي» بمعنى الاستجابة الوجدانية للحدث كما في «تلقّي الخبر»
        و«تلقّي الفكرة»


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "استجابة"
      confirm:
        - text: >-
            «الدرجة التي يتفاعل بها نظام مع مؤثرات (أوسع من القدرة على المواجهة
            والقدرة على التكيف وذلك لأن الردود لا تكون دائما "ناجحة")»
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO) — translation_en: responsiveness"
      expands:
        - text: >-
            «الاستجابة: في الأمل تخالف الإجابة، وإن كانت قد تجري مجراها، ذكره
            الراغب»
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
          addition: >-
            يُفرّق المناوي بين الاستجابة والإجابة، مما يُثبّت نضجاً دلالياً
            كلاسيكياً للمصطلح وتمييزه عن المرادف العام
        - text: >-
            «الاستجابة، في النظرية السلوكية، هي رد الفعل الكلامي أو غير الكلامي
            لمنبه كلامي أو غير كلامي»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: >-
            الاستخدام في اللسانيات السلوكية يُقرّب المصطلح من المعنى النفسي
            المطلوب في المجموعة
        - text: "«رد على مُثير لفظي أو غير لفظي»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "تعريف سلوكي مُكثَّف يُثبّت استخدام «استجابة» في سياق التفاعل مع المثيرات"

    - lemma: "تجاوب"
      confirm:
        - text: >-
            «تجاوب جهاز أو حاسوب أو موقع إلكتروني مع رغبات المستعمل بلمسات أو
            أيقونات أو عمليات في متناول إنسان عادي»
          source: "مسرد الإعلام والتواصل (ALECSO) — translation_en: userfriendliness"
        - text: "«(تجاوب) القوم جاوب بعضهم بعضا»"
          source: "المعجم الوسيط لمجمع اللغة العربية بالقاهرة (1998)"
      expands:
        - text: >-
            «القوم: تحاوروا — جاوب بعضهم بعضا — استُعير للطير والإبل والخيل،
            يقال: تجاوبت القمريّتان — لا يتجاوب أوّل كلامه وآخره — كلام فلان
            متناسب متجاوب»
          source: "المعجم الكبير لمجمع اللغة العربية"
          addition: >-
            يكشف عن غنى استخدام التجاوب في وصف التفاعل الحيّ بين الكائنات ووصف
            التناسق في الكلام
        - text: >-
            «الفصيح المأثور في استعمال «تفاعل» الدالة على المشاركة أن يُجاء معها
            بواو العطف... وقد أجاز مجمع اللغة المصري إسناد «تفاعل» الدالة على
            الاشتراك إلى معموليها باستعمال «مع»»
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت. 2003م)"
          addition: >-
            يُثبّت أن «تجاوب مع» أصبح مقبولاً لغوياً رسمياً، مما يُوسّع نطاق
            استخدامه في وصف الاستجابة التفاعلية المعاصرة

    - lemma: "التَّجَاوُبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الاِسْتِجَابِيَّة"
      expands:
        - text: "«إستجابية صوتية» — translation_en: acoustic responsiveness"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: >-
            يُثبّت أن صيغة «استجابية» مضافةً تُستعمل مصطلحاً تقنياً في الفيزياء
            بمعنى responsiveness، مما يُؤكد إنتاجية الصيغة لكن في تركيب لا في
            إطلاق

    - lemma: "الرَّهَافَة"
      contradicts:
        - text: >-
            «الرُّهافَةُ: بضم أوّله، وبعد الألف فاء، على فعالة: موضع»
          source: "معجم البلدان لياقوت الحموي (ت. 1229م)"
          conflict: >-
            المعجم الجغرافي يُثبّت أن «الرهافة» اسم موضع، مما يُنشئ تداخلاً
            دلالياً مع الاستخدام المجازي المقترح

    - lemma: "التَّلَقِّيَّة"
      evidence_status: "no_material_found"

    - lemma: "المُسْتَجِيبِيَّة"
      confirm:
        - text: "«المُسْتَجِيبيّة: كونُ الشيء مستجيبًا»"
          source: "المورد الحديث (2008) — translation_en: responsiveness"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
