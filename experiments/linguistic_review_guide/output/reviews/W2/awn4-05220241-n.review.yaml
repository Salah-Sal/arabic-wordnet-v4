    - lemma: "المُسْتَجِيبِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        وثّقها المورد الحديث (2008) بتعريف مباشر «كون الشيء مستجيباً» مع الترجمة
        الإنجليزية responsiveness — تطابق تام مع مفهوم المجموعة. الصيغة صحيحة
        قياساً: اسم ذات من الصفة «مستجيب» بإضافة (-يَّة) للتجريد. [ملاحظة: اكتُشفت
        في المرحلة ٢ عبر الجسر الإنجليزي، لا من المرحلة ١]
