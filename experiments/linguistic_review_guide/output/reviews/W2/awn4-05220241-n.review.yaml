    - lemma: "استجابة"
      decision: confirmed
      decision_reason: >-
        المصطلح راسخ في المعاجم التقنية والنفسية بمعنى ردّ الفعل على المثيرات.
        وثّق مسرد المناخ (ALECSO) استخدامه صراحةً بمعنى «responsiveness» — درجة
        التفاعل مع المؤثرات. جذره قويّ في التراث (ج-و-ب: مراجعة الكلام). يحتاج
        إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُركّز على مسار ردّ الفعل والاستجابة كحدث أو خاصية تقنية ومؤسسية؛
        يُستعمل في السياقات العلمية والنفسية والإدارية لوصف نمط التفاعل مع المثيرات
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِجَابَة"

    - lemma: "تجاوب"
      decision: confirmed
      decision_reason: >-
        موثَّق في المعجم الوسيط والمعجم الكبير وأجازه مجمع اللغة المصري. المصدر
        «تجاوب» (Form VI) يحمل معنى التبادلية الذي يُلامس الجانب الاجتماعي
        والعاطفي من المفهوم. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يحمل بُعداً تبادلياً متأصّلاً في بنيته الصرفية (تفاعَل = مشاركة بين
        طرفَيْن)؛ مناسب لوصف التجاوب الإنساني والعاطفي بين الأشخاص والأحداث
        أكثر من الاستجابة التقنية للأنظمة
      actions:
