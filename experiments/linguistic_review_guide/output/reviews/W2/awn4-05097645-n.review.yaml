# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم لفظ «الحجم» الذي هو أحد لمّات المجموعة ذاتها — مما يُوقع في دوران معجمي صريح"
      - "لمّتا «حجم» و«مقدار» مكتوبتان بدون تشكيل في المجموعة الحالية"
      - "لمّة «عِظَم» تحمل دلالةً انحيازية نحو طرف الكِبَر (خلاف الصغر) دون تغطية طرف الصِّغَر، مما لا يتطابق تماماً مع المفهوم الحيادي للمجموعة (سواء كان كبيراً أو صغيراً)"
      - "التعريف الحالي ترجمة حرفية من الإنجليزية وليس تأليفاً بأسلوب المعجم العربي"
    observations: "المجموعة تعبّر عن المفهوم الفلسفي-الرياضي 'magnitude' — أي الخاصية الكمّية النسبية التي تنتظم على مقياس من الكبر إلى الصغر. التراث العربي يمتلك لهذا المفهوم مصطلحاً دقيقاً ومتوغّلاً هو «المِقْدَار» (= الكمّية المتصلة عند الحكماء)، موثَّقاً في المعجمية الفلسفية والرياضية. أما «حجم» فيُشير أصالةً إلى الجرم المادي الحسوس لا إلى الخاصية المجردة. و«عِظَم» مصدر الفعل «عَظُم» صحيح الاشتقاق لكنه مُقيَّد بالطرف الكبير من المقياس."
  blind_candidates:
    - lemma: "مَقْدَار"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر ق-د-ر على وزن مِفْعَال الدال على الأداة والمعيار؛ يدل على ما يُعرف به مبلغ الشيء وكنهه، ويُغطي الخاصية النسبية في كلا الاتجاهين (كبير/صغير) دون انحياز لطرف دون آخر"
    - lemma: "ضَخَامَة"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر ض-خ-م على وزن فَعَالَة الدال على الخاصية؛ مرشح للتعبير عن البُعد الحجمي للمفهوم، إذ يُقال ضخم وضُخام للعظيم الجسم"
    - lemma: "اتِّسَاع"
      generation_method: ishtiqaq
      justification: "مصدر على وزن افْتِعَال من الجذر و-س-ع؛ يُعبِّر عن خاصية المدى والامتداد التي هي أحد وجهَي المفهوم في التعريف الإنجليزي (extent)"
    - lemma: "جَسَامَة"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر ج-س-م على وزن فَعَالَة؛ يُعبِّر عن خاصية الكبر الجسدي والضخامة، من قولهم جسيم وجُسام للعظيم الجسم"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفَّذة:
#  [Q1] مطابقة دفعية: headword_norm IN (حجم,الحجم,عظم,العظم,مقدار,المقدار,ضخامة,الضخامة,اتساع,الاتساع,جسامة,الجسامة)
#  [Q2] إثراء OCR/Hawramani للمدخلات الكلاسيكية
#  [Q3] جسر إنجليزي: translation_en:"magnitude" OR "size" OR "extent"
#  [Q4] مقاييس اللغة (dictionary_id=151): جذور حجم،عظم،قدر،ضخم،جسم
#  [Q5] بحث FTS: "خاصية" OR "حجم نسبي" OR "مقدار" OR "عظم"
stage2_evidence:
  per_lemma:
    - lemma: "حجم"
      confirm:
        - text: "«جرْم الشيء ومقدار جرمه»"
          source: "المعجم الوسيط"
        - text: "«الحجم يطلق على ما له مقدار ما سواء كان جسما أو لا، إذ الجسم لا يطلق إلّا على المتّصل في الجهات الثلاث، أي الطول والعرض والعمق»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«حَجْمُ الإنتاج: كَمِّيَّتُهُ أَوْ جُمْلَةُ الحاصلِ منه؛ حَجْمُ العَمَلِ: أبعادُهُ أَوْ مِقْدَارُهُ»"
          source: "المعجم الكبير"
        - text: "«حجم: size, dimension; مدًى؛ مقدار»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْحَاءُ وَالْجِيمُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ ضَرْبٌ مِنَ الْمَنْعِ وَالصَّدْفِ. يُقَالُ أَحْجَمْتُ عَنِ الشَّيْءِ، إِذَا نَكَصْتَ عَنْهُ... وَالْحَجْمُ: فِعْلُ الْحَاجِمِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يكشف هذا الأصل الاشتقاقي أن مادة «حجم» في مقاييس اللغة لا تدل أصلاً على الجرم والحجم، بل على المنع والإحجام؛ ومعنى الجرم والبُعد نشأ لاحقاً عبر المعنى الحسي (ملمس الشيء الناتئ تحت اليد)"
        - text: "«الحَجْمُ من الشيءِ: مَلْمَسُه الناتِئُ تَحْتَ يَدِكَ، ج: حُجومٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يُبيِّن المسار الدلالي التاريخي: من الإدراك اللمسي الحسي للنتوء → إلى مفهوم الجرم والحجم بالمعنى الحديث"

    - lemma: "عِظَم"
      confirm:
        - text: "«الْعَيْنُ وَالظَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى كِبَرٍ وَقُوَّةٍ. فَالْعِظَمُ: مَصْدَرُ الشَّيْءِ الْعَظِيمِ. تَقُولُ: عَظُمَ يَعْظُمُ عِظَمًا، وَعَظَّمْتُهُ أَنَا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«العِظَم في صفات الأجسام: كِبَرُ الطول والعرض والعمق»"
          source: "النهاية في غريب الحديث والأثر لابن الأثير الجزري"
        - text: "«العظم: [في الانكليزية] Greatness, dimension, measure [في الفرنسية] Grandeur, dimension, mesure»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«عَظُمَ الشيء عِظَماً: كَبُر، فهو عَظيمٌ»"
          source: "الصحاح للجوهري"
        - text: "«كِبَر؛ عِظَم» (أول ترجمة للمدخل magnitude)"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«العِظَمُ خلاف الصِغَرِ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "تعريف «عِظَم» بـ«خلاف الصغر» يُقيِّده بطرف الكِبَر من المقياس، في حين تنصّ المجموعة على أن الخاصية تشمل الكبير والصغير كليهما (whether large or small)"

    - lemma: "مقدار"
      confirm:
        - text: "«الْقَافُ وَالدَّالُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَبْلَغِ الشَّيْءِ وَكُنْهِهِ وَنِهَايَتِهِ. فَالْقَدْرُ: مَبْلَغُ كُلِّ شَيْءٍ. يُقَالُ: قَدْرُهُ كَذَا، أَيْ مَبْلَغُهُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«المقدار: لغة: الكمية. واصطلاحاً: الكمية المتصلة المتناولة للجسم والخط والسطح والثخن بالاشتراك»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الْمِقْدَار: فِي اللُّغَة مَا يعرف بِهِ قدر الشَّيْء كالذراع والكيل وَالْوَزْن والمقياس وَالْعدَد. وَعند الْحُكَمَاء الْكمّ الْمُتَّصِل القار الْأَجْزَاء كالخط والسطح والجسم التعليمي»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«المقدار: [في الانكليزية] Quantity, number, measure — هو لغة ما يعرف به قدر الشيء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«مقدار = magnitude» (مجال الرياضيات والفلك)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«مقدار = magnitude» (مجال الفيزياء العامة والنووية)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      expands:
        - text: "«مقدار الشيء: مثله في العدد أو الكيل أو الوزن أو المساحة»"
          source: "المعجم الوسيط"
          addition: "يُظهر أن «المِقْدَار» في العربية الحديثة يشمل أنواعاً متعددة من الكمّية القابلة للمقارنة (عدد/وزن/مساحة)، مما يجعله المصطلح الأنسب لمفهوم magnitude الحيادي"

    - lemma: "ضَخَامَة"
      contradicts:
        - text: "«ضَخامة = enlargement, hypertrophia, macrosis»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "«ضَخَامَة» محجوز في المصطلحية الطبية الحديثة للدلالة على الزيادة المرضية في الحجم، لا على الخاصية الحيادية للحجم النسبي"
        - text: "«الضَّادُ وَالْخَاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عِظَمٍ فِي الشَّيْءِ. يُقَالُ: هَذَا ضَخْمٌ وَضُخَامٌ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدل على الكِبَر (طرف واحد من المقياس)، لا على الخاصية ثنائية القطب (كبير/صغير) التي تنصّ عليها المجموعة"

    - lemma: "اتِّسَاع"
      contradicts:
        - text: "«الاتّساع: [في الانكليزية] Dilation [في الفرنسية] Dilatation, elargissement — هو عند الأطباء أن تتسع العصبة المجوّفة مع سعة الحدقة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "«اتِّسَاع» يدل على الامتداد المكاني والتوسع — وهو مفهوم أحادي الاتجاه (من ضيق إلى سعة) ولا يُغطي الخاصية الثنائية القطب الشاملة للكبر والصغر كليهما"

    - lemma: "جَسَامَة"
      evidence_status: "no_material_found"


