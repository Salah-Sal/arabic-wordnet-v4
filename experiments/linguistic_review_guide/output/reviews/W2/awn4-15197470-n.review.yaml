# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15197470-n
# a remote point in time / نقطة بعيدة في الزمن
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «بعد زمني» مركب وصفي وليس مصطلحاً مسكوكاً ثابتاً؛ يمكن إبدال «زمني» بـ«وقتي» فيبقى المعنى — مما يُضعف التثبيت المعجمي"
      - "المجموعة تحتوي لمّة واحدة فقط، والتغطية المعجمية ضعيفة لمفهوم شائع في العربية الكلاسيكية"
      - "اللمّة الموجودة تفتقر إلى التشكيل الكامل"
    observations: "المفهوم المقصود هو نقطة زمنية نائية — غاية أو منتهى في الزمن. في التراث العربي ألفاظ كثيرة تدل على البُعد الزمني مثل الأَمَد والشَّأْو والمَدَى. أنسبها للمفهوم هو «الأمد» الذي يُستعمل في القرآن والحديث بمعنى الغاية الزمنية البعيدة."

  blind_candidates:
    - lemma: "أَمَدٌ"
      generation_method: ishtiqaq
      justification: "من جذر «م د د» على وزن فَعَل، ويدل في المعاجم على الغاية والمنتهى في الزمن. ورد في القرآن: ﴿فَطَالَ عَلَيْهِمُ الْأَمَدُ﴾ بمعنى المدة البعيدة"
    - lemma: "شَأْوٌ"
      generation_method: majaz
      justification: "الشأو في الأصل الشوط والسبق، ثم استُعير للغاية والأمد البعيد. يقال «شأو بعيد» أي غاية نائية. فيه ملمح المسافة والبعد"
    - lemma: "مَدًى"
      generation_method: majaz
      justification: "المدى هو الغاية والمسافة، من جذر «م د ي» الدال على الامتداد. يُستعمل في السياق الزمني: مدى الدهر، مدى الأجل"
    - lemma: "غَايَةٌ"
      generation_method: majaz
      justification: "الغاية هي النهاية والمنتهى، وتُستعمل للنقطة الأبعد في الزمن أو المكان. يقال «بعيد الغاية» أي بعيد المرمى"


stage2_evidence:
  per_lemma:
    - lemma: "بُعْدٌ زَمَنِيٌّ"
      expands:
        - text: "«البُعْدُ: خلاف القُرْب. وقد بَعُدَ بالضم فهو بعيد، أي تَباعَدَ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "الجذر «بعد» يدل على خلاف القرب وهو أساس المركب"
        - text: "«(بَعِدَ) الْبَاءُ وَالْعَيْنُ وَالدَّالُ أَصْلَانِ: خِلَافُ الْقُرْبِ، وَمُقَابِلُ قَبْلَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الأول يدل على التباعد مطلقاً — مكانياً وزمانياً"
        - text: "«زَمَنِيّ: نسبة إلى الزَّمَن: الزمان»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "تأكيد النسبة إلى الزمن"

    - lemma: "أَمَدٌ"
      confirm:
        - text: "«الأَمَدُ: الغاية كالمدى. يقال: ما أَمَدُكَ؟ أي منتهى عمرك»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«الأمد: الغاية، تقول بلغ أمده أي غايته، قال الراغب: ولأمد والأبد متقاربان لكن الأبد عبارة عن مدة الزمان التي لا حد لها ولا تتقيد، والأمد مدة لها حد مجهول إذا أطلق»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الأَمَدُ: الغاية. وأَمَدُ كل شيء منتهاه»"
          source: "غريب الحديث لأبي عبيد"
        - text: "«الأَمَدُ منتهى الأَجل، وللإِنسان أَمَدانِ: أحدهما ابتداء خلقه الذي يظهر عند مولده، والأَمد الثاني الموت»"
          source: "لسان العرب لابن منظور"
        - text: "«(أَمَدَ) الْهَمْزَةُ وَالْمِيمُ وَالدَّالُ، الْأَمَدُ: الْغَايَةُ. كَلِمَةٌ وَاحِدَةٌ لَا يُقَاسُ عَلَيْهَا»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "شَأْوٌ"
      confirm:
        - text: "«الشَّأْوُ: الغايةُ والأَمَدُ. وعَدا شَأْواً أي طَلَقاً. والشَّأْوُ أيضاً السَّبْقُ»"
          source: "مختار الصحاح للرازي"
        - text: "«الشأو: الشوط والأمد والغاية. ويقال: إنه لبعيد الشأو أي الهمة»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(شَأَوَ) الشِّينُ وَالْهَمْزَةُ وَالْوَاوُ كَلِمَتَانِ مُتَبَاعِدَتَانِ جِدًّا. فَالْأَوَّلُ السَّبْقُ. وَالْكَلِمَةُ الْأُخْرَى الشَّأْوُ: مَا يَخْرُجُ مِنَ الْبِئْرِ إِذَا نُظِّفَتْ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "ابن فارس يرجع الأصل إلى السبق لا إلى الغاية الزمنية، والمعنى الثاني مادي (تراب البئر)"

    - lemma: "مَدًى"
      confirm:
        - text: "«المَدَى: الغايةُ. وأَمْدَى العَرَبِ: أبعَدُهُم غايةً في العزّ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(المدى) المسافة والغاية. ومدى البصر: منتهاه وغايته. ويقال: لا أفعل كذا مدى الدهر: طوله»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(مَدَيَ) الْمِيمُ وَالدَّالُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى امْتِدَادٍ فِي شَيْءٍ وَإِمْدَادٍ. مِنْهُ الْمَدَى: الْغَايَةُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدل على الامتداد المطلق — مكاني وزمني"

    - lemma: "غَايَةٌ"
      confirm:
        - text: "«(الغاية) النهاية والآخر. فغاية كل شيء: نهايته وآخره. ويقال: فلان بعيد الغاية: صائب الرأي»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الغَايَة: ما يكون مؤثراً في مؤثرية الشيء»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "المصطلح الفلسفي للغاية يعني العلة الغائية، وهو معنى مغاير تماماً للبعد الزمني"
      expands:
        - text: "«الغاية: آخر نصف البيت الآخر في البيت — مصطلح عروضي»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "اللفظ مشترك بين عدة معانٍ اصطلاحية مما يُضعف تخصيصه للدلالة الزمنية"


stage3_analysis:
  per_lemma:
    - lemma: "بُعْدٌ زَمَنِيٌّ"
      decision: confirmed
      decision_reason: "مركب وصفي واضح الدلالة يجمع بين مفهوم البُعد (خلاف القرب) والزمن. رغم أنه ليس مصطلحاً مسكوكاً في المعاجم القديمة، إلا أنه مستعمل في الكتابة العربية المعاصرة للدلالة على التباعد في الزمن"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يدل على مفهوم التباعد الزمني المجرد — المسافة في الزمن — أكثر من دلالته على نقطة بعينها"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُعْدٌ زَمَنِيٌّ"

    - lemma: "أَمَدٌ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي أصيل ثابت في المعاجم الكلاسيكية والمعاصرة بمعنى الغاية والمنتهى في الزمن. ورد في القرآن الكريم ﴿فَطَالَ عَلَيْهِمُ الْأَمَدُ﴾ مما يؤكد دلالته على النقطة الزمنية البعيدة. أجمعت المعاجم على أن الأمد هو الغاية الزمنية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على الغاية الزمنية المحددة — منتهى الأجل والعمر — وهو أخص من «بعد زمني» لأنه يتضمن معنى النقطة النهائية"
      actions:
        - command: create_entry
          params: {lemma: "أَمَدٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "شَأْوٌ"
      source: stage1
      decision: removed
      decision_reason: "الأصل في الشأو السبق والعَدْو كما صرّح ابن فارس، ومعنى الغاية والأمد فيه ثانوي مجازي. كما أن الاستعمال المعاصر يغلب فيه معنى السبق والتفوق (بعيد الشأو = بعيد الهمة) لا البُعد الزمني"

    - lemma: "مَدًى"
      source: stage1
      decision: removed
      decision_reason: "المدى يدل على الامتداد والمسافة بصفة عامة ويغلب عليه الاستعمال المكاني (مدى البصر، مدى الصوت). وتداخله الكبير مع «الأمد» — حيث قال الجوهري «الأَمَدُ: الغاية كالمدى» — يجعل إضافته تكراراً دون فائدة تمييزية"

    - lemma: "غَايَةٌ"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام جداً يدل على النهاية والمنتهى مطلقاً دون تخصيص زمني. كما أنه مشترك بين معانٍ اصطلاحية متعددة (العلة الغائية في الفلسفة، مصطلح عروضي) مما يُضعف دقته في السياق الزمني"


