        value: '{"root":"وقد","maqayis":"«الْوَاوُ وَالْقَافُ وَالدَّالُ: كَلِمَةٌ تَدُلُّ عَلَى اشْتِعَالِ نَارٍ. وَالْوَقُودُ: الْحَطَبُ. وَالْوُقُودُ: فِعْلُ النَّارِ إِذَا وَقَدَتْ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"حرق","maqayis":"«الْحَاءُ وَالرَّاءُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا حَكُّ الشَّيْءِ بِالشَّيْءِ مَعَ حَرَارَةٍ وَالْتِهَابٍ. وَالْحَرَقُ: النَّارُ.»"}'
