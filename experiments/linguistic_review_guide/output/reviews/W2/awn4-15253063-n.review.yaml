# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15253063-n
# المفهوم: ربع ساعة (a quarter of an hour)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (ربع ساعة)، وهو مركّب إضافي طبيعي لكنّه يحتاج إلى تشكيل كامل"
      - "التعريف العربي الحالي أقرب إلى الشرح المختصر منه إلى التعريف المعجمي المتكامل"
    observations: "المفهوم بسيط وواضح — وحدة زمنية تساوي خمس عشرة دقيقة أو ربع الساعة الفلكية. التعبير العربي عنه مستقرّ ومتداول في الفصحى المعاصرة والتراثية على حدّ سواء. لا يُتوقّع وجود مرادفات عربية كثيرة لهذا المفهوم لأنّه وحدة قياس محدّدة لا تقبل التعدّد الدلالي الواسع."
  blind_candidates:
    - lemma: "رُبْعُ سَاعَةٍ"
      generation_method: tarkib
      justification: "مركّب إضافي ثابت يدلّ على الجزء الواحد من أربعة أجزاء الساعة، وهو التعبير الأكثر طبيعية في العربية لهذا المفهوم"
    - lemma: "رُبْعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «رُبْع» على وزن فُعْلِيَّة، للدلالة على الوحدة الزمنية المقدّرة بربع ساعة، قياساً على «عَشْرِيَّة» و«خُمْسِيَّة»"
    - lemma: "رُبْع"
      generation_method: majaz
      justification: "إطلاق الجزء (الرُّبْع) مجازاً على ربع الساعة بحذف المضاف إليه لكثرة الاستعمال في سياق الوقت"
    - lemma: "خَمْسَ عَشْرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من العدد «خمس عشرة» للدلالة على الفترة المقدّرة بخمس عشرة دقيقة، على نمط تسمية الوحدات بعددها"

stage2_evidence:
  per_lemma:
    - lemma: "رُبْعُ سَاعَةٍ"
      confirm:
        - text: "«رُبع ساعة: خمس عشرة دقيقة.»"
          source: "المورد الحديث (2008)"
        - text: "«سيأتي بعد رُبْع ساعة — الصواب والرتبة: سيأتي بعد رُبْع ساعة [فصيحة] — سيأتي بعد رُبُع ساعة [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«ماذا ستفعل في رُبُع الساعة القادمة — الصواب والرتبة: ماذا ستفعل في ربع الساعة القادم؟ [فصيحة] — ماذا ستفعل في رُبُع الساعة القادمة؟ [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«مختصر كلَّ رُبْعِ ساعَة [صيدلة]»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الرُّبْعُ: جزء من أربعة أجزاء, ويُطلق عُرْفاً على مكيال يسع أربعة أقداح»"
          source: "المعجم الوسيط"
          addition: "تأكيد أنّ الرُّبْع هو الجزء من أربعة أجزاء"
        - text: "«الربع: بضمتين وسكون الثاني: تخفيف جزء من أربعة أجزاء»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يجوز التسكين والتثقيل في عين الكلمة: رُبْع ورُبُع"

    - lemma: "رُبْعِيَّة"
      evidence_status: "no_material_found"

    - lemma: "رُبْع"
      confirm:
        - text: "«ربع — quarter»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      contradicts:
        - text: "«الرُّبْعُ: جزء من أربعة أجزاء» — دون تخصيص بالزمن"
          source: "المعجم الوسيط"
          conflict: "الرُّبْع بمفرده يدلّ على الجزء العددي المجرّد، لا على ربع الساعة تحديداً"

    - lemma: "خَمْسَ عَشْرِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "رُبْعُ سَاعَةٍ"
      decision: confirmed
      decision_reason: "مركّب إضافي ثابت ومتداول في الفصحى المعاصرة والتراثية، موثّق في المورد الحديث ومعجم الصواب اللغوي والمعجم الطبي الموحد. هو التعبير الوحيد المسكوك والمتّفق عليه لهذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُبْعُ سَاعَةٍ"

    - lemma: "رُبْعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على استعمال «رُبْعِيَّة» بمعنى ربع الساعة. المصدر الصناعي هنا غير مسكوك ولا مستعمل، وقد يلتبس بمعانٍ أخرى (نسبة إلى الربع العددي أو الربيع)."
      evidence_assessment:
        case: no_material

    - lemma: "رُبْع"
      source: stage1
      decision: removed
      decision_reason: "الرُّبْع بمفرده يدلّ على الكسر العددي المجرّد (جزء من أربعة) ولا يختصّ بالزمن. حذف المضاف إليه يوقع في لبس شديد مع عشرات الاستعمالات الأخرى (ربع الميراث، ربع المدينة، إلخ)."
      evidence_assessment:
        case: mixed

    - lemma: "خَمْسَ عَشْرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تركيب مصطنع لا شاهد عليه في أيّ معجم. لا يُعرف في العربية تسمية وحدة زمنية بعدد دقائقها على هذا النمط."
      evidence_assessment:
        case: no_material

