stage1_review:
  assessment:
    concerns:
      - "استخدام لمة 'بلد' قد يكون مجازياً (إطلاق المحل وإرادة الحال) وليس دلالة أصلية على الأشخاص المكونين للأمة."
      - "غياب التشكيل عن اللمات الحالية."
      - "التعريف ركيك ويحتوي على دوران (يعرّف الأمة بالأمة)."
    observations: "المفهوم يشير إلى المجموعة البشرية التي تقطن منطقة جغرافية ولها كيان سياسي أو ثقافي. اللمات 'شعب' و'أمة' دقيقة جداً في التعبير عن هذا المفهوم، في حين أن 'بلد' تشير أساساً إلى الحيز المكاني."
  blind_candidates:
    - lemma: "شَعْب"
      generation_method: ishtiqaq
      justification: "مصطلح أساسي يعبر عن مجموعة من الناس يجمعهم وطن واحد ونظام سياسي واجتماعي."
    - lemma: "أُمَّة"
      generation_method: ishtiqaq
      justification: "تدل على جماعة من الناس تربطهم روابط مشتركة عميقة كالدين أو اللغة أو الأصل والمصير."
    - lemma: "رَعِيَّة"
      generation_method: ishtiqaq
      justification: "مصطلح أصيل يطلق على عامة الناس الذين يخضعون لسلطة حاكم في دولة ما."
    - lemma: "سُكَّان"
      generation_method: ishtiqaq
      justification: "تدل بشكل مباشر ومحايد على مجموع الأشخاص القاطنين في رقعة جغرافية محددة."
stage2_evidence:
  per_lemma:
    - lemma: "أمة"
      confirm:
        - text: "«الجماعة ... الجِيلُ والقَرْنُ مِنَ النَّاس ... أُمَّةُ كُلِّ نَبِيّ: مَنْ أُرْسِلَ إليهم من كافِرٍ ومُؤْمِن»"
          source: "المعجم الكبير"
        - text: "«جماعة من الناس أكثرهم من أصل واحد، وتجمعهم صفات موروثة، ومصالح وأمانى واحدة، أو يجمعهم أمر واحد من دين أو مكان أو زمان»"
          source: "المعجم الوسيط"
    - lemma: "بلد"
      contradicts:
        - text: "«الأرض ، وكل موضع أو قطعة من الأرض عامرة كانت أو غير عامرة ... المكان مطلقاً كالعراق والشام أو المكان المخطط المحدود الآهل بالسكان»"
          source: "المعجم الكبير"
          conflict: "الكلمة تشير إلى الحيز المكاني الجغرافي وليس إلى مجموعة الأشخاص المكونين للأمة (الاستخدام للأشخاص مجازي وليس أصلياً)."
    - lemma: "شعب"
      confirm:
        - text: "«الجماعة الكبيرة تَرْجِعُ لأَبٍ واحدٍ، وهو أوسعُ من القَبِيلةِ»"
          source: "المعجم الكبير"
        - text: "«الجماعة من الناس تخضع لنظام اجتماعي واحد ... الجماعة تتكلم لساناً واحداً»"
          source: "المعجم الوسيط"
    - lemma: "رعية"
      confirm:
        - text: "«العامَّةُ الذين عليهم راعٍ يُدَبِّرُ أَمْرَهم ويَرْعَى مَصالِحَهم»"
          source: "المعجم الكبير"
    - lemma: "سكان"
      evidence_status: "no_material_found"
stage3_analysis:
  per_lemma:
    - lemma: "أمة"
      decision: confirmed
      decision_reason: "تدل بدقة على مجموعة من الناس تجمعهم روابط مشتركة قوية مثل الدين أو اللغة أو المصير المشترك، وهو ما يطابق المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تشير عادة إلى جماعة تجمعها روابط ثقافية أو دينية أو لغوية أو مصير مشترك، وتتجاوز الحدود الجغرافية أحياناً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُمَّة"
    - lemma: "بلد"
      decision: removed
      decision_reason: "الكلمة تشير إلى الحيز المكاني (الأرض أو المنطقة) وليس إلى الأشخاص أنفسهم. إطلاقها على الأشخاص يكون من باب المجاز المرسل (إطلاق المحل وإرادة الحال)، ولا يصح عدها مرادفاً مباشراً للمفهوم المعجمي لمجموعة البشر."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "شعب"
      decision: confirmed
      decision_reason: "تدل بدقة على مجموعة من الأفراد يعيشون في إقليم واحد ويخضعون لنظام سياسي واجتماعي واحد، وهو ما يعبر عن المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تشير إلى مجموعة الأفراد الذين يعيشون على أرض واحدة ويخضعون لنظام سياسي واجتماعي واحد، وغالباً ما ترتبط بمفهوم الدولة أو الإقليم الجغرافي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَعْب"
    - lemma: "رَعِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن مجموعة الناس الذين يعيشون في دولة ويخضعون لسلطة سياسية أو حاكم، وهي مناسبة للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تؤكد على العلاقة السياسية والخضوع لسلطة حاكم أو نظام حكم يدبر شؤون الناس."
      actions:
        - command: create_entry
          params:
            lemma: "رَعِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "سُكَّان"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح شائع جداً يعبر بوضوح عن مجموع الأشخاص القاطنين في رقعة جغرافية محددة كدولة أو مدينة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تشير بشكل حيادي إلى مجرد الإقامة الجغرافية في منطقة معينة دون التركيز على الروابط الثقافية أو السياسية العميقة."
      actions:
        - command: create_entry
          params:
            lemma: "سُكَّان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
stage4_content:
  definition:
    current: "الناس الذين يعيشون في أمة أو بلد"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على دوران (يستخدم كلمة أمة لتعريف الأمة)، كما أنه ركيك ومترجم حرفياً من الإنجليزية."
    authored:
      - type: terminological
        text: "مجموعة من الناس يقطنون إقليماً أو بلداً معيناً، وتجمعهم روابط مشتركة كاللغة أو الأصل أو الخضوع لنظام سياسي واحد."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة من الناس يقطنون إقليماً أو بلداً معيناً، وتجمعهم روابط مشتركة كاللغة أو الأصل أو الخضوع لنظام سياسي واحد."
  examples:
    per_lemma:
      - lemma: "أمة"
        examples:
          - text: "تتكاتف الأُمَّةُ وقت الأزمات للدفاع عن مقدراتها ومصالحها."
            type: usage
      - lemma: "شعب"
        examples:
          - text: "خرج الشَّعْبُ للاحتفال بيوم الاستقلال الوطني."
            type: usage
      - lemma: "رَعِيَّة"
        examples:
          - text: "من واجب الحاكم أن يسهر على رعاية مصالح رَعِيَّتِهِ."
            type: usage
      - lemma: "سُكَّان"
        examples:
          - text: "تضاعف عدد سُكَّانِ البلاد في العقدين الأخيرين."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تتكاتف الأُمَّةُ وقت الأزمات للدفاع عن مقدراتها ومصالحها."
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "خرج الشَّعْبُ للاحتفال بيوم الاستقلال الوطني."
