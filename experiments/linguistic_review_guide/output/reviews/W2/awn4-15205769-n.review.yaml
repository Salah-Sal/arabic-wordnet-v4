# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15205769-n
# arrival time / وقت الوصول
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «وقت الوصول» تركيب إضافي يكاد يكون إعادة صياغة حرفية للتعريف «الوقت المقرر لوصول...»، مما يثير شبهة الدوران"
      - "المجموعة تحتوي على لمّة واحدة فقط وهو أمر ضعيف لمفهوم شائع الاستعمال"
    observations: "المفهوم المعبَّر عنه هنا هو الوقت المحدد الذي يُتوقَّع فيه وصول وسيلة نقل عامة إلى محطة أو وجهة معينة. هذا مفهوم حديث مرتبط بجداول المواصلات. التعبير عنه بالعربية يكون طبيعياً بتركيب إضافي. لا يوجد مصطلح مفرد عربي تراثي يؤدي هذا المعنى بدقة، فالمفهوم مستحدث يرتبط بالنقل الحديث المنظّم."
  blind_candidates:
    - lemma: "مَوْعِد القُدُوم"
      generation_method: tarkib
      justification: "تركيب إضافي من «مَوْعِد» (وزن مَفْعِل من وعد، يدل على زمان الوعد أو مكانه) و«القُدُوم» (مصدر قَدِم يَقْدَم بمعنى الوصول والحضور). يجمع بين دلالة التحديد الزمني ودلالة الوفود."
    - lemma: "مِيقَات الوُرُود"
      generation_method: tarkib
      justification: "تركيب إضافي من «مِيقَات» (وزن مِفْعَال من وقت، يدل على الوقت المضروب للفعل) و«الوُرُود» (مصدر ورد بمعنى الإتيان والموافاة). الميقات يحمل دلالة التحديد المسبق."
    - lemma: "سَاعَة الوُرُود"
      generation_method: tarkib
      justification: "تركيب إضافي من «ساعة» بمعنى الوقت المحدد و«الورود» بمعنى الوصول. أسلوب شائع في العربية لتحديد أوقات الأحداث: ساعة الرحيل، ساعة اللقاء."
    - lemma: "حِين القُدُوم"
      generation_method: tarkib
      justification: "تركيب إضافي من «حين» (وقت مبهم يصلح لجميع الأزمان) و«القدوم». أقل تحديداً من موعد أو ميقات لكنه فصيح ومستعمل."

stage2_evidence:
  per_lemma:
    - lemma: "وَقْت الوُصُول"
      confirm:
        - text: "«وقت الوصول» — arrival time"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "«الوقت التقديري للوصول» — estimated time of arrival (ETA)"
          source: "مسرد الفن، التسلية والرياضة، أليكسو"
      expands:
        - text: "«وقْت الوصول: أحد المعايير المحسوبة من الفارينوجرام ويعبر عن سرعة امتصاص الطحين للماء.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "المصطلح يُستعمل أيضاً في مجال تقانات الأغذية بمعنى تقني مختلف"
        - text: "«وَقْت الوصول: الوقت اللازم لوصول درجة الحرارة داخل جهاز التعقيم للحد المطلوب.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "استعمال تقني ثانٍ في مجال الأغذية يدل على اشتراك لفظي"
    - lemma: "مَوْعِد القُدُوم"
      evidence_status: "no_material_found"
    - lemma: "مِيقَات الوُرُود"
      evidence_status: "no_material_found"
    - lemma: "سَاعَة الوُرُود"
      evidence_status: "no_material_found"
    - lemma: "حِين القُدُوم"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "وَقْت الوُصُول"
      decision: confirmed
      decision_reason: "مصطلح مثبت في المعجم الموحد لمصطلحات النقل (أليكسو ٢٠١٠) بترجمة arrival time، وهو التعبير الطبيعي السائد في العربية المعاصرة لهذا المفهوم. تركيب إضافي شفاف المعنى واسع التداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَقْت الوُصُول"

    - lemma: "مَوْعِد القُدُوم"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي لهذا التركيب كوحدة اصطلاحية ثابتة. «القدوم» في المعاجم يدل أساساً على السبق والتقدم وعلى آلة النحت، واستعماله بمعنى الوصول أقل شيوعاً من «الوصول» في سياق النقل الحديث. التركيب حر وليس مصطلحاً مسكوكاً."

    - lemma: "مِيقَات الوُرُود"
      source: stage1
      decision: removed
      decision_reason: "«الميقات» مرتبط في الاستعمال بمواقيت الحج والصلاة والشريعة. استعماله في سياق النقل الحديث غريب ومنفِّر. كما أن «الورود» بمعنى الوصول أقل تداولاً في السياق المعاصر. لا شاهد معجمي على هذا التركيب."

    - lemma: "سَاعَة الوُرُود"
      source: stage1
      decision: removed
      decision_reason: "تركيب حر غير مثبت معجمياً. «ساعة» تدل على وحدة زمنية محددة (٦٠ دقيقة) أكثر مما تدل على الوقت العام، فقد يوهم أن المراد المدة لا اللحظة. لا شاهد."

    - lemma: "حِين القُدُوم"
      source: stage1
      decision: removed
      decision_reason: "«حين» وقت مبهم لا يحمل دلالة التحديد والجدولة التي يقتضيها المفهوم. لا شاهد معجمي على هذا التركيب كمصطلح ثابت."

stage4_content:
