    assessment:
      decision: retain
      reason: "التعريف واضح ومحدد ويتضمن الجنس القريب (الوقت المقرر) والفصل النوعي (لوصول وسيلة نقل عامة إلى وجهة معينة). يوافق التعريف الإنجليزي في المضمون دون أن يكون ترجمة حرفية."
  examples:
    per_lemma:
      - lemma: "وَقْت الوُصُول"
        examples:
          - text: "أعلنت هيئة النقل العام أن وَقْت الوُصُول المحدد للقطار السريع إلى المحطة المركزية هو الساعة الثامنة صباحاً."
            type: usage
    actions:
