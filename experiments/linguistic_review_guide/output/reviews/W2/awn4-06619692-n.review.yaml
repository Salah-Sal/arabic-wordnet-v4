# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-06619692-n (nonsense / كلام فارغ)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «رسالة يبدو أنها لا تحمل أي معنى» ترجمة حرفية للتعريف الإنجليزي، يحتاج إلى صياغة معجمية عربية أصيلة"
      - "المركب «كلام فارغ» تعبير شائع لكنه وصفي أكثر منه مصطلح معجمي ثابت"
      - "اللمّات الثلاث تغطي المفهوم لكن تنقصها لمّة تراثية أدق مثل «هَذَر»"
    observations: "المجموعة تمثّل مفهوم الكلام الخالي من المعنى والفائدة، وهو مفهوم أصيل في الثقافة العربية ولديه ألفاظ تراثية غزيرة. التعريف الإنجليزي يركّز على الرسالة بوصفها حاملاً، بينما الألفاظ العربية تركّز على الكلام ذاته. الجنس القريب هو «رسالة / محتوى» وهو مناسب."
  blind_candidates:
    - lemma: "هَذَر"
      generation_method: ishtiqaq
      justification: "من الجذر «هـ ذ ر»، ومعناه سَقَط الكلام والإكثار منه في خَطَل. يدلّ على المنطق الذي لا يُعتدّ به، وهو لفظ فصيح تراثي يطابق مفهوم المجموعة."
    - lemma: "تُرَّهَات"
      generation_method: ishtiqaq
      justification: "من الجذر «ت ر هـ»، جمع تُرَّهَة، ومعناها الأباطيل من الأمور. شاهدها في شعر رؤبة. تُستعمل في سياق الكلام الباطل عديم القيمة."
    - lemma: "هَذَيَان"
      generation_method: ishtiqaq
      justification: "من الجذر «هـ ذ ي»، ومعناه اختلاط الكلام وعدم اتساقه. يُستعمل للدلالة على الكلام غير المفهوم أو المختلط."
    - lemma: "سَخَف"
      generation_method: ishtiqaq
      justification: "من الجذر «س خ ف»، ومعناه الخفّة والرقّة في العقل والكلام. يدلّ على كلام لا وزن له ولا قيمة."

stage2_evidence:
  per_lemma:
    - lemma: "كَلَام فَارِغ"
      confirm:
        - text: "«هُراء؛ كلام فارغ.»"
          source: "المورد الحديث (2008)"
        - text: "«هُراء؛ كلام فارغ.» — ترجمة لـ balderdash"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«هُراء؛ هَذَر؛ كلام فارغ.» — ترجمة لـ hot air"
          source: "المورد الحديث (2008)"
          addition: "يرد التعبير مقروناً بـ«هراء» و«هذر» كمرادفات"

    - lemma: "لَغْو"
      confirm:
        - text: "«ما لا يُعتدّ به من كلام وغيره ولا يُحصل منه على فائدة ولا نفع»"
          source: "المعجم الوسيط"
        - text: "«اللغو من الكلام ما لا يعتد به، وهو الذي لا يورد عن رؤية وفكر فيجري مجرى اللغا وهو صوت العصافير»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الكلام الباطل الذي لا معنى له»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«اللغو: ما تسبق إليه الألسنة من القول على غير عزم قصد إليه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يضيف بُعد عدم القصد والعمد في اللغو"
        - text: "«الكلام يبدر من اللسان ولا يُراد معناه. ومنه اللغو في اليمين»"
          source: "المعجم الوسيط"
          addition: "يشمل الكلام غير المقصود وأيمان اللغو الفقهية"

    - lemma: "هُرَاء"
      confirm:
        - text: "«الكلام الكثير الفاسد لا نظام له»"
          source: "المعجم الوسيط"
        - text: "«الهُراء: المنطق الفاسد. يقال: أهرأ الرجل في منطقه»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«nonsense» — ترجمة مباشرة"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«رجلٌ هُراء: إذا كان كثير الكلام هذّاءً»"
          source: "المعجم الوسيط"
          addition: "يُستعمل وصفاً للشخص أيضاً لا للكلام فحسب"
        - text: "«الهراء: الهذيان»"
          source: "المعجم الوسيط"
          addition: "يقترن بالهذيان في المعاجم"

    - lemma: "هَذَر"
      confirm:
        - text: "«(الهذر) سقط الكلام»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الهذر وهو الهذيان. ورجل مهذار وهذرة وهذريان أي كثير الكلام في خطل»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(الهذر) لا نزر ولا هذر: لا قليل ولا كثير»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الهَذِر (بكسر الذال) صفة بمعنى الكثير، وهو لفظ آخر"

    - lemma: "تُرَّهَات"
      confirm:
        - text: "«الأباطيل من الأمور»"
          source: "مقاييس اللغة"
      expands:
        - text: "«التاء والراء والهاء كلمة ليست بأصل متفرع منه. قالوا: الترّهات والتُّرَّه الأباطيل من الأمور»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ليس أصلاً متفرعاً، والكلمة تدلّ على الأباطيل عموماً لا الكلام حصراً"

    - lemma: "هَذَيَان"
      contradicts:
        - text: "«اضطراب عقلي مؤقت يتميز باختلاط أحوال الوعي (مج)»"
          source: "المعجم الوسيط"
          conflict: "المعنى الحديث مصطلح طبي (delirium) لا يدلّ على كلام فارغ بل على حالة مرضية عصبية"

    - lemma: "سَخَف"
      contradicts:
        - text: "«السُّخْف: رقّة العقل»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "السخف يدلّ على رقّة العقل والخفّة فيه، لا على الكلام الفارغ ذاته بوصفه رسالة"
        - text: "«السُّخْف في العقل خاصة، والسخافة عامة في كل شيء»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الدلالة الأساسية هي الخفّة والرقّة في العقل، وهي صفة في الشخص لا في الكلام"

stage3_analysis:
  per_lemma:
    - lemma: "كَلَام فَارِغ"
      decision: confirmed
      decision_reason: "تعبير اصطلاحي ثابت يرد في المورد الحديث ترجمةً لعدد كبير من المصطلحات الإنجليزية (nonsense, bunk, balderdash, hokum, drivel). وهو مفهوم لدى المتكلّم العربي المعاصر ويُستعمل استعمالاً واسعاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تعبير عامّي معاصر شائع، يصف الكلام بالفراغ من المضمون، ويُستعمل في السياق اليومي والإعلامي أكثر من السياق الأدبي أو العلمي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَلَامٌ فَارِغ"

    - lemma: "لَغْو"
      decision: confirmed
      decision_reason: "لفظ قرآني فصيح ثابت في المعاجم الكلاسيكية والحديثة بمعنى الكلام الذي لا يُعتدّ به. أكّدته مصادر متعددة (المعجم الوسيط، التوقيف، كشّاف الاصطلاحات). جذره «لغو» أصل صحيح يدلّ على ما لا يُعتدّ به."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الكلام الذي لا يُعتدّ به ولا يُراد معناه، مع بُعد عدم القصد والإرادة. له استعمال فقهي خاص (لغو اليمين). أعمّ دلالةً من «هراء» إذ يشمل كل ما لا فائدة فيه."
      actions: []

    - lemma: "هُرَاء"
      decision: confirmed
      decision_reason: "لفظ تراثي أصيل أكّدته مقاييس اللغة بمعنى «المنطق الفاسد»، والمعجم الوسيط بمعنى «الكلام الكثير الفاسد لا نظام له». كما ورد في المعجم الطبي الموحد ترجمةً لـ nonsense."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على فساد المنطق وكثرة الكلام مع انعدام النظام فيه. أخصّ من «لغو» لأنه يدلّ على فساد مضمون الكلام لا مجرّد عدم الاعتداد به."
      actions: []

    - lemma: "هَذَر"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ فصيح ثابت في المعجم الوسيط بمعنى «سقط الكلام»، وفي مقاييس اللغة بمعنى «الهذيان وكثرة الكلام في خطل». يطابق مفهوم المجموعة، ويُثري البُعد التراثي. ورد مقروناً بـ«هراء» في المورد الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على سَقَط الكلام مع دلالة على الإكثار والخَطَل، فيجمع بين فراغ المضمون وكثرة الإنتاج. أقرب إلى الإسهاب العشوائي منه إلى مجرّد الخلوّ من المعنى."
      actions:
        - command: create_entry
          params: {lemma: "هَذَر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تُرَّهَات"
      source: stage1
      decision: removed
      decision_reason: "تدلّ على «الأباطيل من الأمور» عموماً لا على الكلام الفارغ حصراً. دلالتها أوسع من مفهوم المجموعة الذي يخصّ الرسالة/الكلام. كما أنها صيغة جمع (تُرَّهَة) والأنسب أن تكون اللمّة مفرداً أو اسم جنس."

    - lemma: "هَذَيَان"
      source: stage1
      decision: removed
      decision_reason: "تحوّل المعنى الحديث إلى مصطلح طبي (delirium) يدلّ على اضطراب عقلي مؤقت، وهو بعيد عن مفهوم الكلام الفارغ من المعنى. الخلط بينهما قد يُوهم معنى مرضياً غير مقصود."

    - lemma: "سَخَف"
      source: stage1
      decision: removed
      decision_reason: "يدلّ على رقّة العقل وخفّته لا على الكلام ذاته. الدلالة الأساسية صفة في الشخص (سخيف العقل) لا في الرسالة. يناسب مجموعة ترادفية أخرى تتعلق بالحماقة أو السخافة."

