        (الغاية/telos)؛ يُمثِّل نهاية المسار لا المسار بكامله؛ أضيق دلالةً من
        «تطور» و«نشوء» إذ يُصوِّر الاكتمال لا الانبثاق
      actions:
        - command: create_entry
          params: {lemma: "نُضْج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَرَقٍّ"
      source: stage1
      decision: removed
      decision_reason: >-
        الأدلة تُثبِّت «ترقّي» حصراً في السياقَيْن الصوفي والوظيفي لا البيولوجي؛
        لا يوجد تثبيت معجمي في علم الأحياء؛ لا يجتاز اختبار الاستبدال (يمكن
        إبداله بـ«تطور» أو «ارتقاء» في نفس السياق البيولوجي بلا فقدان معنى)؛
        يفشل اختبار السكّ المعجمي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── لمّات مستنبطة من أدلة المرحلة ٢ — الإضافات التقنية الجوهرية ──
    - lemma: "تَكَوُّنُ الفَرْد"
      source: stage2_evidence
      decision: confirmed
      decision_reason: >-
        المصطلح التقني الأدقّ والأشيع لـ ontogeny/ontogenesis في المعاجم العربية
        المتخصصة؛ مثبَّت في ثلاثة مصادر مستقلة: المعجم الموحد لمصطلحات علم الأحياء
        (1993)، المعجم الموحد لمصطلحات الوراثة (2009)، المعجم الطبي الموحد (2009).
        تعريف الوراثة «مسلك تطور الكائن الفرد من الزيجوت إلى طور البلوغ» يتطابق
        تطابقاً تاماً مع تعريف المجموعة. غيابه عن المجموعة كان ثغرةً جوهريةً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        المصطلح الأدقّ تقنيًّا لـ ontogeny/ontogenesis؛ يُغطي المسار الكامل
        من الزيجوت إلى البلوغ؛ الوحيد في المجموعة الذي يحمل قيد «الفرد» صراحةً
        بصفته مكوِّناً بنيويًّا، ويُميِّز بين التطور الفردي والنوعي صراحةً
      actions:
        - command: create_entry
          params: {lemma: "تَكَوُّنُ الفَرْد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَنَشُّؤُ الفَرْد"
      source: stage2_evidence
      decision: confirmed
      decision_reason: >-
        مثبَّت في المعجم الطبي الموحد (2009) بمعنى ontogenesis بصريح المعادل
        الإنجليزي؛ يُشكِّل بديلاً مقبولاً لـ«تكوّن الفرد» في الكتابة الطبية
        المتخصصة، ويضيف الجذر (نشأ) الذي يُغطّي الجانب الاستهلالي من الظهور
        والنشأة الأولى.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        قريب من «تكوّن الفرد» لكنه يُركِّز على جانب النشأة والارتفاع الأوّلي
        (أصل نشأ = ارتفاع وسموّ)؛ أكثر استخداماً في الكتابة الطبية؛
        يُركِّز على الانبثاق والظهور بينما «تكوّن الفرد» يُركِّز على الصيرورة
        في مجملها
      actions:
        - command: create_entry
          params: {lemma: "تَنَشُّؤُ الفَرْد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}


