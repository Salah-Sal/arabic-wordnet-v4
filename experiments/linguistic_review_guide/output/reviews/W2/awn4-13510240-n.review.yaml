stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث (تطور، نشوء، نمو) خاليةٌ من التشكيل الكامل"
      - "«تطور» يحمل في معظم المعاجم التقنية دلالةَ evolution (التطور النوعي الفيلوجيني الداروي) أكثر من دلالة ontogeny (التكوّن الفردي)، مما يُوقع خلطاً مفهوميًّا"
      - "«نشوء» وحده يُرادف في الغالب genesis (النشأة والظهور العامّ) لا ontogeny؛ الدلالة التقنية الدقيقة تستلزم المركَّب «نشوء الفرد»"
      - "«نمو» مصطلح كمّي عامّ (زيادة في الحجم والكتلة = growth)، ولا يخصِّص العملية البيولوجية التطورية الفردية المُعقَّدة الموصوفة في التعريف"
      - "المصطلح التقني الأدقّ لـ ontogeny/ontogenesis وهو «تكوّن الفرد» غائبٌ عن المجموعة رغم تثبيته في ثلاثة معاجم عربية متخصصة"
      - "التعريف العربي الحالي يحتوي على خطأ نحوي: «تكشف بيولوجي بحت» عبارة غير صحيحة صرفيًّا؛ الصواب: «انكشافٌ بيولوجيٌّ بحت» أو «تكشُّفٌ بيولوجيٌّ»"
    observations: >-
      المجموعة تضمّ ثلاثة مصطلحات عربية فصيحة راسخة تُغطّي مفهوم النمو والتطور
      العضوي بصورة عامّة، لكنها تفتقر إلى المصطلح التقني الدقيق المُعتمَد في المعاجم
      البيولوجية العربية للتعبير عن ontogeny/ontogenesis وهو «تكوّن الفرد» — المثبَّت
      في معجم الأحياء ومعجم الوراثة والمعجم الطبي الموحد. اللمّات الثلاث الموجودة
      تتقاسم الأصل المفهومي لكنها تتباين في زوايا الدلالة: «تطور» يُركِّز على
      التحوُّل من طور إلى طور، «نشوء» على الظهور والنشأة، «نمو» على الزيادة الكمّية
      — وكلّها أعمّ من المفهوم المخصوص (التكوّن الفردي). الإضافة الجوهرية التي
      تحتاجها المجموعة هي «تكوّن الفرد» (الأشيع والأدقّ) و«تنشّؤ الفرد»
      (الموثَّق في الطبّ) ليكتمل التغطية الاصطلاحية.

  blind_candidates:
    - lemma: "تَنَشُّؤ"
      generation_method: ishtiqaq
      justification: >-
        مصدر تَفَعُّل من الجذر (ن-ش-أ)؛ ابن فارس: «يدل على ارتفاع في شيء وسموّ».
        يُعبِّر عن عملية النشأة التدريجية والارتفاع من الأدنى إلى الأعلى، مما يناسب
        وصف الكائن الحي في تحوُّله من البسيط إلى المعقد. صيغة تَفَعُّل تدلّ على
        التدرُّج والتكامل التلقائي.
    - lemma: "تَكَوُّن"
      generation_method: ishtiqaq
      justification: >-
        مصدر تَفَعُّل من الجذر (ك-و-ن)؛ ابن فارس: «يدل على الإخبار عن حدوث شيء
        في زمان ماضٍ أو راهن». يُعبِّر عن عملية الصيرورة والتشكُّل التدريجي من
        مرحلة جنينية إلى كيان مكتمل، مما يناسب دلالة التكوُّن البيولوجي الفردي.
    - lemma: "نُضْج"
      generation_method: ishtiqaq
      justification: >-
        مصدر من الجذر (ن-ض-ج)؛ ابن فارس: «أصل يدل على بلوغ النهاية في طبخ الشيء،
        ثم يُستعار في كل شيء بلغ مدى الإحكام». يُقابل «maturation» في اللمّات
        الإنجليزية للمجموعة، ويُعبِّر عن الغاية التكاملية للعملية البيولوجية الفردية.
    - lemma: "تَرَقٍّ"
      generation_method: ishtiqaq
      justification: >-
        مصدر تَفَعُّل من الجذر (ر-ق-ي)؛ يدلّ على الانتقال من مرتبة إلى مرتبة أعلى
        درجةً درجة. يُناسب وصف الكائن الحي في انتقاله من «مستوى بسيط إلى مستوى
        أكثر تعقيدًا» كما ورد في التعريف.


