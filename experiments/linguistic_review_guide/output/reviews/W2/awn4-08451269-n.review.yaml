  per_entry:
    - lemma: "شَبَكَة"
      entry_id: "{auto}"
      root: "شبك"
      maqayis_quote: "«الشِّينُ وَالْبَاءُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَدَاخُلِ الشَّيْءِ. يُقَالُ شَبَّكَ أَصَابِعَهُ تَشْبِيكًا. وَمِنْ ذَلِكَ الشَّبَكَةُ.»"
    - lemma: "مَنْظُومَة"
      entry_id: "{auto}"
      root: "نظم"
      maqayis_quote: "«النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتأْلِيفِهِ، وَنَظَمْتُ الْخَرَزَ نَظْمًا.»"
    - lemma: "شَابِكَة"
      entry_id: "{auto}"
