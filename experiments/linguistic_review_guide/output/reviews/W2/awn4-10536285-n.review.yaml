stage1_review:
  assessment:
    concerns: []
    observations: "تتطابق اللمة الحالية (مُسَجَّل) تماماً مع المفهوم الإنجليزي (registrant)، وهي اسم مفعول يفيد من وقع عليه فعل التسجيل والإثبات في السجلات الرسمية. اللمة دقيقة وشائعة الاستخدام في السياقات الإدارية والقانونية."
  blind_candidates:
    - lemma: "مُسَجَّل"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الفعل (سجَّل)، يدل على الشخص الذي أُثبت اسمه في السجل."
    - lemma: "مُقَيَّد"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الفعل (قيَّد)، بمعنى من أُدرج اسمه في قيد أو سجل رسمي."
    - lemma: "مُدْرَج"
      generation_method: ishtiqaq
      justification: "اسم مفعول من (أدرج)، بمعنى من تم إدخال اسمه ضمن قائمة أو سجل."
    - lemma: "مُكْتَتِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (اكتتب)، يستخدم لمن يسجل نفسه في هيئة أو يكتتب في أسهم."

stage2_evidence:
  per_lemma:
    - lemma: "مُسَجَّل"
      confirm:
        - text: "مُسَجَّل: من (س ج ل) المقيد والمثبت والمدون."
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "المُسَجَّلُ: اكتسب صفة الرسمية بإثباته في دفتر خاص"
          source: "المعجم الوسيط"
        - text: "السُّكَّانُ المُسَجَّلُون: registrant population"
          source: "المعجم الطبي الموحد (2009)"
      contradicts: []
      expands: []
    - lemma: "مُقَيَّد"
      confirm:
        - text: "المُقَيَّد: الموضع الذى تُقَيَّد فيه الدابَّة وتُخَلَّى"
          source: "المعجم الوسيط"
      contradicts: []
      expands:
        - text: "وتستخدم إدارياً بمعنى المسجل والمثبت في القيود (مثل: مقيد في السجل الانتخابي)."
          source: "الاستعمال المعاصر"
          addition: "استعمال معاصر للدلالة على الشخص المدرج اسمه في السجلات الرسمية."
    - lemma: "مُدْرَج"
      confirm: []
      contradicts: []
      expands: []
      evidence_status: "no_material_found"
    - lemma: "مُكْتَتِب"
      confirm:
        - text: "مكتتب: subscriber / applicant"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "مكتتب تستخدم أكثر في السياق المالي للاكتتاب في الأسهم أو الاشتراك في خدمات، ولا ترادف تماماً مسجل."
          source: "الاستعمال المعاصر"
          conflict: "تخصيص دلالي مالي وتجاري."
      expands: []

stage3_analysis:
  per_lemma:
    - lemma: "مُسَجَّل"
      decision: confirmed
      decision_reason: "اللمة دقيقة وفصيحة، وتتطابق دلالياً مع المفهوم (الشخص المدرج في سجل رسمي)، وتدعمها المعاجم المعاصرة حيث تفيد معنى التوثيق والتثبيت."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسَجَّل"
    - lemma: "مُقَيَّد"
      source: stage1
      decision: confirmed
      decision_reason: "اللمة تستخدم كمرادف فصيح وشائع لـ (مسجل) في السياقات الإدارية والقانونية للدلالة على من أدرج اسمه في قيد أو سجل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُقَيَّد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مُدْرَج"
      source: stage1
      decision: removed
      decision_reason: "الإدراج عام وقد يكون للأشياء في القوائم ولا يخص بالضرورة الشخص الذي يكتسب حقوقاً من تسجيله."
    - lemma: "مُكْتَتِب"
      source: stage1
      decision: removed
      decision_reason: "الاكتتاب يكون عادة في الأسهم أو المجلات والخدمات، ولا يتطابق تماماً مع مفهوم التسجيل العام في السجلات (registrant)."

stage4_content:
  definition:
    current: "شخص مسجل رسمياً (مع آخرين) في سجل (ويحصل على حقوق معينة بذلك)"
    assessment:
      decision: revise
      reason: "الصياغة الحالية تبدو كترجمة حرفية، ويمكن تحسينها لتكون أسبك بأسلوب معجمي عربي رصين."
    authored:
      - type: terminological
        text: "شخصٌ أُثبت اسمه رسمياً في سجلٍّ خاص، ممّا يُكسبه حقوقاً أو التزاماتٍ مُعيَّنة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخصٌ أُثبت اسمه رسمياً في سجلٍّ خاص، ممّا يُكسبه حقوقاً أو التزاماتٍ مُعيَّنة."
  examples:
    per_lemma:
      - lemma: "مُسَجَّل"
        examples:
          - text: "يحقُّ لكلِّ مُسَجَّلٍ في اللوائح الانتخابية الإدلاء بصوته."
            type: usage
      - lemma: "مُقَيَّد"
        examples:
          - text: "يجب على كلِّ مُقَيَّدٍ في سِجِلِّ النقابة تسديد الرسوم السنوية بانتظام."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يحقُّ لكلِّ مُسَجَّلٍ في اللوائح الانتخابية الإدلاء بصوته."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يجب على كلِّ مُقَيَّدٍ في سِجِلِّ النقابة تسديد الرسوم السنوية بانتظام."

stage5_enrichment:
  per_entry:
    - lemma: "مُسَجَّل"
      entry_id: "{auto}"
      root: "سجل"
      maqayis_quote: "«السِّينُ وَالْجِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى انْصِبَابِ شَيْءٍ بَعْدَ امْتِلَائِهِ... فَأَمَّا السِّجِلُّ فَمِنَ السَّجْلِ وَالْمُسَاجَلَةِ، وَذَلِكَ أَنَّهُ كِتَابٌ يَجْمَعُ كُتُبًا وَمَعَانِيَ.»"
    - lemma: "مُقَيَّد"
      entry_id: "{auto}"
      root: "قيد"
      maqayis_quote: "«الْقَافُ وَالْيَاءُ وَالدَّالُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الْقَيْدُ، وَهُوَ مَعْرُوفٌ، ثُمَّ يُسْتَعَارُ فِي كُلِّ شَيْءٍ يُحْبَسُ.»"
  per_sense:
    - lemma: "مُسَجَّل"
      sense_id: "{auto}"
      nuance: "تُستخدم للإشارة إلى من تم توثيق بياناته في السجلات الرسمية بشكل عام."
      mwe: false
    - lemma: "مُقَيَّد"
      sense_id: "{auto}"
      nuance: "تُستخدم غالباً في السياقات الإدارية للإشارة إلى من تم إدراج اسمه في قيد أو كشف."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"سجل","maqayis":"«السِّينُ وَالْجِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى انْصِبَابِ شَيْءٍ بَعْدَ امْتِلَائِهِ... فَأَمَّا السِّجِلُّ فَمِنَ السَّجْلِ وَالْمُسَاجَلَةِ، وَذَلِكَ أَنَّهُ كِتَابٌ يَجْمَعُ كُتُبًا وَمَعَانِيَ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قيد","maqayis":"«الْقَافُ وَالْيَاءُ وَالدَّالُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الْقَيْدُ، وَهُوَ مَعْرُوفٌ، ثُمَّ يُسْتَعَارُ فِي كُلِّ شَيْءٍ يُحْبَسُ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُستخدم للإشارة إلى من تم توثيق بياناته في السجلات الرسمية بشكل عام.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُستخدم غالباً في السياقات الإدارية للإشارة إلى من تم إدراج اسمه في قيد أو كشف.","mwe":false}'
