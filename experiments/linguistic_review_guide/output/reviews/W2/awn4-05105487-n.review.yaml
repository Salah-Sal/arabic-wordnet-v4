stage3_analysis:
  per_lemma:

    - lemma: "تطرف"
      decision: confirmed
      decision_reason: >-
        رغم أن دلالته المعاصرة انزاحت نحو التطرف الأيديولوجي، يبقى الجذر
        اللغوي «تَطَرَّفَ في كذا: جاوَز حدَّ الاعتدال» شاهداً على صلاحيته
        للمعنى المجرد. هو مصطلح مستعمل واسع الانتشار ولا يُمكن إغفاله في
        المجموعة. يُحتفَظ به مع إضافة التشكيل وتوثيق الفرق الدلالي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُستعمل «تَطَرُّف» أساساً في سياق الآراء والمواقف والأيديولوجيات
        (تطرف ديني، سياسي، فكري)؛ يُركّز على بُعد الانحراف عن التوسط في
        الموقف والرأي أكثر من مجرد الشدة في الدرجة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَطَرُّف"

    - lemma: "شدة مفرطة"
      decision: removed
      decision_reason: >-
        عبارة وصفية حرة تفشل اختبار السكّ: يمكن إبدال «شدة» بـ«حدة» أو
        «قوة» ولا تزال وصفاً صحيحاً، مما يدل على أنها ليست وحدة معجمية
        ثابتة. لا وجود لها في المعاجم كمدخل مستقل. الحذف يُفسح المجال
        للمصطلحات المسكوكة الأدق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "إِفْرَاطِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        غير موثقة في أي مصدر معجمي. رغم أن المصدر الصناعي «إفراطية» مقيس
        اشتقاقياً، إلا أن المصطلح لم يُسكَّ بعد. «إِفْرَاط» نفسه موثق
        ومستعمل بديلاً أدق، ويُضاف في مراجعة مستقلة إذا دعت الحاجة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "غُلُوٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >-
        موثق بأدلة كلاسيكية متعددة بمعنى «تجاوز الحد». ابن فارس يُرجعه إلى
        «ارتفاع ومجاوزة قدر» — وهو الجنس الدلالي الصحيح للمجموعة. الوزن
        «فُعُول» مناسب للمصدر الدال على الصفة. غير مثقَل بالدلالة
        الأيديولوجية، فهو أعم دلالةً من «تطرف».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُستعمل «غُلُوٌّ» للتعبير عن تجاوز الحد في أي ميدان (غلوّ في الدين،
        في السعر، في الفكر، في الحكم)؛ يُركّز على بُعد الإفراط في الدرجة
        والكمية بمعزل عن نوع المجال
      actions:
        - command: create_entry
          params:
            lemma: "غُلُوٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05105487-n"

    - lemma: "مُجَاوَزَة"
      source: stage1
      decision: removed
      decision_reason: >-
        مصدر الفعل «جاوَز» يدل على الحدث (عملية التجاوز) لا على الصفة
        الكامنة في الشيء. الوزن «مُفَاعَلَة» مناسب للمصادر الفعلية لا
        للصفات الثابتة المجردة التي تقتضيها المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَشَدُّدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        غير موثقة في المعاجم. تدل على صفة الصرامة المُفرِطة في الالتزام
        بالمبادئ، وهي أضيق دلالةً من المطلوب (extremeness في أي سياق).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


