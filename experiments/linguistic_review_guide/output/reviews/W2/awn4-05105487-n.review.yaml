# ═══════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-05105487-n  |  ILI: i63787
# المراجع: pipeline-v2 | التاريخ: 2026-03-17
# ═══════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تطرف» مكتوبة بلا تشكيل؛ يجب ضبطها «تَطَرُّف»"
      - "اللمّة «شدة مفرطة» عبارة وصفية حرة لا مصطلح مسكوك؛ يجوز إبدال «شدة» بـ«حدة» أو «قوة» وبقيت وصفاً صالحاً، وهذا يُفشلها في اختبار السكّ"
      - "التعريف الحالي دائري: يستخدم «متطرفاً» في تعريف مجموعة تضم «تطرف» ذاتها"
      - "دلالة «تطرف» في العربية المعاصرة تضيّقت نحو التطرف الأيديولوجي/السياسي، فلا تغطّي المعنى العام «صفة كون الشيء بالغ الشدة» المقصود هنا"
    observations: >-
      المجموعة تُمثّل المفهوم المجرد «extremeness» أي الخاصية الكامنة في الشيء
      التي تجعله بالغاً أقصى درجات الشدة أو بعيداً عن التوسط. المفهوم عربي
      التجذّر ويُعبَّر عنه أصلاً بجذور (طرف، غلا، فرط)، غير أن اللمات الموجودة
      تحتاج مراجعة: الأولى دون تشكيل، والثانية عبارة حرة. ويُقترح استحضار «غُلُوّ»
      من التراث لأنه الأدق دلالةً في التعبير عن تجاوز الحد في أي ميدان.

  blind_candidates:
    - lemma: "إِفْرَاطِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي بزيادة ياء النسب والتاء على «إِفْرَاط» (جذر: فرط)؛ يدل
        على صفة التجاوز للحد المعقول من جانب الزيادة. الوزن «فِعْلَالِيَّة»
        منتج في العربية الحديثة لتحويل المصادر إلى مفاهيم مجردة.
    - lemma: "غُلُوٌّ"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل «غَلَا يَغْلُو» (جذر: غلو) على وزن «فُعُول»؛ أصله
        الارتفاع ومجاوزة القدر، واستُعمل في الشريعة والأدب للتعبير عن
        تجاوز الحد في أي شأن. وظيفته الدلالية أعمّ من «تطرف» المُثقَل
        بالدلالة الأيديولوجية.
    - lemma: "مُجَاوَزَة"
      generation_method: ishtiqaq
      justification: >-
        مصدر «جَاوَزَ» (جذر: جوز) على وزن «مُفَاعَلَة»؛ يدل على صفة تخطّي
        الحد والقدر. يصلح للتعبير عن خاصية الشيء في كونه متجاوزاً للمعقول.
    - lemma: "تَشَدُّدِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من «تَشَدُّد» (جذر: شدد)، يدل على صفة الصرامة البالغة
        والتحجّر في الموقف. يُميّز بُعد الصلابة والإصرار في صفة التطرف.


# ──────────────────────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تطرف"
      confirm:
        - text: >-
            «(تطرف) اتى الطّرف ... وَفِي كَذَا جَاوز حد الِاعْتِدَال
            وَلم يتوسط»
          source: "المعجم الوسيط (hawramani)"
        - text: >-
            «تطرَّف في كذا: جاوَز حدَّ الاعتدال ولم يتوسَّط»
          source: "المعجم الوسيط (OCR، مجمع اللغة العربية)"
      contradicts:
        - text: >-
            «التَّطَرُّفُ: المغالاةُ في اعْتِناق أفكار دينيةٍ أو مذهبيةٍ
            أَو سياسيَّةِ, قد يصل التَّحَيُّزُ لها والدِّفاع عنها إلى
            الاتّجاه نحو العُنْفِ بشكلٍ فرديٍّ أو جماعيّ مَنَظَّم»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >-
            التعريف يقصر الدلالة على التطرف الأيديولوجي الديني والسياسي، في
            حين يراد بالمجموعة الصفةُ المجردة «extremeness» الشاملة لأي ميدان
        - text: "«تَطَرُّف» — translation_en: extremism — domain: Law"
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM)"
          conflict: >-
            الترجمة الإنجليزية «extremism» تُثبّت الدلالة القانونية-السياسية،
            لا الدلالة المجردة «extremeness» المقصودة

    - lemma: "شدة مفرطة"
      evidence_status: "no_material_found"

    - lemma: "إِفْرَاطِيَّة"
      evidence_status: "no_material_found"

    - lemma: "غُلُوٌّ"
      confirm:
        - text: >-
            «الغلو: تجاوز الحد. والغلوة: الغاية وهي رمية سهم أبعد ما يمكن»
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: >-
            «غَلَا الرَّجُلُ فِي الْأَمْرِ غُلُوًّا، إِذَا جَاوَزَ حَدَّهُ»
          source: "مقاييس اللغة لابن فارس (entry 987960)"
        - text: >-
            «غلا في الأمر، أي: جاوزوا حدّه، كغلوّ اليهود في دينها»
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: >-
            «الغلوّ: [في الانكليزية] Exaggeration، excess ... هو نوع من المبالغة»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: >-
            «(غَلَوَيَ) الْغَيْنُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ
            صَحِيحٌ فِي الْأَمْرِ يَدُلُّ عَلَى ارْتِفَاعٍ وَمُجَاوَزَةِ قَدْرٍ»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            ابن فارس يُرجع الجذر إلى «الارتفاع ومجاوزة القدر»؛ وهذا يُثبّت
            أن الغلوّ يدل على الصفة المجردة لتجاوز الحد في أي مجال

    - lemma: "مُجَاوَزَة"
      confirm:
        - text: "«تجاوز» — translation_en: excess — domain: Commerce and Accounting"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM)"
      contradicts:
        - text: "«مجاوزة» بمعنى الفعل (crossing/exceeding) لا الصفة المجردة"
          source: "استنتاج صرفي"
          conflict: >-
            «مُجَاوَزَة» مصدر يدل على الحدث (فعل التجاوز) لا على الصفة
            الكامنة في الشيء (quality of being extreme)؛ الوزن «مُفَاعَلَة»
            غير ملائم للدلالة على الصفة الثابتة

    - lemma: "تَشَدُّدِيَّة"
      evidence_status: "no_material_found"


