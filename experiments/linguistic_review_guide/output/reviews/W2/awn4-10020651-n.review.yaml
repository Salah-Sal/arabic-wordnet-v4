stage1_review:
  assessment:
    concerns:
      - "التعريف يميل للوصف المباشر (شخص يسلم)، والأفضل صياغته بصورة أكثر معجمية."
      - "المصطلحات الحالية (مُسَلِّم، مُوَصِّل) دقيقة، لكن من المفيد إضافة (سَاعٍ) أو (نَاقِل)."
    observations: "المجموعة الترادفية تمثل الشخص الذي يقوم بنقل وتسليم الأشياء أو الأموال. الكلمات (مُسَلِّم) و(مُوَصِّل) مستخدمة ومعبرة عن هذا المعنى بوضوح كاسمي فاعل. يمكن توسيع المجموعة لتشمل مفردات أخرى مثل (ساعٍ) و(ناقل)."
  blind_candidates:
    - lemma: "مُوَصِّل"
      generation_method: ishtiqaq
      justification: "مشتق من (وصّل)، وهو الذي يُوصل البضائع والرسائل إلى أصحابها، وهو شائع معاصراً."
    - lemma: "نَاقِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (نقل)، يعبر عن تحويل الشيء من مكان لآخر."
    - lemma: "سَاعٍ"
      generation_method: majaz
      justification: "استخدام تراثي ومجازي لمن يسعى في نقل الرسائل أو البضائع أو جمع الصدقات."
    - lemma: "عَامِلُ تَوْصِيل"
      generation_method: tarkib
      justification: "مركب إضافي شديد الشيوع في الاستخدام المعاصر للدلالة على المهنة."

stage2_evidence:
  per_lemma:
    - lemma: "مُسَلِّم"
      confirm:
        - text: "ينقل؛ يسلِّم؛ يُوْصِل؛ يوزِّع Postmen deliver letters"
          source: "المورد الحديث (2008)"
    - lemma: "مُوَصِّل"
      confirm:
        - text: "ينقل؛ يسلِّم؛ يُوْصِل؛ يوزِّع Postmen deliver letters"
          source: "المورد الحديث (2008)"
    - lemma: "نَاقِل"
      confirm:
        - text: "ينقل [من مكان إلى آخر]."
          source: "المورد الحديث (2008)"
    - lemma: "سَاعٍ"
      confirm:
        - text: "عامل الصدقات موزع البريد والمخاطبات ونحوها"
          source: "المعجم الوسيط"
    - lemma: "عَامِلُ تَوْصِيل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُسَلِّم"
      decision: confirmed
      decision_reason: "اسم فاعل من الفعل سلَّم، وهو يؤدي المعنى الدقيق لتسليم الأموال أو البضائع للمستلم، وتؤيده ترجمات الفعل deliver في المعاجم ثنائية اللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسَلِّم"
    - lemma: "مُوَصِّل"
      decision: confirmed
      decision_reason: "اسم فاعل من وصّل، يعبر عن إيصال البضائع لغايتها، وهو شائع جداً في الاستخدام المعاصر كمهنة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَصِّل"
    - lemma: "نَاقِل"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير دقيق وموجود في المعاجم للدلالة على من يقوم بنقل الأشياء من مكان لآخر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "نَاقِل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "سَاعٍ"
      source: stage1
      decision: confirmed
      decision_reason: "تدل على موزع البريد والبضائع كما ورد في المعاجم، ولها جذور تراثية فصيحة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "سَاعٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "عَامِلُ تَوْصِيل"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من شيوعه، إلا أنه تعبير تركيبي وصفي و(موصل) أو (ناقل) تغني عنه ككلمة مفردة في الشبكة الدلالية، ولم توجد له أدلة معجمية كمركب مسكوك."

stage4_content:
  definition:
    current: "شخص يسلم أو ينقل أموالاً أو بضائع"
    assessment:
      decision: revise
      reason: "الصياغة الحالية وصفية أقرب لترجمة حرفية، الأفضل صياغتها بطريقة أكثر معجمية وأسلوب أمتن."
    authored:
      - type: linguistic
        text: "مَنْ يَتَوَلَّى نَقْلَ الأَمْوَالِ أَوِ البَضَائِعِ وَتَسْلِيمَهَا إِلَى المُسْتَلِمِينَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ يَتَوَلَّى نَقْلَ الأَمْوَالِ أَوِ البَضَائِعِ وَتَسْلِيمَهَا إِلَى المُسْتَلِمِينَ."
  examples:
    per_lemma:
      - lemma: "مُسَلِّم"
        examples:
          - text: "أَعْطَى المُسَلِّمُ الطَّرْدَ لِصَاحِبِهِ بِيَدِهِ."
            type: usage
      - lemma: "مُوَصِّل"
        examples:
          - text: "يَعْمَلُ الشَّابُّ مُوَصِّلًا لِلْبَضَائِعِ فِي شَرِكَةٍ مَحَلِّيَّةٍ."
            type: usage
      - lemma: "نَاقِل"
        examples:
          - text: "تَعَاقَدْنَا مَعَ نَاقِلٍ مُحْتَرِفٍ لِنَقْلِ الأَثَاثِ بَيْنَ المُدُنِ."
            type: usage
      - lemma: "سَاعٍ"
        examples:
          - text: "أَوْصَلَ السَّاعِي رِسَالَةً هَامَّةً إِلَى المَكْتَبِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يَعْمَلُ الشَّابُّ مُوَصِّلًا لِلْبَضَائِعِ فِي شَرِكَةٍ مَحَلِّيَّةٍ."

stage5_enrichment:
  per_entry:
    - lemma: "مُسَلِّم"
      entry_id: "{auto}"
      root: "سلم"
      maqayis_quote: "«السِّينُ وَاللَّامُ وَالْمِيمُ مُعْظَمُ بَابِهِ مِنَ الصِّحَّةِ وَالْعَافِيَةِ... وَمِنَ الْبَابِ أَيْضًا الْإِسْلَامُ، وَهُوَ الِانْقِيَادُ»"
    - lemma: "مُوَصِّل"
      entry_id: "{auto}"
      root: "وصل"
      maqayis_quote: "«الْوَاوُ وَالصَّادُ وَاللَّامُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ضَمِّ شَيْءٍ إِلَى شَيْءٍ حَتَّى يَعْلَقَهُ.»"
    - lemma: "نَاقِل"
      entry_id: "{auto}"
      root: "نقل"
      maqayis_quote: "«النُّونُ وَالْقَافُ وَاللَّامُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَحْوِيلِ شَيْءٍ مِنْ مَكَانٍ إِلَى مَكَانٍ»"
    - lemma: "سَاعٍ"
