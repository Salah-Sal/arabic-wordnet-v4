stage1_review:
  assessment:
    concerns:
      - "إدراج كلمة 'أحادية' في هذه المجموعة غير دقيق، فهي تعني الفردانية أو المذهب الأحادي (Monism) ولا علاقة لها بحب الذات أو الأنانية."
      - "كلمة 'غرور' تعني الانخداع بالشيء والاعتداد الزائف بالنفس (Vanity)، ولا تعني بالضرورة السعي للمصلحة الخاصة أو الأنانية، مما يستوجب إزالتها."
      - "التعريف الحالي يبدو ترجمة حرفية للتعريف الإنجليزي ويحتاج إلى صياغة معجمية عربية تعبر عن الاستئثار والنزعة نحو تغليب مصلحة النفس."
    observations: "المفهوم هنا يدور حول (Egoism) و(Self-interest). في التراث العربي، الكلمة الأدق هي 'الأثرة' (وهي عكس الإيثار). وفي الاستخدام الحديث، تشيع مصطلحات 'أنانية' كصفة ومذهب، و'مصلحة شخصية' و'حب الذات' كتعبيرات أدق للوصف الموضوعي للاعتناء بالذات والمنافع."
  blind_candidates:
    - lemma: "أَنَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي مشتق من الضمير 'أنا'، وهو اللفظ الأشهر والأكثر تداولاً للدلالة على المفهوم في علم النفس والفلسفة والمجتمع."
    - lemma: "أَثَرَة"
      generation_method: ishtiqaq
      justification: "كلمة فصيحة من الجذر (أثر)، وتدل معجمياً على الاستئثار بالشيء وتفضيل النفس على الغير، وهي تقابل كلمة 'الإيثار'."
    - lemma: "مَصْلَحَة شَخْصِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يعبر بدقة عن (self-interest) ويشيع استخدامه في السياقات الاجتماعية والسياسية للتعبير عن المنفعة الذاتية الفردية."
    - lemma: "أَنَوِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي آخر من 'أنا'، يُستخدم أحياناً في السياقات الفلسفية للتعبير عن مذهب التمركز حول الذات."

stage2_evidence:
  per_lemma:
    - lemma: "أَحَادِيَّة"
      contradicts:
        - text: "أحادية - translation_en: monism - translation_fr: monisme"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "الكلمة تعني المذهب الأحادي أو الفردانية، ولا تتعلق بالاهتمام بالمصلحة الخاصة."
    - lemma: "حُبّ الذَّات"
      confirm:
        - text: "الأنانيّة: حبّ الذات"
          source: "المورد الحديث (2008)"
        - text: "إيثار: حب الغير، آثر غيره عليه: عكسه :' الأثرة' التي تعني حب الذات"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
    - lemma: "غُرُور"
      contradicts:
        - text: "الغُرُور: كل ما غَرَّ الإِنسان من مال, أو جاه, أو شهوة, أو إنسان, أو شيطان"
          source: "المعجم الوسيط"
          conflict: "الغرور يعني الانخداع وسكون النفس إلى الهوى، وليس الاهتمام بالمصالح والرفاهية التي تعبر عن الأنانية وتفضيل النفس المباشر."
    - lemma: "أَنَانِيَّة"
      confirm:
        - text: "الأنانية: النَّزْعة التى تعتمد على حبِّ النَّفس وتقديم المصلحة الخاصة على العامة , فالنَّفْع الخاص هو الدافع الأساسي وراء كل أخلاق وسلوك"
          source: "المعجم الكبير"
        - text: "الأنانية - الأثرة: البحث عن المنافع الشخصية على حساب الآخرين."
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
    - lemma: "أَثَرَة"
      confirm:
        - text: "الأثرة: تفضيل الإنسان نفسه على غيره ... و(فى الفلسفة): حب النفس. ويطلق أخلاقياً على من لا يهدف إلا إلى نفعه الخاص, ويقابل الإيثار"
          source: "المعجم الوسيط"
        - text: "الأثرة: الاستئثار. البقية."
          source: "المعجم الكبير"
    - lemma: "مَصْلَحَة شَخْصِيَّة"
      confirm:
        - text: "مصلحة شخصية - translation_en: self-interest"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "المصلحة الشخصية - الأَثَرة: الحِرص على المصلحة الشخصيّة [وبخاصة من غير اعتبار لمصالح الآخرين]."
          source: "المورد الحديث (2008)"
    - lemma: "أَنَوِيَّة"
      expands:
        - text: "الأَنَوِيّة: المذهب القائل بأن على كلّ فرد أن يجعل من مصلحته الذاتية أساسًا لسلوكه"
          source: "المورد الحديث (2008)"
          addition: "تشير أكثر إلى المذهب الفلسفي وتعد مرادفاً أقل شيوعاً من كلمة أنانية."

stage3_analysis:
  per_lemma:
    - lemma: "أَحَادِيَّة"
      decision: removed
      decision_reason: "الكلمة تعني المذهب الفلسفي (Monism) أو الصفة المتعلقة بالشيء الفردي، ولا تُستخدم للتعبير عن حب الذات أو الاهتمام بالمصلحة الخاصة."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
            
    - lemma: "حُبّ الذَّات"
      decision: confirmed
      decision_reason: "مركب إضافي مسكوك وشائع الاستخدام في علم النفس والفلسفة للتعبير عن الاهتمام بالنفس وتقديم مصلحتها (self-love / self-interest)، ويتطابق تماماً مع دلالة المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُبّ الذَّات"
            
    - lemma: "غُرُور"
      decision: removed
      decision_reason: "الغرور في العربية هو الانخداع بالباطل وسكون النفس إلى ما يوافق الهوى (vanity/conceit)، ولا يعني بالضرورة 'الاهتمام بمصالح المرء' (self-interest)."
      evidence_assessment:
        case: contradicts_only
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "أَنَانِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي من الضمير 'أنا'، وهو المصطلح الأشهر والأدق في الفلسفة وعلم النفس المعاصر للدلالة على (Egoism)، ويعني حب النفس وتفضيل مصلحتها على غيرها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَنَانِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أَثَرَة"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة عربية تراثية فصيحة تعني استئثار المرء بالشيء وتفضيله لنفسه على الآخرين، وهي المقابل العربي الأصيل لـ (Egoism) والضد المباشر لـ 'الإيثار'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَثَرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَصْلَحَة شَخْصِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير تركيبي مسكوك شائع في السياقات الاقتصادية والاجتماعية للتعبير عن (self-interest)، ويطابق تعريف المجموعة بشكل دقيق ومباشر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "مَصْلَحَة شَخْصِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أَنَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح فلسفي بحت يميل للدلالة على المذهب الفلسفي أكثر من كونه نزعة شخصية عامة، وكلمة 'أنانية' أوفى بالغرض وأكثر شيوعاً."

stage4_content:
  definition:
    current: "الاهتمام بمصالح المرء ورفاهيته الخاصة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو كترجمة حرفية للتعريف الإنجليزي ويميل للركاكة، ويمكن تحسينه معجمياً ليعبر بوضوح عن نزعة الاستئثار والاهتمام الشديد بالمنفعة الخاصة."
    authored:
      - type: terminological
        text: "نزعة تدفع المرء إلى الحرص الشديد على تحقيق منافعه الخاصة، وتقديم مصلحته ورفاهيته على مصالح الآخرين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نزعة تدفع المرء إلى الحرص الشديد على تحقيق منافعه الخاصة، وتقديم مصلحته ورفاهيته على مصالح الآخرين."

  examples:
    per_lemma:
      - lemma: "أَثَرَة"
        examples:
          - text: "سَتَرَوْنَ بَعْدِي أَثَرَةً وَأُمُورًا تُنْكِرُونَهَا."
            type: hadith
            source: "صحيح البخاري"
      - lemma: "أَنَانِيَّة"
        examples:
          - text: "تتسبب الأنانية في تدمير روح الفريق والعمل الجماعي."
            type: usage
      - lemma: "مَصْلَحَة شَخْصِيَّة"
        examples:
          - text: "تغليب المصلحة الشخصية على المصلحة العامة من أبرز أسباب الفساد."
            type: usage
      - lemma: "حُبّ الذَّات"
        examples:
          - text: "من الطبيعي أن يدفع حب الذات الإنسان إلى السعي نحو توفير حياة أفضل لنفسه ولأسرته."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تغليب المصلحة الشخصية على المصلحة العامة من أبرز أسباب الفساد."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "سَتَرَوْنَ بَعْدِي أَثَرَةً وَأُمُورًا تُنْكِرُونَهَا."

