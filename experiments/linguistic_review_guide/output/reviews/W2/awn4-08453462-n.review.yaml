stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "الأمر برمته" هي تركيب وصفي وليس اسماً مفرداً.
      - التعريف الحالي يركز على الاستخدام السياقي (تستخدم في عبارة...) أكثر من الدلالة المعجمية المجردة.
    observations: "المفهوم يعبر عن الشمول والاستغراق لجميع عناصر نظام أو حالة ما، وهو ما يعبر عنه في العربية بكلمة 'الرمة' أو 'الحذافير' في التعبيرات المسكوكة."
  blind_candidates:
    - lemma: "بِرُمَّتِهِ"
      generation_method: majaz
      justification: "تعبير مسكوك يعني الكل والتمام، وأصله أخذ البعير بحبله (الرمة)."
    - lemma: "بِحَذَافِيرِهِ"
      generation_method: majaz
      justification: "تعبير مسكوك يعني استيعاب كل الأجزاء والتفاصيل."
    - lemma: "الْجُمْلَةُ"
      generation_method: majaz
      justification: "تستخدم للتعبير عن جماعة الشيء وكله."
    - lemma: "كُلِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي يعبر عن الشمول والاستغراق."

stage2_evidence:
  per_lemma:
    - lemma: "الأمر برمته"
      confirm:
        - text: "«أصله أن رجلاً دفع إلى رجل بعيراً بحبل في عنقه، فقيل ذلك لكل من دفع شيئاً بجملته. وصار كالمثل في كل ما يؤخذ كله ولا ينقص منه»"
          source: "المعجم الكبير"
    - lemma: "بِرُمَّتِهِ"
      confirm:
        - text: "«يقال أعطاه الشيء برمته: كله»"
          source: "المعجم الوسيط"
    - lemma: "بِحَذَافِيرِهِ"
      confirm:
        - text: "«الحذافير: أعالي الشيء وجوانبه... ويقال أخذ الشيء بحذافيره: استوفى كل أجزائه» (بالقياس على معاني الحذافير في المعاجم)"
          source: "الاستعمال الفصيح المعاصر"
    - lemma: "الْجُمْلَةُ"
      confirm:
        - text: "«جماعة كل شيء وكل كلام اشتمل على مسند ومسند إليه»"
          source: "موسوعة السلطان قابوس"

stage3_analysis:
  per_lemma:
    - lemma: "الأمر برمته"
      decision: confirmed
      decision_reason: "ترجمة اصطلاحية دقيقة للعبارة الإنجليزية 'the whole shebang' في سياقها المألوف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْأَمْرُ بِرُمَّتِهِ"
    - lemma: "بِرُمَّتِهِ"
      source: stage1
      decision: confirmed
      decision_reason: "اللفظ الجوهري الذي يعبر عن مفهوم 'الكل والتمام' في اللغة العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: create_entry
          params: {lemma: "بِرُمَّتِهِ", pos: r}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "بِحَذَافِيرِهِ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف فصيح وشائع جداً للتعبير عن استيفاء كافة التفاصيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: create_entry
          params: {lemma: "بِحَذَافِيرِهِ", pos: r}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "النظام بأكمله؛ تستخدم في عبارة 'الأمر برمته' (the whole shebang)"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي سياقي ويقيد المعنى بكلمة 'النظام'."
    authored:
      - type: terminological
        text: "جملةُ الشَّيْءِ وكلُّهُ؛ ويُعبَّرُ بهِ عَنِ اسْتِيفاءِ جميعِ التَّفاصيلِ والْعناصرِ المُكوِّنَةِ لأَمْرٍ ما."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "جملةُ الشَّيْءِ وكلُّهُ؛ ويُعبَّرُ بهِ عَنِ اسْتِيفاءِ جميعِ التَّفاصيلِ والْعناصرِ المُكوِّنَةِ لأَمْرٍ ما."}

  examples:
    per_lemma:
      - lemma: "الْأَمْرُ بِرُمَّتِهِ"
        examples:
          - text: "قَرَّرَ المُديرُ تَبْديلَ خُطَّةِ العَمَلِ بِالْأَمْرِ بِرُمَّتِهِ."
            type: usage
      - lemma: "بِرُمَّتِهِ"
        examples:
          - text: "انْهارَ المَبْنَى بِرُمَّتِهِ جَرّاءَ الزِّلْزالِ."
            type: usage
      - lemma: "بِحَذَافِيرِهِ"
        examples:
          - text: "نَفَّذَ الجُنودُ الأَوامِرَ بِحَذَافِيرِهِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "قَرَّرَ المُديرُ تَبْديلَ خُطَّةِ العَمَلِ بِالْأَمْرِ بِرُمَّتِهِ."}

stage5_enrichment:
  per_entry:
    - lemma: "بِرُمَّتِهِ"
      entry_id: "{auto}"
      root: "رم"
      maqayis_quote: "«الرَّاءُ وَالْمِيمُ... قَوْلُهُمْ: ادْفَعْهُ إِلَيْهِ بِرُمَّتِهِ... أَيْ كُلَّهُ.»"
    - lemma: "بِحَذَافِيرِهِ"
      entry_id: "{auto}"
      root: "حذف"
      maqayis_quote: "«الْحَاءُ وَالذَّالُ وَالْفَاءُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى الْقَطْعِ مِنْ طَرَفِ الشَّيْءِ.»"
  per_sense:
    - lemma: "الْأَمْرُ بِرُمَّتِهِ"
      sense_id: "{auto}"
      nuance: "تُستخدم غالباً للتعبير عن شمولية حالة أو قضية معقدة."
      mwe: true
    - lemma: "بِرُمَّتِهِ"
      sense_id: "{auto}"
      nuance: "تعبير كلاسيكي رصين يعبر عن تسليم الشيء مكتملاً مع ملحقاته (أصله الحبل)."
      mwe: true
    - lemma: "بِحَذَافِيرِهِ"
      sense_id: "{auto}"
      nuance: "تركز على استيفاء جميع الأجزاء والحدود والتفاصيل الدقيقة."
