      decision: confirmed
      decision_reason: "رغم أن العبارة تفشل اختبار السكّ الصارم، إلا أنها تمثّل الصياغة المعجمية المعتمدة في المصطلحية العربية الحديثة للدلالة على المفهوم في ظل انعدام مصطلح مفرد راسخ (حالة فجوة معجمية). وردت (أرض صالحة للزراعة) مقابلًا لـ(arable) في مصادر عربتيرم متعددة. تُبقَى مع تصحيح التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تُركّز على بُعد الأهلية الموضوعية (fitness/eligibility): حكمٌ خارجي بأن الأرض أهلٌ ومناسبة للزراعة — تقابل السؤال: هل هذه الأرض تستحق الزراعة وتصلح لها؟"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَلَاحِيَّةٌ لِلزِّرَاعَةِ"

    - lemma: "قابلية الزراعة"
      decision: confirmed
      decision_reason: "مركّب إضافي موثَّق ضمنيًا في المصطلحية العربية (أرض قابلة للزراعة = arable في الهندسة المدنية — عربتيرم). يُعبّر عن الاستعداد الذاتي للأرض لقبول الزرع بخلاف (صلاحية) التي تُشير إلى الحكم الخارجي. يحتاج تشكيلًا كاملًا."
      evidence_assessment:
