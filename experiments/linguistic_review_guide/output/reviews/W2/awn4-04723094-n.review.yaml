# مراجعة المجموعة الترادفية awn4-04723094-n
# arability — صلاحية الأرض للزراعة
# pipeline: AWN4 Review Pipeline v2 (5-Stage)
# date: 2026-03-17

stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين الموجودتين عبارتان وصفيتان حرّتان لا مصطلحان مسكوكان — تفشلان اختبار السكّ إذ يمكن إبدال (الزراعة) بـ(الحرث) أو (الاستزراع) مع بقاء الوصف صالحًا"
      - "غياب التشكيل الكامل عن كلتا اللمّتين الموجودتين"
      - "استخدام (جودة) في التعريف العربي الحالي يوحي بالتفوّق النوعي (excellence) لا بمجرد الخاصية المحايدة (property) المقصودة"
      - "(صلاحية للزراعة) تستخدم حرف الجر (ل) بدلًا من الإضافة مما يجعلها شبه جملة لا مركبًا إضافيًا حقيقيًا"
    observations: "المفهوم (arability) يعاني فجوةً معجميةً في العربية — لا يوجد مصطلح مفرد راسخ له في المعجمية الكلاسيكية ولا في المعجمية التقنية الحديثة. تعبّر المصطلحية العربية عنه بصياغات وصفية متعددة (أرض صالحة للزراعة، أرض قابلة للزراعة، أرض حراثية). اللمّتان الموجودتان مقبولتان للدلالة على المفهوم في ظل هذا الشُّحّ المعجمي، لكنهما تحتاجان تشكيلًا. المرشّح (حِرَاثِيَّة) — المستخرج من جذر (حرث) على صيغة المصدر الصناعي — مدعومٌ بدليل مصطلحي مباشر إذ وردت (أرض حراثية) مقابلًا لـ(arable land) في مسرد الجغرافيا والتاريخ (عربتيرم)."

  blind_candidates:
    - lemma: "حِرَاثِيَّة"
      generation_method: ishtiqaq
      justification: "مشتقّ من جذر (ح-ر-ث) بإضافة ياء النسب والتاء (المصدر الصناعي) ليؤدّي معنى الصفة المجرّدة للأرض القابلة للحرث والزراعة، على غرار (زراعية، رعوية، صناعية). يفي باختبار الاشتقاقية ويتيح الوصل والتثنية والجمع (حراثيتان، حراثيات)."
    - lemma: "صَلَاحِيَّةٌ زِرَاعِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي (wasfi) من (صلاحية) بمعنى الأهلية و(زراعية) صفة نسبية، يُفيد أهلية الأرض الزراعية. غير أنه عرضةٌ لاختبار الاستبدال إذ يمكن تبديل (زراعية) بـ(حراثية) مع بقاء المعنى صالحًا."
    - lemma: "خُصُوبَة"
      generation_method: majaz
      justification: "لفظ عربي أصيل بمعنى ضد الجدب (خلاف المجدب)، يمكن توسيع دلالته مجازًا ليشمل صلاحية الأرض للزراعة، إذ الأرض الخصيبة هي بالضرورة أرض صالحة للحرث والزرع في أغلب الأحوال."
    - lemma: "قَابِلِيَّةُ الفِلَاحَة"
      generation_method: tarkib
      justification: "مركّب إضافي (idafi) من (قابلية) بمعنى الاستعداد الذاتي و(الفلاحة) بمعنى القيام بشؤون الأرض الزراعية من حرث وزرع وري — يُعبّر عن الطاقة الكامنة في الأرض لقبول الاستزراع."


stage2_evidence:
  per_lemma:
    - lemma: "صلاحية للزراعة"
      confirm:
        - text: "«الصَّلَاحِيَّة للعمل: حسن التهيُّؤ له»"
          source: "المعجم الوسيط"
      expands:
        - text: "«أرض صالحة للزراعة» — مقابل arable"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (عربتيرم)"
          addition: "يُثبّت التعبير التركيبي (أرض صالحة للزراعة) في المصطلحية العربية مقابلًا معتمدًا لـ(arable)"
        - text: "«أراضٍ صالحة للزراعة» — مقابل arable land"
          source: "المَكنَز الزراعي متعدد اللغات — AGROVOC (عربتيرم)"
          addition: "توثيق عبارة (صالحة للزراعة) في المعجمية الزراعية الدولية المعتمدة"
        - text: "«الاتِّساق في عملٍ ما... الصلاحية للعمل: حسن التهيُّؤ له... (في التربية وعلم النفس): قدرة طبيعية على اكتساب أنماط معينة من السلوك»"
          source: "المعجم الكبير"
          addition: "يُرسّخ معنى (الصلاحية) بوصفه استعدادًا واتساقًا مع متطلبات عمل ما، وهو ما ينطبق على صلاحية الأرض للزراعة"

    - lemma: "قابلية الزراعة"
      confirm:
        - text: "«القَابِلِيَّةُ: الاستعداد للقبول [مصدر صناعي]»"
          source: "المعجم الوسيط"
      expands:
        - text: "«أرض قابلة للزراعة» — مقابل arable"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (عربتيرم)"
          addition: "يُثبّت التعبير (أرض قابلة للزراعة) في المصطلحية الهندسية العربية مقابلًا لـ(arable)"
        - text: "«(القابلية) الاستعداد للقبول (مصدر صناعي)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          addition: "يُؤكد أن (قابلية) مصدر صناعي معترف به للدلالة على الاستعداد الذاتي"

    - lemma: "حِرَاثِيَّة"
      confirm:
        - text: "«أرض حراثية» — مقابل arable land"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (عربتيرم)"
      expands:
        - text: "«الحِرَاثَةُ: العَمَلُ في الأرض زَرْعًا كان أو غَرْسًا — حِرْفَةُ الحَرَّاثِ»"
          source: "المعجم الكبير"
          addition: "يُؤكد الجذر (حرث) في السياق الزراعي ارتباطه بالعمل في الأرض زرعًا وغرسًا لا بالحرث فحسب"
        - text: "«الْحَاءُ وَالرَّاءُ وَالثَّاءُ أَصْلَانِ مُتَفَاوِتَانِ: أَحَدُهُمَا الْجَمْعُ وَالْكَسْبُ، وَالْآخَرُ أَنْ يُهْزَلَ الشَّيْءُ. فَالْأَوَّلُ الْحَرْثُ، وَهُوَ الْكَسْبُ وَالْجَمْعُ... وَمِنْ هَذَا الْبَابِ حَرْثُ الزَّرْعِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يربط ابن فارس جذر (حرث) بمعنيَي الجمع والكسب والعمل الزراعي أصالةً في اللغة"
        - text: "«حراثة» — مقابل cultivation"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (عربتيرم)"
          addition: "يُثبّت (حراثة) مقابلًا لـ(cultivation) ما يُجوّز بناء (حراثية) منه على صيغة المصدر الصناعي"

    - lemma: "صَلَاحِيَّةٌ زِرَاعِيَّة"
      evidence_status: "no_material_found"

    - lemma: "خُصُوبَة"
      contradicts:
        - text: "«خصوبة» — مقابل fecundity / القدرة الإنجابية المحتملة والإنتاجية لكائن حي أو لمجموعة من السكان»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (عربتيرم)"
          conflict: "(خصوبة) يقابل fecundity/fertility (القدرة الإنجابية ووفرة الإنتاج البيولوجي) لا arability (صلاحية الأرض للحرث والزرع) — فارق دلالي جوهري لا تجيزه المصطلحية المعتمدة"
        - text: "«خصوبة» — مقابل fertility"
          source: "مسرد الجغرافيا والتاريخ (عربتيرم)"
          conflict: "التطابق المستمر مع (fertility) في مصادر متعددة يمنع توظيف (خصوبة) بديلًا عن (arability) دون التباس"
        - text: "«خُصُوبة — مثال: يهتمّ الفلاح بخُصُوبَة التربة — [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "السياق الاستعمالي المستقرّ (خصوبة التربة) يدور حول الإنتاجية والخِصب لا حول أهلية الأرض للحرث"

    - lemma: "قَابِلِيَّةُ الفِلَاحَة"
