      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مفرد يُعبّر عن الخاصية المجرّدة (abstractness of arability as a measurable quality): الحِرَاثِيَّة مقياسٌ علمي يُصنَّف ويُقاس، بخلاف صاحبتيه اللتين تصفان الأرض في سياق تقييمي أو وصفي مباشر"
      actions:
