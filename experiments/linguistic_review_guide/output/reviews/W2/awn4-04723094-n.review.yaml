      decision_reason: "لا أدلة مباشرة على هذا التعبير في المدوّنة المعجمية. يتداخل دلاليًا مع (قابلية الزراعة) الموجودة أصلًا دون تقديم فارق نوعي. الحذف تجنّبًا للازدواج المصطلحي."


