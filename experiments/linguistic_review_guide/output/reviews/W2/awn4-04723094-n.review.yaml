        mwe_type: idafi
      nuance_differentiation: "تُركّز على البُعد الاستعدادي الذاتي (intrinsic capacity/readiness): الطاقة الكامنة في الأرض نفسها لتقبّل الزرع — تقابل السؤال: ما مدى استعداد هذه الأرض ذاتيًا لتقبّل الزراعة؟"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ الزِّرَاعَةِ"

    - lemma: "حِرَاثِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مفرد مشتق اشتقاقًا صحيحًا من جذر (حرث) على صيغة المصدر الصناعي. مدعوم بدليل مصطلحي مباشر: (أرض حراثية = arable land) في مسرد الجغرافيا والتاريخ (عربتيرم). يتميز بكونه وحدة معجمية مفردة تؤدي المعنى المجرّد للمفهوم — وهو ما تعجز عنه العبارتان المركّبتان الموجودتان — ويُكمل الشبكة الدلالية للمجموعة بمصطلح يقبل الإسناد المباشر (حِرَاثِيَّةُ هذه الأرض عالية)."
