            synset_id: "{synset_id}"

    - lemma: "صَلَاحِيَّةٌ زِرَاعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "يفشل اختبار السكّ — يمكن إبدال (زراعية) بـ(حراثية) أو (فلاحية) مع بقاء الوصف صالحًا، مما يمنع تثبيته مصطلحًا معجميًا. لا أدلة تثبته في المدوّنة المعجمية. يتداخل دلاليًا مع اللمّتين الموجودتين دون إضافة فارق نوعي."

    - lemma: "خُصُوبَة"
      source: stage1
      decision: removed
      decision_reason: "تناقض جوهري: (خصوبة) مصطلح راسخ في المصطلحية العربية للدلالة على fertility/fecundity (الإنتاجية البيولوجية والخِصب)، وهو مغاير لـ(arability) التي تعني صلاحية الأرض للحرث. المجاز المقترح يصطدم بالاستخدام المستقرّ في مصادر عربتيرم المتعددة ويُفضي إلى الالتباس المصطلحي."

    - lemma: "قَابِلِيَّةُ الفِلَاحَة"
      source: stage1
