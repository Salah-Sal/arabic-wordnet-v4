          conflict: "المعنى الأول في المعجم الوسيط الحديث هو السهم الصغير للأطفال، لا المكانة الاجتماعية؛ مما يعني أن دلالة المكانة باتت أثرية وغير شائعة في الاستخدام المعاصر"
        - text: "«(الحظوة) ما لا ريش له من السهاء (ج) حظاء»"
          source: "المعجم الوسيط (هوارمني)"
