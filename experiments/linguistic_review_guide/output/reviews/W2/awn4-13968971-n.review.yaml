          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الجاه) المنزلة والقدر»"
          source: "المعجم الوسيط (هوارمني)"
        - text: "«القَدْرُ والمَنْزِلَةُ، مقلوبٌ عن وجه»"
          source: "المعجم الكبير"
        - text: "«جاه؛ مقام رفيع؛ مكانة سامية — rank»"
          source: "المورد الحديث (2008) — ترجمة rank"

    - lemma: "حُظْوَة"
      confirm:
