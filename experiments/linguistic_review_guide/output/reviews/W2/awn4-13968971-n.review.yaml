          source: "المعجم الكبير"
        - text: "«الرتبة والمرقبة وكل مقام شديد»"
          source: "المعجم الوسيط (هوارمني)"
        - text: "«مرتبة — status»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«مرتبة — rank»"
          source: "المعجم الطبي الموحد (2009)"
