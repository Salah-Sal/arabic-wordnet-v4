        - text: "«وضع — position»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«(1) الوضع الشرعي: وضع المرء أو الشيء في نظر القانون (2) منزلة؛ مرتبة (3) حالة؛ وضع — status»"
          source: "المورد الحديث (2008) — ترجمة status"
        - text: "«ذوي وضع اجتماعي واحد horizontal labor unions»"
          source: "المورد الحديث (2008) — ترجمة horizontal"
      contradicts:
        - text: "«(وَضَعَ) الواو والضاد والعين: أصل واحد يدل على الخفض للشيء وحطه»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل المعجمي للجذر يدل على الخفض والحط، وهو معنى مغاير لدلالة المكانة الاجتماعية؛ ما يعني أن الاستخدام الحديث لـ«وضع» بمعنى «مكانة» هو امتداد دلالي حديث لا أصل كلاسيكي مباشر له"
      expands:
        - text: "«وضعية اجتماعية — social status»"
          source: "مسرد الإعلام والتواصل (ArabTerm) ومعجم اللسانيات (2002)"
          addition: "الاستخدام الاصطلاحي الأشيع في المصطلحيات الحديثة هو المركب «الوضع الاجتماعي» أو «الوضعية الاجتماعية»، لا الكلمة المفردة وحدها"

    - lemma: "مَقَام"
      contradicts:
        - text: "«(المقام) موضع القدمين والمجلس والجماعة من الناس»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المعنى الأصلي مكاني أو اجتماعي-تجمعي، لا دلالة صريحة على المكانة النسبية في المجتمع"
        - text: "«المقام: ما يتوصل إليه بنوع تصرف، ويتحقق به بضرب تطلب... فمقام كل أحد محل إقامته عند ذلك»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى الاصطلاحي عند الصوفية يخص المقامات الروحية لا المكانة الاجتماعية"
        - text: "«مقام — denominator (Math) / mode (Music) / setting (Linguistics)»"
          source: "معاجم ArabTerm (رياضيات، فنون، إعلام)"
          conflict: "المصطلح في المعاجم التقنية يحمل معاني متعددة متباعدة عن دلالة المجموعة"

    - lemma: "جَاه"
