          addition: "يكشف أن مَرْتَبَة راسخة في المعجمية الفلسفية والتصوفية لدلالة الدرجة في سُلَّم منظَّم"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مَكَانَة"
      decision: confirmed
      decision_reason: >
        راسخة في المعاجم الكلاسيكية والحديثة بدلالة المنزلة ورفعة الشأن. المعجم الوسيط يُعرِّفها صراحةً
        بـ«المنزلة ورفعة الشأن». شائعة في الاستخدام الفصيح المعاصر. تحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُعبِّر عن الجانب المُعتَرَف به من القَدْر والرفعة الذاتية للشخص؛ وفيها دلالة على الوقار
        والتؤدة والرسوخ. هي الأشمل بين لمّات المجموعة وتشمل المكانة الأخلاقية والاجتماعية معاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَكَانَة"

    - lemma: "مَنْزِلَة"
      decision: confirmed
      decision_reason: >
        موثَّقة في أمهات المعاجم كالوسيط والكبير والقاموس بدلالة الدرجة والقَدْر عند الآخرين.
        وردت في القرآن الكريم والشعر العربي. تُضاف إليها التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز على القَدْر الذي يُقدِّره الآخرون ويمنحونه للشخص، وكثيراً ما تأتي في سياق علاقة
        («له منزلة عند الأمير»). أكثر ديناميكية من مَكَانَة وأقل استقراراً بالنسبة للذات.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنْزِلَة"

    - lemma: "وَضْع"
      decision: confirmed
      decision_reason: >
        موثَّق في المصطلحيات العربية الحديثة (ArabTerm) بدلالة «status». يُستخدم في الخطاب
        الرسمي والإداري والاجتماعي المعاصر بصورة واسعة. الاستخدام الحديث راسخ وإن كان الأصل
        المعجمي الكلاسيكي يدل على الخفض. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الأعم والأكثر حيادية؛ يُشير إلى الموضع الراهن بصرف النظر عن قيمته المُقدَّرة. يُستخدم في
        السياقات الرسمية والإدارية والاجتماعية («الوضع الاجتماعي»، «الوضع القانوني»). لا يحمل
        دلالة الرفعة أو الانخفاض في ذاته على عكس جاه ومكانة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَضْع"

    - lemma: "مَقَام"
      source: stage1
      decision: removed
      decision_reason: >
        بينما تحمل لمّة مَقَام في التراث العربي دلالة المنزلة أحياناً، فإنها محمَّلة بسياقات أخرى طاغية:
        (١) المقام الصوفي الروحي، (٢) المقام الموسيقي، (٣) الموضع المكاني، (٤) المصطلح اللساني.
        هذا التشعّب الدلالي الكبير يجعل إدراجها في مجموعة «المكانة الاجتماعية» مُربِكاً للمستخدم.
        لا يوجد دليل معجمي مباشر يُحدِّدها بمعنى «الوضع الاجتماعي النسبي» دون غيره من المعاني.

    - lemma: "جَاه"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في القاموس المحيط والمعجم الوسيط والمعجم الكبير بدلالة القَدْر والمنزلة الاجتماعية.
        راسخ في الشعر والنثر الكلاسيكيين. يُضيف فارقاً دلالياً مهماً يركز على الوجاهة والنفوذ
        وقدرة الشفاعة — وهي جانب لا تُغطيه لمّات مكانة أو منزلة بالقدر ذاته.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على البُعد السلطوي-الاجتماعي من المكانة: الوجاهة والنفوذ وقدرة التأثير على القرار
        والشفاعة. «الجاه» يُكتسب ويُستعمل في المطالبة والطلب («اشفع بجاهك»)، وهو أكثر وظيفية
        من مكانة ومنزلة.
      actions:
        - command: create_entry
          params:
            lemma: "جَاه"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حُظْوَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود دلالة المكانة في المعاجم الكلاسيكية (القاموس، الكبير)، فإن المعجم الوسيط الحديث
        يُقدِّم «الحظوة» أولاً بمعنى السهم الصغير للأطفال، وهو معنى مادي متناقض. الاستخدام
        المعاصر للكلمة نادر جداً بمعنى المكانة، فضلاً عن أن دلالتها مقيّدة بسياق الحظوة لدى ذوي
        السلطان لا المكانة الاجتماعية العامة. الخطر من الاشتراك اللفظي كبير.

    - lemma: "مَرْتَبَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّقة في المعجم الكبير والوسيط بدلالة «الرتبة والمنزلة والمكانة». تُوثِّق ArabTerm
        استخدامها بمعنى «status» في حقل التربية. تُضيف فارقاً دلالياً مهماً يُركِّز على الدرجة
        الموضوعية في سلّم هرمي منظَّم — وهو غائب عن مكانة ومنزلة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُعبِّر عن الدرجة الموضوعية في سُلَّم هرمي منظَّم ومُرتَّب. تنتمي إلى الحقول الرسمية
        والأكاديمية والإدارية («المرتبة العلمية»، «مراتب الجيش»). تُؤكِّد الترتيب والتصنيف
        الرسمي أكثر من القيمة الاجتماعية المُعاشة.
      actions:
        - command: create_entry
          params:
            lemma: "مَرْتَبَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
