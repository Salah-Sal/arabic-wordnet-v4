# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    - lemma: "مَكَانَة"
      entry_id: "{auto}"
      root: "كون"
      maqayis_quote: "«(كَوَنَ) الْكَافُ وَالْوَاوُ وَالنُّونُ أَصْلٌ يَدُلُّ عَلَى الْإِخْبَارِ عَنْ حُدُوثِ شَيْءٍ، إِمَّا فِي زَمَانٍ مَاضٍ أَوْ زَمَانٍ رَاهِنٍ. يَقُولُونَ: كَانَ الشَّيْءُ يَكُونُ كَوْنًا، إِذَا وَقَعَ وَحَضَرَ»"

    - lemma: "مَنْزِلَة"
      entry_id: "{auto}"
      root: "نزل"
      maqayis_quote: "«(نَزَلَ) النُّونُ وَالزَّاءُ وَاللَّامُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى هُبُوطِ شَيْءٍ وَوُقُوعِهِ»"

    - lemma: "وَضْع"
      entry_id: "{auto}"
      root: "وضع"
      maqayis_quote: "«(وَضَعَ) الْوَاوُ وَالضَّادُ وَالْعَيْنُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْخَفْضِ لِلشَّيْءِ وَحَطِّهِ»"

    - lemma: "جَاه"
      entry_id: "{auto}"
      root: "وجه"
      maqayis_quote: "«(جَهٌّ) الْجِيمُ وَالْهَاءُ لَيْسَ أَصْلًا لِأَنَّهُ صَوْتٌ» — ملاحظة: الجاه مقلوب عن «وجه» كما أفاد المعجم الكبير: «القدر والمنزلة، مقلوب عن وجه»"

    - lemma: "مَرْتَبَة"
      entry_id: "{auto}"
      root: "رتب"
      maqayis_quote: "«(رَتَبَ)... وَمِنْ هَذَا الْبَابِ قَوْلُهُمْ: أَمْرٌ تُرْتَبٌ كَأَنَّهُ تُفْعَلُ مِنْ رَتَبَ إِذَا دَامَ. وَالرَّتَبُ: الشِّدَّةُ وَالنَّصَبُ. وَالرَّتَبُ: مَا أَشْرَفَ مِنَ الْأَرْضِ كَالدَّرَج»"

