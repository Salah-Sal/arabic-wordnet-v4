# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "جميع اللمّات الحالية خالية من التشكيل — التشكيل الكامل إلزامي"
      - "التعريف العربي الحالي يستخدم لفظَي «وضع» و«مكانة» وهما لمّتان في المجموعة ذاتها، مما يُفضي إلى دوران تعريفي"
      - "لمّة «وضع» مبهمة بدون قيد دلالي؛ فهي مصدر يحمل معاني متعددة (الوضع اللغوي، وضع المرأة، الوضع = الإسراع)"
      - "غياب لمّات كلاسيكية راسخة كالجاه والمرتبة تُغطّي جوانب تقديرية وهرمية مميّزة"
    observations: >
      المجموعة تُمثّل مفهوم «المكانة الاجتماعية» بمعناه الاجتماعي-الأنثروبولوجي، وهو مفهوم له جذور عميقة في المعجمية العربية
      الكلاسيكية. المصطلحان «مكانة» و«منزلة» راسخان ومُشهَدٌ عليهما في أمهات المعاجم. أما «وضع» فاستعماله
      الحديث للمعنى الاجتماعي موثَّق في المعاجم المعاصرة والمصطلحيات التقنية، وإن كان الأصل المعجمي يدل على
      الخفض والحط. يُلاحَظ غياب «الجاه» (الوجاهة والنفوذ الاجتماعي) و«المرتبة» (الدرجة في السُّلَّم الهرمي)
      اللتين تُثريان المجموعة بفروق دلالية ضرورية.

  blind_candidates:
    - lemma: "مَقَام"
      generation_method: majaz
      justification: >
        المقام في أصله موضع القيام، ثم امتدّ دلالياً إلى المنزلة والشرف، وقد استُعمل في سياق
        «المقام الرفيع» و«رجل ذو مقام» بمعنى الوضع الاجتماعي الرفيع. المجاز قائم على المشابهة
        الوظيفية بين الثبوت المادي (القيام في مكان) والثبوت الاجتماعي (التموضع في سلّم المجتمع).

    - lemma: "جَاه"
      generation_method: majaz
      justification: >
        الجاه لفظ عربي قديم — مقلوب عن «وجه» — يدل على القَدْر والمنزلة والنفوذ الاجتماعي.
        شاع استخدامه في الشعر والنثر الكلاسيكيين للدلالة على الاعتبار الاجتماعي والشرف المكتسب.
        إحياء لفظ كلاسيكي ميت نسبياً في الخطاب الحديث لتجنّب الاشتراك اللفظي في لمّات الحياة.

    - lemma: "حُظْوَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر ح-ظ-ي على وزن فُعْلَة، ويدل على المكانة والحظوة لدى ذوي السلطان.
        اسم المرة/النوع من «حَظِيَ» يعبر عن النصيب المعتبَر من التقدير الاجتماعي. يُوظِّف آلية
        الاشتقاق من جذر عربي أصيل يدور حول معنى الحظ والتفضيل.

    - lemma: "مَرْتَبَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر ر-ت-ب على وزن مَفْعَلَة، يدل على الدرجة في سُلَّم منظَّم. الرتبة ما أشرف
        من الأرض ويُستعار للمنزلة في الترتيب الاجتماعي. الوزن مَفْعَلَة يُناسب الأسماء الدالة على
        مراتب ودرجات (كمَرْحَلَة، مَنْزِلَة).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "مَكَانَة"
      confirm:
        - text: "«المنزلة ورفعة الشأن التُّؤَدَة. يقال: مُرَّ على مكانته: مُتَّئِدًا»"
          source: "المعجم الوسيط (OCR)"
        - text: "«المكانة: المنزلة ورفعة الشأن والتؤدة... وفي التنزيل العزيز {قل يا قوم اعملوا على مكانتكم}»"
          source: "المعجم الوسيط (هوارمني)"
        - text: "«مكانة أو منزلة عالية a man of consequence»"
          source: "المورد الحديث (2008) — ترجمة consequence"
        - text: "«مكانة اجتماعية عليا»"
          source: "المورد الحديث (2008) — ترجمة lady"

    - lemma: "مَنْزِلَة"
      confirm:
        - text: "«الدار المكانة والمرتبة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الدار والمكانة والمرتبة... يقال: له منزلة عند الأمير: مكانة، وهو رفيع المنازل: المراتب»"
          source: "المعجم الوسيط (هوارمني)"
        - text: "«مكانة؛ منزلة؛ مرتبة — a lawyer of high standing»"
          source: "المورد الحديث (2008) — ترجمة standing"
        - text: "«منزلة اجتماعية رفيعة — the working class»"
          source: "المورد الحديث (2008) — ترجمة class"

    - lemma: "وَضْع"
      confirm:
        - text: "«وضع — status»"
