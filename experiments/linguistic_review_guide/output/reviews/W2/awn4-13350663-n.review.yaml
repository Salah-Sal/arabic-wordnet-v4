# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "الألفاظ الثلاثة الموجودة (أصول، ممتلكات، موجودات) مكتوبة بدون تشكيل كامل"
      - "لفظ «موجودات» دلالته الكلاسيكية أنطولوجية (الكائنات الموجودة) لا مالية؛ توظيفه المحاسبي الحديث مجازٌ متأخر يستوجب التوثيق"
      - "«أصول» في المعاجم الكلاسيكية تعني القواعد والمبادئ لا الثروة؛ المعنى المالي توسُّعٌ حديث يحتاج شاهداً معجمياً"
      - "التعريف العربي الحالي قابل للتدقيق: عبارة «أو فائدة» فضفاضة، والإشارة إلى «قيمة مادية أو فائدة» تخلط بين الأصول المادية وغير المادية دون تمييز"
    observations: >
      المجموعة تُقابل المفهوم الاقتصادي-المحاسبي لـ"assets" بمعناه الاصطلاحي الذي يشمل الأموال والعقارات والحقوق المملوكة. اللفظان «أصول» و«ممتلكات» موثَّقان جيداً في المعاجم المصطلحية الحديثة لهذا المعنى. «موجودات» مصطلح محاسبي معياري وإن كانت دلالته الأصلية «الكائنات الموجودة». المجموعة الترادفية صحيحة اصطلاحياً لكنها تستحق إضافة التشكيل وتدقيق التعريف.

  blind_candidates:
    - lemma: "مُقْتَنَيَات"
      generation_method: ishtiqaq
      justification: "مشتقة من √قنو/قني، وزن مُفتَعَلات (جمع مُقتَنَى)، أي ما اقتناه الشخص واتخذه لنفسه دون أن يكون للتجارة؛ تدل على الأشياء ذات القيمة التي يحتفظ بها المالك."

    - lemma: "حِيَازَات"
      generation_method: ishtiqaq
      justification: "مشتقة من √حوز، وزن فِعَالَات (جمع حِيَازَة)، تعني ما يحوزه الشخص ويستولي عليه من أملاك وأموال؛ وتقابل «holdings» في الإنجليزية وهي أحد المعاني الفرعية لـ«assets»."

    - lemma: "ذَخَائِر"
      generation_method: majaz
      justification: "مجاز من √ذخر، جمع ذَخِيرَة (ما يُدَّخر من قِيَم ومتاع)؛ إحياء لفظ عربي أصيل يعبّر عن المفهوم عبر الدلالة على الادخار والتراكم، وقد وردت «ذُخْر» في المورد الحديث ضمن مرادفات «asset»."

    - lemma: "مُكْتَسَبَات"
      generation_method: ishtiqaq
      justification: "مشتقة من √كسب، باب الافتعال، جمع مُكتَسَب؛ تدل على ما كسبه الشخص أو الشركة وراكمه من ثروات وأموال. وزن اسم المفعول من الافتعال يوحي بالتحصيل التدريجي وهو ملائم لمفهوم الأصول."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
# Q1: مطابقة دفعية لجميع اللمّات + المرشحات (headword_norm IN)
# Q2: جسر إنجليزي (translation_en: assets/asset/holdings/possessions/property)
# Q3: FTS بكلمات مفتاحية (قيمة مادية, ممتلكات, موجودات, أصول مالية)
# Q4: مقاييس اللغة (dictionary_id=151) لجذور أصل/ملك/وجد
stage2_evidence:
  per_lemma:

    - lemma: "أصول"
      confirm:
        - text: "«أي بند من البنود الطويلة الأمد، التي تم شراؤها للخدمة التي تقدمها عند استعمالها، و/أو للفائدة المحصل عليها عند بيعها. ما يمتلكه شخص أو شركة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ALECSO (ArabTerm)"
        - text: "«أصول، موجودات» [ترجمة: assets]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ALECSO"
        - text: "«مجموع الأموال والحقوق التي تدخل في الذمة المالية لشخص معين، والتي تكون قابلة للتقويم نقداً، ويقابلها الخصوم أو الديون.»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ALECSO"
        - text: "«الجانب الإيجابي من الذمة (Actif)، وهو جانب الأموال والحقوق»"
          source: "المعجم الكبير — مجمع اللغة العربية بالقاهرة (OCR)"
        - text: "«أصول» [ترجمة: assets] — المَكنَز الزراعي متعدد اللغات"
          source: "AGROVOC — ArabTerm"
        - text: "«أصول المُنشأة» — «تسمية تُطلق على قطعة أرض لا تُستخدم مرة واحدة فقط إنما لفترة زمنية طويلة.» [ترجمة: asset (comm.)]"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ALECSO"
        - text: "«أصول وخصوم، موجودات ومطاليب» [ترجمة: assets and liabilities]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«أصول الشركة، موجودات الشركة» — «مجموع الأموال والحقوق المملوكة لشركة ما»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«الأصول: جمع أصل، وهو في اللغة: عبارة عما يفتقر إليه، ولا يفتقر هو إلى غيره.»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413م) — Hawramani"
          addition: "تكشف عن أصل معنى الكلمة (الأساس الذي يُبنى عليه) مما يُفسّر توسعها الدلالي نحو الأصول المالية (مكوّنات الثروة الأساسية)"
        - text: "«الهمزة والصاد واللام، ثلاثة أصول متباعد بعضها من بعض؛ أحدها: أساس الشيء.»"
          source: "مقاييس اللغة — ابن فارس"
          addition: "يؤكد أن الجذر الأول لـ«أصل» هو «أساس الشيء»، مما يجعل استخدامه في الأصول المالية (أساس الثروة) توسعاً دلالياً سليماً"

    - lemma: "ممتلكات"
      confirm:
        - text: "«مُمْتَلَكات» [ترجمة: asset]"
          source: "المعجم الطبي الموحد (2009) — ALECSO"
        - text: "«ممتلكات مادية» [ترجمة: tangible assets; tangible property]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«ممتلكات شخصية، أموال شخصية» [ترجمة: personal properties]"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«تصفية الأموال، تصفية الممتلكات» [ترجمة: liquidation of holdings]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«مُمْتَلَكاتُ رَأْسِ المال» [ترجمة: capital asset]"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُمْتَلَكاتٌ ثابِتَة» [ترجمة: fixed asset] / «مُمْتَلَكاتٌ جارية» [ترجمة: current asset]"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الميم واللام والكاف أصل صحيح يدل على قوة في الشيء وصحة... ملك الإنسان الشيء يملكه ملكاً. والمِلك: ما مُلك من مال.»"
          source: "مقاييس اللغة — ابن فارس"
          addition: "الجذر ملك يدل على القوة والاستحكام في الحيازة؛ «ممتلكات» تُضمِّن دلالة التملّك الراسخ لا مجرد الحيازة المؤقتة"

    - lemma: "موجودات"
      confirm:
        - text: "«أصول، موجودات» [ترجمة: assets]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«أصول متداولة، موجودات متداولة» [ترجمة: current assets]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«موجودات ثابتة قيد الإنشاء» [ترجمة: fixed assets under creation]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«موجودات في الخارج» [ترجمة: foreign assets]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«موجودات رأسمالية» [ترجمة: capital stock]"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«المصفّي. وبخاصةً: شخص يعيّنه القاضي لتصفية موجودات مؤسسة ما.» [ترجمة: liquidator]"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الموجودات: ثلاثة أضرب: موجود لا مبدأ له ولا منتهى، وذلك ليس إلا للباري تبارك وتعالى. وموجود له مبتدأ ومنتهى كالجواهر الدنيوية. وموجود له مبتدأ لا منتهى كالناس في النشأة الآخرة.»"
          source: "التوقيف على مهمات التعاريف — المناوي (ت 1622م)"
          conflict: "الدلالة الكلاسيكية لـ«موجودات» فلسفية وجودية (الكائنات من حيث الوجود)، وليست مالية؛ يُظهر أن التوظيف المحاسبي مجاز حادث"
      expands:
        - text: "«الواو والجيم والدال، يدل على أصل واحد، وهو الشيء يُلفيه. وجدتُ الضالّة وِجداناً.»"
          source: "مقاييس اللغة — ابن فارس"
          addition: "الجذر وجد يعني «اللقيا والإصابة»؛ «الموجودات» بالمعنى المحاسبي تعني ما وُجد في حوزة الشركة من أصول، وهو توسع دلالي من «الموجود = المَلقي عندك»"

    - lemma: "مُقْتَنَيَات"
      expands:
        - text: "«مُقْتَنَيات — الجذر: ق ن ي. المعنى: ما يحتفظ به من الأشياء القيِّمة أو الثمينة. التعليق: لم ترد في المعاجم بصيغة المفرد ولا الجمع ولكن ورد الفعل اقتنى... وحيث وجد الفعل «اقتنى» فلا مانع من استخدام اسم المفعول منه وهو مُقتنًى وجمعه مقتنيات... وقد أجاز مجمع اللغة المصري استعمال هذه الكلمة.»"
          source: "معجم الصواب اللغوي — أحمد مختار عمر (ت 2003م)"
          addition: "يُثبت فصاحة اللفظ وإجازة مجمع اللغة المصري له، غير أن دلالته تنصب على ما يُقتنى ذاتياً (التحف والأعمال الفنية) لا على الأصول المالية والمحاسبية الشاملة"

    - lemma: "حِيَازَات"
      expands:
        - text: "«حيزات زراعية» [ترجمة: agricultural holdings]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "الشاهد الوحيد المُستخرج يقيّد «حيازات» بالمجال الزراعي ولا يرد لها استخدام مطلق بمعنى assets المحاسبي الشامل"

    - lemma: "ذَخَائِر"
      expands:
        - text: "«ذُخْر؛ حَسنة؛ ميزة؛ قيمة.» [ترجمة: asset — المفرد]"
          source: "المورد الحديث (2008)"
          addition: "ذُخْر المفرد مذكور ضمن مرادفات asset، غير أن «ذخائر» الجمع تحمل دلالة أقوى على الادخار والمؤن والذخائر الحربية مما يُحدث تداخلاً دلالياً"

    - lemma: "مُكْتَسَبَات"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "أصول"
      decision: confirmed
      decision_reason: >
        المصطلح المحاسبي المعياري الأكثر تداولاً في العربية للدلالة على «assets»؛ موثَّق في ست معاجم مصطلحية حديثة (تجارة، قانون، اقتصاد، بيئة، مياه) مع تعريفات مطابقة تماماً للمجموعة. مجمع اللغة العربية بالقاهرة وثَّقه في المعجم الكبير بمعناه المالي. يستوفي معايير الاطّراد والشيوع ويُسر التداول.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الاقتصادي-المحاسبي المعياري الأشمل، يُستخدم في ميزانيات الشركات ودفاترها الرسمية ويُعبّر عن الجانب الإيجابي من الذمة المالية في مقابل الخصوم؛ معناه مأخوذ من «الأصل = الأساس» توسعاً مجازياً راسخاً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُصُول"

    - lemma: "ممتلكات"
      decision: confirmed
      decision_reason: >
        لفظ فصيح موثَّق في مصطلحيات متعددة (طب، قانون، تجارة) بمعنى «asset/property». جذره «ملك» يُفيد القوة في الحيازة وفق مقاييس اللغة. يُستخدم في سياقات الممتلكات المادية والعقارية. يُكمّل «أصول» في السياقات القانونية والشخصية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُشدّد على الجانب الحيازي المادي للملكية الشخصية أو المؤسسية؛ يُستخدم غالباً في السياقات القانونية للأشياء المملوكة ملكاً تاماً (عقارات، منقولات)، ويُرادف «property» أكثر من مرادفته لـ«assets» بمعناه المحاسبي الدقيق."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُمْتَلَكَات"

    - lemma: "موجودات"
      decision: confirmed
      decision_reason: >
        مصطلح محاسبي معياري راسخ في المعاجم المصطلحية للتجارة والاقتصاد والقانون؛ يرد كثيراً في التقارير المالية ودفاتر المصارف. صحيح أن دلالته الكلاسيكية أنطولوجية، إلا أن التوظيف المحاسبي الحديث مستقر وشائع ولا يمكن حذفه من المجموعة. الأدلة الحديثة تؤكده بقوة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح محاسبي بامتياز يُستخدم في ميزانيات المصارف والشركات الكبرى؛ يُشير إلى ما «وُجد» في الحيازة من أصول منقولة وغير منقولة، ويُميّز عادةً بين موجودات «ثابتة» و«متداولة» في الدفاتر المالية، وهو تخصيص أدق من «أصول»."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْجُودَات"

    - lemma: "مُقْتَنَيَات"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ فصيح ومجاز مجمعياً، غير أنه يدل على «ما يُحتفظ به من أشياء قيّمة كالتحف والأعمال الفنية» ولا يصلح ترادفاً لـ«assets» بمعناه المحاسبي الواسع الذي يشمل الأموال السائلة والديون المستحقة والحقوق المعنوية. اختبار الاستبدال يُخفق: «مُقتنيات الشركة» تُوحي بالمقتنيات الفنية أو العينية لا بالأصول الإجمالية.

    - lemma: "حِيَازَات"
      source: stage1
      decision: removed
      decision_reason: >
        «حيازات» تُقابل «holdings» (ما يُحاز) وهو مفهوم أضيق؛ الشاهد الوحيد المُستخرج يقيّدها بـ«الحيازات الزراعية» فقط. لا تشمل الأصول غير المادية ولا الحقوق المالية؛ واختبار الاستبدال يُثبت محدودية تغطيتها للمفهوم.

    - lemma: "ذَخَائِر"
      source: stage1
      decision: removed
      decision_reason: >
        «ذُخْر» (المفرد) ورد ضمن مرادفات «asset» في المورد الحديث، لكن «ذخائر» الجمع تحمل دلالة قوية على المؤن والادخار والذخائر الحربية، مما يُحدث إيهاماً في سياق الأصول المالية. اختبار التثبيت المعجمي: لم يُثبَت كمصطلح محاسبي في أي معجم مصطلحي.

    - lemma: "مُكْتَسَبَات"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي لاستخدام «مكتسبات» بمعنى «assets» المحاسبي. الجذر كسب يُفيد «ما أُصيب من الرزق» (الأرباح والمكاسب المحققة) لا الثروة القائمة كلها؛ وهو أقرب إلى مفهوم «earnings» منه إلى «assets».


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "أي شيء له قيمة مادية أو فائدة يمتلكه شخص أو شركة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه لكنه يفتقر إلى الدقة الاصطلاحية: (١) «أو فائدة» فضفاضة وقد تشمل ما لا يُقوَّم بالنقد، (٢) لم يُشَر إلى إمكانية التقويم النقدي وهو شرط جوهري للأصل، (٣) لم يُذكَر أن الأصول تقابَل بالخصوم وهو تمييز أساسي في المحاسبة. أسلوب المعجم الوسيط يقتضي تعريفاً أدق يجمع الجنس القريب والفصل النوعي.
    authored:
      - type: terminological
        text: "كلُّ مالٍ أو حقٍّ ذي قيمةٍ نقديةٍ تمتلكه جهةٌ ما، شخصاً طبيعياً أو اعتبارياً، وتشمل الأصولَ الثابتةَ والمتداولةَ والحقوقَ المعنوية، وهي تقابل الخصومَ في الميزانية العمومية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يمتلكه الشخصُ أو المؤسسةُ من أموالٍ وأعيانٍ وحقوقٍ مُقوَّمةٍ بالنقد."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
