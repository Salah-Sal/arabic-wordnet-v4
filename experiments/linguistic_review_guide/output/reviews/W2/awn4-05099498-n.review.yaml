# مراجعة المجموعة الترادفية — awn4-05099498-n
# conditional probability / احتمال مشروط
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي لمّة واحدة فقط (احتمال مشروط)، والمفهوم الرياضي له مرادف شائع آخر (احتمال شرطي) ينبغي إضافته"
      - "اللمّة الموجودة بدون تشكيل كامل"
    observations: >
      المفهوم ينتمي إلى حقل نظرية الاحتمالات في الرياضيات، وهو مفهوم مستقر في الاصطلاح العربي العلمي.
      يُعبَّر عنه بمركب وصفي يجمع بين «احتمال» (الجنس القريب = المفرط المباشر) وصفة تدل على التقييد بشرط.
      الصفة «مشروط» (اسم مفعول) و«شرطي» (نسبة) كلتاهما مستعملتان في المعاجم الاصطلاحية العربية.
      التعريف العربي الحالي جيد ويعكس المفهوم بدقة.
  blind_candidates:
    - lemma: "اِحْتِمَالٌ شَرْطِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «احتمال» + «شرطي» (نسبة إلى الشرط)، شائع في المعاجم الاصطلاحية الحديثة كمرادف لـ conditional probability"
    - lemma: "أَرْجَحِيَّةٌ مَشْرُوطَةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «أرجحية» (مرادف لاحتمال في المورد) + «مشروطة»، محاولة لتنويع الجنس القريب"
    - lemma: "تَرَجُّحٌ شَرْطِيٌّ"
      generation_method: ishtiqaq
      justification: "مصدر «ترجّح» على وزن تَفَعُّل يدل على تأرجح الأمر بين الوقوع وعدمه، مع صفة «شرطي» للتقييد"
    - lemma: "اِحْتِمَالِيَّةٌ شَرْطِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «احتمالية» (المصدر الصناعي من احتمال) + «شرطية»، يظهر في مركب «مبدأ الاحتمالية الشرطية» في معجم الرياضيات والفلك"


