stage3_analysis:
  per_lemma:
    - lemma: "اِحْتِمَالٌ مَشْرُوطٌ"
      decision: confirmed
      decision_reason: >
        مصطلح مسجّل في المعجم الموحد لمصطلحات الرياضيات والفلك (1990) مقابل conditional probability.
        «مشروط» اسم مفعول من «شرط» يدل على أنّ الاحتمال مقيَّد بتحقّق شرط معيّن، وهو دقيق دلالياً.
        التشكيل الكامل مضاف.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على كون الاحتمال مُقيَّداً بشرط (صيغة اسم المفعول)، وهو الأقدم اصطلاحاً (1990)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِحْتِمَالٌ مَشْرُوطٌ"

    - lemma: "اِحْتِمَالٌ شَرْطِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مسجّل في معجم البيانات والذكاء الاصطناعي (2024) بتعريف صريح يطابق دلالة المجموعة.
        كما يرد بصيغة الجمع «احتمالات شرطية» في المعجم الموحد للرياضيات (1990).
        «شرطي» صفة نسبية إلى الشرط، شائعة في الاصطلاح العلمي العربي الحديث.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يصنّف الاحتمال بوصفه نوعاً منسوباً إلى الشرط (صيغة النسبة)، وهو الأحدث والأكثر شيوعاً في المعلوماتية"
      actions:
        - command: create_entry
          params:
            lemma: "اِحْتِمَالٌ شَرْطِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أَرْجَحِيَّةٌ مَشْرُوطَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي على استعمال هذا المركب مصطلحاً ثابتاً. «أرجحية» ترد مرادفاً لـ probability
        في المورد الحديث لكن المركب «أرجحية مشروطة» غير مسجّل في أي معجم اصطلاحي.
      evidence_assessment:
        case: no_material

    - lemma: "تَرَجُّحٌ شَرْطِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي. «ترجّح» لا يحمل الدلالة الاصطلاحية لـ probability في الرياضيات،
        بل يدل على التأرجح والتردد، وهو أقرب إلى المعنى اللغوي العام.
      evidence_assessment:
        case: no_material

    - lemma: "اِحْتِمَالِيَّةٌ شَرْطِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المركب يرد ضمنياً في «مبدأ الاحتمالية الشرطية» لكنه غير مسجّل مستقلاً كمصطلح.
        كما أنّ «احتمالية» بالمصدر الصناعي تحمل معنى صفة (probabilistic) أكثر من كونها اسماً للمقدار،
        مما يجعلها أقل دقة من «احتمال» في هذا السياق.
      evidence_assessment:
        case: mixed


