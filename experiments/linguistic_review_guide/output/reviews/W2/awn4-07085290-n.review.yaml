# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────

stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'لغة صحفية' خالية من التشكيل"
      - "استخدام 'لغة' بمعنى 'أسلوب' تساهلٌ دلالي؛ 'لغة' تدل على منظومة التعبير ككل، أما 'أسلوب' فهو الأدق للدلالة على طريقة الكتابة وأسلوب التحرير"
      - "اللمة الموجودة غير موثقة في أي من المعاجم المتاحة في قاعدة البيانات"
    observations: "المجموعة الترادفية تعبر عن مصطلح 'journalese'، وهو اسم لأسلوب كتابي مرتبط بالتحرير الصحفي اليومي، يتسم بالإيجاز والصياغات النمطية المتكررة. الإنجليزية أنشأت المصطلح بمزج journal (يوميات/جريدة) + ease (سهولة/مرونة)، فجاء اسماً لطريقة كتابة مخصوصة. المقابل العربي الأوفق مركبٌ اصطلاحي يجمع 'أسلوب' (الجنس القريب) بعنصر يحدد النسبة إلى الصحافة، على نمط 'الأسلوب الصحفي' أو 'أسلوب الصحافة'. المفهوم قائم في الثقافة العربية لكنه يفتقر إلى مصطلح مفرد ثابت."

  blind_candidates:
    - lemma: "أُسْلُوبُ الصُّحُفِ"
      generation_method: tarkib
      justification: "مركب إضافي من 'أسلوب' (الجنس القريب لطريقة التعبير) و'الصحف' (المضاف إليه المحدِّد للنسبة). يعبر عن الأسلوب المنسوب مباشرةً إلى الصحف بوصفها المنتِج لهذه الكتابة."
    - lemma: "لُغَةُ الصَّحَافَةِ"
      generation_method: tarkib
      justification: "مركب إضافي من 'لغة' بمعنى السجل اللغوي المخصوص و'الصحافة' اسم المهنة. يحاكي في بنيته المفهومية المصطلح الإنجليزي journalese الذي يحيل إلى اللغة/الأسلوب المرتبط بالصحافة."
    - lemma: "الصُّحُفِيَّةُ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'صحفي' على وزن -يَّة، يعبر عن الطابع الصحفي كمفهوم مجرد، على غرار 'الشِّعرية' للدلالة على خاصية الشعر، و'الرِّوائية' للدلالة على خاصية الرواية."
    - lemma: "الأُسْلُوبُ الصُّحُفِيُّ"
      generation_method: tarkib
      justification: "مركب وصفي من 'الأسلوب' و'الصحفي' (نعت)، يصف الطابع المميز لهذه الكتابة مباشرةً. وزن المركب الوصفي شائع في المصطلحية العربية الحديثة للتعبير عن الأساليب الكتابية."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة: ٥
#  ١. مطابقة دفعية: لغة صحفية + صحافة + لغة + صحفية + اسلوب صحفي + الاسلوب الصحفي + مكونات
#  ٢. جسر إنجليزي: journalese + newspaper style + journalistic style + press style
#  ٣. FTS عربي: اسلوب + صحيفة + صحفي + جريدة
#  ٤. مقاييس اللغة: صحف + لغو + سلب
#  ٥. التحقق من المرشحات (مدمج في الاستعلام ١)

