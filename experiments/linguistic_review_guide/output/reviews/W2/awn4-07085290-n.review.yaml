# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────

stage3_analysis:
  per_lemma:
    - lemma: "لغة صحفية"
      decision: removed
      decision_reason: "انعدام التوثيق المعجمي تماماً. فضلاً عن ذلك، يُعدّ استخدام 'لغة' بمعنى 'أسلوب' تساهلاً دلالياً؛ إذ تدل 'لغة' على منظومة التعبير ككل (Language)، بينما 'أسلوب' يختص بطريقة التعبير والتحرير (Style). المقابلات الموثقة في ArabTerm والمورد الحديث جميعها تستعمل 'أسلوب' لا 'لغة'. يُستعاض بـ'الأسلوب الصحفي' الأوثق والأدق."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "أُسْلُوبُ الصُّحُفِ"
      source: stage1
      decision: confirmed
      decision_reason: "المركب الإضافي موثق جوهرياً بصيغة 'أُسْلُوبُ الصَّحَافَةِ' في ArabTerm كمقابل مباشر لـ journalese. الصيغة الأوثق هي 'أُسْلُوبُ الصَّحَافَةِ' (باستخدام الصحافة اسم المهنة بدلاً من الصحف جمع صحيفة)، وهي التي يُعتمد عليها. يجتاز اختبار التثبيت المعجمي بصيغته المعدَّلة. الفرق بين 'الصحف' و'الصحافة': الأول جمع صحيفة (الوعاء المادي)، والثاني اسم المهنة والمؤسسة، وهو أدق للإحالة إلى الأسلوب."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُبرز انتساب الأسلوب إلى الصحافة بوصفها مهنةً ومؤسسةً عبر التركيب الإضافي (أسلوب + الصحافة)، بينما 'الأسلوب الصحفي' يصف طابعه الذاتي مباشرةً بالنعت."
      actions:
        - command: create_entry
          params: {lemma: "أُسْلُوبُ الصَّحَافَةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "لُغَةُ الصَّحَافَةِ"
      source: stage1
      decision: removed
      decision_reason: "غير موثق معجمياً. وكما سبق مع 'لغة صحفية'، استخدام 'لغة' بمعنى 'أسلوب' يخالف الدقة الاصطلاحية. بوجود 'أسلوب الصحافة' الأوثق والأدق، يُستغنى عن هذا المرشح."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "الصُّحُفِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: "تُثبت المعاجم أن 'الصحفية' بصيغها الثلاث (صَحَفِيَّة/صَحْفِيَّة/صُحُفِيَّة) صفاتٌ مؤنثة للاسم 'صحفي'، لا مصادر صناعية مستقلة. كذلك لا يجتاز المرشح اختبار السك: إذ لا يشيع استعماله مصطلحاً مستقلاً يحل محل 'أسلوب' في السياق. فضلاً عن ذلك، قياس المصدر الصناعي من صحفي على غرار 'الشعرية' لم يُثبَّت معجمياً في هذا المعنى."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الأُسْلُوبُ الصُّحُفِيُّ"
      source: stage1
      decision: confirmed
      decision_reason: "موثق توثيقاً مباشراً في المورد الحديث (2008) بوصفه المقابل الصريح لـ journalese، وفي ArabTerm (مسرد الإعلام والتواصل). يجتاز اختبار التثبيت المعجمي لوروده في مصدرين مستقلين. يجتاز اختبار السك: لا يمكن إبدال 'صحفي' بمرادف آخر (تحريري/إعلامي) مع الحفاظ على الدلالة الاصطلاحية الدقيقة لـ journalese. الاشتقاقية: صحفي من صحف ← صحيفة (شيء منبسط يُكتب عليه)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يصف الطابع الصحفي للأسلوب مباشرةً عبر النعت الوصفي 'صحفي'، مُركِّزاً على الخاصية الذاتية لهذه الكتابة. بينما 'أسلوب الصحافة' ينسبه إلى الصحافة بوصفها مؤسسة ومهنة عبر الإضافة."
      actions:
        - command: create_entry
          params: {lemma: "الأُسْلُوبُ الصُّحُفِيُّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}


