step0_evidence:
  per_lemma:
    - lemma: "شَخْص مَلْغِيّ الوُجُود"
      evidence_status: "no_material_found"
    - lemma: "لَا شَخْص"
      confirm:
        - text: "«اللّاشخص: شخص مُعْتبرٌ وكأنه غير موجود.»"
          source: "المورد الحديث (2008)"

step05_lemma_generation:
  evidence_candidates: []
  knowledge_candidates:
    - lemma: "مُغَيَّب"
      justification: "مجاز (الإزاحة الدلالية)؛ إطلاق اسم المفعول (من غَيَّب) للدلالة على الشخص الذي يُتجاهل وجوده عمدًا وتُسلب حقوقه في المجتمع وكأنه غير موجود."
    - lemma: "مُسْتَبْعَد"
      justification: "اشتقاق؛ للدلالة على من أُقصي ونُفي وجوده الاعتباري من الدائرة المجتمعية أو السياسية."

step1_lemma_validation:
  per_lemma:
    - lemma: "شَخْص مَلْغِيّ الوُجُود"
      decision: removed
      decision_reason: "عبارة وصفية حرة تتألف من موصوف وصفة ومضاف إليه (شخص ملغي الوجود)، وليست مصطلحاً معجمياً مسكوكاً."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "ترجمة حرفية وصفية تفتقر إلى السبك المصطلحي مقارنة بالبدائل المعجمية."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "لَا شَخْص"
      decision: confirmed
      decision_reason: "مصطلح معاصر (ترجمة مفاهيمية مقبولة) يستعمل في الفلسفة والسياسة للتعبير عن سلب الشخصية الاعتبارية، وهو مركب مزجي (لا النافية + اسم)."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يعبر بدقة عن سلب صفة الشخصية الاعتبارية والقانونية عن الفرد ومحوه من الوجود المعنوي."
      example: "حاول النظام الشمولي تحويل المعارض السياسي إلى لا شخص بتجريده من كافة حقوقه."
    - lemma: "مُغَيَّب"
      source: step05
      decision: removed
      decision_reason: "يحمل دلالة أوسع تشمل التغييب المادي (الإخفاء القسري) أو المعنوي، ولا يقتصر بدقة على المفهوم السياسي والقانوني لانعدام الشخصية الاعتبارية (nonperson)."
      step05_citation: "اقتراح مبني على المعرفة اللغوية"
    - lemma: "مُسْتَبْعَد"
      source: step05
      decision: removed
      decision_reason: "مصطلح عام يشير إلى الإقصاء ولا يعبر بدقة عن الإلغاء الكامل للوجود الاعتباري للشخص كأنه غير موجود."
      step05_citation: "اقتراح مبني على المعرفة اللغوية"
  synset_flags:
    definition_review_needed: false

step3_definition:
  definition_review_flag: false
  current_definition: "شخص يُعتبر غير موجود ولا يتمتع بأي حقوق؛ شخص يتم تجاهل وجوده بشكل منهجي (خاصة لأسباب أيديولوجية أو سياسية)"
  assessment:
    decision: retain
    reason: "التعريف دقيق وشامل، وينقل المفهوم السياسي والقانوني للمصطلح بوضوح تام، ويتوافق مع أدلة المعاجم الحديثة."

step4_relations:
  hypernymy:
    current_hypernym: "عَامِل / فَاعِل"
    test_result: "needs_closer"
  verb_checks:
    applicable: false
  selectional_restrictions:
    - lemma: "لَا شَخْص"
      constraint: "يُطلق على العاقل (الإنسان) الذي تُسلب منه حقوقه الاعتبارية والمدنية."

step5_enrichment:
  per_lemma:
    - lemma: "لَا شَخْص"
      enrichment:
        root: "ش-خ-ص"
        etymology: "loanword"
      examples:
        - text: "حاول النظام الشمولي تحويل المعارض السياسي إلى لا شخص بتجريده من كافة حقوقه ومحوه من السجلات."
          type: usage
          source: "مؤلَّف"
      pos_check:
        pos: noun
  cultural_fit:
    assessment: lexical_gap
