# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما مركّبتان إضافيّتان دون تشكيل، وهما عبارتان وصفيّتان لا مصطلح مسكوك"
      - "لمّة (إزالة الأوراق) تحمل دلالة فاعليّة/سببيّة تُلمح إلى تدخّل خارجي متعمَّد، وقد لا تشمل التساقط الطبيعي المُجرَّد"
      - "غياب أيّ مصطلح بيولوجي متخصّص أو لفظة مفردة تُعبِّر عن الظاهرة كوحدة معجميّة واحدة"
      - "التعريف الحالي (فقدان أوراق الشجر) مختصَر ولا يُميّز بين التساقط الطبيعي والمُستحثّ كيميائيًّا"
    observations: >
      المجموعة تصف عمليةً بيولوجيَّةً تندرج تحت الجنس القريب «عملية تحدث في الكائنات الحية».
      المفهوم ثنائيّ الوجه: تساقط طبيعي موسميّ (الخريف)، وتجريد اصطناعي (مبيدات، آفات).
      اللمّتان الراهنتان تغطّيان الوجهين بصورة جزئية، غير أنّ المعجمية العربية الحديثة تستوعب
      مصطلحات أكثر تخصيصاً. يُستحسن إضافة مصطلح من المعجم البيولوجي المتخصّص.
  blind_candidates:
    - lemma: "تَسَاقُط"
      generation_method: ishtiqaq
      justification: "من جذر (سقط)، وزن تَفَاعُل يدلّ على وقوع الشيء متتابعاً؛ يصف حالة سقوط الأوراق الواحدةَ تلو الأخرى بصورة طبيعية"
    - lemma: "تَعَرٍّ"
      generation_method: majaz
      justification: "من جذر (عرو/عري) على وزن تَفَعُّل، مجاز: تعرّي الشجرة من أوراقها كما يتعرّى الإنسان من ثيابه؛ إحياء للصورة المجازية التراثية"
    - lemma: "تَنَاثُر"
      generation_method: ishtiqaq
      justification: "من جذر (نثر)، وزن تَفَاعُل يدلّ على الإلقاء المتفرِّق؛ يصف انتثار الأوراق عن أغصانها وسقوطها متناثرةً في كلّ اتجاه"
    - lemma: "تَخَلُّع"
      generation_method: ishtiqaq
      justification: "من جذر (خلع)، وزن تَفَعُّل يدلّ على الانفصال التدريجي؛ مجاز عن انخلاع أوراق الشجرة كما تُخلع الثياب عن لابسها"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت (٦ استعلامات):
#   Q1 — مطابقة دفعية للمّات الموجودة والمرشحات وعناصرها (headword_norm IN ...)
#   Q2 — جسر إنجليزي: defoliation / leaf fall / leaf drop / foliage loss
#   Q3 — إثراء بالمعرِّف: definitions + examples لعناصر رئيسية
#   Q4 — مقاييس اللغة (dictionary_id=151): جذور ورق/سقط/زول/جرد/نثر/سلخ
#   Q5 — FTS بالكلمات المفتاحية: تساقط الأوراق / تجرد الأوراق / تحات الأوراق
#   Q6 — التحقق من المرشحات: تجرد/تجرد الاوراق/تساقط/تعر/تناثر/تخلع
stage2_evidence:
  per_lemma:

    - lemma: "إزالة الأوراق"
      confirm:
        - text: "«إزالة الأوراق» — translation_en: defoliation — domain: AGROVOC"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"

    - lemma: "تساقط الأوراق"
      confirm:
        - text: "«تساقط الأوراق هو فقدان الأشجار للأوراق أو الإبر بالمقارنة مع حالة مرجعية للشجرة. ويتم تقييم حالة تاج الشجرة من حيث مستوى تساقط الأوراق. يوضح هذا المعامل النقص في وجود أوراق الشجرة بالنسبة لكل عينة من الأشجار»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"

    - lemma: "تَجَرُّدُ الأَوْرَاقِ"
      confirm:
        - text: "«تجرد الأوراق» — translation_en: defoliation — domain: Biology"
          source: "المعجم الموحد لمصطلحات علم الأحياء 1993 (ArabTerm)"

    - lemma: "تَسَاقُط"
      contradicts:
        - text: "«تساقط» — translation_en: precipitate / precipitation — domain: Water Engineering"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "المصطلح المفرد (تساقط) مُعتمَد في المعجمية التقنية بمعنى «الترسيب/التساقط المطري»، مما يُوجد تضارباً دلاليًّا مع الاستخدام في مجال النبات"
        - text: "«تساقط» — translation_en: precipitation — domain: Meteorology"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
          conflict: "الاستعمال المتخصّص في الأرصاد الجوية يُضيّق دلالة المصطلح المفرد في غير سياق تساقط الأوراق"
      expands:
        - text: "«(تساقط) سقط تتابع سقوطه عليه: ألقى نفسه»"
          source: "المعجم الوسيط"
          addition: "يُثبت أن الجذر والوزن يحملان معنى التتابع في السقوط، وهو جوهر مفهوم تساقط الأوراق"

    - lemma: "تَعَرٍّ"
      evidence_status: "no_material_found"

    - lemma: "تَنَاثُر"
      contradicts:
        - text: "«تناثر» — translation_en: scattering, dispersal — domain: Remote Sensing"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          conflict: "المصطلح مُعتمَد في علم الاستشعار بمعنى التبعثر الموجيّ، ويُفضي إلى اشتراك لفظيّ مع سياق تساقط الأوراق"
        - text: "«تناثر» — translation_en: Sparsity — domain: Data and AI Glossary"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          conflict: "استخدام حديث راسخ في تعلّم الآلة يُرسِّخ دلالةً مختلفة تماماً"
      expands:
        - text: "«التناثر: بالثاء المثلثة لغة مصدر من باب التفاعل بمعنى السقوط. وعند الأطباء هو سقوط الشعر لضعف نباته... وقد يفرق بين التناثر والتمرط بأن التناثر يكون متفرقا والتمرط يأخذ موضعا مجتمعا»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُثبت أن اللفظ استُعمل تاريخياً بمعنى السقوط المتفرِّق، إلا أن تخصيصه لسقوط الشعر لا الأوراق يجعله غير دقيق للمجموعة"

    - lemma: "تَخَلُّع"
      contradicts:
        - text: "«تخلع» — translation_en: dislocation — domain: Geography and History"
          source: "مسرد الجغرافيا والتاريخ — المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "المصطلح مُعتمَد في الجغرافيا بمعنى الانزلاق الجيولوجي لا الظواهر النباتية"
        - text: "«(تخلع) تفكك ويقال تخلع في مشيه هز منكبيه ويديه وأشار بهما والقوم تسللوا وذهبوا وفي الشراب انهمك فيه ولازمه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "معاجم اللغة المعيارية لا توثّق استعمال (تخلّع) في سياق الأوراق أو النبات"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "إزالة الأوراق"
      decision: confirmed
      decision_reason: >
        موثَّقة في المَكنَز الزراعي الدولي (AGROVOC) مقابل «defoliation»، وتُعبِّر تحديداً عن الجانب
        الإرادي/التقني للمفهوم (إزالة مُتعمَّدة بالمبيدات أو الآليات). الوحدة الاصطلاحية مسكوكة
        معجميًّا في مصادر موثوقة. اختبار السكّ: لا يُمكن إبدال «إزالة» بـ«حذف» أو «نزع» مع
        الحفاظ على الدلالة التقنية الزراعية نفسها. تحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تُستعمل في السياقات التقنية والزراعية والعسكرية، وتُركّز على فعل الإزالة المتعمَّدة بعامل خارجي؛ تقابل الجانب الفاعليَّ من defoliation"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِزَالَةُ الأَوْرَاقِ"

    # ── لمّة موجودة ٢ ──
    - lemma: "تساقط الأوراق"
      decision: confirmed
      decision_reason: >
        موثَّقة في مسرد المناخ والبيئة (ArabTerm) بتعريف علمي صريح يطابق مفهوم المجموعة. الوحدة
        الاصطلاحية ثابتة: (تساقط) على وزن تفاعُل يدلّ على التتابع، و(الأوراق) تُحدِّد المجال.
        اختبار السكّ: لا يُمكن إبدال (تساقط) بـ(سقوط) دون فقدان دلالة التتابع والتدرُّج الزمني،
        مما يُثبت تثبيتها المعجمي. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تصف الظاهرة الطبيعية التدريجية في فقدان الأوراق (الخريف، الأمراض)؛ تُركّز على التتابع الزمني للسقوط وتُستعمل في سياقات البيئة والمناخ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسَاقُطُ الأَوْرَاقِ"

    # ── مرشح جديد اكتُشف في المرحلة ٢ (جسر إنجليزي — علم الأحياء) ──
    - lemma: "تَجَرُّدُ الأَوْرَاقِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُوثَّقة في المعجم الموحد لمصطلحات علم الأحياء (1993) مقابل «defoliation»، وهو مصدر
        أكاديمي معتمَد. الجذر (جرد) ومعناه في مقاييس اللغة «بدوّ ظاهر الشيء حيث لا يستره ساتر»
        يُوافق تمام الموافقة مفهومَ تجرُّد الشجرة من أوراقها. تجرَّدَ على وزن تفعَّل من جرد
        وهو الوزن الأمثل للدلالة على التحوّل إلى حالة. اختبار السكّ: لا يُمكن إبدال (تجرُّد)
        بـ(خلوّ) مع الحفاظ على الدلالة البيولوجية البنيوية ذاتها. مُستخدَم في السياق العلمي
        المتخصص، ومدعوم بأصالة اشتقاقية من معجمية ابن فارس.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يصف الحالة البيولوجية النهائية للنبات المُتجرِّد من أوراقه بتركيز أكبر على نتيجة الفقدان لا عملية السقوط؛ مستخدَم في السياق البيولوجي العلمي المتخصص"
      actions:
        - command: create_entry
          params:
            lemma: "تَجَرُّدُ الأَوْرَاقِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشحات المرحلة ١ المرفوضة ──
    - lemma: "تَسَاقُط"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح المفرد (تساقط) راسخٌ في المعجمية التقنية بمعنى «الترسيب/التساقط المطري» في علوم
        المياه والأرصاد، مما يُفضي إلى اشتراك لفظي حادّ. فضلاً عن ذلك، فإن الصيغة المركّبة
        (تساقط الأوراق) موجودة بالفعل في المجموعة، وإضافة المفرد المجرد يُربك الدلالة.
      evidence_assessment:
        case: mixed

    - lemma: "تَعَرٍّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أيّ توثيق معجمي لهذا المصطلح في سياق الأوراق أو النبات. البحث في قاعدة
        البيانات عن (تعر) أسفر عن مداخل لجذر (عر) المختلف كليًّا (جبل/صياح/اشتعال الحرب)، وقد
        أكّد ابن فارس في المقاييس أن (تعر) «ليس بشيء إلا تِعار وهو جبل». المصدر (تفعُّل من عري)
        لم يُسجَّل كمصطلح نباتي في أيّ مصدر موثوق.
      evidence_assessment:
        case: no_material

    - lemma: "تَنَاثُر"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح مُعتمَد في الاستشعار عن بُعد بمعنى «التشتّت الموجيّ» وفي تعلّم الآلة بمعنى
        «Sparsity»، مما يُنشئ اشتراكاً لفظياً مضرًّا بالوضوح الاصطلاحي. وإن كان المعجم الطبي
        الكلاسيكي (التهانوي) يُجيز «السقوط» بوجه عام، فإنه يُقيّده بـ«سقوط الشعر» لا الأوراق.
      evidence_assessment:
        case: mixed

    - lemma: "تَخَلُّع"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم المعيارية (الوسيط، الكبير) تُحدِّد دلالة (تخلّع) بـ«التفكُّك، هزّ المنكبين، التسلُّل
        والذهاب»؛ أما في ArabTerm فهي مُعتمَدة في الجغرافيا بمعنى «dislocation» الجيولوجي.
        لا علاقة للمصطلح بالنبات أو الأوراق في أيٍّ من المصادر المعجمية المُتاحة.
      evidence_assessment:
        case: contradicts_only


