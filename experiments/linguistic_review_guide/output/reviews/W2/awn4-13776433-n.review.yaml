# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13776433-n
# المفهوم: a quantity that is added (كمية مضافة)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «إضافة» في المعاجم الكلاسيكية يدلّ أساساً على الإضافة النحوية (ربط اسمين) أو النسبة الفلسفية، لا على الكمية المضافة؛ واستخدامه بمعنى المقدار المضاف توسّع دلالي حديث"
      - "التعريف العربي «كمية مضافة» مقتضب جداً وأقرب إلى ترجمة حرفية للتعريف الإنجليزي"
    observations: "المجموعة تمثّل مفهوماً عاماً هو المقدار الذي يُضاف إلى شيء ما، وتقع تحت فوقيّ «كمية غير محددة». اللمّتان الموجودتان (إضافة، زيادة) تغطيان الحقل الدلالي جزئياً، لكن يمكن إثراء المجموعة بلفظ تراثي يدلّ على ما يُزاد فوق الشيء"
  blind_candidates:
    - lemma: "مَزِيد"
      generation_method: ishtiqaq
      justification: "من الجذر ز ي د على وزن مَفْعِل، يدلّ على ما يُزاد في الشيء ويُستكثر منه، ورد في القرآن «هَلْ مِنْ مَزِيدٍ»"
    - lemma: "عِلَاوَة"
      generation_method: ishtiqaq
      justification: "من الجذر ع ل و، يدلّ في المعجم الوسيط على «ما زاد على الشيء» وعلى «ما يُوضع على البعير بعد تمام حمله»، فهو مقدار مضاف فوق الأصل"
    - lemma: "كَسْب"
      generation_method: majaz
      justification: "في الأصل طلب الرزق وإصابته، ويُستعمل حديثاً بمعنى الربح والمكسب الكمّي (gain)، فيكون مجازاً للكمية المحصَّلة"
    - lemma: "تَزَايُد"
      generation_method: ishtiqaq
      justification: "من الجذر ز ي د على وزن تَفَاعُل، مصدر تزايَدَ، يدلّ على حدوث الزيادة تدريجياً"

stage2_evidence:
  per_lemma:
    - lemma: "إِضَافَة"
      confirm:
        - text: "«إضافة» = addition"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (1996)"
        - text: "«إضافة، زيادة» = addition"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«إضافة» = addition"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — بمعنى الزيادة في النحو التوليدي"
      contradicts:
        - text: "«(الإضافة) (عند النحاة) ربط اسمين أحدهما بالآخر على وجه يفيد تعريفاً أو تخصيصاً (عند الحكماء) نسبة بين شيئين يقتضي وجود أحدهما وجود الآخر؛ كالأبوة والبنوَّة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المعنى الأساسي في المعاجم الكلاسيكية هو الإضافة النحوية أو النسبة الفلسفية لا المقدار المضاف"
        - text: "«الإضافة: ضم شيء إلى شيء ومنه الإضافة في اصطلاح النحاة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الأصلي هو الضمّ والنسبة لا الكمية"
      expands:
        - text: "«الإضافة: وهي امتزاج اسمين على وجه يفيد تعريفًا أو تخصيصًا»"
          source: "كتاب التعريفات للجرجاني"
          addition: "يؤكد أن المعنى الاصطلاحي الراسخ هو النحوي"

    - lemma: "زِيَادَة"
      confirm:
        - text: "«(الزيادة) ما زاد على الشيء»"
          source: "المعجم الوسيط (OCR)"
        - text: "«من كل شيءٍ: الزائد منه»"
          source: "المعجم الكبير (OCR)"
        - text: "«الزيادة: أن ينضم إلى ما عليه الشيء في نفسه شيء آخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«كميةٌ واحدية (أو سلّمية) تُستعملُ لزيادة قيمةِ غرضٍ ما»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«الزيادة: استحداث أمر لم يكن في موجود الشيء، قاله الحرالي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يضيف بُعد الاستحداث والطُّروء"

    - lemma: "مَزِيد"
      confirm:
        - text: "«من كلِّ شيءٍ: الزيادة فيه، والاستكثار منه»"
          source: "المعجم الكبير (OCR)"
      contradicts:
        - text: "«(في علم الصرف): الاسم أو الفعل الذي اتصلت به أحرف الزيادة. عكس المجرّد»"
          source: "المعجم الكبير (OCR)"
          conflict: "المعنى الاصطلاحي الصرفي غالب وقد يلتبس"
      expands:
        - text: "«يَوْمَ نَقُولُ لِجَهَنَّمَ هَلِ امْتَلَأْتِ وَتَقُولُ هَلْ مِنْ مَزِيدٍ» (ق/٣٠)"
          source: "شاهد قرآني"
          addition: "ورد في القرآن بمعنى الزيادة المطلوبة"

    - lemma: "عِلَاوَة"
      confirm:
        - text: "«من كل شيء: ما زاد عليه»"
          source: "المعجم الوسيط (OCR)"
        - text: "«ما يوضع على البعير بعد تمام حمله من سقاء وغيره»"
          source: "المعجم الوسيط (OCR)"
        - text: "«للعامل والمستخدم: ما يُزاد على مرتبه الأصلي كلّ مدّة معينة» (محدثة)"
          source: "المعجم الوسيط (OCR)"
        - text: "«علاوة» = increment"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
      expands:
        - text: "«والعِلاوة: ما يُحمل على البعير بعد تمام الوِقر»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الدلالي: ما يُعلى فوق الشيء بعد اكتماله"

    - lemma: "كَسْب"
      contradicts:
        - text: "«(كَسَبَ) الكاف والسين والباء أصل صحيح، وهو يدلّ على ابتغاء وطلب وإصابة. فالكسب من ذلك»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدلّ على الطلب والسعي لا على الكمية المضافة"
        - text: "«الكسب: طلب الرزق. وأصله الجمع»"
          source: "صحاح الجوهري"
          conflict: "المعنى الأساسي هو طلب الرزق لا المقدار الزائد"
      expands:
        - text: "«كسب» = gain (في مجال الاستشعار والكهرباء: زيادة في قدرة إشارة)"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          addition: "الاستخدام التقني الحديث بمعنى الكسب/الربح الكمّي مقصور على مجالات محددة"

    - lemma: "تَزَايُد"
      confirm:
        - text: "«تزايد» = increment"
          source: "مسرد الهندسة الكهربائية (ARABTERM)"
      contradicts:
        - text: "«تزايد طبيعي» = natural increase — مصطلح مركب يدلّ على عملية التزايد لا على الكمية"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "يدلّ على عملية الزيادة التدريجية لا على المقدار المضاف ذاته"

stage3_analysis:
  per_lemma:
    - lemma: "إِضَافَة"
      decision: confirmed
      decision_reason: "رغم أن المعنى الأصلي نحوي/فلسفي، فإن الاستخدام الحديث للفظ بمعنى «ما يُضاف من كمية» شائع ومثبت في معاجم المصطلحات المتعددة (القانون، الطباعة، اللسانيات)، وهو توسّع دلالي مقبول من المعنى الأصلي «ضمّ شيء إلى شيء»"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على فعل الإضافة ونتيجته (الشيء المُضاف)، وتحمل بُعداً إرادياً: شيء أُضيف قصداً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِضَافَة"

    - lemma: "زِيَادَة"
      decision: confirmed
      decision_reason: "مؤكَّدة بقوة من المعجم الوسيط والكبير والمناوي والتهانوي؛ «ما زاد على الشيء» تطابق تعريف المجموعة تماماً"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على المقدار الزائد بصورة عامة سواء أكان مقصوداً أم طبيعياً، وهي أعمّ من إضافة وعلاوة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زِيَادَة"

    - lemma: "عِلَاوَة"
      source: stage1
      decision: confirmed
      decision_reason: "مؤكَّدة من المعجم الوسيط بمعنيين مطابقين: «من كل شيء: ما زاد عليه» و«ما يُزاد على المرتب». وهي مثبتة في معجم الرياضيات بمعنى increment. تضيف فارقاً دلالياً واضحاً عن زيادة وإضافة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على المقدار الذي يُضاف فوق الأصل المكتمل (كالعلاوة على المرتب أو على الحِمل)، فيها دلالة التتميم والاستزادة فوق الكفاية"
      actions:
        - command: create_entry
          params:
            lemma: "عِلَاوَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَزِيد"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «الزيادة فيه والاستكثار منه» في المعجم الكبير، فإن اللفظ يدلّ في الغالب على حالة الزيادة أو طلبها (هل من مزيد؟) لا على المقدار المضاف ذاته. كما أن المعنى الصرفي الاصطلاحي غالب ويُحدث التباساً"

    - lemma: "كَسْب"
      source: stage1
      decision: removed
      decision_reason: "الجذر يدلّ على الابتغاء والطلب والإصابة لا على الكمية المضافة. واستخدامه بمعنى gain في المجالات التقنية (الكهرباء، الاستشعار) مقصور ولا يعمّم على مفهوم «كمية مضافة»"

    - lemma: "تَزَايُد"
      source: stage1
      decision: removed
      decision_reason: "يدلّ على عملية الزيادة التدريجية (المصدر) لا على المقدار المضاف ذاته؛ لا يصلح مرادفاً لمفهوم الكمية"

