stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (استعصاء، جموح) دقيقة، لكن المجموعة تفتقر إلى مرادفات تراثية قوية مثل 'شُمُوس' أو 'حُرُون'."
    observations: "المفهوم يشير إلى خصلة نفسية أو سمة موضوعية تجعل الشيء أو الشخص عصيّاً على القياد أو التأثير. المصطلحات العربية غنية بالاستعارات المستمدة من حراد الدواب (الخيل والإبل) للتعبير عن هذا المفهوم."
  blind_candidates:
    - lemma: "اِسْتِعْصَاء"
      generation_method: ishtiqaq
      justification: "المصدر من الفعل استعصى، وهو التعبير المعاصر الأشيَع لوصف الحالات أو الأشخاص الذين يصعب التعامل معهم أو السيطرة عليهم."
    - lemma: "جُمُوح"
      generation_method: majaz
      justification: "استعارة من فرس جموح الذي يغلب صاحبه، وتستخدم لوصف الشخص الذي يركب هواه ولا ينقاد."
    - lemma: "عِنَاد"
      generation_method: ishtiqaq
      justification: "الميل عن الطريق المستقيم والمخالفة المتعمدة، وهو جوهر صعوبة التأثير في الشخص."
    - lemma: "شُمُوس"
      generation_method: majaz
      justification: "من شموس الدواب التي لا تستقر، وتستخدم لوصف الشخص عسر الصحبة الذي يصعب قياده."

stage2_evidence:
  per_lemma:
    - lemma: "استعصاء"
      confirm:
        - text: "«(2) عِناد (2) استعصاء المرض على العِلاج»"
          source: "المورد الحديث"
        - text: "«استعصاء: تعذّر شحن السِّلاح الناريّ أو انطلاق النّار منه»"
          source: "المورد الحديث"
    - lemma: "جموح"
      confirm:
        - text: "«جَمُوح: الراكب هواه فلا يمكن رده، والمسرع إلى الشيء، والفرش العاتي عن أمر صاحبه حتى يغلبه»"
          source: "موسوعة السلطان قابوس"
        - text: "«(جَمَحَ) الْجِيمُ وَالْمِيمُ وَالْحَاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، وَهُوَ ذَهَابُ الشَّيْءِ قُدُمًا بِغَلَبَةٍ وَقُوَّةٍ»"
          source: "مقاييس اللغة"
    - lemma: "عِنَاد"
      confirm:
        - text: "«العناد: الاعوجاج والخلاف، وقيل المبالغة في الإعراض ومخالفة الحق»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«العناد: رد الحق مع العلم بأنه حق»"
          source: "دستور العلماء"
    - lemma: "شُمُوس"
      confirm:
        - text: "«الشَّمُوس: النفور العسر الصحبة. يقال: رجل شموس، وامرأة شموس»"
          source: "المعجم الوسيط"
        - text: "«الشَّمُوسُ مِنَ الدَّوَابِّ: الَّذِي لَا يَكَادُ يَكَادُ يَسْتَقِرُّ... وَرَجُلٌ شُمُوسٌ، إِذَا كَانَ لَا يَسْتَقِرُّ عَلَى خُلُقٍ، وَهُوَ إِلَى الْعُسْرِ مَا هُوَ»"
          source: "مقاييس اللغة"

