        examples:
          - text: "أدى استعصاءُ المسألةِ الرياضيةِ إلى حيرةِ الباحثينَ لسنوات."
            type: usage
      - lemma: "جُمُوح"
        examples:
          - text: "حاولَ الوزيرُ كبْحَ جُموحِ التضخُّمِ الاقتصاديِّ دونَ جدوى."
            type: usage
      - lemma: "عِنَاد"
        examples:
          - text: "واجهَ المفاوضونَ عِناداً شديداً من الطرفِ الآخرِ حالَ دُونَ الاتفاق."
            type: usage
      - lemma: "شُمُوس"
        examples:
          - text: "عُرفَ القائدُ بشُمُوسِهِ وعُسْرِ انقِيادِهِ لآراءِ مستشاريه."
            type: usage
    actions:
