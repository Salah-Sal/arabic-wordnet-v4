          text: "صِفةُ ما يَصْعُبُ قِيادُهُ أوِ التَّأثيرُ فيهِ أوِ السَّيطَرَةُ عَلَيْه؛ لِصلابَتِهِ أوِ اندِفاعِهِ أوِ امتِناعِهِ."
