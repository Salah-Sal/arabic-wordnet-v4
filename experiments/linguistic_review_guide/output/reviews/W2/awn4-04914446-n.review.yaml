    current: "سمة صعوبة التأثير أو السيطرة"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لكن يحتاج صياغة معجمية أكثر دقة ووضوحاً."
    authored:
      - type: terminological
        text: "صِفةُ ما يَصْعُبُ قِيادُهُ أوِ التَّأثيرُ فيهِ أوِ السَّيطَرَةُ عَلَيْه؛ لِصلابَتِهِ أوِ اندِفاعِهِ أوِ امتِناعِهِ."
