# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06635216-n (telegram / برقية)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تلغراف» تشير أساساً إلى جهاز/نظام الاتصال لا إلى الرسالة ذاتها، وقد تسبب التباساً دلالياً مع المجموعة التي تعني الرسالة (telegram)"
      - "اللمّتان بلا تشكيل كامل في المدخل الأصلي"
    observations: "المجموعة تمثّل مفهوم الرسالة المُرسَلة عبر جهاز التلغراف (البرقية)، وهو مفهوم له تعبير عربي أصيل مشتق من جذر (ب ر ق) الدال على اللمعان. اللمّة «برقية» هي المصطلح المعياري المعتمد في المعاجم العربية الحديثة. أما «تلغراف» فهو تعريب للكلمة الأجنبية telegraph ويطلق أولاً على الجهاز/النظام، ولا يُطلق على الرسالة إلا مجازاً أو بالتوسع."
  blind_candidates:
    - lemma: "بَرْق"
      generation_method: majaz
      justification: "المعجم الوسيط يعرّف «التلغراف» بـ«البرق»، فالبرق يُستعمل مجازاً للدلالة على نظام الاتصال البرقي ورسائله، من باب إطلاق اسم الآلة على ناتجها"
    - lemma: "تِلْغْرَام"
      generation_method: taarib
      justification: "تعريب مباشر للكلمة الإنجليزية telegram التي تعني الرسالة تحديداً، تمييزاً عن telegraph الذي يعني الجهاز"
    - lemma: "رَسَالَة بَرْقِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من «رسالة» و«برقية» بمعنى الرسالة المنقولة بالبرق، يوضح المعنى صراحة"
    - lemma: "مُبْرَقَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الفعل «أَبْرَقَ» على وزن مُفْعَلَة، بمعنى الرسالة التي أُبرقت أي أُرسلت بالبرق"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بَرْقِيَّة"
      confirm:
        - text: "«رسالة ترسل من مكان إلى آخر بوساطة جهاز التلغراف»"
          source: "المعجم الوسيط"
        - text: "«( Telegram ) : رسالة تبلغ بالتلفراف»"
          source: "المعجم الكبير"
        - text: "«(البرقية) رِسَالَة ترسل من مَكَان إِلَى آخر بوساطة جهاز التلغراف (مج)»"
          source: "المعجم الوسيط (حوراماني)"
      expands:
        - text: "«يقومُ الإتصال بين مُشتركين داخل الشبكة على تبادُل البرقيات. ويتمُ إعدادُ هذه البرقيات من قِبل المُرسل، ومن ثُّم إرسالُها إلى المُستقبِل الذي يقوم بتفسير مُحتوى البرقية...»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          addition: "يوسّع المفهوم ليشمل البرقيات الرقمية ووحدات البيانات في شبكات الاتصال"

    - lemma: "تِلْغْرَاف"
      confirm:
        - text: "«2 - برقِيّة، رسالة تُرسل من مكان إلى آخر بواسطة جهاز البرق ‹أرسل تلِغرافًا إلى أهلِه›»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      contradicts:
        - text: "«البرق»"
          source: "المعجم الوسيط"
          conflict: "الوسيط يعرّف التلغراف بأنه «البرق» أي النظام/الجهاز لا الرسالة"
        - text: "«نظامٌ للاتصالات السِّلكية واللاسلكية, يتم به إرسال الرسائل باستعمال إشارات مصطلح عليها تنتقل عبر قناة إرسال بِشَفْرَةٍ من نقطة وشرطة كهربائيا إلى مسافات بعيدة, وتستقبل على شرايط ورقية»"
          source: "المعجم الكبير"
          conflict: "الكبير يعرّفه صراحة بأنه نظام اتصالات لا رسالة"

    - lemma: "بَرْق"
      confirm:
        - text: "«البرق»"
          source: "المعجم الوسيط (تعريف التلغراف)"
      contradicts:
        - text: "«الْبَرْقُ وَمِيضُ السَّحَابِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المعنى الأصلي للبرق هو وميض السحاب، واستعماله بمعنى التلغراف/البرقية مجاز حديث لا يُنبئ عنه السياق بلا قرينة"

    - lemma: "تِلْغْرَام"
      evidence_status: "no_material_found"

    - lemma: "رَسَالَة بَرْقِيَّة"
      contradicts:
        - text: "«translation_en: day letter»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          conflict: "المركب مسجّل في ArabTerm بمعنى day letter لا telegram"

    - lemma: "مُبْرَقَة"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "بَرْقِيَّة"
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل مشتق من جذر (ب ر ق) على وزن فَعْلِيَّة (مصدر صناعي)، موثّق في المعجم الوسيط والمعجم الكبير ومعاجم المصطلحات الحديثة بالدلالة المطلوبة تماماً. هو المصطلح المعياري المعتمد للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الفصيح المعياري المعتمد في المجامع اللغوية العربية، يدل على الرسالة تحديداً لا على الجهاز أو النظام"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَرْقِيَّة"

    - lemma: "تِلْغْرَاف"
      decision: confirmed
      decision_reason: "رغم أن المعنى الأول للتلغراف هو الجهاز/النظام، فإن معجم اللغة العربية المعاصرة يسجّل له معنى ثانياً صريحاً هو «برقية، رسالة تُرسل من مكان إلى آخر بواسطة جهاز البرق» مع شاهد استعمالي. وهذا الاستعمال المجازي شائع في الاستعمال العربي الحديث."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تعريب دخيل من الإنجليزية، يُستعمل في السياقات غير الرسمية أو العامية، ويحمل طابعاً تاريخياً أكثر من «برقية» التي هي المصطلح الفصيح المعتمد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تِلْغْرَاف"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بَرْق"
      source: stage1
      decision: removed
      decision_reason: "معناه الأصلي وميض السحاب، واستعماله بمعنى نظام التلغراف مجاز حديث مقصور على سياق المصطلحات التقنية ولا يدل على الرسالة بذاته. إدراجه يسبب التباساً مع المعنى الطبيعي الأصلي."
      evidence_assessment:
        case: mixed

    - lemma: "تِلْغْرَام"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي عربي لهذا اللفظ. التعريب المستقر في العربية هو «تلغراف» لا «تلغرام»."
      evidence_assessment:
        case: no_material

    - lemma: "رَسَالَة بَرْقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المركب مسجّل في ArabTerm بمعنى day letter لا telegram، وهو تركيب وصفي حر يمكن إبدال مكوّناته بمرادفات (خطاب برقي مثلاً) فلا يُعدّ مصطلحاً مسكوكاً. كما أنه يكرر الجنس القريب (رسالة) الموجود في تعريف المجموعة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُبْرَقَة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على استعمالها اسماً بمعنى البرقية. وزن مُفْعَلَة اسم مفعول يحتاج إلى سياق فعلي ولم يتلقَّ تثبيتاً معجمياً."
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
