      - "طَبِيعَة تحمل اشتراكاً لفظياً مع «الكون الخارجي» وعلم الفيزياء، مما يستوجب تأطير الحقل الدلالي المقصود"
    observations: >
      المجموعة تُعالج مفهوم «الطابع الشخصي» (character/nature) بمعنى مجموع الصفات
      العاطفية والفكرية الراسخة التي تُلازم الفرد وتُحدد سلوكه المميَّز. الألفاظ الثلاثة
      الموجودة (سجية، طبع، طبيعة) أصيلة وفصيحة ومتقاربة في الدلالة؛ بيد أن الفارق بينها
      دقيق: السجية هي ما استقرّ وثبت في الطبع، والطبع هو الصيغة الجوهرية التي طُبع
      الإنسان عليها كما يُطبَع السيف وتُختم العملة، وطبيعة أعمُّ منهما وتصحّ للإنسان
      وسائر الكائنات والمواد. اللمّة الأوفى تمثيلاً للبُعد الوظيفي (الصدور عن الطبع في
      الفعل) هي «شاكلة» بشاهدها القرآني المباشر. و«خيم» (بكسر الخاء) لفظٌ معجمي
      مُثبَت بدلالة السجية في الكلام الفصيح.

  blind_candidates:
    - lemma: "شَاكِلَة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من «الشكل والمماثلة» إلى «الهيئة الداخلية التي يُشابه بها المرء
        نفسه في جميع أفعاله»؛ وهو استعمال ثبت بنصّ القرآن الكريم: ﴿قُلْ كُلٌّ يَعْمَلُ
        عَلَى شَاكِلَتِهِ﴾ (الإسراء: 84)، ووردت في معاجم كبرى بمعنى السجية والطبع.
    - lemma: "مَجْبَلَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن مَفْعَلة من جذر جبل (جُبِلَ الإنسانُ على كذا = فُطر وخُلق
        عليه)؛ يدلّ على المصدر الفطري الذي انبثق منه طبع الشخص وسجيته — «أصل
        الخلقة التي جُبل عليها».
    - lemma: "خِيم"
      generation_method: majaz
      justification: >
        إحياء للفظ عربي راسخ في مقاييس اللغة لابن فارس وعيون الشعر. المجاز: الخيمة
        هي ما يُبنى ليستقرّ فيه ويُقيم، فالخِيم هو «ما يُبنى عليه الإنسان من سجيته
        ويستقر»؛ قال حاتم الطائي: «ومَنْ يَبْتَدِعْ ما لَيْسَ مِنْ خِيمِ نَفْسِهِ
        يَدَعْهُ وَيَغْلِبْهُ عَلَى النَّفْسِ خِيمُهَا».
    - lemma: "غَرِيزَة"
      generation_method: ishtiqaq
      justification: >
        على وزن فَعِيلة من جذر غرز — الشيء المغروز في الإنسان فطرةً بلا إرادة؛
        قال ابن فارس في المقاييس: «الطبيعةُ غريزةٌ كأنها شيء غُرِزَ في الإنسان».
        وهي بمعنى القريحة والسجية في المعاجم الكلاسيكية.


