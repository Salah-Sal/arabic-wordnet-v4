# مراجعة المجموعة الترادفية: awn4-13837242-n
# المفهوم: العلاقة بين الزوجة والزوج (marital relationship)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (عَلَاقَة زَوْجِيَّة)، وهي تركيب وصفي، ويمكن إثراؤها بمرادفات أخرى"
      - "التعريف العربي مقتضب جداً ولا يفرّق بين العلاقة الزوجية كرابطة قانونية/اجتماعية وبين الزواج نفسه"
    observations: "المفهوم يشير إلى الرابطة القائمة بين الزوجين بوصفها علاقة مستمرة، لا إلى عقد النكاح أو حفل الزواج. الفَرْق الأُمّ (hypernym) هو عَلَاقَة أُسَرِيَّة / قَرَابَة، مما يؤكد أن المقصود العلاقة الاجتماعية لا العقد الشرعي. المفهوم متجذر في الثقافة العربية وله ألفاظ متعددة."
  blind_candidates:
    - lemma: "عِشْرَة زَوْجِيَّة"
      generation_method: tarkib
      justification: "العِشرة في العربية هي المخالطة والمصاحبة (المعجم الوسيط)، وإضافتها إلى (زوجية) تنتج مركباً وصفياً يدل على المعاشرة بين الزوجين"
    - lemma: "رَابِطَة زَوْجِيَّة"
      generation_method: tarkib
      justification: "الرابطة هي العلاقة والوصلة بين الشيئين (المعجم الوسيط)، وتركيبها مع (زوجية) يعطي مصطلحاً يركّز على البُعد الرابط بين الزوجين"
    - lemma: "زَوْجِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (زَوْج) على وزن فَعْلِيَّة، يدل على حالة الارتباط الزوجي ككل. جاء في المعجم الوسيط: بينهما حق الزوجية"
    - lemma: "نِكَاح"
      generation_method: ishtiqaq
      justification: "مصدر (نَكَحَ) من جذر ن-ك-ح، يُستعمل في الفقه بمعنى عقد الزواج والعلاقة الزوجية معاً، لكنه أقرب إلى العقد منه إلى العلاقة المستمرة"

stage2_evidence:
  per_lemma:
    - lemma: "عَلَاقَة زَوْجِيَّة"
      confirm:
        - text: "«العلاقة: الصداقة والحب اللازم للقلب وما تتبلغ به البهائم من الشجر وما يكتفى به من العيش وما تعلق به الإنسان من صناعة وغيرها و(في علم البيان) المناسبة بين المعنى الحقيقي والمعنى المجازي»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الزَّوْجِيَّة (مصدر صناعي) بمعنى الزواج يقال بينهما حق الزوجية وما زالت الزوجية بينهما قائمة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«زَوْجيّ: خاصّ بالعلاقة بين الزّوج وزوجته»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«العلاقة: بالفتح رابطة بازبستن معنى بمعنى وبالكسر رابطة بازبستن جسم بجسم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التهانوي يفرّق بين عَلاقة (بالفتح) للمعاني وعِلاقة (بالكسر) للمحسوسات، والمقصود هنا عَلاقة بالفتح"

    - lemma: "عِشْرَة زَوْجِيَّة"
      confirm:
        - text: "«العِشرة: المخالطة والمصاحبة»"
          source: "المعجم الوسيط"
        - text: "«العِشرة: بالكسر المخالطةُ والصُّحبةُ والعشيرُ المعاشرُ والقبيلة والصديق والزوج»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: "«العشرة: بكسر العين وسكون الشين المعجمة وبالفارسية: إحسان المعاشرة. وعند الصوفية هي: لذّة المشاهدة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "العِشرة عامة في المخالطة وليست خاصة بالزوجين، لكنها واردة في سياق الزوجية عند الفقهاء"

    - lemma: "رَابِطَة زَوْجِيَّة"
      confirm:
        - text: "«رَابِطَةٌ زَوجِيَّة» (مقابل conjugal bond)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«الرابطة: العلاقة والوصلة بين الشيئين»"
          source: "المعجم الوسيط"
        - text: "«الرابطة: العُلْقَة والوُصْلَة بين الشيئين»"
          source: "المعجم الكبير"

    - lemma: "زَوْجِيَّة"
      confirm:
        - text: "«الزَّوْجِيَّة (مصدر صناعي) بمعنى الزواج يقال بينهما حق الزوجية وما زالت الزوجية بينهما قائمة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الزَّوْجِيَّة: الزَّوَاجُ. يقالُ: بينهما حَقُّ الزَّوْجيَّة, وما زالـت الزَّوْجِيَّةُ بينهما قائمة»"
          source: "المعجم الكبير"
        - text: "«زَوْجِيَّة: من (ز و ج) نسبة إلى الزَوج بمعنى الزواج»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«الزَّواج؛ الزَّوجيّة. out of wedlock: خارجَ نطاق الزَّوجيّة»"
          source: "المورد الحديث (2008)"
          addition: "المورد يساوي بين الزواج والزوجية، مما يشير إلى أن الزوجية تشمل حالة الارتباط الزوجي ككل"

    - lemma: "نِكَاح"
      contradicts:
        - text: "«النكاح: هو في اللغة الضم والجمع، وفي الشرع: عقد يرد على تمليك منفعة البضع قصداً»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "النكاح في الاصطلاح الشرعي هو العقد لا العلاقة المستمرة"
        - text: "«النكاح: إيلاج ذكر في فرج ليصير بذلك كالشيء الواحد»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "النكاح يدل على الفعل الجسدي أو العقد، لا على العلاقة الاجتماعية القائمة بين الزوجين"
      expands:
        - text: "«النِّكاحُ: الوَطْءُ، والعَقْدُ لَهُ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "القاموس يجعل النكاح مشتركاً بين الوطء والعقد، دون دلالة على العلاقة المستمرة"

