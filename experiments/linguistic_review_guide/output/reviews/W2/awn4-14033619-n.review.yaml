# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف «حالة عدم النشاط» دائري يُعرِّف الشيء بنقيضه وهو قصير يفتقر إلى الجنس القريب والفصل النوعي"
      - "اللمّة «عدم نشاط» تعبير وصفي حرّ يفشل اختبار السكّ وليس مصطلحاً مسكوكاً: يمكن إبدال «عدم» بـ«انعدام» أو «غياب» فيبقى الوصف صالحاً"
      - "جميع اللمّات الثلاث مكتوبة بلا تشكيل"
      - "اللمّتان «جمود» و«خمول» تحملان ظلالاً دلالية متباينة قد تُبعدهما عن الدلالة الجوهرية لـinactivity العامة"
    observations: >
      المجموعة تمثّل المفهوم العام لـ"inactivity"، أي الحالة التي يغيب فيها الفعل والحركة.
      اللمّتان «جمود» و«خمول» عريقتان في العربية، غير أن لكلٍّ منهما طيفها الدلالي الخاص:
      «الجمود» مأخوذ من تجمّد المائع ويُركّز على الثبات الصلب المطبق، في حين أن أصل
      «الخمول» هو خفاء الذكر وانعدام الشهرة، وإن كان المعنى الثانوي للكسل والتراخي ثابتاً
      في الاستعمال الحديث. أما «عدم نشاط» فهو تركيب وصفي عادي لا يرقى لمستوى المصطلح
      المسكوك وينبغي حذفه.
  blind_candidates:
    - lemma: "تَعَطُّل"
      generation_method: ishtiqaq
      justification: "جذر (عطل)، وزن تَفَعُّل للتحوّل والانقطاع. يدلّ على البقاء دون عمل أو نشاط، مأخوذ من عُطِّلت البئر إذا أُهملت"
    - lemma: "رُكُود"
      generation_method: ishtiqaq
      justification: "جذر (ركد)، وزن فُعُول للمصدر. أصله ركود الماء وسكونه، ويدلّ على الهدوء والثبات وانقطاع الحركة"
    - lemma: "سُبَات"
      generation_method: majaz
      justification: "في الأصل نوم ثقيل أو راحة، يُستعار مجازاً لحالة الخمود الكامل وغياب الفاعلية بالكلية، والجذر (سبت) يدل على راحة وسكون"
    - lemma: "خُمُود"
      generation_method: ishtiqaq
      justification: "جذر (خمد)، وزن فُعُول. يدلّ على سكون الحركة وانطفاء النشاط كانطفاء لهب النار، وهو إحياء دلالي من الإزاحة الحسية إلى المعنوي"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "جمود"
      confirm:
        - text: "«الجمود: هيئة حاصلة للنفس بها يقتصر عن استيفاء ما ينبغي وما لا ينبغي»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«الجمود: هو هيئة حاصلة للنفس بها يقتصر على استيفائها ما ينبغي وما لا ينبغي»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413م)"
        - text: "«[في الانكليزية] Rigidity، immobility، inertia، catatonia»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
      expands:
        - text: "«الجمود: بضم الجيم والميم عند الأطباء علة إذا عرضت للإنسان بقي على الحالة التي أدركته عليها إما جالساً أو قائماً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يؤكد أن الجمود حالة سكون وانعدام نشاط حركي تاماً"
        - text: "«جمود» = inertia"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC (arabterm)"
          addition: "الترجمة الإنجليزية inertia قريبة من inactivity في السياق العام"

    - lemma: "خمول"
      confirm:
        - text: "«الخمول: خفاء القدر والذكر، وأصله السكون والخفاء، ومنه خمل البساط لأنه يستر ما خلفه»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«خمول، غير نشط» = inactivated"
          source: "موسوعة الكهرباء IEC 60050 (arabterm)"
      expands:
        - text: "«خمول، فتور» = apathy"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          addition: "يُشير إلى استعمال الخمول في سياق انعدام الاستجابة والفتور"
        - text: "«خمول، قصور ذاتي، عطالة» = inertia"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يؤكد الدلالة على السكون وانعدام التفاعل في السياق العلمي"
        - text: "«لخمول» = lethargy"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC (arabterm)"
          addition: "ترجمة lethargy تشير إلى الخمول والفتور وانعدام الطاقة"

    - lemma: "عدم نشاط"
      evidence_status: "no_material_found"

    - lemma: "تَعَطُّل"
      contradicts:
        - text: "«إخفاق برنامج أو مِسْوَق قرص. يؤدي تعطّل البرنامج إلى فقدان جميع المعطيات غير المخزّنة»"
          source: "معجم مصطلحات المعلوماتية (2000) — arabterm"
          conflict: "يدل على الإخفاق التقني والعطل لا على مجرد حالة عدم النشاط"
        - text: "«تعطل: بقي بلا عمل والمرأة فقدت الحليّ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعنى الأصيل الخلوّ من الزينة والفراغ من العمل القسري، لا الحالة الإرادية لعدم النشاط"
        - text: "«تعطل» = breakdown / failure / incident"
          source: "المعجم الموحد لمصطلحات المياه (2000) — arabterm"
          conflict: "الترجمة الإنجليزية تشير إلى الفشل والعطل لا inactivity"

    - lemma: "رُكُود"
      expands:
        - text: "«الرُّكودُ: السُّكونُ والثَّباتُ»"
          source: "القاموس المحيط للفيروزآبادي (ت 1414م)"
          addition: "الأصل اللغوي (السكون) يتقاطع مع عدم النشاط"
        - text: "«ركود» = stagnation"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)، والتجارة والمحاسبة (1995)، والجيولوجيا (2000) — arabterm"
          addition: "stagnation أقرب إلى الكساد منه إلى inactivity"
        - text: "«رُكود» = stasis"
          source: "المعجم الطبي الموحد (2009) — arabterm"
          addition: "stasis في الطب يعني توقف الدورة الدموية"
      contradicts:
        - text: "«في التجارة: recession، أحد أطوار الدورة التجارية، يتميز بانخفاض طفيف في مستوى النشاط الاقتصادي»"
          source: "المعجم الكبير — OCR"
          conflict: "الدلالة الاقتصادية الغالبة تُبعده عن المفهوم العام لـinactivity"

    - lemma: "سُبَات"
      contradicts:
        - text: "«السبات: نوم طويل غرق ثقيل، المراد بالطويل أن يكون زائد المقدار على النوم الطبيعي»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "يدل على فقدان الوعي والنوم العميق، وهي حالة أشد من مجرد عدم النشاط"
        - text: "«حالة يفقد فيها المريض وعيه فقداناً تاماً ولا يفيق منها بأقوى المنبهات، وهو خلاف الإغماء (مج)»"
          source: "المعجم الوسيط — OCR"
          conflict: "يصف حالة طبية محددة (فقدان الوعي) لا الحالة العامة لعدم النشاط"
        - text: "«سبات» = dormancy"
          source: "المعجم الموحد لمصطلحات المياه + AGROVOC — arabterm"
          conflict: "dormancy مفهوم بيولوجي متخصص لا يساوي inactivity العام"

    - lemma: "خُمُود"
      expands:
        - text: "«الخاء والميم والدال أصل واحد، يدل على سكون الحركة والسقوط. خمدت النار خموداً إذا سكن لهبها. وخمدت الحمى إذا سكن وهجها. ويقال للمغمى عليه: خمد»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي (سكون الحركة) يتقاطع مع عدم النشاط لكن يميل للانطفاء النهائي"
      contradicts:
        - text: "«الخُمُودُ: ضعف القوة الشهوية عن تناول ما ينبغي في الشرع»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
          conflict: "يدل على ضعف الشهوة الجنسية في الاصطلاح الفقهي، لا على عدم النشاط عموماً"
        - text: "«خمود» = damping"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989) — arabterm"
          conflict: "damping مصطلح فيزيائي متخصص (تخميد الاهتزازات) لا يساوي inactivity"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "جمود"
      decision: confirmed
      decision_reason: >
        موثّق في معاجم كلاسيكية وحديثة بدلالة قريبة من inactivity (الثبات، انعدام الحركة، سكون
        الحالة). اشتقاقه من جذر (جمد) الدال على تجمّد المائع يجعله صالحاً لمفهوم الحالة السكونية.
        التشابه الوظيفي مع inertia/immobility يُثبّت ملاءمته.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الثبات الصلب والانجماد المطبق، مأخوذ من صورة تجمّد السائل؛ يلائم سياقات
        الجمود التنظيمي والإداري والفكري أكثر من سياق الكسل الشخصي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُمُود"

    - lemma: "خمول"
      decision: confirmed
      decision_reason: >
        رغم أن الأصل اللغوي لـ«خمول» هو خفاء الذكر، فإن المعنى الثانوي (السكون، التراخي، انعدام
        الفعالية) ثابت في المعاجم الكلاسيكية والحديثة، وقد وردت الترجمات الإنجليزية في ARABTERM
        تشمل lethargy و inactivated وapathy. استعماله لوصف الأشخاص غير النشيطين شائع في
        العربية المعاصرة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الكسل والتراخي الشخصي والانزواء عن المشاركة؛ يُوصف به الأشخاص والكائنات
        الحية أكثر من الجمادات والأنظمة، ويحمل ظلاً نقدياً يتعلق بانعدام الهمّة لا مجرد التوقف.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُمُول"

    - lemma: "عدم نشاط"
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ يفشل اختبار السكّ: يمكن إبدال «عدم» بـ«انعدام» أو «غياب» فيبقى الوصف
        وافياً، مما يدلّ على أنه ليس وحدة معجمية ثابتة. لم يرد كمدخل مستقل في أي معجم من
        قاعدة البيانات (evidence_status: no_material_found). ويفشل اختبار التثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَعَطُّل"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم توثّق «تعطّل» بمعنى الإخفاق التقني (breakdown/failure) أو البقاء قسراً دون عمل،
        وكلاهما يحمل ظلّ الخلل لا مجرد الحالة الهادئة لعدم النشاط. مقاييس اللغة لابن فارس تُصرّح
        بأن الجذر (عطل) يدلّ على «خلو وفراغ» بمعنى التجريد لا الراحة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "رُكُود"
      source: stage1
      decision: removed
      decision_reason: >
        الأصل اللغوي (السكون) مناسب، لكن الاستعمال الغالب في المعاجم الحديثة والتقنية اقتصر على
        الدلالة الاقتصادية (stagnation/recession) مما يُعرّضه لالتباس دلالي إذا أُدرج في مجموعة
        inactivity العامة. ويُفضَّل حجزه لمجموعات السياق الاقتصادي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "سُبَات"
      source: stage1
      decision: removed
      decision_reason: >
        تُصرّح المعاجم بأن السبات نوم ثقيل أو فقدان للوعي (coma/deep sleep)، وهو حالة أشدّ
        وأخصّ من مجرد عدم النشاط. الدلالة الطبية والبيولوجية المتخصصة (dormancy, coma)
        تتعارض مع المفهوم العام للمجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "خُمُود"
      source: stage1
      decision: removed
      decision_reason: >
        يدلّ على انطفاء النار وسكون لهبها، وهو يُشير إلى حالة نهائية أو شديدة من السكون لا إلى
        مجرد عدم النشاط. الاصطلاح الفقهي والفيزيائي يُبعدانه عن الاستعمال العام. الإبقاء عليه
        سيُلبس المجموعة طابع الانطفاء لا الهدوء.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "حالة عدم النشاط"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دائري يعرّف الشيء بنقيضه (عدم النشاط = نفي النشاط) دون إضافة معرفية.
        يفتقر إلى الجنس القريب المميَّز وإلى الفصل النوعي الذي يُفرّقه عن السكون أو الجمود أو
        الراحة. يُشبه ترجمةً حرفيةً لـ"the state of being inactive".
    authored:
      - type: terminological
        text: "حالٌ يتوقَّفُ فيها نَشاطُ الكائنِ أو المنظومةِ وينعدمُ فيها الفِعلُ والأثرُ"
