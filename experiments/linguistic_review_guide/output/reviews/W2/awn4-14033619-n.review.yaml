          differentia_present: true
          circular: false
      - type: linguistic
        text: "سُكونٌ وإِحجامٌ عن الفِعلِ والحركةِ، وقُعودٌ عمَّا يُستوجَبُ من عملٍ ونَشاط"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
