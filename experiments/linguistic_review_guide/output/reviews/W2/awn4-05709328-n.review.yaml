# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-05709328-n  |  ILI: i66873  |  POS: n
# (psychology) cognitive process / mental process / operation
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "مُعَالَجَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن مُفَاعَلَة من الجذر (ع-ل-ج) الدال على المزاولة والتمرّس؛
        "معالجة المعلومات" مصطلح راسخ في علم الحاسوب والنفس المعرفي للدلالة على
        العمليات الذهنية التي تُحوّل المُدخلات إلى مخرجات. يجتاز اختبار السكّ
        إذ لا يمكن إبدال (ع-ل-ج) بجذر آخر وإبقاء الدلالة الاصطلاحية ذاتها.
    - lemma: "سَيْرُورَة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من جذر (س-ي-ر) الدال على المضيّ والجريان؛ وزن (فَيْعُولَة)
        يمنح الكلمة طابع التدرج والاستمرارية. تُستخدم "سيرورة" في الأدبيات
        العربية كمقابل لـ "processus" الفرنسي و"process" الإنجليزي في اللسانيات
        وعلم النفس. تجتاز اختبار السكّ لكون البنية الصرفية نفسها تحمل الدلالة.
    - lemma: "مَسَار إِدْرَاكِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي: مَسَار (من س-ي-ر، مَفْعَل) + إِدْرَاكِيّ (نسبة إلى إدراك).
        "المسار" يُعبّر عن المسلك والمجرى الوظيفي، و"الإدراكي" يُحدّد مجاله
        النفسي-المعرفي. يُستعمل "مسار" في علم الأعصاب للدلالة على المسارات العصبية
        والوظيفية، و"الإدراكي" يُميّز الوصفَ عن "الذهني" بالتركيز على الإدراك.
    - lemma: "إِجْرَاء ذِهْنِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي: إِجْرَاء (من ج-ر-ي، مصدر أَجْرَى) + ذِهْنِيّ (نسبة إلى ذهن).
        "الإجراء" يُحيل إلى الخطوات المرتّبة ذات الأثر، وهو قريب من "operation"
        الإنجليزية. المركّب منتج في المنطق الرياضي وعلم الحاسوب ("إجراء حسابي")،
        وامتداده إلى الفضاء الذهني مقبول صرفياً ودلالياً.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "جميع اللمّات الثلاث خالية من التشكيل — يجب ضبطها بالحركات الكاملة"
      - "اللمّة المفردة «عملية» بلا قيد وصفي أشمل مما تستدعيه المجموعة؛ تشمل العمليات الجراحية والعسكرية والمالية"
      - "الجزء الثاني من التعريف «عملية تؤثر في المحتويات العقلية» يستخدم «عملية» دائرياً كونها من لمّات المجموعة ذاتها"
      - "لا يوجد تمييز صريح بين الفروق الدلالية للمّات الثلاث (عملية / عملية ذهنية / عملية معرفية)"
    observations: >
      تُعبّر المجموعة عن مفهوم العملية النفسية-المعرفية في علم النفس التجريبي
      والمعرفي. اللمّات الثلاث مقبولة وواردة في الأدبيات التقنية العربية؛ فـ"عملية
      ذهنية" موثّقة في معاجم الاستشعار عن بعد والإعلام، و"عملية معرفية" واردة في
      معاجم التربية. الجذر "عمل" عريق في العربية وعام في الدلالة الفعلية. يُلاحَظ
      أن المرشّح "معالجة" سُبق إلى تخصيصه في علم النفس الإكلينيكي بمعنى
      "cognitive therapy" لا "cognitive process"، مما يُوجب استبعاده من المجموعة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عملية"
      confirm:
        - text: "«جملة أعمال تُحدث أثراً خاصّاً مثل عملية جراحية»"
          source: "المعجم الوسيط (OCR)"
        - text: "«جملة أعمال تحدث أثراً خاصاً يقال عملية جراحية أو حربية أو مالية (محدثة)»"
          source: "المعجم الوسيط (Hawramani)"
        - text: "«العملية تطابق تنفيذ التعليمة؛ أحياناً كلمتا «عملية» و«تعليمة» تصبحان مترادفتين»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات 2011 (translation_en: operation)"
        - text: "«إجراء يمتد على مدى فترة زمنية محددة، وأثناء حدوثه ينشأ أو يتطور شيء ما تدريجياً»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة 1996 (translation_en: process)"
      expands:
        - text: "«إجمالي الأحداث المؤثرة بعضها على بعض في نظام ما، والتي تتسبب في تغيير أو نقل أو تخزين المادة أو الطاقة أو المعلومة أيضاً»"
          source: "مسرد الهندسة الكهربائية — Arabterm (translation_en: process)"
          addition: "يُضيف بُعد النظام والتفاعل بين المكونات، وهو ما يُغني التعريف النفسي للعملية المعرفية"
        - text: "«مرفوضة — لعدم ورودها في المعاجم القديمة. الصواب: فصيحة — اعتمدها مجمع اللغة المصري صيغةً للمصطلحات الحديثة (المصدر الصناعي)»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يُثبت أن «عملية» محدَثة مجمعية مقبولة فصيحة وليست دخيلة، وأن أصل وزنها من المصدر الصناعي"

    - lemma: "عملية ذهنية"
      confirm:
        - text: "«عملية ذهنية تجمع صورتين منظوريتين على شبكية العينين، بحيث تعطي رؤية لنموذج ثلاثي الأبعاد»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد 2000 (entry: دمج مجسامي، translation_en: stereoscopic fusion)"
        - text: "«عملية ذهنية يقوم بها المتلقي من أجل تمثّل مضامين الرسالة أو الخطاب»"
          source: "مسرد الإعلام والتواصل — Arabterm (entry: فهم، translation_en: comprehension)"

    - lemma: "عملية معرفية"
      confirm:
        - text: "«عملية معرفية و/أو مادية للحصول على المعرفة و/أو المهارات من خلال الدراسة والخبرة والتعليم أو مزيج منهما»"
          source: "مسرد التربية — Arabterm (entry: تعلم، translation_en: learning)"

    - lemma: "مُعَالَجَة"
      confirm:
        - text: "«لفظ عام يعبر عن مجموع العمليات الحسابية والمنطقية التي يقوم بها الحاسوب على معطيات محددة للحصول على نتائج محددة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات 2011 (translation_en: processing)"
      contradicts:
        - text: "«مُعالَجَةٌ مَعْرِفِيَّة» — مدخل مستقل (translation_en: cognitive therapy)"
          source: "المعجم الطبي الموحد 2009"
          conflict: >
            المصطلح المركّب «معالجة معرفية» سُبق إلى تخصيصه بمعنى «cognitive therapy»
            لا «cognitive process»؛ ولذا إضافة «معالجة» للمجموعة قد يُوقع في اشتراك
            لفظي مضلل مع المفهوم العلاجي الإكلينيكي في المجال النفسي
      expands:
        - text: "«الْعَيْنُ وَاللَّامُ وَالْجِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَمَرُّسٍ وَمُزَاوَلَةٍ — وَالْعِلَاجُ: مُزَاوَلَةُ الشَّيْءِ وَمُعَالَجَتُهُ»"
          source: "مقاييس اللغة لابن فارس (جذر علج)"
          addition: "الأصل اللغوي لـ«معالجة» هو المزاولة والتعامل المباشر مما يجعلها صالحة للتوسّع نحو «معالجة المعلومات»، غير أن التعارض الموثّق يُوجب الإحجام"

    - lemma: "سَيْرُورَة"
      contradicts:
        - text: "«في اللسانيات العامة، تطور تدريجي ومتتابع للغة وفقا لقوانين مطردة»"
          source: "المعجم الموحد لمصطلحات اللسانيات 2002 (translation_en: Process)"
          conflict: >
            الدلالة المعجمية الموثّقة لـ«سيرورة» مخصّصة للتطور اللغوي التاريخي
            (diachronic change)، وهذا تخصّص لساني مغاير لمجال العمليات النفسية
            المعرفية الذي تُعبّر عنه المجموعة

    - lemma: "مَسَار إِدْرَاكِيّ"
      evidence_status: "no_material_found"

    - lemma: "إِجْرَاء ذِهْنِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── عملية (موجودة) ──
    - lemma: "عملية"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة بقوة في المعجم الوسيط وعشرات المعاجم التقنية بمعنى process /
        operation، وهي المقابل العربي المعياري المُجمَّع. رغم اتساع دلالتها، فإن
        التخصيص يحصل بالسياق وبوجود اللمّات المقيّدة معها في المجموعة ذاتها.
        تحتاج إلى ضبط التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الأعم دلالةً بين لمّات المجموعة — تُعبّر عن جملة الأعمال ذات الأثر الخاص
        دون تقييد المجال؛ تُستخدم في التعبير العام عن النشاط النفسي حين لا تُراد
        الدقة الاصطلاحية الكاملة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّة"

    # ── عملية ذهنية (موجودة) ──
    - lemma: "عملية ذهنية"
      decision: confirmed
      decision_reason: >
        التركيب الوصفي (عملية + ذهنية) موثّق في مراجع تقنية عربية متعددة للدلالة
        على العمليات التي تجري في الذهن. يجتاز اختبار التثبيت المعجمي بوصفه وحدة
        اصطلاحية مستقرة. يحتاج إلى ضبط التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        أشد تخصصاً من "عملية" المجردة — يُقيّد الوصف "الذهنية" النشاطَ بمجاله
        الباطني النفسي ويُميّزه من العمليات المادية والإجرائية الخارجية
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّة ذِهْنِيَّة"

    # ── عملية معرفية (موجودة) ──
    - lemma: "عملية معرفية"
      decision: confirmed
      decision_reason: >
        التركيب موثّق في معاجم التربية وعلم النفس التطبيقي ويطابق المصطلح الإنجليزي
        "cognitive process" مطابقةً تامة. يجتاز اختبار السكّ وهو أدق مصطلحياً من
        "عملية ذهنية". يحتاج إلى ضبط التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الأدق تخصيصاً بين لمّات المجموعة — يُحيل "المعرفي" إلى منظومة تشغيل
        المعلومات والتمثيل الرمزي والذاكرة؛ وهو المصطلح المُفضَّل في علم النفس
        المعرفي وعلم الأعصاب تمييزاً للعمليات المنتمية إلى النظام المعرفي
        (cognition) دون سواها
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّة مَعْرِفِيَّة"

    # ── مُعَالَجَة (مرشّح المرحلة ١) ──
    - lemma: "مُعَالَجَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق "معالجة" بمعنى processing في تقنية المعلومات، فإن المصطلح المركّب
        "معالجة معرفية" سُبق إلى تخصيصه في المعجم الطبي الموحّد بمعنى "cognitive
        therapy" لا "cognitive process". إضافة "معالجة" للمجموعة يُوقع في اشتراك
        لفظي خطير في المجال النفسي. وجود "عملية معرفية" المقبولة يُغني عنها.

    # ── سَيْرُورَة (مرشّح المرحلة ١) ──
    - lemma: "سَيْرُورَة"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المعجمية الموثّقة تخصّ التطور اللغوي التاريخي في اللسانيات دون
        العمليات النفسية المعرفية. التوسيع إلى المجال النفسي غير مُثبَت في الأدبيات
        العربية المتخصصة، والتكلّف في إضافتها غير مبرَّر مع وجود "عملية معرفية".

    # ── مَسَار إِدْرَاكِيّ (مرشّح المرحلة ١) ──
    - lemma: "مَسَار إِدْرَاكِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا التركيب في قاعدة البيانات المعجمية. يفشل اختبار التثبيت
        المعجمي: يمكن إبدال "إدراكي" بـ"ذهني" أو "عقلي" ويبقى وصفاً حراً صالحاً،
        مما يدل على أنه عبارة وصفية مرتجلة لا مصطلح مسكوك.

    # ── إِجْرَاء ذِهْنِيّ (مرشّح المرحلة ١) ──
    - lemma: "إِجْرَاء ذِهْنِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا التركيب في قاعدة البيانات المعجمية. يفشل اختبار التثبيت
        المعجمي كسابقه: "إجراء ذهني / إجراء عقلي / إجراء نفسي" عبارات وصفية
        متبادلة لا تُشكّل وحدة اصطلاحية مستقلة. وجود "عملية" المُجمَّعة يُغني عن
        مصطلح جديد.


