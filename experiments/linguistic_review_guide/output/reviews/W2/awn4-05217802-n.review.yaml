# التعريف: صفات غير محددة مطلوبة للقيام بشيء ما أو لكي تكون شيئاً ما
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة مقومات تفتقر إلى شواهد معجمية في معنى الصفات الفطرية الكامنة؛ المعاجم تُثبتها بمعنى «الخشبة التي يمسكها الحرَّاث» أو «جهاز التسوية الكهربائي» أو «العنصر المكوِّن»، وكلها بعيدة عن المعنى المقصود"
      - "غياب التشكيل عن اللمّتين الموجودتين (طينة، مقومات)"
      - "التعريف الحالي ترجمة حرفية للإنجليزية، يفتقر إلى الصياغة المعجمية العربية الأصيلة"
    observations: "المجموعة تُعبِّر عن المفهوم الإنجليزي غير الرسمي 'stuff' بمعنى ما يتمتع به الشخص من طبيعة فطرية تُهيِّئه لشيء ما، كما في «هو مصنوع من طينة الأبطال». هذا مفهوم عربيٌّ أصيل يتجلى في كلمة طينة بمعنى الجِبِلَّة والخَلِيقَة، وفي سجية بمعنى الطبع الراسخ. أما مقومات فتُعبِّر عن العناصر الموضوعية المطلوبة لا عن الطبيعة الفطرية الكامنة غير المحددة، ما يجعلها أبعد عن المفهوم المقصود."
  blind_candidates:
    - lemma: "مَعْدِن"
      generation_method: majaz
      justification: "من العربية الأصيلة، يُستعمل مجازاً للدلالة على جوهر الشخص وأصله («فلان معدن الكرم»)؛ ينقل معنى المادة التي صُنع منها الشخص."
    - lemma: "سَجِيَّة"
      generation_method: ishtiqaq
      justification: "مشتق من جذر سجو على وزن فَعِيلَة، يدل على الطبيعة الراسخة والخُلُق الثابت في الشخص؛ قريب من معنى الصفات الفطرية الكامنة التي تُعرِّف الشخص."
    - lemma: "خَامَة"
      generation_method: majaz
      justification: "المادة الأولية قبل التصنيع؛ يُستعار للدلالة على ما أُودع في الشخص من قابليات خام لم تُصقل بعد («خامة ممثل جيد»)."
    - lemma: "قَرِيحَة"
      generation_method: ishtiqaq
      justification: "من جذر قرح، وزن فَعِيلَة، بمعنى الطبيعة الفطرية والملكة الكامنة؛ يُعبِّر عن الاستعداد الأصيل في الإنسان («جيد القريحة»)."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "طينة"
      confirm:
        - text: "«الْجِبِلَّةُ والْخِلْقَةُ (مجاز). يُقالُ: هو من الطِّينَةِ الأُولَى: على فِطْرَتِه. طِينَةُ الرَّجُلِ: خِلْقَتُه وأَصْلُه. يقال: له طينَةٌ طَيِّبَة: جِبِلَّة وخليقة»"
          source: "المعجم الكبير"
        - text: "«القطعة من الطين... الطبيعة»"
          source: "المعجم الوسيط"
        - text: "«طَانَهُ اللَّهُ تَعَالَى عَلَى الْخَيْرِ، أَيْ جَبَلَهُ. وَكَأَنَّ مَعْنَاهُ مِنْ طِنْتُ الْكِتَابَ، أَيْ خَتَمْتُهُ؛ كَأَنَّهُ طَبَعَهُ عَلَى الْخَيْرِ وَخَتَمَ أَمْرَهُ بِهِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«إِنَّه لَيَابِسُ الطِّينَةِ: إِذا لم يكُنْ وَطِيئًا سَهْلًا»"
          source: "المعجم الكبير"
          addition: "يُظهر أن طينة الشخص هي ما يُقال فيه أصيل الطبع أو خشنه، مما يعزز الدلالة على الطبيعة الكامنة الكلية"

    - lemma: "مقومات"
      evidence_status: "no_material_found"

    - lemma: "مَعْدِن"
      confirm:
        - text: "«مكان كُلِّ شيء فيه أصله ومركزه... فلانٌ مَعْدِنُ الخَيْر والكَرَم: مجبول عليهما»"
          source: "المعجم الوسيط"
        - text: "«وَيَقِيسُونَ عَلَى ذَلِكَ فَيَقُولُونَ: هُوَ مَعْدِنُ الْخَيْرِ وَالْكَرَمِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«موضع استخراج الجَوْهر من ذهب ونحوه، الفلز (فى لغة العلم)»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأساسي مادي جيولوجي؛ الاستعمال المجازي في الصفات البشرية أداتيٌّ (يصف مصدر الصفة) لا وصفياً للصفات ذاتها"

    - lemma: "سَجِيَّة"
      confirm:
        - text: "«الطبيعة والخُلُق»"
          source: "المعجم الوسيط"
        - text: "«الطبيعَةُ. أو: ما دَامَ عليه الطَّبْعُ وَثَبَتَ. وقيل: الغريزة. وقيل: الخُلُق. عند فلاسفة الأخلاق: الملكة الراسخة في النفس التي لا تقبل الزوال بسهولة»"
          source: "المعجم الكبير"
        - text: "«السجية: العادة والخلق»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«السجيَّةُ: مَا سجي عَلَيْهِ الْإِنْسَان»"
          source: "معجم مقاليد العلوم للسيوطي"

    - lemma: "خَامَة"
      contradicts:
        - text: "«المادة الأولية التي توجد على حالتها الطبيعية قبل أن تعالج أو تصنع»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي مادي بحت؛ الاستعمال المجازي للطبيعة البشرية غير موثَّق في المعاجم الكلاسيكية ولا الحديثة"
        - text: "«خامة [مفرد]: مادّة أوليّة لم يجر عليها التشغيل ولم تعالج أو تصنَّع «خامة هذا القماش جيّدة»»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "حتى في المعجم المعاصر يقتصر المعنى على المادة المادية دون ذكر استعمال مجازي للطبيعة البشرية"

    - lemma: "قَرِيحَة"
      confirm:
        - text: "«من الإنسان: طبيعته التى جُبل عليها»"
          source: "المعجم الوسيط"
        - text: "«وَمن الْإِنْسَان طَبِيعَته الَّتِي جبل عَلَيْهَا وملكة يَسْتَطِيع بهَا ابتداع الْكَلَام وإبداء الرَّأْي (مو)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«القريحة: أول ما يخرج من البئر، ثم استعمل في محله مجازا، ثم استعير لطبيعة الإنسان من حيث صدور العلم منها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«وَالْأَصْلُ الثَّالِثُ الْقَرِيحَةُ، وَهُوَ أَوَّلُ مَا يُسْتَنْبَطُ مِنَ الْبِئْرِ، وَلِذَلِكَ يُقَالُ: فُلَانٌ جَيِّدُ الْقَرِيحَةِ؛ يُرَادُ بِهِ اسْتِنْبَاطُ الْعِلْمِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "القريحة في الأصل تدل على استنباط العلوم والقدرة الإبداعية، وهي أضيق من مفهوم المجموعة الذي يشمل أي صفات فطرية لا العلمية الإبداعية فحسب"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "طينة"
      decision: confirmed
      decision_reason: "موثَّقة في أمهات المعاجم الكلاسيكية والحديثة بمعنى الجِبِلَّة والخِلْقَة والطبيعة الفطرية، وهو صميم معنى المجموعة الترادفية. الاستعمال المجازي شائع وراسخ: «طِينَة الرجل: خلقته وأصله»؛ وتدعمه شواهد شعرية وافرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُشير إلى الجوهر الكلي للشخص وما جُبل عليه من طبيعة وأصل وقدرات كامنة — مع إيحاء باللاإرادية والأصالة الفطرية؛ تُستعمل في تقدير الشخص كلياً («من هذه الطِّينَة تُصنع الأبطال») دون تخصيص سمة بعينها."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طِينَة"

    - lemma: "مقومات"
      decision: removed
      decision_reason: "لا توجد شواهد معجمية تؤيد استعمال مقومات للدلالة على الصفات الفطرية غير المحددة؛ المعاجم لا تُثبت مقومات لهذا الغرض: مُقَوِّم يعني «الخشبة التي يمسكها الحراث» أو «جهاز التسوية الكهربائي» أو «العنصر المكوِّن». الاستعمال العامي المعاصر («لديه مقومات القائد») يُعبِّر عن متطلبات موضوعية قابلة للقياس لا عن الصفات الفطرية الكامنة التي تُحدِّدها المجموعة (الفارق الجوهري: الكلمة تعني «ما يُطلب» لا «ما فُطر عليه»)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سَجِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "موثَّقة توثيقاً قوياً في أمهات المعاجم الكلاسيكية والحديثة بمعنى «الطبيعة والخُلُق» و«ما دام عليه الطبعُ وثبت»؛ تُمثِّل من ألفاظ العربية الأصيلة المشهورة ذات الشواهد الشعرية الوافرة من عصر صدر الإسلام إلى الحديث. تُعبِّر عن بُعد الثبات والرسوخ في الصفات الفطرية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُركِّز على الطبع الثابت الراسخ الذي لا يتغير — وهو أكثر خصوصية في دلالة الثبات الأخلاقي والطبعي؛ تستعمل عادة لوصف سمة بعينها متجذِّرة في الشخص («الكرمُ سجيتُه»)، في حين تصف طِينَة الجوهر الكلي للشخص غير المُجزَّأ."
      actions:
        - command: create_entry
          params: {lemma: "سَجِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَعْدِن"
      source: stage1
      decision: removed
      decision_reason: "المعدن في الاستعمال المجازي يصف الشخص بوصفه مَنبتاً ومصدراً للصفة («فلان معدن الكرم») لا يصف الصفات ذاتها؛ فالبنية الدلالية تختلف: هو ظرف الصفة لا الصفة نفسها. علاوة على ذلك، الشواهد تُقيِّد استعماله بالمجاز المُقيَّد بالإضافة («معدن + الصفة») لا استعمالاً مستقلاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "خَامَة"
      source: stage1
      decision: removed
      decision_reason: "الشواهد المعجمية تقصر الخامة على المادة الأولية قبل التصنيع؛ والاستعمال المجازي للطبيعة البشرية غير موثَّق في أي من المعاجم المعتمدة، ولا تقوم هذه الكلمة باختبار السكّ: إذ يمكن إبدال «خامة» بـ«مادة» في نفس السياق دون أن تصبح مصطلحاً ثابتاً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "قَرِيحَة"
      source: stage1
      decision: removed
      decision_reason: "القريحة تخصُّ الملكة الإبداعية والاستعداد للاستنباط والتأليف حسب شاهد المقاييس («يُراد به استنباط العلم»)، وهي أضيق من مفهوم المجموعة الذي يشمل أي صفات فطرية غير محددة؛ فلا يقال «لديه قريحة الطبيب» بالمعنى الطبي ولا «قريحة الرياضي» في سياق الجسد."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


