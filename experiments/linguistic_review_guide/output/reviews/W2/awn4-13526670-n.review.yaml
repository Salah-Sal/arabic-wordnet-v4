      decision_reason: "المفهوم مُؤكَّد في معجمَين عربيَّين متخصصَّين موثوقَيْن: المعجم الطبي الموحد (2009) يُعيَار 'دَوْرَةُ الحَمْضِ الثُّلَاثِيِّ الكَرْبُوكْسِيل'، والمكنز الزراعي متعدد اللغات (AGROVOC) يُسجَّل 'دورة الحموض ثلاثية الكربوكسيل'، كلاهما مقابل 'tricarboxylic acid cycle'. المرشح يُقابل الاسم الثالث المفقود من المجموعة في OEWN. يُعتمَد بصيغته المُعيَارية في المعجم الطبي الموحد — لا بصيغة المرشح المبدئية."
      evidence_assessment:
