        mwe_type: idafi
      nuance_differentiation: "يُسمَّى المسار بالسمة الكيميائية البنيوية المشتركة بين وسيطاته الرئيسية (كونها حموضاً ثلاثية الكربوكسيل بثلاث مجموعات -COOH)؛ يُستخدم في الأدبيات الكيميائية الحيوية التقنية المتخصصة ويُبرز البنية الجزيئية لا الشخصية المكتشِفة ولا المنتَج الأول."
      actions:
        - command: create_entry
          params:
            lemma: "دَوْرَةُ الحَمْضِ الثُّلَاثِيِّ الكَرْبُوكْسِيل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "دَوْرَةُ فَوسفَرَةِ الأَسِيتِيل"
      source: stage1
      decision: removed
      decision_reason: "خطأ علمي جوهري: الدورة لا تُفسفر الأسيتيل مباشرة؛ إذ تُؤكسده لإنتاج ناقلات إلكترون مختزلة (NADH وFADH₂) وGTP، ثم تُؤدّي هذه الناقلات إلى توليد ATP عبر الفسفرة التأكسدية في سلسلة نقل الإلكترونات — وهي مرحلة مستقلة لاحقة. المصطلح مُضلِّل علمياً ولا شاهد له في المعاجم."
      evidence_assessment:
        case: no_material
      mwe_check:
