# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13526670-n  |  ILI: i107700  |  POS: n
# دورة حمض الستريك / دورة كريبس  (Krebs cycle)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة مكتوبة بدون تشكيل كامل"
      - "المجموعة تفتقر إلى المرادف الثالث المُعيَاري في المعاجم العربية المتخصصة: دورة الحمض الثلاثي الكربوكسيل (TCA cycle) الذي يُقابل 'tricarboxylic acid cycle' الإنجليزية"
      - "استخدام 'مركبات الأسيتيل' في التعريف صياغة ملتبسة علمياً — الأدق: 'مجموعة الأسيتيل' أو 'أسيتيل الإنزيم المساعد أ'"
    observations: "المجموعة تمثّل مساراً أيضياً بيوكيميائياً محورياً معروفاً بثلاثة أسماء مُتداوَلة في الأدبيات العلمية: الاسم المنسوب للعالم المكتشف (كريبس)، والاسم الكيميائي الوظيفي (حمض الستريك/السيتريك)، والاسم البنيوي (الحمض الثلاثي الكربوكسيل). اللمّتان الموجودتان تُغطّيان الأولَيْن فحسب. التعريف العربي الحالي دقيق علمياً لكنه مترجم بحرفية من الإنجليزية ويحتاج إعادة صياغة بأسلوب أكثر عربية."
  blind_candidates:
    - lemma: "دَوْرَةُ حَمْضِ اللَّيمُونِ"
      generation_method: tarkib
      justification: "حمض الليمون هو الاسم العربي الشائع لحمض الستريك (Citric acid) إذ تحتوي ثمرة الليمون على تركيز مرتفع منه، فتُقيم هذه التسمية ربطاً شفافاً بين المصطلح العلمي ومصدره الطبيعي المألوف. مركّب إضافي (دورة + حمض الليمون)."
    - lemma: "الدَّوْرَةُ التَّأَكسُدِيَّةُ الخَلَوِيَّةُ"
      generation_method: tarkib
      justification: "الدورة تنطوي على الأيض التأكسدي (oxidative metabolism) داخل الخلية الحية، فيكون الوصف التركيبي 'التأكسدية الخلوية' فصلاً نوعياً يُحدِّد طبيعتها الوظيفية ضمن بنية التركيب الوصفي."
    - lemma: "دَوْرَةُ الكَرْبُوكسِيلَاتِ الثُّلَاثِيَّةِ"
      generation_method: tarkib
      justification: "محاولة لترجمة 'tricarboxylic acid cycle' — وسيطات الدورة الرئيسية (حمض الستريك، والإيزوستريك، والكيتوغلوتاريك) تمتلك ثلاث مجموعات كربوكسيلية (-COOH)، مما يُسوِّغ تسمية الدورة بهذه السمة البنيوية. مركّب إضافي."
    - lemma: "دَوْرَةُ فَوسفَرَةِ الأَسِيتِيل"
      generation_method: tarkib
      justification: "الدورة تبدأ بمجموعة الأسيتيل وتُنتج مركبات فوسفات عالية الطاقة (ATP)؛ يُحاول هذا المركّب الإضافي إبراز العلاقة بين المادة الأولية (الأسيتيل) والمنتج الوظيفي (الفوسفرة)."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "دورة حمض الستريك"
      confirm:
        - text: "«دورة 'كريبس'، دورة حامض الستريك — دورة تفاعلات كيميائية حيوية تتحكم فيها بعض الإنزيمات الخاصة، يتحد فيها أستيل التميم 2 مع أكْسالات حامض الأسيتيل، ليولد حامض الستريك الذي يتحول ثانية إلى أُكْسالات حامض الأسيتيك بتأثير إنزيمات خاصة أخرى. — Krebs's cycle; citric acid cycle»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
      expands:
        - text: "«دَورَةُ حَمْضِ السِّيتْريك — citric acid cycle»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُعيَار في المعجم الطبي الموحد الصيغةُ 'السيتريك' بديلاً من 'الستريك' لتعريب 'citric'، مما يكشف تنوعاً في التعريب بين مصادر موثوقة. الصيغتان مقبولتان علمياً، غير أن المعجم الطبي الموحد يُرجَّح اعتماده معياراً."

    - lemma: "دورة كريبس"
      confirm:
        - text: "«دَورَةُ كريبس — Krebs cycle»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«دورة \"كربس\" — Krebs cycle (انظر cycle)»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«دورة 'كريبس'، دورة حامض الستريك — دورة تفاعلات كيميائية حيوية تتحكم فيها بعض الإنزيمات الخاصة...»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"

    - lemma: "دَوْرَةُ حَمْضِ اللَّيمُونِ"
      evidence_status: "no_material_found"

    - lemma: "الدَّوْرَةُ التَّأَكسُدِيَّةُ الخَلَوِيَّةُ"
      expands:
        - text: "«أيْض تأكسديّ — الأيض الناتج عن تفاعلات الأكسدة. oxidative anabolism»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "يُؤكد أن 'الأيض التأكسدي' مصطلح معجمي عربي راسخ، لكن الدورة بوصفها مساراً مستقلاً لا تحمل هذه التسمية الكُلِّية في أيٍّ من المعاجم."

    - lemma: "دَوْرَةُ الكَرْبُوكسِيلَاتِ الثُّلَاثِيَّةِ"
      confirm:
        - text: "«دَورَةُ الحَمْضِ الثُّلاَثِيِّ الكَرْبُوكْسيل — tricarboxylic acid cycle»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«دورة الحموض ثلاثية الكربوكسيل — tricarboxylic acid cycle»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"

    - lemma: "دَوْرَةُ فَوسفَرَةِ الأَسِيتِيل"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "دورة حمض الستريك"
      decision: confirmed
      decision_reason: "المصطلح موثَّق في المعجم الموحد لمصطلحات علم الوراثة (2009) بصيغة 'دورة حامض الستريك'، وتُؤكّده المعاجم الطبية العربية تحت مقابل 'citric acid cycle'. الاختلاف بين 'الستريك' و'السيتريك' خلافٌ تعريبي مقبول، والصيغة الأولى أقدم وأكثر تجذّراً في المعاجم العلمية العربية. اللمّة تحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُسمَّى المسار بأول مُركَّب يُنتجه (حمض الستريك)؛ تسمية كيميائية وظيفية تُبرز الهوية الجزيئية الأولى للدورة، يُفضَّل في الكيمياء الحيوية المتخصصة والنصوص الأكاديمية الكيميائية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَوْرَةُ حَمْضِ الستِّرِيكِ"

    - lemma: "دورة كريبس"
      decision: confirmed
      decision_reason: "المصطلح راسخ في ثلاثة مصادر طبية عربية موثوقة (المعجم الطبي الموحد 2009، معجم المصطلحات الطبية 1997، المعجم الموحد لمصطلحات علم الوراثة 2009)، وهو العَلَم الأكثر شيوعاً في الخطاب العلمي العربي لهذا المسار الأيضي. التعريب بـ'كريبس' مطّرد مع الفونيمات العربية. اللمّة تحتاج تشكيلاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُسمَّى المسار بمكتشفه البيوكيميائي البريطاني هانز كريبس (Hans Krebs) الذي وصفه عام 1937م وحاز جائزة نوبل عام 1953م؛ يشيع في الكتب المدرسية والنصوص العلمية التعليمية والتاريخية، وهو التسمية الأكثر تداولاً في العربية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَوْرَةُ كِرِيبْس"

    - lemma: "دَوْرَةُ حَمْضِ اللَّيمُونِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على هذه التسمية في أيٍّ من المعاجم العلمية العربية المتخصصة. المعاجم الطبية والعلمية الموحدة تعتمد حصراً 'الستريك' أو 'السيتريك' لتعريب 'citric'، لا 'الليمون'. فضلاً عن ذلك، 'حمض الليمون' اصطلاحٌ عامّي يحمل دلالة غذائية قد تُوحي بتضييق يتناقض مع السياق البيوكيميائي الكوني للمسار."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "الدَّوْرَةُ التَّأَكسُدِيَّةُ الخَلَوِيَّةُ"
