      - type: terminological
        text: "وَحْدَةُ قِيَاسٍ زَمَنِيَّةٌ تُسَاوِي جُزْءاً مِنْ تِرِيلْيُون (¹²⁻10) مِنَ الثَّانِيَة، أَيْ جُزْءاً مِنْ أَلْفٍ مِنَ النَّانُوثَانِيَة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
