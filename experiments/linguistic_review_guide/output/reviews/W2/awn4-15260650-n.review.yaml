# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15260650-n (picosecond)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية «بيكوثانية» مكتوبة ككلمة واحدة بلا تشكيل، بينما المصادر المعجمية المعتمدة (المعجم الطبي الموحد، معجم المعلوماتية) تكتبها بصيغة كلمتين «بيكو ثانية»"
      - "لا يوجد سوى لمّة واحدة في المجموعة وهي تعريب صرف، مع غياب أي بديل عربي أصيل"
    observations: "المفهوم وحدة قياس زمنية فرعية متناهية الصغر (١٠⁻¹² من الثانية). وحدات القياس المترية ذات السوابق (بيكو، نانو، ميكرو...) تُعرَّب عادةً تعريباً مباشراً لعدم وجود مقابل تراثي. المصطلح مستقر في الاستعمال العلمي العربي بصيغة «بيكو ثانية» (كلمتان) أو «بيكوثانية» (كلمة واحدة مدمجة)."
  blind_candidates:
    - lemma: "بِيكُوثَانِيَة"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي picosecond بدمج السابقة المترية «بيكو» مع «ثانية» في كلمة واحدة، على نمط «نانوثانية» و«ميكروثانية»"
    - lemma: "بِيكُو ثَانِيَة"
      generation_method: taarib
      justification: "تعريب بفصل السابقة المترية «بيكو» عن وحدة القياس «ثانية» ككلمتين منفصلتين، وهو النمط السائد في المعاجم الموحدة (المعجم الطبي الموحد، معجم المعلوماتية)"
    - lemma: "ثَانِيَة بِيكُويَّة"
      generation_method: tarkib
      justification: "مركب وصفي عربي النمط: الموصوف «ثانية» + الصفة المنسوبة «بيكوية»، يوافق نمط «ثانية ضوئية» و«سنة كبيسة»"
    - lemma: "تِرِيلْيُونِيَّة الثَّانِيَة"
      generation_method: tarkib
      justification: "مركب إضافي يعبّر عن المفهوم بلفظ عربي: جزء من تريليون من الثانية، لكنه وصفي أكثر منه اصطلاحي"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بِيكُوثَانِيَة"
      evidence_status: "no_material_found"

    - lemma: "بِيكُو ثَانِيَة"
      confirm:
        - text: "«مختصره: psec. جزء من تريليون جزء من الثانية.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«بيكو ثانية ( 10 12- ثانية)» — ترجمة picosecond"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "ثَانِيَة بِيكُويَّة"
      evidence_status: "no_material_found"

    - lemma: "تِرِيلْيُونِيَّة الثَّانِيَة"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "بِيكُوثَانِيَة"
      decision: confirmed
      decision_reason: "اللمّة تعريب مقبول ومستعمل للمصطلح الإنجليزي picosecond. الصيغة المدمجة (كلمة واحدة) موازية لـ«نانوثانية» (الموجودة في ARABTERM بالصيغة المدمجة entry 355398). يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِيكُوثَانِيَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بِيكُو ثَانِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "الصيغة المفصولة مدعومة بدليلين معجميين مباشرين (معجم المعلوماتية والمعجم الطبي الموحد) وتمثّل الكتابة الرسمية في معاجم ALECSO الموحدة. إضافتها كمدخل بديل يُثري التغطية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الصيغة المفصولة المعتمدة في المعاجم الموحدة الرسمية، تفصل السابقة المترية عن وحدة القياس"
      actions:
        - command: create_entry
          params: {lemma: "بِيكُو ثَانِيَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15260650-n"}

    - lemma: "ثَانِيَة بِيكُويَّة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على هذا المركب الوصفي. ليس تعبيراً مصطلحياً ثابتاً، بل تركيب وصفي حر يمكن صياغته ارتجالاً. لم يرد في أي معجم موحد."

    - lemma: "تِرِيلْيُونِيَّة الثَّانِيَة"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي شارح وليس مصطلحاً مسكوكاً. لا يصلح لمّةً معجمية لأنه يفسّر المفهوم بدل تسميته."

