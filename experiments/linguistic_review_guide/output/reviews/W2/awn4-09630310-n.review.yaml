step0_evidence:
  per_lemma:
    - lemma: "طالب"
      confirm:
        - text: "«من يهم بتحصيل الشيء أو يلتمسه ويريده» — موسوعة السلطان قابوس لأسماء العرب"
        - text: "«طالب الوظيفة أو المساعدة» — المورد الحديث (2008)"
      expands:
        - text: "«الذي يطلب العلم ويطلق عرفاً على التلميذ في مرحلتي التعليم الثانوية والعالية» — المعجم الوسيط"
          addition: "المعنى المدرسي/الأكاديمي (Student) وهو الأغلب في الاستعمال"
    - lemma: "متقدم"
      confirm:
        - text: "«متقدم للوظيفة» — مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      contradicts:
        - text: "«المتقدم بالزمان: هو ما له تقدم زماني، كتقدم نوح على إبراهيم» — كتاب التعريفات للشريف الجرجاني"
          conflict: "الدلالة الفلسفية/المنطقية للسبق والأولية تختلف عن دلالة طلب الوظيفة"
      expands:
        - text: "«المتقدم بالشرف: هو الراجح بالشرف على غيره» — كتاب التعريفات للشريف الجرجاني"
          addition: "معاني الأفضلية والرفعة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مقدم طلب"
      source_section: "step5_english_bridge"
      evidence_citation: "«مقدم الطلب: كيان يطلب أو يسعى إلى الاعتماد...» — مسرد المناخ والبيئة (ArabTerm)"
      justification: "المقابل الدقيق والاصطلاحي لكلمة applicant في السياقات الرسمية والإدارية"
    - lemma: "ملتمس"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الملتمس: الطالب الشيء، والساعي من أجل تحقيقه» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "لفظ فصيح يعبر عن السعي والطلب، ويستخدم غالباً في سياق العرائض والالتماسات"
  knowledge_candidates:
    - lemma: "مرشح"
      justification: "يستخدم في سياق التقدم لوظيفة أو منصب (candidate)، وهو مرادف تداولي للمتقدم في كثير من السياقات"
    - lemma: "راغب"
      justification: "يدل على الرغبة في الحصول على الشيء، ويستخدم في الإعلانات (مثل: الراغبين في التقدم للوظيفة) كآلية لغوية للتعبير عن مقدم الطلب"

