# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id : awn4-06811330-n
# ili       : i72210
# pos       : n
# definition_en: indication by demonstration
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "إشارة مكتوبة بدون تشكيل كامل"
      - "تبيان يُعبّر في المعاجم الكلاسيكية عن الإيضاح الخطابي اللفظي (ترتيب الكلام لإيصال المعاني)، لا عن الدلالة بالعرض الحسّي المباشر كما تقتضي المجموعة"
      - "غياب لمّة تُمثّل الدلالة الحسية التعيينية بمفهوم الإشارة الحسية (الفلسفي) المقيَّد بالعرض والإيماء المباشرَين"
    observations: "المجموعة تُعبّر عن مفهوم 'الإشارة الحسية التعيينية'، أي الدلالة على الشيء بعرضه مشاهدةً أو إيماءً لا بوصفه قولاً؛ وهو ما يُسمّيه الفلاسفة 'الإشارة الحسية' مقابل 'الإشارة العقلية'. إشارة هو اللفظ المعجمي الأدق لهذا المفهوم في التراث الكلامي والفلسفي (أكّده المناوي والتهانوي والبركتي). أما تبيان فيرتبط في معاجم الاصطلاح بالإيضاح الخطابي ولا يؤدي المعنى الحسي التعييني المطلوب. المجموعة أخصّ من hypernym (دلالة مطلقة) بتقييدها الدلالةَ بطريقة العرض الحسي."
  blind_candidates:
    - lemma: "تَجْلِيَة"
      generation_method: ishtiqaq
      justification: "مصدر جلَّى يُجلِّي على وزن تَفْعِلَة من جذر جلو/جلي، يدل على إظهار الشيء وإجلائه بالعرض الحسّي الواضح، مما يناسب 'الدلالة عن طريق التوضيح المباشر'"
    - lemma: "إِبْرَاز"
      generation_method: ishtiqaq
      justification: "مصدر أبرز يُبرز من جذر برز، يفيد إخراج الشيء إلى الظهور وعرضه عياناً للدلالة عليه، وهو وجيه لمعنى الإشارة بالعرض والإبداء الحسّي"
    - lemma: "تَمْثِيل"
      generation_method: ishtiqaq
      justification: "مصدر مثَّل يُمثِّل من جذر مثل، بمعنى الدلالة بالتجسيد والمثال العياني؛ يناسب 'indication by demonstration' من حيث إن التمثيل يُشير إلى إبداء المثال الحسّي"
    - lemma: "اسْتِشْهَاد"
      generation_method: ishtiqaq
      justification: "مصدر استشهد يستشهد من جذر شهد، يفيد إحضار الشاهد العياني للدلالة على المراد، مما يناسب الإشارة بالعرض والتجسيد الحسّي"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت: (١) batch headword — جميع اللمّات والمرشحات
#                   (٢) إثراء بالمعرّف — تعريفات وشواهد
#                   (٣) جسر إنجليزي — pointing out / demonstration / denotation
#                   (٤) FTS عربي — تعيين / توضيح / إيضاح / استدلال
#                   (٥) مقاييس اللغة — جذر شور / بين
stage2_evidence:
  per_lemma:

    - lemma: "إشارة"
      confirm:
        - text: "«تعيين الشيء باليد ونحوها، والتلويح بشيء يفهم منه المراد»"
          source: "المعجم الوسيط"
        - text: "«الإشَارةُ: دلَالَة عقلية أَو حسية إِلَى الشَّيْء بِحَيْثُ لَا يُشَارِكهُ فِيهِ غَيره»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الإشارة: التلويح بشيء يفهم منه النطق، فهي ترادف النطق في فهم المعنى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الإشارة: هو تعيين الشيء بالحسّ»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«الإشارة: معناه بديهي وهي قسمان: إشارة عقلية وإشارة حسّية. وللإشارة ثلاثة معانٍ: الأول المعنى المصدري الذي هو فعل، أي تعيين الشيء بالحسّ» — [Indication]"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«أية علامة مصاحبة لكلام المتكلم تساعد على بيان المراد من كلامه» — [indication]"
          source: "مسرد الإعلام والتواصل — أراب ترم"

    - lemma: "تبيان"
      contradicts:
        - text: "«التبيان: كيفية ترتيب الكلام في كشف ما تريد من تفهيم المعاني وآدائها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "التعريف يحصر تبيان في الإيضاح الخطابي اللفظي (ترتيب الكلام)، بينما المجموعة تخصّ الدلالة بالعرض الحسّي المباشر لا بالإيضاح القولي"

    - lemma: "تَجْلِيَة"
      evidence_status: "no_material_found"

    - lemma: "إِبْرَاز"
      contradicts:
        - text: "«الإبراز: لغة هو الإظهار. وعند النحاة هو الإتيان بالضمير البارز»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الاستعمال الاصطلاحي الراسخ للإبراز هو الإتيان بالضمير البارز (نحو)، لا الدلالة بالإشارة أو العرض الحسّي"
        - text: "«الإبراز في علم الحيوان: فصل مواد خاصة في داخل الجسم الحيواني ثم إخراجها كما هي من غير أن يحصل بينها وبين أجزاء الجسم أو محتوياته تفاعل»"
          source: "المعجم الوسيط"
          conflict: "المعنى العلمي الغالب في المعاجم الحديثة بيولوجي (إفراز/excretion) لا يناسب مفهوم المجموعة"

    - lemma: "تَمْثِيل"
      contradicts:
        - text: "«التمثيل: إثبات حكم جزئي في جزئي آخر لمعنى مشترك بينهما»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "التمثيل في الاصطلاح المنطقي والأصولي يُعنى بالقياس بين الجزئيات، لا بالدلالة عبر العرض الحسّي"
        - text: "«التمثيل في علم النبات: عملية حيوية يجريها النبات الأخضر مكوِّناً غذاءه العضوي من عناصر بسيطة في وجود اليخضور والضوء»"
          source: "المعجم الوسيط"
          conflict: "المعنى العلمي الحديث ينصرف إلى التمثيل الضوئي (photosynthesis)، لا إلى الإشارة بالعرض"

    - lemma: "اسْتِشْهَاد"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إشارة"
      decision: confirmed
      decision_reason: "إشارة هو اللفظ المعجمي المرسَّخ في التراث الفلسفي والكلامي لهذا المفهوم بعينه؛ عرَّفه التهانوي والبركتي والمناوي صراحةً بـ'تعيين الشيء بالحسّ'، وعرَّفه السيوطي بـ'دلالة حسية إلى الشيء بحيث لا يشاركه فيه غيره'. وجذر (شور) في مقاييس اللغة يُفيد 'إبداء الشيء وإظهاره وعرضه'، مما يؤكد ملاءمته للمجموعة. الأدلة قاطعة. يستوجب التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "إشارة تُعبّر عن الدلالة الحسية التعيينية بالإيماء أو الإبداء الجسدي أو العرض الفيزيائي المباشر، وتمتاز عن hypernym (دلالة) بتقييد طريقة التعبير بالحسّ والمشاهدة لا اللفظ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَة"

    - lemma: "تبيان"
      decision: removed
      decision_reason: "تبيان في المعاجم الكلاسيكية مقيَّد بالإيضاح الخطابي وترتيب الكلام لإيصال المعاني ('كيفية ترتيب الكلام في كشف ما تريد من تفهيم المعاني')؛ فهو يُعبّر عن الوضوح اللفظي لا عن الدلالة بالعرض الحسّي. الفارق الدلالي جوهري: إشارة دلالة حسية تعيينية، وتبيان دلالة خطابية لفظية. إبقاؤه يُوسِّع المجموعة خارج نطاقها."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَجْلِيَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثر لتجلية على مواد معجمية. وإن كانت اشتقاقاً وجيهاً من جذر جلو/جلي، فإن اختبار التثبيت المعجمي لم يُجِزها مصطلحاً راسخاً لهذا المعنى، ومن ثَمَّ لا يصحّ إدراجها."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "إِبْرَاز"
      source: stage1
      decision: removed
      decision_reason: "الاستعمال الاصطلاحي الراسخ لإبراز ينصرف إلى: (أ) الإتيان بالضمير البارز نحوياً، (ب) الإفراز البيولوجي. الوجه اللغوي 'الإظهار' مجرد أصل لغوي، ولم يُثبَّت معجمياً كمصطلح مستقل للدلالة الحسية بالعرض؛ فضلاً عن خطر الاشتراك اللفظي مع مفهوم الإفراز العلمي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَمْثِيل"
      source: stage1
      decision: removed
      decision_reason: "تمثيل محمّل بمعانٍ اصطلاحية راسخة ومتعددة تتعارض مع المجموعة: القياس المنطقي (أصول الفقه)، والتمثيل الضوئي (أحياء نبات)، والتمثيل المسرحي. لا يوجد توثيق لاستعماله مصطلحاً للدلالة بالعرض الحسّي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "اسْتِشْهَاد"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على مواد معجمية. واستشهاد في الاستعمال العربي ينصرف أساساً إلى الاستدلال بالنصوص الموثوقة (آيات وأشعار)، لا إلى الدلالة بالعرض الحسّي التعييني."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
# اللمّات المؤكدة من المرحلة ٣: إشارة فقط
stage4_content:
  definition:
    current: "دلالة عن طريق العرض أو التوضيح"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية ('indication by demonstration') تفتقر إلى التمييز بين العرض الحسّي والإيضاح اللفظي. يُستحسن إعادة صياغته بأسلوب المعجم الوسيط مع جنس قريب وفصل نوعي واضح."
    authored:
      - type: terminological
        text: "الدَّلالة على الشيء بتعيينه حسّاً وعرضه مشاهدةً أو إيماءً، لا بوصفه قولاً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "تعيين الشيء وإظهاره للدلالة عليه، في مقابل التعبير عنه بالألفاظ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الدَّلالة على الشيء بتعيينه حسّاً وعرضه مشاهدةً أو إيماءً، لا بوصفه قولاً"

  examples:
    per_lemma:
      - lemma: "إِشَارَة"
        examples:
          - text: "أشار الأستاذُ إلى الخارطة المعلّقة إشارةً واضحة دالاً على موضع القاهرة، دون أن ينطق بكلمة"
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أشار الأستاذُ إلى الخارطة المعلّقة إشارةً واضحة دالاً على موضع القاهرة، دون أن ينطق بكلمة"


