# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-05216064-n  |  ILI: i64339  |  POS: n
# Concept: compositeness (the property of being a composite number)
# Reviewed: 2026-03-17
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'تركيبية' خالية من التشكيل الكامل"
      - "التعريف يستخدم تنصيصاً توضيحياً بين قوسين '(غير أولي)' بدلاً من صياغة معجمية متكاملة بجنس قريب وفصل نوعي"
      - "لا يوجد في AWN4 إلا لمّة واحدة للمجموعة، وهي قليلة بالنسبة لمفهوم رياضي يستحق تعدّد المصطلحات"
    observations: "المجموعة تنتمي إلى نظرية الأعداد، وتحديداً إلى الثنائية الرياضية الكلاسيكية بين الأعداد الأولية والأعداد المركّبة. التراث العربي المحاسبي يتضمن هذا المفهوم صراحةً تحت مصطلح 'التركيب' في مقابل 'الأوليّة'، مما يمنح الاشتقاق الصرفي 'تَرْكِيبِيَّة' أساساً تراثياً متيناً. في المقابل، بعض المعاجم العربية المتخصصة تُقابل composite بـ'مُؤَلَّف' (لا 'مُرَكَّب')، مما يفتح باب اشتقاق بديل هو 'تَأَلُّفِيَّة'."
  blind_candidates:
    - lemma: "تَرْكِيبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الصفة 'مُرَكَّب' (composite) على وزن فَعِيلِيَّة المنتج للمفاهيم المجردة الوصفية. 'مُرَكَّب' هو المصطلح الأشيع للعدد غير الأولي في الاستخدام الرياضي الحديث، ومنه تنبثق 'تَرْكِيبِيَّة' بوصفها اسم الخاصية على قياس: أَوَّلِيَّة ← أَوَّل، تَرْكِيبِيَّة ← مُرَكَّب."
    - lemma: "تَأَلُّفِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'تَأَلُّف'، استناداً إلى مصطلح 'مُؤَلَّف' الوارد في بعض المعاجم المتخصصة بمعنى composite. جذر 'أَلَّفَ' يحمل دلالة انضمام الأشياء وتجمّعها، وهو ملائم لوصف العدد الذي يتألّف من عوامل متعددة."
    - lemma: "عَدَمِيَّةُ الأَوَّلِيَّة"
      generation_method: tarkib
      justification: "تركيب إضافي يُعرِّف الخاصية بوصفها نقيض الأوليّة (primality)؛ بيد أنه تعبير وصفي حر يُعرَّف بالسلب، وقد لا يجتاز اختبار السكّ الاصطلاحي لأن مكوّنه الأول قابل للإبدال."
    - lemma: "انْقِسَامِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'انقسام'، إشارةً إلى أن العدد المركّب قابل للانقسام على عوامل أولية متعددة. غير أن الانقسامية قد تتداخل دلالياً مع divisibility لا compositeness."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَرْكِيبِيَّة"
      confirm:
        - text: "«عند المحاسبين يطلق [التركيب] على... كون العدد بحيث يعدّه غير الواحد كالأربعة تعدّها الاثنان والستة يعدها الثلاثة، وكذا الاثنان؛ ويقابله الأوليّة، وهي كون العدد بحيث لا يعده غير الواحد كالثلاثة والخمسة والسبعة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry_id: 819171)"
      expands:
        - text: "«العدد المؤلَّف؛ العدد غير الأوّلي (ر).» [= composite number]"
          source: "المورد الحديث (2008) — entry_id: 679399"
          addition: "يُعادِل المورد الحديث بين 'العدد المؤلَّف' و'العدد غير الأولي' كترجمتين لـ composite number، مما يؤكد المعنى الرياضي المطلوب ويكشف عن مصطلح بديل (مُؤَلَّف)"
        - text: "«(1) تركيبيّ؛ تأليفيّ؛ تجميعيّ [ضدّ analytic] (2) تركيبيّة؛ تأليفيّة»  [= synthetic]"
          source: "المورد الحديث (2008) — entry_id: 721859"
          addition: "يُثبِت وجود الصيغة الأنثوية 'تركيبيّة' في المعجمية الحديثة، وإن كان السياق لسانياً لا رياضياً"

    - lemma: "تَأَلُّفِيَّة"
      confirm:
        - text: "«مؤلَّف» [= composite] و«عدد مؤلَّف» [= composite number]"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك — ALECSO (1990) — entry_ids: 415392، 415394"
        - text: "«تأليفية: صفة وظيفة للوحدات اللغوية وهي إمكانية تجميع هذه الوحدات لتكوين مجموعات أكبر منها في المستوى»"
          source: "المعجم الموحد لمصطلحات اللسانيات — ALECSO (2002) — entry_id: 496177"
      expands:
        - text: "«الهمزة واللام والفاء أصل واحد، يدلّ على انضمام الشيء إلى الشيء»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُرسّخ أن جذر 'الف' يحمل معنى الانضمام والتجمّع، مما يجعله ملائماً للتعبير عن خاصية تألّف العدد من عوامل متعددة"

    - lemma: "عَدَمِيَّةُ الأَوَّلِيَّة"
      evidence_status: "no_material_found"

    - lemma: "انْقِسَامِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تركيبية"
      decision: confirmed
      decision_reason: "اللمّة راسخة دلالياً؛ فمصطلح 'التركيب' وردَ في التراث الرياضي العربي بمعنى خاصية كون العدد غير أولي (كشّاف التهانوي)، ومنه 'تَرْكِيبِيَّة' بوصفها المصدر الصناعي الطبيعي لهذه الخاصية على قياس 'أَوَّلِيَّة'/'تَرْكِيبِيَّة'. لا تعارض في الأدلة. تحتاج إلى تشكيل كامل وإلا تبقى ملتبسة الوزن."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تعكس الاشتقاق من 'مُرَكَّب' الأشيع في المصطلحية الرياضية المعاصرة؛ هي المصطلح المباشر المقابل لـ compositeness في معظم الكتابات العربية الرياضية الحديثة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْكِيبِيَّة"

    - lemma: "تَأَلُّفِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مدعومة بمصطلح 'مُؤَلَّف' الرياضي المعتمد في معجم ALECSO (المعجم الموحد للرياضيات والفلك، 1990) لترجمة composite، مما يجعل 'تَأَلُّفِيَّة' المصدر الصناعي الطبيعي لخاصية 'compositeness' من هذا الجذر. الاشتقاق قياسي صحيح، والجذر 'الف' يحمل دلالة الانضمام المناسبة للمفهوم."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مشتقة من 'مُؤَلَّف' التراثي الوارد في بعض المعاجم المتخصصة؛ تُبرز بُعد التأليف والتجمّع (انضمام عوامل أولية معاً) بوصفه الأساس المفهومي للعدد المركّب، وتتميز بالإحالة إلى التقليد المعجمي الذي يُرادف composite بـ'مُؤَلَّف'"
      actions:
        - command: create_entry
          params: {lemma: "تَأَلُّفِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عَدَمِيَّةُ الأَوَّلِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا يجتاز اختبار السكّ الاصطلاحي؛ 'الأوليّة' قابلة للإبدال بـ'البدائية' أو 'القِطعيَّة' دون فقدان معنى الوصف، مما يدل على أنه تعبير وصفي حر لا مصطلح مسكوك. علاوةً على ذلك، التعريف بالسلب وحده غير كافٍ كمصطلح علمي مستقل."

    - lemma: "انْقِسَامِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الانقسامية تقابل divisibility لا compositeness؛ إذ الأعداد الأولية نفسها قابلة للقسمة (على الواحد ونفسها)، ومن ثَمَّ لا تُميِّز الانقسامية الأعداد المركّبة عن الأولية. الخلط المفهومي يجعل المصطلح غير ملائم."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
