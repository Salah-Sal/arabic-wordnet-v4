stage4_content:
  definition:
    current: "أسماء الأماكن في منطقة أو لغة تعتبر مجتمعة"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح ولكنه يحتاج إلى صياغة أكثر دقة وموسوعية."
    authored:
      - type: terminological
        text: "مَجْموعُ أَسْمَاءِ الأَمَاكِنِ وَالمَوَاقِعِ الجُغْرَافِيَّةِ فِي مِنْطَقَةٍ أَوْ لُغَةٍ مُعَيَّنَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "أَسْمَاءُ الأَمَاكِنِ"
        examples:
          - text: "تَزْخَرُ المَمْلَكَةُ العَرَبِيَّةُ السُّعُودِيَّةُ بِتَنَوُّعٍ كَبِيرٍ فِي أَسْمَاءِ الأَمَاكِنِ ذَاتِ الدَّلَالَاتِ التَّارِيخِيَّةِ."
            type: usage
      - lemma: "طُوبُونِيمِيَا"
        examples:
          - text: "تُسَاعِدُ الطُّوبُونِيمِيَا البَاحِثِينَ عَلَى تَتَبُّعِ الهِجْرَاتِ البَشَرِيَّةِ القَدِيمَةِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مَجْموعُ أَسْمَاءِ الأَمَاكِنِ وَالمَوَاقِعِ الجُغْرَافِيَّةِ فِي مِنْطَقَةٍ أَوْ لُغَةٍ مُعَيَّنَةٍ."}
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يَهْتَمُّ عُلَمَاءُ اللُّغَةِ بِتَحْلِيلِ أَسْمَاءِ المَوَاضِعِ لِمَعْرِفَةِ أَصْلِ السُّكَّانِ."}

