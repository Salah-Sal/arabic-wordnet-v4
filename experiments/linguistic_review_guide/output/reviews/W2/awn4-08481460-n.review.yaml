stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة غير مشكولة (أسماء الأماكن)."
      - "اللمات الإنجليزية المذكورة (troponymy, troponomy) بها خطأ إملائي أو خلط؛ والصواب هو (toponymy) لأن التعريف يتعلق بأسماء الأماكن وليس بدلالة الأفعال (troponymy)."
    observations: "المفهوم يعبر عن مجموع أسماء المواقع الجغرافية في حيز ما، وهو مفهوم قديم في التراث الجغرافي العربي (كما في كتب المسالك والممالك ومعجم البلدان)، ولكنه كمصطلح علمي حديث يُعرف بـ'الطوبونيميا'."
  blind_candidates:
    - lemma: "طُوبُونِيمِيَا"
      generation_method: taarib
      justification: "المصطلح العلمي العالمي المعرب للدلالة على أسماء الأماكن ودراستها."
    - lemma: "أَسْمَاءُ المَوَاضِعِ"
      generation_method: tarkib
      justification: "تعبير تراثي فصيح شاع في كتب الجغرافيين العرب القدامى (مثل ياقوت الحموي)."
    - lemma: "أَسْمَاءُ الأَعْلَامِ الجُغْرَافِيَّةِ"
      generation_method: tarkib
      justification: "مصطلح تقني حديث تستخدمه الهيئات المساحية ومنظمات الأمم المتحدة (UNGEGN)."
    - lemma: "الأَسْمَاءُ المَكَانِيَّةُ"
      generation_method: tarkib
      justification: "تعبير وصفي بسيط وشائع في السياقات العامة."

stage2_evidence:
  per_lemma:
    - lemma: "أسماء الأماكن"
      confirm:
        - text: "«أسماء الأماكن للشيخ، أبي محمد: الحسن ابن أحمد النسابة. ألفه: سنة ثمان وعشرين وأربعمائة.»"
          source: "كشف الظنون"
        - text: "«الطوبونيما: «أ» أسماء الأماكن في منطقة ما أو لُغة ما.»"
          source: "المورد الحديث"
    - lemma: "طُوبُونِيمِيَا"
      confirm:
        - text: "«الطوبونيما: «أ» أسماء الأماكن في منطقة ما أو لُغة ما. «ب» دراسة هذه الأسماء.»"
          source: "المورد الحديث (بصيغة طوبونيما)"
    - lemma: "أَسْمَاءُ المَوَاضِعِ"
      confirm:
        - text: "«تسمية موضعية [تشريح] - toponymy»"
          source: "المعجم الطبي الموحد (استخدام في تخصص آخر)"
      expands:
        - text: "«سُوَيْقَة: تصغير ساق ... وبهذا يجب تفسير أسماء الأماكن التي تطلق عليها هذه الكلمة والتي توجد في الصحراء»"
          source: "المستشرق دوزي (يشير إلى شيوع إطلاق المصطلح على تسميات المواقع)"

