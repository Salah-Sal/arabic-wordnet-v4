# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «درجة الرؤية في بيئتك» ترجمةٌ حرفيةٌ من الإنجليزية «the degree of visibility of your environment» ولا يعكس جوهرَ المفهوم؛ إذ إنَّ الإضاءة مقدارٌ فيزيائيٌّ يتعلق بكمية الضوء الساقط لا بدرجة الرؤية وحدها"
      - "الخطاب المباشر (بيئتك) لا يلائم أسلوبَ التعريف المعجمي"
      - "لم تُوثَّق الفروق الدلالية الدقيقة بين إضاءة وإنارة رغم تمايزهما في الاستعمال"
    observations: "المفهوم راسخٌ في العربية بلفظَين أصيلَين مشتقَّين من جذرَين مختلفَين: إضاءة (من ضوأ) وإنارة (من نور). كلاهما مصدرُ الفعلِ الرباعي المتعدي بالهمزة (أفعَلَ)، وهو وزنٌ قياسيٌّ يُؤدِّي معنى التصيير والإيجاد. غير أنَّ إضاءة أعمُّ دلالةً وأشيعُ في السياق العلمي والتقني، بينما إنارة أكثرُ استخداماً في سياق توفير الضوء الاصطناعي للأماكن والمنشآت. التعريف الحالي يحتاج إلى مراجعة وتدقيق."
  blind_candidates:
    - lemma: "إِضَاءَة"
      generation_method: ishtiqaq
      justification: "مصدرُ الفعل أضاءَ يُضيءُ من الجذر ضوأ على وزن إِفَاعَة، يُعبِّر مباشرةً عن درجة الضوء الساقط في البيئة وما يُتيحه من رؤية"
    - lemma: "مَرْئِيَّة"
      generation_method: ishtiqaq
      justification: "المصدرُ الصناعيُّ من الجذر رأي على وزن مَفْعِلِيَّة، يُعبِّر عن «قابلية الرؤية» أي درجة ما يمكن إبصاره في البيئة، وهو مستعمَل في المعجم الأرصادي"
    - lemma: "وَضَاءَة"
      generation_method: majaz
      justification: "إحياءٌ للفظٍ كلاسيكيٍّ من وضأ، أصلُه النقاءُ والحسن؛ يُمكن إزاحتُه دلالياً نحو «صفاء البيئة ووضوح منظرها» بمشابهة وظيفية بين الحسن المرئي وانبساط الضوء"
    - lemma: "نُورِيَّة"
      generation_method: ishtiqaq
      justification: "المصدرُ الصناعيُّ من نور على وزن فُعْلِيَّة، يُعبِّر عن درجة النورانية والإضاءة في بيئة ما"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# استعلامات قاعدة البيانات المنفَّذة:
# ١. مطابقة دقيقة دفعية — جميع اللمّات (الموجودة + المرشحات) [6 أشكال + ال]
# ٢. إثراء بالمعرّف — تعريفات وأمثلة (entry_ids من الاستعلام ١)
# ٣. جسر إنجليزي — illumination / lighting / luminosity / visibility
# ٤. مقاييس اللغة لابن فارس (dictionary_id=151) — جذور ضوأ، نور، رأي، وضأ
stage2_evidence:
  per_lemma:

    - lemma: "إضاءة"
      confirm:
        - text: "«الإضاءة: فرط الإنارة من الضوء الذي هو النور البالغ القوي ومصداقه {جَعَلَ الشَّمْسَ ضِيَاءً وَالْقَمَرَ نُورًا}»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. ١٦٢٢م)"
        - text: "«إضاءة — illumination»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«إضاءة — illuminance»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "«إضاءة — illuminaion [sic]»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«تعرف شدة الضوء المصطدم بواحدة السطح بالإضاءة النوعية، وتتناسب طرداً مع شدة المنبع الضوئي وعكساً مع مربع المسافة بين السطح المضاء وهذا المنبع»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
      expands:
        - text: "«(1) إضاءة؛ إنارة؛ تنوير — (5) الاستضاءة: درجة الضوء الواقع على سطحٍ ما (فز)»"
          source: "المورد الحديث (2008)"
          addition: "يُميِّز المورد الحديث بين المعنى الشائع (إضاءة/إنارة) والمصطلح الفيزيائي الدقيق (الاستضاءة = درجة الضوء الواقع على سطح ما)، مما يكشف أن إضاءة أعمُّ دلالةً"

    - lemma: "إنارة"
      confirm:
        - text: "«إضاءة الغرف أو تسليط الأضواء على أشياء أو مواقع من منابع إشعاع اصطناعية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«إنارة — illumination»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
      expands:
        - text: "«(1) إضاءة؛ إنارة؛ تنوير — (5) الاستضاءة: درجة الضوء الواقع على سطحٍ ما (فز)»"
          source: "المورد الحديث (2008)"
          addition: "يدرج المورد الحديث إنارة ضمن مرادفات illumination، مما يؤكد اعتراف المعاجم الحديثة بها في هذا السياق؛ غير أن تعريف مصطلحات الطاقة المتجددة يُقيِّد دلالتها بالإضاءة الاصطناعية تحديداً"

    - lemma: "مَرْئِيَّة"
      contradicts:
        - text: "«تمثيل مسجل لجسم ما نحصل عليه بوسائل بصرية أو بصرية كهربائية، أو بصرية ميكانيكية، أو إلكترونية، يستعمل هذا المصطلح عندما يصدر أو ينعكس الإشعاع الكهرمغنطيسي من منظر ولا يسجَّل بشكل مباشر على فلم»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          conflict: "المعجم يثبت أن مرئية = image (صورة)، لا illumination (إضاءة)"

    - lemma: "وَضَاءَة"
      contradicts:
        - text: "«الوَضَاءَةُ: الحُسْنُ والنَّظافَةُ، وقد وَضُؤَ كَكَرُمَ، فهو وضِيءٌ من أوْضِيَاءَ ووِضَاءٍ»"
          source: "القاموس المحيط للفيروزآبادي (ت. ١٤١٤م)"
          conflict: "الوضاءة في أصل وضعها تعني الحسنَ والنقاءَ، لا الضوءَ أو درجةَ الإضاءة"
        - text: "«وضاءة — albedo»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي يُرادف وضاءة بـ albedo (نسبة الانعكاس)، وهو مفهوم مختلف عن illumination"

    - lemma: "نُورِيَّة"
      evidence_status: "no_material_found"


