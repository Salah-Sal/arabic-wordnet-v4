# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13880467-n
# exact opposition / التعارض التام
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «خِلَاف» معناها الأصلي المنازعة والمجادلة لا التقابل التام، وهي أعمّ من الضدّ كما نصّ المناوي"
      - "لمّة «عَكْس» معناها الأصلي ردّ آخر الشيء على أوله (القلب/الانعكاس)، لكنها اكتسبت دلالة اصطلاحية على المخالفة والنقيض"
      - "غياب لمّة «نَقِيض» وهي الأدقّ دلالةً على التعارض التامّ في المعاجم العربية"
    observations: "المجموعة تعبّر عن مفهوم التعارض التامّ بين شيئين، وهو مفهوم منطقي-فلسفي له ألفاظ عربية أصيلة راسخة. اللمّتان الحاليتان (خلاف، عكس) لا تؤدّيان الدلالة الدقيقة المطلوبة: فالخلاف أعمّ من المضادّة، والعكس أصله القلب والردّ. المجموعة الرأس (hypernym) هي تَضَادّ/تَعَارُض، فالمطلوب هنا ما هو أخصّ منها."
  blind_candidates:
    - lemma: "نَقِيض"
      generation_method: ishtiqaq
      justification: "من الجذر ن-ق-ض على وزن فَعِيل بمعنى مفعول، يدلّ على الأمر المناقض المعارض بالذات. ورد في التعريفات: «نقيض كلّ شيء رَفْع تلك القضية». وفي المعجم الوسيط: «المخالف». أدقّ ألفاظ العربية للتعارض التام."
    - lemma: "ضِدِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من ضِدّ، يدلّ على حالة التضادّ المجردة. لكنه قريب جدّاً من المفهوم الرأس (تَضَادّ) فقد يكون مكرّراً."
    - lemma: "مُقَابَلَة"
      generation_method: ishtiqaq
      justification: "مصدر فاعَلَ من قَبَلَ، يدلّ على وضع الشيء تجاه الآخر. يُستعمل في البلاغة والمنطق للتقابل، لكنه أعمّ من التعارض التامّ."
    - lemma: "تَنَاقُض"
      generation_method: ishtiqaq
      justification: "مصدر تفاعُل من نَقَضَ، يدلّ على التدافع المتبادل بين أمرين. ورد في كشّاف الاصطلاحات: «اختلاف قضيتين بالإيجاب والسلب». لكنه مصطلح منطقي أخصّ (contradiction) وليس مجرّد تعارض (contrariety)."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "خِلَاف"
      contradicts:
        - text: "«الخِلاف: منازعةٌ تجري بين المتعارضين لتحقيق حقّ أو إبطالِ باطل وهو أعمُّ من المضادَّة»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الخلاف منازعة وهو أعمّ من المضادّة، فلا يدلّ على التعارض التامّ تحديداً"
        - text: "«الخلاف أعمّ من الضدّ، لأنّ كلّ ضدّين مختلفان ولا عكس»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "نصّ صريح على أنّ الخلاف أعمّ من الضدّ"
      expands:
        - text: "«المُخالَفَةُ المُضادَّةُ»"
          source: "المعجم الكبير"
          addition: "أحد معاني الخلاف المضادّة، لكنه ليس المعنى الوحيد ولا الأوّل"

    - lemma: "عَكْس"
      confirm:
        - text: "«العكس:[في الانكليزية] Contrary [في الفرنسية] Contraire، يطلق على معانٍ. منها نفي الشيء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«العكس: رد الشيء إلى سننه أي طريقه الأوّل. وفي عرف الأصوليين: انتفاء الحكم لانتفاء العلة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«العَكْسُ: ردّك آخر الشيء إلى أوّله»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          addition: "المعنى اللغوي الأصلي هو القلب والردّ، والدلالة على المخالفة اصطلاحية"
        - text: "«العكس: هو التلازم في الانتقاء بمعنى كلّما لم يصدق الحدّ لم يصدق المحدود»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "معنى منطقي اصطلاحي: العكس ضدّ الطرد"

    - lemma: "نَقِيض"
      confirm:
        - text: "«النّقيض:[في الانكليزية] Contrary، opposite، antagonist. النقيضان الأمران المتمانعان بالذات أي الأمران اللذان يتمانعان ويتدافعان بحيث يقتضي لذاته تحقّق أحدهما في نفس الأمر انتفاء الآخر»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«نقيض كلّ شيء: رفع تلك القضية»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«النقيض: المخالف. والنقيضان (في المنطق): المتناقضان»"
          source: "المعجم الوسيط"

    - lemma: "ضِدِّيَّة"
      evidence_status: "no_material_found"

    - lemma: "مُقَابَلَة"
      contradicts:
        - text: "«المقابلة: وضع الشيء تجاه شيء آخر»"
          source: "المورد الحديث"
          conflict: "المقابلة أعمّ من التعارض التامّ، فهي تشمل أيّ وضع مواجِه"
      expands:
        - text: "«تقابل: اختلاف بين وحدتين أو عدّة وحدات مميّزة»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "التقابل مصطلح لساني أعمّ من التعارض التامّ"

    - lemma: "تَنَاقُض"
      contradicts:
        - text: "«التناقض: اختلاف قضيتين بالإيجاب والسلب بحيث يقتضي لذاته صدق أحدهما وكذب الأخرى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "التناقض مصطلح منطقي يدلّ على contradiction (أخصّ وأقوى من contrariety)، فالنقيضان لا يجتمعان ولا يرتفعان، بخلاف الضدّين اللذين لا يجتمعان وقد يرتفعان"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "خِلَاف"
      decision: removed
      decision_reason: "الخلاف في المعاجم العربية يدلّ أساساً على المنازعة والمجادلة، وهو «أعمّ من المضادّة» كما نصّ البركتي والمناوي. لا يدلّ على التعارض التامّ (exact opposition) تحديداً، بل على مطلق الاختلاف والمخالفة. كما أنّ له معانيَ أخرى (شجر الصفصاف) ممّا يزيد الالتباس."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عَكْس"
      decision: confirmed
      decision_reason: "العكس مصطلح راسخ في الاستعمال الفلسفي والمنطقي العربي بمعنى المخالفة والنقيض. نصّ التهانوي على أنّه يقابل contrary بالإنجليزية. معناه اللغوي الأصلي (الردّ والقلب) امتدّ اصطلاحياً ليشمل المعارضة التامّة، وهو شائع الاستعمال في هذا المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على مفهوم التقابل والانعكاس، أي العلاقة المجردة بين الشيء ومخالفه، مع إيحاء بالقلب والتحويل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَكْس"

    - lemma: "نَقِيض"
      source: stage1
      decision: confirmed
      decision_reason: "نقيض من أدقّ الألفاظ العربية دلالةً على التعارض التامّ. عرّفه التهانوي بأنّه contrary/opposite، وعرّفه الجرجاني بأنّه «رفع القضية». وفي المعجم الوسيط «المخالف». له سند معجمي واسع في المعاجم الكلاسيكية والحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الأمر المعارض بعينه (الكيان المقابل)، مع تأكيد التمانع الذاتي بين النقيضين"
      actions:
        - command: create_entry
          params: {lemma: "نَقِيض", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13880467-n"}

    - lemma: "ضِدِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجَد أدلّة معجمية على استعمال هذا المصدر الصناعي. وهو قريب جدّاً من المفهوم الرأس (تَضَادّ) ممّا يجعله مكرّراً دلالياً."

    - lemma: "مُقَابَلَة"
      source: stage1
      decision: removed
      decision_reason: "المقابلة أعمّ من التعارض التامّ، فهي تشمل أيّ وضع مواجِه أو مقارنة، ولا تقتصر على التضادّ. كما أنّها مصطلح بلاغي (الطباق والمقابلة) بدلالة مختلفة."

    - lemma: "تَنَاقُض"
      source: stage1
      decision: removed
      decision_reason: "التناقض في المنطق يدلّ على contradiction وهو أقوى من contrariety: النقيضان لا يجتمعان ولا يرتفعان، بينما الضدّان لا يجتمعان لكن قد يرتفعان. فالتناقض أخصّ من المطلوب هنا."

