# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-15180707-n (night / ليل)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (ليل، ليلة) بدون تشكيل — يلزم تحديث التشكيل"
    observations: >
      المجموعة تمثّل مفهوم «الليل» بوصفه وحدة زمنية، وهو مفهوم أصيل في الثقافة العربية
      وله حضور قرآني كثيف. اللمّتان الموجودتان كافيتان دلالياً: «لَيْل» للجنس و«لَيْلَة»
      للوحدة. التعريف الحالي مقبول لكنه يمكن تحسينه بأسلوب المعجم الوسيط. العلاقة
      بالمُشتمِل (وحدة زمنية) صحيحة.
  blind_candidates:
    - lemma: "لَيْل"
      generation_method: ishtiqaq
      justification: "من الجذر ل ي ل، اللفظ الأساسي الدالّ على الجزء المظلم من الدورة اليومية، اسم جنس جمعي"
    - lemma: "لَيْلَة"
      generation_method: ishtiqaq
      justification: "واحدة اللَّيل على وزن فَعْلَة، تدلّ على ليلة واحدة كوحدة زمنية محدّدة"
    - lemma: "دُجًى"
      generation_method: majaz
      justification: "من الجذر د ج و/ي، الظلام الشديد، مجاز مرسل علاقته اللزوم — الظلمة ملازمة لليل"
    - lemma: "سُدْفَة"
      generation_method: majaz
      justification: "من الجذر س د ف، تدلّ على الظلمة أو اختلاط الظلام بالنور، مجاز بالمجاورة"

stage2_evidence:
  per_lemma:
    - lemma: "لَيْل"
      confirm:
        - text: "«ما يَعقُب النهارَ من الظَّلام, وهو من مَغْرِب الشمس إلى طلوعها»"
          source: "المعجم الوسيط"
        - text: "«ما يعقب النَّهَار من الظلام وَهُوَ من مغرب الشَّمْس إِلَى طُلُوعهَا وَفِي لِسَان الشَّرْع من مغْرِبهَا إِلَى طُلُوع الْفجْر ويقابل النَّهَار»"
          source: "المعجم الوسيط (نسخة هَوْرَماني)"
        - text: "«اللَّيْلُ واللَّيْلاةُ: من مَغْرِبِ الشمسِ إلى طُلوعِ الفَجْرِ الصادِقِ أو الشمسِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«ضد النهار وهو الظلام والسواد»"
          source: "كتاب العين"
        - text: "«خلاف النهار»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الليل: هي من غروب الشمس إلى طلوع الفجر الصادق، أو إلى طلوع الشمس وهو خلافُ النهار»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: "«ليلٌ ألْيَلُ: شديدُ الظلمة»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          addition: "صيغة التأكيد ليل أليل للظلمة الشديدة"
        - text: "«ما يعقب النهارَ من الظّلام وهو من غروب الشّمس إلى طلوعها، يقابل النَّهار ... آناء اللَّيل: ساعاته — ابنُ اللَّيل: اللِّص»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "توسيع بالتعابير الاصطلاحية المرتبطة"

    - lemma: "لَيْلَة"
      confirm:
        - text: "«واحدة اللَّيل»"
          source: "المعجم الوسيط"
        - text: "«واحدة اللَّيْل (ج) لَيَال وليائل»"
          source: "المعجم الوسيط (نسخة هَوْرَماني)"
      expands:
        - text: "«فعلت الليلة كذا — من الصُّبْح إِلَى نصف النَّهَار فَإِذا انتصف النَّهَار قلت فعلت البارحة»"
          source: "المعجم الوسيط (نسخة هَوْرَماني)"
          addition: "قاعدة استعمالية زمنية في التعبير عن الليلة الماضية"

    - lemma: "دُجًى"
      evidence_status: "no_material_found"

    - lemma: "سُدْفَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "لَيْل"
      decision: confirmed
      decision_reason: >
        لفظ أصيل مؤكَّد في جميع المعاجم العربية الكلاسيكية والمعاصرة بمعنى «ما يعقب
        النهارَ من الظلام». هو اسم جنس جمعي يدلّ على الليل كمفهوم عام ووحدة زمنية.
        اللمّة الموجودة بدون تشكيل وتحتاج تحديثاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اسم جنس جمعي يدلّ على الليل كمفهوم مطلق أو فترة زمنية غير محدّدة العدد، خلافاً لـ«لَيْلَة» التي تدلّ على وحدة واحدة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَيْل"

    - lemma: "لَيْلَة"
      decision: confirmed
      decision_reason: >
        واحدة الليل، مؤكَّدة في المعجم الوسيط وغيره. تدلّ على ليلة واحدة بعينها
        كوحدة زمنية قابلة للعدّ والجمع (ليالٍ، ليائل). اللمّة الموجودة بدون تشكيل
        وتحتاج تحديثاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "واحدة الليل، تدلّ على ليلة واحدة بعينها كوحدة زمنية قابلة للعدّ، خلافاً لـ«لَيْل» الذي يدلّ على الجنس المطلق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَيْلَة"

    - lemma: "دُجًى"
      source: stage1
      decision: removed
      decision_reason: >
        الدُّجى يدلّ على الظلمة كصفة أو حالة وليس على الليل كوحدة زمنية.
        لا يصلح بديلاً عن «ليل» في سياق قياس الزمن. لم تُوجد أدلة معجمية تدعم
        استخدامه كوحدة زمنية.
      evidence_assessment:
        case: no_material

    - lemma: "سُدْفَة"
      source: stage1
      decision: removed
      decision_reason: >
        السُّدفة تدلّ على الظلمة أو اختلاط الظلام بالنور (وقت الفجر أو الغروب)،
        وليست مرادفة لليل كوحدة زمنية كاملة. لم تُوجد أدلة معجمية تدعم هذا الاستخدام.
      evidence_assessment:
        case: no_material

