# مراجعة المجموعة الترادفية — awn4-06916295-n (indigenous language)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (لغة أصلية، لغة محلية) بدون تشكيل كامل"
      - "«لغة محلية» قد تعني لغة المنطقة دون دلالة حصرية على النشوء فيها، فهي أعمّ من المفهوم المطلوب"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج صياغة معجمية أصيلة"
    observations: "المفهوم يدور حول لغة نشأت في بقعة بعينها ولم تُجلب إليها من خارج. وهو مفهوم حديث في علم اللسانيات الاجتماعية، يُقابل indigenous language. في العربية يُعبَّر عنه عادة بمركّب وصفي: لغة + صفة تدلّ على الأصالة أو التوطّن. الجنس القريب هو «لُغَة»، والفصل النوعي هو كونها متأصّلة في موطنها لا وافدة."
  blind_candidates:
    - lemma: "لُغَةٌ أَصِيلَة"
      generation_method: tarkib
      justification: "مركّب وصفي من «لغة» و«أصيلة» بمعنى المتمكّنة في أصلها والمتجذّرة في موطنها، يفيد معنى النشوء والتأصّل في المكان"
    - lemma: "لُغَةٌ مُتَوَطِّنَة"
      generation_method: tarkib
      justification: "مركّب وصفي من «لغة» و«متوطّنة» من الجذر وطن، بمعنى المستقرّة في وطنها الأصلي"
    - lemma: "لُغَةٌ أَهْلِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «لغة» و«أهلية» بمعنى لغة أهل المكان الأصليين"
    - lemma: "لِسَانٌ بَلَدِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «لسان» بمعنى اللغة و«بلدي» بمعنى المنسوب إلى البلد في طبيعته وبيئته"

stage2_evidence:
  per_lemma:
    - lemma: "لُغَةٌ أَصْلِيَّة"
      confirm:
        - text: "«أصلي: أنواع الحيوانات والنباتات التي تتواجد بشكل طبيعي في منطقة أو هاجروا إليها من دون مشاركة البشر.» (ترجمة: native / indigenous)"
          source: "مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«أصلي: السكان الأوائل ببعض الأقاليم أو المناطق (السكان الأصليين بأستراليا) الذين لا زالوا متواجدين ومتميزين عن غيرهم من السكان النازحين إلى المنطقة.» (ترجمة: aboriginal)"
          source: "مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«أصلي: يوجد، ازداد، نشأ، أو تم إنتاجه في أرض أو منطقة معينة.» (ترجمة: autochthonous)"
          source: "مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«الأصلي: ما كان أصلاً في معناه. ويُقابل بالفرعي, أو الزائد, أو الاحتياطي, أو المقلد»"
          source: "المعجم الوسيط"
          addition: "في اللغة العامة «أصلي» يقابل الفرعي والمُقلَّد، وهو أعمّ من المعنى المطلوب (indigenous)"
        - text: "«أصلي: نوع من أنواع اللّغة، وهو اللفظ المستعمل عند سبع أقوام من العرب سكان البادية الذين يقال لهم: الأعراب والعرب العرباء والعرب العاربة.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التهانوي يستعمل «أصلي» للدلالة على اللغة العربية الفصيحة الأولى مقابل المولّد، وهو معنى مغاير للمعنى المطلوب هنا"

    - lemma: "لُغَةٌ مَحَلِّيَّة"
      confirm:
        - text: "«(5) العامّيّة؛ الدارجة؛ لغة إقليم أو جماعة أو مهنة ما (6) لهجة» (ترجمة: vernacular)"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«لهجة محلّية» (ترجمة: vernacular)"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "في المصطلحية العربية «محلّي» يقترن بـ«لهجة» لا بـ«لغة» للدلالة على الكلام الدارج، و«محلّي» يعني ما ينتمي إلى المنطقة حالياً دون اشتراط النشوء فيها"
      expands:
        - text: "«(2) بَلَديّ؛ وَطَنيّ ... (5) محلّيّ native art» (ترجمة: native)"
          source: "المورد الحديث (2008)"
          addition: "«محلّي» من بين مقابلات native لكنه ليس المقابل الأدقّ لـ indigenous"

    - lemma: "لُغَةٌ أَصِيلَة"
      confirm:
        - text: "«لغة أصيلة» (ترجمة: native language)"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«أصيل / أصليين (الجيولوجيا): متأصل بالموقع قيد الدرس، ثابت ومرتبط بالأرض» (ترجمة: autochthonous / indigenous)"
          source: "مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«الأصيل: المُتَمَكِّنُ في أصله»"
          source: "المعجم الوسيط"
          addition: "دلالة التمكّن والتجذّر في الأصل أقرب إلى مفهوم indigenous من «أصلي» العامّ"

    - lemma: "لُغَةٌ مُتَوَطِّنَة"
      contradicts:
        - text: "«متوطن: كائن (نبات أو حيوان) يستوطن منطقة جغرافية محددة، واضحة المعالم ولا يتواجد خارجها.» (ترجمة: endemic)"
          source: "مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "«متوطّن» مصطلح بيولوجي/طبي يقابل endemic لا indigenous، ويدلّ على الحصر الجغرافي لا على النشأة الأصلية"
        - text: "«متوطن: صفة لمرض يستقر أو لمرض مقيم في مجتمع ما»"
          source: "معجم المصطلحات الطبية (2003)"
          conflict: "الاستعمال الغالب لـ«متوطّن» طبّي (أمراض متوطّنة)، لا يصلح وصفاً للغات"

    - lemma: "لُغَةٌ أَهْلِيَّة"
      contradicts:
        - text: "«الأهلي: المنسوب إلى الأهل. الأليف من الحيوان»"
          source: "المعجم الوسيط"
          conflict: "«أهلي» يُستعمل أساساً للحيوان المستأنس (أهلي مقابل وحشي)، فوصف اللغة بالأهلية غير مألوف ويوحي بالتأنيس لا بالتأصّل"

    - lemma: "لِسَانٌ بَلَدِيّ"
      expands:
        - text: "«البلدي: المنسوب إلى البلد في طبيعته وبيئته»"
          source: "المعجم الوسيط"
          addition: "«بلدي» يفيد الانتساب إلى البلد لكنه يوحي بالعامّية والبساطة، و«لسان بلدي» غير مسكوك مصطلحياً"
        - text: "«أروميّ: أصليّ؛ أهليّ؛ بلديّ.» (ترجمة: autochthonous)"
          source: "المورد الحديث (2008)"
          addition: "«بلدي» من مقابلات autochthonous لكنه ليس الأشيع في سياق اللغات"

