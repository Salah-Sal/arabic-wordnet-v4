stage1_review:
  assessment:
    concerns:
      - "لَمَّة (غَرَابَة) تحمل ظلالاً دلالية سلبية في التراث العربي (الغموض، الوحشة)، وهي في الأصل مصطلح بلاغي-لغوي لوصف الألفاظ المستغربة، لا صفةً للأشياء الاستثنائية الإيجابية."
      - "لَمَّة (اسْتِثْنَائِيَّة) غير موثقة في المعاجم الكلاسيكية كمدخل مستقل، وإن كانت صياغة حديثة مقبولة على وزن المصدر الصناعي."
      - "التعريف يستخدم (استثنائياً) مشتقاً من الجذر ذاته للمّة الأولى — تدوير جزئي."
    observations: >
      المجموعة تنتمي إلى حقل المقولات التجريدية (صفات الجودة/النوعية)، وهي ترادفية-اقترانية لا مترادفة تامة:
      اسْتِثْنَائِيَّة تُبرز كون الشيء خارجاً عن المعتاد بمعنى إيجابي أو محايد (ما يُستثنى لرفعته)،
      بينما غَرَابَة تُبرز طابع الدهشة والاستغراب، وقد تنزلق نحو الشذوذ غير المستحسن.
      المفهوم الإنجليزي (extraordinariness) يجمع المعنيَيْن معاً لكنه يميل للإيجابية.
      لا يوجد في المعاجم الكلاسيكية مصطلح مخصص لهذا المعنى بوصفه مصدراً مجرداً للصفة.
  blind_candidates:
    - lemma: "نُدْرَةٌ"
      generation_method: ishtiqaq
      justification: "من الجذر ن-د-ر على وزن فُعْلة؛ تدل على قلة الوقوع وندور الشيء، مما يوافق شطر التعريف (غير مألوف). نَدَرَ يَنْدُرُ = سقط وبرز من جملته."
    - lemma: "شُذُوذٌ"
      generation_method: ishtiqaq
      justification: "من الجذر ش-ذ-ذ، مصدر شذَّ يشِذّ؛ يدل على الخروج عن المألوف والمعتاد، مطابق لشطر التعريف (غير مألوف)."
    - lemma: "طَرَافَةٌ"
      generation_method: ishtiqaq
      justification: "من الجذر ط-ر-ف على وزن فَعَالَة؛ الطريف هو الشيء المستحدث الغريب الممتع، يجمع بين النُّدرة والجِدَّة، وهو أقرب للإيجابية من غرابة."
    - lemma: "خَارِقِيَّةٌ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (خارق)، على غرار استثنائية؛ خَرَقَ العادةَ = تجاوزها، والخارقية = صفة كون الشيء خارقاً لحدود المعتاد."


