stage2_evidence:
  per_lemma:

    - lemma: "اسْتِثْنَائِيَّة"
      expands:
        - text: "«غير عاديّ، استثنائيّ»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
          addition: "يُؤكد أن (استثنائي) هو المقابل العربي الموحد لـ extraordinary في السياقات الرسمية؛ ولا وجود للمصدر الصناعي (استثنائية) كمدخل مستقل في هذا المعجم."
        - text: "«(1) استثنائيّ (2) رائع (3) فوق العادة»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يُشير إلى التقابل الثلاثي بين استثنائي ورائع وفوق العادة في المعجمية التقابلية، مما يُعزز مكانة المصدر الصناعي (استثنائية)."
        - text: "«(الثَّاءُ وَالنُّونُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَكْرِيرُ الشَّيْءِ مَرَّتَيْنِ، أَوْ جَعْلُهُ شَيْئَيْنِ مُتَوَالِيَيْنِ أَوْ مُتَبَايِنَيْنِ ... وَمَعْنَى الِاسْتِثْنَاءِ مِنْ قِيَاسِ الْبَابِ، وَذَلِكَ أَنَّ ذِكْرَهُ يُثَنَّى مَرَّةً فِي الْجُمْلَةِ وَمَرَّةً فِي التَّفْصِيلِ»)"
          source: "مقاييس اللغة لابن فارس — جذر ثني"
          addition: "يُوضح أن الاستثناء معناه الإخراج والتمييز (تكرار الذكر مرتين: في الجملة ثم مفرداً)؛ ومنه استمد استثنائي = ما أُخرج عن قاعدة الأشياء الاعتيادية."

    - lemma: "غَرَابَة"
      confirm:
        - text: "«الغرابة: الندرة. وَعند أَصْحَاب الْمعَانِي كَون الْكَلِمَة وحشية أَي غير ظَاهِرَة الْمَعْنى وَلَا مأنوسة الِاسْتِعْمَال»"
          source: "دستور العلماء للأحمدنكري (ق. ١٢ هـ)"
        - text: "«تظهر الغرابة مع كل ظاهرة تخالف المألوف وتحاول مفاجأة القارئ على غرار كتابات السوريالية والدادائية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
      contradicts:
        - text: "«الغرابة: كون الكلمة وحشيةً غير ظاهرة المعنى، ولا مألوفة الاستعمال»"
          source: "كتاب التعريفات للشريف الجرجاني (ت. ١٤١٣م)"
          conflict: "التعريف الكلاسيكي يُقيّد الغرابة بالكلام والألفاظ (مصطلح بلاغي)، لا بصفات الأشياء عموماً."
        - text: "«الغرابة: كون الكلمة وحشية غير ظاهرة المعنى، ولا مأنوسة الاستعمال»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. ١٦٢٢م)"
          conflict: "نفس التقييد اللغوي — الغرابة مصطلح في علم اللغة والبلاغة، وتطبيقه على الأشياء مجاز حديث."
      expands:
        - text: "«الغَيْنُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ، وَكَلِمُهُ غَيْرُ مُنْقَاسَةٍ لَكِنَّهَا مُتَجَانِسَةٌ ... وَالْغُرْبَةُ: الْبُعْدُ عَنِ الْوَطَنِ ... وَمِنْ هَذَا الْبَابِ: غُرُوبُ الشَّمْسِ، كَأَنَّهُ بُعْدُهَا عَنْ وَجْهِ الْأَرْضِ»"
          source: "مقاييس اللغة لابن فارس — جذر غرب"
          addition: "الجذر غرب يدور على البُعد والنأي عن المألوف؛ وهذا المعنى الجِذري يُسوّغ توسيع دلالة غرابة لتشمل كل ما خرج عن المألوف، لا الكلام وحده."

    - lemma: "نُدْرَةٌ"
      confirm:
        - text: "«يقال: لا يكون ذلك إلاَّ نُدْرَةً, أو فى النُّدْرَة: إلاَّ أحياناً قليلة»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
      contradicts:
        - text: "«(الندرة) الْقطعَة من الذَّهَب وَالْفِضَّة تُوجد فِي الْمَعْدن — يُقَال لَا يكون ذَلِك إِلَّا ندرة أَو فِي الندرة إِلَّا أَحْيَانًا قَليلَة»"
          source: "المعجم الوسيط (النسخة الهوراماني)"
          conflict: "الندرة في المعجم الوسيط تدل على القلة الكمية والندور (scarcity)، لا على الصفة النوعية للتميز والاستثنائية."
        - text: "«وضع ينتج عن عدم التوازن بين طلبات غير محدودة نسبيا وموارد محدودة»"
          source: "مسرد المناخ والبيئة — ARABTERM"
          conflict: "الاستخدام التقني الحديث يؤكد ترجمة (ندرة) لـ scarcity لا لـ extraordinariness؛ فهي تدل على الشح الكمي."
        - text: "«النُّونُ وَالدَّالُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سُقُوطِ شَيْءٍ أَوْ إِسْقَاطِهِ»"
          source: "مقاييس اللغة لابن فارس — جذر ندر"
          conflict: "الأصل الجذري يدل على السقوط والبروز، لا على الجودة والتميز؛ مما يُضعف انتماء ندرة للمجموعة التي تنتسب لحقل (جودة/نوعية)."

    - lemma: "شُذُوذٌ"
      confirm:
        - text: "«خروج عن المألوف وعدم اتباع القواعد المطردة المتحكمة في النسق»"
          source: "مسرد الإعلام والتواصل — ARABTERM"
        - text: "«الخروج عن القياس أو المألوف»"
          source: "معجم المصطلحات الطبية ج.١ (1985) — ARABTERM"
      contradicts:
        - text: "«انحراف عن الحالة السوية، تشوه خلقي مثلا»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — ARABTERM"
          conflict: "الشذوذ في المعجمية التقنية يُرادف abnormality (الشذوذ المرضي)، مما يضفي دلالة سلبية لا تناسب مفهوم الاستثنائية الإيجابية."
        - text: "«عند النحاة خاصية عدم الاطراد في اللغة وهي عكس القياس»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          conflict: "الشذوذ مقابل أصيل لـ anomaly وirregularity، لا لـ extraordinariness؛ الحقل المعجمي مختلف."

    - lemma: "طَرَافَةٌ"
      evidence_status: "no_material_found"

    - lemma: "خَارِقِيَّةٌ"
      evidence_status: "no_material_found"


