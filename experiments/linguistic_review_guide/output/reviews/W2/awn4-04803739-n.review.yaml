stage3_analysis:
  per_lemma:

    - lemma: "اسْتِثْنَائِيَّة"
      decision: confirmed
      decision_reason: >
        مصدر صناعي قياسي (فَعَّالية ← فَعَّال ← باب الاستفعال)، مشتق من الفعل استثنى واسم التفضيل/الصفة استثنائي.
        صياغة حديثة موثقة في الاستخدام الرسمي والإعلامي العربي، ومُقنَّنة في معاجم عربية تقابلية.
        تُعبّر بدقة عن الجنس القريب (صفة) والفصل النوعي (الخروج عن المعتاد بمفهوم محايد أو إيجابي).
        غياب المدخل في المعاجم الكلاسيكية لا يُعيب حداثة التسمية لمفهوم حديث الاستخدام.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      loan_check:
        borrowing_type: none
        assessment: "مشتق عربي قياسي خالص، لا اقتراض."
      morphological_fit: "وزن المصدر الصناعي (-يَّة) ملائم تماماً للدلالة على الخاصية المجردة."
      nuance_differentiation: >
        تُبرز الطابع الاستثنائي النوعي من زاوية محايدة أو إيجابية (ما يُستثنى بالرفعة عن القاعدة)؛
        مستمدة من مفهوم الاستثناء النحوي (إخراج الشيء من حكم الأعم)، فهي صفة تُخرج موصوفها من دائرة العادي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِثْنَائِيَّة"

    - lemma: "غَرَابَة"
      decision: confirmed
      decision_reason: >
        موثقة في معجمين كلاسيكيين بمعنى (الندرة) ومعنى (مخالفة المألوف)، وهما شطرا التعريف تماماً.
        الجذر غرب يدور على البُعد والنأي، مما يُسوّغ معنى الخروج عن المألوف.
        في المعجمية الحديثة (اللسانيات، ARABTERM) استُعمل المصطلح للدلالة على الظاهرة التي تخالف المألوف.
        التحفظ الوحيد: التراث الكلاسيكي يُقيّدها بالكلام؛ لكن توسيع الدلالة إلى الأشياء ثابت في الاستخدام الحديث المُعجمن.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      loan_check:
        borrowing_type: none
        assessment: "عربية خالصة على وزن فَعَالَة."
      morphological_fit: "وزن فَعَالَة من الصفة الوصفية (غريب ← غَرَابَة) قياسي لتجريد الصفة."
      nuance_differentiation: >
        تُبرز طابع الدهشة والاستغراب الذي يُصيب المتلقي حين يواجه الشيء — أي الاستثنائية بوصفها حالة إدراكية
        تجعل الشيء غريباً غير مألوف؛ تحمل أحياناً ظلاً من الإثارة أو الريبة غائباً في (اسْتِثْنَائِيَّة).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَرَابَة"

    - lemma: "نُدْرَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        النُّدرة تدل بصورة جوهرية على الشُّح الكمي وقلة التكرار (scarcity, rarity)، لا على الجودة النوعية المميزة.
        جذرها (ندر = سقط وبرز) يُشير إلى الحدوث النادر لا إلى صفة التميز.
        المعاجم التقنية تُوقّعها مقابلاً لـ scarcity في الاقتصاد والبيئة — حقل مختلف عن حقل (جودة/نوعية).
        لا تنسجم مع المحور الدلالي الرأسي للمجموعة التي أبوها المباشر (جَوْدَة/نَوْعِيَّة).

    - lemma: "شُذُوذٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الشذوذ حقله المعجمي الموحد هو anomaly/abnormality (الانحراف عن السواء)، لا extraordinariness.
        يحمل دلالة سلبية واضحة (الانحراف المرضي، الخروج عن القياس بمعنى معيب) لا تناسب مجموعة
        الاستثنائية التي قد تكون إيجابية أو محايدة. الفروق الدلالية جوهرية.

    - lemma: "طَرَافَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد للمصطلح أي مدخل معجمي في قاعدة البيانات (760,000 مدخل). غياب التثبيت المعجمي
        يمنع إدراجه. فضلاً عن ذلك، طرافة تدل على الجِدَّة والابتكار والإمتاع (novelty/charm) أكثر من
        كونها "صفة الاستثنائية"، وهو مفهوم مختلف.

    - lemma: "خَارِقِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد للمصطلح أي مدخل معجمي في قاعدة البيانات. المصدر الصناعي (خارقية) لم يستقر في الاستخدام
        المعجمن الحديث ولا في التراث، فلا يمكن إدراجه دون تثبيت معجمي.


