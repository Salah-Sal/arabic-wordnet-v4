# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10696121-n  |  ILI: i93448  |  POS: n
# المفهوم: شخص لا يؤدي وظيفة ظاهرة  |  supernumerary
# الاستعلامات المُنفَّذة: ٥  |  اللمّات المؤكدة: ١  |  اللمّات المحذوفة: ١  |  المرشحات المرفوضة: ٤
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
# ⚠ قراءة synset_info_masked.yaml أولاً (التعريف بدون لمّات)
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين الحاليتين تعبيران وصفيان مركبان (MWE)، ولا يوجد في المعجمية العربية مصطلح أحادي مسكوك راسخ يقابل supernumerary بمعنى الشخص الزائد عن الحاجة"
      - "'عَمَالَة فَائِضَة' يغلب عليه البُعد الاقتصادي الجماعي (ظاهرة البطالة المقنّعة / ترهّل الجهاز الوظيفي)، وقد لا يصحّ إطلاقه على فرد بعينه"
      - "التعريف العربي الحالي 'شخص لا يؤدي وظيفة ظاهرة' دقيق لكنه مقتضب، ولا يميّز المفهوم عن البطالة الصريحة"
    observations: >
      المجموعة تصف مفهوماً إدارياً-اقتصادياً حديثاً: شخص يشغل موضعاً وظيفياً رسمياً دون أن
      يؤدي دوراً فعلياً بيّناً — بما يميّزه عن العاطل (jobless) ويقرّبه من البطالة المقنّعة.
      المعجمية العربية الكلاسيكية تعبّر عن ما يماثله بمجازات (كالحشو في الكلام أو من الناس
      الذي لا يُعتمد عليه)، غير أن هذا الاستعمال محدود وغير مقنَّن اصطلاحياً.
      المعجمية الحديثة (المورد الحديث) ترسّخت فيها عبارتا «زائد عن الحاجة» و«فائض»
      ترجمتَيْن لـ supernumerary وredundant.

  blind_candidates:
    - lemma: "طُفَيْلِيّ"
      generation_method: majaz
      justification: >
        إحياء للمجاز التاريخي: طُفَيْل الأعراس رجل الكوفة المشهور بحضور الولائم دون دعوة،
        فنُسب إليه كل من يلتصق بمجموعة دون إسهام فيها. الإزاحة الدلالية من 'متطفل على الولائم'
        إلى 'شخص لا يؤدي دوراً فعلياً' مشابهة وظيفية واجتماعية قابلة للتوظيف.
    - lemma: "عَاطِل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن فَاعِل من الجذر (ع-ط-ل) الدالّ أصلاً على الخلوّ والفراغ. مقاييس اللغة:
        «الْعَيْنُ وَالطَّاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خُلُوٍّ وَفَرَاغٍ».
        عَاطِل = الذي خلا من العمل الفعلي ولم يُنجَز عنه شيء — وهو قريب من 'لا يؤدي وظيفة ظاهرة'.
    - lemma: "حَشْوِيّ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على نسبة (فَعْلِيّ) من الحَشْو (ما يُملأ به الشيء دون قيمة جوهرية).
        الحَشْوِيّ = من هو بمثابة حشو في المنظومة، زائد لا قيمة ظاهرة له.
        المجاز معروف في البلاغة العربية: «حشو الكلام» = ما لا فائدة منه. القياس على الأشخاص متوقّع.
    - lemma: "مُتَطَفِّل"
      generation_method: ishtiqaq
      justification: >
        مضارع الوزن الخامس (تَفَعَّل) من جذر (ط-ف-ل) ذاته لطُفَيْل. يدل على من يتكلّف الالتصاق
        بجماعة أو هيئة دون أن يكون له دور حقيقي — وهو قريب من معنى 'شخص لا يؤدي وظيفة ظاهرة'.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات:
# ١. دفعي headword_norm: الموجودة + المرشحات (زائد عن الحاجة، عمالة فائضة، طفيلي، عاطل، حشوي، متطفل)
# ٢. مكوّنات: زائد، فائض، عمالة، عاطل (مفردات بحثية تكميلية)
# ٣. جسر إنجليزي: "supernumerary" OR "redundant worker" OR "extra worker" OR "excess labor"
# ٤. FTS عربي: "كمبرس" OR "زائد عن الحاجة" OR "فائض عن الحاجة"
# ٥. مقاييس اللغة: جذور زيد، فيض، عطل، عمل، حوج (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "زَائِد عَنِ الْحَاجَة"
      confirm:
        - text: "«(3) الفائض: شخص أو شيء زائد عن العدد المقرَّر أو المطلوب»"
          source: "المورد الحديث (2008) — ترجمة: supernumerary"
        - text: "«(1) فائض؛ زائد عن الحاجة (2) مبالَغٌ فيه»"
          source: "المورد الحديث (2008) — ترجمة: de trop"
        - text: "«(1) فاضل؛ فائض؛ زائد عن الحاجة (3) مُسَرَّحٌ [بسبب من تكاثر العمال أو زيادتهم عن الحاجة]»"
          source: "المورد الحديث (2008) — ترجمة: redundant"
      expands:
        - text: "«الزَّاءُ وَالْيَاءُ وَالدَّالُ أَصْلٌ يَدُلُّ عَلَى الْفَضْلِ. يَقُولُونَ زَادَ الشَّيْءُ يَزِيدُ، فَهُوَ زَائِدٌ»"
          source: "مقاييس اللغة لابن فارس — مادة زيد"
          addition: "الجذر (زيد) يدلّ على الفضل والزيادة الكمّية، مما يؤكد معنى تجاوز العدد المطلوب"

    - lemma: "عَمَالَة فَائِضَة"
      confirm:
        - text: "«(3) مُسَرَّحٌ [بسبب من تكاثر العمال أو زيادتهم عن الحاجة]»"
          source: "المورد الحديث (2008) — ترجمة: redundant"
      contradicts:
        - text: "«(العمالة) أُجْرَة الْعَامِل وحرفته»"
          source: "المعجم الوسيط"
          conflict: >
            العمالة في معناها الأصيل تدلّ على أجرة العامل أو مجال عمله الجماعي،
            لا على شخص مفرد. المجموعة تصف فرداً، والعمالة الفائضة تصف ظاهرة جماعية.
      expands:
        - text: "«عمالة — employment / labour»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يؤكد أن 'عمالة' في المعجمية الاقتصادية الحديثة تصف قوى العمل بوصفها ظاهرة جماعية"
        - text: "«فائض — superfluous / surplus»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يثبت استخدام 'فائض' للدلالة على الزائد عن الحاجة في السياق الاقتصادي"

    - lemma: "طُفَيْلِيّ"
      contradicts:
        - text: "«الذي يغشى الولائم والأعراس والمجالس ونحوها من غير أن يُدْعَى إليها (منسوب إلى «طُفَيْل» رجل من أهل الكوفة) — كائن حي يعيش متطفلاً على كائن حي آخر في داخله أو خارجه (في علم الأحياء)»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            الطفيلي يلتصق بالآخرين ويحضر دون دعوة أو يستنزف مضيفه. هذا مختلف جوهرياً عن
            'شخص لا يؤدي وظيفة ظاهرة': الطفيلي فاعل نشيط في الاستنزاف، بينما شخص المجموعة
            قد يكون محايداً مُعيَّناً رسمياً دون دور.
        - text: "«(الطفيلي) الَّذِي يغشى الولائم والأعراس والمجالس وَنَحْوهَا من غير أَن يدعى إِلَيْهَا ... (فِي علم الْأَحْيَاء) كَائِن حَيّ يعِيش متطفلا على كَائِن حَيّ آخر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "تأكيد للدلالتين المعجميتين اللتين تخالفان معنى المجموعة"

    - lemma: "عَاطِل"
      contradicts:
        - text: "«عاطل — unemployed»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: >
            عاطل في المعجمية الحديثة يعني 'عديم العمل' (unemployed) — البطالة الصريحة.
            شخص المجموعة مُوظَّف رسمياً لكنه لا يؤدي دوراً فعلياً ظاهراً — البطالة المقنّعة.
            الفارق الجوهري يمنع قبول 'عاطل' في هذه المجموعة.
      expands:
        - text: "«الْعَيْنُ وَالطَّاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى خُلُوٍّ وَفَرَاغٍ»"
          source: "مقاييس اللغة لابن فارس — مادة عطل"
          addition: "الأصل الجذري يدلّ على الخلوّ المطلق لا على الزيادة عن الحاجة في منظومة قائمة"

    - lemma: "حَشْوِيّ"
      contradicts:
        - text: "«وصف لكل ما هو زائد ومتكرر — redundant (Information and Communication)»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          conflict: >
            حشوي في المعجمية التقنية المعاصرة صفة تصف الأنظمة والمكوّنات لا الأشخاص.
            يختص بالسياق المعلوماتي، ولا يُستعمل وصفاً لشخص في السياق الإداري-الوظيفي.
        - text: "«متعلق بالحشا — visceral / splanchnic»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: "الدلالة الطبية التشريحية السائدة لا صلة لها بمفهوم المجموعة"
        - text: "«سابقة بمعنى: حشويّ وأحشاء — splanchno / viscero»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          conflict: "يُستعمل بادئةً تشريحية، مما يزيد استبعاده عن الاستعمال الشخصي"

    - lemma: "مُتَطَفِّل"
      contradicts:
        - text: "«الدَّخِيلُ الْمُمْتَهِنُ غيرِ حِرْفَتِه»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المتطفل = الدخيل الممتهن خارج اختصاصه. يعني نشاطاً تعدّياً خارج الحدود
            لا خمولاً وغياباً وظيفياً. شخص المجموعة لا يُؤدَّى عنه عمل، بينما المتطفل
            يمارس عملاً ليس من شأنه — تناقض تام في طبيعة الفعل.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "زَائِد عَنِ الْحَاجَة"
      decision: confirmed
      decision_reason: >
        تعبير مركب موثّق في المعجمية الثنائية الحديثة كترجمة راسخة لـ supernumerary وredundant
        وde trop. يصف الشخص الذي يتجاوز عدده العدد المطلوب فعلياً. يجتاز اختبار السكّ:
        التعبير ثابت لا تقبل مكوّناته الإبدال الحر. التشكيل مكتمل. لا حاجة لإجراء تصحيحي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يصف الشخص من منظور كمّي-عددي صرف: فرد يتجاوز العدد المطلوب في موقع العمل أو الهيئة.
        تعبير محايد يُستعمل في السياقات القانونية والإدارية الرسمية (قرارات إعادة الهيكلة،
        تقارير ديوان المحاسبة، عقود العمل). يركز على الزيادة الفردية بالنسبة للحاجة الفعلية.

    - lemma: "عَمَالَة فَائِضَة"
      decision: removed
      decision_reason: >
        «عَمَالَة» في أصلها اللغوي تدلّ على أجرة العامل أو مجال عمله، وفي الاستعمال الاقتصادي
        تدلّ على قوى العمل بوصفها ظاهرة جماعية لا فرداً بعينه. المجموعة تصف شخصاً مفرداً
        («a person»)، و'عمالة فائضة' لا يُطلَق صحيحاً على فرد واحد في سياق طبيعي.
        علاوةً على ذلك، فإن 'عمالة فائضة' مصطلح البطالة المقنّعة الاقتصادية، وهو أعمّ
        من المفهوم الفردي المقصود في المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "طُفَيْلِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المعجمية الراسخة لطُفَيْلِيّ: 'متطفل على الولائم' أو 'طفيلي بيولوجي'. كلتاهما
        تفترض نشاطاً استنزافياً يختلف جوهرياً عن مجرد انعدام الدور. المجاز المُتخيَّل في التوليد
        لم يتحقق في الاستعمال المعجمي الفعلي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "عَاطِل"
      source: stage1
      decision: removed
      decision_reason: >
        عاطل = بلا عمل (unemployed) — البطالة الصريحة. شخص المجموعة قد يكون موظَّفاً رسمياً
        لكنه لا يؤدي دوراً فعلياً ظاهراً — البطالة المقنّعة. الفارق بين الحرمان من العمل
        وانعدام الدور رغم الوجود الرسمي جوهري ويمنع القبول.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "حَشْوِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        حشوي في المعجمية المعاصرة إما صفة تقنية (redundant في المعلوماتية) أو وصف طبي
        تشريحي (visceral). كلاهما لا يصف شخصاً في سياق وظيفي-إداري. الاستخدام الصحيح
        كان ينبغي أن يستهدف الاسم «حَشْو» لا الصفة المنسوبة — وهو مما يكشفه الفحص المعجمي
        (المعجم الوسيط: «من الناس الذي لا يعتمد عليه»). حَشْوِيّ (بياء النسبة) غير موثّق
        في هذا الاستعمال الشخصي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُتَطَفِّل"
      source: stage1
      decision: removed
      decision_reason: >
        المتطفل = دخيل يمارس خارج اختصاصه (فاعل نشيط). يناقض تماماً شخص المجموعة الذي
        لا يُؤدَّى عنه عمل (خامل انعدامي). تناقض في طبيعة الفعل يمنع القبول.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


