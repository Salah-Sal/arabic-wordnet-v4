stage1_review:
  assessment:
    concerns:
      - التعريف الحالي يفتقر إلى التفصيل الاصطلاحي الكافي (اقتصادي، ثقافي، تقني).
      - اللمة "عولمة" موجودة وهي الأنسب، ولكن قد نحتاج للنظر في بدائل أو مرادفات دقيقة.
    observations: "المصطلح 'عولمة' هو المصطلح المستقر في اللغة العربية المعاصرة لترجمة globalization. وهو مشتق من 'العالم' على وزن 'فوعلة' للدلالة على الصيرورة والإكساب. المصطلح قانوني واقتصادي وثقافي بالأساس."
  blind_candidates:
    - lemma: "عَوْلَمَة"
      generation_method: ishtiqaq
      justification: "مصدر للفعل عولم (المشتق من عالم)، وهو الوزن القياسي في العربية المعاصرة للتعبير عن globalization."
    - lemma: "تَدْوِيل"
      generation_method: ishtiqaq
      justification: "من 'دولي'، ويشير إلى صيرورة الشيء دولياً، ويستخدم أحياناً كمرادف في سياقات سياسية وقانونية."
    - lemma: "كَوْكَبَة"
      generation_method: majaz
      justification: "من 'الكوكب' (الأرض)، استُخدمت في بعض الكتابات الفكرية كبديل للعولمة للتأكيد على البعد الكوكبي (Planetary)."
    - lemma: "تَعْمِيم عَالَمِيّ"
      generation_method: tarkib
      justification: "تعبير وصفي مركب يشرح عملية جعل الشيء عاماً على مستوى العالم."

stage2_evidence:
  per_lemma:
    - lemma: "عَوْلَمَة"
      confirm:
        - text: "عولم النِّظامَ: جعله عالميًّا يشمل جميع بلدان العالم."
          source: "معجم اللغة العربية المعاصرة"
        - text: "حرِّيَّة انتقال المعلومات وتدفُّق رءوس الأموال والسِّلع... حيث تجري الحياة في العالم كمكان واحد أو قرية واحدة صغيرة."
          source: "معجم اللغة العربية المعاصرة"
        - text: "أجاز مجمع اللغة المصري استعمالها لجريانها على قواعد التصريف، حيث اشْتُقَّت من «العالَم» - بفتح اللام - على «فَوْعَلة» لإفادة هذا المعنى الجديد."
          source: "معجم الصواب اللغوي"
    - lemma: "تَدْوِيل"
      confirm:
        - text: "تَدْويل المدينة: جعلها دوليةً؛ تخضع لإشراف مجموعة من الدول."
          source: "معجم الصواب اللغوي"
      expands:
        - text: "internationalization"
          source: "المعجم الموحد لمصطلحات القانون"
    - lemma: "كَوْكَبَة"
      contradicts:
        - text: "النَّجْم أو الزهرة من بين النُّجُوم... مجموعة من النجوم تمثل بصورة معينة."
          source: "المعجم الوسيط"
          conflict: "المصطلح في المعاجم محصور في الفلك والجماعة من الناس، ولا يحمل المعنى الاصطلاحي لـ globalization."
    - lemma: "تَعْمِيم عَالَمِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عولمة"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والمستقر معجمياً واصطلاحياً، وقد أجازه مجمع اللغة المصري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَوْلَمَة"
    - lemma: "تَدْوِيل"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من قرابته الدلالية، إلا أنه يشير غالباً إلى الجانب القانوني والسياسي (internationalization) بينما العولمة أعمّ اقتصادياً وتقنياً."
    - lemma: "كوكبة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح لم يثبت بهذا المعنى في المعاجم المعتمدة."

stage4_content:
  definition:
    current: "النمو إلى نطاق عالمي أو واسع النطاق"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ولا يبرز الجوانب الاصطلاحية (الاقتصادية والتقنية والسياسية) التي تميز العولمة."
    authored:
      - type: terminological
        text: "إكسابُ الشَّيءِ صِبغَةً عالميّةً، وجعلُهُ يشملُ جَميعَ بلدانِ العالَمِ، وخاصّةً في المجالاتِ الاقتصاديّةِ والثَّقافيّةِ والتِّقنيّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "عَوْلَمَة"
        examples:
          - text: "أدّتِ العَوْلَمَةُ الاقتصاديّةُ إلى تزايدِ التَّرابطِ والاتِّصالِ بَيْنَ الأسواقِ العالَميّةِ."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13509313-n"
          definition_index: 0
          text: "إكسابُ الشَّيءِ صِبغَةً عالميّةً، وجعلُهُ يشملُ جَميعَ بلدانِ العالَمِ، وخاصّةً في المجالاتِ الاقتصاديّةِ والثَّقافيّةِ والتِّقنيّةِ."
      - command: add_synset_example
        params:
          synset_id: "awn4-13509313-n"
          text: "أدّتِ العَوْلَمَةُ الاقتصاديّةُ إلى تزايدِ التَّرابطِ والاتِّصالِ بَيْنَ الأسواقِ العالَميّةِ."

