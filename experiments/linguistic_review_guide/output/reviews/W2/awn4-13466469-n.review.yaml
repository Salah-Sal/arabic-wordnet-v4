stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (طرد مركزي، نبذ مركزي) بلا تشكيل — يجب إضافة التشكيل الكامل"
      - "الزائد المباشر (hypernym) هو 'عملية طبيعية' وهذا خطأ دلالي؛ فالطرد المركزي عملية صناعية/مختبرية وليست طبيعية"
      - "المجموعة تفتقر إلى مصطلح مفرد (غير مركب) يدلّ على العملية ذاتها؛ كلتا اللمّتين مركبتان وصفيّتان"
    observations: >
      المفهوم يدور حول عملية فصل المواد بحسب كثافاتها باستغلال القوة النابذة (الطاردة من المركز).
      المصطلحية العربية استقرّت على جذرَين رئيسيَّين: (ط ر د) في «طرد مركزي» و(ن ب ذ) في «نبذ/نابذة/تنبيذ/انتباذ».
      التعريف العربي الحالي مقبول من حيث المضمون لكنه يحتاج مراجعة أسلوبية ليلائم صياغة المعاجم.
  blind_candidates:
    - lemma: "تَنْبِيذ"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفْعِيل من نَبَّذَ، والنبذ في الأصل الطرح والإبعاد.
        الوزن تَفْعِيل يدلّ على إجراء العملية بأداة أو آلة، وهو مناسب لعملية الفصل بالنابذة.
    - lemma: "اِنْتِبَاذ"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن اِفْتِعَال من نَبَذَ. يدلّ على حدوث النبذ والتباعد عن المركز.
        صيغة الافتعال تحمل معنى المطاوعة والتأثّر، وهي ملائمة لعملية انفصال المواد بالقوة النابذة.
    - lemma: "فَرْز نَابِذِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي: الفرز (العزل والفصل) + نابذي (منسوب إلى القوة النابذة).
        الجذر ف ر ز يدلّ على عزل الشيء عن غيره، وهو أقرب لعملية الفصل من الطرد.
    - lemma: "تَثْفِيل"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفْعِيل من ثَفَّلَ. الثُّفْل هو ما استقرّ تحت الشيء من كُدرة وراسب.
        فالتثفيل يدلّ على عملية ترسيب المواد وفصلها بحسب الكثافة.

