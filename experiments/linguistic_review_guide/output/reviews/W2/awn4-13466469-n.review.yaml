stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١ ──
    - lemma: "طَرْد مَرْكَزِيّ"
      decision: confirmed
      decision_reason: >
        مصطلح مستقرّ في معاجم ALECSO المتعددة (الصحة، تقانات الأغذية، الفيزياء)
        ومتداول بكثرة في الأدبيات العلمية العربية. المركب الوصفي ثابت معجمياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        المصطلح الأكثر شيوعاً وتداولاً في الاستعمال العامّ والعلمي؛
        يركّز على فكرة «الطرد» (الإبعاد القسري) من المركز.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَرْد مَرْكَزِيّ"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "نَبْذ مَرْكَزِيّ"
      decision: confirmed
      decision_reason: >
        مُثبت في معجم الفيزياء العامة والنووية (ALECSO) وفي معجم تقانات الأغذية.
        يُستعمل خاصة في السياق الفيزيائي الأكاديمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُفضَّل في السياق الفيزيائي الأكاديمي؛ يركّز على فكرة «النبذ»
        (الطرح والإلقاء بعيداً) وهو أقرب إلى الأصل العربي الفصيح من «الطرد».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَبْذ مَرْكَزِيّ"

    # ── مرشح المرحلة ١: تنبيذ ──
    - lemma: "تَنْبِيذ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مفرد (غير مركب) مُثبت في أربعة معاجم موحدة على الأقل
        (الصيدلة، الطب البيطري، الطب الموحد، تقانات الأغذية) بتعريفات صريحة
        تطابق مفهوم centrifugation. له عائلة اشتقاقية كاملة: نَبَّاذَة/مِنْبَذَة (الآلة)،
        تَنْبِيذ تَفْريقِيّ (مركب فرعي). إضافته تُثري المجموعة بمصطلح مفرد مشتقّ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصطلح مفرد على وزن تَفْعِيل يدلّ على العملية ذاتها دون حاجة لصفة؛
        أدقّ وأخصر من المركبات الوصفية، ويُستعمل في المعاجم الطبية والصيدلانية.
      actions:
        - command: create_entry
          params: {lemma: "تَنْبِيذ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    # ── مرشح المرحلة ١: انتباذ ──
    - lemma: "اِنْتِبَاذ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبت في المعجم الموحد لمصطلحات الهندسة المدنية (ALECSO 2012) بتعريف
        يطابق مفهوم المجموعة تماماً: «استخدام القوة النابذة في فصل المواد الصلبة
        عن السائل اعتماداً على فرق الكثافة». صيغة الافتعال تضيف بُعداً دلالياً
        مميزاً (المطاوعة والانفعال).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ على حدوث عملية الانفصال ذاتها (المطاوعة)؛ يُستعمل في سياق الهندسة المدنية
        ومعالجة المياه، ويحمل دلالة التأثّر والاستجابة للقوة النابذة.
      actions:
        - command: create_entry
          params: {lemma: "اِنْتِبَاذ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    # ── مرشح مرفوض: فرز نابذي ──
    - lemma: "فَرْز نَابِذِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي لهذا المركب. التعبير وصفي حرّ وليس مصطلحاً مسكوكاً؛
        يمكن إبدال «فرز» بـ«فصل» أو «تصفية» ويبقى مفهوماً (فشل اختبار السكّ).
      evidence_assessment:
        case: no_material

    # ── مرشح مرفوض: تثفيل ──
    - lemma: "تَثْفِيل"
      source: stage1
      decision: removed
      decision_reason: >
        ورد في معجم واحد فقط (الصحة وجسم الإنسان 1992) ضمن مدخل مشترك مع «طرد مركزي»،
        ولم يرد بتعريف مستقلّ. الجذر ث ف ل يدلّ على الراسب والثُّفل (الكدر المستقر في القاع)
        وهو أقرب إلى الترسيب منه إلى الطرد المركزي. شيوعه محدود جداً مقارنة بالبدائل.
      evidence_assessment:
        case: mixed

