# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04774586-n  |  ILI: i62066  |  POS: n
# English: regularity
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # التقييم الأولي (بعد قراءة الملف الكامل)
  assessment:
    concerns:
      - "كلمة «معدل» في التعريف العربي الحالي (صفة الاتصاف بمبدأ ثابت أو معدل ثابت) تحيل إلى مفهوم النسبة المحسوبة (rate) وليس التواتر الزمني، مما يُضيّق الدلالة ويُبعدها عن الاستعمال العربي الطبيعي للمفهوم."
      - "التعريف مترجَم حرفياً من الإنجليزية (fixed principle or rate)؛ والأنسب صياغته بأسلوب المعجم الوسيط انطلاقاً من المفهوم الجوهري لا من الترجمة."
      - "اللمّتان خاليتان من التمييز الدلالي الدقيق بينهما في سجل المجموعة، رغم تباين السياقات التي تُستخدم فيها."
    observations: >
      المجموعة تعبّر عن مفهوم «الانتظام» بوصفه صفةً مجردة — أي الخاصية التي يتّصف بها كل ما يجري على وتيرة ثابتة ووفق نهج محدد. كلتا اللمّتين (اطِّرَاد وانْتِظَام) عربيتان خالصتان
      راسختا الجذر ومتشعّبتا الاشتقاق. غير أنّ اطِّراد يتميّز بكونه المصطلح الأكثر تخصّصاً في حقلَي اللسانيات وأصول الفقه، فيما يظل انْتِظَام أوسع انتشاراً في الاستعمال اليومي
      والتطبيقي. المجموعة متّسقة داخلياً، والمشكلة الجوهرية في التعريف لا في اللمّات.

  # المرشحات الأربعة — ولّدت انطلاقاً من التعريف قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "ثَبَاتِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «ثَبَات» على وزن (فَعَالِيَّة)، يدلّ على الصفة المجردة للثبوت والدوام على حال واحدة؛
        وذلك يتوافق مع «الاتصاف بمبدأ ثابت». الجذر ث-ب-ت يحمل دلالة الديمومة والرسوخ التي هي جوهر الانتظام.

    - lemma: "نَمَطِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «نَمَط» (النوع والطريقة)، يدل على الصفة الانتظامية القائمة على نمط متكرر ثابت.
        النمط في الأصل يعني الطريقة والصنف الثابت، ومنه المصطلح المعاصر «نمطي» بمعنى مطّرد ومتكرر وفق شكل محدد.

    - lemma: "تَوَاتُر"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفَاعُل من الجذر و-ت-ر؛ وقد ذكر ابن فارس أنّ «الوتيرة: المداومة على الشيء».
        التواتر لغةً هو تتابع الشيء على فترات متقاربة، وفي السياق المعاصر يُستخدم بمعنى التكرار المنتظم.

    - lemma: "اِطِّرَادِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «اطِّرَاد» على وزن (افتِعَالِيَّة)، يدل على الصفة المجردة للاطراد، أي كون الظاهرة
        مطّردة في ذاتها. يُميَّز بين اطِّرَاد (المصدر = الحدث) واطِّرَادِيَّة (الصفة المجردة = الخاصية النوعية).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    # ── اللمّة الأولى (موجودة): اطِّرَاد ──
    - lemma: "اطِّرَاد"
      confirm:
        - text: "«ورود سلوك تواصلي بتواتر معين وعلى وتيرة واحدة بحيث يُشكل ظاهرة يُفتَرض أنها خاضعة لقاعدة واحدة.»"
          source: "مسرد الإعلام والتواصل — ALECSO ArabTerm (translation_en: regularity)"
        - text: "«ورود الوحدة اللغوية بتواتر معين وعلى وتيرة واحدة بحيث تشكل ظاهرة تحكمها قاعدة واحدة. أسّس النحاة وعلماء الأصوات قوانينهم النحوية والصرفية على ملاحظة الاطراد في اللغة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ALECSO ArabTerm (translation_en: Regularity)"
        - text: "«اطراد الشيء متابعة بعضه بعضا تقول اطرد الأمر اطرادا، تبع بعضه بعضا. واطرد الماء كذلك والأنهار جرت. ومنه اطردت العادة، وقولهم اطرد الحد معناه تتابعت أفراده وجرت مجرى واحدا كجري الأنهار.»"
          source: "التوقيف على مهمات التعاريف — المناوي (ت 1622م)"
        - text: "«النظاميّة؛ القياسيّة؛ الانتظام؛ الاطّراد؛ التناسق.» [ترجمة: regularity]"
          source: "المورد الحديث (2008)"
        - text: "«اطّراد؛ استمرارية» [ترجمة: consistency]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الاطّراد هو دوران الحكم مع الوصف وجودا وعدما... والاطّراد في باب العلل معناه دوران الحكم مع الوصف وجودا وعدما.»"
          source: "كشاف اصطلاحات الفنون والعلوم — التهانوي (ت 1777م)"
          addition: >
            يُظهر أنّ اطِّرَاد في الاصطلاح المنطقي يعني الثبات والتلازم المطّرد بين الوصف وحكمه، مما يُعمّق
            دلالته على الانتظام وفق قاعدة ثابتة — وهو بالضبط ما تُعبّر عنه هذه المجموعة.
        - text: "«واطَّرَدَ الشَّيْءُ اطِّرَادًا، إِذَا تَابَعَ بَعْضُهُ بَعْضًا، وَإِنَّمَا قِيلَ ذَلِكَ تَشْبِيهًا، كَأَنَّ الْأَوَّلَ يَطْرُدُ الثَّانِي... وَاطَّرَدَ الْأَمْرُ: اسْتَقَامَ.»"
          source: "مقاييس اللغة — ابن فارس (ت 395هـ) [مادة طرد]"
          addition: >
            يكشف ابن فارس أنّ الأصل الدلالي لاطِّرَاد هو التتابع والاستقامة، وهو تأسيس راسخ لاستخدامه
            في دلالة الانتظام القائم على تتابع منتظم.

    # ── اللمّة الثانية (موجودة): انْتِظَام ──
    - lemma: "انْتِظَام"
      confirm:
        - text: "«انتظام» [ترجمة: regularity — مجال التربية]"
          source: "مسرد التربية — ALECSO ArabTerm"
        - text: "«انتظام» [ترجمة: regularity — مجال الصحة وجسم الإنسان]"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992) — ArabTerm"
        - text: "«انتظام» [ترجمة: regularity — المعجم الطبي الموحد]"
          source: "المعجم الطبي الموحد (2009) — ArabTerm"
        - text: "«(1) انتظام؛ اتِّساق (2) تماثل؛ تشاكل.» [ترجمة: uniformity]"
          source: "المورد الحديث (2008)"
        - text: "«الانتظامُ: تَقْدِيرُ الأُمُورِ وتدبيرها بِحَسَبِ المصالح.»"
          source: "معجم مقاليد العلوم — السيوطي (ت 911هـ)"
        - text: "«الانتظام: تقدير الأمور وترتيبها بحسب المصالح، ذكره العضد.»"
          source: "التوقيف على مهمات التعاريف — المناوي (ت 1622م)"
      expands:
        - text: "«(نَظَمَ) النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتَأْلِيفِهِ، وَنَظَمْتُ الْخَرَزَ نَظْمًا.»"
          source: "مقاييس اللغة — ابن فارس (ت 395هـ) [مادة نظم]"
          addition: >
            الأصل الدلالي لنظم هو الجمع والتأليف على خيط واحد (كنظم الخرز)، ومنه انتظام = صيرورة الأمور
            منتظمة كالخرز المنظوم على خيط، أي الترتيب وفق نظام داخلي متسق.

    # ── مرشح المرحلة ١ — ثَبَاتِيَّة ──
    - lemma: "ثَبَاتِيَّة"
      expands:
        - text: "«ثبات» [ترجمة: consistency — انسجام بين الإدراك والتوقعات]"
          source: "مسرد الإعلام والتواصل — ArabTerm (entry 487653)"
          addition: >
            الأصل «ثبات» يُعطى ترجمة «consistency» في المعاجم التقنية، لكنّ ثَبَاتِيَّة كصيغة مصدرية
            صناعية غير مُسجَّلة. دلالة الثبات تقترب من الاستقرار أكثر من الانتظام.
        - text: "«(ثَبَتَ) الثَّاءُ وَالْبَاءُ وَالتَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ دَوَامُ الشَّيْءِ.»"
          source: "مقاييس اللغة — ابن فارس (ت 395هـ) [مادة ثبت]"
          addition: "ابن فارس يرد الجذر ث-ب-ت إلى معنى «دوام الشيء» — الديمومة لا الانتظام."

    # ── مرشح المرحلة ١ — نَمَطِيَّة ──
    - lemma: "نَمَطِيَّة"
      contradicts:
        - text: "«نمطيّة» [ترجمة: routine — مجال التقنيات التربوية والحاسوبية]"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ArabTerm (entry 396071)"
          conflict: >
            المعجم يُترجم «نمطية» بـ«routine» لا بـ«regularity»؛ والروتين يعني التكرار الممل أو الإجراء
            المبرمج، وليس الانتظام بوصفه صفةً مجردة ذات قيمة. هذا يُنبئ بتباين دلالي جوهري.
      expands:
        - text: "«(نَمَطَ) النُّونُ وَالْمِيمُ وَالطَّاءُ كَلِمَةٌ تَدُلُّ عَلَى اجْتِمَاعٍ. وَالنَّمَطُ: جَمَاعَةٌ مِنَ النَّاسِ.»"
          source: "مقاييس اللغة — ابن فارس (ت 395هـ) [مادة نمط]"
          addition: >
            الأصل الدلالي لنمط هو الاجتماع والجماعة — لا يشتمل على معنى الانتظام الوظيفي بصورة مباشرة.
            الاستخدام المعاصر لـ«نمطي» يدور في فلك «النموذج الجامد» أو «الصورة النمطية»، لا في فلك الانتظام.

    # ── مرشح المرحلة ١ — تَوَاتُر ──
    - lemma: "تَوَاتُر"
      contradicts:
        - text: "«التواتر لغة: تتابع الشيء فرادى، وعرفا: الخبر الثابت على ألسنة قوم يمتنع تواطؤهم على الكذب.»"
          source: "التوقيف على مهمات التعاريف — المناوي (ت 1622م)"
          conflict: >
            الاستخدام الاصطلاحي السائد للتواتر هو في علم الحديث (الرواية الجماعية) وأصول الفقه، لا في
            سياق الانتظام الصفاتي المجرد. تخصيص التواتر لهذا المعنى سيخلق اشتراكاً لفظياً مع المصطلح الشرعي الراسخ.
        - text: "«تواتُر» [ترجمة: frequency — معدل التكرار في واحدة الزمن]"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ArabTerm"
          conflict: >
            في الاستخدام التقني المعاصر، تواتر يُترجم به «frequency» (التردد/التواتر الزمني)، وليس
            «regularity» (الانتظام بوصفه صفة). هذا التداخل يُضعف صلاحيته هنا.
      expands:
        - text: "«وَالْوَتِيرَةُ: الْمُدَاوَمَةُ عَلَى الشَّيْءِ، يُقَالُ: هُوَ عَلَى وَتِيرَةٍ.»"
          source: "مقاييس اللغة — ابن فارس (ت 395هـ) [مادة وتر]"
          addition: >
            «الوتيرة» تحمل معنى المداومة والسير على نهج واحد — وهذا الأقرب للمفهوم المطلوب، لكنّه من
            مشتقة «وتيرة» لا «تواتر».

    # ── مرشح المرحلة ١ — اِطِّرَادِيَّة ──
    - lemma: "اِطِّرَادِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الأولى: اطِّرَاد ──
    - lemma: "اطِّرَاد"
      decision: confirmed
      decision_reason: >
        مصطلح عربي خالص راسخ الجذر (طرد)، مُثبَّت في معاجم الاصطلاح والمعاجم الحديثة بترجمة «regularity»
        الإنجليزية بالضبط. ابن فارس يُصرّح باطّراد الشيء إذا تابع بعضه بعضاً، وهو تأصيل صريح للمفهوم.
        المعاجم التخصصية (اللسانيات، الإعلام والتواصل) تُوظّفه مصطلحاً للانتظام. تشكيله صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اطِّرَاد يُركّز على التتابع المستمر والجريان على وتيرة واحدة وفق قاعدة ثابتة؛ أصل معناه تتابع الأشياء
        كأنّ الأول يطرد الثاني، وهو المصطلح الأكثر تخصصاً في الدراسات اللسانية والأصولية.
        يُستخدم حين يُراد إبراز جانب الاستمرار المنتظم وفق قانون أو قاعدة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اطِّرَاد"

    # ── اللمّة الثانية: انْتِظَام ──
    - lemma: "انْتِظَام"
      decision: confirmed
      decision_reason: >
        مصطلح عربي خالص راسخ الجذر (نظم)، مُثبَّت في ثلاثة معاجم تقنية بترجمة «regularity»، وفي معاجم
        أشمل بمعاني الترتيب والاتساق. الأصل الصرفي افتعال من نظم يُفيد صيرورة الأمر منتظماً، وهو بالضبط
        ما تُمثّله هذه المجموعة. التعريفات الكلاسيكية (السيوطي، المناوي) تؤكد معنى الترتيب والتدبير.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        انْتِظَام يُركّز على جانب الترتيب والتنظيم وفق نظام وحكمة ومصلحة؛ أصل معناه من نظم الخرز:
        تأليف الأشياء على خيط واحد. أوسع انتشاراً في الاستعمال اليومي والعلمي العام
        (انتظام الدراسة، انتظام ضربات القلب، انتظام الوقائع).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْتِظَام"

    # ── مرشح المرحلة ١: ثَبَاتِيَّة ──
    - lemma: "ثَبَاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        دلالة «ثَبَات» في المعاجم هي الديمومة والاستقرار (دوام الشيء — ابن فارس)، وليس الانتظام بمعنى
        الجريان المتكرر وفق قاعدة. كذلك فإنّ «ثباتية» كصيغة مصدرية صناعية غير مُسجَّلة في المعاجم
        المتاحة، وتُنشئ التباساً مع مصطلح «استقرار» الأكثر شيوعاً. لا حاجة لإضافتها بوجود لمّتين مؤكدتين.

    # ── مرشح المرحلة ١: نَمَطِيَّة ──
    - lemma: "نَمَطِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم التقنية تُقابل «نمطية» بـ«routine» لا بـ«regularity»؛ ودلالة النمطية في العربية المعاصرة
        تنزع نحو الجمود والتكرار الرتيب (الصورة النمطية، الإجراء النمطي)، وهذه دلالة سلبية تتعارض مع
        دلالة «regularity» التي قد تكون مرغوبة. إضافةً إلى ذلك، الأصل الدلالي لنمط (الاجتماع —
        ابن فارس) لا يُغذّي معنى الانتظام الوظيفي.

    # ── مرشح المرحلة ١: تَوَاتُر ──
    - lemma: "تَوَاتُر"
      source: stage1
      decision: removed
      decision_reason: >
        التواتر مصطلح راسخ في علم الحديث (رواية جماعية يمتنع تواطؤها على الكذب)، واستخدامه في هذه
        المجموعة سيُحدث اشتراكاً لفظياً مع المصطلح الشرعي. كما أنّ معاجم الهندسة والمعلوماتية تُقابله
        بـ«frequency» (التردد)، مما يُرسّخ بُعده عن «regularity» (الانتظام الصفاتي). الوتيرة قريبة أكثر
        من المعنى المطلوب (المداومة على الشيء — ابن فارس) لكنّها ليست التواتر.

    # ── مرشح المرحلة ١: اِطِّرَادِيَّة ──
    - lemma: "اِطِّرَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصدر الصناعي «اطِّرَادِيَّة» ليس مُسجَّلاً في المعاجم المتاحة، وهو مشتق من «اطِّرَاد» الموجود
        أصلاً في المجموعة. إضافته ستُوجد مرادفاً اشتقاقياً من الجذر ذاته دون أيّ قيمة مضافة.
        «اطِّرَاد» هو الصيغة المستعملة والمسجّلة.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:

  definition:
    current: "صفة الاتصاف بمبدأ ثابت أو معدل ثابت"
    assessment:
      decision: revise
