# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'عملية لاواعية' مُصاغة كعبارة وصفية حرة وتفتقر إلى تشكيل كامل"
      - "التعريف العربي يستخدم صيغة المخاطَب ('لا تدركها بشكل مباشر') وهو أسلوب غير معجمي"
      - "يحتوي المجموعة على لمّة واحدة فقط، بينما ثمة مصطلح مرادف راسخ في المعاجم الطبية ('لاشعوري')"
    observations: >
      المجموعة تعبّر عن مفهوم نفسي فلسفي دقيق: العمليات العقلية التي تجري خارج نطاق
      الإدراك الواعي المباشر. في العربية يتنافس مصطلحان: 'لاواعٍ/لاواعية' (من جذر وعي —
      الضم والإحاطة بالمعرفة) و'لاشعوري/لاشعورية' (من جذر شعر — العلم والفطنة). وكلاهما
      راسخ في المعجمية العربية المتخصصة. أمّا 'الإضمار' فرغم إيحائه الدلالي بالخفاء
      فهو مُشغَل بالكامل في الاصطلاح النحوي والعروضي. التعريف الحالي صحيح مضموناً لكنه
      يفتقر إلى الأسلوب المعجمي الرصين، ولا سيّما في صيغة الخطاب والتعبير 'بشكل مباشر'.

  blind_candidates:
    - lemma: "الإِضْمَار"
      generation_method: majaz
      justification: >
        في كتب التعريفات الكلاسيكية تعني 'ترك الشيء مع بقاء أثره'؛ وهو ما يضاهي دلالياً
        العملية اللاواعية التي تجري خفيةً في أعماق النفس وتُخلِّف أثراً في السلوك والمشاعر
        من غير أن يدركها الواعي مباشرةً. محاولة إحياء هذا المعنى الدفين بإزاحة دلالية.

    - lemma: "اللاشُّعُورِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من 'لاشعوري' (جذر: شعر)، على وزن المصدر الصناعي المنتهي بياء مشددة
        وتاء. يدل على النشاط العقلي أو الحالة التي تقع خارج نطاق الشعور الحسي والإدراك المباشر.

    - lemma: "عَمَلِيَّة لاشُعُورِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي ثنائي: 'عملية' جنس قريب + 'لاشعورية' فصل نوعي. يقابل مباشرةً المصطلح
        الإنجليزي unconscious process، وقد رسخ استعماله في المعاجم الطبية والنفسية العربية
        المتخصصة مرادفاً لـ'عملية لاواعية' مع فارق في الحقل الاصطلاحي.

    - lemma: "التَّلَقَّائِيَّة النَّفْسِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من 'تلقائية' (ما يصدر من تلقاء ذاته دون إرادة ظاهرة) + 'نفسية'.
        يُستعمل في الأدب النفسي العربي وأدبيات السريالية العربية للدلالة على الأنشطة
        الذهنية التي تجري آلياً دون تدخل وعي مباشر، كالكتابة التلقائية عند السرياليين.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عملية لاواعية"
      confirm:
        - text: >
            «(2) لاواعٍ (نف) — (5) العقل اللاواعي؛ اللاوعي (نف).»
          source: "المورد الحديث (2008) — ترجمة: unconscious"
        - text: >
            «لاَوَعْي: جزء من العقل يحتوي المواد النفسية التي لا تعبها الأنا؛ لا تتوفر
            هذه المعلومات والخصائص العقلية في الذاكرة الواعية، بيد أن لها تأثيراً قوياً
            في الأفكار والمشاعر وسلوكيات الحياة اليومية.»
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (2020) — ترجمة: unconscious"
      expands:
        - text: >
            «الاستدخال: عملية عقلية تؤدي بالشخص إلى اتباع صفات واتجاهات وقيم أشخاص
            آخرين دون وعي، والتصرف تبعاً لذلك كما لو كانت هذه السمات أصيلة في الشخص
            المستدخل لها.»
          source: "معجم المصطلحات الطبية ج.3 (1997) — ترجمة: internalization"
          addition: >
            يُثبت أن صيغة 'عملية عقلية... دون وعي' مُستقرة في المصطلح العربي الطبي
            النفسي، مما يُعزز دلالة 'عملية لاواعية' في هذا السياق.

    - lemma: "الإِضْمَار"
      contradicts:
        - text: >
            «الإِضْمَار: إسقاط الشيء لا معنى.»
          source: "كتاب التعريفات للشريف الجرجاني (ت. 1413م)"
          conflict: "المصطلح مشغول في المنطق والنحو بمعنى 'إسقاط العنصر اللفظي'"
        - text: >
            «الإِضْمَار: ترك الشيء مع بقاء أثره.»
          source: "كتاب التعريفات للشريف الجرجاني (ت. 1413م)"
          conflict: >
            رغم قرب هذا المعنى دلالياً من المجاز المنشود، فإن المصطلح محمَّل باستعمالات
            أخرى راسخة تحجب الإزاحة الدلالية وتُفضي إلى اشتراك لفظي مُشكِل.
        - text: >
            «الإضمار (في العروض): إسكان الحرف الثاني كالتاء من مُتَفَاعِلُنْ في الكامل،
            فيصير مُتْفاعِلُنْ، فينتقل إلى مُسْتَفْعِلُنْ.»
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (1998)"
          conflict: "مُرسَّخ في اصطلاح العَروض"
        - text: >
            «الإضمار (في العروض): إسكان الحرف الثاني المتحرك من التفعيلة.
            (في النحو): عدم ظهور العامل وتقديره مع بقاء أثره في العمل.»
          source: "المعجم الكبير — مجمع اللغة العربية بالقاهرة"
          conflict: "مُرسَّخ في النحو والعَروض معاً"
        - text: >
            «إضمار: حذف بعض عناصر العبارة دون تأثير على فهم المقصود منها.»
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm) — ترجمة: ellipse"
          conflict: "مُرسَّخ في اصطلاح المعلوماتية واللسانيات بمعنى الحذف"

    - lemma: "اللاشُّعُورِيَّة"
      confirm:
        - text: >
            «لاشعوري»
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992) — ترجمة: unconscious"
        - text: >
            «افْتِهامٌ لاشُعُورِيّ»
          source: "المعجم الطبي الموحد (2009) — ترجمة: unconscious cerebration"
      contradicts:
        - text: >
            «لا شعور» (بوصفه الاسم الراسخ للمفهوم في المعاجم)
          source: >
            مسرد الفلسفة وعلم النفس — ALECSO (ArabTerm) — ترجمة: unconscious؛
            ومسرد علم الاجتماع والأنثروبولوجيا — ALECSO (ArabTerm)
          conflict: >
            صيغة 'لا شعور' هي الاسم الراسخ للمفهوم لا 'اللاشعورية'. المصدر الصناعي
            'اللاشعورية' يدل على الحالة/الخاصية لا على العملية بذاتها، مما يجعله
            غير ملائم لهذه المجموعة الترادفية تحديداً.

    - lemma: "عَمَلِيَّة لاشُعُورِيَّة"
      confirm:
        - text: >
            «افْتِهامٌ لاشُعُورِيّ»
          source: "المعجم الطبي الموحد (2009) — ترجمة: unconscious cerebration"
        - text: >
            «إدراك لا شعوري: إدراك يتحقق للفرد بموضوع معين دون وعي ظاهر منه به.»
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm) — ترجمة: subliminal perception"
        - text: >
            «لاشعوري»
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992) — ترجمة: unconscious"
      expands:
        - text: >
            «لِوَاطٌ لاشُعُورِيٌّ»
          source: "المعجم الطبي الموحد (2009) — ترجمة: unconscious homosexuality"
          addition: >
            يُثبت أن الصفة 'لاشعوري' منتجة تركيبياً مع أسماء متنوعة في المصطلح الطبي
            النفسي، مما يُعزز صحة 'عملية لاشعورية' كمصطلح مركب منتظم.

    - lemma: "التَّلَقَّائِيَّة النَّفْسِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عملية لاواعية"
      decision: confirmed
      decision_reason: >
        اللمّة مؤيَّدة بدليل معجمي معاصر (المورد الحديث، معجم الإشراف التربوي) ومُستقرة
        في الأدب النفسي العربي. هي مركب وصفي ثنائي شائع وإن لم يرد كمدخل مستقل في
        المعاجم. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على غياب الإرادة والوعي الإرادي (وعي = إحاطة المعرفة وضمّها وعيها في
        الصدر)؛ أوسع انتشاراً في الكتابة النفسية التربوية العربية المعاصرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّة لاوَاعِيَة"

    - lemma: "الإِضْمَار"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح مُثقَل بمعانٍ اصطلاحية راسخة في العَروض والنحو والمنطق والمعلوماتية؛
        تعدد المعاجم الموثِّقة لهذه المعاني يجعل الإزاحة المجازية إلى علم النفس مُشكِلةً
        وتُفضي إلى اشتراك لفظي حاد. الأدلة المعجمية كلها تعارض هذا الاستخدام.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "اللاشُّعُورِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصدر الصناعي 'اللاشعورية' يدل على الخاصية/الحالة (= كون الشيء لاشعورياً) لا
        على العملية بذاتها. المجموعة تُعبِّر عن عملية (process) لا عن حالة (state). الصيغة
        المُثبَتة في المعاجم هي 'لا شعور' للدلالة على اللاشعور كمنطقة نفسية. ولو أُريد
        جذر شعر فالأنسب هو 'عملية لاشعورية' (المرشح الثالث).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "عَمَلِيَّة لاشُعُورِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مؤيَّدة بأدلة معجمية طبية مباشرة: 'افتهام لاشعوري' = unconscious cerebration
        (المعجم الطبي الموحد 2009)، و'إدراك لا شعوري' مع تعريف يصفه بـ'دون وعي ظاهر'.
        المركب وصفي منتظم تركيبياً. يُكمِّل 'عملية لاواعية' بتغطية الحقل الطبي النفسي
        المتخصص ولا يُكرره بل يُمايزه دلالياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على غياب الإحساس والإدراك الحسي (شعر = علم وفطن للشيء)؛ أكثر تخصصاً
        في الطب النفسي والتحليل الفرويدي، ويُضمِر إحالةً إلى ما دون عتبة الحس.
      actions:
        - command: create_entry
          params:
            lemma: "عَمَلِيَّة لاشُعُورِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "التَّلَقَّائِيَّة النَّفْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أدلة معجمية تُسوِّي بين 'التلقائية النفسية' و'العملية اللاواعية'.
        المصطلح أعمُّ وأشمل؛ يدل على الآلية التلقائية بوجه عام بما قد يشمل أفعالاً
        عضلية وسلوكية، ولا يخصّص في العمليات العقلية اللاواعية تحديداً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


