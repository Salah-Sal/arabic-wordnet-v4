# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06286940-n
# phone message / telephone message — رسالة هاتفية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (رسالة هاتفية)، وقد يكون من المفيد إثراؤها بمرادفات"
      - "التعريف العربي ترجمة حرفية مختصرة للتعريف الإنجليزي"
    observations: >
      المفهوم واضح ومباشر: رسالة تُنقل عبر الهاتف. هذا مفهوم حديث مرتبط بتقنية الاتصالات،
      وأغلب التعبيرات العربية الطبيعية عنه تأتي في صيغة مركبات وصفية (اسم + نسبة).
      لا يوجد لفظ عربي مفرد مسكوك يؤدي هذا المعنى بعينه، فالمجاز والاشتقاق لا يسعفان
      هنا بمفردة واحدة دون التباس مع مفاهيم مجاورة (كالمكالمة الهاتفية).
  blind_candidates:
    - lemma: "رِسَالَة هَاتِفِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من «رسالة» (ما يُرسل من خطاب) و«هاتفية» (نسبة إلى الهاتف).
        أوضح تعبير عربي فصيح عن المفهوم، يوافق نمط التركيب الوصفي المنتج في العربية
        المعاصرة (مكالمة هاتفية، حوالة هاتفية، شبكة هاتفية).
    - lemma: "بَلَاغ هَاتِفِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «بلاغ» (ما يُبلَّغ من خبر أو بيان) و«هاتفي». يُستعمل في السياقات
        الرسمية والإدارية للدلالة على إشعار يُنقل عبر الهاتف.
    - lemma: "إِفَادَة هَاتِفِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من «إفادة» (ما يُفاد به من خبر) و«هاتفية». يُستعمل في السياقات
        الإدارية والقانونية، لكنه أضيق دلالة من «رسالة هاتفية».
    - lemma: "مُهَاتَفَة"
      generation_method: ishtiqaq
      justification: >
        مصدر ميمي من «هاتَفَ» على وزن مُفاعَلة، يدل على فعل المهاتفة.
        لكنه أقرب دلالياً إلى المكالمة الهاتفية منه إلى الرسالة المنقولة.

stage2_evidence:
  per_lemma:
    - lemma: "رِسَالَة هَاتِفِيَّة"
      confirm:
        - text: "«(الرسَالَة) ما يُرْسل والخطاب وكتاب يشتمل على قليل من المسائل تكون في موضوع واحد»"
          source: "المعجم الوسيط"
        - text: "«الرِّسَالَةُ: الوِسَاطَةُ بَيْنَ المُرْسِلِ والمُرْسَلِ إِلَيْهِ في إِيصالِ الأَخْبَارِ»"
          source: "المعجم الكبير"
        - text: "«(الْهَاتِف) الصَّوْت يسمع دون أَن يرى شخص الصائح و(التليفون) أَو من يتَكَلَّم بِهِ (مج)»"
          source: "المعجم الوسيط"
        - text: "«هَاتِفيّ: من (ه ت ف) نسبة إلى هَاتِف»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«رسالة: معلومات مكتوبة أو منطوقة يريد المتكلم أن يتقاسمها مع مخاطب معين»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "يوسّع مفهوم الرسالة ليشمل المنطوق، مما يغطي الرسائل الهاتفية"
        - text: "«مكالمة هاتفية، اتصال هاتفي — phone call»"
          source: "مسرد الفن والتسلية والرياضة (ALECSO)"
          addition: "يُثبت إنتاجية نمط التركيب الوصفي (اسم + هاتفي/هاتفية) في المصطلحية العربية"

    - lemma: "بَلَاغ هَاتِفِيّ"
      confirm:
        - text: "«(الْبَلَاغ) التَّبْلِيغ وَمَا يتَوَصَّل بِهِ إِلَى الْغَايَة وَبَيَان يذاع فِي رِسَالَة وَنَحْوهَا (مج)»"
          source: "المعجم الوسيط"
        - text: "«بلاغ — communique»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
      contradicts:
        - text: "«البلاغُ: الإبلاغ والتبليغ ما بلَغَك من خبرٍ ونحوه»"
          source: "المعجم الكبير"
          conflict: "البلاغ أقرب إلى البيان الرسمي أو التبليغ منه إلى الرسالة العامة"
        - text: "«بَلاغٌ: وثيقة تصدر عن الإدارة المركزية قصد الإخبار عما اتخذته من إجراءات وقرارات»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي"
          conflict: "البلاغ في الاستعمال المصطلحي الحديث وثيقة إدارية رسمية، لا رسالة هاتفية عامة"

    - lemma: "إِفَادَة هَاتِفِيَّة"
      contradicts:
        - text: "«إفادة — deposition»"
          source: "المعجم الموحد لمصطلحات القانون"
          conflict: "إفادة مصطلح قانوني يعني الشهادة أو الإدلاء بالأقوال، لا الرسالة"

    - lemma: "مُهَاتَفَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "رِسَالَة هَاتِفِيَّة"
      decision: confirmed
      decision_reason: >
        مركب وصفي شفاف ومنتج، مكوّناه (رسالة + هاتفية) مؤصّلان في المعاجم العربية.
        النمط التركيبي (اسم + صفة نسبية من هاتف) مثبت في المصطلحية العربية الحديثة
        (مكالمة هاتفية، حوالة هاتفية، شبكة هاتفية). التعبير واضح الدلالة ولا يحتاج شرحاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِسَالَة هَاتِفِيَّة"

    - lemma: "بَلَاغ هَاتِفِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        البلاغ في الاستعمال المعاصر يميل إلى الدلالة على البيان الرسمي أو الإشعار الإداري،
        لا على الرسالة العامة المنقولة عبر الهاتف. المعاجم تؤكد هذا التخصيص الدلالي.
      evidence_assessment:
        case: mixed

    - lemma: "إِفَادَة هَاتِفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        إفادة مصطلح قانوني/إداري متخصص يعني الشهادة أو الإدلاء بالأقوال،
        لا الرسالة العامة. استعماله في هذا السياق يُوقع في اللبس.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُهَاتَفَة"
      source: stage1
      decision: removed
      decision_reason: >
        المُهاتَفة مصدر يدل على فعل الاتصال الهاتفي المتبادل (المكالمة)،
        لا على الرسالة المنقولة عبر الهاتف. الفرق بين المكالمة والرسالة جوهري.
      evidence_assessment:
        case: no_material

