# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13794608-n
# load / loading — كمية يمكن معالجتها أو نقلها في وقت واحد
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (حمل، حمولة) بدون تشكيل، مما يُبهم الدلالة المقصودة"
      - "حمولة في الاستعمال التراثي تدلّ على الدوابّ التي يُحمل عليها لا على الكمية المحمولة ذاتها"
      - "المجموعة تغطّي مفهومَي النقل والمعالجة معاً، وقد يلزم لمّة تغطّي الجانب الصناعي (الدُّفعة)"
    observations: >-
      التعريف يجمع بين بُعدَيْن: كمّية تُنقل دفعةً واحدة (حِمْل/حُمُولَة)، وكمّية تُعالَج مرّة واحدة (دُفْعَة/وَجْبَة).
      اللمّتان الموجودتان تميلان إلى بُعد النقل. الاشتقاق العربي غنيّ بمادة «ح م ل» للدلالة على الإقلال والحمل،
      وبمادة «د ف ع» للدلالة على ما يُنجَز بمرّة واحدة.
  blind_candidates:
    - lemma: "حِمْل"
      generation_method: ishtiqaq
      justification: "من جذر «ح م ل» على وزن فِعْل، يدلّ على ما يُحمل على الظهر أو يُنقل، وهو الاسم العربي المباشر للكمية المنقولة"
    - lemma: "شُحْنَة"
      generation_method: ishtiqaq
      justification: "من جذر «ش ح ن» على وزن فُعْلَة، يدلّ على ما تُشحن به السفينة ونحوها من بضائع، أي الكمية المنقولة في وعاء واحد"
    - lemma: "دُفْعَة"
      generation_method: ishtiqaq
      justification: "من جذر «د ف ع» على وزن فُعْلَة، يدلّ على ما يُنجز أو يُصبّ بمرة واحدة، ويُستعمل حديثاً بمعنى batch أي الكمية المُعالَجة دفعة واحدة"
    - lemma: "وِقْر"
      generation_method: majaz
      justification: "لفظ تراثي يدلّ على الحمل الثقيل للحمار والبغل، يُمكن توسيعه مجازياً ليشمل أيّ كمّية منقولة مرّة واحدة"


stage2_evidence:
  per_lemma:
    - lemma: "حِمْل"
      confirm:
        - text: "«الحِمْلُ: ما كان على ظهرٍ أو رأسٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الحاء والميم واللام أصل واحد يدلّ على إقلال الشيء. يقال حملتُ الشيءَ أحمله حملاً»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الحمل: ما اشتغل به الناقل، ذكره الحرالي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«حِمْل = load: مصطلح شامل يُستخدَم في الأجهزة الكهربائية والتجهيزات الأخرى المتصلة بمصدر قدرة كهربائية»"
          source: "المعجم الموحد لمصطلحات الطاقة"
          addition: "يُستعمل حِمْل في الاصطلاح التقني بمعنى load الكهربائي أيضاً"
    - lemma: "حُمُولَة"
      confirm:
        - text: "«كلّ ما حمل من بعير أو حمار أو غير ذلك، سواء كانت عليها أثقال أو لم تكن. الأحمالُ بأعيانها»"
          source: "المعجم الوسيط (OCR)"
        - text: "«حُمولة = cargo: شحنة: ما تشحن به الناقلات والسفن من البضائع»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      contradicts:
        - text: "«الحَمولة: بالفتح الإبل والحمرُ تحمل عليها الأثقال»"
          source: "مختار الصحاح (هورماني)"
          conflict: "بالفتح تدلّ على الدوابّ نفسها لا على الأحمال، لكنّ المعنى المقصود هنا بالضمّ (الأحمال بأعيانها)"
      expands:
        - text: "«والحَمُولة: الإبلُ تُحمل عليها الأثقال... والأثقال أنفسُها حَمُولة»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يُقرّ بأنّ حَمُولة تطلق على الأثقال ذاتها وعلى دوابّ الحمل"
    - lemma: "شُحْنَة"
      confirm:
        - text: "«ما تُملأ به السفينةُ ونحوُها من بضائع وأمتعة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«ما تشحن به السفينة ونحوها»"
          source: "المعجم الوسيط (هورماني)"
      expands:
        - text: "«ما يُجمع من طعام ونحوه ليكفى وقتاً معلوماً»"
          source: "المعجم الوسيط (OCR)"
          addition: "معنى ثانٍ للشحنة: ما يُجمع ليكفي فترة معيّنة، وهو قريب من مفهوم الدُّفعة"
        - text: "«الشين والحاء والنون أصلان متباينان، أحدهما يدلّ على الملء»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الأول (الملء) يدعم دلالة الشحنة على ما يُملأ به الوعاء"
    - lemma: "دُفْعَة"
      confirm:
        - text: "«الدُّفْعَة من المطر: الدُّفْقَة. ما انصبَّ من سقاء أو إناء بمرّة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«دَفْعَة = batch: كمية الأنسجة التي يمكن تشغيلها في مرحلة واحدة لتمييزها عن التشغيل المستمر»"
          source: "مسرد صناعة النسيج (ArabTerm)"
        - text: "«دَفْعَة = batch: مجموعة متجانسة من المفردات، ومنها دفعة بطاقات»"
          source: "مسرد التربية (ArabTerm)"
      expands:
        - text: "«أعطاه ألفاً دُفعةً: مرّة»"
          source: "المعجم الوسيط (OCR)"
          addition: "شاهد على استعمال دُفْعَة بمعنى المرّة الواحدة"
        - text: "«والدُّفْعَةُ من المطر والدم وغيره»"
          source: "مقاييس اللغة لابن فارس"
          addition: "تعميم الدُّفعة على كلّ ما يُدفع بمرة واحدة"
    - lemma: "وِقْر"
      confirm:
        - text: "«والوِقْر: الحِمْل الثقيل»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«الوقر بالكسر: حمل الحمار والبغل كالوسق للبعير»"
          source: "مختار الصحاح (هورماني)"
      contradicts:
        - text: "«الواو والقاف والراء أصل يدلّ على ثقل في الشيء. منه الوَقْر: الثقل في الأذن»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "المعنى الأول للجذر هو ثقل السمع (الصمم)، والمعنى الحملي مقيّد بالدوابّ"


stage3_analysis:
  per_lemma:
    - lemma: "حِمْل"
      decision: confirmed
      decision_reason: >-
        لفظ عربي أصيل من جذر «ح م ل» على وزن فِعْل، معناه الأساسي ما يُحمل على الظهر أو يُنقل.
        ثابت في المعاجم الكلاسيكية والاصطلاحية الحديثة بمعنى load.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الكمّية المنقولة أو المحمولة مادّياً (ما على الظهر أو الرأس)، وهو أعمّ من حُمُولَة التي تخصّصت في البضائع المشحونة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِمْل"

    - lemma: "حُمُولَة"
      decision: confirmed
      decision_reason: >-
        ثابت في المعجم الوسيط بمعنى «الأحمال بأعيانها» وفي المعاجم الاصطلاحية الحديثة بمعنى cargo.
        القراءة بالضمّ (حُمُولَة) هي التي تدلّ على الأحمال ذاتها لا على الدوابّ.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على مجموع البضائع أو الأحمال المشحونة في وسيلة نقل (سفينة، شاحنة)، أخصّ من حِمْل وأقرب إلى cargo"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُمُولَة"

    - lemma: "شُحْنَة"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم ورودها في المعاجم بمعنى «ما تُملأ به السفينة»، فإنّها تتداخل دلالياً مع حُمُولَة
        في بُعد النقل البحري، ولا تغطّي بُعد المعالجة الدُّفْعِيَّة. كما أنّ لها معانٍ أخرى مشتركة
        (العداوة، الشرطة) تُضعف وضوحها. الأولى الاكتفاء بحُمُولَة لتغطية بُعد الشحن.

    - lemma: "دُفْعَة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        لفظ عربي أصيل من جذر «د ف ع» على وزن فُعْلَة، معناه الأصلي «ما يُدفع بمرّة واحدة».
        استُعمل في المعاجم الاصطلاحية الحديثة (النسيج، الكيمياء، النفط، التربية) بمعنى batch
        أي «الكمّية التي تُعالَج في مرحلة واحدة». يغطّي بُعد المعالجة الذي لا تغطّيه حِمْل وحُمُولَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الكمّية التي تُعالَج أو تُنجَز في عملية واحدة (batch)، وتغطّي البُعد الصناعي والتقني للمفهوم"
      actions:
        - command: create_entry
          params:
            lemma: "دُفْعَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "وِقْر"
      source: stage1
      decision: removed
      decision_reason: >-
        لفظ تراثي مقيّد بحمل الدوابّ (الحمار والبغل)، والجذر يدلّ أساساً على الثِّقَل لا على الكمّية.
        لا يُستعمل في العربية الحديثة بمعنى load العام، ومعناه الأشهر اليوم هو ثقل السمع.
        لا يُضيف قيمة تمييزية إلى المجموعة.


