# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13874592-n
# temperature scale — نظام لقياس درجة الحرارة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مقياس درجة الحرارة» تفتقر إلى التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط رغم وجود مصطلحات مرادفة شائعة كـ«سُلَّم» في الاستعمال العلمي"
      - "التعريف العربي مقتضب ولا يميّز بين «نظام القياس» (scale) و«أداة القياس» (thermometer)"
    observations: >
      المفهوم يشير إلى نظام تدريجي محدَّد لتقدير درجة الحرارة (كسُلَّم سلسيوس أو فَهْرَنْهَايت أو كلفن)،
      وليس إلى أداة القياس (المِحرار/الترمومتر). المصطلحات العربية العلمية تتوزّع بين «مِقْيَاس» و«سُلَّم» و«تَدْرِيج»
      في المعاجم المتخصصة. المفارقة أنّ «مقياس حرارة» بدون «درجة» تعني الترمومتر (الأداة)، فإضافة «درجة» ضرورية
      لتمييز النظام عن الأداة. المجموعة الأعلى (hypernym) هي «نظام قياس» مما يؤكد أنّ المقصود هو النظام لا الأداة.
  blind_candidates:
    - lemma: "سُلَّمٌ حَرَارِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «سُلَّم» بمعنى المِرقاة والتدرّج و«حراريّ» نسبةً إلى الحرارة.
        «السُّلَّم» في المعجم الوسيط يعني ما يُتوصَّل به إلى شيء ما، وفي الموسيقى جملة نغم
        مفصلة الحدود بالحساب درجة فوق الأخرى، فالنقل إلى نظام درجات الحرارة مجاز قريب.
    - lemma: "مِقْيَاسُ الحَرَارَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مِقْيَاس» على وزن مِفْعَال الدال على أداة القياس و«الحرارة».
        بيد أنّ هذا التركيب قد يلتبس بالترمومتر (أداة القياس) دون تحديد «درجة».
    - lemma: "تَدْرِيجٌ حَرَارِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من مصدر «دَرَّجَ» بمعنى جعل الشيء متدرّجاً و«حراريّ».
        الجذر «درج» يدلّ على المضي في الشيء درجةً بعد درجة، فالتدريج الحراري
        هو نظام جعل الحرارة متدرّجة بقيم محدّدة.
    - lemma: "سُلَّمُ دَرَجَةِ الحَرَارَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي مركّب يجمع «سُلَّم» و«درجة الحرارة» في وحدة اصطلاحية.
        يميّز بوضوح بين نظام القياس والأداة، ويوازي المصطلح الإنجليزي temperature scale.

stage2_evidence:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "مقياس درجة الحرارة"
      confirm:
        - text: "«مقياس درجة الحرارة الديناميكية» — ترجمة thermodynamic temperature scale"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«مقياس درجات الحرارة الدولي (لعام 1990) (ITS-90)» — هو مقياس درجات الحرارة الذي اعتمدته اللجنةُ الدولية للأوزان والمقاييس (CIPM)، للتطبيق على القياسات العملية"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«مقياس درجات الحرارة الدولي (لعام 1968) IPTS-68» — هذا المقياس انتهى العمل به لدى اقرار مقياس درجات الحرارة الدولي (لعام 1990) ITS-90"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
      expands:
        - text: "«المقياس» — المِقْدَار وما قيس به من أداة أو آلة"
          source: "المعجم الوسيط"
          addition: "المقياس في الوسيط أعمّ من نظام درجات الحرارة ويشمل أي أداة أو معيار للقياس"

    # ── المرشحات ──
    - lemma: "سُلَّمٌ حَرَارِيٌّ"
      confirm:
        - text: "«سلم <رانكن> الحراري» — ترجمة Rankine temperature scale"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«مقياس حراري نيكلي 50» — مُقاومات القياس النيكلية"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
      contradicts:
        - text: "«مِقْيَاسُ حَرَارِي صَوْتِي» — ترجمة acoustic thermometer"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
          conflict: "صيغة «مقياس حراري» في الأرصاد تعني الترمومتر (أداة) لا نظام القياس"

    - lemma: "مِقْيَاسُ الحَرَارَةِ"
      confirm:
        - text: "«مقياس الحرارة المئوية» — ترجمة Celsius temperature scale"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«مقياس الحرارة الدولى المعتمد لسنة 1990» — ترجمة International Temperature Scale of 1990; ITS-90"
          source: "موسوعة الكهرباء (IEC 60050)"
      contradicts:
        - text: "«مقياس حرارة» — جهاز قياس يُستخدم لقياس درجة الحرارة — ترجمة thermometer"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          conflict: "«مقياس حرارة» بدون ال التعريف على حرارة تعني الترمومتر (الأداة). والتمييز دقيق بين «مقياس الحرارة» (النظام) و«مقياس حرارة» (الأداة)"

    - lemma: "تَدْرِيجٌ حَرَارِيٌّ"
      confirm:
        - text: "«تدريج درجة الحرارة المئوية» — تدريج قيم مُتغيِّر درجة الحرارة المئوية، ويُعرَّف من خلال النقطة الثلاثية للماء عند 0,01 سيلزيوس"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
      expands:
        - text: "«تدريج» — ترجمة graduation / scale"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "تدريج بمعنى التقسيم المتدرج لمقياس"

    - lemma: "سُلَّمُ دَرَجَةِ الحَرَارَةِ"
      confirm:
        - text: "«سلم درجة الحرارة المئوي» — سيلزوس — ترجمة Celsius temperature scale"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«سلم درجة الحرارة الفهرنهايتي» — ترجمة Fahrenheit temperature scale"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«سلم درجة الحرارة الدولي» — ترجمة international temperature scale"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«سُلم درجة الحرارة المُطْلَقَة» — ترجمة absolute temperature scale"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«سُلّمُ فَهْرَنْهِيت لدرجات الحرارة» — ترجمة Fahrenheit temperature scale"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«سُلُّمُ كِلْفِين لِلْحَرارة» — ترجمة Kelvin temperature scale"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«سُلَّم الحرارة المُطْلَقة» — ترجمة absolute temperature scale"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      expands:
        - text: "«السُّلَّمُ» — ما يُصعَدُ عليه إلى الأمكنة العالية. ما يُتوَصَّلُ به إلى شيءٍ ما. (فى الموسيقى): جملةُ نَغَم مفصلة الحدود بالحساب درجة فوق الأخرى"
          source: "المعجم الوسيط"
          addition: "دلالة السُّلَّم على التدرّج المنتظم من درجة إلى أخرى تناسب مفهوم نظام درجات الحرارة المتدرّج"

stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "مِقْيَاسُ دَرَجَةِ الحَرَارَةِ"
      decision: confirmed
      decision_reason: >
        مصطلح ثابت مُوثَّق في معاجم ARABTERM المتخصصة (الهندسة الكهربائية، موسوعة الكهرباء)
        يُستخدم في سياق «مقياس درجات الحرارة الدولي» وغيره. الإضافة «درجة» تميّزه عن
        «مقياس حرارة» (الترمومتر). يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُستخدم في السياقات الهندسية والمِترولوجية (علم القياس) بوصفه نظاماً مقنَّناً لتحديد قيم
        درجة الحرارة. يوحي بالمعيارية والضبط القياسي أكثر من «سُلَّم» الذي يوحي بالتدرّج.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِقْيَاسُ دَرَجَةِ الحَرَارَةِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "سُلَّمٌ حَرَارِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        الشكل الوصفي «سُلَّم حراريّ» غير موثّق كوحدة معجمية مستقلة تعني نظام قياس درجة الحرارة.
        الشواهد تُظهر «سلم رانكن الحراري» بصيغة إضافية لا وصفية. كما أنّ «مقياس حراري» تعني
        الترمومتر فيلتبس الأمر. الصيغة الإضافية «سُلَّم درجة الحرارة» أدقّ وأوثق.

    - lemma: "مِقْيَاسُ الحَرَارَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورودها في موسوعة الكهرباء بمعنى temperature scale (مع لاحقة تمييزية كـ«المئوية»)،
        فإنّ «مقياس حرارة» بدون ال التعريف تعني الترمومتر (الأداة) وهذا الالتباس خطير.
        التمييز بين «مقياس الحرارة» و«مقياس حرارة» دقيق جداً ولا يصمد في الاستعمال.
        الأولى الاحتفاظ بالصيغة الكاملة «مقياس درجة الحرارة» لتجنّب اللبس.

    - lemma: "تَدْرِيجٌ حَرَارِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «تدريج» بمعنى graduation/scale مُوثَّق في عدة معاجم، لكن الشكل الوصفي «تدريج حراري»
        غير مُسجَّل كمصطلح ثابت. الشواهد تُظهر الصيغة الإضافية «تدريج درجة الحرارة المئوية»
        في مسرد الهندسة الكهربائية، وهي أطول وأقلّ شيوعاً من «سُلَّم» و«مِقْيَاس».

    - lemma: "سُلَّمُ دَرَجَةِ الحَرَارَةِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح راسخ وشائع في المعاجم العلمية العربية الموحَّدة. ورد في معجم الفيزياء (سلم درجة الحرارة
        المئوي، الفهرنهايتي، الدولي) وفي معجم الأرصاد (سلم درجة الحرارة المطلقة) ومعجم الفيزياء
        (سلم الحرارة المطلقة). يُستخدم في سياقات الفيزياء والأرصاد بكثافة عالية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُستخدم في سياقات الفيزياء والأرصاد الجوية بوصفه تدريجاً متسلسلاً لقيم الحرارة.
        «سُلَّم» يوحي بالتدرّج المنتظم (كالدَّرَج) أكثر من «مِقْيَاس» الذي يوحي بالمعيار والأداة.
      actions:
        - command: create_entry
          params:
            lemma: "سُلَّمُ دَرَجَةِ الحَرَارَةِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

