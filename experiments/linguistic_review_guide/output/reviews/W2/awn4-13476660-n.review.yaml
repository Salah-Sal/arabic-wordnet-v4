stage1_review:
  assessment:
    concerns: []
    observations: "المصطلح المعطى «معالجة البيانات» هو المصطلح المعياري المعتمد والمستقر في علوم الحاسوب لترجمة (Data processing). لا توجد إشكاليات لغوية أو دلالية."
  blind_candidates:
    - lemma: "مُعَالَجَةُ البَيَانَاتِ"
      generation_method: tarkib
      justification: "تركيب إضافي يعكس المعنى الحرفي والمصطلحي الدقيق؛ فالمعالجة تعني إجراء العمليات، والبيانات هي المادة الخام."
    - lemma: "مُعَالَجَةُ المَعْلُومَاتِ"
      generation_method: tarkib
      justification: "تركيب إضافي قريب من الأول، رغم أن المعلومات عادة ما تكون نتيجة لمعالجة البيانات وليست مادتها الخام قبل المعالجة."
    - lemma: "تَنْظِيمُ البَيَانَاتِ"
      generation_method: tarkib
      justification: "يعبر عن جزء من عملية المعالجة وهو الترتيب والتنظيم، وإن كان قاصرا عن شمول المعنى."
    - lemma: "حَوْسَبَةُ البَيَانَاتِ"
      generation_method: tarkib
      justification: "يشير إلى معالجة البيانات باستخدام الحاسوب، كبديل حديث يركز على الأداة."

stage2_evidence:
  per_lemma:
    - lemma: "معالجة البيانات"
      confirm:
        - text: "مجموعة واسعة من العمليات التي يمكن إجراؤها على البيانات بوسائل يدوية أو مؤتمتة."
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "التعامل المنظم مع البيانات وذلك بهدف الحصول على معلومات. وقد يتم هذا التعامل يدوياً أو آلياً."
          source: "المعجم الموحد لمصطلحات المعلوماتية (2000)"
        - text: "إجراء عمليات حاسوبية ومنطقية على البيانات لاستخراج معلومات ونتائج محددة منها."
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
    - lemma: "مُعَالَجَةُ البَيَانَاتِ"
      confirm:
        - text: "مجموعة واسعة من العمليات التي يمكن إجراؤها على البيانات بوسائل يدوية أو مؤتمتة."
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
    - lemma: "مُعَالَجَةُ المَعْلُومَاتِ"
      confirm:
        - text: "علم المعالجة الآلية للمعلومات بواسطة الحاسوب"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
    - lemma: "تَنْظِيمُ البَيَانَاتِ"
      evidence_status: "no_material_found"
    - lemma: "حَوْسَبَةُ البَيَانَاتِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "معالجة البيانات"
      decision: confirmed
      decision_reason: "هو المصطلح القياسي المستقر لترجمة (data processing)، وتؤكده المعاجم المتخصصة الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح الأساسي والشائع الذي يؤدي المعنى الوظيفي لمعالجة البيانات."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعَالَجَةُ البَيَانَاتِ"
    - lemma: "مُعَالَجَةُ البَيَانَاتِ"
      source: stage1
      decision: removed
      decision_reason: "مكرر عن اللمة الموجودة في المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
    - lemma: "مُعَالَجَةُ المَعْلُومَاتِ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح يترجم غالباً (information processing) ويرتبط بمرحلة متقدمة من المعالجة، والالتزام بـ«معالجة البيانات» أدق للتدلال على المادة الخام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
    - lemma: "تَنْظِيمُ البَيَانَاتِ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح يشير إلى جزء فقط من العملية (data organization) ولا يعكس الشمول المطلوب في «المعالجة»."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
    - lemma: "حَوْسَبَةُ البَيَانَاتِ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير شائع الاستخدام كمرادف مباشر لمعالجة البيانات."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true

stage4_content:
  definition:
    current: "(في علم الحاسوب) سلسلة من العمليات على البيانات بواسطة الحاسوب من أجل استرجاع المعلومات أو تحويلها أو تصنيفها"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق ويعبر عن المفهوم بوضوح وشمول، ويتوافق مع التعاريف المعجمية المتخصصة."
  examples:
    per_lemma:
      - lemma: "معالجة البيانات"
        examples:
          - text: "تستغرق عملية مُعَالَجَة البَيَانَاتِ الضخمة وقتاً طويلاً وموارد حاسوبية هائلة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تستغرق عملية مُعَالَجَة البَيَانَاتِ الضخمة وقتاً طويلاً وموارد حاسوبية هائلة."

