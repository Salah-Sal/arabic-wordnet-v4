# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13879683-n — contradictoriness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (تَنَاقُض)، ما يستدعي البحث عن مرادفات محتملة"
      - "التعريف العربي ترجمة حرفية للإنجليزي، ويمكن تحسينه بأسلوب معجمي عربي"
    observations: "المفهوم المقصود هو العلاقة المنطقية بين المتناقضَيْن — وهي أخصّ من التضاد (الذي يمثّل المستوى الأعلى في الهرم). التناقض في المنطق يعني استحالة اجتماع الطرفين واستحالة ارتفاعهما معاً، بخلاف التضاد الذي يستحيل فيه الاجتماع فقط. المصطلح راسخ في التراث المنطقي والأصولي العربي."
  blind_candidates:
    - lemma: "تَنَاقُض"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَاعُل من الجذر (نقض) يدلّ على التدافع المتبادل بين طرفين، وهو المصطلح المنطقي الأشهر لهذا المفهوم"
    - lemma: "تَنَافٍ"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَاعُل من الجذر (نفي) يدلّ على النفي المتبادل بين شيئين لا يجتمعان، يُستعمل في الرياضيات بمعنى incompatibility"
    - lemma: "مُنَاقَضَة"
      generation_method: ishtiqaq
      justification: "مصدر ميمي على وزن مُفَاعَلَة من (نقض) يدلّ على فعل النقض المتبادل بين قولين أو دليلين"
    - lemma: "تَعَانُد"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَاعُل من الجذر (عند) يدلّ على التقابل بين أمرين وجوديين عند الحكماء"

stage2_evidence:
  per_lemma:
    - lemma: "تَنَاقُض"
      confirm:
        - text: "«التَّنَاقُضُ: اخْتِلَاف قضيتين بالسلب، والإيجاب بِحَيْثُ يَقْتَضِي لذاته أَن تكون إِحْدَاهمَا صَادِقَة وَالْأُخْرَى كَاذِبَة.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«التناقض: اختلاف قضيتين بإيجاب وسلب بحيث يقتضي لذاته صدق أحدهما وكذب الأخرى، نحو زيد إنسان زيد غير إنسان وأصله قولهم تناقض الكلامان إذا تدافعا كأن كل واحد ينقض الآخر.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«التناقض: هو اختلاف القضيتين بالإيجاب والسلب، بحيث يقتضي لذاته صدق إحداهما وكذب الأخرى، كقولنا: زيد إنسان، زيد ليس بإنسان.»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«(التَّنَاقُض) يُقَال فِي كَلَامه تنَاقض بعضه يَقْتَضِي إبِْطَال بعض و(فِي الْمنطق) النِّسْبَة بَين المتناقضين»"
          source: "المعجم الوسيط"
        - text: "«التَّنَاقُضُ: بعضُ الكلام يقتضى إبطال بعض (في المنطق): النسبة بين المتناقضين»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«التّناقض: هو عند الأصوليين تقابل الدليلين المتساويين على وجه لا يمكن الجمع بينهما بوجه ويسمّى بالتعارض والمعارضة أيضاً. وعند المنطقيين يطلق على تناقض المفردات وتناقض القضايا... ومن جملة أحكام النقيضين أنّهما لا يجتمعان ولا يرتفعان بخلاف الضدين فإنّهما لا يجتمعان ولكن يرتفعان.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يوضح الفرق الجوهري بين التناقض والتضاد: المتناقضان لا يجتمعان ولا يرتفعان، بخلاف المتضادين"
        - text: "«التناقض: هو سبقُ كلام المدعي مناقضاً لدعواه، يعني سبقُ كلام موجب لبطلان دعواه.»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "استعمال فقهي للتناقض في سياق الدعاوى القضائية"

    - lemma: "تَنَافٍ"
      confirm:
        - text: "«تَنَافُر: تعارض بين جملتين أو قضيتين أولاهما صادقة وأخراهما كاذبة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«التنافي: هو اجتماع الشيئين في واحد في زمان واحد، كما بين السواد والبياض، والوجود والعدم.»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "تعريف الجرجاني للتنافي يشمل التضاد (السواد والبياض) والتناقض (الوجود والعدم) معاً، فهو أعمّ من مفهوم المجموعة"
      expands:
        - text: "«تَنَافٍ — incompatibility»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "يُستعمل في الرياضيات بمعنى عدم التوافق، لا بمعنى التناقض المنطقي تحديداً"

    - lemma: "مُنَاقَضَة"
      contradicts:
        - text: "«المُنَاقَضَةُ: منع مُقَدّمَة مُعينَة من مُقَدمَات دَلِيل الْخصم.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المناقضة في الاصطلاح فعلُ الاعتراض على مقدمة، لا العلاقة المنطقية بين المتناقضين"
        - text: "«المناقضة: لغة: إبطال أحد القولين بالآخر. واصطلاحاً: هي منع مقدمة معينة من مقدمات الدليل.»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى الاصطلاحي مختلف عن العلاقة المنطقية المقصودة في المجموعة"

    - lemma: "تَعَانُد"
      contradicts:
        - text: "«التعاند: بالنون عند الحكماء هو التقابل بين أمرين وجوديين بحيث لا يتوقّف تعقّل كلّ منهما على تعقّل الآخر ولا يكون بينهما غاية الخلاف والتباعد، وهذان الأمران يسمّيان بالمتعاندين كالحمرة والصفرة.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التعاند عند الحكماء نوع من التقابل بين أمرين وجوديين دون غاية الخلاف (كالحمرة والصفرة)، وهو أخصّ من التضاد وأبعد عن التناقض"
        - text: "«(تعاند) الخصمان تجادلا»"
          source: "المعجم الوسيط"
          conflict: "المعنى اللغوي هو التجادل والمعارضة، لا العلاقة المنطقية بين الأضداد"

stage3_analysis:
  per_lemma:
    - lemma: "تَنَاقُض"
      decision: confirmed
      decision_reason: "مصطلح راسخ في التراث المنطقي والأصولي العربي، مؤيَّد بأدلة وافرة من المعاجم الكلاسيكية والحديثة. يدلّ تحديداً على العلاقة بين المتناقضين حيث يستحيل اجتماعهما وارتفاعهما، وهو المعنى المقصود في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنَاقُض"

    - lemma: "تَنَافٍ"
      source: stage1
      decision: removed
      decision_reason: "التنافي أعمّ من التناقض، إذ يشمل التضاد والتناقض معاً (كما في تعريف الجرجاني). كما أنه يُستعمل حديثاً بمعنى incompatibility (عدم التوافق) في الرياضيات والعلوم، وهو مفهوم مغاير. لا يصلح مرادفاً دقيقاً لـ contradictoriness."
      evidence_assessment:
        case: mixed

    - lemma: "مُنَاقَضَة"
      source: stage1
      decision: removed
      decision_reason: "المناقضة في الاصطلاح المنطقي والأصولي تعني فعل الاعتراض على مقدمة من مقدمات الدليل (منع المقدمة)، وليست العلاقة المنطقية بين المتناقضين. فالمناقضة حدَث (event)، والتناقض علاقة (relation)."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَعَانُد"
      source: stage1
      decision: removed
      decision_reason: "التعاند عند الحكماء نوع خاصّ من التقابل بين أمرين وجوديين لا يبلغان غاية الخلاف (كالحمرة والصفرة)، وهو دون التضاد درجةً فضلاً عن التناقض. المعنى اللغوي (التجادل) مختلف أيضاً."
      evidence_assessment:
        case: contradicts_only

