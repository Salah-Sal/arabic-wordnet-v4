stage1_review:
  assessment:
    concerns:
      - "كلمة 'وُضُوح' تميل في الاستعمال المعاصر إلى الجوانب الإدراكية (وضوح الفكرة) أو البصرية العامة (وضوح الصورة)، بينما تتطلب المجموعة صفة فيزيائية مخصصة للماء."
    observations: "المجموعة تدور حول الخاصية الفيزيائية للماء التي تسمح بمرور الضوء والرؤية من خلاله (الشفافية والخلو من العكر). المصادر العربية الكلاسيكية غنية بمصطلحات دقيقة لهذا المعنى."
  blind_candidates:
    - lemma: "صَفَاء"
      generation_method: ishtiqaq
      justification: "المصدر القياسي من الجذر (صفو) الذي يعني الخلو من الكدر، وهو اللفظ الأكثر شيوعاً لوصف الماء."
    - lemma: "نَقَاء"
      generation_method: ishtiqaq
      justification: "من الجذر (نقي) ويعني النظافة والخلو من الشوائب، ويشترك مع الصفاء في وصف جودة الماء."
    - lemma: "رَوْق"
      generation_method: majaz
      justification: "لفظ كلاسيكي يعني الصافي من الماء، ومنه اشتُق 'الراووق' (المصفاة)."
    - lemma: "نُطْفَة"
      generation_method: majaz
      justification: "في أصلها اللغوي تعني الماء الصافي قل أو كثر، وإن غلب عليها في الاستعمال المعاصر المعنى البيولوجي."

stage2_evidence:
  per_lemma:
    - lemma: "صَفَاء"
      confirm:
        - text: "«الصَّفَاءُ: ضِدُّ الْكَدَرِ؛ يُقَالُ: صَفَا يَصْفُو، إِذَا خَلَصَ.»"
          source: "مقاييس اللغة"
        - text: "«الصفاء: الخلوص من الشوب.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "نَقَاء"
      confirm:
        - text: "«النُّونُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى نَظَافَةٍ وَخُلُوصٍ.»"
          source: "مقاييس اللغة"
        - text: "«نقاء: نظافة.»"
          source: "المعجم الطبي الموحد"
    - lemma: "وُضُوح"
      confirm:
        - text: "«الواو والضاد والحاء: أصل واحد يدل على ظهور الشيء وبروزه.»"
          source: "مقاييس اللغة"
        - text: "«clarity: وضوح»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
      expands:
        - text: "«clarity <of a material>: وضوح (لمادة)»"
          source: "موسوعة الكهرباء"
          addition: "يشير إلى خاصية المادة (مثل الماء أو الزجاج) التي تسمح بالرؤية من خلالها."
    - lemma: "رَوْق"
      confirm:
        - text: "«الرَوْقُ: الصافي من المَاء وغيرِه.»"
          source: "القاموس المحيط"
        - text: "«روق: الصافي من الماء.»"
          source: "المعجم الوسيط"
    - lemma: "رَوَاقَة"
      confirm:
        - text: "«رَوَاقَة: صفاء، نقاء.»"
          source: "تكملة المعاجم (دوزي)"

stage3_analysis:
  per_lemma:
    - lemma: "صَفَاء"
      decision: confirmed
      decision_reason: "المصطلح الأساسي والأكثر دقة لوصف خلو السوائل من العكارة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَفَاء"
    - lemma: "نَقَاء"
      decision: confirmed
      decision_reason: "مترادف قوي يركز على جانب النظافة والخلو من الأجسام الغريبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَقَاء"
    - lemma: "وُضُوح"
      decision: confirmed
      decision_reason: "مقبول كترجمة لـ clarity، ويُستخدم لوصف شفافية الأوساط المادية في السياقات العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وُضُوح"
    - lemma: "رَوْق"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تراثي دقيق مخصص لصفاء الماء، وإحياؤه يغني المعجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رَوْق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "رَوَاقَة"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة تدل على الحالة أو الكيفية (Quality) وتوافق سياق المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "رَوَاقَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "صفة الماء الصافي"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، ويفضل تقديم تعريف يوضح الجانب الفيزيائي (الشفافية) والجانب السلبي (عدم التعكر)."
    authored:
      - type: terminological
        text: "خاصية في السوائل، ولاسيما الماء، تتمثل في خلوها من العكارة والشوائب مما يجعلها شفافة تسمح بمرور الضوء والرؤية من خلالها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "صَفَاء"
        examples:
          - text: "يُدهش السياحَ صَفَاءُ مياه هذه البحيرة الجبلية."
            type: usage
      - lemma: "نَقَاء"
        examples:
          - text: "يعتمد المختبر معايير صارمة لضمان نَقَاء الماء المستخدم في التجارب."
            type: usage
      - lemma: "وُضُوح"
        examples:
          - text: "يساعد وُضُوحُ الماء الغواصين على رؤية الشعاب المرجانية بوضوح."
            type: usage
      - lemma: "رَوْق"
        examples:
          - text: "شربنا من رَوْق الماء المنحدر من قمم الجبال."
            type: usage
      - lemma: "رَوَاقَة"
        examples:
          - text: "تتميز مياه هذا النبع برَوَاقَةٍ لا نظير لها."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "{synset_id}", definition_index: 0, text: "خاصية في السوائل، ولاسيما الماء، تتمثل في خلوها من العكارة والشوائب مما يجعلها شفافة تسمح بمرور الضوء والرؤية من خلالها."}

