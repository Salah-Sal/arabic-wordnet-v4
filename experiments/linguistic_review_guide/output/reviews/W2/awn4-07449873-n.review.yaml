stage1_review:
  assessment:
    concerns:
      - "نقص التشكيل في اللمات الموجودة."
      - "غياب اللمات المعبرة عن الجانب الجيولوجي (ثوران) أو العاطفي الشديد (انفجار) المذكورة في الأصل الإنجليزي."
    observations: "المجموعة تغطي مفهوم الحدوث المفاجئ والعنيف، وهي تشمل سياقات الحروب والأوبئة والظواهر الطبيعية. اللمتان الموجودتان (اندلاع، تفشي) صحيحتان، لكنهما لا تستوعبان كامل النطاق الدلالي للمجموعة."
  blind_candidates:
    - lemma: "اِنْدِلَاع"
      generation_method: ishtiqaq
      justification: "مصدر للفعل اندلع، وهو التعبير المعياري لبدء الحروب والحرائق فجأة."
    - lemma: "ثَوَرَان"
      generation_method: ishtiqaq
      justification: "مصدر للفعل ثار، ويناسب الحدوث العنيف المفاجئ خاصة للبراكين أو الغضب (Eruption)."
    - lemma: "اِنْفِجَار"
      generation_method: ishtiqaq
      justification: "يعبر عن الحدوث العنيف والمفاجئ (Explosion/Outburst)، ويناسب السياقين المادي والمعنوي."
    - lemma: "بَائِقَة"
      generation_method: majaz
      justification: "كلمة تراثية تعني الداهية أو الشر الذي ينزل فجأة بالقوم."

stage2_evidence:
  per_lemma:
    - lemma: "اِنْدِلَاع"
      confirm:
        - text: "«نشوب؛ اندلاع [الحربِ]؛ تفجُّر؛ انفجار [الغَضَبِ]؛ تفشّي [المَرَضِ]»"
          source: "المورد الحديث"
    - lemma: "تَفَشِّي"
      confirm:
        - text: "«التفشي: اتسع وانتشر المرضُ القومَ، وبهم: انتشر فيهم وعمَّهم»"
          source: "المعجم الوسيط"
        - text: "«تفشّي [المَرَضِ]»"
          source: "المورد الحديث"
    - lemma: "نُشُوب"
      confirm:
        - text: "«نشوب الحرب بينهم نشوبًا: اشتبكت»"
          source: "مجمع بحار الأنوار"
        - text: "«نشوب؛ اندلاع [الحربِ]»"
          source: "المورد الحديث"
    - lemma: "ثَوَرَان"
      confirm:
        - text: "«ثوران [بركانٍ]؛ هَيَجان؛ انفجار»"
          source: "المورد الحديث"
        - text: "«ثَوَرَانٌ: eruption»"
          source: "ArabTerm"
    - lemma: "اِنْفِجَار"
      confirm:
        - text: "«انفجار [عاطفيّ]؛ جَيَشان... تفجُّر [نشاطٍ أو نماء]»"
          source: "المورد الحديث"
        - text: "«انفجار: تفاعل كيميائي سريع جدا... يُنْتِج عموما حجما كبيرا من الغازات»"
          source: "ArabTerm"
    - lemma: "بَائِقَة"
      confirm:
        - text: "«البائقة: النازلة وهي الداهية الشديدة والشر الشديد»"
          source: "التوقيف على مهمات التعاريف"

stage3_analysis:
  per_lemma:
    - lemma: "اندلاع"
      decision: confirmed
      decision_reason: "مصطلح أساسي للتعبير عن بدء الحروب والحرائق فجأة وبقوة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْدِلَاع"
    - lemma: "تفشي"
      decision: confirmed
      decision_reason: "شائع الاستخدام للتعبير عن الانتشار المفاجئ والواسع للأمراض والأوبئة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَفَشِّي"
    - lemma: "نُشُوب"
      source: stage1
      decision: confirmed
      decision_reason: "ملازم للحروب والنزاعات، ويؤكد معنى الحدوث المفاجئ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نُشُوب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "ثَوَرَان"
      source: stage1
      decision: confirmed
      decision_reason: "ترجمة دقيقة لـ (Eruption) ويغطي الجانب الطبيعي والعاطفي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ثَوَرَان", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "اِنْفِجَار"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن العنف والمفاجأة في الحدوث، سواء كان مادياً أو معنوياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "اِنْفِجَار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حدوث تلقائي عنيف ومفاجئ (عادة لحالة غير مرغوب فيها)"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يحتاج صياغة أكثر فصاحة وشمولاً للسياقات المختلفة."
    authored:
      - type: terminological
        text: "حُدُوثٌ مُفَاجِئٌ وَعَنِيفٌ لِأَمْرٍ غَيْرِ مَرْغُوبٍ فِيهِ، كَنُشُوبِ حَرْبٍ أَوْ تَفَشِّي مَرَضٍ أَوْ ثَوَرَانِ غَضَبٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "حُدُوثٌ مُفَاجِئٌ وَعَنِيفٌ لِأَمْرٍ غَيْرِ مَرْغُوبٍ فِيهِ، كَنُشُوبِ حَرْبٍ أَوْ تَفَشِّي مَرَضٍ أَوْ ثَوَرَانِ غَضَبٍ."}

  examples:
    per_lemma:
      - lemma: "اِنْدِلَاع"
        examples:
          - text: "أدَّى اندلاعُ الحربِ الأهليةِ إلى موجاتِ نزوحٍ واسعةٍ."
            type: usage
      - lemma: "تَفَشِّي"
        examples:
          - text: "تخشى المنظماتُ الدوليةُ من تفشِّي الأوبئةِ في مخيماتِ اللاجئين."
            type: usage
      - lemma: "نُشُوب"
        examples:
          - text: "بذلتِ الأممُ المتحدةُ جهوداً مضنيةً لمنعِ نشوبِ نزاعٍ مسلحٍ جديد."
            type: usage
      - lemma: "ثَوَرَان"
        examples:
          - text: "تسبب ثورانُ البركانِ في تدميرِ القرى المجاورةِ وتغطيتِها بالرماد."
            type: usage
      - lemma: "اِنْفِجَار"
        examples:
          - text: "أعقبَ الحادثَ انفجارٌ شعبيٌّ غاضبٌ للمطالبةِ بالعدالةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "أدَّى اندلاعُ الحربِ المفاجئُ إلى شللٍ تامٍّ في مرافقِ المدينة."}

stage5_enrichment:
  per_entry:
    - lemma: "اِنْدِلَاع"
      entry_id: "{auto}"
      root: "دلع"
      maqayis_quote: "«الدَّالُ وَاللَّامُ وَالْعَيْنُ أُصَيْلٌ يَدُلُّ عَلَى خُرُوجٍ. تَقُولُ: دَلَعَ لِسَانُهُ: خَرَجَ... وَيُقَالُ انْدَلَعَ بَطْنُهُ، إِذَا أَخْرَجَ أَمَامَهُ.»"
    - lemma: "تَفَشِّي"
      entry_id: "{auto}"
      root: "فشو"
      maqayis_quote: "«الفاء والشين والواو أصلٌ صحيح يدلُّ على الانتشار... فشا الشيءُ يفشو فُشُوّاً.»"
    - lemma: "نُشُوب"
      entry_id: "{auto}"
      root: "نشب"
      maqayis_quote: "«النون والشين والباء أصلٌ صحيح واحد، يدلُّ على تعلُّق شيء بشيء... نشبت الحرب بينهم: اشتبكت.»"
    - lemma: "ثَوَرَان"
      entry_id: "{auto}"
      root: "ثور"
      maqayis_quote: "«الثَّاءُ وَالْوَاوُ وَالرَّاءُ... انْبِعَاثُ الشَّيْءِ... ثَارَ الشَّيْءُ يَثُورُ ثَوْرًا وَثُؤُورًا وَثَوَرَانًا.»"
    - lemma: "اِنْفِجَار"
      entry_id: "{auto}"
      root: "فجر"
      maqayis_quote: "«الْفَاءُ وَالْجِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّفَتُّحُ فِي الشَّيْءِ... انْفَجَرَ الْمَاءُ انْفِجَارًا: تَفَتَّحَ.»"

  per_sense:
    - lemma: "اِنْدِلَاع"
      sense_id: "{auto}"
      nuance: "يرتبط غالباً بالنار أو الحروب أو العنف."
      mwe: false
    - lemma: "تَفَشِّي"
      sense_id: "{auto}"
      nuance: "يستخدم حصراً للأمراض أو الشائعات أو الأشياء التي تنتشر أفقياً."
      mwe: false
    - lemma: "نُشُوب"
      sense_id: "{auto}"
      nuance: "يركز على بداية الاشتباك أو التعلق بشيء لا مخلص منه، خاصة في النزاعات."
      mwe: false
    - lemma: "ثَوَرَان"
      sense_id: "{auto}"
      nuance: "يوحي بالهيجان والانبعاث من الداخل، مثل البراكين أو الغضب الكامن."
      mwe: false
    - lemma: "اِنْفِجَار"
      sense_id: "{auto}"
      nuance: "يوحي بشدة الضغط الداخلي الذي يؤدي إلى تفتح عنيف ومفاجئ."
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دلع","maqayis":"«الدَّالُ وَاللَّامُ وَالْعَيْنُ أُصَيْلٌ يَدُلُّ عَلَى خُرُوجٍ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فشو","maqayis":"«الفاء والشين والواو أصلٌ صحيح يدلُّ على الانتشار...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نشب","maqayis":"«النون والشين والباء أصلٌ صحيح واحد، يدلُّ على تعلُّق شيء بشيء...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ثور","maqayis":"«الثَّاءُ وَالْوَاوُ وَالرَّاءُ... انْبِعَاثُ الشَّيْءِ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فجر","maqayis":"«الْفَاءُ وَالْجِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّفَتُّحُ فِي الشَّيْءِ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يرتبط غالباً بالنار أو الحروب أو العنف.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
