      nuance_differentiation: "يميل 'مخطط' إلى تمثيل الهياكل والعمليات والمراحل (مخطط انسيابي، مخطط تنظيمي، مخطط زمني)؛ يُقابل بالخصوص diagram وschema وflowchart، وهو أشمل وأقل تخصصاً إحصائياً من 'رسم بياني'"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
