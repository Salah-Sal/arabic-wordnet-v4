          root: "رسم"
          maqayis_quote: "«الرَّاءُ وَالسِّينُ وَالْمِيمُ أَصْلَانِ: أَحَدُهُمَا الْأَثَرُ، وَالْآخَرُ ضَرْبٌ مِنَ السَّيْرِ. فَالأَوَّلُ الرَّسْمُ: أَثَرُ الشَّيْءِ»"
