      decision_reason: "الدليل المعجمي الوحيد الموجود يُترجمها بـ 'inadaptability board' (لوحة تقييم قصور التكيّف التربوي)، وهو معنى مغاير كلياً لـ 'عرض مرئي للمعلومات'. فضلاً عن ذلك، فشلت في اختبار السكّ: يمكن إبدال 'إيضاحية' بـ'توضيحية' أو 'تفسيرية' دون أن تفقد صلاحيتها الوصفية، مما يُثبت أنها عبارة وصفية حرة لا مصطلح مسكوك."

