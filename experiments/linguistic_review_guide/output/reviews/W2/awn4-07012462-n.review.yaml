          root: "بين"
          maqayis_quote: "«الْبَاءُ وَالْيَاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ، وَهُوَ بُعْدُ الشَّيْءِ وَانْكِشَافُهُ... وَبَانَ الشَّيْءُ وَأَبَانَ إِذَا اتَّضَحَ وَانْكَشَفَ»"

