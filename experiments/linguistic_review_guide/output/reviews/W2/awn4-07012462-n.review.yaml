      decision_reason: "اللمّة مُسجَّلة في ثلاثة معاجم تقنية عربية معتمَدة (ARABTERM) بمعنى diagram وgraph، مع تعريف واضح في معجم تقانة المعلومات: 'الرسم الذي يمكن من تمثيل الأرقام والجداول في شكل رسوم'. الاشتقاق قياسي على وزن مِفْعَال (أداة البيان). تجتاز اختبارات التثبيت المعجمي واليُسر والاشتقاقية. لا تدور في التعريف (غير مشتقة من عرض/مرئي/معلومات)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
