      nuance_differentiation: "يتميّز 'مبيان' باستخدامه في السياق الرياضي والمعلوماتي تحديداً (نظرية الرسوم، شبكات البيانات) حيث يُقابل graph بالمعنى الرياضي الدقيق (عقد وحوافّ)؛ كما يُستخدم مقابل diagram في التمثيل البياني العلمي العام"
