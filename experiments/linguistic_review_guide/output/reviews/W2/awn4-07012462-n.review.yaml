      decision_reason: "لا دليل على تثبيتها كمصطلح في أي معجم عربي معتمَد. تفشل اختبار السكّ: 'مرئي' قابل للإبدال بـ'بصري' أو 'مُشاهَد'، كما أن 'بيان' مجردةً تعني الإعلان والكشف لا التمثيل البياني تحديداً. لم يُوجد لها أي دليل في قاعدة البيانات المعجمية."


