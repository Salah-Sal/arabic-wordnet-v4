# المراجع: chart / graph — عرض مرئي للمعلومات
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (التوليد الأعمى أولاً) ──────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان 'رسم بياني' و'مخطط' مكتوبتان بدون تشكيل كامل"
      - "اللمّة 'مخطط' مشتركة لفظياً بين ثلاثة أوزان: مُخَطَّط (اسم مفعول = diagram)، مُخَطِّط (اسم فاعل = planner)، وصفة المخطَّط بخطوط (striped)؛ مما يُوجب ضبط التشكيل"
      - "التعريف 'عرض مرئي للمعلومات' مُجمَل لا يُفرِّق بين الرسم الإحصائي (chart/graph بالمعنى الإحصائي) ورسم العلاقات الرياضية (graph بالمعنى الشبكي)؛ والتعريف الإنجليزي 'a visual display of information' أيضاً واسع"
      - "غياب لمّة 'مِبْيَان' المثبَّتة في المعاجم التقنية العربية الحديثة (ARABTERM)"
    observations: "المجموعة تُغطّي مفهوماً بصرياً تواصلياً يجمع بين الرسم الإحصائي (chart) وشبكة العلاقات الرياضية (graph). اللمّتان الموجودتان 'رسم بياني' و'مخطط' راسختان في الاستخدام التقني العربي لكنهما يحملان فروقاً دلالية دقيقة تستوجب التوثيق؛ إذ يميل 'رسم بياني' إلى التمثيل الكمي الإحصائي، في حين يميل 'مخطط' إلى تمثيل الهياكل والمراحل والخطوات. اللمّة المرشَّحة 'مبيان' تُثري المجموعة في السياق الرياضي والمعلوماتي."

  blind_candidates:
    - lemma: "مِبْيَان"
      generation_method: ishtiqaq
      justification: "مشتق من جذر بين (البيان والإيضاح والانكشاف) على وزن مِفْعَال الدالّ على الآلة أو ما يُؤدَّى به الفعل؛ المعنى: أداة الإيضاح المرئي للبيانات والمعلومات. الوزن قياسي في العربية (مِقياس، مِعيار) ومُسجَّل في المعجمية التقنية الحديثة."
    - lemma: "مُخَطَّط"
      generation_method: ishtiqaq
      justification: "اسم مفعول من الثلاثي المضعَّف خطَّ/خطَّط على وزن مُفَعَّل؛ الجذر خطط أصله 'أثر يمتد امتداداً'، فالمُخَطَّط هو ما رُسمت فيه خطوط لتمثيل بيانات أو علاقات. شائع جداً في التوحيد المصطلحي العربي مقابل diagram."
    - lemma: "لَوْحَة إِيضَاحِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي: لَوْحَة (جنس قريب = سطح عرض مرئي) + إِيضَاحِيَّة (فصل نوعي = تنسب إلى الإيضاح والبيان)؛ يُعبِّر عن العرض المرئي الذي يوضّح المعلومات لمن يطالعه."
    - lemma: "بَيَان مَرْئِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي: بَيَان (كشف وإيضاح للمعلومات) + مَرْئِيّ (نسبة إلى ما يُدرَك بالبصر)؛ يُعادل دلالياً 'visual display' بتركيب عربي مباشر. البيان في أصله العربي 'انكشاف الشيء'."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "رسم بياني"
      confirm:
        - text: "«تمثيل مرسوم للمعطيات»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ARABTERM"
        - text: "«مجموعة من عناصر البيانات تربط بينها علاقات وتمثل هذه المجموعة بيانياً بنقط تصل بينها خطوط ويمكن تمييز كل نقطة باسم خاص كما يمكن وضع رأس سهم على الخط لتحديد اتجاه العلاقة بين كل نقطتين» [translation_en: graph]"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
        - text: "[translation_en: diagram; graph] — رسم بيانيّ"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM"
        - text: "[translation_en: chart] — رسم بياني"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM"
        - text: "[translation_en: diagram (chart)] — رسم بياني"
          source: "مسرد الفن، التسلية والرياضة — ARABTERM"
        - text: "«(1) رسم بيانيّ (2) خطّ بيانيّ (3) البيان» [translation_en: graph]"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: "[translation_en: graph] — رسم بياني، رسم تخطيطي"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)؛ مسرد الجغرافيا والتاريخ — ARABTERM (متعدد)"
      expands:
        - text: "«الورق البيانيّ: ورق ذو مُربَّعات للرسوم البيانية»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يكشف أن 'رسم بياني' مصطلح معيشيّ راسخ له مشتقات واسعة الانتشار في اللغة التقنية"
        - text: "«رَسَمَ: الرَّاءُ وَالسِّينُ وَالْمِيمُ أَصْلَانِ: أَحَدُهُمَا الْأَثَرُ، وَالْآخَرُ ضَرْبٌ مِنَ السَّيْرِ. فَالأَوَّلُ الرَّسْمُ: أَثَرُ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُعمِّق الأساس الدلالي للمصطلح: الرسم هو الأثر الباقي، وهو ما يتركه التمثيل البياني من صورة في الذهن"

    - lemma: "مخطط"
      confirm:
        - text: "[translation_en: diagram] — مخطط"
          source: "المعجم الموحد لمصطلحات المياه (2000)؛ المعجم الموحد لمصطلحات الهندسة المدنية (2012)؛ المعجم الموحد لمصطلحات الرياضيات والفلك (1990)؛ المعجم الطبي الموحد (2009) — ARABTERM (متعدد)"
        - text: "[translation_en: chart] — مُخَطَّط"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "[translation_en: graph (diagram)] — مُخَطَّط"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "«مخطَّط السِّياق: رسم بيانيّ يُظهر سِياق العمليات في برنامج الكومبيوتر»"
          source: "المورد الحديث (2008) — ARABTERM"
      contradicts:
        - text: "«كُلُّ ما فيه خُطوطٌ من الناس: الجميلُ، التَّامُّ الحُسْنِ. يقالُ: وجهٌ مُخَطَّطٌ، و: رجلٌ مُخَطَّطٌ» [pos: adj]"
          source: "المعجم الكبير (OCR) — مجمع اللغة العربية"
          conflict: "يدلّ على الصفة (مخطَّط بخطوط = جميل) لا على الاسم (رسم بياني)؛ يُشير إلى الاشتراك اللفظي بين الصفة والاسم"
        - text: "«رسم تمهيدي لصورة أو لوجه أو نحوهما» [translation_en: cartoon]"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
          conflict: "يُقيِّد المعنى برسم تمهيدي (sketch/cartoon) لا بالعرض البياني الكامل للمعلومات"
        - text: "«نموذج تمهيدي صغير لعمل من أعمال النحت أو الرسم» [translation_en: layout]"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
          conflict: "يدلّ على نموذج أوّلي (layout) لا على عرض مرئي للمعلومات"
        - text: "[translation_en: planner] — المُخَطَّط"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          conflict: "تعدُّد الترجمات (planner, striped, anlage, striated, striatum) في المعجم الطبي ذاته يكشف عن تداخل حادّ بين الأوزان المختلفة"
      expands:
        - text: "«مخطط لا دوريّ: مخطط لا يحتوى على مسار مغلق (دورة)» [translation_en: acyclic graph]"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
          addition: "يُثبت استخدام 'مخطط' في نظرية الرسوم (graph theory) مرادفاً للـ graph الرياضي، وهو استخدام متداخل مع مبيان"
        - text: "«مخطَّط موجَّه: مخطط تمثل فيه العلاقات بين كل عنصرين من عناصره باستخدام وصلات ذات اتجاهات معينة» [translation_en: directed graph]"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
          addition: "توسيع دلالي مهم: المخطط الموجَّه = directed graph، مما يُدل على تنافس مخطط/مبيان في هذا الحقل"
        - text: "«الْخَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ; وَهُوَ أَثَرٌ يَمْتَدُّ امْتِدَادًا. فَمِنْ ذَلِكَ الْخَطُّ الَّذِي يَخُطُّهُ الْكَاتِبُ»"
          source: "مقاييس اللغة لابن فارس (مدخل خَطَّ)"
          addition: "يُرسِّخ الأساس الدلالي: الخط أثر ممتد، والمُخطَّط ما رُسم بخطوط ممتدة لإيصال معلومة"

    - lemma: "مِبْيَان"
      confirm:
        - text: "«الرسم الذي يمكن من تمثيل الأرقام والجداول في شكل رسوم. المبيانات يمكنها أن تكون ممثلة ببعدين أو ثلاثة» [translation_en: diagram]"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ARABTERM"
        - text: "«في البرمجة: بنيةُ معطيات لها عددٌ من العُقد (يمكن أن يكون معدوماً) وعددٌ من الحافَات (يمكن أن يكون معدوماً) تَربطُ أزواجاً من العُقد» [translation_en: graph]"
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
        - text: "[translation_en: diagram] — مِبْيان"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "[translation_en: climate graph] — مبيان المناخ"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — ARABTERM"
        - text: "[translation_en: chart (diagramme)] — رسم بياني، مِبْيان"
          source: "مسرد الفن، التسلية والرياضة — ARABTERM"
      expands:
        - text: "«بَيْنَ: الْبَاءُ وَالْيَاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ، وَهُوَ بُعْدُ الشَّيْءِ وَانْكِشَافُهُ... وَبَانَ الشَّيْءُ وَأَبَانَ إِذَا اتَّضَحَ وَانْكَشَفَ»"
          source: "مقاييس اللغة لابن فارس (مدخل بَيْنَ)"
          addition: "يُعمِّق الأساس الاشتقاقي: مِبْيَان من الإبانة والاتضاح؛ أداة الكشف والإيضاح المرئي للبيانات"

    - lemma: "لَوْحَة إِيضَاحِيَّة"
      contradicts:
        - text: "[translation_en: inadaptability board] — لوحة ايضاحية"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
          conflict: "الترجمة الإنجليزية 'inadaptability board' تُشير إلى لوحة تربوية متخصصة في تقييم قصور التكيّف، وهي بعيدة كل البُعد عن مفهوم 'عرض مرئي للمعلومات'"

    - lemma: "بَيَان مَرْئِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
