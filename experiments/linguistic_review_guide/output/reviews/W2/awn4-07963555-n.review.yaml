# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07963555-n
# episcopacy / episcopate — الهيئة الجماعية للأساقفة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «هيئة الأساقفة» تعبير إضافي وصفي أقرب إلى الشرح منه إلى المصطلح المسكوك"
      - "غياب المصطلح المفرد «أُسْقُفِيَّة» الذي يُستخدم في المعاجم الحديثة للدلالة على المنصب والهيئة معاً"
      - "التعريف العربي الحالي يكاد يكون ترجمة حرفية للتعريف الإنجليزي"
    observations: "المفهوم ينتمي إلى المصطلحية الكنسية المسيحية المنقولة إلى العربية عبر الاقتراض اليوناني (ἐπίσκοπος → أُسْقُف). الحقل الدلالي ثري في العربية الحديثة بفضل تراث الكنائس الشرقية. التعبير «هيئة الأساقفة» مركب إضافي ثابت ومستعمل في الخطاب الكنسي والإعلامي العربي."
  blind_candidates:
    - lemma: "أُسْقُفِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «أُسْقُف» على وزن فُعْلُفِيَّة، يدلّ على المنصب والهيئة والرتبة الجماعية، وهو مثبت في المعاجم الحديثة"
    - lemma: "مَجْمَعُ الأَسَاقِفَة"
      generation_method: tarkib
      justification: "مركب إضافي من «مجمع» (موضع الاجتماع) و«الأساقفة»، يُستعمل للدلالة على الهيئة التشاورية الأسقفية"
    - lemma: "حُكُومَةُ الأَسَاقِفَة"
      generation_method: tarkib
      justification: "مركب إضافي يدلّ على نظام الحكم الكنسي بالأساقفة، مذكور في المورد الحديث ترجمةً لـ episcopacy"
    - lemma: "سِلْكُ الأَسَاقِفَة"
      generation_method: tarkib
      justification: "مركب إضافي على غرار «السلك الدبلوماسي»، يدلّ على مجموع الأساقفة بوصفهم هيئة مهنية"

stage2_evidence:
  per_lemma:
    - lemma: "هَيْئَةُ الأَسَاقِفَة"
      confirm:
        - text: "«(1) الأسقفيّة: منصب الأسقف أو مدة ولايته أو المنطقة الخاضعة لسُلطته (2) هيئة الأساقفة [في بلدٍ ما].»"
          source: "المورد الحديث (2008) — مدخل episcopate"
      expands:
        - text: "«(1) حكومة الأساقفة (2) episcopate.»"
          source: "المورد الحديث (2008) — مدخل episcopacy"
          addition: "يبيّن أن episcopacy تُترجم أيضاً بـ«حكومة الأساقفة» مع إحالة إلى episcopate"

    - lemma: "أُسْقُفِيَّة"
      confirm:
        - text: "«أُسْقُفيَّة: 1- درجة، منصب الأُسْقُف «نال الأُسْقُفِيّة». 2- موضع ممارسة الأسقف سلطته، دار الأسقف، مقرّ الأُسْقُف أو منطقة عمله «دخل الأُسْقُفيَّة».»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«(الأسقفية) درجة الأسقف ورعيته وموضع ممارسته سلطته (محدثة)»"
          source: "المعجم الوسيط (هوراماني)"
        - text: "«درجة الأُسْقُف رعيَّته موضع ممارسته سلطته (محدثة)»"
          source: "المعجم الوسيط (OCR)"
      contradicts:
        - text: "«الأُسقُفيّة: منصب الأُسقُف أو مقرُّهُ.»"
          source: "المورد الحديث (2008) — مدخل bishopric"
          conflict: "المعنى هنا المنصب أو المقرّ، لا الهيئة الجماعية"
      expands:
        - text: "«(1) الأسقفيّة: منصب الأسقف أو مدة ولايته أو المنطقة الخاضعة لسُلطته (2) هيئة الأساقفة [في بلدٍ ما].»"
          source: "المورد الحديث (2008) — مدخل episcopate"
          addition: "المورد الحديث يفصل بين معنيَيْن: الأسقفية للمنصب/الولاية، وهيئة الأساقفة للجسم الجماعي"

    - lemma: "مَجْمَعُ الأَسَاقِفَة"
      evidence_status: "no_material_found"

    - lemma: "حُكُومَةُ الأَسَاقِفَة"
      confirm:
        - text: "«(1) حكومة الأساقفة (2) episcopate.»"
          source: "المورد الحديث (2008) — مدخل episcopacy"
      contradicts:
        - text: "«(1) حكومة الأساقفة (2) episcopate.»"
          source: "المورد الحديث (2008) — مدخل episcopacy"
          conflict: "«حكومة» تدلّ على نظام الحكم لا على الجسم الجماعي ذاته؛ المصطلح أنسب لمعنى «نظام الحكم الأسقفي» لا «مجموع الأساقفة»"

    - lemma: "سِلْكُ الأَسَاقِفَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "هَيْئَةُ الأَسَاقِفَة"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت مسجّل في المورد الحديث ترجمةً لـ episcopate بمعنى الجسم الجماعي للأساقفة، وهو مستعمل في الخطاب الكنسي والإعلامي العربي المعاصر"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَيْئَةُ الأَسَاقِفَة"

    - lemma: "أُسْقُفِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المعاجم العربية تُعرّف «الأُسْقُفِيَّة» بأنها درجة الأسقف أو منصبه أو موضع ممارسته سلطته، لا الهيئة الجماعية للأساقفة. المورد الحديث نفسه يفصل بين «الأسقفية» (المنصب) و«هيئة الأساقفة» (الجسم الجماعي). إدراجها هنا يخلط بين المنصب والهيئة"
      evidence_assessment:
        case: mixed

    - lemma: "مَجْمَعُ الأَسَاقِفَة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على هذا المركب بهذا المعنى. «المجمع» يدلّ على اجتماع تشاوري (synod) لا على الهيئة الجماعية الدائمة"
      evidence_assessment:
        case: no_material

    - lemma: "حُكُومَةُ الأَسَاقِفَة"
      source: stage1
      decision: removed
      decision_reason: "وإن ورد في المورد الحديث ترجمةً لـ episcopacy، فإن «حكومة» تدلّ على نظام الحكم لا على الجسم الجماعي ذاته. المعنى أقرب إلى «نظام الحكم الأسقفي» وهو مفهوم مغاير"
      evidence_assessment:
        case: mixed

    - lemma: "سِلْكُ الأَسَاقِفَة"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على هذا المركب. استعمال «السلك» بمعنى الجماعة المهنية حديث وغير مثبت في سياق كنسي"
      evidence_assessment:
        case: no_material

