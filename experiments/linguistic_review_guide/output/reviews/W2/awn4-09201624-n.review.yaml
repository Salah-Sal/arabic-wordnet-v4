# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «حياة» تحمل أولاً معنى الوجود البيولوجي (ضد الموت)، وإحالتها إلى معنى «الباعث على العيش» مجازٌ غير مُقعَّد في قيد معجمي مستقل"
      - "التعريف يستخدم «دافع» وهو نفس مفهوم المجموعة الأمّ (دافع/حافز)، مما يُفضي إلى شبه دوران"
      - "عقد التعريف بـ«أو» بين «دافع» و«محور الوجود» يعكس تردداً لا يليق بالصياغة المعجمية الدقيقة"
      - "اللمّة مكتوبة بلا تشكيل"
    observations: >-
      المجموعة تمثّل الاستخدام المجازي لكلمة «حياة» للدلالة على الشيء الذي يجعل
      المرء يريد الاستمرار في العيش، كما في «أنتِ حياتي» و«وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ».
      هذا المجاز المرسل وارد في التراث العربي وفي الاستعمال المعاصر، غير أن المعاجم
      لم تُفرد له قيداً مستقلاً في مادة «حياة». المجموعة الأمّ تجمع دوافع نفسية عامة،
      والمجموعة الحالية تمثّل نوعاً خاصاً منها: الشيء الذي يُعاش لأجله لا القوة
      التي تحمل على الفعل. المقاربة الإنجليزية في WordNet تعتمد الاستعارة نفسها:
      "life" بمعنى "a motive for living".
  blind_candidates:
    - lemma: "عِلَّةُ الوُجُود"
      generation_method: tarkib
      justification: >-
        مركب إضافي فلسفي يقابل raison d'être؛ العِلَّة هي السبب الغائي المولِّد،
        والوجود هو الكون والحياة. يعبّر عن المفهوم من منظور الغائية الوجودية:
        الشيء الذي من أجله كان وجودك.
    - lemma: "مَنَاط"
      generation_method: majaz
      justification: >-
        من نوط (التعليق)؛ مناط الشيء = ما يتعلق به ويقوم عليه. المجاز: «ما تتعلق
        به الحياة وتقوم عليه»، أي الشيء الذي لولاه لم تكن للحياة قيمة؛ مستأنَسٌ
        باستعمال «مناط الحكم = علّته».
    - lemma: "بَاعِث"
      generation_method: ishtiqaq
      justification: >-
        من بعث على وزن فاعل، يعني المحرِّك والمثير للفعل. استُعمل في علم النفس
        العربي الحديث مقابل Motif/Motive؛ يُناسب معنى «الذي يبعث المرء على
        الاستمرار في الحياة».
    - lemma: "شَغَف"
      generation_method: majaz
      justification: >-
        من شَغَاف القلب (غلافه)؛ مجازه: ما أصاب أعمق الوجدان وأمسك به كما يُمسك
        الغلافُ بالقلب. {قَدْ شَغَفَهَا حُبًّا}. يعبّر عن الشيء الذي يملأ القلب
        ويمنحه معنى البقاء.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات مُنفَّذة:
#   ١. مطابقة دفعية: حياة/الحياة + مناط/المناط + باعث/الباعث + شغف/الشغف + علة
#   ٢. إثراء بالأمثلة (entry_ids من الاستعلام ١)
#   ٣. جسر إنجليزي: "motive for living" OR "life" OR "raison" OR "will to live"
#   ٤. مقاييس اللغة (dictionary_id=151): حيي، نوط، بعث، شغف
#   ٥. بحث FTS بالكلمات المفتاحية: دافع، باعث، محرك، سبب الوجود
stage2_evidence:
  per_lemma:

    - lemma: "حَيَاة"
      confirm:
        - text: >-
            «ضِدُّ المَوْتِ — النُّمُوُّ والبقاءُ — القُوَّةُ العاملةُ العاقِلَةُ»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >-
            «(9) مبدأ أو قوة مُحْييَة»
          source: "المورد الحديث (2008) — ضمن ترجمات life"
        - text: >-
            «وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ يَاأُولِي الْأَلْبَابِ لَعَلَّكُمْ تَتَّقُونَ»
          source: "القرآن الكريم — البقرة ١٧٩ (مثال في المعجم الكبير)"
      expands:
        - text: >-
            «(11) روح: Adib was the life of the enterprise —
            (8) كائن حيّ؛ وبخاصة: شخص — (10) حيويّة»
          source: "المورد الحديث (2008)"
          addition: >-
            يُثبت المورد الحديث أن «life» وترجمتها «حياة» تحملان معنى الحيوية
            والروح التي يقوم بها الشيء، وهو قريب من المعنى المقصود في المجموعة:
            الشيء الذي يمنح الحياة معناها.
        - text: >-
            «وَللارتفاع الهم والغم ومنه قوله: ليس من مات فاستراح بميت — إنما
            الميت ميت الأحياء — وللحياة الأخروية والأبدية وذلك يتوصل إليه
            بالحياة التي هي العقل والعلم»
          source: "التوقيف على مهمات التعاريف للمناوي (ت.١٦٢٢)"
          addition: >-
            يُثبت المناوي نقلاً عن الراغب الأصفهاني أن «حياة» تُستعمل بمعنى
            مجازي لارتفاع الهمّ والغم ولما يمنح الحياة قيمة — وهو المعنى
            الأقرب لهذه المجموعة.

    - lemma: "بَاعِث"
      confirm:
        - text: >-
            «فى علم النفس (Motif): عاملٌ نَفْسِيّ، وهو فِكرة تَنْزِع إلى إحداث
            عَمَل إراديّ، فى حين أن الدافع قد يكون خارجِيّا»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >-
            «باعث» — translation_en: "motive" — domain: Law
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: >-
            «باعِث» — translation_en: "mobile" — domain: Philosophy and Psychology
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
        - text: >-
            «(1) الباعث؛ الحافز؛ الدافع» — ترجمة: motive
          source: "المورد الحديث (2008)"

    - lemma: "مَنَاط"
      contradicts:
        - text: >-
            «مَنَاطُ الحكم (عند الأصوليين والأخلاقيين): عِلَّتُه. يقال: مناط
            الحكم بتحريم الخمر هو الإسكار»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >-
            استعمال «مناط» في المعاجم حصري في الاصطلاح الفقهي-الأصولي (علّة
            الحكم الشرعي)، ولا توجد شواهد على توظيفه في سياق الباعث النفسي
            على العيش. الإزاحة الدلالية المقترحة لا أساس لها في الاستعمال المسكوك.
        - text: >-
            «هو مني مَنَاطَ الثُّرَيَّا: شديد البُعْد — وفلانٌ مَنَاط الثُّرَيَّا:
            شريف عالى المنزلة»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >-
            الاستعمالات المجازية الحيّة لـ«مناط» ترتبط بالعلوّ والبُعد وإسناد
            الشرف، لا بمعنى الدافع أو الباعث على الحياة.

    - lemma: "شَغَف"
      expands:
        - text: >-
            «الشِّينُ وَالْغَيْنُ وَالْفَاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الشَّغَافُ، وَهُوَ غِلَافُ
            الْقَلْبِ. قَالَ اللَّهُ تَعَالَى: {قَدْ شَغَفَهَا حُبًّا} أَيْ أَوْصَلَ الْحُبَّ إِلَى
            شَغَافِ قَلْبِهَا»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            يثبت الأصل الحسّي للكلمة (غلاف القلب) وانتقالها المجازي إلى الحبّ
            الذي يبلغ الأعماق. هذا الانتقال خاص بالمحبة الحبيّة لا بالدافع
            على الحياة بوجه عام.
        - text: >-
            «الشّغف عند السالكين هو من مراتب المحبّة … الشّغف خمس درجات:
            الأول امتثال أمر المحبوب طوعا ورغبة»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت.١٧٧٧)"
          addition: >-
            في الاصطلاح الصوفي «شغف» مرتبة من مراتب المحبة — خاص بعلاقة
            العاشق بالمعشوق، وليس دافعاً عاماً للعيش.

    - lemma: "عِلَّةُ الوُجُود"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حَيَاة"
      decision: confirmed
      decision_reason: >-
        «حَيَاة» في الاستعمال المجازي العربي راسخة للدلالة على الشيء الذي يعيش
        المرء لأجله — كما في «أنتِ حياتي» وكما في الآية «وَلَكُمْ فِي الْقِصَاصِ
        حَيَاةٌ». المجاز موثّق في المعاجم الكلاسيكية (المناوي والراغب) وفي
        المعاجم الحديثة (المورد: "مبدأ أو قوة مُحْييَة")، وهو يقابل الاستعمال
        الإنجليزي "life" في WordNet للدلالة على نفس المفهوم. اللمّة تحتاج تشكيلاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        «حَيَاة» في هذه المجموعة تُستعمل مجازاً للدلالة على الشيء المُعاش لأجله —
        الموضوع الذي تنصبّ عليه الإرادة — لا على القوة الدافعة التي تحمل على
        الفعل (وتلك هي المجموعة الأمّ: دافع/حافز). الفارق: «الدافع» جهة النفس
        التي تدفع، و«الحياة» بهذا المعنى هي الشيء الذي تتجه إليه تلك القوة
        فيجعل الوجود ذا معنى.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَيَاة"

    - lemma: "بَاعِث"
      source: stage1
      decision: removed
      decision_reason: >-
        «بَاعِث» مرادف لـ«دَافِع» و«حَافِز» — وهي ألفاظ المجموعة الأمّ ذاتها —
        فإدراجه في المجموعة الحالية يُضيّع الحدود الدلالية بين المجموعتين.
        علاوة على ذلك فإن «باعثاً» مع الإطلاق لا يُقيِّد المعنى بـ«العيش»،
        وهو يعادل الجنس القريب لا النوع الفصل.

    - lemma: "مَنَاط"
      source: stage1
      decision: removed
      decision_reason: >-
        «مَنَاط» مصطلح أصولي-قانوني: استعماله الحيّ محصور في «مناط الحكم = علّته
        الشرعية». الأدلة المعجمية تناقض توظيفه في سياق الباعث النفسي على العيش.
        الإزاحة الدلالية المقترحة لا تنبع من استعمال مسكوك.

    - lemma: "شَغَف"
      source: stage1
      decision: removed
      decision_reason: >-
        «شَغَف» يدلّ على الولوع الحبّي العميق (ما بلغ شَغَاف القلب من الحبّ)،
        وهو معنى أضيق وأخصّ من «الدافع للعيش»: يُقيِّد المعنى بعلاقة العاشق
        بالمعشوق، في حين أن المجموعة أشمل.

    - lemma: "عِلَّةُ الوُجُود"
      source: stage1
      decision: removed
      decision_reason: >-
        لا يجتاز اختبار التثبيت المعجمي: يمكن إبدال «الوجود» بـ«الحياة» أو «الكون»
        أو «الاستمرار» مع بقاء العبارة وصفاً مقبولاً — وهذا يثبت أنها عبارة وصفية
        حرة لا وحدة معجمية مسكوكة. لا أدلة على تثبيتها في المعاجم.


