stage1_review:
  assessment:
    concerns:
      - اللمات الحالية جيدة ولكنها قد لا تغطي الجانب "الشيئي" للمصطلح (المركب نفسه) والجانب "المفهومي" (عملية التركيب).
      - غياب كلمة "مُرَكَّب" وهي اللفظ الأساسي المقابل لـ Compound في العلم والمنطق.
    observations: "المجموعة الترادفية تغطي مفهوم 'Combination' كمنتج أو تجميع. اللمات الموجودة (تركيبة، توليفة، مزيج) تميل إلى السياقات الصيدلانية أو الإبداعية أو الفيزيائية."
  blind_candidates:
    - lemma: "مُرَكَّب"
      generation_method: ishtiqaq
      justification: "اسم مفعول من ركَّب، يعبر عن الشيء الذي يتألف من أجزاء، وهو المقابل الأدق لـ Compound."
    - lemma: "تَرْكِيبَة"
      generation_method: ishtiqaq
      justification: "صيغة للمرة أو الهيئة من التركيب، تشيع في وصف الصيغ الكيميائية أو الصيدلانية."
    - lemma: "مَزِيج"
      generation_method: ishtiqaq
      justification: "فعيل بمعنى مفعول (مَمزُوج)، يعبر عن اختلاط الأشياء أو الصفات."
    - lemma: "تَوْلِيفَة"
      generation_method: tarkib
      justification: "لفظ حديث يعبر عن الجمع المتناسق بين عناصر مختلفة."

stage2_evidence:
  per_lemma:
    - lemma: "تَرْكِيبَة"
      confirm:
        - text: "«تتم الإشارة إلى مكونات القماش بالاسم كالقطن أو الصوف وغيرها، وعند وجود مزيج من عدة موادّ أولية تتم الإشارة إلى النسبة المئوية لكل منها.»"
          source: "مسرد صناعة النسيج (ArabTerm)"
      expands:
        - text: "«توليفة انتاجية، تركيبة انتاجية: productive combination»"
          source: "المعجم الموحد لمصطلحات الاقتصاد"
    - lemma: "تَوْلِيفَة"
      confirm:
        - text: "«هذا الدواء توليفة من عدة أعشاب... شاعت في لغة العصر الحديث للأشياء التي تتألف من جملة عناصر أو أفراد.»"
          source: "معجم الصواب اللغوي"
        - text: "«توليفة: combination»"
          source: "المعجم الموحد لمصطلحات علوم البحار"
    - lemma: "مَزِيج"
      confirm:
        - text: "«يتكون من شيئين أو أكثر ممتزجين»"
          source: "المعجم الوسيط"
        - text: "«مزيج من عصير الفواكه... أثبتتها المعاجم الحديثة كالوسيط والأساسي والمنجد بهذا المعنى.»"
          source: "معجم الصواب اللغوي"
    - lemma: "مُرَكَّب"
      confirm:
        - text: "«مَا تألف من الجزئين أَو الْأَجْزَاء ضد الْبَسِيط»"
          source: "دستور العلماء"
        - text: "«جسم تألف من أجسام مُخْتَلفَة الطبائع»"
          source: "معجم مقاليد العلوم"
        - text: "«المادَّةُ المتجانسة ذات التّركيب الثابت الخصائص الناتجة مِنْ عُنْصُرَيْن أو أكثر اتّحدا كيميائيًّا»"
          source: "المعجم الكبير"
    - lemma: "تَرْكِيب"
      confirm:
        - text: "«تأليف الشَّيْء من مكوناته البسيطة»"
          source: "المعجم الوسيط"
        - text: "«جعل الأشياء المتعدّدة بحيث يطلق عليها اسم الواحد»"
          source: "كشاف اصطلاحات الفنون"

stage3_analysis:
  per_lemma:
    - lemma: "تركيبة"
      decision: confirmed
      decision_reason: "مصطلح مستقر يعبر عن البنية الداخلية أو الصيغة المحددة لمزيج ما."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْكِيبَة"
    - lemma: "توليفة"
      decision: confirmed
      decision_reason: "لفظ شائع وحديث يعبر عن الجمع المتناسق والمختار بعناية لعناصر أو أفراد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوْلِيفَة"
    - lemma: "مزيج"
      decision: confirmed
      decision_reason: "يدل على اختلاط العناصر بحيث قد تفقد تمايزها الفردي، وهو مناسب جداً لفقرة 'صفات منفصلة' في التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَزِيج"
    - lemma: "تَرْكِيب"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الجانب المفهومي (تأليف الشيء من مكوناته) ويستخدم كمرادف لـ Combination في العلوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَرْكِيب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُرَكَّب"
      source: stage1
      decision: confirmed
      decision_reason: "الاسم الدال على الشيء الناتج عن التركيب، وهو أساسي في الكيمياء والمنطق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُرَكَّب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "مجموعة من الأشياء التي تم دمجها؛ تجميع لأجزاء أو صفات منفصلة"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي إلى حد ما، يفضل صياغته بأسلوب معجمي يجمع بين الجانب المادي والمعنوي."
    authored:
      - type: terminological
        text: "ما تَأَلَّفَ مِن أَجْزاءٍ أو صِفاتٍ مُخْتَلِفَةٍ؛ أو كُلٌّ مُنَسَّقٌ ناتِجٌ عن جَمْعِ عِِدَّةِ عَنـاصِرَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَرْكِيبَة"
        examples:
          - text: "تَعْتَمِدُ هذِهِ التَّرْكِيبَةُ الصَّيْدَلانِيَّةُ على مَوادَّ طَبِيعِيَّةٍ."
            type: usage
      - lemma: "تَوْلِيفَة"
        examples:
          - text: "قَدَّمَ الطَّاهِي تَوْلِيفَةً رائِعَةً مِنَ التَّوابِلِ الشَّرْقِيَّةِ."
            type: usage
      - lemma: "مَزِيج"
        examples:
          - text: "تُعْتَبَرُ الرُّوحُ العَرَبِيَّةُ مَزِيجاً مِنَ الكَرَمِ والشَّهامَةِ."
            type: usage
      - lemma: "تَرْكِيب"
        examples:
          - text: "دَرَسَ العُلَماءُ تَرْكِيبَ المادَّةِ لِفَهْمِ خَصائِصِها."
            type: usage
      - lemma: "مُرَكَّب"
        examples:
          - text: "الماءُ مُرَكَّبٌ كِيمْياوِيٌّ يَتَكَوَّنُ مِنَ الأُكْسُجينِ والهِيدْرُوجينِ."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "ما تَأَلَّفَ مِن أَجْزاءٍ أو صِفاتٍ مُخْتَلِفَةٍ؛ أو كُلٌّ مُنَسَّقٌ ناتِجٌ عن جَمْعِ عِِدَّةِ عَنـاصِرَ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تَعْتَمِدُ هذِهِ التَّرْكِيبَةُ الصَّيْدَلانِيَّةُ على مَوادَّ طَبِيعِيَّةٍ."}

