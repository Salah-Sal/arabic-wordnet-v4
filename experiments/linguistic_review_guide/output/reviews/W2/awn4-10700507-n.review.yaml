# مراجعة المجموعة الترادفية — awn4-10700507-n (survivor)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الأولى «بَاقٍ عَلَى قَيْد الْحَيَاة» عبارة وصفية طويلة (أربع كلمات) وليست مصطلحاً مسكوكاً مُحكَماً، وإن شاعت في الاستعمال الإعلامي"
      - "العلاقة بالمُشمِل الأعلى (عامل/فاعل) ضعيفة دلالياً؛ الناجي ليس بالضرورة فاعلاً أو عاملاً"
      - "التعريف العربي «من يعيش أطول من غيره» قريب من الترجمة الحرفية للتعريف الإنجليزي، ويحتاج صياغة معجمية أدقّ"
    observations: "المجموعة تدلّ على شخص بقي حيّاً بعد هلاك غيره أو بعد حدث مُهلك. اللمّة «نَاجٍ» اسم فاعل من نجا/ينجو وهو أنسب لمفهوم النجاة العامّ. أمّا «باقٍ على قيد الحياة» فهي عبارة شائعة إعلامياً لكنها وصفية. المفهوم راسخ في الثقافة العربية ولا يحتاج تعريباً."
  blind_candidates:
    - lemma: "نَاجٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الجذر (نجو) على وزن فاعِل، يدلّ على من خلص من الهلاك وبقي حيّاً بعد غيره"
    - lemma: "مُعَمَّر"
      generation_method: ishtiqaq
      justification: "اسم مفعول من عمَّر (الجذر: عمر)، يدلّ على من أطال الله عمره فعاش أكثر من أقرانه"
    - lemma: "بَاقٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من بقي (الجذر: بقي)، ومعناه المعجمي «الثابت بعد غيره» وهو قريب جداً من دلالة المجموعة"
    - lemma: "خَالِفٌ"
      generation_method: majaz
      justification: "من الجذر (خلف) بمعنى من يأتي بعد غيره ويخلفه، مجاز من البقاء بعد ذهاب السابق"

stage2_evidence:
  per_lemma:
    - lemma: "بَاقٍ عَلَى قَيْد الْحَيَاة"
      evidence_status: "no_material_found"

    - lemma: "نَاجٍ"
      confirm:
        - text: "«نَاجِي من (ن ج و) المتخلص من الأذى وغيره، ومن يُسِّر إلى آخر حديثا ومنه النجوى والمناجاة، والناجي: السريع، ومن يقطع الغصن ونحوه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«نَجَوَ: النُّونُ وَالْجِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ، يَدُلُّ أَحَدُهُمَا عَلَى كَشْطٍ وَكَشْفٍ، وَالْآخَرُ عَلَى سَتْرٍ وَإِخْفَاءٍ... وَنَجَا الْإِنْسَانُ يَنْجُو نَجَاةً، وَنَجَاءً فِي السُّرْعَةِ; وَهُوَ مَعْنَى الذَّهَابِ وَالِانْكِشَافِ مِنَ الْمَكَانِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر نجو يدلّ أصلاً على الانكشاف والذهاب، ومنه النجاة أي التخلّص"

    - lemma: "مُعَمَّر"
      confirm:
        - text: "«مُعَمَّر من (م ع ر) من طال عمره، والمنزل الآهل بسكانه، والأرض بني عليها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«مُعَمِّر: الطويل العمر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«مُعَمِّر: اتفقت المعاجم القديمة والحديثة على إطلاق لفظ مُعَمَّر - بفتح الميم المشددة - على من عَمَّره الله بأن أطال عمره وأبقاه، استنادًا إلى قوله تعالى: {وَمَا يُعَمَّرُ مِنْ مُعَمَّرٍ}»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "التمييز بين مُعَمَّر (اسم مفعول، الفصيح) ومُعَمِّر (اسم فاعل، أجازه المجمع حديثاً)"
      contradicts:
        - text: "«المعمر: المنزل الكثير الماء والكلإ والناس»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي للمَعْمَر (بفتح الميم وسكون العين) هو المنزل لا الشخص، والاشتراك مع مُعَمَّر (اسم المفعول) قد يُوقِع لبساً"

    - lemma: "بَاقٍ"
      confirm:
        - text: "«بَاقِي من (ب ق ي) الثابت والفاضل بعد انقضاء غيره وذهابه، وما هو باق من الخراج على الرعية ولم يحصل بعد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الْبَاقِي: الثَّابِت بعد غَيره وَاسم من أَسمَاء الله تَعَالَى»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الباقي: اسمٌ من أسماء الله الحُسْنَى»"
          source: "المعجم الكبير"
          conflict: "الاستعمال الغالب لـ«الباقي» هو اسم من أسماء الله الحسنى أو بمعنى المتبقي من شيء (الباقي الرياضي)، لا بمعنى الناجي من الهلاك"

    - lemma: "خَالِفٌ"
      contradicts:
        - text: "«الخالف: يُقال أصبح فلان خالفاً ضعيفاً لا يشتهي الطعام ورجل خالف كثير الخلاف»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي بعيد تماماً عن دلالة النجاة أو البقاء بعد الغير، فهو يدلّ على الضعف أو كثرة الخلاف"
        - text: "«خَالِف من (خ ل ف) المتغير والفاسد والأحمق والمغرض»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "دلالات سلبية لا تناسب مفهوم الناجي"

stage3_analysis:
  per_lemma:
    - lemma: "بَاقٍ عَلَى قَيْدِ الْحَيَاةِ"
      decision: confirmed
      decision_reason: "عبارة شائعة ومفهومة في الاستعمال المعاصر للدلالة على من نجا من حدث مُهلك وبقي حياً، وإن كانت وصفية طويلة فهي مستقرّة في الاستعمال الإعلامي والقانوني"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تؤكّد على حالة البقاء على قيد الحياة بعد خطر أو كارثة، وتحمل بُعداً وصفياً يبرز استمرار الحياة ذاتها"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَاقٍ عَلَى قَيْدِ الْحَيَاةِ"

    - lemma: "نَاجٍ"
      decision: confirmed
      decision_reason: "اسم فاعل فصيح من نجا/ينجو (الجذر: نجو)، مؤيَّد بالأدلة المعجمية بمعنى المتخلّص من الأذى، وهو الأنسب لمفهوم المجموعة من حيث الإيجاز والاشتقاقية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على فعل النجاة والتخلّص من الخطر، ويصلح للسياقات العامة (ناجٍ من الحريق، ناجٍ من الحرب)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَاجٍ"

    - lemma: "مُعَمَّر"
      source: stage1
      decision: removed
      decision_reason: "المُعَمَّر يدلّ على من طال عمره مطلقاً، لا على من بقي بعد هلاك غيره تحديداً. الفرق الدلالي واضح: المُعَمَّر قد لا يكون ناجياً من حدث مُهلك بل مجرّد طويل العمر"

    - lemma: "بَاقٍ"
      source: stage1
      decision: removed
      decision_reason: "رغم قرب المعنى المعجمي (الثابت بعد غيره)، فإنّ «باقٍ» مفردة عامّة جداً تشمل كل ما بقي بعد ذهاب غيره (باقي الطعام، الباقي الرياضي)، ولا تختصّ بالنجاة من الهلاك. كما أنّ العبارة الكاملة «باقٍ على قيد الحياة» موجودة بالفعل في المجموعة"

    - lemma: "خَالِفٌ"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تناقض المعنى المطلوب تماماً؛ خالف يدلّ على الضعيف أو كثير الخلاف أو الفاسد، ولا علاقة له بالنجاة أو البقاء بعد الغير"

