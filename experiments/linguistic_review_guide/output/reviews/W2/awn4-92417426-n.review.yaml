# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عدم القابلية للقسمة» تعبير وصفي حر يفشل اختبار السكّ: يمكن إبدال «القابلية» بـ«الإمكانية» أو «الاستطاعة» دون أن يفقد المعنى، وهو ما يدلّ على أنه ليس مصطلحاً مسكوكاً"
      - "الارتباط بالمجموعة العليا (جَوْدَة / نَوْعِيَّة = صفة جوهرية لشيء أو شخص) صحيح من حيث التصنيف الشجري لـWordNet، لكنه قد يبدو غريباً في السياق الرياضي البحت"
      - "ILI فارغ — لا ربط بالشبكة الإنجليزية (OEWN)"
      - "غياب التشكيل الكامل في اللمّة الموجودة"
      - "لا تعريف ثانٍ لغوي أو موسوعي يُعين على فهم المصطلح خارج الحساب"
    observations: >
      المجموعة تمثّل مفهوماً رياضياً دقيقاً هو خاصية «عدم قابلية القسمة» (Indivisibility)
      في نظرية الأعداد؛ أي كون عدد صحيح ما لا يقبل القسمة على عدد آخر دون باقٍ. المعجمية
      العربية المعاصرة (ALECSO / ARABTERM) تعتمد صيغة «عدم قابلية X» لتعبير عن غياب خاصية ما
      في مجالات علمية متعددة، غير أنّ الصيغة المتحقّقة في قواميس الرياضيات هي «قابلية القسمة»
      (divisibility) مع صيغة منفيّة ضمنية. اللمّة الراهنة صحيحة دلالياً لكن مثقلة بنياوياً
      بجزء إضافي (القابلية) يمكن الاستغناء عنه قياساً على باقي نظائرها في ARABTERM.

  blind_candidates:
    - lemma: "اللَّاقِسْمِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على نمط «لا + مصدر/جذر + ية» الإنتاجي في المصطلحية العربية الحديثة
        (اللاعقلانية، اللاأدرية، اللامركزية). من جذر ق-س-م على وزن فَعْل مع البادئة
        النافية «لا» والمصدر الصناعي «-يّة»، فتؤدي معنى «خاصيّة عدم القسمة». قصيرة
        ومصكوكة وقابلة للتصريف.
    - lemma: "امْتِنَاعُ الانْقِسَامِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «امتناع» (مصدر امتنع = استحال) + «الانقسام» (مصدر انقسم).
        يعبّر عن «استحالة الانقسام» بصورة إضافية مختزلة. «امتناع» أوضح في الدلالة
        على الاستحالة من «عدم القابلية»، وهو مصطلح شائع في الأدبيات الرياضية العربية.
    - lemma: "التَّعَذُّرِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الفعل «تعذَّر» (يصعب / يستحيل) على وزن تَفَعُّل + ية. الوزن يدلّ
        على الخاصية المستحيلة؛ كما يقال «تعذُّر القسمة» يمكن تحويله إلى مصدر صناعي
        «التعذُّرية». لكنه أكثر عمومية من المطلوب.
    - lemma: "الصَّمَمُ الحِسَابِيُّ"
      generation_method: majaz
      justification: >
        مجاز: «الصمم» (انعدام الحساسية/المنع) + «الحسابي». في التراث الرياضي العربي
        يُستعمل وصف «أصمّ» للأعداد غير القابلة للتعبير بنسبة كسرية (الأعداد غير النسبية).
        توسيع دلالي للصمم ليشمل عدم قبول القسمة التامة. ضعيف بسبب تخصّص «أصمّ» للأعداد
        غير النسبية وليس لعدم قابلية القسمة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: نُفِّذت الاستعلامات الآتية:
  # (١) مطابقة دفعية: عدم القابلية للقسمة + المرشحات + مصطلحات قريبة (قسمة، انقسام، قابلية القسمة...)
  # (٢) جسر إنجليزي: indivisibility, indivisible, divisibility, incommensurable
  # (٣) FTS عربي: "قابلية القسمة" OR "عدم قابلية" OR "اللاانقسامية"...
  # (٤) مقاييس اللغة: جذور قسم، قبل، عدم

  per_lemma:

    - lemma: "عدم القابلية للقسمة"
      expands:
        - text: >
            «قابلية القسمة» — المقابل العربي المعتمد لـ"divisibility" في مجال
            الرياضيات والفلك
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك، ALECSO (1990)"
          addition: >
            يُثبت أن ARABTERM يعتمد صيغة «قابلية X» (بدون التعريف على «قابلية»)
            كنمط اصطلاحي راسخ في الرياضيات؛ وعليه فإن النفي القياسي يكون «عدم
            قابلية القسمة» لا «عدم القابلية للقسمة» (الفرق: إضافة ال- وتغيير البنية
            من إضافية إلى وصفية).
        - text: >
            «قابلية القسمة» — المقابل العربي لـ"divisibility" في مجال الفيزياء العامة
            والنووية
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية، ALECSO (1989)"
          addition: >
            يدعم النمط نفسه في مجال الفيزياء، مما يرسّخ البنية «قابلية القسمة» بدلاً
            من «القابلية للقسمة».
        - text: >
            «عدم قابلية التجزئة» — المقابل العربي لـ"indivisibility" في مجال الاقتصاد
          source: "المعجم الموحد لمصطلحات الاقتصاد، ALECSO (2000)"
          addition: >
            دليل مباشر على توثيق «عدم قابلية X» في ARABTERM لمفهوم "indivisibility"
            بالمعنى العام، وإن كان في الاقتصاد لا الرياضيات. يؤكد النمط الاصطلاحي
            الصحيح: «عدم قابلية القسمة» لا «عدم القابلية للقسمة».
        - text: >
            «(القِسْمَة) اسم من اقتسام الشيء والنصيب (ج) قسم و(في الحساب) قسمة عدد
            على آخر: تجزئة الأول أجزاء بقدر العدد الثاني، ويُسمّى الأول: المقسوم،
            والآخر: المقسوم عليه، والناتج: خارج القِسمة»
          source: "المعجم الوسيط، مجمع اللغة العربية بالقاهرة"
          addition: >
            يُعرِّف القسمة الحسابية تعريفاً دقيقاً ويشرح المصطلحات المرتبطة (مقسوم،
            مقسوم عليه، خارج القسمة)، مما يدعم استخدام «القسمة» في السياق الرياضي.

    - lemma: "اللَّاقِسْمِيَّة"
      evidence_status: "no_material_found"

    - lemma: "امْتِنَاعُ الانْقِسَامِ"
      evidence_status: "no_material_found"

    - lemma: "التَّعَذُّرِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الصَّمَمُ الحِسَابِيُّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "عدم القابلية للقسمة"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة دلالياً وتصف المفهوم بدقة، غير أنها تحتاج: (أ) تشكيلاً كاملاً،
        (ب) تعديلاً طفيفاً في البنية ليوافق النمط الاصطلاحي الراسخ في ARABTERM
        («عدم قابلية القسمة» بدلاً من «عدم القابلية للقسمة»). لا يوجد دليل مناقض،
        والأدلة الموسّعة من ARABTERM تؤكد النمط العام وإن بمفردة متفاوتة.
        وبما أنّ اللمّة الحالية هي المدخل الوحيد للمجموعة وليس ثمة بديل أفضل
        موثّق في قواميس الرياضيات العربية، تُبقى مع تصحيح التشكيل والبنية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تمثّل الخاصية الرياضية لعدم قبول القسمة التامة
        على عدد صحيح محدد. تتميز عن «عدم قابلية التجزئة» الاقتصادية بأنها مختصة
        بالسياق الحسابي (نظرية الأعداد)، وعن «الأعداد الأولية» بأنها وصف إجرائي
        لخاصية القسمة لا تصنيف للعدد ذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ قَابِلِيَّةِ الْقِسْمَةِ"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "اللَّاقِسْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا يوجد توثيق معجمي لهذه الصيغة في قواميس الرياضيات العربية أو ARABTERM.
        رغم أن بنية «لا + جذر + ية» منتجة في العربية الحديثة، إلا أن «اللاقسمية» لم
        تُسكّ بعد في المعجمية الرياضية العربية المعيارية.

    - lemma: "امْتِنَاعُ الانْقِسَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير إضافي وصفي وليس مصطلحاً مسكوكاً؛ يفشل اختبار التثبيت المعجمي.
        لا يوجد توثيق في أي معجم رياضي عربي. رغم دقّته الدلالية، يبقى عبارة
        وصفية لا مصطلحاً مفرداً.

    - lemma: "التَّعَذُّرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة مشتقّة صرفياً لكنها عامة جداً ولا تختصّ بعدم قابلية القسمة.
        «التعذرية» تعني الاستحالة بوجه عام ولا تحمل الدلالة الرياضية المطلوبة.
        لا توثيق في قواميس الرياضيات.

    - lemma: "الصَّمَمُ الحِسَابِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        في التراث الرياضي العربي، «أصمّ» (ومنه الصمم) يختصّ بالأعداد غير النسبية
        (irrational numbers) لا بعدم قابلية القسمة. استخدامه هنا يُحدث اشتراكاً
        لفظياً مع مفهوم رياضي مختلف.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "(في الحساب) حالة استحالة القسمة على عدد صحيح محدد دون ترك باقي"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يصف المفهوم وصفاً إجرائياً مناسباً، لكنه يفتقر إلى الجنس
        القريب الصريح (لم يُصرَّح بأنها «خاصية» أو «صفة» لعدد)، كما أن صيغة
        «ترك باقي» أفصح لو قيل «دون باقٍ». يُستحسن صياغة تعريف مصطلحي يُحدّد
        الجنس (خاصية / صفة) والفصل (شرط القسمة التامة).
    authored:
      - type: terminological
        text: >
          (رياضيات — نظرية الأعداد) خاصيّةُ العدد الصحيح الذي لا تقبل قسمته على
          عدد صحيح آخر بعينه انقساماً تاماً، فيُخلِّف باقياً غير صفر
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          إذا كان العدد أ لا يَنقسم تماماً على العدد ب، أي لا يوجد عدد صحيح ج
          بحيث أ = ب × ج، قيل إن أ يتّصف بعدم قابلية القسمة على ب. وتُعدّ
          الأعداد الأولية نموذجاً بارزاً، إذ لا تقبل القسمة على أي عدد سوى
          الواحد وذاتها.
    actions:
