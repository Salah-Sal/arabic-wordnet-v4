stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي 'ترتيب منظم' واسع جداً وقد يختلط مع عملية الترتيب نفسها."
      - "اللمّات الموجودة تغطي الجانب العام والجانب الرياضي/التقني، لكن ينقصها اللفظ المتخصص للمجموعات المرتبة في سياق البيانات (array)."
    observations: "المجموعة تعبر عن النتيجة النهائية للترتيب كبناء منظم (array). اللمات المقترحة تهدف لتعزيز الجانب الهيكلي لهذا المفهوم."
  blind_candidates:
    - lemma: "نَسَق"
      generation_method: ishtiqaq
      justification: "لفظ تراثي يعبر عن التتابع والنظام المستوي في كل شيء."
    - lemma: "تَنْضِيد"
      generation_method: ishtiqaq
      justification: "يعبر عن رصف الأشياء وضم بعضها إلى بعض في طبقات أو صفوف."
    - lemma: "صَفِيف"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة أو صفة مشبهة تدل على ما صُفَّ من الأشياء بانتظام، وهو مستعمل تقنياً لترجمة array."
    - lemma: "مَنْظُومَة"
      generation_method: ishtiqaq
      justification: "ما كان مؤلفاً ومرتباً في سلك أو نظام واحد."

stage2_evidence:
  per_lemma:
    - lemma: "ترتيب"
      confirm:
        - text: "«الترتيب: لغة، جعل كل شيء في مرتبة. وعرفا جعل الأشياء الكثيرة بحيث يطلق عليها اسم الواحد ويكون لبعض أجزائه نسبة إلى بعضها بالتقدم والتأخر.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«arrangement / array / order»"
          source: "المعجم الموحد لمصطلحات المياه"
    - lemma: "نسق"
      confirm:
        - text: "«النسق من كل شيء: ما كان على طريقة نظام واحد، عام في الأشياء.»"
          source: "لسان العرب"
        - text: "«ما كان على نظام واحد من كل شيء يقال جاء القوم نسقا وزرعت الأشجار نسقا»"
          source: "المعجم الوسيط"
    - lemma: "مصفوفة"
      confirm:
        - text: "«(في الجبر): تنظيم مستطيلي لعدد من الحدود مرتبة في أعمدة وصفوف.»"
          source: "المعجم الكبير"
        - text: "«مجموعة من العناصر من النوع نفسه في ترتيب معين يمكن التعامل معها كوحدة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
    - lemma: "صفيف"
      confirm:
        - text: "«مجموعة من المفردات مرتبة في بعد واحد أو أكثر.»"
          source: "مسرد التربية (Arabterm)"
        - text: "«عناصر ذاكرة الكومبيوتر مرتبة وفقًا لنظام خاص (ألك).»"
          source: "المورد الحديث"
      expands:
        - text: "«الصخور الرسوبية التي تترتب طبقاتها بعضها فوق بعض بصورة متوازية.»"
          source: "المعجم الكبير"
          addition: "استعمال جيولوجي للمفهوم."

stage3_analysis:
  per_lemma:
    - lemma: "تَرْتِيب"
      decision: confirmed
      decision_reason: "مصطلح عام صحيح يعبر عن النتيجة المنظمة لوضع الأشياء في مراتبها، ومدعوم معجمياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْتِيب"
    - lemma: "نَسَق"
      decision: confirmed
      decision_reason: "من أدق الألفاظ العربية للتعبير عن الانتظام والتتابع على نظام واحد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَسَق"
    - lemma: "مَصْفُوفَة"
      decision: confirmed
      decision_reason: "مصطلح أساسي في الرياضيات والتقنية للتعبير عن الترتيب الشبكي (صفوف وأعمدة)، وهو مرادف مباشر لـ array في السياقات العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَصْفُوفَة"
    - lemma: "صَفِيف"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح متخصص قوي مدعوم من معاجم المصطلحات الحديثة (المورد، أراب تيرم) للتعبير عن المجموعة المرتبة من البيانات أو العناصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "صَفِيف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07955622-n"}

stage4_content:
  definition:
    current: "ترتيب منظم"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويحتاج لتوضيح يشمل الجانب الهيكلي للمفهوم."
    authored:
      - type: terminological
        text: "تَجْمِيعٌ أَوْ بِنَاءٌ مَنْطِقِيٌّ لِعَنَاصِرَ (أَشْيَاءَ أَوْ بَيَانَاتٍ) مَوْضُوعَةٍ وَفْقَ نِظَامٍ أَوْ تَرْتِيبٍ ثَابِتٍ لِتُعَامَلَ كَكِيَانٍ وَاحِدٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَرْتِيب"
        examples:
          - text: "قَامَ أَمِينُ الْمَكْتَبَةِ بِتَرْتِيبِ الْكُتُبِ فِي نَسَقٍ هِجَائِيٍّ دَقِيقٍ."
            type: usage
      - lemma: "نَسَق"
        examples:
          - text: "تَمَّ زَرْعُ الْأَشْجَارِ فِي نَسَقٍ وَاحِدٍ عَلَى طُولِ الطَّرِيقِ."
            type: usage
      - lemma: "مَصْفُوفَة"
        examples:
          - text: "تَتَكَوَّنُ الْمَصْفُوفَةُ الشَّمْسِيَّةُ مِنْ مِئَاتِ الْأَلْوَاحِ الْمُرَتَّبَةِ لِتَوْلِيدِ الطَّاقَةِ."
            type: usage
      - lemma: "صَفِيف"
        examples:
          - text: "تُخَزَّنُ أَسْمَاءُ الْمُوَظَّفِينَ فِي صَفِيفٍ بَرْمَجِيٍّ لِتَسْهِيلِ الْبَحْثِ عَنْهَا."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07955622-n", definition_index: 0, text: "تَجْمِيعٌ أَوْ بِنَاءٌ مَنْطِقِيٌّ لِعَنَاصِرَ (أَشْيَاءَ أَوْ بَيَانَاتٍ) مَوْضُوعَةٍ وَفْقَ نِظَامٍ أَوْ تَرْتِيبٍ ثَابِتٍ لِتُعَامَلَ كَكِيَانٍ وَاحِدٍ."}

