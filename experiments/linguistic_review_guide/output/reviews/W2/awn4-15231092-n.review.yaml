  definition:
    current: "وحدة زمنية تبلغ حوالي 30 يوماً"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول لكنه مختصر جداً ولا يذكر العلاقة بدورة القمر ولا الجذر الدلالي. يمكن تحسينه بإضافة الجنس القريب (جزء من السنة) والفصل النوعي (مقدّر بدورة القمر أو بجزء من اثني عشر جزءاً من السنة)."
