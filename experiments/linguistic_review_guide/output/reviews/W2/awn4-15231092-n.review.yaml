# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-15231092-n (month / شهر)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (شهر)، وهو المصطلح الأساسي والوحيد تقريباً للمفهوم في العربية"
      - "اللمّة الموجودة بدون تشكيل كامل — يجب إضافته"
    observations: "مفهوم «الشهر» مفهوم أصيل في الثقافة العربية مرتبط بالهلال والتقويم القمري. اللفظ «شَهْر» من أقدم الألفاظ العربية وأكثرها شيوعاً، مشتق من جذر (ش هـ ر) الدال على الوضوح والظهور، وسُمّي الشهر شهراً لظهور الهلال فيه. المفهوم بسيط ومباشر ولا يحتاج إلى مترادفات كثيرة لأن اللفظ متفرّد بدلالته الزمنية."
  blind_candidates:
    - lemma: "شَهْر"
      generation_method: ishtiqaq
      justification: "من جذر (ش هـ ر) على وزن فَعْل، وهو اللفظ العربي الأصيل للوحدة الزمنية المقدَّرة بنحو ثلاثين يوماً، مأخوذ من ظهور الهلال وشهرته"
    - lemma: "قَمَرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «قمر» على وزن فَعَلِيَّة، بمعنى الدورة القمرية الواحدة — لكن اللفظ يُستعمل صفةً (سنة قمرية) لا اسماً مستقلاً للشهر"
    - lemma: "هِلَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «هلال» لتسمية الفترة بين هلالين متتاليين — لكنه غير مسكوك ولا مستعمل في هذا المعنى"
    - lemma: "ثَلَاثِينِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «ثلاثين» للإشارة إلى فترة الثلاثين يوماً — لكنه لفظ مُولَّد غير مستعمل ولا يُغني عن شَهْر"

stage2_evidence:
  per_lemma:
    - lemma: "شَهْر"
      confirm:
        - text: "«جزء من اثني عشر جزءاً من السنة (الشمسية والقمرية) ويقدّر في السنة القمرية بدورة القمر حول الأرض، ويسمى: الشهر القمري. أو يقدّر بجزء من اثني عشر جزءاً من السنة الشمسية. ويسمى الشهر الشمسي»"
          source: "المعجم الوسيط"
        - text: "«الهِلالُ القمرُ إذا ظَهَرَ جزءٌ من اثْنَيْ عَشَرَ جزءًا من السَّنَة - الشمسية والقمريّة - ويُقَدَّرُ فى السَّنَة القمريَّة بدورةِ القَمَر حول الأَرْضِ، ويُسَمَّى: الشهر القمرىّ، أو يُقَدَّرُ بجزءٍ من اثْنَى عشر جزءًا من السنة الشمسيَّة، ويُسَمَّى: الشهر الشّمسِيَّ»"
          source: "المعجم الكبير"
        - text: "«الشَهْرُ: واحد الشُهورِ. وقد أَشْهَرْنا، أي أتى علينا شَهْرٌ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«الشَّهْرُ: الْهِلَالُ، سُمِّى بِهِ لِشُهْرَتِهِ وظُهُوره»"
          source: "النهاية في غريب الحديث والأثر لابن الأثير"
        - text: "«الشَّهْرُ قِيلَ مُعَرَّبٌ وَقِيلَ عَرَبِيٌّ مَأْخُوذٌ مِنْ الشُّهْرَةِ وَهِيَ الِانْتِشَارُ»"
          source: "المصباح المنير للفيّومي"
        - text: "«الواحد من الشهور, ويقال هو الهلال وضوح الأمر»"
          source: "مجمل اللغة"
        - text: "«الشَّهر: ثلاثون يومًا على وجه التقريب.»"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«الشهر: الهلال الذي شأنه أن يدور دورة من حين يهل إلى أن يهل ثانياً، سواء كان ناقصاً أم كاملاً... وأصله الإظهار والكشف، فهذا الزمان لاشتهاره سمي شهراً، أو هو ما بين الهلالين»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يوضّح أن الشهر في أصله هو الهلال نفسه ثم نُقل للفترة الزمنية، وأن مدته بين 29 و30 يوماً"
        - text: "«ذكر بعض أهل اللغة أنه بالسريانية»"
          source: "المهذب فيما وقع في القرآن من المعرب للسيوطي"
          addition: "يشير إلى رأي بأن اللفظ معرّب من السريانية، لكن الرأي السائد أنه عربي أصيل"
        - text: "«العدد المعروف من الأيام ظهور الشيء في شنعة»"
          source: "كتاب العين"
          addition: "أقدم مصدر معجمي يجمع بين الدلالة الزمنية ودلالة الظهور والشهرة"
    - lemma: "قَمَرِيَّة"
      evidence_status: "no_material_found"
    - lemma: "هِلَالِيَّة"
      evidence_status: "no_material_found"
    - lemma: "ثَلَاثِينِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "شَهْر"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل مُجمَع عليه في جميع المعاجم العربية القديمة والحديثة، مؤكَّد بشواهد قرآنية وحديثية وشعرية. هو اللفظ الوحيد المتداول للدلالة على وحدة زمنية تبلغ نحو ثلاثين يوماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَهْر"

    - lemma: "قَمَرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استعمال «قمرية» اسماً مستقلاً بمعنى الشهر. يُستعمل صفةً في تركيب «سنة قمرية» أو «شهر قمري» فقط."
      evidence_assessment:
        case: no_material

    - lemma: "هِلَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لفظ غير مسكوك ولا مُثبت في أي معجم بمعنى الشهر. المعاجم تذكر «الهلال» باعتباره أصل تسمية الشهر لا مرادفاً له."
      evidence_assessment:
        case: no_material

    - lemma: "ثَلَاثِينِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لفظ مُولَّد لا شاهد له في أي مصدر معجمي. التعبير عن الشهر بعدد أيامه تقريبٌ وصفي لا مصطلح."
      evidence_assessment:
        case: no_material

