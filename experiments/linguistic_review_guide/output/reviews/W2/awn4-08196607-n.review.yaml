      maqayis_quote: "«الدَّالُ وَالْهَاءُ وَالْمِيمُ أَصْلٌ يَدُلُّ عَلَى غِشْيَانِ الشَّيْءِ فِي ظَلَامٍ... وَمِنَ الْبَابِ الدَّهْمُ: الْعَدَدُ الْكَثِيرُ.»"
    - lemma: "عَامَّةُ الشَّعْبِ"
