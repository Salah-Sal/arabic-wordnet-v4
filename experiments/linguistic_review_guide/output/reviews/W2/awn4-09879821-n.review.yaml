stage1_review:
  assessment:
    concerns:
      - "لا توجد مشكلات بارزة، اللمة الموجودة دقيقة وتعبّر عن المفهوم بوضوح."
    observations: "اللمة 'مُدَوِّن' هي الترجمة القياسية والشائعة للمصطلح الإنجليزي (blogger). وهي مشتقة من الفعل 'دَوَّنَ' (كتب وسجل)."
  blind_candidates:
    - lemma: "مُدَوِّن"
      generation_method: ishtiqaq
      justification: "على وزن مُفَعِّل من الفعل دوّن، للدلالة على من يقوم بفعل التدوين."
    - lemma: "صَاحِبُ مُدَوَّنَة"
      generation_method: tarkib
      justification: "تركيب إضافي يدل على المالك للمدونة والمشرف عليها."
    - lemma: "كَاتِبُ يَوْمِيَّاتٍ رَقْمِيَّة"
      generation_method: tarkib
      justification: "وصف مباشر للمفهوم بدمج الكتابة مع اليوميات الرقمية."
    - lemma: "مُسَجِّلُ يَوْمِيَّات"
      generation_method: tarkib
      justification: "تعبير عن الشخص الذي يسجل يومياته بانتظام."

stage2_evidence:
  per_lemma:
    - lemma: "مُدَوِّن"
      confirm:
        - text: "«على الشابكة (الإنترنت)» ترجمة لـ blogger"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«مُدَوِّن من (د و ن) المُسجّل.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "صَاحِبُ مُدَوَّنَة"
      evidence_status: "no_material_found"
    - lemma: "كَاتِبُ يَوْمِيَّاتٍ رَقْمِيَّة"
      evidence_status: "no_material_found"
    - lemma: "مُسَجِّلُ يَوْمِيَّات"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُدَوِّن"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً واستقراراً في العربية المعاصرة للدلالة على من يكتب في مدونة، وهو معتمد في مسارد المصطلحات الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدَوِّن"
            
    - lemma: "صَاحِبُ مُدَوَّنَة"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي وليس مصطلحاً مسكوكاً مستقلاً."

    - lemma: "كَاتِبُ يَوْمِيَّاتٍ رَقْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: "وصف طويل وغير عملي مقارنة باللمة القياسية الشائعة."

    - lemma: "مُسَجِّلُ يَوْمِيَّات"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي عام لا يختص بالتدوين الإلكتروني."

stage4_content:
  definition:
    current: "شخص يكتب ويحدث مدونة"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد، لكن يمكن صياغته بأسلوب معجمي أدق يعكس إدارة المحتوى وتحديثه."
    authored:
      - type: terminological
        text: "شخصٌ يديرُ مُدَوَّنَةً إلكترونيَّةً، يكتُبُ فيها ويُحَدِّثُ مُحتواها بانتظامٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09879821-n"
          definition_index: 0
          text: "شخصٌ يديرُ مُدَوَّنَةً إلكترونيَّةً، يكتُبُ فيها ويُحَدِّثُ مُحتواها بانتظامٍ."

  examples:
    per_lemma:
      - lemma: "مُدَوِّن"
        examples:
          - text: "أصبحَ المُدَوِّنُ مَصدراً مُهِمّاً للأخبارِ والآراءِ في العصرِ الرَّقميّ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-09879821-n"
          text: "أصبحَ المُدَوِّنُ مَصدراً مُهِمّاً للأخبارِ والآراءِ في العصرِ الرَّقميّ."

