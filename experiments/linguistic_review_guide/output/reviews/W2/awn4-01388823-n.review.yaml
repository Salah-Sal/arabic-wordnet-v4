      step05_citation: "«الطرف المستفيد من المطاعمة (ولا فائدة ولا أذى للطرف الآخر)، وهي تعايش أنواع في ارتباط وثيق، في نفس الجحر أو الموقع مثلا، دون تأثير المتبادل، أي تعايش دون تكافلية.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      substitution_test:
