      nuance_differentiation: "يُركز على الكائن كطرف فاعل يعيش بجوار آخر، وكثيراً ما يُستعمل مقابلاً لـ commensal بتمييزه عن التكافل."
      example: "طائر مالك الحزين يُعتبر مُعايِشاً للماشية حيث يتغذى على الحشرات التي تثيرها حركتها."
