step3_definition:
  definition_review_flag: true
  current_definition: "أي من نوعين مختلفين من الحيوانات أو النباتات يعيشان في ارتباط وثيق ولكنهما غير مترابطين"
  assessment:
    decision: revise
    reason: "التعريف الحالي ذو صياغة ركيكة وترجمة حرفية ('غير مترابطين' لا تعكس بدقة معنى commensalism الذي يعني استفادة أحدهما دون إضرار الآخر). تمت إعادة صياغته ليكون أكثر دقة علمياً ولغوياً."
  authored_definitions:
    - type: terminological
      text: "كائن حي، من حيوان أو نبات، يعيش في ارتباط وثيق مع كائن آخر من نوع مختلف، دون أن يعتمد أحدهما على الآخر اعتماداً عضوياً أو تكافلياً."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-01388823-n"
        definition_index: 0
        text: "كائن حي، من حيوان أو نبات، يعيش في ارتباط وثيق مع كائن آخر من نوع مختلف، دون أن يعتمد أحدهما على الآخر اعتماداً عضوياً أو تكافلياً."

