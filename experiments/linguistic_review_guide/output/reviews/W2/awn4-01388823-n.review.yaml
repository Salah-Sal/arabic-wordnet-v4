step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُعايِش"
      source_section: "step5_english_bridge"
      evidence_citation: "«الطرف المستفيد من المطاعمة (ولا فائدة ولا أذى للطرف الآخر)، وهي تعايش أنواع في ارتباط وثيق، في نفس الجحر أو الموقع مثلا، دون تأثير المتبادل، أي تعايش دون تكافلية.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      justification: "مصطلح دقيق يفيد الكائن الذي يشارك آخر في المعيشة دون أن يضره، ويقابل commensal في الاستعمال البيئي."
    - lemma: "مُطاعِم"
      source_section: "step5_english_bridge"
      evidence_citation: "«مُطاعِم» — المعجم الطبي الموحد (2009) يقابل commensal"
      justification: "مشتق من المطاعمة (commensalism)، وهو من طعم أي أكل، ليدل على المؤاكلة والمشاركة في الغذاء دون ضرر."

