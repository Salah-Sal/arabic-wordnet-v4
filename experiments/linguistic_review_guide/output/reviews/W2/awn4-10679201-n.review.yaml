# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10679201-n (stooper)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مُنْحَنِي الظَّهْر» تعبير وصفي إضافي وليس مصطلحاً مسكوكاً مفرداً، لكنه مقبول بوصفه وحدة معجمية ثابتة"
      - "التعريف العربي ترجمة حرفية من الإنجليزية (يحمل نفسه) وليس بأسلوب المعاجم العربية"
      - "العلاقة الفوقية (عامل/فاعل) غير دقيقة؛ المُنحَنِي الظَّهْر ليس بالضرورة عاملاً بل هو شخص ذو هيئة جسدية مميزة"
    observations: "المفهوم يصف شخصاً يتّسم بانحناء مُعتاد في الظَّهر والكتفَيْن والرأس إلى الأمام، وهو وصف لهيئة جسدية دائمة لا لعلّة مرضية بالضرورة. في العربية يُفرَّق بين الأَحْدَب (الذي خرج ظهره وارتفع حتى صار ذا حَدَبة) والمُنْحَنِي الظَّهْر (الذي في ظهره انحناء دون نتوء بالضرورة). المجال الدلالي يتداخل مع ألفاظ من جذور: ح-د-ب، ح-ن-و/ي، ق-و-س، ط-أ-ط-أ."

  blind_candidates:
    - lemma: "أَحْدَب"
      generation_method: ishtiqaq
      justification: "صفة مشبَّهة على وزن أَفْعَل من جذر ح-د-ب، تدلّ على من خرج ظهره وارتفع عن الاستواء. أشهر لفظ عربي لوصف المنحني الظهر."
    - lemma: "مُحْدَوْدِب"
      generation_method: ishtiqaq
      justification: "اسم فاعل من احْدَوْدَبَ (افعوعل)، يدلّ على حدوث الاحديداب. أقرب إلى الوصف الحالي منه إلى العلّة الخلقية."
    - lemma: "مُطَأْطِئ الرَّأْس"
      generation_method: tarkib
      justification: "مركّب إضافي من اسم الفاعل مُطَأْطِئ والمضاف إليه الرَّأْس، يصف من يحني رأسه إلى الأمام عادةً."
    - lemma: "مُنْكَبّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من انْكَبَّ (انفعل من كبَّ)، أي مال إلى الأمام وأكبَّ على وجهه. يدلّ على الانحناء الأمامي للجسم."


stage2_evidence:
  per_lemma:
    - lemma: "مُنْحَنِي الظَّهْر"
      confirm:
        - text: "«(1) ينحني (2) يَحْدَوْدِب (3) يَخْضع؛ يستسلم ... (8) يطأطئ رأسه؛ يحني كتفَيْه (9) انحناء (10) احديداب»"
          source: "المورد الحديث (2008) — مادة stoop"
        - text: "«أحدب؛ مُحْدَوْدِب الظهر.»"
          source: "المورد الحديث (2008) — مادة crookbacked"
      expands:
        - text: "«منحنى الوادي أو الطريق؛ منعطفه»"
          source: "المعجم الوسيط"
          addition: "المُنْحَنَى في الوسيط اسم مكان لا صفة للشخص، مما يؤكد أن التركيب «مُنْحَنِي الظَّهْر» وحدة معجمية مستقلة لا يُستغنى عن المضاف إليه فيها"
        - text: "«حَنَوْتُ الشَّيْءَ حَنْوًا وَحَنَيْتُهُ، إِذَا عَطَفْتَهُ ... وَنَاقَةٌ حَنْوَاءُ: فِي ظَهْرِهَا احْدِيدَابٌ. وَانْحَنَى الشَّيْءُ يَنْحَنِي انْحِنَاءً»"
          source: "مقاييس اللغة لابن فارس — مادة حنو"
          addition: "الجذر ح-ن-و يدلّ على التعطُّف والتعوُّج، وانحنى فعل لازم صريح في الدلالة على الانعطاف"

    - lemma: "أَحْدَب"
      confirm:
        - text: "«الأحدب: الذي خرج ظهره وارتفع عن الاستواء»"
          source: "المعجم الكبير"
        - text: "«حَدِبَ الشَّخصُ: تقوّس عمودُه الفقاريّ إلى الخلف فصار ذا حَدَبة»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«أَحْدَب = hunchbacked»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«1- من تقوس ظهره فانحنى إلى الأمام وظهرت على ظهره حُدْبة (kyphos)»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: "الأحدب يستلزم وجود حَدَبة (نتوء ظاهر في الظهر)، بينما المجموعة تصف مجرد انحناء مُعتاد دون نتوء بالضرورة"
      expands:
        - text: "«الحَدَبُ: خروجُ الظَّهْرِ ودخولُ الصَّدْرِ والبَطْنِ، بخلافِ القَعَسِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الحدب نقيض القعس (دخول الظهر وخروج الصدر)"

    - lemma: "مُحْدَوْدِب"
      confirm:
        - text: "«أحدب؛ مُحْدَوْدِب الظهر.»"
          source: "المورد الحديث (2008) — مادة crookbacked"
        - text: "«(1) يَحْدَوْدب (2) يُحَدِّب [قليلًا] (3) الاحديداب: تقوُّس الطريق أو ظهرِ السفينة»"
          source: "المورد الحديث (2008) — مادة camber"
      expands:
        - text: "«حَدِبَ وَاحْدَوْدَبَ وَتَحَادَبَ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "احدودب (افعوعل) صيغة مبالغة تدلّ على تمام الحدوث، وهي أقوى من حَدِبَ"

    - lemma: "مُطَأْطِئ الرَّأْس"
      expands:
        - text: "«(8) يطأطئ رأسه؛ يحني كتفَيْه»"
          source: "المورد الحديث (2008) — مادة stoop"
          addition: "التطأطؤ جزء من فعل الانحناء لكنه يخصّ الرأس فقط"

    - lemma: "مُنْكَبّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "مُنْحَنِي الظَّهْر"
      decision: confirmed
      decision_reason: "تعبير إضافي ثابت يصف بدقة الشخص المنحني ظهره دون استلزام وجود حَدَبة أو علّة مرضية. يتوافق مع المفهوم المقصود (الانحناء المعتاد) ويميّزه عن الأحدب (العلّة الخلقية). ثابت في الاستعمال المعاصر ومُتّسق مع جذر ح-ن-و الدال على التعطّف والانعطاف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدلّ على انحناء مُعتاد في الظهر دون اشتراط وجود نتوء أو علّة عضوية، فهو أعمّ من الأحدب وأخصّ من المُنْحَنِي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْحَنِي الظَّهْر"

    - lemma: "أَحْدَب"
      source: stage1
      decision: removed
      decision_reason: "الأحدب في المعاجم العربية يستلزم وجود حَدَبة (نتوء ظاهر في الظهر) وهو حالة مرضية (kyphosis)، بينما المجموعة تصف مجرد الانحناء المعتاد في الوقفة والمشي. إضافته تُحدث خلطاً بين الوصف الهيئي والتشخيص الطبي."
      evidence_assessment:
        case: mixed

    - lemma: "مُحْدَوْدِب"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «محدودب الظهر» في المورد الحديث مقابل crookbacked، فإن الاحديداب في المعاجم الكلاسيكية صيغة مبالغة من الحدب تدلّ على تمام التقوّس، وهي أقرب إلى الحالة المرضية منها إلى الهيئة المعتادة."
      evidence_assessment:
        case: mixed

    - lemma: "مُطَأْطِئ الرَّأْس"
      source: stage1
      decision: removed
      decision_reason: "التعبير يقتصر على خفض الرأس ولا يشمل انحناء الظهر والكتفين الذي هو جوهر المفهوم. فضلاً عن ذلك، التطأطؤ قد يكون فعلاً إرادياً مؤقتاً لا سمةً معتادة."
      evidence_assessment:
        case: no_material

    - lemma: "مُنْكَبّ"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر على شواهد معجمية تدعم استخدام «مُنكَبّ» بمعنى المنحني الظهر. الفعل انكبَّ يدلّ على السقوط على الوجه أو الإقبال على شيء (انكبَّ على عمله)، لا على هيئة الوقوف."
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "شخص يحمل نفسه ورأسه وكتفاه منحنيان للأمام عادة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية (يحمل نفسه = carries himself)، وتركيبه النحوي مضطرب (ورأسه وكتفاه منحنيان — حال مرفوعة لا منصوبة). يحتاج إعادة صياغة بأسلوب المعجم العربي."
    authored:
      - type: terminological
        text: "شَخْصٌ يَتَّسِمُ بِانْحِنَاءٍ دَائِمٍ فِي ظَهْرِهِ وَكَتِفَيْهِ وَرَأْسِهِ إِلَى الْأَمَامِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَنْ أَلِفَ الانْحِنَاءَ فِي مِشْيَتِهِ وَوِقْفَتِهِ حَتَّى صَارَ ذَلِكَ سَجِيَّتَهُ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَتَّسِمُ بِانْحِنَاءٍ دَائِمٍ فِي ظَهْرِهِ وَكَتِفَيْهِ وَرَأْسِهِ إِلَى الْأَمَامِ"

  examples:
    per_lemma:
      - lemma: "مُنْحَنِي الظَّهْر"
        examples:
          - text: "كَانَ الرَّجُلُ الْعَجُوزُ مُنْحَنِيَ الظَّهْرِ يَتَوَكَّأُ عَلَى عَصَاهُ وَهُوَ يَجُوبُ أَزِقَّةَ الْمَدِينَةِ الْقَدِيمَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "كَانَ الرَّجُلُ الْعَجُوزُ مُنْحَنِيَ الظَّهْرِ يَتَوَكَّأُ عَلَى عَصَاهُ وَهُوَ يَجُوبُ أَزِقَّةَ الْمَدِينَةِ الْقَدِيمَةِ."


