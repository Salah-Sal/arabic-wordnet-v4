# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-05151326-n  |  ILI: i64018  |  POS: n
# English: bad / badness
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمتان 'رداءة' و'سوء' خاليتان من التشكيل الكامل، مما يُفضي إلى التباس في القراءة والضبط الصرفي"
      - "لفظ 'سوء' مشترك لفظي بالغ الاتساع، يشمل معاني القبح والشر والهلاك والبلاء والبرص والجنون، وهذا التشعّب يجعله أوسع من نطاق المجموعة المحدد بالانحطاط الأخلاقي واللياقة"
      - "تعريف المجموعة 'ما هو دون المستوى أو التوقعات' مصوغ بأسلوب ترجمة مباشرة من الإنجليزية ويفتقر إلى الجنس القريب والفصل النوعي بالأسلوب المعجمي الكلاسيكي"
      - "الجذر المعجمي لكلتا اللمتين غير مذكور في بيانات المجموعة"
    observations: >-
      المجموعة تُمثِّل مفهوماً عربياً أصيلاً له وفرة معجمية وتراثية كبيرة. اللمتان الموجودتان
      'رداءة' و'سوء' تُغطِّيان المفهوم من زاويتين مختلفتين: 'رداءة' تُركِّز على نقص الجودة
      النوعية في الطبع والسلوك (مصدر ردُؤَ)، بينما 'سوء' يحمل البُعد الأخلاقي والديني
      العميق المرتبط بالقبح والشر (راسخ في القرآن والحديث). المجموعة الفائقة 'جودة ونوعية'
      تُشير إلى أن المفهوم المُراد هو الصفة الجوهرية لا الحدث أو الفعل. التعريف الحالي قابل
      للتحسين ليعكس هذا البُعد الوصفي بدقة أكبر.
  blind_candidates:
    - lemma: "الدَّنَاءَةُ"
      generation_method: ishtiqaq
      justification: >-
        من جذر دنأ على وزن فَعَالة الدال على الصفة المجردة؛ تعني انحطاط المروءة ووضاعة
        الخُلُق. اللفظ يُعبِّر تحديداً عن كون الشخص أو السلوك دون المستوى الأخلاقي المرتقب
        مما يناسب تعريف المجموعة.
    - lemma: "الخَسَاسَةُ"
      generation_method: ishtiqaq
      justification: >-
        من جذر خسس على وزن فَعَالة؛ تعني الحالة التي يكون عليها الخسيس، أي من انحطَّ عن
        مستوى أقرانه في الكرامة والأخلاق. الوزن الصرفي يناسب الصفة المجردة كما في 'جودة'
        و'رداءة'.
    - lemma: "الرَّذَالَةُ"
      generation_method: ishtiqaq
      justification: >-
        من جذر رذل على وزن فَعَالة؛ الرذيل نقيض الفاضل، فالرذالة وصفٌ لكون الشيء أو السلوك
        في درجة الرذل أي دون المستوى الفاضل المطلوب من الأخلاق واللياقة.
    - lemma: "القُبْحُ"
      generation_method: ishtiqaq
      justification: >-
        من جذر قبح على وزن فُعْل للمصادر الدالة على الصفة؛ نقيض الحسن عامٌّ في كل شيء
        ويشمل القبح الأخلاقي. وقد صنَّف ابن فارس في مقاييس اللغة 'السوء' ضمن 'باب القبح'
        مما يُدل على تداخل الدلالتين.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "رَدَاءَة"
      confirm:
        - text: "«رَداءة [مفرد]: مصدر ردُؤَ ° رداءةُ الطَّبع: فسادُه - رداءةُ الملبس: قبحُه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«(1) رداءة [في النوع] (2) حَقارة؛ خِسّة (3) تفاهة (4) ضَآلة»"
          source: "المورد الحديث (2008)"
        - text: "«سوء الشهرة؛ رداءة السُّمعة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الرِّدَاءَةُ: مِلْحَفَةٌ تُلْبَسُ، كالرِّداءِ»"
          source: "المعجم الكبير"
          addition: >-
            هذا المدخل يعود إلى رِداءة (بكسر الراء، من رِداء = ثوب) لا إلى رَداءة (بفتح الراء،
            من رديء = ذو نقص وقبح)؛ الاشتراك اللفظي بين الصورتين يستوجب التشكيل الكامل
            تمييزاً للمراد.

    - lemma: "سُوء"
      confirm:
        - text: "«السُّوءُ: القُبْحُ، أو كُلُّ ما يَقْبُحُ، وقيل: الإثمُ والذنبُ، كُلُّ ما يَغُمُّ الإنسانَ، اسمٌ جامعٌ للآفاتِ والدَّاءِ»"
          source: "المعجم الكبير"
        - text: "«السُّوء: كل ما يغمُّ الإنسان، كلُّ ما يقبُح، اسمٌ جامع للآفات، يُكنى به عن البرص»"
          source: "المعجم الوسيط"
        - text: "«فَأَمَّا السِّينُ وَالْوَاوُ وَالْهَمْزَةُ فَلَيْسَتْ مِنْ ذَلِكَ، إِنَّمَا هِيَ مِنْ بَابِ الْقُبْحِ. تَقُولُ رَجُلٌ أَسْوَأُ، أَيْ قَبِيحٌ، وَامْرَأَةٌ سَوْآءُ، أَيْ قَبِيحَةٌ. وَلِذَلِكَ سُمِّيَتِ السَّيِّئَةُ سَيِّئَةً. وَسُمِّيَتِ النَّارُ سُوأَى، لِقُبْحِ مَنْظَرِهَا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«السوء: كل ما يغم الإنسان من الأمور الدنيوية والأخروية، ومن الأحوال النفسية والبدنية والخارجية من فوت مال وفقد حميم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«سُوء نعت لكل شيء رديء، اسم جامع للآفات والداء»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
      expands:
        - text: "«(السُّوءُ) يُقال في القُبح: رجلُ سوء وعمل سوء. واسمٌ جامعٌ للآفات ويُكنى به عن البرص»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
          addition: >-
            استخدام سوء بمعنى القبح الأخلاقي راسخٌ في الاستخدام القرآني (﴿إِنَّمَا يَأْمُرُكُم
            بِالسُّوءِ وَالْفَحْشَاءِ﴾)؛ وهو ما يدعم إدراجه في مجموعة الانحطاط الأخلاقي
        - text: "«القُبح والإثم والذنب والهلاك والفساد والشر والبلاء والعذاب والردى والفجور والمنكر والبرص والجنون والخوف والضرر وسوء الحال»"
          source: "المعجم الكبير (تعداد معاني السوء)"
          addition: >-
            تشعُّب معاني سوء يستوجب تقييد الاستخدام بالسياق؛ المعنى الملائم للمجموعة هو
            'القبح الأخلاقي وكل ما يقبح من الطباع والأفعال' وهو المعنى الأول المذكور في أكثر
            المعاجم.

    - lemma: "الدَّنَاءَةُ"
      evidence_status: "no_material_found"

    - lemma: "الخَسَاسَةُ"
      confirm:
        - text: "«الخَسَاسَةُ: الحالةُ التى يكونُ عليها الخَسِيسُ»"
          source: "المعجم الكبير"
        - text: "«الخَسَّاسَةُ: الحالةُ يكونُ عليها الخَسيسُ»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الخُسَاسَةُ: القليلُ من المال، عُلالَةُ الفَرسِ وهى ما يكونُ من جَرْيِه بعد جَرْيِه الأوَّل»"
          source: "المعجم الكبير"
          conflict: >-
            الضمُّ في خُساسة يُغيِّر المعنى جذرياً إلى 'القليل من المال' لا الصفة الأخلاقية؛
            وجود الصورتين (خَساسة/خُساسة) يُنشئ خطر اشتباه لا يُعين عليه سياق الاستخدام
            المجرد من التشكيل.

    - lemma: "الرَّذَالَةُ"
      confirm:
        - text: "«الرُّذَالَةُ: الرُّذَالُ»"
          source: "المعجم الكبير"
      expands:
        - text: "«(الرذالة): الرذال»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
          addition: "تعريف دائري بالإحالة إلى 'الرذال' دون توضيح الدلالة المجردة"

    - lemma: "القُبْحُ"
      confirm:
        - text: "«القُبْحُ: نقيضُ الحُسنِ، عامٌّ في كل شيء»"
          source: "كتاب العين"
        - text: "«قَبُحَ الشيءُ قُبْحاً وقَباحةً: ضدَّ حَسُنَ»"
          source: "المعجم الوسيط"
        - text: "«القَبِيحُ: ما يَنبُو عنه البَصَرُ من الأعيان، وما تَنبُو عنه النَّفسُ من الأعمالِ والأحوالِ»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«كلمةٌ واحدة تدلُّ على خلاف الحسن وهو القبح»"
          source: "مقاييس اللغة (OCR)"
        - text: "«القُبح: ما نفَّر الذوقَ السَّوِيَّ، ويكون في القول والفعل والصورة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«القُبْحُ: ضِدُّ الْحُسْنِ»"
          source: "مختار الصحاح للرازي"
          addition: >-
            القبح أشمل من نطاق هذه المجموعة إذ يتناول الجانب الجمالي الحسي ('ما ينبو عنه البصر')
            فضلاً عن الأخلاقي؛ وقد صنَّف ابن فارس السوء ضمن 'باب القبح' لا العكس


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "رداءة"
      decision: confirmed
      decision_reason: >-
        اللفظ موثَّق في معجم اللغة العربية المعاصرة ومعاجم مصطلحات عديدة كمصدر من ردُؤَ
        الدال على كون الشيء دون المستوى في طبعه أو جودته. التعريف 'رداءةُ الطَّبع: فسادُه'
        يتطابق مع دلالة المجموعة. الجذر ردأ والوزن فَعَالة مناسبان تمام المناسبة للصفة
        المجردة. والمدخل في المعجم الكبير (الرِّداءة بكسر الراء بمعنى الثوب) هو لفظ مختلف
        جذرياً لا يُعارض استخدامنا المقصود (رَداءة بفتح الراء من رديء).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُركِّز على نقص الجودة والمستوى في الطبع أو السلوك من الناحية النوعية (كيف الشيء لا
        ماهيته)؛ وهو أعمُّ من سوء إذ يطال مختلف مجالات الانحطاط عن المستوى المطلوب دون أن
        يقتصر على البعد الأخلاقي الديني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَدَاءَة"

    - lemma: "سوء"
      decision: confirmed
      decision_reason: >-
        اللفظ تراثي عريق موثَّق في كبرى المعاجم العربية القديمة والحديثة بمعنى 'القبح وكل ما
        يقبح' و'الشر والفساد الأخلاقي'، وهو راسخٌ في الاستخدام القرآني والحديثي. صنَّفه ابن
        فارس في مقاييس اللغة ضمن 'باب القبح'، وورد في القرآن الكريم بمعنى الفجور والمنكر
        (﴿إِنَّمَا يَأْمُرُكُم بِالسُّوءِ وَالْفَحْشَاءِ﴾). رغم اتساع دلالاته، فإن المعنى الأقرب
        للمجموعة (القبح الأخلاقي والانحطاط الخُلُقي) موثَّق بوفرة ويمثِّل المعنى الأول في
        أغلب المعاجم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يحمل بُعداً أخلاقياً وشرياً أكثر تحديداً وعمقاً من رداءة، مع إيحاءات دينية تراثية
        راسخة (الذنب، الإثم، الفجور، المنكر). يُستخدم عادةً للدلالة على الطبع الفاسد
        والسلوك المذموم الذي يُغمُّ الإنسانَ أو يقبُح في عُرف الشرع والمجتمع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُوء"

    - lemma: "الدَّنَاءَةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على مدخل معجمي مستقل لـ'دناءة' في قاعدة البيانات المعجمية رغم ورودها في
        سياقات ترجمية في المورد الحديث ومعجم المصطلحات. غياب التوثيق المعجمي الكلاسيكي
        المستقل يُضعف الحجة لإدراجها، فضلاً عن أن دلالتها تنحو نحو الانحطاط الاجتماعي
        والمادي (الحقارة والخسة) أكثر مما تُعبِّر بدقة عن 'الانحطاط عن معايير الأخلاق
        واللياقة' كمفهوم جوهري.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "الخَسَاسَةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم توثيقها في المعجم الوسيط والمعجم الكبير بمعنى 'الحالة التي يكون عليها الخسيس'،
        فإن التباساً صرفياً حاسماً يعتري اللفظ: خَساسة (بالفتح) للصفة الأخلاقية، وخُساسة
        (بالضم) لـ'القليل من المال وعُلالة الفرس'. هذا الاشتباه يُنشئ خطر سوء الفهم. يُضاف إلى
        ذلك أن دلالة 'الخسيس' تنحو نحو الانحطاط الاجتماعي والمادي أكثر مما تخصُّ الانحطاط
        الأخلاقي المحدد في تعريف المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "الرَّذَالَةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        التعريف المعجمي دائري في المعجم الكبير والمعجم الوسيط، لا يتجاوز الإحالة إلى 'الرذال'
        دون توضيح الدلالة المجردة. غياب تعريف مستقل واضح يُضعف قيمة اللفظ كمدخل مستقل في
        المجموعة الترادفية. اللفظ الأصل 'رذيلة' (ضد الفضيلة) أكثر شيوعاً واستخداماً في السياق
        الأخلاقي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "القُبْحُ"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم توثيق القبح الوافر في عامة المعاجم بوصفه نقيض الحسن، فإن دلالته الأولى والأشيع
        جمالية/حسية ('ما ينبو عنه البصر'، نقيض الحُسن في الصورة والشكل) قبل أن تكون
        أخلاقية. إدراجه في مجموعة تختص بالانحطاط الأخلاقي واللياقة سيُوسِّع نطاقها بما
        يتجاوز المفهوم الإنجليزي 'badness'. بوصفه مصدراً قياسياً، فإن 'قُبْح' بمعنى
        الانحطاط الأخلاقي أمر مستفاد بالتضمين لا بالوضع الأصلي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "ما هو دون المستوى أو التوقعات من حيث الأخلاق أو اللياقة"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مصوغٌ بأسلوب الترجمة المباشرة من الإنجليزية؛ لفظة 'ما هو' عامية
        المنحى وغير معجمية، وكلمة 'التوقعات' حديثة المدلول ولا تُناسب الأسلوب المعجمي الفصيح.
        يفتقر التعريف إلى الجنس القريب (صفة/حال/خاصية) والفصل النوعي الذي يُميِّزه عن
        مفاهيم قريبة كالشر والقبح والضعة. كما أن المجموعة الفائقة 'جودة ونوعية' تُلمِح إلى
        أن المفهوم صفةٌ جوهرية ينبغي أن يُعكسها التعريف.
    authored:
      - type: terminological
        text: "صِفَةٌ سَلبِيَّةٌ جَوْهَرِيَّةٌ، يَكُونُ بِهَا الشَّيءُ أو السُّلوكُ مُنحَطًّا عَنِ المُسْتَوى المَقبُولِ مِنَ الأَخلاقِ وَاللِّيَاقَةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "الانحِطَاطُ عَنْ مَعَايِيرِ الفَضِيلَةِ وَحُسنِ السُّلوكِ في الأَخلاقِ وَالمُعَامَلَةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
