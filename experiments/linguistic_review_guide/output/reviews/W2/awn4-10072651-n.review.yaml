    - lemma: "حَسَّاس"
      source_section: "step4_fts_keyword"
      evidence_citation: "«هو حَسَّاسٌ لكذا: سريعُ الانفعالِ» — المعجم الكبير"
      justification: "اشتقاق على وزن (فَعَّال) للمبالغة، ويدل معجمياً على سرعة الانفعال وقوة التأثر، وهو يطابق معنى الشخص الانفعالي."
  knowledge_candidates:
    - lemma: "عَاطِفِيّ"
      justification: "اشتقاق (نسبة إلى عاطفة). لفظ مفرد مستقر في الاستعمال لوصف الشخص الذي تغلب عليه العواطف وتتحكم في تصرفاته بدلاً من العقل."
    - lemma: "انْفِعَالِيّ"
      justification: "اشتقاق (نسبة إلى انفعال). مصطلح نفسي وشائع لوصف الشخص الذي يخضع لحالات عاطفية قوية ويستجيب بسرعة للمؤثرات."
  generation_notes: "مركبات المجموعة الأصلية (شخص عاطفي، إنسان انفعالي) هي مركبات وصفية حرة غير مسكوكة، والأصح الاكتفاء بالصفات المفردة التي تقوم مقام الموصوف في الاستعمال العربي (باعتبارها صفة لموصوف محذوف أو اسماً مستقلاً)."

