stage1_review:
  assessment:
    concerns:
      - "لا توجد مشكلات واضحة في المجموعة، المصطلحان الموجودان (تثبيط وكبح) دقيقان جداً ويمثلان المفهوم الفسيولوجي المتمثل في الإعاقة العصبية."
    observations: "المفهوم يشير إلى (Inhibition) في علم وظائف الأعضاء. المصطلحان «تثبيط» و«كبح» هما الأكثر استخداماً في المعاجم الطبية والعلمية للتعبير عن هذا المفهوم بدقة."
  blind_candidates:
    - lemma: "تَثْبِيط"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ثبط) الذي يفيد التعويق والتأخير، وهو في الوزن القياسي (تفعيل) الدال على إحداث الفعل، ومناسب جداً للمفهوم الطبي."
    - lemma: "كَبْح"
      generation_method: majaz
      justification: "استعارة من كبح الدابة أي جذب لجامها لتتوقف، واستخدم مجازاً في العلم للدلالة على إيقاف النشاط الحيوي أو العصبي."
    - lemma: "إِعَاقَة"
      generation_method: ishtiqaq
      justification: "مشتق من العوق وهو المنع والتعطيل، ويصلح لوصف تأخير عمل العضو."
    - lemma: "مَنْع"
      generation_method: ishtiqaq
      justification: "مصدر مباشر يعبر عن إيقاف العمل أو الحيلولة دون استمراره، وهو وارد في نص التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "تثبيط"
      confirm:
        - text: "تَثْبيط: inhibition"
          source: "المعجم الطبي الموحد (2009)"
        - text: "تثبيط: (حي) إبطاء عملية حيويَّة من عمليات الجسم أو إيقافها."
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "كبح"
      confirm:
        - text: "كبح: «ج» كبح لعمل عضو من أعضاء الجسم أو أنزيمة من الأنزيمات. (inhibition)"
          source: "المورد الحديث (2008)"
        - text: "كَبَحْتُ الدابَّة، إذا جذبتَها إليك باللجام لكي تقفَ ولا تجرى."
          source: "تاج اللغة وصِحاح العربية للجوهري"
    - lemma: "إعاقة"
      evidence_status: "no_material_found"
    - lemma: "منع"
      confirm:
        - text: "المَنْعُ: أَن تَحُولَ بين الرجل وبين الشيء الذي يريده، وهو خلافُ الإِعْطاءِ."
          source: "لسان العرب لابن منظور"

stage3_analysis:
  per_lemma:
    - lemma: "تثبيط"
      decision: confirmed
      decision_reason: "مصطلح فسيولوجي وطبي دقيق وشائع للتعبير عن إبطاء العمليات الحيوية أو العصبية، وهو يطابق تماماً المفهوم الإنجليزي (inhibition)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَثْبِيط"
    - lemma: "كبح"
      decision: confirmed
      decision_reason: "مصطلح معتمد في القواميس الحديثة للإشارة إلى الإيقاف العصبي أو الإنزيمي، بدلالة مجازية قوية مستعارة من كبح الدابة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَبْح"
    - lemma: "إِعَاقَة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح عام يدل على العرقلة الفيزيائية أو الحركية، ولا يختص فسيولوجياً بفعل الأعصاب كالتثبيط."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "مَنْع"
      source: stage1
      decision: removed
      decision_reason: "مصطلح شديد العمومية يشمل أي حيلولة دون وقوع شيء، ولا يعكس الدلالة الفسيولوجية العصبية المتخصصة في المفهوم."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "(علم وظائف الأعضاء) العملية التي يمكن للأعصاب من خلالها تأخير أو منع عمل عضو أو جزء"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يبدأ بتصنيف المجال بين قوسين، والأفضل صياغة تعريف مصطلحي متصل وبلغة معجمية سليمة."
    authored:
      - type: terminological
        text: "عملية فسيولوجية تقوم فيها الأعصاب بتأخير وظيفة عضو أو جزء من الجسم أو منعها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13521417-n"
          definition_index: 0
          text: "عملية فسيولوجية تقوم فيها الأعصاب بتأخير وظيفة عضو أو جزء من الجسم أو منعها."
  examples:
    per_lemma:
      - lemma: "تَثْبِيط"
        examples:
          - text: "يؤدي تثبيط العصب المبهم إلى زيادة سرعة نبضات القلب."
            type: usage
      - lemma: "كَبْح"
        examples:
          - text: "يقوم الجهاز العصبي بكبح النشاط الزائد للخلايا."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-13521417-n"
          text: "يؤدي تثبيط العصب المبهم إلى زيادة سرعة نبضات القلب."
      - command: add_synset_example
        params:
          synset_id: "awn4-13521417-n"
          text: "يقوم الجهاز العصبي بكبح النشاط الزائد للخلايا."

