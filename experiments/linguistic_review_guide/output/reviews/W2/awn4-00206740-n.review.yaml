stage4_content:
  definition:
    text: "فِعْلُ خُسْرَانِ المَرْءِ حَقَّهُ أَوْ مَالَهُ أَوْ تَنْحِيَتُهُ عَنْ مَنْصِبِهِ عُقُوبَةً لَهُ عَلَى خَطَأٍ اقْتَرَفَهُ أَوْ تَقْصِيرٍ فِي أَدَاءِ وَاجِبٍ."
    type: terminological
    decision: revise
  examples:
    - lemma: "مُصَادَرَةٌ"
      text: "قَرَّرَتِ المَحْكَمَةُ مُصَادَرَةَ مُمْتَلَكَاتِ المُتَّهَمِ لِتَعْوِيضِ الضَّحَايَا."
      type: usage
    - lemma: "تَضْحِيَةٌ"
      text: "قَدَّمَ البَطَلُ أَعْظَمَ تَضْحِيَةٍ في سَبِيلِ وَطَنِهِ."
      type: usage
    - lemma: "خُسْرَانٌ"
      text: "أَدَّى الإِهْمَالُ إلى خُسْرَانِ الشَّرِكَةِ لِحَقِّ الامْتِيَازِ."
      type: usage

