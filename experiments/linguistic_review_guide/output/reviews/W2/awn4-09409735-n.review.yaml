stage1_review:
  assessment:
    concerns:
      - "اللفظ 'مَمَرّ' فضفاض جداً، إذ يطلق على الممرات المعمارية والبحرية، ولا يختص بالتضاريس الجبلية."
      - "افتقار المجموعة الترادفية إلى المصطلحات العربية التراثية الدقيقة والموجزة التي تعبّر عن هذا المفهوم الجغرافي النوعي."
    observations: "المجموعة الحالية تعتمد على التعابير الوصفية المعاصرة (ممر جبلي) وتغفل الثراء المعجمي العربي في وصف المسالك الجبلية مثل (الفج) و(الثنية) و(النقب)، وهي ألفاظ فصيحة ومستخدمة جغرافياً وتاريخياً."
  blind_candidates:
    - lemma: "فَجّ"
      generation_method: majaz
      justification: "لفظ تراثي قرآني يعبّر عن الطريق الواسع والمنفرج بين جبلين."
    - lemma: "ثَنِيَّة"
      generation_method: majaz
      justification: "يُطلق على الطريق الملتوي في الجبل أو الممر الجبلي الضيق، وهو شائع في التراث العربي."
    - lemma: "نَقْب"
      generation_method: majaz
      justification: "يُعبر عن الممر أو الفتحة في الجبل التي تُستخدم كطريق، ومنه أسماء جغرافية مشهورة."
    - lemma: "رَيْع"
      generation_method: majaz
      justification: "يُطلق في الجغرافيا العربية القديمة على الطريق المنفرج في الجبل أو المكان المرتفع المسلوك."

stage2_evidence:
  per_lemma:
    - lemma: "مَمَرّ"
      confirm:
        - text: "«مَمَرّ: (اسم) ج مَمَرّات: اسم مكان من مرَّ/ مرَّ بـ/ مرَّ على: ممرّ ضيِّق: طريق ضيِّق يُنفذ من جهة إلى أخرى.»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مَمَرّ جَبَلِيّ"
      confirm:
        - text: "«نقب: مضيق، معبر. لمنحدرات الجبال.»"
          source: "تكملة المعاجم لدوزي"
          addition: "يشير إلى أن مصطلح 'ممر' أو 'معبر' يستخدم لوصف المنحدرات والمضائق الجبلية."
    - lemma: "فَجّ"
      confirm:
        - text: "«الفَجُّ: الطريقُ الواسعُ بين جَبَلينِ.»"
          source: "القاموس المحيط"
    - lemma: "ثَنِيَّة"
      confirm:
        - text: "«(الثَّنية): الطَّرِيق فِي الْجَبَل.»"
          source: "المعجم الوسيط"
    - lemma: "رَيْع"
      confirm:
        - text: "«الرَّيْعُ: المكانُ الْمُرْتَفِعُ مِنَ الأَرْض... وقيلَ: الجَبَلُ الصَّغِيرُ كلُّ فَجِّ أو طريق... الطَّريقُ المُنْفَرجُ مِنَ الجَبَل.»"
          source: "المعجم الكبير"
    - lemma: "نَقْب"
      confirm:
        - text: "«النَّقْبُ وَالْمَنْقَبَةُ: الطَّرِيقُ فِي الْجَبَلِ.»"
          source: "مقاييس اللغة"
        - text: "«نَقْب: طريق ضيِّق في جبل.»"
          source: "معجم اللغة العربية المعاصرة"

