stage4_content:
  definition:
    current: "موقع في سلسلة جبال لتكوين جيولوجي يكون أقل ارتفاعاً من القمم المحيطة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يغلب عليه الطابع الوصفي الأجنبي، ويحتاج إلى صياغة معجمية عربية تركز على الوظيفة (العبور) والشكل التضاريسي."
    authored:
      - type: terminological
        text: "مَوْضِعٌ فِي سِلْسِلَةٍ جَبَلِيَّةٍ يَكُونُ أَقَلَّ ارْتِفَاعًا مِنَ الْقِمَمِ الْمُحِيطَةِ، يُمَثِّلُ مَنْفَذًا طَبِيعِيًّا أَوْ مَسْلَكًا لِلْعُبُورِ بَيْنَ الْجِبَالِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09409735-n", definition_index: 0, text: "مَوْضِعٌ فِي سِلْسِلَةٍ جَبَلِيَّةٍ يَكُونُ أَقَلَّ ارْتِفَاعًا مِنَ الْقِمَمِ الْمُحِيطَةِ، يُمَثِّلُ مَنْفَذًا طَبِيعِيًّا أَوْ مَسْلَكًا لِلْعُبُورِ بَيْنَ الْجِبَالِ."}

  examples:
    per_lemma:
      - lemma: "مَمَرّ جَبَلِيّ"
        examples:
          - text: "أُغْلِقَ الْمَمَرُّ الْجَبَلِيُّ الْوَاصِلُ بَيْنَ الْقَرْيَتَيْنِ بِسَبَبِ الِانْهِيَارَاتِ الصَّخْرِيَّةِ."
            type: usage
      - lemma: "فَجّ"
        examples:
          - text: "سَلَكَ الْمُسَافِرُونَ فَجًّا عَمِيقًا بَيْنَ جِبَالِ الْأَطْلَسِ لِتَقْصِيرِ مَسَافَةِ الرِّحْلَةِ."
            type: usage
      - lemma: "ثَنِيَّة"
        examples:
          - text: "أَطَلَّتِ الْقَافِلَةُ مِنْ ثَنِيَّةِ الْجَبَلِ عَلَى السَّهْلِ الْمُنْبَسِطِ."
            type: usage
      - lemma: "نَقْب"
        examples:
          - text: "يُعَدُّ نَقْبُ الْعَقَبَةِ مِنْ أَشْهَرِ الْمَسَالِكِ الْجَبَلِيَّةِ الْوَعِرَةِ فِي جَنُوبِ الْأُرْدُنِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-09409735-n", text: "تُعَدُّ الْمَمَرَّاتُ الْجَبَلِيَّةُ مَنَافِذَ اسْتِرَاتِيجِيَّةً لِلتَّجَارَةِ وَتَنَقُّلِ السُّكَّانِ عَبْرَ السَّلَاسِلِ الْوَعِرَةِ."}

