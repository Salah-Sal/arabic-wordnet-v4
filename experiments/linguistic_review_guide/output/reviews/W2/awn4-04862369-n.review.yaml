# ── المرحلة ١: المراجعة والتوليد ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي «صفة كون الشيء مقدساً» دائري: يستخدم «مقدساً» المشتق من الجذر نفسه (ق د س) لتعريف القداسة"
      - "المجموعة تضم لمّة واحدة فقط مقابل ثلاثة معادلات إنجليزية (holiness, sanctity, sanctitude)، مما يعكس فجوةً في التغطية"
    observations: >
      المجموعة تعبّر عن مفهوم القداسة بوصفها صفةً مجردة للطهر والبركة الإلهية.
      جذر المفهوم الأصيل في العربية هو (ق د س)، وقد أثبت ابن فارس في مقاييس اللغة أنه «يدل على الطهر».
      اللمّة الحالية «قَدَاسَة» على وزن فَعَالَة صحيحة قياساً وأقرّها مجمع اللغة المصري،
      غير أن التعريف يحتاج إصلاحاً لإزالة الدوران. ويستدعي إثراء المجموعة
      بلمّة تغطي المعادل sanctity الذي يركّز على الحرمة ورفعة المنزلة الدينية.

  blind_candidates:
    - lemma: "قُدُسِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن فُعُلِيَّة من «قُدُس» (الطهر الإلهي)، يدل على الخاصية المجردة للقداسة؛ يُقال: قُدُسِيَّة المكان"
    - lemma: "تَقَدُّس"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَعُّل من الجذر (ق د س)، يدل على حالة التنزه والطهر الإلهي المرتبط بالذات القدسية"
    - lemma: "طَهَارَة"
      generation_method: majaz
      justification: "إزاحة دلالية من الطهارة الحسية نحو النقاء الروحي؛ مفهوم القداسة في أصول العربية مبني على النقاء والبعد عن الدنس"
    - lemma: "تَبَتُّل"
      generation_method: majaz
      justification: "مصدر تَفَعُّل من (ب ت ل) بمعنى الانقطاع والإخلاص لله، يُزاح دلالياً ليدل على الصفة الروحية العالية المرتبطة بالقداسة"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "قَدَاسَة"
      confirm:
        - text: "«القَدَاسَةُ: الطُّهْرُ والبركة»"
          source: "المعجم الوسيط"
        - text: "«للبيت الحرام قَدَاسَة عظيمة [فصيحة] — التعليق: أقرّ مجمع اللغة المصري ما جاء على فَعَالة دالاًّ على الثبوت والاستمرار من كل فعل ثلاثيّ بتحويله إلى باب فَعُلَ مضموم العين»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«قَداسة.» [ترجمة لـ: holiness]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) قداسة؛ طهارة؛ وَرَع (2) حُرْمة؛ قُدْسيّة sanctity of the temple (3) pl.: مقدَّسات.» [ترجمة لـ: sanctity]"
          source: "المورد الحديث (2008)"
          addition: "تُشير الترجمة إلى أن «قداسة» تغطي معنيَي holiness وsanctity كليهما، وتُوسِّع دلالتها لتشمل الحرمة (inviolability)، والجمع مقدسات يُقرّ كونها اسم جنس قابل للجمع"

    - lemma: "قُدُسِيَّة"
      confirm:
        - text: "«حُرْمة؛ قُدْسيّة sanctity of the temple» [ضمن ترجمة sanctity]"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«قُدُسيّة: من (ق د س) مؤنث قُدْسيّ نسبة إلى قُدُس»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعجم يُعرِّفها باعتبارها مؤنث الصفة النسبية قُدُسيّ (في سياق اسم علم)، لا باعتبارها مصدراً صناعياً دالاً على خاصية القداسة"

    - lemma: "تَقَدُّس"
      contradicts:
        - text: "«(تقدس) تطهر وَالله تنزه فهو متقدس»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
          conflict: "المعجم يُثبته فعلاً لا اسم صفة، فهو مصدر فعلي لا يدل على الصفة الثابتة"
        - text: "«تَقَدَّسَ: تطهَّر — اللهُ: تنزَّه»"
          source: "المعجم الوسيط"
          conflict: "مسجَّل في المعاجم باعتباره فعلاً بالدرجة الأولى، لا اسماً للصفة المجردة"

    - lemma: "طَهَارَة"
      contradicts:
        - text: "«الطَّهَارَة: التطهر بالماء ونحوه والتطهير. والطهارة ضربان: جسمانية ونفسانية»"
          source: "المعجم الوسيط"
          conflict: "الدلالة المعجمية الراسخة هي الطهارة الشرعية الفقهية (الوضوء والغسل)، لا الصفة الروحية الإلهية"
        - text: "«الطَّاءُ وَالهَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى نَقَاءٍ وَزَوَالِ دَنَسٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل اللغوي يدل على النقاء المادي وزوال الدنس، وهو أقرب إلى purity منه إلى holiness"

    - lemma: "تَبَتُّل"
      contradicts:
        - text: "«(تبتل) انقطع وعن الزواج تركه زهداً فيه وإلى الله تفرغ لعبادته»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
          conflict: "التبتل مصدر فعل يدل على السلوك الإرادي (الانقطاع للعبادة)، لا على الصفة الذاتية للقداسة"
        - text: "«الْبَاءُ وَالتَّاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى إِبَانَةِ الشَّيْءِ مِنْ غَيْرِهِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الجذري (الإبانة والانفراد) لا يرتبط بمفهوم القداسة الذاتية"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────
stage3_analysis:
  per_lemma:
    - lemma: "قَدَاسَة"
      decision: confirmed
      decision_reason: >
        لمّة فصيحة مقرَّة معجمياً (المعجم الوسيط: «الطهر والبركة»)
        ومُجازة بإقرار مجمع اللغة المصري وزن فَعَالَة للثبوت والاستمرار.
        المورد الحديث يُترجم holiness مباشرةً بـ«قداسة». الجذر قدس والوزن
        فَعَالَة يناسبان الدلالة على الصفة الثابتة. التشكيل الكامل حاضر.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعم استخداماً وأقدم تداولاً، تدل على الطهر والبركة الإلهية بصفة شاملة؛ هي المصطلح الأساسي المقابل لـholiness"

    - lemma: "قُدُسِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        يُثبتها المورد الحديث في ترجمة sanctity («حُرمة؛ قُدسيّة»)،
        وهي مستخدمة في العربية المعاصرة مصدراً صناعياً على وزن فُعُلِيَّة
        يدل على منزلة القداسة والحرمة (قُدُسِيَّة القدس، قُدُسِيَّة النص).
        ورودها في موسوعة السلطان قابوس اسمَ علمٍ مؤنثاً لا يلغي استخدامها
        الاصطلاحي الواسع في الكتابة الفكرية والإعلامية. تغطي المعادل sanctity
        الذي يفتقر إليه السينست.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على جانب الحرمة ورفعة المنزلة الدينية التي تستوجب التعظيم وتمنع الانتهاك والتدنيس، أقرب دلالةً إلى sanctity"
      actions:
        - command: create_entry
          params: {lemma: "قُدُسِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَقَدُّس"
      source: stage1
      decision: removed
      decision_reason: >
        تَقَدُّس مصدر الفعل تَقَدَّسَ (تطهَّر / تنزَّه)، فهو يدل على الحدث
        والعملية لا على الصفة الثابتة. وزن تَفَعُّل يحمل دلالة التحول
        والانعكاسية لا الوصف الملازم، مما يُناقض طبيعة المجموعة التي تطلب
        «صفة» لا «فعلاً» أو «حدثاً».

    - lemma: "طَهَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        الطهارة في المعاجم دالة راسخة على الطهارة الشرعية الفقهية (الوضوء
        والغسل)، وهي حقل دلالي مستقل مكتفٍ بنفسه. الاشتراك اللفظي الثقيل
        مع معنى النقاء الجسدي يحول دون استخدامها في هذه المجموعة دون إيقاع
        التباس، ومقاييس اللغة تحصرها في «النقاء وزوال الدنس» لا القداسة
        الروحية الإلهية.

    - lemma: "تَبَتُّل"
      source: stage1
      decision: removed
      decision_reason: >
        التبتل يدل على سلوك الانقطاع للعبادة والزهد (فعل إرادي)، لا على
        الصفة الذاتية للقداسة الملازمة للشيء. فضلاً عن أن أصله الجذري
        (إبانة الشيء من غيره) بعيد عن منطقة الدلالة المطلوبة.


