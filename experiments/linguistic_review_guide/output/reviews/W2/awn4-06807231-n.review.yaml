stage2_evidence:
  per_lemma:

    - lemma: "عمود إرشادي"
      evidence_status: "no_material_found"
      # ملاحظة: لم يرد المركب 'عمود إرشادي' كوحدة معجمية في أي من المصادر المستعلَمة
      # (المعجم الوسيط، المعجم الكبير، المصباح المنير، تاج العروس، مقاييس اللغة، ARABTERM)
      # وردت مركبات إرشادية مختلفة في ARABTERM كـ'علامة إرشاد' و'برج إرشاد' و'عوامة إرشاد'
      # لكنها تدل على علامات بحرية وجوية لا على العمود الإرشادي البري

    - lemma: "صُوَّةٌ"
      confirm:
        - text: "«الصُّوَّةُ الْعَلَمُ مِنَ الْحِجَارَةِ الْمَنْصُوبَةِ فِي الطَّرِيقِ وَالْجَمْعُ صُوًى مِثْلُ مُدْيَةٍ وَمُدًى وَأَصْوَاءٌ مِثْلُ رُطَبٍ وَأَرْطَابٍ»"
          source: "المصباح المنير للفيّومي"
        - text: "«حَجَرٌ يكونُ عَلامَةً فِي الطَّريقِ»، «هِيَ الأعْلامُ المَنْصوبَةُ من الحِجارَةِ فِي المَفازَةِ المَجْهولةِ يُسْتَدَلُّ بها عَلَى الطُّرُقِ، أَرادَ أنَّ للإسلامِ طَرائِقَ وأعْلاماً يُهْتَدَى بها»"
          source: "تاج العروس لمرتضى الزبيدي (نقلاً عن ابن الأثير)"
        - text: "«ما غلظ وارتفع من الأرض وما نُصب من الحجارة يستدل بها على الطريق»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "translation_en: signpost — «(1) صُوّة؛ مَعْلَم [في طريق] / (2) يُصَوِّي: يَنْصِبُ الصُّوَى»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الصَّادُ وَالْوَاوُ وَالْيَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شِدَّةٍ وَصَلَابَةٍ وَيُبْسٍ... وَمِنَ الْبَابِ الصُّوَى، وَهِيَ الْأَعْلَامُ مِنَ الْحِجَارَةِ. وَقَوْلُ مَنْ قَالَ: إِنَّهَا مُخْتَلَفُ الرِّيَاحِ، فَالْأَعْلَامُ لَا تَكُونُ إِلَّا كَذَا»"
          source: "مقاييس اللغة لابن فارس (جذر صوي)"
          addition: "يؤكد أصالة الصُّوَى بمعنى الأعلام الحجرية في الطريق، ويربطها بالمنبت الدلالي للصلابة والارتفاع، مما يعزز صحة إحياء هذا اللفظ لمفهوم علامة الطريق"
        - text: "«وَصَوَّى صُوًى فِي الطَّرِيقِ: إِذَا عَمِلَهَا»"
          source: "تاج العروس لمرتضى الزبيدي"
          addition: "وجود الفعل 'صوَّى' يشير إلى اشتقاقية حيّة للجذر؛ كما ورد في الحديث النبوي ذكر الصُّوى معياراً للهداية"

    - lemma: "مِرْشَادٌ"
      evidence_status: "no_material_found"
      # لم يرد هذا الوزن من جذر رشد في أي مصدر مستعلَم
      # الجذر رشد موثق في مقاييس اللغة وله اشتقاقات عديدة (رُشد، رَشاد، إرشاد، مُرشِد)
      # لكن وزن مِفْعَال من هذا الجذر غير موثق

    - lemma: "عَلَمُ الطَّرِيقِ"
      contradicts:
        - text: "«الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى أَثَرٍ بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ... وَالْعَلَمُ: الرَّايَةُ، وَالْجَمْعُ أَعْلَامٌ. وَالْعَلَمُ: الْجَبَلُ»"
          source: "مقاييس اللغة لابن فارس (جذر علم)"
          conflict: "لفظ 'عَلَم' كثير الاشتراك اللفظي (راية، جبل، اسم علم، علامة)؛ والمركب 'عَلَمُ الطريق' غير مُثبَّت معجمياً كوحدة اصطلاحية ثابتة تدل تحديداً على عمود الإرشاد"
        - text: "«الْعلم: بالفتحتين الْعَلامَة، والشهرة، والجبل الرفيع، والراية، وَمَا يعْقد على الرمْح، وَسيد الْقَوْم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "تشعب دلالة 'عَلَم' يجعل المركب غامضاً؛ إذ يُفهم منه 'راية الطريق' أو 'سيد الطريق' قبل أن يُفهم منه 'عمود الإرشاد'"

    - lemma: "مِدَلَّةٌ"
      contradicts:
        - text: "«المُدَلَّهُ: السَّاهى القَلْبِ، الذَّاهِبُ الْعَقْلِ، مِن عِشْقٍ ونحوه. الذى لا يَحفَظُ ما فَعَلَ ولا ما فُعِلَ به. المُتَرَدِّدُ حَيْرَةً»"
          source: "المعجم الكبير (OCR)"
          conflict: "الجذر 'دلل' قد آل في الاستعمال المعجمي إلى 'الدلال' و'المُدَلَّه' (ذاهب العقل من الحب)؛ فالشكل الصرفي مِفْعَلَة من دلل غير موثق، والجذر محمّل بدلالات تتعارض مع وظيفة التوجيه"
        - text: "«(المدله) من الرِّجَال الذَّاهِب الْعقل من عشق وَنَحْوه»"
          source: "المعجم الوسيط (Hawramani)"
          conflict: "الصيغ الواردة من هذا الجذر (مُدَلَّه، مِدَلَّه) لها معانٍ بعيدة كل البعد عن الإرشاد في الطريق"


