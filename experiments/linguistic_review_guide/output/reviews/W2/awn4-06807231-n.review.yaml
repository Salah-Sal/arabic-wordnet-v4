stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'عمود إرشادي' مركب وصفي حديث غير مُعجَّم في المصادر الكلاسيكية كوحدة معجمية مثبتة"
      - "المجموعة تفتقر إلى تمثيل الإرث اللغوي العربي الأصيل للمفهوم (صُوَّة، مَعْلَم الطريق)"
      - "التعريف العربي الحالي يبدو ترجمةً حرفيةً من الإنجليزية بأسلوب وصفي ركيك لا يستوفي شروط التعريف المعجمي"
      - "اللمّة بدون تشكيل كامل"
    observations: "المفهوم الذي تعبّر عنه هذه المجموعة (عَلَامَة الطريق الإرشادية المنصوبة) له أصيل عربي راسخ: الصُّوَّة جمعها الصُّوى، وهي الأعلام الحجرية المنصوبة في الطرق والمفازات دلالةً للسالكين، وقد ورد هذا المصطلح في حديث نبوي شريف: 'إنَّ للإسلام صُوًى ومَناراً كمنار الطريق'. والمَعْلَم: ما يُستدل به على الطريق من أثر. أما 'عمود إرشادي' فمصطلح عصري ملائم وشائع في الصحافة والإدارة الحضرية، لكنه لم يُعجَّم كوحدة معجمية مستقلة في مصادرنا، ويصعب اجتياز اختبار السكّ إذ يمكن إبداله بـ'عمود توجيهي' أو 'لافتة إرشادية' دون خسارة دلالية. الإثراء بالمصطلح التراثي 'صُوَّة' يمنح الشبكة عمقاً وشمولاً."
  blind_candidates:
    - lemma: "صُوَّةٌ"
      generation_method: majaz
      justification: "إحياء لفظ عربي كلاسيكي ميّت يدل على الحجر أو العَلَم المنصوب في الطريق دلالةً للمسافرين؛ مشابهة وظيفية مباشرة مع علامة الطريق الإرشادية الحديثة، والجذر صوو/صوي يدل على الصلابة والارتفاع وهو ما يجمع بين العَلَم الحجري والعمود الحديث"
    - lemma: "مِرْشَادٌ"
      generation_method: ishtiqaq
      justification: "مشتق من جذر 'رشد' على وزن مِفْعَال الدال على الآليات والأدوات (كمِقياس ومِيزان)؛ يفيد معنى أداة الإرشاد والتوجيه في الطريق، والجذر رشد يدل أصلاً على استقامة الطريق كما في قول ابن فارس: 'المَرَاشِدُ مَقَاصِدُ الطُّرُقِ'"
    - lemma: "عَلَمُ الطَّرِيقِ"
      generation_method: tarkib
      justification: "مركب إضافي من 'عَلَم' (بفتحتين) بمعنى العلامة الفارقة والراية المنصوبة، و'الطريق'؛ يستحضر استعمالاً كلاسيكياً واسعاً للعَلَم بمعنى ما يُنصب علامةً في الطريق كما وصفته الخنساء: 'كَأَنَّهُ عَلَمٌ فِي رَأْسِهِ نَارُ'"
    - lemma: "مِدَلَّةٌ"
      generation_method: ishtiqaq
      justification: "مشتق من جذر 'دلل' على وزن مِفْعَلَة الدال على الأدوات والآليات (كمِكنسة، مِكوَاة)؛ يفيد معنى الأداة الدالة والمرشدة إلى الطريق، والجذر دلل يتضمن معاني الدلالة والإرشاد"


