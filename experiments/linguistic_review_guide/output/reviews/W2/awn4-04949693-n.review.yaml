# مراجعة AWN4 — synset: awn4-04949693-n
# المفهوم: صفة كون الشيء غير قابل للاختراق (impenetrability / imperviousness)
# المراجع: AWN4 Review Pipeline v2 — 5-Stage
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة وصفية مباشرة للإنجليزية ولا يستوفي الأسلوب المعجمي العربي ذا الجنس القريب والفصل النوعي"
      - "الفرق الدلالي بين اللمّات الثلاث غير موثَّق: تتوزع حصانة وكتامة ومناعة على سياقات تخصصية متباينة (قانون وجيولوجيا وطب)، وكأنها لمّات من حقول ثلاثة لا مجموعة ترادفية واحدة"
      - "مناعة وحصانة في الاستخدام المعاصر تنصرفان أساساً إلى المناعة الحيوية والحصانة القانونية، لا إلى صفة عدم القابلية للاختراق الفيزيائية التي يقصدها المفهوم في جوهره"
    observations: "المفهوم متعدد السياقات في العربية: الجانب الفيزيائي يمثّله كتامة بدقة مصطلحية موثّقة (impermeability)، والجانب القانوني تمثّله حصانة، والجانب البيولوجي تمثّله مناعة. ثمة أيضاً مصطلحات علمية أحدث تُعبّر عن المفهوم كـ«اللانفاذية» و«اللااختراقية» (مُثبَتة في المورد الحديث)، لكنها لا تزيد على لمّة واحدة تقابل كتامة. جوهر المفهوم —قدرة المادة على الامتناع عن الاختراق في مواجهة الناس والضوء والقذائف— حاضر في أصول الجذور الثلاثة (حصن = الحرز والحفظ، كتم = الإخفاء والستر، منع = الحيلولة دون العطاء والنفوذ)."
  blind_candidates:
    - lemma: "لَانُفُوذِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الجذر «نفذ» مع حرف النفي «لا»، على القياس في تشكيل المصادر الصناعية السالبة كاللاخطية واللاسببية؛ يدلّ مباشرةً على صفة عدم النفاذ المادي"
    - lemma: "صَلَادَة"
      generation_method: majaz
      justification: "من «صَلَدَ»، يعني صلابة الصخر الكثيف وتماسكه؛ يُستعمل مجازاً للدلالة على خاصية عدم القابلية للاختراق انطلاقاً من المشابهة الوظيفية بين الصلابة وصدّ الاختراق"
    - lemma: "رَصَانَة"
      generation_method: ishtiqaq
      justification: "من «رَصُنَ» على وزن فَعَالَة، صفة البنية المحكمة المتماسكة التي لا يُنفَذ إليها؛ يُعبّر عن صفة عدم القابلية للاختراق من زاوية متانة التركيب"
    - lemma: "مَنَعَة"
      generation_method: majaz
      justification: "من «مَنَعَ»، إحياء للفظ العربي القديم الدالّ على صفة الحصن المنيع الذي يمنع النفوذ إليه؛ المشابهة بين منع الدخول ومنع الاختراق تبرر هذا المجاز"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات): 14 صيغة
#   Q2 — الجسر الإنجليزي: impenetrability, imperviousness, impenetrable, impervious
#   Q3 — البحث بالكلمات المفتاحية: اختراق، نفوذ، نافذ، منيع، حصين
#   Q4 — إثراء دمجي (تعريفات + أمثلة): entry_ids منتقاة من Q1
#   Q5 — مقاييس اللغة: جذور حصن، كتم، منع (dictionary_id=151)
stage2_evidence:
  per_lemma:

    - lemma: "حَصَانَة"
      confirm:
        - text: "«عدم التأثر بالعوامل المؤذية»"
          source: "معجم المصطلحات الطبية ج.3 (1997) — ARABTERM [entry_id=742330]"
      contradicts:
        - text: "«(في القانون) Immunite: وضع خاصٌّ يقرِّره القانونُ لفئة من الأشخاص, يترتَّبُ على توافره أنه لا يجوزُ لِسُلْطَةِ الاتِّهام أو سُلْطَةِ التَّحْقيق اتخاذُ الإِجْراءاتِ الجِنائِيَّةِ ضِدَّهُمْ — إطلاقاً أو بالنسبة لجرائم معيَّنة — دون استئذان سُلْطَةٍ مُعيَّنة, كالحصانة البرلمانية والحصانة الدبلوماسية والحصانة القضائية»"
          source: "المعجم الكبير — مجمع اللغة العربية [entry_id=77233]"
          conflict: "التعريف مقيَّد بالسياق القانوني فحسب ولا يشمل المفهوم الفيزيائي لعدم قابلية الاختراق"
      expands:
        - text: "«النظام الدفاعي في الجسم ضد المواد السامة والبكتريا»"
          source: "معجم المصطلحات الطبية ج.1 (1985) — ARABTERM [entry_id=733286]"
          addition: "يكشف عن توسُّع في الاستخدام نحو مقاومة العوامل الخارجية الضارة، وهو ما يقرّب حصانة من مفهوم صدّ الاختراق البيئي"

    - lemma: "كَتَامَة"
      confirm:
        - text: "«حالة صخور، أو رواسب، أو تربة يجعلها عاجزة عن نقل السوائل تحت الضغط»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ARABTERM [entry_id=356572]"
        - text: "«عدم النفاذ، كتامة، اللامَنْفَذِيَّة» — مقابل impermeability"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM [entry_id=390784]"
        - text: "«لا يسمح بمرور الماء عبره» — مقابل impervious"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM [entry_id=352067]"
      expands:
        - text: "«opacity» — مقابل كتامة في التقنيات التربوية"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM [entry_id=395827]"
          addition: "يمتد مفهوم كتامة ليشمل عدم نفاذية الضوء (الكثافة الضوئية / opacity)، وهو أحد السياقات الواردة في تعريف المجموعة"
        - text: "«(انظر: إحكام)» — مقابل tightness"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM [entry_id=388713]"
          addition: "يربط كتامة بمفهوم الإحكام والانسداد، مما يعزز دلالة الصدّ الكامل للنفاذ"
        - text: "«كَتَّامَة — من (ك ت م) مؤنث كَتَّام»"
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani [entry_id=940452]"
          addition: "يُثبت أن كتامة مشتق حي من الجذر كتم، وكتّام صيغة مبالغة تدلّ على شدّة الإغلاق والمنع"

    - lemma: "مَنَاعَة"
      confirm:
        - text: "«(المناعة) الحصانة من المرض ونحوه (مو)»"
          source: "المعجم الوسيط — hawramani [entry_id=884607]"
        - text: "«مَنَاعَة — من (م ن ع) الحماية والحصانة من المرض»"
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani [entry_id=946186]"
      contradicts:
        - text: "«تدل على قدرة كائن حي على تحقيق حماية نفسه من الجراثيم»"
          source: "مسرد المناخ والبيئة — ARABTERM [entry_id=357239]"
          conflict: "الاستخدام مقيَّد بالسياق البيولوجي (مقاومة الكائن الحي للجراثيم) لا بصفة عدم قابلية الاختراق المادي"
        - text: "«حصانة الجسم ضد المواد والفيروسات والأحياء المجهرية التي تغزوه من خلال تفاعلات حيوية خاصة»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM [entry_id=481796]"
          conflict: "التعريف يخصّ المناعة الحيوية ولا يشمل عدم النفاذية الفيزيائية للمواد الصلبة"
      expands:
        - text: "«المَنَاعَةُ: بالفتح، وهو مصدر منع الشيء مناعة: [اسم جبل في شعر ساعدة بن جؤية الهذلي]»"
          source: "معجم البلدان لياقوت الحموي — hawramani [entry_id=969771]"
          addition: "يكشف عن الإطار الأصلي للكلمة: الحصن المنيع والمكان المتعذر اختراقه، وهذا يدعم صلتها بمفهوم المجموعة"

    - lemma: "لَانُفُوذِيَّة"
      confirm:
        - text: "«(1) اللاتحايزية: خاصِّية في المادة تجعل من المتعذر على جسمين اثنين أن يحتلّا الحيّز نفسه في وقت واحد (فز) — (2) اللّааختراقية؛ اللّانفاذية» — مقابل impenetrability"
          source: "المورد الحديث (2008) — ARABTERM [entry_id=694320]"
        - text: "«عدم النفاذ، كتامة، اللامَنْفَذِيَّة» — مقابل impermeability"
          source: "المعجم الموحد لمصطلحات المياه (2000) — ARABTERM [entry_id=390784]"

    - lemma: "صَلَادَة"
      contradicts:
        - text: "«(فى الجيولوجيا) Hardness (E): مقدار مقاومة المعدن للخدش أو الكسر, وتقاس بمقياس موهس للصلادة»"
          source: "المعجم الكبير — مجمع اللغة العربية [entry_id=56526]"
          conflict: "صلادة مصطلح جيولوجي للصلابة الميكانيكية (مقاومة الخدش والكسر) لا لعدم قابلية الاختراق"
        - text: "«rigidity» — مقابل صلادة في الجيولوجيا وعلوم الزلازل"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)؛ المعجم الموحد لمصطلحات علوم الزلازل (1999) — ARABTERM [entry_ids=433011,437715]"
          conflict: "المقابل الإنجليزي الثابت هو rigidity (الصلابة) لا impenetrability (عدم قابلية الاختراق)"

    - lemma: "رَصَانَة"
      evidence_status: "no_material_found"

    - lemma: "مَنَعَة"
      contradicts:
