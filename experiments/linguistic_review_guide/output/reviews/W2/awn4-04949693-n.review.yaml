          source: "المعجم الوسيط — hawramani [entry_id=884794]"
          conflict: "منعة تدلّ على العزّ والقوة (might/strength)، لا على الصفة المجردة لعدم القابلية للاختراق"
        - text: "«مَنْعَة — من (م ن ع) العزة والقوة»"
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani [entry_id=946358]"
          conflict: "المعنى الجوهري القوة والعزة، وليس الامتناع عن الاختراق بوصفه صفةً مجردة"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حَصَانَة"
      decision: confirmed
      decision_reason: "تمثّل حصانة بُعد «عدم التأثر بالعوامل الخارجية الضارة» (insusceptibility)، وهو أحد وجوه صفة عدم القابلية للاختراق. وقد جاء في المعجم الطبي «عدم التأثر بالعوامل المؤذية» مقابلاً لـ insusceptibility، مما يدعم صلتها بمفهوم المجموعة. وجذرها حصن يعني الحرز والحيطة أصالةً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ لمّات المجموعة دلالةً وأوسعها سياقاً؛ تشمل الحصانة القانونية والدبلوماسية والطبية وعدم التأثر بالعوامل الضارة، مما يجعلها أصلح للسياقات الرسمية والمجازية"

    - lemma: "كَتَامَة"
      decision: confirmed
      decision_reason: "المصطلح الأدق في المجموعة للمفهوم الفيزيائي؛ موثَّق في معاجم الجيولوجيا والهندسة المدنية والبيئة مقابلاً مباشراً لـ impermeability وimpenetrability. وقد أثبت ابن فارس في مقاييسه أن «خَرْزٌ كَتِيمٌ: لَا يَنْضَحُ الْمَاءُ»، فالتاريخ اللغوي يؤصّل الدلالة. ملاحظة تقنية: الجذر المُسجَّل في قاعدة البيانات (تمم — من مصدر camel) خاطئ؛ الصواب (كتم) بدلالة مقاييس اللغة والاشتقاق الواضح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أخصّ لمّات المجموعة وأدقّها تقنياً؛ تُستخدم في الجيولوجيا والهندسة المدنية والبيئة للدلالة على عدم نفاذية المواد الصلبة للسوائل والأشعة والغازات"

    - lemma: "مَنَاعَة"
      decision: confirmed
      decision_reason: "رغم أن الاستخدام الغالب لمناعة في المعاجم الحديثة هو المناعة الحيوية، إلا أنها تحمل في أصلها الجذري (منع) معنى الامتناع والصدّ، ومنيع بمعنى لا يُخترق حصنه؛ وأصل المصدر —كما ورد في معجم البلدان— يحيل إلى الحصن والمكان المتعذر اختراقه."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تحمل دلالة المقاومة الحيوية وصدّ الغزو البيئي؛ لها ثقل طبي وبيولوجي أقوى من أخواتها، وهي أقرب إلى تعبير عدم الانقياد للتأثيرات الخارجية الحيّة"

    - lemma: "لَانُفُوذِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الصيغة الدقيقة «لانفوذية» غير مُسجَّلة في المعاجم؛ الصيغ الواردة هي «اللانفاذية» و«اللامنفذية» وكلاهما مختلف صرفياً. وكتامة أكثر استقراراً وأوسع توثيقاً في المعاجم المتخصصة لتغطية نفس المفهوم."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "صَلَادَة"
      source: stage1
      decision: removed
      decision_reason: "صلادة مصطلح جيولوجي راسخ يدلّ على الصلابة الميكانيكية (مقاومة الخدش والكسر بمقياس موهس)؛ مقابله الثابت في الإنجليزية هو rigidity لا impenetrability، فالمفهومان متباينان ولا يصح الجمع بينهما."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "رَصَانَة"
      source: stage1
      decision: removed
      decision_reason: "لم يرد لها شاهد معجمي في سياق عدم الاختراق، ومعناها الأصلي المتانة والاستحكام البنيوي لا الامتناع عن الاختراق بالمعنى المقصود في المجموعة. غياب الشواهد يحول دون اعتمادها."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مَنَعَة"
      source: stage1
      decision: removed
      decision_reason: "منعة تدلّ على العزّ والقوة (might/strength) وعلى الجيش الذي يدفع الأعداء؛ وليست الصفة المجردة لعدم القابلية للاختراق. فضلاً عن ذلك، اشتراكها في الجذر مع مناعة (الموجودة في المجموعة) يجعل إضافتها تكراراً جذرياً مُخلاً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


