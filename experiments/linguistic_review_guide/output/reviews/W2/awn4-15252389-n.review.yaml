# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15252389-n (ship's bell)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (جرس السفينة، دقة الجرس) تعبيران وصفيان حرّان وليستا مصطلحين مسكوكين ثابتين في معجم بحري عربي"
      - "«جرس السفينة» يدلّ على الجرس المادي لا على وحدة التوقيت البحرية"
      - "«دقة الجرس» يمكن إبدال «دقة» بـ«ضربة» أو «قرعة» مع بقاء المعنى صالحاً — ما يوحي بأنه تعبير حرّ لا مصطلح ثابت"
      - "المفهوم غريب ثقافياً عن التراث الملاحي العربي؛ التوقيت بدقات الجرس تقليد بحري غربي"
    observations: "المجموعة تمثّل مفهوماً بحرياً شديد الخصوصية من التقليد الملاحي الغربي: تقسيم اليوم إلى نوبات كل منها أربع ساعات، وكل نصف ساعة تُعلَن بدقّة إضافية من جرس السفينة حتى ثماني دقّات تنهي النوبة. لا يوجد في التراث البحري العربي (كعلم الملاحة عند ابن ماجد وسليمان المهري) مصطلح مقابل، إذ اعتمد العرب على النجوم والساعات الشمسية والرملية. اللمّتان الحاليتان ترجمتان وصفيتان للمصطلح الإنجليزي ship's bell / bell."
  blind_candidates:
    - lemma: "رَنَّة"
      generation_method: ishtiqaq
      justification: "من الجذر ر ن ن (رَنَّ يَرِنُّ رَنِيناً) بمعنى صوت الجرس والمعدن. على وزن فَعْلَة للمرّة الواحدة، فكلّ رنّة تمثّل نصف ساعة في التوقيت البحري."
    - lemma: "قَرْعَة"
      generation_method: ishtiqaq
      justification: "من الجذر ق ر ع (قَرَعَ الجرسَ) بمعنى ضربه. على وزن فَعْلَة للمرّة، فالقرعة هي الضربة الواحدة التي تؤشّر إلى وحدة نصف الساعة."
    - lemma: "نَوْبَة"
      generation_method: majaz
      justification: "النوبة في الأصل الدَّوْر والمناوبة، واستُعملت في المصطلح العسكري والبحري بمعنى فترة الحراسة. إزاحة دلالية لتشمل الوحدة الزمنية البحرية المحددة بنصف ساعة."
    - lemma: "نَقْرَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن ق ر (نَقَرَ) بمعنى ضرب بطرف شيء صلب. على وزن فَعْلَة للمرّة الواحدة، فكلّ نقرة على الجرس تساوي نصف ساعة."


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جرس السفينة"
      evidence_status: "no_material_found"

    - lemma: "دقة الجرس"
      evidence_status: "no_material_found"

    # ── مكوّنات اللمّات الموجودة ──
    - lemma: "جَرَس"
      confirm:
        - text: "«الجَرْسُ: الصَّوتُ، أو خَفِيُّهُ، ويكسر [...] وبالتحريكِ: الذي يُعَلَّقُ في عُنُقِ البَعِيرِ، والذِي يُضْرَبُ به أيضاً»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(1) جَرَس؛ ناقوس (2) صوت الجَرَس»"
          source: "المورد الحديث (2008)"
        - text: "«جرس، ناقوس» — translation_en: bell — domain: Oceanology"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
      expands:
        - text: "«جرس مرساة» — translation_en: anchor-bell — domain: Oceanology"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "يؤكّد استعمال «جرس» في السياق البحري للإشارة إلى الأجراس على السفن"
        - text: "«جرس ضباب» — translation_en: fog bell — domain: Oceanology"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "استعمال بحري آخر لـ«جرس» كمركّب إضافي"

    - lemma: "دَقَّة"
      confirm:
        - text: "«دَقَّة» — translation_en: beat — translation_fr: battement; pulsation"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      contradicts:
        - text: "«الدِّقَّةُ: هيئَةُ الدَّقِّ. ضِدُّ العِظَمِ. الخَساسَةُ»"
          source: "المعجم الكبير"
          conflict: "المعنى الأول في المعجم الكبير للدقّة هو هيئة الدقّ (مصدر هيئة) ثم ضدّ العظم والخساسة — لا علاقة بالضربات الزمنية"
        - text: "«دِقّة» — translation_en: precision / accuracy (في عشرات المعاجم الاصطلاحية)"
          source: "معاجم عربية موحّدة متعددة"
          conflict: "الاستعمال الغالب لـ«دقّة» في المصطلحات الحديثة هو precision/accuracy لا beat/stroke"

    # ── مرشحات المرحلة ١ ──
    - lemma: "رَنَّة"
      evidence_status: "no_material_found"

    - lemma: "قَرْعَة"
      evidence_status: "no_material_found"

    - lemma: "نَوْبَة"
      contradicts:
        - text: "«نَوْبَة» — translation_en: seizure / attack / fit (في المعاجم الطبية)"
          source: "المعجم الطبي الموحد وغيره"
          conflict: "الاستعمال المعجمي السائد لـ«نوبة» في المصطلحات الحديثة طبي (seizure/attack) لا زمني-بحري"
      expands:
        - text: "«نوبة العمل النهارية» — translation_en: day tour — domain: Petroleum"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "يدلّ على استعمال «نوبة» بمعنى shift/tour في السياق المهني"

    - lemma: "نَقْرَة"
      evidence_status: "no_material_found"

    # ── أدلة مقاييس اللغة ──
    - lemma: "جذر: جرس (مقاييس)"
      expands:
        - text: "«الْجِيمُ وَالرَّاءُ وَالسِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ مِنَ الصَّوْتِ، وَمَا بَعْدَ ذَلِكَ فَمَحْمُولٌ عَلَيْهِ. قَالُوا: الْجَرْسُ الصَّوْتُ الْخَفِيُّ [...] وَالْجَرَسُ: الَّذِي يُعَلَّقُ عَلَى الْجِمَالِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الدلالي للجذر هو الصوت، والجَرَس المعلّق مشتق من هذا الأصل"
    - lemma: "جذر: دقّ (مقاييس)"
      expands:
        - text: "«الدَّالُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى صِغَرٍ وَحَقَارَةٍ. فَالدَّقِيقُ: خِلَافُ الْجَلِيلِ [...] وَأَمَّا الدَّقْدَقَةُ فَأَصْوَاتُ حَوَافِرِ الدَّوَابِّ فِي تَرَدُّدِهَا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الدلالي صِغَر وحقارة، لكن فرع الدقدقة يشير إلى الضرب المتكرر"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جَرَسُ السَّفِينَةِ"
      decision: confirmed
      decision_reason: "رغم أن المركّب ليس مصطلحاً مسكوكاً في معجم بحري عربي، فإنه الترجمة المباشرة لـ ship's bell وقد استُعمل «جرس» في مركبات بحرية مسجّلة (جرس مرساة، جرس ضباب). المفهوم غريب ثقافياً ولا بديل أصيل له، فيُبقى المركّب بوصفه المعادل الوصفي الأقرب. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يشير إلى النظام الزمني نفسه من جهة الأداة (الجرس) وموقعها (السفينة)، أي المرجع المادي الذي يُحدِث الإشارة الزمنية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَرَسُ السَّفِينَةِ"

    - lemma: "دَقَّةُ الجَرَسِ"
      decision: confirmed
      decision_reason: "المركّب يصف الفعل المؤشّر للوحدة الزمنية (الدقّة = الضربة الواحدة). رغم أن «دقّة» تطغى عليها دلالة precision في المصطلحات الحديثة، فإن المعنى الأصلي «ضربة واحدة» (beat) موثّق. المركّب وصفي لكنه مفهوم في السياق البحري. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يشير إلى الحدث الزمني نفسه (الضربة/الدقّة) لا إلى الأداة، أي الوحدة القياسية المحسوبة بعدد الضربات"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَقَّةُ الجَرَسِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "رَنَّة"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام جداً يعني أي صوت رنين، ولا يختصّ بالتوقيت البحري. لم تُوجد أدلة معجمية تربطه بالمفهوم. إضافته ستُوهم بترادف مع «رنين» العام."

    - lemma: "قَرْعَة"
      source: stage1
      decision: removed
      decision_reason: "«قرعة» بمعنى الضربة الواحدة مقبول صرفياً لكنه يتداخل مع «قُرعة» (السحب بالقرعة) ومع «قَرعة» (يقطينة). لم تُوجد أدلة معجمية تخصّصه للسياق البحري."

    - lemma: "نَوْبَة"
      source: stage1
      decision: removed
      decision_reason: "النوبة تدلّ على الدَّور والمناوبة وفترة الحراسة (watch/shift)، وهي وحدة أكبر (٤ ساعات) لا نصف ساعة. المجموعة تصف وحدة النصف ساعة لا فترة النوبة. يوجد تداخل دلالي مع الاستعمال الطبي (seizure/attack)."

    - lemma: "نَقْرَة"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام للضربة بطرف صلب. لم تُوجد أدلة معجمية تربطه بالتوقيت البحري. يتداخل مع «نُقرة» (الحفرة الصغيرة) ممّا يُوقع في لبس."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "(بحرية) كل وحدة من وحدات النصف ساعة في التوقيت البحري يشار إليها بدقات جرس السفينة؛ ثمانية أجراس تشير إلى الساعة 4:00 أو 8:00 أو 12:00"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي. يحتاج إلى إعادة صياغة بأسلوب معجمي عربي، مع توضيح نظام النوبات البحرية وحذف الصيغة الأجنبية a.m./p.m."
    authored:
      - type: terminological
        text: "وَحْدَةٌ زَمَنِيَّةٌ بَحْرِيَّةٌ مِقْدارُها نِصْفُ ساعَةٍ، يُؤْذَنُ بِها بِضَرْبَةٍ واحِدَةٍ عَلى جَرَسِ السَّفِينَةِ، وَتَتَراكَمُ الضَّرَباتُ حَتّى تَبْلُغَ ثَمانِياً عِنْدَ انْقِضاءِ كُلِّ نَوْبَةِ حِراسَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "في التَّقْليدِ المِلاحِيِّ الغَرْبِيِّ، يُقْسَمُ اليَوْمُ إلى سِتِّ نَوْباتٍ كُلٌّ مِنْها أَرْبَعُ ساعاتٍ. يُقْرَعُ جَرَسُ السَّفينَةِ مَرَّةً عِنْدَ انْقِضاءِ أَوَّلِ نِصْفِ ساعَةٍ مِنَ النَّوْبَةِ، ثُمَّ تُزادُ قَرْعَةٌ كُلَّ نِصْفِ ساعَةٍ حَتّى تَبْلُغَ ثَمانِيَ قَرَعاتٍ مُؤْذِنَةً بِنِهايَةِ النَّوْبَةِ وَبُلوغِ السّاعَةِ الرّابِعَةِ أَوِ الثّامِنَةِ أَوِ الثّانِيَةَ عَشْرَةَ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "وَحْدَةٌ زَمَنِيَّةٌ بَحْرِيَّةٌ مِقْدارُها نِصْفُ ساعَةٍ، يُؤْذَنُ بِها بِضَرْبَةٍ واحِدَةٍ عَلى جَرَسِ السَّفِينَةِ، وَتَتَراكَمُ الضَّرَباتُ حَتّى تَبْلُغَ ثَمانِياً عِنْدَ انْقِضاءِ كُلِّ نَوْبَةِ حِراسَةٍ."

  examples:
    per_lemma:
      - lemma: "جَرَسُ السَّفِينَةِ"
        examples:
          - text: "قُرِعَ جَرَسُ السَّفِينَةِ أَرْبَعَ مَرّاتٍ مُعْلِناً انْتِصافَ نَوْبَةِ الحِراسَةِ."
            type: usage
      - lemma: "دَقَّةُ الجَرَسِ"
        examples:
          - text: "عِنْدَ كُلِّ دَقَّةٍ مِنْ دَقّاتِ الجَرَسِ يُسَجِّلُ الضّابِطُ مُرورَ نِصْفِ ساعَةٍ في سِجِلِّ المِلاحَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "قُرِعَ جَرَسُ السَّفِينَةِ أَرْبَعَ مَرّاتٍ مُعْلِناً انْتِصافَ نَوْبَةِ الحِراسَةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "عِنْدَ كُلِّ دَقَّةٍ مِنْ دَقّاتِ الجَرَسِ يُسَجِّلُ الضّابِطُ مُرورَ نِصْفِ ساعَةٍ في سِجِلِّ المِلاحَةِ."


