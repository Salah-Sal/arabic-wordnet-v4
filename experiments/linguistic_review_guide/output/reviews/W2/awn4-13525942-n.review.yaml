        (٢) «الانقسام المتساوي» مصطلح نادر الدوران؛ المُعتمَد في المعاجم العربية هو
        «الانقسام الخيطي» (mitosis). (٣) «المنصف» يُستخدم عادةً صفةً لا اسماً؛
        الأدق «الانقسام الاختزالي» (meiosis).
