# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة الموجودة (انقسام النواة) تفتقر إلى التشكيل الكامل"
      - "المصطلح الإنجليزي karyokinesis له ترجمات عربية موثّقة في أكثر من معجم متخصص، ولم تُضَف إلى المجموعة"
      - "عبارة «الانقسام المتساوي» في التعريف غير شائعة اصطلاحياً؛ الأكثر دوراناً في الأدب العلمي العربي هما «الانقسام الخيطي» و«الانقسام الاختزالي»"
      - "غياب أمثلة استعمالية على مستوى المجموعة"
    observations: >
      المفهوم تقني بيولوجي دقيق: هو انقسام نواة الخلية (لا انقسام الخلية كلها)، ويقع
      حتماً في سياق الانقسام الخيطي (mitosis) أو الاختزالي (meiosis). المصطلح العربي
      المثبَّت في معجم الوراثة (2009) هو «انقسام النواة»، وهو مركب إضافي صريح يصف
      الحدث البيولوجي بدقة. تتنافس مع هذا المصطلح ترجمات طبية أخرى موثّقة في المعجم
      الطبي الموحد ومعجم الأحياء، وهو ما يستدعي إثراء المجموعة بمرادفات مؤسَّسة.

  blind_candidates:
    - lemma: "تَشَطُّرُ النَّوَاةِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «تَشَطُّر» (مصدر تشطَّرَ على وزن تَفَعُّل من جذر شطر = الشَّقّ
        إلى نصفين) و«النَّوَاة». الجذر شطر يدلّ عند ابن فارس على «نصف الشيء»، وهو
        دلالة دقيقة لانقسام النواة إلى شطرين متماثلين. مفردة تَشَطُّر تُقيم تمييزاً
        بين انقسام الخلية (التَّقَسُّم) وانقسام نواتها (التَّشَطُّر).

    - lemma: "الحَرَكَةُ النَّوَوِيَّةُ"
      generation_method: tarkib
      justification: >
        كالك مباشر لـ karyokinesis: karyon (نواة) + kinesis (حركة). مركب وصفي من
        «الحَرَكَة» و«النَّوَوِيَّة» (نسبة إلى النواة). الجذر حرك يدلّ عند ابن فارس
        على «ضدّ السكون»، ما يُجسّد الطابع الديناميكي للعملية.

    - lemma: "اِنْفِلَاقُ النَّوَاةِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «اِنْفِلاق» (مصدر انفلق على وزن انفعال من جذر فلق = الشَّقّ
        والصَّدْع) و«النَّوَاة». المجاز القرآني «فالق الحبّ والنوى» يربط جذر فلق
        بمفهوم الشَّقّ في سياق البذرة والنواة، مما يُشكّل مجازاً وظيفياً دقيقاً
        لانقسام نواة الخلية.

    - lemma: "كَارْيُوكِينِيزِيس"
      generation_method: taarib
      justification: >
        تعريب المصطلح الدولي karyokinesis من أصل يوناني (karyon = نواة، kinesis = حركة).
        يقبل لام التعريف (الكارتوكينيزيس) والنسبة والجمع السالم. الملجأ الأخير بعد
        استنفاد إمكانيات المراتب الأعلى.


