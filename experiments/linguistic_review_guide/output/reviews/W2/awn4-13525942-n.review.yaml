# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "انقسام النواة"
      decision: confirmed
      decision_reason: >
        مُثبَّت في «المعجم الموحد لمصطلحات علم الوراثة (2009)» بوصفه المقابل العربي الدقيق
        لـ karyokinesis. المركب إضافي صريح (جنس: انقسام + مخصَّص: النواة) يُحدّد العملية
        بدقة. اجتاز اختبار السكّ (لا يمكن إبدال «النواة» بمرادف وإبقاء الدلالة التخصصية).
        يستوفي معيار إيثار التراثي والعربي. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على الحدث البنيوي (الانقسام = division) ويُسمّي العضو المنقسم (النواة)
        صراحةً دون الإحالة إلى آلية الحركة أو المظهر الكروموسومي. المصطلح المُعتمَد
        في أدبيات الوراثة بالعربية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْقِسَامُ النَّوَاةِ"

    - lemma: "تَشَطُّرُ النَّوَاةِ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن «تشطّر» مُعتمَد في المعجم الطبي الموحد بمعنى cleavage
        (انشطار البيضة)، وليس karyokinesis. فضلاً عن ذلك يحمل دلالةً كلاسيكيةً سلبية
        (الخبث واللؤم) تُوقع اشتراكاً لفظياً غير مقبول. خطأ في التخصيص: cleavage ≠ karyokinesis.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "الحَرَكَةُ النَّوَوِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة المُثبَّتة في المعجم الطبي الموحد هي «الحَرَائِكُ النَّوَوِيَّةُ» (جمع)،
        لا «الحَرَكَةُ النَّوَوِيَّةُ» (مفرد). المفرد «حركة» لا يُطابق الاصطلاح التقني
        ويُوهم بحركة فيزيائية بسيطة لا بعملية بيولوجية معقدة. أُحيل الترشيح إلى
        «الحَرَائِكُ النَّوَوِيَّةُ» المكتشَف في قاعدة البيانات.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "اِنْفِلَاقُ النَّوَاةِ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن «انفلاق» مُعتمَد في معجم الأحياء (1993) مقابلاً لـ cleavage
        (انقسام البيضة المخصّبة في أطوارها الجنينية الأولى)، وليس karyokinesis. خطأ في
