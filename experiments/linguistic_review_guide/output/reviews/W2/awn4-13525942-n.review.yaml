        لا أدلة في قاعدة البيانات المعجمية. التعريب ملجأ أخير لا يُلجأ إليه مع وجود مقابلات
        عربية مؤسَّسة موثّقة في المعاجم التخصصية. مرفوض وفق مبدأ إيثار العربي على الدخيل.
