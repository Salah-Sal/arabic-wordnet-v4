# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10637523-n  |  ILI: i93112  |  POS: n
# المفهوم: شخص يتنفس بصوت عالٍ بسبب انسداد الأنف بالمخاط (snuffler)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مُخَنْفِر» غير موجودة كمدخل مستقل في المعاجم الأساسية (المعجم الوسيط، المعجم الكبير)"
      - "الجذر «خنفر» رباعي مُستحدَث لا تحليل له في مقاييس اللغة لابن فارس"
      - "التعريف الحالي مصاغ بأسلوب مترجَم حرفياً ولا يتبع منهج التعريف بالجنس والفصل"
      - "المرادف فوق المباشر (hypernym) يُترجَم بـ«عامل/فاعل» (شخص يعمل) وهو مباين للمعنى"
    observations: "تقع المجموعة في حقل دلالي ضيّق يتعلق بوصف الصوت الصادر عن الأنف المنسدّ بالمخاط. العربية الكلاسيكية لا تعرف مصطلحاً مسكوكاً خاصاً لهذا المفهوم بوصفه «صنفاً من البشر»، غير أن جذر «نخر» يقدّم أقرب تعبير قياسي فصيح عبر اسم الفاعل «نَاخِر» الموثَّق في المعجم الوسيط ومقاييس اللغة بمعنى «المصوّت بخياشيمه». أما «مُخَنْفِر» فمبني على رباعي مُستحدَث وثَّقه معجم اللغة العربية المعاصرة في سياق الشخير والغطيط."

  blind_candidates:
    - lemma: "نَاخِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «نَخَرَ» على وزن فَاعِل؛ النَّخير هو الصوت الخارج من المنخرين، فنَاخِر هو مَن يُصوِّت بخياشيمه عند التنفس، وهو الأقرب دلالةً وأسلوباً لمفهوم المجموعة."
    - lemma: "مَزْكُوم"
      generation_method: ishtiqaq
      justification: "اسم مفعول من «زُكِمَ» (مبني على المبني للمجهول)؛ يصف الشخص المصاب بالزكام الذي يتنفس بصوت بسبب انسداد أنفه بالمخاط."
    - lemma: "خَنَّاف"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة فَعَّال من «خَنَفَ»؛ يُقاس على أن الخُنّة صوت الأنف، فخَنَّاف مَن يُكثر من هذا الصوت خلال تنفسه."
    - lemma: "شَخَّار"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة فَعَّال من «شَخَرَ»؛ الشخير هو صوت التنفس العالي، وشَخَّار يدل على كثرة هذا الصوت وثباته كسمة في الشخص."


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات قاعدة البيانات المنفَّذة:
#  [١] دفعي: مخنفر/المخنفر + ناخر/الناخر + مزكوم/المزكوم + خناف/الخناف + شخار/الشخار
#  [٢] الجسر الإنجليزي: snuffler / snuffle / sniffle  → المورد الحديث (2008)
#  [٣] FTS كلمات مفتاحية: نخير، خنفر، زكام، مخاط، خنف → نتائج إثراء واسعة
#  [٤] الإثراء بالمعرّف: entries 885338, 28785, 755935, 613464 (ناخر)
#  [٥] مقاييس اللغة: جذور نخر، خنفر، زكم (dictionary_id = 151)
stage2_evidence:
  per_lemma:

    - lemma: "مُخَنْفِر"
      confirm:
        - text: "«خنفرَ في يُخنفر، خَنفرةً، فهو مُخنفِر، والمفعول مُخَنْفَر فيه• خنفر النَّائمُ في نومه: شخَّر، غطَّ فيه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«خنفر: شخر، غَطّ (بوشر، ميهرن ص27). تَخَنْفَر: شخير، غطيط (بوشر)»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
      contradicts:
        - text: "«مُخَنْفر: أنافيّ، عظيم الأنف (شيرب)»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          conflict: "دوزي يُعطي معنى «عظيم الأنف» لمُخَنْفَر (اسم المفعول) لا لمُخَنْفِر (اسم الفاعل)؛ الفرق الصرفي بين الصيغتين يرفع التعارض"
      expands:
        - text: "«خَنفرة: أنف عظيم ضخم، أنف مضحك لضخامته (شيرب)»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "يربط جذر خنفر بضخامة الأنف مما يُفسِّر الصوت الصادر عنه ويؤكد الصلة الفيزيولوجية"

    - lemma: "نَاخِر"
      confirm:
        - text: "«النَّاخِرُ: المصوّت بخياشيمه. ما بالدار ناخر: أحد. الخنزير الضَّاري. الحمار»"
          source: "المعجم الوسيط"
        - text: "«(الناخر) المصوت بخياشيمه ويقال ما بالدار ناخر أحد والخنزير الضاري والحمار (ج) نخر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (مجمع اللغة العربية بالقاهرة، 1998)"
        - text: "«النُّونُ وَالْخَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى صَوْتٍ مِنَ الْأَصْوَاتِ ثُمَّ يُفَرَّعُ مِنْهُ. النَّخِيرُ: صَوْتٌ يَخْرُجُ مِنَ الْمَنْخِرَيْنِ، وَسُمِّيَ الْمَنْخِرَانِ مِنْ جِهَةِ النَّخِيرِ الْخَارِجِ مِنْهُمَا. وَفُرِّعَ مِنْهُ فَقِيلَ لِخَرْقَيِ الْأَنْفِ النُّخْرَتَانِ... وَالنَّاخِرُ: الَّذِي تَدْخُلُ فِيهِ الرِّيحُ وَتَخْرُجُ مِنْهُ وَلَهَا نَخِيرٌ. وَمَا بِهَا نَاخِرٌ، أَيْ أَحَدٌ، يُرَادُ بِهَا مُصَوِّتٌ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«ناخِر: necrotizing»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي يستخدم «ناخر» في الحقل الدلالي الثاني لجذر نخر (التهالك والتفسخ النسيجي)؛ هذا حقل مستقل ولا يؤثر على المعنى الصوتي الأصيل"

    - lemma: "مَزْكُوم"
      confirm:
        - text: "«مَزْكُوم: المصاب بالزكام وهو التهاب حاد بغشاء الأنف المخاطي»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«فلانٌ مَزْكُوم منذ أيام [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«جاء في لسان العرب: زُكمَ الرجلُ وأزْكَمَه اللهُ فهو مَزْكُومٌ، بني على زُكِمَ. يعني أنه قد استغني عن اسم المفعول من «أزكم» باسم المفعول من «زُكم»»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يؤكد فصاحة مَزْكُوم وأصالته وأنه مبني على فعل مبني للمجهول بطريق القياس"

    - lemma: "خَنَّاف"
      contradicts:
        - text: "«الخِناف: داءٌ يأخذ الخيلَ في العضُد»"
          source: "المعجم الوسيط"
          conflict: "خِناف/خُناف في جميع المعاجم داء يصيب الخيل في العضد والإبل في أرساغها؛ لا علاقة له بالتنفس"
        - text: "«خَنَّاف: الكثير الغضب، والشامخ بأنفه من الكبر، وفرس خناف: يثنى وجهه إلى فارسه كثيراً»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعنى الموثَّق لـ«خَنَّاف» هو كثير الغضب أو الشامخ بأنفه كبراً؛ لا صلة له بالتنفس الصاخب"

    - lemma: "شَخَّار"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُخَنْفِر"
      decision: confirmed
      decision_reason: "يؤكده معجم اللغة العربية المعاصرة صراحةً كاسم فاعل من «خنفرَ» بمعنى التصويت الأنفي العالي المشابه للشخير والغطيط. التعارض في دوزي يخص اسم المفعول «مُخَنْفَر» (عظيم الأنف) لا اسم الفاعل «مُخَنْفِر» (مَن يُخَنْفِر)؛ الفرق الصرفي الحاسم بين الصيغتين يرفع التعارض. يُثبَت التشكيل الموجود على وزن اسم الفاعل من الفعل الرباعي خَنْفَرَ (مُخَنْفِر) ولا يحتاج تصحيحاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على جودة الصوت (خنفرة = غطيط أنفي شبيه بالشخير)؛ توثيقه في المعجم الحديث يربطه بسياق النوم والشخير أكثر من التنفس اليقظ عبر أنف مسدود"

    - lemma: "نَاخِر"
      source: stage1
      decision: confirmed
      decision_reason: "يؤكده المعجم الوسيط ومقاييس اللغة بعبارة صريحة: «المصوّت بخياشيمه»؛ مبني على جذر ثلاثي صحيح قياسي (نخر) وثَّقه ابن فارس صراحةً لمعنى الصوت من المنخرين. اسم الفاعل «نَاخِر» سليم صرفياً، وهو الأقرب في التراث العربي الكلاسيكي لمفهوم المجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على التصويت العام بالخياشيم أثناء التنفس دون تخصيص بسياق النوم؛ أعمق جذراً في التراث وأشمل تطبيقاً (يقظةً ونوماً)"
      actions:
        - command: create_entry
          params: {lemma: "نَاخِر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَزْكُوم"
      source: stage1
      decision: removed
      decision_reason: "مَزْكُوم يعني المصاب بالزكام بوجه عام؛ فكل مزكوم ليس بالضرورة مَن يُسمع تنفسه بصوت، وليس كل مَن يتنفس بصوت مزكوماً. المجموعة تُخصِّص الصفة الصوتية كسمة لازمة، لا مجرد الإصابة بالزكام. التداخل السببي حاضر لكن التطابق الدلالي منقوص."

    - lemma: "خَنَّاف"
      source: stage1
      decision: removed
      decision_reason: "معانيه الموثَّقة في المعاجم تدور حول داء الخيل في العضد (خِناف/خُناف) أو كثرة الغضب والشموخ بالأنف كبراً؛ لا صلة لأيٍّ منها بالتنفس الأنفي الصاخب."

    - lemma: "شَخَّار"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية تدعمه. الشخير في العربية يرتبط أساساً بالنوم لا بالتنفس اليقظ عبر أنف مسدود، مما يجعل دلالته مختلفة أو أضيق من مفهوم المجموعة."


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
