stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان بلا تشكيل — يلزم إضافة تشكيل كامل"
      - "التعريف الحالي يصف النمط الجيني بوصفه مجموعة كائنات لا بوصفه التركيب الوراثي ذاته، وهو معنى ثانوي يحتاج إلى توضيح"
      - "كلمة «طراز» فارسية معرّبة، بينما «نمط» عربية أصيلة — ينبغي التحقق من شيوع كلتيهما في الاستعمال العلمي"
    observations: "المجموعة تعبّر عن مفهوم وراثي متخصص (genotype بوصفه صنفاً من الكائنات تشترك في تركيب جيني واحد). المصطلح العلمي العربي الأكثر شيوعاً هو «النمط الجيني»، ويرادفه «النمط الوراثي». أمّا «الطراز» فهو أقل انتشاراً في أدبيات الوراثة الحديثة لكنه مستعمل في المورد الحديث. التعريف الحالي مقبول من حيث المضمون لكنه يحتاج إلى صقل أسلوبي."
  blind_candidates:
    - lemma: "نَمَط جِينِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «نمط» (نوع/صنف) و«جيني» (نسبة إلى الجين)، وهو المصطلح الأكثر شيوعاً في المعاجم العلمية العربية للدلالة على genotype"
    - lemma: "نَمَط وِرَاثِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي بديل يستعمل «وراثي» بدل «جيني»، وكلاهما يدل على ما يتصل بالمورّثات، وهو مسجّل في المعجم الموحد لمصطلحات علم الوراثة"
    - lemma: "طِرَاز وِرَاثِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «طراز» (هيئة/نمط — فارسي معرّب) و«وراثي»، بديل يجمع بين المكوّن الفارسي المعرّب والنسبة العربية"
    - lemma: "تَرْكِيب وِرَاثِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يركّز على البنية الجينية (التركيب) بدل الصنف (النمط)، مستعمل في سياقات وراثية قريبة"

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "الطراز الجيني"
      confirm:
        - text: "«الطراز العِرْقيّ: «أ» البِنْية الوراثية لفرد أو جماعة. «ب» طبقة أو مجموعة من الأفراد تشترك في تركيب وراثيّ مخصوص.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الطّراز) النمط والشكل والجيد من كل شَيْء وَيُقَال لَيْسَ هَذَا من طرازك وَعلم الثَّوْب وَنَحْوه»"
          source: "المعجم الوسيط"
          addition: "أصل كلمة طراز يعني النمط والشكل عموماً، وليس مخصصاً للوراثة"
        - text: "«فارسي معرب الهيئة»"
          source: "مجمل اللغة"
          addition: "تأكيد أن طراز فارسي معرّب"
        - text: "«طَرَزَ: الطَّاءُ وَالرَّاءُ وَالزَّاءُ كَلِمَةٌ يُظَنُّ أَنَّهَا فَارِسِيَّةٌ مُعَرَّبَةٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يشير إلى أنها فارسية معرّبة"

    - lemma: "النمط الجيني"
      confirm:
        - text: "«نمط وراثيّ، نمط جينيّ: تركيب وراثيّ للفرد، يحدده نوع المورثات وترتيبها.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«نمط جيني: تكوين أليلية المحدد للخلية - أي من كامل أو، وهو الأكثر شيوعا، لجين معين أو مجموعة من الجينات.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
        - text: "«نَمَطٌ جِينِيّ: مجموع المورثات الموجودة في الخلايا العضوية.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«نمط جيني (نمط ورثي): مجموعة المكونات الورثية (الجينية) لفرد ما.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«النمط الجينيّ للكائن لغير المواقع الجينية المكونة للنمط الظاهريّ تحت الدراسة.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — مدخل: نمط جينيّ خلفيّ"
          addition: "يُشتق منه مركبات فرعية مثل «نمط جيني خلفي»"

    # ── المرشحات ──
    - lemma: "نَمَط وِرَاثِيّ"
      confirm:
        - text: "«نمط وراثيّ، نمط جينيّ: تركيب وراثيّ للفرد، يحدده نوع المورثات وترتيبها.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"

    - lemma: "طِرَاز وِرَاثِيّ"
      evidence_status: "no_material_found"

    - lemma: "تَرْكِيب وِرَاثِيّ"
      expands:
        - text: "«تفاعل التركيب الوراثيّ مع البيئة: تفاعل وراثيّ (جينيّ) يحدث بين الجينات وبيئتها.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "التركيب الوراثي يُستعمل مكوّناً في مصطلحات أخرى لكنه لا يُستعمل وحده مرادفاً لـ genotype بوصفه مجموعة"

    - lemma: "نَمَط جِينِيّ"
      confirm:
        - text: "«نمط وراثيّ، نمط جينيّ: تركيب وراثيّ للفرد، يحدده نوع المورثات وترتيبها.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«نَمَطٌ جِينِيّ: مجموع المورثات الموجودة في الخلايا العضوية.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "الطِّرَاز الجِينِيّ"
      decision: confirmed
      decision_reason: "مصطلح مستعمل في الأدبيات العربية، وورد في المورد الحديث بصيغة «الطراز العرقي» للدلالة على genotype. كلمة «طراز» فارسية معرّبة مقبولة في العربية الفصحى ومثبّتة في المعجم الوسيط بمعنى النمط والشكل. مع أن «النمط الجيني» أكثر شيوعاً، يبقى «الطراز الجيني» مقبولاً لإثراء المجموعة الترادفية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُفضَّل في السياقات التي تُراد فيها الدلالة على الهيئة أو النموذج العام، وله ظلال دلالية تشير إلى التصنيف والرتبة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطِّرَاز الجِينِيّ"

    - lemma: "النَّمَط الجِينِيّ"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً واعتماداً في المعاجم العلمية العربية المتخصصة (الوراثة، الصيدلة، الطب، البيطرة، التشريح). مسجّل في خمسة معاجم موحدة على الأقل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح المعياري الأكثر تداولاً في الأدبيات العلمية والأكاديمية العربية، يُفضَّل في السياقات العلمية الدقيقة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "النَّمَط الجِينِيّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَمَط وِرَاثِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مسجّل صراحةً في المعجم الموحد لمصطلحات علم الوراثة (2009) مرادفاً لـ «نمط جيني» في ترجمة genotype. يستعمل «وراثي» المشتقة من جذر عربي أصيل (ورث) بدل «جيني» المعرّبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُفضَّل في السياقات التي تُؤثِر المصطلح العربي الخالص على المعرّب، ويُستعمل أكثر في النصوص التعليمية والتعميمية"
      actions:
        - command: create_entry
          params: {lemma: "نَمَط وِرَاثِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "طِرَاز وِرَاثِيّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي دليل معجمي لهذا التركيب. وهو تكرار غير مثبّت لمعنى مغطّى بـ «الطراز الجيني» و«النمط الوراثي»."

    - lemma: "تَرْكِيب وِرَاثِيّ"
      source: stage1
      decision: removed
      decision_reason: "يُستعمل «التركيب الوراثي» بمعنى genetic composition/constitution وليس بمعنى genotype كمجموعة من الكائنات. هو مكوّن فرعي في مصطلحات أخرى ولا يُستعمل وحده مرادفاً لـ genotype."

    - lemma: "نَمَط جِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمّة الموجودة «النمط الجيني» بعد حذف أل التعريف. لا حاجة لإضافة مدخل مكرّر؛ المدخل الموجود يغطي هذه الصيغة."

