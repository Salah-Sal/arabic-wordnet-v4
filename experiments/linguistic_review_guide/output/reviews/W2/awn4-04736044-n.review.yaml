# ── المرحلة ١: المراجعة والتوليد (عمياء) ────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دوري جزئياً: يرد فيه 'صفة التفوق' وتَفَوُّق هي لمّة في المجموعة ذاتها"
      - "تَفَوُّق مصدرٌ فعلي ذو طابع ديناميكي (عملية التجاوز) لا صفةٌ ثابتة بالضرورة، مما قد يُضيّق ملاءمته لمعنى 'جودة التفوق' كحالة"
      - "بَرَاعَة تنطوي في بعض المعاجم على بُعد بلاغي/فصاحي (براعة الاستهلال) قد يوحي بتخصيص أضيق من المقصود"
    observations: >
      المجموعة تعبّر عن مفهوم 'التميّز النوعي' (excellence) بوصفه خاصيةً
      مجردةً. اللمّات الثلاث الموجودة — إن ثبتت — تُغطي أبعاداً متكاملة:
      الانفراد والتمايز (امتياز)، كمال الفضل والمهارة (براعة)، والفوقية
      المقارنة (تفوق). التعريف العربي يستحق صياغةً أوضح تنأى عن الدوران
      والترجمة الحرفية للإنجليزية، ويستأنس بالجنس القريب وهو 'الجودة'
      (المجموعة الأم awn4-04731092-n).
  blind_candidates:
    - lemma: "الإِجَادَة"
      generation_method: ishtiqaq
      justification: >
        مصدر أجادَ يُجيدُ من جذر جود على وزن إِفَالَة، يعبّر عن إتيان
        الشيء بصورة بالغة الجودة. الوزن المصدري يناسب المفاهيم المجردة
        لصفات الأداء الرفيع.
    - lemma: "النَّبَالَة"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر نبل الذي يدل في اللغة على الفضل والكِبَر؛ النَّبَالة
        تعبّر عن التميّز الذاتي وسموّ الخِصال بما يُقارب دلالة Excellence.
    - lemma: "الرِّفْعَة"
      generation_method: majaz
      justification: >
        اسم من رفَعَ، يُستعمل في كلام العرب مجازاً في علوّ القدر والشرف
        النوعي. إحياء هذا اللفظ التراثي للتعبير عن الرقي الجوهري للأشياء
        والأشخاص يتجنّب الاشتراك اللفظي الحديث.
    - lemma: "الفَضِيلَة"
      generation_method: ishtiqaq
      justification: >
        وزن فَعِيلَة من جذر فضل الدال على الزيادة والخير؛ الفضيلة تعني
        الخصلة الحميدة البالغة الكمال ومزيّة الشيء على نظيره.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "امْتِيَاز"
      confirm:
        - text: "«امْتِيَاز من (م ي ز) ظهور الفضل والانفصال»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) تفوُّق؛ امتياز (2) مِيزة؛ فضيلة»"
          source: "المورد الحديث (2008) — ترجمة excellence"
      expands:
        - text: "«مَيَزَ: الْمِيمُ وَالْيَاءُ وَالزَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَزَبُّلِ شَيْءٍ مِنْ شَيْءٍ وَتَزْيِيلِهِ. وَمَيَّزْتُهُ تَمْيِيزًا وَمِزْتُهُ مَيْزًا. وَامْتَازُوا: تَمَيَّزَ بَعْضُهُمْ مِنْ بَعْضٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر الأصلي يدل على الفصل والتمييز، وامتياز منه على وزن افتعال مما يُفيد تحقق التميّز. هذا يدعم الدلالة المعجمية للمصطلح ويُبيّن أن الامتياز يعكس الانفراد النوعي."

    - lemma: "بَرَاعَة"
      confirm:
        - text: "«كمالُ الفضل، حُسن الفصاحة الخارجة عن نظائرها»"
          source: "المعجم الوسيط (OCR)"
        - text: "«البراعة: كمال الفضل والتبرز. قال ابن دريد: كل شيء تناهى في جمال أو نضارة فقد برع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«البراعة: [في الانكليزية] Excellence، eloquence... في اللغة التفوّق. يقال برع الرجل إذا فاق على أقرانه في العلم ونحو ذلك»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(البراعة) كَمَال الْفضل وَحسن الفصاحة الْخَارِجَة عَن نظائرها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«بَرَعَ: الْبَاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلَانِ: أَحَدُهُمَا التَّطَوُّعُ بِالشَّيْءِ مِنْ غَيْرِ وُجُوبٍ. وَالْآخَرُ التَّبْرِيزُ وَالْفَضْلُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«بَراعة الاستهلال: هي أن يكون مَطْلَعُ الكلام دالًا على غرض المتكلم»"
          source: "المعجم الكبير (OCR)"
          addition: "يكشف عن توظيف بلاغي متخصص للبراعة في سياق الفصاحة والاستهلال، وهو امتداد للأصل الدلالي العام لكنه أضيق من مفهوم التفوق النوعي الشامل."

    - lemma: "تَفَوُّق"
      confirm:
        - text: "«(تفوق) على قومه فاقهم وترفع عَلَيْهِم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«فَاقَ: الْفَاءُ وَالْوَاوُ وَالْقَافُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى عُلُوٍّ... فُلَانٌ فَاقَ أَصْحَابَهُ يَفُوقُهُمْ، إِذَا عَلَاهُمْ وَأَمْرٌ فَائِقٌ، أَيْ مُرْتَفِعٌ عَالٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الإحساس بالتميز عن الآخرين والتعالي عليهم»"
          source: "مسرد الإعلام والتواصل (ARABTERM) — ترجمة superiority"
      contradicts:
        - text: "«تَفَوَّق على — الرأي: مرفوضة — السبب: لعدم ورودها بهذا المعنى في المعاجم القديمة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "الرفض يطال الفعل المتعدي بـ'على' لا المصدر تَفَوُّق بوصفه اسماً؛ غير أنه يُشير إلى ضعف التوثيق الكلاسيكي لهذا الاستعمال. المصدر تَفَوُّق كاسم مجرد لم يُصرّح برفضه."

    - lemma: "الإِجَادَة"
      evidence_status: "no_material_found"

    - lemma: "النَّبَالَة"
      confirm:
        - text: "«الذَّكاءُ والنجابة والشَّرَف»"
          source: "المعجم الوسيط (OCR)"
        - text: "«نَبَلَ: النُّونُ وَالْبَاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَضْلٍ وَكِبَرٍ، ثُمَّ يُسْتَعَارُ مِنْهُ الْحِذْقُ فِي الْعَمَلِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«(النبالة) حِرْفَة صانع النبال»"
          source: "المعجم الوسيط (OCR)"
          conflict: "نفس الصيغة النَّبَالَة مشتركة بين دلالة الفضل والنجابة ودلالة الحرفة (صنعة النبال) مما يُفضي إلى اشتراك لفظي يضرّ بالوضوح."

    - lemma: "الرِّفْعَة"
      contradicts:
        - text: "«الشَّرف وارتفاع القدر والمنزلة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "الرفعة في المعاجم تنصبّ على المكانة الاجتماعية وعلو الشرف، لا على الجودة الذاتية والكمال النوعي. المعنى المعجمي يُباعد بينها وبين excellence."
        - text: "«الشَّرَفُ والسُّمُوُّ والعِزَّةُ، خِلَافُ الذِّلَّة والضَّعَة»"
          source: "المعجم الكبير (OCR)"
          conflict: "المعجم الكبير يؤكد انصراف الرفعة إلى الشرف الاجتماعي لا إلى صفة الجودة المجردة."

    - lemma: "الفَضِيلَة"
      contradicts:
        - text: "«الدرجة الرفيعة في حسن الخلق، وفضيلة كل شيء صفته الطيبة الحسنة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعنى الغالب للفضيلة هو التميز الأخلاقي (حسن الخلق) وليس التفوق النوعي العام؛ توظيفها بمعنى excellence العام يصطدم بالاستعمال الفلسفي/الأخلاقي الراسخ."
        - text: "«الفضيلة: المزية الغير المتعدية أي المزية المقتضية في تحققها بحسب مفهومها التعدي ووصول الأثر...»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "الاستعمال الاصطلاحي للفضيلة في الكتب الفلسفية يُرسّخها في دلالة الفضيلة الأخلاقية (virtue) المغايرة لـexcellence."
      expands:
        - text: "«الفضيلةُ: مَا يحصل بِهِ للإنسان مزية على غَيره متوصلا بِهِ إِلَى السَّعَادَة»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يُفيد المزية التنافسية وهو قريب من excellence، لكنه مقيّد بالغاية (الوصول إلى السعادة) مما يجعله أضيق."


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "امْتِيَاز"
      decision: confirmed
      decision_reason: >
        الشواهد المعجمية تؤكد دلالته على 'ظهور الفضل والانفصال' وترجمته
        الأجنبية excellence (المورد الحديث). الجذر ميز يدل على التمييز
        والانفراد وهو أساس صالح للدلالة على التميز النوعي. الاستعمال المعاصر
        راسخ في التقييم الأكاديمي والمؤسسي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على بُعد الانفراد والتمايز عن الأقران (من ميَّز = فصل وأبان)،
        مما يجعله يُعبّر عن التفوق من منظور الانفراد والتمايز الكمّي
        والنوعي عن الآخرين؛ أكثر استخداماً في التقييمات والمقارنات الرسمية.

    - lemma: "بَرَاعَة"
      decision: confirmed
      decision_reason: >
        أقوى الثلاث توثيقاً في المصادر الكلاسيكية؛ 'كمال الفضل' تعبير دقيق
        يلتقط بُعد الكمال الذاتي في excellence. كشاف التهانوي يترجمها صراحةً
        بـExcellence. لا تعارض جوهري في الأدلة، والبُعد البلاغي الإضافي
        (براعة الاستهلال) لا يُبطل الدلالة الأصلية العامة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على كمال الفضل وإتقان الأداء؛ تنطوي على بُعد عملي تطبيقي
        (مهارة + فوق) وهي الأنسب لوصف التفوق في ضرب من العلم أو الفن
        أو الصنعة. تشي بالتميز الذاتي الباطن لا المقارنة الخارجية فحسب.

    - lemma: "تَفَوُّق"
      decision: confirmed
      decision_reason: >
        المصدر تَفَوُّق من فاق (عَلَا وارتفع) موثّق في المقاييس والمعاجم
        بدلالة العلو والتجاوز. الرفض الوارد في معجم الصواب يخص الفعل
        المتعدي بـ'على' وليس المصدر الاسمي. تَفَوُّق بوصفه اسماً للنوعية
        والسمو النوعي مستعمل في العربية الحديثة استعمالاً واسعاً معقولاً.
        يُحتفظ به مع الإشارة إلى طابعه الديناميكي التنافسي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن الفوقية المقارنة الديناميكية (فاق أصحابه = تجاوزهم) لا
        عن الكمال الذاتي الساكن؛ أنسب في سياق المنافسة والتفوق على الأنداد،
        وهو أوسع تداولاً في المقامات التعليمية والرياضية والمهنية.

    - lemma: "الإِجَادَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شاهد معجمي في قاعدة البيانات. فضلاً عن ذلك، الإجادة
        (إتيان الشيء جيداً) تُعبّر عن جودة الأداء لا عن 'صفة التميز
        النوعي الذاتي' كحالة. لا تتوفر لها درجة التثبيت المعجمي الكافية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "النَّبَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        النبالة في المعاجم = 'الذكاء والنجابة والشرف' مع اشتراك في نفس
        الصيغة مع 'حرفة صانع النبال'؛ هذا التشابك الدلالي يضرّ بالوضوح.
        علاوةً على ذلك، النبالة تنصبّ على التميز الفطري والأخلاقي للشخص
        وليس على صفة الجودة النوعية بمفهومها الشامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "الرِّفْعَة"
      source: stage1
      decision: removed
      decision_reason: >
        الرفعة في جميع المصادر المُستعلَمة تنصرف إلى 'الشرف وارتفاع القدر
        والمنزلة' أي علو المكانة الاجتماعية، لا الجودة الذاتية للشيء أو
        الشخص. التوظيف المجازي للدلالة على excellence مجازفة بعيدة عن
        الاستعمال الراسخ.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الفَضِيلَة"
      source: stage1
      decision: removed
      decision_reason: >
        الفضيلة راسخة في التراث العربي بدلالة الفضيلة الأخلاقية (virtue)
        لا excellence العامة. الاستعمال الفلسفي والديني الراسخ يجعل توظيفها
        لتغطية معنى excellence تضييقاً يُوجِد التباساً مع virtue وليس توسيعاً
        مقبولاً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


