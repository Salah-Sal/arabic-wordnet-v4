stage1_review:
  assessment:
    concerns:
      - "اللمّة «إثارة» ترد في التعريف نفسه («صفة الجاذبية والإثارة»)، مما يُوقع التعريفَ في الدور المعيب"
      - "اللمّة «جاذبية طاغية» عبارةٌ وصفيةٌ حرّة لا تجتاز اختبار السكّ: يمكن إبدال «طاغية» بـ«قوية» أو «شديدة» مع بقاء التعبير صالحاً وصفاً، فهو مركّب حرّ لا مصطلح مثبَّت"
      - "المجموعة تفتقر إلى لمّات عربية فصيحة مستقرة تُعبّر عن الجاذبية الجنسية الشهوانية بوصفها صفةً جوهريةً"
    observations: >
      المجموعة تعبّر عن مفهوم «الجاذبية الشهوانية» بوصفها صفةً ذاتيةً في الشخص أو الشيء،
      وهو مفهوم له جذور راسخة في التراث العربي. الفصيح الأدق هو «الفتنة» بدلالتها المعجمية
      الموثّقة «الإعجاب بالشيء والاستهتار به»، و«الشهوانية» بوصفها مصطلحاً حديثاً مستنبطاً
      من جذر شهو ويُقابل «voluptuousness» مباشرةً. اللمّتان الموجودتان لا تلتقطان المفهومَ
      بدقة: «إثارة» تصف الفعلَ لا الصفةَ الجوهرية، و«جاذبية طاغية» عبارة وصفية لا مصطلح مسكوك.
  blind_candidates:
    - lemma: "فِتْنَة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من المعنى الأصلي «الابتلاء والاختبار» إلى «الجمال الأسير الذي يفتن
        القلوب ويستهوي الرغبات»؛ اللفظ حيٌّ في الاستعمال الأدبي والشعري الفصيح بهذا المعنى
        منذ العصر الجاهلي، وهو من إحياء الألفاظ التراثية للإزاحة الدلالية
    - lemma: "إِغْرَاء"
      generation_method: ishtiqaq
      justification: >
        مصدر إفعال من الجذر غ-ر-ي، يدل على الاستمالة والتجاذب وإيقاع الآخر في شَرَك الرغبة؛
        وزن إفعال يؤدي وظيفة المصدر الدال على الفعل المتعدي المعدَّى بالتحريض
    - lemma: "فُتُونَة"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فُعولة من الجذر ف-ت-ن، يُشتقّ اطّراداً للدلالة على الصفة المجرّدة
        (كالحُلوة والعُذوبة والفُتُوّة)؛ يُفيد «صفة كونه فاتناً آسراً» دون أن يكون موصوفاً
        بشخص بعينه
    - lemma: "شَهْوَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «شهواني» المنسوب إلى «شهوة»، على وزن المصادر الصناعية الدالة على
        الخصائص المجرّدة (كالإنسانية والعقلانية)؛ يُقابل مباشرةً البُعد الجنسي الحسي من
        التعريف ويلتقط «voluptuousness» بدقة


stage2_evidence:
  per_lemma:
    - lemma: "إثارة"
      expands:
        - text: "«إثارة: excitement»"
          source: "المعجم الطبي الموحد 2009 (أرابترم)"
          addition: "يثبت استعمال «إثارة» لمعنى الإثارة الفسيولوجية العامة، لا صفةَ الجاذبية الجنسية الذاتية"
        - text: "«إثارة: excitation»"
          source: "المعجم الموحد لمصطلحات علم الأحياء 1993 (أرابترم)"
          addition: "يؤكد انحصار التوثيق في حقل علم الأحياء بمعنى التنبيه الفسيولوجي، بعيداً عن دلالة المجموعة"

    - lemma: "جاذبية طاغية"
      expands:
        - text: "«جاذبية: attractiveness — جودة المرافق والخدمات المقدمة في المنطقة»"
          source: "المعجم الموحد لمصطلحات النقل 2010 (أرابترم)"
          addition: "يثبت «جاذبية» وحدها بمعنى الجذب العام، دون «طاغية» كجزء من مركّب اصطلاحي مثبَّت"
        - text: "«attractiveness: جاذبية؛ فتنة؛ سِحر»"
          source: "المورد الحديث 2008 (أرابترم)"
          addition: "المورد يُترجم «attractiveness» بـ«جاذبية» مفردةً ضمن قائمة مرادفات لا بـ«جاذبية طاغية»، مما يُضعف تثبيت المركّب"

    - lemma: "فِتْنَة"
      confirm:
        - text: "«الفِتْنَةُ: الاختبارُ بالنار، الابتلاء، الإعجاب بالشيء والاستهتار به، التولُّه بالشيء»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(الْفِتْنَة) الاختبار بالنَّار والابتلاء... والإعجاب بالشَّيْء والاستهتار بِهِ والتدله»"
          source: "المعجم الوسيط (حوراماني)"
        - text: "«الفتنة فتَنَه: امتحنه... ومنه: الفتنة: لكل ما يختبر به عقل الإنسان وعزمه من لذة وألم. ومنه: فتنَتْهُ المرأةُ: دلّه عليها»"
          source: "مفردات القرآن للفراهي"
        - text: "«allure: (1) يُغْرِي؛ يَفْتِن (2) إغراء؛ فِتنة»"
          source: "المورد الحديث 2008 (أرابترم)"
        - text: "«attractiveness: جاذبية؛ فتنة؛ سِحر»"
          source: "المورد الحديث 2008 (أرابترم)"
      expands:
        - text: "«(فَتَنَ) الْفَاءُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاءٍ وَاخْتِبَارٍ. مِنْ ذَلِكَ الْفِتْنَةُ. يُقَالُ: فَتَنْتُ أَفْتِنُ فَتْنًا. وَفَتَنْتُ الذَّهَبَ بِالنَّارِ إِذَا امْتَحَنْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يثبت أصل الجذر (الابتلاء والاختبار) الذي امتدّت دلالته إلى الإعجاب والاستهواء والتوله"

    - lemma: "إِغْرَاء"
      confirm:
        - text: "«إغراء: seduction»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — أرابترم"
        - text: "«إغراء: seduction»"
          source: "المعجم الموحد لمصطلحات القانون 2017 (أرابترم)"
      contradicts:
        - text: "«الإغراء (فِي النَّحْو): تَنْبِيه الْمُخَاطب على أَمر مَحْمُود ليلزمه. يُقَال: أَخَاك أَخَاك، والمروءة والنجدة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "الاستعمال الكلاسيكي الفصيح لـ«إغراء» في المعجم الوسيط مصطلحٌ نحوي بحت لا صلة له بالجاذبية الجنسية"
        - text: "«الإغراء: (في الانكليزية) Incitation — بالراء المهملة عند النحاة هو معمول الزم المقدر ويكون مكرراً مثل التحذير»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "يؤكد أن الاستعمال المعجمي الأصيل والمستقر لـ«إغراء» نحوي، لا شهواني ولا جمالي"

    - lemma: "فُتُونَة"
      evidence_status: "no_material_found"

    - lemma: "شَهْوَانِيَّة"
      confirm:
        - text: "«voluptuousness: (1) الشَّهوانيّة؛ الحِسِّيّة (2) القُدرة على إبهاج الحواسّ»"
          source: "المورد الحديث 2008 (أرابترم)"
        - text: "«شهوانية: sensualism»"
          source: "المعجم الطبي الموحد 2009 (أرابترم)"
      expands:
        - text: "«(شَهَوَ) الشِّينُ وَالْهَاءُ وَالْحَرْفُ الْمُعْتَلُّ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الشَّهْوَةُ. يُقَالُ: رَجُلٌ شَهْوَانُ، وَشَيْءٌ شَهِيٌّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُقرّر أن «الشهوة» هي الكلمة الجوهرية الوحيدة في هذا الجذر، مما يُثبت صحة الاشتقاق الصناعي «شهوانية»"


stage3_analysis:
  per_lemma:
    - lemma: "إثارة"
      decision: removed
      decision_reason: >
        ثلاثة أسباب متضافرة: (١) اللمّة ترد في التعريف ذاته فيقع التعريف في الدور المعيب.
        (٢) «إثارة» مصدر للفعل المتعدي يدل على فعل الإثارة لا على صفة كون الشخص جذاباً؛
        المجموعة تصف حالاً ذاتية لا فعلاً موجَّهاً للغير. (٣) لا توجد شواهد معجمية كلاسيكية
        تُثبت «إثارة» بمعنى «صفة الجاذبية الجنسية الذاتية».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جاذبية طاغية"
      decision: removed
      decision_reason: >
        فشل في اختبار السكّ والتثبيت المعجمي: يمكن إبدال «طاغية» بـ«شديدة» أو «قوية» أو
        «عارمة» مع بقاء التعبير صالحاً وصفاً، مما يكشف أنه مركّب وصفي حرّ لا وحدة معجمية
        ثابتة. المورد الحديث يُترجم «attractiveness» بـ«جاذبية» مفردةً لا بهذا المركّب.
        يُضاف غياب التشكيل وعدم التوثيق المعجمي لهذه الصيغة المحدّدة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فِتْنَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        شواهد معجمية وافرة من المعجم الوسيط ومفردات القرآن للفراهي والمورد الحديث تُثبت
        الدلالة الشهوانية الآسرة. الإزاحة الدلالية من «الابتلاء والاختبار» إلى «الإعجاب
        والتوله» مؤصَّلة في المعاجم الكلاسيكية والحديثة على حدٍّ سواء. اختبار السكّ: كلمة
        مفردة لا تحتمل الإبدال. اختبار الاشتقاقية: وزن فِعلة مناسب للمصادر الدالة على
        الأحوال والصفات. اختبار الملاءمة الصرفية: مجرّد اسمي يصف الحال الجوهرية. فحص
        اللهجية: فصيحة راسخة. قاعدة إيثار التراثي: متحقّقة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز على التأثير الآسر والساحر في الآخرين وسلب إرادتهم؛ أكثر شيوعاً في السياقين
        الأدبي والشعري؛ قد تشمل جمال الشخصية والهيئة والأسلوب معاً لا الجسد وحده؛ يحمل
        اللفظ ظلالاً من الخطورة والتوتر الأخلاقي غائبة في «شهوانية»
      actions:
        - command: create_entry
          params:
            lemma: "فِتْنَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05218088-n"

    - lemma: "إِغْرَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال المعجمي الكلاسيكي الراسخ لـ«إغراء» في المعجم الوسيط وكشاف الفنون مصطلح
        نحوي (تنبيه المخاطب على أمر محمود) لا صلة له بالجاذبية الشهوانية. الأدلة الحديثة
        تُثبت معنى الإيقاع والإغواء لكنه يبقى فعلاً موجَّهاً للغير لا صفةً جوهرية. «فتنة»
        أدق وأكثر تأصيلاً لهذا المعنى تحديداً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "فُتُونَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود لهذه اللمّة في أي من قواعد البيانات المعجمية المستعلَمة (107 معجم، 760 ألف
        مدخل). الوزن الصرفي فُعولة قياسيٌّ لكن الكلمة غير مسكوكة ولا مثبّتة في الاستعمال
        الفصيح المعاصر أو الكلاسيكي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "شَهْوَانِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        توثيق صريح في المورد الحديث كترجمة مباشرة لـ«voluptuousness» بدلالتين: «الشهوانية؛
        الحسية» و«القدرة على إبهاج الحواس». الجذر الاشتقاقي (شهو) مؤصَّل في مقاييس اللغة
        على أنه «كلمة واحدة وهي الشهوة». اختبار التعبير المركب: كلمة مفردة. اختبار الاشتقاق:
        مصدر صناعي مطّرد قياسي. اختبار الملاءمة: المصدر الصناعي (-ية) وظيفته تحويل أي أساس
        إلى مفهوم مجرد — وهو المطلوب هنا.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز على البُعد الحسي الجسدي الجنسي تحديداً بما يُطابق «voluptuousness»؛ مستعملة
        في السياق الأكاديمي والتقني والطبي؛ تشير إلى قدرة الشيء أو الشخص على إثارة المتعة
        الحسية وإبهاج الحواس؛ أكثر تخصصاً في الدلالة الجنسية وأقل ظلالاً أخلاقيةً من «فتنة»
      actions:
        - command: create_entry
          params:
            lemma: "شَهْوَانِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05218088-n"


