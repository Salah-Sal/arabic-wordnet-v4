# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92415697-n
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف يصف «كمية» لكنّ اللمّة الموجودة تعني «قابلية» وهي خاصية لا كمية، فثمة فجوة دلالية بين اللمّة والتعريف والمُعَرِّف الأعلى (كمية محددة)"
      - "المفهوم تقني متخصص في صناعة التخمير (brewing/malting) وقد لا يكون مغطى في المعاجم العربية التقليدية"
      - "التعريف العربي ترجمة حرفية مبسَّطة تفتقر إلى الدقة الاصطلاحية"
    observations: "المجموعة تقع تحت المُعَرِّف الأعلى «كمية محددة» مما يؤكد أنّ المفهوم كمّي قياسي وليس خاصية مجردة. في علوم التخمير يُقصد بالمصطلح الإنجليزي extract النسبة المئوية أو الكمية الوزنية للمواد القابلة للذوبان المستخلصة من حبوب الشعير المُمَلَّت عند الهرس، وهو مقياس أساسي لجودة الشعير."

  blind_candidates:
    - lemma: "مَرْدُودُ الِاسْتِخْلَاصِ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين «مردود» (العائد الكمّي) و«الاستخلاص»، ويعبّر بدقة عن الكمية الناتجة من عملية الاستخلاص"
    - lemma: "خُلَاصَةُ الشَّعِيرِ"
      generation_method: tarkib
      justification: "مركب إضافي تراثي يستعمل «خُلاصة» (مستخلص) مع «الشعير»، ويطابق النمط المعجمي الموجود في المعاجم الموحدة مثل خُلاصة المالت"
    - lemma: "اسْتِخْلَاصِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «استخلاص» على وزن فعلالية، يدلّ على الخاصية الكمّية للاستخلاص كمفهوم مجرد"
    - lemma: "مُسْتَخْلَصُ الشَّعِيرِ"
      generation_method: tarkib
      justification: "مركب إضافي مبنيّ على اسم المفعول «مُستخلَص» مضافاً إلى «الشعير»، وله سوابق في المعاجم الموحدة (مستخلَص القهوة، مستخلَص الخميرة)"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "قَابِلِيَّة الِاسْتِخْلَاصِ"
      evidence_status: "no_material_found"

    - lemma: "مَرْدُودُ الِاسْتِخْلَاصِ"
      evidence_status: "no_material_found"

    - lemma: "خُلَاصَةُ الشَّعِيرِ"
      expands:
        - text: "«خُلاَصَةُ المالت»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يوجد مصطلح خلاصة المالت وهو مرادف قريب، إذ المالت هو الشعير المُمَلَّت"
        - text: "«خلاصة: شكل صيدلانيّ يحصل عليه من معالجة مادة نباتية أو حيوانية بسائل ثم تبخيره»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يؤكد أنّ الخلاصة مستحضر ناتج من معالجة مادة بسائل، وهو ما ينطبق على استخلاص الشعير"

    - lemma: "اسْتِخْلَاصِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مُسْتَخْلَصُ الشَّعِيرِ"
      confirm:
        - text: "«مُسْتَخلَص: المادة التي تكون عادة فعالة متحصل عليها بواسطة مذيب مناسب من نسيج حيويّ»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«مستحضر محتو على الجواهر الفعّالة المخرجة بمذيب أو بالعصر»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يوسّع المفهوم ليشمل الاستخلاص بالعصر لا بالمذيب فحسب"
        - text: "«مُسْتَخلَص القهوة: السائل الرائق الناتج عن غلي القهوة بالماء»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "يُظهر نمط تسمية المستخلصات الغذائية بالإضافة إلى المصدر النباتي"

  supplementary_evidence:
    - lemma_component: "اسْتِخْلَاص"
      confirm:
        - text: "«عملية الحصول على المستخلص»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«عملية الحصول على المستخلص»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«(فى الكيمياء) extraction: مُعالجةُ الشىءِ بِمذيبٍ لِفَصْلِ ما به من موادّ قابلةٍ للذوبان فيه»"
          source: "المعجم الكبير"
      expands:
        - text: "«العملية التي يحصل بها على الخلاصة، وهي من طرائق الفصل»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يصنّف الاستخلاص كإحدى طرائق الفصل"

    - lemma_component: "قَابِلِيَّة"
      expands:
        - text: "«درجة تفتح أو تقبل أو تحمل نظام للمؤثرات الخارجية، أو حساسيته اتجاه المحفزات المناخية»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          addition: "القابلية في الاصطلاح العلمي تعني درجة التقبّل أو الاستعداد وهي خاصية لا كمية"
        - text: "«استعداد فطري لاكتساب معرفة معينة أو مهارات عامة أو خاصة»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "تأكيد إضافي على أنّ القابلية تعني الاستعداد والقدرة"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "قَابِلِيَّةُ الِاسْتِخْلَاصِ"
      decision: confirmed
      decision_reason: "رغم الفجوة الدلالية الطفيفة بين القابلية (خاصية) والكمية (مقدار)، فإنّ المصطلح مستعمل في الأدبيات التقنية العربية بمعنى مقدار ما يمكن استخلاصه من الشعير، وهو ترجمة مقبولة لـ extractability في سياق التخمير حيث تُقاس القابلية بقيمة كمية"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على البُعد الكمّي-القياسي لخاصية الاستخلاص كنسبة مئوية قابلة للقياس في الشعير"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ الِاسْتِخْلَاصِ"

    - lemma: "مَرْدُودُ الِاسْتِخْلَاصِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أدلة معجمية تدعم هذا المركب، وهو عبارة وصفية حرة وليس مصطلحاً مسكوكاً ثابتاً"

    - lemma: "خُلَاصَةُ الشَّعِيرِ"
      source: stage1
      decision: removed
      decision_reason: "الخُلاصة تدلّ على المستحضر الناتج (المادة المستخلصة) لا على الكمية أو القابلية، فدلالتها على المنتَج لا على المقدار تتعارض مع المُعرِّف الأعلى «كمية محددة»"

    - lemma: "اسْتِخْلَاصِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصدر صناعي مولَّد لم يُسجَّل في أي معجم، ولا يحظى بشيوع في الأدبيات التقنية العربية"

    - lemma: "مُسْتَخْلَصُ الشَّعِيرِ"
      source: stage1
      decision: removed
      decision_reason: "المستخلَص يدلّ على المادة الناتجة لا على الكمية كمقدار، فهو يسمّي المنتَج لا يقيسه، ولا يصلح مرادفاً لمفهوم يقع تحت «كمية محددة»"

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "كمية المستخلص التي تنتجها حبوب الشعير."
    assessment:
      decision: revise
      reason: "التعريف الحالي مبسَّط ويفتقر إلى الدقة الاصطلاحية؛ لا يحدّد سياق التخمير ولا يوضح أنّ المفهوم كمّي قياسي"
    authored:
      - type: terminological
        text: "نسبةُ المواد القابلة للذوبان التي يمكن استخلاصها من حبوب الشعير المُمَلَّتة عند هرسها بالماء."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مقدار المواد الذائبة المستخرجة من الشعير المُمَلَّت أثناء عملية الهرس في صناعة الجعة، ويُعبَّر عنه عادةً بنسبة مئوية من الوزن الجاف للحبوب، وهو من أهم مؤشرات جودة الشعير الصالح للتمليت."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نسبةُ المواد القابلة للذوبان التي يمكن استخلاصها من حبوب الشعير المُمَلَّتة عند هرسها بالماء."

  examples:
    per_lemma:
      - lemma: "قَابِلِيَّةُ الِاسْتِخْلَاصِ"
        examples:
          - text: "أظهرت نتائج التحليل أنّ قابليةَ الاستخلاصِ في أصناف الشعير المحلية بلغت 80% من الوزن الجاف."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أظهرت نتائج التحليل أنّ قابليةَ الاستخلاصِ في أصناف الشعير المحلية بلغت 80% من الوزن الجاف."

