# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-07959922-n (ancients)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «الأسلاف» تدلّ على الأجداد والآباء المتقدمين (علاقة نسبية)، بينما المفهوم المقصود هو «أهل العصور الغابرة» (علاقة زمنية مطلقة)"
      - "التعريف العربي ترجمة حرفية للإنجليزي، يمكن تحسينه بأسلوب معجمي عربي"
      - "المجموعة تفتقر إلى لمّة تدلّ على المفهوم دلالةً مباشرة دون إيهام بصلة القرابة"
    observations: "المجموعة تمثّل مفهوماً تاريخياً يُشير إلى الشعوب التي عاشت في الحقب القديمة، ولا سيّما قبل سقوط الإمبراطورية الرومانية. «قدماء» هي اللمّة الأنسب لأنها جمع «قديم» المستخدم صفةً جوهرية للدلالة على البُعد الزمني. أمّا «الأسلاف» فدلالتها الأساسية على النسب والسلالة لا على الحقبة التاريخية."
  blind_candidates:
    - lemma: "قُدَمَاء"
      generation_method: ishtiqaq
      justification: "جمع «قديم» على وزن فُعَلاء، يدلّ على أهل الأزمنة الغابرة دلالةً مباشرة"
    - lemma: "الأَوَّلُون"
      generation_method: ishtiqaq
      justification: "جمع «أوّل»، يُستعمل في القرآن والتراث للدلالة على الأمم السابقة: ﴿قَالَ فَمَا بَالُ الْقُرُونِ الأُولَى﴾"
    - lemma: "قُدَامَى"
      generation_method: ishtiqaq
      justification: "جمع بديل لـ«قديم» على وزن فُعَالَى، مُثبت في المعجم الوسيط"
    - lemma: "سَالِفُون"
      generation_method: ishtiqaq
      justification: "جمع «سالف» من جذر س-ل-ف الدالّ على التقدّم والسبق، يُستعمل للمتقدمين زمنياً"

stage2_evidence:
  per_lemma:
    - lemma: "الأَسْلَاف"
      confirm:
        - text: "«السّلف: الآباء المتوفّون، والسبق والقدماء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«السَّلَفُ: الجماعة المتقدمون ... وهم الماضون»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«كلّ من تقدّمك من آبائك وذوي قرابتك في السنّ أو الفضل»"
          source: "المعجم الوسيط"
          conflict: "التعريف يحصر السلف في الآباء وذوي القرابة، أي علاقة نسبية لا زمنية مطلقة"
      expands:
        - text: "«السِّينُ وَاللَّامُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى تَقَدُّمٍ وَسَبْقٍ. مِنْ ذَلِكَ السَّلَفُ: الَّذِينَ مَضَوْا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي عامّ (التقدّم والسبق) لكنّ الاستعمال المعجمي خصّصه بالآباء والأقارب"
    - lemma: "قُدَمَاء"
      confirm:
        - text: "«الْقَدِيمُ: مَا مضى على وجوده زمن طويل (ج) قدماء وقدامى»"
          source: "المعجم الوسيط"
        - text: "«الْقِدَمُ: خِلَافُ الْحُدُوثِ. وَيُقَالُ: شَيْءٌ قَدِيمٌ، إِذَا كَانَ زَمَانُهُ سَالِفًا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«صراع القدماء والمحدَثين: صراع ينشب بين الأجيال حول ممارسات أدبية»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "الأَوَّلُون"
      evidence_status: "no_material_found"
    - lemma: "قُدَامَى"
      confirm:
        - text: "«الْقَدِيمُ: مَا مضى على وجوده زمن طويل (ج) قدماء وقدامى»"
          source: "المعجم الوسيط"
    - lemma: "سَالِفُون"
      confirm:
        - text: "«السَّلَفُ: الَّذِينَ مَضَوْا. وَالْقَوْمُ السُّلَّافُ: الْمُتَقَدِّمُونَ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«كلّ من تقدّمك من آبائك وذوي قرابتك في السنّ أو الفضل»"
          source: "المعجم الوسيط"
          conflict: "الارتباط بالنسب والقرابة يجعل اللفظ أقرب إلى «أسلاف» منه إلى «قدماء»"

stage3_analysis:
  per_lemma:
    - lemma: "الأَسْلَاف"
      decision: removed
      decision_reason: "الدلالة المعجمية المركزية لـ«الأسلاف» هي الآباء والأقارب المتقدمون (علاقة نسبية)، لا أهل العصور الغابرة بإطلاق. المفهوم المقصود (ancients) يُشير إلى حقبة تاريخية لا إلى صلة قرابة. والمعجم الوسيط صريح في تقييد السلف بالآباء وذوي القرابة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قُدَمَاء"
      decision: confirmed
      decision_reason: "جمع «قديم» الدالّ على البُعد الزمني المطلق، وهو الترجمة الدقيقة لـancients. مُثبت في المعجم الوسيط ومستعمل في السياقات التاريخية (قدماء المصريين، قدماء اليونان)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على أهل الأزمنة الغابرة بوصفهم جماعة تاريخية، دون إيحاء بصلة قرابة أو نسب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُدَمَاء"

    - lemma: "الأَوَّلُون"
      source: stage1
      decision: removed
      decision_reason: "مفرطة العموم؛ تعني «الأوائل» في أيّ سياق (الأوّلون في العلم، الأوّلون في السباق...) ولا تتخصّص بأهل العصور القديمة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "قُدَامَى"
      source: stage1
      decision: confirmed
      decision_reason: "جمع بديل مُثبت لـ«قديم» في المعجم الوسيط (ج: قدماء وقدامى)، يؤدّي الدلالة ذاتها ويُستعمل في النصوص التاريخية والأدبية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "جمع بديل لـ«قديم» على وزن فُعَالَى، يُستعمل في السياقات الأدبية والتاريخية بالتبادل مع «قدماء»"
      actions:
        - command: create_entry
          params: {lemma: "قُدَامَى", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "سَالِفُون"
      source: stage1
      decision: removed
      decision_reason: "من جذر س-ل-ف نفسه، يحمل الإشكال ذاته الذي في «الأسلاف»: الارتباط بالنسب والقرابة لا بالحقبة الزمنية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

