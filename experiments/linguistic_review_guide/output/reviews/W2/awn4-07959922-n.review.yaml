      decision: revise
      reason: "التعريف الحالي ترجمة حرفية للإنجليزي، يحتاج إلى صياغة معجمية عربية أصيلة"
    authored:
      - type: terminological
        text: "جماعةٌ من الناس عاشوا في العصور الغابرة، ولا سيّما في الحقبة السابقة لسقوط الإمبراطورية الرومانية الغربية"
