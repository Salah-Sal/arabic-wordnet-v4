stage1_review:
  assessment:
    concerns:
      - المجموعة تحتوي على لمّة واحدة فقط هي تعبير مركب وصفي.
      - التعريف الحالي "مُشغل للمصعد" بسيط جداً ويفتقر للصياغة المعجمية المتينة.
    observations: "المفهوم يشير إلى مهنة فنية/خدمية متخصصة في تشغيل المصاعد الكهربائية في المنشآت الكبيرة (الفنادق، المستشفيات). المصطلح 'عامل مصعد' هو الأكثر شيوعاً، ولكن هناك مرادفات تستخدم في السياقات الوظيفية الرسمية."
  blind_candidates:
    - lemma: "عَامِلُ مِصْعَدٍ"
      generation_method: tarkib
      justification: "التعبير الأكثر شيوعاً ومباشرة للمفهوم (عامل + الآلة التي يعمل عليها)."
    - lemma: "مُشَغِّلُ مِصْعَدٍ"
      generation_method: ishtiqaq
      justification: "اشتقاق من 'شغل' بناءً على طبيعة الوظيفة (تشغيل الآلة)."
    - lemma: "سَائِقُ مِصْعَدٍ"
      generation_method: majaz
      justification: "استخدام مجازي شائع في التصنيفات الوظيفية العربية، حيث يُعامل المصعد كمركبة تُقاد بين الطوابق."
    - lemma: "خَادِمُ مِصْعَدٍ"
      generation_method: tarkib
      justification: "يُستخدم في السياقات الفندقية والخدمية الراقية للتأكيد على الجانب الخدمي للوظيفة."

stage2_evidence:
  per_lemma:
    - lemma: "عامل مصعد"
      confirm:
        - text: "عامل مصعد: lift attendant"
          source: "ArabTerm - مسرد الفن والتسلية والرياضة"
    - lemma: "مصعدي"
      contradicts:
        - text: "مصعدي: anodic, anodal"
          source: "المعجم الطبي الموحد / معجم المصطلحات المهنية"
          conflict: "المصطلح تقني كهربائي/كيميائي ولا يشير إلى الشخص."
    - lemma: "مشغل مصعد"
      evidence_status: "no_material_found"
    - lemma: "سائق مصعد"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عامل مصعد"
      decision: confirmed
      decision_reason: "مصطلح قياسي وموثق في معاجم المصطلحات الحديثة (ArabTerm) لترجمة lift attendant."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِلُ مِصْعَدٍ"
    - lemma: "مُشَغِّلُ مِصْعَدٍ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق تقنياً ويتسق مع تعريف المجموعة والمجموعة الأعلى (hypernym: مشغل)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "مُشَغِّلُ مِصْعَدٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "سَائِقُ مِصْعَدٍ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير وظيفي شائع الاستخدام في الملاكات الإدارية لعدد من الدول العربية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "سَائِقُ مِصْعَدٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "مُشغل للمصعد"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويحتاج لصياغة معجمية توضح طبيعة الدور الوظيفي."
    authored:
      - type: terminological
        text: "شخصٌ مَوْكُولٌ إليهِ تشغيلُ المِصْعَدِ الكَهْرُبائيِّ ومُرافَقَةُ الرُّكَّابِ فيهِ بَيْنَ الطَّوابِقِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شخصٌ مَوْكُولٌ إليهِ تشغيلُ المِصْعَدِ الكَهْرُبائيِّ ومُرافَقَةُ الرُّكَّابِ فيهِ بَيْنَ الطَّوابِقِ."}
  examples:
    per_lemma:
      - lemma: "عَامِلُ مِصْعَدٍ"
        examples:
          - text: "اسْتَفْسَرَ السَّائِحُ مِنْ عَامِلِ المِصْعَدِ عَنْ مَوْقِعِ صَالَةِ الطَّعَامِ."
            type: usage
      - lemma: "مُشَغِّلُ مِصْعَدٍ"
        examples:
          - text: "تَعْمَلُ المُسْتَشْفَى عَلَى تَوْظِيفِ مُشَغِّلِ مِصْعَدٍ لِتَسْهِيلِ حَرَكَةِ نَقْلِ المَرْضَى."
            type: usage
      - lemma: "سَائِقُ مِصْعَدٍ"
        examples:
          - text: "يَقِفُ سَائِقُ المِصْعَدِ بِزِيِّهِ الرَّسْمِيِّ مُرَحِّبًا بِزُوَّارِ الفُنْدُقِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "اسْتَفْسَرَ السَّائِحُ مِنْ عَامِلِ المِصْعَدِ عَنْ مَوْقِعِ صَالَةِ الطَّعَامِ."}

stage5_enrichment:
  per_entry:
    - lemma: "عَامِلُ مِصْعَدٍ"
      entry_id: "{auto}"
      roots:
        - word: "عامل"
          root: "عمل"
          maqayis_quote: "«الْعَيْنُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ، وَهُوَ عَامٌّ فِي كُلِّ فِعْلٍ يُفْعَلُ.»"
        - word: "مصعد"
          root: "صعد"
          maqayis_quote: "«الصَّادُ وَالْعَيْنُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَمَشَقَّةٍ.»"
    - lemma: "مُشَغِّلُ مِصْعَدٍ"
      entry_id: "{auto}"
      roots:
        - word: "مشغل"
          root: "شغل"
          maqayis_quote: "«الشِّينُ وَالْغَيْنُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الْفَرَاغِ.»"
        - word: "مصعد"
          root: "صعد"
          maqayis_quote: "«الصَّادُ وَالْعَيْنُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَمَشَقَّةٍ.»"
    - lemma: "سَائِقُ مِصْعَدٍ"
      entry_id: "{auto}"
      roots:
        - word: "سائق"
          root: "سوق"
          maqayis_quote: "«السِّينُ وَالْوَاوُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ حَدْوُ الشَّيْءِ.»"
        - word: "مصعد"
          root: "صعد"
          maqayis_quote: "«الصَّادُ وَالْعَيْنُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَمَشَقَّةٍ.»"
  per_sense:
