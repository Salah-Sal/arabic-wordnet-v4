# مراجعة المجموعة الترادفية awn4-13448654-n — adiabatic process
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان بدون تشكيل كامل"
      - "غياب الصيغة الأكثر شيوعاً في معاجم الفيزياء والكيمياء: «عملية كظيمة» (بوزن فَعِيلَة)"
      - "المصطلح المعرَّب «أديباتية» جذره الصرفي غير عربي (من اليونانية adiabatos)"
    observations: >
      المفهوم ديناميكي حراري دقيق يدل على تحوّل لا تُتبادَل فيه حرارة بين المنظومة ومحيطها.
      الجذر العربي «كظم» (الإمساك والحبس) نُقل مجازياً إلى حبس الحرارة، وهو اختيار موفق
      أقرّته مجامع اللغة العربية (ALECSO). يوجد تفاوت بين المعاجم في الصيغة الصرفية:
      كَظِيم (فَعِيل) في معاجم الفيزياء والكيمياء، وكَظْمِيّ (نسبة) في معجم الأرصاد الجوية.
      ينبغي تمثيل الصيغتين معاً.
  blind_candidates:
    - lemma: "عَمَلِيَّة كَظِيمَة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من كَظِيم (حابس الغيظ) إلى حابس الحرارة، على وزن فَعِيل المشهور
        بالدلالة على الثبوت والاستمرار، وهو الأكثر شيوعاً في معاجم الفيزياء والكيمياء
    - lemma: "تَحَوُّلٌ كَظْمِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «تحوُّل» (جنس أدق من عملية) و«كظمي» (نسبة إلى الكظم)،
        يستخدم «تحوّل» بديلاً لـ«عملية» تنويعاً مصطلحياً
    - lemma: "سَيْرُورَة لَاتَبَادُلِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من «سيرورة» (مرادف عملية) و«لاتبادلية» (صفة سلبية من التبادل الحراري)،
        على غرار ما ورد في معاجم علوم البحار (انضغاط لاتبادلي)
    - lemma: "أَدْيَبَاتِيَّة"
      generation_method: taarib
      justification: >
        تعريب المصطلح اليوناني adiabatos بصيغة المصدر الصناعي، يقبل ال- والنسبة والجمع،
        ملاذ أخير لكنه شائع في الأدبيات العلمية المترجمة


stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "عَمَلِيَّة أَدْيَبَاتِيَّة"
      confirm:
        - text: "«عملية (تحول) أديباتية — تحول ديناميكي حراري في نظام له عزل حراري لا يسمح بتبادل الحرارة بين النظام ومحيطه»"
          source: "مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«عملية لاأدياباتية — (انظر: عملية أدياباتية)»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«أديباتي — لغويا، يعني عدم المرور عبر؛ التغيرات في درجة الحرارة الناتجة عن تمدد أو انضغاط كتلة من الهواء مع عدم تبادل الحرارة مع الهواء المحيط. كظيم (المرادف العربي)»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يذكر المصدر أن «كظيم» هو المرادف العربي لـ«أديباتي»"

    - lemma: "عَمَلِيَّة كَظْمِيَّة"
      confirm:
        - text: "«عَمَلِيّة كَظْمِيَّة — adiabatic process»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
      expands:
        - text: "«كظمي، ذاتي — adiabatic»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
          addition: "يثبت أن «كظمي» صفة معتمدة لـ adiabatic في مجال الأرصاد الجوية"

    # ── مرشحات المرحلة ١ ──
    - lemma: "عَمَلِيَّة كَظِيمَة"
      confirm:
        - text: "«عملية كظيمة، إجراء كظيم — adiabatic process»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«عمليات كَظيمة — adiabatic processes»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«عملية كظيمة — adiabatic process — (انظر: نظام أدياباتي)»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«كَظِيم — متعلق بتفاعل أو عملية دينامية حرارية تحدث دون اكتساب أو فقدان حرارة»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«كَظيم — adiabatic»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«كَظيم — دون تبادل حراري»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"

    - lemma: "تَحَوُّلٌ كَظْمِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "سَيْرُورَة لَاتَبَادُلِيَّة"
      evidence_status: "no_material_found"

    - lemma: "أَدْيَبَاتِيَّة"
      expands:
        - text: "«أديباتي — adiabatic»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يرد كصفة لا كاسم مستقل"


