stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يحتوي على دوران معجمي: استخدام «عابثاً» في التعريف وهو مشتق من جذر لمّة «عبث»"
      - "«غير جاد أو عاقل» جمع غير متكافئ؛ عدم الجدية وعدم العقل درجتان متفاوتتان لا تتضمنهما كلمة frivolous معاً"
      - "اللمّة «عبث» في السياق الكلاسيكي تصف الفعل/النشاط لا السمة الشخصية، وقد يكون الرسم الدلالي فضفاضاً"
    observations: >
      المجموعة ترادفية تمثّل سمةً نفسيةً شخصية (character trait)، وأبوها المباشر
      «خصلة/سمة/صفة» يؤكد طابعها الصفاتي. المفهوم عربي الجذور بامتياز، ويزدهر
      في الأدب الأخلاقي والتراث الحكمي العربي. اللمّتان الحاليتان تنتميان إلى
      مجالَيْن دلاليَّيْن متمايزَيْن: «الطيش» يصف الاندفاع وخفة العقل كسمة
      راسخة، بينما «العبث» يصف نمطاً سلوكياً (الاشتغال بما لا ينفع) لا السمة
      الكامنة. كلا اللمّتين شائعتان في المعجمية الحديثة كمقابل لـ frivolity،
      غير أن التمييز الدلالي الدقيق بينهما يستحق التوثيق.

  blind_candidates:
    - lemma: "الخِفَّةُ"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فِعْلة من جذر خ-ف-ف، يدلّ في المجاز على خفة الطبع
        وعدم الرزانة. تعبير «خفة العقل» من أشيع التعابير لوصف الشخص
        الطائش، وهو تلازم اصطلاحي راسخ في التراث العربي.
    - lemma: "الرُّعُونَةُ"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر ر-ع-ن على وزن فُعُولة، يدلّ على ضعف التمييز
        والتسرّع في الأحكام، وهو قريب من عدم الجدية والاستهانة بالأمور.
    - lemma: "عَبَثِيَّةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «عبث» بزيادة ياء النسبة وتاء التأنيث، يحوّل الفعل
        إلى سمة مجردة؛ أدق من «العبث» المصدري الذي يصف الفعل في الأغلب،
        فتكون «عبثية» أوفق لتعبير عن الخُلُق لا النشاط.
    - lemma: "السَّفَاهَةُ"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر س-ف-ه على وزن فَعَالة، يدلّ على خفة الرأي والتسرّع
        والاستهانة بالأمور، وهو صفة راسخة في التراث المعجمي لوصف من لا
        يزن الأمور ولا يتحلّى بالجدية والرزانة.


