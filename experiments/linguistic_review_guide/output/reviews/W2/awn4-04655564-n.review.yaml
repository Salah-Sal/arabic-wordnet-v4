# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────

stage3_analysis:
  per_lemma:

    - lemma: "طيش"
      decision: confirmed
      decision_reason: >
        لمّة راسخة تماماً في التراث المعجمي الكلاسيكي والحديث لتعبير عن خفة
        العقل والاندفاع كسمة شخصية. تؤكدها ستة معاجم كلاسيكية وثلاثة حديثة،
        مع شواهد شعرية قديمة. وهي أفضل تعبير عربي صريح عن «سمة عدم الجدية
        والاندفاع» بوصفها خُلُقاً راسخاً، وتحتاج فقط تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
        type: native_arabic
      morphological_fitness: >
        مصدر من طاشَ يَطِيشُ — الوزن متناسب تماماً مع المصادر الدالة
        على الخصائص الطبعية الكامنة
      nuance_differentiation: >
        الطيش يصف السمة الطبعية الكامنة المتمثلة في خفة العقل والاندفاع
        وعدم التثبت (impulsive rashness as an innate character trait)؛ يُستعمل
        للحكم على الشخص من منظور طبعه وجِبِلَّته («فلان ذو طيش»).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَيْش"

    - lemma: "عبث"
      decision: confirmed
      decision_reason: >
        رغم أن التراث الكلاسيكي يُعرّف «العبث» فعلاً أو نشاطاً، فإن المورد
        الحديث (2008) يعادله صريحاً بـ frivolity وفريق واسع من المترجمين
        الحديثين يستخدمه بهذا المعنى. في العربية المعاصرة «عبث» يُستخدم
        للدلالة على نمط السلوك الطائش («يتعامل مع الأمر بعبث»). يُبقى
        مع توثيق الفارق الدلالي عن «الطيش» ومراجعة التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      loan_check:
        type: native_arabic
      morphological_fitness: >
        مصدر ثلاثي على فَعَل — صالح للدلالة على السمة بالاستخدام المتعارف
        حديثاً، وإن كان الأصل الدلالي الفعلي
      nuance_differentiation: >
        العبث يصف النمط السلوكي المتمثل في الاشتغال بما لا طائل منه
        والاستهانة بالجدي (frivolous conduct as a behavioral pattern)؛
        يُستعمل للحكم على الأفعال والتصرفات أكثر من الطبع («تعامَل مع
        الأمر بعبث» لا «هو شخص طائش الطبع»).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَبَث"

    - lemma: "الخِفَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        «الخفة» تصف أصالةً الخفة المادية، ومصادر من الوزن ذاته تُصرّح بأن
        استخدامها في العقل «مجازٌ». لا تصلح مدخلاً مفرداً في مجموعة السمات
        دون تقييد بـ«خفة العقل» (تعبير مركب)، فضلاً عن أن «الطيش» يغطي
        المعنى المطلوب بدقة أعلى وبلا التباس.

    - lemma: "الرُّعُونَةُ"
      source: stage1
      decision: removed
      decision_reason: >
        الرعونة في المعجمية العربية تعني الحمق والجهل (stupidity/folly) لا
        الطيش وعدم الجدية (frivolity). الفجوة الدلالية واسعة: الرعونة عيب في
        الفهم والتمييز، والطيش عيب في التوازن والرزانة. استبقاؤها يُدخل
        مفهوماً مستقلاً (AWN له مجموعة مستقلة للحمق) في هذه المجموعة.

    - lemma: "عَبَثِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي في قاعدة البيانات. ويزيد الأمر تعقيداً ارتباط
        «العبثية» في الاستخدام المعاصر بـ«مسرح العبث/الأدب العبثي»
        (Theater of the Absurd) وهو مفهوم فلسفي مغاير تماماً للسمة
        الشخصية المطلوبة. اعتمادها سيُحدث لبساً دلالياً خطيراً.

    - lemma: "السَّفَاهَةُ"
      source: stage1
      decision: removed
      decision_reason: >
        السفاهة تدلّ على الاستهانة بالحق وقُبح القول والفعل ذي الطابع
        الأخلاقي، وهي أقرب إلى «recklessness/moral rashness» منها إلى
        «frivolity» (عدم الجدية). المعنى التقييمي الأثقل في «السفاهة»
        يتجاوز ما تقتضيه المجموعة.


