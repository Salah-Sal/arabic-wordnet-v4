    - lemma: "طَيْش"
      entry_id: "{auto}"
      root: "طيش"
      maqayis_quote: "«الطَّاءُ وَالْيَاءُ وَالشِّينُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الطَّيْشُ وَالْخِفَّةُ. وَطَاشَ السَّهْمُ مِنْ هَذَا، إِذَا لَمْ يُصِبْ، كَأَنَّهُ خَفَّ وَطَاشَ وَطَارَ.»"

    - lemma: "عَبَث"
      entry_id: "{auto}"
      root: "عبث"
      maqayis_quote: "«الْعَيْنُ وَالْبَاءُ وَالثَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى الْخَلْطِ... وَمِمَّا قِيسَ عَلَى هَذَا: الْعَبَثُ، هُوَ الْفِعْلُ لَا يُفَعَلُ عَلَى اسْتِوَاءٍ وَخُلُوصِ صَوَابٍ. تَقُولُ: عَبِثَ يَعْبَثُ عَبَثًا، وَهُوَ عَابِثٌ بِمَا لَا يَعْنِيهِ وَلَيْسَ مِنْ بَالِهِ.»"

  per_sense:
    - lemma: "طَيْش"
      sense_id: "{auto}"
      nuance: >
        الطيش يصف السمة الطبعية الكامنة المتمثلة في خفة العقل والاندفاع وعدم
        التثبت (impulsive rashness as an innate character trait)؛ يُستعمل
        للحكم على الشخص من منظور طبعه وجِبِلَّته، كقولنا «فلان ذو طيش»،
        ويستحضر صورة السهم الطائش المنحرف عن الهدف — استعارة قديمة للغواية عن
        الصواب.
      mwe: false

    - lemma: "عَبَث"
      sense_id: "{auto}"
      nuance: >
        العبث يصف النمط السلوكي المتمثل في الاشتغال بما لا طائل منه والاستهانة
        بالجدي (frivolous conduct as a behavioral pattern)؛ يُستعمل للحكم على
        الأفعال والتصرفات أكثر من الطبع الكامن، كقولنا «يتعامل مع الأمر
        بعبث»، وهو أحدث استخداماً في سياق السمات الشخصية من «الطيش».
      mwe: false

  synset:
    cultural_fit: native

