# ── المرحلة ١: المراجعة والتوليد (الجزء الأعمى) ──────────────
stage1_review:
  assessment:
    concerns:
      - "مُنَاسَبَة مشتركٌ لفظيّ حاد: المعنى السائد في العربية المعاصرة هو «المناسبة الاجتماعية / الحفل / الفرصة»، وهو ما يُفضي إلى التباس دلاليّ في السياقات غير المتخصّصة."
      - "التعريف الحالي «صفة امتلاك الخصائص الصحيحة لغرض معين» يبدو نقلاً حرفياً (calque) للتعريف الإنجليزي ولا يرقى إلى أسلوب المعجم الوسيط."
      - "المجموعة تفتقر إلى أيّ أمثلة استعمالية."
    observations: >
      المجموعة تُعبِّر عن مفهوم «الملاءمة أو الصلاحية» بوصفه صفةً مجرَّدةً (نوعٌ من الجودة). اللمّتان الموجودتان
      — مُلَاءَمَة ومُنَاسَبَة — متجذِّرتان في التراث اللغوي العربي، غير أنّ مُنَاسَبَة تُعاني انزياحاً دلاليّاً
      في المعاصرة نحو معنى «الحَدَث / الفرصة». مُلَاءَمَة مدعومةٌ بشكل أقوى في المصطلحيّات التقنية والعلمية.
  blind_candidates:
    - lemma: "لِيَاقَة"
      generation_method: ishtiqaq
      justification: >
        من جذر ل-ي-ق على وزن فِعَالَة، والفعل «لاقَ بهِ الشيءُ» أي وافقه وناسبه؛ الوزن فِعَالَة
        يُنتج مصادر تدلّ على صفة ومَلَكَة. تُشير الدلالة الأصلية مباشرةً إلى كون الشيء مناسباً
        لشيء آخر، مما يجعلها مرشَّحاً طبيعياً للمفهوم.
    - lemma: "جَدَارَة"
      generation_method: ishtiqaq
      justification: >
        من جذر ج-د-ر على وزن فَعَالَة، و«جديرٌ بالأمر» أي حقيقٌ به وأهلٌ له؛ يدلّ على امتلاك
        المواصفات التي تجعل الشيء أو الشخص لائقاً بغرضٍ ما، وفي العربية يُقال «هو جديرٌ بهذا
        العمل» للدلالة على التوافر على الخصائص المناسبة.
    - lemma: "صَلَاحِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدرٌ صناعيٌّ من جذر ص-ل-ح، ومعناه الأصليّ كونُ الشيء صالحاً لوظيفة معيّنة؛ المعجم
        الكبير يُعرِّفها بـ«الاتِّساقُ والمناسبةُ لغرضٍ ما» وهو تعريفٌ مطابق للمفهوم المستهدَف.
        القياسُ الصرفيُّ سائغٌ ومجمعيُّ الإجازة.
    - lemma: "وِفَاق"
      generation_method: majaz
      justification: >
        من جذر و-ف-ق على وزن فِعَال، وهو لفظٌ كلاسيكيٌّ جرى إحياؤه لمعنى الملاءمة والتوافق؛
        ابن فارس يُصرِّح في المقاييس «كَلِمَةٌ تَدُلُّ عَلَى مُلَاءَمَةِ الشَّيْئَيْنِ»، فيستمدّ
        مشروعيَّته من التأصيل المعجميّ الكلاسيكيّ بطريق المجاز الدلاليّ (إزاحة من التطابق
        المادّي إلى الخاصيّة المجرَّدة).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # استعلامات قاعدة البيانات المُنفَّذة:
  # Q1 – مطابقة دفعية لجميع اللمّات + المرشّحات (ملاءمة، مناسبة، لياقة، جدارة، صلاحية، وفاق)
  # Q2 – استعلام مقاييس اللغة للجذور: لأم، نسب، ليق، جدر، وفق
  # Q3 – جسر إنجليزي: suitability, suitableness, aptness, fitness, appropriateness
  # Q4 – بحث FTS بالكلمات المفتاحية: ملاءمة، مناسبة، صالح، ليق
  # Q5 – إثراء بالمعرِّف (أمثلة للمداخل الرئيسية)
  # Q6 – مداخل OCR لجذر لأم (لاءم) ورجوع لمناسبة

  per_lemma:

    # ── اللمّة ١: مُلَاءَمَة ──
    - lemma: "مُلَاءَمَة"
      confirm:
        - text: "«ملاءمة» = suitability"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ALECSO (2009)"
        - text: "«مُلاءمة» = appropriateness"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُلاءَمة (ال…) للغرض» = fitness for purpose"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«مُلاءَمَة» = appropriateness"
          source: "مسرد الإعلام والتواصل — ALECSO"
        - text: "«ملاءمة الأراضي» = land suitability"
          source: "المَكنَز الزراعي متعدد اللغات — AGROVOC"
        - text: "«(١) مَلاءَمة؛ مناسَبة؛ موافَقة» = appropriateness"
          source: "المورد الحديث (2008)"
        - text: "«(١) ملاءَمة» = aptness"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«استعمال خطاب مناسب مع الشخص المناسب»"
          source: "مسرد الإعلام والتواصل — ALECSO"
          addition: "يُوضح أنّ الملاءمة تعني التوافق بين الخطاب والسياق أو الشخص، وهو امتداد طبيعي لمفهوم الصلاحية للغرض"
        - text: "«مصطلح يُستخدم في تقييم الأراضي للإشارة إلى مدى ملاءمة موقع لدعم نشاط مقترح»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ALECSO"
          addition: "يُعزِّز دلالة الملاءمة بوصفها صفةً قياسيّةً قابلة للتدريج (عالية / متوسطة / منخفضة)"

    # ── اللمّة ٢: مُنَاسَبَة ──
    - lemma: "مُنَاسَبَة"
      confirm:
        - text: "«المُنَاسبة: عند الأصوليين من الحنفيّة هي الملاءمة يعني موافقة الوصف للحكم بأن تصحَّ إضافةُ الحكم إليه»"
          source: "التعريفات الفقهيّة للبركتي (ت 1975م)"
        - text: "«(١) مناسَبة: موافَقَة؛ ملاءَمة؛ صوابيّة» = propriety"
          source: "المورد الحديث (2008)"
        - text: "«(١) ملاءَمة؛ مناسَبة؛ موافَقة» = appropriateness"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«مناسبة» تُترجَم أيضاً بـ: (١) ملاءمة؛ مناسبة (٢) النفعية (٣) وسيلة؛ ذريعة = expedience"
          source: "المورد الحديث (2008)"
          conflict: "اشتراكٌ لفظيٌّ مع معنى «النفعية والذريعة»، وهو ما يُشير إلى حمولة دلاليّة غير محايدة"
      expands:
        - text: "«المناسبة في أصول الفقه: وصفٌ ظاهرٌ منضبطٌ يحصل عقلاً من ترتّب الحكم عليه ما يصلح أن يكون مقصوداً للعقلاء من حصول مصلحة أو دفع مضرة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
          addition: "تُبيِّن الجذرَ الاصطلاحيَّ لمناسبة بوصفها معياريَّةً وظيفية وليست مجرَّدَ تشابهٍ شكليّ، مما يُقرِّبها من مفهوم الصلاحية للغرض"

    # ── المرشَّح ١: لِيَاقَة ──
    - lemma: "لِيَاقَة"
      confirm:
        - text: "«لَا يَلِيقُ بِهِ كَذَا، كَأَنَّهُ لَا يَصْلُحُ لَهُ، وَلَا يُلْصِقُ بِهِ» (الجذر ليق)"
          source: "مقاييس اللغة لابن فارس"
        - text: "«لياقة» = fitness | aptitude"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«اللِّيَاقَةُ: سلوكُ الإنسان فى حياته مع غيره سلوكاً مُتَّسِماً بالأَدب»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "التعريف المعياري الحديث يقصر اللياقة على «حسن التصرف الاجتماعي / الأدب»، لا على الصلاحية الوظيفية للغرض"
        - text: "«من اللِّياقة أن تكرم ضَيْفَك [صحيحة] — الرأي: مرفوضة عند الأكثرين»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "يُثبت أنّ المعجميِّين الحديثين يَحصُرون لياقة في دلالة اللباقة الاجتماعية"

    # ── المرشَّح ٢: جَدَارَة ──
    - lemma: "جَدَارَة"
      confirm:
        - text: "«هُوَ جَدِيرٌ بِكَذَا، أَيْ حَرِيٌّ بِهِ. وَهُوَ مِمَّا يَنْبَغِي أَنْ يُثْبِتَ وَيَبْنِيَ أَمْرَهُ عَلَيْهِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«جَدارة» = competence; jurisdiction; responsibility"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "المعاجم التقنية الحديثة تُوجِّه «جدارة» نحو الكفاءة والاختصاص والتأهيل، لا نحو صلاحية خصائص الشيء لغرضه"
        - text: "«باب الجدارة والاستحقاق: اسْتوْجبَ وَاسْتحق واستأهل»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (ت 1274م)"
          conflict: "المعنى الكلاسيكي يرتبط بالاستحقاق والجدارة الشخصية (merit) لا بتوافر الخصائص الوظيفية في الشيء"

    # ── المرشَّح ٣: صَلَاحِيَّة ──
    - lemma: "صَلَاحِيَّة"
      confirm:
        - text: "«الاتِّساقُ والمناسبةُ لغرضٍ ما / الصلاحية للعمل: حسنُ التهيؤ والاستعدادُ له»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«الاتِّساق في عمل ما / الصلاحية للعمل: حسن التهيُّؤ له»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«صلاحية الاستعمال» = fitness for purpose"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      contradicts:
        - text: "«صلاحيات المسؤول: مدَى ما يُخَوِّله له القانونُ مِن سُلطاتٍ فى نطاق عمله»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "المعنى السائد في العربية المعاصرة هو «السلطة / الاختصاص القانوني»، مما يُولِّد تداخلاً قوياً مع المجموعة الترادفية المستهدَفة"
        - text: "«صَلَاحِيَة» = validity"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) / علم الصيدلة (2009)"
          conflict: "في المعاجم التقنية تُرادف الصلاحية «صِحَّة المنطق / الصلاحية الزمنية»، وليس الملاءمة الوظيفية"

    # ── المرشَّح ٤: وِفَاق ──
    - lemma: "وِفَاق"
      confirm:
        - text: "«وِفَاق: من (و ف ق) الملاءمة بين الشيئين، والاجتماع على أمر واحد»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
        - text: "«الْوَاوُ وَالْفَاءُ وَالْقَافُ: كَلِمَةٌ تَدُلُّ عَلَى مُلَاءَمَةِ الشَّيْئَيْنِ. مِنْهُ الْوَفْقُ: الْمُوَافَقَةُ. وَاتَّفَقَ الشَّيْئَانِ: تَقَارَبَا وَتَلَاءَمَا»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«الوِفَاق: (في القانون الدولي) اصطلاحٌ يُطلق على مختلف الاتفاقات الدولية في أيّ صورة كانت»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "المعجم الوسيط حصرَ وِفَاق في الاصطلاح القانوني الدوليّ، وهو ما يُبعِد الكلمة عن الاستخدام العام للدلالة على خاصّية الملاءمة المجرَّدة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١: مُلَاءَمَة ──
    - lemma: "مُلَاءَمَة"
      decision: confirmed
      decision_reason: >
        مُلَاءَمَة هي اللمّة الأكثر تمثيلاً للمفهوم في المعجمية العربية الحديثة والتقنية على حدٍّ سواء؛
        تُرادِف suitability وappropriateness وfitness for purpose في مصادر ALECSO وAGROVOC
        والمعجم الطبي الموحَّد. جذرها لأم يعني «الاتِّفَاق والاجتماع» (ابن فارس)، مما يُعطيها
        تأصيلاً كلاسيكياً متيناً. لا يوجد تعارضٌ في الأدلة ولا اشتراكٌ لفظيٌّ مُشكِل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُبرز الجانبَ الوظيفيَّ التكاملِيَّ — كون خصائص الشيء تلتئم مع متطلَّبات الغرض كما يلتئم
        الجرح أو تلتئم حلقات الدرع (التأصيل الأصليّ من لأَمَ = سدَّ وأصلح)؛ تُفيد التوافق الهيكليّ
        بين الشيء وبيئة استخدامه.
      quality_gate:
        ittiraad: "فصيحة مضطردة في المعاجم الحديثة والتقنية"
        yusr_tadawul: "سهلة التداول، شائعة في الكتابة المتخصصة"
        mulaama: "تناسب مفهوم صفة التوافق الوظيفي تماماً"
        ithar_turathi: "مشتقَّة من جذر قرآني كلاسيكي (وَلَأَمَ)"
        ithar_arabi: "عربية أصيلة"
        ishtiqaqiyya: "تُنتج اشتقاقات غنية: ملائم، تلاؤم، ملاءمة، لِئَام الدرع"

    # ── اللمّة الموجودة ٢: مُنَاسَبَة ──
    - lemma: "مُنَاسَبَة"
      decision: confirmed
      decision_reason: >
        مُنَاسَبَة مُستعمَلة لإفادة الصلاحية والتوافق في السياقات المتخصصة وفي الإرث الفقهيّ
        الكلاسيكيّ («مُنَاسَبَة = الملاءمة» عند الأصوليين). الأدلة تُؤكِّد صحة الاستخدام، ولكن
        يُوثَّق اشتراكٌ لفظيٌّ مع «المناسبة الاجتماعية (occasion)» الذي يهيمن على الاستخدام
        العامّ في العربية المعاصرة — هذا الاشتراك لا يوجب الإزالة لكنه يستدعي التنبيه. المجموعة
        مُتخصِّصة في الدرجة الأولى وهذا يُقلِّل خطر الالتباس.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُبرز الجانبَ العلائقيَّ النسبيَّ — كون الشيء مُنتسِباً إلى الغرض أي موصولاً به من
        حيث الخصائص (مستمدَّةً من نسب = الاتصال والانتساب)؛ تُفيد أكثر في السياقات التي
        يُقيَس فيها التوافق معيارياً (هل ينتسب هذا إلى تلك الفئة / هل يلتقي هذا الشرط؟).

    # ── المرشَّح ١: لِيَاقَة (من المرحلة ١) ──
    - lemma: "لِيَاقَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أنّ الجذر الأصليَّ «لاق به = يصلح له» يُقرِّبها من مفهوم الملاءمة، فإنّ التعريف
        المعياريَّ في المعجم الوسيط يقصرها على «سلوك الإنسان مع غيره مُتَّسِماً بالأَدب» (اللباقة
        الاجتماعية)؛ واستخداماتها في معاجم ALECSO تتعلق بـfitness البيولوجي أو aptitude
        النفسيّ، لا بالصلاحية الوظيفية المجرَّدة. إضافتها ستُولِّد تضارباً دلالياً لا يحتمله
        المفهوم المستهدَف.

    # ── المرشَّح ٢: جَدَارَة (من المرحلة ١) ──
    - lemma: "جَدَارَة"
      source: stage1
      decision: removed
      decision_reason: >
        جَدَارَة تدور في حقل «الكفاءة والاستحقاق الشخصيّ» (merit / competence)، لا في حقل
        «توافر الخصائص الموضوعية للشيء مع الغرض». المعاجم التقنية تُرادفها بـcompetence و
        jurisdiction. المقاييس تُبيِّن أنّ الجذر «جدر» يُفيد الثبوت (من الجدار)، والتعبير «جديرٌ
        بكذا» يتعلق بالشخص لا بالشيء المادّي أو المعنوي. تُعدُّ مرفوضةً للمجموعة الحالية.

    # ── المرشَّح ٣: صَلَاحِيَّة (من المرحلة ١) ──
    - lemma: "صَلَاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أنّ المعجم الكبير يُعرِّفها بـ«الاتِّساقُ والمناسبةُ لغرضٍ ما»، فإنّ الاشتراك اللفظيَّ
        مع «السلطة / الاختصاص القانوني» (صلاحيات المسؤول) يهيمن على الاستخدام المعاصر؛
        فضلاً عن استخدامها في المعاجم التقنية بمعنى «الصلاحية الزمنية» (expiry / validity).
        هذا التشعُّب الدلاليّ الحادّ يجعلها غير صالحة لاستخدامها لمّةً مرادفة في هذه المجموعة.

    # ── المرشَّح ٤: وِفَاق (من المرحلة ١) ──
    - lemma: "وِفَاق"
      source: stage1
      decision: removed
      decision_reason: >
        رغم تأصيله الكلاسيكيّ المتين («كلمةٌ تدلُّ على ملاءمة الشيئين» — ابن فارس)، فإنّ
        المعجم الوسيط حصره في الاصطلاح القانوني الدوليّ (international accord)، ولم تُسجِّله
        المعاجم التقنية الحديثة في دلالة الصلاحية الوظيفية المجرَّدة. إحياؤه هنا سيُعرِّضه
        للالتباس الحادّ مع معنى «الاتفاقية الدولية»، ويُضيف ترادفاً لا تحتاجه المجموعة
        وهي مُكتفيةٌ بمُلَاءَمَة ومُنَاسَبَة.


