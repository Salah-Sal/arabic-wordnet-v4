# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (انفصال) مكتوبة بدون تشكيل"
      - "المجموعة تقتصر على لمّة واحدة رغم ثراء المفردات العربية المرتبطة بالمفهوم"
      - "التعريف الحالي ترجمة حرفية من الإنجليزية ولا يعكس أسلوب المعجم العربي الأصيل"
    observations: >-
      المفهوم «حالة الافتقار إلى الوحدة» ذو امتداد دلالي واسع في العربية؛ فثمة
      مستوى مادي (فصل جسدي بين شيئين) ومستوى اجتماعي-سياسي (تشتت جماعة وافتراقها).
      المجموعة مرتبطة بالمبالغ الفائق (حَالَة) ما يُلزم بأن تكون اللمّات أسماء
      مصدرية تدل على الحالة لا الفعل. الجذر (فصل) أصيل في الدلالة على التمييز
      والإبانة. وكلمة (شتات) الكلاسيكية ذات ثراء توثيقي عالٍ وتغطي الجانب
      الاجتماعي-العاطفي للمفهوم بما يجعلها مكمّلة دلالية لانفصال.

  blind_candidates:
    - lemma: "تَشَتُّت"
      generation_method: ishtiqaq
      justification: >-
        مصدر من الجذر (ش ت ت) على وزن تَفَعُّل، يدل على الحالة الناتجة عن
        تشتيت الجمع وتفرّقه؛ فغياب الوحدة يُنتج بالضرورة تشتتاً في الأجزاء.
    - lemma: "تَفَكُّك"
      generation_method: ishtiqaq
      justification: >-
        مصدر من الجذر (ف ك ك) على وزن تَفَعُّل، يدل على انحلال الوحدة
        وتفارق الأجزاء التي كانت مترابطة — أي ضد التماسك والوحدة بعينها.
    - lemma: "تَفَرُّق"
      generation_method: ishtiqaq
      justification: >-
        مصدر من الجذر (ف ر ق) على وزن تَفَعُّل، يدل على الحالة المقابلة
        للتجمع والاتحاد، وهو ضدّ الوحدة مباشرةً في الاستعمال الفصيح.
    - lemma: "شَتَات"
      generation_method: ishtiqaq
      justification: >-
        اسم كلاسيكي من الجذر (ش ت ت) على وزن فَعَال، يدل على الحالة
        المتشتتة المتفرقة بوصفها حالة لازمة لا فعلاً، ويُوظَّف في العربية
        الكلاسيكية للدلالة على تفرق الجماعة وانعدام تماسكها.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "انفصال"
      confirm:
        - text: "«الِانْفِصَال: عدم الِاتِّصَال عَمَّا من شَأْنه الِاتِّصَال وَقيل الِانْفِصَال حُدُوث هويتين»"
          source: "دستور العلماء للأحمدنكري (Hawramani)"
        - text: "«انْفِصَال: من (ف ص ل) الانقطاع والمفارقة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani)"
        - text: "translation_en: separation — domain: Sociology and Anthropology"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
        - text: "translation_en: separation — domain: Physics"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (ARABTERM)"
        - text: "translation_en: disunion — headword: (1) انفصال (2) خِلاف؛ شِقاق"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الانفصال: هو ضد الاتصال. والحكماء يطلقونه أيضاً على كون الشيء بحيث لا يمكن أن يُفرض فيه أجزاء مشتركة في الحدود»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (Hawramani)"
          addition: "يُوسِّع المفهوم ليشمل البُعد المنطقي-الفلسفي لانعدام التداخل بين الأجزاء، مما يعمّق الدلالة على غياب الوحدة"
        - text: "«فقد الاتصال بين مكونات نسيج ما» — translation_en: detachment"
          source: "معجم المصطلحات الطبية ج.2 (ARABTERM)"
          addition: "يُثبت الاستعمال الطبي لانفصال بمعنى غياب الترابط بين مكونات الكيان الواحد"

    - lemma: "تَشَتُّت"
      contradicts:
        - text: "translation_en: dispersion — domain: Civil Engineering, Physics, Geology, Electropedia (متعددة)"
          source: "معاجم ARABTERM التقنية المتعددة"
          conflict: "الاستعمال السائد لتشتت في المعاجم التقنية يتعلق بالتشتت المادي للضوء أو الجسيمات أو البيانات، لا بـ«حالة افتقار إلى الوحدة» بالمعنى الاجتماعي-المجرد"
        - text: "«تشتَّتَ القَومُ: تفَرَّقوا... الذِّهْنُ: فقد تَرْكيزَه» — (فعل لا حالة)"
          source: "المعجم الكبير (OCR)"
          conflict: "الاستعمال المعجمي المُثبَّت هو الفعل لا الاسم الدال على الحالة؛ التشتت مصدر فعل لا حالة مُستقلة"

    - lemma: "تَفَكُّك"
      contradicts:
        - text: "translation_en: dissociation, decomposition, disintegration — domain: Chemistry, Geology, Pharmacy"
          source: "معاجم ARABTERM العلمية المتعددة"
          conflict: "الاستعمال التقني لتفكك يرتبط بالتحلل الكيميائي والفيزيائي للمواد، بعيداً عن «حالة غياب الوحدة» الاجتماعية أو المجردة"
        - text: "«(تفكك) انفكَّ ويقال تفككت شخصية فلان ضعفت وفلان يتفكك في مشيه وكلامه يضطرب فيهما»"
          source: "المعجم الوسيط لمجموعة المؤلفين (Hawramani)"
          conflict: "الدلالة الأساسية هي الاضطراب والتفتت لا غياب الوحدة تحديداً؛ ودلالة ضعف الشخصية تبتعد عن المفهوم المستهدف"

    - lemma: "تَفَرُّق"
      contradicts:
        - text: "«(تفرق) الشيءُ تفرقاً وتفراقاً تبدَّد والرجلانِ ذهب كلٌّ منهما في طريق» — (فعل)"
          source: "المعجم الوسيط لمجموعة المؤلفين (Hawramani)"
          conflict: "المدخل المعجمي هو فعل (تَفَرَّقَ) لا اسم حالة؛ مصدره يُوظَّف كحدث لا كوصف لحالة مستمرة"
        - text: "«التَّفَرُّقُ: بالفتح وضم الراء: يوم التفرق من أيام العرب»"
          source: "معجم البلدان لياقوت الحموي (Hawramani)"
          conflict: "التوثيق الوحيد للتفرق كاسم في المعجمية الكلاسيكية هو معنى جغرافي-تاريخي (أيام العرب)، لا الدلالة المستهدفة"

    - lemma: "شَتَات"
      confirm:
        - text: "«الشَّتَات: الفُرقة والتبدد... شتات الأمر: الاختلاف فيه، وقيل الفرقة واختلال الأحوال»"
          source: "المعجم الكبير — مجمع اللغة العربية (OCR)"
        - text: "«الشَّتاتُ: التفرُّق»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
        - text: "«(الشتات) التَّفَرُّق وأمر شتات: متشتت»"
          source: "المعجم الوسيط لمجموعة المؤلفين (Hawramani)"
        - text: "«اللهم إني أعوذ بك من عذاب القبر وشتات الأمر» (حديث)"
          source: "المعجم الكبير (OCR) — مثال حديثي"
      expands:
        - text: "«شَتَّ شَعْبُهُمْ شَتَاتًا وَشَتًّا، أَيْ تَفَرَّقَ جَمْعُهُمْ» — مقاييس اللغة: «الشِّينُ وَالتَّاءُ أَصْلٌ يَدُلُّ عَلَى تَفَرُّقٍ وَتَزَيُّلٍ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 987083)"
          addition: "يُثبت ابن فارس أن الجذر (ش ت ت) أصيل في الدلالة على التفرق؛ وشتات مصدره المسكوك الدال على الحالة الناتجة"
        - text: "«أجدّ بتيّا هجرها وشتاتها» (الأعشى) | «ألا أصبحت ظمياء قد نزحت بها نوى خيتعور طرحها وشتاتها» (المعطل الهذلي) | «ضم على الإخاء لهم شتات» (أحمد شوقي)"
          source: "المعجم الكبير — شواهد شعرية متعددة"
          addition: "كثرة الاستشهاد الشعري تُثبت أن شتات وحدة معجمية مسكوكة ذات حضور في الاستعمال الفصيح لا مجرد مصدر فعلي"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "انفصال"
      decision: confirmed
      decision_reason: >-
        اللمّة الوحيدة الموجودة في المجموعة، وهي مدعومة بأدلة معجمية موثوقة
        (الأحمدنكري: «عدم الاتصال عما من شأنه الاتصال»، السلطان قابوس:
        «الانقطاع والمفارقة»)، وتُترجَم بـ separation في كل المعاجم التقنية.
        تُكتب بدون تشكيل في البيانات الحالية مما يستوجب التصحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُؤكِّد انقطاعَ الصلة وتباعُدَ طرفين كانا متصلَيْن؛ أقرب إلى الوصف
        الوظيفي-التنظيمي للانفصال (بين كيانات أو مجموعات)، ويُستعمَل في
        السياقات الرسمية والعلمية والقانونية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْفِصَال"

    - lemma: "تَشَتُّت"
      source: stage1
      decision: removed
      decision_reason: >-
        الاستعمال المعجمي الموثَّق لتشتت مرتبط أساساً بالتشتت المادي (ضوء،
        جسيمات، بيانات) في السياقات التقنية والعلمية. يغيب التوثيق له كاسم
        حالة اجتماعية أو مجردة تدل على «غياب الوحدة». علاوةً على ذلك، فإن
        المصادر تُورده فعلاً (تشتّت) لا اسم حالة مستقلاً؛ مما يُخرجه من دائرة
        اللمّات المناسبة لهذه المجموعة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَفَكُّك"
      source: stage1
      decision: removed
      decision_reason: >-
        الاستعمال المعجمي السائد لتفكك يدور حول التحلل الكيميائي والفيزيائي
        والبيولوجي للمركبات، أو الانهيار الشخصي (تفككت شخصيته). لا يحمل الكلمةُ
        الدلالةَ المستهدفةَ «حالة غياب الوحدة» بمعناها الاجتماعي أو المجرد،
        وجذره (فك) — بحسب المقاييس — يدل أساساً على «التفتح والانفراج»، بعيداً
        عن دلالة الوحدة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَفَرُّق"
      source: stage1
      decision: removed
      decision_reason: >-
        المدخل المعجمي لتفرّق في المصادر المُتاحة هو فعل (تَفَرَّقَ) لا اسم
        حالة مستقلة. الشواهد المتوفرة إما تصف يوماً تاريخياً (معجم البلدان) أو
        تُدخل الفعل في سياقات تقنية متخصصة. لا يُوظَّف كمصدر حالة بالمعنى
        المعجمي المستهدف.
      evidence_assessment:
        case: contradicts_only

    - lemma: "شَتَات"
      source: stage1
      decision: confirmed
      decision_reason: >-
        اسم كلاسيكي موثَّق في أكثر من مصدر معجمي موثوق (المعجم الكبير OCR،
        المعجم الوسيط OCR، الوسيط Hawramani) بمعنى «الفُرقة والتبدُّد». شتات
        الأمر يعني الاختلاف فيه وانعدام تماسكه، وهو تحديداً «حالة الافتقار
        إلى الوحدة». يرد في الحديث النبوي (اللهم إني أعوذ بك من شتات الأمر)
        وفي شعر الفحول مما يُثبت تثبيته المعجمي. الجذر (شت) أصيل في ابن فارس
        (تفرق وتزيل). يختلف عن انفصال في التركيز على التبدُّد الاجتماعي-العاطفي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُؤكِّد التبدُّدَ والتشرُّدَ وانتشارَ الأجزاء في اتجاهات متعددة؛
        حضوره كثيف في الخطاب الشعري والديني والاجتماعي مع وزن عاطفي أقوى من
        انفصال. يُستعمَل غالباً في السياق الجماعي (شتات الأمة، شتات الشمل،
        شتات الأسرة) بمعنى التفرق القسري أو المؤلم.
      actions:
        - command: create_entry
          params:
            lemma: "شَتَات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14437698-n"


