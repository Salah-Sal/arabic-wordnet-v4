        result: "pass"
      nuance_differentiation: "أعم من 'الممر الملاحي' إذ قد تشمل قنوات الري أو الصرف وليس فقط الملاحة."
      example: "تعد هذه القناة الممر الرئيسي للسفن التجارية."

    - lemma: "قناة مائية"
