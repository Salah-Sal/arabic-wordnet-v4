step0_evidence:
  per_lemma:
    - lemma: "قناة"
      confirm:
        - text: "«مجرى للماء ضيق أو واسع»"
          source: "المعجم الوسيط"
        - text: "«مجرى مائي طبيعي أو اصطناعي يحتوي على ماء جار»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "«مجرى مياه من صنع الإنسان يكون شكله منتظماً عادةً.»"
          source: "المعجم الموحد لمصطلحات المياه"
    - lemma: "قناة مائية"
      confirm:
        - text: "«أنبوب أو قناة لنقل الماء الجاري»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "ممر ملاحي"
      source_section: "step4_fts_keyword"
      evidence_citation: "«ممر مائي صالح للملاحة يمكن أو يكون طبيعيا (جزء من نهر) أو اصطناعي يصل ميناءا داخليا بالبحر عبر منطقة ضحلة أو عبر اليابسة.» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      justification: "يتطابق مع مفهوم المسطح المائي الذي يسمح بمرور السفن."
    - lemma: "بوغاز"
      source_section: "step5_english_bridge"
      evidence_citation: "«جزء من الماء محصور بين بَرَّيْن , موصل بين بحرين» — المعجم الكبير"
      justification: "مصطلح معرب شائع الاستعمال للدلالة على الممر المائي الضيق أو مدخل الميناء."
  knowledge_candidates:
    - lemma: "قناة ملاحية"
      justification: "التركيب (وصفي)؛ تخصيص كلمة 'قناة' بصفة 'ملاحية' لتأكيد وظيفتها في عبور السفن."

