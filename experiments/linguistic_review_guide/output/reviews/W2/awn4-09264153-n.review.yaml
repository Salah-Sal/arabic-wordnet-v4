      decision_reason: "لفظ معرب شائع ومقبول في الفصحى المعاصرة للدلالة على مدخل الميناء أو المضيق."
      step05_citation: "«جزء من الماء محصور بين بَرَّيْن , موصل بين بحرين» — المعجم الكبير"
