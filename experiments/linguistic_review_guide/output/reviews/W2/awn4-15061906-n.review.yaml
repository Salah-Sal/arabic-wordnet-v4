stage1_review:
  assessment:
    concerns:
      - "اللمات الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي طويل نوعاً ما ومبني بأسلوب وصفي مرسل بدلاً من الأسلوب المعجمي المركز."
    observations: "المجموعة تغطي المفهوم المناعي (Antigen). اللمات المقترحة (مستضد، مولد الضد) دقيقة ومنتشرة في المعاجم المتخصصة. اللفظ 'مستضد' هو المصطلح الأكثر استقراراً في العلم الحديث."
  blind_candidates:
    - lemma: "مُسْتَضِدّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استضد (أي طلب الضد أو استثاره)، وهو المصطلح المعياري في الطب والأحياء."
    - lemma: "مُوَلِّد الضِّدّ"
      generation_method: tarkib
      justification: "تركيب وصفي يترجم الوظيفة الدلالية للمصطلح (Antigen = Anti + Gen)."
    - lemma: "مُوَلِّد المِضادّ"
      generation_method: tarkib
      justification: "صيغة بديلة شائعة في المعاجم الموحدة (مثل المعجم الطبي الموحد)."
    - lemma: "أَنْتِيجِين"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح العالمي، مستخدم في السياقات الأكاديمية والطبية."

stage2_evidence:
  per_lemma:
    - lemma: "مستضد"
      confirm:
        - text: "«مركب يحرض، إثر دخوله البدن، الجملة المناعية على تكوين أضداد نوعية له قادرة على إبطال مفعوله ومنع تأثيراته الحيوية.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مادة أو جزيء غريبة يتم التعرف عليها من قبل النظام المناعي.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
    - lemma: "مولد الضد"
      confirm:
        - text: "«مادة تنشأ عن حقنها في الجسم أجسام مضادة لها.» (وردت بصيغة مولد المضاد)"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
    - lemma: "أنتيجين"
      confirm:
        - text: "«مولد المضاد (أنتيجين)»"
          source: "معجم مصطلحات علم الأحياء (1993)"

stage3_analysis:
  per_lemma:
    - lemma: "مستضد"
      decision: confirmed
      decision_reason: "مصطلح علمي مستقر ومدعوم بقوة في المعاجم الطبية والصيدلانية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَضِدّ"
    - lemma: "مولد الضد"
      decision: confirmed
      decision_reason: "مصطلح وصفي دقيق وشائع الاستخدام في المناهج التعليمية والكتب العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَلِّد الضِّدّ"
    - lemma: "مُوَلِّد المِضادّ"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة بديلة معتمدة في المعاجم الموحدة الرسمية (مثل الطبي الموحد والبيطري)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "مُوَلِّد المِضادّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15061906-n"}
    - lemma: "أَنْتِيجِين"
      source: stage1
      decision: confirmed
      decision_reason: "اللفظ المعرب للمصطلح العالمي، مستخدم بكثرة في الأدبيات الطبية المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "أَنْتِيجِين", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-15061906-n"}

stage4_content:
  definition:
    current: "أي مادة (مثل السموم أو الإنزيمات) تحفز الاستجابة المناعية في الجسم (وخاصة إنتاج الأجسام المضادة)"
    assessment:
      decision: revise
      reason: "لجعله أكثر تركيزاً بأسلوب المعاجم الاصطلاحية."
    authored:
      - type: terminological
        text: "مادة غريبة عن الجسم، تثير عند دخولها إليه استجابة مناعية، وتؤدي إلى تكوين أضداد (أجسام مضادة) نوعية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-15061906-n", definition_index: 0, text: "مادة غريبة عن الجسم، تثير عند دخولها إليه استجابة مناعية، وتؤدي إلى تكوين أضداد (أجسام مضادة) نوعية."}
  examples:
    per_lemma:
      - lemma: "مُسْتَضِدّ"
        examples:
          - text: "يتعرف الجهاز المناعي على المستضدات الموجودة على سطح الفيروسات الغازية."
            type: usage
      - lemma: "مُوَلِّد الضِّدّ"
        examples:
          - text: "تعمل اللقاحات على تقديم مولدات ضد غير ضارة للجسم لتحفيز ذاكرته المناعية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-15061906-n", text: "ترتبط الأجسام المضادة بالمستضدات للقضاء على مسببات الأمراض."}

