stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جداً (فعل السكن في مكان ما) ويحتاج إلى توسيع ليشمل دلالة الاستمرار والمقام."
      - "اللمّات الموجودة (إقامة، سكن) تفتقر إلى التشكيل الكامل."
    observations: "المجموعة تعبر عن مفهوم 'الإقامة' كفعل ونشاط إنساني. اللمّات المقترحة تغطي الجوانب المختلفة لهذا المفهوم من حيث الزمن (مكوث) والحق القانوني (سكنى) والاستقرار المكاني (استيطان)."
  blind_candidates:
    - lemma: "اِسْتِيطَان"
      generation_method: ishtiqaq
      justification: "من الجذر (وطن) على وزن استفعال، ويدل على اتخاذ المكان وطناً والإقامة الدائمة فيه."
    - lemma: "مُقَام"
      generation_method: ishtiqaq
      justification: "من الجذر (قوم)، وهو مصدر ميمي يدل على الإقامة أو مكانها وزمانها."
    - lemma: "تَوَطُّن"
      generation_method: ishtiqaq
      justification: "من الجذر (وطن) على وزن تفعل، ويدل على عملية الاستقرار في مكان ما."
    - lemma: "قُطُون"
      generation_method: ishtiqaq
      justification: "مصدر الفعل (قطن) بمعنى سكن وأقام، وهو لفظ تراثي فصيح."

stage2_evidence:
  per_lemma:
    - lemma: "إقامة"
      confirm:
        - text: "«بَاب الاقامة: قطن وعدن وأقام ولبث ووقف ووكد وتلبث وثوى ومكث وأخلد وتأرض وأرب وظل وحل وبلد ونجد وتحجى وتخيم وقر ودجن»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
        - text: "«إقامة [مدةً من الزمن]. سُكنى [متواصلة]»"
          source: "المورد الحديث"
    - lemma: "سكن"
      confirm:
        - text: "«المكان وبه سكنا وسكنى أقام به واستوطنه»"
          source: "المعجم الوسيط"
        - text: "«سكن المكان/ سكن بالمكان/ سكن في المكان: أقام به واستوطنه»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "اِسْتِيطَان"
      confirm:
        - text: "«سكن المكان وبه سكنا وسكنى أقام به واستوطنه»"
          source: "المعجم الوسيط"
      expands:
        - text: "«نمو خلايا في عضو ما بعد حملها إليه في شكل ثانويات»"
          source: "معجم المصطلحات الطبية"
          addition: "يستخدم في السياق الطبي الحيوي للدلالة على استقرار الخلايا."
    - lemma: "مُقَام"
      confirm:
        - text: "«مقام كل واحد موضع إقامته عند ذلك»"
          source: "التعريفات للجرجاني"
    - lemma: "مُكُوث"
      confirm:
        - text: "«المكث: الإقامة مع الانتظار والتلبث في المكان»"
          source: "النهاية في غريب الحديث"
        - text: "«زمن المكوث: فترة يبقى خلالها المياه أو مادة معيّنة في وحدة من مركبات الدورة الهيدرولوجية»"
          source: "المعجم الموحد لمصطلحات المياه"
    - lemma: "سُكْنَى"
      confirm:
        - text: "«السكنى: أن يجعل له السكون في دار بغير أجرة»"
          source: "مفردات الراغب"
        - text: "«سُكنى [متواصلة]»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "إقامة"
      decision: confirmed
      decision_reason: "مصطلح أساسي يدل على البقاء في مكان ما، وهو شائع الاستعمال في السياقات الرسمية والعامة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِقَامَة"
    - lemma: "سكن"
      decision: confirmed
      decision_reason: "مصدر الفعل سكن، وهو يعبر بدقة عن دلالة المجموعة (dwelling)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَكَن"
    - lemma: "مُكُوث"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر يدل على البقاء والانتظار في مكان ما، ويستخدم بكثرة في السياقات العلمية للتعبير عن (residence time)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُكُوث"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "سُكْنَى"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ فصيح يدل على فعل السكن أو حق السكن، وهو مناسب جداً للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "سُكْنَى"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مُقَام"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر ميمي فصيح يعبر عن فعل الإقامة ومدتها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُقَام"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "اِسْتِيطَان"
      source: stage1
      decision: removed
      decision_reason: "رغم كونه من معاني الإقامة، إلا أنه يميل لدلالة الاستقرار الدائم أو السياسي (colonization) مما يجعله أبعد قليلاً عن المفهوم العام لفعل السكن المجرد."

stage4_content:
  definition:
    current: "فعل السكن في مكان ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي فقير لغوياً ويفتقر إلى الدقة المعجمية."
    authored:
      - type: terminological
        text: "الإقامةُ والمُقَامُ في مكانٍ ما على وجهِ الاستقرارِ أو الاستمرار."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الإقامةُ والمُقَامُ في مكانٍ ما على وجهِ الاستقرارِ أو الاستمرار."
  examples:
    per_lemma:
      - lemma: "إِقَامَة"
        examples:
          - text: "حَصَلَ الطَّالِبُ عَلَى تَأْشِيرَةِ إِقَامَةٍ لِلدِّرَاسَةِ فِي الخَارِجِ."
            type: usage
      - lemma: "سَكَن"
        examples:
          - text: "يُفَضِّلُ الكَثِيرُ مِنَ النَّاسِ السَّكَنَ فِي المَنَاطِقِ الهَادِئَةِ بَعِيداً عَنْ ضَوْضَاءِ المُدُنِ."
            type: usage
      - lemma: "مُكُوث"
        examples:
          - text: "طَالَ مُكُوثُ المَسَافِرِ فِي هَذِهِ القَرْيَةِ بِسَبَبِ سُوءِ الأَحْوَالِ الجَوِّيَّةِ."
            type: usage
      - lemma: "سُكْنَى"
        examples:
          - text: "انْتَقَلَتِ العَائِلَةُ لِلسُّكْنَى فِي دَارِهَا الجَدِيدَةِ."
            type: usage
      - lemma: "مُقَام"
        examples:
          - text: "هَنِيئاً لَكَ بِمُقَامِكَ فِي هَذِهِ البَلْدَةِ الطَّيِّبَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "انْتَهَتْ مُدَّةُ إِقَامَتِهِ فِي الفُنْدُقِ وَتَوَجَّهَ إِلَى المَطَارِ."

stage5_enrichment:
  per_entry:
    - lemma: "إِقَامَة"
      entry_id: "{auto}"
      root: "قوم"
      maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدَهُمَا عَلَى جَمَاعَةِ نَاسٍ... وَالْآخَرُ عَلَى انْتِصَابٍ أَوْ عَزْمٍ... وَأَمَّا الْآخَرُ فَقَوْلُهُمْ: قَامَ قِيَامًا، وَالْقَوْمَةُ الْمَرَّةُ الْوَاحِدَةُ، إِذَا انْتَصَبَ.»"
    - lemma: "سَكَن"
      entry_id: "{auto}"
      root: "سكن"
      maqayis_quote: "«السِّينُ وَالْكَافُ وَالنُّونُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى خِلَافِ الِاضْطِرَابِ وَالْحَرَكَةِ. يُقَالُ سَكَنَ الشَّيْءُ يَسْكُنُ سُكُونًا فَهُوَ سَاكِنٌ.»"
    - lemma: "مُكُوث"
      entry_id: "{auto}"
      root: "مكث"
      maqayis_quote: "«الْمِيمُ وَالْكَافُ وَالثَّاءُ كَلِمَةٌ تَدُلُّ عَلَى تَوَقُّفٍ وَانْتِظَارٍ.»"
    - lemma: "سُكْنَى"
      entry_id: "{auto}"
      root: "سكن"
      maqayis_quote: "«السِّينُ وَالْكَافُ وَالنُّونُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى خِلَافِ الِاضْطِرَابِ وَالْحَرَكَةِ.»"
    - lemma: "مُقَام"
      entry_id: "{auto}"
      root: "قوم"
      maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ... وَالْآخَرُ عَلَى انْتِصَابٍ أَوْ عَزْمٍ.»"
  per_sense:
    - lemma: "إِقَامَة"
      sense_id: "{auto}"
      nuance: "تدل على فعل البقاء في مكان ما، وتستخدم غالباً في السياقات الرسمية والزمنية."
      mwe: false
    - lemma: "سَكَن"
      sense_id: "{auto}"
      nuance: "تدل على فعل الحلول في منزل أو مكان ما طلباً للراحة والاستقرار."
      mwe: false
    - lemma: "مُكُوث"
      sense_id: "{auto}"
      nuance: "تدل على البقاء مع الانتظار، وتستخدم في السياقات التقنية للتعبير عن مدة البقاء."
      mwe: false
    - lemma: "سُكْنَى"
      sense_id: "{auto}"
      nuance: "تؤكد على حالة الاستمرار في السكن أو الحق القانوني فيه."
      mwe: false
    - lemma: "مُقَام"
      sense_id: "{auto}"
      nuance: "مصدر ميمي يؤكد على فعل الإقامة بحد ذاته أو زمانها."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
