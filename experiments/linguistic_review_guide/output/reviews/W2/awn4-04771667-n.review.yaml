# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (عُمُومِيَّة)، وهذا يستدعي البحث عن مرادفات عربية راسخة يمكن ضمّها"
      - "التعريف الحالي يُعبِّر عن المعنى بأسلوب قائمة توضيحية لا بأسلوب تعريف بنائي محكم (جنس + فصل)؛ يحتاج إلى إعادة صياغة"
      - "عُمُومِيَّة قد تحمل في الاستخدام الدارج معنى 'عامّة الناس' إلى جانب المعنى المجرد 'صفة العموم'، وهذا التعدد الدلالي يستوجب التنبيه"
    observations: "عُمُومِيَّة مصدر صناعي مُشتق من عُمُوم على وزن فُعُولِيَّة، وهو جذع عربي أصيل متجذّر في التراث اللغوي. اللمّة شائعة الاستخدام في الكتابة العلمية والفلسفية المعاصرة، وتُقابل بدقة مفهوم generality الإنجليزي بمعنى 'الصفة المجردة لكون الشيء عامًّا'. المجموعة الأمّ (جَوْدَة / نَوْعِيَّة) تُمثّل جنس القيود والصفات الجوهرية، وهو تصنيف سليم. لا يُلاحَظ خطأ في POS."
  blind_candidates:
    - lemma: "شُمُولِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من شَمِلَ/شُمُول على وزن فُعُولِيَّة؛ يدلّ الشمول على الإحاطة والاستيعاب الذي هو أحد مظاهر كون الشيء عامًّا. الوزن قياسي لصياغة المفاهيم المجردة وقد جاء به تكوين شُمُولِيَّة."
    - lemma: "ذُيُوعٌ"
      generation_method: ishtiqaq
      justification: "مصدر من ذَاعَ يَذِيعُ على وزن فُعُول؛ يدلّ على الانتشار الواسع وهو يُقابل محور 'واسع الانتشار' في التعريف، ويُعبِّر عن جانب الانتشار والشيوع في المفهوم."
    - lemma: "إِطْلاقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من إطلاق/مطلق على وزن إفعالِيَّة؛ يدلّ على خاصية كون الشيء غير مقيَّد بحالة خاصة، مما يُقابل 'ذا تطبيق عام' في التعريف، أي التطبيق المطلق غير المحدود."
    - lemma: "تَعْمِيمٌ"
      generation_method: ishtiqaq
      justification: "مصدر الفعل عَمَّمَ من الجذر ع-م-م على وزن تَفْعِيل؛ يدلّ على جعل الشيء عامًّا شاملًا دون تخصيص، وهو مشتق من الجذر ذاته الذي تنتمي إليه الصفة المطلوبة."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عُمُومِيَّة"
      confirm:
        - text: "«(1) العُمومية: كونُ الشيء عامًّا (2) عبارة عامّة (3) قانون أو مبدأ عامّ (4) الأغلبيّة؛ الأكثريّة؛ الكثرة الكبيرة.»"
          source: "المورد الحديث (2008)"
        - text: "«العموم: في اللغة عبارة عن إحاطة الأفراد دفعة، وفي اصطلاح أهل الحق: ما يقع به الاشتراك في الصفات»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الْعُمُوم: الشمول وهي عبارة عن إحاطة الأفراد دفعةً»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«عَمَّنَا هَذَا الْأَمْرُ يَعُمُّنَا عُمُومًا، إِذَا أَصَابَ الْقَوْمَ أَجْمَعِينَ. وَالْعَامَّةُ ضِدُّ الْخَاصَّةِ»"
          source: "مقاييس اللغة لابن فارس (مادة عَمَّ)"
      expands:
        - text: "«العمومية... شمولية (المرادف العربي)» [translation_en: universality]"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، ALECSO (ArabTerm)"
          addition: "يُشير المصدر إلى أن شُمُولِيَّة مرادف عربي مستخدم لـ عُمُومِيَّة في سياق universality"
        - text: "«(1) العموميّة؛ الشُّمُوليّة؛ العالميّة؛ الكُلِّيّة إلخ (2) عالميّة المَدى. وبخاصة: اتِّساع أُفق الفِكر.»"
          source: "المورد الحديث (2008) — مدخل universality"
          addition: "يُثبّت أن عُمُومِيَّة هي الترجمة العربية الأولى لـ universality، وأن لها مرادفات جزئية هي: الشمولية والعالمية والكلية"

    - lemma: "شُمُولِيَّة"
      confirm:
        - text: "«مقياس لقواعد النحو، مثل البساطة، ويتيح هذا المقياس إجراء تقييم الأنحاء المتنافسة.» [translation_en: Generality]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«شمولية (المرادف العربي)» [في مدخل العمومية = universality]"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، ALECSO (ArabTerm)"
      contradicts:
        - text: "«التطرق إلى كل الجوانب التي تتعلق بموضوع معين.» [translation_en: exhaustiveness]"
          source: "مسرد الإعلام والتواصل، ALECSO (ArabTerm)"
          conflict: "تُعرَّف شُمُولِيَّة هنا بـ exhaustiveness (الاستيعاب الكامل للجوانب)، لا بـ generality (كون الشيء عامًّا)؛ وهذان مفهومان متمايزان"
        - text: "«صفة تنعت بها الدراسة أو المتن الذي يضع في الحسبان جميع الوقائع اللغوية قيد الدرس.» [translation_en: Exhaustivity]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "التعريف الآخر في المصدر ذاته يُحدّد شمولية بـ exhaustivity، لا بـ generality المطلوبة في هذه المجموعة"

    - lemma: "ذُيُوعٌ"
      evidence_status: "no_material_found"

    - lemma: "إِطْلاقِيَّة"
      contradicts:
        - text: "«اطلاقية» [translation_en: absolutism, domain: Philosophy and Psychology]"
          source: "مسرد الفلسفة وعلم النفس، ALECSO (ArabTerm)"
          conflict: "إطلاقية رُصدت مقابلًا اصطلاحيًا راسخًا لـ absolutism (المذهب المطلق في الفلسفة السياسية)، وهو مفهوم مغاير تمامًا لـ generality (صفة العموم)"

    - lemma: "تَعْمِيمٌ"
      confirm:
        - text: "«من (ع م م) لبس العمامة، وجعل الشيء عاما دون تخصيص»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«التعميم: تكوير العمامة على الرأس»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الكلاسيكي الأوّل لتعميم هو تكوير العمامة، لا الصفة المجردة للعموم"
      expands:
        - text: "«سيرورة معرفية تقوم على تأسيس تصور انطلاقا من عدد من الملاحظات التجريبية. أو انطباق نتيجة التجربة على ظروف أخرى غير الظروف التي جرت فيها التجربة أساسا.» [translation_en: generalization]"
          source: "مسرد الإعلام والتواصل، ALECSO (ArabTerm)"
          addition: "التعميم في الاستخدام المصطلحي الحديث يُقابل generalization (عملية الاستقراء والتعميم المعرفي)، لا generality (الصفة المجردة للعموم)؛ وهذا تمييز دقيق مهم"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عُمُومِيَّة"
      decision: confirmed
      decision_reason: "اللمّة موثّقة توثيقاً مباشراً في المعجمية الحديثة بالمعنى المحدد للمجموعة ('كون الشيء عامًّا'). وهي مصدر صناعي قياسي من جذر عمم العربي الأصيل. التراث الكلاسيكي يُثبّت العموم بمعنى الشمول والإحاطة، والتشكيل صحيح (عُمُومِيَّة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة في المجموعة؛ تدلّ على الصفة المجردة لكون الشيء عامًّا شاملًا ذا تطبيق واسع غير مقيَّد بحالة خاصة. تتمايز عن شُمُولِيَّة التي تُفيد استيعاب جميع الجوانب (exhaustiveness)، وعن تَعْمِيم الذي يُفيد عملية الاستقراء والتعميم لا الصفة ذاتها."

    - lemma: "شُمُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم وجود دليل لغوي يُرادف شُمُولِيَّة بالعُمُومِيَّة في سياق محدود (اللسانيات ومسرد المناخ)، فإن المعنى الأساسي المرصود في معظم المصادر هو exhaustiveness/exhaustivity (الاستيعاب الكامل للجوانب) لا generality. الأدلة مختلطة، والأولوية لعدم الازدواجية مع لمّة راسخة كعُمُومِيَّة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "ذُيُوعٌ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أدلة معجمية تُرادف ذيوع بالمعنى المطلوب. كما أن ذيوع يدلّ في الأصل على عملية الانتشار والشيوع (مصدر ذاع) لا على الصفة المجردة لكون الشيء عامًّا ذا تطبيق واسع."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "إِطْلاقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الأدلة تُثبّت بصورة قاطعة أن إطلاقية مصطلح فلسفي راسخ لـ absolutism (المذهب المطلق)، وليس لـ generality. استخدامها في هذه المجموعة سيُحدث اشتراكاً لفظياً مُضلِّلاً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَعْمِيمٌ"
      source: stage1
      decision: removed
      decision_reason: "تعميم مقابل راسخ لـ generalization (العملية المعرفية لاستخلاص المبادئ العامة)، وليس لـ generality (الصفة المجردة للعموم). الفارق الدلالي بين المصدر الدال على العملية والمصدر الصناعي الدال على الصفة يجعل تعميماً غير ملائم لهذه المجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


