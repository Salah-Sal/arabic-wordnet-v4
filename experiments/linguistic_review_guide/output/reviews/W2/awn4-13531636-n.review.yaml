# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13531636-n  |  ILI: i107727  |  POS: n
# Lemmas (EN): magnetization / magnetisation / magnetic induction
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تمغنط، مغنطة) بدون تشكيل كامل في بيانات AWN — يجب تحديثهما بالضبط الصحيح"
      - "المصطلح الإنجليزي 'magnetic induction' في القائمة يُشير في الفيزياء الحديثة إلى كثافة الفيض المغنطيسي (B)، وهو مقدار مختلف عن المغنطة (M) — توجد مشكلة دلالية في القائمة الإنجليزية لـ OEWN ينبغي مراعاتها"
      - "التعريف الحالي بأسلوب الجملة الفعلية العامية ('تجعل') يفتقر إلى دقة أسلوب المعجم الوسيط المصطلحي"
    observations: >
      المجموعة تعبّر عن مفهوم علمي فيزيائي حديث هو 'المغنطة' بوصفها عمليَّةَ إكساب المادَّةِ
      الخاصِّيَّةَ المَغْنَطِيسِيَّة. الجذر م-غ-ن-ط رباعيٌّ دخيل من اليونانية (μαγνήτης)،
      أُدخل إلى العربية في العصور الوسطى وعُرِّب وصار أصلاً مشتقاً منتجاً في المعجمية
      العربية الحديثة. كلا اللمّتين (مغنطة، تمغنط) مشتقّتان من هذا الجذر: الأولى مصدر
      الفعل المتعدي (الإكساب الفاعل)، والثانية مصدر الفعل المطاوع (الاكتساب من قِبَل المادة
      ذاتها). كلتاهما مقبولتان لتمثيل دلالة المجموعة، مع تمييز دقيق بينهما في الاستخدام.

  blind_candidates:
    - lemma: "مَغْنَطَة"
      generation_method: ishtiqaq
      justification: >
        مصدر قياسي للفعل الرباعي مَغْنَطَ على وزن فَعْلَلَة، يدلّ على عملية إكساب المادة
        الخاصيّة المغنطيسية. الوزن مطّرد في المصادر الرباعية الدالّة على الحدث والعملية.
    - lemma: "تَمَغْنُط"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل الرباعي المطاوع تَمَغْنَطَ على وزن تَفَعْلُل، يدلّ على اكتساب المادة
        للخاصية المغنطيسية تلقائياً أو نتيجةً للتأثير الخارجي. الوزن يناسب المطاوعة في
        الأفعال الرباعية.
    - lemma: "حَثٌّ مَغْنَاطِيسِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (موصوف + صفة) يقابل المصطلح الإنجليزي 'magnetic induction' الوارد في
        قائمة الأسماء الإنجليزية للمجموعة. الحثّ يشير إلى العملية التحريضية التي تنشأ
        عنها المغنطيسية.
    - lemma: "إِكْسَابُ المَغْنَاطِيسِيَّة"
      generation_method: tarkib
      justification: >
        تركيب إضافي (مصدر + مضاف إليه) يصف العملية من منظور إسناد الخاصية للمادة.
        يُوضّح الطابع الإجرائي الفاعل للمفهوم دون اللجوء إلى الجذر الدخيل مباشرة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفّذة (٥ استعلامات):
#   Q1 — مطابقة دفعية: تمغنط، مغنطة + ال- + حث مغناطيسي + إكساب المغناطيسية
#   Q2 — جسر إنجليزي: magnetization, magnetisation, magnetic induction, magnetizing
#   Q3 — FTS: مغنطة، تمغنط، مغناطيسية (الكلاسيكيات: لا نتائج — الكلمة حديثة)
#   Q4 — مقاييس اللغة لجذر مغنط (لا وجود: الكلمة دخيلة يونانية)
#   Q5 — بحث عن مغناطيس/مغنط للحصول على تعريفات المعجم الحديث
stage2_evidence:
  per_lemma:

    - lemma: "مغنطة"
      confirm:
        - text: >
            «مغنطة [مفرد]: 1- مصدر مغنطَ. 2- عمليّة جعل مادّة ما مغنطيسيّة بشكل دائم
            أو مؤقّت، كما يحدث عند إدخال مادّة حديديّة في مجال مغنطيسيّ.»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«مغنطة — magnetization — magnétisation; aimantation — Physics»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
        - text: "«مَغْنَطَة — magnetization — aimantation — The Unified Medical Dictionary»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "«مَغْنَطَة، تَمَغْنُط — magnetization — magnétisation; aimantation — Geology»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — ARABTERM"
        - text: "«مغنطة — magnetization — aimantation — Printing - Electricity»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1: طباعة - كهرباء (1996) — ARABTERM"
        - text: "«مغنطة — magnetization, f — Electropedia»"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"

    - lemma: "تمغنط"
      confirm:
        - text: >
            «تمغنطَ يتمغنط، تَمَغْنُطًا، فهو مُتمغنِط • تمغنط المعدِنُ: مُطاوع مغنطَ:
            تزوّد بالقوّة المغناطيسيّة "تمغنطتِ الإبرةُ بلمس المغناطيس لها".»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«مَغْنَطَة، تَمَغْنُط — magnetization — magnétisation; aimantation»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — ARABTERM"
        - text: "«شدة التمغنط — intensity of magnetization — intensité d'aimentation»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1 — ARABTERM"
        - text: "«تيار تمغنط — magnetizing current — courant de magnétisation»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"

    - lemma: "حَثٌّ مَغْنَاطِيسِيّ"
      confirm:
        - text: "«حثّ مغناطيسي — magnetic induction — induction magnétique (f.) — Electrical Engineering»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
        - text: "«حث مغنطيسي — magnetic induction — induction magnétique — Physics»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
      contradicts:
        - text: "«تحريض مغنطيسي — magnetic induction — induction magnétique — Geology»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — ARABTERM"
          conflict: >
            حثّ/تحريض مغنطيسي في المعاجم الفيزيائية يُقابل B (كثافة الفيض المغنطيسي)
            وهو مقدار مختلف عن M (المغنطة). المصطلح يشير إلى الأثر الناتج عن المغنطيسية
            لا إلى عملية المغنطة ذاتها؛ وإدراجه مرادفاً للمغنطة ملتبسٌ علمياً.

    - lemma: "إِكْسَابُ المَغْنَاطِيسِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مغنطة"
      decision: confirmed
      decision_reason: >
        موثَّقة في معجم اللغة العربية المعاصرة بتعريف مطابق حرفياً لتعريف المجموعة
        ('عمليّة جعل مادّة ما مغنطيسيّة بشكل دائم أو مؤقّت')، وفي ستة معاجم تقنية
        متخصصة عربية. مصدر قياسي مطّرد على وزن فَعْلَلَة. تجتاز بوابات الجودة
        المصطلحية جميعها. تحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مَغْنَطَة مصدر الفعل المتعدي مَغْنَطَ — يُعبّر عن العملية الفاعلة النشطة:
        إكساب المادة الخاصية المغنطيسية بفعل عامل خارجي. يُستعمل في سياقات الوصف
        التقني للعملية الصناعية أو التجريبية ('تمّت مَغْنَطَة القضيب').
      quality_gate:
        consistency: "مطّرد — وزن فَعْلَلَة منتج في المصادر الرباعية"
        ease_of_use: "يسير التداول، مفرد قصير سهل النطق والتصريف والإضافة"
        fitness: "ملائم للسياق الفيزيائي والطبي والتقني والصناعي"
        heritage_preference: "مُشتق من اقتراض تراثي قديم دخل العربية في العصور الوسطى"
        arabic_preference: "عربيّ الصيغة والاشتقاق رغم أصل الجذر اليوناني"
        derivability: "منتج: مُمَغنِط، مُمَغْنَط، مغنطة، تمغنط، مغنطيسية..."
      morphology_check: "وزن فَعْلَلَة مناسب للمصدر الدال على الحدث الفيزيائي من الفعل الرباعي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَغْنَطَة"

    - lemma: "تمغنط"
      decision: confirmed
      decision_reason: >
        موثَّق في معجم اللغة العربية المعاصرة مصدرًا للفعل المطاوع تمغنطَ بالضبط
        الدقيق 'تَمَغْنُطًا'، وفي معجمَي الجيولوجيا والفيزياء ضمن مركبات اصطلاحية
        معترف بها (شدة التمغنط، تيار تمغنط). مصدر قياسي على وزن تَفَعْلُل.
        يُكمّل مَغْنَطَة من الجانب الانعكاسي/المطاوع. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تَمَغْنُط مصدر الفعل اللازم تَمَغْنَطَ — يُعبّر عن العملية الانعكاسية:
        اكتساب المادة ذاتِها للخاصية المغنطيسية. يُستعمل حين يكون التركيز على
        استجابة المادة ('تَمَغْنُط الإبرة') لا على الفعل الخارجي. مناسب أكثر
        للسياقات التي تصف الظاهرة من منظور المادة المتأثرة.
      quality_gate:
        consistency: "مطّرد — وزن تَفَعْلُل قياسي في مطاوع الرباعي"
        ease_of_use: "يسير التداول، مستعمل في المركبات التقنية الفيزيائية"
        fitness: "ملائم لسياقات الجيولوجيا والفيزياء والمعادن"
        heritage_preference: "مشتق بصيغة عربية قياسية من الجذر المعرَّب"
        arabic_preference: "عربيّ الوزن والصياغة الصرفية"
        derivability: "متمغنط، تمغنط، استتمغنط (نادر)..."
      morphology_check: "وزن تَفَعْلُل يناسب المطاوعة والانعكاس في الرباعي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَغْنُط"

    - lemma: "حَثٌّ مَغْنَاطِيسِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        يُقابل في المعاجم التقنية العربية المصطلحَ الإنجليزي 'magnetic induction'
        بمعنى كثافة الفيض المغنطيسي (B = magnetic flux density)، وهو مقدار فيزيائي
        مختلف تماماً عن المغنطة (M = magnetization). إدراجه في OEWN ضمن هذا المجمع
        خطأ اصطلاحي؛ ولا يجوز استيراد هذا الخطأ إلى العربية. حُذف.

    - lemma: "إِكْسَابُ المَغْنَاطِيسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد أدلة معجمية على استخدامه وحدةً معجمية ثابتة. يفشل اختبار السكّ:
        يمكن إبدال 'إكساب' بـ'منح' أو 'تحقيق' وتبقى العبارة وصفاً مقبولاً —
        دليل على أنها عبارة حرة لا مصطلح. حُذف.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "العملية التي تجعل المادة مغناطيسية (مؤقتاً أو بشكل دائم)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح دلالياً لكنه مصاغ بأسلوب الجملة الفعلية العامية ('تجعل')
        بدلاً من الأسلوب المصطلحي للمعجم الوسيط. كما يستخدم 'مغناطيسية' فيما يستخدم
        معجم اللغة المعاصرة 'مغنطيسية'. ينقصه الجنس القريب المصطلحي الدقيق والمثال
        التوضيحي على الآلية.
    authored:
      - type: terminological
        text: >
          (فيزياء) عمليَّةٌ تَكَسَّبُ بِها مادَّةٌ ما الخاصِّيَّةَ المَغْنَطِيسِيَّةَ
          كَسبًا دائمًا أو مؤقَّتًا، كأن تُعرَّضَ مادَّةٌ حديديَّةٌ لمجالٍ مَغْنَطِيسيٍّ
          فَتَكَسِبَ قوَّةَ الجَذبِ المَغْنَطِيسيِّ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          (فيزياء) عمليَّةٌ تُرتَّبُ فيها العَزَمَاتُ المَغْنَطِيسِيَّةُ لِلذرَّاتِ أو
          الجُزَيئات داخل مادَّةٍ ما في اتِّجاهٍ واحد فَتُصبح المادَّةُ مَغْنَطيسيَّةً.
          وقد يكون التَّمَغنُّطُ دائِمًا كالفولاذ المُقسَّى، أو مؤقَّتًا كالحديد
          اللَّيِّن، تَبَعًا للتَّركيبِ البِلَّوريِّ للمادَّة وطبيعةِ المجالِ المُؤَثِّر.
    actions:
      - command: update_definition
        params:
