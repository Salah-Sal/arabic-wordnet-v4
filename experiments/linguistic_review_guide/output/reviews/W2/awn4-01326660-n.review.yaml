      entry_id: "{auto}"
      roots:
        - word: "حيوان"
          root: "حيي"
          maqayis_quote: "«الْحَاءُ وَالْيَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ: أَحَدُهُمَا خِلَافُ الْمَوْتِ، وَالْآخَرُ الِاسْتِحْيَاءُ الَّذِي [هُوَ] ضِدُّ الْوَقَاحَةِ.»"
