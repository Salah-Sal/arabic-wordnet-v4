      source: stage1
      decision: removed
      decision_reason: "اشتقاق قياسي طريف لم يُسجَّل في أي معجم عربي. رغم منطقية اشتقاقه من تُحفة وملاءمته الدلالية، فإن غياب التوثيق المعجمي يحول دون قبوله لمّةً في AWN4."

    - lemma: "براعة فنية"
      source: stage1
