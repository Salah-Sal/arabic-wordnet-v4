      nuance_differentiation: "يركّز على القيمة بوصفها حُكماً تقديريًّا خارجياً يُنسب إلى العمل الفني من قِبَل النقاد والخبراء والمقتنين، مُعبِّرًا عن البُعد الاقتصادي-الجمالي الذي يُضفيه الإتقانُ الفني على الأثر."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِيمَةٌ فَنِّيَّة"

    - lemma: "رونق"
      source: stage1
      decision: removed
      decision_reason: "رغم ثراء رونق الدلالي في معنى الحسن والبهاء الجمالي، إلا أن المعاجم المعاصرة والكلاسيكية تقصره على الجمال الحسّي العام (لمعة السيف، طراءة الشباب، بهاء الضحى) دون أن تُخصّصه للجودة الفنية للتحف. استعماله بهذه الدلالة التقنية لا يعدو كونه مجازاً وصفياً عاماً لا مصطلحاً نقدياً مسكوكاً. فضلاً عن أن إضافة كلمة مفردة إلى جانب مركّبَيْن موثَّقَيْن قد تُربِك الشبكة الدلالية."

