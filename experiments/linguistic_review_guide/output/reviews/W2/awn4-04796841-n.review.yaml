# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (جودة فنية، قيمة فنية) خاليتان من التشكيل الكامل"
      - "التعريف العربي الحالي دائري: يستخدم «الجودة الفنية» لتعريف لمّة «جودة فنية»"
      - "لا توجد لمّة مفردة مسكوكة تقابل المفهوم الأنجلو-لاتيني virtu/vertu بدقة"
      - "المفهوم ذو طابع نقدي تخصصي (تحف، فنون جميلة) لا يُعبَّر عنه بكلمة عربية مفردة مستقرة"
    observations: "المجموعة تقابل virtu/vertu المستعار من الإيطالية virtù (التفوق والفضيلة الفنية). يدلّ المصطلح في الاستعمال التخصصي على الجودة الجمالية الرفيعة التي تتميز بها التحف والأعمال الفنية، مما يمنحه طابعاً نقدياً أكاديمياً. اللمّتان الموجودتان تعبيران وصفيان مباشران يصفان المفهوم دون أن يُشكِّلا مصطلحاً مسكوكاً خاصاً به، وهو ما يعكس الفجوة المعجمية الحقيقية في هذا الحقل الدلالي."
  blind_candidates:
    - lemma: "رَوْنَق"
      generation_method: majaz
      justification: "رونق كلمة عربية فصيحة أصيلة تعني الحسن والبهاء والصفاء الجمالي للشيء (رونق السيف: صفاؤه وحسنه وبريقه). الإزاحة الدلالية المقترحة: توسيع المعنى من البريق الحسّي إلى الجودة الجمالية الفنية الرفيعة للتحف والأعمال الفنية، إحياءً لدلالة قديمة في سياق جديد."
    - lemma: "تُحَفِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من تُحفة (الأثر الفني النادر) على وزن فُعْلِيَّة، يدلّ على صفة التحفيّة أي كون الأثر تُحفةً تتميز بجودتها الفنية الرفيعة. الاشتقاق قياسي من جذر ثابت في المعجم العربي، وإن لم يُسجَّل بعد."
    - lemma: "بَرَاعَةٌ فَنِّيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي من براعة (التفوق والإتقان) وفنية، يقابل اللاتيني virtus الذي هو الأصل الاشتقاقي لكلمة virtu الإنجليزية، مع التركيز على جانب الإتقان والتميز الفني كصفة للعمل."
    - lemma: "نَفَاسَة"
      generation_method: ishtiqaq
      justification: "مصدر على وزن فَعَالة من نفيس (الشيء ذو الخطر والقيمة الرفيعة)، يدل على صفة كون الأثر نفيساً بالغ الجودة الفنية. وردت في مقاييس اللغة: «شيء نفيس أي ذو نفس وخطر يُتنافَس به»، وتستعمل في سياق تثمين الأعمال الفنية والتحف."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "جودة فنية"
      evidence_status: "no_material_found"

    - lemma: "قيمة فنية"
      confirm:
        - text: "«قيمة فنية» بترجمة إنجليزية: artistic quality، المجال: Educational and Computer Techniques"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية، ALECSO (1999)"

    - lemma: "رونق"
      confirm:
        - text: "«رَوْنَقُ السيفِ: ماؤُهُ وصفاؤُهُ وحُسْنُه؛ رونقُ الضُّحى: أوَّلُه؛ رونق الشباب: أوَّلُه وطراءتُه»"
          source: "المعجم الوسيط (مجمع القاهرة)"
        - text: "«ماءُ السَّيفِ وصفاؤُه وحُسنُهُ وبريقه الذى يتلألأ مُتَمَوِّجًا»"
          source: "المعجم الكبير (مجمع القاهرة)"
        - text: "«رونق... حُسْن وبهاء وإشراق؛ بدا عليه رونق النَّعيم: أثره؛ رونق الشَّباب: أوَّله وطراوته، ماؤه ونضارته؛ رونق السَّيف: صفاؤه ولمعانه»"
          source: "معجم اللغة العربية المعاصرة، أحمد مختار عمر (ت. 2003)"
      expands:
        - text: "«الرونق: الحسن من رنق الطائر إذا دار في الهواء ويحتمل كونه من الرنق وهو الكدر الذي زايله الكدر»"
          source: "التوقيف على مهمات التعاريف، المناوي (ت. 1622)"
          addition: "يكشف الأصل الاشتقاقي: رنق = اضطراب الصافي؛ ورونق الشيء هو ما يتلألأ فيه من صفاء بعد تخلّصه من الكدر — تأويل يناسب البهاء الفني الرفيع المتحصّل من الصنعة المتقنة. الجذر رنق في مقاييس اللغة: «يدلّ على اضطراب شيء متغيّر له صفوه إن كان صافياً»."

    - lemma: "تحفية"
      evidence_status: "no_material_found"

    - lemma: "براعة فنية"
      evidence_status: "no_material_found"

    - lemma: "نفاسة"
      evidence_status: "no_material_found"

  supplementary_evidence:
    english_bridge:
      - text: "«(١) حُبّ الطُّرَف الفنِّيّة (٢) طُرَف فَنِّيّة»"
        source: "المورد الحديث (2008)، ترجمة: virtu"
        note: "يكشف عن بُعدَيْن في المصطلح: الموضوعي (طرف فنية = أشياء فنية نادرة) والذاتي (حب الطرف الفنية = تقدير جودتها). ويؤكد أن «طرفة» بمعنى الشيء الطريف النادر المستحدَث هو المقابل الأقرب للمعنى العيني، لكنّ المجموعة تستهدف المعنى المجرد (الجودة كصفة)."
      - text: "«= virtu»"
        source: "المورد الحديث (2008)، مدخل: vertu"


