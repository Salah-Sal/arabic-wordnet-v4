      decision_reason: "براعة تدلّ على التفوق والمهارة الفاعلة للفنان (الجانب الإبداعي النشط)، بينما تستهدف المجموعة الصفةَ الكامنة في العمل الفني ذاته (جودته المتقنة بوصفها نتيجة). المصطلح لا يقابل virtu بدقة، وهو غائب كمركّب اصطلاحي مسجَّل."

    - lemma: "نفاسة"
      source: stage1
      decision: removed
      decision_reason: "نفاسة تدلّ على الثمن الجمالي العام وكون الشيء نفيساً ذا قيمة، وهي أعمّ من المطلوب وتتداخل مع دلالة «قيمة فنية» المُؤكَّدة. لم توجد في قاعدة البيانات كمدخل مباشر، ودلالتها تنحو نحو القيمة المادية والندرة أكثر من الجودة الفنية التقنية."


