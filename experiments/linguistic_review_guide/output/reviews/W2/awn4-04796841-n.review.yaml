      decision: confirmed
      decision_reason: "التعبير الأكثر تداولاً في العربية المعاصرة للدلالة على هذا المفهوم في النقد الفني والأدبيات المتخصصة، ويطابق المعنى الجوهري للمجموعة. رغم غيابه كمدخل مستقل في المعاجم الأساسية، فإن مكوّنيه موثّقان توثيقاً وافراً، ومجموع دلالتيهما يُحدِّد المفهوم بدقة. يحتاج إلى تشكيل كامل."
