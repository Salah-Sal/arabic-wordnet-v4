# مراجعة المجموعة الترادفية: awn4-13591777-n
# العملية العضوية لتورم الأنسجة (tumefaction)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان مكتوبتان بدون تشكيل (انتفاخ، تورم): «تورم» تحتمل قراءتَين: تَوَرُّم (المصدر المراد) أو تَوْرَم (اسم طائر وارد في المعجم الكبير)؛ التشكيل الكامل واجب لرفع الإبهام"
      - "التعريف العربي يكرر لفظ «عملية» مرتين في جملتين متتاليتين، ويستعمل «التورم» داخل التعريف وهو إحدى لمّات المجموعة ذاتها (دوران جزئي)"
      - "عبارة «بداخلها» مُبهمة؛ الأدق تحديد موضع التراكم: الفراغات البيْنخلوية أو الأنسجة الضامة"
    observations: "المجموعة تتناول العملية العضوية للتورم بتراكم السوائل المصلية في الأنسجة (tumefaction). المفهوم طبي-بيولوجي صرف، وكلتا اللمّتين مشتقتان من جذرين عربيين راسخين: ورم (أخصّ بالمجال الطبي) ونفخ (أوسع استعمالاً يمتد إلى سياقات فيزيائية وغير طبية). المجموعة في موضعها الصحيح تحت المشمول المباشر «عملية بيولوجية»، وتحتاج فقط تصحيح التشكيل وتنقية التعريف."
  blind_candidates:
    - lemma: "تَوَرُّم"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من جذر ورم (أن يَنْفِرَ اللحم)؛ وزن تَفَعُّل يُفيد التحوّل التدريجي والعملية المستمرة لا مجرد الحالة، وهو الأنسب للتعبير عن عملية حدوث الورم كما يقتضيه التعريف."
    - lemma: "اسْتِسْقَاء"
      generation_method: majaz
      justification: "مصدر استَفْعَلَ من جذر سقو/سقي (إشراب الشيء الماء)؛ يُفيد بالإزاحة الدلالية تراكم السوائل في الجسم، وقد استُعمل قديماً وحديثاً لتجمّع السوائل المرضي؛ وجهُ المشابهة هو «امتلاء الجسم بالماء» المقابل لـ«تراكم السوائل» في التعريف."
    - lemma: "اِنْتِبَاج"
      generation_method: ishtiqaq
      justification: "مصدر انتَبَجَ على وزن اِنتِفَال من جذر نبج؛ ورد في المعجم التشريحي لمعنى intumescence (التورم الناتئ)، ويُفيد عملية البروز والانتفاخ الملائِمَة للسياق الطبي."
    - lemma: "تَمَيُّه"
      generation_method: ishtiqaq
      justification: "مصدر تَمَيَّهَ من جذر مه/ميه الدال على الماء؛ قِيسَ أنه يُفيد عملية تشبّع الأنسجة بالسوائل المطابقة لـ«تراكم السوائل بداخلها» في التعريف، لكن ثبت بالأدلة أنه يعني hydration (ترطيب جزيئي) لا تورماً."


