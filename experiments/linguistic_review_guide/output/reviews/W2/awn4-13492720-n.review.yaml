# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة «محي» غامضة الإعراب والضبط: إن قُرئت «مُحِّيّ» دلَّت في المعجم الطبي الموحد على النسبة إلى مُحّ البيض (lecithal/vitelline)؛ وإن قُرئت «مَحِيّ» فهي اسم مفعول (ممحوّ) لا مصدر للعملية"
      - "اللمة «ترقق عنق الرحم» عبارة وصفية حرة لا مصطلح مسكوك: يمكن إبدال «ترقق» بـ«تخفيف» أو «ضعف» وتبقى صالحةً وصفاً؛ كما أن «ترقق» في ARABTERM مصطلح جيولوجي (lamination) لا توليدي"
      - "التعريف الحالي يفتقر إلى الجنس القريب الصريح (تغيُّر فسيولوجيّ / عملية)؛ كما أن «مع اتساعه» تُوهم بالتزامن مع الاتساع في حين أن الامِّحاء يسبق الاتساع في البِكر"
      - "المصطلح المعتمَد في المعجم الطبي الموحد (2009) هو «امِّحاء (عُنُقِ الرَّحِم)» مقابل effacement، وهو غائب عن اللمّات المسجَّلة"
    observations: >
      المجموعة تصف عملية طبية توليدية محددة تُعرف بـ«effacement» الإنجليزية: انمحاء عنق الرحم أثناء المخاض.
      المفهوم قائم في الممارسة الطبية العربية وتحمله المعاجم الطبية الموحَّدة بصورة «امِّحاء عُنُقِ الرَّحِم»،
      لكن اللمّتَين المسجَّلتَين إما وصفية غير مسكوكة («ترقق عنق الرحم»)، وإما مبهمة الدلالة أو خاطئة («محي»).
      الجذر م-ح-و المُثبَّت في مقاييس اللغة بمعنى «الذهاب بالشيء وإزالة أثره» يُنتج المصدر «امِّحاء»
      على وزن افْعِلَال، وهو الصيغة الأنسب للعملية الفسيولوجية التي «يذهب» فيها عنق الرحم ويندمج في الرحم.
  blind_candidates:
    - lemma: "اِمِّحَاء عُنُقِ الرَّحِم"
      generation_method: tarkib
      justification: >
        مركَّب إضافي: «اِمِّحاء» مصدر امَّحى من جذر م-ح-و على وزن افْعِلَال (إذهاب الأثر الكلي)،
        مضاف إلى «عُنُقِ الرَّحِم». يصف اندماج عنق الرحم وزوال حدوده أثناء المخاض.
        الوزن الصرفي افْعِلَال يناسب مصادر التحوُّل الكامل في المصطلحية الطبية.
    - lemma: "تَقَصُّر عُنُقِ الرَّحِم"
      generation_method: tarkib
      justification: >
        مركَّب إضافي: «تَقَصُّر» مصدر تقصَّر من جذر ق-ص-ر على وزن تَفَعُّل، يعكس مباشرةً
        الجانب الأول من التعريف «قِصَر عنق الرحم»؛ يصف التغيُّر في الطول دون سواه.
    - lemma: "تَلَاشِي عُنُقِ الرَّحِم"
      generation_method: majaz
      justification: >
        إزاحة دلالية: «تَلَاشٍ» من جذر ل-ش-ي، يدل على الاضمحلال والذوبان الكلي. الجسر المجازي:
        كما يتلاشى الغيم في الهواء يتلاشى عنق الرحم في جدار الرحم. لفظ عربي أصيل لكن غير مسكوك طبياً.
    - lemma: "اِنْمِحَاء عُنُقِ الرَّحِم"
      generation_method: tarkib
      justification: >
        مركَّب إضافي: «اِنْمِحاء» مصدر انمحى من جذر م-ح-و على وزن انْفِعَال (الصيغة اللازمة للمحو)،
        يصف العملية من منظور ما يحدث لعنق الرحم تلقائياً دون إسناد فاعل خارجي.


