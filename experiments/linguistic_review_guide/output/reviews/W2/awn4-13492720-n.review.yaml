      decision: removed
      decision_reason: >
        تفشل اللمة في اختبارين حاسمَين: (أ) اختبار السكّ — يمكن إبدال «ترقق» بـ«تخفيف» أو «ضعف»
        مع بقاء العبارة وصفاً صالحاً، مما يكشف أنها عبارة وصفية حرة لا وحدة معجمية ثابتة؛
        (ب) اختبار التثبيت المعجمي — المركَّب غير مسجَّل في أي معجم طبي موحَّد.
        فضلاً عن ذلك، «ترقق» في المعاجم الموحَّدة مصطلح جيولوجي (lamination) يُحيل إلى تتابع الرواسب
        في طبقات رقيقة لا إلى عملية توليدية؛ كما أنه يصف جانباً واحداً (الترقُّق) ويغفل التقصُّر
        والاندماج في الجزء الأسفل من الرحم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "محي"
      decision: removed
      decision_reason: >
        اللمة معطوبة معجمياً من جهتين: (أ) إن ضُبطت «مُحِّيّ» فهي في المعجم الطبي الموحد صفة
        نسبية تعني «لِقَحِيّ» أو «صُفارِيّ» (نسبة إلى مُحّ البيض) من جذر محح، وهو مفهوم طبي
        غير ذي صلة؛ (ب) إن ضُبطت «مَحِيّ» فهي اسم مفعول (ممحوّ) من مَحَى، لا مصدر لعملية
        الامِّحاء. لا يوجد مسار ضبط يُعطيها معنى مصدراً أو اسماً للعملية الموصوفة في هذه المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اِمِّحَاء عُنُقِ الرَّحِم"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح موحَّد مسجَّل في المعجم الطبي الموحد (2009) بالصورة «امِّحاء (عُنُقِ الرَّحِم)»
        مقابل effacement، مما يمنحه صفة الوحدة المعجمية الثابتة. جذره م-ح-و راسخ في مقاييس اللغة
        بمعنى «الذهاب بالشيء وإزالة أثره»، وهو ما يصف تلاشي حدود عنق الرحم وندماجه في الرحم.
        الوزن الصرفي (افْعِلَال) يناسب مصادر التحوُّل الكامل في المصطلحية الطبية.
        يجتاز اختبار السكّ: «امِّحاء» لا يمكن إبداله بلفظ آخر دون فقدان الدلالة الاصطلاحية.
        فحص الملاءمة الصرفية: افْعِلَال يُستخدم في المصطلحية الطبية لمصادر التحوُّل الكامل
        (الاحتراق، الانقلاب، الاندماج)، وهو مناسب لوصف اندماج عنق الرحم في الرحم.
        فحص الاقتراض المفهومي: «امِّحاء» ليس ترجمة حرفية عمياء بل قابلية عربية أصيلة تلتقي
        مع الدلالة العلمية لـ«effacement».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يصف العملية الثلاثية الأبعاد (تقصُّر + ترقُّق + اندماج في الرحم) كوحدة فسيولوجية متكاملة؛
        يتمايز عن «توسيع عنق الرحم» (metreurysis/dilation) الذي يصف الاتساع المستعرض وحده،
        وعن «تقصُّر عنق الرحم» الذي يصف الاختصار دون الترقُّق والاندماج.
