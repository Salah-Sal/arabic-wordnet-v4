      maqayis_quote: "«الْبَاءُ وَالطَّاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الشَّقِّ...» (ملاحظة: اللفظ معرب حديثاً ولكن يدرجه المعجم الوسيط تحت هذا الجذر)"
