stage1_review:
  assessment:
    concerns:
      - "اللمة 'بطارية' هي ترجمة حرفية (calque) للمصطلح الإنجليزي، ولكنها مقبولة في السياق العسكري والنفسي."
      - "اللمة 'طاقم' تشير غالباً للأفراد (crew)، بينما الأنسب للأدوات هو 'طقم'."
      - "اللمة 'مجموعة متسلسلة' وصفية أكثر منها مصطلحاً مسكوكاً."
    observations: "المجموعة تغطي مفهوم 'البطارية' أو 'الطقم' من الأشياء المترابطة وظيفياً. المصطلح العربي الأقوى في هذا السياق هو 'طقم' للأدوات، و'عدة' للتجهيزات، و'سلسلة' للأشياء المتتابعة."
  blind_candidates:
    - lemma: "طَقْم"
      generation_method: ishtiqaq
      justification: "المصطلح الأكثر شيوعاً ودقة في العربية المعاصرة لمجموعة من الأشياء المتكاملة (مثل طقم أدوات، طقم أسنان)."
    - lemma: "سِلْسِلَة"
      generation_method: majaz
      justification: "تستخدم للتعبير عن مجموعة من الأشياء المتتابعة أو المترابطة (مثل سلسلة اختبارات، سلسلة مقالات)."
    - lemma: "عُدَّة"
      generation_method: majaz
      justification: "تستخدم لمجموعة الآلات أو التجهيزات المعدة لغرض معين (مثل عدة النجارة، عدة الطبيب)."
    - lemma: "تَوْلِيفَة"
      generation_method: ishtiqaq
      justification: "مجموعة من العناصر المؤلفة معاً لتحقيق نتيجة معينة."

stage2_evidence:
  per_lemma:
    - lemma: "بَطَّارِيَّة"
      confirm:
        - text: "بَطَّارِيَّةٌ ضارِبة Battery ( فى الاصطلاح العسكرى ) : عِدَّة مدافع تُطْلَق معًا"
          source: "المعجم الكبير"
        - text: "بطارية اختبارات"
          source: "عرب تيرم (الفن، التسلية والرياضة)"
    - lemma: "طاقِم"
      confirm:
        - text: "طاقِم السفينة أو الطائرة: مجموعة الأشخاص الذين يقومون بإدارتها وخدمتها"
          source: "معجم اللغة العربية المعاصرة"
      contradicts:
        - text: "الطاقم: مجموعة متكاملة من الأفراد مكلفة بعمل معين."
          source: "المعجم الكبير"
          conflict: "التعريف يركز على الأفراد (الأطقم البشرية) بينما المجموعة تخص الأشياء."
    - lemma: "مَجْمُوعَة مُتَسَلْسِلَة"
      evidence_status: "no_material_found"
    - lemma: "طَقْم"
      confirm:
        - text: "طَقْم: مجموعة متكاملة من الأدوات أو الأشياء تُستعمل لأغراض خاصَّة"
          source: "معجم اللغة العربية المعاصرة"
        - text: "الطقم: مجموعة متكاملة من الأدوات تستعمل في أغراض خاصة (مج)"
          source: "المعجم الوسيط"
    - lemma: "عُدَّة"
      confirm:
        - text: "العُدَّةُ: الاسْتِعْدَادُ ما أُعِدَّ لأمرٍ يحدُثُ"
          source: "المعجم الوسيط"
        - text: "الأدوات والأجهزة والأدوية والكتب وغيرها من المعدات التي يستعملها الطبيب في مهنته."
          source: "معجم المصطلحات الطبية"
    - lemma: "سِلْسِلَة"
      confirm:
        - text: "ويعبر بها عن الأشياء المتتابعة فيقال سلسلة مقالات أو مؤلفات وما أشبه"
          source: "المعجم الوسيط"
        - text: "سلسلة: مصطلح عام يدل عادة على مجموعة متراصة من المحارف، أو مجموعة مرتبطة فيما بينها من العمليات التقنية"
          source: "عرب تيرم (تقانة المعلومات)"

stage3_analysis:
  per_lemma:
    - lemma: "بطارية"
      decision: confirmed
      decision_reason: "مقبولة في السياقات المتخصصة (العسكرية والنفسية) لتعني مجموعة من الأشياء (مدافع أو اختبارات) المستخدمة معاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَطَّارِيَّة"
    - lemma: "طاقم"
      decision: confirmed
      decision_reason: "رغم أن الأصل فيها الأفراد، إلا أنها تستخدم في العربية المعاصرة بشكل واسع لتعني 'طقم' من الأشياء."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طاقِم"
    - lemma: "مجموعة متسلسلة"
      decision: confirmed
      decision_reason: "تعبير وصفي صحيح لغوياً لمفهوم الـ battery عندما تكون الأشياء مرتبة في متوالية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوعَة مُتَسَلْسِلَة"
    - lemma: "طَقْم"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الأساسي في العربية لمجموعة متكاملة من الأدوات أو الأشياء (set/battery)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "طَقْم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07970413-n"}
    - lemma: "عُدَّة"
      source: stage1
      decision: confirmed
      decision_reason: "تشير إلى مجموعة الأدوات والتجهيزات المعدة لغرض وظيفي محدد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عُدَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07970413-n"}
    - lemma: "سِلْسِلَة"
      source: stage1
      decision: confirmed
      decision_reason: "تشير إلى مجموعة الأشياء المتتابعة والمرتبطة ببعضها (مثل سلسلة جبال، سلسلة اختبارات)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "سِلْسِلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07970413-n"}

stage4_content:
  definition:
    current: "مجموعة من الأشياء المترابطة مخصصة للاستخدام معًا"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح ولكنه بسيط جداً، يفضل إثراؤه بمصطلحات المعاجم العربية."
    authored:
      - type: terminological
        text: "مجموعة متكاملة من الأدوات أو الأجهزة أو التجهيزات المترابطة التي تُستعمل معاً لتحقيق غرض معين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "تطلق في السياق العسكري على عدة مدافع تُطلق معاً، وفي السياق العلمي والنفسي على مجموعة مرتبطة من الاختبارات أو المقاييس، وفي السياق العام على طقم متكامل من الأدوات."
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07970413-n", definition_index: 0, text: "مجموعة متكاملة من الأدوات أو الأجهزة أو التجهيزات المترابطة التي تُستعمل معاً لتحقيق غرض معين."}
      - command: add_definition
        params: {synset_id: "awn4-07970413-n", text: "تطلق في السياق العسكري على عدة مدافع تُطلق معاً، وفي السياق العلمي والنفسي على مجموعة مرتبطة من الاختبارات أو المقاييس."}

  examples:
    per_lemma:
      - lemma: "بَطَّارِيَّة"
        examples:
          - text: "أطلقت بطارية المدافع وابلاً من القذائف على مواقع العدو."
            type: usage
          - text: "خضع الطلاب لبطارية اختبارات لتقييم مهاراتهم اللغوية."
            type: usage
      - lemma: "طَقْم"
        examples:
          - text: "اشترى الفني طقم أدوات جديداً لإصلاح الأجهزة الإلكترونية."
            type: usage
      - lemma: "عُدَّة"
        examples:
          - text: "أحضر الجراح عدته الكاملة قبل بدء العملية."
            type: usage
      - lemma: "سِلْسِلَة"
        examples:
          - text: "وجهت اللجنة سلسلة من الأسئلة المحرجة للمسؤول."
            type: usage

