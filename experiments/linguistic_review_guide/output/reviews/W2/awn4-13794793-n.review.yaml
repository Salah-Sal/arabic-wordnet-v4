# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13794793-n (precipitation/quantity)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تساقط، هطول) بلا تشكيل — يجب ضبطهما"
      - "«تساقط» مصدر الفعل تَسَاقَطَ في المعاجم الكلاسيكية ويدلّ على الحدث لا الكمّيّة، لكنه اكتسب دلالة مصطلحية حديثة في علم الأرصاد"
      - "المجموعة تحت فرط النوع «كمية تقديرية» مما يؤكد أن المقصود هو المقدار المقيس لا ظاهرة الهطول ذاتها"
    observations: "المفهوم يقع في تقاطع الأرصاد الجوية والهيدرولوجيا: الكمّيّة المُقاسة للمياه المتساقطة على رُقعة محددة في مدة زمنية معلومة. العربية تملك لفظتين مصدريتين راسختين في الاستعمال المصطلحي الحديث هما «تساقط» و«هطول»، وكلتاهما مُثبتتان في معاجم ALECSO الموحَّدة في حقول الأرصاد وهندسة المياه والطاقة المتجددة. الجذران (سقط) و(هطل) كلاهما يدلّ على الوقوع والتتابع."

  blind_candidates:
    - lemma: "هَطْل"
      generation_method: ishtiqaq
      justification: "مصدر هَطَلَ على وزن فَعْل، وهو المصدر الأصيل الفصيح لتتابع المطر. في المعاجم الكلاسيكية: الهَطْلُ تتابعُ المطر والدمع وسيلانه. أولى بالاعتبار من هُطُول وفق معجم الصواب اللغوي."
    - lemma: "تَهَاطُل"
      generation_method: ishtiqaq
      justification: "من الجذر هطل على وزن تَفَاعُل الذي يفيد التتابع والاشتراك. المعجم الوسيط: تهاطل القومُ ونحوهم تتابعوا. يمكن توسيعه مجازاً ليشمل تتابع سقوط المطر."
    - lemma: "كَمِّيَّةُ الأَمْطَار"
      generation_method: tarkib
      justification: "مركب إضافي يصف المقدار المطري مباشرة. وارد في المعجم الموحد لمصطلحات التجارة والمحاسبة مقابل rainfall."
    - lemma: "تَسَاقُطَات"
      generation_method: ishtiqaq
      justification: "جمع تساقُط، يُستعمل في الأدبيات الهيدرولوجية بمعنى المتساقطات المطرية. وارد في المعجم الموحد لمصطلحات المياه."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَسَاقُط"
      confirm:
        - text: "«تَساقُط — precipitation»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«تًساقُط — precipitate / precipitation»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«تساقُط — precipitation»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية"
        - text: "«كمّية التَّسَاقُط — amount of precipitation; rainfall amount»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«تساقط (متساقطات) — 1- المادة السائلة أو الجامدة التي تنتج من تكاثف بخار المياه في الجو، وتتراكم في الغيوم، وتتساقط على الأرض. 2- كمية المتساقطات على وحدة مساحة أفقية خلال وحدة زمنية.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«(تساقط) سقط وتتابع سُقُوطه وَعَلِيهِ ألْقى نَفسه وَيُقَال أساقط»"
          source: "المعجم الوسيط (هورماني)"
          addition: "الأصل اللغوي فعل يدل على تتابع السقوط، ثم تحوّل إلى مصدر اصطلاحي"
        - text: "«الشيءُ: سَقَط تَتَابَع وُقُوعُه»"
          source: "المعجم الكبير"
          addition: "التعريف المعجمي الكلاسيكي يؤكد دلالة التتابع في السقوط"

    - lemma: "هُطُول"
      confirm:
        - text: "«هُطُول — precipitation (e.g. rainfall)»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«هُطُول — جميع أشكال الماء (أو الجليد) التي 'تسقط' من السماء. وكذلك الرذاذ والمطر والصقيع والثلوج والبرد ويشمل الندى والصقيع والضباب»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "«هطول — المياه، بما فيها من شوائب، التي تتساقط من السُحب على الأرض بفعل الجاذبية، في صورة سائلة أو صلبة، أو التي تترسّب مُباشرةً على أسطح الأشياء من خلال التكثيف أو تكرير التسامي.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«هطول — precipitation»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«هُطُول — الجذر: هـ ط ل. مثال: هُطُول المطر. الرأي: مرفوضة. السبب: لعدم وروده في المعاجم. الصواب والرتبة: هَطْل المطر [فصيحة] — هُطُول المطر [صحيحة]. التعليق: أجاز مجمع اللغة المصري قياسيَّة فُعُول مصدراً لفَعَلَ اللازم»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "هُطُول ليس مسموعاً عن العرب لكنه مقيس وأجازه المجمع، والفصيح هَطْل"

    # ── المرشحات ──
    - lemma: "هَطْل"
      confirm:
        - text: "«الهَطْلُ: المَطَرُ الضعيفُ الدائمُ، وتَتابُعُ المَطَرِ المُتَفَرِّقِ العظيمِ القَطْرِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الهطل) الْمَطَر المتتابع والإعياء»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«الهَطْلُ تتابعُ المطر والدمع وسيلانه»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«الهَطَلانُ: تتابُع القَطْر المُتَفَرِّق العِظام»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
      expands:
        - text: "«الصواب والرتبة: هَطْل المطر [فصيحة] — هُطُول المطر [صحيحة]»"
          source: "معجم الصواب اللغوي"
          addition: "هَطْل هو المصدر الأفصح والأقدم مقابل هُطُول المقيس"
      contradicts:
        - text: "«الهَطْل: المطر الضعيف الدائم»"
          source: "القاموس المحيط"
          conflict: "هَطْل في التراث يدلّ على الحدث (فعل المطر) أو نوع المطر الضعيف الدائم، لا على الكمّيّة المقيسة. لم يُستعمل في المصطلحية الحديثة مقابل precipitation بل استُعمل هُطُول"

    - lemma: "تَهَاطُل"
      confirm:
        - text: "«(تهاطل) الْقَوْم وَنَحْوهم تتابعوا»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«تَهَاطَلَ القومُ ونحوُهم: تتابعوا»"
          source: "المعجم الوسيط (OCR)"
      contradicts:
        - text: "«تَهَاطَلَ القومُ ونحوُهم: تتابعوا»"
          source: "المعجم الوسيط"
          conflict: "تَهَاطُل ورد في المعاجم مقتصراً على تتابع الناس والأشياء، لم يُستعمل مصطلحاً للتساقط المطري ولا للكمّيّة"

    - lemma: "كَمِّيَّةُ الأَمْطَار"
      confirm:
        - text: "«كمّية الأمطار — rainfall»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "«كمّية الأمطار — rainfall»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة"
          conflict: "تعبير وصفي حر يمكن إبدال مكوّناته (مقدار الأمطار، حجم الأمطار) فلا يجتاز اختبار السكّ"

    - lemma: "تَسَاقُطَات"
      confirm:
        - text: "«تساقطات — precipitation»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«نظم التساقطات المطرية — rainfall patterns»"
          source: "المَكنَز الزراعي متعدد اللغات"
          addition: "يُستعمل مجموعاً في سياقات مغاربية وهيدرولوجية"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَسَاقُط"
      decision: confirmed
      decision_reason: "مصدر تَسَاقَطَ مُثبَّت في معاجم ALECSO الموحَّدة مقابل precipitation في حقول الأرصاد الجوية وهندسة المياه والجغرافيا. دلالته تشمل الحدث والكمّيّة معاً بحسب تعريف معجم المياه: «كمية المتساقطات على وحدة مساحة أفقية خلال وحدة زمنية»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تَسَاقُط أعمّ من هُطُول؛ يشمل أي مادة تسقط من الجو (مطر، ثلج، بَرَد، رماد) ويُستعمل في السياقات التقنية العامة وعلم المناخ. أصله من جذر (سقط) الذي يدلّ على الوقوع."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسَاقُط"

    - lemma: "هُطُول"
      decision: confirmed
      decision_reason: "مُثبَّت في معاجم ALECSO الموحَّدة في عدة حقول علمية. أجاز مجمع اللغة المصري قياسيّة وزن فُعُول مصدراً لفَعَلَ اللازم، فهو «صحيح» وإن لم يكن مسموعاً عن العرب. شائع الاستعمال في الأدبيات العلمية العربية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "هُطُول أخصّ من تَسَاقُط؛ يُستعمل غالباً للمتساقطات المائية (مطر، ثلج، بَرَد) ويرتبط بالسياق الأرصادي والهيدرولوجي. أصله من جذر (هطل) الذي يدلّ على تتابع القطر خاصة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُطُول"

    # ── المرشحات من المرحلة ١ ──
    - lemma: "هَطْل"
      source: stage1
      decision: removed
      decision_reason: "هَطْل هو المصدر الأفصح تراثياً، لكنه في المعاجم الكلاسيكية يدلّ على حدث الهطل أو نوع المطر الضعيف الدائم، لا على الكمّيّة المقيسة. لم تتبنَّه المعاجم الموحَّدة الحديثة (ALECSO) مقابل precipitation رغم فصاحته، بل تبنّت هُطُولاً وتَسَاقُطاً. إضافته ستُحدث ترادفاً مطلقاً مع هُطُول دون فارق مصطلحي واضح."
      evidence_assessment:
        case: mixed

    - lemma: "تَهَاطُل"
      source: stage1
      decision: removed
      decision_reason: "وزن تَفَاعُل من هطل ورد في المعاجم بمعنى تتابع الناس والأشياء، ولم يُستعمل مصطلحاً أرصادياً ولا هيدرولوجياً. توسيعه مجازاً ممكن لكنه غير مسكوك ولا مُثبت."
      evidence_assessment:
        case: contradicts_only

    - lemma: "كَمِّيَّةُ الأَمْطَار"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ لا يجتاز اختبار السكّ: يمكن إبدال «كمّيّة» بـ«مقدار» أو «حجم» وبقاء المعنى صالحاً. ليس وحدة معجمية ثابتة بل عبارة تركيبية وصفية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "تَسَاقُطَات"
      source: stage1
      decision: removed
      decision_reason: "جمع تَسَاقُط، يُستعمل في الأدبيات المغاربية والهيدرولوجية. لكن جمعه يشير إلى وقائع تساقط متعددة لا إلى الكمّيّة المقيسة الواحدة. المجموعة الترادفية تُعنى بالمفهوم المفرد (الكمّيّة) لا بالجمع. علاوة على أن «تساقط» المفرد موجود بالفعل."
      evidence_assessment:
        case: confirm_only


