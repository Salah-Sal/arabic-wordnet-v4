# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "يُستعمل مصطلح «حَرَكِيَّة» في عدد من المعاجم المصطلحية بمعنى kinetics/kinetism (ديناميكية الجزيئات أو إحداث الحركة)، وهو مختلف دلالياً عن mobility (صفة القدرة على التحرك بحرية)، مما يُثير احتمال الاشتراك اللفظي."
      - "التعريف الحالي «صفة القدرة على التحرك بحرية» يتضمن الجذر ذاته (التحرك) في بنية اللمّات، مما يُفضي إلى دوران طفيف يستوجب إعادة الصياغة."
      - "لا يُوجد أثر توثيقي صريح يُبيِّن الفرق الدلالي بين اللمَّتين «حَرَكِيَّة» و«قَابِلِيَّة الحَرَكَة» في سياق هذه المجموعة."
    observations: >
      المجموعة تُعالج mobility بوصفه خاصيَّة مجرَّدة لا حدثاً آنياً (فهي فوق مستوى الحركة
      الفعلية). العربية تمتلك منظومة اشتقاقية خصبة من جذر (ح ر ك)، فضلاً عن مجاز ناجع في
      ألفاظ كـ«الحَراك» في علم الاجتماع و«الانتقالية» في الفيزياء. المرشحات المُولَّدة أدناه
      تُغطي أنماط الاشتقاق والتركيب والمجاز استناداً إلى التعريف وحده دون اطلاع على اللمَّات
      الموجودة.
  blind_candidates:
    - lemma: "التَّنَقُّلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن تَفَعُّلِيَّة (مصدر تَنَقَّلَ + يَّة) يُعبِّر عن خاصية القدرة
        على الانتقال من مكان إلى آخر. الوزن منتج في العربية المعاصرة للدلالة على الصفات
        المجردة الدالة على الاستمرار والمداومة.
    - lemma: "السُّيُولَة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من معنى انسياب السوائل وحرية تدفقها إلى معنى اليُسر في الانتقال
        والتحرك الحر. وُظِّف هذا المجاز في الاقتصاد (سيولة رأس المال) وعلم الاجتماع
        (سيولة الهوية)، وهو لفظ عربي أصيل يُحيي معنى الطواعية والانسياح.
    - lemma: "قابليَّة التَّنَقُّل"
      generation_method: tarkib
      justification: >
        مركَّب إضافي مؤلَّف من «قابليَّة» (الاستعداد والإمكانية) + «التنقل» (الانتقال
        المتكرر بين الأماكن). يُصرِّح بالبنية الدلالية للمفهوم تصريحاً واضحاً، ومنتج
        في أسلوب المعجم التقني العربي.
    - lemma: "الجَوَّالِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن فَعَّالِيَّة من «جَوَّال» (كثير الجولان والتنقل)، يُعبِّر عن
        سمة الحراك الواسع والحرية في التحرك. الجذر (ج و ل) يدل على الدوران والسير في
        الجهات، وإحياؤه بالمصدر الصناعي يُنتج مصطلحاً عربياً أصيلاً.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
