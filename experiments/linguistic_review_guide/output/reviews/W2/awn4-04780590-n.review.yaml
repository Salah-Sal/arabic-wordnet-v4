#   Q2 — إثراء (تعريفات + أمثلة) بـentry_id من Q1
#   Q3 — جسر إنجليزي: mobility + motility + movability + moveability
#   Q4 — التحقق من المرشحين (Q3 شمل التنقلية + الجوالية)
#   Q5 — مقاييس اللغة: جذر حرك + نقل + قبل
