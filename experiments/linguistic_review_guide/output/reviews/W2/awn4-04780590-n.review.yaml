# ── المرحلة ٣: التحليل اللغوي للمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حَرَكِيَّة"
      decision: confirmed
      decision_reason: >
        مُثبَتة في سبعة معاجم مصطلحية حديثة على الأقل بمقابلة مباشرة لـ mobility في حقول
        العلوم الاجتماعية والاقتصادية والبيولوجية والفيزيائية. وجود معنى موازٍ (kinetics) في
        عدد من المعاجم الطبية لا يُوجب الحذف، إذ إن التعدد الدلالي المُقيَّد بالسياق مقبول
        في المصطلحية الحديثة، ولا سيما أن الاستعمالات المُؤكِّدة لـ mobility أوسع وأكثر
        تنوعاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُوظَّف في السياقات التقنية والعلمية (الاجتماعية والاقتصادية والبيولوجية والفيزيائية)
        دلالةً على الخاصية الهيكلية الجوهرية للانتقال الحر، مع إيحاء بالنشاط والديناميكية.
        يختلف عن «قَابِلِيَّة الحَرَكَة» في كونه أحادياً ومصطلحاً موحَّداً راسخاً في الأدبيات
        التقنية، ذا طابع علمي دقيق.

    - lemma: "قَابِلِيَّة الحَرَكَة"
      decision: confirmed
      decision_reason: >
        مُثبَتة بوصفها التعريف الصريح لمصطلح «حُرُوكِيَّة» في معجمَيْن تقنيَّيْن (الكيمياء
        1992 والصيدلة 2009) بمقابلة mobility. كما أن الصيغة المشابهة «قابلية التحرك» واردة
        في موسوعة الكهرباء بنفس المعنى، مما يُؤكد إنتاجية النمط التركيبي (قابلية + مصدر الحركة)
        ودلالته على mobility في المصطلحية العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        مُركَّب إضافي يُصرِّح بعنصر «القابلية» (الاستعداد والإمكانية) المادية أو الفيزيائية
        للتحرك. يُستعمل حين يُراد إبراز البُعد الجسدي الملموس للحركة دون سواه، ويُفضَّل في
        الوصف الطبي والفيزيائي. يختلف عن «حَرَكِيَّة» في كونه أكثر توصيفاً وإسهاباً، وأقل
        إيجازاً من المصطلح الأحادي.

    - lemma: "التَّنَقُّلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي دليل معجمي يُثبت هذا المصطلح في المعاجم العربية الكلاسيكية أو
        الحديثة. وإن كانت لفظة «التنقل» واردة بمعنى mobility في سياق النقل، فإن المصدر
        الصناعي «التَّنَقُّلِيَّة» لم يُسَكَّ بعد، فضلاً عن أن «حَرَكِيَّة» تؤدي الوظيفة
        ذاتها بأدلة أقوى.
      evidence_assessment:
        case: no_material

    - lemma: "السُّيُولَة"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة تُناقض استعمالها بمعنى mobility مناقضةً صريحة. «السيولة» ثابتة الاستعمال
        في العربية المعاصرة لـ liquidity (الاقتصاد) وfluidity (الفيزياء وعلم الاجتماع)
        وجريان الموائع، وهي دلالات مختلفة عن صفة القدرة على التحرك بحرية. توظيفها في هذه
        المجموعة سيُحدث تشويشاً دلالياً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "قابليَّة التَّنَقُّل"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المركَّب بعينه في المعاجم. كذلك فإن المجموعة تحتوي بالفعل على
        «قَابِلِيَّة الحَرَكَة» الذي يؤدي الوظيفة ذاتها بصورة أرسخ مصطلحياً، ولا داعي
        لإضافة مرادف مركَّب آخر من النمط نفسه.
      evidence_assessment:
        case: no_material

    - lemma: "الجَوَّالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أدلة معجمية تُثبت هذا المصطلح، كما لم يُوظَّف جذر (ج و ل) في
        المصطلحية الحديثة لبناء مقابل عربي لـ mobility. اللفظ يبقى مقترحاً نظرياً دون
        تثبيت معجمي يُسوِّغ إضافته.
      evidence_assessment:
        case: no_material


