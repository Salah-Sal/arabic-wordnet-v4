    - lemma: "مجمع الآلهة"
      entry_id: "{auto}"
      roots:
        - word: "مجمع"
          root: "جمع"
          maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ.»"
        - word: "الآلهة"
          root: "اله"
          maqayis_quote: "«الْهَمْزَةُ وَاللَّامُ وَالْهَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّعَبُّدُ.»"
  per_sense:
