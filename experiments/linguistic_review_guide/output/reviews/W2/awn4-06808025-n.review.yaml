# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-06808025-n (dog-ear)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ثنية في زاوية الصفحة» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ"
      - "المجموعة تفتقر إلى مصطلح معجمي ثابت يُغني عن الوصف"
      - "التعريف العربي ترجمة حرفية للإنجليزي ولا يتّبع أسلوب المعاجم العربية"
    observations: >
      المفهوم هو الزاوية المطوية من صفحة الكتاب لتحديد موضع القراءة، وهو مفهوم شائع الاستعمال
      لكنه يفتقر في العربية إلى مصطلح مفرد مكرّس. في الإنجليزية يُسمّى dog-ear وهو مجاز
      (تشبيه الزاوية المطوية بأذن الكلب). المورد الحديث يترجمه «أُذُن الكلب» وهو نقل للمجاز
      الإنجليزي. يمكن أيضاً استخدام «ثَنْيَة» أو «طَيَّة» لكنهما عامّتان جداً (أيّ طيّة).
  blind_candidates:
    - lemma: "أُذُنُ الصَّفْحَةِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي على غرار «أُذُن الكلب» لكن بربط الأذن بالصفحة مباشرةً بدل الكلب،
        مجاز مبنيّ على تشبيه الزاوية المطوية بالأذن — أوضح دلالياً من الترجمة الحرفية للإنجليزي.
    - lemma: "ثَنْيَةُ الصَّفْحَةِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «ثَنْيَة» (طيّة/عطفة) و«الصفحة»، يصف الفعل المادي مباشرةً
        ويخصّص الثنية بالصفحة.
    - lemma: "طَيَّةُ الصَّفْحَةِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «طَيَّة» (من الطيّ) و«الصفحة»، مرادف لثنية الصفحة
        لكن من جذر ط-و-ي الأكثر شيوعاً في سياق طيّ الورق.
    - lemma: "أُذُنُ الكَلْبِ"
      generation_method: tarkib
      justification: >
        نقل حرفي للمجاز الإنجليزي dog-ear، مثبت في المورد الحديث كمقابل مباشر.
        مركّب إضافي ثابت في الاستعمال المعاصر.

stage2_evidence:
  per_lemma:
    - lemma: "ثنية في زاوية الصفحة"
      evidence_status: "no_material_found"

    - lemma: "أُذُنُ الصَّفْحَةِ"
      expands:
        - text: "«الْأُذُنُ مَعْرُوفَةٌ مُؤَنَّثَةٌ... وَالْأُذُنُ عُرْوَةُ الْكُوزِ، وَهَذَا مُسْتَعَارٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يؤكّد أن استعارة الأذن لأجزاء الأشياء (عروة الكوز) مسلك عربي قديم"

    - lemma: "ثَنْيَةُ الصَّفْحَةِ"
      contradicts:
        - text: "«إحدى الأسنان الأربع التى فى مقدَّم الفم... الطريق فى الجبل... الاستثناء»"
          source: "المعجم الوسيط"
          conflict: "الثنية في المعاجم مخصّصة للأسنان والطريق الجبلي والاستثناء — لا شاهد على استعمالها لطيّ الورق"
      expands:
        - text: "«الثَّاءُ وَالنُّونُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَكْرِيرُ الشَّيْءِ مَرَّتَيْنِ، أَوْ جَعْلُهُ شَيْئَيْنِ... ثَنَيْتُ الشَّيْءَ ثَنْيًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ث-ن-ي يدلّ على العطف والطيّ لكن الثنية بوصفها اسم مرة أو هيئة لم تُخصّص للورق"

    - lemma: "طَيَّةُ الصَّفْحَةِ"
      confirm:
        - text: "«(9) طيَّة؛ ثَنْيَة [في ثوب]»"
          source: "المورد الحديث (plait)"
        - text: "«(9) طيَّة؛ ثَنْيَة... (10) الطَّيَّة: ثَنْية في طبقة صخرية (جي)»"
          source: "المورد الحديث (fold)"
      expands:
        - text: "«الطَّاءُ وَالْوَاوُ وَالْيَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِدْرَاجِ شَيْءٍ حَتَّى يُدْرَجَ بَعْضُهُ فِي بَعْضٍ... طَوَيْتُ الثَّوْبَ وَالْكِتَابَ طَيًّا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ط-و-ي يشمل طيّ الكتاب صراحةً، مما يؤيّد استعمال «طيّة» في سياق الصفحات"

    - lemma: "أُذُنُ الكَلْبِ"
      confirm:
        - text: "«أُذُن الكلب: زاوية صفحةٍ [من كتاب] تُطوَى مثل أُذُن الكلب نتيجةً للإهمال أو كعلامة على موضع معيَّن منه»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْأُذُنُ مَعْرُوفَةٌ مُؤَنَّثَةٌ... وَالْأُذُنُ عُرْوَةُ الْكُوزِ، وَهَذَا مُسْتَعَارٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "استعارة الأذن لبروزات الأشياء مسلك عربي قديم"

stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "ثنية في زاوية الصفحة"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تفشل في اختبار السكّ واختبار التثبيت المعجمي: يمكن استبدال
        «ثنية» بـ«طيّة» و«زاوية» بـ«ركن» وتبقى العبارة صالحة كوصف حرّ.
        لا يوجد أيّ شاهد معجمي على تثبيتها كوحدة اصطلاحية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أُذُنُ الكَلْبِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مركّب إضافي مثبت في المورد الحديث (2008) كمقابل مباشر لـ dog-ear مع تعريف
        واضح: «زاوية صفحة تُطوَى مثل أُذُن الكلب». رغم أنه اقتراض مفهومي (calque)
        من الإنجليزية، فإنه مسكوك ومسجّل في معجم ثنائي اللغة معتمد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يحمل الصورة المجازية للتشبيه بأذن الكلب — المصطلح المقابل المباشر لـ dog-ear"
      actions:
        - command: create_entry
          params: {lemma: "أُذُنُ الكَلْبِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "طَيَّةُ الصَّفْحَةِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مركّب إضافي شفّاف دلالياً يجمع بين «طيّة» (المؤيّدة بمقاييس اللغة في سياق
        طيّ الكتاب) و«الصفحة». يصلح بديلاً عربياً صرفاً عن الاقتراض المفهومي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "وصف مباشر للفعل المادي (طيّ جزء من الصفحة) — بديل عربي صرف بلا صورة مجازية حيوانية"
      actions:
        - command: create_entry
          params: {lemma: "طَيَّةُ الصَّفْحَةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "أُذُنُ الصَّفْحَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجاهة الاستعارة (أُذُن = بروز)، فإن المركّب غير مسجّل في أيّ معجم
        ولم يُعثَر على شاهد استعمالي، بخلاف «أُذُن الكلب» المثبت في المورد الحديث.

    - lemma: "ثَنْيَةُ الصَّفْحَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        «الثنية» محمّلة بدلالات معجمية راسخة (سنّ، طريق جبلي، استثناء) ممّا يولّد
        التباساً. «طيّة» أنسب من «ثنية» في سياق الورق لأن الجذر ط-و-ي ذُكر صراحةً
        مع طيّ الكتاب في مقاييس اللغة.

stage4_content:
  definition:
    current: "زاوية صفحة مطوية لأسفل لتحديد مكان القراءة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزي ويفتقر إلى الجنس القريب والفصل النوعي.
        يحتاج إعادة صياغة بأسلوب المعجم الوسيط مع الاستفادة من تعريف المورد الحديث.
    authored:
      - type: terminological
        text: "عَلامَةٌ مَرْجِعِيَّةٌ تُصْنَعُ بِطَيِّ رُكْنِ الصَّفْحَةِ لِتَحْدِيدِ مَوْضِعِ القِرَاءَةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "رُكْنٌ مِنْ أَرْكانِ صَفْحَةِ الكِتابِ يُثْنَى إِلى الدَّاخِلِ فَيَصِيرُ كَالأُذُنِ، يَلْجَأُ إِلَيْهِ القارِئُ لِيَدُلَّهُ عَلى المَوْضِعِ الَّذِي بَلَغَهُ مِنَ القِراءَةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عَلامَةٌ مَرْجِعِيَّةٌ تُصْنَعُ بِطَيِّ رُكْنِ الصَّفْحَةِ لِتَحْدِيدِ مَوْضِعِ القِرَاءَةِ"

  examples:
    per_lemma:
      - lemma: "أُذُنُ الكَلْبِ"
        examples:
          - text: "وَجَدْتُ فِي الكِتابِ أُذُنَ كَلْبٍ عِنْدَ الفَصْلِ الثَّالِثِ فَعَرَفْتُ أَنَّ صاحِبَهُ لَمْ يُتِمَّ قِراءَتَهُ."
            type: usage
      - lemma: "طَيَّةُ الصَّفْحَةِ"
        examples:
          - text: "يَنْصَحُ أُمَناءُ المَكْتَباتِ بِاسْتِعْمالِ الفَواصِلِ بَدَلاً مِنْ طَيَّاتِ الصَّفَحاتِ حِفاظاً عَلى الكُتُبِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "وَجَدْتُ فِي الكِتابِ أُذُنَ كَلْبٍ عِنْدَ الفَصْلِ الثَّالِثِ فَعَرَفْتُ أَنَّ صاحِبَهُ لَمْ يُتِمَّ قِراءَتَهُ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يَنْصَحُ أُمَناءُ المَكْتَباتِ بِاسْتِعْمالِ الفَواصِلِ بَدَلاً مِنْ طَيَّاتِ الصَّفَحاتِ حِفاظاً عَلى الكُتُبِ."

