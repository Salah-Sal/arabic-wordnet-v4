        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَايْشِيَا"
    - lemma: "فَيْشِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة بديلة للتعريب تظهر في بعض المراجع العربية وتناسب الاستعمال اللغوي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَيْشِيَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08324197-n"}

stage4_content:
  definition:
    current: "ثالث الطبقات الأربع: عامة الناس أو المزارعين أو التجار والفئات المهنية"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط؛ يحتاج إلى دقة أكثر بربطه بالنظام الهندوسي (الفارنا) واستخدام لغة معجمية رصينة."
    authored:
      - type: encyclopedic
        text: "إِحْدَى الْفَارْنَا (الطَّبَقَاتِ الِاجْتِمَاعِيَّةِ) الْأَرْبَعِ فِي النِّظَامِ الْهِنْدُوسِيِّ، تَلِي طَبَقَةَ الْبَرَاهِمَةِ وَالْكَشَاتْرِيَا، وَتَضُمُّ عَامَّةَ الشَّعْبِ مِنَ التُّجَّارِ وَالْمُزَارِعِينَ وَالْحِرَفِيِّينَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08324197-n", definition_index: 0, text: "إِحْدَى الْفَارْنَا (الطَّبَقَاتِ الِاجْتِمَاعِيَّةِ) الْأَرْبَعِ فِي النِّظَامِ الْهِنْدُوسِيِّ، تَلِي طَبَقَةَ الْبَرَاهِمَةِ وَالْكَشَاتْرِيَا، وَتَضُمُّ عَامَّةَ الشَّعْبِ مِنَ التُّجَّارِ وَالْمُزَارِعِينَ وَالْحِرَفِيِّينَ."}
  examples:
    per_lemma:
      - lemma: "فَايْشِيَا"
        examples:
          - text: "كَانَتْ طَبَقَةُ الْفَايْشِيَا تُمَثِّلُ الْقُوَّةَ الِاقْتِصَادِيَّةَ فِي الْمُجْتَمَعِ الْهِنْدِيِّ الْقَدِيمِ."
            type: usage
      - lemma: "فَيْشِيَة"
        examples:
          - text: "يَنْتَمِي أَغْلَبُ التُّجَّارِ فِي التَّارِيخِ الْهِنْدِيِّ إِلَى جَمَاعَةِ الْفَيْشِيَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-08324197-n", text: "تُعَدُّ طَبَقَةُ الْفَايْشِيَا مَسْؤُولَةً عَنِ الْإِنْتَاجِ وَالتِّجَارَةِ فِي الْعَقِيدَةِ الْبَرَهْمَانِيَّةِ."}

