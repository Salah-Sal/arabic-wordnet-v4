          source: "المعجم الكبير"
          addition: "استخدم المعجم الكبير مصطلح 'البرجوازيون' لوصف طبقة الفايشيا، وهو اختيار يعكس المقابل الوظيفي للطبقة الثالثة في ذلك العصر."

