      decision: confirmed
      decision_reason: "لمّة أصيلة ثابتة في المعاجم القديمة والحديثة بمعنى النموذج والمرجع الذي يُقاس عليه. أدلة المرحلة الثانية تؤكدها بقوة من المعجم الوسيط ودستور العلماء والمعاجم المصطلحية المتعددة. هي اللمّة الأدق في المجموعة لمفهوم basis for comparison."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد المعياري والفلسفي: النموذج المثالي الذي ينبغي أن يكون عليه الشيء. أقوى دلالة على المرجعية التقييمية المجردة من أخواتها."
      actions:
        - command: update_lemma
