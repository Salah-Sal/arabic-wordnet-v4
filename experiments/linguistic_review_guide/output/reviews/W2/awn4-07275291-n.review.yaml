            entry_id: "{auto}"
            new_lemma: "مِعْيَار"

    - lemma: "مِقْيَاس"
      decision: confirmed
      decision_reason: "لمّة ثابتة في المعاجم بمعنى ما يُقاس به. وإن كانت دلالتها الأصلية أقرب إلى الأداة المادية، فقد توسّعت في الاستعمال الحديث لتشمل المعيار المجرد. مستعملة بكثافة في المعاجم المصطلحية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد القياسي الكمّي: أداة أو وحدة تُستخدم لتقدير مقدار الشيء أو حجمه. أقرب إلى measure منه إلى criterion."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِقْيَاس"

    - lemma: "مِحَكّ"
      source: stage1
      decision: confirmed
      decision_reason: "المِحَكّ (من حكك) ثابت في المعجم الوسيط بمعنى حجر الحكّ، وتوسّع مجازاً ليعني أداة الاختبار والتمييز. المورد الحديث يضعه مرادفاً صريحاً لـ touchstone وcriterion وyardstick. عدة مسارد مصطلحية (ARABTERM) تؤكده بمعنى المعيار. إضافته تسدّ فجوة في المجموعة (غياب ما يقابل touchstone)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد الاختباري التمييزي: الوسيلة التي يُميَّز بها الجيد من الرديء. أقرب إلى touchstone من حيث الأصل المجازي (حجر اختبار الذهب)."
      actions:
        - command: create_entry
          params: {lemma: "مِحَكّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "قِسْطَاس"
      source: stage1
      decision: removed
      decision_reason: "القسطاس لفظ رومي معرّب، دلالته محصورة في الميزان المادي (أضبط الموازين وأقومها). المجموعة الترادفية تدور حول المعيار المجرد للمقارنة لا الميزان الحسّي. كما أن قاعدة إيثار العربي الأصيل تمنع من إدراجه مع وجود بدائل عربية أصيلة (معيار، مقياس، محكّ)."

