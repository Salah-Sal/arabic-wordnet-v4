      decision: removed
      decision_reason: "مخصص للشعيرات القاسية والنباتية (السفا)، ولا يشمل البلورات."
      step05_citation: "«شوكة، بروز صلب قوي من البشرة» — المعجم الموحد لمصطلحات علم الأحياء"
