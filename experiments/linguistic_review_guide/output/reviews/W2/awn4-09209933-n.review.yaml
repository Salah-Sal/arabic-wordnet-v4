      nuance_differentiation: "تصغير يدل على الدقة المتناهية، ويُخصص غالباً للتراكيب المجهرية أو العظمية الدقيقة جداً."
      example: "تنتظم الشويكات العظمية في نسيج العظم الإسفنجي لتعطيه صلابة مع خفة في الوزن."
