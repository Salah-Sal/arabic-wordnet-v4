    - lemma: "سِمَةٌ زَمَنِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على المركب «سمة زمنية» كوحدة معجمية مسجَّلة في قاعدة البيانات.
        علاوةً على ذلك، «السِّمة» في الاستخدام الفصيح الكلاسيكي تدلّ على العلامة
