        «الخاصية» مصطلحٌ فلسفي موثَّق منذ القدم، و«الزمنية» صفةٌ نسبية مستعملة
        في المعاجم التقنية المعاصرة. المركب شائعٌ في الأدبيات الفلسفية
        والأنطولوجية العربية الحديثة، ويستوفي اختبار السكّ بوصفه وحدةً مصطلحية
        مركّبة مستقرة. اللمّة تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُصرَّح فيها صراحةً بأن ما يُوصَف هو «خاصية» من طبيعة زمنية،
        مما يجعلها المصطلح الأوضح في السياقات الفلسفية والأنطولوجية حين
        يُراد التمييز بين أنواع الخصائص.
