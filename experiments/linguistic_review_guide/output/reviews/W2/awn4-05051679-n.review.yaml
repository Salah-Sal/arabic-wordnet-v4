      nuance_differentiation: >
        صيغةٌ مكثَّفةٌ تُشير إلى الطابع الزمني ذاته بوصفه مفهوماً مستقلاً
        يُستعمَل في الخطاب النقدي والفلسفي دون التصريح بكلمة «خاصية»؛
        تُوظَّف في سياقات الإشارة الاسمية المجردة («اتّسمت الظاهرةُ بزمنيةٍ...»).
      actions:
