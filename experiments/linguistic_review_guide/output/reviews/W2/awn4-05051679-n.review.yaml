      التعريف الحالي مُختصَرٌ وقابلٌ للتحسين؛ إذ ينبغي أن يُبيِّن الجنسَ القريبَ (خاصية جوهرية)
      والفصلَ النوعيَّ (ارتباطها بالزمن). وجذر «زمن» غنيٌّ في العربية ويُتيح توليد مصطلحات مناسبة.
      ينبغي إضافة لمّات جديدة لتوسيع التغطية المعجمية لهذه المجموعة.

