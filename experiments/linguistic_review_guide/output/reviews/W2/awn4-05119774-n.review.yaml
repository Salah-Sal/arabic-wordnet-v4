# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'انعدام التهوية' عبارة وصفية حرة غير مسكوكة: يمكن إبدال 'انعدام' بـ'غياب' أو 'سوء' أو 'قلة' دون تغيير المعنى، مما يدل على أنها ليست وحدة اصطلاحية ثابتة. كما أنها دوّارة مع التعريف الحالي الذي يتضمن 'سوء التهوية'."
      - "لمّة 'كتمة' تفتقر إلى تشكيل كامل، والصيغ المُثبَّتة في المعاجم الكبرى (كُتْمَة بالضم) تدل على 'من يكتم سره' أو على موضع جغرافي، في حين تدل على 'خفوت الرنين في الفحص بالقرع' في المعاجم الطبية — وكلتا الدلالتَيْن بعيدة عن الاختناق الهوائي."
      - "التعريف الحالي 'صفة انحباس الهواء وسوء التهوية' مقبول لكنه يفتقر إلى جنس قريب أدق، ويمكن تحسينه بصياغة معجمية أرسخ."
      - "المجموعة تعاني من فراغ معجمي (lexical gap): لا يوجد مصطلح عربي موحَّد وراسخ يقابل stuffiness/closeness بوصفها صفةً مجردة، وإن وُجدت إشارات كلاسيكية للمفهوم."
    observations: >-
      المجموعة تعبّر عن الخاصية المجردة لانحباس الهواء وضعف تجديده في مكان مغلق أو سيء التهوية.
      المفهوم حاضر في التراث العربي تحت عبارات 'وخامة الهواء' و'الهواء الراكد' و'الهواء الخانق'،
      لكنه يفتقر إلى مصطلح تقني مفرد موحَّد في المعاجم المعاصرة.
      الجذر كتم يحمل دلالة الإحكام وعدم النفاذية وحبس الشيء في الداخل، وتشهد له تعبيرات مُثبَّتة
      كـ'قوس كتوم' (لا صدع فيها) و'سقاء كتوم' (يمسك اللبن) و'خرز كتيم' (لا ينضح)؛
      وهذا الأساس الدلالي يُتيح اشتقاق مصطلح للهواء المحبوس المُحكَم على وزن فُعُولَة.

  blind_candidates:
    - lemma: "كُتُومِيَّة"
      generation_method: ishtiqaq
      justification: >-
        من جذر كتم على وزن المصدر الصناعي (فُعُولِيَّة)، تدل على الصفة المجردة للانحباس
        وعدم نفاذية الهواء؛ الجذر مُثبَّت للأجسام التي لا تنضح ولا تُرِنّ (قوس كتوم،
        سقاء كتوم)، فإحياؤه لوصف الهواء المحبوس إحياءٌ دلالي مشروع.
    - lemma: "اِحْتِبَاسِيَّة"
      generation_method: ishtiqaq
      justification: >-
        من حبس على المصدر الصناعي للفعل الخماسي (افتعالية)، تدل على صفة الاحتباس
        والانحصار؛ يدعمها شيوع 'الاحتباس الحراري' في العربية المعاصرة كنموذج لتطبيق
        الجذر على الظواهر الهوائية.
    - lemma: "وَخَامَةُ الهَوَاء"
      generation_method: tarkib
      justification: >-
        تركيب إضافي؛ الوخامة في الكلاسيكي هي صفة الشيء الوبيء الذي لا يوافق ساكنه
        ('بلاد وخيمة: لا تُوافق ساكنَها')، وقد استُعملت تاريخياً لوصف الهواء الفاسد
        الضار، مما يجعلها أقرب وصف عربي تراثي لمفهوم الاختناق الهوائي.
    - lemma: "رُكُود"
      generation_method: majaz
      justification: >-
        أُزيحت دلالة ركود الماء والريح ('ركدت الريح' = سكنت) لتشمل صفة الهواء الساكن
        غير المتجدد؛ المجاز واضح وعربي أصيل، وقد استُعمل 'الهواء الراكد' في النصوص
        الطبية والبيئية المعاصرة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "انعدام التهوية"
      expands:
        - text: "«تهوية رديئة = bad (poor) ventilation»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
          addition: >-
            يؤكد وجود مفهوم التهوية الرديئة كمصطلح صحي موثَّق في المعاجم الموحَّدة؛
            غير أن المصطلح الأدق هو 'تهوية رديئة' لا 'انعدام التهوية'، وهو بذاته تركيب
            وصفي لا إضافي.

    - lemma: "كتمة"
      contradicts:
        - text: "«الْكُتْمَةُ: الذى يَكْتُمُ سِرَّه»"
          source: "المعجم الوسيط"
          conflict: >-
            الكُتْمَة في المعجم الوسيط صفة مشبهة بمعنى 'الشخص الكتوم لسره'، وهي اسم
            وصفٍ للإنسان لا اسماً لصفة الهواء المحبوس.
        - text: "«الكتمة: خفوت الرنين عند الفحص بالقرع — dullness = dulness»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          conflict: >-
            المصطلح الطبي 'الكتمة' يُستخدم في السيميولوجيا السريرية لوصف خفوت صوت
            القرع على الصدر (dullness on percussion)، وهو مصطلح مختلف تماماً عن
            الاختناق الهوائي.
        - text: "«(الكتمة) الَّذِي يكتم سره»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          conflict: "تأكيد إضافي للمعنى الشخصي لا المكاني أو الهوائي."
      expands:
        - text: "«والاسمُ: الكِتْمةُ، بالكسر ... وـ السِقاءُ كِتاماً وكُتوماً: أمْسَكَ اللَّبَنَ والشَّرابَ ... وخَرْزٌ كَتِيمٌ: لا يَنْضَحُ ... وقَوْسٌ كَتُومٌ: لا صَدْعَ في نَبْعِها»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: >-
            يكشف هذا النص أن الجذر كتم يُطبَّق على الأجسام المُحكمة غير النافذة (السقاء،
            الخرز، القوس)؛ مما يوفر الأساس الدلالي لتوليد مصطلح للهواء المحبوس.
            كما يُثبِّت أن الصيغة كِتْمَة (بالكسر) هي المصدر الاسمي لفعل كتم.
        - text: "«(كَتَمَ) الْكَافُ وَالتَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِخْفَاءٍ وَسَتْرٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            يُؤصِّل الجذر للإخفاء والستر والانطواء، وهي دلالة قابلة للتوسيع لتشمل
            حبس الهواء وانعدام تجديده.

    - lemma: "كُتُومِيَّة"
      evidence_status: "no_material_found"

    - lemma: "اِحْتِبَاسِيَّة"
      evidence_status: "no_material_found"

    - lemma: "وَخَامَةُ الهَوَاء"
      contradicts:
        - text: "«وَخامَة = severity»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >-
            الوخامة في الاستعمال الطبي المعاصر تدل على 'الشدة' (severity) لا على
            صفة الهواء المحبوس أو سوء التهوية.
      expands:
        - text: "«(وَخَمَ) الْوَاوُ وَالْخَاءُ وَالْمِيمُ: كَلِمَةٌ وَاحِدَةٌ، هِيَ الْوَخِمُ: الْوَبِيُّ مِنَ الشَّيْءِ. وَاسْتَوْخَمْتُ الْبِلَادَ، وَبِلَادٌ وَخِمَةٌ وَوَخِيمَةٌ: لَا تُوَافِقُ سَاكِنَهَا. وَرَجُلٌ وَخِمٌ وَوَخِيمٌ: ثَقِيلٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            الوخامة كلاسيكياً تعني وبائية المكان وعدم ملاءمته للساكن؛ وهذا يتقاطع جزئياً
            مع مفهوم الاختناق الهوائي، لكنه أعم منه إذ يشمل الوبأ والحمى والعدوى لا
            مجرد ضعف التهوية.

    - lemma: "رُكُود"
      confirm:
        - text: "«(رَكَدَ) الرَّاءُ وَالْكَافُ وَالدَّالُ أَصْلٌ يَدُلُّ عَلَى سُكُونٍ. يُقَالُ رَكَدَ الْمَاءُ: سَكَنَ. وَرَكَدَتِ الرِّيحُ. وَرَكَدَ الْمِيزَانُ: اسْتَوَى»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الرُّكودُ: السُّكونُ، والثَّباتُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«ركود = stagnation»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
      contradicts:
        - text: "«رُكود: أحد أطوار الدورة التجارية، يتميز بانخفاض طفيف في مستوى النشاط الاقتصادي — recession»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >-
            الاستعمال المعاصر الغالب للركود في العربية هو في السياق الاقتصادي (recession)،
            مما أبعد دلالته التراثية (ركود الريح والماء) وضيَّق إمكانية تطبيقه على الاختناق
            الهوائي دون لبس.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "انعدام التهوية"
      decision: removed
      decision_reason: >-
        تفشل هذه اللمّة اختبار التثبيت المعجمي: إبدال 'انعدام' بـ'غياب' أو 'سوء' أو 'شُحّ'
        يُنتج وصفاً مقبولاً بالقدر ذاته، مما يدل على أنها ليست وحدة اصطلاحية مسكوكة
        بل عبارة وصفية حرة. كذلك هي دوّارة مع التعريف الحالي ('سوء التهوية'). لا يصح
        اعتبارها لمّةً في المعجم الشبكي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كتمة"
      decision: confirmed
      decision_reason: >-
        على الرغم من أن الصيغ المُثبَّتة في المعاجم الكبرى (كُتْمَة بالضم أو كِتْمَة
        بالكسر) تنصرف إلى 'كاتم السر' أو موضع جغرافي، فإن الجذر كتم يحمل دلالة راسخة
        على الإحكام وحبس الشيء وعدم تنفيسه (سقاء كتوم، قوس كتوم، خرز كتيم)؛ وهذا
        الأساس الدلالي يُشرِّع اشتقاق صيغة للاختناق الهوائي منه. يُوصى بتحديث الصيغة
        إلى كُتُومَة (على وزن فُعُولَة مثل سُهُولَة وصُعُوبَة وعُذُوبَة) لتكون أدل
        على الصفة المجردة المستمدة من الصفة المشبهة 'كَتُوم'.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        كُتُومَة تُركّز على الطابع الانحباسي والإحكامي للهواء من منظور انعدام نفاذه
        وانسداد مساراته، مستمدّةً صورتها من الأجسام المُحكَمة المُوصَدة (القوس الكتوم،
        السقاء الكتوم)؛ وهي بذلك تختلف عن 'وخامة' التي تدل على الطابع الوبائي الضار،
        وعن 'ركود' الذي يدل على السكون العام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كُتُومَة"

    - lemma: "كُتُومِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        وزن المصدر الصناعي فُعُولِيَّة أثقل صرفياً وأقل طبيعية من فُعُولَة لوصف الصفة
        المجردة في هذا السياق؛ ولم تُعثر لها على شاهد معجمي. تُغني عنها كُتُومَة
        المُؤصَّلة ضمن اللمّة السابقة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "اِحْتِبَاسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        الجذر حبس مُثبَّت في المعاجم في تراكيب طبية وكيميائية (انحباس البول، الاحتباس
        الحراري) لكن صيغة احتباسية لم تُوثَّق في أي مصدر. فضلاً عن ذلك، دلالتها على
        الاحتباس العام تجعلها أقل تخصصاً من المطلوب لمفهوم الاختناق الهوائي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "وَخَامَةُ الهَوَاء"
      source: stage1
      decision: removed
      decision_reason: >-
        وخامة كلاسيكياً تعني الصفة الوبائية للمكان غير الموافق لصحة ساكنه، وهي أعم
        من الاختناق الهوائي (تشمل الوبأ والحمى). كما أن الاستعمال الطبي المعاصر حصرها
        في معنى 'الشدة' (severity)، مما يُبعدها عن الدلالة المطلوبة. لا تحقق المطابقة
        الدلالية الكافية مع synset.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "رُكُود"
      source: stage1
      decision: removed
      decision_reason: >-
        ركود يدل على السكون العام للماء والريح والاقتصاد، وهو حالة عامة لا صفة مجردة
        خاصة بالاختناق الهوائي. يُضاف إلى ذلك أن الاستعمال الغالب في العربية المعاصرة
        هو الاقتصادي (recession)، مما يخلق لبساً سياقياً عند تطبيقه على الهواء.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────────
stage4_content:
  definition:
    current: "صفة انحباس الهواء وسوء التهوية"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مفهوم لكنه يفتقر إلى جنس قريب أدق (كلمة 'صفة' وحدها فضفاضة
        تحتاج إلى تحديد جنس الصفة)، كما يحتاج إلى ذكر المكان المرتبط بهذه الصفة
        لضبط الدلالة. يُقترح تعريف مصطلحي وتعريف لغوي.
    authored:
      - type: terminological
        text: "صِفَةٌ تُعَبِّرُ عَنْ حَالَةِ الْمَكَانِ الَّذِي يَشُحُّ فِيهِ الْهَوَاءُ النَّقِيُّ لِضَعْفِ تَهْوِيَتِهِ وَاحْتِبَاسِ هَوَائِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ثِقَلُ الْهَوَاءِ وَانْعِدَامُ حَرَكَتِهِ فِي مَكَانٍ مُغْلَقٍ أَوْ قَلِيلِ التَّهْوِيَةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صِفَةٌ تُعَبِّرُ عَنْ حَالَةِ الْمَكَانِ الَّذِي يَشُحُّ فِيهِ الْهَوَاءُ النَّقِيُّ لِضَعْفِ تَهْوِيَتِهِ وَاحْتِبَاسِ هَوَائِهِ"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "ثِقَلُ الْهَوَاءِ وَانْعِدَامُ حَرَكَتِهِ فِي مَكَانٍ مُغْلَقٍ أَوْ قَلِيلِ التَّهْوِيَةِ"

  examples:
