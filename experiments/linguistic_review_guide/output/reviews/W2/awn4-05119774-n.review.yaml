            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "شَكَا الْحَاضِرُونَ مِنْ كُتُومَةِ الْهَوَاءِ فِي الْقَاعَةِ الْمَكْتَظَّةِ الَّتِي أُحْكِمَتْ نَوَافِذُهَا طِوَالَ سَاعَاتِ الِاجْتِمَاعِ."


