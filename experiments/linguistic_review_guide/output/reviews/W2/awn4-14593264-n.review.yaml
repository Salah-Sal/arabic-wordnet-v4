      decision: confirmed
      decision_reason: "مصطلح علمي معتمد وموثق في المعجم الطبي الموحد ومعاجم البيئة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِدَامَةُ المَرْحَلَةِ اليَرَقِيَّةِ"
    - lemma: "نيوتيني"
      decision: removed
      decision_reason: "اللفظ صفة (adjective) لمفهوم Neotenic، ولا يتناسب مع وسم المجموعة كاسم (noun)."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "نِيُوتِينِيَّة"
      source: stage1
