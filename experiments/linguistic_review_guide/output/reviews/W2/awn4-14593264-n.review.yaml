stage1_review:
  assessment:
    concerns:
      - "اللمة 'نيوتيني' هي صفة (اسم منسوب)، بينما وسم المجموعة هو اسم (noun)، مما يخالف الاتساق في الأقسام الكلامية."
      - "اللمة 'استدامة المرحلة اليرقية' عبارة وصفية طويلة، ولكنها معتمدة كمصطلح علمي في المعاجم المتخصصة."
    observations: "المفهوم يشير إلى ظاهرة بيولوجية محددة هي 'الاحتفاظ بالسمات اليرقية'، وهو مفهوم تقني يتطلب دقة في الاصطلاح بين التعريب والترجمة والاشتقاق."
  blind_candidates:
    - lemma: "اسْتِدَامَةُ الصِّغَرِ"
      generation_method: tarkib
      justification: "ترجمة دلالية مباشرة لمفهوم الاستمرار في حالة الصغر."
    - lemma: "نِيُوتِينِيَّة"
      generation_method: taarib
      justification: "التعريب المباشر للمصطلح اللاتيني Neoteny، وهو واسع الانتشار في الكتب العلمية."
    - lemma: "اسْتِبْقَاءُ الخَصَائِصِ الطُّفُولِيَّةِ"
      generation_method: tarkib
      justification: "تعبير وصفي دقيق يشرح الحالة البيولوجية المحتفظ بها."
    - lemma: "تَصَابٍ بَيُولُوجِيّ"
      generation_method: majaz
      justification: "استخدام لفظ 'التصابي' (بمعنى التظاهر بالشباب) وإزاحته دلالياً للمجال البيولوجي."

stage2_evidence:
  per_lemma:
    - lemma: "استدامة المرحلة اليرقية"
      confirm:
        - text: "اسْتِدامَةُ المَرْحَلَةِ اليَرَقِيَّة: neoteny"
          source: "المعجم الطبي الموحد (2009)"
        - text: "استدامة المرحلة اليرقية: الحيوانات التي تحتفظ بخصائص اليرقات طوال دورة حياتها. استدامة المرحلة اليرقية أمر شائع في البرمائيات."
          source: "مسرد المناخ والبيئة (ArabTerm)"
    - lemma: "نيوتيني"
      confirm:
        - text: "استدامة المرحلة اليرقية: neotenic"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      contradicts:
        - text: "neotenic"
          source: "ArabTerm"
          conflict: "المصطلح يشير إلى الصفة (adjective) وليس الحالة أو الاسم، مما يجعله غير مناسب لمجموعة ترادفية اسمية."
    - lemma: "نِيُوتِينِيَّة"
      confirm:
        - text: "neoteny"
          source: "The Unified Medical Dictionary"
    - lemma: "امْتِدَادُ الطُّفُولَةِ"
      confirm:
        - text: "امتداد الطفولة: neoteny: في التحول بقاء دور اليرقانة وقتا أطول من المألوف أو ظهور بعض صفات الحيوان البالغ في هذا الدور"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "التَّدَعْمُص"
      confirm:
        - text: "التُّدَعْمُص: neoteny"
          source: "المَكنَز الزراعي متعدد اللغات (AgroVoc)"

stage3_analysis:
