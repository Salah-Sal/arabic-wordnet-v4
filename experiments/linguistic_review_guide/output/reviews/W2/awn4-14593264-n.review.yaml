      decision_reason: "الاسم المعرب الصحيح لمفهوم Neoteny، وهو الأكثر تداولاً في الأبحاث العلمية المترجمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نِيُوتِينِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14593264-n"}
    - lemma: "امْتِدَادُ الطُّفُولَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد في المعجم الموحد لمصطلحات علم الأحياء، يقدم تعبيراً عربياً فصيحاً للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "امْتِدَادُ الطُّفُولَةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14593264-n"}
    - lemma: "التَّدَعْمُص"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح اشتقاقي أصيل موثق في المكنز الزراعي، يربط المفهوم بجذر 'دعمص' (يرقة الضفدع)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
