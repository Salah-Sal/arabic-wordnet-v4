          params: {lemma: "التَّدَعْمُص", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14593264-n"}

stage4_content:
  definition:
    current: "الحالة الناتجة عند الاحتفاظ بخصائص الصغر (الأحداث) من قبل البالغين من النوع"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط؛ يحتاج إلى دقة علمية لتمييزه كظاهرة بيولوجية مرتبطة بالبلوغ الجنسي."
    authored:
      - type: terminological
        text: "ظاهرة بيولوجية تتمثل في احتفاظ الكائن الحي بخصائص مرحلة اليرقة أو الصبا بعد وصوله إلى مرحلة البلوغ الجنسي."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "اسْتِدَامَةُ المَرْحَلَةِ اليَرَقِيَّةِ"
        examples:
          - text: "تعتبر سمندل المكسيك (أكسولوتل) من أشهر الأمثلة الحية على استدامة المرحلة اليرقية."
            type: usage
      - lemma: "نِيُوتِينِيَّة"
        examples:
          - text: "تساهم النيوتينية في التطور البيولوجي لبعض الأنواع عبر تأخير نضج الأنسجة الجسمية."
            type: usage
      - lemma: "امْتِدَادُ الطُّفُولَةِ"
        examples:
          - text: "يرى بعض العلماء أن التطور البشري اتسم بنوع من امتداد الطفولة مقارنة بالرئيسيات الأخرى."
            type: usage
      - lemma: "التَّدَعْمُص"
        examples:
          - text: "يحدث التدعمص في بعض أنواع السلمندر التي تبقى محتفظة بخياشيمها اليرقية طوال حياتها."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "awn4-14593264-n", definition_index: 0, text: "ظاهرة بيولوجية تتمثل في احتفاظ الكائن الحي بخصائص مرحلة اليرقة أو الصبا بعد وصوله إلى مرحلة البلوغ الجنسي."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تعتبر سمندل المكسيك (أكسولوتل) من أشهر الأمثلة الحية على استدامة المرحلة اليرقية."}

