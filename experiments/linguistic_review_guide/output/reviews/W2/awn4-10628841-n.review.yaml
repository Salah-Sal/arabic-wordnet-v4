# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10628841-n (slave)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «رقيق» مشتركة لفظياً بين معنى الدقيق اللطيف ومعنى المملوك، وتحتاج تشكيلاً تامّاً للتمييز"
      - "اللمّة «عبد» بدون تشكيل، والعَبْد في العربية أوسع من slave إذ يشمل الإنسان مطلقاً باعتباره عبداً لله"
      - "المجموعة تفتقر إلى لفظ «مملوك» وهو أقرب ألفاظ العربية دلالةً على المعنى المقصود"
    observations: "المفهوم أصيل في الثقافة العربية وله حقل معجمي غنيّ يشمل: عبد، رقيق، مملوك، قِنّ، مسترَقّ. لفظ «عبد» هو الأعمّ ويدلّ على المملوك وعلى الإنسان مطلقاً، بينما «رقيق» فعيل بمعنى مفعول (أي مرقوق) يُطلق على المفرد والجمع. لفظ «قِنّ» أخصّ إذ يدلّ على العبد الخالص العبودية الذي مُلك هو وأبوه."
  blind_candidates:
    - lemma: "مَمْلُوك"
      generation_method: ishtiqaq
      justification: "اسم مفعول من مَلَكَ على وزن مَفْعُول، يدلّ مباشرة على من يملكه غيره، وهو أدقّ الألفاظ في الدلالة على المعنى المطلوب"
    - lemma: "قِنّ"
      generation_method: ishtiqaq
      justification: "لفظ تراثي أصيل يدلّ على العبد الخالص العبودية الذي مُلك هو وأبواه، مسجّل في المعاجم الكلاسيكية كلها"
    - lemma: "مُسْتَرَقّ"
      generation_method: ishtiqaq
      justification: "اسم مفعول من استرقّ على وزن مُسْتَفْعَل، يدلّ على من وقع عليه الاسترقاق، وقد ورد في المورد الحديث مرادفاً لـslave"
    - lemma: "أَسِير"
      generation_method: majaz
      justification: "إزاحة دلالية من معنى المأخوذ في الحرب إلى المملوك، إذ كان الأسر يؤدي إلى الاسترقاق تاريخياً، وقد ورد في تكملة دوزي بمعنى عبد ورقيق"

stage2_evidence:
  per_lemma:
    - lemma: "رَقِيق"
      confirm:
        - text: "«(الرَّقِيق) الدَّقِيق اللَّطِيف والمملوك كُله أَو بعضه»"
          source: "المعجم الوسيط"
        - text: "«الرَّقِيق: من يَتَّصِف بِالرّقِّ أَو المرقوق»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«المملوكُ البَيِّنُ الرِّقِّ, فعيل بمعنى مفعول, للمذكر والمؤنث, ويطلق على الجمع»"
          source: "المعجم الكبير"
      expands:
        - text: "«ضِدُّ الغليظ والثَّخين»"
          source: "المعجم الكبير"
          addition: "المعنى الأول للرقيق هو الدقيق اللطيف وهو اشتراك لفظي ينبغي مراعاته"
        - text: "«الرقيق الأبيض: كناية محدثة عن النساء اللاتي تحترفن البغاء»"
          source: "المعجم الكبير"
          addition: "استعمال محدث مجازي يدلّ على حيوية اللفظ في الاستخدام المعاصر"

    - lemma: "عَبْد"
      confirm:
        - text: "«(العَبْد) الرَّقِيق وَالْإِنْسَان حرا كَانَ أَو رَقِيقا لِأَنَّهُ مربوب لله عز وَجل»"
          source: "المعجم الوسيط"
        - text: "«العَبْدُ: الإِنسانُ، حُرًّا كانَ أَو رَقِيقاً... والعَبْدُ: المَمْلُوكُ خلافُ الحُرِّ»"
          source: "تاج العروس للزبيدي"
        - text: "«العَبْدُ: خلاف الحُرِّ»"
          source: "الصحاح للجوهري"
        - text: "«العبد: يطلق على مملوك الرقبة بطريق شرعي، وعلى المخلوق للعبادة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«العَبْد: خلاف الحُّرِّ أي المملوك وهو أعمُّ من القِنِّ»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "العبد أعمّ من القِنّ، فالعبد يشمل المملوك مطلقاً بينما القِنّ خالص العبودية"

    - lemma: "مَمْلُوك"
      confirm:
        - text: "«(الْمَمْلُوك) العَبْد (ج) مماليك»"
          source: "المعجم الوسيط"
        - text: "«المملوك: هو العبد»"
          source: "التعريفات الفقهيّة للبركتي"

    - lemma: "قِنّ"
      confirm:
        - text: "«(الْقِنّ) العَبْد الَّذِي كَانَ أَبوهُ مَمْلُوكا لمواليه... خَالص العبودة»"
          source: "المعجم الوسيط"
        - text: "«القن: الرقيق، يطلق بلفظ واحد على الواحد وغيره... القن من يملك هو وأبواه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«القنّ: العبد الذي لا يجوز بيعه ولا اشتراؤه»"
          source: "التعريفات للجرجاني"
      contradicts:
        - text: "«العَبْد: خلاف الحُّرِّ أي المملوك وهو أعمُّ من القِنِّ»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "القِنّ أخصّ من العبد؛ هو خالص العبودية الذي مُلك هو وأبواه، لا مطلق المملوك"

    - lemma: "مُسْتَرَقّ"
      confirm:
        - text: "«(4) مُسْتَرَقّ؛ مستَعْبَد slave peoples»"
          source: "المورد الحديث (2008)"
        - text: "«(1) عبد؛ رقيق (2) عُبُودية (3) مُسْتَعْبَد»"
          source: "المورد الحديث — مادة thrall"
      expands:
        - text: "«(1) «أ» الرّقيق؛ العبد... (7) يسترِقّ؛ يستعبد»"
          source: "المورد الحديث — مادة slave"
          addition: "مُسْتَرَقّ وارد في سياق ترجمة slave لكنه صفة تدلّ على من وقع عليه فعل الاسترقاق"

    - lemma: "أَسِير"
      contradicts:
        - text: "«(الْأَسير) الْمَأْخُوذ فِي الْحَرْب»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي والمعتمد في المعاجم المعيارية هو أسير الحرب لا المملوك"
        - text: "«المأخوذ في الحرب... وقد كان الأسر قديما يؤدِّى إلى الاسترقاق»"
          source: "المعجم الكبير"
          conflict: "العلاقة بين الأسر والاسترقاق تاريخية سببية لا ترادفية"
      expands:
        - text: "«أسير: مؤنثه أسيرة: عبد، رقيق (بوشر)»"
          source: "تكملة المعاجم العربية لدوزي"
          addition: "ورود هذا المعنى عند بوشر يدلّ على استعمال عامّي أو إقليمي لا فصيح معياري"

stage3_analysis:
  per_lemma:
    - lemma: "رَقِيق"
      decision: confirmed
      decision_reason: "لفظ فصيح ثابت في المعاجم المعيارية بمعنى المملوك، فعيل بمعنى مفعول، يُطلق على المفرد والجمع. الاشتراك اللفظي مع معنى الدقيق اللطيف لا يمنع قبوله لأن السياق يميّز."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل للمفرد والجمع، وفيه معنى الرفق واللين من جهة الاشتقاق (رقّ)، وهو أكثر شيوعاً في السياقات التاريخية والقانونية كجنس (تجارة الرقيق)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَقِيق"

    - lemma: "عَبْد"
      decision: confirmed
      decision_reason: "لفظ أصيل واسع الدلالة يدلّ على المملوك وعلى الإنسان مطلقاً. المعاجم كلها تُقرّ معنى المملوك خلاف الحرّ، وهو أكثر الألفاظ استعمالاً في هذا الباب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "هو الأعمّ دلالةً من أخواته، يدلّ على المملوك مطلقاً سواء مُلك هو وأبواه أم لا، ويغلب في الاستعمال الديني والشرعي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَبْد"

    - lemma: "مَمْلُوك"
      source: stage1
      decision: confirmed
      decision_reason: "اسم مفعول من مَلَكَ، أدقّ الألفاظ دلالةً على المعنى المقصود (شخص مملوك لشخص آخر)، وهو مطابق لنصّ التعريف. مؤيَّد بالمعجم الوسيط والتعريفات الفقهية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على علاقة المِلكية ذاتها دون دلالة إضافية على خلوص العبودية أو على الجنس، ويُستعمل أيضاً لقباً تاريخياً (المماليك)."
      actions:
        - command: create_entry
          params: {lemma: "مَمْلُوك", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "قِنّ"
      source: stage1
      decision: removed
      decision_reason: "القِنّ أخصّ من العبد والرقيق؛ يدلّ على العبد الخالص العبودية الذي مُلك هو وأبواه. هذا التخصيص يجعله غير مرادف تامّ لمفهوم slave العامّ، بل هو نوع فرعي (hyponym) أدقّ."

    - lemma: "مُسْتَرَقّ"
      source: stage1
      decision: removed
      decision_reason: "صفة تدلّ على من وقع عليه فعل الاسترقاق، وليست اسماً مستقلاً ثابتاً للمملوك. وردت في المورد الحديث في سياق ترجمة لا تأصيل معجمي. الأولى الاكتفاء بالألفاظ المعجمية الثابتة."

    - lemma: "أَسِير"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعتمد في المعاجم المعيارية هو المأخوذ في الحرب. العلاقة بالاسترقاق تاريخية سببية لا ترادفية. وروده بمعنى عبد عند بوشر لا يكفي لاعتماده في الفصحى المعيارية."

