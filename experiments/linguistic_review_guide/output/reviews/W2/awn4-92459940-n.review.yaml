      evidence_status: "no_material_found"
    - lemma: "عَمَلِيَّةُ الطِّبَاعَةِ الزَّيْتِيَّةِ"
      evidence_status: "no_material_found"
    - lemma: "عَمَلِيَّةُ بَرُومْوِيل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عملية برومويل"
      decision: confirmed
      decision_reason: "مصطلح تقني تخصصي جداً يمثل تعريباً لـ (Bromoil process)، وهو الأنسب لوصف هذه العملية التقنية التاريخية الدقيقة. نقبل اللمة مع ضبط تشكيلها كمركب إضافي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّةُ بَرُومْوِيل"

stage4_content:
  definition:
    current: "عملية تصوير مبكرة تعتمد على الطباعة الزيتية، تعود أصولها إلى منتصف القرن التاسع عشر."
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويصف المفهوم بطريقة موسوعية مناسبة، ولا يحتاج إلى تعديل."
  examples:
    per_lemma:
      - lemma: "عملية برومويل"
        examples:
          - text: "تُعدُّ عَمَلِيَّةُ بَرُومْوِيل من التقنيات الرائدة في تاريخ التصوير الفوتوغرافي."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-92459940-n", text: "تُعدُّ عَمَلِيَّةُ بَرُومْوِيل من التقنيات الرائدة في تاريخ التصوير الفوتوغرافي."}

