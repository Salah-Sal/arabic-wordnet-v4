stage1_review:
  assessment:
    concerns:
      - "المصطلح يشير إلى تقنية تصوير قديمة ومحددة جداً (Bromoil process)، واللمة الحالية 'عملية برومويل' هي ترجمة حرفية تعتمد على النقحرة، وقد لا يكون لها شيوع في المصادر المعجمية العربية."
    observations: "الترجمة تعكس المفهوم بدقة نظراً لكونه اسم علم لعملية تقنية منسوبة لطريقة كيميائية، ولا يوجد بديل عربي متأصل بسبب طبيعة المفهوم الدخيل تاريخياً. اللمة مقبولة من باب التعريب."
  blind_candidates:
    - lemma: "طِبَاعَةٌ زَيْتِيَّةٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يبرز الخاصية التقنية للعملية (الطباعة باستخدام الزيت)."
    - lemma: "بَرُومْوِيل"
      generation_method: taarib
      justification: "نقحرة مباشرة لاسم العملية التقنية الأجنبية (Bromoil)."
    - lemma: "عَمَلِيَّةُ الطِّبَاعَةِ الزَّيْتِيَّةِ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف العملية التقنية كاملة استناداً إلى الوصف."
    - lemma: "عَمَلِيَّةُ بَرُومْوِيل"
      generation_method: taarib
      justification: "تركيب إضافي يجمع بين جنس العملية (عملية) واسمها المُعرَّب تقنياً (برومويل)."

