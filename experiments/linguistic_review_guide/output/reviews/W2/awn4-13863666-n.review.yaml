# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13863666-n — complementarity
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي ترجمة حرفية شبه آلية للتعريف الإنجليزي، ويمكن صياغته بأسلوب معجمي عربي أوضح"
      - "المجموعة تضمّ لمّة واحدة فقط (تَكَامُل)، وقد يوجد مصطلح علمي بديل من جذر تمم"
    observations: "المفهوم المستهدف هو العلاقة التبادلية القائمة على إكمال أحد الطرفين للآخر أو اعتماده عليه. الجذر الأقرب هو (كمل) على وزن تَفَاعُل الدالّ على المشاركة والتبادل، والجذر (تمم) مرادف قريب. المفهوم راسخ في العربية العلمية المعاصرة."
  blind_candidates:
    - lemma: "تَكَامُل"
      generation_method: ishtiqaq
      justification: "مصدر تَكَامَلَ من جذر كمل على وزن تَفَاعُل الدالّ على المشاركة، أي أكمل بعضُه بعضاً. أنسب تعبير عن complementarity."
    - lemma: "تَتَامّ"
      generation_method: ishtiqaq
      justification: "مصدر تَتَامَّ من جذر تمم على وزن تَفَاعُل، مرادف لتَكامَل من جذر مرادف (تمّ = كمُل). مستخدم في المعاجم الطبية والعلمية."
    - lemma: "تَكَامُلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من تَكَامُل بإضافة -يَّة للدلالة على المفهوم المجرد. قد يكون أدقّ من تَكَامُل في التمييز بين العملية والصفة."
    - lemma: "تَلَازُم"
      generation_method: ishtiqaq
      justification: "مصدر تَلَازَمَ من جذر لزم على وزن تَفَاعُل، يدلّ على الارتباط المتبادل والاعتماد المتلازم."

stage2_evidence:
  per_lemma:
    - lemma: "تَكَامُل"
      confirm:
        - text: "«(تَكَامل) الشَّيْء كمل شَيْئا فَشَيْئًا والأشياء كمل بَعْضهَا بَعْضًا»"
          source: "المعجم الوسيط"
        - text: "«(التكامل) (فِي عرف الاقتصاد) هُوَ الْجمع بَين صناعات مُخْتَلفَة يكمل بَعْضهَا بَعْضًا وتتعاون فِي الْوُصُول إِلَى غَرَض وَاحِد (مج)»"
          source: "المعجم الوسيط"
        - text: "«جاذبية تتمثل في إعجاب شخص بميزات توجد في غيره، ويود الاتصاف بها لشعوره بأنها تكمله.» — translation_en: complementarity"
          source: "مسرد الإعلام والتواصل (ALECSO)"
      expands:
        - text: "«تكامل = integration» في مجالات الرياضيات والهندسة والاقتصاد والصيدلة"
          source: "معاجم ARABTERM المتعددة"
          addition: "اللفظ مشترك لفظي بين معنى التكامل الرياضي (integration) ومعنى التكامل بوصفه complementarity"

    - lemma: "تَتَامّ"
      confirm:
        - text: "«تَتامّ — translation_en: complementarity»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَتامّ — translation_en: complementation»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«تتام — ظهور أنماط ظاهرية اعتيادية في كائن حيّ أو في خلية تحتوي على طفرتين مختلفتين...» — translation_en: complementation"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "يُستخدم في مجال الوراثة بمعنى التتامّ الجيني (complementation) وهو مفهوم قريب لكنه أخصّ"
        - text: "«تتاميّة — translation_en: complementarity»"
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
          addition: "الصيغة المنسوبة (تتاميّة) مستخدمة أيضاً في الفلسفة"
      contradicts:
        - text: "«(تتام) الْقَوْم جاؤوا كلهم وتموا وَيُقَال تتاموا إِلَيْهِ»"
          source: "المعجم الوسيط"
          conflict: "المعنى التراثي للفعل تتامّ هو مجيء القوم جميعاً (اكتمال العدد)، وهو مختلف عن المعنى الاصطلاحي الحديث (التكامل المتبادل)"

    - lemma: "تَكَامُلِيَّة"
      confirm:
        - text: "«تكاملية — ظ. توزيع تكاملي. — translation_en: Complementarity»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "الإحالة إلى «توزيع تكاملي» تشير إلى أن المصطلح مقيّد بالسياق اللساني"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "المصطلح قد يكون محصوراً في اللسانيات (complementary distribution)"

    - lemma: "تَلَازُم"
      contradicts:
        - text: "«تلازم — translation_en: coalescence»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
          conflict: "المعنى المعجمي المسجّل (coalescence = التحام/اندماج) يختلف جوهرياً عن complementarity"

    - lemma: "تَعَاضُد"
      contradicts:
        - text: "«القومُ: تعاونوا وتناصروا»"
          source: "المعجم الوسيط"
          conflict: "التعاضد يدلّ على التعاون والتناصر (mutualism)، لا على التكامل المتبادل (complementarity)"
        - text: "«تعاضُد — translation_en: mutualism»"
          source: "مسرد الجغرافيا والتاريخ (ALECSO)"
          conflict: "المقابل الإنجليزي mutualism وليس complementarity"

stage3_analysis:
  per_lemma:
    - lemma: "تَكَامُل"
      decision: confirmed
      decision_reason: "لمّة راسخة في المعاجم العربية المعاصرة بمعنى إكمال الأشياء بعضها بعضاً. مؤيَّدة بنصوص المعجم الوسيط ومعاجم ARABTERM المتعددة. وزن تَفَاعُل يناسب دلالة المشاركة والتبادل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح العامّ الشائع للتكامل المتبادل، يُستعمل في جميع المجالات (اقتصاد، علوم، فلسفة). أعمّ من تَتَامّ."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكَامُل"

    - lemma: "تَتَامّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح علمي موثّق في المعجم الطبي الموحد بمعنى complementarity مباشرة، ومستخدم في الوراثة والفلسفة. من جذر تمم المرادف لكمل، على وزن تَفَاعُل. المعنى الاصطلاحي الحديث مستقرّ رغم اختلاف المعنى التراثي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح تخصّصي يُستعمل غالباً في العلوم الطبية والحيوية والفيزيائية. أخصّ من تَكَامُل وأقلّ شيوعاً في الاستعمال العامّ."
      actions:
        - command: create_entry
          params: {lemma: "تَتَامّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَكَامُلِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الشاهد الوحيد من معجم اللسانيات يُحيل إلى مفهوم التوزيع التكاملي (complementary distribution) وهو مفهوم لساني مختلف. لا دليل كافٍ على استعماله بمعنى complementarity العامّ."

    - lemma: "تَلَازُم"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعجمي المسجّل (coalescence/التحام) يختلف عن مفهوم التكامل المتبادل. جذر لزم يدلّ على اللزوم والالتصاق لا على الإكمال."

    - lemma: "تَعَاضُد"
      source: stage1
      decision: removed
      decision_reason: "يدلّ على التعاون والتناصر (mutualism) لا على التكامل (complementarity). الفرق الدلالي جوهري: التعاضد تعاون متبادل، والتكامل إكمال متبادل."

