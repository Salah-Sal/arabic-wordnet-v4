          conflict: "المعنى الأصلي في كتاب العين حسّيٌّ (اقتراب الطائر من الأرض)، والدلالة النقدية (التدني في القول) مجاز بعيد لم يرسخ في المعجمية الحديثة."

    - lemma: "تَسَطُّح"
      contradicts:
