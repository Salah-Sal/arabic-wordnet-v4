          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani)"
          conflict: "لم تُسجَّل للكلمة دلالة مجازية مُعجَّمة بمعنى التعبير المستهلَك؛ والمعنى الحسّي (اللبان الممضوغ) يظل استعمالاً محلياً غير راسخ في المعجمية."


stage3_analysis:
  per_lemma:
    - lemma: "ركاكة"
      decision: confirmed
      decision_reason: >
        المعجم الكبير يُثبّت استخدامها اصطلاحاً نقدياً في السياق الأسلوبي بمعنى «ضعف الصياغة
        اللغوية وتهافتها»، وهو وجه من وجوه التعبير الممل غير المُبدع. صحيح أن دلالتها تُركّز
        على الضعف اللغوي أكثر من الابتذال، لكنها ترادف المفهوم من زاوية النقد الأدبي الكلاسيكي.
        اللمّة مُعرَّفة ومُثبَّتة معجمياً وغير لهجية، ووزن الصرف (فَعَالَة) مناسب للدلالة على
        الصفة النوعية الأسلوبية. تحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُشير إلى التعبير الضعيف المتهافت من حيث الصياغة اللغوية تحديداً؛ أي ركاكة البناء
        النحوي والبلاغي، وهو أخص من مجرد الابتذال — فقد يبتذل تعبيرٌ قوي البناء، وقد يضعف
        تعبيرٌ غير مبتذل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَكَاكَة"

    - lemma: "نثرية"
      decision: confirmed
      decision_reason: >
        المورد الحديث يُقابلها بـ"prosaism" أي «الطابع النثري أو تعبير نثري»، وهو ما يُطابق
        دلالة المجموعة (تعبير واقعي/عادي غير شعري). الجذر «نثر» يدل على الإلقاء والتفريق؛
        والنثرية بالمعنى المُسجَّل في المورد الحديث هي بالضبط «التعبير الذي يتسم بالطابع
        النثري المجرَّد من الشاعرية». المصدر الصناعي (فَعْلِيَّة) وزنٌ صرفي سليم لاستخلاص
        الصفة المجردة. تحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُشير إلى الطابع النثري الذي يغيب فيه الإيقاع والتصوير الشعري، وهو وصف لنوع التعبير
        من حيث الجنس (نثر لا شعر) لا من حيث الجودة بالضرورة — بخلاف الابتذال الذي يُقيّم
        التعبير من حيث قيمته الفنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَثْرِيَّة"

    - lemma: "اِبْتِذَال"
      source: stage1
      decision: confirmed
      decision_reason: >
        المورد الحديث يُقابله بـ"banality" و"platitude" بمعنى التعبير التافه المبتذل المكرور؛
        وأصل الجذر في ابن فارس «ترك صيانة الشيء» يُفسّر آلية الابتذال (جعل الشيء مطروحاً
        فيفقد قيمته). المصدر على وزن اِفْتِعَال منتج ومعروف. يُضيف إلى المجموعة دلالة صريحة
        على فقدان القيمة بالتداول المفرط، مما لا تُصرّح به ركاكة ولا نثرية. اجتاز اختبار
        السكّ: يصح مفرداً اصطلاحاً لا يحتاج تخصيصاً وصفياً إضافياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على بُعد الاستهلاك والتكرار: التعبير المبتذل هو ما فقد قيمته بالإكثار من
        استعماله، وهذا البُعد الزمني/الاستعمالي غائب في الركاكة (التي تعني ضعف البنية) وفي
        النثرية (التي تعني الطابع غير الشعري).
      actions:
        - command: create_entry
          params:
            lemma: "اِبْتِذَال"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إِسْفَاف"
      source: stage1
      decision: removed
      decision_reason: >
        إسفاف يعني التدني المقصود في القول أو الفعل (ورد في المعجم الكبير)، وهو يحمل مضمون
        الانحطاط الإرادي نحو ما هو أدنى. هذا يختلف عن مفهوم المجموعة الذي يتعلق بالتعبير
        الواقعي العادي الممل دون إيحاء بالانحدار المقصود. علاوة على ذلك، ارتبط المعنى الأصلي
        في كتاب العين بالحس (اقتراب الطائر من الأرض)، فالدلالة النقدية دخيلة غير راسخة.

    - lemma: "تَسَطُّح"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُسجَّل «تسطّح» بالمعنى الأدبي/النقدي في أي معجم كلاسيكي أو حديث؛ معانيه المُثبَّتة
        حسية (الانبساط) أو تقنية (flattening, outcrop) أو شخصية (صار وقحاً). فضلاً عن ذلك هو
        فعل لا اسم مما يُعيق إدراجه كلمّة اسمية في المجموعة.

    - lemma: "مَعْلُوك"
      source: stage1
      decision: removed
      decision_reason: >
        «معلوك» اسم مفعول من علك (مضغ)، ولم تُثبَّت له في المعاجم دلالة مجازية راسخة بمعنى
        التعبير المستهلَك؛ والاستخدام المجازي المُقترَح (كلام معلوك) يظل فردياً/أدبياً لا
        معجمياً مُسكَّكاً، فيخفق في اختبار التثبيت المعجمي.


