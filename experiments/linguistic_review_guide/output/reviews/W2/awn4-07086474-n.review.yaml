        «النُّونُ وَالثَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِلْقَاءِ شَيْءٍ مُتَفَرِّقٍ.
        وَنَثَرَ الدَّرَاهِمَ وَغَيْرَهَا.»"
    - lemma: "اِبْتِذَال"
      entry_id: "{auto}"
      root: "بذل"
      maqayis_quote: >
        «الْبَاءُ وَالذَّالُ وَاللَّامُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ تَرْكُ صِيَانَةِ الشَّيْءِ،
        يُقَالُ: بَذَلْتُ الشَّيْءَ بَذْلًا، فَأَنَا بَاذِلٌ وَهُوَ مَبْذُولٌ، وَابْتَذَلْتُهُ
        ابْتِذَالًا. وَجَاءَ فُلَانٌ فِي مَبَاذِلِهِ، وَهِيَ ثِيَابُهُ الَّتِي يَبْتَذِلُهَا.»"

