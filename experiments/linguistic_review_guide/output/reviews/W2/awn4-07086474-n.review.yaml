stage1_review:
  assessment:
    concerns:
      - "لمّة «ركاكة» تُعبِّر عن ضعف التعبير وتهافته لغوياً، وهو أوسع دلالةً من المفهوم المقصود (التعبير الواقعي العادي الممل)؛ فقد يكون التعبير «واقعياً/عادياً» دون أن يكون ضعيف الصياغة من الناحية اللغوية."
      - "لمّة «نثرية» تعني أصلاً الطابع النثري مقابل الشعر، وهي أوسع من المعنى المحدد المقصود إذ لا يلزم أن يكون النثر ممجوجاً أو مملاً."
      - "اللمّتان خاليتان من التشكيل الكامل."
    observations: >
      المجموعة تُعبِّر عن مفهوم نقدي أدبي يُشير إلى التعبير الخالي من الشاعرية والإبداع، المتسم
      بالعادية والابتذال. يقابله في الإنجليزية "prosaic expression" أو "prosaism" بمعنى التعبير
      الذي يفتقر إلى الجِدَّة والأصالة. للعربية موروث نقدي غنيٌّ في هذا الباب: الركاكة والنثرية
      والابتذال كلها مصطلحات دائرة في النقد الأدبي، غير أن دلالة كل منها تختلف في درجة التركيز
      على جانب بعينه: ضعف الصياغة، أو الطابع غير الشعري، أو الفقدان التام للقيمة بالتداول.
  blind_candidates:
    - lemma: "اِبْتِذَال"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن افتعال من جذر «بذل» (أصله: ترك صيانة الشيء)؛ الابتذال يدل على صيرورة
        التعبير شائعاً مطروحاً فقد قيمته بكثرة الاستعمال، وهو يُقابل تماماً المعنى المقصود
        من "commonplace, dull expression". ورد في معاجم حديثة كمقابل لـ banality وplatitude.
    - lemma: "إِسْفَاف"
      generation_method: ishtiqaq
      justification: >
        مصدر إفعال من جذر «سفف»، ومعناه التدني في القول أو الفعل (ورد في المعجم الكبير بهذا
        المعنى). يُلمح إلى تعبير ينزل عن مستوى الجودة نحو الدنو والابتذال، مما يجعله قريباً
        من مفهوم التعبير الممل غير المشرّف.
    - lemma: "تَسَطُّح"
      generation_method: ishtiqaq
      justification: >
        مصدر تفعّل من جذر «سطح»؛ يُستعمل مجازاً للدلالة على تعبير لا عمق فيه ولا أصالة،
        مسطّح الفكرة خالٍ من الطاقة الإيحائية، مما يُقاربه من دلالة التعبير العادي الممل.
    - lemma: "مَعْلُوك"
      generation_method: majaz
      justification: >
        اسم مفعول من «علك» (أصله: المضغ المستمر حتى يفقد الشيء طعمه)؛ بالمجاز يُطلق على
        التعبير المُستهلَك المُكرَّر الذي فقد جدّته وتأثيره، كما يُقال «كلام معلوك» للكلام
        المُعاد تداوله حتى أُشبع.


stage2_evidence:
  per_lemma:
    - lemma: "ركاكة"
      confirm:
        - text: "«فى الأسلوب: ضَعْفُ الصِّياغَةِ اللُّغَوِيَّةِ وتهافُتُها. يقال: أُسْلُوبٌ فيه رَكَاكَةٌ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
      expands:
        - text: "«(الركاكة) الرجل يستضعفه النِّسَاء فَلَا يهبنه وَالَّذِي لَا يغار على أَهله»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          addition: "المعنى الأصلي مرتبط بالضعف الإنساني لا الأسلوبي، مما يكشف أن الاستخدام في النقد الأدبي هو توسّع دلالي متأخر."
        - text: "«الرجل يستضعفه النساء فلا يهبنه / الذى لا يغار على أهله»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
          addition: "المعجم الوسيط (OCR) يُثبّت المعنى الحرفي دون المعنى الأسلوبي، مما يدل على أن الدلالة النقدية تخصّ المعجم الكبير."

    - lemma: "نثرية"
      confirm:
        - text: "«(1) النثرية: الطابع أو الأسلوب النثري (2) تعبير نثري إلخ.»"
          source: "المورد الحديث (2008) — بيروت"
      expands:
        - text: "«نَثْرِيَّة — من (ن ث ر) نسبة إلى نَثْر.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani)"
          addition: "يُثبت أن الكلمة عربية النسب من جذر نثر، غير أنه لا يُعطيها دلالةً بعيدة عن مجرد النسبة."
        - text: "«(1) النثر (2) كلامٌ عاديّ غير مُمتع (3) «أ» واقعية. «ب» ابتذال (4) نَثْريّ (5) .أ» واقعيّ. .ب» مبتذل (6) يَنْثُر: .أ» يكتب نثرًا. .ب» يكتب أو يتحدَّث بطريقةٍ مُضْجِرةٍ أو غير ممتعة.»"
          source: "المورد الحديث (2008) — ترجمة prose"
          addition: "يُثبت أن النثر في المعجم الحديث يحمل معنيين: الكتابة النثرية المجردة، وكلام عادي غير ممتع؛ مما يعزز دلالة نثرية بالمعنى الثاني."

    - lemma: "اِبْتِذَال"
      confirm:
        - text: "«(1) ابتذال؛ تفاهة (2) شيء مبتذَل.»"
          source: "المورد الحديث (2008) — ترجمة banality"
        - text: "«(1) تفاهة؛ ابتذال (2) ملاحظة تافهة أو مبتذَلَة.»"
          source: "المورد الحديث (2008) — ترجمة platitude"
        - text: "«(3) ابتذال.»"
          source: "المورد الحديث (2008) — ترجمة pedestrianism"
      expands:
        - text: "«(بَذَلَ) الْبَاءُ وَالذَّالُ وَاللَّامُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ تَرْكُ صِيَانَةِ الشَّيْءِ، يُقَالُ: بَذَلْتُ الشَّيْءَ بَذْلًا، فَأَنَا بَاذِلٌ وَهُوَ مَبْذُولٌ، وَابْتَذَلْتُهُ ابْتِذَالًا.»"
          source: "مقاييس اللغة — ابن فارس"
          addition: "يُبيّن أن أصل الجذر «ترك صيانة الشيء»، فالابتذال هو جعل الشيء مُتاحاً مطروحاً فيفقد قيمته؛ وهذا يُفسر الدلالة النقدية الأدبية بصورة جلية."

    - lemma: "إِسْفَاف"
