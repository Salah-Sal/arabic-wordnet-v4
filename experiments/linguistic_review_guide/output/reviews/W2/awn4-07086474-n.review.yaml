          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: "تسطّح فعل لا اسم، ولم تُسجَّل له دلالة نقدية أدبية بمعنى التعبير الممل. المعنى المجازي المُسجَّل (قليل الحياء) بعيد عن المفهوم المقصود."

    - lemma: "مَعْلُوك"
      contradicts:
