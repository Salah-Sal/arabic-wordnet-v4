      decision: removed
      decision_reason: "تم استبدالها بالتركيب الأدق والأكثر شيوعاً «تربية دود القز» بصيغة الجمع، حيث تُربّى الديدان في مجموعات والمصطلح المستقر في المصادر هو بالجمع."
    - lemma: "قِزَازَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مفرد بوزن (فِعالة) الدال على الحرفة أو الصناعة، وهو معتمد في القواميس الحديثة ومناسب للتعبير عن صناعة استخراج الحرير."
