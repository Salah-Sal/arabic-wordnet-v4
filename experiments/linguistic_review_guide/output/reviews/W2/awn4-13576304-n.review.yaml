        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "قِزَازَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13576304-n"}
    - lemma: "تَرْبِيَةُ دُودِ القَزِّ"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب إضافي ثابت ومعتمد في المعاجم المتخصصة لوصف عملية العناية بدود القز لإنتاج الحرير، وهو أصح من إفراد كلمة دودة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "تَرْبِيَةُ دُودِ القَزِّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13576304-n"}
    - lemma: "إِقْزَار"
      source: stage1
      decision: removed
      decision_reason: "لم يرد في المعاجم بهذا المعنى، والجذر يحمل دلالات أخرى متعلقة بالوثب والتنطس."
    - lemma: "إِنْتَاجُ الحَرِيرِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي عام لا يقتصر على عملية تربية الدود، بل قد يشمل عمليات أخرى لتصنيع الحرير من شرانق جاهزة."

