stage1_review:
  assessment:
    concerns:
      - "استخدام كلمة «دودة» بصيغة المفرد في اللمة الحالية، والأصح والأشيع استخدام صيغة الجمع «دود» لكونها تُربّى في مجموعات وتسمى الحرفة «تربية دود القز»."
      - "غياب مصطلح مفرد يعبر عن العملية برمتها كحرفة."
    observations: "المفهوم يشير إلى حرفة أو زراعة خاصة تتعلق بإنتاج الحرير، والتعبير الشائع إضافي وصفي، ويمكن الاستفادة من أبنية الحرف والصناعات (فِعالة) لصياغة مصطلح مفرد."
  blind_candidates:
    - lemma: "قِزَازَة"
      generation_method: ishtiqaq
      justification: "صيغة فِعالة الدالة على الحرفة والصناعة من القز (الحرير)، للتعبير عن صناعة إنتاجه."
    - lemma: "إِقْزَار"
      generation_method: ishtiqaq
      justification: "مصدر على وزن إفعال من قزّ، للدلالة على عملية إنتاج القز أو استخراجه."
    - lemma: "تَرْبِيَةُ دُودِ القَزِّ"
      generation_method: tarkib
      justification: "تركيب إضافي يصف العملية بدقة وهو التعبير الأكثر شيوعاً في العربية لوصف هذه الممارسة."
    - lemma: "إِنْتَاجُ الحَرِيرِ"
      generation_method: tarkib
      justification: "تركيب إضافي يركز على الغاية من العملية وهي الحصول على الحرير."

