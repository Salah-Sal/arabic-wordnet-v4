step0_evidence:
  per_lemma:
    - lemma: "قَرِين"
      confirm:
        - text: "المقارن والمصاحب"
          source: "المعجم الوسيط"
      expands:
        - text: "البعير المقرون بآخر"
          source: "المعجم الوسيط"
          addition: "دلالة مادية أصلية على الربط المادي"
    - lemma: "كُفْؤ"
      confirm:
        - text: "النظير والمساوي، وشرعا رجل يساوي امرأة في أمور مشهورة"
          source: "كشاف اصطلاحات الفنون والعلوم"
        - text: "هو النظير والمثل"
          source: "التعريفات الفقهيّة"
    - lemma: "نَظِير"
      confirm:
        - text: "المناظر والمثل والمساوي"
          source: "المعجم الوسيط"
    - lemma: "نِدّ"
      confirm:
        - text: "الند: المثل والنظير"
          source: "المعجم الوسيط"
      expands:
        - text: "المثل في الذات والمخالف في الصفات ... المثل المنازع"
          source: "كشاف اصطلاحات الفنون والعلوم"
          addition: "دلالة المنازعة والمخالفة إلى جانب المماثلة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "صِنْو"
      source_section: "step5_english_bridge"
      evidence_citation: "«الصنو؛ الند؛ الكفؤ» — المورد الحديث"
      justification: "مقابل موثق لمصطلحات (compeer, match) ويحمل دلالة المماثلة القوية."
    - lemma: "مَثِيل"
      source_section: "step5_english_bridge"
      evidence_citation: "«مثيل؛ نظير» — المورد الحديث"
      justification: "اللفظ المباشر للدلالة على المماثلة وهو مرادف قوي للنظير."
  knowledge_candidates:
    - lemma: "تِرْب"
      justification: "مصطلح عربي تراثي (آلية الاشتقاق/المجاز) يدل على المساوي في السن أو المنزلة (خاصة للأقران)، كما في التعبير 'أتراب'."

step1_lemma_validation:
  per_lemma:
    - lemma: "قَرِين"
      decision: "confirmed"
      decision_reason: "أدلة مؤكدة؛ مصطلح شائع للدلالة على الأقران"
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى المصاحبة والملازمة والاقتران في مجموعة (مثل أقران الدراسة)."
      example: "يُقيَّم الطالب عادةً بمقارنة أدائه بأداء أقرانه."
    - lemma: "كُفْؤ"
      decision: "confirmed"
      decision_reason: "أدلة مؤكدة بلا تناقض"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى المماثلة والمساواة في القدرة والأهلية والمنزلة."
      example: "تزوّجت الفتاة برجلٍ كُفْؤٍ لها."
    - lemma: "نَظِير"
      decision: "confirmed"
      decision_reason: "أدلة مؤكدة صريحة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح عام يدل على المماثلة والمساواة في الخصائص أو الرتبة."
      example: "التقى الوزير بنظيره في الدولة المجاورة لبحث العلاقات."
    - lemma: "نِدّ"
      decision: "confirmed"
      decision_reason: "أدلة مؤكدة، مع دلالة إضافية مقبولة"
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى المساواة التي غالباً ما يرافقها تنافس أو منازعة أو تضاد."
      example: "أثبت المصارع أنه نِدّ قويّ لمنافسه."
    - lemma: "مَثِيل"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مرادف مباشر وصحيح"
      step05_citation: "«مثيل؛ نظير» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على المماثلة المطلقة في الصفات والأحوال."
      example: "لم يشهد التاريخ مَثيلاً لهذا القائد."
      actions:
        - command: "create_entry"
          params:
            lemma: "مَثِيل"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09649426-n"
    - lemma: "تِرْب"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مرادف دقيق للمساوي في السن/المكانة"
      step05_citation: "معرفة لغوية — يدل على المساواة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُخَصّ غالباً بالمماثل والمساوي في السنّ والنشأة."
      example: "كان يلعب مع أترابه في الحي منذ الصغر."
      actions:
        - command: "create_entry"
          params:
            lemma: "تِرْب"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09649426-n"

