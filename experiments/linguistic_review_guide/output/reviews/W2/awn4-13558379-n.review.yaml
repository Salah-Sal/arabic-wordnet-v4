      entry_id: "{auto}"
      roots:
        - word: "صناعة"
          root: "صنع"
          maqayis_quote: "«الصَّادُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، وَهُوَ عَمَلُ الشَّيْءِ صُنْعًا.»"
        - word: "الواح"
          root: "لوح"
          maqayis_quote: "«اللَّامُ وَالْوَاوُ وَالْحَاءُ أَصْلٌ صَحِيحٌ، مُعْظَمُهُ مُقَارَبَةُ بَابِ اللَّمَعَانِ... وَاللَّوْحُ: الْوَاحِدُ مِنْ أَلْوَاحِ السَّفِينَةِ; وَهُوَ أَيْضًا كُلُّ عَظْمٍ عَرِيضٍ.»"
        - word: "الضوئية"
          root: "ضوء"
          maqayis_quote: "«الضَّادُ وَالْوَاوُ وَالْهَمْزَةُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى النُّورِ.»"
    
    - lemma: "مِيكَانِيكَا ضَوْئِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "ميكانيكا"
          root: ""
