          root: "حفر"
          maqayis_quote: "«الْحَاءُ وَالْفَاءُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا حَفْرِ الشَّيْءِ، وَهُوَ قَلْعُهُ سُفْلًا ; وَالْآخَرُ أَوَّلُ الْأَمْرِ.»"
        - word: "ضوئي"
          root: "ضوء"
          maqayis_quote: "«الضَّادُ وَالْوَاوُ وَالْهَمْزَةُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى النُّورِ.»"

  per_sense:
