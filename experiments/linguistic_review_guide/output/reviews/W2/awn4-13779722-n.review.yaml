# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13779722-n (headspace)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«مساحة فارغة» تعبير وصفي عام لا يُحيل تحديداً إلى الحجم الفارغ أعلى الحاوية، ويصلح لأي فراغ"
      - "«مساحة فارغة» تفشل في اختبار السكّ: يمكن إبدال «فارغة» بـ«خالية» وتبقى العبارة صالحة كوصف"
      - "اللمّتان بلا تشكيل"
    observations: >
      المفهوم تقني متخصص في مجال تقانات الأغذية والتعبئة الصناعية، يشير إلى الحيّز الفارغ
      المتروك عمداً في أعلى العبوة (زجاجة أو علبة) قبل الإحكام. المصطلح الإنجليزي «headspace»
      مركّب من head + space، والترجمة العربية المعتمدة في معاجم أليكسو «فراغ رأسيّ» تحافظ على
      البنية نفسها. أمّا «مساحة فارغة» فعبارة حرّة لا ترقى إلى مصطلح مسكوك.
  blind_candidates:
    - lemma: "فَرَاغ عُلْوِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «فراغ» (خلوّ) + «عُلويّ» (نسبة إلى الأعلى)، يصف الحيّز الفارغ في
        الجزء العلوي من الحاوية. بنية تركيبية مباشرة تناظر المفهوم.
    - lemma: "فَرَاغ قِمِّيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «فراغ» + «قِمّيّ» (نسبة إلى القِمّة)، يؤدّي المعنى نفسه مع إبراز
        موضع الفراغ في قمّة الوعاء.
    - lemma: "مُتَنَفَّس"
      generation_method: majaz
      justification: >
        مجاز من التنفّس، على وزن مُتَفَعَّل (اسم مكان/مصدر ميمي)، إذ يُترَك هذا الفراغ
        ليكون متنفَّساً للحاوية يسمح بالتمدد الحراري والضغط الداخلي.
    - lemma: "هِدْسْبِيس"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الإنجليزي «headspace». لا يُلجأ إليه إلا عند تعذّر البدائل
        العربية، وهو الملاذ الأخير.

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "فَرَاغ رَأْسِيّ"
      confirm:
        - text: "«فراغ رأسيّ، فراغ علويّ — الجزء الفارغ أعلى العبوة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«فراغ رأسيّ كليّ — الجزء الفارغ الكليّ في أعلى العبوة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«فراغ (ال...) الرأسيّ الصافيّ — الفراغ الموجود ما بين سطح المادة وسطح العلبة الداخليّ.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«تحليل بطريقة الفراغ العلوى» — headspace analysis"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يؤكد استعمال «الفراغ» مع صفة مكانية في السياق التقني"

    - lemma: "مَسَاحَة فَارِغَة"
      evidence_status: "no_material_found"

    # ── مرشحات المرحلة ١ ──
    - lemma: "فَرَاغ عُلْوِيّ"
      confirm:
        - text: "«فراغ رأسيّ، فراغ علويّ — الجزء الفارغ أعلى العبوة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"

    - lemma: "فَرَاغ قِمِّيّ"
      confirm:
        - text: "«فراغ قمي (في أعلى خزان)» — ullage space"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
      expands:
        - text: "«فجوة الصهريج، فراغ فوق شحنة الناقلة النفطية» — ullage"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "مفهوم قريب (ullage) في مجال النفط، يستخدم «فراغ» مع وصف مكاني مختلف"

    - lemma: "مُتَنَفَّس"
      contradicts:
        - text: "«(المتنفس) يُقال: أنف متنفس: أفطس»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يخصّص المتنفَّس بوصف الأنف الأفطس، لا بالحيّز الفارغ"
      expands:
        - text: "«متنفس — تجهيز محدث في موقع لطمر النفايات للسماح للغازات والأبخرة بالخروج إلى الغلاف الجوي.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "في الاستعمال التقني الحديث يعني فتحة تهوية (vent)، لا حجماً فارغاً"

    - lemma: "هِدْسْبِيس"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "فَرَاغ رَأْسِيّ"
      decision: confirmed
      decision_reason: >
        مصطلح موحّد معتمد من أليكسو في معجم تقانات الأغذية (2004)، مع تعريف مطابق تماماً
        لدلالة المجموعة الترادفية. مركب وصفي ثابت مسجّل في عدة مصادر مصطلحية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        المصطلح المعتمد الأوّل في مجال تقانات الأغذية والتعبئة، يركّز على اتجاه الفراغ
        (رأسيّ = عمودي من الأعلى). أقرب إلى الاستعمال الصناعي الغذائي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَرَاغ رَأْسِيّ"

    - lemma: "مَسَاحَة فَارِغَة"
      decision: removed
      decision_reason: >
        عبارة وصفية حرّة تفشل في اختبار السكّ (يمكن إبدال «فارغة» بـ«خالية» أو «فضاء»)
        ولا تحيل تحديداً إلى الحيّز أعلى الحاوية. لم تُوثَّق كمصطلح ثابت في أي معجم
        مصطلحي. دلالتها عامة جداً ولا تميّز هذا المفهوم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "فَرَاغ عُلْوِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح موثّق في معجم تقانات الأغذية (أليكسو 2004) كمرادف لـ«فراغ رأسيّ» في
        المدخل نفسه. كما يظهر في عبارة «تحليل بطريقة الفراغ العلوي» في موسوعة الكهرباء.
        مركب وصفي ثابت مسجّل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مرادف لـ«فراغ رأسيّ» لكنه يصف موقع الفراغ بالنسبة للحاوية (عُلويّ = في الأعلى)
        بدلاً من اتجاهه. أكثر شفافية دلالية للقارئ غير المتخصص.
      actions:
        - command: create_entry
          params:
            lemma: "فَرَاغ عُلْوِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "فَرَاغ قِمِّيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح «فراغ قمي» موثّق في معجم علوم البحار (2000) لكن بدلالة مختلفة قليلاً
        (ullage space في أعلى خزّان سفينة)، وهو مجال بحري لا غذائي. إضافته قد تسبّب
        خلطاً مع المفهوم البحري. يكفي «فراغ رأسيّ» و«فراغ علويّ» لتغطية الدلالة.
      evidence_assessment:
        case: mixed

    - lemma: "مُتَنَفَّس"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المعجمية تتعارض مع المفهوم: في المعجم الوسيط يُستخدم لوصف الأنف الأفطس،
        وفي الاستعمال التقني الحديث يعني فتحة تهوية (vent) لا حجماً فارغاً. المجاز غير
        مستقرّ ولا مسكوك في هذا المجال.
      evidence_assessment:
        case: contradicts_only

    - lemma: "هِدْسْبِيس"
      source: stage1
      decision: removed
      decision_reason: >
        لا حاجة للتعريب مع وجود مصطلحات عربية أصيلة موحّدة ومعتمدة من أليكسو.
        التعريب ملاذ أخير ولا يُلجأ إليه إلا عند تعذّر البدائل.
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "الحجم المتبقي في الجزء العلوي من حاوية مملوءة (زجاجة أو جرة أو علبة) قبل إغلاقها"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول من حيث المضمون لكنه يستخدم «الحجم المتبقي» وهو ترجمة
        حرفية لـ«volume left». الأدقّ «الجزء الفارغ» كما في معاجم أليكسو. كما ينبغي
        استبدال «حاوية» العامّة بـ«عبوة» الأنسب لسياق التعبئة الصناعية.
    authored:
      - type: terminological
        text: "الجزءُ الفارغُ المتروكُ في أعلى العُبْوَة المملوءة قبل إحكام إغلاقها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          الحيِّز الخالي الذي يُترَك عمداً بين سطح المادة المُعبَّأة والغطاء الداخليّ
          للعُبْوَة (زجاجة أو عُلْبَة أو جَرّة)، ويُراعى فيه السماح بالتمدُّد الحراريّ
          وتكوُّن التفريغ الجزئيّ عند التعقيم
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الجزءُ الفارغُ المتروكُ في أعلى العُبْوَة المملوءة قبل إحكام إغلاقها"

  examples:
    per_lemma:
      - lemma: "فَرَاغ رَأْسِيّ"
        examples:
          - text: "يجب ترك فَرَاغ رَأْسِيّ كافٍ في العُلَب المعدنية لضمان تكوُّن التفريغ الجزئيّ بعد التعقيم."
            type: usage
      - lemma: "فَرَاغ عُلْوِيّ"
        examples:
          - text: "يُقاس الفَرَاغ العُلْوِيّ في زجاجات العصائر للتأكّد من مطابقته لمعايير السلامة الغذائية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يجب ترك فَرَاغ رَأْسِيّ كافٍ في العُلَب المعدنية لضمان تكوُّن التفريغ الجزئيّ بعد التعقيم."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُقاس الفَرَاغ العُلْوِيّ في زجاجات العصائر للتأكّد من مطابقته لمعايير السلامة الغذائية."

