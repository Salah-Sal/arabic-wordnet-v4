# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13638994-n — board measure
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية «قياس الألواح الخشبية» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — يمكن استبدال «الخشبية» بـ«المعدنية» مثلاً ويبقى التعبير صالحاً وصفياً"
      - "المصطلح لا يعكس خصوصية النظام المبني على وحدة «القدم اللوحي» — بل يوحي بقياس عام لأي ألواح"
      - "المفهوم تقني غربي (نظام القدم اللوحي الأمريكي) لا يوجد له مقابل تراثي عربي مباشر"
    observations: "المفهوم هو نظام قياسي محدد يعتمد على وحدة القدم اللوحي (board foot = 144 إنشاً مكعباً) لحساب حجم الخشب المنشور. يحتاج إلى مصطلح مركب ثابت يربط بين القياس واللوح/الخشب بصورة اصطلاحية لا وصفية."

  blind_candidates:
    - lemma: "القِيَاسُ اللَّوْحِيُّ"
      generation_method: tarkib
      justification: "مركب وصفي (wasfi) من «القياس» + النسبة «اللوحي»، يُفيد نظام القياس المنسوب إلى اللوح كوحدة أساسية، على غرار «النظام المتري» و«القياس الحراري»."
    - lemma: "مِقْيَاسُ الأَلْوَاحِ"
      generation_method: tarkib
      justification: "مركب إضافي (idafi) من «مقياس» (اسم آلة من قاس) + «الألواح»، يُفيد الأداة أو النظام المستخدم لقياس الألواح الخشبية."
    - lemma: "تَقْدِيرُ الخَشَبِ"
      generation_method: tarkib
      justification: "مركب إضافي من «تقدير» (مصدر قدّر، بمعنى حساب المقدار) + «الخشب»، يُفيد عملية حساب كمية الخشب."
    - lemma: "نِظَامُ القَدَمِ اللَّوْحِيَّةِ"
      generation_method: tarkib
      justification: "مركب إضافي-وصفي يجمع بين «نظام» + «القدم اللوحية» (الوحدة الأساسية)، فيكون أكثر تحديداً من غيره لأنه يُسمّي الوحدة صراحة."

stage2_evidence:
  per_lemma:
    - lemma: "قِيَاسُ الأَلْوَاحِ الخَشَبِيَّةِ"
      evidence_status: "no_material_found"

    - lemma: "القِيَاسُ اللَّوْحِيُّ"
      confirm:
        - text: "«القياس اللَّوحيّ: نظام لقياس ألواح الخشب بالقدم اللوحيّ (را. board foot).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«القَدَم اللَّوحيّ: وحدة حَجْم تساوي 144 إنشًا مُكَعّبًا.»"
          source: "المورد الحديث (2008)"
          addition: "يُوضّح الوحدة الأساسية التي يقوم عليها نظام القياس اللوحي"

    - lemma: "مِقْيَاسُ الأَلْوَاحِ"
      evidence_status: "no_material_found"

    - lemma: "تَقْدِيرُ الخَشَبِ"
      evidence_status: "no_material_found"

    - lemma: "نِظَامُ القَدَمِ اللَّوْحِيَّةِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "قِيَاسُ الأَلْوَاحِ الخَشَبِيَّةِ"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل في اختبار السكّ: يمكن إبدال «الخشبية» بـ«المعدنية» أو «الزجاجية» والعبارة تظل صالحة وصفياً. لا شاهد معجمي عليها بوصفها مصطلحاً مسكوكاً. يوجد بديل ثابت في المورد الحديث هو «القياس اللوحي»."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "القِيَاسُ اللَّوْحِيُّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسكوك مسجّل في المورد الحديث (2008) بتعريف مطابق تماماً لدلالة المجموعة الترادفية. مركب وصفي (wasfi) مستقر لغوياً: «القياس» + نسبة «اللوحي» من «لَوْح». يجتاز اختبار السكّ لأن إبدال «اللوحي» بصفة أخرى يُغيّر المعنى الاصطلاحي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح المعتمد في المعاجم الثنائية الحديثة لترجمة board measure؛ يُركّز على كون القياس منسوباً إلى اللوح بوصفه وحدة."
      actions:
        - command: create_entry
          params:
            lemma: "القِيَاسُ اللَّوْحِيُّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مِقْيَاسُ الأَلْوَاحِ"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي. والمركب الإضافي «مقياس الألواح» يوحي بأداة قياس الألواح لا بنظام قياسي. كما أن «مقياس» بصيغة اسم الآلة (مِفْعَال) يدل على أداة لا على نظام وحدات."

    - lemma: "تَقْدِيرُ الخَشَبِ"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي. «التقدير» يدل على العملية العقلية لا على نظام وحدات. المركب عام جداً ولا يُميّز هذا النظام المحدد من غيره من طرائق تقدير الخشب."

    - lemma: "نِظَامُ القَدَمِ اللَّوْحِيَّةِ"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي. تركيب طويل (أربع كلمات) لا يتمتع بثبات معجمي. رغم دقته الوصفية، فإن «القياس اللوحي» أخصر وأكثر سكّاً واعتماداً."

stage4_content:
  definition:
    current: "نظام وحدات لقياس الخشب المنشور يعتمد على قدم اللوح"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول في مضمونه لكنه يحتاج تحسينات: (١) «قدم اللوح» تحتاج توضيحاً بأنها وحدة حجمية، (٢) الصياغة قريبة من الترجمة الحرفية، (٣) ينبغي ربط التعريف بالمصطلح العربي «القدم اللوحي»."
    authored:
      - type: terminological
        text: "نِظامٌ لقِياسِ حَجْمِ الخَشَبِ المَنْشورِ، وَحْدَتُهُ الأساسِيَّةُ القَدَمُ اللَّوْحِيُّ، وهُوَ حَجْمُ لَوْحٍ طُولُهُ قَدَمٌ وعَرْضُهُ قَدَمٌ وسُمْكُهُ إِنْشٌ واحِدٌ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "طَرِيقَةٌ لِتَقْدِيرِ كَمِّيَّةِ الأَخْشابِ المَنْشورَةِ بِحِسابِ حَجْمِها بِالقَدَمِ اللَّوْحِيِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نِظامٌ لقِياسِ حَجْمِ الخَشَبِ المَنْشورِ، وَحْدَتُهُ الأساسِيَّةُ القَدَمُ اللَّوْحِيُّ، وهُوَ حَجْمُ لَوْحٍ طُولُهُ قَدَمٌ وعَرْضُهُ قَدَمٌ وسُمْكُهُ إِنْشٌ واحِدٌ."

  examples:
    per_lemma:
      - lemma: "القِيَاسُ اللَّوْحِيُّ"
        examples:
          - text: "يَعْتَمِدُ تُجَّارُ الأَخْشَابِ في أَمْرِيكا الشَّمالِيَّةِ عَلَى القِياسِ اللَّوْحِيِّ لِتَسْعِيرِ الخَشَبِ المَنْشورِ وَبَيْعِهِ بِالجُمْلَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يَعْتَمِدُ تُجَّارُ الأَخْشَابِ في أَمْرِيكا الشَّمالِيَّةِ عَلَى القِياسِ اللَّوْحِيِّ لِتَسْعِيرِ الخَشَبِ المَنْشورِ وَبَيْعِهِ بِالجُمْلَةِ."

