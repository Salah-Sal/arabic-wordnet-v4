  per_entry:
    - lemma: "القِيَاسُ اللَّوْحِيُّ"
      entry_id: "{auto}"
      roots:
        - word: "القياس"
          root: "قوس"
          maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالسِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَقْدِيرِ شَيْءٍ بِشَيْءٍ... وَمِنْهُ الْقِيَاسُ، وَهُوَ تَقْدِيرُ الشَّيْءِ بِالشَّيْءِ، وَالْمِقْدَارُ مِقْيَاسٌ.»"
