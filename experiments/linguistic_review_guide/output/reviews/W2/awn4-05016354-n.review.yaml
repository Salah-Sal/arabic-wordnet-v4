# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "خاصية فيزيائية"
      decision: confirmed
      decision_reason: >
        ثبت المصطلح في معجمَيْن تقنيَّيْن محكَّمَيْن على الأقل (الكيمياء 1992
        والصيدلة 2009 من إصدارات ALECSO)، كما ورد في سياقات وصفية متعددة
        (الهندسة المدنية، تقانات الأغذية، مصطلحات المياه). هو الخيار الأوفر
        تداولاً لـ physical property في العربية العلمية المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      mwe_validation: >
        اختبار السكّ: المركّب مُسجَّل وحدةً معجميةً ثابتة في معجمَيْن من
        ALECSO. اختبار الاستبدال: «فيزيائية» لا تُعادَل بمرادف آخر دون
        تغيير المعنى النوعي (خاصية كيميائية ≠ خاصية فيزيائية)؛ فالمقيّد
        النوعي ليس زائداً. ∴ التعبير مصطلح محكم لا وصف حرّ.
      substitution_test: >
        «خاصية فيزيائية» لا يمكن إحلال «خواصّ» أو «صفة» محلّه في السياق
        التقني دون فقدان الدقة الاصطلاحية، مما يُثبت أنّه وحدة معجمية مستقلة.
      borrowing_check:
        lexical_borrowing: >
          «فيزيائية» معرَّبة من اليونانية φυσική (physica) عبر الأوروبية؛
          استوفت شروط التعريب: تقبل ال- والنسبة والجمع السالم. مقبولة.
        calque_check: >
          التركيب موازٍ لـ physical property (noun + adj)؛ بنية شفافة تتوافق
          مع الأسلوب العربي (اسم + صفة). مقبول.
      quality_gate:
        ittiraad: "مطّرد في الاستعمال العلمي العربي الحديث (فيزياء/كيمياء/صيدلة/هندسة)"
        yusr: "يُتداول بيسر في الكتابة والخطاب العلمي العربي"
        mulaaama: "ملائم للدلالة المطلوبة ولا يحمل معنى غريباً أو طارئاً"
        iithaar_turaath: "«خاصية» من التراث العربي (خصَّ / خاصّة)؛ «فيزيائية» معرَّبة"
        iithaar_arabi: "الشقّ الأول عربي أصيل؛ الشقّ الثاني معرَّب لا مناص منه"
        ishtiqaaqiyya: "الاشتقاق سليم: خصَّ → خاصّة → خاصّيَّة (مصدر صناعي)"
      morphological_check: >
        «خَاصِّيَّة» على وزن فَاعِّيَّة (مصدر صناعي)، ملائم للدلالة على
        المجرّد المشتقّ من الصفة. «فِيزِيَائِيَّة» نسبة من «فيزياء»، وزنها
        سليم صرفياً. المركّب كلّه مستوفٍ للبنية الصرفية العربية.
      nuance_differentiation: >
        لمّة وحيدة في المجموعة؛ تتميّز عن الفصيل الأعلى «خَاصِّيَّة
        جَوْهَرِيَّة» بأنّها مقيَّدة بالمادة والطاقة وتفاعلاتهما، لا
        بجوهر الفئة ذاتها، وتُقاس وتُلاحَظ تجريبياً (كالكتلة والكثافة
        والحرارة) بخلاف الخاصية الجوهرية الأنطولوجية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاصِّيَّة فِيزِيَائِيَّة"

    # ── مرشّح ١ (المرحلة ١) — مطابق للّمّة الموجودة ──
    - lemma: "خَاصِّيَّة فِيزِيَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو اللمّة الموجودة ذاتها بتشكيل كامل؛ تمّ إثبات اللمّة
        الموجودة ومعالجتها بأمر update_lemma أعلاه. لا حاجة إلى create_entry
        مستقل.

    # ── مرشّح ٢ ──
    - lemma: "صِفَة فِيزِيَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد المركّب «صفة فيزيائية» بوصفه مصطلحاً مسكوكاً في أيّ من
        المعاجم المستعلَمة. «الصِّفة» أعمّ دلالةً من «الخاصّيَّة» في
        الحقل العلمي العربي الحديث؛ والمعجمية العربية الحديثة استقرّت على
        «خاصية» مقابل property في الفيزياء. ∴ إضافته تُوجد اشتراكاً غير
        مبرَّر مع مصطلحات أخرى (attribute, quality).

    # ── مرشّح ٣ ──
    - lemma: "سِمَة مَادِّيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «سِمَة» مستخدمة في حقل اللسانيات وعلوم البيانات/الذكاء الاصطناعي
        (feature)، وليس في الفيزياء. «مادّيّة» أضيق من «فيزيائية» إذ تُحيل
        إلى المادة فقط دون الطاقة. لا شاهد معجمي على هذا المركّب في
        السياق الفيزيائي.

    # ── مرشّح ٤ ──
    - lemma: "مُمَيِّز فِيزِيَائِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد في المعاجم على «مُمَيِّز فِيزِيَائِيّ» بهذه الدلالة.
        «مُمَيِّز» في الاستعمال العلمي العربي يُحيل إلى discriminant أو
        identifier لا إلى property. يُشكّل خلطاً مفهومياً مع مصطلحات
        التمييز الرياضي والإحصائي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "أي خاصية تستخدم لتوصيف المادة والطاقة وتفاعلاتهما"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمةٌ شبه حرفية للإنجليزي (any property used to
        characterize matter and energy and their interactions)، يفتقر إلى:
        (١) الجنس القريب المحدَّد (يرتبط بالمفهوم الأعلى «خاصّية جوهرية»)،
        (٢) الفصل النوعي الكافي (لا يذكر أنها قابلة للقياس والرصد التجريبي)،
        (٣) أمثلة توضيحية تُثبّت المعنى في ذهن القارئ. كما أن «تستخدم»
        عامّيّ الطابع في سياق المعجم؛ يُفضَّل «يُستعان بها» أو «تصلح معياراً».
    authored:
      - type: terminological
        text: >
          كُلُّ خَاصِّيَّةٍ قَائِمَةٍ فِي المَادَّةِ أَوِ الطَّاقَةِ
          أَوْ تَفَاعُلَاتِهِمَا، تَصْلُحُ مُعَيِّنًا لِوَصْفِهِمَا
          وَتَمْيِيزِهِمَا، وَيُمْكِنُ قِيَاسُهَا أَوْ رَصْدُهَا
          تَجْرِيبِيًّا؛ كَالكُتْلَةِ وَالكَثَافَةِ وَدَرَجَةِ الحَرَارَةِ
          وَالتَّوَصُّلِيَّةِ الكَهْرَبَائِيَّةِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          تَشْمَلُ الخَوَاصُّ الفِيزِيَائِيَّةُ كُلَّ مَا يُمَيِّزُ
          المَادَّةَ أَوِ الطَّاقَةَ أَوْ نَظَامًا فِيزِيَائِيًّا
          وَيُمْكِنُ تَحْدِيدُهُ دُونَ تَغْيِيرٍ كِيمَائِيٍّ؛ فَمِنْهَا
          المِيكَانِيكِيَّةُ كَالكُتْلَةِ وَالضَّغْطِ، وَالحَرَارِيَّةُ
          كَدَرَجَةِ الانْصِهَارِ وَالحَرَارَةِ النَّوْعِيَّةِ،
          وَالكَهْرَبِيَّةُ والضَّوْئِيَّةُ وَالصَّوْتِيَّةُ،
          وَتُقَابَلُ بِالخَوَاصِّ الكِيمِيَائِيَّةِ التِي تَتَجَلَّى
          فَقَطْ بِتَحَوُّلِ المَادَّةِ.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05016354-n"
          definition_index: 0
          text: >
            كُلُّ خَاصِّيَّةٍ قَائِمَةٍ فِي المَادَّةِ أَوِ الطَّاقَةِ
            أَوْ تَفَاعُلَاتِهِمَا، تَصْلُحُ مُعَيِّنًا لِوَصْفِهِمَا
            وَتَمْيِيزِهِمَا، وَيُمْكِنُ قِيَاسُهَا أَوْ رَصْدُهَا
            تَجْرِيبِيًّا؛ كَالكُتْلَةِ وَالكَثَافَةِ وَدَرَجَةِ الحَرَارَةِ
            وَالتَّوَصُّلِيَّةِ الكَهْرَبَائِيَّةِ.
      - command: add_definition
        params:
