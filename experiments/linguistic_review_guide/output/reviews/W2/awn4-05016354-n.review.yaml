# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أُولِّد هذه المرشحات بعد قراءة الملف المُقنّع فقط (قبل الاطلاع على اللمّات).
  # التعريف المُقنّع: "أي خاصية تستخدم لتوصيف المادة والطاقة وتفاعلاتهما"
  blind_candidates:
    - lemma: "خَاصِّيَّة فِيزِيَائِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي (اسم + صفة) من لفظتَيْن: «خَاصِّيَّة» الدالة على ما يختصّ
        به الشيء دون غيره، و«فِيزِيَائِيَّة» نسبة إلى الفيزياء (علم المادة
        والطاقة). المركّب يحدّد الجنس (خاصّيّة) ويُضيف الفصل النوعي
        (فيزيائية)، فيكون مصطلحاً دقيقاً مطابقاً لـ physical property.

    - lemma: "صِفَة فِيزِيَائِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «صِفَة» (من جذر وصف، تدلّ على الوصف والتوصيف) +
        «فِيزِيَائِيَّة». «الصِّفة» مرادف شائع لـ «الخاصّيّة» في السياقات
        العلمية، إلا أنها أعمّ دلالةً.

    - lemma: "سِمَة مَادِّيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «سِمَة» (من جذر وسم، أصلها العلامة المميّزة) +
        «مَادِّيَّة» نسبة إلى المادة. يُعبَّر بـ«السِّمة» في الحقل اللساني
        عن الخاصية المميّزة للشيء، وقد امتدّ استعمالها إلى الحقول العلمية.

    - lemma: "مُمَيِّز فِيزِيَائِيّ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر «م ي ز» على وزن مُفَعِّل، للدلالة على ما يقوم بالتمييز
        والتحديد. يُوحي بأنّ الخاصية الفيزيائية هي ما يُمَيَّز به الجسم
        المادي أو مصدر الطاقة عن سواه. المقصود: ما يتعرّف به على هوية الكيان
        الفيزيائي.

  assessment:
    concerns:
      - "اللمّة الموجودة «خاصية فيزيائية» خالية من التشكيل الكامل؛ تحتاج إلى ضبط: «خَاصِّيَّة فِيزِيَائِيَّة»."
      - "التعريف الحالي قريب من الترجمة الحرفية للإنجليزية، ويفتقر إلى أسلوب المعجم الوسيط (جنس قريب + فصل نوعي بالأمثلة)."
      - "المجموعة تضمّ لمّة واحدة فقط، وقد يُفيد إثراؤها بلمّة مرادفة راسخة لو ثبت وجودها في المعاجم."
    observations: >
      «خاصية فيزيائية» مصطلح تقني علمي مستقرّ، تُجمع عليه معجمات ALECSO
      في ميادين الكيمياء والفيزياء والصيدلة والهندسة، وتُوظَّف لمقابلة
      physical property. وجذر «خصص» يحمل معنى الإفراد والتمييز (خَصَّصتُ
      فلاناً بشيء أي أفردتُه به دون غيره)، مما يجعل الاشتقاق معجمياً
      سليماً. «فيزيائية» معرَّبة من اليونانية/اللاتينية عبر اللغات
      الأوروبية، وقد استقرّت في العربية المعاصرة واستوفت شروط التعريب
      (تقبل ال- والنسبة والجمع السالم). يبقى المصطلح المركّب «خاصية
      فيزيائية» الأوفر توثيقاً والأكثر تداولاً في الأدبيات العلمية العربية.


