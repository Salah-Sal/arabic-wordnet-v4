# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13475962-n
# cyanide process — عملية السيانيد
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عملية السيانيد» مركب إضافي يحتوي على لفظ معرَّب (سيانيد)؛ ينبغي التحقق من تثبيته المعجمي"
      - "المجموعة تضم لمّة واحدة فقط، والمفهوم تقني متخصص قد يستدعي مرادفات إضافية"
      - "اللمّة غير مشكّلة"
    observations: "المفهوم عملية صناعية كيميائية دقيقة تُستخدم في التعدين لاستخلاص الذهب والفضة بمحلول سيانيد الصوديوم، وهي ما يُعرف في الأدبيات الكيميائية بعملية ماكآرثر-فورست. المصطلح العربي يُتوقع أن يكون مركباً إضافياً يجمع بين لفظ عام (عملية) ولفظ معرَّب (سيانيد)، أو مصدراً صناعياً معرَّباً من الإنجليزية."
  blind_candidates:
    - lemma: "السَّيْنَدَة"
      generation_method: taarib
      justification: "تعريب لفظ cyanidation على وزن فَعْلَلَة العربي، وهو الوزن المنتج لأسماء العمليات الكيميائية (أكسدة، كبرتة، نترجة)؛ يقبل لام التعريف والاشتقاق"
    - lemma: "عَمَلِيَّةُ السَّيَانِيد"
      generation_method: tarkib
      justification: "مركب إضافي من «عملية» (جنس قريب: عملية صناعية) و«السيانيد» (فصل نوعي: المادة الكيميائية المستخدمة)؛ تركيب شائع في المصطلحات التقنية العربية"
    - lemma: "الاِسْتِخْلَاصُ بِالسَّيَانِيد"
      generation_method: tarkib
      justification: "مركب جرّي يصف العملية من حيث هدفها (استخلاص) ووسيلتها (بالسيانيد)؛ «استخلاص» مصطلح كيميائي ثابت في المعاجم الموحدة"
    - lemma: "الإِذَابَةُ السَّيَانِيدِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «الإذابة» (المرحلة الأساسية في العملية) و«السيانيدية» (نسبة إلى السيانيد)؛ يحاكي النمط الوصفي الشائع في المصطلحات الكيميائية"

stage2_evidence:
  per_lemma:
    - lemma: "عَمَلِيَّةُ السَّيَانِيد"
      confirm:
        - text: "«مادة كيميائية، سامة جدا، كثيرا ما تستخدم في صقل المعادن أو في مجال استخلاص المعادن الثمينة من خاماتها.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«(1) السِّيانيد (ك) (2) يعالج بالسِّيانيد.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«شِقٌّ حِمْضِيٌّ لملحٍ شديدِ السُّمِّيَّةِ, يذوب فى الماءِ, يُستخدم فى مبيدات الحشرات والطلاء بالكهرباء»"
          source: "المعجم الكبير"
          addition: "يوسّع مجالات استخدام السيانيد خارج التعدين"
        - text: "«أحد مركبات السيانوجين ثنائية التكافؤ، ومن أمثلته سيانيد الزئبقيك وهو ملح شديد السمية.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "يوضح الطبيعة الكيميائية للسيانيد"

    - lemma: "السَّيْنَدَة"
      evidence_status: "no_material_found"

    - lemma: "الاِسْتِخْلَاصُ بِالسَّيَانِيد"
      expands:
        - text: "«عملية الحصول على المستخلص»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يثبت «استخلاص» مصطلحاً كيميائياً موحداً بمعنى extraction"

    - lemma: "الإِذَابَةُ السَّيَانِيدِيَّة"
      expands:
        - text: "«إذابة — solubilization»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "يثبت «إذابة» مصطلحاً لكنه بمعنى الإذابة العامة لا العملية التعدينية المخصوصة"

stage3_analysis:
  per_lemma:
    - lemma: "عَمَلِيَّةُ السَّيَانِيد"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت يجمع بين الجنس القريب (عملية) والمادة المميِّزة (السيانيد). السيانيد لفظ معرَّب مثبت في المعاجم الموحدة والمعجم الكبير. التركيب يطابق النمط المصطلحي العربي في تسمية العمليات الصناعية (عملية التقطير، عملية التكرير). لا يوجد بديل عربي صرف مسكوك لهذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّةُ السَّيَانِيد"

    - lemma: "السَّيْنَدَة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي يثبت هذا اللفظ. التعريب على وزن فَعْلَلَة ممكن نظرياً لكنه غير مسكوك ولا مستعمل في الأدبيات الكيميائية العربية المتاحة، خلافاً لنظائره المثبتة (أكسدة، نترجة)."

    - lemma: "الاِسْتِخْلَاصُ بِالسَّيَانِيد"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة لا مصطلح مسكوك. يمكن إبدال «الاستخلاص» بـ«الاستخراج» أو «الفصل» مع بقاء العبارة صالحة وصفياً، مما يفشل اختبار السكّ. كذلك هو أعم من المفهوم المستهدف إذ يشمل أي استخلاص بالسيانيد لا العملية الصناعية المحددة."

    - lemma: "الإِذَابَةُ السَّيَانِيدِيَّة"
      source: stage1
      decision: removed
      decision_reason: "«الإذابة» مصطلح عام بمعنى solubilization، والعملية المستهدفة ليست إذابةً بالمعنى الكيميائي الدقيق بل رشح/غسل كيميائي (leaching). التركيب الوصفي غير مسكوك ولا مستعمل في الأدبيات التعدينية."

stage4_content:
  definition:
    current: "عملية صناعية لاستخراج الذهب والفضة عن طريق معالجة الخام بمحلول سيانيد الصوديوم"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول في مضمونه لكنه يفتقر إلى الدقة المصطلحية: لا يذكر آلية العمل (الإذابة الانتقائية) ولا السياق التعدينيّ الذي يميّز هذه العملية. يمكن تحسينه بأسلوب المعجم الوسيط."
    authored:
      - type: terminological
        text: "طريقةٌ تعدينيّةٌ لاستخلاص الذهب والفضّة، تقوم على إذابة الفلزّات النفيسة من خاماتها بمحلول مخفَّف من سيانيد الصوديوم ثمّ ترسيبها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "طريقةٌ تعدينيّةٌ لاستخلاص الذهب والفضّة، تقوم على إذابة الفلزّات النفيسة من خاماتها بمحلول مخفَّف من سيانيد الصوديوم ثمّ ترسيبها."

  examples:
    per_lemma:
