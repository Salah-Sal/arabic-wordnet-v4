        examples:
          - text: "تُعَدّ عمليّة السيانيد الأسلوب الأكثر شيوعاً في مناجم الذهب حول العالم منذ أواخر القرن التاسع عشر."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
