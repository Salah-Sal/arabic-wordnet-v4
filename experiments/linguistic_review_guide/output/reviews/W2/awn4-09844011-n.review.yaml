step0_evidence:
  per_lemma:
    - lemma: "سلطة"
      confirm:
        - text: "«السَّيْطرة والتحكُّم. ذوو السَّيطرة والتحكُّم. (فى علم الاجتماع): القُدرة القانونية أو المجتمعية على مُمَارسة نفوذٍ على فرد أو جماعة»"
          source: "المعجم الكبير"
    - lemma: "مسؤول"
      expands:
        - text: "«مَنْ يُناطُ به عملٌ تقع عليه تَبِعَتُه»"
          source: "المعجم الكبير"
        - text: "«من رجال الدولة: المنوط به عمل تقع عليه تبعته. ( محدثة )»"
          source: "المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "سلطات"
      source_section: "step5_english_bridge"
      evidence_citation: "«تعرف السلطات العمومية بأنها الهيئات الحكومية على جميع المستويات» — مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      justification: "صيغة الجمع من سلطة، وتستخدم عادة في السياقات الإدارية للتعبير عن الهيئات التي تمارس السيطرة (مثل السلطات المحلية، السلطات المختصة)، وهذا يطابق القيد في التعريف الإنجليزي (usually plural)."
  knowledge_candidates:
    - lemma: "أولو الأمر"
      justification: "تركيب إضافي. تعبير تراثي إسلامي ومصطلح مستقر يشير إلى أصحاب السيطرة والقيادة والمسؤولين عن إدارة شؤون الآخرين وإصدار القرارات."
  generation_notes: "صيغة الجمع (سلطات، مسؤولون) هي الغالبة في الاستعمال الفعلي للتعبير عن الهيئة الإدارية كما ينص تعريف المجموعة، ولكن يُكتفى بإدراج المفرد في المعاجم القياسية."

step1_lemma_validation:
  per_lemma:
    - lemma: "سلطة"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر للتعبير عن الكيان الاعتباري أو الأفراد ذوي السيطرة والتحكم الإداري."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تشير إلى الكيان الاعتباري الذي يملك حق إصدار الأوامر، وتُطلق مجازاً مرسلاً على الأشخاص الممارسين لذلك الدور."
      example: "فرضت السلطة الحاكمة قوانين جديدة لتنظيم السير."

    - lemma: "مسؤول"
      decision: confirmed
      decision_reason: "كلمة فصيحة مستعملة بكثرة، تدل على الشخص الذي يتحمل أعباء الإدارة، وتستخدم بصيغة الجمع للدلالة على الهيئة."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الفرد المفرد الذي يُناط به عمل إداري ويُسأل عنه أمام جهة أعلى."
      example: "أصدر المسؤولون قرارات حاسمة لترشيد الإنفاق."

    - lemma: "أولو الأمر"
      source: step05
      decision: confirmed
      decision_reason: "تعبير تراثي فصيح ومصطلح مسكوك مستقر يعبر بدقة عن دلالة المجموعة."
      step05_citation: "من التراث الإسلامي والقرآن الكريم."
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير تراثي يُستعمل للإشارة إلى الحكام والأمراء والعلماء الموكلين بإدارة الشؤون العامة."
      example: "تجب طاعة أولي الأمر في كل ما يحفظ استقرار المجتمع."
      actions:
        - command: create_entry
          params:
            lemma: "أولو الأمر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09844011-n"

    - lemma: "سلطات"
      source: step05
      decision: removed
      decision_reason: "هي صيغة الجمع للّمّة المؤكدة (سلطة)، ولا داعي لإدراج الجمع كشكل مستقل في الشبكة الدلالية حيث يُكتفى بالمفرد."
      step05_citation: "«تعرف السلطات العمومية بأنها الهيئات الحكومية على جميع المستويات» — مسرد المناخ والبيئة"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "أولو الأمر"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

