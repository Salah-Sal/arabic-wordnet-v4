# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # التقييم بعد الاطّلاع على الملف الكامل
  assessment:
    concerns:
      - "اللمّتان الموجودتان (وضع، ولادة) خاليتان من التشكيل — يجب تصحيحهما"
      - "التعريف العربي الحالي «عملية الولادة» دائريٌّ: يستعمل «ولادة» وهي من لمّات المجموعة ذاتها"
      - "لمّة «وضع» بالغة التعدّد الدلالي (وضع فلسفي، وضع جسدي، وضع لغوي، وضع الولادة...) وقد تسبّب خلطاً"
    observations: >
      المجموعة تُعبّر عن المفهوم البيولوجي لعملية إخراج الجنين من رحم أمّه (parturition).
      «وِلادَة» هي المصطلح العربي الراسخ لهذا المفهوم في المعاجم الطبية والعامة.
      «وَضْع» مستعمل في اللغة الكلاسيكية بمعنى الولادة («وضعت المرأة ولدها»)، غير أنّه مشترك
      لفظي مع معانٍ فلسفية وهندسية وغيرها كثيرة. الفعل الأعلى في التراتب المفهومي (hypernym)
      هو «عملية بيولوجية» — وهذا صحيح وملائم.

  # المرشحات المُولَّدة أعمى (قبل الاطّلاع على اللمّات الموجودة)
  blind_candidates:
    - lemma: "نِتَاج"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل «نَتَجَ» على وزن فِعَال، يدلّ على حدث إخراج المولود. استعمله العرب
        للدلالة على عملية الوضع في الحيوانات؛ يُنظر فيه لتعميمه ليشمل الإنسان.
    - lemma: "مَخَاض"
      generation_method: majaz
      justification: >
        أصله الاضطراب والتمخّض (اضطراب شيء مائع في وعائه)، ثم نُقل مجازاً بتشابه وظيفي
        إلى اضطراب الجنين وانقباضات الرحم التي تعقبها الولادة. ورد في القرآن الكريم:
        ﴿فَأَجَاءَهَا الْمَخَاضُ إِلَى جِذْعِ النَّخْلَةِ﴾. يُستعمل في المعاجم الطبية للدلالة على parturition.
    - lemma: "إِنْجَاب"
      generation_method: ishtiqaq
      justification: >
        مصدر الرباعي «أَنْجَبَ» من جذر «ن ج ب» على وزن إِفْعَال؛ يدلّ على إتيان المرأة
        بمولود نجيب، ثم توسّع ليشمل الإتيان بالمولود مطلقاً.
    - lemma: "تَوَلُّد"
      generation_method: ishtiqaq
      justification: >
        مصدر «تَوَلَّدَ» على وزن تَفَعُّل من جذر «ول د»؛ يدلّ على الحصول على المولود
        عبر عملية تدريجية. الوزن تَفَعُّل يُفيد التدرّج والانبثاق عن شيء.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
