# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "وضع"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في مقاييس اللغة لابن فارس بصريح العبارة «وَضَعَتِ الْمَرْأَةُ وَلَدَهَا»،
        وفي كتب الفرق والتعريفات، وفي المعاجم الطبية المعاصرة بوصفها مرادفاً لـ «parturition».
        غير أنّها مُشترك لفظي واسع؛ فاستعمالها في هذا السياق يقتضي التشكيلَ الكاملَ والسياقَ الضابط.
        تُعالَج بتصحيح التشكيل إلى وَضْع.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الفعل المادي للإخراج والإنزال (فَعَلَتِ الأمُّ)، ذو طابع كلاسيكي حسّي؛
        يُفيد اللحظة الفعلية لوضع الجنين لا العملية الزمنية الممتدة.
        تمييزاً عن وِلادَة: التي تشمل العملية برمّتها، وعن مَخَاض: الذي يُشدّد على الطَّلْق السابق للوضع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَضْع"

    - lemma: "ولادة"
      decision: confirmed
      decision_reason: >
        المصطلح الأشمل والأدقّ والأوسع انتشاراً في المعاجم الطبية العربية المعاصرة والكلاسيكية
        لعملية الولادة (parturition). أدلّة المعاجم ساحقة في تأييده. يُصحَّح تشكيله إلى وِلادَة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الجامع الذي يُعبّر عن العملية في مجملها من بدء المخاض حتى اكتمال خروج المولود
        والمشيمة؛ هو المقابل الأدقّ لـ «parturition» بمعناه التقني. أعمّ من وَضْع (الذي يُركّز
        على الإخراج الجسدي) وأشمل من مَخَاض (الذي يُشدّد على الطَّلْق).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِلادَة"

    - lemma: "مَخَاض"
      source: stage1
      decision: confirmed
      decision_reason: >
        رغم أن الأصل اللغوي لمخاض هو «وجع الولادة — الطَّلْق»، فإن المعاجم الطبية المعاصرة
        المتعددة تُسوّيه بـ «parturition» و«childbirth» (المورد الحديث، المعجم الطبي الموحد).
        ورد في القرآن الكريم للدلالة على حدث الولادة كاملاً. يُضاف كلمّة ثانوية مع توثيق
        الفارق الدلالي (التشديد على الطَّلْق وما يصاحب الولادة من اضطراب).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُشدّد على البُعد التجرُّبي والإحساسي للولادة — الانقباضات والطَّلْق والاضطراب الجسدي —
        ويُستعمل مجازاً للعملية كاملة في السياق الطبي والقرآني. يختلف عن وِلادَة (المصطلح المحايد
        الشامل) وعن وَضْع (الذي يُركّز على فعل الإخراج).
      actions:
        - command: create_entry
          params:
            lemma: "مَخَاض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13554089-n"

    - lemma: "نِتَاج"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم تقصره على ما تضعه البهائم دون الإنسان (التعريفات الفقهية للبركتي)، ومقاييس اللغة
        يذكره في سياق الناقة فقط. استعماله للإنسان مخالف للاصطلاح العربي الراسخ.

    - lemma: "إِنْجَاب"
      source: stage1
      decision: removed
      decision_reason: >
        إنجاب أشمل دلالةً من parturition؛ هو يعني procreation (التناسل والإتيان بالأبناء)
        وليس عملية الوضع بحدّ ذاتها. كما أن الجذر «نجب» في المقاييس مرتبط بالنجابة والكرم
        لا بفعل الإخراج. لا يُطابق مفهوم المجموعة.

    - lemma: "تَوَلُّد"
      source: stage1
      decision: removed
      decision_reason: >
        تولّد في المعاجم العربية يدلّ على التوليد التلقائي (الكيان بلا أبوين — spontaneous generation)
        وعلى الانبثاق والنشأة عن شيء («نشأ عنه»)، لا على عملية الولادة البيولوجية من أمّ.
        تناقض تامّ مع مفهوم المجموعة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "عملية الولادة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دائريٌّ: يستعمل «ولادة» في تعريف مجموعة ترادفية تضمّ «ولادة» نفسها.
        فضلاً عن ذلك، فهو مجرّد ترجمة صريحة للتعريف الإنجليزي «the process of giving birth»
        دون إضافة جنس قريب أو فصل نوعي يُميّزها. يجب صياغة تعريف مصطلحي ولغوي بديلين.
    authored:
      - type: terminological
        text: >
          حَدَثٌ بيولوجيٌّ تُخرج فيه الأمُّ جنينَها ومشيمتَه من رحمها بانقباضات رحمية متصاعدة
          تُسمّى الطَّلْق، مُنهيةً بذلك دورةَ الحمل
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "خروجُ الجنين من بطن أمّه عند اكتمال الحمل وانتهاء مدّته"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13554089-n"
          definition_index: 0
          text: "حَدَثٌ بيولوجيٌّ تُخرج فيه الأمُّ جنينَها ومشيمتَه من رحمها بانقباضات رحمية متصاعدة تُسمّى الطَّلْق، مُنهيةً بذلك دورةَ الحمل"
      - command: add_definition
        params:
          synset_id: "awn4-13554089-n"
          text: "خروجُ الجنين من بطن أمّه عند اكتمال الحمل وانتهاء مدّته"

  examples:
    per_lemma:
