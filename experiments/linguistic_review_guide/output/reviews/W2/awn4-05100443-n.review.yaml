        التعريف الحالي مختصر وصحيح لكنه يفتقر إلى الصيغة المصطلحية الدقيقة.
        ينبغي إضافة الجنس القريب (نوع من الاحتمال) والفصل النوعي (تحقّق حدثين في آن واحد)
        مع الإشارة إلى الرمز الرياضي.
    authored:
      - type: terminological
        text: "مقدارٌ إحصائيٌّ يُعبِّرُ عن أرجحيّةِ تحقُّقِ حَدَثَيْنِ أو أكثرَ في آنٍ واحدٍ، ويُرمَزُ له بـ P(A∩B)."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "الاحتمالُ المشتركُ: احتمالُ وقوعِ حدثينِ معاً في تجربةٍ عشوائيّةٍ واحدةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
