# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-05100443-n — joint probability
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «احتمال مشترك» بدون تشكيل كامل"
      - "المجموعة تحتوي على لمّة واحدة فقط، والمفهوم الإحصائي قد يُعبَّر عنه بصيغ أخرى"
    observations: >-
      المجموعة تمثّل مفهوماً إحصائياً متخصصاً (joint probability)، وهو نوع فرعي
      من «الاحتمال» (hypernym). التعريف العربي واضح ومختصر. النمط «احتمال + صفة»
      شائع في المعجمية العلمية العربية (احتمال مشروط، احتمال تجريبي، احتمال رياضي).
      المفهوم يقع في حقل نظرية الاحتمالات والإحصاء.
  blind_candidates:
    - lemma: "اِحْتِمَالٌ مُشْتَرَكٌ"
      generation_method: tarkib
      justification: >-
        مركب وصفي على نمط «احتمال + صفة» المُنتِج في المصطلحية الرياضية العربية.
        «مشترك» من جذر شرك يدلّ على المقارنة وخلاف الانفراد، فيناسب معنى الوقوع المشترك لحدثين.
    - lemma: "اِحْتِمَالٌ تَقَاطُعِيٌّ"
      generation_method: tarkib
      justification: >-
        مركب وصفي مبني على النسبة إلى «تقاطُع»، لأن الاحتمال المشترك يناظر
        رياضياً تقاطع حدثين (P(A∩B)). المصطلح يربط المفهوم بنظرية المجموعات.
    - lemma: "اِحْتِمَالٌ تَلَازُمِيٌّ"
      generation_method: tarkib
      justification: >-
        مركب وصفي منسوب إلى «تلازم» (تفاعُل من لزم)، يدلّ على وقوع حدثين معاً
        بالضرورة أو بالترافق. يُبرز جانب الاقتران الزمني أو المنطقي بين الحدثين.
    - lemma: "اِحْتِمَالُ الِاقْتِرَانِ"
      generation_method: tarkib
      justification: >-
        مركب إضافي «احتمال الاقتران» من جذر قرن (المقارنة والمصاحبة)،
        يدلّ مباشرة على اقتران حدثين أي وقوعهما معاً.

stage2_evidence:
  per_lemma:
    - lemma: "اِحْتِمَالٌ مُشْتَرَكٌ"
      confirm:
        - text: "«احتمال» = probability — أعلى قيمة ممكنة تعبر عن التواتر النسبي للحدث عند تكرار تجربة عشوائية لعدد لا نهائي من المرات."
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
        - text: "«احتمال» = probability — عدد حقيقي بين 0 و 1 يدل على احتمال حدوث حدث معين من بين حالات أحداث ذات الصلة."
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«مشترَك» = joint / commun"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«مشترك» = common / commun"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«احتمال» = probability — رقم يمثل فرصة حدوث حدث معين."
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
      expands:
        - text: "«(الْمُشْتَرَك) رجل مُشْتَرك مهموم يحدث نَفسه وَلَفظ مُشْتَرك لَهُ أَكثر من معنى وَمَال أَو أَمر مُشْتَرك لَك ولغيرك فِيهِ حِصَّة»"
          source: "المعجم الوسيط"
          addition: "يؤكد أنّ «مشترك» بمعنى «لك ولغيرك فيه حصة»، وهو المعنى المقصود في المركب"
        - text: "«الاحتمال: ما لا يكون تصور طرفيه كافيًا، بل يتردد الذهن في النسبة بينهما، ويراد به الإمكان الذهني.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "المعنى الكلاسيكي للاحتمال يدلّ على الإمكان الذهني، وقد تطوّر إلى الدلالة الرياضية الحديثة"
        - text: "«احتمال وقوع حدث ما هو خارج قسمة النتائج المُناسبة على المجموع الكلي للنتائج.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          addition: "تعريف رياضي دقيق للاحتمال يكمّل الفهم العام"

    - lemma: "اِحْتِمَالٌ تَقَاطُعِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "اِحْتِمَالٌ تَلَازُمِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "اِحْتِمَالُ الِاقْتِرَانِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "اِحْتِمَالٌ مُشْتَرَكٌ"
      decision: confirmed
      decision_reason: >-
        مركب وصفي ثابت يتّبع النمط المعجمي المُنتِج «احتمال + صفة» المُستعمل في المعاجم العلمية العربية
        (احتمال مشروط، احتمال تجريبي، احتمال رياضي، احتمال شرطي، احتمال سابق، احتمال لاحق).
        كلا المكوّنين موثقان في معاجم متعددة: «احتمال» بمعنى probability في أكثر من 15 معجماً متخصصاً،
        و«مشترك» بمعنى joint/common في معجم القانون والرياضيات. المصطلح شائع في الأدبيات الإحصائية العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِحْتِمَالٌ مُشْتَرَكٌ"

    - lemma: "اِحْتِمَالٌ تَقَاطُعِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا دليل معجمي على استعمال هذا المركب. وإن كان المفهوم الرياضي مرتبطاً بالتقاطع (∩)،
        إلا أنّ المصطلح لم يُسكّ ولم يثبت في الاستعمال. «احتمال مشترك» هو المصطلح المعتمد.

    - lemma: "اِحْتِمَالٌ تَلَازُمِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا دليل معجمي. التلازم يوحي بعلاقة سببية أو ضرورية بين الحدثين، بينما الاحتمال المشترك
        لا يشترط ذلك. المصطلح قد يُلبِس بمعنى الارتباط السببي.

    - lemma: "اِحْتِمَالُ الِاقْتِرَانِ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا دليل معجمي على سكّه. المركب الإضافي أطول من المركب الوصفي المعتمد ولا يضيف
        دقة دلالية. «احتمال مشترك» أيسر تداولاً وأكثر شيوعاً.

