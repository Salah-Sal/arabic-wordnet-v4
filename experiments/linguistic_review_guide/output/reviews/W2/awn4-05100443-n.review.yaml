      - lemma: "اِحْتِمَالٌ مُشْتَرَكٌ"
        examples:
          - text: "يُحسَبُ الاحتمالُ المشتركُ لنجاحِ الطالبِ في الرياضياتِ والفيزياءِ بضربِ احتمالِ نجاحِه في كلٍّ منهما إذا كانَ الحدثانِ مستقلَّيْن."
