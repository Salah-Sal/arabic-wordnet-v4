        كما أنه ترجمة حرفية للتعريف الإنجليزي، لا تعريف مصطلحي بأسلوب المعجم العربي.
        يحتاج إلى صياغة تُبيّن الجنس القريب (خاصية/وصف) والفصل النوعي (التعلّق
        بالموضوع المطروح) دون استخدام لمّات المجموعة.
