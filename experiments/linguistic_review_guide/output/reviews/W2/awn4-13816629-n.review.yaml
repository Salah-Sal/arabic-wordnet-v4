stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «علاقة شيء ما بالموضوع المطروح» يستخدم لفظة «عَلَاقَة» وهي إحدى لمّات المجموعة نفسها، مما يُفضي إلى دوران جزئي"
      - "لمّة عَلَاقَة أعمّ من المفهوم المقصود (الارتباط بالموضوع تحديداً)؛ فهي تُستعمل لكل ضرب من ضروب الترابط (الشخصي والمنطقي والرياضي وغيره)، لا للارتباط الموضوعي وحده"
      - "تفتقر المجموعة إلى لمّة تعكس خاصّية الملاءمة التداولية (مفهوم relevance في نظرية التواصل)"
    observations: >
      المجموعة تقابل المفهوم الإنجليزي relevance/relevancy بمعنى «خاصية الشيء الذي يتصل
      بالموضوع المطروح». اللمّتان الموجودتان (صِلَة وعَلَاقَة) كلتاهما تنتميان إلى الحقل الدلالي
      للربط والاتصال، وهما مقبولتان من حيث التوارد العلمي، غير أن صِلَة أقرب إلى خصوصية
      المفهوم المقصود في العربية المعاصرة (يُقال: «وثيق الصِّلة بالموضوع»)، في حين تظل
      عَلَاقَة ذات دلالة أعمّ. لا يوجد في المعاجم الكلاسيكية مصطلح مسكوك منفرد يقابل relevance
      تحديداً؛ إذ يُعبَّر عنه في المعاجم الثنائية بعبارة «وثاقة الصِّلة [بالموضوع]».
  blind_candidates:
    - lemma: "تَعَلُّقٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر تَعَلَّقَ (جذر علق) على وزن تَفَعُّل، يدلّ على الارتباط والاتصال بشيء ما.
        يُقال: «لهذا الأمر تَعَلُّقٌ بالموضوع» أي أنه يتصل به ويمسّه، فهو يعكس
        خاصية كون الشيء مرتبطاً بالموضوع المطروح.
    - lemma: "مَسَاسٌ"
      generation_method: majaz
      justification: >
        مصدر مَسَّ يَمُسُّ (جذر مسس) بمعنى اللمس، وُظِّف مجازاً في التعبير عن الصِّلة
        بالموضوع؛ يُقال: «لهذه المعلومة مَسَاسٌ بالقضية» أو «ذو مَسَاسٍ بالأمر».
        الإزاحة الدلالية من اللمس الحسّي إلى الاتصال المعنوي بالموضوع.
    - lemma: "مُنَاسَبَةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر ناسَبَ (جذر نسب) على وزن مُفَاعَلَة، ومعناه الموافقة والملاءمة. يُستخدم في
        كلام المتكلّمين والأصوليين للدلالة على الملاءمة بين الوصف والحكم. يعكس جانب
        «كون الشيء مناسباً/ملائماً للموضوع المطروح».
    - lemma: "إِنَاطَةٌ"
      generation_method: majaz
      justification: >
        مصدر أَنَاطَ يُنِيط (جذر نوط) بمعنى علّق الأمر بشيء وربطه به، ويُقال: «أُنِيط
        هذا الحكم بذلك الوصف». بالإزاحة الدلالية يمكن أن تعني ارتباط الشيء بالموضوع
        ومناطه، مما يقابل relevance من حيث «تعليق الشيء بالمسألة المطروحة».


stage2_evidence:
  per_lemma:

    - lemma: "صِلَة"
      confirm:
        - text: >
            «الصّلة: [في الانكليزية] Relation, contact, conjunction
            [في الفرنسية] Relation, rapport, conjonction
            بكسر الصاد في اللغة الفارسية بمعنى: الاتصال، والوصل، والقرابة...»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: >
            «صلة: affinity»
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
          addition: >
            يُستخدم في المعاجم الاجتماعية بمعنى القرابة/الصلة، وهو أقرب من عَلَاقَة
            لمفهوم الارتباط الخاص (affinity/relevance).
        - text: >
            «الصِّلَةُ: العطيَّةُ الجائزة، الحرفُ الذى بَعْد الروِىِّ فى قافية البيت ويسمى: الوَصْل أيضاً»
          source: "المعجم الوسيط (OCR)"
          addition: >
            الجذر وصل يدلّ على الضمّ والاتصال (مقاييس اللغة: «ضمّ شيء إلى شيء حتى يَعْلَقه»)؛
            فصِلَة مشتقّة من الوصل والاتحاد، مما يدعم توظيفها للدلالة على الارتباط بالموضوع.
      contradicts:
        - text: >
            «الصلة: البر على غير جهة التعويض»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            المناوي يقصر صِلَة على معنى «العطاء/البرّ»، وهو المعنى الأصلي الراسخ في
            المعاجم الكلاسيكية، مما يعني أن استخدامها بمعنى relevance هو توسّع حديث.

    - lemma: "عَلَاقَة"
      confirm:
        - text: >
            «العلاقة: [في الانكليزية] Relation, relationship, link
            [في الفرنسية] Relation, rapport, lien
            بالفتح رابطة — ربط معنى بمعنى آخر»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: >
            «العلاقة: بكسر العين يستعمل في المحسوسات، وبالفتح في المعاني أيضاً؛
            العلاقة بالفتح تستعمل في المعقولات»
          source: "دستور العلماء للأحمدنكري"
        - text: >
            «العلاقة: شيء يستصحب الأول الثاني كالعلية والتضايف»
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: >
            «علاقة: relation» (مجالات: الهندسة المدنية، المعلوماتية، اللسانيات، الرياضيات، الفلسفة، علم النفس، الطب)
          source: "معاجم ARABTERM المتعددة"
      expands:
        - text: >
            «(فى علم البيان): المناسبة بين المعنى الأصلى والمعنى المراد فى المجاز والكناية»
          source: "المعجم الوسيط (OCR)"
          addition: >
            في علم البيان عَلاقَة تعني تحديداً «الصلة بين المعنيَيْن»، مما يدعم استخدامها
            للدلالة على الارتباط الدلالي وبالتالي على relevance.
      contradicts:
        - text: >
            «العِلاقَة: ما يُعلَّق به السيف ونحوه»
          source: "المعجم الوسيط (OCR)"
          conflict: >
            الصيغة بالكسر (عِلاقَة) تخصّ الأشياء الحسّية (حامل السيف ونحوه)؛ بينما
            الصيغة المطلوبة بالفتح (عَلاقَة) هي الصحيحة للمعاني المجرّدة وقد وردت
            متمايزة في المعاجم الكلاسيكية.

    - lemma: "تَعَلُّقٌ"
      confirm:
        - text: >
            «التعلّق: [في الانكليزية] Connection, relationship
            [في الفرنسية] Rapport, relation
            هو عند أهل العربية نسبة الفعل إلى غير الفاعل»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: >
            «التَّعَلُّق: ربط شيء بشيء»
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: >
            «تعلّق: dependence = dependency — حالة نفسية يحتاج فيها المدمن إلى زيادة
            جرعة ما يتعاطاه من مواد مخدرة كي يتلافى أعراض الانقطاع»
          source: "معجم المصطلحات الطبية ج.2 (2003) (ARABTERM)"
          conflict: >
            في اللغة المتخصصة المعاصرة، استُهلك تَعَلُّق لمعنى الإدمان/الاعتماد النفسي،
            مما يُحدث اشتراكاً لفظياً يُعيق استخدامه مصطلحاً لـrelevance.

    - lemma: "مُنَاسَبَةٌ"
      confirm:
        - text: >
            «المُنَاسبة: عند الأصوليين من الحنفيّة هي الملاءمة، يعني موافقة الوصف أي
            العلة للحكم بأن تصحَّ إضافةُ الحكم إليه»
          source: "التعريفات الفقهيّة للبركتي"
      contradicts:
        - text: >
            «المناسبة: [في الانكليزية] Convenience, agreement, harmony
            [في الفرنسية] Convenance, accord, harmonie
            هي عند المتكلّمين والحكماء الاتحاد في النسبة وتسمّى تناسباً»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            مُنَاسَبَة في الاستعمال المعاصر تعني «مناسبة/فرصة» (occasion) بالدرجة الأولى،
            وثقلها في المعاجم الكلاسيكية «الاتحاد في النسبة» لا يقابل relevance مباشرةً.

    - lemma: "مَسَاسٌ"
      evidence_status: "no_material_found"

    - lemma: "إِنَاطَةٌ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:

    - lemma: "صِلَة"
      decision: confirmed
      decision_reason: >
        اللمّة مدعومة من المعاجم الاصطلاحية (التهانوي: Relation, rapport)، وجذرها (وصل)
        يحمل معنى الضمّ والاتصال المطابق للمفهوم. كما أن العربية المعاصرة ترسّخ هذه
        الدلالة في تعابير ثابتة مثل «وثيق الصِّلة بالموضوع» و«ذو صِلَة بالقضية»،
        مما يجعلها المصطلح الأنسب لـrelevance ضمن هذه المجموعة.
      evidence_assessment:
        case: mixed
      morphological_check:
        weight: "فِعْلَة (من وصل)"
        comment: >
          صِلَة على وزن فِعْلَة تدلّ على الحدث أو نتيجته، وهو مناسب لاسم المصدر
          الذي يحمل معنى خاصية الاتصال.
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صِلَة تُوظَّف في العربية خصيصاً للتعبير عن ارتباط الشيء بالموضوع المطروح
        («وثيق الصِّلة بالموضوع»)، وهي أخصّ دلالةً من عَلَاقَة وأقرب إلى مفهوم
        relevance؛ إذ لا تشمل عادةً الروابط الشخصية أو الرياضية أو البلاغية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صِلَة"

    - lemma: "عَلَاقَة"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة بكثافة في المعاجم الكلاسيكية والمعاصرة لمعنى «الرابطة المعنوية»
        (بالفتح للمعاني حسب الأحمدنكري والجرجاني)، وتشيع في المصطلحية العربية الحديثة
        كمقابل لـrelation. رغم عموميّتها، فإن السياق التعريفي للمجموعة («بالموضوع
        المطروح») يُخصّصها، فتبقى لمّة مقبولة ثانوية بجانب صِلَة.
      evidence_assessment:
        case: mixed
      morphological_check:
        weight: "فَعَالَة (بالفتح للمعنويات)"
        comment: >
          الضبط الصحيح بالفتح (عَلاقَة) للمعاني المجردة ثابت في المعاجم الكلاسيكية؛
          اللمّة الموجودة مضبوطة بالفتح وهو صواب.
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        عَلَاقَة أعمّ دلالةً من صِلَة؛ تشمل كل ضرب من ضروب الترابط (الشخصي والعلّي
        والمنطقي والرياضي والبلاغي)، ولا تقتصر على الارتباط بالموضوع المطروح. في
        المجموعة الحالية تُستخدم بمعناها المعنوي/المجرد فقط (عَلَاقَة بالفتح).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَلَاقَة"

    - lemma: "تَعَلُّقٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن التعلُّق يحمل في المعاجم الكلاسيكية معنى «ربط شيء بشيء»، فإن المعاجم
        المتخصصة الحديثة (ARABTERM الطبية) استهلكته لمعنى «الإدمان/الاعتماد النفسي»
        (dependence)، مما يُفضي إلى اشتراك لفظي حادّ يحول دون استخدامه مصطلحاً
        لـrelevance. اختبار الاستبدال يفشل في السياقات الطبية والنفسية.

    - lemma: "مُنَاسَبَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        مُنَاسَبَة ثقيلة الحمل الدلالي بمعنى «فرصة/مناسبة» (occasion) في العربية
        المعاصرة، إضافة إلى استخداماتها الأصولية والكلامية التقنية. لا يمكن تبرير
        سكّها مصطلحاً لـrelevance دون الإيقاع في الالتباس. اختبار السكّ يفشل: «هذا
        الأمر له مُنَاسَبَة بالموضوع» غير مقبول في الاستعمال الفصيح.

    - lemma: "مَسَاسٌ"
      source: stage1
      decision: removed
      decision_reason: >
        مَسَاس في المعاجم أمرٌ بالمسّ أو اسم للمسّ الحسّي، ولم يُثبَت له استخدام
        اصطلاحي مسكوك كاسم مفرد لخاصية relevance. يُقبل في العبارة الاصطلاحية
        الثابتة «ذو مَسَاسٍ بـ» لكنه ليس مصطلحاً مستقلاً. لا أدلة مباشرة.

    - lemma: "إِنَاطَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر على أدلة معجمية تدعم إِنَاطَة بمعنى relevance في قاعدة البيانات.
        والمعنى الراسخ لإِنَاطَة هو «تكليف» أو «ربط حكم بوصف» في الفقه والإدارة،
        لا الدلالة على خاصية الارتباط بالموضوع.


stage4_content:
