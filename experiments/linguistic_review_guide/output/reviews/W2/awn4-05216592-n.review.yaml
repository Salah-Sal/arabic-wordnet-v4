# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-05216592-n
# ili       : i64343
# pos       : n
# المعنى   : the quality of being infinite; without bound or limit
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتَيْن خاليتان من التشكيل الكامل الإلزامي."
      - "صيغتا «لا محدودية» و«لا نهائية» مركّبتان من أداة النفي (لا) + اسم مجرّد؛ لم تَرِدَا بهذه الصياغة الحرفية في أي معجم مُفهرَس في قاعدة البيانات."
      - "اللمّة «لا نهائية» تشتمل على «نهائية» المشتقة مباشرةً من «نهائياً» في التعريف — وهو ما يُوحي بدورية جزئية."
      - "التعريف الحالي يستخدم «لا نهائياً» لتعريف «لا نهائية» — دور في الصياغة."
    observations: >
      المفهوم الذي يُعالجه هذا المجموعة الترادفية — صفة انعدام الحدِّ والنهاية — راسخٌ في الفكر
      العربي الإسلامي منذ عصر الكلام والفلسفة؛ عالجه ابن سينا والغزالي والتهانوي بمصطلح «عدم
      التناهي» و«اللا متناهي». وفي المصطلحية الحديثة يشيع «لانهاية» و«لامتناهٍ» و«لا تناهٍ».
      أما الصيغتان الحاليّتان في AWN4 فتمثّلان النمط الإنتاجي الحديث (لا + مصدر صناعي)، وهو نمط
      مقبول غير أنه يفتقر إلى التوثيق المعجمي الكلاسيكي.

  blind_candidates:
    - lemma: "إِطْلاقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي (-يّة) من الصفة «مُطْلَق» التي تعني «غير مقيَّد ولا محدود»؛ الجذر طلق بمعنى
        التخلية والإرسال (مقاييس اللغة). إطلاقية = خاصية كون الشيء مطلقاً لا حدَّ له.
    - lemma: "عَدَمُ التَّنَاهِي"
      generation_method: tarkib
      justification: >
        مركّب إضافي كلاسيكي: عدم (انتفاء الشيء) + التناهي (الانتهاء إلى غاية). مصطلح راسخ في
        علم الكلام والفلسفة الإسلامية والرياضيات؛ يُعبِّر بدقة عن «غياب التناهي = اللانهائية».
    - lemma: "سَرَمَدِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «سَرْمَد» بمعنى الدائم المتصل؛ وهو على وزن فَعْلَل. السرمدية تُفيد
        استمرار الشيء دون انقطاع أو نهاية — وهو وجه من وجوه اللانهائية الزمنية.
    - lemma: "رَحَابَة"
      generation_method: majaz
      justification: >
        من رَحُبَ يَرْحُب رَحَابَةً؛ الأصل «السعة». إزاحة دلالية من «الاتساع الفيزيائي» إلى
        «اللامحدودية»؛ استنادًا إلى الاستخدام القرآني «رَحُبَتْ» ومعنى الوسع الذي لا حدَّ له.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "لا محدودية"
      evidence_status: "no_material_found"
      # لم يُعثَر على مدخل معجمي بهذه الصيغة الحرفية ولا بصيغة «لامحدودية»
      # في أي من المصادر الثلاثة: OCR / Hawramani / ARABTERM.

    - lemma: "لا نهائية"
      confirm:
        - text: "«لا نهاية — مسافة غير محدودة في التصوير، لدرجة أن المنبع الضوئي الموجود على هذه المسافة تُعتبر الأشعة الصادرة عنه متوازية بالنسبة لمعظم العدسات وفي أغلب التطبيقات»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (ARABTERM، 2000)"
        - text: "«لا نهاية — infinite (the)»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
      expands:
        - text: "«النهاية: ما به يصير الشيء ذا كمية، أي حيث لا يوجد وراءه شيء منه. وقيل نهاية الشيء آخره أصلاً من النهي وهو المنع، والشيء إذا بلغ آخره امتنع من الزيادة»"
          source: "التوقيف على مهمات التعاريف للمناوي (Hawramani)"
          addition: "يُؤسِّس لمفهوم «لا نهائية» سلبياً: فالنهاية هي ما يمنع الزيادة، وانعدامها يعني الامتداد بلا حدٍّ."
        - text: "«النهاية: غاية الشيء وآخره... والتناهي في المقدار كون المقدار بحيث يمكن أن يفرض بقدر محدود»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (Hawramani)"
          addition: "يُفرِّق التهانوي بين «التناهي في المقدار» و«التناهي في الوضع» — وكلاهما يُفيد بالمقابل أن عدم التناهي هو انعدام هذا التحديد."

    - lemma: "إِطْلاقِيَّة"
      contradicts:
        - text: "«اطلاقية — absolutism»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM، entry_id: 489208)"
          conflict: >
            «Absolutism» هو مذهب فلسفي/سياسي يرى أن السلطة أو الحقيقة مطلقة غير مقيَّدة،
            وهو مغاير لـ«Infiniteness» التي تعني الصفة الرياضية والوجودية للانتهاء.
            استخدام «إطلاقية» في هذه المجموعة سيُولِّد التباساً مع المصطلح الفلسفي المُرسَّخ.

    - lemma: "عَدَمُ التَّنَاهِي"
      confirm:
        - text: "«لا تناهٍ — infinity»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM، 1999، entry_id: 395616)"
        - text: "«والتناهي في المقدار كون المقدار بحيث يمكن أن يفرض بقدر محدود»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (Hawramani)"
          # المقابل الضمني: عدم التناهي = عدم كون المقدار بقدر محدود
        - text: "«النُّونُ وَالْهَاءُ وَالْيَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى غَايَةٍ وَبُلُوغٍ. وَمِنْهُ أَنْهَيْتُ إِلَيْهِ الْخَبَرَ: بَلَّغْتُهُ إِيَّاهُ. وَنِهَايَةُ كُلِّ شَيْءٍ: غَايَتُهُ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 989280)"
        - text: "«الْعَيْنُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى فُقْدَانِ الشَّيْءِ وَذَهَابِهِ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 987667)"

    - lemma: "سَرَمَدِيَّة"
      contradicts:
        - text: "«سَرْمَدِيَّة — من (س ر م د) نسبة إلى سَرْمَد»"
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani، entry_id: 928332)"
          conflict: >
            المدخل الوحيد الموجود يُعالج «سرمدية» باعتبارها اسم نسبة لعَلَم شخصي (سَرْمَد)،
            لا باعتبارها مصطلحاً فلسفياً. ورغم أن الاشتقاق الفلسفي وارد، إلا أن المعاجم لا
            توثِّق «السرمدية» كمرادف مُعلَّم لـ«اللانهائية»، بل تربطها بالأبدية الزمنية
            (Eternity) دون الدلالة على انعدام الحد المكاني أو الكمي.

    - lemma: "رَحَابَة"
      expands:
        - text: "«الرَّاءُ وَالْحَاءُ وَالْبَاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى السَّعَةِ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 986487)"
          addition: "يُؤسِّس للبُعد الدلالي (السعة)، لكن السعة أعمّ من اللانهائية."
        - text: "«رحابة؛ سعة في أفق التفكير»"
          source: "المورد الحديث (ARABTERM، entry_id: 674977)"
          addition: "يُظهر أن «رحابة» مرتبطة بالاتساع الفكري، لا بانعدام النهاية الوجودي."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "لا محدودية"
      decision: confirmed
      decision_reason: >
        مصطلح حديث سائد في الكتابة العربية المعاصرة (العلمية والإعلامية والفلسفية) يُعبِّر عن
        «صفة انعدام الحدِّ»؛ مبنيٌّ على النمط الإنتاجي العربي (لا + مصدر صناعي). تشوبه مشكلة
        غياب التشكيل وعدم التوثيق الكلاسيكي المباشر، غير أن شيوعه الاستعمالي يُسوِّغ الإبقاء عليه
        مع إصلاح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: >
        تُركِّز على انعدام الحدِّ (boundary/limit) المادي والقياسي؛ تُستخدم كثيراً في السياقات
        الكونية والفيزيائية والسياسية (لا محدودية الفضاء، لا محدودية الصلاحيات).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَا مَحْدُودِيَّة"

    - lemma: "لا نهائية"
      decision: confirmed
      decision_reason: >
        ترد «لا نهاية» في معاجم ARABTERM للفلسفة وعلم الاستشعار عن بعد بمعنى infinity؛ وصيغة
        «لا نهائية» (بالمصدر الصناعي) هي التوسيع الاسمي الطبيعي لهذا الجذر. الأكثر شيوعاً في
        الرياضيات والفيزياء الحديثة. يُصحَّح تشكيله.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: >
        تُركِّز على انعدام النهاية (end/termination) الزمنية أو الكمية؛ أكثر شيوعاً في الرياضيات
        (سلاسل لانهائية، مجموعات لانهائية) وعلم الفيزياء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَا نِهَائِيَّة"

    - lemma: "إِطْلاقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        وثّقت معاجم ARABTERM «إطلاقية» بمعنى «absolutism» (مذهب فلسفي/سياسي)، وهو مغاير كلياً
        لـ«infiniteness». إدراجها في هذه المجموعة سيولِّد التباساً مصطلحياً ويناقض التوثيق المعجمي
        المرسَّخ.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "عَدَمُ التَّنَاهِي"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح كلاسيكي راسخ في علم الكلام والفلسفة الإسلامية والرياضيات؛ موثَّق في التهانوي وفي
        معاجم ARABTERM (لا تناهٍ = infinity). يُعبِّر بدقة مفهومية عالية عن «غياب التناهي»، وهو
        الجنس الكلاسيكي لمفهوم المجموعة. اجتاز اختبار التثبيت المعجمي (وحدة مصطلحية ثابتة لا
        يمكن إبدال «عدم» بـ«انتفاء» دون تغيّر المستوى الأسلوبي).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        المصطلح الفلسفي والكلامي الكلاسيكي؛ يُفيد «غياب التناهي» بوصفه مفهوماً مجرَّداً. يُستخدم
        في مسائل علم الكلام (هل العالم متناهٍ أم غير متناهٍ؟) وفي تعريفات الرياضيات الكلاسيكية.
      actions:
        - command: create_entry
          params:
            lemma: "عَدَمُ التَّنَاهِي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05216592-n"

    - lemma: "سَرَمَدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم لا تُوثِّق «السرمدية» مصطلحاً للانهائية؛ المدخل الوحيد الموجود يُعالجها
        اسمَ نسبةٍ للعَلَم سَرْمَد. فضلاً عن ذلك، «السرمدية» دلالياً تُركِّز على الأبدية
        الزمنية (Eternity) لا على انعدام الحدِّ الكمي أو المكاني — وهو تمييز فلسفي جوهري.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "رَحَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        «الرحابة» تعني «السعة» و«الاتساع»، وهي أعمّ وأشمل من «اللانهائية»؛ إذ يمكن للشيء
        الواسع أن تكون له حدود. لم تُؤكِّد المعاجم استخدامها مرادفاً لـ«اللانهائية». اجتاز
        اختبار الاستبدال بالفشل: «رحابة الكون» ≠ «لانهائية الكون» في الدقة المفهومية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


