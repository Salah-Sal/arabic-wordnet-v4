stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة حالياً (مجموعة أوراق اللعب) وصفية وطويلة نوعاً ما."
      - "عدم وجود مصطلحات تراثية أو معربة مشهورة مثل (دست) أو (طقم) في المجموعة الحالية."
    observations: "المفهوم يشير إلى تجمع من الأوراق يحقق شرطاً في اللعبة (مثل الأوراق الأربعة المتشابهة في لعبة 'جو فيش' أو الست لفتات الأولى في البريدج). المصطلح العربي الأكثر شيوعاً هو 'مجموعة' أو 'طقم'."
  blind_candidates:
    - lemma: "مَجْمُوعَة"
      generation_method: ishtiqaq
      justification: "اللفظ العام لأي تجمع من الأشياء، وهو مستخدم بكثرة في ألعاب الورق."
    - lemma: "طَقْم"
      generation_method: taarib
      justification: "كلمة معربة (من التركية) تستخدم للدلالة على مجموعة متكاملة من الأدوات أو الأشياء، وتستخدم في سياق الأوراق (طقم ورق)."
    - lemma: "دَسْت"
      generation_method: taarib
      justification: "مصطلح قديم في ألعاب القمار والورق يشير إلى الدور أو المجموعة من الأوراق."
    - lemma: "لَمَّة"
      generation_method: ishtiqaq
      justification: "من اللم وهو الجمع، وتستخدم في بعض اللهجات للدلالة على ما يجمعه اللاعب من أوراق في دور واحد."

stage2_evidence:
  per_lemma:
    - lemma: "مجموعة أوراق اللعب"
      confirm:
        - text: "«مجموعة ورق اللعب» كترجمة لكلمة deck."
          source: "المورد الحديث"
        - text: "«المنظومة: مجموعة كاملة من ورق اللعب [أو الطوابع] تؤلف سلسلة تامة»."
          source: "المورد الحديث (مادة set)"
    - lemma: "طقم"
      confirm:
        - text: "«طقم: مجموعةُ برامجَ تطبيقيةٍ تُباع كحزمة...» (دلالة المجموعة المتكاملة)."
          source: "معجم مصطلحات المعلوماتية"
        - text: "يستخدم في اللغة المعاصرة لوصف مجموعة الأوراق المتشابهة (طقم ورق)."
          source: "الاستعمال المعاصر"
    - lemma: "دَسْت"
      confirm:
        - text: "«دَسْتُ القِمارِ: المَجْلِسِ الثّالِثُ اللُّعْبَةُ الرَّابع»."
          source: "المعجم الكبير"
        - text: "«الدَّسْتُ: الصَّحْرَاءُ وَهُوَ فَارِسِيٌّ مُعَرَّبٌ»."
          source: "مقاييس اللغة (بمعنى مختلف، لكن يؤكد التعريب)"
    - lemma: "مَنْظُومَة"
      confirm:
        - text: "«المنظومة: مجموعة كاملة من ورق اللعب... تؤلف سلسلة تامة»."
          source: "المورد الحديث"
    - lemma: "لَمَّة"
      confirm:
        - text: "«اللَّمُّ: الجَمْع. يُقَالُ: لَمَمْتُ الشيءَ ألُمُّه لَمًّا، إِذَا جَمَعْتَه»."
          source: "لسان العرب / مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "مجموعة أوراق اللعب"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع يصف المجموعات الورقية في الألعاب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَجْمُوعَةُ أَوْرَاقِ اللَّعِبِ"
    - lemma: "طَقْم"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم للدلالة على المجموعة المتكاملة التي تحقق شرطاً معيناً (مثل طقم من أربعة أوراق)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "طَقْم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07971027-n"}
    - lemma: "دَسْت"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تاريخي ومعجمي مرتبط بألعاب الورق والقمار، ويشير إلى مجموعة الأوراق أو الدور."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دَسْت", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07971027-n"}
    - lemma: "مَنْظُومَة"
      decision: confirmed
      decision_reason: "وردت صراحة في المعاجم الحديثة لوصف المجموعة الكاملة من ورق اللعب التي تشكل وحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَنْظُومَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07971027-n"}

stage4_content:
  definition:
    current: "مجموعة من أوراق اللعب تستوفي قواعد لعبة ورق معينة"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق لغوياً واصطلاحياً ويغطي المفهوم بشكل جيد."
  examples:
    per_lemma:
      - lemma: "مَجْمُوعَةُ أَوْرَاقِ اللَّعِبِ"
        examples:
          - text: "كَوَّنَ اللَّاعِبُ مَجْمُوعَةَ أَوْرَاقِ اللَّعِبِ الْمَطْلُوبَةَ لِلْفَوْزِ بِالْمُبَارَاةِ."
            type: usage
      - lemma: "طَقْم"
        examples:
          - text: "يَحْتَاجُ اللَّاعِبُ إِلَى طَقْمٍ كَامِلٍ مِنَ الْأَوْرَاقِ ذَاتِ الْقِيمَةِ نَفْسِهَا لِيُحَقِّقَ نَصْراً."
            type: usage
      - lemma: "دَسْت"
        examples:
          - text: "رَبِحَ الْمُقَامِرُ الدَّسْتَ بَعْدَ أَنْ جَمَعَ أَوْرَاقاً رَابِحَةً."
            type: usage
      - lemma: "مَنْظُومَة"
        examples:
          - text: "تَتَأَلَّفُ الْمَنْظُومَةُ فِي بَعْضِ أَلْعَابِ الْوَرَقِ مِنْ سِلْسِلَةٍ مُتَتَالِيَةٍ مِنَ النَّقْشِ نَفْسِهِ."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "مَجْمُوعَةُ أَوْرَاقِ اللَّعِبِ"
      entry_id: "{auto}"
      roots:
        - word: "مجموعة"
          root: "جمع"
          maqayis_quote: "«الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ.»"
        - word: "أوراق"
          root: "ورق"
          maqayis_quote: "«الْوَاوُ وَالرَّاءُ وَالْقَافُ: أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى خَيْرٍ وَمَالٍ، وَأَصْلُهُ وَرَقُ الشَّجَرِ.»"
        - word: "اللعب"
          root: "لعب"
          maqayis_quote: "«اللَّامُ وَالْعَيْنُ وَالْبَاءُ كَلِمَتَانِ... إِحْدَاهُمَا اللَّعِبُ مَعْرُوفٌ.»"
    - lemma: "طَقْم"
      entry_id: "{auto}"
      root: "طقم"
      note: "الكلمة معربة من التركية (takım)، وليست في مقاييس اللغة."
    - lemma: "دَسْت"
      entry_id: "{auto}"
      root: "دست"
      maqayis_quote: "«الدَّالُ وَالسِّينُ وَالتَّاءُ لَيْسَ أَصْلًا، لِأَنَّ الدَّسْتَ الصَّحْرَاءُ وَهُوَ فَارِسِيٌّ مُعَرَّبٌ.»"
    - lemma: "مَنْظُومَة"
      entry_id: "{auto}"
      root: "نظم"
      maqayis_quote: "«النُّونُ وَالظَّاءُ وَالْمِيمُ: أَصْلٌ يَدُلُّ عَلَى تَأْلِيفِ شَيْءٍ وَتَأْلِيفِهِ.»"
  per_sense:
    - lemma: "مَجْمُوعَةُ أَوْرَاقِ اللَّعِبِ"
      sense_id: "{auto}"
      nuance: "المصطلح العام والشامل لأي تجمع من الأوراق."
      mwe: true
    - lemma: "طَقْم"
      sense_id: "{auto}"
      nuance: "يركز على تكامل المجموعة وتجانسها (مثل نفس الرقم أو نفس النوع)."
      mwe: false
    - lemma: "دَسْت"
      sense_id: "{auto}"
      nuance: "يرتبط بسياق اللعب الميداني (الجلسة أو الدور أو اليد)."
      mwe: false
    - lemma: "مَنْظُومَة"
      sense_id: "{auto}"
      nuance: "يركز على الترتيب والاتساق في المجموعة (مثل المتتاليات)."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"مجموعة","root":"جمع","maqayis":"«...»"},{"word":"أوراق","root":"ورق","maqayis":"«...»"},{"word":"اللعب","root":"لعب","maqayis":"«...»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"طقم","note":"معربة"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"دست","maqayis":"«...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نظم","maqayis":"«...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح العام","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-07971027-n"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "awn4-07971027-n"
        score: 0.9
