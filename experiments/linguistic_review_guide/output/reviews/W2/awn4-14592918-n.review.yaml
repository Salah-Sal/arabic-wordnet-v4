stage1_review:
  assessment:
    concerns:
      - "استخدام كلمة 'تطابق' قد يوحي بالتطابق اللفظي أو الشكلي البسيط، بينما 'تماثل' (homo-) هي الأدق في السياق البيولوجي (homozygous)."
      - "المصطلحات في الوراثة غالباً ما تكون مركبات إضافية أو وصفية، ويجب التأكد من استقرارها في المعاجم المتخصصة."
      - "الاسم الإنجليزي (homozygosity) يعبر عن الحالة (state)، لذا يفضل استخدام مصدر صناعي مثل 'زيجوتية' أو تركيب إضافي يبدأ بـ 'تماثل' أو 'حالة'."
    observations: "المجموعة تتعلق بمفهوم وراثي دقيق. المصطلحات الموجودة صحيحة علمياً وتستخدم في الأدبيات العربية الوراثية."
  blind_candidates:
    - lemma: "تَمَاثُلُ الزَّيْجُوتِ"
      generation_method: tarkib
      justification: "تركيب إضافي يترجم المصطلح العلمي (homozygosity) حرفياً وبدقة، حيث الزيجوت هو اللواقح."
    - lemma: "تَمَاثُلُ الْأَلَائِلِ"
      generation_method: tarkib
      justification: "ترجمة دقيقة لمفهوم وجود أليلين متماثلين لنفس الجين."
    - lemma: "زَيْجُوتِيَّةٌ مُتَمَاثِلَةٌ"
      generation_method: ishtiqaq
      justification: "استخدام المصدر الصناعي 'زيجوتية' متبوعاً بصفة 'متماثلة' للتعبير عن الحالة (homozygosity)."
    - lemma: "تَمَاثُلُ اللَّاقِحَةِ"
      generation_method: tarkib
      justification: "استخدام المصطلح العربي الأصيل 'لاقحة' بدلاً من المعرب 'زيجوت'."

stage2_evidence:
  per_lemma:
    - lemma: "تطابق الألائل"
      confirm:
        - text: "في خلية ضعفانية هناك نوعان من الأليلات من كل جين... يمكن أن يكونا متطابقين."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
      expands:
        - text: "أَلِيل [ث: أليلان؛ ج: أَلائِل]"
          source: "المعجم الطبي الموحد"
          addition: "يوثق الجمع الصحيح للكلمة."
    - lemma: "تماثل الزيجوت"
      confirm:
        - text: "متماثل الزيجوت: وجود أليلات متشابهة في مواضيع متناظرة في الصبغيات المتماثلة."
          source: "المعجم الموحد لمصطلحات علم الوراثة"
    - lemma: "زَيْجُوتِيَّةٌ مُتَمَاثِلَةٌ"
      confirm:
        - text: "زيجوتية متماثلة (homozygosity): حالة وجود أليلات متماثلة في موقع واحد أو أكثر في قسيمات الصبغيات المتماثلة."
          source: "المعجم الموحد لمصطلحات علم الوراثة"
    - lemma: "تَمَاثُلُ الْأَلَائِلِ"
      confirm:
        - text: "أليل متنح: أليل لا يمكن أن يعبر عنه إلا في حالة تماثل الأليلات."
          source: "المعجم الموحد لمصطلحات علم الوراثة"
    - lemma: "تَمَاثُلُ اللَّاقِحَةِ"
      confirm:
        - text: "متجانس اللاقحات (homozygous)."
          source: "المعجم الموحد لمصطلحات علم الأحياء"
          addition: "يؤكد استخدام 'اللاقحات' (zygotes) في السياق العلمي العربي."

stage3_analysis:
  per_lemma:
    - lemma: "تطابق الألائل"
      decision: confirmed
      decision_reason: "مصطلح مستخدم وصحيح علمياً للتعبير عن هوية الأليلات، وإن كان 'تماثل' أكثر شيوعاً في التعريب الرسمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَطَابُقُ الْأَلَائِلِ"
    - lemma: "تماثل الزيجوت"
      decision: confirmed
      decision_reason: "المصطلح الأكثر شيوعاً في الكتب المدرسية والجامعية العربية لترجمة homozygosity/homozygous."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَاثُلُ الزَّيْجُوتِ"
    - lemma: "زَيْجُوتِيَّةٌ مُتَمَاثِلَةٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق جداً ورد في المعجم الموحد لمصطلحات علم الوراثة كترجمة مباشرة لـ homozygosity."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "زَيْجُوتِيَّةٌ مُتَمَاثِلَةٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَمَاثُلُ الْأَلَائِلِ"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير دقيق ومنتشر في المعاجم الوراثية المتخصصة لوصف الحالة الجينية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "تَمَاثُلُ الْأَلَائِلِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حالة كونه متماثل الزيجوت؛ وجود أليلين متطابقين لنفس الجين"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يفتقر إلى الدقة المكانية (الموقع على الصبغي) التي توفرها المعاجم المتخصصة."
    authored:
      - type: terminological
        text: "حالة وجود أليلات متماثلة في موقع واحد أو أكثر في قسيمات الصبغيات المتماثلة؛ مما ينتج عنه نمط ظاهري نقي."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "حالة وجود أليلات متماثلة في موقع واحد أو أكثر في قسيمات الصبغيات المتماثلة؛ مما ينتج عنه نمط ظاهري نقي."}
  examples:
    per_lemma:
      - lemma: "تَطَابُقُ الْأَلَائِلِ"
        examples:
          - text: "يؤدي تطابق الألائل في هذا الموقع الجيني إلى ظهور الصفة المتنحية."
            type: usage
      - lemma: "تَمَاثُلُ الزَّيْجُوتِ"
        examples:
          - text: "تماثل الزيجوت هو الأساس في إنتاج السلالات النقية في تربية النبات."
            type: usage
      - lemma: "زَيْجُوتِيَّةٌ مُتَمَاثِلَةٌ"
        examples:
          - text: "تُحدد الزيجوتية المتماثلة من خلال مقارنة تسلسل الدنا في الكروموسومات المتناظرة."
            type: usage
      - lemma: "تَمَاثُلُ الْأَلَائِلِ"
        examples:
          - text: "يعد تماثل الألائل ضرورياً للتعبير عن الأمراض الوراثية المرتبطة بالجينات المتنحية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعد تماثل الزيجوت شرطاً أساسياً لظهور الصفات المتنحية في الأجيال الناتجة."}

