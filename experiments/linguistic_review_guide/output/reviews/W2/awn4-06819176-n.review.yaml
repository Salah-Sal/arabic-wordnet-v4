# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'إشارة خفية' مركّبة وصفية حرّة وغير مسكوكة كوحدة اصطلاحية ثابتة في المعاجم"
      - "غياب الكلمة المفردة 'غَمْزَة' رغم ثبوتها في أقدم المعاجم العربية بمعنى الإشارة الخفية بالجفن والحاجب"
      - "التعريف يستخدم 'صامتة' مما قد يوهم بأن الإشارة لا صوت فيها البتّة، والأدق وصفها بـ'خفية' أو 'سرية'"
    observations: >
      المجموعة تمثّل مفهوم الإشارة السرية المتبادَلة بين شخصين لغرض التحذير أو التعارف دون كلام، كالغمزة
      بالعين أو الإيماء بالرأس. اللغة العربية غنيّة بهذا المعنى عبر مادة (غمز)، إذ عرّف الخليل بن أحمد
      الغمزَ بـ"الإشارة بالجفن والحاجب"، وهو بعينه مفهوم المجموعة. الاكتفاء بتعبير وصفي مركّب دون إدراج
      اللفظ المفرد التراثي الدقيق يُضعف قيمة المجموعة الترادفية. تستدعي المراجعةُ استيعابَ 'غَمْزَة'
      لمّةً أساسيةً مستقلة.
  blind_candidates:
    - lemma: "غَمْزَة"
      generation_method: ishtiqaq
      justification: >
        مشتقّة من الجذر (غ-م-ز) على وزن فَعْلَة (المرة الواحدة من الفعل)، تدلّ على الإشارة الخفية
        بالجفن أو الحاجب للتنبيه أو التعارف السريّ. اختِيرت هذه الصيغة لأنّ وزن فَعْلَة يُفيد الحدث
        الواحد المعيّن — وهو ما يناسب مفهوم إشارة سرية مفردة محددة.
    - lemma: "رَمْزَة"
      generation_method: ishtiqaq
      justification: >
        مشتقّة من الجذر (ر-م-ز) على وزن فَعْلَة، مرة واحدة من الرمز (الإشارة المكنية المشفّرة).
        يحتمل أن تُستخدم مصطلحاً للإشارة المشفّرة المفردة التي يتوافق عليها طرفان.
    - lemma: "سُومَة"
      generation_method: majaz
      justification: >
        لفظ عربي قديم بمعنى العلامة التي يُعرف بها الخير والشر؛ إحياء لمعنى كلاسيكي بمجاز وظيفي،
        إذ يشترك مفهوم السومة مع إشارة التعارف في وظيفة الكشف عن الهوية.
    - lemma: "لَفْتَة"
      generation_method: majaz
      justification: >
        من (ل-ف-ت) بمعنى جذب الانتباه نحو جهة معينة؛ مجاز لوصف إشارة خاطفة تُلفت انتباه
        الشخص المعني دون أن يُدركها الآخرون.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1 — مطابقة دفعية: اشارة خفية + الاشارة + الخفية + غمزة + الغمزة + رمزة + الرمزة + سومة + السومة + لفتة + اللفتة
#   Q2 — جسر إنجليزي: high sign | secret signal | covert signal | warning signal | recognition signal | silent signal
#   Q3 — بحث FTS بمفاتيح: صامت، خفية، تحذير، تعرف، سري، غمز، ايماء
#   Q4 — مقاييس اللغة (dictionary_id=151) للجذور: شور، خفي، غمز، رمز، سوم
stage2_evidence:
  per_lemma:
    - lemma: "إِشَارَةٌ خَفِيَّةٌ"
      confirm:
        - text: "«الإِشَارَةُ: علامَةٌ, أو رَمْزٌ, أو حركةٌ للدلالةِ على أمرٍ ما»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«الْإِشَارَةُ: تعْيين الشَّيْء بِالْيَدِ وَنَحْوهَا والتلويح بِشَيْء يفهم مِنْهُ المُرَاد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«الإشارة: التلويح بشيء يفهم منه النطق، فهي ترادف النطق في فهم المعنى»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: "يُبيّن أن الإشارة بديل غير لفظي عن الكلام في إيصال المعنى، مما يدعم مفهوم الإشارة الصامتة/الخفية"
        - text: "«الشِّينُ وَالْوَاوُ وَالرَّاءُ أَصْلَانِ مُطَّرِدَانِ، الْأَوَّلُ مِنْهُمَا إِبْدَاءُ شَيْءٍ وَإِظْهَارُهُ وَعَرْضُهُ»"
          source: "مقاييس اللغة لابن فارس (جذر: شور)"
          addition: "يُحدد أصل الإشارة الدلالي في إبداء الشيء وإظهاره — وهو ما يتلاءم مع كون الإشارة الخفية إبداءً مقصوراً على المعنيّ"

    - lemma: "غَمْزَة"
      confirm:
        - text: "«غمز: الإشارة بالجفن والحاجب. العصر باليد»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي (ت 786م)"
        - text: "«غَمَزَ بِجَفْنِهِ: أَشَارَ»"
          source: "مقاييس اللغة لابن فارس — (غَمَزَ) الغين والميم والزاء"
        - text: "«غمز بجفنه: أشار»"
          source: "مجمل اللغة لابن فارس (ت 1004م)"
        - text: "«to tip a person the wink: يغمزه [تنبيهاً أو تحذيراً]»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(10) .أ» غمزة. .ب» غَمْزٌ [مقابل: wink]»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت التكافؤ بين غمزة والـwink الإنجليزي؛ والوينك هو أقرب المعادلات للـhigh sign الذي هو لمّة المجموعة"

    - lemma: "رَمْزَة"
      expands:
        - text: "«رَمْزَة: من (ر م ز) المرة من الرَّمْز»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُثبت وجود صيغة رمزة بمعنى المرة الواحدة من الرمز، لكنه لا يُخصّصها للإشارة السرية"
      contradicts:
        - text: "«الرَّاءُ وَالْمِيمُ والزَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَرَكَةٍ وَاضْطِرَابٍ»"
          source: "مقاييس اللغة لابن فارس (جذر: رمز)"
          conflict: "الأصل الدلالي لرمز في المقاييس هو الحركة والاضطراب العام لا الإشارة السرية القصدية، مما يُضعّف تخصيصها لمعنى المجموعة"

    - lemma: "سُومَة"
      expands:
        - text: "«السُّومَةُ: السِّمَةُ والعَلَامَةُ. العَلَامَةُ يُعْرَفُ بها الخَيْرُ والشَّرُّ. القِيمَةُ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          addition: "دلالة التعرف بها على الخير والشر تقترب من وظيفة إشارة التعارف، لكن المعنى ينصبّ على العلامة الثابتة لا الإشارة الآنية"
        - text: "«وَمِمَّا شَذَّ عَنِ الْبَابِ السُّومَةُ، وَهِيَ الْعَلَامَةُ تُجْعَلُ فِي الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس (جذر: سوم)"
          addition: "يصفها ابن فارس بالشذوذ عن الباب، مما يُضعف منهجية اشتقاقها واستخدامها"
      contradicts:
        - text: "«السَّومَة: السِّمَة والعلامة القيمة»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: "السومة علامة ثابتة منقوشة أو مختومة في الشيء، لا إشارة آنية يُؤدّيها شخص لشخص كالغمزة أو الإيماء"

    - lemma: "لَفْتَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إِشَارَةٌ خَفِيَّةٌ"
      decision: confirmed
      decision_reason: >
        التعبير المركب صحيح دلالياً وصريح في المعنى. 'الإشارة' موثّقة في المعاجم بمعنى التلويح الذي
        يُفهم منه المراد، و'خفية' صفة فصيحة مشهورة. وإن لم يَرِد كوحدة معجمية مسكوكة فهو تركيب
        وصفي اصطلاحي شائع للدلالة على المفهوم الأعم. يُحتفظ به بوصفه اللمّة الشاملة لجميع أنواع
        الإشارات السرية غير اللفظية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "أعم لمّات المجموعة؛ تشمل كل إشارة سرية غير لفظية بصرف النظر عن طبيعتها (عين، يد، رأس، إصبع...)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَةٌ خَفِيَّةٌ"

    - lemma: "غَمْزَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        كلمة مفردة فصيحة موثّقة من أقدم المعاجم (كتاب العين، ت786م) بمعنى الإشارة بالجفن والحاجب.
        أيّدها ابن فارس في المقاييس والمجمل (غمز بجفنه: أشار). المورد الحديث يربطها مباشرةً
        بـ"to tip a person the wink" بمعنى التنبيه سراً — وهو بعينه مفهوم المجموعة. تستوفي
        معايير جودة المصطلح الستة: الاطراد، اليسر، الملاءمة الدلالية، التراثية، العربية الأصيلة،
        والاشتقاقية. لا إشكال في الاقتراض (جذر عربي خالص). الوزن الصرفي (فَعْلَة) يناسب
        الدلالة الحدثية المفردة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أخص لمّات المجموعة؛ مقتصرة على الإشارة بالعين والجفن والحاجب، وأكثر ارتباطاً بالتحذير السري المباشر في حضور آخرين"
      actions:
        - command: create_entry
          params:
            lemma: "غَمْزَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رَمْزَة"
      source: stage1
      decision: removed
      decision_reason: >
        وردت في موسوعة السلطان قابوس فقط بمعنى 'المرة من الرمز' دون تخصيص للإشارة السرية.
        الجذر في المقاييس يدل على الحركة العامة لا على الإيماء المقصود. لا أدلة تُثبت استخدامها
        مصطلحاً ثابتاً في هذا المعنى.

    - lemma: "سُومَة"
      source: stage1
      decision: removed
      decision_reason: >
        السومة علامة ثابتة مجعولة في الشيء (كالوسم) لا إشارة آنية يُؤدّيها شخص. ابن فارس يصفها
        بالشذوذ عن الباب الأصلي. دلالتها الحديثة تنصبّ على القيمة والسمة لا على الإيماء السري.

    - lemma: "لَفْتَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استخدام 'لفتة' مصطلحاً للإشارة السرية. يسقط بموجب اختبار التثبيت المعجمي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "إشارة صامتة للتحذير أو التعرف"
    assessment:
      decision: revise
      reason: >
        لفظ 'صامتة' يصف انعدام الصوت تحديداً، لكن ما يميّز المفهوم هو الخفاء والسرية لا الصمت
        بالضرورة (إذ قد يُصاحبها همس). كذلك التعريف مقتضب ولا يذكر أن هذه الإشارة تتم بين
        طرفين يتواضعان على معناها مسبقاً، وهو الفارق الجوهري بينها وبين الإشارة العشوائية.
    authored:
      - type: terminological
        text: "إِيمَاءٌ خَفِيٌّ مَعْهُودٌ بَيْنَ شَخْصَيْنِ، يُؤَدِّيهِ أَحَدُهُمَا تَحْذِيرًا لِلْآخَرِ أَوِ اسْتِيثَاقًا مِنْ هُوِيَّتِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
