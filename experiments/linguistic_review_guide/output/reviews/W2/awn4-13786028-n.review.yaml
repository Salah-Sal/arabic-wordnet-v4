# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13786028-n — spoilage
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «الفاسد» اسم فاعل معرّف بأل، يُستعمل صفةً أو مصطلحاً فقهياً (مقابل الباطل)، ولا يدل على الكمية الفاسدة بل على الشيء الموصوف بالفساد"
      - "المجموعة تمثّل كمية (hypernym: كمية تقديرية) لكن لا توجد لمّة تدل صراحةً على مقدار ما فسد"
      - "لمّة «تلف» مصدر يدل على الهلاك والعطب عموماً، لا على الكمية التالفة تحديداً، لكنه أقرب المصادر العربية لمفهوم spoilage"
    observations: "المفهوم (الكمية التي فسدت) مفهوم حديث يرتبط بالتجارة وتقانات الأغذية. في العربية التراثية لا يوجد مصطلح مفرد يعني بالضبط «مقدار ما تلف»، بل يُعبَّر عنه بالمصدر (تلف، فساد) أو بتركيب وصفي. المورد الحديث يُترجم spoilage بـ«التلف» ويشرحه بـ«مقدار الخسارة الناشئة عن التلف»."
  blind_candidates:
    - lemma: "فَسَاد"
      generation_method: ishtiqaq
      justification: "مصدر فَسَدَ على وزن فَعَال، يدل على خروج الشيء عن الاعتدال والصلاح، وهو المقابل العربي الأصيل لمفهوم التلف والعطب في المواد الغذائية وغيرها"
    - lemma: "تَلَف"
      generation_method: ishtiqaq
      justification: "مصدر تَلِفَ على وزن فَعَل، يدل على الهلاك والعطب في كل شيء، وهو الأكثر شيوعاً في الاستعمال المعاصر للدلالة على فساد البضائع والمواد"
    - lemma: "هَدَر"
      generation_method: ishtiqaq
      justification: "مصدر هَدَرَ بمعنى ما ذهب باطلاً وضاع، يُستعمل في السياق الاقتصادي بمعنى wastage أي الكمية المهدورة"
    - lemma: "فَاسِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من فَسَدَ على وزن فَاعِل، يدل على ما أصابه الفساد، يمكن استعماله اسماً بمعنى الشيء الفاسد"

stage2_evidence:
  per_lemma:
    - lemma: "الفَاسِد"
      contradicts:
        - text: "«الْفَاسِد: فِي الْبَاطِل وَعند الشَّافِعِي رَحمَه الله لَا فرق بَين الْفَاسِد وَالْبَاطِل.»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "المعنى الاصطلاحي الفقهي (الباطل) لا يتعلق بفساد المواد أو الكميات"
        - text: "«الفاسد: هو الصحيح بأصله لا بوصفه، ويفيد الملك عند اتصال الفيض به»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "مصطلح فقهي بحت يدل على بطلان العقود لا على فساد البضائع"
      expands:
        - text: "«(فَاسد) الرجل رهطه أَسَاءَ إِلَيْهِم ففسدوا عَلَيْهِ»"
          source: "المعجم الوسيط"
          addition: "فاسَدَ فعل مفاعلة وليس اسم فاعل، مما يزيد اللبس"

    - lemma: "تَلَف"
      confirm:
        - text: "«(1) مص spoil (2) «أ», التَّلَف: «ب» شيء يَفْسُد أو يتلف أثناء العمل أو النَّقل. «ج» مقدار الخسارة الناشئة عن التَّلف.»"
          source: "المورد الحديث (2008)"
        - text: "«التلف: الهلاك والعطب في كلّ شيء، والفعل تَلِفَ يتلَفُ تَلَفاً»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«التَّلَفُ: الهلاكُ. وقد تَلِفَ الشئ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«تلِف الزَّرعُ: فسَد، عطِب — تتلف كميّات كبيرة من الفواكه أثناء نقلها»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«اضمحلال (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "تلف يُعادل decay في الهندسة المدنية"
        - text: "«تلف الغذاء، فساد الغذاء: التغيرات الحيوية والكيميائية وتلك الناتجة عن التلوث المؤدية إلى جعل الغذاء ضاراً بالصحة أو مرفوضاً حسياً.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "تلف يُستعمل في المصطلحية الغذائية مرادفاً للفساد"

    - lemma: "فَسَاد"
      confirm:
        - text: "«فساد: تغير صفات المادة الغذائية بحيث لا تعود صالحة للاستهلاك.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«(الْفساد) التّلف والعطب وَالِاضْطِرَاب والخلل والجدب والقحط»"
          source: "المعجم الوسيط"
        - text: "«الفساد: انتقاض صورة الشيء، قاله الحرالي. وقال الراغب: خروج الشيء عن الاعتدال»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«التلفُ والعطب الاضطراب والخلل الجدب والقحط إلحاقُ الضَّرَر»"
          source: "المعجم الوسيط (OCR)"
          addition: "الفساد أعم من التلف إذ يشمل الاضطراب والخلل والجدب"
        - text: "«فساد حيويّ: فساد تسببه عوامل حيوية كالبكتيريا والفطريّات والخمائر.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "يُستعمل فساد مصطلحاً تقنياً في علوم الأغذية"

    - lemma: "هَدَر"
      contradicts:
        - text: "«الهَدَرُ، محرَّكةً: ما يَبْطُلُ من دَمٍ وغيرِهِ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "المعنى الأصلي لهدر هو بطلان الدم وسقوطه، لا فساد المواد المادي"
        - text: "«(الهدر) السَّاقِط الْبَاطِل وَيُقَال ذهب دَمه هدرا لَيْسَ فِيهِ قَود وَلَا عقل»"
          source: "المعجم الوسيط"
          conflict: "الهدر يدل على الضياع المعنوي (بطلان الحق) لا على الفساد المادي للبضائع"
      expands:
        - text: "«هدر = wastage»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "يُستعمل هدر في المصطلحية المعاصرة بمعنى wastage لا spoilage"

    - lemma: "فَاسِد"
      contradicts:
        - text: "«الفاسد: هو الصحيح بأصله لا بوصفه»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "فاسد اسم فاعل يعمل صفةً، ولا يصلح اسماً للكمية الفاسدة"
      expands:
        - text: "«(1) فاسد addle eggs (2) أحمق؛ غبيّ (3) مُشَوَّش»"
          source: "المورد الحديث (2008)"
          addition: "فاسد يُستعمل صفةً للبيض ونحوه، لا اسماً لمقدار الفساد"

stage3_analysis:
  per_lemma:
    - lemma: "الفَاسِد"
      decision: removed
      decision_reason: "«الفاسد» اسم فاعل يعمل صفةً أو مصطلحاً فقهياً (مقابل الباطل)، ولا يدل على مقدار ما فسد من البضائع. المعاجم الكلاسيكية والحديثة تستعمله وصفاً لا اسم كمية. المفهوم المطلوب (the amount that has spoiled) يحتاج مصدراً أو اسم معنى لا صفة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَلَف"
      decision: confirmed
      decision_reason: "مصدر تَلِفَ، مؤكَّد في المعاجم الكلاسيكية والحديثة بمعنى الهلاك والعطب. المورد الحديث يُعادله بـ spoilage صراحةً ويشرحه بـ«مقدار الخسارة الناشئة عن التلف». معجم اللغة المعاصرة يمثّل له بـ«تتلف كميات كبيرة من الفواكه». مناسب تماماً لهذه المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على العطب المادي والهلاك الفعلي للبضائع والمواد، أخص من «فساد» الذي يشمل الفساد المعنوي والأخلاقي أيضاً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَلَف"

    - lemma: "فَسَاد"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر فَسَدَ، مؤكَّد في المعجم الموحد لتقانات الأغذية بمعنى spoilage صراحةً: «تغير صفات المادة الغذائية بحيث لا تعود صالحة للاستهلاك». المعجم الوسيط يعرّفه بـ«التلف والعطب». يصلح مرادفاً لـ«تلف» في هذه المجموعة مع فارق دلالي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعم من «تلف»، يشمل خروج الشيء عن الاعتدال سواء كان فساداً مادياً أو معنوياً أو أخلاقياً. في سياق المواد الغذائية يتطابق مع «تلف» لكنه يحمل بُعداً تقنياً أكثر في المصطلحية الحديثة"
      actions:
        - command: create_entry
          params: {lemma: "فَسَاد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "هَدَر"
      source: stage1
      decision: removed
      decision_reason: "الهدر في المعاجم يدل على بطلان الدم وسقوط الحق، أو ما ذهب باطلاً. وإن كان يُستعمل معاصراً بمعنى wastage إلا أنه لا يدل على الفساد المادي للبضائع (spoilage). الفرق بين wastage (ضياع كمي) وspoilage (فساد نوعي) جوهري."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "فَاسِد"
      source: stage1
      decision: removed
      decision_reason: "اسم فاعل يعمل صفةً، لا يصلح اسماً لمقدار ما فسد. يتكرر مع لمّة «الفاسد» الموجودة ويعاني المشكلة نفسها."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

