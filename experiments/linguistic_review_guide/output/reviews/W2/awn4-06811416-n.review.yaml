# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "دلالة واضحة لوجود أو حضور أو طبيعة شخص أو شيء ما"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُترجَم حرفياً من الإنجليزية («a manifest indication of the existence
        or presence or nature of some person or thing»). البنية التركيبية ركيكة: «دلالة
        واضحة لوجود» غير طبيعية في العربية. يلزم صياغة تعريفين: مصطلحي بجنس قريب وفصل نوعي،
        ولغوي يُجلّي الدلالة الأصلية.
    authored:
      - type: terminological
        text: >
          ما يَظهَر من أمارةٍ أو علامةٍ جليّة تكشف عن وجود شخصٍ أو شيءٍ أو تُبيّن طبيعتَه.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
