# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (تجلي، مظهر) مكتوبتان بدون تشكيل — لازم التشكيل الكامل لكل لمّة مؤكدة."
      - "لمّة «تجلي» متمركزة في السياق الصوفي في المعاجم الكلاسيكية («ما ينكشف للقلوب من أنوار الغيوب»)، ويلزم توثيق الإزاحة الدلالية لاستخدامها بالمعنى العام."
      - "لمّة «مظهر» تدل أساساً على «الصورة التي يبدو عليها الشيء» (appearance) لا على «الدلالة التي تكشف عن وجود شيء ما» (manifestation)؛ وهو فرق دلالي جوهري يستحق توثيقاً."
      - "التعريف العربي الحالي مُترجَم حرفياً من الإنجليزية ويحتاج إلى صياغة بأسلوب المعجم الوسيط."
    observations: >
      المجموعة تمثّل مفهوم «التجلّي» بمعناه العام: ظاهرةٌ أو علامةٌ تدلّ دلالةً بيّنةً على وجود شخص أو شيء أو طبيعته.
      اللمّة «تجلٍّ» موثّقة في المعاجم الكلاسيكية والحديثة بمعنى الانكشاف والظهور (انظر كشّاف الفنون والعلوم: Manifestation)،
      غير أنها اكتسبت دلالةً صوفيةً راسخة تستدعي تحريراً نحو الاستخدام العام.
      أما «مظهر» فيدلّ على الهيئة الخارجية المُدركة، وهو أضيق دلالةً من المفهوم المقصود.
      الفارق بين اللمّتين: «تجلٍّ» يُركّز على الانبثاق الديناميكي من الخفاء إلى الظهور،
      بينما «مظهر» يُركّز على النتيجة الثابتة المُدركة حسّياً.
  blind_candidates:
    - lemma: "جَلاء"
      generation_method: majaz
      justification: >
        من الجذر جَلَوَ — أصله «انكشاف الشيء وبروزه» (ابن فارس). المعجم الوسيط يعرّفه بـ«الأمر البيّن الواضح».
        إحياء لمعنى أصيل يُلاقي «الدلالة الواضحة»، مع تحاشي الاشتراك مع مصطلحات البلاغة.
    - lemma: "بَيَان"
      generation_method: majaz
      justification: >
        من جذر بَيَنَ — «إخراج الشيء عن حيرة الإشكال إلى فضاء الوضوح» (السيوطي).
        ويرد في دستور العلماء: «في اللغة الإظهار». قد يُساعد في التعبير عن «الدلالة الظاهرة».
    - lemma: "إِبَانَة"
      generation_method: ishtiqaq
      justification: >
        مصدر أبانَ — الإظهار والإيضاح. يرد في التوقيف للمناوي: «إظهار المعنى».
        الاشتقاق من الجذر بَيَنَ على وزن إفَالَة — قياسي في العربية للدلالة على الإظهار.
    - lemma: "بُروز"
      generation_method: ishtiqaq
      justification: >
        مصدر بَرَزَ — «ظهور الشيء وبدوّه» (ابن فارس). يُشير إلى الظهور الجليّ الذي يدلّ
        على حضور شيء. يرد في ARABTERM بمعنى «emergence» في سياقات علمية متعددة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تجلي"
      confirm:
        - text: >
            «التّجلّي: [في الانكليزية] Manifestation ،transfiguration [في الفرنسية] Manifestation ،transfiguration.
            في اللغة بمعنى الظهور. وعند السالكين عبارة عن ظهور ذات الله وصفاته.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: >
            «التجلي: أصله الانكشاف، وقد يكون بالذات نحو {وَالنَّهَارِ إِذَا تَجَلَّى}،
            وقد يكون بالأمر والفعل نحو {فَلَمَّا تَجَلَّى رَبُّهُ لِلْجَبَلِ}.
            وعند الصوفية: ما ينكشف للقلوب من أنوار الغيوب.»
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: >
            «التَّجَلِّي: رفع حجب البشرية.»
          source: "معجم مقاليد العلوم للسيوطي"
        - text: >
            «التجلِّي: ما ينكشف للقلوب من أنوار الغيوب، وإنما جمع الغيوب باعتبار تعدد موارد التجلي.»
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: >
            «(تجلى) الشيء تجليا: مطاوع جلاه. والصقر: أغمض عينيه ثم فتحهما ليكون أبصر.
            والشيء: نظر إليه مشرفاً.»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: >
            يُثبت أن «تجلي» مصدر الفعل تجلّى — الفعل يدل على الانكشاف والظهور، ومنه يُشتق الاسم
            بمعنى «الظهور/الانكشاف».
        - text: >
            «تجلّى الشيء: تكشَّف. النهارُ: ظَهَر. الشمسُ: انجلت. الظلامُ: انجلى.»
          source: "المعجم الكبير"
          addition: "يُؤكد الدلالة الأصلية للجذر: الانكشاف والظهور بعد الخفاء."

    - lemma: "مظهر"
      confirm:
        - text: >
            «المظهر: [في الانكليزية] Explicit [في الفرنسية] Apparent ،explicite.
            بفتح الهاء المخففة عند النحاة هو الظاهر.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: >
            «(المظهر) الصورة التي يبدو عليها الشيء والعلاقة.»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: >
            «مَظْهَر: الصورة التي يبدو عليها الشيء والعلاقة.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >
            «المَظْهَرُ: ويقابله المَخْبَرُ. يقال: فلان حسن المظهر.
            ويقال: مظهر متناسق، ومظهر جذاب.»
          source: "المعجم الكبير"
      expands:
        - text: >
            «مَظْهَرٌ سُلوكِيّ = behavioral manifestation;
            مَظْهَرٌ عُصابِيّ = neurotic manifestation;
            مَظْهَرٌ نَفْسِيٌّ فيزيُولوجِيّ = psychophysiologic manifestation;
            مَظْهَرٌ ذُهانِيّ = psychotic manifestation.»
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُثبت الاستخدام الطبي الحديث للمظهر بمعنى «manifestation» في سياقات علمية —
            مما يُبرر انتماءه للمجموعة الترادفية، وإن كان أصل دلالته «الهيئة الخارجية».
        - text: >
            «(1) ظُهور (2) مُثول [أمام القضاء] (3) صدور (4) هيئة؛ مَظْهر
            (5) pl.: مظاهر (6) pl.: دلائل خارجية (7) ظاهرة غريبة.»
          source: "المورد الحديث (2008) — مادة appearance"
          addition: "يُبيّن أن «مظهر» يُقابل appearance بمعانيه المتعددة، وأن المظاهر (الجمع) تُستخدم بمعنى «دلائل خارجية»."

    - lemma: "جَلاء"
      confirm:
        - text: >
            «الجلاء: [في الانكليزية] Brilliance ،manifestation ،transfiguration
            [في الفرنسية] Eclat ،manification ،transfiguration.
            بالكسر: الكحل والضياء. وفي اصطلاح الصوفية: الجلاء هو ظهور الذات القدسية لذاته.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: >
            «الجَلَاء: خروج القوم من أرض إلى أرض. وغلب في أدبيات السياسة في العصر الحديث
            على خروج المستعمرين من البلاد التي احتلوها. الشهادة والبيّنة في المحاكمة.»
          source: "المعجم الكبير"
          conflict: >
            المعنى الراسخ للجلاء في العربية المعاصرة هو «الرحيل/الانسحاب العسكري»، مما يُنشئ
            تعارضاً مع استخدامه بمعنى manifestation؛ خطر الالتباس كبير في النصوص العامة.
        - text: >
            «الجَلَاء: الأمر البيّن الواضح. الشهود والبيّنة في المحاكمة. الكحل.»
          source: "المعجم الوسيط (OCR)"
          conflict: >
            «الجلاء» يدل على الوضوح الذاتي للشيء لا على «الدلالة التي تكشف عن وجود شيء آخر» —
            وهو المقصود في هذه المجموعة. الفارق الدلالي يجعله غير دقيق للمفهوم.

    - lemma: "بَيَان"
      confirm:
        - text: >
            «البَيَان: إِخْرَاج الشَّيْء عَن حيرة الإِشْكَال إِلَى فضاء الوضوح، وَقيل:
            هُوَ الدَّلِيل الَّذِي يُوصِل بِصَحِيح النَّظَر فِيهِ إِلَى علم أَو ظن.»
          source: "معجم مقاليد العلوم للسيوطي"
        - text: >
            «البيان: في اللغة الإظهار. وعند بعض أصحاب الأصول: عبارة عن إظهار المراد للمخاطب
            منفصلاً عما يُستر به.»
          source: "دستور العلماء للأحمدنكري"
        - text: >
            «بيان = Indication»
          source: "المعجم الموحد لمصطلحات الهندسة الكهربائية (مسرد ALECSO)"
      contradicts:
        - text: >
            «(البيان) الحجة والمنطق الفصيح والكلام يكشف عن حقيقة حال، أو يحمل في طياته بلاغاً.
            علم يُعرف به إيراد المعنى الواحد بطرق مختلفة من تشبيه ومجاز وكناية.»
          source: "المعجم الوسيط (OCR)"
          conflict: >
            «بيان» راسخ في الخطاب البلاغي والفصاحة والإعلانات الرسمية. هذه الدلالة السائدة
            تُبعده عن معنى «الدلالة على وجود شيء ما» وتُنشئ التباساً مفهومياً.

    - lemma: "إِبَانَة"
      contradicts:
        - text: >
            «الإِبَانَةُ: الأصحاب. يقال: جاء فلان في إبانته.»
          source: "المعجم الكبير (OCR)"
          conflict: >
            أحد معاني «إبانة» في المعجم الكبير هو «الأصحاب» — وهو معنى بعيد تماماً عن
            «الدلالة على وجود شيء». الاشتراك اللفظي يُضعف هذا المرشح.
        - text: >
            «إبانة = decantation»
          source: "المعجم الموحد لمصطلحات المياه (ARABTERM)"
          conflict: "المصطلح التقني لـ«إبانة» في ARABTERM هو «الترشيح/الترسيب» في الهندسة — لا علاقة بالمفهوم."
      expands:
        - text: >
            «الإبانة: إظهار المعنى للنفس بما لا يمكن إدراكه، وأصله القطع؛ فالإبانة قطع المعنى
            من غيره ليظهر من نفسه.»
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف فلسفي-منطقي متخصص لا يُمثّل الاستخدام العام للمصطلح."

    - lemma: "بُروز"
      contradicts:
        - text: >
            «البروز: الخروج من كل شيء يواري في براز من الأرض وهو الذي لا يكون فيه ما
            يتوارى فيه عن عين الناظر.»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            «البروز» يدل على الظهور المادي الحسي للشيء نفسه، لا على «الدلالة» التي تُشير
            إلى وجود شيء آخر. الفارق الدلالي جوهري.
        - text: >
            «بروز = emergence (بيئة/جيولوجيا/أحياء)؛ بروز = prominence (إعلام)؛
            بروز = eminence (طب).»
          source: "معاجم ARABTERM المتعددة"
          conflict: >
            الترجمات الإنجليزية لـ«بروز» في المصطلحات التقنية (emergence, prominence, eminence)
            لا تُقابل «manifestation» بمعنى AWN — دليل على بُعد المفهوم.


