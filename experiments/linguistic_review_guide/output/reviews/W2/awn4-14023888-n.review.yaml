# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-14023888-n  |  ili: i110509  |  pos: n
# definition_en: the state of serving as an official and authorized delegate or agent
# ═══════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «إنابة» مُحمَّلة بدلالة صوفية/دينية راسخة (الرجوع إلى الله) في سائر المعاجم الكلاسيكية، مما يخلق التباساً دلالياً خطيراً حين تُضمّ إلى سياق التوكيل الإداري."
      - "لمّة «تمثيل» متعددة الدلالة (تمثيل مسرحي، قياس منطقي، تمثيل ضوئي في الأحياء) مما يستوجب تحديد السياق الدلالي المقصود."
      - "التعريف الحالي «حالة العمل كمندوب أو وكيل رسمي ومفوض» ترجمةٌ حرفية للإنجليزية، يفتقر إلى الصياغة المعجمية العربية القائمة على الجنس القريب والفصل النوعي."
      - "لا تشكيل على أيٍّ من اللمّات الثلاث في المجموعة."
    observations: >
      المجموعة تعبّر عن المفهوم القانوني/الإداري لحالة كون الشخص وكيلاً مُفَوَّضاً أو مندوباً رسمياً عن غيره. في التراث الفقهي العربي يُعبَّر عن هذا المفهوم بـ«الوكالة» (وهي الأقوى دلالةً وتوثيقاً) و«التمثيل» في سياقاته البرلمانية والدبلوماسية الحديثة. أما «إنابة» فاستعمالها الغالب في التراث الكلاسيكي للمعنى الصوفي (الرجوع إلى الله والتوبة)، وفي المعاجم القانونية الحديثة تُدرج أحياناً مقرونةً بـ«تفويض» للدلالة على التوكيل، غير أنها تبقى دون «وكالة» و«نيابة» في الشيوع الإداري.

  blind_candidates:
    - lemma: "نِيَابَة"
      generation_method: ishtiqaq
      justification: "مصدر قياسي من الفعل نَابَ يَنُوبُ (الباب الأول من ن-و-ب)، يدلّ على القيام مقام الغير وتعويضه، وهو جوهر المفهوم. الوزن فِعَالَة من أوزان المصادر الدالة على الحالة والمهنة."
    - lemma: "تَفْوِيضٌ"
      generation_method: ishtiqaq
      justification: "مصدر الباب الثاني (فَوَّضَ) من الجذر ف-و-ض، يدلّ على تخويل الصلاحية وردّ الأمر إلى الغير. يُعبِّر عن جانب التخويل الرسمي الوارد في التعريف (مُفَوَّض)."
    - lemma: "اسْتِنَابَة"
      generation_method: ishtiqaq
      justification: "مصدر باب الاستفعال (استَنَابَ) من الجذر ن-و-ب، يدلّ على طلب التوكيل وجعل الغير نائباً. يُعبِّر عن الحالة من زاوية الطرف الموكَّل إليه."
    - lemma: "مَنَابَة"
      generation_method: ishtiqaq
      justification: "مصدر على وزن مَفْعَلَة من الجذر ن-و-ب، يدلّ على حالة الإنابة والنيابة. الوزن منتِج في العربية للدلالة على الحالة والمصدرية الظرفية."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "إنابة"
      contradicts:
        - text: "«الإنابة: إخراج القلب من ظلمات الشبهات. وقيل: الإنابة: الرجوع من الكل إلى من له الكل. وقيل: الإنابة الرجوع من الغفلة إلى الذكر، ومن الوحشة إلى الأنس.»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413م)"
          conflict: "التعريف كله في المعنى الصوفي/الديني (الرجوع إلى الله والتوبة)، لا صلة له بالتوكيل الإداري."
        - text: "«الإنابة: [في الإنجليزية] Devotion, repentance ... عند السالكين هي الرجوع من الغفلة إلى الذكر.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
          conflict: "الترجمة الإنجليزية 'Devotion, repentance' تؤكد المعنى الديني. المعجم يُقابلها بالتوبة لا بالتوكيل."
      expands:
        - text: "«إنابة، تفويض» → delegation"
          source: "المعجم الموحد لمصطلحات القانون (2017)، مسرد ArabTerm"
          addition: "الاستعمال القانوني الحديث يُدرج «إنابة» مقرونةً بـ«تفويض» في سياق التفويض/التوكيل، غير أن الإدراج ضمن قائمة مرادفات لا تعريفاً مستقلاً يُضعف دلالتها الاستقلالية."

    - lemma: "تمثيل"
      confirm:
        - text: "«تمثيل: وكالة لشركة تجارية» → representation"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)، مسرد ArabTerm"
        - text: "«(1) تصوير؛ وصف؛ تمثيل. ... (3) تمثيل. تمثيل مسرحي. تمثيل [برلماني أو دبلوماسي]. ممثلو دائرة انتخابية أو نوّابها»"
          source: "المورد الحديث (2008)، مسرد ArabTerm"
        - text: "«تمثيل» → representation"
          source: "مسرد الفن والتسلية والرياضة، ArabTerm"
        - text: "«تمثيل» → representation (Education, Mathematics, Law)"
          source: "معاجم ArabTerm المتعددة (التربية، الرياضيات، القانون)"
      contradicts:
        - text: "«(التَّمْثِيل) (في علم النبات): عملية حيوية يجريها النبات الأخضر مكوِّناً غذاءه العضوي من عناصر بسيطة في وجود اليخضور والضوء وثاني أكسيد الكربون والماء»"
          source: "المعجم الوسيط لمجمع اللغة العربية، القاهرة (OCR)"
          conflict: "المعجم الوسيط يُخصص «التمثيل» لمعنى التمثيل الضوئي (Photosynthesis) في علم الأحياء، لا للوكالة والتفويض."
        - text: "«التَّمْثِيل: إثبات حكم جزئي في جزئي آخر لمعنى مشترك بينهما»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
          conflict: "المعنى الاصطلاحي الكلاسيكي هو القياس المنطقي (Analogy)، لا التمثيل بمعنى الوكالة."
      expands:
        - text: "«التَّمْثِيل: ... ويطلق على معانٍ: المجاز المركّب، والتشبيه، وقسم من التشبيه وهو التشبيه الذي وجهه منتزع من متعدد»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
          addition: "يُظهر تعدد المعاني الاصطلاحية التقليدية لـ«تمثيل»، مما يستلزم تقييد المعنى المقصود في هذه المجموعة بالسياق الحديث للتمثيل الرسمي."

    - lemma: "وكالة"
      confirm:
        - text: "«الوَكَالَةُ: أن يعهد إلى غيره أن يعمل له عملاً عمل الوكيل ومحلُّه. (محدثة)»"
          source: "المعجم الوسيط لمجمع اللغة العربية، القاهرة (OCR)"
        - text: "«الوكالة: لغة: التفويض إلى الغير، ورد الأمر إليه. وشرعًا: استنابة جائز التصرف مثله فيما له عليه تسلط أو ولاية ليتصرف فيها.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«الوَكالَة: بالكسر والفتح اسم من التوكيل بمعنى التفويض والاعتماد... وشرعًا تفويض التصرف إلى غيره... إقامة أحد غيره مقام نفسه في تصرف شرعي معلوم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
        - text: "«الوَكالة: بالفتح والكسر اسمٌ من التوكيل وهي شرعًا: تفويض أحدٍ أمرَه لآخَر وإقامتُه مقامَه»"
          source: "التعريفات الفقهية للبركتي (ت 1975م)"
        - text: "«وكالة» → agency (Law)"
          source: "المعجم الموحد لمصطلحات القانون (2017)، مسرد ArabTerm"
        - text: "«(1) وكالة / (2) تفويض. وثيقة التفويض: وثيقة تمكِّن شخصًا من التصويت عن شخص آخر أو من العمل باسمِهِ / (3) الوكيل / (4) مُوَكَّلٌ؛ مفوَّض؛ قائمٌ مقامَ»"
          source: "المورد الحديث (2008)، مسرد ArabTerm"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نِيَابَة"
      confirm:
        - text: "«نيابة، تمثيل» → representation (Law)"
          source: "المعجم الموحد لمصطلحات القانون (2017)، مسرد ArabTerm"
      contradicts:
        - text: "«النِّيَابَةُ: هيئة قضائية تقوم بإقامة الدعوى على متَّهم ونحوه نيابةً عن المجنَى عليه, فرداً كان أو مجتمعاً»"
          source: "المعجم الوسيط لمجمع اللغة العربية، القاهرة (OCR)"
          conflict: "المعجم الوسيط يُحدِّد «النيابة» بالمعنى القضائي الحديث (النيابة العامة/الادعاء العام) لا بالمعنى العام للتمثيل والوكالة."
        - text: "«النِّيَابَة: (كسى را نائب خود كردانيدن...) النيابة تجري في العبادات المالية المحضة عند العجز والقدرة»"
          source: "دستور العلماء للأحمدنكري (القرن 18م)"
          conflict: "الاستعمال الكلاسيكي مُقيَّد بالسياق الفقهي للتعبد لا بالتوكيل الإداري العام."
      expands:
        - text: "«مقاييس اللغة — نوب: النُّونُ وَالْوَاوُ وَالْبَاءُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى اعْتِيَادِ مَكَانٍ وَرُجُوعٍ إِلَيْهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر الأصلي يدل على الرجوع والاعتياد، وتحوّل معناه إلى «القيام مقام الغير» بالاستعمال الفقهي. الأصل المعجمي لا يدعم مباشرةً معنى الوكالة الإدارية."

    - lemma: "تَفْوِيضٌ"
      confirm:
        - text: "«نَدْب؛ تفويض» → delegacy"
          source: "المورد الحديث (2008)، مسرد ArabTerm"
        - text: "«تَفْوِيضٌ» → delegation"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية (2020)، مسرد ArabTerm"
        - text: "«تفويض الصلاحية» → delegation of authority (Commerce)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)، مسرد ArabTerm"
        - text: "«تفويض السلطة» → power delegation (Law)"
          source: "المعجم الموحد لمصطلحات القانون (2017)، مسرد ArabTerm"
      contradicts:
        - text: "«التَفْوِيضُ: إخلاء النِّكَاح عَن الْمهر بِإِذن من يستحقّهُ»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
          conflict: "الاستعمال الفقهي الكلاسيكي لـ«تفويض» مُقيَّد بتفويض المهر، وهو معنى خاص لا يتطابق مع التوكيل الإداري."
        - text: "«التفويض: رد الأمر إلى الله والتبرؤ من الحول والقوة، وأصله لغة: رد الأمر إلى الغير لينظر فيه»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          conflict: "التفويض في الاستعمال الكلاسيكي يُركَّز على فعل التخويل ذاته (مصدر الفعل) لا على حالة كون الشخص مُخَوَّلاً، والدلالة على التسليم لله تُضيف التباساً."
      expands:
        - text: "«(1) نَدْبٌ؛ تفويض؛ توكيل / (2) وفدٌ مفوَّض»"
          source: "المورد الحديث (2008)، مسرد ArabTerm"
          addition: "يُظهر أن «delegation» تُترجم عادةً بـ«تفويض وتوكيل» كزوج دلالي، لا بـ«تفويض» منفرداً."

    - lemma: "اسْتِنَابَة"
      expands:
        - text: "«الوصَايةُ: استنابة بعد المَوْت»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
          addition: "الأثر الوحيد الذي يتضمن «استنابة» يُقيِّدها بالوصاية بعد الوفاة، مما يُضيِّق دلالتها عن المفهوم العام للمجموعة."

    - lemma: "مَنَابَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إنابة"
      decision: removed
      decision_reason: >
        المعنى الراسخ لـ«إنابة» في المعاجم الكلاسيكية (الجرجاني، التهانوي) هو المعنى الصوفي/الديني: الرجوع إلى الله والتوبة. لم يُثبت المعجم الوسيط (مرجعنا الأول للفصحى الحديثة) لـ«إنابة» معنى التوكيل الإداري. الإدراج القانوني الوحيد (ARABTERM 412407) يُدرجها مقرونةً بـ«تفويض» لا مستقلة، مما يُرجّح الاستعمال التوضيحي لا المصطلحي. وجود اللمّتين «تمثيل» و«وكالة» يُغطيان المفهوم دون الحاجة إلى لمّة ذات اشتراك لفظي موهِم. يُزال الربط بالمجموعة مع إبقاء المدخل لمعناه الأصيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تمثيل"
      decision: confirmed
      decision_reason: >
        لمّة «تمثيل» بمعنى «التمثيل البرلماني/الدبلوماسي/التجاري» موثقة بقوة في المصادر الحديثة (المورد الحديث، معاجم ARABTERM المتعددة في القانون والتجارة والتربية). وإن كانت المعاجم الكلاسيكية تُثبتها للقياس المنطقي والتمثيل الضوئي، فإن السياق الدلالي المقصود في هذه المجموعة (التمثيل كحالة وكالة رسمية) له شاهد معجمي وافٍ. تجتاز اختبار السكّ (لا يمكن إبدال «تمثيل» بوصف آخر في سياق «التمثيل الدبلوماسي»). تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على جانب المماثلة والمطابقة — الممثِّل يحلّ محل الأصيل بوصف تامّ ويُعبِّر عن إرادته وحقوقه كاملةً. شائع في السياقات البرلمانية والدبلوماسية والتجارية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمْثِيل"

    - lemma: "وكالة"
      decision: confirmed
      decision_reason: >
        «وكالة» هي المصطلح الأكثر توثيقاً وشيوعاً لمفهوم التوكيل والوكالة في التراث الفقهي والحديث؛ موثَّقة في المعجم الوسيط (OCR) والمناوي والتهانوي والبركتي ومعجم القانون والمورد الحديث. تجتاز جميع اختبارات جودة المصطلح (الاطّراد، يُسر التداول، الملاءمة، الاشتقاقية). تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على العلاقة القانونية والتفويض الرسمي — الوكيل يتصرف بموجب عقد أو إذن من الموكِّل في إطار محدد المعالم. شائع في السياقات القانونية والتجارية والفقهية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَكَالَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نِيَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «نيابة» محتملة دلالياً (القيام مقام الغير)، فإن المعجم الوسيط — المرجع الأول للفصحى الحديثة — يُحدِّدها بمعنى «النيابة العامة» (الادعاء القضائي)، وهو ما انصرف إليه الذهن في الاستعمال المعاصر. إدراجها سيوجد التباساً مع المؤسسة القضائية. الجذر المعجمي لا يدعم مباشرةً معنى «الوكالة» كما أثبت ابن فارس. الإدراج القانوني (414153) مزدوج «نيابة، تمثيل» لا مستقل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَفْوِيضٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «تفويض» يدل على فعل التخويل ومنح الصلاحية (عملية)، لا على «حالة كون الشخص وكيلاً» (حالة). السياق الدلالي للمجموعة هو State (حالة)، بينما «تفويض» هو Act (فعل). علاوة على ذلك تدور معانيه الكلاسيكية بين تفويض المهر (الفقه) والتسليم لله (التصوف). الترجمة «delegacy → نَدْب؛ تفويض» في المورد الحديث تُدرجه ضمن قائمة لا تعريفاً استقلالياً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "اسْتِنَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أدلة مستقلة كافية لـ«استنابة» في معنى «حالة الوكالة الرسمية». الأثر الوحيد الموجود يُقيِّدها بالوصاية بعد الوفاة. الجذر واعد ولكن اللفظ لم يتثبَّت معجمياً في الدلالة المطلوبة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مَنَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي مدخل معجمي لـ«منابة» في قاعدة البيانات. اللفظ مقترح نظري على وزن مَفْعَلَة غير مُثبَّت في التراث المعجمي المتاح.
      evidence_assessment:
        case: no_material
