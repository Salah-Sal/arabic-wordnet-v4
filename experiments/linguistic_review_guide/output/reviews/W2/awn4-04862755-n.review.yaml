# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04862755-n  |  ILI: i62503  |  POS: n
# Lemmas: مثالية
# Definition (EN): the quality of being ideal
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الموجودة «مثالية» تفتقر إلى التشكيل الكامل — يجب ضبطها: مِثَالِيَّة."
      - >-
        «مثالية» في الاستعمال العربي الحديث تُحيل في الغالب إلى المذهب الفلسفي
        «المثالية» (Idealism) لا إلى الصفة المجردة «ideality»؛ مما يُفضي إلى اشتراك
        لفظي بين المفهوم الفلسفي والصفة الوصفية.
      - >-
        التعريف الحالي «صفة كون الشيء مثالياً» دوري: يُعرِّف المصدر الصناعي
        بالصفة التي اشتُقّ منها (مثالي ← مثالية)، مما يُفقد التعريفَ قيمتَه المعجمية.
    observations: >-
      المجموعة الترادفية awn4-04862755-n تمثّل مفهوم «ideality»، وهو صفة مجردة تدلّ
      على بلوغ الشيء مرتبة المثال الأعلى النظري أو النموذج الذي يُحتذى به. تقع
      المجموعة تحت الفائق المباشر «جَوْدَة / نَوْعِيَّة» (صفة جوهريّة ومميِّزة) ما يجعل
      المفهوم تخصيصاً له نحو الكمال النظري والنمذجة. الجذر العربي م-ث-ل يحمل أصلاً
      دلالة المناظرة والمماثلة، ويمتدّ عبر المِثال (النموذج) إلى المِثَالِيَّة (صفة
      التطابق مع النموذج). اللمّة لغةً سليمة اشتقاقاً لكنّ إشكالية الاشتراك مع
      Idealism تستوجب التنبيه في الوثائق المصاحبة.

  blind_candidates:
    - lemma: "كَمَالِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي (فَعَالِيَّة) مشتقّ من «كَمَال» (الجذر: ك-م-ل) الذي يدلّ في مقاييس
        اللغة على «تمام الشيء»؛ يُعبِّر عن صفة بلوغ درجة الكمال. يختلف عن «مثالية»
        بتركيزه على التمام والإنجاز لا على المحاكاة النموذجية.
    - lemma: "نَمُوذَجِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من «نَمُوذَج» (مُعرَّب متأصّل) على وزن فَعُولَلِيَّة. يدلّ على
        صفة كون الشيء نموذجاً يُحتذى به. أقرب للمعنى العلمي لـ ideality من حيث
        الإحالة إلى الكمال النظري القابل للاتّباع.
    - lemma: "تَمَامِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من «تَمَام» (الجذر: ت-م-م) يدلّ على خاصية الاكتمال التام.
        يُعبِّر عن البُعد الكمّي لـ ideality (لا شيء ينقص) مقابل البُعد النوعي
        (المطابقة للنموذج) الذي تؤدّيه «مثالية».
    - lemma: "أَفْضَلِيَّة"
      generation_method: majaz
      justification: >-
        إحياء دلالي من الجذر ف-ض-ل؛ «الفضل» في أصله يدلّ على الزيادة والتميّز
        والسمو على الأقران، وهو مناسب مجازاً للدلالة على صفة التفوّق النوعي التي
        يحملها المفهوم. غير أنّ استعمالها الحديث انحصر في «الأولويات التفضيلية»
        مما قد يُوجِد انزياحاً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "مثالية"
      confirm:
        - text: >-
            «(1) «أ», المثالية: «ب» كون الشيء مثاليًا. «ج» وجود في الفكرة فحسب
            (2) شيء خياليّ: مفهوم غير واقعي.»
          source: "المورد الحديث (2008) — مقابل ideality"
      contradicts:
        - text: "«مثالية» بترجمة: idealism"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          conflict: >-
            يُترجَم المدخل هنا بـ «idealism» (المذهب الفلسفي القائل بأسبقية الفكر على
            المادة)، لا بـ «ideality» (صفة المثالية كخاصية وصفية)؛ مما يكشف عن
            اشتراك لفظي راسخ في المعاجم الحديثة.
        - text: "«مثالية» بترجمة: idealism"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: >-
            المعجم الفلسفي يُخصّص «مثالية» للمذهب الفلسفي تحديداً، وهو أبعد سياقاً
            عن الصفة الوصفية المقصودة في هذه المجموعة.
        - text: >-
            «اتجاه فكري يقول بأسبقية الأشكال المجردة أو التمثلات الذهنية على الواقع.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مقابل idealism"
          conflict: >-
            التعريف ينصبّ على المذهب الفلسفي (idealism) لا على الصفة الوصفية
            (ideality)، يؤكّد الاشتراك اللفظي.
      expands:
        - text: >-
            «المثالية؛ المذهب المثالي: «أ» القول بأن الحقيقة المطلقة كامنةٌ في عالم
            يتعدى عالم الظواهر. «ب» القول بأن الطبيعة الأساسية للحقيقة كامنةٌ في
            الوعي أو العقل. «ج» التعلّق بالمُثُل العليا. «د» نظرية في الأدب والفنّ
            تعطي مظاهر الجمال المثالية أو الذاتيّة قيمة أعظم من تلك التي تعطيها
            الصفات الشكلية أو المُحَسَّة.»
          source: "المورد الحديث (2008) — مقابل idealism (مدخل مجاور)"
          addition: >-
            يُظهر المدخل المجاور تنوّع دلالات اللفظ وخطر الاشتراك؛ المعنى «ج»
            (التعلّق بالمُثُل العليا) أقرب ما يكون من دلالة ideality في السياق
            الأخلاقي والجمالي.

    # ── مرشحات المرحلة ١ ──
    - lemma: "كَمَالِيَّة"
      contradicts:
        - text: "«مذهب النزوع الى الكمال»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا — مقابل perfectionism"
          conflict: >-
            «كمالية» في المعجم العلمي الحديث تُخصَّص لـ «perfectionism» (مذهب
            النزوع إلى الكمال)، وهو مفهوم أخلاقي/نفسي مختلف عن «ideality» الوصفية.
      expands:
        - text: "«كَمَالِيَّة: من (ك م ل) نسبة إلى كَمَال»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >-
            الموسوعة تُقدِّم «كمالية» باعتبارها مجرد نسبة إلى «كمال»، دون تحميلها
            حمولة اصطلاحية؛ مما يعني أنّ الدلالة الاصطلاحية في المعاجم العلمية
            تخصّصت في perfectionism.

    - lemma: "نَمُوذَجِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَمَامِيَّة"
      evidence_status: "no_material_found"

    - lemma: "أَفْضَلِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "مثالية"
      decision: confirmed
      decision_reason: >-
        رغم الاشتراك اللفظي مع «idealism»، فإنّ «مثالية» هي الترجمة الأمثن
        المتداولة لـ «ideality» في المعجمية العربية الحديثة. يشهد لذلك المورد
        الحديث (2008) الذي يُدرجها صراحةً مقابلاً لـ «ideality» بمعنى «كون الشيء
        مثاليًا». الجذر م-ث-ل راسخ ودلالته على المحاكاة والنموذج وثيقة الصلة بالمفهوم.
        تستوجب الإبقاءَ مع تصحيح التشكيل وتحسين التعريف.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphology_check:
        pattern: "فِعَالِيَّة (مصدر صناعي)"
        root: "مثل"
        fitness: "الوزن فِعَالِيَّة مناسب للمفاهيم المجردة الاسمية؛ يدلّ على الخاصية الذاتية للشيء."
      borrowing_check:
        loan_type: native
        calque_risk: >-
          ليست ترجمة حرفية عمياء؛ الجذر عربي أصيل. غير أنّ الاشتراك مع idealism
          ناجم عن توسيع دلالي غير مضبوط في مرحلة التوحيد المصطلحي.
      nuance_differentiation: >-
        المجموعة تحتوي على لمّة مفردة. تتميّز «مِثَالِيَّة» عن الفائق «جَوْدَة» في كونها
        تُشير إلى الكمال النظري المطلق ومطابقة المثل الأعلى، لا إلى الجودة النسبية
        القابلة للمقارنة. وتتميّز عن «نَوْعِيَّة» في كونها صفة أُحادية البُعد (بلوغ
        النموذج) لا وصفاً للطابع أو الهوية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِثَالِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "كَمَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        المعاجم العلمية الحديثة خصّصت «كمالية» لترجمة «perfectionism» (مذهب النزوع
        إلى الكمال)، وهو مفهوم نفسي/أخلاقي مختلف عن «ideality». إدراجها في هذه
        المجموعة سيُفضي إلى خلط اصطلاحي بين مجموعتين ترادفيتين مستقلّتين.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "نَمُوذَجِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود لهذه اللمّة في أيٍّ من المعاجم العربية المستعلَمة. لم يُثبت
        التثبيت المعجمي لها كوحدة مسكوكة، وهي تنجح في اختبار الاستبدال (يمكن
        إبدال «نموذجية» بـ «مثالية» في أغلب السياقات)، مما يُضعف تمايزها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تَمَامِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود لهذا اللفظ بهذه الصيغة في المعاجم المستعلَمة. يُركِّز على بُعد
        الاكتمال الكمّي (لا شيء ناقص) لا على بُعد المطابقة النموذجية الذي يُميِّز
        ideality؛ لذا هو بُعيد عن المفهوم المحوري للمجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "أَفْضَلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        في الاستعمال المعاصر «أفضلية» تعني «priority» أو «preference» (الأولوية
        التفضيلية) لا «ideality». الانزياح الدلالي الحادث أبعدها عن المجاز المطلوب.
        كذلك لا وجود لها في المعاجم بالمعنى المنشود.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


