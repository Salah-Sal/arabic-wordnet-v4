# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'اعتماد' مُتعدِّدة الدلالات في الاستعمال المعاصر: يُستخدم أكثر ما يُستخدم بمعنى accreditation (الاعتماد الدبلوماسي، الاعتماد الأكاديمي)، لا بمعنى dependence؛ مما يُفضي إلى تنافس دلالي يُضعف دقة الربط"
      - "اللمّتان خاليتان من التشكيل في synset_info مخالفةً لمتطلبات جودة المجموعة"
      - "التعريف الحالي دائري بالنسبة للمّة 'اعتماد': يستخدم المصدر نفسه في الشرح ('حالة الاعتماد على...')"
    observations: "المجموعة تصف مفهوماً راسخاً في العربية هو حالة التعلق بالغير والخضوع لسلطته. الجذران المستخدمان — عمد وتبع — كلاهما أصيل. غير أن 'اعتماد' يعاني من ثقل دلالي ناحية 'accreditation' في المعاجم التقنية الحديثة، بينما 'تبعية' أصرح توصيفاً للمفهوم المقصود وأبعد عن الالتباس. يحتاج التعريف إلى مراجعة لإزالة الدوران ولتلائم أسلوب المعجم الوسيط."
  blind_candidates:
    - lemma: "اتِّكَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الفعل اتَّكَل (وزن افتعل من وكل)، يصف حالة الاعتماد الكامل على الغير وعجز الاستقلال. الوزن -يَّة يُحوِّله إلى اسم مجرد يدل على الحالة أو السمة، مما يجعله مطابقاً وظيفياً لـ dependence"
    - lemma: "تَذَيُّل"
      generation_method: majaz
      justification: "مصدر تذيَّل من الذَّيل؛ يُشبَّه التابع الخاضع بالذيل الملحق بجسمه لا يستقل عنه. مجاز وظيفي يصف حالة الإلحاق والتبعية عبر إزاحة دلالية من الشكل الجسدي إلى العلاقة السلطوية"
    - lemma: "اسْتِنَادِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من استند (وزن استفعل من سند)، يُشير إلى الحالة التي يتكئ فيها الكائن على غيره في قيامه ووجوده؛ يُبرز بُعد الدعم والقِوام الذي يقدمه الطرف الآخر"
    - lemma: "خُضُوعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من خضع، يُبرز الجانب السلطوي للمفهوم: كون الكائن خاضعاً لسيطرة غيره وتحت ولايته؛ يُغطي المحور الثاني من التعريف (being controlled by)"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت:
#   Q1 — مطابقة دفعية: اعتماد + تبعية + المرشحات الأربعة (بصيغتي ال- وبدونها)
#   Q2 — جسر إنجليزي: dependence | dependance | dependency | reliance | subordination
#   Q3 — إثراء بالمعرِّف: تعريفات وشواهد لعينة المداخل الأساسية
#   Q4 — مقاييس اللغة: جذرا عمد وتبع من معجم ابن فارس (dictionary_id=151)
stage2_evidence:
  per_lemma:

    - lemma: "اعتماد"
      confirm:
        - text: "«اعْتِماد» [translation_en: dependence] — المعجم الطبي الموحد (2009)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«اعْتِماد» [translation_en: dependency] — المعجم الطبي الموحد (2009)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(2) «أ» اعتماد؛ اتكال. «ب» تَبَعيّة» [مدخل ترجمته: dependence]"
          source: "المورد الحديث (2008)"
        - text: "«اعتماد [على] — الحالةُ التي يرتبطُ فيها تعريفُ كيانٍ أو وظيفته بعتاديات أو برمجيات أو بأحداث محدَّدة» [translation_en: dependence]"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«الإسناد واللجوء إلى الشيء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«اعتماد» [translation_en: accreditation] — «الموافقة والتأكيد على حقيقة أن وثائق التفويض التي قدمها مندوب من دولة أو مؤسسة معينة مقبولة وفقاً للقواعد المعمول بها»"
          source: "مسرد المناخ والبيئة — ALECSO"
          conflict: "الاستخدام الأكثر شيوعاً لـ'اعتماد' في المعاجم التقنية الحديثة (التعليم، القانون، الصحة، الكهرباء) هو 'accreditation' لا 'dependence'؛ وجود أكثر من عشرة مداخل ARABTERM تترجمه بـ accreditation مقابل ثلاثة فقط بـ dependence/dependency"
      expands:
        - text: "«اعتماد نفسيّ أو فيزيولوجيّ على مادة أو دواء، مع ميل مترقٍّ لزيادة كميته بالتدريج» [translation_en: addiction]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يُثبت أن دلالة 'اعتماد' على التبعية النفسية والجسدية راسخة في المعجمية الطبية، ويُوسّع المفهوم ليشمل التعلق المَرَضي"
        - text: "«اعتمادٌ على التجهيزة — تَطلُّبُ وجود تجهيزةٍ ما أو تَوفُّرها لاستخدام برنامجٍ أو واجهة» [translation_en: device dependence]"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يكشف عن توسّع دلالة 'اعتماد على' في السياق التقني ليصف العلاقة البنيوية بين الأنظمة"

    - lemma: "تبعية"
      confirm:
        - text: "«(التَّبِعِيَّة) كَوْنُ الشَّيْء تَابِعاً لِغَيْرِهِ»"
          source: "المعجم الوسيط"
        - text: "«تبعية» [translation_en: dependence (dependency)]"
          source: "مسرد الجغرافيا والتاريخ — ALECSO"
        - text: "«تبعية» [translation_en: dependency]"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«تبعية» [translation_en: Dependance]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«(1) توقُّف على (2) «أ» اعتماد؛ اتكال. «ب» تَبَعيّة» [مدخل dependency]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«قيام الأجير بعمله تحت إشراف وتوجيه المشغل وتحت رقابته» [translation_en: subordination]"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يُوسّع المعنى ليشمل العلاقة الهرمية الوظيفية في إطار علاقات العمل، مؤكداً الطابع السلطوي للمصطلح"
        - text: "«في الصواتة: التبعية، تحليل انطلاقاً من مفهوم السبق ويحتوي عاملاً ومعمولاً أو مراقِباً ومراقَباً» [translation_en: Dependance]"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُثبت توظيف المصطلح في علم اللسانيات للدلالة على علاقة الحاكم بالمحكوم نحوياً"
        - text: "«اقتصاديات التبعية — يتوقف اقتصاد دولة ما على اقتصاد دولة أخرى ويترابط معه ترابطاً لا يمكن الانفكاك عنه بحيث يصبح مكملاً له» [translation_en: dependency economics]"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "يؤكد شيوع 'تبعية' في السياق الاقتصادي والسياسي بدلالة راسخة على علاقة التبعية الهيكلية"

    - lemma: "اتِّكَالِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَذَيُّل"
      contradicts:
        - text: "«تذيَّل فلان: جرَّ ذيله مُتبخْتِراً. انبسطت الدابةُ: حرَّكت ذنبها»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: "تذيَّل فعل قاصر عن الدلالة على التبعية: معناه المثبَت هو الجرّ والتبختر وحركة الذيل، لا الارتباط بالغير وعجز الاستقلال. فضلاً عن كونه فعلاً لا اسماً في المعاجم"

    - lemma: "اسْتِنَادِيَّة"
      evidence_status: "no_material_found"

    - lemma: "خُضُوعِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "اعتماد"
      decision: confirmed
      decision_reason: "رغم التنافس الدلالي مع 'accreditation'، ثمة أدلة معجمية صريحة على استخدام 'اعتماد' بمعنى dependence/dependency: المعجم الطبي الموحد يُدرجه مباشرةً بهذه الترجمة، والمورد الحديث يُعطيه ضمن مقابلات dependence، ومعجم المعلوماتية يُعرِّفه بـ'الحالة التي يرتبط فيها تعريف كيان بغيره'. الجذر عمد (= الاستقامة والإسناد) يُسند الدلالة. يُبقى في المجموعة مع تصحيح التشكيل وتوثيق الفرق الدلالي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الاعتماد الجانب الوظيفي والإسنادي: الشيء يستند إلى غيره ليؤدي وظيفته أو يستمر وجوده، ويكثر في السياق الطبي والنفسي (اعتماد على دواء) والتقني والعلمي؛ بخلاف التبعية التي تُبرز الهرمية السلطوية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اعْتِمَاد"

    - lemma: "تبعية"
      decision: confirmed
      decision_reason: "أدلة قوية وصريحة لا لبس فيها: المعجم الوسيط يُعرِّفها مباشرةً بـ'كون الشيء تابعاً لغيره'، وتترجم dependence/dependency في معاجم الجغرافيا والقانون واللسانيات والاقتصاد. الجذر تبع (التُّلُوّ والقَفْو) يُسند الدلالة بوضوح. يُبقى مع تصحيح التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُبرز التبعية الجانب السلطوي والهرمي: الشيء في مرتبة دون غيره خاضع لإشرافه أو سيطرته، ويكثر في السياق السياسي والقانوني والاقتصادي (تبعية سياسية، تبعية اقتصادية، تبعية عمالية)؛ بخلاف الاعتماد الذي يُبرز حاجة الشيء الوظيفية لا الهرمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَبَعِيَّة"

    - lemma: "اتِّكَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على المصطلح في أي من المعاجم المستعلَمة. وإن كان قابلاً للاشتقاق النظري من وكل/اتّكل، فإنه غير مسكوك ولا متداول في المكتبة المعجمية، وكلا اللمّتين الموجودتَين يُغطيان المفهوم بصورة كافية"

    - lemma: "تَذَيُّل"
      source: stage1
      decision: removed
      decision_reason: "المعجم يُثبته فعلاً قاصراً بمعنى الجرّ والتبختر وحركة الذيل — وهو معنى بعيد كل البعد عن مفهوم الاعتماد/التبعية. اختبار الاستبدال يفشل؛ والمجاز المُفترَض لا يُعرّف عنه في المعاجم في هذا الاتجاه"

    - lemma: "اسْتِنَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على المصطلح في المعاجم. غير مسكوك، والمفهوم مُغطّى بالمصطلحَين الموجودَين"

    - lemma: "خُضُوعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على المصطلح في المعاجم. الخضوع مُكوِّن في المفهوم لكنه لا يستقل عنه لمّةً مستقلة، والتبعية تُغطيه مع زيادة الدلالة الهرمية"


