        examples:
          - text: "تُعَدُّ (الْعَائِلَةُ) أُصْنُوفَةً بَيْنَ الرُّتْبَةِ وَالْجِنْسِ فِي هَرَمِ التَّصْنِيفِ الْحَيَوِيِّ."
            type: usage
      - lemma: "مَجْمُوعَة تَصْنِيفِيَّة"
        examples:
          - text: "يَضَعُ عُلَمَاءُ الْأَحْيَاءِ الْكَائِنَاتِ ذَاتَ الصِّفَاتِ الْمُشْتَرَكَةِ فِي مَجْمُوعَةٍ تَصْنِيفِيَّةٍ وَاحِدَةٍ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تُعَدُّ (الْعَائِلَةُ) أُصْنُوفَةً بَيْنَ الرُّتْبَةِ وَالْجِنْسِ فِي هَرَمِ التَّصْنِيفِ الْحَيَوِيِّ."}
      - command: add_sense_example
