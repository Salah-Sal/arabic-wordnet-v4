stage1_review:
  assessment:
    concerns:
      - غياب المصطلح العلمي المفرد الدقيق "أصنوفة" (Taxon) والاكتفاء بالمركبات الوصفية.
      - الحاجة لضبط التعريف ليكون أكثر اصطلاحية ودقة بدلاً من الوصف العام.
    observations: "المجموعة الترادفية تغطي مفهوماً جوهرياً في علم التصنيف (Taxonomy). اللمات الموجودة صحيحة لغوياً لكنها تمثل ترجمات حرفية مركبة. يتطلب الإثراء إضافة المصطلح العربي المعتمد في المجامع اللغوية (أصنوفة) وتوثيق الفوارق الدلالية بين الفئة والوحدة والمجموعة."
  blind_candidates:
    - lemma: "فِئَة تَصْنِيفِيَّة"
      generation_method: tarkib
      justification: "ترجمة اصطلاحية لـ taxonomic category، حيث تُستخدم 'فئة' للدلالة على مستوى معين في نظام التصنيف."
    - lemma: "مَرْتَبَة تَصْنِيفِيَّة"
      generation_method: tarkib
      justification: "ترجمة لـ taxonomic rank، تعبر عن الموقع الهرمي للكائن الحي في سلم التصنيف."
    - lemma: "أُصْنُوفَة"
      generation_method: majaz
      justification: "على وزن أفعولة (من الجذر صنف)، وهو المصطلح المعتمد في المعاجم العلمية الحديثة (كالمعجم الطبي الموحد) لترجمة Taxon."
    - lemma: "تَاكْسُون"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح العالمي Taxon، يُستخدم في بعض السياقات العلمية الأكاديمية."

stage2_evidence:
  per_lemma:
    - lemma: "مَجْمُوعَة تَصْنِيفِيَّة"
      confirm:
        - text: "الأُصنوفة: مجموعةٌ أو وحدة تصنيفيّة."
          source: "المورد الحديث (2008)"
    - lemma: "وَحْدَة تَصْنِيفِيَّة"
      confirm:
        - text: "الأُصنوفة: مجموعةٌ أو وحدة تصنيفيّة."
          source: "المورد الحديث (2008)"
    - lemma: "أُصْنُوفَة"
      confirm:
        - text: "مصطلح عام لفئة منهجية (تصنيفية) في علم الأحياء (على سبيل المثال: سلالة، نوع، نظام، أسرة)."
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "الأُصْنوفَة (taxon): مجموعة أو وحدة تصنيفية."
          source: "المورد الحديث"
      expands:
        - text: "أَصانيف [ف:أُصْنوفَة]: taxa (sing. taxon)."
          source: "المعجم الطبي الموحد (2009)"
          addition: "توثيق صيغة الجمع (أصانيف)."
    - lemma: "فِئَة تَصْنِيفِيَّة"
      confirm:
        - text: "(Class): مرتبة تصنيفية في عِلْم التصنيف أدنى من الشعبة وأعلى من الرتبة."
          source: "المعجم الكبير"
          addition: "يؤكد استخدام 'مرتبة تصنيفية' و'فئة تصنيفية' كواصفات للمستويات التصنيفية."

