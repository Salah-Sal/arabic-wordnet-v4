stage4_content:
  definition:
    current: "مجموعة حيوانيّة أو نباتيّة ذات علاقات طبيعيّة"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط؛ يحتاج إلى صياغة اصطلاحية تربطه بنظام التصنيف الحيوي."
    authored:
      - type: terminological
        text: "فِئَةٌ أَوْ وِحْدَةٌ فِي نِظَامٍ تَصْنِيفِيٍّ لِلْكَائِنَاتِ الْحَيَّةِ تَعْتَمِدُ عَلَى صِفَاتِهَا وَعَلَاقَاتِهَا الطَّبِيعِيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08008892-n", definition_index: 0, text: "فِئَةٌ أَوْ وِحْدَةٌ فِي نِظَامٍ تَصْنِيفِيٍّ لِلْكَائِنَاتِ الْحَيَّةِ تَعْتَمِدُ عَلَى صِفَاتِهَا وَعَلَاقَاتِهَا الطَّبِيعِيَّةِ."}
  examples:
