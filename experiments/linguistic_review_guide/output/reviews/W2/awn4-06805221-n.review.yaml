# ── المرحلة ١: المراجعة والتوليد (أعمى) ────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة «إشارة تحذير من العاصفة» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ تفشل اختبار الإحلال إذ يمكن إبدال «تحذير» بـ«إنذار» أو «تنبيه» دون خسارة الدلالة، مما يكشف أنها وصف لا مصطلح."
      - "التعريف العربي الحالي ترجمة شبه حرفية للتعريف الإنجليزي، وتوظيف الأقواس التوكيدية «(خاصة عاصفة شديدة العنف)» غير معجمي."
      - "المجموعة تخلو من أي مصطلح تقني مُعتمد في معاجم الأرصاد الجوية أو علوم البحار."
    observations: "المفهوم — إشارة تُرفع أو تُطلَق إعلاناً باقتراب عاصفة شديدة — ذو جذر بحري وأرصادي واضح. المصطلح الإنجليزي storm signal يستدعي من العربية التقنية تركيباً إضافياً من رأس المجموعة الأعلى (إشارة) مع محدِّد من حقل العواصف. المولَّدات الأعلى احتمالاً: الاشتقاق من نذر على وزن فَعِيل (نذير)، أو التركيب الإضافي من «إنذار/إشارة» + اسم العاصفة. ينبغي إيثار ألفاظ المجال البحري التراثية (الزوبعة، الإعصار) على الترجمة الحرفية."
  blind_candidates:
    - lemma: "نَذِيرُ الإِعْصَارِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «نَذِير» (اسم من جذر نذر، وزن فَعِيل بمعنى المنذِر والمخوِّف) + «الإعصار» (الريح الشديدة المستديرة). قياساً على النمط الإنتاجي «نذير النار» = fire alarm، يصبح «نذير الإعصار» الإشارة التحذيرية من الإعصار."
    - lemma: "إِنْذَارُ الزَّوَابِعِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «إِنْذَار» (مصدر IV من نذر، بمعنى الإبلاغ المقرون بالتخويف) + «الزَّوَابِع» (جمع زوبعة، اللفظ التراثي للعاصفة المتدوّرة). تجنَّبت «العاصفة» الواردة في التعريف لإيثار المفردة التراثية."
    - lemma: "مُنْذِرُ الأَعَاصِيرِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «مُنذِر» (اسم فاعل من الرباعي أنذر، وزن مُفعِل بمعنى الجهاز أو الإشارة التي تُنذر) + «الأعاصير» (جمع إعصار). يُؤثر على «مُنذِر العاصفة» إذ الأعاصير أكثر تحديداً لشدّة الظاهرة."
    - lemma: "بَلَاغُ الرِّيحِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «بَلَاغ» (اسم من جذر بلغ، بمعنى البيان الرسمي المُذاع — معجم الوسيط) + «الريح» (مجاز عن العاصفة). «البلاغ» في الاصطلاح الحديث للإعلانات الرسمية، فيكون «بلاغ الريح» الإشارة الرسمية المُصدَرة عند اقتراب العاصفة."


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1: مطابقة دفعية للمّات الموجودة والمرشحات ومفرداتها (headword_norm)
#   Q2: جسر إنجليزي — translation_en:"storm signal" OR "storm warning" OR "gale warning" OR "cyclone warning"
#   Q3: FTS عربي — "اشارة" OR "اعصار" OR "انذار" OR "عاصفه" OR "نذير"
#   Q4: مقاييس اللغة — جذور نذر، شور، حذر، بلغ، عصر، عصف
stage2_evidence:
  per_lemma:

    - lemma: "إشارة تحذير من العاصفة"
      expands:
        - text: "«الإِنْذَارُ: الإعلام بما يُحذَر. قال ابن عطية: ولا يكاد يكون إلا في تخويف يسع زمانه الاحتراز، فإن لم يسع كان إشعاراً»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: "يُبيّن أن «التحذير» و«الإنذار» يشتركان في الدلالة على التخويف المقرون بسعة الوقت للاحتراز؛ يؤكد ملاءمة الحقل الدلالي للمة الحالية."
        - text: "«شُرْتُ الدَّابَّةَ شَوْرًا إذا عَرَضْتَهَا. وَالْمَكَانُ الَّذِي يُعْرَضُ فِيهِ الدَّوَابُّ هُوَ الْمِشْوَارُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يكشف أصل «إشارة» من شور بمعنى إبداء الشيء وعرضه؛ ملاءمة عميقة لمفهوم الإشارة المرئية التي تُعرض للعموم."

    - lemma: "نَذِيرُ الإِعْصَارِ"
      confirm:
        - text: "«نذير النار: أداة تُنذر أو تُعلم بنشوب النار في موضع ما»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«النُّونُ وَالذَّالُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى تَخْوِيفٍ أَوْ تَخَوُّفٍ. مِنْهُ الْإِنْذَارُ: الْإِبْلَاغُ; وَلَا يَكَادُ يَكُونُ إِلَّا فِي التَّخْوِيفِ. وَتَنَاذَرُوا: خَوَّفَ بَعْضُهُمْ بَعْضًا. وَالنَّذِيرُ: الْمُنْذِرُ، وَالْجَمْعُ النُّذُرُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن وزن فَعِيل من جذر نذر يفيد المنذِر (الجهاز/الشخص)، وأن النمط الإضافي «نذير + X» منتج بدلالة «نذير النار»؛ غير أن التركيب «نذير الإعصار» ليس مُسجَّلاً في معجم تقني."

    - lemma: "إِنْذَارُ الزَّوَابِعِ"
      contradicts:
        - text: "«إِنذَار بِعَاصِفَة» [المقابل المعتمد لـstorm warning في معجم الأرصاد ومعجم علوم البحار]"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999) / المعجم الموحد لمصطلحات علوم البحار (2000)"
          conflict: "المعاجم التقنية تستعمل صيغة «إنذار بـ + اسم» لا التركيب الإضافي المجرد، وتُوظِّف «عاصفة» لا «زوابع»؛ مما يجعل «إنذار الزوابع» مخالفاً للصيغة المعيارية المعتمدة."

    - lemma: "مُنْذِرُ الأَعَاصِيرِ"
      evidence_status: "no_material_found"

    - lemma: "بَلَاغُ الرِّيحِ"
      contradicts:
        - text: "«(الْبَلَاغ) التَّبْلِيغُ... وَبَيَانٌ يُذَاعُ فِي رِسَالَةٍ وَنَحْوِهَا (مج)»"
          source: "المعجم الوسيط (رواية المجمع)"
          conflict: "«البلاغ» يدلّ على الإيصال والإبلاغ الكتابي أو الإذاعي، لا على الإشارة البصرية أو الصوتية المُشفَّرة. استخدامه ترجمةً لـstorm signal يُغفل عنصر التشفير الحركي (الأعلام، الأضواء) الذي يُميّز المفهوم."

    # ─── لمة مكتشفة من الأدلة (جسر إنجليزي — معجم علوم البحار) ───
    - lemma: "إِشَارَةُ إِعْصَارٍ"
      confirm:
        - text: "«إشارة إعصار» [مُعتمَد مقابلاً مباشراً لـstorm signal في معجم علوم البحار]"
          source: "المعجم الموحد لمصطلحات علوم البحار (ALECSO، 2000)"
        - text: "«إِنذَار بِعَاصِفَة» [مُعتمَد مقابلاً لـstorm warning في معجم الأرصاد ومعجم علوم البحار]"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999) / علوم البحار (2000)"
      expands:
        - text: "«الشِّينُ وَالْوَاوُ وَالرَّاءُ أَصْلَانِ مُطَّرِدَانِ، الْأَوَّلُ مِنْهُمَا إِبْدَاءُ شَيْءٍ وَإِظْهَارُهُ وَعَرْضُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن جذر شور يدلّ على الإبداء والإظهار والعرض؛ يمنح المصطلح «إشارة إعصار» عمقاً اشتقاقياً أصيلاً لمفهوم الإشارة المرئية."
        - text: "«الْعَيْنُ وَالصَّادُ وَالرَّاءُ أُصُولٌ ثَلَاثَةٌ صَحِيحَةٌ... وَالْإِعْصَارِ: الْغُبَارُ الَّذِي يَسْطَعُ مُسْتَدِيرًا; وَالْجَمْعُ الْأَعَاصِيرُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُبيّن أن جذر عصر يدلّ بمشتقّه الإعصار على الريح الشديدة المستديرة؛ يؤسّس للاستعمال التقني الحديث."


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إشارة تحذير من العاصفة"
      decision: confirmed
      decision_reason: "اللمة الوحيدة الموجودة تصف المفهوم وصفاً دقيقاً وإن كانت عبارة وصفية لا مصطلحاً مسكوكاً. تُبقى بوصفها الصيغة الموسَّعة المقروءة مع تصحيح التشكيل، ريثما يكتسب المصطلح التقني «إشارة إعصار» المُضاف انتشاراً كافياً في AWN4."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "صيغة وصفية موسَّعة تُصرّح بطبيعة الإشارة (تحذير) وموضوعها (العاصفة)، مناسبة للسياق الإعلامي والتعليمي العام. تختلف عن «إشارة إعصار» في كونها تعبيراً حراً لا مصطلحاً مسكوكاً، وفي استعمال «عاصفة» العامة بدلاً من «إعصار» الأكثر تحديداً في السياق البحري."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَةُ تَحْذِيرٍ مِنَ الْعَاصِفَةِ"

    - lemma: "إِشَارَةُ إِعْصَارٍ"
      source: evidence
      decision: confirmed
      decision_reason: "مصطلح تقني مُعتمَد في المعجم الموحد لمصطلحات علوم البحار (ALECSO 2000) مقابلاً مباشراً لـstorm signal. يجمع بين «إشارة» (رأس المجموعة الأعلى في AWN4) و«إعصار» (الريح الشديدة)، ويمثّل وحدة معجمية إضافية ثابتة في السياق البحري الأرصادي. يجتاز اختبار السكّ: إبدال «إعصار» بـ«عاصفة» يُنتج صيغة مختلفة وليس مرادفاً معجمياً. يجتاز فحص الاقتراض المفهومي: البنية الإضافية عربية وجذرا المركب من أصيل اللغة. يجتاز بوابة جودة المصطلح: الاطّراد (إشارة + X شائع)، يُسر التداول، الملاءمة، إيثار الجذر العربي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح التقني المسكوك المعتمد في معجم علوم البحار؛ أقصر وأدق، يُستخدم في السياق البحري والأرصادي الرسمي. يركّز على طبيعة الظاهرة المنذَر منها (الإعصار) مباشرةً دون المرور بمفهوم وسيط كـ«التحذير»."
      actions:
        - command: create_entry
          params:
            lemma: "إِشَارَةُ إِعْصَارٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نَذِيرُ الإِعْصَارِ"
      source: stage1
      decision: removed
      decision_reason: "النمط الاشتقاقي صحيح وموثَّق في «نذير النار» = fire alarm، غير أن «إشارة إعصار» مُعتمَد رسمياً في معجم علوم البحار مقابلاً مباشراً لـstorm signal وهو أولى. «نذير الإعصار» غير مُسجَّل في أي معجم تقني بوصفه وحدة ثابتة."

    - lemma: "إِنْذَارُ الزَّوَابِعِ"
      source: stage1
      decision: removed
      decision_reason: "المعاجم التقنية المعتمدة تستعمل «إنذار بعاصفة» (بحرف الجر) لا التركيب الإضافي المجرد، وتُوظّف «عاصفة» لا «زوابع». الصيغة المُولَّدة مخالفة للاستعمال التقني الموثَّق ولا شاهد عليها."

    - lemma: "مُنْذِرُ الأَعَاصِيرِ"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على هذا التركيب في قاعدة البيانات. «مُنذِر» في الشواهد الموجودة بمعنى premonitory (طبي)، وهو بعيد عن حقل الإشارات الجوية البحرية. يفتقر إلى التثبيت المعجمي المطلوب."

    - lemma: "بَلَاغُ الرِّيحِ"
      source: stage1
      decision: removed
      decision_reason: "«البلاغ» يدلّ على البيان الكتابي أو الإذاعي لا على الإشارة البصرية أو الصوتية المُشفَّرة. يُخطئ في فهم طبيعة storm signal الذي هو إشارة مرئية (أعلام، أضواء) لا بيان مكتوب. لا شاهد معجمي تقني."


