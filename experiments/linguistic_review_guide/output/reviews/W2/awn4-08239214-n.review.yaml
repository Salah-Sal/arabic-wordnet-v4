      sense_id: "{auto}"
      nuance: "تختص بالجمهور المشاهد لعرض بصري أو حدث ميداني."
      mwe: false
    - lemma: "مُتَلَقُّون"
      sense_id: "{auto}"
      nuance: "تختص بالجمهور من زاوية استقبال الرسالة الإعلامية أو الخطاب."
      mwe: false
    - lemma: "مُتَابِعُون"
      sense_id: "{auto}"
      nuance: "تعبر عن الجمهور الذي يرتبط بعلاقة مستمرة مع مصدر المعلومات أو الترفيه."
