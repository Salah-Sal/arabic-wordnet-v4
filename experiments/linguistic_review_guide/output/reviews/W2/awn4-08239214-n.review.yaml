        value: '{"root":"نظر","maqayis":"«النَّونُ وَالظَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَرْجِعُ إِلَى تَأَمُّلِ الشَّيْءِ وَالْعِلْمِ بِهِ»"}'
    - command: set_metadata
