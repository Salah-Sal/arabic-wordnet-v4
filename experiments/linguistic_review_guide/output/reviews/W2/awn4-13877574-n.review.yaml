    observations: "المفهوم المطلوب هو التعارض الدرامي أو السردي بين الشخصيات أو القوى المحرِّكة للحبكة، وهو مصطلح نقدي أدبي راسخ في العربية المعاصرة. الجنس القريب في التصنيف هو التضادّ/التعارض (awn4-13876846-n)، والفصل النوعي هو تخصيصه بالعمل الأدبي الدرامي أو الروائي."

