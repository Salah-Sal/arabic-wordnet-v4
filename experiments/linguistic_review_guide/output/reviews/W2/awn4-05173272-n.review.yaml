# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-05173272-n  |  ILI: i64127
# المفهوم: constructiveness — صفة المساهمة في البناء أو التحسين
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان 'بناءة' و'إيجابية بناءة' خاليتان من التشكيل الكامل"
      - "'إيجابية بناءة' تعبير وصفي مركب (موصوف + صفة) يصف شيئاً بالإيجابية والبنائية، لا يحمل دلالة الاسم المجرد للخاصية"
      - "'بناءة' دون تشكيل قابلة للقراءة صفةً مؤنثة (بَنَّاءَة) لا اسماً للخاصية المجردة؛ وكلاهما يُشكل خللاً في synset من النوع n"
      - "المجموعة تحتاج لمّةً اسمية واحدة راسخة تدل على الخاصية كالمصدر الصناعي أو الوزن فَعَالة"
    observations: >
      المفهوم (constructiveness) يقتضي في العربية اسماً مجرداً يدل على خاصية كون الشيء
      بنّاءً. الوزن الأنسب هو فَعَالة المستخلص من الصفة المشبهة "بنّاء" → "بَنَاءَة"، وهو
      وزن قياسي لاستخلاص الخاصيات من الصفات في العربية (شجاع → شجاعة، فصيح → فصاحة).
      جذر (ب-ن-ي) حي ومنتج في العربية المعاصرة؛ غير أن البِنَائِيَّة اتُّخذت مصطلحاً
      لتيار فني/فلسفي (constructivism) مما يستوجب الحذر من هذا الاشتقاق في هذا السياق.
      المصطلح الأنسب هو "بَنَاءَة" أو "بَنَّائِيَّة" مع التنبه إلى الاشتراك اللفظي في الأخيرة.

  blind_candidates:
    - lemma: "البَنَّائِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن فَعَّالِيَّة من الصفة المشبهة "بنّاء"؛ يدل على خاصية كون الشيء
        بنّاءً ومُسهِماً في التعمير. وزن مطّرد في المصادر الصناعية العربية المعاصرة.
    - lemma: "الإِعْمَارِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الفعل الرباعي "أعمَرَ" (جذر ع-م-ر) على وزن إِفعالية؛ يدل على خاصية
        الإسهام في الإعمار والتشييد والتحسين، وهو معنى مجاور للمفهوم المطلوب.
    - lemma: "الإِنْمَائِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من "أنمى" (جذر ن-م-و) على وزن إِفعالية؛ يُركز على جانب التنمية
        والتحسين في المفهوم، وهو مرتبط بمعنى "serving to improve" في التعريف الإنجليزي.
    - lemma: "التَّشْيِيدِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من "شيَّد" (جذر ش-ي-د) على وزن تَفعيلية؛ يدل على خاصية الرفع والبناء
        والتشييد. إحياء لجذر عربي أصيل دال على الإعلاء والاستحكام.


stage2_evidence:
  per_lemma:
    - lemma: "بناءة"
      confirm:
        - text: "«طريقة بنّاءة» ترجمتها constructive method"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
          addition: "يؤكد استعمال صيغة بنّاء/بنّاءة بوصفها صفةً دالة على المفهوم، لكنها صفة لا اسم خاصية"
        - text: "«نملة بناءة» ترجمتها mason ant"
          source: "المعجم الموحد لمصطلحات علم الأحياء (ARABTERM)"
          addition: "استعمال 'بناءة' وصفاً مؤنثاً، مما يرجح قراءتها صفةً لا اسماً"
        - text: "«بنائي» ترجمتها constructive — صفة لما يعمل على إضافة عناصر جديدة"
          source: "معجم المصطلحات الطبية ج.1 (ARABTERM)"
        - text: "(1) إنشائيّ؛ إبداعيّ (3) بنّاء؛ غير هدّام constructive criticism"
          source: "المورد الحديث 2008 (ARABTERM)"
      expands:
        - text: "«الْبَاءُ وَالنُّونُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ بِنَاءُ الشَّيْءِ بِضَمِّ بَعْضِهِ إِلَى بَعْضٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يرسخ أصل الجذر (ب-ن-ي) في معنى الإنشاء والتركيب؛ يدعم اشتقاق الاسم المجرد 'بَنَاءَة'"

    - lemma: "إيجابية بناءة"
      expands:
        - text: "«رشوة إيجابية» ترجمتها active corruption — وردت إيجابية صفةً لا اسماً مجرداً للخاصية"
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM)"
          addition: "يُبيّن أن 'إيجابية' في التراكيب العربية المعاصرة تستعمل صفةً وصفية لا مصطلحاً مسكوكاً بمعنى الخاصية المجردة"
        - text: "«صورة إيجابية» ترجمتها positive — استعمال وصفي لا اسمي"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1 (ARABTERM)"
          addition: "يؤكد أن 'إيجابية' في هذه المعاجم صفة لا اسم خاصية مجردة"

    - lemma: "البَنَّائِيَّة"
      contradicts:
        - text: "«تيار ظهر في القرن العشرين لا يأخذ بالاعتبار وظيفة الملابس فقط، بل ينظر إليها أيضاً بوصفها مجالاً للحياة؛ ويجب أن تُصمَّم وفقاً للمبادئ المنطقية» ترجمتها constructivism"
          source: "مسرد صناعة النسيج، ALECSO (ARABTERM)"
          conflict: "البنائية في المعجم مصطلح لتيار فني/تصميمي (constructivism) لا للخاصية المجردة (constructiveness)؛ ثمة اشتراك لفظي يُفضي إلى لبس"

    - lemma: "الإِعْمَارِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الإِنْمَائِيَّة"
      evidence_status: "no_material_found"

    - lemma: "التَّشْيِيدِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "بناءة"
      decision: confirmed
      decision_reason: >
        الجذر (ب-ن-ي) راسخ في المعجم العربي بمعنى الإنشاء والبناء. اللمّة مقبولة إذا
        قُرئت "بَنَاءَة" على وزن فَعَالة، وهو الوزن القياسي لاستخلاص اسم الخاصية من الصفة
        المشبهة (بنّاء → بَنَاءَة). تحتاج إلى إضافة تشكيل كامل وضبط الوزن الصرفي لإزالة
        اللبس مع القراءة الصفية المؤنثة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة؛ تُعبّر عن الخاصية المجردة لكون الموقف أو الفعل
        أو الشخص بنّاءً ومُسهِماً في التطوير، بمقابل الهدامية (destructiveness) في المعنى
        التضادي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَنَاءَة"

    - lemma: "إيجابية بناءة"
      decision: removed
      decision_reason: >
        التعبير مركب وصفي (موصوف + صفة) يصف كيانًا ما بأنه "إيجابي وبنّاء" في آنٍ واحد،
        ولا يُسمّي الخاصية المجردة. لا يجتاز اختبار السكّ المصطلحي: يمكن إبدال "إيجابية"
        بـ"جهودٌ بناءة" أو "روحٌ بناءة" فيبقى الوصف صالحاً، مما يدل على أنه عبارة وصفية
        حرة لا مصطلح مسكوك. فضلاً عن ذلك، الـsynset pos=n والتعبير عبارة وصفية لا اسم.

    - lemma: "البَنَّائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم صحة الاشتقاق الصرفي، فإن "البنائية" مُستعمَلة في المعاجم العربية بمعنى
        "constructivism" (تيار فني/فلسفي)؛ مما يُوجد اشتراكاً لفظياً مع "constructiveness"
        (الخاصية المجردة). لا ينبغي إدراج مصطلح مشترك في synset يخص أحد المعنيين دون
        تمييز.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الإِعْمَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا مادة معجمية تدعم هذا المصطلح. فضلاً عن ذلك، "إعمارية" موجهة نحو معنى التعمير
        المادي (البناء الفيزيائي) دون أن تُغطي جانب "التحسين" في التعريف.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "الإِنْمَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا مادة معجمية تدعم هذا المصطلح في قاعدة البيانات. "الإنمائية" مألوفة في سياق
        التنمية الاقتصادية (UNDP)، مما يُوجد خطر اشتراك لفظي مع حقل دلالي مختلف.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "التَّشْيِيدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا مادة معجمية تدعم هذا المصطلح. "التشييد" يُحيل إلى البناء المادي الرفيع
        تحديداً، وهو أضيق من المعنى المقصود الذي يشمل التحسين والإسهام الإيجابي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

  synset_actions:
    - command: remove_sense
      params:
        sense_id: "{auto}"


stage4_content:
  definition:
    current: "صفة المساهمة في البناء أو التحسين"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يستعمل "صفة" بمعنى عام مُبهم، وهو شبه ترجمة حرفية للتعريف
        الإنجليزي. يحتاج إلى تعريف معجمي بأسلوب الوسيط: جنس قريب (خاصية/كَوْن) +
        فصل نوعي يُحدد طبيعة تلك الخاصية.
    authored:
      - type: terminological
        text: >
          خَاصِّيَّةُ الشَّيْءِ أَوِ الفِعْلِ البَنَّاءِ؛ وَهِيَ كَوْنُهُ مُسْهِماً فِي
          تَحْسِينِ حَالٍ أَوْ تَطْوِيرِ وَضْعٍ أَوْ بِنَاءِ شَيْءٍ نَافِعٍ، في
          مُقَابِلِ الهَدَّامِيَّةِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كَوْنُ الشَّيْءِ بَنَّاءً نَافِعاً مُسْهِماً في التَّقَدُّمِ وَالتَّحْسِينِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05173272-n"
          definition_index: 0
          text: >
            خَاصِّيَّةُ الشَّيْءِ أَوِ الفِعْلِ البَنَّاءِ؛ وَهِيَ كَوْنُهُ مُسْهِماً فِي
            تَحْسِينِ حَالٍ أَوْ تَطْوِيرِ وَضْعٍ أَوْ بِنَاءِ شَيْءٍ نَافِعٍ،
            فِي مُقَابِلِ الهَدَّامِيَّةِ.
      - command: add_definition
        params:
          synset_id: "awn4-05173272-n"
          text: "كَوْنُ الشَّيْءِ بَنَّاءً نَافِعاً مُسْهِماً في التَّقَدُّمِ وَالتَّحْسِينِ"

