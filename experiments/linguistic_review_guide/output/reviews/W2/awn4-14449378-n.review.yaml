# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-14449378-n
# ili       : i112813
# pos       : n
# lemmas_en : immaturity, immatureness
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'عدم نضج' تعبير وصفي تركيبي (إضافي: عدم + نضج) وليست وحدة معجمية مسكوكة بالمعنى الاصطلاحي الدقيق؛ تجتاز اختبار الاستبدال (يمكن القول 'عدم الاكتمال' بنفس الأثر الوصفي)."
      - "غياب التشكيل الكامل عن اللمّة الموجودة."
      - "المجموعة تخلو من مقابل عربي مفرد ذي جذر دلالي واحد يحمل المعنى المقصود."
    observations: >
      المفهوم «immaturity» يدلّ على حالة قصور عن بلوغ الاستواء والاكتمال؛ وله في العربية ألفاظ
      أصيلة مفردة أبرزها «الفَجَاجَة» (قلة النضج) و«الحَدَاثَة» (طراوة السن وأوّله). اللمّة
      الحالية صحيحة مدلولاً لكنها عبارة وصفية تفسيرية؛ وإضافة مصطلح مفرد جذريّ سيرفع من دقة
      المجموعة ومن أداء البحث المعجمي.
  blind_candidates:
    - lemma: "حَدَاثَة"
      generation_method: ishtiqaq
      justification: "وزن فَعَالَة من جذر حدث؛ المعاجم تستعمله بمعنى صغر السن وطراوته، وهي ملازمة لعدم النضج في أغلب السياقات."
    - lemma: "فَجَاجَة"
      generation_method: ishtiqaq
      justification: "وزن فَعَالَة من جذر فجج؛ الفَجُّ الثمرُ قبل استوائه، والفَجَاجَةُ اسم لحالة قلة النضج — مقابل دقيق ومتقدم في الأفضلية على التعبير التركيبي."
    - lemma: "غَضَاضَة"
      generation_method: majaz
      justification: "من غضض بمعنى الغضّ الطريّ الذي لم يتصلّب بعد؛ إزاحة دلالية نحو معنى عدم الاكتهال والطراوة."
    - lemma: "قُصُور"
      generation_method: majaz
      justification: "من قصر بمعنى عدم بلوغ الغاية؛ يُستعمل مجازاً للدلالة على العجز وعدم الوصول إلى الاكتمال."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت:
# ١. مطابقة دفعية: عدم نضج + الحداثة + الفجاجة + الغضاضة + القصور (مع صيغ ال-)
# ٢. جسر إنجليزي: immaturity, immatureness, unripeness, rawness → لا نتائج
# ٣. FTS عربي: نضج، نضوج، استواء، بلوغ، اكتمال، عدم النضج
# ٤. إثراء (تعريفات + أمثلة) بـ entry_ids من الاستعلام ١
# ٥. مقاييس اللغة (dictionary_id=151): حدث، قصر، نضج، عدم، فجج، غضض
stage2_evidence:
  per_lemma:
    - lemma: "عدم نضج"
      evidence_status: "no_material_found"

    - lemma: "حَدَاثَة"
      confirm:
        - text: "«سنّ الشَّباب»"
          source: "المعجم الوسيط"
        - text: "«حداثةُ السِّنِّ: كنايةٌ عن الشَّبابِ وأوَّلِ العُمُرِ»"
          source: "المعجم الكبير"
        - text: "«(الحداثة) سنّ الشَّبَاب ويُقال: أخذ الأمر بحداثته بأوله وابتدائه»"
          source: "المعجم الوسيط (مجموعة من المؤلفين)"
      contradicts:
        - text: "«modernisme: مصطلح أُطلِقَ على مجموعةِ الحركاتِ الأدبيَّة التي ظهرت في أوربا الغربية بعد الحرب العالميَّة الأولى مباشرةً»"
          source: "المعجم الكبير"
          conflict: "المعنى الأشيع للحداثة في الخطاب العربي المعاصر هو المذهب الأدبي والفكري الحديث (modernism/modernity)، لا قلة النضج؛ مما يُوجب استبعادها تفادياً للاشتراك اللفظي."
      expands:
        - text: "«حداثة: youth — المرحلة الأولى من بداية الحت أو تطور الحت»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (أرابترم)"
          addition: "يُثبت استعمال حداثة بمعنى 'youth' في سياقات علمية، مما يكشف عن أن المعنى الأصيل (صغر السن) ما زال حاضراً في المعجم التخصصي."

    - lemma: "فَجَاجَة"
      confirm:
        - text: "«الفَجَاجَةُ: قلة نضجه؛ غيرُ النَّضيج من الفواكه»"
          source: "المعجم الوسيط"
        - text: "«فجاجة كل شيء: قلّة نضجه، وغير النضيج من الفواكه»"
          source: "المعجم الوسيط (مجموعة من المؤلفين)"

    - lemma: "غَضَاضَة"
      contradicts:
        - text: "«الغَضَاضَة: الذلة والمنقصة والعيب؛ يُقال: لا غضاضةَ عليك في هذا الفعل»"
          source: "المعجم الوسيط (مجموعة من المؤلفين)"
          conflict: "الغضاضة في المعجمات تدل على الذلة والمنقصة والعيب لا على عدم النضج؛ الإزاحة الدلالية المفترضة غير مسندة."

    - lemma: "قُصُور"
      expands:
        - text: "«القُصورُ: الخُلُو عَن المعاني الباعثة على تحري الخيرات والفضائل، وعدم التمكّن من أسبابها»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يُشير إلى نقص التكامل الأخلاقي والعقلي — وجه من وجوه عدم النضج لكنه أعم منه."
        - text: "«القُصور: العجز»"
          source: "التعريفات الفقهية للبركتي"
          addition: "معنى العجز أشمل من معنى عدم النضج."


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "عدم نضج"
      decision: confirmed
      decision_reason: >
        التعبير صحيح المدلول ومستعمل في الخطاب العربي الرسمي. رغم كونه تركيباً وصفياً، فإنه
        يُقبل في AWN بوصفه MWE إضافياً دالاً على المفهوم. يستلزم إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير مركب رسمي يُستخدم في السياقات التحليلية والوصفية لعدم الاكتمال؛ أشمل من فجاجة إذ يصلح للإشارة إلى عدم نضج أي نوع (جسدي أو عقلي أو اجتماعي)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ النُّضْجِ"

    - lemma: "حَدَاثَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الأصل اللغوي لحداثة (سن الشباب) قريب من المفهوم المطلوب، فإن المعنى الأشيع في
        العربية المعاصرة هو 'الحداثة' بمعنى modernism/modernity في الأدب والفكر والفلسفة.
        هذا الاشتراك اللفظي الحاد يجعلها غير صالحة لتمثيل immaturity في شبكة دلالية دون التباس.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "فَجَاجَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مدعومة بدليلين حرفيين متطابقين من المعجم الوسيط (OCR ومجموعة المؤلفين): «قلة نضجه وغير
        النضيج من الفواكه». المصطلح مفرد من جذر فصيح (فجج)، يُوافق دلالة المجموعة توافقاً تاماً،
        ويُكمّل اللمّة التركيبية بمقابل أحادي الكلمة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مفرد يُركّز على الخشونة الحسية وعدم الاستواء المادي أولاً، ثم يُوسَّع مجازاً للسلوك والفكر؛ أكثر تحديداً وحسيةً من 'عدم النضج' الأشمل."
      actions:
        - command: create_entry
          params:
            lemma: "فَجَاجَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-14449378-n"

    - lemma: "غَضَاضَة"
      source: stage1
      decision: removed
      decision_reason: >
        تعارض الدليل المعجمي مع الاستخدام المفترض تعارضاً تاماً: المعجم الوسيط يُعرّف الغضاضة
        بالذلة والمنقصة والعيب، لا بعدم النضج. الإزاحة الدلالية المقترحة لا سند لها.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "قُصُور"
      source: stage1
      decision: removed
      decision_reason: >
        قصور يُعبّر عن العجز والنقص بوجه عام؛ وهو مصطلح تقني راسخ في الطب (قصور القلب، قصور
        الكظر) والهندسة (القصور الذاتي = inertia)؛ لا يُشير تخصيصاً إلى حالة عدم النضج. ضمّه
        للمجموعة سيُوسّع دلالتها توسيعاً غير مسند.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "عدم الوصول إلى النضج"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي قريب من الدوران المعجمي (يُعرَّف عدم النضج بعدم الوصول إلى النضج) ويفتقر
        إلى الجنس القريب الصريح (حالة) والفصل النوعي المُوضِّح للأبعاد. كما لا يُفرّق بين البُعد
        الجسدي والعقلي والانفعالي للمفهوم.
    authored:
      - type: terminological
        text: "حالةٌ يكون فيها الكائنُ أو الشيءُ قاصرًا عن بلوغ مرحلة الاستواء والاكتمال في أبعاده الجسدية أو العقلية أو الانفعالية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "وصفُ حالِ مَن لم يكتملْ نموُّه أو رُشدُه ولم يبلغْ مرحلةَ الاستواء"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-14449378-n"
          definition_index: 0
          text: "حالةٌ يكون فيها الكائنُ أو الشيءُ قاصرًا عن بلوغ مرحلة الاستواء والاكتمال في أبعاده الجسدية أو العقلية أو الانفعالية"
      - command: add_definition
        params:
          synset_id: "awn4-14449378-n"
          text: "وصفُ حالِ مَن لم يكتملْ نموُّه أو رُشدُه ولم يبلغْ مرحلةَ الاستواء"

  examples:
    per_lemma:
      - lemma: "عَدَمُ النُّضْجِ"
        examples:
          - text: "تُعزى أخطاؤه في التعامل مع المسؤوليات إلى عدمِ النضجِ وقلةِ التجربة"
            type: usage
      - lemma: "فَجَاجَة"
        examples:
          - text: "كشفت ردودُ أفعالِه عن فجاجةٍ واضحةٍ في مواجهة المواقف الصعبة"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-14449378-n"
          text: "تُعزى أخطاؤه في التعامل مع المسؤوليات إلى عدمِ النضجِ وقلةِ التجربة"
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كشفت ردودُ أفعالِه عن فجاجةٍ واضحةٍ في مواجهة المواقف الصعبة"


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "عَدَمُ النُّضْجِ"
      entry_id: "{auto}"
      roots:
        - word: "عدم"
          root: "عدم"
          maqayis_quote: "«الْعَيْنُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى فُقْدَانِ الشَّيْءِ وَذَهَابِهِ»"
        - word: "نضج"
          root: "نضج"
          maqayis_quote: "«النُّونُ وَالضَّادُ وَالْجِيمُ أَصْلٌ يَدُلُّ عَلَى بُلُوغِ النِّهَايَةِ فِي طَبْخِ الشَّيْءِ، ثُمَّ يُسْتَعَارُ فِي كُلِّ شَيْءٍ بَلَغَ مَدَى الْإِحْكَامِ»"

    - lemma: "فَجَاجَة"
      entry_id: "{auto}"
      root: "فجج"

  per_sense:
