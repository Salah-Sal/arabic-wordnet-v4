        value: '{"roots":[{"word":"عدم","root":"عدم","maqayis":"«الْعَيْنُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى فُقْدَانِ الشَّيْءِ وَذَهَابِهِ»"},{"word":"نضج","root":"نضج","maqayis":"«النُّونُ وَالضَّادُ وَالْجِيمُ أَصْلٌ يَدُلُّ عَلَى بُلُوغِ النِّهَايَةِ فِي طَبْخِ الشَّيْءِ، ثُمَّ يُسْتَعَارُ فِي كُلِّ شَيْءٍ بَلَغَ مَدَى الْإِحْكَامِ»"}]}'
    # عَدَمُ النُّضْجِ — sense note
