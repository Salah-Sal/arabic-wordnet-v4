      sense_id: "{auto}"
      nuance: "تعبير مركب إضافي يُستخدم في الخطاب الرسمي والتحليلي؛ يصلح لعدم النضج بأبعاده كافة (جسدياً وعقلياً وانفعالياً) بلا تخصيص حسّي."
      mwe: true

    - lemma: "فَجَاجَة"
      sense_id: "{auto}"
      nuance: "مصطلح مفرد يُركّز على الخشونة وعدم الاستواء الحسّي المادي (كاخضرار الثمرة)، ثم يُوسَّع مجازاً للسلوك والفكر؛ أكثر تحديداً وبلاغيةً."

  synset:
