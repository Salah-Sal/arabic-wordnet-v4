          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
        - text: "«قساوة كربونية» — carbonate hardness / «قساوة دائمة» — permanent hardness
            / «قساوة مؤقتة» — temporary hardness / «قساوة غير كربونية» — noncarbonate hardness"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
      contradicts:
        - text: "«قساوة: صفة الجسم الصلد» — hardness (general physical property)"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — ARABTERM"
          conflict: >
            التعريف العام للقساوة في الكيمياء يصفها بأنها خاصية فيزيائية للمواد الصلبة،
            وهو أعمّ من الاستخدام الكيميائي المائي المقصود هنا. غير أن المعجم ذاته يُدرج
