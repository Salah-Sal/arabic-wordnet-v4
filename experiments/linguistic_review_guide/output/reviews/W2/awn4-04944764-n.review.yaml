      morphological_check: >
        عُسْرُ الْمَاءِ: تركيب إضافي من «عُسْر» (مصدر ع-س-ر على وزن فُعْل) و«الماء».
        المضاف إليه «الماء» يُخصِّص المفهوم ويحدّه في المجال المائي. وزن فُعْل للمصادر
