        الصعوبة والمشقّة، والإزاحة الدلالية إلى خاصية الماء العسير على الصابون سليمةٌ
        وطبيعية. كما تُوثِّق معاجم الهندسة المدنية مشتقات «عسارة» الدقيقة (عسارة
