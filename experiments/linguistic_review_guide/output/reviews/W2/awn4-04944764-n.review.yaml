# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة للمياه التي تحتوي على أملاح معدنية مذابة تمنع الصابون من تكوين رغوة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يصف الأثر الوظيفي (منع الرغوة) لكنه يُغفل الأملاح المُعرِّفة
        (الكالسيوم والمغنيسيوم) التي تُميّز عسارة الماء عن مجرد «الملوحة». كما أن
        «أملاح معدنية مذابة» أعمّ مما ينبغي. التعريف بحاجة إلى جنس قريب (خاصية مائية)
        وفصل نوعي أدق.
    authored:
      - type: terminological
        text: >
          خَاصِيَّةٌ في الماءِ ناجمةٌ عن ذوبانِ أملاحِ الكالسيوم والمغنيسيوم فيه،
          تُعيقُ تشكُّلَ رغوةِ الصابون وتُقاسُ بالتركيزِ الإجماليِّ لأيوناتهما.
        quality_check:
          genus_present: true
