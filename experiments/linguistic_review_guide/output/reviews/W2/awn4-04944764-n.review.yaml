          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
          conflict: >
            تملّح مصطلح للملوحة التربوية (salinization)، أي تراكم الأملاح في التربة،
            وهو مفهوم مختلف جذرياً عن عسارة الماء (water hardness).
        - text: "«تملح: عملية تراكم الأملاح في التربة» — salinization"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — ARABTERM"
          conflict: "مؤكِّد للتناقض السابق: تملّح = salinization لا water hardness."
        - text: "«(تملح) فلَان تزوَّد الملحَ أو تجرَ به وتكلَّف الملاحة»"
