    - lemma: "صلابة"
      contradicts:
        - text: "«الصَّفَاقَةُ، مشى في صَلابَةٍ من الأرض. (مجاز) (في الهندسة) Solidity:
            صِفَةُ الجِسمِ الذى يحتفظُ بشكله وحجمه»"
          source: "المعجم الكبير — OCR"
          conflict: >
            صلابة في معاجم المجمع تدلّ على الخاصية الفيزيائية للأجسام الصلبة (مقاومة
