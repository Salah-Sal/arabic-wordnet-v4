        - text: "«عسرة الماء» — water hardness"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          addition: "توثيق الصيغة البديلة عسرة الماء في المجال الطبي"
        - text: "«قساوة المياه، عسر الماء» — water hardness"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — ARABTERM"
