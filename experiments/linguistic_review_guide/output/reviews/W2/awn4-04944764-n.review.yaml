      morphological_check: >
        عَسَارَة: مصدر صناعي على وزن فَعَالة من الجذر ع-س-ر. الوزن مناسب لتكوين
        أسماء الصفات والخصائص (كصَرَامة، شَجَاعة). الاشتقاق سليم قياسياً.
      nuance_differentiation: >
        «عسارة» هي المصطلح الجامد الأكثر تخصصاً الذي يُطلَق على خاصية الماء في ذاتها
        بوصفها مفهوماً كيميائياً، وتدخل في تراكيب اصطلاحية محددة (عسارة كربونية،
        عسارة دائمة، عسارة مؤقتة). بخلاف «عسر الماء» الذي يصف الحالة العامة.
