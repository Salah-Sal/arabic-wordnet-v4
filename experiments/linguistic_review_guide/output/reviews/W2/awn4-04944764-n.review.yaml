      nuance_differentiation: >
        «عسر الماء» يصف الخاصية العامة للماء العسير، ويُستعمل في السياقات التقنية
        والعلمية على حدٍّ سواء. أشمل دلالةً من «عسارة» الأكثر تخصصاً في التحليل
