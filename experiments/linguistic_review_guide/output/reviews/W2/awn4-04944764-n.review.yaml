        - text: "«(الصلابة) صفة الجسم الذي يحتفظ بشكله وحجمه (مج)»"
          source: "المعجم الوسيط — Hawramani"
          conflict: >
            المعجم الوسيط يحصر «الصلابة» في الأجسام الصلبة، ولا يُورد استخداماً مائياً
