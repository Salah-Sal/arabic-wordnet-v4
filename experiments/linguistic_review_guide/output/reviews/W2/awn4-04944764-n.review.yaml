# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «عسارة» مفتقرة إلى تشكيل كامل في قاعدة البيانات"
      - "اللمّة «عسر الماء» مفتقرة إلى تشكيل كامل في قاعدة البيانات"
      - "التعريف الحالي لا يُحدِّد أملاح الكالسيوم والمغنيسيوم بوصفها الأملاح المُعرِّفة للمفهوم، ويكتفي بالإشارة إلى «أملاح معدنية مذابة» وهو أعمّ مما ينبغي"
      - "غياب مصطلح «قساوة» الموثَّق في معاجم الكيمياء والهندسة المدنية مرادفاً لعسر الماء"
    observations: >
      المجموعة تدور حول مفهوم «عسارة الماء» (Water Hardness)، وهو مصطلح كيميائي
      يصف خاصية المياه التي تحتوي على أملاح الكالسيوم والمغنيسيوم المذابة، مما يُعيق
      تكوُّن رغوة الصابون. اللمّتان الموجودتان (عسارة، عسر الماء) مشتقّتان من جذر واحد
      (عسر) الدال على الصعوبة والشدة، وهو توليد دلالي سليم بطريق المجاز. التعريف
      الحالي صحيح في جوهره لكنه يفتقر إلى الدقة الكيميائية. الترادف بين اللمّتين
      يستدعي توثيق الفروق الدلالية الدقيقة بينهما.

  blind_candidates:
    - lemma: "قَسَاوَةٌ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من معنى الصلادة والخشونة الحسيّة (قسا قلبُه: اشتدّ) إلى خاصية
        الماء الصعب المقاوم لتكوين الرغوة. المجاز واضح وظيفياً: الماء «القاسي» لا يلين
        أمام الصابون كما يلينه الماء العذب. المصطلح مسكوك في معاجم الكيمياء والهندسة.

    - lemma: "صَلَابَةٌ"
      generation_method: majaz
      justification: >
        توسيع دلالي من «صلابة الجسم» (مقاومته للتشوه) إلى خاصية مائية وصفية.
        جذر ص-ل-ب أصيل وإزاحته للمجال المائي واردة. غير أن «صلابة» تُستعمل أساساً
        في وصف المواد الصلبة ومقاومتها الميكانيكية لا في كيمياء المياه.

    - lemma: "تَمَلُّحٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر م-ل-ح على وزن تَفَعُّل، يدلّ على حالة الاتصاف بالملوحة أو
        التحوُّل إليها. قياس الاشتقاق صحيح إذ «الأملاح المعدنية» هي جوهر المفهوم.

    - lemma: "مِلْحِيَّةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «ملح» على النمط (-ية)، يدلّ على الخاصية الكيميائية لاحتواء
        الأملاح. قياسي وسهل التداول، غير أنه قد يشتبه بـ«ملوحة» (salinity) وهي خاصية
        مختلفة (المياه المالحة ≠ الماء العسر).


