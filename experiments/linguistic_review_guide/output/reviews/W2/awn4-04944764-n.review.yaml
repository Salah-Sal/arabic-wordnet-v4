        - text: "«قساوة» — hardness (Physics)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
        - text: "«قساوة الكالسيوم: جزء من القساوة الكلية عائد لمركبات الكالسيوم»
