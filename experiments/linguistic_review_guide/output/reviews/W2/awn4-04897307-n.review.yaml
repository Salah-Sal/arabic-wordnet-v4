stage1_review:
  assessment:
    concerns:
      - "الاقتصار على لمّة واحدة في مفهوم واسع كالحكمة."
      - "التعريف الحالي يبدو ترجمة حرفية للتعريف الإنجليزي."
    observations: "المفهوم مركزي في الثقافة العربية وله مفردات غنية تعبر عن زوايا مختلفة من النضج العقلي وجودة الرأي."
  blind_candidates:
    - lemma: "حِكْمَة"
      generation_method: ishtiqaq
      justification: "اللفظ الأصيل للمفهوم، مشتق من المَنْع (منع الجهل والسفه)."
    - lemma: "حَصَافَة"
      generation_method: ishtiqaq
      justification: "تعبر عن رزانة العقل وجودة الرأي، وهي مطابقة لدلالة استخدام الخبرة بتبصّر."
    - lemma: "رَجَاحَة"
      generation_method: ishtiqaq
      justification: "تشير إلى رزانة العقل وثقله (رجاحة العقل) في مقابل خفته وسفهه."
    - lemma: "رُشْد"
      generation_method: ishtiqaq
      justification: "تعبر عن الاستقامة على طريق الحق والإصابة في القول والفعل."

stage2_evidence:
  per_lemma:
    - lemma: "حِكْمَة"
      confirm:
        - text: "«الحكمة: إصابة الحق بالعلم والعمل، فالحكمة من الله معرفة الأشياء وإيجادها على غاية الإحكام ومن الإنسان معرفة الموجودات وفعل الخيرات بها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الحكمة) معرفة أفضل الأشياء بأفضل العلوم... والكلام الذي يقل لفظه ويجل معناه»"
          source: "المعجم الوسيط"
    - lemma: "حَصَافَة"
      confirm:
        - text: "«الحَصَافة: رزانة العقل وجودة الرأي.»"
          source: "المعجم الكبير"
        - text: "«فيقال لركانة العقل حصافة»"
          source: "مقاييس اللغة"
    - lemma: "رَجَاحَة"
      confirm:
        - text: "«الرَّجاحة: الحِلمُ والرَّزانةُ»"
          source: "المعجم الكبير"
        - text: "«يدل على رزانة وزيادة... وقوم مراجيح في الحلم»"
          source: "مقاييس اللغة"
    - lemma: "رُشْد"
      confirm:
        - text: "«الرُّشْدُ والرَّشَدُ والرَّشَادُ نَقِيضُ الغَيِّ... الاستقامةُ على طَريق الحَقِّ مَعَ تَصَلُّبٍ فِيهِ»"
          source: "تاج العروس"
        - text: "«(الرشد) كمال العقل وسداد الفعل»"
          source: "تاج العروس (نقلاً عن مختار عمر)"

