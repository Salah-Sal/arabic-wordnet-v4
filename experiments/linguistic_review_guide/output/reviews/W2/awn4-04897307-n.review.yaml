stage4_content:
  definition:
    current: "سمة استخدام المعرفة والخبرة مع الحس Сليم والبصيرة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك صياغةً، والأفضل استخدام مصطلحات معجمية أصيلة مثل (الرزانة) و(جودة الرأي)."
    authored:
      - type: terminological
        text: "مَلَكَةٌ نَفْسِيَّةٌ تَقُومُ عَلَى إِصَابَةِ الحَقِّ بِالعِلْمِ وَالعَمَلِ، وَجَوْدَةِ الرَّأْيِ بِالبَصِيرَةِ وَالرَّزَانَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04897307-n"
          definition_index: 0
          text: "مَلَكَةٌ نَفْسِيَّةٌ تَقُومُ عَلَى إِصَابَةِ الحَقِّ بِالعِلْمِ وَالعَمَلِ، وَجَوْدَةِ الرَّأْيِ بِالبَصِيرَةِ وَالرَّزَانَةِ."
  examples:
    per_lemma:
      - lemma: "حِكْمَة"
        examples:
          - text: "مِنْ آيَاتِ الحِكْمَةِ أَنْ يَضَعَ المَرْءُ الأُمُورَ فِي مَوَاضِعِهَا الصَّحِيحَةِ."
            type: usage
      - lemma: "حَصَافَة"
        examples:
          - text: "أَبْدَى القَاضِي حَصَافَةً كَبِيرَةً فِي مُمَارَسَةِ صَلَاحِيَّاتِهِ."
            type: usage
      - lemma: "رَجَاحَة"
        examples:
          - text: "عُرِفَ بَيْنَ قَوْمِهِ بِرَجَاحَةِ العَقْلِ وَسَدَادِ الرَّأْيِ."
            type: usage
      - lemma: "رُشْد"
        examples:
          - text: "ثَابَ الشَّابُّ إِلَى رُشْدِهِ بَعْدَ أَنْ مَحَّصَتْهُ التَّجَارِبُ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-04897307-n"
          text: "مِنْ آيَاتِ الحِكْمَةِ أَنْ يَضَعَ المَرْءُ الأُمُورَ فِي مَوَاضِعِهَا الصَّحِيحَةِ."

