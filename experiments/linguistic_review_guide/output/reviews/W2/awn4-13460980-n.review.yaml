stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة حرفية للتعريف الإنجليزي ويفتقر إلى الصياغة المصطلحية الدقيقة."
      - "استخدام كلمة (نفخ) عام، وقد يفتقر إلى التخصيص كعملية صناعية."
    observations: "اللمة (نفخ) تعبر عن المعنى الأصلي في العربية لإرسال تيار من الهواء أو الغاز، وتُستخدم بشكل شائع في مصطلحات مثل (نفخ الزجاج)."
  blind_candidates:
    - lemma: "نَفْخ"
      generation_method: ishtiqaq
      justification: "المصدر الصريح الدال على عملية دفع الهواء أو الغاز."
    - lemma: "ضَخٌّ غَازِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يحدد العملية بأنها ضخ لتيار غازي."
    - lemma: "تَنْفِيخ"
      generation_method: ishtiqaq
      justification: "مصدر على وزن (تفعيل) يدل على التكثير والمبالغة في المعالجة."
    - lemma: "دَفْعٌ هَوَائِيّ"
      generation_method: tarkib
      justification: "مركب يعبر عن المعالجة باستخدام دفع الهواء بقوة."

stage2_evidence:
  per_lemma:
    - lemma: "نفخ"
      confirm:
        - text: "«دفع مسحوق، أو إرذاذه، أو أحد الغازات، في أحد أجواف الجسم بقصد التشخيص أو المعالجة.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«نفَخ الشّيءَ: أرسل فيه هواءً من فمه فأطاره، أو حُبس فيه فانتفخ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«النفخ: إرسال الهواء من منبعثه بقوة.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«نفخ الزجاج (glass blowing)»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يؤكد استخدام الكلمة في العمليات الصناعية كالتشكيل والمعالجة."
    - lemma: "ضخ غازي"
      evidence_status: "no_material_found"
    - lemma: "تنفيخ"
      evidence_status: "no_material_found"
    - lemma: "دفع هوائي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "نَفْخ"
      decision: confirmed
      decision_reason: "هو المصطلح العربي الفصيح والصحيح للدلالة على العملية، ويُستعمل بصورة معتمدة في المصطلحات الصناعية والتقنية (مثل نفخ الزجاج)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَفْخ"
    - lemma: "ضَخٌّ غَازِيّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح تركيبي غير مسجل ولا يغني عن اللمة المفردة الدقيقة."
    - lemma: "تَنْفِيخ"
      source: stage1
      decision: removed
      decision_reason: "صيغة مبالغة لا تدل على المفهوم الصناعي أو العلمي المعتمد في المعالجة."
    - lemma: "دَفْعٌ هَوَائِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك كأداة معالجة."

stage4_content:
  definition:
    current: "معالجة تتضمن نفخ الغاز"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية ومختصرة؛ الأفضل صياغته بأسلوب مصطلحي يبرز كونه عملية صناعية أو معالجة دقيقة."
    authored:
      - type: terminological
        text: "عمليَّةُ مُعالجةٍ صِناعيَّةٍ تتضمَّنُ دَفْعَ تَيَّارٍ مِنَ الغازِ أو الهَوَاءِ بِقُوَّةٍ في مادَّةٍ ما لِتَشكيلِها أو تَغييرِ خَصائِصِها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13460980-n"
          definition_index: 0
          text: "عمليَّةُ مُعالجةٍ صِناعيَّةٍ تتضمَّنُ دَفْعَ تَيَّارٍ مِنَ الغازِ أو الهَوَاءِ بِقُوَّةٍ في مادَّةٍ ما لِتَشكيلِها أو تَغييرِ خَصائِصِها."

  examples:
    per_lemma:
      - lemma: "نَفْخ"
        examples:
          - text: "يُعَدُّ نَفْخُ الزُّجَاجِ مِنَ الفُنونِ الحِرَفيَّةِ والصِّناعيَّةِ القَديمَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-13460980-n"
          text: "يُعَدُّ نَفْخُ الزُّجَاجِ مِنَ الفُنونِ الحِرَفيَّةِ والصِّناعيَّةِ القَديمَةِ."

stage5_enrichment:
  per_entry:
    - lemma: "نَفْخ"
      entry_id: "{auto}"
      root: "نفخ"
      maqayis_quote: "«النُّونُ وَالْفَاءُ وَالْخَاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْتِفَاخٍ وَعُلُوٍّ. مِنْهُ انْتَفَخَ الشَّيْءُ انْتِفَاخًا.»"

  per_sense:
    - lemma: "نَفْخ"
      sense_id: "{auto}"
      nuance: "المصطلح الأصلي والأكثر شيوعاً للتعبير عن إرسال الغاز أو الهواء بقوة في عمليات الصناعة والمعالجة."
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
