        value: '{"nuance":"المصطلح الأصلي والأكثر شيوعاً للتعبير عن إرسال الغاز أو الهواء بقوة في عمليات الصناعة والمعالجة.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-13460980-n"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
