        - text: "«كَفَاءَة — الرأي: مرفوضة — السبب: لأنها لم ترد بهذا المعنى في المعاجم. المعنى: قدرة عملية»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "يرفض معجم الصواب صراحةً استخدام «كفاءة» بمعنى القدرة العملية."
      expands:
        - text: "«كفاءة» مُترجمة في عشرات مداخل ArabTerm بـ efficiency (الكفاءة التقنية لتحويل الطاقة)"
          source: "معاجم ArabTerm المتعددة (الطاقة المتجددة، الكيمياء، الكهرباء...)"
          addition: "التخصص التقني أرسى «كفاءة» للدلالة على efficiency لا ability، مما يُباعد بينها وبين هذه المجموعة."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "قدرة"
      decision: confirmed
      decision_reason: >
        المحور الدلالي للمجموعة. موثّقة بصورة قاطعة في المعاجم الكلاسيكية والمعاصرة
        بمعنى «التمكّن من الفعل والقوة عليه». جذرها (ق-د-ر) الأصيل هو المرجعية
        الصرفية لهذا المجال الدلالي. تشمل المعنى النفسي والعقلي والمادي معاً.
        المعاجم المتخصصة في التربية والإشراف تترجمها ability صراحةً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ اللمّات وأصلها؛ تُعبّر عن التمكّن الكامل من الفعل بإرادة حرة دون قيد
        إضافي. تستوعب القدرة العقلية والجسدية والمكتسبة والفطرية على السواء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُدْرَة"

    - lemma: "طاقة"
      decision: removed
      decision_reason: >
        رغم ورودها في المعاجم الكلاسيكية بمعنى القدرة مع دلالة المشقة، فإن الانزياح
        الدلالي الحديث الحادّ نحو «energy» الفيزيائية يجعل إدراجها في مجموعة ability
        العقلية مضلِّلاً. عشرات مداخل ArabTerm تترجمها energy لا ability.
        إبقاؤها يُلبّس المجموعة الدلالية ويُضعف الدقة المعجمية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "استطاعة"
      decision: confirmed
      decision_reason: >
        موثّقة بعمق في المعاجم الكلاسيكية والفلسفية. اشتقاقها من «الطَّوْع» (الانقياد)
        يُبرز دلالة خاصة: القدرة المقرونة بالإرادة والطواعية الذاتية. تُستخدم على
        نطاق واسع في القرآن الكريم والتراث الفلسفي والفقهي بهذا المعنى.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركّز على الجانب الإرادي من القدرة: إمكانية الفعل المقرونة بالانبعاث الذاتي
        والطواعية. كثيراً ما تُستخدم لتقييم حدّ الإمكانية (هل يستطيع أم لا)،
        مما يجعلها تُقيّم الحدَّ الأدنى من الطاقة الضروري للفعل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِطَاعَة"

    - lemma: "مَقْدِرَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثّقة في المعجم الوسيط (OCR وHawramani) بمعنى «القُدرة» صريحاً. مسجّلة
        في مصطلحيات ArabTerm بترجمات ability وcapability وcapacity وasset.
        وزن مَفْعِلَة يدل على الملكة الراسخة الثابتة، مما يُميّزها عن المصدر
        البسيط «قُدرة».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُفيد الملكة الراسخة والقدرة الثابتة المستقرة في الشخص. أقرب ما تكون إلى
        capability/capacity في الاستخدام التقني والتربوي؛ تركّز على الجانب الكمّي
        والمؤسسي من القدرة.
      actions:
        - command: create_entry
          params:
            lemma: "مَقْدِرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُكْنَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثّقة في المعجم الوسيط (OCR وHawramani) بمعنى «القدرة والاستطاعة والقوة
        والشدة» صريحاً. تجمع بين دلالة القدرة ودلالة التمكّن والرسوخ في المكانة.
        جذر (م-ك-ن) يدل على الثبات والاستقرار.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُفيد القدرة المصحوبة بالتمكّن والرسوخ، مع إيحاء بالمكانة والهيمنة على
        مجال الفعل. تستخدم غالباً مع «ذو مكنة» للدلالة على الجدارة الراسخة
        والمكانة المتمكّنة بين الأقران.
      actions:
        - command: create_entry
          params:
            lemma: "مُكْنَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أَهْلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الأهلية» تدل على الصلاحية الشرعية والقانونية (الاستحقاق + توافر الشروط)،
        وليس على امتلاك القدرة الفعلية. الفرق جوهري: ability = امتلاك القدرة
        الذاتية، أما الأهلية = الصلاحية للحقوق والواجبات. المعاجم الفقهية تُقيّدها
        بالسياق القانوني/الشرعي. إدراجها يُربك الحدود الدلالية.

    - lemma: "كُفَاءَة"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الأصيلة للكفاءة هي المماثلة والمساواة (كفاءة في الزواج)، ودلالتها
        الحديثة الأغلب في المصطلحية التقنية هي efficiency. معجم الصواب يرفض
        صراحةً استخدامها بمعنى «القدرة العملية». حتى في الاستخدام التقني:
        «القدرة على أداء العمل وحسن تصريفه» — قيد «حسن التصريف» يُخرجها عن
        ability البسيطة نحو competence/efficiency.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
