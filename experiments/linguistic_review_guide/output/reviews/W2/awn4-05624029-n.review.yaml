        - text: "«الأهلية: صَلَاحِية فِي الْإِنْسَان توجب الْحُقُوق الْمَشْرُوعَة لَهُ أَو عَلَيْهِ»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "تُقيّد الأهلية بالحقوق والواجبات المشروعة، مما يُبعدها عن الدلالة النفسية-العقلية للمجموعة."

    - lemma: "كُفَاءَة"
      confirm:
        - text: "«الكَفَاءَةُ: المماثلةُ فى القوة والشرف... وللعمل: القدرةُ عليه وحسن تصريفه»"
