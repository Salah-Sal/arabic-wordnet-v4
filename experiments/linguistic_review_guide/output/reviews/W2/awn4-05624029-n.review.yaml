# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-05624029-n  |  ILI: i66424
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «طاقة» تعاني انزياحاً دلالياً حاداً في العربية المعاصرة نحو المفهوم الفيزيائي (energy)، مما يولّد اشتراكاً لفظياً يُربك المستخدم."
      - "التعريف الحالي ترجمة حرفية من الإنجليزية، ولا يتّبع أسلوب المعجم الوسيط (جنس قريب + فصل نوعي)."
      - "غياب لمّة «مَقْدِرَة» و«مُكْنَة» رغم شيوعهما في المعاجم الكلاسيكية بهذه الدلالة تحديداً."
      - "لمّات المجموعة الثلاث خالية من التشكيل الكامل."
    observations: >
      المجموعة تُمثّل مفهوم الكفاءة والقدرة الذاتية (ability) بمعناه النفسي-المعرفي،
      وهو مفهوم غنيٌّ في التراث العربي. جذر (ق-د-ر) هو المحور الدلالي الأصيل،
      أما (ط-و-ق) فيُضيف دلالة بلوغ الحد الأقصى من الطاقة مع مشقة، و(ط-و-ع)
      يُركّز على الانقياد الإرادي وامتلاك الفاعلية. المجموعة الاشتمالية (المعرفة/الإدراك)
      تستدعي الدقة في التمييز بين ما هو ملكة معرفية وما هو طاقة فعلية.

  blind_candidates:
    - lemma: "مَقْدِرَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (ق-د-ر) على وزن مَفْعِلَة، وهو وزن يدل على الملكة الراسخة
        والاستعداد الثابت. يميّز عن المصدر «قدرة» بكونه اسم هيئة يُعبّر عن
        وصف المرء بامتلاك القدرة الراسخة لا مجرد حدوثها.
    - lemma: "مُكْنَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (م-ك-ن) على وزن فُعْلَة، يدل على التمكّن الذاتي الراسخ.
        يُعبّر المعنى الأصيل عن كون الشيء ثابتاً متمكّناً في موضعه، ثم أُطلق
        مجازاً على القدرة الداخلية الرسوخ.
    - lemma: "أَهْلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «أَهْل» على وزن فَعْلِيَّة، يدل على الصلاحية للشيء
        واستيفاء شروطه. يلتقي مع المفهوم من جهة اشتراط توافر الصفات المطلوبة
        للقيام بالفعل.
    - lemma: "كُفَاءَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (ك-ف-أ)، المصدر «كفاءة» يدل أصلاً على المماثلة ثم اتّسع ليشمل
        القدرة على أداء العمل وحسن تصريفه في الاستخدام المعاصر. يلتقي مع مفهوم
        الكفاءة العملية المطلوبة لإنجاز غرض.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "قدرة"
      confirm:
        - text: "«القُدْرَةُ: الطاقةُ، القُوَّةُ على الشىء والتمكُّن منه، الغِنى والثَّراءُ»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الْقُدْرَة: الطَّاقَة وَالْقُوَّة على الشَّيْء وَالتَّمَكُّن مِنْهُ وَالْغِنى وَالثَّرَاء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«القدرة: إظهار الشيء من غير سبب ظاهر... الصفة التي يتمكن بها الحي من الفعل وتركه بالإرادة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«القُدرة: هي القوة على الشيء والتمكُّن منه، قال السيد: هي الصفة التي يتمكَّن به الحيّ من الفعل وتركه بالإرادة»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«القدرة: هي الصفة التي تمكن الحي من الفعل وتركه بالإرادة»"
