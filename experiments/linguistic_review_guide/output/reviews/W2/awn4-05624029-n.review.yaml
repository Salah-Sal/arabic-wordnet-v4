        - text: "«الحالة التي يكون الفرد فيها متمكناً من النجاح في إنجاز معين، كالقدرة على التحليل والتركيب»"
          source: "مسرد التربية (ArabTerm) — en=ability"
        - text: "«صفة قد تكون فطرية أو مكتسبة تمكّن الفرد من أداء فعل ما»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (ArabTerm) — en=ability"

    - lemma: "طاقة"
      confirm:
        - text: "«الطَّاقةُ: القُدرةُ ما يستطيع الإنسانُ أن يفعله بمشقة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الطاقة: من الطوق، وهو ما استقل به الفاعل ولم يعجزه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الطَّاقَة: الْقُدْرَة وَمَا يَسْتَطِيع الْإِنْسَان أَن يَفْعَله بِمَشَقَّة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«القدرةُ والاستطاعةُ، اسمٌ يوضعُ موضع المصدر من كلِّ شيءٍ»"
          source: "المعجم الكبير (OCR)"
      contradicts:
        - text: "«طاقة» مُرجمة في عشرات مداخل ArabTerm بـ energy (الطاقة الكهربائية، الطاقة الحرارية، وحدة الجول)"
          source: "معاجم ArabTerm المتعددة (الطاقة المتجددة، الفيزياء، الكيمياء، الرياضيات...)"
          conflict: "الانزياح الدلالي الحديث الحادّ نحو «energy» الفيزيائية يجعل «طاقة» غير صالحة مفرداً لتمثيل ability النفسي/العقلي في الشبكة الدلالية."
      expands:
        - text: "«طَاقَة — مثال: أَخَذَ ينظر إليه عبر طاقةٍ في الجدار — الرأي: مرفوضة — السبب: لأنها لم ترد بهذا المعنى في المعاجم»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يُنبّه المعجم إلى أن بعض استخدامات «طاقة» في سياقات حديثة تُعدّ مرفوضة لغوياً، مما يُعزّز الحذر من إدراجها."

    - lemma: "استطاعة"
      confirm:
        - text: "«الاستطاعة: هي عرض يخلقه الله تعالى في الحيوان، يفعل به الأفعال الاختيارية»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الاستطاعة والقدرة والقوة والوسع والطاقة: متقاربة في المعنى في اللغة»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الاستطاعة: الحقيقية القدرة التامة التي يجب عندها صدور الفعل فلا تكون إلا مقارنة له»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الِاسْتِطَاعَة: عرض يخلقه الله تَعَالَى فِي الْحَيَوَان يفعل بِهِ الْأَفْعَال الاختيارية»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الاستطاعة: هو عَرَضٌ يخلقه الله في الحَيَوان يفعل به الأفعال الاختيارية، وهي والقدرةُ والوُسْعُ والطاقة متقاربة المعنى»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«وَالِاسْتِطَاعَةُ مُشْتَقَّةٌ مِنَ الطَّوْعِ، كَأَنَّهَا كَانَتْ فِي الْأَصْلِ الِاسْتِطْوَاعُ... وَالْعَرَبُ تَقُولُ: تَطَاوَعْ لِهَذَا الْأَمْرِ حَتَّى تَسْتَطِيعَهُ»"
          source: "مقاييس اللغة لابن فارس — جذر طوع"
          addition: "يكشف أن الاستطاعة مشتقة من الطَّوْع (الانقياد)، مما يُبرز دلالة الإرادة والطواعية الذاتية في المفهوم لا مجرد الإمكانية المادية."

    - lemma: "مَقْدِرَة"
      confirm:
        - text: "«المَقْدُرَةُ: القُدْرة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الْمقدرَة: الْقُدْرَة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«مَقْدِرة» — en: asset; capability; capacity (performance)"
          source: "المعجم الموحد لمصطلحات المياه (ArabTerm)"
        - text: "«مَقْدِرَة» — en: ability"
          source: "المعجم الطبي الموحد (ArabTerm)"
        - text: "«مَقْدِرَة» — en: capability"
          source: "المعجم الطبي الموحد (ArabTerm)"
        - text: "«مقدرة» — en: capacity"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"

    - lemma: "مُكْنَة"
      confirm:
        - text: "«المُكْنَةُ: القدرة والاستطاعة، والقوة والشِّدَّة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«المكنة: الْقُدْرَة والاستطاعة وَالْقُوَّة والشدة. المكنة: التَّمَكُّن والمكانة تَقول الْعَرَب إِن ابْن فلَان لذُو مكنة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"

    - lemma: "أَهْلِيَّة"
      confirm:
        - text: "«الأَهْلِيَّة للأمر: الصلاحية له»"
          source: "المعجم الوسيط (OCR)"
        - text: "«صلاحية الإنسان قانوناً للوجوب أو الأداء»"
          source: "المعجم الكبير (OCR)"
        - text: "«أهلية» — en: aptitude"
          source: "المعجم الموحد لمصطلحات المياه (ArabTerm)"
        - text: "«أهلية» — en: competence / competency"
