    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزية؛ بنية «امتلاك الصفات» غريبة على
        أسلوب المعاجم العربية. لا يُحدّد الجنس القريب (نوع من الملكات النفسية).
        قيد «خاصة العقلية» مُقحَم بين قوسين ولا يتكامل مع بنية التعريف.
        لا يُميّز بين القدرة الفطرية والمكتسبة.
    authored:
      - type: terminological
        text: >
          مَلَكَةٌ نفسيّة فطريّة أو مكتسبة تُمكّن الشخصَ من أداء فعل أو إنجاز
          غرض بعينه، لا سيّما ما تعلّق منها بالوظائف العقلية كالتحليل والاستدلال
          والتعلّم.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
