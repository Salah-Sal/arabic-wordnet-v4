# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-07963280-n
# people who are destined to die soon — الناس الذين قُدّر عليهم الموت قريباً
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«محتوم مصيرهم» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ يمكن إبدال «مصيرهم» بـ«قدرهم» أو «حظهم» فيبقى التعبير صالحاً — يفشل في اختبار السكّ"
      - "«هالكون» جمع مذكر سالم لاسم الفاعل «هالك» يدل غالباً على من هلك فعلاً لا على من سيهلك قريباً، لكنه يصح في الاستعمال الاستشرافي"
      - "المجموعة الترادفية تفتقر إلى لمّة مفردة (غير تركيبية) تعبّر عن المفهوم مباشرة"
    observations: "المفهوم هو جماعة من البشر قُضي عليهم بالموت الوشيك. في العربية يُعبَّر عن هذا المفهوم عادة بصيغ اسم الفاعل الجمعية (هالكون/هَلْكى) أو بتراكيب وصفية. وزن فَعْلى (كقَتْلى وجَرْحى ومَرْضى) هو الأنسب دلالياً لجماعة مصابة بحالة، وجذر هلك هو الأقرب لدلالة الهلاك والموت المقدَّر. التعريف الحالي مقبول لكن يمكن تحسينه بأسلوب معجمي أدق."

  blind_candidates:
    - lemma: "هَلْكَى"
      generation_method: ishtiqaq
      justification: "جمع تكسير لـ«هالك» على وزن فَعْلى، وهو الوزن المخصّص للجماعات المصابة بحالة (كجَرْحى وقَتْلى ومَرْضى)، يدل على جماعة مقبلة على الهلاك"
    - lemma: "مَحْتُومُون"
      generation_method: ishtiqaq
      justification: "جمع مذكر سالم لـ«محتوم» (اسم مفعول من حَتَمَ)، أي من حُتم عليهم الموت وقُضي به"
    - lemma: "مَقْضِيٌّ عَلَيْهِمْ"
      generation_method: tarkib
      justification: "تركيب وصفي من اسم المفعول «مقضيّ» مع شبه الجملة «عليهم»، يدل على من صدر فيهم قضاء الموت"
    - lemma: "مُسْتَمِيتُون"
      generation_method: ishtiqaq
      justification: "جمع مذكر سالم لـ«مُسْتَمِيت» (اسم فاعل من استمات، الباب العاشر من موت)، يدل على من يواجه الموت أو يستسلم له"


stage2_evidence:
  per_lemma:
    - lemma: "محتوم مصيرهم"
      evidence_status: "no_material_found"

    - lemma: "هَالِكُون"
      confirm:
        - text: "«هُلَّك من (ه ل ك) جمع هَالِك بمعنى الميت»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«الهاء واللام والكاف: يدل على كسر وسقوط. منه الهلاك: السقوط، ولذلك يقال للميت هلك. وناس مهتلكون وهُلَّاك»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أن هالك يُستعمل للميت ولمن يُلقي نفسه في المهالك"

    - lemma: "هَلْكَى"
      expands:
        - text: "«الهاء واللام والكاف: يدل على كسر وسقوط. منه الهلاك: السقوط، ولذلك يقال للميت هلك»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر هلك يدل على الهلاك، ووزن فَعْلى قياسي لجمع فاعل في باب الآفات والمصائب"
        - text: "«ولا هُلُكِ المفارش عُزَّلِ»"
          source: "مقاييس اللغة (شاهد هُذَلي)"
          addition: "شاهد على استعمال صيغة جمع من هالك في الشعر"

    - lemma: "مَحْتُومُون"
      confirm:
        - text: "«(1) محتوم؛ مقدَّر (2) محكوم عليه بالهلاك»"
          source: "المورد الحديث (2008) — مقابل fated"
      expands:
        - text: "«الصواب والرتبة: أَمْرٌ محتَّم [فصيحة] — أَمْرٌ محتوم [فصيحة]. مجيء فَعَل بمعنى فَعَّل كثير في لغة العرب»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يؤكد فصاحة محتوم لكنه يُوصف به الأمر المجرد لا الأشخاص عادةً"
        - text: "«الحاء والتاء والميم... إحكام الشيء. يقال: حتّم عليه... الحاتم: الذي يقضي الشيء»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر حتم يدل على القضاء والإحكام"

    - lemma: "مَقْضِيٌّ عَلَيْهِمْ"
      evidence_status: "no_material_found"

    - lemma: "مُسْتَمِيتُون"
      contradicts:
        - text: "«مُدان؛ محكومٌ عليه»"
          source: "المورد الحديث (2008) — مقابل condemned"
          conflict: "المستميت في العربية يدل على من يستبسل ويقاتل حتى الموت طلباً له، لا على من قُدّر عليه الموت"


stage3_analysis:
  per_lemma:
    - lemma: "محتوم مصيرهم"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل في اختبار السكّ واختبار التثبيت المعجمي: يمكن إبدال «مصيرهم» بـ«قدرهم» أو «أجلهم» دون تغيّر المعنى. لم يُعثر على أي دليل معجمي يثبت أنها وحدة معجمية ثابتة"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "هَالِكُون"
      decision: confirmed
      decision_reason: "جمع مذكر سالم لاسم الفاعل «هالك» من الجذر هلك الذي يدل على السقوط والموت. الصيغة فصيحة ومؤكدة في المعاجم. يُستعمل استشرافياً لمن يُقبل على الهلاك"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على فعل الهلاك نفسه (السقوط والموت) بصيغة اسم الفاعل، ويدل على من هو في طريقه إلى الهلاك أو في حالته"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَالِكُون"

    - lemma: "هَلْكَى"
      source: stage1
      decision: confirmed
      decision_reason: "جمع تكسير على وزن فَعْلى، وهو القياس في جمع فاعل من أفعال الآفات والمصائب (كقَتْلى وجَرْحى ومَرْضى وصَرْعى). الجذر هلك مؤكد في مقاييس اللغة بدلالة الموت والسقوط، والوزن أبلغ من الجمع السالم في الدلالة على الجماعة المصابة"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أبلغ من «هالكون» في الدلالة على حالة جماعية مأساوية؛ وزن فَعْلى يوحي بالرثاء والمصيبة الشاملة، كما في قَتْلى ومَرْضى"
      actions:
        - command: create_entry
          params: {lemma: "هَلْكَى", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَحْتُومُون"
      source: stage1
      decision: removed
      decision_reason: "«محتوم» يُوصف به الأمر المجرد (أمر محتوم، قضاء محتوم) لا الأشخاص. لم يُعثر على شاهد يُستعمل فيه «محتومون» وصفاً لجماعة بشرية. التوسع في استعماله للأشخاص مولَّد غير مأنوس"
      evidence_assessment:
        case: mixed

    - lemma: "مَقْضِيٌّ عَلَيْهِمْ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حر يفشل في اختبار السكّ: يمكن قول «مَحْكومٌ عليهم» أو «مَقْدورٌ عليهم» بالمعنى نفسه. ليس وحدة معجمية ثابتة"
      evidence_assessment:
        case: no_material

    - lemma: "مُسْتَمِيتُون"
      source: stage1
      decision: removed
      decision_reason: "المستميت في العربية يدل على من يستبسل في القتال طلباً للموت أو استسلاماً له، لا على من قُدّر عليه الموت. الدلالة مختلفة عن المفهوم المطلوب"
      evidence_assessment:
        case: contradicts_only


