# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «كوزموبوليتانية» دخيلة مباشرة من الإنجليزية/اليونانية، لا تستوفي شروط التعريب المقبول: لا تنسجم مع أوزان العربية الصرفية ولا تندمج في منظومتها الاشتقاقية بسلاسة، ولا ترد في أيّ معجم موثوق بصيغة الاسم المجرد"
      - "التعريف الحالي دائري: يستخدم «عالمياً» المشتق من لمّة «عالمية» نفسها، كما يكرر «كوزموبوليتانياً» الذي هو نقحرة حرفية للكلمة الأجنبية"
      - "لمّة «عالمية» تحمل دلالات متعددة (دولية، عالمية الانتشار، عالمية الطابع) مما يُضعف دقتها في الإحالة الصريحة إلى المفهوم الفلسفي للكوزموبوليتانية"
      - "غياب اللمّة الأدق دلالةً من قائمة اللمّات الموجودة: «كَوْنِيَّة» الموثقة في المعجم المتخصص بالترجمة الدقيقة cosmopolitanism"
    observations: >
      المجموعة الترادفية تُعبّر عن مفهوم فلسفي-اجتماعي يتصل بنظرية «المواطنة العالمية»
      (Cosmopolitanism) التي تُقرّ بانتماء الإنسان إلى الجنس البشري كله دون تقييد بحدود قومية
      أو إقليمية. المفهوم حاضر في التراث العربي الإسلامي (فكرة الأخوة الإنسانية والوحدة في
      الخلق) وإن لم يُصكّ له مصطلح موحَّد راسخ. البنية الإجمالية للمجموعة سليمة غير أن اللمّات
      تحتاج إعادة نظر: حذف الدخيل وإضافة المصطلح الأدق توثيقاً.
  blind_candidates:
    - lemma: "كَوْنِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي على وزن فَعْلِيَّة من «كَوْن» (الوجود المطلق الشامل)، يحمل معنى الانتماء إلى الكون بأسره؛ وهو ما يُعبّر عنه مفهوم الكوزموبوليتانية: كون الشخص أو الفكرة ذا طابع كوني شامل غير مقيّد بحدود محلية"
    - lemma: "شُمُولِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «شَمَل» (الإحاطة من الجوانب)، يُعبّر عن خاصية الاستيعاب الكلي وتجاوز الحدود الجزئية؛ قريب من الدلالة العامة للكوزموبوليتانية من حيث الاشتمال والعموم"
    - lemma: "مَسْكُونِيَّة"
      generation_method: majaz
      justification: "مجاز من «المسكونة» (المعمورة، الأوكومينية اليونانية oikoumene) — توسيع دلالي من معنى الأرض المأهولة إلى معنى الانتماء لعموم المعمورة، مستوحى من الأصل اليوناني لمصطلح kosmos+polites"
    - lemma: "رُحْبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «رَحُبَ» (اتسع وانفتح)، بمجاز يُعبّر عن رحابة الأفق وسعة الانتماء تجاوزاً للحدود الضيقة؛ إحياء للجذر التراثي الدال على الاتساع الحضاري"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات مُنفَّذة: ٤ استعلامات
#   ١. مطابقة دفعية للمّات الست + صيغ ال- (headword_norm IN 12 terms)
#   ٢. جسر إنجليزي: cosmopolitanism, cosmopolitan, universalism, universality, globalism
#   ٣. بحث FTS بكلمات مفتاحية: كوني، شمول، عالمي، شمولي
#   ٤. مقاييس اللغة (dictionary_id=151): جذور كون، علم، رحب، شمل
# entry_ids للمّات الرئيسية: عالمية=498315 | كونية=497873,941574 | شمولية=487903,496425,496483 | رحبية=10311
stage2_evidence:
  per_lemma:
    - lemma: "عالمية"
      confirm:
        - text: "«(1) العمومية؛ الشمولية؛ العالمية؛ الكلية إلخ (2) عالمية المدى. وبخاصة: اتساع أفق الفكر.»"
          source: "المورد الحديث (2008) — ترجمة universality"
        - text: "«نزعة تتوخى بلوغ الكليات الإنسانية في أعمال جوته وتنظيرات المقارنين الذين يبحثون في الأدب العام عن نظرية للمتخيل الأنثروبولوجي.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ترجمة internationality"
      expands:
        - text: "«(1) cosmopolite (2) «أ»، كوزموبوليتانيّ: .أ» عالميّ، غير محلّي. .ب» متحرِّر من الأحقاد القومية أو المحلية. .ج» مؤلف من عناصر اجتمعت من مختلف أرجاء العالم a cosmopolitan city or culture.»"
          source: "المورد الحديث (2008) — ترجمة cosmopolitan"
          addition: "يُعادل المورد الحديث «عالمي» بـ cosmopolitan كمرادف رئيسي للصفة، مما يدعم اشتقاق «عالمية» للدلالة على الحالة المجردة"

    - lemma: "كوزموبوليتانية"
      expands:
        - text: "«(1) cosmopolite (2) «أ»، كوزموبوليتانيّ: .أ» عالميّ، غير محلّي.»"
          source: "المورد الحديث (2008) — ترجمة cosmopolitan"
          addition: "يرد الشكل «كوزموبوليتاني» بوصفه صيغة صفة عرضية لا اسم حالة مستقل، مما يدل على عدم استقرار هذا التعريب بصيغة المصدر الصناعي (-ية)"

    - lemma: "كَوْنِيَّة"
      confirm:
        - text: "«تشير إلى انتماء حضاري وإنساني وإلى كليات مشتركة بين الكتاب تطمح إلى نوع من العالمية، التي روّج لها جوته في أشعاره وكتاباته. كما ساهمت الاكتشافات وجمهورية الآداب في وضع لبنات المواطنة العالمية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ترجمة cosmopolitanism [entry_id=497873]"
        - text: "«كَوْنِيَّة — من (ك و ن) نسبة إلى الكَوْن بمعنى الموجود المطلق العام، وحصول الصورة في المادة بعد أن لم تكن حاصلة فيها كتحول الطين إلى إبريق.»"
          source: "موسوعة السلطان قابوس لأسماء العرب [entry_id=941574] — توثيق الاشتقاق الصرفي"

    - lemma: "شُمُولِيَّة"
      contradicts:
        - text: "«التطرق إلى كل الجوانب التي تتعلق بموضوع معين.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — ترجمة exhaustiveness [entry_id=487903]"
          conflict: "دلالة الشمولية في المعاجم العربية تنصرف إلى «الاستيعاب الكامل» و«الاستيفاء المنهجي»، وهي دلالة معلوماتية-منطقية لا صلة لها بالانتماء الإنساني الكوني"
        - text: "«صفة تنعت بها الدراسة أو المتن الذي يضع في الحسبان جميع الوقائع اللغوية قيد الدرس.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ترجمة Exhaustivity [entry_id=496425]"
          conflict: "المعنى المعجمي الموثق للشمولية يتعلق بالاستيفاء المنهجي والتغطية الكاملة لا بمفهوم الكوزموبوليتانية"

    - lemma: "مَسْكُونِيَّة"
      evidence_status: "no_material_found"

    - lemma: "رُحْبِيَّة"
      contradicts:
        - text: "«الرُّحبة»"
          source: "المعجم الوسيط — مدخل الرحبية [entry_id=10311]"
          conflict: "الرحبية في المعجم الوسيط تُفيد معنى «الرحبة» (الساحة الفسيحة أو الأرض الواسعة المحلال) لا الانفتاح الكوني؛ لا أثر لاستخدامها اصطلاحياً في السياق الكوزموبوليتاني"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "عالمية"
      decision: confirmed
      decision_reason: >
        اللمّة موثقة في معاجم متخصصة حديثة كمعادل عربي لـ universality/internationality، وفي المورد
        الحديث كمرادف أساسي للصفة cosmopolitan. وإن كانت translation_en «internationality» لا
        «cosmopolitanism» بالضبط، إلا أنها الكلمة العربية الأوسع انتشاراً والأعمق جذراً في الخطاب
        العربي المعاصر للتعبير عن هذا المفهوم. مشتقة من «عَالَم» الواردة في مقاييس اللغة. تحتاج
        إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُؤكّد الطابع العالمي من حيث الانتشار في العالم والنطاق الدولي الواسع؛ تُستخدم في
        السياقات الثقافية والأدبية والاجتماعية للدلالة على تجاوز المحلية نحو الكلية الإنسانية.
        هي الأعمّ استخداماً في اللغة العربية المعاصرة وأقل تقنيةً من «كَوْنِيَّة» في الاصطلاح الفلسفي
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَالَمِيَّة"

    - lemma: "كوزموبوليتانية"
      decision: removed
      decision_reason: >
        لفظ دخيل غير معرَّب بصورة صحيحة: لا يُجري عليه المعجم العربي الاشتقاق، ولا يرد في أيّ
        معجم موثوق بصيغة الاسم المجرد المستقل. المورد الحديث يذكر «كوزموبوليتاني» فحسب كصيغة
        صفة عرضية في سياق تعريف الكلمة الإنجليزية. يُستعاض عنه بـ«كَوْنِيَّة» الموثقة بالترجمة
        الدقيقة في المعجم المتخصص. فحص الاقتراض: دخيلة — لا تقبل الاندراج السلس في المنظومة
        الصرفية ولم تُصكّ بعد في المعاجم الرسمية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كَوْنِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثقة في المعجم الموحد لمصطلحات اللسانيات (2002) بالترجمة الدقيقة cosmopolitanism، مع
        تعريف يكشف انتماءها للمجال الفلسفي-الثقافي (المواطنة العالمية، الكليات الإنسانية المشتركة).
        الاشتقاق صحيح من جذر «كون» المُدوَّن في ابن فارس. موسوعة السلطان قابوس تؤكد النسب إلى
        الكَوْن (الوجود المطلق العام). تستوفي معايير الجودة الاصطلاحية: اطّراد صرفي (فَعْلِيَّة)،
        يُسر تداول، ملاءمة دلالية دقيقة، إيثار للعربي الأصيل.
        فحص السكّ: لا يمكن إبدال «كَوْن» بمرادف وإبقاء المصطلح — النسبة صارمة.
        اختبار التثبيت المعجمي: وحدة معجمية مسجّلة في مرجع متخصص.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُحيل تحديداً إلى المفهوم الفلسفي للكوزموبوليتانية بمعنى الانتماء الكوني الإنساني والمواطنة
        العالمية؛ أكثر دقةً من «عَالَمِيَّة» في سياقات النقد الأدبي المقارن والفلسفة السياسية، وتُميّزها
        دلالةُ الكوْن (الوجود الإنساني الكلي) عن دلالة «عالمية» التي قد تنصرف إلى الانتشار الجغرافي
      actions:
        - command: create_entry
          params:
            lemma: "كَوْنِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "شُمُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم المتخصصة توثّق الشمولية في حقول اللسانيات والمعلوماتية والاجتماعيات بمعاني
        «الاستيفاء» و«الإحاطة المنهجية» و«الكلية» (exhaustiveness, totality)، لا بمعنى
        الكوزموبوليتانية. الدلالتان متباينتان: الشمولية تصف خاصية إجرائية في الاستقصاء المنهجي،
        أما الكوزموبوليتانية فتصف موقفاً فلسفياً-حضارياً يتعلق بالانتماء الإنساني.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مَسْكُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أثر معجمي لهذا المصطلح في قاعدة البيانات (no_material_found). الفكرة الاشتقاقية من
        «المسكونة» مثيرة للاهتمام نظرياً لكن المصطلح لم يُصكّ بعد في الاستعمال العربي. لا يجوز
        ترسيخه في الشبكة الدلالية بلا سند معجمي وفق مبدأ التثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "رُحْبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الوسيط يثبت «الرحبية» بمعنى «الرحبة» (الساحة والأرض الفسيحة)، وهو معنى مكاني
        لا علاقة له بالكوزموبوليتانية. نقل المعنى المجازي لـ«رحابة الأفق» إلى مصطلح فلسفي يفتقر
        إلى سند استعمالي موثق. اختبار التثبيت المعجمي: فاشل.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


