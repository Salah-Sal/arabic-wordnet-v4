# مراجعة المجموعة الترادفية — awn4-10544566-n (rester)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «شخص يستريح» دائري: يستخدم الفعل «يستريح» لتعريف اسم الفاعل «مُسْتَرِيح»."
      - "المجموعة تحوي لمّة واحدة فقط (مستريح) وهو فقير لمجموعة ترادفية."
      - "الرابط التصنيفي المباشر (hypernym) هو «عامل / فاعل — شخص يعمل ويُنجِز الأمور» وهو مُلتبس دلالياً لأنّ المستريح نقيض العامل ظاهرياً، وإن كان المقصود «فاعل» بالمعنى العام (مَن يقوم بفعل ما)."
    observations: "المفهوم بسيط ومباشر: شخص يُمارِس الراحة أو يأخذ قسطاً منها. الجذر «ر و ح» غزير الاشتقاق في العربية، ويُتيح صيغاً متعددة (مستريح، مرتاح، مُتروِّح). المجموعة تحتاج إثراءً بلمّات إضافية وتعريفٍ غير دائري."

  blind_candidates:
    - lemma: "مُرْتَاح"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «ارتاح» (باب الافتعال من الجذر ر و ح) على وزن مُفْتَعِل، يدلّ على من وجد الراحة والطمأنينة بعد تعب."
    - lemma: "هَاجِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «هَجَعَ» على وزن فَاعِل، يدلّ على من سكن واستراح، وقد يُستعمل بمعنى النائم."
    - lemma: "رَاقِد"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «رَقَدَ» على وزن فَاعِل، يدلّ على من اضطجع واستراح أو نام."
    - lemma: "وَادِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «وَدُعَ» على وزن فَاعِل، بمعنى الساكن المطمئن الذي لا يعمل شيئاً."


stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَرِيح"
      confirm:
        - text: "«المستريح: من العباد من أطلعه الله على سر القدر؛ لأنه يرى أن كل مقدور يجب وقوعه في وقته المعلوم، وكل ما ليس بمقدور يمتنع وقوعه، فاستراح من الطلب والانتظار لما لم يقع.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«المستريح: من العباد: من أطلعه الله على سر القدر، فإنه يرى أن كل مقدر يجب وقوعه في وقته المعلوم، وكل ما ليس بمقدور يمتنع وقوعه. فاستراح من الطلب والانتظار لما لم يقع.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«(استراح) وَجَدَ الرَّاحَةَ»"
          source: "المعجم الوسيط"
          addition: "الفعل «استراح» مُعرَّف بـ«وجد الراحة» مما يؤكد أنّ «المستريح» هو من وجد الراحة."

    - lemma: "مُرْتَاح"
      expands:
        - text: "«(3) مرتاح؛ متحرِّر من الألم أو القلق إلخ»"
          source: "المورد الحديث (2008)"
          addition: "ورد «مرتاح» ترجمةً لـ at rest بمعنى المتحرر من الألم أو القلق، وهو قريب من معنى المستريح لكنه يركّز على الحالة لا الفعل."

    - lemma: "هَاجِع"
      contradicts:
        - text: "«(هَجَعَ) الْهَاءُ وَالْجِيمُ وَالْعَيْنُ: كَلِمَةٌ تَدُلُّ عَلَى نَوْمٍ. وَهَجَعَ هُجُوعًا: نَامَ لَيْلًا.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الهجوع مختص بالنوم ليلاً، وليس مطلق الراحة."
      expands:
        - text: "«dormant»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستعمل «هاجع» في المصطلحات الطبية بمعنى الخامل/النائم (dormant)، وهو أخصّ من الاستراحة العامة."

    - lemma: "رَاقِد"
      evidence_status: "no_material_found"

    - lemma: "وَادِع"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "مُسْتَرِيح"
      decision: confirmed
      decision_reason: "اسم فاعل قياسي من «استراح» (استفعل من ر و ح) على وزن مُسْتَفْعِل. المعنى مباشر ومطابق لتعريف المجموعة. الشواهد المعجمية تؤكد استعماله وإن كان المعنى الصوفي المسجّل أخصّ، فإنّ المعنى اللغوي العام (من يستريح) حيّ ومتداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَرِيح"

    - lemma: "مُرْتَاح"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من «ارتاح» (افتعل من ر و ح) على وزن مُفْتَعِل. شائع الاستعمال في الفصحى والإعلام بمعنى من وجد الراحة. ورد في المورد الحديث ترجمةً لـ at rest. يُضيف بُعداً دلالياً للمجموعة إذ يركّز على حالة الراحة النفسية والبدنية أكثر من فعل الاستراحة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "«مُرْتَاح» يصف حالة الراحة والطمأنينة المحقَّقة (نتيجة)، بينما «مُسْتَرِيح» يصف من يمارس فعل الاستراحة (عملية)."
      actions:
        - command: create_entry
          params: {lemma: "مُرْتَاح", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "هَاجِع"
      source: stage1
      decision: removed
      decision_reason: "الهجوع في أصل اللغة مختصّ بالنوم ليلاً كما صرّح ابن فارس في مقاييس اللغة، وليس مطلق الراحة. كما أنّ استعماله الاصطلاحي الحديث (dormant) يدلّ على الخمول والكمون لا على الراحة الاختيارية."
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَاقِد"
      source: stage1
      decision: removed
      decision_reason: "الرقود يدلّ على النوم والاضطجاع أساساً، وهو أخصّ من مطلق الراحة. لم تُوجد شواهد معجمية تدعم استعماله بمعنى «من يستريح» دون نوم."
      evidence_assessment:
        case: no_material

    - lemma: "وَادِع"
      source: stage1
      decision: removed
      decision_reason: "الوداعة تدلّ على السكينة والدعة وهي صفة مزاجية دائمة أكثر منها فعل استراحة مؤقت. لم تُوجد شواهد معجمية تدعم استعماله بمعنى «المستريح»."
      evidence_assessment:
        case: no_material


