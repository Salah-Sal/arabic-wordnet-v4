      decision: confirmed
      decision_reason: "تعبير اصطلاحي ملطَّف مسكوك، شائع في الخطاب الإعلامي والرسمي العربي المعاصر، وإن كان طويلاً فهو وحدة معجمية ثابتة لا يُستبدل أحد مكوّناتها بمرادف"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير ملطَّف (euphemism) يتجنّب الوصم المباشر، يُستعمل في السياقات الرسمية والإعلامية والحقوقية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ذَوُو الِاحْتِيَاجَاتِ الْخَاصَّةِ"

    - lemma: "مُعَاقُون"
      decision: confirmed
      decision_reason: "لفظ مباشر شائع الاستعمال في العربية المعاصرة، مؤيَّد بشواهد من المورد الحديث والمعاجم المصطلحية. اسم مفعول من أَعَاقَ (أفعل) جمع مذكر سالم"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ مباشر عامّ الاستعمال، يشمل الإعاقة الجسدية والعقلية في التداول المعاصر، أكثر شيوعاً من مُعَوَّقُون"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعَاقُون"

    - lemma: "مُعَوَّقُون"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح طبي رسمي وارد في المعجم الطبي الموحد والمورد الحديث، اسم مفعول من عَوَّقَ (فعَّل). يمثّل المصطلح الاختصاصي الدقيق مقابل الشائع العامّ (مُعَاقُون)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح طبي واختصاصي أدقّ من مُعَاقُون، يدل على مَن أصابه ما يعوقه عن العمل تحديداً، مفضَّل في السياق الطبي والمؤسسي"
      actions:
        - command: create_entry
          params:
            lemma: "مُعَوَّقُون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "ذَوُو الإِعَاقَةِ"
      source: stage1
      decision: removed
      decision_reason: "رغم شيوعه في الخطاب المعاصر، فإن المجموعة تحتوي بالفعل على تعبير إضافي مسكوك (ذوو الاحتياجات الخاصة) وعلى اللفظ المباشر (معاقون)، فإضافة تركيب إضافي ثانٍ قريب الدلالة يُثقل المجموعة دون إضافة تمايز دلالي كافٍ"

    - lemma: "عَجَزَة"
      source: stage1
      decision: removed
      decision_reason: "العَجَزَة في المعاجم الكلاسيكية (المعجم الوسيط) تعني آخر ولد الرجل، لا جمعَ عاجز بمعنى المعاق. الجمع الصحيح لعاجز هو عاجزون أو عواجز، وكلاهما لا يختصّ بالإعاقة"

    - lemma: "مُقْعَدُون"
      source: stage1
      decision: removed
      decision_reason: "المُقعَد في التراث يدل تحديداً على مَن أقعده الداء فلم يقدر على الحركة (الشلل)، وهو أضيق من مفهوم المجموعة الذي يشمل أنواع الإعاقة الجسدية كافة. كما أن اللفظ قد يُلتبس بالمعنى الشائع للمقعد (الكرسي)"

