# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07962874-n
# disabled / handicapped — مجموعة الناس ذوي الإعاقة الجسدية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «ذوو الاحتياجات الخاصة» تعبير ملطَّف طويل (٤ كلمات)، قد لا يكون مصطلحاً معجمياً بقدر ما هو عبارة تداولية"
      - "اللمّة «معاقون» بلا تشكيل، وتحتاج ضبطاً صرفياً"
      - "لا يوجد في المجموعة مصطلح كلاسيكي أو طبي رسمي مثل مُعَوَّقُون"
    observations: "المجموعة تمثّل مفهوم الفئة الاجتماعية من ذوي الإعاقة الجسدية، وهو مفهوم موجود في الثقافة العربية بتعبيرات متعددة تتراوح بين التلطيف (ذوو الاحتياجات الخاصة) والمباشرة (معاقون). يُلاحظ غياب اللفظ الطبي الرسمي (مُعَوَّقُون) الوارد في المعاجم الطبية الموحّدة. التعريف الحالي مقبول لكنه يكرر مفهومَيْ العجز والإعاقة دون تمييز واضح بينهما."
  blind_candidates:
    - lemma: "مُعَوَّقُون"
      generation_method: ishtiqaq
      justification: "اسم مفعول من عَوَّقَ (فعّل) على وزن مُفَعَّل، جمع مذكر سالم. يدل على مَن أصابه ما يعوقه عن العمل والحركة. مصطلح طبي رسمي وارد في المعجم الطبي الموحّد."
    - lemma: "ذَوُو الإِعَاقَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي مسكوك شائع في الخطاب الرسمي والقانوني المعاصر. أقصر من (ذوو الاحتياجات الخاصة) وأكثر مباشرة."
    - lemma: "عَجَزَة"
      generation_method: ishtiqaq
      justification: "جمع تكسير على وزن فَعَلَة من عاجز، للدلالة على الجماعة. لكن يحتاج تحقيقاً في المعاجم لأن الوزن قد يكون مخصصاً لمعنى آخر."
    - lemma: "مُقْعَدُون"
      generation_method: majaz
      justification: "من أَقْعَدَ: أقعده الداء عن الحركة. مجاز مرسل علاقته السببية. وارد في كشّاف اصطلاحات الفنون بمعنى الزَّمِن."

stage2_evidence:
  per_lemma:
    - lemma: "ذَوُو الِاحْتِيَاجَاتِ الْخَاصَّةِ"
      evidence_status: "no_material_found"

    - lemma: "مُعَاقُون"
      confirm:
        - text: "«مُعاق؛ مُعَوَّق: مُصاب بعجز يَعُوقُهُ عن العمل»"
          source: "المورد الحديث (2008)"
        - text: "«(1) مُعاق؛ عاجز (2) متخلِّف عقليًا»"
          source: "المورد الحديث (2008) — مقابل handicapped"
      expands:
        - text: "«طفل معاق — معوق»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يؤكد استعمال معاق في السياق التربوي مرادفاً لمعوق"

    - lemma: "مُعَوَّقُون"
      confirm:
        - text: "«مُعَوَّق ؛ مَعُوْق [ج:مُعَوَّقون]» — handicapped"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُعاق؛ مُعَوَّق: مُصاب بعجز يَعُوقُهُ عن العمل»"
          source: "المورد الحديث (2008)"
        - text: "«منظمات المعوقين» — organizations for the disabled"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«مُعَوَّق — من (ع و ق) الممنوع من الفعل والمثبط عن فعل الخير، وصاحب العاطة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يوسّع الدلالة لتشمل المنع العام من الفعل، لا الجسدي فحسب"

    - lemma: "ذَوُو الإِعَاقَةِ"
      evidence_status: "no_material_found"

    - lemma: "عَجَزَة"
      contradicts:
        - text: "«(العجزة) آخر ولد الرجل (للمذكر والمؤنث والجمع) ويقال هو ابن عجزة وولد لعجزة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "العَجَزَة في المعاجم بمعنى آخر ولد الشيخ، لا جمع عاجز بمعنى المعاق"
        - text: "«آخرُ ولدِ الرَّجُل»"
          source: "المعجم الوسيط (OCR)"
          conflict: "تأكيد المعنى نفسه: آخر الولد، لا علاقة بالإعاقة"

    - lemma: "مُقْعَدُون"
      confirm:
        - text: "«المقعد: لغة هو الذي أقعده الداء عن الحركة. وعند الأطباء هو الزّمن. وقيل هو المتشنّج الأعضاء والزّمن الذي طال مرضه»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«شَخْصٌ عَاجِزٌ» — disabled person"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يبيّن أن المصطلح الطبي الحديث يفضّل (عاجز) على (مُقعَد)"

stage3_analysis:
  per_lemma:
