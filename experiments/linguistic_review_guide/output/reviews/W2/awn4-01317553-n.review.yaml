stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (ساكن، قاطن) عامة جداً ولا تعكس خصوصية 'التجنس' الواردة في التعريف."
      - "نقص التشكيل في اللمّات الحالية."
    observations: "المجموعة تستهدف المعنى البيولوجي لمصطلح (denizen) وهو الكائن الحي (نبات أو حيوان) الذي استوطن بيئة جديدة وأصبح جزءاً منها (naturalized). اللمّات الحالية تعبر عن مجرد السكن، بينما المصطلح العلمي يتطلب التعبير عن عملية 'التجنس' أو 'الاستيطان' بعد الإدخال."
  blind_candidates:
    - lemma: "مُتَجَنِّس"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (جنس) للتعبير عن الكائن الذي أصبح من جنس أهل المنطقة، وهو المصطلح المستخدم في التعريف نفسه."
    - lemma: "مُسْتَوْطِن"
      generation_method: ishtiqaq
      justification: "من الجذر (وطن) على وزن (مستفعل) للتعبير عن اتخاذ المكان وطناً والاستقرار فيه، ويستخدم بكثرة في البيولوجيا للكائنات المستقرة."
    - lemma: "مُتَأَهِّل"
      generation_method: majaz
      justification: "من الأهل، أي أصبح من أهل المنطقة المستوطنة."
    - lemma: "نَزِيل"
      generation_method: majaz
      justification: "يستخدم أحياناً للتعبير عن الكائن الذي حلّ بمكان واستقر فيه، وإن كان غلب عليه الاستخدام البشري (ضيف)."

stage2_evidence:
  per_lemma:
    - lemma: "سَاكِن"
      confirm:
        - text: "«شخص أو أي كائن حي يعيش باستقرار في مكان معين.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
    - lemma: "قَاطِن"
      confirm:
        - text: "«المقيم بالمكان الملازم له.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُجَنَّس"
      confirm:
        - text: "«شجرة أو نبات تم إدخاله والذي أصبح طبيعي التجدد ومنتشرا.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
    - lemma: "مُتَجَنِّس"
      confirm:
        - text: "«حيوان أو نبات متأقلم مع بيئة جديدة»"
          source: "المورد الحديث (تعريف denizen)"
    - lemma: "مُسْتَوْطِن"
      confirm:
        - text: "«طفيلي مستوطن دم الثوي»"
          source: "المعجم الطبي الموحد"

stage3_analysis:
  per_lemma:
    - lemma: "ساكن"
      decision: confirmed
      decision_reason: "مصطلح عام صحيح لغوياً لوصف الكائن الحي المقيم في بيئة ما، ومؤكد في المعاجم التقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَاكِن"
    - lemma: "قاطن"
      decision: confirmed
      decision_reason: "مرادف لـ 'ساكن' ويستخدم لوصف المقيم الملازم للمكان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَاطِن"
    - lemma: "مُجَنَّس"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح العلمي الأدق لوصف النبات أو الحيوان الذي تم إدخاله واستقر (Naturalized)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُجَنَّس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُتَجَنِّس"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة مطاوعة مستخدمة في التعريف وفي المعاجم الحديثة لوصف الكائن المتأقلم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُتَجَنِّس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُسْتَوْطِن"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم في السياق البيولوجي لوصف الكائنات التي اتخذت بيئة ما موطناً لها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُسْتَوْطِن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "نبات أو حيوان متجنس في منطقة ما"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق لكن يمكن تحسين صياغته لبيان عملية الإدخال والتكيف التي تميز مصطلح denizen."
    authored:
      - type: terminological
        text: "كائنٌ حيٌّ (نباتٌ أو حيوانٌ) أُدْخِلَ إلى منطقةٍ جديدةٍ وتكيَّفَ معها حتّى أصبحَ ينمو ويتكاثرُ فيها كأنهُ أصيل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "سَاكِن"
        examples:
          - text: "يُعدُّ هذا النَّوعُ مِنَ الطُّيورِ سَاكِناً شَائِعاً في الغَابَاتِ المَطِيرَةِ."
            type: usage
      - lemma: "قَاطِن"
        examples:
          - text: "السَّنجَابُ الأحمرُ قَاطِنٌ دَائِمٌ في هَذِهِ المَحْمِيَّةِ."
            type: usage
      - lemma: "مُجَنَّس"
        examples:
          - text: "أَصْبَحَ هَذَا النَّبَاتُ مُجَنَّساً في البِيئةِ المَحَلِيَّةِ بَعْدَ عُقُودٍ مِنِ استِيرَادِهِ."
            type: usage
      - lemma: "مُتَجَنِّس"
        examples:
          - text: "تُعتبرُ بَعضُ الأَسماكِ المَدقُوقَةِ كَائِناً مُتَجَنِّساً في مِيَاهِ البُحَيرَةِ."
            type: usage
      - lemma: "مُسْتَوْطِن"
        examples:
          - text: "توجدُ أنواعٌ مُسْتَوْطِنَةٌ مِنَ الطُّفَيْلِيَّاتِ في دَمِ بَعْضِ الحَيَوَانَاتِ المَحَلِيَّةِ."
            type: usage

