stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «كمية صغيرة غير محددة» عبارة وصفية من أربع كلمات وليست مصطلحاً مسكوكاً؛ تفشل في اختبار السَّكّ (يمكن إبدال «صغيرة» بـ«ضئيلة» أو «قليلة» وتبقى صالحة كوصف)"
      - "المجموعة تفتقر إلى لمّة عربية أصيلة مفردة تدل على المقدار القليل"
      - "اللمّة الحالية ترجمة حرفية للمصطلح الإنجليزي small indefinite quantity"
    observations: "هذا المفهوم — المقدار التقديري الذي يقلّ عن المتوسط — مفهوم أصيل في العربية وله ألفاظ كثيرة (نَزْر، قَلِيل، يَسِير، زَهِيد). المشكلة أن المجموعة تفتقر لأي لفظ مفرد وتكتفي بعبارة وصفية مترجمة."

  blind_candidates:
    - lemma: "نَزْرٌ"
      generation_method: ishtiqaq
      justification: "من جذر ن ز ر الدال على القلة في الشيء، والنَّزْر اسم يدل على المقدار القليل مباشرةً، مسجّل في معاجم الفصحى كالصحاح والوسيط"
    - lemma: "قَلِيلٌ"
      generation_method: ishtiqaq
      justification: "من جذر ق ل ل، صفة مشبّهة تُستعمل استعمال الأسماء بمعنى المقدار القليل من الشيء، ضد الكثير"
    - lemma: "يَسِيرٌ"
      generation_method: ishtiqaq
      justification: "من جذر ي س ر على وزن فَعِيل، يدل على القليل الهيّن، يُستعمل في الوصف والإسناد"
    - lemma: "زَهِيدٌ"
      generation_method: ishtiqaq
      justification: "من جذر ز ه د الدال على قلة الشيء، الزهيد هو القليل الحقير، على وزن فَعِيل"


stage2_evidence:
  per_lemma:
    - lemma: "كمية صغيرة غير محددة"
      evidence_status: "no_material_found"

    - lemma: "نَزْرٌ"
      confirm:
        - text: "«النَزْرَ: القليلُ التافهُ. وقد نزر الشئ بالضم ينزر نزارة. وعطاءٌ مَنْزورٌ، أي قليلٌ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«النُّونُ وَالزَّاءُ وَالرَّاءُ أُصَيْلٌ يَدُلُّ عَلَى قِلَّةٍ فِي الشَّيْءِ. وَنَزُرَ الشَّيْءُ نَزَارَةً. وَشَيْءٌ نَزْرٌ: قَلِيلٌ. وَعَطَاءٌ مَنْزُورٌ: مُقَلَّلٌ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«القليل؛ النَّزْر»"
          source: "المورد الحديث (ترجمة modicum)"
      expands:
        - text: "«وَامْرَأَةٌ نَزُورٌ: قَلِيلَةُ الْوَلَدِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يتوسع الجذر ليشمل القلة في الولد والعطاء والشيء عموماً"

    - lemma: "قَلِيلٌ"
      confirm:
        - text: "«(الْقَلِيل) ضد الْكثير والنادر والقصير الدَّقِيق الجثة (ج) أقلاء وقلل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الْقَافُ وَاللَّامُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى نَزَارَةِ الشَّيْءِ... قَلَّ الشَّيْءُ يَقِلُّ قِلَّةً فَهُوَ قَلِيلٌ، وَالْقُلُّ: الْقِلَّةُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«وَقد يعبر بِالْقَلِيلِ عَن الْعَدَم فَيُقَال رجل قَلِيل الْخَيْر لَا يكَاد يَفْعَله»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يتوسع في الاستعمال حتى يدل على العدم مجازاً"

    - lemma: "يَسِيرٌ"
      confirm:
        - text: "«(الْيَسِير) السهل والقليل والحقير والهين يُقَال شَيْء يسير»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«الْيَاءُ وَالسِّينُ وَالرَّاءُ: أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى انْفِتَاحِ شَيْءٍ وَخِفَّتِهِ، وَالْآخَرُ عَلَى عُضْوٍ مِنَ الْأَعْضَاءِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الاشتقاقي يدل على السهولة والخفة لا على القلة؛ معنى القلة ثانوي"

    - lemma: "زَهِيدٌ"
      confirm:
        - text: "«الزَّهِيْدُ: القليلُ»"
          source: "المعجم الوسيط"
        - text: "«الزَّاءُ وَالْهَاءُ وَالدَّالُ أَصْلٌ يَدُلُّ عَلَى قِلَّةِ الشَّيْءِ. وَالزَّهِيدُ: الشَّيْءُ الْقَلِيلُ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«من الأشياء: القليلُ الحقيرُ من الرِّجالِ: القَلِيلُ الخَيْرِ, اللَّئيمُ»"
          source: "المعجم الكبير"
          conflict: "يحمل دلالة التحقير والدناءة إلى جانب القلة، مما يجعله غير محايد كمصطلح كمّي"


