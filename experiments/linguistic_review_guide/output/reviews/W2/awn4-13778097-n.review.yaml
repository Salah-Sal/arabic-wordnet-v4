# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13778097-n
# correction / fudge factor
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تصحيح» عامة جداً وتشمل معاني غير القياسية (تصحيح لغوي، تصحيح فقهي) فقد تحتاج تقييداً بالسياق العلمي"
      - "اللمّة «عامل تصحيح» تركيب إضافي يقابل correction factor لا correction؛ ينبغي التحقق من ملاءمته لتعريف المجموعة الذي يتحدث عن «كمية» لا عن «عامل» ضربي"
      - "التعريف العربي الحالي واضح ومباشر لكنه يفتقر إلى تحديد أن هذا التصحيح يكون بناء على خطأ منهجي معروف"
    observations: "المجموعة تصف مفهوماً علمياً قياسياً هو الكمية التصحيحية التي تُضاف إلى القياس أو تُطرح منه لتعويض خطأ منهجي وزيادة الدقة. المفهوم راسخ في التراث العلمي العربي، إذ استعمل علماء الفلك المسلمون مصطلح «التعديل» بهذا المعنى تحديداً. اللمّتان الموجودتان تغطيان جانبين: «تصحيح» للمفهوم العام، و«عامل تصحيح» للمعامل الضربي."
  blind_candidates:
    - lemma: "تَصْوِيب"
      generation_method: ishtiqaq
      justification: "من الجذر ص-و-ب على وزن تَفْعِيل، بمعنى جعل الشيء صواباً وتصحيح الخطأ. أقرّ مجمع اللغة المصري استعماله بمعنى التصحيح."
    - lemma: "تَعْدِيل"
      generation_method: ishtiqaq
      justification: "من الجذر ع-د-ل على وزن تَفْعِيل، ويُطلق في الرياضيات والفلك على القوس بين الوسط والتقويم، وهي كمية تُضاف أو تُطرح لتصحيح الحساب الفلكي."
    - lemma: "جُبْرَان"
      generation_method: majaz
      justification: "من الجذر ج-ب-ر على وزن فُعْلان، وأصله في الزكاة: الفرق المدفوع تعويضاً عن نقص أو زيادة. إزاحة دلالية إلى الكمية التعويضية في القياس العلمي."
    - lemma: "ضَبْطَة"
      generation_method: ishtiqaq
      justification: "من الجذر ض-ب-ط على وزن فَعْلة (للمرة)، والضبط في الاستشعار عن بعد: تصحيح القراءات لتقليل الأخطاء في النتائج."

stage2_evidence:
  per_lemma:
    - lemma: "تَصْحِيح"
      confirm:
        - text: "«التصحيح: هو في اللغة: إزالة السقم من المريض، وفي الاصطلاح: إزالة الكسور الواقعة بين السهام والرءوس.»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«التّصحيح: هو تفعيل من الصّحة التي هي ضدّ السّقم فيكون المعنى إزالة السّقم من السقيم.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«تصحيح» = correction (مصطلح فيزيائي)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
        - text: "«تصحيح» = correction (مصطلح هندسة مدنية)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
      expands:
        - text: "«سلوك إيجابي بالكلام أو الحركات المناسبة يدعم ما يقوله أحد المتحاورين مستدركا على آخر.»"
          source: "مسرد الإعلام والتواصل"
          addition: "دلالة تواصلية مغايرة للدلالة القياسية العلمية"

    - lemma: "عَامِل تَصْحِيح"
      confirm:
        - text: "«معامل تصحيح» = correction factor، التعريف: «معامل تصحيحي»"
          source: "المعجم الموحد لمصطلحات الاقتصاد"
        - text: "«عامل تصحيح الخلية (ن)» = cell correction factor"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
        - text: "«عامل التصحيح الحراري (TCF) هو عامل لمعايرة معايير الأداء التي تتغير بتغير درجة الحرارة مثل تدفق الإنتاج ومرور الأملاح.»"
          source: "المعجم الموحد لمصطلحات المياه"
      expands:
        - text: "«معامل تصحيح عدم التوافق الطيفى, <لجهاز قياس ضوئى>» = spectral mismatch correction factor"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يُستعمل في سياقات قياسية متعددة مع إضافات تخصيصية"

    - lemma: "تَصْوِيب"
      confirm:
        - text: "«تَصْوِيب: تعديل المواصفات حتى توافق ما هو مطلوب.» = adjustment"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
        - text: "«صوَّب الخطأ: صحَّحه» — أقر مجمع اللغة المصري هذا الاستعمال الحديث"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: "«التصويبُ: هو الحكم بالصواب.»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "الدلالة الأصلية هي إصدار حكم بالصواب لا إضافة كمية تصحيحية"
        - text: "«تصويب الأغلاط الطباعيّة في الكتب» = corrigendum; erratum"
          source: "مسرد الإعلام والتواصل"
          conflict: "الدلالة الشائعة هي تصحيح الأخطاء النصية لا الكمية القياسية"

    - lemma: "تَعْدِيل"
      confirm:
        - text: "«التّعديل: في اللغة التّسوية. والتعديل عند الرياضيين يطلق على معان... وهو قوس بين الوسط والتقويم.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«تعديل: تعديل شبكة تثليث، شبكة تسوية…» = adjustment"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
      contradicts:
        - text: "«تعديل» = modification / modulation / amendment / rectification / neutralization (معانٍ متعددة)"
          source: "معاجم ARABTERM متعددة"
          conflict: "اللفظ مشترك لفظي شديد الاشتراك؛ يقابل ما لا يقل عن ٦ مفاهيم إنجليزية مختلفة"

    - lemma: "جُبْرَان"
      confirm:
        - text: "«الجبران: هو الفرْقُ بين ما يَجِبُ في زكاة الإبِل وما يُقدَّمُ للمُصدِّق، وذلك أنَّه حين لا يَجِدُ المزكى النَّاقة الواجبة الأداء يَنْزلُ إلى أصغرَ منها سِنًّا ويَدْفعُ الجُبْرَانَ، أو يَصْعَد إلى ما هو أَعْلى مِنْها سِنًّا ويأخُذُ الجُبْرَانَ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«جَبْران: من (ج ب ر) مثنى جَبْر: الشجاع والعود تجبر به العظام. / جُبْران: من (ج ب ر) الإصلاح والعطف وقهر الغير وإكراهه على الشيء.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "جبران اسم علم مشهور (جبران خليل جبران) مما يسبب التباساً"

    - lemma: "ضَبْطَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَصْحِيح"
      decision: confirmed
      decision_reason: "مصطلح راسخ في الاستعمال العلمي العربي المعاصر، يقابل correction في الفيزياء والهندسة والقياس. مثبت في معاجم مصطلحية متعددة. الجذر ص-ح-ح يدل على إزالة العيب وإعادة الاستقامة، وهو المعنى المطلوب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على الكمية التصحيحية ذاتها (المقدار المضاف أو المطروح) بوصفها نتيجة عملية التصحيح، دون الإشارة إلى كونها عاملاً ضربياً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصْحِيح"

    - lemma: "عَامِل تَصْحِيح"
      decision: confirmed
      decision_reason: "تركيب إضافي مصطلحي ثابت مُسجَّل في معاجم الفيزياء والاقتصاد والمياه بمعنى correction factor. يتوافق مع اللمّة الإنجليزية fudge factor في المجموعة. المعاجم تستعمل «معامل تصحيح» و«عامل تصحيح» بالتبادل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدل على المعامل الضربي أو القيمة النسبية المستخدمة لتصحيح القياس، بخلاف «تصحيح» الذي يدل على المقدار المطلق المضاف أو المطروح."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَامِل تَصْحِيح"

    - lemma: "تَصْوِيب"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الأصلية للتصويب هي الحكم بالصواب أو تصحيح الأخطاء النصية. وإن أقرّ المجمع استعماله بمعنى التصحيح، فإنه يدل على فعل التصحيح لا على الكمية التصحيحية ذاتها. كما أن الاشتراك اللفظي مع التصويب بمعنى التوجيه (تصويب السلاح) يضعف ملاءمته."
      evidence_assessment:
        case: mixed

    - lemma: "تَعْدِيل"
      source: stage1
      decision: removed
      decision_reason: "رغم استعماله في الفلك الإسلامي بمعنى قريب (القوس بين الوسط والتقويم)، فإن اللفظ مشترك لفظي شديد الاشتراك في الاستعمال المعاصر (تعديل = modification / amendment / modulation / adjustment / rectification / neutralization). إدخاله في هذه المجموعة يضيف غموضاً دون فائدة تمييزية."
      evidence_assessment:
        case: mixed

    - lemma: "جُبْرَان"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الفقهية (الفرق التعويضي في الزكاة) قريبة مفهومياً، لكن اللفظ محصور في السياق الشرعي ولم يُنقل إلى المجال العلمي. فضلاً عن التباسه باسم العلم (جبران خليل جبران)."
      evidence_assessment:
        case: mixed

    - lemma: "ضَبْطَة"
      source: stage1
      decision: removed
      decision_reason: "لا شواهد معجمية على هذا الاشتقاق. الضبط مُثبت كمصدر (= adjustment) لكن «ضبطة» على وزن فَعْلة للمرة غير مسجلة بهذا المعنى الاصطلاحي."
      evidence_assessment:
        case: no_material

