# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "التواصل عبر حركات أو وضعيات الجسم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة مباشرة من الإنجليزية مقتضبة وتفتقر إلى الجنس القريب
        والفصل النوعي. كلمة «وضعيات» غير راسخة في الفصحى الراسخة (والأوفق «هيئات»
        أو «مواقف»). كذلك لا تُبرز التعريف طابعَ المنظومة التعبيرية غير اللفظية.
    authored:
      - type: terminological
        text: >
          ضَرْبٌ مِنَ التَّوَاصُلِ غَيْرِ اللَّفْظِيِّ يَقُومُ عَلَى حَرَكَاتِ الْجَسَدِ
          وَهَيْئَاتِهِ وَتَعْبِيرَاتِ الْوَجْهِ وَالْإِيمَاءَاتِ، يُعَبِّرُ بِهَا الْإِنْسَانُ
          عَنْ مَشَاعِرِهِ وَمَقَاصِدِهِ دُونَ اسْتِخْدَامِ الْكَلَامِ الْمَنْطُوقِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مَنْظُومَةُ الْإِشَارَاتِ الْجَسَدِيَّةِ غَيْرِ اللَّفْظِيَّةِ الَّتِي يُوَظِّفُهَا
          الْإِنْسَانُ تِلْقَائِيًّا أَوْ مَقْصُودًا، مِنْ حَرَكَاتِ الْيَدَيْنِ وَتَعْبِيرَاتِ
