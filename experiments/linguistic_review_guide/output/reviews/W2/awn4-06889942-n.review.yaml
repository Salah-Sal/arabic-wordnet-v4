        للسانيات، المعجم الطبي الموحد) بوصفه المقابل العربي الرسمي لـ body language.
        يتوفر فيه اطّراد الاستعمال، ويُسر التداول، والملاءمة الدلالية، وهو تركيب إضافي
        يُجيزه الوضع العربي. يحتاج إلى تشكيل كامل.
