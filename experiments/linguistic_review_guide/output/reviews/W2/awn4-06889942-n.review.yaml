        heritage_preference: "لا توجد لفظة تراثية مسكوكة ومعروفة للمفهوم"
        arabic_preference: "تركيب عربي أصيل"
        derivability: "قابل للاشتقاق: لُغَوِيٌّ جَسَدِيٌّ، لُغَوِيَّاتٌ جَسَدِيَّةٌ"
