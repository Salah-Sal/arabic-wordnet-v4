    - lemma: "لُغَةُ الجَسَدِ"
      entry_id: "{auto}"
      roots:
        - word: "لغة"
          root: "لغو"
          maqayis_quote: >
            «اللَّامُ وَالْغَيْنُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا
            يَدُلُّ عَلَى الشَّيْءِ لَا يُعْتَدُّ بِهِ، وَالْآخَرُ عَلَى اللَّهَجِ بِالشَّيْءِ...
            وَيُقَالُ إِنَّ اشْتِقَاقَ اللُّغَةِ مِنْهُ، أَيْ يَلْهَجُ صَاحِبُهَا بِهَا»
            — ابن فارس، مقاييس اللغة
        - word: "الجسد"
          root: "جسد"
          maqayis_quote: >
            «الْجِيمُ وَالسِّينُ وَالدَّالُ يَدُلُّ عَلَى تَجَمُّعِ الشَّيْءِ أَيْضًا
            وَاشْتِدَادِهِ. مِنْ ذَلِكَ جَسَدُ الْإِنْسَانِ. وَالْمِجْسَدُ: الَّذِي يَلِي
            الْجَسَدَ مِنَ الثِّيَابِ.»
            — ابن فارس، مقاييس اللغة

  per_sense:
    - lemma: "لُغَةُ الجَسَدِ"
      sense_id: "{auto}"
      nuance: >
        المصطلح الوحيد المؤكّد في هذه المجموعة. يحمل دلالة المنظومة التعبيرية الجسدية
        بوصفها نظاماً متكاملاً يوازي اللغة في وظيفته التواصلية. يتمايز عن «الإيماء»
        الذي يعني إشارةً فردية منفردة، وعن «التمثيل الصامت» الذي يقوم على الأداء
        المسرحي، وعن «علم الإيماء/الكينيزيا» الذي هو الدراسة العلمية لهذه المنظومة.
        يُستخدم في السياقين العامي والمتخصص على حدٍّ سواء.
      mwe: true

  synset:
    cultural_fit: lexical_gap
    cultural_fit_note: >
      المفهوم حاضر في الوعي العربي والثقافة الإنسانية المشتركة، غير أنه ظلّ بلا
      مصطلح عربي خاص حتى العصر الحديث. ثمة بدائل متعددة (لغة البدن، لغة الحركات،
      لغة جسمية) تعكس غياب توحيد مصطلحي تام. لهذا صُنِّف «فجوة معجمية» لا «نصيف»
      ولا «أصيل» من حيث التوحيد، رغم وجود مصطلح شائع (لغة الجسد) متداول.

