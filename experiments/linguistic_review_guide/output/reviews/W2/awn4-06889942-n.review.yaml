# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الوحيدة «لغة الجسد» خالية من التشكيل الكامل"
      - "تعريف AWN «التواصل عبر حركات أو وضعيات الجسم» مقتضب وترجمةٌ مباشرة من الإنجليزية؛ وكلمة «وضعيات» فيها نظر من الناحية الأسلوبية"
      - "المجموعة تخلو من لمّات بديلة رغم وجود مصطلحات عربية أخرى موثّقة لنفس المفهوم (كـ«لغة البدن» و«لغة الحركات» و«لغة جسمية»)"
    observations: >
      مفهوم «لغة الجسد» مستحدث في العربية المعاصرة، وهو تعبير تركيبي إضافي شاع
      في الكتابة التربوية والنفسية والإعلامية. يقع في دائرة «التواصل غير اللفظي»
      ويُميَّز عن «الإيماء» (gesture) الذي يعني إشارةً منفردة، وعن «الكينيزيا/علم
      الإيماء» (kinesics) الذي يعني الدراسة العلمية لهذه الحركات. الأَولى بالتسجيل
      منهجيةً تضمّ لمّات متعددة تمثّل التنوّع المصطلحي العربي الموثّق.

  blind_candidates:
    - lemma: "الْبَيَانُ الْجَسَدِيُّ"
      generation_method: majaz
      justification: >
        «البيان» في العربية هو إيضاح المعنى وإبلاغه بلا لبس، وهو من أعرق الألفاظ
        التراثية في منظومة التواصل. استعماله مجازاً في التواصل الجسدي يُحيي المعنى
        القديم ويُربطه بفعل التبليغ دون كلام؛ فـ«البيان الجسدي» تعبيرٌ يعني ما يُبيَّن
        به المعنى عبر الجسد لا اللسان.

    - lemma: "لُغَةُ الْإِيمَاءِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي يجمع «لغة» بمعنى المنظومة التواصلية، و«الإيماء» بمعنى التلميح
        والإشارة بالرأس أو اليد أو الجسد عموماً. «الإيماء» لفظ تراثي موثّق في
        معاجم الاصطلاحات بمعنى الإشارة المعبِّرة، وهو أخف وطأةً من «لغة الجسد»
        مع الاحتفاظ بالدلالة التواصلية ذاتها.

    - lemma: "الْكِينِيزِيَّا"
      generation_method: taarib
      justification: >
        تعريب للمصطلح الأكاديمي kinesics، وهو العلم الذي يدرس دور حركات الجسد في
        التواصل. المصطلح ذو صيغة دولية يقبل لام التعريف والنسبة والجمع السالم
        (كينيزيّ، كينيزيّون). يُستخدم في المعاجم الطبية والتواصلية المتخصصة.

    - lemma: "الْإِيمَاءُ الْجَسَدِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي يصف نوعاً من الإيماء المنسوب للجسد بكليّته لا لعضو واحد. يُميِّز
        هذه اللمّة عن «الإيماء» المجرد الذي يكون في الغالب بالرأس أو اليد. يوسّع
        الدلالة لتشمل منظومة الأوضاع والحركات الجسدية الكاملة.


