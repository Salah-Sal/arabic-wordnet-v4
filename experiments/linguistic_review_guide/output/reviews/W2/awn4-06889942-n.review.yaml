          وَتَنْقُلُ مِنْ خِلَالِهَا الْمَعَانِيَ وَالْمَشَاعِرَ وَالتَّوَجُّهَاتِ النَّفْسِيَّةَ.
          تَخْضَعُ جُزْئِيًّا لِلتَّقَالِيدِ الثَّقَافِيَّةِ، وَتَدْرُسُهَا اللِّسَانِيَّاتُ
          التَّطْبِيقِيَّةُ وَعِلْمُ النَّفْسِ الِاجْتِمَاعِيِّ.
    actions:
