# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15311467-n (rate)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «نِسْبَة» تدل في أصلها على المقارنة بين كميتين (ratio/proportion) لا على المقدار المنسوب إلى وحدة زمنية تحديداً؛ فهي أعمّ من المطلوب"
      - "لفظة «مُعَدَّل» مشتركة بين معنى المتوسط الحسابي (average) ومعنى المقدار الزمني (rate)؛ وقد يلتبس الأمر على المستخدم"
      - "التعريف العربي يستخدم كلمة «نسبة» بمعنى حرف الجر (relative to) وهي أيضاً لمّة في المجموعة ذاتها، مما قد يوهم بالدوران"
    observations: "المجموعة تمثّل مفهوم rate بمعناه العام: مقدار أو تردد مقيس بوحدة زمنية. اللمّتان الموجودتان (مُعَدَّل، نِسْبَة) شائعتان في الاستعمال المعاصر لكنّهما تغطيان طيفاً أوسع من المفهوم المُراد. مُعَدَّل أدقّ وأقرب إلى الدلالة الزمنية، بينما نِسْبَة أقرب إلى ratio."

  blind_candidates:
    - lemma: "مُعَدَّل"
      generation_method: ishtiqaq
      justification: "من جذر ع-د-ل على وزن مُفَعَّل، يدلّ على الشيء المسوَّى والمقوَّم؛ استُعمل في العربية المعاصرة للدلالة على المقدار المنسوب إلى وحدة قياسية، وشاع في المصطلحات العلمية (معدَّل النمو، معدَّل التدفق)"
    - lemma: "وَتِيرَة"
      generation_method: majaz
      justification: "أصلها المداومة على الشيء والملازمة، ثم توسّعت مجازاً للدلالة على إيقاع الأداء وسرعته الزمنية؛ يُقال «على وتيرة واحدة» أي بمعدّل ثابت"
    - lemma: "تَوَاتُر"
      generation_method: ishtiqaq
      justification: "من جذر و-ت-ر على وزن تَفَاعُل، يدلّ على التتابع المنتظم؛ استُعمل حديثاً بمعنى التكرر النظامي (frequency) وهو قريب من معنى rate"
    - lemma: "سُرْعَة"
      generation_method: ishtiqaq
      justification: "من جذر س-ر-ع على وزن فُعْلَة، تدلّ على خلاف البطء؛ وفي الفيزياء المسافة المقطوعة في وحدة الزمن، وهي نوع خاص من rate"


stage2_evidence:
  per_lemma:
    - lemma: "مُعَدَّل"
      confirm:
        - text: "«(2) «أ» معدَّل؛ نسبة. «ب» معدَّل السرعة»"
          source: "المورد الحديث (2008)"
        - text: "«معدل المواليد — birth rate»"
          source: "المَكنَز الزراعي متعدد اللغات (ARABTERM)"
        - text: "«معدل النمو — growth rate»"
          source: "المَكنَز الزراعي متعدد اللغات (ARABTERM)"
        - text: "«معدَّل الفائدة — interest rate»"
          source: "المورد الحديث (2008)"
        - text: "«معدل الجريان — flow rate»"
          source: "المَكنَز الزراعي متعدد اللغات (ARABTERM)"
      expands:
        - text: "«مُعَدَّل — من (ع د ل) الشيء المسوى أو المقام، والشاهد أو الراوي المزكي، والمتاع المقسم على عِدْلين»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المعنى الأصلي للفظة مرتبط بالتسوية والاستقامة، ثم تطور إلى المعنى الحسابي"
        - text: "«المعدّل — بفتح الدال المشددة عند أهل الهيئة هو ما وقع فيه التعديل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "المصطلح استُخدم عند علماء الهيئة (الفلك) بمعنى تقني"

    - lemma: "نِسْبَة"
      confirm:
        - text: "«(2) «أ» معدَّل؛ نسبة»"
          source: "المورد الحديث (2008)"
        - text: "«نسبة الولادة — calving rate»"
          source: "المَكنَز الزراعي متعدد اللغات (ARABTERM)"
        - text: "«نسبة أو مُعَدَّل الوفيات [بين سكان بلدٍ في فترة ما] — death rate»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«النِّسْبَة — الصِّلَة أَو الْقَرَابَة و (فِي الرياضة) نتيجة مُقَارنَة إِحْدَى كميتين من نوع وَاحِد بِالْأُخْرَى والمقدار الْمَنْسُوب»"
          source: "المعجم الوسيط"
          addition: "النسبة في الرياضة تعني المقارنة بين كميتين (ratio) وهي أعمّ من rate"
        - text: "«النِّسْبَةُ — إِضَافَة مَا فِي الْقدر بَين مقدارين متجانسين»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "المعنى الاصطلاحي القديم يؤكد أنها نسبة بين مقادير لا مقدار زمني"
        - text: "«النّسبة — بالكسر وسكون السين هي تطلق على معان. منها قياس شيء إلى شيء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "الدلالة الأصلية: قياس شيء إلى شيء، تشمل rate لكن لا تخصّه"

    - lemma: "وَتِيرَة"
      contradicts:
        - text: "«الوتيرة — المداومة على الشيء والملازمة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الأصلي يدلّ على الاستمرارية والمداومة لا على المقدار الكمّي المنسوب إلى زمن"
      expands:
        - text: "«الوَتِيرَةُ — الطَّريقة المُطَّرِدة، المداوَمة على الشيء والملازمة، الفُتور»"
          source: "المعجم الوسيط"
          addition: "معانٍ متعددة أغلبها حسّية أو مكانية؛ المعنى المجرد (الطريقة المطّردة) قريب من pace لا rate"
        - text: "«وتيرة الصُّدور — frequency of issue»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
          addition: "استعمال حديث بمعنى إيقاع الصدور وانتظامه"
        - text: "«ما زال على وَتِيرَةٍ واحدة»"
          source: "المعجم الوسيط (شاهد)"
          addition: "التعبير الاصطلاحي يدلّ على الثبات في النمط لا على القيمة العددية"

    - lemma: "تَوَاتُر"
      contradicts:
        - text: "«التواتر لغة: تتابع الشيء فرادى، وعرفاً: الخبر الثابت على ألسنة قوم يمتنع تواطؤهم على الكذب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى اللغوي والاصطلاحي كلاهما يخصّ التتابع في الأخبار، لا المقدار الزمني الكمّي"
        - text: "«التّواتر — هو في اللغة تتابع أمور واحداً بعد واحد بغيره من الوتر»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المعنى مقتصر على التتابع والتكرر، ولا يتضمن مفهوم القيمة العددية المنسوبة إلى وحدة زمنية"
      expands:
        - text: "«(4) التواتر: التكرّر النظاميّ للعمليات أو الأحداث»"
          source: "المورد الحديث (2008) — مدخل rhythm"
          addition: "استُعمل حديثاً بمعنى frequency لكنه أقرب إلى التكرر منه إلى المعدل الكمّي"

    - lemma: "سُرْعَة"
      contradicts:
        - text: "«السُّرْعَةُ — خلافُ البُطْءِ (فى الفيزياء) Speed, velocity: المسافَة التى يقطعها جسْمٌ مُتحرِّك في وحدة الزَّمَن»"
          source: "المعجم الكبير"
          conflict: "السرعة تعني speed/velocity تحديداً وهي نوع واحد من rate لا المفهوم العام"
      expands:
        - text: "«سرعة الترشيح — filtration rate»"
          source: "المَكنَز الزراعي متعدد اللغات (ARABTERM)"
          addition: "تُستخدم في مركبات بمعنى rate لبعض السياقات الفيزيائية لكنها تبقى خاصة بالسرعة"


stage3_analysis:
  per_lemma:
    - lemma: "مُعَدَّل"
      decision: confirmed
      decision_reason: "لفظة راسخة في الاستعمال العلمي والتقني المعاصر بمعنى rate؛ تظهر في عشرات المركبات المصطلحية في ARABTERM (معدل النمو، معدل التدفق، معدل الفائدة...) وفي المورد الحديث كترجمة مباشرة لـ rate. الاشتقاق من جذر عدل على مُفَعَّل سائغ صرفياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على القيمة الكمّية المُقاسة نسبةً إلى وحدة زمنية أو قياسية؛ يغلب استعماله في السياقات العلمية والإحصائية والاقتصادية؛ أقرب إلى المتوسط الحسابي وأدقّ تعبيراً عن المفهوم الكمّي من نِسْبَة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعَدَّل"

    - lemma: "نِسْبَة"
      decision: confirmed
      decision_reason: "لفظة صحيحة لغوياً ومستعملة في سياق rate (نسبة الوفيات، نسبة الولادة) وإن كانت أعمّ دلالةً. المعجم الوسيط يؤكد معنى «المقدار المنسوب»، والمورد يقرنها بمعدّل في ترجمة rate. الإبقاء عليها مبرَّر لأنها تغطّي الاستعمال العام."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على العلاقة الكمّية بين مقدارين (ratio/proportion)؛ أعمّ من مُعَدَّل إذ تصلح للمقارنة بين كميتين دون اشتراط البعد الزمني؛ تُستعمل في السياقات الإحصائية والديموغرافية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِسْبَة"

    - lemma: "وَتِيرَة"
      source: stage1
      decision: removed
      decision_reason: "الوتيرة تدلّ على الطريقة المطّردة والمداومة على الشيء (pace/pattern) لا على المقدار الكمّي المنسوب إلى وحدة زمنية. الأدلة المعجمية تؤكد أنها تعبّر عن ثبات النمط لا عن القيمة العددية. استعمالها الحديث في ARABTERM (وتيرة الصدور) أقرب إلى frequency of occurrence منه إلى rate."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَوَاتُر"
      source: stage1
      decision: removed
      decision_reason: "التواتر في اللغة تتابع الأمور فرادى، وفي الاصطلاح الأصولي خبر الجماعة المفيد للعلم. المعنى الحديث (frequency) لا يتطابق مع rate (المقدار المنسوب إلى وحدة زمنية) بل يعني التكرر المجرد. الفارق الدلالي كبير."
      evidence_assessment:
        case: contradicts_only

    - lemma: "سُرْعَة"
      source: stage1
      decision: removed
      decision_reason: "السرعة تعني speed/velocity تحديداً — أي المسافة المقطوعة في وحدة الزمن — وهي نوع واحد من rate لا المفهوم العام. إدراجها يُضيّق دلالة المجموعة بلا مبرّر."
      evidence_assessment:
        case: contradicts_only


