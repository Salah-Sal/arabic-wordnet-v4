# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-05004637-n | ILI: i63267 | POS: n
# Lemmas_EN: edibility, edibleness
# Definition_EN: the property of being fit to eat
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الموجودة «قابلية الأكل» مكتوبة بلا تشكيل كامل في قاعدة البيانات"
      - "التعريف الحالي «خاصية الصلاحية للأكل» يحوي تكراراً دلالياً: الجنس (خاصية) والفصل (الصلاحية) متداخلان، إذ مفهوم الصلاحية هو جوهر الخاصية المعرَّفة لا جزءٌ مستقل"
      - "المجموعة تفتقر إلى مصطلح تقني مضغوط (كلمة واحدة) لخاصية الأكلية، إذ لا توجد سوى عبارة تركيبية"
      - "لم يُعثر على أي مقابل عربي لـ edibility كاسم مجرد (property noun) في معاجم ARABTERM"
    observations: >
      المفهوم يُعبَّر عنه في الموروث العربي في الغالب بالصفة المشتقة
      (مأكول / صالح للأكل) أو بالفعل الوصفي، لا باسم خاصية مجردة.
      وهذا يجعل مستوى التجريد المطلوب هنا (property noun) فجوةً معجمية
      حقيقية في العربية الكلاسيكية والمعاصرة على حدٍّ سواء.
      اللمّة الموجودة «قابلية الأكل» تركيبٌ إضافي وظيفي معقول
      يستعير نمط «قابلية + X» الحديث في الاصطلاح العربي،
      غير أنه لا يُعدّ وحدةً معجميةً مسكوكةً راسخةً في المعاجم الكلاسيكية.
      يُلاحَظ أن العربية التراثية حين تقصد «ما يُؤكل» تلجأ إلى المصدر (الأكل)
      أو صيغة مَفْعَل (المأكل/المأكلة)، وكلتاهما تعبّران عن الموضع أو
      الحدث لا عن الخاصية المجردة.

  blind_candidates:
    - lemma: "مَأْكُولِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من اسم المفعول «مَأْكُول» على وزن مَفْعُولِيَّة،
        نظيراً لأنماط راسخة كـ«مشروبية» و«مرئية» و«مسموعية».
        يُعبِّر بدقة عن خاصية كون الشيء قابلاً للأكل (the quality of
        being edible)، ويقبل التنكير والتعريف والجمع والنسبة اطّراداً.

    - lemma: "أَكْلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من النسبة «أَكْلِيّ» (منسوب إلى الأكل) بإضافة تاء
        المصدريّة الصناعية، يُعبِّر عن خاصية الانتماء إلى مجال الأكل.
        أقل دقةً من «مأكولية» لكنه أقصر وأيسر تداولاً.

    - lemma: "قَابِلِيَّةُ التَّنَاوُلِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «قابلية» (القدرة على الاستقبال والقبول) و«التناول»
        (الأكل في أسلوب رسمي)؛ يوازي البنية الاصطلاحية لـ«قابلية الأكل»
        مع استخدام «التناول» بديلاً أرقى أسلوبياً.

    - lemma: "الطِّيبُ"
      generation_method: majaz
      justification: >
        مجاز دلالي من جذر (ط ي ب): الطيب ضد الخبيث، وطِيب الطعام في
        التراث يعني صلاحيته ونقاؤه وحِلَّه. قال الراغب: «الطعام الطيب
        في الشرع ما كان متناولاً من حيث ما يجوز». الإحياء الدلالي
        يُحوِّل الاسم الجامد إلى خاصية تعبِّر عن صلاحية الأكل.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت (٦ استعلامات):
#   Q1: مطابقة دفعية — جميع اللمّات + المرشحات
#   Q2: جسر إنجليزي — edibility / edibleness / edible
#   Q3: FTS عربي — صلاحية / مأكول / يؤكل / قابل للأكل
#   Q4: تحقق من المرشحات — مأكولية / أكلية / قابلية الأكل / التناول
#   Q5: مقاييس اللغة — جذر أكل
#   Q6: مقاييس اللغة — جذر قبل
stage2_evidence:

  per_lemma:

    - lemma: "قابلية الأكل"
      evidence_status: "no_material_found"
      # لم يُعثر على هذا التعبير كمدخل معجمي في أي قاموس من القاعدة.
      # وردت «قابلية» مفردةً بمعنى validity/fitness في معاجم arabterm،
      # لكن «قابلية الأكل» كوحدة معجمية غير موجودة.

    - lemma: "مَأْكُولِيَّة"
      evidence_status: "no_material_found"
      # الجذر أكل حاضر بقوة في المعاجم لكن صيغة مَفْعُولِيَّة (مأكولية)
      # غير مسجَّلة في أي مصدر من قاعدة البيانات.

    - lemma: "أَكْلِيَّة"
      evidence_status: "no_material_found"

    - lemma: "قَابِلِيَّةُ التَّنَاوُلِ"
      evidence_status: "no_material_found"

    - lemma: "الطِّيبُ"
      confirm:
        - text: "«الطِّيبُ: مَا يُتطيَّبُ به من عطر ونحوه، الحِلُّ، الأفضل من كل شيء»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الطّيّب هو ضد الخبيث... وإذا وصف به الأموال أريد به كونه حلالاً من خيار المال»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الطَّيِّب: خلاف الخبيث... والطعام الطيب في الشرع ما كان متناولاً من حيث ما يجوز وبقدر ما يجوز من المكان الذي يجوز»"
          source: "التعريفات الفقهية للبركتي"
      contradicts:
        - text: "«الطِّيبُ (اسماً): ما يُتطيَّبُ به من عطر ونحوه»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            الدلالة الأولى للاسم «الطيب» هي العطر والمسك، وليست خاصية
            صلاحية الأكل. الخلط بين دلالة الصفة (طيّب = صالح) ودلالة الاسم
            (الطِّيب = العطر) يُفضي إلى التباس غير مقبول.
        - text: "«الطَّيِّبُ وَالْيَاءُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الْخَبِيثِ... وَالطَّيِّبُ: الْحَلَالُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            الطِّيب في جوهره يدل على الحِلّ والطهارة الشرعية لا على الأكلية
            بمعناها العلمي الحديث (non-toxic, digestible). مفهوم edibility
            أوسع من مجرد الحلال؛ فطعام قد يكون حراماً شرعاً لكنه مأكول
            بيولوجياً، والعكس. لذا التطابق المفهومي منتقَص.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "قابلية الأكل"
      decision: confirmed
      decision_reason: >
        اللمّة الوحيدة الموجودة في المجموعة، وهي تركيب إضافي وظيفي يؤدي
        المعنى المطلوب ويُفهم في السياقات العلمية والصحية. رغم غياب التوثيق
        المعجمي الكلاسيكي، فإن نمط «قابلية + X» راسخ في الاصطلاح العربي
        المعاصر (قابلية التحلل، قابلية الاشتعال، قابلية الذوبان). تحتاج
        اللمّة إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة، لذا لا تمييز بينها وبين
        مرادف آخر في هذه المجموعة. دلالتها: التعبير عن الخاصية المجردة
        لكون الشيء صالحاً ومقبولاً للأكل، بأسلوب تركيبي إضافي مألوف
        في الاصطلاح التقني العربي الحديث.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ الْأَكْلِ"

    - lemma: "مَأْكُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم سلامة الوزن الصرفي (مَفْعُولِيَّة من جذر أكل) وقياسيته
        بالنظر إلى نظائره (مشروبية، مرئية)، فإن المصطلح عديم التوثيق
        في قاعدة البيانات المعجمية الضخمة (760 ألف مدخل) ولم يُسجَّل
        في ARABTERM الذي يُوثِّق المصطلحات التقنية الحديثة. يفشل اختبار
        التثبيت المعجمي؛ المصطلح نظريٌّ بحت غير متداوَل. والوحدة المتاحة
        قَابِلِيَّةُ الْأَكْلِ كافية لتمثيل المفهوم.

    - lemma: "أَكْلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة أقل دقةً من «مأكولية»: أَكْلِيّ يعني «منسوب إلى الأكل»
        وهو أعم من خاصية الصلاحية للأكل، ولا يميِّز بين الشيء الصالح
        للأكل وبين ما يخص الأكل بوجه عام. غير موثَّق في أي مصدر.

    - lemma: "قَابِلِيَّةُ التَّنَاوُلِ"
      source: stage1
      decision: removed
      decision_reason: >
        مرادف بنيوي للمة الموجودة (نفس النمط التركيبي) دون مكسب دلالي
        إضافي. إدراجه يرفع عدد اللمّات دون إثراء حقيقي، خاصةً أن
        «التناول» و«الأكل» مترادفان في هذا السياق.

    - lemma: "الطِّيبُ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تكشف تعارضاً جوهرياً: (١) «الطِّيب» اسماً يعني
        في المقام الأول العطرَ والمِسك، لا خاصية صلاحية الأكل.
        (٢) دلالة «طيّب» الوصفية تقوم على الحِلّ والطهارة الشرعية وهي
        أضيق من edibility التي تشمل الصلاحية البيولوجية بصرف النظر عن
        الحكم الشرعي. (٣) فشل اختبار التعبير المركب: «طيب الطعام» ≠
        «مأكولية الطعام». المجاز مُتكلَّف وغير موفَّق.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:

  definition:
    current: "خاصية الصلاحية للأكل"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دائري جزئياً: «خاصية الصلاحية» يستخدم «صلاحية»
        داخل تعريف مفهوم يتعلق بالصلاحية ذاتها. فضلاً عن ذلك، «للأكل»
        غامضة (هل تعني الأكل عموماً أم أكل الإنسان تحديداً؟). يستحق
        التعريف صياغةً أوضح وأدق تُميِّز الخاصية وتعيِّن حاملها.
    authored:
      - type: terminological
        text: "خَاصِّيَّةٌ في الشَّيْءِ تَجْعَلُهُ صَالِحاً لأَكْلِ الإِنْسَانِ، بِأَنْ يَكُونَ آمِناً غَيْرَ سَامٍّ وَمَقْبُولاً اسْتِهْلاَكاً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كَوْنُ الشَّيْءِ مِمَّا يَصْلُحُ أَكْلُهُ وَيَنْتَفِعُ بِهِ الآكِلُ دُونَ ضَرَرٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05004637-n"
          definition_index: 0
          text: "خَاصِّيَّةٌ في الشَّيْءِ تَجْعَلُهُ صَالِحاً لأَكْلِ الإِنْسَانِ، بِأَنْ يَكُونَ آمِناً غَيْرَ سَامٍّ وَمَقْبُولاً اسْتِهْلاَكاً"
      - command: add_definition
        params:
          synset_id: "awn4-05004637-n"
          text: "كَوْنُ الشَّيْءِ مِمَّا يَصْلُحُ أَكْلُهُ وَيَنْتَفِعُ بِهِ الآكِلُ دُونَ ضَرَرٍ"

  examples:
