      - lemma: "قَابِلِيَّةُ الْأَكْلِ"
        examples:
          - text: "تختلفُ قابليةُ الأكلِ بين أنواعِ الفطرِ البري؛ فبعضُها لذيذٌ آمنٌ، وبعضُها سامٌّ قاتل"
            type: usage
          - text: "تشترطُ الجهاتُ الصحيةُ التحقُّقَ من قابليةِ الأكلِ لكلِّ مادةٍ تدخلُ في صناعةِ الأغذية"
