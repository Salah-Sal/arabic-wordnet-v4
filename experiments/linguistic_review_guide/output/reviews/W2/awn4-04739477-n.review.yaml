# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04739477-n  |  ILI: i61898  |  POS: n
# salability / salableness — البَيْعِيَّة / الرَّوَاجِيَّة
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل"
      - "«رواج تجاري» يدلّ على حالة الرواج التجاري لا على الصفة المُجرَّدة (القابلية للبيع)؛ معناه أعمّ من المقصود"
      - "«قابلية البيع» عبارة وصفية شفافة تُستخدَم في التعريفات المعجمية، لا مصطلحاً مسكوكاً بالمعنى الدقيق"
      - "التعريف الحالي ترجمة شبه حرفية من الإنجليزية ويتضمن دوراناً جزئياً (صفة القابلية للبيع ≈ قابلية البيع)"
    observations: >
      المجموعة تُعبِّر عن مفهوم اقتصادي/تجاري لصفة كون الشيء قابلاً للبيع والتسويق.
      اللمّات الحالية إما أعمّ من المعنى («رواج تجاري» يدلّ على الرواج والانتشار لا الصفة الجوهرية)
      أو وصفية شفافة غير مسكوكة تماماً («قابلية البيع»، وإن كانت سائغة). يمتلك المعجم العربي
      مادة خصبة في الجذور ب-ي-ع ور-و-ج ون-ف-ق (بمعنى نفاق السلعة)؛ والمنشود مصدر صناعي
      يُوجز الصفة في لفظ واحد مُسكوك يعتمد هذه الجذور.
  blind_candidates:
    - lemma: "نَفَاقِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر ن-ف-ق؛ «نَفَقَ السعرُ نَفَاقاً» يعني أنه يمضي ولا يكسد ولا يقف.
        المصدر الصناعي «نَفَاقِيَّة» على وزن فَعَالِيَّة يدلّ على صفة السلعة التي تنفق
        وتجد طلباً بسهولة — وهو تحديداً معنى القابلية للبيع.
    - lemma: "رَوَاجِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر ر-و-ج؛ «رَاجَ المتاعُ يَرُوجُ» بمعنى نَفَق ووجد طلباً وتداولاً.
        المصدر الصناعي «رَوَاجِيَّة» على وزن فَعَالِيَّة يُعبِّر عن صفة الشيء الذي يروج
        في الأسواق ويجد مشترين — مناسب تماماً للمفهوم المنشود.
    - lemma: "تَسَوُّقِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر س-و-ق؛ «تَسَوُّق» بمعنى عملية التسويق وإيصال السلع إلى الأسواق.
        المصدر الصناعي «تَسَوُّقِيَّة» على وزن تَفَعُّلِيَّة يُعبِّر عن صفة القابلية للتسويق
        من الجانب التسويقي-التوزيعي.
    - lemma: "تِجَارِيَّة"
      generation_method: ishtiqaq
      justification: >
        من جذر ت-ج-ر؛ «التِّجَارَة» نشاط الشراء والبيع لتحقيق الربح.
        المصدر الصناعي «تِجَارِيَّة» على وزن فِعَالِيَّة يدلّ على صفة الانتساب إلى
        دائرة التجارة وإمكانية الدخول فيها.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "رواج تجاري"
      expands:
        - text: "«(1) صلاحية التسويق (2) رواج.»"
          source: "المورد الحديث (2008)"
          addition: >
            يُدرج «رواج» مقابلاً ثانوياً لـ marketability (وليس أوّلياً)، مما يُشير إلى
            أن الرواج وحده لا يُغطّي معنى صفة القابلية للبيع دون تقييد.
      contradicts:
        - text: "«البَيْعيّة؛ الرّواجيّة: قابلية البيع أو الرواج.»"
          source: "المورد الحديث (2008)"
          conflict: >
            المورد يُفضِّل المصادر الصناعية «البيعية» و«الرواجية» مصطلحاً راسخاً لـ salability،
            لا «رواج تجاري» الذي يُعبِّر عن حالة الرواج الراهنة لا الصفة المُجرَّدة الملازمة للسلعة.

    - lemma: "قابلية البيع"
      confirm:
        - text: "«البَيْعيّة؛ الرّواجيّة: قابلية البيع أو الرواج.»"
          source: "المورد الحديث (2008)"
        - text: "«قابلية التسويق، قابلية التداول»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«الْقَابِلِيَّةُ: الاستعداد للقبول [مصدر صناعي]»"
          source: "المعجم الوسيط"
          addition: >
            يُثبت أن «قابلية» مصدر صناعي معتمد يدلّ على الاستعداد والطاقة؛
            فـ«قابلية البيع» = الاستعداد للبيع، وهو المعنى المنشود تماماً.

    - lemma: "نَفَاقِيَّة"
      expands:
        - text: "«نَفَقَ السِّعْرُ نَفَاقًا، وَذَلِكَ أَنَّهُ يَمْضِي فَلَا يَكْسُدُ وَلَا يَقِفُ. وَأَنْفَقُوا: نَفَقَتْ سُوقُهُمْ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر ن-ف-ق يتضمن صريحاً معنى نفاق السلعة أي رواجها وسرعة بيعها؛
            وهو المعنى الدقيق المطلوب لصفة القابلية للبيع.
      contradicts:
        - text: "«النِّفَاق: إِظْهَارُ الْإِيمَانِ بِاللِّسَانِ وَكِتْمَانُ الْكُفْرِ فِي الْقَلْبِ.»"
          source: "دستور العلماء للأحمدنكري"
          conflict: >
            المعنى الراسخ للنفاق في الوعي العربي المعاصر هو الرياء والخداع لا رواج السلعة،
            مما يُوجد اشتراكاً لفظياً خطيراً يُعيق تداول «نفاقية» مصطلحاً تجارياً.
        - text: "«نفاق» → hypocrisy"
          source: "مسرد الفلسفة وعلم النفس (ALECSO / ArabTerm)"
          conflict: >
            ARABTERM يُترجم «نفاق» بـ hypocrisy حصراً، ما يُؤكد غلبة الدلالة الأخلاقية
            على الدلالة التجارية في المعجمية الاصطلاحية الحديثة.

    - lemma: "رَوَاجِيَّة"
      confirm:
        - text: "«البَيْعيّة؛ الرّواجيّة: قابلية البيع أو الرواج.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الرَّاءُ وَالْوَاوُ وَالْجِيمُ لَيْسَ أَصْلًا. عَلَى أَنَّ الْخَلِيلَ ذَكَرَ: رَوَّجْتُ الدَّرَاهِمَ، وَفُلَانٌ مُرَوِّجٌ. وَرَاجَ الشَّيْءُ يَرُوجُ، إِذَا عُجِّلَ بِهِ. وَكُلٌّ قَدْ قِيلَ، وَاللَّهُ أَعْلَمُ بِصِحَّتِهِ، إِلَّا أَنِّي أُرَاهُ كُلَّهُ دَخِيلًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            ابن فارس يعدّ الجذر «روج» دخيلاً لا أصيلاً، غير أن الخليل أثبته وأجازه،
            والاستعمال اللغوي توطّنه؛ وهذا تحفّظ يستوجب التنبيه في التوثيق.

    - lemma: "تَسَوُّقِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تِجَارِيَّة"
      contradicts:
        - text: "«تجارية» → mercantilism"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: >
            ARABTERM يُترجم «تجارية» بـ mercantilism (المذهب التجاري الاقتصادي)،
            وهو مفهوم أعمّ وأبعد كثيراً عن دلالة القابلية للبيع المنشودة.

    - lemma: "البَيْعِيَّة"
      confirm:
        - text: "«البَيْعيّة؛ الرّواجيّة: قابلية البيع أو الرواج.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْبَاءُ وَالْيَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، وَهُوَ بَيْعُ الشَّيْءِ، وَرُبَّمَا سُمِّيَ الشِّرَى بَيْعًا. وَيُقَالُ بِعْتُ الشَّيْءَ بَيْعًا، فَإِنْ عَرَضْتَهُ لِلْبَيْعِ قُلْتَ أَبَعْتُهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر ب-ي-ع أصل عربي واحد صحيح راسخ بلا خلاف، مما يمنح «البيعية» قاعدة
            اشتقاقية أمتن من «الرواجية» التي جذرها مختلَف في أصالته.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: رواج تجاري ──
    - lemma: "رواج تجاري"
      decision: removed
      decision_reason: >
        «رواج تجاري» مركب وصفي يُعبِّر عن حالة الرواج التجاري (أن البضاعة تروج وتنتشر)
        لا عن الصفة المُجرَّدة الملازمة للسلعة (القابلية الكامنة للبيع). الفرق جوهري:
        «رواج المنتج» = حالة راهنة زمنية، أما «قابلية البيع» = خاصية ملازمة.
        علاوة على ذلك، المورد الحديث يُفضِّل «الرواجية» مصطلحاً مسكوكاً دون «رواج تجاري».
        اختبار السكّ: يمكن إبدال «تجاري» بـ«سريع» أو «واسع» ويبقى وصفاً مفهوماً →
        ليس مصطلحاً مسكوكاً. غياب التشكيل يدلّ على قصور اصطلاحي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة: قابلية البيع ──
    - lemma: "قابلية البيع"
      decision: confirmed
      decision_reason: >
        مركب إضافي يُثبته المورد الحديث تعريفاً للبيعية والرواجية («قابلية البيع أو الرواج»)،
        ويُثبته معجم التجارة والمحاسبة ضمن نمط «قابلية التسويق، قابلية التداول» المعتمد.
        صيغة «قابلية + المصدر» نمط اصطلاحي منتج راسخ في المعجمية الاقتصادية العربية.
        «القابلية» مصدر صناعي معتمد في المعجم الوسيط. يجتاز اختبار التثبيت المعجمي بالتوثيق
        في معجمَي ALECSO والمورد الحديث. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تُصرِّح بالجانب القانوني-التعاقدي: إمكانية نقل ملكية الشيء بعقد بيع صحيح
        واستيفائه شروط التداول؛ تُستخدَم في السياقات الحقوقية والمحاسبية وعقود التجارة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ البَيْعِ"

    # ── مرشح المرحلة ١: نَفَاقِيَّة ──
    - lemma: "نَفَاقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أصالة الجذر ن-ف-ق في دلالة رواج السلعة (ابن فارس: «نفق السعر نفاقاً، أي يمضي
        فلا يكسد») فإن لفظ «النِّفَاق» رسخ في الوعي العربي المعاصر بمعنى الرياء والكذب
        حصراً. يُؤكد ذلك مسرد ARABTERM الذي يُترجم «نفاق» بـ hypocrisy لا بغيره.
        استعادة المعنى التجاري القديم ستُفضي إلى التباس دلالي يُعيق التداول ويُضعف
        الوضوح الاصطلاحي. تسقط باختبار الإيهام الدلالي.
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: رَوَاجِيَّة ──
    - lemma: "رَوَاجِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَت صراحةً في المورد الحديث (2008) مصطلحاً لـ salability جنباً إلى جنب مع
        «البيعية». مصدر صناعي منتظم على وزن فَعَالِيَّة من الفعل «رَاجَ».
        الجذر روج وإن رآه ابن فارس دخيلاً فقد أجازه الخليل وتوطّن في العربية وتصرّف
        فيه المولِّدون (رَوَّجَ، مُرَوِّج، تَرْوِيج). اجتاز اختبار التثبيت المعجمي بتسجيله
        في المورد الحديث. يُستوفى اختبار السكّ: «رواجية» لا تقبل إبدال «راج» بمرادف
        مع الحفاظ على المعنى الاصطلاحي الدقيق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز على بُعد الرواج والتداول السوقي: إمكانية ترويج الشيء وتصريفه لدى المشترين
        وإيجاد طلب عليه؛ أنسب للسياقات التسويقية وتقييم الطلب السوقي.
      actions:
        - command: create_entry
          params:
            lemma: "رَوَاجِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04739477-n"

    # ── مرشح المرحلة ١: تَسَوُّقِيَّة ──
    - lemma: "تَسَوُّقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد معجمية تُثبّت هذا المصطلح. وزن تَفَعُّلِيَّة غير منتج في تكوين
        مصطلحات الصفات المُجرَّدة. كلمة «التسويق» موجودة في التعريف الحالي مما يُوقعها
        في الدوران. تسقط باختبار التثبيت المعجمي.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: تِجَارِيَّة ──
    - lemma: "تِجَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        دلالتها أعمّ من المطلوب؛ تُترجَم في معجم الاقتصاد بـ mercantilism (المذهب التجاري)
        لا بـ salability. «التجارية» تُعبِّر عن الطابع التجاري للنشاط عموماً لا عن
        صفة قابلية السلعة للبيع تحديداً. تسقط باختبار الدقة الدلالية.
      evidence_assessment:
        case: contradicts_only

    # ── لمّة مكتشَفة من الأدلة: البَيْعِيَّة ──
    - lemma: "البَيْعِيَّة"
      source: stage2_evidence
      decision: confirmed
      decision_reason: >
        مُثبَت في المورد الحديث (2008) مصطلحاً لـ salability جنباً إلى جنب مع «الرواجية».
        مصدر صناعي منتظم على وزن فَعْلِيَّة من الجذر الأصيل ب-ي-ع.
        الجذر أقوى اشتقاقياً من «رواجية» لأن ابن فارس يُثبت ب-ي-ع «أصلاً واحداً صحيحاً»
        غير مختلَف في أصالته. اجتاز اختبار التثبيت المعجمي وهو المقابل الأول في المورد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز على صلاحية الشيء لأن يكون موضوع عقد بيع صحيح من حيث الملكية والتصرف؛
        أنسب للسياقات القانونية والمالية عند الحديث عن الأصول والضمانات والرهون.
      actions:
        - command: create_entry
          params:
            lemma: "البَيْعِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04739477-n"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة القابلية للبيع أو التسويق"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية من الإنجليزية (the quality of being salable or marketable)
        وينطوي على دوران جزئي: «صفة القابلية للبيع» تعيد «قابلية البيع» بصياغة مختلفة قليلاً.
        يفتقر إلى الجنس القريب الواضح والفصل النوعي الكافي. يجب تأليفه على أسلوب المعجم الوسيط
        مع تحديد الجنس (خاصية/صفة في السلعة) والفصل (استيفاء شروط التداول + وجود طلب).
    authored:
      - type: terminological
        text: >
          خَاصِّيَّةٌ في السِّلْعةِ أو الخِدْمةِ تدلّ على استيفائها الشُّروطَ التجاريةَ
          والقانونيةَ اللازمةَ لتداولِها في الأسواقِ، ووجودِ طلبٍ عليها من المشترين.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كونُ الشَّيءِ صالحاً للبيعِ والتسويقِ؛ أي مستوفياً شُروطَ التداولِ التجاريِّ في الأسواق."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
