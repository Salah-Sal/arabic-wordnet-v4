        entity_id: "{auto}"
        key: note
        value: '{"root":"دنس","maqayis":"«الدَّالُ وَالنُّونُ وَالسِّينُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الدَّنَسُ، وَهُوَ اللَّطْخُ بِقَبِيحٍ»"}'

    - command: set_metadata
      params:
