      - lemma: "دَنَسٌ"
        examples:
          - text: >
              رأى العلماءُ أن دَنَسَ هذا المكانِ المقدَّسِ لا يُطهَّرُ إلا
              بالتوبةِ الصادقةِ وإعادةِ تكريسِهِ للعبادة
            type: usage
      - lemma: "نَجَاسَةٌ"
        examples:
          - text: >
              قرَّرَ الفقهاءُ أن نَجَاسَةَ هذه المادةِ تحولُ دونَ صحةِ
              الصلاةِ ما لم يُتطهَّرْ منها طهارةً كاملة
            type: usage
