    # ── لمّة موجودة: نَجَاسَةٌ ──
    - lemma: "نَجَاسَةٌ"
      decision: confirmed
      decision_reason: >
        نَجَاسَةٌ مصدرٌ على وزن فَعَالَة يُفيد الصفة المجردة الثابتة، وهو من
        أصل (ن ج س) الذي أثبت ابن فارس أنه "يدل على خلاف الطهارة" — وهذا
        مقابلٌ مباشر لمفهوم "unholiness" (ضد القداسة والطهارة). المعاجم
