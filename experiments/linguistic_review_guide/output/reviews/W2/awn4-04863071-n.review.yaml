    - lemma: "دَنَاسَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        مُرادِف للجذر ذاته الممثَّل بـ"دَنَسٌ" المؤكَّد في المجموعة؛ لا تُضيف
