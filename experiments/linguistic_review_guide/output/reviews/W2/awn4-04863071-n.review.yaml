# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────
stage5_enrichment:

  per_entry:
    - lemma: "دَنَسٌ"
      entry_id: "{auto}"
      root: "دنس"
      maqayis_quote: >
        «الدَّالُ وَالنُّونُ وَالسِّينُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الدَّنَسُ،
        وَهُوَ اللَّطْخُ بِقَبِيحٍ»

    - lemma: "نَجَاسَةٌ"
      entry_id: "{auto}"
      root: "نجس"
      maqayis_quote: >
        «النُّونُ وَالْجِيمُ وَالسِّينُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى
        خِلَافِ الطَّهَارَةِ. وَشَيْءٌ نَجِسٌ وَنَجَسٌ: قَذِرٌ»

  per_sense:
    - lemma: "دَنَسٌ"
      sense_id: "{auto}"
      nuance: >
        يُفيد الدنسَ بوصفه لطخاً وأثراً يقع على شيء كان طاهراً (defilement
        as an act or mark); يُستعمل في سياق انتهاك القداسة كما في "تدنّست
        أماكن العبادة". يميل نحو التعبير عن الشق الأخلاقي/الوجودي من
        عدم القداسة، وهو بناءً مذكر أخصر وأقرب إلى التعبير الشعري والأدبي.
      mwe: false

    - lemma: "نَجَاسَةٌ"
      sense_id: "{auto}"
      nuance: >
        مصدر يُفيد الحالةَ الكليةَ الثابتة لغياب الطهارة (unholiness as a
        permanent state); أكثر تخصصاً في الخطاب الفقهي الإسلامي، وتُستعمل
        بالأخص لما يمنع صحة العبادة. تُفيد الصفة الملازمة للشيء،
        لا حدث التدنيس العارض كما في "دَنَسٌ".
      mwe: false

  synset:
    cultural_fit: native

  actions:
