    - lemma: "رِجْسٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الكلمة شديدة التعدد الدلالي (صوت الرعد / هدير الجمل / القذر / العذاب /
        الوسوسة / الكفر)، ومبنى ابن فارس يُؤصّلها في "الاختلاط والصوت" لا في
