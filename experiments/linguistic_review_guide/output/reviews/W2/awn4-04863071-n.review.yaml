      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصدر يدل على الحالة الكلية لعدم الطهارة الشرعية (unholiness as
        a fixed state); أكثر تخصصاً في السياق الفقهي الإسلامي من "دَنَس"،
        وتُستعمل بالأخص لوصف ما يمنع صحة العبادة. تُفيد الصفة الملازمة
