        قاعدة البيانات لهذا الاستعمال.

    - lemma: "قَذَارَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الكلمة متداخلة في المعنى مع "نَجَاسَة" الموجودة في المجموعة ولا تُضيف
        فارقاً نوعياً. تميل "قَذَارَة" نحو المعنى الحسي المادي (physical
        dirtiness) أكثر من الشق الديني/الشرعي الذي تتفرد به "نَجَاسَة".
        إضافتها تُوجد تكراراً ترادفياً لا مسوّغ له.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:

  definition:
    current: "صفة كون الشيء غير مقدس"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية ضعيفة: (١) يعتمد النفي "غير مقدس" بدلاً من
        الإثبات بمفهوم إيجابي، (٢) ينطوي على دور مخفف ("صفة كون" = كيف كان؟
        كما لو عرّفنا الشيء بنفسه)، (٣) لا يُميّز بين الشقين الدلاليين
        اللذين تُغطّيهما اللمّتان: الدنس الأخلاقي والنجاسة الشرعية.
    authored:
      - type: terminological
        text: >
          حالُ الشيءِ أو الشخصِ المُتَّسِمِ بالدَّنَسِ أو النجاسةِ، بما يَعني
          انعدامَ القداسةِ فيه وبُعدَهُ عن الطهارةِ الدينيةِ والصفاءِ الروحي
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          انعدامُ القداسةِ والطهارةِ في الشيءِ أو الشخصِ، بحيث يكونُ دنِساً
          أو نجِساً بعيداً عن كلِّ تنزُّهٍ ديني
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04863071-n"
          definition_index: 0
          text: >
            حالُ الشيءِ أو الشخصِ المُتَّسِمِ بالدَّنَسِ أو النجاسةِ، بما يَعني
            انعدامَ القداسةِ فيه وبُعدَهُ عن الطهارةِ الدينيةِ والصفاءِ الروحي
      - command: add_definition
        params:
