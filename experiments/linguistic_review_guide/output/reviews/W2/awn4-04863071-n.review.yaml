# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. اللمّات المرشحة (عمياء — بناءً على التعريف فقط قبل الاطلاع على اللمّات)
  # التعريف المقنّع: "صفة كون الشيء غير مقدس"
  blind_candidates:
    - lemma: "دَنَاسَةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدرٌ قياسي على وزن فَعَالَة من جذر (د ن س)، بمعنى الاتسام بالدنس وحالة
        التلوث الأخلاقي أو الديني؛ يصلح للدلالة على الصفة المجردة لـ"كون الشيء
        غير طاهر". تميّزه عن المصدر الثاني "دَنَس" في كونه يُفيد الصفة الثابتة
        لا مجرد لطخ عارض.

    - lemma: "رِجْسٌ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من معنى القذر الحسي المباشر إلى الخبث الديني؛ اللفظ
        مستعمل في القرآن الكريم للدلالة على ما يُستقذر شرعاً ﴿فَاجْتَنِبُوا
        الرِّجْسَ مِنَ الأَوْثَانِ﴾، وعند الفقهاء لما يُناقض القداسة والطهارة.
        مجاز راسخ في الاستعمال الديني.

    - lemma: "خُبْثٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر من "خَبُثَ" (جذر خ ب ث)، يدل على الرداءة والقبح في الطبيعة
        والدين؛ يُستعمل في الحديث "أعوذ بك من الخُبث والخبائث"، ويُفيد
        في بعض السياقات الغياب التام للطهارة والقداسة.

    - lemma: "قَذَارَةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن فَعَالَة من "قَذِرَ" (جذر ق ذ ر)، يدل على انعدام
        النظافة والطهارة. يُستعمل في المعاجم الحديثة مرادفاً للنجاسة بمعناها
        الواسع. وزن فَعَالَة يُفيد الصفة الثابتة اللازمة لوصف الحالة.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        لمّة "دَنَس": المعنى الأصلي للكلمة هو الوسخ المادي الملموس ("الوَسَخ"
        في المعجم الوسيط)، لا "صفة عدم القداسة" بمفهومها المجرد؛ التوسيع إلى
        المعنى الديني يسير عبر مجاز راسخ لكنه يظل مجازاً.
      - >
        لمّة "نَجَاسَة": الكلمة مرتبطة ارتباطاً وثيقاً بالمعنى الفقهي الإسلامي
        المحدد (ما يمنع جنسه الصلاة) وليس بـ"عدم القداسة" بالمعنى اللاهوتي
        الواسع. هذا تضييق قد لا يُغطي كامل دلالة "unholiness".
      - >
        التعريف الحالي "صفة كون الشيء غير مقدس" صياغةٌ إسقاطية ترجمية ضعيفة:
        تعتمد النفي ("غير") بدلاً من الإثبات، وتنطوي على دور مخفف إذ تُعرِّف
        الصفة بـ"كون" التي لا تضيف دلالة.
      - >
        المفهوم الإنجليزي "unholiness" محمّل بخلفية لاهوتية مسيحية (مقابل
        holiness/consecration)، بينما تتناوله اللمّات العربية من زاوية النجاسة
        الشرعية والدنس الأخلاقي — وهما زاويتان صالحتان ثقافياً لكنهما غير
        مطابقتين تماماً للمصطلح الأصلي.
      - >
        كلا اللمّتين يفتقران إلى التشكيل الكامل في قاعدة البيانات: "دَنَس"
        تنقصها التنوين، و"نَجَاسَة" كذلك.
    observations: >
      المجموعة الترادفية تتناول مفهوماً دينياً فلسفياً (القداسة المنفية)، وقد
      غطّاه العرب من خلال محورين: (١) الدنس الأخلاقي (دَنَس) وهو تلوث العرض
      والمروءة، و(٢) النجاسة الشرعية (نَجَاسَة) وهي ما يُمنع معه أداء العبادة.
      كلا المحورين يتقاطع مع "unholiness" من زوايا مختلفة. والأجدر أن تُؤخذ
      اللمّتان معاً لتغطية طيف الدلالة: "دَنَس" للشق الوجودي/الأخلاقي،
      و"نَجَاسَة" للشق الشرعي/الطقوسي. التعريف يستحق إعادة صياغة بأسلوب
      المعجم الوسيط.


