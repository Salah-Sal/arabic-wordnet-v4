# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15180180-n (يوم / solar day)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «أربع وعشرون ساعة» تعبير عددي وصفي وليست مصطلحاً مسكوكاً بالمعنى المعجمي الدقيق، لكنها تُستخدم كوحدة زمنية ثابتة"
      - "لا يوجد تشكيل على اللمّتين الموجودتين"
      - "ينقص المجموعة المصطلح الفلكي التقني «يوم شمسي» الوارد في مصطلحات أليكسو"
    observations: "المفهوم المقصود هو اليوم الشمسي بوصفه وحدة زمنية فلكية تساوي مدة دورة الأرض الكاملة حول محورها (٢٤ ساعة). لفظ «يوم» هو الأصل في هذا الباب وهو من أقدم الألفاظ العربية وأكثرها شيوعاً. التعريف الحالي مقبول لكنه يفتقر إلى ذكر المدة الزمنية (٢٤ ساعة) التي تميّز اليوم الشمسي الوسطي."
  blind_candidates:
    - lemma: "يَوْم"
      generation_method: ishtiqaq
      justification: "اللفظ الأساسي في العربية للدلالة على الفترة الزمنية الكاملة لدوران الأرض حول محورها، من جذر (ي و م)، مستعمل في القرآن والحديث والعلوم"
    - lemma: "نَهَار"
      generation_method: majaz
      justification: "توسُّع مجازي من دلالته الأصلية (ضياء ما بين الطلوع والغروب) إلى الدورة الكاملة، لكن هذا التوسع غير مطّرد في الاستعمال الفصيح"
    - lemma: "يَوْم شَمْسِيّ"
      generation_method: tarkib
      justification: "مركب وصفي تقني يُستخدم في الفلك للتمييز عن اليوم النجمي، مسجّل في مصطلحات أليكسو (الرياضيات والفلك، هندسة المياه، الفيزياء)"
    - lemma: "يَوْم وَسَطِيّ"
      generation_method: tarkib
      justification: "محاولة لنقل mean solar day، لكن الصيغة الكاملة المعتمدة هي «اليوم الشمسي المتوسط» لا «يوم وسطي» منفرداً"

stage2_evidence:
  per_lemma:
    - lemma: "يَوْم"
      confirm:
        - text: "«(فى الفلك): مقدار دوران الأرض حول محورها ومدته أربع وعشرون ساعة»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة)"
        - text: "«اليوم: مقدارُه من طلوع الشمس إلى غروبها، والأيّام جَمْعُه»"
          source: "كتاب العين للخليل بن أحمد"
        - text: "«اليَوْمُ: معروفٌ مِقدارُه من طلوع الشمس إلى غروبها»"
          source: "لسان العرب لابن منظور"
        - text: "«اليوم: مدة كون الشمس فوق الأرض عرفا، وهو الوقت المطلق لغة، ليلا كان أو نهارا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«اليوم الشمسي وهو جزء واحد من ثلاثمائة وستين جزءا من زمان السنة الشمسية الحقيقية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التفريق بين اليوم الطلوعي والشمسي والقمري عند حكماء الهند"
        - text: "«(يَوَمَ) الْيَاءُ وَالْوَاوُ وَالْمِيمُ: كَلِمَةٌ وَاحِدَةٌ، هِيَ الْيَوْمُ: الْوَاحِدُ مِنَ الْأَيَّامِ، ثُمَّ يَسْتَعِيرُونَهُ فِي الْأَمْرِ الْعَظِيمِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الدلالة الأصلية هي الواحد من الأيام مع استعارة في الشدة والعِظَم"

    - lemma: "أَرْبَع وَعِشْرُونَ سَاعَة"
      confirm:
        - text: "«(فى الفلك): مقدار دوران الأرض حول محورها ومدته أربع وعشرون ساعة»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة)"
      expands:
        - text: "«اليوم التقويميّ [من منتصف الليل إلى منتصفه التالي]»"
          source: "المورد الحديث (2008)"
          addition: "التعبير العددي يرد في سياق تحديد مدة اليوم الفلكي"

    - lemma: "نَهَار"
      contradicts:
        - text: "«ضِيَاء ما بين طلوع الفجر إلى غروب الشمس»"
          source: "المعجم الوسيط"
          conflict: "النهار يدل على فترة الضياء فقط (من الفجر إلى الغروب) لا على الدورة الكاملة (٢٤ ساعة)"
        - text: "«النّهار بالفتح لغة ضوء واسع ممتد من الطلوع إلى الغروب. وعرفا زمان هذا الضوء. وشرعا من الصبح إلى المغرب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التعريفات اللغوية والعرفية والشرعية كلها تحصر النهار في فترة الضوء دون الليل"
        - text: "«النهار: انفتاح الظلمة عن الضياء ما بين طلوع الفجر إلى غروب الشمس»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الاشتقاقي (ن هـ ر) يدل على التفتح والانشقاق، فالنهار هو انفتاح الظلمة لا الدورة الكاملة"

    - lemma: "يَوْم شَمْسِيّ"
      confirm:
        - text: "«يوم شمسي — solar day»"
          source: "مصطلحات أليكسو (الرياضيات والفلك)"
        - text: "«يوم شمسي — solar day»"
          source: "مصطلحات أليكسو (هندسة المياه)"
        - text: "«يوم شمسي — solar day»"
          source: "مصطلحات أليكسو (الفيزياء)"
      expands:
        - text: "«اليوم الشمسي المتوسط (فل)»"
          source: "المورد الحديث (2008)"
          addition: "يُستخدم المصطلح مع صفة «المتوسط» للدلالة على mean solar day"

    - lemma: "يَوْم وَسَطِيّ"
      evidence_status: "no_material_found"

