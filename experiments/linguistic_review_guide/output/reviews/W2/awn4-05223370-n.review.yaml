# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-05223370-n  |  ili: i64379  |  pos: n
# المعنى: the quality of abounding in trees
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (حراجية) و(كثافة شجرية) خاليتان من التشكيل الكامل"
      - "(حراجية) تُستخدم في المعجمية الحديثة صفةً نسبيةً (الأراضي الحراجية، الهندسة الحراجية) لا اسمًا مجردًا للصفة"
      - "(كثافة شجرية) مركب وصفي حر يفشل اختبار السك — يمكن إبدال (كثافة) بـ(وفرة) أو (غزارة) دون تغيير في المعنى"
      - "المجموعة تفتقر إلى مصطلح مسكوك موثق يعبّر عن الخاصية المجردة لوفرة الأشجار في المكان"
    observations: >
      تعبّر المجموعة عن خاصية مجردة (quality) ضمن شجرة تصنيف ترأسها (جَوْدَة / نَوْعِيَّة)،
      وهي تصف وفرة الأشجار في موضع ما. اللمّة (حراجية) قياسية صرفياً على وزن المصدر الصناعي
      من جذر (حرج) الدال في أصله على اجتماع الشجر وتضامه — وهو جذر موثق في مقاييس اللغة
      بمعنى (مُجتمع شجر). بيد أن المعجمية العربية الحديثة استقرت على توظيف (حَرَاجِيّ/حَرَاجِيَّة)
      وظيفةً صفتية نسبية فحسب (الكثافة الحراجية، الأراضي الحراجية)، ولم يُثبَت استخدامها اسمًا
      للصفة المجردة. أما (كثافة شجرية) فعبارة وصفية حرة؛ إذ يحل (وفرة شجرية) أو (غزارة شجرية)
      محلها تمامًا، وهذا دليل قاطع على انعدام التثبيت المعجمي. المجموعة في حاجة إلى مصدر
      صناعي مُعجَّم كـ(أَشْجَارِيَّة) المشتق قياساً من جمع (أشجار)، مما يحقق دلالة الصفة المجردة
      على وفرة الأشجار بصورة صريحة ومعجمياً موثوقة.

  blind_candidates:
    - lemma: "الشَّجَرِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي على وزن الفَعَلِيَّة من (شَجَر)؛ يدل على خاصية الطابع الشجري للمكان،
        قياساً على (الطينية، الرملية) للتعبير عن الخاصية المجردة لطبيعة التربة.
    - lemma: "التَّشَجُّر"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَعُّل من (شَجَرَ)، قياساً على (التعشُّب، التخضُّر) للدلالة على وفرة نوع نباتي
        وانتشاره في البيئة؛ يفيد معنى الكثافة الشجرية الناجمة عن النمو الطبيعي.
    - lemma: "الحَرَاجِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من (حَرَاج / أحراج = الأشجار المجتمعة الكثيفة)؛ الجذر (حرج) يدل أصلاً
        على اجتماع الشجر وتضامه عند ابن فارس وغيره، مما يؤصّل الاشتقاق منه للتعبير
        عن صفة وفرة الأشجار.
    - lemma: "الغَابِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من (غابة = الأجمة)؛ يدل على خاصية كون المكان غابياً مليئاً بالأشجار،
        قياساً على (الصحراوية، الجبلية) للتعبير عن الطابع البيئي المجرد.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1 — مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات)
#   Q2 — جسر إنجليزي: woodiness, woodsiness, woody, wooded, arboreous, arboreal, sylvan, forest density, tree cover
#   Q3 — بحث FTS بالكلمات المفتاحية: وفرة، كثافة، أشجار، شجر، حراج، غابة، تشجر
#   Q4 — مقاييس اللغة (dict_id=151): جذور شجر، حرج، وفر، غيب، كثف
#   Q5 — تحقق من مرشحات المرحلة ١ + الأشجارية
stage2_evidence:
  per_lemma:

    - lemma: "حراجية"
      evidence_status: "no_material_found"
      # لا يوجد مدخل مستقل لـ(حراجية) بوصفها اسمًا مجردًا للصفة في أي من المعاجم المستعلَمة.
      # تظهر (حرجي / حراجية) حصرًا في السياقات الوصفية والنسبية (الأراضي الحراجية).

    - lemma: "كثافة شجرية"
      expands:
        - text: "«انخفضت فيها الكثافة الشجرية نتيجة القطع»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
          addition: "العبارة مستعملة في السياق الحرجي التقني، لكنها تؤدي وظيفة الوصف الحر لا وظيفة المصطلح المسكوك، وتقبل الاستبدال بـ(الكثافة الشجرية / وفرة الأشجار) بلا فرق في المعنى"

    - lemma: "الشَّجَرِيَّة"
      source: stage1
      evidence_status: "no_material_found"
      # (شجري/شجرية) في المعاجم صفة نسبية (arboreal)؛ لا وجود للمصدر الصناعي بمعنى الصفة المجردة.

    - lemma: "التَّشَجُّر"
      source: stage1
      contradicts:
        - text: "«تَشَجُّر» — translation_en: arborization"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المصطلح مُقنَّن في المعجمية العربية الطبية بمعنى (arborization = التشعُّب الشبيه بالشجرة) في التشريح العياني وعلم الأعصاب، وهو مغاير تمامًا لمعنى (وفرة الأشجار في المكان)"
        - text: "«تَشَجُّر» — translation_en: arborization"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          conflict: "تأكيد إضافي على التقنين الطبي لهذا المصطلح بالمعنى المغاير"

    - lemma: "الحَرَاجِيَّة"
      source: stage1
      expands:
        - text: "«الْحَاءُ وَالرَّاءُ وَالْجِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ تَجَمُّعُ الشَّيْءِ وَضِيقُهُ. فَمِنْهُ الْحَرَجُ جَمْعُ حَرَجَةٍ، وَهِيَ مُجْتَمَعُ شَجَرٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (حرج) يدل أصلاً على اجتماع الشجر، مما يؤصّل الاشتقاق منه معجمياً لمعنى وفرة الأشجار"
        - text: "«غيضة الشجر الملتفة لا يقدر أحد أن ينفذ فيها»"
          source: "المعجم الوسيط"
          addition: "الحَرَج بمعنى الغيضة الكثيفة يؤكد الصلة الوثيقة بين الجذر وكثافة الأشجار"
        - text: "«أَجَميّ؛ حَرَجيّ» — translation_en: sylvan"
          source: "المورد الحديث (2008)"
          addition: "استخدام (حرجي) مقابلاً لـ(sylvan) يكشف أن المعجمية الحديثة وظّفت هذا الجذر للدلالة على الوسف الغابي، لكن في الصفة لا المصدر الصناعي"

    - lemma: "الغَابِيَّة"
      source: stage1
      evidence_status: "no_material_found"
      # لا وجود لمصطلح (الغابية) بمعنى الصفة المجردة لوفرة الأشجار في أي معجم مستعلَم.

    - lemma: "أَشْجَارِيَّة"
      # مُكتشَف عبر الجسر الإنجليزي في المرحلة ٢ (woodiness — المورد الحديث 2008)
      confirm:
        - text: "«(1) الأشجاريّة: كونُ الأرض كثيرةَ الأشجار / (2) الخَشَبيّة: كون الشَّيء خشبيًّا»"
          source: "المورد الحديث (2008) — translation_en: woodiness"
      # المعنى الأول من المدخل (الأشجارية) يطابق تمامًا تعريف المجموعة.
      # المعنى الثاني (الخشبية) يغطي المعنى المادي لـwoodiness ولا ينتمي لهذه المجموعة.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حراجية"
      decision: removed
      decision_reason: >
        لا يثبت للفظ (حراجية) استخدام معجمي بوصفه اسمًا مجردًا للصفة (quality noun) يعبّر عن
        خاصية وفرة الأشجار؛ جميع الشواهد المستعلَمة تظهر (حرجي/حراجية) في الوظيفة الصفتية
        النسبية بمعنى "ما يتعلق بالحراج والغابات" (نحو: الأراضي الحراجية، الهندسة الحراجية،
        الكثافة الحراجية). هذه الوظيفة مغايرة للمعنى المطلوب الذي يشترط دلالة على الصفة
        المجردة لا على النسب الموضوعي. فضلاً عن ذلك، التشكيل غائب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كثافة شجرية"
      decision: removed
      decision_reason: >
        (كثافة شجرية) مركب وصفي (نعتي) لا يجتاز اختبار السك المعجمي؛ يمكن إبدال (كثافة)
        بـ(وفرة) أو (غزارة) والتعبير يبقى صحيحاً دون تغيير في المدلول، وهو دليل على انعدام
        التثبيت المعجمي. علاوةً على ذلك، (كثافة) تحيل إلى معنى القياس العددي أو الحجمي
        (density) وهو أضيق من المعنى المطلوب (الصفة الكيفية لوفرة الأشجار). اللمّة غير مشكّلة
        وغير مسجّلة مدخلاً معجمياً مستقلاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الشَّجَرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يثبت للمصطلح معجمياً معنى الصفة المجردة لوفرة الأشجار؛ (شجري/شجرية) في المعاجم
        العربية صفة نسبية تدل على "ما يتعلق بالشجر أو ينتسب إليه" (arboreal) لا على خاصية
        كون الأرض عامرة بالأشجار. اختبار التمييز: (شجرية) تصلح لوصف الكائنات التي تعيش
        على الأشجار (ثديات شجرية) لا لوصف المكان بوفرة أشجاره.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "التَّشَجُّر"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تثبت تقنين (تشجُّر) في المعجمية الطبية والبيولوجية بمعنى (arborization
        = التشعُّب الشبيه بالشجرة) — وهو ظاهرة تشريحية في النظام العصبي. هذا التناقض الدلالي
        الثابت يحول دون توظيف اللفظ في هذه المجموعة بمعنى وفرة الأشجار.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "الحَرَاجِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر (حرج) مؤصَّل في مقاييس اللغة وعدد من المعاجم لكثرة الشجر واجتماعه، والاشتقاق
        قياسي صرفياً. غير أن المعجمية الحديثة (المورد الحديث 2008 وغيره) استقرت على توظيف
        (حَرَاجِيّ) صفةً نسبيةً وليس مصدرًا صناعيًا للصفة المجردة. لم يُثبَت (الحراجية) اسمًا
        مجردًا للصفة في أي معجم موثوق. يُفضَّل عليه (أشجاريّة) المثبَّت مباشرةً في المورد
        الحديث بالمعنى الدقيق المطلوب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "الغَابِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُثبَت المصطلح في المعاجم المستعلَمة بمعنى الصفة المجردة لوفرة الأشجار. (الغابية)
        إن استُخدمت فهي صفة نسبية تدل على الانتساب إلى الغابة، وتفتقر إلى التوثيق المعجمي
        بالوظيفة المطلوبة هنا.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "أَشْجَارِيَّة"
      # مُكتشَف عبر الجسر الإنجليزي في المرحلة ٢
      decision: confirmed
      decision_reason: >
        المصطلح موثَّق مباشرةً في المورد الحديث (2008) بالتعريف الصريح: "كونُ الأرض كثيرةَ
        الأشجار"، وهو مقابل مباشر للمعنى الأول من مدخل woodiness. يجمع المصطلح مزايا عدة:
        (أ) مصدر صناعي قياسي من جمع (أشجار) على وزن أَفْعَالِيَّة، وهو وزن منتج في العربية
        الحديثة للصفات المجردة. (ب) يدل صراحةً على الخاصية المجردة لا على النسب الموضوعي.
        (ج) موثَّق في مرجع معجمي موثوق ومعاصر. (د) يجتاز اختبار السك: لا يمكن إبدال أي
        مكوّن منه بمرادفه مع الحفاظ على المصطلح ذاته. الجذر (شجر) مؤصَّل في مقاييس اللغة
        بمعنى الكثرة الشجرية («وَادٍ شَجِرٌ: كَثِيرُ الشَّجَرِ»).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة؛ تدل على الصفة المجردة لكون الأرض أو البيئة
        وافرة الأشجار كثيفتها. تتمايز عن (الغابة) التي هي اسم مكان لا صفة كيفية، وعن
        (التشجير) الدال على العملية الفعلية لزرع الأشجار، وعن (الحرج) الدال على الغيضة
        الكثيفة بوصفها مكانًا لا خاصيةً مجردة.
      actions:
        - command: create_entry
          params:
            lemma: "أَشْجَارِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة وفرة الأشجار في المكان"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وظيفي لكنه يعاني من ثلاثة قصور: (١) الجنس القريب (صفة) مبهم
        ولا يحدد المتسم بهذه الصفة. (٢) (وفرة) دون تخصيص نوع الوفرة. (٣) (في المكان)
        عامة جداً. يُستحسن تعريف يحدد الجنس بـ(خاصيّة المكان) ويقيّد الفصل بـ(غزارة الأشجار
        وكثافتها) للتمييز عن الخصائص النباتية الأخرى.
    authored:
      - type: terminological
        text: "خاصيَّةُ المكانِ المتسمةُ بغزارةِ أشجارِهِ وكثافتِها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كَوْنُ الأرضِ أو المكانِ وافرَ الأشجارِ كثيرَها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خاصيَّةُ المكانِ المتسمةُ بغزارةِ أشجارِهِ وكثافتِها"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "كَوْنُ الأرضِ أو المكانِ وافرَ الأشجارِ كثيرَها"

  examples:
    per_lemma:
      - lemma: "أَشْجَارِيَّة"
        examples:
          - text: "تُعدّ غاباتُ الأمازون نموذجًا استثنائيًّا على الأَشْجَارِيَّةِ المدارية؛ إذ تضمّ نحو ثلاثة أعشار مجموع الأنواع الشجرية في العالم."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعدّ غاباتُ الأمازون نموذجًا استثنائيًّا على الأَشْجَارِيَّةِ المدارية؛ إذ تضمّ نحو ثلاثة أعشار مجموع الأنواع الشجرية في العالم."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "أَشْجَارِيَّة"
      entry_id: "{auto}"
      root: "شجر"
      maqayis_quote: >
        «الشِّينُ وَالْجِيمُ وَالرَّاءُ أَصْلَانِ مُتَدَاخِلَانِ... فَالشَّجَرُ مَعْرُوفٌ،
        الْوَاحِدَةُ شَجَرَةٌ، وَهِيَ لَا تَخْلُو مِنِ ارْتِفَاعٍ وَتَدَاخُلِ أَغْصَانٍ.
        وَوَادٍ شَجِرٌ: كَثِيرُ الشَّجَرِ. وَيُقَالُ: هَذِهِ الْأَرْضُ أَشْجَرُ مِنْ غَيْرِهَا،
        أَيْ أَكْثَرُ شَجَرًا»

  per_sense:
    - lemma: "أَشْجَارِيَّة"
      sense_id: "{auto}"
      nuance: >
        اللمّة الوحيدة المؤكدة في المجموعة؛ تدل على الصفة المجردة لكون البيئة أو الأرض
        عامرةً بالأشجار وافرتَها. تتمايز عن (الغابة) التي هي اسم مكان لا صفة كيفية، وعن
        (التشجير) الدال على عملية الزراعة والتوسيع الشجري، وعن (الحرج) الدال على نوع محدد
        من الغيضة الكثيفة الملتفة بوصفها موضعًا لا خاصيةً مجردة.

