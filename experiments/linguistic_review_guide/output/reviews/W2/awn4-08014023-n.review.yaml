stage1_review:
  assessment:
    concerns:
      - اللمّة الحالية "مقتنيات فيكتورية" تفتقر إلى التشكيل الكامل.
      - المصطلح الإنجليزي Victoriana يشمل مواد متنوعة (أدبية، فنية، مادية) وقد لا تستوعبه كلمة "مقتنيات" وحدها إذا فُهمت بمعنى التحف فقط.
    observations: "المصطلح يعبر عن مجموعة المواد الثقافية والمادية المرتبطة بالعصر الفيكتوري. في العربية، يُستخدم التركيب الوصفي 'مقتنيات فيكتورية' كترجمة معيارية، ويمكن توليد صيغة جمع مؤنث سالم (فيكتوريات) على نمط المصطلحات الجماعية الحديثة."
  blind_candidates:
    - lemma: "فِيكْتُورِيَّات"
      generation_method: ishtiqaq
      justification: "صيغة جمع مؤنث سالم مشتقة من الصفة (فيكتوري) للدلالة على المجموعات أو الأشياء المنتمية لهذا المجال، على غرار 'إسلاميات' أو 'لسانيات'."
    - lemma: "مُقْتَنَيَات فِيكْتُورِيَّة"
      generation_method: tarkib
      justification: "تعبير وصفي مباشر ومستعمل في السياقات الفنية والتاريخية لترجمة Victoriana."
    - lemma: "تُرَاث فِيكْتُورِيّ"
      generation_method: tarkib
      justification: "تعبير أوسع يشمل الجوانب غير المادية (الأدب، العادات) التي تميز العصر."
    - lemma: "فِيكْتُورِيَانَا"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح العالمي لضمان الدقة في السياقات التخصصية."

stage2_evidence:
  per_lemma:
    - lemma: "مقتنيات فيكتورية"
      confirm:
        - text: "مُقْتَنَيات... مقتنيات فنية... ما يحتفظ به من الأشياء القيمة أو الثمينة... لم ترد هذه الكلمة في المعاجم بصيغة المفرد ولا بصيغة الجمع ولكن ورد الفعل: اقتنى الشيء بمعنى: قناه؛ أي كسبه وجمعه واتخذه لنفسه لا للتجارة."
          source: "معجم الصواب اللغوي"
    - lemma: "فيكتوريانا"
      evidence_status: "no_material_found"
    - lemma: "فيكتوريات"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مقتنيات فيكتورية"
      decision: confirmed
      decision_reason: "مصطلح وصفي دقيق ومستقر في الاستعمال العربي الحديث لترجمة المفهوم، مع كونه يعبر عن الجانب المادي للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقْتَنَيَات فِيكْتُورِيَّة"
    - lemma: "فِيكْتُورِيَّات"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة اشتقاقية عربية رصينة تعبر عن الطابع الجمعي للمواد والمفاهيم المرتبطة بالعصر الفيكتوري."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فِيكْتُورِيَّات", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فِيكْتُورِيَانَا"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فني معرب يُستخدم في دوائر المزادات وهواة جمع التحف لضمان المطابقة مع المصطلح الإنجليزي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فِيكْتُورِيَانَا", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "مجموعة من المواد التي تنتمي إلى العصر الفيكتوري أو تميزه"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً؛ يفضل توضيح طبيعة هذه المواد (أدبية، فنية، أثاث) لتشابهها مع المفهوم الموسوعي."
    authored:
      - type: terminological
        text: "مجموعة من الأشياء والمواد والأعمال الفنية أو الأدبية التي تعود إلى العصر الفيكتوري وتجسد سماته الثقافية والجمالية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مجموعة من الأشياء والمواد والأعمال الفنية أو الأدبية التي تعود إلى العصر الفيكتوري وتجسد سماته الثقافية والجمالية."}
  examples:
    per_lemma:
      - lemma: "مُقْتَنَيَات فِيكْتُورِيَّة"
        examples:
          - text: "يعرض المتحف الوطني مقتنيات فيكتورية نادرة تشمل أثاثاً من خشب الزان ومخطوطات أصلية."
            type: usage
      - lemma: "فِيكْتُورِيَّات"
        examples:
          - text: "تزخر المكتبة البريطانية بقسم خاص للفيكتوريات يضم دوريات وصوراً فوتوغرافية من القرن التاسع عشر."
            type: usage
      - lemma: "فِيكْتُورِيَانَا"
        examples:
          - text: "أصبح سوق الفيكتوريانا رائجاً جداً بين مقتني التحف في الآونة الأخيرة."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تعد هذه المجموعة مرجعاً هاماً لمن يبحث في تاريخ الفيكتوريانا وتطور التصميم في إنجلترا."}

stage5_enrichment:
  per_entry:
    - lemma: "مُقْتَنَيَات فِيكْتُورِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "مقتنيات"
          root: "قنو"
          maqayis_quote: "«الْقَافُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى مُلَازَمَةٍ وَمُخَالَطَةٍ... وَمِنَ الْبَابِ: قَنَى الشَّيْءَ وَاقْتَنَاهُ، إِذَا كَانَ ذَلِكَ مُعَدًّا لَهُ لَا لِلتِّجَارَةِ.»"
        - word: "فيكتورية"
          root: "ف ك ت ر"
          maqayis_quote: "مصطلح أعجمي مشتق من اسم العلم (فيكتوريا)، ولا أصل له في المعاجم العربية القديمة."
    - lemma: "فِيكْتُورِيَّات"
      entry_id: "{auto}"
      root: "ف ك ت ر"
      maqayis_quote: "لفظ مولد مشتق من الاسم الأعجمي (فيكتوريا) بلاحقة الجمع العربية."
    - lemma: "فِيكْتُورِيَانَا"
      entry_id: "{auto}"
      root: "ف ك ت ر"
      maqayis_quote: "لفظ أعجمي معرب (Victoriana)."
  per_sense:
    - lemma: "مُقْتَنَيَات فِيكْتُورِيَّة"
      sense_id: "{auto}"
      nuance: "يركز على الجانب المادي للامتلاك والجمع (التحف والأثاث)."
      mwe: true
    - lemma: "فِيكْتُورِيَّات"
      sense_id: "{auto}"
      nuance: "مصطلح جمعي يشمل المواد والمفاهيم والأدبيات ككتلة واحدة."
      mwe: false
    - lemma: "فِيكْتُورِيَانَا"
      sense_id: "{auto}"
      nuance: "الاسم الفني المتداول عالمياً للمفهوم، يستخدم غالباً في السياقات المتخصصة جداً."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"مقتنيات","root":"قنو","maqayis":"«الْقَافُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى مُلَازَمَةٍ وَمُخَالَطَةٍ... وَمِنَ الْبَابِ: قَنَى الشَّيْءَ وَاقْتَنَاهُ...»"},{"word":"فيكتورية","root":"ف ك ت ر","maqayis":"اسم أعجمي"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على الجانب المادي للامتلاك والجمع.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
