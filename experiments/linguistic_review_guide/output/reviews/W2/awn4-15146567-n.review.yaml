stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'مستقبل' تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي 'الزمن الذي لم يأت بعد' بسيط جداً ويفتقر إلى الصياغة المعجمية المتينة."
      - "الحاجة إلى تمييز المعنى الزمني العام عن المعنى الديني (الآخرة) الذي قد توحي به بعض المرادفات الإنجليزية مثل hereafter."
    observations: "المفهوم هو 'المستقبل' بوصفه بُعداً زمنياً آتياً. العربية غنية بالمشتقات التي تعبر عن هذا المفهوم، سواء من جذر (قبل) أو (أتي) أو (أجل). الاستخدام الأكثر شيوعاً هو 'المستقبل'، ولكن هناك تعابير اصطلاحية مثل 'العام القابل' و'الزمن الآتي' و'الآجل' (مقابل العاجل)."
  blind_candidates:
    - lemma: "مُسْتَقْبَل"
      generation_method: ishtiqaq
      justification: "الاسم الأشهر للزمن الآتي، مشتق من استقبل أي ما يستقبله الإنسان من الزمان."
    - lemma: "آتٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أتى، يُستخدم وصفاً للزمن (الزمن الآتي) أو اسماً له."
    - lemma: "قَابِل"
      generation_method: majaz
      justification: "يُستخدم في السياق الزمني بمعنى الآتي، كما في قولهم 'العام القابل'."
    - lemma: "غَد"
      generation_method: majaz
      justification: "يُستخدم مجازاً للدلالة على المستقبل البعيد أو القريب، وهو شائع في الخطاب الأدبي والفكري."

stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَقْبَل"
      confirm:
        - text: "«المستقبل: ما يترقب وجوده بعد الزمن الحاضر سمي به لأن الزمان يستقبله.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«المستقبل: هو الزمان الذي يترتب وجوده بعد زمانك الذي أنت فيه.»"
          source: "دستور العلماء"
    - lemma: "آتٍ"
      confirm:
        - text: "«آتٍ: Coming... and to time, meaning future.»"
          source: "English-Arabic Lexicon (Lane)"
        - text: "«مُقْبِل؛ آتٍ... المستقبَل» كترجمة لـ future."
          source: "المورد الحديث"
    - lemma: "مُقْبِل"
      confirm:
        - text: "«العام القابل: المقبل.»"
          source: "مقاييس اللغة"
        - text: "«مُقْبِل؛ آتٍ... المستقبَل»"
          source: "المورد الحديث"
    - lemma: "غَد"
      confirm:
        - text: "«(الغد) اليوم الذي بعد يومك واليوم المترقب البعيد.»"
          source: "المعجم الوسيط"
    - lemma: "آجِل"
      confirm:
        - text: "«والاسم الآجل نقيض العاجل والأجيل المرجأ، أي المؤخر إلى وقت.»"
          source: "مقاييس اللغة"
        - text: "«الأجل: غاية الوقت في محل الدين وغيره.»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "مستقبل"
      decision: confirmed
      decision_reason: "هو المصطلح الأساسي والمعياري في اللغة العربية المعاصرة والقديمة للتعبير عن هذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَقْبَل"
    - lemma: "آتٍ"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم بكثرة وصفاً للزمن (الزمن الآتي) ليدل على المستقبل، وهو موثق في المعاجم اللسانية والترجمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "آتٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُقْبِل"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف لـ 'آتٍ' و'مستقبل'، ويشيع استخدامه في التوقيت (العام المقبل، الشهر المقبل)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُقْبِل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "غَد"
      source: stage1
      decision: confirmed
      decision_reason: "يُستخدم استعارةً عن المستقبل المترقب، وهو لفظ أصيل يعبر عن المفهوم في سياقات أوسع من مجرد 'يوم غد'."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "غَد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "آجِل"
      source: stage1
      decision: confirmed
      decision_reason: "اسم للوقت المتأخر أو المستقبل، وغالباً ما يُقرن بالعاجل (في العاجل والآجل)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "آجِل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الزمن الذي لم يأت بعد"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط؛ يُفضل استخدام صياغة معجمية تجمع بين الجنس (زمن) والفصل النوعي (الآتي/المترقب)."
    authored:
      - type: terminological
        text: "الزمنُ الآتي، وهو ما يُترقَّب حدوثه بعد الزمان الحاضر."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "الزمنُ الآتي، وهو ما يُترقَّب حدوثه بعد الزمان الحاضر."}
  examples:
    per_lemma:
      - lemma: "مُسْتَقْبَل"
        examples:
          - text: "يجب علينا التخطيط لمستقبل الأجيال القادمة."
            type: usage
      - lemma: "آتٍ"
        examples:
          - text: "إنَّ المستقبلَ آتٍ لا محالة."
            type: usage
      - lemma: "مُقْبِل"
        examples:
          - text: "سنسافر في الشهر المقبل."
            type: usage
      - lemma: "غَد"
        examples:
          - text: "صناعةُ الغد تتطلب مهاراتٍ تقنيةً عالية."
            type: usage
      - lemma: "آجِل"
        examples:
          - text: "يُثاب المؤمن في عاجل أمره وآجله."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يستعد العالم لمستقبل يعتمد على الذكاء الاصطناعي."}

stage5_enrichment:
  per_entry:
    - lemma: "مُسْتَقْبَل"
      entry_id: "{auto}"
      root: "قبل"
      maqayis_quote: "«القاف والباء واللام أصلٌ واحد صحيح تدلُّ كَلِمُه كلُّها على مواجهة الشيء للشيء... والزَّمان يُستقبَلُه.»"
    - lemma: "آتٍ"
      entry_id: "{auto}"
      root: "اتي"
      maqayis_quote: "«الهمزة والتاء والياء يدل على مجيء الشيء... يقال: أتاني فلان إتياناً وأتياً.»"
    - lemma: "مُقْبِل"
      entry_id: "{auto}"
      root: "قبل"
      maqayis_quote: "«القاف والباء واللام أصلٌ واحد صحيح تدلُّ كَلِمُه كلُّها على مواجهة الشيء للشيء... والعام القابل: المقبل.»"
    - lemma: "غَد"
      entry_id: "{auto}"
      root: "غدو"
      maqayis_quote: "«الغين والدال والحرف المعتل أصلٌ صحيح يدل على زمان. من ذلك الغدو... وأفعل ذلك غداً.»"
    - lemma: "آجِل"
      entry_id: "{auto}"
      root: "اجل"
      maqayis_quote: "«الهمزة والجيم واللام يدل على غاية الوقت... والاسم الآجل نقيض العاجل.»"
  per_sense:
    - lemma: "مُسْتَقْبَل"
      sense_id: "{auto}"
      nuance: "الاسم العام والشامل للزمن الآتي في جميع السياقات."
      mwe: false
    - lemma: "آتٍ"
      sense_id: "{auto}"
      nuance: "يركز على صفة المجيء والحتمية (الزمن الذي سيأتي)."
      mwe: false
    - lemma: "مُقْبِل"
      sense_id: "{auto}"
      nuance: "يركز على المواجهة والحلول القريب (المقبل علينا)، ويشيع في التوقيت."
      mwe: false
    - lemma: "غَد"
      sense_id: "{auto}"
      nuance: "استخدام مجازي يعبر عن التطلع والطموح أو المستقبل القريب."
      mwe: false
    - lemma: "آجِل"
      sense_id: "{auto}"
      nuance: "يركز على صفة التأخر عن الحاضر، وغالباً ما يُستخدم في مقابل 'العاجل'."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قبل","maqayis":"«القاف والباء واللام أصلٌ واحد صحيح تدلُّ كَلِمُه كلُّها على مواجهة الشيء للشيء... والزَّمان يُستقبَلُه.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم العام والشامل للزمن الآتي في جميع السياقات.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 1.0
