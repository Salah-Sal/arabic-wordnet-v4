        - text: "«بادَ الشَّخصُ وغيرُه: هَلَكَ وانقرض، فنِي وتلِف... جنس/ عهد بائد: زائل ومنقرض»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«لاغٍ؛ مُنْدَرِس؛ بائد an extinct institution»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(بَيَدَ) الْبَاءُ وَالْيَاءُ وَالدَّالُ أَصْلٌ وَاحِدٌ، وَهُوَ أَنْ يُودِيَ الشَّيْءُ. يُقَالُ بَادَ الشَّيْءُ بَيْدًا وَبُيُودًا، إِذَا أَوْدَى»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ب ي د يدلّ على الهلاك والفناء، مما يؤكد ملاءمة بائدة للدلالة على لغة زال استعمالها"

    - lemma: "لُغَةٌ مَيِّتَةٌ"
      confirm:
        - text: "«لغة يتوقف الناس عن استعمالها، وقد تظل مستعملة في مجموعة خاصة لدى العلماء وفي بعض المراسم أو الطقوس الدينية …إلخ، مثال اللاتينية.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«لغة يتوقف الناس عن استعمالها، وقد تظل مستعملة في مجموعة خاصة لدى العلماء وفي بعض المراسم أو الطقوس الدينية.إلخ، مثال: اللاتينية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«بائد؛ مَيْت dead languages»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(مَوَتَ) الْمِيمُ وَالْوَاوُ وَالتَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ذَهَابِ الْقُوَّةِ مِنَ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر م و ت يدلّ على ذهاب القوة، وهو استعارة ملائمة لزوال الحيوية من اللغة"
        - text: "«ميت: فانٍ، بائد، قابل للموت»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "يؤكد استعمال ميت بمعنى بائد وفانٍ في المعاجم الكلاسيكية"

    - lemma: "لُغَةٌ مُنْدَثِرَةٌ"
      evidence_status: "no_material_found"

    - lemma: "لُغَةٌ مُنْقَرِضَةٌ"
      expands:
        - text: "«مُنقرِض an extinct species»"
          source: "المورد الحديث (2008)"
          addition: "منقرض يُستعمل أساساً للأنواع الحيوية (extinct species)، وتوسيعه إلى اللغات ممكن لكنه أضيق دلالياً من dead language"

stage3_analysis:
  per_lemma:
    - lemma: "لُغَةٌ بَائِدَةٌ"
      decision: confirmed
      decision_reason: >
        مصطلح ثابت في الأدبيات اللسانية العربية، مؤيَّد بأدلة معجمية متعددة.
        الجذر ب ي د يدلّ على الهلاك والفناء. المورد الحديث يقرن صراحةً بين
        «بائد» و«dead languages». التشكيل الكامل مطلوب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «بائدة» تؤكد الزوال التامّ والانقراض، وتُستعمل غالباً للغات التي لم يبقَ
        لها متحدّثون أصليون ولا استعمال حيّ، كالسومرية والأكّادية. أقرب إلى
        الفناء النهائي منها إلى مجرّد التوقّف عن الاكتساب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُغَةٌ بَائِدَةٌ"

    - lemma: "لُغَةٌ مَيِّتَةٌ"
      decision: confirmed
      decision_reason: >
        مصطلح موثّق في المعجم الموحد لمصطلحات اللسانيات (2002) ومسرد الإعلام
        والتواصل، مع تعريف مفصّل يطابق المفهوم المقصود. التشكيل الكامل مطلوب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «ميّتة» تدلّ على توقّف الاكتساب كلغة أمّ مع إمكان بقاء اللغة في
        استعمالات محدودة (طقسية أو علمية)، كاللاتينية والعبرية الكلاسيكية.
        أوسع دلالةً من «بائدة»، وأقرب إلى المفهوم الإنجليزي dead language.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُغَةٌ مَيِّتَةٌ"

    - lemma: "لُغَةٌ مُنْدَثِرَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تثبت استعمال «لغة مندثرة» مصطلحاً لسانياً ثابتاً.
        «مندثرة» تعني زوال الأثر تماماً، وهي أقرب إلى وصف حرّ منها إلى
        مصطلح مسكوك. لا تجتاز اختبار التثبيت المعجمي.

    - lemma: "لُغَةٌ مُنْقَرِضَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «منقرضة» تدلّ في الاستعمال المعجمي على الانقراض البيولوجي (extinct species)
        أساساً. وفي علم اللسانيات يُفرّق بين dead language (لغة ميتة) وextinct language
        (لغة منقرضة)؛ فالمنقرضة لا يوجد لها أيّ متحدّث بأيّ صفة، وهي مفهوم
        أضيق من المطلوب هنا. إضافتها ستُحدث خلطاً دلالياً.

