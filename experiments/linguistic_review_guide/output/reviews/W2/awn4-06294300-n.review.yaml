# مراجعة المجموعة الترادفية — awn4-06294300-n (dead language)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (لغة بائدة، لغة ميتة) بدون تشكيل كامل"
      - "التعريف العربي مقتضب ولا يبيّن إمكان بقاء اللغة في استعمالات محدودة (طقسية أو علمية)"
    observations: >
      المفهوم يخصّ لغة لم يعد أحد يكتسبها لغةً أمًّا، لكنها قد تبقى مستعملة
      في سياقات محدودة كالطقوس الدينية أو البحث العلمي (كاللاتينية والسنسكريتية).
      التعبير العربي الطبيعي عن هذا المفهوم مركّب وصفيّ من نوع «لغة + صفة»،
      ولا يوجد لفظ مفرد مسكوك يؤدي المعنى. اللمّتان الموجودتان مناسبتان
      وشائعتان في الأدبيات اللسانية العربية.
  blind_candidates:
    - lemma: "لُغَةٌ مَيِّتَةٌ"
      generation_method: tarkib
      justification: >
        مركّب وصفيّ من «لغة» و«ميّتة» (من الجذر م و ت)، استعارة من الموت الحقيقي
        إلى زوال الاستعمال الحيّ. وهو أشيع المصطلحات اللسانية العربية لهذا المفهوم.
    - lemma: "لُغَةٌ بَائِدَةٌ"
      generation_method: tarkib
      justification: >
        مركّب وصفيّ من «لغة» و«بائدة» (من باد يبيد = هلك وانقرض).
        يُستعمل في الدراسات اللغوية بمعنى لغة زال استعمالها.
    - lemma: "لُغَةٌ مُنْدَثِرَةٌ"
      generation_method: tarkib
      justification: >
        مركّب وصفيّ من «لغة» و«مندثرة» (من اندثر = زال أثره).
        يُستعمل أحياناً في النصوص العربية، لكنه يوحي بزوال تامّ أكثر من مجرّد
        توقّف الاكتساب كلغة أمّ.
    - lemma: "لُغَةٌ مُنْقَرِضَةٌ"
      generation_method: tarkib
      justification: >
        مركّب وصفيّ من «لغة» و«منقرضة» (من انقرض = فني وتلاشى).
        يُستعمل في علم اللغة لكنه أقرب إلى مفهوم «extinct language» الذي يعني
        عدم وجود أي متحدّث، وهو أضيق من «dead language».

