# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف 'حالة أو وضع في وقت معيَّن' دائريٌّ: يستخدم 'حالة' وهي إحدى لمّات المجموعة ذاتها."
      - "المشترك الأعلى (awn4-00024900-n) يحمل لمّة 'حَالَة' المتطابقة مع لمّة في هذه المجموعة، مما يُثير تداخلاً تصنيفياً بين الأصل والفرع."
      - "عدد اللمّات محدود (اثنتان فقط) لمفهوم ثريّ في العربية."
      - "لا توجد أمثلة استعمالية على مستوى المجموعة أو المعاني."
    observations: >
      المجموعة تمثّل مفهوم «الحال/الوضع في وقت بعينه» (a state at a particular time) وهو
      مفهوم راسخ في التراث العربي. اللمّتان الموجودتان (حَالَة ووَضْع) أساسيّتان وموثّقتان،
      غير أن التعريف الحالي يدور على نفسه. أصل «حَالَة» من جذر حَوَلَ الدالّ على التحوّل
      والدوران (ابن فارس: «الحاء والواو واللام أصل واحد وهو تحرك في دور»)، مما يجعل
      الحالة تحمل دلالة اللحظة الآنية ضمن سياق التغيّر المستمر. أصل «وَضْع» من وَضَعَ
      الدالّ على الحطّ والخفض (ابن فارس)، وقد تطوّرت إلى معنى الهيئة التي يكون عليها
      الشيء في موضعه. كلتا اللمّتَيْن صالحة والفرق الدلالي قائم.
  blind_candidates:
    - lemma: "مَقَام"
      generation_method: majaz
      justification: "من المَقَام بمعنى الموضع/الموقف الذي يقفه المرء في لحظة بعينها — استعارة مكانية للدلالة على الحال الزماني، إذ يُقال 'في هذا المقام' بمعنى في هذه الحال."
    - lemma: "هَيْئَة"
      generation_method: majaz
      justification: "الهيئة أصلها صورة الشيء وشكله، وقد استُعيرت للدلالة على حال الشيء وكيفيته في لحظة معيّنة — القاموس المحيط: 'الهيئة: حال الشيء وكيفيته'."
    - lemma: "كَيْنُونَة"
      generation_method: ishtiqaq
      justification: "مصدر فَيْعُولَة من جذر كَوَنَ، يدل على حال الوجود في الزمن الراهن — قريب من 'state of being' في الإنجليزية. ابن فارس: 'كان الشيء يكون كوناً إذا وقع وحضر'."
    - lemma: "مَنْزِلَة"
      generation_method: majaz
      justification: "من النزول والمقام، استُعيرت للدلالة على المرتبة/الحال التي يكون عليها الشيء في وقت ما — يُقال 'منزلته عند الأمير' بمعنى وضعه وحاله."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "حَالَة"
      confirm:
        - text: "«واحِدَةُ أحوالِ الشَّيءِ»"
          source: "المعجم الكبير"
        - text: "«(الْحَالة) الْحَال»"
          source: "المعجم الوسيط (مجموعة المؤلفين)"
        - text: "«حالة» = state"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«حالة» = status"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
        - text: "«وضع مُحدّد فيزيائياً لنظامٍ ما، يتضمّن المعلومات اللازمة»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — تعريف مدخل حالة"
      expands:
        - text: "«الهَيْئَةُ: حالُ الشَّيءِ، وكَيْفِيَّتُه»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يربط المعجم بين 'حال' (ومنه حالة) وبين 'الكيفية'، مما يوسّع الحقل الدلالي ويؤكد أن الحالة هي الكيفية التي يكون عليها الشيء."

    - lemma: "وَضْع"
      confirm:
        - text: "«هَيْئَة تحصل للجسم بِسَبَب نِسْبَة بعض أَجْزَائِهِ، وَإِلَى الْأُمُور الخارجية»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«وضع» = situation"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«وضع» = status"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«(1) الوَضْع الشرعيّ: وَضْع المرء أو الشيء في نظر القانون (2) منزلة؛ مرتبة (3) حالة؛ وَضْع»"
          source: "المورد الحديث (2008) — مدخل status"
      expands:
        - text: "«كَون الشَّيْء مشارا إِلَيْهِ إِشَارَة حسية»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "تكشف هذه الدلالة أن الوضع يتجه نحو التحديد الحسيّ والمادي، مما يميّزه عن حالة الأعم."

    - lemma: "مَقَام"
      contradicts:
        - text: "«ما تحقق العبد بمنازلته من الآداب... والفرق بينه وبين الحال أن الأحوال مواهب، والمقامات مكاسب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المقام في الاصطلاح الصوفي يختلف جوهرياً عن الحال: المقام مكتسب ودائم، والحال موهوب وزائل — وهذا تعارض صريح مع طابع المجموعة اللحظي."
        - text: "«مقام» = denominator"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "المعنى الرياضي (مقام الكسر) بعيد كل البعد عن مفهوم المجموعة."
      expands:
        - text: "«المقام: ما يتَحَقَّق للْعَبد بمنازلته من الْأَدَب مِمَّا يتَوَصَّل إِلَيْهِ بِنَوْع تصرف»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "المقام يحمل دلالة الثبات والاستقرار، عكس الطابع الزماني اللحظي المطلوب في المجموعة."

    - lemma: "هَيْئَة"
      confirm:
        - text: "«الهَيْئَةُ: حالُ الشَّيءِ، وكَيْفِيَّتُه»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«صورة الشيء وشكله وحالته»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«الهيئة: الحالة الظاهرة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الهيئة تخصّ الحالة الظاهرة للعيان دون الباطنة، فهي أضيق دلالةً مما تتطلّبه المجموعة."
        - text: "«هيئة» = department"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "في العربية المعاصرة تغلّب على 'هيئة' معنى اللجنة/المؤسسة الإدارية، مما يوقع اشتراكاً لفظياً يحول دون توظيفها في هذه المجموعة."

    - lemma: "كَيْنُونَة"
      evidence_status: "no_material_found"

    - lemma: "مَنْزِلَة"
      confirm:
        - text: "«(الْمنزلَة) الدَّار والمكانة والمرتبة»"
          source: "المعجم الوسيط (مجموعة المؤلفين)"
      contradicts:
        - text: "«(1) الوَضْع الشرعيّ (2) منزلة؛ مرتبة. (3) حالة؛ وَضْع»"
          source: "المورد الحديث (2008) — مدخل status"
          conflict: "المورد الحديث يُدرج 'منزلة' ترجمةً لـ status لكن بمعنى المرتبة الاجتماعية الراسخة، لا الحال الآني الزائل الذي تمثّله المجموعة."
      expands:
        - text: "«لَهُ منزلَة عِنْد الْأَمِير مكانة وَهُوَ رفيع الْمنَازل الْمَرَاتِب»"
          source: "المعجم الوسيط (مجموعة المؤلفين)"
          addition: "المنزلة تنزع نحو دلالة التراتبية والمكانة الدائمة، لا الوصف الزماني للحالة العارضة."


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حَالَة"
      decision: confirmed
      decision_reason: >
        لمّة راسخة موثّقة توثيقاً واسعاً في المعجمَيْن الكلاسيكي والمعاصر، وهي الترجمة
        المعيارية لـ condition/state في المصطلحات العلمية والطبية والاجتماعية. التشكيل
        موجود وصحيح. الجذر حول مثبت من مصدر ocr (أوثق المصادر).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ الألفاظ وأوسعها دلالةً، تشمل الحالات الصحية والنفسية والفيزيائية
        والاجتماعية، وهي أقرب دلالةً إلى condition بمعناه الشامل في السياقات العامة
        والعلمية والطبية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالَة"

    - lemma: "وَضْع"
      decision: confirmed
      decision_reason: >
        لمّة موثّقة في المصادر الكلاسيكية والمعاصرة، وهي الترجمة المعيارية لـ status
        في السياقات الاجتماعية والقانونية والتقنية. التشكيل موجود وصحيح.
        الجذر وضع مثبت من مصدر lane.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يتجه نحو الكيفية الاجتماعية والقانونية والمادية للشيء أو الشخص (الوضع
        الاقتصادي، الوضع القانوني)، وهو أقرب دلالةً إلى status في السياق المؤسسي
        والرسمي. يحمل أحياناً دلالة الانخفاض أو الدونية (الوضيع) غائبة عن حالة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَضْع"

    - lemma: "مَقَام"
      source: stage1
      decision: removed
      decision_reason: >
        المقام يحمل في المعجم العربي دلالتَيْن راسختَيْن تتعارضان مع المجموعة:
        (أ) الاصطلاح الصوفي للمرتبة الروحية المكتسبة الدائمة — والمعاجم صريحة في
        الفرق بين الحال (لحظي موهوب) والمقام (دائم مكتسب). (ب) مقام الكسر في
        الرياضيات. لا يصلح لمّةً في مجموعة «الحال في وقت معيّن».
      evidence_assessment:
        case: contradicts_only

    - lemma: "هَيْئَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود الدلالة الكلاسيكية «حالُ الشَّيءِ وكيفيته» (القاموس المحيط)،
        تخصّص المعاجم الهيئةَ بـ«الحالة الظاهرة» دون الباطنة، مما يجعلها أضيق مما
        تتطلّبه المجموعة. كما أن الاستخدام المعاصر الغالب لـ«هيئة» بمعنى
        «لجنة/مؤسسة» يُفضي إلى اشتراك لفظي مُربك لا مسوّغ لقبوله.
      evidence_assessment:
        case: mixed

    - lemma: "كَيْنُونَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي يدعم استخدام «كينونة» بمعنى «حالة في وقت معيّن».
        اللفظ فلسفي مجرّد يدل على الوجود الكلّي لا على حالة بعينها في وقت محدد.
        غير مسكوك في هذا الاستعمال.
      evidence_assessment:
        case: no_material

    - lemma: "مَنْزِلَة"
      source: stage1
      decision: removed
      decision_reason: >
        المنزلة تخصّ المكانة والمرتبة الاجتماعية الثابتة لا الحال الآني الزائل
        للشيء في وقت معيّن. الدلالة أخصّ وتنزع نحو التراتبية الاجتماعية الدائمة،
        وهو ما يجعلها أقرب إلى المرتبة والمكانة منها إلى الحالة المراد توصيفها.
      evidence_assessment:
        case: mixed


