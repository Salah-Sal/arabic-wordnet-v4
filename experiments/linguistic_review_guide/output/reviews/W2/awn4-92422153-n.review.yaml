# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «الطابع الصربي» تعبيرٌ مركّب (وصفي) يفشل اختبار السكّ؛ إذ يمكن إحلال «السمة» أو «الخاصية» أو «الطبيعة» محلّ «الطابع» وتبقى الجملة وصفية صالحة، مما يدلّ على أنه عبارة حرّة لا وحدة معجمية مثبّتة."
      - "المجموعة تفتقر إلى مرادفات: تضمّ لمّةً واحدةً فقط مع غياب أيّ تعدّد معجمي."
      - "التعريف الحالي «حالة أو جودة كون الشيء صربياً» صياغة ترجمية حرفية، ولا تتبع أسلوب المعجم الوسيط."
      - "القيمة ILI = null؛ المجموعة غير مربوطة بالشبكة العالمية."
    observations: >
      تنتمي هذه المجموعة إلى صنف «الخاصيّة الجوهرية» وتمثّل المفهوم المجرّد لكون الشيء صِرْبيَّ النسبة أو الانتماء.
      في المعجمية العربية، تُعبَّر عن مثل هذه الخصائص الجنسية المجرّدة بالمصدر الصناعي على وزن (فَعْلِيَّة) أو (فَعَّالِيَّة)،
      غير أن «الصِّرْبِيَّة» مستأثَرةٌ بمعنى اللغة الصربية في المعاجم المعاصرة كالمعجم الكبير والمورد الحديث.
      ومن ثَمَّ يكون التعبير المركّب الوصفي المتاح هو الملاذ الوحيد عملياً في الحالة الراهنة.

  blind_candidates:
    - lemma: "الصِّرْبِيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي القياسي من صِرْبِيّ (اسم منسوب + ياء مشدّدة + تاء تأنيث)،
        يوازي نماذج العربية كالعروبة والفارسية والرومانية. الوزن فَعْلِيَّة للدلالة على
        طبيعة الانتساب المجرّدة.

    - lemma: "الهُوِيَّةُ الصِّرْبِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «هُوِيَّة» (خاصية وجود وانتماء) و«صِرْبِيَّة» (نسبة)؛
        يُعبّر عن مجمل السمات المميّزة لكل ما هو صربي. أقلّ تجريداً من المصدر الصناعي.

    - lemma: "الصِّرْبَانِيَّة"
      generation_method: ishtiqaq
      justification: >
        وزن فَعْلانِيَّة الذي يدلّ في العربية على الطبيعة الجوهرية العميقة،
        قياساً على ربّانيّة وإنسانيّة وروحانيّة. يُشكّل تعبيراً أكثر تجريداً من المصدر الصناعي
        المبسَّط.

    - lemma: "الطَّبْعُ الصِّرْبِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «طَبْع» (السجية والخُلُق الراسخ، جذر ط-ب-ع بمعنى الختم والإتمام)
        و«صِرْبِيّ» (منسوب إلى الصرب). «الطبع» في كلام العرب يُعبّر عن الخاصية الملازمة
        للشيء، وهو أكثر دقةً من «الطابع» في الإيحاء بالديمومة والأصالة.


