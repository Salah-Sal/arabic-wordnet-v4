    - note: "Maqayis صرب: «الصَّادُ وَالرَّاءُ وَالْبَاءُ أُصَيْلٌ صَحِيحٌ يَدُلُّ عَلَى مِثْلِ مَا دَلَّ عَلَيْهِ الْبَابُ الَّذِي قَبْلَهُ» — بمعنى اللبن الحامض والملاسة؛ وليس جذر اسم العَلَم الصِّرب."


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "الطابع الصربي"
      decision: confirmed
      decision_reason: >
        على الرغم من أن «الطابع الصربي» يفشل اختبار السكّ (يمكن إبدال «الطابع» بـ«السمة» أو
        «الخاصية» مع بقاء التعبير وصفياً صالحاً)، فإنه يُبقى مؤقتاً لغياب بديل معجمي ثابت:
        «الصِّرْبِيَّة» مستأثَرة بمعنى اللغة الصربية في المعجم الكبير والمورد الحديث،
        ولا توجد كلمة عربية مفردة مسكوكة للدلالة على «جودة كون الشيء صربياً».
        قرار الإبقاء مشروط بإضافة تشكيل كامل وتوثيق الطابع الوصفي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      morphological_fit: >
        «الطابع» اسم فاعل من طبع، يُستخدم مجازاً للسمة المميزة. «الصربي» نسبة إلى صَرِبيا.
        المركب من نوع الوصفي (موصوف + صفة)؛ مقبول بنيوياً.
      loan_check:
        lexical_borrowing: "«صِرْبي» تعريب وصفي من الاسم الأعجمي Srpski، مقبول قياساً."
        calque_check: "المركّب يُحاكي النمط الأوروبي (Serbianness) بقالب عربي؛ الاقتراض المفهومي واضح."
      term_quality_gates:
        ittiraad: "المجال الإثني–الوطني يستخدم هذا النمط (الطابع الفرنسي، الطابع العربي)."
        yusr_tadawul: "مفهومٌ للمتخصصين في الجغرافيا السياسية واللسانيات."
        mulaama: "مناسب للسياق الأكاديمي والدبلوماسي."
        ithar_turathi: "لا يوجد تراثي — المفهوم حديث."
        ithar_arabi: "«الطابع» عربي أصيل."
        ishtiqaqiyya: "مقبول اشتقاقياً رغم التركيب."
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ لا مقارنة ضرورية. «الطابع» يُبرز السمة الظاهرة
        والمميِّزة (من الختم)، في مقابل «الطبع» الذي يُبرز الجوهر الراسخ، و«الخاصية» التي
        تُبرز الوصف المنطقي. هذا الفارق الدقيق يُميّز «الطابع الصربي» عن «الطبع الصربي».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطَّابِعُ الصِّرْبِيُّ"

    - lemma: "الصِّرْبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الصِّرْبِيَّة» مُستأثَرةٌ في المعاجم المعاصرة (المعجم الكبير، المورد الحديث) بمعنى
        اللغة الصربية. استخدامها لمعنى «جودة كون الشيء صربياً» يُنتج اشتراكاً لفظياً
        مُضِرّاً يُلبّس بين المفهوم اللغوي والخاصية الجوهرية. الأدلة تُناقض هذا التوظيف.

    - lemma: "الهُوِيَّةُ الصِّرْبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «الهوية» أعمّ دلالةً من «الخاصية الجوهرية»؛ إذ تشمل الانتماء والذاتية والشخصية
        الجمعية، في حين أن المجموعة تمثّل صفة منطقية مجرّدة (quality/property). كما أن
        «الهوية الصربية» غير موثّقة كوحدة معجمية مثبّتة.

    - lemma: "الصِّرْبَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الوزن فَعْلانِيَّة غير مستخدم في العربية الحديثة للنسبة القومية. لا شاهد معجمي
        ولا استعمال موثَّق. الصياغة مُتكلَّفة ولا تُفضي إلى فهم مباشر عند المتلقي.

    - lemma: "الطَّبْعُ الصِّرْبِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        يُعاني من المشكلة ذاتها التي تُعاني منها اللمّة الأصلية (تعبير وصفي لا وحدة مثبّتة)،
        دون أن يُقدّم ميزةً إضافية تستحق الإضافة. «الطبع» يحمل ظلالاً نفسية (السجية الفردية)
        أكثر مما يحمل دلالة الخاصية الجوهرية الجماعية.


