step0_evidence:
  per_lemma:
    - lemma: "متأصل"
      contradicts:
        - text: "«مُتَأَصِّل: هو الذي كفر بعد الإيمان» — التعريفات الفقهيّة للبركتي"
          source: "التعريفات الفقهية"
          conflict: "المعنى يتعلق بالثبات والأصالة أو الاستمرارية في الكفر (تأصل الشيء)، وليس العودة للبدائية."
        - text: "«متأصّل: راسخ في أصله» — المعجم الوسيط"
          source: "المعجم الوسيط"
          conflict: "المعنى يدل على الرسوخ والثبات، بينما المفهوم المطلوب هو العودة لصفات سلفية قديمة (نكوص/ارتداد)."
      evidence_status: "no_material_found"
    - lemma: "مرتد"
      confirm:
        - text: "«atavism؛ ثمرة الارتداد. وبخاصة: مُتَعضٍّ مُرْتدّ إلى ضربِهِ السَّلفي» — المورد الحديث"
          source: "المورد الحديث"
      contradicts:
        - text: "«المرتدّ: هو الذي يكفر بعد الإيمان» — كشّاف اصطلاحات الفنون والعلوم"
          source: "كشاف اصطلاحات الفنون"
          conflict: "المعنى الديني للاستدبار عن الإسلام يختلف عن المفهوم البيولوجي."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُتأسِّل"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(تأسل) إيَّاه: أشبهه وتخلَّق بأخلاقه» — المعجم الوسيط"
      justification: "الكلمة مشتقة من فعل (تأسل) الذي يعني المشابهة، وهو المصطلح المستخدم في الوراثة (Genetics) للتعبير عن ظاهرة ظهور صفات السلف (Atavism)، والفاعل منه هو (مُتأسِّل) لوصف الكائن."
  knowledge_candidates:
    - lemma: "مُرتد"
      justification: "مستخدم في المعاجم الحديثة (المورد) لوصف الكائن الذي تظهر فيه خصائص بدائية نتيجة ارتداد وراثي."
  generation_notes: "يُلاحظ خلط في النسخة الحالية بين (متأصل) بالصاد و(متأسل) بالسين؛ فالأولى تعني الرسوخ والثانية تعني المشابهة والارتداد السلفي."

