stage3_analysis:
  per_lemma:
    - lemma: "مُحَاكِي الْقُدَمَاء"
      decision: confirmed
      decision_reason: "تركيب إضافي دقيق وشائع للتعبير عن المفهوم (archaist) في السياقين الأدبي والفني، ولا يوجد بديل مفرد يفي بالمعنى دون لبس."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَاكِي الْقُدَمَاء"
    - lemma: "مُتَمَسْلِف"
      source: stage1
      decision: removed
      decision_reason: "مصطلح يغلب عليه الطابع الديني ولا يعبر عن المحاكاة الأسلوبية أو الفنية للقدماء."
    - lemma: "مُحْيِي التُّرَاثِ"
      source: stage1
      decision: removed
      decision_reason: "يركز على إحياء ونشر الموروث وليس بالضرورة تقليد أسلوب القدماء."
    - lemma: "قَدَامَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير غير مستقر معجمياً وليس شائعاً بما يكفي لاعتماده."

stage4_content:
  definition:
    current: "شخص يقلد الأساليب القديمة"
    assessment:
      decision: retain
      reason: "التعريف دقيق وموجز ويؤدي المعنى المراد بوضوح، ويتناسب مع المدلول الفني والأدبي للمفهوم الإنجليزي."
    actions: []
  examples:
    per_lemma:
      - lemma: "مُحَاكِي الْقُدَمَاء"
        examples:
          - text: "عُرِفَ الشاعرُ في قصائده بأنه مُحَاكِي الْقُدَمَاء في ألفاظه وصوره."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-09823653-n", text: "عُرِفَ الشاعرُ في قصائده بأنه مُحَاكِي الْقُدَمَاء في ألفاظه وصوره."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "عُرِفَ الشاعرُ في قصائده بأنه مُحَاكِي الْقُدَمَاء في ألفاظه وصوره."}

