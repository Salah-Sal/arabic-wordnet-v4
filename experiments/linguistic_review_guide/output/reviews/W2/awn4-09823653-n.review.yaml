stage1_review:
  assessment:
    concerns:
      - "المفهوم الإنجليزي (archaist) لا يقابله في العربية مصطلح مفرد شائع ذو دلالة حصرية مطابقة، بل يُعبَّر عنه عادة بمركب إضافي مثل (محاكي القدماء) أو (مقلد القدماء)."
      - "اللمة الموجودة عبارة عن تعبير وصفي مسكوك وليست كلمة مفردة."
    observations: "التعريف الحالي دقيق وواضح ويقابل المفهوم الإنجليزي بشكل ممتاز. الأنسب هو الإبقاء على المركب الإضافي الحالي لعدم وجود مصطلح مفرد يعبر عن نفس الدلالة الفنية/اللغوية بوضوح كافٍ."
  blind_candidates:
    - lemma: "مُحَاكِي الْقُدَمَاء"
      generation_method: tarkib
      justification: "تركيب إضافي يصف مباشرة من يقلد أساليب من سبقه من القدماء."
    - lemma: "مُتَمَسْلِف"
      generation_method: ishtiqaq
      justification: "اشتقاق من السلف للإشارة إلى من يتبع طريقهم، وإن كان يغلب عليه الطابع الديني."
    - lemma: "مُحْيِي التُّرَاثِ"
      generation_method: tarkib
      justification: "تركيب إضافي يشير لمن يعيد الأساليب والأعمال القديمة للحياة."
    - lemma: "قَدَامَوِيّ"
      generation_method: ishtiqaq
      justification: "مصطلح ينسب إلى القدماء للدلالة على الاتجاه نحو القديم والميل إليه."

