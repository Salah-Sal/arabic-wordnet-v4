# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'قابلية الكشف' خالية من التشكيل الكامل"
      - "تباين دلالي داخلي: التعريف يوظّف 'الملاحظة' (observation) بينما اللمّة تستخدم 'الكشف' (detection) — وهما مفهومان متقاربان لكن ليسا مترادفَيْن تماماً في المصطلحية العلمية"
      - "أسلوب التعريف 'حالة كون الشيء قابلاً...' ثقيل وغير أنيق معجمياً، ولا يصوغ الجنس القريب والفصل النوعي بوضوح"
      - "غياب المعرّف الدولي (ili) يُصعّب ربط المفهوم بالشبكات المعرفية العالمية"
      - "المجموعة تفتقر إلى مصطلح أحادي مسكوك، ولا تحوي إلا تركيباً إضافياً واحداً"
    observations: >
      المجموعة تمثّل مفهوماً علمياً دقيقاً تتشابك فيه دلالتان: الاكتشافية
      (detectability) وهي قابلية الشيء لأن يُكتشَف بأدوات القياس، والملاحظية
      (observability) وهي قابليته لأن يُرصَد ويُتابَع؛ وللمفهوم حضور موثَّق في
      معاجم الفيزياء وهندسة الأنظمة ونظرية التحكم. الجذر الأبوي (خاصية جوهرية)
      صحيح ومنسجم. قابلية الكشف ليست خاصية ذاتية للشيء فحسب بل هي علاقة بين
      الشيء وأدوات الرصد، وهذا الفارق الجوهري يستدعي تعريفاً أدق.

  blind_candidates:
    - lemma: "مَرصُودِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر (ر ص د) على وزن مَفعُولِيَّة (مثل مَقبُولِيَّة، مَسمُوعِيَّة)
        الدالّ على خاصية كون الشيء موصوفاً بالمفعول. الرصد في اللغة: التهيّؤ
        لمراقبة شيء على مسلكه. فالمرصودية: خاصية كون الشيء قابلاً للترقُّب
        والرصد من قِبَل مراقب ما.
    - lemma: "انكِشَافِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من المصدر (انكشاف) على الوزن الصناعي (فِعَالِيَّة → انكشافية)،
        يدلّ على خاصية القابلية للانكشاف. الكشف لغةً: سَرو الشيء عن الشيء
        كالثوب عن البدن. فالانكشافية: خاصية ما يُمكن أن ينكشف ويظهر للمراقب.
    - lemma: "ظُهُورِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من المصدر (ظهور) بإلحاق ياء النسبة المشددة والتاء، على نمط
        المصدر الصناعي. الظهور لغةً: البروز والانكشاف. فالظهورية: خاصية ما
        يبرز ويظهر للعيان، مع إيحاء بالوضوح والجلاء.
    - lemma: "مَدرُوكِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر (د ر ك) على وزن مَفعُولِيَّة، من أدرك يُدرك. الإدراك:
        لحوق الشيء بالشيء ووصوله إليه. فالمدروكية: خاصية كون الشيء مما يُدرَك
        ويُبلَغ بالحواس أو الأدوات، أي قابليته للوصول إليه معرفياً أو حسياً.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
# استعلامات منفَّذة:
#   ١. مطابقة الدفعة: جميع اللمّات والمرشحات (بصيغتَي ال- وبدونها)
#   ٢. جسر إنجليزي: detectability / observability / perceptibility
#   ٣. بحث FTS عربي: عبارات قابل للكشف / قابل للملاحظة
#   ٤. مقاييس اللغة: جذور قبل، كشف، لحظ، رصد، ظهر، عين، درك
stage2_evidence:
  per_lemma:

    - lemma: "قابلية الكشف"
      confirm:
        - text: "«أدنى نشاط قابل للكشف: النشاط الإشعاعي الذي، إذا كان موجودا في عينة، وينتج نسبة العد التي يتم كشفها وقياسها (أي التي تعتبر فوق الخلفية) مع مستوى معين من الثقة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة — منظمة ALECSO (ArabTerm)"
        - text: "«متعذّرٌ اكتشافه؛ غير قابل للاكتشاف»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«القابلية للمراقبة» [مقابل observability في الكهرباء والأنظمة]"
          source: "موسوعة الكهرباء IEC 60050 — Electropedia (ArabTerm)"
          addition: "تُثبت المعاجم المتخصصة استخدام صيغة 'القابلية لـ...' للتعبير عن observability، مما يؤيد قابلية الكشف كتركيب إضافي سائد، غير أن موسوعة الكهرباء آثرت 'المراقبة' على 'الكشف'"
        - text: "«قابلية مراقبة البيانات: القدرة على مراقبة صحة البيانات وفهمها والحفاظ عليها؛ لضمان دقتها واتساقها وموثوقيتها»"
          source: "معجم البيانات والذكاء الاصطناعي 2024 (ArabTerm)"
          addition: "يكشف هذا الاستخدام عن نمط مركّب 'قابلية + مصدر' شائع في المصطلحية التقنية العربية المعاصرة"

    - lemma: "مَرصُودِيَّة"
      evidence_status: "no_material_found"

    - lemma: "انكِشَافِيَّة"
      evidence_status: "no_material_found"

    - lemma: "ظُهُورِيَّة"
      contradicts:
        - text: "«ظُهُورِيّة: من (ظ ه ر) مؤنث ظهوري نسبة إلى ظهور»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
          conflict: "المدخل يُسجّل 'ظهورية' بوصفها اسمَ علم أنثوي منسوباً إلى ظهور، وليس مصطلحاً يدلّ على الخاصية المقصودة، مما يعني أن هذا اللفظ مستعمَل في غير هذه الدلالة"

    - lemma: "مَدرُوكِيَّة"
      confirm:
        - text: "«مَدْروكِيَّة» [مقابل perceptibility في الطب]"
          source: "المعجم الطبي الموحد 2009 (ArabTerm)"
      expands:
        - text: "«المُدْرَكيّة الحِسّية: قابليّة الشيء لأن يُدْرَك بالحواسّ»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت هذا المدخل أن الوزن مَفعُولِيَّة / مُفعَلِيَّة من جذر (درك) قد توطَّن في المعجمية الطبية للتعبير عن القابلية الحسية (perceptibility)، وهو قريب من المفهوم المقصود لكنه أخص منه"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "قابلية الكشف"
      decision: confirmed
      decision_reason: >
        المصطلح ثابت الاستخدام في المعجمية التقنية العربية — وُثِّق في معجم المناخ
        والبيئة (ALECSO) وتبيّن من الجسر الإنجليزي أن نمط 'قابلية + مصدر' متكرر
        في موسوعة الكهرباء ومعجم الذكاء الاصطناعي. المركّب الإضافي يمرّ اختبار
        التثبيت المعجمي: إبدال 'الكشف' بمرادفات كـ'الرصد' أو 'المراقبة' ينتج
        مصطلحات أخرى ذات دلالات تقنية مختلفة (observability ≠ detectability).
        اللمّة تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة. تعكس الجانب التشخيصي للمفهوم: هل يمكن الكشف
        عن وجود الشيء أصلاً؟ وتتمايز عن 'قابلية الملاحظة' بتركيزها على طور
        الاكتشاف الأول، بينما 'قابلية المراقبة' تعني إمكانية تتبّع حالة الشيء
        المعروف وجوده.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ الكَشْفِ"

    - lemma: "مَرصُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة في قاعدة البيانات على توظيف هذا المصطلح. فضلاً عن ذلك، الجذر
        (ر ص د) ينصبّ في المعجمية التقنية على المراقبة المنتظمة المستمرة
        (monitoring) لا على الاكتشاف الأول (detection)؛ مما يُبعده عن الدلالة
        المقصودة. ويوحي الوزن مَفعُولِيَّة هنا بخاصية شيء تم رصده فعلاً، لا بقابليته
        للرصد بالإمكان.

    - lemma: "انكِشَافِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. كذلك تحمل 'الانكشافية' إيحاءً بعملية الانكشاف (العملية
        الديناميكية) لا بخاصية ثابتة في الشيء. ويمكن إبدال 'الانكشاف' بـ'الظهور'
        أو 'الانجلاء' دون تغيير المعنى الوصفي، مما يدلّ على أنها ليست مصطلحاً
        مسكوكاً.

    - lemma: "ظُهُورِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الوجود الوحيد في قاعدة البيانات (موسوعة السلطان قابوس للأسماء) يُسجّلها
        اسمَ عَلَم أنثوياً، وهو استخدام سابق يتعارض مع توظيفها مصطلحاً.
        زيادةً على ذلك، دخلت 'الظهورية' في الخطاب الفلسفي المعاصر مرادفةً
        لـ'الظواهراتية' (phenomenology)، وهو اشتراك لفظي يُفسد الاستخدام.

    - lemma: "مَدرُوكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود 'مدروكية' في المعجم الطبي الموحد بمعنى perceptibility، يختلف
        هذا المفهوم عن المقصود هنا: المدروكية تعني الإدراك الحسي الفردي (ability
        to be sensed), بينما 'قابلية الكشف' تشمل الرصد الآلي الذي يتخطى الحواس.
        ومع ذلك يُوصى بتوثيق هذا الجذر كمصطلح منفصل مرتبط.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
