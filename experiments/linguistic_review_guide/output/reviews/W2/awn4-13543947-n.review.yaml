# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
# المدخلات: synset_info_masked.yaml (لا تشكيل ولا لمّات)
# التعريف: فشل حدوث التطور الطبيعي
# ────────────────────────────────────────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عدم التطور» مركبٌ اسمي إضافي يفتقر إلى التشكيل الكامل"
      - "التعريف الحالي «فشل حدوث التطور الطبيعي» ترجمةٌ حرفية من الإنجليزية «failure of normal development to occur»، ولا يتبع أسلوب المعجم الوسيط (جنس قريب + فصل نوعي)"
      - "الاقتصار على لمّة واحدة لمفهوم بيولوجي متخصص قد لا يكفي؛ المصطلح الطبي الموحد قد يوفر بدائل أدق"
    observations: >-
      المجموعة تمثّل مفهوماً بيولوجياً يصف انعدام حدوث التطور الطبيعي في الكائن الحي،
      ويقع في مجال الأحياء التطورية أو علم الأجنّة. اللمّة الموجودة «عدم التطور» مقبولةٌ
      تركيبياً إذ إن «عدم» + مصدر صنيعةٌ معيارية في العربية المعاصرة لتركيب النفي الاسمي،
      غير أنها تفتقر إلى التشكيل وتحتمل الغموض الدلالي خارج السياق التخصصي. الأعلى
      الدلالي (الـhypernym) هو «عملية تحدث في الكائنات الحية» مما يُوجِّه التعريفَ
      نحو صياغة مصطلحية تُصنّف المفهوم ضمن العمليات البيولوجية المعدومة أو المتوقفة.
  blind_candidates:
    - lemma: "قُصُورٌ نَمَائِيٌّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من «قصور» (إخفاق/عجز) و«نمائي» (نسبة إلى النماء/التطور)؛
        يُعبِّر عن إخفاق العملية النمائية، على غرار مصطلحات كـ«قصور كلوي»
        و«قصور قلبي». الوزن الصرفي فُعُول يُلائم الأسماء الدالة على حالات
        العجز في المصطلحية الطبية.
    - lemma: "تَعَطُّلُ النُّشُوء"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من «تعطّل» (مصدر تَفَعُّل من جذر عطل بمعنى الانقطاع والإيقاف)
        و«النشوء» (الظهور والنمو الأوّلي من جذر نشأ). يُعبِّر عن انقطاع مسيرة
        النشوء الطبيعي، وصيغة تَفَعُّل تحمل دلالة التدرج في العربية.
    - lemma: "الجُمُودُ التَّطَوُّرِيُّ"
      generation_method: majaz
      justification: >-
        مجاز مرسل: «الجمود» يعني في أصله توقف السائل عن الجريان وبقاءه ثابتاً،
        يُستعار هنا لوصف تجمّد التطور البيولوجي وعدم انطلاقه. المُوسِم الدلالي
        (التطوري) يُحدد المجال ويُزيل اللبس.
    - lemma: "وُقُوفُ النَّمَاء"
      generation_method: ishtiqaq
      justification: >-
        مصدر «وقوف» من جذر وقف على وزن فُعُول يدل على التمكّث والثبات،
        مُضاف إلى «النماء» (الزيادة والارتفاع من جذر نما)؛ يصف توقف مسيرة
        النمو الطبيعي وثبوته دون استئناف. الجذران فصيحان عريقان.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة (٦ استعلامات في الميزانية):
#   ١. Batch headword: عدم التطور، قصور نمائي، تعطل النشوء، الجمود التطوري،
#      وقوف النماء، تطور، التطور، نشوء، نماء، قصور، جمود، تعطل + صيغ ال-
#   ٢. English bridge: nondevelopment | non-development | developmental failure
#      | arrested development | developmental arrest
#   ٣. Arabic FTS: "عدم التطور" OR "قصور نمائي" OR "توقف النمو" OR
#      "توقف النماء" OR "فشل التطور" OR "تعطل النشوء"
#   ٤. Candidate validation batch (+ عدم التنمية، توقف النماء)
#   ٥. Maqayis (dict=151): طور، عدم، قصر، وقف
#   ٦. Maqayis (dict=151): نما (نمي)
# ────────────────────────────────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "عدم التطور"
      evidence_status: "no_material_found"
      # المكوّن «التطور» موجود في المعجم الوسيط: «التغيّر التدريجيّ الذي يحدث
      # في بنية الكائنات الحيّة وسلوكها» (entry_id: 17753)، لكن المركب «عدم
      # التطور» لم يُعثر عليه كوحدة معجمية مسجّلة في أي مصدر.

    - lemma: "قُصُورٌ نَمَائِيٌّ"
      contradicts:
        - text: "«القُصور: العجزُ»"
          source: "التعريفات الفقهية للبركتي (hawramani)"
          conflict: "دلالة «القصور» تنصبُّ على العجز الكفائي العام لا على انعدام التطور البيولوجي الكلي"
        - text: "«القُصورُ: الْخُلُو عَن الْمعَانِي الباعثة على تحري الْخيرَاتِ والفضائلِ، وَعدم التَّمَكُّن من أَسبَابهَا»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani)"
          conflict: "القصور في هذا السياق أخلاقي/نفسي لا بيولوجي"
        - text: "«القُصور» — inertia (مجال النقل والبنية التحتية)"
          source: "المعجم الموحد لمصطلحات النقل (2010) — arabterm"
          conflict: "المصطلح التقني المعتمد لـ«القصور» في المعاجم الموحدة هو قصور العطالة الفيزيائية، لا فشل التطور"

    - lemma: "تَعَطُّلُ النُّشُوء"
      evidence_status: "no_material_found"

    - lemma: "الجُمُودُ التَّطَوُّرِيُّ"
      contradicts:
        - text: "«الجمود: هيئة حاصلة للنفس بها يقتصر عن استيفاء ما ينبغي وما لا ينبغي»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
          conflict: "الجمود في التراث مصطلح نفسي/أخلاقي للتوقف الإرادي لا لانعدام التطور البيولوجي"
        - text: "«الجمود: علة إذا عرضت للإنسان بقي على الحالة التي أدركته عليها إما جالساً أو قائماً — Rigidity, immobility, inertia, catatonia»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي (hawramani)"
          conflict: "«الجمود» مصطلح طبي موثّق للشلل الكاتاتوني، توظيفه في التطور البيولوجي يُوقع في لبس اصطلاحي"

    - lemma: "وُقُوفُ النَّمَاء"
      evidence_status: "no_material_found"

    - lemma: "تَوَقُّفُ النَّمَاء"
      confirm:
        - text: "«تَوَقُّفُ النَّمَاء» — developmental arrest"
          source: "المعجم الطبي الموحد (2009) — arabterm، entry_id: 544452"
      expands:
        - text: "«نَمَاءٌ مُتَوَقِّف» — arrested development"
          source: "المعجم الطبي الموحد (2009) — arabterm، entry_id: 566711"
          addition: "صيغة وصفية مرادفة تُوثِّق أن المصطلح الطبي الموحد يعترف بصياغتين لتأطير توقف التطور"
        - text: "«خَطُّ تَوَقُّفِ النُّمُو» — growth arrest line"
          source: "المعجم الطبي الموحد (2009) — arabterm، entry_id: 602463"
          addition: "يُثبت أن صيغة «توقف النمو/النماء» راسخة في المصطلحية الطبية الموحدة لمنظومة مفاهيم وقف النمو"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "عدم التطور"
      decision: confirmed
      decision_reason: >-
        المركب الإضافي «عدم التطور» مقبول لغوياً ومستعمَل في الأدبيات العلمية
        العربية المعاصرة للتعبير عن غياب عملية التطور. اجتاز فحص الاشتقاقية
        (جذران فصيحان: عدم، طور) وفحص الاطّراد (يطّرد مع: عدم التوافق، عدم
        الاتزان...). يُخفق في اختبار السكّ جزئياً (يمكن إبدال «عدم» بـ«انعدام»
        أو «غياب») لكن هذا لا يُسقطه لأن التركيبات المنفية بـ«عدم» أصبحت
        صنيعة معيارية استقرّت في العربية المعاصرة. يحتاج فقط إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُعبِّر عن الغياب الكلي لعملية التطور من منظور مفهومي سلبي (الانعدام
        من الأساس)، دون إشارة إلى نقطة توقف محددة في مسار التطور.
        أعمُّ دلالةً من «تَوَقُّفُ النَّمَاء».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ التَّطَوُّرِ"

    - lemma: "تَوَقُّفُ النَّمَاء"
      decision: confirmed
      decision_reason: >-
        مصطلح طبي موحد موثَّق في المعجم الطبي الموحد (2009) بمعنى
        «developmental arrest»، وهو مترادف مكمِّل لـ«nondevelopment» في
        السياق الطبي البيولوجي. الجذران (وقف، نما) فصيحان من أصول ثلاثية
        راسخة في مقاييس اللغة. التركيب الإضافي سليم. اجتاز اختبار السكّ:
        لا يمكن إبدال «توقف» بـ«انقطاع» أو «وقوف» مع الحفاظ على نفس
        الدلالة المصطلحية المُثبَّتة في المعجم الطبي. مكتشَف من أدلة المرحلة ٢.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُشير تحديداً إلى انقطاع مسيرة النماء بعد انطلاقها (توقف ما كان
        يسير)، وهو أخصُّ طبياً من «عدم التطور» الذي يصف الغياب الكلي
        للعملية من الأساس.
      actions:
        - command: create_entry
          params:
            lemma: "تَوَقُّفُ النَّمَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "قُصُورٌ نَمَائِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        «القصور» في المعاجم يحمل دلالة العجز والتقصير الكفائي لا انعدام
        التطور الكلي؛ ثلاثة أدلة معجمية تُعارض توظيفه بهذا المعنى.
        يُخفق في اختبار السكّ: «ضعف نمائي»، «تأخر نمائي»، «خلل نمائي»
        جميعها تصلح بديلاً وصفياً، مما يدل على أن التركيب وصف حرّ لا
        مصطلح مسكوك.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَعَطُّلُ النُّشُوء"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على «تعطل النشوء» مصطلحاً موثقاً في أي معجم. يُخفق في
        اختبار التثبيت المعجمي: «نشوء» قابل للإبدال بـ«نمو» أو «تطور» مع
        بقاء الدلالة الوصفية، مما يدل على أنه عبارة حرة لا وحدة معجمية
        مسكوكة.
      evidence_assessment:
        case: no_material

    - lemma: "الجُمُودُ التَّطَوُّرِيُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        الأدلة المعجمية تُناقض هذا الاستخدام بصراحة: «الجمود» مصطلح طبي/نفسي
        راسخ لحالة الشلل الكاتاتوني والتوقف الجسدي. توظيفه في التطور البيولوجي
        يُوقع في لبس اصطلاحي بين مفهومَيْن متباينَيْن، ولا تدعمه أي سابقة
        في المصطلحية العلمية العربية الموحدة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "وُقُوفُ النَّمَاء"
      source: stage1
      decision: removed
      decision_reason: >-
        قاعدة البيانات المعجمية تُوثِّق «تَوَقُّفُ النَّمَاء» (بصيغة تَفَعُّل
        المُستمرة) لا «وُقُوف» (المصدر الجامد). صيغة تَفَعُّل أدق دلالةً
        لأنها تحمل معنى التدرج والاستمرارية بخلاف المصدر الجامد الساكن.
        وبما أن المصطلح الصحيح موثَّق ومُعتمَد، يُستبدل بـ«تَوَقُّفُ النَّمَاء».
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فشل حدوث التطور الطبيعي"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة حرفية من الإنجليزية «failure of normal development
        to occur»؛ يفتقر إلى الجنس القريب الصريح الذي يربطه بالأعلى الدلالي
        (عملية بيولوجية). كلمة «فشل» غير مألوفة في التعريفات المعجمية العربية
        المعيارية، والجملة الفعلية «حدوث» تُضعف الصياغة المصطلحية.
    authored:
      - type: terminological
        text: "انعدامُ حدوثِ التطوُّرِ البيولوجيِّ الطبيعيِّ في الكائنِ الحيِّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          حالةٌ تنعدم فيها العمليةُ البيولوجيةُ الطبيعيةُ للنموِّ والتطوُّرِ في
          الكائنِ الحيِّ، فلا تسلك مراحلُ التطوُّرِ مسارَها المعتادَ ولا تكتملُ
          وفقَ البرنامجِ الوراثيِّ الطبيعيِّ
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "انعدامُ حدوثِ التطوُّرِ البيولوجيِّ الطبيعيِّ في الكائنِ الحيِّ"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "حالةٌ تنعدم فيها العمليةُ البيولوجيةُ الطبيعيةُ للنموِّ والتطوُّرِ في الكائنِ الحيِّ، فلا تسلك مراحلُ التطوُّرِ مسارَها المعتادَ ولا تكتملُ وفقَ البرنامجِ الوراثيِّ الطبيعيِّ"

  examples:
    per_lemma:
      - lemma: "عَدَمُ التَّطَوُّرِ"
        examples:
          - text: >-
              أفادَتِ التقاريرُ الطبيةُ بأن الجنينَ يعاني من عدمِ التطوُّرِ الكاملِ
              للجهازِ العصبيِّ المركزيِّ، مما يستدعي متابعةً دقيقةً طوالَ مدةِ الحمل.
            type: usage
      - lemma: "تَوَقُّفُ النَّمَاء"
        examples:
          - text: >-
              كشفَتِ الدراسةُ النسيجيةُ عن توقُّفِ النماءِ في المرحلةِ الجنينيةِ
              المبكِّرةِ عند الأسبوعِ الثامنِ، مما أدَّى إلى تشوُّهاتٍ خَلقيَّةٍ
              في الأطرافِ العلويَّة.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أفادَتِ التقاريرُ الطبيةُ بأن الجنينَ يعاني من عدمِ التطوُّرِ الكاملِ للجهازِ العصبيِّ المركزيِّ، مما يستدعي متابعةً دقيقةً طوالَ مدةِ الحمل."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كشفَتِ الدراسةُ النسيجيةُ عن توقُّفِ النماءِ في المرحلةِ الجنينيةِ المبكِّرةِ عند الأسبوعِ الثامنِ، مما أدَّى إلى تشوُّهاتٍ خَلقيَّةٍ في الأطرافِ العلويَّة."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
