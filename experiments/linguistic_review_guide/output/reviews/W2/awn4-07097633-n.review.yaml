        جذر «همر» مرتبط مباشرة بالإكثار في الكلام بنصّ ابن فارس: «همر في كلامه: أكثر، وهو مِهْمار».
        والمورد الحديث يستعمل «انهمار» لترجمة outpouring وdownpour. المصدر على وزن اِنْفِعال يدلّ على
        حدوث الفعل بقوة وتلقائية. يُضيف بُعد المباغتة والإغراق الذي لا يغطّيه تدفق ولا وابل.
