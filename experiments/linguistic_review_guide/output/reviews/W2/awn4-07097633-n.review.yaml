        لترجمة barrage وvolley بسياق الكلمات والتهديدات. الاستعارة حيّة ومسكوكة: «وابل من الأسئلة/الانتقادات».
        الجذر وبل يدلّ على الشدّة والثقل (ابن فارس).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يركّز على الشدّة والوقع الثقيل — أقرب إلى barrage/bombardment. يُستعمل في سياقات سلبية غالباً
        (وابل من الانتقادات، وابل من الاتهامات). يُصوِّر التواصل بوصفه ضرباً مؤلماً متتابعاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَابِل"

    # ── مرشحات المرحلة ١ ──

    - lemma: "سَيْل"
      source: stage1
