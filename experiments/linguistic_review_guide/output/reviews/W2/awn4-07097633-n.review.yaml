        التركيز على الجريان والكثرة. كلاهما من حقل الماء الجاري. إضافته لن تثري المجموعة بفارق نوعي واضح،
        بل تُكرّر البعد الاستعاري نفسه. كما أنّ «سيل» أكثر استعمالاً بمعناه المادي (سيل مائي).

