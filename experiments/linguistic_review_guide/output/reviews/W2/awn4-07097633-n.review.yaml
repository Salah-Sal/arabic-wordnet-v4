# barrage / bombardment / outpouring / onslaught
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تدفق، وابل) بلا تشكيل — يجب ضبطهما"
      - "لمّة «تدفق» دائرية مع التعريف العربي الذي يبدأ بـ«التدفق»"
      - "«تدفق» مسجّلة في المعاجم فعلاً (تَدَفَّقَ) لا اسماً؛ المصدر تَدَفُّق يصلح اسماً لكنّ الضبط الصرفي غائب"
      - "المجموعة تفتقر إلى لمّة تغطّي الجانب الاستعاري العسكري (bombardment/onslaught)"
    observations: >-
      المفهوم المستهدف هو الاستعارة من ميدان الظواهر الطبيعية العنيفة (مطر غزير، سيل، قصف) أو الحرب
      لوصف كثافة التواصل اللغوي وتتابعه. هذا النمط الاستعاري حيّ في العربية: يُقال «وابل من الأسئلة»
      و«سيل من الكلام» و«انهمار الرسائل». اللمّتان الحاليتان تغطّيان جانبَيْ الجريان (تدفق) والشدّة (وابل)،
      لكن ينقصهما لمّة تؤكّد الإغراق والكثرة المباغتة.

  blind_candidates:
    - lemma: "سَيْل"
      generation_method: majaz
      justification: >-
        السَّيْل في الأصل: الماء الكثير الجاري بسرعة. يُستعار مجازيّاً للكثرة المتتابعة: «سيل من الكلام/الرسائل».
        استعارة حيّة مسكوكة في الاستعمال المعاصر والتراثي (أساس البلاغة: سالت عليه الخيل).
    - lemma: "اِنْهِمَار"
      generation_method: ishtiqaq
      justification: >-
        مصدر «انهمر» من الجذر هـمـر على وزن اِنْفِعال. الجذر يدلّ على الصبّ والانصباب، وقد نصّ ابن فارس:
        «هَمَرَ في كلامه: أكثر، وهو مِهْمار أي كثير الكلام». فالجذر متّصل مباشرة بالإكثار في الكلام.
    - lemma: "رَشْق"
      generation_method: majaz
      justification: >-
        الرَّشْق في الأصل: رمي السهام دفعة واحدة. يُستعار للوابل من الكلمات أو التهديدات (المورد الحديث:
        «وابل من الكلمات أو التهديدات»). لكنّه يدلّ على دفقة واحدة متزامنة أكثر من التتابع المستمر.
    - lemma: "زَخَّة"
      generation_method: ishtiqaq
      justification: >-
        من الجذر زخخ، على وزن فَعْلة. الزَّخّ: الدفع بعنف، والزَّخَّة: الدفعة الشديدة من المطر.
        يُستعمل مجازيّاً لدفقة مباغتة من شيء ما. لكنّه أقرب إلى الدفعة الواحدة منه إلى التدفق المستمر.


