stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مترجم ترجمة شبه حرفية ويحتوي على بعض الركاكة مثل (الحلقات المنحرفة) والصواب (حلقات الحيود)."
    observations: "المفهوم يشير إلى (Powder method) أو ما يعرف بطريقة (Debye-Scherrer) في دراسة البلورات بالأشعة السينية. الترجمات تعتمد على إضافة المفهومين معاً (طريقة/تصوير) و (مسحوق)."
  blind_candidates:
    - lemma: "طَرِيقَةُ المَسْحُوق"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر عن المفهوم العلمي بطريقة مباشرة وشائعة (Powder method)."
    - lemma: "تَصْوِيرُ المَسْحُوق"
      generation_method: tarkib
      justification: "ترجمة مباشرة لمصطلح (Powder photography) بتركيب إضافي."
    - lemma: "تَصْوِيرٌ مَسْحُوقِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن نوع التصوير المعتمد على المسحوق."
    - lemma: "طَرِيقَةُ دِيبَاي-شِيرَر"
      generation_method: taarib
      justification: "تعريب لاسم العالِمين اللذين ابتكرا هذه الطريقة (Debye-Scherrer method)."

stage2_evidence:
  per_lemma:
    - lemma: "تَصْوِير المَسْحُوق"
      evidence_status: "no_material_found"
    - lemma: "طَرِيقَة المَسْحُوق"
      confirm:
        - text: "«طريقة المسحوق التحليلية: powder method of analysis»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
    - lemma: "تَصْوِير مَسْحُوقِيّ"
      evidence_status: "no_material_found"
    - lemma: "طَرِيقَة دِيبَاي-شِيرَر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَصْوِير المسحوق"
      decision: confirmed
      decision_reason: "مصطلح مقبول لترجمة (powder photography)، على الرغم من أن (طريقة المسحوق) أكثر شيوعاً في الأدبيات الفيزيائية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "يركز على الجانب التصويري في العملية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصْوِيرُ المَسْحُوق"

    - lemma: "طريقة المسحوق"
      decision: confirmed
      decision_reason: "هو المصطلح العلمي الأدق والأكثر شيوعاً، وتدعمه معاجم المصطلحات الفيزيائية الموحدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance: "المصطلح الشائع الذي يعبر عن منهجية التحليل كاملة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَرِيقَةُ المَسْحُوق"

    - lemma: "طَرِيقَةُ دِيبَاي-شِيرَر"
      source: stage1
      decision: removed
      decision_reason: "الاسم العلمي الدقيق ولكنه يعتبر مرادفاً موسوعياً، وقد لا نحتاج لإضافته لغياب الأدلة المعجمية المباشرة الموثقة له كمدخل مستقل في قاعدة البيانات المعجمية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true

    - lemma: "تَصْوِيرٌ مَسْحُوقِيّ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي صحيح لغوياً، ولكن (تصوير المسحوق) يُؤدّي الغرض وموجود مسبقاً، فلا حاجة للتكثير."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true

stage4_content:
  definition:
    current: "عملية لتحديد المعادن أو البلورات؛ حيث يغطى قضيب صغير بمسحوق من المادة ويعرض لأشعة سينية معدلة بشكل مناسب؛ ويستخدم نمط الحلقات المنحرفة للتحديد"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على ركاكة في الصياغة وترجمة حرفية لبعض المصطلحات مثل (الحلقات المنحرفة) والصواب (حلقات الحيود)، كما يمكن تحسين الصياغة لتصبح أسلساً علمياً."
    authored:
      - type: terminological
        text: "عملية تُستخدم لتحديد بنية المعادن أو البلورات، تعتمد على طحن المادة إلى مسحوق وتغليف قضيب صغير بها، ثم تعريضها لأشعة سينية؛ ويُستفاد من نمط حلقات حيود الأشعة في تحديد خصائص المادة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية تُستخدم لتحديد بنية المعادن أو البلورات، تعتمد على طحن المادة إلى مسحوق وتغليف قضيب صغير بها، ثم تعريضها لأشعة سينية؛ ويُستفاد من نمط حلقات حيود الأشعة في تحديد خصائص المادة."

  examples:
    per_lemma:
      - lemma: "طَرِيقَةُ المَسْحُوق"
        examples:
          - text: "تُعدّ طريقة المسحوق من أهم التقنيات المستخدمة في دراسة تركيب البلورات بواسطة الأشعة السينية."
            type: usage
      - lemma: "تَصْوِيرُ المَسْحُوق"
        examples:
          - text: "استخدم الباحثون تقنية تصوير المسحوق للتعرف على المكونات المعدنية الدقيقة للعينة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعدّ طريقة المسحوق من أهم التقنيات المستخدمة في دراسة تركيب البلورات بواسطة الأشعة السينية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "استخدم الباحثون تقنية تصوير المسحوق للتعرف على المكونات المعدنية الدقيقة للعينة."

