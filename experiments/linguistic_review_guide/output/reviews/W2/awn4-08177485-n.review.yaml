stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة «الآخايون» تبدو كأنها تعريب صوتي مباشر للكلمة الإنجليزية (Achaeans) بدلاً من اتباع القواعد الصرفية العربية للنسبة."
      - "غياب اللمات البديلة الأكثر شيوعاً في كتب التاريخ مثل «الآخِيُّون» أو «الآخائيون»."
    observations: "المجموعة تتعلق بقبائل يونانية قديمة، والمصطلح العربي المستقر تاريخياً يميل إلى استخدام «الآخِيُّون» كجمع للمنسوب إلى آخايا (Achaea)."
  blind_candidates:
    - lemma: "الآخِيُّون"
      generation_method: ishtiqaq
      justification: "الجمع السالم للمنسوب إلى آخايا، وهو المصطلح الأكثر شيوعاً في المراجع التاريخية العربية."
    - lemma: "الآخَائِيُّون"
      generation_method: ishtiqaq
      justification: "صيغة النسبة القياسية من الاسم المعرب «آخَايا»."
    - lemma: "الآخِيُّ"
      generation_method: ishtiqaq
      justification: "اسم الجنس الجمعي أو المفرد المنسوب، ويُستخدم للإشارة إلى الشعب ككل."
    - lemma: "شَعْبُ آخَايَا"
      generation_method: tarkib
      justification: "تعبير وصفي دقيق للمفهوم كما ورد في التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "الآخايون"
      evidence_status: "no_material_found"
    - lemma: "الآخِيُّون"
      confirm:
        - text: "«أخيّون(ال...) ... achaeans»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
    - lemma: "الآخَائِيُّون"
      confirm:
        - text: "«الآخائيّة: لهجة من لهجات اللغة اليونانية القديمة كان ينطق بها الآخائيون» (بالقياس على الأركاديين الوارد في المورد)"
          source: "المورد الحديث (استدلال سياقي)"

stage3_analysis:
  per_lemma:
    - lemma: "الآخايون"
      decision: confirmed
      decision_reason: "على الرغم من أنها تبدو تعريباً صوتياً، إلا أنها مستخدمة في بعض التراجم الحديثة، لذا سأبقي عليها كخيار بديل مع تصحيح التشكيل وتفضيل الصيغ الأدق لغوياً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الآخايُون"
    - lemma: "الآخِيُّون"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح التاريخي المعياري والموثق في مسارد منظمة الألكسو."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "الآخِيُّون", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "الآخَائِيُّون"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة اشتقاقية صحيحة ومنتشرة في الأدبيات التاريخية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "الآخَائِيُّون", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "السكان اليونانيون القدماء في آخايا"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً؛ يحتاج إلى توضيح طبيعة المجموعة (قبائل) وموقعها الجغرافي التاريخي لزيادة الدقة المعجمية."
    authored:
      - type: terminological
        text: "إِحْدَى القبائِلِ اليُونانِيَّةِ القَدِيمَةِ، اسْتَوْطَنَتْ إِقْلِيمَ آخَايا فِي شِمالِ شِبْهِ جَزِيرةِ المورَةِ (البيلوبونيز)، ويُنْسَبُ إِلَيْهِم العَصْرُ الآخِيُّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "إِحْدَى القبائِلِ اليُونانِيَّةِ القَدِيمَةِ، اسْتَوْطَنَتْ إِقْلِيمَ آخَايا فِي شِمالِ شِبْهِ جَزِيرةِ المورَةِ (البيلوبونيز)، ويُنْسَبُ إِلَيْهِم العَصْرُ الآخِيُّ."}
  examples:
    per_lemma:
      - lemma: "الآخِيُّون"
        examples:
          - text: "كانَ الآخِيُّونَ مِن أَبْرَزِ شُعُوبِ اليُونانِ القَدِيمَةِ الَّتِي شارَكَتْ فِي حَرْبِ طُرْوادة."
            type: usage
      - lemma: "الآخَائِيُّون"
        examples:
          - text: "أَسَّسَ الآخَائِيُّونَ حَضارةً زاهِرةً فِي مِنطَقَةِ المورة قَبْلَ الغَزْوِ الدُّورِيِّ."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "الآخِيُّون"
      entry_id: "{auto}"
      note: "اسم علم لشعب قديم، معرب عن اليونانية (Akhaioi)."
    - lemma: "الآخَائِيُّون"
      entry_id: "{auto}"
      note: "صيغة النسبة إلى إقليم آخايا اليوناني."
  per_sense:
    - lemma: "الآخِيُّون"
      sense_id: "{auto}"
      nuance: "الاسم التاريخي الأشيع للقبائل."
      mwe: false
    - lemma: "الآخَائِيُّون"
      sense_id: "{auto}"
      nuance: "صيغة تركز على النسبة الجغرافية للإقليم."
      mwe: false
    - lemma: "الآخايُون"
      sense_id: "{auto}"
      nuance: "تعريب صوتي متأثر باللغات الأوروبية الحديثة."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
