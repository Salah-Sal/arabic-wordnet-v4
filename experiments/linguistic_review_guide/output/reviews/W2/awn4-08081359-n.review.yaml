stage4_content:
  definition:
    current: "المتهم ومستشاروه القانونيون مجتمعين"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق لكن يمكن صياغته بأسلوب معجمي يبرز الدور الوظيفي للكيان الجماعي."
    authored:
      - type: terminological
        text: "الكيان القانوني الذي يمثل المتهم في الخصومة القضائية، ويضم المتهم ومحاميه ومستشاريه بصفتهم طرفاً واحداً يسعى لدحض الاتهام."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-08081359-n"
          definition_index: 0
          text: "الكيان القانوني الذي يمثل المتهم في الخصومة القضائية، ويضم المتهم ومحاميه ومستشاريه بصفتهم طرفاً واحداً يسعى لدحض الاتهام."
  examples:
