stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة صحيحة، ولكن ينقصها بعض المترادفات المسكوكة التي تعبر عن الصفة الجماعية (Collective) بشكل أقوى في السياق القانوني الرسمي."
    observations: "المفهوم يشير إلى الكيان القانوني الممثل للمتهم، وهو مفهوم حديث نسبياً في صياغته الاصطلاحية، ويعتمد غالباً على التراكيب الإضافية (فريق، هيئة، جهة) أو النقل الدلالي للمصدر (الدفاع)."
  blind_candidates:
    - lemma: "فَرِيقُ الدِّفَاعِ"
      generation_method: tarkib
      justification: "تركيب إضافي شائع جداً في الصحافة والقانون للتعبير عن مجموعة المحامين والمستشارين."
    - lemma: "الدِّفَاعُ"
      generation_method: majaz
      justification: "استخدام المصدر (الدفاع) للتعبير عن القائم به (المتهم ومحاموه) من باب المجاز المرسل (إطلاق المصدر على الفاعل)."
    - lemma: "جِهَةُ الدِّفَاعِ"
      generation_method: tarkib
      justification: "مصطلح قانوني رسمي يستخدم لتمييز طرف المتهم عن طرف الادعاء."
    - lemma: "هَيْئَةُ الدِّفَاعِ"
      generation_method: tarkib
      justification: "يعبر عن التشكيل الجماعي المنظم للمستشارين القانونيين."

stage2_evidence:
  per_lemma:
    - lemma: "الدِّفَاع"
      confirm:
        - text: "«في القَضَاء: إجـراءاتٌ تَصدُرُ عن المُتَّهمِ أو مُمَثِّلِه، دحْضًا للاتِّهامِ الموجَّهِ إليه»"
          source: "المعجم الكبير"
      expands:
        - text: "«ما يتقدم به أو يعرضه المرفوعة ضده دعوى من دفوع ومطالبات ومرافعات»"
          source: "المعجم الموحد لمصطلحات القانون"
    - lemma: "فَرِيقُ الدِّفَاعِ"
      confirm:
        - text: "«مجموعة القتال: وحدة عسكريّة مكوّنة من خمس سرايا» (قياساً على استخدام 'فريق' و 'مجموعة' للوحدات البشرية المنظمة)."
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "هَيْئَةُ الدِّفَاعِ"
      confirm:
        - text: "«هيئة: جماعة من النَّاس يُعهد إليها بعملٍ خاصّ»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "جِهَةُ الدِّفَاعِ"
      confirm:
        - text: "«جهة: جانب، ناحية»"
          source: "المعجم الوسيط"

