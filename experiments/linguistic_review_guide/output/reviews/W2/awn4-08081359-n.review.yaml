      - lemma: "الدِّفَاع"
        examples:
          - text: "استمعت المحكمة إلى مرافعة الدفاع الختامية قبل النطق بالحكم."
            type: usage
      - lemma: "فَرِيقُ الدِّفَاعِ"
        examples:
          - text: "قدم فريق الدفاع أدلة جديدة تثبت براءة المتهم من التهمة المنسوبة إليه."
            type: usage
      - lemma: "هَيْئَةُ الدِّفَاعِ"
        examples:
          - text: "قررت هيئة الدفاع الانسحاب من الجلسة احتجاجاً على الإجراءات."
            type: usage
      - lemma: "جِهَةُ الدِّفَاعِ"
        examples:
          - text: "طلبت جهة الدفاع مهلة إضافية للاطلاع على تقرير الخبير."
