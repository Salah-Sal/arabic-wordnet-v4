# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04887768-n  |  ILI: i62633  |  POS: n
# المعنى: naivete / naivety / naiveness
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مترجم حرفياً من الإنجليزية ولا يتّسق مع أسلوب المعجم الوسيط"
      - "بَسَاطَة لفظ مشترك بين 'simplicity' و'naivety'، وقد يُحدث التباساً دلالياً في السياق التقني"
      - "سَذَاجَة مستعملة مُجازة مجمعياً، غير أن أصلها 'ساذج' جامد ومحتمل التعريب من الفارسية (ساده)"
      - "المجموعة تفتقر إلى لمة تراثية أصيلة تُمثّل الدلالة الكلاسيكية لنقص الخبرة والغفلة"
    observations: "المجموعة تتناول مفهوم naivety الجامع بين قصور التجربة الدنيوية وحسن النية وسهولة الانخداع.
      اللمّتان الحاليتان تُغطيان طرفَي الدلالة: بَسَاطَة تُبرز السلاسة والبراءة الطيّبة، وسَذَاجَة تُبرز نقص الحنكة.
      غير أن الأسرة المعجمية الكلاسيكية تُتيح لفظ غِرَارَة المُرتبط ارتباطاً عضوياً بالجذر غرر،
      وله سند ابن فارس المميِّز بين غرارة الكرم وغرارة نقصان الفطنة، وهو اللفظ الأدق اصطلاحياً."
  blind_candidates:
    - lemma: "غِرَارَة"
      generation_method: ishtiqaq
      justification: "من جذر غرر على وزن فِعَالَة المنتج للصفات المجردة — يدل على الغفلة وحداثة السن وقلة الاختبار بالأمور، وهو المعنى الجوهري لنقص الخبرة الدنيوية"
    - lemma: "فِطْرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من فِطري (المنسوب إلى الفطرة)، يدل على خلوص الطبع قبل احتكاك التجربة — ينطلق من فكرة أن نقص الخبرة الدنيوية أصل في الإنسان قبل الاكتساب"
    - lemma: "سَلَامَة الطَّوِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي (سلامة + الطوية) يُعبّر عن خلوص النفس من دهاء الحياة — يُشير إلى البعد الأخلاقي الإيجابي لنقص الخبرة الدنيوية"
    - lemma: "بَرَاءَة"
      generation_method: majaz
      justification: "إزاحة دلالية من البراءة القانونية إلى البراءة الفطرية من دنس التجربة الدنيوية — innocence بمعنى naivety مستعمل في العربية المعاصرة"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بَسَاطَة"
      confirm:
        - text: "«(1) بساطة؛ سذاجة (2) ملاحظةٌ ساذَجة: عملٌ ساذج.»"
          source: "المورد الحديث (2008) — ترجمة naïveté"
      expands:
        - text: "«(1) بساطة (2) سذاجة (3) حماقة (4) وضوح.»"
          source: "المورد الحديث (2008) — ترجمة simplicity"
          addition: "المورد يُدرج بساطة مرادفاً لـ simplicity إلى جانب سذاجة، مما يُثبت التوسع الدلالي للكلمة عبر الحقلين"
        - text: "«تشير إلى الاختزال والاقتصاد بوصفهما مقياسين بالإضافة إلى الانسجام والشمولية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — simplicity"
          addition: "تُستعمل بساطة مصطلحاً تقنياً في اللسانيات بمعنى simplicity المختلف عن naivety — وهو ما قد يُحدث التباساً"

    - lemma: "سَذَاجَة"
      confirm:
        - text: "«سَذَاجَة — الجذر: س ذ ج — مثال: عُرِف بِسَذَاجته — الرأي: مرفوضة — السبب: لأن «السذاجة» مشتقة من «ساذج» وهو جامد. المعنى: ببساطته وافتقاره إلى الحُنكة — الصواب والرتبة: عُرِف بِسَذَاجته [صحيحة] — التعليق: يمكن تصحيح هذا المثال بناء على ما أقره مجمع اللغة المصري من جواز الاشتقاق من الجامد، وقد أجاز الأساسي استعمال هذه الكلمة، بينما أهملها الوسيط، ويدعم صحة الكلمة اشتقاق العجاج الفعل «تسذّج» من الساذج.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (2003)"
        - text: "«(1) بساطة؛ سذاجة (2) ملاحظةٌ ساذَجة: عملٌ ساذج.»"
          source: "المورد الحديث (2008) — ترجمة naïveté"
        - text: "«(1) «أ» طهارة [من الإثم]. «ب» براءة [من جريمة]. «ج» سذاجة. «د» جهل — (2) شخص طاهر أو بريء أو ساذج أو جاهل»"
          source: "المورد الحديث (2008) — ترجمة innocence"
      contradicts:
        - text: "«سَذاجة؛ بلاهة؛ حماقة إلخ.»"
          source: "المورد الحديث (2008) — ترجمة silliness"
          conflict: "ربط سذاجة بـ silliness (البلاهة والحماقة) يُحمّلها دلالة سلبية أشد مما يقتضيه naivety الذي لا يُلمح إلى خلل عقلي"

    - lemma: "غِرَارَة"
      confirm:
        - text: "«الغَرَارَةُ: الغفلة — حداثة السن»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
        - text: "«(الغرارة) الْغَفْلَة وحداثة السن وَيُقَال كَانَ ذَلِك على غرارتي حَدَاثَة سني»"
          source: "المعجم الوسيط (1998) — النسخة الحوراماني"
        - text: "«غَرَارة — من (غ ر ر) الجهل بالأمور، ونضوب الماء، وحداثة السن.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) خُضْرَة؛ اخضرار — (2) غَرارة؛ قِلَّة اختبار.»"
          source: "المورد الحديث (2008) — ترجمة verdancy"
        - text: "«(1) اخضرار — (2) نضارة — (3) «أ» غرارة؛ قلة اختبار. «ب» سذاجة»"
          source: "المورد الحديث (2008) — ترجمة greenness"
      expands:
        - text: "«وَمِمَّا يُقَارِبُ هَذَا: الْغَرَارَةُ، وَهِيَ كَالْغَفْلَةِ، وَذَلِكَ أَنَّهَا مِنْ كَرَمِ الْخُلُقِ، قَدْ تَكُونُ فِي كُلِّ كَرِيمٍ. فَأَمَّا الْمَذْمُومُ مِنْ ذَلِكَ فَهُوَ مِنَ الْأَصْلِ الَّذِي قَبْلَ هَذَا؛ لِأَنَّهُ مِنْ نُقْصَانِ الْفِطْنَةِ.»"
          source: "مقاييس اللغة لابن فارس — مادة (غرر)"
          addition: "ابن فارس يُميّز غرارة الكرم (ممدوحة) من غرارة نقصان الفطنة (مذمومة) — وكلا وجهَيها متحقق في naivety"

    - lemma: "فِطْرِيَّة"
      contradicts:
        - text: "«الفطرية: القول بأن الأفكار والمبادئ جبلية وموجودة في النفس قبل التجربة والتلقين. (مو)»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: "فطرية مصطلح فلسفي تقني (innatism/nativism) لا علاقة له بـ naivety — التعريف المعجمي يُثبت أنها حُجزت لمذهب فلسفي مختلف"

    - lemma: "سَلَامَة الطَّوِيَّة"
      evidence_status: "no_material_found"

    - lemma: "بَرَاءَة"
      confirm:
        - text: "«(1) «أ» طهارة [من الإثم]. «ب» براءة [من جريمة]. «ج» سذاجة. «د» جهل — (2) شخص طاهر أو بريء أو ساذج أو جاهل»"
          source: "المورد الحديث (2008) — ترجمة innocence"
      contradicts:
        - text: "«مقرر تصدره محكمة زجرية معينة تنفي من خلاله التهمة أو التهم الموجهة للمتهم المبرأ.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "براءة مصطلح قانوني راسخ بمعنى acquittal — إضافتها إلى هذه المجموعة يُنشئ تعارضاً مع الاستخدام القانوني المرتسخ"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "بَسَاطَة"
      decision: confirmed
      decision_reason: "لفظ فصيح مشتق من جذر بسط على وزن فَعَالَة. ورد مرادفاً لـ naïveté في المورد الحديث إلى جانب سذاجة. وإن كانت دلالته أوسع من naivety (تشمل simplicity)، فإن السياق الضمني في المجموعة الترادفية يُخصّصه. اجتاز بوابة جودة المصطلح بحكم الشيوع والفصاحة والاشتقاقية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُبرز الجانب الإيجابي في الشخصية: البراءة والانبساط وعدم التصنّع، دون التركيز الصريح على الضعف أو قابلية الانخداع — أقرب إلى simplicity الأخلاقي"

    - lemma: "سَذَاجَة"
      decision: confirmed
      decision_reason: "فصيحة مُجازة بقرار مجمع اللغة المصري من جواز الاشتقاق من الجامد، ومدعومة بشاهد استعمالي موثّق (العجاج: تسذّج). المعنى يتطابق مع naivety بدقة من حيث نقص الحنكة وقابلية التأثر، وهي أكثر ألفاظ المجموعة تخصيصاً للمفهوم المطلوب."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُركّز على الجانب السلبي: قصور الحنكة، ضعف الحيلة، والسهولة في الانخداع — تحمل ظلاً انتقادياً خفياً غائباً عن بَسَاطَة"

    - lemma: "غِرَارَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ كلاسيكي أصيل في المعجم العربي، شاهد المعجم الوسيط وابن فارس وموسوعة السلطان قابوس كلها تُثبت دلالته على الغفلة وحداثة السن وقلة الاختبار. هو أدق ألفاظ المجموعة في التعبير عن الجانب التجريبي الزمني لـ naivety (worldliness). يسدّ ثغرة كلاسيكية في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُركّز على الجانب الزمني والتجريبي: حداثة العهد بالحياة وقلة اختبار طبائع الناس — وهو المعنى الكلاسيكي الأصيل الأقرب إلى 'worldliness' في الإنجليزية"
      actions:
        - command: create_entry
          params: {lemma: "غِرَارَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "فِطْرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية القاطعة تُثبت أن فطرية مصطلح فلسفي تقني مُخصَّص لمذهب innatism (الأفكار جبلية قبل التجربة)، وهو مفهوم مستقل بعيد عن naivety. التشابه الظاهري في الدلالة (قبل التجربة) مجرد اشتراك سطحي."

    - lemma: "سَلَامَة الطَّوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة لا تجتاز اختبار السكّ: يمكن إبدال 'طوية' بـ'نية' أو 'روح' ويبقى الوصف صحيحاً، مما يؤكد أنها ليست وحدة معجمية ثابتة. لا سند معجمي لها كمصطلح مسكوك."

    - lemma: "بَرَاءَة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح راسخ بمعنى innocence القانوني (acquittal) في المعجم العربي المتخصص. إضافتها ستُنشئ تعارضاً مع هذا الاستخدام التقني المرتسخ وستُضعف المجموعة بلفظ مشترك بين حقلين متباعدَين."


