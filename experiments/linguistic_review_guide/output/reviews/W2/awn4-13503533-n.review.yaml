stage1_review:
  assessment:
    concerns:
      - "المجموعة الحالية تضم 'تدفق' و'سريان'، وهما مصطلحان يعبران بدقة عن التدفق المستمر، إلا أنهما ينقصان التشكيل."
    observations: "التعريف العربي دقيق ويعكس المفهوم بالإنجليزية، وهو يغطي العمليات الطبيعية المتمثلة في الجريان والتدفق المستمر لأي تيار أو سائل. يمكن إثراء المجموعة بمصطلحات إضافية مثل 'جريان' و'انسياب' لتغطية الجوانب الدلالية المختلفة للحركة المستمرة للموائع."
  blind_candidates:
    - lemma: "اِنْسِيَاب"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (س ي ب)، ومصدر للفعل انساب. يعبر عن الجريان السلس المستمر للموائع."
    - lemma: "جَرَيَان"
      generation_method: ishtiqaq
      justification: "مصدر للفعل جرى (ج ر ي). يستخدم لوصف حركة السوائل والتيارات بشكل عام."
    - lemma: "سَيَلَان"
      generation_method: ishtiqaq
      justification: "مصدر للفعل سال (س ي ل). يدل على امتداد التيار المائي أو غيره بلا توقف."
    - lemma: "دَفْق"
      generation_method: ishtiqaq
      justification: "مصدر دفق، يعبر عن الانصباب وخروج السائل بقوة واستمرارية."

stage2_evidence:
  per_lemma:
    - lemma: "تَدَفُّق"
      confirm:
        - text: "«الماءُ ونحوه: مطاوع دفقه»"
          source: "المعجم الوسيط"
        - text: "«الماءُ والدَّمْعُ: تَصَبَّبَ. وقِيلَ: انصبَّ بِمَرَّةٍ»"
          source: "القاموس المحيط"
      expands:
        - text: "«عملية تقنية تمكن الفرد من تحميل الوسائط المتعددة المختلفة (الصوت والفيديو، أو كليهما) إلى مستخدم الحاسوب في دفق مستمر.»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "يضيف الاستخدام الحديث في مجال تقنية المعلومات (تدفق البيانات)."
    - lemma: "سَرَيَان"
      confirm:
        - text: "«السَّرَيَانُ الآليَة (Gravity flow): نوعٌ من حركة الجليد فى م ثلجة مستقرة على سطح مُنْحَدِر, حيث يسرى الجليدُ بفِعْل الجَاذبيَة فى اتجاه الانحدار إلى أسفل, ومنه سريانُ البترول أيضًا.»"
          source: "معجم الجيولوجيا"
        - text: "«كمية السائل المُتدفقة في وحدة زمنية مُعينة خلال مقطع مُستعرض مُعين.»"
          source: "المعجم الموحد لمصطلحات الفيزياء"
      expands:
        - text: "«سَرْيان: من (س ر ي) الليل الماضي الذاهب ومن يقطع الليل سيرا.»"
          source: "معجم الغني"
          addition: "يبين الأصل اللغوي للسريان وهو المشي والانتشار."
    - lemma: "جَرَيَان"
      confirm:
        - text: "«جَرْيَان: من (ج ر ي) المندفع في السير.»"
          source: "معجم الغني"
    - lemma: "سَيَلَان"
      confirm:
        - text: "«سَيَلَان: من (س ي ل) جريان الماء ونحوه، وكثرة إفراز السوائل التي تخرج من فتحات الجسم.»"
          source: "معجم الغني"
      contradicts:
        - text: "«مرض معد يصيب الإنسان بالنيسريات البنية، ينتقل جنسيا، يتسم بالتهاب الإحليل مع مفرزات قيحية مؤلمة...»"
          source: "المعجم الطبي الموحد"
          conflict: "يغلب استخدامه في العصر الحديث للمرض التناسلي، مما يبعده عن الدلالة الطبيعية العامة."
    - lemma: "اِنْسِيَاب"
      evidence_status: "no_material_found"
    - lemma: "دَفْق"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تدفق"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع للتعبير عن الانصباب والاندفاع المستمر للسوائل أو التيارات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            lemma: "تدفق"
            new_lemma: "تَدَفُّق"
    - lemma: "سريان"
      decision: confirmed
      decision_reason: "يعبر بدقة عن حركة الموائع والطاقة والجليد ضمن مساراتها، وهو شائع في الميادين العلمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            lemma: "سريان"
            new_lemma: "سَرَيَان"
    - lemma: "جَرَيَان"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي فصيح وشامل يطلق على كل ما يندفع في السير كالمياه والتيارات، وهو من أشهر المرادفات في هذا السياق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "جَرَيَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13503533-n"
    - lemma: "اِنْسِيَاب"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق يعبر عن الحركة المتصلة والسلسة للتيار والموائع."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "اِنْسِيَاب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13503533-n"
    - lemma: "سَيَلَان"
      source: stage1
      decision: removed
      decision_reason: "رغم دلالته على جريان الماء، إلا أن شيوع استخدامه كاسم لمرض تناسلي أو لكثرة الإفرازات يجعله أقل ملاءمة من بقية البدائل الصافية دلالياً."
    - lemma: "دَفْق"
      source: stage1
      decision: removed
      decision_reason: "كلمة 'تدفق' المعتمدة تكفي وتغني عن 'دفق' التي قد تحتمل معنى التدفق لمرة واحدة أكثر من الاستمرارية."

stage4_content:
  definition:
    current: "أي تيار أو تصريف غير منقطع"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي للترجمة (stream or discharge)، ويمكن تحسينه ليصبح أكثر توافقاً مع صياغة المعاجم العربية وبنية المفهوم (عملية طبيعية)."
    authored:
      - type: terminological
        text: "عملية طبيعية تتمثل في الحركة المستمرة والجريان لتيار من الموائع أو الطاقة دون انقطاع."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13503533-n"
          definition_index: 0
          text: "عملية طبيعية تتمثل في الحركة المستمرة والجريان لتيار من الموائع أو الطاقة دون انقطاع."
  examples:
    per_lemma:
      - lemma: "تَدَفُّق"
        examples:
          - text: "أدى انسداد المجرى إلى توقف تَدَفُّق المياه بشكل مفاجئ."
            type: usage
      - lemma: "سَرَيَان"
        examples:
          - text: "يتميز الجليد الجبلي بِسَرَيَان بطيء مع الانحدار."
            type: usage
      - lemma: "جَرَيَان"
        examples:
          - text: "راقبه وهو يتأمل جَرَيَان النهر الصافي بين الصخور."
            type: usage
      - lemma: "اِنْسِيَاب"
        examples:
          - text: "صُمِّم الهيكل لضمان اِنْسِيَاب الهواء من حوله بأقل مقاومة ممكنة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-13503533-n"
          text: "أدى انسداد المجرى إلى توقف تَدَفُّق المياه بشكل مفاجئ."
      - command: add_synset_example
        params:
          synset_id: "awn4-13503533-n"
          text: "يتميز الجليد الجبلي بِسَرَيَان بطيء مع الانحدار."

stage5_enrichment:
  per_entry:
    - lemma: "تَدَفُّق"
      root: "دفق"
      maqayis_quote: "«الدَّالُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ قِيَاسُهُ، وَهُوَ دَفْعُ الشَّيْءِ قُدُمًا. مِنْ ذَلِكَ: دَفَقَ الْمَاءُ، وَهُوَ مَاءٌ دَافِقٌ.»"
    - lemma: "سَرَيَان"
      root: "سري"
      maqayis_quote: "«السِّينُ وَالرَّاءُ وَالْحَرْفُ الْمُعْتَلُّ بَابٌ مُتَفَاوِتٌ جِدًّا... وَالسُّرَى: سَيْرُ اللَّيْلِ، يُقَالُ سَرَيْتُ وَأَسْرَيْتُ.»"
    - lemma: "جَرَيَان"
      entry_id: "{auto}"
      root: "جري"
      maqayis_quote: "«الْجِيمُ وَالرَّاءُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ انْسِيَاحُ الشَّيْءِ. يُقَالُ جَرَى الْمَاءُ يَجْرِي جَرْيَةً وَجَرْيًا وَجَرَيَانًا.»"
    - lemma: "اِنْسِيَاب"
      entry_id: "{auto}"
      root: "سيب"
      maqayis_quote: "«السِّينُ وَالْيَاءُ وَالْبَاءُ أَصْلٌ يَدُلُّ عَلَى اسْتِمْرَارِ شَيْءٍ وَذَهَابِهِ. مِنْ ذَلِكَ سَيْبُ الْمَاءِ: مَجْرَاهُ. وَانْسَابَتِ الْحَيَّةُ انْسِيَابًا.»"
  per_sense:
    - lemma: "تَدَفُّق"
      nuance: "يعبر عن الجريان القوي والانصباب المستمر بكميات وفيرة، ويناسب الغزارة."
      mwe: false
    - lemma: "سَرَيَان"
      nuance: "يركز على الانتشار التدريجي والمستمر كالطاقة والتيارات ضمن مسارات محددة أو طبيعية."
      mwe: false
    - lemma: "جَرَيَان"
      sense_id: "{auto}"
      nuance: "مصطلح أعم وشامل يطلق على كل ما يندفع في السير وخصوصاً حركة المياه والموائع."
      mwe: false
    - lemma: "اِنْسِيَاب"
      sense_id: "{auto}"
      nuance: "يعبر عن الحركة السلسة المتصلة والخالية من الانقطاع أو العوائق."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-13503533-n"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
