          source: "معجم الصواب اللغوي لأحمد مختار عمر (entry_id=852438)"
          addition: >
            يُنبّه على أن «حجم» في الأصل للأجسام ذات الأبعاد الثلاثة (كتلة)؛
            وتوسيعه لغير المحسوس مرفوض عند بعض العلماء، لكنه شائع في المعاجم التقنية الحديثة.

    # ── لمّة موجودة: مقاس ──
    - lemma: "مَقَاسٌ"
      confirm:
        - text: >
            «مقاس هجين» = bastard size (Printing–Electricity) /
            «مقاس مشذّب» = trimmed size / «مقاس غير مشذّب» = untrimmed size
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.١: طباعة–كهرباء (ARABTERM)"
        - text: "«مقاس الجسيمات» = particle size (domain: AGROVOC)"
