# ── المرحلة ١: المراجعة والتوليد (عمياء) ───────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان «حجم» و«مقاس» مدرجتان بدون تشكيل — يجب إضافة الضبط الكامل"
      - "«حجم» أعم دلالةً مما يقتضيه المفهوم (volume/bulk بالمطلق في مقابل size كمرتبة في سلسلة متدرجة)"
      - "التعريف العربي الحالي مترجم ترجمةً حرفيةً من الإنجليزية، ويحتاج إلى إعادة صياغة بأسلوب المعجم الوسيط"
    observations: >
      المجموعة تضمّ لمّتين تعبّران عن مفهوم «المقاس/الحجم الموحّد»؛ «حَجْم» الأعمّ دلالةً
      ويشمل الحجم المطلق للشيء وجِرمه، و«مَقَاس» الأخصّ بالمعنى المراد وهو المرتبة القياسية
      المعيارية المتدرّجة كأرقام الملابس والأحذية. يستوعب هذا المفهوم جانباً من دلالة «size»
      الإنجليزية التي تجمع بين الحجم المطلق (volume) والمقاس النسبي ضمن نظام تصنيف موحّد
      (clothing size). لا توجد مشكلة بنيوية في اللمّات الموجودة، لكنها تحتاج إلى تشكيل
      وتمييز دلالي بينهما.

  # ── التوليد العمياء (استناداً إلى التعريف وحده قبل الاطلاع على اللمّات) ──
  blind_candidates:
    - lemma: "مَقَاسٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر ميمي (وزن مَفْعَل) من الفعل قاسَ يَقيسُ؛ يدل على المقدار الذي يُقاس به الشيء
        ضمن سلسلة متدرجة، شائع في سياق قياسات الملابس والأحذية المعيارية.
    - lemma: "حَجْمٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر ح-ج-م؛ يدل على المقدار الجرمي للشيء. مجاز مشهور في العربية المعاصرة
        للدلالة على «size» بوجه عام، مع امتداد دلالي نحو المرتبة في سلسلة قياسية.
    - lemma: "قَدٌّ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من معنى «القامة والقوام» إلى معنى الحجم المتدرج في الملابس؛
        يُستعمل في المورد الحديث بمعنى size في سياق الأحذية والملابس، واستُعمل الجذر ق-د-د
        تاريخياً للدلالة على التقدير والقطع والتقسيم المتناسب.
    - lemma: "مِقْيَاسٌ"
      generation_method: ishtiqaq
      justification: >
        وزن مِفْعَال من جذر قيس/قوس؛ المقياس بمعنى المقدار، ذكره المعجم الوسيط بمعنى
        «المقدار وما قيس به»، وأثبته معجم الصواب على أنه «فصيح» في مقابل مَقاس.


