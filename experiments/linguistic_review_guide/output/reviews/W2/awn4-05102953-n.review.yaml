# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "حَجْمٌ"
      entry_id: "{auto}"
      root: "حجم"
      maqayis_quote: >
        «الْحَاءُ وَالْجِيمُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ ضَرْبٌ مِنَ الْمَنْعِ
        وَالصَّدْفِ. يُقَالُ أَحْجَمْتُ عَنِ الشَّيْءِ، إِذَا نَكَصْتَ عَنْهُ.
