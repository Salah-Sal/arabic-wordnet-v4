          source: "معجم الصواب اللغوي لأحمد مختار عمر (entry_id=855436)"
          addition: >
            يُثبت أن «مَقاس» مصدر ميمي مُجاز مجمعياً، وأن التراث يفضّل «مِقياس»
            لكن المعاجم الحديثة تُثبت «مَقاس» صحيحاً مستعملاً.

