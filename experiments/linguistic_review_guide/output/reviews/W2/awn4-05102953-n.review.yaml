# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: حجم ──
    - lemma: "حَجْمٌ"
      decision: confirmed
      decision_reason: >
        «حجم» موثّق بغنى في المعاجم الكلاسيكية والمعاصرة بمعنى مقدار الشيء وجِرمه،
        ويُستعمل في المعاجم التقنية الحديثة للدلالة على size في سياقات متعددة.
        تحذير معجم الصواب يختص باستعماله لغير الأجسام المحسوسة (كالأموال)، لا باستعماله
        لوصف الحجم الجسدي الملموس. في سياق الملابس والأشياء المصنّعة، «حجم» مقبول ومستعمل.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «حَجْم» يدل على الخاصية الجرمية والمقدارية للشيء بوجه عام (volume/size في مطلقها)،
        وهو أشمل وأعم استخداماً يصلح للمقاسات الكبيرة والصغيرة والحجوم المطلقة؛
        بينما «مَقاس» أكثر تخصصاً بمعنى «الرقم أو المرتبة المعيارية» في نظام تصنيفي متدرج.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَجْمٌ"

    # ── لمّة موجودة: مقاس ──
    - lemma: "مَقَاسٌ"
      decision: confirmed
      decision_reason: >
        «مَقاس» هو المصطلح الأدق للمفهوم المقصود (مرتبة محددة في سلسلة قياسات معيارية متدرجة
        كمقاسات الملابس). يُثبته معجم الصواب بتصنيف «صحيحة»، ويوثّق مجمع اللغة العربية
        إجازته مصدراً ميمياً من «قاس»، كما يرد في معاجم ARABTERM المتخصصة بمعنى size
        في سياقات الطباعة والمعلوماتية والزراعة. اتساق استعماله في العربية المعاصرة لقياسات
        الملابس والأشياء المصنّعة يجعله الأنسب لهذه المجموعة. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «مَقاس» يدل تحديداً على الرقم أو المرتبة الموحّدة ضمن سلسلة قياسية معيارية متدرجة
        (كمقاس ٣٨ أو ٤٠ في الملابس)؛ أكثر تخصصاً من «حجم» وأدل على المرتبة في نظام تصنيفي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَقَاسٌ"

    # ── مرشح المرحلة ١: قَدّ ──
    - lemma: "قَدٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «قدّ» في التراث والمعاجم الكلاسيكية يدل على القامة والقوام الجسدي لا على مرتبة محددة
        في سلسلة قياسية معيارية. ورد في المورد الحديث ترجماةً لـ size في سياق الأحذية، لكنه
        غير مثبّت كمصطلح اصطلاحي راسخ في سياق الملابس والأشياء المصنّعة بالمعنى المقصود هنا.
        فضلاً عن ذلك، «حجم» و«مقاس» يغطّيان المفهوم بالكامل دون حاجة إليه.

    # ── مرشح المرحلة ١: مِقياس ──
    - lemma: "مِقْيَاسٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «مِقياس» يحمل دلالة راسخة على أداة القياس أو السلّم القياسي (scale/instrument)
        كمقياس الحرارة ومقياس ريختر ومقياس النيل، وليس على «خاصية كون الشيء في مرتبة محددة
        من سلسلة متدرجة». أجازه معجم الصواب في «مِقياس الطول» بوصفه أفصح من «مَقاس»،
        لكن سيادة دلالة الأداة عليه تجعله مُلتبساً في سياق المجموعة. لا يُضيف دلالة جديدة
        لم تغطّها «مَقاس» الأكثر تخصصاً وتداولاً في المعنى المقصود.


