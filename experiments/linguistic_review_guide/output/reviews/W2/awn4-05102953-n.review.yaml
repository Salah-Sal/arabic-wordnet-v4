            «المقدار مِقياس؛ لأنه يُقدَّر به الشيء ويُقاس، ومنه مقياس النيل»، ويمكن تصحيح
            «مَقاس» بناء على أنها مصدر ميمي من الفعل قاس، وقد ورد في بعض المعاجم الحديثة
