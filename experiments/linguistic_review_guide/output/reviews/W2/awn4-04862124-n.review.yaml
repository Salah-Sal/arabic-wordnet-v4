# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "لا أخلاقية"
      decision: confirmed
      decision_reason: >
        المصطلح صحيح مفهومياً ومدعوم بشاهد المعجم الكبير («اللَّأَخلاقِيَّة» ضدّ أخلاقية).
        غير أن الصيغة الحالية تحتاج: (أ) ضمّ الكلمتين في وحدة مكتوبة متصلة بالتزام مع الاستخدام المعجمي،
        (ب) إضافة التشكيل الكامل الإلزامي.
        يُحتفظ به بعد تصحيح التشكيل والصيغة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الفلسفي الأكثر رسوخاً في الكتابة الأكاديمية العربية للدلالة على الحياد القيميّ المطلق؛
        يُبرز الطابع المُجرَّد للمفهوم بوصفه خاصية تنتمي لنطاق الفلسفة الأخلاقية النظرية،
        ويتمايز عن «غير أخلاقية» برسوخه كمصدر صناعي يقابل «الأخلاقية» تقابلاً مباشراً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اللاَّأَخْلَاقِيَّة"

    - lemma: "اللاَّأَخْلَاقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا الشكل هو عين اللمّة الموجودة بعد تصحيح صيغتها وتشكيلها عبر update_lemma أعلاه؛
        إدراجه كمدخل مستقل يُفضي إلى التكرار. يُعالج ضمن إجراء تحديث اللمّة الموجودة لا بإنشاء مدخل جديد.

    - lemma: "الغَفَالَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجاهة الأصل اللغوي في ابن فارس (الخلوّ من السمة)، لم يُرصد استخدام «الغفالة» مصطلحاً
        راسخاً للحياد الأخلاقي في أي معجم. المجاز بعيد ويفتقر إلى التثبيت المعجمي.
        اختبار السكّ: «غفالة» يمكن استبدالها بـ«خلوّ» أو «انعدام» دون فقدان المعنى → ليست مصطلحاً مسكوكاً.
      evidence_assessment:
        case: no_material

    - lemma: "غَيْرُ أَخْلَاقِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        ARABTERM يُثبتها صراحةً ترجمةً لـ «amorality» في مجال علم الاجتماع والأنثروبولوجيا.
        المركب الإضافي «غير + أخلاقية» منهج عربي منتج ومستعمل فعلاً في السياقات العلمية التطبيقية.
        تُكمل «اللاأخلاقية» في التغطية المصطلحية عبر سجلّ أسلوبي مختلف (علمي تطبيقي).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        المصطلح العلمي المستخدم في مصادر علم الاجتماع والطب للتعبير عن خلوّ الظاهرة أو السلوك
        من الطابع الأخلاقي؛ يُبرز التوصيف التقريريّ السلبيّ (الوصف بغياب الخاصية)،
        ويتمايز عن «اللاأخلاقية» بالسجلّ الأسلوبي (علمي-تطبيقي لا فلسفي-نظري) وببنية المركب الإضافي.
      actions:
        - command: create_entry
          params:
            lemma: "غَيْرُ أَخْلَاقِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04862124-n"

    - lemma: "التَّجَرُّدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي على استخدام «التجرّدية» مصطلحاً للحياد الأخلاقي.
        «التجرّد» كمفهوم فلسفي يُحيل إلى التجريد الميتافيزيقي لا الحياد القيميّ.
        تفتقر إلى التثبيت المعجمي ويُخشى التباسها مع مصطلح «المثالية التجريدية».
      evidence_assessment:
        case: no_material


