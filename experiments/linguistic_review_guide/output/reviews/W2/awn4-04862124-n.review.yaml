# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # التقييم الأولي (بعد الاطلاع على الملف الكامل)
  assessment:
    concerns:
      - "اللمّة الموجودة «لا أخلاقية» تفتقر إلى التشكيل الكامل الإلزامي"
      - "كتابة «لا أخلاقية» بمسافة بين الجزأين يخالف الاستخدام المعجمي القياسي؛ المعجم الكبير يُثبتها متصلة «اللَّأَخلاقِيَّة»"
      - "بعض المصادر (ARABTERM - القانون) تخلط بين «لا أخلاقية» و«الفجور» لترجمة immorality، ممّا يُنشئ لبساً دلالياً مع amorality"
      - "التعريف الحالي يضمّ معلومتين في جملة واحدة (التجرد من المعايير + الخروج من نطاق الحكم) مع تداخل دلاليّ بينهما، وأُسلوبه يصلح للتعديل"
      - "المجموعة تحتوي على لمّة واحدة؛ ينبغي البحث في مرادفات موثقة لإثراء التمثيل اللغوي"
    observations: >
      المفهوم «amorality» يُشير إلى الحياد القيميّ المطلق — أي الوقوع خارج نطاق الحكم الأخلاقي بالخير والشرّ — لا إلى مخالفة الأخلاق.
      هذا التمييز حاسم لأنّ العربية تستخدم أحياناً «اللاأخلاقية» بمعنى immorality أيضاً.
      اللمّة الموجودة صحيحة في جوهرها لكنها تحتاج ضبطاً شكلياً (تشكيل + توصيل).
      الاشتقاق بـ«لا» السابقة النافية (على غرار اللالاأدرية، اللاسلطوية، اللامركزية) منهج عربي مُنتج في المصطلحية الحديثة.

  # المرشحات الأربعة (مُولَّدة من التعريف فقط، بدون الاطلاع على اللمّات)
  blind_candidates:
    - lemma: "اللاَّأَخْلَاقِيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي المُشكَّل بسابقة النفي «لا» المتصلة + «أخلاقية» (مصدر صناعي من خُلُق)؛
        يُنتج اسماً مُجرَّداً يدلّ على صفة الخروج من منظومة الأخلاق.
        الوزن منتج في العربية المعاصرة (اللاسلطوية، اللامركزية، اللاأدرية).

    - lemma: "الغَفَالَة"
      generation_method: majaz
      justification: >
        من جذر غ-ف-ل: «كل ما لا معلم له غُفْل» (ابن فارس).
        مجازاً: الغفالة هي حال ما لا تنطبق عليه سِمَة أو علامة — الخلوّ من التصنيف.
        إحياء اللفظ العربي الميت للدلالة على الحياد من التوصيف الأخلاقي.

    - lemma: "غَيْرُ أَخْلَاقِيَّة"
      generation_method: tarkib
      justification: >
        مركب إضافي: «غير» (أداة النفي التقابليّ) + «أخلاقية» (مضاف إليه).
        يُبرز المعنى التقريريّ السلبيّ — الوصف بغياب السمة الأخلاقية —
        ويتوافق مع صيغ العربية التقنية الحديثة (غير رسمي، غير مباشر).

    - lemma: "التَّجَرُّدِيَّة"
      generation_method: ishtiqaq
      justification: >
        المصدر الصناعي من تجرَّد (جذر ج-ر-د على وزن التَّفَعُّل)؛
        ابن فارس: «الجيم والراء والدال أصل واحد، وهو بدوّ ظاهر الشيء حيث لا يستره ساتر».
        يُفيد التجرّد الكامل من المنظومة المعيارية الأخلاقية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# استعلامات منفَّذة: ٥ (batch headword + English bridge + Arabic FTS + Maqayis roots + Maqayis غير)
stage2_evidence:
  per_lemma:

    - lemma: "لا أخلاقية"
      expands:
        - text: "«أَخْلاقِيَّةٌ: morality: سِمَةُ ما هو أَخْلاقِيّ من عَمَلٍ فَرْدِيٍّ أو جماعِيّ, بوجه عام وتُقابِلُها اللَّأَخلاقِيَّة»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "يُثبت وجود مصطلح «اللأخلاقية» بالصيغة المتصلة ضدّاً لـ«أخلاقية»، مما يُؤكد المصطلح لكن يُرجّح الصيغة المتصلة دون مسافة"
      contradicts:
        - text: "«فُجُور، لا أخلاقية» → translation_en: immorality"
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM، 2017)"
          conflict: "يُساوي «لا أخلاقية» بـ immorality (الفجور/مخالفة الأخلاق)، وهو مفهوم مختلف عن amorality (الحياد الأخلاقي الخارج من نطاق الحكم)؛ هذا الخلط الدلالي يُضعف المصطلح في بعض السياقات القانونية"

    - lemma: "اللاَّأَخْلَاقِيَّة"
      confirm:
        - text: "«سِمَةُ ما هو أَخْلاقِيّ... وتُقابِلُها اللَّأَخلاقِيَّة»"
          source: "المعجم الكبير (مجمع اللغة العربية، OCR)"

    - lemma: "الغَفَالَة"
      expands:
        - text: "«وَيَقُولُونَ لِكُلِّ مَا لَا مَعْلَمَ لَهُ: غُفْلٌ، كَأَنَّهُ غُفِلَ عَنْهُ. فَيَقُولُونَ: أَرْضٌ غُفْلٌ: لَا عَلَمَ بِهَا. وَنَاقَةٌ غُفْلٌ: لَا سِمَةَ عَلَيْهَا. وَرَجُلٌ غُفْلٌ: لَمْ يُجَرِّبِ الْأُمُورَ»"
          source: "مقاييس اللغة لابن فارس (جذر غ-ف-ل)"
          addition: "يُثبت الأصل اللغوي للمجاز (الخلوّ من السمة/العلامة) لكنه لا يُثبت استخدام «الغفالة» مصطلحاً للحياد الأخلاقي"

    - lemma: "غَيْرُ أَخْلَاقِيَّة"
      confirm:
        - text: "headword: «غير أخلاقية» — translation_en: amorality — domain: Sociology and Anthropology"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM، المنظمة العربية للتربية والثقافة والعلوم)"
        - text: "headword: «غير أخلاقي» — translation_en: amoral — domain: Sociology and Anthropology"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM، المنظمة العربية للتربية والثقافة والعلوم)"

    - lemma: "التَّجَرُّدِيَّة"
