        - command: create_entry
          params:
            lemma: "مُسْتَفِيد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10137168-n"
    - lemma: "مُكْتَسِب"
      source: step05
      decision: confirmed
      decision_reason: "لفظ فصيح يعبر عن جني الفائدة وتحصيلها، وهو اسم فاعل من اكتسب التي تفسر معنى الربح."
      step05_citation: "«يُحْرِز؛ يَبلغ؛ يكتسب» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على نيل الشيء والحصول عليه بالجهد والمزاولة والتعلم."
      example: "المكتسب لمهارات جديدة يكون أقدر على تطوير عمله."
      actions:
