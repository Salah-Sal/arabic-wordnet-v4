      source_section: "step4_fts_keyword"
      evidence_citation: "«يُحْرِز؛ يَبلغ؛ يكتسب» — المورد الحديث (2008)"
      justification: "اشتقاق (اسم فاعل) من الفعل (اكتسب) الوارد في التعريف بمعنى يحرز ويبلغ الميزة."
  knowledge_candidates:
    - lemma: "مُسْتَفِيد"
      justification: "اشتقاق (اسم فاعل على وزن مُسْتَفْعِل) للدلالة على من يجني منفعة أو ميزة من شيء ما، وهو مرادف دقيق للمفهوم."

