      decision: confirmed
      decision_reason: "مصطلح فصيح وأساسي يدل على من يحصل على مكسب، وتؤكده المعاجم."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على من يجني ربحاً في تجارة أو منافسة."
      example: "كان هو الرابح الأكبر في تلك الصفقة التجارية."
    - lemma: "كَاسِب"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع يدل على تحصيل الرزق والمال."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على من يكتسب ويحصل على فائدة أو مال بعمله وجهده المباشر."
      example: "عاد الكاسب إلى أهله حاملاً قوت يومهم."
    - lemma: "مُسْتَفِيد"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع يدل على من يجني منفعة أو ميزة، ويتطابق تماماً مع دلالة التعريف (gains an advantage)."
      step05_citation: "معرفة لغوية عامة"
