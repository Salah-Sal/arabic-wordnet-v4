step0_evidence:
  per_lemma:
    - lemma: "رَابِح"
      confirm:
        - text: "«رَابِح من (ر ب ح) صاحب الربح والكاسب والكثير الربح.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      peripheral_observations:
        - "«مالٌ رَابِحٌ: ذو رِبْح. كقولك: لابِنٌ وتامِرٌ يَرُوج ويَرْجِع عليك نَفْعُه» — المعجم الكبير"
        - "«(الرابح) مَال رابح ذُو ربح» — المعجم الوسيط"
        - "«الفَصِيلُ, وهو وَلَدُ النَّاقَةِ» — المعجم الكبير"
    - lemma: "كَاسِب"
      confirm:
        - text: "«كَاسِب من (ك س ب) من يطلب الرزق والمعيشة، ومن يربح المال.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

step05_lemma_generation:
