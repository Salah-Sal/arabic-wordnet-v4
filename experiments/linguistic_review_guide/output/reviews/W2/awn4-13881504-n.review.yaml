# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13881504-n
# التعريف: تغيير كبير — a significant change
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «تغيير كبير» مقتضب جداً ولا يميّز هذا المفهوم عن أنواع التغيير الأخرى"
      - "لمّة «اخْتِلَاف» دلالتها الأساسية في المعاجم الكلاسيكية هي التقابل بين الآراء (ضدّ الاتفاق)، لا مجرد التغيير الكبير"
      - "لمّة «فَرْق» دلالتها الأولى هي التمييز بين أمرين لا التغيير بحدّ ذاته"
    observations: "المجموعة تقع تحت المفهوم الأعمّ «تَغْيِير» وتخصّصه بسمة الكِبَر والوضوح. المفهوم الإنجليزي difference بمعنى a significant change يشير إلى تغيّر ملحوظ يمكن رصده (مثل: the difference in her appearance). اللمّتان الموجودتان تغطّيان جانب «الفَرْق/الاختلاف» أكثر من جانب «التغيّر الكبير»، لكنّهما مقبولتان في هذا الاستعمال العربي الشائع: «لاحظتُ اختلافاً كبيراً»، «ما الفَرْق بين ما قبلُ وما بعدُ؟»."
  blind_candidates:
    - lemma: "تَحَوُّل"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من الجذر «حول» على وزن يدل على الانتقال من حال إلى حال، وهو أقرب المشتقات إلى مفهوم التغيير الكبير"
    - lemma: "نَقْلَة"
      generation_method: ishtiqaq
      justification: "اسم مرة من «نقل» بمعنى الانتقال الكبير أو الطَّفْرة، يُستعمل في العربية المعاصرة بمعنى التحوّل النوعي: «نقلة نوعية»"
    - lemma: "تَبَايُن"
      generation_method: ishtiqaq
      justification: "مصدر تَفَاعُل من «بين» يدل على التباعد والافتراق بين حالتين، يُستعمل بمعنى الفارق الواضح"
    - lemma: "فَارِق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «فرق» بمعنى ما يميّز أمراً من أمر، مسجّل في المعجم الوسيط كاسم بجمع «فوارق»"


stage2_evidence:
  per_lemma:
    - lemma: "اخْتِلَاف"
      confirm:
        - text: "«اخْتِلافُ المَوْضِع (فى علم الضوء) parallax: تَغَيُّرُ مَنظر المرْئِيِّ بتحرُّكِ الرَّائِي»"
          source: "المعجم الكبير"
        - text: "«اختلاف — variance»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«اِخْتِلاف — variation»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الاختلاف: افتعال من الخلاف، وهو تقابل بين رأيين فيما ينبغي انفراد الرأي فيه، ذكره الحرالي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الدلالة الأصلية هي التقابل في الآراء، لا مجرد التغيّر"
        - text: "«الاختلاف لغة ضدّ الاتفاق... وعند أهل الحق من المتكلّمين كون الموجودين غير متماثلين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "في الكلام: عدم التماثل بين موجودين"
        - text: "«الاخْتِلافُ (فى الفِقْه): ذَهابُ كُلِّ واحِدٍ إِلى غَيْرِ ما ذَهَبَ إليه الآخَر, أو ضِدُّه»"
          source: "المعجم الكبير"
          addition: "الاستعمال الفقهي يؤكد دلالة التباين والتعارض"

    - lemma: "فَرْق"
      confirm:
        - text: "«(الْفرق) بَين الْأَمريْنِ الْمُمَيز أَحدهمَا من الآخر (ج) فروق»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«بين الأمرين: المميز أحدهما من الآخر»"
          source: "المعجم الوسيط"
        - text: "«فَرْق — difference»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«فَرْق — difference»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«فرق — difference»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      expands:
        - text: "«الفرق:[في الانكليزية] Difference ،distinction بالفتح وسكون الراء عند الأصوليين وأهل النظر هو أن يفرّق المعترض بين الأصل والفرع بإبداء ما يختصّ بأحدهما لئلّا يصح القياس»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "في أصول الفقه: إبداء وجه الاختصاص بأحد الطرفين"

    - lemma: "تَحَوُّل"
      contradicts:
        - text: "«في علم الأحياءِ metamorphosis: تغيَّرُ عُضْوٍ في شَكْلِهِ إلى شَكْلِ عُضْوٍ آخَرَ... تَغَيُّرُ الكائِنِ من طَوْرٍ إلى طَوْرٍ»"
          source: "المعجم الكبير"
          conflict: "التحوّل يدل على تغيّر جذري في الماهية (metamorphosis/transformation) لا مجرد فارق كبير"
        - text: "«التَّحَوُّل: المُرَاد بِهِ تحول الْفَاعِل إِلَى الْفِعْل نَحْو استحجر الطين أَي تحول إِلَى الْحجر وَصَارَ حجرا»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "التحوّل يعني الصيرورة والتبدّل الكامل، وهو أخصّ من مجرد التغيير الكبير"

    - lemma: "نَقْلَة"
      evidence_status: "no_material_found"

    - lemma: "تَبَايُن"
      confirm:
        - text: "«مُباينة، اختـلاف — difference»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«التباين: ما إذا نسب أحد الشيئين إلى الآخر لم يصدق أحدهما على شيء مما صدق عليه الآخر»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "التباين في المنطق يعني عدم التصادق الكلي، وهو أقوى من مجرد الاختلاف"
        - text: "«التّباين: يرادف المباينة عند المحاسبين وكذا عند المنطقيين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التباين مصطلح منطقي-حسابي محدد، يختلف عن مفهوم التغيير الكبير"
        - text: "«تَبَايُن — contrast / variance»"
          source: "معاجم عربترم المتعددة"
          conflict: "يُستعمل بمعنى التقابل (contrast) أو التباين الإحصائي (variance)، وكلاهما أخصّ من المفهوم المطلوب"

    - lemma: "فَارِق"
      confirm:
        - text: "«(الْفَارِق) مَا يُمَيّز أمرا من أَمر (ج) فوارق»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«ما يميز أمراً من أمر»"
          source: "المعجم الوسيط"
      expands:
        - text: "«وردت كلمة فارِق في المعاجم الحديثة بمعنى ما يميِّز أمرًا من أمر، ومن ثم يجوز استعمالها على معنى الفاعل، كما يجوز استعمال فرْق على معنى المصدر»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "فارِق اسم فاعل يُستعمل استعمال الأسماء لا المصادر، في مقابل فَرْق المصدري"


stage3_analysis:
  per_lemma:
    - lemma: "اخْتِلَاف"
      decision: confirmed
      decision_reason: "لمّة فصيحة مصدرية من «اختلف» على وزن افتعال، مستعملة بمعنى التغاير والتباين بين حالتين. ثابتة في المعاجم الحديثة والكلاسيكية، ومستعملة استعمالاً واسعاً في المعاجم المصطلحية (variance, variation, divergence). تناسب المفهوم من حيث إنها تدل على وجود فارق ملحوظ بين ما قبلُ وما بعدُ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على عدم التوافق بين حالتين أو طرفين، ويحمل إيحاءً بالتقابل أو التعارض أكثر من مجرد التمييز المحايد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اخْتِلَاف"

    - lemma: "فَرْق"
      decision: confirmed
      decision_reason: "لمّة أصيلة من الجذر «فرق» الدالّ على التمييز والتزييل بين شيئين (كما في مقاييس اللغة). مسجّلة في المعجم الوسيط بمعنى «المميز أحدهما من الآخر»، ومستعملة في عشرات المعاجم المصطلحية بمعنى difference. لمّة محورية في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على المميِّز المحايد بين أمرين دون إيحاء بالتعارض، وهو أعمّ استعمالاً وأكثر حياداً من «اختلاف»"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَرْق"

    - lemma: "تَحَوُّل"
      source: stage1
      decision: removed
      decision_reason: "التحوّل يدل على تغيّر جذري في الماهية أو الانتقال من طور إلى طور (metamorphosis, transformation)، وهو أخصّ وأعمق من مجرد التغيير الكبير الذي تعنيه المجموعة. لا يصح وضعه مرادفاً لـ«فرق» و«اختلاف»."
      evidence_assessment:
        case: contradicts_only

    - lemma: "نَقْلَة"
      source: stage1
      decision: removed
      decision_reason: "لمّة لم تُوثَّق بمعنى الفارق أو التغيير الكبير في المعاجم. استعمالها بمعنى «طفرة نوعية» حديث وعامّي، ولا يرقى لمستوى التثبيت المعجمي. كما أنّ اسم المرّة يدل على حدث واحد لا على حالة مستمرة."
      evidence_assessment:
        case: no_material

    - lemma: "تَبَايُن"
      source: stage1
      decision: removed
      decision_reason: "التباين مصطلح محدد الدلالة في المنطق (عدم التصادق) وفي الإحصاء (variance) وفي الفنون (contrast). دلالته الاصطلاحية أخصّ من مفهوم المجموعة، وقد يسبّب لبساً. وهو فعلاً مُسجَّل ضمن مجموعات أخرى بمعانٍ مختلفة."
      evidence_assessment:
        case: mixed

    - lemma: "فَارِق"
      source: stage1
      decision: removed
      decision_reason: "فارِق اسم فاعل يدل على الوصف (ما يميِّز) لا على الحدث (التغيير نفسه). المعجم الوسيط يعرّفه بـ«ما يميز أمراً من أمر» وهو أقرب إلى differentia منه إلى difference. كما أنّ معجم الصواب اللغوي يقابله بـ«فَرْق» (المصدر) الموجود أصلاً في المجموعة، فإضافته ستكون تكراراً دون قيمة مضافة."
      evidence_assessment:
        case: confirm_only


