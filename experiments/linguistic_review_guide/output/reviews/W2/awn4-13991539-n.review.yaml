            بالحِرفة وبالقوى العاملة]
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الوسيط يُثبت الاستعمال الحديث بمعنى القوى العاملة إلى جانب المعنى الأصلي"
        - text: >
            «عِمَالة — يحتاج هذا المصنع إلى عِمالة كثيرة [صحيحة] — التعليق: العِمَالة في
            المعاجم القديمة تعني أجر العامل أو حِرفته، وتستعمل الكلمة حديثاً بمعنى
            «العُمَّال»، ويمكن تصحيح هذا الاستعمال لإجازة مجمع اللغة المصري له»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "مجمع اللغة المصري أجاز الاستعمال الحديث بمعنى القوى العاملة وحالة الانتظام في العمل"

    - lemma: "تَوَظُّف"
      evidence_status: "no_material_found"

    - lemma: "اِشْتِغَال"
      contradicts:
