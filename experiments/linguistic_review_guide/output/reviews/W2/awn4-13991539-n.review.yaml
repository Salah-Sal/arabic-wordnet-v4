# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-13991539-n  |  ILI: i110340  |  POS: n
# المفهوم: حالة كون الشخص موظَّفاً أو لديه وظيفة
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «استخدام» ذات دلالة أشمل (استخدام/توظيف الأشياء والأشخاص)؛ وأقرب إلى مفهوم الاستخدام/التوظيف الفِعلي لا «حالة كون الشخص موظَّفاً»"
      - "لمّة «عمل» عامة جداً وتشمل الفعل والمهنة والعمل الإنتاجي بعمومه، مع غياب التخصيص لحالة التوظيف"
      - "التعريف الحالي «حالة كونه موظفاً» يتضمن ضميراً عائداً بلا مرجع صريح، ويفتقر إلى الجنس والفصل المنطقيَّين"
      - "لا تشكيل على أي لمّة من اللمّات الثلاث المسجَّلة"
    observations: >
      المجموعة تمثّل المفهوم الاسمي «حالة التوظيف» (employment as a state)، في مقابل الفعل
      المتعدّي «توظيف شخص ما» (the act of employing). اللمّتان «استخدام» و«توظيف» تصلحان
      في الأصل للدلالة على الفعل المتعدّي أكثر من الحالة؛ أما «عمل» فهو أعمّ من أن يختص
      بهذا المعنى. يحتاج السِّجلّ إلى:
      (أ) تدقيق الملاءمة الدلالية لـ«استخدام» في هذا السياق تحديداً،
      (ب) إضافة «عِمَالَة» التي هي أقرب إلى المعنى المقصود في الخطاب الاقتصادي والاجتماعي،
      (ج) مراجعة التعريف وتنقيته.
  blind_candidates:
    - lemma: "عِمَالَة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر عمل على وزن فِعَالَة (أجرة العامل، حِرفته)؛ ثم استُعملت
        حديثاً في مجمع اللغة المصري لتدلّ على حالة الانتظام في العمل المأجور.
        تقابل «البطالة» مباشرةً مما يؤكد تخصّصها في حالة التوظيف لا الفعل.
    - lemma: "تَوَظُّف"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل توظّف على وزن تَفَعُّل من الجذر وظف؛ يُعبّر عن الحالة
        الانعكاسية (كون الشخص نفسه موظَّفاً)، في مقابل «توظيف» المتعدّي
        (إسناد الوظيفة لغيرك). وزن تَفَعُّل يُناسب الحالة الثابتة لا الفعل المتعدّي.
    - lemma: "اِشْتِغَال"
      generation_method: ishtiqaq
      justification: >
        مصدر اشتغل من الجذر شغل على وزن اِفْتِعَال؛ يدلّ على الانشغال
        بالعمل والامتلاء به. ابن فارس: الشين والغين واللام «يدل على خلاف الفراغ».
        محاولة لسدّ الفجوة الدلالية بين «عمل» العام وحالة التوظيف تحديداً.
    - lemma: "تَعَيُّن"
      generation_method: ishtiqaq
      justification: >
        مصدر تعيَّن على وزن تَفَعُّل من الجذر عين؛ يدلّ على حالة كون الشخص
        مُعيَّناً في منصبه، وهو يُعبّر عن الجانب الرسمي/الإداري لحالة التوظيف.
        «موظف معيَّن» = حالة فعلية من الخدمة الوظيفية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "استخدام"
      confirm:
        - text: >
            «(1) «أ» استعمال. «ب» استخدام؛ توظيف / (2) عمل؛ وظيفة / (3) خِدمة /
            (4) العِمَالة: العَمَل كَسْبًا للرزق» — [الإدخال الخاص بـ employment]
          source: "المورد الحديث (2008)"
        - text: "استخدام، تشغيل — [employment; emploi]"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: >
            «الِاسْتِخْدَام: فِي اللُّغَة طلب الْخدمَة عَن شَيْء، وَعند أَصْحَاب البديع
            هُوَ أَن يذكر لفظ لَهُ مَعْنيانِ حقيقيان أَو مجازيان... فيراد بِهِ أَحدهمَا
            ثمَّ يُرَاد بالضمير الرَّاجِع إِلَى ذَلِك اللَّفْظ مَعْنَاهُ الآخر»
          source: "دستور العلماء للأحمدنكري"
          conflict: "المعنى اللغوي الأصيل = طلب الخدمة أو مصطلح بلاغي؛ لا يدلّ على حالة كون الشخص موظَّفاً"
        - text: >
            «الاستخدام: هو أن يذكر لفظ له معنيان، فيراد به أحدهما، ثم يراد بالضمير
            الراجع إلى ذلك اللفظ معناه الآخر»
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "المصطلح في الموروث البلاغي لا يتصل بمفهوم التوظيف"
        - text: "استخدام — application / use [Water Engineering]"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "الدلالة الغالبة في معاجم المصطلحات هي «الاستخدام/التوظيف بمعنى الاستعمال»، لا حالة العامل"
      expands:
        - text: "استخدام — emplyement [sic] [Arts, Recreation and Sports]"
          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "وُجدت ترجمة employment لـ استخدام في هذا المسرد (مع خطأ إملائي)، وهو استخدام هامشي"

    - lemma: "توظيف"
      confirm:
        - text: >
            «تَوْظِيفالجذر: و ظ ف — مثال: توظيف الخريجين — الرأي: مرفوضة — السبب:
            لأنها لم ترد عن العرب بهذا المعنى — الصواب والرتبة: توظيف الخريجين [فصيحة]
            — التعليق: جاء في أساس البلاغة: عليه كل يوم وظيفة من عمل، ووَظَّف عليه
            العمل، وفي التاج: التوظيف تعيين الوظيفة، ومن هذه المعاني جاء الاستعمال
            الحديث «توظيف الخريجين» بمعنى إسناد وظيفة إليهم»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "توظيف — employment [Geography and History]"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "تَوْظِيفٌ — employment [Educational Governance]"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية (2020)"
        - text: "التوظيف الريفي — rural employment"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      contradicts:
        - text: >
            «يجب التمييز بين: التوظيف والتمويل والاستثمار فالتوظيف: تعيين المال في مكانه،
            في وظيفته [investissement]؛ والتمويل: إعطاء المال [financement]؛
            والاستثمار: استغلاله [exploitation]»
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "في السياق الاقتصادي توظيف = investment (توظيف الأموال)؛ لا العمالة البشرية"
        - text: "توظيف — placement [أموال]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "في التجارة توظيف = وضع المال، وليس التوظيف الوظيفي"

    - lemma: "عمل"
      confirm:
        - text: "(الْعَمَل) المهنة وَالْفِعْل (ج) أَعمال — وفي الاقتصاد: مجهود يبذله الإنسان لتحصيل منفعة"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "المهنة والفعل أعمال المركز: ما يكون تحت حكمه — (فى الاقتصاد): مجهود يبذله الإنسان لتحصيل منفعة"
          source: "المعجم الوسيط — OCR"
        - text: "وظيفة، عملٌ — job; métier; profession; fonction"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "عمل — job [Dictionary of Information Technology Terms]"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«(1) «أ» عمل؛ شغل لقاء أجر محدَّد — «د» منصب — «هـ» وضع؛ حالة؛ مسألة»"
          source: "المورد الحديث (2008) — [الإدخال الخاص بـ job]"
      expands:
        - text: >
            «(عَمِلَ) الْعَيْنُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ، وَهُوَ
            عَامٌّ فِي كُلِّ فِعْلٍ يُفْعَلُ. قَالَ الْخَلِيلُ: عَمِلَ يَعْمَلُ عَمَلًا
            فَهُوَ عَامِلٌ. وَالْعِمَالَةُ: أَجْرُ مَا عُمِلَ»
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر عام في كل فعل؛ والعِمَالة = الأجر، مما يشير إلى الصلة الأصيلة للجذر بالتعويض على العمل"
        - text: >
            «العَمَلُ: كل فعل من الحيوان بقصد فهو أخص من الفعل لأن الفعل قد ينسب إلى
            الحيوان الذي يقع منه فعل بغير قصد، وقد ينسب إلى الجماد، والعمل قلما ينسب
            إلى ذلك»
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "التعريف يُظهر عمومية «العمل» وعدم اختصاصه بحالة التوظيف"

    - lemma: "عِمَالَة"
      confirm:
        - text: "عمالة — employment [Commerce and Accounting]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "عمالة — employment [Sociology and Anthropology]"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "عمالة الشباب — youth employment"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: >
            «(1) «أ» استعمال... «ب» استخدام؛ توظيف / (4) العِمَالة: العَمَل كَسْبًا للرزق»
          source: "المورد الحديث (2008) — [employment]"
        - text: >
            «قَوَانِين العِمَالة [فصيحة] — التعليق: أوردت المعاجم الحديثة لهذا المعنى
