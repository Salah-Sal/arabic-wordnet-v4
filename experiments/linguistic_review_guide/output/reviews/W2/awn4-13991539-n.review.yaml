            الفتح قياساً... وقد سجَّلت المعاجم الحديثة هذا الاستعمال»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: "«العِمَالَةُ — أجرة العامل / حِرفته»"
