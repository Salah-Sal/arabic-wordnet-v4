          conflict: >
            المعنى الأصلي = الأجرة أو الحِرفة؛ المعنى الحديث «حالة التوظيف» هو توسّع دلالي
            مجازي أجازه مجمع اللغة لا المعنى التأصيلي
        - text: >
            «العمالة: بالضم وبالكسر رزقُ العامل وبالفتح عمل الناقة»
