# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان الموجودتان (حقيقية، واقعية) مكتوبتان بلا تشكيل، وهذا يخالف اشتراط التشكيل الكامل في AWN4"
      - "واقعية في المعجمية العربية تُحيل أوّلاً إلى 'الواقعية' الفلسفية والأدبية (realism) لا إلى 'فعلية المعلومة' (factuality)، مما يُنشئ التباساً دلالياً خطيراً"
      - "حقيقية صيغة نسب مؤنثة (حَقِيقِيَّة)، لا اسم مصدر صريح؛ توظيفها اسماً مجرداً يحتاج إلى توثيق معجمي"
      - "غياب لمّة راسخة تُعبِّر تعبيراً مباشراً عن خاصية 'كون الشيء فعلياً' (actuality بالمعنى المنطقي)"
      - "التمييز الدلالي بين اللمّتَين غائب تماماً في البيانات الحالية"
    observations: >
      المجموعة تمثّل مفهوماً فلسفياً-معرفياً مجرداً: الخاصية التي تجعل الشيءَ متطابقاً مع الوقائع
      ومستنداً إليها. تندرج تحت الـhypernym «جودة/نوعية» (awn4-04731092-n)، وهو مناسب.
      في العربية يُعبَّر عن هذا النوع من المفاهيم غالباً بـ«المصدر الصناعي» (الـ-يَّة) المشتق من
      نعت الجنس: فِعْلِيّ → فِعْلِيَّة، حَقِيقِيّ → حَقِيقِيَّة. المشكلة أن «واقعية» يحمل دلالة
      ثانية طاغية (realism الفلسفي/الأدبي) تُوقع الخلط. المفهوم له جذور في التراث العربي عبر
      ألفاظ كالحق (ضد الباطل)، والثبوت، والصدق، والفعل، غير أنّ صياغة مصطلح محدَّد للدلالة
      على «factuality» بالمعنى المعاصر قد تكون محدودة في المعجمية الكلاسيكية.

  blind_candidates:
    - lemma: "ثُبُوتِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الجذر ث-ب-ت على وزن فُعُولِيَّة/فُعُوتِيَّة. «الثبوت» دالٌّ على
        الدوام والرسوخ، و«الثبوتية» تُشير إلى خاصية الشيء المستند إلى أصل ثابت راسخ.
        صيغة مقبولة صرفياً، وإن كانت أميل إلى دلالة الاستقرار منها إلى الاستناد إلى الحقائق.

    - lemma: "صِدْقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الجذر ص-د-ق؛ «الصِّدْق» عند ابن فارس يدل على «القوة في الشيء»
        ومنه مطابقة القول للواقع. «الصِّدْقِيَّة» تُشير إلى خاصية التطابق مع الحقيقة
        (truth-aptness)، وهي مفهوم مرتبط بالفعلية وإن كان أوسع.

    - lemma: "تَوَثُّقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الجذر و-ث-ق (التوثُّق = الاستناد إلى ما وُثِّق وثبت). يُشير
        إلى خاصية كون الشيء قائماً على أدلة موثقة. وزن «تَفَعُّل» يُفيد الاكتساب
        التدريجي للصفة، مما يُناسب فكرة الاستناد إلى السجلات والوقائع.

    - lemma: "فِعْلِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الصفة النسبية «فِعْلِيّ» (actual) على النمط الأكثر إنتاجية في
        العربية المعاصرة (نعت + يَّة → اسم مجرد). لا يُعدُّ تكراراً دوّاراً لكلمة
        «فعلياً» الواردة في التعريف؛ إذ تختلف الوظيفة النحوية والمقولة الصرفية اختلافاً
        جوهرياً: «فعلياً» ظرف حال، و«فِعْلِيَّة» اسم خاصية مجردة. الصيغة مقيسة وتُشير
        تحديداً إلى «كون الشيء فعلياً» بالمعنى الأنطولوجي (actuality vs. potentiality).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ── ميزانية الاستعلامات المُنفَّذة ──
  # ١. مطابقة دقيقة دفعية: حقيقية+واقعية+ثبوتية+صدقية+يقينية [كل منها مع/بدون ال-]
  # ٢. جسر إنجليزي: factuality OR factualness OR factual OR actuality
  # ٣. إثراء (definitions+examples) بالـentry_id
  # ٤. FTS كلمات مفتاحية: واقعية OR حقيقية OR فعلية OR الفعلية OR واقعي OR حقيقي
  # ٥. مقاييس اللغة: وقع / حقق(حق) / فعل / ثبت / صدق

  per_lemma:

    # ───── لمّة موجودة: حقيقية ─────
    - lemma: "حقيقية"
      expands:
        - text: "«واقعيّ؛ حقيقيّ»"
          source: "المورد الحديث (2008) — ترجمة المدخل الإنجليزي factual"
          addition: >
            يُثبت أن «حقيقيّ» هو المقابل العربي للصفة factual، ومنه يُستنتج أن
            المصدر الصناعي «حَقِيقِيَّة» يصلح مقابلاً لـfactualness/factuality
            عبر قياس منتج، وإن لم يرد المصدر الصناعي مستقلاً كمدخل.
        - text: "«سوق حقيقية» → actual market؛ «قيمة فعلية، قيمة حقيقية» → effective value"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — أراب تيرم"
          addition: >
            يُظهر توظيف «حقيقية» صفةً في مصطلحات تقنية بمعنى «actual/factual»، مما
            يعزز قبولها مصدراً صناعياً (حقيقيّة) في نفس الحقل الدلالي.

    # ───── لمّة موجودة: واقعية ─────
    - lemma: "واقعية"
      contradicts:
        - text: >
            «(فى الفلسفة): مذهب يلتزم فيه التصوير الأمين لمظاهر الطبيعة والحياة كما هي,
            وكذلك عرض الآراء والأحداث والظروف والملابسات دون نظر مثالى — مذهب أدبيٌّ
            يعتمد على الوقائع, ويُعنى بتصوير أحوال المجتمع»
          source: "المعجم الوسيط (مجمع اللغة العربية، OCR)"
          conflict: >
            التعريف الوسيطي يحصر «واقعية» في الدلالة الاصطلاحية «realism» (مذهب
            فلسفي/أدبي)، لا في الخاصية المجردة «factuality». هذا التعارض جوهري:
            المجموعة المُراجَعة تمثّل «the quality of being factual» لا «realism».
        - text: "«واقعية» → realism (Language and Literature, Education, Philosophy and Psychology)"
          source: "مسردات أراب تيرم (1995–2002) — ثلاثة مسارد متخصصة"
          conflict: >
            تُترجم «واقعية» في ثلاثة مسارد تخصصية مختلفة بـ realism فحسب، مما يؤكد
            أن الدلالة الاصطلاحية الراسخة لـ«واقعية» في العربية المتخصصة هي
            «الواقعية» كمذهب، وليس «factuality» كخاصية.

    # ───── مرشح المرحلة ١: ثبوتية ─────
    - lemma: "ثُبُوتِيَّة"
      evidence_status: "no_material_found"

    # ───── مرشح المرحلة ١: صدقية ─────
    - lemma: "صِدْقِيَّة"
      evidence_status: "no_material_found"

    # ───── مرشح المرحلة ١: توثقية ─────
    - lemma: "تَوَثُّقِيَّة"
      evidence_status: "no_material_found"

    # ───── مرشح المرحلة ١: فعلية ─────
    - lemma: "فِعْلِيَّة"
      confirm:
        - text: >
            «(1) الفعليّة: كونُ الشيء فعليًّا
             (2) حقيقة؛ واقع actualities of life.»
          source: "المورد الحديث (2008) — ترجمة المدخل الإنجليزي actuality"
        - text: "«(1) فعليّ (2) واقعيّ (3) حقيقيّ actual costs (4) حاليّ the actual position of the moon.»"
          source: "المورد الحديث (2008) — ترجمة المدخل الإنجليزي actual"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:

  per_lemma:

    # ─────────────────────────────────────────────────
    # لمّة موجودة: حقيقية
    # ─────────────────────────────────────────────────
    - lemma: "حقيقية"
      decision: confirmed
      decision_reason: >
        المصدر الصناعي «حَقِيقِيَّة» من الجذر ح-ق-ق مقبول وقياسي للدلالة على خاصية
        «الحقيقية» (factualness). المعاجم تُثبت «حقيقيّ» مقابلاً لـfactual (المورد
        الحديث)، ومن ثَمَّ فـ«حَقِيقِيَّة» هو المصدر الصناعي المقابل لـfactualness.
        وردت «حقيقية» في مصطلحات التجارة والمحاسبة صفةً بمعنى actual/factual، وهو
        ما يُعزِّز الاستخدام الاصطلاحي لنفس الجذر. اللمّة تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphological_check:
        wazn: "فَعِيلِيَّة (نسبة مؤنثة → مصدر صناعي)"
        verdict: "مقبول — النسبة المؤنثة المحوَّلة إلى مصدر صناعي نمط منتج في العربية المعاصرة"
      borrowing_check:
        verbal: "عربي خالص"
        calque: "لا"
        semantic_accuracy: "دقيق — الجذر حقق يدل على إتمام الشيء وصحته (ابن فارس)"
      quality_gate:
        consistency: "مطّرد في المصطلحات التقنية العربية"
        ease: "سهل التداول والاشتقاق"
        suitability: "مناسب للسياق المعرفي والفلسفي"
        heritage_preference: "جذر تراثي أصيل (حقق)"
        arabic_preference: "عربي بامتياز"
        derivability: "مشتق اشتقاقاً سليماً"
      nuance_differentiation: >
        يُركِّز على الانتساب إلى «الحقيقة» بمعنى الأصالة وعدم الزيف والتطابق مع
        الواقع؛ يُناسب سياقات التحقق من صحة المحتوى والهوية والادعاءات.
        يختلف عن «فِعْلِيَّة» التي تُشير إلى الوجود الفعلي بالتحقق في عالم الواقع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَقِيقِيَّة"

    # ─────────────────────────────────────────────────
    # لمّة موجودة: واقعية
    # ─────────────────────────────────────────────────
    - lemma: "واقعية"
      decision: removed
      decision_reason: >
        «واقعية» راسخة في المعجمية العربية للدلالة على «الواقعية» بوصفها مذهباً
        فلسفياً وأدبياً (realism)، وليس خاصية «factuality». أثبتت ثلاثة مسارد
        تخصصية مستقلة (أراب تيرم) أن ترجمتها الاصطلاحية هي realism لا factuality.
        إبقاؤها في هذه المجموعة يخلط بين مفهومَين متباينَين: الواقعية الفلسفية
        (philosophical realism) وفعلية الاستناد إلى الحقائق (factuality). الجذر
        وقع (Maqayis: «يدل على سقوط شيء») لا يُفضي طبيعياً إلى خاصية «كون الشيء
        مستنداً إلى حقائق»، بل إلى «ما حدث ووقع».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ─────────────────────────────────────────────────
    # مرشح المرحلة ١: ثبوتية
    # ─────────────────────────────────────────────────
    - lemma: "ثُبُوتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد معجمية، ودلالة «الثبوت» تنصبُّ على «الدوام والرسوخ والاستقرار»
        (ابن فارس: «كلمة واحدة وهي دوام الشيء») لا على «الاستناد إلى الحقائق».
        الفرق بين «ثبوتية» (permanence quality) و«فعلية» (actuality quality) جوهري.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ─────────────────────────────────────────────────
    # مرشح المرحلة ١: صدقية
    # ─────────────────────────────────────────────────
    - lemma: "صِدْقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد معجمية. «الصدق» عند ابن فارس «يدل على قوة في الشيء قولاً وغيره،
        ومنه الصدق خلاف الكذب» — وهذه دلالة «truthfulness» و«veracity» وليست «factuality».
        صِدقية الأقرب إلى خاصية الصدق والوثوقية، لا إلى خاصية الاستناد إلى الوقائع.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ─────────────────────────────────────────────────
    # مرشح المرحلة ١: توثقية
    # ─────────────────────────────────────────────────
    - lemma: "تَوَثُّقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد معجمية. «التوثُّق» يُحيل إلى «اكتساب الوثوق بالاستناد إلى وثائق
        وأدلة» — وهي مفهوم أجرائي (process) لا خاصية ذاتية (property). المجموعة
        awn4-04766683-n تمثّل «the quality of being factual» وليس «the act of documenting».
        علاوة على ذلك وزن «تَفَعُّل» يُفيد الحدث لا الخاصية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ─────────────────────────────────────────────────
    # مرشح المرحلة ١: فعلية
    # ─────────────────────────────────────────────────
    - lemma: "فِعْلِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        «فِعْلِيَّة» مُثبَتة في المورد الحديث (2008) ترجمةً مباشرة لـ«actuality» بالتعريف
        الصريح: «كونُ الشيء فعليًّا» — وهو توافق دلالي تام مع تعريف المجموعة «صفة كون
        الشيء فعلياً». ليست تكراراً دوّاراً للتعريف؛ إذ «فعلياً» في التعريف ظرفٌ حالٌ،
        بينما «فِعْلِيَّة» اسمٌ مصدري يُشير إلى الخاصية المجردة ذاتها، كما أن
        «فِعْلِيَّة/actuality» لها استخدام فلسفي راسخ (أرسطو: الفعل vs. القوة) يُفرِّق
        بين ما هو موجود بالفعل وما هو موجود بالقوة. الصيغة الصرفية (مصدر صناعي من
        نعت نسبي) قياسية ومنتجة. يُعزِّز هذا أن «فعلي/فعلية» استخدمت في مصطلحات
        التجارة بمعنى actual: «قيمة فعلية» = effective value، «سوق حقيقية أو فعلية».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check:
        wazn: "فِعْلِيَّة (مصدر صناعي من نعت نسبي)"
        verdict: "مقبول — نمط منتج قياسي"
      borrowing_check:
        verbal: "عربي خالص"
        calque: "لا"
        semantic_accuracy: "دقيق — الجذر فعل يدل على إحداث شيء من عمل وغيره (ابن فارس)"
      quality_gate:
        consistency: "مطّرد (فعلي → فعلية)"
        ease: "سهل التداول والاستعمال في الفلسفة والمنطق"
        suitability: "بالغ الملاءمة للسياق الفلسفي والمنطقي"
        heritage_preference: "جذر تراثي فصيح (فعل)"
        arabic_preference: "عربي خالص"
        derivability: "اشتقاق سليم منتج"
      nuance_differentiation: >
        يُركِّز على الوجود الفعلي والتحقق في عالم الواقع (actuality)؛ يُناسب سياقات
        الفلسفة والمنطق للتمييز بين «ما هو بالفعل» و«ما هو بالقوة». يختلف عن
        «حَقِيقِيَّة» التي تُركِّز على الانتساب إلى الحقيقة وعدم الزيف.
      actions:
        - command: create_entry
          params:
            lemma: "فِعْلِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:

  definition:
    current: "صفة كون الشيء فعلياً أو مستنداً إلى حقائق"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح من حيث المضمون لكنه يجمع بين شِقَّين قد يُفضيان إلى
        مفهومَين مختلفَين: «كون الشيء فعلياً» (actuality — وجود بالفعل لا بالقوة)
        و«الاستناد إلى حقائق» (factuality — مطابقة الادعاء للوقائع). التعريف
        بأسلوب المعجم الوسيط يقتضي جنساً قريباً (صفة/خاصية) وفصلاً نوعياً واضحاً،
        مع تجنّب إعادة استخدام اللفظ المُعرَّف في التعريف (الدوران).
    authored:
      - type: terminological
        text: >
          خاصِيَّةُ الشَّيءِ المُستَنِدِ إلى وقائعَ ثابتةٍ لا إلى ظنٍّ أو تخمينٍ؛
          تُميَّز به المعلوماتُ والتصريحاتُ الموثوقةُ عن تلك القائمةِ على الخيالِ
          أو التحيُّزِ أو الادِّعاءِ غيرِ المُبرهَن
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          كَوْنُ الشَّيءِ مُطابِقاً للحقيقةِ ومُستَمَداً من الوقائعِ لا من الرأيِ
          المُجرَّدِ أو الافتراضِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
