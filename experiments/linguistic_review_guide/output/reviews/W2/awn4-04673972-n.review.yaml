stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدو ترجمة حرفية للتعريف الإنجليزي (سمة التصرف بطرق تعتبر نموذجية للرجال) ويحتاج إلى صياغة عربية أسلس."
      - "التمييز بين الدلالة البيولوجية والاجتماعية في المعاجم العربية القديمة لم يكن دقيقاً، لكن الاستخدام الحديث يفرق بينهما."
    observations: "المفهوم يشير إلى (masculinity) أو الخصائص المرتبطة بالرجال (manliness). اللمتان الموجودتان (ذكورة، رجولة) دقيقتان، لكن بينهما فرق دلالي؛ فالذكورة تميل للجانب البيولوجي والاجتماعي العام، والرجولة تميل للجانب القيمي والأخلاقي."
  blind_candidates:
    - lemma: "ذُكُورَة"
      generation_method: ishtiqaq
      justification: "مصدر يدل على حالة كون الكائن ذكراً وما يرافقه من سمات."
    - lemma: "رُجُولَة"
      generation_method: ishtiqaq
      justification: "مصدر يدل على التحلي بصفات الرجل المكتملة."
    - lemma: "ذُكُورِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي يستخدم حديثاً للتعبير عن السمات والنظم المرتبطة بالذكور."
    - lemma: "فُحُولَة"
      generation_method: majaz
      justification: "مصدر يستخدم مجازاً للدلالة على اكتمال صفات الذكورة والقوة."

stage2_evidence:
  per_lemma:
    - lemma: "ذُكُورَة"
      confirm:
        - text: "«(الذُّكُورَة) خلاف الْأُنُوثَة»"
          source: "المعجم الوسيط"
        - text: "«امتلاك سمات الذكر في التعبير.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
    - lemma: "رُجُولَة"
      confirm:
        - text: "«كمال الصفات المميزة للرجل»"
          source: "المعجم الوسيط"
        - text: "«الرُّجْلِيَّةُ. ويقال: هذا رَجُلٌ بَيِّنُ الرُّجُولَةِ: كامِلٌ فى الرِّجال. وهو مصدرٌ لا فِعْلَ له»"
          source: "المعجم الكبير"
    - lemma: "ذُكُورِيَّة"
      contradicts:
        - text: "«masculinization»"
          source: "المَكنَز الزراعي متعدد اللغات (ArabTerm)"
          conflict: "تُستخدم أكثر للدلالة على الاسترجال أو النظام المتمحور حول الذكور (patriarchy/masculism) وليس كسمة سلوكية بحتة."
    - lemma: "فُحُولَة"
      contradicts:
        - text: "«القدرة البدنية للذكر على تنظيم وإتمام دوره الطبيعيّ في الجماع.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: "دلالتها أضيق، وترتبط بالجانب الجسدي والجنسي (virility) أكثر من السلوك العام."

stage3_analysis:
  per_lemma:
    - lemma: "ذُكُورَة"
      decision: confirmed
      decision_reason: "مصدر صحيح يؤدي المعنى المطلوب وهو المقابل الأدق لمصطلح (masculinity)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ذُكُورَة"
    - lemma: "رُجُولَة"
      decision: confirmed
      decision_reason: "مصدر صحيح يعبر عن كمال صفات الرجل وسلوكياته النموذجية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُجُولَة"
    - lemma: "ذُكُورِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصدر صناعي يغلب استعماله للتعبير عن النزعة أو الهيمنة الذكورية، وليس سمة التصرف."
      evidence_assessment:
        case: contradicts_only
    - lemma: "فُحُولَة"
      source: stage1
      decision: removed
      decision_reason: "دلالتها أضيق من المفهوم المطلوب، حيث تنصرف غالبا إلى القدرة الجنسية والبدنية (virility)."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "سمة التصرف بطرق تعتبر نموذجية للرجال"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك ويبدو كترجمة حرفية، وتم استبداله بتعريف أصيل يجمع بين الخصائص والسلوكيات."
    authored:
      - type: terminological
        text: "مجموعة الخصائص والسِّمات والسُّلوكيات التي تُميِّز الذكور وتُعدُّ نَمُوذجيَّةً لهم في مجتمع ما."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة الخصائص والسِّمات والسُّلوكيات التي تُميِّز الذكور وتُعدُّ نَمُوذجيَّةً لهم في مجتمع ما."

  examples:
    per_lemma:
      - lemma: "ذُكُورَة"
        examples:
          - text: "تدرس العلوم الاجتماعية مفهوم الذُّكورة وتطوّره عبر الثقافات المختلفة."
            type: usage
      - lemma: "رُجُولَة"
        examples:
          - text: "أظهر الشاب رُجولةً ومروءةً في تعامله مع الأزمة المباغتة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تدرس العلوم الاجتماعية مفهوم الذُّكورة وتطوّره عبر الثقافات المختلفة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أظهر الشاب رُجولةً ومروءةً في تعامله مع الأزمة المباغتة."

