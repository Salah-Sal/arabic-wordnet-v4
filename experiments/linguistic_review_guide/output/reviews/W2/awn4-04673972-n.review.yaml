      entry_id: "{auto}"
      root: "ذكر"
      maqayis_quote: "«الذَّالُ وَالْكَافُ وَالرَّاءُ أَصْلَانِ، عَنْهُمَا يَتَفَرَّعُ كَلِمُ الْبَابِ... وَالْأَصْلُ الْآخَرُ: ذَكَرْتُ الشَّيْءَ، خِلَافُ نَسِيتُهُ.»"
    - lemma: "رُجُولَة"
      entry_id: "{auto}"
