# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15251421-n
# the middle of the gestation period — منتصف فترة الحمل
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «منتصف الحمل» بدون تشكيل، وتحتاج إضافة تشكيل كامل"
      - "التعريف العربي «منتصف فترة الحمل» قريب من الترجمة الحرفية للتعريف الإنجليزي ويمكن تحسينه"
      - "المجموعة تحتوي لمّة واحدة فقط مقابل مفهوم طبي واضح"
    observations: "المفهوم يشير إلى النقطة الزمنية الواقعة في وسط مدة الحمل (الحَبَل). المصطلح «منتصف الحمل» مركب إضافي شائع في النصوص الطبية العربية. الحقل الدلالي فوقه «نقطة زمنية/لحظة» مناسب. يمكن البحث عن بدائل تركيبية من قبيل «وسط الحمل» أو «شطر الحمل»."
  blind_candidates:
    - lemma: "مُنْتَصَفُ الحَمْلِ"
      generation_method: tarkib
      justification: "مركب إضافي من «المُنْتَصَف» (وسط الشيء) و«الحَمْل» (الحَبَل)، وهو أكثر التعابير شيوعاً في النصوص الطبية العربية للدلالة على وسط فترة الحمل"
    - lemma: "وَسَطُ الحَمْلِ"
      generation_method: tarkib
      justification: "مركب إضافي بديل يستخدم «وسط» بدلاً من «منتصف»، والوسط في اللغة يدل على ما بين الطرفين"
    - lemma: "شَطْرُ الحَمْلِ"
      generation_method: tarkib
      justification: "مركب إضافي من «شَطْر» الذي يدل على النصف أو الجهة، وورد في مقاييس اللغة أن النون والصاد والفاء تدل على شطر الشيء"
    - lemma: "نِصْفِيَّةُ الحَمْلِ"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «نِصْف» على وزن فِعْلِيَّة للدلالة على حالة بلوغ المنتصف، مضافاً إلى الحمل"


stage2_evidence:
  per_lemma:
    - lemma: "مُنْتَصَفُ الحَمْلِ"
      confirm:
        - text: "«(المنتصف) من كل شَيْء وَسطه يُقَال أَتَيْته منتصف النَّهَار أَو الشَّهْر أَو السَّاعَة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هَوَرَماني)"
        - text: "«من كلِّ شيء: وسطه»"
          source: "المعجم الوسيط (OCR)"
        - text: "«موت الجنين 'الحميل' في منتصف الحمل أو الثلث الأخير منه والذي لا ينتج عنه تحلل الجسم الأصفر فيستمر الحمل وامتصاص سوائل المشيمة والجنين.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«منتصَف الفصل؛ امتحان منتصَف الفصل.»"
          source: "المورد الحديث (2008) — ترجمة midterm"
          addition: "المورد يترجم midterm بمعنى أكاديمي (منتصف الفصل) لا طبي، مما يدل على أن الدلالة الطبية (منتصف الحمل) تحتاج تقييداً بالإضافة"
    - lemma: "وَسَطُ الحَمْلِ"
      confirm:
        - text: "«(المنتصف) من كل شَيْء وَسطه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«احتواء الرحم على جنين.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985) — تعريف الحمل"
          addition: "يؤكد أن الحمل في السياق الطبي يعني احتواء الرحم على جنين"
    - lemma: "شَطْرُ الحَمْلِ"
      evidence_status: "no_material_found"
    - lemma: "نِصْفِيَّةُ الحَمْلِ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "مُنْتَصَفُ الحَمْلِ"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت يُستخدم في النصوص الطبية العربية، وثّقه المعجم الموحد لمصطلحات الطب البيطري بالنص. «المنتصف» مُعرَّف في المعجم الوسيط بمعنى وسط الشيء، والحمل بمعنى الحَبَل مصطلح طبي مستقر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "اللمّة الوحيدة في المجموعة حالياً؛ تجمع بين الدقة الزمنية (المنتصف = النقطة الوسطى بالضبط) والسياق الطبي (الحمل = الحَبَل)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْتَصَفُ الحَمْلِ"

    - lemma: "وَسَطُ الحَمْلِ"
      source: stage1
      decision: removed
      decision_reason: "رغم صحة التركيب لغوياً، لم يُوثَّق كمصطلح طبي ثابت في المعاجم الموحدة. «وسط» أعم من «منتصف» ولا يدل بالضرورة على النقطة الزمنية الدقيقة، بل قد يشير إلى الفترة الوسطى بأكملها."

    - lemma: "شَطْرُ الحَمْلِ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استخدام هذا التركيب في السياق الطبي. «شطر» يدل على النصف أو الجهة وليس النقطة الوسطى، فقد يُفهم على أنه نصف مدة الحمل لا منتصفها."

    - lemma: "نِصْفِيَّةُ الحَمْلِ"
      source: stage1
      decision: removed
      decision_reason: "مصدر صناعي مولَّد لا سابقة له في الاستعمال الطبي العربي. لم يُوثَّق في أي معجم من المعاجم المستعلَمة، والتركيب مستثقل."


