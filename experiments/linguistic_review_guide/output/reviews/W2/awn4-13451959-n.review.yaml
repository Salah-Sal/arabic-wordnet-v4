# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "عملية إنتاج صور بألوان متباينة تبدو ثلاثية الأبعاد عند تركيبها ومشاهدتها من خلال نظارات بعدسة حمراء وأخرى خضراء"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي دقيق في جوهره لكنه يحتاج إلى تحسينين: (١) إضافة وصف تقني
        للصورتين المركَّبتين (أنهما تُصوَّران من زاويتين متباينتين طفيفاً) لبيان آلية
        التجسيم، (٢) تحديث الأسلوب ليلائم أسلوب المعجم الوسيط بدلاً من الصياغة الوصفية
        الحرة، وإحلال "متكاملين" محل "متباينة" لأن المصطلح التقني الدقيق هو "الألوان
        المتكاملة" (complementary colors) لا المتباينة.
    authored:
      - type: terminological
        text: >-
          أسلوب لإنتاج صُوَرٍ مُجَسَّمةٍ، يقوم على تركيب صورتين لموضوع واحد مُلوَّنَتين
          بلونين متكاملين (الأحمر والأخضر)، فتبدو الصورة المركَّبة ثلاثيةَ الأبعاد عند
          رؤيتها من خلال نظارات بعدسة حمراء وأخرى خضراء.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          تقنية تصوير تُنتج الوهم البصري بالعمق والاتساع، تُصوَّر فيها صورتان للموضوع
          من زاويتين بينهما فارق طفيف يحاكي المسافة بين العينين، ثم تُطبع إحداهما بالأحمر
          والأخرى بالأخضر وتُركَّبان في طبقة واحدة. يُشاهدها المتلقي بنظارات مرشَّحة
          (عدسة حمراء لليمنى وخضراء لليسرى)، فيرى كل عين الصورة المخصصة لها، ويُولِّد
          المخ من المنظورين الوهمَ بثلاثية الأبعاد. تستخدم في رسم الخرائط والاستشعار عن
          بعد وإنتاج بعض الأفلام.

    actions:
