# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13451959-n  |  ILI: i107324  |  POS: n
# Concept: Anaglyphy (أناغليفية)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'تصوير مجسم' مصطلح عام يشمل كل أساليب التصوير الثلاثي الأبعاد، ولا يختص بالأناغليفية التي تتميز باستخدام لونين متكاملين ونظارات مرشّحة"
      - "لمّة 'نقش بارز' مشتركة بين دلالتين: النحت البارز (الفن)، والأناغليف الفوتوغرافي (التقنية)، مما يُفضي إلى اشتراك لفظي غير محمود"
      - "كلا اللمّتين خاليتان من التشكيل الكامل في السجل"
      - "لا توجد لمّة تُبرز الخاصية المميِّزة للأناغليفية: التباين اللوني (أحمر/أخضر) المقصود كتقنية فيزيائية بصرية"
    observations: >-
      المجموعة تمثّل مفهوماً تقنياً متخصصاً (الأناغليفية) هو أسلوب لإنتاج صور مجسّمة وهمياً
      بتراكب صورتين بلونين متكاملين ورؤيتهما بنظارات مرشَّحة. المصطلح الإنجليزي "anaglyphy"
      مشتقّ من الإغريقية (ἀνάγλυφος) بمعنى النقش البارز، وقد انتقل المصطلح من الفن إلى
      التصوير بالمجاز الوظيفي (ظاهر البروز ≈ وهم العمق). أبرز الإشكاليات: (١) غياب لمّة
      تختص بالتقنية اللونية المزدوجة دون غموض أو عمومية، (٢) لمّة "تصوير مجسم" تصلح
      رابطاً للمفهوم الأشمل (التصوير المجسم/الاستريوسكوبي) لا لهذه المجموعة تحديداً.

  blind_candidates:
    - lemma: "التَّجْسِيمُ اللَّوْنِيُّ"
      generation_method: tarkib
      justification: >-
        مركّب وصفي: تجسيم (إنتاج العمق الوهمي) + لوني (نسبة إلى اللون بوصفه الوسيلة التقنية).
        وزن التجسيم (تَفْعِيل) يناسب إفادة العملية والصنعة. يُبرز الخاصية التمييزية للأناغليفية
        (الاستعمال اللوني) في مقابل غيرها من طرائق التجسيم (كالهولوغرام والاستريوسكوب).

    - lemma: "أَنَاغْلِيفِيَّة"
      generation_method: taarib
      justification: >-
        تعريب منتظم للمصطلح الدولي "anaglyphy" بقبول لام التعريف (الأناغليفية) والنسبة
        (أناغليفي) والجمع (أناغليفيات). يُوظَّف في المصطلحات التقنية ذات الصيغة العالمية
        حين يَعسُر الاشتقاق الصريح. ملاذ أخير استُنفِدت قبله مراتب الاشتقاق والتركيب.

    - lemma: "التَّنَاظُرُ اللَّوْنِيُّ"
      generation_method: majaz
      justification: >-
        إزاحة دلالية من "تناظر" (التقابل والتوافق الثنائي) إلى عملية تتقابل فيها صورتان
        بلونين متكاملين، فيُحقق التقابلُ البصري وهمَ العمق. وزن التَّفَاعُل يُفيد التشارك
        بين طرفين، وهو هنا الصورة الحمراء والخضراء.

    - lemma: "التَّصْوِيرُ التَّبَايُنِيُّ"
      generation_method: tarkib
      justification: >-
        مركّب وصفي: تصوير (العملية الفوتوغرافية) + تبايني (نسبة إلى التباين اللوني الذي هو
        القوام الأساسي للأناغليف). "التباين" في العربية التقنية يُستخدم للفارق الملحوظ بين
        قيمتين، ومنه تباين الألوان (color contrast).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تصوير مجسم"
      expands:
        - text: >-
            «التصوير الضوئي المجسَّم: stereoscopic photography — ويُسمَّى أيضًا التصوير
            ثلاثي الأبعاد»
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
          addition: >-
            يُثبت المعجم الكبير المصطلح المركّب بمعنى التصوير الاستريوسكوبي عموماً،
            وهو أعمّ من الأناغليفية تحديداً.
      contradicts:
        - text: >-
            «التصوير ثلاثي الأبعاد — holography»
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          conflict: >-
            يربط ARABTERM الطبي "التصوير ثلاثي الأبعاد" بالهولوغرافيا لا بالأناغليفية،
            مما يكشف غموض المصطلح وعدم اختصاصه بالمفهوم المقصود.

    - lemma: "نقش بارز"
      confirm:
        - text: >-
            «نقش بارز — anaglyph»
          source: "مسرد الجغرافيا والتاريخ، منظمة الألكسو (ARABTERM)"
        - text: >-
            «رؤية مجسَّمة: تكون على زوج من الصور باستعمال نظارات مرشّحة — anaglyph»
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000) — ARABTERM"
          # (هذا المدخل يصف مفهوم الأناغليف ذاته مما يُقوّي السياق)
        - text: >-
            «ألوان متكاملة: طريقة لتمثيل التضاريس بألوان متكاملة لتحقيق الرؤية المجسّمة —
            anaglyph»
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
      contradicts:
        - text: >-
            «نقش بارز — relief (أو نحت)»
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.٢: بناء-تجارة (1999) — ARABTERM"
          conflict: >-
            في سياق البناء والنحت يُعيَّن "نقش بارز" مقابلاً لـ"relief" (النحت البارز) لا
            لـ"anaglyph"، مما يُثبت الاشتراك اللفظي.
      expands:
        - text: >-
            «النَّقْشُ: تَلْوِينُ الشَّيْءِ بِلَوْنَيْنِ أَوْ بِأَلْوانٍ — عن ابن دُريد»
          source: "تاج العروس لمرتضى الزبيدي"
          addition: >-
            يربط الزبيدي أصلَ النقش بالتلوين بلونين أو أكثر، وهو وصف يلائم جوهر الأناغليفية
            (تلوين بلونين متكاملين)، مما يُعزّز الصلة الاشتقاقية بين النقش والمفهوم.
        - text: >-
            «نَقَشَ: النُّونُ وَالْقَافُ وَالشِّينُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اسْتِخْرَاجِ
            شَيْءٍ وَاسْتِيعَابِهِ حَتَّى لَا يُتْرَكَ مِنْهُ شَيْءٌ؛ ثُمَّ يُقَاسُ مَا
            يُقَارِبُهُ. وَمِنَ الْبَابِ: نَقْشُ الشَّيْءِ تَحْسِينُهُ، كَأَنَّهُ يَنْقُشُهُ
            أَيْ يَنْفِي عَنْهُ مَعَايِبَهُ وَيُحَسِّنُهُ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            يُحدد ابن فارس الأصل الدلالي: الاستخراج والاستيعاب حتى لا يُترك شيء، ثم
            تحسين الشيء وتجميله؛ وهو ما ينعكس في صنع صورة الأناغليف التي تُحسِّن
            الرؤية المستوية وتُضفي عليها وهم البروز.

    - lemma: "التَّجْسِيمُ اللَّوْنِيُّ"
      evidence_status: "no_material_found"

    - lemma: "أَنَاغْلِيفِيَّة"
      evidence_status: "no_material_found"

    - lemma: "التَّنَاظُرُ اللَّوْنِيُّ"
      evidence_status: "no_material_found"

    - lemma: "التَّصْوِيرُ التَّبَايُنِيُّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── تصوير مجسم (موجودة) ──
    - lemma: "تصوير مجسم"
      decision: removed
      decision_reason: >-
        مصطلح "تصوير مجسم" يُعيَّن مقابلاً للتصوير الاستريوسكوبي عموماً (stereoscopic
        photography)، وهو أعمّ بكثير من الأناغليفية التي هي تقنية بعينها تستلزم لونين
        متكاملين ونظارات مرشَّحة. شهادة المعجم الكبير تضعه مقابل "stereoscopic photography"
        وشهادة ARABTERM الطبي تجعل "التصوير ثلاثي الأبعاد" مقابلاً للهولوغرافيا، مما يؤكد
        التداخل الدلالي المضرّ. استبقاؤه في هذه المجموعة يُسبب خلطاً بين الأناغليفية وغيرها
        من تقنيات التجسيم، ويُخلّ بالتمايز الضروري بين المجموعات الترادفية المتجاورة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── نقش بارز (موجودة) ──
    - lemma: "نقش بارز"
      decision: confirmed
      decision_reason: >-
        ثبتت اللمّة في ARABTERM الجغرافي مقابلاً مباشراً لـ"anaglyph"، وهو مصدر متخصص
        موثوق. الصلة الاشتقاقية راسخة: "anaglyph" يونانية تعني الشيء المنقوش بارزاً، و"نقش
        بارز" ترجمة دلالية دقيقة لهذه الأصول. كما يعضد ذلك ما نقله تاج العروس عن ابن دريد
        من أن النقش "تلوين الشيء بلونين أو بألوان"، وهو جوهر الأناغليفية. التعارض مع
        المعنى المعماري (relief) قائم لكن قابل للإزالة بالسياق التخصصي. تُضاف اللمّة
        بتشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        نقش بارز — الوحيدة في المجموعة؛ تستحضر الأصل الاشتقاقي اليوناني (الشيء البارز
        المنقوش) وتستعمل في الخرائط والاستشعار عن بعد للدلالة على الصورة المجسّمة اللونية.
        تُعبّر عن النتيجة البصرية (الوهم بالبروز) أكثر مما تُعبّر عن الآلية التقنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَقْشٌ بَارِزٌ"

    # ── التَّجْسِيمُ اللَّوْنِيُّ (مرشّح المرحلة ١) ──
    - lemma: "التَّجْسِيمُ اللَّوْنِيُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على أي أدلة معجمية لهذا المركّب في قاعدة البيانات. "تجسيم" في ARABTERM
        يُستخدم لمعانٍ متفرقة (anthropomorphism، dramatization) بعيدة عن المعنى المقصود.
        فضلاً عن ذلك، "تجسيم لوني" قد يُوهم بعملية ثلاثية الأبعاد عامة لا بالأناغليفية
        تحديداً. لا يجتاز اختبار السكّ المعجمي: يمكن استبدال "لوني" بـ"ضوئي" أو "رقمي"
        ويبقى الوصف صالحاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── أَنَاغْلِيفِيَّة (مرشّح المرحلة ١) ──
    - lemma: "أَنَاغْلِيفِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية على توظيفها في المصادر العربية المُسجَّلة. رغم انتظام تعريبها صرفياً
        وقبولها الإعراب والنسب، يُؤثَر عليها المصطلح العربي الثابت (نقش بارز) الذي يحمل
        شهادة معجمية مباشرة، إعمالاً لمبدأ "إيثار التراثي" و"إيثار العربي" في بوابة جودة
        المصطلح. يمكن اللجوء إليها مستقبلاً إن انتشرت في المطبوعات العلمية العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── التَّنَاظُرُ اللَّوْنِيُّ (مرشّح المرحلة ١) ──
    - lemma: "التَّنَاظُرُ اللَّوْنِيُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        "تناظر" يحمل دلالة التقابل الهندسي أو الهيكلي، وهو أبعد ما يكون عن وصف العملية
        الفوتوغرافية اللونية. لا توجد له شواهد معجمية في هذا السياق، وهو لا يجتاز اختبار
        الاستبدال: "التقاطع اللوني"، "التطابق اللوني" تصلح بدائل وصفية بالقدر ذاته،
        مما يدل على أنه ليس مصطلحاً مسكوكاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── التَّصْوِيرُ التَّبَايُنِيُّ (مرشّح المرحلة ١) ──
    - lemma: "التَّصْوِيرُ التَّبَايُنِيُّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يرد في أي مصدر معجمي، ولا يختص بالأناغليفية: التصوير التبايني قد يُستخدم لأي
        تقنية تصوير تعتمد التباين (كتصوير التباين العالي HDR مثلاً). غياب الشاهد المعجمي
        وعدم التمييز الكافي يقضيان برفضه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

  synset_actions:
    - command: remove_sense
      params:
        sense_id: "{auto}"
