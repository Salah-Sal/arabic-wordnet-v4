# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13473923-n (convection)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «حمل حراري» خالية من التشكيل"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو مقبول لمصطلح علمي متخصص لكن يمكن إثراؤها"
      - "التعريف العربي جيد لكنه مقيّد بالأرصاد الجوية فيما المفهوم أوسع في الفيزياء"
    observations: >
      المفهوم هو «الحَمْل الحراريّ» وهو ظاهرة فيزيائية تتحرك فيها الكتل المائعة (غاز أو سائل)
      عمودياً ناقلةً الحرارة معها. التعريف الحالي يحصره في الأرصاد الجوية بينما يشمل
      المفهوم في الفيزياء كلَّ وسط مائع. المصطلح مركّب إضافي وصفي ثابت في المعاجم العلمية العربية.
  blind_candidates:
    - lemma: "حَمْل حَرَارِيّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي-وصفي من «حَمْل» (نقل الشيء وإقلاله) و«حَرَارِيّ» (نسبة إلى الحرارة).
        يصف الظاهرة بأنها نقل حراري عبر حركة الكتل. وزن فَعْل للمصدر يناسب الدلالة على الحدث.
    - lemma: "تَصَاعُد حَرَارِيّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «تَصَاعُد» (مصدر تَصَاعَدَ: ارتفع شيئاً فشيئاً) و«حَرَارِيّ».
        يركّز على الجانب العمودي الصاعد للظاهرة كما في التعريف.
    - lemma: "نَقْل حَرَارِيّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي-وصفي من «نَقْل» (تحويل الشيء من موضع إلى آخر) و«حَرَارِيّ».
        يصف آلية انتقال الحرارة بواسطة حركة الكتل المائعة.
    - lemma: "تَدَاوُر هَوَائِيّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي من «تَدَاوُر» (مصدر تَدَاوَرَ: دار بعضه على بعض) و«هَوَائِيّ».
        يصف الحركة الدائرية للكتل الهوائية الصاعدة والهابطة داخل الغلاف الجوي.

stage2_evidence:
  per_lemma:
    - lemma: "حَمْل حَرَارِيّ"
      confirm:
        - text: "«طريقةٌ لنقل الطاقة الحرارية بالحَمل، (وهي إحدى طرقٍ ثلاث لنقل الحرارة). وهي أيضاً طريقةٌ لتغيير مكان جزيئاتٍ سائلة أو غازية يسهل تحريكُها، لتقوم تلك الجزيئات بنقل الحرارة المُختزَّنة فيها.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
        - text: "«إحدى آليات انتقال الطاقة الحرارية من موضع إلى آخر، إلى جانب الطريقتين الأخريَين المُتمثلتين في: التوصيل الحراري، والإشعاع الحراري. وتُعرف هذه الآلية أيضاً بانتقال الحرارة بالحِمل، ويرتبط فيها الحِمل الحراري دائماً بانتقال الجُزيئات التي تحمل معها الطاقة الحرارية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«حركة مائعٍ ما مثل الغاز أو السائل، التي يتمّ عن طريقها انتقال الحرارة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«عملية يتم بها نقل الطاقة الحرارية من خلال وسيط مائع. في الغلاف الجوي تنتقل كتلة من الهواء الدافئ المنخفض الكثافة إلى الأعلى، تبرد أثناء ذلك وتزداد كثافتها.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«الحَمْل الحراريّ: انتقال الحرارة من مكان إلى آخر نتيجةً لدوران جُزَيْئات السائل أو الغاز المسخّنة (فز).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«ظاهرة يتحرك فيها الهواء الساخن إلى أعلى ليحل محله هواء أبرد.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "تعريف مبسّط يركز على الجانب الجوي"
        - text: "«حِمْل (حراري): حركة مائعٍ ما مثل الغاز أو السائل، التي يتمّ عن طريقها انتقال الحرارة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "تشكيل بديل بالكسر (حِمْل) بدلاً من الفتح (حَمْل)"

    - lemma: "تَصَاعُد حَرَارِيّ"
      evidence_status: "no_material_found"

    - lemma: "نَقْل حَرَارِيّ"
      confirm:
        - text: "«نقل حراري» — ترجمة convection"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«نقل حراري» — ترجمة heat convection; thermal convection"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«نقل الحرارة بواسطة مائع جار كالهواء والماء، انتقال الحرارة بالحمل»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      contradicts:
        - text: "«نَقْل» — ترجمة convection (بدون تقييد حراري)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "النقل أعمّ من الحمل الحراري؛ قد يشمل التوصيل والإشعاع"

    - lemma: "تَدَاوُر هَوَائِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "حَمْل حَرَارِيّ"
      decision: confirmed
      decision_reason: >
        مصطلح ثابت مُوثَّق في أكثر من عشرة معاجم علمية عربية متخصصة (فيزياء، أرصاد جوية،
        طاقة متجددة، هندسة كهربائية، نفط، تغذية). التعريفات تتطابق مع دلالة المجموعة.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح المعياري في الأرصاد الجوية والفيزياء، يشمل الحَمْل الحراري بجميع أنواعه (طبيعي وقسري)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَمْل حَرَارِيّ"

    - lemma: "تَصَاعُد حَرَارِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي للمركّب «تصاعد حراري». وجد «تَصَاعُد» وحده ترجمةً
        لـ convection في معجم الجغرافيا فحسب، وهو استعمال هامشي لا يرقى لمستوى المصطلح المعياري.
      evidence_assessment:
        case: no_material

    - lemma: "نَقْل حَرَارِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المركب مُوثَّق في بعض المعاجم (AGROVOC، موسوعة الكهرباء) لكنّه يختلط دلالياً
        بـ«النقل الحراري» بمعنى heat transfer الأعم الذي يشمل التوصيل والإشعاع أيضاً.
        في معجم الأرصاد الجوية (١٩٩٩) المصطلح المعتمد هو «حَمْل» لا «نَقْل».
        إضافته قد تُسبب التباساً دلالياً.
      evidence_assessment:
        case: mixed

    - lemma: "تَدَاوُر هَوَائِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. المصطلح مُولَّد لم يرد في أي معجم متخصص.
        «التداور» لا يُستخدم في سياق الحمل الحراري.
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "(في الأرصاد الجوية) الحركة العمودية للحرارة أو غيرها من الخصائص عن طريق حركة الكتل داخل الغلاف الجوي"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي. يفتقر إلى الجنس القريب الدقيق،
        ويحصر المفهوم في الأرصاد الجوية فيما الحمل الحراري ظاهرة فيزيائية عامة تشمل كل مائع.
    authored:
      - type: terminological
        text: "آلِيَّةٌ مِنْ آلِيَّاتِ انتقالِ الحرارةِ، تتحرّكُ فيها كُتَلُ المائعِ (غازاً أو سائلاً) عَمُودِيّاً ناقِلَةً الطاقةَ الحراريّةَ مِنْ مَوْضِعٍ إلى آخَرَ بفعلِ اختلافِ الكَثَافَة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "ظاهِرَةٌ فِيزْيائِيَّةٌ يَنتَقِلُ فيها المائعُ السَّاخِنُ المُنخَفِضُ الكَثَافَةِ إلى أَعْلَى ويَهبِطُ المائعُ البارِدُ الأَكثَرُ كَثَافَةً إلى أَسْفَلَ، فَتَنتَقِلُ بذلكَ الحرارةُ. وهي إحدى طُرُقِ انتقالِ الحرارةِ الثَّلاثِ إلى جانبِ التَّوصيلِ والإشعاعِ. تظهَرُ في الغِلافِ الجَوِّيِّ وفي باطِنِ الأرضِ والمُحيطاتِ"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "آلِيَّةٌ مِنْ آلِيَّاتِ انتقالِ الحرارةِ، تتحرّكُ فيها كُتَلُ المائعِ عَمُودِيّاً ناقِلَةً الطاقةَ الحراريّةَ مِنْ مَوْضِعٍ إلى آخَرَ بفعلِ اختلافِ الكَثَافَة"

  examples:
