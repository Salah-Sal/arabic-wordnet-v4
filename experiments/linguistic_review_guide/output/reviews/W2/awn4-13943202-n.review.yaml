# ================================================================
# مراجعة AWN4 — awn4-13943202-n
# المجموعة: حالة وسطية بين النقيضين (medium / middle position)
# ================================================================

stage1_review:
  assessment:
    concerns:
      - "اللمّة «حل وسط» تعبير مركّب حديث بمعنى الحلّ التوافقيّ أو التنازليّ، وهو يُوحي بفعل إرادي (تنازل الطرفين) أكثر من كونه وصفاً لحالةٍ مُجرَّدة بين نقيضين؛ والمجموعة فرعٌ من «حَالَة» لا من «حلّ»، فالتطابق الجنسيّ غير سليم."
      - "اللمّة «وسط» خالية من التشكيل الكامل في AWN4، وتشترك في الهجاء مع الظرف «وَسْط» (بالسكون) مما قد يُربك الضبط الصرفي."
      - "التعريف الحالي «حالة وسطية بين النقيضين؛ موقف وسطي» يعاني دوراناً لغوياً: استُعين بـ«وسطية» و«وسطي» لتعريف «وسط»."
      - "لا يوجد في AWN4 لمّة بالتشكيل الكامل تصلح فصيحة لهذه المجموعة."
    observations: >-
      المفهوم راسخٌ في المعجمية العربية الكلاسيكية والإسلامية: «وَسَط» من
      أرقى الألفاظ القرآنية ({أُمَّةً وَسَطًا}، البقرة:143)، وقد استوفى ابن
      فارس في مقاييسه معناه الجذريّ بقوله «يدل على العدل والنصف». المفهوم
      أصيلٌ، والثغرة ليست في المصطلح وإنما في التشكيل وفي التعريف الدائر.
      «حل وسط» لا وجود له في المعاجم الكلاسيكية بوصفه وحدة معجمية ثابتة،
      وهو مُولَّد حديث يُرادف Compromise أكثر من مُرادفته لـmedium بمعنى
      الحالة الوسطى المُجرَّدة.

  blind_candidates:
    - lemma: "الاعتدال"
      generation_method: majaz
      justification: >-
        من جذر عدل (الاستواء والنصف)؛ الاعتدال في الفلسفة العربية القديمة
        هو التوسط بين طرفي الإفراط والتفريط، فيمكن مجازاً إحياؤه للدلالة
        على الحالة الوسطى بين نقيضين، مع إيثار هذا اللفظ التراثيّ على
        المستحدثات.
    - lemma: "البرزخ"
      generation_method: majaz
      justification: >-
        في الأصل الحاجز بين البحرين (القرآن الكريم) وما بين الدنيا والآخرة؛
        يُستعار مجازاً للدلالة على أي منزلةٍ وسطى تفصل بين حالتين متضادتين
        وتجمع بينهما في آنٍ واحد.
    - lemma: "الاتِّزَان"
      generation_method: ishtiqaq
      justification: >-
        مصدر اِفتِعَال من جذر وزن، يدل على التوازن بين قوى أو حالات
        متعارضة مما يُقرّبه دلالياً من «الحالة الوسطى بين النقيضين».
    - lemma: "التَّعَادُل"
      generation_method: ishtiqaq
      justification: >-
        مصدر تَفَاعُل من جذر عدل، يدل على التكافؤ المتبادل بين طرفين، وقد
        يُستعمل للإشارة إلى الوضع الذي يتوازن فيه النقيضان فلا يطغى
        أحدهما.


stage2_evidence:
  per_lemma:

    - lemma: "وسط"
      confirm:
        - text: >-
            «الوَسَطُ، مُحَرَّكَةً، من كُلِّ شَيْءٍ: أَعْدَلُهُ.
            ويُقَالُ: شَيْءٌ وَسَطٌ، أَيْ بَيْنَ الجَيِّدِ والرَّدِيءِ،
            ومِنْهُ قَوْلُه تَعالَى: {وَكَذَلِكَ جَعَلْنَاكُمْ أُمَّةً وَسَطًا}»
          source: "تاج العروس لمرتضى الزبيدي"
        - text: >-
            «الوسط بالتحريك المعتدل، يُقال: شيءٌ وسَطٌ أي بين الجيد والرديء.
            وفي التنزيل {مِنْ أَوْسَطِ مَا تُطْعِمُونَ} أي من وسط بمعنى
            المتوسط»
          source: "المصباح المنير للفيّومي"
        - text: >-
            «الوسط: ما له طرفان متساويا القدر. ويقال ذلك في الكميّة المتصلة
            كالجسم الواحد... والوسطُ تارةً يقال فيما له طرفان مذمومان
            كالجود الذي هو بين البخل والسرف، فيُستعمل استعمال القصد المصون
            عن الإفراط والتفريط فيُمدح به نحو السواء والعدل»
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: >-
            «الوسط: محركةً، ما بين طرفي الشيء كمركز الدائرة»
          source: "التعريفات الفقهية للبركتي"
        - text: >-
            «(الوَاوُ وَالسِّينُ وَالطَّاءُ): بِنَاءٌ صَحِيحٌ يَدُلُّ عَلَى
            الْعَدْلِ وَالنِّصْفِ. وَأَعْدَلُ الشَّيْءِ: أَوْسَطُهُ
            وَوَسَطُهُ. قَالَ اللَّهُ عَزَّ وَجَلَّ: {أُمَّةً وَسَطًا}
            [البقرة: 143]»
          source: "مقاييس اللغة لابن فارس"
        - text: >-
            «(الوسط) وسَطُ الشَّيء ما بين طرفَيْه وهو منه والمعتدل من كل
            شيء يُقال شيءٌ وسط بين الجيد والرديء وما يكتنفه أطرافه ولو من
            غير تساوٍ والعدل والخير (يوصف به المفرد وغيره)»
          source: "المعجم الوسيط"
        - text: >-
            «الوسط: بالفتح وسكون السين المهملة عند المنطقيين هو الحد الأوسط
            المسمى بالواسطة في التصديق... والوسط ما بين الطرفين»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: >-
            «وسط» (ARABTERM، فيزياء): EN=medium | «وسط» (ARABTERM، أحياء):
            EN=medium | «وسط» (ARABTERM، علم الاجتماع): EN=medium
          source: "معاجم ALECSO (مصطلحات الفيزياء، الأحياء، علم الاجتماع)"
          addition: >-
            التوافق التام مع الإنجليزي «medium» بمعنى الوسط المادي أو
            الاجتماعي أو العلمي يؤكد فعالية هذا المصطلح في السياقات
            التخصصية الحديثة.
        - text: >-
            «وَسَطُ الشيءِ: ما بين طرَفَيْه... الوَسَطُ تارةً يقال فيما
            له طرفان مذمومان كالجود بين البخل والسرف»
          source: "لسان العرب لابن منظور"
          addition: >-
            ابن منظور يُصرّح بأن الوسط يُستعمل للحالة الوسطى بين أمرين
            مذمومَيْن، وهو ضبط دلاليّ مهمّ يُفرّق بين وسط المدح ووسط
            الحياد.

    - lemma: "حل وسط"
      contradicts:
        - text: >-
            «صُلح، تسوية (نـزاع)» EN=compromise | «تسوية: أسلوب في تسوية
            النزاعات يرتكز على التوفيق بين مصالح الأطراف المتنازعة»
          source: "معاجم ALECSO (مصطلحات القانون، المياه)"
          conflict: >-
            المعاجم التقنية تُوثّق «حل وسط» بمعنى Compromise (تسوية
            نزاعات بتنازل الأطراف)، وهو مختلف عن مفهوم المجموعة «medium»
            (حالة وسطى مُجرَّدة بين نقيضين). «حل وسط» يُحيل إلى فعل
            إرادي وتفاوضي، أما المجموعة فترتبط بالجنس «حَالَة» (state).
        - text: >-
            لا ورود للمركّب «حل وسط» في المعاجم الكلاسيكية بوصفه وحدة
            معجمية ثابتة للدلالة على «الحالة الوسطى بين النقيضين».
          source: "استقراء المعاجم الكلاسيكية (الصحاح، اللسان، التاج، القاموس)"
          conflict: >-
            غياب التوثيق الكلاسيكي يُشير إلى أنه مولّد حديث أو كالك
            (ترجمة حرفية) لـ middle solution دون رصيد معجمي قديم في هذه
            الدلالة.

    - lemma: "الاعتدال"
      contradicts:
        - text: >-
            «الاعتدال: [في الإنجليزية] Equinox... الاعتدال الربيعي
            والخريفي سيأتي ذكرهما في بيان دائرة البروج»
          source: "كشاف اصطلاحات الفنون للتهانوي"
          conflict: >-
            المصطلح محتلٌّ في المعجمية العربية بمعنى الاعتدالين الفلكيَّيْن
            (الربيعي والخريفي)، وفي الطب بمعنى اعتدال المزاج، وفي العروض
            بنوع من الزحاف، مما يُشكّل اشتراكاً لفظياً مع المعنى المراد.
        - text: >-
            «اعتدال: EN=moderation» (علم الصحة) | «اعتدال: EN=equinoxe»
            (جغرافيا وتاريخ)
          source: "معاجم ALECSO"
          conflict: >-
            ARABTERM يُوثّق الاعتدال بمعنى «moderation» و«equinox»، لا
            بمعنى «a middle state between extremes» الخاص بمعنى medium.

    - lemma: "البرزخ"
      contradicts:
        - text: >-
            «البَرْزَخُ: الحاجِزُ بين الشَّيْئَيْنِ، ومن وقْتِ المَوْتِ
            إلى القيامَةِ، ومن ماتَ دَخَلَه. وبَرازِخُ الإِيمانِ: ما
            بَيْنَ أوَّلِهِ وأخِرِه، أو ما بين الشَّكِّ واليَقينِ»
          source: "القاموس المحيط للفيروزآبادي"
          conflict: >-
            البرزخ حاجزٌ فاصل بين شيئين، لا منزلةٌ وسطى بينهما؛ فدلالته
            على الفصل والحجز لا على الكون في المنتصف.
        - text: >-
            «برزخ: EN=isthmus» (جيولوجيا، أحياء، طب) | «برزخ: EN=interface»
            (هندسة المياه)
          source: "معاجم ALECSO"
          conflict: >-
            ARABTERM يُرسّخ البرزخ في معنى البرزخ الجغرافي (isthmus) أو
            الواجهة التقنية (interface)، وكلاهما بعيد عن «الحالة الوسطى
            بين النقيضين».

    - lemma: "الاتِّزَان"
      contradicts:
        - text: >-
            «(الاتزان) (في الرياضة والهندسة): يُقال: اتزانٌ لا مُستقِرٌّ:
            وهو اتزان الجسم الذي إذا أُزيح قليلاً عن موضعه لم يَعُد إلى
            وضعه الأصلي واختلَّ التوازن»
          source: "المعجم الوسيط"
          conflict: >-
            المعجم الوسيط يحصر الاتزان في السياق الهندسي والفيزيائي
            (توازن الأجسام)، وهو مفهوم مختلف عن «الحالة الوسطى بين
            النقيضين».
        - text: >-
            «اتزان: EN=stabilization» (كهرباء) | «اتزان: EN=equilibration»
            (صحة) | «اتزان: EN=stability» (مياه)
          source: "معاجم ALECSO"
          conflict: >-
            جميع توثيقات ARABTERM تُرادف الاتزان بـ stability أو
            equilibration أو stabilization، وليس بـ medium أو middle
            position.

    - lemma: "التَّعَادُل"
      contradicts:
        - text: >-
            «التعادل: التساوي بين الشيئين، ومنه قسمة التعديل وهي قسمة
            الشيء باعتبار القيمة والمنفعة لا باعتبار العدل»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >-
            التعادل يدل على التساوي والتكافؤ بين شيئين، لا على الوجود في
            منتصف طيف بين نقيضين.
        - text: >-
            «تعادل: EN=equivalence» (هندسة كهربائية) | «تعادل: EN=neutralization»
            (كهرباء) | «تعادل: EN=temperament» (فنون ورياضة)
          source: "معاجم ALECSO"
          conflict: >-
            ARABTERM يُوثّق التعادل بمعنى equivalence/neutralization، بعيداً
            كل البعد عن معنى «medium» = middle state.


stage3_analysis:
  per_lemma:

    - lemma: "وسط"
      decision: confirmed
      decision_reason: >-
        اللمّة موثّقة في جميع طبقات المعجمية العربية من العين إلى المعاصرة
        بمعنى «ما بين طرفَيْ الشيء» و«المعتدل من كل شيء». ابن فارس يُرجع
        الجذر إلى «العدل والنصف»، والراغب يُفصّل دلالتها للحالة الوسطى بين
        طرفين مذمومين (كالجود بين البخل والسرف). ARABTERM يُرادفه بـ medium
        في الفيزياء والأحياء وعلم الاجتماع. التطابق مع دلالة المجموعة
        (حالة وسطية بين النقيضين) تامٌّ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        وَسَط يدلّ على الحالة المُجرَّدة التي تَقع في منتصف الطيف بين
        نقيضين دون إيحاء بفعلٍ إراديّ أو تفاوض، وهو ما يُميّزه عن «حل
        وسط» الذي يُوحي بالتسوية التفاوضية. وَسَط وصفٌ للمنزلة لا
        للإجراء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَسَط"

    - lemma: "حل وسط"
      decision: removed
      decision_reason: >-
        «حل وسط» مُولَّدٌ حديث يُرادف Compromise (تسوية تفاوضية) لا
        medium (حالة وسطى مُجرَّدة). المجموعة مُصنَّفة تحت الجنس «حَالَة»
        (state)، وليس «حلّ» (solution). المعاجم الكلاسيكية لا تُوثّق هذا
        المركّب بهذه الدلالة. ARABTERM يُرادفه بـ compromise في سياقات
        القانون وتسوية النزاعات. اختبار MWE: «حل وسط» لا يجتاز اختبار
        التثبيت المعجمي، إذ يمكن استبدال «وسط» بـ«بيني» أو «توافقي»
        وتبقى العبارة وصفاً حراً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الاعتدال"
      source: stage1
      decision: removed
      decision_reason: >-
        المصطلح محتلٌّ دلالياً: اعتدالٌ في علم الفلك (equinox)، وفي
        الطب (اعتدال المزاج)، وفي العروض. وهو يفيد التوازن والاستواء
