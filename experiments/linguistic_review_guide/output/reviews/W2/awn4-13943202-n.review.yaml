      - type: linguistic
        text: >-
          أَعْدَلُ الشَّيْءِ وَأَقْصَدُهُ؛ مَا اكْتَنَفَتْهُ أَطْرَافُهُ
          مِنْ كُلِّ جَانِبٍ، كَالجُودِ بَيْنَ الشُّحِّ وَالإِسْرَافِ.
        quality_check:
          genus_present: true
          differentia_present: true
