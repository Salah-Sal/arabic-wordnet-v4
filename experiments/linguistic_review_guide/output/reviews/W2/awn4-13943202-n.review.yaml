        text: >-
          حَالٌ أَوْ مَنزِلَةٌ تَقَعُ بَيْنَ طَرَفَيْنِ مُتَنَاقِضَيْنِ
          أَوْ مُتَقَابِلَيْنِ، فَلَا تَنتَسِبُ إِلَى وَاحِدٍ مِنْهُمَا
          بِعَيْنِهِ.
        quality_check:
