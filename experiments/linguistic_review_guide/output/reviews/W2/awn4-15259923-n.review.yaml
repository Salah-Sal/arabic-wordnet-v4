# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15259923-n (ثانية / second)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ثانية» بلا تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط — قد تكفي لمفهوم وحدة قياس محددة بدقة"
    observations: >
      المفهوم هو الثانية بوصفها وحدة زمنية أساسية في النظام الدولي (SI)، وهي
      1/60 من الدقيقة. هذا مصطلح علمي مستقر في العربية منذ القرن التاسع عشر
      على الأقل، مأخوذ من التقسيم الستيني للساعة عند الفلكيين العرب. التعريف
      الحالي واضح ومباشر. اللمّة «ثانية» هي المصطلح المعياري الوحيد المتداول.
  blind_candidates:
    - lemma: "ثَانِيَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ث ن ي على وزن فَاعِلَة (مؤنث فاعل)، أي القسمة الثانية
        من تقسيم الساعة: الأولى هي الدقيقة (pars minuta prima) والثانية هي
        الدقيقة الثانية (pars minuta secunda). مصطلح راسخ في التراث الفلكي العربي.
    - lemma: "دَقِيقَة ثَانِيَة"
      generation_method: tarkib
      justification: >
        مركب وصفي يعكس الأصل اللاتيني pars minuta secunda (الجزء الدقيق الثاني).
        استُعمل في التراث الفلكي العربي القديم قبل اختصاره إلى «ثانية».
    - lemma: "ثُنَيَّة"
      generation_method: ishtiqaq
      justification: >
        تصغير «ثانية» على وزن فُعَيْلَة، للدلالة على صغر الوحدة الزمنية.
        غير مسجّل معجمياً بهذا المعنى، لكنه اشتقاق قياسي.
    - lemma: "سِكُنْدَة"
      generation_method: taarib
      justification: >
        تعريب للفظ الفرنسي seconde أو الإنجليزي second. لم يُتبنَّ في
        المعاجم العربية لوجود البديل العربي الأصيل «ثانية».

stage2_evidence:
  per_lemma:
    - lemma: "ثَانِيَة"
      confirm:
        - text: "«(الثَّانِيَة) قسم من السِّتين قسما الَّتِي تَنْقَسِم إِلَيْهَا الدقيقة الستينة (مج)(ج) ثوان»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«قسمٌ من الستين قسماً التى تنقسم إليها الدقيقة الستينية»"
          source: "المعجم الوسيط (OCR)"
        - text: "«قِسمٌ من سِتِّين قِسْماً تَنْقَسِمُ إليها الدَّقيقةُ السِّتِّينيَّة»"
          source: "المعجم الكبير"
        - text: "«الثّانية: عند أهل الهيئة والمنجّمين هي سدس عشر الدقيقة التي هي سدس عشر الدرجة أو الساعة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«ثَانِيَة — من (ث ن ي) مؤنث ثاني، وقسم من الستين قسما من الدقيقة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(1) الثانية: جزء من ستين من الدقيقة (2) لحظة»"
          source: "المورد الحديث"
          addition: "يضيف دلالة مجازية ثانية: اللحظة"
        - text: "«translation_en: second — domain: Civil Engineering»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
          addition: "يؤكد استعمال المصطلح في المجال التقني"
        - text: "«translation_en: second — domain: Mathematics and Astronomy»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
          addition: "يؤكد استعمال المصطلح في الفلك والرياضيات"
        - text: "«translation_en: second — domain: Electropedia»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يؤكد استعمال المصطلح في الهندسة الكهربائية"
    - lemma: "دَقِيقَة ثَانِيَة"
      contradicts:
        - text: "«translation_en: second degree — domain: Mathematics and Astronomy»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
          conflict: "«درجة ثانية» مسجّلة بمعنى second degree وليس second (وحدة زمنية)"
      evidence_status: "no_material_found"
    - lemma: "ثُنَيَّة"
      evidence_status: "no_material_found"
    - lemma: "سِكُنْدَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "ثَانِيَة"
      decision: confirmed
      decision_reason: >
        مصطلح معياري راسخ مؤيَّد بأدلة معجمية متعددة من المعجم الوسيط والمعجم
        الكبير وكشاف التهانوي ومعاجم ALECSO التقنية. هو المصطلح الوحيد المتداول
        في العربية الفصحى للدلالة على وحدة الثانية الزمنية. يحتاج فقط إلى إضافة
        التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثَانِيَة"
    - lemma: "دَقِيقَة ثَانِيَة"
      source: stage1
      decision: removed
      decision_reason: >
        مركب وصفي تاريخي لم يُسجَّل في المعاجم المعاصرة بمعنى وحدة الزمن.
        «درجة ثانية» مسجّلة بمعنى second degree لا second. التعبير الكامل
        «دقيقة ثانية» قد يلتبس مع معنى «دقيقة أخرى». لا حاجة إليه مع وجود
        «ثانية» المختصرة الراسخة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
    - lemma: "ثُنَيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        تصغير غير مسجّل معجمياً بهذا المعنى. لا أدلة على استعماله للدلالة
        على وحدة الزمن. اشتقاق نظري لا يتمتع بتثبيت معجمي أو تداولي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "سِكُنْدَة"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب لا حاجة إليه مع وجود المصطلح العربي الأصيل «ثانية» المستقر
        منذ قرون. لم يُسجَّل في أي معجم عربي. مخالف لمبدأ إيثار العربي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "1/60 من الدقيقة؛ الوحدة الأساسية للوقت المعتمدة في النظام الدولي للوحدات"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يمزج بين التعريف الكسري والتعريف المعياري دون أسلوب
        معجمي عربي واضح. ينبغي صياغته بأسلوب المعجم الوسيط مع ذكر الجنس
        القريب (وحدة زمنية) والفصل النوعي (التقسيم الستيني).
    authored:
      - type: terminological
        text: "وَحْدَةٌ لِقِيَاسِ الزَّمَنِ، هِيَ جُزْءٌ مِنْ سِتِّينَ جُزْءاً مِنَ الدَّقِيقَةِ، وَهِيَ الوَحْدَةُ الأَسَاسِيَّةُ لِلزَّمَنِ فِي النِّظَامِ الدَّوْلِيِّ لِلْوَحَدَاتِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "وَحْدَةُ الزَّمَنِ الأَسَاسِيَّةُ فِي النِّظَامِ الدَّوْلِيِّ لِلْوَحَدَاتِ (SI)، تُسَاوِي جُزْءاً مِنْ سِتِّينَ جُزْءاً مِنَ الدَّقِيقَةِ أَوْ جُزْءاً مِنْ 3600 جُزْءٍ مِنَ السَّاعَةِ. عُرِّفَتْ حَدِيثاً بِأَنَّهَا مُدَّةُ 9,192,631,770 ذَبْذَبَةً لِلْإِشْعَاعِ الصَّادِرِ عَنْ ذَرَّةِ السِّيزْيُوم-133"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "وَحْدَةٌ لِقِيَاسِ الزَّمَنِ، هِيَ جُزْءٌ مِنْ سِتِّينَ جُزْءاً مِنَ الدَّقِيقَةِ، وَهِيَ الوَحْدَةُ الأَسَاسِيَّةُ لِلزَّمَنِ فِي النِّظَامِ الدَّوْلِيِّ لِلْوَحَدَاتِ"
  examples:
    per_lemma:
      - lemma: "ثَانِيَة"
        examples:
          - text: "سَجَّلَ العَدَّاءُ زَمَناً قَدْرُهُ عَشْرُ ثَوَانٍ وَخَمْسُ أَجْزَاءٍ مِنَ المِئَةِ فِي سِبَاقِ المِئَةِ مِتْر"
            type: usage
          - text: "دقاتُ قَلْبِ المرءِ قائِلةٌ له / إنَّ الحياةَ دقائقٌ وثوانِ"
            type: poetry
            source: "أحمد شوقي"
