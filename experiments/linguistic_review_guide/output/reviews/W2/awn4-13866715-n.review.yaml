        text: "مجموعُ القُوى والعمليّاتِ النفسيّةِ الواعيةِ واللّاواعيةِ المتفاعلةِ التي تُسهِمُ في تشكيلِ الشخصيّةِ وتوجيهِ الدوافعِ والسلوك"
