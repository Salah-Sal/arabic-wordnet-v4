# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13866715-n (psychodynamics)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «دِينَامِيكِيَّة نَفْسِيَّة» مركّب وصفي معرَّب، قد توجد صيغ أدقّ مثل «الدِّينَامِيكَا النَّفْسِيَّة»"
      - "المجموعة تضمّ لمّة واحدة فقط؛ لا توجد مرادفات تُثري الشبكة الدلالية"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي، يحتاج صياغة معجمية أصيلة"
    observations: "المفهوم ينتمي إلى علم النفس التحليلي، ويصف العلاقات الديناميكية بين الوعي واللاوعي في تشكيل الشخصية والدوافع. هو مصطلح حديث دخل العربية عبر التعريب، ولا يُتوقَّع وجود لفظ تراثي مباشر له. الصيغة «ديناميكية» مصدر صناعي من «ديناميكي» المنسوب إلى «ديناميكا» المعرَّبة، بينما «الديناميكا النفسية» تستعمل الاسم المعرَّب مباشرة وهي أكثر شيوعاً في المعاجم الطبية."

  blind_candidates:
    - lemma: "حَرَكِيَّة نَفْسِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «حَرَكِيَّة» (مصدر صناعي من حركة، مقابل dynamics) و«نفسية»، محاولة لتعريب المفهوم بلفظ عربي صرف بدلاً من الاقتراض"
    - lemma: "دِينَامِيكَا نَفْسِيَّة"
      generation_method: taarib
      justification: "تعريب مباشر باستعمال «ديناميكا» (المعرَّبة عن dynamica) مع الصفة «نفسية»؛ هذه الصيغة شائعة في المعاجم الطبية والعلمية"
    - lemma: "تَفَاعُلِيَّة نَفْسِيَّة"
      generation_method: tarkib
      justification: "من «تفاعلية» (مصدر صناعي من تفاعل) بمعنى التأثير المتبادل بين العمليات النفسية؛ يركّز على جانب الترابط في التعريف"
    - lemma: "تَحْرِيكِيَّة نَفْسِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تحريكي» المنسوب إلى «تحريك» على وزن تَفْعِيل؛ يُفيد معنى القوة المحرّكة للنفس"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "دِينَامِيكِيَّة نَفْسِيَّة"
      confirm:
        - text: "«دِيناميكيَّة [مفرد]: ١ - اسم مؤنَّث منسوب إلى دِيناميكا: حركة ديناميكيَّة. ٢ - مصدر صناعيّ من دِيناميكيّ: حركة ونشاط وحيويّة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«دينامِيْنَفْسي: ذو علاقة بالقوى أو العمليات العقلية أو العاطفية الناشئة بخاصة في فجر الطفولة وبأثرها في السلوك والأوضاع العقلية.»"
          source: "المورد الحديث (2008)"
          addition: "يُبيّن أن المصطلح المركّب دينامي+نفسي مستعمل في المعجمية الثنائية، وأن المقابل الإنجليزي هو psychodynamic"
        - text: "«الدِّينامِيكا النَّفْسِيَّة» — translation_en: psychodynamics"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُثبت أن الصيغة المعيارية في المعاجم الطبية هي «الديناميكا النفسية» لا «الديناميكية النفسية»"

    - lemma: "حَرَكِيَّة نَفْسِيَّة"
      contradicts:
        - text: "«حركية» — translation_en: mobility"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
          conflict: "حركية تقابل mobility أو kinetics في المعاجم العلمية، لا dynamics بالمعنى النفسي"
        - text: "«حَرَكِيَّات» — translation_en: kinetics — مثلاً حركيات الدواء"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "حركيّات تقابل kinetics (علم الحركة الفيزيائي/الكيميائي) وليس dynamics بمفهومه النفسي"

    - lemma: "دِينَامِيكَا نَفْسِيَّة"
      confirm:
        - text: "«الدِّينامِيكا النَّفْسِيَّة» — translation_en: psychodynamics, translation_fr: psychodynamique"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(الديناميكا) علم يبْحَث فِي الْحَرَكَة بمعناها الْعَام (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«دِيناميكا [مفرد]: (فز) علم يبحث في الحركة بمعناها العام»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«عِلْمُ النَّفْسِ الدِّيناميكِيّ» — translation_en: dynamic psychology"
          source: "المعجم الطبي الموحد (2009)"
          addition: "مصطلح مرتبط يُشير إلى المجال العلمي الأوسع"

    - lemma: "تَفَاعُلِيَّة نَفْسِيَّة"
      contradicts:
        - text: "«تفاعلية» — نزعة عنصر كيميائي للاتحاد مع عناصر أو مركبات أخرى — translation_en: reactivity"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "تفاعلية مصطلح كيميائي يعني reactivity، لا علاقة له بالديناميكا النفسية"
        - text: "«تفاعلية» — مجموع خصائص أي نشاط تفاعلي — translation_en: interactivity"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          conflict: "تفاعلية تعني interactivity في سياق الاتصالات، وهي غير الديناميكا النفسية"

    - lemma: "تَحْرِيكِيَّة نَفْسِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "دِينَامِيكِيَّة نَفْسِيَّة"
      decision: confirmed
      decision_reason: "«ديناميكية» مصدر صناعي مُثبت في معجم اللغة العربية المعاصرة بمعنى الحركة والنشاط والحيوية، وصيغة «ديناميكية نفسية» مفهومة ومستعملة وإن كانت «الديناميكا النفسية» أكثر شيوعاً في المعاجم المتخصصة. تُبقى بوصفها صيغة بديلة صالحة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تُركّز على الخاصية أو الصفة الديناميكية للنفس (المصدر الصناعي)، بينما «الديناميكا النفسية» تُشير إلى العلم أو المجال المعرفي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دِينَامِيكِيَّة نَفْسِيَّة"

    # ── مرشّح المرحلة ١ — حركية نفسية ──
    - lemma: "حَرَكِيَّة نَفْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "«حركية» تقابل في المعاجم العلمية kinetics أو mobility، وليس dynamics بالمعنى النفسي. لا توجد شواهد على استعمال «حركية نفسية» بمعنى psychodynamics، واستعمالها قد يُوهم بالتحرّك الجسدي."
      evidence_assessment:
        case: contradicts_only

    # ── مرشّح المرحلة ١ — ديناميكا نفسية ──
    - lemma: "دِينَامِيكَا نَفْسِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مُثبتة في المعجم الطبي الموحد (2009) بصيغة «الدِّينامِيكا النَّفْسِيَّة» مقابلاً مباشراً لـ psychodynamics. وهي الصيغة المعيارية في الاستعمال الطبي والنفسي العربي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تُشير إلى المجال العلمي أو الإطار النظري (الديناميكا = العلم)، بينما «ديناميكية نفسية» تُفيد الخاصية أو السِّمة"
      actions:
        - command: create_entry
          params:
            lemma: "دِينَامِيكَا نَفْسِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشّح المرحلة ١ — تفاعلية نفسية ──
    - lemma: "تَفَاعُلِيَّة نَفْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "«تفاعلية» مصطلح مُستقرّ في الكيمياء (reactivity) والإعلام (interactivity)، ولا شاهد على استعماله في علم النفس. استخدامه قد يُحدث التباساً مع هذه المجالات."
      evidence_assessment:
        case: contradicts_only

    # ── مرشّح المرحلة ١ — تحريكية نفسية ──
    - lemma: "تَحْرِيكِيَّة نَفْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أي شواهد معجمية على استعمال «تحريكية» كمصطلح علمي. الصيغة مُولَّدة قياسياً لكنها غير مسكوكة ولا مُتداوَلة."
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
