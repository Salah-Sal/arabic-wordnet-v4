      nuance_differentiation: >
        التعبير الطبي الأقدم توثيقاً في المعاجم العربية المتخصصة؛ الصيغة الفعلية (تَفَاعُل)
        تُضمِّن إيحاءً ببلوغ حالة الطول كنتيجة عملية نموّ متدرّج، مما يجعله أنسب لوصف
