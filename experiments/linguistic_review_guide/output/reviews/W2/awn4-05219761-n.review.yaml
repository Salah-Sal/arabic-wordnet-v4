    - lemma: "اسْتِطَالَةُ الرَّأْسِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصدر Form X (استطال — استفعل) يُعبّر عن الصفة الموضوعية لبلوغ حالة الطول الهيكلي
        دون إيحاء تصنّع أو ترفّع. الشكل المرادف (الاسْتِطَالَةُ الرَّأْسِيَّة) موثّق في
        المعجم الطبي الموحد بصيغة وصفية، والشكل الإضافي (اسْتِطَالَةُ الرَّأْسِ) قياسي
