# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:

  definition:
    current: "صفة تطاول الجمجمة أو الرأس (طول الرأس كبير بالنسبة لعرضه)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يُعيد استخدام كلمة 'تطاول' في نصه مما يُنشئ دوراناً جزئياً مع
        اللمّة الرئيسية. كما أن الصياغة بين قوسين تبدو توضيحاً غير رسمي لا تعريفاً
        معجمياً. يُعاد صياغته بأسلوب المعجم الوسيط مع جنس قريب وفصل نوعي واضحَين.
    authored:
      - type: terminological
        text: "صفةٌ تشريحيةٌ تتميّز بها الجمجمة إذا زادت نسبةُ طولها الأمامي الخلفي على عرضها المستعرض زيادةً تتجاوز الحدَّ الطبيعي، فيبدو الرأس ممتداً في اتجاه طوله ضيّقاً في اتجاه عرضه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
