stage3_analysis:

  per_lemma:

    # ── اللمّة الموجودة ──────────────────────────────────────
    - lemma: "تطاول الرأس"
      decision: confirmed
      decision_reason: >
        موثّق في المعجم الطبي الموحد (ALECSO) بثلاثة مداخل مقابل dolichocephaly/dolichocephalism/
        dolichocephalia، مما يجعله مصطلحاً معياراً عربياً راسخاً. رغم أن Form VI (تطاول) يحمل
        دلالات إضافية (التكبّر، التصنّع)، فإن سياق المصطلح الطبي يُحكم دلالته في معنى الامتداد
        والطول الهيكلي، وهو الوجه الأصلي للجذر كما أثبته مقاييس اللغة («أصلٌ صحيحٌ يدلّ على
