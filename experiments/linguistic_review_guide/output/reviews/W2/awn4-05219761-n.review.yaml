# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمّة الوحيدة 'تطاول الرأس' مكتوبة بدون تشكيل"
      - "الفعل 'تطاول' (Form VI — تَفَاعُل) يحمل دلالةً شائعة للتكبّر والترفّع، مما يُنشئ تنافراً دلالياً مع الاستعمال التشريحي"
      - "التعريف الحالي يُكرّر كلمة 'تطاول' داخله مما يُفضي إلى دوران جزئي"
      - "اقتصار المجموعة على لمّة واحدة يُضعف التوسّع المصطلحي في المؤلَّفات الطبية والأنثروبولوجية"
      - "المعجم الطبي الموحد يُدرج 'طول الرأس' بتعريف دقيق لنفس المفهوم، غير أنه لم يُضمَّن في المجموعة"
    observations: >
      المجموعة تمثّل مصطلحاً طبياً أنثروبولوجياً دقيقاً (dolichocephaly)، وهو صفة تشريحية تتعلق
      بنسبة طول الجمجمة إلى عرضها. جميع المصطلحات العربية الموثّقة في قواعد البيانات المعجمية
      حديثة المنشأ (القرن العشرون) وتنتمي إلى نوع التركيب الإضافي أو الوصفي من جذر ط-و-ل.
      التركيب الأفضل لهذا المفهوم هو "اسْتِطَالَةُ الرَّأْسِ" لكونه يستعمل المصدر العاشر
      (Form X — استفعال) الذي يُعبّر عن البلوغ الطبيعي لحالة الطول الهيكلي، وهو أكثر دقةً
      من Form VI. كما أن "الاسْتِطَالَةُ الرَّأْسِيَّة" موثّقة في المعجم الطبي الموحد.

  # المرشحات الأربع (مولَّدة من التعريف فقط، قبل رؤية اللمّات)
  blind_candidates:
    - lemma: "اسْتِطَالَةُ الرَّأْسِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: مصدر الفعل (استطال — Form X) الدال على بلوغ حالة الطول الهيكلي + المضاف إليه
        (الرأس). يُعبّر عن الصفة الموضوعية للرأس المستطيل. اختبار السكّ: "اسْتِطَالَةُ الجمجمة"
        ممكنة لكن المركّب "استطالة الرأس" أكثر ثباتاً في الأدبيات الطبية كوحدة معجمية دالّة
        على هذا المفهوم تحديداً.

    - lemma: "الاسْتِطَالَةُ الرَّأْسِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي: المصدر العاشر (استطالة) + نعت نسبي (رأسية = cephalic). يُضفي طابعاً تشريحياً
        تقنياً. الوصف بالنسبة (رأسية) يُوضّح أن الاستطالة خاصة بالمنطقة الرأسية ويمنع اللبس
        مع استطالات أخرى. مسكوك في المعاجم الطبية الحديثة.

    - lemma: "طَوَلَانُ الرَّأْسِ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر ط-و-ل على وزن فَعَلَان (طَوَلَان) الدال على الاستمرار وحالة مطوّلة +
        المضاف إليه (الرأس). يستعيد الوزن فَعَلَان في وظيفة المصدر الدال على الحالة المستمرة.
        يستوفي قيد الأصالة العربية.

    - lemma: "دُولِيكُوسِيفَالِيَّة"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح اليوناني-الإنجليزي dolichocephaly بقبول لام التعريف والجمع السالم
        والنسبة. يُلجأ إليه ملاذاً أخيراً إن لم تُوجد بدائل عربية كافية.


