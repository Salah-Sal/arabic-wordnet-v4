        text: "في علم القياسات البشرية (الأنثروبومتريا)، يُحسب المؤشرُ الرأسي بقسمة أقصى عرض الرأس على أقصى طوله الأمامي الخلفي مضروبةً في مئة؛ فإذا بلغ المؤشر أقلَّ من خمسة وسبعين (75) صُنِّفت الجمجمةُ ذاتَ استطالة رأسية، وهو ما يُعرف طبياً بـtطويل الرأس (dolichocephalic)"
