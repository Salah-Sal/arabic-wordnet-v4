# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين مركَّبتان (MWE)؛ لا توجد لمّة أحادية الكلمة مُعجمنة للمفهوم"
      - "اللمّات خالية من التشكيل"
      - "«قلة الرواج» تحمل دلالة تجارية في المقام الأول (رواج البضاعة)، وليست مستقرَّة للدلالة الاجتماعية"
      - "جذر «روج» يُعدُّه ابن فارس دخيلاً غير أصيل، مما يُضعف الأساس المعجمي لـ«قلة الرواج»"
    observations: >
      المجموعة تُمثِّل المفهوم المجرد «unpopularity» — غياب القبول العام أو الاستحسان
      الجماهيري. «الشعبية» مصطلح حديث مستقر في المعاجم المعاصرة (المعجم الكبير يُعرِّفها
      بـ«حِظْوَة أو شُهْرَة»). أما «رواج» فأصله التجاري الطاغي يجعل «قلة الرواج» مُلتبسةً
      على مستوى الإطار الدلالي؛ فهي تُوحي بضعف التداول أو الرواج الاقتصادي أكثر من
      انعدام القبول الاجتماعي. المفهوم يقبل صياغة عربية فصيحة دون اللجوء إلى التعريب.

  blind_candidates:
    - lemma: "اللاَّشَعْبِيَّة"
      generation_method: ishtiqaq
      justification: >
        مُشتقٌّ بإضافة بادئة النفي «لا-» إلى المصدر الصناعي «شعبية»، نمط إنتاجي
        في العربية الحديثة للإشارة إلى نقيض الصفات المجردة (كاللاأدرية، واللامركزية).
        يدل مباشرة على غياب الشعبية.
    - lemma: "الكَسَادُ"
      generation_method: majaz
      justification: >
        الكساد في أصله ركود البضاعة وعدم الرغبة فيها (مقاييس اللغة: «يدلُّ على الشيء
        الدون لا يُرغب فيه»). بالمجاز الاستعاري يمكن أن يُشير إلى انعدام الإقبال العام
        على شخص أو فكرة. يُحيي اللفظ التراثي العربي الأصيل.
    - lemma: "المَرْذُولِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الجذر «رذل» (مقاييس اللغة: «الرذل: الدُّون من كُلِّ شيء»)،
        على وزن المصدر الصناعي (-يَّة) لتحويل الصفة إلى مفهوم مجرد. يدل على صفة
        الشيء الذي يُرذَل ويُرفض من قِبَل الناس.
    - lemma: "ضَعْفُ الإِقْبَال"
      generation_method: tarkib
      justification: >
        مركَّب إضافي (إضافي) من «ضعف» + «الإقبال»؛ يُعبِّر عن قِلَّة استجابة الجمهور
        وانصرافه. يُستعمل هذا التعبير ثابتاً في التقارير الإعلامية والدراسات الاجتماعية
        العربية.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عدم الشعبية"
      confirm:
        - text: "«حِظْوَةٌ, أو شُهْرَةٌ يَنالُها الشخصُ لدى عددٍ كبيرٍ مِنَ النَّاسِ. يُقَالُ: لَهُ شَعبِيَّةٌ كبيرةٌ, أوْ واسِعَةٌ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          # التعريف يُثبت استقرار «الشعبية» كمصطلح لمحبة الناس ورضاهم؛
          # فعدمها = انتفاء هذا الاستقرار
      expands:
        - text: "«الشِّينُ وَالْعَيْنُ وَالْبَاءُ أَصْلَانِ مُخْتَلِفَانِ، أَحَدُهُمَا يَدُلُّ عَلَى الِافْتِرَاقِ، وَالْآخَرُ عَلَى الِاجْتِمَاعِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            «شعب» أصله الاجتماع والافتراق؛ وتطور «الشعبية» إلى دلالة الحظوة الجماهيرية
            اشتقاق حديث من هذا الجذر. وجود الجذر في المقاييس يُسبغ على «الشعبية» شرعية
            اشتقاقية.

    - lemma: "قلة الرواج"
      contradicts:
        - text: "«رَاجَ الشَّيْءُ يَرُوجُ، إِذَا عُجِّلَ بِهِ... رَوَّجْتُ الدَّرَاهِمَ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            ابن فارس يُقيِّد «روج» بالتعجيل والتسريع، وعلى رأسه تسريع الدراهم (إنفاقها
            وتداولها)؛ فالمعنى تجاري صرف ولا يشمل القبول الاجتماعي العام.
        - text: "«رَاجَ رَواجاً: نَفَقَ. ورَوَّجْتُهُ تَرْويجاً: نَفَّقْتُهُ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: >
            الرواج = النفاق، أي بيع البضاعة وتصريفها. «قلة الرواج» تعني عدم التصريف
            التجاري لا انعدام القبول الاجتماعي.
        - text: "«الرَّاءُ وَالْوَاوُ وَالْجِيمُ لَيْسَ أَصْلًا... إِلَّا أَنِّي أُرَاهُ كُلَّهُ دَخِيلًا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            ابن فارس يُصرِّح بأن جذر «روج» ليس أصلاً عربياً وربما دخيل. هذا يُلقي ظلالاً
            من الشك على توظيف المشتقات منه في المجموعات المفهومية الجوهرية.

    - lemma: "اللاَّشَعْبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الكَسَادُ"
      confirm:
        - text: "«الْكَافُ وَالسِّينُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الشَّيْءِ الدُّونِ لَا يُرْغَبُ فِيهِ. مِنْ ذَلِكَ: كَسَدَ الشَّيْءُ كَسَادًا فَهُوَ كَاسِدٌ وَكَسِيدٌ. وَكُلُّ دُونٍ كَسِيدٌ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«كساد» — translation_en: slackness — domain: Commerce and Accounting"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ALECSO 1995)"
          conflict: >
            المصطلح مقيَّد بالمجال الاقتصادي في المصطلحية الحديثة، مما يُحصِّنه في الدلالة
            التجارية ويُصعِّب توظيفه للقبول الاجتماعي.

    - lemma: "المَرْذُولِيَّة"
      confirm:
        - text: "«الرَّاءُ وَالذَّالُ وَاللَّامُ قَرِيبٌ مِنَ الَّذِي قَبْلَهُ. فَالرَّذْلُ: الدُّونُ مِنْ كُلِّ شَيْءٍ، وَكَذَلِكَ الرُّذَالُ»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "ضَعْفُ الإِقْبَال"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عدم الشعبية"
      decision: confirmed
      decision_reason: >
        «الشعبية» مُثبَّتة في المعجم الكبير بدلالة الحظوة الجماهيرية، وجذرها «شعب» أصيل
        في مقاييس اللغة. «عدم الشعبية» مركَّب إضافي منتج ومستقر في الاستعمال المعاصر
        (صحافة، سياسة، اجتماع). تشكيله يحتاج إضافة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      borrowing_check:
        lexical_borrowing: "شعبية مشتقة من الجذر العربي الأصيل شعب — فصيحة"
        calque_check: "التركيب الإضافي «عدم + مصدر صناعي» نمط عربي منتج ومقبول"
      term_quality:
        اطراد: "نعم — يُطَّرد مع عدم الإخلاص، عدم الجدارة"
        يسر_التداول: "نعم — متداول في الإعلام والخطاب السياسي"
        ملاءمة: "نعم — يُعبِّر عن المفهوم دون التباس"
        إيثار_التراثي: "متحقق جزئياً — شعبية مشتقة لكنها حديثة"
        اشتقاقية: "نعم — عدم + شعبية"
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة؛ تُعبِّر عن انتفاء الحظوة الجماهيرية كصفةٍ
        مجردة للشخص أو الشيء، وتمتاز عن «عدم الشهرة» بتركيزها على الرضا الجماعي
        لا على مجرد الانتشار، وعن «الإهمال» بكونها حالة قائمة لا فعلاً موجَّهاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ الشَّعْبِيَّة"

    - lemma: "قلة الرواج"
      decision: removed
      decision_reason: >
        «رواج» ذو دلالة تجارية صرفة في المصادر المعجمية (القاموس المحيط: نَفَقَ = بيع
        البضاعة؛ المعجم الموحد: slackness في التجارة والمحاسبة). علاوة على ذلك، صرَّح
        ابن فارس بأن جذر «روج» ليس أصلاً عربياً وأرجحه دخيلاً. تطبيق «قلة الرواج»
        على انعدام القبول الاجتماعي استعمال مجازي بعيد يُلبِّس المفهوم ولا يُوضِّحه،
        ولا داعي إليه وجود «عدم الشعبية» الأدق.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اللاَّشَعْبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُسجَّل في أي معجم ولا في قواعد بيانات المصطلحات. فضلاً عن ذلك فهي مرادف
        تام لـ«عدم الشعبية» دون أي فارق دلالي يُبرِّر ازدواج التمثيل. اختبار الاستبدال
        يُثبت تطابقهما السياقي الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "الكَسَادُ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن مقاييس اللغة يُثبت لجذر «كسد» معنى الشيء الرديء غير المرغوب فيه، فإن
        الاستعمال المصطلحي الحديث قيَّده بالكساد الاقتصادي. الامتداد الدلالي إلى القبول
        الاجتماعي يستلزم إحياءً متعمَّداً وشرحاً سياقياً لا يليق باللمّة المعجمية.
        اختبار السكّ: يمكن تعويضه بـ«ضعف الإقبال» أو «عدم الشعبية» مما يدل على عدم
        تثبيته اصطلاحاً في هذا الحقل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "المَرْذُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر «رذل» في مقاييس اللغة يحمل معنى الدونية الأخلاقية والاجتماعية («الدون من
        كل شيء»)، وهو أشد حدةً من مجرد انعدام الشعبية؛ إذ يتضمن ذمَّاً وحكماً
        قيمياً لا تحمله «unpopularity». المفهوم المستهدف محايد أخلاقياً، فيما المرذولية
        تُشير إلى الرذيل المحتقَر.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "ضَعْفُ الإِقْبَال"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا تجتاز اختبار السكّ: يمكن إحلال «قلة الإقبال» أو «شُح الإقبال»
        محلها بلا تغيير في الدلالة، مما يُثبت أنها ليست وحدة معجمية ثابتة. لا أدلة
        تُثبت تثبيتها اصطلاحاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────
stage4_content:
  definition:
    current: "صفة الافتقار إلى الموافقة العامة أو القبول"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي جيد البنية لكنه يُقدِّم الجنس القريب («صفة») بشكل مبهوم
        — «صفة الافتقار» تركيبٌ يجعل الصفةَ نفسَها هي الافتقار وليس صفة الشيء المفتقِر.
        كذلك «الموافقة» و«القبول» يتداخلان دون توجيه. يُقترح تعديله بأسلوب المعجم
        الوسيط ليُبرز الجنس والفصل بوضوح.
    authored:
      - type: terminological
        text: "صِفَةُ الشَّخْصِ أو الشَّيْءِ الَّذي يَفْتَقِرُ إلى القَبُولِ العَامِّ وَالاسْتِحْسَانِ الجَمَاهيريِّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "خُلُوُّ الشَّخْصِ أو الشَّيْءِ مِن حُظْوَةِ الجَمَاهيرِ وَرِضَاهُم"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04816341-n"
          definition_index: 0
          text: "صِفَةُ الشَّخْصِ أو الشَّيْءِ الَّذي يَفْتَقِرُ إلى القَبُولِ العَامِّ وَالاسْتِحْسَانِ الجَمَاهيريِّ"
      - command: add_definition
