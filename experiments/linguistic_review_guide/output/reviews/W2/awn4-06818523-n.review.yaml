# ══════════════════════════════════════════════════════════════
# المرحلة ١ — المراجعة والتوليد (بدون أدلة)
# Stage 1: Review + Generate (blind — from masked file only)
# ══════════════════════════════════════════════════════════════
stage1_review:

  # ── أ. التوليد الأعمى — من التعريف فقط ──────────────────
  # التعريف المُقنَّع: "إشارة مرسلة عن طريق التلغراف"
  # المفهوم المُستقرأ: إشارة تُبَثّ عبر منظومة الإبراق الكهربائي

  blind_candidates:
    - lemma: "بَرْقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مشتقة من الجذر (ب ر ق) على وزن فَعْلِيَّة (نسب)، وهي الإشارة أو
        الرسالة التي يُرسلها البرق أي جهاز التلغراف الكهربائي. الاشتقاق
        وارد وقياسي، والمصطلح متداول في العربية المعاصرة.

    - lemma: "وَمِيضَة"
      generation_method: majaz
      justification: >
        من (ومض) أي لمع بريقاً خاطفاً، والتلغراف يُرسل إشاراته على شكل
        ومضات كهربائية قصيرة وطويلة (شفرة مورس). المجاز من اللمعان إلى
        الإشارة الكهربائية المتقطعة قريب ومُبرَّر وظيفياً.

    - lemma: "إِشَارَة سِلْكِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي (إضافة صفة نسبية إلى إشارة)، يُحيل إلى طبيعة التلغراف
        القائمة على الأسلاك الكهربائية، مما يُميّزه عن الإشارات اللاسلكية
        الأخرى.

    - lemma: "مُبْرَقَة"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من أبرقَ (أرسل برقية/تلغرافاً)، أي ما أُبرق به، تعريفاً
        للإشارة المُرسَلة عبر منظومة البرق الكهربائي. الوزن (مُفْعَلَة)
        قياسي للدلالة على المُرسَل أو المُنجز.

  # ── ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل ──
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('إشارة برقية' و'إشارة تلغرافية') خاليتان من التشكيل الكامل."
      - "'إشارة تلغرافية' تستخدم الكلمة المعرَّبة 'تلغرافية' (< telegraph) بدلاً من العربية الأصيلة 'برقية'."
      - "الفرق الدلالي بين اللمّتين غير موثَّق؛ هما يبدوان مترادفتين تامّتين وقد يُوجد توجيه للتمييز بينهما."
      - "التعريف العربي الحالي ('إشارة مرسلة عن طريق التلغراف') يحتمل التحسين الأسلوبي واستخدام المصطلح العربي الأصيل 'الإبراق'."
      - "الإشارة الإنجليزية الثانية 'radiotelegraphic signal' تُشير إلى التلغراف اللاسلكي، وهو مفهوم أشمل من التلغراف السلكي؛ هذا التمييز غائب عن اللمّات العربية."
    observations: >
      المجموعة الترادفية تتناول مفهوماً تقنياً تاريخياً هو الإشارة المُبثَّة عبر منظومة
      التلغراف (الإبراق). اللمّة الأولى 'إشارة برقية' عربية أصيلة وموثَّقة معجمياً في
      موسوعة الكهرباء الدولية (IEC 60050). اللمّة الثانية 'إشارة تلغرافية' معرَّبة من
      telegraph وأعمّ دلالةً إذ تشمل التلغراف اللاسلكي أيضاً، لكنها لم تُوثَّق في قاعدة
      البيانات المعجمية. يُلاحَظ غياب التشكيل وغياب توثيق الفارق الدلالي بين اللمّتين.


# ══════════════════════════════════════════════════════════════
# المرحلة ٢ — جمع الأدلة
# Stage 2: Evidence Gathering
# ══════════════════════════════════════════════════════════════
# الاستعلامات المُنفَّذة (٣ استعلامات):
#   Q1 — مطابقة دفعية: إشارة برقية / إشارة تلغرافية / برقية / وميضة / إشارة سلكية / مبرقة
#   Q2 — جسر إنجليزي: telegraphic signal / telegraph signal / radiotelegraphic signal / telegraphy
#   Q3 — مقاييس اللغة (dictionary_id=151): جذرا (شور) و(برق)
stage2_evidence:
  per_lemma:

    # ── ١. إشارة برقية (لمّة موجودة) ──────────────────────
    - lemma: "إشارة برقية"
      confirm:
        - text: "«إشارة برقية» [= telegraph signal]"
          source: "موسوعة الكهرباء الدولية (IEC 60050) — معجم ArabTerm Electropedia"
      expands:
        - text: >
            «خدمة برقية» [= telegraph service] / «شفرة برقية» [= telegraph code] /
            «قناة إبراق» [= telegraph channel] / «مرحل إبراق» [= telegraph relay]
          source: "موسوعة الكهرباء الدولية (IEC 60050)"
          addition: >
            تكشف هذه المصطلحات المجاورة أن 'إشارة برقية' مصطلح مُدمَج في منظومة
            مصطلحية متكاملة في المعجم التقني الدولي المُعرَّب عربياً.

    # ── ٢. إشارة تلغرافية (لمّة موجودة) ───────────────────
    - lemma: "إشارة تلغرافية"
      evidence_status: "no_material_found"

    # ── ٣. بَرْقِيَّة (مرشح المرحلة ١) ─────────────────────
    - lemma: "بَرْقِيَّة"
      confirm:
        - text: >
            «(البَرقية) رِسَالَة ترسل من مَكَان إِلَى آخر بوساطة جهاز التلغراف (مج)»
          source: "المعجم الوسيط (OCR) — المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: >
            «رسالة ترسل من مكان إلى آخر بوساطة جهاز التلغراف»
          source: "المعجم الوسيط (OCR — المرجع الأساسي)"
        - text: >
            «(Telegram): رسالة تبلغ بالتلفراف»
          source: "المعجم الكبير (OCR)"
      contradicts:
        - text: >
            جميع المداخل المعجمية لـ'برقية' تُعرِّفها بأنها «رسالة» (message/telegram)
            لا «إشارة» (signal). مداخل ArabTerm: translation_en = telegram / cable / wire.
          source: "المعجم الوسيط، المعجم الكبير، ArabTerm (فيزياء، اتصالات، فنون)"
          conflict: >
            دلالة 'برقية' في المعاجم هي رسالة التلغراف (message) لا الإشارة الكهربائية
            (signal)؛ وهذا تعارض جوهري مع مفهوم المجموعة الترادفية.

    # ── ٤. وَمِيضَة (مرشح المرحلة ١) ──────────────────────
    - lemma: "وَمِيضَة"
      evidence_status: "no_material_found"

    # ── ٥. إشارة سلكية (مرشح المرحلة ١) ───────────────────
    - lemma: "إِشَارَة سِلْكِيَّة"
      evidence_status: "no_material_found"

    # ── ٦. مُبْرَقَة (مرشح المرحلة ١) ──────────────────────
    - lemma: "مُبْرَقَة"
      contradicts:
        - text: >
            «مبرقة: جهاز ارسال برقي» [translation_en: telegraph]
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ArabTerm"
          conflict: >
            'مبرقة' في المعاجم التقنية = جهاز التلغراف ذاته (الآلة)، لا الإشارة المُرسَلة
            منه؛ الدلالة مغايرة للمجموعة تماماً.
        - text: >
            «مُبْرِقة» [translation_en: telegraph]
          source: "مسرد الإعلام والتواصل — ArabTerm"
          conflict: >
            نفس التعارض: المبرقة = الجهاز لا الإشارة.


# ══════════════════════════════════════════════════════════════
# المرحلة ٣ — التحليل اللغوي للمّات
# Stage 3: Lemma Linguistic Analysis
# ══════════════════════════════════════════════════════════════
stage3_analysis:
  per_lemma:

    # ── ١. إشارة برقية ────────────────────────────────────
    - lemma: "إشارة برقية"
      decision: confirmed
      decision_reason: >
        اللمّة مدعومة بدليل معجمي مباشر من موسوعة الكهرباء الدولية (IEC 60050) بمعنى
        'telegraph signal' الموافق تماماً لمفهوم المجموعة. المركب وصفي ثابت في المعجم
        التقني الدولي. تحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        تُحيل 'إشارة برقية' إلى طبيعة الإشارة الكهربائية ذات الصلة بالبرق (التيار
        الكهربائي) عبر الأسلاك السلكية؛ وهي المصطلح المُوثَّق في المعيار الدولي IEC 60050.
        تختص تاريخياً بمنظومة التلغراف السلكي.
      morphological_check: >
        المركب الوصفي (إشارة + برقية) مقيس وصحيح: إشارة اسم من شارَ/أشارَ على وزن
        إفَالة، وبَرْقِيَّة نسبة إلى البرق على وزن فَعْلِيَّة. الوزن ملائم وظيفياً
        للصفة التقنية.
      borrowing_check:
        lexical_borrowing: عربية أصيلة — لا اقتراض لفظي
        calque_check: مقبول — الهيكل عربي محض
      quality_gate:
        ittiraad: مطّرد في المعجم التقني
        yusr_tadawul: متداول في السياق التقني
        mulaema: ملائم للمفهوم الدلالي
        turaathi: البرق لفظ عربي أصيل
        arabi: بنية عربية كاملة
        ishtiqaqiyya: مشتق قياسي
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَةٌ بَرْقِيَّةٌ"

    # ── ٢. إشارة تلغرافية ─────────────────────────────────
    - lemma: "إشارة تلغرافية"
      decision: confirmed
      decision_reason: >
        المصطلح مقبول بوصفه مرادفاً أشمل يشمل التلغراف اللاسلكي (radiotelegraphic
        signal)، وهو ما يُبرر وجوده إلى جانب 'إشارة برقية'. 'تلغرافية' تعريب راسخ
        لـtelegraphic ويقبل الإعراب والنسب والجمع. اللمّة مفيدة للتمييز بين السياقات
        السلكية واللاسلكية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        'إشارة تلغرافية' أعمّ دلالةً تشمل أي إشارة تنتمي إلى منظومة التلغراف بصرف
        النظر عن الوسيط (سلكي أو لاسلكي)؛ وتُقابل تحديداً 'radiotelegraphic signal'
        الواردة في lemmas_en للمجموعة، وهو ما يُسوِّغ إبقاءها.
      morphological_check: >
        تلغرافية: تعريب من telegraph (يوناني–لاتيني)، مقبول وفق قواعد التعريب العربي،
        يقبل ال-التعريف والنسبة والجمع. المركب وصفي (إشارة + تلغرافية) مقيس.
      borrowing_check:
        lexical_borrowing: "تلغرافية معرَّبة (مقبول — مصطلح عالمي راسخ)"
        calque_check: مقبول — يعكس telegraphic بدقة
      quality_gate:
        ittiraad: مطّرد في السياق التقني
        yusr_tadawul: متداول في المعاجم التقنية الحديثة
        mulaema: ملائم للمفهوم الدلالي ويشمل النوع اللاسلكي
        turaathi: "تلغراف معرَّب — يُفضَّل تجنبه لكن مقبول للضرورة الاصطلاحية"
        arabi: الهيكل التركيبي عربي، المادة المعجمية معرَّبة
        ishtiqaqiyya: قابل للاشتقاق (تلغرافي، تلغرافيات)
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَةٌ تِلِغْرَافِيَّةٌ"

    # ── ٣. بَرْقِيَّة (مرشح المرحلة ١) — مرفوض ──────────
    - lemma: "بَرْقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم تُثبت أن 'بَرْقِيَّة' = رسالة التلغراف (message/telegram) لا الإشارة
        الكهربائية (signal). الدلالة المعجمية الراسخة تتعارض مع مفهوم المجموعة؛
        إدراجها سيُضاف إضافة مضلِّلة.

    # ── ٤. وَمِيضَة (مرشح المرحلة ١) — مرفوض ─────────────
    - lemma: "وَمِيضَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي لـ'وميضة' بالمعنى التقني المطلوب. الاشتقاق
        وجيه أصلياً لكن المصطلح غير مسكوك ولم يُستعمَل في المعاجم التقنية بهذه
        الدلالة.

    # ── ٥. إِشَارَة سِلْكِيَّة (مرشح المرحلة ١) — مرفوض ──
    - lemma: "إِشَارَة سِلْكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي. كذلك المفهوم أعمّ مما تصفه المجموعة — 'إشارة سلكية' تشمل
        أي إشارة كهربائية منقولة بالأسلاك وليس التلغراف تحديداً.

    # ── ٦. مُبْرَقَة (مرشح المرحلة ١) — مرفوض ─────────────
    - lemma: "مُبْرَقَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم التقنية (ArabTerm) تُثبت أن 'مبرقة' = جهاز التلغراف (telegraph device)
        لا الإشارة المُرسَلة؛ تعارض دلالي صريح مع مفهوم المجموعة.


# ══════════════════════════════════════════════════════════════
# المرحلة ٤ — التعريف والأمثلة
# Stage 4: Definitions & Examples
# ══════════════════════════════════════════════════════════════
# اللمّات المعالجة: إِشَارَةٌ بَرْقِيَّةٌ + إِشَارَةٌ تِلِغْرَافِيَّةٌ فقط
stage4_content:

  definition:
    current: "إشارة مرسلة عن طريق التلغراف"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح لكنه مجرد ترجمة حرفية للتعريف الإنجليزي. يُمكن تحسينه
        بـ: (أ) استخدام المصطلح العربي 'الإبراق' بدل 'التلغراف' المعرَّب،
        (ب) إضافة الجنس القريب والفصل النوعي وفق أسلوب المعجم الوسيط،
        (ج) إضافة تعريف موسوعي يُوضّح طبيعة الإشارة (نبضات كهربائية) وسياق استخدامها.
    authored:
      - type: terminological
        text: >
          إشارةٌ كهربائية تُبَثّ عبر منظومة الإبراق لنقل رسائل مشفَّرة إلى مسافة بعيدة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          إشارة تُنقَل في صورة نبضات كهربائية متقطعة وفق شفرة مورس أو ما شابهها عبر
          جهاز التلغراف (المِبرقة)، سواء أكانت الوسيلة أسلاكاً كهربائية أم موجات
          راديوية؛ استُخدمت تاريخياً للتواصل السريع بين المؤسسات العسكرية والتجارية
          والحكومية.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-06818523-n"
          definition_index: 0
          text: "إشارةٌ كهربائية تُبَثّ عبر منظومة الإبراق لنقل رسائل مشفَّرة إلى مسافة بعيدة."
      - command: add_definition
        params:
          synset_id: "awn4-06818523-n"
          text: >
            إشارة تُنقَل في صورة نبضات كهربائية متقطعة وفق شفرة مورس أو ما شابهها عبر
            جهاز التلغراف (المِبرقة)، سواء أكانت الوسيلة أسلاكاً كهربائية أم موجات
            راديوية.

  examples:
    per_lemma:
      - lemma: "إِشَارَةٌ بَرْقِيَّةٌ"
        examples:
          - text: >
              استقبلَ المركزُ العسكريُّ الإشارةَ البرقيةَ في غضون ثوانٍ، فأصدرَ
              قادتُه أوامرَهم بالتحرك فوراً.
            type: usage
      - lemma: "إِشَارَةٌ تِلِغْرَافِيَّةٌ"
        examples:
          - text: >
              تمكَّن المهندسُ من فكِّ شفرةِ الإشارةِ التلغرافيةِ التي أرسلَتها السفينةُ
              مستغيثةً قبيلَ غرقِها.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            استقبلَ المركزُ العسكريُّ الإشارةَ البرقيةَ في غضون ثوانٍ، فأصدرَ
            قادتُه أوامرَهم بالتحرك فوراً.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            تمكَّن المهندسُ من فكِّ شفرةِ الإشارةِ التلغرافيةِ التي أرسلَتها السفينةُ
            مستغيثةً قبيلَ غرقِها.


# ══════════════════════════════════════════════════════════════
# المرحلة ٥ — الإثراء (البيانات الوصفية)
# Stage 5: Enrichment (Metadata)
# ══════════════════════════════════════════════════════════════
stage5_enrichment:

  per_entry:
    # ── إِشَارَةٌ بَرْقِيَّةٌ (MWE — وصفي) ──────────────────
    - lemma: "إِشَارَةٌ بَرْقِيَّةٌ"
      entry_id: "{auto}"
      roots:
        - word: "إشارة"
          root: "شور"
