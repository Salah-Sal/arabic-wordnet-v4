stage1_review:
  assessment:
    concerns:
      - "التعريف العربي بسيط جداً ويفتقر للوصف المعجمي الدقيق."
      - "لا توجد سوى لمّة واحدة في المجموعة."
    observations: "المفهوم واضح لغوياً ويرتبط بظاهرة 'الثؤباء'. الجذر (ثأب) هو الأصل الصحيح، بينما (ثوب) و(ثأو) يشيع استخدامهما خطأً."
  blind_candidates:
    - lemma: "مُتَثَائِبٌ"
      generation_method: ishtiqaq
      justification: "اسم الفاعل القياسي من الفعل (تثاءبَ) الذي يعني فتح الفم استرخاءً."
    - lemma: "مَثْؤُوبٌ"
      generation_method: ishtiqaq
      justification: "اسم المفعول من الفعل (ثُئِبَ) أي أصابه الكسل والتثاؤب، وهو لفظ تراثي دقيق."
    - lemma: "مُتَثَئِّبٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل (تثأّبَ) وهو لغة في تثاءبَ."
    - lemma: "فَاغِرٌ"
      generation_method: majaz
      justification: "من (فغر فاه) وهو وصف للشخص الذي يفتح فمه، وكثيراً ما يقترن بالتثاؤب."

stage2_evidence:
  per_lemma:
    - lemma: "مُتَثَائِبٌ"
      confirm:
        - text: "«تثاءب الشَّخصُ: فتح فمه وأطبقه بحركة لا إراديّة نتيجة كسل أو نُعاس أو ملل... فهو مُتثائب»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«المُتثائب: (1) المُتثائب (2) المُضْجِر: شيء يسبِّب الضَّجر.»"
          source: "المورد الحديث (2008)"
    - lemma: "مَثْؤُوبٌ"
      confirm:
        - text: "«مَثْؤُوبٌ: Affected with sluggishness and languor like the languor of drowsiness: from ثُئِبَ»"
          source: "قاموس لين (Lane's Lexicon)"
        - text: "«ثُئِبَ الرَّجُلُ ثَأْبًا وتَثَأَبَ وتَثاءَبَ أَصابَه كَسَلٌ وتَوْصِيمٌ... فهو مَثْؤُوب»"
          source: "تاج العروس (نقلاً عن لسان العرب)"
    - lemma: "مُتَثَئِّبٌ"
      confirm:
        - text: "«ثأب... وتَثَأّبَ... فهو مُتَثَئِّبٌ»"
          source: "المحيط في اللغة للصاحب بن عباد"
    - lemma: "فَاغِرٌ"
      expands:
        - text: "«يَفْغر فمه... تحديق مع فتح الفم... يتثاءب»"
          source: "المورد الحديث (2008)"

stage3_analysis:
  per_lemma:
    - lemma: "مُتَثَائِب"
      decision: confirmed
      decision_reason: "اللمّة الأساسية والمطابقة للمفهوم، وهي اسم الفاعل القياسي من الفعل المشهور."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَثَائِبٌ"
    - lemma: "مَثْؤُوبٌ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي أصيل يعبر عن الحالة التي تصيب الشخص المتثائب، ورد ذكره في المعاجم الكبرى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَثْؤُوبٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُتَثَئِّبٌ"
      source: stage1
      decision: confirmed
      decision_reason: "اسم فاعل من الفعل (تثأّبَ) وهو وجه لغوي صحيح وموثق في المعاجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُتَثَئِّبٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يتثائب"
    assessment:
      decision: revise
      reason: "التعريف الحالي فقير لغوياً ويفتقر للدقة المعجمية التي تصف الحركة والسبب."
    authored:
      - type: terminological
        text: "شَخْصٌ يَفْتَحُ فَاهُ بِحَرَكَةٍ لا إرَادِيَّةٍ نَتِيجَةَ مَا يَعْتَرِيهِ مِنْ فَتْرَةٍ كَالنُّعَاسِ أو كَسَلٍ أو مَلَلٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "مُتَثَائِبٌ"
        examples:
          - text: "بَدَا المُتَثَائِبُ مُنْهَكاً بَعْدَ لَيْلَةٍ طَوِيلَةٍ مِنَ العَمَل."
            type: usage
      - lemma: "مَثْؤُوبٌ"
        examples:
          - text: "رَأَيْتُهُ مَثْؤُوباً فِي مَجْلِسِهِ لا يَكَادُ يَجْمَعُ شَتَاتَ فِكْرِهِ."
            type: usage
      - lemma: "مُتَثَئِّبٌ"
        examples:
          - text: "مَا بَالُكَ مُتَثَئِّباً هَكَذَا مُنْذُ الصَّبَاح؟"
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "شَخْصٌ يَفْتَحُ فَاهُ بِحَرَكَةٍ لا إرَادِيَّةٍ نَتِيجَةَ مَا يَعْتَرِيهِ مِنْ فَتْرَةٍ كَالنُّعَاسِ أو كَسَلٍ أو مَلَلٍ."}

stage5_enrichment:
  per_entry:
    - lemma: "مُتَثَائِبٌ"
      entry_id: "{auto}"
      root: "ثأب"
    - lemma: "مَثْؤُوبٌ"
      entry_id: "{auto}"
      root: "ثأب"
    - lemma: "مُتَثَئِّبٌ"
      entry_id: "{auto}"
      root: "ثأب"
  per_sense:
    - lemma: "مُتَثَائِبٌ"
      sense_id: "{auto}"
      nuance: "هو الاسم الشائع والمعاصر للشخص الذي يقوم بفعل التثاؤب."
      mwe: false
    - lemma: "مَثْؤُوبٌ"
      sense_id: "{auto}"
      nuance: "لفظ تراثي يركز على الحالة التي غلبت الشخص (المفعولية من ثُئِبَ)."
      mwe: false
    - lemma: "مُتَثَئِّبٌ"
      sense_id: "{auto}"
      nuance: "اسم فاعل من صيغة (تفعّل) التي قد تشير إلى محاولة رد التثاؤب أو وقوعه بتكلف."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ثأب"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"هو الاسم الشائع والمعاصر للشخص الذي يقوم بفعل التثاؤب.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
