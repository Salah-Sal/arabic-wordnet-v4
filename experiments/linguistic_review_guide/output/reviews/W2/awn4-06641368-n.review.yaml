# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — Review: awn4-06641368-n
# acknowledgment / acknowledgement — إِقْرَار، اعْتِرَاف، تَقْدِير
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تَقْدِير» معناها الأساسي تحديد مقدار الشيء أو تبيين كميته، وليس الإقرار ببيان؛ ربطها بمفهوم acknowledgment ترجمة دلالية غير دقيقة"
      - "التعريف العربي الحالي مقتضب وقريب من الترجمة الحرفية للتعريف الإنجليزي"
    observations: "المجموعة تدور حول مفهوم البيان الذي يُقَرّ فيه بشيء أو بفضل شخص. اللمّتان إقرار واعتراف مناسبتان دلالياً، أمّا تقدير فدلالتها الأصلية التحديد والتثمين لا الإقرار والاعتراف. هناك فرق دقيق بين الإقرار (إخبار بحقٍّ سابق) والاعتراف (إظهار معرفة الذنب أو الفضل) يستحق التوثيق."
  blind_candidates:
    - lemma: "إِقْرَار"
      generation_method: ishtiqaq
      justification: "مصدر أقرَّ بـ على وزن إفعال من الجذر (ق ر ر)، يدل على الإخبار بثبوت حقٍّ والتسليم به، وهو أدقّ مقابل عربي لمفهوم البيان المُعترِف بشيء"
    - lemma: "اعْتِرَاف"
      generation_method: ishtiqaq
      justification: "مصدر اعترف على وزن افتعال من الجذر (ع ر ف)، أصله إظهار المعرفة بالشيء والإقرار به، يُستعمل في الإقرار بالفضل أو بالذنب"
    - lemma: "تَنْوِيه"
      generation_method: ishtiqaq
      justification: "مصدر نوَّه بـ على وزن تفعيل من الجذر (ن و ه)، أصله رفع ذكر الشيء وتعظيمه، وقد شاع استعماله بمعنى الإشارة والتنبيه"
    - lemma: "تَسْلِيم"
      generation_method: ishtiqaq
      justification: "مصدر سلَّم بـ على وزن تفعيل من الجذر (س ل م)، يفيد الإذعان والقبول بالشيء، ويُستعمل بمعنى الإقرار والتسليم بصحة أمر"

stage2_evidence:
  per_lemma:
    - lemma: "إِقْرَار"
      confirm:
        - text: "«الإقرار: إخبار عما سبق.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الإقرار: هو في الشرع إخبارٌ بحقٍّ لآخر عليه.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الإِقْرَار: الْإِخْبَار عَن ثُبُوت حق سَابق.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الإقرار: إظهار الالتزام بما خفي أمره، قاله الحرالي. وقال غيره: لغة: إثبات الشيء ويكون بالقلب أو اللسان، وشرعا، إخبار بحق لآخر عليه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الإقرار: في الشرع إخبار بحق لآخر عليه. فقولنا إخبار أي إعلام بالقول»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(1) اعتراف (2) إقرار؛ تسليم بصحة شيء (3) شُكر؛ تنويه (4) إشعار باستلام»"
          source: "المورد الحديث (2008) — مدخل acknowledgment"
        - text: "«إقرار، تأييد، إعلام»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — مدخل acknowledgement"

    - lemma: "اعْتِرَاف"
      confirm:
        - text: "«الاعتراف: الإقرار، وأصله إظهار معرفة الذنب وذلك ضد الجحود.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«إقرار الشخص بجميل الآخر وشكره على مساهمته في إنجاز عمل.»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — مدخل acknowledgement"
        - text: "«(1) اعتراف (2) إقرار؛ تسليم بصحة شيء»"
          source: "المورد الحديث (2008) — مدخل acknowledgment"
      expands:
        - text: "«اعْتَرَفَ بِالشَّيْءِ، إِذَا أَقَرَّ، كَأَنَّهُ عَرَّفَهُ فَأَقَرَّ بِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يبيّن الأصل الاشتقاقي: الاعتراف مبنيّ على المعرفة ثم الإقرار"

    - lemma: "تَقْدِير"
      contradicts:
        - text: "«التقدير: هو تحديد كل مخلوق بحده الذي يوجد من حسن وقبح، ونفع وضر، وغيرهما.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "المعنى الأساسي تحديد المقدار والحدّ، لا الإقرار أو الاعتراف ببيان"
        - text: "«التقدير، تبيين كمية الشيء... والتقدير من الإنسان وجهان: أحدهما التفكر في الأمر بحسب نظر العقل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "دلالة التفكّر والتبيين الكمّي بعيدة عن مفهوم بيان الإقرار"
      expands:
        - text: "«(2) تقدير [لفضلٍ أو خدمةٍ إلخ]... تقديرًا لخدماته؛ اعترافًا بخدماته»"
          source: "المورد الحديث (2008) — مدخل recognition"
          addition: "التقدير يُستعمل بمعنى الاعتراف بالفضل في السياق الاجتماعي، لا بمعنى بيان الإقرار الرسمي"
        - text: "«إبداء الاحترام لشخص ما اعتبارا لفضله أو مجهوده.»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — مدخل esteem"
          addition: "ترجم تقدير بـ esteem لا بـ acknowledgment، ما يؤكد أنّ دلالته الاحترام والتثمين"

    - lemma: "تَنْوِيه"
      confirm:
        - text: "«التنويه: رفع ذكر الشيء وتعظيمه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«تَنْوِيه — الجذر: ن و هـ — الرأي: مرفوضة — السبب: لعدم ورود الكلمة بهذا المعنى في المعاجم. المعنى: تَنْبِيه ولفت نَظَر — الصواب والرتبة: تنويهٌ بضرورة الحضور مبكِّرًا [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "المعنى الأصلي رفع الذكر والتعظيم، لا الإقرار ببيان رسمي؛ واستعماله بمعنى التنبيه محلّ خلاف"

    - lemma: "تَسْلِيم"
      evidence_status: "no_material_found"

