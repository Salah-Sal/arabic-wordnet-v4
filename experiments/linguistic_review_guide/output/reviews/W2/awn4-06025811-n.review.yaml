          addition: "يكشف أن المعجم ذاته يستخدم 'مجال' (لا 'فترة') لـ open interval، مما يكشف عن عدم اطّراد داخلي في التعامل مع مصطلح interval"

    - lemma: "قِطْعَة"
      expands:
