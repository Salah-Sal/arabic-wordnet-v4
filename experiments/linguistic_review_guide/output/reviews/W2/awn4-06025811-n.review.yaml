          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (d. 1777 CE) — entry_id: 820412"
          addition: "يُثبت أن 'القطعة' لها استخدام هندسي-رياضي تراثي، لكنه مقيّد بالأشكال الهندسية (دائرة، كرة) لا بالفترات على المحور الحقيقي"
        - text: "«قطعة» ← segment (Mathematics and Astronomy)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ALECSO, 1990) — entry_id: 417557"
          addition: "في ARABTERM الرياضي 'قطعة' = segment (لا interval)، مما يُمايز دلالتها عن دلالة 'فترة مغلقة'"

    - lemma: "فَتْرَةٌ مَحْصُورَة"
