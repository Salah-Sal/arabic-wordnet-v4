  # ميزانية الاستعلامات المنفّذة: ٣ استعلامات (من ٥-٨)
  # الاستعلام ١: مطابقة دفعية للمّات الموجودة والمرشحات وعائلتها
  # الاستعلام ٢: الجسر الإنجليزي مع المصطلحات الرياضية
  # الاستعلام ٣: مقاييس اللغة لابن فارس للجذرين فتر وغلق
  per_lemma:
