# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (فترة مغلقة)، مما قد يُضيّق التمثيل المصطلحي في السياقات الرياضية المختلفة"
      - "التشكيل غائب عن اللمّة الموجودة 'فترة مغلقة'"
      - "ثمة تعارض مصطلحي في المعجم الموحد للرياضيات (ARABTERM 1990) إذ يستخدم 'فترة' للفترة المغلقة و'مجال' للفترة المفتوحة في السياق ذاته، وهو تضارب يُضعف الاطّراد"
    observations: >
      المجموعة تمثّل مصطلحاً رياضياً دقيقاً من التحليل الحقيقي (Real Analysis)، وهو الفترة المغلقة
      [a, b] التي تشتمل على جميع الأعداد الحقيقية x بحيث a ≤ x ≤ b. يتميّز هذا النوع من الفترات
      باشتماله على نقطتي نهايته بخلاف الفترة المفتوحة (a, b) التي تستثنيهما. الأبوة المباشرة هي
      'فترة' (awn4-06025625-n) وهي المجموعة الأعمّ الشاملة لجميع أنواع الفترات. لفظة 'مغلقة' مشتقة
      من الجذر غ-ل-ق الدالّ على النشوب واللزوم، وهو توظيف استعاري دقيق: الفترة المغلقة "تنشب"
      نقطتيها فلا تتخلّصان منها. وقد أثبتت المعاجم الرياضية الرسمية هذا المصطلح.

  blind_candidates:
    # ── توليد عمياء من التعريف فقط (قبل الاطلاع على اللمّات الموجودة) ──
    - lemma: "فَتْرَةٌ مُغْلَقَة"
      generation_method: tarkib
      justification: >
        تركيب وصفي (wasfi) من اسم 'فَتْرَة' وصفة 'مُغْلَقَة' اسم مفعول من أَغْلَقَ (الرباعي) على وزن
        مُفْعَلَة. الغلق يدل على 'نشوب شيء في شيء' بحيث لا يُتخلَّص منه؛ واستعماله صفةً للفترة يوحي
        بأن نقطتي نهايتها 'نشبتا' فيها ولا تتخلّصان: وهو التعبير عن كون الطرفين محتويَيْن. المركّب
        يجتاز اختبار السكّ: إبدال 'مغلقة' بـ'محكمة' أو 'مقفلة' لا ينتج مصطلحاً رياضياً معروفاً.

    - lemma: "قِطْعَة"
      generation_method: majaz
      justification: >
        إزاحة دلالية من معنى 'القطعة الهندسية' (segment) إلى 'الفترة الشاملة لطرفيها'. في التراث
        الرياضي العربي (التهانوي وغيره) تُستخدم 'القطعة' لجزء محدود من خط بين نقطتين. الفترة المغلقة
        هي بالضبط القطعة الكاملة التي تشمل نقطتي قطعها؛ فالمجاز من 'القطع الفاصل' إلى 'الشمول
        للطرفين' ممكن بوصفه إحياءً لمعنى تراثي.

    - lemma: "فَتْرَةٌ مَحْصُورَة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من 'فَتْرَة' واسم المفعول 'مَحْصُورَة' من الجذر ح-ص-ر (احتواء وإحاطة). الحصر
        يدل على الإحاطة من جوانب الشيء، فالفترة التي 'تحصر' نقطتيها داخلها تشملهما بالضرورة.
        الوزن مَفْعُولَة مناسب للدلالة على الحالة/الصفة.

    - lemma: "مَجَالٌ مُغْلَق"
      generation_method: tarkib
      justification: >
        تركيب وصفي بديل يستعيض بـ'مَجَال' (المكان الذي يُجال فيه، موضع الجولان) عن 'فَتْرَة'،
        إذ كلاهما يُستخدم في الرياضيات العربية ترجمةً لـ'interval'. إضافة 'مُغْلَق' (اسم مفعول من
        أَغْلَقَ) تحدّد نوع المجال الشامل لطرفيه. ويعزّز هذا الترشيح وجود المقابل 'مَجَال مَفْتُوح'
        = open interval في المعجم الموحد للرياضيات ذاته.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
