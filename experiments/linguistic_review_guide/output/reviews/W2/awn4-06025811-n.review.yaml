          addition: "في ARABTERM الرياضي 'مجال' يقابل 'domain' لا 'closed interval' تحديداً؛ واستخدامه لـ open interval (entry_id 416911) لا يُثبت استخدامه الرسمي لـ closed interval"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "فترة مغلقة"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة رسمياً في المعجم الموحد لمصطلحات الرياضيات والفلك (ALECSO 1990) بوصفها
        المقابل المعتمد لـ 'closed interval'، وتجتاز جميع الاختبارات: السكّ (إبدال 'مغلقة' بمرادف
        لا ينتج مصطلحاً معروفاً)، الصرافة (المركّب الوصفي الإضافي راسخ في العربية)، الاشتقاقية
        (مغلقة ← أغلق ← غلق على وزن مُفْعَلَة). يعكس الوصف بـ'مغلقة' دلالة النشوب التي ذكرها
        ابن فارس في مادة غ-ل-ق: «يَدُلُّ عَلَى نُشُوبِ شَيْءٍ فِي شَيْءٍ»، وهو استعارة دقيقة:
        نقطتا النهاية 'نشبتا' في الفترة فلا تتخلّصان منها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      morphology_check: >
        'مُغْلَقَة' اسم مفعول من أَغْلَقَ (الرباعي، الباب الرابع) على وزن مُفْعَلَة. هذا الوزن
        مناسب للدلالة على الصفة الناتجة عن فعل متعدٍّ (الإغلاق)، وهو يلائم الدلالة الرياضية
        (الفترة التي أُغلقت = احتوت طرفيها). لا إشكال صرفية.
      borrowing_check:
        loan_type: ishtiqaq
        verdict: "مصطلح عربي خالص، لا اقتراض لفظي"
        calque_check: "الترجمة الحرفية لـ closed interval صحيحة ومتوافقة مع المدلول الرياضي"
      quality_gate:
        consistency: "مطّرد — 'مغلقة' تُستخدم كذلك في 'مجموعة مغلقة = closed set' بالمعجم ذاته"
        ease_of_use: "ميسور التداول، مؤلَّف من كلمتين شائعتين"
        aptness: "ملائم: الغلق يعكس احتواء الطرفين"
        classical_preference: "مُؤثَر — يعتمد الجذر العربي التراثي غ-ل-ق"
        arabic_preference: "مُؤثَر — لا تعريب ولا دخيل"
        derivability: "اشتقاقي بامتياز"
      nuance_differentiation: >
        الفترة المغلقة [a, b] تمتاز بشمولها لكلتا نقطتي النهاية a وb، بخلاف الفترة المفتوحة (a, b)
        التي تستثنيهما معاً، والفترتين شبه المغلقتين [a, b) أو (a, b] اللتين تشملان إحداهما دون الأخرى.
        كما تمتاز عن 'فترة' (المجموعة الأم) بكونها نوعاً محدداً ذا خاصية طوبولوجية.
      actions:
        - command: update_lemma
          params:
            entry_id: "415290"
            new_lemma: "فَتْرَةٌ مُغْلَقَة"

    # ── المرشحات من المرحلة ١ ──
    - lemma: "فَتْرَةٌ مُغْلَقَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المرشح الأول من المرحلة العمياء يطابق اللمّة الموجودة تماماً، وهو دليل على أن التوليد
        الأعمى والمصطلح الرسمي المعتمد يتوافقان. القرار تنفيذي: الإجراء سبق تسجيله ضمن اللمّة الموجودة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "قِطْعَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود استخدام هندسي-رياضي تراثي لـ'قطعة'، تُثبت المعاجم الرياضية الحديثة (ARABTERM 1990)
        أن 'قطعة' = segment لا interval. الدلالتان متمايزتان في الرياضيات: القطعة (segment) جزء من
        مستقيم بين نقطتين في الفضاء، بينما الفترة المغلقة (closed interval) مجموعة من الأعداد الحقيقية.
        توظيف 'قطعة' للفترة المغلقة سيُحدث خلطاً مصطلحياً مع 'segment'. يُرفض المرشح.
      evidence_assessment:
        case: contradicts_only

    - lemma: "فَتْرَةٌ مَحْصُورَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي يدعم هذا المركّب في السياق الرياضي. فضلاً عن ذلك، 'محصورة' قد تُلتبس بمفهوم
        'bounded' (المحدودة) وهو مغاير لـ'closed' (المغلقة): فالفترة اللامتناهية (-∞, +∞) مغلقة
        (closed) في بعض الطوبولوجيات، لكنها ليست محصورة (bounded). التباس مصطلحي يُفسد الدقة
        الرياضية. يُرفض المرشح.
      evidence_assessment:
        case: no_material

    - lemma: "مَجَالٌ مُغْلَق"
      source: stage1
      decision: removed
      decision_reason: >
        لا يوجد شاهد مباشر من المعاجم الرياضية يُثبت 'مجال مغلق' = closed interval. والمعجم الموحد
        للرياضيات (1990) يستخدم 'فترة مغلقة' تحديداً لـclosed interval، في حين أن 'مجال' يقابل
        domain في الغالب. استخدام 'مجال مفتوح' = open interval في المعجم ذاته يكشف عن عدم اطّراد
        داخلي، لذا من الأسلم التمسّك بـ'فترة مغلقة' المعتمد رسمياً. يُرفض المرشح.
      evidence_assessment:
        case: no_material


