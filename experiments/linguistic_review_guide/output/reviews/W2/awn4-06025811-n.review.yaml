        - text: "«فترة» ← interval (Electropedia / IEC 60050)"
          source: "موسوعة الكهرباء — entry_id: 507620"
          addition: "يؤكّد استخدام 'فترة' مقابلاً معتمداً لـ interval في المعاجم التقنية الموحّدة"
      expands:
        - text: "«(الْفَتْرَة) الضعْف والانكسار والمدة تقع بَين زمنين أَو نبيين ... وفترة الرخَاء دور اقتصادي تنشط فِيهِ الصِّنَاعَة وترتفع الأسعار والأجور (مج)»"
          source: "المعجم الوسيط، مجمع اللغة العربية بالقاهرة (1998) — entry_id: 879024"
          addition: "يُثبت أن 'الفترة' في المعاجم الحديثة تُستخدم بمعنى 'المدة' و'الفاصل الزمني' وهو الأساس الذي بُني عليه المصطلح الرياضي"
        - text: "«مجموعة مغلقة» ← closed set (Mathematics and Astronomy)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ALECSO, 1990) — entry_id: 415293"
          addition: "يؤكّد استخدام 'مغلقة' في الرياضيات العربية للتعبير عن الخاصية الطوبولوجية للانغلاق (closedness)"
        - text: "«مجال مفتوح» ← open interval (Mathematics and Astronomy)"
