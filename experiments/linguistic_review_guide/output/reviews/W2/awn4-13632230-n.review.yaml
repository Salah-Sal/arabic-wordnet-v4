stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «قياس دائري» مركّب وصفي بلا تشكيل"
      - "المجموعة تحوي لمّة واحدة فقط وهي غير كافية لتمثيل المفهوم"
      - "يوجد مصطلح مثبت في المعاجم التقنية «قياس الدوائر» وهو إضافي أدق"
    observations: "المفهوم هو نظام قياس زوايا يعتمد وحدة الراديان (نسبة طول القوس إلى نصف القطر). المفهوم رياضي محض، وله مقابلات مثبتة في المعاجم الموحّدة العربية. المركب الوصفي «قياس دائري» مقبول لغوياً لكنه أقل تحديداً من المركب الإضافي «قياس الدوائر» المسجّل في المورد الحديث."
  blind_candidates:
    - lemma: "قِيَاسُ الدَّوَائِرِ"
      generation_method: tarkib
      justification: "مركّب إضافي يربط القياس بالدوائر مباشرة، وهو أدق من الوصفي لأنه يحيل إلى نظام القياس المرتبط بهندسة الدائرة"
    - lemma: "قِيَاسٌ قَوْسِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «قياس» و«قوسي» (نسبة إلى القوس)، والراديان يُعرَّف أصلاً بنسبة طول القوس إلى نصف القطر"
    - lemma: "مِقْيَاسٌ دَائِرِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي يستعمل «مِقياس» (على وزن مِفعال للأدوات) بدل «قياس» المصدري، مع صفة «دائري»"
    - lemma: "تَقْدِيرٌ قَوْسِيّ"
      generation_method: ishtiqaq
      justification: "من الجذر «قدر» على وزن تَفْعِيل بمعنى التحديد الكمّي، مع «قوسي» نسبةً إلى القوس الذي هو أساس وحدة الراديان"

