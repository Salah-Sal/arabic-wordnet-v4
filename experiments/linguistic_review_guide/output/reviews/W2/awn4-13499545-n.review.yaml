stage1_review:
  assessment:
    concerns: []
    observations: "المجموعة الترادفية تمثل ظاهرة فيزيائية تتعلق بضعف وتناقص شدة الموجات الكهرومغناطيسية أو الإشعاع عند مرورها في الأوساط المادية بسبب الامتصاص أو التشتت. التعريف العربي الحالي دقيق وواضح. اللمات الموجودة تعبر عن المفهوم ولكن يمكن إثراء المجموعة بلمّات فيزيائية أدق وأكثر شيوعاً مثل (توهين)."
  blind_candidates:
    - lemma: "تَوْهِين"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (وهن) للدلالة على إضعاف شدة الإشعاع أو الطاقة، وهو مصطلح معتمد في الفيزياء لترجمة Attenuation."
    - lemma: "تَخَامُد"
      generation_method: ishtiqaq
      justification: "مصدر يدل على التناقص التدريجي لشدة الموجات أو الإشعاع، ويقابل Damping."
    - lemma: "خُفُوت"
      generation_method: majaz
      justification: "استخدام مجازي لضعف الصوت أو الضوء للتعبير عن انخفاض شدة الإشعاع الكهرومغناطيسي."
    - lemma: "تَضَاؤُل"
      generation_method: ishtiqaq
      justification: "للتعبير عن النقصان التدريجي في شدة الشيء، كالطاقة الإشعاعية."

stage2_evidence:
  per_lemma:
    - lemma: "انطفاء"
      confirm:
        - text: "«همود الطاقة المشعة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«انطفاء، إطفاء: extinction; extinguishing»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "خمود"
      confirm:
        - text: "«خمود: damping»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
    - lemma: "توهين"
      confirm:
        - text: "«تقليل الطاقة الإشعاعية عند مرورها بالمادة»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«توهين (لموجة كهرومغناطيسية): attenuation (of an electromagnetic wave)»"
          source: "موسوعة الكهرباء (IEC 60050)"
    - lemma: "تخامد"
      confirm:
        - text: "«تخامد: damping»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"
    - lemma: "خفوت"
      expands:
        - text: "«في التصوير : الفقد الجزئي أو الكلي للخيال. في الاستشعار : التغيّر في الإشارة المستقبلة»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          addition: "يشير إلى ظاهرة الفقد أو التلاشي للإشارة بشكل عام."
    - lemma: "تضاؤل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "انطفاء"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد ومستعمل للتعبير عن انعدام أو انخفاض شدة الإشعاع (extinction)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْطِفَاء"
    - lemma: "خمود"
      decision: confirmed
      decision_reason: "مستعمل في السياقات الفيزيائية للدلالة على خفوت وتخامد الطاقة (damping)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُمُود"
    - lemma: "تَوْهِين"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق جداً ومعتمد بقوة في المعاجم العلمية للتعبير عن إضعاف وتقليل شدة الإشعاع الكهرومغناطيسي (attenuation)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَوْهِين"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "تَخَامُد"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فيزيائي هندسي للتعبير عن التضاؤل التدريجي لشدة الموجة أو الإشعاع (damping)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَخَامُد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "خُفُوت"
      source: stage1
      decision: removed
      decision_reason: "دلالته الفيزيائية غالباً ما ترتبط بالضوء والإشارات (fading) وليس بالتوهين المباشر الناتج عن الامتصاص والانتشار الإشعاعي."
    - lemma: "تَضَاؤُل"
      source: stage1
      decision: removed
      decision_reason: "مصطلح عام جداً غير مخصص علمياً للتعبير عن الظاهرة."

stage4_content:
  definition:
    current: "انخفاض شدة الإشعاع نتيجة للامتصاص والانتشار"
    assessment:
      decision: retain
      reason: "التعريف العلمي دقيق وموجز ويعكس المفهوم الفيزيائي للتوهين أو الانطفاء بشكل صحيح ولا حاجة لتعديله."
  examples:
    per_lemma:
      - lemma: "اِنْطِفَاء"
        examples:
          - text: "يُعزى انطفاء الضوء النجمي إلى الغبار الكوني المنتشر في الفضاء."
            type: usage
      - lemma: "خُمُود"
        examples:
          - text: "يؤدي الامتصاص الجوي إلى خمود شدة الإشعاع الشمسي قبل وصوله إلى سطح الأرض."
            type: usage
      - lemma: "تَوْهِين"
        examples:
          - text: "يُحسب معامل التوهين لمعرفة مقدار النقص في شدة الأشعة السينية عند مرورها في المادة."
            type: usage
      - lemma: "تَخَامُد"
        examples:
          - text: "يحدث تخامد في طاقة الأمواج الكهرومغناطيسية كلما زادت المسافة التي تقطعها في الوسط."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعزى انطفاء الضوء النجمي إلى الغبار الكوني المنتشر في الفضاء."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يؤدي الامتصاص الجوي إلى خمود شدة الإشعاع الشمسي قبل وصوله إلى سطح الأرض."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُحسب معامل التوهين لمعرفة مقدار النقص في شدة الأشعة السينية عند مرورها في المادة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يحدث تخامد في طاقة الأمواج الكهرومغناطيسية كلما زادت المسافة التي تقطعها في الوسط."

stage5_enrichment:
  per_entry:
    - lemma: "اِنْطِفَاء"
      entry_id: "{auto}"
      root: "طفأ"
      maqayis_quote: "«(طَفَوَ) الطَّاءُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ... فَإِذَا هُمِزَتْ كَانَ فِي مَعْنًى آخَرَ، يُقَالُ: طَفِئَتِ النَّارُ تَطْفَأُ.»"
    - lemma: "خُمُود"
      entry_id: "{auto}"
      root: "خمد"
      maqayis_quote: "«(خَمَدَ) الْخَاءُ وَالْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى سُكُونِ الْحَرَكَةِ وَالسُّقُوطِ. خَمَدَتِ النَّارُ خُمُودًا، إِذَا سَكَنَ لَهَبُهَا.»"
    - lemma: "تَوْهِين"
      entry_id: "{auto}"
      root: "وهن"
      maqayis_quote: "«(وَهَنَ) الْوَاوُ وَالْهَاءُ وَالنُّونُ: كَلِمَتَانِ تَدُلُّ إِحْدَاهُمَا عَلَى ضَعْفٍ، وَالْأُخْرَى عَلَى زَمَانٍ.»"
    - lemma: "تَخَامُد"
      entry_id: "{auto}"
      root: "خمد"
      maqayis_quote: "«(خَمَدَ) الْخَاءُ وَالْمِيمُ وَالدَّالُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى سُكُونِ الْحَرَكَةِ وَالسُّقُوطِ.»"
  per_sense:
    - lemma: "اِنْطِفَاء"
      sense_id: "{auto}"
      nuance: "يُشير إلى التلاشي أو الفقد الكبير في شدة الإشعاع (Extinction)."
      mwe: false
    - lemma: "خُمُود"
      sense_id: "{auto}"
      nuance: "يركز على تناقص وخفوت الطاقة أو الإشعاع تدريجياً (Damping)."
