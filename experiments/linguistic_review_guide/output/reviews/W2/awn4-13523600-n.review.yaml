stage1_review:
  assessment:
    concerns:
      - "اللمة 'ضمر' مبهمة التشكيل، و'الضُّمُور' (Atrophy) يشير إلى حالة مرضية (نقص غير طبيعي في الحجم)، بينما (Involution) يشير إلى تراجع فسيولوجي طبيعي."
    observations: "المفهوم الطبي يقصد به الرجوع الطبيعي للعضو كعودة الرحم بعد الولادة، وتستخدم له في المعاجم الطبية مصطلحات دقيقة مثل 'أوب' و'حور'."
  blind_candidates:
    - lemma: "أَوْب"
      generation_method: majaz
      justification: "من الأوب وهو الرجوع، واستعير لرجوع العضو إلى حجمه الأصلي."
    - lemma: "حَوْر"
      generation_method: majaz
      justification: "من الحور وهو الرجوع والانقلاب، وهو مصطلح طبي دال على رجوع العضو لحالته السابقة."
    - lemma: "تَرَاجُع"
      generation_method: ishtiqaq
      justification: "من تراجع الشيء إذا عاد القهقرى إلى ما كان عليه."
    - lemma: "ضُمُور"
      generation_method: ishtiqaq
      justification: "من ضمر إذا قل لحمه، ويستخدم لتقلص الأعضاء."
stage2_evidence:
  per_lemma:
    - lemma: "اِنْكِفَاء"
      confirm:
        - text: "«أوب، تراجُع، انكفاء» مقابل (involution)"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
    - lemma: "ضمر"
      contradicts:
        - text: "«الضُّمُورُ: (في الطب) Atrophy: نقصٌ في حجم العضو أو النسيج, إما بسبب نقص عدد الخلايا فيه...»"
          source: "المعجم الكبير"
          conflict: "الضمور (Atrophy) حالة مَرَضية تعني نقص الحجم بشكل غير طبيعي، بينما (Involution) حالة فسيولوجية طبيعية تعني عودة العضو لحجمه الطبيعي."
    - lemma: "أَوْب"
      confirm:
        - text: "«أَوبُ الرَّحِم: رجوع الرحم للحالة الطبيعية بعد الحمل.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«أَوب: involution»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "حَوْر"
      confirm:
        - text: "«حور: رجوع العضو إلى حالته السابقة، كما يحدث في الرحم بعد الولادة.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
    - lemma: "تَرَاجُع"
      confirm:
        - text: "«أوب، تراجُع، انكفاء» مقابل (involution)"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
    - lemma: "ضُمُور"
      contradicts:
        - text: "«الضُّمُورُ: (في الطب) Atrophy...»"
          source: "المعجم الكبير"
          conflict: "الضمور حالة مَرَضية (Atrophy) وليس تراجعاً فسيولوجياً (Involution)."
stage3_analysis:
  per_lemma:
    - lemma: "اِنْكِفَاء"
      decision: confirmed
      decision_reason: "مصطلح طبي مستخدم للتعبير عن Involution كما ورد في المعاجم، وهو يعكس الانقلاب والتراجع للداخل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْكِفَاء"
    - lemma: "ضمر"
      decision: removed
      decision_reason: "الضمور (Atrophy) هو نقص في الحجم بسبب مرضي، بينما المفهوم هنا (Involution) هو عودة فسيولوجية طبيعية، لذا فهو غير دقيق."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "أَوْب"
      source: stage1
      decision: confirmed
      decision_reason: "هو المصطلح الطبي الأدق والأكثر تداولاً للتعبير عن تراجع الرحم وعودته لحجمه الطبيعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "أَوْب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13523600-n"
    - lemma: "حَوْر"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح طبي موثق في المعاجم الطبية للتعبير عن رجوع العضو لحالته السابقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "حَوْر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13523600-n"
    - lemma: "تَرَاجُع"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عام وصحيح يستخدم للإشارة إلى تراجع حجم العضو وتقلصه إلى وضعه الطبيعي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَرَاجُع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13523600-n"
    - lemma: "ضُمُور"
      source: stage1
      decision: removed
      decision_reason: "يشير إلى الضمور المرضي (Atrophy) وليس الرجوع الطبيعي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
stage4_content:
  definition:
    current: "انخفاض في حجم عضو أو جزء (كما في عودة الرحم إلى حجمه الطبيعي بعد الولادة)"
    assessment:
      decision: revise
      reason: "تعديل الصياغة لتكون معجمية وتجنب استخدام الأقواس في التعريفات، مع إبراز الفرق عن الضمور المرضي."
    authored:
      - type: terminological
        text: "تَرَاجُعٌ فِي حَجْمِ عُضْوٍ مِنْ أَعْضَاءِ الجِسْمِ وَعَوْدَتُهُ إِلَى حَالَتِهِ الطَّبِيعِيَّةِ بَعْدَ تَضَخُّمِهِ، كَتَرَاجُعِ الرَّحِمِ بَعْدَ الوِلَادَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-13523600-n"
          definition_index: 0
          text: "تَرَاجُعٌ فِي حَجْمِ عُضْوٍ مِنْ أَعْضَاءِ الجِسْمِ وَعَوْدَتُهُ إِلَى حَالَتِهِ الطَّبِيعِيَّةِ بَعْدَ تَضَخُّمِهِ، كَتَرَاجُعِ الرَّحِمِ بَعْدَ الوِلَادَةِ."
  examples:
    per_lemma:
      - lemma: "اِنْكِفَاء"
        examples:
          - text: "يُرَاقِبُ الطَّبِيبُ سُرْعَةَ اِنْكِفَاءِ الرَّحِمِ لَدَى الأُمِّ بَعْدَ الوِلَادَةِ."
            type: usage
      - lemma: "أَوْب"
        examples:
          - text: "يُعَدُّ أَوْبُ الرَّحِمِ عَمَلِيَّةً فِسْيُولُوجِيَّةً ضَرُورِيَّةً لِتَعَافِي المَرْأَةِ بَعْدَ الحَمْلِ."
            type: usage
      - lemma: "حَوْر"
        examples:
          - text: "تَحْدُثُ عَمَلِيَّةُ حَوْرِ الأَعْضَاءِ بِشَكْلٍ تَدْرِيجِيٍّ بَعْدَ اِنْتِهَاءِ الفَتْرَةِ النَّشِطَةِ لَهَا."
            type: usage
      - lemma: "تَرَاجُع"
        examples:
          - text: "أَظْهَرَ الفَحْصُ تَرَاجُعَ التَّضَخُّمِ فِي الغُدَّةِ وَعَوْدَتَهَا لِحَجْمِهَا الطَّبِيعِيِّ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُرَاقِبُ الطَّبِيبُ سُرْعَةَ اِنْكِفَاءِ الرَّحِمِ لَدَى الأُمِّ بَعْدَ الوِلَادَةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعَدُّ أَوْبُ الرَّحِمِ عَمَلِيَّةً فِسْيُولُوجِيَّةً ضَرُورِيَّةً لِتَعَافِي المَرْأَةِ بَعْدَ الحَمْلِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَحْدُثُ عَمَلِيَّةُ حَوْرِ الأَعْضَاءِ بِشَكْلٍ تَدْرِيجِيٍّ بَعْدَ اِنْتِهَاءِ الفَتْرَةِ النَّشِطَةِ لَهَا."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَظْهَرَ الفَحْصُ تَرَاجُعَ التَّضَخُّمِ فِي الغُدَّةِ وَعَوْدَتَهَا لِحَجْمِهَا الطَّبِيعِيِّ."
