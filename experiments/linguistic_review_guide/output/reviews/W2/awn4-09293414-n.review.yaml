step0_evidence:
  per_lemma:
    - lemma: "بحر"
      confirm:
        - text: "«الماء الواسع الكثير, ويغلب فى الملح» — المعجم الوسيط"
        - text: "«خلاف البرِّ. يقال: سمِّي بحراً لعُمقه واتساعه. والجمع أَبْحُرٌ وبِحارٌ وبُحورٌ. وكلُّ نهرٍ عظيمٍ بَحْرٌ.» — تاج اللغة وصِحاح العربية للجوهري"
    - lemma: "يم"
      confirm:
        - text: "«البحر الذي لا يدرك قعره ولا شطاه, أو لجته» — كتاب العين"
        - text: "«اليَمُّ: البَحْرُ، لا يُكَسَّر، ولا يُجْمَع جَمْعَ السالِمِ.» — القاموس المحيط للفيروزآبادي"

step05_lemma_generation:
