    - lemma: "غمر"
      source_section: "step4_fts_keyword"
      evidence_citation: "«صفة مشبَّهة تدلّ على الثبوت من غمَرَ: عميق، عكس ضَحْل» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      justification: "استخدام مجازي للدلالة على الماء الكثير العميق."
  knowledge_candidates:
    - lemma: "خضم"
      justification: "مجاز: يُستخدم 'الخضم' للإشارة إلى البحر الواسع أو معظمه، وهو يطابق وصف المسطح المائي العميق والكبير."
    - lemma: "لجة"
      justification: "مجاز: من اللجة وهي معظم الماء أو الموج المتلاطم، وتطلق مجازاً على البحر."

step1_lemma_validation:
  per_lemma:
    - lemma: "بحر"
      decision: confirmed
      decision_reason: "مصطلح أساسي ومستقر للتعبير عن المسطح المائي الواسع والعميق، ويطابق المفهوم تماماً."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح العام والأكثر شيوعاً للمسطح المائي المالح أو الواسع."
      example: "تبحر السفن العملاقة في عرض البحر لأيام طويلة."
    
    - lemma: "يم"
      decision: confirmed
      decision_reason: "مرادف فصيح وثابت في الاستعمال القرآني والأدبي للإشارة إلى البحر الممتد والعميق."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يكثر استخدامه في السياقات الأدبية والتاريخية للإشارة إلى البحر الذي لا يُدرك قعره."
      example: "تلاطمت أمواج اليمّ وكادت تغرق القارب الصغير."
    
    - lemma: "غمر"
      source: step05
      decision: removed
      decision_reason: "تدل في الأصل على الماء الذي يغمر ما تحته، وليست مصطلحاً مستقلاً مسكوكاً للدلالة على البحر ذاته ككيان جغرافي إلا في سياقات الوصف."
      step05_citation: "«صفة مشبَّهة تدلّ على الثبوت من غمَرَ: عميق، عكس ضَحْل» — معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    
    - lemma: "خضم"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح وبليغ يُستخدم للإشارة إلى البحر العظيم والمحيط الواسع، وهو متداول في الكتابات الأدبية والمجازية للتعبير عن المسطح المائي الكبير."
      step05_citation: "اقتراح مبني على المعرفة اللغوية"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يحمل دلالة المجاز والتعظيم للاتساع الهائل للمسطح المائي."
      example: "أبحرت السفينة في خضمّ المحيط تتحدى العواصف."
      actions:
        - command: create_entry
          params:
            lemma: "خضم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09293414-n"

    - lemma: "لجة"
      source: step05
      decision: removed
      decision_reason: "اللجة تشير إلى معظم الماء أو تلاطم الأمواج أكثر من الإشارة إلى الكيان المستقل للمسطح المائي بحد ذاته."
      step05_citation: "اقتراح مبني على المعرفة اللغوية"

  added_lemmas:
