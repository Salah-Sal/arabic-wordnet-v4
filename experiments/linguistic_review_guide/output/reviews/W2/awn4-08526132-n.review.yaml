      maqayis_quote: "«الدَّالُ وَالْغَيْنُ وَاللَّامُ أَصْلٌ يَدُلُّ عَلَى الْتِبَاسٍ وَالْتِوَاءٍ مِنْ شَيْئَيْنِ يَتَدَاخَلَانِ. مِنْ ذَلِكَ الدَّغَلُ، وَهُوَ الشَّجَرُ الْمُلْتَفُّ.»"
