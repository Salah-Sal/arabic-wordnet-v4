stage1_review:
  assessment:
    concerns:
      - "اللمتان (أدغال) و(غابة) في الأصل تدلان على أماكن جغرافية حقيقية، واستخدامهما هنا مجازي بالكامل. يجب التأكد من توثيق هذا الاستخدام المجازي معجمياً في لغة العصر."
    observations: "المجموعة الترادفية تمثل مفهوماً استعارياً يعبر عن بيئة يتسم فيها البقاء بالقوة، وهو ما يقابله في العربية التعبيرات المستمدة من البيئة الطبيعية المتوحشة كالغابة، أو المصطلحات الدالة على الصراع المباشر كالمعترك."
  blind_candidates:
    - lemma: "غَابَة"
      generation_method: majaz
      justification: "استخدام مجازي لمكان موحش لا يحتكم لقانون سوى البقاء للأقوى."
    - lemma: "أَدْغَال"
      generation_method: majaz
      justification: "استعارة من الأدغال الموحشة للتعبير عن بيئة مليئة بالمخاطر والمنافسة الشرسة."
    - lemma: "مُعْتَرَك"
      generation_method: ishtiqaq
      justification: "مشتق من العراك بمعنى موضع الصراع والقتال، ويناسب تماماً موقع المنافسة الشديدة."
    - lemma: "مَيْدَان صِرَاع"
      generation_method: tarkib
      justification: "مركب إضافي يصف الموقع بدقة بأنه مكان للمنافسة والمغالبة."

stage2_evidence:
  per_lemma:
    - lemma: "أدغال"
      confirm:
        - text: "مصطلح من أصل هندي، معناه الاصطلاحي: غابة كثيفة يانعة تشبه غابة مطيرة."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      expands:
        - text: "نوع من المجالات الشجرية (بأشجار منخفضة وحشائش) تتألف من نباتات دائمة الخضرة بأوراق قاسية نسبيا."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: "يثبت المعنى الأصلي الذي يُستعار منه للتعبير عن مكان التوحش والمنافسة."
    - lemma: "غابة"
      confirm:
        - text: "الغاب: موطنٌ يُتنازَع فيه البقاء بقسوة وحشية turned international economy into a jungle ."
          source: "المورد الحديث (2008)"
      expands:
        - text: "الأجمة ذات الشجر الكثير المتكاثف"
          source: "المعجم الوسيط"
          addition: "المعنى الحرفي الذي أُخذ منه الاستخدام المجازي للصراع."
    - lemma: "مُعْتَرَك"
      confirm:
        - text: "موضع الاعتراك"
          source: "المعجم الوسيط"
      expands:
        - text: "(عَرَكَ) ... وَمِنَ الْبَابِ: اعْتَرَكَ الْقَوْمُ فِي الْقِتَالِ، وَذَلِكَ تَمَرُّسُ بَعْضِهِمْ بِبَعْضٍ وَعَرْكُ بَعْضِهِمْ بَعْضًا، وَذَلِكَ الْمَكَانُ مُعْتَرَكٌ وَمُعْتَرَكَةٌ."
          source: "مقاييس اللغة"
          addition: "يؤكد أن المعترك هو المكان الذي يتصارع فيه القوم بشدة."

stage3_analysis:
  per_lemma:
    - lemma: "أدغال"
      decision: confirmed
      decision_reason: "اللمة تُستخدم مجازياً بشكل شائع للتعبير عن بيئة الصراع والمنافسة (مثل أدغال الحياة)، وتتوافق مع المعنى المراد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَدْغَال"
    - lemma: "غابة"
      decision: confirmed
      decision_reason: "وثق (المورد الحديث) استخدامها المجازي الصريح بمعنى الموطن الذي يتنازع فيه البقاء بقسوة، وهو الأشيع في لغة العصر (قانون الغابة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَابَة"
    - lemma: "مُعْتَرَك"
      source: stage1
      decision: confirmed
      decision_reason: "لمة فصيحة ومناسبة جداً لمفهوم مكان الصراع والمنافسة الشديدة، وقد وردت في المعاجم بمعنى موضع الاعتراك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُعْتَرَك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "موقع يتميز بالمنافسة الشديدة والصراع من أجل البقاء"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق ويصيغ المعنى المجازي بوضوح دون أن يكون قاصراً على المعنى المكاني الحرفي للغابة."
  examples:
    per_lemma:
      - lemma: "أَدْغَال"
        examples:
          - text: "أصبحت السوق الحرة أشبه بأدغال لا ينجو فيها إلا الأقوى."
            type: usage
      - lemma: "غَابَة"
        examples:
          - text: "تحولت الساحة السياسية إلى غابة يأكل فيها القوي الضعيف."
            type: usage
      - lemma: "مُعْتَرَك"
        examples:
          - text: "خاض الشاب معترك الحياة بكل ما فيه من تحديات وصعاب."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أصبحت السوق الحرة أشبه بأدغال لا ينجو فيها إلا الأقوى."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تحولت الساحة السياسية إلى غابة يأكل فيها القوي الضعيف."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "خاض الشاب معترك الحياة بكل ما فيه من تحديات وصعاب."

