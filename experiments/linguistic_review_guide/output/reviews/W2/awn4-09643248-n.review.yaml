stage1_review:
  assessment:
    concerns: []
    observations: "المجموعة الترادفية تغطي المفهوم بشكل ممتاز عبر أربع لمّات تتدرج دلالياً بين مجرد السكن (ساكن) والاستقرار (مقيم، قاطن) والاتخاذ كوطن (مستوطن). جميع اللمّات فصيحة ومستعملة وتؤدي الغرض بدقة."
  blind_candidates:
    - lemma: "قَاطِن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل قطن، يدل على من اتخذ المكان وطناً أو سكناً، وهو شائع في الاستعمال للإشارة للسكان."
    - lemma: "سَاكِن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من سكن، وهو أشهر الألفاظ وأعمها الدالة على من يقيم في مكان أو يسكن فيه."
    - lemma: "مُقِيم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من أقام، يدل على الاستقرار والثبات في المكان، وغالباً ما يُستعمل في السياق الرسمي للتعبير عن القاطن."
    - lemma: "مُسْتَوْطِن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من استوطن، يفيد اتخاذ المكان وطناً والإقامة الدائمة فيه، ويستخدم كثيراً للإشارة إلى المهاجرين الذين يعمرون مناطق جديدة."

stage2_evidence:
  per_lemma:
    - lemma: "ساكن"
      confirm:
        - text: "«شخص أو أي كائن حي يعيش باستقرار في مكان معين.»"
          source: "موقع ArabTerm"
        - text: "«السّاكن؛ القاطن؛ المقيم»"
          source: "المورد الحديث"
    - lemma: "قاطن"
      confirm:
        - text: "«من (ق ط ن) المقيم بالمكان الملازم له، والخادع.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«القاطن؛ الساكن؛ المقيم في.»"
          source: "المورد الحديث"
    - lemma: "مستوطن"
      confirm:
        - text: "«السّاكن؛ المُقيم؛ المُسْتوطِن.»"
          source: "المورد الحديث"
        - text: "«المستعمِر؛ المستوطِن: شخص يشارك في إنشاء مستعمرة أو مستوطنَة أو يقيم فيها.»"
          source: "المورد الحديث"
    - lemma: "مقيم"
      confirm:
        - text: "«المقيم؛ الساكن؛ القاطن»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "ساكن"
      decision: confirmed
      decision_reason: "لمّة فصيحة وأساسية وشائعة جداً في الاستخدام للتعبير عن الشخص الذي يقيم في مكان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَاكِن"
    - lemma: "قاطن"
      decision: confirmed
      decision_reason: "لمّة فصيحة ومناسبة جداً وتدل على ملازمة المكان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَاطِن"
    - lemma: "مستوطن"
      decision: confirmed
      decision_reason: "لمّة فصيحة تعبر عن الشخص الذي يتخذ المكان وطناً ويستقر فيه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَوْطِن"
    - lemma: "مقيم"
      decision: confirmed
      decision_reason: "لمّة فصيحة وشائعة في السياقات الإدارية واليومية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقِيم"

stage4_content:
  definition:
    current: "شخص يسكن في مكان معين"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يفتقر للصياغة المعجمية الدقيقة. تم تنقيحه ليصبح أكثر شمولاً ودقة على طريقة المعاجم المعتمدة."
    authored:
      - type: terminological
        text: "شَخْصٌ يَتَّخِذُ مَكَانًا مُعَيَّنًا مَحَلًّا لِإِقَامَتِهِ وَسَكَنِهِ الدَّائِمِ أَوْ الْمُؤَقَّتِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَتَّخِذُ مَكَانًا مُعَيَّنًا مَحَلًّا لِإِقَامَتِهِ وَسَكَنِهِ الدَّائِمِ أَوْ الْمُؤَقَّتِ"

  examples:
    per_lemma:
      - lemma: "سَاكِن"
        examples:
          - text: "يَبْلُغُ عَدَدُ سُكَّانِ الْمَدِينَةِ مِلْيُونَ سَاكِنٍ."
            type: usage
      - lemma: "قَاطِن"
        examples:
          - text: "تَعْكِفُ الْحُكُومَةُ عَلَى تَحْسِينِ خَدَمَاتِ الْمِيَاهِ لِقَاطِنِي الْقُرَى النَّائِيَةِ."
            type: usage
      - lemma: "مُسْتَوْطِن"
        examples:
          - text: "عَاشَ الْمُسْتَوْطِنُونَ الْأَوَائِلُ حَيَاةً قَاسِيَةً فِي تَعْمِيرِ الْأَرْضِ الْجَدِيدَةِ."
            type: usage
      - lemma: "مُقِيم"
        examples:
          - text: "يَحِقُّ لِكُلِّ مُقِيمٍ فِي هَذَا الْحَيِّ الِاسْتِفَادَةُ مِنْ مَرَافِقِهِ الرِّيَاضِيَّةِ."
