  per_entry:
    - lemma: "سَاكِن"
      entry_id: "{auto}"
      root: "سكن"
      maqayis_quote: "«(سَكَنَ) السِّينُ وَالْكَافُ وَالنُّونُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى خِلَافِ الِاضْطِرَابِ وَالْحَرَكَةِ.»"
    - lemma: "قَاطِن"
