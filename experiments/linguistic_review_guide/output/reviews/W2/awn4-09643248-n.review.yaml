      maqayis_quote: "«(قَطَنَ) الْقَافُ وَالطَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اسْتِقْرَارٍ بِمَكَانٍ وَسُكُونٍ. يُقَالُ: قَطَنَ بِالْمَكَانِ: أَقَامَ بِهِ.»"
    - lemma: "مُسْتَوْطِن"
