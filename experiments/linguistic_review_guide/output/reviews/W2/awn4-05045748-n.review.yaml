# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "تَرْكِيز"
      entry_id: "{auto}"
      root: "ركز"
      maqayis_quote: >
        «الرَّاءُ وَالْكَافُ وَالزَّاءُ أَصْلَانِ: أَحَدُهُمَا إِثْبَاتُ شَيْءٍ
