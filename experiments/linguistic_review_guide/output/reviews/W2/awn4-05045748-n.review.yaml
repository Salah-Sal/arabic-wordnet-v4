# ════════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-05045748-n  |  ILI: i63477  |  POS: n
# المفهوم: تركيز المحلول الكيميائي (chemical concentration)
# ════════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (تركيز) مكتوبة بلا تشكيل في المجموعة، مما يُخلّ بمعيار التشكيل الكامل."
      - "التعريف العربي الحالي 'قوة محلول' هو ترجمة حرفية للإنجليزية (strength of a solution) ولا يعكس الصياغة المعجمية العربية المتخصصة الموثّقة."
      - "عبارة 'عدد جزيئات مادة في حجم معين' غير دقيقة علمياً؛ التركيز يُعبَّر عنه بوحدات مولارية (عدد المولات لا عدد الجزيئات المطلق)."
    observations: >
      المجموعة تقع ضمن الخاصّيّات الجوهرية وتصف مفهوماً كيميائياً دقيقاً هو تركيز المحلول.
      اللمّة الموجودة (تركيز) مصطلح عربي راسخ موثّق على نطاق واسع في المعاجم التقنية
      المتخصصة. التعريف الحالي يستحق المراجعة لرفع دقّته العلمية وملاءمته للأسلوب المعجمي العربي.

  blind_candidates:
    - lemma: "تَرَكُّز"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل الخماسي "تَرَكَّزَ" على وزن تَفَعُّل من جذر (ر ك ز)،
        يفيد الحالة الانعكاسية للتركيز: انحصار المادة في وحدة الحجم.
        الوزن تَفَعُّل مناسب للدلالة على الحالة الناتجة عن الفعل.

    - lemma: "غِلَظ"
      generation_method: majaz
      justification: >
        إحياء للمعنى التراثي من جذر (غ ل ظ): كثافة الشيء وشدّته.
        كانت العرب تصف المحاليل الكثيرة الذائب بـ"الغِلَظ"؛ مجاز وظيفي
        يعكس زيادة نسبة المادة في الحجم.

    - lemma: "مُرَكَّزِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من اسم المفعول "مُرَكَّز" بإضافة يَاء النسب والتاء المربوطة.
        يُحوّل الصفة إلى مفهوم مجرد: خاصيّة كون الشيء مُرَكَّزاً، أي درجة تركّزه.
        الاشتقاق بالمصدر الصناعي (فُعَاليَّة) ينتج مصطلحاً مجرّداً ملائماً.

    - lemma: "كَثَافَة عَدَدِيَّة"
      generation_method: tarkib
      justification: >
        مركّب وصفي: كَثَافَة (نسبة شيء في حجم) + عَدَدِيَّة (مبنيّة على العدد/الكميّة).
        يعكس المعنى الحرفي "عدد الجزيئات في وحدة الحجم" الوارد في التعريف.
        النوع: تركيب وصفي (wasfi).


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  per_lemma:

    # ───── اللمّة الموجودة ─────
    - lemma: "تركيز"
      confirm:
        - text: >
            «(فى الكيمياء) concentration: زِيادةُ نِسْبَة الذَّائِب إلى المُذِيب
            دونَ أن يَصِلَ إلى حَدِّ التَّشَبُّع»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «كمية عنصر ما محلول أو عالق في واحدة الحجم من محلول»
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: >
            «نسبة الأملاح الذائبة في الماء وتقاس بوحدات الجزء في المليون (PPm)
            أو الملي جرام / لتر / هي نسبة تواجد الأملاح (والعناصر الأخرى)
            في الماء الذي يحتويها»
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: >
            «زيادة نسبة مادة ما في محلولها»
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: >
            «مصطلح عام يشير إلى كمية من مادة أو مركب متواجد في وحدة الكمية من
            وسط معين. عند استخدام مصطلح تركيز دون مزيد من التحديد، فهذا يعني
            مقدار تركيز المادة. يُمكن التمييز بين التركيز الكتليّ ri = mi/V،
            والتركيز الحجميّ si = Vi/V وتركيز كمّية المادة ci = ni/V»
          source: "مسرد الهندسة الكهربائية - ALECSO"
      expands:
        - text: >
            «التَّرْكيزُ المولِيّ (تَرْكيزُ المادَّة)» / «تَرْكيزُ المادَّة
            (التَّرْكيزُ المولِيُّ)» — تقابلان المصطلحَين
            molar concentration وsubstance concentration
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُثبت أن تركيز المادة والتركيز المولي مصطلحان متبادلان في المعجم الطبي الموحد، مما يُرسّخ دلالة تركيز على المفهوم المولاري."
        - text: >
            «تركيز مولي» = molar concentration؛ و«مولارية، تركيز مولي حجمي» = molarity
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يُبيّن أن المعجم الكيميائي العربي يعتمد تركيز أساساً ويُضيف إليه صفة (مولي، حجمي..) للتخصيص."

    # ───── مرشح المرحلة ١ — تَرَكُّز ─────
    - lemma: "تَرَكُّز"
      expands:
        - text: >
            «تَرَكَّزَ ... المَحْلُولُ: زادَتْ فيه نِسْبَةُ الذَّائِبِ إلى المُذِيب
            دون أن يَصِل إلى حَدِّ التَّشَبُّع / اللَّبنُ ونحوُه: تَكَثَّفَ
            وغلَظ قوامُه»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "الفعل تَرَكَّزَ (من اشتُقّ منه المصدر تَرَكُّز) يُستعمل في السياق الكيميائي بمعنى ازدياد نسبة الذائب، غير أن المعجم يُدرجه كفعل لا كاسم للمفهوم."
        - text: >
            «(تركز) ثَبت وَاسْتقر»
          source: "المعجم الوسيط (حوراماني)"
          addition: "المعنى الأصلي للفعل: الثبات والاستقرار — يُشير إلى أن تَرَكُّز في استخدامه العلمي توسّعٌ دلالي وليس الأصل."

    # ───── مرشح المرحلة ١ — غِلَظ ─────
    - lemma: "غِلَظ"
      contradicts:
        - text: >
            «الغِلَظُ من الأرض: الخَشِن»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "غِلَظ في المعجم العربي يُفيد خشونة الأرض وقسوة الملمس، لا كميّة مادة في محلول."
        - text: >
            «غَلُظَ الشيء غِلَظاً فهو غَليظٌ. واستَغْلَظَ النَّباتُ والشَّجَرُ»
          source: "كتاب العين للخليل بن أحمد الفراهيدي (ت. 786م)"
          conflict: "الجذر غلظ يُفيد السماكة والصلابة المادية، ولا يرتبط في الموروث المعجمي بتركيز المحلول."

    # ───── مرشح المرحلة ١ — مُرَكَّزِيَّة ─────
    - lemma: "مُرَكَّزِيَّة"
      contradicts:
        - text: >
            «المَرْكَزِيَّةُ: نِظَامٌ يَقْضى بتبعيَّة البلاد لِمَركز رئيس واحد،
            نقيضُه "اللامركزية"»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            مركزية (وما اشتُقّ منها) محتلَّة دلالياً في المعجم العربي المعاصر
            بمعنى النظام السياسي المركزي، وليس خاصيّة المحلول الكيميائي.
        - text: >
            «(المركزية) نظام يقْضِي بتبعية الْبِلَاد لمركز رَئِيس وَاحِد
            نقيضة (اللامركزية)»
          source: "المعجم الوسيط (حوراماني)"
          conflict: "تأكيد آخر على احتلال المصطلح في الاستخدام السياسي-الإداري."

    # ───── مرشح المرحلة ١ — كَثَافَة عَدَدِيَّة ─────
    - lemma: "كَثَافَة عَدَدِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ══════════════════════════════════════════════
    # اللمّة الموجودة
    # ══════════════════════════════════════════════
    - lemma: "تركيز"
      decision: confirmed
      decision_reason: >
        تَرْكِيز هو المصطلح المعياري الموحَّد للتركيز الكيميائي في كل معاجم
        اللغة العربية المتخصصة المعتمدة (الكيمياء، الفيزياء، الصيدلة، الطب،
        الهندسة المدنية، المياه). الجذر ركز موثَّق في مقاييس اللغة بأصل
        "إثبات شيء في شيء يذهب سفلاً" وهو مناسب دلالياً. الوزن تَفْعِيل
        يُفيد التكثيف والتعظيم — ملائم للمفهوم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      borrowing_check:
        lexical: "عربي أصيل من جذر ركز — لا اقتراض لفظي"
        calque: "تركيز ترجمة وظيفية لـ concentration (من concentrate = يُركّز)؛ لكنها ترجمة ناجحة تامّة التعريب، استُوعبت في المعجم العربي."
        scientific_alignment: "مطابق — التركيز الكيميائي هو بالضبط ما يُعبِّر عنه تركيز بمعناه التقني."
      quality_gate:
        ittiraad: "شائع فصيح في جميع المعاجم التقنية العربية"
        yusr: "سهل التداول، يُضاف إليه الوصف: تركيز مولي/كتلي/حجمي"
        mulaama: "ملائم تمام الملاءمة للمفهوم العلمي"
        turathi: "مستمَدٌّ من جذر عربي أصيل (ركز)"
        arabi: "عربي — يُؤثَر على أي تعريب أجنبي"
        ishtiqaqiyya: "قابل للاشتقاق: ركّز/يُركّز/تركيز/مُرَكَّز/تركّز"
      morphological_check: >
        الوزن تَفْعِيل مصدر الفعل الرباعي (رَكَّزَ) يُفيد التكثيف والمبالغة —
        مناسب للدلالة على الفعل التكثيفي وناتجه الكمّي.
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تنفرد بتغطية مفهوم التركيز الكيميائي
        المتخصص (كمية الذائب في وحدة الحجم) وتتمايز عن "كثافة" (الكتلة/
        الحجم دون ذائب) و"تشبّع" (الحدّ الأقصى للذوبان).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْكِيز"

    # ══════════════════════════════════════════════
    # مرشحات المرحلة ١
    # ══════════════════════════════════════════════
    - lemma: "تَرَكُّز"
      source: stage1
      decision: removed
      decision_reason: >
        تَرَكُّز مصدر الفعل الخماسي تَرَكَّزَ يُفيد "الانتقال إلى حالة التركيز"
        (الحدوث والصيرورة)، بينما تَرْكِيز — المصطلح المعياري — يُفيد المفهوم
        الاسمي (حالة التركيز كمقياس). المعجم الكبير يُدرج تَرَكَّزَ كفعلٍ لا
        كاسم للخاصيّة. إضافته إلى المجموعة ستُربك الحدودَ المصطلحية ولا تُضيف
        دلالة جديدة على تَرْكِيز.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "غِلَظ"
      source: stage1
      decision: removed
      decision_reason: >
        غِلَظ في المعجم العربي يُفيد الخشونة والصلابة (من الأرض أو الملمس)،
        وهو مختلف اختلافاً جذرياً عن التركيز الكيميائي. المجاز المقترح
        (غِلَظ المحلول = كثافة ذائبه) لم يُثبَّت معجمياً وقد يُؤدّي إلى
        الاشتراك اللفظي. الأدلة تُناقض الاستخدام المقترح.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُرَكَّزِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مُرَكَّزِيَّة — وإن استُقيت من جذر ركز — غيرُ موثَّقة في المعاجم بدلالة
        كيميائية؛ والمفردة "مركزية" محتلَّة دلالياً بمعنى النظام السياسي
        المركزي في جميع المعاجم المعتمدة. إضافتها ستُقحم تضاربَ دلالات لا مسوّغ له.
        فضلاً عن ذلك، تَرْكِيز يؤدّي الوظيفة على أكمل وجه.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "كَثَافَة عَدَدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المركّب الوصفي "كثافة عددية" غير موثَّق كوحدة معجمية ثابتة. كثافة عددية
        (number density) هو مصطلح فيزيائي مختلف يُشير إلى عدد الجسيمات في وحدة
        الحجم دون الاشتراط الكيميائي للإذابة. اجتياز اختبار السكّ: "كثافة مولية"
        تصف نفس الفكرة بتعويض "عددية" بـ"مولية"، مما يُثبت عدم تثبّته الاصطلاحي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "قوة محلول؛ عدد جزيئات مادة في حجم معين"
    assessment:
      decision: revise
      reason: >
        "قوة محلول" ترجمة حرفية لـ "strength of a solution" ولا تُعبّر عن
        المفهوم بالأسلوب المعجمي العربي؛ المعاجم التقنية العربية تُصيغه
        بـ "كمية المادة الذائبة في وحدة الحجم" أو "نسبة الذائب إلى المذيب".
        كذلك "عدد جزيئات" يُوحي بالعدد المطلق (عدد الأفوكادرو) لا بالمقدار
        المولاري الذي يُعبّر عنه بوحدات قابلة للقياس (مول/لتر، جم/لتر...).
    authored:
      - type: terminological
        text: >
          خاصِّيَّةٌ كيميائيَّة تُعبِّر عن مقدار مادةٍ ذائبة في وحدة حجم
          محلولها، وتُقاس عادةً بنسبة الذائب إلى المذيب أو بعدد المولات
          في اللتر الواحد
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مقدار المادة الذائبة في وحدة حجم المحلول؛ يُمكن التعبير عنه
          بالتركيز الكتليّ (كتلة الذائب في الحجم الكلي)، أو التركيز الحجمي
          (حجم الذائب في الحجم الكلي)، أو التركيز المولي (عدد مولات الذائب
          في اللتر الواحد). وهو من الخواص الجوهرية التي تتحدّد بها قوّة
          المحلول ودرجة تفاعلاته الكيميائية
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-05045748-n"
          definition_index: 0
          text: >
            خاصِّيَّةٌ كيميائيَّة تُعبِّر عن مقدار مادةٍ ذائبة في وحدة حجم
            محلولها، وتُقاس عادةً بنسبة الذائب إلى المذيب أو بعدد المولات
            في اللتر الواحد
      - command: add_definition
        params:
          synset_id: "awn4-05045748-n"
          text: >
            مقدار المادة الذائبة في وحدة حجم المحلول؛ يُمكن التعبير عنه
            بالتركيز الكتليّ أو التركيز الحجمي أو التركيز المولي (عدد مولات
            الذائب في اللتر الواحد)

  examples:
    per_lemma:
      - lemma: "تَرْكِيز"
        examples:
          - text: "يُعدّ تَرْكِيزُ حمض الكبريتيك في هذا المحلول منخفضاً إذ لا يتجاوز 0.1 مول في اللتر"
            type: usage
          - text: "كلّما ارتفع تَرْكِيزُ الأكسجين الذائب في مياه النهر دلَّ ذلك على سلامة النظام البيئي المائي"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-05045748-n"
          text: "يُعدّ تَرْكِيزُ حمض الكبريتيك في هذا المحلول منخفضاً إذ لا يتجاوز 0.1 مول في اللتر"
      - command: add_sense_example
        params:
          sense_id: "{auto}"
