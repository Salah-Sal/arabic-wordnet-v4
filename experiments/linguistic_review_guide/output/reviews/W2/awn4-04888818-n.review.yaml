# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الوحيدة 'انضباط' مذكورة بدون تشكيل كامل في قاعدة البيانات"
      - "المجموعة تقتصر على لمة واحدة رغم وجود مفاهيم مترادفة قريبة في التراث العربي"
      - "التعريف الحالي 'سمة حسن السلوك' موجز ومقارب للدوران إذ يُعيد صياغة المفهوم بمصطلحيه نفسيهما دون فصل نوعي كافٍ"

    observations: >
      المفهوم المستهدف هو السِّمة الشخصية المتمثِّلة في الالتزام بمعايير السلوك القويم
      وضبط النفس وفق المتوقَّع اجتماعياً وأخلاقياً. يقع المفهوم في منطقة دلالية تتداخل
      فيها عدة مصطلحات عربية: «الانضباط» (الضبط الذاتي والالتزام بالأنظمة)، و«التهذّب»
      (تنقية الأخلاق من العيوب)، و«الوقار» و«الرزانة» (الاتزان والرصانة). غير أن
      «انضباط» هو الأكثر تداولاً في السياق التربوي والنفسي المعاصر للدلالة على هذه
      السِّمة، وهو ما يُؤيِّده استخدامه في المعاجم الحديثة مقابل الإنجليزية «discipline».

  blind_candidates:
    - lemma: "تَهَذُّب"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل تَهَذَّبَ من جذر (هذب) على وزن تَفَعُّل، يدل على اتصاف المرء
        بالنقاء الأخلاقي وتخلُّصه من شوائب السلوك؛ وهو بذلك يصف السِّمة الشخصية
        المنشودة من زاوية التنقية والتزكية. الوزن منتج دلالياً للصفات المكتسبة.

    - lemma: "تَأَدُّب"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل تَأَدَّبَ من جذر (أدب) على وزن تَفَعُّل، يُفيد التخلُّق بآداب
        السلوك والالتزام بمعاييره؛ والمصدر يُؤدِّي وظيفة الاسم الدالّ على السِّمة.
        الجذر (أدب) موثَّق في مقاييس اللغة بمعنى الاجتماع على المستحسَن.

    - lemma: "وَقَار"
      generation_method: majaz
      justification: >
        اسم مصدر من (وقر) على وزن فَعَال، أصله الثقل والرسوخ الحسِّي، ثم نُقل
        مجازاً إلى رصانة السلوك والحلم والاتزان. وقد أحكم العرب هذا الانتقال حتى
        غدا الوقار سِمة شخصية راسخة في الاستعمال الكلاسيكي والمعاصر.

    - lemma: "رَزَانة"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر (رزن) على وزن فَعَالة، يدل في أصله على الثبات والتجمُّع،
        ثم نُقل للدلالة على أصالة الرأي والاتزان في السلوك. يُستخدم في المعاجم
        التراثية والحديثة وصفاً للسِّمة الشخصية المتمثِّلة في رجاحة الطبع.


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: نُفِّذت الاستعلامات التالية:
  # (١) مطابقة دفعية لجميع اللمّات — (٢) إثراء بالمعرِّف — (٣) جسر إنجليزي
  # (٤) بحث بالكلمات المفتاحية — (٥) مقاييس اللغة للجذور

  per_lemma:

    - lemma: "انضباط"
      confirm:
        - text: >
            «(1) عقوبة؛ عقاب (2) فرع من المعرفة أو الدراسة (3) تدريب؛ تهذيب
            (4) «أ» تأديب (5) «أ» انضباط. «ب» ضبط النفس (6) نظام (7) انتظام»
          source: "المورد الحديث (2008) — مقابل: discipline"
        - text: "«حَسَن السُّلُوك.»"
          source: "المورد الحديث (2008) — مقابل: well-behaved"
      expands:
        - text: >
            «نظام تسنه الوزارة المعنية لمعالجة الأخطاء المهنية التي يقترفها
            الموظفون، الأعمال المتنافية مع واجبات الموظف، بهدف إصلاح ما يتنافى
            مع واجباته التي تعتبر جزءاً من النظام الأساسي للمهنة.»
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (2020) — مقابل: discipline"
          addition: >
            يُبيِّن هذا النص الاستعمالَ المؤسسي للمصطلح (الانضباط الوظيفي)؛
            وهو بُعد من أبعاد المفهوم يختلف عن السِّمة الشخصية المستهدفة،
            مما يؤكد ثراء المصطلح وتنوع سياقاته.
        - text: "«الانضباط الذاتيّ؛ ضَبْط الذات.»"
          source: "المورد الحديث (2008) — مقابل: self-discipline"
          addition: >
            يُمثِّل «الانضباط الذاتي» مركَّباً يُفصِّل السِّمة الشخصية بإضافة
            قيد «الذاتي»، مما يدل على أن «الانضباط» المجرَّد أوسع وقد يشمل
            أبعاداً خارجية أيضاً.

    - lemma: "تَهَذُّب"
      confirm:
        - text: >
            «(هَذَبَ) الهاءُ والذالُ والباء: كلمة تدل على تنقية شيء مما يعيبه.
            شيءٌ مهذَّب: منقًّى مما يعيبه.»
          source: "مقاييس اللغة لابن فارس"
        - text: "«(تهذب) الشَّيْء صَار مهذَّباً»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
      contradicts:
        - text: >
            «تَهَذَّبَ — الشيءُ: صار مهذَّباً» [مُقيَّد بضمير الشيء، مسند إلى
            المفعول لا إلى الفاعل الشخص]
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: >
            المعاجم تُسجِّله فعلاً (pos: verb) لا اسماً، والاستعمال المعجمي
            المُثبَت لـ«تَهَذُّب» هو الفعل الماضي أو المصدر بمعنى العملية
            لا الاسم الدالّ على السِّمة المستقرة.

    - lemma: "تَأَدُّب"
      confirm:
        - text: "«تأَدَّب: تهذَّب وتعلَّم الأدب — بأدب القرآن: احتذاه»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: >
            «(أَدَبَ) الهمزةُ والدالُ والباء أصلٌ واحد تتفرَّع مسائله وترجع إليه:
            فالأدبُ أن تجمع الناسَ إلى طعامك... والأدبُ أيضاً لأنه مجمَعٌ على
            استحسانه.»
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«تأَدَّب: pos=verb» [مُقيَّد بالفعلية في جميع المصادر المُثبَتة]"
          source: "المعجم الوسيط + المعجم الكبير — مجمع اللغة العربية"
          conflict: >
            سجَّلته المعاجم الكبرى فعلاً لا اسماً دالاً على سِمة شخصية؛
            استخدامه كمصدر-اسم للسِّمة ممكن نظرياً لكنه غير موثَّق استعمالاً
            راسخاً في هذا المجال الدلالي.

    - lemma: "وَقَار"
      confirm:
        - text: "«الوَقَارُ: الرَّزانَةُ والحلم والعَظَمَة»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
        - text: "«الوَقَار: الرزانة والحِلْمُ والتأنّي في التوجه نحو المطلوب»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«هو التأني في التوجه نحو المطالب»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413م)"
        - text: >
            «(وَقَرَ) الواو والقاف والراء: أصل يدل على ثقل في الشيء...
            ومنه الوقارُ: الحلم والرزانة.»
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«رجلٌ وَقَارٌ» [وُصف بالمصدر]"
          source: "المعجم الوسيط — مجمع اللغة العربية"
          addition: >
            يُشير إلى أن «وقار» يُستعمل صفةً وصفاً بالمصدر، مما يقرِّبه
            من الاسم الدالّ على السِّمة الشخصية الثابتة.

    - lemma: "رَزَانة"
      confirm:
        - text: "«الرَّزَانَةُ: الوَقارُ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«يقال: فيه رزانة: وقار»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
        - text: >
            «رَزَانَة: الحلم والوقار وأصالة الرأي، وسكون الشيء وثبوته،
            والثقل في الوزن ونحوه.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >
            «(رَزَنَ) الراء والزاء والنون أصل يدل على تجمُّع وثبات.
            رَزُنَ الشيءُ: ثَقُلَ. رجل رَزِينٌ وامرأةٌ رَزَانٌ.»
          source: "مقاييس اللغة لابن فارس"


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:

  per_lemma:

    # ──────────────────────────────────────────
    # اللمّة الموجودة: انضباط
    # ──────────────────────────────────────────
    - lemma: "انضباط"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة في معاجم حديثة رصينة (المورد الحديث، المعجم الموحد للإشراف
        التربوي) بمقابل مباشر للإنجليزية «discipline» بما يشمل السِّمة الشخصية
        (ضبط النفس) والالتزام بالمعايير. الجذر (ضبط) عربي أصيل، والوزن (اِنْفِعَال)
        مناسب لاسم السِّمة المكتسبة. لا يوجد ما يناقض استخدامها لهذا المعنى.
        تحتاج إلى تشكيل كامل في قاعدة البيانات.

      evidence_assessment:
        case: confirm_only

      mwe_check:
        is_mwe: false

      loan_check:
        borrowing_type: native
        note: >
          اشتقاق عربي صرف من جذر (ض-ب-ط) على وزن اِنْفِعَال؛ لا اقتراض
          ولا ترجمة حرفية.

      term_quality_gate:
        consistency: "مطَّرد — الوزن (اِنْفِعَال) منتج ومستقر لهذه الدلالة"
        ease_of_use: "سهل التداول، مقبول في السياقين الرسمي والعامي المثقف"
        appropriateness: "ملائم للمفهوم النفسي والتربوي المستهدف"
        heritage_preference: "مفضَّل على البديل الدخيل لعدم وجود دخيل منافس"
        arabic_preference: "عربي أصيل"
        derivability: "عائلة اشتقاقية غنية: ضبط / ضابط / مضبوط / انضباط / انضباطي"

      morphological_fit: >
        وزن اِنْفِعَال دالٌّ على المطاوعة والاتصاف، وهو ملائم لاسم السِّمة
        المكتسبة؛ مثله مثل: اعتدال، انتظام، انضباط.

      nuance_differentiation: >
        «انضباط» هو اللمّة الوحيدة في المجموعة. يتميّز عن «الأدب» بتركيزه على
        الجانب الذاتي من ضبط النفس والامتثال للأنظمة والمعايير الخارجية، بينما
        «الأدب» يُعبِّر عن منظومة القيم والآداب الأشمل. ويتميّز عن «الوقار»
        الذي يعنى بالمظهر الخارجي للاتزان والرصانة دون تركيز على الالتزام
        بالأنظمة.

      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْضِبَاط"

    # ──────────────────────────────────────────
    # مرشّح المرحلة ١: تَهَذُّب
    # ──────────────────────────────────────────
    - lemma: "تَهَذُّب"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكبرى (الوسيط، الكبير) تُسجِّل «تَهَذَّبَ» فعلاً لا اسماً
        راسخاً للسِّمة الشخصية. وإن صحَّت الوظيفة الاسمية للمصدر نظرياً،
        فإن المصدر في هذا المعنى يُفيد العملية (عملية التهذّب) لا السِّمة
        المستقرة. علاوة على ذلك، تُغطِّي «اِنْضِبَاط» الحقلَ الدلالي المستهدف
        بصورة أوفى وأكثر توثيقاً في السياقين التربوي والنفسي.

      evidence_assessment:
        case: mixed

      mwe_check:
        is_mwe: false

    # ──────────────────────────────────────────
    # مرشّح المرحلة ١: تَأَدُّب
    # ──────────────────────────────────────────
    - lemma: "تَأَدُّب"
      source: stage1
      decision: removed
      decision_reason: >
        تُدرجه المعاجم الكبرى فعلاً (pos: verb) لا اسماً. المصدر «تَأَدُّب»
        يدل على فعل التأدُّب (عملية التعلم والاكتساب) لا على سِمة الانضباط
        المستقرة كصفة شخصية. الاستخدام الاسمي ممكن لكنه ليس راسخاً معجمياً
        في هذا السياق الدلالي تحديداً.

      evidence_assessment:
        case: mixed

      mwe_check:
        is_mwe: false

    # ──────────────────────────────────────────
    # مرشّح المرحلة ١: وَقَار
    # ──────────────────────────────────────────
    - lemma: "وَقَار"
      source: stage1
      decision: removed
      decision_reason: >
        «وَقَار» موثَّق توثيقاً جيداً كاسم يدل على الرزانة والحلم والتأني؛
        غير أن مدلوله يتمحور حول الهدوء والرصانة في الهيئة والمظهر وطريقة
        التعامل، وهو مفهوم مختلف عن «حسن السلوك» (being well behaved) الذي
        يُعبِّر عن الامتثال للمعايير السلوكية المرعية. إدراجه في هذه المجموعة
        يُخلط بين سِمتين مختلفتين. يُناسب مجموعةً ترادفيةً مستقلة (dignity /
        stateliness).

      evidence_assessment:
        case: confirm_only

      mwe_check:
        is_mwe: false

    # ──────────────────────────────────────────
    # مرشّح المرحلة ١: رَزَانة
    # ──────────────────────────────────────────
    - lemma: "رَزَانة"
      source: stage1
      decision: removed
      decision_reason: >
        «رَزَانة» تعني الرجاحة والوقار وثبات الطبع، وهي سِمة شخصية راسخة
        في المعاجم، لكنها تدل على الثِّقَل والأناة في الطبع لا على الالتزام
        السلوكي بمعايير الأدب والنظام. تتقاطع مع «وَقَار» دلالياً وتنتمي
        إلى حقل دلالي مجاور (gravitas / composure) لا إلى حقل «حسن السلوك».

      evidence_assessment:
        case: confirm_only

      mwe_check:
        is_mwe: false


