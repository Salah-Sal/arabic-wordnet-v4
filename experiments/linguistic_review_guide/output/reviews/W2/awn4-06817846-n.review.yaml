stage3_analysis:
  per_lemma:

    - lemma: "إشارة الانسحاب"
      decision: confirmed
      decision_reason: >
        مركّب إضافي شفّاف ومدعوم دلالياً: «إشارة» بجذرها (شور = الإبداء والإظهار) تؤدي وظيفة الإعلام،
        و«الانسحاب» بجذره (سحب = الجرّ والامتداد) يصف الحركة العسكرية المنظّمة. المورد الحديث يُترجم
        military retreat بـ«دقّة الانسحاب» مما يثبّت «الانسحاب» معادلاً للمصطلح العسكري. اللمّة
        بحاجة إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تجمع بين الدلالة على الفعل التواصلي (إشارة) ومضمونه العسكري
        (الانسحاب). أكثر حيادية من «إشارة التقهقر» التي تحمل دلالة الهزيمة، وأكثر دقة تكتيكية
        من «إيذان الانسحاب» الذي يوحي بإعلان رسمي لا بإشارة ميدانية فورية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشَارَةُ الِانْسِحَابِ"

    - lemma: "النَّفِيرُ"
      source: stage1
      decision: removed
      decision_reason: >
        يناقض دلالة المجموعة مناقضةً صريحة: «النفير» في الاستعمال الكلاسيكي والأصل الاشتقاقي (نفر =
        تجافٍ وتباعد عن المقر للخروج والقتال) يدل على الاستنفار للهجوم لا على الانسحاب. فضلاً عن ذلك
        يحمل في المعجم الطبي الموحد مصطلحاً راسخاً (قناة أوستاش) مما يُنشئ التباساً علمياً.

    - lemma: "إِيذَانُ الِانْسِحَابِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي لهذا المركّب. «الإيذان» يوحي بالإعلان والإخبار الرسمي (استعمال
        قرآني وأدبي) أكثر من الإشارة الميدانية الفورية. المركّب وإن كان صحيح التركيب فهو غير مسكوك
        ولا مستعمل في الأدبيات العسكرية العربية.

    - lemma: "نَفِيرُ الجَلَاءِ"
      source: stage1
      decision: removed
      decision_reason: >
        المركّب معيب من ناحيتين: (١) «النفير» يدل على الخروج للقتال لا للانسحاب. (٢) «الجلاء» في
        الاستعمال العربي يعني ترك الأرض والوطن (جلاء المستعمر) لا الانسحاب التكتيكي الميداني.
        المركّب غير مسكوك ويجمع دلالتين غير ملائمتين للمفهوم المقصود.

    - lemma: "إِشَارَةُ التَّقَهْقُرِ"
      source: stage1
      decision: removed
      decision_reason: >
        «تقهقر» يحمل دلالة التراجع تحت الإكراه والهزيمة («تراجع مهزوماً» — المعجم الوسيط)، وهو أشد
        سلبيةً من «الانسحاب» المنظّم الذي يقصده المصطلح العسكري. الانسحاب المنظّم قد يكون
        استراتيجياً لا هزيمةً، لذا «إشارة الانسحاب» أدق وأحيد. المركّب غير مسكوك كذلك.


