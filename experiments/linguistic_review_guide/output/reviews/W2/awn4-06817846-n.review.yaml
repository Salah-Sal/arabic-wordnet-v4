stage2_evidence:
  per_lemma:

    - lemma: "إشارة الانسحاب"
      confirm:
        - text: >
            «(1) انسحاب؛ تراجع؛ تقهقر (2) «أ» دَقّة الانسحاب أو العودة إلى الثكنة أو إنزال العَلَم.
            «ب» حفلة إنزال العَلَم (جن) ... to beat a retreat: (1) يَنْسحب؛ يولِّي الأدبار
            (2) يتخلَّى عن عمل أو مشروع.»
          source: "المورد الحديث (2008)"
        - text: >
            «(1) يقرع الطبل داعيًا إلى التراجع (2) يتراجع؛ ينسحب.»
          source: "المورد الحديث (2008)"
        - text: >
            «انسحاب: من (س ح ب) خروج الجيش من المعركة أو خروج الشخص من مجلس أو موقع.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: >
            «السِّينُ وَالْحَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى جَرِّ شَيْءٍ مَبْسُوطٍ وَمَدِّهِ.
            تَقُولُ: سَحَبْتُ ذَيْلِي بِالْأَرْضِ سَحْبًا. وَسُمِّيَ السَّحَابُ سَحَابًا تَشْبِيهًا لَهُ بِذَلِكَ،
            كَأَنَّهُ يَنْسَحِبُ فِي الْهَوَاءِ انْسِحَابًا.»
          source: "مقاييس اللغة لابن فارس (جذر: سحب)"
          addition: "يربط الانسحاب بدلالة الجرّ والامتداد الأصلية، مما يدعم استعماله في الانسحاب العسكري المنظّم."
        - text: >
            «الشِّينُ وَالْوَاوُ وَالرَّاءُ أَصْلَانِ مُطَّرِدَانِ، الْأَوَّلُ مِنْهُمَا إِبْدَاءُ شَيْءٍ
            وَإِظْهَارُهُ وَعَرْضُهُ... وَالْمَكَانُ الَّذِي يُعْرَضُ فِيهِ الدَّوَابُّ هُوَ الْمِشْوَارُ.»
          source: "مقاييس اللغة لابن فارس (جذر: شور)"
          addition: "يُثبّت أن أصل «إشارة» هو الإبداء والإظهار، مما يناسب دلالة الإعلام بالانسحاب."

    - lemma: "النَّفِيرُ"
      confirm:
        - text: >
            «نفير: هو جهاز إشارات سمعية... يُصدر صوتاً أو أصواتاً متتابعة بواسطة ضغّاط...
            الفارق الرئيسي بين النفير والبوق يكمن في عملية إنتاج الأصوات.»
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
      contradicts:
        - text: >
            «(النَّفِير) الكُفْء في المفاخرة؛ القوم يَنْفِرُون للقتال. (النَّفِير العَامُّ): قيام عامة
            الناس لقتال العدوِّ.»
          source: "المعجم الوسيط"
          conflict: >
            النفير في الاستعمال الكلاسيكي دلالته الخروج إلى القتال والاستنفار، وهو معاكس لمفهوم الانسحاب
            المقصود. لا يحمل دلالة إشارة البدء بالتراجع بل العكس تماماً.
        - text: >
            «النُّونُ وَالْفَاءُ وَالرَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَجَافٍ وَتَبَاعُدٍ...
            وَالنَّفِيرُ: النَّفَرُ (القوم الخارجون).»
          source: "مقاييس اللغة لابن فارس (جذر: نفر)"
          conflict: >
            الأصل الاشتقاقي (نفر) يدل على التجافي والتباعد والخروج، لا على الرجوع والانسحاب.
        - text: >
            «النَّفِير» — translation_en: eustachian tube / auditory tube / pharyngotympanic tube
          source: "المعجم الطبي الموحد (2009)"
          conflict: >
            في المعجم الطبي الموحد يحمل «النفير» مصطلحاً تشريحياً راسخاً (قناة أوستاش)، مما يجعل
            استخدامه في الحقل العسكري مصدراً للالتباس.

    - lemma: "إِيذَانُ الِانْسِحَابِ"
      evidence_status: "no_material_found"

    - lemma: "نَفِيرُ الجَلَاءِ"
      expands:
        - text: >
            «خُرُوجُ القَوْمِ من أرضٍ إلى أرضٍ. وغَلَبَ فى أَدَبِيَّاتِ السِّياسَةِ فى العَصْرِ الحَدِيثِ
            على خُرُوجِ المُسْتَعْمِرِينَ من البلاد التي احتلُّوها.»
          source: "المعجم الكبير (جذر: جلو)"
          addition: >
            يدعم «الجلاء» مفهوم الانسحاب والمغادرة لكنه يرتبط بمغادرة الأرض والوطن لا بالتكتيك
            الميداني.
        - text: >
            «جَلَا الْقَوْمُ عَنْ مَنَازِلِهِمْ جَلَاءً، وَأَجْلَيْتُهُمْ أَنَا إِجْلَاءً.»
          source: "مقاييس اللغة لابن فارس (جذر: جلو)"
          addition: "يؤكد دلالة الجلاء على الرحيل الكلي من الأرض، لا على الانسحاب التكتيكي الميداني."

    - lemma: "إِشَارَةُ التَّقَهْقُرِ"
      expands:
        - text: >
            «(تقهقر) قهقهر وتراجع مهزوماً.»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: >
            «تقهقر» يحمل دلالة التراجع تحت وطأة الهزيمة، وهي أشد سلبية من «الانسحاب» المنظّم
            الذي يقصده المصطلح.
        - text: >
            «(1) انسحاب؛ تراجع؛ تقهقر.»
          source: "المورد الحديث (2008) — ترجمة retreat"
          addition: >
            ورود الثلاثة مجتمعة (انسحاب، تراجع، تقهقر) يؤكد أن «إشارة الانسحاب» و«إشارة التقهقر»
            كلاهما محتمل، غير أن «الانسحاب» أكثر حيادية واستخداماً في الأدبيات العسكرية الرسمية.


