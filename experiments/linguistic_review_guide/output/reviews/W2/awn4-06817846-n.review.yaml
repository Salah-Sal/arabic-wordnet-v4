# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-06817846-n  |  ILI: i72252  |  POS: n
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (إشارة الانسحاب) خالية من التشكيل الكامل في قاعدة البيانات."
      - "المجموعة تحتوي على لمّة مفردة واحدة فقط؛ قد يكون من المفيد البحث عن مرادفات عسكرية متخصصة."
      - "الحقل definition_ar يحتوي على وسم المجال (عسكري) داخل نص التعريف بدلاً من حقل مستقل."
    observations: >
      المجموعة تمثّل مفهوماً عسكرياً تقنياً دقيقاً: إشارة تكتيكية تُعطى للقوات إيذاناً بالانسحاب من
      مواضع الخطر. في التراث العربي الحربي كانت مثل هذه الإشارات تُعطى بالطبل أو البوق أو بإشارات
      حركية. اللمّة الموجودة «إشارة الانسحاب» مركّب إضافي شفّاف ومعبّر، غير أن المفردة ليست مسكوكة
      في المعاجم الكلاسيكية التي تتناول الإشارات الفردية (كالنفير/البوق) لا بوصفها مجموعة مصطلحية.
      المصطلح الإنجليزي «retreat» في سياقه العسكري يقابله في العربية المعاصرة: انسحاب/تقهقر/تراجع،
      والإشارة الخاصة به هي «دقّة الانسحاب» (في المورد الحديث) أو «إشارة الانسحاب». الجذر الرئيسي
      للمفهوم هو «سحب» بدلالة الانسحاب المنتظم، والجذر «شور» بدلالة الإشارة الظاهرة.

  blind_candidates:
    - lemma: "النَّفِيرُ"
      generation_method: majaz
      justification: >
        في التراث العربي «النفير» هو الصوت أو النداء الذي يُستنفر به الناس للرحيل أو القتال. بالمجاز
        يمكن توسيع دلالته ليشمل إشارة البدء بأي حركة عسكرية كالانسحاب. وزنه (فَعِيل) مناسب للمصادر
        الدالة على الحدث الصوتي.

    - lemma: "إِيذَانُ الِانْسِحَابِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «إيذان» (مصدر آذن: أعلم وأنبأ) + «الانسحاب». يعبّر عن الإعلام الرسمي ببدء
        الانسحاب، وهو أكثر رسمية من «إشارة» لكنه يؤدي الوظيفة الدلالية نفسها. الجذر «أذن» يحمل
        دلالة الإذن والإعلان في آنٍ.

    - lemma: "نَفِيرُ الجَلَاءِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي يجمع «النفير» (النداء والحركة) و«الجلاء» (مغادرة الأرض وتركها). في المعجم الكبير
        «الجلاء» هو خروج القوم من أرض إلى أرض؛ فالمركّب يعني الإشارة التي تُطلق لمغادرة الموقع
        ويناسب السياق العسكري التكتيكي.

    - lemma: "إِشَارَةُ التَّقَهْقُرِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «إشارة» (العلامة أو الإيماءة) + «التقهقر» (الرجوع إلى الخلف، الانسحاب
        التكتيكي). الفعل «تقهقر» راسخ في الاستعمال العسكري العربي المعاصر لوصف التراجع المنظّم.


