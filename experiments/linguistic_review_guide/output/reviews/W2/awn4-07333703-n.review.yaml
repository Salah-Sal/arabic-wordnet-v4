stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دقيق وواضح."
      - "اللمتان الموجودتان صحيحتان، ولكن يمكن توسيع المجموعة لتشمل ألفاظاً تراثية تدل على نفس المدلول العام."
    observations: "توفيق ونجاح هما اللفظان الأكثر شيوعاً في الاستعمال المعاصر للتعبير عن النجاح في العمل أو الدراسة أو الحياة. المجموعة تغطي مفهوم 'الحدث الناجح' أو 'حالة النجاح'."
  blind_candidates:
    - lemma: "نَجَاح"
      generation_method: ishtiqaq
      justification: "المصدر الأصلي للفعل نجح، وهو اللفظ الأشهر للتعبير عن بلوغ الهدف."
    - lemma: "تَوْفِيق"
      generation_method: ishtiqaq
      justification: "مصدر وفق، ويدل على ملاءمة الأسباب وبلوغ المراد بضرب من التيسير."
    - lemma: "فَلَاح"
      generation_method: ishtiqaq
      justification: "لفظ تراثي يدل على الظفر والبقاء ونيل السعادة."
    - lemma: "فَوْز"
      generation_method: ishtiqaq
      justification: "يدل على الظفر بالمطلوب والنجاة من المكروه."

stage2_evidence:
  per_lemma:
    - lemma: "نَجَاح"
      confirm:
        - text: "«الوصول إلى الأهداف المرجوة.»"
          source: "مسرد التربية (ArabTerm)"
        - text: "«النَّجَاحُ فِي الْحَوَائِجِ: الظَّفَرُ بِهَا.»"
          source: "مقاييس اللغة"
    - lemma: "تَوْفِيق"
      confirm:
        - text: "«التوفيق: جعل الله فعل عبده موافقا لما يحبه ويرضاه.»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«جعل الأسباب متوافقة للمطلوب.»"
          source: "كشاف اصطلاحات الفنون"
        - text: "«من الله للعبد سد طريق الشر وتسهيل طريق الخير.»"
          source: "المعجم الوسيط"
    - lemma: "فَلَاح"
      confirm:
        - text: "«الفوز وإدراك البغية.»"
          source: "لسان العرب"
        - text: "«الْبَقَاءُ وَالْفَوْزُ.»"
          source: "مقاييس اللغة"
    - lemma: "فَوْز"
      confirm:
        - text: "«النَّجاةُ والظَّفَرُ بالأُمْنِيَّةِ والخَيرِ.»"
          source: "تاج العروس"
        - text: "«الظفر بالخير مع حصول السلامة.»"
          source: "المفردات في غريب القرآن"

stage3_analysis:
  per_lemma:
    - lemma: "نَجَاح"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والمباشر للتعبير عن مفهوم النجاح في المعجم واللغة المعاصرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَجَاح"
    - lemma: "تَوْفِيق"
      decision: confirmed
      decision_reason: "مرادف قوي للنجاح، خاصة في سياق تيسير الأمور وملاءمة الظروف للوصول إلى الغاية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوْفِيق"
    - lemma: "فَلَاح"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ أصيل يعبر عن النجاح والظفر، ويضيف بعداً من الاستمرارية والسعادة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَلَاح", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فَوْز"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن النجاح من زاوية الظفر بالمراد، وهو يتطابق تماماً مع دلالة المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَوْز", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حدث يحقق الغرض المقصود منه"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح لكنه يمكن أن يكون أكثر جزالة وبناءً معجمياً."
    authored:
      - type: terminological
        text: "نَيْلُ المُرادِ وَالظَّفَرُ بِالبُغْيَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "نَيْلُ المُرادِ وَالظَّفَرُ بِالبُغْيَةِ."}
  examples:
    per_lemma:
      - lemma: "نَجَاح"
        examples:
          - text: "حَقَّقَ الطَّالِبُ نَجَاحًا بَاهِرًا فِي امْتِحَانَاتِهِ."
            type: usage
      - lemma: "تَوْفِيق"
        examples:
          - text: "نَرْجُو لَكَ التَّوْفِيقَ وَالسَّدَادَ فِي عَمَلِكَ الْجَدِيدِ."
            type: usage
      - lemma: "فَلَاح"
        examples:
          - text: "«حَيَّ عَلَى الْفَلَاحِ» دَعْوَةٌ لِلنَّجَاحِ فِي الدُّنْيَا وَالْآخِرَةِ."
            type: usage
      - lemma: "فَوْز"
        examples:
          - text: "كَانَ فَوْزُ الْفَرِيقِ بِالْكَأْسِ ثَمَرَةً لِلْجُهْدِ الْمُتَوَاصِلِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "حَقَّقَ الطَّالِبُ نَجَاحًا بَاهِرًا فِي امْتِحَانَاتِهِ."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "نَرْجُو لَكَ التَّوْفِيقَ وَالسَّدَادَ فِي عَمَلِكَ الْجَدِيدِ."}

stage5_enrichment:
  per_entry:
    - lemma: "نَجَاح"
      entry_id: "{auto}"
      root: "نجح"
      maqayis_quote: "«النُّونُ وَالْجِيمُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى ظَفَرٍ وَصِدْقٍ وَخَيْرٍ.»"
    - lemma: "تَوْفِيق"
      entry_id: "{auto}"
      root: "وفق"
      maqayis_quote: "«الْوَافُ وَالْفَاءُ وَالْقَافُ: كَلِمَةٌ تَدُلُّ عَلَى مُلَاءَمَةِ الشَّيْئَيْنِ.»"
    - lemma: "فَلَاح"
      entry_id: "{auto}"
      root: "فلح"
      maqayis_quote: "«الْفَلَاحُ: الْبَقَاءُ وَالْفَوْزُ.»"
    - lemma: "فَوْز"
      entry_id: "{auto}"
      root: "فوز"
      maqayis_quote: "«الْفَوْزُ: النَّجَاةُ وَالظَّفَرُ بِالْخَيْرِ.»"
  per_sense:
    - lemma: "نَجَاح"
      sense_id: "{auto}"
      nuance: "اللفظ العام والشائع لتحقيق الهدف."
      mwe: false
    - lemma: "تَوْفِيق"
      sense_id: "{auto}"
      nuance: "نجاح يقترن بتيسير الأسباب وملاءمة الظروف."
      mwe: false
    - lemma: "فَلَاح"
      sense_id: "{auto}"
      nuance: "نجاح شامل يصحبه بقاء وسعادة."
      mwe: false
    - lemma: "فَوْز"
      sense_id: "{auto}"
      nuance: "النجاح من زاوية الظفر بمطلوب أو النجاة من مكروه."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نجح","maqayis":"«النُّونُ وَالْجِيمُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى ظَفَرٍ وَصِدْقٍ وَخَيْرٍ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"وفق","maqayis":"«الْوَافُ وَالْفَاءُ وَالْقَافُ: كَلِمَةٌ تَدُلُّ عَلَى مُلَاءَمَةِ الشَّيْئَيْنِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ العام والشائع لتحقيق الهدف.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
