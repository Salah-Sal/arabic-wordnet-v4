# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'إزالة التعظم' خاليةٌ من التشكيل الكامل في synset_info وفي سجلّ قاعدة البيانات (entry_id: 736108)"
      - "التركيب 'إزالة التعظم' يعتمد على 'التعظم' الذي يعني ossification (تكوّن العظام)؛ فـ'إزالة التعظم' = عكس عملية التعظم، وهذا صحيح طبياً، لكنه قد يُوحي بإزالة العظم كنسيج لا بفقدان محتواه المعدني"
      - "قاعدة البيانات تُسجّل الجذر 'زل' (root_source=camel) بدلاً من الجذر الصحيح 'زول' المثبَّت في مقاييس اللغة"
    observations: >
      المفهوم طبيٌّ متخصص يقع ضمن العمليات البيولوجية (hypernym: عملية تحدث في الكائنات الحية).
      التعريف 'فقدان المحتوى المعدني لأنسجة العظام' ترجمةٌ حرفية من الإنجليزية؛ يمكن تحسينه
      بأسلوب المعجم الوسيط مع تحديد الجنس القريب والفصل النوعي.
      اللمّة الموجودة مُعتمَدة في معجم المصطلحات الطبية (ج.2، 2003) بمقابل deossification الدقيق.
      ثمة مصطلحات مشابهة كـ'نزع المعادن' و'إزالة التمعدن' تقابل demineralization الأعم.
  blind_candidates:
    - lemma: "نَزْعُ مَعَادِنِ الْعِظَامِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي مركَّب (نزع + معادن + العظام) يصف سحب المواد المعدنية من أنسجة العظام.
        الجذر 'نزع' يدل على القلع والانتزاع (مقاييس: النون والزاء والعين أصل صحيح يدل
        على قلع شيء). إضافة 'العظام' فصلٌ نوعي يُميّزه عن إزالة المعادن من سائر الأنسجة.
    - lemma: "تَجَرُّدُ الْعِظَامِ"
      generation_method: ishtiqaq
      justification: >
        مصدر وزن تَفَعُّل من الجذر (ج-ر-د)، بمعنى تخلّي العظام عن مادّتها المعدنية
        وتجرّدها منها. الجذر يدل على الكشط والقشر والتعرّي، وهو مجازٌ طبيعي للتعبير
        عن العظام التي فقدت معادنها حتى باتت 'عارية' منها.
    - lemma: "إِزَالَةُ التَّمَعْدُنِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي (إزالة + التمعدن): 'التمعدن' مصطلح موحَّد في المعاجم العلمية العربية
        يعني mineralization؛ فـ'إزالة التمعدن' = de-mineralization، يطابق دلالياً مفهوم
        فقدان المحتوى المعدني الوارد في تعريف المجموعة.
    - lemma: "نُضُوبُ الْكَلْسِ الْعَظْمِيِّ"
      generation_method: majaz
      justification: >
        مجاز إحيائي: 'النضوب' في الأصل جفاف الماء وانحساره، يُحال به على انحسار الكلس
        (الكالسيوم) من العظام. وزن فُعُول مصدري يفيد الحدوث. 'العظمي' صفةٌ تُقيِّد الموضع.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "إزالة التعظم"
      confirm:
        - text: "«فقد أو إزالة المواد المعدنية من العظام.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003) — ARABTERM [entry_id: 736108]"
        - text: "«translation_en: deossification»"
          source: "معجم المصطلحات الطبية (ج.2، 2003) — ARABTERM [entry_id: 736108]"

    - lemma: "نَزْعُ مَعَادِنِ الْعِظَامِ"
      expands:
        - text: "«إزالة مفرطة للأملاح غير العضوية من أنسجة الجسم كما يحدث في السل، والسرطان ووهن العظام.» [المدخل: نزع المعادن — translation_en: demineralization]"
          source: "معجم المصطلحات الطبية (ج.2، 2003) — ARABTERM [entry_id: 736044]"
          addition: "الأقرب دلالةً للمجموعة وقد ذكر العظام صراحةً، لكن ترجمته demineralization لا deossification، ويشمل أنسجة الجسم عموماً مما يجعله أعمَّ من مفهوم المجموعة"

    - lemma: "تَجَرُّدُ الْعِظَامِ"
      evidence_status: "no_material_found"

    - lemma: "إِزَالَةُ التَّمَعْدُنِ"
      contradicts:
        - text: "«translation_en: demineralization / translation_fr: déminéralisation» [المجال: Pharmacy]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — ARABTERM [entry_id: 463400]"
          conflict: "يقابل demineralization (إزالة المعادن من أي وسط عضوي) لا deossification (الخاص بفقدان معادن العظام)؛ الدلالة أوسع مما تحدده المجموعة الترادفية"
      expands:
        - text: "«معامل إزالة التمعدن — coefficient of demineralization»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM [entry_id: 559208]"
          addition: "يُثبت استخدام 'إزالة التمعدن' في السياق الطبي لكن بمعنى أشمل من deossification"

    - lemma: "نُضُوبُ الْكَلْسِ الْعَظْمِيِّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إزالة التعظم"
      decision: confirmed
      decision_reason: >
        مصطلح مُعتمَد في معجم المصطلحات الطبية (ج.2، 2003) بمقابل إنجليزي دقيق 'deossification'
        يطابق معرّف المجموعة، وتعريفه 'فقد أو إزالة المواد المعدنية من العظام' يتطابق مع
        تعريف المجموعة. التركيب الإضافي (إزالة + التعظم) سليم اشتقاقياً: 'إزالة' من 'زول'
        (التنحي عن المكان)، و'التعظم' من 'عظم' (ossification). يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يختص بفُقدان المحتوى المعدني الكلّي لأنسجة العِظام تحديداً (كالسيوم وفوسفات معاً)،
        خلافاً لـ'إزالة الكلس' (decalcification) المقتصرة على أملاح الكالسيوم وحدها،
        ولـ'نزع المعادن' (demineralization) الأشمل الذي يطال أنسجة الجسم عامةً لا العظام وحدها
      actions:
        - command: update_lemma
          params:
            entry_id: "736108"
            new_lemma: "إِزَالَةُ التَّعَظُّمِ"

    - lemma: "نَزْعُ مَعَادِنِ الْعِظَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المصطلح بوصفه وحدةً معجميةً مُثبَّتة. 'نزع المعادن' (entry_id: 736044)
        الأقرب إليه يقابل demineralization العام الشامل لأنسجة الجسم لا deossification المختص
        بالعظام. فشل اختبار التثبيت المعجمي: لا يوجد في أي معجم من قاعدة البيانات.

    - lemma: "تَجَرُّدُ الْعِظَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على توظيفه مصطلحاً طبياً مُسكَّكاً. الجذر (جرد) مع العظام لا يُفرز
        وحدةً اصطلاحية ثابتة في الأدبيات الطبية. فشل اختبار السكّ: يمكن إبدال 'تجرّد'
        بـ'تخلّي' دون تغيير الدلالة، مما يثبت عدم ثبوته مصطلحاً.

    - lemma: "إِزَالَةُ التَّمَعْدُنِ"
      source: stage1
      decision: removed
      decision_reason: >
        مصطلح مُعتمَد لكنه يقابل demineralization (إزالة المعادن من أي نسيج) لا deossification
        (الخاص بأنسجة العظام). إدراجه يُدخل مصطلحاً أعم من حدود هذه المجموعة الترادفية
        ولا يُقيِّد الموضع بالعظام.

    - lemma: "نُضُوبُ الْكَلْسِ الْعَظْمِيِّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. 'الكلس' يعني الكالسيوم تحديداً، لا المحتوى المعدني الكلي المُتضمَّن
        في تعريف المجموعة. المجاز (نضوب = جفاف) بعيد عن الاستعمال الطبي الرسمي.
        مرفوض لعدم مطابقة الدلالة ولغياب التثبيت المعجمي.


