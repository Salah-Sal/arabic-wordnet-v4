stage1_review:
  assessment:
    concerns:
      - "اللمّة الأولى «ذَائِبِيَّة» مشتقة من اسم الفاعل «ذائب» وليست الأكثر شيوعاً في المعاجم المصطلحية الحديثة مقارنة بـ«ذوبانية»"
      - "اللمّة الثانية «قَابِلِيَّة الذَّوَبَان» تركيب إضافي وصفي طويل، وقد توجد بدائل أكثر إيجازاً"
      - "غياب مصطلح «ذوبانية» رغم أنه الأوسع توثيقاً في المعاجم المصطلحية العربية"
    observations: "المفهوم المطروح هو خاصية كيميائية-فيزيائية تُعبّر عن كمية المادة القابلة للذوبان في مذيب معين. التعريف العربي الحالي سليم ومطابق للتعريف الإنجليزي. المجموعة تحتاج إلى إضافة المصطلح الأكثر توحيداً «ذوبانية» الذي تتبناه أغلب المعاجم المصطلحية العربية. المصطلح «انحلالية» يُستخدم أيضاً في السياق الصيدلاني."

  blind_candidates:
    - lemma: "ذَوْبَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «ذَوَبان» (مصدر ذابَ يذوبُ) على وزن فَعَلانيَّة، يدل على خاصية الذوبان بوصفها كمية قابلة للقياس"
    - lemma: "انْحِلالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «انحلال» (مصدر انحلَّ)، والانحلال في الكيمياء مرادف للذوبان، فالمصطلح يدل على قابلية الانحلال في مذيب"
    - lemma: "قَابِلِيَّةُ الإِذَابَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «قابلية» و«الإذابة» (مصدر أذابَ)، يعبّر عن مدى قبول المادة للإذابة في مذيب"
    - lemma: "مُذَابِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «مُذاب» (اسم مفعول من أذابَ)، يدل على صفة كون المادة قابلة للإذابة"


