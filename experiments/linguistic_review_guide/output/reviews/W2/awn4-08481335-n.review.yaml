stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدو ترجمة حرفية للتعريف الإنجليزي (trinkets and other ornaments of dress collectively)، وكلمة 'مجتمعة' فيه ركيكة."
      - "اللمتان الموجودتان (حلي، زينة) تفتقران إلى التشكيل الدقيق الذي يحدد بنيتهما الصرفية (حُلِيّ/حَلْي، زِينَة)."
    observations: "المفهوم يدل على اسم جمع أو اسم جنس جمعي يجمع أدوات الزينة والحلي. 'حُلِيّ' كجمع لـ 'حِلْيَة' أو 'حَلْي' تؤدي هذا المعنى التجميعي بشكل ممتاز، و'زِينَة' تعبر عن نفس المفهوم بشمولية."
  blind_candidates:
    - lemma: "مُجَوْهَرَات"
      generation_method: ishtiqaq
      justification: "مشتقة من الجوهر، وتُستخدم للدلالة على الحلي المصوغة والمُرصعة مجتمعة."
    - lemma: "مُصَاغ"
      generation_method: ishtiqaq
      justification: "مشتقة من صاغ، وتُطلق على ما يُصاغ من المعادن الثمينة للزينة."
    - lemma: "تَزَايِين"
      generation_method: ishtiqaq
      justification: "جمع تكسير لكلمة تزيين أو زينة، وتدل على الكثرة في أدوات الزينة."
    - lemma: "خُرْدَوَات"
      generation_method: majaz
      justification: "تُطلق مجازاً في بعض السياقات على الأشياء الصغيرة المتفرقة، وقد تقابل trinkets في المعنى الدارج."

stage2_evidence:
  per_lemma:
    - lemma: "حلي"
      confirm:
        - text: "«الحَلْيُ، بالفتحِ: ما يُزَيَّنُ به من مَصُوغِ المَعْدِنِيَّاتِ أو الحِجَارَةِ. ج: حُلِيٌّ، كدُلِيٍّ، أَو هو جَمْعٌ، والواحِدُ: حَلْيَةٌ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«ما يُتزيّن به من مَصوغ المعدنيات أو الحجارة»"
          source: "المعجم الوسيط"
    - lemma: "زينة"
      confirm:
        - text: "«الزِينةُ، بالكسر: ما يُتَزَيَّنُ به»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الزينة: تحسين الشيء بغيره من لبسة أو حلية أو هيئة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«اسْمٌ جامعٌ لِكُلِّ شىءٍ يُتَزَيَّنُ به»"
          source: "المعجم الكبير"
    - lemma: "مجوهرات"
      confirm:
        - text: "«الحُلِيُّ المُرَصَّعَةُ بالحِجارَةِ الكَرِيمَة»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الحُلِيُّ المُرَصَّعَةُ بالحِجارَةِ الكَرِيمَة»"
          source: "المعجم الكبير"
          conflict: "تختص بالأحجار الكريمة والنفيسة، بينما المفهوم يشمل الحلي البسيطة (trinkets)."
    - lemma: "مصاغ"
      evidence_status: no_material_found
    - lemma: "تزايين"
      evidence_status: no_material_found
    - lemma: "خردوات"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "حلي"
      decision: confirmed
      decision_reason: "الكلمة دقيقة فصيحة، وجمعها 'حُلِيّ' يدل على مجموعة ما يُتزين به، مما يطابق المفهوم الذي يعبر عن التجميع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُلِيّ"
    - lemma: "زينة"
      decision: confirmed
      decision_reason: "مصطلح فصيح وجامع لكل ما يُتزين به، ويشمل الحلي وغيرها، ومطابق تماماً للمفهوم المراد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زِينَة"
    - lemma: "مُجَوْهَرَات"
      source: stage1
      decision: removed
      decision_reason: "مخصصة للأحجار الكريمة والنفيسة، والمجموعة الترادفية تقصد الحلي البسيطة وأدوات الزينة المجمعة (trinkets)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "مُصَاغ"
      source: stage1
      decision: removed
      decision_reason: "تفتقر إلى الأدلة القوية كاسم جمع، و'حُلِيّ' تغني عنها وأفصح."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "تَزَايِين"
      source: stage1
      decision: removed
      decision_reason: "كلمة صحيحة اشتقاقياً لكنها غير شائعة في الاستعمال المعجمي بهذا المعنى كبديل لزينة أو حلي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "خُرْدَوَات"
      source: stage1
      decision: removed
      decision_reason: "تستخدم للدلالة على البضائع الصغيرة والأدوات المعدنية (hardware/haberdashery) أكثر من الحلي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "الحلي وغيرها من زينة الملابس مجتمعة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك الترجمة بكلمة 'مجتمعة'. يمكن صياغة تعريف لغوي ومصطلحي أسلس يعبر عن المعنى التجميعي."
    authored:
      - type: terminological
        text: "ما يُتَزَيَّنُ به مِنْ مَصُوغَاتٍ وَأَحْجَارٍ وَغَيْرِهَا مُجْتَمِعَةً كَكُلٍّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "اسْمٌ جَامِعٌ لِكُلِّ مَا يُتَزَيَّنُ بِهِ."
        quality_check:
          genus_present: true
          differentia_present: false
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-08481335-n"
          definition_index: 0
          text: "ما يُتَزَيَّنُ به مِنْ مَصُوغَاتٍ وَأَحْجَارٍ وَغَيْرِهَا مُجْتَمِعَةً كَكُلٍّ."

  examples:
    per_lemma:
      - lemma: "حُلِيّ"
        examples:
          - text: "تَزَيَّنَتِ المَرْأَةُ بِأَجْمَلِ الحُلِيِّ فِي يَوْمِ العِيدِ."
            type: usage
      - lemma: "زِينَة"
        examples:
          - text: "اِشْتَرَتْ زِينَةً جَدِيدَةً لِتُرَصِّعَ بِهَا مَلابِسَهَا."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَزَيَّنَتِ المَرْأَةُ بِأَجْمَلِ الحُلِيِّ فِي يَوْمِ العِيدِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اِشْتَرَتْ زِينَةً جَدِيدَةً لِتُرَصِّعَ بِهَا مَلابِسَهَا."

