# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث الموجودة (درجة، مرحلة، مستوى) خالية من التشكيل — تستوجب تحديث update_lemma."
      - "لفظة 'point' (نقطة بمعنى موضع محدد في تسلسل) ليس لها مقابل صريح في اللمّات الحالية؛ قد تستحق التمثيل."
      - "التعريف الحالي ترجمة حرفية للإنجليزية، وليس بأسلوب المعجم العربي."
    observations: >
      المجموعة الترادفية تعبِّر عن مفهوم مجرَّد جوهري: «موضع محدَّد قابل للتمييز ضمن
      سُلَّم متدرِّج أو تسلسل منتظم أو في مجرى عملية ما». واللمّات الثلاث موجودة بكثافة في
      المعاجم الكلاسيكية والحديثة على حدٍّ سواء، وكل منها يحمل ظلًّا دلاليًّا مختلفًا:
      (درجة) تُركِّز على الدرجة في سُلَّم صاعد، (مرحلة) تُركِّز على القطعة المحدودة من
      المسار، (مستوى) تُركِّز على الطابق الأفقي ضمن التدرُّج. غياب التشكيل في المدخل
      يستوجب التصحيح. يمكن تعزيز المجموعة بـ(مرتبة) ذات المعنى الرياضي والرُّتَبي الواضح،
      و(مقام) للتعبير عن الموضع المُكتَسَب في مجرى عملية بعينها.
  blind_candidates:
    - lemma: "طَوْر"
      generation_method: majaz
      justification: >
        إحياء للفظ العربي الكلاسيكي (طور = الحالة والتارة والحد والقدر) بمعنى حالة مرحلية
        محدَّدة في تسلسل متتابع؛ يُستخدم اليوم في العلوم (طور الغاز/السائل) مما يمنحه
        حيويةً معجمية.
    - lemma: "مَنْزِلَة"
      generation_method: majaz
      justification: >
        مجاز إحيائي من «النزول = التوقف في مكان بعينه»؛ المنزلة في العربية الكلاسيكية
        هي الموضع الذي يتوقف عنده السائر، وتحوَّلت دلاليًّا إلى مرتبة محددة في سُلَّم.
    - lemma: "مَرْتَبَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من «رَتَبَ يَرْتُبُ» (دام وثبت) على وزن مَفْعَلَة، بمعنى الموضع الثابت
        المُعيَّن في تسلسل منتظم. المرتبة في الحساب = موضع الرقم في نظام الأعداد (مرتبة
        الآحاد والعشرات)؛ وهو تطبيق مباشر لمفهوم «موضع محدَّد في تسلسل منتظم».
    - lemma: "مَقَام"
      generation_method: majaz
      justification: >
        إزاحة دلالية من «مَقَامُ الإنسان = مَوْضِعُ قَدَمَيْهِ» إلى «الموضع المُكتَسَب
        المحدَّد الذي يبلغه المرء في مسيرة أو عملية»؛ المقام في المصطلح الصوفي والبلاغي
        = درجة محددة تُتحقَّق في مسار منتظم. كشّاف اصطلاحات الفنون يترجمه صراحةً بـ
        Level, stage, position.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "درجة"
      confirm:
        - text: >
            «الْمَنْزِلَةُ والمرْتَبَةُ فى الشَّرَفِ / الرِّفْعَةُ في الْمَنْزِلَةِ /
            (فى السُّلَّم الوظيفيّ): مَرْتَبةٌ فيه تُمَثِّلُ مُستوًى ما»
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة) — المدخل 86936"
        - text: >
            «الدرجة: محركة نحو المنزلة لكن يقال للمنزلة درجة إذا اعتبرت بالصعود
            دون الامتداد على البسيطة كدرجة السطح والسلم، ويعبر بها عن المنزلة الرفيعة»
          source: "التوقيف على مهمات التعاريف للمناوي — المدخل 813851"
        - text: >
            «المِرْقاة / الرُّتْبَةُ / له عليه دَرَجة: منزلة ورتبة فى الشرف»
          source: "المعجم الوسيط (ocr) — المدخل 8880"
        - text: "«وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌ»"
          source: "القرآن الكريم (البقرة: 228) — شاهد في المعجم الكبير 86936"
        - text: "«تِلْكَ الرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَى بَعْضٍ ... وَرَفَعَ بَعْضَهُمْ دَرَجَاتٍ»"
          source: "القرآن الكريم (البقرة: 253) — شاهد في المعجم الكبير 86936"
      expands:
        - text: >
            «(فى الرِّياضِيَّات) degree: قِسْمٌ من التِّسعين قِسْمًا الْمُتساوية /
            (فى عِلْم الفَلَك): جُزْءٌ من ثلاث مِئَةٍ وسِتِّينَ جُزْءا من دَوْرَة الفَلَك /
            (فى السُّلَّم الوظيفيّ): مَرْتَبةٌ فيه تُمَثِّلُ مُستوًى ما»
          source: "المعجم الكبير — المدخل 86936"
          addition: "يُظهر سعة استخدام «درجة» لتمثيل موضع محدد في سلاسل متنوعة: الزاوية، الفلك، السُّلَّم الوظيفي"

    - lemma: "مرحلة"
      confirm:
        - text: >
            «القَدْرُ المُحَدَّدُ من الشىء. يقال: هذه مرحلةٌ أُولى من البَحْث أو المَشْروع»
          source: "المعجم الكبير — المدخل 92705"
        - text: "«مرحلة» = phase, stage"
          source: "المعجم الموحد لمصطلحات المياه (ARABTERM) — المداخل 388979، 389908"
      expands:
        - text: >
            «المسافةُ ما بَيْنَ المَنْزِلَيْنِ يَقْطَعُها السائرُ فى نَحْوِ يَوْمٍ،
            وقُدِّرَتْ حديثًا بنحو ٣٠ كم. المنزلة يُرْتَحَلُ منها»
          source: "المعجم الكبير — المدخل 92705"
          addition: >
            الأصل الحسِّي (قطعة المسافة بين منزلين) يكشف الآلية الاستعارية التي أنتجت
            المعنى المجازي (قطعة محددة من مسار أو عملية)

    - lemma: "مستوى"
      confirm:
        - text: >
            «الدَّرَجة أو المكانة التى يكون عليها الشىءُ أو الشخصُ»
          source: "المعجم الكبير — المدخل 49291"
        - text: "«مستوى» = level"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة وغيره (ARABTERM) — المداخل 385000، 377085، 364447"
      expands:
        - text: >
            «السَّطْح المستوي هُوَ الَّذِي إِذا أخذت فِيهِ أَي نقطتين كَانَ الْمُسْتَقيم
            الْوَاصِل بَينهمَا منطبقا عَلَيْهِ»
          source: "المعجم الوسيط لمجموعة من المؤلفين — المدخل 883067"
          addition: >
            المعنى الهندسي الأصلي (السطح الأفقي المستوي) يُوضِّح التحوُّل المجازي
            إلى «المستوى» بمعنى طبقة أو درجة في تدرُّج ما

    - lemma: "طَوْر"
      confirm:
        - text: >
            «الطور: المرة والتارة والحد وما كان على حد الشيء أو بحذائه، ويقال عدا
            أو تعدى طوره أي جاوز حده وقدره، والصنف والنوع والحال»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani) — المدخل 877468"
        - text: "«طور» = phase"
          source: "مسرد الهندسة الكهربائية ومصطلحات الرياضيات والفلك (ARABTERM) — المداخل 377994، 417080"
      contradicts:
        - text: >
            «حالة عنصر ما صلب أو سائل أو غاز»
          source: "المعجم الموحد لمصطلحات الهندسة المدنية — المدخل 352358"
          conflict: >
            التخصُّص المعجمي الحديث حصَر «طور» في المعنى الفيزيائي (طور المادة) أكثر
            من دلالته العامة على موضع في تسلسل؛ ما يُضيِّق دلالته في الاستخدام المعاصر

    - lemma: "مَنْزِلَة"
      confirm:
        - text: >
            «الدارُ / المكانة والمرتبة»
          source: "المعجم الوسيط (ocr) — المدخل 28954"
        - text: >
            «(الْمنزلَة) الدَّار والمكانة والمرتبة؛ يُقَال لَهُ منزلَة عِنْد الْأَمِير
            مكانة، وَهُوَ رفيع الْمنَازل أي المراتب»
          source: "المعجم الوسيط لمجموعة من المؤلفين — المدخل 884721"
      contradicts:
        - text: >
            «يُقَال لَهُ منزلَة عِنْد الْأَمِير مكانة، وَهُوَ رفيع الْمنَازل»
          source: "المعجم الوسيط — المدخل 884721"
          conflict: >
            الشواهد المعجمية تُظهر أن «منزلة» تنحو إلى معنى المكانة الاجتماعية والمنزلة
            الشرفية (prestige/social rank) أكثر من معنى موضع محايد في تسلسل ما

    - lemma: "مَرْتَبَة"
      confirm:
        - text: >
            «الرُّتْبَة / المَرْقَبَة / كلُّ مقام شديد /
            (في علم الحساب): الموضع الذى يكون العدد المطلق فيها ذا قيمة خاصة بِحَسَبِها»
          source: "المعجم الوسيط (ocr) — المدخل 10127"
        - text: >
            «الرُّتْبَةُ, وهى المَنْزِلة والمكانة.
            المَرْقَبَةُ. قال الخَلِيلُ: المَراتِبُ فى الجبال والصَّحارى:
            هي الأعلامُ التى تُرَتَّبُ فيها العُيونُ والرُّقباءُ»
          source: "المعجم الكبير — المدخل 92019"
        - text: "مرتبة الآحاد: إذا وضع العدد المطلق فيها يكون واحداً"
          source: "المعجم الوسيط (ocr) — مثال في المدخل 10127"
        - text: "«مَرْتَبَة» = Strate (مستوى لساني), rank, status"
          source: "المعجم الموحد للسانيات والمعجم الطبي الموحد (ARABTERM) — المداخل 497293، 637665"
      expands:
        - text: >
            «وَمِنْ هَذَا الْبَابِ قَوْلُهُمْ: أَمْرٌ تُرْتَبٌ; مِنْ رَتَبَ إِذَا دَامَ.
            وَالرَّتَبُ: الشِّدَّةُ وَالنَّصَبُ»
          source: "مقاييس اللغة لابن فارس — جذر رتب (dictionary_id=151)"
          addition: >
            الجذر (رتب = داوم وثبت) يُبيِّن أن المرتبة تُفيد الموضع الثابت الدائم في ترتيب ما

    - lemma: "مَقَام"
      confirm:
        - text: >
            «المقام: [في الانكليزية] Level, stage, position [في الفرنسية] Stade, position —
            على صيغة اسم الظرف عند السالكين هو الوصف الذي يثبت على العبد ويقيم،
            فإن لم يثبت سمّي حالاً»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي — المدخل 820881"
        - text: >
            «المقام: ما تحقق العبد بمنازلته من الآداب. وشرطه عند القوم أن لا ينتقل
            للثاني حتى يستوفي أحكام الأول، والفرق بينه وبين الحال أن الأحوال مواهب
            والمقامات مكاسب»
          source: "التوقيف على مهمات التعاريف للمناوي — المدخل 815112"
        - text: >
            «المقامُ: مَا يتَحَقَّق للْعَبد بمنازلته من الْأَدَب مِمَّا يتَوَصَّل
            إِلَيْهِ بِنَوْع تصرف»
          source: "مقاليد العلوم للسيوطي — المدخل 807632"
        - text: "«مَوْضِع القَدَمين / المجلس / الجماعة من الناس»"
          source: "المعجم الوسيط (ocr) — المدخل 24414"
      expands:
        - text: >
            «الْقَافُ وَالْوَاوُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدَهُمَا
            عَلَى جَمَاعَةِ نَاسٍ... وَالْآخَرُ عَلَى انْتِصَابٍ أَوْ عَزْمٍ»
          source: "مقاييس اللغة لابن فارس — جذر قوم (dictionary_id=151)"
          addition: >
            الأصل الثاني (الانتصاب = القيام في موضع) يُوضِّح أن المقام حرفيًّا هو «موضع
            القيام/الوقوف»، ثم امتدَّ مجازًا إلى «الموضع المُكتَسَب في مسار ما»


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "درجة"
      decision: confirmed
      decision_reason: >
        مُتواترة في المعاجم الكلاسيكية والحديثة بمعنى المنزلة/المرتبة في سُلَّم صاعد،
        وتظهر في القرآن الكريم بهذا المعنى. المعجم الكبير يُصرِّح بتطبيقها على السُّلَّم
        الوظيفي، ومصطلحات ARABTERM تُقابِلها بـdegree وstep وgrade في حقول متعددة.
        جذرها (درج = المضي التدريجي) ينسجم مع دلالة الموضع في تسلسل. تستحق التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز على الموضع في سُلَّم صاعد ذي مراحل متدرِّجة (كدرجات الحرارة، درجة الزاوية،
        الدرجة العلمية)؛ تنطوي على فكرة الترقي أو الانحدار خطوةً خطوة، وهي الأكثر استخدامًا
        في السياقات الكمِّية والرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَرَجَة"

    - lemma: "مرحلة"
      decision: confirmed
      decision_reason: >
        المعجم الكبير يُثبِت المعنى المجازي صراحةً: «القَدْرُ المُحَدَّد من الشيء، هذه
        مرحلةٌ أُولى من البَحْث أو المَشْروع»؛ وتُقابَل في ARABTERM بـstage وphase في
        مجالات متعددة. جذرها (رحل = المضي في سفر) يُعزِّز الاستعارة: المرحلة هي قطعة
        محدودة من مسار. تستحق التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز على القطعة المحدودة ذات البداية والنهاية في مسار أو عملية زمنية ممتدة
        (كمراحل مشروع، مراحل نموٍّ، مراحل مرض)؛ تنطوي على فكرة الانتقال من وضع إلى آخر
        وامتداد زمني نسبي، وهي الأنسب للسياقات الوصفية التي تبرز الحدَّيْن.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَرْحَلَة"

    - lemma: "مستوى"
      decision: confirmed
      decision_reason: >
        المعجم الكبير يُعرِّفه بـ«الدَّرَجة أو المكانة التى يكون عليها الشيءُ أو الشخص»
        مما يُطابق مفهوم المجموعة مطابقةً مباشرة. مصطلحات ARABTERM تُقابله بـlevel في
        مجالات تقنية عديدة. أصله الهندسي (السطح المستوي) يُعزِّز التحوُّل الاستعاري إلى
        «طابق أفقي في تدرُّج». يستحق التشكيل الكامل مع مراعاة حكم التنوين (مُسْتَوًى).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على الطابق الأفقي أو المعيار الذي تُقاس به الأشياء؛ يُستخدم للمقارنة بين
        أشياء وضعها واحد في سُلَّم ما (مستوى الكفاءة، مستوى الدخل، مستوى التعليم)، وينطوي
        على فكرة التساوي الأفقي أكثر من الارتقاء أو الانخفاض بخلاف «درجة» و«مرتبة».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَوًى"

    - lemma: "طَوْر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود الكلمة في المعاجم بمعنى «الحالة والتارة»، فإن التخصُّص المعجمي الحديث
        حصَرها في دلالة فيزيائية (طور المادة: صلب/سائل/غاز) وكهربائية (طور التيار)،
        مما يُقلِّص قابليتها للتمثيل العام لمفهوم المجموعة. وهي متداخلة مع «مرحلة» التي
        تؤدِّي الغرض ذاته بلا قيد تخصُّصي. الإضافة لن تُثري المجموعة بل ستُوقع اللبس.

    - lemma: "مَنْزِلَة"
      source: stage1
      decision: removed
      decision_reason: >
        المنزلة في الاستعمال المعاصر تُهيمن عليها دلالة المكانة الاجتماعية والشرف (prestige)
        بدلالة الشواهد: «له منزلة عند الأمير». هذا المعنى ينتمي إلى المستوى الهرمي
        الاجتماعي أكثر من معنى «موضع محايد في تسلسل». فضلًا عن ذلك، فإن «منزلة» تكاد
        تكون مرادفًا لـ«حَالَة» (الحُكمُ الأعلى في هذه المجموعة) أكثر من كونها مرادفًا
        لـ«درجة» و«مرحلة».

    - lemma: "مَرْتَبَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        الأدلة المعجمية تُثبِت المعنى بوجهين متكاملين: (أ) المعنى الرُّتَبي العام
        (الرُّتْبة = الموضع في ترتيب ما)، و(ب) المعنى الرياضي الدقيق (مرتبة الآحاد =
        موضع الرقم في نظام العقود)، وكلاهما تجسيد مثالي لمفهوم «موضع محدد قابل للتعيين
        في تسلسل منتظم». اشتقاقها من (رتب = داوم وثبت) يُضيف بُعد الاستقرار والثبات في
        الموضع. تُقابَل في ARABTERM بـrank وstatus وStrate. مصادرها موثوقة (الوسيط والكبير).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز على الموضع الثابت المُصنَّف في ترتيب رسمي أو هرمي (مرتبة عسكرية، مرتبة
        علمية، مرتبة الآحاد في الحساب)؛ تنطوي على فكرة الترتيب الرسمي المُحدَّد سلفًا
        بخلاف «مستوى» الذي يُركِّز على التساوي الأفقي و«درجة» الذي يُركِّز على الترقي.
      actions:
        - command: create_entry
          params:
            lemma: "مَرْتَبَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13962925-n"

    - lemma: "مَقَام"
      source: stage1
      decision: confirmed
      decision_reason: >
        الأدلة المعجمية استثنائية في قوتها: كشّاف اصطلاحات الفنون يُترجمه صراحةً بـ
        «Level, stage, position»؛ والتعريف الصوفي «ما يوصل إليه بنوع تصرف» يُطابق تمامًا
        ركيزة التعريف الإنجليزي «especially in a process». أصله (قام = انتصب في موضع)
        يمنحه دلالة «الموضع الذي يُقام فيه»، وهو تصوير حسي مباشر للمفهوم المجرد.
        وفيره في الشواهد الكلاسيكية والفصيحة (لكلِّ مقام مقال).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على الموضع المُكتَسَب المُحقَّق في مجرى عملية أو مسار (روحي، علمي، مهني)،
        وينطوي على فكرة الاستحقاق والإقامة في الموضع؛ يختلف عن «درجة» (الترقي الكمِّي)
        وعن «مرحلة» (القطعة الزمنية) وعن «مستوى» (الطابق الأفقي)، وهو الأنسب في السياقات
        التي تُبرز أن الوصول إلى هذا الموضع كان نتيجة مسار أو عملية.
      actions:
