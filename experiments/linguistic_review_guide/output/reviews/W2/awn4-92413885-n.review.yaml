# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-92413885-n
# المفهوم: مُجَمَّع نَقْدِيّ (monetary aggregate)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «مجمع نقدي» بلا تشكيل، ممّا يولّد لبساً بين المَجْمَع (مؤسّسة) والمُجَمَّع (حاصل التجميع)"
      - "التعريف يستخدم عبارة «نوع من مقاييس» وهي فضفاضة، ولا يذكر أمثلة المُجَمَّعات (م١، م٢، م٣)"
      - "المجموعة تحتوي لمّة واحدة فقط دون مرادفات"
    observations: >
      المفهوم اقتصادي تقني يشير إلى تصنيفات المعروض النقدي (M0, M1, M2, M3) التي تستخدمها البنوك المركزية لقياس حجم السيولة النقدية المتاحة في اقتصاد بلد ما.
      المصطلح مستقرّ في الأدبيات الاقتصادية العربية بصيغة «مُجَمَّع نَقْدِيّ» أو بالجمع «المُجَمَّعَات النَّقْدِيَّة».
      الفرنسية تستخدم «agrégat monétaire» والإنجليزية «monetary aggregate».
  blind_candidates:
    - lemma: "مُجَمَّع نَقْدِيّ"
      generation_method: tarkib
      justification: "مركب وصفيّ من «مُجَمَّع» (اسم مفعول من جَمَّعَ: ما جُمِع في فئة واحدة) و«نَقْدِيّ» (نسبة إلى النَّقْد). يوافق الترجمة المصطلحية المعتمدة لـ agrégat monétaire"
    - lemma: "كُتْلَة نَقْدِيَّة"
      generation_method: tarkib
      justification: "مركب وصفيّ شائع في الاقتصاد العربي المتأثّر بالفرنسية (masse monétaire)، لكنّه أقرب إلى مفهوم المعروض النقدي ذاته منه إلى مقياسه"
    - lemma: "حَصِيلَة نَقْدِيَّة"
      generation_method: tarkib
      justification: "مركب وصفيّ من «حَصِيلَة» (ما حصل وتجمّع) و«نَقْدِيَّة»، يُستعمل في سياق التحصيل المالي لكنّه لا يؤدّي دلالة المقياس الاقتصادي بدقّة"
    - lemma: "مِعْيَار نَقْدِيّ"
      generation_method: tarkib
      justification: "مركب وصفيّ من «مِعْيَار» (أداة القياس، وزن مِفْعال) و«نَقْدِيّ». يركّز على بُعد القياس في التعريف، لكنّه عامّ جدّاً ولا يفيد معنى التجميع"

stage2_evidence:
  per_lemma:
    - lemma: "مُجَمَّع نَقْدِيّ"
      confirm:
        - text: "«مَبْنَى أو مِساحةٌ عامّة, تَجمَّعت فيها أجهزةٌ, أو إداراتٌ مُتعلِّقة بغَرَضٍ واحدٍ»"
          source: "المعجم الكبير"
      expands:
        - text: "«عنصر إنشائي مجمع من عنصرين أو أكثر لتعمل بعضها مع بعض كعنصر واحد»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يبيّن دلالة التجميع في الصيغة الاصطلاحية: ضمّ أجزاء في وحدة واحدة"
        - text: "«مَوضِع الِاجْتِمَاع والمجتمعون والملتقى ومؤسسة للنهوض باللغة أَو الْعُلُوم أَو الْفُنُون»"
          source: "المعجم الوسيط (حوراماني)"
          addition: "المَجْمَع (بفتح الميم) يعني المؤسسة، أمّا المُجَمَّع (بفتح الميم وتشديد الميم الثانية) فيعني ما جُمِّع"

    - lemma: "كُتْلَة نَقْدِيَّة"
      confirm:
        - text: "«الكتلة النقدية (اد).»"
          source: "المورد الحديث (2008)"
        - text: "«monetary stock / masse monétaire»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "«الكتلة النقدية» تُترجم money supply أو monetary stock وليس monetary aggregate"
          source: "المورد الحديث (2008)"
          conflict: "الكتلة النقدية تعني المعروض النقدي ذاته (الكمّ الإجمالي)، لا مقياساً من مقاييسه"
      expands:
        - text: "«القِطْعة المجتمعة من الشَّيء الجماعة من الناس المتفقون على رأى واحد. (مج)»"
          source: "المعجم الوسيط"
          addition: "الكتلة في أصلها: القطعة المجتمعة، ومنها استُعيرت للفيزياء (mass) وللسياسة (bloc)"

    - lemma: "حَصِيلَة نَقْدِيَّة"
      contradicts:
        - text: "«الحصيل حصيلة الضرائب وحصيلة الأرباح: ما حصل منها البقيّة»"
          source: "المعجم الوسيط"
          conflict: "الحصيلة تعني ما تحصَّل فعلاً (إيراد/عائد)، لا مقياساً إحصائياً للنقد"
        - text: "«crop / yield / production»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "الترجمة الإنجليزية crop/yield تؤكّد دلالة العائد والمحصول لا المقياس"

    - lemma: "مِعْيَار نَقْدِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُجَمَّع نَقْدِيّ"
      decision: confirmed
      decision_reason: >
        اللمّة الموجودة «مجمع نقدي» صحيحة المفهوم لكنّها بلا تشكيل. الصيغة الصحيحة هي «مُجَمَّع نَقْدِيّ» (اسم مفعول من جَمَّعَ) وليس «مَجْمَع» (اسم مكان).
        المصطلح مستقرّ في الأدبيات الاقتصادية العربية ترجمةً لـ monetary aggregate / agrégat monétaire.
        وجمعه «مُجَمَّعَات نَقْدِيَّة» مطّرد ومستعمل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُجَمَّع نَقْدِيّ"

    - lemma: "كُتْلَة نَقْدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الكتلة النقدية (monetary stock / masse monétaire) تشير إلى المعروض النقدي ذاته —
        أي مجمل النقد المتاح في الاقتصاد — لا إلى مقياس من مقاييسه (M1, M2, M3).
        إدراجها هنا يخلط بين المقيس والمقياس.
      evidence_assessment:
        case: contradicts_only

    - lemma: "حَصِيلَة نَقْدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الحصيلة في المعاجم تعني ما تحصّل فعلاً (إيراد، عائد، محصول)،
        وليس فئة إحصائية لقياس النقد. لا شاهد على استعمالها في الاقتصاد النقدي بهذا المعنى.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مِعْيَار نَقْدِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية على استعمال «معيار نقدي» بمعنى monetary aggregate.
        المعيار يفيد أداة القياس أو المرجع، وهو أعمّ من المفهوم المطلوب ولا يتضمّن دلالة التجميع الإحصائي.
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "نوع من مقاييس المعروض النقدي لبلد ما"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي فضفاض ولا يوضّح طبيعة المُجَمَّع النقدي بوصفه فئة إحصائية
        تصنّف أنواع النقد حسب درجة سيولتها (مثل م١، م٢، م٣).
        كما يستخدم «نوع من» وهي صيغة ضعيفة معجمياً.
    authored:
      - type: terminological
        text: "فِئَةٌ إحصائيَّةٌ تُصنِّفُ المَعْروضَ النَّقْدِيَّ لِبَلَدٍ ما حَسَبَ دَرَجَةِ سُيولَتِهِ، كالنَّقْدِ المُتداوَلِ والوَدائعِ الجارِيَةِ والادِّخارِيَّةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مِقْياسٌ اقْتِصادِيٌّ تَعْتَمِدُهُ البُنوكُ المَرْكَزِيَّةُ لِتَحْدِيدِ حَجْمِ السُّيولَةِ النَّقْدِيَّةِ المُتاحَةِ في الاقْتِصادِ، ويُصنَّفُ في مُسْتَوَياتٍ مُتَدَرِّجَةٍ (م٠، م١، م٢، م٣) بِحَسَبِ قابِلِيَّةِ التَّحَوُّلِ إلى نَقْدٍ سائِلٍ"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "فِئَةٌ إحصائيَّةٌ تُصنِّفُ المَعْروضَ النَّقْدِيَّ لِبَلَدٍ ما حَسَبَ دَرَجَةِ سُيولَتِهِ، كالنَّقْدِ المُتداوَلِ والوَدائعِ الجارِيَةِ والادِّخارِيَّةِ"
  examples:
    per_lemma:
      - lemma: "مُجَمَّع نَقْدِيّ"
        examples:
          - text: "يُعَدُّ المُجَمَّعُ النَّقْدِيُّ م٢ مِنْ أَبْرَزِ المُؤَشِّراتِ الَّتي يَرْصُدُها البَنْكُ المَرْكَزِيُّ لِتَقْييمِ حَجْمِ السُّيولَةِ في الاقْتِصادِ"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ المُجَمَّعُ النَّقْدِيُّ م٢ مِنْ أَبْرَزِ المُؤَشِّراتِ الَّتي يَرْصُدُها البَنْكُ المَرْكَزِيُّ لِتَقْييمِ حَجْمِ السُّيولَةِ في الاقْتِصادِ"

