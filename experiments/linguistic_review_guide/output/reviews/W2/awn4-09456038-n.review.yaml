      justification: "لفظ تراثي يدل على الماء قليل العمق اسماً وصفة."
    - lemma: "مَضْحَل"
      source_section: "step4_fts_keyword"
      evidence_citation: "«المَضْحَلُ: مكانٌ يَقِلُّ فيه الماء من الضَّحْل» — لسان العرب"
