      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غِشَاءٌ صَابُونِيّ"
    - lemma: "غِشَاءٌ صَابُونِيّ"
      source: stage1
      decision: removed
      decision_reason: "مكرر؛ تم اعتماده بتعديل اللمة الأصلية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
    - lemma: "طَبَقَةٌ صَابُونِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق وطبيعي يعبر عن المفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
