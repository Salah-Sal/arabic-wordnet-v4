      decision_reason: "أقل شيوعاً من غشاء وطبقة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
    - lemma: "بَقَايَا الصَّابُونِ"
      source: stage1
      decision: removed
      decision_reason: "عبارة حرة أكثر من كونها مصطلحاً مستقراً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true

stage4_content:
  definition:
    current: "غشاء يترك على الأشياء بعد غسلها بالصابون"
    assessment:
      decision: revise
      reason: "تطوير الصياغة لتصبح أدق وأقرب لأسلوب المعاجم."
    authored:
      - type: terminological
        text: "طَبَقَةٌ رَقِيقَةٌ مِنَ الصَّابُونِ تَبْقَى عَالِقَةً عَلَى الْأَشْيَاءِ بَعْدَ غَسْلِهَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "طَبَقَةٌ رَقِيقَةٌ مِنَ الصَّابُونِ تَبْقَى عَالِقَةً عَلَى الْأَشْيَاءِ بَعْدَ غَسْلِهَا."
  examples:
    per_lemma:
      - lemma: "غِشَاءٌ صَابُونِيّ"
        examples:
          - text: "تَرَكَ الْغَسِيلُ غِشَاءً صَابُونِيًّا عَلَى الزُّجَاجِ بَعْدَ جَفَافِهِ."
            type: usage
      - lemma: "طَبَقَةٌ صَابُونِيَّة"
        examples:
          - text: "يُفَضَّلُ شَطْفُ الْأَوَانِي جَيِّدًا لِإِزَالَةِ أَيِّ طَبَقَةٍ صَابُونِيَّةٍ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَرَكَ الْغَسِيلُ غِشَاءً صَابُونِيًّا عَلَى الزُّجَاجِ بَعْدَ جَفَافِهِ."
