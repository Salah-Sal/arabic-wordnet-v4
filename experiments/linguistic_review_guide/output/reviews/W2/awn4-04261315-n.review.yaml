stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يحتاج لضبط وصياغة معجمية أمتن."
      - "المصطلح الموجود يفتقر للتشكيل الدقيق."
    observations: "المفهوم يشير إلى الطبقة الرقيقة أو الأثر الذي يتركه الصابون بعد الغسيل. الترجمة (غشاء صابوني) صحيحة كمركب وصفي، ولكن قد يعبر عنه أيضا بـ(طبقة صابونية)."
  blind_candidates:
    - lemma: "غِشَاءٌ صَابُونِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر مباشرة عن المعنى (غشاء من الصابون)."
    - lemma: "طَبَقَةٌ صَابُونِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي شائع في الاستعمال للإشارة إلى الأثر المتبقي على السطوح."
    - lemma: "رُسَابَةُ الصَّابُونِ"
      generation_method: tarkib
      justification: "مركب إضافي يشير إلى ما يرسب أو يتبقى من الصابون."
    - lemma: "بَقَايَا الصَّابُونِ"
      generation_method: tarkib
      justification: "مركب إضافي مفهوم ومباشر يعبر عن الأثر المتخلف."

