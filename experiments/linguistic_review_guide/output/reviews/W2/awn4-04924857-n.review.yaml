# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'تباين الخواص' مكتوبة بدون تشكيل"
      - "التعريف العربي الحالي دائري: يستخدم 'متباين الخواص' وهو عين المفهوم المُعرَّف"
      - "المجموعة تقتصر على لمّة واحدة رغم تعدد المصطلحات العربية الراسخة لهذا المفهوم"
    observations: >-
      المجموعة تصف مفهوم اللاتناظر الاتجاهي (anisotropy)، وهو مفهوم علمي دقيق يعني
      أن خصائص المادة الفيزيائية — كالصلابة والتوصيلية والانكسار — تختلف باختلاف الاتجاه
      الذي تُقاس فيه. المفهوم يندرج ضمن الفيزياء والجيولوجيا والمواد. اللمّة الحالية
      "تباين الخواص" جيدة لغويًا وهي تركيب إضافي من جذرَي "بين" و"خصص"، غير أن
      التعريف يحتاج إصلاحاً لتجنّب الدوران، كما ينبغي البحث عن مرادفات راسخة لإثراء المجموعة.

  blind_candidates:
    - lemma: "لاتَمَاثُلِيَّة"
      generation_method: ishtiqaq
      justification: >-
        من الجذر "مثل" على مصدر التفاعل "تماثل" مضافًا إليه النفي "لا" والمصدر
        الصناعي "ية"، بمعنى انعدام التماثل بين الاتجاهات. الوزن "لا + مصدر تفاعل + ية"
        منتج في المصطلحية العلمية العربية الحديثة.

    - lemma: "التَّفَاوُتُ الْمَحُورِيّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي: "التفاوت" من جذر "فوت" على وزن تَفَاعُل بمعنى التباين والاختلاف،
        موصوفًا بـ"المحوري" نسبةً إلى المحاور الفيزيائية التي يُقاس على أساسها هذا
        الاختلاف في الخواص.

    - lemma: "لاتَكَافُؤِيَّة"
      generation_method: ishtiqaq
      justification: >-
        من "تكافؤ" (parity/equivalence) مع النفي "لا" والمصدر الصناعي "ية"، يدل على
        انعدام التكافؤ بين القيم المقاسة في اتجاهات مختلفة، إذ ترتكز الخاصية على
        عدم تساوي القيم في الاتجاهات.

    - lemma: "أنيزوتروبيا"
      generation_method: taarib
      justification: >-
        تعريب من اليونانية عبر الإنجليزية anisotropy (an- نفي + isos متساوٍ + tropos
        اتجاه). يُلجأ إليه ملاذًا أخيرًا إذا ثبت أن المصطلحات العربية المشتقة غير
        متداولة في الأدبيات التخصصية.


