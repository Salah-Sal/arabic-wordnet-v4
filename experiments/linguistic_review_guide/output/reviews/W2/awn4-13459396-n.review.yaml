# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13459396-n (Bessemer process)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «عملية بسمر» خالية من التشكيل"
      - "المفهوم مسمّى بعلم أجنبي (هنري بِسِمِر) مما يحدّ من خيارات التوليد الاشتقاقي"
      - "التعريف العربي ترجمة شبه حرفية عن الإنجليزية"
    observations: >-
      المجموعة تصف عملية صناعية تاريخية لتحويل الحديد المنصهر إلى فولاذ عبر نفخ الهواء فيه
      لحرق الكربون الزائد، وهي منسوبة إلى المخترع البريطاني هنري بسمر. المفهوم تقني تخصصي
      ومعروف في أدبيات علم المعادن والهندسة. الخيارات المعجمية محدودة لأن الاسم علم أجنبي
      لا جذر عربي له، فيغلب عليه التركيب الإضافي أو التعريب.
  blind_candidates:
    - lemma: "بَسْمَرَة"
      generation_method: taarib
      justification: >-
        تعريب اسم بِسِمِر على وزن فَعْلَلَة الذي يدل على العملية والحدث،
        نحو: دَقْرَطَة (من ديمقراطية)، أَمْرَكَة (من أمريكا). يصلح مصطلحاً
        مختصراً للعملية دون الحاجة إلى مركّب إضافي.
    - lemma: "طَرِيقَة بِسِمِر"
      generation_method: tarkib
      justification: >-
        مركب إضافي من «طريقة» (وهي الجنس القريب: منهج مُحدَّد لإنجاز غرض صناعي)
        و«بسمر» (العلم المنسوب إليه). يوازي «عملية بسمر» مع فرق دلالي دقيق:
        الطريقة تؤكد المنهج، والعملية تؤكد مراحل التنفيذ.
    - lemma: "تَحْوِيلُ بِسِمِر"
      generation_method: tarkib
      justification: >-
        مركب إضافي يعكس الوظيفة الجوهرية للعملية وهي تحويل الحديد إلى فولاذ.
        «تحويل» مصدر الفعل حوَّل على وزن تَفْعِيل، شائع في المصطلحية الصناعية.
    - lemma: "نَفْخُ بِسِمِر"
      generation_method: tarkib
      justification: >-
        مركب إضافي مجازي: يُسمّي العملية بأبرز خطواتها وهي نفخ الهواء عبر الحديد
        المنصهر. «نفخ» مصدر ثلاثي فصيح. لكنه أضيق دلالياً من المطلوب
        إذ يُسمّي الخطوة لا العملية الكاملة.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "عَمَلِيَّة بِسِمِر"
      confirm:
        - text: "«عملية بسمر — Bessemer process; Bessemer converter»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — أربتيرم"
      expands:
        - text: "«فولاذ بسمر — bessemer steel»"
          source: "المعجم الموحد لمصطلحات النفط (1999) — أربتيرم"
          addition: "يُثبت أن تركيب «بسمر» مع ألفاظ صناعة الفولاذ مستعمل ومعجَم"
    - lemma: "بَسْمَرَة"
      evidence_status: "no_material_found"
    - lemma: "طَرِيقَة بِسِمِر"
      evidence_status: "no_material_found"
    - lemma: "تَحْوِيلُ بِسِمِر"
      evidence_status: "no_material_found"
    - lemma: "نَفْخُ بِسِمِر"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "عَمَلِيَّة بِسِمِر"
      decision: confirmed
      decision_reason: >-
        اللمّة موثّقة في المعجم الموحد لمصطلحات الكيمياء (أربتيرم 1992) بوصفها
        المقابل العربي لـ Bessemer process. المركب الإضافي واضح البنية: الجنس
        «عملية» + العلم المنسوب إليه «بسمر»، وهو النمط السائد في تسمية العمليات
        الصناعية المنسوبة إلى أعلام (نحو: عملية هابر، عملية أوستوالد).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح المعجَم الوحيد لهذا المفهوم؛ لا مزاحم له في المجموعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَمَلِيَّة بِسِمِر"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بَسْمَرَة"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم انتظام الصيغة على وزن فَعْلَلَة (المناسب للعمليات)، لا يوجد أي شاهد
        معجمي أو استعمال مُوثَّق لهذا اللفظ. كما أن العلم الأجنبي «بسمر» (Bessemer)
        ليس جذراً عربياً حقيقياً، فاشتقاق فَعْلَلَة منه تصرّف غير مسبوق في المعاجم
        التقنية المعتمدة. يبقى «عملية بسمر» أوضح وأثبت.

    - lemma: "طَرِيقَة بِسِمِر"
      source: stage1
      decision: removed
      decision_reason: >-
        مركب إضافي صحيح بنيوياً لكنه لم يُعجَم في أي مصدر مرجعي. «طريقة» أعمّ
        من «عملية» في السياق الصناعي؛ والمعجم الموحد اختار «عملية» وهو الأدق
        لأن المفهوم سلسلة خطوات تنفيذية لا مجرد منهج نظري.

    - lemma: "تَحْوِيلُ بِسِمِر"
      source: stage1
      decision: removed
      decision_reason: >-
        «تحويل بسمر» يوحي بتحويل المادة لا بالعملية الصناعية المتكاملة. كما أن
        مصطلح «محوِّل بسمر» (Bessemer converter) يشير إلى الجهاز لا العملية،
        فاستعمال «تحويل» يُحدث التباساً بين العملية والجهاز.

    - lemma: "نَفْخُ بِسِمِر"
      source: stage1
      decision: removed
      decision_reason: >-
        يُسمّي العملية بإحدى خطواتها فقط (نفخ الهواء)، فلا يشمل مراحل الحرق
        وإزالة الشوائب والتبريد. مصطلح أضيق من المطلوب ولا شاهد معجمي عليه.

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "عملية صناعية لصنع الفولاذ باستخدام محول بسمر لضخ الهواء عبر الحديد المنصهر وبالتالي حرق الكربون الزائد والشوائب؛ وهي أول طريقة ناجحة لصنع الفولاذ بكميات كبيرة وبتكلفة منخفضة"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي وافٍ في مضمونه لكنه ترجمة شبه حرفية عن الإنجليزية.
        يحتاج إلى: (أ) صياغة أعرب أسلوباً، (ب) إضافة النسبة إلى هنري بسمر،
        (ج) تقديم الجنس القريب بوضوح.
    authored:
      - type: terminological
        text: >-
          طريقة صناعية لإنتاج الفولاذ ابتكرها هنري بِسِمِر عام 1856م، يُنفَخ فيها
          الهواء عبر الحديد المنصهر في وعاء يُعرف بمحوِّل بِسِمِر، فيحترق ما فيه
          من كربون زائد وشوائب، وتُعدّ أول طريقة أتاحت إنتاج الفولاذ بكمّيات كبيرة
          وبتكلفة منخفضة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          عملية صناعية تاريخية لإنتاج الفولاذ، نُسبت إلى المهندس البريطاني هنري
          بِسِمِر (1813–1898م) الذي حصل على براءة اختراعها عام 1856م. تقوم على
          ضخّ تيار من الهواء عبر الحديد الخام المنصهر داخل وعاء مخروطي (المحوِّل)
          فيتأكسد الكربون الزائد والشوائب (كالسيليكون والمنغنيز) وتخرج على هيئة
          غازات أو خَبَث. أحدثت هذه الطريقة ثورة في صناعة الحديد والصلب إذ خفّضت
          تكلفة الإنتاج وسرّعته، وظلّت سائدة حتى حلّت محلّها طريقة الأكسجين القاعدي
          في منتصف القرن العشرين.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >-
            طريقة صناعية لإنتاج الفولاذ ابتكرها هنري بِسِمِر عام 1856م، يُنفَخ فيها
            الهواء عبر الحديد المنصهر في وعاء يُعرف بمحوِّل بِسِمِر، فيحترق ما فيه
            من كربون زائد وشوائب، وتُعدّ أول طريقة أتاحت إنتاج الفولاذ بكمّيات كبيرة
            وبتكلفة منخفضة.

  examples:
    per_lemma:
      - lemma: "عَمَلِيَّة بِسِمِر"
        examples:
          - text: >-
              أسهمت عملية بِسِمِر في تحويل صناعة الحديد والصلب خلال النصف الثاني
              من القرن التاسع عشر، إذ أتاحت إنتاج قضبان الفولاذ اللازمة لمدّ شبكات
              السكك الحديدية بأسعار لم تكن ممكنة من قبل.
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: >-
            أسهمت عملية بِسِمِر في تحويل صناعة الحديد والصلب خلال النصف الثاني
            من القرن التاسع عشر، إذ أتاحت إنتاج قضبان الفولاذ اللازمة لمدّ شبكات
            السكك الحديدية بأسعار لم تكن ممكنة من قبل.

