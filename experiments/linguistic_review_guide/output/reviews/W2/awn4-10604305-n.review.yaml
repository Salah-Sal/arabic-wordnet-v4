# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10604305-n (sex object)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الأولى «أَدَاة لِلْمُتْعَة الْجِنْسِيَّة» عبارة وصفية حرّة وليست وحدة معجمية ثابتة؛ يمكن إبدال «أداة» بـ«وسيلة» فتبقى العبارة صالحة"
      - "اللمّة الثانية «مَوْضُوع جِنْسِيّ» ترجمة حرفية (calque) للمصطلح الإنجليزي sex object، إذ «موضوع» في العربية تدلّ على الذات المحكوم عليها منطقياً أو على الفكرة/المحور لا على الشيء المُستعمَل"
      - "الرابط بأب المجموعة (عامل/فاعل = agent) مُشكِل دلالياً، فالمفهوم يصف شخصاً مُنفعِلاً (مفعول) لا فاعلاً"
      - "المفهوم غربي اجتماعي يفتقر إلى مصطلح عربي مسكوك في المعجمات التراثية"
    observations: "المفهوم ينتمي إلى علم الاجتماع النسوي الحديث ويعني تحويل الإنسان إلى مجرّد وعاء للإشباع الجنسي (تشييء). لا يوجد له مقابل عربي تراثي واحد مسكوك، بل يُعبَّر عنه عادةً بعبارات وصفية. المصطلح الأقرب في الاستعمال المعاصر هو «مَوْضُوع جِنْسِيّ» رغم كونه ترجمة حرفية."
  blind_candidates:
    - lemma: "مُتَاعٌ جِنْسِيّ"
      generation_method: majaz
      justification: "مجاز من «المتاع» بمعنى السلعة والمِلك الذي يُنتفَع به مؤقتاً، فيُنقَل إلى الشخص الذي يُعامَل معاملة الشيء المُستهلَك جنسياً. جذر م ت ع يدلّ على المنفعة وامتداد المدة في خير عند ابن فارس."
    - lemma: "أُلْعُوبَة جِنْسِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «ألعوبة» (اللعبة، ما يُلعَب به) و«جنسية». الألعوبة مسجّلة في المعجم الوسيط بمعنى اللعبة، فيُنقَل مجازاً إلى الشخص المُتلاعَب به جنسياً."
    - lemma: "غَرَضٌ جِنْسِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «غرض» (الهدف الذي يُرمى فيه) و«جنسي»، على مجاز إطلاق الهدف على الشخص المُستهدَف بالرغبة الجنسية."
    - lemma: "شَيْءٌ جِنْسِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «شيء» (ما يصحّ أن يُعلَم ويُحكَم عليه) و«جنسي»، مقابل مباشر لـ sex object بترجمة «شيء = object»."

stage2_evidence:
  per_lemma:
    - lemma: "أَدَاة لِلْمُتْعَة الْجِنْسِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مَوْضُوع جِنْسِيّ"
      expands:
        - text: "«المَوْضُوع root=وضع, translation_en=object — كِيان معطيات مُحدث تحت برنامج ومُنَقّل أو منسوخ نحو برنامج آخر»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "يؤكّد استعمال «موضوع» بمعنى object في المصطلحات الحديثة"
        - text: "«الموضوع: محل العرض المختص به»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يبيّن أنّ الموضوع في الاصطلاح القديم هو المحلّ الذي يُحكَم عليه، لا الشيء المادي"
        - text: "«الموضوعُ: هُوَ الشَّيْء الْمَحْكُوم عَلَيْهِ فِي الْقَضِيَّة»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "المعنى المنطقي: ذات القضية المحكوم عليها"

    - lemma: "مُتَاعٌ جِنْسِيّ"
      expands:
        - text: "«المتاع: لغة: كل ما ينتفع به، وأصله ما يتبلغ به من الزاد. ومنه متعة الطلاق، ونكاح المتعة: وهو الموقت في العقد»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يدعم الإزاحة الدلالية من المنفعة المادية إلى الشخص المُنتفَع به جنسياً"
        - text: "«المَتَاع: هو كل ما يُنْتَفع به من عروض الدنيا قليلِها وكثيرها فيكون ما سوى الحجزين متاعاً، وعرفاً: هو كل ما يَلْبَسه الناسُ ويبسطه»"
          source: "التعريفات الفقهية للبركتي"
          addition: "يوسّع المعنى ليشمل كلّ ما يُنتفَع به من متاع الدنيا"
        - text: "«(مَتَعَ) الْمِيمُ وَالتَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَنْفَعَةٍ وَامْتِدَادِ مُدَّةٍ فِي خَيْرٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على المنفعة والتلذذ المؤقت"

    - lemma: "أُلْعُوبَة جِنْسِيَّة"
      confirm:
        - text: "«(الألعوبة) اللعبة يُقَال بَينهم ألعوبة وَهَذِه ألعوبة حَسَنَة (ج) ألاعيب»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(لَعِبَ) اللَّامُ وَالْعَيْنُ وَالْبَاءُ كَلِمَتَانِ [...] إِحْدَاهُمَا اللَّعِبُ مَعْرُوفٌ. [...] وَقِيلَ: إِنَّ أَصْلَ الْبَابِ هُوَ الذَّهَابُ عَلَى غَيْرِ اسْتِقَامَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على العبث وعدم الاستقامة، مما يناسب مفهوم التلاعب بالشخص"

    - lemma: "غَرَضٌ جِنْسِيّ"
      contradicts:
        - text: "«الغرض: الهدف المقصود بالرمي، ثم جعل اسما لكل غاية يتحرى إدراكها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الغرض يدلّ على الهدف والغاية لا على الشخص المُشيَّأ؛ الفارق بين الهدف المعنوي والشيء المادي"
      expands:
        - text: "«(غَرَضَ) الْغَيْنُ وَالرَّاءُ وَالضَّادُ مِنَ الْأَبْوَابِ الَّتِي لَمْ تُوضَعْ عَلَى قِيَاسٍ وَاحِدٍ، وَكَلِمُهُ مُتَبَايِنَةُ الْأُصُولِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يرى أنّ الجذر غير منتظم القياس، مما يضعف قدرته على الاشتقاق المنتج"

    - lemma: "شَيْءٌ جِنْسِيّ"
      expands:
        - text: "«الشَّيْءُ: مَا يجوز أَن يخبر عَنهُ، وَتَصِح الدّلَالَة عَلَيْهِ»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "الشيء مفهوم فلسفي عام جداً يشمل كلّ موجود ومعدوم"
        - text: "«تشييء — translation_en: chosification»"
          source: "مسرد الفلسفة وعلم النفس (ALECSO/ArabTerm)"
          addition: "وجود مصطلح «تشييء» كمصدر يدلّ على أنّ المفعول «مُشَيَّأ» قابل للاستعمال"

stage3_analysis:
  per_lemma:
    - lemma: "أَدَاة لِلْمُتْعَة الْجِنْسِيَّة"
      decision: removed
      decision_reason: "عبارة وصفية حرّة تفشل في اختبار السكّ (يمكن إبدال «أداة» بـ«وسيلة» أو «أداة» بـ«أداة»+«لإشباع» فتبقى وصفاً صالحاً). كما أنها تصف الوظيفة لا الشخص المُشيَّأ. لا أدلة معجمية على تداولها كوحدة اصطلاحية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مَوْضُوعٌ جِنْسِيّ"
      decision: confirmed
      decision_reason: "ترجمة حرفية (calque) لـ sex object شائعة في الخطاب الإعلامي والاجتماعي العربي المعاصر. رغم أنّ «موضوع» أصلها في المنطق والفلسفة (= subject)، فقد استُعملت بمعنى object في المصطلحات التقنية الحديثة. المركّب مفهوم للقارئ العربي المعاصر."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "مصطلح حياديّ الإيحاء نسبياً، يصف الشخص بوصفه «موضوعاً» (object) للرغبة الجنسية دون تحميل إضافي بالازدراء أو التسليع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْضُوعٌ جِنْسِيّ"

    - lemma: "مُتَاعٌ جِنْسِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم غنى جذر م ت ع بدلالات المنفعة والتلذذ، فإنّ المركّب «متاع جنسي» غير مسجّل في أيّ معجم ولا مستعمل في الخطاب المعاصر. كما أنّ «المتاع» يحيل في السياق الفقهي إلى نكاح المتعة مما يُحدث لبساً."

    - lemma: "أُلْعُوبَة جِنْسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "«الألعوبة» مسجّلة في المعجم الوسيط بمعنى اللعبة، لكن المركّب «ألعوبة جنسية» غير مسكوك معجمياً. كما أنه يحمل شحنة ازدرائية أقوى من المفهوم المحايد sex object، ويقترب من معنى sexual plaything وهو مفهوم مختلف."

    - lemma: "غَرَضٌ جِنْسِيّ"
      source: stage1
      decision: removed
      decision_reason: "«الغرض» يدلّ على الهدف والغاية المجردة لا على الشخص المُحوَّل إلى شيء. الجذر غير منتظم القياس كما نبّه ابن فارس، والمركّب غير مسجّل ولا متداول."

    - lemma: "شَيْءٌ جِنْسِيّ"
      source: stage1
      decision: removed
      decision_reason: "«شيء» مفرط العمومية الفلسفية. ورغم وجود المصطلح «تشييء» (chosification/objectification) في معجم الفلسفة، فإنّ المركّب «شيء جنسي» يبدو سطحياً وغير مسكوك. الأولى استعمال «موضوع» التي رسخت كمقابل لـ object."

