  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "صِلَة الرَّحِم"
      contradicts:
        - text: "«صِلَة الرَّحِمِ: مُشَارَكَةُ ذَوِي الْقَرَابَةِ فِي الْخَيْرَاتِ، ذَكَرَهُ الْعَضُدُ.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            التعريف يدل على معنى فعلي/أخلاقي (أداء الواجب وصون الروابط مع الأقارب)،
            لا على المعنى الوصفي/البيولوجي المحايد (حالة الارتباط بالدم). يتعلق بمجال
            الفقه والأخلاق الإسلامية، وليس بمجال الأنثروبولوجيا الوصفية.
      expands:
        - text: >
            «فُلَانٌ ذُو قَرَابَتِي، وَهُوَ مَنْ يَقْرُبُ مِنْكَ رَحِمًا.
            وَالْقُرْبَةُ وَالْقُرْبَى: الْقَرَابَةُ.»
          source: "مقاييس اللغة لابن فارس — مادة قَرَبَ"
          addition: >
            يُبيّن أن «الرَّحِم» يُستعمل في الأصل لفظاً للدلالة على الاتصال بالقرابة
            من حيث المنشأ، غير أن «صِلَة الرَّحِم» كمركب اصطلاحي ثابت انتقل دلالياً
            إلى المعنى الأخلاقي/الفعلي بعيداً عن الوصف البيولوجي المحايد.

    # ── لمّة موجودة ٢ ──
    - lemma: "قَرَابَة الدَّم"
      confirm:
        - text: "«قرابة الدم» — translation_en: consanguinity"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)، ALECSO ARABTERM"
        - text: "«قَرَابَةُ دَمٍ أَوْ عَصَبٍ»، في تعريف: «مِنْ دَمٍ أَوْ أَصْلٍ وَاحِدٍ.»"
          source: "المورد الحديث (2008)"
        - text: >
            «الْقَافُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الْبُعْدِ...
            فُلَانٌ ذُو قَرَابَتِي، وَهُوَ مَنْ يَقْرُبُ مِنْكَ رَحِمًا.»
          source: "مقاييس اللغة لابن فارس — مادة قَرَبَ"
        - text: "«القَرَابَةُ: الدُّنُوُّ فى النسب»"
          source: "المعجم الوسيط (OCR)"
        - text: "«القَرابة: القُرب في الرحم»"
          source: "التعريفات الفقهية للبركتي"

    # ── مرشح المرحلة ١ أ ──
    - lemma: "نَسَبُ الدَّم"
      expands:
        - text: >
            «(نَسَبَ) النُّونُ وَالسِّينُ وَالْبَاءُ كَلِمَةٌ وَاحِدَةٌ قِيَاسُهَا اتِّصَالُ شَيْءٍ
            بِشَيْءٍ. مِنْهُ النَّسَبُ، سُمِّيَ لِاتِّصَالِهِ وَلِلِاتِّصَالِ بِهِ.»
          source: "مقاييس اللغة لابن فارس — مادة نَسَبَ"
          addition: >
            يؤكد أن جذر النسب يدل على الاتصال، وهو قريب دلالياً من المطلوب. لكن
            «نسب الدم» كمركب لم يُعثر عليه مُسجَّلاً في المعاجم الاصطلاحية كمقابل
            لـ consanguinity.
        - text: >
            «(نَسَب صريح أو خالص: قرابة من جهة الأبوين)»
          source: "المورد الحديث (2008)"
          addition: "يُشير إلى استخدام «نسب» في وصف القرابة الدموية المباشرة من الجهتين."

    # ── مرشح المرحلة ١ ب ──
    - lemma: "الدَّمَوِيَّة"
      contradicts:
        - text: >
            «دَمَوِيَّة: نباتات معمرة من فصيلة الخشخاشية، تنمو في أمريكا الشمالية...
            سميت كذلك لأن نُسْغها لونه أحمر يشبه الدم.»
            translation_en: sanguinaria
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، ALECSO ARABTERM"
          conflict: >
            «دَمَوِيَّة» مُسجَّل في المعاجم الاصطلاحية الموحدة اسماً لجنس نباتي
            (Sanguinaria) من الفصيلة الخشخاشية. استخدامه للدلالة على «حالة القرابة
            الدموية» يُوقع في تعارض اصطلاحي حاد.
        - text: >
            «دموية: جنس نبات أمريكي من الفصيلة الخشخاشية.»
            translation_en: blood-root
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)، ALECSO ARABTERM"
          conflict: "تكرار التعارض الاصطلاحي ذاته في معجم آخر."

    # ── مرشح المرحلة ١ ج ──
    - lemma: "رَحِمِيَّة"
      expands:
        - text: "«رَحْمِيَّة: من (ر ح م) مؤنث رَحْمِي.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            الصيغة موجودة لغوياً بوصفها نسبة مؤنثة، لكنها في الموسوعة اسم علم لا
            مصطلح تقني. لم يُعثر على توثيق لها بمعنى «حالة القرابة الدموية».
        - text: >
            «(رَحِمَ) الرَّاءُ وَالْحَاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الرِّقَّةِ وَالْعَطْفِ
            وَالرَّأْفَةِ... وَالرَّحِمُ: عَلَاقَةُ الْقَرَابَةِ، ثُمَّ سُمِّيَتْ رَحِمُ الْأُنْثَى رَحِمًا
            مِنْ هَذَا.»
          source: "مقاييس اللغة لابن فارس — مادة رَحِمَ"
          addition: >
            يُثبت أن أصل «الرَّحِم» هو الرقة والعطف وأن تسمية القرابة بالرحم جاء
            ثانياً. الجذر صالح للاشتقاق لكن الصيغة المولَّدة (رَحِمِيَّة) لم تُسجَّل
            اصطلاحياً في هذا المعنى.

    # ── مرشح المرحلة ١ د ──
    - lemma: "الوِلادِيَّة"
      evidence_status: "no_material_found"

    # ── لمّة مكتشفة من الأدلة ──
    - lemma: "صِلَة الدَّم"
      confirm:
        - text: >
            «صِلَة الدَّم: القرابة بين من يجمعهم أصل وراثي واحد.»
            translation_en: consanguinity
          source: "معجم المصطلحات الطبية (ج.1، 1985)، ARABTERM"
        - text: >
            «(وَصَلَ) الْوَاوُ وَالصَّادُ وَاللَّامُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ضَمِّ شَيْءٍ إِلَى
            شَيْءٍ حَتَّى يَعْلَقَهُ.»
          source: "مقاييس اللغة لابن فارس — مادة وَصَلَ"
          addition: >
            يُثبت أن «الصِّلَة» (من وَصَلَ) تدل على ضمّ وإلصاق، وهو مناسب للتعبير
            عن الاتصال الدموي العضوي بين الأفراد.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "صِلَة الرَّحِم"
      decision: removed
      decision_reason: >
        «صِلَة الرَّحِم» مصطلح فقهي إسلامي يدل على الواجب الأخلاقي والديني بالإبقاء
        على الروابط مع الأقارب وإسداء الخير إليهم. التعريف المعجمي المُوثَّق «مشاركة
        ذوي القرابة في الخيرات» يكشف أنه يصف فعلاً إرادياً لا حالة بيولوجية. في حين
        أن consanguinity هو وصف محايد لحالة وراثية-بيولوجية تعني الانحدار من أصل
        دموي مشترك، بصرف النظر عن أي التزام أخلاقي. ربط الاثنين يخلط بين مجالين
        دلاليين مختلفين ويُوقع المستخدم في سوء فهم مفهومي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      borrowing_check:
        verdict: native_arabic
        note: >
          الصيغة عربية أصيلة لكنها اصطلاح ديني مغلق الدلالة، لا تُوظَّف
          اصطلاحياً لـconsanguinity في المعاجم الأنثروبولوجية.
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة ٢ ──
    - lemma: "قَرَابَة الدَّم"
      decision: confirmed
      decision_reason: >
        موثَّق في المعجم الموحد لمصطلحات علم الصحة (1992) مقابلاً مباشراً لـconsanguinity،
        وفي المورد الحديث بوصف «قرابة دم أو عصب». الجذر «قرب» يدل عند ابن فارس على
        «خلاف البُعد»، والمعجم الوسيط يُعرِّف القرابة بـ«الدنو في النسب». التركيب
        الإضافي «قرابة + الدم» يُقيّد القرابة المطلقة بمصدرها الدموي، مما يجعله دقيقاً
        ومناسباً للمفهوم الأنثروبولوجي المحايد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      borrowing_check:
        verdict: native_arabic
        note: كلا المكوِّنين عربيان أصيلان.
      morphological_fit:
        verdict: suitable
        note: >
          «قَرَابَة» مصدر على فَعَالَة من الثلاثي «قَرُبَ»، وهو الوزن المعتاد للحالة
          والصفة. إضافته لـ«الدم» تُشكّل تركيباً إضافياً ثابتاً.
      nuance_differentiation: >
        يُركّز على بُعد القُرْب والتقارُب في النسب من جهة الدم، مقابل «صِلَة الدَّم»
        التي تُركّز على الرابطة والاتصال. «قَرَابَة الدَّم» أشيع استخداماً في السياقات
        القانونية والطبية والأنثروبولوجية في المعاجم الحديثة.

    # ── مرشح المرحلة ١ أ ──
    - lemma: "نَسَبُ الدَّم"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على «نسب الدم» مصطلحاً مُسجَّلاً في المعاجم الاصطلاحية مقابلاً
        لـconsanguinity، في حين أن «قَرَابَة الدَّم» موثَّقة بهذا المعنى. إضافةً إلى ذلك،
        «النَّسَب» في المعجمية العربية قد يُفيد الانتساب الأبوي الخاص دون أن يشمل
        القرابة الأُمية بالضرورة، مما يجعله أضيق من consanguinity الذي يشمل الانحدار
        من الأبوين.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١ ب ──
    - lemma: "الدَّمَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مُسجَّل في المعاجم الاصطلاحية الموحدة (ARABTERM) اسماً علمياً لجنس نباتي
        (Sanguinaria / blood-root) من الفصيلة الخشخاشية. استخدامه للدلالة على
        «حالة القرابة الدموية» يُوقع في تعارض اصطلاحي حاد ويفتقر إلى أي توثيق
        بالمعنى المطلوب.
      evidence_assessment:
        case: contradicts_only

    # ── مرشح المرحلة ١ ج ──
    - lemma: "رَحِمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُسجَّل «رَحِمِيَّة» مصطلحاً اصطلاحياً بمعنى القرابة الدموية، بل وردت
        فقط بوصفها صفة منسوبة (مؤنث رَحْمِيّ) في سياقات أسماء الأعلام. فضلاً عن
        ذلك، فإن الاشتقاق من «الرَّحِم» قد يُوهم بالاقتصار على القرابة الأمومية
        (رحم الأم) دون القرابة الأبوية، خلافاً لـconsanguinity الذي يشمل كلاهما.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١ د ──
    - lemma: "الوِلادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي توثيق معجمي للمصطلح بهذا المعنى. يُضاف إلى ذلك أن
        «الولادة» تحيل إلى حدث الميلاد (event of birth) لا إلى حالة القرابة
        الدموية (state of blood relationship)، مما يجعل دلالته قاصرة.
      evidence_assessment:
        case: no_material

    # ── لمّة مكتشفة من الأدلة ──
    - lemma: "صِلَة الدَّم"
      source: evidence
      decision: confirmed
      decision_reason: >
        موثَّقة في معجم المصطلحات الطبية (ج.1، 1985) مقابلاً مباشراً لـconsanguinity
        مع تعريف عربي صريح: «القرابة بين من يجمعهم أصل وراثي واحد». جذر «وصل»
        يدل عند ابن فارس على «ضمّ شيء إلى شيء حتى يعلقه»، وهو يعبّر عن الرابطة
        الدموية العضوية. «صِلَة الدَّم» تختلف دلالياً عن «صِلَة الرَّحِم» (الواجب الأخلاقي)
