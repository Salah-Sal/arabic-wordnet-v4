# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-13835803-n  |  ili: i109493
# المفهوم: consanguinity — حالة الارتباط بالدم
# ══════════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «صِلَة الرَّحِم» تحمل دلالة أخلاقية دينية راسخة (واجب الإبقاء على الروابط مع الأقارب) وليست مصطلحاً محايداً لحالة القرابة الدموية البيولوجية."
      - "التعريف الحالي «حالة الارتباط بالدم» مترجم حرفياً من الإنجليزية ويفتقر إلى الجنس القريب والفصل النوعي الذي يُبيّن الفرق بين القرابة الدموية والمصاهرة والتبني."
    observations: >
      تضمّ المجموعة لمّتين: «قَرَابَة الدَّم» و«صِلَة الرَّحِم». الأولى دقيقة في دلالتها
      ومُطابِقة للمفهوم الأنثروبولوجي المحايد (consanguinity)، وهي مُوثَّقة في المعاجم
      الاصطلاحية الحديثة. أما الثانية فهي اصطلاح إسلامي-فقهي يعني أداء الواجب تجاه
      الأقارب (مشاركتهم في الخيرات)، وهو مفهوم ينتمي إلى مجموعة ترادفية أخرى تدل
      على «صون الروابط الأسرية» لا على «الحالة البيولوجية لكون الأفراد أقارب بالدم».
      يُقترح حذف «صِلَة الرَّحِم» وإضافة «صِلَة الدَّم» التي تحمل تعريفاً معجمياً صريحاً
      مُطابقاً للمفهوم.

  blind_candidates:
    - lemma: "نَسَبُ الدَّم"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «نَسَب» (القرابة، اتصال شيء بشيء) و«الدَّم»؛ يُقيّد الانتساب
        بمصدره الدموي ويُميّزه عن القرابة بالزواج أو التبني.
    - lemma: "الدَّمَوِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بالوزن فَعَلِيَّة من «دَم» عبر صيغة النسبة، يدل على المفهوم المجرد
        لحالة الانتساب بالدم؛ قياساً على «الشَّعْبِيَّة» و«الإنسانيَّة» للدلالة على الهوية
        والانتماء المجرد.
    - lemma: "رَحِمِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بالوزن فَعْلِيَّة من «رَحِم»، المستعمل مجازاً للقرابة الدموية في
        القرآن الكريم والكلام العربي القديم. ابن فارس: «الرَّحِمُ: عَلَاقَةُ الْقَرَابَةِ».
        الصيغة الصناعية تحوّله إلى دلالة مجردة لـ«حالة الارتباط عبر الرحم».
    - lemma: "الوِلادِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «وَلَدَ» بالوزن فِعَالِيَّة، يدل على حالة الانتساب بالميلاد
        والنسل المشترك؛ ابن فارس: «الوَاوُ وَاللَّامُ وَالدَّالُ أَصْلٌ صَحِيحٌ وَهُوَ دَلِيلُ
        النَّجْلِ وَالنَّسْلِ».


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  query_log:
    - query_num: 1
      type: batch_headword
      terms: ["صلة الرحم", "قرابة الدم", "دموية", "الدموية", "رحمية", "الرحمية",
              "ولادية", "الولادية", "نسب الدم", "قرابة", "القرابة", "نسب", "النسب"]
    - query_num: 2
      type: english_bridge
      terms: ["consanguinity", "blood kinship", "cognation", "kinship by blood"]
    - query_num: 3
      type: fts_keywords
      terms: ["نسب", "قرابة", "رحم", "صلة الرحم"]
    - query_num: 4
      type: maqayis_roots
      terms: ["قرب", "نسب", "رحم", "صلو", "دمو", "ولد", "وصل"]
    - query_num: 5
      type: enrichment_by_id
      ids: [815527, 458296, 560791, 400444, 735211, 400415]
    - query_num: 6
      type: batch_headword_compounds
      terms: ["صلة الرحم", "قرابة الدم", "رابطة دم", "صلة الدم", "قربي", "القربي"]
    - query_num: 7
