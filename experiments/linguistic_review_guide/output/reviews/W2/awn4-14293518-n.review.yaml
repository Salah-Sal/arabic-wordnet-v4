# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-14293518-n  |  ILI: i111926
# الحالة: فَرْطُ بُوتَاسِيُومِ الدَّمِ (hyperkalemia)
# تاريخ المراجعة: 2026-03-17
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (قراءة الملف المُقنَّع أولاً) ──
stage1_review:

  assessment:
    concerns:
      - "اللمّة الموجودة خالية من التشكيل الكامل في سجل AWN4"
      - "التعريف العربي يستخدم «الدم الجاري» وهو تعبير ترجمي حرفي من circulating blood وليس الأسلوب الاصطلاحي الطبي العربي المعتاد"
      - "المصطلح الإنجليزي المرجعي في OEWN هو «kalemia» (بوتاسيوم الدم مطلقاً) بينما التعريف والمصطلح العربي يخصّان «hyperkalemia» (الفرط)، مما قد يوحي بتداخل دلالي في التصنيف الإنجليزي"
    observations: >
      المجموعة تمثل مفهوماً طبياً تخصصياً حديثاً هو «فَرْط بوتاسيوم الدم»
      (hyperkalemia). لا جذر عربي قديم يغطي هذا المفهوم إذ يقتضي ذِكر
      «بوتاسيوم» وهو اسم عنصر كيميائي معرَّب. المنهجية التعبيرية المُثلى
      في الطب العربي الحديث هي التركيب الإضافي المتسلسل باستخدام «فَرْط»
      (من فَرَطَ بمعنى تجاوز الحدّ) وهو عربي فصيح شائع في المصطلحية
      الطبية. التعريف الحالي صحيح جوهراً لكن أسلوبه يفتقر إلى صياغة
      المعجم الاصطلاحي.

  blind_candidates:
    - lemma: "فَرْطُ الكَالِيُومِ الدَّمَوِيّ"
      generation_method: tarkib
      justification: >
        تركيب إضافي وصفي يستعمل «كَالِيُوم» (من اللاتينية kalium، الاسم
        العلمي للبوتاسيوم مصدر الرمز الكيميائي K) مقروناً بالصفة «دَمَوِيّ»
        بدلاً من الإضافة «الدَّم». يُراد به التمييز بين كاليوم الدم وكاليوم
        الأنسجة.

    - lemma: "كَالِيمِيَا"
      generation_method: taarib
      justification: >
        تعريب للمصطلح الطبي الدولي «kalemia» (يونانية: kalium + haemia =
        البوتاسيوم في الدم). تقبل لام التعريف والنسبة والجمع السالم. شائعة
        في الطب البيطري.

    - lemma: "بُوتَاسِيُومِيَّةُ الدَّمِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي يعتمد المصدر الصناعي «بُوتَاسِيُومِيَّة» (نسب البوتاسيوم
        إلى الدم) مضافاً إلى «الدَّم». موازٍ للبنية «بيلة بوتاسيومية» الواردة
        في المعاجم الطبية للإدرار البوتاسيومي.

    - lemma: "هَايبَرْكَالِيمِيَا"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الطبي الإنجليزي «hyperkalemia» (hyper = فرط +
        kalemia = بوتاسيوم الدم). يضمن الوضوح الدلالي التام ولا لبس فيه.
        يُعدّ ملاذاً أخيراً إذ يوجد مقابل عربي مركب بالفعل.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
# الاستعلامات المُنفَّذة (٥ استعلامات):
#   Q1: مطابقة دفعية للمّة الموجودة + المرشحات (headword_norm IN ...)
#   Q2: جسر إنجليزي (translation_en: kalemia / hyperkalemia / ...)
#   Q3: FTS عربي (بوتاسيوم / بوتاسيومية / فرط البوتاسيوم)
#   Q4: مقاييس اللغة لجذر (فرط) [dictionary_id=151]
#   Q5: مقاييس اللغة لجذر (دم) [أعاد مدخل دمّ بمعنى الطلاء — مختلف]
stage2_evidence:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "فرط بوتاسيوم الدم"
      confirm:
        - text: "«فَرْطُ بوتاسيوم الدَّم» [translation_en: hyperkalemia]"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«فَرْطُ بوتاسيوم الدَّم» [translation_en: hyperpotassemia (hyperkalemia)]"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«فَرطُ بُوتاسيوم الدَّم» [translation_en: potassemia (hyperkalemia)]"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«ارتفاع مرضي في تركيز البوتاسيوم في الدم.» [translation_en: hyperkalemia = hyperpotassemia]"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«انظر: hyperkalemia.» [translation_en: hyperpotassemia = hyperkalemia]"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"

    # ── المرشح الأول ──
    - lemma: "فَرْطُ الكَالِيُومِ الدَّمَوِيّ"
      evidence_status: "no_material_found"

    # ── المرشح الثاني ──
    - lemma: "كَالِيمِيَا"
      contradicts:
        - text: "«بُوتاسْيوم الدَّم» [translation_en: kalemia] / «بُوتاسْيوم الدَّم» [translation_en: kaliemia (kalemia)]"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >
            المعجم يترجم «kalemia» بـ«بوتاسيوم الدم» وليس بـ«كاليميا».
            لا يوجد مدخل عربي بهذه الصيغة المُعرَّبة في المصطلحية الطبية.
        - text: "«بوتاسيومية الدم: وجود عنصر البوتاسيوم في الدم.» [translation_en: kalemia]"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: >
            المصطلح العربي المعتمد لـkalemia هو «بوتاسيومية الدم» وليس
            «كاليميا». فضلاً عن ذلك، «kalemia» هنا يعني وجود البوتاسيوم
            في الدم بوجه عام دون اشتراط الفرط، فهو أعمّ من المجموعة المراد توثيقها.

    # ── المرشح الثالث ──
    - lemma: "بُوتَاسِيُومِيَّةُ الدَّمِ"
      contradicts:
        - text: "«بوتاسيومية الدم: وجود عنصر البوتاسيوم في الدم.» [translation_en: kalemia]"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: >
            «بوتاسيومية الدم» تقابل «kalemia» (الوجود المجرد للبوتاسيوم في الدم)
            لا «hyperkalemia» (الفرط). التعريف الوارد «وجود عنصر البوتاسيوم في الدم»
            لا يتضمن قيد الزيادة المرضية الذي هو جوهر هذه المجموعة.
        - text: "«بُوتَاسيُومِيَّة: نسبة البوتاسيوم في الدم.» [translation_en: kalemia; kalaemia]"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: >
            التعريف «نسبة البوتاسيوم في الدم» يدل على المستوى العام لا الفرط.
            المصطلح مقابل لـkalemia لا لـhyperkalemia.
      expands:
        - text: "«بُوتَاسيُومِيَّة: نسبة البوتاسيوم في الدم.» / «بُوتَاسيُومِيَّة: نسبةالبوتاسيوم في الدم.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) / المعجم الموحد لمصطلحات الطب البيطري (2010)"
          addition: >
            الصيغة الاشتقاقية «بوتاسيومية» مسكوكة ومعترف بها في المعاجم الطبية
            المتخصصة، لكنها تُعبّر عن المفهوم الأشمل (kalemia) لا عن الفرط
            (hyperkalemia) تحديداً.

    # ── المرشح الرابع ──
    - lemma: "هَايبَرْكَالِيمِيَا"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "فرط بوتاسيوم الدم"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة في خمسة مداخل موزَّعة على معجمَيْن طبيَّيْن محكَّمَيْن
        (المعجم الطبي الموحد 2009، ومعجم المصطلحات الطبية ج.3 1997)،
        وهي التعبير العربي الاصطلاحي المعتمد لـhyperkalemia. تستوفي
        معيار التثبيت المعجمي (lexical fixing) كوحدة اصطلاحية متعارف
        عليها. تحتاج إلى تحديث التشكيل فقط.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تختص بالفرط المرضي (الزيادة عن
        الحد الطبيعي) خلافاً لـ«بوتاسيوم الدم / بوتاسيومية الدم» التي
        تدل على الوجود المجرد للبوتاسيوم، وخلافاً لـ«نقص بوتاسيوم الدم»
        (hypokalemia) الذي يمثل الحالة المعاكسة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَرْطُ بُوتَاسِيُومِ الدَّمِ"

    # ── المرشح الأول (stage1) ──
    - lemma: "فَرْطُ الكَالِيُومِ الدَّمَوِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. «كَالِيُوم» نادر الاستخدام في المصطلحية الطبية
        العربية الحديثة مقارنةً بـ«بوتاسيوم» المستقر. الصيغة الوصفية
        «الدَّمَوِيّ» أقل دقة من الإضافة «الدَّم» في هذا السياق التخصصي.

    # ── المرشح الثاني (stage1) ──
    - lemma: "كَالِيمِيَا"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب لا توجد له شواهد في المعاجم الطبية العربية. المعاجم تعتمد
        «بوتاسيوم الدم» و«بوتاسيومية الدم» لـkalemia. فضلاً عن ذلك، «kalemia»
        تعني الوجود المطلق للبوتاسيوم لا الفرط المرضي تحديداً، فلا يصح
        استخدامها مقابلاً لمجموعة تُعرَّف بالفرط.

    # ── المرشح الثالث (stage1) ──
    - lemma: "بُوتَاسِيُومِيَّةُ الدَّمِ"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح موجود في المعاجم لكنه مقابل لـkalemia (الوجود المجرد) لا
        لـhyperkalemia (الفرط). التعريف المعجمي «وجود عنصر البوتاسيوم في
        الدم / نسبة البوتاسيوم في الدم» يفتقر إلى قيد الزيادة المرضية؛
        الاحتفاظ به سيخلط بين مفهومَيْن متمايزَيْن.

    # ── المرشح الرابع (stage1) ──
    - lemma: "هَايبَرْكَالِيمِيَا"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. وجود المقابل العربي «فَرْطُ بُوتَاسِيُومِ الدَّمِ»
        الموثَّق والمعتمد يُغني عن التعريب الكامل، ويُؤثَر العربي وفق
        معايير بوابة جودة المصطلح.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────
stage4_content:

  definition:
    current: "وجود فائض من البوتاسيوم في الدم الجاري"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية. «الدم الجاري» تعبير
        ترجمي من «circulating blood» غير شائع في الكتابة الطبية العربية
        المتخصصة؛ يُستعاض عنه بـ«في الدم» مجرداً أو «في مجرى الدم».
        كما أن «وجود فائض» يفتقر إلى الطابع الاصطلاحي الطبي؛
        المعجم الطبي المتخصص يستخدم «ارتفاع مرضي في التركيز»
        وهو أكثر دقة ووصفاً للظاهرة السريرية.
    authored:
      - type: terminological
        text: "حَالَةٌ مَرَضِيَّةٌ تتميَّزُ بِارْتِفَاعِ تَرْكِيزِ البُوتَاسِيُومِ فِي الدَّمِ فَوْقَ الحَدِّ الطَّبِيعِيِّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          ارتفاعٌ مَرَضِيٌّ في نسبة البوتاسيوم في الدم يتجاوز 5.5
          ملي مكافئ/لتر، يُفضي إلى اضطرابات في وظائف العضلات
          والقلب، وكثيراً ما يكون عَرَضاً مصاحباً للفشل الكلوي أو
          التناوُل المفرط لمدرّات البول الحافظة للبوتاسيوم.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-14293518-n"
          definition_index: 0
          text: "حَالَةٌ مَرَضِيَّةٌ تتميَّزُ بِارْتِفَاعِ تَرْكِيزِ البُوتَاسِيُومِ فِي الدَّمِ فَوْقَ الحَدِّ الطَّبِيعِيِّ"
      - command: add_definition
