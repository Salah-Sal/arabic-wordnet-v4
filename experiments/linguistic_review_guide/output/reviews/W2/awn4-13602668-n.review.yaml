# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13602668-n
# المفهوم: absolute value / numerical value
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (قيمة عددية، قيمة مطلقة) تمثّلان مفهومين متمايزين في الرياضيات الدقيقة: القيمة العددية هي المقدار العددي لكمية فيزيائية بالنسبة لوحدة قياس، بينما القيمة المطلقة هي مقدار العدد بصرف النظر عن إشارته. جمعهما في مجموعة واحدة قد يكون مقبولاً في السياق العام لكنه يحتاج تدقيقاً."
      - "التعريف العربي الحالي (عدد حقيقي بغض النظر عن إشارته) أقرب لتعريف القيمة المطلقة فقط، وليس القيمة العددية بالمعنى الفيزيائي/المترولوجي."
    observations: "المجموعة تندرج تحت مفهوم الكمية المحددة (awn4-13597304-n) وهو ضابط مناسب. المصطلحان مُقنّنان في معاجم ALECSO المتعددة، مما يدل على ثباتهما في الاستعمال العلمي العربي المعاصر. التعريف الإنجليزي يجمع المفهومين (a real number regardless of its sign) والترجمة العربية تعكس ذلك بصورة مقبولة."
  blind_candidates:
    - lemma: "قِيمَة مُطْلَقَة"
      generation_method: tarkib
      justification: "مركّب وصفي ثابت في المصطلحية الرياضية العربية. مُطلقة بمعنى مُجرَّدة من قيد الإشارة، من الجذر ط-ل-ق الدال على التخلية والإرسال."
    - lemma: "طَوِيلَة"
      generation_method: majaz
      justification: "إزاحة دلالية من الطول بمعنى الامتداد والمسافة على خط الأعداد، كما يُقال طويلة العدد أي مقداره الممتد من الصفر. مصطلح مسكوك في بعض المعاجم المعلوماتية العربية."
    - lemma: "مِقْدَار مُطْلَق"
      generation_method: tarkib
      justification: "مركّب وصفي من مِقْدَار (على وزن مِفْعَال من قدر) ومُطْلَق. المقدار يشمل البُعد الكمّي والإشارة، فإطلاقه يعني تجريده من الإشارة."
    - lemma: "قَدْر"
      generation_method: ishtiqaq
      justification: "من الجذر ق-د-ر بمعنى مبلغ الشيء ومقداره. القَدْر هو المقدار المجرد من الإشارة، كما ورد في بعض المعاجم المعلوماتية مرادفاً للقيمة المطلقة."

stage2_evidence:
  per_lemma:
    - lemma: "قِيمَة عَدَدِيَّة"
      confirm:
        - text: "«قيمة عددية» = numerical value"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«قيمة عددية» = numerical value"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«قيمة عددية» = numerical value"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«قيمة عددية (قيمة عددية لوحدة)» = numerical value; numerical quantity value; numerical value of a quantity"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«قيمة مقاسة: هي قيمة عددية.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
          addition: "يُوضّح أن القيمة العددية هي المقدار المقاس، مما يشير إلى تداخل مع مفهوم القيمة المقاسة"

    - lemma: "قِيمَة مُطْلَقَة"
      confirm:
        - text: "«قيمة مطلقة» = absolute value"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "«قَدْرُ عددٍ، بقطع النظر عن إشارته (- أو +). والقيمةُ المطلقةُ هي دوماً أكبر من الصفر أو تساويه. فمثلاً، 10 هي القيمة المطلقة لـ 10 و-10.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«يتمُ الحصول على القيمة المُطلقة لعددٍ حقيقيّ من خلال حذف الإشارة، بما يعني أن: |x| = تساوي x، عندما تكون x أكبر من أو تساوي 0، وتكون |x| مُساوية -x عندما تكون x أصغر من 0.»"
          source: "مسرد الهندسة الكهربائية (ArabTerm)"
        - text: "«قيمة العدد دون النظر إلى معانيه الحسابية.»"
          source: "مسرد التربية (ArabTerm)"
        - text: "«قيمة مطلقة» = absolute value"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«قيمَةٌ مُطْلَقَة» = absolute value"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«قيمة مطلقة لعدد مركب» = absolute value of a complex number"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "المصطلح يمتد ليشمل الأعداد المركبة أيضاً وليس الحقيقية فحسب"
        - text: "«قيمة مطلقة لعدد حقيقي» = absolute value of a real number"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "تخصيص صريح للمفهوم في مجال الأعداد الحقيقية"

    - lemma: "طَوِيلَة"
      confirm:
        - text: "«طويلة (قيمة مطلقة)، قَدْر: مقدارُ العددِ بقطع النظر عن إشارته (+ أو -). مثال: العددان 16 و- 16 لهما الطويلةُ نفسُها.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      contradicts:
        - text: "«طويلة» لم يرد في أي معجم رياضي أو فيزيائي مُقنَّن آخر"
          source: "بحث شامل في قاعدة البيانات"
          conflict: "المصطلح نادر جداً ومقتصر على معجم واحد فقط، ولا يُستخدم في الممارسة الرياضية العربية"

    - lemma: "مِقْدَار مُطْلَق"
      evidence_status: "no_material_found"

    - lemma: "قَدْر"
      confirm:
        - text: "«طويلة (قيمة مطلقة)، قَدْر: مقدارُ العددِ بقطع النظر عن إشارته (+ أو -)»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      contradicts:
        - text: "«القَدَرُ: القَضاءُ، والحُكْمُ، ومَبْلَغُ الشيءِ» — لفظ عام جداً متعدد المعاني"
          source: "القاموس المحيط"
          conflict: "الاشتراك اللفظي الشديد يجعل استخدامه مصطلحاً رياضياً مُلبِساً"

