# ── المرحلة ١: المراجعة والتوليد (أعمى — بدون الاطلاع على اللمّات) ──
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'الطابع الروسي' مركبٌ وصفيٌّ لا مصطلحٌ أحادي مسكوك، مما يُضعف المكانة المعجمية للمجموعة"
      - "التعريف الحالي ترجمة حرفية من الإنجليزية (calque: 'the quality or property of being Russian') وليس بأسلوب المعجم الوسيط"
      - "غياب التشكيل الكامل عن اللمّة الموجودة"
      - "المفهوم (Russianness) يُعاني من فجوة معجمية في العربية: لا يوجد مصطلح أحادي خالٍ من الاشتراك اللفظي"
      - "ILI = null: لا ربط بمعجم برنستون، مما يحدّ من قابلية التشغيل البيني"
    observations: >-
      المجموعة تُمثّل مفهومًا مجرَّدًا من فئة 'الخاصية القومية' على غرار العربية والفارسية والتركية.
      تُعبِّر العربية المعاصرة عن هذه المفاهيم إما بالمصدر الصناعي (الروسية) الذي يُشاطره دلالةُ اسم اللغة،
      وإما بمركبات وصفية كـ'الطابع الروسي'. الوضع يكشف عن فجوة معجمية حقيقية:
      ليس في التراث العربي الكلاسيكي ما يُقابل مفهوم 'الروسية' كخاصية مجردة،
      إذ كان التواصل مع روسيا تاريخيًّا محدودًا في المصادر المعجمية الكلاسيكية.
  blind_candidates:
    - lemma: "الرُّوسِيَّةُ"
      generation_method: ishtiqaq
      justification: >-
        المصدر الصناعي من الصفة النسبية 'روسي' بإضافة ياء النسب المشددة مع تاء التأنيث،
        على القياس العربي المنتج لتحويل الصفات النسبية إلى مفاهيم مجردة:
        العربية (Arabness)، الفارسية (Persianness)، التركية (Turkishness)، الإنجليزية (Englishness).
        الوزن الصرفي: فُعُولِيَّة/نِسبِيَّة مجردة.
    - lemma: "الطَّابَعُ الرُّوسِيُّ"
      generation_method: tarkib
      justification: >-
        مركب وصفي (موصوف + صفة نسبية): الطابع = الخُلُق الغالب والسَّجِيَّة والعلامة المميزة،
        والروسي = المنتسب إلى روسيا. يُعبِّر عن الخصيصة الجوهرية لما هو روسيٌّ من منظور
        السجية والهوية، وهو استخدام قياسي في العربية المعاصرة.
    - lemma: "الرُّوسَنَةُ"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل الرباعي 'رَوْسَنَ' على وزن فَوْعَلَة، قياسًا على أفعال التحويل القومي
        كـ'عَرْبَنَ/عَرْبَنَة' و'عَوْلَمَ/عَوْلَمَة'. يدلّ على الصفة الكلية للهوية الروسية
        أو عملية الاكتساب الروسي.
    - lemma: "السِّمَةُ الرُّوسِيَّةُ"
      generation_method: tarkib
      justification: >-
        مركب وصفي (موصوف + صفة): السِّمَة = الخاصية المميزة الفارقة، الروسية = نسبية.
        نظير مركبات شائعة كـ'السمة الحضارية' و'السمة الثقافية'. يعبّر عن الخاصية الروسية
        بصياغة أكثر تحديدًا من 'الطابع'.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# استعلامات نُفِّذت:
# ١. مطابقة دفعية لجميع اللمّات والمرشحات (بصيغتَيْ ال- وبدونها)
# ٢. جسر إنجليزي: Russian / Russianness / Slavic
# ٣. بحث FTS: روسي / روسية / روسيا
# ٤. مقاييس اللغة: جذر طبع (dictionary_id = 151)
stage2_evidence:
  per_lemma:
    - lemma: "الطَّابَعُ الرُّوسِيُّ"
      confirm:
        - text: "«الطَّابَع: الطبيعة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الطابَع: الخَلِيقَةُ والسَّجِيَّةُ التي جُبِلَ عليها الإنسانُ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«مَا يطبع بِهِ أَو يخْتم والميسم والخلق الْغَالِب»"
          source: "المعجم الوسيط (رواية الهوارماني)"
      expands:
        - text: "«والطَّابِعُ: العَلَامَةُ الْمُمَيِّزَةُ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >-
            يُضيف بُعدًا تمييزيًّا هامًّا: الطابع هو العلامة المميزة والفارقة لشيء ما،
            مما يُقوِّي دلالته على الخصيصة الروسية الجوهرية.
        - text: "«الطَّاءُ وَالْبَاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ مَثَلٌ عَلَى نِهَايَةٍ يَنْتَهِي إِلَيْهَا الشَّيْءُ حَتَّى يُخْتَمَ عِنْدَهَا، يُقَالُ: طَبَعْتُ عَلَى الشَّيْءِ طَابَعًا. ثُمَّ يُقَالُ عَلَى هَذَا: طَبْعُ الْإِنْسَانِ وَسَجِيَّتُهُ»"
          source: "مقاييس اللغة لابن فارس (جذر: طبع)"
          addition: >-
            يؤصّل ابن فارس دلالة الجذر (ط ب ع) على الختم والإتمام والسجية الراسخة،
            مما يدعم استخدام الطابع للدلالة على الخصيصة الجوهرية التي تُختَم بها هوية الشيء.

    - lemma: "الرُّوسِيَّةُ"
      contradicts:
        - text: "«الروسيّ: أحد أبناء الروسيا — الروسيّة: اللغة الروسية — روسيّ»"
          source: "المورد الحديث (2008)"
          conflict: >-
            الدلالة الأولى لـ'الروسية' في المعاجم العربية المعاصرة هي اللغة الروسية لا الخاصية المجردة،
            مما يُنشئ اشتراكًا لفظيًّا خطيرًا مع المجموعة الترادفية الخاصة باللغة الروسية.
      expands:
        - text: "«رُوَسية: نسبة إلى روسيا، أو نسبة إلى كلمة روس العامية بمعنى رؤوس»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >-
            توثّق الصلة الاشتقاقية بالانتساب إلى روسيا، لكن في سياق أسماء الأعلام
            لا المصطلحات المجردة المعيارية.

    - lemma: "الرُّوسَنَةُ"
      evidence_status: "no_material_found"

    - lemma: "السِّمَةُ الرُّوسِيَّةُ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "الطابع الروسي"
      decision: confirmed
      decision_reason: >-
        اللمّة موثَّقة بأدلة معجمية قوية: الطابع = الخَلِيقَة والسجية (المعجم الكبير) +
        العلامة المميزة + الطبيعة (الوسيط)، وهذه المعاني تُؤهّله تمامًا للدلالة على الخاصية
        الجوهرية لكون الشيء روسيًّا. المركب الوصفي ثابتٌ في الاستخدام المعاصر
        (إعلام، دراسات، تقارير) وهو الاختيار الأمثل في غياب مصطلح أحادي خالٍ من الاشتراك.
        تحتاج اللمّة إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        اللمّة الوحيدة المُؤكَّدة في المجموعة. توظِّف 'الطابع' (= الخُلُق الغالب، السَّجِيَّة،
        العلامة المميزة) موصوفًا بـ'الروسي'، فتُعبِّر عن الخصيصة الروسية من منظور الجوهر
        والسجية الراسخة لا مجرد الانتساب الجغرافي أو السياسي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الطَّابَعُ الرُّوسِيُّ"

    - lemma: "الرُّوسِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم قياسيّتها الصرفية (مصدر صناعي على غرار العربية والفارسية)، فإن دلالتها الأولى
        الراسخة في المعاجم المعاصرة (المورد الحديث) هي 'اللغة الروسية'، مما يُنشئ اشتراكًا
        لفظيًّا حادًّا مع المجموعة الترادفية الخاصة باللغة الروسية في AWN4.
        الإدراج سيُربك المستخدم ومعالجة اللغة الطبيعية.

    - lemma: "الرُّوسَنَةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        وزن فَوْعَلَة يدلّ على عملية التحويل (Russification) لا على الخاصية المجردة الجوهرية
        (Russianness). المفهوم المستهدف هو صفة الكون روسيًّا لا عملية التروّس أو التروسين.
        لا أدلة معجمية على الاستخدام.

    - lemma: "السِّمَةُ الرُّوسِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >-
        يفشل اختبار السكّ: يمكن إبدال 'السمة' بـ'الخاصية' أو 'الصفة' أو 'الطابع' ويبقى الوصف
        صالحًا دلاليًّا، مما يكشف أنه وصف حر لا مصطلح مسكوك. لا أدلة على التثبيت المعجمي
        كوحدة اصطلاحية.


