# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-15252642-n (hour / سَاعَة)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ساعة» مكتوبة بدون تشكيل، وتحتاج إلى ضبط كامل."
      - "المجموعة تحتوي على لمّة واحدة فقط، مع أن المفهوم أساسي وشائع في العربية."
    observations: >
      المفهوم واضح ومحدد: وحدة زمنية تساوي جزءاً من أربعة وعشرين جزءاً من اليوم.
      التعريف الحالي مقبول لكنه يستخدم الأرقام اللاتينية (1/24) بدلاً من التعبير اللغوي العربي.
      لفظ «ساعة» هو اللفظ العربي الأصيل لهذا المفهوم، من جذر «سوع» الدال على استمرار الشيء ومضيّه.
      المفهوم متجذر في الثقافة العربية وله شواهد قرآنية وحديثية كثيرة.
  blind_candidates:
    - lemma: "سَاعَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «سوع» الدال على استمرار الزمن ومضيّه، على وزن فَاعَلَة.
        هو اللفظ العربي الأصيل لوحدة الزمن المعروفة، مستعمل في القرآن والحديث والأدب.
    - lemma: "حِينَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «حين» بمعنى الوقت، على وزن فِعْلَة للوحدة.
        محاولة اشتقاق وحدة زمنية من مادة الحين.
    - lemma: "وَقْتَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «وقت» على وزن فَعْلَة للمرة الواحدة.
        محاولة اشتقاق وحدة زمنية محددة من مادة الوقت.
    - lemma: "جُزْءُ اليَوْمِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي وصفي يعني الحصة الزمنية من اليوم.
        تعبير شبه وصفي لكنه قد يصلح كمصطلح بديل.

stage2_evidence:
  per_lemma:
    - lemma: "سَاعَة"
      confirm:
        - text: "«جزءٌ من أربعة وعشرين جزءاً من الليل والنهار»"
          source: "المعجم الوسيط"
        - text: "«جُزْءٌ مِن أجزاء اليوم, وهو أَرْبعٌ وعِشرون ساعَةً»"
          source: "المعجم الكبير"
        - text: "«عند المنجّمين وأهل الهيئة هي ثلث ثمن اليوم والليلة، يعني جزء من أربعة وعشرين جزءا من مجموع اليوم والليل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«في عرف الفقهاء جزء من الزمان وإن قلَّ لا جزء من أربعة وعشرين من يوم بليلته أي ستون دقيقة كما يقوله المنجِّمون»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الوقت المعروف وتصغر سويعة»"
          source: "كتاب العين"
      expands:
        - text: "«جزءٌ من أجزاء الوقت والحين وإن قَلَّ»"
          source: "المعجم الوسيط"
          addition: "الساعة تطلق أيضاً على أيّ جزء من الوقت مهما قلّ، وليس فقط الوحدة المحددة"
        - text: "«آلةٌ يعرف بها الوقت بالساعات والدقائق والثوانى»"
          source: "المعجم الوسيط"
          addition: "الساعة تطلق أيضاً على آلة قياس الوقت (الساعة اليدوية/الجدارية)"
        - text: "«القيامةُ. أو الوقتُ الذى تقوم فيه»"
          source: "المعجم الوسيط"
          addition: "الساعة اسم من أسماء يوم القيامة في الاستعمال القرآني"
        - text: "«جزءٌ من الوقت, أو مِقْدارٌ منه»"
          source: "المعجم الكبير"
          addition: "تأكيد أن الساعة تعني أيضاً مقداراً غير محدد من الوقت"
    - lemma: "حِينَة"
      contradicts:
        - text: "«يقال: ما ألقاه إلا الحينة بعد الحينة: الحين بعد الحين. يقال: هو يأكل الحِيْنَةَ: المرة الواحدة في اليوم والليلة. حينة الناقة: وقت حلبها»"
          source: "المعجم الوسيط"
          conflict: "الحينة تعني المرة الواحدة أو الحين غير المحدد، لا وحدة زمنية مقدارها 1/24 من اليوم"
        - text: "«القطيع من الغنم. حجارةٌ تنحدر من جوانب الجبل إلى أسفله»"
          source: "المعجم الوسيط (مدخل آخر)"
          conflict: "معنى مختلف تماماً لا علاقة له بالزمن"
    - lemma: "وَقْتَة"
      evidence_status: "no_material_found"
    - lemma: "جُزْءُ اليَوْمِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "سَاعَة"
      decision: confirmed
      decision_reason: >
        لفظ «ساعة» مؤكد بأدلة معجمية متعددة من المعاجم الكلاسيكية والحديثة كوحدة زمنية تعادل
        جزءاً من أربعة وعشرين جزءاً من الليل والنهار. اللفظ عربي أصيل من الجذر «سوع»،
        موثق في كتاب العين (أقدم معجم عربي)، والقرآن الكريم، والحديث النبوي.
        معجمات ALECSO الموحدة تثبته مقابل "hour" في الرياضيات والفلك والطب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَاعَة"

    - lemma: "حِينَة"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تبيّن أن «الحينة» تعني المرة الواحدة من الأكل أو الحلب في اليوم،
        أو الحين غير المحدد. لا تدل على وحدة زمنية مقدارها ستون دقيقة.
        المعنى مختلف جذرياً عن المفهوم المستهدف.
      evidence_assessment:
        case: contradicts_only

    - lemma: "وَقْتَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي لاستعمال «وقتة» كوحدة زمنية محددة. الاشتقاق نظري
        ولم يثبت في الاستعمال العربي.
      evidence_assessment:
        case: no_material

    - lemma: "جُزْءُ اليَوْمِ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ وليس مصطلحاً مسكوكاً. يمكن استبدال «جزء» بـ«قسم» أو «حصة»
        ويبقى صالحاً كوصف، فيفشل في اختبار السكّ. كما أنه عام جداً ولا يحدد المقدار (1/24).
      evidence_assessment:
        case: no_material

