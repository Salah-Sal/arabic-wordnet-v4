# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-07296576-n (sprechgesang / sprechstimme)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «غناء كلامي» مركّب وصفي حُرّ وليس مصطلحاً مسكوكاً ثابتاً؛ يمكن إبدال «كلامي» بـ«لفظي» أو «نطقي» دون تغيّر المعنى"
      - "المفهوم (شبرخغزانغ) تقنية صوتية غربية متخصصة في الموسيقى الكلاسيكية الأوروبية، ليس لها مقابل في التراث الموسيقي العربي"
      - "لا يوجد سوى لمّة واحدة في المجموعة، وهو ضعف بنيوي"
    observations: "المجموعة تعبّر عن مفهوم موسيقي غربي ابتكره أرنولد شونبرغ، وهو أسلوب أداء صوتي درامي يقع في المنطقة الوسطى بين الغناء الملحّن والكلام العادي. المفهوم غريب عن التقاليد الموسيقية العربية التي تملك أساليبها الخاصة في الإلقاء الصوتي كالتجويد والإنشاد. التعريف الحالي مقبول في وصفه العام لكنه يفتقر إلى الإشارة للسياق الموسيقي الغربي."
  blind_candidates:
    - lemma: "تَنْغِيم"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفْعِيل من الجذر ن-غ-م، يدلّ على تلوين الصوت بالنغمة. قريب من المفهوم لكنه يحتاج تقييم مدى تداخله مع المصطلح اللساني (intonation)."
    - lemma: "تَرْنِيم كَلَامِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي من ترنيم (ترجيع الصوت وتطريبه) وكلامي (نسبة إلى الكلام). يجمع بين بُعدَي المفهوم: الترنيم الموسيقي والطابع الكلامي."
    - lemma: "إِنْشَاد تَمْثِيلِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي من إنشاد (رفع الصوت في القراءة) وتمثيلي (درامي). يركّز على البعد الدرامي للأداء."
    - lemma: "غِنَاء نَثْرِيّ"
      generation_method: tarkib
      justification: "مركّب وصفي من غناء ونثري (مقابل شعري/موزون)، للإشارة إلى غناء يقترب من الكلام النثري غير الملحّن."

stage2_evidence:
  per_lemma:
    - lemma: "غِنَاء كَلَامِيّ"
      evidence_status: "no_material_found"

    - lemma: "تَنْغِيم"
      contradicts:
        - text: "«تغيرات علو النغم الحنجري الخاصة بالمتواليات الطويلة (كلمة، متوالية من الكلمات) والتي تشكل المنحني النغمي للجملة. ولا تهم هذه التغيرات المقطع أو الصوتية، وهي تنقل لنا معلومات تأثرية (غضب، فرح…إلخ)»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "التنغيم مصطلح لساني راسخ يعني intonation ويختلف جوهرياً عن أسلوب الأداء الصوتي بين الغناء والكلام"
        - text: "«intonation»"
          source: "مسرد الفن، التسلية والرياضة - أليكسو"
          conflict: "التنغيم مستقرّ في المجال الموسيقي أيضاً بمعنى intonation لا Sprechgesang"
      expands:
        - text: "«النُّونُ وَالْغَيْنُ وَالْمِيمُ لَيْسَ إِلَّا النَّغْمَةُ: جَرْسُ الْكَلَامِ وَحُسْنُ الصَّوْتِ بِالْقِرَاءَةِ وَغَيْرِهَا. وَهُوَ النَّغْمُ. وَتَنَغَّمَ الْإِنْسَانُ بِالْغِنَاءِ وَنَحْوِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ن-غ-م يدور حول حُسن الصوت والجرس، لكن المصدر تَنْغِيم قد استُهلك اصطلاحياً"

    - lemma: "تَرْنِيم كَلَامِيّ"
      confirm:
        - text: "«التَّرَنُّمُ. يقال للمُكاء: فى صَوْتِه تَرْنِيمٌ»"
          source: "المعجم الكبير"
      expands:
        - text: "«الرَّاءُ وَالنُّونُ وَالْمِيمُ أُصَيْلٌ صَحِيحٌ فِي الْأَصْوَاتِ. يُقَالُ تَرَنَّمَ، إِذَا رَجَّعَ صَوْتَهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ر-ن-م أصيل في الأصوات وترجيعها، مناسب دلالياً"
      contradicts:
        - text: "«ترنيم — modulation (في مجال تقنية المعلومات والاتصالات)»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "لفظة ترنيم مشغولة بمعنى modulation في المجال التقني، مما يولّد اشتراكاً لفظياً"

    - lemma: "إِنْشَاد تَمْثِيلِيّ"
      expands:
        - text: "«إنْشَاد: من (ن ش د) رفع الصوت عند قراءة الشعر والإجابة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الإنشاد مرتبط بقراءة الشعر تحديداً لا بالأداء الصوتي الدرامي الموسيقي"
      contradicts:
        - text: "«تمثيلي — analog (فيزياء) / histrionic (طب)»"
          source: "المعجم الموحد لمصطلحات الفيزياء / المعجم الطبي الموحد"
          conflict: "تمثيلي مشغولة في مجالات أخرى بمعانٍ مختلفة (analog, histrionic)"

    - lemma: "غِنَاء نَثْرِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "غِنَاء كَلَامِيّ"
      decision: confirmed
      decision_reason: "المركب الوصفي الوحيد المتاح الذي يصف المفهوم بشفافية كافية. رغم أنه ليس مصطلحاً مسكوكاً ثابتاً، فإنه أقرب تعبير عربي متاح لمفهوم غربي متخصص ليس له مقابل تراثي. الغناء يشير إلى البعد الموسيقي، وكلامي يشير إلى البعد الكلامي، وهما ركنا المفهوم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غِنَاء كَلَامِيّ"

    - lemma: "تَنْغِيم"
      source: stage1
      decision: removed
      decision_reason: "مصطلح لساني وموسيقي راسخ بمعنى intonation في عدة معاجم موحدة (اللسانيات، الفيزياء، الطب، الفنون). استخدامه لمعنى Sprechgesang يولّد اشتراكاً لفظياً ضارّاً مع مصطلح مستقرّ."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَرْنِيم كَلَامِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم أن الجذر ر-ن-م أصيل في الأصوات وترجيعها، فإن لفظة «ترنيم» مشغولة بمعنى modulation في المعاجم التقنية الموحدة. كما أن المركّب «ترنيم كلامي» حُرّ وليس وحدة معجمية ثابتة."
      evidence_assessment:
        case: mixed

    - lemma: "إِنْشَاد تَمْثِيلِيّ"
      source: stage1
      decision: removed
      decision_reason: "الإنشاد مرتبط في التراث العربي بقراءة الشعر ورفع الصوت به، وهو أقرب إلى chanting/recitation منه إلى الأداء الصوتي الموسيقي الدرامي. كما أن «تمثيلي» مشغولة بمعنى analog في المعاجم التقنية."
      evidence_assessment:
        case: mixed

    - lemma: "غِنَاء نَثْرِيّ"
      source: stage1
      decision: removed
      decision_reason: "المركب مضلّل دلالياً؛ «نثري» يوحي بالعشوائية وعدم الانتظام، بينما الشبرخغزانغ أسلوب أداء مضبوط ومقنّن. كما أنه لم تُوجد له أي شواهد معجمية."
      evidence_assessment:
        case: no_material

