stage1_review:
  assessment:
    concerns:
      - اللمة الحالية غير مشكولة.
    observations: "المفهوم اقتصادي تقني، واللمة الحالية 'نمو اقتصادي' هي المصطلح المعياري المتداول في الأدبيات الاقتصادية العربية."
  blind_candidates:
    - lemma: "نُمُوّ اِقْتِصَادِيّ"
      generation_method: tarkib
      justification: "التركيب الوصفي الأكثر شيوعاً ودقة للتعبير عن زيادة القدرة الإنتاجية للدولة."
    - lemma: "تَزَايُد اِقْتِصَادِيّ"
      generation_method: ishtiqaq
      justification: "استخدام صيغة التفاعل (تزايد) للدلالة على التدرج والاستمرار في النمو."
    - lemma: "نُمُوّ النَّاتِج القَوْمِيّ"
      generation_method: tarkib
      justification: "تسمية المفهوم بالمؤشر الذي يقيسه مباشرة."
    - lemma: "اِزْدِهَار اِقْتِصَادِيّ"
      generation_method: majaz
      justification: "استخدام لفظ 'ازدهار' كاستعارة للنمو والنجاح الاقتصادي."

stage2_evidence:
  per_lemma:
    - lemma: "نُمُوّ اِقْتِصَادِيّ"
      confirm:
        - text: "«الزِّيادة النَّوعيَّة في دخل الفرد أو في النَّاتج القوميّ أو المحليّ الإجماليّ.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«زيادة مطردة في الناتج الإجمالي أو نصيب الفرد من ناتج الاقتصاد على مدى فترة طويلة من الزمن.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "«تزايد المجاميع الاقتصادية كالدخل القومي، والناتج القومي، والأجور وما إليها»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"

stage3_analysis:
  per_lemma:
    - lemma: "نمو اقتصادي"
      decision: confirmed
      decision_reason: "هو المصطلح العلمي الدقيق والمطابق للتعريف الإنجليزي وللأدلة المعجمية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُمُوّ اِقْتِصَادِيّ"

stage4_content:
  definition:
    current: "نمو مطرد في القدرة الإنتاجية للاقتصاد (وبالتالي نمو الدخل القومي)"
    assessment:
      decision: revise
      reason: "لتحسين الصياغة وجعلها أكثر دقة وموافقة لأسلوب المعاجم المتخصصة."
    authored:
      - type: terminological
        text: "زيادة مطردة في القدرة الإنتاجية للاقتصاد، تتمثل في نمو الناتج القومي الإجمالي أو دخل الفرد على المدى الطويل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "زيادة مطردة في القدرة الإنتاجية للاقتصاد، تتمثل في نمو الناتج القومي الإجمالي أو دخل الفرد على المدى الطويل."
  examples:
    per_lemma:
      - lemma: "نُمُوّ اِقْتِصَادِيّ"
        examples:
          - text: "حققت الدولة معدلات نُمُوّ اِقْتِصَادِيّ مرتفعة بفضل الاستثمارات الجديدة في قطاع التكنولوجيا."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يسعى صانعو السياسات إلى تحقيق نُمُوّ اِقْتِصَادِيّ مستدام لتقليل معدلات البطالة."

stage5_enrichment:
  per_entry:
    - lemma: "نُمُوّ اِقْتِصَادِيّ"
      entry_id: "{auto}"
      roots:
        - word: "نمو"
          root: "نمو"
          maqayis_quote: "«النُّونُ وَالْمِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَزِيَادَةٍ.»"
        - word: "اقتصادي"
          root: "قصد"
          maqayis_quote: "«الْقَافُ وَالصَّادُ وَالدَّالُ أُصُولٌ ثَلَاثَةٌ، يَدُلُّ أَحَدُهَا عَلَى إِتْيَانِ شَيْءٍ وَأَمِّهِ، وَالْآخَرُ عَلَى اكْتِنَازٍ فِي الشَّيْءِ.»"
  per_sense:
    - lemma: "نُمُوّ اِقْتِصَادِيّ"
      sense_id: "{auto}"
      nuance: "المصطلح التقني المعياري الذي يقيس الزيادة في القدرة الإنتاجية الكلية."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"نمو","root":"نمو","maqayis":"«النُّونُ وَالْمِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَزِيَادَةٍ.»"},{"word":"اقتصادي","root":"قصد","maqayis":"«الْقَافُ وَالصَّادُ وَالدَّالُ أُصُولٌ ثَلَاثَةٌ، يَدُلُّ أَحَدُهَا عَلَى إِتْيَانِ شَيْءٍ وَأَمِّهِ، وَالْآخَرُ عَلَى اكْتِنَازٍ فِي الشَّيْءِ.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح التقني المعياري الذي يقيس الزيادة في القدرة الإنتاجية الكلية.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
