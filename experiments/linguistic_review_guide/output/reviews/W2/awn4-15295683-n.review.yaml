# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15295683-n (lunitidal interval)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (الفاصل القمري المدّي)، وهي تعبير مركب وصفي طويل نسبياً"
      - "اللمّة الحالية بلا تشكيل كامل — ينبغي ضبطها صرفياً"
      - "المصطلح تقني متخصص في علوم البحار والفلك، وقد لا يُعرَف خارج الأوساط العلمية"
    observations: "المفهوم يصف فاصلاً زمنياً فلكياً-بحرياً بين حدثين: عبور القمر لخط الطول ثم بلوغ المد أقصاه. هذا مصطلح علمي دقيق لا مقابل تراثي له في المعجمية العربية الكلاسيكية. التعبير عنه يستلزم تركيباً وصفياً أو إضافياً يجمع بين مفهومَي القمر والمد."

  blind_candidates:
    - lemma: "البَوْنُ المَدِّيُّ القَمَرِيُّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «البَوْن» (المسافة بين شيئين) مع وصفين «مَدِّيّ» (نسبة إلى المدّ) و«قَمَرِيّ» (نسبة إلى القمر). البون يدل على الفارق والمسافة بين حدّين، وهو أقرب من «فاصل» إلى مفهوم الفترة البينية."
    - lemma: "الأَمَدُ القَمَرِيُّ المَدِّيُّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «الأَمَد» (المدة المحددة ذات الغاية) مع نعتين. الأمد في المعجمات: مدة لها حد مجهول إذا أُطلِق وقد ينحصر، وهو أدق من «فترة» لأنه يشير إلى غاية ومنتهى."
    - lemma: "المُهْلَةُ المَدِّيَّةُ القَمَرِيَّةُ"
      generation_method: tarkib
      justification: "تركيب وصفي من «المُهلة» (الفترة الزمنية المحصورة بين حدَّين) مع وصفين. المهلة تفيد الانتظار بين حدثين متعاقبين، وهو قريب من المعنى المراد."
    - lemma: "المِمْدَادُ القَمَرِيُّ"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر م-د-د على وزن مِفْعال الدال على أداة القياس أو ما يُقاس به. المِمْداد يشير إلى ما يُقاس من المدّ مقترناً بالقمر. لكن هذا الوزن يُستعمل عادة لأجهزة القياس لا للفواصل الزمنية."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "الفَاصِلُ القَمَرِيُّ المَدِّيُّ"
      confirm:
        - text: "«قَمَرِيْمَدّيّ: متعلّق بالمَدّ والجَزْر القمريَّيْن.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الْفَاصِل) يُقَال حكم فاصل وَقَضَاء فاصل مَاض قَاطع»"
          source: "المعجم الوسيط"
          addition: "الفاصل في الأصل: القاطع المميِّز، واستُعمل هنا بمعنى الفترة الفاصلة بين حدثين"
        - text: "«المد العالي»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "تأكيد وجود مصطلح «المد العالي» مقابل high tide في المعجمات المصطلحية العربية"

    - lemma: "البَوْنُ المَدِّيُّ القَمَرِيُّ"
      contradicts:
        - text: "«البَوْنُ: مسافةُ ما بين الشيْئَيْنِ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "البون يدل على المسافة المكانية بين شيئين، لا على الفاصل الزمني"
        - text: "«البون: الفضل والمزية مصدر بانه يبونه فضله. وبينهما بون أي بين درجتيهما أو اعتباريهما في الشرف. وأما في التباعد الجسماني فيقال بينهما بين بالياء.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "البون يدل على التفاضل في المنزلة أو البعد الجسماني، لا على فاصل زمني بين حدثين فلكيين"

    - lemma: "الأَمَدُ القَمَرِيُّ المَدِّيُّ"
      contradicts:
        - text: "«الأمد: الغاية، تقول بلغ أمده أي غايته، قال الراغب: ولأمد والأبد متقاربان لكن الأبد عبارة عن مدة الزمان التي لا حد لها ولا تتقيد، ولا يقال أبد كذا، والأمد مدة لها حد مجهول إذا أطلق»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الأمد يدل على الغاية والمنتهى لا على الفاصل بين حدثين متعاقبين"

    - lemma: "المُهْلَةُ المَدِّيَّةُ القَمَرِيَّةُ"
      contradicts:
        - text: "«(المهلة) التؤدة والرفق يُقَال خُذ المهلة فِي أَمرك وَأخذ عَلَيْهِ المهلة تقدمه فِي سنّ أَو أدب وَبَقِيَّة جمر فِي الرماد»"
          source: "المعجم الوسيط"
          conflict: "المهلة تفيد التؤدة والإمهال لا الفترة الزمنية المقاسة بين حدثين طبيعيين"

    - lemma: "المِمْدَادُ القَمَرِيُّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "الفَاصِلُ القَمَرِيُّ المَدِّيُّ"
      decision: confirmed
      decision_reason: "تركيب وصفي سليم يجمع بين «الفاصل» (الفترة الفاصلة) و«القمري» (المتعلق بالقمر) و«المدّي» (المتعلق بالمدّ البحري). يتوافق مع مصطلح المورد الحديث «قمريمدّي» (lunitidal). التعبير واضح ومفهوم في السياق العلمي ويتبع نمط التسمية المصطلحية العربية في علوم البحار."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الفَاصِلُ القَمَرِيُّ المَدِّيُّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "البَوْنُ المَدِّيُّ القَمَرِيُّ"
      source: stage1
      decision: removed
      decision_reason: "البون في المعجمات يدل على المسافة المكانية أو التفاضل في الشرف، لا على الفاصل الزمني. استعماله هنا نقل دلالي غير مسوّغ بشاهد."

    - lemma: "الأَمَدُ القَمَرِيُّ المَدِّيُّ"
      source: stage1
      decision: removed
      decision_reason: "الأمد يدل على الغاية والمنتهى لا على الفترة المحصورة بين حدثين. وقد فرّق الراغب بينه وبين المدة، فالأمد باعتبار الغاية والزمن باعتبار المبدأ والغاية معاً. المراد هنا فاصل بين حدثين لا غاية."

    - lemma: "المُهْلَةُ المَدِّيَّةُ القَمَرِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: "المهلة تفيد التؤدة والإمهال وتُستعمل في السياق الإرادي البشري (أمهله مهلة). استعمالها لظاهرة طبيعية مقاسة غير ملائم دلالياً."

    - lemma: "المِمْدَادُ القَمَرِيُّ"
      source: stage1
      decision: removed
      decision_reason: "وزن مِفْعال يدل على الآلة أو أداة القياس (مِيزان، مِقياس)، لا على الفترة الزمنية نفسها. المصطلح هنا يسمّي فاصلاً زمنياً لا أداة قياس. فضلاً عن عدم وجود أي شاهد معجمي."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
