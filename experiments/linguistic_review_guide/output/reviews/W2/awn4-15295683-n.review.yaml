      decision: revise
      reason: "التعريف الحالي سليم المضمون لكنه ترجمة شبه حرفية للتعريف الإنجليزي. يمكن تحسينه بأسلوب معجمي عربي أوضح مع إضافة الجنس القريب (فترة زمنية) بصورة أصرح."
