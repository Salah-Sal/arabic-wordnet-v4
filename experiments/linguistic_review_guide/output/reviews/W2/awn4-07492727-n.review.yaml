stage4_content:
  definition:
    current: "حدث مفاجئ يجلب الحظ السعيد (مثل فرصة مفاجئة لكسب المال)"
    assessment:
      decision: revise
      reason: "التعريف الحالي وصفي بسيط، ويفضل صياغته بأسلوب معجمي أكثر دقة يشمل الجوانب المادية والمعنوية."
    authored:
      - type: terminological
        text: "وَاقِعَةٌ فَجَائِيَّةٌ تَحْمِلُ نَفْعاً أَوْ خَيْراً غَيْرَ مَرْقُوبٍ، كَالْحُصُولِ عَلَى مَالٍ أَوْ فُرْصَةٍ نَادِرَةٍ دُونَ سَعْيٍ مَقْصُودٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "طَفْرَة"
        examples:
          - text: "شهد قطاع العقارات طفرة هائلة أدت إلى تضاعف الثروات في وقت قياسي."
            type: usage
      - lemma: "رَوَاج"
        examples:
          - text: "أدى رواج السياحة في المنطقة إلى انتعاش الاقتصاد المحلي."
            type: usage
      - lemma: "لُقْطَة"
        examples:
          - text: "وجدتُ هذه اللوحة الثمينة في سوق المستعمل، لقد كانت لقطة حقيقية."
            type: usage
      - lemma: "مِنْحَة سَمَاوِيَّة"
        examples:
          - text: "جاءت تلك الوظيفة في وقت ضيقي كأنها منحة سماوية."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-07492727-n", definition_index: 0, text: "وَاقِعَةٌ فَجَائِيَّةٌ تَحْمِلُ نَفْعاً أَوْ خَيْراً غَيْرَ مَرْقُوبٍ، كَالْحُصُولِ عَلَى مَالٍ أَوْ فُرْصَةٍ نَادِرَةٍ دُونَ سَعْيٍ مَقْصُودٍ."}

stage5_enrichment:
  per_entry:
    - lemma: "رَوَاج"
      entry_id: "{auto}"
      root: "روج"
      maqayis_quote: "«الرَّاءُ وَالْوَاوُ وَالْجِيمُ لَيْسَ أَصْلًا... وَرَاجَ الشَّيْءُ يَرُوجُ، إِذَا عُجِّلَ بِهِ.»"
    - lemma: "طَفْرَة"
      entry_id: "{auto}"
      root: "طفر"
      maqayis_quote: "«الطَّاءُ وَالْفَاءُ الرَّاءُ كَلِمَةٌ صَحِيحَةٌ، يُقَالُ: طَفَرَ: وَثَبَ.»"
    - lemma: "لُقْطَة"
      entry_id: "{auto}"
      root: "لقط"
      maqayis_quote: "«اللَّامُ وَالْقَافُ وَالطَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى أَخْذِ شَيْءٍ مِنَ الْأَرْضِ قَدْ رَأَيْتَهُ بَغْتَةً وَلَمْ تُرِدْهُ.»"
    - lemma: "سَانِحَة"
      entry_id: "{auto}"
      root: "سنح"
      maqayis_quote: "«السِّينُ وَالنُّونُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يُحْمَلُ عَلَى ظُهُورِ الشَّيْءِ مِنْ مَكَانٍ بِعَيْنِهِ... ثُمَّ اسْتُعِيرَ هَذَا فَقِيلَ: سَنَحَ لِي رَأْيٌ فِي كَذَا، أَيْ عَرَضَ.»"
    - lemma: "رِزْقٌ سَاقَهُ اللَّهُ"
      entry_id: "{auto}"
      roots:
        - word: "رزق"
          root: "رزق"
          maqayis_quote: "«الرَّاءُ وَالزَّاءُ وَالْقَافُ أُصَيْلٌ وَاحِدٌ يَدُلُّ عَلَى عَطَاءٍ لِوَقْتٍ.»"
        - word: "ساقه"
          root: "سوق"
          maqayis_quote: "«السِّينُ وَالْوَاوُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ طَرْدُ الشَّيْءِ.»"
    - lemma: "مِنْحَة سَمَاوِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "منحة"
          root: "منح"
          maqayis_quote: "«الْمِيمُ وَالنُّونُ وَالْحَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عَطِيَّةٍ.»"
        - word: "سماوية"
          root: "سمو"
          maqayis_quote: "«السِّينُ وَالْمِيمُ وَالْوَاوُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْعُلُوِّ.»"
    - lemma: "غَنِيمَة بَارِدَة"
      entry_id: "{auto}"
      roots:
        - word: "غنيمة"
          root: "غنم"
          maqayis_quote: "«الْغَيْنُ وَالنُّونُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى إِفَادَةِ شَيْءٍ لَمْ يُمْلَكْ مِنْ قَبْلُ.»"
        - word: "باردة"
          root: "برد"
          maqayis_quote: "«الْبَرَدُ: الصِّغَارُ مِنَ الْغَمَامِ... وَالْبَرْدُ: خِلَافُ الْحَرِّ.»"
