stage1_review:
  assessment:
    concerns:
      - "المصطلحات الحالية تغطي جوانب محددة (الاقتصادية والروحية) ولكنها تفتقر إلى الألفاظ العامة التي تعبر عن 'الحظ المفاجئ' كلفظ 'لقطة' أو 'سانحة'."
    observations: "المجموعة تغطي مفاهيم متنوعة تبدأ من الطفرة الاقتصادية (boom) وصولاً إلى الهبة الإلهية (godsend) والكسب المفاجئ (windfall). اللمات الحالية جيدة ولكنها تحتاج إلى تعزيز بمصطلحات أكثر شمولاً وتداولاً."
  blind_candidates:
    - lemma: "سَانِحَة"
      generation_method: ishtiqaq
      justification: "تدل على الفرصة التي تعرض وتظهر فجأة."
    - lemma: "لُقْطَة"
      generation_method: ishtiqaq
      justification: "تُطلق على الشيء الثمين الذي يُعثر عليه صدفة وبغتة."
    - lemma: "غَنِيمَة بَارِدَة"
      generation_method: tarkib
      justification: "تعبير اصطلاحي عن الربح السهل الذي يأتي دون عناء."
    - lemma: "مِنْحَة سَمَاوِيَّة"
      generation_method: tarkib
      justification: "ترجمة دقيقة لمفهوم godsend وmanna من حيث المصدر والقدر."

stage2_evidence:
  per_lemma:
    - lemma: "رواج"
      confirm:
        - text: "«فترة رواج مفاجئ لحجم الصفقات ناتج عن ارتفاع مفاجئ في الطلب»"
          source: "المعجم الموحد لمصطلحات الاقتصاد"
    - lemma: "طفرة"
      confirm:
        - text: "«انتقالٌ سريعٌ من حالةٍ إلى حالة تَطَوُّر وارْتِفَاعٌ مُفاجِئٌ. يقال: طَفْرَةٌ اقتصادِيَّة»"
          source: "المعجم الكبير"
    - lemma: "رزق ساقه الله"
      confirm:
        - text: "«الفتح: النصر والرزق الذي يفتح الله به... الفتوح: حصول شيء لم يتوقع ذلك منه»"
          source: "التعريفات الفقهية للبركتي"
    - lemma: "سانحة"
      confirm:
        - text: "«ثم استعير هذا فقيل: سنح لي رأي في كذا، أي عرض.»"
          source: "مقاييس اللغة"
    - lemma: "لقطة"
      confirm:
        - text: "«اللُّقَطة: هو مالٌ يوجد على الأرض ولا يعرف له مالك... مال مرغوب فيه»"
          source: "التعريفات للجرجاني"
        - text: "«قطعة من الذهب توجد في المعدن»"
          source: "موسوعة السلطان قابوس"
    - lemma: "منحة سماوية"
      confirm:
        - text: "«المِنحة السّماوية: لُقْيَة أو مُصادفة سعيدة غير منتظرة [فكأنها مُرسلة من عند الله].»"
          source: "المورد الحديث"
    - lemma: "مكسب طارئ"
      confirm:
        - text: "«حظ غير مرتقب؛ كسب مفاجئ أو غير متوقع» (تحت windfall)"
          source: "المورد الحديث"
    - lemma: "غنيمة باردة"
      confirm:
        - text: "«الْغَيْنُ وَالنُّونُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى إِفَادَةِ شَيْءٍ لَمْ يُمْلَكْ مِنْ قَبْلُ»"
          source: "مقاييس اللغة"

