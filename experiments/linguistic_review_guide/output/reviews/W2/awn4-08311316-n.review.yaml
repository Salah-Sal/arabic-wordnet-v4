stage4_content:
  definition:
    current: "شعب (أو دول) غير متحالفين مع آخرين في حلف أو معاهدة"
    assessment:
      decision: revise
      reason: "لتحسين الصياغة المعجمية وجعلها أكثر شمولاً ودقة في وصف الكيان السياسي."
    authored:
      - type: terminological
        text: "جَمَاعَةٌ مِنَ النَّاسِ أَوْ مَجْمُوعَةٌ مِنَ الدُّوَلِ تَلْتَزِمُ بِمَوْقِفِ الْحِيَادِ وَتَمْتَنِعُ عَنِ الِانْضِمَامِ إِلَى الْأَحْلَافِ العَسْكَرِيَّةِ أَوِ الْمُعَاهَدَاتِ السِّيَاسِيَّةِ الْمُتَنَافِسَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "عَدَمُ الِانْحِيَازِ"
        examples:
          - text: "تَمَسَّكَتِ الدُّوَلُ النَّاشِئَةُ بِمَبْدَأِ عَدَمِ الِانْحِيَازِ لِتَجَنُّبِ الصِّرَاعَاتِ الدَّوْلِيَّةِ."
            type: usage
      - lemma: "الْمُحَايِدُونَ"
        examples:
          - text: "يَسْعَى الْمُحَايِدُونَ دَائِمًا لِتَقْرِيبِ وُجِهَاتِ النَّظَرِ بَيْنَ الدُّوَلِ الْمُتَحَارِبَةِ."
            type: usage
      - lemma: "غَيْرُ الْمُنْحَازِينَ"
        examples:
          - text: "شَكَّلَتْ مَجْمُوعَةُ الدُّوَلِ غَيْرِ الْمُنْحَازَةِ كُتْلَةً تَصْوِيتِيَّةً هَامَّةً فِي الْأُمَمِ الْمُتَّحِدَةِ."
            type: usage
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-08311316-n"
          definition_index: 0
          text: "جَمَاعَةٌ مِنَ النَّاسِ أَوْ مَجْمُوعَةٌ مِنَ الدُّوَلِ تَلْتَزِمُ بِمَوْقِفِ الْحِيَادِ وَتَمْتَنِعُ عَنِ الِانْضِمَامِ إِلَى الْأَحْلَافِ العَسْكَرِيَّةِ أَوِ الْمُعَاهَدَاتِ السِّيَاسِيَّةِ الْمُتَنَافِسَةِ."

