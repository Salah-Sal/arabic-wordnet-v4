stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'عدم الانحياز' هي مصدر يدل على السياسة أو المبدأ، بينما التعريف يصف 'شعب أو دول' (الفاعلين)."
      - "نقص التشكيل في اللمّة الحالية."
    observations: "المفهوم يشير إلى 'nonalignment' كحالة جماعية (دول أو شعوب). في العربية، يُستخدم مصطلح 'عدم الانحياز' اسماً للحركة والسياسة، بينما يُستخدم 'المحايدون' أو 'غير المنحازين' وصفاً للكيانات نفسها. سأقوم بتأكيد اللمّة الحالية مع إضافة التشكيل، وإضافة اللمّات الواصفة للفاعلين."
  blind_candidates:
    - lemma: "عَدَمُ الِانْحِيَازِ"
      generation_method: tarkib
      justification: "المصطلح السياسي المعياري العربي المقابل لـ nonalignment."
    - lemma: "الْمُحَايِدُونَ"
      generation_method: ishtiqaq
      justification: "جمع 'محايد'، وهو اللفظ الأدق لوصف الشعوب أو الدول التي لا تنحاز لطرف، ويتفق مع التعريف."
    - lemma: "غَيْرُ الْمُنْحَازِينَ"
      generation_method: tarkib
      justification: "وصف مباشر مستخدم في الأدبيات السياسية للدلالة على الدول خارج الأحلاف الكبرى."
    - lemma: "مُسْتَقِلُّونَ"
      generation_method: ishtiqaq
      justification: "في سياق الأحلاف، يُطلق على الدول غير المنضمة أنها دول مستقلة القرار."

stage2_evidence:
