    - lemma: "عَدَمُ الِانْحِيَازِ"
      confirm:
        - text: "«سياسة عدم الانحياز (في الاصطلاح الحديث): عدم الانضمام إلى فريق دون فريق»"
          source: "المعجم الوسيط"
        - text: "«عَدَم الانحياز. nonalignment»"
          source: "المورد الحديث"
    - lemma: "الْمُحَايِدُونَ"
      confirm:
        - text: "«مَحَايِد: من (ح ي د) المائل عن الشيء، والكاف عن خصومة غيره.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«المُحايدُ: neutral»"
          source: "المعجم الكبير"
    - lemma: "غَيْرُ الْمُنْحَازِينَ"
      confirm:
        - text: "«الانحياز: الانضمام وسياسة عدم الانحياز: عدم الانضمام إِلَى فريق دون فريق»"
          source: "المعجم الوسيط"

