stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة عبارة عن ترجمة حرفية دقيقة للمصطلح الأجنبي (Generally Accepted Accounting Principles)، وعلى الرغم من طولها، إلا أنها مصطلح مسكوك ومعتمد في المعايير المهنية للمحاسبة."
    observations: "المفهوم يشير إلى مجموعة المعايير، والقواعد، والإجراءات المنظمة للعمل المحاسبي. التركيب الإضافي الوصفي هنا يعكس دقة المفهوم ومطابقته للنظام المالي العالمي."
  blind_candidates:
    - lemma: "الْمَبَادِئُ الْمُحَاسَبِيَّةُ"
      generation_method: tarkib
      justification: "تعبير يجمع بين الأساس (المبادئ) والوصف (المحاسبية) للدلالة على القواعد الحاكمة للمهنة."
    - lemma: "الْمَعَايِيرُ الْمُحَاسَبِيَّةُ"
      generation_method: tarkib
      justification: "مصطلح معتمد وموازٍ يدل على القواعد والإرشادات الواجب اتباعها في المحاسبة."
    - lemma: "الْأَعْرَافُ الْمُحَاسَبِيَّةُ"
      generation_method: tarkib
      justification: "يشير إلى ما تعارف عليه المحاسبون من ممارسات مقبولة."
    - lemma: "الْأُصُولُ الْمُحَاسَبِيَّةُ"
      generation_method: tarkib
      justification: "تعبير تراثي-حديث يجمع بين الأصل (القاعدة) والتخصيص (المحاسبة)."

