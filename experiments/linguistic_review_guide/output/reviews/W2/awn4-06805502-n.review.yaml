        مما يُوهم الدورانية. كما أن «الظلام أو الطقس السيئ» يُقيِّد تطبيق المصطلح بسياق
        واحد في حين يُستخدم الشعاع الراديوي في حالات عديدة (ضباب، ليل، رؤية محدودة).
