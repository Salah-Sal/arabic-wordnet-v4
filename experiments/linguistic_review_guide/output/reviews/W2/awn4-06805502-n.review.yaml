            مما يُوقع التباساً معجمياً، ويجعل المرشّح غير صالح للتمييز.

    - lemma: "حُزْمَة لاسِلْكِيَّة"
      confirm:
        - text: "«حزمة (beam)» - مجال: الفيزياء؛ الاستشعار عن بعد؛ الحرب الإلكترونية"
          source: "سلسلة المعاجم الموحدة (ALECSO)"
        - text: "«حزمة ضوئية للهبوط (landing beam)»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"

    - lemma: "شُعَاعٌ مَلاحِيّ"
      confirm:
        - text: "«شعاع راديوي (radio ray)»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
      expands:
        - text: "«مسار شعاع (لاسلكي) مباشر (direct ray path)»"
          source: "موسوعة الكهرباء IEC 60050"
          addition: >-
            يُثبت شيوع «شعاع + صفة» في السياقات التقنية، مما يمنح «شعاع ملاحي» قابلية
