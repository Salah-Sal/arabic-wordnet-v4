# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان بدون تشكيل كامل: (حزمة موجية) و(شُعَاع راديو) ناقصتا الضبط"
      - "شُعَاع راديو: استخدام المقترض «راديو» اسماً في موضع الصفة؛ الأقيس صرفياً: «رَادِيُوِيّ» أو «لاسلكي»"
      - "التعريف العربي الحالي مترجَم ترجمةً حرفيةً من الإنجليزية ولا يُصرِّح بطبيعة الإشارة الكهرومغناطيسية"
    observations: >-
      المجموعة الترادفية تُمثِّل مفهوماً تقنياً حديثاً في علم الملاحة الجوية، هو الشعاع الراديوي المُوجَّه
      الذي يُستخدم لإرشاد الطائرات في حالات انعدام الرؤية. المفهوم ليس غريباً عن العربية من حيث
      الاستعارة البنيوية (النور والهداية في الظلام حاضران في الموروث اللغوي)، غير أنه مصطلح تقني
      وضعته المجامع المعجمية الحديثة. اللمّة الأولى (حزمة موجية) تُبرز البنية الفيزيائية للإشارة،
      أما الثانية (شعاع راديو) فتُبرز طبيعة الانبثاث الاتجاهي. كلتاهما مُثبَّتة معجمياً وإن افتقرتا
      إلى ضبط كامل. من الجدير بالملاحظة أن ابن فارس يُعرِّف شعع بـ«التفرق والانتشار» وهو ما يبدو
      متناقضاً مع الشعاع الضيق، غير أن هذا يعكس الأصل البصري للكلمة (خيوط الضوء المنتشرة معاً)
      وقد وسَّعته الاصطلاحية الحديثة ليشمل الشعاع المُوجَّه.

  blind_candidates:
    - lemma: "مَنَارَة لاسِلْكِيَّة"
      generation_method: majaz
      justification: >-
        توسيع دلالي من «المنارة» (الفانوس البحري) إلى محطة الإرسال اللاسلكية؛ كلاهما
        يُضيء المسار للمسافر في الظلام. التركيب وصفي (منارة + لاسلكية). المنارة في مقاييس
        اللغة «مَفعَلة من الاستنارة... ومنار الأرض: حدودها وأعلامها» — وهو ما يربطها
        بالإرشاد المكاني وتحديد المسار.

    - lemma: "مِهْدَاة"
      generation_method: ishtiqaq
      justification: >-
        مشتق من الجذر «هدى» على وزن مِفْعَالة، قياساً على مِرسالة ومِسماعة؛ والوزن
        مِفْعَالة يُلائم أدوات الإرشاد والتوجيه. المعنى: الأداة أو الإشارة التي تهدي
        الطائر إلى وجهته. استُبعد استخدام «مُرشِدة» لأن «تُرشد» وردت في التعريف ذاته.

    - lemma: "حُزْمَة لاسِلْكِيَّة"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من «حُزمة» (bundle/beam — موثَّق في معاجم الفيزياء والاستشعار عن بُعد)
        و«لاسلكية» (نسبة إلى اللاسلكي = wireless). يُحدد طبيعة الحزمة الراديوية دون
        الاستعانة بمقترض «راديو»، ويستند إلى الجذر العربي «سلك».

    - lemma: "شُعَاعٌ مَلاحِيّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من «شُعَاع» (ray/beam — موثَّق في الوسيط والكبير والمعاجم التقنية)
        و«مَلاحِيّ» (نسبة إلى الملاحة). يُبرز الوظيفة الأساسية للإشارة — التوجيه الملاحي —
        دون تحديد الوسيلة اللاسلكية، مما يُعطيه دلالةً أوسع من «شعاع راديو».


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة: 5 استعلامات
# ١. مطابقة دفعية: جميع اللمّات الموجودة + المرشحات
# ٢. جسر إنجليزي: radio beam, radio beacon, navigational beam, beam, landing beam
# ٣. FTS عربي: شعاع راديو, حزمة موجية, حزمة راديوية, شعاع لاسلكي
# ٤. مكوّنات المركبات: شعاع, حزمة, موجي, راديو
# ٥. مقاييس اللغة: جذور حزم, شعع, موج, نور
stage2_evidence:
  per_lemma:

    - lemma: "حزمة موجية"
      confirm:
        - text: "«حُزمة ضيِّقة (narrow beam)»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«حُزمة (bundle; beam)»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«حزمة (beam) - مجال: الاستشعار عن بعد»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
        - text: "«حزمة (beam) - مجال: الحرب الإلكترونية»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
        - text: "«حزمة راديوية ذات قدرة وسطية عالية للتزويد بطاقة كهربائية»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
      expands:
        - text: "«الحُزمة: ما جُمع ورُبط من كلِّ شيء»"
          source: "المعجم الوسيط"
          addition: >-
            أصل الحزمة العربي يدلّ على «الجمع والشد» (ابن فارس: «الحَاءُ وَالزَّاءُ وَالْمِيمُ
            أَصْلٌ وَاحِدٌ وَهُوَ شَدُّ الشَّيْءِ وَجَمْعُهُ»)؛ وهو يناسب تصوّر الموجات
            المجمّعة والمضغوطة في مسار ضيّق.
        - text: "«حزمة ضوئية للهبوط (landing beam)»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: >-
            يُثبت أن «حزمة + صفة» هو الأسلوب المعياري في المعاجم التقنية لتسمية الحزم
            الموجَّهة في الملاحة — يُعزّز شرعية «حزمة موجية» كمصطلح تقني.

    - lemma: "شُعَاع راديو"
      confirm:
        - text: "«شعاع راديويّ (radio ray)»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
        - text: "«مسار شعاع (لاسلكي) مباشر (direct ray path)»"
          source: "موسوعة الكهرباء IEC 60050"
        - text: "«مسار شعاع (لاسلكي) غير مباشر (indirect ray path)»"
          source: "موسوعة الكهرباء IEC 60050"
      expands:
        - text: "«الشُّعَاع: الضوءُ الذي يُرى كأنَّه خيوط، الواحدة شعاعة»"
          source: "المعجم الوسيط"
          addition: >-
            وصف الشعاع بأنه «كالخيوط» يُلائم تصوّر الإشارة الراديوية في مسارها الضيّق
            المُوجَّه — الشعاع الراديوي «خيط» غير منظور يهدي الطيار.
        - text: "«الشِّينُ وَالْعَيْنُ فِي الْمُضَاعَفِ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى التَّفَرُّقِ
            وَالِانْتِشَارِ. مِنْ ذَلِكَ الشُّعَاعُ شُعَاعُ الشَّمْسِ، سُمِّيَ بِذَلِكَ
            لِانْبِثَاثِهِ وَانْتِشَارِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            يكشف الاشتقاق عن مفارقة دلالية دقيقة: الشعاع في أصله «منتشر» بينما الشعاع
            الراديوي «ضيّق»؛ وهو استعمال مجازي ناجح اعتمده الاصطلاح الحديث.

    - lemma: "مَنَارَة لاسِلْكِيَّة"
      contradicts:
        - text: "«منارة لاسلكية (radio beacon)» - مجال: علوم البحار"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          conflict: >-
            radio beacon (منارة لاسلكية) هو محطة إرسال ثابتة تُرسل إشارات في جميع
            الاتجاهات، بينما radio beam هو الإشارة الموجية ذاتها المُوجَّهة في مسار ضيّق؛
            المفهومان مختلفان: الأول المصدر، والثاني الإشارة المنبثقة منه.

    - lemma: "مِهْدَاة"
      contradicts:
        - text: "«المُهَدَّأَة: يُقال تركته على مُهَيَّدِئَتِه [تصغير مهْدَأَةٍ]: على الحالة
