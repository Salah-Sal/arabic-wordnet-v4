# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حزمة موجية"
      decision: confirmed
      decision_reason: >-
        موثَّقة معجمياً بشواهد متعددة: «حزمة» مُعتمَدة في معاجم الفيزياء والاستشعار والحرب
        الإلكترونية للدلالة على beam، و«موجية» صفة قياسية من «موج». المركب الوصفي
        «حزمة موجية» وحدةٌ معجمية تقنية مُسكَّكة تُبرز البنية الفيزيائية للإشارة بوصفها
        حزمة من الأمواج الكهرومغناطيسية. اجتازت اختبار الاستبدال: لا يمكن إبدال «موجية»
        بـ«راديوية» دون تغيير دلالي (الأولى تُبرز طبيعة الموجة، الثانية تُبرز الوسيلة).
        تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        يُبرز المصطلح البنيةَ الفيزيائية للإشارة (حُزمة أمواج مضغوطة في مسار)؛ مُفضَّل
        في السياقات التقنية المتعلقة بالفيزياء والاتصالات حيث تُوصَف الإشارة من حيث
        طبيعتها الموجية الكهرومغناطيسية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُزْمَة مَوْجِيَّة"

    - lemma: "شُعَاع راديو"
      decision: confirmed
      decision_reason: >-
        موثَّق في معجم الحرب الإلكترونية (ALECSO) بصيغة «شعاع راديوي (radio ray)»،
        ومدعوم بسياقات «مسار شعاع (لاسلكي)» في موسوعة الكهرباء. «شعاع» راسخ في العربية
        للخيط المنبثق من مصدر، وقد وُسِّع اصطلاحياً ليشمل الأشعة الكهرومغناطيسية.
        الصيغة الحالية «شعاع راديو» تستخدم المقترض اسماً بدل الصفة؛ يُوصى بإضافة
        الصيغة الوصفية «شعاع راديوي» كشكل بديل معتمد في المعاجم التقنية.
        اجتازت اختبار الاستبدال: «شعاع لاسلكي» يختلف عن «شعاع راديو» في الإحالة الدقيقة
        (لاسلكي أعم، راديو أخص بالترددات الراديوية). تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُبرز المصطلح الطابع الاتجاهي للإشارة من منظور الانبثاث عن مصدر (كخيط ضوء
        مُسلَّط)؛ مُفضَّل في سياقات الملاحة الجوية والنقل حيث يُصوَّر الشعاع كدليل
        يُوجِّه الطيار من المطار. يختلف عن «حزمة موجية» بتركيزه على الاتجاهية لا الطبيعة
        الموجية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شُعَاعُ رَادِيُو"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "شُعَاعٌ رَادِيُوِيّ"

    - lemma: "مَنَارَة لاسِلْكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        تُعيَّن في المعاجم التقنية (علوم البحار) لـ«radio beacon» وهو محطة إرسال ثابتة،
        لا لـ«radio beam» الذي هو الإشارة المُوجَّهة ذاتها. الخلط بين المصدر (beacon)
        والإشارة (beam) خطأ مفهومي، ويُفضي إلى تداخل غير مقبول مع مجموعة ترادفية مختلفة.

    - lemma: "مِهْدَاة"
      source: stage1
      decision: removed
      decision_reason: >-
        تتصادم صوتياً وكتابياً مع «المُهَدَّأَة» الموجودة في المعجم الوسيط (من هدأ: السكون)،
        مما يُوقع التباساً اشتقاقياً. فضلاً عن أن الوزن مِفعَالة يُلائم آلات القياس
        والكشف أكثر من الإشارات البثّية المجردة. لا يُسهم في التمييز عن «حزمة موجية»
        أو «شعاع راديو» بنكهة دلالية خاصة.

    - lemma: "حُزْمَة لاسِلْكِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        يفشل اختبار التثبيت المعجمي: يمكن إبدال «لاسلكية» بـ«ضوئية» أو «صوتية» وتبقى
        الصياغة وصفيةً حرة، لا مصطلحاً مسكوكاً. علاوةً على ذلك تُغطّي «حزمة موجية»
        المعنى ذاته بكفاءة أعلى، وإضافة مرادف ثانٍ بحزمة تُربك الخريطة المصطلحية دون
        إضافة نكهة دلالية مستقلة.

    - lemma: "شُعَاعٌ مَلاحِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        «ملاحي» يُصنِّف السياق الوظيفي لكن لا يُحدِّد طبيعة الإشارة (راديوية/كهرومغناطيسية)؛
        وبالتالي هو أقل دقةً من «شعاع راديو». لم يُسجَّل كمصطلح مستقل في أيٍّ من المعاجم
        التقنية المُستعلَمة. إضافته تُضعف الحدود بين هذه المجموعة ومجموعات الملاحة الجوية
        العامة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
