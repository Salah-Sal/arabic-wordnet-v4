          موجَّهةٍ نحو مدرجِ الهبوط؛ تستقبل الطائرةُ هذه الإشاراتِ وتُعدِّل مسارَها
          وفقاً لشدَّتها، مما يُمكِّنها من التعرُّفِ على مسارِ الاقترابِ الصحيح حتى
          في ظروفِ الضبابِ الكثيفِ والظلامِ التام.
    actions:
