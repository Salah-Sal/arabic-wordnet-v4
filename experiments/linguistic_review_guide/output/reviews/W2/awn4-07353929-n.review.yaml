# Stage 1: Review + Generate (Blind)
stage1_review:
  assessment:
    concerns:
      - "اصطلاح 'اصطدام' يشير غالباً إلى التقاء عنيف (collision)، بينما 'تماس' و'تلامس' أكثر عمومية."
      - "التعريف الحالي مقتضب جداً ويحتاج لتفصيل يميّزه عن مجرد 'الاجتماع'."
    observations: "المجموعة تغطي المفهوم الفيزيائي للتماس المباشر بين الأجسام، مع إشارة للمستويات المختلفة من القوة (من اللمس البسيط إلى الاصطدام)."
  blind_candidates:
    - lemma: "تَمَاسّ"
      generation_method: ishtiqaq
      justification: "اللفظ الأصيل والمباشر للالتقاء البدني (من مسّ)."
    - lemma: "تَلَامُس"
      generation_method: ishtiqaq
      justification: "صيغة تفاعل تدل على الاشتراك في اللقاء البدني."
    - lemma: "اصْطِدَام"
      generation_method: ishtiqaq
      justification: "التقاء ناتج عن حركة وقوة (صدم)، يناسب 'striking' و'impinging'."
    - lemma: "الْتِقَاء"
      generation_method: ishtiqaq
      justification: "لفظ عام ورد في التعريف، يصلح كاسم للمجموعة."

# Stage 2: Evidence Gathering
stage2_evidence:
  per_lemma:
    - lemma: "تماس"
      confirm:
        - text: "«الجِرْمانِ: مسَّ أحدهما الآخر»"
          source: "المعجم الوسيط"
        - text: "«الملاقاة بحسب اللمس»"
          source: "دستور العلماء"
    - lemma: "تلامس"
      confirm:
        - text: "«تلامس: contact»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية"
    - lemma: "اصطدام"
      confirm:
        - text: "«اصطدام: impingement»"
          source: "المعجم الموحد لمصطلحات الفيزياء"
        - text: "«ارتطاما، صدم كلٌّ منهما الآخر»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "مماسّة"
      confirm:
        - text: "«المماسة: ملاقاة الجرمين بلا حائل بينهما»"
          source: "التوقيف على مهمات التعاريف"
        - text: "«ملاقاة الشيئين لا بالتمام بل بالأطراف»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "ارتطام"
      confirm:
        - text: "«اصطدم القطاران: ارتطما»"
          source: "معجم اللغة العربية المعاصرة"

# Stage 3: Lemma Analysis
stage3_analysis:
  per_lemma:
    - lemma: "تماس"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والأكثر دقة لوصف الالتقاء الفيزيائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَاسّ"
    - lemma: "تلامس"
      decision: confirmed
      decision_reason: "شائع في الاستعمال التقني والعلمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَلَامُس"
    - lemma: "اصطدام"
      decision: confirmed
      decision_reason: "ضروري لتغطية دلالة 'impinging' و'striking' التي تتضمن القوة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اصْطِدَام"
    - lemma: "مَمَاسَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تقني دقيق للملاقاة السطحية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَمَاسَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07353929-n"}
    - lemma: "ارْتِطَام"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي للاصطدام في سياقات الحركة والارتطام بالأجسام الصلبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ارْتِطَام", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-07353929-n"}

# Stage 4: Content
stage4_content:
  definition:
    current: "التقاء مادي لشيئين أو أكثر"
    assessment:
      decision: revise
      reason: "التعريف الحالي يفتقر للدقة الاصطلاحية التي تميز التماس عن مجرد الاجتماع المكاني."
    authored:
      - type: terminological
        text: "مُلاقاةُ بَدَنَيْن أو جِسْمَيْن أو أكْثَر مُباشَرَةً دُونَ حائلٍ بَيْنَهُما."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "تَمَاسّ"
        examples:
          - text: "يَمْنَعُ العازِلُ تَمَاسَّ الأَسْلاكِ المَكْشُوفَةِ."
            type: usage
      - lemma: "تَلَامُس"
        examples:
          - text: "يُؤَدِّي تَلَامُسُ السَّطْحَيْنِ إلَى ارْتِفَاعِ دَرَجَةِ الحَرَارَةِ بِسَبَبِ الاحْتِكَاكِ."
            type: usage
      - lemma: "اصْطِدَام"
        examples:
          - text: "تَحَطَّمَتِ السَّيَّارَةُ نَتِيجَةَ اصْطِدَامٍ قَوِيٍّ بِالجِدَارِ."
            type: usage
      - lemma: "مَمَاسَّة"
        examples:
          - text: "المَمَاسَّةُ بَيْنَ الجِسْمَيْنِ تُؤَدِّي لِتَبَادُلِ الشُّحْنَاتِ."
            type: usage
      - lemma: "ارْتِطَام"
        examples:
          - text: "أَدَّى ارْتِطَامُ الأَمْوَاجِ بِالصُّخُورِ إلَى نَحْتِهَا."
            type: usage
  actions:
    - command: update_definition
      params: {synset_id: "awn4-07353929-n", definition_index: 0, text: "مُلاقاةُ بَدَنَيْن أو جِسْمَيْن أو أكْثَر مُباشَرَةً دُونَ حائلٍ بَيْنَهُما."}

# Stage 5: Enrichment
stage5_enrichment:
  per_entry:
    - lemma: "تَمَاسّ"
      entry_id: "{auto}"
      root: "مسس"
      maqayis_quote: "«الْمِيمُ وَالسِّينُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى جَسِّ الشَّيْءِ بِالْيَدِ.»"
    - lemma: "تَلَامُس"
      entry_id: "{auto}"
      root: "لمس"
      maqayis_quote: "«اللَّامُ وَالْمِيمُ وَالسِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَطَلُّبِ شَيْءٍ وَمَسِيسِهِ أَيْضًا.»"
    - lemma: "اصْطِدَام"
      entry_id: "{auto}"
      root: "صدم"
      maqayis_quote: "«الصَّادُ وَالدَّالُ وَالْمِيمُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الصَّدْمُ، وَهُوَ ضَرْبُ الشَّيْءِ الصُّلْبِ بِمِثْلِهِ.»"
    - lemma: "مَمَاسَّة"
      entry_id: "{auto}"
      root: "مسس"
      maqayis_quote: "«الْمِيمُ وَالسِّينُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى جَسِّ الشَّيْءِ بِالْيَدِ.»"
    - lemma: "ارْتِطَام"
      entry_id: "{auto}"
      root: "رطم"
      maqayis_quote: "«الرَّاءُ وَالطَّاءُ وَالْمِيمُ كَلِمَةٌ تَدُلُّ عَلَى ارْتِبَاكٍ وَاحْتِبَاسٍ.»"
  per_sense:
    - lemma: "تَمَاسّ"
      sense_id: "{auto}"
      nuance: "اللفظ الأصيل الدال على ملاقاة الأجسام مُباشرة."
      mwe: false
    - lemma: "تَلَامُس"
      sense_id: "{auto}"
      nuance: "يركز على الجانب التفاعلي والتبادلي في اللمس."
      mwe: false
    - lemma: "اصْطِدَام"
      sense_id: "{auto}"
      nuance: "يؤكد على القوة والاندفاع المصاحب للالتقاء."
      mwe: false
    - lemma: "مَمَاسَّة"
      sense_id: "{auto}"
      nuance: "مصطلح تقني هندسي يركز على تلاقي الحدود الخارجية للأجسام."
      mwe: false
    - lemma: "ارْتِطَام"
      sense_id: "{auto}"
      nuance: "مرادف للاصطدام يبرز وقوع الجسم في آخر صلب."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"مسس","maqayis":"«الْمِيمُ وَالسِّينُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى جَسِّ الشَّيْءِ بِالْيَدِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"لمس","maqayis":"«اللَّامُ وَالْمِيمُ وَالسِّينُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَطَلُّبِ شَيْءٍ وَمَسِيسِهِ أَيْضًا.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"صدم","maqayis":"«الصَّادُ وَالدَّالُ وَالْمِيمُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ الصَّدْمُ، وَهُوَ ضَرْبُ الشَّيْءِ الصُّلْبِ بِمِثْلِهِ.»"}'
    - command: set_metadata
      params:
        entity_type: entry
