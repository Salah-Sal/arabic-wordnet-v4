        key: note
        value: '{"root":"رطم","maqayis":"«الرَّاءُ وَالطَّاءُ وَالْمِيمُ كَلِمَةٌ تَدُلُّ عَلَى ارْتِبَاكٍ وَاحْتِبَاسٍ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللفظ الأصيل الدال على ملاقاة الأجسام مُباشرة.","mwe":false}'
    - command: set_metadata
