# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (سلبية) مكتوبة بدون تشكيل"
      - "التعريف العربي الحالي يصف السلبية الخاملة (passivity: البطء والتردد وعدم التعاون) أكثر مما يصف السلبانية الفاعلة (negativism: الشك المعتاد والميل للإنكار والمعارضة)"
      - "المجموعة فقيرة بلمّة واحدة رغم وجود مصطلح أدق في المعاجم الحديثة"
      - "التعريف الحالي يبدو ترجمةً حرفيةً للإنجليزية وليس صياغةً معجميةً أصيلة"
    observations: >-
      المفهوم المُراد التعبير عنه هو السلبانية النفسية (negativism): نزعةٌ مزمنة تشمل
      التشكيك المعتاد في أقوال الآخرين، والميل إلى رفض الاقتراحات والأوامر ومعارضتها
      أو مقاومتها. للمفهوم بُعدان: موقف عقلي شكّي، ونزعة إلى المخالفة الفعلية.
      اللفظ 'سلبية' شائع لكنه في المعاجم أقرب إلى الخمول والتردد لا إلى الرفض الفاعل.
      يعمل التعريف الحالي ترجمةً حرفيةً يجدر إعادة صياغتها بأسلوب المعجم الوسيط.
  blind_candidates:
    - lemma: "إِبَاء"
      generation_method: majaz
      justification: >-
        مجاز بالاستعارة الوظيفية من اللفظ الكلاسيكي إِبَاء (= شدة الامتناع والأنفة، من
        أبِيَ يأبى). الوظيفة الدلالية متقاربة مع الرفض المعتاد للاقتراحات والأوامر؛
        غير أن الإباء في التراث يحمل دلالة إيجابية (عزة النفس ورفض الضيم) تعاكس
        الطابع المذموم للمفهوم.
    - lemma: "عِنَادِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من العِناد (جذر عند/عنو) على وزن فِعَالِيَّة المناسب للصفات
        الخُلُقية المزمنة. العناد في العربية يعني الإصرار على المعارضة والمقاومة
        رغم ظهور الحق، وهو محور التعريف المطلوب.
    - lemma: "إِنْكَارِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من الإنكار (جذر نكر) على وزن فِعَالِيَّة. يصف النزعة الثابتة إلى
        إنكار ما يُعرض من أفكار وأوامر. الإنكار مذكور صراحةً في التعريف بوصفه أحد
        مكوّنات السلبانية.
    - lemma: "جُحُودِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من الجُحود (جذر جحد) على وزن فُعُولِيَّة. الجحود يدل على الإنكار
        المعتاد مع العلم بالحقيقة، مما يتوافق مع 'الشك المعتاد' و'الميل للإنكار'
        الواردَين في التعريف.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "سلبية"
      confirm:
        - text: >-
            «(عند الفلاسفة): حال نفسية تؤدى إلى البطء والتردد في الحركة. وقد تنتهى إلى
            توقفها. تطلق أيضاً على اتجاه عام يقوم على الإضراب وعدم التعاون. (مج)»
          source: "المعجم الوسيط (مجمع اللغة العربية، entry_id 13791)"
        - text: >-
            «(عند الفلاسفة): حالٌ نفسيةٌ تؤدِّى إلى البُطْءِ والتردُّد فى الحركة, وقد
            تنتهى إلى توقفها, وتُطلقُ أيضًا على اتجاهٍ عامٍّ يقومُ على الإضراب وعدم
            التعاون. (مج)»
          source: "المعجم الكبير (مجمع اللغة العربية، entry_id 47073)"
        - text: "«السَّلْبِيَّةُ الفاعِلَة» [translation_en: active negativism] — «السَّلْبِيَّةُ اللافاعِلَة» [translation_en: passive negativism]"
          source: "المعجم الطبي الموحد (2009، entry_ids 613546-613547)"
        - text: "«سلبية، مذهب السلبية» [translation_en: negativism]"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، ALECSO (entry_id 400341)"
      expands:
        - text: "«سالبية: حالة أن يحمل الجسم شحنة سالبة» [translation_en: negativity، domain: Chemistry]"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992، entry_id 428000)"
          addition: "يُثبت اطّراد الجذر سلب في المصطلحات العلمية الحديثة على أوزان متعددة."

    - lemma: "إِبَاء"
      contradicts:
        - text: "«الإباء: شدة الامتناع، وكل أباء امتناع ولا عكس، ورجل أبي: يأبى تحمل الضيم.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622، entry_id 812785)"
          conflict: >-
            الإباء يرتبط برفض الضيم والإهانة صوناً للكرامة — دلالة إيجابية تختلف
            جوهرياً عن النزعة المذمومة في المجموعة.
        - text: "«إباء: الأنفة والامتناع.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry_id 913936)"
          conflict: "الأنفة صفة محمودة، في حين أن السلبانية نزعة مذمومة باعتراضها الاعتيادي على الآخرين."

    - lemma: "عِنَادِيَّة"
      contradicts:
        - text: "«العِنَادِيَّةُ: فرقة من السوفسطائية ينكرون حقائق الأشياء، ويزعمون أنها وهم وخيال باطل.»"
          source: "المعجم الوسيط (مجمع اللغة العربية، entry_id 19780)"
          conflict: >-
            عنادية مصطلح راسخ في الفلسفة والمنطق يشير إلى فرقة سوفسطائية أو نوع من
            القضايا المنطقية؛ استخدامه للمعنى النفسي يُفضي إلى اشتراك لفظي مُضلِّل.
        - text: "«العِنَادِيَّةُ: مَا يحكم فِيهَا بالتنافي بَين جزءيها لذاتي الجزءين.»"
          source: "معجم مقاليد العلوم للسيوطي (ت. 1505، entry_id 807254)"
          conflict: "يؤكد رسوخ اللفظ في علم المنطق بمعنى مختلف تماماً عن الصفة النفسية المطلوبة."

    - lemma: "إِنْكَارِيَّة"
      evidence_status: "no_material_found"

    - lemma: "جُحُودِيَّة"
      evidence_status: "no_material_found"

    - lemma: "السَّلْبانِيَّة"
      confirm:
        - text: >-
            «السَّلْبانيّة: «أ» موقف عقلي متَّسم بالشَّك في جُلّ ما يؤكِّده الآخرون.
            «ب» نزعة إلى رفض القيام بما يُسأل المرءُ أداءَهُ أو إلى القيام بخلافِهِ
            أو نقيضه.»
          source: "المورد الحديث (2008) [translation_en: negativism، entry_id 702960]"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "سلبية"
      decision: confirmed
      decision_reason: >-
        اللفظ موثَّق في المعجمين الوسيط والكبير بالمعنى النفسي-الفلسفي، ومستخدَم
        مصطلحاً معياراً للسلبانية في السياقات النفسية والاجتماعية. المعجم الطبي الموحد
        يُثبّته في مركّبَي 'السلبية الفاعلة' و'السلبية اللافاعلة' ترجمةً لـ active/passive
        negativism. يُحتفظ به لشيوعه وتوثيقه مع تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        اللفظ المعياري الأشيع في العربية المعاصرة، يشمل السلبانية بوجهيها الفاعل
        والخامل؛ يُستخدم في الفلسفة وعلم النفس والاجتماع على السواء، وهو أعم
        دلالةً من سلبانية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَلْبِيَّة"

    - lemma: "إِبَاء"
      source: stage1
      decision: removed
      decision_reason: >-
        الإباء في العربية محمود الدلالة (رفض الضيم والإهانة صوناً للكرامة)، يعاكس
        جوهر المفهوم المطلوب (نزعة مذمومة باعتياديتها). الدلالة الإيجابية للإباء
        تُشكّل حاجزاً اصطلاحياً يمنع توظيفه للنزعة السلبية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "عِنَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        مصطلح راسخ في العربية الفلسفية-المنطقية بمعنى مغاير تماماً (نوع من القضايا
        المنطقية أو فرقة سوفسطائية). توظيفه للمعنى النفسي يُفضي إلى اشتراك لفظي
        تاريخي مُضلِّل يتعذر تجاوزه.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "إِنْكَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على توثيق معجمي لهذا المصطلح. كذلك يدل الإنكار على فعل بعينه لا
        على نزعة مستديمة، مما يُضعف اطّراد المصطلح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "جُحُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على توثيق معجمي. الجحود في العربية يرتبط تحديداً بإنكار النعمة
        والكفران بالمعروف، لا بالرفض النفسي الاعتيادي للاقتراحات والأوامر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "السَّلْبانِيَّة"
      source: stage2
      decision: confirmed
      decision_reason: >-
        اكتُشف هذا المصطلح خلال جمع الأدلة. يُوثّقه المورد الحديث (2008) ترجمةً دقيقةً
        لـ negativism بتعريف يطابق بنود المجموعة تماماً: الشك المعتاد + النزعة إلى
        رفض ما يُطلب أو الإتيان بنقيضه. البنية الصرفية: مصدر صناعي من سَلْبان على
        وزن فَعْلانيَّة (الألف والنون للمبالغة في الصفة)، قياساً على رهبانيَّة وسلطانيَّة.
        اجتاز اختبار السكّ: لا يُمكن إبدال أي مكوّن بمرادف وإبقاء الدلالة ذاتها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        مصطلح أدق تخصصاً من سَلبية؛ يشدد على الموقف العقلي الشكّي الفاعل والنزعة
        إلى مخالفة المطلوب أو نقضه؛ يُفضَّل في السياقَين النفسي والطبي، ويقابل
        active negativism في المعجم الطبي الموحد.
      actions:
        - command: create_entry
          params:
            lemma: "سَلْبانِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صفة تتميز بالشك المعتاد والميل لإنكار أو معارضة أو مقاومة الاقتراحات أو الأوامر"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة حرفية للإنجليزية يفتقر إلى: (١) الجنس القريب الصريح
        كحالٍ أو نزعة، (٢) بنية المعجم الوسيط. كذلك يستهل بـ'صفة' وهو غير دقيق
        مع التصنيف n في المجموعة.
    authored:
      - type: terminological
        text: "حالٌ نفسيَّةٌ تتَّسم بالتشكيك المعتاد في أقوال الآخرين ومقترحاتهم، مع نزعةٍ دائمةٍ إلى رفض الأوامر ومعارضتها أو مقاومتها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "نزعةٌ نفسيَّةٌ راسخةٌ تجعل صاحبها يُنكر ما يُعرض عليه من أفكارٍ أو أوامر ويُعارضها أو يُقاومها على الدَّوام."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالٌ نفسيَّةٌ تتَّسم بالتشكيك المعتاد في أقوال الآخرين ومقترحاتهم، مع نزعةٍ دائمةٍ إلى رفض الأوامر ومعارضتها أو مقاومتها."

  examples:
    per_lemma:
      - lemma: "سَلْبِيَّة"
        examples:
          - text: "أبدى الطفلُ سَلْبيَّةً واضحةً إذ رفضَ الامتثالَ لأيِّ تعليماتٍ تصدرُ عن والديه."
            type: usage
      - lemma: "سَلْبانِيَّة"
        examples:
          - text: "وصفَ الطبيبُ النفسيُّ حالةَ المريض بالسَّلبانيَّة، فهو يرفضُ دوماً تنفيذَ ما يُطلب منه أو يُؤدِّي عكسَه."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أبدى الطفلُ سَلْبيَّةً واضحةً إذ رفضَ الامتثالَ لأيِّ تعليماتٍ تصدرُ عن والديه."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وصفَ الطبيبُ النفسيُّ حالةَ المريض بالسَّلبانيَّة، فهو يرفضُ دوماً تنفيذَ ما يُطلب منه أو يُؤدِّي عكسَه."


