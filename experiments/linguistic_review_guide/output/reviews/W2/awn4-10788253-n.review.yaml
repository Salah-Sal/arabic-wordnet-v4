        entity_id: "{auto}"
        key: note
        value: '{"root":"غزو","maqayis":"«الْغَيْنُ وَالزَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
