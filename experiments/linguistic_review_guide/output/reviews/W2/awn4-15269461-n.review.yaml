          source: "المعجم الكبير"
          conflict: "البرهة مدة زمنية ممتدة لا نقطة زمنية معيّنة"
        - text: "«(البرهة) الْمدَّة من الزَّمَان (ج) بره»"
          source: "المعجم الوسيط"
