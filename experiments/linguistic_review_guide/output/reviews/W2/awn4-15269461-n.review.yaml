stage1_review:
  assessment:
    concerns:
      - "اللمّة «ثانية» معناها الأول وحدة زمنية (١/٦٠ من الدقيقة)، لا نقطة زمنية معيّنة، واستعمالها بمعنى اللحظة مجازي"
      - "اللمّة «دقيقة» معناها الأول وحدة زمنية (١/٦٠ من الساعة)، واستعمالها بمعنى اللحظة مجازي كذلك"
      - "اللمّة «لحظة» مشتركة مع المُشتمِل المباشر (awn4-15205381-n) الذي يضمّ لحظة أيضاً، مما يخلق دوراناً تصنيفياً"
      - "جميع اللمّات تفتقر إلى التشكيل الكامل"
    observations: "المجموعة تمثّل مفهوم «نقطة زمنية بعينها» وهو مفهوم مركزي في اللغة العربية. اللمّتان «ثانية» و«دقيقة» تُستعملان في العربية المعاصرة بمعنى اللحظة مجازاً (في تلك الثانية / في تلك الدقيقة)، تماماً كما في الإنجليزية. لكنّ معناهما الأصلي هو الوحدة الزمنية. اللمّة «لحظة» هي الأنسب لهذا المفهوم لغوياً."
  blind_candidates:
    - lemma: "آنٌ"
      generation_method: majaz
      justification: "من الآن بمعنى الوقت الحاضر، والآنُ عند الفلاسفة والمتكلمين هو الفاصل بين الماضي والمستقبل، وهو نقطة زمنية لا مدة"
    - lemma: "سَاعَة"
      generation_method: majaz
      justification: "تُستعمل في العربية الفصحى بمعنى الوقت المعيّن أو اللحظة، كقوله تعالى: {لَا يَسْتَأْخِرُونَ سَاعَةً}، فهي نقطة زمنية لا وحدة قياس فحسب"
    - lemma: "بُرْهَة"
      generation_method: ishtiqaq
      justification: "من الجذر ب-ر-ه، تدلّ على مدة من الزمان، قد تصلح للدلالة على نقطة زمنية عند التخصيص"
    - lemma: "حِين"
      generation_method: majaz
      justification: "الحين وقت مبهم يصلح لجميع الأزمان قليلها وكثيرها، وقد يُخصَّص بمعنى لحظة معيّنة كقولهم: حينئذٍ"

stage2_evidence:
  per_lemma:
    - lemma: "ثَانِيَة"
      confirm:
        - text: "«(الثَّانِيَة) قسم من السِّتين قسما الَّتِي تَنْقَسِم إِلَيْهَا الدقيقة الستينة (مج)(ج) ثوان»"
          source: "المعجم الوسيط"
        - text: "«قسمٌ من الستين قسماً التى تنقسم إليها الدقيقة الستينية»"
          source: "المعجم الوسيط (OCR)"
        - text: "«قِسمٌ من سِتِّين قِسْماً تَنْقَسِمُ إليها الدَّقيقةُ السِّتِّينيَّة»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الثّانية: عند أهل الهيئة والمنجّمين هي سدس عشر الدقيقة التي هي سدس عشر الدرجة أو الساعة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التعريف يحصر الثانية في الوحدة الزمنية/الهندسية، لا في مفهوم النقطة الزمنية المعيّنة"
      expands:
        - text: "«دقاتُ قَلْبِ المرءِ قائِلةٌ له / إنَّ الحياةَ دقائقٌ وثوانِ» (شوقي)"
          source: "المعجم الكبير (شاهد شعري)"
          addition: "الشاهد يستعمل ثواني بمعنى الوحدات الزمنية لا النقاط الزمنية"

    - lemma: "دَقِيقَة"
      confirm:
        - text: "«(الدقيقة) وحدة زمنية تعادل جُزْءا من سِتِّينَ جُزْءا من السَّاعَة ووحدة لقياس خطوط الطول أَو الْعرض تَسَاوِي جُزْءا من سِتِّينَ جُزْءا من الدرجَة (مج)(ج) دقائق (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«وَحدَةٌ زَمَنِيَّةٌ تساوى جُزْءًا من سِتِّين جُزْءًا من السَّاعَةِ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الدقِيقَةُ: قسم من سِتِّينَ قسما من الدرجَة إِذا قسمت عَلَيْهَا»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "التعريف المبكر يحصرها في القسم الهندسي (الدرجة)، لا في مفهوم اللحظة"
      expands:
        - text: "«وقَدْ كذَبُوا عن ساعَةٍ ودَقِيقَةٍ / وما كذَبَتْ ساعاتُهم والدَّقائِقُ» (المعرّي)"
          source: "المعجم الكبير (شاهد شعري)"
          addition: "استعمال الدقيقة مقرونة بالساعة للدلالة على الوقت عموماً"

    - lemma: "لَحْظَة"
      confirm:
        - text: "«المرة من لَحَظ العَيْن الوقتُ القصير بمقدار لَحْظِ العين»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(اللحظة) الْمرة من لحظ الْعين وَالْوَقْت الْقصير بِمِقْدَار لحظ الْعين يُقَال سكت عَن الْكَلَام لَحْظَة»"
          source: "المعجم الوسيط"
        - text: "«اللحظة: مصدر لحظ الشيء هنيهة إذا نظر إليه بتحديق، ثم استعملت بمعنى الزمان اليسير بقدر ما تلحظ العين»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«لحظة» = instant (المعجم الموحد لمصطلحات الرياضيات والفلك)"
          source: "ARABTERM - الرياضيات والفلك"
          addition: "تأكيد استعمال لحظة مقابل instant في المصطلحية الحديثة"
        - text: "«لحظة» = instant (موسوعة الكهرباء IEC 60050)"
          source: "ARABTERM - Electropedia"
          addition: "تأكيد الاستعمال المصطلحي"
        - text: "«لحظة» = moment (المعجم الموحد لمصطلحات الجيولوجيا)"
          source: "ARABTERM - الجيولوجيا"
          addition: "لحظة تُستعمل مقابل moment أيضاً"

    - lemma: "آنٌ"
      source: stage1
      confirm:
        - text: "«الآن: الزمن الكائن الفاصل بين الماضي والآتي ذكره الحرالي. وعبر عنه غيره بأنه فصل الزمانين الماضي والمستقبل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الآن: هو اسمٌ للوقت الذي أنت فيه، وهو ظرفٌ غير متمكن»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«(الْآن) ظرف للْوَقْت الْحَاضِر يُقَال حضرت الْآن»"
          source: "المعجم الوسيط"
          conflict: "الآن ظرف مبني ملازم لأل التعريف ومقيّد بالزمن الحاضر فقط، لا يصلح اسماً لنقطة زمنية مطلقة"

