# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «علاقة بين المعاني» مقتضب جداً ولا يُميّز المفهوم عن مجموعته الأعم «عَلَاقَة لُغَوِيَّة» (علاقة بين الأشكال اللغوية أو المكونات)"
      - "اللمّة فريدة (لمّة واحدة فحسب) دون توثيق أي بديل مترادف شائع في التراث الفلسفي أو المصطلحية اللسانية"
    observations: >
      التعريف المُقنَّع «علاقة بين المعاني» يستدعي مصطلحاً يُشير إلى الصلة التي تنشأ على مستوى الدلالة والمعنى لا على مستوى الشكل اللفظي. الجذر «علق» يمتلك تاريخاً عميقاً في التراث المنطقي والبلاغي العربي بمعنى الارتباط بين الأمور المعقولة، وقد مَيَّزَ التراث بين «العَلاقة» بالفتح (للمعقولات/المعاني) و«العِلاقة» بالكسر (للمحسوسات)، مما يُتيح توليد مصطلحات من جذور عربية أصيلة. النمط الوصفي «X دَلَالِيّ» منتج في المصطلحية العربية الحديثة (حَقْل دَلَالِيّ، بِنْيَة دَلَالِيَّة، شَبَكَة دَلَالِيَّة). التعريف يحتاج إلى توسيع يُحدد الجنس القريب ويُمايز الفصل النوعي.
  blind_candidates:
    - lemma: "صِلَةٌ مَعْنَوِيَّةٌ"
      generation_method: tarkib
      justification: "«صِلَة» بمعنى الوصل والارتباط (من الجذر وصل) + «مَعْنَوِيَّة» نسبةً إلى المعنى؛ تركيب وصفي يُعبّر عن الرابط القائم بين المعاني"
    - lemma: "تَعَالُقٌ دَلَالِيٌّ"
      generation_method: tarkib
      justification: "«تَعَالُق» مصدر تَفَاعَل من الجذر «علق» يدل على الارتباط المتبادل بين طرفين + «دَلَالِيّ» نسبةً إلى الدلالة؛ يُعبّر عن الارتباط المتبادل بين المعاني"
    - lemma: "رَابِطَةٌ مَعْنَوِيَّةٌ"
      generation_method: tarkib
      justification: "«رَابِطَة» اسم فاعل من «ربط» بمعنى ما يجمع شيئاً بشيء، موصوفة بـ«مَعْنَوِيَّة» للتخصيص في حقل المعاني؛ تركيب وصفي موازٍ لـ«رَابِطَة لُغَوِيَّة»"
    - lemma: "مُنَاسَبَةٌ دَلَالِيَّةٌ"
      generation_method: tarkib
      justification: "«مُنَاسَبَة» من «نَسَب» بمعنى الاتصال والمقابلة (قياسه اتصال شيء بشيء) + «دَلَالِيَّة» للتخصيص في حقل المعاني؛ يحمل معنى المناسبة والتوافق بين المدلولات"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# ملاحظة الاستعلامات المنفَّذة:
#   [Q1] دفعي لجميع اللمّات المركّبة (المصطلحات كاملةً) → لا نتائج (المركّبات غير مدخلة كوحدة)
#   [Q7] جسر إنجليزي (semantic / semantic relation) → مصطلحات دلالية عديدة لكن لا مقابل مباشر لـ"علاقة دلالية"
#   [Q6] بحث FTS بكلمات مفتاحية (علاقة، دلالية، معنى) → لا نتائج خارج ما سبق
#   [Q3] بحث المفردات المكوِّنة (علاقة، صلة، رابطة) في معاجم OCR/Hawramani → نتائج وافرة
#   [Maqayis] مقاييس اللغة للجذور: علق، دلل، ربط، نسب، وصل → نتائج

stage2_evidence:
  per_lemma:

    - lemma: "عَلَاقَة دَلَالِيَّة"
      confirm:
        - text: "«رابط موجود بين لفظين على الأقل، قد يكونان صوتين أو صرفيتين أو صوتيتين أو كلمتين أو جملتين. وقد يكون بالتأليف بين العناصر المتتالية في السلسلة الكلامية (علاقة مركبية) وقد تكون استبدالاً للعناصر بعضها بعضاً في الموقع نفسه (علاقة منسقية)»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«العلاقة بالفتح تُستعمل في المعقولات، وبالكسر في المحسوسات، وعند المنطقيين شيء بسببه يستصحب شيءٌ شيئاً»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«العلاقة: بالفتح رابطة بازبستن معنى بمعنى (= ربط معنى بمعنى آخر)»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«العلاقة: شيء يستصحب الأول الثاني كالعلية والتضايف»"
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: "«عَلَاقَة (فى علم البيان): المناسبة بين المعنى الأصلى والمعنى المراد فى المجاز والكناية»"
          source: "المعجم الوسيط"
          addition: "يكشف أن «عَلَاقَة» بالفتح راسخة في التراث البلاغي العربي بمعنى الصلة بين المعاني، مما يُعضّد الاختيار المصطلحي ويُثبت أصالة الضبط بالفتح في سياق المعاني"
        - text: "«العِلاقة بالكسر: علاقة القوس والسوط ونحوهما، وبالفتح: علاقة الخصومة والمحبة ونحوهما»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يُثبت التمييز بين الفتح (للمعاني والمعقولات) والكسر (للمحسوسات)؛ المصطلح اللساني «عَلَاقَة دَلَالِيَّة» بالفتح صحيح"

    - lemma: "صِلَةٌ مَعْنَوِيَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "تَعَالُقٌ دَلَالِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "رَابِطَةٌ مَعْنَوِيَّةٌ"
      confirm:
        - text: "«الرابطة: العلاقة والوصلة بين الشيئين»"
          source: "المعجم الوسيط"
        - text: "«الرابطة عند المنطقيين هي الشيء الدالّ على النسبة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الرابطة: اللفظة الدالة على نسبة ارتباط المحمول بالموضوع»"
          source: "معجم مقاليد العلوم للسيوطي"
      contradicts:
        - text: "«الرابطة عند المنطقيين هي الشيء الدالّ على النسبة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "«الرابطة» المنطقية تعني تحديداً copula (ما يدل على نسبة المحمول إلى الموضوع كـ«كان» و«هو»)، وهو معنى مغاير للعلاقة الدلالية بين المعاني"

    - lemma: "مُنَاسَبَةٌ دَلَالِيَّةٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عَلَاقَة دَلَالِيَّة"
      decision: confirmed
      decision_reason: >
        المصطلح متسق مع النمط الإنتاجي السائد في المصطلحية اللسانية العربية الحديثة (حَقْل دَلَالِيّ، بِنْيَة دَلَالِيَّة، شَبَكَة دَلَالِيَّة). كلمة «عَلَاقَة» موثّقة في التراث المنطقي والبلاغي الكلاسيكي بمعنى الصلة بين المعاني (بالفتح)، وهو الضبط الصحيح في سياق المعقولات/المعاني. النمط مُعضَّد بشواهد من معجم اللسانيات (2002). يجتاز اختبار التثبيت المعجمي بوصفه تعبيراً اصطلاحياً ثابتاً في المعجمية الحاسوبية (WordNet).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «العَلَاقَة الدَّلَالِيَّة» مجموعة فرعية من «العَلَاقَة اللُّغَوِيَّة»؛ تختص بالنشوء بين المعاني والمدلولات، بخلاف العلاقات اللغوية الصرفية أو الصوتية. تشمل الترادف والتضاد والاشتمال (فوقية/تحتية) والجزء/الكل والتناسب الدلالي، أي أنها تعمل على المستوى المعجمي الدلالي لا على المستوى الشكلي.

    - lemma: "صِلَةٌ مَعْنَوِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «الصِّلَة» في معاجم OCR والحوراماني تعني أولاً العطيَّة والجائزة، وثانياً الحرف الواصل في القافية، وثالثاً جملة الصلة في النحو. وليست مصطلحاً راسخاً للعلاقة المعنوية بين المفردات. يفشل اختبار التثبيت: «صِلَة دَلَالِيَّة» = «صِلَة مَعْنَوِيَّة» (وصف حر قابل للاستبدال بمرادفاته)، مما يدل على عدم التثبيت الاصطلاحي.
      evidence_assessment:
        case: no_material

    - lemma: "تَعَالُقٌ دَلَالِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «تَعَالُق» وزن صحيح قياساً (تَفَاعُل من علق بمعنى الارتباط المتبادل)، غير أنه غير موثَّق في أي معجم معياري، ويفتقر إلى التثبيت المعجمي. وجود «عَلَاقَة دَلَالِيَّة» الراسخة في مصطلحية اللسانيات يُغني عن إحياء هذه الصيغة، ولا تُوجد ضرورة اصطلاحية تستدعي إضافته.
      evidence_assessment:
        case: no_material

    - lemma: "رَابِطَةٌ مَعْنَوِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «رَابِطَة» موثّقة بمعنى العلاقة والوصلة (المعجم الوسيط)، إلا أن «الرابطة» في التقليد المنطقي العربي الكلاسيكي تُحيل تحديداً إلى الـ copula (الرابطة المنطقية بين الموضوع والمحمول)، وهو معنى مغاير للمطلوب. يُفضي هذا إلى الاشتراك اللفظي مع مصطلح منطقي راسخ. فضلاً عن ذلك، وجود «عَلَاقَة دَلَالِيَّة» يُغني عن إدراج مرادف مركّب جديد.
      evidence_assessment:
        case: mixed

    - lemma: "مُنَاسَبَةٌ دَلَالِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «مُنَاسَبَة» من «نَسَبَ» (قياسه: اتصال شيء بشيء) لها توظيف بلاغي في علاقة المجاز، لكنها لا تُسَكّ مصطلحاً تقنياً للعلاقة الدلالية بين المعاني في علم المعجم. غياب أي توثيق معجمي للمركّب يُسقطه.
      evidence_assessment:
        case: no_material


