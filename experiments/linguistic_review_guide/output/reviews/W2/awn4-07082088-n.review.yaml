# ════════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-07082088-n  |  ili: i73823  |  POS: n
# Definition (EN): triteness or triviality of style
# Definition (AR): تفاهة أو سطحية الأسلوب
# Lemmas (existing): إسفاف، ابتذال
# English lemma: bathos
# ════════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "غياب التشكيل الكامل عن اللمّتين الموجودتين (إسفاف، ابتذال)"
      - "المجموعة تضم لمّتين فقط مع وجود مصطلح نقدي راسخ مغفول (الركاكة) يستحق الإضافة"
      - "التعريف الحالي 'تفاهة أو سطحية الأسلوب' ترجمةٌ حرفية تفتقر إلى الأسلوب المعجمي الوسيطي"
    observations: >
      المجموعة تدور حول مفهوم ضعف الأسلوب الأدبي وتفاهته، وهو مجال له حضور متجذِّر
      في الموروث النقدي العربي. اللمّة المقنَّعة (بحكم التعريف الذي يشير إلى 'التفاهة
      والسطحية الأسلوبية') تستدعي أولاً النظر في مصطلحات البلاغة والنقد الأدبي
      الكلاسيكي. يُلاحَظ أن ثمة مصطلحاً بلاغياً معجمياً راسخاً يُعبِّر عن الضعف
      الأسلوبي بصورة تقنية أدق مما تحمله اللمّتان الموجودتان، وهو ما سيُكشَف في
      مرحلة جمع الأدلة.
  blind_candidates:
    - lemma: "الرَّكَاكَةُ"
      generation_method: majaz
      justification: >
        لفظ عربي تراثي من جذر ركك (الرقة والضعف)، انتُقِل به من معنى الضعف الجسدي
        والعقلي إلى وصف ضعف الأسلوب وتهافته؛ وهو توظيف مجازي وظيفي ناجح لأن
        العلاقة بين الضعف الجسدي والضعف الأسلوبي علاقة مشابهة وظيفية. استُعمل
        هذا اللفظ في النقد الأدبي للدلالة على ركاكة الصياغة وضعف التعبير.
    - lemma: "السُّوقِيَّةُ"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من 'سوق' على وزن فُعْلِيَّة، دالٌّ على النزول بالأسلوب إلى مستوى
        التداول العام الرخيص والتعبير الابتذالي، مما يلائم مفهوم سطحية الأسلوب
        وتفاهته. الوزن الصناعي يُنتج مفهوماً مجرداً من الصفة.
    - lemma: "التَّهَافُتُ"
      generation_method: ishtiqaq
      justification: >
        مصدر تفاعُل من جذر هفت (السقوط والتساقط المتتابع)، يُعبِّر عن تداعي الأسلوب
        وتساقطه قطعةً قطعة، مما يشير إلى ضعفه وتفاهته. الوزن تفاعُل يفيد التكرار
        والاستمرار في الحالة.
    - lemma: "الاِنْحِطَاطُ"
      generation_method: ishtiqaq
      justification: >
        مصدر انفعال من جذر حطط (الإنزال من علو)، يُعبِّر عن الهبوط بالأسلوب من مستوى
        رفيع إلى أدنى، وهو يلائم مفهوم سطحية الأسلوب وتفاهته من حيث إن كليهما يدل
        على انحدار عن معيار مرجعي أعلى.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة: ٦ استعلامات
#   ١) مطابقة دفعية: اسفاف+الاسفاف، ابتذال+الابتذال، ركاكة+الركاكة،
#                    سوقية+السوقية، تهافت+التهافت، انحطاط+الانحطاط
#   ٢) الجسر الإنجليزي: bathos, triteness, triviality, banality
#   ٣) إثراء بالمعرِّف (تعريفات + أمثلة) لعينة المدخلات المُستردَّة
#   ٤) FTS عربي: تفاهة، ركاكة، ابتذال
#   ٥) مقاييس اللغة: جذور سفف، بذل، ركك، هفت، حطط
#   ٦) بحث تكميلي: ابتذال+السوقية (للتحقق من غيابهما كمداخل مستقلة)
stage2_evidence:
  per_lemma:

    - lemma: "إِسْفَاف"
      confirm:
        - text: "«التَّدَنِّى فى القَوْلِ أو الفِعْل»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      expands:
        - text: "«الدنو من الأرض - المرور على وجه الأرض كما يسف الطير»"
          source: "كتاب العين (الخليل بن أحمد الفراهيدي، ت 786م)"
          addition: >
            يكشف عن أصل الاستعارة التي بنى عليها الإسفاف دلالته المجازية:
            الطائر المنحدر فويق الأرض صورةٌ لكل ما يهبط إلى الدنيء والتافه في القول.

    - lemma: "اِبْتِذَال"
      confirm:
        - text: "«(1) ابتذال؛ تفاهة / (2) شيء مبتذَل»"
          source: "المورد الحديث (2008) — مدخل: banality"
        - text: "«(1) الحضيض؛ الدَّرْك الأسفل / (2) anticlimax / (3) تفاهة؛ ابتذال / (4) عاطفيّة مُفْرِطة أو كاذبة»"
          source: "المورد الحديث (2008) — مدخل: bathos"
      expands:
        - text: "«الْبَاءُ وَالذَّالُ وَاللَّامُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ تَرْكُ صِيَانَةِ الشَّيْءِ، يُقَالُ: بَذَلْتُ الشَّيْءَ بَذْلًا، فَأَنَا بَاذِلٌ وَهُوَ مَبْذُولٌ، وَابْتَذَلْتُهُ ابْتِذَالًا»"
          source: "مقاييس اللغة (ابن فارس) — جذر: بذل"
          addition: >
            يكشف الجذرُ أن الابتذال في أصله ترك صيانة الشيء وإرساله على عواهنه
            دون حفظ، وهو المعنى الذي انتقل إلى الأسلوب: أسلوب مبتذَل هو أسلوب
            أُرسِل بلا عناية ولا رعاية حتى صار رخيصاً مكروراً.

    - lemma: "الرَّكَاكَةُ"
      confirm:
        - text: "«فى الأسلوب: ضَعْفُ الصِّياغَةِ اللُّغَوِيَّةِ وتهافُتُها. يقال: أُسْلُوبٌ فيه رَكَاكَةٌ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      expands:
        - text: "«الرَّاءُ وَالْكَافُ أَصْلَانِ: أَحَدُهُمَا وَهُوَ مُعْظَمُ الْبَابِ رِقَّةُ الشَّيْءِ وَضَعْفُهُ، وَالثَّانِي تَرَاكُمُ بَعْضِ الشَّيْءِ عَلَى بَعْضٍ»"
          source: "مقاييس اللغة (ابن فارس) — جذر: ركك"
          addition: >
            يؤكد أن أصل المعنى الرقة والضعف، وهو ما انتقل توظيفاً بلاغياً دقيقاً
            إلى وصف ضعف الصياغة اللغوية. ورود 'الركاكة' في جذرها الراسخ يُعزز
            مشروعية استعمالها مصطلحاً نقدياً.
        - text: "«الرجل يستضعفه النِّسَاء فَلَا يهبنه وَالَّذِي لَا يغار على أَهله»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة)"
          addition: >
            دلالة مغايرة (الرجل الضعيف لا يغار)، تُبيِّن تعدد معاني اللفظ وتؤكد
            ضرورة تقييد المعنى المراد بسياق الأسلوب كما في المعجم الكبير.

    - lemma: "السُّوقِيَّةُ"
      evidence_status: "no_material_found"

    - lemma: "التَّهَافُتُ"
      contradicts:
        - text: "«التهافت: التساقط شيئاً بعد شيء وقطعةً بعد قطعة والازدحام»"
          source: "التوقيف على مهمات التعاريف (المناوي، ت 1622م)"
          conflict: >
            المعنى الأصلي للتهافت التساقطُ الجزئي المتتابع، لا التفاهة الأسلوبية مباشرةً.
            وقد ورد في تعريف الركاكة (المعجم الكبير) فعلاً مساعداً في الوصف لا مرادفاً
            مستقلاً: 'ضعف الصياغة وتهافتها' — وهذا يُثبِت أن التهافت يصف الظاهرة
            من جانب واحد لا يُقابل الركاكة في الاستعمال.

    - lemma: "الاِنْحِطَاطُ"
      contradicts:
        - text: "«ارتبط الاصطلاح بعصر الانحطاط وتقهقر القيم خلال العصر الوسيط، لهذا كانت النّهضات بمثابة خروج من نفق الانحطاط»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مجال: اللغة والأدب"
          conflict: >
            الانحطاط في السياق الأدبي يُستعمل للدلالة على انحدار حضاري تاريخي شامل
            (عصر الانحطاط) لا على خاصية أسلوبية محددة في نص بعينه. دلالته أعم
            وأشمل مما تقتضيه المجموعة الترادفية.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إِسْفَاف"
      decision: confirmed
      decision_reason: >
        لفظ موثَّق في معاجم كلاسيكية (كتاب العين) وحديثة (المعجم الكبير) بدلالة التدني
        في القول والفعل، وهو توثيق يُلائم تماماً معنى المجموعة (تفاهة الأسلوب).
        اللفظ مشتق من جذر سفف (الانضمام والدنو)، وهو مجاز مسكوك راسخ في
        الاستعمال البلاغي والأدبي العربي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على الانحدار المتعمَّد في الأسلوب نحو الدنيء والمبتذل، ويُشعر بمعنى
        القصد والإرادة في التدني — كأن صاحبه اختار عن سابق علم النزول إلى الأسفل.
        الصورة الجذرية (الطائر المُسِفُّ قريباً من الأرض) تُضفي على الدلالة طابعاً
        حسياً تصويرياً يفتقر إليه 'الابتذال'.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِسْفَاف"

    - lemma: "اِبْتِذَال"
      decision: confirmed
      decision_reason: >
        مصطلح راسخ في النقد الأدبي المعاصر، مؤكَّد في المورد الحديث (2008) مرادفاً
        عربياً لـ'banality' و(الدلالة الثالثة من) 'bathos'. وإن لم يرد مدخلاً مستقلاً
        في المعاجم الكلاسيكية، فإن توثيقه الحديث وشيوعه في الاستعمال النقدي
        الفصيح يكفيان لإدراجه. جذره (بذل: ترك الصيانة) يؤسس الدلالة تأسيساً متيناً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبِّر عن فقدان الأسلوب قيمتَه بسبب التكرار المفرط والاعتياد والإهمال،
        ويُلمِح إلى طابع العمومية والرخص — أسلوب مبتذَل هو ما أُرسِل دون عناية
        حتى صار في متناول العامة دون تميُّز. يختلف عن 'الإسفاف' في أن الابتذال
        لا يستلزم قصداً، بل قد يكون نتيجة إهمال أو فقر في الموهبة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِبْتِذَال"

    - lemma: "الرَّكَاكَةُ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّقة في المعجم الكبير بالسياق الأسلوبي المباشر: «في الأسلوب: ضعف الصياغة
        اللغوية وتهافتها. يقال: أسلوب فيه ركاكة». هذا توثيق معجمي صريح يُلبِّي
        شروط الإضافة. وقد اجتاز اللفظ اختبار السكّ (يُقال: 'الركاكة' ولا يمكن إبدال
        مكوّناته)، واختبار التثبيت المعجمي بشهادة المعجم الكبير. الجذر ركك (الضعف
        والرقة) يُعزِّز مشروعية الاستعمال البلاغي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تختص بضعف الصياغة اللغوية وهشاشة البناء الأسلوبي من الناحية التقنية
        الحِرَفية — أي ضعف في الشكل والتركيب. تختلف عن 'الابتذال' (الذي يتعلق
        بالمضمون والفكرة وكونها مكررة رخيصة) وعن 'الإسفاف' (الذي يعني الانحدار
        الأسلوبي نحو الدنيء). الركاكة مصطلح نقدي أدبي راسخ يُقابل بالإنجليزية
        تقريباً mawkishness أو feebleness of style.
      actions:
        - command: create_entry
          params:
            lemma: "رَكَاكَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07082088-n"

    - lemma: "السُّوقِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُرصَد في المعاجم مصطلحاً خاصاً لوصف تفاهة الأسلوب أو ضعفه. دلالتها
        تنصبُّ على الابتذال الأخلاقي أو الاجتماعي (ما يخص أهل السوق من العامة)
        لا على سمة أسلوبية تقنية. تفشل في اختبار التثبيت المعجمي لهذا المعنى.

    - lemma: "التَّهَافُتُ"
      source: stage1
      decision: removed
      decision_reason: >
        معناه الجوهري التساقط المتتابع قطعةً قطعة (مادياً أو معنوياً)، وهو يصف
        الظاهرة من جانبها الشكلي (التداعي) لا كمصطلح مستقل لتفاهة الأسلوب.
        ورود 'تهافت' في تعريف 'الركاكة' (المعجم الكبير) بوصفه موصوفاً لها يؤكد أن
        التهافت فرع من الركاكة لا مرادف للمجموعة الترادفية.

    - lemma: "الاِنْحِطَاطُ"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال المعجمي والنقدي لـ'الانحطاط' في العربية المعاصرة يرتبط بالانحدار
        الحضاري الشامل (عصر الانحطاط) لا بسمة أسلوبية محددة. دلالته أعم
        وتتجاوز حدود المجموعة الترادفية المعنية بتفاهة الأسلوب وضعفه تحديداً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "تفاهة أو سطحية الأسلوب"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمةٌ حرفية لـ'triteness or triviality of style' تفتقر إلى
        الهيكل المعجمي الوسيطي (جنس + فصل). كما أنه يُورِد 'تفاهة' دون أن يُحدِّد
        ما يجعل الأسلوب تافهاً، مما يُفضي إلى الغموض. يستحق التعريف إعادة صياغة
        تُبرز الجنس القريب (الأسلوب أو السمة الأسلوبية) والفصل النوعي (انعدام
        الجدة والأصالة والعمق).
    authored:
      - type: terminological
        text: >
          سِمَةٌ تعتري الأسلوبَ فتُفقِده الجِدَّةَ والأصالة، وتجعلُهُ مُعوِزاً للعُمق
          والإبداع، مائلاً إلى الضعفِ والتَّسطُّح والتكرار
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          ما يُوصَفُ به الكلامُ حين يخلو من البِكارةِ والطَّرافة، ويكتسيَ طابعَ
          الضعفِ والتكرار فتسقط قيمتُهُ الأدبيّة
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-07082088-n"
