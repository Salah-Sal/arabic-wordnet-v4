    - lemma: "إِسْفَاف"
      entry_id: "{auto}"
      root: "سفف"
      maqayis_quote: >
        «السِّينُ وَالْفَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ انْضِمَامُ الشَّيْءِ إِلَى الشَّيْءِ
        وَدُنُوُّهُ مِنْهُ، ثُمَّ يُشْتَقُّ مِنْهُ مَا يُقَارِبُهُ. مِنْ ذَلِكَ أَسَفَّ
        الطَّائِرُ، إِذَا دَنَا مِنَ الْأَرْضِ فِي طَيَرَانِهِ... وَمِنَ الْبَابِ:
        السَّفْسَافُ: الْأَمْرُ الْحَقِيرُ. سُمِّيَ بِذَلِكَ لِأَنَّهُ مِنْ أَسَفَّ
        الرَّجُلُ لِلْأَمْرِ الدَّنِيِّ»

    - lemma: "اِبْتِذَال"
