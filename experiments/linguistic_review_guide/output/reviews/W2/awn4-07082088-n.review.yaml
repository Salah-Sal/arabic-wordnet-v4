            type: usage
      - lemma: "اِبْتِذَال"
        examples:
          - text: "يرى النقاد أن ابتذالَ الأسلوبِ آفةُ الكتابة الصحفية حين تُؤثِر الإثارةَ السهلة على العمق والتحليل."
            type: usage
      - lemma: "رَكَاكَة"
        examples:
