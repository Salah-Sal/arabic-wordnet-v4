        الشَّيْءِ وَضَعْفُهُ، وَالثَّانِي تَرَاكُمُ بَعْضِ الشَّيْءِ عَلَى بَعْضٍ.
        فَالْأَوَّلُ الرِّكُّ، وَهُوَ الْمَطَرُ الضَّعِيفُ... وَرَكَّ الشَّيْءُ،
        إِذَا رَقَّ. وَمِنْهُ الرَّكَاكَةُ وَهُوَ الضَّعْفُ. وَالرَّكِيكُ: الضَّعِيفُ
        الرَّأْيِ»

  per_sense:
