        الشَّيْءِ، يُقَالُ: بَذَلْتُ الشَّيْءَ بَذْلًا، فَأَنَا بَاذِلٌ وَهُوَ
        مَبْذُولٌ، وَابْتَذَلْتُهُ ابْتِذَالًا»

