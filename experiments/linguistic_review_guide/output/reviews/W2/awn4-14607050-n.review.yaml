      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"كسر","maqayis":"«الْكَافُ وَالسِّينُ وَالرَّاءُ أَصْلٌ صَحِيحٌ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"حجر","root":"حجر","maqayis":"«الْحَاءُ وَالْجِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ...»"},{"word":"فلاسفة","root":"فلسف","maqayis":"عجمي معرب"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم النوعي للمادة المحولة، ويرتبط بالسائل غالباً.","mwe":false}'
