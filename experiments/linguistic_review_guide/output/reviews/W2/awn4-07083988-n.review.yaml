      generation_method: ishtiqaq
      justification: >
        مصدر رباعي من الجذر (فصح) على وزن (إِفْعَال)؛ أَفْصَحَ يُفْصِح إِفْصَاحاً.
        يدل على إخراج ما في النفس إلى دائرة الوضوح والكشف، وهو مرتبط بمعنى التعبير الصريح
        عن الذات دون غموض. فضّلناه على «فصاحة» لأنه مصدر الفعل المتعدي المعنوياً.
    - lemma: "أَدَاء"
      generation_method: majaz
      justification: >
        إزاحة دلالية من «الإتيان بالمؤقتات» إلى «طريقة إيصال المعنى»؛ يُستعمل في النقد
        الأدبي والفني بمعنى أسلوب تقديم العمل. وظيفته الأصيلة (الإيصال) قريبة من مفهوم
        التعبير عن النفس. فضّلنا الإحياء الدلالي هنا على الاشتقاق الجديد.
    - lemma: "تَلَفُّظ"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل «تلفَّظَ» من الجذر (لفظ) على وزن (تَفَعُّل)؛ يعني فعل إنتاج الكلام
        وإخراجه. يُشير إلى الطريقة الخاصة في إطلاق الألفاظ وهو أقرب إلى الجانب الفردي
        في التعبير. استُخدم حديثاً في اللسانيات مقابل enunciation.
    - lemma: "بَيَان"
