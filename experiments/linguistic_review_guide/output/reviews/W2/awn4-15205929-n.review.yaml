          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«المَوْعِدُ: الوعد ومكانه وزمانه والعهد»"
          source: "المعجم الوسيط"
          addition: "الموعد يصلح للدلالة على الزمان المحدد، فيصحّ «موعد المغادرة» بمعنى زمانها المقرر"

    - lemma: "وَقْتُ الرَّحِيلِ"
      confirm:
        - text: "«وقت الرحيل، وقت الذهاب — departure time»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
      expands:
        - text: "«رَحَلَ: الرَّاءُ وَالْحَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُضِيٍّ فِي سَفَرٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الرحيل أصيل في الدلالة على المُضيّ في السفر، مما يجعله ملائماً لسياق النقل"

    - lemma: "مِيعَادُ الِانْطِلَاقِ"
      expands:
        - text: "«المِيعَادُ: المواعدة ووقتُ الوعد وموضعه»"
          source: "المعجم الوسيط"
          addition: "الميعاد يدلّ على وقت الوعد لكنه أميل إلى المواعدة بين طرفين منه إلى جدول زمني لوسائل النقل"
        - text: "«محطة الذهاب، محطة الانطلاق — Departure station»"
          source: "مسرد الفن، التسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "الانطلاق مستعمل في سياق النقل لكن لم يُرصد مركب «ميعاد الانطلاق» بعينه"

    - lemma: "مِيقَاتُ الْمُغَادَرَةِ"
      expands:
        - text: "«وَقَتَ: أَصْلٌ يَدُلُّ عَلَى حَدِّ شَيْءٍ وَكُنْهِهِ فِي زَمَانٍ وَغَيْرِهِ. وَالْمِيقَاتُ: الْمَصِيرُ لِلْوَقْتِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الميقات أصلٌ في الدلالة على الحدّ الزمني لكنه يغلب في الاستعمال الديني والفلكي"
        - text: "«مقياس الزمن، ميقات — chronometer»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "ميقات في السياق العلمي الحديث ارتبط بأجهزة القياس لا بمواعيد النقل"


stage3_analysis:
  per_lemma:
    - lemma: "وَقْتُ الْمُغَادَرَةِ"
      decision: confirmed
      decision_reason: "لمّة مثبتة في معاجم المصطلحات المتخصصة (النقل، علوم البحار، الرياضة) بتطابق تامّ مع المفهوم. تحتاج فقط إلى إضافة التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "التعبير المعياري الأكثر حياداً وعموماً؛ يصلح لجميع وسائل النقل دون إيحاء بسجل لغوي معيّن"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَقْتُ الْمُغَادَرَةِ"

    - lemma: "مَوْعِدُ الْمُغَادَرَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "ورد «مواعيد المغادرة» في مسرد أربتيرم (لوحة الإعلان عن مواعيد المغادرة)، وكلمة «موعد» مثبتة في الوسيط بدلالة الزمان المحدد. المركب الإضافي وحدة معجمية ثابتة متداولة في المطارات والمحطات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُبرز الطابع الرسمي والتنظيمي للموعد؛ أقرب إلى لغة الإعلانات وجداول الرحلات في المطارات"
      actions:
        - command: create_entry
          params: {lemma: "مَوْعِدُ الْمُغَادَرَةِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "وَقْتُ الرَّحِيلِ"
      source: stage1
      decision: confirmed
      decision_reason: "مثبت في المعجم الموحد لمصطلحات علوم البحار بمعنى departure time تحديداً. جذر «رحل» أصيل في الدلالة على المُضيّ في السفر. المركب وحدة معجمية متداولة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يحمل ظلالاً أدبية وتراثية؛ أنسب للسياق البحري والبرّي التقليدي وللكتابة الأدبية"
      actions:
        - command: create_entry
          params: {lemma: "وَقْتُ الرَّحِيلِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مِيعَادُ الِانْطِلَاقِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُرصد المركب «ميعاد الانطلاق» في أيٍّ من المعاجم المتخصصة. «الميعاد» يغلب استعماله في سياق المواعدة بين طرفين (ميعاد الاستحقاق، ميعاد الدفع) لا في جداول النقل. لا يجتاز اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material

    - lemma: "مِيقَاتُ الْمُغَادَرَةِ"
      source: stage1
      decision: removed
      decision_reason: "«الميقات» في الاستعمال المعاصر مختصّ بالسياق الديني (مواقيت الصلاة، مواقيت الحج) والفلكي. لم يُرصد مركب «ميقات المغادرة» في معاجم النقل. إدخاله يُحدث التباساً مع الدلالة الدينية السائدة."
      evidence_assessment:
        case: no_material


