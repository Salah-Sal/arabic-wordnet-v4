# مراجعة المجموعة الترادفية: awn4-15205929-n — departure time
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «وقت المغادرة» بلا تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهي تعبير إضافي مركب — ينبغي إثراؤها بمرادفات"
    observations: "المفهوم واضح ومتداول في سياق النقل العام: الوقت المحدد لانطلاق وسيلة نقل. التعريف العربي سليم لغوياً ومطابق للتعريف الإنجليزي. مفردة «وقت» عامة، وقد يُستعاض عنها بـ«موعد» أو «ميعاد» أو «ميقات» حسب السجل اللغوي. المفهوم أصيل ثقافياً لا يحتاج إلى تعريب."

  blind_candidates:
    - lemma: "مَوْعِدُ الْمُغَادَرَةِ"
      generation_method: tarkib
      justification: "مركب إضافي من «موعد» (زمان الوعد) و«المغادرة»؛ شائع في لغة المطارات والمحطات ويوازي «وقت المغادرة» مع دلالة أقوى على الموعد المحدد سلفاً"
    - lemma: "وَقْتُ الرَّحِيلِ"
      generation_method: tarkib
      justification: "مركب إضافي من «وقت» و«الرحيل» (المُضيّ في السفر)؛ يُستعمل في السياق البحري والبري، والرحيل أعمّ من المغادرة إذ يشمل السفر بوسائل النقل"
    - lemma: "مِيعَادُ الِانْطِلَاقِ"
      generation_method: tarkib
      justification: "مركب إضافي من «ميعاد» (وقت الوعد والتواعد) و«الانطلاق»؛ الميعاد أدقّ من الوقت في الدلالة على الزمن المتّفق عليه، والانطلاق يناسب القطارات والحافلات"
    - lemma: "مِيقَاتُ الْمُغَادَرَةِ"
      generation_method: tarkib
      justification: "مركب إضافي من «ميقات» (الزمان المحدود المعيَّن لأمر ما) و«المغادرة»؛ الميقات أصل قرآني يدلّ على الحدّ الزمني المقطوع"


