          addition: "تأكيد أن الوقت يدلّ على مقدار زمني مقدَّر لأمر محدد، مما يناسب دلالة المجموعة"
        - text: "«مُغَادَرة — departure»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
