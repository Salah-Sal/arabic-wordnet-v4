# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06612141-n
# موضوع محادثة أو مناقشة — the subject matter of a conversation or discussion
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «موضوع محادثة أو مناقشة» يستخدم لفظ «موضوع» وهو أحد لمّات المجموعة ذاتها، ممّا يُحدث دوراناً تعريفياً جزئياً"
      - "لمّة «مَادَّة» معناها الأوّلي في المعاجم هو الجوهر المادي أو الأصل الذي يتكوّن منه الشيء، واستخدامها بمعنى «موضوع الحديث» استعمال ثانوي يحتاج توثيقاً"
    observations: "المجموعة تمثّل مفهوماً أصيلاً في الثقافة العربية، فالعرب يُعنَون بموضوعات الحديث والمناقشة عناية بالغة. اللمّتان الموجودتان تغطيان الاستعمال الحديث جيّداً: «مَوْضُوع» هو اللفظ الأكثر شيوعاً ومباشرة، و«مَادَّة» يُستعمل في السياقات الأكاديمية والإعلامية. المفهوم الأعلى (hypernym) هو المحتوى/المضمون/الرسالة، وهو تصنيف دلالي سليم."

  blind_candidates:
    - lemma: "شَأْن"
      generation_method: majaz
      justification: "إزاحة دلالية من معنى «الأمر والخطب» إلى ما يُتحدَّث فيه ويُناقَش، على سبيل تسمية الشيء بحاله"
    - lemma: "مَبْحَث"
      generation_method: ishtiqaq
      justification: "اشتقاق من جذر ب-ح-ث على وزن مَفْعَل (اسم مكان/موضع)، أي موضع البحث والمناقشة"
    - lemma: "مِحْوَر"
      generation_method: majaz
      justification: "إزاحة من معنى «العود الذي تدور عليه البكرة» إلى ما يدور عليه الكلام والنقاش، مجاز مستعمل في الإعلام الحديث"
    - lemma: "مَدَار"
      generation_method: majaz
      justification: "إزاحة من «موضع الدوران» إلى ما يجري عليه الحديث، كقولهم «مدار البحث كذا»"


stage2_evidence:
  per_lemma:
    - lemma: "مَوْضُوع"
      confirm:
        - text: "«(الْمَوْضُوع) الْمَادَّة الَّتِي يبْنى عَلَيْهَا الْمُتَكَلّم أَو الْكَاتِب كَلَامه»"
          source: "المعجم الوسيط"
        - text: "«(1) موضوع [مقالة أو حديث إلخ] (2) نقطة أو جانب من موضوع عام»"
          source: "المورد الحديث (ترجمة topic)"
        - text: "«(1) موضوع الكلام أو الكتابة (2) الفكرة الرئيسية [في عمل فنّيّ]»"
          source: "المورد الحديث (ترجمة theme)"
      expands:
        - text: "«وَمن الْأَحَادِيث المختلق و(فِي الفلسفة) الْمدْرك ويقابل الذَّات وَالْمقول عَنهُ (فِي الْمنطق) ويقابل الْمَحْمُول»"
          source: "المعجم الوسيط"
          addition: "للموضوع دلالات اصطلاحية أخرى في المنطق والفلسفة والحديث النبوي تختلف عن المعنى العام"
        - text: "«الموضوع: يطلق على معان. منها الشيء الذي عُيِّن للدلالة على المعنى. ومنها المحكوم عليه في القضية الحملية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تأكيد تعدد المعاني الاصطلاحية للفظ الموضوع"

    - lemma: "مَادَّة"
      confirm:
        - text: "«(مَادَّة الشَّيْء) أُصُوله وعناصره الَّتِي مِنْهَا يتكون حسية كَانَت أَو معنوية كمادة الْخشب ومادة الْبَحْث العلمي»"
          source: "المعجم الوسيط"
        - text: "«مادة الدرس = subject-matter»"
          source: "مسرد التربية (ARABTERM)"
      expands:
        - text: "«(الْمَادَّة) كل شَيْء يكون مدَدا لغيره وكل جسم ذِي امتداد وَوزن ويشغل حيزا من الْفَرَاغ»"
          source: "المعجم الوسيط"
          addition: "المعنى الأوّلي للمادة هو الجوهر المحسوس، واستعمالها بمعنى «موضوع الحديث» امتداد مجازي"
        - text: "«و(مواد الْعلم) مباحثه و(مواد القانون) الْجمل الَّتِي تَتَضَمَّن أَحْكَامه»"
          source: "المعجم الوسيط"
          addition: "استعمال «مواد» بمعنى مباحث العلم يدعم الدلالة على الموضوعات"

    - lemma: "شَأْن"
      contradicts:
        - text: "«(الشَّأْن) الْحَال وَالْأَمر ... والمنزلة وَالْقدر ... والخطب ... وَالْحَاجة»"
          source: "المعجم الوسيط"
          conflict: "الشأن يدلّ على الحال والأمر والخطب عموماً، لا على موضوع الحديث تحديداً"
        - text: "«الشأن: الحال والأمر الذي يتفق ويصلح، ولا يقال إلا فيما يعظم من الأحوال والأمور»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الشأن مختصّ بالأحوال العظيمة لا بموضوعات الحديث عامّةً"

    - lemma: "مَبْحَث"
      expands:
        - text: "«الدَّعْوى من حيث إنه يردُّ البحثُ عليها, أو على دَلِيلها»"
          source: "المعجم الكبير"
          addition: "المبحث مختصّ بالبحث العلمي والمنطقي أكثر من الحديث العام"

    - lemma: "مِحْوَر"
      confirm:
        - text: "«مِحوَر = theme»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
        - text: "«مِحوَر = topic»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
        - text: "«مِحْوَر، مُبْتَدَأ = Theme»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      contradicts:
        - text: "«(المحور) الْعود من حَدِيد أَو غَيره تَدور عَلَيْهِ البكرة وعود الخباز ... (فِي الهندسة) الْخط الْمُسْتَقيم الْوَاصِل بَين قطبي الكرة»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي للمحور هو الأداة المادية أو الخط الهندسي، واستعماله بمعنى «الموضوع» مجاز حديث لم يستقرّ تماماً في المعجمات التقليدية"

    - lemma: "مَدَار"
      expands:
        - text: "«(الْمدَار) مَوضِع الدوران ومدار الْأَمر مَا يجْرِي عَلَيْهِ غَالِبا»"
          source: "المعجم الوسيط"
          addition: "«مدار الأمر» يدلّ على ما يجري عليه الأمر غالباً، وهو قريب من معنى الموضوع لكنه أعمّ"
      contradicts:
        - text: "«ومسير الْكَوَاكِب السيارة حول الشَّمْس أَو هُوَ مسير الْقَمَر حول الْكَوَاكِب»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الغالبة في المعاجم فلكية/هندسية، واستعمال «مدار» بمعنى الموضوع المحض غير مستقلّ"


stage3_analysis:
  per_lemma:
    - lemma: "مَوْضُوع"
      decision: confirmed
      decision_reason: "لفظ «مَوْضُوع» هو الأكثر مطابقةً لمفهوم المجموعة، فالمعجم الوسيط يعرّفه صراحةً بأنه «المادة التي يبنى عليها المتكلم أو الكاتب كلامه»، وهو الاستعمال الشائع في الفصحى المعاصرة والمعاجم المصطلحية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على ما يدور حوله الكلام أو الكتابة بوجه عام، وهو اللفظ المحايد الشامل لجميع السياقات الرسمية وغير الرسمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَوْضُوع"

    - lemma: "مَادَّة"
      decision: confirmed
      decision_reason: "استعمال «مَادَّة» بمعنى موضوع البحث أو الحديث موثّق في المعجم الوسيط (مادة الشيء: أصوله وعناصره حسية أو معنوية كمادة البحث العلمي)، وشائع في السياق الأكاديمي والإعلامي والقانوني"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُستعمل غالباً في السياقات الأكاديمية والرسمية حيث يُراد المحتوى المعرفي أو المادة العلمية، كقولهم «مادة البحث» و«مادة الحوار»، وتحمل دلالة على الجوهر والأساس أكثر من مجرد العنوان"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَادَّة"

    - lemma: "شَأْن"
      source: stage1
      decision: removed
      decision_reason: "الشأن يدلّ على الحال والأمر والخطب العظيم، وهو أعمّ من موضوع الحديث ولا يختصّ بما يُناقَش ويُتحدَّث فيه، فلا ترادف دقيق مع المجموعة"
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَبْحَث"
      source: stage1
      decision: removed
      decision_reason: "المبحث مختصّ بالبحث العلمي والأكاديمي (الدعوى من حيث يردّ البحث عليها)، ولا يُستعمل لموضوع المحادثة العادية، فنطاقه أضيق من المجموعة"
      evidence_assessment:
        case: no_material

    - lemma: "مِحْوَر"
      source: stage1
      decision: removed
      decision_reason: "رغم توثيقه في مسارد ARABTERM بمعنى theme/topic، فإنّ المحور يحمل دلالة «المركزية» و«الدوران حوله»، وهو أخصّ من مطلق الموضوع. المعاجم التقليدية تقصره على المعنى المادي (عود البكرة) والهندسي (خط القطبين). ينتمي أكثر إلى مجموعة ترادفية تخصّ الفكرة المحورية أو المركزية"
      evidence_assessment:
        case: mixed

    - lemma: "مَدَار"
      source: stage1
      decision: removed
      decision_reason: "مدار الأمر يعني ما يجري عليه غالباً، وهو تعبير ظرفي أكثر منه مصطلحاً مستقلاً لمفهوم الموضوع. الدلالة الفلكية هي الغالبة في المعاجم"
      evidence_assessment:
        case: mixed


