  generation_notes: "اللفظ الأصلي 'مجرب' يحمل دلالتين في العربية: الخبرة (Experienced) والقيام بالتجربة (Experimenter)؛ لذا اقترحنا 'مختبر' لتعزيز الجانب الإجرائي."

