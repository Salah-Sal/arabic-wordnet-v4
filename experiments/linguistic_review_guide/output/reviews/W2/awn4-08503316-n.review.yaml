stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي ويحتاج إلى صياغة بأسلوب عربي معجمي."
    observations: "مفهوم المجموعة الفرعية ذات التوجه الخاص داخل تنظيم أكبر يُعبّر عنه في العربية مجازاً بكلمة (جناح) تشبيهاً بجناح الطائر، أو (كتلة) إذا اتحدوا في الموقف."
  blind_candidates:
    - lemma: "كُتْلَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الكتل وهو التجمع، وتُستخدم سياسياً للتعبير عن تكتل داخل هيئة."
    - lemma: "طَائِفَة"
      generation_method: ishtiqaq
      justification: "تدل على جماعة من الناس تمتاز برأي أو مذهب يجمعها."
    - lemma: "فِرْقَة"
      generation_method: ishtiqaq
      justification: "من الافتراق والتميز عن الأصل، تناسب المجموعة التي تنفرد بآرائها."
    - lemma: "شِقّ"
      generation_method: majaz
      justification: "مجاز من الشق وهو النصف أو الجزء، للدلالة على انقسام أو جزء من تنظيم."

stage2_evidence:
  per_lemma:
    - lemma: "جَنَاح"
      confirm:
        - text: "والطائفة من الشَّيْء"
          source: "المعجم الوسيط"
        - text: "إحدى جماعتَيْن يمثِّل كلٌّ منهما اتّجاهًا متعارضًا [في حزب أو هيئة إلخ]"
          source: "المورد الحديث"
    - lemma: "كُتْلَة"
      confirm:
        - text: "(الكتلة) الْقطعَة المجتمعة من الشَّيْء وَالْجَمَاعَة من النَّاس المتفقون على رَأْي وَاحِد"
          source: "المعجم الوسيط"
    - lemma: "طَائِفَة"
      confirm:
        - text: "جماعة من الناس يجمعهم مذهبٌ أو رأيٌ يمتازون به"
          source: "المعجم الكبير"
    - lemma: "فِرْقَة"
      evidence_status: "no_material_found"
    - lemma: "شِقّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "جَنَاح"
      decision: confirmed
      decision_reason: "كلمة معتمدة لغةً واستعمالاً للتعبير عن القسم أو الطائفة من الشيء، وشائعة جداً في السياق السياسي للتعبير عن أجنحة الحزب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَنَاح"
    
    - lemma: "كُتْلَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح أساسي في السياق البرلماني والسياسي (مثل الكتلة النيابية) للتعبير عن مجموعة ذات موقف واحد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "كُتْلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08503316-n"}

    - lemma: "طَائِفَة"
      source: stage1
      decision: removed
      decision_reason: "رغم صحتها لغوياً، إلا أن دلالتها المعاصرة تميل أكثر للتقسيمات الدينية أو الاجتماعية المستقلة، ولا تقتصر على مجموعة (داخل) حزب."

    - lemma: "فِرْقَة"
      source: stage1
      decision: removed
      decision_reason: "تميل دلالتها إما للمجموعات الفنية أو العسكرية، أو المذاهب المنشقة."

    - lemma: "شِقّ"
      source: stage1
      decision: removed
      decision_reason: "غير مستعملة كمصطلح مستقل لهذه الدلالة في السياق السياسي."

stage4_content:
  definition:
    current: "مجموعة داخل حزب سياسي أو هيئة تشريعية أو منظمة أخرى لها آراء متميزة أو وظيفة خاصة"
    assessment:
      decision: revise
      reason: "الصياغة الحالية تبدو كترجمة حرفية، الأفضل صياغتها بأسلوب المعاجم العربية مع الاحتفاظ بالدقة الدلالية."
    authored:
      - type: terminological
        text: "طائفةٌ من الناس داخلَ حِزبٍ سياسيّ أو هيئةٍ تشريعيّة أو منظّمة، تتميَّزُ بآراءٍ خاصّة وتوجّهٍ مُمَيَّز أو تضطلع بوظيفةٍ مُحَدَّدة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08503316-n", definition_index: 0, text: "طائفةٌ من الناس داخلَ حِزبٍ سياسيّ أو هيئةٍ تشريعيّة أو منظّمة، تتميَّزُ بآراءٍ خاصّة وتوجّهٍ مُمَيَّز أو تضطلع بوظيفةٍ مُحَدَّدة."}

  examples:
    per_lemma:
      - lemma: "جَنَاح"
        examples:
          - text: "سيطَرَ الجَنَاحُ المُتَشَدِّدُ على قرارات الحِزْب."
            type: usage
      - lemma: "كُتْلَة"
        examples:
          - text: "صَوَّتَت الكُتْلَةُ البَرْلَمَانِيَّةُ ضِدَّ مَشْروعِ القَانُون."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "سيطَرَ الجَنَاحُ المُتَشَدِّدُ على قرارات الحِزْب."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "صَوَّتَت الكُتْلَةُ البَرْلَمَانِيَّةُ ضِدَّ مَشْروعِ القَانُون."}

stage5_enrichment:
  per_entry:
    - lemma: "جَنَاح"
      entry_id: "{auto}"
      root: "جنح"
      maqayis_quote: "«(جَنَحَ) الْجِيمُ وَالنُّونُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْمَيْلِ وَالْعُدْوَانِ. وَيُقَالُ جَنَحَ إِلَى كَذَا، أَيْ مَالَ إِلَيْهِ... وَهَذَا هُوَ الْأَصْلُ ثُمَّ يُشْتَقُّ مِنْهُ»"
    - lemma: "كُتْلَة"
      entry_id: "{auto}"
      root: "كتل"
      maqayis_quote: "«(كَتَلَ) الْكَافُ وَالتَّاءُ وَاللَّامُ أُصَيْلٌ يَدُلُّ عَلَى تَجَمُّعٍ. يُقَالُ: هَذِهِ كُتْلَةٌ مِنْ شَيْءٍ، أَيْ قِطْعَةٌ مُجْتَمِعَةٌ.»"

  per_sense:
    - lemma: "جَنَاح"
      sense_id: "{auto}"
      nuance: "يُستخدم غالباً للتعبير عن قسم داخلي متميز في حزب أو تنظيم، يمثل تياراً فكرياً أو وظيفياً محدداً (كالجناح اليميني أو الجناح العسكري)."
      mwe: false
    - lemma: "كُتْلَة"
      sense_id: "{auto}"
      nuance: "تُستخدم للتعبير عن مجموعة تتفق على موقف أو مصلحة مشتركة، وتكثر في السياق البرلماني والمجالس النيابية."
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جنح","maqayis":"«(جَنَحَ) الْجِيمُ وَالنُّونُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْمَيْلِ وَالْعُدْوَانِ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"كتل","maqayis":"«(كَتَلَ) الْكَافُ وَالتَّاءُ وَاللَّامُ أُصَيْلٌ يَدُلُّ عَلَى تَجَمُّعٍ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُستخدم غالباً للتعبير عن قسم داخلي متميز في حزب أو تنظيم، يمثل تياراً فكرياً أو وظيفياً محدداً (كالجناح اليميني أو الجناح العسكري).","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُستخدم للتعبير عن مجموعة تتفق على موقف أو مصلحة مشتركة، وتكثر في السياق البرلماني والمجالس النيابية.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
