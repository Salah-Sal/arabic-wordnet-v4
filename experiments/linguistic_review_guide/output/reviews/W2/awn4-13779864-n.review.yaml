# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13779864-n
# large indefinite quantity / كمية كبيرة غير محددة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «كمية كبيرة غير محددة» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ يمكن إبدال «كبيرة» بـ«ضخمة» أو «هائلة» فتبقى العبارة صالحة، مما يُسقط اختبار السكّ."
      - "المجموعة تفتقر إلى لمّات مفردة عربية أصيلة رغم وجود ألفاظ كثيرة تدل على الكمية الكبيرة غير المحددة في العربية."
      - "اللمّة الحالية بدون تشكيل."
    observations: "المفهوم — كمية غير محددة تفوق المتوسط — مفهوم أساسي في العربية وله ألفاظ عديدة مثل الكَثْرة والوَفْرة. التعريف الحالي مقبول لكنه أقرب إلى ترجمة حرفية من الإنجليزية. ينبغي إثراء المجموعة بألفاظ عربية أصيلة مفردة."
  blind_candidates:
    - lemma: "كَثْرَة"
      generation_method: ishtiqaq
      justification: "مصدر من كَثُرَ على وزن فَعْلَة، يدل على نماء العدد والمقدار، وهو نقيض القِلّة. يُستعمل استعمالاً واسعاً للدلالة على كمية كبيرة غير محددة: «كَثْرَة من الناس»."
    - lemma: "وَفْرَة"
      generation_method: ishtiqaq
      justification: "مصدر من وَفُرَ على وزن فَعْلَة، يدل على الكثرة والتمام. يُستعمل في سياق الكمية الكبيرة مع دلالة على الاكتفاء والسعة: «وَفْرَة في الإنتاج»."
    - lemma: "فَيْض"
      generation_method: majaz
      justification: "أصله فيضان الماء، ثم استُعمل مجازاً في الكثرة من كل شيء. قال المعجم الوسيط: «الكثير الغزير». يُقال: «أعطاه غَيْضاً من فَيْض» أي قليلاً من كثير، فالفيض هنا هو الكمية الكبيرة."
    - lemma: "غَزَارَة"
      generation_method: ishtiqaq
      justification: "مصدر من غَزُرَ على وزن فَعَالَة، يدل على الكثرة من كل شيء. أصله في كثرة اللبن ثم عُمِّم."

stage2_evidence:
  per_lemma:
    - lemma: "كَمِّيَّة كَبِيرَة غَيْرُ مُحَدَّدَة"
      evidence_status: "no_material_found"

    - lemma: "كَثْرَة"
      confirm:
        - text: "«الكَثْرَةُ، ويكسرُ: نَقيضُ القِلَّةِ، كالكُثْرِ، بالضم، وهو مُعْظَمُ الشيءِ وأكثَرُهُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الْكَثْرَة) نَمَاء الْعدَد وَقد تسْتَعْمل فِي زِيَادَة الْفضل»"
          source: "المعجم الوسيط"
        - text: "«(كَثَرَ) الْكَافُ وَالثَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ خِلَافَ الْقِلَّةِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الكثرة: ضدّ الوحدة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "الكثرة في الاصطلاح تُقابَل بالوحدة لا بالقلة فحسب، مما يوسّع مجالها الدلالي"

    - lemma: "وَفْرَة"
      confirm:
        - text: "«(الوفرة) الْمرة وَالْكَثْرَة وَالشعر الْمُجْتَمع على الرَّأْس أَو مَا جَاوز شحمة الْأذن»"
          source: "المعجم الوسيط"
        - text: "«(وَفَرَ) الْوَاوُ وَالْفَاءُ وَالرَّاءُ: كَلِمَةٌ تَدُلُّ عَلَى كَثْرَةٍ وَتَمَامٍ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«وفرة» = abundance (مصطلح في الكيمياء والفيزياء والاقتصاد والزراعة)"
          source: "المعاجم الموحدة (ALECSO) — متعدد التخصصات"
          addition: "وَفْرَة مصطلح معتمد في المعاجم الموحدة العربية بمعنى abundance عبر تخصصات عديدة"

    - lemma: "فَيْض"
      confirm:
        - text: "«(الْفَيْض) الْكثير الغزير يُقَال أَعْطَانَا غيضا من فيض قَلِيلا من كثير وَرجل فيض كثير الْخَيْر»"
          source: "المعجم الوسيط"
        - text: "«ويَفِيضُ المالُ أي يَكْثُر، من فاض الماء والدمع: كثر»"
          source: "النهاية في غريب الحديث لابن الأثير"
      contradicts:
        - text: "«الفيض: الموت، يقال فاضت نفسه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الفيض بمعنى الموت دلالة مختلفة تماماً"
        - text: "«الفيض في اصطلاح العلماء يطلق على فعل فاعل يفعل دائما لا لعوض ولا لغرض»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الفيض في الاصطلاح الفلسفي يعني الصدور والفيض الإلهي، لا الكمية الكبيرة"
      expands:
        - text: "«(فَيَضَ) الْفَاءُ وَالْيَاءُ وَالضَّادُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى جَرَيَانِ الشَّيْءِ بِسُهُولَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل في الفيض هو الجريان والسيلان، ومنه الكثرة بالتبع"

    - lemma: "غَزَارَة"
      confirm:
        - text: "«غَزَارة: من (غ ز ر) الكثرة من كل شيء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(غَزَرَ) الْغَيْنُ وَالزَّاءُ وَالرَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ قَوْلُهُمْ: غَزُرَتِ النَّاقَةُ: كَثُرَ لَبَنُهَا غُزْرًا وَغَزَارَةً. وَعَيْنٌ غَزِيرَةٌ، وَمَعْرُوفٌ غَزِيرٌ»"
          source: "مقاييس اللغة لابن فارس"

stage3_analysis:
  per_lemma:
    - lemma: "كَمِّيَّة كَبِيرَة غَيْرُ مُحَدَّدَة"
      decision: confirmed
      decision_reason: "هذه العبارة ترجمة مباشرة لاسم المجموعة الإنجليزي (large indefinite quantity) وتصف المفهوم بدقة. رغم أنها عبارة وصفية حرة تفشل اختبار السكّ، فإنّ بعض المجموعات الترادفية في ووردنت تحتفظ بأوصاف كهذه حين لا يوجد مصطلح مفرد يغطي المفهوم بالضبط. تُبقى كلمّة وصفية مع إضافة مصطلحات أصيلة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "عبارة وصفية تحدّد المفهوم بدقة (كمّية + كبيرة + غير محددة)، بينما اللمّات المفردة تدل على الكثرة دون تقييد بـ«غير محددة»"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَمِّيَّة كَبِيرَة غَيْرُ مُحَدَّدَة"

    - lemma: "كَثْرَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي أصيل راسخ في المعاجم الكلاسيكية والمعاصرة، يدل على نقيض القلة ونماء العدد. يُستعمل للدلالة على كمية كبيرة غير محددة في سياقات متعددة. مؤيَّد بنصوص القاموس المحيط والمعجم الوسيط ومقاييس اللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الكمية الكبيرة من حيث العدد والمقدار بإطلاق، دون دلالة على الاكتفاء أو التدفق"
      actions:
        - command: create_entry
          params: {lemma: "كَثْرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "وَفْرَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي أصيل بمعنى الكثرة والتمام، مؤيَّد بالمعجم الوسيط ومقاييس اللغة. معتمد في المعاجم الموحدة العربية (ALECSO) بمعنى abundance عبر تخصصات عديدة، مما يؤكد رسوخه مصطلحاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الكثرة مع دلالة إضافية على التمام والاكتفاء، وتُستعمل خاصة في السياقات الاقتصادية والعلمية"
      actions:
        - command: create_entry
          params: {lemma: "وَفْرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "فَيْض"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود الفيض بمعنى الكثير الغزير في المعجم الوسيط، فإن الدلالة الأصلية هي الجريان والسيلان (مقاييس اللغة)، والدلالة الاصطلاحية الشائعة هي الصدور الفلسفي (الفيض الإلهي). الاشتراك اللفظي الكثيف (الموت، المكان، الصدور) يجعله غير ملائم لمجموعة الكمية الكبيرة."

    - lemma: "غَزَارَة"
      source: stage1
      decision: removed
      decision_reason: "الأصل في غزارة كثرة اللبن (مقاييس اللغة)، ثم عُمِّم. لكن الاستعمال الحديث يغلب عليه السياق التقني (غزارة المياه، الإنتاجية) وهو أقرب إلى yield/productivity منه إلى large indefinite quantity. والمعاجم الموحدة تستعمله بمعنى كمية الإنتاج لا الكمية الكبيرة المطلقة."

