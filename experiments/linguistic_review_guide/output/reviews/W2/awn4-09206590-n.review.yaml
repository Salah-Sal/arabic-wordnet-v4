stage1_review:
  assessment:
    concerns:
      - "لمّة «أخلاق» تدلّ على الأخلاق بوصفها حقلاً معرفياً أو سجيةً، لا على الدافع النابع منها؛ مما يُفضي إلى اشتراك لفظي مع مجموعات ترادفية تخصّ علم الأخلاق أو الفضيلة"
      - "اللمّات الثلاث مجرّدة من التشكيل الكامل"
      - "لمّتا «دافع أخلاقي» و«وازع أخلاقي» عبارتان وصفيّتان تحتاجان تحقّقاً من التثبيت المعجمي قبل قبولهما"
    observations: >
      المجموعة ترادفية تقع تحت المفترض الأعلى «حافز/دافع/دافعية» بوصفه سمةً نفسية محرِّكة، فالمفهوم المطلوب هو الباعث الأخلاقي — أي ما يدفع الإنسان نحو الفعل أو يكفّه عنه استناداً إلى قيمه الأخلاقية — لا الأخلاق بما هي علم أو منظومة معيارية. لمّة «وازع أخلاقي» أكثر دقةً من «دافع أخلاقي» لأنّ الوازع يجمع معنيَي الدفع والكبح، وكلاهما وجه للعملة ذاتها. أما «أخلاق» منفردةً فتُحيل في المعجمية العربية إلى السجايا والفضائل وإلى علم الأخلاق، لا إلى قوة التحريك النفسي بعينها.

  blind_candidates:
    - lemma: "وَازِعٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من وَزَعَ (كفّ، دفع، نظّم)، يدلّ على ما يزجر الإنسان عن الشرّ ويحمله على الخير؛ والجذر وزع يحمل معنى الكبح والتحريك معاً، وهو بذلك يُجسّد الباعث الأخلاقي الداخلي. وقد ورد في الموروث: «ما يَزَعُ السلطانُ أكثرُ مما يَزَعُ القرآنُ»"
    - lemma: "ضَمِيرٌ"
      generation_method: majaz
      justification: "مجاز إزاحة دلالية من «ما يُضمر في القلب ويخفى» إلى الصوت الداخلي الذي يميّز بين الحسن والقبيح ويدفع نحو الفعل الأخلاقي؛ الضمير في الاستعمال المعاصر هو القوة الحاكمة في مجال الأخلاق التي تميّز بين الخير والشرّ"
    - lemma: "بَاعِثٌ خُلُقِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي (wasfi) من باعث (اسم فاعل من بعث، يدلّ على المحرّك) + خلقي (نسبة إلى الخُلُق الأخلاقي)؛ يُعبّر بصراحة عن الباعث الأخلاقي"
    - lemma: "تَحَرُّجٌ"
      generation_method: ishtiqaq
      justification: "مصدر تفعّل من جذر ح-ر-ج (الضيق والإثم)؛ التحرّج هو الإحساس الأخلاقي الكابح عن الخطأ الدافع نحو الصواب، ويُستعمل في اللغة بمعنى الاجتناب الذي يصدر عن ضمير أخلاقي"


