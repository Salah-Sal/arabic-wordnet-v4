# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────

stage3_analysis:
  per_lemma:

    - lemma: "أَخْلَاق"
      decision: removed
      decision_reason: >
        كلمة «أخلاق» في الموروث اللغوي العربي ومعاجمه الحديثة تُحيل أولاً إلى (أ) السجايا والصفات الخلقية (ب) علم الأخلاق بوصفه حقلاً فلسفياً. كلا المعنيَين مغايران لمفهوم «الدافع المستند إلى مبادئ أخلاقية» الذي هو محلّ هذه المجموعة. إبقاؤها يُفضي إلى اشتراك لفظي مع المجموعات الترادفية الخاصة بالأخلاق كعلم أو كفضيلة. علاوةً على ذلك، المفترض الأعلى للمجموعة هو «حافز/دافع/دافعية» وهو مجال نفسي تحريكي لا تنتمي إليه كلمة «أخلاق» الاسمية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "دَافِعٌ أَخْلَاقِيٌّ"
      decision: confirmed
      decision_reason: >
        مركب وصفي (wasfi) شفّاف من دافع (اسم فاعل من دفع) + أخلاقي (نسبة إلى الأخلاق)؛ يُعبّر بدقة عن المفهوم المطلوب: الباعث المُحرِّك الصادر عن مبادئ أخلاقية. العبارة ثابتة في الاستعمال المعاصر (تؤكّدها بيانات المورد الحديث و«دوافع أخلاقية» في سياق طبيعي). تجتاز اختبار السكّ: «دوافع أخلاقية» لا يمكن إبدال «أخلاقية» بـ«خُلُقية» من غير تحوّل دلالي. يُركّز على الجانب التحريكي الإيجابي (الدفع نحو الخير).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز الجانب التحريكي الإيجابي للباعث الأخلاقي: ما يدفع الإنسان نحو الفعل الصواب والخير ابتداءً. يُستخدم حين يُؤكَّد حضور الحافز وفاعليته، كما في «أقدم على العمل الخيري بدافع أخلاقي خالص».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَافِعٌ أَخْلَاقِيٌّ"

    - lemma: "وَازِعٌ أَخْلَاقِيٌّ"
      decision: confirmed
      decision_reason: >
        مركب وصفي (wasfi) من وازع (اسم فاعل من وزع = كفّ + دفع) + أخلاقي. اللمّة موثّقة في الاستعمال المعجمي الحيّ: المعجم الكبير يُورد «يتصرف دون وازع أخلاقي أو ديني» مثالاً استعمالياً. كما يترجم المورد الحديث scruple بـ«وازع/تحرّج/تورّع». الجذر وزع في مقاييس اللغة يعني الكبح والتحريك معاً، مما يجعل «الوازع الأخلاقي» يتضمّن الجانب الرادع (يمنع من الخطأ) والجانب الموجِّه (يدفع نحو الصواب) في آن.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز الجانب الرادع والكابح للباعث الأخلاقي: ما يمنع الإنسان من الوقوع في الخطأ أو يكفّه عمّا لا يصحّ. يتضمّن معنى الزجر الداخلي، ويُستخدم كثيراً في سياق الغياب («دون وازع أخلاقي»). يُقابل المعنى الإنجليزي scruple أكثر من ethical motive.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَازِعٌ أَخْلَاقِيٌّ"

    - lemma: "وَازِعٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الكلمة منفردةً دون مؤهِّل متعددة الأوجه: تعني في الموروث المنفِّذ العسكري ووالي المانع والكلب. لا يتمحّض معناها للباعث الأخلاقي إلا بانضمام «أخلاقي» إليها؛ وهذا ما تحقّق بالفعل في اللمّة الموجودة «وازع أخلاقي».

    - lemma: "ضَمِيرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الضمير في المعجمية العربية والفلسفة العربية المعاصرة يُقابل conscience (الوعي الأخلاقي الداخلي)، وليس ethical motive (الدافع أو الباعث الأخلاقي). الفرق جوهري: الضمير ملَكة إدراكية تُمَيِّز بين الخير والشرّ، أما الدافع الأخلاقي فهو القوة التحريكية الصادرة عن تلك الملَكة. إدراجه هنا يُلبِّس بين مفهومَي الوعي الأخلاقي والتحفيز الأخلاقي. وقد يستدعي ARABTERM تخصيص مجموعة ترادفية منفصلة للضمير بوصفه conscience.

    - lemma: "بَاعِثٌ خُلُقِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        المركب غير موثّق كوحدة معجمية ثابتة في قاعدة البيانات. وحتى لو قُبل تركيبياً فهو مع «دافع أخلاقي» أشبه بترادف مطلق لا يُضيف فرقاً دلالياً كافياً يُسوِّغ الإدراج. يتضمّن «خلقي» (نسبة إلى الخُلُق بمعنى السجية) بدل «أخلاقي» (نسبة إلى الأخلاق كمنظومة)، مما يجعله أقل اتساقاً مع التعريف.

    - lemma: "تَحَرُّجٌ"
      source: stage1
      decision: removed
      decision_reason: >
        التحرّج فعل (مصدر فعلي) يدلّ على الاجتناب الذي يصدر عن ضيق الضمير (حرج = ضيق + إثم)؛ وهو أقرب إلى رد الفعل السلوكي الأخلاقي منه إلى الدافع الأخلاقي ذاته. علاوةً على ذلك، غلبة الاستعمال الفقهي للكلمة (تحرّج من الحرام) يجعلها مرتبطة بمنظومة التحريم الديني أكثر من الباعث الأخلاقي العام. الكلمة في قاعدة البيانات مسجّلة فعلاً لا اسماً.


