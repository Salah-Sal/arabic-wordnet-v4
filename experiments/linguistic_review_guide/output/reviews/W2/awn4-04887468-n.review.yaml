# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-04887468-n  |  ILI: i62632
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'حنكة' تفتقر إلى التشكيل الكامل؛ والضبط الصحيح الوارد في المعاجم هو حُنْكَة بضم الحاء لا كسرها، وفق نص معجم الصواب اللغوي ومستند التاج والقاموس"
      - "اللمة 'خبرة دنيوية' تعبير وصفي حر لا مصطلح مسكوك ثابت؛ يفشل اختبار التثبيت المعجمي لأن 'خبرة' قابلة للإحلال بـ 'تجربة' و'معرفة' دون انعقاد دلالة اصطلاحية"
      - "المجموعة تخلو من تغطية بُعد 'الدنيوية' (worldliness) بمصطلح مفرد معترف به معجمياً"
    observations: >-
      المجموعة تجمع مفهومَين متلازمَين: الرقي الفكري المكتسب بالثقافة والتجربة (sophistication)،
      والانغماس في أحوال الدنيا ومعرفة شؤونها (worldliness). الجذر حنك يحمل في أصله المعجمي
      معنى بلوغ الغاية والتناهي في الأمر؛ واللمة حُنْكَة هي الاسم المأخوذ من "احتنكته السن
      والتجارب" أي حنّكته وأحكمته، وهو تعبير عربي أصيل وثيق التوثيق. أما 'خبرة دنيوية' فوصف
      تحليلي مشتق من تعريف المجموعة الإنجليزية، لا يصحّ إدراجه لمةً منفردة.
  blind_candidates:
    - lemma: "تَحَنُّك"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل تحنّك على وزن تَفَعُّل من جذر حنك؛ بمعنى بلوغ غاية الإحكام والتجربة
        استعارةً من تحنيك الفرس (ترويضه) حتى يصبح مذلَّلاً مُجرَّباً. غير أن المعنى المعجمي
        المسجَّل لتحنّك يقتصر على "إدارة العمامة من تحت الحنك"، ما يُوجب المراجعة
    - lemma: "نُضْج"
      generation_method: majaz
      justification: >-
        من جذر نضج على وزن فُعْل، مجاز من نضج الثمرة إلى نضج العقل والتجربة؛ يصف
        اكتمال الفكر وإحكام الرأي المكتسب بمرور الزمن وتراكم التجارب. قال في مقاييس
        اللغة: "أصل يدل على بلوغ النهاية في طبخ الشيء ثم يستعار في كل شيء بلغ مدى الإحكام"
    - lemma: "دُنيويَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي بالياء والتاء مشددتين من الصفة 'دنيوي'؛ يدل على طابع الانغماس في
        أحوال الحياة الدنيوية والمعرفة العملية بشؤونها. يُقابل المصطلح الإنجليزي worldliness
        مباشرةً، ومصدر الصناعة منتج في العربية المعاصرة
    - lemma: "تَمَرُّس"
      generation_method: ishtiqaq
      justification: >-
        مصدر الفعل تمرّس على وزن تَفَعُّل من جذر مرس، يدل على الحذق المكتسب بالاحتكاك
        والمران؛ قال في المقاييس: "يدل على مضامة شيء لشيء بشدة وقوة". يغطي بُعد الخبرة
        الميدانية المكتسبة بالتجربة والمُعاناة


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "حنكة"
      confirm:
        - text: "«حَنَّكَتْهُ التَّجَارِبُ، وَاحْتَنَكَتْهُ السِّنُّ احْتِنَاكًا، وَرَجُلٌ مُحْتَنَكٌ؛ هُوَ مِنَ الْبَابِ لِأَنَّهُ التَّنَاهِي فِي الْأَمْرِ وَالْبُلُوغُ إِلَى غَايَتِهِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«وحنكت الشيء: فهمته وأحكمته. واحتنك الرجل: أي استحكم. والاسم الحُنْكَةُ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«فلان ذو حنكة. ومن المجاز: حنكته السن، وحنكته الأمور: فعلت ما يفعل بالفرس إذا حنك حتى عاد مجرّباً مذلَّلاً»"
          source: "أساس البلاغة للزمخشري"
        - text: "«رَجُلٌ ذو حُنْكَة [فصيحة] - رَجُلٌ ذو حِنْكَة [صحيحة]. المعنى: ذو تجربة وبصر بالأمور. الوارد في التاج والقاموس: والاسم الحُنْكَة والحُنْك بضمهما، وهو السِّن والتجربة والبصر بالأمور»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«(1) تَجرِبة (2) حُنكة؛ اختبار (3) خِبرة» [ترجمة مدخل experience]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مَعِي حُنْكَةُ الشَّيْخِ الأَرِيبِ وهِزَّةُ الفَتَى / حين يُدنِي صَفقةً لي قِرابُها» [أبو عمرو الشيباني]"
          source: "المعجم الكبير"
          addition: "شاهد شعري قديم يُوظِّف حُنْكَة بمعنى حصافة الشيخ المجرَّب في مقابل نشاط الشباب"
        - text: "«(3) مُتكلِّف أو محنَّك» [ترجمة sophisticated]"
          source: "المورد الحديث (2008)"
          addition: "الصفة 'محنَّك' هي الصيغة الصفية المشتقة من الجذر نفسه؛ تؤكد صحة الجذر لهذا المفهوم"

    - lemma: "خبرة دنيوية"
      evidence_status: "no_material_found"

    - lemma: "تَحَنُّك"
      contradicts:
        - text: "«تَحَنَّكَ فلانٌ: تَلَحَّى، بأن أدار العمامة من تحت الحنك»"
          source: "المعجم الكبير"
          conflict: "المعنى المعجمي المسجَّل لتحنّك حركيٌّ مادي (إدارة العمامة) لا علاقة له بالرقي الفكري أو الخبرة الدنيوية"
        - text: "«(تحنّك) بالشيء: فعل ما يفعل بالفرس إذا حنكه؛ أي أدار الحبل في فيه لقيادته»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "معنى إضافي للتروّض ليس مصدر اسم بمعنى الحصافة؛ الاسم المشتق للمفهوم هو حُنْكَة لا تَحَنُّك"

    - lemma: "نُضْج"
      expands:
        - text: "«نَضِجَ: النون والضاد والجيم أصل يدل على بلوغ النهاية في طبخ الشيء، ثم يستعار في كل شيء بلغ مدى الإحكام»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الاستعارة المعجمية لنضج تتجه إلى الإحكام والاكتمال، وهو قريب من بُعد النضج الفكري في المجموعة"
        - text: "«رجل نضيج الرأي: مُحكَمُه»"
          source: "مختار الصحاح للرازي"
          addition: "الصيغة الصفية 'نضيج الرأي' تؤكد إمكانية الاستعمال المجازي للمفهوم الفكري"
        - text: "«نضج» [translation_en: maturity] في مجالات: التربية، وعلم النفس، وعلم الاجتماع"
          source: "معاجم أليكسو (ARABTERM)"
          addition: "المصطلح موثَّق في المعجمية التقنية الحديثة بمعنى النضج/الاكتمال"

    - lemma: "دُنيويَّة"
      confirm:
        - text: "«الدُّنيويّة: «أ» كونُ الشَّيء دُنيوياً. «ب» الانهماك بالشُّؤون الدُّنيويّة [على حساب الشُّؤون الرُّوحيّة]»"
          source: "المورد الحديث (2008)"
        - text: "«الدُّنْيَوِيّة: الاهتمام بشؤون الدُّنيا»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«سميت الدنيا لدنوّها، والنسبة إليها دنياويّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "التأصيل الجذري يربط دنيوية بمفهوم الدنو والقرب من أحوال الأرض والحياة العملية"

    - lemma: "تَمَرُّس"
      expands:
        - text: "«(تمرّس) بالشيء: احتك به وتدرّب عليه»"
          source: "المعجم الوسيط"
          addition: "يوثّق معنى التدرّب والاحتكاك كأساس لاكتساب الخبرة، لكنه يركّز على الجانب المهاري دون الثقافي/الفكري"
        - text: "«المِيمُ وَالرَّاءُ وَالسِّينُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مُضَامَّةِ شَيْءٍ لِشَيْءٍ بِشِدَّةٍ وَقُوَّةٍ... وَرَجُلٌ مَرِسٌ: ذُو جَلَدٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الشدة والمتانة الناجمة عن الاحتكاك؛ أقرب إلى الصلابة العملية منه إلى الرقي الفكري"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حنكة"
      decision: confirmed
      decision_reason: >-
        الجذر حنك وثيق التوثيق في المعاجم الكلاسيكية والحديثة بمعنى "السن والتجربة والبصر
        بالأمور". اللمة فصيحة أصيلة ومسكوكة ومجمَّع عليها. يستلزم التصحيح فقط: الضبط الصحيح
        حُنْكَة بضم الحاء وهو المنصوص عليه في الصحاح وأساس البلاغة ومعجم الصواب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبِّر عن الحصافة العملية المكتسبة من اختبار شدائد الزمن وصروفه؛ يتضمّن معنى الانصقال
        والتهذيب الذي يُعطي صاحبه حِدَّة الحكم وحُسن التقدير. التركيز على التجربة الشخصية
        المعيشة وما تورثه من بصيرة بالأمور، بخلاف دُنيويَّة التي تصف التوجّه نحو الدنيا ذاتها
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُنْكَة"

    - lemma: "خبرة دنيوية"
      decision: removed
      decision_reason: >-
        تعبير وصفي حر لا مصطلح اصطلاحي مسكوك؛ يفشل اختبار السك لأن كلاً من مكوّنيه
        (خبرة) و(دنيوية) قابل للإحلال بمرادفه الحر (تجربة، معرفة / عملية، واقعية) دون أن
        يُفضي ذلك إلى معنى مستقل عن الوصف الحر. لا أثر له في المعاجم المعتمدة. المفهوم
        مُغطَّى بدقة أعلى بلمة حُنْكَة المضافة والمُصحَّحة، وبلمة دُنيويَّة المقترحة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَحَنُّك"
      source: stage1
      decision: removed
      decision_reason: >-
        المعنى المعجمي المسجَّل في جميع المعاجم لتحنّك حركيٌّ مادي (إدارة العمامة من تحت
        الحنك / تلحّى). لا يُعبِّر عن الحصافة أو الرقي الفكري بوصفه مصدراً اسمياً. الاسم
        الصحيح المستخدَم للمفهوم من هذا الجذر هو حُنْكَة لا تَحَنُّك.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "نُضْج"
      source: stage1
      decision: removed
      decision_reason: >-
        نُضج يدل على اكتمال النمو وإحكام الشيء (حرفياً ومجازاً)، وهو أعم من المفهوم
        المطلوب الذي يختص بالرقي الفكري المكتسب بالثقافة والانكسارات الدنيوية تحديداً.
        فضلاً عن الاشتراك اللفظي الكثيف في المعجمية التقنية (نضج = maturation في الأحياء
        والكيمياء والتربية)؛ مما يُحدث تداخلاً مع مصطلحات علمية قائمة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "دُنيويَّة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        المصدر الصناعي دُنيويَّة موثَّق في المورد الحديث (2008) بترجمتَي worldliness
        و this-worldliness المطابقتَين للمفهوم. يُغطي بُعداً دلالياً مستقلاً عن حُنْكَة:
        التوجّه نحو شؤون الدنيا والانغماس فيها. يقبل لام التعريف والنسبة والجمع السالم
        (دُنيويَّات). البنية الاشتقاقية واضحة ومنتجة في العربية المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبِّر عن التوجّه الدنيوي ذاته وعمق الاندماج في شؤون الحياة العملية؛ يحمل إمكانية
        قراءة محايدة (المعرفة بأحوال الدنيا) وقراءة ذات حمولة قيمية سلبية خفيفة (الانشغال
        بالدنيا على حساب الروحانيات)، بخلاف حُنْكَة التي تنصبّ على ثمرة التجربة وحصافة الحكم
      actions:
        - command: create_entry
          params:
            lemma: "دُنيويَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَمَرُّس"
      source: stage1
      decision: removed
      decision_reason: >-
        تمرّس يدل على الحذق المهاري المكتسب بالاحتكاك والمران العملي؛ يُغطي بُعد الخبرة
        الميدانية لكن لا يتضمّن الرقي الفكري الناجم عن الثقافة والتهذيب. أقرب إلى إتقان
        الصنعة منه إلى الحصافة الدنيوية الشاملة. لا يُوثَّق في المعاجم بمعنى الخبرة الدنيوية
        الشاملة كما تعرّفها المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "صفة أو طابع الرقي الفكري والخبرة الدنيوية المكتسبة من خلال الثقافة أو التجربة أو خيبات الأمل"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة حرفية من الإنجليزية "the quality or character of being
        intellectually sophisticated and worldly through cultivation or experience or
        disillusionment"؛ يفتقر إلى الجنس القريب المحدَّد والفصل النوعي بأسلوب المعجم
        العربي، ويبدو اصطناعياً بتعداد "أو... أو" الحرفي.
    authored:
      - type: terminological
        text: >-
          صِفَةُ مَنْ بَلَغَ مَبْلَغًا عَالِيًا مِنَ النُّضْجِ الفِكْرِيِّ وَالمَعْرِفَةِ
          بِأَحْوَالِ الحَيَاةِ الدُّنيَوِيَّةِ، مِمَّا اكْتَسَبَهُ عَنْ طَرِيقِ الثَّقَافَةِ
          وَالتَّجْرِبَةِ وَخَيَبَاتِ الأَمَلِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >-
          مَا يَكْتَسِبُهُ المَرْءُ مِنَ الحَصَافَةِ وَالبَصَرِ بِأُمُورِ الدُّنيَا
          جَرَّاءَ الاحْتِكَاكِ بِالحَيَاةِ وَتَجَارِبِهَا وَمَا فِيهَا مِنَ العِبَرِ
          وَالانكِسَارَاتِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >-
            صِفَةُ مَنْ بَلَغَ مَبْلَغًا عَالِيًا مِنَ النُّضْجِ الفِكْرِيِّ وَالمَعْرِفَةِ
            بِأَحْوَالِ الحَيَاةِ الدُّنيَوِيَّةِ، مِمَّا اكْتَسَبَهُ عَنْ طَرِيقِ الثَّقَافَةِ
            وَالتَّجْرِبَةِ وَخَيَبَاتِ الأَمَلِ
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >-
            مَا يَكْتَسِبُهُ المَرْءُ مِنَ الحَصَافَةِ وَالبَصَرِ بِأُمُورِ الدُّنيَا
            جَرَّاءَ الاحْتِكَاكِ بِالحَيَاةِ وَتَجَارِبِهَا وَمَا فِيهَا مِنَ العِبَرِ
