stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي مختصر جداً ودائري (يستخدم إحدى اللمّات لتعريف المجموعة)."
      - "اللمّة 'ذهاب' تحتاج لضبط بالشكل (ذَهَاب) لتمييز المصدر الفصيح."
    observations: "المجموعة تغطي مفهوم المغادرة والرحيل والبدء في السفر. اللمّات الموجودة أساسية وصحيحة، لكن يمكن إثراؤها بمرادفات أكثر تخصُّصاً مثل 'ارتحال' و'انطلاق'."
  blind_candidates:
    - lemma: "ارْتِحَال"
      generation_method: ishtiqaq
      justification: "مصدر الفعل ارتحل، وهو من أدق الكلمات العربية لوصف الشروع في السفر."
    - lemma: "نُزُوح"
      generation_method: majaz
      justification: "يُستخدم للمغادرة الجماعية أو الانتقال من مكان لآخر."
    - lemma: "انْطِلاق"
      generation_method: majaz
      justification: "يُستخدم في سياق بدء الرحلة أو مغادرة نقطة الانطلاق."
    - lemma: "تَوَجُّه"
      generation_method: majaz
      justification: "الذهاب نحو وجهة معينة، ويتضمن بالضرورة فعل المغادرة."

stage2_evidence:
  per_lemma:
    - lemma: "ذهاب"
      confirm:
        - text: "«(ذَهَبَ)... وَبَقِيَ أَصْلٌ آخَرُ، وَهُوَ ذَهَابُ الشَّيْءِ: مُضِيُّهُ. يُقَالُ ذَهَبٌ يَذْهَبُ ذَهَابًا وَذُهُوبًا.»"
          source: "مقاييس اللغة"
        - text: "«الذهاب: المضي، ويستعمل في المعاني والأعيان.»"
          source: "التوقيف على مهمات التعاريف"
    - lemma: "رحيل"
      confirm:
        - text: "«(الرحيل) الارتحال وَالْقَوِي على الارتحال وَالسير»"
          source: "المعجم الوسيط"
        - text: "«الرَّاءُ وَالْحَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُضِيٍّ فِي سَفَرٍ. يُقَالُ: رَحَلَ يَرْحَلُ رِحْلَةً... وَالرِّحْلَةُ: الِارْتِحَالُ.»"
          source: "مقاييس اللغة"
    - lemma: "مغادرة"
      confirm:
        - text: "«مُغَادَرَة: عملية الخروج من النظام أو البرمجية وتؤدي إلى إقفال جميع الملفات...»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
        - text: "«مُغَادَرة: Departure»"
          source: "المعجم الموحد لمصطلحات النقل"
      expands:
        - text: "«الْغَيْنُ وَالدَّالُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَرْكِ الشَّيْءِ.»"
          source: "مقاييس اللغة"
          addition: "يوضح الجذر أن المغادرة تعني ترك الشيء أو المكان."
    - lemma: "ارْتِحَال"
      confirm:
        - text: "«الرِّحْلَةُ: الِارْتِحَالُ»"
          source: "مقاييس اللغة"
        - text: "«(الرحيل) الارتحال...»"
          source: "المعجم الوسيط"
    - lemma: "انْطِلاق"
      confirm:
        - text: "«انْطِلاق:Departure/Leaving»"
          source: "المورد الحديث"
        - text: "«(طَلَقَ)... وَهُوَ يَدُلُّ عَلَى التَّخْلِيَةِ وَالْإِرْسَالِ. يُقَالُ: انْطَلَقَ الرَّجُلُ يَنْطَلِقُ انْطِلَاقًا.»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "ذهاب"
      decision: confirmed
      decision_reason: "المصدر الأساسي للفعل ذهب، وهو يغطي المعنى العام للمغادرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ذَهَاب"
    - lemma: "رحيل"
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على المغادرة بقصد السفر أو الانتقال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَحِيل"
    - lemma: "مغادرة"
      decision: confirmed
      decision_reason: "المرادف المباشر لمصطلح (departure) في اللغة العربية المعاصرة والاصطلاحية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُغَادَرَة"
    - lemma: "ارْتِحَال"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي للرحيل ومذكور في تعريفات المعاجم الأساسية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "ارْتِحَال", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "انْطِلاق"
      source: stage1
      decision: confirmed
      decision_reason: "يدل على الشروع في الحركة أو السفر، ويُستخدم كثيراً في سياق المغادرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "انْطِلاق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "فعل المغادرة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دائري ومقتضب."
    authored:
      - type: linguistic
        text: "الخروج من مكان ما للمضي إلى غيره، أو الشروع في السفر."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "الخروج من مكان ما للمضي إلى غيره، أو الشروع في السفر."}
  examples:
    per_lemma:
      - lemma: "ذَهَاب"
        examples:
          - text: "كَانَ ذَهَابُهُ إِلَى العَمَلِ مُبَكِّرًا هَذَا الصَّبَاحِ."
            type: usage
      - lemma: "رَحِيل"
        examples:
          - text: "حَزِنَ الجِيرَانُ لِرَحِيلِ العَائِلَةِ عَنِ الحَيِّ."
            type: usage
      - lemma: "مُغَادَرَة"
        examples:
          - text: "أَعْلَنَ المَطَارُ عَنْ مَوْعِدِ مُغَادَرَةِ الطَّائِرَةِ."
            type: usage
      - lemma: "ارْتِحَال"
        examples:
          - text: "اسْتَعَدَّ القَوْمُ لِلارْتِحَالِ مَعَ بُزُوغِ الفَجْرِ."
            type: usage
      - lemma: "انْطِلاق"
        examples:
          - text: "دَقَّتْ سَاعَةُ الانْطِلاقِ لِبَدْءِ الرِّحْلَةِ المُنْتَظَرَةِ."
            type: usage

