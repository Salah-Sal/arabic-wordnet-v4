stage1_review:
  assessment:
    concerns:
      - اللمة الحالية "نظام بيئي" دقيقة جداً وشائعة، لكن المجموعة تفتقر إلى المرادفات العلمية الأخرى المستخدمة في الأدبيات العربية.
    observations: "المفهوم حديث (Ecosystem) وقد تمت صياغته عربياً بنجاح عبر التركيب الوصفي (نظام بيئي). المصطلحات البديلة تعتمد إما على استبدال 'نظام' بـ 'منظومة' أو استخدام التعريب (إيكولوجي)."
  blind_candidates:
    - lemma: "نِظَامٌ بِيئِيٌّ"
      generation_method: tarkib
      justification: "الترجمة القياسية والمعتمدة للمصطلح العلمي ecosystem."
    - lemma: "مَنْظُومَةٌ بِيئِيَّةٌ"
      generation_method: tarkib
      justification: "استخدام 'منظومة' للدلالة على الطبيعة الشبكية والمترابطة للعناصر الحيوية والفيزيائية."
    - lemma: "نِظَامٌ إِيكُولُوجِيٌّ"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح اللاتيني/الإنجليزي، شائع في الدراسات الأكاديمية."
    - lemma: "جُمْلَةٌ بِيئِيَّةٌ"
      generation_method: tarkib
      justification: "استخدام كلمة 'جملة' كمرادف لـ 'نظام' في العلوم الطبيعية والفيزيائية."

stage2_evidence:
  per_lemma:
    - lemma: "نظام بيئي"
      confirm:
        - text: "منظومة متكاملة من المكونات الحية والمصادر الطبيعية، بما في ذلك الطاقة والماء، المتواجدة في حيز محدود... والمتفاعلة مع بعضها البعض."
          source: "مسرد المناخ والبيئة (ArabTerm)"
        - text: "البيئة الكلية التي تشمل المواد الحية مع موطنها البيئي غير الحي."
          source: "المعجم الموحد لمصطلحات علم الوراثة"
    - lemma: "منظومة بيئية"
      confirm:
        - text: "منظومة بيئية طبيعية في أصلها تغيرت بعض أو كل معالمها وخصائصها بفعل تدخل الإنسان (في تعريف نظام بيئي بشري)."
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "ecosystem"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
    - lemma: "نظام إيكولوجي"
      confirm:
        - text: "العملية التي من خلالها يتم التبادل والتفاعل بين العناصر، الحية وغير الحية، المكونة للنظم الإيكولوجية."
          source: "وظيفة النظام الإيكولوجي - ArabTerm"
        - text: "ecological system"
          source: "المعجم الطبي الموحد"

