stage4_content:
  definition:
    current: "نظام يتكون من تفاعل مجتمع من الكائنات الحية مع بيئتها المادية"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً وجامع لمانع لمكونات النظام (الحية وغير الحية) وتفاعلها."
  examples:
    per_lemma:
      - lemma: "نِظَامٌ بِيئِيٌّ"
        examples:
          - text: "تؤدي إزالة الغابات إلى اختلال توازن النظام البيئي المحلي."
            type: usage
      - lemma: "مَنْظُومَةٌ بِيئِيَّةٌ"
        examples:
          - text: "تعتبر الشعاب المرجانية منظومة بيئية معقدة تدعم آلاف الأنواع البحرية."
            type: usage
      - lemma: "نِظَامٌ إِيكُولُوجِيٌّ"
        examples:
          - text: "يدرس الباحثون تأثير الاحتباس الحراري على استقرار النظام الإيكولوجي القطبي."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-08385684-n", text: "يشكل تفاعل الكائنات الحية مع التربة والمناخ نظاماً بيئياً فريداً."}

