# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:

  # أ. التوليد الأعمى (من الملف المُقنَّع — قبل الاطلاع على اللمّات)
  blind_candidates:
    - lemma: "مَقِيسِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على المصدر الصناعي (فَعِيلِيَّة) من اسم المفعول «مَقِيس» (الشيء الذي
        يُعرَّض للقياس)، وهو مشتق من الجذر «قيس / قوس» الدالّ أصلاً على «تقدير شيء
        بشيء» (ابن فارس). تُعبّر هذه الصيغة مباشرةً عن خاصية كون الشيء قابلاً للتقدير
        الكمّي، نظيراً لـ«مَعرُوفيَّة» و«مَدروسيَّة» في الاستخدام الحديث.

    - lemma: "قِيَاسِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «قِيَاس» على وزن فِعَالِيَّة، تُفيد الخاصية المجردة المتعلقة
        بالقياس. الجذر «قوس/قيس» يعني أصلاً «تقدير شيء بشيء»، فكان هذا الاشتقاق
        مطرداً من حيث الوزن الصرفي لأسماء الخصائص المجردة.

    - lemma: "صَلَاحِيَّةُ الْقِيَاس"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «صَلَاحِيَّة» (= اللياقة والاستعداد) + «القياس» (= التقدير
        الكمّي). يوازي النمط العربي المنتج في المصطلحية الحديثة كـ«صلاحية الشرب» و
        «صلاحية التداول»، ويُفيد استعداد الشيء الذاتي لأن يُخضَع لعملية القياس.

    - lemma: "التَّكَمُّمِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «تَكَمُّم» (= اكتساب صفة الكمّية، أي القدرة على التعبير
        الرقمي)، مشتق من «كمّ» الفلسفي (المقولة الأرسطية التي تقابل «كيف»). يُسدّ
        به مسدّ الإنجليزية «quantifiability» خاصةً، مُميِّزاً إياه عن «measurability»
        العامة.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        التعريف الحالي «صفة كون الشيء قابلاً للقياس» دائريٌّ: يستخدم «قابلاً» و
        «القياس» وهما المكوّنان الجذريان للمُصطلح «قابلية القياس» نفسه.
      - >
        اللمّة الوحيدة «قَابِلِيَّة القِيَاس» مُسجَّلة في قاعدة ARABTERM برابطَين
        مُضلِّلَيْن: أحدهما يترجمها «rectification» (= التقويم/التسوية الرياضية)،
        والآخر «scalability» (= قابلية التوسع)، وكلاهما مفهوم مغاير تماماً.
        هذان الرابطان خطأ في بيانات ARABTERM، ولا يمسّان صحة المُصطلح AWN.
      - >
        المجموعة تفتقر إلى أي مثال استعمالي في سياق عربي.
    observations: >
      المُصطلح «قَابِلِيَّة القِيَاس» مركَّب إضافي ناجح يتّكئ على نمط مُنتِج
      جداً في المصطلحية العربية الحديثة (قابلية الانضغاط، قابلية التوصيل،
      قابلية القسمة …). الجذران المعنيّان كلاهما أصيل في العربية: «قبل» يُفيد
      المُواجهة والاستقبال (ومنه: القابليّة = الاستعداد الذاتي)، و«قوس/قيس»
      يُفيد أصلاً «تقدير شيء بشيء» (ابن فارس)، وهو اشتقاق القياس ذاته. اللمّة
      إذاً صحيحة بنيةً ودلالةً وتحتاج فقط إلى تحسين التعريف وإضافة أمثلة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "قَابِلِيَّة القِيَاس"
      confirm:
        - text: >
            «قابلية القياس» — مُدرَج بوصفه مصطلحاً في مجال الرياضيات والفلك
            (ترجمته في هذا السياق: rectifiable — خطأ في الربط، لكن الشاهد هو
            ورود المصطلح العربي كوحدة معجمية ثابتة).
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM"
        - text: >
            «قابلية القياس» — مُدرَج في موسوعة الكهرباء الدولية IEC 60050 ضمن
            مصطلحات تقنية (الربط بـ scalability خطأ في البيانات، لكن المصطلح
            العربي حاضر كوحدة اصطلاحية).
          source: "موسوعة الكهرباء (IEC 60050) — ARABTERM"
        - text: >
            «قابلية الانضغاط»، «قابلية القسمة»، «قابلية التوصيل»، «قابلية التبعثر»،
            «قابلية التطاير» — شواهد على النمط الاشتقاقي المُنتِج «قابلية + مصدر»
            في المصطلحات العلمية العربية.
          source: "معاجم ARABTERM المتعددة (1989–2017)"
        - text: >
            «مِنَ الْقِيَاسِ، وَهُوَ تَقْدِيرُ الشَّيْءِ بِالشَّيْءِ، وَالْمِقْدَارُ مِقْيَاسٌ.
            تَقُولُ: قَايَسْتُ الْأَمْرَيْنِ مُقَايَسَةً وَقِيَاسًا.»
          source: "مقاييس اللغة لابن فارس — مادة قوس/قيس"
      expands:
        - text: >
            «قَبَلَ: الْقَافُ وَالْبَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ تَدُلُّ كَلِمُهُ
            كُلُّهَا عَلَى مُوَاجَهَةِ الشَّيْءِ لِلشَّيْءِ. […] وَقَبِلْتُ الشَّيْءَ قَبُولًا.»
          source: "مقاييس اللغة لابن فارس — مادة قبل"
          addition: >
            يُبيّن أن أصل «قابل» هو المُستقبِل/المواجِه، ومنه «القابلية» بمعنى
            الاستعداد الذاتي لاستقبال الفعل (هنا: القياس).
        - text: >
            «مَقِيس، قابل للقياس» — ترجمته بالإنجليزية: commensurable.
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: >
            يُثبت استخدام «مَقيس» صفةً عربيةً بمعنى «قابل للقياس»، مما يدعم
            الجذر الاشتقاقي لمرشَّح «مَقِيسِيَّة».
        - text: >
            «مُمْكِنُ القِياس» — ترجمته: measurable.
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            بديل مركَّب وصفي من الاستخدام الطبي، يُؤكّد أن المصطلحية العربية
            تُعبِّر عن «measurable» بالتركيب لا بالاشتقاق الأُحادي.
        - text: >
            «قابلٌ للقياس؛ ممكنٌ قياسُهُ.» (translation_en: quantifiable).
          source: "المورد الحديث (2008)"
          addition: >
            يؤكد أن الصيغة الوصفية «قابل للقياس» هي الترجمة العربية الراسخة
            للمفهوم، وأن الاسم المجرد «قابلية القياس» تحويلٌ صناعيٌّ منها.

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَقِيسِيَّة"
      evidence_status: "no_material_found"

    - lemma: "قِيَاسِيَّة"
      contradicts:
        - text: >
            «قياسي» بمعنى: ما كان على مثال وقياس، موافق للمعيار أو القانون. مثال:
            «وزن قياسي»، «رقم قياسي»، «مصطلح قياسي».
          source: "المعجم الوسيط — الاستخدام المعاصر الراسخ لـ«قياسي»"
          conflict: >
            «قياسية» تُحمَل في الفهم العربي الراهن على معنى «النمطية والمعيارية»
            (= normativity / standardness)، لا على «قابلية القياس»، مما يُنشئ
            اشتراكاً لفظياً مُخِلاً بالمصطلح.

    - lemma: "صَلَاحِيَّةُ الْقِيَاس"
      evidence_status: "no_material_found"

    - lemma: "التَّكَمُّمِيَّة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "قَابِلِيَّة القِيَاس"
      decision: confirmed
      decision_reason: >
        المصطلح مُسجَّل في قواعد ARABTERM المتعددة بوصفه وحدة معجمية راسخة،
        ويقوم على نمط اشتقاقي مُنتِج جداً في المصطلحية العربية (قابلية + مصدر).
        الجذران «قبل» و«قوس/قيس» كلاهما أصيل، وكلاهما ذو صلة مباشرة بالمفهوم
        (الاستعداد للتلقّي + التقدير الكمّي). رغم أن ربطَي ARABTERM خاطئان
        (rectification, scalability)، إلا أن الخطأ يقع في قاعدة ARABTERM لا في
        المصطلح ذاته. لا يُوجد بديل أقوى توثيقاً وانتشاراً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تدل على الخاصية المجردة التي تُمكّن من
        إسناد قيمة عددية للشيء وفق معيار منهجي. تتمايز عن «قابلية العد»
        (countability) المقتصرة على الأعداد الصحيحة، وعن «قابلية التحديد»
        (determinability) الأشمل التي لا تستلزم قيمة كميّة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ الْقِيَاس"

    # ── مرشحات المرحلة ١ (جميعها مرفوضة) ──
    - lemma: "مَقِيسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد في أي معجم. صيغة «مقيسية» مصدر صناعي من اسم المفعول «مقيس»،
        وهذا الأخير يُستخدم بمعنى «commensurable» (= القابل للقياس المشترك) لا
        بمعنى «measurable» بالمطلق، مما يُضيّق الدلالة تضييقاً غير مقصود.
        علاوة على ذلك، لا توجد شواهد استعمالية تُثبّت هذه الصيغة.

    - lemma: "قِيَاسِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        تتعارض مع الاستخدام العربي الراسخ: «قياسي» و«قياسية» تُفيدان
        «النمطية والمعيارية» (= normativity) لا «القابلية للقياس». إبقاؤها
        يُنشئ اشتراكاً لفظياً مُضِلاً لدى المتخصصين.

    - lemma: "صَلَاحِيَّةُ الْقِيَاس"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُسجَّل في أي مصدر معجمي. «صلاحية» تُفيد الكفاءة الوظيفية والاستعداد
        التشغيلي (fitness for purpose)، وهي أضيق دلالةً من «قابلية» التي تُشير
        إلى الاستعداد الذاتي الجوهري للشيء. اللمّة الموجودة أدق وأوسع انتشاراً.

    - lemma: "التَّكَمُّمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُسجَّل في أي مصدر معجمي. رغم سلامتها الاشتقاقية من «كمّ» الفلسفي،
        إلا أنها نيولوجيزم تام غير متداول، وهي أقرب إلى «quantifiability» الضيّقة
        (القابلية للتكميم الرقمي الصارم) دون أن تُغطّي «measurability» بمعناها
        الأوسع (أي قياس الكيفيات التي لها مقدار غير صارم). لا تُضيف قيمة فوق
        اللمّة الموجودة.


