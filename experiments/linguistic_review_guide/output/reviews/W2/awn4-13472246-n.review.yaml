# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13472246-n
# concretion / تَحَصٍّ
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تحصي» مكتوبة بدون تشكيل، والصيغة الصحيحة للمصدر هي تَحَصٍّ (بالتنوين) أو تَحَصِّي (في الإضافة)"
      - "المجموعة تحتوي على لمّة واحدة فقط، ممّا قد يُفقِر الشبكة الدلالية"
      - "التعريف العربي مقبول لكنّه يستعمل عبارة وصفية (تشكل أجسام تشبه الحجارة) بدلاً من مصطلح طبي دقيق"
    observations: >
      المفهوم طبّي واضح يتعلق بتكوّن الحصيات داخل الأعضاء (الكُلَى، المرارة، المثانة).
      الجذر المناسب هو (حصو/حصي) الذي منه الحَصاة والحَصَى.
      المصدر تَحَصٍّ على وزن تَفَعُّل من الفعل الخماسي تَحَصَّى (بمعنى صار ذا حَصَى)
      هو الأنسب لهذا المفهوم، وقد اعتمدته المعاجم الطبية الموحدة مقابلاً لـ lithiasis.
  blind_candidates:
    - lemma: "تَحَصٍّ"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَعُّل من الفعل تَحَصَّى (من جذر حصو/حصي = حَصَاة)،
        يدلّ على عملية تَكَوُّن الحصيات، وهو المقابل الدقيق لـ lithiasis في المعاجم الطبية.
    - lemma: "تَكَلُّس"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَعُّل من كَلَّسَ (من الكِلْس = الجير)، يدلّ على ترسّب أملاح الكالسيوم
        في الأنسجة. مصطلح طبّي شائع لكنّه يختصّ بترسيب الكالسيوم (calcification) لا بتكوّن الحَصَى.
    - lemma: "تَحَجُّر"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَعُّل من تَحَجَّرَ (من الحَجَر)، يدلّ على صيرورة الشيء صُلباً
        كالحجر. يُستعمل في الجيولوجيا مقابلاً لـ petrification/lithification.
    - lemma: "دَاءُ الحَصَاة"
      generation_method: tarkib
      justification: >
        مركّب إضافي يجمع بين «داء» و«الحصاة»، يصف الحالة المَرَضية
        التي تتكوّن فيها حصيات داخل الجسم. تعبير وصفي واضح الدلالة.


stage2_evidence:
  per_lemma:
    - lemma: "تَحَصِّي"
      confirm:
        - text: "«تَحَصِّي — calculosis»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَحَصٍّ (تَحَصِّي) — lithiasis»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«التَّحَصِّي: تكوُّن الحصاة في المرارة إلخ.»"
          source: "المورد الحديث (2008)"
        - text: "«تحصّي، رُمال — lithiasis»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«تحصي الشعب: عملية تكون حصى في الشعب الرئوية — broncholithiasis»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      expands:
        - text: "«حصاة: تراكم شاذ من أملاح معدنية يحدث عادة داخل قنوات أو أعضاء مجوفة»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "يوضح طبيعة الحصاة بأنها تراكم أملاح معدنية في قنوات أو أعضاء مجوّفة"
        - text: "«الْحَصَاة: خثورة البَوْل في المثانة حتى يصير كالحصاة»"
          source: "المعجم الوسيط"
          addition: "يربط الحصاة الطبية بتخثّر البول في المثانة، وهو أحد أشكال التحصّي"

    - lemma: "تَكَلُّس"
      contradicts:
        - text: "«التكلس (في الكيمياء): ترسيب أملاح الكلسيوم غير القابلة للذوبان (مج)»"
          source: "المعجم الوسيط"
          conflict: "التكلّس مفهوم كيميائي يخصّ ترسّب أملاح الكالسيوم (calcification)، وليس تكوّن حصيات (concretion/lithiasis)"
        - text: "«تكلس: ترسب الجير أي الكلس في الغضاريف أو الأوتار — calcification»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "يؤكد أنّ التكلّس هو ترسّب الجير في الأنسجة، وهو مفهوم مغاير لتكوّن الحَصَى"

    - lemma: "تَحَجُّر"
      contradicts:
        - text: "«تحجّر: صلب كالحجر»"
          source: "المعجم الوسيط"
          conflict: "التحجّر يدلّ على صيرورة الشيء صُلباً كالحجر (petrification)، لا على تشكّل حصيات في عضو حيّ"
        - text: "«تحجُّر: تغير المواد العضوية إلى مادة حجرية بإحلال مواد معدنية محل أنسجتها العضوية — petrification»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "التحجّر مصطلح جيولوجي يعني استحالة المادة العضوية إلى حجرية، لا تكوّن حصيات طبّية"

    - lemma: "دَاءُ الحَصَاة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "تَحَصِّي"
      decision: confirmed
      decision_reason: >
        مصطلح طبّي معتمد في المعاجم الطبية الموحدة مقابلاً لـ lithiasis وcalculosis.
        المورد الحديث يعرّفه صراحةً بتكوّن الحصاة. الجذر حصو/حصي على وزن تَفَعُّل مناسب
        للدلالة على العملية. يحتاج تصحيح التشكيل إلى تَحَصٍّ (الصيغة المعجمية المعيارية بالتنوين).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الطبي المعياري لعملية تكوّن الحَصَى داخل أعضاء الجسم"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحَصٍّ"

    - lemma: "تَحَصٍّ"
      source: stage1
      decision: removed
      decision_reason: >
        هو نفس اللمّة الموجودة «تحصي» بعد التشكيل الصحيح. تمّ دمج التصحيح
        في إجراء update_lemma أعلاه، فلا حاجة لإنشاء مدخل جديد.
      evidence_assessment:
        case: confirm_only

    - lemma: "تَكَلُّس"
      source: stage1
      decision: removed
      decision_reason: >
        التكلّس (calcification) مفهوم مختلف عن التحصّي (concretion/lithiasis).
        التكلّس يعني ترسّب أملاح الكالسيوم في الأنسجة، بينما التحصّي يعني تكوّن
        حصيات صلبة داخل الأعضاء المجوّفة. الأدلة المعجمية تؤكّد هذا الفرق.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَحَجُّر"
      source: stage1
      decision: removed
      decision_reason: >
        التحجّر (petrification/lithification) مصطلح جيولوجي يدلّ على تحوّل المواد
        العضوية إلى مادة حجرية. لا يُستعمل في الطبّ لعملية تكوّن الحصيات. الأدلة
        المعجمية تُظهر فرقاً واضحاً بين المفهومَين.
      evidence_assessment:
        case: contradicts_only

    - lemma: "دَاءُ الحَصَاة"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ وليس مصطلحاً مسكوكاً. يمكن إبدال «داء» بـ«مرض» أو «عِلّة»
        والعبارة تظلّ صالحة كوصف، فلا يجتاز اختبار السكّ. كما أنّ المفهوم
        هو العملية (تكوّن الحَصَى) لا المرض.
      evidence_assessment:
        case: no_material


