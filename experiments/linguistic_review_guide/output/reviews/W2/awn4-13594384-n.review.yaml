      - "في المعجم الطبي الموحد (2009)، يُقابَل «تَبَثُّر» بـ pustulation (تكوُّن البثور القيحية) لا vesiculation (تكوُّن الحويصلات السائلية) — وهذا تمييز طبي دقيق مهمّ يُضعف دقة المصطلح في هذه المجموعة"
      - "المصطلح الطبي الدقيق لـ vesication/vesiculation وهو «تَنَفُّط» — الوارد صراحةً في المعجم الطبي الموحد — غائب عن المجموعة"
    observations: >
      المجموعة تعالج عملية تكوُّن الحويصلات الجلدية (vesiculation) وهي مفهوم طبي دقيق يختلف
      من الناحية التشريحية عن تكوُّن البثور القيحية (pustulation). الجذر «نفط» هو الجذر
      العربي الأقدم والأدقّ للإشارة إلى هذه العملية؛ إذ يورد ابن فارس في المقاييس أن
      «النَّفَطُ: قَرْحٌ يَخْرُجُ فِي الْيَدِ مِنَ الْعَمَلِ»، ويربط الخليلُ في العين
      «بَثَرَ جِلْدُهُ» بـ«تَنَفَّطَ» — مما يجعل التنفط أصلاً وليس مجرد مرادف.
      «تكون الحويصلات» لا يعدو أن يكون نسخة اسمية من التعريف، وحذفه ضرورة معجمية.

  # ب. المرشحات الأربعة (توليد أعمى — قبل الاطلاع على synset_info)
