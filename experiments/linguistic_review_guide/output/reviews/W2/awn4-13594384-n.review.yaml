        (تَبَثَّرَ الجِلْدُ = بَثَرَ).
    - lemma: "تَنَفُّخ"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَعُّل من الجذر «نفخ»؛ تكوُّن الحويصلة ينطوي على تجويف مملوء بالسائل
        (انتفاخ موضعي)، مما يجعل «نَفَخَ» مرجعاً مجازياً وظيفياً لهذه العملية.


