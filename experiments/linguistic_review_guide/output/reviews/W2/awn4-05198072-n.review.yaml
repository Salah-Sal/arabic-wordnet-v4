      nuance_differentiation: >-
        نُفُوذ يُعبِّر عن التأثير المسيطر بوصفه قوةً نافذةً تخترق الحواجز وتصل إلى الغايات البعيدة؛
        فيها إيحاء بالمدى والانتشار وإحكام القبضة من بُعد. أكثر ارتباطاً بالسياق
        السياسي والاجتماعي من سائر أخواتها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُفُوذ"

    # ── مرشحات المرحلة ١ ──

    - lemma: "هيمنة"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم ثبوت «هيمنة» في المعجمية المعاصرة بمعنى hegemony، إلا أن ابن فارس يُضعِّف جذرها
        (همن) ويحيله إلى (أمن) — مما يُظهر أنها مستعارة المبنى. علاوةً على ذلك، تحمل طابعاً
        سياسياً محدداً (هيمنة دولة على أخرى) يجعلها أضيق من المجموعة الترادفية الحالية.
        المجموعة كافية بلمّاتها الأربع الموجودة.

    - lemma: "تحكم"
      source: stage1
      decision: removed
      decision_reason: >-
        التحكم يدل على فعل السيطرة والضبط (controlling) لا على حالة امتلاكها (possession of
        controlling influence). المجموعة الترادفية تصف الصفة والحالة، لا الفعل نفسه.
        استخداماته المعجمية في ARABTERM تربطه بالسياق التقني (control systems)
        أكثر من السياق الاجتماعي السياسي.

    - lemma: "بسطة"
      source: stage1
      decision: removed
      decision_reason: >-
        بسطة تدل على «الزيادة والسعة» وفق المعاجم الأصيلة، وهي معنى مغاير لـ«التأثير المسيطر».
        استشهاد المعجم الكبير بـ«السطوة والقدرة» ضمن مداخلها لا يكفي لإثبات اشتراكها في
        هذا المعنى تحديداً بصورة أولية. ارتباطها القرآني بالزيادة في العلم والجسم يبعدها
        عن دلالة التأثير المسيطر.

    - lemma: "سيطرة"
      source: stage1
      decision: removed
      decision_reason: >-
        سيطرة، كالتحكم، تشير إلى الفعل والنشاط (controlling) لا إلى الحالة والصفة.
        المجموعة الترادفية تصف «possession of» أي الامتلاك والحالة. فضلاً عن ذلك،
        فإن المعجم الكبير يُثبت التحكم بمعنى «السيطرة» مما يجعل سيطرة مرادفاً من درجة ثانية.
        اللمّات الموجودة كافية ولا تحتاج إضافة.


