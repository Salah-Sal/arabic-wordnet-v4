# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة «قوة» واسعةٌ دلالياً وتشمل معانيَ كثيرة (القوة الجسدية، العسكرية، الفيزيائية)؛ حضورُها هنا يحتاج تمييزاً بالفرق الدلالي."
      - "اللمّة «قدرة» تميل نحو الطاقة والإمكانية أكثر من «التأثير المسيطر»؛ قد تتداخل مع synsets الكفاءة والاستطاعة."
      - "التعريف الحالي «امتلاك تأثير مسيطر» ترجمةٌ مباشرة للإنجليزي؛ يحتاج إعادة صياغة بأسلوب المعجم العربي."
      - "لا تشكيل كامل على أي من اللمّات الأربع في بيانات المجموعة."

    observations: >-
      المجموعة الترادفية تجمع مصطلحات تدور حول مفهوم واحد هو «امتلاك سلطان مؤثِّر على الآخرين»، غير أن كل لمّة تحمل ظلّاً دلالياً خاصاً:
      فـ«سطوة» تنبثق من القهر والبطش، و«قدرة» من التمكّن الذاتي والطاقة، و«قوة» من الشدة والمنعة،
      و«نفوذ» من التغلغل والوصول إلى مناطق بعيدة. هذه الفوارق تجعل المجموعة ترادفاً تقريبياً لا تاماً،
      وتستوجب توثيق nuance لكل لمّة. الـhypernym (جودة/نوعية — صفة جوهرية ومميِّزة) مناسب إذ هذه الكلمات تصف حالاً وصفتاً.

  # ── التوليد العمياء: من التعريف المُقنَّع فقط (بدون الاطلاع على اللمّات) ──
  blind_candidates:
    - lemma: "هَيْمَنَة"
      generation_method: majaz
      justification: >-
        من الجذر (أمن) بإبدال الهمزة هاءً؛ المُهيمِن في العربية «الشاهد الحافظ الرقيب».
        المجاز: الانتقال من «الرقابة والحفظ» إلى «التأثير المسيطر» مشابهة وظيفية طبيعية.
        الكلمة مستوعَبة في المعجمية المعاصرة بمعنى الهيمنة والسيطرة، وهي مسكوكة.

    - lemma: "سَيْطَرَة"
      generation_method: ishtiqaq
      justification: >-
        من جذر (سطر) على وزن فَيْعَلَة الذي ينتج مصادر الأفعال الرباعية المزيدة.
        «سَيطر على» يعني أحكم السيطرة والتحكم. المصدر «سَيْطَرة» يدل على حالة امتلاك
        التحكم وهو قريب جداً من «possession of controlling influence».

    - lemma: "تَحَكُّم"
      generation_method: ishtiqaq
      justification: >-
        من الجذر (حكم) على وزن تَفَعُّل، يدل على الاستيلاء على الحكم والتحكم في الشيء.
        في الاستعمال العلمي المعاصر يعني «ضبط الشيء والسيطرة عليه» وهو
        مناسب لمفهوم «التأثير المسيطر».

    - lemma: "بَسْطَة"
      generation_method: ishtiqaq
      justification: >-
        من الجذر (بسط) على وزن فَعْلَة. ورد قرآنياً «وَزَادَهُ بَسْطَةً فِي الْعِلْمِ وَالْجِسْمِ»
        بمعنى الزيادة والسعة والقدرة المُمتدَّة. وقد أثبتها المعجم الكبير مرادفةً للسطوة والقدرة.
        إحياء هذا اللفظ القرآني في سياق «امتلاك التأثير المسيطر» مجازٌ صريح.


