# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "سطوة"
      decision: confirmed
      decision_reason: >-
        كلمة عربية فصيحة عريقة ثبتت في المعاجم الكلاسيكية والمعاصرة بمعنى شدة البطش والقهر والعلو.
        تلتقي مع «possession of controlling influence» في بُعد التأثير القسري على الآخرين.
        جذرها (سطو) أثبته ابن فارس على «القهر والعلو»، وهو ما يجعلها ملائمة للمجموعة.
        تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        سَطْوَة تُعبِّر عن التأثير المسيطر بوصفه قهراً صادراً من علوٍّ؛ فيها إيحاء بالبطش
        والإذلال وحدّة الشخصية. هي أشد وطأةً وأكثر قسوةً من أخواتها في المجموعة؛
        تُوصَف بها الأمراء والطغاة وأصحاب السلطة القاهرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَطْوَة"

    - lemma: "قدرة"
      decision: confirmed
      decision_reason: >-
        كلمة محورية في المعجمية العربية، تدل على «الطاقة والتمكن من الفعل وتركه بالإرادة».
        تتقاطع مع «possession of controlling influence» من جانب القدرة الإرادية والفاعلية.
        موثقة في جميع المعاجم الكلاسيكية والمعاصرة، وتستخدم على نطاق واسع.
        تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        قُدْرَة تُعبِّر عن التأثير المسيطر بوصفه طاقةً ذاتيةً وكفاءةً متأصّلة في الفاعل؛
        فيها إيحاء بالإمكانية الكامنة والاستعداد للفعل. أقل عنفاً وأكثر ارتباطاً بالكفاءة
        والاستحقاق من «سطوة»، وأشد تخصصاً من «قوة».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُدْرَة"

    - lemma: "قوة"
      decision: confirmed
      decision_reason: >-
        أم المفردات في الدلالة على الشدة وخلاف الضعف، وهي الأوسع دلالةً في المجموعة.
        تشمل القوة المادية والمعنوية والسياسية. موثقة في المعاجم الكلاسيكية كلها.
        اتساعها الدلالي مبرَّر بكونها المرجع الجذري الذي تنشعب منه سائر اللمّات.
        تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        قُوَّة هي الأشمل والأعمّ في المجموعة؛ تدل على التأثير المسيطر بوصفه شدةً ومنعةً
        لا تقتصر على نوع واحد من الفاعلية. تحتمل البُعدَيْن المادي (عسكري، جسدي)
        والمعنوي (سياسي، معرفي). وضعُها في المجموعة يجعلها المرجعَ الأصوليَّ الذي
        تشتق منه سائر الفوارق الدلالية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُوَّة"

    - lemma: "نفوذ"
      decision: confirmed
      decision_reason: >-
        تدل على السلطان والقوة التي تتغلغل وتبلغ أبعد مدى. المعجم الوسيط يثبتها في
        سياق «مناطق النفوذ» أي البلاد التي تبسط عليها الدول الكبرى سلطانها — وهو
        تطابق مباشر مع «possession of controlling influence». التحذر من المعنى
        التقني (نفاذية المواد) في ARABTERM لا ينعكس على المعنى العام المطلوب هنا.
        تحتاج تشكيلاً كاملاً.
