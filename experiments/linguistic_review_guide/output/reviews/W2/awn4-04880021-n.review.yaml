# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-04880021-n  |  ILI: i62591
# التعريف: a quality appropriate to a parent
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الأولى 'أُبُوَّة/أُمُومَة' تجمع مصطلحَيْن متمايزَيْن بشرطة مائلة — هذا غير مقبول معجمياً؛ إذ يعكس تردداً في الاختيار لا ترادفاً حقيقياً"
      - "'أُبُوَّة' تدل على paternity (صفة الأب)، و'أُمُومَة' تدل على maternity (صفة الأم)؛ وكلتاهما تصفان مصدر الوالدية لا الصفة المجردة المناسبة للوالد بوجه عام"
      - "لمّة 'صِفَة وَالِدِيَّة' عبارة وصفية حرة لا تجتاز اختبار السك — يمكن استبدال 'صفة' بـ'خاصية' أو 'سمة' ويبقى الوصف صالحاً، مما يدل على أنها ليست وحدة معجمية ثابتة"
      - "التعريف الحالي 'صفة مناسبة للوالد' مقتضَب ويفتقر إلى الجنس القريب والفصل النوعي"
    observations: >
      المجموعة awn4-04880021-n تعاني من شُحّ في الإقنان المعجمي العربي الكلاسيكي لمفهوم 'parental quality'
      — أي الصفة المجردة المنسوبة إلى الوالد بصرف النظر عن جنسه. المصطلحات العربية التقليدية
      كـ'أُبُوَّة' و'أُمُومَة' تُجنِّس المفهوم وتُقيّده بجنس بعينه. مصطلح 'والدية' الذي ورد
      في اللمّة الثانية (صِفَة وَالِدِيَّة) يُرشّح ليكون المصطلح الجامع الأنسب إذا استُخدم مفرداً.
      التعريف الإنجليزي (a quality appropriate to a parent) يُشير إلى جودة/سمة مجردة لا إلى
      الحالة الاجتماعية-القانونية للوالد.
  blind_candidates:
    - lemma: "وَالِدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'والد' على وزن فَاعِلِيَّة، يدل على الخاصية الجامعة المشتركة بين الأب والأم في مكانتهما الوالدية؛ يتجاوز تجنيس 'أُبُوَّة' و'أُمُومَة' ويُعبّر عن المفهوم محايد الجنس."
    - lemma: "أَبَوِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من 'أَبَوِيّ' على وزن فَعَلِيَّة، يحمل معنى الطبيعة والخاصية المنسوبة إلى الوالد بمعناه الشامل، مع استخدام 'أبوي' في اللغة المعاصرة بمعنى parental."
    - lemma: "أُبُوَّة"
      generation_method: ishtiqaq
      justification: "مصدر على وزن فُعُولَة من جذر 'أبو'، يدل على الخاصية الجوهرية للأبوة ومشتق من الفعل 'أبا يأبو' بمعنى ربّا وغذا، مما يقرّبه دلالياً من صفة الرعاية الوالدية."
    - lemma: "أُمُومَة"
      generation_method: ishtiqaq
      justification: "مصدر على وزن فُعُولَة من جذر 'أمم'، يدل على الخاصية الجوهرية للأمومة كالحنو والرعاية، وقد يُستخدم للدلالة على الجانب العاطفي الرعائي للوالدية."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المُنفَّذة (٥ استعلامات):
# ١. مطابقة دقيقة دفعية لجميع اللمّات والمرشحات
# ٢. إثراء دفعي (تعريفات + أمثلة + جموع) بالمعرّف
# ٣. جسر إنجليزي (parental / parenthood / paternity / maternity / parentage)
# ٤. مقاييس اللغة لجذور: ولد، أبو، أمم
# ٥. FTS عربي (صفة + والدي + أبوي)
stage2_evidence:
  per_lemma:
    - lemma: "أُبُوَّة/أُمُومَة"
      contradicts:
        - text: "«أُبوَّة: paternity»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "'أبوة' تُترجم بـpaternity الذي يدل على الأبوة القانونية للأب تحديداً، لا على الصفة الوالدية الجامعة"
        - text: "«أمومة: maternity»"
          source: "المعجم الموحد لمصطلحات القانون (2017) والمَكنَز الزراعي متعدد اللغات"
          conflict: "'أمومة' تُترجم بـmaternity الذي يدل على الأمومة للأم وحدها"
        - text: "«أَبَوِيَة: أبُوّة نسبة إلى الأب (بوشر)»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          conflict: "يقيّد 'أبوة/أبوية' بالنسبة إلى الأب وحده، مما يؤكد تجنيس المصطلح"

    - lemma: "صِفَة وَالِدِيَّة"
      evidence_status: "no_material_found"

    - lemma: "وَالِدِيَّة"
      confirm:
        - text: "«والدية: parenthood»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«أبُوّة؛ والِديّة» — مقابل parenthood"
          source: "المورد الحديث (2008)"
        - text: "«تنظيم الوالدية: planned parenthood»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«أَبَوِيّ؛ والديّ parental authority» — مقابل parental"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن النسبة 'والدي' تعادل 'parental' في الاستخدام المعاصر الراسخ"
        - text: "«تربية والدية: parental education»"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020)"
          addition: "يؤكد تثبيت 'والدية' كصفة مركبة في السياق التعليمي المؤسسي"

    - lemma: "أَبَوِيَّة"
      contradicts:
        - text: "«نظام اجتماعي يتألف من جماعة أو جماعات، أصلها أسرّ مشتركة في الدم، بحيث تخضع جميعها لسلطة حاكم هو أكبر الذكور فيها»"
          source: "المعجم الوسيط"
          conflict: "'الأبوية' مُقنَّنة بمعنى النظام الأبوي (patriarchal system) وهو مصطلح أنثروبولوجي يختلف كلياً عن 'parental quality'"
        - text: "«نظام اجتماعىّ يتألف من جماعة أو جماعات، أصلها أُسرٌ مشتركة في الدّم بحيث تخضع جميعها لسلطة حاكم هو أكبر الذكور فيها»"
          source: "المعجم الكبير"
          conflict: "تكرار نفس التعريف الأنثروبولوجي في مصدر مستقل — مما يُرسّخ الاشتباك الدلالي"

    - lemma: "أُبُوَّة"
      expands:
        - text: "«أُبوَّة: paternity»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يدل على الأبوة القانونية للأب، لا الصفة المجردة"
        - text: "«أبُوّة؛ والِديّة: parenthood» و«الأُبوّة؛ الأَبَوية: paternity»"
          source: "المورد الحديث (2008)"
          addition: "تُدرج 'أبوة' ضمن ترجمات parenthood مع 'والدية'، مما يدل على تداخل دلالي جزئي"
        - text: "«تفاعل الأُبُوَّة: paternity reaction» و«اختبارات الأُبُوَّة: paternity tests»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُرسّخ اختصاص 'أبوة' بالمعنى البيولوجي/القانوني للأب"

    - lemma: "أُمُومَة"
      contradicts:
        - text: "«نظام الأمومة (Matriarcat): نظام أُسرىّ تعتمد فيه القرابة على الأم وحدها وتعتبر رأس الأسرة»"
          source: "المعجم الكبير"
          conflict: "'الأمومة' في المعاجم الكبرى تدل على نظام اجتماعي مخصوص بالأم، وليس صفة وجدانية عامة للوالدية"
        - text: "«أمومة: maternity»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "تُترجم بـmaternity المقيّدة بالأم"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "أُبُوَّة/أُمُومَة"
      decision: removed
      decision_reason: >
        تجمع الشرطة المائلة مصطلحَيْن مستقلَّيْن لا يترادفان — 'أُبُوَّة' للأب و'أُمُومَة' للأم.
        كلاهما يدل على 'مصدر كون الشخص والداً' (paternity/maternity) لا على 'الصفة المناسبة
        للوالد' (parental quality). الأدلة المعجمية تُرسّخ تجنيس كلٍّ منهما. لا تجتاز هذه
        الوحدة المائزة اختبار الانسجام الدلالي مع تعريف المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "صِفَة وَالِدِيَّة"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا تجتاز اختبار السك: يمكن استبدال 'صفة' بـ'خاصية' أو 'سمة'
        ويبقى التعبير وصفاً صحيحاً، مما يعني أن 'صفة' ليست مُكوِّناً إضافياً ثابتاً.
        لا أدلة معجمية تدعمها كوحدة مسكوكة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وَالِدِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك موثَّق في ثلاثة مصادر معاصرة معتمدة بترجمة 'parenthood/parental'.
        هو الأقرب دلالياً وتوثيقاً إلى 'parental quality' لأنه: (١) يدل على الخاصية الوالدية
        بلا تجنيس، (٢) مشتق من 'والد' الشامل للأب والأم، (٣) محايد الجنس على خلاف
        'أُبُوَّة' و'أُمُومَة'. يجتاز اختبار التثبيت المعجمي بشواهد من معاجم متخصصة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة المؤكدة في المجموعة؛ تُعبّر عن الخاصية الوالدية الجامعة بلا تخصيص للجنس، خلافاً لـ'أُبُوَّة' (الأب) و'أُمُومَة' (الأم)"
      actions:
        - command: create_entry
          params:
            lemma: "وَالِدِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04880021-n"

    - lemma: "أَبَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكبرى (الوسيط، الكبير) تُقنّن 'الأبوية' بمعنى 'النظام الأبوي'
        (patriarchal system) — وهو مصطلح أنثروبولوجي يتعارض مع المعنى المطلوب.
        الاشتباك الدلالي الموثَّق في مصدرين مستقلَّيْن يكفي لإخراجها من المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "أُبُوَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مقيَّدة بالأب (paternity) دون الأم، ولا تُعبّر عن 'parental quality' الجامعة
        المحايدة الجنس. قبولها بمعناها المفرد سيُضيّق المجموعة وينحاز للأب على حساب الأم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "أُمُومَة"
      source: stage1
      decision: removed
      decision_reason: >
        مقيَّدة بالأم (maternity)؛ تتعارض مع الحياد الجنسي لتعريف المجموعة 'a quality
        appropriate to a parent'. الأدلة تُرسّخ خصوصيتها بالأم في كل المصادر المُستعلَمة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "صفة مناسبة للوالد"
    assessment:
      decision: revise
      reason: >
        التعريف مقتضَب ومُدَوَّر — إذ يُعرَّف المفهوم بنفسه ('صفة' مع 'مناسبة') دون
        جنس قريب واضح ولا فصل نوعي كافٍ. لا يوضّح طبيعة هذه الصفة ولا نطاق انطباقها.
    authored:
      - type: linguistic
        text: "ما يَخُصُّ الوالدَ من السِّمات والخِلال في تربية أبنائه ورعايتهم والإشفاق عليهم"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04880021-n"
          definition_index: 0
          text: "ما يَخُصُّ الوالدَ من السِّمات والخِلال في تربية أبنائه ورعايتهم والإشفاق عليهم"

  examples:
    per_lemma:
      - lemma: "وَالِدِيَّة"
        examples:
          - text: "تجلّت والديّتُه الحقيقية في صبره على تعليم أبنائه ورعاية احتياجاتهم رغم شُحّ الإمكانات"
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تجلّت والديّتُه الحقيقية في صبره على تعليم أبنائه ورعاية احتياجاتهم رغم شُحّ الإمكانات"


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
