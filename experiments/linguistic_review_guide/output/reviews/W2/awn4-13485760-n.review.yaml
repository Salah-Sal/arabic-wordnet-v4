stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دقيق ولكنه يخلو من الإشارة إلى المواد الكيميائية التي تعتبر أساس عملية التحميض، على الرغم من أنه يفي بالغرض من حيث بيان الجنس والفصل النوعي."
    observations: "المفهوم يتعلق بعملية التصوير الفوتوغرافي التقليدي (الفيلمي). المصطلحات المستخدمة في العربية 'تحميض' و'تظهير' مشتقة اشتقاقاً سليماً من جذور عربية؛ فالأول يركز على المادة المستخدمة (الحمض الكيميائي) والثاني يركز على النتيجة (الظهور)."
  blind_candidates:
    - lemma: "تَحْمِيض"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل حمّض، بناءً على استخدام الأحماض والمواد الكيميائية في عملية معالجة الفيلم الفوتوغرافي لإيقاف التفاعل وإظهار الصورة."
    - lemma: "تَظْهِير"
      generation_method: ishtiqaq
      justification: "مشتق من الفعل ظهّر، بمعنى جعل الصورة تظهر وتبرز بعد أن كانت خفية على المادة الحساسة."
    - lemma: "إِظْهَار"
      generation_method: ishtiqaq
      justification: "مصدر للفعل أظهر، يدل على إبراز الشيء الخفي وجعله مرئياً."
    - lemma: "كَشْف صُورِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يشير إلى عملية الكشف عن الصورة الكامنة في الفيلم."

stage2_evidence:
  per_lemma:
    - lemma: "تحميض"
      confirm:
        - text: "«حمَّض الشَّريطَ أو الفيلْمَ: ظهَّره؛ بيَّنه وأظهره بفعل الموادّ الكيميائيَّة. التَّحميض في التَّصوير: (كم) التَّظهير؛ إبراز الصُّورة على الفِيلم بغسله بموادّ كيميائيّة خاصّة 'حجرة التحميض لها مواصفات خاصّة'»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      contradicts: []
      expands:
        - text: "«إضافة حمض إلى محلول ما حتى يصبح عدده الهيدروجيني أقل من سبعة»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
          addition: "يبين الأصل الكيميائي للمصطلح والذي اُستعير لعملية التصوير."
    - lemma: "تظهير"
      confirm:
        - text: "«التَّظهير: التصوير الشمسيّ؛ إبراز الصُّورة على الفيلم بغسله بمواد كيميائيَّة خاصّة.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«إبراز صورة بواسطة حامض كشاف»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية"
      contradicts: []
      expands: []
    - lemma: "إظهار"
      confirm:
        - text: "«مُظْهِر: (كم) محلول كيميائيّ لإظهار الصور.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      contradicts: []
      expands: []
    - lemma: "كشف صوري"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تحميض"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع جداً في مجال التصوير الفوتوغرافي، وموثق معجمياً للإشارة إلى هذه العملية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْمِيض"
    - lemma: "تظهير"
      decision: confirmed
      decision_reason: "مصطلح دقيق فنياً وموثق في المعاجم المعاصرة للإشارة إلى إبراز الصورة على الفيلم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَظْهِير"
    - lemma: "إظهار"
      source: stage1
      decision: removed
      decision_reason: "رغم أن المادة الكيميائية تسمى 'مُظهِر'، إلا أن العملية نفسها يطلق عليها اصطلاحاً في التصوير 'تظهير' أو 'تحميض'. وكلمة 'إظهار' عامة جداً."
    - lemma: "كشف صوري"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي غير مسكوك كمصطلح فني معتمد."

stage4_content:
  definition:
    current: "معالجة مادة حساسة للضوء لجعل الصورة مرئية"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً وموجز، ويشمل الجنس (معالجة) والفصل النوعي (لمادة حساسة للضوء لجعل الصورة مرئية)."
  examples:
    per_lemma:
      - lemma: "تحميض"
        examples:
          - text: "أنهى المصور تَحْمِيضَ لَفافةِ الفِيلْمِ في الغرفة المظلمة بنجاح."
            type: usage
      - lemma: "تظهير"
        examples:
          - text: "تتطلب عملية تَظْهِيرِ الصور الفوتوغرافية استخدام محاليل كيميائية بنسب دقيقة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أنهى المصور تَحْمِيضَ لَفافةِ الفِيلْمِ في الغرفة المظلمة بنجاح."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتطلب عملية تَظْهِيرِ الصور الفوتوغرافية استخدام محاليل كيميائية بنسب دقيقة."

