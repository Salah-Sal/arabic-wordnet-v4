stage1_review:
  assessment:
    concerns:
      - اللمات الموجودة تفتقر إلى التشكيل الكامل.
      - التعريف الحالي بسيط للغاية ويمكن تجويده ليكون أكثر دقة علمية ومعجمية.
    observations: "المجموعة تعبر عن مفهوم 'الفضاء الخارجي'. اللمات الموجودة صحيحة لكنها تحتاج لضبط شكلي وإغناء بمرادفات اصطلاحية أدق."
  blind_candidates:
    - lemma: "الفَضَاءُ الخَارِجِيُّ"
      generation_method: tarkib
      justification: "التعبير الاصطلاحي الأكثر شيوعاً ودقة لوصف الحيز خارج الغلاف الجوي."
    - lemma: "فَضَاءٌ"
      generation_method: majaz
      justification: "استخدام اللفظ العام للدلالة على الفضاء الكوني بالاتساع."
    - lemma: "خَلَاءٌ"
      generation_method: majaz
      justification: "لفظ تراثي وعلمي يعبر عن الفراغ أو الحيز الذي لا مادة فيه، ويستخدم لوصف الفضاء."
    - lemma: "فَضَاءٌ كَوْنِيٌّ"
      generation_method: tarkib
      justification: "تعبير وصفي يؤكد الصفة الكونية للحيز المذكور."

stage2_evidence:
  per_lemma:
    - lemma: "الفضاء الخارجي"
      confirm:
        - text: "أو فضاء خارجي وهو بالنسبة لساكنة الأرض كل ما يقع خارج الغلاف الجوي للأرض حيث توجد ما اكتشف ومازال لم يكتشف من الكواكب والنجوم."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "outer space"
          source: "المكنز الزراعي متعدد اللغات (ArabTerm)"
    - lemma: "فضاء"
      confirm:
        - text: "ما بين الكواكب والنجوم من مسافات لا يعلمها إلا الله. (محدثة)"
          source: "المعجم الوسيط"
        - text: "space"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
    - lemma: "خلاء"
      confirm:
        - text: "الفضاء الواسع الخالي من الأرض."
          source: "المعجم الوسيط"
        - text: "وهذا شامل للخلاء الذي لا يتناهى وهو الخلاء خارج العالم... وحاصله البعد الموهوم الخالي عن الشاغل."
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "vacuum"
          source: "المعجم الطبي الموحد"
          addition: "يشير إلى خاصية الفراغ في الفضاء."
    - lemma: "فضاء كوني"
      confirm:
        - text: "أو فضاء خارجي وهو بالنسبة لساكنة الأرض كل ما يقع خارج الغلاف الجوي للأرض..."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"

