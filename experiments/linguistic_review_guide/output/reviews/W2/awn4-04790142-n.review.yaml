        يعني صفة كون الشيء موثوقاً ومعتمَداً عليه. يغطّي جانب «جدير بالثقة» من التعريف.
    - lemma: "تَصْدِيقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «تصديق» (مصدر الباب الثاني من صدق) بزيادة ياء النسبة والتاء،
        بوزن تَفْعِيلِيَّة. يعبّر عن صفة كون الشيء قابلاً للتصديق — يغطّي جانب «believability».
    - lemma: "مَأمُونِيَّة"
      generation_method: majaz
      justification: >
        مصدر صناعي من «مَأمُون» (اسم مفعول من أمن) بمعنى الذي يُؤمَن جانبه ويُوثق به.
        بالمجاز الدلالي (إزاحة من الأمان الشخصي إلى الجدارة بالثقة) يمكن أن يعبّر عن
        خاصية كون الشيء أو الشخص جديراً بالاعتماد.
    - lemma: "وَثَاقَة"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (و-ث-ق) على وزن فَعَالَة، الدال على ثبوت الصفة ورسوخها،
        كما في «شجاعة» و«فصاحة». يعني الإحكام والرسوخ في الوثوق، وهو ملائم لمفهوم
        «الجدارة بالثقة».


