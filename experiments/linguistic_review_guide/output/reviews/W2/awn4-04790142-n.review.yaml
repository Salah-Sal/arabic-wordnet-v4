      - "لمّة «مِصْدَاقِيَّة» مكتوبة بدون تشكيل كامل في السجلّ — تحتاج إلى تحديث."
      - "المجموعة تجمع مفهومَي «القابلية للتصديق» و«الجدارة بالثقة» في مصطلح واحد، في حين أن اللمّتين الحاليتين يمثّلان فقط جانب التصديق الذهني دون التغطية الكافية للجانب الثقاتي."
    observations: >
      المجموعة awn4-04790142-n تعبّر عن الخاصية المجردة المعروفة في العربية المعاصرة بـ«المصداقية»، وهي مصطلح
      ثابت في المعاجم الحديثة وقرارات مجمع اللغة العربية المصري. الجذر الرئيسي (ص د ق) يحمل في مقاييس ابن فارس
      معنى القوة والصلابة («الصدق: خلاف الكذب، سُمِّيَ لقوته في نفسه»)، وهذا يدعم الدلالة المعنوية للمصطلح.
      اللمّة «قابلية التصديق» تعبّر عن «believability» تحديداً (القابلية للتصديق من منظور المتلقي)، بينما
      «مصداقية» أشمل إذ تدلّ على الجدارة بالتصديق سواء من منظور المرسِل أو المتلقي.
