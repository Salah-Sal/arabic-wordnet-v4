      sense_id: "{auto}"
      nuance: "المصطلح المعياري الجامع — يغطّي البُعدَين الذاتي (الجدارة بالثقة) والتلقّائي (القابلية للتصديق). الأوسع انتشاراً في اللغة العربية المعيارية الحديثة عبر المعاجم والإعلام والخطاب الرسمي."
      mwe: false

    - lemma: "قَابِلِيَّةُ التَّصْدِيقِ"
      sense_id: "{auto}"
      nuance: "مركّب إضافي يؤكد البُعد التلقّائي (believability): إمكانية قبول الشيء للتصديق في نظر المتلقي. أكثر تخصّصاً في البُعد الظاهراتي والانطباعي مقارنةً بمصداقية."
      mwe: true

