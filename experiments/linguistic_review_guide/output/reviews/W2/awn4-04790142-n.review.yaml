# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "مِصْدَاقِيَّة"
      entry_id: "{auto}"
      root: "صدق"
      maqayis_quote: "«الصَّادُ وَالدَّالُ وَالْقَافُ أَصْلٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ قَوْلًا وَغَيْرَهُ. مِنْ ذَلِكَ الصِّدْقُ: خِلَافُ الْكَذِبِ، سُمِّيَ لِقُوَّتِهِ فِي نَفْسِهِ»"

    - lemma: "قَابِلِيَّةُ التَّصْدِيقِ"
      entry_id: "{auto}"
      roots:
        - word: "قابلية"
          root: "قبل"
          maqayis_quote: "«الْقَافُ وَالْبَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ صَحِيحٌ تَدُلُّ كَلِمُهُ كُلُّهَا عَلَى مُوَاجَهَةِ الشَّيْءِ لِلشَّيْءِ... وَقَبِلْتُ الشَّيْءَ قَبُولًا»"
        - word: "التصديق"
          root: "صدق"
          maqayis_quote: "«الصَّادُ وَالدَّالُ وَالْقَافُ أَصْلٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ قَوْلًا وَغَيْرَهُ. مِنْ ذَلِكَ الصِّدْقُ: خِلَافُ الْكَذِبِ، سُمِّيَ لِقُوَّتِهِ فِي نَفْسِهِ»"

    - lemma: "مَوْثُوقِيَّة"
      entry_id: "{auto}"
      root: "وثق"
      maqayis_quote: "«الْوَاوُ وَالثَّاءُ وَالْقَافُ كَلِمَةٌ تَدُلُّ عَلَى عَقْدٍ وَإِحْكَامٍ. وَوَثَّقْتُ الشَّيْءَ: أَحْكَمْتُهُ... وَهُوَ ثِقَةٌ. وَقَدْ وَثِقْتُ بِهِ»"

    - lemma: "تَصْدِيقِيَّة"
      entry_id: "{auto}"
      root: "صدق"
      maqayis_quote: "«الصَّادُ وَالدَّالُ وَالْقَافُ أَصْلٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ قَوْلًا وَغَيْرَهُ. مِنْ ذَلِكَ الصِّدْقُ: خِلَافُ الْكَذِبِ، سُمِّيَ لِقُوَّتِهِ فِي نَفْسِهِ»"

  per_sense:
