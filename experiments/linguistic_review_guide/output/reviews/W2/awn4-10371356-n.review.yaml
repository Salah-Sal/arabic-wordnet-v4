step0_evidence:
  per_lemma:
    - lemma: "مُهْمِل"
      confirm:
        - text: "«(2) مُهْمِل careless of his health»"
          source: "المورد الحديث (2008)"
        - text: "«مُهمل؛ متهاون.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(أهمل) الشَّيْء تَركه وَلم يَسْتَعْمِلهُ عمدا أَو نِسْيَانا وَأمره لم يحكمه وَإِبِله تَركهَا بِلَا رَاع...»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يوضح الفعل الذي اشتق منه اسم الفاعل، ويفيد الترك عمداً أو نسياناً وعدم العناية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُتَهَاوِن"
      source_section: "step5_english_bridge"
      evidence_citation: "«مُهمل؛ متهاون.» — المورد الحديث (2008)"
      justification: "اشتقاق (اسم فاعل) من الفعل (تهاون) الذي يدل على الاستخفاف واللامبالاة، وقد ورد في المعجم كمرادف مباشر."
  knowledge_candidates:
    - lemma: "مُقَصِّر"
      justification: "اشتقاق (اسم فاعل) من الفعل (قصّر) بمعنى التارك للأمر والمتهاون فيه، ويُطلق اصطلاحاً على من يهمل مسؤولياته ولا يؤديها على الوجه الأكمل."
  generation_notes: "تم التركيز على أسماء الفاعلين التي تدل على الترك والإهمال وعدم العناية كمرادفات لاسم الفاعل (مُهْمِل)."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُهْمِل"
      decision: confirmed
      decision_reason: "مصطلح فصيح واشتقاق قياسي (اسم فاعل) يدل بدقة على من لا يعير اهتماماً للناس أو المسؤوليات، ويطابق المفهوم تماماً."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على من يترك الشيء عمداً أو نسياناً ولا يوليه العناية اللازمة (ترك مطلق)."
      example: "عوقب الموظف المُهْمِل لتقصيره في أداء واجباته."
    - lemma: "مُتَهَاوِن"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل بكثرة في السياقات التي تدل على الاستخفاف وعدم الجدية في أداء المسؤوليات."
      step05_citation: "«مُهمل؛ متهاون.» — المورد الحديث (2008)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على من يستخف بالأمر ولا يأخذه بمحمل الجد (ضعف في الأداء)، بينما (مهمل) تدل على الترك."
      example: "حذّر المدير الموظف المُتَهَاوِن من عواقب تهاونه المستمر."
      actions:
        - command: create_entry
          params:
            lemma: "مُتَهَاوِن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10371356-n"
    - lemma: "مُقَصِّر"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح شائع الاستعمال يدل على من لا يبلغ الغاية في أداء ما عليه من واجبات أو حقوق للآخرين."
      step05_citation: "مرشح من المعرفة اللغوية"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على من يفعل شيئاً ولكنه لا يبلغه تمامه أو ينقصه، بخلاف (مهمل) الذي قد يترك العمل بالكلية."
      example: "يُعتبر الأب الذي لا يعتني بأبنائه مُقَصِّراً في حقهم."
      actions:
        - command: create_entry
          params:
            lemma: "مُقَصِّر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10371356-n"
  added_lemmas:
    - lemma: "مُتَهَاوِن"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "مُقَصِّر"
