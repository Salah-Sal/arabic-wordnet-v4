stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جداً (شخص يضع الخطط) ولا يغطي الفروق الدلالية بين المخطط والمدبر والمصمم."
      - "اللمّات الموجودة تحتاج إلى ضبط بالشكل الكامل (مُخَطِّط، مُدَبِّر)."
    observations: "المجموعة تغطي المفهوم العام للواضع للخطط (planner) والمدبر للأمور (contriver). من الناحية اللغوية، يفضل إضافة 'مُخْتَطّ' كلفظ تراثي فصيح يعبر عن وضع الخطط الأساسية، و'مُصَمِّم' كلفظ معاصر يعبر عن وضع الهياكل التصورية."
  blind_candidates:
    - lemma: "مُخَطِّط"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (خطط)، وهو المصطلح القياسي والأكثر شيوعاً لمن يضع الخطط."
    - lemma: "مُدَبِّر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (دبّر)، يعبر عن التفكير في عواقب الأمور وترتيب تنفيذها، ويناسب معنى (contriver)."
    - lemma: "مُخْتَطّ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (اختطّ)، وهو تعبير فصيح يستخدم لمن يضع حجر الأساس أو يخطط لمشروع أو مدينة."
    - lemma: "مُصَمِّم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (صمّم)، يستخدم في السياق الحديث للتعبير عن واضع الهياكل والتصورات الأولية (planner/designer)."

stage2_evidence:
  per_lemma:
    - lemma: "مُخَطِّط"
      confirm:
        - text: "«المُخَطِّط: واضع الخطط»"
          source: "المورد الحديث"
        - text: "«المُخَطَّط: الواضع للشيء خطة وتصورا يهتدى به»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُدَبِّر"
      confirm:
        - text: "«التَّدْبِيرُ: أَنْ يُدَبِّرَ الْإِنْسَانُ أَمْرَهُ، وَذَلِكَ أَنَّهُ يَنْظُرُ إِلَى مَا تَصِيرُ عَاقِبَتُهُ وَآخِرُهُ»"
          source: "مقاييس اللغة"
        - text: "«مُدَبِّر: شخص أو جهة أو برمجية تقوم بالسهر على تقديم خدمة ما في أحسن الظروف»"
          source: "المعجم الموحد لتقانة المعلومات"
      expands:
        - text: "«المتآمر؛ مُدَبِّر المكيدة»"
          source: "المورد الحديث"
          addition: "يضيف معنى التخطيط الخفي أو الاحتيالي (contriver)."
    - lemma: "مُخْتَطّ"
      confirm:
        - text: "«المختطّ؛ المخطِّط: واضع الخُطط»"
          source: "المورد الحديث"
        - text: "«الْخِطَّةُ الْأَرْضِ يَخْتَطُّهَا الْمَرْءُ لِنَفْسِهِ ; لِأَنَّهُ يَكُونُ هُنَاكَ أَثَرٌ مَمْدُودٌ»"
          source: "مقاييس اللغة"
    - lemma: "مُصَمِّم"
      confirm:
        - text: "«المُصمِّم: واضع الخطط أو التصاميم»"
          source: "المورد الحديث"
        - text: "«صَمَّمَ فِي الْأَمْرِ، إِذَا مَضَى فِيهِ رَاكِبًا رَأْسَهُ... كَأَنَّهُ لَمَّا أَرَادَ ذَلِكَ لَمْ يَسْمَعْ عَذْلَ عَاذِلٍ»"
          source: "مقاييس اللغة"

