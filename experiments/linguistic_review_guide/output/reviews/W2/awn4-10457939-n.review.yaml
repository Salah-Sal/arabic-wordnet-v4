          params: {lemma: "مُخْتَطّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10457939-n"}
    - lemma: "مُصَمِّم"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم في السياق الحديث للتعبير عن واضع التصورات والهياكل (designer/planner)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
