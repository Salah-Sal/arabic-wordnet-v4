          params: {lemma: "مُصَمِّم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10457939-n"}

stage4_content:
  definition:
    current: "شخص يضع الخطط"
    assessment:
      decision: revise
      reason: "التعريف الحالي شديد التبسيط ولا يعكس الجانب الذهني والتنفيذي للتخطيط."
    authored:
      - type: terminological
        text: "مَنْ يَرْسُمُ الخُطَطَ أَوْ يَضَعُ التَّصَوُّراتِ المَنْهَجِيَّةَ لِتَنْفيذِ عَمَلٍ أَوْ بَرْنَامَجٍ مَا، وَيُدَبِّرُ كَيْفِيَّةَ إِنْجَازِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-10457939-n", definition_index: 0, text: "مَنْ يَرْسُمُ الخُطَطَ أَوْ يَضَعُ التَّصَوُّراتِ المَنْهَجِيَّةَ لِتَنْفيذِ عَمَلٍ أَوْ بَرْنَامَجٍ مَا، وَيُدَبِّرُ كَيْفِيَّةَ إِنْجَازِهِ."}

  examples:
    per_lemma:
      - lemma: "مُخَطِّط"
        examples:
          - text: "يُعَدُّ المُخَطِّطُ العُمْرَانِيُّ المَسْؤُولَ الأَوَّلَ عَنْ تَنْظِيمِ نُمُوِّ المُدُنِ."
            type: usage
      - lemma: "مُدَبِّر"
        examples:
          - text: "كَانَ هُوَ المُدَبِّرَ الرَّئِيسِيَّ لِهَذِهِ المَبَادَرَةِ الاقْتِصَادِيَّةِ الطَّمُوحَةِ."
            type: usage
      - lemma: "مُخْتَطّ"
        examples:
          - text: "بَرَزَ اسْمُهُ كَمُخْتَطٍّ لِلسِّيَاسَاتِ التَّعْلِيمِيَّةِ الجَدِيدَةِ فِي البِلادِ."
            type: usage
      - lemma: "مُصَمِّم"
        examples:
          - text: "يَعْمَلُ مُصَمِّمُ المَشَارِيعِ عَلَى وَضْعِ الهَيَاكِلِ الأَسَاسِيَّةِ لِلتَّنْفيذِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-10457939-n", text: "يَعْتَمِدُ نَجَاحُ المَشْرُوعِ عَلَى كَفَاءَةِ المُخَطِّطِ فِي اسْتِشْرَافِ المُسْتَقْبَلِ."}

