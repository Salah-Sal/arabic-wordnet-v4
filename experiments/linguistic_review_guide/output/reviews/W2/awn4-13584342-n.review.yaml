# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (تجميع) و(جمع) مشتقتان من جذر واحد (ج-م-ع) دون تمايز دلالي واضح بينهما في السياق الفسيولوجي"
      - "لمّة (تجميع) تحمل مدلولات متعددة في المعاجم التقنية (تجميع = assembly / grouping / collimation) لا تخصّ ظاهرة الجمع الفسيولوجي"
      - "كلتا اللمّتين مكتوبتان بلا تشكيل كامل"
      - "التعريف الحالي ترجمة حرفية من الإنجليزية وليس بأسلوب المعجم الوسيط"
    observations: >
      تُعنى المجموعة بظاهرة فسيولوجية دقيقة هي «الجَمْع»: قدرة المنظومة العصبية-العضلية على
      تكامل محفِّزات متعددة دون العتبة منفرداً لتوليد استجابة. يُميَّز في الفسيولوجيا بين
      الجَمْع الزمني والجَمْع المكاني. الجذر (ج-م-ع) متجذِّر في العربية بدلالة الضمّ والتأليف،
      غير أن لمّة (تجميع) — وهي مصدر الفعل جَمَّعَ (باب التفعيل) — باتت في المعاجم التقنية
      المعاصرة تُطلق على عمليات التجميع المادي والتقني بعيداً عن السياق الفسيولوجي. يستوجب
      الأمر فحص كلٍّ من اللمّتين بالأدلة المعجمية.
  blind_candidates:
    - lemma: "تَضَافُر"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعَل من الجذر (ض-ف-ر)؛ يدلّ على اشتراك جماعة في عمل واحد وتقاربهم حتى
        يتعاونوا. المعنى المجازي: اجتماع المحفِّزات وتضافرها لبلوغ العتبة الكافية لإنتاج الاستجابة.
    - lemma: "تَرَاكُم"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعَل من الجذر (ر-ك-م)؛ يدلّ على إلقاء بعض الشيء على بعض وتكاثفه.
        المعنى الاصطلاحي المنشود: التراكم التدريجي لتأثيرات المحفِّزات حتى تبلغ العتبة.
    - lemma: "تَضَامُّ"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعُل من الجذر (ض-م-م)؛ يدلّ على انضمام الأجزاء بعضها إلى بعض.
        المعنى المنشود: تضامّ تأثيرات المحفِّزات المتعددة في مكان أو زمان واحد.
    - lemma: "تَآزُر"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَاعَل من الجذر (أ-ز-ر)؛ أصله القوة والشدة. يدلّ على تآزر المتعددين وتقوية
        بعضهم بعضاً. المعنى المجازي: تآزر المحفِّزات المتعددة لبلوغ العتبة الفسيولوجية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "تجميع"
      contradicts:
        - text: "«تجميع: assembling»"
          source: "المعجم الطبي الموحد (2009) — ArabTerm"
          conflict: "رُصد تجميع في المعجم الطبي بمعنى التجميع المادي (assembling) لا ظاهرة الجمع الفسيولوجي"
        - text: "«تجميع: collimation»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ArabTerm"
          conflict: "في الفيزياء يُستخدم تجميع لتوجيه الأشعة وتقييد انبعاثها، لا للظاهرة الفسيولوجية"
        - text: "«تجميع: grouping»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ArabTerm"
          conflict: "معنى التجميع هنا التصنيف والتقسيم إلى مجموعات، وهو بعيد عن الجمع الفسيولوجي"

    - lemma: "جمع"
      confirm:
        - text: "«(3) الجَمْع: حَشْد عدة مثيرات في وقت واحد (نف)»"
          source: "المورد الحديث (2008) — entry_id=721127"
      expands:
        - text: "«جمع: summation»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ArabTerm، entry_id=417792"
          addition: "يُثبت أن الجذر (ج-م-ع) راسخ في الاصطلاح العربي العلمي لمفهوم summation وإن كان في السياق الرياضي"
        - text: "«(جَمَعَ) الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس (hawramani، dict_id=151، entry_id=985717)"
          addition: "الجذر يدلّ في الأصل على تضامّ الشيء وهو دلالة ملائمة للجمع الفسيولوجي"

    - lemma: "تَضَافُر"
      expands:
        - text: "«تضافَرَ القومُ: اجتمعوا وتعاونوا / تضافرَتِ الأَدِلَّةُ على كذا: تَسانَدَتْ وقَوَّى بعضُها بعضًا»"
          source: "المعجم الكبير لمجمع اللغة العربية (ocr، entry_id=58841)"
          addition: "اللفظ يدلّ على التعاون والتساند وتقوية بعضها بعضاً، لكن لا يُستخدم اصطلاحاً للظاهرة الفسيولوجية"

    - lemma: "تَرَاكُم"
      expands:
        - text: "«تَرَكُّمٌ مَرْكَزِيّ: central summation»"
          source: "المعجم الطبي الموحد (2009) — ArabTerm، entry_id=651930"
          addition: >
            المعجم الطبي يستخدم تَرَكُّم (Form V) لا تَرَاكُم (Form VI) في المركب الاصطلاحي
            «تَرَكُّمٌ مَرْكَزِيّ = central summation»؛ دليل على استعمال الجذر (ر-ك-م) في هذا المجال
            لكنه خاص بالصيغة الخماسية دون السداسية
        - text: "«تَجَمُّع الأشياء بعضها إلى بعض، ومِنْ أَمْثِلَتِه تَجَمُّعُ بَعْضِ الأَدْوِيَةِ فى أَجْزاءِ الجِسم المُخْتَلِفَة»"
          source: "المعجم الكبير لمجمع اللغة العربية (ocr، entry_id=39157، مادة التَّراكُم)"
          addition: "الشاهد يُثبت استعمال التراكم في السياق الطبي مما يدعم الدلالة التراكمية للجذر"

    - lemma: "تَضَامُّ"
      contradicts:
        - text: "«الطرقُ الممكنةُ في وَصْفِ جُمْلَةٍ ما، فتَخْتَلِفُ طريقةُ كلِّ منها عن الأخرى؛ تقديمًا وتأخيرًا وفصلاً ووصلاً»"
          source: "المعجم الكبير لمجمع اللغة العربية (ocr، entry_id=59182، مادة التَّضامُّ)"
          conflict: "التضامّ في هذا المعجم مصطلح نحوي-بلاغي لا علاقة له بالظاهرة الفسيولوجية"
        - text: "«تضام: coalescence — التحام أجزاء متفرقة في كلٍ واحد»"
          source: "معجم المصطلحات الطبية ج.1 (1985) — ArabTerm، entry_id=735031"
          conflict: "تضام في المصطلح الطبي = coalescence (التحام) لا summation؛ المدلولان مختلفان"

    - lemma: "تَآزُر"
      contradicts:
        - text: "«تراكم تأثير العوامل بحيث يكون مجموع تأثيراتها أكثر من مجرد المجموع الحسابيّ لها»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — ArabTerm، entry_id=465632، translation_en=synergism"
          conflict: >
            تآزر = synergism (التأثير المشترك أكبر من مجموع التأثيرات الفردية).
            أما summation الفسيولوجي فهو اجتماع محفِّزات دون العتبة لبلوغها — مفهوم مستقل.
        - text: "«تَآزُر: synergism»"
          source: "المعجم الطبي الموحد (2009) — ArabTerm، entry_id=653988"
          conflict: "تثبيت ثانٍ من المعجم الطبي الموحد أن تآزر = synergism لا summation"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "تجميع"
      decision: removed
      decision_reason: >
        لا يوجد دليل معجمي يُثبت استخدام «تجميع» بمعنى الجمع الفسيولوجي (summation).
        المعجم الطبي الموحد يسجّل تجميع = assembling، والمعاجم التقنية ترصده بمعاني:
        collimation وgrouping وassembly وcollection — جميعها بعيدة عن الدلالة الفسيولوجية.
        وجود «جمع» بالمعنى المطلوب (مُثبَت في المورد الحديث) يُغني عن تجميع.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جمع"
      decision: confirmed
      decision_reason: >
        المورد الحديث (2008) يُثبت صراحةً: «الجَمْع: حَشْد عدة مثيرات في وقت واحد (نف)»
        وهو ما يُطابق مفهوم summation الفسيولوجي مطابقةً تامة. الجذر متأصّل في العربية
        بدلالة التضامّ والتأليف (مقاييس ابن فارس). اللمّة تحتاج تشكيلاً كاملاً: جَمْع.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «جَمْع» في الفسيولوجيا يدلّ تحديداً على تكامل المحفِّزات المتعددة دون العتبة لبلوغها
        وإنتاج الاستجابة؛ يتمايز عن «الجَمْع الرياضي» (addition/summation الحسابي)
        وعن «الجمع الصرفي» (plural) وعن «التآزُر» (synergism).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَمْع"

    - lemma: "تَضَافُر"
      source: stage1
      decision: removed
      decision_reason: >
        تَضَافُر يدلّ على التعاون والمساندة المتبادلة («تضافرت الأدلة: تسانَدَتْ وقوَّى بعضها بعضاً»)
        وهو أقرب إلى cooperation منه إلى summation الفسيولوجي. لا توجد شواهد على استخدامه
        مصطلحاً للجمع الفسيولوجي في أيٍّ من المعاجم المتخصصة.
      evidence_assessment:
        case: no_material

    - lemma: "تَرَاكُم"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة تشير إلى استخدام الصيغة الخماسية «تَرَكُّم» لا السداسية «تَرَاكُم» في المصطلح
        الطبي: «تَرَكُّمٌ مَرْكَزِيّ = central summation» (المعجم الطبي الموحد). «تَرَاكُم» وحده
        يُستخدم للتراكم العام (accumulation) في مجالات متعددة دون خصوصية فسيولوجية.
        المصطلح الصحيح إن أُريد هذا الجذر هو «تَرَكُّم» لا «تَرَاكُم».
      evidence_assessment:
        case: mixed

    - lemma: "تَضَامُّ"
      source: stage1
      decision: removed
      decision_reason: >
        تَضَامُّ مستعمل: (أ) كمصطلح نحوي-بلاغي في المعجم الكبير، (ب) في المصطلح الطبي
        بمعنى coalescence (التحام) لا summation. انعدام شواهد الجمع الفسيولوجي مع وجود
        تعارض في الدلالة الطبية الموثّقة يستوجب الاستبعاد.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَآزُر"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الطبي الموحد ومعجم الصيدلة يُثبِّتان: تآزُر = synergism.
        Synergism يعني أن التأثير المشترك يتجاوز مجموع التأثيرات الفردية، بينما summation
        الفسيولوجي يعني اجتماع محفِّزات دون العتبة لبلوغها — المفهومان مختلفان جوهرياً.
        إدراج تآزر هنا يُوقع خلطاً اصطلاحياً علمياً.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "(علم وظائف الأعضاء) العملية التي يمكن من خلالها لمحفزات متعددة إنتاج استجابة (في عضلة أو عصب أو جزء آخر) لا ينتجها محفز واحد بمفرده"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي، ويفتقر إلى: (أ) الأسلوب المعجمي
        (جنس قريب + فصل نوعي)، (ب) التشكيل، (ج) الإشارة إلى نوعَي الجمع الزمني والمكاني.
        التركيب «يمكن من خلالها لمحفزات» مُثقَل ولا يجري على طريقة المعجمي.
    authored:
      - type: terminological
        text: "(علم وظائف الأعضاء) ظاهرةٌ فسيولوجيةٌ يُنتِج فيها تضافُرُ محفِّزات متعددة — دون العتبة منفردةً — استجابةً في عضلةٍ أو عصبٍ أو نسيجٍ آخر لا يُنتِجها محفِّزٌ واحد"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "(علم وظائف الأعضاء) قدرةُ المنظومة العصبية-العضلية على تكامُل المحفِّزات المتعددة؛ إذ يعجز كلٌّ منها منفرداً عن بلوغ العتبةِ اللازمة لإطلاق الاستجابة، فإذا اشتركت أنتجَت الاستجابةَ الكاملة. ويتجلّى في نوعين: الجَمْع الزمني (تعاقُب المحفِّزات من مصدر واحد) والجَمْع المكاني (تزامن محفِّزات من مصادر متعددة)"
    actions:
