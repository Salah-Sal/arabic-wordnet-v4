# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-05100555-n
# risk of exposure — احتمال التعرض لعامل معد
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«مخاطرة» في المعاجم الكلاسيكية تعني المراهنة والمقامرة، وفي الاستعمال المعاصر تحمل دلالة المجازفة الإرادية، بينما المفهوم هنا احتمال سلبي غير إرادي"
      - "التعريف العربي الحالي جيد لكنه يفتقر إلى تحديد نوع العامل المُعدي (حيوي/كيميائي) ويمكن تحسينه"
      - "اللمّتان الموجودتان بلا تشكيل"
    observations: "المجموعة تنتمي إلى الحقل الطبي/الوبائي وتقع تحت مفهوم الاحتمال (probability). المفهوم يجمع بين عنصرين: الخطر (risk) والتعرّض (exposure) لعامل مُعدٍ. في العربية المعاصرة يُستخدم «خطر التعرض» و«مخاطرة» في سياقات مختلفة: الأول تعبير إضافي تقني دقيق، والثاني مصطلح عام يُستعمل في سياقات الاقتصاد والتأمين والصحة."
  blind_candidates:
    - lemma: "خَطَرُ العَدْوَى"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين الخطر (الإشراف على الهلاك) والعدوى (انتقال المرض)، وهو تعبير شائع في الأدبيات الطبية العربية للدلالة على احتمال الإصابة بعامل معدٍ"
    - lemma: "تَعَرُّضِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تعرّض» على وزن تَفَعُّلِيَّة، للدلالة على حالة القابلية للتعرض، على غرار: مرضيّة، وراثيّة"
    - lemma: "مُجَازَفَة"
      generation_method: ishtiqaq
      justification: "من الجذر «جزف» على وزن مُفَاعَلَة، بمعنى المخاطرة والإقدام على أمر دون تروٍّ، مصطلح معروف في السياقات المالية والتأمينية"
    - lemma: "احْتِمَالُ الإِصَابَةِ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين الاحتمال (وهو الجنس القريب من المفروض الأعلى) والإصابة بالعدوى، تعبير مستعمل في الأدبيات الوبائية"

stage2_evidence:
  per_lemma:
    - lemma: "خَطَرُ التَّعَرُّضِ"
      confirm:
        - text: "«الخَطَر: الإِشرافُ على الهَلاك، خَوْفُ التَّلَفِ»"
          source: "المعجم الكبير"
        - text: "«1- إمكانية وقوع عواقب على أثر حدث معيّن، ويشمل تقديراً لاحتمال الحدث وتقييماً لنتائجه. 2- يستخدم أيضاً أحياناً للدلالة على احتمال وقوع حدث ذي درجة معيّنة في غضون فترة زمنية محدّدة.»"
          source: "المعجم الموحد لمصطلحات المياه"
        - text: "«كمية الأشعة أو الملوث الموجود في بيئة معينة والذي يمثل خطر صحي كامن على الكائنات الحية»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
      expands:
        - text: "«(التَّعَرُّض) (فى القضاء): فعلٌ مادِّى أو إجراءٌ قانونيٌّ يُقْصَدُ به منازعة الحائز فى حيازته»"
          source: "المعجم الوسيط"
          addition: "المعنى القضائي للتعرض مختلف عن المعنى الوبائي، لكن الجذر مشترك"
        - text: "«كمية عامل بيئي التي وصلت للفرد (جرعة خارجية) أو التي تم استيعابها من طرف الفرد (جرعة داخلية، جرعة ممتصة).»"
          source: "مسرد المناخ والبيئة"
          addition: "يوسّع مفهوم التعرض ليشمل الجرعة البيئية"

    - lemma: "مُخَاطَرَة"
      confirm:
        - text: "«الربط بين احتمال وقوع حدث والآثار المترتبة على حدوثه.»"
          source: "مسرد التربية، المنظمة العربية"
        - text: "«مُخاطرة مَقْبُولَة: ذات آثار مؤذية بحدها الأدنى في المعالجة.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
      contradicts:
        - text: "«المُخَاطرة: هي المُراهنة.»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "المعنى الكلاسيكي للمخاطرة هو المراهنة (wagering)، وهو مختلف عن مفهوم الاحتمال الإحصائي"
      expands:
        - text: "«مجازفة؛ مخاطرة؛ خَطَر / احتمالية الخطر (تأ)»"
          source: "المورد الحديث"
          addition: "يُظهر ترادف مخاطرة مع مجازفة وخطر في السياق العام"
        - text: "«قياس لاحتمال نشوء ضرر للحياة أو للصحة أو للممتلكات أو للبيئة نتيجة مجازفة معينة»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
          addition: "تعريف خطورة يقترب من مفهوم المخاطرة في السياق التقني"

    - lemma: "خَطَرُ العَدْوَى"
      confirm:
        - text: "«الحالة التي تصيب فيها ميكروبات مسببة للأمراض جسم كائن حي وتغزو أنسجته وتتكاثر فيها.»"
          source: "مسرد المناخ والبيئة"
      contradicts:
        - text: "«عَدْوَى» = infection/contagion"
          source: "المعجم الطبي الموحد / المعجم الموحد لمصطلحات علم الصيدلة"
          conflict: "العدوى تعني الإصابة الفعلية بالمرض لا مجرد التعرض لعامل معدٍ، فخطر العدوى أخص من خطر التعرض"

    - lemma: "تَعَرُّضِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مُجَازَفَة"
      contradicts:
        - text: "«المُجَازَفة: كَذَلِك [أي المراهنة].»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المجازفة في الأصل بيع جزافاً أي بلا كيل ولا وزن، ثم توسعت للمقامرة، وتحمل دلالة الإقدام الإرادي لا الاحتمال السلبي"

    - lemma: "احْتِمَالُ الإِصَابَةِ"
      contradicts:
        - text: "«احتمالُ احتواء خابيةِ خزْنٍ على المعطيات المستهدَفة. يُعبَّر عنه عموماً بنسبةٍ مئوية.»"
          source: "معجم مصطلحات المعلوماتية"
          conflict: "المصطلح مستعمل في المعلوماتية بمعنى hit probability لا بالمعنى الطبي، كما أن الإصابة أخص من التعرض"

stage3_analysis:
  per_lemma:
    - lemma: "خَطَرُ التَّعَرُّضِ"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت يجمع بين «خطر» بمعناه الحديث (احتمال وقوع ضرر) و«التعرض» بمعناه الوبائي/البيئي، مدعوم بشواهد معجمية حديثة متعددة في مجالي المياه والبيئة، ويطابق التعريف الإنجليزي risk of exposure تطابقاً دقيقاً"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدل على احتمال التعرض تحديداً لعامل ضار، وهو أدق من «مخاطرة» التي تشمل المجازفة الإرادية أيضاً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَطَرُ التَّعَرُّضِ"

    - lemma: "مُخَاطَرَة"
      decision: confirmed
      decision_reason: "رغم أن المعنى الكلاسيكي هو المراهنة، فإن الاستعمال المصطلحي الحديث في معاجم التربية والصيدلة والهندسة يثبت استعمال «مخاطرة» بمعنى risk عموماً. الشيوع في المعاجم الموحدة (ALECSO) يؤكد تثبيته المعجمي"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على مفهوم المخاطرة العام (risk) مع إيحاء بالإقدام الإرادي، بخلاف «خطر التعرض» الذي يدل على احتمال سلبي محدد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَاطَرَة"

    - lemma: "خَطَرُ العَدْوَى"
      source: stage1
      decision: removed
      decision_reason: "العدوى تعني الإصابة الفعلية بالمرض (infection) لا مجرد التعرض (exposure) لعامل معدٍ. المجموعة تخص احتمال التعرض لا احتمال الإصابة، فخطر العدوى أخص ولا يطابق المفهوم"

    - lemma: "تَعَرُّضِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير مسجل في أي معجم ولا مستعمل في الأدبيات العلمية العربية، ولا يؤدي المعنى المطلوب بدقة إذ يوحي بالقابلية للتعرض لا باحتمال التعرض"

    - lemma: "مُجَازَفَة"
      source: stage1
      decision: removed
      decision_reason: "المجازفة في أصلها بيع الجزاف ثم صارت بمعنى المقامرة والإقدام بلا تروٍّ، وهي تحمل دلالة الفعل الإرادي المتعمد، بينما المفهوم هنا احتمال تعرض غير إرادي"

    - lemma: "احْتِمَالُ الإِصَابَةِ"
      source: stage1
      decision: removed
      decision_reason: "الإصابة أخص من التعرض، والمصطلح مستعمل في المعلوماتية بمعنى مختلف (hit probability)، كما أنه يكاد يكون صياغة تعريفية لا مصطلحاً مسكوكاً"

