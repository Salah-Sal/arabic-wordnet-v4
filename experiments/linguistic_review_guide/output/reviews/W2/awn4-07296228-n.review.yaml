# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-07296228-n (slanguage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «لغة عامية جداً» عبارة وصفية حرة تحتوي على ظرف «جداً»، وليست مصطلحاً مسكوكاً أو وحدة معجمية ثابتة"
      - "اللمّة تفشل في اختبار السكّ: يمكن إبدال «جداً» بـ«كثيراً» أو «للغاية» وتبقى وصفاً صالحاً، ممّا يدل على أنها ليست مصطلحاً"
      - "التعريف العربي يذكر «الرطانة» و«العامية» وهما مفاهيم مجاورة لا مرادفة لـslanguage"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهي ضعيفة من حيث التثبيت المعجمي"
    observations: "المفهوم الإنجليزي slanguage كلمة نحتية (slang + language) تدل على سِجِلّ لغوي مُشبَع بالعامية والسوقية. ليس له مقابل عربي مباشر، لكن مصطلح «لُغَة سُوقِيَّة» المُثبَت في معاجم أليكسو يقترب منه دلالياً. المفهوم يقع في منطقة الفجوة المعجمية حيث تتوفر مركبات وصفية لكن لا يوجد لفظ مفرد مسكوك."
  blind_candidates:
    - lemma: "رَطَانَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر رطن على وزن فَعَالَة، ودلالتها في المعاجم الكلاسيكية على الكلام الأعجمي أو غير المفهوم تقاربُ مفهوم اللغة المُشبَعة بالعامية"
    - lemma: "لُغَة سُوقِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي وصفي من «لُغَة» + «سُوقِيَّة» (نسبة إلى السوق بمعنى الابتذال)، يدل على الاستعمالات اللغوية المرفوضة في الأوساط الثقافية"
    - lemma: "عَامِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «عامّ» على وزن فاعليَّة، يدل على لغة العامة خلاف الفصحى، وهو أقرب المشتقات العربية لمفهوم الكلام الدارج"
    - lemma: "أُرْغَة"
      generation_method: taarib
      justification: "تعريب للفرنسية argot بمعنى اللغة الخاصة التي تصطنعها فئة اجتماعية، وردت في المورد الحديث مقابلاً لـargot"


stage2_evidence:
  per_lemma:
    - lemma: "لغة عامية جداً"
      evidence_status: "no_material_found"

    - lemma: "رَطَانَة"
      confirm:
        - text: "«الكلام الأَعجمىّ, أو بكلام لا يفهمُه الجمهور, وإنما هو مواضعة بين اثنين أو جماعة»"
          source: "المعجم الوسيط"
        - text: "«الكلام بغير العربيّة الكلامُ غيرُ المفهومِ»"
          source: "المعجم الكبير"
        - text: "«الكلام بالأعجمية كلام لا يفهمه الجمهور؛ وإنما هو مواضعة بين اثنين أو جماعة مجموعة العبارات والتراكيب التي تتميز بها طائفة من الناس يعملون في حرفة واحدة»"
          source: "المعجم الكبير"
        - text: "«لهجة ذات مفردات خاصة يتكلمها ناس ذوو حرفة مشتركة، مثل رطانة عمال سكة الحديد أو رطانة عمال النظافة.»"
          source: "مسرد الإعلام والتواصل (أليكسو)"
        - text: "«لغة خاصة مستعملة في عشيرة هامشية لا تحاول الاندماج في المجتمع وتسعى إلى الظهور بمظهر مختلف عن عامة الناس.»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«الرَّطانَةُ، ويُكْسَرُ: الكلامُ بالأَعْجَمِيَّةِ. ورَطَنَ له وراطَنَه: كَلَّمَه بها. وتراطَنوا: تَكَلَّموا بها.»"
          source: "القاموس المحيط"
          addition: "يُوسّع الدلالة إلى كل كلام بالأعجمية وليس فقط العامية"
        - text: "«(رَطَنَ) الرَّاءُ وَالطَّاءُ وَالنُّونُ بِنَاءٌ لَيْسَ بِالْمُحْكَمِ وَلَا لَهُ قِيَاسٌ فِي كَلَامِهِمْ، إِلَّا أَنَّهُمْ يَقُولُونَ: تَرَاطَنُوا، إِذَا أَتَوْا بِكَلَامٍ لَا يُفْهَمُ; وَيُخَصُّ بِذَلِكَ الْعَجَمُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يختص بالأعجمية وعدم الفهم، لا بالابتذال أو السوقية"

    - lemma: "لُغَة سُوقِيَّة"
      confirm:
        - text: "«استعمالات لغوية مرفوضة في الأوساط الثقافية وفي الطبقة الاجتماعية المتوسطة والراقية.»"
          source: "مسرد الإعلام والتواصل (أليكسو)"
      expands:
        - text: "«صفة المستوى اللغوي غير المهذب.» (مدخل: لُغة مُبتذَلة، لُغة سُوقية)"
          source: "مسرد الإعلام والتواصل (أليكسو)"
          addition: "تُرادف «لُغة مبتذلة» في المصدر نفسه"

    - lemma: "عَامِّيَّة"
      confirm:
        - text: "«لغة العامة, وهى خلاف الفصحى»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(1) العامِّيَّة: لغة عامّيّة أو دارجة (2) عامّيّ (3) يَخْدع (ع) (4) يُهاجم بألفاظ قاسية أو نابية.»"
          source: "المورد الحديث"
          conflict: "العامية تقابل slang في المورد الحديث لكنها أوسع دلالياً؛ فهي كل ما خالف الفصحى وليس فقط اللغة المفرطة في السوقية"

    - lemma: "أُرْغَة"
      confirm:
        - text: "«الأُرْغَة: لغة خاصةٌ أو عامية تصطنعها فئة أو طبقة اجتماعية. وبخاصة: «أُرْغة» اللصوص والمتشرّدين التي ابتدعوها لإخفاء أغراضهم.»"
          source: "المورد الحديث"
      contradicts:
        - text: "«الأُرْغَة: لغة خاصة تصطنعها فئةٌ أو أهلُ حرفة معينة [كاللّصوص إلخ]» (ضمن مدخل cant)"
          source: "المورد الحديث"
          conflict: "أُرْغَة تقابل argot/cant وليس slanguage؛ فهي لغة خاصة بفئة لا لغة مُشبَعة بالعامية"


stage3_analysis:
  per_lemma:
    - lemma: "لغة عامية جداً"
      decision: removed
      decision_reason: "عبارة وصفية حرة تحتوي على الظرف «جداً»، تفشل في اختبار السكّ (يمكن إبدال «جداً» بمرادفاتها: كثيراً، للغاية) واختبار التثبيت المعجمي (لا وجود لها في أي معجم). ليست وحدة معجمية ثابتة بل وصف عابر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "رَطَانَة"
      source: stage1
      decision: removed
      decision_reason: "دلالة رَطَانَة الأصلية هي الكلام بالأعجمية أو كلام لا يُفهَم (jargon/cant)، وهي مذكورة في تعريف المجموعة نفسه مما يُحدث دَوْراً معجمياً. علاوة على ذلك، slanguage ليس مرادفاً لـjargon بل هو لغة مُشبَعة بالعامية."
      evidence_assessment:
        case: mixed

    - lemma: "لُغَة سُوقِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مُثبَت في معاجم أليكسو (مسرد الإعلام والتواصل) بتعريف واضح: «استعمالات لغوية مرفوضة في الأوساط الثقافية». يتطابق دلالياً مع slanguage من حيث الإفراط في استعمال الألفاظ السوقية والمبتذلة. مركب إضافي وصفي ثابت."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تركز على البُعد الاجتماعي للابتذال اللغوي والاستعمالات المرفوضة في الأوساط الثقافية"
      actions:
        - command: create_entry
          params:
            lemma: "لُغَة سُوقِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "عَامِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "دلالة العامية أوسع من المطلوب؛ فهي تشمل كل لغة العامة خلاف الفصحى، بينما slanguage يخص اللغة المُفرِطة في السوقية والابتذال. الفارق في درجة الابتذال والإفراط."
      evidence_assessment:
        case: mixed

    - lemma: "أُرْغَة"
      source: stage1
      decision: removed
      decision_reason: "أُرْغَة تعريب لـargot وتعني اللغة الخاصة بفئة اجتماعية (كاللصوص)، وهي أقرب إلى cant/argot منها إلى slanguage. كما أنها اقتراض أجنبي غير شائع في الاستعمال العربي المعاصر."
      evidence_assessment:
        case: contradicts_only


