stage1_review:
  assessment:
    concerns:
      - "اللمّة «عدم إنجاز» عبارة وصفية حرّة (عدم + إنجاز) تفشل في اختبار السكّ واختبار التثبيت المعجمي"
      - "اللمّة «إخفاق» بدون تشكيل كامل في البيانات الأصلية"
    observations: >
      المجموعة تعبّر عن مفهوم الفعل الذي لا يبلغ غايته، وهو مفهوم عربي أصيل
      له جذور في الاستعمال الكلاسيكي (أخفق الغازي إذا لم يُصب شيئاً في الحديث النبوي).
      اللمّة «إخفاق» ملائمة تماماً، أمّا «عدم إنجاز» فتركيب نفي حرّ لا يرقى
      إلى مرتبة المصطلح المعجمي الثابت.
  blind_candidates:
    - lemma: "فَشَل"
      generation_method: ishtiqaq
      justification: "مصدر فَشِلَ (ف ش ل) على وزن فَعَل، يدلّ على الإخفاق في العمل في الاستعمال المعاصر المُقَرّ مجمعياً"
    - lemma: "خَيْبَة"
      generation_method: ishtiqaq
      justification: "مصدر خابَ يَخيب (خ ي ب)، يدلّ على الحرمان من الفائدة المرجوّة؛ قال ابن فارس: أصل يدلّ على عدم فائدة وحرمان"
    - lemma: "إِخْلَاف"
      generation_method: ishtiqaq
      justification: "مصدر أخلفَ (خ ل ف) على وزن إفعال، من أخلف الوعدَ أي لم يَفِ به؛ فيه معنى عدم تحقيق المراد"
    - lemma: "تَقْصِير"
      generation_method: ishtiqaq
      justification: "مصدر قصَّرَ (ق ص ر) على وزن تفعيل، يدلّ على التواني وعدم بلوغ المدى؛ قال ابن فارس: ألّا يبلغ الشيء مداه"

stage2_evidence:
  per_lemma:
    - lemma: "إِخْفَاق"
      confirm:
        - text: "«أَخْفَقَ الرَّجُلُ، إِذَا غَزَا وَلَمْ يُصِبْ شَيْئًا ... قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ: أَيُّمَا سَرِيَّةٍ غَزَتْ فَأَخْفَقَتْ كَانَ لَهَا أَجْرُهَا مَرَّتَيْنِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«إخفاق؛ لانجاح»"
          source: "المورد الحديث (2008)"
        - text: "«إخفاق علمِيّ: عدم القدرة على تحقيق الأهداف العلمية»"
          source: "مسرد التربية (ArabTerm)"
        - text: "«إخفاق (عطل) النظام: عدمُ قدرةِ حاسوبٍ على متابعة العمل، لسببٍ برمجيّ لا عتاديّ عادةً»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«الْخَاءُ وَالْفَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَرْجِعُ إِلَيْهِ فَرَوْعُهُ، وَهُوَ الِاضْطِرَابُ فِي الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي للجذر هو الاضطراب، والإخفاق فرع منه بمعنى اضطراب الحال لعدم الإصابة"

    - lemma: "عدم إنجاز"
      evidence_status: "no_material_found"

    - lemma: "فَشَل"
      confirm:
        - text: "«في عمله: أخفق (مج). فهو فَشلٌ, وفَشِلٌ»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الفشل: ضعف مع جبن. والفشيل: الجبان الضعيف القلب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الأساسي الكلاسيكي هو الضعف مع الجبن، لا عدم تحقيق الهدف"
        - text: "«الجبان المرعوب يبهت عند الروع لا يحسن قتالا ولا شرادا»"
          source: "كتاب العين للخليل"
          conflict: "الدلالة الكلاسيكية ترتبط بالجبن والضعف عند الحرب، لا بإخفاق الفعل ذاته"
      expands:
        - text: "«فَشِلَ في مهمَّته ... الصواب والرتبة: فَشِلَ في عمله [صحيحة]. التعليق: المعجم الوسيط أجاز فشل بمعنى أخفق»"
          source: "معجم الصواب اللغوي"
          addition: "مجمع اللغة العربية أقرّ استعمال فشل بمعنى أخفق، لكنه استعمال مولّد"

    - lemma: "خَيْبَة"
      contradicts:
        - text: "«دعاء عليه بالخسران»"
          source: "المعجم الوسيط"
          conflict: "الخيبة في المعاجم صيغة دعاء بالخسران أو حالة الحرمان، لا اسم لفعل أخفق"
        - text: "«الْخَاءُ وَالْيَاءُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى عَدَمِ فَائِدَةٍ وَحِرْمَانٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدلّ على الحرمان وعدم الفائدة (نتيجة)، لا على فعل لم يحقق هدفه (حدث)"

    - lemma: "إِخْلَاف"
      contradicts:
        - text: "«آخِرُ الأَسْنانِ من جَمِيعِ الدَّوابِّ»"
          source: "المعجم الكبير"
          conflict: "الأخلاف (جمع خِلف) بمعنى أسنان الدوابّ، لا علاقة لها بالإخفاق"
      expands:
        - text: "«الْخِلَافُ فِي الْوَعْدِ. وَخَلَفَ الرَّجُلُ عَنْ خُلُقِ أَبِيهِ: تَغَيَّرَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "إخلاف الوعد = عدم الوفاء، أخصّ من مطلق عدم تحقيق الهدف"

    - lemma: "تَقْصِير"
      contradicts:
        - text: "«قَصَّرْتُ فِي الْأَمْرِ تَقْصِيرًا، إِذَا تَوَانَيْتُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "التقصير هو التواني والتفريط في بذل الجهد (سبب)، لا إخفاق الفعل ذاته في تحقيق هدفه (نتيجة)"

stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ──
    - lemma: "إِخْفَاق"
      decision: confirmed
      decision_reason: >
        مصدر أخفقَ يُخفق إخفاقاً من جذر (خ ف ق) على وزن إفعال. مؤصَّل في الاستعمال
        الكلاسيكي بمعنى «غزا ولم يُصب شيئاً» (مقاييس اللغة، حديث نبوي)، وشائع في
        المعاجم المصطلحية الحديثة بمعنى failure. يطابق تعريف المجموعة تمام المطابقة:
        فعل لا يحقق هدفه المنشود. لفظ محايد لا يحمل ظلال الجبن أو الضعف.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِخْفَاق"

    - lemma: "عدم إنجاز"
      decision: removed
      decision_reason: >
        عبارة وصفية حرّة مؤلّفة من أداة النفي «عدم» والمصدر «إنجاز». تفشل في
        اختبار السكّ (يمكن إبدال «إنجاز» بـ«تحقيق» أو «إتمام» وتبقى صالحة)
        واختبار التثبيت المعجمي (لم تُوجد في أيّ معجم كوحدة معجمية مستقلّة).
        لا ترقى إلى مرتبة المصطلح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "فَشَل"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى الأساسي الكلاسيكي هو «ضعف مع جبن» (التوقيف، لسان العرب، كتاب العين)،
        وهو وصف لحالة الشخص لا للفعل ذاته. وإن أقرّ المجمع استعماله بمعنى «أخفق في
        عمله»، فهو مولَّد يحمل ظلالاً سلبية إضافية (جبن، ضعف) لا تناسب المفهوم
        المحايد «فعل لا يحقق هدفه». الإخفاق أدقّ وأنقى دلالة.
      evidence_assessment:
        case: mixed

    - lemma: "خَيْبَة"
      source: stage1
      decision: removed
      decision_reason: >
        الخيبة في المعاجم دعاء بالخسران أو حالة حرمان وعدم فائدة (نتيجة وجدانية)،
        لا اسم لفعل أخفق في تحقيق هدفه (حدث). الفرق بين النتيجة النفسية والحدث
        الموضوعي يمنع من إدراجها في هذه المجموعة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "إِخْلَاف"
      source: stage1
      decision: removed
      decision_reason: >
        إخلاف مختصّ بعدم الوفاء بالوعد (أخلف وعده)، وهو أخصّ من مفهوم المجموعة
        العامّ. كما أنّ صيغة «الأخلاف» الجمعية تلتبس بمعنى أسنان الدوابّ.
      evidence_assessment:
        case: mixed

    - lemma: "تَقْصِير"
      source: stage1
      decision: removed
      decision_reason: >
        التقصير هو التواني في بذل الجهد (سبب)، لا إخفاق الفعل في بلوغ غايته (نتيجة).
        الفرق بين التفريط في العمل وعدم تحقيق الهدف جوهري.
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "فعل لا يحقق هدفه المنشود"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول المعنى لكنّه يفتقر إلى بنية التعريف المصطلحي
        (جنس قريب + فصل نوعي). يحتاج إلى ربطه بالجنس القريب «عمل بشري»
        وتوضيح الفصل النوعي.
    authored:
      - type: terminological
        text: "عَمَلٌ بَشَرِيٌّ لا يَبْلُغُ الغايَةَ المَقْصودَةَ مِنْهُ"
