stage4_content:
  definition:
    current: "مجموع الطائرات العسكرية لدولة ما"
    assessment:
      decision: retain
      reason: "التعريف دقيق وشامل ويغطي جوهر المجموعة الترادفية."
  examples:
    per_lemma:
      - lemma: "سِلَاحُ الطَّيَرَانِ"
        examples:
          - text: "يمتلك سِلَاحُ الطَّيَرَانِ في الدولة أحدث المقاتلات الجوية."
            type: usage
      - lemma: "قُوَّةٌ جَوِّيَّةٌ"
        examples:
          - text: "تعتمد القُوَّةُ الجَوِّيَّةُ على كفاءة الطيارين وتطور الطائرات."
            type: usage
      - lemma: "سِلَاحُ الجَوِّ"
        examples:
          - text: "شاركت قاذفات سِلَاحِ الجَوِّ في التمرين العسكري المشترك."
            type: usage
      - lemma: "القُوَّاتُ الجَوِّيَّةُ"
        examples:
          - text: "صدر بيان رسمي عن قيادة القُوَّاتِ الجَوِّيَّةِ."
            type: usage
      - lemma: "الطَّيَرَانُ العَسْكَرِيُّ"
        examples:
          - text: "يشهد الطَّيَرَانُ العَسْكَرِيُّ تطوراً تقنياً متسارعاً."
            type: usage
      - lemma: "الأُسْطُولُ الجَوِّيُّ الحَرْبِيُّ"
        examples:
          - text: "تم استعراض الأُسْطُولِ الجَوِّيِّ الحَرْبِيِّ في العيد الوطني."
            type: usage

