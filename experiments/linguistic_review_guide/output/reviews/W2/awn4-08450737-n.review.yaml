stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دقيق جداً ويتوافق مع المفهوم في شبكة WordNet."
      - "اللمّات الموجودة صحيحة ولكنها تفتقر إلى التشكيل الكامل."
      - "هناك حاجة لإضافة مصطلحات شائعة مثل 'سلاح الجو' و'القوات الجوية' و'الأسطول الجوي الحربي'."
    observations: "المجموعة تغطي مفهوماً مؤسسياً وعسكرياً (Air Force/Aviation)، حيث يتم الخلط أحياناً بين القوة كمنظمة (Air Force) وبين مجموع الطائرات (Air power/Aggregation). المصطلحات المقترحة تغطي كلا الجانبين."
  blind_candidates:
    - lemma: "سِلَاحُ الجَوِّ"
      generation_method: tarkib
      justification: "مصطلح شائع جداً مرادف لسلاح الطيران، يستخدم في العديد من الدول العربية."
    - lemma: "القُوَّاتُ الجَوِّيَّةُ"
      generation_method: tarkib
      justification: "المصطلح الرسمي المعتمد في معظم الجيوش العربية."
    - lemma: "الطَّيَرَانُ العَسْكَرِيُّ"
      generation_method: tarkib
      justification: "ترجمة مباشرة ودقيقة للمفهوم (Military aviation) كوحدة معجمية."
    - lemma: "الأُسْطُولُ الجَوِّيُّ الحَرْبِيُّ"
      generation_method: tarkib
      justification: "وصف لمجموع الطائرات العسكرية ككتلة واحدة (Fleet)، ورد في معجم المورد الحديث كمرادف لـ Air Force."

stage2_evidence:
  per_lemma:
    - lemma: "سِلَاحُ الطَّيَرَانِ"
      confirm:
        - text: "سلاح الطيران؛ الأسطول الجوّيّ الحربيّ."
          source: "المورد الحديث (2008)"
        - text: "سلاح الجوّ/ سلاح الطَّيران: كلّ ما يتعلّق بالطَّائرات الحربيّة والعاملين فيها من أسلحة وأشخاص."
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "قُوَّةٌ جَوِّيَّةٌ"
      confirm:
        - text: "قوة: (سك) اسم جامع لآلة الحرب... القوات المسلحة."
          source: "معجم اللغة العربية المعاصرة (بالقياس)"
      expands:
        - text: "تُستخدم 'القوة الجوية' للإشارة إلى القدرة العسكرية في الجو (Air Power)."
          source: "الاستعمال العسكري العام"
    - lemma: "سِلَاحُ الجَوِّ"
      confirm:
        - text: "قائد الجناح: ضابط يحمل رتبة ملازم ثان فيما فوق، كما في سلاح الجوّ الملكيّ."
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "الأُسْطُولُ الجَوِّيُّ الحَرْبِيُّ"
      confirm:
        - text: "سلاح الطيران؛ الأسطول الجوّيّ الحربيّ."
          source: "المورد الحديث (2008) - تعريف Air Force"
    - lemma: "الطَّيَرَانُ"
      confirm:
        - text: "(2) الطائرات الحربية."
          source: "المورد الحديث (2008) - تعريف Aviation"

