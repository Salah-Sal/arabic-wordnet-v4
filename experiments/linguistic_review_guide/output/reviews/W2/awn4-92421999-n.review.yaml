stage1_review:
  assessment:
    concerns:
      - "الكلمة الموجودة حالياً (إشكاليات) هي بصيغة الجمع، وقد يكون من الأفضل توفير صيغة المفرد أيضاً أو التأكد من مطابقتها للمفهوم الكلي (المجموعة)."
    observations: "التعريف يشير إلى مجموعة من الشكوك أو الصعوبات المتأصلة، وهذا المفهوم يعبر عنه في العربية المعاصرة بكلمة 'إشكاليات' (جمع إشكالية) أو 'محاذير' أو 'تعقيدات'. المصطلح الموجود حالياً قوي جداً في السياق الأكاديمي والمعرفي."
  blind_candidates:
    - lemma: "إِشْكَالِيَّات"
      generation_method: ishtiqaq
      justification: "جمع إشكالية، وهي القضية المعقدة التي تثير تساؤلات وصعوبات متأصلة."
    - lemma: "مَحَاذِير"
      generation_method: ishtiqaq
      justification: "جمع محذور، ويستخدم للتعبير عن الصعوبات أو المخاطر التي يُتوقع حدوثها في خطة أو موقف."
    - lemma: "تَعْقِيدَات"
      generation_method: ishtiqaq
      justification: "جمع تعقيد، ويشير إلى الصعوبات والتشابكات المتأصلة في الأمر."
    - lemma: "شُكُوك"
      generation_method: ishtiqaq
      justification: "جمع شك، وهو الارتياب وعدم اليقين المذكور في نص التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "إشكاليات"
      confirm:
        - text: "«الإشكاليَّة: قضيةٌ معرفيةٌ تختلف فيها الآراء»"
          source: "المعجم الكبير"
        - text: "«اشكالية (ال…): problematic (the)»"
          source: "ArabTerm (Philosophy)"
      expands:
        - text: "«أجاز مجمع اللغة المصري ... تثنية المصدر وجمعه جمع تكسير ... ومن ثَمَّ يمكن تصويب الاستعمال المرفوض (شكوك، إشكاليات)»"
          source: "معجم الصواب اللغوي"
    - lemma: "محاذير"
      confirm:
        - text: "«المحذور: ما يُتَّقى ويُحترز منه»"
          source: "المعجم الوسيط"
        - text: "«تشوب هذه العملية محاذير كثيرة [فصيحة]»"
          source: "معجم الصواب اللغوي"
    - lemma: "تعقيدات"
      confirm:
        - text: "«التعقيد: هو ألا يكون اللفظ ظاهر الدلالة على المعنى المراد لخلل واقع ... مما يوجب صعوبة فهم المراد»"
          source: "التعريفات للجرجاني"
        - text: "«التّعقيد: Complication»"
          source: "كشاف اصطلاحات الفنون"
    - lemma: "شكوك"
      confirm:
        - text: "«الشك: الارتياب وعدم اليقين ... اضطراب ذِهْنِيٌّ يصعُبُ معه الوصول إلى أحكام أو قرارات ثابتة»"
          source: "المعجم الكبير"
        - text: "«الشك: خِلافُ اليَقِينِ، ج: شُكوكٌ»"
          source: "القاموس المحيط"

stage3_analysis:
  per_lemma:
    - lemma: "إشكاليات"
      decision: confirmed
      decision_reason: "مصطلح معاصر دقيق يعبر عن مجموعة الصعوبات والتساؤلات المتأصلة في موضوع ما، وهو الترجمة المعتمدة لـ problematic."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِشْكَالِيَّات"
    - lemma: "مَحَاذِير"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن الجوانب التي تثير التخوف أو الصعوبات المتأصلة التي يجب الاحتراز منها في خطة أو موقف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مَحَاذِير", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَعْقِيدَات"
      source: stage1
      decision: confirmed
      decision_reason: "تشير إلى الصعوبات الناجمة عن تشابك العناصر وتداخلها في موقف معين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَعْقِيدَات", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "شُكُوك"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن جانب الارتياب وعدم اليقين المذكور صراحة في التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "شُكُوك", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "الشكوك أو الصعوبات المتأصلة في موقف أو خطة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق لكن يمكن صياغته بأسلوب معجمي يبرز كونه 'مجموعة' أو 'منظومة' من هذه العناصر كما يقتضي الرابط الاشتمالي (Hypernym)."
    authored:
      - type: terminological
        text: "مجموعة الشكوك أو الصعوبات أو التساؤلات المتأصلة في موقف أو خطة أو موضوع ما، والتي تجعل معالجته أو فهمه أمراً معقداً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "إِشْكَالِيَّات"
        examples:
          - text: "واجه الباحث إشكاليات منهجية عديدة عند تطبيق الدراسة الميدانية."
            type: usage
      - lemma: "مَحَاذِير"
        examples:
          - text: "رغم فوائد التقنية الجديدة، إلا أن تطبيقها يكتنفه الكثير من المحاذير الأخلاقية."
            type: usage
      - lemma: "تَعْقِيدَات"
        examples:
          - text: "أدت التعقيدات السياسية في المنطقة إلى تعثر مفاوضات السلام."
            type: usage
      - lemma: "شُكُوك"
        examples:
          - text: "حامت شكوك كثيرة حول نزاهة العملية الانتخابية."
            type: usage

