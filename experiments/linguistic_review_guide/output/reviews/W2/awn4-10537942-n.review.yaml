stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان تميلان إلى الاستخدام الطبي (الأدوية) أكثر من الإشارة إلى الأشخاص في السياق المعاصر."
    observations: "التعريف يركز على الدور الشخصي (شخص يقلل...)، لذا يفضل تعزيز المجموعة بلمّات تعبر عن الفاعل الإنساني."
  blind_candidates:
    - lemma: "مُسَكِّن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'سكن' (هدأ)، وهو يتفق تماماً مع لفظ التعريف 'ويسكن'."
    - lemma: "مُفَرِّج"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل 'فرج' (كشف الغم)، ويستخدم في سياق تخفيف الكروب والمخاوف."
    - lemma: "مُلَطِّف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'لطف'، يعبر عن الشخص الذي يقلل من حدة الشيء ووطأته."
    - lemma: "مُطَمْئِن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من 'طمأن'، وهو الشخص الذي يزيل الخوف ويبعث السكينة."

stage2_evidence:
  per_lemma:
    - lemma: "مُخَفِّف"
      confirm:
        - text: "«عامل يقلل تركيز شيء ما، أو يخفف أثره.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
    - lemma: "مُهَدِّئ"
      confirm:
        - text: "«يهدئ: sedate»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "مُسَكِّن"
      confirm:
        - text: "«(في علم الطب) Analgesic: دواءٌ يُخَفِّفُ الْإحساسَ بالألم أو يُفْقِدُ الْإحساسَ به.»"
          source: "المعجم الكبير"
        - text: "«يُسَكِّن؛ يُلَطِّف؛ يُخفِّف.»"
          source: "المورد الحديث (2008)"
    - lemma: "مُفَرِّج"
      confirm:
        - text: "«مُفَرِّج من (ف ر ج) الموسع الشيء وكاشف الغمة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُلَطِّف"
      confirm:
        - text: "«دواء يخفف أعراض المرض أو يزيله تماما.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«جاعل الشيء رقيقا.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "مُطَمْئِن"
      confirm:
        - text: "«وطامَنْتُ منه: سَكَّنْتُ.» (في مادة طمن)"
          source: "مقاييس اللغة لابن فارس"

stage3_analysis:
  per_lemma:
    - lemma: "مُخَفِّف"
      decision: confirmed
      decision_reason: "مصطلح أساسي للتعبير عن التخفيف من الحدة، سواء للألم أو للمشاعر السلبية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَفِّف"
    - lemma: "مُهَدِّئ"
      decision: confirmed
      decision_reason: "يتطابق مباشرة مع لفظ التعريف 'يهدئ'، ويستخدم لوصف الشخص الذي يبعث الهدوء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُهَدِّئ"
    - lemma: "مُسَكِّن"
      source: stage1
      decision: confirmed
      decision_reason: "من أكثر الألفاظ دلالة على تسكين الألم والمخاوف، ويرد في التعريف كفعل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُسَكِّن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُفَرِّج"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم بكثرة في السياق الديني والاجتماعي لوصف من يكشف الكرب والغم (مفرج الكروب)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُفَرِّج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُلَطِّف"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن التخفيف برقة، ويستخدم في السياق الطبي والنفسي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُلَطِّف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُطَمْئِن"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ دقيق لوصف من يبث الطمأنينة ويزيل الخوف، وهو جوهر المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "مُطَمْئِن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "شخص يقلل من الحدة (مثلاً المخاوف) ويهدئ ويسكن"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن صياغته بأسلوب معجمي أكثر دقة ليشمل الجانبين الحسي والنفسي."
    authored:
      - type: terminological
        text: "من يقلل من حدة الألم أو القلق أو الخوف، ويبعث السكينة والطمأنينة في النفس."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "من يقلل من حدة الألم أو القلق أو الخوف، ويبعث السكينة والطمأنينة في النفس."}
  examples:
    per_lemma:
      - lemma: "مُخَفِّف"
        examples:
          - text: "كانت كلماته مخففاً لآلامي في تلك الليلة الحزينة."
            type: usage
      - lemma: "مُهَدِّئ"
        examples:
          - text: "كان صوته الرخيم مهدئاً لروع الحاضرين."
            type: usage
      - lemma: "مُسَكِّن"
        examples:
          - text: "يُعتبر الصبر مسكناً للأوجاع النفسية العميقة."
            type: usage
      - lemma: "مُفَرِّج"
        examples:
          - text: "عُرف بكونه مفرجاً للكروب ومعيناً للمحتاجين."
            type: usage
      - lemma: "مُلَطِّف"
        examples:
          - text: "استخدم الطبيب دهاناً ملطفاً لتهيج الجلد."
            type: usage
      - lemma: "مُطَمْئِن"
        examples:
          - text: "وجه الأب مطمئنٌ لقلوب أطفاله عند العاصفة."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "مُخَفِّف"
      entry_id: "{auto}"
      root: "خفف"
      maqayis_quote: "«الْخَاءُ وَالْفَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ شَيْءٌ يُخَالِفُ الثِّقَلَ وَالرَّزَانَةَ. يُقَالُ خَفَّ الشَّيْءُ يَخِفُّ خِفَّةً.»"
    - lemma: "مُهَدِّئ"
      entry_id: "{auto}"
      root: "هدأ"
    - lemma: "مُسَكِّن"
      entry_id: "{auto}"
      root: "سكن"
      maqayis_quote: "«السِّينُ وَالْكَافُ وَالنُّونُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى خِلَافِ الِاضْطِرَابِ وَالْحَرَكَةِ.»"
    - lemma: "مُفَرِّج"
      entry_id: "{auto}"
      root: "فرج"
      maqayis_quote: "«الْفَاءُ وَالرَّاءُ وَالْجِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَفَتُّحٍ فِي الشَّيْءِ... وَيَقُولُونَ: إِنَّ الْفَرْجَةَ: التَّفَصِّي مِنْ هَمٍّ أَوْ غَمٍّ.»"
    - lemma: "مُلَطِّف"
      entry_id: "{auto}"
      root: "لطف"
    - lemma: "مُطَمْئِن"
      entry_id: "{auto}"
      root: "طمأن"
      maqayis_quote: "«الطَّاءُ وَالْمِيمُ وَالنُّونُ أُصَيْلٌ بِزِيَادَةِ هَمْزَةٍ. يُقَالُ: اطْمَأَنَّ الْمَكَانُ يَطْمَئِنُّ طُمَأْنِينَةً. وَطَامَنْتُ مِنْهُ: سَكَّنتُ.»"
  per_sense:
    - lemma: "مُخَفِّف"
      sense_id: "{auto}"
      nuance: "يركز على تقليل شدة الأثر أو التركيز."
      mwe: false
    - lemma: "مُهَدِّئ"
      sense_id: "{auto}"
      nuance: "يركز على بث الهدوء النفسي أو العصبي."
      mwe: false
    - lemma: "مُسَكِّن"
      sense_id: "{auto}"
      nuance: "يركز على إيقاف الألم أو الاضطراب."
      mwe: false
    - lemma: "مُفَرِّج"
      sense_id: "{auto}"
      nuance: "يركز على كشف الغم وإزالة الكرب تماماً."
      mwe: false
    - lemma: "مُلَطِّف"
      sense_id: "{auto}"
      nuance: "يركز على جعل الشيء أقل خشونة أو حدة برقة."
      mwe: false
    - lemma: "مُطَمْئِن"
      sense_id: "{auto}"
      nuance: "يركز على غرس الطمأنينة والأمان."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
