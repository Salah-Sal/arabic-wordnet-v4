stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
    observations: "المصطلح يعبر عن عملية حيوية وجيولوجية وكيميائية أساسية. المركب الإضافي 'دورة النيتروجين' هو الأكثر شيوعاً واعتماداً، ويوازيه 'دورة الآزوت' في بعض البلدان العربية."
  blind_candidates:
    - lemma: "دَوْرَةُ النِّيتْرُوجِين"
      generation_method: tarkib
      justification: "تركيب إضافي يمثل الترجمة المباشرة والدقيقة للمفهوم العلمي."
    - lemma: "دَوْرَةُ الآزُوت"
      generation_method: tarkib
      justification: "استخدام لاسم العنصر 'الآزوت' الشائع في بعض المناهج العربية كمرادف للنيتروجين."
    - lemma: "الدَّوْرَةُ النِّيتْرُوجِينِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي ينسب الدورة إلى العنصر."
    - lemma: "الدَّوْرَةُ الآزُوتِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي باستخدام المرادف 'آزوت'."

stage2_evidence:
  per_lemma:
    - lemma: "دورة النيتروجين"
      confirm:
        - text: "دورة النيتروجين: الانتقال الدوري للنيتروجين بين الكائنات الحية والأرض..."
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
        - text: "دورة النيتروجين"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
    - lemma: "دورة الآزوت"
      confirm:
        - text: "دورة الآزوت"
          source: "المَكنَز الزراعي متعدد اللغات"
        - text: "دورة الأزوت"
          source: "مسرد الجغرافيا والتاريخ"

stage3_analysis:
  per_lemma:
    - lemma: "دورة النيتروجين"
      decision: confirmed
      decision_reason: "مصطلح علمي معتمد وموثق في المعاجم المتخصصة، وهو التعبير القياسي الشائع عن المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَوْرَةُ النِّيتْرُوجِين"
    - lemma: "دَوْرَةُ الآزُوت"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق ومعتمد في عدة أدلة معجمية متخصصة، ويشيع استخدامه في بعض الأقطار العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "دَوْرَةُ الآزُوت", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "الدَّوْرَةُ النِّيتْرُوجِينِيَّة"
      source: stage1
      decision: removed
      decision_reason: "التركيب الوصفي أقل شيوعاً من الإضافي في هذا السياق المعين، ولم يظهر في الأدلة المعجمية الرئيسية."
    - lemma: "الدَّوْرَةُ الآزُوتِيَّة"
      source: stage1
      decision: removed
      decision_reason: "التركيب الوصفي أقل شيوعاً والتركيب الإضافي يغني عنه."

stage4_content:
  definition:
    current: "دورة النيتروجين؛ تمتص النباتات النترات من التربة، وتأكلها الحيوانات التي تموت وتتحلل لتعيد النيتروجين إلى التربة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على اللمة في بدايته، وهو سرد لبعض خطوات الدورة دون بيان ماهيتها بشكل كافٍ. تم تحسين الصياغة لتكون تعريفاً موسوعياً وافياً."
    authored:
      - type: encyclopedic
        text: "انتقال دوري مستمر لعنصر النيتروجين بين الكائنات الحية والبيئة المحيطة بها في الغلاف الجوي والتربة؛ حيث تمتص النباتات النترات من التربة، وتتغذى عليها الحيوانات، وعند موتها وتحللها يعود النيتروجين إلى التربة أو الغلاف الجوي."
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "انتقال دوري مستمر لعنصر النيتروجين بين الكائنات الحية والبيئة المحيطة بها في الغلاف الجوي والتربة؛ حيث تمتص النباتات النترات من التربة، وتتغذى عليها الحيوانات، وعند موتها وتحللها يعود النيتروجين إلى التربة أو الغلاف الجوي."}

  examples:
    per_lemma:
      - lemma: "دَوْرَةُ النِّيتْرُوجِين"
        examples:
          - text: "تلعب البكتيريا دوراً حاسماً في إتمام دورة النيتروجين في الطبيعة."
            type: usage
      - lemma: "دَوْرَةُ الآزُوت"
        examples:
          - text: "تساهم الأسمدة في إحداث خلل في توازن دورة الآزوت في البيئة المائية."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تلعب البكتيريا دوراً حاسماً في إتمام دورة النيتروجين في الطبيعة."}

