        key: note
        value: '{"root":"نخب","maqayis":"«النُّونُ وَالْخَاءُ وَالْبَاءُ كَلِمَةٌ تَدُلُّ عَلَى تَعَظُّمٍ يُقَالُ أَحَدُهُمَا عَلَى خِيَارِ شَيْءٍ...»"}'
