# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06691047-n
# print — النص المطبوع
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «مطبوع» بدون تشكيل — تحتاج إلى تشكيل كامل"
      - "اللمّة «نص مطبوع» تركيب وصفي حرّ وليس وحدة معجمية ثابتة — يمكن إبدال «مطبوع» بـ«مكتوب» أو «محرَّر» فيبقى التعبير صالحاً كوصف"
      - "التعريف العربي يكاد يكون ترجمة حرفية للتعريف الإنجليزي — يحتاج تأليفاً معجمياً عربياً أصيلاً"
    observations: "المفهوم يدور حول النصّ بوصفه مادّة مكتوبة تظهر في وسائط مطبوعة (كتب، صحف، منشورات). الفرق بينه وبين المفهوم الأعمّ «تواصل كتابيّ» أنّ هذا مقيّد بالطباعة دون الخطّ اليدوي. المصطلح الإنجليزي print يحمل دلالات متعددة (طبعة، نسخة، حروف) لكن المجموعة هنا تخصّ النصّ المطبوع ذاته لا عملية الطباعة ولا المنتَج المادي."
  blind_candidates:
    - lemma: "مَطْبُوعَة"
      generation_method: ishtiqaq
      justification: "اسم مفعول مؤنث من الجذر ط ب ع على وزن مَفْعُولة، يُستعمل اسماً للمادة المطبوعة أو الوثيقة المطبوعة، شائع في السياق الإداري والأكاديمي"
    - lemma: "طَبْعَة"
      generation_method: ishtiqaq
      justification: "مصدر مرّة من طَبَعَ على وزن فَعْلة، يدلّ على ناتج فعل الطبع في مرّة واحدة؛ مسجّل في المعجم الكبير بمعنى مجموع النسخ المطبوعة"
    - lemma: "سَوَاد"
      generation_method: majaz
      justification: "إزاحة دلالية من السواد (لون المداد) إلى ما يُكتب به؛ ورد في مصطلحات القراءات بمعنى رسم المصحف لأنّ المصاحف كُتبت بالمداد الأسود"
    - lemma: "حُرُوف"
      generation_method: majaz
      justification: "مجاز مرسل علاقته الجزئية: الحروف جزء من النصّ المطبوع، يُطلق على الكلّ من باب تسمية الكلّ بالجزء، شائع في سياق الطباعة (حروف الطباعة)"

stage2_evidence:
  per_lemma:
    - lemma: "مَطْبُوع"
      confirm:
        - text: "«(المطبوع) ما طُبِعَ»"
          source: "المعجم الوسيط"
        - text: "«نسخة، مطبوع، مُسوَّدة»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
      expands:
        - text: "«فلان مطبوع في فنٍّ كذا أو غيره: ذو موهبة فيه يعالجه بلا تكلُّف ويجيدُه. فلان مطبوع على الكرم: أي شيمته الكرم»"
          source: "المعجم الوسيط"
          addition: "للمّة معنًى ثانٍ (ذو موهبة فطرية) لكنّه لا يتعارض مع المعنى المقصود هنا"

    - lemma: "نَصٌّ مَطْبُوع"
      evidence_status: "no_material_found"

    - lemma: "مَطْبُوعَة"
      confirm:
        - text: "«مطبوعة لمَّاعة: صورة مطبوعة شديدة اللمعان»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد"
      expands:
        - text: "«نسخة، مطبوع، مُسوَّدة» ترجمةً لـ print"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "مطبوعة تُستعمل في سياق الصور والنسخ المادية أكثر من النصّ المجرّد"

    - lemma: "طَبْعَة"
      contradicts:
        - text: "«مجموعُ النُّسَخِ المَطْبوَعة في مرَّة واحدة من كِتابٍ أو جريدة. يُقال: الطَّبْعَة الأولَى أو الأخيرة»"
          source: "المعجم الكبير"
          conflict: "طَبْعَة تعني edition (مجموع النسخ) لا النصّ المطبوع ذاته"

    - lemma: "سَوَاد"
      confirm:
        - text: "«السواد: رسم المصحف، سُمّي بذلك لأنّ المصاحف كانت تُكتب بالمداد الأسود»"
          source: "مختصر العبارات لمعجم مصطلحات القراءات"
      contradicts:
        - text: "«السَّوَادُ: موضعان...» (اسم لرستاق العراق)"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "الدلالة الجغرافية أشهر وأغلب، والدلالة المصحفية مقصورة على علم القراءات"

    - lemma: "حُرُوف"
      expands:
        - text: "«حروف وسائل الإعلام المطبوعة» ترجمةً لـ print media"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "حروف تُستعمل في سياق وسائل الإعلام المطبوعة لكن بمعنى المادة الإعلامية لا النصّ المجرّد"

stage3_analysis:
  per_lemma:
    - lemma: "مَطْبُوع"
      decision: confirmed
      decision_reason: "اسم مفعول من طَبَعَ بمعنى «ما طُبِع»، وهو المقابل العربي الأصيل والمباشر لـ print بمعنى النصّ المطبوع. المعجم الوسيط يؤكد هذا المعنى. اللمّة الموجودة بدون تشكيل فتحتاج تحديثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المادة المطبوعة بوصفها ناتج فعل الطبع، أعمّ من «نصّ مطبوع» إذ يشمل النصّ وغيره (صور، رسوم)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَطْبُوع"

    - lemma: "نَصٌّ مَطْبُوع"
      decision: confirmed
      decision_reason: "تركيب وصفي يقيّد المطبوع بالنصّ تحديداً، وهو أدقّ مطابقةً للتعريف الإنجليزي «the text appearing in a book, newspaper, or other printed publication». وإن كان تعبيراً وصفياً فهو شائع الاستعمال في السياق الإعلامي والمكتبي بوصفه مصطلحاً ثابتاً نسبياً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "أضيق دلالةً من «مطبوع» لأنّه يقصر المفهوم على النصّ دون الصور أو الرسوم المطبوعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَصٌّ مَطْبُوع"

    - lemma: "مَطْبُوعَة"
      source: stage1
      decision: removed
      decision_reason: "مَطْبُوعَة تُستعمل غالباً بمعنى المادة المطبوعة المادية (وثيقة، نشرة، صورة) لا النصّ المجرّد الذي يظهر في المنشور. الفرق الدلالي بينها وبين «مطبوع» ضعيف، وهي أقرب إلى synset آخر يخصّ المطبوعات بوصفها وثائق."

    - lemma: "طَبْعَة"
      source: stage1
      decision: removed
      decision_reason: "المعجم الكبير يعرّفها بـ«مجموع النسخ المطبوعة في مرّة واحدة» أي edition لا print. دلالتها تخصّ العدد والإصدار لا النصّ ذاته."

    - lemma: "سَوَاد"
      source: stage1
      decision: removed
      decision_reason: "استعمال «سواد» بمعنى رسم المصحف مقصور على علم القراءات ولا يصلح مصطلحاً عاماً للنصّ المطبوع. الدلالة الجغرافية والمكانية أشهر بكثير."

    - lemma: "حُرُوف"
      source: stage1
      decision: removed
      decision_reason: "حروف تدلّ على الوحدات الكتابية المفردة لا على النصّ بوصفه كلّاً. المجاز المرسل هنا بعيد ولا يُفهم بلا قرينة."

