# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-06518594-n
# (dated slang) a remarkable or excellent thing or person
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف يصف مفهوماً عامياً إنجليزياً قديماً (corker) لا مقابل عامي عربي مباشر له"
      - "اللمّة «شَيْء مُذْهِل» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ (يمكن إبدالها بـ«شيء مدهش» أو «شيء مبهر»)"
      - "الأب المباشر (hypernym) هو «رسالة/مضمون/محتوى» (awn4-06611268-n) وهذا لا يتسق مع تعريف «شيء أو شخص رائع» — يبدو أن المجموعة ربطت بمعنى آخر لـcorker هو «الكلمة الفصل في مناقشة» وهو الذي يصلح فرعاً للمحتوى"
      - "أُعْجُوبَة كلمة فصيحة رفيعة المستوى بينما المفهوم الأصلي عامي — تفاوت في السجل اللغوي"
    observations: "المجموعة تمثل مفهوماً عامياً إنجليزياً قديماً (corker بمعنى الشيء الرائع) وُضع تحت فرع «المحتوى/الرسالة» في الشبكة الدلالية، وهو موضع يناسب معنى corker الآخر: «الحجة الحاسمة/الكلمة الفصل». اللمّة العربية «أعجوبة» تعني ما يدعو إلى العجب وهي أقرب معادل فصيح، لكنها أعمّ دلالياً وأرفع سجلاً من الأصل الإنجليزي العامي. اللمّة الثانية «شيء مذهل» تركيب وصفي حر لا يرقى إلى مرتبة المصطلح."

  blind_candidates:
    - lemma: "تُحْفَة"
      generation_method: majaz
      justification: "أصل التحفة ما أُتحف به الرجل من البرّ والألطاف، ثم توسّعت الدلالة إلى ما له قيمة فنية أو أثرية نادرة. الإزاحة من الهدية النفيسة إلى الشيء الرائع المتميز إزاحة طبيعية."
    - lemma: "نَادِرَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن-د-ر بمعنى السقوط والندرة، على وزن فاعلة. تُطلق على الطرفة من القول ووحيد العصر، فتتضمن دلالة التفرد والتميز."
    - lemma: "فَرِيدَة"
      generation_method: ishtiqaq
      justification: "من الجذر ف-ر-د على وزن فعيلة بمعنى المنفردة المتميزة، وتُطلق على الدرة النفيسة والجوهرة التي لا نظير لها."
    - lemma: "دُرَّة"
      generation_method: majaz
      justification: "الدرة اللؤلؤة العظيمة الكبيرة، والمجاز من الجوهرة الثمينة إلى الشيء أو الشخص الرائع مجاز مشهور في العربية (فلان درة قومه)."

stage2_evidence:
  per_lemma:
    - lemma: "أُعْجُوبَة"
      confirm:
        - text: "«(الأعجوبة) مَا يَدْعُو إِلَى الْعجب (ج) أَعَاجِيب»"
          source: "المعجم الوسيط (هَوَرَماني)"
        - text: "«ما يدعو إلى العجب»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«الْعَيْنُ وَالْجِيمُ وَالْبَاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى كِبْرٍ وَاسْتِكْبَارٍ لِلشَّيْءِ... وَتَقُولُ مِنْ بَابِ الْعَجَبِ: عَجِبَ يَعْجَبُ عَجَبًا، وَأَمْرٌ عَجِيبٌ، وَذَلِكَ إِذَا اسْتُكْبِرَ وَاسْتُعْظِمَ... وَشَيْءٌ مُعْجِبٌ، إِذَا كَانَ حَسَنًا جِدًّا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُضيف أن شيئاً معجباً يعني حسناً جداً، مما يقرب دلالة أعجوبة من معنى الروعة والامتياز"

    - lemma: "شَيْء مُذْهِل"
      evidence_status: "no_material_found"

    - lemma: "تُحْفَة"
      confirm:
        - text: "«الطُّرفة يقال لما له قيمة فنية أو أثرية: تُحفة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«عمل فنِّي نادر»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — ترجمة masterpiece"
      expands:
        - text: "«التُّحْفَةُ، بالضم، وكهُمَزَةٍ: البِرُّ واللَّطَفُ، والطُّرْفَةُ، ج: تُحَفٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يبيّن أن الدلالة الأصلية هي البرّ واللطف والطرفة، ثم توسعت"
        - text: "«التحفة: الشيء الطريف النفيس يكرم به الإنسان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يضيف وصف النفاسة والطرافة"
      contradicts:
        - text: "«(التُّحْفَة) الطرفة وَيُقَال لما لَهُ قيمَة فنية أَو أثرية تحفة (ج) تحف»"
          source: "المعجم الوسيط (هَوَرَماني)"
          conflict: "الدلالة المعاصرة تحصر التحفة في القيمة الفنية أو الأثرية، لا في مطلق الشيء الرائع أو الشخص الممتاز"

    - lemma: "نَادِرَة"
      contradicts:
        - text: "«(النادرة) الطرفة من القَوْل وَهُوَ نادرة أزمانه وحيد عصره (ج) نَوَادِر»"
          source: "المعجم الوسيط (هَوَرَماني)"
          conflict: "الدلالة الأساسية للنادرة هي الطرفة من القول (نكتة/حكاية طريفة) وليس الشيء الرائع عموماً"
        - text: "«نوع من الأنواع الصغرى ارتبط بمحكيات جحا والشطار وبخلاء الجاحظ، وهو شكل موجز للهزء»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ArabTerm)"
          conflict: "نادرة مصطلح أدبي يعني النكتة أو الطرفة القصصية، بعيد عن معنى الشيء الممتاز"

    - lemma: "فَرِيدَة"
      confirm:
        - text: "«من (ف ر د) الدرة والجوهرة النفيسة، ومؤنث الفريد بمعنى الفرد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«من (ف ر د) الدرة والجوهرة النفيسة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "فريدة تُستخدم أساساً اسم علم مؤنث وتعني الجوهرة لا الشيء الرائع عموماً، كما أنها مؤنثة فلا تصف الذكور أو الأشياء المذكرة"

    - lemma: "دُرَّة"
      contradicts:
        - text: "«واحدةُ الدَّرِّ, وهى اللؤلؤة العظيمة الكبيرة الببغاء الصغيرة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "الدلالة الأساسية هي اللؤلؤة الكبيرة، والاستعمال المجازي بمعنى الشخص المتميز محدود ولا يشمل الأشياء"

stage3_analysis:
  per_lemma:
    - lemma: "أُعْجُوبَة"
      decision: confirmed
      decision_reason: "أُعْجُوبَة كلمة فصيحة ثابتة في المعجم الوسيط بمعنى «ما يدعو إلى العجب»، وهي أقرب معادل عربي فصيح للمفهوم. وإن كانت أرفع سجلاً من الأصل الإنجليزي العامي، فهي تؤدي المعنى العام للتعجب من شيء رائع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على ما يثير العجب والدهشة لغرابته أو تفوقه، وتحمل ظلالاً من الإكبار والاستعظام أكثر من مجرد الجودة والامتياز"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُعْجُوبَة"

    - lemma: "شَيْء مُذْهِل"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست وحدة معجمية مسكوكة. تفشل في اختبار السكّ: يمكن إبدال «مذهل» بـ«مدهش» أو «مبهر» أو «رائع» دون تغيير المعنى. كما أنها تصف صفة الشيء لا تسمّيه، فلا ترقى إلى لمّة معجمية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تُحْفَة"
      source: stage1
      decision: removed
      decision_reason: "دلالة التحفة المعاصرة تحصرها في ما له قيمة فنية أو أثرية (artifact/masterpiece)، وهي أخص من المفهوم المطلوب (أي شيء أو شخص رائع). كما أنها لا تصف الأشخاص عادةً."

    - lemma: "نَادِرَة"
      source: stage1
      decision: removed
      decision_reason: "النادرة في الاستعمال المعجمي الراسخ تعني الطرفة من القول والنكتة القصصية (jest/anecdote)، وليست الشيء الرائع. الدلالة المطلوبة بعيدة عن الاستعمال المعجمي الموثق."

    - lemma: "فَرِيدَة"
      source: stage1
      decision: removed
      decision_reason: "فريدة تُستعمل غالباً اسم علم مؤنث أو تعني الجوهرة النفيسة. صيغتها المؤنثة تجعلها غير صالحة لوصف مذكر، والدلالة أخص من المطلوب."

    - lemma: "دُرَّة"
      source: stage1
      decision: removed
      decision_reason: "الدرة بمعنى اللؤلؤة العظيمة استعمالها المجازي للأشخاص محدود (درة قومه)، ولا يشمل الأشياء بشكل عام. كما تتداخل مع دلالات أخرى (الدِّرّة = السوط)."

