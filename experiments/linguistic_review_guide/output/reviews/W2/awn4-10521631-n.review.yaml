          - text: "لَا تَكُنْ مُسْتَسْلِماً عِنْدَ أَوَّلِ عَقَبَةٍ تُوَاجِهُكَ فِي حَيَاتِكَ المِهْنِيَّةِ."
            type: usage
      - lemma: "مُنْسَحِب"
