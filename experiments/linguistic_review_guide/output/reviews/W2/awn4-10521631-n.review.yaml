stage1_review:
  assessment:
    concerns:
      - "اللمة (تارك) عامة جداً ولا تفيد معنى الاستسلام السهل، بل تعني مجرد من ترك شيئاً."
      - "اللمتان (مستسلم) و(منسحب) صحيحتان كدلالة على من يترك المواجهة، لكن ينقصهما دلالة السهولة والسرعة في الاستسلام التي في المفهوم الأصلي."
    observations: "المفهوم يشير إلى شخص يتخلى عن الأمور أو ينسحب من المواجهة بسهولة ودون مقاومة كافية (quitter). التعبيرات العربية الأقرب لهذا المعنى تشمل المتخاذل أو الانهزامي الذي يفتقر للعزيمة."
  blind_candidates:
    - lemma: "مُتَخَاذِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تخاذل، ويدل على من يترك المواجهة ويتخلى عن نصرة قضيته بضعف."
    - lemma: "اِنْهِزَامِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الانهزام، ويطلق على الشخص الذي يميل إلى الاستسلام وقبول الهزيمة بسرعة."
    - lemma: "نَكُوص"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة لمن يكثر نكوصه وتراجعه عن المواجهة والأفعال."
    - lemma: "رِعْدِيد"
      generation_method: majaz
      justification: "استخدام مجازي لوصف الجبان الذي لا يثبت في المواقف ويرتعد خوفاً فينسحب."

stage2_evidence:
  per_lemma:
    - lemma: "تَارِك"
      confirm: []
      contradicts:
        - text: "الشيءَ : أبقاه خَلَّاه فلاناً البَيْعَ أو في البيع : صَالَحَه فيه"
          source: "المعجم الكبير"
          conflict: "المعنى عام جداً ويدل على الترك المجرد للشيء، وليس بالضرورة التراجع والاستسلام."
      expands: []
    - lemma: "مُسْتَسْلِم"
      confirm:
        - text: "(2) السريع إلى الاستسلام. وبخاصة: الانهزاميّ."
          source: "المورد الحديث (2008)"
      contradicts: []
      expands: []
    - lemma: "مُنْسَحِب"
      confirm:
        - text: "ينسحب من عملٍ ما"
          source: "المورد الحديث (2008)"
      contradicts: []
      expands: []
    - lemma: "مُتَخَاذِل"
      confirm:
        - text: "شَخْصٌ مُتَخاذِلٌ: مُخْتَلِفُ الخِلْقَةِ الذى يَخْذُلُه النُّهُوضُ ولا يُطِيقُ الحَراكَ"
          source: "المعجم الكبير"
      contradicts: []
      expands:
        - text: "صَرْعَى نَوْؤُهَا مُتَخَاذِلُ"
          source: "مقاييس اللغة"
          addition: "يدل على الضعف وترك الإعانة."
    - lemma: "اِنْهِزَامِيّ"
      confirm:
        - text: "السريع إلى الاستسلام. وبخاصة: الانهزاميّ."
          source: "المورد الحديث (2008)"
      contradicts: []
      expands: []
    - lemma: "نَكُوص"
      confirm: []
      contradicts: []
      expands:
        - text: "بَاب النكوص والارتداد انتكث وارتد وانتكس وانتقض"
          source: "الألفاظ المختلفة لابن مالك"
          addition: "تأتي بمعنى الارتداد عن الشيء."
    - lemma: "رِعْدِيد"
      confirm: []
      contradicts:
        - text: "الجبانُ يرتعد ويضطرب عند القتال جُبناً"
          source: "المعجم الوسيط"
          conflict: "تدل على الجبن والاضطراب وليس بالضرورة على سرعة الاستسلام في مجالات الحياة المختلفة."
      expands: []

stage3_analysis:
  per_lemma:
    - lemma: "تَارِك"
      decision: removed
      decision_reason: "الكلمة عامة جداً وتفيد الترك المطلق ولا تحمل الدلالة السلبية المرتبطة بضعف الإرادة وسهولة الاستسلام المطلوبة في المفهوم."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "مُسْتَسْلِم"
      decision: confirmed
      decision_reason: "كلمة فصيحة ومناسبة تماماً للدلالة على من يرضخ ويتخلى عن المقاومة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَسْلِم"
    - lemma: "مُنْسَحِب"
      decision: confirmed
      decision_reason: "دلالة صحيحة تستخدم بكثرة لوصف من يترك العمل أو التحدي قبل إتمامه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْسَحِب"
    - lemma: "مُتَخَاذِل"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر بدقة عن الجانب النفسي والسلوكي لمن يتراجع ويترك العمل ويستسلم للضعف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُتَخَاذِل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "اِنْهِزَامِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معاصر وشائع جداً لوصف الشخص الذي يميل للاستسلام بسهولة ويفتقر لروح المقاومة والمثابرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "اِنْهِزَامِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "نَكُوص"
      source: stage1
      decision: removed
      decision_reason: "تستخدم غالباً كمصدر وليس كصفة أو اسم فاعل يدل على الشخص المعني بشكل مباشر ومألوف."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "رِعْدِيد"
      source: stage1
      decision: removed
      decision_reason: "تركز على الجبن والاضطراب الجسدي أكثر من دلالتها على ترك العمل أو الاستسلام بسهولة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "شخص يستسلم بسهولة بالغة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية، ويمكن صياغته بأسلوب معجمي عربي أوضح وأشمل يعكس دلالات التراجع."
    authored:
      - type: terminological
        text: "شَخْصٌ يَمِيلُ إِلَى التَّرَاجُعِ عَنِ الْمُوَاجَهَةِ وَيَسْتَسْلِمُ لِلْعَقَبَاتِ بِسُهُولَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَمِيلُ إِلَى التَّرَاجُعِ عَنِ الْمُوَاجَهَةِ وَيَسْتَسْلِمُ لِلْعَقَبَاتِ بِسُهُولَةٍ."
