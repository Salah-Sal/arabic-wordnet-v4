      - lemma: "مُتَخَاذِل"
        examples:
          - text: "لَمْ يَعْتَمِدُوا عَلَيْهِ فِي الْمُهِمَّةِ الصَّعْبَةِ لِأَنَّهُ مُتَخَاذِلٌ عِنْدَ الشَّدَائِدِ."
