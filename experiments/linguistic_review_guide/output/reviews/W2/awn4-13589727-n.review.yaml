    current: "العملية التي يقبل بها محول الطاقة الطاقة بشكل ما ويعيد طاقة ذات صلة بشكل مختلف"
    assessment:
      decision: revise
      reason: "التعريف الحالي ركيك لغوياً بسبب الترجمة الحرفية (يقبل بها محول الطاقة الطاقة)."
    authored:
      - type: terminological
        text: "عملية فيزيائية يستقبل فيها محوِّل الطاقة شكلاً من أشكال الطاقة، ويحوِّله إلى شكل آخر ذي صلة."
