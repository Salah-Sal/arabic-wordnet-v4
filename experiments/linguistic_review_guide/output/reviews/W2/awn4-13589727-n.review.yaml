stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي يبدو مترجماً ترجمة آلية حرفية تفتقر إلى السبك اللغوي السليم (التي يقبل بها محول الطاقة الطاقة)."
      - "مصطلح 'تحويل الطاقة' هو تعبير وصفي أكثر منه مصطلح مسكوك دقيق، لكنه الأكثر شيوعاً واستقراراً في المجال الفيزيائي والهندسي للتعبير عن هذه العملية."
    observations: "مصطلح Transduction في الطب والبيولوجيا يُترجم إلى 'تنبيغ' أو 'نقل وراثي'، لكن في سياق الفيزياء والهندسة حيث يتم تحويل أشكال الطاقة عبر 'محول طاقة' (Transducer)، فإن العملية تسمى 'تحويل الطاقة'."
  blind_candidates:
    - lemma: "تَحْوِيل طَاقَوِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يصف عملية تحويل الطاقة بشكل أكثر اصطلاحية."
    - lemma: "تَبْدِيل طَاقَة"
      generation_method: tarkib
      justification: "استخدام مرادف لكلمة تحويل."
    - lemma: "تَنْقِيل"
      generation_method: ishtiqaq
      justification: "مصطلح مستخدم في بعض فروع العلوم لترجمة transduction."
    - lemma: "تَنْقِيل طَاقَة"
      generation_method: tarkib
      justification: "تخصيص التنقيل بمجال الطاقة."

stage2_evidence:
  per_lemma:
    - lemma: "تحويل الطاقة"
      confirm:
        - text: "العملية التي تُنقل فيها كمية من الطاقة، أو تتحوّل، أو تتبدّد، أو تُمتص..."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "energy conversion"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يثبت الاستخدام المقابل لمفهوم تحويل الطاقة الإنجليزية."
    - lemma: "تَحْوِيل طَاقَوِيّ"
      evidence_status: "no_material_found"
    - lemma: "تَبْدِيل طَاقَة"
      evidence_status: "no_material_found"
    - lemma: "تَنْقِيل"
      evidence_status: "no_material_found"
    - lemma: "تَنْقِيل طَاقَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تحويل الطاقة"
      decision: confirmed
      decision_reason: "المصطلح الأكثر دقة وشيوعاً في المعاجم المتخصصة لوصف تحول شكل من أشكال الطاقة إلى آخر باستخدام محولات الطاقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحْوِيل الطَّاقَة"

