# مراجعة المجموعة الترادفية — Synset Review
# id: awn4-04760710-n  |  ili: i62005  |  pos: n
# definition_en: something that is certain
# lemmas_en: certainty / sure thing / foregone conclusion
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "شَيْء مُؤَكَّد عبارة وصفية تُعيد صياغة التعريف حرفياً (دوران لغوي)، وليست وحدة معجمية مسكوكة تجتاز اختبار السكّ"
      - "يَقِين في المعاجم يُعبِّر أساساً عن حالة معرفية ذهنية (epistemic state)، لا عن «شيء مؤكد» بوصفه كياناً موضوعياً — ثمة تحوُّل دلالي يستوجب توثيقه في nuance"
      - "الهيبرنيم المباشر (awn4-04731092-n: جَوْدَة/نَوْعِيَّة) غير بديهي عربياً وإن كان يتبع تقاليد Princeton WordNet في إدراج certainty تحت quality"
    observations: >
      المجموعة تعبّر عن مفهوم «الحتمية الموضوعية» — الأمر المفروغ من وقوعه من حيث هو شيء قائم في العالم
      لا مجرد حالة في ذهن العارف. العربية تُفرِّق بين يَقِين (الجانب المعرفي) وحَتْم (الجانب الموضوعي)،
      والمجموعة تستوجب تمثيلاً بالجانبين معاً. يَقِين مدعوم معجمياً وشائع، وأَمْر مَحْتُوم تعبير مركَّب موثَّق.
      الجذر حتم ثابت في القرآن الكريم والشعر العربي الكلاسيكي.

  blind_candidates:
    - lemma: "يَقِينٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر يقن على وزن فَعِيل المصدري؛ يَقِنَ الشيءَ يَيْقَنه أي علمه علماً قاطعاً، فاليقين
        هو الشيء الذي لا يُشكُّ في ثبوته؛ يُستعمل اسماً للمفهوم المجرد وللشيء المتيقَّن منه
        كقولهم «الموتُ يقينٌ»
    - lemma: "حَتْمِيَّةٌ"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي بـ(-ية) من حَتْم؛ حَتَمَ الأمرَ أي أوجبه وقضاه قضاءً لازماً،
        فالحَتْمِيَّة تُعبِّر عن خاصية كون الأمر واجباً لا مفرَّ منه — على وزن فَعْلِيَّة المُنتج
        في الفلسفة والعلوم
    - lemma: "مُحَقَّقٌ"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من حقَّق يُحقِّق على وزن مُفَعَّل؛ المُحَقَّق بالفتح هو الأمر الثابت الذي
        ثبت بالدليل والبيان؛ الجذر حقق يحمل معنى التثبُّت والتحقُّق
    - lemma: "أَمْرٌ مُبْرَمٌ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (موصوف+صفة)؛ أَبْرَمَ الأمرَ أي أحكمه وأتمَّه فلا يُنقَض؛
        المُبْرَم هو المُحكَم الفتلِ الذي لا يُفَكُّ، وبالمجاز ما أُبرم من القضاء


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "يَقِين"
      confirm:
        - text: "«العِلْمُ الذى لا شكَّ معه — (فى الفلسفة): اطمئنان النَّفْس إلى حكمٍ مع الاعتقاد بصحَّته — الموت»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«يقين: (1) حقيقة؛ أمرٌ لا ريبَ فيه / (2) ثقة؛ يقين»"
          source: "المورد الحديث (2008)، ترجمة: certainty"
        - text: "«يقين — certainty»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«يقين — استعمال أسلوب يبرز أو يوحي بأن موقف المتكلم صحيح وأفكار الآخرين لا تستحق الاعتبار»"
          source: "مسرد الإعلام والتواصل (ArabTerm)، ترجمة: certainty"
      expands:
        - text: "«الْيَقِين: الْعلم الَّذِي لَا شكّ مَعَه و (فِي الفلسفة) اطمئنان النَّفس إِلَى حكم مَعَ الِاعْتِقَاد بِصِحَّتِهِ — والموت»"
          source: "المعجم الوسيط (hawramani_35)"
          addition: >
            إدراج «الموت» تحت مداخل اليقين يُثبت أن اللفظ يُستعمل عربياً للدلالة على
            الشيء المحقَّق وقوعُه لا على الحالة الذهنية فحسب
        - text: "«الْيَاءُ وَالْقَافُ وَالنُّونُ: الْيَقَنُ وَالْيَقِينُ: زَوَالُ الشَّكِّ. يُقَالُ يَقِنْتُ، وَاسْتَيْقَنْتُ، وَأَيْقَنْتُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يقن أصلٌ في زوال الشكّ وثبوت العلم القاطع — يدعم استخدام اليقين للشيء المحقَّق"

    - lemma: "أَمْر مَحْتُوم"
      confirm:
        - text: "«الحَتْمُ: إيجابُ القضاءِ — اللازم الواجِبُ الذى لابُدّ من فِعْلِهِ — الخالِصُ النَّقِيّ»"
          source: "المعجم الكبير (مجمع اللغة العربية، OCR)"
        - text: "«كَانَ عَلَى رَبِّكَ حَتْمًا مَقْضِيًّا»"
          source: "المعجم الكبير — شاهد قرآني (مريم:71)"
        - text: "«الحتم: القضاء المقدر»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«محتوم؛ مقدَّر — محكوم عليه بالهلاك»"
          source: "المورد الحديث (2008)، ترجمة: fated"
        - text: "«محتوم؛ متعذِّرٌ اجتنابُه»"
          source: "المورد الحديث (2008)، ترجمة: inevitable"
        - text: "«(1) قرار مُتَّخَذ سَلَفًا / (2) نتيجة محتومة»"
          source: "المورد الحديث (2008)، ترجمة: foregone conclusion"
      expands:
        - text: "«حَتَمَ الله الأمر يحتمه: قضاه — والحاتم القاضي — هذا حتم مقضيّ وحكم مرضيّ»"
          source: "أساس البلاغة للزمخشري (ت 1143م)"
          addition: "تثبت الاستعمال الكلاسيكي للجذر في معنى القضاء المُحكَم"
        - text: "«الحَتْمُ: إِيجابُ القَضاء... حتمت عليه الشئ: أوجبت»"
          source: "الصحاح للجوهري (ت 1003م)"
          addition: "الفعل يحتم = يوجب ويقضي قضاءً باتاً، يُسبغ على المشتق «محتوم» معنى اللزوم الموضوعي"

    - lemma: "شَيْء مُؤَكَّد"
      evidence_status: "no_material_found"

    - lemma: "حَتْمِيَّة"
      contradicts:
        - text: "«الحَتْمِيَّة (في الفلسفة): مبدأ يفيدُ عُموم القوانينِ الطبيعيةِ وثُبوتها, فلا تخلُّفَ ولا مُصادفةً — وحَتْمِيَّة الأمر: كونُه واجبًا لا مَفَرَّ منه»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المعجم يُثبت أن الحتمية مصطلح فلسفي يدلّ على مذهب الجبر (determinism)،
            لا على «شيء مؤكد» كوحدة معجمية مستقلة
        - text: "«الحتمية — determinism»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
          conflict: "الترجمة الموحَّدة في المعاجم المتخصصة تُحيل إلى determinism لا إلى certainty"
        - text: "«الحتمية — inevitability»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          conflict: "حتى ترجمة inevitability تشير إلى خاصية مجردة (الحتمية) لا إلى كيان بعينه"

    - lemma: "مُحَقَّق"
      expands:
        - text: "«الْمُحَقَّق: بِالْكَسْرِ من يُحَقِّق الْمسَائِل بدلائلها، وبالفتح الأمر الثَّابِت»"
          source: "دستور العلماء للأحمدنكري"
          addition: >
            المُحَقَّق بالفتح = «الأمر الثابت» يمكن تأويله بما يناسب الدلالة المطلوبة،
            غير أن المصدر فريد ولا يكفي لإثبات تثبيت معجمي واسع

    - lemma: "أَمْر مُبْرَم"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "يَقِين"
      decision: confirmed
      decision_reason: >
        اللفظ راسخ في المعجمية العربية والتراث الديني والأدبي، وتستعمله المعاجم المعاصرة
        ترجمةً لـcertainty. وإن كانت دلالته الأصلية الحالةَ المعرفية (انعدام الشكّ)
        فإن العربية وسَّعته للدلالة على الشيء المتيقَّن منه (الموت يقين) — وهو ما يُغطي
        معنى المجموعة من زاوية علم المعرفة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبِّر عن اليقين من جهة المعرِفة والوعي الداخلي؛ يُؤكِّد انعدامَ الشكّ في نفس
        المتحقِّق قبل الشيء ذاته — يُستعمل للأمور المعنوية والعقدية والمنطقية
      loan_check:
        borrowing_type: pure_arabic
        calque: false
      morphological_fit: >
        يَقِين على وزن فَعِيل (مصدر بمعنى اسم مفعول)، الوزن يناسب الاسم الدالّ على
        الصفة الثابتة الراسخة

    - lemma: "أَمْر مَحْتُوم"
      decision: confirmed
      decision_reason: >
        الجذر حتم موثَّق في المعاجم الكلاسيكية والمعاصرة بمعنى «القضاء اللازم الواجب»،
        والشاهد القرآني «حَتْمًا مَقْضِيًّا» يُرسِّخ دلالة الحتمية الموضوعية.
        المُحَقَّق المحتوم = «الشيء الذي قُضي وقوعُه». المُورد الحديث يُترجم
        foregone conclusion بـ«نتيجة محتومة»، فيُغطي أوسع معاني المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      mwe_fixedness: >
        التعبير مستعمل في النثر والخطاب المعاصر («كانت الهزيمة أمراً محتوماً»)
        وفي الترجمة الاصطلاحية المعتمَدة، ولا يقبل إبدال «محتوم» بـ«مقرَّر» دون تغيير
        في الظلال الدلالية — يجتاز اختبار التثبيت المعجمي
      nuance_differentiation: >
        يُعبِّر عن الجانب الموضوعي للحتمية؛ التركيز على الشيء الخارجي الذي قُضي وقوعُه
        قضاءً لا يُردُّ — يُستعمل للأحداث والنتائج والمصائر في السياق الخطابي والأدبي
      loan_check:
        borrowing_type: pure_arabic
        calque: false
      morphological_fit: >
        مَحْتُوم على وزن مَفْعُول (اسم مفعول من حَتَمَ)، يدلّ على ما أُوجب وقُضي — الوزن
        مناسب تماماً للدلالة على الأمر المحتوم الذي لا رادَّ له

    - lemma: "شَيْء مُؤَكَّد"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تُعيد صياغة التعريف ذاته بمفردات مختلفة (دوران لغوي: التعريف
        «شيء مؤكد الحدوث» واللمّة «شيء مؤكد» يتطابقان مبنىً). فضلاً عن ذلك لا وجود لها
        كوحدة معجمية مسكوكة في أي معجم مستعلَم. لا تجتاز اختبار السكّ: «شيء مُقرَّر»
        تؤدي الوصف ذاته فتبطل التعبيرية الاصطلاحية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حَتْمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم العربية المتخصصة تُجمع على أن الحَتْمِيَّة = determinism (مذهب فلسفي يقول
        بعموم قوانين الطبيعة وحتمية الأسباب والمسبَّبات)، لا «شيء مؤكد الحدوث». إدخالها
        في المجموعة يُربك القارئ ويخلط بين مستويين دلاليين مختلفين.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُحَقَّق"
      source: stage1
      decision: removed
      decision_reason: >
        الدليل المعجمي على دلالة «الأمر الثابت» منفرد (دستور العلماء وحده)، والدلالة الغالبة
        في الاستعمال المعاصر هي «الشخص الذي يُحقِّق» (investigator) أو الصفة بمعنى confirmed/verified.
        لا يكفي لإثبات تثبيت معجمي يُجيز استعماله لمّةً في هذه المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "أَمْر مُبْرَم"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوجد كوحدة معجمية مسكوكة في المعاجم المستعلَمة. الجذر برم يُفيد الإحكام والفتل
        لكن التعبير «أمر مبرم» غير مستعمل اصطلاحياً بمعنى «شيء مؤكد الحدوث» — يُستعمل
        عادةً بمعنى «عهد/اتفاقية محكمة»، مما يُقلِّص ملاءمته.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
