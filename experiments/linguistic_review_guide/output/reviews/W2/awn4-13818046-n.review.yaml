# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-13818046-n  |  ILI: i109404
# المفهوم: عدم الصلة / اللاعلاقية (irrelevance / irrelevancy)
# تاريخ المراجعة: 2026-03-19
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عَدَم الصِّلَة / عَدَم العَلَاقَة) كلتاهما مُركَّبتان إضافيّتان وليستا مصطلحَيْن أُحاديَّيْ الكلمة؛ غياب المصطلح الأُحادي المُقنَّن."
      - "المجموعة تفتقر إلى المصطلح الحديث الموثَّق في المعاجم المعاصرة للمفهوم."
    observations: >
      المجموعة تمثّل مفهوماً مجرّداً هو انعدام الصلة بين شيء وموضوع ما.
      اللمّتان الموجودتان صحيحتان من حيث التشكيل والدلالة، غير أنهما
      عبارتان وصفيّتان إضافيّتان لا مصطلحَيْن مسكوكَيْن بمعنى أن
      إبدال «صلة» بـ«علاقة» أو العكس يُعطي نفس المعنى، مما يعني أنهما
      ليستا وحدتين معجميّتين ثابتتين تمام الثبوت. كلتاهما جائزة في الفصيح
      وشائعة في النصوص العلمية والصحفية. التعريف العربي الحالي واضح وصحيح
      لكن يمكن تحسين صياغته. الأجدر أن تُضاف إلى المجموعة لمّةٌ أُحادية
      مُقنَّنة موثَّقة في المعاجم الحديثة.

  blind_candidates:
    - lemma: "النُّبُوُّ"
      generation_method: majaz
      justification: >
        من نَبَا يَنبو = تجافى وتنحّى؛ يُقال نبا السيف عن الضريبة (لم يمضِ فيها)،
        ونبا فلان عن المكان (لم يوافقه). بتوسيع مجازي: نبوُّ الشيء عن الموضوع
        = عدم انتسابه إليه = اللاصلة. لفظ كلاسيكي أصيل يُحيى من موروث القاموس.
    - lemma: "الشُّرُودُ"
      generation_method: ishtiqaq
      justification: >
        من شَرَدَ يَشْرُد على وزن فُعُول (مصدر): الابتعاد والضلال.
        مجازاً: شرود الشيء عن الموضوع = عدم ارتباطه به = انعدام الصلة.
        موثّق في المعاجم الحديثة بمعان قريبة (شرود الذهن = عدم الانتباه).
    - lemma: "التَّنَافُرُ"
      generation_method: ishtiqaq
      justification: >
        من نَفَرَ على وزن تفاعُل: التباعد والتخالف. مجازاً: تنافر الشيء
        مع الموضوع = عدم انسجامه معه = كونه لا صلة له به.
        وزن التفاعل يُلائم المفاهيم الاشتراكية/التبادلية الدالة على عدم الانسجام.
    - lemma: "بُعْدُ الصِّلَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: بُعد + الصلة = بُعد الارتباط بالموضوع = اللاصلة.
        التعبير مستخدَم في النصوص العربية ووصفي ودقيق، ويؤدي معنى
        الإبعاد عن الموضوع بصورة مباشرة.


stage2_evidence:
  per_lemma:
    - lemma: "عَدَم الصِّلَة"
      evidence_status: "no_material_found"

    - lemma: "عَدَم العَلَاقَة"
      evidence_status: "no_material_found"

    - lemma: "النُّبُوُّ"
      expands:
        - text: >
            «النُّونُ وَالْبَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ
            يَدُلُّ عَلَى ارْتِفَاعٍ فِي الشَّيْءِ عَنْ غَيْرِهِ أَوْ
            تَنَحٍّ عَنْهُ. نَبَا السَّيْفُ عَنِ الضَّرِيبَةِ: تَجَافَى
            وَلَمْ يَمْضِ فِيهَا. وَنَبَا بِهِ مَنْزِلُهُ: لَمْ يُوَافِقْهُ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر نبو يدلّ على التجافي والتنحّي والعدم الانسجام مع الشيء،
            وهو الأساس المجازي لاستخدامه في معنى «اللاصلة».

    - lemma: "الشُّرُودُ"
      contradicts:
        - text: >
            «(الشرود) شرود الذِّهْن (في علم النفس) عدم الانتباه إلى الظروف
            المحيطة أو الملابسات الطارئة (مج)»
          source: "المعجم الوسيط لمجموعة من المؤلفين (مجمع اللغة العربية)"
          conflict: >
            الشرود في المعجم الوسيط محدود بمعنى «شرود الذهن» أي الغفلة وعدم
            الانتباه، وهو مختلف عن «انعدام الصلة» بين شيء وموضوع ما.

    - lemma: "التَّنَافُرُ"
      contradicts:
        - text: >
            «التنافر: في اللغة أصله التحاكم في الحسب ثم كثر حتى استُعمل في
            كل تحاكم. وعند أهل المعاني، وصف في الكلمة يوجب ثقلها على اللسان
            وعسر النطق بها كهعخع.»
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          conflict: >
            التنافر مصطلح بلاغي متخصص يعني الثقل الصوتي للحروف، لا انعدام
            الصلة الدلالية. جميع معاجم الاصطلاح تعرّفه في هذا الإطار الصوتي.
        - text: >
            «التنافر: إيراد الكلام على وجه لا يسهل على اللسان، إما لبعد شديد
            بين المخرجين أو لقرب بليغ بينهما.»
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
          conflict: >
            تعريف صوتي/بلاغي بحت لا علاقة له بمعنى «انعدام الصلة الموضوعية».

    - lemma: "بُعْدُ الصِّلَةِ"
      evidence_status: "no_material_found"

    - lemma: "اللَّاعَلَاقِيَّة"
      confirm:
        - text: >
            «(1) اللّاعَلاقيّة: كون الشيء غير متصل بالموضوع.
            (2) شيء لاعلاقيّ.»
          source: "المورد الحديث (2008) — Al-Mawrid Al-Hadeeth"
        - text: >
            «لاعلاقة؛ عدم الارتباط؛ اللاعلاقية»
          source: "موسوعة الكهرباء الدولية (IEC 60050 / Electropedia)"


stage3_analysis:
  per_lemma:
    - lemma: "عَدَم الصِّلَة"
      decision: confirmed
      decision_reason: >
        مُركَّب إضافي سليم يُعبّر مباشرة عن المفهوم ويشيع استخدامه في النثر العربي
        الفصيح والكتابة الأكاديمية والقانونية. لا تعارض في المعاجم، والتشكيل
        الموجود في المجموعة صحيح. يُكمل عَدَم العَلَاقَة دلاليّاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يستعمل لفظ «الصِّلَة» الذي يحمل معنى الرابط الخاص والوثيق؛ أنسب
        للسياقات التي تُؤكَّد فيها غياب الاتصال الحيّ المباشر بين الشيء
        وجوهر الموضوع. أكثر شيوعاً في اللغة الصحفية والحوارية.

    - lemma: "عَدَم العَلَاقَة"
      decision: confirmed
      decision_reason: >
        مُركَّب إضافي فصيح يُعبّر عن المفهوم بلفظ «العَلَاقَة» ذي الدلالة
        الأوسع (الارتباط الدلالي/المنطقي العام). شائع في الكتابة العلمية
        والقانونية والتحليلية. التشكيل الموجود صحيح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يستعمل «العَلَاقَة» بمعناها الأشمل للارتباط الدلالي؛ أنسب للسياقات
        المنطقية والنقدية التي تُقيَّم فيها الصلة بين المقدمات والنتائج
        أو بين الدليل والموضوع. يُستخدم في التقارير القانونية والمنطقية.

    - lemma: "النُّبُوُّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ثراء الجذر الكلاسيكي (نبا = تجافى وتنحّى)، لا توجد شواهد على
        استخدام «النُّبُوّ» مصطلحاً معجمياً ثابتاً للدلالة على «انعدام الصلة
        الموضوعية»؛ الإزاحة الدلالية مقبولة نظرياً لكنها غير معزَّزة بتوثيق
        معجمي حديث، مما يجعل المصطلح مُبهماً على غير المتخصصين.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "الشُّرُودُ"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الوسيط يُقيّد «الشرود» بـ«شرود الذهن» في علم النفس (= عدم الانتباه
        للمحيط)؛ هذا المعنى مختلف جذرياً عن «انعدام الصلة» بين شيء وموضوع ما.
        استخدامه هنا سيُوقع في التباس مرفوض.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "التَّنَافُرُ"
      source: stage1
      decision: removed
      decision_reason: >
        مصطلح بلاغي راسخ يعني الثقل الصوتي للحروف (phonetic dissonance)؛
        جميع معاجم الاصطلاح من السيوطي إلى التهانوي تُعرّفه في هذا الإطار.
        استخدامه بمعنى «انعدام الصلة» ينقض اصطلاحاً بلاغياً راسخاً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "بُعْدُ الصِّلَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: إبدال «صلة» بـ«علاقة» أو «ارتباط» يُعطي
        تعبيراً مساوياً له (بعد العلاقة، بعد الارتباط)، مما يُثبت أنه تعبير
        وصفي حرّ لا مركَّب اصطلاحي ثابت. لا شواهد مُدوَّنة عليه كمدخل معجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "اللَّاعَلَاقِيَّة"
      decision: confirmed
      decision_reason: >
        موثَّقة في المورد الحديث (2008) بالتعريف الدقيق «كون الشيء غير متصل
        بالموضوع» مع translation_en: irrelevance. واردة أيضاً في موسوعة
        الكهرباء الدولية (IEC 60050). مصطلح أُحادي الكلمة على النمط
        الإنتاجي العربي (لا + علاقة + ية) مضطرد قياساً على: اللامركزية،
        اللامادية، اللاسلكية. يُكمل المجموعة بمصطلح مُقنَّن مُختزَل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح المُقنَّن أُحادي الكلمة المُوثَّق في المعاجم الحديثة؛ أنسب
        للكتابة العلمية والتقنية والترجمة المتخصصة حيث يُفضَّل الاختزال.
        يعمل اسماً للمفهوم المجرد بينما «عدم الصلة/العلاقة» يعملان وصفاً
        أو تقريراً لحالة بعينها.
      actions:
        - command: create_entry
          params:
            lemma: "اللَّاعَلَاقِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13818046-n"


