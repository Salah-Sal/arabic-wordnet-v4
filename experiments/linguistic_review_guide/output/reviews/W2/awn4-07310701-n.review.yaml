stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'حدث لمرة واحدة' هي عبارة وصفية وليست لمة معجمية موجزة."
      - "نقص في الألفاظ المفردة التي تعبر عن هذا المفهوم في الاستخدام الحديث."
    observations: "المفهوم يشير إلى الحدث الذي لا يتكرر، وهناك عدة ألفاظ في العربية تعبر عن هذا المعنى سواء من حيث كونه بدعاً (غير مسبوق) أو فلتة (استثنائي عابر) أو حالة فريدة."
  blind_candidates:
    - lemma: "بِدْع"
      generation_method: ishtiqaq
      justification: "لفظ عربي فصيح يدل على الأمر الذي يفعل للمرة الأولى ولا نظير له."
    - lemma: "فَلْتَة"
      generation_method: majaz
      justification: "تُستخدم للإشارة إلى الشيء الاستثنائي الذي يقع مرة واحدة."
    - lemma: "نَادِرَة"
      generation_method: ishtiqaq
      justification: "الشيء النادر الذي يقل وقوعه أو ينفرد به زمانه."
    - lemma: "حَالَةٌ فَرِيدَة"
      generation_method: tarkib
      justification: "تعبير وصفي شائع في العصر الحديث للإشارة إلى الـ one-off."

stage2_evidence:
  per_lemma:
    - lemma: "بِدْع"
      confirm:
        - text: "«البِدْعُ: الأوَّلُ في كُل أمْرٍ... والأمر يفعل للمرة الأولى»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«بِدْع: مُحْدَث جديد يُفْعَل لأول مرة»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "فَلْتَة"
      confirm:
        - text: "«الفَلْتَةُ: الأَمْرُ يحدث من غير رويَّة وإحكام»"
          source: "المعجم الوسيط"
      expands:
        - text: "«كان فلتة زمانه: كان حاذقًا موهوبًا متمّيزًا»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "تشير إلى التميز والفرادة."
    - lemma: "حَالَةٌ فَرِيدَة"
      confirm:
        - text: "«فَرِيد: بمعنى النفيس من الأشياء والجوهرة النفيسة، والمنفرد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      evidence_status: "no_material_found"
    - lemma: "حدث لمرة واحدة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "حدث لمرة واحدة"
      decision: confirmed
      decision_reason: "على الرغم من طولها، إلا أنها اللمة الأكثر وضوحاً وشيوعاً في التعبير عن المفهوم حالياً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَدَثٌ لِمَرَّةٍ وَاحِدَة"
    - lemma: "بِدْع"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل يعبر بدقة عن الشيء الذي يقع لأول مرة ولا نظير له."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بِدْع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فَلْتَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبر عن الحدث الاستثنائي الذي يقع مرة واحدة بشكل مفاجئ أو غير متكرر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "فَلْتَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "حَالَةٌ فَرِيدَة"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير حديث دقيق الاستخدام في السياقات الإدارية والمالية والاجتماعية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "حَالَةٌ فَرِيدَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "حدث يقع مرة واحدة فقط ولا يتكرر"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يحتاج إلى صياغة أكثر دقة وملاءمة للأسلوب المعجمي."
    authored:
      - type: terminological
        text: "حَدَثٌ يَقَعُ لِمرَّةٍ واحِدةٍ فقَط ولا يُتَوقَّعُ تِكرارُه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "واقعةٌ فَرِيدةٌ لا نَظِيرَ لها في سِياقِها، تُستخدَمُ غالِبًا في مَجالِ الأعمالِ أو الأحداثِ الاسْتِثنائيَّةِ للتعبير عن الشيء المبتدع الذي لا يتكرر."
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "حَدَثٌ يَقَعُ لِمرَّةٍ واحِدةٍ فقَط ولا يُتَوقَّعُ تِكرارُه."}
      - command: add_definition
        params: {synset_id: "{synset_id}", text: "واقعةٌ فَرِيدةٌ لا نَظِيرَ لها في سِياقِها، تُستخدَمُ غالِبًا في مَجالِ الأعمالِ أو الأحداثِ الاسْتِثنائيَّةِ للتعبير عن الشيء المبتدع الذي لا يتكرر."}
  examples:
    per_lemma:
      - lemma: "حَدَثٌ لِمَرَّةٍ وَاحِدَة"
        examples:
          - text: "كانت هذه المسابقة حدثاً لمرة واحدة بمناسبة اليوبيل الذهبي."
            type: usage
      - lemma: "بِدْع"
        examples:
          - text: "هذا العرض الفني بِدْعٌ لم يسبق له مثيل في تاريخ المهرجان."
            type: usage
      - lemma: "فَلْتَة"
        examples:
          - text: "لم يكن الفوز بمحض الصدفة، بل كان فَلْتَةً نادرة في مسيرته الرياضية."
            type: usage
      - lemma: "حَالَةٌ فَرِيدَة"
        examples:
          - text: "تعتبر هذه الاتفاقية حالة فريدة لن تتكرر في ظل الظروف الراهنة."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "بِدْع"
      entry_id: "{auto}"
      root: "بدع"
      maqayis_quote: "«الْبَاءُ وَالدَّالُ وَالْعَيْنُ أَصْلَانِ: أَحَدُهُمَا ابْتِدَاءُ الشَّيْءِ وَصُنْعُهُ لَا عَنْ مِثَالٍ، وَالْآخَرُ الِانْقِطَاعُ والْكَلَالُ.»"
    - lemma: "فَلْتَة"
      entry_id: "{auto}"
      root: "فلت"
      maqayis_quote: "«الْفَاءُ وَاللَّامُ وَالتَّاءُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى تَخَلُّصٍ فِي سُرْعَةٍ. وَكَانَ ذَلِكَ الْأَمْرُ فَلْتَةً، إِذَا لَمْ يَكُنْ عَنْ تَدَبُّرٍ وَلَا رَأْيٍ وَلَا تَرَدُّدٍ.»"
    - lemma: "حَالَةٌ فَرِيدَة"
      entry_id: "{auto}"
      roots:
        - word: "حالة"
          root: "حول"
          maqayis_quote: "«الْحَاءُ وَالْوَاوُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ تَحَرُّكٌ فِي دَوْرٍ... وَكَذَلِكَ كُلُّ مُتَحَوِّلٍ عَنْ حَالَةٍ.»"
        - word: "فريدة"
          root: "فرد"
          maqayis_quote: "«الْفَاءُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى وُحْدَةٍ. مِنْ ذَلِكَ الْفَرْدُ وَهُوَ الْوَتْرُ.»"
  per_sense:
    - lemma: "حَدَثٌ لِمَرَّةٍ وَاحِدَة"
      sense_id: "{auto}"
      nuance: "تعبير وصفي مباشر وشائع في الاستخدام المعاصر."
      mwe: true
    - lemma: "بِدْع"
      sense_id: "{auto}"
      nuance: "يؤكد على كون الشيء غير مسبوق ومبتدئاً لا عن مثال."
      mwe: false
    - lemma: "فَلْتَة"
      sense_id: "{auto}"
      nuance: "يركز على الجانب الاستثنائي أو المفاجئ أو العابر للحدث."
      mwe: false
    - lemma: "حَالَةٌ فَرِيدَة"
      sense_id: "{auto}"
      nuance: "تعبير اصطلاحي حديث للتركيز على انفراد الحالة بخصائصها."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"بدع","maqayis":"«الْبَاءُ وَالدَّالُ وَالْعَيْنُ أَصْلَانِ: أَحَدُهُمَا ابْتِدَاءُ الشَّيْءِ وَصُنْعُهُ لَا عَنْ مِثَالٍ...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"فلت","maqayis":"«الْفَاءُ وَاللَّامُ وَالتَّاءُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى تَخَلُّصٍ فِي سُرْعَةٍ. وَكَانَ ذَلِكَ الْأَمْرُ فَلْتَةً...»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"حالة","root":"حول","maqayis":"«...»"},{"word":"فريدة","root":"فرد","maqayis":"«...»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبير وصفي مباشر وشائع في الاستخدام المعاصر.","mwe":true}'
    - command: set_metadata
