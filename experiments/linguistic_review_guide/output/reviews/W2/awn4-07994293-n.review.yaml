stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يركز على كونها مجموعة (collection)، بينما اللفظ 'مكتبة' في العربية يشترك فيه المكان (building) والمجموعة."
    observations: "اللفظ 'مكتبة' هو الأكثر شيوعاً، ولكن هناك مرادفات تراثية ومتخصصة مثل 'خزانة' و'خزانة كتب' تدعم المعنى الدلالي للمجموعة (collection) بشكل قوي."
  blind_candidates:
    - lemma: "مَكْتَبَة"
      generation_method: ishtiqaq
      justification: "اسم مكان من الجذر 'كتب' شاع استخدامه للدلالة على مجموعة الكتب المحفوظة."
    - lemma: "خِزَانَة"
      generation_method: majaz
      justification: "لفظ تراثي يطلق على مكان حفظ الكتب ومجموعتها، مستمد من الصيانة (خزن)."
    - lemma: "خِزَانَةُ كُتُب"
      generation_method: tarkib
      justification: "تعبير إضافي يخصص الخزانة بمحتوى الكتب، وهو شائع في المجموعات الخاصة."
    - lemma: "رَصِيدٌ مَكْتَبِيّ"
      generation_method: tarkib
      justification: "تعبير فني حديث يطلق على مجموع مقتنيات المكتبة من كتب ووثائق."

stage2_evidence:
  per_lemma:
    - lemma: "مكتبة"
      confirm:
        - text: "«المكتبة: مكان بيع الكتب والأدوات الكتابية ومكان جمعها وحفظها»"
          source: "المعجم الوسيط"
        - text: "«مكان مخصص لحفظ الوثائق أو الكتب المختلفة قصد استعمالها وتوظيفها...»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي"
    - lemma: "خِزَانَة"
      confirm:
        - text: "«خزانة الكتب، أو المكتبة: مجموعة المؤلفات في موضوع واحد، وقد تأتي بمعنى دار الكتب»"
          source: "المعجم الكبير"
        - text: "«مجمع تخزين للكتب العامة والمختصة، وهو رافد أساسي لتقصي الموروث والمستحدث ويتخذ شكل خزانة وطنية وخزانة شخصية»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
    - lemma: "خِزَانَةُ كُتُب"
      confirm:
        - text: "«خزانة الكتب، أو المكتبة: مجموعة المؤلفات في موضوع واحد»"
          source: "المعجم الكبير"
    - lemma: "رَصِيدٌ مَكْتَبِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مكتبة"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والمحوري للمجموعة الترادفية، وهو يغطي معنى المجموعة والمكان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَكْتَبَة"
    - lemma: "خِزَانَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ أصيل مدعوم في المعاجم الكبرى والمتخصصة (اللسانيات) كمترادف للمكتبة بمعنى المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خِزَانَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خِزَانَةُ كُتُب"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير مركب ثابت وشائع جداً، وورد ذكره صراحة في المعجم الكبير كتعريف للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "خِزَانَةُ كُتُب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "رَصِيدٌ مَكْتَبِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم صحته دلالياً في السياق الفني، إلا أنه لا يرقى ليكون وحدة معجمية (مصطلحاً مسكوكاً) في المعاجم اللغوية العامة لهذه المجموعة."

stage4_content:
  definition:
    current: "مجموعة من الوثائق الأدبية أو السجلات المحفوظة للمرجعية أو الاستعارة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتاج إلى صياغة أكثر دقة وشمولية لتشمل الكتب، ولتكون بأسلوب المعاجم العربية الأصيلة."
    authored:
      - type: terminological
        text: "مَجْموعَةٌ مُنَظَّمَةٌ مِنَ الكُتُبِ أَوِ الوَثائِقِ أَوِ السِّجِلَّاتِ المَحْفوظَةِ لِلْمُطالَعَةِ أَوِ المَرْجِعِيَّةِ أَوِ الِاسْتِعارَة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "مَجْموعَةٌ مُنَظَّمَةٌ مِنَ الكُتُبِ أَوِ الوَثائِقِ أَوِ السِّجِلَّاتِ المَحْفوظَةِ لِلْمُطالَعَةِ أَوِ المَرْجِعِيَّةِ أَوِ الِاسْتِعارَة."}
  examples:
    per_lemma:
      - lemma: "مَكْتَبَة"
        examples:
          - text: "تَمْتَلِكُ المَدْرَسَةُ مَكْتَبَةً ثَرِيَّةً بِالمَصادِرِ العِلْمِيَّة."
            type: usage
      - lemma: "خِزَانَة"
        examples:
          - text: "وَرِثَ الباحِثُ عَنْ أَبيهِ خِزانَةً نادِرَةً مِنَ المَخْطوطات."
            type: usage
      - lemma: "خِزَانَةُ كُتُب"
        examples:
          - text: "رَتَّبَ الطّالِبُ خِزانَةَ كُتُبِهِ حَسَبَ المَوْضوعات."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "أَوْصى العالِمُ بِنَقْلِ مَكْتَبَتِهِ الخاصَّةِ إِلى الجامِعَة."}

