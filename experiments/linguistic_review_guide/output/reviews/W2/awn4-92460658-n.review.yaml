stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "لُغَةٌ أَرْغَاتِيفِيَّة"
      decision: removed
      decision_reason: >
        صيغة تعريب غير معتمدة في المعجم الموحّد لمصطلحات اللسانيات الصادر عن أليكسو (٢٠٠٢)
        الذي يعتمد «إِرْكَاتِيّ» لا «أرغاتيفي». الصيغة «أرغاتيفية» أقرب إلى النقل الصوتي
        الفرنسي/الإنجليزي الحرفي ولم تُسجَّل في أي معجم متخصص. يُستبدل بالصيغة المعيارية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "لُغَةٌ فَاعِلِيَّة-مَفْعُولِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح وصفي عربي صرف يعكس البنية المفهومية للنمط اللغوي الإركاتي:
        اللغة التي تعامل فاعل اللازم (الفاعلية) والمفعول به (المفعولية) معاملة واحدة إعرابياً.
        المكونان «فاعلية» و«مفعولية» مسجّلان في المعجم الوسيط. المركب وصفي ثابت
        في الأدبيات اللسانية العربية ويُفضَّل لتوافقه مع مبدأ إيثار العربي.
        يُصحَّح التشكيل ويُزال الواصلة لتصبح الصيغة نظامية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مصطلح وصفي تحليلي يكشف البنية الداخلية للمفهوم (فاعلية + مفعولية)
        ويناسب السياقات التعليمية والشروحات التي تحتاج إلى شفافية اصطلاحية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُغَةٌ فَاعِلِيَّة مَفْعُولِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لُغَةٌ إِرْكَاتِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        الصيغة المعتمدة في المعجم الموحد لمصطلحات اللسانيات (أليكسو ٢٠٠٢) هي «إِرْكَاتِيّ»
        ترجمةً لـ «ergative». هذه الصيغة مسجّلة رسمياً ومعرَّفة تعريفاً دقيقاً يتّفق مع دلالة المجموعة.
        تُضاف كلمّة رئيسية بديلة عن «أرغاتيفية» المحذوفة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مصطلح معرَّب رسمي معتمد من أليكسو، أكثر تداولاً في الأدبيات المتخصصة
        والمعاجم الاصطلاحية، ويناسب السياقات الأكاديمية والبحثية.
      actions:
        - command: create_entry
          params:
            lemma: "لُغَةٌ إِرْكَاتِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "لُغَةٌ مُطْلَقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية على استخدام هذا المصطلح. كما أن «المطلقية» تشير إلى الحالة
        المطلقة (absolutive) وهي حالة إعرابية وليست نمطاً لغوياً كاملاً. التسمية مضلّلة
        لأنها تصف جزءاً من النظام لا النظام كله.

    - lemma: "لُغَةُ التَّطَابُقِ العَكْسِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ وليس مصطلحاً مسكوكاً. يفشل في اختبار السكّ: يمكن إبدال
        «التطابق» بـ«التوافق» أو «المطابقة» والعبارة تظلّ صالحة كوصف.
        لا توجد أدلة معجمية على تثبيته.

    - lemma: "لُغَةُ الإِعْرَابِ المُنْعَكِس"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ كسابقه. لا يرقى إلى مصطلح مسكوك ولا توجد أدلة معجمية
        على استخدامه في الأدبيات اللسانية.


stage4_content:
  definition:
    current: "نوع من اللغات يحتوي على حالة أرغاتيفية أو يكون فيها المفعول به للفعل المتعدي له نفس شكل فاعل الفعل اللازم"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يستخدم «أرغاتيفية» وهي صيغة غير معتمدة حُذفت من المجموعة.
        كما أنه يخلط بين الصياغة التعريفية والوصفية ويفتقر إلى الدقة الاصطلاحية
        في التمييز بين اللغة الإركاتية واللغات الأخرى.
    authored:
      - type: terminological
        text: "لُغَةٌ يُعامَلُ فيها فاعلُ الفعلِ اللازمِ ومفعولُ الفعلِ المتعدِّي مُعاملةً إعرابيَّةً واحدةً (الحالة المُطلَقة)، بينما يأخذُ فاعلُ المتعدِّي علامةً إعرابيَّةً مُستقلَّةً (الحالة الإركاتيَّة)."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "نمطٌ من أنماطِ اللُّغاتِ في التصنيفِ النَّمَطيِّ اللُّغَوِيّ، تتميَّزُ فيه اللُّغَةُ بنظامِ إعرابٍ يَجعلُ الاسمَ المُسنَدَ إليه في الجملةِ اللازمةِ والاسمَ الواقعَ عليه فعلُ الجملةِ المتعدِّيةِ في حالةٍ إعرابيَّةٍ واحدةٍ تُسمَّى الحالةَ المُطلَقةَ، ويُفرِدُ لفاعلِ الفعلِ المتعدِّي حالةً خاصَّةً تُسمَّى الحالةَ الإركاتيَّةَ. ومن أمثلةِ هذه اللُّغاتِ: الباسكيَّةُ والجورجيَّةُ وعددٌ من لُغاتِ الأستراليِّين الأصليِّين."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "لُغَةٌ يُعامَلُ فيها فاعلُ الفعلِ اللازمِ ومفعولُ الفعلِ المتعدِّي مُعاملةً إعرابيَّةً واحدةً (الحالة المُطلَقة)، بينما يأخذُ فاعلُ المتعدِّي علامةً إعرابيَّةً مُستقلَّةً (الحالة الإركاتيَّة)."

  examples:
