# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92460658-n (ergative language)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «لغة أرغاتيفية» تستخدم صيغة تعريب غير موحّدة؛ المعجم الموحّد لمصطلحات اللسانيات (٢٠٠٢) يعتمد «إركاتي» لا «أرغاتيفي»"
      - "اللمّة «لغة فاعلية-مفعولية» تتضمّن واصلة (-) وهي صيغة غير معتادة معجمياً؛ الأولى استخدام مركب إضافي أو وصفي بدون واصلة"
      - "التعريف العربي يحتوي على كلمة «أرغاتيفية» المعرَّبة نفسها داخل النص التعريفي مما يُحدث دوراً جزئياً"
      - "لا يوجد مُعرِّف ILI مما يعني أن المجموعة مضافة محلياً ولا ترتبط بالشبكة العالمية"
    observations: >
      المفهوم ينتمي إلى نمطية اللغات (language typology) ويصف اللغات التي تعامل فاعلَ الفعل اللازم كالمفعول به
      للفعل المتعدي في الإعراب (المحور المطلقي)، بخلاف اللغات الفاعلية-المفعولية (nominative-accusative).
      هذا مصطلح تقني لساني متخصص، والتعريب هو المنهج الغالب عالمياً لنقل المصطلح «ergative».
      المعجم الموحّد لمصطلحات اللسانيات الصادر عن المنظمة العربية للتربية والثقافة والعلوم (٢٠٠٢)
      اعتمد الصيغة «إِرْكَاتِيّ» تعريباً للمصطلح الإنجليزي.
  blind_candidates:
    - lemma: "لُغَةٌ إِرْكَاتِيَّة"
      generation_method: taarib
      justification: >
        تعريب المصطلح اللساني الإنجليزي «ergative» بالصيغة المعتمدة في المعجم الموحّد لمصطلحات
        اللسانيات الصادر عن أليكسو (٢٠٠٢) على وزن إِفْعَالِيّ، مع إلحاق تاء التأنيث لتوافق الموصوف «لغة».
    - lemma: "لُغَةٌ مُطْلَقِيَّة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من مصطلح «الحالة المُطلَقة» (absolutive case)، وهي الحالة الإعرابية المقابلة
        للإركاتية في هذا النمط اللغوي؛ فاللغة الإركاتية تتميّز بمحورها المطلقي.
        على وزن مُفْعَلِيَّة بإلحاق ياء النسبة والمصدر الصناعي.
    - lemma: "لُغَةُ التَّطَابُقِ العَكْسِيّ"
      generation_method: tarkib
      justification: >
        مركب إضافي-وصفي يصف السمة الجوهرية لهذا النمط اللغوي: عكس نظام المطابقة
        المألوف في اللغات الفاعلية-المفعولية. لكنه وصفي أكثر من كونه مصطلحاً مسكوكاً.
    - lemma: "لُغَةُ الإِعْرَابِ المُنْعَكِس"
      generation_method: tarkib
      justification: >
        مركب إضافي-وصفي يشير إلى انعكاس نظام الإعراب بين الفاعل والمفعول
        في هذا النمط اللغوي. تعبير وصفي لا يرقى إلى مصطلح مسكوك.


