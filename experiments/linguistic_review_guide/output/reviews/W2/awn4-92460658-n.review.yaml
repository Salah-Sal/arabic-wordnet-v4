        examples:
          - text: "تُعَدُّ اللُّغَةُ الباسكيَّةُ من أبرزِ الأمثلةِ على اللُّغاتِ الإركاتيَّةِ في أوروبّا."
            type: usage
      - lemma: "لُغَةٌ فَاعِلِيَّة مَفْعُولِيَّة"
        examples:
          - text: "يُصنِّفُ اللِّسانيُّون اللُّغاتِ بحسبِ نظامِ الإعرابِ إلى لُغاتٍ فاعليَّةٍ مفعوليَّةٍ ولُغاتٍ رَفْعيَّةٍ نَصْبيَّة."
            type: usage
