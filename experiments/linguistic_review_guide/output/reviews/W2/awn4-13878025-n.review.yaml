# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13878025-n
# flip side — الوَجْه الآخَر
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (الوَجْه الآخَر)، وهي تعبير مركب إضافي-وصفي"
      - "التعريف العربي الحالي يبدو ترجمة شبه حرفية من الإنجليزية"
      - "المفهوم مجازي بطبيعته (الجانب الآخر/المعاكس من أمرٍ ما) وقد يصعب إيجاد مفردة عربية واحدة تؤدّيه"
    observations: "المفهوم يندرج تحت المُتَضادّات (hypernym: تَضَادّ/تَعَارُض)، ويدلّ على الجانب المغاير أو المقابل من أيّ شيء، وخاصة الجانب المعاكس. هو مفهوم مجازي شائع الاستعمال في العربية المعاصرة في تعبيرات مثل «الوجه الآخر للعملة». اللمّة المركبة تحتاج فحص ثبات معجمي."
  blind_candidates:
    - lemma: "نَقِيض"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (نقض) على وزن فَعِيل بمعنى المفعول، يدلّ على ما يُناقض الشيء ويُقابله. شائع في الاستعمال الفصيح للدلالة على الطرف المعاكس."
    - lemma: "الوَجْهُ المُقَابِلُ"
      generation_method: tarkib
      justification: "تركيب وصفي من (وجه) و(مقابل)، يدلّ على الجانب الذي يُواجه الجانب الأصلي، أي الجانب الآخر أو المعاكس."
    - lemma: "ظَهْر"
      generation_method: majaz
      justification: "مجاز مرسل بعلاقة المجاورة: ظهر الشيء هو جانبه الخلفي المقابل لوجهه، فيُستعمل للدلالة على الجانب الآخر المغاير."
    - lemma: "عَكْس"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (عكس) على وزن فَعْل (مصدر)، يدلّ على ردّ الشيء إلى ضدّه أو قلبه. يُستعمل للدلالة على الجانب المضادّ."

stage2_evidence:
  per_lemma:
    - lemma: "الوَجْه الآخَر"
      confirm:
        - text: "«الوجه: «أ» وجه [العملة أو المدالية إلخ]. «ب» وجه الشيء. «ج» الجانب أو المظهر الآخر، الأكثر وضوحًا، من حقيقةٍ ما إلخ.»"
          source: "المورد الحديث (2008) — مدخل obverse"
        - text: "«الوَجْهُ — من البيت: الجانب الذي يكون فيه بابه. من المسأَلة: ما ظهر لك منها. الجهة والناحية. النَّوع والقِسْم»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(وَجَهَ) الْوَاوُ وَالْجِيمُ وَالْهَاءُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُقَابَلَةٍ لِشَيْءٍ. وَالْوَجْهُ مُسْتَقْبِلٌ لِكُلِّ شَيْءٍ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (وجه) أصله المقابلة، مما يدعم استعمال (الوجه) بمعنى الجانب المقابل"

    - lemma: "نَقِيض"
      confirm:
        - text: "«الضِّدّ؛ النقيض»"
          source: "المورد الحديث (2008) — مدخل opposite"
      contradicts:
        - text: "«نقيض كل شيء: رفع تلك القضية، فإذا قلنا: كل إنسان حيوان بالضرورة، فنقيضها: أنه ليس كذلك.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "النقيض في الاصطلاح الكلاسيكي خاص بالمنطق (رفع القضية)، وليس بمعنى الجانب الآخر من شيء"
      expands:
        - text: "«(نَقَضَ) النُّونُ وَالْقَافُ وَالضَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نَكْثِ شَيْءٍ... وَالنَّقِيضُ: الْمَنْقُوضُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل في الجذر النكث والهدم، لا المقابلة أو التعاكس"

    - lemma: "الوَجْهُ المُقَابِلُ"
      evidence_status: "no_material_found"

    - lemma: "ظَهْر"
      confirm:
        - text: "«الظَّهر؛ القفا: الجزء الخلفيّ من شيء»"
          source: "المورد الحديث (2008) — مدخل reverse"
      contradicts:
        - text: "«ظَهْر الورقة، صفحة يُمنى — في المؤلفات أو الصحف المكتوبة بالعربية»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          conflict: "ظهر يدلّ على الجانب المادي الخلفي (verso)، لا على الجانب المجرد المغاير"

    - lemma: "عَكْس"
      confirm:
        - text: "«الضدّ؛ العكس؛ النقيض»"
          source: "المورد الحديث (2008) — مدخل reverse"
      contradicts:
        - text: "«العكس: رد الشيء إلى سننه أي طريقه الأول كعكس المرآة إذا ردت بصرك بصفائها إلى وجهك بنور عينك. وفي عرف الأصوليين: انتفاء الحكم لانتفاء العلة.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "العكس في أصله ردّ الشيء إلى أصله أو قلبه، وهو أعمّ من مفهوم الجانب الآخر"

stage3_analysis:
  per_lemma:
    - lemma: "الوَجْه الآخَر"
      decision: confirmed
      decision_reason: "تعبير عربي مسكوك شائع الاستعمال بمعنى الجانب المغاير أو المقابل من أمرٍ ما. ورد في المورد الحديث في مدخل obverse بمعنى «الجانب أو المظهر الآخر من حقيقةٍ ما». وهو تعبير مركب إضافي-وصفي ثابت معجمياً (الوجه الآخر للعملة، الوجه الآخر للحقيقة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الوَجْهُ الآخَرُ"

    - lemma: "نَقِيض"
      source: stage1
      decision: removed
      decision_reason: "النقيض في الاستعمال الكلاسيكي مصطلح منطقي (رفع القضية)، وفي المعاصر يدلّ على الضدّ المطلق. المفهوم المراد هنا ليس الضدّ بل الجانب المغاير، وقد يكون مكمّلاً لا مناقضاً. فالنقيض أضيق دلالياً من flip side."

    - lemma: "الوَجْهُ المُقَابِلُ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على دليل معجمي يُثبت هذا التركيب كوحدة معجمية ثابتة. يفشل في اختبار السكّ: يمكن إبدال (المقابل) بـ(المواجه) أو (المضادّ) والتعبير يبقى وصفاً حراً، مما يدلّ على أنه ليس مصطلحاً مسكوكاً."

    - lemma: "ظَهْر"
      source: stage1
      decision: removed
      decision_reason: "ظهر يدلّ على الجانب المادي الخلفي (verso/back) لا على المعنى المجرد للجانب المغاير. دلالته حسّية مكانية، بينما المفهوم المراد مجرّد يتعلق بجوانب الأشياء المعنوية."

    - lemma: "عَكْس"
      source: stage1
      decision: removed
      decision_reason: "العكس أعمّ بكثير من المفهوم المراد؛ فهو يشمل القلب والردّ والانعكاس، بينما flip side يختصّ بالجانب المغاير من شيء واحد. كما أن العكس يرتبط بالعلاقة المنطقية/الرياضية (converse) أكثر من الدلالة على وجه مقابل."

