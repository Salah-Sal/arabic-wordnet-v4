    - lemma: "قَرْن"
      entry_id: "{auto}"
      root: "قرن"
      maqayis_quote: "«الْقَافُ وَالرَّاءُ وَالنُّونُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى جَمْعِ شَيْءٍ إِلَى شَيْءٍ...»"
    - lemma: "أَقْرَان"
      entry_id: "{auto}"
      root: "قرن"
      maqayis_quote: "«الْقَافُ وَالرَّاءُ وَالنُّونُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى جَمْعِ شَيْءٍ إِلَى شَيْءٍ...»"
    - lemma: "أَتْرَاب"
      entry_id: "{auto}"
      root: "ترب"
      maqayis_quote: "«التَّاءُ وَالرَّاءُ وَالْبَاءُ أَصْلَانِ: أَحَدُهُمَا التُّرَابُ وَمَا يُشْتَقُّ مِنْهُ، وَالْآخَرُ تَسَاوِي الشَّيْئَيْنِ... وَأَمَّا الْآخَرُ فَالتِّرْبُ الْخِدْنُ، وَالْجَمْعُ أَتْرَابٌ.»"
    - lemma: "لِدَات"
      entry_id: "{auto}"
      root: "ولد"
      maqayis_quote: "«الْوَاوُ وَاللَّامُ وَالدَّالُ: أَصْلٌ صَحِيحٌ، وَهُوَ دَلِيلُ النَّجْلِ وَالنَّسْلِ... وَاللِّدَةُ نُقْصَانُهُ الْوَاوُ لِأَنَّ أَصْلَهُ وِلْدَةٌ.»"
  per_sense:
    - lemma: "جِيل"
      sense_id: "{auto}"
      nuance: "يركز على المفهوم الزمني للأمة أو المجموعة التي تعيش في حقبة واحدة."
      mwe: false
    - lemma: "مُعَاصِرُون"
