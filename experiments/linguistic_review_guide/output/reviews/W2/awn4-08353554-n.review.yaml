stage1_review:
  assessment:
    concerns:
      - "الاعتماد على المعرّب (ريبرتوار) وعلى مركب وصفي (ذخيرة فنية) لغياب مصطلح مفرد أصيل مسكوك في المعاجم القديمة."
    observations: "المفهوم يشير إلى مخزون الأعمال الجاهزة للأداء لفرقة ما. وقد استخدمت المعاجم الحديثة مصطلح (ذخيرة) وحده للتعبير عن هذا المفهوم مجازيا من ذخر الشيء أي حفظه."
  blind_candidates:
    - lemma: "ذَخِيرَة"
      generation_method: majaz
      justification: "استخدام مجازي لكلمة ذخيرة (ما يدخر) للدلالة على مخزون الأعمال الفنية المحفوظة، وهو استخدام موثق في بعض المعاجم الحديثة."
    - lemma: "ذَخِيرَة فَنِّيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يزيل لبس المجاز عن كلمة ذخيرة ويخصصها بالمجال الفني."
    - lemma: "رِيبِرْتُوَار"
      generation_method: taarib
      justification: "المصطلح الأجنبي المباشر الذي غلب استخدامه في الأوساط النقدية والفنية العربية لغياب مرادف دقيق قديم."
    - lemma: "مَخْزُون فَنِّي"
      generation_method: tarkib
      justification: "مركب يعبر عن دلالة الحفظ والجمع للأعمال، لكنه أقل اصطلاحية."

stage2_evidence:
  per_lemma:
    - lemma: "ذَخِيرَة"
      confirm:
        - text: "«الذَّخيرة: «أ» مجموعة من المسرحيات والأدوار والألحان التي تدرَّبت عليها فرقة أو ممثِّل أو مغنٍّ أو موسيقي والتي يكون الموسيقي أو المغني أو الممثل أو الفرقة على استعداد لتقديمها أو أدائها.»"
          source: "المورد الحديث (2008)"
    - lemma: "ذَخِيرَة فَنِّيَّة"
      expands:
        - text: "«الذَّخيرة: «أ» مجموعة من المسرحيات والأدوار والألحان التي تدرَّبت عليها فرقة...»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد المعنى المخصص للذخيرة في السياق الفني، مما يدعم صحة التركيب الوصفي لزيادة التخصيص."
    - lemma: "رِيبِرْتُوَار"
      evidence_status: "no_material_found"
    - lemma: "مَخْزُون فَنِّي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "ذَخِيرَة فَنِّيَّة"
      decision: confirmed
      decision_reason: "مركب وصفي شائع ومفهوم للدلالة على الريبرتوار، يزيل أي غموض عن كلمة ذخيرة بمفردها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ذَخِيرَة فَنِّيَّة"
    - lemma: "رِيبِرْتُوَار"
      decision: confirmed
      decision_reason: "مصطلح معرّب واسع الانتشار جداً في الاستخدام المتخصص الأكاديمي والنقدي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِيبِرْتُوَار"
    - lemma: "ذَخِيرَة"
      source: stage1
      decision: confirmed
      decision_reason: "موثق معجمياً بشكل قاطع بهذا المعنى في القواميس ثنائية اللغة الحديثة، وهو مجاز سليم ذائع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "ذَخِيرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مَخْزُون فَنِّي"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي غير مسكوك اصطلاحياً مقارنة بغيره."

stage4_content:
  definition:
    current: "مجموعة من الأعمال (مسرحيات، أغاني، أوبرا، باليه) يمكن لفنان أو فرقة أداؤها ويقومون بأدائها لفترات قصيرة وفق جدول منتظم"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو مترجماً حرفياً بعض الشيء وركيكاً في صياغته (ويمكن لفنان أداؤها ويقومون بأدائها). وجبت إعادة الصياغة لتكون أمتن بأسلوب المعجم الوسيط."
    authored:
      - type: terminological
        text: "مجموعة من الأعمال الفنية، كالمسرحيات والأغاني والمقطوعات الموسيقية، التي يحفظها فنان أو فرقة وتكون جاهزة للأداء العام المتكرر وفق برنامج منتظم."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة من الأعمال الفنية، كالمسرحيات والأغاني والمقطوعات الموسيقية، التي يحفظها فنان أو فرقة وتكون جاهزة للأداء العام المتكرر وفق برنامج منتظم."
  examples:
    per_lemma:
      - lemma: "ذَخِيرَة فَنِّيَّة"
        examples:
          - text: "استعرضت الفرقة ذخيرتها الفنية في المهرجان الدولي للموسيقى."
            type: usage
      - lemma: "رِيبِرْتُوَار"
        examples:
          - text: "أضافت السوبرانو ألحاناً كلاسيكية إلى الريبرتوار الخاص بها للموسم الجديد."
            type: usage
      - lemma: "ذَخِيرَة"
        examples:
          - text: "يعتمد نجاح مسرح الذخيرة على تنوع الأعمال التي تقدمها الفرقة بالتناوب."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "استعرضت الفرقة ذخيرتها الفنية في المهرجان الدولي للموسيقى."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أضافت السوبرانو ألحاناً كلاسيكية إلى الريبرتوار الخاص بها للموسم الجديد."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يعتمد نجاح مسرح الذخيرة على تنوع الأعمال التي تقدمها الفرقة بالتناوب."

