# مراجعة المجموعة الترادفية: awn4-05100342-n
# المفهوم: فرصة ضئيلة أو معدومة للنجاح (slim chance / fat chance)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أمل ضعيف، فرصة ضئيلة) بلا تشكيل"
      - "اللمّة «فرصة ضئيلة» تكاد تكون نسخة حرفية من التعريف العربي، مما يوقع في الدَّوَران"
      - "كلتا اللمّتين تركيبان وصفيان وليستا مصطلحين مسكوكين بالمعنى الدقيق، وإنما هما عبارتان وصفيتان شائعتان"
      - "المفهوم مجرّد (درجة الاحتمال) يُعبَّر عنه في العربية بعبارات وصفية أكثر منه بمصطلح مفرد"
    observations: "المجموعة تمثّل مفهوماً مجرّداً يتعلّق بدرجة الاحتمال، وهو مفهوم يوجد في كلّ ثقافة لكنّه لا يُلَخَّص في العربية بمصطلح مفرد بل بتراكيب وصفية من نوع «صفة + موصوف». التعبيرات الإنجليزية fat chance وslim chance اصطلاحية ساخرة لا نظير مباشر لها في العربية. التراكيب الوصفية مثل «أمل ضعيف» و«فرصة ضئيلة» و«احتمال ضعيف» هي الطريقة الطبيعية للتعبير عن هذا المفهوم في الفصحى."
  blind_candidates:
    - lemma: "اِحْتِمَالٌ ضَعِيفٌ"
      generation_method: tarkib
      justification: "تركيب وصفي من «احتمال» (مصدر افتعال من حمل، بمعنى الإمكان) و«ضعيف» (خلاف القوي)، شائع في اللغة المعاصرة للدلالة على قلّة فرص التحقق"
    - lemma: "أَمَلٌ وَاهٍ"
      generation_method: tarkib
      justification: "تركيب وصفي من «أمل» (الرجاء والانتظار) و«واهٍ» (الضعيف المتهافت)، يؤدّي دلالة الرجاء الخافت الذي يكاد ينعدم"
    - lemma: "رَجَاءٌ بَعِيدٌ"
      generation_method: tarkib
      justification: "تركيب وصفي من «رجاء» (الأمل) و«بعيد» (خلاف القريب)، يفيد أنّ المطلوب بعيد التحقق"
    - lemma: "مَطْمَعٌ بَعِيدٌ"
      generation_method: tarkib
      justification: "تركيب وصفي من «مطمع» (اسم مكان/مصدر ميمي من طمع بمعنى ما يُطمع فيه) و«بعيد»، يدلّ على غاية يصعب بلوغها"

stage2_evidence:
  per_lemma:
    - lemma: "أَمَلٌ ضَعِيفٌ"
      confirm:
        - text: "«احتمال ضئيل؛ أملٌ ضعيف جدًا.»"
          source: "المورد الحديث (2008) — مقابل off chance"
      expands:
        - text: "«الأَمَلُ: الرجاءُ. يقال: أَمَلَ خَيْرَهُ يَأْمُلُه أَمْلاً»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "يؤكّد أنّ الأمل هو الرجاء، والتركيب «أمل ضعيف» يعني رجاءً خافتاً"
        - text: "«الْهَمْزَةُ وَالْمِيمُ وَاللَّامُ أَصْلَانِ: الْأَوَّلُ التَّثَبُّتُ وَالِانْتِظَارُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الأول يدلّ على الانتظار والتثبّت، وهو أساس دلالة الرجاء"
    - lemma: "فُرْصَةٌ ضَئِيلَةٌ"
      confirm:
        - text: "«احتمال ضئيل؛ أملٌ ضعيف جدًا.»"
          source: "المورد الحديث (2008) — مقابل off chance"
      expands:
        - text: "«الفُرْصَة: النوبة تكون بين القوم يتناوبونها على الماء. ويقال: انتهز فلان الفرصة: اغتنمها وفاز بها»"
          source: "المعجم الوسيط"
          addition: "الفرصة أصلها النوبة ثم توسّعت للدلالة على الوقت المناسب، وتقييدها بضئيلة يفيد ندرتها"
        - text: "«الْفَاءُ وَالرَّاءُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اقْتِطَاعِ شَيْءٍ عَنْ شَيْءٍ... ثُمَّ يُقَالُ لِلنُّهْزَةِ فُرْصَةٌ، لِأَنَّهَا خِلْسَةٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الفرصة مشتقة من الاقتطاع والخلسة، مما يعزّز دلالة الندرة والانتهاز"
    - lemma: "اِحْتِمَالٌ ضَعِيفٌ"
      confirm:
        - text: "«احتمال ضئيل؛ أملٌ ضعيف جدًا.»"
          source: "المورد الحديث (2008) — مقابل off chance"
      expands:
        - text: "«الاحتمال: ما لا يكون تصور طرفيه كافيًا، بل يتردد الذهن في النسبة بينهما، ويراد به الإمكان الذهني»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "الاحتمال في الاصطلاح يفيد الإمكان الذهني مع تردّد، وهو أقرب للمعنى المنطقي-الإحصائي"
        - text: "«(في الفلسفة): ما يمكن توقع حدوثه»"
          source: "المعجم الكبير"
          addition: "المعنى الفلسفي للاحتمال يناسب المفهوم الإحصائي في المجموعة"
    - lemma: "أَمَلٌ وَاهٍ"
      evidence_status: "no_material_found"
    - lemma: "رَجَاءٌ بَعِيدٌ"
      evidence_status: "no_material_found"
    - lemma: "مَطْمَعٌ بَعِيدٌ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "أَمَلٌ ضَعِيفٌ"
      decision: confirmed
      decision_reason: "تركيب وصفي شائع موثّق في المورد الحديث مقابل off chance بصيغة «أملٌ ضعيف جدًا»، يدلّ على الرجاء الخافت. لفظ «أمل» أصيل في العربية بمعنى الرجاء والانتظار. التركيب طبيعي ومتداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على البُعد العاطفي والنفسي (الرجاء)، فهو أمل يرجوه صاحبه لكنه يدرك ضعفه، بخلاف «فرصة ضئيلة» الذي يركّز على الجانب الموضوعي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَمَلٌ ضَعِيفٌ"

    - lemma: "فُرْصَةٌ ضَئِيلَةٌ"
      decision: confirmed
      decision_reason: "تركيب وصفي شائع يدلّ على قلّة الحظوظ. رغم التقاطع الجزئي مع نص التعريف، فإنّ التعبير مستقرّ في الاستعمال العربي المعاصر وموثّق ضمنياً في المورد الحديث (احتمال ضئيل). التقاطع مع التعريف لا يمنع قبوله لأنّه تعبير قائم بذاته."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على الجانب الموضوعي والواقعي (الفرصة المتاحة)، فهو وصف لحال الأمور لا لمشاعر صاحبها، بخلاف «أمل ضعيف» الذي يصف الرجاء الذاتي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُرْصَةٌ ضَئِيلَةٌ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "اِحْتِمَالٌ ضَعِيفٌ"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ «احتمال ضئيل» موثّق في المورد الحديث، فإنّ الصيغة المولَّدة «احتمال ضعيف» ليست مطابقة للصيغة الموثّقة. كذلك فإنّ المفهوم مغطّى كفاية باللمّتين الموجودتين، وإضافة مرادف ثالث بتركيب وصفي مماثل لا يُثري المجموعة."

    - lemma: "أَمَلٌ وَاهٍ"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثر على أدلة معجمية تؤكّد تلازم هذا التركيب كوحدة معجمية ثابتة. تعبير وصفي حرّ يمكن إبدال «واهٍ» بـ«ضعيف» أو «خافت» دون تغيير المعنى، مما يعني أنّه لم يتجمّد اصطلاحياً."

    - lemma: "رَجَاءٌ بَعِيدٌ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على تلازمه كوحدة ثابتة. تعبير وصفي حرّ لم يتجمّد اصطلاحياً، ويفشل في اختبار السكّ (يمكن إبدال «بعيد» بـ«ضعيف» أو «واهٍ»)."

    - lemma: "مَطْمَعٌ بَعِيدٌ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية. «المطمع» يدلّ على ما يُطمع فيه، وهو أقرب للغاية منه للاحتمال، فلا يطابق المفهوم تماماً. كذلك هو تعبير وصفي حرّ غير مسكوك."

