# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-04819517-n  |  ili: i62293  |  pos: n
# concept: elegance (gracefulness + good taste)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "رُقِيّ معناه الأصيل الصعود والتقدم لا الأناقة؛ لا تدعمه المعاجم الكلاسيكية ولا الحديثة بمعنى صفة تجمع بين الرشاقة والذوق الرفيع"
      - "التعريف الحالي يستخدم «راقية» المشتقة من الجذر ذاته لرُقِيّ، مما يوحي بدوران مفاهيمي إذا استُبقيت اللمّة"
    observations: >
      المجموعة تعبّر عن مفهوم عربي أصيل موثّق في المعاجم الكلاسيكية والحديثة تحت جذر (أ ن ق).
      أَنَاقَة لفظ راسخ في العربية، ورد في الصحاح وأساس البلاغة والمعجم الوسيط وغيرها بمعنى الحسن
      المُعجِب الجامع بين رشاقة الهيئة ودقة الذوق. في المقابل، رُقِيّ — وإن استُعمل في العربية الحديثة
      استعمالاً مجازياً بمعنى التهذيب العام — إلا أن معناه المعجمي الأصيل هو الصعود والارتقاء،
      وهو أشمل وأعمّ من دلالة الأناقة. ويُلاحَظ غياب أي تعريف معجمي كلاسيكي يضع رُقِيّ
      مقابلاً لـ elegance تحديداً.
  blind_candidates:
    - lemma: "الظَّرَافَة"
      generation_method: majaz
      justification: >
        إحياء للفظ كلاسيكي من جذر (ظ ر ف) يدل على لطف الهيئة ورقة الأسلوب وحسن التعبير،
        مما يُقاربه من معنى الأناقة في جانبها الأسلوبي والذوقي. ورد في التوقيف على مهمات
        التعاريف بمعنى الملكة المولِّدة للألفاظ الظريفة.
    - lemma: "اللَّطَافَة"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر (ل ط ف) على وزن فَعَالَة، يدل على الرقة والدقة في الشكل والأسلوب.
        يحمل معنى الخفة والرهافة التي تنسجم مع صفة الأناقة في بُعدها الجمالي.
    - lemma: "التَّأَنُّق"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر (أ ن ق) على وزن تَفَعُّل، يدل على الحرص على الجمال الأنيق وإتقان
        الهيئة. مشتق من نفس الجذر الأصلي وورد في المعاجم الكلاسيكية.
    - lemma: "الكَيَاسَة"
      generation_method: ishtiqaq
      justification: >
        مصدر من جذر (ك ي س) على وزن فَعَالَة، يدل في بعض استعمالاته على حسن التصرف
        ولطف المعاملة، مما يُقاربه من مفهوم الذوق الرفيع.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة:
#   Q1: مطابقة الرأس الدفعية — جميع اللمات (موجودة + مرشحات)
#   Q2: الجسر الإنجليزي — elegance / gracefulness / good taste
#   Q3: عائلة جذر أنق (من نتائج Q1)
#   Q4: مقاييس اللغة — أنق + رقى
stage2_evidence:
  per_lemma:
    - lemma: "أَنَاقَة"
      confirm:
        - text: "«وله أناقة ولباقة»"
          source: "تاج اللغة وصحاح العربية للجوهري (ت 1003م)"
        - text: "«(أنق)أنقا وأناقة رَاع حسنه وأعجب فَهُوَ أنيق»"
          source: "المعجم الوسيط (مجمع اللغة العربية، ط 1998)"
        - text: "«ونحن في أناقة من عيشنا ودهرنا»"
          source: "المحيط في اللغة للصاحب بن عباد"
        - text: "«أنِق شابٌّ: أحسن اختيارَ ألفاظه وطرق تعبيره، وجمال مظهره فأعجب الناس بلباقته وشياكته»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (ط 2003)"
        - text: "«(1) أناقة (2) رشاقة (3) بساطة؛ دقة علميّة (4) شيء أنيق»"
          source: "المورد الحديث (2008) — ترجمة elegance"
      expands:
        - text: "«الْأَنَقُ الْإِعْجَابُ بِالشَّيْءِ، تَقُولُ أَنِقْتُ بِهِ، وَأَنَا آنَقُ بِهِ أَنَقًا... وَشَيْءٌ أَنِيقٌ وَنَبَاتٌ أَنِيقٌ»"
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
          addition: "الجذر الأصلي (أنق) يدل على الإعجاب المجرد بالشيء الحسن، ومنه تفرّعت أَنَاقَة بمعنى الصفة الجامعة للجمال والإعجاب"
        - text: "«أ ن ق: شَيْءٌ أَنِيقٌ أَيْ حَسَنٌ مُعْجِبٌ وَتَأَنَّقَ فِي الْأَمْرِ أَيْ عَمِلَهُ بِنِيقَةٍ مِثْلُ تَنَوَّقَ»"
          source: "مختار الصحاح للرازي (ت 1266م)"
          addition: "يُثبت أن الدلالة على الإتقان والجمال الحسن مترسّخة في المادة"

    - lemma: "رُقِيّ"
      contradicts:
        - text: "«رَقيتُ في السُلّمِ بالكسر رَقْياً ورُقِيّاً، إذا صعِدتَ»"
          source: "تاج اللغة وصحاح العربية للجوهري (ت 1003م)"
          conflict: "رُقِيّ في المعاجم الكلاسيكية مصدرٌ للصعود والارتقاء في الدرجات، لا للصفة الجامعة بين الرشاقة والذوق الرفيع"
        - text: "«(رَقَى) الرَّاءُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ أُصُولٌ ثَلَاثَةٌ مُتَبَايِنَةٌ: أَحَدُهُمَا الصُّعُودُ، وَالْآخَرُ عُوذَةٌ يُتَعَوَّذُ بِهَا، وَالثَّالِثُ بُقْعَةٌ مِنَ الْأَرْضِ»"
          source: "مقاييس اللغة لابن فارس (ت 1004م)"
          conflict: "ابن فارس لا يذكر معنى الأناقة أو الذوق الرفيع ضمن المعاني الثلاثة الأصيلة لهذا الجذر"
        - text: "«الرُّقِيُّ: بلفظ الرقيّ بمعنى الصعود: موضع في شعر ليلى»"
          source: "معجم البلدان لياقوت الحموي (ت 1229م)"
          conflict: "كل المعاجم الجغرافية والأدبية تستشهد بالرُّقِيّ بمعنى الصعود لا الأناقة"

    - lemma: "الظَّرَافَة"
      expands:
        - text: "«الظرافة تطلق على الملكة التي تكون مبدأ لصدور الألفاظ التي لا تخلو عن ظرافة وإيهام، وتطلق على هذه الألفاظ أيضا، قال أبو البقاء... فمن له تلك الملكة يسمّى ظريفاً»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: "الظرافة دلالتها الأولى على اللطف في المنطق وحسن التعبير، وهو مختلف عن مفهوم الأناقة الجامعة بين الهيئة الرشيقة والذوق الرفيع"

    - lemma: "اللَّطَافَة"
      expands:
        - text: "«اللطافة بالفتح يطلق على معان أربعة. الأول رقّة القوام أعني سهولة قبول الأشكال الغريبة... الثاني قبول الانقسام إلى أجزاء صغيرة جدا. الثالث سرعة التأثّر عن الملاقي. الرابع الشفافية»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: "اللطافة في المعاجم الكلاسيكية تدور حول الرقة الجسدية والشفافية المادية، أكثر من دلالتها على الأناقة الجمالية"

    - lemma: "التَّأَنُّق"
      expands:
        - text: "«التأنق: تتبع الشيء الأنيق، وهو ما يؤنقك أي يحملك على الأنق وهو العجب، يقال أنق في الرياض تتبع ما يؤنقه، قال المطرزي: وأما قولهم تأنق في عمله فمجاز»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: "التأنق فعلٌ أو مصدر عملية (الحرص على الجمال وإتقانه)، لا صفةٌ دالة على الحالة كـ أَنَاقَة"
        - text: "«(تأنق) مُطَاوع أنقه وَطلب أعجب الْأَشْيَاء وَفِيه أتقنه وجوده»"
          source: "المعجم الوسيط (مجمع اللغة العربية، ط 1998)"
          addition: "المعجم الوسيط يؤكد أن التأنق فعل مطاوع أي نتيجة فعل آخر، والمصدر منه يدل على العملية لا على الصفة"

    - lemma: "الكَيَاسَة"
      contradicts:
        - text: "«(الكياسة) تمكن النُّفُوس من استنباط مَا هُوَ أَنْفَع»"
          source: "المعجم الوسيط (مجمع اللغة العربية، ط 1998)"
          conflict: "الكياسة ذكاء عملي وقدرة على استنباط الأنفع، لا صفة جمالية جامعة بين الرشاقة والذوق الرفيع"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "أَنَاقَة"
      decision: confirmed
      decision_reason: >
        لفظ راسخ في المعجمية العربية من العصر الكلاسيكي حتى المعاصر؛ ورد كمصدر للفعل أنِقَ
        دالاً على الحسن المُعجِب وجمال الهيئة المتناسق. الأدلة من الصحاح والمحيط والمعجم
        الوسيط والمعاصر كلها تؤكد دلالته على الصفة الجمالية الجامعة بين حسن الهيئة ودقة الذوق.
        يُرادف elegance بدقة في معاجم الترجمة الحديثة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أَنَاقَة تُحدِّد خصيصةً جمالية مُركَّبة تجمع بين حسن الهيئة الخارجية (الرشاقة والتناسق)
        وسلامة الذوق الداخلية (اختيار الألوان والأسلوب)؛ وهي أخصّ من جَمَال (الحسن العام)
        وأخصّ من ظَرَافَة (التي تتضمن اللطف في الكلام والنكتة) وأخصّ من رُقِيّ (التقدم والارتفاع
        العام). تمتاز بأنها تصف الانسجام بين الظاهر والباطن في الأسلوب والهيئة معاً.

    - lemma: "رُقِيّ"
      decision: removed
      decision_reason: >
        معناه الأصيل في جميع المعاجم الكلاسيكية الصعودُ والارتقاءُ (رَقِيتُ في السُلّم رُقِيّاً)،
        ومقاييس اللغة لابن فارس يُصرّح بثلاثة أصول متباينة لا علاقة لأي منها بمعنى الأناقة.
        الاستخدام الحديث لـ رُقِيّ بمعنى التهذيب والرفعة هو مجاز ثانوي أشمل من مفهوم
        هذه المجموعة (elegance = gracefulness + good taste تحديداً). لا توجد شاهدٌ معجمي
        يضع رُقِيّ مقابلاً صريحاً لـ elegance في أي معجم ثنائي أو متخصص.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الظَّرَافَة"
      source: stage1
      decision: removed
      decision_reason: >
        الظرافة في المعاجم الكلاسيكية تدل على الملكة الدالة على لطف الأسلوب والنكتة والبلاغة؛
        هي أقرب إلى wit/wittiness في الإنجليزية منها إلى elegance. لا تشمل بالضرورة الجانب
        البصري والهيئي الذي هو محور هذه المجموعة، وإدراجها يُلبِّس بين مفهومَين متمايزَين.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "اللَّطَافَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكلاسيكية تُحصر اللطافة في الرقة الجسدية والشفافية المادية والسهولة
        القابلية للانقسام. لا تتطابق مع elegance التي هي صفة جمالية مُركَّبة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "التَّأَنُّق"
      source: stage1
      decision: removed
      decision_reason: >
        التأنق مصدرٌ للفعل تأنَّقَ يدل على عملية الحرص على الأناقة والإتقان، أي
        المصدر الفعلي لا الصفة الاسمية. هو حالة سلوكية (act of being elegant) لا صفةٌ
        دالة على مفهوم مجرد كـ أَنَاقَة. اشتراط الصفة لهذه المجموعة يستلزم اسم المصدر
        (أَنَاقَة) لا المصدر الفعلي (تَأَنُّق).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "الكَيَاسَة"
      source: stage1
      decision: removed
      decision_reason: >
        الكياسة في المعجم الوسيط هي تمكّن النفوس من استنباط الأنفع، أي فطنة عملية
        وذكاء، ولا علاقة لها بالجمال الرشيق وحسن الذوق الجمالي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


