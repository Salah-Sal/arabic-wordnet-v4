# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset: awn4-07102837-n  |  ili: i73902  |  pos: n
# "a distinctive spoken or written expression"
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة 'تعبير' عامة الدلالة إذ تشمل كل أنواع التعبير اللغوي ولا تنحصر في التعبير المميز ذي الطابع الأسلوبي الخاص"
      - "اللمّة 'صياغة' تركّز على العملية (طريقة التشكيل اللفظي) أكثر من تركيزها على نتاجها (التعبير المميز كمحصّل)"
      - "كلتا اللمّتين خالية من التشكيل الكامل في البيانات الحالية"
      - "التعريف الحالي 'تعبير مميز منطوق أو مكتوب' ترجمة حرفية للإنجليزية، ويفتقر إلى الجنس القريب والفصل النوعي وفق منهج التعريف المعجمي"
    observations: >
      المجموعة الترادفية تقابل مفهوم 'turn of phrase' الإنجليزي: أي صيغة لفظية أو أسلوب
      تعبيري متميز يتّسم بطابع خاص يُعرَف به صاحبه أو يميّز عصراً. العربية ثريّة بهذا
      الباب في علوم البيان والبديع والأسلوبية، وهو مفهوم أصيل غير غريب. غير أن اللمّتين
      الحاليتين لا تستوعبان الدلالة بدقة كافية: 'تعبير' أعمّ مما يلزم، و'صياغة' أدق
      لكنها تصف الطريقة لا المصطلح المتعيّن. التعريف بحاجة إلى إعادة صياغة بأسلوب
      معجمي يُبرز طبيعة التعبير الأسلوبية وما يُفرّقه عن عموم الكلام.

  blind_candidates:
    - lemma: "مَقُولَة"
      generation_method: ishtiqaq
      justification: >
        من جذر ق-و-ل على وزن مَفْعُولَة، تعني ما قِيل وتردَّد من الكلام المميز.
        الوزن يدل على الاسم المفعول الثابت المتداوَل، مما يناسب تعبيراً مميزاً
        ينتسب إلى صاحبه ويتردد على الألسنة.
    - lemma: "أُسْلُوبٌ بَيَانِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من 'أسلوب' (الطريقة والمنهج في الكلام) و'بياني' (نسبة إلى البيان
        اللغوي والبلاغي). يدل على الطريقة التعبيرية المميزة ذات الطابع البلاغي
        الخاص التي تتسم بها عبارة أو شخص.
    - lemma: "نَسِيج"
      generation_method: majaz
      justification: >
        من ج ن-س-ج بالمجاز؛ يقال 'نسيج الكلام' لأسلوب نسجه وطريقة حبكه، كما يقال
        'نسيج وحده' للمتفرد الذي لا مثيل له. إحياء للمجاز التراثي في وصف التعبير
        المميز.
    - lemma: "لَحْن"
      generation_method: majaz
      justification: >
        من ل-ح-ن؛ 'لحن القول' يعني فحواه وما يفهمه السامع بالتأمل، وتُستخدم في
        التراث للدلالة على الأسلوب الخاص في الإفادة. بالمجاز: الأسلوب التعبيري
        المميز لصاحبه.


stage2_evidence:
  per_lemma:
    - lemma: "تعبير"
      confirm:
        - text: "«(1) التَّعبير [بواسطة الألفاظ] (2) الصِّياغة: طريقة التَّعبير في كلمات؛ اختيارُ الكلمات واستخدامُها»"
          source: "المورد الحديث (2008) — wording"
        - text: "«في النحو التقليدي، كل مكون من مكونات الجملة (كلمة، مركب)»"
          source: "المعجم الموحد لمصطلحات اللسانيات — Expression"
        - text: "«وحدة تعبير ونسق لغوي لترميز الأشياء، ككتابة تتحدد بقواعد نحوية وسيميائية»"
          source: "المعجم الموحد لمصطلحات اللسانيات — expression"
        - text: "«أسلوب التعبير أو وسيلته؛ صياغة»"
          source: "المورد الحديث (2008) — expression (المعنى ج)"
      expands:
        - text: "«لفظ أو تعبير مميِّز للإيرلنديين»"
          source: "المورد الحديث (2008) — Irishism"
          addition: "يُثبت استخدام العبارة 'تعبير مميز' كمصطلح عربي مستقر في المعجم الحديث لوصف تعبير لغوي متميز"
        - text: "«تعبير مميِّز أو مُعادٌ على نحو موصول»"
          source: "المورد الحديث (2008) — tag (المعنى ج)"
          addition: "يؤكد أن 'تعبير مميز' مقرون بمعنى التكرار والتداول، مما يعزز ملاءمة اللمّة للمجموعة"

    - lemma: "صياغة"
      confirm:
        - text: "«يقال: كلامٌ حسنُ الصياغةِ: جيّدٌ مُحْكَمٌ»"
          source: "المعجم الوسيط"
        - text: "«كلامٌ حسنُ الصِّياغة: جَيِّدٌ مُحْكَمٌ»"
          source: "المعجم الكبير"
        - text: "«(1) الصِّياغة: إفراغٌ في صِيغة (2) استنباط»"
          source: "المورد الحديث (2008) — formulation"
        - text: "«(1) التَّعبير [بواسطة الألفاظ] (2) الصِّياغة: طريقة التَّعبير في كلمات؛ اختيارُ الكلمات واستخدامُها»"
          source: "المورد الحديث (2008) — wording"
      expands:
        - text: "«الصَّادُ وَالْوَاوُ وَالْغَيْنُ أَصْلٌ صَحِيحٌ، وَهُوَ تَهْيِئَةٌ عَلَى شَيْءٍ عَلَى مِثَالٍ مُسْتَقِيمٍ. مِنْ ذَلِكَ قَوْلُهُمْ: صَاغَ الْحَلْيَ يَصُوغُهُ صَوْغًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت الأصل اللغوي بمعنى التهيئة على مثال مستقيم، مما يدعم الاستخدام المجازي في الكلام المحكم"
      contradicts:
        - text: "«صِيَاغَة — الرأي: مرفوضة — السبب: لأن 'الصياغة' ليست مصدراً للفعل 'صاغ'. الصواب والرتبة: بَدَءُوا صَوْغ عناصر الاتفاق [فصيحة] — بَدَءُوا صياغة عناصر الاتفاق [فصيح]»"
          source: "معجم الصواب اللغوي"
          conflict: "معجم الصواب يرى أن 'صَوْغ' هو المصدر الفصيح الأول للفعل 'صاغ'، وإن قَبِل 'الصياغة' فصيحةً من الدرجة الثانية"

    - lemma: "مَقُولَة"
      confirm:
        - text: "«كلمة تردَّدت وقيلت مرَّة بعد مرَّة»"
          source: "المعجم الوسيط"
        - text: "«(المقولة) كلمة ترددت وقيلت مرّة بعد مرّة»"
          source: "المعجم الوسيط (مجموع)"
      contradicts:
        - text: "«المقولة: في عرف الحكماء الجوهر والعرض فيقولون المقولات عشر: الجوهر والأعراض التسعة»"
          source: "دستور العلماء"
          conflict: "في المصطلح الفلسفي المقولة = category (إحدى مقولات أرسطو العشر)، مما يُوجد ازدواجاً دلالياً مع الاستخدام التداولي"
        - text: "«المقولة: Category»"
          source: "كشاف اصطلاحات الفنون والعلوم"
          conflict: "الاستخدام الفلسفي الراسخ يجعل اللمّة ذات دلالتين متباينتين في سياقات مختلفة"

    - lemma: "نَسِيج"
      contradicts:
        - text: "«(النسيج) المنسوج ويقال هو نسيج وحده لا نظير له في علم وغيره»"
          source: "المعجم الوسيط (مجموع)"
          conflict: "'نسيج' يدل على المنسوج المادي. والمجاز 'نسيج وحده' يعني المتفرد اللا مثيل، لا يدل على أسلوب تعبيري"
        - text: "«النُّونُ وَالسِّينُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى وَصْلِ شَيْءٍ بِشَيْءٍ فِي أَدْنَى عَرْضٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدل على الحياكة والوصل الجسماني، لا على الصياغة اللفظية"

    - lemma: "أُسْلُوبٌ بَيَانِيٌّ"
      confirm:
        - text: "«(1) أسلوب التعبير (2) جمع النغمات في عباراتٍ (مو)»"
          source: "المورد الحديث (2008) — phrasing"
      expands:
        - text: "«الأسلوب: أسلوب التعبير الفنّي المميِّز لفَرْد أو حقبةٍ»"
          source: "المورد الحديث (2008) — idiom (المعنى 3)"
          addition: "يؤكد أن 'أسلوب التعبير المميز' مفهوم موثّق في المعجم الحديث، لكنه يرد وصفاً لا مصطلحاً مسكوكاً"

    - lemma: "لَحْن"
      contradicts:
        - text: "«اللَّامُ وَالْحَاءُ وَالنُّونُ لَهُ بِنَاءَانِ يَدُلُّ أَحَدُهُمَا عَلَى إِمَالَةِ شَيْءٍ مِنْ جِهَتِهِ، وَيَدُلُّ الْآخَرُ عَلَى الْفِطْنَةِ وَالذَّكَاءِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "معنى اللحن في المقاييس: الميل عن الصواب أو الفطنة؛ لا يدل على التعبير المميز البليغ"
        - text: "«عدم التطابق وقواعد النحو للغة ما»"
          source: "مسرد الإعلام والتواصل — agrammaticality"
          conflict: "المصطلح المعاصر يحمل دلالة الخطأ اللغوي والانحراف النحوي، عكس المعنى المطلوب"
        - text: "«اللحن: صرف الكلام عن سننه الجاري عليه إما بإزالة الإعراب أو التصحيف»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          conflict: "الاستخدام التراثي يحصر اللحن في الخطأ الإعرابي لا في التميز الأسلوبي"


stage3_analysis:
  per_lemma:
    - lemma: "تعبير"
      decision: confirmed
      decision_reason: >
        اللفظ موثّق في المعاجم الحديثة بمعنى 'expression / wording' وهو الترجمة
        المستقرة للمفهوم. المورد الحديث يجمع بين 'تعبير' و'صياغة' كمترادفين في هذا
        السياق. وعبارة 'تعبير مميز' ثابتة في المعجم كما في 'لفظ أو تعبير مميز'. يُبقى
        مع تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدل على التعبير اللغوي في جانبه التواصلي العام، أعمّ اللمّات الثلاث؛
        يشمل أي صيغة لغوية سواء أكانت بليغة أم عادية، منطوقة أم مكتوبة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْبِير"

    - lemma: "صياغة"
      decision: confirmed
      decision_reason: >
        موثّق في المعجم الوسيط والكبير بمعنى الكلام المُحكَم جيد الصنعة، وفي
        المورد الحديث بمعنى 'wording' (طريقة التعبير في كلمات). معجم الصواب يقبلها
        فصيحة وإن آثر 'صَوْغ' مصدراً أول. تُبقى مع تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تركز على الجانب الأسلوبي والتقني في تشكيل الكلام وإحكام اختيار الألفاظ؛
        أخص من 'تعبير' بدلالة الصنعة اللفظية والجودة، وأقرب إلى 'wording / formulation'
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صِيَاغَة"

    - lemma: "مَقُولَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثّق في المعجم الوسيط (OCR وهاورماني) بمعنى 'كلمة تردّدت وقيلت مرة بعد
        مرة'، وهو يناسب 'turn of phrase' دلالةً (التعبير المميز المتردد). الاشتراك
        الفلسفي (category) قائم لكنه في سياق مغاير ولا يلغي الدلالة التداولية المُثبتة
        في الوسيط. وزن مَفْعُولَة يدل على الثبات والتداول.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركز على التعبير المميز المتردد الذي يُعرَف به صاحبه وينتشر بين الناس؛
        أخص الثلاث في إبراز الطابع الشخصي والتداولي للتعبير
      actions:
        - command: create_entry
          params:
            lemma: "مَقُولَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نَسِيج"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل على استخدام 'نسيج' مصطلحاً للتعبير اللغوي المميز. المجاز 'نسيج وحده'
        يدل على التفرد لا على الأسلوب. المعاجم الحديثة تحصره في التقنية (tissue/texture/
        fabric) والمقاييس تُبقي الجذر في دلالة الحياكة المادية.

    - lemma: "أُسْلُوبٌ بَيَانِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود 'أسلوب التعبير' في المورد الحديث، يخفق هذا المركب في اختبار السكّ:
        يمكن إبدال 'بياني' بـ'فصيح' أو 'راقٍ' وما زال وصفاً سليماً، دليل أنه عبارة
        وصفية حرة لا وحدة معجمية مسكوكة. لا يُقبل بموجب قاعدة التثبيت المعجمي.

    - lemma: "لَحْن"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر ل-ح-ن يدل على الخطأ الإعرابي والميل عن الصواب في المعاجم الكلاسيكية،
        وعلى الأغنية الموسيقية في الاستخدام الحديث. الاستخدام التقني المعاصر
        (agrammaticality / solecism) يُعارض المعنى المطلوب مباشرةً.


stage4_content:
  definition:
    current: "تعبير مميز منطوق أو مكتوب"
    assessment:
