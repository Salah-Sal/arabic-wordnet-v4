        'مميز' وحدها غير كافية: لا تُحدد طبيعة التميز (أسلوبي؟ بلاغي؟) ولا ما
        يُميّزه (شخص؟ عصر؟ مدرسة؟). التعريف المعجمي يقتضي جنساً قريباً ('صيغة
        لفظية / أسلوب') وفصلاً يُبيّن وجه التميز.
