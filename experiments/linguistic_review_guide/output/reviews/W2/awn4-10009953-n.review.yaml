step0_evidence:
  per_lemma:
    - lemma: "راقص"
      contradicts:
        - text: "«مَنْ يَحْتَرف الرَّقْصَ»"
          source: "المعجم الكبير"
          conflict: "المعجم يخصصه بمن يحترف الرقص، بينما تعريف المجموعة الترادفية يصف مشاركاً غير محترف في حفلة اجتماعية."
      peripheral_observations:
        - "المعاجم الحديثة تورد (الراقصة) و(الراقص) بمعنى من يحترف الرقص، مما يخلق تداخلاً مع المعنى الاجتماعي غير الاحترافي."

step05_lemma_generation:
  generation_notes: "لا يوجد مصطلح عربي مسكوك يقابل (social dancer) بدقة. التعبيرات الممكنة مثل (مشارك في حفلة راقصة) هي عبارات وصفية حرة لا ترقى لمرتبة المصطلح. يتم سد الفجوة باستخدام اللمة العامة (راقص) مع التعويل على السياق."

step1_lemma_validation:
  per_lemma:
    - lemma: "راقص"
      decision: confirmed
      decision_reason: "على الرغم من أن المعاجم (كالمعجم الكبير والوسيط) تخصّ (الراقص) بالمحترف، إلا أن الكلمة هي اسم فاعل من (رقص) وتُستعمل في السياق العام للدلالة على أي شخص يرقص في حفلة اجتماعية. لا يوجد مصطلح مسكوك أفضل، لذا تُقبل اللمة مع توسيع دلالتها المعجمية."
      evidence_assessment:
        case: "contradicts"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على من يؤدي الرقص عموماً، وتُستخدم هنا بسياق اجتماعي لغياب المقابل الدقيق للمصطلح الإنجليزي (social dancer)."
      example: "انضم الراقصون إلى الحلبة فور بدء الموسيقى في الحفلة."
  synset_flags:
    definition_review_needed: false

