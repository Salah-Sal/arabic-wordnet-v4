            sense_id: "{auto}"

    - lemma: "تَدْوِين"
      source: stage1
      decision: removed
      decision_reason: "معناه الاصطلاحي المستقر هو notation (الترميز) أو التسجيل العام، لا النسخ من وسيط إلى آخر. الأدلة المعجمية لا تدعم استخدامه مقابلاً لـ transcription إلا في مجال القانون فقط."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَفْرِيغ"
      source: stage1
      decision: removed
      decision_reason: "الأصل الاشتقاقي يدل على الإخلاء والفراغ. استعماله بمعنى تحويل المسموع إلى مكتوب شائع عامّياً وصحفياً لكنه غير مثبَت في المعاجم المعيارية. لا يغطي معنى النسخ الكتابي العام."
      evidence_assessment:
        case: contradicts_only

    - lemma: "اسْتِنْسَاخ"
      source: stage1
      decision: removed
      decision_reason: "رغم ثبوته كلاسيكياً بمعنى الاكتتاب، فقد غلب عليه في الاستعمال الحديث معنى الاستنساخ البيولوجي (cloning)، مما يُحدث التباساً. والمصدر البسيط «نَسْخ» أولى وأخفّ وأشيع."
      evidence_assessment:
        case: mixed

    - lemma: "نُسْخَة"
      source: stage1
      decision: removed
      decision_reason: "النُّسْخَة تدل على الوثيقة المنسوخة ذاتها (transcript) لا على عملية النسخ أو نتاجها (transcription). المجموعة الترادفية عن transcription لا transcript."
      evidence_assessment:
