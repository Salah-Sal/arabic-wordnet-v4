      decision: confirmed
      decision_reason: "مصدر ثلاثي مثبَت في أمهات المعاجم بمعنى نقل الكتاب واكتتابه، ومقابل مستقر لـ transcription في المعاجم الاصطلاحية الحديثة. يحتاج تحديث التشكيل فقط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصدر ثلاثي يدل على عملية نقل المكتوب من وسيط إلى آخر ونتاج تلك العملية معاً — هو المصطلح الأصيل المعتمد في المعاجم الاصطلاحية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَسْخ"

    - lemma: "نص مكتوب"
      decision: removed
      decision_reason: "عبارة وصفية حرة لا ترقى إلى مصطلح مسكوك. تفشل في اختبار السكّ: يمكن إبدال «مكتوب» بـ«مدوَّن» أو «مطبوع» والعبارة تبقى صالحة. لا أدلة معجمية عليها كوحدة ثابتة. المعنى عام جداً (أي نص مكتوب) ولا يختص بالنسخ أو التحويل من وسيط إلى آخر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
