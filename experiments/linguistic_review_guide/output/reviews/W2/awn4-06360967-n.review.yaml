stage1_review:
  assessment:
    concerns:
      - "اللمّة «نسخ» بلا تشكيل — ينبغي أن تكون «نَسْخ»"
      - "اللمّة «نص مكتوب» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ (يمكن إبدال «مكتوب» بـ«مدوَّن» أو «مطبوع» دون تغيير المعنى)"
      - "التعريف العربي ترجمة حرفية من الإنجليزية ويحتاج تأليفاً معجمياً مستقلاً"
    observations: "المفهوم المُعرَّف هو نتاج عملية نقل المحتوى من وسيط إلى آخر — كتحويل الإملاء الصوتي إلى نص مطبوع. الجذر العربي الأصيل «ن-س-خ» يغطّي هذا المعنى تماماً: نَسْخ الكتاب = نقله وكتابته حرفاً بحرف، وهو مصدر مثبَت في أمهات المعاجم. أما «نص مكتوب» فهو وصف حرّ لا يختص بالنسخ بل يشمل كل مكتوب."
  blind_candidates:
    - lemma: "تَدْوِين"
      generation_method: ishtiqaq
      justification: "مصدر دَوَّنَ على وزن تَفْعِيل، يدل على تسجيل المعلومات كتابةً. شائع في الاستعمال الحديث للدلالة على عملية الكتابة والتسجيل."
    - lemma: "تَفْرِيغ"
      generation_method: ishtiqaq
      justification: "مصدر فَرَّغَ على وزن تَفْعِيل، يُستعمل حديثاً بمعنى تحويل المسموع إلى مكتوب (تفريغ المقابلة)، وهو الأقرب لمعنى transcription بمفهومه المعاصر."
    - lemma: "اسْتِنْسَاخ"
      generation_method: ishtiqaq
      justification: "مصدر اسْتَنْسَخَ على وزن اسْتِفْعَال من الجذر ن-س-خ، يدل على طلب النسخ والاكتتاب. ورد في القرآن: ﴿إِنَّا كُنَّا نَسْتَنْسِخُ﴾. يشير إلى عملية النقل الكتابي."
    - lemma: "نُسْخَة"
      generation_method: ishtiqaq
      justification: "اسم من الجذر ن-س-خ، يدل على الشيء المنسوخ أو المنقول كتابةً. ورد في المورد الحديث مقابلاً لـ transcript/transcription بمعنى المنتَج المكتوب."


stage2_evidence:
  per_lemma:
    - lemma: "نَسْخ"
      confirm:
        - text: "«الكتابَ: نقَلَه وكتبه حرفاً بحرف»"
          source: "المعجم الوسيط"
        - text: "«النَّسْخ اكتتابك كتاباً عن كتاب حرفاً بحرف، والأَصل نُسخةٌ، والمكتوب عنه نُسخة لأَنه قام مقامه، والكاتب ناسخ ومنتسخ»"
          source: "لسان العرب لابن منظور"
        - text: "«نَسَخْتُ الْكِتَابَ نَسْخًا مِنْ بَابِ نَفَعَ نَقَلْتُهُ وَانْتَسَخْتُهُ كَذَلِكَ»"
          source: "المصباح المنير للفيّومي"
        - text: "«النَّسْخُ: نَسْخُ الْكِتَابِ... قِيَاسُهُ تَحْوِيلُ شَيْءٍ إِلَى شَيْءٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«نسخت كتابي من كتاب فلان وانتسخته واستنسخته بمعنى»"
          source: "أساس البلاغة للزمخشري"
      expands:
        - text: "«النسخ: في اللغة الإزالة والنقلُ»"
          source: "التعريفات للجرجاني"
          addition: "النَّسْخ يحمل معنيين: الإزالة والنقل، والمعنى الثاني هو المناسب للمجموعة"
        - text: "«النّسخ: في اللغة يقال لمعنيين أحدهما الإزالة... وثانيهما النقل يقال نسخت الكتاب وانتسخته أي نقلت ما فيه إلى...»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يميّز بين معنيي الإزالة والنقل صراحةً"
        - text: "«نَسْخ = transcription» (مقابل في عدة معاجم اصطلاحية: علم الوراثة، اللسانيات، الإعلام)"
          source: "ARABTERM — معاجم موحدة متعددة"
          addition: "المصطلح مستقر في الاستعمال المعجمي الاصطلاحي الحديث"

    - lemma: "نص مكتوب"
      evidence_status: "no_material_found"

    - lemma: "تَدْوِين"
      contradicts:
        - text: "«تسمية الكائنات عن طريق تسجيل الأشياء ومسارات الحركة تسجيلاً كتابيًا باستخدام علامات رمزية متفق عليها»"
          source: "مسرد الهندسة الكهربائية (ARABTERM)"
          conflict: "التدوين يُستخدم بمعنى notation (الترميز) لا transcription (النسخ من وسيط إلى آخر)"
        - text: "«مجموعةٌ من الرموز والمَصَاغَات تُستعمَلُ لوصف عناصر في البرمجة»"
          source: "معجم مصطلحات المعلوماتية (ARABTERM)"
          conflict: "المعنى الاصطلاحي الحديث هو notation لا transcription"
      expands:
        - text: "«تدوين، تسجيل = transcription» (في مجال القانون)"
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM)"
          addition: "في المجال القانوني فقط يُستعمل التدوين مقابلاً لـ transcription"

    - lemma: "تَفْرِيغ"
      contradicts:
        - text: "«عملية تنظيف يتم فيها شفط هواء مُكيّف الهواء بالكامل»"
          source: "مسرد هندسة السيارات (ARABTERM)"
          conflict: "المعنى المعجمي المثبَت هو الإخلاء والتصريف المادي، لا النقل الكتابي"
        - text: "«(فَرَغَ) الْفَاءُ وَالرَّاءُ وَالْغَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خُلُوٍّ وَسَعَةِ ذَرْعٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الاشتقاقي يدل على الخلو والفراغ، ومعنى تفريغ المسموع إلى مكتوب توسّع حديث غير مثبَت معجمياً"

    - lemma: "اسْتِنْسَاخ"
      confirm:
        - text: "«نَسَخَ الشيءَ يَنْسَخُه نَسْخاً، وانتسخه واستنسخه: اكتتبه عَن مُعارضة»"
          source: "المحكم والمحيط الأعظم لابن سيده"
      contradicts:
        - text: "«كائنات متطابقة بالنسبة لكل المجموع المُوَرِّثي — clone»"
          source: "مسرد المناخ والبيئة (ARABTERM)"
          conflict: "في الاستعمال الحديث غلب معنى الاستنساخ البيولوجي (cloning) على معنى النقل الكتابي"
        - text: "«تعدد النسخ في اللوحات والطباعة والنحت — copying»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM)"
          conflict: "يُستخدم بمعنى copying العام لا transcription الخاص"

    - lemma: "نُسْخَة"
      confirm:
        - text: "«النُسْخَةُ بالضم: اسم المُنْتَسَخِ منه»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      contradicts:
        - text: "«(1) نسخة عن رسالة أو وثيقة؛ نسخة طبق الأصل (2) السِّجِلُّ المدرسي = transcript»"
          source: "المورد الحديث"
          conflict: "النُسْخَة تقابل transcript (الوثيقة) لا transcription (العملية أو نتاجها)، والمجموعة عن transcription لا transcript"


stage3_analysis:
  per_lemma:
