# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل"
      - "لمّة «ظروف مادية» تستخدم «مادية» (المادة والشأن المادي الأشمل) عوضاً عن «مالية» (الشأن المالي تحديداً)، مما يُحدث اتساعاً دلالياً غير مقصود إذ يمكن أن تشمل «المادية» الجوانب المادية غير المالية"
      - "التعريف الحالي يستخدم «الوضع المالي» كجنس قريب، وهو في الوقت ذاته مرشح قوي للمّة، مما قد يُفضي إلى دور في التعريف إن أُضيف"
      - "المفهوم محدود بـ«الشخص» (الفرد) في التعريف الإنجليزي بينما يُقبل عربياً للمؤسسات أيضاً"
    observations: >
      كلتا اللمّتين الموجودتين تعبيران مركّبان وصفيّان (MWE) من النمط الوصفي، واسعا
      الانتشار في العربية المعاصرة الرسمية والصحفية. والمفهوم موغلٌ في الثقافة العربية
      الإسلامية إذ يرتبط بأحكام الإعسار واليسار والزكاة، وله تقليد معجمي ثريّ. وقد
      أفادت المطالعة الأوّلية أن الجنس المباشر «حيازة/ملكية» ينحو نحو ما يتملّكه
      الشخص لا نحو حالته المالية الكلية التي تشمل الديون والالتزامات كذلك.

  blind_candidates:
    - lemma: "مَالِيَّةٌ"
      generation_method: ishtiqaq
      justification: "اشتقاق المصدر الصناعي (فَعَلِيَّة) من جذر م-و-ل للدلالة على الشأن المالي بوجه عام، نظير «عسكرية» و«صناعية»"

    - lemma: "وَضْعٌ مَالِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «وضع» (الحالة/المكانة) و«مالي» (النسبة للمال)، وهو الصيغة الأكثر دقةً ومطابقةً للمفهوم في العربية المعاصرة"

    - lemma: "يَسَارٌ"
      generation_method: majaz
      justification: "استُعمل «يسار» في العربية الكلاسيكية دلالةً على الغنى والرخاء، ومجازاً مجازاً على الحالة المالية بشكل عام وفق قانون الإحياء الدلالي للألفاظ"

    - lemma: "مَرْكَزٌ مَالِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي مُركَّب من «مركز» (الموضع/المقام) و«مالي» (النسبة للمال)، شائع في لغة التجارة والمحاسبة للدلالة على المقام المالي للشخص أو الجهة"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة (٦ استعلامات):
#   Q1: المطابقة الدقيقة الدفعية لجميع اللمّات والمرشّحات
#   Q2: الإثراء بالمعرّف (تعريفات + أمثلة)
#   Q3: الجسر الإنجليزي (circumstances / financial situation / financial position)
#   Q4: البحث بالكلمات المفتاحية (وضع مالي، أحوال مالية، مركز مالي، يسار)
#   Q5: مقاييس اللغة (حول، مول، ظرف، وضع، مدد، ركز)
#   Q6: مقاييس مكمّل (مدد، ركز)
stage2_evidence:
  per_lemma:
    - lemma: "أَحْوَالٌ مَالِيَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "ظُرُوفٌ مَادِّيَّةٌ"
      expands:
        - text: "«ظروف مادية واقتصادية في منطقة تتسبب في خفض أو عدم إمكانية الاستخدام السليم لتلك المنطقة. منطقة منكوبة هي منطقة تدهورت أو تم توقيف تطورها من قبل قوى مادية أو اقتصادية، أو اجتماعية.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ARABTERM)"
          addition: "يُثبت الاستعمالُ الاصطلاحيَّ لـ«ظروف مادية» في السياق الاقتصادي، غير أنّه يُقرنها بـ«اقتصادية» مما يُشير إلى أن «المادية» وحدها أوسع دلالةً من «المالية»"

    - lemma: "مَالِيَّةٌ"
      contradicts:
        - text: "«finance» (translation_en)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM)"
          conflict: "الترجمة الإنجليزية المقابلة هي «finance» (علم المالية/التمويل) لا «financial situation» (الوضع المالي للشخص)؛ المفهومان مختلفان جنساً ونوعاً"
        - text: "«finance» (translation_en)"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC (ARABTERM)"
          conflict: "ذات الإشكالية: «مالية» مصطلح قائم يدل على حقل المالية العامة، لا على حالة الشخص المالية"

    - lemma: "وَضْعٌ مَالِيٌّ"
      confirm:
        - text: "«financial situation» (translation_en)"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC (ARABTERM)"
      expands:
        - text: "«(٤-ج) مركز؛ وضعٌ ماليّ [لمضارِب في البورصة]»"
          source: "المورد الحديث ٢٠٠٨ (ARABTERM)"
          addition: "يُثبت استعمال «وضع مالي» بالتحديد للدلالة على المقام المالي، وإن كان السياق بورصياً فإن المبدأ اللغوي يسري على الشخص عموماً"
        - text: "«financial standing» (translation_en لـ «مركز المالي» بمعنى الوضع)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM)"
          addition: "يؤكد أن حقل المال والمحاسبة يستعمل «الوضع» و«المركز» متقاربَين في الدلالة على المقام المالي"

    - lemma: "يَسَارٌ"
      contradicts:
        - text: "«(الْيَسَار) السهولة أَو الْيُسْر والغنى والثروة وَالسعَة والرخاء وَخلاف الْيَمين...»"
          source: "المعجم الوسيط (hawramani)"
          conflict: "«يسار» يدل حصراً على الحالة الماليّة الحسنة (الغنى والسعة والرخاء) دون أن يشمل الحالة السيئة؛ يناقض اشتراط التعريف «جيداً كان أو سيئاً»"
        - text: "«السُّهولةُ أو اليُسر / الغِنَى والثروة والسَّعة والرَّخاء»"
          source: "المعجم الوسيط (OCR)"
          conflict: "تأكيد آخر: الكلمة إيجابية الدلالة (يُسر وغنى) لا تشمل الإعسار أو الضيق المالي"
        - text: "«واليسار الغنى»"
          source: "معجم البلدان لياقوت الحموي (hawramani)"
          conflict: "المصدر الكلاسيكي يُصرّح: «اليسار = الغنى» دون ذكر الحالة السلبية"

    - lemma: "مَرْكَزٌ مَالِيٌّ"
      confirm:
        - text: "«financial position» (translation_en)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM)"
      contradicts:
        - text: "«مركز المالي» = الوضع (translation for entity context)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM)"
          conflict: "«مركز مالي» مصطلح محاسبي يُستعمل في الغالب للمؤسسات والشركات (Financial Position = ميزانية عمومية)، لا للأفراد في سياق الحياة اليومية؛ لا يُطابق التوجيه الشخصي للمجموعة"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "أَحْوَالٌ مَالِيَّةٌ"
      decision: confirmed
      decision_reason: >
        تعبير وصفي مركّب راسخ في العربية المعاصرة الرسمية والصحفية للدلالة على الأوضاع
        المالية للشخص أو الأسرة. يجتاز اختبار السكّ: «الأحوال المالية» وحدة معجمية ثابتة
        لا تقبل إبدال «مالية» بـ«نقدية» أو «اقتصادية» بالمعنى ذاته. غياب المداخل المعجمية
        الكلاسيكية متوقَّع للمركّبات الوصفية الحديثة. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركّز على «الأحوال» بصيغة الجمع ممّا يُشير إلى تعدّد الأوضاع المالية وتشعّبها
        وتقلّبها؛ أكثر شيوعاً في الخطاب الرسمي والإداري والصحفي للإحاطة بمجمل الوضع
        المالي من زوايا متعددة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَحْوَالٌ مَالِيَّةٌ"

    - lemma: "ظُرُوفٌ مَادِّيَّةٌ"
      decision: confirmed
      decision_reason: >
        تعبير وصفي مركّب شائع في السياق الاجتماعي والإنساني للإشارة إلى الضائقة أو
        الرفاهية المالية. رغم أن «مادية» أشمل من «مالية» دلالةً، فإن الاستعمال الفعلي
        يُخصّصها في سياق الأشخاص للدلالة على الحالة المالية تحديداً. أدلّة الاستعمال
        من المعاجم المتخصصة تُثبت التوظيف الاصطلاحي. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُلمح إلى الضغوط والملابسات الخارجية (الظروف) ذات الطابع المادي والمعيشي؛
        يشيع في السياق الإنساني والاجتماعي للتعبير عن صعوبات الحياة المادية أو اليسر
        فيها، ويحمل نبرةً أكثر تعاطفاً من «أحوال مالية»
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ظُرُوفٌ مَادِّيَّةٌ"

    - lemma: "مَالِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «مالية» كمصطلح قائم تدل على حقل المالية العامة والتمويل (finance) لا على الحالة
        المالية للشخص. الأدلة المعجمية تُثبت هذا المعنى الراسخ (Commerce, AGROVOC).
        قبولها في هذه المجموعة يُوقع في اشتراك لفظي مضرّ.

    - lemma: "وَضْعٌ مَالِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مدعوم بأدلة معجمية مباشرة: «الوضع المالي» = «financial situation» في AGROVOC.
        تعبير دقيق ومحدد يدل على المقام المالي اللحظي للشخص. يجتاز اختبار السكّ:
        «الوضع المالي» وحدة اصطلاحية ثابتة. يُكمّل اللمّتَين الموجودتَين بالدلالة
        على المكانة المالية الكلية من زاوية واحدة متماسكة لا متشعّبة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يدل على المقام المالي الكلي للشخص في لحظة بعينها؛ أكثر دقةً وإحكاماً من
        «أحوال مالية»، ويُستعمل في السياق التقني والمهني (تقارير، استمارات، تقييمات)
        حيث يُطلب وصف موحّد للحالة المالية
      actions:
        - command: create_entry
          params:
            lemma: "وَضْعٌ مَالِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "يَسَارٌ"
      source: stage1
      decision: removed
      decision_reason: >
        جميع المصادر الكلاسيكية والمعاصرة تُجمع على أن «يسار» يدل على الغنى والسعة
        والرخاء (الحالة المالية الحسنة) دون أن يشمل الإعسار والضيق. يناقض صراحةً
        قيد التعريف «جيداً كان أو سيئاً». لا يصلح للتعبير عن المفهوم المحايد.

    - lemma: "مَرْكَزٌ مَالِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «مركز مالي» مصطلح محاسبي مُختصّ بالمؤسسات (Statement of Financial Position)
        ولا يُستعمل عادةً للأفراد في سياق الحياة اليومية. الأدلة المعجمية تُثبته في
        حقل التجارة والمحاسبة للجهات لا للأشخاص. المجموعة الترادفية تُعرَّف بالشخص
        الفرد؛ كذلك يُغني عنه «وضع مالي» في السياق العلمي.


