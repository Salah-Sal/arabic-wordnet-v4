stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «لغة فوقية» مركب وصفي غير مسجّل بهيئته هذه في أي معجم لساني موحّد؛ المعجم الموحد لمصطلحات اللسانيات (2002) يستعمل «لغة طارئة (فوقية)» لا «لغة فوقية» وحدها"
      - "المجموعة تفتقر إلى مرادف ثانٍ يُغطّي البُعد الزمني للمفهوم (لغة طارئة على السكان الأصليين)"
      - "التعريف العربي الحالي يحتاج تحسيناً: عبارة «تساهم بخصائص في لغتهم» فضفاضة وتفتقر للدقة المصطلحية"
    observations: "المفهوم ينتمي إلى علم اللسانيات التاريخي (اللغويات التاريخية)، ويصف الطبقة اللغوية التي يفرضها شعب غازٍ على لغة السكان الأصليين دون أن تحلّ محلها بالكامل، بل تترك أثراً معجمياً وتركيبياً. المصطلح يقابل substratum (لغة المنشأ/الطبقة السفلى) ويقع في ثنائية مع adstratum (طبقة إضافية). التعبير العربي يحتاج لفظاً يجمع بين مفهوم العلو/الفرض ومفهوم الطروء/الغزو."

  blind_candidates:
    - lemma: "لُغَة طَارِئَة"
      generation_method: tarkib
      justification: "مركب وصفي من «لغة» + «طارئة» (اسم فاعل من طرأ: حدث فجأة)؛ يُعبّر عن مفهوم اللغة الوافدة المفروضة من الخارج على بيئة لغوية قائمة"
    - lemma: "طَبَقَة فَوْقِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «طبقة» + «فوقية»؛ ترجمة حرفية لـ superstratum (طبقة عليا)، يُركّز على البُعد الهرمي للمفهوم"
    - lemma: "لُغَة غَازِيَة"
      generation_method: tarkib
      justification: "مركب وصفي من «لغة» + «غازية» (اسم فاعل من غزا)؛ يُبرز السمة الجوهرية وهي أنها لغة شعب غازٍ"
    - lemma: "سُوبِرِسْتْرَاتُم"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح اللاتيني superstratum المستعمل دولياً في اللسانيات التاريخية؛ يقبل لام التعريف والجمع"


stage2_evidence:
