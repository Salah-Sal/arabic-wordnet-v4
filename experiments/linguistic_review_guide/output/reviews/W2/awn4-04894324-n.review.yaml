# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة «خلاء» تبدو ترجمة حرفية خاطئة للفظ (vanity) بمعناه الفيزيائي (الفراغ) وليس بمعناه الأخلاقي (العُجب)."
      - "نقص في المرادفات المركزية مثل «عُجْب» و«خُيَلَاء»."
    observations: "المجموعة تحتاج إلى تنقية من الألفاظ الدخيلة دلالياً وإثراء بالألفاظ التراثية الدقيقة التي تفرق بين درجات الاعتداد بالنفس."
  blind_candidates:
    - lemma: "عُجْب"
      generation_method: ishtiqaq
      justification: "اللفظ الأصيل للتعبير عن إعجاب المرء بنفسه واستعظام خِصاله."
    - lemma: "صَلَف"
      generation_method: ishtiqaq
      justification: "يدل على التمدح بما ليس عند المرء تكبراً ومجاوزة قدر الظرف."
    - lemma: "زَهْو"
      generation_method: ishtiqaq
      justification: "الفخر والكبر والاستطارة من الفرح بالنفس."
    - lemma: "خُيَلَاء"
      generation_method: ishtiqaq
      justification: "التكبر الذي يظهر في الهيئة والمشية (الاختيال)."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "خلاء"
      evidence_status: "no_material_found"
      contradicts:
        - text: "«الخَلاءُ: أَلا يكون بَين الجسمين المتباعدين مَا يلاقيانه، وَقيل: هُوَ أبعاد مُجَرّدَة عَن الْمَادَّة»"
          source: "مقاليد العلوم"
          conflict: "اللفظ مخصص للفراغ الفيزيائي أو المكان الخالي، ولا يستعمل صفة للمغرور."
    - lemma: "غُرُور"
      confirm:
        - text: "«الغرور: هو سكون النفس إلى ما يوافق الهوى، ويميل إليه الطبع.»"
          source: "التعريفات للجرجاني"
        - text: "«عُجْب: كِبْر وزهو وغرور، إعجابُ الشَّخصِ بنفسه»"
          source: "اللغة العربية المعاصرة"
    - lemma: "عُجْب"
      confirm:
        - text: "«الْعُجْبُ، وَهُوَ أَنْ يَتَكَبَّرَ الْإِنْسَانُ فِي نَفْسِهِ. تَقُولُ: هُوَ مُعْجَبٌ بِنَفْسِهِ.»"
          source: "مقاييس اللغة"
        - text: "«عُجْب: ... كِبْر وزهو وغرور، إعجابُ الشَّخصِ بنفسه»"
          source: "اللغة العربية المعاصرة"
    - lemma: "خُيَلَاء"
      confirm:
        - text: "«الخُيَلاءُ: أَن يظنّ نَفسه مَا لَيْسَ فِيهَا.»"
          source: "مقاليد العلوم"
        - text: "«الخُيلاء: التكبر والعجب»"
          source: "المعجم الوسيط"
    - lemma: "زَهْو"
      confirm:
        - text: "«الزَّهْوُ: الكِبْرُ، والتيهُ، والفَخرُ»"
          source: "القاموس المحيط"
        - text: "«الزَّهْوُ: الاستطارة من الْفَرح بِنَفسِهِ.»"
          source: "مقاليد العلوم"
    - lemma: "صَلَف"
      confirm:
        - text: "«الصَّلَفُ: مُجَاوَزَةُ قَدْرِ الظَّرْفِ والبَزاعَةِ، والادِّعاءُ فوقَ ذَلِك تَكَبُّراً»"
          source: "تاج العروس"
        - text: "«صلِف الشَّخصُ: ادَّعى ما فوق قَدْره عُجْبًا وتكبُّرًا»"
          source: "اللغة العربية المعاصرة"
    - lemma: "تِيه"
      confirm:
        - text: "«التِّيهُ، بالكسر: الصَّلَفُ، والكِبْرُ»"
          source: "القاموس المحيط"
    - lemma: "اعْتِدَاد بالنَّفْس"
      confirm:
        - text: "«العُجْب؛ الغرور؛ الاعتداد بالنفس.»"
          source: "المورد الحديث (ترجمة self-conceit)"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "خلاء"
      decision: removed
      decision_reason: "خطأ دلالي فادح؛ اللفظ في العربية يعني الفراغ أو المكان الخالي، واستعماله بمعنى الغرور هو ترجمة حرفية خاطئة للفظ (vanity) الإنجليزي."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "غُرُور"
      decision: confirmed
      decision_reason: "لفظ مستقر في الاستعمال المعاصر ليدل على التعالي والانخداع بالذات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غُرُور"
    - lemma: "عُجْب"
      source: stage1
      decision: confirmed
      decision_reason: "أدق مصطلح عربي يعبر عن 'self-admiration' (إعجاب الشخص بنفسه)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "عُجْب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خُيَلَاء"
      source: stage1
      decision: confirmed
      decision_reason: "يدل على التكبر المقترن بهيئة خارجية وتصرفات متعالية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خُيَلَاء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "زَهْو"
      source: stage1
      decision: confirmed
      decision_reason: "يعبر عن الفخر والخيلاء والسرور المفرط بالذات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "زَهْو", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "صَلَف"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي قوي يدل على مجاوزة القدر والادعاء تكبراً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "صَلَف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تِيه"
      source: stage1
      decision: confirmed
      decision_reason: "يدل على التكبر الذي يجعل صاحبه كالتائه المنفصل عن الواقع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تِيه", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "اعْتِدَاد بالنَّفْس"
      source: stage1
      decision: confirmed
      decision_reason: "مركب شائع في السياقات التربوية والنفسية ليدل على الثقة المفرطة التي قد تصل حد الغرور."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "اعْتِدَاد بالنَّفْس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "سمة كون المرء مغروراً ومعجباً بنفسه بشكل مفرط؛ كبرياء زائف"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يفتقر إلى الجنس القريب والجزالة المعجمية."
    authored:
      - type: terminological
        text: "خُلُقٌ نَفْسِيٌّ يَتَمَيَّزُ فيهِ المَرْءُ بالاسْتِكْبارِ والاعْتِدادِ المُفْرِطِ بالذَّاتِ، ورُؤْيَةِ التَّفَوُّقِ على الآخَرينَ بغيرِ حَقٍّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "عُجْب"
        examples:
          - text: "أَوْدَى بهِ العُجْبُ بنَفْسِهِ إلى تَرْكِ مَشاورةِ العُقَلاءِ."
            type: usage
      - lemma: "خُيَلَاء"
        examples:
          - text: "كانَ يَمْشِي في النّاسِ بخُيَلَاءَ وكأَنَّهُ لا يَرَى أَحَداً غَيْرَهُ."
            type: usage
      - lemma: "غُرُور"
        examples:
          - text: "أَعْمَاهُ الغُرُورُ عن رُؤيةِ عُيوبِهِ القاتِلَةِ."
            type: usage
      - lemma: "زَهْو"
        examples:
          - text: "تَحَدَّثَ عن إنجازاتِهِ بزَهْوٍ شديدٍ جَعَلَ الحاضرينَ ينفرونَ منهُ."
            type: usage
      - lemma: "صَلَف"
        examples:
          - text: "واجَهَ طَلَبَ المُساعدةِ بصَلَفٍ وتَكَبُّرٍ لا يَلِيقانِ بمكانَتِهِ."
            type: usage
      - lemma: "تِيه"
        examples:
          - text: "يَعِيشُ في تِيهٍ يَمْنَعُهُ من قَبُولِ النَّصِيحَةِ."
            type: usage

# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    - lemma: "عُجْب"
      entry_id: "{auto}"
      root: "عجب"
      maqayis_quote: "«الْعَيْنُ وَالْجِيمُ وَالْبَاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى كِبْرٍ وَاسْتِكْبَارٍ لِلشَّيْءِ... فَالْأَوَّلُ الْعُجْبُ، وَهُوَ أَنْ يَتَكَبَّرَ الْإِنْسَانُ فِي نَفْسِهِ.»"
    - lemma: "خُيَلَاء"
      entry_id: "{auto}"
      root: "خيل"
      maqayis_quote: "«الْخَاءُ وَالْيَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَرَكَةٍ فِي تَلَوُّنٍ... لِاخْتِيَالِهَا. فَقَالَ الْأَعْرَابِيُّ: لِاخْتِيَالِهَا. فَقَالَ أَبُو عَمْرٍو: اكْتُبُوا. وَهَذَا صَحِيحٌ ; لِأَنَّ الْمُخْتَالَ فِي مِشْيَتِهِ يَتَلَوَّنُ فِي حَرَكَتِهِ أَلْوَانًا.»"
    - lemma: "زَهْو"
      entry_id: "{auto}"
      root: "زهو"
      maqayis_quote: "«الزَّاءُ وَالْهَاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى كِبْرٍ وَفَخْرٍ، وَالْآخَرُ عَلَى حُسْنٍ. فَالْأَوَّلُ الزَّهْوُ، وَهُوَ الْفَخْرُ.»"
    - lemma: "صَلَف"
      entry_id: "{auto}"
      root: "صلف"
      maqayis_quote: "«الصَّادُ وَاللَّامُ وَالْفَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى شِدَّةٍ وَكَزَازَةٍ. مِنْ ذَلِكَ الصَّلَفُ... يُقَالُ ذَلِكَ لِمَنْ يُكْثِرُ كَلَامَهُ وَيَمْدَحُ نَفْسَهُ وَلَا خَيْرَ عِنْدَهُ.»"
    - lemma: "تِيه"
      entry_id: "{auto}"
      root: "تيه"
      maqayis_quote: "«التَّاءُ وَالْيَاءُ وَالْهَاءُ، كَلِمَةٌ صَحِيحَةٌ، وَهِيَ جِنْسٌ مِنَ الْحَيْرَةِ، وَالتِّيهُ وَالتَّيْهَاءُ: الْمَفَازَةُ يَتِيهُ فِيهَا الْإِنْسَانُ.»"
    - lemma: "غُرُور"
      entry_id: "{auto}"
      root: "غرر"
      maqayis_quote: "«الْغَيْنُ وَالْرَّاءُ أُصُولٌ ثَلاثَةٌ صَحِيحَةٌ... وَمِمَّا يُقَارِبُ هَذَا: الْغَرَارَةُ، وَهِيَ كَالْغَفْلَةِ... فَأَمَّا الْمَذْمُومُ مِنْ ذَلِكَ فَهُوَ مِنَ الْأَصْلِ الَّذِي قَبْلَ هَذَا ; لِأَنَّهُ مِنْ نُقْصَانِ الْفِطْنَةِ.»"
    - lemma: "اعْتِدَاد بالنَّفْس"
      entry_id: "{auto}"
