# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (بلاغة، خطابة) خاليتان من التشكيل — يستلزم الأمر تحديث كليهما بتشكيل كامل"
      - "دلالة (خطابة) أضيق من دلالة (بلاغة) إذ تنصبّ على الإلقاء الجماهيري والقياس المنطقي في الاصطلاح، وهو ما قد يُضيّق المجال الدلالي للمجموعة"
      - "التعريف الحالي «استخدام اللغة بفعالية للإمتاع أو الإقناع» مترجمٌ بشكل مباشر ولا يُحاكي أسلوب المعجم الوسيط"
    observations: >
      المجموعة تضمّ مصطلحَين عربيَّين أصيلَين راسخَين في الاستعمال الكلاسيكي والحديث. بَلَاغَة هي المصطلح المحوري
      المقابل لـ rhetoric الإنجليزية بكل أبعادها الجمالية والإقناعية، وهو الأشيع في المعاجم والدراسات. أمّا خَطَابَة
      فتنحو في المعجمية الكلاسيكية نحو فنّ مخاطبة الجماهير وإقناعهم بالقياس، وقد وُصفت في الاصطلاح المنطقي بأنّها
      «صناعة تفيد الإقناع». كلا المصطلحين صحيح الانتماء إلى هذه المجموعة مع تمييز دقيق في التركيز. المرشّحات
      المولَّدة أدناه تستوعب محاور التعريف: البيان والفصاحة من جانب الجمال، والإقناعية من جانب الإقناع.

  blind_candidates:
    - lemma: "بَيَان"
      generation_method: ishtiqaq
      justification: >
        من جذر (بيَنَ) على وزن فَعَال، مصدرٌ يدلّ على الإفصاح وإيضاح المعنى وإيصاله إلى المتلقي بأبلغ صورة.
        استُعمل تاريخياً مرادفاً للبلاغة في كثير من النصوص: «تسمّى بالبراعة والبيان والفصاحة أيضاً».
    - lemma: "فَصَاحَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (فَصَحَ) على وزن فَعَالَة، يدلّ على خلوص الكلام وجودته وطلاقة اللسان. مرتبطٌ ارتباطاً وثيقاً
        بالتعريف من جهة «الإمتاع» اللغوي، وقد وُرد مرادفاً للبلاغة في أكثر من مصدر.
    - lemma: "إِقْنَاعِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من (أقنعَ) بإلحاق ياء النسبة وتاء التأنيث، يُحوّل المفهوم إلى وحدة مجرّدة تعني
        «قدرة الإقناع» — يستوعب الشقّ الإقناعي من التعريف «للإقناع».
    - lemma: "حُسْنُ الإِفْصَاح"
      generation_method: tarkib
      justification: >
        تركيب إضافي من (حُسْن) و(الإِفْصَاح)، يُجسّد معنى «التعبير الفعّال الجميل»، ويستوعب الجمع
        بين الإمتاع والإقناع بأسلوب عربي مألوف.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "بلاغة"
      confirm:
        - text: "«حسن البيان وقوة التأثير؛ (عند علماء البلاغة): مطابقة الكلام لمقتضى الحال مع فصاحته»"
          source: "المعجم الوسيط (مجمع اللغة العربية، OCR)"
        - text: "«البيان الواضح؛ عند البلاغِيّين: مُطابقة الكلام لمقتضى الحال، مع فصاحة مفرداته، ويوصف بها الكلام والمتكلّم؛ وبلاغة المتكلّم: مَلَكَةٌ يُقْتَدَر بها على تأليف كلام بليغ»"
          source: "المعجم الكبير (مجمع اللغة العربية، OCR)"
        - text: "«تقنيات وصور تهدف إلى الإقناع عبر التعبير الأدبي وطرقه الأسلوبية، وهي وسيلة تبليغ الخطاب» [translation_en: rhetoric]"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM، 2002)"
        - text: "«(1) علم البلاغة أو البيان (2) بلاغة (3) فنّ الخطابة (4) فنّ النثر (5) لغة منمَّقة أو طنّانة» [translation_en: rhetoric]"
          source: "المورد الحديث (ARABTERM، 2008)"
        - text: >
            «بالياء المثناة يطلق على معنيين: أحدهما بلاغة الكلام وتسمّى بالبراعة والبيان والفصاحة أيضاً،
            وهي مطابقة الكلام لمقتضى الحال مع فصاحته... وثانيهما بلاغة المتكلم وهي ملكة يقتدر بها على
            تأليف كلام بليغ»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (Hawramani)"

    - lemma: "خطابة"
      confirm:
        - text: "«(في الأدب العربي): مخاطبة الجماهير، والتأثير في مشاعرهم. فن الخطابة: قواعد يلتزم الخطيب بها أثناء إلقائه الخطبة أمام الجمهور، كرفع الصوت وخفضه، ومراعاة الصور البلاغية»"
          source: "المعجم الكبير (مجمع اللغة العربية، OCR)"
        - text: "«هِيَ صناعَة تفيد الإقناع لتركّبها من مقدّمات مقبولة»"
          source: "دستور العلماء للأحمدنكري (Hawramani)"
        - text: "«بمعنى التأثير بالبيان... والغرض منه ترغيب الناس فيما ينفعهم من أمور معاشهم ومعادهم كما يفعله الخطباء والوعاظ»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (Hawramani)"
        - text: "«(1) الخَطابة (2) خُطبة؛ خطاب (3) لغة منمَّقة» [translation_en: oratory]"
          source: "المورد الحديث (ARABTERM، 2008)"
      contradicts:
        - text: "«(عند المنطقيين): قياس مؤلف من المظنونات أو المقبولات»"
          source: "المعجم الوسيط (مجمع اللغة العربية، OCR)"
          conflict: >
            هذا المعنى المنطقي يُضيّق دلالة خطابة على نوع من أنواع القياس الاحتمالي، وهو لا يُغطي
            «الإمتاع» المذكور في التعريف، ولا البُعد الجمالي لاستخدام اللغة.

    - lemma: "بَيَان"
      confirm:
        - text: "«في الانكليزية: Eloquence, rhetoric»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (Hawramani)"
        - text: "«(الْبَيَان) الحجة والمنطق الفصيح والكلام يكشف عن حقيقة حال أو يحمل في طياته بلاغاً وعلم يعرف به إيراد المعنى الواحد بطرق مختلفة من تشبيه ومجاز وكناية»"
          source: "المعجم الوسيط الحديث (Hawramani)"
      contradicts:
        - text: "«علم البيان: علم يُعرف به إيراد المعنى الواحد المدلول عليه بكلام مطابق لمقتضى الحال بطرق مختلفة في وضوح الدلالة»"
          source: "دستور العلماء للأحمدنكري (Hawramani)"
          conflict: >
            يُشير هذا النص إلى أنّ البيان في الاصطلاح البلاغي يُطلق تحديداً على أحد فروع البلاغة الثلاثة
            (المعاني، البيان، البديع)، وليس على البلاغة في مجملها — مما يُضيّق مجاله عن دلالة المجموعة.

    - lemma: "فَصَاحَة"
      confirm:
        - text: "«صياغة المعاني بقوة بيانية وتأثيرية بطرق مختلفة عبر بلاغة فصاحة إلى حد التفيهق» [translation_en: oratory]"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM، 2002)"
      contradicts:
        - text: "«(الفصاحة): البيان وسلامة الألفاظ من الإبهام وسوء التأليف»"
          source: "المعجم الوسيط الحديث (Hawramani)"
          conflict: >
            فصاحة في هذا التعريف تُعنى بجودة الألفاظ وسلامة التركيب (الجانب الشكلي)، لا بالتأثير
            والإقناع، ومن ثَمّ هي شرطٌ مسبق للبلاغة لا مرادف لها.
      expands:
        - text: "«الفصاحة لغةً تنبئ عن الإبانة والظهور... وعند أهل المعاني تطلق على معانٍ... ومنها وصف في الكلام به يقع التفاضل ويثبت الإعجاز، وعليه يطلق البراعة والبلاغة والبيان»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (Hawramani)"
          addition: "يكشف أنّ فصاحة تُطلق في استعمال بعض العلماء مرادفةً للبلاغة بمعناها الأوسع، غير أنّ الاصطلاح الغالب يُفرّق بينهما"

    - lemma: "إِقْنَاعِيَّة"
      contradicts:
        - text: "«شكل من أشكال العمل الإدراكي، يستهدف اكتساب قبول المتلقي عبر برنامج (سردي أو نمطي أو معقد)» [translation_en: persuasive]"
          source: "المعجم الموحد لمصطلحات اللسانيات (ARABTERM، 2002)"
          conflict: >
            الترجمة الإنجليزية «persuasive» تُعيّن المفهوم صفةً لا اسماً، والتعريف يصفها بأنّها نوع من «العمل
            الإدراكي» لا فنّاً قولياً. كلاهما يبعد عن دلالة المجموعة التي تُعنى بالفنّ القولي الشامل.

    - lemma: "حُسْنُ الإِفْصَاح"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "بلاغة"
      decision: confirmed
      decision_reason: >
        بَلَاغَة هي المصطلح العربي الأصيل والأشمل المقابل لـ rhetoric، وهي موثّقة في المعجم الوسيط
        والمعجم الكبير وكشّاف اصطلاحات الفنون والمعجم الموحد للمصطلحات (ARABTERM). تُغطّي
        الجانبَين معاً: الإمتاع الجمالي والإقناع الحجاجي. الجذر (بلغ) يُفيد «الوصول إلى الغاية» وهو
        الأساس المعنوي لبلاغة التعبير. لا إشكال في POS ولا في الاستعمال.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        بَلَاغَة هي المصطلح الجامع لفنون توظيف اللغة توظيفاً فعّالاً؛ تشمل علوم المعاني والبيان والبديع،
        وتُعنى بالجمال اللغوي والإقناع في آنٍ، وهي أشمل من خطابة التي تتمركز حول الخطاب الشفهي الجماهيري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَلَاغَة"

    - lemma: "خطابة"
      decision: confirmed
      decision_reason: >
        خَطَابَة مصطلحٌ عربي صحيح ومعترف به للدلالة على فنّ التأثير في المستمعين وإقناعهم من خلال الكلام،
        وهو ما يتوافق مع الشقّ الإقناعي للتعريف. المعجم الكبير يُعرّفها في الأدب العربي بأنّها «مخاطبة
        الجماهير والتأثير في مشاعرهم»، ودستور العلماء يُعرّفها بأنّها «صناعة تفيد الإقناع». أمّا
        المعنى المنطقي الضيّق (القياس من المظنونات) فهو معنى اصطلاحي إضافي لا يُلغي الدلالة الأدبية
        الموافقة للمجموعة. تستوعب خطابة بصفة خاصة «الإقناع» الجماهيري.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        خَطَابَة تتمركز حول الأداء اللغوي الشفهي الموجَّه نحو الجمهور وإقناعه وتحريك مشاعره، وهي أقرب
        إلى "oratory" في دلالتها المركزية. تفترق عن بَلَاغَة بتركيزها على الخطاب الجماهيري الشفهي
        دون البُعد الجمالي الأوسع لعلوم البلاغة المكتوبة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَطَابَة"

    - lemma: "بَيَان"
      source: stage1
      decision: removed
      decision_reason: >
        بَيَان في الاصطلاح البلاغي يُطلق تحديداً على أحد فروع البلاغة الثلاثة (علم البيان: التشبيه،
        المجاز، الكناية)، وهو أخصّ من المجموعة. وفي الاستعمال العام يُعنى بالإيضاح والكشف عن المعنى
        لا بالتأثير الجمالي والإقناع معاً. رغم وروده مرادفاً للبلاغة في بعض النصوص الكلاسيكية، فإنّه
        غير كافٍ للتمييز عن اللمّات الموجودة ولا للتعبير عن «الإمتاع» الجمالي. لا حاجة إلى إضافته
        مع وجود بَلَاغَة التي تُغطّي المفهوم تغطيةً تامّة.

    - lemma: "فَصَاحَة"
      source: stage1
      decision: removed
      decision_reason: >
        فَصَاحَة تُعنى بجودة اللفظ وسلامة التركيب ونقاء التعبير، وهي شرطٌ مسبق للبلاغة لا مرادف لها.
        التعريف المعجمي «سلامة الألفاظ من الإبهام وسوء التأليف» يُبيّن أنّها مُتعلّقة بالبُعد الشكلي
        للكلام دون بُعدَي الإمتاع والإقناع. المعجم يُصرّح: «البلاغة أخصّ مطلقاً من الفصاحة، فكل بليغ
        فصيح ولا عكس» — أي أن فصاحة أعمّ وأقل تخصيصاً من بلاغة.

    - lemma: "إِقْنَاعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصدر الصناعي «إقناعية» يُعبّر عن الصفة الإقناعية لا عن فنّ قولي شامل. الأدلة المعجمية
        تُعرّفها «صفةً» للعمل الإدراكي وليس فنّاً. وحتى في المعنى الأوسع لا تُغطّي الشقّ الجمالي
        «للإمتاع»، فضلاً عن عدم تثبيتها معجمياً كمرادف للبلاغة.

    - lemma: "حُسْنُ الإِفْصَاح"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ المصطلحي: يمكن إبدال «حُسْن» بـ«جماليات» أو «براعة» ويبقى الوصف صالحاً
        — إذن ليس مصطلحاً مسكوكاً. علاوةً على ذلك لا أثر له في المعاجم كوحدة معجمية ثابتة.


