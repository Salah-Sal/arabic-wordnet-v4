        entity_id: "{auto}"
        key: note
        value: '{"root":"ورث","maqayis":"«(وَرَثَ) الْوَاوُ وَالرَّاءُ وَالثَّاءُ: كَلِمَةٌ وَاحِدَةٌ، هِيَ الْوِرْثُ. وَالْمِيرَاثُ أَصْلُهُ الْوَاوُ.»"}'
