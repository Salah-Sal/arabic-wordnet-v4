# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-15260337-n (attosecond)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «أتوثانية» بدون تشكيل — تحتاج ضبطاً كاملاً"
      - "التعريف العربي يستعمل «كوينتيليون» وهو تعريب غير مألوف؛ يمكن الاكتفاء بالرقم العلمي"
      - "المجموعة تحتوي لمّة واحدة فقط — فقيرة مصطلحياً"
    observations: "المجموعة تمثّل وحدة قياس زمنية متناهية الصغر (١٠⁻¹⁸ ثانية) تُستخدم في فيزياء الأتوثانية وعلم الطيف فائق السرعة. المصطلح معرَّب من البادئة الدولية (atto-) المأخوذة من الدانماركية (atten = ثمانية عشر)، ملحقةً بـ«ثانية» العربية. هذا النمط (بادئة SI + وحدة) منتج ومطّرد في المصطلحية العلمية العربية (نانوثانية، ميكروثانية، فيمتوثانية...)."

  blind_candidates:
    - lemma: "أَتُّوثَانِيَة"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الدولي attosecond بدمج البادئة المعرَّبة «أتّو» مع «ثانية»؛ يوافق النمط المطّرد في تعريب وحدات SI (نانوثانية، ميكروثانية)"

    - lemma: "أَتُّو ثَانِيَة"
      generation_method: taarib
      justification: "الصيغة المفصولة (بادئة + فراغ + وحدة) الموازية لما ورد في معاجم المعلوماتية «فمتو ثانية»؛ تسهّل القراءة وتُبرز بنية المصطلح التركيبية"

    - lemma: "ثَانِيَة أَتِّيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يجعل «ثانية» موصوفاً و«أتّيّة» (نسبة إلى البادئة أتّو) صفةً؛ يوافق نمط المصطلحات الوصفية في العلوم العربية"

    - lemma: "آتُوثَانِيَة"
      generation_method: taarib
      justification: "صيغة تعريب بديلة بمدّ الألف الأولى (آتو) بدلاً من الهمزة القصيرة؛ تُقرّب النطق من الأصل الأجنبي"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "أَتُّوثَانِيَة"
      evidence_status: "no_material_found"

    - lemma: "أَتُّو ثَانِيَة"
      expands:
        - text: "«فمتو ثانية — مختصره: fs. جزء من مليون مليار من الثانية.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُثبت نمط البادئة المفصولة + ثانية في المعجمية العربية الحديثة (فمتو ثانية)، مما يدعم قياس «أتّو ثانية» عليه"

    - lemma: "ثَانِيَة أَتِّيَّة"
      evidence_status: "no_material_found"

    - lemma: "آتُوثَانِيَة"
      evidence_status: "no_material_found"

    - lemma: "ثَانِيَة"
      confirm:
        - text: "«قسمٌ من الستين قسماً التى تنقسم إليها الدقيقة الستينية»"
          source: "المعجم الوسيط"
        - text: "«قِسمٌ من سِتِّين قِسْماً تَنْقَسِمُ إليها الدَّقيقةُ السِّتِّينيَّة»"
          source: "المعجم الكبير"
        - text: "«الثّانية: عند أهل الهيئة والمنجّمين هي سدس عشر الدقيقة التي هي سدس عشر الدرجة أو الساعة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«ثانية — second / seconde — Civil Engineering»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "تثبت الاستعمال المصطلحي الحديث"
        - text: "«ثانية — second / seconde — Mathematics and Astronomy»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "تثبت الاستعمال في العلوم الدقيقة"

    - lemma: "أَتُّو (بادئة)"
      confirm:
        - text: "«اتو — atto (prefix) — Electropedia»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«سابقة بمعنى آتو (10⁻¹⁸) — atto-»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "تثبت البادئة مستقلةً في المعجمية الطبية العربية"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "أَتُّوثَانِيَة"
      decision: confirmed
      decision_reason: "مصطلح علمي دولي معرَّب بنمط مطّرد ومقبول في المصطلحية العربية (بادئة SI + وحدة). البادئة «أتّو» مسجّلة في موسوعة الكهرباء والمعجم الطبي الموحد. الدمج في كلمة واحدة هو الأشيع في الاستعمال العلمي العربي المعاصر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَتُّوثَانِيَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أَتُّو ثَانِيَة"
      source: stage1
      decision: removed
      decision_reason: "الصيغة المفصولة واردة قياساً على «فمتو ثانية» لكنّ الدمج (أتّوثانية) أشيع في الأدبيات العلمية العربية ويتّفق مع نمط نانوثانية وبيكوثانية. إضافة صيغتين لنفس المفهوم مع اختلاف إملائي فقط لا يُثري المجموعة."

    - lemma: "ثَانِيَة أَتِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي غير مسكوك ولا مسجّل في أي معجم. يخالف النمط المطّرد في تسمية فروع وحدات SI حيث تُلصق البادئة بالوحدة مباشرةً ولا تُصاغ صفةً نسبية. يفشل في اختبار السكّ والتثبيت المعجمي."

    - lemma: "آتُوثَانِيَة"
      source: stage1
      decision: removed
      decision_reason: "الصيغة بالمدّ (آتو) لا سند لها في المعاجم المرجعية (الموسوعة الكهربائية والمعجم الطبي كلاهما يكتبان «اتو» بهمزة قطع بلا مدّ). صيغة إملائية شاذّة لا تضيف قيمة دلالية."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "واحد من كوينتيليون (10^-18) من الثانية؛ جزء من ألف من الفيمتوثانية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستعمل «كوينتيليون» وهو تعريب غير شائع وغير مفهوم لمعظم القرّاء العرب. يُستحسن الاكتفاء بالتعبير العلمي (١٠⁻¹⁸) مع بيان النسبة إلى الفيمتوثانية، وصياغة التعريف بأسلوب معجمي عربي."
    authored:
      - type: terminological
        text: "وَحْدَةُ قِيَاسِ الزَّمَنِ تُسَاوِي ١٠⁻¹⁸ (جُزْءاً مِنْ مِلْيُونِ مِلْيُونِ مِلْيُون) مِنَ الثَّانِيَةِ، أَيْ جُزْءاً مِنْ أَلْفٍ مِنَ الفِمْتُوثَانِيَة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "وَحْدَةُ قِيَاسِ الزَّمَنِ تُسَاوِي ١٠⁻¹⁸ (جُزْءاً مِنْ مِلْيُونِ مِلْيُونِ مِلْيُون) مِنَ الثَّانِيَةِ، أَيْ جُزْءاً مِنْ أَلْفٍ مِنَ الفِمْتُوثَانِيَة"

  examples:
    per_lemma:
      - lemma: "أَتُّوثَانِيَة"
        examples:
          - text: "تمكَّن الفريق البحثي من رصد حركة الإلكترونات داخل الذرّة بدقّة تبلغ عدّة مئات من الأتّوثانيات باستخدام نبضات ليزرية فائقة القِصَر."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تمكَّن الفريق البحثي من رصد حركة الإلكترونات داخل الذرّة بدقّة تبلغ عدّة مئات من الأتّوثانيات باستخدام نبضات ليزرية فائقة القِصَر."


