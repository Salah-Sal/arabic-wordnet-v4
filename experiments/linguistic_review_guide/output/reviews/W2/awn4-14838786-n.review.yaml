stage1_review:
  assessment:
    concerns:
      - "قيد التعريف الحالي بحصر الفحم في العصر الكربوني فقط، بينما يوجد فحم من عصور أخرى (مثل الليجنيت من العصر الثالث)."
      - "اللبس المحتمل بين الفحم الحجري (المعدني) والفحم النباتي (الخشب) عند إطلاق لفظ 'فحم' بمفرده."
    observations: "تتفق المعاجم الحديثة على أن الفحم الحجري صخر رسوبي كربوني المنشأ، وهو وقود أحفوري أساسي."
  blind_candidates:
    - lemma: "فَحْم حَجَرِيّ"
      generation_method: tarkib
      justification: "المصطلح الأكثر دقة وشيوعاً لتمييز الفحم المستخرج من الأرض عن الفحم النباتي."
    - lemma: "فَحْم"
      generation_method: majaz
      justification: "الاسم العام الشائع في السياق التقني والاقتصادي (مثل: صناعة الفحم)."
    - lemma: "فَحْم مَعْدِنِيّ"
      generation_method: tarkib
      justification: "مصطلح تقني يستخدم في الجيولوجيا لتمييز الفحم الأحفوري."
    - lemma: "فَحْم أَرْضِيّ"
      generation_method: tarkib
      justification: "مصطلح تراثي (بوشر، دوزي) يشير إلى الفحم المستخرج من باطن الأرض."

stage2_evidence:
  per_lemma:
    - lemma: "فحم"
      confirm:
        - text: "«(الفحم الحجري) معدن أسود براق أو ضارب إلى السواد تكون من مواد نباتية في جوف الأرض خلال عصور متطاولة»"
          source: "المعجم الوسيط"
        - text: "«صخور رسوبية صلبة، ذات لون بين الأسود والبني، تنشأ من خلال عملية كربنة بقايا النباتات»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
    - lemma: "فحم حجري"
      confirm:
        - text: "«صخر رسوبي أسود اللون، يتميّز بالخشونة والصلابة، وينشأ نتيجة حدوث عملية التكربن... ناقل طاقة أحفوري»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«ما يوجد من الفحم في باطن الأرض»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
    - lemma: "فحم معدني"
      evidence_status: "no_material_found"
    - lemma: "فحم أرضي"
      confirm:
        - text: "«فحم أرضي: فحم حجري (بوشر)»"
          source: "تكملة المعاجم العربية (دوزي)"

stage3_analysis:
  per_lemma:
    - lemma: "فَحْم"
      decision: confirmed
      decision_reason: "اسم الجنس الشائع والمستعمل في جميع السياقات العلمية والاقتصادية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَحْم"
    - lemma: "فَحْم حَجَرِيّ"
      decision: confirmed
      decision_reason: "المصطلح العربي الفني الدقيق لـ coal تمييزاً له عن charcoal."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَحْم حَجَرِيّ"
    - lemma: "فَحْم صَلْب"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف تقني معتبر في معاجم الطاقة (Hard coal) ويستخدم كمرادف مباشر للفحم الحجري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "فَحْم صَلْب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "فَحْم أَرْضِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح تاريخي موثق في المعاجم العربية الوسيطة (دوزي) للإشارة إلى الفحم الحجري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "فَحْم أَرْضِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "وقود أحفوري يتكون من مواد نباتية مكربنة ترسبت في العصر الكربوني"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحصر تكوّن الفحم في العصر الكربوني فقط، بينما يمتد تكوينه عبر عصور جيولوجية مختلفة."
    authored:
      - type: terminological
        text: "صخر رسوبي أسود أو بني اللون، غني بالكربون، يتكون من بقايا نباتية تحللت وتفحمت في باطن الأرض بفعل الضغط والحرارة عبر عصور جيولوجية طويلة، ويُستخدم وقوداً أحفورياً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "فَحْم"
        examples:
          - text: "تعتمد العديد من محطات توليد الطاقة على حرق الفحم لتوليد الكهرباء."
            type: usage
      - lemma: "فَحْم حَجَرِيّ"
        examples:
          - text: "أدى اكتشاف الفحم الحجري واستخدامه في المحركات البخارية إلى انطلاق الثورة الصناعية."
            type: usage
      - lemma: "فَحْم صَلْب"
        examples:
          - text: "يتميز الفحم الصلب بكثافة طاقية عالية ونسبة كربون مرتفعة مقارنة بالفحم البني."
            type: usage
      - lemma: "فَحْم أَرْضِيّ"
        examples:
          - text: "ذكرت المصادر التاريخية استخدام الفحم الأرضي في عمليات الصهر والحدادة."
            type: usage
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "صخر رسوبي أسود أو بني اللون، غني بالكربون، يتكون من بقايا نباتية تحللت وتفحمت في باطن الأرض بفعل الضغط والحرارة عبر عصور جيولوجية طويلة، ويُستخدم وقوداً أحفورياً."}

