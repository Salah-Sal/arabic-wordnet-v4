stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي قاصر جداً؛ فهو مجرد إحالة تصنيفية (يُدرج ضمن العرق المغولي) ولا يعرّف المفهوم نفسه."
      - "اللمة الحالية (عرق الهنود الحمر) تعتمد على تسمية تاريخية (الهنود الحمر) التي باتت تُعتبر في الأوساط الأكاديمية غير دقيقة ويفضل استبدالها بمصطلحات أكثر دقة مثل (الأمرندي) أو (الهندي الأمريكي)."
    observations: "المفهوم يشير إلى العرق الأصلي للأمريكتين (Amerindian race). اللغة العربية استوعبت هذا المفهوم تاريخياً بتعبير (الهنود الحمر)، ولكن المعاجم الحديثة والمصطلحات الأنثروبولوجية تميل إلى التعريب (أمرندي) أو الوصف الدقيق (الهندي الأمريكي)."
  blind_candidates:
    - lemma: "العِرْقُ الأَمْرِيكِيُّ"
      generation_method: ishtiqaq
      justification: "وصف العرق بنسبته إلى القارة الأمريكية التي استوطنها."
    - lemma: "العِرْقُ الهِنْدِيُّ الأَمْرِيكِيُّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين التسمية التقليدية (الهندي) والموقع الجغرافي (الأمريكي) تمييزاً عن هنود آسيا."
    - lemma: "العِرْقُ الأَمَرَنْدِيُّ"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح العلمي الأجنبي (Amerindian) ليكون مصطلحاً دقيقاً في الأنثروبولوجيا."
    - lemma: "السُّلَالَةُ الأَمْرِيكِيَّةُ"
      generation_method: tarkib
      justification: "استخدام كلمة (سلالة) كمرادف للعرق مع النسبة لأمريكا."

stage2_evidence:
  per_lemma:
    - lemma: "عِرْقُ الهُنُودِ الحُمْرِ"
      expands:
        - text: "«الهنديّ الأميركيّ: أحد هنود أميركا الحُمْر.»"
          source: "المورد الحديث (2008)"
          addition: "يثبت استخدام عبارة «هنود أميركا الحمر» للدلالة على هذه المجموعة العرقية."
    - lemma: "العِرْقُ الأَمَرَنْدِيُّ"
      expands:
        - text: "«الأَمَرَنديّ: هنديّ أميركيّ أحمر.»"
          source: "المورد الحديث (2008)"
          addition: "يثبت تعريب المصطلح الأنثروبولوجي (Amerindian) إلى «أمرندي» وإقراره معجمياً."
    - lemma: "العِرْقُ الهِنْدِيُّ الأَمْرِيكِيُّ"
      expands:
        - text: "«الهنديّ الأميركيّ: أحد هنود أميركا الحُمْر.»"
          source: "المورد الحديث (2008)"
          addition: "يثبت استخدام الوصف «الهندي الأمريكي» كبديل دقيق."
    - lemma: "العِرْقُ الأَمْرِيكِيُّ"
      evidence_status: "no_material_found"
    - lemma: "السُّلَالَةُ الأَمْرِيكِيَّةُ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عرق الهنود الحمر"
      decision: confirmed
      decision_reason: "مصطلح شائع تاريخياً ومستقر في الاستعمال العام، رغم تراجع استخدامه الأكاديمي لصالح المصطلحات الأدق."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عِرْقُ الهُنُودِ الحُمْرِ"
    - lemma: "العِرْقُ الأَمَرَنْدِيُّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح أكاديمي دقيق ومعرّف معجمياً، وهو التعبير الأنسب في السياق الأنثروبولوجي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "العِرْقُ الأَمَرَنْدِيُّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "العِرْقُ الهِنْدِيُّ الأَمْرِيكِيُّ"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب دقيق يُستخدم بشكل واسع للتمييز بين سكان الأمريكتين الأصليين وسكان الهند."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "العِرْقُ الهِنْدِيُّ الأَمْرِيكِيُّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "العِرْقُ الأَمْرِيكِيُّ"
      source: stage1
      decision: removed
      decision_reason: "غير دقيق؛ فكلمة أمريكي تطلق غالباً على المواطنة ولا تحدد العرق الأصلي بوضوح."
    - lemma: "السُّلَالَةُ الأَمْرِيكِيَّةُ"
      source: stage1
      decision: removed
      decision_reason: "مرفوض لنفس سبب العرق الأمريكي؛ لافتقاره إلى التخصيص."

stage4_content:
  definition:
    current: "يُدرج عادة ضمن العرق المغولي"
    assessment:
      decision: revise
      reason: "التعريف الحالي ليس تعريفاً بل مجرد تصنيف فرعي. يجب تعريف المفهوم بذكر جنسه (مجموعة عرقية/شعوب أصلية) وفصله النوعي (في الأمريكتين)."
    authored:
      - type: terminological
        text: "مجموعة عرقية تشمل الشعوب الأصلية في الأمريكتين، وتُصنّف أنثروبولوجيّاً في كثير من الأحيان ضمن العرق المغولي نظراً للخصائص الفيزيائية المشتركة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مجموعة عرقية تشمل الشعوب الأصلية في الأمريكتين، وتُصنّف أنثروبولوجيّاً في كثير من الأحيان ضمن العرق المغولي نظراً للخصائص الفيزيائية المشتركة."
  examples:
    per_lemma:
      - lemma: "عِرْقُ الهُنُودِ الحُمْرِ"
        examples:
          - text: "ينحدر عِرْقُ الهُنُودِ الحُمْرِ من موجات هجرة قديمة عبرت مضيق بيرنغ."
            type: usage
      - lemma: "العِرْقُ الأَمَرَنْدِيُّ"
        examples:
          - text: "يدرس علماء الأنثروبولوجيا التركيب الجيني للعِرْقِ الأَمَرَنْدِيِّ لفهم تاريخ الاستيطان البشري."
            type: usage
      - lemma: "العِرْقُ الهِنْدِيُّ الأَمْرِيكِيُّ"
        examples:
          - text: "تعرضت شعوب العِرْقِ الهِنْدِيِّ الأَمْرِيكِيِّ لتغيرات ديموغرافية كبيرة بعد اكتشاف القارة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يدرس علماء الأنثروبولوجيا التركيب الجيني للعِرْقِ الأَمَرَنْدِيِّ لفهم تاريخ الاستيطان البشري."

