          source: "المعجم الكبير (OCR)"
          addition: "الصيغة الوصفية ذَهِن (على وزن فَعِل) تُشير إلى أن الجذر ذ-هـ-ن يُولِّد صفات تدلّ على حدة الإدراك، مما يُعزِّز ارتباطه بالملَكة المعرفية."

    - lemma: "عقل"
