        - text: "«اللب: الْعقل الْمنور بِنور الْقُدس الصافي عَن فتور الأوهام والتخيلات»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«وَلِذَلِكَ سُمِّيَ الْعَقْلُ لُبًّا» — وأصله: اللُّبُّ خالص كل شيء وما يُنتقَى منه"
