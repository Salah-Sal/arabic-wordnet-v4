          source: "التعريفات الفقهية للبركتي (ت ١٩٧٥م)"
          conflict: "يدلّ هنا على الدية (blood money) لا على الملَكة العقلية؛ معنى اصطلاحي فقهي مغاير تماماً لمعنى المجموعة."
      expands:
