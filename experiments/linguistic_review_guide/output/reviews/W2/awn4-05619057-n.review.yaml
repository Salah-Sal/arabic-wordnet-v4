# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان 'ذهن' و'عقل' بدون تشكيل كامل"
      - "التعريف العربي الحالي يَنِمُّ عن أثر الترجمة الحرفية من الإنجليزية ('ما هو مسؤول عن' = calque من 'that which is responsible for')"
      - "تركيب 'وظائف الدماغ الواعية' مصطلح عصبي لا يُجاري أسلوب المعجم الوسيط"
      - "المجموعة تفتقر إلى الألفاظ الكلاسيكية العريقة التي تُغطي هذا الحقل الدلالي (كاللُّبّ والحِجَى)"
    observations: "المجموعة تُمثِّل مفهوم 'العقل/الذهن' بوصفه المَقَرَّ الكلي للقوى النفسانية الإنسانية من تفكير وإدراك ووعي ومشاعر. المصطلحان الموجودان (ذهن وعقل) من أقدم الألفاظ العربية في هذا الحقل وأشيعها، غير أنهما لا يستوعبان التراث العربي الكلاسيكي كاملاً. جذر 'ذهن' يُركِّز على الجانب المعرفي الحادّ (الفطنة والحفظ)، في حين يرتكز 'عقل' على البُعد الضابط للسلوك والحابس عن الجهل. الهرمي المباشر (إدراك ومعرفة) يُثبِّت انتماء المجموعة إلى حقل الملَكات النفسانية لا الأعضاء الجسمانية."

  blind_candidates:
    - lemma: "وِجْدَان"
      generation_method: majaz
      justification: "مجاز بالإزاحة الدلالية؛ من وَجَدَ يجد = يُحِسُّ بالشيء. الوِجدان أصله الإحساس الباطني الكلي، ويمكن توسيعه ليشمل مقرَّ المشاعر والأحاسيس الذي هو جزء من تعريف المجموعة ('مشاعر المرء')."
    - lemma: "حِجًى"
      generation_method: majaz
      justification: "إحياء لفظ ميت؛ الحِجَى في المعجمات الكلاسيكية بمعنى العقل والفطنة. اختير لتجنّب الاشتراك مع 'عقل' الأكثر شيوعاً، مع استحضار البُعد التراثي-الشعري في الدلالة على الملَكة العقلية."
    - lemma: "لُبّ"
      generation_method: majaz
      justification: "مجاز بالتضمين؛ اللُّبّ هو الخالص من كل شيء ومُنتقاه، وقد سُمِّي به العقل الصافي. الاستعمال القرآني 'أُولُو الْأَلْبَابِ' يُرسِّخه وحدةً معجمية ثابتة للدلالة على أصحاب العقل والبصيرة."
    - lemma: "نُفُوسِيَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق بالمصدر الصناعي من 'نَفْس'؛ محاولة لاستيعاب المعنى الفلسفي لـ'psyche' كمجموع القوى النفسية. وزن فُعُولِيَّة غير مألوف فصيحاً، والأصح استخدام 'نَفْس' مفردةً."


