          conflict: "الوجدان إحساس باطني انفعالي (affect) لا ملَكة عقلية-استدلالية؛ يختلف جوهرياً عن 'مقر ملكة العقل'."
        - text: "«الوجدان (نف)» — مُرادِفٌ لـ feeling في علم النفس"
          source: "المورد الحديث (٢٠٠٨م)"
