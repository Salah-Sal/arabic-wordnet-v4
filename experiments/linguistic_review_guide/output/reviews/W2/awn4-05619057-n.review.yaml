          source: "التوقيف على مهمات التعاريف للمناوي (ت ١٦٢٢م)"
        - text: "«الذِّهْنُ الذَّكَاءُ وَالْفِطْنَةُ وَالْجَمْعُ أَذْهَانٌ»"
