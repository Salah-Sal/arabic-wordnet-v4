          source: "التوقيف على مهمات التعاريف للمناوي (ت ١٦٢٢م)"
          addition: "يُفرِّق المناوي بين العقل 'بالملَكة' (الاستعداد الفطري) و'المستفاد' (الحصيلة المكتسبة)، مما يُشير إلى ثراء دلالي داخل الكلمة ذاتها."

