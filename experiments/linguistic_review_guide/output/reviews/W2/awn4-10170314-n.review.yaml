step0_evidence:
  per_lemma:
    - lemma: "مُخَمِّن"
      confirm:
        - text: "«خمَّنَ يخمِّن، تخمينًا، فهو مخمِّن»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«المُخَمَّن الذي يقدر قيمة الأشياء ومقاديرها وأثمانها والعامة تقول: المقَدّر والمثّمن.»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "حازِر"
      source_section: "step4_fts_keyword"
      evidence_citation: "«حَازِر: من يقدر الشيء بالتخمين.» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "اسم فاعل من 'حزر' وهو التخمين والتقدير بالحدس."
    - lemma: "خارِص"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الحازرُ: الخارصُ، الذى يُقدّر حَمْلَ النَّخْلِ بظَنِّه» — المعجم الكبير"
      justification: "اسم فاعل من 'خرص' الدال على التقدير والتخمين المبني على الظن."
  knowledge_candidates:
    - lemma: "مُقَدِّر"
      justification: "بآلية الاشتقاق من 'قدّر' (على وزن مُفَعِّل)، وهو من يقدر الأشياء."
  generation_notes: "تمت الاستعانة بألفاظ تراثية دقيقة كالحازر والخارص لتمثيل معنى المخمّن."

step1_lemma_validation:
  per_lemma:
    - lemma: "مُخَمِّن"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل، مشتق من الفعل 'خمّن' الدال على القول بالحدس والتخمين."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المخمِّن هو من يبني تقديره على الحدس والظن، ويكثر استعماله في التقدير المالي أو المطلق."
      example: "اعتمدت الشركة على مخمِّن خبير لتقدير قيمة العقار."
      actions: []

    - lemma: "حازِر"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح عربي تراثي دقيق يدل على من يقدر الشيء تخميناً بالحدس."
      step05_citation: "«حَازِر: من يقدر الشيء بالتخمين.» — موسوعة السلطان قابوس لأسماء العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الحازر يميل غالباً في أصله إلى تقدير الكميات والمقادير (كحزر النخل) بالعين والحدس."
      example: "استعان المزارع بحازر ماهر لتقدير غلته من التمر."
      actions:
        - command: create_entry
          params:
            lemma: "حازِر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10170314-n"

    - lemma: "خارِص"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تراثي فصيح ومستعمل للدلالة على من يقدر ويخمن، وخاصة في الثمار."
      step05_citation: "«الحازرُ: الخارصُ، الذى يُقدّر حَمْلَ النَّخْلِ بظَنِّه» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الخارص أخص في تقدير المحاصيل والثمار قبل قطافها اعتماداً على الظن."
      example: "أرسلت السلطات خارصاً لتقدير زكاة النخيل في البستان."
      actions:
        - command: create_entry
          params:
            lemma: "خارِص"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10170314-n"

    - lemma: "مُقَدِّر"
      source: step05
      decision: removed
      decision_reason: "كلمة عامة جداً تتجاوز معنى التخمين والحدس، فقد يكون التقدير مبنياً على حسابات دقيقة وليس مجرد تخمين."
      step05_citation: "مستنتجة معرفياً"

  synset_flags:
