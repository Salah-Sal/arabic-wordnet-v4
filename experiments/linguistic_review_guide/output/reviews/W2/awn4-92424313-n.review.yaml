# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الموجودة «الطابع السيليزي» تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي «حالة أو شرط كون الشيء سيليزياً» ترجمة حرفية ركيكة للنمط الإنجليزي -ness، ولا يتّسم بأسلوب المعجم الوسيط."
      - "اللمّة تركيبٌ وصفي حرّ (مَوصُوف + صفة)، ويُخشى ألّا تكون وحدة معجمية مسكوكة ثابتة."
      - "المفهوم ثقافياً غريب عن الدائرة اللغوية العربية؛ إذ سيليزيا ليست جزءاً من الجغرافيا الثقافية العربية."
      - "حقل ili فارغ (null)، ما يُشير إلى غياب الربط بمعجم Princeton WordNet الدولي."

    observations: >
      تمثّل هذه المجموعة الترادفية مفهوم «السيليزية» بوصفها خاصيّةً مجردة مشتقّةً من الانتساب
      إلى إقليم سيليزيا التاريخي (Silesia) في وسط أوروبا. وهو نمط دلالي معهود في الشبكات
      المعجمية (WordNet) يُعبَّر عنه بالإنجليزية بالاشتقاق على وزن -ness/-ity من الصفة
      المنسوبة. أما في العربية فالتعبير الأقيس هو المصدر الصناعي بالياء والتاء من النسبة
      (سيليزية)، غير أن هذه الصيغة مُشتركة بين دلالات عدة (اللغة، الثقافة، الجنسية)
      مما يُعقّد توظيفها مصطلحاً خاصاً بهذا المعنى المجرد. اللمّة الحالية «الطابع السيليزي»
      تُعيد توجيه الدلالة نحو «الطبع والسجية» المرتبطة بسيليزيا، وهو توجيه لغوي مقبول وإن
      كان تعبيراً وصفياً حرّاً لا مصطلحاً مسكوكاً.

  # ── التوليد الأعمى (قبل الاطلاع على اللمّات الموجودة) ──
  blind_candidates:
    - lemma: "السِّيلِيزِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي قياسي بالياء والتاء من الصفة المنسوبة «سيليزي»، على النمط المعروف
        في العربية لتجريد الصفات المنسوبة إلى أعلام الأماكن وتحويلها إلى مفاهيم مجردة
        (المصرية، الإسلامية، الأمريكية...). يدلّ على خاصية كون الشيء سيليزياً.

    - lemma: "الصِّبْغَةُ السِّيلِيزِيَّةُ"
      generation_method: tarkib
      justification: >
        تركيب وصفي يستحضر «الصبغة» مجازاً للدلالة على الطابع الهوياتي المميز؛ وقد
        وردت «صبغة الله» في القرآن الكريم بمعنى الفطرة والسمة الجوهرية. الإضافةُ
        الوصفية «السيليزية» تُخصِّص هذه السمة الجوهرية بسيليزيا.

    - lemma: "الخَاصِّيَّةُ السِّيلِيزِيَّةُ"
      generation_method: tarkib
      justification: >
        تركيب وصفي مباشر (موصوف + صفة): «خاصية» بمعنى صفة مميزة + «السيليزية» نسبة
        إلى سيليزيا. يُوازي التعريف الحالي بصورة أكثر شفافية دلالية، ويستجيب للمنهج
        المصطلحي بصياغة الجنس القريب (خاصية) مقروناً بالفصل النوعي (السيليزية).

    - lemma: "الانْتِمَاءُ السِّيلِيزِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي يُعبِّر عن «الانتماء» بوصفه الحالة الجوهرية الكامنة وراء صفة
        «كون الشيء سيليزياً»؛ فالانتماء مصدر صريح من النمط الثلاثي المزيد (افتعل)
        يحمل دلالة التعلّق والانتساب، وإقرانه بـ«السيليزي» يُفصح عن طبيعة هذا الانتماء
        الجغرافي والثقافي.


