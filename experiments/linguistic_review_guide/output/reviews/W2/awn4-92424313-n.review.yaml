        مجردة في السياق العربي. ولا تُوجد بدائل مستقرة معجمياً موثّقة في المعاجم. يُؤيّد
        تثبيته كون «الطابع» بمعنى «الخُلُق الغالب والسجية والعلامة المميزة» يُلائم الدلالة
