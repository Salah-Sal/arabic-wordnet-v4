# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14505883-n
# conceivability / conceivableness — قابلية التصور
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «معقولية» تعني في الأصل حالة كون الشيء معقولاً (rational/intelligible) لا قابلاً للتصوّر (conceivable)، فثمة انزياح دلالي"
      - "التعريف العربي «حالة كونه قابلاً للتصور» ترجمة حرفية مقبولة لكنها تفتقر إلى أسلوب التعريف المعجمي"
      - "لا توجد أدلة معجمية مباشرة لأيٍّ من اللمّتين بوصفهما مداخل مستقلة"
    observations: "المفهوم (conceivability) مفهوم فلسفي مجرد يدلّ على صفة ما يمكن للذهن أن يتصوّره. المُعادِل الأدقّ هو المصدر الصناعي من اسم المفعول «مُتَصَوَّر» أو من المصدر «تصوُّر» مع إضافة «قابلية». اللمّة الموجودة «قابلية التصور» مركّب إضافي ثابت يؤدي المعنى بدقة. أمّا «معقولية» فهي أقرب إلى reasonableness/intelligibility."
  blind_candidates:
    - lemma: "تَصَوُّرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تصوُّر» على وزن فَعُّولِيَّة، يُفيد حالة كون الشيء قابلاً للتصوّر، على قياس «معقولية» من «معقول»"
    - lemma: "مُتَصَوَّرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من اسم المفعول «مُتَصَوَّر» (ما يمكن تصوّره)، يُفيد حالة كون الشيء مُتَصَوَّراً"
    - lemma: "إِمْكَانُ التَّصَوُّرِ"
      generation_method: tarkib
      justification: "مركب إضافي من «إمكان» و«التصوّر»، يُطابق البنية الدلالية: إمكانية أن يُتصوَّر الشيء"
    - lemma: "قَابِلِيَّةُ التَّعَقُّلِ"
      generation_method: tarkib
      justification: "مركب إضافي من «قابلية» و«التعقّل»، يُفيد إمكان إدراك الشيء بالعقل"

stage2_evidence:
  per_lemma:
    - lemma: "قَابِلِيَّةُ التَّصَوُّرِ"
      evidence_status: "no_material_found"

    - lemma: "مَعْقُولِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَصَوُّرِيَّة"
      contradicts:
        - text: "«(التصورية) (فِي الفلسفة) الْمَذْهَب الْقَائِل بِأَن الكليات لَا تُوجد إِلَّا فِي الذِّهْن وَهُوَ يُقَابل مذهبي الواقعية والاسمية (مج)»"
          source: "المعجم الوسيط"
          conflict: "التصورية مصطلح فلسفي يدلّ على مذهب Conceptualism، لا على صفة القابلية للتصوّر"
        - text: "«(فى الفلسفة): المذهب القائل بأن الكليات لا توجد إلا فى الذهن, وهو يقابل مذهبي الواقعية والاسمية. (مج)»"
          source: "المعجم الوسيط (OCR)"
          conflict: "تأكيد الدلالة ذاتها: مذهب فلسفي لا صفة"

    - lemma: "مُتَصَوَّرِيَّة"
      evidence_status: "no_material_found"

    - lemma: "إِمْكَانُ التَّصَوُّرِ"
      evidence_status: "no_material_found"

    - lemma: "قَابِلِيَّةُ التَّعَقُّلِ"
      evidence_status: "no_material_found"

    # ── أدلة مساندة عامّة ──
    - lemma: "_سياق_عام"
      expands:
        - text: "«(التَّصَوُّر) (فِي علم النَّفس) استحضار صُورَة شَيْء محسوس فِي الْعقل دون التَّصَرُّف فِيهِ و (عِنْد المناطقة) إِدْرَاك الْمُفْرد أَي معنى الْمَاهِيّة من غير أَن يحكم عَلَيْهَا بِنَفْي أَو إِثْبَات (مج)»"
          source: "المعجم الوسيط"
          addition: "يُثبت أن التصوّر مصطلح فلسفي-نفسي راسخ في العربية المعاصرة"
        - text: "«التصور: حصول صورة الشيء في العقل.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "تعريف تراثي يؤكد رسوخ المفهوم في التراث المنطقي العربي"
        - text: "«ممكنٌ تصوُّرُه أو تخيُّلُهُ.»"
          source: "المورد الحديث (2008)"
          addition: "ترجمة conceivable إلى العربية بوصف تحليلي لا بمصطلح مفرد"
        - text: "«(1) يُتَصَوَّر: ممكنٌ تصوُّرُهُ أو التفكير فيه (2) مُمْكن؛ قابلٌ للتحقيق.»"
          source: "المورد الحديث (2008)"
          addition: "ترجمة thinkable تؤكد الصلة بين التصوّر والإمكان الذهني"
        - text: "«المعقول: هو المدرك بالفتح وما يعقل في الدرجة الأولى سواء كان موجودا أو معدوما بسيطا أو مركّبا»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "المعقول في الاصطلاح الفلسفي يعني ما يُدرَك بالعقل (intelligible)، وهو أوسع من مجرد القابلية للتصوّر"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "قَابِلِيَّةُ التَّصَوُّرِ"
      decision: confirmed
      decision_reason: "مركّب إضافي شفّاف يؤدي المعنى المطلوب بدقة: قابلية (القدرة على) + التصوّر (حصول صورة الشيء في العقل). وهو الأقرب دلالياً إلى conceivability. لا يوجد مصطلح مفرد مسكوك في المعاجم، فالمركّب الإضافي هو الخيار الأنسب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على البُعد الإدراكي-التخيّلي: قدرة الذهن على استحضار صورة الشيء، بخلاف «معقولية» التي تركّز على موافقة العقل والمنطق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ التَّصَوُّرِ"

    - lemma: "مَعْقُولِيَّة"
      decision: confirmed
      decision_reason: "مصدر صناعي من «معقول» (ما يقبله العقل). رغم أن دلالتها الأصلية أقرب إلى reasonableness/intelligibility، فإنها تُستعمل في السياق الفلسفي العربي المعاصر بمعنى قريب من conceivability. إبقاؤها مع توثيق الفرق الدلالي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على البُعد العقلي-المنطقي: كون الشيء مقبولاً عقلاً ومتّسقاً مع قوانين الفكر، بخلاف «قابلية التصوّر» التي تركّز على إمكان التخيّل والاستحضار الذهني"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْقُولِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَصَوُّرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مسكوك في المعاجم العربية بمعنى Conceptualism (مذهب فلسفي)، وليس بمعنى conceivability. استعماله هنا يُحدث اشتراكاً لفظياً مُضلِّلاً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُتَصَوَّرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لفظ غير مسكوك ولا مأنوس في الاستعمال. لم تُوجد له أي شواهد معجمية. المركّب الإضافي «قابلية التصوّر» أوضح وأرسخ."
      evidence_assessment:
        case: no_material

    - lemma: "إِمْكَانُ التَّصَوُّرِ"
      source: stage1
      decision: removed
      decision_reason: "مركّب إضافي صالح دلالياً لكنه مرادف شبه تامّ لـ«قابلية التصوّر» دون تمايز واضح، وليس مصطلحاً مسكوكاً. وجود «قابلية التصوّر» يُغني عنه."
      evidence_assessment:
        case: no_material

    - lemma: "قَابِلِيَّةُ التَّعَقُّلِ"
      source: stage1
      decision: removed
      decision_reason: "التعقّل يعني إعمال العقل والتفكّر، وهو فعل إرادي، بينما المطلوب هو صفة الشيء الذي يمكن تصوّره. الدلالة منزاحة."
      evidence_assessment:
        case: no_material

