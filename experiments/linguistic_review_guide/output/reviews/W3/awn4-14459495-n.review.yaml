# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14459495-n (obscurity)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «انغمار» مصدر الفعل انغمرَ (انفعال من غَمَرَ)، واستعمالها في المعاجم مقصور على الانغمار المادي (الغمر بالماء)، ولم يُوثّق لها استعمال اصطلاحي في الخفاء الاجتماعي"
      - "لمّة «خمول» بلا تشكيل في البيانات"
      - "التعريف العربي ترجمة حرفية بعبارة «غير معروف جيداً» وفيها ركاكة"
    observations: "المفهوم يتعلق بحالة خفاء المكانة الاجتماعية وضعف الشهرة، وهو مفهوم عربي أصيل عبّر عنه العرب بلفظ الخُمول (خَمَلَ ذِكْرُهُ). المُصمِّم الفوقي (سمعة/مكانة) يؤكد أن المقصود منزلة اجتماعية خافتة لا انغمار مادي."
  blind_candidates:
    - lemma: "خُمُول"
      generation_method: ishtiqaq
      justification: "مصدر خَمَلَ على وزن فُعُول، والخُمول في العربية هو خفاء القدر والذِّكر، وهو الأقرب دلالياً إلى المفهوم المطلوب"
    - lemma: "غُمُور"
      generation_method: ishtiqaq
      justification: "مصدر غَمَرَ على وزن فُعُول، بمعنى الغمر والستر، ويمكن توسيعه مجازياً إلى خفاء المنزلة"
    - lemma: "خَفَاء"
      generation_method: ishtiqaq
      justification: "مصدر خَفِيَ على وزن فَعَال، يدلّ على الاستتار والخفاء، ويُستعمل للأمور المعنوية"
    - lemma: "مَغْمُورِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من اسم المفعول مَغْمُور (أي الذي غُمِرَ ذِكْرُهُ)، يدلّ على حالة كون المرء مغموراً لا يُعرَف"

stage2_evidence:
  per_lemma:
    - lemma: "اِنْغِمَار"
      contradicts:
        - text: "«غَمْر، انغمار» (مصطلح جيولوجي بمعنى submersion)"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
          conflict: "الانغمار في المعاجم المصطلحية لا يرد إلا بالمعنى المادي: الغمر بالماء أو الغوص الجيولوجي، لا بمعنى خفاء المكانة"
        - text: "«انغطاس، انغمار» (مصطلح أرصاد جوية بمعنى immersion)"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية"
          conflict: "استعمال تقني محض للانغمار بمعنى الانغطاس المادي"
      expands:
        - text: "«(4) مغمور؛ خامل الذِّكر ضئيل الشأن an obscure writer»"
          source: "المورد الحديث"
          addition: "اسم المفعول «مغمور» يُستعمل مجازياً للشخص الخامل، لكن المصدر «انغمار» لم يُوثّق بهذا المعنى المجازي"

    - lemma: "خُمُول"
      confirm:
        - text: "«الخمول: خفاء القدر والذكر، وأصله السكون والخفاء، ومنه، خمل البساط لأنه يستر ما خلفه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(3) خمول ذكر؛ عدم شهرة»"
          source: "المورد الحديث (ترجمة obscurity)"
        - text: "«الْخَاءُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى انْخِفَاضٍ وَاسْتِرْسَالٍ وَسُقُوطٍ. يُقَالُ خَمَلَ ذِكْرُهُ يَخْمُلُ خُمُولًا. وَالْخَامِلُ: الْخَفِيُّ; يُقَالُ: هُوَ خَامِلُ الذِّكْرِ; وَالْأَمْرُ الَّذِي لَا يُعْرَفُ وَلَا يُذْكَرُ.»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الخامِلُ: الخَفِيُّ، وخَمَلَ يخمُلُ خُمُولاً، وقَوْلٌ خَامِلٌ: خفيٌّ. ويقال: هو خامِل الذُّكرِ والأَمْر أي: لا يُعْرَف.»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: "أقدم توثيق معجمي يؤكد أن الخمول يشمل خفاء الذِّكر والأمر"

    - lemma: "غُمُور"
      evidence_status: "no_material_found"

    - lemma: "خَفَاء"
      contradicts:
        - text: "«الخَفَاء: المُتَبطَّأطِئُ من الأرض. بَرِحَ الخَفَاء: وَضَحَ الأمر»"
          source: "المعجم الوسيط"
          conflict: "الخَفَاء في المعجم الوسيط يدلّ على المكان المنخفض أو استتار الأمر عموماً، لا على خفاء المكانة الاجتماعية تحديداً"
        - text: "«الخَفَاء: من الأضداد يقال خفي عليه الأمر إذا استتر وخفي له إذا ظهر.»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "لفظ من الأضداد يفيد الاستتار والظهور معاً، ولا يختص بالمكانة الاجتماعية"
      expands:
        - text: "«(خَفِيَ) الْخَاءُ وَالْفَاءُ وَالْيَاءُ أَصْلَانِ مُتَبَايِنَانِ مُتَضَادَّانِ. فَالْأَوَّلُ السَّتْرُ، وَالثَّانِي الْإِظْهَارُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر خفي ذو أصلين متضادين، مما يُضعف تخصيصه لمعنى الخفاء الاجتماعي"

    - lemma: "مَغْمُورِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "اِنْغِمَار"
      decision: removed
      decision_reason: "لم يُوثّق استعمال «انغمار» بمعنى خفاء المكانة الاجتماعية في أي معجم عربي كلاسيكي أو معاصر. جميع الشواهد المعجمية تقصره على الانغمار المادي (غمر بالماء، غوص جيولوجي). وإن كان اسم المفعول «مغمور» يُستعمل مجازياً للشخص الخامل، فإن المصدر «انغمار» لم يُنقل إلى هذا الحقل الدلالي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "خُمُول"
      decision: confirmed
      decision_reason: "الخُمُول مصدر خَمَلَ المُوثّق توثيقاً غزيراً في المعاجم الكلاسيكية (العين، مقاييس اللغة، التوقيف) والمعاصرة (المورد الحديث) بمعنى خفاء القدر والذِّكر، وهو المعنى المطلوب بالضبط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الخُمُول هو اللفظ المركزي الوحيد المؤكَّد في هذه المجموعة، يدلّ على خفاء القدر والذِّكر مع إيحاء بالسكون والركود"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُمُول"

    - lemma: "غُمُور"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على استعمال «غُمُور» مصدراً لغَمَرَ بمعنى خفاء المكانة. المصدر المسموع هو غَمْر (بالفتح والسكون) ويدلّ على التغطية المادية."
      evidence_assessment:
        case: no_material

    - lemma: "خَفَاء"
      source: stage1
      decision: removed
      decision_reason: "الخَفَاء يدلّ على الاستتار العام أو المكان المنخفض من الأرض، ولا يختصّ بخفاء المكانة الاجتماعية. كما أنه من الأضداد (يفيد الاستتار والظهور)، مما يُوقع في لبس دلالي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَغْمُورِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصدر صناعي غير مسموع ولا مسجّل في أي معجم. ورغم شيوع «مغمور» صفةً للشخص الخامل، فإن «مَغْمُورِيَّة» تركيب قياسي لم يُثبَّت معجمياً."
      evidence_assessment:
        case: no_material

