# ══════════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-85917983-n  |  POS: n
# المفهوم: خبير البستنة الذكر (male horticulturist)
# ══════════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
# المُدخل: التعريف المُقنَّع (بدون لمّات)
# "خبير ذكر في علم زراعة النباتات (الفاكهة أو الزهور أو الخضروات أو نباتات الزينة)"
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'خبير نباتات' غير مشكّلة ولا وجود لها في أي معجم من قاعدة البيانات المُتاحة"
      - "التمييز الجنسي (ذكر) الذي يُفرّق هذه المجموعة عن المجموعة الأم (awn4-10205969-n) مكرّر في العربية؛ إذ تُعبَّر عن الجنوسة بالصرف لا بمداخل مستقلة"
      - "التعريف ترجمة حرفية من الإنجليزية ويستخدم 'علم زراعة النباتات' عوضاً عن المصطلح المعيار 'البستنة'"
    observations: >
      المجموعة تُعبّر عن مفهوم 'خبير البستنة الذكر'. المصطلح العربي الأمكن هو 'بستاني'
      الذي يحمل الجنس المذكر بطبيعته الصرفية، وهو مشهود له في المعاجم الحديثة
      والمعجمية التقنية على حدٍّ سواء. التعريف الحالي صياغة حرفية مُترجمة تحتاج إلى
      إعادة ضبط بأسلوب المعجم الوسيط.

  blind_candidates:
    - lemma: "بُسْتَانِيٌّ"
      generation_method: ishtiqaq
      justification: >
        مشتق من 'بستان' على نسبة الاختصاص والحرفة (مفعال الحرفة → النسبة إلى المكان).
        يدل على المتخصص في تنمية النباتات في البساتين والحدائق. صيغته مذكر بطبيعتها
        الصرفية مما يُناسب تخصيص المجموعة.
    - lemma: "جَنَّانٌ"
      generation_method: majaz
      justification: >
        لفظ عربي قديم من جذر (ج-ن-ن) يُحيي استعمالاً تراثياً للدلالة على من يتولى
        العناية بالجنان. إحياءٌ للفظ ميت يُجنّب الاشتراك اللفظي مع الألفاظ الحيّة،
        ومشابهةٌ وظيفية مع مفهوم الخبير في الحدائق والبساتين.
    - lemma: "خَبِيرُ الْبَسَاتِين"
      generation_method: tarkib
      justification: >
        تركيب إضافي يُصرّح بالخبرة في البساتين مجالاً. يُميّزه عن 'البستاني' الذي قد
        ينصرف بعض الاستعمالات إلى العمال اليدويين لا الخبراء.
    - lemma: "عَالِمُ الْبَسَاتِين"
      generation_method: tarkib
      justification: >
        تركيب إضافي يُبرز البُعد العلمي للاختصاص. يُناسب سياق التمييز بين خبير
        المعرفة العلمية وعامل الحديقة. مقابله 'بستاني' أكثر شمولاً للبُعدَيْن.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت:
#  (١) مطابقة دفعية: خبير نباتات + خبير بساتين + بستاني + خبير البساتين + عالم البساتين + مهندس البساتين
#  (٢) جسر إنجليزي: horticulturist + horticulturalist + plantsman + gardener + landscape gardener
#  (٣) FTS عربي: بستاني + خبير نباتات + علم زراعة النباتات + البستنة + خبير البساتين
#  (٤) مقاييس ابن فارس: خبر + نبت + بست + نبات
stage2_evidence:
  per_lemma:
    - lemma: "خبير نباتات"
      evidence_status: "no_material_found"

    - lemma: "بُسْتَانِيٌّ"
      confirm:
        - text: "«عامل البستان»"
          source: "المعجم الوسيط (ocr، entry_id 1822)"
        - text: "«نسبة إلى البستان، ويطلق على عامله. يقال: نبات بستاني: يزرع ويعتنى به»"
          source: "المعجم الكبير (ocr، entry_id 65016)"
        - text: "«الذي مهنته العمل في البساتين والحدائق» [translation_en: gardener]"
          source: "المعجم الموحد لمصطلحات علم الأحياء — arabterm (entry_id 454043)"
        - text: "[translation_en: horticulturist] — المقابل الإنجليزي الصريح"
          source: "المعجم الموحد لمصطلحات علم الأحياء — arabterm (entry_id 454585)"
        - text: "«عامل البستان 'يُعنى البستانيّ بالأشجار والورود'»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (hawramani، entry_id 856962)"
        - text: "«بُسْتانيّ — عن الفارسية نسبة إلى بُسْتان بمعنى القائم على شئون البستان»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani، entry_id 916109)"
        - text: "«البُستانيّ؛ الجنائنيّ» [translation_en: gardener]"
          source: "المورد الحديث (arabterm، entry_id 689954)"
      expands:
        - text: "«البَسْتَنَة؛ الجِنانة: علم [أو فن] زراعة الأشجار المثمرة والخضر والزهور والنباتات الزِّينيّة»"
          source: "المورد الحديث (arabterm، entry_id 693404)"
          addition: >
            يوضح أن 'البستنة' هي حقل عمل البستاني وتعريفها ينطبق انطباقاً تاماً
            على تعريف المجموعة الترادفية؛ مما يُثبت ملاءمة 'بستاني' لهذه المجموعة.
        - text: "«بَسْتَنَة [مفرد]: (رع) عِلْم فِلاحَة البَساتين»"
          source: "معجم اللغة العربية المعاصرة (hawramani، entry_id 856962)"
          addition: "يُثبت الصلة المعجمية المباشرة بين 'بستاني' و'البستنة' كحقل اختصاص."

    - lemma: "جَنَّانٌ"
      evidence_status: "no_material_found"

    - lemma: "خَبِيرُ الْبَسَاتِين"
      evidence_status: "no_material_found"

    - lemma: "عَالِمُ الْبَسَاتِين"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "خبير نباتات"
      decision: removed
      decision_reason: >
        اللمّة غير مشهود لها في أي معجم من قاعدة البيانات (760,660 مدخل). وهي تعبير
        وصفي حر لا مصطلح مسكوك: يمكن إبدال 'خبير' بـ'عالم' أو 'متخصص' دون أن يتغير
        المعنى — مما يُفشلها في اختبار السكّ. اختبار التثبيت المعجمي: غير مسجّلة.
        فضلاً عن ذلك، يُغطي 'بُسْتَانِيٌّ' المفهوم ذاته بشهادة معجمية أقوى وأشمل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "بُسْتَانِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مشهود له صراحةً بترجمة 'horticulturist' في ARABTERM (المعجم الموحد لمصطلحات
        علم الأحياء)، وموثّق بالمعجم الوسيط والمعجم الكبير ومعجم اللغة العربية
        المعاصرة. بنيته الصرفية نسبة اختصاص مذكّر تُناسب تخصيص المجموعة للخبير الذكر.
        فحص الاقتراض: اللفظ مُعرَّب من الفارسية (بستان) وقد استُوعب في العربية
        استيعاباً كاملاً (يقبل لام التعريف والنسبة والجمع: بساتنة/بستانيون). بوابة جودة
        المصطلح: يطّرد في الاستعمال الفصيح، يسير التداول، ملائم للمفهوم، ذو اشتقاقية
        عربية معتمدة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الوحيد في المجموعة؛ يُشير بصيغته المذكرة إلى الخبير الذكر في البستنة،
        في مقابل المجموعة الأم الأعم 'خبير بستنة' (awn4-10205969-n) المحايد جنسياً.
        التأنيث يُعطي 'بستانية'.
      actions:
        - command: create_entry
          params:
            lemma: "بُسْتَانِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "جَنَّانٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أدلة معجمية في قاعدة البيانات. وعلى الرغم من أصالة اللفظ عربياً،
        إلا أن استعماله في سياق الاختصاص التقني الحديث يفتقر إلى شاهد معجمي مُعاصر.
        'بستاني' يُغطي المفهوم بشهادة أقوى وأوسع انتشاراً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "خَبِيرُ الْبَسَاتِين"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب إضافي غير مشهود له في المعاجم. يُفشله اختبار السكّ: إبدال 'خبير' بـ'عالم'
        يُبقي الوصفَ صالحاً. 'بستاني' يُغني عنه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "عَالِمُ الْبَسَاتِين"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب إضافي غير مشهود له في المعاجم؛ يُفشله اختبار السكّ للأسباب ذاتها.
        'بستاني' يُعبّر عن المفهوم بأجمع وأثبت.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
# (تعالج فقط اللمّات المؤكدة: بُسْتَانِيٌّ)
stage4_content:
  definition:
    current: "خبير ذكر في علم زراعة النباتات (الفاكهة أو الزهور أو الخضروات أو نباتات الزينة)"
    assessment:
      decision: revise
      reason: >
        التعريف ترجمة حرفية من الإنجليزية؛ يستخدم 'علم زراعة النباتات' عوضاً عن
        'البستنة' المصطلح المعيار في المعاجم العربية الحديثة (المعجم الوسيط، المورد
        الحديث). الأقواس أسلوب غير معجمي. يحتاج إلى إعادة صياغة بأسلوب المعجم الوسيط
        مع الاحتفاظ بسمة التذكير مُميِّزةً عن المجموعة الأم.
    authored:
      - type: terminological
        text: "البُسْتَانِيُّ: خبيرٌ ذكرٌ يتخصص في البَسْتَنَة وما تشمله من زراعة الأشجار المثمرة والزهور والخضراوات ونباتات الزينة والعناية بها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "البُسْتَانِيُّ: خبيرٌ ذكرٌ يتخصص في البَسْتَنَة وما تشمله من زراعة الأشجار المثمرة والزهور والخضراوات ونباتات الزينة والعناية بها."

  examples:
    per_lemma:
      - lemma: "بُسْتَانِيٌّ"
        examples:
          - text: "استدعت المزرعةُ بستانياً متمرساً لتشخيص حالة أشجار الفاكهة وتحديد أنسب مواعيد التقليم والتلقيح."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "استدعت المزرعةُ بستانياً متمرساً لتشخيص حالة أشجار الفاكهة وتحديد أنسب مواعيد التقليم والتلقيح."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
# (تعالج فقط اللمّات المؤكدة: بُسْتَانِيٌّ)
stage5_enrichment:
  per_entry:
    - lemma: "بُسْتَانِيٌّ"
      entry_id: "{auto}"
      root: "بستن"
      # ملاحظة: 'بستان' أصله فارسي معرَّب؛ لا يرد في مقاييس اللغة لابن فارس.
      # استُوعب في العربية استيعاباً كاملاً: يقبل ال-التعريف، والنسبة، والجمع (بساتنة/بستانيون).

  per_sense:
    - lemma: "بُسْتَانِيٌّ"
      sense_id: "{auto}"
      nuance: >
        الصيغة المذكرة للخبير في البستنة؛ يُقابله في المجموعة الأم (awn4-10205969-n)
        'خبير بستنة' الأشمل والأعم. التأنيث: 'بُسْتَانِيَّة'.
      mwe: false

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"بستن","note":"أصل الكلمة فارسي (بُستان)، معرَّبة في العربية واستُوعبت كلياً صرفياً ودلالياً"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الصيغة المذكرة لخبير البستنة؛ مقابل المجموعة الأم الأعم، والتأنيث بستانية","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.78
