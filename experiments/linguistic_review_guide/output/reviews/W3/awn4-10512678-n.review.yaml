# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — Synset Review
# ID: awn4-10512678-n  |  ILI: i92348  |  POS: n
# المفهوم: punster — الشخص الولوع بالتورية والتلاعب اللفظي
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. توليد اللمّات المرشحة (أعمى — من التعريف المُقنَّع فقط)
  # التعريف المقنَّع: "شخص مولع جداً بصياغة التورية والتلاعب اللفظي"
  blind_candidates:
    - lemma: "مُجَنِّس"
      generation_method: ishtiqaq
      justification: >
        اشتقاق اسم فاعل على وزن مُفَعِّل من الجذر (جنس) وفعل Form II جَنَّسَ
        يُجَنِّسُ؛ إذ الجناس (paronomasia) هو الباب العريض للتلاعب بالألفاظ في
        البلاغة العربية، فمُجَنِّس = الذي يصنع الجناس ويُكثر منه.
    - lemma: "جَنَّاس"
      generation_method: ishtiqaq
      justification: >
        بناء على وزن فَعَّال الدال على الإكثار والمبالغة، من جذر (جنس).
        يُفيد المبالغة في ممارسة الجناس، بما يعكس معنى "overly fond of"
        المذكور في التعريف الإنجليزي.
    - lemma: "مُوَرٍّ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن مُفَعِّل من الفعل وَرَّى يُوَرِّي (Form II، جذر: ورى)
        بمعنى "صَنَعَ التوريةَ وأَكثرَ منها". والتورية هي المعنى الجوهري
        للمصطلح الإنجليزي "pun"؛ فالشخص المُوَرِّي هو مَن يُوَرِّي دائماً
        ويتعمّد الإيهام اللفظي.
    - lemma: "لَاعِبُ الأَلْفَاظ"
      generation_method: tarkib
      justification: >
        مركب إضافي (idafi): لَاعِب (اسم فاعل من لَعِبَ) + الأَلْفَاظ (جمع لَفْظ).
        يصف من يلعب بالألفاظ ويُقلِّبها. لكنه خاضع لاختبار المركبية قبل القبول.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        اللمّة "صاحب تورية" عبارةٌ وصفيةٌ حرة لا مصطلحٌ مسكوك:
        يمكن إبدال "تورية" بـ"طرفة" أو "نكتة" دون أن يفقد التعبير صلاحيته
        كوصف، وهو ما يُفشل اختبار السكّ.
      - >
        اللمّة "متلاعب بالألفاظ" وإن أحكمت الدلالة إلا أنها عبارة وصفية
        تركيبية لا وحدة معجمية ثابتة؛ يمكن قلبها إلى "متلاعب بالمعاني"
        وتبقى وصفاً مقبولاً، وهو ما يُفشل اختبار التثبيت المعجمي.
      - >
        كلتا اللمّتين الموجودتين خالية من التشكيل الكامل، مما يُعسِّر
        ضبط الوزن الصرفي وتصنيف كل منهما.
      - >
        المجموعة تفتقر إلى مصطلح مفرد مستوفٍ لمعايير الصياغة المصطلحية
        العربية، في حين وثّق المورد الحديث (2008) مصطلح "المُوَرِّي" بالمعنى
        ذاته تحديداً.
    observations: >
      تمثّل هذه المجموعة مفهوماً بلاغياً راسخاً في التراث العربي؛ إذ عرفت
      البلاغة الكلاسيكية الجناسَ والتوريةَ والمشاكلةَ ضمن المحسّنات
      اللفظية. غير أن تسمية الشخص الولوع بهذه الصنعة بمصطلح مفرد مُدوَّن
      ظلّت نقصاً حتى سدّه المورد الحديث بلفظ "المُوَرِّي". اللمّتان الموجودتان
      صحيحتا المعنى لكنهما في مستوى التوصيف لا التسمية، وينبغي استبدالهما
      بالمصطلح المعجمي المثبَّت.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# ميزانية الاستعلامات المُستخدَمة: ٤ استعلامات
#   ١. مطابقة دفعية: جميع اللمّات + المرشحات (headword_norm IN)
#   ٢. جسر إنجليزي: punster | pun | wordplay | paronomasia | punning
#   ٣. FTS عربي: تورية | جناس | تلاعب | لفظي | الفاظ
#   ٤. إثراء بالمعرّف: entry_ids من الاستعلام ٢ + مقاييس اللغة
stage2_evidence:
  per_lemma:

    - lemma: "صاحب تورية"
      evidence_status: "no_material_found"

    - lemma: "متلاعب بالألفاظ"
      evidence_status: "no_material_found"

    - lemma: "مُجَنِّس"
      evidence_status: "no_material_found"
      # ملاحظة: ورد الجذر (جنس) في المقاييس بمعنى الضرب والنوع من الشيء لا الجناس
      # البلاغي، وورد مُجَانِس لا مُجَنِّس، ولم تُقرِن أيُّ مادة مُجَنِّساً
      # بمعنى "الولوع بالجناس اللفظي".

    - lemma: "جَنَّاس"
      evidence_status: "no_material_found"

    - lemma: "مُوَرٍّ"
      confirm:
        - text: >
            «المُوَرِّي: المولَع بالتّورية والتلاعب بالألفاظ.»
          source: "المورد الحديث (2008) — ARABTERM، entry_id: 710980"
        - text: >
            «(1) تَوْرِية؛ تلاعبٌ بالألفاظ (2) يُورِّي.»
          source: "المورد الحديث (2008) — ترجمة: pun، entry_id: 710937"
      expands:
        - text: >
            «التورية: لغةً، الستر؛ وعرفاً، قصد مخالفة اللفظ بما لا يتبادر من
            معناه… أن يريد بكلامه خلاف ظاهره.»
          source: "التوقيف على مهمات التعاريف للمناوي (ت١٠٣١هـ)، entry_id: 813450"
          addition: >
            يُثبِّت أن التورية هي إرادة المعنى البعيد بلفظ ظاهره معنى قريب،
            وهو الأساس الدلالي الذي يقوم عليه وزن مُوَرٍّ.
        - text: >
            «التّورية: هي الإيهام أي استعمال لفظ له معنيان قريب وبعيد
            ويراد البعيد.»
          source: "كشّاف اصطلاحات الفنون للتهانوي (ت١١٥٨هـ)، entry_id: 819318"
          addition: >
            يُوضِّح المنشأ الدلالي للجذر: الوَرْيُ (الإخفاء) → التورية → مُوَرٍّ.
        - text: >
            «(1) الجناس (2) التَّوْرية (بل).»
          source: "المورد الحديث (2008) — ترجمة: paronomasia، entry_id: 706258"
          addition: >
            يُقرِن التورية بالجناس تحت مصطلح paronomasia، مُعزِّزاً
            الصلة الدلالية بين الوزن مُوَرٍّ والمفهوم الذي ترادفه "punster".

    - lemma: "لَاعِبُ الأَلْفَاظ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "صاحب تورية"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا مصطلح مسكوك: اختبار السكّ — يمكن إبدال "تورية"
        بـ"نكتة" أو "طرفة" ويظل التعبير صالحاً وصفاً، فلا يجتاز بوابة
        التثبيت المعجمي. لا شاهد معجمي في قواعد البيانات. علاوة على ذلك
        "صاحب" تحمل دلالة الانتماء والملكية لا المبالغة في الفعل التي تقتضيها
        صياغة "overly fond of".
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        verdict: >
          فشل اختبار التثبيت: التعبير قابل للتبديل المعجمي في أحد مكوّنيه
          مع الحفاظ على الدلالة الوصفية؛ إذاً ليس وحدة معجمية ثابتة.
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "متلاعب بالألفاظ"
      decision: removed
      decision_reason: >
        تعبير مركب وصفي يصف الفعل لا يُسمِّي الشخص تسمية مصطلحية ثابتة.
        فشل اختبار السكّ: "متلاعب بالمعاني" أو "متلاعب بالأفكار" تبقى
        أوصافاً مقبولة، وهو ما يُفيت شرط التثبيت المعجمي للمركب.
        لم يُوجَد في قواعد البيانات كمدخل مفرد راسخ. المورد الحديث يُورده
        ضمن الترجمة العربية لـ"pun" (الفعل) لا للشخص "punster".
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
        verdict: >
          فشل اختبار التثبيت: "متلاعب" يقبل مفاعيل متعددة بدلاً من
          "الألفاظ" دون كسر دلالي جوهري؛ التعبير وصفي لا اصطلاحي.
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ─────────────────────────────────────

    - lemma: "مُجَنِّس"
      source: stage1
      decision: removed
      decision_reason: >
        لم يَرِد في أيٍّ من المعاجم بمعنى "الولوع بالجناس اللفظي".
        في الاستعمال المعاصر "مُجَنِّس" طغى عليه المعنى الإجرائي
        (الشخص الذي يمنح جنسيته أو يُجنِّس غيره)، وهو اشتراك
        لفظي يُفقد الصيغة دلالتها المقصودة. أما المعجمية فجعلت
        "مُجَانِسة" للتماثل الصنفي لا الجناس البلاغي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      borrowing_check:
        lexical_loan: false
        blind_calque: false
        verdict: اشتقاق نظامي سليم لكنه مشغول بمعنى آخر.

    - lemma: "جَنَّاس"
      source: stage1
      decision: removed
      decision_reason: >
        قياسي على وزن فَعَّال (للمبالغة) من الجذر (جنس)، لكنه غير مُثبَّت
        في المعاجم بهذا المعنى. مخاطرة الاصطناع دون سند معجمي تجعله
        دون مُوَرٍّ المنصوص عليه صراحةً في المورد الحديث.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُوَرٍّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَّت معجمياً في المورد الحديث (2008) بالنص الحرفي: "المُوَرِّي:
        المولَع بالتّورية والتلاعب بالألفاظ" — وهو التعريف ذاته الذي تحمله
        المجموعة. الوزن مُفَعِّل من Form II وَرَّى صحيح صرفياً للدلالة
        على فاعل متكرر. الجذر (ورى) معروف في مقاييس اللغة لابن فارس.
        يمرّ اختبار السكّ: المصطلح ليس عبارة وصفية حرة إذ لا يمكن
        إبدال عنصر فيه بمرادفه مع الحفاظ على الصياغة المصطلحية.
        يمرّ فحص الاقتراض: اشتقاق عربي خالص. يمرّ فحص الصرف:
        وزن مُفَعِّل ملائم لصياغة اسم الفاعل المتكرر.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المُثبَّتة في المجموعة بعد حذف العبارتين الوصفيتين.
        تنفرد بتركيزها على التورية (الإيهام بالمعنى البعيد) تحديداً كأساس
        للتلاعب اللفظي، ذلك أن وزن مُوَرٍّ مُشتقٌّ من جذر الإخفاء والستر
        (ورى) لا من جذر اللعب أو الجنس، مما يُضفي على المصطلح بُعداً
        أسلوبياً دقيقاً: الولوع بالإيهام والمراوغة اللفظية.
      term_quality_gate:
        consistency: "مطَّرد — وزن مُفَعِّل منتج في العربية للدلالة على الفاعل الديمومي"
        ease_of_use: "سهل النطق والتصريف (يَقبل ال-، والنسبة، والجمع: مُوَرِّيون)"
        fitness: "ملائم — يحمل دلالة الإخفاء والستر المتعمَّد المناسبة لمفهوم التورية"
        classical_preference: "يُؤثَر على المُحدَث — المورد الحديث معتمَد"
        arabic_preference: "اشتقاق عربي خالص — مُؤثَّر على أي تعريب"
        derivability: "قابل للاشتقاق: مَوْرٍّ (اسم المرة)، تَوْرِية (المصدر)، يُوَرِّي (الفعل)"
      actions:
        - command: create_entry
          params:
            lemma: "مُوَرٍّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10512678-n"


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "شخص مولع جداً بصياغة التورية والتلاعب اللفظي"
    assessment:
      decision: revise
      reason: >
        التعريف صحيح المعنى لكنه يشوبه استعمال "جداً" وهو كلمة إضافة تأكيدية
        تُنمِّق لا تُحدِّد في أسلوب المعجم، علاوة على تقديم "صياغة" الذي
        يُحصِّر الدلالة في الإنتاج وحده دون الاستمتاع بالسماع.
        المعجم الوسيط يُعرِّف على نمط: الجنس القريب (الشخص/المرء) + الفصل
        النوعي (ما يُميّزه)، فلا "جداً" ولا "بصياغة".
    authored:
      - type: terminological
        text: "الشَّخصُ الشَّدِيدُ الوَلَعِ بِالتَّوْرِيَةِ وَالتَّلَاعُبِ بِالأَلْفَاظِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          مَن يُكثِرُ مِن صِياغةِ التَّوريةِ ويَتَلَذَّذُ بِإيهامِ المُخاطَبِ
          مَعنىً خَلَفَ مَعنى في كلامِه
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10512678-n"
          definition_index: 0
          text: "الشَّخصُ الشَّدِيدُ الوَلَعِ بِالتَّوْرِيَةِ وَالتَّلَاعُبِ بِالأَلْفَاظِ"

  examples:
    per_lemma:
      - lemma: "مُوَرٍّ"
        examples:
          - text: >
              "كانَ المتنبي شاعرَ فحولةٍ لا مُوَرِّياً، غيرَ أنَّ بعضَ
              أبياتِه تُشيرُ إلى قدرةٍ خارقةٍ على توليدِ المعنى المُزدوج."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            "كانَ المتنبي شاعرَ فحولةٍ لا مُوَرِّياً، غيرَ أنَّ بعضَ أبياتِه
            تُشيرُ إلى قدرةٍ خارقةٍ على توليدِ المعنى المُزدوج."


