# ══════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد
# Stage 1: Review + Generate (blind — masked input)
# ══════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يستخدم «يفسر» وهو ينتمي إلى حقل التفسير والتأويل (exegesis)، في حين أن الوظيفة المميزة للمفتي هي إصدار الفتاوى (إفتاء)؛ كان الأدق «يُفتي في أحكام الشريعة» أو «يُصدر الفتاوى الشرعية»"
      - "اللمّة الوحيدة (مفتي) مكتوبة بلا تشكيل كامل؛ الاسم المنقوص يستوجب ضبطه مُفْتٍ"
      - "لا يوجد تعريف موسوعي يُعرّف بدور المفتي في المنظومة الفقهية الإسلامية وعلاقته بالقاضي والمجتهد"
      - "لا توجد أمثلة استعمالية"
    observations: >
      المجموعة تمثّل مفهوماً إسلامياً أصيلاً راسخاً في التراث الفقهي.
      المصطلح (مفتي) مشتق من الفعل «أفتى يُفتي» من الجذر (ف ت و/ي)، وقد ورد في القرآن الكريم:
      {يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلَالَةِ} [النساء: 176].
      اللمّة مفردة في المجموعة مما يعني غياب التباين الترادفي الداخلي، وهو أمر مقبول نظراً لتفرّد المصطلح.
      التعريف الحالي قريب من المفهوم لكن الفصل النوعي يحتاج إلى مراجعة.

  blind_candidates:
    - lemma: "مُجْتَهِد"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر (ج ه د) على وزن مُفْتَعِل (اسم فاعل من اجتهد يجتهد).
        المجتهد في الاصطلاح الفقهي هو الفقيه الذي يستنفر وسعه لاستنباط الأحكام الشرعية
        من أدلتها التفصيلية، وهو أقرب المصطلحات العربية إلى مفهوم «فقيه يفسر الشريعة».
        اختبار السكّ: المصطلح وحدة معجمية مثبتة في كتب التعريفات والمعاجم الفقهية.
    - lemma: "مُسْتَنْبِط"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر (ن ب ط) على وزن مُسْتَفْعِل (اسم فاعل من استنبط يستنبط).
        الاستنباط هو استخراج الأحكام من الأدلة بمنهج استدلالي؛ ويعكس الوظيفة التأويلية
        للفقيه الذي يفسر الشريعة، وهو مصطلح أصولي معروف.
    - lemma: "فَقِيهُ الشَّرِيعَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي (idafi) من «فقيه» مضافاً إلى «الشريعة»؛ يُقيّد الفقيه بالتخصص
        الشرعي الإسلامي تحديداً، في مقابل الفقيه القانوني العام.
        يعكس التعريف المقدَّم مباشرةً (فقيه + الشريعة الإسلامية).
    - lemma: "مُفَسِّرُ الشَّرِيعَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُفَسِّر» (اسم فاعل من فسّر على وزن مُفَعِّل، جذر ف س ر)
        مضافاً إلى «الشريعة»؛ يعكس الفعل الوصفي الوارد في التعريف (يفسر) ويخصّصه
        بالشريعة الإسلامية.


# ══════════════════════════════════════════════
# المرحلة ٢: جمع الأدلة
# Stage 2: Evidence Gathering
# ══════════════════════════════════════════════
#
# الاستعلامات المُنفَّذة (٣ استعلامات):
# Q1: مطابقة دقيقة دفعية — مفتي + مجتهد + مستنبط + مرجع (+ صيغ بال-)
# Q2: جسر إنجليزي — mufti / mujtahid / islamic jurist / jurisconsult
# Q3: مقاييس اللغة — الجذر فتي (dictionary_id=151)
# Q4: FTS عربي — فتوى / مفتي / افتاء (لتوسيع الشواهد)

stage2_evidence:
  per_lemma:

    - lemma: "مفتي"
      confirm:
        - text: "«(الْمُفْتِي) من يتَصَدَّى للْفَتْوَى بَين النَّاس وفقيه تعينه الدولة ليجيب عَمَّا يشكل من الْمسَائِل الشَّرْعِيَّة (ج) مفتون»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة، 1998) — hawramani"
        - text: "«من يتصدَّى للفتوى بين الناس فقيه تعينه الدولة ليجيب عما يشكل من المسائل الشرعية»"
          source: "المعجم الوسيط (OCR) — مجمع اللغة العربية بالقاهرة"
        - text: "«مُفْتِي — من (ف ت و) من يتصدر للفتوى بين الناس»"
          source: "موسوعة السلطان قابوس لأسماء العرب (جامعة السلطان قابوس، 1985)"
        - text: "«المفتي» — ترجمة إنجليزية: mufti"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«المفتي الماجنُ: هو الذي يُعلِّم الناس الحِيُل الباطلة وقيل: الذي يفتي عن جهل ولا يُبالي أن يُحرِّمَ حلالاً نعوذ بالله»"
          source: "التعريفات الفقهيّة للبركتي (ت. 1975م)"
          addition: >
            يُميّز بين المفتي الأصيل (يفتي بعلم وتحرٍّ) والمفتي الماجن (يفتي بجهل أو تساهل)؛
            مما يدل على أن المفتي الحقيقي مشروط بالعلم والكفاءة والتورع
        - text: "«المفتي الماجن: هو الذي يعلم الناس الحيل، وقيل: الذي يفتي عن جهل»"
          source: "كتاب التعريفات للشريف الجرجاني (ت. 1413م)"
          addition: >
            الجرجاني يُعرّف المفتي الماجن تحديداً — مما يدل ضمنياً على أن المفتي المعتدّ به
            هو من يفتي بعلم وتحرٍّ، وهو التعريف المفهوم بالتضاد

    - lemma: "مُجْتَهِد"
      confirm:
        - text: "«(الْمُجْتَهد) هُوَ الْفَقِيه المستفرغ لوسعه لتَحْصِيل ظن بِحكم شَرْعِي وَله شُرُوط مقررة فِي علم أصُول الْفِقْه»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة، 1998)"
        - text: "«المجتهد: بالغ عاقل ذو ملكة يدرك بها العلوم، فقيه النفس عارف بالدليل العقلي، ذو الدرجة الوسطى لغة وعربية وأصولا وبلاغة، ومتعلق الأحكام من كتاب وسنة»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
        - text: "«المجتهد: من يحوي علم الكتاب ووجوه معانيه، وعلم السنة بطرقها ومتونها ووجوه معانيها، ويكون مصيبًا في القياس، عالمًا بعرف الناس»"
          source: "كتاب التعريفات للشريف الجرجاني (ت. 1413م)"
        - text: "«المُجْتَهِد: من يحوي علمَ الكتاب ووجوهَ معانيه، وعلمَ السنة بُطُرُقِها ومتونها ووجوهَ معانيها ويكونُ مُصِيباً في القياس عالماً بعرف الناس»"
          source: "التعريفات الفقهيّة للبركتي (ت. 1975م)"

    - lemma: "مُسْتَنْبِط"
      contradicts:
        - text: "«المستنبط: اسم مفعول من الاستنباط وهو صنعة عند الشعراء. وهو أنّه يكتب بيتا من الشعر ثم يكتب بيتا آخر تحت كلّ لفظة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777م)"
          conflict: >
            المعنى الموثَّق في المعاجم المتاحة لـ«مستنبط» يتعلق بصنعة شعرية (من استُنبِط منه شعر)،
            لا باستنباط الأحكام الشرعية. ولم يُعثر على استعمال «مستنبط» بمعنى الفقيه المُفتي

    - lemma: "فَقِيهُ الشَّرِيعَةِ"
      confirm:
        - text: "«فقيه قانونيّ» — ترجمة إنجليزية: jurisconsult"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"

    - lemma: "مُفَسِّرُ الشَّرِيعَةِ"
      evidence_status: "no_material_found"


