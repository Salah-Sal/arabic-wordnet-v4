# المرحلة ٣: التحليل اللغوي للّمات
# Stage 3: Lemma Linguistic Analysis
# ══════════════════════════════════════════════

stage3_analysis:
  per_lemma:

    - lemma: "مفتي"
      decision: confirmed
      decision_reason: >
        لمّة عربية أصيلة ومصطلح شرعي إسلامي مُثبت في جميع المعاجم الكلاسيكية والمعاصرة:
        المعجم الوسيط وكتب التعريفات الفقهية والمعاجم الإنجليزية-العربية (المورد الحديث).
        الجذر (ف ت و/ي) قرآني (يُفتي، فتوى)؛ لا بديل أنسب في التراث العربي.
        يستوجب تصحيح التشكيل: الاسم المنقوص مُفْتٍ (بتنوين الكسر في الرفع).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check:
        pattern: "مُفْعٍ — اسم فاعل منقوص من أفتى يُفتي (وزن أفعل)"
        note: >
          الاسم المنقوص المُنوَّن يُكتب مُفْتٍ (رفع)، مُفْتِياً (نصب/جر بالتنوين خطأ — صواب: مُفْتِيًا).
          الصيغة المعجمية المعتمدة: مُفْتٍ
      borrowing_check:
        type: native
        note: "مصطلح عربي إسلامي أصيل من الجذر الثلاثي (ف ت و/ي)، وارد في القرآن الكريم"
      quality_gate:
        ittiraad: true
        yusr: true
        mulaama: true
        ithar_turathi: true
        ithar_arabi: true
        ishtiqaqiyya: true
      nuance_differentiation: >
        المفتي أخص من الفقيه (الجنس الأعلى): يقتصر على من يتصدّر فعلاً لإصدار الفتاوى
        الشرعية ويُجيب عن المسائل المستفتى فيها. يتمايز عن القاضي (يصدر أحكاماً قضائية
        ملزمة) وعن المجتهد (يستنبط الأحكام من مصادرها الأولية)؛ فكل مجتهد قد يُفتي
        لكن ليس كل مفتٍ مجتهداً مطلقاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُفْتٍ"

    - lemma: "مُجْتَهِد"
      source: stage1
      decision: removed
      decision_reason: >
        المجتهد مصطلح فقهي صحيح راسخ، لكنه يدل بالتحديد على من يمارس الاجتهاد المستقل
        في استنباط الأحكام من الكتاب والسنة والقياس، وهو أعلى درجة من المفتي.
        كل مجتهد قد يُفتي، لكن المفتي لا يشترط فيه بلوغ رتبة الاجتهاد المطلق.
        الدلالتان متباينتان اصطلاحاً وإن تداخلتا؛ إدراج مجتهد رديفاً للمفتي يُفقد
        كلاً منهما دقّته المصطلحية في علم الأصول.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "مُسْتَنْبِط"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُثبت استعمال «مستنبط» علماً على الفقيه المُفتي في المعاجم المتاحة؛
        الدليل الوحيد المُتاح يحمله بمعنى شعري (صنعة البيت المتولّد)، وهو تعارض صريح.
        فضلاً عن ذلك فإن اسم الفاعل من استنبط (بمعنى: المُستخرِج) يعكس العملية
        (الاستنباط) لا الوظيفة الرسمية (الإفتاء)، ولا يُغني عن مفتٍ في السياق.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "فَقِيهُ الشَّرِيعَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        التركيب الإضافي «فقيه الشريعة» ليس مصطلحاً مسكوكاً محدداً؛ يخفق في اختبار السكّ:
        يمكن إبدال «الشريعة» بـ«القانون» أو «الحنفية» وتبقى العبارة وصفاً حراً.
        كما أن تعريف الفئة الوالدة (حقوقي / فقيه قانوني) يكاد يطابقه دلالياً، مما يجعله
        مكرِّراً لا مُخصِّصاً. الدليل المتاح (المعجم الموحد للقانون) يعطيه ترجمة jurisconsult
        وهي الفئة الأم لا الفئة المبحوثة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُفَسِّرُ الشَّرِيعَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية متاحة. علاوةً على ذلك، «مُفَسِّر» في الاستعمال العربي
        الراسخ يرتبط بمفسّر القرآن الكريم (عالم التفسير)، لا بالفقيه المُفتي،
        مما يُوقع التباساً دلالياً خطيراً. اختبار الاستبدال: لا يمكن إحلاله محل
        «مفتٍ» في السياقات الفقهية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


