          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "عَالِمٌ دِينِيٌّ إِسْلَامِيٌّ مُؤَهَّلٌ لإِصْدَارِ الفَتَاوَى الشَّرْعِيَّةِ، يُجِيبُ عَنِ المَسَائِلِ الفِقْهِيَّةِ المُسْتَجِدَّةِ اسْتِنَاداً إِلَى الكِتَابِ والسُّنَّةِ وأُصُولِ الفِقْهِ؛ وَقَدْ يَتَوَلَّى مَنْصِبَهُ بِالتَّعْيِينِ الرَّسْمِيِّ كَمُفْتِي الدَّوْلَةِ، أَوْ يَتَصَدَّرُ لِلإِفْتَاءِ بِاعْتِرَافِ عُلَمَاءِ عَصْرِهِ بِكَفَاءَتِهِ"
