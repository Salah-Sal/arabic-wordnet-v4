stage4_content:
  definition:
    current: "فقيه يفسر الشريعة الإسلامية"
    assessment:
      decision: revise
      reason: >
        الفصل النوعي «يفسر» ينتمي إلى حقل التفسير (exegesis) الذي يُستعمل أساساً
        لتفسير القرآن الكريم، لا لوصف وظيفة المفتي. الوظيفة المميزة للمفتي هي
        الإفتاء: الإجابة عن المسائل الشرعية المستحدثة وإصدار الفتاوى.
        المعجم الوسيط يُعرّفه بـ«من يتصدى للفتوى بين الناس»، وهو أدق بكثير.
        يجب استبدال «يفسر» بـ«يُفتي» أو «يُصدر الفتاوى الشرعية».
    authored:
      - type: terminological
        text: "فَقِيهٌ مُتَخَصِّصٌ يَتَصَدَّى لإِصْدَارِ الفَتَاوَى الشَّرْعِيَّةِ وبيانِ أحكامِ الشَّرِيعَةِ الإِسلاميَّةِ فِيمَا يُسْتَفْتَى فِيه"
        quality_check:
