# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14003271-n
# roller coaster (figurative) — تغيرات مفاجئة وشديدة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تقلبات حادة» عبارة وصفية حرة وليست وحدة معجمية مسكوكة؛ تفشل في اختبار السكّ إذ يمكن إبدال «حادة» بـ«شديدة» أو «عنيفة» دون تغيير الدلالة"
      - "المجموعة تحتوي لمّة واحدة فقط، وهو عدد ضئيل لتغطية مفهوم شائع الاستعمال في العربية المعاصرة"
      - "التعريف العربي ترجمة حرفية من الإنجليزية (anything characterized by...) ولا يتّبع أسلوب المعجم الوسيط"
    observations: "المجموعة تمثّل المعنى المجازي للأفعوانية (roller coaster) بالإنجليزية، أي حالة من التغيّرات المفاجئة الحادة صعوداً وهبوطاً. الفرط العلوي هو «اضطراب» (awn4-14002658-n). المفهوم موجود في الثقافة العربية ويُعبَّر عنه بألفاظ مثل تَقَلُّب وتَأَرْجُح وتَذَبْذُب، لكنّ المدخل الحالي يستعمل عبارة وصفية حرة بدلاً من مصطلح معجمي ثابت."
  blind_candidates:
    - lemma: "تَقَلُّب"
      generation_method: ishtiqaq
      justification: "مصدر تَقَلَّبَ من جذر «قلب» على وزن تَفَعُّل، يدلّ على التحوّل من حال إلى حال؛ والجذر في مقاييس اللغة يدلّ على «ردّ شيء من جهة إلى جهة» وهو عين المطلوب"
    - lemma: "تَأَرْجُح"
      generation_method: ishtiqaq
      justification: "مصدر تَأَرْجَحَ من جذر «رجح» على وزن تَفَاعُل، يدلّ على الترجّح بين الصعود والهبوط كالأرجوحة؛ يُستعمل في المعاجم المصطلحية بمعنى fluctuation"
    - lemma: "تَذَبْذُب"
      generation_method: ishtiqaq
      justification: "مصدر تَذَبْذَبَ من جذر «ذبذب» على وزن تَفَعْلُل، يدلّ على الاضطراب والتحرّك؛ مصطلح مثبت في الفيزياء بمعنى oscillation"
    - lemma: "تَمَوُّج"
      generation_method: majaz
      justification: "مصدر تَمَوَّجَ من جذر «موج» على وزن تَفَعُّل؛ مجاز من موج البحر وما فيه من ارتفاع وانخفاض؛ الجذر في مقاييس اللغة يدلّ على «اضطراب في الشيء»"

stage2_evidence:
  per_lemma:
    - lemma: "تقلبات حادة"
      evidence_status: "no_material_found"

    - lemma: "تَقَلُّب"
      confirm:
        - text: "«تغير كبير وسريع ومتكرر لحجم السكان أو لمساحة مجال التوزيع بالنسبة لعدد من الأنواع، مع تغير أكبر من رتبة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ARABTERM)"
        - text: "«(تقلب) فِي الْأُمُور تصرف فِيهَا كَيفَ شَاءَ يُقَال فلَان يتقلب فِي أَعمال السُّلْطَان وَفِي نعمائه وَفِي الْبِلَاد تنقل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
      expands:
        - text: "«تقلبات» = fluctuations (علم الاجتماع والأنثروبولوجيا)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
          addition: "صيغة الجمع مثبتة مصطلحياً"
        - text: "«تقلّب» = fluctuation (الفلسفة وعلم النفس)"
          source: "مسرد الفلسفة وعلم النفس (ARABTERM)"
          addition: "يؤكّد شمول الدلالة خارج العلوم الطبيعية"
        - text: "«تقلّب» = thrashing (المعلوماتية)"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "دلالة إضافية على التغيّر السريع غير المنتج"
        - text: "«تقلبات الأثمان، تأرجح الأثمان» = price fluctuations; price movements; price swing"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يعامل تقلبات وتأرجح كمترادفين في سياق تغيّرات الأسعار"

    - lemma: "تَأَرْجُح"
      confirm:
        - text: "«تأرجح» = fluctuation"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«تأرجح (تقلب) الجهد» = voltage fluctuation"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«تأرجح» = swing"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "يؤكّد دلالة الحركة بين طرفين (صعوداً وهبوطاً)"
        - text: "«تأرجحات (ال...) اليومية» = التغيرات اليومية في الجريان والتي يكون نمطها متشابهاً من 24 ساعة إلى أخرى"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يوثّق صيغة الجمع تأرجحات ويربطها بالتغيّرات الدورية"

    - lemma: "تَذَبْذُب"
      confirm:
        - text: "«تَذَبْذَبَ الشَّيءُ: تَحَرَّكَ واضْطَرَبَ»"
          source: "المعجم الكبير (OCR)"
        - text: "«(تذبذب) تحرّك واضطرب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
      contradicts:
        - text: "«(فى الفيزياء) oscillation: تَغَيُّرٌ دَوْرِيٌّ فى طاقةِ نظامٍ ميكانيكِيٍّ أو كهربائيٍّ أو ذَرِّيٍّ»"
          source: "المعجم الكبير (OCR)"
          conflict: "المعنى الاصطلاحي المعاصر تخصّص في الفيزياء (تغيّر دوري منتظم) وهذا يناقض المعنى المطلوب (تغيّرات مفاجئة غير منتظمة)"

    - lemma: "تَمَوُّج"
      confirm:
        - text: "«تَمَوَّجَ البحرُ: مَاجَ»"
          source: "المعجم الوسيط (OCR)"
      contradicts:
        - text: "«تموج» = undulation / fluctuation / ripple — في أغلب السياقات المصطلحية يدلّ على الحركة الموجية الهادئة لا التغيّرات الحادة"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989) + موسوعة الكهرباء"
          conflict: "الدلالة الغالبة للتموّج موجية تدريجية، لا مفاجئة حادة كما يقتضي التعريف"

stage3_analysis:
  per_lemma:
