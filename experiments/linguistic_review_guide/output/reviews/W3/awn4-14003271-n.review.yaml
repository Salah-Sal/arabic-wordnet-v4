      decision_reason: "مصدر تَقَلَّبَ مثبت في المعجم الوسيط والمعاجم المصطلحية بدلالة التحوّل من حال إلى حال (fluctuation). الجذر «قلب» يدلّ في مقاييس اللغة على «ردّ شيء من جهة إلى جهة» وهو صميم المعنى المطلوب. يشيع في الاستعمال المعاصر في سياقات الأسواق والأحوال الجوية والسياسة."
      evidence_assessment:
