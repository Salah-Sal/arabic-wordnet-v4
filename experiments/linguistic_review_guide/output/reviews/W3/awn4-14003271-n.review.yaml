      decision_reason: "عبارة وصفية حرة تفشل في اختبار السكّ: يمكن قول «تقلبات شديدة» أو «تقلبات عنيفة» أو «تغيّرات حادة» بالمعنى نفسه. لم تُعثر على أي مدخل معجمي يسجّلها كوحدة معجمية ثابتة. الأولى استبدالها بالمصدر المفرد «تَقَلُّب» المثبت في معاجم عديدة."
