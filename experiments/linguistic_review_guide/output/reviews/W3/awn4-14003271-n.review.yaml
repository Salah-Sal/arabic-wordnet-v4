      actions:
        - command: create_entry
          params: {lemma: "تَقَلُّب", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَأَرْجُح"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر تَأَرْجَحَ مثبت في معاجم مصطلحية عديدة بدلالة fluctuation وswing، ويحمل دلالة الترجّح بين طرفين (صعوداً وهبوطاً) المناسبة تماماً لتعريف المجموعة. المورد الحديث يعامله كمرادف لـ«تقلّب» في سياق تقلبات الأثمان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد الثنائي للتغيّر (صعوداً وهبوطاً) كحركة الأرجوحة، ويُستعمل أكثر في السياقات التقنية والاقتصادية"
      actions:
        - command: create_entry
          params: {lemma: "تَأَرْجُح", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَذَبْذُب"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ الدلالة اللغوية الأصلية (التحرّك والاضطراب) قريبة من المعنى المطلوب، فقد تخصّص المصطلح في الاستعمال المعاصر بدلالة oscillation الفيزيائية (تغيّر دوري منتظم)، وهذا يناقض شرط «التغيّرات المفاجئة» في التعريف."
      evidence_assessment:
        case: mixed

    - lemma: "تَمَوُّج"
      source: stage1
      decision: removed
      decision_reason: "دلالته الغالبة في المعاجم المصطلحية تدور حول الحركة الموجية التدريجية (undulation, ripple) لا التغيّرات المفاجئة الحادة. يفتقر إلى عنصر الحِدّة والمفاجأة الذي يميّز هذه المجموعة عن فرطها العلوي «اضطراب»."
      evidence_assessment:
        case: mixed

