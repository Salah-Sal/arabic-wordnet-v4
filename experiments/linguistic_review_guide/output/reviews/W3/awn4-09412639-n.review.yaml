stage1_review:
  assessment:
    concerns:
      - "تعدد صيغ الكتابة العربية للاسم الأعجمي (بينوبسكوت/بينوبسكت)."
    observations: "المجموعة تخص معلماً جغرافياً محدداً، والترجمة العربية المتبعة هي التركيب الإضافي الوصفي (خليج + الاسم الأعجمي)."
  blind_candidates:
    - lemma: "خَلِيج بِينُوبْسِكُوت"
      generation_method: tarkib
      justification: "الاسم الجغرافي القياسي للخليج المذكور في التعريف."
    - lemma: "جَوْن بِينُوبْسِكُوت"
      generation_method: tarkib
      justification: "استخدام 'جون' كبديل لـ 'خليج' في بعض السياقات الجغرافية، وإن كان 'خليج' أشيع."
    - lemma: "شَرَم بِينُوبْسِكُوت"
      generation_method: tarkib
      justification: "استخدام 'شرم' للدلالة على المدخل البحري، وهو أقل شيوعاً لهذا المعلم."
    - lemma: "بِينُوبْسِكُوت بَاي"
      generation_method: taarib
      justification: "تعريب صوتي كامل للاسم الإنجليزي (غير مفضل)."

