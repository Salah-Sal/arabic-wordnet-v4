# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10843750-n  |  ILI: i94329
# Jean Arp / Hans Arp — فنان الألزاس ومؤسس الدادائية
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان خاليتان من التشكيل الكامل — يجب ضبطهما بالحركات"
      - "المجموعة تُصنَّف pos: n غير أنها تمثل اسم علَم لشخص بعينه؛ يُراعى أن WordNet يُبقي الأعلام تحت n بصفة مدخل نموذج (instance)"
      - "التعريف الحالي مترجَم من الإنجليزية حرفياً دون صياغة عربية مستقلة — ينبغي مراجعته أسلوبياً"
      - "لا يوجد أي مثال استعمالي في المجموعة"
    observations: >
      هذه المجموعة اسم علَم لشخص تاريخي محدد: الفنان والشاعر جان (هانز) آرب (1887-1966)، الألزاسي
      الجنسية، أحد مؤسسي حركة الدادائية في زيورخ، الشهير بمنحوتاته العضوية المجردة. الطابع الفريد
      لهذه المجموعة أن لمّاتها ليست مصطلحات اشتقاقية بل تعريبات لاسم علَم أجنبي. الاسم مزدوج
      (فرنسي: Jean / ألماني: Hans) بسبب تنقّل الألزاس بين فرنسا وألمانيا. كلا التعريبين صحيح
      ومُستعمَل في المصادر العربية المتخصصة في الفن الحديث. المهمة الرئيسية: إضافة التشكيل،
      وتحسين صياغة التعريف، وإضافة أمثلة استعمالية.

  blind_candidates:
    - lemma: "آرْب"
      generation_method: taarib
      justification: >
        تعريب اللقب المجرد "Arp" وفق قواعد التعريب القياسية: الهمزة الممدودة (آ) للصوت الطويل
        /aː/، راء ساكنة، باء في نهاية اللقب. يُستعمَل أحياناً كاسم مختصر لهذا الفنان في المصادر
        الناقدة العربية.
    - lemma: "جَانْ آرْب"
      generation_method: taarib
      justification: >
        تعريب النسخة الفرنسية من الاسم الكامل (Jean Arp): جَانْ تعريب لـ Jean الفرنسية بالصوت
        /ʒɑ̃/، وآرْب تعريب لـ Arp. هذا الشكل هو الأشيع في الكتابات العربية المتعلقة بالفن الحديث
        نظراً لسيادة المرجعية الفرنسية في الثقافة العربية الفنية.
    - lemma: "هَانْز آرْب"
      generation_method: taarib
      justification: >
        تعريب النسخة الألمانية من الاسم الكامل (Hans Arp): هَانْز تعريب لـ Hans الألمانية، وآرْب
        تعريب لـ Arp. يُستعمَل هذا الشكل في المصادر التي تستند إلى المرجعية الألمانية أو تُبرز
        الهوية الألمانية-الألزاسية للفنان.
    - lemma: "يَانْ آرْب"
      generation_method: taarib
      justification: >
        تعريب بديل للنسخة الفرنسية Jean يُراعي فيه بعض الكتّاب نقل الصوت الفرنسي /ʒ/ إلى ياء
        عوضاً عن جيم؛ غير أن هذا الشكل أقل شيوعاً وأقل توحيداً مقارنةً بـ "جان" التي استقرت
        في الاستعمال العربي.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية:
  # أُجريت الاستعلامات الآتية:
  # ١. بحث رأسي دفعي: headword_norm IN ('جان ارب','هانز ارب','ارب','الارب','جان','هانز'...) → لا نتائج للمُعرَّبَيْن
  # ٢. جسر إنجليزي: translation_en:"Arp" OR "Jean Arp" OR "Hans Arp" OR "dadaism" → نتائج عن الدادائية فقط
  # ٣. FTS عربي: 'الدادائية OR دادائية OR الزاس OR الزاسي' → مدخل الألزاسي ودادائية فقط
  # ٤. ARABTERM خاص: لا مداخل لـ جان آرب أو هانز آرب
  # الخلاصة: لا توجد مداخل معجمية للاسمين بوصفهما اسمَيْ علَم في أي من المعاجم الـ107

  per_lemma:
    - lemma: "جان آرب"
      evidence_status: "no_material_found"

    - lemma: "هانز آرب"
      evidence_status: "no_material_found"

    - lemma: "آرْب"
      evidence_status: "no_material_found"

    - lemma: "جَانْ آرْب"
      evidence_status: "no_material_found"

    - lemma: "هَانْز آرْب"
      evidence_status: "no_material_found"

    - lemma: "يَانْ آرْب"
      evidence_status: "no_material_found"

  # أدلة سياقية على الدادائية (لإثراء التعريف — المرحلة ٤):
  contextual_notes:
    - text: >
        «الداديّة: حركة أدبية وفنية [بعد الحرب العالمية الأولى] رفضت القيَمَ الأخلاقية
        والجمالية التقليدية إلى حدّ العَدَميّة والعَبَث.»
      source: "المورد الحديث (2008)"
      relevance: "يضبط المصطلح المُستخدَم في التعريف: الدادائية/الداديّة"
    - text: >
        «ألزاسيّ: منسوب إلى الألزاس [في فرنسا] أو إلى ألزاشيا»
      source: "المورد الحديث (2008)"
      relevance: "يؤكد صحة استخدام 'الألزاس' في التعريف العربي"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّات الموجودة ────────────────────────────────────────

    - lemma: "جان آرب"
      decision: confirmed
      decision_reason: >
        تعريب صحيح ومستقر للاسم الفرنسي Jean Arp؛ هو الشكل الأشيع في المصادر العربية المتعلقة
        بالفن الحديث والدادائية. اللمّة بلا تشكيل — يجب تحديثها بضبط كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُمثّل الهوية الفرنسية للفنان؛ يُستخدم في المصادر العربية المستندة إلى المرجعية
        الفرنسية، وهو الأكثر انتشاراً في الكتابات النقدية العربية لأن الفن الحديث وصل
        الثقافة العربية غالباً عبر القناة الفرنسية.
      morphology_check:
        loan_type: taarib
        arabization_verdict: مقبول
        inflection_test: "يقبل لام التعريف (مرفق بآرب): جان آرب / جان آرب الفنان"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَانْ آرْب"

    - lemma: "هانز آرب"
      decision: confirmed
      decision_reason: >
        تعريب صحيح للاسم الألماني Hans Arp؛ ضروري لأن الفنان عُرف بالاسمين ويُشار إليه في
        مصادر أكاديمية متعددة بالصيغة الألمانية. اللمّة بلا تشكيل — يجب تحديثها بضبط كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُمثّل الهوية الألمانية-الألزاسية للفنان؛ يُستخدم في الكتابات المتعلقة بالفترة
        الألمانية لحياته وفي المصادر الأوروبية الوسطى. التمييز مهم تاريخياً لأن الألزاس
        كانت ألمانية حين وُلد الفنان عام 1887 وفرنسية حين توفي عام 1966.
      morphology_check:
        loan_type: taarib
        arabization_verdict: مقبول
        inflection_test: "يقبل الإضافة: منحوتات هانز آرب / أعمال هانز آرب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَانْز آرْب"

    # ── مرشحات المرحلة ١ ────────────────────────────────────────

    - lemma: "آرْب"
      source: stage1
      decision: removed
      decision_reason: >
        اللقب المجرد "آرب" دون الاسم الأول غير كافٍ للتعريف الدقيق بهذا الشخص في السياق
        المعجمي؛ اللقب "Arp" قصير ونادر نسبياً لكنه قد يحتاج إلى قرينة تمييزية. علاوة
        على ذلك، الكلمة العربية "أرَب" (بمعنى الحاجة) تُوجِد اشتراكاً صوتياً مُربِكاً في
        الكتابة غير المُشكَّلة مما يُعرِّض الوضوح للخطر.

    - lemma: "جَانْ آرْب"
      source: stage1
      decision: confirmed
      decision_reason: >
        يطابق اللمّة الموجودة "جان آرب" بعد إضافة التشكيل الصحيح — وهو تأكيد على الاستخدام
        المقترح نفسه. تمت معالجته ضمن اللمّة الموجودة بإجراء update_lemma.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "هَانْز آرْب"
      source: stage1
      decision: confirmed
      decision_reason: >
        يطابق اللمّة الموجودة "هانز آرب" بعد إضافة التشكيل — تأكيد على صحة التعريب المقترح.
        تمت معالجته ضمن اللمّة الموجودة بإجراء update_lemma.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "يَانْ آرْب"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة شاذة لم تستقر في الاستعمال العربي؛ تعريب الصوت الفرنسي /ʒ/ بالياء أقل
        توحيداً من تعريبه بالجيم في الاستعمال العربي المعاصر. "جان" هي الصيغة المستقرة
        في المراجع العربية المتخصصة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "فنان وشاعر من الألزاس شارك في تأسيس الدادائية في زيورخ؛ اشتهر بمنحوتاته العضوية المجردة (1887-1966)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية دون صياغة عربية مستقلة. يحتاج إلى:
        (١) إعادة ترتيب المعلومات وفق أسلوب المعجم الوسيط في الأعلام،
        (２) إضافة المادة الموسوعية الأساسية (الاسم الكامل، ازدواجية الهوية الألزاسية)،
        (３) ضبط مصطلح الحركة الفنية (الدادائية = الداديّة في بعض المراجع).
    authored:
      - type: encyclopedic
        text: >
          فنانٌ تشكيليٌّ وشاعرٌ ألزاسيٌّ (1887-1966)، ازدوجت هويتُه بين الفرنسية والألمانية
          تبعاً لتحولات منطقة الألزاس السياسية؛ عُرف بالاسم الفرنسي جان آرب وبالألماني هانز آرب.
          كان أحدَ مؤسسي حركة الدادائية في زيورخ عام 1916، واشتُهر بمنحوتاته العضوية المجردة
          التي احتفت بالأشكال الحيوية التلقائية بعيداً عن الهندسة الصارمة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10843750-n"
          definition_index: 0
          text: >
            فنانٌ تشكيليٌّ وشاعرٌ ألزاسيٌّ (1887-1966)، ازدوجت هويتُه بين الفرنسية والألمانية
            تبعاً لتحولات منطقة الألزاس السياسية؛ عُرف بالاسم الفرنسي جان آرب وبالألماني هانز آرب.
            كان أحدَ مؤسسي حركة الدادائية في زيورخ عام 1916، واشتُهر بمنحوتاته العضوية المجردة
            التي احتفت بالأشكال الحيوية التلقائية بعيداً عن الهندسة الصارمة.

  examples:
    per_lemma:
      - lemma: "جَانْ آرْب"
        examples:
          - text: "يُعدّ جَانْ آرْب من رواد النحت التجريدي في القرن العشرين، إذ حوّل الأشكال العضوية إلى رموز تشكيلية خالصة تتجاوز المحاكاة الواقعية."
            type: usage
      - lemma: "هَانْز آرْب"
        examples:
          - text: "أسهم هَانْز آرْب بجانب تريستان تزارا في صياغة البيان الأول للحركة الدادائية التي أرادت كسر كل قواعد الفن الأكاديمي."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدّ جَانْ آرْب من رواد النحت التجريدي في القرن العشرين، إذ حوّل الأشكال العضوية إلى رموز تشكيلية خالصة تتجاوز المحاكاة الواقعية."
      - command: add_sense_example
        params:
