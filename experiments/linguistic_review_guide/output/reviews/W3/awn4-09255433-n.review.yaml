stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر للتشكيل الكامل.
      - اسم البحيرة أجنبي ويحتاج لضبط دقيق في التعريب.
    observations: "المجموعة تخص مَعْلماً جغرافياً محدداً (بحيرة في الولايات المتحدة)، لذا تعتمد المراجعة على دقة النقل الصوتي (Transliteration) والملاءمة المعجمية للوصف."
  blind_candidates:
    - lemma: "بُحَيْرَةُ كَانَانْدَايْغُوَا"
      generation_method: taarib
      justification: "التعريب الصوتي المباشر لاسم البحيرة (Canandaigua Lake) مع إلحاق لفظ 'بحيرة'."
    - lemma: "بُحَيْرَةُ كَانَانْدَاغُوَا"
      generation_method: taarib
      justification: "نسخة مخففة من الاسم الصوتي للبحيرة."
    - lemma: "بُحَيْرَةُ كَانَانْدَيْغُوَا"
      generation_method: taarib
      justification: "تنويع صوتي للياء في المقطع الثالث من الاسم."
    - lemma: "كَانَانْدَايْغُوَا"
      generation_method: taarib
      justification: "اسم العلم المجرد للبحيرة."

