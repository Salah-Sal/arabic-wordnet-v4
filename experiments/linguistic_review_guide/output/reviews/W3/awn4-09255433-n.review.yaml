      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويحتاج لصياغة معجمية أكثر سلاسة ووضوحاً."
    authored:
      - type: encyclopedic
        text: "بُحيرةٌ جَليديّةٌ تَقَعُ في وسَطِ ولايةِ نِيويورك الأمريكيّة، وهي إحْدى \"بُحيراتِ فِينْغَر\" (بُحيراتِ الأصابع) الاثنَتَيْ عَشْرَة."
