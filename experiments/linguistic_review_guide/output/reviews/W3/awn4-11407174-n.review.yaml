# ── المرحلة ١: المراجعة والتوليد ────────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (جُون وِيلْكِس) هي اسم علم أجنبي معرَّب صوتياً؛ لا مجال لاشتقاق أو مجاز."
      - "المجموعة تصف شخصاً تاريخياً فرداً بعينه، وهو ما يُفضي إلى لمّة أحادية غير قابلة للتعدّد الدلالي."
      - "POS مسجَّل كـ n، غير أن المدخل المعجمي يستحق pos: proper_noun على مستوى الإدخال (entry)."
      - "التعريف العربي الحالي فيه تعبير 'نشر هجمات' وهو غير دقيق — الأدق 'كتب هجاءات سياسية' أو 'نشر انتقادات'."
    observations: >
      هذه المجموعة ترادفية خاصة بشخصية تاريخية فردية (جون ويلكس، المصلح السياسي الإنجليزي 1727-1797).
      من حيث المعالجة المعجمية، تنتمي إلى صنف الأعلام الأجنبية المعرَّبة صوتياً، إذ لا يجوز فيها
      الاشتقاق ولا المجاز ولا التركيب؛ فالوسيلة الوحيدة هي التعريب الصوتي. وقد جرى العرف المعجمي الحديث
      على إيراد الاسم بصيغة: الاسم الأول + اللقب. اللمّة الحالية (جُون وِيلْكِس) هي الترجمة الصوتية
      المعتمدة دولياً. لا يوجد في المعجمية العربية الكلاسيكية أو التراثية ذِكر لهذه الشخصية.
  blind_candidates:
    - lemma: "جُون وِيلْكِس"
      generation_method: taarib
      justification: >
        استناداً إلى التعريف وحده (مصلح إنجليزي هاجم جورج الثالث، 1727-1797)، تحدَّدت الشخصية تاريخياً
        بجون ويلكس؛ وهو اسم يُعرَّب صوتياً بالصيغة القياسية: جُون (= John) وِيلْكِس (= Wilkes)،
        مع الإبقاء على النسق الصوتي للغة المصدر مع مراعاة المقاطع العربية.
    - lemma: "وِيلْكِس"
      generation_method: taarib
      justification: >
        صيغة اللقب منفرداً، شائعة في المصادر العربية عند الإشارة إلى شخصيات تاريخية غربية؛ يكفي
        أحياناً اللقب وحده للتمييز في السياق التخصصي.
    - lemma: "يُوحَنَّا وِيلْكِس"
      generation_method: taarib
      justification: >
        استبدال الاسم الأول (John) بمقابله العربي الكلاسيكي (يوحنا)، وهو أسلوب اتّبعه بعض المترجمين
        العرب القدامى في تعريب الأسماء المسيحية الغربية. لكنه أقل شيوعاً في المعجمية المعاصرة.
    - lemma: "جُون وِيلْكِز"
      generation_method: taarib
      justification: >
        بديل صوتي يعكس نطق الحرف الأخير (s) في بعض اللهجات الإنجليزية بصوت مجهور (z)، وقد ظهر هذا
        الضبط في بعض المصادر العربية المعاصرة غير أنه أقل دقة من الصيغة بالسين.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  query_log:
    - query_type: "batch_headword_lookup"
      searched: ["جون ويلكس", "الجون ويلكس", "ويلكس", "الويلكس", "جون", "الجون"]
      result_summary: >
        لم تُسفر المطابقة الدقيقة لـ 'جون ويلكس' و'ويلكس' عن أي نتيجة. 'جون' و'الجون'
        أسفرا عن مداخل لكلمة عربية أصيلة (الجَوْن: الأسود أو الأبيض، وخليج صغير) لا صلة لها
        بالاسم العلم الأجنبي.
    - query_type: "english_bridge"
      searched: ["Wilkes", "John Wilkes", "reformer"]
      result_summary: >
        لم يُوجد في قاعدة البيانات (ARABTERM) أي مدخل يقابل "Wilkes" أو "John Wilkes". مداخل
        "reformer" أسفرت عن مصطلحات تقنية (صناعة نفط، طب) لا صلة لها بالشخصية التاريخية.
    - query_type: "fts_arabic_keywords"
      searched: ["مصلح", "مستعمرين", "اصلاح", "انجليزي"]
      result_summary: >
        لم تُعطِ نتائج ذات صلة بجون ويلكس تحديداً؛ كل المداخل تتعلق بمصطلحات تقنية أو وصفية عامة.
    - query_type: "candidate_validation"
      searched: ["ويلكس", "الويلكس", "جون ويلكس", "الجون ويلكس", "وليم بيت", "ادموند بيرك", "يوحنا ويلكس", "جون ويلكز"]
      result_summary: "لم تُسفر عن أي نتيجة — لا أحد من هذه المرشحات مسجَّل في قاعدة البيانات."

  per_lemma:
    - lemma: "جُون وِيلْكِس"
      evidence_status: "no_material_found"

    - lemma: "وِيلْكِس"
      evidence_status: "no_material_found"

    - lemma: "يُوحَنَّا وِيلْكِس"
      evidence_status: "no_material_found"

    - lemma: "جُون وِيلْكِز"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "جُون وِيلْكِس"
      decision: confirmed
      decision_reason: >
        هي الترجمة الصوتية القياسية والمعتمدة في المصادر العربية الحديثة لاسم "John Wilkes". صيغة
        الترجمة الصوتية (الاسم الأول + اللقب) هي المعيار في معجم أعلام الغرب بالعربية. لا بديل
        أدق منها. رغم غياب الأدلة المعجمية الصريحة من قاعدة البيانات، فإن الاسم العلم الأجنبي
        لا يستدعي توثيقاً معجمياً كلاسيكياً؛ شهرة الشخصية في المصادر التاريخية العربية الحديثة تكفي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُشير بدقة إلى الشخص التاريخي بعينه دون غموض أو اشتراك.
      morphological_fit: >
        الاسم مركّب من مقطعين: 'جُون' (تعريب John) + 'وِيلْكِس' (تعريب Wilkes). الصياغة الصوتية
        سليمة: جُون على وزن فُول، وِيلْكِس على بنية متعددة المقاطع. كلا الجزأين يقبلان التعريف (الجون
        لفظاً وإن كان غير مستحسن للأعلام). التشكيل المُدوَّن كافٍ.
      loan_check:
        type: taarib
        verdict: "مقبول — اسم علم أجنبي يُعرَّب صوتياً وفق قواعد التعريب العربية المعيارية."
      actions:
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشحات المرحلة ١ ──
    - lemma: "وِيلْكِس"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة اللقب منفرداً دون الاسم الأول غير كافية للتمييز، إذ يوجد أكثر من شخصية تاريخية
        تحمل لقب Wilkes. الصيغة الكاملة (جُون وِيلْكِس) هي المعيار في المعجمية الموسوعية.

    - lemma: "يُوحَنَّا وِيلْكِس"
      source: stage1
      decision: removed
      decision_reason: >
        (يُوحَنَّا) هو المقابل العربي الكلاسيكي لـ John في السياق الديني المسيحي وترجمات الإنجيل.
        غير أن التعارف المعاصر في المراجع التاريخية العربية على تعريب الاسم جُون صوتياً هو السائد
        والأدق في السياق الموسوعي العلماني. لا يستوفي شرط الاستعمال الحديث المتّسق.

    - lemma: "جُون وِيلْكِز"
      source: stage1
      decision: removed
      decision_reason: >
        التهجئة بالزاي بدلاً من السين تُخالف الكتابة الصوتية القياسية العربية للحرف (s) في الإنجليزية
        البريطانية القياسية. الزاي تُناسب نطق الحرف المجهور (z) في كلمات كـ "jazz"، أما "Wilkes"
        فتُنطق بالسين غير المجهورة.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-11407174-n"
        note: "proper_noun_person"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مصلح إنجليزي نشر هجمات على جورج الثالث وأيد حقوق المستعمرين الأمريكيين (1727-1797)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول دلالياً، غير أن تعبير 'نشر هجمات' مشكّل لغوياً لأن 'الهجمة' في العربية
        تعني الاندفاع العسكري لا النقد المكتوب. الأدق: 'نشر انتقاداته' أو 'كتب مقالات هجائية'
        أو 'نشر هجاءاته السياسية'. كما أن الفعل 'أيّد' أفصح من 'وأيّد' في سياق تعريف موسوعي.
        والتعريف يفتقر إلى الطابع المعجمي الكامل: غياب الجنس القريب (سياسي، محرر...).
    authored:
      - type: encyclopedic
        text: >
          سياسيٌّ وصحفيٌّ ومصلحٌ إنجليزيٌّ (1727-1797)؛ اشتُهر بنشر مقالاته الهجائية
          ضدّ سياسات الملك جورج الثالث في صحيفته «شمال بريطانيا»، وانتُخب عضواً في البرلمان
          مرّات عدة. دافع عن حقوق المستعمرين الأمريكيين وحرية الصحافة، ويُعدُّ رائداً من روّاد
          الإصلاح الديمقراطي في بريطانيا في القرن الثامن عشر.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11407174-n"
          definition_index: 0
          text: >
            سياسيٌّ وصحفيٌّ ومصلحٌ إنجليزيٌّ (1727-1797)؛ اشتُهر بنشر مقالاته الهجائية
            ضدّ سياسات الملك جورج الثالث في صحيفته «شمال بريطانيا»، وانتُخب عضواً في البرلمان
            مرّات عدة. دافع عن حقوق المستعمرين الأمريكيين وحرية الصحافة، ويُعدُّ رائداً من روّاد
            الإصلاح الديمقراطي في بريطانيا في القرن الثامن عشر.

  examples:
    per_lemma:
      - lemma: "جُون وِيلْكِس"
        examples:
          - text: >
              يُعدُّ جُون وِيلْكِس من أبرز الأصوات التي طالبت بحرية الصحافة في إنجلترا
              خلال القرن الثامن عشر، وكان تأثيره في الرأي العام يمتدّ إلى المستعمرات الأمريكية.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            يُعدُّ جُون وِيلْكِس من أبرز الأصوات التي طالبت بحرية الصحافة في إنجلترا
            خلال القرن الثامن عشر، وكان تأثيره في الرأي العام يمتدّ إلى المستعمرات الأمريكية.


