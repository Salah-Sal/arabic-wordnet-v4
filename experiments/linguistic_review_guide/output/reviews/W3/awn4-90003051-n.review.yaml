# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (مطور ألعاب) مكتوبة بدون تشكيل كامل"
      - "التعريف الحالي 'شخص يقوم بتطوير لعبة' يستخدم الصياغة الضعيفة (يقوم بـ) ولا يحدد الطابع الرقمي/الإلكتروني"
      - "لا يوجد ILI مُسنَد للمجموعة"
      - "المجموعة تحتوي على لمّة واحدة فقط؛ ينبغي النظر في إضافة مرادفات أكثر تداولاً"
    observations: >
      المجموعة تمثل مفهوم «مطوِّر الألعاب» الرقمية، وهو مهنة ناشئة ذات تعريف مركب
      في المعجمية العربية الحديثة. الأب المباشر (مبرمج / مهندس برمجيات) يضع المجموعة
      في سياق تقنية المعلومات، مما يستلزم التمييز الدقيق بين التطوير (developer) الأعم
      والبرمجة (programmer) الأخص. الصيغة «مُطَوِّر + مجال» راسخة في المصطلحية العربية
      (مُطَوِّر تَطْبِيقَات، مُطَوِّر بَرْمَجِيَّات) مما يدعم هذا التركيب الإضافي.

  blind_candidates:
    - lemma: "مُطَوِّرُ أَلْعَاب"
      generation_method: tarkib
      justification: >
        تركيب إضافي يجمع اسم الفاعل «مُطَوِّر» (من الجذر طور، وزن مُفَعِّل للدلالة
        على الاحتراف المستمر) مع «أَلْعَاب» جمع لُعْبَة. النمط «مُطَوِّر + مجال»
        مستقر في المصطلحية العربية لتقنية المعلومات، ويوافق الدلالة العلمية لـ developer.

    - lemma: "صَانِعُ أَلْعَاب"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «صَانِع» (اسم فاعل من صنع، ومحترف يتقن الصنعة) و«أَلْعَاب».
        يستحضر الصانعَ الماهرَ الذي يُبدع منتجاً، بما يوافق مفهوم game maker بصورة
        أشمل من البرمجة وحدها.

    - lemma: "مُبَرْمِجُ أَلْعَاب"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُبَرْمِج» (اسم فاعل من برمج، المصطلح الموحد في ALECSO بمعنى
        programmer) و«أَلْعَاب». يُركز على الجانب التقني للمهنة ويشيع في السياق
        العربي الحديث.

    - lemma: "مُصَمِّمُ أَلْعَاب"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُصَمِّم» (designer، راسخ في معاجم الهندسة والحاسوب) و«أَلْعَاب».
        يُبرز بُعد التصميم الإبداعي في إنتاج الألعاب، وإن كان أضيق من developer
        الذي يشمل البرمجة والاختبار أيضاً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "مطور ألعاب"
      confirm:
        - text: >
            «مُطَوِّر تَطْبِيقَات: شخص يقوم بتطوير البرمجيات التطبيقية. وتطلق أيضاً
            على برمجية تساعد على تطوير تلك البرمجيات» [translation_en: application developer]
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ARABTERM"
        - text: >
            «مُطَوِّرُ تطبيقات: الشخصُ الذي يُصَمِّم ويُحلِّل مَظهرَ برنامجٍ تطبيقيٍّ
            وعملَه» [translation_en: application developer]
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
      expands:
        - text: >
            «(طَوَرَ) الطَّاءُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى
            مَعْنًى وَاحِدٍ، وَهُوَ الِامْتِدَادُ فِي شَيْءٍ مِنْ مَكَانٍ أَوْ
            زَمَانٍ. مِنْ ذَلِكَ طَوَارُ الدَّارِ، وَهُوَ الَّذِي يَمْتَدُّ مَعَهَا
            مِنْ فِنَائِهَا. وَلِذَلِكَ [يُقَالُ] عَدَا طَوْرَهُ، أَيْ جَازَ الْحَدُّ
            الَّذِي هُوَ لَهُ مِنْ دَارِهِ.»
          source: "مقاييس اللغة — ابن فارس (dictionary_id=151)"
          addition: >
            الجذر طور يدل على الامتداد والتجاوز من طور إلى طور، وهو ما يُعبِّر
            بدقة عن مفهوم «التطوير» الذي ينقل المنتج من حال إلى حال أرقى.

    - lemma: "مُطَوِّرُ أَلْعَاب"
      confirm:
        - text: >
            «مُطَوِّر تَطْبِيقَات: شخص يقوم بتطوير البرمجيات التطبيقية»
            [translation_en: application developer]
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — ARABTERM"
      expands:
        - text: >
            «(طَوَرَ) الطَّاءُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى
            مَعْنًى وَاحِدٍ، وَهُوَ الِامْتِدَادُ فِي شَيْءٍ مِنْ مَكَانٍ أَوْ زَمَانٍ»
          source: "مقاييس اللغة — ابن فارس"
          addition: "النمط (مُطَوِّر + مجال) مؤسَّس معجمياً في المصطلحية التقنية العربية"

    - lemma: "صَانِعُ أَلْعَاب"
      confirm:
        - text: >
            «صانع: لفظ عام يطلق على صانع الآلات والتجهيزات وكذا على مطور
            البرمجيات وأنظمة التشغيل» [translation_en: manufacturer]
