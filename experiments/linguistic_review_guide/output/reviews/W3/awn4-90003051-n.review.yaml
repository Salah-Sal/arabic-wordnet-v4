# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مطور ألعاب"
      decision: confirmed
      decision_reason: >
        اللمّة تركيب إضافي راسخ يوافق نمط «مُطَوِّر + مجال» المُثبَت في المعجمية
        التقنية العربية (مُطَوِّر تَطْبِيقَات = application developer). اجتازت
        اختبار التثبيت المعجمي بوصفها وحدة مصطلحية ثابتة، واجتازت اختبار
        الاشتقاقية (من جذر طور العربي الأصيل). تحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        «مُطَوِّرُ أَلْعَاب» يغطي الدور الإنتاجي الشامل (تصميم + برمجة + اختبار +
        إطلاق)، وهو أعم من «مُبَرْمِج أَلْعَاب» الذي يقتصر على الجانب التقني
        البرمجي، ومن «مُصَمِّم أَلْعَاب» الذي يقتصر على التصور الإبداعي والمفاهيمي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُطَوِّرُ أَلْعَاب"

    - lemma: "مُطَوِّرُ أَلْعَاب"
      source: stage1
      decision: confirmed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة «مطور ألعاب» مع إضافة التشكيل الكامل.
        تقاطع المرشح الأعمى مع اللمّة الموجودة يُعزز صحة الاختيار المصطلحي.
        الإجراء مُدمَج مع اللمّة الموجودة (update_lemma أعلاه).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "صَانِعُ أَلْعَاب"
      source: stage1
      decision: removed
      decision_reason: >
        «صانع» يحمل دلالة الحِرفة اليدوية والصنع المادي المستمد من جذر صنع، وهو
        مغاير للتطوير الرقمي. وعلى الرغم من أن معجم ARABTERM يُطلقه أحياناً على
        «مطور البرمجيات»، فإن الشيوع الأكبر هو للمصطلح «مُطَوِّر»، ولا يُسوِّغ
        وجود التعارض الدلالي إدراج «صانع ألعاب» مرادفاً.

    - lemma: "مُبَرْمِجُ أَلْعَاب"
      source: stage1
      decision: removed
      decision_reason: >
        «مُبَرْمِج» يُقابل programmer وهو مفهوم أخص من developer؛ فبينما يكتب
        المُبَرمِج الأكواد، يشمل المُطَوِّر دورة الإنتاج بأكملها. إدراج «مُبَرْمِجُ
        أَلْعَاب» في المجموعة سيُضيِّق دلالتها عن النطاق المقصود ويخلط بين
        المفهومَيْن. يمكن النظر في إنشاء hyponym مستقل له لاحقاً.

    - lemma: "مُصَمِّمُ أَلْعَاب"
      source: stage1
      decision: removed
      decision_reason: >
        «مُصَمِّم» يُقابل designer لا developer؛ مصمم الألعاب يضع المفهوم الإبداعي
        وهيكل اللعبة، أما مطور الألعاب فيتولى التنفيذ التقني الشامل. الفارق الدلالي
        واضح ويحول دون اعتبارهما مترادفَيْن.


