        examples:
          - text: >
              يُعدُّ تشارلز بولفينش من أبرز المهندسين المعماريين في تاريخ الولايات المتحدة،
              إذ أسهم تصميمه لمبنى الكابيتول الفيدرالي في رسم ملامح العمارة المدنية الأمريكية
              على مدى قرنين.
