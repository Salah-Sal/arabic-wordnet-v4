stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "بولفينش"
      decision: confirmed
      decision_reason: >
        الشكل المختصر المعروف للمهندس في بعض المراجع العربية. يُبقى كشكل ثانوي إلى جانب
        الاسم الكامل. يُصحَّح بالتشكيل ويُضاف تنبيه اللبس مع الطائر في الحاشية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      loan_check:
        type: taarib
        verdict: "مقبول — نقحرة ثابتة للاسم العائلي الأجنبي"
      nuance_differentiation: >
        الشكل المختصر (الاسم العائلي وحده)؛ يُستخدم حين يكون السياق واضحاً ولا لبس.
        يحمل خطر الالتباس مع اسم طائر البولفينش (bullfinch) في السياقات غير المتخصصة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُولفِينش"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "تشارلز بولفينش"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المعرَّب وهو الشكل الأدق والأكثر تداولاً في الموسوعات والمراجع العربية
        لتمييز هذا الشخص عن غيره. (تشارلز) نقحرة مستقرة لـ(Charles) في المعجمية العربية
        الحديثة. يُصحَّح بالتشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loan_check:
        type: taarib
        verdict: "مقبول — نقحرة ثابتة للاسم الكامل"
      nuance_differentiation: >
        الشكل الكامل والمحدَّد؛ يزيل أي لبس محتمل مع الطائر أو أشخاص آخرين يحملون
        اسم بولفينش (كالمؤلف توماس بولفينش). هو اللمّة المرجعية الأولى.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تشارلز بُولفِينش"

    # ── مرشح المرحلة ١ — شارلز بولفينش ──
    - lemma: "شارلز بُولفِينش"
      source: stage1
      decision: removed
      decision_reason: >
        نقحرة بديلة لـ(Charles) بـ(شارلز) بدلاً من (تشارلز). الأخيرة أكثر شيوعاً
        وأكثر توافقاً مع القواعد الصوتية العربية في نقحرة (Ch) الإنجليزية بـ(تش).
        لا حاجة لإضافة نقحرة ثانية في غياب شيوع موثَّق.

    # ── مرشح المرحلة ١ — بولفينتش ──
    - lemma: "بُولفِينتش"
      source: stage1
      decision: removed
      decision_reason: >
        محاولة لاستيعاب صوت (tʃ) الإنجليزي بكتابة (نتش) بدلاً من (نش). غير موثَّقة
        في أي مصدر عربي، ومخالفة للتعريب الشائع (بولفينش). يُرفض لعدم التثبّت المعجمي.


