stage4_content:
  definition:
    current: "معماري أمريكي صمم مبنى الكابيتول في واشنطن الذي كان بمثابة نموذج لمباني الكابيتول في جميع أنحاء الولايات المتحدة (1763-1844)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للإنجليزي، ويكرر كلمة (الكابيتول) مرتين
        بصورة مُتعثِّرة ركاكةً، كما يفتقر إلى الصياغة الموسوعية المناسبة لاسم علم
        (الجنس القريب + الفصل النوعي + التحديد الزمني والمكاني). يُصحَّح بجملة عربية
        أكثر رصانة وانسياباً.
    authored:
      - type: encyclopedic
        text: >
          مهندس معماري أمريكي (1763-1844)، من أبرز رواد العمارة الكلاسيكية في الولايات
          المتحدة؛ اشتُهر بتصميم مبنى الكابيتول في واشنطن العاصمة، الذي غدا نموذجاً
          يُحتذى به في تصميم مبانٍ مماثلة في سائر الولايات الأمريكية.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10890484-n"
          definition_index: 0
          text: >
            مهندس معماري أمريكي (1763-1844)، من أبرز رواد العمارة الكلاسيكية في الولايات
            المتحدة؛ اشتُهر بتصميم مبنى الكابيتول في واشنطن العاصمة، الذي غدا نموذجاً
            يُحتذى به في تصميم مبانٍ مماثلة في سائر الولايات الأمريكية.

  examples:
