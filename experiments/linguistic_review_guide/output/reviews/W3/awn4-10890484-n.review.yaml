  side_note: >
    الاستعلام عن (كابيتول) في ArabTerm أسفر عن ترجمة مفردة [entry_id=502315]
    translation_en="capitol"، مما يؤكد أن المصطلح مُعرَّب بـ(كابيتول) في المعجمية
    العربية التقنية الحديثة — يُفيد في صياغة التعريف.


