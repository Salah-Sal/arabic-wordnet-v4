# ══════════════════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد
# ══════════════════════════════════════════════════════════════
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (بولفينش، تشارلز بولفينش) خاليتان من التشكيل الكامل"
      - "اللمّة المختصرة (بولفينش) قد تُلتبَس بالطائر المعروف باسم bullfinch في اللغة العربية، إذ يُعرَّب الطائرُ هو الآخر أحياناً بـ(بولفينش)"
      - "التعريف العربي الحالي ترجمة شبه حرفية للإنجليزي، يفتقر إلى صياغة موسوعية عربية رصينة"
      - "POS على مستوى المجموعة مُسجَّل (n) وهو صحيح بمقاييس WordNet القياسية، غير أن الأسماء الأعلام للأشخاص تستوجب الإشارة إليها في التعريف بوضوح"
    observations: >
      هذه المجموعة اسم علم لشخص تاريخي بعينه، هو المهندس المعماري الأمريكي تشارلز بولفينش
      (1763-1844). أسماء الأعلام لا تقبل توليد مصطلحات اشتقاقية أو مجازية؛ فالمسار الوحيد
      الممكن هو التعريب (النقحرة). التعريب الشائع في المصادر العربية المعاصرة هو (تشارلز
      بولفينش)، وهو أدق من الشكل المختصر (بولفينش) الذي يحمل لبساً محتملاً مع اسم الطائر.
      لا يوجد تعريف عربي معجمي لهذا الاسم في قاعدة البيانات المستعلَمة، وهو متوقع لكون
      الشخصية خاصة بالسياق الأمريكي.
  blind_candidates:
    # جميع المرشحات تعريب (تاريب) — لا مجال لغيره مع أسماء الأعلام الأجنبية
    - lemma: "بُولفِينش"
      generation_method: taarib
      justification: >
        تعريب الاسم العائلي المختصر (Bulfinch) وفق قواعد النقحرة العربية الشائعة؛
        يُستخدم كشكل مختصر في المراجع العربية حين تتضح السياق، غير أنه يحمل لبساً
        محتملاً مع اسم الطائر.
    - lemma: "تشارلز بُولفِينش"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل (Charles Bulfinch) وفق النقحرة الأكثر شيوعاً في المصادر
        الموسوعية العربية؛ (تشارلز) هي النقحرة المعتمدة في أكثر المراجع العربية لـ(Charles).
    - lemma: "شارلز بُولفِينش"
      generation_method: taarib
      justification: >
        نقحرة بديلة لـ(Charles Bulfinch) تعتمد (شارلز) بدلاً من (تشارلز)؛
        أقل شيوعاً من (تشارلز) في المراجع العربية الحديثة.
    - lemma: "بُولفِينتش"
      generation_method: taarib
      justification: >
        نقحرة مقرَّبة من النطق الإنجليزي الفعلي [ˈbʊlfɪntʃ] حيث تُنطق النهاية (tʃ)؛
        غير أن هذا الشكل نادر في المصادر العربية ولم يُثبَّت معجمياً.


