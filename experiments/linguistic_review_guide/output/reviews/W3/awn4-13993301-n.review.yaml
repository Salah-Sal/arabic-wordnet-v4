stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث (ألفة، مجاملة، مودة) غير مشكّلة"
      - "لفظة «مودة» تدلّ على المحبّة القلبيّة أكثر من الكياسة والاحترام المتبادل، فهي أقرب إلى affection منها إلى comity"
      - "التعريف العربي يبدو ترجمة حرفيّة من الإنجليزيّة، ويحتاج صياغة معجميّة أصيلة"
    observations: "المفهوم (comity) يجمع بين بُعدين: الانسجام العامّ والكياسة المتبادلة. اللمّات الموجودة تغطّي كلّ بُعد على حدة: «ألفة» للانسجام، و«مجاملة» للكياسة، و«مودة» للعاطفة الوُدّيّة. لكنّ «مودة» أشدّ حرارةً من المطلوب في comity الذي يتّسم بالرسميّة والتهذيب لا بالحبّ العميق."
  blind_candidates:
    - lemma: "تَآلُف"
      generation_method: ishtiqaq
      justification: "مصدر تَفَاعُل من الجذر (أ ل ف) يدلّ على الاجتماع والالتئام المتبادل، فيناسب حالة الانسجام المشترك"
    - lemma: "مُجَامَلَة"
      generation_method: ishtiqaq
      justification: "مصدر مُفَاعَلَة من الجذر (ج م ل) يدلّ على المعاملة بالجميل والكياسة المتبادلة، وهو المقابل المباشر لـ comity في المعاجم ثنائيّة اللغة"
    - lemma: "مُوَادَّة"
      generation_method: ishtiqaq
      justification: "مصدر مُفَاعَلَة من الجذر (و د د) يدلّ على تبادل الوُدّ، فيغطّي جانب العلاقة الحميمة في المفهوم"
    - lemma: "لَبَاقَة"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر (ل ب ق) يدلّ على الحذق في المعاملة والظرف، فيقارب معنى civility"


