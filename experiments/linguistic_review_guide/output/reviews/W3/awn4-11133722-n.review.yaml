# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان خاليتان من التشكيل الكامل وهو إلزامي لكل لمّة مؤكّدة"
      - "المجموعة تحوي علماً شخصياً أجنبياً (هنري لابروست)، ولا وجود له في المعاجم العربية المعيارية، مما يجعل التحقق المعجمي متعذراً"
      - "هنري لابروست تعبير مركّب (اسم + لقب) يستوجب تصنيف MWE"
      - "التعريف الحالي مستوفٍ من حيث المعنى غير أن صياغته تقترب من الترجمة المباشرة وتفتقر إلى الأسلوب المعجمي المتكامل"
    observations: >
      المجموعة تُعنى بعَلَمٍ شخصي فرنسي (Henri Labrouste 1801–1875) اشتُهر بريادة
      البناء المعدني في العمارة الأوروبية في القرن التاسع عشر. علمٌ من هذا القبيل لا
      يخضع لمنهجية الاشتقاق أو المجاز، بل الصيغة الوحيدة الملائمة هي التعريب
      الصوتي (النقل الصوتي للاسم الأجنبي) أو التركيب (الاسم + اللقب). لا بدّ من
      ضبط اللمّتين بالتشكيل الكامل. ينبغي التحقق من أن pos = n صحيح، إذ الأنسب
      proper_noun وإن كانت قواعد AWN4 تُدرج الأعلام ضمن n.

  blind_candidates:
    - lemma: "لَابْرُوسْت"
      generation_method: taarib
      justification: >
        تعريب صوتي للقب الفرنسي «Labrouste» وفق الاصطلاح العربي المتّبع في نقل
        الأسماء الفرنسية (La → لا، brouste → بروست). هذا الشكل الأكثر احتمالاً
        للقب المعماري الفرنسي المذكور في التعريف (1801–1875).
    - lemma: "هَنْري لَابْرُوسْت"
      generation_method: tarkib
      justification: >
        تركيب إضافي يجمع الاسم الأول «هنري» (Henri) واللقب «لابروست» (Labrouste)
        في وحدة معجمية واحدة تُحيل على الشخصية بكاملها. هذا هو النمط المعتاد
        لتعريب أسماء الأعلام الأجنبيين في المصادر العربية المتخصصة.
    - lemma: "أَنْري لَابْرُوسْت"
      generation_method: taarib
      justification: >
        بديل صوتي آخر للاسم «Henri» انطلاقاً من نطقه الفرنسي /ɑ̃ʁi/ الذي يُعرَّب
        أحياناً «أنري» بدلاً من «هنري». يُستخدم هذا الشكل في بعض المراجع العربية
        للتمييز بين النطق الفرنسي والإنجليزي للاسم ذاته.
    - lemma: "هَنْري لَبْرُوسْت"
      generation_method: taarib
      justification: >
        صيغة تعريبية بديلة تحذف المدّة في «لا-بروست» وتُنتج «لَبروست»، وقد يظهر
        هذا الشكل في المراجع التي تتبنى نقلاً صوتياً مختلفاً لصوت الفتحة الطويلة
        الفرنسية في المقطع الأول من اللقب.


