# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١: لابروست ──
    - lemma: "لابروست"
      decision: confirmed
      decision_reason: >
        لقب المعماري الفرنسي هنري لابروست في صورته المعرَّبة المتداولة. التعريب
        الصوتي هو السبيل الوحيد الممكن لإدراج هذا العلم الشخصي في الشبكة الدلالية
        العربية. لا يوجد دليل معجمي نافٍ. الشكل صحيح صوتياً ومقبول عرفاً.
        يستوجب تحديث الضبط بالتشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُحيل على الشخصية بمجرد اللقب (الكنية) دون الاسم الأول، ويُستخدم في
        السياقات الأكاديمية والمتخصصة التي تكتفي بذكر اللقب عند معرفة السياق.
      borrowing_check:
        type: taarib
        verdict: مقبول — الاسم عَلَمٌ أجنبي لا بديل عربي له
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَابْرُوسْت"

    # ── اللمّة الموجودة ٢: هنري لابروست ──
    - lemma: "هنري لابروست"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للمعماري الفرنسي (الاسم الأول + اللقب)، وهو الشكل الأشمل
        والأكثر دقة تعريفياً. التعبير مركّب ثنائي (اسم + لقب) يؤلّف وحدة معجمية
        ثابتة في سياق الأعلام الشخصية الأجنبية. مقبول بوصفه تعريباً مزدوجاً
        (تركيب + تعريب). يستوجب تحديث الضبط بالتشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُحيل على الشخصية بكمال هويتها (اسم + لقب) ويُستخدم في السياقات التي
        تستدعي التعريف الكامل كعناوين الكتب والمصادر الموسوعية والمقالات التأسيسية،
        خلافاً لـ«لابروست» وحده الذي يُكتفى به بعد التعريف الأول.
      borrowing_check:
        type: tarkib_taarib
        verdict: >
          مقبول — التركيب الإضافي (اسم+لقب) هو النمط المعتاد لأسماء الأعلام
          الأجنبيين في العربية. المكوّنان معرَّبان صوتياً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَنْري لَابْرُوسْت"

    # ── مرشح المرحلة ١: لَابْرُوسْت ──
    - lemma: "لَابْرُوسْت"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو نفسه اللمّة الموجودة «لابروست» بعد إضافة التشكيل. تمّت
        معالجته عبر الإجراء update_lemma على اللمّة الموجودة، فلا حاجة لإنشاء
        مدخل مستقل.

    # ── مرشح المرحلة ١: هَنْري لَابْرُوسْت ──
    - lemma: "هَنْري لَابْرُوسْت"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو نفسه اللمّة الموجودة «هنري لابروست» بعد إضافة التشكيل.
        تمّت معالجته عبر الإجراء update_lemma على اللمّة الموجودة، فلا حاجة لإنشاء
        مدخل مستقل.

    # ── مرشح المرحلة ١: أَنْري لَابْرُوسْت ──
    - lemma: "أَنْري لَابْرُوسْت"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بديلة للنطق الفرنسي لـ«هنري»، غير أن الشكل المتداول في المصادر العربية
        المعتمدة هو «هَنْري» لا «أَنْري». إضافة هذه الصيغة تُربك ولا تُضيف دلالة
        مميِّزة. يُرفض.

    # ── مرشح المرحلة ١: هَنْري لَبْرُوسْت ──
    - lemma: "هَنْري لَبْرُوسْت"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تعريبية مشوَّهة تحذف المدّة في المقطع الأول من اللقب «لا-بروست».
        الشكل القياسي المتداول هو «لَابْرُوسْت» بالمدّ. الحذف تحريفٌ صوتي لا
        مسوّغ له. يُرفض.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
stage4_content:
  definition:
    current: "معماري فرنسي كان من أوائل من استخدموا البناء المعدني بنجاح (1801-1875)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في جوهره لكنه يُشبه الترجمة الآلية للتعريف الإنجليزي
        أكثر من أن يكون تعريفاً معجمياً بأسلوب الوسيط. كما أن التاريخين
        (1801-1875) وردا بين قوسين دون ذكر السياق الجغرافي والحضاري الكافي، ويمكن
        إثراء التعريف بأبرز أعماله المعمارية لتمييزه عن سواه.
    authored:
      - type: encyclopedic
        text: >
          مهندسٌ معماريٌّ فرنسي (1801–1875)، يُعدُّ من أوائل المعمارِيِّين الذين
          أدخلوا البناءَ المعدنيَّ في العمارة الغربية بصورة ناجحة ومتكاملة.
          من أبرز أعماله مكتبةُ القديسة جينيفيف (1851) ومكتبةُ فرنسا الوطنية
          بباريس، حيث وظَّف الحديدَ المصبوب في الأقواس والأسقف تأسيساً لمرحلة
          انتقال العمارة الأوروبية نحو المواد الصناعية الحديثة.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11133722-n"
          definition_index: 0
          text: >
            مهندسٌ معماريٌّ فرنسي (1801–1875)، يُعدُّ من أوائل المعمارِيِّين الذين
            أدخلوا البناءَ المعدنيَّ في العمارة الغربية بصورة ناجحة ومتكاملة.
            من أبرز أعماله مكتبةُ القديسة جينيفيف (1851) ومكتبةُ فرنسا الوطنية
            بباريس، حيث وظَّف الحديدَ المصبوب في الأقواس والأسقف تأسيساً لمرحلة
            انتقال العمارة الأوروبية نحو المواد الصناعية الحديثة.

