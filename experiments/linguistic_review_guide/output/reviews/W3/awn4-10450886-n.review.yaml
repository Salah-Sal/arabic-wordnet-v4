# ══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-10450886-n  |  ILI: i92013  |  POS: n
# Lemmas: صانع بيانو
# Definition (EN): a person who makes pianos
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة 'صانع بيانو' تفتقر إلى التشكيل الكامل"
      - "التعريف يستخدم صيغة الجمع 'آلات البيانو' والأدق 'آلة البيانو' إذ البيانو نوع واحد من الآلات"
      - "المجموعة تضم لمة واحدة فحسب لمفهوم مهني متخصص"
    observations: >-
      المجموعة تُمثّل مهنة حِرَفية مُتخصِّصة للغاية، هي صناعة البيانو، وهو
      صَرح موسيقي غربي مُعرَّب انتشر في الثقافة العربية دون أن يترك للحِرفة
      المتعلقة بصنعه أثراً معجمياً مخصوصاً. يرتبط الهايبرونيم بالجذر العربي
      الأصيل (صنع)، وهو من أجلى الجذور وأكثرها اطّراداً. التركيب الإضافي
      'صانع بيانو' هو الأسلوب الأطبع في العربية المعاصرة لتعيين هذه المهنة.

  blind_candidates:
    - lemma: "صانِعُ البَيانو"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من 'صانع' (اسم فاعل من صنع) و'البيانو' (المعرَّب المقبول)؛
        صيغة شائعة في العربية لتعيين أصحاب الحِرَف المتعلقة بالآلات. يختلف عن
        'صانع بيانو' في إلحاق ال التعريف بالمضاف إليه مما يُعيَّن الآلة نوعاً.
    - lemma: "مُصَنِّعُ البَيانو"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من 'مُصَنِّع' (اسم فاعل من صَنَّعَ، Form II، بدلالة التصنيع
        الاحترافي المنظَّم) و'البيانو'؛ يحمل دلالة التصنيع الصناعي المتكرر بعكس
        الصناعة اليدوية الفردية.
    - lemma: "قَيَّانٌ"
      generation_method: majaz
      justification: >-
        القَيْن في التراث العربي الحَدَّاد ثم كل صانع محترف. يمكن مجازاً تحميله
        معنى الحِرَفي المتخصص في الآلات الموسيقية الوترية لِما بين حِرفة الحداد
        وصانع البيانو من صلة في العمل بالمعادن والأوتار.
    - lemma: "نَقَّارٌ"
      generation_method: majaz
      justification: >-
        من الجذر نقر (نَقَرَ الخشبَ والحجرَ)؛ صانع البيانو يعتمد في حرفته على
        نحت الخشب بدقة وضبط المطارق الخشبية؛ إزاحة دلالية وظيفية من الحِرافة
        الخشبية إلى صناعة هيكل البيانو.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية (صانع بيانو + مرشحات + مكوّنات)
#   Q2 — جسر إنجليزي (piano maker / piano manufacturer / piano builder) → لم يُسفر عن نتائج
#   Q3 — FTS عربي (بيانو + صانع + آلة موسيقية)
#   Q4 — مقاييس اللغة (صنع + قين + نقر)
stage2_evidence:
  per_lemma:
    - lemma: "صانع بيانو"
      expands:
        - text: "«مَن يصنع بيديه مَنْ يحترف الصناعة»"
          source: "المعجم الوسيط"
          addition: "يثبت 'صانع' بمعنى محترف الصنعة، وهو الجزء الأول من المركب"
        - text: "«آلة موسيقية من مُخترعات القرن الثامن عشر، تعتمد على الطرق بدلاً من غمز الأوتار بريشة خاصة، وتشتمل على دواسة تُعين على التحكّم في إطالة النغمة، وعلى مُنظّمات تُخفّف الصوت أو تُنظّمه»"
          source: "المعجم الكبير"
          addition: "يثبت 'البيانو' بوصفه آلة موسيقية معرَّفة معجمياً، وهو المضاف إليه في المركب"
        - text: "«لفظ عام يطلق على صانع الآلات والتجهيزات وكذا على مطوِّر البرمجيات وأنظمة التشغيل»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "يؤكد 'صانع' مصطلحاً معاصراً لمن يصنع الآلات، بما يشمل الآلات الموسيقية"

    - lemma: "صانِعُ البَيانو"
      evidence_status: "no_material_found"

    - lemma: "مُصَنِّعُ البَيانو"
      evidence_status: "no_material_found"

    - lemma: "قَيَّانٌ"
      expands:
        - text: "«قَيَّان: محترف الحدادة، وصانع الحديد ومسويه، وجامع الشيء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يثبت قَيَّان بمعنى الحِرَفي المحترف القائم على إصلاح الأشياء وصنعها"
      contradicts:
        - text: "«الْقَافُ وَالْيَاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِصْلَاحٍ وَتَزْيِينٍ. مِنْ ذَلِكَ الْقَيْنُ: الْحَدَّادُ، لِأَنَّهُ يُصْلِحُ الْأَشْيَاءَ وَيَلُمُّهَا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدل على الحدادة وإصلاح المعادن أصالةً؛ التوسع إلى صناعة الآلات الموسيقية الوترية مجازٌ بعيد يفتقر إلى شاهد"
        - text: "«قِيَان: جمع قَيْنَة بمعنى المغنية، والأمة صانعة أو غير صانعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "قِيَان في المعجم المعاصر يُفهم منه الإماء المغنيات لا صنّاع البيانو، مما يُوقع في لبس دلالي مُضِرّ"

    - lemma: "نَقَّارٌ"
      contradicts:
        - text: "«الكثير النَّقْر رَجُلٌ نَقَّارٌ: بحَّاث عن الأمور والأخبار مَن يحترف نَقْر الحجارة والخشب من يَنقُش الرُّكُب واللُّجُم ونحوهما»"
          source: "المعجم الوسيط"
          conflict: "النقّار متخصص في نقر الحجارة والخشب ونقش المعادن، لا في صناعة البيانو بكامل عملياتها من أوتار ومطارق وهيكل"
        - text: "«طير من رتبة نقارات الخشب يمتاز بمنقاره المستقيم الأزملي النهاية، اللسان طويل يلتقط بواسطته الحشرات»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          conflict: "استقرّ المصطلح العلمي المعاصر على 'نقّار' للدلالة على طائر نقّار الخشب (woodpecker)، فيُحدث التضارب الدلالي عائقاً أمام توظيفه لهذا المفهوم"
      expands:
        - text: "«النُّونُ وَالْقَافُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قَرْعِ شَيْءٍ حَتَّى تُهْزَمَ فِيهِ هَزْمَةٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على القرع والنقر، وفيه صلة جزئية بآلية عمل مطارق البيانو (الطرق على الأوتار)؛ لكنها لا تكفي لتأسيس مصطلح"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "صانع بيانو"
      decision: confirmed
      decision_reason: >-
        التركيب الإضافي 'صانع بيانو' هو التعبير الأطبع والأيسر للمهنة في العربية
        المعاصرة؛ مكوّناه موثَّقان معجمياً بدلالات صريحة تنسجم مع المفهوم،
        ويجتاز اختبار السكّ (إبدال 'صانع' بـ'حِرَفي' يُغيّر الدلالة بما يُثبت
        ثباته الاصطلاحي). التركيب شائع ومطّرد على غرار: صانع أحذية، صانع خزف.
        يحتاج تحديث التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        اللمة الوحيدة في المجموعة؛ تتمايز عن الهايبرونيم 'صانع' بتخصيصها صناعة
        البيانو دون سائر الصناعات، وهو تخصيص يستلزم مهارات دقيقة متعددة التخصص
        (نجارة، ميكانيكا، موسيقى)
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَانِعُ بيانو"

    - lemma: "صانِعُ البَيانو"
      source: stage1
      decision: removed
      decision_reason: >-
        مرادف للمة الموجودة 'صانع بيانو' مع فارق ال التعريف فحسب؛ يُفضَّل الشكل
        النكرة لتسمية المهنة بوصفها صنفاً لا فرداً بعينه. لا قيمة مضافة تستوجب
        تسجيله لمةً مستقلة.

    - lemma: "مُصَنِّعُ البَيانو"
      source: stage1
      decision: removed
      decision_reason: >-
        يفشل اختبار السكّ: إبدال 'مُصَنِّع' بـ'صانع' أو 'مُنتِج' لا يُفقد
        التعبير دلالته، مما يكشف عنه وصفاً حراً لا مصطلحاً مثبتاً. فضلاً عن
        ذلك، تحمل صيغة Form II (مُصَنِّع) دلالة التصنيع الصناعي الكبير التي لا
        تناسب مهنة حرفية يدوية دقيقة كصناعة البيانو.

    - lemma: "قَيَّانٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم ثبوت معنى 'الحِرَفي' تراثياً، فإن قَيَّان في العربية المعاصرة يُفهم
        منه الإماء المغنيات (قيان الغناء)، مما يُفضي إلى التباس دلالي بين
        الصانع والعازف. كما أن الأصل المعجمي يربطه بالحدادة لا بصناعة الآلات
        الموسيقية، والتوسع المجازي المقترح لا يسنده شاهد معجمي معتمد.

    - lemma: "نَقَّارٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        استقر الاستعمال المعاصر على 'نقّار' للدلالة على طائر نقّار الخشب
        (woodpecker) في المصطلحية العلمية، وهو تعارض دلالي مباشر. أما معناه
        القديم (نقّاش الحجارة والخشب) فلا يُغطي سوى جزء هامشي من حرفة صناعة
        البيانو، ويفتقر إلى الخصوصية الكافية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يصنع آلات البيانو"
    assessment:
      decision: revise
      reason: >-
        صيغة 'آلات البيانو' غير دقيقة؛ البيانو اسم لنوع واحد من الآلات لا
        لأنواع متعددة، فالجمع يوحي بتعدد أصناف تسمى كلها 'بيانو'، والصواب
        'آلة البيانو'. كذلك 'شخص' أقل دقةً من الأسلوب المعجمي 'مَن'.
    authored:
      - type: terminological
        text: "مَن يحترف صناعةَ آلة البيانو الموسيقية وتجميعَ أجزائها الخشبية والمعدنية والوترية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَن يصنع البيانو ويُتقن تركيبَ أوتاره ومطارقه وهيكله الخشبي"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَن يحترف صناعةَ آلة البيانو الموسيقية وتجميعَ أجزائها الخشبية والمعدنية والوترية"

  examples:
    per_lemma:
      - lemma: "صَانِعُ بيانو"
        examples:
          - text: "تتطلّب مهنة صانع البيانو خبرةً دقيقة في نحت الخشب وشدّ الأوتار المعدنية وضبط نغمات المطارق."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تتطلّب مهنة صانع البيانو خبرةً دقيقة في نحت الخشب وشدّ الأوتار المعدنية وضبط نغمات المطارق."


