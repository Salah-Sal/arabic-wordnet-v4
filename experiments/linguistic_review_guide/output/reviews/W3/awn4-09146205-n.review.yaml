stage1_review:
  assessment:
    concerns:
      - "الاسم الحالي 'نهر هارلم' هو الترجمة المتعارف عليها، ولكن جغرافياً هو مضيق مدي (tidal strait)."
    observations: "المجموعة تشير إلى مَعلم جغرافي محدد في مدينة نيويورك. الاسم العربي هو تعريب مباشر للاسم الإنجليزي. التعريف الحالي دقيق جغرافياً ولكنه يحتاج إلى تحسين صياغي ليكون أكثر موسوعية."
  blind_candidates:
    - lemma: "نَهْر هَارْلِم"
      generation_method: taarib
      justification: "الاسم المتعارف عليه والمترجم حرفياً للمَعلم الجغرافي."
    - lemma: "قَنَاة هَارْلِم"
      generation_method: tarkib
      justification: "وصف للمجرى المائي بناءً على التعريف والارتباط بالمجموعة العليا (قناة)."
    - lemma: "مَضِيق هَارْلِم"
      generation_method: tarkib
      justification: "الوصف الجغرافي الدقيق للمجرى المائي كونه مضيقاً مدياً يصل بين مسطحين مائيين."
    - lemma: "مَجْرَى هَارْلِم المَائِيّ"
      generation_method: tarkib
      justification: "تعبير وصفي عام للمجرى المائي."

stage2_evidence:
  per_lemma:
    - lemma: "نهر هارلم"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "نهر هارلم"
      decision: confirmed
      decision_reason: "هو الاسم العربي الشائع والوحيد المستخدم لهذا المَعلم الجغرافي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَهْر هَارْلِم"

stage4_content:
  definition:
    current: "قناة تفصل مانهاتن عن برونكس"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه يفتقر إلى السياق الجغرافي الكامل (المدينة والمسطحات المائية المتصلة)."
    authored:
      - type: encyclopedic
        text: "قَنَاةٌ مَائِيَّةٌ (أَوْ مَضِيقٌ مَدِّيٌّ) تَفْصِلُ بَيْنَ حَيَّي مَانْهَاتِن وَالبُرُونْكِس فِي مَدِينَةِ نِيُويُورْك، وَتَصِلُ بَيْنَ نَهْرِ هَادْسُون وَنَهْرِ إِيسْت."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "قَنَاةٌ مَائِيَّةٌ تَفْصِلُ بَيْنَ مَانْهَاتِن وَالبُرُونْكِس فِي مَدِينَةِ نِيُويُورْك، وَتَصِلُ بَيْنَ نَهْرَي هَادْسُون وَإِيسْت."

  examples:
    per_lemma:
      - lemma: "نهر هارلم"
        examples:
          - text: "يُعَدُّ نَهْرُ هَارْلِم مَجْرًى مَائِيًّا حَيَوِيًّا يَمْتَدُّ لِنَحْوِ ثَمَانِيَةِ أَمْيَالٍ بَيْنَ مَانْهَاتِن وَالبُرُونْكِس."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُقَامُ سِبَاقَاتُ التَّجْدِيفِ السَّنَوِيَّةِ فِي نَهْرِ هَارْلِم الَّذِي يَفْصِلُ مَانْهَاتِن عَن البُرُونْكِس."

