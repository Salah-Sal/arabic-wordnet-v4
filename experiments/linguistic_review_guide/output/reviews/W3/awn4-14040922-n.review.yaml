# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14040922-n (salt depletion)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «نقص الملح» غير مشكّلة، وتحتاج إلى تشكيل كامل"
      - "«نقص» أعمّ دلالياً من المطلوب؛ المصطلح الطبي المعياري هو «نَفاد» لا «نقص»"
      - "المجموعة تحتوي لمّة واحدة فقط وهي تعبير مركب إضافي غير موثّق معجمياً بهذه الصيغة"
    observations: "المفهوم طبّي تخصّصي يصف حالة فقدان الملح من الجسم دون تعويض عبر آليات مختلفة (القيء، التعرّق، التبوّل، الإسهال) مع اختلال توازن الكهارل. المصطلح ينتمي إلى حقل الفسيولوجيا المرضية. التعريف العربي الحالي جيّد ومفصّل لكن يحتاج مراجعة أسلوبية. المجموعة الأب (استنفاد/نضوب) تستخدم مصطلحات مختلفة عن اللمّة الحالية."

  blind_candidates:
    - lemma: "نَفَاد المِلْح"
      generation_method: tarkib
      justification: "مركب إضافي من «نَفاد» (مصدر نَفِدَ = فنِي وانقطع) و«المِلْح»؛ يصف انقطاع الملح من الجسم بدقّة أكبر من «نقص» الذي يدلّ على مجرد الانخفاض لا الضياع"
    - lemma: "اسْتِنْزَاف المِلْح"
      generation_method: tarkib
      justification: "مركب إضافي من «استنزاف» (سحب واستنفاد تدريجي) و«الملح»؛ يؤكد البعد الديناميّ للفقدان عبر آليات الإخراج المتعددة"
    - lemma: "نَضْب المِلْح"
      generation_method: tarkib
      justification: "مركب إضافي من «نَضْب» (جفاف المنبع وذهابه) و«الملح»؛ يُحيل إلى صورة المَعين الذي ينضُب، وهو استعمال تراثي للنفاد"
    - lemma: "شَحّ المِلْح"
      generation_method: tarkib
      justification: "مركب إضافي من «شَحّ» (قلّة مع حرص) و«الملح»؛ يصف حالة القلّة والندرة في مخزون الملح الجسمي"


stage2_evidence:
  per_lemma:
    - lemma: "نَقْص المِلْح"
      expands:
        - text: "«النَّقْصُ: الضعْف يُقَال أَصَابَهُ نقص فِي عقله أَو دينه»"
          source: "المعجم الوسيط (هَوَرَماني)"
          addition: "نقص يدل على الضعف والانخفاض عموماً لا على الفقدان التام"
        - text: "«(نَقَصَ) النُّونُ وَالْقَافُ وَالصَّادُ كَلِمَةٌ وَاحِدَةٌ، هِيَ النَّقْصُ: خِلَافُ الزِّيَادَةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على خلاف الزيادة بشكل عام، وليس متخصصاً في الفقدان الفسيولوجي"
      contradicts:
        - text: "«نَفادُ المِلْح» = salt depletion (المعجم الطبي الموحد)"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي الموحد يستخدم «نَفاد» لا «نقص» مقابل depletion؛ و«نقص» تُقابل عادةً deficiency أو decrease"

    - lemma: "نَفَاد المِلْح"
      confirm:
        - text: "«نَفادُ المِلْح» = salt depletion"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«نَفاد: ضياع قسم كبير من أحد المقومات الرئيسية في البدن مثل الماء والأملاح» = depletion"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«نفاد: إزالة السائل من الجسم» = depletion"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      expands:
        - text: "«نَوبَةُ نَفادِ المِلْح» = salt-depletion crisis"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المصطلح يدخل في مركبات طبية أخرى مما يدل على رسوخه"
        - text: "«مُتَلاَزِمَةُ نَفادِ المِلْح» = salt-depletion syndrome"
          source: "المعجم الطبي الموحد (2009)"
          addition: "مركب طبي آخر يؤكد التثبيت المعجمي"

    - lemma: "اسْتِنْزَاف المِلْح"
      expands:
        - text: "«استنزاف» = depletion / exhaustion"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "المصطلح يُستخدم في سياق استنزاف الموارد المائية لا في الطب"
      contradicts:
        - text: "«استنزاف: سحب المياه بمعدل يزيد عن معدل تجددها الطبيعي» = depletion"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "الاستخدام محصور في حقل المياه والموارد الطبيعية، ولا يوجد توثيق طبي"

    - lemma: "نَضْب المِلْح"
      evidence_status: "no_material_found"

    - lemma: "شَحّ المِلْح"
      contradicts:
        - text: "«الشُّحُّ: البُخْلُ والحِرْصُ»"
          source: "القاموس المحيط"
          conflict: "شحّ يدل على البخل والمنع الإرادي، لا على الفقدان الفسيولوجي اللاإرادي"


stage3_analysis:
  per_lemma:
    - lemma: "نَقْص المِلْح"
      decision: confirmed
      decision_reason: "تعبير مركب إضافي مفهوم ومتداول في النصوص الطبية العامة، وإن كان «نَفاد» أدقّ طبياً. يُبقى عليه بوصفه بديلاً عامّاً مع إضافة التشكيل الكامل."
