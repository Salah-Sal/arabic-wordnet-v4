        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدل على انخفاض مستوى الملح دون إيحاء بالضياع التام؛ أعمّ من «نفاد» ويصلح في السياق غير التخصصي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَقْص المِلْح"

    - lemma: "نَفَاد المِلْح"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح طبي موحّد موثّق في المعجم الطبي الموحد (2009) مقابل salt depletion بالضبط، ويدخل في مركبات طبية أخرى (نوبة نفاد الملح، متلازمة نفاد الملح). أدقّ وأخصّ من «نقص»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدل على فقدان الملح وفنائه من الجسم، وهو المصطلح الطبي المعياري الأدقّ؛ يفيد الضياع التام لا مجرد الانخفاض"
      actions:
        - command: create_entry
          params:
            lemma: "نَفَاد المِلْح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اسْتِنْزَاف المِلْح"
      source: stage1
      decision: removed
      decision_reason: "«استنزاف» موثّق في حقل هندسة المياه والموارد الطبيعية فحسب، ولا يوجد توثيق لاستخدامه في السياق الطبّي الفسيولوجي. المعاجم الطبية تستخدم «نفاد» لا «استنزاف»."

    - lemma: "نَضْب المِلْح"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على استخدام «نَضْب» في سياق طبي أو فسيولوجي؛ دلالته الأصلية في جفاف المنابع والآبار."

    - lemma: "شَحّ المِلْح"
      source: stage1
      decision: removed
      decision_reason: "«شحّ» يدل على البخل والمنع الإرادي، وهو مناقض دلالياً لحالة الفقدان اللاإرادي الفسيولوجي المقصودة."


