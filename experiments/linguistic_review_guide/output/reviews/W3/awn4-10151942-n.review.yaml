        مع أسلوب المعجم الوسيط في التعريف الاصطلاحي. يُفوّت ما أثبتته المعاجم من أن
        الزَّجَّاج يجمع الصانع والبائع. يحتاج إلى جنس قريب وفصل نوعي.
