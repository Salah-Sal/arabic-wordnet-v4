# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة الموجودة 'صانع زجاج' وصفية تكرر كلمات التعريف ذاتها (يصنع / الزجاج)، وليست مصطلحاً مسكوكاً ولا وحدة معجمية مستقلة"
      - "اللمّة تفتقر إلى التشكيل الكامل"
      - "المعاجم العربية الكبرى (الوسيط، الكبير، المورد الحديث) تُقِرّ وزن فَعَّال (الزَّجَّاج) مصطلحاً راسخاً للدلالة على هذه الحرفة، وهو أكثر إيجازاً وأقوى معجمية"
      - "المجموعة تضمّ لمّة واحدة فقط مع تعريف بسيط لا يتوافق مع أسلوب المعجم الوسيط"
    observations: >
      المجموعة تمثّل مفهوماً حِرفياً واضح الحدود: الشخص المحترف لصناعة الزجاج. الجذر
      (ز ج ج) غنيٌّ في العربية ويُتيح اشتقاق مصطلح احترافي على وزن فَعَّال القياسي
      لأسماء الحِرَف (نَجَّار، حَدَّاد، فَخَّار، قَصَّاب). التعريف الحالي "شخص يصنع
      الزجاج" تعريف دائريّ لا يستوفي معيار عدم الدوران.

  blind_candidates:
    - lemma: "زَجَّاج"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال القياسي الأكثر إنتاجية للدلالة على أصحاب الحِرَف والمهن
        (نَجَّار من نجر، حَدَّاد من حدد، قَصَّاب من قصب)، مشتق مباشرة من
        الجذر (ز ج ج) الدال على مادة الزجاج. الوزن ثابت المعجمية ولا يقبل
        الاستبدال الحرّ بمرادف.
    - lemma: "مُزَجِّج"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الثلاثي المضعف زَجَّجَ (Form II)، يصف من يقوم بعملية
        التزجيج؛ محاولة لاستقطاب المعنى الفعلي لعمل الزجاج لا الاتجار به.
    - lemma: "زُجَاجِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى الزجاج للدلالة على صاحب الحرفة، قياساً على "كَهْرَبائيّ"
        و"نَجَّارِيّ" في العربية المعاصرة؛ النسبة تُحوّل المادة إلى لقب مهني.
    - lemma: "صانِعُ الزُّجَاجِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي اصطلاحي من نمط أسماء المهن المركّبة في العربية المعاصرة
        (صانع السفن، صانع الأثاث)؛ يُبرز الصناعةَ تحديداً دون تعميم يشمل البيع.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "صانع زجاج"
      evidence_status: "no_material_found"
      # لم يُرصد المصطلح المركّب كمدخل مستقل في أي معجم مستعلَم؛
      # هو صياغة وصفية مطابقة لتعريف الزَّجَّاج لا مصطلح مسكوك.

    - lemma: "زَجَّاج"
      confirm:
        - text: "«صانعُ الزُّجاج بائعُه»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«صانِعُ الزُّجاجِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«صانع الزّجاج وبائعه»"
          source: "المعجم الوسيط — طبعة Hawramani"
        - text: "«الزَّجّاج: صانع الزُّجاج.»"
          source: "المورد الحديث (2008) — مقابل: glassmaker"

    - lemma: "مُزَجِّج"
      evidence_status: "no_material_found"
      # المورد الحديث يُثبت الفعل «يُزجِّج: يضع للشيء زجاجاً» لكنّه لا يُثبت
      # اسم الفاعل مُزَجِّج بمعنى صانع الزجاج؛ الاستخدام الموثق هو للتزجيج
      # (glazing) لا صناعة الزجاج ابتداءً.

    - lemma: "زُجَاجِيّ"
      contradicts:
        - text: "«بائع الزُّجاج»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "الزجاجيّ في المعجم الوسيط بائعٌ لا صانع؛ المعنى مغاير للمجموعة"
        - text: "«بائِعُ الزُّجاجِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "نفس التعارض: الزجاجيّ = بائع الزجاج"
        - text: "«بَائِع الزّجاج»"
          source: "المعجم الوسيط — طبعة Hawramani"
          conflict: "تكرار التعارض: بائع لا صانع"
      expands:
        - text: "زُجَاجِيّ = vitreous / hyaline / glassy"
          source: "ARABTERM (معجم التشريح العياني، معجم الجيولوجيا)"
          addition: "في المصطلحية العلمية زُجَاجِيّ صفةٌ تعني الشبيه بالزجاج، لا اسمٌ للحِرفة"

    - lemma: "صانِعُ الزُّجَاجِ"
      expands:
        - text: "«صانعُ الزُّجاج بائعُه»"
          source: "المعجم الوسيط (مجمع اللغة العربية) — ضمن تعريف الزَّجَّاج"
          addition: "العبارة مُثبَتة معجمياً لكن كتعريف للزَّجَّاج لا كمدخل قائم بذاته"
        - text: "«الزَّجّاج: مركِّب الزُّجاج.»"
          source: "المورد الحديث (2008) — مقابل: glazier"
          addition: "يُميَّز في المورد الحديث بين صانع الزجاج (glassmaker = الزجّاج) ومركّب الزجاج (glazier = الزجّاج أيضاً) مما يُضعف حاجة المركّب الجديد"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "صانع زجاج"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي مقبول كوحدة معجمية في ألقاب المهن العربية المعاصرة، وإن كان
        وصفياً. يُبقى في المجموعة إلى جانب المصطلح المسكوك الأدق (زَجَّاج) مع تصحيح
        التشكيل ليكون إضافياً سليماً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الجانب الصناعي (الصنع) دون البيع؛ وصفي عام يُستعمل في السياقات
        التعليمية والوصفية حين يُراد تحديد النشاط لا اللقب المهني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صانِعُ زُجَاجٍ"

    - lemma: "زَجَّاج"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك راسخ وثّقته ثلاثة معاجم كبرى (الوسيط، الكبير، المورد الحديث)
        بمعنى «صانع الزجاج وبائعه». وزن فَعَّال قياسيٌّ لأسماء الحِرَف في العربية،
        ويجتاز اختبار السكّ (لا يقبل الاستبدال الحرّ)، واختبار التثبيت المعجمي بأدلة
        OCR من المعجم الوسيط والكبير كليهما.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح المسكوك الجامع بين الصناعة والبيع؛ يُستعمل في السياقات الاحترافية
        والمهنية وهو اللقب الرسمي للحرفة خلافاً للتركيب الوصفي "صانع زجاج".
      actions:
        - command: create_entry
          params:
            lemma: "زَجَّاج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10151942-n"

    - lemma: "مُزَجِّج"
      source: stage1
      decision: removed
      decision_reason: >
        لا يوجد توثيق معجمي لاستخدامه اسماً للحِرفة (صانع الزجاج). الفعل يُزجِّج
        موثّق بمعنى "يضع للشيء زجاجاً" (glazing)، وهو نشاط مغاير لصناعة الزجاج
        ابتداءً. اشتقاق اسم الفاعل لهذا المعنى تعسفي غير مسكوك.

    - lemma: "زُجَاجِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الثلاثة الكبرى تتفق على أنّ الزَّجَّاجيَّ = بائع الزجاج لا صانعه،
        مما يُحدث تعارضاً مباشراً مع دلالة المجموعة. فضلاً عن ذلك، المصطلحية
        العلمية الحديثة تستخدمه صفةً (vitreous/glassy) لا اسماً للحِرفة.

    - lemma: "صانِعُ الزُّجَاجِ"
      source: stage1
      decision: removed
      decision_reason: >
        مرادف وصفي للمّة الموجودة "صانع زجاج" دون قيمة مضافة. إضافة أداة التعريف
        (الزجاج) لا تُحوّله إلى مصطلح مستقل. وجود الزَّجَّاج المسكوك يُغني عنه.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
