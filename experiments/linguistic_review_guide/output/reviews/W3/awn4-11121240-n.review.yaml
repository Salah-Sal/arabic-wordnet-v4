# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى: آرثر كينيلي (موجودة) ──
    - lemma: "آرثر كينيلي"
      decision: confirmed
      decision_reason: >
        تعريب صوتي سليم للاسم "Arthur Kennelly"؛ يُمثّل الصيغة الرسمية الأكثر شيوعاً في المصادر
        العربية. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يجمع الاسمَ الأول والأخير معاً وهو الشكل الرسمي المعتاد عند التعريف بالشخصية لأول مرة،
        أو في سياقات موسوعية تتطلب التعريف الكامل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "آرثُر كِينِيلِي"

    # ── اللمّة الثانية: كينيلي (موجودة) ──
    - lemma: "كينيلي"
      decision: confirmed
      decision_reason: >
        الاسم الأخير وحده؛ مقبول كصيغة اختصارية أكاديمية شائعة. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اسم الأسرة منفرداً يُستخدم في التداول العلمي والأكاديمي بعد التعريف الأول بالاسم الكامل،
        وهو الشكل المعتاد في الإحالات والتهميشات والمراجع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِينِيلِي"

    # ── مرشح المرحلة ١: آرثُر إِدْوِين كِينِيلِي ──
    - lemma: "آرثُر إِدْوِين كِينِيلِي"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل الصيغة الإنجليزية الكاملة "Arthur Edwin Kennelly" المدرجة في اللمّات الإنجليزية للمجموعة.
        ضرورة موسوعية لضمان التغطية الكاملة للأشكال الواردة في المصادر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم الثلاثي الكامل (الأول + الأوسط + الأخير) يُستخدم في السياقات الرسمية والموسوعية
        للتمييز القاطع، وهو الاسم الكامل كما وُلد وعُرف في الوثائق الرسمية.
      actions:
        - command: create_entry
          params:
            lemma: "آرثُر إِدْوِين كِينِيلِي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-11121240-n"

    # ── مرشح المرحلة ١: أ. إ. كِينِيلِي ──
    - lemma: "أ. إ. كِينِيلِي"
      source: stage1
      decision: removed
      decision_reason: >
        الصيَغ الاختصارية بالأحرف الأولى ليست لمّات معجمية بالمعنى الدقيق؛ هي رموز توثيقية
        ببليوغرافية لا تصلح مداخل قاموسية مستقلة. اجتازت اختبار التثبيت المعجمي ولم تجتز
        اختبار الصك (لا تُعامَل كوحدة لغوية مسكوكة في النصوص العربية).


