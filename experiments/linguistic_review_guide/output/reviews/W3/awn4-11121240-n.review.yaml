# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (آرثر كينيلي، كينيلي) تفتقران إلى التشكيل الكامل"
      - "التعريف العربي مقتضب: يغفل اكتشافه الأبرز وهو طبقة الغلاف الجوي العاكسة لموجات الراديو (طبقة كينيلي-هيفيسايد)"
      - "POS مُحدَّد بـ n، لكن المجموعة تمثّل اسم علم لشخصية بعينها (proper_noun)؛ يُستحسن توثيق ذلك"
      - "اللمّات الإنجليزية تشمل أربع صيَغ (Arthur E. Kennelly, Kennelly, A. E. Kennelly, Arthur Edwin Kennelly) في حين لا يقابلها في العربية سوى صيغتين"
    observations: >
      هذه المجموعة الترادفية تُعنى بشخصية علمية تاريخية بعينها هي المهندس الكهربائي الأمريكي آرثر
      إدوين كينيلي (1861-1939). جميع اللمّات المتوقعة ستكون بالضرورة تعريباتٍ صوتية للاسم الأجنبي،
      إذ لا يوجد في التراث العربي مقابل اشتقاقي أو مجازي لاسم علم أعجمي. والفرق الجوهري بين صيَغ
      اللمّات هو درجة التفصيل في ذكر الاسم (الاسم الكامل، الاسم الأوسط، الاسم الأخير وحده).
  blind_candidates:
    - lemma: "آرثُر كِينِيلِي"
      generation_method: taarib
      justification: >
        تعريب صوتي للاسم الإنجليزي "Arthur Kennelly"؛ وهو أشهر صيَغ الاسم في المصادر العربية
        المتعلقة بتاريخ الهندسة الكهربائية. الاسم مركّب من اسم أول وأخير وهو الشكل الرسمي المعتاد
        عند أول إشارة للعالِم.
    - lemma: "كِينِيلِي"
      generation_method: taarib
      justification: >
        الاسم الأخير وحده؛ وهو الاختصار الأكاديمي المألوف الذي يُستخدم في المراجع العلمية
        بعد أول ذكر للاسم الكامل. يُقابل الصيغة الإنجليزية "Kennelly".
    - lemma: "آرثُر إِدْوِين كِينِيلِي"
      generation_method: taarib
      justification: >
        التعريب الكامل للاسم الثلاثي "Arthur Edwin Kennelly"؛ يُستخدم في السياقات الرسمية
        والموسوعية للتمييز القاطع بين الأشخاص الذين يشتركون في الاسم الأخير.
    - lemma: "أ. إ. كِينِيلِي"
      generation_method: taarib
      justification: >
        الصيغة الاختصارية بالأحرف الأولى "A. E. Kennelly"؛ تُستخدم في التوثيق الببليوغرافي
        والمراجع الأكاديمية المختصرة.


