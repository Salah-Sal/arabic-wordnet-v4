# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (ساكاجاويا) مكتوبة بدون تشكيل كامل"
      - "المجموعة تخلو من الصيغة البديلة لتهجئة Sacajawea"
      - "هذه شخصية تاريخية أمريكية أصلية غريبة تماماً عن التراث المعجمي العربي — لا جذر ولا مقاييس"
    observations: >
      المجموعة الترادفية مخصصة لاسم عَلَم بعينه: ساكاجاويا (Sacagawea)،
      وهي دليلة بعثة لويس وكلارك الاستكشافية الأمريكية (1804–1806م) من قبيلة الشوشون.
      لا يمكن توليد لمّات اشتقاقية لهذا النوع من المجموعات الترادفية، إذ يستحيل اشتقاق
      اسم عَلَم على أوزان الصرف العربي أو إيجاد مقابل مجازي له.
      الطريقة الوحيدة المتاحة هي التعريب الصوتي (taarib) لاسمها الشوشوني، أو ترجمة
      لقبها الهيداتسي الشهير "Bird Woman" (المرأة الطير) إلى العربية.
      قاعدة البيانات المعجمية لا تحوي أي مدخل لها، مما يؤكد أنها ليست في المعجمية
      العربية الكلاسيكية ولا المعاصرة.

  blind_candidates:
    - lemma: "سَاكَاجَاوِيَا"
      generation_method: taarib
      justification: >
        تعريب صوتي مباشر للاسم الشوشوني Sacagawea — الصيغة الأكثر
        شيوعاً في المصادر العربية والموسوعات الرقمية (ويكيبيديا العربية).
        تقبل التعريف وال- والنسبة (الساكاجاوي) والجمع السالم.

    - lemma: "سَاكَاجَاوِيَّا"
      generation_method: taarib
      justification: >
        صيغة تعريب بديلة بتشديد الياء الأخيرة، تعكس النطق الإنجليزي
        لـ Sacajawea — الهجاء الثاني الشائع في المصادر الإنجليزية.
        وردت في بعض الترجمات العربية بهذه الصيغة.

    - lemma: "سَاكَاجَاوِيَه"
      generation_method: taarib
      justification: >
        صيغة تعريب بنهاية هاء/تاء مربوطة، قياساً على تعريب الأسماء
        الأجنبية المنتهية بـ /a/ كـ"ماريا → مَارِيَه". أقل شيوعاً
        لكن واردة في بعض السياقات الإعلامية العربية.

    - lemma: "المَرْأَةُ الطَّيْر"
      generation_method: tarkib
      justification: >
        ترجمة عربية للقب الهيداتسي/ماندان الشهير "Bird Woman" الذي
        عُرفت به ساكاجاويا في ثقافة القبائل الأمريكية الشمالية.
        مركب إضافي (المرأة + الطير) على نمط الأعلام الوصفية.


