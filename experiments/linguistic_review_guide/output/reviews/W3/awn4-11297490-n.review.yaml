# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "سَاكَاجَاوِيَا"
      decision: confirmed
      decision_reason: >
        اللمّة الوحيدة في المجموعة وهي الصيغة العربية الأكثر شيوعاً
        لهذا الاسم الشوشوني. تُعدّ التعريبات الصوتية للأعلام الأجنبية
        مقبولة متى استوفت شروط تقبّل التعريف وال- والنسبة والجمع.
        ساكاجاويا تقبل: الساكاجاوية، ساكاجاوياتان (جمع تثنية). التشكيل
        الكامل مضاف. الوزن الصرفي: اسم أجنبي مُعرَّب بخمسة مقاطع.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      loan_check:
        type: taarib
        verdict: "معرَّبة مقبولة — اسم عَلَم شوشوني مُستعار عبر الإنجليزية"
      morphological_fit: >
        اسم أجنبي مُعرَّب، لا ينطبق عليه معيار الوزن الصرفي العربي.
        يقبل الإعراب بالحركات (جاءت سَاكَاجَاوِيَا / رأيتُ سَاكَاجَاوِيَا).
      nuance_differentiation: "اللمّة الوحيدة في المجموعة — لا تمييز مع أخوات"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَاكَاجَاوِيَا"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "سَاكَاجَاوِيَّا"

    # ── مرشحات المرحلة ١ (مرفوضة) ──
    - lemma: "سَاكَاجَاوِيَّا"
      source: stage1
      decision: removed
      decision_reason: >
        هذه مجرد صيغة تهجئة بديلة (Sacajawea) للاسم ذاته لا لمّة
        مستقلة. تُدرج كصيغة بديلة عبر add_form في إجراءات اللمّة
        المؤكدة (سَاكَاجَاوِيَا) لا كلمّة جديدة.

    - lemma: "سَاكَاجَاوِيَه"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب بنهاية الهاء لأسماء الأعيان شاذ وغير مستعمل في
        المصادر العربية المعتمدة. الصيغة الصحيحة بالألف المقصورة
        أو الممدودة، لا بالهاء المتطرفة.

    - lemma: "المَرْأَةُ الطَّيْر"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ: يمكن إبدال "الطير" بـ"الطائر" أو "العصفور"
        ويبقى وصفاً — إذن ليس اسماً علماً مسكوكاً.
        فضلاً عن ذلك، يفشل اختبار التثبيت المعجمي: "المرأة الطير"
        لقب وصفي لا يُعدّ وحدة معجمية ثابتة في المصادر العربية.
        لا ينبغي إدراج لقب وصفي كلمّة مستقلة في المجموعة.


