# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أندريا بالاديو، بالاديو) تفتقران إلى التشكيل الكامل"
      - "عبارة 'كثير التقليد' ترجمةٌ حرفيةٌ لـ 'much imitated' وللتقليد في العربية دلالةٌ سلبيةٌ (محاكاة عمياء)؛ والمقصود إيجابيٌّ أي واسع التأثير"
      - "التعريف لا يُبيِّن مكانة بالاديو المحورية في تاريخ العمارة الغربية ولا يذكر الطراز الذي أسّسه"
    observations: >
      هذه المجموعة تمثّل علماً شخصياً أعجمياً (اسم عَلَم لشخص تاريخي أجنبي)؛
      أندريا بالاديو معماري إيطالي من عصر النهضة عُرِف بتأسيسه الطراز البالادي
      (Palladianism) المستوحى من العمارة الرومانية الكلاسيكية، وبكتابه «الكتب
      الأربعة في الهندسة المعمارية». لعلام شخصي أجنبي لا سبيل إلى التوليد
      المعجمي العربي (اشتقاق أو مجاز) لأن المفهوم شخصية بعينها؛ التعريب هو
      الأداة الوحيدة، وتتعدد صوره بين الاختصار والتصويت والإضافة اللاحقية.
  blind_candidates:
    - lemma: "بَالَادِيُو"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم الإيطالي Palladio بمقابلة أصواته بالحروف العربية
        المقابلة (ba-lam-alef-dal-ya-waw)؛ وهو الشكل الأقصر للاسم المتداول
        في السياقات المتخصصة والمعمارية.
    - lemma: "أَنْدِرِيَا بَالَادِيُو"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل Andrea Palladio؛ الاسم الأول أندريا (/ˈaːndrɛa/)
        يُنقل بأنْدِرِيَا، ويُضاف إليه اللقب بَالَادِيُو. هذا هو الشكل
        الرسمي الموسوعي المستخدم عند الذكر الأول.
    - lemma: "بَلَّادِيُو"
      generation_method: taarib
      justification: >
        تعريب بديل يُشدِّد اللام تقريباً من النطق الإيطالي الأصلي
        (Palladio /palˈlaːdjo/)؛ صيغة محتملة وإن كانت أقل شيوعاً في
        المصادر العربية.
    - lemma: "أَنْدِرِيَا بَالَادِيُوس"
      generation_method: taarib
      justification: >
        تعريب مُعرَّب بإلحاق السين في آخر اللقب على غرار الأعلام المنقولة
        من اللاتينية كإقليدس وأرسطو وبطليموس؛ يُتيح الصرف التنوين والإضافة
        ويجعل الاسم أكثر تمكيناً في النحو العربي.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المنفَّذة:
#  ١. مطابقة دفعية للمّات الموجودة والمرشحات (headword_norm IN ...)  → صفر نتائج
#  ٢. جسر إنجليزي (entries_translations_fts MATCH "Palladio" OR "Andrea Palladio"
#     OR "Palladian")  → صفر نتائج
#  ٣. FTS عربي (بالاديو / بلاديو / بالادي / الطراز البلادي)  → نتيجة وحيدة
#     هي "مُثَبِّتُ بالادي" (Palade's fixative) تخصّ جورج إميل بالاد
#     البيولوجي الخلوي — لا صلة بالمعماري.
#  ٤. ARABTERM (translation_en: "architect" / "Palladianism")  → نتائج عامة
#     (مهندس معماري/معمار) لا علاقة لها بشخص بالاديو تحديداً.
stage2_evidence:
  per_lemma:
    - lemma: "أندريا بالاديو"
      evidence_status: no_material_found
    - lemma: "بالاديو"
      evidence_status: no_material_found
    - lemma: "بَالَادِيُو"
      evidence_status: no_material_found
    - lemma: "أَنْدِرِيَا بَالَادِيُو"
      evidence_status: no_material_found
    - lemma: "بَلَّادِيُو"
      evidence_status: no_material_found
    - lemma: "أَنْدِرِيَا بَالَادِيُوس"
      evidence_status: no_material_found


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "أندريا بالاديو"
      decision: confirmed
      decision_reason: >
        الاسم الكامل هو الصيغة الأكثر دقةً وتوثيقاً؛ مستعمَل على نطاق واسع
        في الموسوعات والمصادر الأكاديمية العربية (ويكيبيديا العربية وغيرها)
        وهو المدخل الرئيسي للتعريف بالشخصية عند الذكر الأول. غياب المادة
        المعجمية يُعزى إلى كون الاسم علماً أعجمياً لا يرد في معاجم المفردات
        العربية، وليس قصوراً في اللمّة.
        تحتاج اللمّة إلى تصحيح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُستخدم الاسم الكامل في السياقات الرسمية والأكاديمية وعند الإشارة
        الأولى إلى الشخص في أي نص؛ وهو الصيغة المفضّلة في الفهارس
        الموسوعية والمراجع التاريخية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَنْدِرِيَا بَالَادِيُو"

    # ── لمّة موجودة ٢ ──
    - lemma: "بالاديو"
      decision: confirmed
      decision_reason: >
        اللقب المنفرد شائع الاستخدام في السياقات المعمارية والنقدية
        المتخصصة للإحالة إلى الشخص بعد تقديمه أول مرة؛ يُستخدم كذلك
        وحده في المصطلحات المشتقة (الطراز البالادي / المدرسة البالادية).
        تحتاج اللمّة إلى تصحيح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستخدم اللقب وحده في السياقات التخصصية المعمارية والنقدية وعند
        الإحالة المتكررة إلى الشخصية، وهو أساس الاشتقاق النسبي (البالادي/
        الطراز البالادي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَالَادِيُو"

    # ── مرشح المرحلة ١: أ ──
    - lemma: "بَالَادِيُو"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة «بالاديو» بعد إضافة التشكيل؛
        الإضافة المطلوبة تُعالَج بأمر update_lemma على اللمّة الأصلية
        لا بإنشاء مدخل جديد.

    # ── مرشح المرحلة ١: ب ──
    - lemma: "أَنْدِرِيَا بَالَادِيُو"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة «أندريا بالاديو» بعد إضافة التشكيل؛
        الإضافة تُعالَج بأمر update_lemma على اللمّة الأصلية.

    # ── مرشح المرحلة ١: ج ──
    - lemma: "بَلَّادِيُو"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة بتشديد اللام تنحرف عن الاستخدام العربي الراسخ؛ لا توجد
        أدلة على انتشارها في المصادر العربية الموثوقة، وتشديد اللام يُوقع
        الخلط مع «بلادي» (نسبة إلى البلاد). الصيغة الأصح والأشيع هي
        «بَالَادِيُو» بلام واحدة.

    # ── مرشح المرحلة ١: د ──
    - lemma: "أَنْدِرِيَا بَالَادِيُوس"
      source: stage1
      decision: removed
      decision_reason: >
        إلحاق السين لا أساس له في التعريب المعاصر لهذا الاسم؛ الأعلام
        الإيطالية لا تُعرَّب عادةً بإضافة لاحقة لاتينية. هذا التعريب
        مصطنع ولا يتوافق مع ما شاع في المصادر العربية الحديثة.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "معماري إيطالي مبدع للغاية وكثير التقليد (1508-1580)"
    assessment:
      decision: revise
      reason: >
        «كثير التقليد» ترجمة حرفية لـ "much imitated" لكنها ذات دلالة سلبية
        في العربية (تُوحي بالمحاكاة غير الإبداعية)؛ والمعنى المقصود إيجابي
        (أنَّ أسلوبه أثَّر في من جاء بعده). علاوة على ذلك التعريف مقتضب
        ولا يكشف عن مكانة بالاديو التاريخية ولا يذكر إسهامه الجوهري
        (الطراز البالادي وكتبه المعمارية). التعريف الموسوعي أنسب لعَلَم
        شخصي تاريخي.
    authored:
      - type: encyclopedic
        text: >
          مُعَمَارِيٌّ إِيطَالِيٌّ مِن عَصْرِ النَّهْضَة (1508-1580)، يُعَدُّ
          مِن أَبْرَزِ مُعَمَارِيِّي التَّارِيخِ الغَرْبِيِّ؛ وُلِدَ فِي
          بَادُوَا وَعَمِلَ فِي فِيتْشِنْزَا، وَأَسَّسَ الطِّرَازَ
          المَعْمَارِيَّ البَالَادِيَّ المُسْتَوحَى مِنَ العِمَارَةِ
          الرُّومَانِيَّةِ الكِلَاسِيكِيَّةِ، وَأَلَّفَ كِتَابَ
          «الكُتُبِ الأَرْبَعَةِ فِي الهَنْدَسَةِ المَعْمَارِيَّةِ»
          (I Quattro Libri dell'Architettura). كَانَ وَاسِعَ التَّأثِيرِ
          فِي الهَنْدَسَةِ المَعْمَارِيَّةِ الأُورُوبِّيَّةِ
          وَالأَمِيرِيكِيَّةِ فِي القُرُونِ اللَّاحِقَة.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11241485-n"
          definition_index: 0
          text: >
            مُعَمَارِيٌّ إِيطَالِيٌّ مِن عَصْرِ النَّهْضَة (1508-1580)، يُعَدُّ
            مِن أَبْرَزِ مُعَمَارِيِّي التَّارِيخِ الغَرْبِيِّ؛ وُلِدَ فِي
            بَادُوَا وَعَمِلَ فِي فِيتْشِنْزَا، وَأَسَّسَ الطِّرَازَ
            المَعْمَارِيَّ البَالَادِيَّ المُسْتَوحَى مِنَ العِمَارَةِ
            الرُّومَانِيَّةِ الكِلَاسِيكِيَّةِ، وَأَلَّفَ كِتَابَ
            «الكُتُبِ الأَرْبَعَةِ فِي الهَنْدَسَةِ المَعْمَارِيَّةِ»
            (I Quattro Libri dell'Architettura). كَانَ وَاسِعَ التَّأثِيرِ
            فِي الهَنْدَسَةِ المَعْمَارِيَّةِ الأُورُوبِّيَّةِ
            وَالأَمِيرِيكِيَّةِ فِي القُرُونِ اللَّاحِقَة.

  examples:
    per_lemma:
      - lemma: "أَنْدِرِيَا بَالَادِيُو"
        examples:
          - text: >
              تُعَدُّ فِيلَّا رُوتُونْدَا قُرْبَ فِيتْشِنْزَا مِن أَشْهَرِ
              أَعْمَالِ أَنْدِرِيَا بَالَادِيُو وَأَكْثَرِهَا تَأثِيراً
              فِي العِمَارَةِ الكِلَاسِيكِيَّةِ الغَرْبِيَّة.
            type: usage
      - lemma: "بَالَادِيُو"
        examples:
          - text: >
              أَحْدَثَ بَالَادِيُو ثَوْرَةً مَعْمَارِيَّةً بِتَوْلِيفِهِ
              أُصُولَ العِمَارَةِ الرُّومَانِيَّةِ مَعَ رُوحِ عَصْرِ
              النَّهْضَةِ، فَنَشَأَ عَن ذَلِكَ طِرَازٌ حَمَلَ اسْمَهُ
              وَعَبَرَ القَارَّاتِ.
