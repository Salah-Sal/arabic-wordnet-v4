            أَعْمَالِ أَنْدِرِيَا بَالَادِيُو وَأَكْثَرِهَا تَأثِيراً
            فِي العِمَارَةِ الكِلَاسِيكِيَّةِ الغَرْبِيَّة.
      - command: add_sense_example
