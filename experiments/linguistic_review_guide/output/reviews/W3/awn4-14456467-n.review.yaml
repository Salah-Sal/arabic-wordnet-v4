# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14456467-n
# kingship — كرامة أو رتبة أو منصب الملك
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «ملكية» بدون تشكيل، وقد تلتبس بين المَلَكِيَّة (نسبة إلى المَلِك) والمِلْكِيَّة (نسبة إلى المِلْك/التملك)"
      - "اللمّة «مُلك» بدون تشكيل كامل، وقد تلتبس بين المُلْك (السلطان) والمِلْك (ما يُملك) والمَلِك (صاحب المُلك)"
    observations: "المجموعة تدل على مفهوم «المنصب أو الرتبة أو الكرامة المرتبطة بمقام المَلِك»، وهو مفهوم عربي أصيل له جذور عميقة في التراث. التعريف الحالي واضح ومقبول لغوياً. اللمّتان الموجودتان كلتاهما من جذر م-ل-ك لكنهما تحتاجان إلى تشكيل دقيق لتمييزهما عن المعاني الأخرى المتعددة لهذا الجذر."
  blind_candidates:
    - lemma: "مَلَكِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من مَلِك على وزن فَعَلِيَّة، يدل على منصب الملك ومقامه، كقولنا: الأسقفية لمنصب الأسقف، والدوقية لمنصب الدوق"
    - lemma: "سُلْطَنَة"
      generation_method: ishtiqaq
      justification: "اشتقاق من سُلْطان، يدل على مقام السلطان وسلطته، قريب من مفهوم الملكية لكنه أخص بمقام السلطان"
    - lemma: "عَرْش"
      generation_method: majaz
      justification: "مجاز مرسل بعلاقة المحلية، العرش هو سرير الملك فأُطلق على المُلك والسلطان مجازاً، كقولهم: ثُلّ عرشه أي ذهب عزّه وملكه"
    - lemma: "تَاج"
      generation_method: majaz
      justification: "مجاز مرسل بعلاقة الآلية، التاج ما يُوضع على رؤوس الملوك فأُطلق على المنصب والمقام الملكي"

stage2_evidence:
  per_lemma:
    - lemma: "مَلَكِيَّة"
      confirm:
        - text: "«المَلَكِيَّةُ: المنسوبة إلى الملك. الحكومة المَلَكِيَّة: الحكومة التى يرأسها مَلكٌ يتولَّى المُلكَ بالوراثة غالباً»"
          source: "المعجم الوسيط"
        - text: "«(1) المَلَكيّة المُطْلَقة.» — absolute monarchy"
          source: "المورد الحديث (2008)"
        - text: "«(1) المَلَكيّة: منصب الملِك أو مقامه (2) شخصيّة الملك (3) حكومة مَلَكية.» — kingship"
          source: "المورد الحديث (2008)"
        - text: "«مَلَكِيَّة» — monarchy"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«المِلْكِيَّةُ: المِلْكُ أو التمليك. يقال: بيدى عَقْد مِلكيّة هذه الأرض»"
          source: "المعجم الوسيط"
          addition: "المِلْكِيَّة (بكسر الميم) معنى مختلف تماماً يدل على التملك والحيازة، لا على منصب الملك"
    - lemma: "مُلْك"
      confirm:
        - text: "«الملك: بالضم: التصرف بالأمر والنهي في الجمهور، وذلك يختص بسياسة الناطقين. والملك ضربان: ملك التولي والتملك وملك هو القوة على ذلك تولى أم لا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«والمُلْكُ: معروف وهو يذكر ويؤنث كالسُّلْطان؛ ومُلْكُ الله تعالى ومَلَكُوته: سلطانه وعظمته»"
          source: "لسان العرب لابن منظور"
        - text: "«(الْملك) مَا يملك ويتصرف فِيهِ (يذكر وَيُؤَنث) (ج) أَمْلَاك وَفِي التَّنْزِيل الْعَزِيز {وَللَّه ملك السَّمَاوَات وَالْأَرْض}»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«(مَلَكَ) الْمِيمُ وَاللَّامُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قُوَّةٍ فِي الشَّيْءِ وَصِحَّةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدل على القوة والصحة، ومنه تفرعت معاني التملك والسلطان"
    - lemma: "سُلْطَنَة"
      contradicts:
        - text: "«(السلطنة) مملكة السُّلْطَان (مو)»"
          source: "المعجم الوسيط"
          conflict: "السلطنة تدل على مملكة السلطان (الكيان السياسي/الجغرافي) لا على منصب الملك أو رتبته أو كرامته"
        - text: "«السَّلْطَنَة: التَّسَلُّطُ والسيطرةُ والتحكُّمُ. مملكة السُّلطان.»"
          source: "المعجم الوسيط (OCR)"
          conflict: "الدلالة على التسلط والسيطرة والمملكة، لا على الرتبة أو الكرامة"
    - lemma: "عَرْش"
      confirm:
        - text: "«العَرْشُ: سريرُ الملك. وقولهم ثل عرشه، أي وهى أمره وذهب عِزُّهُ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«العَرْشُ، قال الخليل: العَرْشُ: سَرِيرُ الْمَلِكِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«العَرْشُ: عَرْشُ اللهِ تعالى، ولا يُحَدُّ... وسَرِيرُ المَلِكِ، والعِزُّ، وقِوامُ الأمرِ... وـ من البيتِ: سَقْفُه»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "العرش دلالته الأساسية على السرير المادي أو عرش الله، لا على المنصب أو الرتبة ذاتها. هو رمز المُلك لا المُلك نفسه"
    - lemma: "تَاج"
      contradicts:
        - text: "«التَّاج: ما يوضع على رؤوس الملوك من الذهب والجواهر. الإكليل»"
          source: "المعجم الوسيط"
          conflict: "التاج اسم للحلية المادية التي يلبسها الملوك، لا لمنصب الملك أو رتبته أو كرامته"

stage3_analysis:
  per_lemma:
    - lemma: "مَلَكِيَّة"
      decision: confirmed
      decision_reason: "المَلَكِيَّة (بفتح الميم واللام) مصدر صناعي منسوب إلى المَلِك، ويدل على منصب الملك ومقامه ونظام حكمه. المورد الحديث يترجم kingship بـ«المَلَكِيَّة: منصب الملِك أو مقامه» وهو مطابق تماماً لتعريف المجموعة. كما أن بنية المصدر الصناعي (فَعَلِيَّة) منتجة في العربية لتسمية المناصب والرتب: الأسقفية، الدوقية، القيصرية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على المنصب بوصفه نظاماً ورتبة مؤسسية، وتُستخدم في السياق السياسي المعاصر للدلالة على نظام الحكم الملكي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَلَكِيَّة"

    - lemma: "مُلْك"
      decision: confirmed
      decision_reason: "المُلْك (بضم الميم وسكون اللام) يدل على التصرف بالأمر والنهي والسلطان، وهو معنى قريب من كرامة الملك ورتبته. ورد في التوقيف: «بالضم: التصرف بالأمر والنهي في الجمهور». وفي لسان العرب: «والمُلْكُ: معروف وهو يذكر ويؤنث كالسُّلْطان». فهو لفظ عربي أصيل راسخ في الاستعمال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على السلطان والتصرف بالأمر والنهي بصورة عامة، أوسع دلالة من مَلَكِيَّة إذ يشمل جوهر السلطة لا مجرد المنصب المؤسسي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُلْك"

    - lemma: "سُلْطَنَة"
      source: stage1
      decision: removed
      decision_reason: "السلطنة في المعاجم تدل على مملكة السلطان (الكيان الجغرافي-السياسي) أو على التسلط والسيطرة، ولا تدل على رتبة الملك أو كرامته. كما أنها مخصوصة بالسلطان لا بالملك."

    - lemma: "عَرْش"
      source: stage1
      decision: removed
      decision_reason: "العرش دلالته المعجمية على سرير الملك (الشيء المادي) أو على عرش الله تعالى، وإن استُعمل مجازاً بمعنى العز والسلطان فهو مجاز شائع لا مصطلح مستقل. يختلف مفهومياً عن «منصب الملك ورتبته» الذي هو موضوع المجموعة."

    - lemma: "تَاج"
      source: stage1
      decision: removed
      decision_reason: "التاج في المعاجم العربية اسم للحلية المادية التي يلبسها الملوك على رؤوسهم، وليس مصطلحاً يدل على منصب الملك أو رتبته. لا يصلح مرادفاً للمَلَكِيَّة أو المُلْك في هذا السياق."

    - lemma: "مَلَكِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مطابقة للمّة الموجودة «ملكية» بعد التشكيل. لا حاجة لإضافتها مرة ثانية."

