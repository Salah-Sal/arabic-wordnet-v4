# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-10156479-n
# ili        : i90253
# pos        : n
# definition : someone who plays the game of golf
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:

  # أ. التوليد الأعمى — قبل الاطلاع على اللمّات الموجودة
  # المدخل الوحيد: التعريف «شخص يلعب لعبة الجولف»
  blind_candidates:
    - lemma: "لاعِبُ الغُولف"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «لاعب» (اسم فاعل من لعب) و«الغولف» (تعريب الرياضة الأجنبية golf).
        يسير على نمط «لاعب الكرة / لاعب التنس» المستعمل في العربية لتسمية أصحاب
        الرياضات. الصيغة مع ال-التعريف على «الغولف» هي الأكثر استقراراً في الأسلوب
        الإخباري والمعجمي الحديث.

    - lemma: "مُمَارِسُ الغُولف"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُمَارِس» (اسم فاعل من مارَسَ) و«الغولف». يُجنّب
        دلالة «اللعب» الطفولية ويُبرز الاحترافية أو الممارسة المنتظمة، وهو ما
        يتوافق مع استعمال «ممارسات الجولف» الواردة في المعاجم التقنية للأزياء
        الرياضية.

    - lemma: "غُولفِيٌّ"
      generation_method: taarib
      justification: >
        نسبة مباشرة إلى «غولف» على وزن فُعْلِيّ المنتج في تعريب المصطلحات
        الرياضية. قياساً على «تنّاس: لاعب التنس» (الواردة في المورد الحديث) يُبنى
        «غُولفِيٌّ» على وزن نسبة الرياضة لصاحبها، لكنه تاريخياً أقل تثبيتاً.

    - lemma: "الغُولفَر"
      generation_method: taarib
      justification: >
        تعريب صوتي مباشر من الإنجليزية golfer بإضافة لام التعريف وقبول الكسرة.
        يُستعمل في بعض وسائل الإعلام العربية غير الرسمية، وهو ملاذ أخير عند
        إخفاق بدائل التركيب.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الموجودة «لاعب جولف» تكتب الرياضة بالجيم (جولف) بينما تعتمد المعاجم
        العربية المعيارية (ALECSO/ArabTerm والمورد الحديث) الغينَ (غولف)؛ مما يُنبئ
        بمصدر مصري أو شامي عامي للهجاء المستخدم."
      - "اللمّة خالية من التشكيل الكامل."
      - "التعريف الحالي «شخص يلعب لعبة الجولف» يستخدم «الجولف» بالجيم بدلاً من
        المعياري «الغولف»، ويفتقر إلى التمييز الفارق النوعي عن مجرد هاوٍ."
    observations: >
      المجموعة بسيطة المفهوم: لاعب رياضة الغولف. اللمّة الوحيدة «لاعب جولف» صحيحة
      دلالياً، لكنها تحتاج تصحيح الهجاء (جولف → غولف) وإضافة التشكيل. لا يوجد
      تنافس ترادفي داخل المجموعة لأنها أحادية اللمّة. الجذر «لعب» عربي أصيل ذو
      توثيق معجمي واسع، غير أن «غولف» عنصر مُعرَّب لا جذر له في المعاجم الكلاسيكية.
      وُجود «التنّاس: لاعب التنس» في المورد الحديث يثبت أن النموذج التركيبي لتسمية
      الرياضيين راسخ في العربية الحديثة.


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "لاعب جولف"
      expands:
        - text: "«لاعب غولف»"
          source: "مسرد الفن والتسلية والرياضة — المنظمة العربية للتربية والثقافة
                   والعلوم ALECSO/ArabTerm"
          addition: >
            يؤكد المفهوم بدقة (ترجمة إنجليزية: golfer) لكنه يستعمل الغين لا الجيم
            في هجاء الرياضة؛ مما يكشف أن الهجاء بالجيم في AWN4 ليس هو المعيار
            التقني العربي.
        - text: "«لاعبُ الغولف.»"
          source: "المورد الحديث (2008)"
          addition: >
            يرد في ترجمة مفردة golfer بصيغة المضاف إلى ال-التعريف، ويُظهر أن
            اللمّة مقبولة بشكليها (مع ال- وبدونها) في المعاجم.
        - text: "«لاعب الغولف.»"
          source: "المورد الحديث (2008)"
          addition: >
            يرد أيضاً بديلاً عن linksman (أحد مرادفات golfer في الإنجليزية)،
            مما يؤكد المصطلح العربي نفسه بمرجعين إنجليزيين مختلفين.
        - text: "«مِرْفَقُ لاعِبِي الغُولْف»"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            اللمّة «لاعبي الغولف» (جمع) في سياق مصطلح طبي يثبت استقرار
            الصيغة التركيبية للمفهوم في العربية المتخصصة.

    # ── مرشحات المرحلة ١ ──
    - lemma: "لاعِبُ الغُولف"
      confirm:
        - text: "«لاعبُ الغولف.»"
          source: "المورد الحديث (2008)"
        - text: "«لاعب الغولف.»"
          source: "المورد الحديث (2008)"

    - lemma: "مُمَارِسُ الغُولف"
      expands:
        - text: "«تنورة أنيقة قصية ذات ثنية أو أكثر تلبس من قِبَل ممارسات الجولف.»"
          source: "مسرد صناعة النسيج — ALECSO/ArabTerm"
          addition: >
            «ممارسات الجولف» (مؤنث جمع) ترادف المفهوم في سياق الملابس الرياضية،
            مما يُثبت استعمال اشتقاق «مُمَارِس» مضافاً إلى «الجولف» في العربية
            التقنية، وإن كانت الصيغة المذكرة «مُمَارِسُ الغُولف» غير موثقة مستقلةً.

    - lemma: "غُولفِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "الغُولفَر"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "لاعب جولف"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة دلالياً وتعكس المصطلح المعياري الموثق في المعاجم العربية
        الحديثة (ALECSO، المورد الحديث). القرار بالتأكيد مشروط بتصحيح هجاء
        «جولف» إلى «غولف» (الهجاء المعتمد في المعاجم العربية الرسمية) وإضافة
        التشكيل الكامل. الصيغة غير المعرَّفة (بدون ال-) موافقة لنمط ALECSO
        المرجعي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُغطي المفهوم في مداه الكامل دون تمييز بين
        هاوٍ ومحترف أو مبتدئ وخبير — وهو ما يتوافق مع دلالة golfer الإنجليزية
        المحايدة التي لا تحمل هذا التمييز بذاتها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبُ غُولف"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "لاعِبُ الغُولف"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لاعِبُ الغُولف"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة (مع ال-التعريف على «الغولف») هي بديل أسلوبي للمّة الموجودة
        «لاعب غولف» وليست لمّة مستقلة بمضمون دلالي مغاير. سيُضاف كصيغة بديلة
        (add_form) للمدخل الرئيسي بدلاً من إنشاء مدخل جديد تفادياً للتضخيم
        المعجمي غير المبرر.

    - lemma: "مُمَارِسُ الغُولف"
      source: stage1
      decision: removed
      decision_reason: >
        الدليل الوحيد المتاح هو «ممارسات الجولف» في سياق وصف ملابس الغولف
        النسائية — وليس توثيقاً صريحاً للمصطلح كاسم للاعب. فضلاً عن ذلك،
        «لاعب غولف» يؤدي الوظيفة ذاتها وهو الأكثر تداولاً وتوثيقاً. لا يوجد
        مسوّغ إضافي لإثقال المجموعة بلمّة غير راسخة.

    - lemma: "غُولفِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على تداول «غُولفِيٌّ» كاسم للاعب في أي مصدر موثوق.
        النسبة الصرفية على هذا الوزن ممكنة نظرياً لكنها غير مسكوكة. وجود
        «التنّاس: لاعب التنس» في المورد الحديث يُثبت أن النموذج الصرفي التقييسي
        المستعمل في الرياضات هو التركيب الإضافي لا النسبة.

    - lemma: "الغُولفَر"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب الكلمة الأجنبية golfer ملاذٌ أخير لا يُلجأ إليه ما دام التركيب
        الإضافي العربي «لاعب غولف» متاحاً وموثقاً. لا أدلة على استعمال «الغولفر»
        في أي مصدر معجمي رسمي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يلعب لعبة الجولف"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في بنيته (جنس + فصل)، لكنه يستعمل «الجولف» بالجيم
        بدلاً من «الغولف» المعياري، ويظل مبهماً إذ لا يُميّز ما يقوم به اللاعب
        (ضرب الكرة بالمضرب نحو الحفر). صياغة أوفى بأسلوب المعجم الوسيط مطلوبة.
    authored:
      - type: terminological
        text: >
          مَنْ يُمَارِسُ رِيَاضَةَ الغُولف، وَهِيَ لُعْبَةٌ تَقُومُ عَلَى
          ضَرْبِ كُرَةٍ صَغِيرَةٍ بِمِضْرَبٍ خَاصٍّ فِي مَلْعَبٍ مَكْشُوفٍ
          بُغْيَةَ إِيصَالِهَا إِلَى حُفَرٍ مُرَقَّمَةٍ بِأَقَلِّ عَدَدٍ
          مُمْكِنٍ مِنَ الضَّرَبَاتِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          اللَّاعِبُ فِي رِيَاضَةِ الغُولف؛ وَهُوَ مَنْ يَضْرِبُ كُرَةَ
