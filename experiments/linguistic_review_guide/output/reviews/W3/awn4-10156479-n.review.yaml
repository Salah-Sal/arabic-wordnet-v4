          الْمُسْتَهْدَفَةَ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10156479-n"
          definition_index: 0
          text: >
            مَنْ يُمَارِسُ رِيَاضَةَ الغُولف، وَهِيَ لُعْبَةٌ تَقُومُ عَلَى
            ضَرْبِ كُرَةٍ صَغِيرَةٍ بِمِضْرَبٍ خَاصٍّ فِي مَلْعَبٍ مَكْشُوفٍ
            بُغْيَةَ إِيصَالِهَا إِلَى حُفَرٍ مُرَقَّمَةٍ بِأَقَلِّ عَدَدٍ
