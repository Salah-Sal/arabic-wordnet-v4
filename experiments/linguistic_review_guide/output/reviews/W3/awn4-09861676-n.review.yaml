# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  # التقييم بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما مركّبتان إضافيتان (MWE) دون وجود مصطلح مفرد، في حين يتوفر في المعاجم العربية الكلاسيكية والحديثة مصطلح مفرد موثَّق هو السَّلَّال (صانع السلال بائعها) غائب عن المجموعة"
      - "التشكيل غائب عن كلتا اللمّتين مما يجعلهما ناقصتَي التوثيق الصرفي"
      - "الفرق الدلالي بين 'صانع السلال' و'نسّاج السلال' لم يُوثَّق، ويحتاج تمييزاً"
    observations: "المجموعة تدور على مفهوم حرفي صناعة السلال، وهو مفهوم عريق في الثقافة العربية لا سيما بالخوص وسعف النخيل. الجذران سلل ونسج يتكاملان في تغطية البُعدَين: الصناعة والنسج. يُلاحَظ غياب المصطلح المفرد سَلَّال الموثَّق في المعجم الوسيط والمعجم الكبير وهو أكثر اقتصاداً وتُراثيةً من المركّبَين. يُلاحَظ أيضاً إمكانية إثراء المجموعة بخَوَّاص الذي يُثبته أساس البلاغة صراحةً بوصفه 'من ينسج الخوص'."

  # المرشحات الأربعة — توليد أعمى من التعريف فقط (قبل الاطلاع على اللمّات)
  blind_candidates:
    - lemma: "سَلَّال"
      generation_method: ishtiqaq
      justification: "مشتق من جذر (س ل ل) على وزن فَعَّال الدال على الحِرَفِيين والمهنيين، أي من يصنع السِّلال ويتخصص فيها، بما يتطابق مع المفهوم المستهدف مباشرةً"

    - lemma: "خَوَّاص"
      generation_method: majaz
      justification: "إحياء للفظ عربي تراثي مُسكوك من جذر (خ و ص) على وزن فَعَّال، يدل على من يعمل بالخوص (ورق النخيل) نسجاً وضفراً وصناعةً للسلال، وهو المعنى الدقيق لصانع السلال في السياق الثقافي العربي القديم"

    - lemma: "نَسَّاجُ السِّلَال"
      generation_method: tarkib
      justification: "مركب إضافي من (نَسَّاج: وزن فعّال من نسج) و(السِّلال: جمع سلّة)، يُحدد الاختصاص بالنسج تحديداً ويُميّزه عن الصانع الأعم"

    - lemma: "خَصَّاف"
      generation_method: ishtiqaq
      justification: "مشتق من جذر (خ ص ف) على وزن فَعَّال؛ إذ يدل خصف على الحياكة والضفر في المعاجم القديمة، ومن دلالاته العمل بسعف النخيل وما شابهه في صناعة الأوعية"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "صانع السلال"
      evidence_status: "no_material_found"
      # المركّب الإضافي بكامله غير مُثبَّت في قواعد البيانات المعجمية؛
      # مكوّناه موثَّقان منفرديْن لكن لم يُعثر على الوحدة المركّبة كمدخل

    - lemma: "نسّاج السلال"
      evidence_status: "no_material_found"
      # المركّب الإضافي بكامله غير مُثبَّت؛ نَسَّاج منفرداً موثَّق بمعنى "حائك الثياب" (عام)

    - lemma: "سَلَّال"
      confirm:
        - text: "«صانعُ السَّلال بائعها»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الْأَسَلُّ صَانِعُ السِّلال بَائِعُ السِّلال شُهرَةُ غيرِ واحِدٍ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«(السلال) صانع السلال وبائعها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«سَلَّال: من (س ل ل) صانع السلال وبائعها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

    - lemma: "خَوَّاص"
      confirm:
        - text: "«بائع الخوص الذى يعمل الأشياء منه»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«مُعالِجُ الخوصِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«(الْخَواص) بَائِع الخوص وَالَّذِي يعْمل الْأَشْيَاء مِنْهُ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«وقيل: ناسِجُه ومَنْ يعْمَلِ الأشياءَ منه بائِعُه لقَبٌ لِغيرِ واحِدٍ من أعْلامِ الصّوفِيَّةِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "يُثبت أن الخوَّاص يشمل ناسج الخوص صراحةً، وهو ما يتقاطع مباشرةً مع نسج السلال من الخوص"
        - text: "«ورجل خواص: ينسج الخوص، وعمله الخياصة»"
          source: "أساس البلاغة للزمخشري"
          addition: "يُثبت الزمخشري صراحةً أن الخوَّاص هو من ينسج الخوص وأن حرفته تُسمى 'الخياصة'، وهي الأقرب دلالةً لنسج السلال"

    - lemma: "خَصَّاف"
      contradicts:
        - text: "«من يخصِفُ النِّعال الكذَّاب؛ كأنه يَخرُزُ القولَ على القولِ ويُنَمِّقُه»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "الخصَّاف في المعاجم هو من يرقّع النعال (الإسكافي) لا صانع السلال"
        - text: "«(الْخصاف) من يخصف النِّعَال والكذاب كَأَنَّهُ يخرز القَوْل على القَوْل وينمقه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "يؤكد أن الخصّاف لا يتعلق بنسج السلال بل بخرز النعال وترقيعها"
        - text: "«خَصَّاف: من (خ ص ف) من يخيط النعل، والكذاب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعنى الصرفي للجذر (خصف) في كتب الأسماء يؤكد خياطة النعل لا نسج السلال"

    - lemma: "نَسَّاجُ السِّلَال"
      expands:
        - text: "«نَسَّاج: من (ن س ج) حائك الثياب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "النسّاج في المعاجم وصفٌ عام للحائك؛ تقييده بـ'السلال' يُخصّصه، غير أن هذا المركّب يتطابق مع اللمّة الموجودة 'نسّاج السلال' ولا يُضيف لمّة مستقلة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
