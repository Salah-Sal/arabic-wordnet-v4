stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'توزيع الورق' صحيحة وشائعة، لكنها قد تفتقر للتحديد الكامل خارج سياق اللعب، ومن المفيد إضافة 'توزيع أوراق اللعب'."
    observations: "المفهوم يشير إلى فعل التوزيع الخاص بأوراق الكوتشينة (اللعب) على المشاركين في بداية الجولة أو خلالها. يُستخدم المصدر 'توزيع' مقترناً بـ'الورق' أو 'أوراق اللعب' كمركبات إضافية متداولة بكثرة."
  blind_candidates:
    - lemma: "تَوْزِيعَة"
      generation_method: ishtiqaq
      justification: "اسم مرة من الفعل وزّع، يمكن أن يدل على جولة واحدة من توزيع الأوراق."
    - lemma: "تَوْزِيعُ أَوْرَاقِ اللَّعِبِ"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يحدد المفهوم بدقة بالغة ويزيل أي لبس قد ينتج عن استخدام لفظ 'الورق' منفرداً."
    - lemma: "تَفْرِيقُ الوَرَقِ"
      generation_method: tarkib
      justification: "مركب إضافي يعتمد على 'التفريق' كمرادف 'للتوزيع' بين اللاعبين."
    - lemma: "قِسْمَةُ الأَوْرَاقِ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر عن عملية قسمة الأوراق كنصيب وحصة لكل لاعب."

stage2_evidence:
  per_lemma:
    - lemma: "توزيع الورق"
      confirm:
        - text: "«(12) «أ» توزيع ورق اللعب على اللاعبين. «ب» مجموعة الأوراق في يد اللاعب. «ج» دور اللاعب في توزيع ورق اللَّعِب»"
          source: "المورد الحديث (2008)"
    - lemma: "تَوْزِيعَة"
      evidence_status: "no_material_found"
    - lemma: "تَوْزِيعُ أَوْرَاقِ اللَّعِبِ"
      confirm:
        - text: "«(12) «أ» توزيع ورق اللعب على اللاعبين.»"
          source: "المورد الحديث (2008)"
    - lemma: "تَفْرِيقُ الوَرَقِ"
      evidence_status: "no_material_found"
    - lemma: "قِسْمَةُ الأَوْرَاقِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "توزيع الورق"
      decision: confirmed
      decision_reason: "مصطلح متداول وشائع جداً للتعبير عن فعل التوزيع في سياق ألعاب الورق، وهو مثبت معجمياً في المعاجم ثنائية اللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوْزِيعُ الوَرَقِ"

    - lemma: "تَوْزِيعُ أَوْرَاقِ اللَّعِبِ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب إضافي دقيق لا لبس فيه، وهو الأشمل خارج سياق اللعب المباشر لتحديد نوع الورق الموزع، وقد ورد بالنص في شروحات المعاجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "تَوْزِيعُ أَوْرَاقِ اللَّعِبِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَوْزِيعَة"
      source: stage1
      decision: removed
      decision_reason: "لم تثبت كاصطلاح مخصص لهذا المفهوم في المعاجم، على الرغم من صحتها الصرفية كاسم مرة للتعبير عن الجولة."

    - lemma: "تَفْرِيقُ الوَرَقِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي بديل غير متداول اصطلاحياً مقارنة بالتوزيع المعتمد في هذا السياق."

    - lemma: "قِسْمَةُ الأَوْرَاقِ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي لم يثبت استخدامه بشكل اصطلاحي متخصص لهذا المفهوم."

stage4_content:
  definition:
    current: "فعل توزيع أوراق اللعب"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويعبر بصراحة عن المفهوم المتمثل في عملية التوزيع ذاتها، ولا يتطلب أي تعديل جوهري."
  examples:
    per_lemma:
      - lemma: "توزيع الورق"
        examples:
          - text: "حين جاء دوره في تَوْزِيعِ الوَرَقِ، حرص على خلطها جيداً."
            type: usage
      - lemma: "تَوْزِيعُ أَوْرَاقِ اللَّعِبِ"
        examples:
          - text: "يُعَدُّ تَوْزِيعُ أَوْرَاقِ اللَّعِبِ خطوةً تمهيديةً ضروريةً قبل بدء الجولة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "حين جاء دوره في تَوْزِيعِ الوَرَقِ، حرص على خلطها جيداً."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعَدُّ تَوْزِيعُ أَوْرَاقِ اللَّعِبِ خطوةً تمهيديةً ضروريةً قبل بدء الجولة."

