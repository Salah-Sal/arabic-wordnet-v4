        «عبرت» يُقيّد التعريف بالتاريخية دون الإشارة إلى أن المذهب الرمزي ما زال
        وصفاً نقدياً مستخدَماً. يفتقر كذلك إلى ذكر السمة الجوهرية: الإيحاء
        والتداعي مقابل التصوير المباشر.
