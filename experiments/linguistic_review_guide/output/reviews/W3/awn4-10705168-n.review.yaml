# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'رمزي' بدون تشكيل وتُستخدم كاسم مع أنها صفة في أصل اشتقاقها — يلزم تشكيلها وتوثيق استخدامها كاسم"
      - "اللمّة 'فنان رمزي' بدون تشكيل — يلزم تشكيلها"
      - "اللمّة 'رمزي' وحدها دون سياق قد تلتبس بالاسم العلَم (رمزي بك) أو بالصفة المجردة — يفضّل التمييز بالتعريف الدقيق"
    observations: >
      المجموعة تُمثّل مفهوم «الرمزي» بوصفه منتمياً إلى المذهب الرمزي في الفنون والأدب
      (Symbolist)، وهو تيارٌ أوروبي نشأ في أواخر القرن التاسع عشر.
      اللمّتان الموجودتان — رمزي وفنان رمزي — تعكسان المصطلح المستقرّ في المعجمية
      العربية الحديثة؛ غير أن غياب التشكيل يُخلّ بالضبط الصرفي المطلوب في AWN4.
      الجذر رمز غني دلالياً في التراث العربي ويستوعب هذا الاستخدام العصري.

  blind_candidates:
    - lemma: "رَمَّازٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر رمز على وزن فَعَّال المفيد للمبالغة في الفعل وكثرته؛ يُشير إلى
        مَن يُكثر التعبير بالرموز والإيحاءات، وهو وصفٌ يلائم المذهب الرمزي قياساً
        على نحّات (نحت)، ورسّام (رسم).
    - lemma: "رَامِزٌ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل رَمَزَ على الوزن الصرفي فاعل، يدلّ على مَن يُمارس فعل
        الرمز ويعتمده، قياساً على ناثر (نثر) وشاعر (شعر).
    - lemma: "رَمْزَوِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة موسّعة من رمز بلاحقة -وي الدالة على الانتماء إلى مذهب أو تيار
        (كالشيعوي، والصوفوي في بعض الاستخدامات)، تعبّر عن المنتسب إلى المذهب
        الرمزي تمييزاً له عن الصفة المطلقة رمزي.
    - lemma: "فَنَّانٌ رَمْزِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي (إضافة موصوف إلى صفته) يُحدّد جنس المنتمي للمذهب الرمزي
        بكونه فناناً، ويُميّزه بالنعت «رمزي» دالاً على انتمائه للتيار الرمزي،
        مطابقاً لأسلوب الترشيح في المعاجم الفنية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة: ٥ استعلامات
#   ١. مطابقة دقيقة دفعية — جميع اللمّات (الموجودة + المرشحات)
#   ٢. جسر إنجليزي — symbolist / symbolism / symbolic
#   ٣. بحث FTS عربي — رمزي / رمزية / مذهب رمزي
#   ٤. مقاييس اللغة — جذر رمز (dictionary_id=151)
#   ٥. مقاييس اللغة — جذر فن/فنن (dictionary_id=151)
stage2_evidence:
  per_lemma:

    - lemma: "رمزي"
      confirm:
        - text: >
            «(1) «أ», الرَّمزيّ: «ب» مستخدِم الرُّموز أو الرّمزية.
            «ج» البارع في تفسير الرُّموز. «د» الشّاعر أو الفنّان الرمزيّ
            (2) رمزيّ.»
          source: "المورد الحديث (2008) — ترجمة: symbolist"
      expands:
        - text: >
            «نسبة إلى المدرسة الرمزية للتعبير عما يحلُّ محل آخر في الدلالة عليه
            لا بطريق المطابقة وإنما بالإيحاء أو بوجود علاقة متعارف عليها. إذ تحل
            الرمزية بدل الملموس عبر تداعي المعاني.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُوضّح أن الرمزية قائمة على الإيحاء وتداعي المعاني لا التصوير المباشر، مما يُثري تعريف المنتمي إليها"
        - text: >
            «(في الفلسفة) نِسبةً إلى الرمز, ومنه الكتابة الرمزيَّة, والتصوير الرمزي.»
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
          addition: "يُرسّخ الاستخدام في مجال الفنون (التصوير الرمزي) مما يدعم دلالة المنتمي للمذهب الفني الرمزي"

    - lemma: "فنان رمزي"
      confirm:
        - text: >
            «(1) «أ», الرَّمزيّ: «ب» مستخدِم الرُّموز أو الرّمزية.
            «ج» البارع في تفسير الرُّموز. «د» الشّاعر أو الفنّان الرمزيّ
            (2) رمزيّ.»
          source: "المورد الحديث (2008) — ترجمة: symbolist"
      expands:
        - text: >
            «رمزية(ال...) (اتجاه فني)» → ترجمة: symbolism
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يُثبت أن «الرمزية» مقيَّدة صراحةً بكونها «اتجاهاً فنياً» مما يدعم التعبير المركب فنان رمزي"

    - lemma: "رَمَّازٌ"
      contradicts:
        - text: "«الإيماء والإشارة»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة) — entry_id: 11491"
          conflict: >
            الرَّمَّاز في المعجم الوسيط يدلّ على فعل الإيماء والإشارة لا على شخص
            منتمٍ إلى تيار فني؛ وهو مصدر/صفة لا اسم شخص بالمعنى المطلوب.
      expands:
        - text: >
            «الرَّاءُ وَالْمِيمُ والزَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حَرَكَةٍ وَاضْطِرَابٍ.
            يُقَالُ كَتِيبَةٌ رَمَّازَةٌ: تَمُوجُ مِنْ نَوَاحِيهَا.»
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر في أصله يدلّ على الحركة والاضطراب؛ الدلالة على الرمز/الإشارة تطوّر لاحق — مما يُضعف استخدام رَمَّاز للإنسان المنتمي للمذهب الرمزي الفني"

    - lemma: "رَامِزٌ"
      contradicts:
        - text: >
            «رَامِز: المشير بالشفة أو العين أو نحو ذلك، وكثير الحركة، والوقور الرزين.»
          source: "موسوعة السلطان قابوس لأسماء العرب — entry_id: 925535"
          conflict: >
            رامز يدلّ على مَن يُشير بالجوارح (شفة، عين)، وهو من الأسماء لا من
            المصطلحات المذهبية الفنية؛ لا يحمل دلالة الانتماء إلى التيار الرمزي.

    - lemma: "رَمْزَوِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "فَنَّانٌ رَمْزِيٌّ"
      confirm:
        - text: >
            «(1) «أ», الرَّمزيّ: «ب» مستخدِم الرُّموز أو الرّمزية.
            «ج» البارع في تفسير الرُّموز. «د» الشّاعر أو الفنّان الرمزيّ
            (2) رمزيّ.»
          source: "المورد الحديث (2008) — ترجمة: symbolist"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "رمزي"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في المورد الحديث بترجمة مباشرة لـ symbolist بمعنى «مستخدِم
        الرُّموز أو الرّمزية / الشاعر أو الفنّان الرمزيّ». استخدامها اسماً
        (الرمزيّ / الرمزيون) راسخٌ في العربية المعاصرة باعتبارها تحويلاً نعتياً
        اصطلاحياً شائعاً (كالوجودي، والرومانسي). تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check: >
        وزن فَعْلِيّ (نسبة)، جذر رمز، مشتقّ اصطلاحي صحيح. الوزن يُلائم الدلالة
        الانتمائية (نسبة إلى مذهب) — كالرومانسي والواقعي والتكعيبي.
      nuance_differentiation: >
        يُستخدم للدلالة الواسعة على كل منتمٍ للمذهب الرمزي أياً كان ضرب إبداعه
        (شعر، نثر، موسيقى، فن بصري)؛ يُصاغ للجمع: الرمزيون، وللتأنيث: الرمزية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَمْزِيٌّ"

    - lemma: "فنان رمزي"
      decision: confirmed
      decision_reason: >
        التعبير المركب مُصادَق عليه في المورد الحديث صراحةً («الفنّان الرمزيّ»)،
        ويُقيّد دلالة رمزي في الفنون البصرية والتشكيلية تحديداً. تعبيرٌ اصطلاحي
        ثابت يجتاز اختبار السكّ (لا يُبدَّل أحد مكوّنيه بمرادفه دون تغيير الدلالة
        الاصطلاحية). يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      morphological_check: >
        مركّب وصفي (موصوف + نعت): فَنَّان (فعّال من فنّ/فنن) + رَمْزِيّ (نسبة).
        الصياغة سليمة صرفياً.
      nuance_differentiation: >
        يُخصَّص للفنان البصري/التشكيلي (رسّام، نحّات، مصوِّر) المنتمي للمذهب
        الرمزي، مقابل رَمْزِيٌّ التي تشمل الشعراء والأدباء أيضاً. يُقيّد الجنس
        الإبداعي بينما رَمْزِيٌّ مُطلَق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَنَّانٌ رَمْزِيٌّ"

    - lemma: "رَمَّازٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الرَّمَّاز في المعجم الوسيط يدلّ على «الإيماء والإشارة» وهو مصدر/صفة لا
        اسم عَلَم على عضو مذهب فني. الجذر في مقاييس اللغة يُشير إلى الحركة
        والاضطراب لا إلى الانتماء لتيار إبداعي. لا دليل على استخدام رَمَّاز
        بالمعنى المطلوب.
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَامِزٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رامز في موسوعة السلطان قابوس يُفيد «المشير بالشفة أو العين» وهو اسم
        الفاعل من رمز بمعناه القديم (الإشارة بالجوارح)، لا المنتمي للمذهب الرمزي
        الفني. فضلاً عن استخدامه الشائع كاسم علَم شخصي مما يُوقع في الاشتراك
        اللفظي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَمْزَوِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        غير مثبت في أي من معاجم قاعدة البيانات. الصيغة على غير قياس واسع الاطّراد
        وغير مألوفة في الاستخدام المتخصص. لا دليل معجمي يُسنّد قبولها.
      evidence_assessment:
        case: no_material

    - lemma: "فَنَّانٌ رَمْزِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق تماماً للمّة الموجودة «فنان رمزي»؛ لا يُضيف مدخلاً
        جديداً بل يُؤكّد صحة اللمّة الحالية وصواب مسارها.
      evidence_assessment:
        case: confirm_only


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
