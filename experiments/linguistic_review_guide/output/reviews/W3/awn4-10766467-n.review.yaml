# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. التوليد العمياء — قُرئ الملف المُقنَّع أولاً قبل الاطلاع على اللمّات
  blind_candidates:
    - lemma: "مُتَفَنِّنٌ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل "تَفَنَّنَ" على وزن مُتَفَعِّل من جذر ف-ن-ن، ويدل على
        من يمارس فنوناً متعددة ومتنوعة. الجمهور العربي يفهمه مباشرة لأن الجذر
        "فَنَّ" يدل عند ابن فارس على "أجناس الشيء وطرقه". يناسب مؤدِّي الفودفيل
        لأنهم يجمعون بين فنون الغناء والرقص والكوميديا.

    - lemma: "فَنَّانُ الْمَلَاهِي"
      generation_method: tarkib
      justification: >
        تركيب إضافي من "فَنَّان" (صاحب الموهبة الأدائية) و"الْمَلَاهِي" (جمع مَلهى،
        وهي دور الترفيه والعروض الاستعراضية). الملهاة/الملاهي تُستخدم في العربية
        للدلالة على دور التسلية التي تقدم عروضاً متنوعة، وتقترب من المفهوم الغربي
        للفودفيل.

    - lemma: "هَزَّالٌ"
      generation_method: ishtiqaq
      justification: >
        صيغة فَعَّال من جذر هـ-ز-ل، وهو من يمارس الهزل والكوميديا. مؤدِّي الفودفيل
        يُقدِّمون كثيراً من الفنون الهزلية الخفيفة. هزل في اللغة: نقيض الجد، وكذلك
        يُقال لمن يكثر المزاح والإضحاك.

    - lemma: "فُودِفِيلِيٌّ"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الإنجليزي "vaudevillian" بإضافة ياء النسبة إلى الاسم
        المُعرَّب "فودفيل"، ليعمل اسماً ونعتاً. اللجوء إلى التعريب هنا مبرَّر لأن
        مصطلح "الفودفيل" ذاته مُعرَّب ومتداول في المعاجم الحديثة، ونسبته الطبيعية
        بياء النسبة تُنتج وحدة معجمية قياسية تقبل لام التعريف والجمع.

  # ب. التقييم الأولي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة 'فنان فودفيل' خالية من التشكيل الكامل"
      - "المجموعة تحتوي لمّةً واحدة فقط وهو عدد شحيح لمفهوم مُقابَل في العربية بأكثر من صيغة"
      - "مصطلح 'فودفيل' عنصر مُعرَّب داخل المركّب؛ لا تحقق بعد من وجود بديل عربي أنقى"
      - "التعريف الحالي يُعيد ذكر 'الفودفيل' في الشاهد والمُشار إليه (دوران جزئي)"
    observations: >
      المجموعة تصف مؤدِّياً يشتغل في نوع محدد من العروض الترفيهية (الفودفيل) الذي
      ازدهر في أمريكا الشمالية أواخر القرن التاسع عشر وأوائل العشرين، وكان يجمع
      الغناء والرقص والكوميديا والبهلوانيات في عروض متنوعة. الجذر الدلالي للمجموعة
      الأم (awn4-10435383-n: فنان استعراضي / مؤدٍّ) يُرسي الصلة بالأداء الاستعراضي
      أمام الجمهور. اللمّة "فنان فودفيل" مقبولة معجمياً كتركيب إضافي لكنها تفتقر
      إلى التشكيل وإلى مصاحبها الإفرادي (النسبة فُودِفِيلِيّ) الموثّقة في المعاجم
      الحديثة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# ميزانية الاستعلامات المُستخدمة:
#   ق١: مطابقة دفعية (كل اللمّات + المرشحات) → 0 نتائج للمركبات كوحدة
#   ق٢: جسر إنجليزي (vaudevillian / vaudeville / variety performer)
#   ق٣: FTS عربي (فودفيل / ملاهي / هزال / متفنن / مسرح / بهلوان)
#   ق٤: مقاييس اللغة (فنن / هزل / لهو / طرب / سمر)
#   ق٥: التحقق الدفعي من المرشحات (متفنن / فودفيلي / فنان الملاهي)
# الإجمالي: 5 استعلامات
stage2_evidence:
  per_lemma:

    - lemma: "فنان فودفيل"
      expands:
        - text: >
            «صاحب الموهبة الفنية، كالشاعر والكاتب والموسيقى والمصور والممثل؛
            وهو مبالغة من فَنَّ الحمارُ الوحشيُّ لتفنُّنه في العَدْوِ»
          source: "المعجم الوسيط"
          addition: >
            يُؤكد أن "فنان" يشمل المؤدين والممثلين، مما يدعم الشق الأول من
            المركب. ابن فارس يؤصّل "الفن" بمعنى الأنواع والضروب المتعددة
            وهو ما يعكس طبيعة الفودفيل المتنوعة.
        - text: >
            «(1) الفودفيل؛ الملهاة: مسرحية هزلية خفيفة تشتمل على غناء ورقص
            وتمثيل إيمائي (2) حفلة المنوَّعات.»
          source: "المورد الحديث (2008)"
          addition: >
            يُقدِّم المعجم مقابلَيْن عربيَّيْن للفودفيل: "الملهاة" و"حفلة
            المنوعات"، ومنهما يمكن اشتقاق تعبير "فنان الملاهي/المنوعات".
      # لم يُعثر على المركب "فنان فودفيل" كمدخل موحّد في أي قاموس.

    - lemma: "مُتَفَنِّنٌ"
      evidence_status: "no_material_found"
      # لم يُعثر على "متفنن" كمدخل مستقل. ورد "مُتَفَنَّن فيه" (اسم مفعول)
      # في المورد الحديث ضمن تعريف "refinement" لا بوصفه مصطلحاً لمؤدٍّ.

    - lemma: "فَنَّانُ الْمَلَاهِي"
      expands:
        - text: >
            «(1) الفودفيل؛ الملهاة: مسرحية هزلية خفيفة تشتمل على غناء ورقص
            وتمثيل إيمائي (2) حفلة المنوَّعات.»
          source: "المورد الحديث (2008)"
          addition: >
            "الملهاة" مُستخدَمة مرادفاً للفودفيل، مما يمنح تعبير "فنان الملاهي"
            سنداً دلالياً غير مباشر. غير أن "الملاهي" أعمّ من الفودفيل تحديداً.

    - lemma: "هَزَّالٌ"
      contradicts:
        - text: >
            «هَزَّال: من (ه ز ل) الضعيف، والكثير المزاح في كلامه.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            "هزّال" في المعاجم اسم علم وصفة تعني "الضعيف أو كثير المزاح"،
            وليست مصطلحاً لصنف من الفنانين المسرحيين. كما أن الجذر هزل
            يتفرع إلى معنيَيْن: (1) الهُزَال = النحافة والضعف الجسدي، (2)
            الهَزْل = نقيض الجد. كلاهما لا يدل على المؤدِّي في الفودفيل.
        - text: >
            «(هَزَلَ) الهاء والزاء واللام كلمتان في قياس واحد، يدلان على ضعف.
            فالهزل: نقيض الجد. والهُزَال: خلاف السِّمَن.»
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            ابن فارس يردّ الجذر إلى الضعف أولاً، ومخالفة الجد ثانياً. لا رابط
            بينه وبين الأداء المسرحي المتخصص في الفودفيل.

    - lemma: "فُودِفِيلِيٌّ"
      confirm:
        - text: >
            «(1) كاتب الفودفيل (2) ممثِّلٌ أو مغنٍّ أو راقصٌ في فودفيل
            (3) فودفيليّ.»
          source: "المورد الحديث (2008)"
      expands:
        - text: >
            «مسرحية هزلية خفيفة أغنية مرحة وساخرة تطورت لتدل على مناظر
            تمثيلية، وجنس أدبي يتميز بالمغامرة والخيانة. [translation_en: vaudeville]»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: >
            يُثبت أن مصطلح "فودفيل" متداول في المعاجم العلمية المُوحَّدة، مما
            يُسوِّغ النسبة منه بياء النسبة لاشتقاق "فودفيليّ".


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "فنان فودفيل"
      decision: confirmed
      decision_reason: >
        تركيب إضافي واضح الدلالة يجمع "فنان" (مؤدٍّ ذو موهبة) و"فودفيل"
        (المصطلح الأدائي المُعرَّب الشائع). لا يوجد بديل عربي خالص مُسكَّك
        تماماً لهذا المفهوم في معاجم المجامع. المركب مقبول كوحدة اصطلاحية
        في الكتابة الأدبية والنقدية العربية المعاصرة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يبرز هوية الفنان وتخصصه ("فنان") مقترناً باسم الفن الذي يمارسه
        ("فودفيل")، فهو الصيغة الاسمية الوصفية الصريحة. يُستعمل في السياقات
        النقدية والتاريخية حين يُراد التعريف بصاحب المهنة والتصريح بفنه.
      loan_check:
        lexical_borrowing: معرَّب (مقبول — "فودفيل" استُعمل في المعاجم الحديثة)
        calque_check: مقبول — الهيكل الإضافي عربي قياسي
      morphological_fit: >
        الوزن الصرفي لـ"فنان" (فَعَّال) دالٌّ على الاحتراف والامتهان، وهو
        مناسب تماماً للدلالة على صاحب مهنة فنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَنَّانُ فُودِفِيل"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُتَفَنِّنٌ"
      source: stage1
      decision: removed
      decision_reason: >
        "مُتَفَنِّن" صفة مشبّهة (اسم فاعل من تفعَّل) تعني "من يتنوع في فنونه"،
        وهي صفة عامة جداً لا تُحيل على الفودفيل تحديداً. اختبار الاستبدال:
        يمكن إبدال "متنوع الفنون" بها وتبقى صالحة — دليل على أنها ليست
        مصطلحاً مُسكَّكاً. لا أدلة معجمية تربطها بمؤدِّي الفودفيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "فَنَّانُ الْمَلَاهِي"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب إضافي له سند دلالي جزئي (الملهاة = مرادف للفودفيل في المورد
        الحديث)، غير أن "الملاهي" أعمّ من الفودفيل ويشمل كل دور الترفيه.
        اختبار السكّ: يمكن أن يُطلق على كل فنان استعراضي في أي دار ترفيه،
        مما يُفيد ترادفه مع اللمّة الأم (awn4-10435383-n). بالتالي يُنقص
        الفارق الدلالي الذي يُميز هذه المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "هَزَّالٌ"
      source: stage1
      decision: removed
      decision_reason: >
        "هَزَّال" (فَعَّال من هزل) يدل في المعاجم على "الضعيف أو كثير المزاح
        في كلامه" وهو في المقام الأول اسم علم لا مصطلح أدائي. الأدلة
        المعجمية تناقض استخدامه للدلالة على مؤدِّي الفودفيل: ابن فارس يُرجع
        الجذر إلى الضعف، والمعاجم الطبية تستعمله للنحافة الجسدية. لا علاقة
        بين هذه الحقول الدلالية والأداء المسرحي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "فُودِفِيلِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        صيغة النسبة من "فودفيل" (فُودِفِيلِيّ)، موثَّقة في المورد الحديث
        (2008) بوصفها أحد المقابلات المباشرة للـ"vaudevillian". الصيغة قياسية
        صرفياً وتقبل لام التعريف (الفودفيليّ) والجمع (الفودفيليون) والتأنيث
        (فودفيلية). تنافس "فنان فودفيل" في الاختصار وتُكمله اشتقاقياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        ياء النسبة تُفيد الانتساب والاختصاص المطلق؛ يُستعمل وصفاً ثم اسماً:
        "مؤدٍّ فودفيليّ" (نعت) أو "فودفيليّ بارع" (اسم مستقل). أكثر اقتصاداً
        من المركب الإضافي، ومناسب للاستعمال السريع في النقد والصحافة الثقافية.
      loan_check:
        lexical_borrowing: معرَّب (مقبول — قياسي على معاجم حديثة)
        calque_check: مقبول — يتطابق مع المدلول الأجنبي
      morphological_fit: >
        ياء النسبة (مِفعال للنسبة عملياً) مصدر إضافة خصب في اصطلاح المصطلح
        العربي الحديث، وتحويل الأعلام الأجنبية إليها شائع ومقنَّن.
      actions:
        - command: create_entry
          params:
            lemma: "فُودِفِيلِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10766467-n"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "فنان يؤدي عروضاً في مسرح الفودفيل"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يعاني من دوران جزئي (يُعرِّف الفودفيليَّ بالفودفيل دون
        أن يُوضِّح ما الفودفيل)، وهو ترجمة حرفية للتعريف الإنجليزي دون إضافة.
        ينبغي تحديد الجنس الأقرب (مؤدٍّ/فنان استعراضي) والفصل النوعي (طبيعة
        الفودفيل: عروض منوَّعة من غناء ورقص وكوميديا).
    authored:
      - type: terminological
        text: >
          مُؤَدٍّ يَشْتَغِلُ فِي عُرُوضِ الْفُودِفِيل الِاسْتِعْرَاضِيَّةِ،
          وَهِيَ حَفَلَاتُ الْمُنَوِّعَاتِ الَّتِي تَجْمَعُ بَيْنَ الْغِنَاءِ
          وَالرَّقْصِ وَالتَّمْثِيلِ الْهَزْلِيِّ وَالْبَهْلَوَانِيَّاتِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          الْفُودِفِيل نَوْعٌ مِنَ الْعُرُوضِ الِاسْتِعْرَاضِيَّةِ ازْدَهَرَ
          فِي أَمْرِيكَا الشَّمَالِيَّةِ بَيْنَ ثَمَانِينِيَّاتِ الْقَرْنِ
          التَّاسِعَ عَشَرَ وَثَلَاثِينِيَّاتِ الْعِشْرِينَ، وَيَقُومُ عَلَى
          تَتَابُعِ فِقَرَاتٍ قَصِيرَةٍ مُتَنَوِّعَةٍ يُؤَدِّيهَا فَنَّانُونَ
          مُخْتَلِفُونَ مِنْ مُغَنِّينَ وَرَاقِصِينَ وَكُومِيدِيِّينَ
          وَبَهَالِيلَ وَسَاحِرِينَ. وَالْفُودِفِيلِيُّ مَنِ احْتَرَفَ الأَدَاءَ
          فِي هَذِهِ الْعُرُوضِ.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10766467-n"
          definition_index: 0
          text: >
            مُؤَدٍّ يَشْتَغِلُ فِي عُرُوضِ الْفُودِفِيل الِاسْتِعْرَاضِيَّةِ،
            وَهِيَ حَفَلَاتُ الْمُنَوِّعَاتِ الَّتِي تَجْمَعُ بَيْنَ الْغِنَاءِ
            وَالرَّقْصِ وَالتَّمْثِيلِ الْهَزْلِيِّ وَالْبَهْلَوَانِيَّاتِ.
      - command: add_definition
        params:
          synset_id: "awn4-10766467-n"
          text: >
            الْفُودِفِيل نَوْعٌ مِنَ الْعُرُوضِ الِاسْتِعْرَاضِيَّةِ ازْدَهَرَ
            فِي أَمْرِيكَا الشَّمَالِيَّةِ بَيْنَ ثَمَانِينِيَّاتِ الْقَرْنِ
            التَّاسِعَ عَشَرَ وَثَلَاثِينِيَّاتِ الْعِشْرِينَ، وَيَقُومُ عَلَى
