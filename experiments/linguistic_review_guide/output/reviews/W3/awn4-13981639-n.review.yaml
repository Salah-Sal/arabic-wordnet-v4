# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13981639-n (ubiety)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تحيز» بدون تشكيل، وتلتبس مع المعنى المعاصر الشائع (التحيُّز = bias/prejudice)"
      - "لمّة «تموضع» بدون تشكيل"
      - "التعريف العربي يستخدم كلمة «التموضع» وهي إحدى اللمّات — دوران معجمي"
    observations: >
      المفهوم فلسفي-وجودي يتعلق بحالة الكينونة في حيّز مكاني محدد. المرادف الإنجليزي ubiety مصطلح
      فلسفي نادر الاستعمال. في التراث العربي الكلامي والفلسفي، استُعمل مصطلح «التحيُّز» عند المتكلمين
      بمعنى الحصول في الحيّز، لكنّ هذا المعنى انزاح في الاستعمال المعاصر نحو دلالة «الانحياز والتغرّض».
      المجموعة تحتاج إلى تحسين التشكيل وإضافة مرادف أدقّ.
  blind_candidates:
    - lemma: "تَحَيُّز"
      generation_method: ishtiqaq
      justification: "من جذر ح-ي-ز على وزن تَفَعُّل، مصدر تَحَيَّزَ بمعنى شَغَلَ الحَيِّز واستقرّ فيه، مصطلح كلامي فلسفي عند التهانوي وغيره"
    - lemma: "مَوْقِعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «موقع»، يدلّ على حالة الكون في موقع معيّن، على وزن فَوْعِلِيَّة"
    - lemma: "تَمَوْضُع"
      generation_method: ishtiqaq
      justification: "من «موضع» على وزن تَفَوْعُل، يدلّ على اتخاذ موضع في المكان والاستقرار فيه"
    - lemma: "حَيِّزِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «حيّز» بمعنى حالة شغل الحيّز المكاني"


stage2_evidence:
  per_lemma:
    - lemma: "تَحَيُّز"
      confirm:
        - text: "«التحيّز: هو الحصول في المكان على ما في شرح المواقف في مقدمة الموقف الثالث. وهذا وإن كان في نفسه صحيحا باعتبار ترادف الحيّز والمكان، لكن أولى أن يفسّر بالحصول في الحيّز لكونه صحيحا مطلقا سواء اعتبر ترادفهما أو لا.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«تحيز — prejudice»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
          conflict: "المعنى المعاصر السائد هو الانحياز والتغرّض لا الحصول في المكان"
        - text: "«تحيّز — partiality»"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
          conflict: "حتى في سياق الفلسفة المعاصرة صار المصطلح يدلّ على المحاباة"
        - text: "«تحيُّز — Bias — مُعامِل في الشبكة العصبية يُتيح للخلايا العصبية تحويل دالة التنشيط»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          conflict: "في المصطلحية التقنية الحديثة: تحيُّز = انحراف/تحيّز إحصائي"
      expands:
        - text: "«(تحيز) الرجل أَرَادَ الْقيام فَأَبْطَأَ ذَلِك عَلَيْهِ وإليهم انْضَمَّ وَوَافَقَهُمْ فِي الرَّأْي»"
          source: "المعجم الوسيط"
          addition: "الدلالة اللغوية الأصلية للفعل: الانضمام إلى جهة، مع معنى التلوّي والإبطاء"
        - text: "«تَحيَّزَ — الإنسانُ وغيرُه: تَلَوَّى وتقَلَّبَ. أرادَ القيامَ فأبطأ ذلك عليه. الشيءُ: تَفَرَّقَ وتمَيَّزَ. جاوزَ ما حَوْله وبرزَ. إلَيْهم: انْضَمَّ ووافقَهُم في الرَّأى»"
          source: "المعجم الكبير"
          addition: "يُسجَّل فعلاً في المعجم الكبير، ومنه معنى «تميّز وجاوز ما حوله» وهو قريب من معنى شغل الحيّز"

    - lemma: "تَمَوْضُع"
      confirm:
        - text: "«تموضُع — positionning»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "«تَوَضُّع — وجود ظاهرة ما في موقع محدد»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "الصيغة تَوَضُّع (تَفَعُّل) مقابل تَمَوْضُع (تَفَوْعُل) تُستخدم في المصطلحية الطبية والعلمية بمعنى قريب"
        - text: "«تَوَضُّعٌ حَيِّزِيّ — spatial localization»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "مركّب «توضّع حيّزي» يطابق المفهوم تماماً: التموضع في الحيّز"

    - lemma: "مَوْقِعِيَّة"
      confirm:
        - text: "«المَوْقعيّة: كونُ الشيء أو الإنسان إلخ موجودًا في موقعٍ معيَّن»"
          source: "المورد الحديث (2008)"

    - lemma: "حَيِّزِيَّة"
      contradicts:
        - text: "«حَيِّزيّة — من (ح ي ز) مؤنث حَيِّزيّ نسبة إلى حيّز»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المدخل الوحيد هو اسم علم شخصي وليس مصطلحاً لغوياً"


stage3_analysis:
  per_lemma:
    - lemma: "تَحَيُّز"
      decision: confirmed
      decision_reason: >
        مصطلح كلامي-فلسفي مؤصَّل في التراث العربي بتعريف التهانوي الصريح: «الحصول في الحيّز».
        رغم أنّ الدلالة المعاصرة انزاحت نحو «الانحياز»، فإنّ المصطلح ثابت في السياق الفلسفي-الأنطولوجي
        ولا ينبغي إسقاطه من المجموعة. يحتاج إلى تشكيل كامل للتمييز.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح كلامي-فلسفي كلاسيكي يدلّ على الحصول في الحيّز بوصفه صفة وجودية للأجسام، يختصّ بالسياق الفلسفي والكلامي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحَيُّز"

    - lemma: "تَمَوْضُع"
      decision: confirmed
      decision_reason: >
        مصطلح حديث مستعمل في الخطاب العلمي والتقني بمعنى اتخاذ موضع في المكان.
        مؤيَّد بمصادر عدة من ArabTerm. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح حديث يركّز على فعل اتخاذ الموضع المكاني، أعمّ من التحيُّز الفلسفي، يُستعمل في السياقات العلمية والتقنية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَوْضُع"

    - lemma: "مَوْقِعِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المورد الحديث يترجم ubiety مباشرة بـ«المَوْقِعِيَّة» مع تعريف مطابق: «كون الشيء أو الإنسان
        موجوداً في موقع معيّن». هذا أدقّ المرادفات وأقلّها التباساً، ومبنيّ على وزن المصدر الصناعي
        من «موقع» وهو جذر عربي أصيل (و-ق-ع).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصدر صناعي محايد يدلّ على حالة الوجود في موقع معيّن بلا تخصيص فلسفي أو تقني، الأقرب إلى المعنى الحرفي لـ ubiety"
      actions:
        - command: create_entry
          params: {lemma: "مَوْقِعِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حَيِّزِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أيّ شاهد معجمي يستخدم هذا اللفظ مصطلحاً دالاً على حالة الوجود في المكان.
        المدخل الوحيد في قاعدة البيانات هو اسم علم في موسوعة الأسماء. لا سكّ مصطلحي ثابت.

    - lemma: "مَكَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية على استعمال «مكانيّة» بمعنى حالة الوجود في المكان.
        اللفظ قد يُفهم على أنه نسبة إلى المكان (= محلّي) لا حالة الكون في مكان.


