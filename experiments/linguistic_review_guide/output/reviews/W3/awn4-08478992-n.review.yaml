stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية (تشكيلة مبهرة، مجموعة رائعة) هي عبارات وصفية حرة (Free phrases) وليست مصطلحات مسكوكة أو وحدات معجمية ثابتة."
    observations: "المفهوم الإنجليزي 'panoply' يعبر عن تشكيلة أو مصفوفة كبيرة ومثيرة للإعجاب. في العربية، لا توجد كلمة واحدة تغطي الدلالتين (الجمع + الإبهار) بشكل مطلق في جميع السياقات، لذا تملأ هذه الفجوة المعجمية عادة بكلمات تشير إلى الجمع أو التشكيلة المنوعة مثل 'ترسانة'، 'حشد'، 'تشكيلة'، و'باقة' على سبيل الاستعارة."
  blind_candidates:
    - lemma: "تَرْسَانَة"
      generation_method: majaz
      justification: "استخدام مجازي لمستودع الأسلحة أو بناء السفن للتعبير عن مصفوفة واسعة ومؤثرة من الأشياء."
    - lemma: "حَشْد"
      generation_method: majaz
      justification: "نقل دلالة التجمع البشري الكثيف للتعبير عن تجمع أو مصفوفة ضخمة ومؤثرة."
    - lemma: "تَشْكِيلَة"
      generation_method: ishtiqaq
      justification: "مصدر يدل على مجموعة متكاملة أو منتقاة من الأشياء."
    - lemma: "بَاقَة"
      generation_method: majaz
      justification: "مجاز من حزمة الأزهار إلى أي مجموعة منتقاة ومبهرة تعبر عن مصفوفة متكاملة."

stage2_evidence:
  per_lemma:
    - lemma: "تشكيلة مبهرة"
      evidence_status: no_material_found
    - lemma: "مجموعة رائعة"
      evidence_status: no_material_found
    - lemma: "تَرْسَانَة"
      confirm:
        - text: "مكان صنع المراكب والسُّفن \"ترسانة بحرية\". مستودع الأسلحة والذخائر وأدوات الحرب \"تمتلك إسرائيل ترسانة نوويّة كبرى\"."
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "حَشْد"
      confirm:
        - text: "من النَّاس الْجَمَاعَة (ج) حشود"
          source: "المعجم الوسيط"
    - lemma: "تَشْكِيلَة"
      confirm:
        - text: "مجموعة العناصر المادية والبرمجية المكونة لحاسوب"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
    - lemma: "بَاقَة"
      confirm:
        - text: "حزمة من البقل، ويُطلقها المحدثون على الضميمة من الزّهر وعلى الحزمة من كلّ شيء \"تُقَدَّم باقات الورود في المناسبات السعيدة\" ° باقة سلاح: مجموعة أسلحة تُرتَّب على شكل معيّن، وتُتَّخذ زينة وشعارًا للنَّصر."
          source: "معجم اللغة العربية المعاصرة"

stage3_analysis:
  per_lemma:
    - lemma: "تشكيلة مبهرة"
      decision: removed
      decision_reason: "مركب وصفي حر وليس مصطلحاً مسكوكاً ثابتاً، مما يتعارض مع مبادئ بناء الشبكات الدلالية (اختبار السكّ)."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params: {sense_id: "{auto}"}
    - lemma: "مجموعة رائعة"
      decision: removed
      decision_reason: "تعبير وصفي حر ومجرد تقييم انطباعي يعتمد على السياق، وليس مصطلحاً معجمياً مستقلاً."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params: {sense_id: "{auto}"}
    - lemma: "تَرْسَانَة"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة تستخدم مجازاً بكثرة في السياقات الحديثة للتعبير عن مجموعة واسعة وقوية من الأشياء (مثل: ترسانة قانونية، ترسانة من الخيارات) مطابقة لمفهوم panoply."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَرْسَانَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08478992-n"}
    - lemma: "حَشْد"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر عن الكثرة والتجمع الكبير المؤثر، ويستخدم مجازاً للأشياء للتعبير عن وفرتها وتأثيرها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "حَشْد", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08478992-n"}
    - lemma: "تَشْكِيلَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق للتعبير عن مصفوفة أو ترتيب منتقى من الأشياء المتنوعة (assortment/array) ويمثل الجنس القريب للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَشْكِيلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08478992-n"}
    - lemma: "بَاقَة"
      source: stage1
      decision: confirmed
      decision_reason: "تستخدم مجازاً للإشارة إلى مجموعة متكاملة ومبهرة من الأشياء المنسقة بشكل جذاب (مثل: باقة خدمات)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "بَاقَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08478992-n"}

stage4_content:
  definition:
    current: "مصفوفة كاملة ومثيرة للإعجاب"
    assessment:
      decision: revise
      reason: "التعريف الحالي يبدو كترجمة آلية حرفية. صيغ بأسلوب معجمي عربي يعبر عن المفهوم بوضوح وشمولية."
    authored:
      - type: terminological
        text: "مجموعة ضخمة ومتنوعة من الأشياء تشكل نسقاً متكاملاً يلفت الانتباه ويثير الإعجاب."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-08478992-n", definition_index: 0, text: "مجموعة ضخمة ومتنوعة من الأشياء تشكل نسقاً متكاملاً يلفت الانتباه ويثير الإعجاب."}
  examples:
    per_lemma:
      - lemma: "تَرْسَانَة"
        examples:
          - text: "أعدّت الحكومة ترسانة من القوانين الجديدة لمكافحة الفساد."
            type: usage
      - lemma: "حَشْد"
        examples:
          - text: "ضم المعرض حشداً من الابتكارات التقنية الحديثة."
            type: usage
      - lemma: "تَشْكِيلَة"
        examples:
          - text: "قدمت الشركة تشكيلة واسعة من المنتجات المبتكرة هذا العام."
            type: usage
      - lemma: "بَاقَة"
        examples:
          - text: "وفرت المنصة باقة متكاملة من الخدمات الرقمية للمستخدمين."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-08478992-n", text: "قدمت الشركة تشكيلة واسعة من المنتجات المبتكرة هذا العام."}

