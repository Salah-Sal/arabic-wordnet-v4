# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13981260-n (immanence)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «كمون» مشترك لفظي خطير: يدل على نبات الكَمُّون (بتشديد الميم)، وعلى الاستتار (كُمُون بضمتين)، وعلى الجهد الكهربائي (potential)، فيلتبس بالمعنى الفلسفي المراد"
      - "«ملازمة» تُستخدم في المنطق بمعنى implication/inherence لا immanence، وقد يقع خلط بين المصطلحين"
      - "التعريف العربي الحالي ترجمة شبه حرفية للتعريف الإنجليزي وليس تعريفاً معجمياً مستقلاً"
    observations: "المفهوم فلسفي محض (المحايثة) يقابل مفهوم التعالي (transcendence). يُستعمل في الفلسفة الغربية خاصة عند كانط وسبينوزا. المصطلح العربي الأدق هو «مُحَايَثَة» المشتق من «حَيْثُ» للدلالة على المكان والملابسة، وهو مصطلح حديث سكّه المترجمون العرب للفلسفة"
  blind_candidates:
    - lemma: "كُمُون"
      generation_method: ishtiqaq
      justification: "مصدر كَمَنَ يَكْمُنُ على وزن فُعُول، يدل على استتار الشيء وبقائه داخل غيره دون ظهور، فيناسب معنى البقاء ضمن نطاق معيّن"
    - lemma: "مُحَايَثَة"
      generation_method: ishtiqaq
      justification: "مصدر حَايَثَ على وزن مُفَاعَلَة من «حَيْثُ» الظرفية المكانية، يدل على المصاحبة في المكان والملابسة الذاتية دون تجاوز"
    - lemma: "بُطُون"
      generation_method: majaz
      justification: "مصدر بَطَنَ يدل على إنسيّ الشيء وداخله، فيُستعار للوجود الباطني ضمن نطاق دون تعدّيه"
    - lemma: "حُلُول"
      generation_method: ishtiqaq
      justification: "مصدر حَلَّ يَحُلُّ بمعنى النزول في المكان والاستقرار فيه، يدل على الوجود داخل شيء آخر"

stage2_evidence:
  per_lemma:
    - lemma: "كُمُون"
      confirm:
        - text: "«الكُمُونُ: استتار الشَّيْء عَن الْحس»"
          source: "معجم مقاليد العلوم للسيوطي"
      contradicts:
        - text: "«الكَمُّون: نبات زراعيٌّ عشبيٌّ حوليٌّ من الفصيلة الخيميَّة, بزوره من التوابل»"
          source: "المعجم الوسيط"
          conflict: "اشتراك لفظي مع اسم النبات (الكَمُّون بتشديد الميم)، والكُمُون بمعنى الاستتار يختلف دلالياً عن المحايثة الفلسفية"
      expands:
        - text: "«الْكَافُ وَالْمِيمُ وَالنُّونُ أُصَيْلٌ يَدُلُّ عَلَى اسْتِخْفَاءٍ. يُقَالُ: كَمَنَ الشَّيْءُ كُمُونًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الاستخفاء والاختباء لا على مجرد البقاء داخل نطاق"
    - lemma: "مُحَايَثَة"
      confirm:
        - text: "«محايث — immanent»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«الملازَمة؛ التأصّل؛ الحلول؛ الذاتية — immanence|immanency»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) ملازم؛ متأصل؛ جوهري؛ باطنيّ (2) حالّ في (3) ذاتيّ: مقصورٌ على الوعي أو على العقل — immanent»"
          source: "المورد الحديث (2008)"
          addition: "يُبيّن تعدد الأبعاد الدلالية للمفهوم: الملازمة، والباطنية، والحلول، والقصر على الذات"
    - lemma: "مُلَازَمَة"
      confirm:
        - text: "«ملازمة — inherence»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«الملازمة: لغةً امتناع انفكاك الشيء عن الشيء، واللزوم والتلازم بمعناه، واصطلاحًا: كون الحكم مقتضيًا للآخر»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«مُلاَزَمَة — Implicature: علاقة منطقية تجمع بين قضيتين، فحين تكون أولاهما صحيحة، فإن الثانية ستكون كذلك بالضرورة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "في اللسانيات تُستخدم «ملازمة» بمعنى implicature/implication وهو مفهوم منطقي مختلف عن immanence"
      expands:
        - text: "«المُلازَمةُ: هِيَ كَون الحكم مقتضيا لآخر. اللُّزومُ والتَّلازُمُ: كَذَلِك»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "المصطلح التراثي يدور حول الاقتضاء المنطقي لا حول الوجود المكاني الباطني"
    - lemma: "بُطُون"
      evidence_status: "no_material_found"
    - lemma: "حُلُول"
      contradicts:
        - text: "«الحُلُول: اتِّحَاد الجسمين بِحَيْثُ تكون الْإِشَارَة إِلَى أَحدهمَا إِشَارَة إِلَى الآخر. مَذْهَب الْحُلُول: القَوْل بِأَن الله حَال فِي كل شَيْء»"
          source: "المعجم الوسيط"
          conflict: "الحلول في الاصطلاح الإسلامي مفهوم لاهوتي خاص (incarnation/pantheism) يختلف عن المحايثة الفلسفية"
      expands:
        - text: "«الحلول السرياني: عبارة عن اتحاد الجسمين بحيث تكون الإشارة إلى أحدهما إشارة إلى الآخر، كحلول ماء الورد في الورد. الحلول الجواري: عبارة عن كون أحد الجسمين ظرفًا للآخر»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "التمييز بين الحلول السرياني (اتحاد) والجواري (ظرفية) يُظهر تعقّد المصطلح اللاهوتي"

stage3_analysis:
  per_lemma:
    - lemma: "كُمُون"
      decision: removed
      decision_reason: "الكُمُون يدل في أصله على الاستتار والاختفاء لا على مجرد البقاء ضمن نطاق. وهو مشترك لفظي مع اسم النبات (الكَمُّون) ومع مصطلح الجهد الكهربائي (potential). دلالته الأساسية (latency = الخفاء والاستتار) تختلف عن المحايثة (immanence = الوجود الداخلي في مقابل التعالي). المصطلح لم يثبت في المعاجم الفلسفية المتخصصة بمعنى immanence"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُحَايَثَة"
      decision: confirmed
      decision_reason: "مصطلح فلسفي حديث مثبت في مسرد ALECSO للفلسفة وعلم النفس والمورد الحديث، مشتق اشتقاقاً قياسياً من «حيث» الظرفية على وزن مُفَاعَلَة للدلالة على المشاركة المكانية. يقابل immanence مقابلة دقيقة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الفلسفي المتخصص الذي يقابل immanence مقابلة حصرية، ويتقابل مع «تعالٍ» (transcendence)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَايَثَة"

    - lemma: "مُلَازَمَة"
      decision: confirmed
      decision_reason: "مصطلح تراثي أصيل يدل على امتناع انفكاك شيء عن شيء، وهو قريب من معنى المحايثة في بُعد الملابسة والاقتران الذاتي. مثبت في التعريفات للجرجاني ومقاليد العلوم للسيوطي. استُخدم في مسرد ALECSO بمعنى inherence القريب من immanence"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على امتناع الانفكاك والاقتران الضروري بين شيئين، وهي أعم من المحايثة إذ تشمل اللزوم المنطقي والوجودي معاً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُلَازَمَة"

    - lemma: "بُطُون"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية لاستعمال «بطون» بمعنى المحايثة أو الوجود الباطني كمصطلح فلسفي. الجذر بطن يدل على الداخل لكن المصدر «بطون» غير مسكوك اصطلاحياً"

    - lemma: "حُلُول"
      source: stage1
      decision: removed
      decision_reason: "الحلول في الاصطلاح الإسلامي والفلسفي العربي مفهوم لاهوتي خاص يعني اتحاد الجسمين أو حلول الله في الخلق (incarnation/pantheism)، وهو مختلف جوهرياً عن المحايثة الفلسفية التي تعني بقاء الشيء ضمن نطاقه دون تجاوز"

