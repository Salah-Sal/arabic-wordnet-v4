# مراجعة المجموعة الترادفية — awn4-14038737-n (countercheck)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي دائري: يستخدم «كبح» لتعريف «كبح مضاد»"
      - "اللمّة الوحيدة «كبح مضاد» مركب وصفي غير مسجل في المعاجم كوحدة معجمية ثابتة"
      - "المجموعة تحتوي على لمّة واحدة فقط مما يُضعف التغطية المعجمية"
    observations: "المفهوم يدور حول آلية ضبط تُقيّد آلية ضبط أخرى، وهو مفهوم مجرد يُستعمل في سياقات الحوكمة والرقابة والموازنات. في العربية، يُعبَّر عن هذا عادةً بتراكيب وصفية لا بمصطلح مفرد مسكوك، مما يُشير إلى فجوة معجمية."

  blind_candidates:
    - lemma: "مُكَابَحَة"
      generation_method: ishtiqaq
      justification: "من الجذر كبح على وزن مُفَاعَلة الدال على التقابل والمشاركة، فالمكابحة تعني التقابل في الكبح، أي أن كبحاً يقابل كبحاً آخر"
    - lemma: "كَبْحٌ مُقَابِل"
      generation_method: tarkib
      justification: "مركب وصفي من كبح + مقابل، يدل على كبح يقابل كبحاً آخر ويحدّ منه، وهو أقرب لدلالة countercheck من مضاد"
    - lemma: "عَقَبَةٌ مُقَابِلَة"
      generation_method: tarkib
      justification: "ورد في المورد الحديث ترجمةً لـ countercheck، والعقبة تدل على ما يعترض الشيء ويمنعه"
    - lemma: "رَقَابَةٌ مُضَادَّة"
      generation_method: tarkib
      justification: "مركب وصفي يدل على رقابة تعاكس رقابة أخرى وتقيّدها، مستعمل في سياقات الحوكمة"

stage2_evidence:
  per_lemma:
    - lemma: "كَبْحٌ مُضَادّ"
      confirm:
        - text: "«كَبْح: مصدر كبحت الفرس باللجام»"
          source: "مجمل اللغة"
        - text: "«كَبْح [مفرد]: مصدر كبَحَ»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«مضاد: ما يعمل على إحباط عمل آخر»"
          source: "معجم المصطلحات الطبية"
      expands:
        - text: "«كبح الدابةَ: جذب رأسَها إليه باللجام وهو راكب لكي تقف ولا تجري. ويقال كبح السيارة ونحوها وقفها بالكباحة. وفلاناً عن حاجته ردّه عنها»"
          source: "المعجم الوسيط"
          addition: "الكبح في الأصل جذب الدابة باللجام ثم توسّع للسيارة ولردّ الإنسان عن حاجته"
        - text: "«كبحه عن حاجته كبحاً إذا رده عنها. وكبح الحائط السهم إذا أصاب الحائط حين رُمي به وردّه عن وجهه»"
          source: "لسان العرب"
          addition: "يتعدى الكبح من المادي إلى المعنوي: ردّ الإنسان وردّ السهم"
        - text: "«(1) عَقَبة؛ عَقَبةٌ مُقابِلة (2) المراجَعَة المقابِلة: مراجعة ثانية تُجرى على سبيل التحقُّق (3) يَعُوق (4) يُراجع ثانية»"
          source: "المورد الحديث (2008)"
          addition: "ترجمة countercheck في المورد تعطي بديلين: عقبة مقابلة (عائق) والمراجعة المقابلة (تدقيق)"

    - lemma: "مُكَابَحَة"
      evidence_status: "no_material_found"

    - lemma: "كَبْحٌ مُقَابِل"
      evidence_status: "no_material_found"

    - lemma: "عَقَبَةٌ مُقَابِلَة"
      confirm:
        - text: "«(1) عَقَبة؛ عَقَبةٌ مُقابِلة»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«عقبة مقابلة» وردت ترجمةً لـ countercheck بمعنى عائق يعترض عائقاً آخر، لكن المراد في المجموعة الترادفية هو «كبح يقيّد كبحاً» لا مجرد عقبة"
          source: "المورد الحديث (2008)"
          conflict: "العقبة تدل على العائق المادي أكثر من آلية التقييد المجردة"

    - lemma: "رَقَابَةٌ مُضَادَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "كَبْحٌ مُضَادّ"
      decision: confirmed
      decision_reason: "المركب الوصفي واضح الدلالة: الكبح (التقييد والمنع) + المضاد (المعاكس)، فيدل على تقييد يعاكس تقييداً آخر. وإن لم يكن مسجلاً كوحدة معجمية ثابتة في المعاجم الكلاسيكية، فإنه مبني على نمط إنتاجي في المصطلحات العربية الحديثة (كبح كهربائي، كبح ديناميكي، إلخ)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على بُعد التقييد والمنع (من أصل كبح الدابة باللجام) مع صفة المعاكسة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَبْحٌ مُضَادّ"

    - lemma: "مُكَابَحَة"
      source: stage1
      decision: removed
      decision_reason: "وزن مُفَاعَلة يدل على المشاركة والتبادل بين طرفين (كالمقاتلة والمشاركة)، وهذا لا يطابق المفهوم تماماً لأن المراد كبحٌ يقيّد كبحاً آخر أحادياً لا تبادلياً. كما أن اللفظ غير مسجل في أي معجم."

    - lemma: "كَبْحٌ مُقَابِل"
      source: stage1
      decision: removed
      decision_reason: "لا يضيف ميزة دلالية واضحة على «كبح مضاد» القائم. ومُقابل أضعف دلالة على المعاكسة من مُضاد، إذ المقابل قد يعني المناظر لا المعاكس."

    - lemma: "عَقَبَةٌ مُقَابِلَة"
      source: stage1
      decision: removed
      decision_reason: "وإن ورد في المورد الحديث ترجمةً لـ countercheck، فإن العقبة تدل على العائق المادي أو الصعوبة، لا على آلية تقييد مضادة. كما أن المفهوم في المجموعة الترادفية أقرب إلى الكبح (restraint) منه إلى العقبة (obstacle)."

    - lemma: "رَقَابَةٌ مُضَادَّة"
      source: stage1
      decision: removed
      decision_reason: "الرقابة تعني الإشراف والمتابعة وليس التقييد والمنع. المفهوم هنا check بمعنى restraint لا بمعنى supervision."

