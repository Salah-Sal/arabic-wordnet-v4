# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13982207-n
# real existence / الوجود الحقيقي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«واقعية» تُستخدم غالباً بمعنى المذهب الفلسفي (realism) لا بمعنى الوجود الحقيقي"
      - "«وجودية» تعني في جميع المصادر المعاصرة والكلاسيكية المذهبَ الوجوديَّ (existentialism) لا صفة الوجود الحقيقي"
      - "المجموعة تفتقر إلى لمّة تدل بوضوح على مفهوم الوجود الفعلي بلا التباس مع مذهب فلسفي"
    observations: >
      المجموعة تقع تحت مفرط «حضور / وجود» وتدل على نوع خاص منه هو الوجود الحقيقي الفعلي
      لا المتخيَّل ولا المحتمَل. اللمّتان الحاليتان مصدران صناعيان (-يَّة) لكنهما مشحونتان
      بدلالات اصطلاحية فلسفية راسخة (واقعية = realism، وجودية = existentialism) مما يُحدث
      اشتراكاً لفظياً مُضلِّلاً. يحتاج المفهوم إلى لفظ يدل على حالة كون الشيء موجوداً بالفعل.

  blind_candidates:
    - lemma: "تَحَقُّق"
      generation_method: ishtiqaq
      justification: "مصدر الفعل تحقَّقَ من جذر حقق، يدل على صيرورة الشيء حقيقياً واقعاً، وهو قريب من معنى الوجود الحقيقي"
    - lemma: "كَيْنُونَة"
      generation_method: ishtiqaq
      justification: "من جذر كون على وزن فَيْعَلُولَة، تدل على حالة الوجود والكينونة، وهي لفظة تراثية مسجّلة"
    - lemma: "حَقَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من حقّ/حقاني، تدل على صفة الحقّية والثبوت الحقيقي"
    - lemma: "عَيَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من عِيان (المشاهدة والحضور)، تدل على كون الشيء محسوساً مشاهَداً موجوداً بالفعل"


stage2_evidence:
  per_lemma:
    - lemma: "وَاقِعِيَّة"
      confirm:
        - text: "«(1) الحقيقيّة؛ الواقعيّة (2) حقيقة؛ واقع»"
          source: "المورد الحديث (2008) — ترجمة reality"
      contradicts:
        - text: "«(الواقعية) (فِي الفلسفة) مَذْهَب يلْتَزم فِيهِ التَّصْوِير الْأمين لِمظَاهر الطبيعة والحياة كَمَا هِيَ وَكَذَلِكَ عرض الآراء والأحداث والظروف والملابسات دون نظر مثالي (مج) وَمذهب أدبي يعْتَمد على الوقائع ويعنى بتصوير أَحْوَال الْمُجْتَمع (مو)»"
          source: "المعجم الوسيط"
          conflict: "التعريف المعجمي الوحيد للواقعية في الوسيط هو المذهب الفلسفي/الأدبي، لا الوجود الحقيقي"
        - text: "«الميل إلى تمثيل الأشياء أو طريقة العرض كما هي في الواقع.»"
          source: "مسرد التربية — ArabTerm (ترجمة realism)"
          conflict: "الترجمة المقابلة هي realism لا real existence"

    - lemma: "وُجُودِيَّة"
      contradicts:
        - text: "«(الوجودية) (بِالْمَعْنَى الْأَعَمّ) فلسفة ترى أَنَّ الْوُجُود سَابق على الْمَاهِيّة و (بِالْمَعْنَى الْأَخَص) يذهب (سارتر) إِلَى أَنَّهَا تقوم على الْحُرِّيَّة الْمُطلقَة»"
          source: "المعجم الوسيط"
          conflict: "الوجودية مصطلح فلسفي راسخ يعني existentialism لا real existence"
        - text: "«الوجوديةُ اللاّضروريةُ: مَا يحكم فِيهَا بِثُبُوت الْمَحْمُول للموضوع أَو سلبه عَنهُ بِالْفِعْلِ مَعَ قيد اللاضرورة»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الوجودية في المنطق الكلاسيكي نوع من القضايا الموجَّهة لا صفة للوجود"
        - text: "«الوجودية:[في الانكليزية] Absolute general proposition... اللادائمة هي عند المنطقيين مطلقة عامّة مع قيد اللادوام بحسب الذات»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التهانوي يعرّف الوجودية بوصفها مصطلحاً منطقياً (نوع من القضايا) لا وصفاً للوجود الحقيقي"

    - lemma: "تَحَقُّق"
      confirm:
        - text: "«التّحقّق: هو عند الأشاعرة مرادف للثبوت والكون والوجود»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«الأمر: صح ووقع. الأمر: عرف حقيقته»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يعرّفه بوصفه فعلاً (صحّ ووقع / عرف حقيقته) لا اسماً دالاً على حالة الوجود"
      expands:
        - text: "«ثم التحقق قسمان: أصلي وهو أن يكون التحقق حاصلا لشيء في نفسه قائما به، وإمّا تبعي وهو أن لا يكون حاصلا له بل لما تعلّق به»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التهانوي يقسم التحقق إلى أصلي وتبعي، مما يوسّع المفهوم إلى ما يتجاوز مجرد الوجود الحقيقي"

    - lemma: "كَيْنُونَة"
      confirm:
        - text: "«(1) كينونة؛ وجود (2) الكائنات مجتمعةً (3) كائن (4) حياة؛ بقاء»"
          source: "المورد الحديث (2008) — ترجمة existence"
      contradicts:
        - text: "«كَينونَةٌ مَرَضِيَّة»"
          source: "المعجم الطبي الموحد (2009) — ترجمة ens morbi"
          conflict: "كينونة تُستخدم بمعنى الوجود المطلق (existence) وهو المفرط (hypernym) لا الوجود الحقيقي خصوصاً"

    - lemma: "حَقَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "عَيَانِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "وَاقِعِيَّة"
      decision: confirmed
      decision_reason: >
        رغم أن الدلالة السائدة لـ«واقعية» هي المذهب الفلسفي (realism)، فإن المورد الحديث
        يترجم reality بـ«الحقيقيّة؛ الواقعيّة»، والمصدر الصناعي من «واقع» (الموجود بالفعل)
        يصلح لغوياً للدلالة على حالة كون الشيء واقعاً حقيقياً. يُبقى عليها مع التنبيه إلى
        الاشتراك اللفظي مع المذهب الفلسفي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على صفة كون الشيء واقعاً فعلاً لا متخيَّلاً، مع ارتباط بمفهوم المطابقة للواقع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَاقِعِيَّة"

    - lemma: "وُجُودِيَّة"
      decision: removed
      decision_reason: >
        جميع المصادر المعجمية (الوسيط، التهانوي، السيوطي، الجرجاني، أربتيرم) تعرّف «الوجودية»
        بوصفها مذهباً فلسفياً (existentialism) أو مصطلحاً منطقياً (نوع من القضايا الموجَّهة).
        لا يوجد أي شاهد على استخدامها بمعنى «الوجود الحقيقي» (real existence). الإبقاء عليها
        يُحدث خلطاً دلالياً خطيراً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَحَقُّق"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن التهانوي يذكر أن التحقق عند الأشاعرة مرادف للثبوت والوجود، فإن الاستعمال
        المعاصر السائد هو «التثبُّت والفحص» (verification)، والمعجم الوسيط يعرّفه فعلاً
        لا اسماً. هذا الاشتراك اللفظي يجعله غير ملائم لمصطلح معجمي واضح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "كَيْنُونَة"
      source: stage1
      decision: removed
      decision_reason: >
        كينونة تعني الوجود المطلق (existence/being) وهي مرادف للمفرط «وجود» (awn4-13980887-n).
        إدراجها في هذه المجموعة يُلغي الفارق بين المفرط والمفرَّط فيه، إذ المطلوب هو
        «الوجود الحقيقي» لا مطلق الوجود.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "حَقَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استخدام هذا اللفظ. مصدر صناعي غير مسكوك."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "عَيَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استخدام هذا اللفظ بمعنى الوجود الحقيقي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


