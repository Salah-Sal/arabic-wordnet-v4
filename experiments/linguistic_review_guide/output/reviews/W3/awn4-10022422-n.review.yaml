# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. المرشحات الأعمى — توليد قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "مُجاهِر"
      generation_method: ishtiqaq
      justification: >
        مشتق من جاهَرَ (باب فاعَل) على وزن مُفاعِل: مَن يُجاهر بمشاعره وآرائه
        علناً دون إخفاء؛ الجذر جهر يدل على الإعلان والإظهار في فضاء عام،
        وهو ما يلائم مفهوم المشارك في تجمع علني للتعبير عن مشاعر جماعية.

    - lemma: "مُحتَشِد"
      generation_method: ishtiqaq
      justification: >
        مشتق من احتشد (باب افتعل) على وزن مُفتَعِل: مَن ينضم إلى حشد جماهيري
        ويدفع بقوته في تجمع مشترك؛ يُبرز الجانب الجماعي من الفعل
        "display of group feeling" ويُشير إلى الانضمام إلى كتلة بشرية مُعبِّرة.

    - lemma: "هَاتِف"
      generation_method: majaz
      justification: >
        من هَتَفَ يَهتِف: رفع صوته بالنداء أو الشعار؛ إحياء للفظ القديم
        "الهاتف = الصائح مادّاً صوته" ليدل على مَن يرفع صوته في فضاء
        عام بالشعارات والمطالب، وهو جوهر فعل المتظاهر.

    - lemma: "مُنادٍ"
      generation_method: ishtiqaq
      justification: >
        مشتق من نادى (باب فاعَل) على وزن مُفاعٍ: مَن ينادي بمطالبه وآرائه
        في الفضاء العام؛ يلتقي مع المفهوم من ناحية الإعلان العلني
        والتعبير الجهري عن موقف جماعي.

  # ب. التقييم الأولي — بعد الاطلاع على اللمّات الكاملة
  assessment:
    concerns:
      - >
        التعريف الحالي «شخص يشارك في عرض عام للمشاعر الجماعية (مظاهرة)»
        ترجمة حرفية جامدة لـ "public display of group feeling"؛
        عبارة «عرض عام للمشاعر» غير مألوفة في الأسلوب المعجمي العربي.
      - >
        إدراج «(مظاهرة)» بين قوسين داخل التعريف اصطلاح مُقحَم؛
        التعريف المعجمي لا يُدرج مصطلحات شارحة بين قوسين.
      - >
        لفظة «مُتَظاهِر» مشترك لفظي بين دلالتين: المشارك في مظاهرة،
        والمتصنِّع المتكلف (تظاهر بالصلاح/التقوى)؛ هذا الاشتراك محتمل
        لكنه يُزال بالسياق ولا يوجب الحذف.
      - >
        غياب أمثلة استعمالية على مستوى المجموعة أو المعنى.
    observations: >
      المجموعة تضم لمّتين راسختين في المعجمية العربية الحديثة:
      «مُتَظاهِر» يؤكد جانب الإظهار والبروز العلني، و«مُحْتَجّ» يؤكد جانب
      الاعتراض والمطالبة بالحق. كلا اللفظين مشتق اشتقاقاً صحيحاً
      من جذرين عربيين أصيلين (ظهر، حجج)، وقد أقرّهما مجمع اللغة العربية
      المصري. الرابط التراتبي مع «إصلاحي/مناضل» مقبول إذ يمكن اعتبار
      المتظاهر صنفاً من صنوف المناضل الداعي إلى التغيير.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت: ٥ استعلامات (دفعي + إثراء + جسر إنجليزي + FTS + مقاييس)
stage2_evidence:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "مُتَظاهِر"
      confirm:
        - text: >
            «(5) المُتظاهِر: المُشارِك في مظاهَرة.»
            [في سياق ترجمة: demonstrator]
          source: "المورد الحديث (2008)"
        - text: >
            «المتظاهر: المُشارِك في تظاهرةٍ أو مَسِيرة.»
            [في سياق ترجمة: demonstrant]
          source: "المورد الحديث (2008)"
        - text: >
            «المتظاهر: المُشارك في مظاهرة.»
            [في سياق ترجمة: manifestant]
          source: "المورد الحديث (2008)"
        - text: >
            «(2) المُتظاهر.»
            [في سياق ترجمة: marcher، بمعنى المسيرة الاحتجاجية]
          source: "المورد الحديث (2008)"
      expands:
        - text: >
            «أقر مجمع اللغة المصري- من خلال معجمه الوسيط- استخدام الفعل
            «تظاهَروا» بمعنى: تجمعوا ليعلنوا رأيهم في أمر، ومصدره «تظاهر»،
            واسم المرة منه «تظاهُرة». وأما «المظاهرة» بمعنى إعلان رأي أو إظهار
            عاطفة في صورة جماعية فقد أجازها مجمع اللغة المصري نظرًا لشيوعها
            على الألسنة، وذكرها الوسيط بنفس المعنى.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: >
            يؤكد أن الفعل «تظاهر» بمعنى التجمع لإعلان الرأي مُقرٌّ مجمعياً،
            مما يُسبغ الشرعية المعجمية على اسم الفاعل «مُتَظاهِر».

    # ── لمّة موجودة ٢ ──
    - lemma: "مُحْتَجّ"
      confirm:
        - text: >
            «المُحْتَجّ؛ المُعترِض.»
            [في سياق ترجمة: protester]
          source: "المورد الحديث (2008)"
        - text: >
            «مُحْتجّ؛ معترِض.»
            [في سياق ترجمة: remonstrant]
          source: "المورد الحديث (2008)"

    # ── مرشح المرحلة ١ — أ ──
    - lemma: "مُجاهِر"
      contradicts:
        - text: >
            «مجاهر» [ترجمته: microscopes]
            [مدخل في المَكنَز الزراعي متعدد اللغات]
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          conflict: >
            اللفظ «مجاهر» مستعمل في المعاجم التقنية جمعاً لـ «مِجهَر» (microscope)،
            مما يجعل استعماله للدلالة على «المشارك في مظاهرة» ملتبساً تماماً.

    # ── مرشح المرحلة ١ — ب ──
    - lemma: "مُحتَشِد"
      contradicts:
        - text: >
            «المُحْتَشِدُ: الذى يبذُل غايةَ ما عنده من الجُهْدِ والنُّصْرةِ والمال.»
            [مدخل صفة (adj)]
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المعجم يعطي «المحتشد» معنى «المبذِّل لأقصى جهده ونصرته»، وهو
            معنى مختلف عن «المشارك في مظاهرة»؛ كما أن المدخل مصنَّف صفةً
            لا اسماً، مما يجعله غير ملائم كمصطلح لشخص.

    # ── مرشح المرحلة ١ — ج ──
    - lemma: "هَاتِف"
      contradicts:
        - text: >
            «(الْهَاتِف) الصَّوْت يسمع دون أَن يرى شخص الصائح
            و(التليفون) أَو من يتَكَلَّم بِهِ (مج).»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: >
            اللفظ أُشرب في العربية الحديثة معنى «الهاتف = التليفون» بصورة
            راسخة جداً، مما يجعل استخدامه للدلالة على المتظاهر مُوهِماً ومُلتبساً.
        - text: >
            «هاتف» [ترجمته: phone; telephone]
            [في مسرد الإعلام والتواصل]
          source: "المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
          conflict: >
            تعزز المعاجم التقنية المتعددة هيمنة المعنى التقني (الهاتف) على اللفظ.

    # ── مرشح المرحلة ١ — د ──
    - lemma: "مُنادٍ"
      contradicts:
        - text: >
            «المُنَادَى: هُوَ الْمَطْلُوب إقباله بِحرف نَائِب مناب (أَدْعُو)
            لفظا أَو تَقْديرا.»
          source: "معجم مقاليد العلوم للسيوطي (ت ١٥٠٥)"
          conflict: >
            «المُنادى» في الموروث النحوي العربي مصطلح صرفي راسخ للمفعول به
            في أسلوب النداء، وهو خلاف «المُنادِي» (الفاعل) لكن الاشتباه
            بين الصيغتين وارد ومُضلِّل.
        - text: >
            «مُنادٍ: صبي يعمل في فندق يحمل لوحة معلق عليها جرس ومكتوب
            عليه رقم غرفة النزيل المطلوب لأمر ما.»
            [ترجمته: callboy]
          source: "مسرد الفن والتسلية والرياضة (ARABTERM)"
          conflict: >
            المعنى الاصطلاحي الحديث لـ «مُنادٍ» في معاجم ARABTERM
            يدل على «بوّاب الفندق المنادي» وهو مختلف تماماً عن «المتظاهر».


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ══ لمّة موجودة ١ ══
    - lemma: "مُتَظاهِر"
      decision: confirmed
      decision_reason: >
        اللفظ مؤيَّد من مصادر معجمية متعددة بالدلالة المطلوبة (المشارك في مظاهرة)،
        ومجمع اللغة المصري أقرَّ الفعل «تظاهَرَ» بمعنى التجمع لإعلان الرأي،
        واسم فاعله «مُتَظاهِر» مستعمل استعمالاً واسعاً في الصحافة والإعلام العربي.
        الاشتراك اللفظي مع «المتظاهر بالصلاح» لا يوجب الحذف إذ يُزال بالسياق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على جانب البروز والإظهار العلني: المتظاهر هو مَن يَخرج إلى الفضاء
        العام ليُظهر موقفه في صورة جماعية مرئية؛ المفهوم يستحضر الحضور
        الجسدي في الشارع وفعل الإظهار الصريح أمام الرأي العام.
      morphology_check:
        pattern: "مُتَفَاعِل"
        root: "ظهر"
        pos_fit: >
          اسم فاعل من الفعل تظاهَرَ (باب تفاعل)؛ الوزن مُتَفَاعِل يصلح
          تماماً للفاعل المشارك في فعل جماعي مشترك، وهو اشتقاق قياسي سليم.

    # ══ لمّة موجودة ٢ ══
    - lemma: "مُحْتَجّ"
      decision: confirmed
      decision_reason: >
        اللفظ مؤيَّد صراحةً بترجمة protester وremonstrant في المورد الحديث.
        الاشتقاق من احتجَّ (افتعل من حجج) سليم قياسي، والمصطلح شائع في
        الخطاب الرسمي والقانوني العربي (احتجاج، محتجّ) بدلالة الاعتراض
        والمطالبة الصريحة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على جانب الاعتراض والمطالبة بالحق بالحجة والبيان: المحتجّ
        هو مَن يرفع صوته معارضاً أو مطالباً، مع دلالة ضمنية على امتلاك
        موقف حجاجي (حُجَّة) يدفع به عن نفسه أو عن الجماعة؛ يُستخدم
        أكثر في السياقات القانونية والسياسية.
      morphology_check:
        pattern: "مُفْتَعِل (مُحْتَجّ < مُحْتَجِج)"
        root: "حجج"
        pos_fit: >
          اسم فاعل من احتجَّ (افتعل)؛ حدث الإدغام القياسي في الجيمين
          (مُحْتَجِج → مُحْتَجّ)؛ الاشتقاق صحيح وسليم.

    # ══ مرشح المرحلة ١ — أ ══
    - lemma: "مُجاهِر"
      source: stage1
      decision: removed
      decision_reason: >
        «مجاهر» جمع «مِجهَر» (microscope) في المعاجم التقنية الحديثة، مما
        يُفضي إلى التباس شديد مع «مُجاهِر» (اسم فاعل من جاهَرَ). اجتاز
        اختبار السكّ الشكلي لكنه أخفق في اختبار التثبيت المعجمي: اللفظ
        محجوز عملياً للمعنى التقني ولا يمكن إحياؤه بالمعنى المقترح دون
        إرباك القارئ.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ══ مرشح المرحلة ١ — ب ══
    - lemma: "مُحتَشِد"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الكبير يعطيه معنى «المبذِّل لأقصى جهده ونصرته» وهو دلالة
        على الدعم والمساندة لا على المشاركة في تظاهرة. فضلاً عن ذلك،
        المدخل المعجمي صفة (adj) لا اسم فاعل دالّ على شخص؛ ولو استُخدم
        للمتظاهر فإنه يُبرز جانب الحشد الجماعي فحسب دون دلالة الاحتجاج
        أو الإظهار العلني.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ══ مرشح المرحلة ١ — ج ══
    - lemma: "هَاتِف"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ محجوز بالكامل لمعنى «الهاتف = التليفون» في العربية المعاصرة؛
        كل المعاجم التقنية الحديثة وكذا المعجم الوسيط تُثبّته على هذا المعنى
        أو المعنى الكلاسيكي (الصوت بلا صاحب مرئي). استعماله للمتظاهر
        يُصادم المعنى المستقر مصادمةً تجعله غير مقبول.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ══ مرشح المرحلة ١ — د ══
    - lemma: "مُنادٍ"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ يحمل ثقلاً نحوياً راسخاً («المُنادى» في أسلوب النداء) ومعنىً
        اصطلاحياً حديثاً («مُنادٍ» = callboy في الفندق)؛ كلا المعنيين يتعارضان
        مع «المشارك في مظاهرة». لا يُوجد في المعاجم أي شاهد يدعم
        استخدام «مُنادٍ» للدلالة على المتظاهر.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


