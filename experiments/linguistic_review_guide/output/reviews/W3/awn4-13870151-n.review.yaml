# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13870151-n (eleventh)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «الحادي عشر» مكتوبة بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج صياغة معجمية عربية"
      - "المجموعة تحتوي على لمّة واحدة فقط — قد يكون ذلك كافياً لعدد ترتيبي محدد"
    observations: "هذه المجموعة تمثّل العدد الترتيبي الحادي عشر بوصفه مركزاً في سلسلة. الأعداد الترتيبية المركبة في العربية تُبنى بالتركيب المزجي بين حادي (مقلوب واحد) وعشر. لا يوجد مرادف حقيقي لهذا المفهوم في العربية لأنه عدد ترتيبي وحيد الصيغة."
  blind_candidates:
    - lemma: "الْحَادِيَ عَشَرَ"
      generation_method: tarkib
      justification: "العدد الترتيبي المركب للعدد أحد عشر، وهو تركيب مزجي عربي أصيل من (حادي) المقلوب عن (واحد) و(عشر). يُستعمل للدلالة على المركز الحادي عشر في أي سلسلة معدودة."
    - lemma: "حَادِيَ عَشَرَ"
      generation_method: tarkib
      justification: "الصيغة النكرة من العدد الترتيبي الحادي عشر، بدون أل التعريف. تُستعمل في سياق الإضافة أو الحال مثل: جاء حادِيَ عَشَرَ."
    - lemma: "الْحَادِيَةَ عَشْرَةَ"
      generation_method: tarkib
      justification: "الصيغة المؤنثة من العدد الترتيبي المركب، تُستعمل مع المعدود المؤنث مثل: المرتبة الحادية عشرة."
    - lemma: "الْأُحَادِيَّ عَشْرِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى أحد عشر على وزن فُعَالِيّ، تُستعمل في الكيمياء والرياضيات للدلالة على ما يتصل بالعدد أحد عشر. لكنها تدلّ على الصفة لا على الترتيب."

stage2_evidence:
  per_lemma:
    - lemma: "الْحَادِيَ عَشَرَ"
      confirm:
        - text: "«(1) جُزء من أحد عشر (2) الحادي عشر (3) حادي عشر (4) أحَدَ عَشَريّ»"
          source: "المورد الحديث (2008)"
        - text: "«(2) الحادي عشر في مجموعة أو سلسلة»"
          source: "المورد الحديث (2008)"
        - text: "«(2) شيء مُعْتَبرٌ حاديَ عشر من حيث الترتيب أو الطبقة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الْحَادِي) الَّذِي يَسُوق الْإِبِل بالحداء (ج) حداة وحادي النَّجْم الدبران ومقلوب الْوَاحِد»"
          source: "المعجم الوسيط"
          addition: "يوضح أن حادي مقلوب واحد، وله معانٍ أخرى (سائق الإبل، نجم الدبران)"
        - text: "«حادي عشر — undecane (eleven)»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يُستعمل المصطلح أيضاً في الكيمياء بمعنى أُنديكان (الألكان ذو 11 ذرة كربون)"
    - lemma: "حَادِيَ عَشَرَ"
      confirm:
        - text: "«(3) حادي عشر»"
          source: "المورد الحديث (2008)"
        - text: "«(2) شيء مُعْتَبرٌ حاديَ عشر من حيث الترتيب أو الطبقة»"
          source: "المورد الحديث (2008)"
    - lemma: "الْحَادِيَةَ عَشْرَةَ"
      evidence_status: "no_material_found"
    - lemma: "الْأُحَادِيَّ عَشْرِيّ"
      contradicts:
        - text: "«(4) أحَدَ عَشَريّ an eleventh share of the money»"
          source: "المورد الحديث (2008)"
          conflict: "الصيغة المسجلة هي أَحَدَ عَشَرِيّ (نسبة كسرية: جزء من أحد عشر) لا أُحَادِيّ عَشْرِيّ، والدلالة كسرية لا ترتيبية"

stage3_analysis:
  per_lemma:
    - lemma: "الْحَادِيَ عَشَرَ"
      decision: confirmed
      decision_reason: "العدد الترتيبي الفصيح الوحيد للدلالة على المركز الحادي عشر. مؤكَّد في المورد الحديث والمعجم الوسيط. اللمّة الأصلية بدون تشكيل، يجب تحديثها بالتشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: "الصيغة المعرّفة المذكرة من العدد الترتيبي المركب، تُستعمل استعمالاً مطلقاً أو مع معدود مذكر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْحَادِيَ عَشَرَ"
    - lemma: "حَادِيَ عَشَرَ"
      source: stage1
      decision: removed
      decision_reason: "صيغة نكرة من اللمّة الموجودة نفسها (الحادي عشر). في الشبكة الدلالية يكفي المدخل المعرَّف لتمثيل المفهوم، ولا حاجة لتكرار الصيغة النكرة مدخلاً مستقلاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
    - lemma: "الْحَادِيَةَ عَشْرَةَ"
      source: stage1
      decision: removed
      decision_reason: "صيغة مؤنثة من الترتيبي نفسه. يمكن إدراجها صيغةً بديلة (form) للمدخل القائم لا لمّةً مستقلة، لكنها ليست لمّة مرادفة بل تنويع صرفي للجنس."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
    - lemma: "الْأُحَادِيَّ عَشْرِيّ"
      source: stage1
      decision: removed
      decision_reason: "الصيغة المسجلة هي أَحَدَ عَشَرِيّ وتدلّ على الكسر (جزء من أحد عشر) لا على الترتيب. لا تصلح للدلالة على المركز الحادي عشر."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

