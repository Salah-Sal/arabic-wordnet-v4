# مراجعة: awn4-13869321-n — الرابع (fourth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «الرابع» مخزّنة بأل التعريف وبدون تشكيل — الصورة المعجمية المعيارية: رَابِع (نكرة مشكّلة)"
      - "تصنيف المجموعة اسم (n) بينما المعاجم العربية تصنّف «رابع» صفةً (adj)؛ لكن الاستعمال الاسمي مقبول بدلالة الرتبة/المركز"
    observations: "المفهوم بسيط ومباشر: العدد الترتيبي الرابع. في العربية يُعبَّر عنه باسم الفاعل «رَابِع» من الجذر ر ب ع. الأعداد الترتيبية في العربية تأتي على وزن فاعِل للمذكر وفاعِلة للمؤنث من الواحد إلى العاشر. المجموعة الترادفية تضمّ لمّة واحدة فقط، وهذا متوقع لمفهوم عددي ترتيبي لا يقبل كثيراً من المترادفات."
  blind_candidates:
    - lemma: "رَابِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رَبَعَ على وزن فاعِل، وهو الصيغة القياسية للعدد الترتيبي الرابع في العربية"
    - lemma: "رَابِعَة"
      generation_method: ishtiqaq
      justification: "مؤنّث رَابِع، يُستعمل عند الإشارة إلى المرتبة الرابعة للمؤنث (المرتبة الرابعة، الدرجة الرابعة)"
    - lemma: "رُبَاعِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى أربعة على وزن فُعَالِيّ، لكنه يدلّ على ما يتألّف من أربعة لا على الترتيب الرابع"
    - lemma: "الرُّتْبَة الرَّابِعَة"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يعني المكانة الرابعة في التسلسل، لكنه عبارة وصفية حرّة لا مصطلح مسكوك"


stage2_evidence:
  per_lemma:
    - lemma: "الرَّابِع"
      confirm:
        - text: "«(الرَّابِع) الْوَاقِع بعد الثَّالِث فِي الْعدَد مُبَاشرَة وَيُقَال ربيع رَابِع مخصب»"
          source: "المعجم الوسيط (نسخة حوراماني)"
        - text: "«الواقع بعد الثالث في العدد مباشرة ربيعٌ رابع: مُخْصِب»"
          source: "المعجم الوسيط (OCR)"
        - text: "«وَصْفٌ للمَعْدُودِ الواقِع بعد الثَّالثِ فى العَدَدِ مُباشرةً. وهى بتاء رَبيعٌ رابعٌ: مُخْصِبٌ»"
          source: "المعجم الكبير"
      expands:
        - text: "«رابع كِلُورِيد الكَرْبون: سائلٌ عَدِيمُ اللَّونِ غيْرُ قابلٍ للاشْتِعال»"
          source: "المعجم الكبير"
          addition: "استعمال تركيبي في المصطلحات الكيميائية"
        - text: "«الرابعة: عند المنجّمين هي سدس عشر الثالثة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة اصطلاحية فلكية خاصة"
    - lemma: "رَابِع"
      confirm:
        - text: "«(الرَّابِع) الْوَاقِع بعد الثَّالِث فِي الْعدَد مُبَاشرَة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«رابِعُ المُسْتَحِيلاتِ: كِنايةٌ عمَّا لا يكون, وهو تعْبيرٌ يَدُلُّ على اسْتِحالَةِ وقُوعِ الأَمْر»"
          source: "المعجم الكبير"
          addition: "تعبير اصطلاحي مجازي"
    - lemma: "رَابِعَة"
      confirm:
        - text: "«رابعة — fourth»"
          source: "مسرد الفن والتسلية والرياضة (أربتيرم)"
      contradicts:
        - text: "«مِن النَّاس: الذى ليْسَ بطَويلٍ ولا قَصِيرٍ»"
          source: "المعجم الكبير"
          conflict: "معنى مختلف تماماً: الرَّبْعَة من الناس أي المعتدل القامة"
    - lemma: "رُبَاعِيّ"
      contradicts:
        - text: "«الدور الأخير في حقب الحياة الحديثة»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل"
          conflict: "رُباعيّ يدلّ على ما يتكوّن من أربعة عناصر أو ينتمي إلى العصر الرباعي، لا على الترتيب الرابع"
    - lemma: "الرُّتْبَة الرَّابِعَة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "الرَّابِع"
      decision: confirmed
      decision_reason: "لمّة صحيحة لغوياً ومؤيَّدة بشواهد معجمية متعددة من المعجم الوسيط والمعجم الكبير. تحتاج فقط إلى تصحيح صورة اللمّة: إزالة أل التعريف وإضافة التشكيل الكامل"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَابِع"

    - lemma: "رَابِعَة"
      source: stage1
      decision: removed
      decision_reason: "مؤنث رَابِع، وهو صيغة تصريفية لا لمّة مستقلة. في الشبكة الدلالية يكفي إدراج المذكّر رَابِع والتأنيث يُضاف كصيغة (form) إن لزم. كما أن المعجم الكبير يخلط دلالة الرَّبْعة (المعتدل القامة) مع المؤنث"
      evidence_assessment:
        case: mixed

    - lemma: "رُبَاعِيّ"
      source: stage1
      decision: removed
      decision_reason: "رُباعيّ يدلّ على الانتماء إلى مجموعة من أربعة أو التكوّن من أربعة عناصر (quaternary)، ولا يدلّ على الترتيب الرابع (fourth/ordinal). المعنى مختلف اختلافاً جوهرياً"
      evidence_assessment:
        case: contradicts_only

    - lemma: "الرُّتْبَة الرَّابِعَة"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة لا مصطلح مسكوك. تفشل في اختبار السكّ: يمكن إبدال «الرتبة» بـ«المكانة» أو «المنزلة» والمعنى يبقى صحيحاً. ليست وحدة معجمية ثابتة"
      evidence_assessment:
        case: no_material


