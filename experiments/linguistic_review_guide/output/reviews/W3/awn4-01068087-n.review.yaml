            type: usage
      - lemma: "تَأْخِير"
        examples:
          - text: "أدى الازدحام المروري إلى تأخير وصول الموظفين."
            type: usage
      - lemma: "إِمْهَال"
        examples:
          - text: "طلب المدين إمهاله شهراً إضافياً لسداد ما عليه."
