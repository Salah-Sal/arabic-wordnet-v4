stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي حرفي ('فعل التأخير') وغير دقيق بما يكفي لوصف المفهوم بشكل معجمي شامل."
    observations: "المجموعة تدل على فعل أو حالة تأخير أداء عمل أو حدث عن وقته المقرر. اللمات الموجودة دقيقة وتمثل المعنى بدقة، ويمكن إثراء المجموعة بمصطلحات إضافية تدل على الامتداد الزمني."
  blind_candidates:
    - lemma: "إِمْهَال"
      generation_method: ishtiqaq
      justification: "اشتقاق من مَهَلَ، ويفيد إعطاء مزيد من الوقت."
    - lemma: "تَسْوِيف"
      generation_method: ishtiqaq
      justification: "اشتقاق من سوف، ويفيد التأخير وتأجيل الأمر للمستقبل."
    - lemma: "تَعْطِيل"
      generation_method: ishtiqaq
      justification: "يفيد إيقاف العمل وتأخير إنجازه."
    - lemma: "إِبْطَاء"
      generation_method: ishtiqaq
      justification: "اشتقاق من بطء، ويفيد جعل الحدث متأخراً في الزمن."

stage2_evidence:
  per_lemma:
    - lemma: "إرجاء"
      confirm:
        - text: "إلى أجل مسمّى أو غير مسمّى"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
    - lemma: "تأجيل"
      confirm:
        - text: "التأجيل: ضرب الأجَل للشيء وجعله في المؤجَّل"
          source: "التعريفات الفقهيّة للبركتي"
    - lemma: "تأخير"
      confirm:
        - text: "التأخير: إبعاد الفعل عن الآن الكائن."
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "إمهال"
      confirm:
        - text: "من (م ه ل) التأخير والرفق."
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "تسويف"
      confirm:
        - text: "التسويف: المطل والتأخير، وأصله أن يقول لمن وعده بالوفاء «سوف أفعل» مرة بعد."
          source: "التوقيف على مهمات التعاريف للمناوي"
    - lemma: "تعطيل"
      contradicts:
        - text: "تخريب فعالية أو وظيفة أو بنية حيوية بتعريضها لعوامل فيزيائية أوكيميائية وغيرها."
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          conflict: "يفيد الإيقاف أو التخريب أو المنع من العمل وليس مجرد التأجيل لوقت لاحق."
    - lemma: "إبطاء"
      contradicts:
        - text: "slackening; deceleration"
          source: "المعجم الموحد لمصطلحات علم الصحة"
          conflict: "يفيد البطء في الحركة أو الأداء ولا يعني بالضرورة تأجيل الحدث بأكمله."

stage3_analysis:
  per_lemma:
    - lemma: "إِرْجَاء"
      decision: confirmed
      decision_reason: "كلمة فصيحة تعبر بدقة عن تأجيل الأمر وتأخيره."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِرْجَاء"
    - lemma: "تَأْجِيل"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع يدل على ضرب أجل لاحق للعمل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَأْجِيل"
    - lemma: "تَأْخِير"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن المفهوم العام لإبعاد الفعل عن وقته."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَأْخِير"
    - lemma: "إِمْهَال"
      source: stage1
      decision: confirmed
      decision_reason: "يضيف فروقاً دقيقة تفيد التأخير المقرون بإعطاء مهلة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "إِمْهَال", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-01068087-n"}
    - lemma: "تَسْوِيف"
      source: stage1
      decision: confirmed
      decision_reason: "يدل على التأخير والمماطلة وتأجيل العمل وهو وثيق الصلة بالمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَسْوِيف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-01068087-n"}
    - lemma: "تَعْطِيل"
      source: stage1
      decision: removed
      decision_reason: "يدل على الإيقاف والمنع أكثر من كونه تأجيلاً وتأخيراً لوقت محدد."
      evidence_assessment:
        case: contradicts_only
    - lemma: "إِبْطَاء"
      source: stage1
      decision: removed
      decision_reason: "يدل على قلة السرعة في الإنجاز وليس تأجيل الفعل عن وقته."
      evidence_assessment:
        case: contradicts_only

