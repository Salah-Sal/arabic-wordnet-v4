      reason: "التعريف الحالي يتضمن ترجمة حرفية 'فعل التأخير' ويحتاج لصياغة معجمية عربية أدق."
    authored:
      - type: linguistic
        text: "إبعاد وقت أداء الفعل أو حدوث الأمر عن وقته المحدد أو المتوقع إلى وقت لاحق."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-01068087-n", definition_index: 0, text: "إبعاد وقت أداء الفعل أو حدوث الأمر عن وقته المحدد أو المتوقع إلى وقت لاحق."}
