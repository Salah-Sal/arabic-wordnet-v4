# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14031235-n
# Frankenstein — قوة أو كيان يخرج عن السيطرة ويدمر خالقه
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «فرانكنشتاين» هي تعريب لاسم علم أجنبي من الأدب الغربي، ولا يوجد بديل عربي أصيل"
      - "اللمّة بلا تشكيل"
      - "المفهوم مستعار من الثقافة الغربية (رواية ماري شيلي ١٨١٨) وليس له مقابل عربي تراثي مباشر"
    observations: "المجموعة تمثّل مفهوماً مجازياً مستعاراً من الأدب الغربي: القوة أو الكيان الذي يصنعه المرء فيخرج عن سيطرته ويعود عليه بالدمار. في التراث العربي توجد مفاهيم قريبة — كمارد الجنّ الذي يتمرّد، والوبال بمعنى سوء العاقبة — لكنّها لا تحمل الدلالة المركّبة نفسها (صانع + مصنوع يدمّر صانعه). المصطلح «فرانكنشتاين» انتشر في الإعلام العربي المعاصر بهذه الدلالة المجازية."

  blind_candidates:
    - lemma: "مَارِد"
      generation_method: majaz
      justification: "المارد في التراث العربي هو الجنّي العاتي المتمرّد الذي يخرج عن السيطرة، وهو أقرب مفهوم عربي للكيان الخارق الذي يتمرّد على من أوجده"
    - lemma: "وَبَال"
      generation_method: ishtiqaq
      justification: "من الجذر «وبل» الدالّ على الشدّة وسوء العاقبة، والوبال ما يعود على صاحبه بالشرّ والدمار، فيصلح مجازاً للكيان الذي يدمّر خالقه"
    - lemma: "صَنِيعَة مَارِدَة"
      generation_method: tarkib
      justification: "مركّب وصفي يجمع بين الصنيعة (المخلوق/المصنوع) والمارد (المتمرّد)، ليدلّ على المصنوع الذي يتمرّد ويدمّر صانعه"
    - lemma: "فِرَنْكِنْشتَايْن"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الأجنبي الذي أصبح رمزاً عالمياً لهذا المفهوم، مع ضبطه بالتشكيل الكامل"

stage2_evidence:
  per_lemma:
    - lemma: "فرانكنشتاين"
      confirm:
        - text: "«فرانكِنْشتاين: «أ» بطل رواية يُلِمّ به الخراب على يد مارد خَلَقَهُ هو بنفسه. «ب» عملٌ أو وسيلة يسبِّبان هلاكَ مبدعهما. «ج» ماردٌ في صورة إنسان.»"
          source: "المورد الحديث (2008)"
    - lemma: "مَارِد"
      expands:
        - text: "«(المارد) الطاغية والعملاق وفي التنزيل العزيز {وحفظاً من كل شيطان مارد} والذي يجيء ويذهب نشاطاً والمرتفع»"
          source: "المعجم الوسيط"
          addition: "المارد يدلّ على العاتي المتمرّد لكنّه لا يتضمّن دلالة تدمير الخالق تحديداً"
        - text: "«المارد: العاتي، وكذا المريد، كأنّه تجرّد من الخير»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على التجرّد والتعرّي، والمارد منه لتجرّده من الخير"
      contradicts:
        - text: "«المارد: الطاغية العملاق الذي يجيء ويذهب نشاطاً المرتفع»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المارد عامّ الدلالة على التمرّد والعتوّ، لا يختصّ بمعنى الكيان الذي يدمّر صانعه"
    - lemma: "وَبَال"
      expands:
        - text: "«(الوبال) الفساد والشدة والثقل وسوء العاقبة وفي التنزيل العزيز {فذاقت وبال أمرها}»"
          source: "المعجم الوسيط"
          addition: "الوبال يدلّ على العاقبة السيّئة لا على الكيان الفاعل نفسه"
      contradicts:
        - text: "«الوبال: الفساد الشدّة الثقل سوء العاقبة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "الوبال اسم للعاقبة السيّئة المجرّدة وليس لكيان فاعل يخرج عن السيطرة"
    - lemma: "صَنِيعَة مَارِدَة"
      contradicts:
        - text: "«(الصنيعة) كل ما عمل من خير أو إحسان»"
          source: "المعجم الوسيط"
          conflict: "الصنيعة في المعاجم العربية تختصّ بالإحسان والمعروف لا بالمخلوق أو المصنوع عموماً"
        - text: "«الصنيعة: ما اصطنعته من خير»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر «صنع» في مقاييس اللغة أصل واحد هو عمل الشيء، والصنيعة منه بمعنى الإحسان لا المخلوق"
    - lemma: "فِرَنْكِنْشتَايْن"
      confirm:
        - text: "«فرانكِنْشتاين: «أ» بطل رواية يُلِمّ به الخراب على يد مارد خَلَقَهُ هو بنفسه. «ب» عملٌ أو وسيلة يسبِّبان هلاكَ مبدعهما. «ج» ماردٌ في صورة إنسان.»"
          source: "المورد الحديث (2008)"

