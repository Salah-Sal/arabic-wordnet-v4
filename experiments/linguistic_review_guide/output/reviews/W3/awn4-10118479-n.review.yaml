stage3_analysis:
  per_lemma:
    - lemma: "خصم"
      decision: confirmed
      decision_reason: >
        لمّة «خصم» راسخة في المعاجم بمعنى المنازع والمخاصم، وقد استُخدمت
        في الترجمات الحديثة بمعنى «عدو» أيضاً. غير أن دلالتها الأصيلة تتمحور
        حول الخصومة القانونية والجدال أكثر من العداوة الشخصية العاطفية. تُبقى
        في المجموعة مع توثيق الفارق الدلالي، لكن يجب إضافة التشكيل الكامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «خَصْم» يُركّز على العداوة المنبثقة من التنازع والخلاف في المصالح أو
        الحقوق؛ فهو الخصم القانوني أو الطرف المعارض في نزاع. يختلف عن «عَدُوّ»
        الذي يدل على العداوة الشاملة، وعن «شَانِئ» الذي يدل على العداوة القائمة
        على البغض الذاتي العميق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَصْم"

    - lemma: "عدو"
