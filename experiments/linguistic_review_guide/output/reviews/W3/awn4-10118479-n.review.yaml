        المعاجم (كتاب العين، القاموس، لسان العرب) بمعنى «ذو العداوة» و«ضد
        الصديق». وإن كانت عامة تشمل كل أنواع العداء، فإنها ركيزة المجموعة.
        يجب إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «عَدُوّ» الكلمة الأشمل والأعمّ: تدل على ذي العداوة مطلقاً سواء كانت
        شخصية أو سياسية أو دينية. تختلف عن «خَصْم» الذي يُركّز على التنازع
        الرسمي، وعن «شَانِئ» الذي ينصبّ على البغض الشخصي العميق.
      actions:
