stage1_review:
  assessment:
    concerns:
      - "اللمّة «خصم» موجودة في هذه المجموعة وفي المجموعة الأم (awn4-10552570-n: خصم/غريم/منافس) في آنٍ واحد، مما يُشير إلى اضطراب في التمييز الدلالي بين المستويين الهرمييَّن."
      - "التعريف «عدو شخصي» يستخدم كلمة «عدو» وهي لمّة في المجموعة ذاتها — هذا تعريف دائري يعتمد المُعرَّف في تعريفه."
      - "كلمة «عدو» عامة شاملة لكل أنواع العداء (شخصي، قومي، ديني)، ولا تتخصص في العداء الشخصي وحده."
      - "الإخلال بمبدأ عدم الترادف المطلق: لم يُفرَّق بين «خصم» و«عدو» في الضبط اللغوي، ودلالتاهما متداخلتان لكنهما ليستا متطابقتين."
      - "اللمّتان الموجودتان مجردتان من التشكيل."
    observations: >
      تمثّل هذه المجموعة مفهوم «العدو الشخصي» في مقابل العداوة العامة أو التنافسية.
      ثمة ثراء معجمي في العربية الكلاسيكية لهذا المفهوم، أبرزه الجذر «شنأ» الدال على
      البغض الشخصي المتجذر في النفس، وقد جاء في القرآن الكريم ﴿إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ﴾.
      يحتاج التعريف إلى صياغة أكثر دقة لتجنب الدوران. كما ينبغي النظر في إضافة «شانئ»
      التي تُعبّر تحديداً عن العداوة الشخصية النابعة من البغض الذاتي.
  blind_candidates:
    - lemma: "شَانِئ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن فاعل من جذر «شنأ» بمعنى البغض الشخصي العميق.
        ورد في القرآن الكريم بهذا المعنى بدقة: ﴿إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ﴾،
        فالشانئ هو من يُبغضك شخصياً — وهو أدق تعبير عربي عن «العدو الشخصي».
    - lemma: "خَصِيم"
      generation_method: ishtiqaq
      justification: >
        وزن فعيل للمبالغة من جذر «خصم»، يفيد الملازمة في الخصومة. قد يُؤدي
        دلالة العدو الشخصي الذي يلازم المخاصمة، مع مراعاة احتمال أن يكون
        أقرب إلى الخصومة القانونية.
    - lemma: "بَاغٍ"
      generation_method: majaz
      justification: >
        من جذر «بغي»، اسم فاعل يدل على المعتدي الظالم، واستُخدم في
        العربية للدلالة على من يُبغي على الآخر بالعداء. قد يُؤدي دلالة
        العدو الشخصي المتعمّد بالأذى.
    - lemma: "نَاصِب"
      generation_method: majaz
      justification: >
        من «نَصَبَ العداوةَ» أي أظهرها وأعلنها، فالناصب هو من يُبادي بعداوته
        الشخصية ولا يُخفيها. ورد في كلام العرب «ناصبه العداء» بمعنى أعلن
        له العداء صراحةً.


