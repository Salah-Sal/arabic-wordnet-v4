    observations: "المجموعة تعبّر عن مفهوم الموقع النسبي ضمن تدرُّج مُرتَّب، وهو مفهوم أصيل في العربية، تعبّر عنه ألفاظ متعددة بفروق دقيقة: الدرجة تستحضر الصعود والتفاوت الرأسي، والطبقة تستحضر التراكب والتصنيف الأفقي، والمستوى يستحضر الاستواء والاعتدال على سطح واحد. اللمّات الثلاث مناسبة للمفهوم لكنها ليست مترادفة ترادفاً تامّاً."

  blind_candidates:
