      generation_method: ishtiqaq
      justification: "من الجذر د-ر-ج الدالّ على المُضِيّ والارتقاء، على وزن فَعَلَة، تدلّ على المرقاة والمنزلة في سلّم التفاوت"
    - lemma: "مُسْتَوًى"
      generation_method: ishtiqaq
      justification: "من الجذر س-و-ي الدالّ على الاستقامة والاعتدال، اسم مكان من استوى، يدلّ على المكانة التي يكون عليها الشيء"
    - lemma: "طَبَقَة"
      generation_method: ishtiqaq
      justification: "من الجذر ط-ب-ق الدالّ على وضع شيء مبسوط على مثله، تدلّ على المرتبة والشريحة ضمن تصنيف مُدرَّج"
    - lemma: "مَرْتَبَة"
