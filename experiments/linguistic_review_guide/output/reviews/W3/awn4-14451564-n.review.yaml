      justification: "من الجذر ر-ت-ب الدالّ على الثبات والدوام، على وزن مَفْعَلَة، تدلّ على المنزلة والمكانة في ترتيب هرمي"


stage2_evidence:
  per_lemma:
    - lemma: "دَرَجَة"
      confirm:
        - text: "«المِرْقاة الرُّتْبَةُ له عليه دَرَجة: منزلة ورتبة فى الشرف (فى علم الفلك): جزء من ثلثمائة وستين جزءاً من دورة الفلك (فى الرياضة): قسم من التسعين قسماً المتساوية, التى تنقسم إليها الزاوية القائمة. (مج) درجةُ الحرارة أو الرطوبة: جزء من أجزاء المقياس الخاص بهما. (مج)»"
          source: "المعجم الوسيط"
        - text: "«الْمَنْزِلَةُ والمرْتَبَةُ فى الشَّرَفِ الرِّفْعَةُ في الْمَنْزِلَةِ (فى السُّلَّم الوظيفيّ): مَرْتَبةٌ فيه تُمَثِّلُ مُستوًى ما (فى عِلْم الفَلَك): جُزْءٌ من ثلاث مِئَةٍ وسِتِّينَ جُزْءا من دَوْرَة الفَلَك»"
          source: "المعجم الكبير"
        - text: "«الدرجة: محركة نحو المنزلة لكن يقال للمنزلة درجة إذا اعتبرت بالصعود دون الامتداد على البسيطة كدرجة السطح والسلم، ويعبر بها عن المنزلة الرفيعة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«الدّرجة:[في الانكليزية] Rank ،degree ،step... بفتح الدال والراء المهملتين في اللغة پايه ومرتبه... وعند أهل الهيئة تطلق على جزء من ثلاثمائة وستين جزءا من أجزاء منطقة الفلك الثامن»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تفصيل الاستعمال الاصطلاحي في الفلك والطبّ"

    - lemma: "طَبَقَة"
      confirm:
        - text: "«الجيل بعد الجيل, أو القوم المتشابهون في سن أو عهد الحال والمنزلة المرتبة والدرجة الواحدة من فَقار الظهر»"
          source: "المعجم الوسيط"
        - text: "«الْمَرْتَبَةُ والدَّرَجَةُ. من الأرض ونحوها: الشَّريحةُ. الجيلُ بعدَ الجيلِ, أو القومُ المتشابهون في سِنٍّ أو عَهْدٍ»"
          source: "المعجم الكبير"
      expands:
        - text: "«الطّبقة: بالفتح وسكون الموحدة لغة القوم المتشابهون. وفي اصطلاح المحدّثين عبارة عن جماعة اشتركوا في السّنّ ولقاء المشايخ والأخذ عنهم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التخصيص الاصطلاحي عند المحدّثين"
        - text: "«طَبَقة: من (ط ب ق) جماعة من الناس على مستوى واحد في العلم أو الحرفة أو الصناعة والمرتبة والدرجة والحال والمنزلة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "ربط الطبقة بالتصنيف المهني والعلمي"

    - lemma: "مُسْتَوًى"
      confirm:
        - text: "«الدَّرَجة أو المكانة التى يكون عليها الشىءُ أو الشخصُ.»"
          source: "المعجم الكبير"
        - text: "«مُسْتَوَى: مثال: مستوى ذكاء الطفل... الصواب والرتبة: مستوى ذكاء الطفل [صحيحة]. التعليق: تشيع كلمة «مستوى» في لغة العصر الحديث بمعنى الدرجة والمكانة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«يرادف لفظ 'مستوى' عند البنيويين لفظ 'مرتبة'، فهناك المستوى الجملي والمستوى الصرفي والمستوى الصوتي، وهذا يدل على أن اللغة بنية مؤلفة من الوحدات»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "الاستعمال الاصطلاحي الحديث في اللسانيات بمعنى المرتبة"

    - lemma: "مَرْتَبَة"
      confirm:
        - text: "«الرُّتْبَة المَرْقَبَة كلُّ مقام شديد العبادات الشاقة (في علم الحساب): الموضع الذى يكون العدد المطلق فيها ذا قيمة خاصة بِحَسَبِها»"
          source: "المعجم الوسيط"
        - text: "«الرُّتْبَةُ, وهى المَنْزِلة والمكانة. المَرْقَبَةُ. قال الخَلِيلُ: المَراتِبُ فى الجبال والصَّحارى: هي الأعلامُ التى تُرَتَّبُ فيها العُيونُ والرُّقباءُ. كلُّ مَقامٍ شَدِيد.»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«رتبة» موجودة في المجموعة الأعمّ (awn4-14453411-n) بوصفها فرعاً من المكانة النسبية"
          source: "الشبكة الدلالية العربية"
          conflict: "إضافة مَرْتَبَة هنا تُكرّر جذر ر-ت-ب الموجود أصلاً في الأعمّ (رتبة)"


