stage1_review:
  assessment:
    concerns:
      - "استخدام مصطلح 'كود جيني' الدخيل بالكامل (كود من code وجين من gene) بالرغم من وجود مصطلح عربي أصيل ومشهور وهو 'شفرة وراثية'."
      - "عدم وجود تشكيل للمصطلحات الموجودة في قاعدة البيانات."
    observations: "المجموعة الدلالية تعبر عن المفهوم العلمي 'genetic code'. 'شفرة وراثية' هو المصطلح الأكثر دقة وشيوعاً واستقراراً في المعاجم العلمية المتخصصة. والمصطلحات الأخرى هي إما تعريب مباشر أو مزيج بين التعريب والترجمة."
  blind_candidates:
    - lemma: "رَامُوز جِينِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعتمد على مصطلح 'راموز' بدلاً من كود أو شفرة، وهو متداول في المعجم الطبي الموحد كترجمة معتمدة."
    - lemma: "كُود وِرَاثِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين التعريب الشائع 'كود' والمصطلح العربي الأصيل 'وراثي'."
    - lemma: "شَفْرَة جِينِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي مستخدم في بعض الأدبيات العلمية يجمع بين 'شفرة' والنسبة إلى المصطلح المعرب 'جين'."
    - lemma: "رَمْز وِرَاثِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي عربي خالص يستخدم 'رمز' كبديل شائع لكلمة 'شفرة'."

stage2_evidence:
