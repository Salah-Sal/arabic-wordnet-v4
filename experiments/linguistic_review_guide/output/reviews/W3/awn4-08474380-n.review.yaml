          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«مجموعة العلاقات بين ترتيب النكليوتيدات في الدنا ومتوالية الأحماض الأمينية في البروتين.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
