    - lemma: "رَامُوز جِينِيّ"
      confirm:
        - text: "«الرَّاموزُ الجينِيّ (genetic code)»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "كُود وِرَاثِيّ"
      confirm:
        - text: "«كود وراثي (genetic code)»"
          source: "المَكنَز الزراعي متعدد اللغات"
    - lemma: "شَفْرَة جِينِيَّة"
      evidence_status: "no_material_found"
    - lemma: "رَمْز وِرَاثِيّ"
      evidence_status: "no_material_found"

