# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14449119-n
# womanhood / muliebrity — حالة كونها امرأة بالغة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «أنوثة» بلا تشكيل، وتحتاج ضبطاً صرفياً كاملاً"
      - "التعريف العربي «حالة كونها امرأة بالغة» ترجمة حرفية للإنجليزية وفيه ضمير مبهم (كونها)؛ يحتاج صياغة معجمية أصيلة"
      - "المجموعة تحتوي لمّة واحدة فقط — قد تحتاج إثراء بمرادفات"
      - "الفرق بين الأنوثة (femininity) والأنوثة بمعنى حالة بلوغ المرأة (womanhood) يحتاج توضيحاً"
    observations: >
      المجموعة تعبّر عن مفهوم حالة بلوغ المرأة سنّ الرشد، وهو مقابل المفهوم الإنجليزي womanhood.
      اللمّة «أنوثة» مصدر سماعي من الجذر «أنث» على وزن فُعُولَة، وهو مصدر واسع الدلالة
      يشمل الأنوثة بمعناها البيولوجي والاجتماعي. التعريف الإنجليزي يركّز على حالة البلوغ
      الأنثوي بوصفها مرحلة نضج، والتعريف العربي الحالي ترجمة مباشرة تحتاج تحسيناً.
      المجموعة فرع من «بلوغ / سن الرشد» مما يؤكد البُعد العمري لا الجنسي فحسب.

  blind_candidates:
    - lemma: "أُنُوثَة"
      generation_method: ishtiqaq
      justification: >
        مصدر سماعي من الجذر «أنث» على وزن فُعُولَة، يدلّ على حالة كون الكائن أنثى.
        الوزن يناسب الدلالة على الحالة الثابتة (كالرُّجُولَة والفُحُولَة)، وهو أقرب ما يكون
        للمفهوم المطلوب.
    - lemma: "نِسَائِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «نساء» بإضافة ياء النسبة وتاء المصدرية، يدلّ على صفة الانتساب
        إلى النساء وحالة كون الشخص من جنس النساء البالغات.
    - lemma: "تَأَنُّث"
      generation_method: ishtiqaq
      justification: >
        مصدر الفعل «تأنّثَ» على وزن تَفَعُّل من الجذر «أنث»، يدلّ على التحوّل إلى
        الحالة الأنثوية أو اكتساب صفات الأنوثة.
    - lemma: "نِسْوِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «نسوة» (جمع امرأة)، يدلّ على الصفة النسوية وخصائص المرأة.
        ورد في المورد الحديث مقابلاً لـ womanhood.

stage2_evidence:
  per_lemma:
    - lemma: "أُنُوثَة"
      confirm:
        - text: "«أَنَثَ أنوثةً, وأناثةً: لان, فهو أنيث»"
          source: "المعجم الوسيط"
        - text: "«امرأةٌ أُنْثَى: كاملة الأنوثة»"
          source: "المعجم الوسيط"
        - text: "«الأُنوثَة = muliebrity»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«التحلي بالخصائص الأنثوية الطبيعية عند المرأة = feminity»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«(2) الأُنوثة: خصائص المرأة المميِّزة = womanhood»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«امتلاك سمات الأنثى في التعبير = femininity»"
          source: "مسرد الإعلام والتواصل (أليكسو)"
          addition: "يوسّع الدلالة لتشمل التعبير والسلوك لا البيولوجيا فحسب"
        - text: "«(1) أنوثة (2) تَخنُّث (3) الجنس اللطيف = femininity»"
          source: "المورد الحديث (2008)"
          addition: "يربط الأنوثة بمفاهيم التخنّث والجنس اللطيف كمترادفات إنجليزية"

    - lemma: "نِسَائِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَأَنُّث"
      contradicts:
        - text: "«(تأنث) مُطَاوع أنثه ولان وَلم يتشدد يُقَال تأنث لَهُ فِي الْأَمر وتشبه بِالْأُنْثَى»"
          source: "المعجم الوسيط (حوراماني)"
          conflict: "التأنّث يدلّ على التشبّه بالأنثى والتكلّف لا على حالة طبيعية"
        - text: "«الرجلُ: تَخَنَّث وتشبه بالمرأة في أمره: لان ولم يتشدد»"
          source: "المعجم الكبير"
          conflict: "التأنّث يخصّ الرجل المتشبّه بالمرأة وليس حالة المرأة البالغة"
        - text: "«تأنّث = effemination»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (أليكسو)"
          conflict: "المقابل الإنجليزي effemination يؤكد دلالة التخنّث لا الأنوثة الطبيعية"
        - text: "«تأنث = feminization»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
          conflict: "التأنيث الطبي (feminization) يختلف عن womanhood"

    - lemma: "نِسْوِيَّة"
      confirm:
        - text: "«(1) النِّسْوِيّة؛ الصِّفة النِّسْوِيّة = womanhood»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«حركة ترتبط بالجنس الآخر لسيمون دوبوفوار وتحرّر المرأة (في القرن20) = feminism»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "النسوية في الاستعمال المعاصر مرتبطة بالحركة النسوية (feminism) لا بحالة المرأة البالغة"

stage3_analysis:
  per_lemma:
    - lemma: "أُنُوثَة"
      decision: confirmed
      decision_reason: >
        اللمّة مثبتة في المعاجم الكلاسيكية والحديثة كمصدر سماعي من «أنث» على وزن فُعُولَة.
        المعجم الطبي الموحد يعادلها بـ muliebrity، والمورد الحديث يعادلها بـ womanhood.
        المعجم الوسيط يثبتها صراحةً: «أَنَثَ أنوثةً». الأدلة متسقة ومتعددة المصادر.
        تحتاج ضبطاً بالتشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الأصيل الجامع لحالة الأنوثة بوصفها صفة طبيعية ثابتة، يشمل البُعدين البيولوجي والاجتماعي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُنُوثَة"

    - lemma: "نِسَائِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تثبت «نسائية» بمعنى حالة كون الشخص امرأة بالغة.
        المصدر الصناعي من «نساء» غير مسكوك بهذه الدلالة في المعاجم المعتمدة.

    - lemma: "تَأَنُّث"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية متفقة على أن «التأنّث» يدلّ على تشبّه الرجل بالمرأة (effemination/feminization)،
        وهو مفهوم مختلف جذرياً عن حالة كون الشخص امرأة بالغة (womanhood).
        لا يصلح مرادفاً للمجموعة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "نِسْوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورودها في المورد الحديث مقابلاً لـ womanhood، فإن الاستعمال المعاصر السائد
        يربط «النسوية» بالحركة الاجتماعية (feminism) ربطاً وثيقاً، مما يُحدث لبساً دلالياً
        يُعيق التواصل. الاشتراك اللفظي مع المصطلح السياسي يجعلها غير صالحة.
      evidence_assessment:
        case: mixed

