# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10484814-n  |  ILI: i92203
# Pre-Raphaelite (n) — رسام أو كاتب مكرّس لاستعادة مُثُل عصر النهضة المبكر
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:

  # أ. المرشحات العمياء — توليد بلا اطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "نَهْضَوِيّ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ن-هـ-ض) على وزن فَعْلَوِيّ ثم النسبة، يدل على الانتساب إلى
        حركة النهضة والانحياز لمبادئها. اسم منسوب يصلح للدلالة على الشخص المتحمّس
        لإحياء مُثُل عصر النهضة المبكر.

    - lemma: "إِحْيَائِيّ"
      generation_method: ishtiqaq
      justification: >
        من مصدر إِحْيَاء (أحيا يُحيي) على وزن إِفْعَالِيّ، يعني الشخص المعنيَّ بإحياء
        التراث أو الأنماط الفنية القديمة. يناسب وصف كاتب أو رسام مكرَّس لاستعادة أساليب
        سابقة.

    - lemma: "مُحْيِي التُّرَاثِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي (مُحْيٍ + التراث): اسم الفاعل من أحيا مضاف إلى المفعول. شائع في
        الخطاب الثقافي العربي للدلالة على من يبعث الأنماط والقيم الفنية القديمة من جديد.
        يعكس فعل "استعادة" الوارد في التعريف.

    - lemma: "مُجَدِّد"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من جَدَّد (جذر ج-د-د) على وزن مُفَعِّل، يدلّ على من يُعيد إلى الوجود
        شيئاً قديماً ويُجريه بصورة محدَّثة. يناسب الرسام أو الكاتب الذي يسعى لاستعادة
        أسلوب فني أو أدبي سابق.

  # ب. التقييم الأولي بعد الاطلاع على synset_info الكاملة
  assessment:
    concerns:
      - >
        اللمة الموجودة "ما قبل الرفائيلية" تصف المذهب/الحركة الفنية (Pre-Raphaelitism)
        لا الشخص المنتسب إليها (Pre-Raphaelite). التعريف يصف شخصاً (رسام أو كاتب)،
        فيما تنتهي اللمة بـ"ية" الدالة على المذهب المجرد لا على الفاعل.
      - >
        اللمة خالية من التشكيل كلياً، مما يجعل قراءتها وبحثها في السياقات المعجمية
        مبهمَين.
      - >
        تركيب "ما قبل" البادئ للمة غير مألوف صرفياً لتسمية الشخص؛ إذ تُستخدم عادةً
        للدلالة على المرحلة الزمنية أو المذهب لا على الفرد.
    observations: >
      المجموعة الترادفية تُعرِّف بشخص (فنان أو أديب) لا بحركة. المصطلح العربي الملائم
      لهذا المفهوم هو "قَبْلَ-رَافَائِيلِيّ" أو "رَافَائِيلِيٌّ مُبَكِّر"، وهو اسم
      منسوب يُطبَّق على الفرد المنتسب للأخوية الرافائيلية المبكّرة (Brotherhood).
      اللمة الحالية تُلتبَس بمصطلح الحركة ذاتها (Pre-Raphaelitism) وهو مغاير للمجموعة.
      لم يُعثر على أي مقابل في قاعدة البيانات لا للمة الحالية ولا للمرشحات، مما يؤكد
      أن المصطلح غائب عن المعجمية العربية المُقنَّنة ويستوجب إنشاء مدخل جديد.


