# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمة الموجودة ──
    - lemma: "ما قبل الرفائيلية"
      decision: removed
      decision_reason: >
        اللمة تُسمّي المذهب أو الحركة الفنية (Pre-Raphaelitism) لا الشخص المنتسب إليها
        (Pre-Raphaelite). دليل ذلك: (أ) تاؤها المربوطة في "الرفائيلية" هي علامة المصدر
        الصناعي الدال على الفكرة المجردة لا على الفاعل، (ب) التعريف يصف بوضوح شخصاً
        "رسام أو كاتب"، (ج) التركيب "ما قبل…" أقرب إلى تسمية الحقبة/المذهب منه إلى
        الدلالة على الفرد. يُضاف إلى ذلك غياب التشكيل وانعدام وجودها في المعاجم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَهْضَوِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح عام جداً: يشمل كل من انتسب إلى فكر النهضة أو اشتغل بها، دون أن يُحيل
        تحديداً إلى الأخوية الرافائيلية المبكّرة. فضلاً عن ذلك، لا يُوظَّف عادةً كاسم
        للشخص بل كصفة وصفية ("منهج نهضوي"، "فكر نهضوي").
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "إِحْيَائِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح فضفاض يصف أي شخص معنيٍّ بإحياء الموروث سواء أكان فنياً أم دينياً أم
        تراثياً. لا يُميّز "ما قبل الرفائيليين" عن غيرهم من الحركات الإحيائية. كما أنه
        يُستخدم في الغالب صفةً لا اسم شخص.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُحْيِي التُّرَاثِ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: يمكن إبدال "التراث" بـ"الفن" أو "السنّة" أو
        "الكلاسيكية" ويبقى التعبير صالحاً كوصف — وهذا يكشف أنه عبارة وصفية حرة لا
        مصطلح مسكوك. لا يُحيل بدقة إلى الحركة الرافائيلية المبكّرة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُجَدِّد"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح عام: يصف كل من يجدّد في مجال ما، وهو مستخدم في الخطاب الديني والسياسي
        والأدبي بأوسع من دلالة "Pre-Raphaelite". لا يختص بالحركة الرافائيلية ولا يحمل
        دلالة الاستعادة التاريخية الدقيقة المطلوبة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشح مُولَّد بعد التحليل — المصطلح المناسب للمجموعة ──
    # بعد نفاد إمكانيات المجاز والاشتقاق والتركيب، يُلجأ إلى التعريب
    # لأن المفهوم مرتبط باسم علم أجنبي (رافائيل) لا يمكن اشتقاقه
    - lemma: "قَبْلَ-رَافَائِيلِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        التعريب هو الحل الوحيد الملائم هنا لأن المفهوم مرتبط ارتباطاً جوهرياً باسم
        العَلَم الأجنبي رافائيل (Raphael). يُعرَّب بضم بادئة "قَبْل-" إلى الاسم
        المُعرَّب "رَافَائِيل" مع لاحقة النسبة "-يّ"، مما ينتج اسماً منسوباً يدلّ
        على الشخص المنتسب للحركة (Pre-Raphaelite person). يقبل التصريف الكامل:
        التعريف (القبل-رافائيلي)، والنسبة المزدوجة، وجمع المذكر السالم
        (قبل-رافائيليون)، وجمع المؤنث السالم (قبل-رافائيليات). ويتميز عن اللمة
        المحذوفة "ما قبل الرفائيلية" بكونه اسماً للشخص لا للمذهب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      borrowing_check:
        loan_type: "معرَّب (تعريب مقبول)"
        accepts_article: true
        accepts_nisba: true
        accepts_plural: true
      term_quality_gate:
        consistency: "مطّرد — يقاس عليه سائر أسماء الحركات الفنية المعرَّبة"
        currency: "يُتَداول في النقد الفني العربي المعاصر"
        fitness: "ملائم — يخصص الشخص بالانتساب للحركة"
        classical_preference: "لا مرادف تراثي — المفهوم مستحدث"
        arabic_preference: "لا جذر عربي يفي بالغرض"
        derivability: "يقبل الاشتقاق الصرفي الكامل"
      nuance_differentiation: >
        اللمة الوحيدة المؤكدة في المجموعة — لا مقارنة مطلوبة مع أخوات. تتميز عن
        "ما قبل الرفائيلية" بكونها مصطلح الشخص لا مصطلح المذهب.
      actions:
        - command: create_entry
          params:
            lemma: "قَبْلَ-رَافَائِيلِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10484814-n"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "رسام أو كاتب مكرس لاستعادة مُثُل عصر النهضة المبكر"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي، يفتقر إلى: (أ) الإحالة إلى
        الحركة الفنية التاريخية المحددة (الأخوية الرافائيلية المبكّرة، 1848)،
        (ب) ذكر الصلة باسم رافائيل كمرجعية زمنية للحد الفاصل في الأسلوب،
        (ج) توظيف أسلوب المعجم الوسيط (جنس قريب + فصل نوعي).
        "مكرس" ليست المقابل الأدق بالعربية؛ فالمعتاد "مُعنِيٌّ بـ" أو "منصرف إلى".

    authored:
      - type: terminological
        text: >
          فنانٌ تشكيليّ أو أديبٌ ينتمي إلى حركة ما قبل الرافائيليين، يُعنى باستعادة
          الأساليب الجمالية والمُثُل الفنية السائدة في أوروبا قبل رسّامِ عصر النهضة
          رافائيل الصنزيو (ت1520م).
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false

      - type: encyclopedic
        text: >
          فنانٌ أو أديبٌ من أعضاء الأخوية الرافائيلية المبكّرة، وهي حركة بريطانية
          أسّسها كلٌّ من روسيتي وهولمان هنت وميليه عام 1848م، تتّخذ من أعمال رسّامي
          القرون الوسطى وعصر النهضة المبكر (قبل رافائيل) نموذجاً في الدقة التصويرية
          والرمزية وعمق المضامين الأدبية والدينية.

    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10484814-n"
          definition_index: 0
          text: >
            فنانٌ تشكيليّ أو أديبٌ ينتمي إلى حركة ما قبل الرافائيليين، يُعنى باستعادة
            الأساليب الجمالية والمُثُل الفنية السائدة في أوروبا قبل رسّامِ عصر النهضة
            رافائيل الصنزيو (ت1520م).
      - command: add_definition
        params:
          synset_id: "awn4-10484814-n"
          text: >
            فنانٌ أو أديبٌ من أعضاء الأخوية الرافائيلية المبكّرة، وهي حركة بريطانية
            أسّسها كلٌّ من روسيتي وهولمان هنت وميليه عام 1848م، تتّخذ من أعمال رسّامي
            القرون الوسطى وعصر النهضة المبكر (قبل رافائيل) نموذجاً في الدقة التصويرية
