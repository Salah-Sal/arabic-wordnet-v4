              الإتقان التصويري وعمق الرمزية الشعرية المستلهمة من أدب القرون الوسطى.
            type: usage
          - text: >
              عُرِض في المتحف بمعرض خاص يضمّ أعمال عدد من القَبْلَ-رَافَائِيلِيِّين
              البريطانيين، تتجلّى فيها عودتهم الواعية إلى أساليب النهضة المبكرة.
