stage1_review:
  assessment:
    concerns:
      - "اللمة (جدول) صحيحة ولكنها تفتقر إلى التشكيل الكامل."
    observations: "المفهوم يشير إلى تنظيم البيانات هندسياً في صفوف وأعمدة. اللمة الحالية (جدول) مستعارة معجمياً من مجرى الماء الصغير لامتدادها وتنظيمها، وهي تؤدي المعنى بدقة ومستقرة في الاستعمال المعاصر كترجمة لمصطلح (table)."
  blind_candidates:
    - lemma: "جَدْوَل"
      generation_method: majaz
      justification: "إزاحة دلالية من مجرى الماء الممتد إلى الشكل المخطط والمنظم للبيانات."
    - lemma: "مَصْفُوفَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (صفف) نظراً لاعتماد التنظيم على الصفوف."
    - lemma: "قَائِمَةٌ مُرَتَّبَة"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر عن ترتيب عناصر البيانات."
    - lemma: "بَيَانٌ مُجَدْوَل"
      generation_method: tarkib
      justification: "تركيب يشير إلى معطيات تعرض في شكل جدول."

stage2_evidence:
  per_lemma:
    - lemma: "جَدْوَل"
      confirm:
        - text: "«شكل يحتوي على مجموعة قضايا أو معلومات بوجه مختصر، تنظيم للبيانات والمعلومات في صورة صفوف وأعمدة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«صفحةٌ يُخَطُّ فيها خُطُوطٌ مُتَوازيةٌ , قد تَتَقاطعُ, فتكون مُرَبَّعاتٍ يُكتبُ فيما بَيْنَها»"
          source: "المعجم الكبير"
    - lemma: "مَصْفُوفَة"
      expands:
        - text: "«ترتيبةٌ من الأسطر والأعمدة تُستعمَلُ لتنظيم عناصرَ مرتبطة مثل الأعداد أو النقاط أو خلايا وريقات الجدولة»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "تشير إلى الاستخدام المتخصص في الرياضيات والحوسبة (Array/Matrix)."
        - text: "«تنظيم مستطيليّ لعدد من الحدود مرتَّبة في أعمدة وصفوف»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يؤكد التنظيم في أعمدة وصفوف في سياق الجبر."
    - lemma: "قَائِمَةٌ مُرَتَّبَة"
      evidence_status: "no_material_found"
    - lemma: "بَيَانٌ مُجَدْوَل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "جدول"
      decision: confirmed
      decision_reason: "مصطلح أساسي ومستقر لغوياً وعلمياً للتعبير عن تنظيم البيانات في صفوف وأعمدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَدْوَل"
    - lemma: "مَصْفُوفَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معتمد ومستقر ويترجم بدقة اللمة الإنجليزية tabular array ويشيع استخدامه في المعلوماتية والرياضيات لنفس المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مَصْفُوفَة"
            pos: "n"
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "قَائِمَةٌ مُرَتَّبَة"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك كمصطلح."
    - lemma: "بَيَانٌ مُجَدْوَل"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر وليس مصطلحاً مسكوكاً."

stage4_content:
  definition:
    current: "مجموعة من البيانات مرتبة في صفوف وأعمدة"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وموجز ويعبر عن المفهوم (الجنس: مجموعة من البيانات، الفصل: مرتبة في صفوف وأعمدة) بنجاح ويطابق التعريفات المعجمية المعاصرة."
  examples:
    per_lemma:
      - lemma: "جدول"
        examples:
          - text: "أَدْرَجَ الْبَاحِثُ الْبَيَانَاتِ الْإِحْصَائِيَّةَ فِي جَدْوَلٍ مُنَظَّمٍ."
            type: usage
      - lemma: "مَصْفُوفَة"
        examples:
          - text: "اسْتَخْدَمَ الْمُبَرْمِجُ مَصْفُوفَةً ثُنَائِيَّةَ الْأَبْعَادِ لِتَخْزِينِ الْمُعْطَيَاتِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أَدْرَجَ الْبَاحِثُ الْبَيَانَاتِ الْإِحْصَائِيَّةَ فِي جَدْوَلٍ مُنَظَّمٍ."

stage5_enrichment:
  per_entry:
    - lemma: "جدول"
      entry_id: "{auto}"
      root: "جدل"
      maqayis_quote: "«الْجِيمُ وَالدَّالُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ مِنْ بَابِ اسْتِحْكَامِ الشَّيْءِ فِي اسْتِرْسَالٍ يَكُونُ فِيهِ... وَالْجَدْوَلُ: نَهْرٌ صَغِيرٌ، وَهُوَ مُمْتَدٌّ»"
    - lemma: "مَصْفُوفَة"
      entry_id: "{auto}"
      root: "صفف"
      maqayis_quote: "«الصَّادُ وَالْفَاءُ يَدُلُّ عَلَى أَصْلٍ وَاحِدٍ، وَهُوَ اسْتِوَاءٌ فِي الشَّيْءِ وَتَسَاوٍ بَيْنَ شَيْئَيْنِ فِي الْمَقَرِّ. مِنْ ذَلِكَ الصَّفُّ»"
  per_sense:
    - lemma: "جدول"
      sense_id: "{auto}"
      nuance: "تُطلق عموماً على أي تنظيم للبيانات في صفوف وأعمدة وتكثر في الاستخدام العام والإداري."
      mwe: false
    - lemma: "مَصْفُوفَة"
      sense_id: "{auto}"
      nuance: "تُستخدم بصورة أخص في السياقات الرياضية والبرمجية (Array / Matrix)."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جدل","maqayis":"«الْجِيمُ وَالدَّالُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ مِنْ بَابِ اسْتِحْكَامِ الشَّيْءِ فِي اسْتِرْسَالٍ يَكُونُ فِيهِ... وَالْجَدْوَلُ: نَهْرٌ صَغِيرٌ، وَهُوَ مُمْتَدٌّ»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"صفف","maqayis":"«الصَّادُ وَالْفَاءُ يَدُلُّ عَلَى أَصْلٍ وَاحِدٍ، وَهُوَ اسْتِوَاءٌ فِي الشَّيْءِ وَتَسَاوٍ بَيْنَ شَيْئَيْنِ فِي الْمَقَرِّ. مِنْ ذَلِكَ الصَّفُّ»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُطلق عموماً على أي تنظيم للبيانات في صفوف وأعمدة وتكثر في الاستخدام العام والإداري.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تُستخدم بصورة أخص في السياقات الرياضية والبرمجية (Array / Matrix).","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
