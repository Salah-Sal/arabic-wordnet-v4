# AWN4 Review — awn4-13868743-n (second)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «الثاني» تحمل أداة التعريف (ال)، وهذا مخالف للعرف المعجمي في صياغة اللمّة؛ الصواب: ثَانٍ"
      - "اللمّة بدون تشكيل"
      - "نوع الكلمة في المجموعة اسم (n)، لكن «ثانٍ» اسم فاعل يُستعمل صفةً في الغالب، وإن جاز استعماله اسماً بالتضمين"
    observations: "المفهوم هو العدد الترتيبي الثاني، أي المرتبة التي تلي الأولى مباشرة في أي ترتيب أو سلسلة. الجنس القريب هو «المكانة النسبية» (الزائد عليه). المصطلح العربي الطبيعي هو «ثَانٍ» من الجذر ث ن ي على وزن فاعِل. المفهوم أصيل في العربية ولا يحتاج اقتراضاً."
  blind_candidates:
    - lemma: "ثَانٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الجذر ث ن ي على وزن فاعِل، دالّ على ما يلي الأول في الترتيب. الاشتقاق مباشر من معنى التثنية والمزاوجة."
    - lemma: "تَالٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الجذر ت ل و على وزن فاعِل، بمعنى الذي يتلو ما قبله ويتبعه. يُستخدم في المنطق بمعنى الجزء الثاني من الشرطية."
    - lemma: "ثُنْيَان"
      generation_method: ishtiqaq
      justification: "من الجذر ث ن ي على وزن فُعْلان، ورد في مقاييس اللغة: «الثُّنْيَانُ الَّذِي يَكُونُ بَعْدَ السَّيِّدِ» أي الذي يأتي في المرتبة الثانية."
    - lemma: "لَاحِق"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الجذر ل ح ق على وزن فاعِل، بمعنى المدرك للشيء التابع له، ورد في المعاجم الموحدة بمعنى subsequent."

stage2_evidence:
  per_lemma:
    - lemma: "الثَّانِي"
      confirm:
        - text: "«ما يَجِيءُ بعدَ الأولِ مُباشرةً في تَرْتيب العَدَد»"
          source: "المعجم الكبير"
        - text: "«ثَانِي: من (ث ن ي) الذي يلي الأول، ومن يعطف الشيء ويرد بعضه على بعض»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الثاني [من حيث المنزلة أو الترتيب]»"
          source: "المورد الحديث"
      expands:
        - text: "«الوارد في المعاجم للكلمة ضبط الثاني من غير تشديد الياء. فهي على وزن فَاعِل»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "تأكيد الضبط الصحيح: ثَانٍ على وزن فاعِل لا فاعِيّ"
    - lemma: "ثَانٍ"
      confirm:
        - text: "«ما يَجِيءُ بعدَ الأولِ مُباشرةً في تَرْتيب العَدَد»"
          source: "المعجم الكبير"
        - text: "«ثَانِي: من (ث ن ي) الذي يلي الأول»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) ثانٍ ... (3) الثاني [من حيث المنزلة أو الترتيب]»"
          source: "المورد الحديث"
    - lemma: "تَالٍ"
      contradicts:
        - text: "«التَّالِي: الْحَادِي وَالرَّابِع من خيل الحلبة و(عند المنطقيين) الْجُزْء الثَّانِي من الْقَضِيَّة الشّرطِيَّة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الدلالة الأولى (الحادي والرابع من خيل الحلبة) لا علاقة لها بالترتيب العددي، والدلالة المنطقية اصطلاحية خاصة"
      expands:
        - text: "«التَّالِي: الْمُتَأَخر عَن الشَّيْء لِأَنَّهُ من التلو وَهُوَ التَّأَخُّر»"
          source: "دستور العلماء للأحمدنكري"
          addition: "دلالة عامة على التأخر والتبعية، لا تختص بالمرتبة الثانية تحديداً"
    - lemma: "ثُنْيَان"
      confirm:
        - text: "«الثُّنْيَانُ الَّذِي يَكُونُ بَعْدَ السَّيِّدِ، كَأَنَّهُ ثَانِيهِ»"
          source: "مقاييس اللغة لابن فارس"
    - lemma: "لَاحِق"
      contradicts:
        - text: "«اللاحق: من أدرك مع الإمام أول الصلاة وفاته الباقي لنوم أو حدث»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الدلالة الاصطلاحية الفقهية بعيدة عن معنى الترتيب العددي"
      expands:
        - text: "«لَاحِق: المدرك للشيء التابع له»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "دلالة عامة على التبعية والإدراك، لا تخص المرتبة الثانية"

stage3_analysis:
  per_lemma:
    - lemma: "الثَّانِي"
      decision: confirmed
      decision_reason: "اللمّة صحيحة دلالياً ومؤيَّدة بأدلة معجمية متعددة من المعجم الكبير وموسوعة السلطان قابوس والمورد الحديث. لكنها تحتاج تصحيح الشكل: إزالة أداة التعريف وإضافة التشكيل الكامل لتصبح «ثَانٍ» وفق العرف المعجمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثَانٍ"

    - lemma: "ثَانٍ"
      source: stage1
      decision: removed
      decision_reason: "هذا المرشح مطابق للشكل المصحَّح من اللمّة الموجودة «الثاني» بعد إزالة ال وإضافة التشكيل. لا حاجة لإنشاء مدخل جديد."

    - lemma: "تَالٍ"
      source: stage1
      decision: removed
      decision_reason: "«تَالٍ» يدل على التبعية المطلقة (ما يأتي بعد شيء) لا على المرتبة الثانية تحديداً. دلالته في المعاجم إما خاصة بالمنطق (الجزء الثاني من الشرطية) أو عامة (المتأخر). ليس مرادفاً دقيقاً للعدد الترتيبي."

    - lemma: "ثُنْيَان"
      source: stage1
      decision: removed
      decision_reason: "لفظ أثري ورد في الشعر القديم بمعنى «الذي يكون بعد السيد»، لكنه مهجور في الاستعمال المعاصر ومحصور في سياق السيادة والرئاسة لا في الترتيب العددي العام."

    - lemma: "لَاحِق"
      source: stage1
      decision: removed
      decision_reason: "«لَاحِق» يدل على التبعية الزمنية أو المكانية (subsequent)، ولا يختص بالمرتبة الثانية. دلالته الفقهية الغالبة (من فاته بعض الصلاة) تبعده عن المعنى المطلوب."

