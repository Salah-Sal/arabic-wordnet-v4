stage4_content:
  definition:
    current: "مضيف أمريكي لبرنامج منوعات تلفزيوني شهير (1902-1974)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وصفيٌّ مقتضَب وغير محدِّد للشخصية تحديداً كاملاً؛ لا يذكر
        اسم البرنامج ولا الشبكة ولا المهنة الإضافية (الصحافة). ولا يُميَّز به
        سوليفان عن سواه من مقدِّمي برامج المنوعات الأمريكيين من الحقبة نفسها.
        يحتاج إلى تعريف موسوعي يُحدِّد الشخصية تحديداً جلياً.
    authored:
      - type: encyclopedic
        text: >
          إِدوَارد فِينسَنت سُولِيفَان (1902-1974): صَحَفِيٌّ وَمُقَدِّمُ تِلفِزيونٍ
          أَمريكيٌّ، اشتُهِرَ بِتَقديمِ بَرنامَجِ الاسْتِعراضاتِ الأُسبوعيِّ
          «عَرضُ إِد سُولِيفَان» (The Ed Sullivan Show) عَلَى شَبكَةِ CBS الأَمريكيَّةِ
          مِن عَامِ 1948 حَتَّى عَامِ 1971، وَهوَ مِن أَطولِ البَرامِجِ الاسْتِعراضيَّةِ
          عُمراً في تَاريخِ التِّلفزيونِ الأَمريكيِّ.
