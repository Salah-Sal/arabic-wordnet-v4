# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (إد سوليفان، سوليفان) مكتوبتان بلا تشكيل — يجب تشكيلهما كاملاً"
      - "الاسم الرسمي الكامل (إدوارد فينسنت سوليفان) غائب من المجموعة، في حين أن النظير الإنجليزي يتضمّنه (Edward Vincent Sullivan)"
      - "POS = n وهو مقبول في ظل اتساق التصنيف مع عقدة الأب (awn4-10318917-n)، لكن يُلاحَظ أن المحتوى علَمٌ شخصي (proper noun) لا اسم جنس"
      - "لمّة «سوليفان» وحدها مبهمة إذ يشترك في هذا اللقب أشخاص عديدون"
    observations: >
      هذه المجموعة علَمٌ شخصيٌّ (ism ʿalam) يُمثِّل الشخصيةَ الأمريكية إدوارد فينسنت سوليفان
      (1902-1974)، المقدِّم الأشهر لبرنامج «عرض إد سوليفان» على شبكة CBS (1948-1971).
      كونها علماً شخصياً، فإن التعريب (الترجمة الصوتية) هو المنهجُ الوحيدُ الملائم
      لتوليد اللمّات؛ ولا مجال هنا للاشتقاق أو المجاز أو التركيب الدلالي.
      التشكيل إلزامي لكل لمّة، وينبغي إضافة الاسم الكامل الرسمي استكمالاً للتغطية.

  blind_candidates:
    - lemma: "إِد سُولِيفَان"
      generation_method: taarib
      justification: >
        الصيغة الأكثر تداولاً في المصادر الإعلامية العربية للإشارة إلى مقدِّم برامج المنوعات
        الأمريكي الشهير في النصف الثاني من القرن العشرين؛ تجمع بين الاسم الأول المختصر
        «إد» واسم الأسرة «سوليفان».
    - lemma: "سُولِيفَان"
      generation_method: taarib
      justification: >
        اللقب (اسم الأسرة) منفرداً، يُستخدَم في السياقات المختصرة والإحالات غير الرسمية
        حين يكون المقام واضحاً. مقبول بوصفه لمّةً مساعِدة لكن قاصر كلمّة وحيدة.
    - lemma: "إِدوَارد فِينسَنت سُولِيفَان"
      generation_method: taarib
      justification: >
        الاسم الرسمي الكامل كما يُعرَّف به في الموسوعات والمصادر التوثيقية؛ يقابل مباشرةً
        «Edward Vincent Sullivan» في النظير الإنجليزي.
    - lemma: "إِدوَارد سُولِيفَان"
      generation_method: taarib
      justification: >
        صيغة وسطى تحذف الاسم الأوسط وتُثبت الاسم الأول الرسمي الكامل؛ مستخدَمة في بعض
        المصادر الموسوعية العربية بديلاً من الصيغة المختصرة «إد سوليفان».


