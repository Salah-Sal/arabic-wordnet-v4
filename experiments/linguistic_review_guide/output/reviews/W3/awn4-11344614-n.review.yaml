# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "إد سوليفان"
      decision: confirmed
      decision_reason: >
        هذه الصيغة هي الأكثر شيوعاً في المصادر الموسوعية والإعلامية العربية للإشارة
        إلى إدوارد سوليفان؛ ولا بديلَ عنها لعلَم شخصي معرَّب. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الأكثر تداولاً في الإعلام العربي؛ تجمع الاسم المختصر «إد» مع اللقب،
        وهي المرجِع الأول في أي سياق يذكر هذه الشخصية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِد سُولِيفَان"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "سوليفان"
      decision: confirmed
      decision_reason: >
        اللقب منفرداً له حضور في المصادر العربية ومُدرَج في موسوعة السلطان قابوس
        لأسماء العرب بوصفه اسم علَم مذكَّر معرَّباً. يُستخدَم في الإحالة المختصرة.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب (اسم الأسرة) وحده؛ يُستعمَل حين يُكتفى بالإشارة عبر اللقب في سياق
        مألوف، أو عند تصنيف الشخصية أبجدياً، وهو أقلّ تحديداً من «إِد سُولِيفَان».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُولِيفَان"

    # ── مرشح المرحلة ١ — إدوارد فينسنت سوليفان ──
    - lemma: "إِدوَارد فِينسَنت سُولِيفَان"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل لهذه الشخصية يقابل مباشرةً «Edward Vincent Sullivan»
        الموجود في النظير الإنجليزي (lemmas_en) ولا يتضمّنه السجل العربي الحالي.
        إضافته تستكمل التغطية الدلالية وتُوفِّر مدخلاً صريحاً للتوثيق الرسمي.
        لا يوجد مدخل مستقل بهذه الصيغة في قاعدة البيانات، ويُنشأ مدخل جديد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الكامل، يُستخدَم في التوثيق الموسوعي والمراجع الأكاديمية
        حيث تُذكَر الأسماء المركّبة كاملةً لإزالة أي لبس.
      actions:
        - command: create_entry
          params:
            lemma: "إِدوَارد فِينسَنت سُولِيفَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — إدوارد سوليفان ──
    - lemma: "إِدوَارد سُولِيفَان"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة وسيطة بين «إِد سُولِيفَان» و«إِدوَارد فِينسَنت سُولِيفَان»؛ تحذف الاسم
        الأوسط دون أن تُضيف قيمةً تمييزية. التغطية متكفَّل بها من اللمّتين
        المؤكَّدتين، ولا داعي لمدخل ثالث مكرِّر ناقص.


