stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية 'خليج تشيزبيك' تفتقر للتشكيل، كما أن تعريب الاسم الأجنبي (Chesapeake) ينقصه حرف الألف في المقطع الأوسط (peake)."
    observations: "المجموعة تخص معلماً جغرافياً محدداً، والتعريف العربي دقيق وشامل للعناصر الجغرافية المرتبطة (الولايات، المحيط، النهر)."
  blind_candidates:
    - lemma: "خَلِيجُ تشِيزَابِيك"
      generation_method: tarkib
      justification: "الاسم الجغرافي الشائع والمعرب صوتياً بدقة لـ Chesapeake Bay."
    - lemma: "جَوْنُ تشِيزَابِيك"
      generation_method: tarkib
      justification: "استخدام 'جون' كمرادف لـ 'خليج' في السياقات الجغرافية القديمة أو المتخصصة."
    - lemma: "خَلِيجُ تشِيسَابِيك"
      generation_method: tarkib
      justification: "بديل صوتي باستخدام السين بدلاً من الزاي، وهو متبع في بعض المصادر العربية."
    - lemma: "مَدْخَلُ تشِيزَابِيك"
      generation_method: tarkib
      justification: "ترجمة حرفية لكلمة inlet الواردة في التعريف."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيجُ تشِيزبِيك"
      evidence_status: "no_material_found"
    - lemma: "خَلِيجُ تشِيزَابِيك"
      evidence_status: "no_material_found"
    - lemma: "خَلِيجُ تشِيسَابِيك"
      confirm:
        - text: "«هيموغلوبين تشيسابيك (hemoglobin Chesapeake)»"
          source: "المعجم الطبي الموحد"
      expands:
        - text: "«الخاء واللام والجيم أصل واحد يدل على لي وفتل وقلة استقامة. فمن ذلك الخليج، وهو ماء يميل ميلة عن معظم الماء فيستقر.»"
          source: "مقاييس اللغة"
          addition: "تأصيل كلمة 'خليج' لغوياً."

stage3_analysis:
  per_lemma:
    - lemma: "خليج تشيزبيك"
      decision: confirmed
      decision_reason: "اللمّة الأصلية في AWN، مقبولة كنوع من أنواع التعريب الصوتي وإن كانت ناقصة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ تشِيزبِيك"
    - lemma: "خَلِيجُ تشِيزَابِيك"
      source: stage1
      decision: confirmed
      decision_reason: "تعريب صوتي أدق للاسم الأجنبي (Chesapeake) بإضافة الألف لإشباع الفتحة في المقطع الثاني."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "خَلِيجُ تشِيزَابِيك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "خَلِيجُ تشِيسَابِيك"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة معتمدة في المعاجم العلمية الموحدة (مثل المعجم الطبي الموحد) لتعريب Chesapeake."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "خَلِيجُ تشِيسَابِيك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "مدخل كبير لشمال المحيط الأطلسي بين فيرجينيا وماريلاند؛ يغذيه نهر سسكويهانا"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً وجغرافياً ولا يحتاج لتعديل."
  examples:
    per_lemma:
      - lemma: "خَلِيجُ تشِيزَابِيك"
        examples:
          - text: "يُعَدُّ خَلِيجُ تشِيزَابِيك أَكْبَرَ خَلِيجٍ فِي الوِلَايَاتِ المُتَّحِدَةِ الأَمْرِيكِيَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ خَلِيجُ تشِيزَابِيك أَكْبَرَ مَصَبٍّ مَائِيٍّ فِي الوِلَايَاتِ المُتَّحِدَةِ، حَيْثُ يَمْتَدُّ بَيْنَ وِلَايَتَيْ مَارِيلَانْد وفِيرْجِينْيَا."

