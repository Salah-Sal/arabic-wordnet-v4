# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «صانع شعر مستعار» عبارة وصفية حرة لا مصطلح مسكوك — تفشل اختباري السكّ والتثبيت المعجمي"
      - "غياب التشكيل الكامل عن اللمّة الموجودة"
      - "التعريف الحالي ترجمة حرفية مباشرة من الإنجليزية دون توظيف أسلوب المعجم الوسيط"
      - "المجموعة خالية من مصطلح حرفي مسكوك يُعبّر عن هذه المهنة المتخصصة"
    observations: >
      تُمثّل المجموعة حرفةً متخصصة هي صناعة الشعر المستعار (اللِّمَم) وبيعها. اللمّة الموجودة
      «صانع شعر مستعار» مركّبٌ وصفي حر يمكن إحلال «شعر اصطناعي» أو «شعر زائف» محل «شعر مستعار»
      دون انكسار في المعنى، مما يُثبت أنها ليست وحدة معجمية جامدة. المفهوم يستدعي مصطلحاً
      نسبياً أو حِرَفياً مشتقاً من جذر «لمم» (اللِّمَّة = الشعر المتدلي إلى شحمة الأذن) على غرار
      الصياغات الحرفية المعهودة في العربية.
  blind_candidates:
    - lemma: "وَصَّالٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر (و ص ل) على وزن فَعَّال الدال على الاحتراف والحِرفة (نجّار، حدّاد، بنّاء).
        صانع الشعر المستعار يُوصّل شعراً اصطناعياً بفروة الرأس توصيلاً تقنياً، فيُعقل إطلاق
        «الوصّال» عليه استحياءً للوزن بدلالته الحرفية. إحياء لفظ قديم بمجاز وظيفي.
    - lemma: "صَانِعُ الوِصَال"
      generation_method: tarkib
      justification: >
        تركيب إضافي: الوِصَال جمع وَصْل؛ والمراد مَن يصنع الوصلات الشعرية المستعارة.
        بنية إضافية شائعة في مصطلحات الحِرَف والصناعات العربية.
    - lemma: "مُوَصِّلُ الشَّعْرِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من اسم فاعل (مُوَصِّل) ومضاف إليه (الشَّعْر). يصف دقيق المهنة:
        من يوصّل الشعر الاصطناعي ويثبّته على الرأس بحرفية.
    - lemma: "بَارُوكِيٌّ"
      generation_method: taarib
      justification: >
        نسبة إلى الباروكة (معرَّبة من الإيطالية parrucca عبر الفرنسية perruque) على وزن النسبة.
        «البارُوكِيّ» صانع الباروكات وبائعها، قياساً على نسب الحِرَف: الحدادي، النجاري.
        يقبل ال- والجمع السالم والنسبة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────────────────
# استعلامات نُفِّذت:
#   ١. مطابقة دفعية للمّات والمرشحات (headword_norm IN)
#   ٢. جسر إنجليزي (wigmaker / wig / hairpiece / toupee / postiche)
#   ٣. FTS كلمات مفتاحية (لمة / لمم / شعر مستعار / لممي)
stage2_evidence:
  per_lemma:
    - lemma: "صانع شعر مستعار"
      expands:
        - text: "«اللِّمَمِيّ: صانع اللِّمَم (را. wig) أو بائعُها.»"
          source: "المورد الحديث (2008)"
          addition: >
            يكشف الدليل أن العربية المعاصرة سكّت للمفهوم مصطلحاً نسبياً هو «اللِّمَمِيّ»،
            لا العبارة الوصفية الحرة «صانع شعر مستعار». كما يُثبت أن «اللِّمَم» (جمع لِمَّة)
            هو الاسم العربي المعجمي الفصيح للشعر المستعار.

    - lemma: "وَصَّالٌ"
      contradicts:
        - text: >
            «الوصال: شفاء الحشا من داء الضنا. وقيل: غذاء الروح ودواء كل قلب مجروح.
            وقيل: تحقيق الوداد وتصديق ما سبق به الميعاد. والوصال ليس فوقه موهوم لكنه
            قلما يدوم: لحظات الوصال سريعة الارتحال.»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            الوصال في هذا المعجم يخصّ الاتحاد الروحي والمعاني العاطفية الصوفية،
            لا صلة له بوصل الشعر أو حرفة تصنيعه.
        - text: "«وِصَال: من (و ص ل) القرب والاتصال ويكون في عفاف الحب، وصيام المرء أياماً متتابعة دون إفطار.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            الوِصال مرتبط بالحب العفيف والصيام المتواصل في هذا المصدر، لا بصناعة الشعر المستعار.
        - text: >
            «الوصال عند الصوفية هو ما يقولون له: مقام الوحدة مع الله تعالى سراً وجهراً.
            والوصل هو الوحدة الحقيقية التي هي واسطة بين الظهور والخفاء.»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: >
            الوصال مصطلح صوفي راسخ يدل على الاتحاد الروحي؛ توظيفه في حرفة الشعر المستعار
            يُوقع في اشتراك لفظي مضلّ مع هذا المصطلح الكلامي العريق.

    - lemma: "صَانِعُ الوِصَال"
      evidence_status: "no_material_found"

    - lemma: "مُوَصِّلُ الشَّعْرِ"
      evidence_status: "no_material_found"

    - lemma: "بَارُوكِيٌّ"
      contradicts:
        - text: "«باروكي: عن العبرية بمعنى مبارك ومبروك والياء للنسب. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            «باروكي» في المعجم العربي اسم علم ذكوري من أصل عبري (مبارك/مبروك)،
            لا مصطلح حرفة ولا مهنة. استخدامه لصانع الباروكات يُوقع في لبس مع الاسم العلم.

    - lemma: "لِمَمِيٌّ"
      confirm:
        - text: "«اللِّمَمِيّ: صانع اللِّمَم (را. wig) أو بائعُها.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: >
            «اللِّمَّة: «أ» خُصلة من شعر مستعار تعلو قمّة الرأس.
            «ب» لِمَّة أو كتلة من شعر مستعار تغطي جزءاً أصلع من الرأس.»
          source: "المورد الحديث (2008) — مدخل toupee"
          addition: >
            يُثبت الدليل أن «اللِّمَّة» وُظِّفت في العربية المعاصرة للدلالة على قطعة الشعر
            المستعار بأنواعها، وأن «اللِّمَمِيّ» (نسبة إلى جمعها لِمَم) هو المصطلح المسكوك
            لصانعها وبائعها.
        - text: >
            «اللِّمّة الكَثَّة: «أ» شعر مستعار كثيف ضخم.
            «ب» شخص معتمر بلمة كثّة.»
          source: "المورد الحديث (2008) — مدخل buzzwig"
          addition: >
            يُثبت أن «اللِّمَّة» تُستخدم كمرادف للشعر المستعار في تركيبات وصفية متعددة،
            مما يُرسّخ مركزية الجذر «لمم» في هذا الحقل الدلالي.
        - text: >
            «(اللمة) شعر الرأس المجاوز شحمة الأذن (ج) لمَم ولمام»
          source: "المعجم الوسيط"
          addition: >
            يُثبت المعجم الوسيط أن «اللِّمَّة» كلمة فصيحة راسخة بمعنى الشعر الطويل،
            وجمعها «لِمَم» هو أساس اشتقاق «اللِّمَمِيّ».
        - text: >
            «(اللِّمَّةُ) دُونَ الْجُمَّةِ وَهِيَ مَا أَلَمَّ بِالْمَنْكِبِ مِنْ شَعْرِ الرَّأْسِ
            وَجَمْعُهَا (لِمَمٌ)»
          source: "المغرب في ترتيب المعرب للمُطَرِّزي"
          addition: >
            يُقدّم المطرِّزي تعريفاً دقيقاً يميّز اللِّمَّة من الجُمَّة، ويؤكد أن جمعها «لِمَم»
            بالضبط، مما يُرسّخ بنية «لِمَمِيّ» اشتقاقياً.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "صانع شعر مستعار"
      decision: removed
      decision_reason: >
        العبارة وصف حر لا مصطلح مسكوك: يجوز إحلال «شعر اصطناعي» أو «شعر زائف» محل
        «شعر مستعار» دون انكسار في الوحدة الدلالية، مما يُفشل اختبار التثبيت المعجمي ويكشف
        أنها عبارة وصفية لا وحدة معجمية. فضلاً عن ذلك، الأدلة تُثبت أن المصطلح المسكوك
        للمفهوم هو «اللِّمَمِيّ» (المورد الحديث 2008). غياب التشكيل يُضاف إلى المشكلات.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وَصَّالٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية المتعددة (التوقيف، كشاف اصطلاحات الفنون، موسوعة السلطان قابوس)
        تُثبت إجماعاً أن «الوصال» و«الوصّال» مرتبطان بالاتحاد الروحي والصوفي وعفاف الحب،
        ولا سند لاستخدامهما في حرفة صناعة الشعر المستعار. توظيفه هنا سيوقع في اشتراك
        لفظي مع المصطلح الصوفي الراسخ، مخالفاً مبدأ يُسر التداول والملاءمة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "صَانِعُ الوِصَال"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب إضافي يعتمد على «الوِصال» الذي ثبت معجمياً ارتباطه بالاتحاد الروحي
        لا بوصل الشعر. فضلاً عن ذلك، يفشل اختبار السكّ المعجمي: يمكن إحلال «الوُصَل»
        أو «المواصلات» محل «الوصال» مع بقاء المعنى الوصفي، دليلٌ على أنها عبارة لا وحدة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُوَصِّلُ الشَّعْرِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي على تثبيت هذا المركب. يفشل اختبار السكّ: يمكن إحلال «مُركِّب الشعر»
        أو «مُثبِّت الشعر» أو «مُرتِّب الشعر» محله مع احتفاظ المعنى ذاته، كاشفاً أنه عبارة
        وصفية حرة لا مصطلح مسكوك. بوابة الجودة: لا يجتاز معيار الاطّراد ولا معيار إيثار التراثي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "بَارُوكِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «باروكي» في المعجم العربي اسم علم ذكوري من أصل عبري (معنى: مبارك/مبروك)،
        موثّق في موسوعة السلطان قابوس للأسماء العربية. استخدامه كمصطلح للحرفة يوقع في
        لبس بالغ مع الاسم العلم الشائع. يُرفض لمخالفة معيار الملاءمة ومعيار يُسر التداول.
        فحص الاقتراض: «الباروكة» معرَّبة مقبولة، لكن النسبة إليها في هذا السياق غير مُستقرة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "لِمَمِيٌّ"
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك موثَّق في المورد الحديث (2008) بصيغة «اللِّمَمِيّ: صانع اللِّمَم أو
        بائعها»، مع ربط صريح بـ (wig). مشتقٌّ اشتقاقاً صرفياً سليماً على وزن النسبة من
        «اللِّمَم» (جمع لِمَّة: الشعر المستعار/الطويل)، وهو جذر عربي فصيح موثَّق في المعجم
        الوسيط ومقاييس اللغة لابن فارس والمغرب للمطرّزي. يجتاز اختبار السكّ (لا يقبل
        الإحلال بمرادف). يجتاز بوابة جودة المصطلح: اطّراد صرفي + يُسر تداول + إيثار تراثي
        (جذر لمم) + إيثار عربي (لا دخيل) + اشتقاقية + ملاءمة دلالية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللَّفظُ الوحيد المؤكَّد في المجموعة؛ مصطلحٌ نسبيٌّ مشتقٌّ من «اللِّمَّة» —الشعر الطويل
        الذي يبلغ شحمة الأذن أو يتجاوزها إلى المنكب— فيدلُّ تحديداً على المحترف المتخصص في
        صنع الشعور المستعارة (اللِّمَم) وبيعها، ويتميّز عن الحلّاق العام بالتخصص في التصنيع
        لا في تهذيب الشعر الطبيعي.
      actions:
        - command: create_entry
          params:
            lemma: "لِمَمِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────────────────
stage4_content:
  definition:
    current: "شخص يصنع ويبيع الشعر المستعار"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية مباشرة من الإنجليزية (someone who makes and sells wigs)
        تفتقر إلى: (أ) توظيف المصطلح العربي «اللِّمَم» بدلاً من التعبير الوصفي «الشعر المستعار»،
        (ب) بنية التعريف المعجمي بأسلوب الوسيط (جنس قريب + فصل نوعي)، (ج) الإشارة إلى أن
        المهنة تشمل الشعر الاصطناعي والطبيعي المستعار معاً.
