        text: "حِرْفِيٌّ يَتَخَصَّصُ فِي صُنْعِ اللِّمَمِ —وَهِيَ الشُّعُورُ الِاصْطِنَاعِيَّةُ أَوِ الطَّبِيعِيَّةُ الْمُسْتَعَارَةُ تُلْبَسُ عَلَى الرَّأْسِ— وَبَيْعِهَا"
