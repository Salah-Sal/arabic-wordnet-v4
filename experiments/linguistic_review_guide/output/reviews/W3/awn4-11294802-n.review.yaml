# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11294802-n  |  ILI: i96777
# الموضوع: برتراند راسل — Bertrand Russell
# تاريخ المراجعة: 2026-03-21
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الوحيدة «برتراند راسل» مكتوبة بدون تشكيل كامل، وهو شرط إلزامي في AWN4"
      - "المجموعة تحتوي على لمّة عربية واحدة فيما تعرض OEWN أربعة أشكال مرادفة (Russell / Bertrand Russell / Bertrand Arthur William Russell / Earl Russell)؛ ينبغي إضافة ما يقابلها عربياً"
      - "التعريف العربي الحالي مقتضب لشخصية بارزة جداً: لا يذكر منجزه الأبرز «مبادئ الرياضيات»، ولا جائزة نوبل، ولا ريادته للفلسفة التحليلية"
      - "صياغة المدة الزمنية «(1872-1970)» في نهاية التعريف غير مألوفة أسلوبياً في المعاجم العربية"
    observations: >
      هذه المجموعة علم شخصي (proper noun) لفيلسوف رياضي بريطاني — برتراند آرثر ويليام راسل
      (١٨٧٢–١٩٧٠)، صاحب «مبادئ الرياضيات» مع وايتهيد، وأحد رواد الفلسفة التحليلية
      والمنطق الرياضي الحديث. جميع لمّاته عربياً تعريبات صوتية (taarib) إذ لا أصل عربي
      للاسم. الفئة الوحيدة المنتجة لمرشحات جديدة هي: أشكال الاسم الرسمي والمختصر واللقب
      النبيل. قاعدة البيانات المعجمية لا تضمّ مداخل خاصة بشخصه، بينما تحوي مداخل طبية
      منسوبة إلى عائلات أخرى تحمل اسم "راسل" (Russell bodies / Russell's viper) لا صلة
      لها بالفيلسوف.

  blind_candidates:
    - lemma: "بِرْتْرَانْد رَاسِل"
      generation_method: taarib
      justification: >
        التعريب الصوتي القياسي للاسم الإنجليزي Bertrand Russell المألوف في المصادر
        العربية الأكاديمية والصحفية. يجمع الاسم الأول Bertrand والكنية Russell.
    - lemma: "بِرْتْرَانْد آرثر ويليام رَاسِل"
      generation_method: taarib
      justification: >
        الاسم الرسمي الكامل عند الولادة (Bertrand Arthur William Russell)، يُستخدم في
        السياقات الأكاديمية والموسوعية للتمييز القاطع عن أشخاص آخرين يحملون الكنية
        ذاتها.
    - lemma: "إيرل رَاسِل"
      generation_method: taarib
      justification: >
        تعريب للقبه النبيلي الرسمي Earl Russell (إيرل راسل الثالث)، المستخدم في الوثائق
        الرسمية البريطانية وبعض الكتابات العربية التي تعتني بسياقه الأرستقراطي.
    - lemma: "لُورد رَاسِل"
      generation_method: taarib
      justification: >
        الشكل الدارج في الصحافة العربية للإشارة إلى راسل باعتباره نبيلاً بريطانياً
        (Lord Russell). أقل دقة من «إيرل رَاسِل» لكنه واسع الانتشار.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  # ── ملاحظة منهجية ──
  # الاستعلامات المُنفَّذة (٣ استعلامات):
  #   ١. مطابقة دقيقة دفعية: برتراند راسل / برتراند رسل / ايرل راسل / لورد راسل / راسل / رسل
  #      → صفر نتائج ذات صلة بالفيلسوف
  #   ٢. الجسر الإنجليزي: "Russell" OR "Bertrand Russell" OR "Earl Russell"
  #      → مداخل طبية (Russell bodies، Russell's syndrome، Russell's viper) — لا صلة بالفيلسوف
  #   ٣. FTS كلمات مفتاحية: "فيلسوف" OR "رياضيات" OR "وايتهيد" OR "المنطق الرياضي"
  #      → أرسطو وأبيقور وآدم سميث في المعجم الكبير — أنماط تعريف مفيدة؛ لا ذكر لراسل

  per_lemma:
    - lemma: "برتراند راسل"
      evidence_status: "no_material_found"

    - lemma: "بِرْتْرَانْد رَاسِل"
      evidence_status: "no_material_found"

    - lemma: "بِرْتْرَانْد آرثر ويليام رَاسِل"
      evidence_status: "no_material_found"

    - lemma: "إيرل رَاسِل"
      evidence_status: "no_material_found"

    - lemma: "لُورد رَاسِل"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "برتراند راسل"
      decision: confirmed
      decision_reason: >
        لمّة صحيحة وشائعة في المصادر العربية المتخصصة والموسوعات. هي التعريب الصوتي
        المعياري للاسمين الأول والعائلي. لا توجد لمّة عربية بديلة إذ المفهوم علم
        شخصي أجنبي لا يقبل الاشتقاق ولا المجاز. تحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الشكل الأشيع في الكتابة العربية يجمع الاسم الأول (بِرْتْرَانْد) واسم العائلة
        (رَاسِل) — مرجع الاستخدام اليومي والأكاديمي العام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِرْتْرَانْد رَاسِل"

    # ── مرشح المرحلة ١ — الأول (مطابق للمّة الموجودة بعد التشكيل) ──
    - lemma: "بِرْتْرَانْد رَاسِل"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة «برتراند راسل» بعد إضافة التشكيل؛ وقد عولج
        بإجراء update_lemma على المدخل الموجود. لا حاجة لإنشاء مدخل جديد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١ — الثاني ──
    - lemma: "بِرْتْرَانْد آرثر ويليام رَاسِل"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل عند الولادة، يقابل مباشرةً لمّة OEWN الثالثة
        «Bertrand Arthur William Russell». يُستخدم في الموسوعات العربية والدراسات
        الأكاديمية للتمييز القاطع؛ اختبار السكّ مجتاز لأنه علم شخصي مُحدَّد بزمن ونسب.
        غياب المادة المعجمية في قاعدة البيانات متوقع لكونه علماً شخصياً أجنبياً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يتضمن الاسمين الوسيطين (آرثر ويليام) ولذا يُعيِّن الشخص بلا لبس، ويختصّ
        بالسياقات الأكاديمية والوثائقية الرسمية.
      actions:
        - command: create_entry
          params:
            lemma: "بِرْتْرَانْد آرثر ويليام رَاسِل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — الثالث ──
    - lemma: "إيرل رَاسِل"
      source: stage1
      decision: confirmed
      decision_reason: >
        اللقب النبيلي الرسمي (Earl Russell) يقابل لمّة OEWN الرابعة «Earl Russell».
        يُستخدم في المراجع التاريخية والوثائق البريطانية المترجمة. اختبار السكّ مجتاز:
        "إيرل" لقب نبيل ولا يمكن إبداله بمرادف آخر مع بقاء الدلالة ذاتها.
        غياب المادة المعجمية متوقع لكونه علماً شخصياً أجنبياً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُعرِّف راسل بلقبه النبيلي البريطاني الرسمي (الإيرل الثالث لراسل)، ويُستخدم
        في السياقات التي تعتني بوضعه الاجتماعي والمؤسسي البريطاني.
      actions:
        - command: create_entry
          params:
            lemma: "إيرل رَاسِل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — الرابع ──
    - lemma: "لُورد رَاسِل"
      source: stage1
      decision: removed
      decision_reason: >
        «لورد راسل» أقل دقة من «إيرل رَاسِل» إذ اللقب Lord أعم من Earl، وقد يُشير
        إلى غيره من آل راسل النبلاء. بما أن «إيرل رَاسِل» قُبل وهو الأخص والأدق
        وصفاً لمقامه، يكفي ذلك ولا مبرر للمرادف الأقل دقة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "فيلسوف وعالم رياضيات إنجليزي تعاون مع وايتهيد (1872-1970)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقتضب ويُهمل أبرز منجزات راسل: تأسيس المنطق الرياضي الحديث،
        ريادة الفلسفة التحليلية، جائزة نوبل في الآداب. كما أن الأسلوب «(1872-1970)»
        في نهاية التعريف غير مألوف معجمياً. ينبغي تعريف موسوعي يليق بشخصية بهذا الحجم.
        كذلك وصفه بـ«الإنجليزي» يحتاج دقة: هو بريطاني (ويلزي المنشأ) لا إنجليزي تحديداً.
    authored:
      - type: encyclopedic
        text: >
          فيلسوفٌ بريطانيٌّ وعالمُ رياضياتٍ ومنطقيٌّ بارز، وُلد عام ١٨٧٢ وتوفِّي عام
          ١٩٧٠. ألَّف مع ألفريد نورث وايتهيد الكتابَ الجامع «مبادئ الرياضيات»
          (Principia Mathematica)، ويُعدّ أحد مؤسسي الفلسفة التحليلية والمنطق الرياضي
          الحديث. نال جائزة نوبل في الآداب عام ١٩٥٠.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            فيلسوفٌ بريطانيٌّ وعالمُ رياضياتٍ ومنطقيٌّ بارز، وُلد عام ١٨٧٢ وتوفِّي عام
            ١٩٧٠. ألَّف مع ألفريد نورث وايتهيد الكتابَ الجامع «مبادئ الرياضيات»
            (Principia Mathematica)، ويُعدّ أحد مؤسسي الفلسفة التحليلية والمنطق الرياضي
            الحديث. نال جائزة نوبل في الآداب عام ١٩٥٠.

  examples:
    per_lemma:
      - lemma: "بِرْتْرَانْد رَاسِل"
        examples:
          - text: >
              أرسى بِرْتْرَانْد رَاسِل مع زميله وايتهيد دعائمَ المنطق الرياضي الحديث
              في مؤلَّفهما الضخم «مبادئ الرياضيات».
            type: usage
      - lemma: "بِرْتْرَانْد آرثر ويليام رَاسِل"
        examples:
          - text: >
              تُشير معظم الموسوعات الأكاديمية إلى الفيلسوف باسمه الكامل
              بِرْتْرَانْد آرثر ويليام رَاسِل تمييزاً له من نبلاء آخرين حملوا الكنية
              ذاتها.
            type: usage
      - lemma: "إيرل رَاسِل"
        examples:
          - text: >
              وقَّع إيرل رَاسِل بيانَ راسل–أينشتاين عام ١٩٥٥ داعياً القوى النووية
              إلى نزع أسلحتها.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            أرسى بِرْتْرَانْد رَاسِل مع زميله وايتهيد دعائمَ المنطق الرياضي الحديث
            في مؤلَّفهما الضخم «مبادئ الرياضيات».
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            تُشير معظم الموسوعات الأكاديمية إلى الفيلسوف باسمه الكامل
            بِرْتْرَانْد آرثر ويليام رَاسِل تمييزاً له من نبلاء آخرين حملوا الكنية
            ذاتها.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            وقَّع إيرل رَاسِل بيانَ راسل–أينشتاين عام ١٩٥٥ داعياً القوى النووية
            إلى نزع أسلحتها.


