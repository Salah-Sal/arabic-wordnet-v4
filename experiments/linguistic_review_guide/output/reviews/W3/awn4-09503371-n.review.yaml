stage4_content:
  definition:
    current: "قناة بين شرق كوبا وغرب هايتي تربط المحيط الأطلسي بالبحر الكاريبي"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق جغرافياً لكن يحتاج إلى صياغة معجمية أكثر رصانة مع توضيح طبيعة الممر."
    authored:
      - type: terminological
        text: "ممر مائي طبيعي يقع بين الجهة الشرقية من جزيرة كوبا والجهة الغربية من جزيرة هايتي، يصل مياه المحيط الأطلسي بمياه البحر الكاريبي."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "ممر مائي طبيعي يقع بين الجهة الشرقية من جزيرة كوبا والجهة الغربية من جزيرة هايتي، يصل مياه المحيط الأطلسي بمياه البحر الكاريبي."}
  examples:
    per_lemma:
      - lemma: "مَمَرّ وِيندوَارد"
        examples:
          - text: "يُعتبر مَمَرّ وِيندوَارد أحد أهم المسارات الملاحية للسفن المتجهة إلى قناة بنما عبر المحيط الأطلسي."
            type: usage
      - lemma: "مَضِيق وِيندوَارد"
        examples:
          - text: "يفصل مَضِيق وِيندوَارد بين جزيرتي كوبا وهسبانيولا بعرض يبلغ حوالي 80 كيلومتراً."
            type: usage
      - lemma: "مَمَرّ مَهَبِّ الرِّيحِ"
        examples:
          - text: "أُطلق اسم مَمَرّ مَهَبِّ الرِّيحِ على القناة نظراً لموقعها المواجه للرياح التجارية الشمالية الشرقية."
            type: usage
      - lemma: "مَضِيق مَهَبِّ الرِّيحِ"
        examples:
          - text: "تعبر السفن الكبيرة مَضِيق مَهَبِّ الرِّيحِ للوصول إلى الموانئ الجنوبية في منطقة الكاريبي."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعد هذا الممر المائي ممراً استراتيجياً يربط بين المحيط الأطلسي والبحر الكاريبي."}

