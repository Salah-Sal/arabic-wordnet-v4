stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - الاقتصار على تعريب الاسم "ويندوارد" دون ذكر المقابل الدلالي العربي (مهب الريح).
    observations: "المصطلح يشير إلى ممر مائي جغرافي محدد. الترجمة المباشرة (ويندوارد) شائعة في الأطلس الحديث، لكن المصطلح الوصفي (مهب الريح) يمثل المقابل العربي الدقيق لمعنى 'Windward' في الملاحة."
  blind_candidates:
    - lemma: "مَمَرّ وِيندوَارد"
      generation_method: taarib
      justification: "تعريب مباشر للاسم الإنجليزي الشائع للممر المائي."
    - lemma: "مَضِيق وِيندوَارد"
      generation_method: tarkib
      justification: "استخدام 'مضيق' كبديل لـ 'ممر' (Passage) وهو شائع في التسميات الجغرافية العربية."
    - lemma: "مَمَرّ مَهَبِّ الرِّيحِ"
      generation_method: majaz
      justification: "ترجمة دلالية لمصطلح 'Windward' الذي يعني الجهة التي تهب منها الريح."
    - lemma: "مَضِيق مَهَبِّ الرِّيحِ"
      generation_method: tarkib
      justification: "جمع بين المصطلح الجغرافي 'مضيق' والترجمة الدلالية لـ 'Windward'."

stage2_evidence:
