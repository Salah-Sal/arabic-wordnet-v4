    - lemma: "مَضِيق مَهَبِّ الرِّيحِ"
      evidence_status: "no_material_found"
    - lemma: "مَضِيق"
      confirm:
        - text: "«(المَضِيقُ): ما ضاق واشتدَّ من الأمور مجرى ماءٍ ضَيِّقٌ بين قطعتين من الأرض.»"
          source: "المعجم الوسيط"
        - text: "«ممر مائي بين قارتين أو جزيرتين أو بين جزيرة واليابسة أو هو ممر يصل بحرين أحدهما بالآخر»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
    - lemma: "مَهَبّ"
      confirm:
        - text: "«موضع الهُبُوب، يقالُ: قعد في مَهَبِّ الريح»"
          source: "المعجم الوسيط"

