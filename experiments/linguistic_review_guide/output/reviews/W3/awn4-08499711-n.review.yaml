stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'مؤخرة' غير مشكّلة وتحتاج لضبط التشكيل الكامل."
    observations: "التعريف دقيق ويصف الجزء الخلفي للجيش أو الموكب. اللمة 'مؤخرة' مستخدمة وشائعة جداً في العصر الحديث، ولكن يوجد في التراث العربي مصطلح 'ساقة' الذي يعبر بدقة متناهية عن مؤخرة الجيش ومؤخرة الركب أو الحجاج، مما يثري المجموعة الترادفية بلفظ عربي أصيل."
  blind_candidates:
    - lemma: "مُؤَخَّرَة"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر 'أخر'، ويدل على الجزء المتأخر من أي شيء، وهو شائع الاستخدام عسكرياً بتركيب 'مؤخرة الجيش'."
    - lemma: "سَاقَة"
      generation_method: majaz
      justification: "لفظ عربي أصيل يدل على مؤخرة الجيش أو القوم الذين يسوقونهم من الخلف."
    - lemma: "ذَيْل"
      generation_method: majaz
      justification: "استعارة مجازية لشبه مؤخرة الموكب بذيل الحيوان."
    - lemma: "خَلْف"
      generation_method: ishtiqaq
      justification: "الجزء الذي يقع في المؤخرة، وهو مقابل للقسم الأمامي (القدام)."

stage2_evidence:
  per_lemma:
    - lemma: "مؤخرة"
      confirm:
        - text: "«(من الجيش) : جزء منه يكون فى آخره ؛ لحمايته من الخلف»"
          source: "المعجم الكبير"
        - text: "«مؤخرة الجيش: جزء من القوة يُعيَّن لحراسة الخطوط الخلفية تكون مهمته تأخير العدوّ حتى يتم للجيش تنظيم انسحابه»"
          source: "المعجم الوسيط"
    - lemma: "ساقة"
      confirm:
        - text: "«ساقَةُ الجيش: مُؤَخَّرُهُ. (مجاز) ساقَةُ الحاجِّ»"
          source: "المعجم الكبير"
        - text: "«من الجيش: مؤخره»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "مؤخرة"
      decision: confirmed
      decision_reason: "مصطلح قياسي ومستخدم بكثرة للتعبير عن الجزء الخلفي للجيش أو الموكب. يحتاج فقط إلى التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُؤَخَّرَة"
    - lemma: "سَاقَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح وعريق يدل تحديداً على مؤخرة الجيش أو الموكب، وهو مطابق تماماً لتعريف المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "سَاقَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08499711-n"

stage4_content:
  definition:
    current: "الجزء الخلفي من تشكيل عسكري أو موكب"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويغطي الجانبين العسكري والمدني (الموكب)."
  examples:
    per_lemma:
      - lemma: "مُؤَخَّرَة"
        examples:
          - text: "تمركزت قوات الدعم في مُؤَخَّرَةِ الجيش لتأمين خطوط الإمداد."
            type: usage
      - lemma: "سَاقَة"
        examples:
          - text: "سارت سَاقَةُ الحُجَّاجِ بتمهل لتطمئن على المتأخرين في الموكب."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-08499711-n"
          text: "تمركزت قوات الدعم في مُؤَخَّرَةِ الجيش لتأمين خطوط الإمداد."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "سارت سَاقَةُ الحُجَّاجِ بتمهل لتطمئن على المتأخرين في الموكب."

