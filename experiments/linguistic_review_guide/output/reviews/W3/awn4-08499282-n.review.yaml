  per_entry:
    - lemma: "رَأْس"
      entry_id: "{auto}"
      root: "رأس"
      maqayis_quote: "«الرَّاءُ وَالْهَمْزَةُ وَالسِّينُ أَصْلٌ يَدُلُّ عَلَى تَجَمُّعٍ وَارْتِفَاعٍ.»"
    - lemma: "مُقَدِّمَة"
      entry_id: "{auto}"
      root: "قدم"
      maqayis_quote: "«الْقَافُ وَالدَّالُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَبْقٍ وَرَعْفٍ»"
    - lemma: "طَلِيعَة"
      entry_id: "{auto}"
      root: "طلع"
      maqayis_quote: "«الطَّاءُ وَاللَّامُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ صَحِيحٌ، يَدُلُّ عَلَى ظُهُورٍ وَبُرُوزٍ»"
    - lemma: "صَدْر"
      entry_id: "{auto}"
      root: "صدر"
      maqayis_quote: "«الصَّادُ وَالدَّالُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى خِلَافِ الْوِرْدِ، وَالْآخِرُ صَدْرُ الْإِنْسَانِ وَغَيْرُهُ.»"

