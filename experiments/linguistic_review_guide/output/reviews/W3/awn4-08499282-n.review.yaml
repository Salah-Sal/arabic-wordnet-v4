stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية تفتقر إلى التشكيل الكامل."
      - "يمكن إثراء المجموعة بلمّات أكثر دلالة على السياق العسكري وتشكيلات الموكب."
    observations: "المفهوم يشير إلى مقدمة التشكيل العسكري أو الموكب. اللمّات الحالية (رأس ومقدمة) تؤدي المعنى الأساسي، ولكن هناك مصطلحات أخرى تعبر عن الفروق الدقيقة كالطليعة التي تستخدم خصيصاً في السياق العسكري للفرقة المتقدمة."
  blind_candidates:
    - lemma: "طَلِيعَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (ط ل ع) لتدل على الجزء المتقدم من الجيش أو القوة التي تستطلع."
    - lemma: "صَدْر"
      generation_method: majaz
      justification: "إزاحة دلالية من المعنى العضوي (أعلى صدر الإنسان) إلى الجزء المتقدم من أي موكب أو تشكيل."
    - lemma: "قَادِمَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (ق د م) على وزن فاعلة لتدل على الجزء المتقدم."
    - lemma: "مُقَدِّمَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (ق د م) لتدل على ما يقدم في الطليعة."

stage2_evidence:
  per_lemma:
    - lemma: "رأس"
      confirm:
        - text: "«من كل شيء أعلاه وسيد القوم»"
          source: "المعجم الوسيط"
        - text: "«مِن كُلِّ شَيْءٍ: أَعْلاهُ»"
          source: "المعجم الكبير"
    - lemma: "مقدمة"
      confirm:
        - text: "«مقدمة كل شيء: أوّله. وهي بكسر الدال اسم فاعل، وبفتحها اسم مفعول بمعنى قدَّمها غيرها.»"
          source: "معجم الصواب اللغوي"
    - lemma: "طليعة"
      confirm:
        - text: "«رجل يبعثه قومه للاستطلاع خيل الطليعة: القوات التي تتقدم الجيش»"
          source: "المعجم الكبير"
    - lemma: "صدر"
      confirm:
        - text: "«مُقدَّمُ كلِّ شيءٍ الطائفة من الشيء صدرُ القوم: رئيسهم»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "رأس"
      decision: confirmed
      decision_reason: "كلمة أصيلة صحيحة فصيحة، تشير إلى أعلى الشيء ومقدمته، وتستخدم للإشارة إلى مقدمة الموكب أو التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَأْس"

    - lemma: "مقدمة"
      decision: confirmed
      decision_reason: "كلمة صحيحة شائعة الاستخدام في السياقات العسكرية (مقدمة الجيش) للإشارة إلى الجزء الأمامي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقَدِّمَة"

    - lemma: "طَلِيعَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عسكري فصيح يشير تحديداً إلى القوات التي تتقدم الجيش، وهو يطابق بدقة الدلالة المطلوبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "طَلِيعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08499282-n"}

    - lemma: "صَدْر"
      source: stage1
      decision: confirmed
      decision_reason: "كلمة مستعارة من صدر الإنسان للإشارة إلى مقدمة القوم أو التشكيل، وهي فصيحة ومستقرة معجمياً في هذا السياق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "صَدْر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-08499282-n"}

stage4_content:
  definition:
    current: "مقدمة تشكيل عسكري أو موكب"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح وشامل لمعنيي التشكيل العسكري والموكب."
  examples:
    per_lemma:
      - lemma: "رَأْس"
        examples:
          - text: "سار القائد في رَأْسِ الموكب العسكري."
            type: usage
      - lemma: "مُقَدِّمَة"
        examples:
          - text: "اشتبكت مُقَدِّمَةُ الجيش مع قوات العدو مبكراً."
            type: usage
      - lemma: "طَلِيعَة"
        examples:
          - text: "أرسل القائد طَلِيعَةً لاستطلاع الطريق قبل تحرك الجيش الأساسي."
            type: usage
      - lemma: "صَدْر"
        examples:
          - text: "تقدم الفرسان في صَدْرِ التشكيل العسكري."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "سار القائد في رَأْسِ الموكب العسكري."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "اشتبكت مُقَدِّمَةُ الجيش مع قوات العدو مبكراً."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أرسل القائد طَلِيعَةً لاستطلاع الطريق قبل تحرك الجيش الأساسي."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تقدم الفرسان في صَدْرِ التشكيل العسكري."}

