stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (فرصة)، وهو مفهوم غني بالمرادفات العربية يستحق إثراءً"
      - "اللمّة الموجودة بدون تشكيل كامل"
    observations: >
      المفهوم يدور حول الإمكانية الناشئة عن تضافر ظروف مواتية، وهو مفهوم أصيل في الثقافة العربية
      له جذور لغوية عميقة. التعريف العربي الحالي ترجمة شبه حرفية للتعريف الإنجليزي
      ويمكن تحسينه بأسلوب معجمي عربي أصيل. المفهوم يتضمن بُعدَي الزمن المناسب
      والظرف الملائم معاً.
  blind_candidates:
    - lemma: "فُرْصَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ف ر ص) على وزن فُعْلة، أصل المادة يدل على الاقتطاع والخِلسة عند ابن فارس،
        ثم نُقلت إلى النُّهزة لأنها اختلاس شيء قبل فواته. هي اللفظة الأكثر شيوعاً وتداولاً
        في العربية المعاصرة للتعبير عن هذا المفهوم.
    - lemma: "سَانِحَة"
      generation_method: majaz
      justification: >
        من الجذر (س ن ح) بمعنى الظهور والعرض. أصل السانح ما أتاك عن يمينك من طائر فتفاءلت به،
        ثم استُعير لكل أمر مواتٍ يعرض. فيها إزاحة دلالية من التفاؤل بالطائر إلى الأمر المواتي عموماً.
    - lemma: "نُهْزَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ن ه ز) على وزن فُعْلة، والنَّهز النهوض لتناول الشيء. النُّهزة في المعجم الوسيط
        مفسَّرة بالفُرصة مباشرة، وهي لفظة تراثية فصيحة تؤكد معنى اغتنام الحين المواتي.
    - lemma: "مُوَاتَاة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (و ت ي) على وزن مُفاعَلة، من واتاه يواتيه أي وافقه ولاءمه.
        مصدر يدل على توافق الظروف وملاءمتها، قريب من دلالة التعريف.

stage2_evidence:
  per_lemma:
    - lemma: "فُرْصَة"
      confirm:
        - text: "«الفرصة: اختلاس الشيء حذرا من فواته.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«النَّوبة الوقت المناسب للقيام بعمل ما»"
          source: "المعجم الوسيط (OCR)"
        - text: "«النوبة تكون بين القوم يتناوبونها على الماء. يقال: انتهز فلان الفرصة: اغتنمها وفاز بها»"
          source: "المعجم الوسيط (OCR)"
        - text: "«فرصة؛ مناسَبة.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(فَرَصَ) الْفَاءُ وَالرَّاءُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اقْتِطَاعِ شَيْءٍ عَنْ شَيْءٍ. ثُمَّ يُقَالُ لِلنُّهْزَةِ فُرْصَةٌ، لِأَنَّهَا خِلْسَةٌ، كَأَنَّهَا اقْتِطَاعُ شَيْءٍ بِعَجَلَةٍ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يربط ابن فارس بين الفرصة والنهزة ويُرجعهما إلى أصل الاقتطاع بعجلة"
        - text: "«فُرْصة: من (ف ر ص) النوبة والمدة الزمنية والوقت المناسب.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يوسّع الدلالة لتشمل النوبة والمدة الزمنية والوقت المناسب"
    - lemma: "سَانِحَة"
      confirm:
        - text: "«سنَحَ لى رأى في كذا، أي عَرَض.»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      contradicts:
        - text: "«السَنيحُ والسانِحُ: ما ولاّك مَيامِنَه من ظَبْي أو طائرٍ أو غيرهما»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          conflict: "الدلالة الأصلية للسانحة مرتبطة بالتفاؤل بالطير لا بالفرصة بمعناها المعاصر"
      expands:
        - text: "«(سَنَحَ) السِّينُ وَالنُّونُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يُحْمَلُ عَلَى ظُهُورِ الشَّيْءِ مِنْ مَكَانٍ بِعَيْنِهِ... ثُمَّ اسْتُعِيرَ هَذَا فَقِيلَ: سَنَحَ لِي رَأْيٌ فِي كَذَا، أَيْ عَرَضَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الاستعارة انتقلت إلى عروض الرأي والخاطر، لا إلى الفرصة بمعنى الوقت المناسب"
    - lemma: "نُهْزَة"
      confirm:
        - text: "«النُّهْزَةُ: الفُرْصَة. هو نُهْزَة المختلِس: صَيْدٌ لكلِّ أحد»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(النهزة) الفرصة (ج) نهز ويُقال هُوَ نهزة المختلس صيد لكل أحد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
      expands:
        - text: "«(نَهَزَ) النُّونُ وَالْهَاءُ وَالزَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى حَرَكَةٍ وَنُهُوضٍ وَتَحْرِيكِ الشَّيْءِ. فَالنَّهْزُ: النُّهُوضُ لِتَنَاوُلِ الشَّيْءِ ; وَمِنْهُ انْتِهَازُ الْفُرْصَةِ. وَالنُّهْزَةُ: كُلُّ مَا أَمْكَنَكَ انْتِهَازُهُ يُقَالُ قَدْ أَعْرَضَ فَانْتَهِزْ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يبيّن أن أصل النهز هو النهوض لتناول الشيء، فالنهزة هي كل ما أمكن تناوله واغتنامه"
    - lemma: "مُوَاتَاة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "فُرْصَة"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة مؤصَّلة في المعاجم الكلاسيكية والمعاصرة. المعجم الوسيط يعرّفها بالنوبة
        والوقت المناسب للقيام بعمل ما. مقاييس اللغة يربطها بالاختلاس والاقتطاع بعجلة.
        هي اللفظة المعيارية الأكثر تداولاً في الفصحى المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُرْصَة"

    - lemma: "نُهْزَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مرادف تراثي مباشر. المعجم الوسيط يُعرّف النهزة بالفرصة صراحة.
        مقاييس اللغة يؤكد أن أصل المادة النهوض لتناول الشيء، ومنه انتهاز الفرصة.
        لفظة فصيحة أصيلة تُثري المجموعة بمرادف تراثي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "نُهْزَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14507501-n"}

    - lemma: "سَانِحَة"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الأصلية مرتبطة بالتفاؤل بالطير الذي يمر من اليمين. الاستعارة في المعاجم
        انتقلت إلى عروض الرأي والخاطر (سنح لي رأي) لا إلى الفرصة بمعنى الوقت المناسب
        والظروف المواتية. لا يوجد شاهد معجمي يؤكد استخدام «سانحة» اسماً بمعنى الفرصة
        في الفصحى المعيارية.
      evidence_assessment:
        case: mixed

    - lemma: "مُوَاتَاة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجَد أدلة معجمية على استخدام «مواتاة» اسماً بمعنى الفرصة.
        المادة (و ت ي) تدل على الموافقة والملاءمة وهي أقرب إلى الصفة أو الحال
        منها إلى الاسم الدال على الحين المناسب. لا تثبيت معجمي لها بهذا المعنى.
      evidence_assessment:
        case: no_material

