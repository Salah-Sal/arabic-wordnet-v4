# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-09927024-n  |  ILI: i88908  |  POS: n
# English gloss: a maker (and seller) of candles and soap and oils and paints
# Reviewed: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. التوليد الأعمى (من التعريف المُقنَّع فقط، بدون الاطّلاع على اللمّات)
  blind_candidates:
    - lemma: "شَمَّاع"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (شمع) على وزن فَعَّال الدال على الاحتراف والتكرار؛
        وهو الوزن الاصطلاحي للحِرَفيين في العربية (نجّار، حدّاد، زجّاج).
        الشمع هو أبرز منتجات هذا الحرفي وأشهرها، وقد جرى العرف باشتقاق
        الحرفة من أبرز مواد صنعتها.

    - lemma: "زَيَّات"
      generation_method: ishtiqaq
      justification: >
        مشتق من (زيت) على وزن فَعَّال؛ تاجر الزيوت ومُعتصِرها. أحد المنتجات
        الرئيسية في التعريف هو الزيوت، وقد استُخدم هذا اللقب تاريخياً لمن
        يعصر الزيت ويبيعه.

    - lemma: "دَهَّان"
      generation_method: ishtiqaq
      justification: >
        مشتق من (دهن) على وزن فَعَّال؛ بائع الدُّهْن ومن يحترف الدهن.
        الدهانات من مكوّنات التعريف الأساسية، وهذا الوزن مُطَّرد لمحترفي
        المواد الدهنية.

    - lemma: "عَطَّار"
      generation_method: majaz
      justification: >
        إزاحة دلالية؛ العطّار في الثقافة العربية يبيع الزيوت العطرية والأعشاب
        الطبية والصابون والأقاوية — وهي منتجات تتقاطع مع منتجات الشاندلر.
        إحياء لمعنى أشمل عبر التوسّع في دلالة الوظيفة التجارية.

  # ب. التقييم الأولي (بعد الاطّلاع على اللمّات الموجودة)
  assessment:
    concerns:
      - >
        اللمّة الأولى "تاجر مؤن" تشير إلى التاجر العام في المؤن والإمدادات،
        وهي دلالة أوسع من المفهوم المحدد (صانع ومزوّد شموع وصابون وزيوت
        ودهانات). يُخشى الخلط مع مفهوم المموِّن أو المزوِّد العسكري.
      - >
        اللمّة الثانية "صانع شموع" تغطي جزءاً واحداً من المفهوم (الشموع فقط)
        وتُهمل الصابون والزيوت والدهانات. فضلاً عن ذلك فهي عبارة وصفية
        حرّة لا مصطلح مسكوك.
      - >
        كلتا اللمّتين الموجودتين تفتقران إلى التشكيل الكامل.
    observations: >
      المجموعة الترادفية تعبّر عن مفهوم مهني مركّب يجمع صناعة الشموع
      والصابون وتجارة الزيوت والدهانات، وهو ما عُرف بـ"الشاندلر" في
      الإنجليزية. تاريخياً في العربية كان الشَّمَّاع (فَعَّال من شمع) هو
      الاسم المعجمي المُثبَت لصانع الشمع وتاجره، وهو أقرب مقابل عربي
      أصيل لهذا المفهوم. اللمّة "تاجر مؤن" تُعبّر عن مفهوم تجاري مختلف
      (المموِّن العام)، أما "صانع شموع" فهي ترجمة حرفية جزئية لا ترقى
      إلى مستوى المصطلح المسكوك.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:

  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "تاجر مؤن"
      contradicts:
        - text: >
            «مَانَهُ يَمُونُهُ مَوْناً إِذَا احْتَمَلَ مَؤُونَتَهُ وَقَامَ
            بِكِفَايَتِهِ»
          source: "تاج اللغة وصحاح العربية للجوهري"
          conflict: >
            المعنى الأصلي للمون هو القيام بالكفاية والإنفاق على العيال،
            وليس صناعة الشموع أو بيع مستلزمات الإضاءة. "تاجر مؤن" مصطلح
            للتاجر العام في المؤن والإمدادات، لا صانع الشموع والصابون.
        - text: >
            «مُوَّن ابنَه: أَنْفَقَ عَلَيْهِ وَزَوَّدَهُ بِمَا يَحْتَاجُهُ
            مِن مَأْكَلٍ وَمَلْبَسٍ وَغَيْرِهِمَا»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: >
            سياق "التموين" في المعاجم الحديثة يدور حول الإمداد بالغذاء
            والمؤن العامة، لا صناعة الشموع والزيوت والدهانات.

    - lemma: "صانع شموع"
      evidence_status: "no_material_found"

    # ── مرشحات المرحلة ١ ──

    - lemma: "شَمَّاع"
      confirm:
        - text: >
            «مَنْ يَعْمَلُ الشَّمَعَ بَائِعُهُ»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «المَزَّاحُ صَانِعُ الشَّمَعِ وَتَاجِرُهُ»
          source: "المعجم الوسيط"
        - text: >
            «صَانِعُ الشَّمَعِ وَتَاجِرُهُ»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: >
            «صَانِعُ الشَّمَعِ وَتَاجِرُهُ، وَالْكَثِيرُ الطَّرَبِ
            وَالْمِزَاجِ»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >
            «(1) الشَّمَّاع: صَانِعُ الشُّمُوعِ أَوْ بَائِعُهَا
             (2) السَّمَّانُ؛ الْبَقَّالُ.»
          source: "المورد الحديث (2008) — ترجمة مدخل chandler"
      expands:
        - text: >
            «(1) الْمَشْمَعَةُ: مَوْضِعٌ تُحْفَظُ فِيهِ الشُّمُوعُ
             (2) الشِّمَاعَةُ: صِنَاعَةُ الشَّمَّاعِ
             (3) بِضَاعَةُ الشَّمَّاعِ [أَوِ السَّمَّانِ إِلَخ]»
          source: "المورد الحديث (2008) — ترجمة مدخل chandlery"
          addition: >
            يُثبَت "الشِّمَاعَة" كمصدر صناعي لمهنة الشمّاع، مما يؤكد
            رسوخ الاشتقاق وثبوته معجمياً.

    - lemma: "زَيَّات"
      confirm:
        - text: >
            «بَائِعُ الزَّيْتِ. مُعْتَصِرُهُ.»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «عَاصِرُ الزَّيْتِ وَبَائِعُهُ»
          source: "المعجم الوسيط"
        - text: >
            «عَاصِرُ الزَّيْتِ وَبَائِعُهُ»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: >
            «عَاصِرُ الزَّيْتِ وَبَائِعُهُ»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            الزيّات مخصّص للزيوت فقط، لا يشمل الشموع والصابون والدهانات
            التي يضمّها المفهوم المحدَّد.

    - lemma: "دَهَّان"
      confirm:
        - text: >
            «بَائِعُ الدُّهْنِ مَنْ حِرْفَتُهُ الدَّهْنُ»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «بَائِعُ الدَّهْنِ وَمَنْ حِرْفَتُهُ الدَّهْنُ»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: >
            «بَائِعُ الدَّهْنِ، وَمَنْ حِرْفَتُهُ الطِّلَاءُ»
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: >
            «painter»
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2 (ARABTERM)"
          conflict: >
            المصطلح التقني الحديث يُقيَّد بمعنى "الدهّان" (طلاء الجدران)
            وليس صانع الشموع أو تاجر مستلزمات الإضاءة. هذا الاشتراك
            اللفظي يُضعف صلاحيته كمقابل منفرد.

    - lemma: "عَطَّار"
      contradicts:
        - text: >
            «بَائِعُ الْعِطْرِ يُطْلَقُ عَلَى بَائِعِ الْأَقَاوِيَةِ»
          source: "المعجم الوسيط"
          conflict: >
            مجال العطّار هو العطور والأعشاب والأقاوية، وليس الشموع
            والصابون والدهانات. لا تحقق الإزاحة الدلالية المطلوبة.
        - text: >
            «بَائِعُ الْعِطْرِ وَيُطْلَقُ عَلَى بَائِعِ الْأَفَاوِيهِ»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: >
            دلالة العطار لا تمتد إلى الشموع والزيوت الصناعية في المعجم
            الحديث، وإدراجه يُفضي إلى الخلط مع مفهوم العطر والتوابل.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "تاجر مؤن"
      decision: removed
      decision_reason: >
        أولاً: المفهوم الدلالي مُخالِف — "تاجر مؤن" يُعبّر عن مُزوِّد عام
        للإمدادات والغذاء، بينما المقصود في المجموعة صانع الشموع والصابون
        والزيوت والدهانات تحديداً. ثانياً: هي عبارة وصفية حرّة لا مصطلح
        مسكوك — يمكن إبدال "مؤن" بـ"غذاء" أو "بضائع" ويبقى الوصف منطقياً
        (اختبار الاستبدال). ثالثاً: تفتقر إلى أي توثيق معجمي يربطها
        بمفهوم صانع الشموع. الإجراء: remove_sense.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "صانع شموع"
      decision: removed
      decision_reason: >
        أولاً: عبارة وصفية حرّة لا تعبير اصطلاحي ثابت — يفشل اختبار
        الاستبدال (يمكن قول "صانع الشمع" أو "عامل الشموع" وكلاهما صحيح
        وصفاً). ثانياً: التغطية جزئية — تقتصر على الشموع وتُهمل الصابون
        والزيوت والدهانات التي هي جزء أصيل من تعريف المجموعة. ثالثاً: لا
        توثيق معجمي يُسكِّكها كمصطلح لهذه المهنة المركّبة. الإجراء:
        remove_sense.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──

    - lemma: "شَمَّاع"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك موثّق في أُمَّهات المعاجم العربية الكلاسيكية والحديثة
        بدلالة "صانع الشمع وتاجره"، وهي الوظيفة المحورية للمجموعة. المورد
        الحديث (2008) يُورده صراحةً كمقابل لـchandler. يستوفي معايير
        الجودة الستة: مطّرد صرفياً (فَعَّال للحرف)، يسير التداول، ملائم
        ثقافياً، عربي أصيل، قابل للاشتقاق (شِماعة، مشمعة). اختبار التثبيت
        المعجمي ناجح — الكلمة مسجّلة وحدة معجمية مستقلة، لا وصفاً حراً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المُقرَّرة في المجموعة؛ تجمع بين الصنعة والتجارة
        (صانع وبائع)، وقد توسّع الشمّاع تاريخياً إلى بيع الصابون والزيوت
        باعتبارها منتجات مشتقّة من الشمع والدهون.
      actions:
        - command: create_entry
          params:
            lemma: "شَمَّاع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "زَيَّات"
      source: stage1
      decision: removed
      decision_reason: >
        الزيّات مخصَّص للزيوت فقط ("بائع الزيت، معتصره") ولا يشمل
        الشموع والصابون والدهانات. إدراجه في هذه المجموعة يُفضي إلى تعميم
        دلالي خاطئ. الفرق الدلالي جوهري وغير قابل للتجسير.

    - lemma: "دَهَّان"
      source: stage1
      decision: removed
      decision_reason: >
        الدهّان محدود بالدهون والطلاء (paints)، ويحمل في المصطلح التقني
        الحديث معنى "painter" (الدهّان المعماري)؛ مما يُفضي إلى اشتراك
        لفظي مُخلٌّ. لا يُغطّي الشموع والصابون التي هي جزء أصيل من
        المجموعة.

    - lemma: "عَطَّار"
      source: stage1
      decision: removed
      decision_reason: >
        الإزاحة الدلالية المقترحة مرفوضة — المعاجم تُقيِّد العطّار بالعطور
        والأعشاب الطبية والأفاويه، وهو مجال مختلف جوهرياً عن صناعة الشموع
        والصابون والدهانات. لا تحقق إزاحة قابلة للتوثيق أو قائمة على
        مشابهة وظيفية كافية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:

  definition:
    current: "صانع (وبائع) للشموع والصابون والزيوت والدهانات"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزية — الأقواس في العربية الرسمية
        تُستخدم بشكل مختلف، وصياغة "صانع (وبائع)" تنقل البنية الإنجليزية
        مباشرة. يستحسن تعريف مصطلحي يُقدّم الجنس القريب (حرفي أو تاجر)
        ثم الفصل النوعي، وتعريف موسوعي يُوضّح السياق التاريخي للمهنة.
    authored:
      - type: terminological
        text: >
          حِرْفِيٌّ يَشْتَغِلُ بِصِنَاعَةِ الشُّمُوعِ وَالصَّابُونِ
          وَيَتَّجِرُ فِي الزُّيُوتِ وَالدَّهَانَاتِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مِهْنَةٌ حِرْفِيَّةٌ تَاريخِيَّةٌ جَمَعَتْ بَيْنَ صِنَاعَةِ
          الشُّمُوعِ مِنَ الشَّمَعِ وَالدُّهُونِ، وَتَصْنِيعِ الصَّابُونِ،
          وَبَيْعِ الزُّيُوتِ وَالدَّهَانَاتِ، وَكَانَتْ شَائِعَةً فِي
          الحَرَفِ الأُورُوبِّيَّةِ فِي العُصُورِ الوُسْطَى وَمَا
          تَلَاهَا
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حِرْفِيٌّ يَشْتَغِلُ بِصِنَاعَةِ الشُّمُوعِ وَالصَّابُونِ وَيَتَّجِرُ فِي الزُّيُوتِ وَالدَّهَانَاتِ"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "مِهْنَةٌ حِرْفِيَّةٌ تَاريخِيَّةٌ جَمَعَتْ بَيْنَ صِنَاعَةِ الشُّمُوعِ مِنَ الشَّمَعِ وَالدُّهُونِ، وَتَصْنِيعِ الصَّابُونِ، وَبَيْعِ الزُّيُوتِ وَالدَّهَانَاتِ، وَكَانَتْ شَائِعَةً فِي الحَرَفِ الأُورُوبِّيَّةِ فِي العُصُورِ الوُسْطَى وَمَا تَلَاهَا"

  examples:
    per_lemma:
      - lemma: "شَمَّاع"
        examples:
          - text: >
              كَانَ الشَّمَّاعُ يَعْمَلُ مِنَ الصَّبَاحِ الْبَاكِرِ يَصُبُّ
              الشَّمَعَ الذَّائِبَ فِي قَوَالِبَ أَسْطُوَانِيَّةٍ، ثُمَّ
              يَعْرِضُ بَضَائِعَهُ مِنَ الشُّمُوعِ وَالصَّابُونِ عَلَى
              بَابِ دُكَّانِهِ
            type: usage
    actions:
      - command: add_sense_example
        params:
