stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «علاقة سرية» عبارة وصفية عامة لا تختص بالحب؛ فقد تعني أي علاقة خفية (تجارية، استخبارية، إلخ)"
      - "اللمّة تفتقر إلى التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط؛ ينبغي إثراؤها بمرادفات تراثية"
    observations: "المفهوم المقصود — علاقة حب مستترة — له حضور قوي في التراث العربي الأدبي والفقهي. مصطلح «خِدْن» و«مُخَادَنَة» يحمل هذا المعنى بدقة في القرآن الكريم والمعاجم الكلاسيكية. كذلك «سِفَاح» يدل على العلاقة الجنسية خارج عقد النكاح لكنه أضيق دلالةً وأشد سلبيةً من المفهوم المطلوب."
  blind_candidates:
    - lemma: "مُخَادَنَة"
      generation_method: ishtiqaq
      justification: "مصدر «خَادَنَ» على وزن مُفَاعَلَة، من جذر خ د ن الدالّ على المصاحبة في السرّ. القرآن الكريم يستعمل «أخدان» بمعنى الأصدقاء السريين لشهوة، فالمخادنة هي فعل اتخاذ الخِدْن أي العلاقة السرية ذات الطابع العاطفي"
    - lemma: "سِفَاح"
      generation_method: ishtiqaq
      justification: "من جذر س ف ح على وزن فِعَال، يدل في الفقه على العلاقة الجنسية بغير عقد نكاح. لكنه أقرب إلى الزنا منه إلى مطلق العلاقة الغرامية السرية"
    - lemma: "غَرَامٌ سِرِّيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «غَرَام» (الحب اللازم) و«سِرِّيّ» (المنسوب إلى السرّ). يصف المفهوم بدقة لكنه تعبير وصفي حرّ وليس وحدة معجمية مسكوكة"
    - lemma: "عِشْقٌ مَسْتُور"
      generation_method: tarkib
      justification: "مركب وصفي من «عِشْق» (الحب الشديد) و«مَسْتُور» (المخفيّ). يؤدي المعنى لكنه كسابقه عبارة وصفية حرة لا مصطلح ثابت"

stage2_evidence:
  per_lemma:
    - lemma: "عَلَاقَة سِرِّيَّة"
      expands:
        - text: "«(العلاقة) الصداقة والحب اللازم للقلب وما تتبلغ به البهائم من الشجر وما يكتفى به من العيش وما يتعلق به الإنسان من صناعة وغيرها و(في علم البيان) المناسبة بين المعنى الأصلي والمعنى المراد في المجاز والكناية»"
          source: "المعجم الوسيط"
          addition: "العَلاقة بالفتح تشمل الحب اللازم للقلب، مما يدعم استعمالها في السياق العاطفي"
        - text: "«(7) علاقة غرامية [سرّيّة أو غير شرعية].»"
          source: "المورد الحديث (2008) — مدخل intrigue"
          addition: "الترجمة العربية لـ intrigue تتضمن صراحةً «علاقة غرامية سرية» مما يدعم المركب في هذا السياق"
    - lemma: "مُخَادَنَة"
      confirm:
        - text: "«(خَدَنَ) الْخَاءُ وَالدَّالُ وَالنُّونُ أَصْلٌ وَاحِدٌ، وَهُوَ الْمُصَاحَبَةُ. فَالْخِدْنُ: الصَّاحِبُ. يُقَالُ: خَادَنْتُ الرَّجُلَ مُخَادَنَةً. وَخِدْنُ الْجَارِيَةِ مُحَدِّثُهَا.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الخدن: بالكسر، الصاحب وأكثر ما يستعمل فيما يصاحب لشهوة، ذكره الراغب. وقال أبو البقاء: الصديق المصافي. وقيل الصديق في السر.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الخدن) الصّديق والصديق في السِّرّ (للذّكر والأنثى) (ج) أخدان وفي التنزيل العزيز {وآتوهن أجورهنّ بالمعروف محصنات غير مسافحات ولا متخذات أخدان} وفيه {ولا متخذي أخدان}»"
          source: "المعجم الوسيط"
        - text: "«الصَّديق الصديق فى السِّرِّ (للذكر والأنثى)»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«الخِدْنُ، بالكسر وكأَميرٍ: الصاحِبُ، ومَن يُخادِنُكَ في كلِّ أمْرٍ ظاهِرٍ وباطِنٍ.»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يوسّع دلالة الخدن إلى المصاحبة في كل أمر ظاهر وباطن، لا في السرّ فحسب"
        - text: "«الصديقُ. للذَّكَرِ والأُنْثَى وقيل: الصَّدِيقُ في السِّرِّ الصاحبُ وقيل: الصاحبُ المُحدِّث وقيل: الذى يُحادِثُك، فيكون معَك في كلِّ أمْرٍ ظاهِرٍ وباطن»"
          source: "المعجم الكبير"
          addition: "يضيف معنى المحادثة والمصاحبة الشاملة"
    - lemma: "سِفَاح"
      confirm:
        - text: "«السِّفَاح: الزنا.»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«الزنا، وهو الزواج بغير عقد ولا خطر»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«السِّفَاحُ: الزِّنَا والفجورُ؛ وسُمِّى الزِّنَا سِفاحًا لأنه كان على غيرِ عَقدٍ، كأنه بمنزلةِ الماء المسفوحِ الذى لا يَحْبِسه شىءٌ»"
          source: "المعجم الكبير"
          conflict: "السفاح يدل على الزنا والفجور تحديداً، وهو أضيق وأشد سلبية من مفهوم «علاقة حب سرية» الذي قد يكون بريئاً نسبياً"
        - text: "«(سَفَحَ) السِّينُ وَالْفَاءُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِرَاقَةِ شَيْءٍ... وَالسِّفَاحُ: صَبُّ الْمَاءِ بِلَا عَقْدِ نِكَاحٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الاشتقاقي يدل على الإراقة والهدر، مما يحمل دلالة سلبية شديدة لا تناسب مطلق العلاقة الغرامية السرية"
    - lemma: "غَرَامٌ سِرِّيّ"
      expands:
        - text: "«(غَرَمَ) الْغَيْنُ وَالرَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مُلَازَمَةٍ وَمُلَازَّةٍ... وَالْغَرَامُ: الْعَذَابُ اللَّازِمُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الغرام في الأصل العذاب اللازم، ثم توسّع للحب الشديد الملازم، لكن المركب «غرام سري» غير مسجّل في المعاجم"
    - lemma: "عِشْقٌ مَسْتُور"
      evidence_status: "no_material_found"

