# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11339129-n  |  ILI: i97028  |  POS: n
# العلم: إدوارد دوريل ستون، معماري أمريكي (1902-1978)
# ══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة اسم علم خاص (proper noun) لشخص تاريخي بعينه؛ وهو سياق هامشي في التوليد الأعمى إذ لا يمكن اقتراح الاسم دون معرفته مسبقاً"
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل الإلزامي"
      - "لمّة 'ستون' منفردةً تُلتبس بالعدد العربي سِتُّون (= sixty) عند غياب التشكيل؛ وهو إشكال يُوجب التشكيل لإزالة اللبس"
      - "التعريف الحالي 'معماري أمريكي (1902-1978)' لا يحمل تشكيلاً وخالٍ من أدنى توصيف موسوعي"
      - "تصنيف POS على مستوى المداخل يُفضَّل أن يكون proper_noun لا noun مجرداً؛ وإن كان n مقبولاً باصطلاح WordNet للأعلام"
    observations: >
      هذه المجموعة خاصة بعَلَم تاريخي بعينه: المعماري الأمريكي إدوارد دوريل ستون (1902-1978).
      التوليد الأعمى في مثل هذه الحالات مقيَّد بمنهج التعريب حصراً، إذ لا سبيل إلى اقتراح اسم
      علم شخص أجنبي بمناهج الاشتقاق أو المجاز المصطلحي. مرشح "الحَجَّار" (تعريب دلالي لـ Stone)
      محاولة مجازية، غير أن الأسماء الشخصية لا تُترجم معجمياً في التقليد العربي بل تُنقل صوتياً.
      التعريف الحالي وجيز وظيفياً مقبول لأسماء الأعلام في قواعد WordNet، لكنه يحتاج تشكيلاً
      وإثراءً موسوعياً طفيفاً.
  blind_candidates:
    - lemma: "إِدْوَارد سْتُون"
      generation_method: taarib
      justification: "تعريب مختصر للاسمين الأول والأخير — الصيغة الأوسع تداولاً في الصحافة العربية للإشارة الموجزة إلى هذا المعماري"
    - lemma: "إِدْوَارد دُورِيل سْتُون"
      generation_method: taarib
      justification: "تعريب كامل للاسم الثلاثي — الصيغة الرسمية المستخدمة في المصادر الأكاديمية والموسوعية العربية"
    - lemma: "سْتُون"
      generation_method: taarib
      justification: "الاسم الأخير منفرداً بوصفه مختصراً متداولاً في المصادر العربية، مع التنبيه على إمكان الالتباس بالعدد 'سِتُّون' عند إغفال التشكيل"
    - lemma: "الحَجَّارُ"
      generation_method: majaz
      justification: "الحَجَّار في العربية = من يعمل في الحجر؛ ترجمة دلالية لـ Stone كلقب مجازي، لكنها لا تصلح تعريباً لاسم علم شخصي إذ الأسماء الشخصية الأعجمية تُنقل صوتياً لا تُترجم دلالياً"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "إدوارد دوريل ستون"
      evidence_status: "no_material_found"

    - lemma: "ستون"
      expands:
        - text: "«ستون — عن الإنجليزية القديمة بمعنى مكان بجوار البحر. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكد أن 'ستون' مُستخدَم في العربية اسمَ عَلَمٍ للذكور منقولاً عن الإنجليزية القديمة، مما يدعم قبوله لمّةً لاسم علم مُعرَّب"
      contradicts:
        - text: "«السِّتُّونَ — من العدد: ست عشرات (للمذكر والمؤنث)»"
          source: "المعجم الوسيط"
          conflict: "هجاء 'ستون' دون تشكيل يُلتبس بالعدد العربي سِتُّون = 60؛ إلا أن التشكيل يُزيل اللبس قطعياً: سْتُون ≠ سِتُّون"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِدْوَارد سْتُون"
      evidence_status: "no_material_found"

    - lemma: "إِدْوَارد دُورِيل سْتُون"
      evidence_status: "no_material_found"

    - lemma: "سْتُون"
      expands:
        - text: "«ستون — عن الإنجليزية القديمة بمعنى مكان بجوار البحر. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يدعم قبول 'ستون/سْتُون' اسمَ علمٍ في العربية للذكور"

    - lemma: "الحَجَّارُ"
      confirm:
        - text: "«الحَجَّار — الذي يعمل في الحجر»"
          source: "المعجم الوسيط"
        - text: "«الحَجَّار — الذي يعمل في الحجر»"
          source: "المعجم الكبير"
        - text: "«حجّار — lapidary»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
      contradicts:
        - text: "«الحَجَّار — الذي يعمل في الحجر»"
          source: "المعجم الوسيط"
          conflict: "الكلمة اسم نكرة مشترك للدلالة على الحرفة، ولا توجد شواهد على استخدامها لقباً لعَلَم شخصي بعينه؛ ولا يجوز في التقليد العربي ترجمة أسماء الأشخاص الأعجمية دلالياً"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى الموجودة ──
    - lemma: "إدوارد دوريل ستون"
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل للمعماري الأمريكي وهو اللمّة الأساسية في المجموعة. لا يوجد في
        قاعدة البيانات مدخل معجمي خاص به لكون أسماء الأعلام التاريخية نادراً ما تُدرج في
        المعاجم العامة. الاسم مستخدم موثَّق في المصادر الموسوعية العربية. يستلزم تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الثلاثي الرسمي الكامل؛ يُستخدم في السياقات الأكاديمية والموسوعية حيث يُشترط التمييز الكامل عن غيره من حاملي اسم 'ستون'"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِدْوَارد دُورِيل سْتُون"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "ستون"
      decision: confirmed
      decision_reason: >
        الاسم الأخير منفرداً (Stone)، مستخدم في المصادر العربية الموثوقة كاختصار شائع.
        موسوعة السلطان قابوس لأسماء العرب تدرجه اسمَ علَمٍ للذكور منقولاً عن الإنجليزية.
        الالتباس مع العدد سِتُّون مقبول الإزالة بالتشكيل الكامل: سْتُون ≠ سِتُّون.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الاسم الأخير مختصراً؛ يُستخدم في السياقات الصحفية والتقنية الموجزة حيث يُفهم الاسم من السياق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سْتُون"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِدْوَارد سْتُون"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مختصرة تحذف الاسم الأوسط 'دوريل'؛ تتعارض مع مبدأ الدقة لأسماء الأعلام التاريخية
        إذ توجد شخصيات أخرى تُدعى 'Edward Stone'. اللمّة المؤكدة (الاسم الكامل) تستوعب هذا
        المستوى من الدقة، ولا حاجة لإضافة شكل أقل دقة.

    - lemma: "إِدْوَارد دُورِيل سْتُون"
      source: stage1
      decision: removed
      decision_reason: >
        مرادف تام للمّة الموجودة بعد تصحيح تشكيلها؛ إضافته تكرار لا مسوّغ له.

    - lemma: "سْتُون"
      source: stage1
      decision: removed
      decision_reason: >
        مرادف تام للمّة الموجودة 'ستون' بعد تصحيح تشكيلها؛ اكتفاء بإجراء update_lemma
        على اللمّة الموجودة بدلاً من إضافة مدخل جديد.

    - lemma: "الحَجَّارُ"
      source: stage1
      decision: removed
      decision_reason: >
        اسم نكرة وصفي يدل على الحرفة (من يعمل في الحجر) لا على اسم علم شخصي.
        في التقليد العربي لا تُترجم أسماء الأشخاص الأعجمية دلالياً بل تُنقل صوتياً.
        استخدام 'الحجار' لقباً لإدوارد ستون تحريف يفتقر لأي سند موسوعي عربي.


