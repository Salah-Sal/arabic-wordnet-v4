stage1_review:
  assessment:
    concerns:
      - غياب التشكيل الكامل عن اللمة الأصلية (خليج غوانتانامو).
      - التعريف العربي الحالي ترجمة حرفية مقتضبة للتعريف الإنجليزي.
    observations: "المصطلح اسم علم جغرافي مركب (MWE)، والتعريب الصوتي لـ (Guantanamo) مستقر في الاستعمال العربي المعاصر."
  blind_candidates:
    - lemma: "خَلِيجُ غُوانْتَانَامُو"
      generation_method: tarkib
      justification: "الاسم الجغرافي القياسي والمنتشر في التقارير الإخبارية والجغرافية."
    - lemma: "جَوْنُ غُوانْتَانَامُو"
      generation_method: tarkib
      justification: "استخدام 'جون' كمرادف دقيق لـ (Bay) في بعض السياقات الجغرافية، وإن كان أقل شيوعاً."
    - lemma: "مَرْسَى غُوانْتَانَامُو"
      generation_method: tarkib
      justification: "يركز على الوظيفة الملاحية والعسكرية للمكان، وهو مستخدم في بعض المصادر التاريخية."
    - lemma: "شَرْمُ غُوانْتَانَامُو"
      generation_method: tarkib
      justification: "استخدام 'شرم' كمرادف محلي/إقليمي لـ (Inlet)، وإن كان غير قياسي لهذا الموقع تحديداً."

stage2_evidence:
  per_lemma:
    - lemma: "خليج غوانتانامو"
      evidence_status: "no_material_found"
    - lemma: "خَلِيج"
      confirm:
        - text: "«الخَلِيجُ: ما انقَطَعَ من النهرِ ومالَ عنه، وجَنَاحا النَّهْرِ، وجَنَاحا البَحْرِ، ومَسِيلُ الماءِ»"
          source: "المحيط في اللغة"
        - text: "«خَلِيجٌ: جَنَاحُ البَحْرِ إِذا مالَ إِلى الأَرْضِ، مَسِيلُ الماءِ إِذا كانَ مَائِلًا، كُلُّ قِطْعَةٍ تَنْفَصِلُ مِنَ النَّهْرِ أَوِ البَحْرِ»"
          source: "المعجم الوسيط"
    - lemma: "بحر الكاريبي"
      confirm:
        - text: "«بحر الكاريبي»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"

stage3_analysis:
  per_lemma:
    - lemma: "خليج غوانتانامو"
      decision: confirmed
      decision_reason: "الاسم الجغرافي الصحيح والوحيد لهذا الموقع في اللغة العربية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ غُوانْتَانَامُو"
    - lemma: "جَوْنُ غُوانْتَانَامُو"
      source: stage1
      decision: removed
      decision_reason: "أقل شيوعاً من 'خليج' ولا توجد ضرورة لإضافته كمصطلح مرادف رسمي."
    - lemma: "مَرْسَى غُوانْتَانَامُو"
      source: stage1
      decision: removed
      decision_reason: "يشير غالباً إلى المرفأ أو القاعدة البحرية وليس إلى المسطح المائي (الخليج) بالكامل."
    - lemma: "شَرْمُ غُوانْتَانَامُو"
      source: stage1
      decision: removed
      decision_reason: "مصطلح إقليمي لا يستخدم عادة لوصف هذا الموقع الجغرافي الكوبي."

stage4_content:
  definition:
    current: "مدخل للبحر الكاريبي؛ تم إنشاء محطة بحرية للولايات المتحدة على الخليج عام 1903"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية؛ يحتاج لأسلوب معجمي يحدد الموقع الجغرافي بشكل أدق."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ يَقَعُ فِي جَنُوبِ شَرْقِ كُوبَا، وَهُوَ مَدْخَلٌ لِلْبَحْرِ الْكَارِيبِيِّ، تُوجَدُ بِهِ قَاعِدَةٌ بَحْرِيَّةٌ أَمْرِيكِيَّةٌ أُنْشِئَتْ عَامَ ١٩٠٣م."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَلِيجٌ يَقَعُ فِي جَنُوبِ شَرْقِ كُوبَا، وَهُوَ مَدْخَلٌ لِلْبَحْرِ الْكَارِيبِيِّ، تُوجَدُ بِهِ قَاعِدَةٌ بَحْرِيَّةٌ أَمْرِيكِيَّةٌ أُنْشِئَتْ عَامَ ١٩٠٣م."
  examples:
    per_lemma:
      - lemma: "خليج غوانتانامو"
        examples:
          - text: "يُعدُّ خليجُ غوانتانامو مَوْقِعًا لِأَقْدَمِ قَاعِدَةٍ بَحْرِيَّةٍ خَارِجِيَّةٍ لِلْوِلَايَاتِ الْمُتَّحِدَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعدُّ خليجُ غوانتانامو مَوْقِعًا لِأَقْدَمِ قَاعِدَةٍ بَحْرِيَّةٍ خَارِجِيَّةٍ لِلْوِلَايَاتِ الْمُتَّحِدَةِ."

