# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "صانع نماذج"
      decision: confirmed
      decision_reason: >
        اللمّة مركب إضافي سليم بنيويًا ودلاليًا. المعجم التقني العربي (ARABTERM) يوثِّق الصيغة
        المعجمية «صانع النماذج الخشبية» لـ«wood pattern maker» في مجال البناء والنجارة، مما يُثبت
        أن هذا التركيب الإضافي راسخ في المعجمية التقنية العربية. الجذر «صنع» مُعجَّم في مقاييس
        اللغة بمعنى إتقان الصنع والحرفة. اللمّة تحتاج تحديث التشكيل وإضافته.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُعبِّر عن المهنة بصورتها الجامعة الشاملة لجميع ميادين
        صناعة النماذج (خياطة ونجارة وأشغال معدنية) دون التقيّد بميدان واحد. السياق الحرفي
        يُخصِّص «نماذج» بمعنى «قوالب إرشادية» لا «أمثلة» أو «نماذج بيانية».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَانِعُ نَمَاذِجَ"

    - lemma: "مُنَمِّذ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم صحة الاشتقاق الصرفي من الفعل الرباعي «نَمْذَجَ»، لم يُعثَر على أي مدخل معجمي
        يوثِّق «مُنَمِّذ» بهذه الصيغة في قاعدة البيانات. الاستعمال الفعلي لـ«نمذج» يقتصر
        على مجالات الحوسبة والنمذجة الرياضية ولا يشمل مهنة الحرفي اليدوي. كما أن الصيغة
        غير شائعة في النصوص التقنية والإعلامية العربية، مما يُخِلّ بمعيار يُسر التداول.

    - lemma: "مُقَوْلِب"
      source: stage1
      decision: removed
      decision_reason: >
        وإن وُثِّق «مُقَوْلِب التماثيل» في ARABTERM، فإن المدخل مقيَّد تقنياً بمجال صنع قوالب
        التماثيل والقطع النحتية (modeller)، وهو أضيق من نطاق المجموعة الذي يشمل الخياطة
        والنجارة والأشغال المعدنية. يُفضي استخدام «مُقَوْلِب» منفرداً إلى إيهام بالقولبة المادية
        (الصب في قالب) لا إعداد نموذج إرشادي، مما يُنتج انزياحاً دلالياً غير مقصود.

    - lemma: "صَانِعُ القَوَالِبِ"
      source: stage1
      decision: removed
      decision_reason: >
        «صانع القوالب» موثَّق في المعاجم التقنية العربية لكن بدلالات مختلفة (صنع قوالب الوقود،
        صنع القوالب المعدنية الصلبة). فضلاً عن ذلك، يُضيِّق التعبيرُ نطاقَ المجموعة نحو
        الأشغال المعدنية والنجارة، ويُخلّ بشمول مجال الخياطة حيث يشيع مصطلح «النماذج»
        (الباترون) لا «القوالب». الإبقاء على «صانع نماذج» أشمل وأكثر دقة.

    - lemma: "وَاضِعُ النَّمَاذِجِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على أي توثيق معجمي للتعبير «واضع النماذج» في قاعدة البيانات. الصيغة
        وصفية تحليلية لا تُمثِّل وحدة معجمية مسكوكة. اختبار التثبيت المعجمي يُظهر إمكانية
        إبدال «واضع» بـ«مُعِدّ» أو «صانع» مع الحفاظ على المعنى، مما يكشف عن عدم تعسُّفها
        الاصطلاحي. لذا تُرفض وفق اختبار السكّ.


