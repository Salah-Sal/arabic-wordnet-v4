# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «صانع نماذج» تفتقر إلى التشكيل الكامل"
      - "اللمّة مركب إضافي قريب من صياغة التعريف مما يستدعي فحص مبدأ عدم الدوران"
      - "المجموعة لا تحوي إلا لمّة واحدة؛ يستحق المفهوم دراسة إمكانية إضافة مرادف"
      - "«نماذج» في السياق الحِرَفي تعني «قوالب إرشادية» لا «بيانات نموذجية»؛ التعريف الحالي يحتاج توضيح هذه الدلالة التقنية الدقيقة"
    observations: >
      المجموعة تصف حِرْفَةً يدوية متخصصة قوامُها إعداد قوالب وأشكال إرشادية تُستخدم مراجعَ في أعمال الخياطة والنجارة والأشغال المعدنية.
      الجذر الأساسي للمهنة هو «صنع» وهو جذر عريق في العربية. أما «نماذج» فجمعُ «نموذج» الذي يُرجَّح أصلُه الفارسي (نمودار/نمودن)، ويُعاملُ اصطلاحاً على أنه ذو جذر رباعي «نمذج». التعريف الحالي خبري مباشر لكنه لا يُفصِّل الجنس والفصل الكافيَين للتعريف المعجمي الاحترافي.
      المهنة مألوفة في البيئة العربية لكنها تفتقر إلى مصطلح مفرد ثابت مسكوك، مما يجعل المركب الإضافي «صانع نماذج» أوفق الحلول المتاحة في الاستعمال العربي الحديث.

  blind_candidates:
    - lemma: "مُنَمِّذ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل الرباعي «نَمْذَجَ يُنَمْذِج» على وزن مُفَعِّل؛ يصف المتخصص
        في بناء النماذج وصياغتها بصيغة مفردة مُصكَّة تُغني عن المركب الإضافي.
        الفعل «نمذج» مستعمل في الحوسبة والهندسة المعاصرة (نمذجة البيانات، نمذجة الأنظمة).
    - lemma: "مُقَوْلِب"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «قَوْلَبَ يُقَوْلِب» (أدخل في قالب، صنع قالباً) على وزن مُفَعِّل
        مشتق من «قالب» الذي يُرادف «نموذج» في السياق الحرفي (قالب الخياطة، قالب النجارة).
        الجذر «قلب» عريق في العربية ومذكور في مقاييس اللغة بمعنى الانقلاب والتحوّل.
    - lemma: "صَانِعُ القَوَالِبِ"
      generation_method: tarkib
      justification: >
        مركب إضافي يستبدل «نماذج» بـ«القوالب» (جمع قالب) مُركِّزاً على الجانب المادي
        الملموس للمهنة في النجارة والأشغال المعدنية، حيث يشيع مصطلح «قالب» على «نموذج»
        في المعاجم التقنية العربية.
    - lemma: "وَاضِعُ النَّمَاذِجِ"
      generation_method: tarkib
      justification: >
        مركب إضافي يستبدل «صانع» بـ«واضع» (اسم فاعل من وَضَعَ بمعنى أنشأ وأعدّ)
        تفادياً للتكرار مع لفظ التعريف، مع الإبقاء على «النماذج» للدلالة على المنتَج.
        «وضع» يحمل معنى الإعداد الدقيق المنهجي المناسب لصياغة النماذج الإرشادية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دفعية: صانع نماذج + صانع + نموذج + قالب + المرشحات الأربعة
#   ٢. جسر إنجليزي: patternmaker, pattern maker, template maker, mold maker, modeller
#   ٣. FTS عربي: نماذج، خياطة، نجارة، قوالب، نمط
#   ٤. مقاييس اللغة: جذور صنع، قلب، نمط
#   ٥. نموذج/نمذج: التحقق من الجذر وتوثيق البنية الرباعية
