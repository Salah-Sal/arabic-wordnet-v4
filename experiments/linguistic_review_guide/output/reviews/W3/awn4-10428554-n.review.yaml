        - text: "مَن يصنع بيديه مَنْ يحترف الصناعة امرأة صانعة اليدين: ماهرة حَاذِقَةٌ مُجيدة في عمل اليدين"
          source: "المعجم الوسيط، مجمع اللغة العربية — OCR"
