# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عازف"
      decision: confirmed
      decision_reason: >
        اللمّة راسخة في العربية المعاصرة بدلالة العازف على الآلات الموسيقية. ترد
        بكثافة في معاجم الفن والموسيقى (عازف الكمان، عازف منفرد، عازف بارع...). اسم
        فاعل مشتق من جذر صحيح (ع ز ف) على الوزن القياسي (فاعِل). يستوفي معايير
        بوابة الجودة الستة: مطّرد، يسير التداول، ملائم، عربي أصيل، قابل للاشتقاق
        (عزف، معزوفة، مِعزف).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: >
        وزن فاعِل لاسم الفاعل مناسب تماماً لوصف صاحب الحرفة. العزَّاف (صيغة مبالغة)
        يؤكد أن الجذر يقبل الاشتقاق المهني.
      nuance_differentiation: >
        عازف يؤكد الممارسة الفعلية للعزف على الآلات الموسيقية؛ فيه معنى التخصص
        الآلي دون ضرورة ارتباطه بالتأليف أو الأداء الصوتي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَازِف"

    - lemma: "موسيقي"
      decision: confirmed
      decision_reason: >
        على الرغم من أن الأصل اللغوي للكلمة صفةٌ منسوبة (المنسوب إلى الموسيقى)،
        فإن توظيفها اسماً دالاً على صاحب الحرفة موثَّق في المعاجم الحديثة الموثوقة:
        تكملة المعاجم الدوزي «وصاحب الفن موسيقي»، ومسرد الفن والتسلية (ARABTERM)
        translation_en: musician. هذا الانزياح الوظيفي (صفة → اسم) شائع في العربية
        لمصطلحات المهن (الطبيب، المهندس، الموسيقي). يُستخدم على نطاق واسع في
        الصحافة والتعليم والمواثيق الرسمية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: taarib
        verdict: مقبول — يقبل لام التعريف والجمع السالم (موسيقيون) والنسبة
      nuance_differentiation: >
        موسيقيّ أشمل من عازف؛ يشمل كل من ينتسب إلى مجال الموسيقى احترافاً: العازفَ
        والمؤلِّفَ والمنظِّرَ والمدرِّس، وكثيراً ما يُفضَّل في السياقات الرسمية
        والأكاديمية للإشارة إلى الموسيقي بوجه عام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوسِيقِيّ"

    - lemma: "مُطْرِب"
      source: stage1
      decision: removed
      decision_reason: >
        المطرب في المعاجم العربية الموثوقة (الوسيط OCR وهوراماني، الكبير) يغلب في
        المغنّي ذي الصوت الحسن والأداء الجيد، وهو أضيق دلالةً من «عازف الآلات
        الموسيقية». هذه المجموعة تُركّز على العزف المهني لا على الأداء الصوتي.
        إضافة مطرب إلى المجموعة ينقل الدلالة نحو المغنّي لا الموسيقي الآلي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "قَيْن"
      source: stage1
      decision: removed
      decision_reason: >
        القَيْن في المعاجم الكلاسيكية والمعاصرة هو الحداد ثم الصانع، وليس الموسيقي.
        الدلالة الموسيقية مرتبطة حصراً بالمؤنث قَيْنَة (المغنية من الإماء). لا شاهد
        معجمي موثوق يُثبت استخدام المذكر قَيْن بمعنى الموسيقي المحترف.
      evidence_assessment:
        case: contradicts_only


