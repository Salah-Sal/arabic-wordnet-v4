# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «شخص يعزف الموسيقى كمهنة» يحتوي على تعبير ركيك: الفعل «يعزف» لا يتعدى إلى «الموسيقى» مباشرةً في الفصحى؛ الصواب «يعزف على الآلات الموسيقية» أو «يمارس الموسيقى»."
      - "التعريف الإنجليزي «someone who plays a music as a profession» فيه خطأ نحوي (المفروض: plays music)."
      - "اللمّتان الحاليتان خاليتان من التشكيل الكامل."
      - "اللمّة «موسيقي» اسم منسوب (نعت) أُعيد توظيفه اسماً للحرفة؛ قد يوحي ذلك بالتباس مع الدلالة الوصفية."
    observations: >
      المجموعة تصف محترف العزف الموسيقي، وهو مفهوم عربي أصيل تمتد له ألفاظ متعددة في التراث
      (العَزَّاف، القَيْنة، المُطرِب). الجذر «عزف» يحمل في مقاييس اللغة أصلَيْن: الانصراف،
      والصوتُ؛ وهو الأصل الذي اشتُق منه عازف الآلات. أما «موسيقي» فلفظ يوناني معرَّب
      (μουσική) جرى توظيفه اسماً للحرفة في العربية الحديثة.
      تجدر الإشارة إلى أن المورد الحديث (2008) يقترح «الآلاتيّ» ترجمةً لـ instrumentalist،
      غير أنه لم يُتداوَل على نطاق واسعٍ ليُضاف إلى المجموعة.

  blind_candidates:
    - lemma: "مُوسِيقِيّ"
      generation_method: taarib
      justification: >
        تعريب اللفظ اليوناني (μουσική → موسيقى) مع إلحاق ياء النسب ليصف صاحب الحرفة.
        التعريب هنا مقبول لأن اللفظ جرى قبول الإضافة والتنوين والجمع السالم (موسيقيون).
        صاحب هذا الفن = موسيقيّ، كما ورد في تكملة المعاجم: «وصاحب الفن موسيقي».
    - lemma: "عَازِف"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن فاعِل من جذر (ع ز ف)، الأصل الثاني في مقاييس اللغة يدل على الصوت
        والموسيقى. العازف = الذي يعزف على الآلة الموسيقية. التعبير موصوف بالفصاحة ويكثر
        في معاجم الفن والموسيقى الحديثة (عازف الكمان، عازف المنفرد، عازف البوق...).
    - lemma: "مُطْرِب"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من أطرب (الرباعي المزيد بالهمزة)، وزن مُفعِل. المُطرِب من يُلقي في
        السامعين الطربَ وخِفَّةَ السرور بأدائه الموسيقي أو الغنائي. اللفظ راسخ في التراث
        وله شاهد شعري: «وإن شئت تسمع من مطرب».
    - lemma: "قَيْن"
      generation_method: majaz
      justification: >
        محاولة إحياء لفظ عربي قديم: القَيْن في الأصل الحداد، ثم أُطلق على كل صانع.
        وقد ارتبطت صيغته المؤنثة «القَيْنَة» بالمغنّية من الإماء في التراث العربي.
        تم اقتراحه كإزاحة دلالية من الصانع المهاري إلى الموسيقي المحترف.


