      evidence_status: "no_material_found"

    # المرشح ٣ (blind): هاو — نفس الحكم أعلاه (مُدمَج)

    # المرشح ٤ (blind): إِلِيَاسُ هاو
    - lemma: "إِلِيَاسُ هاو"
