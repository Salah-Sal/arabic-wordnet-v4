      # الاسم المركّب (إلياس + هاو) غائب كلياً من قاعدة البيانات.

    - lemma: "هاو"
      contradicts:
        - text: "«هَاوٍ» (المعجم الموحد لمصطلحات التقنيات التربوية، 1999): translation_en = amateur — «هاوٍ للتقنيات التربوية»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
          conflict: >
            المدخل «هاوٍ» (entry_id 394906) هو الاسم الفاعل من هوِيَ يهوى،
            بمعنى «غير محترف / مهوى / محبّ للهواية»، وليس اسم علم. يُثبت
            هذا الاشتراك اللفظي الخطير بين «هاو» (الاسم العائلي Howe) وبين
            «هاوٍ» الكلمة العربية الدارجة — وهو لبس دلالي حقيقي.
        - text: "«هَاوٍ» (معجم الصواب اللغوي لأحمد مختار عمر، entry_id 855864): «هَاوٍ — الجذر: هـ و ي — مثال: أنا هاوٍ لكرة القدم — الرأي: مرفوضة — السبب: لأن المعاجم القديمة لم تذكره بهذا المعنى. المعنى: غير محترف — الصواب: أنا هَاوٍ لكرة القدم [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر — Hawramani"
          conflict: >
            يؤكد أن «هاوٍ» بمعنى «غير محترف» معروفة في العربية المعاصرة وفصيحة،
            مما يعني أن «هاو» بمفرده كلمّة ترادفية دون سياق سيُفهم فورياً على
            أنه «هاوٍ» وليس اسم علم.

    # المرشح ١ (blind): إِلْيَاسُ هاو — نفس الحكم أعلاه
    - lemma: "إِلْيَاسُ هاو"
      evidence_status: "no_material_found"

