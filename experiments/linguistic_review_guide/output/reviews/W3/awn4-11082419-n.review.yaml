# ── المرحلة ١: المراجعة والتوليد (أعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «هاو» غير واضحة بمفردها: تشترك لفظاً مع «هاوٍ» (الاسم الفاعل من هوِيَ = محبّ/مهوى) مما يُوقع في لبس دلالي خطير عند غياب السياق أو التشكيل"
      - "كلتا اللمّتين تفتقران إلى التشكيل الكامل في السجل الحالي — «إلياس هاو» يجب أن تُشكَّل «إِلْيَاسُ هاو»"
      - "كلمة «سينغر» في التعريف العربي خطأ في التعريب؛ الصيغة المعيارية المعروفة للعلامة التجارية هي «سينجر»"
      - "التعريف العربي مترجَم حرفياً من الإنجليزي وليس مؤلَّفاً بأسلوب المعاجم العربية"
    observations: >
      المجموعة الترادفية تصف شخصاً تاريخياً بعينه هو إلياس هاو (Elias Howe)،
      المخترع الأمريكي الذي ابتكر آلات الخياطة المبكرة وانتصر في دعاوى انتهاك
      براءات الاختراع ضد إسحاق سينجر وغيره (1819-1867). اللمّتان المُدرجتان
      تعريبان صوتيان: «إلياس هاو» يجمع الصورة القرآنية/العبرية لاسم Elias وهي
      المعيارية في العربية، مع الترجمة الصوتية للقب «Howe»؛ أما «هاو» فهو اللقب
      مفرداً. لا توجد بدائل معجمية عربية لاسم علم أجنبي — الأسماء الأعلام
      الأجنبية تُعرَّب صوتياً ولا تُشتَقّ. المجموعة على الصعيد العام صحيحة،
      لكنها تحتاج تصحيحات في التشكيل والتعريف.

  blind_candidates:
    # جميع المرشحين تعريبات صوتية — لا سبيل للاشتقاق أو المجاز في أسماء الأعلام الأجنبية
    - lemma: "إِلْيَاسُ هاو"
      generation_method: taarib
      justification: >
        استناداً إلى الشكل القرآني/الكتابي المعيار لاسم Elias وهو «إِلْيَاسُ»
        (الوارد في القرآن الكريم: ﴿وَإِنَّ إِلْيَاسَ لَمِنَ الْمُرْسَلِينَ﴾)،
        مضافاً إليه التعريب الصوتي للقب Howe = «هاو». هذا هو الشكل الأوثق
        بالتراث اللغوي العربي لأنه يوظّف الشكل المُعجَم المُثبَت تاريخياً.
    - lemma: "إِيلَايَسُ هاو"
      generation_method: taarib
      justification: >
        تعريب صوتي مباشر من نطق الاسم الإنجليزي Elias (إيلايَس) + Howe (هاو).
        يلتزم بالنطق الأمريكي للاسم لكنه يُهمل الصورة القرآنية الأرسخ.
    - lemma: "هاو"
      generation_method: taarib
      justification: >
        اللقب (surname) وحده: Howe = هاو. يُستخدم في سياقات الاختصار
        أو حين يكون الشخص معروفاً في الخطاب. شائع في المراجع الموسوعية
        كلمّة مدخل ثانوية.
    - lemma: "إِلِيَاسُ هاو"
      generation_method: taarib
      justification: >
        تشكيل بديل لاسم Elias بكسر اللام: «إِلِيَاسُ» — أقل شيوعاً من
        «إِلْيَاسُ» لكنه وارد في بعض المصادر الأكاديمية العربية كترجمة
        مباشرة للنطق اللاتيني Elias.


