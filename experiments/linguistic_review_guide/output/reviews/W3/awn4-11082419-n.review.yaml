        (١) «بنى آلات خياطة» — الفعل «بنى» غير ملائم للآلات؛ الأصح «صنع» أو «ابتكر».
        (٢) «سينغر» تعريب خاطئ للاسم Singer؛ الصيغة المعيارية في العربية «سينجر»
        (العلامة التجارية معروفة بهذا الاسم في كل البلدان العربية).
        (٣) الصياغة ركيكة ولا تتّبع أسلوب التعريف الموسوعي العربي.
