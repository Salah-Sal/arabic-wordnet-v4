# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "إلياس هاو"
      decision: confirmed
      decision_reason: >
        اللمّة تعريب صوتي مقبول ومعيار: «إِلْيَاسُ» هي الصيغة القرآنية الثابتة
        لاسم Elias (الوارد 3 مرات في القرآن الكريم) وهي الأكثر شيوعاً في
        المراجع العربية لهذا الاسم الشخصي، بينما «هاو» هي التعريب الصوتي
        الوحيد الممكن للقب Howe. اللمّة مؤلَّفة من اسم + لقب في تركيب عَلَمي
        إضافي معتاد. تُؤكَّد مع تصحيح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل (اسم + لقب): يُستخدم عند التقديم الرسمي للشخص، في أوائل
        النصوص أو حين يتداخل مع أشخاص آخرين يحملون اسم «هاو». يُرجَّح في
        الموسوعات والمصادر الأكاديمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِلْيَاسُ هاو"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "هاو"
      decision: confirmed
      decision_reason: >
        اللقب «هاو» (Howe) بمفرده صحيح كلمّة ثانوية في WordNet للإحالة
        المختصرة، لكنه يستلزم التنبيه على الاشتراك اللفظي مع «هاوٍ» (amateur).
        يُؤكَّد كونه يعمل ضمن منظومة AWN4 حيث السياق الموسوعي يرفع الإبهام،
        مع ضرورة تسجيل الملاحظة في البيانات الوصفية. لا تشكيل إضافي ممكن لأنه
        مقطع أجنبي مُعرَّب غير خاضع لنظام الحركات العربي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب (surname) وحده: يُستخدم في السياقات التي سبق فيها ذكر الشخص،
        أو في نصوص متخصصة في تاريخ الاختراع حيث «هاو» معروف كمرجع. أقل
        رسمية من الاسم الكامل.
      actions:
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── المرشحات من المرحلة ١ ──
    - lemma: "إِيلَايَسُ هاو"
      source: stage1
      decision: removed
      decision_reason: >
        «إيلايَس» تعريب صوتي مباشر من النطق الإنجليزي لكنه يُهمل الصورة
        القرآنية الراسخة «إِلْيَاسُ». مبدأ إيثار التراثي والشائع يوجب تفضيل
        «إلياس» التي ورد في القرآن الكريم وفي أسماء الأنبياء على التعريب
        الجديد. لا تُضيف شيئاً مميزاً.

    - lemma: "إِلِيَاسُ هاو"
      source: stage1
      decision: removed
      decision_reason: >
        «إِلِيَاسُ» (بكسر اللام) ليست الصيغة القرآنية المعيارية — الصواب
        «إِلْيَاسُ» بسكون اللام وفتح الياء. مُتكرِّرة مع اللمّة الموجودة
        بعد تصحيح التشكيل. تُحذَف.

    - lemma: "هاو"
      source: stage1
      decision: removed
      decision_reason: >
        مطابقة للمّة الموجودة «هاو» — تكرار. تُحذَف من المرشحات.

    - lemma: "إِلْيَاسُ هاو"
