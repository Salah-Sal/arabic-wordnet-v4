# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10272051-n (lector / reader)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «قارئ» شديدة الاشتراك اللفظي: تُستعمل للقارئ العام، وحافظ القرآن، والمتنسّك، وقارئ الأجهزة، فضلاً عن المعنى الكنسي المقصود هنا"
      - "المعنى المقصود (شخص يتلو الدروس في القدّاس) مختصّ بالسياق المسيحي الكاثوليكي، وهو نادر الاستعمال في النصوص العربية العامة"
      - "الرابط التصاعدي (hypernym) awn4-13974030-n يحمل تعريف «درجة كهنوتية / رتبة دينية» وهو مفهوم مجرّد (رتبة) لا شخص، فالعلاقة الأنطولوجية تحتاج مراجعة"
    observations: "المجموعة تمثّل مفهوماً كنسياً كاثوليكياً دقيقاً: الشخص المرسوم في رتبة القارئ الصغرى (Lector/Reader)، وهي إحدى الرتب الصغرى الأربع في الكنيسة الكاثوليكية. اللفظ العربي «القارئ» مستعمل فعلاً في الأدبيات المسيحية العربية بهذا المعنى، لكنه يحتاج تقييداً سياقياً لتمييزه عن المعنى العام."
  blind_candidates:
    - lemma: "قَارِئ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «قرأ» على وزن فاعِل، يدلّ على مَن يقوم بفعل القراءة. الأقرب طبيعياً لمن يتلو الدروس والنصوص المقدّسة في القدّاس."
    - lemma: "تَالٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «تلا يتلو» بمعنى القراءة المتتابعة والتلاوة، وهو الجذر الذي اشتُقّت منه «تلاوة القرآن» لأنه يُتبِع آية بعد آية. قد يصلح للدلالة على من يتلو فصولاً من الكتاب المقدّس."
    - lemma: "مُرَتِّل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «رتّل» أي قرأ بتمهّل وتبيين، وهو مصطلح مستعمل في السياق الديني (ترتيل القرآن / ترتيل المزامير). قد يُستخدم في السياق الكنسي."
    - lemma: "لَكْتُور"
      generation_method: taarib
      justification: "تعريب للمصطلح اللاتيني lector، يُستعمل أحياناً في بعض الكنائس الشرقية العربية للدلالة على هذه الرتبة الصغرى تحديداً."

stage2_evidence:
  per_lemma:
    - lemma: "قَارِئ"
      confirm:
        - text: "«القارئ: شخص مهمّته تلاوة فصول من الكتاب المقدَّس في قدّاس.»"
          source: "المورد الحديث (2008) — مدخل lector"
        - text: "«(1) «أ» القارئ. «ب» lector. «ج» مصحِّح التجارب [أو البروفات المطبعيّة]. «د» مثمّن المخطوطات. «هـ» مساعد أستاذ»"
          source: "المورد الحديث (2008) — مدخل reader"
      expands:
        - text: "«(الْقَارئ) المتنسك»"
          source: "المعجم الوسيط"
          addition: "المعجم الوسيط يسجّل للقارئ معنى المتنسّك المتعبّد، وهو معنى إسلامي قديم مختلف عن المعنى الكنسي"
        - text: "«القارئ: الذي جمع القرآن حفظاً عن ظهر قلب»"
          source: "مختصر العبارات لمعجم مصطلحات القراءات للدوسري"
          addition: "معنى قرآني اصطلاحي خاصّ بحفّاظ القرآن"
        - text: "«قَارِئ: من (ق ر أ) من تَتَبع كلمات الكتاب ونحوه نظراً ونَطَق بها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المعنى العامّ للقارئ: كل من تتبّع نصّاً ونطق به"
    - lemma: "تَالٍ"
      contradicts:
        - text: "«(التال) صغار النخل»"
          source: "المعجم الوسيط"
          conflict: "لفظ «التال» في المعاجم يدلّ على صغار النخل لا على القارئ أو التالي"
      expands:
        - text: "«تَالٍ — consecutive / meta / consequent»"
          source: "معاجم أرابترم المتعددة"
          addition: "في الاصطلاح الحديث يُستعمل بمعنى «تالٍ/لاحق» في الرياضيات والمنطق، لا بمعنى التلاوة"
    - lemma: "مُرَتِّل"
      evidence_status: "no_material_found"
    - lemma: "لَكْتُور"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "قَارِئ"
      decision: confirmed
      decision_reason: "مؤيَّد بدليل صريح من المورد الحديث (2008) الذي يترجم lector بـ«القارئ: شخص مهمّته تلاوة فصول من الكتاب المقدَّس في قدّاس»، وهو مطابق تماماً لتعريف المجموعة. اللفظ مشترك لفظي لكنّ المعنى الكنسي مسجّل ومثبّت."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لمّة وحيدة مؤكّدة في المجموعة؛ تدلّ على الشخص الذي يتلو فصولاً من الكتاب المقدّس في القدّاس، وهو أحد معاني «قارئ» المتعدّدة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَارِئ"
    - lemma: "تَالٍ"
      source: stage1
      decision: removed
      decision_reason: "لفظ «تالٍ» في المعاجم يدلّ على صغار النخل (المعجم الوسيط)، وفي الاصطلاح الحديث على معنى «لاحق/تابع». لا دليل معجمي على استعماله بمعنى تالي النصوص المقدّسة في الكنيسة. والجذر «تلو» وإن كان أصل «التلاوة» فإنّ اسم الفاعل «تالٍ» لم يتخصّص بهذا المعنى."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "مُرَتِّل"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعمال «مرتِّل» بمعنى القارئ الكنسي. الترتيل أقرب إلى الإنشاد والتغنّي الموسيقي بالنصوص، وهو يختلف عن مهمّة القارئ (lector) التي تقتصر على تلاوة الدروس من الكتاب المقدّس دون تنغيم موسيقي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "لَكْتُور"
      source: stage1
      decision: removed
      decision_reason: "لا أثر له في المعاجم العربية المتاحة. تعريب غير مثبّت معجمياً، والبديل العربي الطبيعي «قارئ» مسجّل ومستعمل في المصادر المسيحية العربية، فلا مسوّغ للتعريب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "شخص يقرأ الدروس في خدمة الكنيسة؛ شخص مرسوم في رتبة صغرى في الكنيسة الكاثوليكية الرومانية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية تفتقر لأسلوب المعجم العربي، وتحتوي تكراراً (شخص... شخص)، وتفتقر إلى الجنس القريب الواضح."
    authored:
      - type: terminological
        text: "رُتْبَة كَنَسِيَّة صُغْرى في الكنيسة الكاثوليكيّة، صاحِبُها مُكَلَّف بتلاوة فصول من الكتاب المقدَّس في القدّاس."
