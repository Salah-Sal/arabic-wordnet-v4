          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "القارئ في الكنيسة الكاثوليكيّة الرومانيّة: مَنْ يُرسَم في إحدى الرُّتَب الصُّغرى الأربع، وتقتصر مهمّته على تلاوة نصوص الكتاب المقدَّس — عدا الإنجيل — أثناء صلاة القدّاس الإلهيّ. وقد أُلغيت الرتب الصغرى رسمياً عام ١٩٧٢م واستُبدلت بخدمات علمانيّة."
