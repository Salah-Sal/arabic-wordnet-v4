# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10369282-n  |  ILI: i91563  |  POS: n
# naysayer — شخص ذو موقف سلبي عدواني يرفض الاقتراحات
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «رافِض دائِم» مركب وصفي لا يجتاز اختبار التثبيت المعجمي؛ يمكن إحلال «رافض مستمر» أو «رافض متكرر» أو «رافض دؤوب» محله دون فقدان المعنى، مما يثبت أنه عبارة وصفية حرة لا وحدة معجمية مسكوكة"
      - "لمّة «مُعارِض» واسعة المعنى تشمل كل معارض سواء بدوافع عقلية أو عاطفية أو مبدئية، وتفتقر إلى البُعد السلبي العدواني الخاص بـ naysayer"
      - "غياب التشكيل الكامل: «رافِض» يفتقر إلى فتحة على الراء (رَافِض)، و«مُعارِض» يفتقر إلى فتحة على العين (مُعَارِض)"
      - "التعريف الحالي يبدو ترجمةً شبه حرفية للإنجليزية لا تأليفاً معجمياً أصيلاً بجنس قريب وفصل نوعي"
    observations: |
      المجموعة تصف شخصاً ذا موقف سلبي عدواني مَوسوم بالرفض الدائم للاقتراحات. المقابل الإنجليزي
      naysayer يجمع بين معنيَين: الرفض الحاسم (say nay) والعدوانية المتجذّرة في الموقف. العربية
      تمتلك موارد اشتقاقية غنية من جذر «أبي» (الامتناع) و«رفض» (الترك والإلقاء) لتغطية هذا
      المفهوم، غير أن اللمّتين الحاليتين لا تعكسان دقة المعنى على نحو كافٍ. لا يوجد في المعجم
      العربي الكلاسيكي مصطلح موحّد يجمع الرفض والعدوانية والاعتياد معاً، مما يجعل المجموعة
      تقع في خانة الفجوة المعجمية (lexical_gap).

  blind_candidates:
    - lemma: "أبَّاء"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فعَّال من جذر «أبي» (الامتناع والإباء)؛ تعني الرافض الحاسم كثير الإباء؛ الوزن فعَّال منتج للدلالة على كثرة الفعل واعتياده كما في صبَّار وكفَّار"
    - lemma: "رَفُوض"
      generation_method: ishtiqaq
      justification: "وزن فعُول من «رفض» للدلالة على الميل الشديد المعتاد للرفض؛ مقيس على «شَكُور، كَفُور، صَبُور» وسائر الأوزان الدالة على القابلية أو المداومة"
    - lemma: "طَعَّان"
      generation_method: majaz
      justification: "إزاحة دلالية من المعنى الحسّي (الطعن بالرمح) إلى الطعن المعنوي العدواني في الآراء والأفكار؛ وزن فعَّال يفيد المبالغة والمداومة في الطعن"
    - lemma: "نَافٍ مُعَانِد"
      generation_method: tarkib
      justification: "مركب وصفي يجمع بين النفي (رفض الأفكار وتكذيبها) والعناد (الإصرار الحازم على الرفض)؛ يلتقط البُعدين الجوهريين في مفهوم naysayer"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "رافِض دائِم"
      confirm:
        - text: "«رَافِض: من (ر ف ض) تارك الشيء، وكاسره والمتسع من الوديان، والمنتشر عذقه من النخل، والساقط غلافه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«رَفَضَ: الرَّاءُ وَالْفَاءُ وَالضَّادُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّرْكُ، ثُمَّ يُشْتَقُّ مِنْهُ. يُقَالُ رَفَضْتُ الشَّيْءَ: تَرَكْتُهُ. هَذَا هُوَ الْأَصْلُ، ثُمَّ يُشْتَقُّ مِنْهُ ارْفَضَّ الدَّمْعُ مِنَ الْعَيْنِ: سَالَ، كَأَنَّهُ تَرَكَ مَوْضِعَهُ. وَكُلُّ مُتَفَرِّقٍ مُرْفَضٌّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أن أصل «رفض» هو الترك والإبعاد، مما يصحح استخدام «رافض» دلالياً، لكنه لا يدعم المركب «رافض دائم» بوصفه وحدة معجمية مسكوكة"

    - lemma: "مُعارِض"
      contradicts:
        - text: "«معارض: exhibitions» [المعنى في المدخل: معارض = جمع مَعْرَض أي دور العرض والمعارض التجارية]"
          source: "المَكنَز الزراعي متعدد اللغات (ARABTERM)"
          conflict: "المدخل الوحيد المسترجَع يُعالج «معارض» بوصفها جمع «مَعرَض» (دور العرض) لا اسم فاعل من عارَض؛ يشير إلى خطر الالتباس في النص غير المشكَّل بين مُعَارِض (اسم فاعل، ضمّة) ومَعَارِض (جمع معرض، فتحة)"
      expands:
        - text: "«عَرَضَ: الْعَيْنُ وَالرَّاءُ وَالضَّادُ بِنَاءٌ تَكْثُرُ فُرُوعُهُ، وَهِيَ مَعَ كَثْرَتِهَا تَرْجِعُ إِلَى أَصْلٍ وَاحِدٍ، وَهُوَ الْعَرْضُ الَّذِي يُخَالِفُ الطُّولَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر «عرض» واسع الدلالة؛ مُعارِض (فاعل من عارَض) يعني من يقف في العَرض أمام الأفكار أي يعترضها؛ لكن الجذر بذاته لا يحمل دلالة العدوانية أو السلبية المتعمَّدة"

    - lemma: "أبَّاء"
      confirm:
        - text: "«الأَبَّاء: مبالغة في الآبي»"
          source: "المعجم الكبير"
        - text: "«أَبَيَ: الْهَمْزَةُ وَالْبَاءُ وَالْيَاءُ يَدُلُّ عَلَى الِامْتِنَاعِ. أَبَيْتُ الشَّيْءَ آبَاهُ، وَقَوْمٌ أَبِيُّونَ وَأُبَاةٌ... وَالْإِبَاءُ: أَنْ تَعْرِضَ عَلَى الرَّجُلِ الشَّيْءَ فَيَأْبَى قَبُولَهُ، فَتَقُولُ مَا هَذَا الْإِبَاءُ، بِالضَّمِّ وَالْكَسْرِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الإباء: شدة الامتناع، وكل أباء امتناع ولا عكس، ورجل أبي: يأبى تحمل الضيم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«أبي: الأَبَى، مقصور: داءٌ يأخذ المعز في رءوسها... وأَبَى فلانٌ يأَبَى إِباءً، أي: ترك الطّاعةَ، ومالَ إلى المعْصِيةِ... وكلّ من ترك أمراً وردّه، فقد أَبَى. ورجلٌ أبيّ: ذو إباء»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"

    - lemma: "طَعَّان"
      confirm:
        - text: "«الطَّعَّان: الكثير الطعن»"
          source: "المعجم الوسيط"
        - text: "«الطعان: الكثير الطعن»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (حوراماني)"
      contradicts:
        - text: "«طَعَنَ: الطَّاءُ وَالْعَيْنُ وَالنُّونُ أَصْلٌ صَحِيحٌ مُطَّرِدٌ، وَهُوَ النَّخْسُ فِي الشَّيْءِ بِمَا يُنْفِذُهُ، ثُمَّ يُحْمَلُ عَلَيْهِ وَيُسْتَعَارُ... وَرَجُلٌ طَعَّانٌ فِي أَعْرَاضِ النَّاسِ. وَفِي الْحَدِيثِ: «لَا يَكُونُ الْمُؤْمِنُ طَعَّانًا»»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الطعّان في التراث اللغوي مرتبط أساساً بالطعن في أعراض الناس (القذف والذمّ) لا بالرفض المنهجي للاقتراحات؛ مفهومه مختلف جوهرياً عن naysayer الذي يرفض الأفكار لا يهجو الأشخاص"

    - lemma: "رَفُوض"
      evidence_status: "no_material_found"

    - lemma: "نَافٍ مُعَانِد"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
