    - lemma: "مُعارِض"
      decision: confirmed
      decision_reason: "اسم فاعل مشتق قياسي من الفعل الثلاثي المزيد «عارَض»؛ شائع الاستخدام في الفصحى للدلالة على المعترض والمخالف. رغم اتساعه الدلالي فهو الأكثر تداولاً لمثل هذا المعنى في العربية المعاصرة، ويحتاج إلى تصحيح تشكيل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على المعارضة المنهجية أو الموضعية دون اشتراط العدوانية؛ قد يعارض لأسباب منطقية أو مبدئية أو عاطفية؛ أوسع دلالةً من naysayer وأقل حدةً من أبَّاء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعَارِض"

    - lemma: "أبَّاء"
      source: stage1
      decision: confirmed
      decision_reason: "مُثبَّت في المعجم الكبير بوصفه «مبالغة في الآبي»، وجذره «أبي» يدلّ على الامتناع الحاسم في مقاييس اللغة وكتاب العين. صيغة المبالغة فعَّال تفيد الكثرة والمداومة، مما يجعله أدق تعبيراً عن مفهوم naysayer مقارنةً بـ«مُعَارِض»؛ يصلح اسماً للذات على سبيل التغليب كما هو شائع في العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الامتناع الحاسم الذي ينبع من الأنفة وقوة الإباء؛ يرفض بشكل مطلق لا يعرف المساومة؛ أشد حسماً وأعمق في دلالة الاعتياد والمداومة من «مُعَارِض»"
      actions:
        - command: create_entry
          params:
            lemma: "أبَّاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "طَعَّان"
      source: stage1
      decision: removed
      decision_reason: "الطعّان في التراث اللغوي مرتبط بالطعن في أعراض الناس (القذف والهجاء)، لا بالرفض المنهجي للاقتراحات؛ الحديث النبوي «لا يكون المؤمن طعّاناً» يقيّده بالذمّ، ومقاييس اللغة تُصرّح بـ«طعّان في الأعراض»؛ مفهومه مختلف عن naysayer جوهرياً."

    - lemma: "رَفُوض"
      source: stage1
