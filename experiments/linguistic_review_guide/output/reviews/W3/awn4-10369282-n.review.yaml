  per_lemma:
    - lemma: "رافِض دائِم"
      decision: removed
      decision_reason: "يفشل اختبار التثبيت المعجمي: يمكن إحلال «رافض مستمر» أو «رافض متكرر» أو «رافض دؤوب» محله دون تغيير في المعنى، مما يثبت أنه تعبير وصفي حرّ لا وحدة معجمية مسكوكة. لا يُسجَّل هذا المركب في أي معجم عربي كلاسيكي أو حديث بوصفه مدخلاً ثابتاً."
