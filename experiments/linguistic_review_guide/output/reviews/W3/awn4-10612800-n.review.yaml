# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10612800-n  |  ILI: i92967  |  POS: n
# العنوان الإنجليزي: a person who shoots a gun (as regards their ability)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────

stage1_review:
  assessment:
    concerns:
      - "اللمّة 'رامي' مشتركة مع المجموعة الأعلى مباشرة (awn4-10612523-n) مما يُشكّل تكراراً معجمياً في الشبكة الدلالية"
      - "اللمّة 'مسلح' أوسع دلالةً من المفهوم المقصود؛ مسلح = حامل السلاح عموماً، لا مطلق النار من حيث مهارته"
      - "التعريف العربي يُقيّد الأداة بـ'المسدس' بينما التعريف الإنجليزي 'a gun' أشمل ليضم البندقية والمسدس وغيرهما"
      - "كلتا اللمّتين تفتقران إلى التشكيل الكامل"
    observations: >
      تعاني هذه المجموعة من إشكاليتين متشابكتين: إشكالية لمّوية تتمثّل في أن 'مسلح' وصفٌ للتسليح لا للمهارة
      الرمائية، وإشكالية تعريفية تتمثّل في تضييق 'مسدس' بديلاً عن السلاح الناري العام. كذلك فإن مشاركة 'رامي'
      مع المجموعة الأعلى تُضعف التمايز بين المستويين الدلاليين. يبدو التعريف الحالي ترجمةً حرفية من الإنجليزية
      بتفسير خاطئ لـ gun (مسدس بدلاً من سلاح ناري). أما قيد 'فيما يتعلق بقدرته' فركيك لغوياً ويُفضَّل
      تعويضه بصياغة أسلوبية أرقى.

  blind_candidates:
    - lemma: "مُطْلِقٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الرباعي 'أطلق' على وزن مُفْعِل؛ 'يُطلق النار' عبارة عربية شائعة، فمُطْلِقٌ هو فاعل هذا الفعل مباشرةً. الوزن مُفْعِل يُعبّر عن الفاعل والصانع (مُرسِل، مُطلِق)، وقياسه مطّرد في العربية"
    - lemma: "قَنَّاصٌ"
      generation_method: ishtiqaq
      justification: "وزن فعّال من جذر 'قنص'، يدل على كثير الصيد والرمي وهو حرفته؛ وزن فعّال للمبالغة والاحتراف مناسب لمن يتميّز بقدرة رمائية وهو محور قيد 'فيما يتعلق بقدرته' في التعريف"
    - lemma: "رَمَّاءٌ"
      generation_method: ishtiqaq
      justification: "وزن فعّال من جذر 'رمى'، صيغة مبالغة تدل على إجادة الرمي وكثرته؛ يرد في المعاجم العربية الكلاسيكية، والوزن يُعبّر عن المهارة المتكررة وهو ما يقتضيه القيد 'فيما يتعلق بقدرته'"
    - lemma: "بُنْدُقِيٌّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى 'البُنْدُق' (البندقية/السلاح الناري)، يُشير إلى من يستعمل هذا النوع من الأسلحة ويجيد استعماله؛ التعريف يُقيّد الأداة بالمسدس فكان مناسباً الاشتقاق من اسم السلاح المقصود"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات نُفِّذت: ٤ استعلامات
#   ١. مطابقة دقيقة دفعية: رامي، مسلح، مطلق، قناص، رماء (+ صيغ ال-)
#   ٢. إثراء بالمعرّف: تعريفات وأمثلة
#   ٣. جسر إنجليزي: gun, gunner, shooter, marksman, rifleman, gunman
#   ٤. FTS عربي: رام، رماة، مسدس، يطلق النار + مقاييس اللغة (dictionary_id=151)

stage2_evidence:
  per_lemma:
    - lemma: "رامي"
      confirm:
        - text: "«الرامي: البارع في الرماية»"
          source: "المورد الحديث (2008) — ترجمة marksman"
        - text: "«الرامي: «أ» جنديّ في كتيبة رُماة أو حَمَلة بنادق. «ب» البارع في الرمي بالبندقية»"
          source: "المورد الحديث (2008) — ترجمة rifleman"
        - text: "«(4) الرّامي؛ البارع في الرماية He is a good shot»"
          source: "المورد الحديث (2008) — ترجمة shot (اسم)"
      expands:
        - text: "«الرَّاءُ وَالْمِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ، وَهُوَ نَبْذُ الشَّيْءِ. ثُمَّ يَحْمِلُ عَلَيْهِ اشْتِقَاقًا وَاسْتِعَارَةً. تَقُولُ رَمَيْتُ الشَّيْءَ أَرْمِيهِ. وَكَانَتْ بَيْنَهُمْ رِمِّيَّا، عَلَى فِعِّيلَى»"
          source: "مقاييس اللغة لابن فارس — جذر رمي"
          addition: "يُثبت أن أصل الجذر رمي هو نبذ الشيء وطرحه، وقد امتد استعمالاً واستعارةً ليشمل الرماية بالسلاح؛ صيغة الرامي (اسم الفاعل) مطّردة قياساً على هذا الجذر"
        - text: "«الراشّ: الرامي بالرَّشّاش»"
          source: "المورد الحديث (2008) — ترجمة machine gunner"
          addition: "يُثبت أن العربية الحديثة تُعبّر عن الرامي بسلاح معيّن بتركيب 'الرامي بـ' مما يدعم استخدام رامٍ كحدٍّ جنسي"

    - lemma: "مسلح"
      contradicts:
        - text: "«armour» (مصطلح تقني بلا تعريف نصي)"
          source: "موسوعة الكهرباء IEC 60050 — arabterm"
          conflict: "المعجم التقني يُسجّل 'مسلح' في السياق المادي (الدرع/التسليح)، لا بمعنى الشخص الرامي"
        - text: "«السِّينُ وَاللَّامُ وَالْحَاءُ السِّلَاحُ، وَهُوَ مَا يُقَاتَلُ بِهِ، وَكَانَ أَبُو عُبَيْدَةَ يُفَرِّقُ بَيْنَ السِّلَاحِ وَالْجُنَّةِ، فَيَقُولُ: السِّلَاحُ مَا قُوتِلَ بِهِ»"
          source: "مقاييس اللغة لابن فارس — جذر سلح"
          conflict: "الجذر سلح يدل على السلاح (الأداة)، ومسلح = حامل السلاح أو المُزوَّد به؛ الدلالة على حمل السلاح عامة لا تستلزم مهارة إطلاق النار المقصودة في هذه المجموعة"

    - lemma: "مُطْلِقٌ"
      contradicts:
        - text: "«absolute» (مصطلح تقني في مجالات الجيولوجيا والفيزياء والرياضيات والقانون)"
          source: "معاجم ARABTERM المتعددة — ترجمة absolute"
          conflict: "المعاجم الموحدة تُثبت 'مطلق' بمعنى غير المقيد (absolute) لا بمعنى الشخص الرامي"
        - text: "«المطلق: ما يدل على واحد غير معين»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "مصطلح منطقي يعني عدم التقييد، لا صلة له بإطلاق النار"
        - text: "«مُطْلَق من (ط ل ق) ما لا يقيد بقيد أو شرط، وغير المعيَّن»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "يُثبت المعنى المصطلحي 'غير المقيد' لا معنى الرامي"

    - lemma: "قَنَّاصٌ"
      confirm:
        - text: "«قَنّاص من (ق ن ص) من حرفته الصيد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«الْقَافُ وَالنُّونُ وَالصَّادُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى الصَّيْدِ قَطْ. فَالْقَانِصُ: الصَّائِدُ. وَالْقَنَصُ: الصَّيْدُ. وَالْقَنْصُ: فِعْلُ الْقَانِصِ»"
          source: "مقاييس اللغة لابن فارس — جذر قنص"
          conflict: "القناص يدل حصراً على الصيد (hunting)؛ في الاستخدام العسكري المعاصر يتخصص في القناص البعيد المدى (sniper)؛ لا يُطابق الشخص الذي يُطلق النار بالمسدس بما فيه الكفاية"

    - lemma: "رَمَّاءٌ"
      confirm:
        - text: "«رَمَّاءٌ: على المبالغة»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
      contradicts:
        - text: "«الرَّمَّاءُ: الزِّيَادَةُ. وَقَدْ قُلْنَا إِنَّ اشْتِقَاقَ ذَلِكَ مِنَ الْبَابِ لِأَنَّهُ أَمْرٌ يَتَرَامَى إِلَى فَوْقٍ»"
          source: "مقاييس اللغة لابن فارس — جذر رمي"
          conflict: "ابن فارس يُثبت رمّاء بمعنى الزيادة (من ترامى الشيء إلى أعلى)، لا بمعنى الرامي بالسلاح؛ مما يُشوّش الدلالة ويُضعف الاحتجاج به"

    - lemma: "بُنْدُقِيٌّ"
      confirm:
        - text: "«البُنْدُقيّ: «أ» المسلَّح ببندقية. «ب» القاتل المحترف. «ج» البارع في استعمال البندقية»"
          source: "المورد الحديث (2008) — ترجمة gunman"
      contradicts:
        - text: "«البُنْدُقيّ: «ب» القاتل المحترف»"
          source: "المورد الحديث (2008)"
          conflict: "المعنى الثاني 'القاتل المحترف' يُضفي دلالة إجرامية عدائية لا تنسجم مع تعريف المجموعة المحايد الذي يصف الشخص فحسب من حيث قدرته الرمائية"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────────

stage3_analysis:
  per_lemma:
    - lemma: "رامي"
      decision: confirmed
      decision_reason: >
        ثابت في المعاجم الحديثة بمعنى البارع في الرماية (marksman, rifleman)؛ الجذر رمي راسخ في مقاييس
        ابن فارس بمعنى نبذ الشيء ثم امتدّ للرماية بالسلاح. المشكلة الوحيدة غياب التشكيل وتكرار
        اللمّة في المجموعة الأعلى، وهو أمر مقبول في التراتب الدلالي إذا كانت المجموعة الأدنى أكثر
        تخصيصاً. يحتاج تصحيح التشكيل إلى رَامٍ (اسم الفاعل من رمى في التنوين المرفوع).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبّر عن الشخص من حيث براعته في إطلاق النار بسلاح ناري تحديداً؛ يختلف عن 'مسلح' بأنه
        يُركّز على المهارة الرمائية لا مجرد حمل السلاح، ويختلف عن 'قناص' بأنه لا يستلزم سياق الصيد
        أو القنص العسكري البعيد المدى
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَامٍ"

    - lemma: "مسلح"
      decision: removed
      decision_reason: >
        مُسَلَّح وصفٌ لمن زُوِّد بالسلاح أو حمله، وهو أعمّ من المفهوم المقصود؛ فلا يُشير بالضرورة
        إلى مهارة إطلاق النار التي هي قيد 'من حيث قدرته' في التعريف. كذلك يشمل الجنود المُسلَّحين
        بالسيف والرمح، وحاملي الأسلحة الباردة، وهؤلاء لا يدخلون في هذه المجموعة. ابن فارس يُثبت
        سلح بمعنى السلاح أداةً لا صاحبها الرامي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُطْلِقٌ"
      source: stage1
      decision: removed
      decision_reason: >
        جميع شواهده المعجمية تُثبته بمعنى 'المُرسَل' أو 'غير المقيد' (absolute)؛ لا توجد شاهدة واحدة
        تُثبته بمعنى الشخص الرامي في المعاجم الكلاسيكية أو الحديثة. استخدامه بمعنى مُطلِق النار
        عبارة وصفية وليس مصطلحاً مسكوكاً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "قَنَّاصٌ"
      source: stage1
      decision: removed
      decision_reason: >
        دلالة قنص حصرية في الصيد وفق ابن فارس؛ وفي الاستخدام العسكري المعاصر يتخصص في القناص
        بعيد المدى (sniper) الذي يعمل بأسلوب مختلف عن الرامي العادي بالمسدس. كلا السياقين لا يُطابق
        التعريف: «شخص يطلق النار بسلاح ناري من حيث قدرته». اجتياز اختبار الاستبدال يفشل: قناص
        في سياق مطلق النار العادي تبدو غير طبيعية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "رَمَّاءٌ"
      source: stage1
      decision: removed
      decision_reason: >
        يُرادف رَامٍ في الدلالة العامة دون إضافة فارق دلالي واضح يبرر وجوده في نفس المجموعة؛ مبدأ
        عدم الترادف المطلق يقتضي إثبات فرق في الدرجة أو السياق أو النوع، وهو غير متوفر هنا.
        علاوةً على ذلك، ابن فارس يُثبت رمّاء بمعنى الزيادة لا المهارة في الرماية، مما يُشكّل خلطاً
        دلالياً يُضعف الاحتجاج بهذه الصيغة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "بُنْدُقِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        المورد الحديث يُثبته بمعنى 'القاتل المحترف' إلى جانب 'البارع في استعمال البندقية'؛ تضمينه
        دلالة الاحتراف الجنائي يتعارض مع حياد التعريف المقصود الذي يصف شخصاً من حيث مهارته دون
        إضافة دلالة إجرامية. فحص الملاءمة الثقافية: بُندُقيّ يستدعي ذهن المتلقي العربي صورة
        الغريم أو المسلح في سياق عنيف، لا الرامي الرياضي أو الصياد.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────

stage4_content:
  definition:
    current: "شخص يطلق النار بمسدس (فيما يتعلق بقدرته)"
    assessment:
      decision: revise
      reason: >
        خطأ في الترجمة: 'gun' في الإنجليزية تعني السلاح الناري عموماً (بندقية، مسدس، سلاح ناري)
        لا المسدس وحده؛ فتقييد التعريف بـ'مسدس' أضيق من المدلول الإنجليزي. كذلك صياغة 'فيما يتعلق
        بقدرته' ركيكة وغير طبيعية عربياً. يُستعاض عنها بـ'من حيث مهارته في الرماية'.
    authored:
      - type: terminological
        text: "شخصٌ يُطلِقُ النارَ بسلاحٍ ناريٍّ، مُصنَّفًا من حيثُ مهارتُهُ في الرِّمايةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10612800-n"
          definition_index: 0
          text: "شخصٌ يُطلِقُ النارَ بسلاحٍ ناريٍّ، مُصنَّفًا من حيثُ مهارتُهُ في الرِّمايةِ"

  examples:
    per_lemma:
      - lemma: "رَامٍ"
        examples:
          - text: "اشتُهر بأنه رَامٍ بارع يُصيب هدفه من مسافاتٍ بعيدة، فكان مرجعاً لزملائه في نادي الرماية"
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اشتُهر بأنه رَامٍ بارع يُصيب هدفه من مسافاتٍ بعيدة، فكان مرجعاً لزملائه في نادي الرماية"


