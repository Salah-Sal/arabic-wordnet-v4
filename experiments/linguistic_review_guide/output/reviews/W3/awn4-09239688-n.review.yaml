        - text: "«فِنْدي: من (ف ن د) نسبة إلى فِنْد بمعنى ضعف العقل من الهرم أو المرض أو الخطأ في الرأي.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "فَنْد"
      confirm:
        - text: "«الْفِنْدُ: الشِّمْرَاخُ مِنَ الْجَبَلِ، وَقَالَ قَوْمٌ: هُوَ الْجَبَلُ الْعَظِيمُ، وَبِهِ سُمِّي الرَّجُلُ فِنْدًا.»"
          source: "مقاييس اللغة لابن فارس"

