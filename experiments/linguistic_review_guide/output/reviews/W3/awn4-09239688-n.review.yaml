stage4_content:
  definition:
    current: "خليج في شمال المحيط الأطلسي بين نيو برونزويك ونوفا سكوشا؛ يشتهر بحركة المد والجزر السريعة والكبيرة التي تصل إلى 70 قدماً"
    assessment:
      decision: revise
      reason: "تطوير الصياغة لتكون أكثر جزالة وتعريب المقاييس (الأمتار) بما يتناسب مع المعايير العلمية المعاصرة."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ يَقَعُ في شَمَالِ المُحِيطِ الأَطْلَسِيِّ بَيْنَ نِيُوبْرُونزْوِيك وَنُوفَا سُكُوشَا في كَنَدَا؛ يَشْتَهِرُ بِأَعْلَى مَدٍّ وَجَزْرٍ فِي العَالَمِ حَيْثُ يَصِلُ الفَارِقُ فِيهِ إِلَى نَحْوِ عِشْرِينَ مِتْراً (70 قَدَماً)."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَلِيجٌ يَقَعُ في شَمَالِ المُحِيطِ الأَطْلَسِيِّ بَيْنَ نِيُوبْرُونزْوِيك وَنُوفَا سُكُوشَا في كَنَدَا؛ يَشْتَهِرُ بِأَعْلَى مَدٍّ وَجَزْرٍ فِي العَالَمِ حَيْثُ يَصِلُ الفَارِقُ فِيهِ إِلَى نَحْوِ عِشْرِينَ مِتْراً (70 قَدَماً)."

  examples:
    per_lemma:
      - lemma: "خَلِيج فُنْدِي"
        examples:
          - text: "تُعَدُّ ظَاهِرَةُ المَدِّ العَظِيمِ فِي خَلِيجِ فُنْدِي وُجْهَةً سِيَاحِيَّةً وَعِلْمِيَّةً بَارِزَةً في كَنَدَا."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعَدُّ ظَاهِرَةُ المَدِّ العَظِيمِ فِي خَلِيجِ فُنْدِي وُجْهَةً سِيَاحِيَّةً وَعِلْمِيَّةً بَارِزَةً في كَنَدَا."

