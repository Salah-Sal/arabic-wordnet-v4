stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية 'خليج فندي' تفتقر إلى التشكيل الكامل."
      - "التعريف العربي الحالي يستخدم عبارة '70 قدماً' وهي وحدة قياس غير مستخدمة في السياق العربي المعاصر، يفضل التحويل إلى الأمتار."
    observations: "المجموعة تشير إلى معلم جغرافي محدد (Proper Noun)، والترجمة العربية لـ 'Bay of Fundy' مستقرة اصطلاحاً."
  blind_candidates:
    - lemma: "خَلِيج فُنْدِي"
      generation_method: tarkib
      justification: "الاسم الجغرافي العربي الشائع لهذا الموقع بناءً على الوصف الجغرافي الوارد في التعريف."
    - lemma: "خَلِيج فَنْدِي"
      generation_method: tarkib
      justification: "تنويع صوتي في تعريب الاسم الأجنبي (Fundy) بموافقة الفتحة في الفاء."
    - lemma: "جَوْن فُنْدِي"
      generation_method: tarkib
      justification: "استخدام مرادف 'جون' للإشارة إلى الخليج، مع العلم أن التعريف يصنف الجون كأصغر من الخليج."
    - lemma: "خَلِيج المَدِّ الأَعْظَم"
      generation_method: majaz
      justification: "توليد وصفي بناءً على السمة المميزة المذكورة في التعريف (المد والجزر الكبير)، لتجنب الدوران اللفظي."

