stage1_review:
  assessment:
    concerns:
      - "لا توجد مشكلات جوهرية في المجموعة الترادفية الحالية، والمفهوم مغطى بشكل جيد في المعجم العربي."
    observations: "مصطلح «تقييم» هو الأكثر شيوعاً في العصر الحديث للتعبير عن إعطاء قيمة للشيء، وذلك لتمييزه عن «تقويم» الذي غلب عليه معنى التصحيح أو حساب الزمن. و«تقدير» دقيق جداً ويعبر عن الحسبان المادي والمعنوي."
  blind_candidates:
    - lemma: "تَثْمِين"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر «ثمن» على وزن تفعيل، ويعني إعطاء ثمن أو قيمة مادية للشيء."
    - lemma: "تَقْوِيم"
      generation_method: ishtiqaq
      justification: "اللفظ الفصيح الأصيل الدال على بيان القيمة، مشتق من الجذر «قوم»."
    - lemma: "تَقْدِير"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر «قدر»، ويدل على حساب قيمة الشيء أو مبلغه."
    - lemma: "حِسْبَان"
      generation_method: ishtiqaq
      justification: "مشتق من «حسب»، ويدل على عدّ الشيء أو تقدير قيمته."

stage2_evidence:
  per_lemma:
    - lemma: "تَقْدِير"
      confirm:
        - text: "تقدير: rating"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "التقدير: هو تحديد كل مخلوق بحده الذي يوجد من حسن وقبح، ونفع وضر، وغيرهما."
          source: "كتاب التعريفات للشريف الجرجاني"
    - lemma: "تَقْيِيم"
      confirm:
        - text: "تقييم: assessment; evaluation"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "تَقْيِيم السلعة [صحيحة] التعليق: لأن الفعل «قيّم» لم يرد في المعاجم القديمة. المعنى: معرفة قيمتها. الصواب والرتبة: -تَقويم السلعة [فصيحة]-تقييم السلعة [صحيحة]"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
    - lemma: "تَقْوِيم"
      confirm:
        - text: "تقويم: تقدير قيمة واقع وكائن ما، أو إصدار حكم قيمي انطلاقا من حدود موضوعية تتحدى النـزعات الفردية الذاتية، وهو مبني على أسـس ومعاييـر علمية وقيـاس وحسـاب ويشمل كل شيء."
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      expands:
        - text: "تستخدم في الهندسة الكهربائية لتحويل الجهد المتردد إلى جهد مستمر... أو حساب الزمن بالسنين والشهور والأيام."
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "له معانٍ أخرى شائعة كالتقويم الزمني وتعديل المسار."
    - lemma: "تَثْمِين"
      confirm:
        - text: "تثمين: estimation"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"

stage3_analysis:
  per_lemma:
    - lemma: "تقدير"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع للتعبير عن تقدير قيمة الأشياء أو المواقف، وله جذور أصيلة في هذا المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْدِير"
    - lemma: "تقييم"
      decision: confirmed
      decision_reason: "مصطلح معاصر واسع الانتشار، أقرته المجامع اللغوية لتمييز تحديد القيمة عن معنى التصحيح المتبادر من كلمة تقويم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْيِيم"
    - lemma: "تَثْمِين"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مستخدم بكثرة خاصة في السياقات الاقتصادية والمالية للتعبير عن إعطاء ثمن أو قيمة نقدية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَثْمِين", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "تَقْوِيم"
      source: stage1
      decision: confirmed
      decision_reason: "هو اللفظ الفصيح القديم الدال على تحديد القيمة، ومستعمل بكثرة في المجالات الأكاديمية والتربوية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَقْوِيم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "فعل التأكد من أو تحديد قيمة أو جدوى شيء ما"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويغطي المعنى المقصود بأسلوب لغوي سليم."
  examples:
    per_lemma:
      - lemma: "تَقْدِير"
        examples:
          - text: "طلب المدير إعداد تقرير يتضمن تقدير الخسائر الناجمة عن الحادث."
            type: usage
      - lemma: "تَقْيِيم"
        examples:
          - text: "قامت اللجنة بإجراء تقييم شامل لأداء الموظفين خلال العام."
            type: usage
      - lemma: "تَثْمِين"
        examples:
          - text: "لجأت المحكمة إلى خبير عقاري لتثمين العقار المتنازع عليه."
            type: usage
      - lemma: "تَقْوِيم"
        examples:
          - text: "يُعد تقويم التحصيل الدراسي خطوة أساسية لتطوير المناهج التعليمية."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "طلب المدير إعداد تقرير يتضمن تقدير الخسائر الناجمة عن الحادث."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "قامت اللجنة بإجراء تقييم شامل لأداء الموظفين خلال العام."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "لجأت المحكمة إلى خبير عقاري لتثمين العقار المتنازع عليه."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعد تقويم التحصيل الدراسي خطوة أساسية لتطوير المناهج التعليمية."}

stage5_enrichment:
  per_entry:
    - lemma: "تَقْدِير"
      entry_id: "{auto}"
      root: "قدر"
      maqayis_quote: "«الْقَافُ وَالدَّالُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَبْلَغِ الشَّيْءِ وَكُنْهِهِ وَنِهَايَتِهِ.»"
    - lemma: "تَقْيِيم"
      entry_id: "{auto}"
      root: "قوم"
      maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالْمِيمُ... قَوَّمْتُ الشَّيْءَ تَقْوِيمًا. وَأَصْلُ الْقِيمَةِ الْوَاوُ، وَأَصْلُهُ أَنَّكَ تُقِيمُ هَذَا مَكَانَ ذَاكَ.»"
    - lemma: "تَثْمِين"
      entry_id: "{auto}"
      root: "ثمن"
      maqayis_quote: "«الثَّاءُ وَالْمِيمُ وَالنُّونُ أَصْلَانِ: أَحَدُهُمَا عِوَضُ مَا يُبَاعُ... فَالْأَوَّلُ قَوْلُهُمْ بِعْتُ كَذَا وَأَخَذْتُ ثَمَنَهُ.»"
    - lemma: "تَقْوِيم"
      entry_id: "{auto}"
      root: "قوم"
      maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ... وَمِنَ الْبَابِ: قَوَّمْتُ الشَّيْءَ تَقْوِيمًا. وَأَصْلُ الْقِيمَةِ الْوَاوُ، وَأَصْلُهُ أَنَّكَ تُقِيمُ هَذَا مَكَانَ ذَاكَ.»"
  per_sense:
    - lemma: "تَقْدِير"
      sense_id: "{auto}"
      nuance: "يُركز على حساب القيمة أو المكانة بشكل تقريبي، ويستخدم في السياقات المادية والمعنوية."
      mwe: false
    - lemma: "تَقْيِيم"
      sense_id: "{auto}"
      nuance: "مصطلح حديث شائع للتعبير عن إعطاء قيمة للشيء وتمييزه عن التقويم (التصحيح)، ويستخدم بكثرة في السياقات الأكاديمية والمهنية."
      mwe: false
    - lemma: "تَثْمِين"
      sense_id: "{auto}"
      nuance: "يُركز غالباً على التقدير المالي وإعطاء ثمن مادي أو نقدي للشيء."
      mwe: false
    - lemma: "تَقْوِيم"
      sense_id: "{auto}"
      nuance: "اللفظ الفصيح الأصيل الدال على تحديد القيمة، وله دلالة إضافية في سياقات أخرى تتعلق بالتصحيح والتعديل."
