# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset: awn4-10086539-n  |  ili: i89818  |  pos: n
# evaluator / judge — سلطة قادرة على تقدير القيمة أو الجودة
# ══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "مُقيِّم يُشارك الرسم الإملائي غير المشكَّل (مقيم) مع مُقِيم (ساكن/من أقام)، مما يُفضي إلى التباس في السياقات غير المشكَّلة."
      - "الفعل قيَّمَ يُعدّه معجم الصواب اللغوي حديثاً لم يرد في المعاجم القديمة، وإن كان المعجم الوسيط وقرارات مجمع اللغة تُجيزه مجمعياً."
      - "التعريف الحالي يستخدم «سلطة» للإشارة إلى شخص، وهو استخدام مجازي قد يُوهم بالمؤسسة لا الفرد."
      - "التشكيل في مُقيِّم ناقص: الفتحة على القاف غائبة (يجب أن تكون مُقَيِّم)."
    observations: >
      المجموعة تُعبِّر عن مفهوم الخبير المخوَّل بإصدار الحكم في تقدير القيمة أو الجودة.
      اللمتان الحاليتان تمثلان طيفاً زمنياً متكاملاً: حَكَم كلاسيكية قرآنية عريقة، ومُقيِّم حديثة
      مجمعية القبول. المجموعة الأمّ «خبير تُعتبر آراؤه نهائية وحاسمة» تؤكد اشتراط السلطة
      المعرفية في الحكم، وهو ما يتوفر في كلتا اللمتين، وإن تفاوتتا في السياق والعهد.
  blind_candidates:
    - lemma: "مُقَوِّم"
      generation_method: ishtiqaq
      justification: "اسم الفاعل من قَوَّمَ على وزن مُفَعِّل؛ قَوَّمَ الشيءَ: عيَّن قيمتَه وقدَّره؛ الوزن صريح للدلالة على الفاعل المحترف في التقدير الكمّي للقيمة والجودة."
    - lemma: "نَاقِد"
      generation_method: ishtiqaq
      justification: "اسم الفاعل من نَقَدَ على وزن فَاعِل؛ نَقَدَ الدرهمَ: ميَّزه وكشف عن حاله في جودته؛ النقد في الأصل إبراز الجودة وتمييز الجيد من الرديء، مطابق لمفهوم تقدير القيمة."
    - lemma: "مُحَكِّم"
      generation_method: ishtiqaq
      justification: "اسم الفاعل من حَكَّمَ على وزن مُفَعِّل؛ المحكِّم: من يُرجع إليه في التقدير والفصل؛ صاحب الكلمة الفصل والسلطة المعرفية في إصدار الأحكام التقييمية."
    - lemma: "مَيَّاز"
      generation_method: ishtiqaq
      justification: "وزن فَعَّال من جذر م-ي-ز للمبالغة والاحتراف؛ المَيَّاز: المتخصص في تمييز الجيد من الرديء وتحديد مراتب الجودة؛ الوزن يناسب من يتخذ التمييز مهنةً واختصاصاً."


stage2_evidence:
  per_lemma:
    - lemma: "حَكَم"
      confirm:
        - text: "«من يختار للفصل بين المتنازعين»"
          source: "المعجم الوسيط (OCR)"
        - text: "«مَنْ يُخْتَارُ للفَصْلِ بين المُتَنَازعين»"
          source: "المعجم الكبير (OCR)"
        - text: "«مَنْ يَقْضِي ويَفْصِلُ فى الأمْرِ»"
          source: "المعجم الكبير (OCR)"
        - text: "«(1) الحَكَم؛ الوسيط (2) الفَيْصل [في مسألةٍ ما]»"
          source: "المورد الحديث (2008) — ترجمة arbiter"
      expands:
        - text: "«خبيرٌ بقوانين الألعاب الرياضيَّة، يَتَولَّى إدارة المُبارَيات وتطبيق القوانين الخاصَّةِ بكلِّ رياضيَّة والحُكْم بين المُتَنافسين»"
          source: "المعجم الكبير (OCR)"
          addition: "يُثبت امتداد الدلالة لتشمل الحكم الرياضي، مما يوسِّع نطاق «تقدير الجودة» ليشمل التحكيم الفني والرياضي لا الفصل القانوني وحده."
        - text: "﴿وَإِنْ خِفْتُمْ شِقَاقَ بَيْنِهِمَا فَابْعَثُوا حَكَمًا مِنْ أَهْلِهِ وَحَكَمًا مِنْ أَهْلِهَا﴾"
          source: "القرآن الكريم (النساء ٣٥) — شاهد في المعجم الوسيط والمعجم الكبير"
          addition: "يُثبت الاستخدام القرآني للمة في معنى المُحَكَّم صاحب الكلمة الفصل، مما يمنحها مكانةً راسخة في الموروث اللغوي."

    - lemma: "مُقيِّم"
      confirm:
        - text: "«قيَّمَ يُقيِّم، تقييمًا، فهو مُقَيِّم، والمفعول مُقَيَّم • قيَّم العملَ: قدَّر قيمتَه • قيَّم السِّلعةَ: حدَّد ثمنها • قيَّم وضعًا: استعرض نتائجَه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«اتفاق المُقيِّمين: مقياس لحساب عدد المرات التي يتفق فيها المقيِّمون البشريون عند القيام بمهمة ما»"
          source: "معجم البيانات والذكاء الاصطناعي (2024) — ARABTERM"
        - text: "«قيَّمَ الشيءَ تَقْيِيماً: قَدَّر قيمتَه. (مج)»"
          source: "المعجم الوسيط (OCR) — مع إشارة (مج) الدالة على قرار مجمعي"
      contradicts:
        - text: "«قَيَّمَ السِّلعةَ — الرأي: مرفوضة — السبب: لأن الفعل «قيّم» لم يرد في المعاجم القديمة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "يطعن في أصالة الفعل قيَّمَ؛ غير أن الاعتراض يخص الفعل في سياقات بعينها ولا يُلغي الاستخدام المجمعي المُثبَت في المعجم الوسيط بإشارة (مج)، كما أن اسم الفاعل مُقيِّم مستقل وظيفياً."

    - lemma: "مُقَوِّم"
      contradicts:
        - text: "«جهاز كهربائي يقوم بتحويل التيار المتردد (AC)، الذي يعكس اتجاهه دوريًا، إلى تيار مستمر (DC)»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — ARABTERM"
          conflict: "جميع الشواهد المعجمية تُثبت المعنى التقني الكهربائي (rectifier) لا معنى المُقيِّم للقيمة."
        - text: "«الخشبة التي يمسكها الحرَّاث»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المعنى المادي الزراعي لا صلة له بمفهوم تقدير القيمة أو الجودة."

    - lemma: "نَاقِد"
      confirm:
        - text: "«ناقد» (يقابل: critic)"
          source: "مسرد الإعلام والتواصل، ألكسو (ARABTERM)"
        - text: "«ناقد» (يقابل: reviewer)"
          source: "مسرد الإعلام والتواصل، ألكسو (ARABTERM)"
      expands:
        - text: "«النُّونُ وَالْقَافُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِبْرَازِ شَيْءٍ وَبُرُوزِهِ... وَمِنَ الْبَابِ: نَقْدُ الدِّرْهَمِ، وَذَلِكَ أَنْ يُكْشَفَ عَنْ حَالِهِ فِي جَوْدَتِهِ أَوْ غَيْرِ ذَلِكَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن النقد في الأصل هو كشف الجودة وتمييزها، مما يجعل ناقد متصلاً بمعنى تقدير الجودة جذرياً؛ لكنه تخصّص في المجال الأدبي والفني."

    - lemma: "مُحَكِّم"
      confirm:
        - text: "«الشخص الذي يبت في نزاع بين طرفين أو أطراف ارتضوا تحكيمه»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
        - text: "«مُحَكَّم ؛ حَكَم» (يقابل: arbitrator)"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"

    - lemma: "مَيَّاز"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "حَكَم"
      decision: confirmed
      decision_reason: >
        لمة عربية كلاسيكية أصيلة موثقة توثيقاً قاطعاً في المصادر القرآنية والمعجمية الكلاسيكية والحديثة
        بمعنى من يُختار للفصل بين المتنازعين. تندرج في المجموعة بوصفها صاحب السلطة المعرفية والأخلاقية
        في تقدير القيمة والجودة. التشكيل (حَكَم) صحيح ولا يحتاج تصحيحاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركز على السلطة الأخلاقية والقضائية في إصدار الحكم والفصل بين الأطراف؛ يحمل دلالة الحيادية
        والعدل والرزانة؛ له امتداد قرآني وكلاسيكي راسخ يجعله الأوسع دلالةً والأعمق ارتباطاً بالموروث.
        يُستخدم في سياقات التحكيم الرسمي ومسابقات التقدير والحَكَميّة الفنية والرياضية.

    - lemma: "مُقيِّم"
      decision: confirmed
      decision_reason: >
        اسم الفاعل من قيَّمَ (باب التفعيل)، مقبول بقرار مجمع اللغة العربية وموثق بإشارة (مج) في
        المعجم الوسيط، ومُستعمَل في معجم اللغة المعاصرة ومعجم البيانات والذكاء الاصطناعي.
        الاعتراض في معجم الصواب يخص استخدام الفعل في سياقات بعينها ولا يُلغي القبول المجمعي.
        التشكيل يحتاج تصحيحاً: الفتحة على القاف غائبة (مُقيِّم → مُقَيِّم).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركز على التقدير الكمّي والنوعي للأشياء والخدمات والأداء؛ أحدث عهداً من حَكَم وأكثر شيوعاً
        في السياقات الإدارية والتقنية والمؤسسية الحديثة. لا يحمل بالضرورة دلالةَ الفصل بين الأطراف
        التي يتضمنها حَكَم، وإنما يُعبِّر عن التقييم الموضوعي الوظيفي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقَيِّم"

    - lemma: "مُقَوِّم"
      source: stage1
      decision: removed
      decision_reason: >
        جميع الشواهد المعجمية تُثبت المعنى التقني الكهربائي (مُقوِّم التيار = rectifier) أو المادي
        الزراعي (الخشبة التي يمسكها الحراث). لا شاهد معجمي واحد يدعم معنى المُقيِّم للقيمة أو الجودة.
        استخدامه سيُوقع في لبس اصطلاحي بالغ مع المصطلح التقني الراسخ في عشرات المعاجم المتخصصة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "نَاقِد"
      source: stage1
      decision: removed
      decision_reason: >
        ناقد يُعبِّر عن المتخصص في النقد الأدبي والفني والإعلامي، وهو مفهوم أضيق من «سلطة تقدير القيمة
        أو الجودة» عموماً؛ لا يُغطي تقدير القيمة المالية أو الجودة المؤسسية أو التحكيم العلمي.
        رغم أن الشواهد تؤكده بمعنى critic/reviewer، إلا أنه لا يُضيف قيمة معجمية مميزة فوق حَكَم
        ومُقيِّم في نطاق هذه المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "مُحَكِّم"
      source: stage1
      decision: removed
      decision_reason: >
        خصّصه الاستعمال الحديث للمحكِّم القانوني (arbitrator) الذي يبتّ في نزاع بين طرفين ارتضوا
        تحكيمه؛ الدلالة أضيق من المفهوم المستهدف (سلطة تقدير القيمة أو الجودة) ولا تشمل التقييم
        العام للجودة خارج إطار النزاعات والخصومات.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "مَيَّاز"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية في المصادر المتاحة (760,660 مدخلاً). المصطلح غير مسكوك معجمياً ولا يجتاز
        اختبار التثبيت المعجمي، ولا يمكن إدراجه في المجموعة بدون سند.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


