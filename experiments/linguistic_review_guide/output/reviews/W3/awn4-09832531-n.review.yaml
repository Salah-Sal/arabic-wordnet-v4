        - text: "«(أَدَيَ) الْهَمْزَةُ وَالدَّالُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ إِيصَالُ الشَّيْءِ إِلَى الشَّيْءِ أَوْ وُصُولُهُ إِلَيْهِ مِنْ تِلْقَاءِ نَفْسِهِ.»"
