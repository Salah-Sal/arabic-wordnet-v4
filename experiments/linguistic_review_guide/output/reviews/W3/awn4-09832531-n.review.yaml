stage3_analysis:
  per_lemma:

    - lemma: "فنان استعراضي"
      decision: removed
      decision_reason: >
        خطأٌ تصنيفي جوهري: نفس اللمّة واردةٌ في المجموعة الأم المباشرة (awn4-10435383-n)
        بوصفها مُرادفاً للمفهوم العام «performer»، فلا يجوز أن تُمثِّل في الوقت ذاته المفهومَ
        الأخص «artiste». فضلاً عن ذلك، يفشل المركَّب اختبارَ السكّ المعجمي: إبدال «استعراضي»
        بـ«موسيقي» أو «مسرحي» ينتج وصفاً جديداً صالحاً، مما يدلّ على أنه تعبيرٌ وصفي حرّ
        لا مصطلح مسكوك.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مؤدٍ محترف"
      decision: confirmed
      decision_reason: >
        على الرغم من أن المركَّب يفشل اختبار الاستبدال الصارم (إبدال «محترف» بـ«بارع» أو
        «متميز» ينتج وصفاً مختلفاً بعض الشيء)، فإن «مؤدٍ محترف» يؤدي وظيفةً تمييزية ضرورية
        بين هذه المجموعة والمجموعة الأم التي تحمل «مؤدٍ» مجرداً. كلمة «محترف» تحمل دلالة
        الاحتراف المهني المنسجمة مع الفارق الدلالي بين «artiste» (مؤدٍّ باحتراف متخصص في
        الغناء/الرقص) وبين «performer» العامة. يُصحَّح بإضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرِز البُعد المهني والاحترافي في الأداء الفني الاستعراضي؛ يُستعمل في السياقات الإدارية
        والإعلامية كالعقود الفنية والبرامج الترفيهية عند الإشارة إلى ممارس الغناء أو الرقص
        بصفته حِرفةً ومهنةً لا هواية، بخلاف «مطرب» الذي يُركِّز على الأثر الجمالي الوجداني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُؤَدٍّ مُحْتَرِفٌ"

    - lemma: "مُطْرِبٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلحٌ عربي مثبَّت معجمياً في المعجم الوسيط والمعجم الكبير والمورد الحديث.
        «غلب في المغنّي الحسن الصوت والأداء» يُؤكِّد صلاحيته لمفهوم «artiste» بوصفه مؤدِّياً
        عاماً متخصصاً في الأداء الغنائي الجمهوري. الجذر ط-ر-ب أصيلٌ في العربية، والوزن
        مُفعِل واضح الدلالة على الفاعل المحترف.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على الجانب الغنائي الموسيقي من الأداء وعلى الأثر الوجداني الطربي الذي يُحدِثه
        المؤدِّي في نفوس المستمعين؛ يُستعمل في السياقات الفنية الموسيقية الشرقية بصورة خاصة،
        بخلاف «مؤدٍّ محترف» الذي يشمل الرقص والغناء معاً ويُبرِز البُعدَ المهني.
      actions:
        - command: create_entry
          params:
            lemma: "مُطْرِبٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09832531-n"

    - lemma: "سَامِرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُناقض هذا الاستخدام بصراحة: السامر في العربية مَن يتسامر ليلاً،
        أي المحادِث في مجلس الأُنس، لا المؤدِّي الفني على خشبة المسرح أو منصة الاستعراض.
        الدلالة المجازية المُقترَحة (من مجلس السمر إلى الاستعراض) لا دعمَ لها في الاستخدام
        الفعلي وتُحدِث اشتراكاً لفظياً مع المعنى الأصلي الشائع.

    - lemma: "فَنَّانٌ شَعْبِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ المعجمي: إبدال «شعبي» بـ«كلاسيكي» أو «حديث» أو «مشهور» يُنتِج
        تعابير وصفية مختلفة ومقبولة — مما يدلّ على أنه وصفٌ حرٌّ لا مصطلح سكيك. علاوةً
        على ذلك، «شعبي» في السياق العربي يحمل دلالاتٍ ثقافية (الفنون الشعبية التراثية) لا تتطابق
        مع مفهوم «artiste» الغربي الذي يشمل الرقص والغناء الاحترافي بلا قيود نوعية.
        لا أدلة معجمية على المركَّب.

    - lemma: "عَرَّاضٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُسفِر استعلامات قاعدة البيانات عن أي شاهد معجمي لـ«عَرَّاض» بمعنى المؤدِّي
        الفني الاستعراضي. الجذر ع-ر-ض في الوزن فَعَّال منتجٌ مبدئياً، غير أن الوجود
        المعجمي المُثبَّت شرطٌ لازم قبل إضافة المصطلح إلى الشبكة الدلالية.


