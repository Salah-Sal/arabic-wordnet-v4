stage1_review:
  assessment:
    concerns:
      - "لمّة «فنان استعراضي» مكرَّرة بين هذه المجموعة (awn4-09832531-n) ومجموعة أبيها المباشر (awn4-10435383-n)، مما يُعطِّل التمييز التصنيفي بين العام والخاص."
      - "التعريف «مؤدٍ عام» يحتمل الالتباس: «عام» تعني «public» لكنها تُقرأ كثيراً بمعنى «general» أي غير متخصص."
      - "الصياغة التعريفية «(راقص أو مغنٍ)» بين أقواس أسلوبٌ استطرادي لا يناسب المعجم الرسمي."
      - "كلتا اللمّتين خاليتان من التشكيل الكامل."
      - "لمّة «مؤدٍ محترف» تُضيف قيد الاحتراف غير الموجود في التعريف الإنجليزي «a public performer»."
    observations: >
      المجموعة تُعادل «artiste» الإنجليزية وهي مفهوم محدود يُميِّزه المعجمُ عن «performer» العامة
      بكونه يختص بالغناء والرقص الاستعراضي أمام الجمهور. ورود «فنان استعراضي» في كلٍّ من
      هذه المجموعة ومجموعة أبيها خطأٌ تصنيفي صريح لأن اللمّة الواحدة لا تُمثِّل مستويين دلاليين
      متمايزين. «مؤدٍ محترف» مركَّبٌ وصفي يفتقر إلى التثبيت المعجمي بوصفه مصطلحاً سكيكاً.
      الطروحاتُ المُثلى للمفهوم في العربية ينبغي أن تستحضر المعنى الجوهري لـ«artiste»:
      فنانٌ عمومي يمارس الغناء أو الرقص بصفة احترافية أمام الجمهور.

  blind_candidates:
    - lemma: "مُطْرِبٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر ط-ر-ب على وزن مُفعِل (اسم فاعل من أطرب). الطرب خفّةٌ وجدانية تُصيب
        المتلقي من الأداء الغنائي والموسيقي البديع. «المطرب» لفظٌ عربي مثبَّت معجمياً يصفُ
        المؤدِّي الذي يُحيِّي الجمهورَ بالغناء والأداء الحسن، وهو يناسب أحد طرفَي ثنائية
        «راقص أو مغنٍ» في تعريف المجموعة.
    - lemma: "سَامِرٌ"
      generation_method: majaz
      justification: >
        إحياءٌ لفظي من جذر س-م-ر؛ «السامر» في العربية الكلاسيكية مَن يجتمع لمحادثة الأنس
        ليلاً. بالمجاز يمكن تحميله دلالة المؤدِّي الترفيهي في أمسيات الفرجة، مشابهةً وظيفية
        بين مجلس السمر ومنصة الاستعراض.
    - lemma: "فَنَّانٌ شَعْبِيٌّ"
      generation_method: tarkib
      justification: >
        مركَّب وصفي (فنان + شعبي) يُحدِّد الفنانَ الاستعراضي ذا الطابع الجماهيري الشعبي،
        بمقابل الفنان الكلاسيكي أو الأكاديمي. يشيع هذا المركَّب في الخطاب الإعلامي العربي
        للتمييز بين أصناف المؤدِّين.
    - lemma: "عَرَّاضٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من ع-ر-ض على وزن فَعَّال (للمبالغة والاحتراف). «العرض» هو إظهار الشيء أمام
        الناس، فالعَرَّاض مَن يحترف عرض مواهبه الفنية أمام الجمهور. الوزن «فعَّال» منتجٌ
        في العربية للأعمال الاحترافية كـ«رقَّاص» و«نقَّاش».


