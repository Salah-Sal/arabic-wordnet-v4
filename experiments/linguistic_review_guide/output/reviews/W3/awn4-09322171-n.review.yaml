stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي مقتضب جداً ويفتقر للأسلوب الموسوعي المعجمي."
    observations: "اللمة المختارة صحيحة تماماً من حيث التداول الجغرافي العربي، حيث تُعرب 'Riga' بـ 'ريغا' (بالغين) لتمثيل صوت الـ 'G' في أسماء الأعلام الأوروبية الشرقية، و'خليج' هو المصطلح القياسي لـ 'Gulf'."
  blind_candidates:
    - lemma: "خَلِيجُ رِيغَا"
      generation_method: tarkib
      justification: "الاسم الجغرافي القياسي المعرب للخليج المنسوب لمدينة ريغا."
    - lemma: "جَوْنُ رِيغَا"
      generation_method: majaz
      justification: "استخدام كلمة 'جَوْن' كمرادف فصيح للخليج أو المدخل البحري."
    - lemma: "خَلِيجُ لَاتْفِيَا"
      generation_method: tarkib
      justification: "تسمية وصفية بديلة نسبة إلى الدولة التي يقع الخليج في سواحلها."
    - lemma: "خَلِيجُ رِيجَا"
      generation_method: taarib
      justification: "تنويع إملائي لاسم المدينة 'Riga' باستخدام الجيم."

stage2_evidence:
  per_lemma:
    - lemma: "خليج ريغا"
      confirm:
        - text: "«بحر البلطيق... دول البلطيق متمثلة في: إستونيا ولاتفيا وليتوانيا»"
        - source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - addition: "يؤكد السياق الجغرافي للخليج (بحر البلطيق، لاتفيا، إستونيا)."
      expands:
        - text: "«داء ريغا-فيد»"
        - source: "المعجم الطبي الموحد"
        - addition: "يؤكد أن 'ريغا' هو الرسم الإملائي المعتمد للمدينة في المعاجم العربية الموحدة."
    - lemma: "جون"
      confirm:
        - text: "«الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ»"
        - source: "مقاييس اللغة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خليج ريغا"
      decision: confirmed
      decision_reason: "هو المصطلح الجغرافي العربي الشائع والمعتمد في الخرائط والمعاجم المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيج رِيغَا"

stage4_content:
  definition:
    current: "مدخل لبحر البلطيق بين لاتفيا وإستونيا"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتاج إلى صياغة أكثر دقة وموسوعية تصف طبيعة الامتداد الجغرافي."
    authored:
      - type: encyclopedic
        text: "ذراعٌ مائيٌّ واسعٌ يَنتمي لبحر البلطيق، يَقعُ جُغرافيًّا بين سواحل لاتفيا في الجنوب والشرق، وسواحل إستونيا في الشمال."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09322171-n"
          definition_index: 0
          text: "ذراعٌ مائيٌّ واسعٌ يَنتمي لبحر البلطيق، يَقعُ جُغرافيًّا بين سواحل لاتفيا في الجنوب والشرق، وسواحل إستونيا في الشمال."

  examples:
    per_lemma:
      - lemma: "خليج ريغا"
        examples:
          - text: "تُعد مدينة ريغا الميناء الرئيسي الواقع على خليج ريغا التاريخي."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-09322171-n"
          text: "تُطل العديد من المدن اللاتفية والإستونية على مياه خليج ريغا."

