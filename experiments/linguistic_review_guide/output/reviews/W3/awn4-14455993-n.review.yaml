# ═══════════════════════════════════════════════════════════════
# مراجعة: awn4-14455993-n — archidiaconate
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «منصب رئيس الشمامسة» عبارة وصفية حرّة لا مصطلح مسكوك — يمكن إبدال «منصب» بـ«وظيفة» أو «مقام» دون تغيّر الدلالة، فتسقط في اختبار السكّ"
      - "التعريف العربي «منصب أو وظيفة رئيس الشمامسة» دوران شبه حرفي مع اللمّة"
      - "المفهوم كنسيّ مسيحي متخصّص ونادر الاستعمال في النصوص العربية العامة"
    observations: "المجموعة تعبّر عن مفهوم كنسيّ دقيق: الوظيفة أو الرتبة المرتبطة برئيس الشمامسة (archdeacon). في المعجمية العربية المسيحية وُجد مصطلح «الشَّمَّاسِيَّة» لوظيفة الشمّاس (diaconate)، لكن لم يُرصد مصطلح مفرد لوظيفة رئيسهم تحديداً. المركّب الإضافي «رِئَاسَة الشَّمَامِسَة» أكثر اصطلاحيّةً من العبارة الوصفية الحالية."
  blind_candidates:
    - lemma: "رِئَاسَةُ الشَّمَامِسَة"
      generation_method: tarkib
      justification: "مركّب إضافي يجمع بين المصدر «رئاسة» (من رأس) الدالّ على تولّي المنصب، و«الشمامسة» جمع شمّاس. يوازي بناء «رئاسة الجمهورية» و«رئاسة الأركان» في الاستعمال المعاصر، ويختصر العبارة الوصفية في وحدة إضافية ثابتة."
    - lemma: "أَرْشِدِيَاكُونِيَّة"
      generation_method: taarib
      justification: "تعريب المصطلح الإنجليزي/اللاتيني archidiaconate بإلحاق ياء النسبة والتاء المربوطة، على نمط «بطريركية» و«أسقفية». يقبل لام التعريف والجمع السالم."
    - lemma: "الشَّمَّاسِيَّةُ الكُبْرَى"
      generation_method: tarkib
      justification: "مركّب وصفي يقابل diaconate (الشمّاسيّة) مع صفة «الكبرى» للتمييز عن الشمّاسيّة العادية، على نمط «الإمامة الكبرى» في التراث الإسلامي."
    - lemma: "مَشْيَخَةُ الشَّمَامِسَة"
      generation_method: tarkib
      justification: "مركّب إضافي يستعمل «مشيخة» بمعنى رئاسة الجماعة وزعامتها، على نمط «مشيخة الأزهر». غير أنّ «مشيخة» تغلب في السياق الإسلامي فقد تُوهم."

stage2_evidence:
  per_lemma:
    - lemma: "مَنْصِبُ رَئِيسِ الشَّمَامِسَة"
      evidence_status: "no_material_found"

    - lemma: "رِئَاسَةُ الشَّمَامِسَة"
      expands:
        - text: "«رئيس الشمامسة (كن).» — translation_en: archdeacon"
          source: "المورد الحديث (2008)"
          addition: "يؤكّد أنّ «رئيس الشمامسة» مصطلح معجمي ثابت للشخص، فالمصدر «رئاسة» مشتقّ طبيعي لوصف الوظيفة"
        - text: "«الرَّاءُ وَالْهَمْزَةُ وَالسِّينُ أَصْلٌ يَدُلُّ عَلَى تَجَمُّعٍ وَارْتِفَاعٍ. ... وَالرَّئِيسُ: الَّذِي قَدْ ضُرِبَ رَأْسُهُ. وَيُقَالُ أَنْتَ عَلَى رِئَاسِ أَمْرِكَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر رأس يدلّ على الارتفاع والتقدّم، ومنه الرئاسة"

    - lemma: "أَرْشِدِيَاكُونِيَّة"
      evidence_status: "no_material_found"

    - lemma: "الشَّمَّاسِيَّةُ الكُبْرَى"
      expands:
        - text: "«شَمّاسِيَّة: وظيفة الشمّاس عند النصارى»"
          source: "محيط المحيط (بطرس البستاني)"
          addition: "يؤكّد أنّ الشمّاسيّة مصطلح ثابت لوظيفة الشمّاس، لكن لم يُرصد وصفها بالكبرى"
        - text: "«شَمُوسِيّة: وظيفة الشماس عند النصارى وهي الشَمَاسِيّة»"
          source: "محيط المحيط (بطرس البستاني) — نقلاً عن تكملة دوزي"
          addition: "صيغة بديلة لنفس المعنى"

    - lemma: "مَشْيَخَةُ الشَّمَامِسَة"
      evidence_status: "no_material_found"

    - lemma: "شَمَّاس"
      confirm:
        - text: "«الشَّمَّاس: الشَّديد الشموس ومَن يقوم بالخِدمة الكَنَسِيَّة ومرتبتُه دون القِسِّيس (سريانية) (ج) شمامسة»"
          source: "المعجم الوسيط"
        - text: "«(فى الآرامية شمَّاشا: خادم الأسرار المقدسة خاصةً): مَنْ يقوم بالخِدمة الكَنَسِيَّة, ومرتبتُه دون القِسِّيس, وهو الذى يُساعدُه فى وظيفته. (سريانية)»"
          source: "المعجم الكبير"
      expands:
        - text: "«(1) الشِّماسة: وظيفة الشّمّاس [أو الشَّمّاسة] أو مدّتُها (2) الشَّمامسة: جماعةُ الشَّمامسة.» — translation_en: diaconate"
          source: "المورد الحديث (2008)"
          addition: "الشِّماسة = وظيفة الشمّاس، أي الشمّاسيّة"

stage3_analysis:
  per_lemma:
    - lemma: "مَنْصِبُ رَئِيسِ الشَّمَامِسَة"
      decision: removed
      decision_reason: "عبارة وصفية حرّة تفشل في اختبار السكّ: يمكن إبدال «منصب» بـ«وظيفة» أو «مقام» أو «رتبة» دون تغيّر المعنى. كما أنّها دوران مع التعريف الحالي. لا يوجد أيّ شاهد معجمي على ثبوتها وحدةً اصطلاحية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "رِئَاسَةُ الشَّمَامِسَة"
      source: stage1
      decision: confirmed
      decision_reason: "مركّب إضافي مبنيّ على «رئيس الشمامسة» المثبت في المورد الحديث ترجمةً لـ archdeacon. تحويل الاسم الفاعل إلى مصدر (رئيس → رئاسة) للدلالة على الوظيفة نمط إنتاجي ثابت في العربية (رئيس الجمهورية → رئاسة الجمهورية). أقصر وأكثر اصطلاحيّةً من العبارة المحذوفة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "رِئَاسَةُ الشَّمَامِسَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أَرْشِدِيَاكُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: "تعريب لا شاهد عليه في أيّ معجم عربي، والمصطلح لا يتداوله المسيحيون العرب. يخالف مبدأ إيثار العربي والتراثي. يوجد بديل عربي صالح (رئاسة الشمامسة)."
      evidence_assessment:
        case: no_material

    - lemma: "الشَّمَّاسِيَّةُ الكُبْرَى"
      source: stage1
      decision: removed
      decision_reason: "رغم ثبوت «الشمّاسيّة» بمعنى وظيفة الشمّاس، لم يُرصد وصفها بـ«الكبرى» في أيّ مصدر. التركيب اجتهادي غير مسكوك ويفشل في اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material

    - lemma: "مَشْيَخَةُ الشَّمَامِسَة"
      source: stage1
      decision: removed
      decision_reason: "«مشيخة» مرتبطة بالسياق الإسلامي (مشيخة الأزهر، مشيخة الطريقة) ولا تُستخدم في المصطلحات الكنسيّة. قد تُوهم بمعنى مخالف."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "منصب أو وظيفة رئيس الشمامسة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دوراني: يكرّر اللمّة الأصلية مع إضافة «وظيفة» فقط. يحتاج إلى جنس قريب وفصل نوعي يبيّنان الرتبة الكنسيّة بوضوح."
    authored:
      - type: terminological
        text: "رُتبةٌ كَنَسِيَّةٌ يتولّاها مَن يَرأَسُ الشَّمامِسَةَ ويُشرِفُ على شؤونِهم في الأبرشيّة، وهي دونَ رُتبة الأُسقُف."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "رُتبةٌ كَنَسِيَّةٌ يتولّاها مَن يَرأَسُ الشَّمامِسَةَ ويُشرِفُ على شؤونِهم في الأبرشيّة، وهي دونَ رُتبة الأُسقُف."

  examples:
    per_lemma:
      - lemma: "رِئَاسَةُ الشَّمَامِسَة"
        examples:
          - text: "عُيِّنَ الأبُ يوحنّا في رِئاسةِ الشَّمامِسَةِ بعدَ خِدمةٍ طويلةٍ في الأبرشيّة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "عُيِّنَ الأبُ يوحنّا في رِئاسةِ الشَّمامِسَةِ بعدَ خِدمةٍ طويلةٍ في الأبرشيّة."

