      maqayis_quote: "«الْخَاءُ وَالْمِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى التَّغْطِيَةِ، وَالْمُخَالَطَةِ فِي سَتْرٍ. فَالْخَمْرُ: الشَّرَابُ الْمَعْرُوفُ... وَخُمْرَتُهَا: مَا غَشِيَ الْمَخْمُورَ مِنَ الْخُمَارِ وَالسُّكْرِ فِي قَلْبِهِ»"

