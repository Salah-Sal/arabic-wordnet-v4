# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14042389-n (grogginess)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ترنح السكر» تركيب إضافي حرّ وليست وحدة معجمية ثابتة؛ يمكن إبدال «ترنح» بـ«تمايل» أو «دوار» دون تغيّر المدلول"
      - "لا يوجد مصطلح عربي مُسكوك واحد في المجموعة رغم وجود ألفاظ تراثية دقيقة كـ«خُمار»"
      - "التعريف العربي الحالي ترجمة حرفية شبه مباشرة للتعريف الإنجليزي"
    observations: "المفهوم يدلّ على الحالة الجسدية والذهنية من دُوار وتمايل وغشي يعتري شارب الخمر. وهو نوع فرعي من السُّكر/التسمم الكحولي، يركّز على الأعراض الحركية والإدراكية (الترنح والذهول) لا على مطلق الإسكار. في التراث العربي المعجمي يوجد لفظ «خُمار» على وزن فُعال الدالّ على الأدواء والأحوال، وهو مصطلح دقيق لهذا المعنى."

  blind_candidates:
    - lemma: "خُمَار"
      generation_method: ishtiqaq
      justification: "مشتقّ من جذر «خمر» على وزن فُعال الذي يُستعمل للأدواء والأحوال (كالصُّداع والدُّوار)، ويدلّ على ما يصيب شارب الخمر من ألم ودُوار وتمايل وغشي"
    - lemma: "نَشْوَة"
      generation_method: ishtiqaq
      justification: "مشتقّ من جذر «نشو»، ويدلّ في المعاجم على أوّل السُّكر والارتياح من الشراب، وهو حالة تقارب الدوخة والترنح"
    - lemma: "غَمْرَة"
      generation_method: majaz
      justification: "إزاحة دلالية من معنى الغمر (التغطية والستر) إلى حالة الغشي والانهماك التي تغمر صاحبها وتستره عن الوعي، كما في «غمرات الموت»"
    - lemma: "سُكَار"
      generation_method: ishtiqaq
      justification: "مشتقّ من جذر «سكر» على وزن فُعال، بمحاذاة خُمار، للدلالة على حالة السُّكر المصحوبة بالترنح"


stage2_evidence:
  per_lemma:
    - lemma: "تَرَنُّح السُّكْر"
      evidence_status: "no_material_found"

    - lemma: "خُمَار"
      confirm:
        - text: "«الدَّاءُ العارِضُ من الخَمْرِ. وهو ما خالَطَ الإنسانَ من أَلَمِ الخَمْرِ وصُدَاعِها وأَذَاها. بَقِيَّةُ السُّكْرِ»"
          source: "المعجم الكبير"
        - text: "«من الخَمْر: ما يصيب شاربها من ألمها وصداعها. ما خالط الإنسان من سُكْر الخمر»"
          source: "المعجم الوسيط"
        - text: "«ما خالط الإنسان من سكر الخمر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«خُمْرَتُهَا: مَا غَشِيَ الْمَخْمُورَ مِنَ الْخُمَارِ وَالسُّكْرِ فِي قَلْبِهِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«translation_en: hangover»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُقابل خُمار في المصطلحية الطبية الحديثة مفهوم hangover الذي يتضمّن الدُّوار والترنح"
        - text: "«translation_en: katzenjammer (hangover)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "تأكيد إضافي للمقابلة الطبية"

    - lemma: "نَشْوَة"
      contradicts:
        - text: "«أوَّل السُّكر. الارتياح للأمر والنشاط له. الرَّائحة»"
          source: "المعجم الوسيط"
          conflict: "النشوة تدلّ على أوّل السُّكر والارتياح والنشاط، وهي حالة إيجابية/ابتهاجية لا حالة ذهول وترنح"

    - lemma: "غَمْرَة"
      contradicts:
        - text: "«الشِّدَّة. الزحمة. الضلالة التى تغمر صاحبها. الماء الكثير»"
          source: "المعجم الوسيط"
          conflict: "الغمرة تدلّ على مطلق الشدّة والضلالة، وليست خاصّة بالسُّكر ولا تفيد الترنح الجسدي"

    - lemma: "سُكَار"
      contradicts:
        - text: "«بائعُ السُّكَّر من الخمر والنبيذ وما أشبههما»"
          source: "المعجم الوسيط"
          conflict: "السَّكَّار هو بائع الخمر والنبيذ، وليس حالة السُّكر أو الترنح"
        - text: "«النَّبَّاذ (صانِعُ النبيذ). بائعُ النَّبيذ»"
          source: "المعجم الكبير"
          conflict: "تأكيد أنّ السَّكَّار فاعل (بائع/صانع) لا حالة"


stage3_analysis:
  per_lemma:
    - lemma: "تَرَنُّح السُّكْر"
      decision: removed
      decision_reason: "تركيب إضافي وصفي حرّ لا يُعدّ وحدة معجمية ثابتة. لا يوجد أيّ شاهد معجمي عليه بوصفه مصطلحاً مسكوكاً. يمكن إبدال «ترنح» بـ«تمايل» أو «دوار» والمعنى لا يتغيّر، مما يؤكّد أنّه عبارة وصفية حرّة وليس مصطلحاً. في المقابل يوجد لفظ «خُمار» المُسكوك والمشهود له في المعاجم الكلاسيكية والحديثة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "خُمَار"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي أصيل على وزن فُعال (وزن الأدواء والأحوال) مشتقّ من جذر «خمر». شواهده متعدّدة في المعجم الوسيط والمعجم الكبير ومقاييس اللغة والمعجم الطبي الموحد. يدلّ تحديداً على الحالة التي تصيب شارب الخمر من ألم ودُوار وغَشْي وترنّح، وهو المعنى المطلوب في المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "خُمَار"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نَشْوَة"
      source: stage1
      decision: removed
      decision_reason: "النشوة تدلّ على أوّل السُّكر والارتياح والنشاط، وهي حالة ابتهاجية إيجابية تختلف جوهرياً عن حالة الذهول والترنح التي تعبّر عنها المجموعة. الأدلة المعجمية تناقض الاستخدام المطلوب."
      evidence_assessment:
        case: contradicts_only

    - lemma: "غَمْرَة"
      source: stage1
      decision: removed
      decision_reason: "الغمرة تدلّ على مطلق الشدّة والانهماك في الباطل، وليست مختصّة بالسُّكر. لا تفيد الترنّح الجسدي ولا الذهول الكحولي تحديداً. هي أعمّ من المطلوب ولا تصلح مرادفاً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "سُكَار"
      source: stage1
      decision: removed
      decision_reason: "السَّكَّار في المعاجم هو بائع الخمر والنبيذ أو صانعه، وهو اسم فاعل/حرفة لا اسم حالة. لا علاقة له بالمفهوم المطلوب (حالة ذهول وترنح)."
      evidence_assessment:
        case: contradicts_only


stage4_content:
  definition:
    current: "حالة ذهول وترنح ناجمة عن الكحول"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية شبه مباشرة للتعريف الإنجليزي. يحتاج إلى إعادة صياغة بأسلوب المعجم الوسيط مع مراعاة الدقة اللغوية والجنس القريب والفصل النوعي."
    authored:
      - type: terminological
        text: "داءٌ يعتري شاربَ الخمرِ من دُوارٍ وصُداعٍ وتمايلٍ وغَشْيٍ بعد السُّكر أو في أثنائه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يُخالط المرءَ من أثر الخمر في بدنه وعقله فيُذهله ويُرنّحه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "داءٌ يعتري شاربَ الخمرِ من دُوارٍ وصُداعٍ وتمايلٍ وغَشْيٍ بعد السُّكر أو في أثنائه"

  examples:
    per_lemma:
      - lemma: "خُمَار"
        examples:
          - text: "أصبح الرجلُ يشكو خُمَارًا شديدًا بعد ليلةٍ من الإسراف في الشراب، فلم يَقْوَ على المشي مستقيمًا."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أصبح الرجلُ يشكو خُمَارًا شديدًا بعد ليلةٍ من الإسراف في الشراب، فلم يَقْوَ على المشي مستقيمًا."


