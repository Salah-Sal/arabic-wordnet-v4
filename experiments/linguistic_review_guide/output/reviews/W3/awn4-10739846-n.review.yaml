# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset: awn4-10739846-n  |  ili: i93718  |  pos: n
# المفهوم: a star runner / عداء متميز ومشهور
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('عداء نجم' و'نجم المضمار') خاليتان من التشكيل الكامل"
      - "التعريف الحالي 'عداء متميز ومشهور' موجز ومُخلٍّ: لا يُحدِّد مجال السباق (المضمار) ولا يَذكر جنساً قريباً واضحاً"
      - "اللمّة 'عداء نجم' اقتراض بنيوي من الإنجليزية (star runner) بترتيب غير نمطي في العربية (اسم المهنة + الاسم العَلَمي الوظيفي)"
    observations: >
      المجموعة تُمثِّل مفهوماً رياضياً معاصراً هو العدَّاء الأثيل المتميِّز في ميدان
      سباقات المضمار. اللمّة 'نجم المضمار' مركَّب إضافي عربي خالص راسخٌ في الصحافة
      الرياضية، إذ يُشبَّه العدَّاء البارز بالنجم الساطع في مضمار السباق؛ وأصل هذا
      المجاز متوغِّل في العربية (نجم فيهم فارس: نبغ). أمّا 'عداء نجم' فهو تقليد
      حرفيٌّ للتركيب الإنجليزي star runner، وإن كان مقبولاً صرفياً فالترتيب
      الإسنادي التوصيفي (موصوف + نعت اسميٌّ محض بلا تعريف) نادرٌ ومُقتبَس. كلا
      المصطلحين مُستعمَلان لكنّهما يفتقران إلى التوثيق المعجمي المُركَّب.
  blind_candidates:
    - lemma: "السَّبَّاقُ"
      generation_method: ishtiqaq
      justification: >
        من جذر (س ب ق) على وزن فعَّال للمبالغة؛ يدلُّ على المتفوِّق المتقدِّم دوماً.
        المعجم الكبير: 'سَبَّاق غايات: حائزٌ قصباتِ السبق'. يصلح للعدّاء الذي يتصدّر
        دائماً، لكنّه يغفل مكوِّن العدْو (الجري) الذي يُحدِّد نوع النشاط الرياضي.
    - lemma: "فَارِسُ الْمِضْمَارِ"
      generation_method: tarkib
      justification: >
        مركَّب إضافي: فارس (الحاذق بركوب الخيل، ثم توسَّع لكل ماهر في ميدانه) +
        المضمار (مجال التنافس في الرياضة). شائع في الخطاب الرياضي العربي للدلالة
        على البطل المتميِّز في ميدانه، ويحمل دلالات الفروسية والمهارة.
    - lemma: "النَّجِيبُ"
      generation_method: ishtiqaq
      justification: >
        من جذر (ن ج ب) وزن فعيل بمعنى الفاضل على مثله النفيس في نوعه. ابن فارس:
        'النجابة مصدر الرجل النجيب أي الكريم'. يصلح للعدَّاء المتميِّز لكنّه
        عامٌّ لا يخصّص الرياضة.
    - lemma: "الْمُبَرِّزُ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من (بَرَّزَ) من جذر (ب ر ز) بمعنى الظهور والانفراد والسبق.
        ابن فارس: 'بَرَّزَ الرجلُ والفرسُ: إذا سبقا، وهو من الباب'.
        يُعبِّر عن التميُّز والتفوُّق والخروج على الأقران.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عداء نجم"
      expands:
        - text: "«العَدَّاءُ: الشديدُ العَدْوِ من الناس والخيل»"
          source: "المعجم الوسيط"
          addition: "يُثبِت أن 'عداء' يدلُّ على شدّة العدو والبراعة فيه، ويصلح أساساً لمكوِّن 'عداء' في المركَّب"
        - text: "«نَجَمَ فيهم شاعرٌ أو فارسٌ: نَبَغَ»"
          source: "المعجم الوسيط"
          addition: "يُثبِت المجاز الدلالي لـ'نجم' بمعنى البروز والنبوغ، وهو أساس استعماله للشخص المشهور"
        - text: "«النَّجْمُ: أحد الأجرام السماوية المضيئة بذاتها... الكوكب... الوقت المعين»"
          source: "المعجم الوسيط"
          addition: "دلالة النجم الأصلية، يتّضح منها أن الاستعمال في 'عداء نجم' مجازٌ عن الشهرة والإضاءة"
      # ملاحظة: لم يرد المركَّب 'عداء نجم' كوحدة معجمية في أيٍّ من المصادر المستعلَمة

    - lemma: "نجم المضمار"
      expands:
        - text: "«المِضمارُ: المكانُ تُضَمَّرُ فيه الخيلُ أو تتسابق... مُدَّةُ تضمير الخيل»"
          source: "المعجم الوسيط"
          addition: "يُثبِت أن المضمار هو ميدان السباق، مما يُحدِّد طبيعة النشاط الرياضي في المركَّب"
        - text: "«مِضمار: مجالُ التَّنافس في ساحات الفنِّ أو الأدب أو العلم أو الرياضة ونحوها»"
          source: "المعجم الكبير"
          addition: "توسُّع دلالي لـ'المضمار' ليشمل الرياضة عموماً وميدان السباق خصوصاً"
        - text: "«نَجَمَ فيهم شاعرٌ أو فارسٌ: نَبَغَ»"
          source: "المعجم الوسيط"
          addition: "يُثبِت راسخية المجاز في استعمال 'نجم' للبروز والشهرة في مجالٍ ما"
      # ملاحظة: لم يرد المركَّب 'نجم المضمار' كوحدة معجمية، لكنّ مكوِّنيه موثَّقان ومجازه العربي راسخ

    - lemma: "السَّبَّاقُ"
      confirm:
        - text: "«السَّبَّاقُ: الكثيرُ السَّبق. سَبَّاقُ غاياتٍ: حائزٌ قَصَبَاتِ السَّبْق»"
          source: "المعجم الكبير"
        - text: "«السَّبَّاقُ: الكثير السبق»"
          source: "المعجم الوسيط"
        - text: "«سَبَّاق: من (س ب ق) الكثير التقدم في الخير، ومن يعلو قومه كرماً، ومن يكثر المجيء قبل غيره»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«السَّبَّاقُ» في المصادر ليس مقيَّداً بالعدو (الجري) بل يشمل كل تقدُّم في الخير وعلو المكانة"
          source: "المعجم الوسيط والكبير"
          conflict: "المصطلح عامٌّ لكل سابق ولا يخصِّص رياضة الجري أو العدو"

    - lemma: "فَارِسُ الْمِضْمَارِ"
      expands:
        - text: "«الفارِسُ: الحاذق بركوب الخيل. الأسد. صاحب الفرس. العارف بالأمور»"
          source: "المعجم الوسيط"
          addition: "يُثبِت أن 'الفارس' ينتمي أصلاً للفضاء الدلالي للخيول والفروسية، مما يُضيق نطاق المركَّب نحو الفروسية لا الجري"
        - text: "«الفارِسُ: الماهر في ركوب الخيل. الفرسانُ في الجيش: المحاربون على ظهور الخيل. الحاذق بما يمارس من الأشياء»"
          source: "المعجم الوسيط"
          addition: "التوسُّع 'الحاذق بما يمارس' يسمح باستعمال المركَّب للعدَّاء، لكنّ السياق الأوَّلي يظل الفروسية"

    - lemma: "النَّجِيبُ"
      confirm:
        - text: "«النَّجِيبُ: الفاضل على مِثْلِهِ النَّفِيسُ في نوعه»"
          source: "المعجم الوسيط"
        - text: "«النجيب: الفاضل على مثله»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«النَّجيبُ: الكريمُ الحسيبُ، ج: أنجابٌ ونُجباءُ ونُجُبٌ»"
          source: "القاموس المحيط للفيروزآبادي"
      contradicts:
        - text: "«النجيب: الخير المبارك الصحيح الرأي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "'النجيب' دلالته الكرم والحسب لا البراعة الرياضية، ولا صلة له بالعدو أو الجري"

    - lemma: "الْمُبَرِّزُ"
      contradicts:
        - text: "«مُبْرِز: eccritic» (مصطلح طبّي: مُفرِز)"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "التداخل مع مصطلح طبي يُشكِّل عبئاً على الاستعمال في السياق الرياضي"
      expands:
        - text: "«مُبَرَّز: كان شاعراً مُبَرَّزاً [فصيحة]. كان شاعراً مُبَرِّزاً [فصيحة]. ورد الفعل 'بَرَّز' في المعاجم لازماً وذا يكون الوصف منه اسم الفاعل»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يُثبِت صحّة 'مُبَرِّز' اسم فاعل، لكنّ الاستعمال الموثَّق في السياق الأدبي لا الرياضي"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عداء نجم"
      decision: confirmed
      decision_reason: >
        اللمّة مستعملة في الصحافة الرياضية العربية وتُعبِّر بوضوح عن المفهوم؛
        مكوِّناها موثَّقان معجمياً، والمجاز الدلالي لـ'نجم' بمعنى المشهور راسخٌ.
        غير أنّها تفتقر إلى التشكيل وتحتاج تصحيحه. البنية التركيبية (موصوف + نعت
        اسمي ٌّ بلا أداة تعريف) نادرةٌ في العربية لكنّها مقبولة صرفياً على وجه
        البدل أو العطف البياني.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز هذا المصطلح مهنة العدو مقرونةً بصفة النجومية الشخصية؛ التركيز على
        هوية الفرد كـ'عدَّاء' أوَّلاً ثم 'نجم' ثانياً. أقرب للأسلوب الخبري
        المباشر في وصف الرياضيين.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَّاء نَجْم"

    - lemma: "نجم المضمار"
      decision: confirmed
      decision_reason: >
        مركَّب إضافي عربي أصيل راسخٌ في الخطاب الرياضي؛ يستثمر المجاز الدلالي
        العربي لـ'نجم' (النبوغ والظهور) مع تقييده بـ'المضمار' (ميدان سباقات الجري).
        المركَّب يجتاز اختبار التثبيت المعجمي بتماسكه الدلالي وعدم قابليته للتبديل
        بمرادف حرٍّ. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز هذا المصطلح المكانةَ النجومية في سياق الميدان الرياضي؛ التركيز على
        'النجومية' أوَّلاً و'المضمار' سياقاً. أكثر شعرياً وبلاغةً من 'عداء نجم'،
        وأكثر تداولاً في التقارير الرياضية التحليلية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَجْمُ الْمِضْمَارِ"

    - lemma: "السَّبَّاقُ"
      source: stage1
      decision: removed
      decision_reason: >
        على الرغم من توثيقه المعجمي الجيِّد، فإنّ 'السبّاق' لا يخصِّص رياضة الجري
        (العدو) بل يدلُّ على كل متقدِّم في أيِّ مجال. المجموعة تنتمي لتصنيف
        رياضة المضمار تحديداً، وهو ما لا يُفيده هذا المصطلح. يفقد أيضاً
        مكوِّن الشهرة والنجومية الذي تتضمَّنه اللمّتان الموجودتان.
      evidence_assessment:
        case: mixed

    - lemma: "فَارِسُ الْمِضْمَارِ"
      source: stage1
      decision: removed
      decision_reason: >
        المركَّب وإن كان شائعاً في الخطاب الرياضي إلا أنّه تقليدياً مرتبط
        بالفروسية (الخيول)؛ 'فارس' من جذر يتعلّق بركوب الخيل، مما يُحدِث
        تنافراً دلالياً مع رياضة الجري. فضلاً عن ذلك، يُعبِّر عن البطولة
        العامة لا النجومية في العدو تحديداً. اللمّة الأفضل 'نجم المضمار'
        موجودة أصلاً في المجموعة وتؤدِّي هذا الدور بصورة أدقّ.
      evidence_assessment:
        case: no_material

    - lemma: "النَّجِيبُ"
      source: stage1
      decision: removed
      decision_reason: >
        'النجيب' يدلُّ على الكرم والحسب والعِرق الطيِّب، وهي دلالة متجذِّرة في
        التراث العربي للأشخاص والخيول والإبل الأصيلة. لا صلة مباشرة بين دلالته
        ورياضة العدو أو الجري، ولا يتضمَّن مكوِّن الشهرة الرياضية. الاستعمال
        الموثَّق أدبي أخلاقي لا رياضي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "الْمُبَرِّزُ"
      source: stage1
      decision: removed
      decision_reason: >
        'المبرِّز' وإن صحَّ صرفياً واسم فاعلٍ للمتميِّز، فإنّه: (أ) يتداخل مع
        مصطلح طبي 'مبرِز = eccritic' مما يُحدِث لبساً، (ب) الاستعمال الموثَّق
        أدبيٌّ لا رياضي، (ج) لا يُحدِّد مجال العدو والجري. لا مزيّة له على
        اللمّات الموجودة.
      evidence_assessment:
        case: mixed


