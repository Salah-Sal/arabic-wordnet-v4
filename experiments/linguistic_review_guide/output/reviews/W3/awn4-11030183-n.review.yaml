# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-11030183-n
# ili       : i95317
# pos       : n  →  proper_noun (مُوصى بالتصحيح)
# lemmas    : غراهام | مارثا غراهام
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "POS مُسجَّل كـ n (اسم عام)، غير أن المجموعة تمثّل اسم علم لشخصية بعينها؛ ينبغي تصحيحه إلى proper_noun"
      - "اللمّة 'غراهام' وحدها غامضة: توجد شخصيات كثيرة تحمل هذا اللقب (توماس غراهام الكيميائي، غراهام ستيل الطبيب …) مما يُفقدها الإحالة الصريحة إلى مارثا غراهام"
      - "اللمّتان خاليتان من التشكيل الكامل"
      - "التعريف العربي مترجَم ترجمةً حرفية من الإنجليزية ولا يستوفي أسلوب التعريف الموسوعي المعجمي"
    observations: >
      هذه مجموعة خاصة بشخصية علمية مشهورة هي الراقصة الأمريكية مارثا غراهام (1893-1991)،
      رائدة حركة الرقص الحديث. الإشكالية الجوهرية هي احتواء المجموعة على اللمّة
      المُقتضَبة "غراهام" التي تُشاطرها عدة شخصيات أخرى، فضلاً عن خطأ POS.
      الاسم الكامل "مارثا غراهام" هو المصطلح المُحدِّد الذي يُعرَّف به هذه الشخصية
      في المصادر العربية الموثوقة.

  blind_candidates:
    - lemma: "مَارْثَا غَرَاهَام"
      generation_method: tarkib
      justification: >
        تركيب إضافي من مكوّنَيْن أعجميَّيْن مُعرَّبَيْن: الاسم الأول "مارثا" + اللقب
        "غراهام". هذا هو الاسم الكامل للشخصية كما يُستخدَم في المصادر العربية،
        ويُحدِّدها بلا إلباس.
    - lemma: "غَرَاهَام"
      generation_method: taarib
      justification: >
        تعريب لقب الشخصية باعتباره المكوِّن الثاني من الاسم الثنائي. يُستخدَم
        وحده في سياقات الاختصار، غير أنه قاصر عن التحديد المنفرد.
    - lemma: "مَارْثَا"
      generation_method: taarib
      justification: >
        تعريب الاسم الأول للشخصية. يُستخدَم أحياناً في الإشارات غير الرسمية،
        لكنه مُشترَك بين كثير من حاملات هذا الاسم.
    - lemma: "جَرَاهَام"
      generation_method: taarib
      justification: >
        صيغة تعريب بديلة للقب "Graham" بالجيم بدلاً من الغين، وقد وردت في
        بعض المصادر العربية (قانون جراهام في الكيمياء)، وهي صيغة متداوَلة
        في التعريبات الأكاديمية القديمة.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  query_log:
    - query_num: 1
      type: batch_headword_lookup
      terms: ["غراهام", "الغراهام", "مارثا غراهام", "المارثا غراهام", "مارثا", "المارثا", "غراهام مارثا"]
      result: "لا مداخل مطابقة مباشرة لأيٍّ من هذه الأسماء بوصفها اسماً علماً للراقصة"
    - query_num: 2
      type: english_bridge
      terms: ["Graham", "Martha Graham", "Martha", "choreographer", "dance"]
      result: "وُجد مصطلح 'مصمم الرقصات' ترجمةً لـ choreographer، ومداخل عديدة لـ dance؛ لا مدخل مباشر لـ Martha Graham"
    - query_num: 3
      type: arabic_fts_keywords
      terms: ["غراهام", "مارثا", "راقصة", "كوريغراف"]
      result: "وُجد مداخل بها 'غراهام' في سياق طبي وكيميائي، ومدخل واحد لـ 'جراهام' في موسوعة الأسماء"
    - query_num: 4
      type: alternative_spelling
      terms: ["جراهام", "الجراهام", "مارثا جراهام", "كوريغراف", "كوريوغراف"]
      result: "entry_id=919621: جراهام في موسوعة السلطان قابوس لأسماء العرب"

  per_lemma:
    - lemma: "غراهام"
      expands:
        - text: "«نَفْخَةُ غراهام ستيل» — مصطلح طبي"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          addition: >
            يُثبت أن لفظ "غراهام" مستخدَم في العربية المعاصرة تعريباً لاسم علم
            أعجمي، غير أنه مُنسوب هنا لشخصية طبية مغايرة (Graham Steell)،
            مما يؤكد غموضَ اللمّة المُقتضَبة.
        - text: "«قانون الانتشار، قانون غراهام» | «قانون غراهام، قانون انتشار الغازات، قانون جراهام»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992) — ARABTERM"
          addition: >
            يُظهر استخدام "غراهام" لإسناد قانون فيزيائي-كيميائي إلى توماس غراهام؛
            وهذا دليل إضافي على أن الاسم يُحيل إلى أكثر من شخصية.

    - lemma: "مارثا غراهام"
      evidence_status: "no_material_found"

    - lemma: "مَارْثَا غَرَاهَام"
      evidence_status: "no_material_found"

    - lemma: "مَارْثَا"
      evidence_status: "no_material_found"

    - lemma: "جَرَاهَام"
      expands:
        - text: "«جراهام — عن الألمانية بمعنى شخص قاطن في البيت الرمادي. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani)"
          addition: >
            يُثبت وجود صيغة "جراهام" بالجيم في المصادر العربية، لكن السياق
            معجمي اشتقاقي (شرح أصل الاسم) ولا يتعلق بمارثا غراهام تحديداً.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "غراهام"
      decision: removed
      decision_reason: >
        اللمّة "غراهام" لقبٌ مشترَك بين شخصيات كثيرة ذات شُهرة علمية (توماس غراهام
        الفيزيائي الكيميائي، غراهام ستيل طبيب القلب، وسواهما). لا يُحيل وحده
        إلى مارثا غراهام الراقصة في أي سياق غير مُقيَّد، مما يجعله مصدرَ إلباسٍ
        حقيقياً. يجب حذف ربطه بهذه المجموعة وإبقاء الاسم الكامل فقط.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مارثا غراهام"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخصية (الاسم الأول + اللقب) هو الصيغة المعتمدة في
        المصادر العربية المتخصصة للإحالة إلى هذه الراقصة تحديداً. رغم غياب
        مدخل مباشر في قاعدة البيانات، فإن هذا متوقَّع لأسماء الأعلام الفنية
        التي نادراً ما تُدرَج في المعاجم العربية التقليدية. اللمّة تستوفي اختبار
        التثبيت المعجمي كوحدة دلالية مُقيَّدة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        بوصفها اللمّة الوحيدة المُتبقَّاة في المجموعة بعد حذف "غراهام"،
        تُمثِّل هذه اللمّة الإحالة المتعيِّنة الكاملة للشخصية دون سواها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَارْثَا غَرَاهَام"

    - lemma: "مَارْثَا غَرَاهَام"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة "مارثا غراهام" التي أُكِّدت — لا حاجة
        لإنشاء مدخل جديد منفصل.

    - lemma: "مَارْثَا"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الأول وحده مُشترَك بين عشرات الشخصيات، ولا يُحيل إلى مارثا غراهام
        بمعزل عن لقبها. لا يصلح لمّةً في مجموعة خاصة بشخصية بعينها.

    - lemma: "جَرَاهَام"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة بالجيم موثَّقة في العربية لكنها مُنسوبة إلى توماس غراهام
        الكيميائي (قانون جراهام) وليس مارثا غراهام. إدراجها سيُوجِد إلباساً
        إضافياً مع المجال العلمي.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-11030183-n"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "راقصة ومصممة رقصات أمريكية اشتهرت أعمالها بالتقشف والصرامة التقنية (1893-1991)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية تفتقر إلى: (أ) الإشارة إلى ريادتها
        في حركة الرقص الحديث وهو الفصل الأبرز لها، (ب) أسلوب التعريف الموسوعي
        المعجمي الذي يضع الشخصية في سياقها الفني، (ج) دقة التأريخ وتحديد الجنسية
        بصورة أوضح.
    authored:
      - type: encyclopedic
        text: >
          راقصةٌ أمريكية ومصمِّمةُ رقصاتٍ (1893-1991)، تُعدُّ رائدةَ حركة
          الرقص الحديث في الولايات المتحدة؛ اشتُهرت بأسلوب تعبيريٍّ متميِّز
          يقوم على التقشُّف في الحركة والصرامة التقنية، وأسهمت في تطوير تقنيات
          جديدة أرست دعائم الرقص المسرحي الحديث.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11030183-n"
          definition_index: 0
          text: >
            راقصةٌ أمريكية ومصمِّمةُ رقصاتٍ (1893-1991)، تُعدُّ رائدةَ حركة
            الرقص الحديث في الولايات المتحدة؛ اشتُهرت بأسلوب تعبيريٍّ متميِّز
            يقوم على التقشُّف في الحركة والصرامة التقنية، وأسهمت في تطوير تقنيات
            جديدة أرست دعائم الرقص المسرحي الحديث.

  examples:
    per_lemma:
      - lemma: "مَارْثَا غَرَاهَام"
        examples:
          - text: "غيَّرت مَارْثَا غَرَاهَام مفهومَ الرقص المسرحي في القرن العشرين بأسلوبها التعبيريّ الصارم."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "غيَّرت مَارْثَا غَرَاهَام مفهومَ الرقص المسرحي في القرن العشرين بأسلوبها التعبيريّ الصارم."


