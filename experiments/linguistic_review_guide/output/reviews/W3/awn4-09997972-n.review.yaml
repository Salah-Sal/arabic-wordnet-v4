      decision: revise
      reason: >-
        التعريف الحالي صحيح في مبناه لكنه يستعمل 'علم الجريمة' بدلاً من 'علم الإجرام' الذي هو
        المصطلح المعياري في المعاجم العربية المتخصصة (القانون، الطب، الاجتماع). كذلك يفتقر إلى
        الفصل النوعي (differentia) الذي يُميّز عالم الإجرام عن غيره من المتخصصين (الجنائيين،
        الأمنيين، القانونيين). يُصاغ تعريف مصطلحي أشمل وتعريف لغوي مختصر.
    authored:
      - type: terminological
