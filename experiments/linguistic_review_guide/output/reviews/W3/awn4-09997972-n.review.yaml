# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'عالم إجرام' مكتوبة بدون تشكيل"
      - "المجموعة تقتصر على لمّة واحدة دون مرادفات أو بدائل معجمية موثَّقة"
      - "الصيغة الإضافية 'عالم إجرام' تخلو من 'ال' في المضاف إليه (إجرام)، مما يُحوِّلها إلى وصف مُنكَّر لا إلى مسمّى مصطلحي محدَّد؛ الصواب الأسلوبي للتسمية العلمية 'عالم الإجرام'"
      - "التعريف العربي الحالي 'متخصص في علم الجريمة' يستعمل 'علم الجريمة' بينما المصطلح العربي المعياري الشائع في المعاجم المتخصصة هو 'علم الإجرام'"
    observations: >-
      المجموعة تمثّل مفهوماً أكاديمياً حديثاً: الشخص المتخصص في دراسة الجريمة أسباباً وأنماطاً وسُبُل وقاية، وهو ما يُعرف بـ criminologist. الأصل العربي لهذا المفهوم
      المصطلحي يرتكز على مركب إضافي يجمع بين وصف الشخص العلمي (عالم/متخصص/باحث) وحقله المعرفي (الإجرام/الجريمة). اللمّة الحالية صحيحة في جوهرها لكنها تحتاج
      إلى تشكيل وتدقيق بنيوي. الجذر (ج ر م) راسخ في العربية يحمل معنى الاقتطاع ثم الكسب ثم الجُرم، وهو يدعم الاشتقاق المصطلحي من علم الإجرام.
  blind_candidates:
    - lemma: "عَالِمُ الإِجْرَامِ"
      generation_method: tarkib
      justification: >-
        مركب إضافي (عَالِم + الإِجرَام)؛ 'الإجرام' مصدر من أجرَمَ، ويُستعمل في العربية المعاصرة علَماً على علم الجريمة (criminology)؛ فـ'عالم الإجرام' هو من
        يتخصص في هذا العلم تخصصاً أكاديمياً. إدخال 'ال' على المضاف إليه يُعطي المركب طابع التسمية المُؤسَّسة.
    - lemma: "خَبِيرُ الجَرِيمَةِ"
      generation_method: tarkib
      justification: >-
        مركب إضافي (خَبِير + الجَرِيمَة)؛ 'خبير' يدل على عمق المعرفة العملية والنظرية في آنٍ، و'الجريمة' تُحيل إلى موضوع التخصص. يُناسب السياقات التي تُبرز
        الجانب الاستشاري والتطبيقي للتخصص في مقابل الوجه الأكاديمي البحتة.
    - lemma: "إِجْرَامِيٌّ"
      generation_method: ishtiqaq
      justification: >-
        اسم منسوب إلى 'الإجرام' على وزن فَعَلِيّ، يُستعمل استعمال الاسم المستقل للدلالة على المتخصص في علم الإجرام، على غرار 'نَفسَاني' للمتخصص في علم النفس
        و'اجتِماعيّ' لعالم الاجتماع في الاستعمال العربي الحديث.
    - lemma: "جَرِيمُولُوجِيّ"
      generation_method: taarib
      justification: >-
        تعريب مباشر من criminologist عبر جذع criminology → جَرِيمُولُوجيا، ثم نسبة صناعية يقبل لامَ التعريف والجمعَ السالم (جريمولوجيون). يُعدّ ملاذاً أخيراً
        يُلجأ إليه إذا تعذّرت الصياغة الاشتقاقية والتركيبية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1: batch headword lookup — عالم اجرام + الإجرام + المرشحات الأربعة → لا نتائج مباشرة
#   Q2: English bridge — criminologist / criminology → 2 مداخل مباشرة
#   Q3: Arabic FTS — اجرام + جريمة + متخصص → مداخل عامة بدون تطابق دقيق
#   Q4: Maqayis — جرم + علم → اقتباسات وافية
stage2_evidence:
  per_lemma:

    - lemma: "عالم إجرام"
      confirm:
        - text: "«مختص في علم الإجرام»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ALECSO، translation_en: criminologist"
        - text: "«الباحث في علم الجريمة.»"
          source: "المورد الحديث (2008)، translation_en: criminologist"
      expands:
        - text: "«علم الإجرام»"
          source: "المعجم الموحد لمصطلحات القانون (2017)، translation_en: criminology"
          addition: "المصطلح العربي المعياري للعلم الذي يتخصص فيه عالم الإجرام هو 'علم الإجرام' لا 'علم الجريمة'"
        - text: "«عِلْمُ الإِجْرَام»"
          source: "المعجم الطبي الموحد (2009)، translation_en: criminology"
          addition: "تأكيد على ضبط المصطلح بتشكيل 'عِلمُ الإِجرَامِ'"
        - text: "«علم الجريمة»"
          source: "المورد الحديث (2008)، translation_en: criminology"
          addition: "تُقابَل 'علم الجريمة' و'علم الإجرام' كمرادفَين في بعض المعاجم الحديثة"

    - lemma: "عَالِمُ الإِجْرَامِ"
      confirm:
        - text: "«مختص في علم الإجرام»"
          source: "المعجم الموحد لمصطلحات القانون (2017)، translation_en: criminologist"
      expands:
        - text: "«علم الإجرام»"
          source: "المعجم الموحد لمصطلحات القانون (2017) + المعجم الطبي الموحد (2009)"
          addition: "ثبوت 'علم الإجرام' بالتعريف (مع ال) مصطلحاً معيارياً، مما يُرجِّح الصيغة 'عالم الإجرام' (مع ال) على 'عالم إجرام'"

    - lemma: "خَبِيرُ الجَرِيمَةِ"
      evidence_status: "no_material_found"

    - lemma: "إِجْرَامِيٌّ"
      contradicts:
        - text: "«إجرام» — translation_en: criminality"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: >-
            المدخل المعجمي يُرادف 'إجرام' بـ criminality (الإجرامية/السلوك الإجرامي) لا بـ criminologist؛
            أي أن 'إجرامي' المنسوب يُحيل إلى صفة الجريمة لا إلى صاحب التخصص، مما يُنشئ لبساً مع
            المعنى الصفتي (criminal / إجرامي = مجرم صفةً).

    - lemma: "جَرِيمُولُوجِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ─── اللمّة الموجودة ───────────────────────────────────────
    - lemma: "عالم إجرام"
      decision: confirmed
      decision_reason: >-
        المركب الإضافي 'عالم إجرام' صحيح نحوياً وصالح دلالياً للتعبير عن المتخصص في علم الإجرام،
        غير أن الصيغة المعيارية للمصطلح تستلزم 'ال' على المضاف إليه: 'عالم الإجرام'، إذ إن 'علم
        الإجرام' (مع ال) هو الاسم العلَمي للحقل المعرفي كما ثبت في معاجم متعددة. يُصحَّح إذن
        التشكيل ويُضاف 'ال' للمضاف إليه.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        'عَالِمُ الإِجْرَامِ' يُبرز الطابع الأكاديمي العلمي الرصين، ويحمل دلالة صاحب العلم الراسخ
        الذي يستوعب نظريات الإجرام وفلسفته وأبحاثه، ويميّزه عن المتخصص الوظيفي أو رجل الأمن
        أو القاضي. يُستعمل أساساً في السياقات الجامعية والبحثية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَالِمُ الإِجْرَامِ"

    # ─── مرشحات المرحلة ١ ─────────────────────────────────────
    - lemma: "عَالِمُ الإِجْرَامِ"
      source: stage1
      decision: removed
      decision_reason: >-
        هذا المرشح يتطابق مع اللمّة الموجودة بعد تصحيحها (update_lemma)، فلا حاجة إلى إنشاء
        مدخل جديد مستقل؛ يُدمج في تصحيح اللمّة الحالية.

    - lemma: "خَبِيرُ الجَرِيمَةِ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية مباشرة تُثبت هذه الصيغة بوصفها مصطلحاً ثابتاً في مقابل criminologist.
        فضلاً عن ذلك، 'خبير' يُحيل إلى معرفة عملية استشارية أكثر مما يُحيل إلى الباحث الأكاديمي،
        وهو ما يُضعف تطابقه مع المعنى الدقيق للمجموعة. يفتقر إلى التثبيت المعجمي اللازم.

    - lemma: "إِجْرَامِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        الأدلة المعجمية تُثبت أن 'إجرامي' يُعادل criminality (الإجرامية) لا criminologist؛ كما أن
        الاستعمال الصفتي الغالب (السلوك الإجرامي، الفعل الإجرامي) يُنشئ لبساً دلالياً حاداً مع
        معنى 'المجرم' أو 'ذي الصلة بالجريمة'. اختبار الاستبدال يفشل: 'إجرامي' في جملة لا يُحيل
        بوضوح إلى صاحب التخصص بل إلى الصفة.

    - lemma: "جَرِيمُولُوجِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        التعريب ملاذ أخير لا يُلجأ إليه ما وجدت صياغة عربية أصيلة. يتوافر مصطلح 'عالم الإجرام'
        المُدعَّم بالمعاجم المتخصصة، و'مختص في علم الإجرام' المُقنَّن في معجم قانوني موحَّد، فلا
        مسوِّغ للتعريب.

    # ─── لمّة جديدة بدليل معجمي مباشر ────────────────────────
    - lemma: "مُخْتَصٌّ فِي عِلْمِ الإِجْرَامِ"
      source: stage1
      decision: confirmed
      decision_reason: >-
        مُثبَت مباشرةً في المعجم الموحد لمصطلحات القانون (2017) — ALECSO بوصفه المقابل
        العربي الرسمي لـ criminologist في المصطلحية القانونية العربية الموحَّدة. وإن كان تركيباً
        من خمس كلمات إلا أنه وحدة مصطلحية مُقنَّنة (terminological MWE) في المعجم القانوني
        الرسمي. يُكمِل 'عالم الإجرام' إذ يُبرز بُعد التخصص الوظيفي والقانوني.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        'مُخْتَصٌّ فِي عِلمِ الإِجرَامِ' يُبرز بُعد التخصص الوظيفي والمؤسسي، ويُناسب السياق
        القانوني والرسمي؛ ويُستعمل في الوثائق والتشريعات والهيئات الرسمية بينما 'عالم الإجرام'
        يُناسب السياق الأكاديمي والبحثي.
      actions:
        - command: create_entry
          params:
            lemma: "مُخْتَصٌّ فِي عِلمِ الإِجْرَامِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
