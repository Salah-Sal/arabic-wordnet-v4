# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10093639-n  |  ILI: i89855  |  POS: n
# Lemmas: تعبيري، فنان تعبيري
# Definition (EN): an artist who is an adherent of expressionism
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تعبيري، فنان تعبيري) خاليتان من التشكيل الكامل"
      - "اللمّة 'تعبيري' تعمل أساساً صفةً (expressive/expressionist) لا اسماً صريحاً، وقد يُحدث توظيفها اسماً لشخصٍ بعينه التباساً مع معانيها الأخرى"
      - "لم يُعثر على شاهد مباشر من المعاجم العربية يوظّف 'تعبيري' اسماً للشخص المنتسب إلى التعبيرية تحديداً؛ الدليل تمثيلي بالمقايسة على نمط 'انطباعي'"
    observations: "المفهوم (الفنان التعبيري: المنتسب إلى مذهب Expressionism) مقتبَس من الفكر الفني الغربي، وقد أضفت عليه العربية صياغتها القياسية بياء النسبة (تعبيري) على غرار: انطباعي (impressionist)، وسريالي (surrealist)، وواقعي (realist)؛ وقد أثبت المورد الحديث هذا النموذج صراحةً في مدخل 'impressionist': (الانطباعيّ: القائل بالانطباعية). فاللمّتان الموجودتان متماسكتان قياساً، غير أنهما تحتاجان إلى تشكيل وتوثيق أدق."
  blind_candidates:
    - lemma: "تَعْبِيرِيٌّ"
      generation_method: ishtiqaq
      justification: "اسم نسبة مشتق من المصدر (تعبير) بإلحاق ياء النسبة المشددة، وهو النموذج الإنتاجي للدلالة على المنتسب إلى المذاهب الفنية والفكرية: انطباعي، سريالي، رمزي، مستقبلي؛ يصلح اسماً وصفةً في السياق الاصطلاحي"
    - lemma: "فَنَّانٌ تَعْبِيرِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي (wasfi) من فنان + تعبيري؛ يُصرّح بالبُعد المهني (فنان) إلى جانب الانتماء المذهبي، وهو وحدة معجمية ثابتة مستخدمة في النقد الفني العربي المعاصر"
    - lemma: "صَاحِبُ التَّعْبِيرِيَّةِ"
      generation_method: tarkib
      justification: "تركيب إضافي (idafi) يُشير صراحةً إلى الانتساب إلى مذهب التعبيرية، على نهج: صاحب المذهب، القائل بالمذهب، أهل المذهب"
    - lemma: "مُعَبِّرٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل الثلاثي المزيد (عَبَّرَ)، يدل على من يمارس التعبير؛ استُحضر بوصفه لمّةً محتملة لأن جوهر التعبيرية الفنية هو التعبير عن الأحاسيس الداخلية"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت: ٤ استعلامات
# Q1: مطابقة دفعية لجميع اللمّات والمرشحات (headword_norm IN ...)
# Q2: جسر إنجليزي (translation_en:"expressionist" OR "expressionism")
# Q3: بحث FTS بكلمات مفتاحية (تعبيري، مذهب، انطباعي...)
# Q4: مقاييس اللغة لجذري عبر وفنن (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "تعبيري"
      confirm:
        - text: "«تعبيري — Expressive — الوظيفة التعبيرية للغة هي التي يعبر بها المتكلم عن أغراضه، السمة التعبيرية وسيلة تركيبية أو صرفية أو تطريزية تتيح وضع تفخيم على جزء من الجملة ليعبر عن موقف عاطفي للمتكلم»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ArabTerm"
      expands:
        - text: "«(1) الانطباعيّ: القائل بالانطباعية (2) انطباعيّ»"
          source: "المورد الحديث (2008) — ArabTerm — مدخل impressionist"
          addition: "يُثبت النمط القياسي في العربية: اسم النسبة (المذهب+ي) للدلالة على المنتسب إلى المذهب الفني؛ وبالمقايسة: التعبيري = القائل بالتعبيرية"
        - text: "«التعبيرية؛ المذهب التعبيري: مذهب في الفن يستهدف التعبير عن المشاعر أو العواطف أو الحالات الذهنية التي تثيرها الأشياء أو الأحداث في نفس الفنان. expressionistic»"
          source: "المورد الحديث (2008) — ArabTerm — مدخل expressionism"
          addition: "يُثبت أن التعبيرية مذهبٌ فني معروف في المعجمية العربية الحديثة، وأن المنتسب إليه يُعبَّر عنه بالصيغة الصفية (expressionistic)"
        - text: "«تعبيرية (ال..) — expressionism — توجه فني في بداية العشرينات (سيزان، فان غوخ، غوغان، نولده، كوكوشكا) بصور تعبيرية وألوان زاهية»"
          source: "مسرد صناعة النسيج — ArabTerm"
          addition: "يُرسّخ استخدام اسم النسبة (تعبيري / تعبيرية) في السياق الفني الحديث"

    - lemma: "فنان تعبيري"
      expands:
        - text: "«التعبيرية؛ المذهب التعبيري: مذهب في الفن يستهدف التعبير عن المشاعر أو العواطف أو الحالات الذهنية التي تثيرها الأشياء أو الأحداث في نفس الفنان»"
          source: "المورد الحديث (2008) — ArabTerm"
          addition: "يُؤصّل المفهوم ويُثبت أن 'فنان تعبيري' تركيبٌ طبيعي في السياق النقدي الفني: الفنانُ الذي ينتهج هذا المذهب"

    - lemma: "صاحب التعبيرية"
      evidence_status: "no_material_found"

    - lemma: "معبر"
      contradicts:
        - text: "«مُعَبِّر: مثال: هذه صورة مُعبِّرة — الرأي: مرفوضة — السبب: لأن 'التعبير' يرد في المعاجم بمعنى التفسير والإبانة بالقول — الصواب والرتبة: هذه صورة مُعبِّرَةٌ [فصيحة] — التعليق: (انظر: عَبَّر عن)»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "المعجم يُثبت أن مُعَبِّراً صفةٌ بمعنى 'موحية / ذات تعبير' — وليس اسماً للشخص المنتسب إلى التعبيرية الفنية"
        - text: "«بَاب الْمعبر: والمترجم والمفسر والمعرب والمفصح والمبين والشارح»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (ت 1274م)"
          conflict: "يُدرج المُعَبِّرَ في باب المترجمين والمفسرين لا في باب الفنانين أو أصحاب المذاهب الفنية"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
