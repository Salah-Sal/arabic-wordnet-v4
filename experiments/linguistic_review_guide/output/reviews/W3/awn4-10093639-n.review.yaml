  per_lemma:
    - lemma: "تعبيري"
      decision: confirmed
      decision_reason: "اسم النسبة (تعبيري) نموذجٌ إنتاجي راسخٌ في العربية للدلالة على المنتسب إلى المذاهب الفنية (انطباعي، سريالي، رمزي)؛ وقد ثبّته المورد الحديث بالمقايسة على 'impressionist = الانطباعيّ: القائل بالانطباعية'. التشكيل ناقص → يُصحَّح"
