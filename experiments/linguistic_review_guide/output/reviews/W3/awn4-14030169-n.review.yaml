# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14030169-n
# rootage — الثبات بواسطة الجذور أو كما لو كان بالجذور
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تجذر، رسوخ) بلا تشكيل"
      - "رسوخ أعم دلالياً من المطلوب؛ يعني الثبات المطلق لا الثبات بالجذور تحديداً"
    observations: >
      المجموعة تمثّل مفهوم الثبات الناتج عن الجذور أو ما يشبهها، وهو نوع فرعي من الاستقرار/الثبات (hypernym).
      اللمّة «تجذر» (تَفَعُّل من جذر) تطابق المفهوم مطابقة دقيقة لأنها تصف حالة الصيرورة ذات جذور.
      اللمّة «رسوخ» تدل على الثبات العميق لكنها أعم، إذ لا تستلزم الجذور بل تعني مطلق التمكّن.
      يمكن إثراء المجموعة بلمّات من نفس الحقل الدلالي كـ«تأصّل».
  blind_candidates:
    - lemma: "تَجَذُّر"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من الجذر (ج ذ ر)، يدل على صيرورة الشيء ذا جذور أو ثباته بجذوره؛ مطابق تماماً للتعريف"
    - lemma: "رُسُوخ"
      generation_method: ishtiqaq
      justification: "مصدر فُعُول من رَسَخَ، يدل على الثبات والتمكّن في المكان؛ قريب من المفهوم وإن كان أعم"
    - lemma: "تَأَصُّل"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من أَصَلَ، يدل على صيرورة الشيء ذا أصل ثابت؛ الأصل والجذر متقاربان دلالياً"
    - lemma: "تَثَبُّت"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من ثَبَتَ، يدل على التمسّك والثبات؛ محتمل لكن يحتاج تحقّقاً من دلالته الدقيقة"

stage2_evidence:
  per_lemma:
    - lemma: "تَجَذُّر"
      confirm:
        - text: "«(1) تجذُّر؛ تأصُّل؛ ترسُّخ (2) جذور.»"
          source: "المورد الحديث (2008) — ترجمة rootage"
      expands:
        - text: "«تجذير — rooting»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "الشكل الإفعالي (تجذير) يدل على الفعل لا الحالة، بينما التَّفَعُّل (تجذُّر) يدل على الحالة الناتجة"

    - lemma: "رُسُوخ"
      confirm:
        - text: "«الرسوخ: الثبات والتمكن. والراسخ في العلم المتحقق الذي لا يعترضه شبهة.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
        - text: "«(1) استقرار؛ ثبات؛ رسوخ»"
          source: "المورد الحديث (2008) — ترجمة stability"
      expands:
        - text: "«(رَسَخَ) الرَّاءُ وَالسِّينُ وَالْخَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الثَّبَاتِ. وَيُقَالُ رَسَخَ: ثَبَتَ، وَكُلُّ رَاسِخٍ ثَابِتٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر (رسخ) أصل واحد يدل على مطلق الثبات، مما يجعل رسوخ أعم من تجذر"

    - lemma: "تَأَصُّل"
      confirm:
        - text: "«(1) تجذُّر؛ تأصُّل؛ ترسُّخ (2) جذور.»"
          source: "المورد الحديث (2008) — ترجمة rootage"
        - text: "«تَأَصَّلَ: صار ذا أصْل»"
          source: "المعجم الكبير"
      expands:
        - text: "«(أَصَلَ) الْهَمْزَةُ وَالصَّادُ وَاللَّامُ، ثَلَاثَةُ أُصُولٍ مُتَبَاعِدٍ بَعْضُهَا مِنْ بَعْضٍ، أَحَدُهَا: أَسَاسُ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أحد أصول المادة هو أساس الشيء، مما يقرّب تأصّل من تجذّر دلالياً"
      contradicts:
        - text: "«تآصل — allotropy; allotropism»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "صيغة تَفَاعُل (تآصُل) من نفس الجذر مستعملة في الكيمياء بمعنى مختلف تماماً؛ لكن تَأَصُّل (تَفَعُّل) صيغة مختلفة ولا إشكال"

    - lemma: "تَثَبُّت"
      contradicts:
        - text: "«(تثبت) فِي الْأَمر والرأي تأنى فِيهِ وَلم يعجل»"
          source: "المعجم الوسيط"
          conflict: "التثبّت في المعاجم يعني التأنّي والتحقّق من الأمر، لا الثبات الفيزيائي بالجذور"
        - text: "«تَثَبَّتَ في الأمر: تأنَّى فيه ولم يعجل — من الأمر: تأكد منه»"
          source: "المعجم الكبير"
          conflict: "المعنى مقتصر على التأنّي والتثبّت المعنوي لا الثبات المادي"
        - text: "«بَاب التثبت: التؤدة والاناة والسكينة والسمت وَالْوَقار والهدوء والركانة والرزانة»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك (ت 1274م)"
          conflict: "سلسلة المترادفات كلها تدور على التأنّي والوقار لا على الثبات المادي"

stage3_analysis:
  per_lemma:
    - lemma: "تَجَذُّر"
      decision: confirmed
      decision_reason: >
        اللمّة مطابقة تماماً لمفهوم المجموعة؛ تَفَعُّل من (ج ذ ر) يدل على حالة الثبات بالجذور.
        المورد الحديث يوثّقها ترجمةً صريحة لـ rootage.
        اللمّة الموجودة بلا تشكيل فيلزم تحديثها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الثبات الناتج تحديداً عن الجذور (حقيقةً أو مجازاً)؛ أخصّ من رسوخ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجَذُّر"

    - lemma: "رُسُوخ"
      decision: confirmed
      decision_reason: >
        رسوخ يدل على الثبات والتمكّن كما نصّ المناوي، وهو معنى قريب من المجموعة.
        الجذر (رسخ) أصل واحد يدل على الثبات عند ابن فارس.
        يُبقى عليه مع ملاحظة أنه أعم من تجذّر. يحتاج تشكيلاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على مطلق الثبات والتمكّن العميق دون اشتراط الجذور؛ أعم من تجذّر ويُستعمل مجازياً في العلم والإيمان"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُسُوخ"

    - lemma: "تَأَصُّل"
      source: stage1
      decision: confirmed
      decision_reason: >
        المورد الحديث يوثّقها ترجمةً صريحة لـ rootage إلى جانب تجذّر وترسّخ.
        المعجم الكبير يعرّف تَأَصَّلَ بـ«صار ذا أصل» وهو معنى يتوافق مع التجذّر.
        الجذر (أصل) عند ابن فارس أحد أصوله «أساس الشيء» مما يدعم المعنى.
        لا تعارض مع تآصُل الكيميائي لأن الوزن مختلف (تَفَعُّل ≠ تَفَاعُل).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على صيرورة الشيء ذا أصل ثابت؛ أقرب إلى الانتماء الجذري والعراقة منه إلى الثبات الفيزيائي"
      actions:
        - command: create_entry
          params: {lemma: "تَأَصُّل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَثَبُّت"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية متّفقة على أن التثبّت يعني التأنّي والتحقّق من الأمر قبل الإقدام عليه،
        لا الثبات المادي بالجذور. المعجم الوسيط والمعجم الكبير وابن مالك كلهم يؤكّدون هذا المعنى.
        لذا لا يصلح لهذه المجموعة.
      evidence_assessment:
        case: contradicts_only

