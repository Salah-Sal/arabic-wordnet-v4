# ── المرحلة ١: المراجعة والتوليد ──────────────────────
stage1_review:

  # أ. التقييم الأولي (بعد قراءة synset_info الكامل)
  assessment:
    concerns:
      - "لمّة «واضع علامات الطريق» عبارة وصفية حرة تُعيد صياغة التعريف حرفيًّا؛ تفشل اختباري السكّ والتثبيت المعجمي: يمكن إبدال «واضع» بـ«ناصب» أو «واسم»، و«علامات» بـ«إشارات»، وتبقى وصفًا صالحًا، مما يعني أنها ليست وحدة معجمية ثابتة."
      - "كلتا اللمّتين تفتقران إلى التشكيل الكامل."
      - "لمّة «رائد طريق» دلالتها أوسع من المقصود (الريادة والاستكشاف عمومًا، لا وسم الأشجار تحديدًا)؛ وهي مُرادِف جزئي لا يُعبِّر بدقة عن الفعل التقني «وسم لحاء الأشجار»."
      - "تخلو المجموعة من مصطلح مسكوك يُمثِّل الفعل التقني المحدَّد: الوسم والتأثير في الأشجار دليلاً على المسار."

    observations: >
      تُعالج المجموعة مفهوم «الشخص الذي يُعلِّم الطريق بوسم الأشجار» — مفهوم مرتبط
      بالاستكشاف البري وفتح المسالك. الجذر العربي «و-س-م» هو الأنسب لهذا المعنى،
      إذ يدلّ أصلاً على ترك الأثر والمَعلَم ويُقابل to blaze بدقة. «رائد» من جذر
      «ر-و-د» يُغطّي البُعد الاستكشافي (النظر والطلب والتقدّم) لكنه لا يُحدِّد آليةَ
      وسم الأشجار. يستدعي المفهوم إبقاءَ «رائد طريق» مع تصحيح تشكيله، وإضافةَ
      «واسم الطرق» مصطلحًا أدقّ وأوفى وصفًا للفعل الجوهري.

  # ب. اللمّات المرشحة (عمياء — مولَّدة من التعريف المُقنَّع فقط)
  blind_candidates:
    - lemma: "وَاسِمُ الطُّرُق"
      generation_method: tarkib
      justification: >
        مركب إضافي من «واسم» (اسم الفاعل من وَسَمَ = أثَّر فيه بسِمة/علامة) و«الطُّرُق»
        (المسالك). الجذر وسم يدلّ على ترك الأثر المرئي في الشيء، وهو يُقابل الفعل
        الإنجليزي to blaze (وسم الشجرة بنزع لحائها) بدقة تامة. نمط فاعل يُعطي دلالة
        الشخص الذي يقوم بالفعل.

    - lemma: "مُعَلِّمُ الدُّرُوب"
      generation_method: tarkib
      justification: >
        مركب إضافي من «مُعَلِّم» (اسم الفاعل Form II من عَلَّمَ = وضع علامات/ أثَّر)
        و«الدُّرُوب» (المسالك). جذر علم يدلّ على الأثر والتمييز بالعلامة كما في
        مقاييس اللغة. ثمة خطورة اشتراك لفظي مع «مُعَلِّم» بمعنى المدرّس في العربية
        المعاصرة.

    - lemma: "شَاقُّ الدَّرْب"
      generation_method: majaz
      justification: >
        مجاز إزاحي: شَقَّ الطريقَ = شقّه وفتحه بجهد (والمورد الحديث يستخدم «يشقّ
        الطريق» مقابلاً لـ to blaze a trail). اسم الفاعل شاقّ = من يشقّ الدرب
        ويُوضِّح مساره. إحياء لدلالة شقَّ = فلق الشيء وفتحه.

    - lemma: "نَاصِبُ الأَعْلَام"
      generation_method: tarkib
      justification: >
        مركب إضافي من «ناصب» (اسم الفاعل من نَصَبَ = أقام وأهدف) و«الأعلام»
        (جمع عَلَم = العلامة الراسخة). جذر نصب في المقاييس يدلّ على إقامة الشيء
        واستوائه، والأعلام جمع عَلَم بمعنى العلامة الدالّة.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دفعية — كل اللمّات والمرشحات + مكوّناتها (حوالي 40 نموذجاً)
#   ٢. جسر إنجليزي — trailblazer / trail marker / pathfinder / pioneer / blazer
#   ٣. بحث FTS عربي — "مسار، علامة، طريق، رائد، وسم"
#   ٤. مقاييس اللغة — جذور: رود، وضع، وسم، علم، نصب، طرق
stage2_evidence:

  per_lemma:
    - lemma: "رائد طريق"
      confirm:
        - text: "«(1) pathfinder (2) الرائد»"
          source: "المورد الحديث (2008) — مدخل trailblazer"
        - text: "«الرائد؛ المستطرِق؛ المستكشف: شخص يرود المجاهل بغيةَ اكتشاف طريق جديد»"
          source: "المورد الحديث (2008) — مدخل pathfinder"
        - text: "«رائد، ممهِّد» = forerunner"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      expands:
        - text: "«الرَّاءُ وَالْوَاوُ وَالدَّالُ مُعْظَمُ بَابِهِ يَدُلُّ عَلَى مَجِيءٍ وَذَهَابٍ مِنِ انْطِلَاقٍ فِي جِهَةٍ وَاحِدَةٍ... بَعَثْنَا رَائِدًا يَرُودُ الْكَلَأَ، أَيْ يَنْظُرُ وَيَطْلُبُ»"
          source: "مقاييس اللغة لابن فارس — جذر رود"
          addition: "يُثبت أن الرائد هو المبعوث للاستطلاع والسعي، مما يشمل تقدّمه لوسم مسالك السفر."
        - text: "«(1) «أ» الرائد؛ مُمَهِّد الطريق: «ب» مهندس ملحق بوحدة عسكرية [لشقّ الطرق وإقامة الجسور]... «ج» من يتقدّم الآخرين ممهِّدًا السبيل لهم»"
          source: "المورد الحديث (2008) — مدخل pioneer"
          addition: "يُوسّع دلالة رائد إلى ممهِّد السبيل ومن يتقدّم لفتح الطريق للآخرين."

    - lemma: "واضع علامات الطريق"
      evidence_status: "no_material_found"

    - lemma: "وَاسِمُ الطُّرُق"
      confirm:
        - text: "«مورث ذو موقع معروف على الصبغيّ ونمط ظاهريّ واضح بجلاء، يستعمل كنقطة مرجع لتخطيط طافرة جديدة»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — واسم"
        - text: "«عنصر يمكن تتبّعه في الجسم بفضل نشاطه الإشعاعيّ»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — واسم = marker"
        - text: "«المؤشر المركبي، في النحو التوليدي»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — واسم = Marker"
        - text: "«يَسِمُ: يُعَلِّم الشجرة بنزع جزء من لحائها»"
          source: "المورد الحديث (2008) — مدخل blaze (الفعل to blaze)"
      expands:
        - text: "«الْوَاوُ وَالسِّينُ وَالْمِيمُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى أَثَرٍ وَمَعْلَمٍ. وَوَسَمْتُ الشَّيْءَ وَسْمًا: أَثَّرْتُ فِيهِ بِسِمَةٍ. وَسُمِّيَ مَوْسِمُ الْحَاجِّ مَوْسِمًا لِأَنَّهُ مَعْلَمٌ يَجْتَمِعُ إِلَيْهِ النَّاسُ»"
          source: "مقاييس اللغة لابن فارس — جذر وسم"
          addition: "يُثبت أن الجذر وسم يدلّ جوهريًّا على ترك الأثر في الشيء ليكون مَعلَمًا، وهو ما يصفه وسم الأشجار تمامًا."

    - lemma: "مُعَلِّمُ الدُّرُوب"
      expands:
        - text: "«المَعْلَم: العَلَّامة من كل شيء: مَظِنَّته»"
          source: "المعجم الوسيط — معلَم (مَفْعَل)"
          addition: "يُثبت وجود مَعلَم بمعنى العلامة والدليل، وهو غير مُعَلِّم (مُفَعِّل) المقترح."
        - text: "«الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى أَثَرٍ بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ. مِنْ ذَلِكَ الْعَلَامَةُ... يُقَالُ: عَلَّمْتُ عَلَى الشَّيْءِ عَلَامَةً»"
          source: "مقاييس اللغة لابن فارس — جذر علم"
          addition: "يُثبت أن جذر علم يحتوي معنى وضع العلامة؛ لكنه لا يُثبت المصطلح المركّب مُعَلِّم الدروب."
      contradicts:
        - text: "«المُعَلِّم: من يتخذ مهنة التعليم، من له الحق في ممارسة إحدى المهن استقلالاً»"
          source: "المعجم الوسيط — معلِّم (مُفَعِّل)"
          conflict: "مُعَلِّم بوزن مُفَعِّل مُخصَّص بمعنى «المدرّس» في العربية المعاصرة، مما يُولِّد التباسًا شديدًا مع المصطلح المقترح."

    - lemma: "شَاقُّ الدَّرْب"
      contradicts:
        - text: "«الشَّاقّ: العسير الصعب»"
          source: "المعجم الوسيط — شاق"
          conflict: "الشاق صفة ثابتة بمعنى «الصعب/العسير»، وليس اسم فاعل لشخص يشقّ الطريق ويسمه."
        - text: "«شاقَ إليه شَوْقاً: نَزَعَتْ نفسُه إليه — الشيءُ فلاناً: هاجه»"
          source: "المعجم الوسيط — شاق"
          conflict: "الفعل شاق الرباعي يعني اللهفة والشوق لا قطع الطريق، مما يُبعد المعنى المقصود."

    - lemma: "نَاصِبُ الأَعْلَام"
      contradicts:
        - text: "«النَّاصِبُ: يُقال: هَمّ ناصِب: مُتعِب — عيش ناصب: فيه كدٌّ وجُهد»"
          source: "المعجم الوسيط — ناصب"
          conflict: "ناصب صفة راسخة بمعنى «المُتعِب/الشاق»، لا اسم فاعل لشخص يَنصب الأعلام الإرشادية؛ مما يستدعي المعنى السلبي لا المعنى المقصود."


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────
stage3_analysis:

  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "رائد طريق"
      decision: confirmed
      decision_reason: >
        رائد مصطلح موثّق في المعجمية العربية ومصطلحياتها بمعنى الاستطلاع والتقدّم
        لاكتشاف المسار؛ أيّده المورد الحديث صراحةً في مدخل trailblazer. المركّب
        الإضافي «رائد طريق» مقبول في بنية المصطلح العربي، والقيدُ الإضافي «طريق»
        يُخصِّص دلالته الاستكشافية بسياق المسالك. رغم اتساع الدلالة الأصلية لرائد،
        يُعدّ اللمّة مناسبةً للمجموعة شريطةَ تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز البُعد الريادي والاستكشافي: الشخص الذي يتقدّم ويستطلع المسار المجهول
        ليُمهِّده لمن يتبعه — التركيز على دور القائد المستكشِف والرائد لا على
        الأسلوب الفني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَائِدُ طَرِيقٍ"

    # ── لمّة موجودة ٢ ──
    - lemma: "واضع علامات الطريق"
      decision: removed
      decision_reason: >
        تفشل هذه العبارة اختبارَي التثبيت المعجمي والسكّ: يمكن إبدال «واضع» بـ«ناصب»
        أو «واسم»، و«علامات» بـ«إشارات»، وتبقى وصفًا صالحًا → ليست مصطلحًا. وهي
        تُعيد صياغة التعريف صياغةً حرفية (دائرية). لا أدلّة معجمية على تثبيتها كوحدة
        معجمية ثابتة في أي مصدر مستعلَم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١ — أ (مقبول) ──
    - lemma: "وَاسِمُ الطُّرُق"
      source: stage1
      decision: confirmed
      decision_reason: >
        الجذر وسم يدلّ بدقة على ترك الأثر والمَعلَم، واسمُ الفاعل «واسم» = الذي
        يُؤثِّر بسمة — وهو بالضبط ما يقوم به مُعلِّم الطريق حين ينزع لحاء الأشجار.
        المورد الحديث يُثبت «يَسِمُ الشجرةَ بنزع جزء من لحائها» كمقابل مباشر لـ
        to blaze. مُدعوم بمصطلحات ARABTERM المتعددة بمعنى marker في علم الوراثة
        والطب والأحياء واللسانيات. يجتاز اختباري السكّ والتثبيت المعجمي: «واسم» لا
        يُمكن تبديله بمرادف مع بقاء البنية ذات الدلالة التقنية ذاتها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الفعل التقني المُحدَّد: وسم الأشجار وتأثير لحائها كأسلوب إرشادي —
        التركيز على الأداة والأسلوب الفني لا على الدور الريادي.
      actions:
        - command: create_entry
          params:
            lemma: "وَاسِمُ الطُّرُق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — ب (مرفوض) ──
    - lemma: "مُعَلِّمُ الدُّرُوب"
      source: stage1
      decision: removed
      decision_reason: >
        مُعَلِّم (بوزن مُفَعِّل) مخصوص بمعنى «المدرّس» في العربية المعاصرة؛ يُولِّد
        التباسًا حادًّا. الوزن المناسب لمعنى «الذي يضع العلامات» هو مَعلَم (اسم
        مكان/مَظِنَّة) أو مُعلِم (Form IV)، لا مُعَلِّم (Form II).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١ — ج (مرفوض) ──
    - lemma: "شَاقُّ الدَّرْب"
      source: stage1
      decision: removed
      decision_reason: >
        شاق ورد في المعجمين الوسيط والكبير بمعنى «العسير الصعب» صفةً راسخة؛ والفعل
        شاق (مفاعلة) = عادى وخالف. لا أدلة على اسم فاعل «شاقّ» بمعنى «من يشقّ
        الطريق = يوسمه ويحدِّده». الاستعمال المعجمي يستدعي المعنى الخطأ تلقائيًّا.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١ — د (مرفوض) ──
    - lemma: "نَاصِبُ الأَعْلَام"
      source: stage1
      decision: removed
      decision_reason: >
        ناصب صفة مستقرّة بمعنى «المُتعِب/الشاق» في المعجمين الوسيط والكبير؛ لا
        دليل على استخدامه اسمَ فاعل لنصب الأعلام الإرشادية. يُحيل «الأعلام» ذهنيًّا
        إلى الرايات لا العلامات على الأشجار.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────
stage4_content:

  definition:
    current: "شخص يحدد المسار بوضع علامات على الأشجار"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه لكنه قاصر في الدقة المصطلحية: «يحدد المسار»
        فضفاض وينطبق على الدليل عمومًا (المجموعة الأمّ)، ولا يُميِّز الفعلَ التقني
        الجوهري وهو وسم الأشجار وتأثير لحائها (blazing). يحتاج إلى جنس قريب واضح
        وفصل نوعي يُبيِّن أسلوب العمل.
    authored:
      - type: terminological
        text: "شَخصٌ يُعيِّنُ مَسالِكَ غَيرِ المُمَهَّدةِ بوَسمِ الأشجارِ وتأثيرِ لِحائِها دليلاً للسَّالكين مِن بَعدِه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "رائدٌ يُرشِدُ إلى المسالكِ البرِّيَّةِ في الغاباتِ والجبالِ بنَقشِ علاماتٍ في لِحاءِ الأشجارِ أو كشطِهِ، ليَبقى دليلاً مَرئيًّا للقادمين من بعده. يُعدّ من أقدم أساليب الملاحة البرية قبل انتشار الخرائط"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
