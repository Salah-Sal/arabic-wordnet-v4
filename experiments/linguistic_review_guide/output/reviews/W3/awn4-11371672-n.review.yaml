# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11371672-n | ILI: i97216
# الشخص: أنتوني تيودور — راقص ومصمم رقصات أمريكي (إنجليزي المولد) (1909-1987)
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أنتوني تيودور / تيودور) تخلوان تماماً من التشكيل، وهو إخلال بمعيار التشكيل الكامل الإلزامي في AWN4"
      - "الاسم المفرد (تيودور) يشترك لفظاً مع اسم الأسرة الملكية الإنجليزية الحاكمة (1485-1603)، مما يُفضي إلى غموض دلالي محتمل خارج سياق المجموعة"
      - "التعريف العربي الحالي (راقص ومصمم رقصات) يُقدِّم وظيفة الراقص على وظيفة التصميم، بينما الأولوية الموسوعية لتيودور هي تصميم الرقصات"
    observations: >
      هذه المجموعة من نوع الأعلام الموسوعية (individual synset)، تُخصِّص شخصاً بعينه بتواريخ ميلاد ووفاة محددة (1909-1987).
      إذ يتعلّق الأمر باسم علم أجنبي، فإن التعريب (taarib) هو السبيل اللغوي الوحيد الممكن لتسمية هذا المفهوم؛ إذ لا مجال
      للاشتقاق أو المجاز أو التركيب في تسمية الأشخاص المحددين. اللمّتان الموجودتان صحيحتان ومتوافقتان مع الاستخدام الشائع
      في المصادر العربية، وتتبعان النمط المعجمي المعتاد لأسماء الأعلام الغربيين: الاسم الكامل + اللقب المختصر.
  blind_candidates:
    - lemma: "أَنْتُونِي تِيُودُور"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل (Antony Tudor) بنقل صوتي منتظم: أَنْتُونِي (بالتاء غير المُفخَّمة نقلاً لصوت /t/)
        وتِيُودُور (بكسرة التاء وياء الإشباع نقلاً لصوت /tj uː/)؛ وهذا الشكل هو الأشيع في المصادر العربية
        المتخصصة في تاريخ الباليه والرقص.
    - lemma: "تِيُودُور"
      generation_method: taarib
      justification: >
        اللقب المعرَّب وحده (Tudor)، يُستخدم في السياقات التي يُفترض فيها معرفة المتلقي بهوية الشخص.
        يُعبَّر عنه بكسرة التاء للدلالة على الصوت الإنجليزي /tjuː/.
    - lemma: "أَنْطُونِي تِيُودُور"
      generation_method: taarib
      justification: >
        تهجئة بديلة تستعمل الطاء المُفخَّمة بدلاً من التاء في "أنطوني"؛ وهذا الشكل يظهر في بعض المصادر العربية
        وإن كان أقلّ دقةً صوتيةً من "أنتوني" لأن الصوت الأصلي /t/ غير مُفخَّم.
    - lemma: "تُودُور"
      generation_method: taarib
      justification: >
        ضبط صوتي بديل يُشير إلى أن بعض المعجمات العربية تنقل Tudor بدون الياء الإشباعية (تُودُور لا تِيُودُور).
        وجدت هذا النقل في المورد الحديث (entry_id=725193): "أُسرة تيُوْدَر".


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة: ٣ استعلامات
# ١. دُفعي لجميع اللمّات والمرشحات (لا نتائج للمّتين الموجودتين)
# ٢. جسر إنجليزي (Tudor / Antony Tudor / choreographer / dancer)
# ٣. بحث FTS بالكلمات المفتاحية (راقص / رقصات / كوريغراف / مصمم رقصات)
stage2_evidence:
  per_lemma:
    - lemma: "أنتوني تيودور"
      evidence_status: "no_material_found"

    - lemma: "تيودور"
      contradicts:
        - text: >
            «(1) أُسرة تيُوْدَر: أُسرة حكمت إنكلترا من 1485 إلى 1603
            (2) التيُودَريّ: أحد أفراد أسرة تيودر
            (3) تيودريّ: ذو علاقة بأُسرة تيودَر أو مميِّزٌ لعهدها.»
          source: "المورد الحديث (2008) — entry_id=725193"
          conflict: >
            المدخل يُحيل "تيودور" إلى الأسرة الملكية الإنجليزية الحاكمة (1485-1603) لا إلى المصمِّم الراقص أنتوني تيودور (1909-1987)؛
            فاللفظ مشترك بين شخصين أو كيانين مختلفين: الأسرة الملكية والفنان.

    - lemma: "أَنْتُونِي تِيُودُور"
      evidence_status: "no_material_found"

    - lemma: "تِيُودُور"
      contradicts:
        - text: >
            «(1) أُسرة تيُوْدَر: أُسرة حكمت إنكلترا من 1485 إلى 1603
            (2) التيُودَريّ: أحد أفراد أسرة تيودر»
          source: "المورد الحديث (2008) — entry_id=725193"
          conflict: >
            نفس إشكالية الاشتراك اللفظي المذكورة في لمّة "تيودور"؛ السياق المعجمي يربط اللفظ بالأسرة الملكية لا بالفنان.

    - lemma: "أَنْطُونِي تِيُودُور"
      evidence_status: "no_material_found"

    - lemma: "تُودُور"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة الأولى ──
    - lemma: "أنتوني تيودور"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المعرَّب للمصمِّم الراقص الأمريكي أنتوني تيودور (Antony Tudor)، وهو اللمّة الأساسية
        التي تُحدِّد هوية الشخص بلا لبس. لا يوجد دليل معجمي مؤكِّد أو نافٍ خاص بهذا الشخص (بسبب طبيعة الأعلام
        الأجنبية الحديثة)، غير أن الاسم صحيح إملائياً ومتوافق مع أسلوب التعريب العربي الفصيح. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل (الاسم الأول + اللقب)؛ يُستعمل في الكتابات الأكاديمية والموسوعية والمصادر المرجعية الرسمية
        حين يُذكر الشخص لأول مرة أو يُقصد تحديد هويته دون أي غموض.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَنْتُونِي تِيُودُور"

    # ── اللمّة الموجودة الثانية ──
    - lemma: "تيودور"
      decision: confirmed
      decision_reason: >
        اللقب المختصر المعرَّب (Tudor)، شائع في النصوص الفنية المتخصصة بعد تقديم الشخص باسمه الكامل. وإن كان اللفظ
        مشتركاً مع اسم الأسرة الملكية الإنجليزية في المعجمية العربية، إلا أن السياق الدلالي في AWN4 (مجموعة ترادفية
        محددة لمصمِّم رقصات) يُزيل هذا اللبس. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المختصر؛ يُستخدم في الخطاب الفني المتخصص بعد تقديم الشخص باسمه الكامل، وفي السياقات التي يكون فيها
        المتلقي على دراية بهوية المقصود. يحمل طابعاً أكثر احترافية وتركيزاً على الإسهام الفني لا الهوية الشخصية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تِيُودُور"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أَنْتُونِي تِيُودُور"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة "أنتوني تيودور" بعد تشكيلها؛ فهو ليس إضافة جديدة بل هو نفس اللمّة
        بتشكيل كامل. سيُعالَج بإجراء update_lemma على اللمّة الموجودة.

    - lemma: "تِيُودُور"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة "تيودور" بعد تشكيلها؛ سيُعالَج بإجراء update_lemma على اللمّة الموجودة.

    - lemma: "أَنْطُونِي تِيُودُور"
      source: stage1
      decision: removed
      decision_reason: >
        تهجئة بديلة باستخدام الطاء المُفخَّمة بدلاً من التاء. غير مُفضَّلة صوتياً لأن الصوت الإنجليزي /t/ في "Antony"
        غير مُفخَّم، فنقله بالتاء (أنتوني) أدقّ. لا تُضاف كلمّة مستقلة لتجنب ازدواجية الإدخال.

    - lemma: "تُودُور"
      source: stage1
      decision: removed
      decision_reason: >
        ضبط صوتي مختلف (بضمة التاء بدلاً من كسرتها). الشكل الموجود "تيودور" هو الأشيع في المصادر العربية
        المتخصصة ويحافظ على الإشباع الصوتي /tjuː/. لا مسوِّغ لإضافة ضبط بديل كلمّة مستقلة.


