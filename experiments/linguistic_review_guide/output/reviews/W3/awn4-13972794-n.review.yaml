# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13972794-n (seniority)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «أقدمية» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط، والمفهوم له مرادفات عربية محتملة"
    observations: >
      المفهوم يدلّ على مرتبة تُكتسب بطول مدة الخدمة، وهو مفهوم إداري وقانوني
      معروف في الثقافة العربية المعاصرة. الجذر «قدم» يدلّ على السبق والتقدّم
      كما نصّ ابن فارس، واللمّة «أقدمية» مصدر صناعي من اسم التفضيل «أقدم»
      على وزن أَفْعَلِيَّة، وهو قياس منتج. التعريف الحالي ترجمة شبه حرفية
      للتعريف الإنجليزي ويحتاج صياغة معجمية عربية أصيلة.

  blind_candidates:
    - lemma: "أَقْدَمِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من اسم التفضيل «أقدم» على وزن أَفْعَلِيَّة، يدلّ على حالة
        كون المرء أقدم من غيره في الخدمة أو المنصب. مسكوك في الاستعمال الإداري
        والقانوني العربي المعاصر.
    - lemma: "أَسْبَقِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من اسم التفضيل «أسبق» على وزن أَفْعَلِيَّة، يدلّ على التقدّم
        والأولوية. مستعمل في السياق الإداري بمعنى الأحقية بالتقدم على الآخرين.
    - lemma: "أَرْشَدِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «أرشد» بمعنى الأكبر سنًّا. ورد في المورد الحديث ترجمةً
        لـ seniority بمعنى كون المرء هو الأكبر سنًّا.
    - lemma: "قِدَم الخِدْمَة"
      generation_method: tarkib
      justification: >
        مركب إضافي من «قِدَم» (طول المدة) و«الخدمة»، يصف المفهوم وصفاً مباشراً.
        يُستعمل في السياق الإداري العربي عرضاً لكنه ليس مصطلحاً مسكوكاً ثابتاً.


stage2_evidence:
  per_lemma:
    - lemma: "أَقْدَمِيَّة"
      confirm:
        - text: "«أقدمية — seniority — ancienneté»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«ترقية بالأقدمية — promotion by seniority — avancement à l'ancienneté»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«(1) الأسبقيّة؛ الأقدميّة (2) الأوَّليّة؛ الأولويّة [من حيث الترتيب أو المنزلة] (3) معاملة تفضيلية أو تمييزية» — ترجمة priority"
          source: "المورد الحديث (2008)"
        - text: "«(1) تعمير؛ طول العمر (2) أقدميّة؛ أسبقيّة» — ترجمة longevity"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْقَافُ وَالدَّالُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَبْقٍ وَرَعْفٍ ثُمَّ يُفَرَّعُ مِنْهُ مَا يُقَارِبُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «قدم» أصله السبق والتقدم، وهو الأساس الدلالي للمصدر الصناعي «أقدمية»"

    - lemma: "أَسْبَقِيَّة"
      confirm:
        - text: "«الأَسْبَقِيَّةُ: الأولوِيَّةُ والتقدُّمُ على الآخرين»"
          source: "المعجم الكبير"
        - text: "«(1) أسبقيّة [من حيث الزمن] (2) التصدّرية: حقّ التصدُّر والتقدّم على الآخرين (3) أوْلَوِيّة» — ترجمة precedence"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«أسبقيّة — في التطبيقات: الترتيبُ الذي تُحسَبُ وفقه القيمُ في تعبير رياضي» — ترجمة precedence"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "دلالة الأسبقية واسعة تشمل الأولوية في مجالات متعددة، ولا تختص بطول الخدمة"

    - lemma: "أَرْشَدِيَّة"
      confirm:
        - text: "«(1) الأرشدية: كون المرءِ هو الأكبر سنًّا (2) «أ» الأسبقيّة. «ب» الأوّليّة [من حيث المنزلة]» — ترجمة seniority"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الأرشدية: كون المرءِ هو الأكبر سنًّا»"
          source: "المورد الحديث (2008)"
          conflict: "الأرشدية تدلّ على الأكبرية في السنّ لا على التقدّم بطول الخدمة تحديداً"

    - lemma: "قِدَم الخِدْمَة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "أَقْدَمِيَّة"
      decision: confirmed
      decision_reason: >
        لمّة مثبتة في المعجم الموحد لمصطلحات القانون (ALECSO) مقابل seniority،
        وفي المورد الحديث مقابل priority و longevity بمعنى الأسبقية. الجذر «قدم»
        دالّ على السبق والتقدّم كما في مقاييس اللغة. المصدر الصناعي من اسم
        التفضيل «أقدم» قياسي ومنتج. اللمّة الموجودة بدون تشكيل، يُصحَّح إلى
        أَقْدَمِيَّة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَقْدَمِيَّة"

    - lemma: "أَسْبَقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الأسبقية تدلّ على الأولوية والتقدّم بشكل عام (في الزمن أو الترتيب أو
        المنزلة)، وهي أوسع دلالةً من مفهوم المجموعة الذي يخصّ التقدّم بطول
        الخدمة تحديداً. استعمالها في المعلوماتية والجيولوجيا وغيرها بمعنى
        priority يؤكد عموميتها. لا تصلح مرادفاً دقيقاً لـ seniority.
      evidence_assessment:
        case: mixed

    - lemma: "أَرْشَدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        الأرشدية تدلّ على كون المرء هو الأكبر سنًّا كما نصّ المورد الحديث،
        وهي مختصة بالسنّ لا بطول مدة الخدمة. المجموعة تنصّ على «بسبب الخدمة
        الأطول» لا بسبب السنّ، فالأرشدية لا تطابق المفهوم المراد.
      evidence_assessment:
        case: contradicts_only

    - lemma: "قِدَم الخِدْمَة"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ وليس مصطلحاً مسكوكاً. لم يُعثر عليه في أي معجم كوحدة
        معجمية ثابتة. يفشل في اختبار السكّ: يمكن إبدال «قِدَم» بـ«طول» أو
        «عراقة» ويبقى التعبير صالحاً كوصف، مما يدلّ على أنه ليس مصطلحاً.
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "رتبة أعلى من الآخرين خاصة بسبب الخدمة الأطول"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي، ويفتقر إلى الصياغة
        المعجمية العربية الأصيلة. عبارة «رتبة أعلى من الآخرين» ركيكة، و«الخدمة
        الأطول» حرفية. يحتاج إعادة صياغة بأسلوب المعجم الوسيط مع جنس قريب
        وفصل نوعي واضحَيْن.
    authored:
      - type: terminological
        text: "مَرْتَبَةٌ تُكْتَسَبُ بِطُولِ مُدَّةِ الخِدْمَةِ تُعْطِي صَاحِبَهَا أَفْضَلِيَّةً عَلَى أَقْرَانِهِ فِي التَّرْقِيَةِ وَالِاسْتِحْقَاقَاتِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَرْتَبَةٌ تُكْتَسَبُ بِطُولِ مُدَّةِ الخِدْمَةِ تُعْطِي صَاحِبَهَا أَفْضَلِيَّةً عَلَى أَقْرَانِهِ فِي التَّرْقِيَةِ وَالِاسْتِحْقَاقَاتِ"

  examples:
    per_lemma:
      - lemma: "أَقْدَمِيَّة"
        examples:
          - text: "تُمنح الترقية في الوظائف الحكومية وفقاً لمعيار الأقدمية، فيتقدّم الموظف الأطول خدمةً على زملائه."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُمنح الترقية في الوظائف الحكومية وفقاً لمعيار الأقدمية، فيتقدّم الموظف الأطول خدمةً على زملائه."


