stage1_review:
  assessment:
    concerns:
      - "اللمة 'جَوْن' تحمل دلالة تضاد قوية في المعاجم الكلاسيكية (الأبيض والأسود) مما قد يسبب لبساً دلالياً خارج السياق الجغرافي."
      - "اللمة 'خَلِيج صَغِير' هي عبارة وصفية حرة (Wasfi) وليست مصطلحاً مسكوكاً مفرداً، رغم دقتها."
    observations: "المجموعة تغطي مفهماً جغرافياً حيوياً للبيئة العربية الساحلية، وهناك وفرة في المصطلحات التراثية والجهوية التي تصف هذا النوع من المداخل المائية بدقة."
  blind_candidates:
    - lemma: "خَوْر"
      generation_method: ishtiqaq
      justification: "مصطلح شائع جداً في الجزيرة العربية والخليج لوصف المداخل المائية التي تنفذ في البر."
    - lemma: "شَرْم"
      generation_method: majaz
      justification: "يستخدم لوصف الشق أو الصدع في الساحل الذي يشكل خليجاً صغيراً، وهو شائع في البحر الأحمر."
    - lemma: "غُبّ"
      generation_method: majaz
      justification: "لفظ تراثي مستخدم في عمان واليمن لوصف المداخل المائية العميقة في اليابسة."
    - lemma: "خَلِيجَة"
      generation_method: ishtiqaq
      justification: "صيغة التأنيث أو التصغير من خليج، وتستخدم للدلالة على الصغر."

stage2_evidence:
  per_lemma:
    - lemma: "جون"
      confirm:
        - text: "«جون: خليج صغير»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (ArabTerm)"
        - text: "«غُب: خليج، جون في لهجة اليمن- ففي الادريسي... ومعنى الغب الجون»"
          source: "تكملة المعاجم العربية لدووزي"
    - lemma: "خليج صغير"
      confirm:
        - text: "«جون: خليج صغير»"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (ArabTerm)"
    - lemma: "خور"
      confirm:
        - text: "«الخَوْرُ: ... الخليجُ من البَحْر (فى الجغرافيا)»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«(الخور) مصب المَاء فِي الْبَحْر والمنخفض من الأَرْض بَين مرتفعين والخليج»"
          source: "المعجم الوسيط"
    - lemma: "شرم"
      confirm:
        - text: "«الشَّرْمُ: ... أو الخَليجُ منه»"
          source: "القاموس المحيط"
        - text: "«(الشرم) كل شقّ غير نَافِذ فِي جبل أَو حَائِط وَمن الْبَحْر خليج مِنْهُ»"
          source: "المعجم الوسيط"
        - text: "«A canal, or cut (خليج), from a sea... now applied to a creek of a sea»"
          source: "Edward William Lane, Arabic-English Lexicon"
    - lemma: "غب"
      confirm:
        - text: "«الغُبّ: الضاربُ من البَحْر حتى يُمعن فِي البَرِّ»"
          source: "المحكم والمحيط الأعظم"
        - text: "«غُب: خليج، جون في لهجة اليمن- ففي الادريسي... ومعنى الغب الجون»"
          source: "تكملة المعاجم العربية لدووزي"
    - lemma: "خليجة"
      evidence_status: "no_material_found"

