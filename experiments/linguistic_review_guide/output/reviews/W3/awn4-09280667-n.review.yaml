stage4_content:
  definition:
    current: "مدخل مائي صغير"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، يحتاج لإضافة تفاصيل حول طبيعة المدخل وموقعه الجغرافي."
    authored:
      - type: terminological
        text: "مَدْخَل مَائِيّ صَغِير فِي اليَابِسَة، غَالِبًا مَا يَكُون مَحْمِيًّا بَيْنَ رُؤُوس صَخْرِيَّة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
  examples:
    per_lemma:
      - lemma: "جَوْن"
        examples:
          - text: "يَلْجَأُ الصَّيَّادُونَ بِمَرَاكِبِهِم إِلَى الجَوْنِ هَرَبًا مِنَ العَاصِفَة."
            type: usage
      - lemma: "خَلِيج صَغِير"
        examples:
          - text: "يَمْتَازُ هَذَا الخَلِيجُ الصَّغِيرُ بِمِيَاهِهِ الهَادِئَةِ وَشَاطِئِهِ الرَّمْلِيِّ."
            type: usage
      - lemma: "خَوْر"
        examples:
          - text: "تَكْثُرُ أَشْجَارُ المَنْغَرُوفِ عَلَى جَوَانِبِ الخَوْرِ."
            type: usage
      - lemma: "شَرْم"
        examples:
          - text: "يُعَدُّ الشَّرْمُ مَكَانًا مِثَالِيًّا لِرُسُوِّ السُّفُنِ الصَّغِيرَةِ."
            type: usage
      - lemma: "غُبّ"
        examples:
          - text: "أَبْحَرَتِ السَّفِينَةُ دَاخِلَ الغُبِّ لِتَفْرِيغِ شِحْنَتِهَا."
            type: usage
    actions:
