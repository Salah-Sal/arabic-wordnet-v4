        params: {synset_id: "awn4-09280667-n", definition_index: 0, text: "مَدْخَل مَائِيّ صَغِير فِي اليَابِسَة، غَالِبًا مَا يَكُون مَحْمِيًّا بَيْنَ رُؤُوس صَخْرِيَّة."}
