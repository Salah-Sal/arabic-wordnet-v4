    - lemma: "خَلِيج صَغِير"
      entry_id: "{auto}"
      roots:
        - word: "خليج"
          root: "خلج"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ. فَمِنْ ذَلِكَ الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ.»"
        - word: "صغير"
          root: "صغر"
          maqayis_quote: "«الصَّادُ وَالْغَيْنُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قِلَّةٍ وَحَقَارَةٍ. مِنْ ذَلِكَ الصِّغَرُ: ضِدُّ الْكِبَرِ.»"
    - lemma: "خَوْر"
      entry_id: "{auto}"
      root: "خور"
      maqayis_quote: "«الْخَاءُ وَالْوَاوُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا يَدُلُّ عَلَى صَوْتٍ، وَالْآخَرُ عَلَى ضَعْفٍ.»"
    - lemma: "شَرْم"
      entry_id: "{auto}"
      root: "شرم"
      maqayis_quote: "«الشِّينُ وَالرَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ لَا يُخْلَفُ، وَهُوَ يَدُلُّ عَلَى خَرْقٍ فِي الشَّيْءِ وَمَزْقٍ... وَسَمِعْتُ مَنْ يَقُولُ إِنَّ الشَّرْمَ كَالْخَرْقِ فِي جَانِبِ الْبَحْرِ، كَالْمَدْخَلِ إِلَى الْبَحْرِ.»"
    - lemma: "غُبّ"
      entry_id: "{auto}"
      root: "غبب"
      maqayis_quote: "«الْغَيْنُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى زَمَانٍ وَفَتْرَةٍ فِيهِ... وَالْغُبُّ: الضَّارِبُ مِنَ الْبَحْرِ حَتَّى يُمْعِنَ فِي الْبَرِّ.»"
