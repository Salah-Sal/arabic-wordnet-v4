# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (بطل، حامل اللقب) خاليتان من التشكيل الكامل"
      - "لمّة (بطل) في الأصل الكلاسيكي تعني الشجاعَ المقدِام، والتوسّع إلى معنى (الفائز في المسابقة) توسّعٌ دلالي حديث يستحق التوثيق"
      - "التعريف الحالي (شخص فاز بالمركز الأول في مسابقة) أسلوبه صحفي لا معجمي"
      - "غياب لمّة (مُتَوَّج) الشائعة في الخطاب الرياضي العربي المعاصر"
    observations: >
      المجموعة تعبّر عن مفهوم الفائز الأول في منافسة (champion/titleholder).
      اللمّة (بطل) هي الأكثر شيوعاً وعمقاً في الموروث العربي؛ وأصلها الاشتقاقي يعني من يُعرّض نفسه للمتالف ويتحمّل الجراح.
      أما (حامل اللقب) فهي مصطلح تقني دقيق يُركّز على البُعد الإداري الرسمي لحيازة اللقب.
      المجموعة تحتاج إلى إضافة (مُتَوَّج) لتغطية السياق الاحتفالي الرياضي.
  blind_candidates:
    - lemma: "مُتَوَّج"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من الفعل (تَوَّجَ) على وزن مُفَعَّل، وتوج الشخصَ = ألبسه التاج وجعله ملكاً أو بطلاً.
        فالمُتَوَّج هو من نال التتويج بالبطولة؛ وهو مصطلح شائع في الصحافة الرياضية العربية
        يحمل معنى الاعتراف الرسمي بالفوز (حُسِمَ اللقبُ بتتويج الفريق).
    - lemma: "السَّبَّاق"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من الجذر (سبق) يدلّ على المبالغة في السبق والتقدّم على الغير.
        استُعمل في الشعر القديم بمعنى (حائز قصبات السبق)، وهو من يتصدّر الميدانَ
        ويتقدّم المتنافسين. ربطه بمعنى الفائز الأول طبيعيٌّ دلالياً.
    - lemma: "الفَائِق"
      generation_method: majaz
      justification: >
        اسم فاعل من (فاقَ يَفُوقُ) أي علا على أقرانه وتميّز عليهم.
        تحويل بالمجاز من معنى (التفوق والعلوّ) إلى معنى (الفائز الأول في المسابقة)،
        إذ الفائزُ الأول هو من فاقَ جميعَ منافسيه.
    - lemma: "مُحْرِزُ اللَّقَبِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من (مُحْرِز) اسم فاعل من (أحرز = حصّل وغنم) و(اللقب = الوسام والعنوان).
        المحرِز هو من يضمّ الشيء إلى نفسه ويُثبّته؛ فمحرِز اللقب = من حصّل اللقبَ وضمّه.
        المركّب وحدة إضافية ثابتة في خطاب الرياضة والمسابقات.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────

