# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────

stage3_analysis:
  per_lemma:

    # ─── بطل (موجودة) ───────────────────────────────────────
    - lemma: "بطل"
      decision: confirmed
      decision_reason: >
        اللمّة راسخة في الموروث العربي بمعنى الشجاع المقدام، والتوسّع الدلالي إلى (الفائز الأول
        في المسابقة) موثَّق في المورد الحديث ومستقرٌّ في الخطاب الرياضي العربي
        (بطل العالم، بطل البطولة). اللمّة تحتاج تشكيلاً كاملاً (بَطَل).
        الوزن: فَعَل (مفرد، مذكر، اسم).
        اختبار الاستبدال: يُستخدم في سياق المجموعة بيسر تامّ (فاز بَطَلُ الموسم بالجائزة).
        اختبار الاشتقاق: جيّد (بُطولة، أبطال، بطَلَة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز طابع الشجاعة والإقدام في الفوز ويحمل دلالة أدبية وتاريخية راسخة،
        أشمل من أخويه إذ يمتدّ معناه إلى الشخصية القيادية والبطل الملحمي؛
        يُستخدم للإنسان والفريق على حدٍّ سواء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَطَل"

    # ─── حامل اللقب (موجودة) ─────────────────────────────────
    - lemma: "حامل اللقب"
      decision: confirmed
      decision_reason: >
        مُركَّب إضافي (MWE) موثَّق في المورد الحديث مقابلاً دقيقاً للـ titleholder.
        يُركّز على البُعد الإداري والرسمي لحيازة اللقب.
        اختبار التثبيت المعجمي: المركّب ثابت لا يُبدَّل فيه (حامل الكأس / حامل الميدالية
        تغيير المُضاف إليه يُغيّر المعنى جذرياً) → وحدة إضافية ثابتة مقبولة.
        يحتاج تشكيلاً كاملاً: حَامِلُ اللَّقَبِ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        مصطلح تقني إداري يُركّز على حيازة اللقب الرسمي وحمله؛ يُستخدم تحديداً
        في البروتوكول الرياضي للإشارة إلى الفريق أو الفرد الذي يحتفظ بالبطولة
        من الموسم السابق، وأضيق دلالةً من (بَطَل) لأنه مرتبط باللقب الرسمي المحدّد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَامِلُ اللَّقَبِ"

    # ─── مُتَوَّج (مرشح المرحلة ١) ──────────────────────────
    - lemma: "مُتَوَّج"
      source: stage1
      decision: confirmed
      decision_reason: >
        اسم مفعول شفّاف من الفعل (تَوَّجَ = ألبسه التاج أو جعله بطلاً)، وزن مُفَعَّل.
        المُتَوَّج = من نال التتويج بالبطولة. المصطلح مستقرٌّ في الصحافة الرياضية العربية
        (المنتخب المتوَّج بكأس العرب، المتوَّج بالميدالية الذهبية).
        اختبار التثبيت المعجمي: الشكل مسكوك استعمالياً وإن لم يُسجَّل بعدُ في المعاجم الكلاسيكية.
        الاشتقاقية: ممتازة (تَوَّجَ / تتويج / أتاج / متاج).
        فحص الاستبدال: يعمل بديلاً عن (بَطَل) في السياق الاحتفالي الرياضي تحديداً.
        اختبار عدم الاشتراك: لا لبس مع معنى آخر بخلاف (الفَائِق) الذي يشترك مع
        مصطلح تشريحي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز لحظة التتويج والطابع الاحتفالي الرسمي، ويُستخدم خاصةً في السياق الإعلامي الرياضي
        للإشارة إلى من نال الكأس أو اللقب في حفل الختام؛ أقرب إلى (التتويج كفعل)
        منه إلى (الاستحقاق الدائم للبطولة).
      actions:
        - command: create_entry
          params:
            lemma: "مُتَوَّج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09926157-n"

    # ─── السَّبَّاق (مرشح مرفوض) ─────────────────────────────
    - lemma: "السَّبَّاق"
      source: stage1
      decision: removed
      decision_reason: >
        الوزن فَعَّال يدلّ على كثرة السبق وتكراره، فهو مَن يتقدّم الناسَ عادةً
        في الميدان. الدلالة الجوهرية ميدانية سباقية (رهان الخيل، سباقات السرعة)
        لا تشمل المسابقات الفكرية والفنية. فضلاً عن ذلك يُبدو المعنى (المعتاد
        على السبق) لا (الفائز بمسابقة بعينها)، مما يُضعف الانطباق على المفهوم.

    # ─── الفَائِق (مرشح مرفوض) ──────────────────────────────
    - lemma: "الفَائِق"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الأولى في الوسيط (الجيِّد من كلِّ شيء) عامّة جداً ولا تخصّ
        الفائز الأول في مسابقة. يُضاف إلى ذلك أن المعجم الوسيط يُثبت معنىً
        تشريحياً (موصل الفقرة العليا للعمود الفقاري) مما يُحدث اشتراكاً لفظياً
        يُضرّ بالاستعمال المصطلحي.

    # ─── مُحْرِز اللَّقَب (مرشح مرفوض) ──────────────────────
    - lemma: "مُحْرِزُ اللَّقَبِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على المركّب مسجَّلاً في أيٍّ من المعاجم المستعلَمة.
        اختبار التثبيت المعجمي: يمكن إبدال (اللقب) بـ(الكأس / الميدالية / الجائزة)
        مع بقاء البنية وصفاً مقبولاً، مما يدلّ على أنه عبارة وصفية لا وحدة
        معجمية مسكوكة ثابتة.


