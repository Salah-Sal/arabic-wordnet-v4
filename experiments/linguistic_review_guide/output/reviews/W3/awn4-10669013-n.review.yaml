# en        : starting pitcher
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «رامٍ أساسي» تفتقر إلى التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط لمصطلح رياضي متخصص"
      - "التعريف الحالي قريب من الترجمة الحرفية وليس بأسلوب المعجم الوسيط"
      - "المفهوم أجنبي ثقافياً (البيسبول ليس رياضة عربية) مما يستدعي ضبط دلالي دقيق"
    observations: >
      المجموعة تُعبّر عن مفهوم رياضي تخصصي في كرة القاعدة (البيسبول)، وهو «الرامي
      الأساسي» الذي يفتتح المباراة. اللمّة الحالية «رامٍ أساسي» تتبع النمط الرياضي
      العربي الراسخ: «لاعب أساسي» (= starter) في مقابل «لاعب احتياطي/بديل».
      غير أن المصطلح ليس وحدةً معجمية مسكوكة بالتشكيل الكامل، والتعريف يحتاج إلى
      صياغة بأسلوب معجمي أرقى. المصطلح الإنجليزي «starting pitcher» يُرجَّح توليده
      عربياً بطريقة التركيب الوصفي أو الإضافي لا بالاشتقاق الصرف.

  blind_candidates:
    - lemma: "رَامِي الافْتِتَاحِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «رامي» (الذي يرمي) و«الافتتاح» (البداية/الشروع). يُعبّر عن
        الرامي الذي يفتتح المباراة، مُستلهَماً من تعبير «افتتاح الجلسة» و«افتتاح
        الموسم» وهو نمط تركيبي منتج في العربية.
    - lemma: "مُفْتَتِح"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل الثماني «افتتح» على وزن مُفْتَعِل. يعني الذي يفتتح/يبدأ،
        وقد استُعمل في المعاجم الحديثة بمعنى المبادر بالفعل. الجذر «فتح» يدل على
        خلاف الإغلاق، ومنه فواتح السور وافتتاح المباريات.
    - lemma: "رَامٍ أَوَّلِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «رامٍ» و«أوّلي» (من الأول)؛ يُميّز هذا الرامي بكونه الأول
        في المباراة. النسب إلى «أوّل» يُفيد الأسبقية الزمنية مما يُعبّر عن الرامي
        الذي يبدأ المباراة.
    - lemma: "رَامٍ بَادِئ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «رامٍ» و«بادئ» (اسم فاعل من بدأ). «البادئ» يعني الذي يبدأ
        الشيء ويُبادر به، فـ«رامٍ بادئ» = الرامي الذي يبدأ المباراة. وردت كلمة
        «بادئ» في تعريف المجموعة الأعلى مما يجعلها مألوفة في السياق الرياضي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "رامٍ أساسي"
      confirm:
        - text: >
            «القاذِف؛ الرامي [وبخاصة في البَيْسْبول]»
          source: "المورد الحديث (2008)"
        - text: >
            «مِرْفَقُ رُماةِ البيسبُول» — المصطلح الطبي لإصابة الرامي في البيسبول،
            مما يُثبت جمع «رُماة» لاسم فاعل «رامٍ» في السياق البيسبولي
          source: "المعجم الطبي الموحد (2009)"
        - text: >
            «مَنْ حِرْفَتُه الرِّمايَةُ»
          source: "المعجم الكبير — مجمع اللغة العربية"
      expands:
        - text: >
            «بادئ مزرعة جرثومية تحتوي على الكائن المناسب» — يُظهر أن «بادئ» هو
            المصطلح الأشمل للـ starter في حقول أخرى، مما يُبيّن أن «أساسي» اختيار
            خاص بالسياق الرياضي تمييزاً من البديل (احتياطي)
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: >
            يُوضّح أن دلالة «البدء/البداية» في العربية التقنية تُعبَّر عنها بـ«بادئ»
            لا بـ«أساسي»، غير أن السياق الرياضي يُفضّل «أساسي» تمييزاً من الاحتياطي

    - lemma: "رَامِي الافْتِتَاحِ"
      confirm:
        - text: >
            «افتتاح: opening; first night» — يُثبت دلالة الافتتاح على البداية/الفتح
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      evidence_status: "no_material_found"

    - lemma: "مُفْتَتِح"
      evidence_status: "no_material_found"

    - lemma: "رَامٍ أَوَّلِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "رَامٍ بَادِئ"
      expands:
        - text: >
            «البادئ: ما يبدأ منه وهو الرأي الفطير يبدو قبل إنعام النظر»
          source: "المعجم الوسيط"
          addition: >
            يُثبت استعمال «بادئ» بمعنى «الأوّل/الشارع» وهو ما يُناسب الرامي الذي
            يبدأ المباراة، غير أن الاستعمال في المجموعة الأعلى (hypernym) يحصر
            «بادئ» في اللاعب الذي يكون في الملعب منذ البداية بوجه عام
        - text: >
            «البادئ: bootstrap / initiator» — يُظهر استعمال «بادئ» في السياق التقني
            للدلالة على المُشغِّل الأوّل
          source: "المعجم الطبي الموحد (2009) / مسرد الهندسة الكهربائية"
          addition: "يُؤكد قدرة «بادئ» الاشتقاقية لكنه بعيد عن السياق الرياضي الرامي"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "رامٍ أساسي"
      decision: confirmed
      decision_reason: >
        اللمّة مدعومة بشواهد معجمية تُثبت استعمال «الرامي» تحديداً في سياق البيسبول
        (المورد الحديث، المعجم الطبي الموحد). صيغة «رامٍ أساسي» تتبع النمط الرياضي
        العربي الراسخ (لاعب أساسي = starter player) وتنسجم مع المجموعة الأعلى التي
        تستخدم «لاعب أساسي» للمفهوم الأشمل. المركّب وإن كان تركيباً وصفياً
        (compositional) إلا أنه تابع لمصطلح رياضي مستقر ومعقول التثبيت. تحتاج اللمّة
        إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تتمايز عن المجموعة الأعلى (بادئ / لاعب أساسي)
        بالتخصيص البيسبولي: «رامٍ أساسي» = الرامي الذي يُفتتح به المباراة، في مقابل
        «رامي الإغاثة» (relief pitcher) الذي يدخل خلال المباراة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَامٍ أَسَاسِيٌّ"

    - lemma: "رَامِي الافْتِتَاحِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يَرِد المصطلح في أي مصدر معجمي موثوق. «افتتاح» يحمل دلالة الحفل الرسمي
        والمناسبة التأسيسية أكثر من دلالة البداية الاعتيادية للمباراة، مما يُفضي إلى
        عدم الدقة الدلالية. لا يجتاز اختبار التثبيت المعجمي بوصفه وحدة ثابتة.

    - lemma: "مُفْتَتِح"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية تُثبت استعمال «مُفتتح» في السياق الرياضي. المصطلح غامض
        دلالياً إذ يُستعمل لمعانٍ عدة (مُفتتح الجلسة، مُفتتح المسابقة...) ولا يتحدد
        تلقائياً برامي البيسبول. رُفض لعدم الاطراد وانعدام التثبيت المعجمي.

    - lemma: "رَامٍ أَوَّلِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «أوّلي» يعني المتعلق بالأصل والمنشأ (primary, elementary) ولا يُفيد الترتيب
        الزمني داخل المباراة بوضوح. لا يُميّز الرامي الأساسي من رامي الإغاثة بدلالة
        دقيقة. لا مادة معجمية تدعمه في السياق الرياضي.

    - lemma: "رَامٍ بَادِئ"
      source: stage1
      decision: removed
      decision_reason: >
        «بادئ» مُستخدم بالفعل في المجموعة الأعلى المباشرة (awn4-10668877-n) بمعنى
        «اللاعب الذي يكون في اللعبة منذ البداية»، مما يُنشئ تداخلاً دلالياً مع
        الأعم إذا استُخدم في الأخص أيضاً. رُفض تفادياً للخلط الاصطلاحي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "(في البيسبول) الرامي الذي يبدأ المباراة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُبنى على ترجمة حرفية للتعريف الإنجليزي ويفتقر إلى الفصل
        النوعي الكافي (لا يُميّز من رامي الإغاثة)، كما يفتقر إلى أسلوب المعجم
        الوسيط في تعريف المصطلحات الرياضية.
    authored:
      - type: terminological
        text: >
          (البيسبول) رَامٍ في فريق كرة القاعدة يُكلَّف ببدء المباراة من الشوط الأول،
          ويُميَّز من رامي الإغاثة الذي يحلّ محله في أثناء اللعب.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          في لعبة البيسبول (كرة القاعدة)، الرامي الذي يُعيَّن ليبدأ المباراة ويرمي
          الكرة لأول مرة نحو الضارب المقابل. يُمثّل الركيزة الرئيسية لدفاع الفريق،
          وكثيراً ما يُلاحَق أداؤه بمقاييس إحصائية خاصة (عدد الشوطات المكتملة، معدل
          الكرات المستقبَلة). يتمايز من رامي الإغاثة (relief pitcher) الذي يدخل
          للاحتلال في أثناء المباراة.
    actions:
