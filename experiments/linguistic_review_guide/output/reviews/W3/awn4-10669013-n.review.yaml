          definition_index: 0
          text: >
            (البيسبول) رَامٍ في فريق كرة القاعدة يُكلَّف ببدء المباراة من الشوط
            الأول، ويُميَّز من رامي الإغاثة الذي يحلّ محله في أثناء اللعب.
      - command: add_definition
