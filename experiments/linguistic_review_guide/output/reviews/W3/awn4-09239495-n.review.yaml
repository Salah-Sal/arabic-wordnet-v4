stage1_review:
  assessment:
    concerns:
      - اللمّة الموجودة "خليج بسكاي" تفتقر للتشكيل الكامل.
      - غياب المرادفات البديلة المعروفة جغرافياً وتاريخياً مثل "خليج غاسكونيا".
    observations: "المجموعة تمثل معلماً جغرافياً محدداً (Proper Noun)، وهو خليج مائي كبير بين فرنسا وإسبانيا. التسميات العربية لهذا المعلم غالباً ما تكون نقلاً صوتياً للأسماء الأجنبية (بسكاي، غاسكونيا) مسبوقة بكلمة 'خليج' أو 'بحر'."
  blind_candidates:
    - lemma: "خَلِيجُ بِسْكاي"
      generation_method: tarkib
      justification: "التسمية العربية الشائعة والمباشرة لهذا المعلم الجغرافي."
    - lemma: "خَلِيجُ غاسْكونِيَا"
      generation_method: tarkib
      justification: "تسمية بديلة مشهورة (نسبة إلى إقليم غاسكونيا الفرنسي) وهي مستخدمة في الأطالس والموسوعات العربية."
    - lemma: "بَحْرُ بِسْكاي"
      generation_method: tarkib
      justification: "تستخدم كلمة 'بحر' أحياناً للإشارة إلى الخلجان الكبيرة المفتوحة."
    - lemma: "بَحْرُ غاسْكونِيَا"
      generation_method: tarkib
      justification: "تسمية بديلة تجمع بين كلمة بحر والاسم الجغرافي غاسكونيا."

