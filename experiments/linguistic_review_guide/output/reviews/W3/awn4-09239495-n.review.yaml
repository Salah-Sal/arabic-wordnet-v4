stage4_content:
  definition:
    current: "ذراع من المحيط الأطلسي في غرب أوروبا؛ يحده الساحل الغربي لفرنسا والساحل الشمالي لإسبانيا"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً وجغرافياً ويحدد المعلم الجغرافي بوضوح."
  examples:
    per_lemma:
      - lemma: "خَلِيجُ بِسْكاي"
        examples:
          - text: "يُعَدُّ خَلِيجُ بِسْكاي مِنْ أَكْثَرِ مَنَاطِقِ الْمُحِيطِ الأَطْلَسِيِّ اضْطِرَابًا بِسَبَبِ الْعَوَاصِفِ الشِّتَوِيَّةِ."
            type: usage
      - lemma: "خَلِيجُ غاسْكونِيَا"
        examples:
          - text: "يَمْتَدُّ خَلِيجُ غاسْكونِيَا بَيْنَ السَّوَاحِلِ الْفَرَنْسِيَّةِ وَالإِسْبَانِيَّةِ، وَيُعْرَفُ بِثَرْوَتِهِ السَّمَكِيَّةِ."
