#   ٢. إثراء مدمج (definitions + examples + plurals) بـ entry_ids
#   ٣. جسر إنجليزي: examiner, inspector, surveyor, auditor
#   ٤. مقاييس اللغة (dictionary_id=151) لجذور: فحص، فتش، رقب
stage2_evidence:
  per_lemma:

    - lemma: "فاحص"
      confirm:
        - text: "«الْفَاءُ وَالْحَاءُ وَالصَّادُ أَصْلٌ صَحِيحٌ، وَهُوَ كَالْبَحْثِ عَنِ الشَّيْءِ. يُقَالُ: فَحَصْتُ عَنِ الْأَمْرِ فَحْصًا. وَأُفْحُوصُ الْقَطَا: مَوْضِعُهَا فِي الْأَرْضِ، لِأَنَّهَا تَفْحَصُهُ»"
          source: "مقاييس اللغة لابن فارس (جذر فحص)"
      expands:
        - text: "«tester» (في السياق الطبي)"
          source: "المعجم الطبي الموحد — ArabTerm 2009"
          addition: "يُستعمل فاحص في السياق الطبي بمعنى من يُجري الاختبارات والفحوصات، مما يؤكد دلالته الاستقصائية التطبيقية"

    - lemma: "مفتش"
      confirm:
        - text: "«موظف يقوم بتفتيش أعمال حكومية أو غيرها (محدثة)»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
        - text: "«موظَّف يقوم بفحص وتفقّد أعمال إدارية أو غيرها لمعرفة مدى صحّتها وحسن إنجازها، له درجة في السلّم الإداري تعهد له مهمة مراقبة سير الأعمال في المؤسسات التربوية والتعليمية والإدارات الحكومية»"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي — ArabTerm 2020"
        - text: "«القائم بأعمال التفتيش»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية — ArabTerm 2004"
      expands:
        - text: "«الْفَاءُ وَالتَّاءُ وَالشِّينُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى بَحْثٍ عَنْ شَيْءٍ. تَقُولُ: فَتَشْتُ فَتْشًا، وَفَتَّشْتُ تَفْتِيشًا»"
          source: "مقاييس اللغة لابن فارس (جذر فتش)"
          addition: "الجذر يدل على البحث المطلق، والتفتيش (باب التفعيل) يُضيف معنى الشدة والتكرار والاستقصاء المنهجي"

    - lemma: "مُدَقِّق"
      confirm:
        - text: "«المدقق: من يُحَقّق المسئلة بدليلها وَذَلِكَ الدَّلِيل بِدَلِيل آخر»"
          source: "دستور العلماء للأحمدنكري — hawramani (القرن الثامن عشر)"
      expands:
        - text: "«مدقق حسابات» = auditor"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة — ArabTerm 1995"
          addition: "الاستخدام الحديث السائد يُقيّد مدققاً في المجال المحاسبي (مدقق حسابات)، مما يُضيّق دلالته العامة"

    - lemma: "مُرَاقِب"
      confirm:
        - text: "«من يقوم بالرَّقابة»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة"
        - text: "«من يقوم بالحراسة والملاحظة، ومن يخاف الله ويخشاه في عمله»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«ticket inspector, controller, observer»"
          source: "مسرد الفن والتسلية والرياضة؛ مسرد الهندسة الكهربائية — ArabTerm"
          addition: "يُستعمل مراقب في مجالات تقنية متعددة بمعنى المتحكم والمراقب الآلي، مما يُوسّع دلالته بعيداً عن الشخص المحقق"

    - lemma: "رَقِيب"
      confirm:
        - text: "«(الرَّقِيب) من يُلَاحظ أمرا مَا والحارس والحافظ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين — hawramani"
        - text: "«الرَّاءُ وَالْقَافُ وَالْبَاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى انْتِصَابٍ لِمُرَاعَاةِ شَيْءٍ. مِنْ ذَلِكَ الرَّقِيبُ، وَهُوَ الْحَافِظُ»"
          source: "مقاييس اللغة لابن فارس (جذر رقب)"
      contradicts:
        - text: "«الرَّقيبُ: اللَّهُ، والحافِظُ، والمُنْتَظِرُ، والحارِسُ، وأمينُ أصحابِ المَيْسِرِ، والثالثُ من قِداحِ المَيْسِرِ، ونَجْمٌ من نُجومِ المَطَرِ يُراقِبُ نَجْماً آخَرَ، وفَرَسُ الزِّبْرِقانِ بنِ بَدْرٍ، وابنُ العَمِّ، وحَيَّةٌ خَبيثَةٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الاشتراك اللفظي الشديد: رقيب يحمل معاني كثيرة متباينة تجعله غير صالح كمصطلح منضبط للمجموعة"
        - text: "«censor» (رقيب في الإعلام والاتصالات)"
          source: "مسرد الإعلام والتواصل — ArabTerm"
          conflict: "في الاستخدام التقني المعاصر رقيب = رقيب صحفي/إعلامي (censor)، وهو مختلف جوهرياً عن examiner/inspector"

    - lemma: "مُتَفَحِّص"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "فاحص"
      decision: confirmed
      decision_reason: >
        اسم فاعل عربي فصيح من جذر (فحص) الثابت في مقاييس اللغة بمعنى البحث
        والاستقصاء. مستعمل في المعجم الطبي الموحد والمصطلحيات الحديثة. يفي
        باشتراطات المجموعة من حيث الدلالة والبنية الصرفية. اللمّة تحتاج إضافة
        التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الفحص الدقيق التشخيصي — الاستقصاء في جوهر الأمر بمنهجية علمية
        محايدة، بعيداً عن ارتباطه بسلطة رسمية مؤسسية. الفاحص يستقصي ماهية الشيء
        وحقيقته (فحص طبي، فحص وثيقة، فحص عيّنة).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَاحِص"

    - lemma: "مفتش"
      decision: confirmed
      decision_reason: >
        مصطلح عربي فصيح حديث موثَّق في المعجم الوسيط ومصطلحيات رسمية متعددة.
        الجذر (فتش) في مقاييس اللغة يؤكد دلالة البحث والاستقصاء، وباب التفعيل
        يُضيف الشدة والمنهجية. اللمّة تحتاج إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على التفتيش المؤسسي الرسمي ذي الصلاحيات الإدارية — المفتش شخص
        يحمل صفة رسمية ويراقب مطابقة الأعمال للمعايير المقررة بحكم منصبه
        (مفتش تربوي، مفتش صحي، مفتش شرطة). الارتباط بالسلطة والمنصب أجلى منه
        في فاحص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُفَتِّش"

    - lemma: "مُدَقِّق"
      source: stage1
      decision: removed
      decision_reason: >
        رغم الشاهد المعجمي في دستور العلماء (المعنى الفلسفي)، فإن الاستخدام الحديث
        السائد قيَّد مدققاً في المجال المحاسبي (مدقق حسابات = auditor)، مما يُحدث
        اشتراكاً لفظياً يُضعف دقته في سياق المجموعة. المجموعة مكتفية بـ فاحص
        ومفتش.

    - lemma: "مُرَاقِب"
      source: stage1
      decision: removed
      decision_reason: >
        مراقب أعمّ دلالةً من المطلوب — يُشير إلى كل من يقوم بالرقابة عموماً بما
        فيها الرقابة الإدارية والتقنية (controller)، لا من يُدقق بعناية استقصائية.
        فضلاً عن ذلك، يُلائم المجموعة الأعم (awn4-10235293-n: محقق) أكثر من هذه.

    - lemma: "رَقِيب"
      source: stage1
      decision: removed
      decision_reason: >
        الاشتراك اللفظي الشديد في رقيب (اسم الله الحسنى، رقيب صحفي/إعلامي=censor،
        رتبة عسكرية، نجم في علم الفلك) يجعله غير صالح كمصطلح واضح. في الاستخدام
        المعاصر يُوحي بالرقابة السلطوية (censor) أكثر مما يُوحي بالفحص التحقيقي.
        اختبار الاستبدال: «الرقيب» في سياق المراقبة الإعلامية لا يُرادف examiner.

    - lemma: "مُتَفَحِّص"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي على تثبيته كمصطلح مسكوك. وإن كان استعماله الوصفي ممكناً
        نحوياً، فإنه لا يرقى إلى مستوى اللمّة المعجمية الثابتة. اختبار السكّ:
        يمكن إبداله بـ «المستقصي» أو «المتحقق» مع الحفاظ على المعنى ذاته، مما
        يثبت أنه وصف وليس مصطلحاً معجمياً منضبطاً.


