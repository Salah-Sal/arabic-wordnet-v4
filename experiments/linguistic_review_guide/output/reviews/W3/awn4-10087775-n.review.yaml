# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (فاحص، مفتش) خاليتان من التشكيل الكامل في السجل"
      - "التعريف الحالي «محقّق يراقب ويدقق بعناية» وصفيٌّ ومختصر، يفتقر إلى الجنس القريب والفصل النوعي الكافي"
      - "غياب أمثلة استعمالية للمجموعة والمعاني"
    observations: >
      المجموعة awn4-10087775-n تمثّل مفهوم «الشخص الذي يُراقب ويُدقّق»، وهو مفهوم
      عربي أصيل تحتضنه ألفاظ فصيحة متعددة. كلٌّ من فاحص ومفتش مشتقٌّ من جذر
      راسخ في المعاجم الكلاسيكية والحديثة، غير أن بينهما فارقاً دلالياً دقيقاً:
      الفحص يقترن بالاستقصاء الدقيق والكشف العلمي، بينما التفتيش يقترن بالرقابة
      المؤسسية الرسمية. التعريف الحالي أقرب إلى الوصف الوظيفي منه إلى التعريف
      المصطلحي المحكم بجنس قريب وفصل نوعي.

  blind_candidates:
    - lemma: "مُدَقِّق"
      generation_method: ishtiqaq
      justification: >
        من جذر (د.ق.ق)، على وزن مُفَعِّل (اسم فاعل من دقَّق). وزن مُفَعِّل يدل
        على الشدة والتكرار، وهو ملائم لوصف من يتحرى الأمور بدقة متناهية ويُحكم
        الفحص. يُناسب «يدقق بعناية» الواردة في التعريف.

    - lemma: "مُرَاقِب"
      generation_method: ishtiqaq
      justification: >
        من جذر (ر.ق.ب)، على وزن مُفَاعِل (اسم فاعل من راقَبَ). الفعل راقَبَ
        يدل على المعاينة والملاحظة المستمرة. يُناسب «يراقب» الواردة في التعريف
        ويستجيب لوصف من يرصد الأمور عن كثب.

    - lemma: "رَقِيب"
      generation_method: ishtiqaq
      justification: >
        من جذر (ر.ق.ب)، على وزن فَعِيل (صيغة مبالغة بمعنى فاعل). فَعِيل للمبالغة
        يناسب وصف من يواظب على المراقبة ويُتقن الرصد. وزن كلاسيكي راسخ يُحيل
        إلى الحافظ الشديد اليقظة.

    - lemma: "مُتَفَحِّص"
      generation_method: ishtiqaq
      justification: >
        من جذر (ف.ح.ص)، على وزن مُتَفَعِّل (اسم فاعل من تفحَّص). صيغة التفعّل
        تدل على التكلف والتعمق في الفحص وطول الاستقصاء، مما يلائم «يراقب ويدقق
        بعناية».


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
