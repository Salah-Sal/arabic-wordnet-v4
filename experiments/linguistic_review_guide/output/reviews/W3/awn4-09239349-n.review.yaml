          source: "المعجم الكبير"
        - text: "جمهوريّةٌ إسلامية تحدُّها الهند من الشَّمال والشرق والغرب , ويحدُّها من الجنوب خليج البنغال"
          source: "المعجم الكبير (تعريف بنجلادش)"
        - text: "Bay of Bengal"
          source: "المكنز الزراعي (Agrovoc)"
    - lemma: "بَحْرُ البَنْغَالِ"
      evidence_status: "no_material_found"
    - lemma: "خَلِيجُ بَنْغَالَا"
      evidence_status: "no_material_found"
    - lemma: "جَوْنُ البَنْغَالِ"
      evidence_status: "no_material_found"

