stage1_review:
  assessment:
    concerns: []
    observations: "المصطلح الموجود هو التسمية القياسية الحديثة لهذا المعلم الجغرافي، وهو تعبير مركب إضافي (خليج + البنغال). لا توجد مشكلات لغوية واضحة."
  blind_candidates:
    - lemma: "خَلِيجُ البَنْغَالِ"
      generation_method: tarkib
      justification: "التسمية العربية القياسية للخليج الواقع شرق الهند."
    - lemma: "بَحْرُ البَنْغَالِ"
      generation_method: tarkib
      justification: "تسمية بديلة تستخدم أحياناً في السياقات التاريخية أو العامة."
    - lemma: "خَلِيجُ بَنْغَالَا"
      generation_method: tarkib
      justification: "تنويع في كتابة اسم العلم الأعجمي (بنغال/بنغالا)."
    - lemma: "جَوْنُ البَنْغَالِ"
      generation_method: tarkib
      justification: "استخدام لفظ 'جون' كمرادف لخليج في السياقات الجغرافية القديمة."

stage2_evidence:
