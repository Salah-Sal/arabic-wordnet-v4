# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتَيْن (جاسبر جونز وجونز) مكتوبتان بدون تشكيل، مما يُفضي إلى التباس في النطق"
      - "اللمّة «جونز» منفردةً عالية الغموض في العربية؛ إذ تشترك مع أعلام متعددة (داو جونز، بنس جونز، وغيرها)"
      - "التعريف لا يُحدّد نوع الفن الدقيق (تشكيلي/تصويري/طباعي)، فيبقى واسعاً أكثر مما ينبغي"
    observations: >
      تمثّل هذه المجموعة اسم عَلَم لشخصية فنية تاريخية موسوعية هي الرسام الأمريكي جاسبر جونز.
      اللمّتان الموجودتان كلتاهما تعريب صوتي (نقل حرفي) للاسم الإنجليزي «Jasper Johns».
      غياب التشكيل يُفضي إلى التباس في النطق. لا يُتوقّع وجود مدخل في المعاجم
      العربية الكلاسيكية أو الحديثة لاسم عَلَم أجنبي من هذا النوع، لذا تنحصر طريقة
      التوليد في التعريب (taarib). أسلوب التعريف مقبول وفق النمط الموسوعي المعتاد
      في قواميس WordNet للأعلام، غير أنه يستحسن تحديد التخصص الفني.

  # القراءة العمياء: التعريف = «فنان أمريكي ومن أنصار فن البوب (ولد عام 1930)»
  # الشخصية تُستَنبط معرفياً: الفنان الأمريكي الأبرز في فن البوب مواليد 1930 هو Jasper Johns
  blind_candidates:
    - lemma: "جَاسْبِر جُونْز"
      generation_method: taarib
      justification: "التعريب الصوتي القياسي للاسم الكامل «Jasper Johns» بتحويل Jasper إلى جاسبر وJohns إلى جونز بالزاي؛ وهو الشكل السائد في المصادر الموسوعية العربية"
    - lemma: "جَاسْبِير جُونْز"
      generation_method: taarib
      justification: "تعريب بديل يمدّ كسرة السين إلى ياء (جاسبير) وفق ما جرى عليه بعض النقل العربي للأسماء الإنجليزية على نمط «سبيلبرغ → سبيلبيرغ»"
    - lemma: "جَاسْبِر جُونْس"
      generation_method: taarib
      justification: "تعريب بديل يُعبّر عن الصوت الأخير في «Johns» بالسين عوضاً عن الزاي، وهو اختيار بعض المترجمين العرب في نقل صوت /z/ إلى سين"
    - lemma: "جُونْز"
      generation_method: taarib
      justification: "الاقتصار على اللقب «Johns» دون الاسم الأول، وهو استخدام شائع في السياقات الأكاديمية عند الإشارة إلى فنانين بلقبهم المجرد"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1 — مطابقة دفعية: جاسبر جونز، الجاسبر جونز، جونز، الجونز،
#         جاسبر جونس، جاسبير جونز (0 نتيجة)
#   Q2 — الجسر الإنجليزي: Johns OR "Jasper Johns" OR "pop art" (10 نتائج)
#         → يشب=jasper (حجر كريم)، فن جماهيري / فن شعبي = pop art
#         → لا يوجد مدخل باسم الفنان
#   Q3 — FTS عربي: «البوب» OR «جاسبر» OR «جونز»
#         → جونز في المعاجم الطبية (Bence-Jones، Jones' position...)
#         → موسيقى البوب، طريقة البوب (لا صلة بالفنان)
stage2_evidence:
  per_lemma:
    - lemma: "جاسبر جونز"
      evidence_status: "no_material_found"

    - lemma: "جونز"
      expands:
        - text: "«أُسْطُواناتُ بِنْس جُونْز» — «غلوبولين بنس-جونز» — «وَضْعِيَّةُ جونز» — «تَفاعُلُ جونز-موت»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "تُظهر هذه المداخل أن «جونز» في المعاجم العربية المتخصصة مرتبط بأعلام طبية لا بالفنان جاسبر جونز؛ مما يؤكد ارتفاع درجة الغموض للّمّة منفردةً"
        - text: "«مؤشر داو جونز للاستدامة»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "دليل إضافي على غموض «جونز» إذ تُستخدم في سياقات مالية مستقلة تماماً"

    - lemma: "جَاسْبِر جُونْز"
      evidence_status: "no_material_found"

    - lemma: "جَاسْبِير جُونْز"
      evidence_status: "no_material_found"

    - lemma: "جَاسْبِر جُونْس"
      evidence_status: "no_material_found"

    - lemma: "جُونْز"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "جاسبر جونز"
      decision: confirmed
      decision_reason: >
        التعريب الصوتي القياسي للاسم الكامل «Jasper Johns»؛ الصيغة الأكثر تحديداً
        وانتشاراً في الإعلام العربي والمصادر الموسوعية للإشارة إلى هذا الفنان بلا لبس.
        غياب التشكيل مشكلة شكلية تُعالَج بإجراء update_lemma.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: "الاسم الكامل ثنائي المكوّن (الاسم الأول + اللقب)، يُفضَّل في السياقات الرسمية والموسوعية ويزيل اللبس تماماً عن أي شخص آخر يحمل لقب «جونز»"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَاسْبِر جُونْز"

    # ── لمّة موجودة ٢ ──
    - lemma: "جونز"
      decision: confirmed
      decision_reason: >
        يُقبَل كصيغة اختصارية للّقب وحده، وهو استخدام سائد في النقد الفني والصحافة
        الثقافية عند الإشارة إلى الفنان بعد ذكر اسمه الكامل. غياب التشكيل يُعالَج
        بإجراء update_lemma. الغموض مرتفع عند الاستخدام المنفرد، لكنه مقبول كلمّة
        مساعدة ضمن المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الاسم المختصر (اللقب وحده)، يُستخدم سياقياً بعد الذكر الأول للاسم الكامل؛ أعلى درجةً في الغموض من الاسم الكامل إذا وقع منفرداً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُونْز"

    # ── مرشح المرحلة ١ — أ ──
    - lemma: "جَاسْبِر جُونْز"
      source: stage1
      decision: removed
      decision_reason: "مكرّر للمّة الموجودة «جاسبر جونز» بعد إضافة التشكيل؛ update_lemma يكفي ولا حاجة لإدخال جديد"

    # ── مرشح المرحلة ١ — ب ──
    - lemma: "جَاسْبِير جُونْز"
      source: stage1
      decision: removed
      decision_reason: "صيغة أقل شيوعاً في المصادر العربية مقارنةً بـ«جاسبر»؛ وصيغة «جاسبر» أقرب صوتياً للأصل الإنجليزي /ˈdʒæspər/ وأكثر استقراراً في الاستخدام العربي"

    # ── مرشح المرحلة ١ — ج ──
    - lemma: "جَاسْبِر جُونْس"
      source: stage1
      decision: removed
      decision_reason: "تعريب «جونس» بالسين أقل انتشاراً من «جونز» بالزاي في المصادر العربية؛ الزاي أقرب لصوت /z/ في Johns وأكثر استقراراً"

    # ── مرشح المرحلة ١ — د ──
    - lemma: "جُونْز"
      source: stage1
      decision: removed
      decision_reason: "مكرّر للمّة الموجودة «جونز» بعد إضافة التشكيل؛ update_lemma يكفي"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فنان أمريكي ومن أنصار فن البوب (ولد عام 1930)"
    assessment:
      decision: revise
      reason: >
        التعريف صحيح في مضمونه الأساسي لكنه يفتقر إلى تحديد نوع الفن (تشكيلي)،
        ويستحسن ذكر سمة اشتهاره الرئيسية. علاوةً على ذلك، «ولد عام» أقل انسياباً
        من «مواليد» في العربية المعاصرة، و«أنصار» بصيغة الجمع صحيحة نحوياً ضمن
        عبارة «من أنصار» لكن «رواد» أو «أعلام» أكثر دلالةً للفنان الريادي.
    authored:
      - type: encyclopedic
        text: "فَنَّان تشكيليّ أمريكيّ وأحد رُوَّاد حركة فنّ البوب (مواليد 1930م)، اشتُهر بأعماله التصويرية والطباعية التي تستلهم رموزاً مألوفة كالأعلام والأرقام والخرائط"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "فَنَّان تشكيليّ أمريكيّ وأحد رُوَّاد حركة فنّ البوب (مواليد 1930م)، اشتُهر بأعماله التصويرية والطباعية التي تستلهم رموزاً مألوفة كالأعلام والأرقام والخرائط"

  examples:
    per_lemma:
      - lemma: "جَاسْبِر جُونْز"
        examples:
          - text: "أقام متحف نيويورك للفن الحديث (MoMA) معرضاً استعادياً شاملاً لأعمال جاسبر جونز احتفاءً بمسيرته الإبداعية الممتدة عبر سبعة عقود."
            type: usage
      - lemma: "جُونْز"
        examples:
          - text: "يُعدّ جونز من الفنانين القلائل الذين أحدثوا تحولاً جذرياً في مفهوم الفن الأمريكي الحديث بأعماله الأيقونية حول الأعلام والأهداف."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أصبحت لوحة جاسبر جونز «العلم» (1954–1955) من أيقونات فنّ البوب الأمريكي وإحدى العلامات الفارقة في تاريخ الفن المعاصر."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أقام متحف نيويورك للفن الحديث (MoMA) معرضاً استعادياً شاملاً لأعمال جاسبر جونز احتفاءً بمسيرته الإبداعية الممتدة عبر سبعة عقود."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدّ جونز من الفنانين القلائل الذين أحدثوا تحولاً جذرياً في مفهوم الفن الأمريكي الحديث بأعماله الأيقونية حول الأعلام والأهداف."


