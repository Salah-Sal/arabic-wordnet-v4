# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13869695-n — seventh
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «السابع» تحمل أداة التعريف (ال-)، والأصل في المعاجم العربية أن تُسجَّل اللمّات بدون ال- إلا إذا كانت لازمة"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو أمر متوقّع لمفهوم العدد الترتيبي"
      - "تصنيف POS بوصفه اسماً (n) مقبول لأنّ المراد هنا المركز/الرتبة لا الصفة الترتيبية"
    observations: "المفهوم بسيط ومباشر: العدد الترتيبي السابع مستعملاً اسمياً للدلالة على الموضع في سلسلة معدودة. هذا مفهوم رياضي عامّ لا إشكال ثقافياً فيه، واللغة العربية تملك له تعبيراً أصيلاً مباشراً من جذر «سبع» على وزن فاعِل."
  blind_candidates:
    - lemma: "سَابِعٌ"
      generation_method: ishtiqaq
      justification: "العدد الترتيبي من الجذر (س ب ع) على وزن فاعِل، وهو الصيغة القياسية للأعداد الترتيبية من ثلاثة إلى عشرة في العربية. يُستعمل اسمياً بمعنى المركز السابع."
    - lemma: "سَابِعَةٌ"
      generation_method: ishtiqaq
      justification: "المؤنث من سابِع على وزن فاعِلة، يُستعمل عند إسناد الترتيب إلى مؤنث أو مع محذوف مؤنث (الدرجة السابعة، المرتبة السابعة)."
    - lemma: "سُبَاعِيٌّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى السُّباع على وزن فُعالِيّ، لكنه يدلّ على ما يتألف من سبعة أجزاء لا على الموضع السابع — مرشح ضعيف."
    - lemma: "سُبْعٌ"
      generation_method: ishtiqaq
      justification: "من الجذر نفسه على وزن فُعْل، لكن دلالته الجزء الواحد من سبعة (الكسر ١/٧) لا الموضع الترتيبي — مرشح ضعيف يُتوقَّع رفضه."

stage2_evidence:
  per_lemma:
    - lemma: "السَّابِعُ"
      confirm:
        - text: "«(السَّابِع) مَا بَين السَّادِس وَالثَّامِن من الْعدَد وَيُقَال هُوَ سَابِع سَبْعَة أحد السَّبْعَة»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«ما بين السادس والثامن من العدد» و«هو سابع سبعة : أحد السبعة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(1) سابع؛ سابعة (2) السُّبع: جزء من سبعة (1/7) (3) السابع؛ السابعة [في مجموعة أو سلسلة].»"
          source: "المورد الحديث (2008)"
    - lemma: "سَابِعٌ"
      confirm:
        - text: "«(السَّابِع) مَا بَين السَّادِس وَالثَّامِن من الْعدَد وَيُقَال هُوَ سَابِع سَبْعَة أحد السَّبْعَة»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«ما بين السادس والثامن من العدد»"
          source: "المعجم الوسيط (OCR)"
    - lemma: "سَابِعَةٌ"
      confirm:
        - text: "«سَابِعة من (س ب ع) ما بين السادسة والثامنة من الأعداد، والمفترسة والبقرة الوحشية التي أكل السبع ولدها.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«السّابعة: عند المنجّمين هي سدس عشر السّادسة.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«سابعة — seventh»"
          source: "مسرد الفن، التسلية والرياضة (ArabTerm)"
          addition: "مصطلح فني مستعمل في مجال الفنون والرياضة"
    - lemma: "سُبَاعِيٌّ"
      evidence_status: "no_material_found"
    - lemma: "سُبْعٌ"
      contradicts:
        - text: "«السُّبْعُ: جُزْءٌ مِنْ سَبْعَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "السُّبْع يدلّ على الكسر (١/٧) لا على الموضع الترتيبي"

stage3_analysis:
  per_lemma:
    - lemma: "السَّابِعُ"
      decision: confirmed
      decision_reason: "اللمّة مؤكّدة بنصوص المعجم الوسيط والمورد الحديث. التعريف المعجمي يطابق مفهوم المجموعة الترادفية تماماً: «ما بين السادس والثامن من العدد». اللمّة تحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة المعرَّفة بأل تُستعمل للإشارة إلى موضع محدد معهود في سلسلة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "السَّابِعُ"
    - lemma: "سَابِعٌ"
      source: stage1
      decision: confirmed
      decision_reason: "الصيغة النكرة من العدد الترتيبي السابع، مؤكّدة في المعجم الوسيط. تُستعمل حين لا يكون الموضع معرّفاً أو في سياقات التنكير (جاء سابعاً)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة المنكّرة تُستعمل خبراً أو حالاً (جاء سابعاً) أو عند عدم تعيين السلسلة."
      actions:
        - command: create_entry
          params: {lemma: "سَابِعٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "سَابِعَةٌ"
      source: stage1
      decision: removed
      decision_reason: "هي المؤنث من سابع وتُستعمل مع الأعداد المعدودة المؤنثة. لكنها ليست لمّة مستقلة عن سابع في هذا السياق المعجمي، إذ التأنيث تصريف لا ترادف. فضلاً عن أنّ تعريف كشّاف التهانوي لها اصطلاح فلكي خاصّ."
    - lemma: "سُبَاعِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعماله بمعنى الموضع السابع. دلالته الراسخة هي ما يتألف من سبعة عناصر (سُباعي الأضلاع)، وهذا مفهوم مختلف."
    - lemma: "سُبْعٌ"
      source: stage1
      decision: removed
      decision_reason: "السُّبْع يدلّ على الكسر (جزء من سبعة) كما في مقاييس اللغة والمعجم الوسيط، لا على الموضع الترتيبي. الدلالة مختلفة تماماً."

