        ضروري في السياقات الموسوعية والأكاديمية. يحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الشكل الرسمي الكامل للاسم يشمل الاسم الأول «فيرنر»، ويُستخدم في المراجع
        الموسوعية وعند التعريف الأول للشخصية، بخلاف الشكل المختصر «فون براون».
      morphological_fit: >
        اسم علم أجنبي مُعرَّب، لا ينطبق عليه فحص الوزن الصرفي العربي.
      actions:
