stage2_evidence:
  per_lemma:
    - lemma: "فون براون"
      evidence_status: "no_material_found"

    - lemma: "فيرنر فون براون"
      evidence_status: "no_material_found"

    - lemma: "بِرَاوْن"
      contradicts:
        - text: "«بَرَاوِن: من (ب ر ن) صورة كتابية صوتية من البرائن جمع سماعي من البرني بمعنى نوع جيد من التمر مدور أحمر مشرب بصفرة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            المدخل يُحيل إلى «براون» بوصفه جمعاً للبرني (نوع من التمر)، لا اسم علم
            لشخصية تاريخية؛ فالسياق مختلف كلياً وقد يُسبب لبساً في الدلالة.
        - text: "«مُفاغَرَةٌ براون (معدية معوية): Braun's anastomosis»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >
            يُحيل إلى طبيب جراح ألماني آخر يُشاركه الاسم (براون الجراح)، لا إلى
            مهندس الصواريخ فيرنر فون براون؛ مما يُوجب تجنّب هذا الشكل المختصر.

    - lemma: "فُونْ بِرَاوْن"
      evidence_status: "no_material_found"

    - lemma: "فِيرْنَر فُونْ بِرَاوْن"
      evidence_status: "no_material_found"

    - lemma: "فِيرْنَر بِرَاوْن"
      evidence_status: "no_material_found"


