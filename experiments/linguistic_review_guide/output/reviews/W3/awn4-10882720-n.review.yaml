#   ١. مطابقة دفعية: فون براون، فيرنر فون براون، براون (+ صيغ ال-)
#   ٢. جسر إنجليزي: Braun, von Braun, Wernher, rocket engineer
#   ٣. بحث FTS عربي: صواريخ، مهندس صواريخ، قمر صناعي
