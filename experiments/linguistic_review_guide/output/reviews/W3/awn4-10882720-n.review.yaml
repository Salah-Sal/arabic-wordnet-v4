# فيرنر فون براون — Wernher von Braun
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تُعرِّف شخصاً تاريخياً بعينه (فيرنر فون براون 1912-1977)، وهو اسم علم أجنبي لا ينتمي إلى المفردات العربية الأصيلة، مما يجعل مسألة التوليد المصطلحي بالأساليب الاشتقاقية أو المجازية غير مجدية."
      - "الصنف النحوي المُسجَّل 'n' يبدو قاصراً؛ إذ ينبغي تصنيف أسماء الأعلام تحت 'proper_noun' لا اسم جنس."
      - "اللمّتان الموجودتان (فون براون، فيرنر فون براون) خاليتان من التشكيل الكامل الإلزامي."
      - "التعريف العربي الحالي يُغفل تفصيلاً مهماً وارداً في النص الإنجليزي: صمَّم صاروخ V-2 في ألمانيا الذي استُخدم ضد إنجلترا، وهو معلومة تاريخية جوهرية."
    observations: >
      هذه مجموعة ترادفية تخصّ اسم علم لشخصية تاريخية، وهي نوع خاص من المجموعات
      في الشبكة الدلالية. اللمّات المناسبة لها هي النقل الصوتي (التعريب) لأشكال الاسم
      المختلفة (الكامل والمختصر)، لا المصطلحات المشتقة. قاعدة البيانات المعجمية لا تحوي
      مدخلاً لهذه الشخصية بوصفها شخصاً بعينه؛ إذ جاءت نتائج البحث عن «براون» مقتصرةً
      على إجراءات طبية تحمل اسم براون آخرين (تشريح براون، خطاف براون)، وهي لا صلة
      لها بهذه المجموعة. الصواب أن تُحفظ لمّتان: الشكل المختصر المعهود (فون براون)
      والشكل الكامل (فيرنر فون براون)، مع إضافة التشكيل الكامل لكليهما.

  blind_candidates:
    - lemma: "بِرَاوْن"
      generation_method: taarib
      justification: >
        نقل صوتي لاسم العائلة (Braun) وحده، وهو أقصر أشكال الإحالة إلى هذه الشخصية
        في السياقات العلمية المختصرة.
    - lemma: "فُونْ بِرَاوْن"
      generation_method: taarib
      justification: >
        نقل صوتي لـ (von Braun) بحرف الجر النسبي الألماني «فون» مع اسم العائلة،
        وهو الشكل الأشيع في المراجع العربية الموسوعية والصحفية للإحالة إلى هذه الشخصية.
    - lemma: "فِيرْنَر فُونْ بِرَاوْن"
      generation_method: taarib
      justification: >
        نقل صوتي للاسم الكامل (Wernher von Braun)؛ يُستخدم في السياقات الرسمية
        والموسوعية حيث يُشترط ذكر الاسم الأول للتمييز.
    - lemma: "فِيرْنَر بِرَاوْن"
      generation_method: taarib
      justification: >
        نقل صوتي مُبسَّط يحذف حرف الجر الألماني «فون»، يرد أحياناً في المصادر
        العربية المعاصرة غير المتخصصة.


