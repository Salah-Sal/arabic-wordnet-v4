# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14456210-n
# dukedom: the dignity or rank or position of a duke
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «لقب الدوق» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل في اختبار التثبيت المعجمي"
      - "المجموعة تحتاج تمييزاً بين دلالة الرتبة/المنصب ودلالة الإقليم (duchy مقابل dukedom بمعنى rank)"
      - "اللمّة «دوقية» بدون تشكيل في المجموعة الحالية — يجب إضافة التشكيل الكامل"
    observations: "المفهوم يدلّ على الكرامة أو الرتبة أو المنصب المرتبط بلقب الدوق في النظام الإقطاعي الأوربي. كلمة «دوق» معرَّبة من اللاتينية Dux عبر الفرنسية، وقد أثبتها المعجم الوسيط والمعجم الكبير بوصفها أوّل مرتبة من مراتب الشرف عند الإفرنج. المصدر الصناعي «دُوقِيَّة» هو الشكل المعجمي المُثبت لكنه يحمل اشتراكاً لفظياً بين دلالتي الرتبة والإقليم. أمّا «لقب الدوق» فعبارة تفسيرية لا تصلح لمّةً معجمية."

  blind_candidates:
    - lemma: "دُوقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «دُوق» بإضافة ياء النسبة وتاء التأنيث، على نمط «ملكية» و«أميرية» و«إمبراطورية»، للدلالة على المنصب أو الرتبة"
    - lemma: "مَقَامُ الدُّوقِ"
      generation_method: tarkib
      justification: "تركيب إضافي يفيد المكانة والمنزلة، فـ«المقام» يدلّ على الرتبة والمنزلة دون تكرار ألفاظ التعريف"
    - lemma: "إِمَارَةُ الدُّوقِ"
      generation_method: tarkib
      justification: "تركيب إضافي يستعمل «إمارة» بمعنى الولاية والسلطة، للدلالة على مقام الدوق الشرفي"
    - lemma: "دُوقَنَة"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن فَعْلَنَة من «دُوق» للدلالة على المصدر المجرد، على نمط «قَرْصَنَة» و«بَرْمَجَة»"


stage2_evidence:
  per_lemma:
    - lemma: "دُوقِيَّة"
      confirm:
        - text: "«الدُّوقيّة: «أ» مقاطعة يحكمها دوق. «ب» منصب الدوق.»"
          source: "المورد الحديث (2008)"
        - text: "«dukedom — duché; dignité de duc»"
          source: "مسرد الجغرافيا والتاريخ (ALECSO/ArabTerm)"
      expands:
        - text: "«(الدوقية) ولَايَة صَغِيرَة أميرها دوق (مَعَ)»"
          source: "المعجم الوسيط"
          addition: "دلالة إقليمية إضافية: الدوقية تُطلق أيضاً على الولاية التي يحكمها الدوق"
        - text: "«ولايةٌ صغيرة عند الإفرنج, أميرُها دُوق / اسمُ عُمْلةٍ ذهبيَّةٍ فى إسبانيا»"
          source: "المعجم الكبير"
          addition: "دلالتان إضافيتان: الولاية الصغيرة، واسم عملة ذهبية إسبانية"

    - lemma: "لَقَبُ الدُّوقِ"
      evidence_status: "no_material_found"

    - lemma: "مَقَامُ الدُّوقِ"
      evidence_status: "no_material_found"

    - lemma: "إِمَارَةُ الدُّوقِ"
      evidence_status: "no_material_found"

    - lemma: "دُوقَنَة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "دُوقِيَّة"
      decision: confirmed
      decision_reason: "مصطلح معجمي مُثبت في المعجم الوسيط والمعجم الكبير والمورد الحديث ومسرد ALECSO. المورد الحديث ينصّ صراحةً على دلالة «منصب الدوق» (المعنى ب) إلى جانب دلالة الإقليم. الترجمة الفرنسية «dignité de duc» تؤكد مطابقة دلالة الرتبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المعجمي الرسمي المسكوك الذي يجمع بين دلالتي المنصب والإقليم، وهو الشكل الوحيد المُثبت معجمياً في هذه المجموعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُوقِيَّة"

    - lemma: "لَقَبُ الدُّوقِ"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست وحدة معجمية مُثبتة. تفشل في اختبار السكّ: يمكن إبدال «لقب» بـ«رتبة» أو «منصب» أو «مقام» وتبقى صالحة كوصف حرّ. لم تُوجد في أيّ معجم بوصفها مدخلاً مستقلاً. كذلك «اللقب» يدلّ على الاسم الشرفي لا على الرتبة أو الكرامة ذاتها، فهو أضيق من المفهوم المطلوب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مَقَامُ الدُّوقِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب إضافي وصفي حرّ غير مُثبت معجمياً. يفشل في اختبار التثبيت المعجمي — لا أدلة على استعماله بوصفه مصطلحاً مسكوكاً. كما يفشل في اختبار السكّ: يمكن إبدال «مقام» بمرادفات عديدة."

    - lemma: "إِمَارَةُ الدُّوقِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب إضافي غير مُثبت، و«إمارة» تخلط بين نظام الإمارة العربي ونظام الدوقية الأوربي، فالإمارة رتبة مستقلة غير مرادفة للدوقية في التراتبية الإقطاعية."

    - lemma: "دُوقَنَة"
      source: stage1
      decision: removed
      decision_reason: "اشتقاق مُستحدث لا شاهد له في أيّ معجم. وزن فَعْلَنَة يصلح للأفعال المُحدثة لا للرتب والمناصب. والمصدر الصناعي «دوقيّة» أشيع وأثبت."


stage4_content:
  definition:
    current: "كرامة أو رتبة أو منصب الدوق"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية شبه مباشرة للتعريف الإنجليزي «the dignity or rank or position of a duke». يحتاج صياغة معجمية عربية أصيلة تبيّن الجنس القريب (مرتبة شرفية) والفصل النوعي (خاصة بنظام الإقطاع الأوربي)."
    authored:
      - type: terminological
        text: "مرتبةٌ شرفيّةٌ هي الأولى في مراتب النُّبلاء عند الأوربّيّين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "أعلى مراتب الشَّرف في النظام الإقطاعيّ الأوربّيّ، يحملها الدُّوق ومَن يليه مِن ذُرّيّته، وتتضمّن حقوقاً وامتيازات تتفاوت بحسب التقاليد الملَكيّة في كلّ بلد."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مرتبةٌ شرفيّةٌ هي الأولى في مراتب النُّبلاء عند الأوربّيّين."

  examples:
    per_lemma:
      - lemma: "دُوقِيَّة"
        examples:
          - text: "مُنِحَ القائدُ العسكريُّ الدُّوقِيَّةَ تقديراً لانتصاراته في حروب المملكة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "مُنِحَ القائدُ العسكريُّ الدُّوقِيَّةَ تقديراً لانتصاراته في حروب المملكة."


