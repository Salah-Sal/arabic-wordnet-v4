# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:

  # التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "صانع قبعات عبارة وصفية شفّافة لا تجتاز اختبار التثبيت المعجمي (يمكن إبدال «قبعات» بأي منتوج آخر)"
      - "غياب التمييز بين hatmaker/hatter (عام) وmilliner/modiste (متخصص في أغطية رأس النساء)"
      - "الاقتصار على لمّة واحدة مُعجَمية حقيقية (قبعاتي) مقابل واصفة (صانع قبعات)"
    observations: >
      المجموعة تُغطّي مفهوم المُحترف في صنع القبعات وبيعها. يُفرّق المعجم الإنجليزي بين
      hatmaker/hatter (عام) وmilliner/modiste (مختصّ بقبعات النساء وتصميمها)، لكنّ التعريف
      العربي الحالي يُدرجهما معًا دون تمييز. «قبعاتي» مصطلح حِرَفِيّ اشتقاقي ناضج على
      غرار «ساعاتي» و«قباقيبي» ويستحق التبقية والتشكيل. أما «صانع قبعات» فعبارة وصفية
      إنتاجية لا تُعدّ وحدة معجمية مُثبَّتة. أصل القُبَّعة في المعجم العربي يرتبط بفعل
      «قَبَعَ» (الاختباء/تغطية الرأس)، وقد اكتسبت الكلمة طابع الحداثة في استخدامها الراهن.

  # المرشحات الأعمى — من التعريف وحده (قبل الاطلاع على اللمّات)
  blind_candidates:
    - lemma: "قَبَّاعٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر قبع على وزن فَعَّال الدالّ على احتراف الحرفة ومزاولتها؛ كما في «نجّار»
        و«حدّاد». القُبَّعة غطاء الرأس، فالقبّاع من يصنع القُبَّعات ويبيعها بحكم مهنته.
    - lemma: "قَلانِسِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى القَلَانِس (جمع قَلَنْسُوَة)، وهي أغطية الرأس في التراث العربي الكلاسيكي.
        صيغة النسبة المُضافة إلى الجمع التكسيري مسموعة في العربية للدلالة على الحِرَف
        (كالأثاثيّ إلى الأثاث). يدلّ على صانع أغطية الرأس التقليدية.
    - lemma: "شَاشِيٌّ"
      generation_method: majaz
      justification: >
        من شَاشِيَّة (غطاء رأس رقيق)؛ نسبة على وزن فَعَّال→فَعْلِيّ للحِرَف. يُستخدم في
        بعض اللهجات للدلالة على بائع أغطية الرأس، فيه إحياء للاستخدام الوظيفي مع تجنّب
        الاشتراك اللفظي مع قُبَّعة الحديثة.
    - lemma: "صانِعُ القَلَانِسِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «صانع» (مشتق الفعل صنع) و«القلانس» (جمع قلنسوة، غطاء الرأس العربي
        الكلاسيكي). يُجسّر بين الدلالة الحرفية العربية الأصيلة ومفهوم صانع القبعات الحديث،
        ويُشير إلى وجود هذه الحرفة في التاريخ العربي الإسلامي.


