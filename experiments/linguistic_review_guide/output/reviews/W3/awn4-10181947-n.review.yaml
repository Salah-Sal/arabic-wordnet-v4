# ── المرحلة ٣: التحليل اللغوي ─────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "صانع قبعات"
      decision: removed
      decision_reason: >
        عبارة وصفية إنتاجية لا تجتاز اختبار التثبيت المعجمي: يمكن إبدال «قبعات» بـ«سيارات»
        أو «أحذية» أو «ساعات» وتبقى الصياغة صالحة كوصف لأي حِرفة مماثلة. أثبتت
        ARABTERM وجود النمط «صانع + المنتوج» كتعبير إنتاجي لا كوحدة معجمية مُسكَّة.
        يُغني عنها «قبعاتي» التي هي المصطلح الاشتقاقي المُثبَّت في المعجم. الإبقاء على
        الصياغة الوصفية إلى جانب المصطلح الاشتقاقي يُخلّ بمبدأ عدم الترادف المطلق
        دون فائدة دلالية مُضافة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قبعاتي"
      decision: confirmed
      decision_reason: >
        موثَّق توثيقًا قاطعًا في المورد الحديث (2008) بإدخالين مستقلّين: أحدهما مقابل
        hatmaker والآخر مقابل hatter، مما يُثبت أن المعجم العربي الحديث اعتمده مصطلحًا
        مُستقلًّا. يتبع نمط الصياغة الحِرَفِيّة العربية المُنتِجة (قُبَّعة → قُبَّعات →
        قُبَّعاتيّ) على غرار «ساعاتي» (ساعة→ساعاتيّ) و«قباقيبي» (قبقاب→قباقيبيّ).
        يجتاز جميع مقاييس الجودة الستة: شائع في السياق الفصيح الحديث، سهل التداول،
        مُلائم، عربي اشتقاقي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الاشتقاقي الوحيد المُعجَّم للمجموعة. يحمل دلالة الاحتراف الدائم (صاحب
        الحِرفة) لا مجرد القيام بالفعل مرة، على خلاف الصياغات الوصفية المؤقتة.
        يُغطّي ثلاثة أوجه للمهنة: الصنع والبيع والإصلاح (كما في المورد)، أشمل من
        التعريف الحالي الذي يقتصر على الصنع والبيع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُبَّعَاتِيٌّ"

    # مرشحات المرحلة ١ — جميعها مرفوضة
    - lemma: "قَبَّاعٌ"
      source: stage1
      decision: removed
      decision_reason: >
        يتعارض مع المعجم: القُبَاع (بتخفيف الباء) يدلّ على القنفذ والمكيال لا على صانع
        القبعات. حتى لو بُني قَبَّاع على فَعَّال فلا شاهد معجمي يُثبته بهذا المعنى، وفيه
        التباس مع القُبَاع الموثَّق. مرفوض لتعارضه الدلالي وانعدام التثبيت المعجمي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "قَلانِسِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي على هذا الاشتقاق. القَلَانِس موثَّقة جمعًا للقلنسوة لكنّ النسبة
        إليها بمعنى الحِرفة غير مُقيَّدة في أيٍّ من المصادر المُستعلَمة. إضافةً إلى ذلك،
        القلنسوة في المعجم الحديث مصطلح تخصصي (تشريح، طب، نبات) بعيد عن القبعة المقصودة.
      evidence_assessment:
        case: no_material

    - lemma: "شَاشِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        شاشيّ في المعجم الكبير نسبةٌ إلى مدينة شاش (تشقند)، وليس حِرفةً تخصّ صانع
        أغطية الرأس. الاستخدام اللهجي المحدود لا يُقيَّد في معاجم الفصحى المعتمَدة.
        مرفوض لتعارضه الصريح مع المعجم الفصيح.
      evidence_assessment:
        case: contradicts_only

    - lemma: "صانِعُ القَلَانِسِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد على تثبيته وحدةً معجميةً. يخفق في اختبار التثبيت: يمكن إبدال «القلانس»
        بـ«القبعات» أو «العمائم» وتبقى الصياغة صالحة كوصف → ليس مصطلحًا مُسكَّكًا.
        إضافةً إلى ذلك، لم يَرِد هذا المركب في أيٍّ من قواعد البيانات المُستعلَمة.
      evidence_assessment:
        case: no_material


