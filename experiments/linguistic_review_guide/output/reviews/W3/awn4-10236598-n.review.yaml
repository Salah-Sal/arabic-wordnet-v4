# definition: شخص يصنع أدوات من الحديد (a person who makes articles of iron)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «عامل حديد» عبارةٌ وصفية حرة وليست مصطلحاً مسكوكاً؛ تفشل اختبار التثبيت المعجمي (يمكن إبدال «عامل» بـ«صانع» أو «حديد» بـ«نحاس» وتبقى صالحةً وصفاً)"
      - "اللمّتان خاليتان من التشكيل الكامل في السجل الحالي"
      - "المجموعة تفتقر إلى اللفظ الفصيح الكلاسيكي الأصيل «القَيْن» الذي هو الجذر الأقدم لهذا المعنى"
    observations: >
      المجموعة تصف حِرفةً من أعرق الحِرَف في الحضارة العربية؛ وللحدّاد/القَيْن حضور واسع في التراث الشعري
      والفقهي والمعجمي. اللمّة الرئيسية «حداد» صحيحةٌ ومؤكدة لكنها تحتاج تشكيلاً كاملاً. أما «عامل حديد»
      فتعبير إضافي حرّ يُقابَل بنظائره في كل لغة دون أن يُشكّل مصطلحاً ثابتاً في أي معجم عربي معتمد.
      اللفظ الكلاسيكي «قَيْن» غائبٌ عن المجموعة رغم توثيقه في جميع المعاجم الأساسية.
  blind_candidates:
    - lemma: "حَدَّادٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن فَعَّال الدال على الاحتراف والمداومة، من الجذر ح-د-د (حَدِيد).
        وزن فَعَّال منتج للمهن الحرفية (نَجَّار، خَبَّاز، نَقَّار)؛ والحَدَّاد هو المحترف الذي يعالج الحديد
        حِميةً وطَرقاً وتشكيلاً.
    - lemma: "قَيْنٌ"
      generation_method: majaz
      justification: >
        إحياء للّفظ العربي القديم الأصيل الدال على الحداد؛ مجاز عبر الإزاحة الدلالية من المعنى الأشمل
        (كل صانع) إلى المعنى الأخص (صانع الحديد). إحياؤه يُجنّب الاشتراك اللفظي مع الألفاظ الحية
        ويُرسّخ الصلة بالتراث.
    - lemma: "صَانِعُ الْحَدِيدِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي مباشر (صانع + الحديد) للدلالة على من يصنع من الحديد. غير أن هذا التركيب
        قابل للإبدال الحر مما يُضعف تثبيته كمصطلح.
    - lemma: "عَامِلُ الْحَدِيدِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من عامل + الحديد، يُقابل "iron worker" الإنجليزية مباشرةً.
        قريب دلالياً من اللمّة الموجودة «عامل حديد» وإن اختلف في تعريف المضاف إليه.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دُفعية: حداد/الحداد, قين/القين, عامل حديد/الحداد.
#   Q2 — الجسر الإنجليزي: ironworker, iron worker, blacksmith, ironsmith, smith, ironmonger
#   Q3 — FTS عربي: "حداد" OR "حديد" OR "صانع حديد"
#   Q4 — إثراء بالأمثلة للمداخل: 5207, 75504, 24495, 102400
#   Q5 — مقاييس اللغة: جذر حدد (dictionary hawramani, entry 985810) + قين (entry 988407)
stage2_evidence:
  per_lemma:
    - lemma: "حداد"
      confirm:
        - text: "«صانع يحمى الحديد ويطرقه لتشكيله بحسب الشكل المطلوب»"
          source: "المعجم الوسيط (OCR)"
        - text: "«مَنْ يُعالِجُ الحَدِيدَ، فيُحْمِيه ويَطْرُقُه لَتَشْكيله حسب الشَّكْلِ المَطْلُوب»"
          source: "المعجم الكبير (OCR)"
        - text: "«صانع يحمي الْحَدِيد ويطرقه لتشكيله بِحَسب الشكل الْمَطْلُوب (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«الحَدَّاد: حارس السجن وأيضاً معالج الحديد ويطلق على البَّواب»"
          source: "التعريفات الفقهية للبركتي (Hawramani)"
        - text: "«من يحترف صنعة طرق الحديد وتشكيله، وبائع الحديد، والسجان، والبواب»"
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani)"
        - text: "«الحدّاد.» (ترجمة: blacksmith / ironsmith)"
          source: "المورد الحديث (ARABTERM)"
        - text: "«حدّاد» (ترجمة: smith، domain: Geography and History)"
          source: "مسرد الجغرافيا والتاريخ - ALECSO (ARABTERM)"
      expands:
        - text: "«وَيُقَالُ لِلْبَوَّابِ حَدَّادٌ، لِمَنْعِهِ النَّاسَ مِنَ الدُّخُولِ»"
          source: "مقاييس اللغة لابن فارس (Hawramani)"
          addition: "يكشف عن الأصل الاشتقاقي للكلمة من الحَدّ بمعنى المنع، وأن الدلالة على صانع الحديد دلالة مجازية لاحقة"
        - text: "«وبائع الحديد والبواب والسجان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          addition: "تعدد دلالات الكلمة الثانوية: البائع والبواب والسجان، وكلها تمتد من أصل الحدّ/المنع"
        - text: "«مرفوضة لعدم ورودها في المعاجم القديمة» ثم يتبعه: «الرأي: مرفوضة — السبب: لعدم ورودها في المعاجم القديمة. المعنى: من يحمي الحديد»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (Hawramani)"
          addition: "يُشير إلى أن الكلمة تعرّضت للطعن في القِدَم لكنها مقبولة في المعاجم المعيارية الحديثة كالوسيط والكبير"

    - lemma: "عامل حديد"
      evidence_status: "no_material_found"

    - lemma: "قَيْن"
      confirm:
        - text: "«الحَدَّاد, ثم أطلق على كل صانع — العبدُ»"
          source: "المعجم الوسيط (OCR)"
        - text: "«القَين: الحدَّادُ ثم صار لكل صانع عند العرب وقيل: الذي يصلح الأسنَّة، العبدُ جمعه قِيان»"
          source: "التعريفات الفقهية للبركتي (Hawramani)"
        - text: "«(الْقَيْن) الْحداد ثمَّ أطلق على كل صانع (ج) أقيان وقيون وَالْعَبْد (ج) قيان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«القَيْنُ: الحَدَّادُ، وقيل: كل صانع قَيْنٌ، والجمع أَقْيانٌ وقُيُونٌ»"
          source: "لسان العرب لابن منظور (Hawramani)"
        - text: "«الْقَيْنُ الْحَدَّادُ وَيُطْلَقُ عَلَى كُلِّ صَانِعٍ وَالْجَمْعُ قُيُونٌ»"
          source: "المصباح المنير للفيّومي (Hawramani)"
        - text: "«(ق ي ن) الْقَيْن: الْحداد. وَقيل: كل صانع: قين. وَالْجمع: أقيان، وقيون. وقان يَقِين قيانة: صَار قينا. وقان الحديدة قينا»"
          source: "المحكم والمحيط الأعظم لابن سيده (Hawramani)"
        - text: "«[قين] القَيْنُ: الحدَّاد، والجمع القيونُ. ابن السكيت: يقال للحداد ما كان قينا، ولقد قان يقين قينا»"
          source: "تاج اللغة وصحاح العربية للجوهري (Hawramani)"
        - text: "«الحداد لأنه يصلح الأشياء — العبد — عظم الساق»"
          source: "مقاييس اللغة (OCR)"
      expands:
        - text: "«(قَيَنَ) الْقَافُ وَالْيَاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِصْلَاحٍ وَتَزْيِينٍ. مِنْ ذَلِكَ الْقَيْنُ: الْحَدَّادُ»"
          source: "مقاييس اللغة لابن فارس (Hawramani)"
          addition: "يربط ابن فارس الجذر بمعنى الإصلاح والتزيين، وهو أصل جامع يشمل الحداد (يُصلح الحديد) والماشطة (تُزيّن)"
        - text: "«قَانَ القَيْنُ الحدِيدَ يَقِينُه قَيْناً: عَمِلَهُ وسَوَّاهُ»"
          source: "تاج العروس لمرتضى الزبيدي (Hawramani)"
          addition: "يُثبت الفعل المشتق قانَ/يَقِينُ قَيناً بمعنى عمل الحديد وصنعه"
        - text: "«ولى كبد مقروحة قد بدا بها / صدوع الهوى لو كان قين يقينها»"
          source: "مقاييس اللغة (OCR) — شاهد شعري"
          addition: "استعمال مجازي: القَيْن يُصلح الجروح كما يُصلح الحديد"

    - lemma: "صَانِعُ الْحَدِيدِ"
      evidence_status: "no_material_found"

    - lemma: "عَامِلُ الْحَدِيدِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى: حداد (موجودة) ──
    - lemma: "حداد"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة توثيقاً واسعاً في جميع المعاجم الكلاسيكية والحديثة. هي المصطلح المعياري
        الفصيح الدارج لصانع الحديد. تحتاج إضافة التشكيل الكامل: حَدَّاد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check: >
        وزن فَعَّال على جذر ح-د-د، صحيح سليم للمهن الحرفية. الوزن يناسب الدلالة تماماً.
      borrowing_check:
        type: native
        note: "كلمة عربية أصيلة، لا اقتراض"
      quality_gate:
        ittiraad: "متّرد وشائع في الفصحى المعاصرة"
        yusr: "سهل النطق والتداول"
        mulaama: "ملائم تماماً"
        turaathi: "موثّق في المعاجم الكلاسيكية"
        arabi: "عربي أصيل"
        ishtiqaaqiyya: "قابل للاشتقاق (حِدَادَة، حَدَّادِيّ)"
      nuance_differentiation: >
        المصطلح المعياري الحديث الدارج في الفصحى المعاصرة والصحافة والتعليم؛ يُشير تحديداً
        إلى الحرفي الذي يُحمي الحديد ويطرقه لتشكيله. أكثر تخصصاً وشيوعاً في السياق المهني الحديث
        مقارنةً بـ«قَيْن» الذي يحمل دلالة كلاسيكية أشمل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَدَّاد"

    # ── اللمّة الثانية: عامل حديد (موجودة) ──
    - lemma: "عامل حديد"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا تُعدّ مصطلحاً مسكوكاً: (أ) لم تُسجَّل في أي معجم عربي كمداخل ثابتة.
        (ب) تفشل اختبار السكّ: «صانع حديد» و«عامل نحاس» وصفان صالحان بإبدال مكوّن واحد،
        مما يثبت أنها ليست وحدة معجمية مثبّتة. (ج) هي ترجمة حرفية عمياء لـ"iron worker"
        دون تمثّل الأسلوب العربي. اللمّة الصحيحة لهذا المفهوم في العربية هي «حَدَّاد».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── المرشح قَيْن (مرحلة ١) ──
    - lemma: "قَيْنٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        اللفظ الفصيح الكلاسيكي الأصيل للحداد؛ موثّق في أمهات المعاجم: الصحاح، واللسان، والمصباح،
        والمحكم، وتاج العروس، ومقاييس اللغة. ابن فارس يربطه بالإصلاح والتزيين. ورد في الشعر الجاهلي
        وشواهد الحديث النبوي. إضافته تُثري المجموعة بالبُعد التراثي وتُكمل الصورة المعجمية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check: >
        وزن فَعْل (قَيْن) على جذر ق-ي-ن. وزن قياسي للأسماء الجامدة الدالة على الحِرَف.
      borrowing_check:
        type: native
        note: "عربي أصيل قديم"
      quality_gate:
        ittiraad: "مطّرد في الفصحى الكلاسيكية"
        yusr: "سهل النطق، قصير"
        mulaama: "ملائم ودقيق"
        turaathi: "من أعرق ألفاظ الحِرَف في التراث العربي"
        arabi: "عربي أصيل"
        ishtiqaaqiyya: "قابل للاشتقاق (قَيَنَ، قِيَانَة، قُيُون)"
      nuance_differentiation: >
        اللفظ التراثي الأقدم عهداً؛ كان في الأصل خاصاً بصانع الحديد ثم امتدّ ليشمل كل صانع.
        يحمل ظلالاً أثرية وأدبية غنية (ورد في الشعر الجاهلي ونصوص الحديث). يختلف عن «حَدَّاد»
        في كونه أوسع نطاقاً دلالياً تاريخياً وأكثر حضوراً في السياقات الأدبية الكلاسيكية.
      actions:
        - command: create_entry
          params:
            lemma: "قَيْن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10236598-n"

    # ── المرشح صانع الحديد (مرحلة ١) ──
    - lemma: "صَانِعُ الْحَدِيدِ"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تفشل اختبار السكّ والتثبيت المعجمي؛ لا أدلة معجمية على تثبيتها
        وحدةً اصطلاحية، ولا تزيد على وصف «عامل حديد» المرفوض.

    # ── المرشح عامل الحديد (مرحلة ١) ──
    - lemma: "عَامِلُ الْحَدِيدِ"
      source: stage1
      decision: removed
      decision_reason: >
        نظيرة للمّة الموجودة «عامل حديد» المرفوضة؛ عبارة وصفية حرة بلا تثبيت معجمي،
        ولا تختلف عنها إلا في تعريف المضاف إليه.


