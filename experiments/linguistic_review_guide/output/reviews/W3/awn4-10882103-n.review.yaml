      decision_reason: >
        الصيغة الثنائية الكاملة (اسم أول + اسم عائلة) وهي الشكل المعياري للتعريف
        بالشخصية في السياقات الأكاديمية والموسوعية عند الإشارة الأولى. تعبير
        مركب من نوع إضافي (proper-noun compound). تحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
