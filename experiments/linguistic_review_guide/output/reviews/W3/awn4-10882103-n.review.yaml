# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان الموجودتان (برامانتي / دوناتو برامانتي) خاليتان من التشكيل الكامل المطلوب."
      - "غياب الصيغة الثلاثية الكاملة للاسم (دوناتو دَانْيُولُو بِرَامَانْتِي) التي تقابل الصيغة الإنجليزية الثالثة Donato d'Agnolo Bramante."
      - "التعريف الحالي يُطلق على المعماري لقب 'معماري' وهو صفة، والأدق 'مهندس معماري' لأنه الاسم المعجمي للمهنة."
      - "المجموعة تفتقر إلى أمثلة استعمالية."
    observations: >
      هذه المجموعة تمثّل اسم علم لشخصية تاريخية إيطالية، وهي دُونَاتُو بِرَامَانْتِي
      (1444-1514)، أحد أبرز المهندسين المعماريين في عصر النهضة العليا وصاحب التصميم
      الأصلي لكاتدرائية القديس بطرس في روما. لا تنطبق على الأسماء الأعلام قواعد
      التوليد الاشتقاقي أو المجازي؛ إذ ينحصر السبيل الوحيد في التعريب (تعريب الاسم
      الأجنبي). يجب أن تُمثَّل أشكال الاسم الثلاثة المعروفة في اللمّات العربية، مع
      توفير التشكيل الكامل لجميعها. الاشتمال على الاسم الأجنبي ذي الفصيل
      (دَانْيُولُو = d'Agnolo) ضروري لاستيفاء التمثيل المعجمي.

  # ── التوليد الأعمى (قبل الاطلاع على اللمّات الموجودة) ──
  blind_candidates:
    - lemma: "بِرَامَانْتِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الإيطالي Bramante بصوتنة عربية: الكتلة الصوتية br- تُنطق بكسرة
        تيسيراً (بِرَ)، والمقطع -man- يُعرَّب بألف المد (مَانْ)، والنهاية -te تُعرَّب
        ياءً (تِي). هذه الصيغة هي الأشيع في المصادر العربية والموسوعات.
    - lemma: "دُونَاتُو بِرَامَانْتِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الثنائي Donato Bramante — اسم أوّل (دُونَاتُو) واسم عائلة
        (بِرَامَانْتِي) — وهو الصيغة المعيارية للتعريف بالشخصية في الكتابة العربية
        عند الذكر الأول أو في السياقات الرسمية.
    - lemma: "دُونَاتُو دَانْيُولُو بِرَامَانْتِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الثلاثي الكامل Donato d'Agnolo Bramante — يُدرَج لاستيفاء التمثيل
        المعجمي الشامل وتمكين البحث في الفهارس الأكاديمية والموسوعية التي تعتمد الاسم
        الكامل. d'Agnolo (= ابن أنيولو) يُعرَّب دَانْيُولُو أو دَأَنْيُولُو.
    - lemma: "دُونَاتُو دَأَنْيُولُو"
      generation_method: taarib
      justification: >
        صيغة مختصرة تضم الاسم الأول والفصيل (d'Agnolo) دون اسم العائلة؛ وُلِّدت بوصفها
        احتمالاً ثالثاً محتملاً إلا أنها ستُحذف في مرحلة التحليل لكونها اسماً ناقصاً
        لا يُعرِّف الشخصية بصورة مستقلة.


