    # ── مرشح المرحلة ١: أَغْنِيس دِيمِيل ──
    - lemma: "أَغْنِيس دِيمِيل"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة غير موحَّدة (دمج مكوّنَي الكنية بدون مسافة)؛ هي مجرد تهجئة بديلة
        غير معيارية للمّة المؤكدة «أَغْنِيس دِي مِيل» وليست صيغة مستقلة راسخة
        في المصادر العربية المعتمدة. لا إجراء مطلوب.


