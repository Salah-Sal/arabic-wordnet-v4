# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان «أغنيس دي ميل» و«دي ميل» تفتقران إلى التشكيل الكامل"
      - "لمّة «دي ميل» وحدها مبهمة: الكنية «de Mille» مشتركة بين أغنيس دي ميل وسيسيل ب. دي ميل (المخرج السينمائي) في الاستخدام العربي الشائع، مما يستوجب توفير السياق دائماً"
      - "الاسم الثلاثي الكامل «Agnes George de Mille» المذكور في lemmas_en غائب عن اللمّات العربية، وهو ضروري للتمييز التوثيقي"
      - "المجموعة تمثّل عَلَماً شخصياً أجنبياً — لا توجد أدلة معجمية عربية متوقعة لمثل هذه الأعلام"
    observations: >
      هذه المجموعة خاصة بشخصية تاريخية بعينها هي أغنيس جورج دي ميل (1905-1993)،
      راقصة ومصممة رقصات أمريكية بارزة اشتُهرت بإدخال الرقص الكلاسيكي الاحترافي على
      مسارح برودواي وتقديمه للجمهور الواسع (لا سيما عبر مسرحية «أوكلاهوما!» 1943).
      جميع اللمّات تعريبات صوتية للاسم الأجنبي، وليست مصطلحات مشتقة من جذور عربية.
      لا يُرتقب وجود أدلة معجمية عربية كلاسيكية أو حديثة لهذا الاسم العَلَم تحديداً.
      التحدي الوحيد هو اختيار الضبط الصوتي الأمثل، وتغطية صيغ الاسم المختلفة
      (كامل / ثلاثي / مختصر)، مع تجنب الالتباس بأعلام أخرى تحمل الكنية ذاتها.
  blind_candidates:
    - lemma: "أَغْنِيس دِي مِيل"
      generation_method: taarib
      justification: "تعريب صوتي للاسم الكامل (الاسم الأول + الكنية) وفق النطق الإنجليزي المعتمد — الصيغة الأكثر شيوعاً في المصادر العربية الموسوعية"
    - lemma: "أَغْنِيس جُورْج دِي مِيل"
      generation_method: taarib
      justification: "تعريب للاسم الرسمي الثلاثي الكامل — ضروري للتمييز من أفراد آخرين يحملون الكنية ذاتها، وللاستخدام في السياقات التوثيقية الرسمية"
    - lemma: "دِي مِيل"
      generation_method: taarib
      justification: "تعريب الكنية منفردةً للإشارة المختصرة، وهي صيغة شائعة في المراجع العربية بعد ذكر الاسم الكامل"
    - lemma: "أَغْنِيس دِيمِيل"
      generation_method: taarib
      justification: "صيغة بديلة مدمجة (بدون مسافة بين مكوّني الكنية) تظهر أحياناً في بعض المصادر العربية غير الموحَّدة"


