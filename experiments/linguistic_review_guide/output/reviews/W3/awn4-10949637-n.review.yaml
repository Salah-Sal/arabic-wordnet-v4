      decision: confirmed
      decision_reason: >
        تعريب صوتي صحيح للاسم الكامل (الاسم الأول + الكنية)؛ هي اللمّة الرئيسية الأكثر
        شيوعاً في المصادر العربية. اجتازت اختبار الاطّراد الصوتي. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
