      nuance_differentiation: >
        الاسم الكامل المؤلَّف من الاسم الأول والكنية؛ يستخدم عند الإشارة الأولى للشخصية
        في المقالات والموسوعات، ويحدّد الهوية بلا لبس دون الحاجة إلى سياق إضافي
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَغْنِيس دِي مِيل"

    # ── لمّة موجودة: دي ميل ──
    - lemma: "دي ميل"
      decision: confirmed
      decision_reason: >
        الكنية منفردةً هي صيغة مشروعة للإشارة المختصرة بعد التعريف الأول،
        وتتوافق مع lemmas_en ("de Mille"). الالتباس مع سيسيل ب. دي ميل مقبول على
        مستوى اللمّة لأن السياق الموسوعي (synset) يحسمه. تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
      nuance_differentiation: >
        الكنية وحدها؛ تستخدم للإشارة المختصرة في النص الواحد بعد ورود الاسم الكامل،
        وفي العناوين والمصادر المختصرة؛ أضيق دلالةً من الاسم الكامل وتتطلب سياقاً
        لتجنب التباسها بالمخرج السينمائي الذي يشاركها الكنية
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دِي مِيل"

    # ── مرشح المرحلة ١: أَغْنِيس جُورْج دِي مِيل ──
    - lemma: "أَغْنِيس جُورْج دِي مِيل"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الثلاثي الكامل مذكور صراحةً في lemmas_en كـ «Agnes George de Mille».
        يجب إضافته لاكتمال المجموعة، ولتوفير صيغة التعيين الكامل اللازمة في التوثيق
        الأكاديمي والقانوني. اجتاز اختبار الاطّراد الصوتي وليس تكراراً بل صيغة مستقلة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
      nuance_differentiation: >
        الاسم الرسمي الثلاثي الكامل (الاسم الأول + الاسم الأوسط + الكنية)؛ يستخدم في
        السياقات الأكاديمية والتوثيقية الرسمية حيث يُشترط التعيين الكامل الدقيق للشخصية
      actions:
