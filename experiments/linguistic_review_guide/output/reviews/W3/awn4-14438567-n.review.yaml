# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14438567-n
# loneliness / solitariness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«شعور بالوحدة» عبارة وصفية حرة (شعور + بـ + الوحدة) وليست وحدة معجمية ثابتة؛ تنجح في اختبار الإبدال (إحساس بالوحدة) فتفشل في اختبار السَّكّ"
      - "«وحدة» شديدة الاشتراك اللفظي: وَحْدة (انفراد) ووِحْدة (وحدة قياس/اتحاد سياسي)؛ تحتاج إلى تمييز بالتشكيل"
      - "غياب اللمّة الأصيلة «وَحْشَة» التي هي أدق تعبير عربي عن الانفراد المصحوب بالاستيحاش"
    observations: "المجموعة تدل على حالة الانفراد في عُزلة، وهي فرع من مفهوم العزلة/الانعزال (المجموعة الأم). في العربية الفصيحة يُعبَّر عن هذا المفهوم بألفاظ متعددة تتدرج من الوصف المحايد للانفراد (وَحْدَة) إلى الشعور النفسي بالقفر والاستيحاش (وَحْشَة). التعريف الحالي مقبول لكنه يستخدم «عزلة» وهي لمّة المجموعة الأم مما يُحدث شبه دوران."

  blind_candidates:
    - lemma: "وَحْشَة"
      generation_method: ishtiqaq
      justification: "من الجذر و-ح-ش على وزن فَعْلة، دالة على حالة الانفراد والاستيحاش من الناس. المعاجم الكلاسيكية تُعرِّفها بالانقطاع وبُعد القلوب عن المودات."
    - lemma: "اسْتِيحَاش"
      generation_method: ishtiqaq
      justification: "مصدر استوحش (استفعال من و-ح-ش)، يدل على طلب الوحشة أو الشعور بها. يُستعمل في النثر الأدبي للتعبير عن النفور من الخلوة."
    - lemma: "تَوَحُّد"
      generation_method: ishtiqaq
      justification: "مصدر توحَّد (تَفَعُّل من و-ح-د)، يدل على بقاء المرء مفرداً. لكنه في الاستعمال المعاصر ارتبط بمصطلح التوحُّد (autism)."
    - lemma: "خَلْوَة"
      generation_method: ishtiqaq
      justification: "من الجذر خ-ل-و على وزن فَعْلة، تدل على مكان الانفراد بالنفس. لكنها أقرب إلى الاعتكاف الإرادي منها إلى حالة الانفراد القسري."

# ═══════════════════════════════════════════════════════════════
stage2_evidence:
  per_lemma:
    - lemma: "شُعُور بِالوَحْدَة"
      evidence_status: "no_material_found"

    - lemma: "وَحْدَة"
      confirm:
        - text: "«وَحْدَة: الإنفراد، والاتحاد.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(الْوَاوُ وَالْحَاءُ وَالدَّالُ): أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ. مِنْ ذَلِكَ الْوَحْدَةِ.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الوحدة: الانفراد»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«المربعة (في الرياضة والهندسة): مربَّع طُولُ أَحد أَضلاعه وحدة من وَحَدات القياس الطُّولِي... (في النظام السياسي): اتِّحَاد أُمتين أَو أَكثر»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال الغالب المعاصر للفظ «وَحْدة» هو وحدة القياس أو الاتحاد السياسي، لا الانفراد"
      expands:
        - text: "«وِحْدَة: الكلمة هنا اسم مرة من الاتحاد؛ فتضبط بفتح الواو على وزن فَعْلة... ولا يصح كسر الواو»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الضبط الصحيح وَحْدة بفتح الواو للانفراد، لا بكسرها"

    - lemma: "وَحْشَة"
      confirm:
        - text: "«(الوحشة) الأَرْض القفر المستوحشة وَمن النَّاس الِانْقِطَاع وَبعد الْقُلُوب عَن المودات وَالْخلْوَة وَالْخَوْف من الْخلْوَة وَالْخَوْف والهم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هرماني)"
        - text: "«الأرض القفر المستوحشة من الناس: الانقطاع وبعد القلوب عن المودات الخلوة الخوف من الخلوة الخوف الهم»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(وَحَشَ) الْوَاوُ وَالْحَاءُ وَالشِّينُ: كَلِمَةٌ تَدُلُّ عَلَى خِلَافِ الْإِنْسِ. تَوَحَّشَ: فَارَقَ الْأَنِيسَ.»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«وحشة: عزلة، بُعد، كره، عدم إلفة، حقد... مستوحش: الذي يعيش منفرداً، الهارب من الناس والمجتمع»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "توسيع الدلالة لتشمل البُعد النفسي والاجتماعي وليس فقط الحالة الجسدية"

    - lemma: "اسْتِيحَاش"
      expands:
        - text: "«استوحش لفلان أحس بالوحشة لفراقه... استوحش من فلان: ابتعد عنه، نفر منه»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "الاستيحاش يركز على الفعل والشعور المتولّد لا على الحالة الثابتة"

    - lemma: "تَوَحُّد"
      confirm:
        - text: "«(توَحد) الله بربوبيته وجلاله وعظمته تفرد بها وفلان بقي مفرداً»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«التوحد في الاستعمال المعاصر: اضطراب طيف التوحد (autism)»"
          source: "الاستعمال المعاصر"
          conflict: "المصطلح ارتبط في العربية المعاصرة باضطراب التوحد مما يُحدث لبساً دلالياً"

    - lemma: "خَلْوَة"
      contradicts:
        - text: "«(الْخلْوَة) مَكَان الِانْفِرَاد بِالنَّفسِ أَو بغَيْرهَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الخلوة تدل على مكان الانفراد أو فعله الإرادي (اعتكاف/خلوة صوفية)، لا على حالة الوحدة النفسية"
        - text: "«الخلوة: محادثة السر مع الحق حيث لا أحد ولا ملك»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الخلوة مصطلح صوفي إيجابي الدلالة، يختلف جوهرياً عن الوحدة/الوحشة"

