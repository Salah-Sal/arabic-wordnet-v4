stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ١ ──
    - lemma: "شُعُور بِالوَحْدَة"
      decision: removed
      decision_reason: "عبارة وصفية حرة مؤلفة من ثلاث وحدات (شعور + بـ + الوحدة)، تنجح في اختبار الإبدال (إحساس بالوحدة / شعور بالعزلة)، ولم تُوثَّق في أي معجم كوحدة معجمية ثابتة. فضلاً عن ذلك، دلالتها على «الشعور» لا على «الحالة» تخالف تعريف المجموعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة ٢ ──
    - lemma: "وَحْدَة"
      decision: confirmed
      decision_reason: "الجذر و-ح-د يدل أصالةً على الانفراد (مقاييس اللغة). المعاجم الكلاسيكية تُعرِّف الوَحْدة بالانفراد. رغم الاشتراك اللفظي مع وحدة القياس والاتحاد، يبقى المعنى حياً ومتداولاً. التشكيل بفتح الواو يُميّزها."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على حالة الانفراد المحايدة دون إيحاء نفسي سلبي بالضرورة، وقد تكون اختيارية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَحْدَة"

    # ── مرشح المرحلة ١ — وَحْشَة ──
    - lemma: "وَحْشَة"
      source: stage1
      decision: confirmed
      decision_reason: "لمّة أصيلة مؤيَّدة بنصوص المعجم الوسيط ومقاييس اللغة والتكملة. تدل على الانقطاع عن الناس وبُعد القلوب عن المودات، وهي الأقرب دلالياً إلى loneliness بمعناها النفسي. الجذر و-ح-ش يدل على خلاف الإنس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تحمل بُعداً عاطفياً ونفسياً (الاستيحاش والخوف من الانفراد) أقوى من «وَحْدَة» التي قد تكون محايدة"
      actions:
        - command: create_entry
          params: {lemma: "وَحْشَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    # ── مرشح المرحلة ١ — اسْتِيحَاش (مرفوض) ──
    - lemma: "اسْتِيحَاش"
      source: stage1
      decision: removed
      decision_reason: "مصدر فعلي (استفعال) يدل على الفعل أو الشعور المتحول لا على الحالة الثابتة. المجموعة تطلب اسماً يدل على حالة (state) لا على حدث. كذلك يغلب عليه معنى النفور والتوجس لا مجرد الانفراد."

    # ── مرشح المرحلة ١ — تَوَحُّد (مرفوض) ──
    - lemma: "تَوَحُّد"
      source: stage1
      decision: removed
      decision_reason: "رغم أن المعجم الوسيط يُثبت معنى «بقي مفرداً»، فإن اللفظ ارتبط في الاستعمال المعاصر باضطراب طيف التوحد (autism) ارتباطاً وثيقاً يُحدث لبساً دلالياً خطيراً."

    # ── مرشح المرحلة ١ — خَلْوَة (مرفوض) ──
    - lemma: "خَلْوَة"
      source: stage1
      decision: removed
      decision_reason: "الخلوة تدل على مكان الانفراد أو فعله الإرادي (اعتكاف، خلوة صوفية، خلوة شرعية). دلالتها إيجابية أو محايدة مكانياً، بخلاف الوحدة/الوحشة اللتين تدلان على الحالة النفسية أو الوجودية."

