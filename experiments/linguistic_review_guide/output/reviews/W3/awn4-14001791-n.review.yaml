stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (عاصفة)؛ المفهوم (هيجان أو اضطراب عنيف) يستحق مرادفات إضافية"
      - "اللمّة الموجودة بدون تشكيل كامل"
      - "التعريف العربي مقتضب جداً ولا يميّز هذا المعنى المجازي عن المعنى الحسّي للعاصفة الجوية"
    observations: "المفهوم يدلّ على الاضطراب والهيجان العنيف بالمعنى المجرد (لا الجوّي)، وهو قريب من الاستعمال المجازي لـ«عاصفة» في العربية. اللمّة الإنجليزية storm/tempest تحمل الدلالة المجازية ذاتها. الأعلى (hypernym) هو «اضطراب/هيجان» مما يؤكد أن المقصود هنا الاضطراب المعنوي لا الظاهرة المناخية."
  blind_candidates:
    - lemma: "زَوْبَعَة"
      generation_method: ishtiqaq
      justification: "من الجذر ز-ب-ع على وزن فَوْعَلَة، تدلّ على الإعصار والاضطراب الشديد، وتُستعمل مجازاً في الفتنة والخلاف العنيف (زوبعة في فنجان)"
    - lemma: "عَاصِفَة"
      generation_method: ishtiqaq
      justification: "اسم فاعل مؤنث من عَصَفَ على وزن فاعلة، والعصف يدلّ على الشدة والسرعة، تُستعمل مجازاً للاضطراب العنيف"
    - lemma: "هَوْجَاء"
      generation_method: ishtiqaq
      justification: "صفة مشبّهة مؤنثة من الجذر ه-و-ج على وزن فَعْلاء، تدلّ على التسرّع والعنف، تُوصف بها الريح التي تقلع البيوت"
    - lemma: "قَاصِفَة"
      generation_method: ishtiqaq
      justification: "اسم فاعل مؤنث من قَصَفَ على وزن فاعلة، والقصف يدلّ على الكسر العنيف، يُقال رعد قاصف وريح قاصفة"


