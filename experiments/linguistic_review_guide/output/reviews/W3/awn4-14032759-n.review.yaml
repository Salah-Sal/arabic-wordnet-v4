# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14032759-n
# commission: the state of being in good working order and ready for operation
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يكرّر لفظة «حالة» مرتين: «حالة كونه في حالة عمل جيدة»، ممّا يُضعف الصياغة"
      - "اللمّة «الخدمة الفعلية» مركب إضافي-وصفي ينتمي أصلاً للسياق العسكري والبحري، وقد يكون ضيّق الدلالة عن المفهوم العام"
      - "اللمّة «جاهزية» بدون تشكيل"
    observations: "المجموعة تعبّر عن مفهوم «الحالة التشغيلية السليمة» (in commission) لآلة أو منظومة. المفهوم تقني بالأساس ويُعبَّر عنه في العربية عادةً بعبارات وصفية (جاهز للتشغيل، صالح للعمل) أكثر من مصطلح مفرد. اللمّتان الموجودتان تغطيان السياق العسكري (الخدمة الفعلية) والسياق التقني العام (جاهزية)."
  blind_candidates:
    - lemma: "جَاهِزِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «جاهز» على وزن فاعليّة، يدلّ على حالة الاستعداد التشغيلي. مستعمل في المعلوماتية والهندسة بمعنى readiness."
    - lemma: "صَلاحِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «صالح» (جذر ص ل ح)، ومن معانيه في المعجم الكبير: «درجة الثقة بأداء الأجهزة» و«حسن التهيؤ للعمل»."
    - lemma: "أُهْبَة"
      generation_method: majaz
      justification: "الأُهْبَة في الأصل العُدّة والاستعداد (أخذ للأمر أُهْبته)، توسيع دلالي لتشمل الجاهزية التشغيلية."
    - lemma: "اسْتِعْدَاد"
      generation_method: ishtiqaq
      justification: "مصدر على وزن استفعال من «عدد»، يدلّ على التهيؤ والتأهب. عرّفه الجرجاني: «كون الشيء بالقوة القريبة أو البعيدة إلى الفعل»."


stage2_evidence:
  per_lemma:
    - lemma: "الخِدْمَة الفِعْلِيَّة"
      confirm:
        - text: "«in commission or into commission: (1) جاهز للخدمة الفعلية [في وصف سفينة] (2) عاملٌ؛ قيد الاستعمال؛ صالح للاستعمال.»"
          source: "المورد الحديث (2008)"
        - text: "«out of commission: (1) غير جاهز للخدمة الفعلية (2) غير عامل؛ غير موضوعٍ موضعَ الاستعمال؛ غير صالح للاستعمال.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«العسكريّة: قضاءُ المواطن مُدَّةً مُجَنَّدًا في القُوَّاتِ المُسَلَّحة, وَفْقًا لقانون التَّجْنِيد في بلده»"
          source: "المعجم الكبير"
          addition: "يوضّح أن «الخدمة» في السياق العسكري تعني فترة التجنيد والعمل الفعلي"

    - lemma: "جَاهِزِيَّة"
      confirm:
        - text: "«جاهزية المعطيات — مختصر: Data Set Ready. إشارةٌ تُستعمَلُ في الاتصالات التسلسلية وترسَل، مثلاً، من مودم إلى الحاسوب المرافق ليشير إلى أنه جاهز للعمل.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«جاهزية مطراف المعطيات — مختصر: Data Terminal Ready. إشارةٌ تُستعمل في الاتصالات التسلسلية وترسَل، مثلاً، من حاسوب إلى المودم المتصل به، لتشير إلى أن هذا الحاسوبَ جاهزٌ لقبول النقل القادم.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«مراجعةُ جاهزيةِ الاختبار — مراجعةٌ تُجرَى لتقييمِ نتائجِ الاختبار التمهيدي لبندٍ واحد أو أكثر، وللتحقُّقِ من اكتمالِ إجراءاتِ اختبارِ كلِّ بند»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "تأكيد استعمال «جاهزية» في السياق التقني للدلالة على حالة الاستعداد التشغيلي"

    - lemma: "صَلاحِيَّة"
      contradicts:
        - text: "«الاتِّساقُ والمناسبةُ لغرض ما — مدًى زمنِىٌّ مِّعَيَّنٌ تُصبحُ بعده الموادُّ الغذائيَّةُ وغيرُها غيرَ صالحةٍ للاستخدام — درجةُ الثِّقَةِ بأداءِ الأجهزة»"
          source: "المعجم الكبير"
          conflict: "المعنى الغالب هو «المدة الزمنية» (تاريخ الصلاحية) أو «السلطة القانونية» (صلاحيات)، لا حالة الجاهزية التشغيلية"
      expands:
        - text: "«الصَّلَاحِيَّة لِلْعملِ: حسنُ التهيؤ والاستعدادُ له.»"
          source: "المعجم الكبير"
          addition: "معنى فرعي قريب من المفهوم لكنه عام جداً"

    - lemma: "أُهْبَة"
      contradicts:
        - text: "«الأُهْبَة بالضم: العُدَّة — أخذ للأمر أُهْبته»"
          source: "معجم الصواب اللغوي"
          conflict: "الأُهْبة تدلّ على الاستعداد الشخصي والعُدّة، لا على حالة تشغيلية لآلة أو نظام"
      expands:
        - text: "«الكلمة الثانية التَّأَهُّبُ. قال الخليل: تَأَهَّبوا للسَّير. وأخذ فلان أُهْبَتَه»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل في التأهب والأُهبة: الاستعداد الشخصي للسير أو الأمر"

    - lemma: "اسْتِعْدَاد"
      contradicts:
        - text: "«الاستعداد: لغة، طلب التأهب، وعرفاً كون الشيء بالقوة القريبة أو البعيدة متهيأ إلى الفعل.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الاستعداد يدلّ على القوة الكامنة والتهيؤ للفعل (disposition)، لا على الحالة التشغيلية الفعلية لجهاز يعمل بسلامة"
      expands:
        - text: "«قابلية فطرية للقيام بنشاط ما كقابلية التواصل مثلاً.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          addition: "الاستعمال المعاصر يركّز على المعنى النفسي (aptitude/disposition)"


stage3_analysis:
  per_lemma:
    - lemma: "الخِدْمَة الفِعْلِيَّة"
      decision: confirmed
      decision_reason: "المورد الحديث يؤكّد أن «in commission = جاهز للخدمة الفعلية» و«out of commission = غير جاهز للخدمة الفعلية». المركب ثابت معجمياً في السياق العسكري والبحري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير عسكري وبحري بالأصل، يدلّ على وضع السفينة أو الوحدة في حالة العمل الرسمية ضمن الأسطول أو الجيش"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الخِدْمَة الفِعْلِيَّة"

    - lemma: "جَاهِزِيَّة"
      decision: confirmed
      decision_reason: "مصطلح تقني مستعمل في المعلوماتية والهندسة للدلالة على حالة الاستعداد التشغيلي (readiness). أوسع دلالةً من «الخدمة الفعلية» ويصلح للسياقات المدنية والتقنية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح تقني عام يدلّ على حالة الجاهزية التشغيلية لأيّ جهاز أو نظام، دون تخصيص عسكري"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَاهِزِيَّة"

    - lemma: "صَلاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: "اللفظة شديدة الاشتراك اللفظي؛ معانيها الغالبة: السلطة القانونية، والمدة الزمنية (تاريخ الصلاحية)، والموهبة الفطرية. معنى «حسن التهيؤ للعمل» فرعي ولا يطابق مفهوم الحالة التشغيلية السليمة."
      evidence_assessment:
        case: mixed

    - lemma: "أُهْبَة"
      source: stage1
      decision: removed
      decision_reason: "الأُهْبَة تدلّ على الاستعداد الشخصي والعُدّة (أخذ للأمر أُهْبته)، ولا تُستعمل لوصف حالة تشغيلية لآلة أو منظومة. كما أنها مصطلح طبي (diathesis/predisposition) في الاستعمال المعاصر."
      evidence_assessment:
        case: contradicts_only

    - lemma: "اسْتِعْدَاد"
      source: stage1
      decision: removed
      decision_reason: "الاستعداد يدلّ على القوة الكامنة والتهيؤ (disposition/aptitude)، وهو أقرب إلى المعنى النفسي والفلسفي. لا يُستعمل لوصف حالة آلة سليمة وجاهزة للتشغيل فعلاً، بل لوصف القابلية المُحتملة."
      evidence_assessment:
        case: contradicts_only


