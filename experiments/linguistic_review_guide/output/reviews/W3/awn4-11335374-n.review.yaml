# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11335374-n  |  ILI: i97004
# الموضوع: ديفيد بارنارد شتاينمان — مهندس مدني أمريكي (1886-1960)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان الحاليتان (ديفيد شتاينمان / شتاينمان) خاليتان من التشكيل الكامل"
      - "الاسم الرسمي الكامل (David Barnard Steinman) غائب من اللمّات العربية رغم وروده في اللمّات الإنجليزية"
      - "التعريف العربي الحالي لا يذكر جسر ماكيناك الذي هو أبرز أعماله، بينما يرد صراحةً في التعريف الإنجليزي"
    observations: >
      هذه المجموعة تمثّل اسم علَم لشخص بعينه (proper noun synset)، وهو المهندس الأمريكي
      ديفيد بارنارد شتاينمان (1886-1960)، أحد أبرز مهندسي الجسور المعلقة في القرن العشرين.
      الوزن الترادفي هنا ليس ترادفاً معجمياً حقيقياً بالمعنى المصطلحي، بل هي صيغ للاسم ذاته
      (الاسم الكامل، والثنائي، واللقب). منهج التوليد المصطلحي بأشكاله الأربعة (مجاز/اشتقاق/تركيب/تعريب)
      لا ينطبق إلا على وجه واحد هو التعريب، إذ لا خيار لاشتقاق مصطلح عربي أو توليد مجاز
      لاسم علم. وقد استدعى التعرّف على هوية الشخص الانطلاقَ من تاريخَي الولادة والوفاة
      (1886-1960) والإشارة إلى جسر ماكيناك في التعريف الإنجليزي.

  blind_candidates:
    - lemma: "دَيْفِيد بَارنَارد شْتَاينْمَان"
      generation_method: taarib
      justification: >
        الاسم الرسمي الكامل للمهندس (David Barnard Steinman)؛ التعريب وفق المنهج المعياري:
        ش لـ St المُركَّبة، فَتْحة بعد الشين قبل التاء الساكنة، آي لـ ei، نون ساكنة،
        مَ مفتوحة، ألف ممدودة، نون. الصيغة الثلاثية مناسبة للسياقات الرسمية والأكاديمية.
    - lemma: "دَيْفِيد شْتَاينْمَان"
      generation_method: taarib
      justification: >
        الصيغة الثنائية الأشيع (David Steinman)؛ تُحذف حرف الاسم الأوسط وفق ما جرت به عادة
        الترجمة العربية للأعلام الأمريكية في الأدبيات الهندسية والموسوعات.
    - lemma: "شْتَاينْمَان"
      generation_method: taarib
      justification: >
        اللقب منفرداً (Steinman)، يُستخدم في الإشارة الاختصارية المعتادة بعد ذكر الاسم الكامل
        في الدراسات الهندسية وكتب تاريخ الجسور.
    - lemma: "دَيْفِيد ب. شْتَاينْمَان"
      generation_method: taarib
      justification: >
        الصيغة مع الحرف الأوسط المختصَر (David B. Steinman)، الواردة في المصادر الإنجليزية،
        لكنها مستبعَدة في العربية لأن اختصار الأسماء الوسطى بحرف لاتيني لا يلائم النظام الكتابي
        العربي ولا يُقبَل في المعجمية العربية المعيارية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: هذا synset لاسم علم أجنبي. لا تشتمل قاعدة البيانات المعجمية العربية
  # (OCR / Hawramani / ARABTERM) على مداخل لأسماء الأعلام الأجنبية المفردة؛ وهو أمر متوقع
  # بطبيعة هذه المصادر التي تُعنى بالمفردات اللغوية لا بالمعلمات التاريخية.
  # استعلام الجسر الإنجليزي أثبت وجود "جسر معلق" (suspension bridge) في المصطلحية العربية
  # لكنه لم يُنتِج أي مدخل للشخص نفسه.

  per_lemma:

    - lemma: "دَيْفِيد شْتَاينْمَان"
      evidence_status: "no_material_found"

    - lemma: "شْتَاينْمَان"
      evidence_status: "no_material_found"

    - lemma: "دَيْفِيد بَارنَارد شْتَاينْمَان"
      evidence_status: "no_material_found"

    - lemma: "دَيْفِيد ب. شْتَاينْمَان"
      evidence_status: "no_material_found"

  query_log:
    - query_type: "batch_headword_lookup"
      terms_searched:
        - "ديفيد شتاينمان"
        - "الديفيد شتاينمان"
        - "شتاينمان"
        - "الشتاينمان"
        - "ديفيد بارنارد شتاينمان"
        - "الديفيد بارنارد شتاينمان"
        - "ديفيد ب. شتاينمان"
        - "ديفيد ب شتاينمان"
      result: "لا نتائج — أسماء الأعلام الأجنبية غير مُدرَجة في القاعدة"
    - query_type: "english_bridge"
      terms_searched:
        - "Steinman"
        - "David Steinman"
        - "suspension bridge"
      result: "عُثر على مداخل لـ«جسر معلق» (suspension bridge) في معجم النقل والهندسة المدنية، دون أي مدخل للشخص"
    - query_type: "arabic_fts_keywords"
      keywords: ["مهندس مدني", "جسور معلقة", "جسر معلق"]
      result: "مداخل مصطلحية هندسية عامة، لا علاقة لها بالشخص المقصود"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "ديفيد شتاينمان"
      decision: confirmed
      decision_reason: >
        اسم علَم صحيح يُمثّل الصيغة الثنائية الأكثر تداولاً (David Steinman).
        يحتاج تشكيلاً كاملاً. التعريب وفق المعيار العربي سليم (ش لـ St، آي لـ ei).
        لا لهجية، لا اشتباه، لا تعارض.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الثنائية الأشيع في الأدبيات العربية (الاسم الأول + اللقب)؛ تُستخدم عند
        الذكر الأول أو عند الحاجة إلى التمييز من أسماء أخرى تشترك في اللقب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَيْفِيد شْتَاينْمَان"

    # ── لمّة موجودة ٢ ──
    - lemma: "شتاينمان"
      decision: confirmed
      decision_reason: >
        اللقب منفرداً صيغة مشروعة ومتداولة في الأدبيات الهندسية وكتب التأريخ بعد تقديم
        الاسم الكامل. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب منفرداً؛ يُستعمل في السياق الاختصاري بعد ذكر الاسم الكامل، أو في الفهارس
        والمراجع حيث يُرتَّب الاسم على اللقب. يفتقر إلى التحديد التام حال وجود أسماء أخرى
        تشترك في هذا اللقب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شْتَاينْمَان"

    # ── مرشح المرحلة ١: الاسم الكامل الرسمي ──
    - lemma: "دَيْفِيد بَارنَارد شْتَاينْمَان"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الثلاثي الكامل (David Barnard Steinman) وارد صراحةً في اللمّات الإنجليزية
        لهذه المجموعة ذاتها. غيابه من اللمّات العربية ثغرة ينبغي سدّها. التعريب سليم ومطّرد.
        يناسب السياقات الأكاديمية الرسمية وكتب التراجم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الكامل ثلاثي الحدود؛ يُستخدم في التراجم والمقالات الأكاديمية والموسوعات
        عند التعريف الأول بالشخص، ويُميَّز به عن غيره ممن قد يحملون الاسمَين الأول والأخير.
      actions:
        - command: create_entry
          params:
            lemma: "دَيْفِيد بَارنَارد شْتَاينْمَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-11335374-n"

    # ── مرشح المرحلة ١: الصيغة المختصَرة (مرفوض) ──
    - lemma: "دَيْفِيد ب. شْتَاينْمَان"
      source: stage1
      decision: removed
      decision_reason: >
        اختصار الاسم الأوسط بحرف لاتيني (B.) لا يناسب الكتابة العربية المعيارية ولا يُقبَل
        في المعجمية العربية. هذه الصيغة تخلط بين الحرف اللاتيني والنص العربي مما يُفقدها
        صحة الضبط وقابلية الترتيب المعجمي. صيغة "دَيْفِيد شْتَاينْمَان" تؤدي الوظيفة ذاتها.


