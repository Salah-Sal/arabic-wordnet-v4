      decision_reason: >
        النسبة قَمْصِيّ/قَمِيصِيّ موثّقة في المعجم بمعانٍ اسمية علمية متعددة ومتعارضة
        (نسبة لأسماء أعلام، نسبة لمعنى النزو، نسبة للمرتبة الكنسية)،
        مما يجعلها عُرضةً لاشتراك لفظي مُشوِّش.
        فضلاً عن ذلك، لا شاهد معجمي يستعمل «قَمِيصِيّ» للدلالة على مزاولة حرفة الخياطة.
