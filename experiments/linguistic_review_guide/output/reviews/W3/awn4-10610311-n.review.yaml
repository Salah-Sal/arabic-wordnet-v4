# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة الموجودة «صانع قمصان» عبارةٌ وصفية حرة وليست مصطلحاً مسكوكاً؛ تبدو ترجمةً حرفيةً لـ shirtmaker (shirt + maker → قمصان + صانع)"
      - "اللمّة تفشل في اختبار السكّ: يمكن إبدال «صانع» بـ«خائط» أو «منتج» ويبقى الوصف صحيحاً، مما يدل على أنها عبارة وصفية لا وحدة معجمية ثابتة"
      - "التعريف «صانع للقمصان» دوّار: يُعيد صياغة اللمّة ذاتها دون جنس قريب ولا فصل نوعي"
      - "غياب التشكيل عن اللمّة الموجودة"
      - "العربية تُعبّر عن أصحاب الحرف بوزن فعّال (خيّاط، نجّار، حدّاد) أو بمركبات إضافية من اسم الحرفة + نوع المشغول؛ واللمّة الموجودة لا تتبع أيّاً من النمطَيْن"
    observations: >
      يُعبَّر عن المفهوم في العربية المعاصرة بالتركيب الإضافي «خيّاط القمصان» كما ورد في المورد الحديث (2008)،
      وهذا أنسب من «صانع قمصان» لأن «خيّاط» يُخصِّص نوع الحرفة (الخياطة) لا مجرد الصنع العام،
      ولأنه ينتسب إلى سلسلة اشتقاقية عربية راسخة (خاطَ — خِياطة — خيّاط).
      الجذر قمص له أصلان في المقاييس: لبس القميص والانشيام فيه، والنزو والحركة؛
      مما يجعل الاشتقاق المباشر منه (قمّاص) مُلتبَساً دلالياً.

  blind_candidates:
    - lemma: "قَمَّاصٌ"
      generation_method: ishtiqaq
      justification: >
        وزن فعّال من جذر (ق م ص)، قياساً على أوزان الحرف: خيّاط، نجّار، حدّاد.
        القميص من هذا الجذر، فقَمَّاص = من حرفته صنع الأقمصة وخياطتها.
        وزن فعّال هو الأنسب للحرفيين في العربية.

    - lemma: "خَيَّاطُ الْقُمُصَانِ"
      generation_method: tarkib
      justification: >
        مركب إضافي (إضافي) من «خيّاط» (صاحب حرفة الخياطة على وزن فعّال من خيط)
        و«القمصان» (جمع قميص)، يحدّد تخصص الحرفي في القمصان تحديداً دقيقاً،
        ويتبع نمطاً إضافياً شائعاً في العربية لتخصيص الحرف (خيّاط الجلود، خيّاط الجوارب).

    - lemma: "قَمِيصِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة مصدرية إلى «القميص» تُستعمل اسماً للمحترف، قياساً على
        «عطّار» من العطر، أو بالمصدر الصناعي ليُفيد الانتساب المهني.
        يمكن أن يدل على المشتغل بالقمصان صنعاً وبيعاً.

    - lemma: "خَيَّاطُ الأَقْمِصَةِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «خيّاط» + «الأقمصة» (جمع قميص على وزن أَفْعِلَة الأقيس في العربية الفصيحة)،
        يتبع نمط تخصيص الحرف بذكر المادة أو النوع المعمول.


