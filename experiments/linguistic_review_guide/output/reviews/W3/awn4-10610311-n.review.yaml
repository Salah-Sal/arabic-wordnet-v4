    - lemma: "صانع قمصان"
      decision: removed
      decision_reason: >
        فشلت اللمّة في اختبارَيْ السكّ والتثبيت المعجمي:
        (١) اختبار السكّ: «صانع» قابل للإبدال بـ«منتج/خائط/ماكِر» مع بقاء الوصف صحيحاً → ليست وحدة مسكوكة.
        (٢) اختبار التثبيت المعجمي: لا مدخل معجمي مستقل لهذا التركيب في أي من مصادر قاعدة البيانات.
        (٣) الترجمة الحرفية العمياء: تُرجم shirtmaker كلمةً بكلمة (shirt→قمصان، maker→صانع)
        دون مراعاة بنية الحرف العربية.
        (٤) المورد الحديث يُؤثر «خيّاط القمصان» صراحةً على أي صيغة أخرى.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "قَمَّاصٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر قمص في مقاييس اللغة له أصلان: اللبس والانشيام + النزو والحركة.
        وزن فعّال من جذر مزدوج الأصل يُنتج التباساً دلالياً: قَمَّاص قد يُفهم «كثير النزو»
        لا «صانع القمصان». يُضاف إلى ذلك أن «قُماص» مستعمل مصطلحاً طبياً،
        مما يُرسّخ الاشتباه. لا دليل معجمي يدعم استخدام قَمَّاص بمعنى الحرفة.
      evidence_assessment:
