    - lemma: "خَيَّاطُ الْقُمُصَانِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مدعوم مباشرةً من المورد الحديث (2008) الذي يُترجم shirtmaker بـ«خيّاط القمصان».
        اجتاز اختبار السكّ: «خيّاط» هو الاسم الاصطلاحي للحرفي المختص (لا يُبدَّل بـ«صانع» أو «عامل»
        في هذا التركيب دون تغيير الصبغة الدلالية)؛ و«القمصان» مضاف يُحدّد التخصص.
        اجتاز اختبار التثبيت المعجمي: مُسجَّل في معجم معتمد (المورد الحديث).
        وزن «خيّاط» (فعّال من خيط) هو النمط الصرفي الراسخ للحرفيين في العربية.
        التركيب يتبع نمط التخصيص الإضافي الشائع (خيّاط جلود، خيّاط سجاد).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يختص بالحرفي المتخصص في القمصان تحديداً، في مقابل «الخيّاط» (المفرد)
        الذي يدل على الخيّاط العام بلا تخصيص؛ والتمييز قائم على المضاف إليه «القمصان»
        الذي يُضيّق دائرة الاختصاص.
      actions:
