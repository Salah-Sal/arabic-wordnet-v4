# مراجعة المجموعة الترادفية: awn4-14459275-n (prestige / prestigiousness)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «هيبة» دلالتها الأصلية الخوف والمخافة والإجلال لا المكانة الاجتماعية المكتسبة بالنجاح؛ ربطها بـprestige توسّع حديث في الاصطلاح الاجتماعي"
      - "المجموعة تحتوي لمّتين فقط لمفهوم غني دلاليًّا في العربية؛ ينقصها ألفاظ محورية كجاه"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي ويمكن تحسينه بأسلوب معجمي عربي"
    observations: "المجموعة تقع تحت المُشترَك العامّ (سمعة/مكانة) وتختصّ بالمكانة المرموقة الناشئة عن النجاح أو النفوذ أو الثروة. في العربية ألفاظ عديدة تدور حول هذا المعنى: جاه، وجاهة، حظوة، اعتبار، صيت. يجب التمييز بين المكانة بذاتها (وجاهة، جاه) والأثر النفسي الذي تُحدثه في الآخرين (هيبة)."

  blind_candidates:
    - lemma: "جَاه"
      generation_method: majaz
      justification: "لفظ عربي أصيل مقلوب عن «وجه»، يدلّ على القَدْر والمنزلة الرفيعة بين الناس، وهو أدقّ ما يُقابل prestige في العربية"
    - lemma: "حَظْوَة"
      generation_method: ishtiqaq
      justification: "من الجذر ح-ظ-و، على وزن فَعْلَة، تدلّ على المكانة والمنزلة لدى ذوي السلطان، وفيها معنى النصيب من الرفعة"
    - lemma: "صِيت"
      generation_method: ishtiqaq
      justification: "من الجذر ص-و-ت (أو ص-ي-ت)، يدلّ على الذكر الحسن المنتشر بين الناس، وله صلة بالمكانة العالية"
    - lemma: "اعْتِبَار"
      generation_method: ishtiqaq
      justification: "من الجذر ع-ب-ر على وزن افتعال، يُستخدم في العربية المعاصرة بمعنى الكرامة والتقدير الاجتماعي، ومنه: رُدّ اعتباره"


stage2_evidence:
  per_lemma:
    - lemma: "هَيْبَة"
      confirm:
        - text: "«هيبة — prestige — Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM/ALECSO)"
      contradicts:
        - text: "«الهَيْبَةُ: المَخافَةُ، والتَّقِيَّةُ، كالمَهابَةِ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الدلالة الأصلية خوف ومخافة لا مكانة اجتماعية"
        - text: "«(هَيَبَ) الْهَاءُ وَالْيَاءُ وَالْبَاءُ كَلِمَةُ إِجْلَالٍ وَمَخَافَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الاشتقاقي إجلال ومخافة، لا منزلة مكتسبة"
      expands:
        - text: "«الهَيْبَةُ: رهبة جالبة للخضوع عَن استشعار عَظِيم»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "تُبيّن أن الهيبة أثرٌ نفسي ناتج عن عظمة الطرف الآخر لا صفة ذاتية للشخص"
        - text: "«هَيْبَة — من (ه ي ب) الإجلال والتعظيم، والحذر والخوف»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يجمع بين الإجلال والتعظيم من جهة والحذر والخوف من جهة أخرى"

    - lemma: "وَجَاهَة"
      confirm:
        - text: "«(الوجاهة) الْحُرْمَة»"
          source: "المعجم الوسيط"
        - text: "«وجاهة — من (و ج ه) الحرمة، والقدر، والجاه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(وَجَهَ) الْوَاوُ وَالْجِيمُ وَالْهَاءُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُقَابَلَةٍ لِشَيْءٍ... هُوَ وَجِيهٌ بَيِّنٌ الْجَاهِ. وَالْجَاهُ مَقْلُوبٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يربط الوجاهة بالوجه (المقابلة والبروز) ويؤكد أن الجاه مقلوب منه"

    - lemma: "جَاه"
      confirm:
        - text: "«(الجاه) الْمنزلَة وَالْقدر»"
          source: "المعجم الوسيط"
        - text: "«الجَاهُ — القَدْرُ والمَنْزِلَةُ, مَقْلوبٌ عن وجه»"
          source: "المعجم الكبير"
        - text: "«الجاهُ والجاهَةُ: القَدْرُ، والمَنْزِلَةُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(1) اعتبار؛ جاه؛ مقام: احترام أو نفوذ ناشئان عن الثروة أو النجاح»"
          source: "المورد الحديث (2008) — مدخل prestige"
      expands:
        - text: "«جَاه — من (ج و ه) المنزلة الرفيعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "تخصيص الجاه بالمنزلة الرفيعة لا مطلق المنزلة"

    - lemma: "حَظْوَة"
      confirm:
        - text: "«الحظْوَةُ — المَكانةُ والمَنْزِلَةُ لَدَى ذِي سُلْطَانٍ ونحوِه»"
          source: "المعجم الكبير"
        - text: "«الحُظْوَةُ، بالضم والكسر... المكانَةُ، والحَظُّ من الرِّزْقِ»"
          source: "القاموس المحيط للفيروزآبادي"
      contradicts:
        - text: "«المَكانةُ والمَنْزِلَةُ لَدَى ذِي سُلْطَانٍ ونحوِه»"
          source: "المعجم الكبير"
          conflict: "الحظوة مكانة مقيّدة بكونها عند ذي سلطان، أخصّ من prestige العام"

    - lemma: "صِيت"
      confirm:
        - text: "«(الصيت) الذّكر الْحسن يُقَال ذهب صيته بَين النَّاس»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(صَوَتَ) الصَّادُ وَالْوَاوُ وَالتَّاءُ أَصْلٌ صَحِيحٌ، وَهُوَ الصَّوْتُ... وَالصِّيتُ: الذِّكْرُ الْحَسَنُ فِي النَّاسِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الصيت ذكرٌ وشهرة لا مكانة مكتسبة بالنفوذ والثروة؛ أقرب إلى fame منه إلى prestige"

    - lemma: "اعْتِبَار"
      confirm:
        - text: "«(الِاعْتِبَار) الْفَرْض وَالتَّقْدِير... والكرامة وَمِنْه (فِي الْقَضَاء) رد الِاعْتِبَار»"
          source: "المعجم الوسيط"
        - text: "«(1) اعتبار؛ جاه؛ مقام: احترام أو نفوذ ناشئان عن الثروة أو النجاح»"
          source: "المورد الحديث (2008) — مدخل prestige"
      contradicts:
        - text: "«الاعتبار: هو النظر في الحكم الثابت أنه لأي معنى ثبت، وإلحاق نظيره به وهذا عين القياس»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى الاصطلاحي الكلاسيكي قياسٌ واتّعاظ لا مكانة اجتماعية؛ معنى الكرامة حديث"


stage3_analysis:
  per_lemma:
    - lemma: "هَيْبَة"
      decision: confirmed
      decision_reason: "رغم أن الدلالة الأصلية خوف وإجلال، فإن الاستعمال الاصطلاحي الحديث في علم الاجتماع (ARABTERM/ALECSO) يُقابل بها prestige، وهي شائعة في التعبير المعاصر (هيبة الدولة، هيبة المنصب). الهيبة تصف الأثر الناتج عن المكانة العالية وهو جزء لا يتجزأ من مفهوم الاعتبار الاجتماعي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الأثر النفسي (الإجلال والخشية) الذي تُحدثه المكانة العالية في نفوس الآخرين، بخلاف وجاهة وجاه اللتين تدلّان على المكانة ذاتها"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَيْبَة"

    - lemma: "وَجَاهَة"
      decision: confirmed
      decision_reason: "وجاهة تدلّ على الحرمة والقدر والجاه في المعاجم العربية الكبرى، وهي مشتقة من وجه (البروز والمقابلة)، فتُفيد بروز الشخص وعلوّ مكانته. مطابقة دلاليًّا لمفهوم prestige."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على المكانة الاجتماعية المرموقة الناشئة عن الحسب والقدر، مع إيحاء بالحرمة والاحترام، وهي أعمّ من هيبة (التي تركّز على الأثر النفسي) وأقرب إلى الوصف الموضوعي للمنزلة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَجَاهَة"

    - lemma: "جَاه"
      source: stage1
      decision: confirmed
      decision_reason: "جاه لفظ عربي أصيل (مقلوب وجه) يدلّ على القَدْر والمنزلة في المعاجم الكبرى. والمورد الحديث يضعه في صدارة مقابلات prestige: «اعتبار؛ جاه؛ مقام: احترام أو نفوذ ناشئان عن الثروة أو النجاح». وهو من أكثر الألفاظ العربية دقةً في التعبير عن هذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المنزلة والقدر بإطلاق دون تخصيص بالأثر النفسي (هيبة) أو بالحرمة الاجتماعية (وجاهة)، ويُستعمل غالبًا في سياق النفوذ والسلطة"
      actions:
        - command: create_entry
          params: {lemma: "جَاه", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حَظْوَة"
      source: stage1
      decision: removed
      decision_reason: "الحظوة مكانة مقيّدة بكونها عند ذي سلطان ونحوه (المعجم الكبير)، فهي أخصّ من مفهوم prestige الذي يشمل المكانة العامة الناشئة عن النجاح والثروة والنفوذ. كما أن للّفظ معاني أخرى (سهم صغير) تُضعف تخصّصه."
      evidence_assessment:
        case: mixed

    - lemma: "صِيت"
      source: stage1
      decision: removed
      decision_reason: "الصيت في المعاجم ذكرٌ حسن وشهرة منتشرة بين الناس، وأصله من الصوت. هو أقرب إلى fame/reputation منه إلى prestige الذي يتضمّن معنى المكانة المكتسبة بالنفوذ والثروة لا مجرد الشهرة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "اعْتِبَار"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود اعتبار في المورد الحديث مقابلاً لـprestige، فإن دلالته الأصلية (القياس والاتّعاظ) ودلالته الحديثة الغالبة (الفرض والتقدير) تجعله متعدّد المعاني بشكل يُضعف تخصّصه. كما أن معنى الكرامة فيه (ردّ الاعتبار) أقرب إلى esteem/consideration. يُفضَّل إبقاء جاه ووجاهة اللذين لهما دلالة أوضح وأثبت."
      evidence_assessment:
        case: mixed


