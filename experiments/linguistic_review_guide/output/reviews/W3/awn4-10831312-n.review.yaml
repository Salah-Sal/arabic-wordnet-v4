# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى (موجودة): ألبرتي ──
    - lemma: "ألبرتي"
      decision: confirmed
      decision_reason: >
        الكنية المختصرة "ألبرتي" هي الصيغة الأكثر شيوعاً وتداولاً في المراجع العربية
        المتخصصة بتاريخ العمارة والفنون للإشارة إلى Leon Battista Alberti.
        عدم وجودها في قاعدة البيانات لا يُضعف حجيّتها؛ إذ إن أسماء الأعلام نادراً ما
        تُدرج في معاجم اللغة العامة. تعريب الكنية "Alberti → أَلْبِرْتي" مطّرد صوتياً.
        يُحتاج إلى تحديث التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة المختصرة للكنية وحدها؛ تُستخدم في الإحالات الثانوية والموجزة بعد الذكر
        الكامل، وفي السياقات التخصصية حيث تكفي الكنية للتمييز.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَلْبِرْتي"

    # ── اللمّة الثانية (موجودة): ليون باتيستا ألبرتي ──
    - lemma: "ليون باتيستا ألبرتي"
      decision: confirmed
      decision_reason: >
        الاسم الكامل الثلاثي هو المرجع الأكاديمي الرسمي للشخصية في المصادر العربية
        والدولية. ضرورته واضحة للتمييز من أسماء أخرى تشترك في الكنية Alberti (كالرسام
        Rafael وسواه بحسب العائلة). عدم وجوده في قاعدة البيانات طبيعي لاسم علم أجنبي.
        يُحتاج إلى تحديث التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل الثلاثي المركّب؛ يُستخدم في الذكر الرسمي الأول في النصوص
        الأكاديمية والببليوغرافيات والترجمة المفصّلة، ويُوفّر التمييز الكامل عن غيره
        ممن يحملون الكنية ذاتها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لِيُون بَاتِيسْتَا أَلْبِرْتي"

    # ── مرشح المرحلة ١: لِيُون أَلْبِرْتي ──
    - lemma: "لِيُون أَلْبِرْتي"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة الثنائية (الاسم الأول + الكنية) لا تُضيف قيمة معجمية إذ تُغني عنها
        الصيغة المختصرة "أَلْبِرْتي" في سياقات الإيجاز، والصيغة الثلاثية الكاملة في
        سياقات التوثيق. غير شائعة الاستخدام في المصادر العربية المتخصصة مقارنةً
        بالصيغتين المعتمدتين.

    # ── مرشح المرحلة ١: بَاتِيسْتَا أَلْبِرْتي ──
    - lemma: "بَاتِيسْتَا أَلْبِرْتي"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة غير معهودة في المصادر العربية؛ حذف الاسم الأول مع الإبقاء على الاسم
        الأوسط والكنية لا يوافق العرف المعجمي العربي ولا الإنجليزي في الإحالة إلى
        هذه الشخصية. مرفوضة لعدم التداول ولعدم التمييز الكافي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري ورسام إيطالي؛ ومنظر رائد لعمارة عصر النهضة (1404-1472)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية؛ وإن كان صحيحاً في مضمونه فإنه
        يفتقر إلى: (أ) التشكيل، (ب) الصياغة الموسوعية بأسلوب المعجم الوسيط،
        (ج) الإشارة إلى المدينة/البلد الأصلي بالعربية، (د) توضيح طبيعة مساهمته
        النظرية (كتاب "في الفن المعماري").
    authored:
      - type: encyclopedic
        text: >
          مُعَمَّارٌ وَرَسَّامٌ إِيطَالِيٌّ وُلِدَ فِي جِنِيف سَنَةَ 1404م وَتُوُفِّيَ
          فِي رُومَا سَنَةَ 1472م؛ يُعَدُّ مِنْ أَبْرَزِ رُوَّادِ عِمَارَةِ عَصْرِ
          النَّهْضَةِ الْإِيطَالِيَّةِ وَأَوَّلِ مُنَظِّرِيهَا، صَاحِبُ كِتَابِ
          «فِي الْفَنِّ الْمِعْمَارِيِّ» (De re aedificatoria) الَّذِي حَاكَى فِيهِ
          مُعَالَجَةَ وِيتْرُوفِيُوس وَجَدَّدَ مَبَادِئَ الْعِمَارَةِ الْكْلَاسِيكِيَّةِ.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10831312-n"
          definition_index: 0
          text: >
            مُعَمَّارٌ وَرَسَّامٌ إِيطَالِيٌّ وُلِدَ فِي جِنِيف سَنَةَ 1404م وَتُوُفِّيَ
            فِي رُومَا سَنَةَ 1472م؛ يُعَدُّ مِنْ أَبْرَزِ رُوَّادِ عِمَارَةِ عَصْرِ
            النَّهْضَةِ الْإِيطَالِيَّةِ وَأَوَّلِ مُنَظِّرِيهَا، صَاحِبُ كِتَابِ
            «فِي الْفَنِّ الْمِعْمَارِيِّ» (De re aedificatoria).

  examples:
