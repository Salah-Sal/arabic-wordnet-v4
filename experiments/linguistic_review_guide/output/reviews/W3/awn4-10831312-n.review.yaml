      - lemma: "أَلْبِرْتي"
        examples:
          - text: >
              يُرْجَعُ إِلَى أَلْبِرْتي بِوَصْفِهِ مُؤَسِّسَ نَظَرِيَّةِ الْعِمَارَةِ
              الْحَدِيثَةِ فِي عَصْرِ النَّهْضَةِ الْإِيطَالِيَّةِ.
            type: usage
      - lemma: "لِيُون بَاتِيسْتَا أَلْبِرْتي"
        examples:
          - text: >
              أَلَّفَ لِيُون بَاتِيسْتَا أَلْبِرْتي كِتَابَهُ «فِي الْفَنِّ الْمِعْمَارِيِّ»
              الَّذِي غَدَا مَرْجِعاً أَسَاسِيًّا لِمَنَاهِجِ الْعِمَارَةِ فِي أُورُوبَّا.
