# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان خاليتان من التشكيل: ألبرتي، وليون باتيستا ألبرتي"
      - "المجموعة تعتمد pos: n لكن مضمونها اسم علم (proper noun)؛ WordNet لا يميّز بين n وproper_noun، لكن يُستحسن التوثيق"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية وخالٍ من التشكيل؛ يحتاج صياغة أكاديمية معجمية"
      - "لا تعريف موسوعي كافٍ يوضّح مكانة الشخصية وأثرها في تاريخ العمارة"
    observations: >
      هذه المجموعة تمثّل اسم علم لشخصية تاريخية إيطالية من عصر النهضة.
      التعامل مع الأسماء الأعلام في الشبكة الدلالية يقتصر على تعريب صوتي (تعريب)؛
      لا مجال هنا للاشتقاق أو المجاز أو التركيب. المرشحات الأعمى ستكون تعريبات بديلة
      أو صيغاً مختصرة/مطوّلة للاسم نفسه. التعريف يستدعي صياغة موسوعية وفق أسلوب
      الأعلام في المعجم الوسيط.

  blind_candidates:
    - lemma: "أَلْبِرْتي"
      generation_method: taarib
      justification: >
        انطلاقاً من التعريف (معماري ورسام إيطالي، منظّر عمارة النهضة، 1404-1472)
        تُحدَّد الشخصية بصورة شبه قاطعة بـ Leon Battista Alberti. الصيغة المختصرة
        "أَلْبِرْتي" هي تعريب مباشر للكنية الإيطالية Alberti، وهي الصيغة الأكثر
        شيوعاً في الكتابات العربية المتخصصة بتاريخ العمارة.
    - lemma: "لِيُون بَاتِيسْتَا أَلْبِرْتي"
      generation_method: taarib
      justification: >
        الاسم الكامل الثلاثي المركّب: Leon Battista Alberti. يُستخدم في الإحالات
        الأكاديمية الرسمية والذكر الأول في النصوص البحثية. التعريب يحافظ على الأجزاء
        الثلاثة: الاسم الأول Leon = لِيُون، والاسم الأوسط Battista = بَاتِيسْتَا،
        والكنية Alberti = أَلْبِرْتي.
    - lemma: "لِيُون أَلْبِرْتي"
      generation_method: taarib
      justification: >
        صيغة مختصرة ثنائية المركّب تحذف الاسم الأوسط Battista وتُبقي على الاسم الأول
        والكنية. صيغة متداولة في بعض المصادر الثقافية العربية المعاصرة للإحالة إلى
        الشخصية دون الاسم الكامل.
    - lemma: "بَاتِيسْتَا أَلْبِرْتي"
      generation_method: taarib
      justification: >
        صيغة ثنائية تحذف الاسم الأول وتُبقي على الاسم الأوسط والكنية. نادرة الاستعمال
        لكن تظهر في بعض المراجع المتخصصة. أُدرجت لاستيفاء التغطية وتقديم بديل للصيغة
        الثنائية الأخرى (لِيُون أَلْبِرْتي).


