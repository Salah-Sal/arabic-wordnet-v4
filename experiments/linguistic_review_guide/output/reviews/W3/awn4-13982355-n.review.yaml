stage1_review:
  assessment:
    concerns:
      - "لمّة «تواجد» تدل في الاستعمال المعاصر على الوجود والحضور لا على الحدوث، فهي أقرب إلى دلالة المجموعة الأعلى (حالة الوجود الحاضر) منها إلى هذه المجموعة"
      - "التعريف العربي الحالي «حالة حدوث شيء ما» فيه دوران مع اللمّة «حدوث»"
    observations: "المجموعة تمثّل مفهوم تحقّق الشيء ونشوئه بعد أن لم يكن، وهو مفهوم مجرّد يُعبَّر عنه في العربية بالمصادر الدالّة على الكون والوقوع. الأوزان المصدرية (فُعُول) هي الأنسب لهذا المفهوم."
  blind_candidates:
    - lemma: "وُقُوعٌ"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر «وقع» على وزن فُعُول، يدلّ على تحقّق الأمر وحصوله، مناسب تماماً لمفهوم الحدوث المجرّد"
    - lemma: "حَدَثٌ"
      generation_method: ishtiqaq
      justification: "اسم من الجذر «حدث»، يدلّ على الأمر الذي يقع ويتحقّق، مستعمل في الاصطلاح الحديث بمعنى الواقعة"
    - lemma: "وَاقِعَةٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل مؤنث من «وقع» على فَاعِلَة، تدلّ على الأمر المتحقّق الكائن، وهي في الفلسفة ما حدث ووُجد"
    - lemma: "طُرُوءٌ"
      generation_method: ishtiqaq
      justification: "مصدر من «طرأ» على وزن فُعُول، يدلّ على بروز الشيء ونشوئه"

stage2_evidence:
  per_lemma:
    - lemma: "تَوَاجُدٌ"
      contradicts:
        - text: "«التواجُدُ: استدعاء الوجد بِضَرْب من الِاخْتِيَار، وَقيل: ظُهُور مَا يحدث فِي بَاطِنه على ظَاهره»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المعنى الأصلي للتواجد هو استدعاء الوجد الصوفي لا الحدوث أو الوقوع"
        - text: "«التواجد: استدعاء الوجد تكلفا بضرب اختيار وليس لصاحبه كمال الوجد لأن باب التفاعل أكثره لإظهار صفة غير موجودة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "التواجد في الأصل تكلّف إظهار الوجد، لا دلالة على الحدوث"
        - text: "«التواجد: استدعاء الوجد تكلفًا بضرب اختيار، وليس لصاحبه كمال الوجد»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "تأكيد ثالث على أنّ المعنى الأصلي صوفي لا صلة له بمفهوم الحدوث"
      expands:
        - text: "«تواجُد — مثال: عليكم التواجد في أماكنكم في التاسعة صباحًا — الرأي: مرفوضة — السبب: لأنّها لم ترد في المعاجم القديمة بهذا المعنى. المعنى: الوجود — الصواب والرتبة: عليكم الوجود في أماكنكم [فصيحة] - عليكم التواجد في أماكنكم [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "التواجد بمعنى الوجود مولَّد مقبول حديثاً، لكنّه يدلّ على الحضور في مكان لا على حدوث شيء ما"

    - lemma: "حُدُوثٌ"
      confirm:
        - text: "«الحُدُوثُ: كَون الْوُجُود مَسْبُوقا بِالْعدمِ، وَقيل: هُوَ الْخُرُوج من الْعَدَم»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الحدوث: وجود الشيء بعد عدمه عرضا أو جوهرا، وإحداثه إيجاده»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الحُدُوث: عبارة عن وجود الشيء بعد عدمه»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«(1) حادثة. وبخاصة: مصادفة an unusual occurrence — (2) حدوث of rare occurrence»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الحدوث: يستدعي مدة أي زمانا ومادة أي محلا إمّا موضوعا إن كان الحادث عرضا، وإمّا هيولى إن كان صورة، وإمّا جسما يتعلق به إن كان نفسا»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "الحدوث عند الحكماء يستلزم زماناً ومادة، وهو إضافي وحقيقي، ذاتي وزماني"

    - lemma: "وُقُوعٌ"
      confirm:
        - text: "«الوقوع: ثبوت الشيء وسقوطه. والواقعة لا تقال إلا في الشدة والمكروه، وأكثر ما جاء في القرآن من لفظ وقع جاء في العذاب والشدائد. ووقوع القول: حصول متضمنه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(1) «أ» حدوث؛ وقوع. «ب» مدى الحدوث أو التأثير»"
          source: "المورد الحديث (2008)"

    - lemma: "حَدَثٌ"
      confirm:
        - text: "«(الْحَدث) الصَّغِير السن وَالْأَمر الْحَادِث الْمُنكر غير الْمُعْتَاد... حدث الدَّهْر نائبته»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«حَدَثٌ — فعلٌ يولِّده المستخدِمُ غالباً، ويمكِن أن يستجيبَ له البرنامج»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      contradicts:
        - text: "«الحَدَث: أَمر معنوي على سَائِر الْبدن، أَو أَعْضَاء الْوضُوء، مَانع من صِحَة الصَّلَاة»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الدلالة الفقهية الشائعة (النجاسة الحكمية) تُشكّل اشتراكاً لفظياً قوياً"
        - text: "«الحَدَث: الصغير السّنّ — الأمر الحادث: المنكر غير المعتاد — (عند الفقهاء): النَّجاسة الحُكْميَّة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "تعدّد المعاني الشائعة (صغير السن، النجاسة) يُضعف وضوح الدلالة المرادة"

    - lemma: "وَاقِعَةٌ"
      confirm:
        - text: "«(الْوَاقِعَة) الْقِيَامَة والنازلة من صروف الدَّهْر والمصادمة... و(فِي الفلسفة) مَا حدث وَوجد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«الواقعة: عند أهل الله، ما يرد على القلب من ذلك العالم بأي طريق كان من خطاب أو مثال»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الدلالة الصوفية الخاصة، والدلالة على الشدة والنازلة أخصّ من مطلق الحدوث"

    - lemma: "طُرُوءٌ"
      evidence_status: "no_material_found"

