# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14439493-n
# the condition of being concealed or hidden
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «حالة الاخفاء أو الكتمان» يحتوي على خطأ إملائي: «الاخفاء» صوابها «الإخفاء» بهمزة القطع"
      - "لمّة «خصوصية» أقرب دلالياً إلى مفهوم privacy بمعنى الحق الشخصي في العزلة، لا بمعنى حالة الإخفاء والستر المقصودة هنا"
      - "اللمّات الثلاث تغطي طيفاً واسعاً: خصوصية (حق شخصي)، سرية (صفة المعلومة)، كتمان (فعل الإخفاء) — تداخل محدود مع المعنى الأصلي"
      - "اللمّات تفتقر إلى التشكيل الكامل"
    observations: "المجموعة الترادفية تدور حول حالة الاستتار والخفاء، وهي حالة وجودية لا فعل إرادي. اللمّات الموجودة تميل نحو المعنى الإرادي (كتمان/سرية) أو نحو مفهوم الحق الشخصي (خصوصية). يحتاج الطقم إلى لمّة تعبّر عن الحالة ذاتها لا عن الفعل."
  blind_candidates:
    - lemma: "تَكَتُّم"
      generation_method: ishtiqaq
      justification: "مصدر تَكَتَّمَ على وزن تَفَعُّل، يدل على حالة الإخفاء المستمرة والمطاوعة، وهو أقرب إلى معنى الحالة من المصدر الثلاثي كَتْم"
    - lemma: "اسْتِتَار"
      generation_method: ishtiqaq
      justification: "مصدر اسْتَتَرَ على وزن اسْتِفْعَال، يدل على حالة الاختفاء والتواري، ومطابق لمعنى being concealed"
    - lemma: "خَفَاء"
      generation_method: ishtiqaq
      justification: "اسم من خَفِيَ على وزن فَعَال، يدل على حالة الاستتار والتواري، وردت في لسان العرب وغيره بمعنى السر"
    - lemma: "إِسْرَار"
      generation_method: ishtiqaq
      justification: "مصدر أَسَرَّ على وزن إِفْعَال، يدل على إخفاء الشيء وكتمه، من جذر سرّ الذي يجمع فروعه إخفاء الشيء كما في مقاييس اللغة"


stage2_evidence:
  per_lemma:
    - lemma: "خُصُوصِيَّة"
      confirm:
        - text: "«خُصُوصِيَّةُ الشىءِ: خاصِيَّتُه, أو ما يَتَمَيَّزُ به دُونَ غيرِه»"
          source: "المعجم الكبير"
        - text: "«حالة الخصوص خصوصيَّة الشيء: خاصيتُه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«خُصُوصِيَّةُ الشىءِ: خاصِيَّتُه, أو ما يَتَمَيَّزُ به دُونَ غيرِه»"
          source: "المعجم الكبير"
          conflict: "المعاجم العربية الكلاسيكية تعرّف الخصوصية بمعنى الخاصية والتميز، لا بمعنى الإخفاء والستر"
      expands:
        - text: "«الحق في التحكم في الوصول إلى العناصر المادية والمعلومات الشخصية واستخدامها»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "الاستعمال الحديث لـ«خصوصية» كمقابل لـ privacy يركز على حق التحكم بالمعلومات الشخصية"
        - text: "«مفهومٌ ينطوي على عدم اطّلاعِ أيّ شخصٍ على معلوماتِ مستخدِمٍ ما... من قبيل الملفات المخزَّنة والبريد الإلكتروني دون موافقته»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "دلالة حديثة تقنية تربط الخصوصية بحماية المعلومات"

    - lemma: "سِرِّيَّة"
      confirm:
        - text: "«سِرِّيَّة: من (س ر ر) نسبة إلى السِّرّ: ما تكتمه وتخفيه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«سِرِّيّة؛ كتمان»"
          source: "المورد الحديث (2008) — ترجمة secrecy"
      expands:
        - text: "«سرية» = confidentiality"
          source: "موسوعة الكهرباء IEC 60050"
          addition: "استعمال تقني حديث بمعنى السرية المعلوماتية"
        - text: "«سرية» = confidentiality"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "استعمال قانوني يؤكد دلالة الكتمان والإخفاء"

    - lemma: "كِتْمَان"
      confirm:
        - text: "«كَتَمْتُ الْحَدِيثَ كَتْمًا وَكِتْمَانًا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الاحتفاظ بخبر وعدم إذاعته بين الناس»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«بَاب الكتمان: أخْفى وَأسر وجن وضن وطوى وابطن واضمر وكتم وأغضى وأكن وَستر وغطى»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
      expands:
        - text: "«تكتُّم؛ سِرّيّة» = secrecy"
          source: "المورد الحديث (2008)"
          addition: "يربط الكتمان والتكتم بالسرية في حقل دلالي واحد"

    - lemma: "تَكَتُّم"
      confirm:
        - text: "«تكتُّم؛ سِرّيّة» = secrecy"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْكَافُ وَالتَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِخْفَاءٍ وَسَتْرٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر كتم يدل أصلاً على الإخفاء والستر، والتكتم صيغة مطاوعة تدل على حالة الإخفاء"

    - lemma: "اسْتِتَار"
      confirm:
        - text: "«كُمون؛ استتار» = latency"
          source: "المورد الحديث (2008)"
        - text: "«استتار؛ احتجاب» = occultation"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«السِّينُ وَالتَّاءُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى الْغِطَاءِ. تَقُولُ: سَتَرْتُ الشَّيْءَ سَتْرًا. وَالسُّتْرَةُ: مَا اسْتَتَرْتَ بِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ستر يدل على الغطاء والحجب"

    - lemma: "خَفَاء"
      confirm:
        - text: "«بَرِحَ الخَفَاءُ, أي: وَضَحَ الأمرُ, وظَهَر وصار مُنْكَشِفًا في بَرَاحٍ وقيل: الخفاءُ هُنا: السِّرُّ»"
          source: "المعجم الكبير"
        - text: "«الخَفَاء: من الأضداد يقال خفي عليه الأمر إذا استتر»"
          source: "التعريفات الفقهية للبركتي"
      contradicts:
        - text: "«الخِفَاءُ: الكِساءُ, والغِطاءُ. سُمِّىَ بذلك لأنَّه يُلْقَى على السِّقَاءِ ونحوِهِ فَيُخْفِيهِ»"
          source: "المعجم الكبير"
          conflict: "الخِفَاء بالكسر يعني الكساء والغطاء (اسم عين لا اسم معنى)، فيحتاج التفريق بين الفتح والكسر"
      expands:
        - text: "«الْخَاءُ وَالْفَاءُ وَالْيَاءُ أَصْلَانِ مُتَبَايِنَانِ مُتَضَادَّانِ. فَالْأَوَّلُ السَّتْرُ، وَالثَّانِي الْإِظْهَارُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر خفي من الأضداد: يدل على الستر وعلى الإظهار"

    - lemma: "إِسْرَار"
      confirm:
        - text: "«السِّينُ وَالرَّاءُ يَجْمَعُ فُرُوعَهُ إِخْفَاءُ الشَّيْءِ... فَالسِّرُّ: خِلَافَ الْإِعْلَانِ. يُقَالُ أَسْرَرْتُ الشَّيْءَ إِسْرَارًا، خِلَافَ أَعْلَنْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«سِرِّيَّة: من (س ر ر) نسبة إلى السِّرّ: ما تكتمه وتخفيه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "السرية مشتقة من نفس الجذر سرر"


stage3_analysis:
  per_lemma:
    - lemma: "خُصُوصِيَّة"
      decision: confirmed
      decision_reason: "رغم أن الدلالة المعجمية الأصلية هي الخاصية والتميز، إلا أن الاستعمال الحديث الراسخ أعطاها دلالة privacy بمعنى حماية الحياة الخاصة من الاطلاع، وهي متداولة في النصوص القانونية والتقنية. تُبقى مع التنبيه على أنها أقرب إلى privacy منها إلى concealment."
      evidence_assessment:
        case: mixed
      mwe_check:
