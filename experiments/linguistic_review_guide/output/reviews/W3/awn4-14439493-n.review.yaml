      nuance_differentiation: "تدل على صفة ما يُحاط بالكتمان ويُحفظ من الإفشاء (بُعد وصفي لحالة المعلومة)، بخلاف الكتمان الذي يدل على فعل الإخفاء نفسه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِرِّيَّة"

    - lemma: "كِتْمَان"
      decision: confirmed
      decision_reason: "مؤكد بقوة في مقاييس اللغة والمعاجم الكلاسيكية والحديثة. الجذر كتم أصل صحيح يدل على الإخفاء والستر، والكتمان مصدره الدال على حالة الإخفاء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على فعل إخفاء الخبر وعدم إذاعته بين الناس (بُعد إرادي فاعلي)، وهو أقرب اللمّات إلى المعنى الأصلي للمجموعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِتْمَان"

    - lemma: "تَكَتُّم"
      source: stage1
      decision: removed
      decision_reason: "رغم صحة اللفظ وتأييد المورد الحديث له كمرادف لـsecrecy، إلا أنه قريب جداً من كِتْمَان في الدلالة (كلاهما من جذر كتم)، وإضافته لا تثري المجموعة بفارق دلالي واضح. الكتمان مصدر ثلاثي أصيل والتكتم مصدر خماسي مطاوع."

    - lemma: "اسْتِتَار"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر استتر على وزن استفعال، يدل على حالة التواري والاختفاء، وهو الأقرب إلى المعنى الإنجليزي being concealed. مؤيَّد بالمورد الحديث وبمقاييس اللغة. يسدّ فجوة دلالية في المجموعة بالتعبير عن الحالة لا الفعل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على حالة التواري والاختفاء عن الأنظار (بُعد وجودي حالي)، بخلاف الكتمان الذي يدل على فعل إرادي والسرية التي تصف صفة المعلومة"
      actions:
        - command: create_entry
          params: {lemma: "اسْتِتَار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "خَفَاء"
      source: stage1
      decision: removed
      decision_reason: "لفظ من الأضداد (يدل على الستر وعلى الإظهار)، وأغلب استعمالاته المعجمية في تعبير «برح الخفاء» بمعنى وضح الأمر. كما أن الخِفَاء بالكسر يعني الكساء، فالالتباس وارد. لا يُضاف تجنباً للإشكال."

    - lemma: "إِسْرَار"
      source: stage1
      decision: removed
      decision_reason: "مصدر أَسَرَّ يدل على فعل الإخفاء الإرادي لا على حالة الاستتار. كما أن الجذر سرر من الأضداد (أسررت الشيء قد تعني أظهرته). والمجموعة مخدومة كفاية بـسِرِّيَّة من نفس الجذر."


