          درَّس الاقتصاد السياسي في جامعة ماكجيل، واشتُهر أكثر بمؤلفاته الهزلية
          الساخرة كـ«رسومات شمس الإشراق» (١٩١٢) و«انتكاسات أدبية» (١٩١٠).
    actions:
