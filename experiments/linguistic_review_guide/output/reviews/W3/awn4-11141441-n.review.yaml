      nuance_differentiation: >
        اللقب وحده؛ يُستخدم للإحالة المختصرة في السياق الأكاديمي والنقدي عند
        الإحالة الثانية فأكثر إلى الكاتب، كما هو متعارف عليه في الكتابة الأكاديمية.
      actions:
        - command: create_entry
          params:
            lemma: "لِيكُوك"
            pos: n
        - command: add_sense
          params:
