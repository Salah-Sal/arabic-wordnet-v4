# ── المرحلة ١: المراجعة والتوليد (قراءة عمياء) ────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ستيفن ليكوك» مكتوبة بدون تشكيل كامل"
      - "غياب اللمّات الموازية للصيغ الإنجليزية الثلاث: اللقب المنفرد (Leacock)، والاسم الكامل (Stephen Butler Leacock)"
      - "التعريف العربي ترجمة حرفية آلية بأسلوب ركيك، لا يتبع أسلوب التعريف البيوغرافي في المعجم الوسيط"
      - "الفعل «يُذكر بشكل أفضل» أسلوب غير معجمي؛ الأنسب: «اشتُهر أكثر بـ»"
    observations: >
      هذه المجموعة الترادفية اسمٌ عَلَم شخصي لستيفن بتلر ليكوك (1869-1944)،
      الاقتصادي الكندي الذي اكتسب شهرته الأوسع من مؤلفاته الهزلية والساخرة.
      اللمّات في هذا النوع من المجموعات لا تُولَّد بالاشتقاق أو المجاز بل بالتعريب
      الصوتي (تعريب لغوي). القراءة العمياء تُظهر أن التعريف يشير بوضوح إلى شخص
      بعينه بمواصفات دقيقة (مهنة + جنسية + تاريخَي الولادة والوفاة)، مما يستلزم
      صياغة بيوغرافية لا وصفية عامة.

  blind_candidates:
    - lemma: "لِيكُوك"
      generation_method: taarib
      justification: >
        تعريب صوتي للقب «Leacock» وحده؛ في الكتابة الأكاديمية العربية يُكتفى
        باللقب عند الإحالة الثانية أو في السياقات الاختصارية.
    - lemma: "سْتِيفِن لِيكُوك"
      generation_method: taarib
      justification: >
        تعريب الاسم الأول واللقب معاً؛ الصيغة الأكثر تداولاً في المصادر العربية
        لأعلام الشخصيات الناطقة بالإنجليزية.
    - lemma: "سْتِيفِن بَتلَر لِيكُوك"
      generation_method: taarib
      justification: >
        الاسم الرسمي الكامل متضمناً الاسم الأوسط «Butler»؛ يُستخدم في السياقات
        الببليوغرافية والأكاديمية والفهارس الرسمية.
    - lemma: "إِسْتِيفِن لِيكُوك"
      generation_method: taarib
      justification: >
        نقل صوتي بديل يُضيف همزة الوصل «إ-» تسهيلاً للنطق العربي في بعض
        المراجع؛ غير أنه أقل انتشاراً من الصيغة بدون همزة.


