        التعريف الحالي ترجمة حرفية للنص الإنجليزي بأسلوب ركيك. «يُذكر بشكل أفضل»
        ترجمة غير اصطلاحية لـ«best remembered for»؛ الأنسب «اشتُهر أكثر بـ».
        التعريف يفتقر إلى الأسلوب البيوغرافي الموجز المعهود في المعاجم الموسوعية
        العربية، كما أنه يُقدّم المهنة (اقتصادي) في مرتبة تسبق الشهرة (الكتابة الهزلية).
    authored:
