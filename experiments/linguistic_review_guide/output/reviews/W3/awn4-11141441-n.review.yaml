            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: سْتِيفِن بَتلَر لِيكُوك ──
    - lemma: "سْتِيفِن بَتلَر لِيكُوك"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الكامل الرسمي «Stephen Butler Leacock» موجود في lemmas_en بوصفه
        لمّة إنجليزية معتمدة. لا يوجد مسوّغ لحذفه من الجانب العربي. يُعدّ
        ضرورياً في الفهارس الرسمية والكتب المرجعية البيوغرافية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الاسم الرسمي الكامل متضمناً الاسم الأوسط؛ يُستخدم حصراً في السياقات
        الببليوغرافية الرسمية وترجمات الأعيان لتمييزه من أشخاص آخرين يحملون
