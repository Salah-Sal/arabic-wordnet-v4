# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّات موجودة ──

    - lemma: "السير إدوين لوتينز"
      decision: confirmed
      decision_reason: >
        الصيغة الرسمية الكاملة للاسم مع لقب الفروسية البريطاني، تقابل اللمّة الإنجليزية
        «Sir Edwin Lutyens»، وهي الصيغة الأوسع تداولاً في المراجع العربية. غياب الأدلة
        المعجمية طبيعي للأعلام الأجنبية. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الرسمية الأكثر شيوعاً في المصادر الموسوعية والتاريخية العربية، تجمع لقب
        الفروسية «السير» والاسم الشخصي «إدوين» واللقب العائلي «لوتينز»
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "السِّير إدوِين لُوتِينْز"

    - lemma: "لوتينز"
      decision: confirmed
      decision_reason: >
        اللقب المختصر يقابل اللمّة الإنجليزية «Lutyens»، وهو مبرَّر معجمياً كصيغة إحالة
        مختصرة شائعة الاستخدام في الكتابة الأكاديمية والصحفية العربية. يحتاج إلى تشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة المختصرة (اللقب العائلي وحده) المستخدمة في الإشارات الموجزة والسياق غير الرسمي
        وكتابات الفن والعمارة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُوتِينْز"

    # ── مرشحات المرحلة ١ ──

    - lemma: "لُوتِينْز"
      source: stage1
      decision: removed
      decision_reason: >
        هذه اللمّة تطابق اللمّة الموجودة «لوتينز» بعد إضافة التشكيل؛ تُعالَج بأمر update_lemma
        على المدخل الموجود لا بإنشاء مدخل مستقل

    - lemma: "السِّير إدوِين لُوتِينْز"
      source: stage1
      decision: removed
      decision_reason: >
        تطابق اللمّة الموجودة «السير إدوين لوتينز» بعد التشكيل؛ تُعالَج بأمر update_lemma
        على المدخل الموجود لا بإنشاء مدخل جديد

    - lemma: "السِّير إدوِين لانسِيير لُوتِينْز"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الثلاثي الكامل بما يشمل الاسم الأوسط Landseer (لانسيير) غائب في النسخة العربية
        الحالية رغم وجود ما يقابله في اللمّات الإنجليزية (Sir Edwin Landseer Lutyens).
        غياب الأدلة المعجمية طبيعي للأعلام الأجنبية. اجتاز اختبار التعبير المركب: الصيغة
        اصطلاحية ثابتة لشخص بعينه لا تقبل التبديل في مكوّناتها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الثلاثية الأكثر رسمية وتوثيقاً، تُستخدم في السياقات الأكاديمية والأرشيفية
        حيث يُذكر الاسم الكامل بما يشمل الاسم الأوسط
      actions:
        - command: create_entry
          params:
            lemma: "السِّير إدوِين لانسِيير لُوتِينْز"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُصمِّم نِيودِلْهِي"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ المعجمي: يمكن إبدال «نيودلهي» بأي مدينة أخرى ويبقى التعبير وصفياً
        صالحاً، مما يكشف أنه ليس مصطلحاً ثابتاً بل تعبير وصفي حر لا يصلح كاسم علم لشخص
        بعينه. كذلك فإن الشخصية مصمِّمة لأكثر من مبنى ومشروع واحد.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: proper_noun


