# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تُعنون شخصية فردية بعينها (اسم علم) وتُصنَّف pos: n في حين يُعدّ pos: proper_noun أدقّ وفق مخطط AWN4"
      - "اللمّتان الحاليتان «السير إدوين لوتينز» و«لوتينز» خاليتان من التشكيل الكامل"
      - "الاسم الأوسط Landseer موجود في اللمّات الإنجليزية (Sir Edwin Landseer Lutyens) لكن ليس له مقابل عربي في المجموعة"
      - "اللمّة الإنجليزية «Sir Edwin Landseer Luytens» تحتوي خطأً إملائياً: الصواب Lutyens لا Luytens"
    observations: >
      هذه المجموعة الترادفية خاصة بشخصية تاريخية فردية هي المهندس المعماري البريطاني السير إدوين
      لانسيير لوتينز (1869-1944)، مصمّم العاصمة الهندية نيودلهي. مثل هذه المجموعات لا تقبل مرادفات
      دلالية حقيقية بل صيغاً مختلفة للاسم العلم الواحد: المختصر (اللقب وحده)، والكامل مع لقب
      الفروسية، والثلاثي الكامل بالاسم الأوسط. جميع الصيغ العربية تعريب من الإنجليزية. المبدأ
      المعجمي الناظم هنا هو التعدُّد الاسمي لا الترادف الدلالي. لا يوجد جذر عربي لأيٍّ من المكوّنات
      إذ هي أسماء أعجمية مُعرَّبة. النمط الأسلوبي السائد في المعاجم الموسوعية العربية هو إثبات
      الصيغتين: الكاملة مع اللقب الفخري والمختصرة باللقب وحده.

  blind_candidates:
    - lemma: "لُوتِينْز"
      generation_method: taarib
      justification: >
        تعريب اللقب الإنجليزي Lutyens بالصيغة الشائعة في المصادر العربية للإشارة المختصرة
        إلى المهندس المعماري الذي وضع خطط نيودلهي
    - lemma: "السِّير إدوِين لُوتِينْز"
      generation_method: taarib
      justification: >
        الاسم الكامل مع لقب الفروسية البريطاني Sir المُعرَّب بـ«السير»، وهو الصيغة الرسمية
        الأكثر تداولاً في المصادر الموسوعية والتاريخية العربية
    - lemma: "السِّير إدوِين لانسِيير لُوتِينْز"
      generation_method: taarib
      justification: >
        الاسم الثلاثي الكامل بإضافة الاسم الأوسط Landseer المُعرَّب بـ«لانسيير»؛ يُستخدم
        في التوثيق الأكاديمي الرسمي حيث يُذكر الاسم الكامل
    - lemma: "مُصمِّم نِيودِلْهِي"
      generation_method: tarkib
      justification: >
        تعبير إضافي وصفي يُعرِّف الشخصية بمنجزها الأبرز؛ مرشَّح للاختبار المعجمي


