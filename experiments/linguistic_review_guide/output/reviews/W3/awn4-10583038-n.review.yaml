# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # التوليد الأعمى — قُرئ الملف المُقنّع أولاً، ثم وُلِّدت المرشحات
  blind_candidates:
    - lemma: "الْمُحجِم"
      generation_method: majaz
      justification: >
        من الفعل «أحجَمَ عن الشيء» = نكص وكفّ. إزاحة دلالية من سياق
        التوقف عن الفعل خوفاً إلى سياق الانسحاب من المنافسة؛ كلاهما
        يدلّ على التراجع عن الاستمرار. وزن مُفعِل من الرباعي أحجم.

    - lemma: "الْمُنكِص"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «نكَص» (وزن فَعَل)، ومعناه الراجع المتراجع. الجذر
        نكص جاء في المعاجم بمعنى الرجوع والانصراف. الوزن مُفعِل يدلّ
        على الفاعلية.

    - lemma: "الْمُعتَزِل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «اعتزل» (وزن افتعل)، ومعناه المتنحّي والمبتعد.
        الجذر عزل يدلّ على التنحية والإمالة عن الجانب الآخر، وهو ما
        يلتقي مع فكرة الانسحاب من المنافسة.

    - lemma: "تَارِك الْمِنَافَسَة"
      generation_method: tarkib
      justification: >
        مركب إضافي: «تارك» (اسم فاعل من ترك) + «المنافسة» مضاف إليه.
        يصف بوضوح من تخلّى عن المنافسة وتركها.

  # التقييم الأولي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "اللمة الوحيدة «منسحب» مجرّدة من التشكيل الكامل."
      - >
        التعريف العربي دوريّ: يستخدم «منافس» و«منافسة» المشتركَيْن
        في الجذر نفسه (ن-ف-س)، مما يُفضي إلى الدوران المعجمي.
      - "المجموعة فقيرة: تضمّ لمة واحدة فقط مع غياب أي مرادف أو بديل."
    observations: >
      «مُنسَحِب» اسم فاعل من الفعل «انسحب» (الباب الخامس: انفعل من
      سحب). الوزن المُنفَعِل مناسب صرفياً للدلالة على المطاوعة
      والانعكاس الذاتي. الجذر سحب يدلّ أصالةً على الجرّ والمدّ، ثم
      امتدّ مجازاً إلى التراجع والخروج في الاستعمال الحديث. المعاجم
      الحديثة (الوسيط، الكبير، صواب عمر) أقرّت هذا الاستعمال صريحاً.
      المفهوم الإنجليزي «scratch» في سياق المنافسة الرياضية يعني
      الشخص الذي شُطب اسمه من قائمة المتنافسين بانسحابه، وهو ما
      يُعادله «منسحب» بدقة. الجذر سحب أفضل لهذه الدلالة من نكص
      (ذو تلوين سلبي أخلاقي) ومن عزل (محمّل بالحقل الديني/الفكري).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  query_log:
    - seq: 1
      purpose: "مطابقة دفعية — اللمة الموجودة + المرشحات الأربعة"
      terms: ["منسحب","المنسحب","محجم","المحجم","منكص","المنكص","معتزل","المعتزل","تارك المنافسة","تارك"]
    - seq: 2
      purpose: "جسر إنجليزي — scratch / withdrawn / withdrawal / retire / dropout"
    - seq: 3
      purpose: "البحث عن انسحب/انسحاب/منسحب بشكل مباشر"
    - seq: 4
      purpose: "FTS عربي — انسحب OR انسحاب OR منافسة OR منسحب"
    - seq: 5
      purpose: "مقاييس اللغة لابن فارس — جذور: سحب، نكص، عزل، حجم، ترك"
    - seq: 6
      purpose: "إثراء بالمعرّف — تعريفات وشواهد لمداخل انسحب/المنكص"

  per_lemma:

    # ── اللمة الموجودة ──────────────────────────────────────
    - lemma: "منسحب"
      confirm:
        - text: >
            «انْسَحَبَ فلانٌ من المجلسِ، وغيرِه: خَرَجَ منه لِعِلَّةٍ.
            [شاهد:] انْسَحَبَ الجيشُ من المَيْدانِ»
          source: "المعجم الكبير (OCR)"
        - text: >
            «انسحب فلانٌ من المجلس: خرج منه لسبب ما (محدثة)،
            ويُقال: انسحب الجيش من الميدان»
          source: "المعجم الوسيط (hawramani)"
        - text: >
            «مثال: انسحب الجيش — الرأي: فصيحة — التعليق: جاء في
            القاموس: سحبه: جره على وجه الأرض فانسحب، والصلة واضحة
            بين هذا المعنى ومعنى التراجع والتقهقر. وقد سجّلت المعاجم
            الحديثة كالوسيط والأساسي هذا الاستعمال الجديد، وشاع على
            أقلام الكتّاب بمعنى قريب كقول ميخائيل نعيمة: انسحبتُ من
            العالم الخارجي، وقول نجيب محفوظ: بحث عن وسيلة لبقة
            ينسحب بها من المجلس»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"

    # ── المرشح ١: المحجم ────────────────────────────────────
    - lemma: "الْمُحجِم"
      contradicts:
        - text: >
            «(المحجم) موضع الحجامة. (المحجم) أداة الحجم والقارورة
            التي يُجمَع فيها دم الحجامة»
          source: "المعجم الوسيط (hawramani)"
          conflict: >
            «المحجم» الوارد في المعاجم هو اسم مكان (موضع الحجامة)
            أو اسم آلة (أداة الحجامة)، لا اسم فاعل من «أحجم». المعنى
            المطلوب «مُحجِم» (بكسر الجيم) من أحجَم، لكن اللبس
            الصوتي/الخطيّ مع «مَحجَم» (بفتح الجيم) شديد.
        - text: >
            «مَا يُحْجَمُ بِهِ: الكأسُ أو القارورة التي يُجمَع فيها
            دَمُ الحِجَامَةِ عند المصّ؛ مِشرَطُ الحَجَّام»
          source: "المعجم الكبير (OCR)"
          conflict: >
            المدخل في المعجم الكبير يوثّق «المَحجَم» (اسم آلة) لا
            «المُحجِم» (اسم فاعل)، مما يُنبئ بضعف التمييز في الكتابة
            غير المُشكَّلة ويُفضي إلى اشتراك لفظي مُلبِس.
      expands:
        - text: >
            «الْحَاءُ وَالْجِيمُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ
            ضَرْبٌ مِنَ الْمَنْعِ وَالصَّدْفِ. يُقَالُ أَحْجَمْتُ
            عَنِ الشَّيْءِ، إِذَا نَكَصْتَ عَنْهُ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الأصل اللغوي يؤيّد أن أحجم = نكص وكفّ، وهو ما يدعم
            الإزاحة الدلالية المقترحة للوصف. لكن الاشتراك اللفظي مع
            اسم الآلة «المَحجَم» يبقى عقبة عملية.

    # ── المرشح ٢: المنكص ────────────────────────────────────
    - lemma: "الْمُنكِص"
      confirm:
        - text: >
            «(المنكص) المتنحّي وموضع النكوص»
          source: "المعجم الوسيط (hawramani)"
        - text: >
            «الْمَنْكَصُ: الْمَتَنَحَّى؛ موضع النكوص»
          source: "المعجم الوسيط (OCR)"
      contradicts:
        - text: >
            «نَكَصَ عَلَى عَقِبَيْهِ، إِذَا أَحْجَمَ عَنِ الشَّيْءِ
            خَوْفًا وَجُبْنًا. قَالَ ابْنُ دُرَيْدٍ: نَكَصَ عَلَى
            عَقِبَيْهِ: رَجَعَ عَمَّا كَانَ عَلَيْهِ مِنْ خَيْرٍ;
            لَا يُقَالُ ذَلِكَ إِلَّا فِي الرُّجُوعِ عَنِ الْخَيْرِ»
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            ابن فارس يُقيّد النكوص بالرجوع عن الخير وبالجبن والخوف،
            مما يجعل «المنكص» حكماً قيمياً سلبياً على الشخص لا وصفاً
            تقنياً محايداً. فضلاً عن أن «المنكَص» في المعاجم يعني
            المكان لا الشخص.

    # ── المرشح ٣: المعتزل ──────────────────────────────────
    - lemma: "الْمُعتَزِل"
      confirm:
        - text: >
            «مُعْتَزِل: المتنحّي والمبتعد؛ أو واحد المعتزلة بمعنى
            فرقة من المتكلمين يخالفون أهل السنة في بعض المعتقدات»
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: >
            «أو واحد المعتزلة بمعنى فرقة من المتكلمين يخالفون أهل
            السنة في بعض المعتقدات»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            «المعتزل» محمّل بالحقل الديني/الفكري (المعتزلة)، مما
            يجعل استخدامه في السياق الرياضي مُلتبساً وغير مناسب.
      expands:
        - text: >
            «الْعَيْنُ وَالزَّاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ
            عَلَى تَنْحِيَةٍ وَإِمَالَةٍ؛ تَقُولُ: عَزَلَ الْإِنسَانُ
            الشَّيْءَ يَعْزِلُهُ، إِذَا نَحَّاهُ فِي جَانِبٍ. وَهُوَ
            بِمَعْزِلٍ وَفِي مَعْزِلٍ مِنْ أَصْحَابِهِ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الأصل اللغوي يدلّ على التنحية والابتعاد، وهو ملائم دلالياً،
            لكن التحميل الاصطلاحي الديني يعوق توظيفه.

    # ── المرشح ٤: تارك المنافسة ─────────────────────────────
    - lemma: "تَارِك الْمِنَافَسَة"
      expands:
        - text: >
            «(تَرَكَ) التَّاءُ وَالرَّاءُ وَالْكَافُ: التَّرْكُ
            التَّخْلِيَةُ عَنِ الشَّيْءِ، وَهُوَ قِيَاسُ الْبَابِ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر «ترك» يدلّ على التخلية وهو مناسب دلالياً، لكن
            «تارك المنافسة» عبارة وصفية حرة لا مصطلح مسكوك، وتفشل
            اختبار الثبات المعجمي.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمة الموجودة: منسحب ──────────────────────────────
    - lemma: "منسحب"
      decision: confirmed
      decision_reason: >
        اللمة صحيحة صرفياً وموثّقة في المعاجم الحديثة الكبرى.
        «انسحب» بمعنى الخروج والتراجع أقرّه المعجم الكبير والوسيط
        ومعجم الصواب اللغوي صريحاً بوصفه فصيحاً. اسم الفاعل «مُنسَحِب»
        قياسي (وزن مُنفَعِل). اللمة تفتقر إلى تشكيل كامل فتحتاج تحديثاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check:
        weight: "مُنفَعِل (اسم فاعل من انفعل)"
        root: "سحب"
        function_fit: "مناسب — الوزن يدلّ على المطاوعة والذاتية، وهو يلائم الانسحاب الإرادي"
      borrowing_check:
        type: ishtiqaq
        verdict: "مشتق عربي خالص"
      quality_gate:
        ittiraad: "مطّرد — انسحب/منسحب قياسي على وزنه"
        yusr: "سهل التداول في السياق الرياضي والإعلامي"
        mulaama: "ملائم — لا يحمل حكماً قيمياً سلبياً"
        turaathi: "محدث مُقرّ، الأصل تراثي (جذر سحب)"
        arabi: "عربي خالص"
        ishtiqaqiyya: "مشتق قياسي"
      nuance_differentiation: >
        اللمة الوحيدة في المجموعة؛ لا حاجة لتمييز بينها وبين أشقاء
        في هذا السياق. تدلّ تحديداً على من أعلن انسحابه ولم يكمل
        المنافسة بخلاف «المهزوم» (من أكمل وخسر) أو «المتأخر» (المتقاعس).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْسَحِب"

    # ── المرشح ١: المحجم ────────────────────────────────────
    - lemma: "الْمُحجِم"
      source: stage1
      decision: removed
      decision_reason: >
        يعاني من اشتراك لفظي حاد مع «المَحجَم» (أداة الحجامة) في
        الكتابة غير المُشكَّلة. فضلاً عن ذلك يحمل «الإحجام» في
        التراث معنى الجبن والخوف (ابن فارس)، وهو حكم قيمي لا يناسب
        وصف الرياضي المنسحب من منافسة لأسباب قد تكون موضوعية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # ── المرشح ٢: المنكص ────────────────────────────────────
    - lemma: "الْمُنكِص"
      source: stage1
      decision: removed
      decision_reason: >
        وثّق ابن فارس صراحةً أن النكوص لا يُقال إلا في الرجوع عن
        الخير بجبن وخوف، وهو تلوين سلبي قيمي لا يصلح وصفاً تقنياً
        محايداً للمتنافس المنسحب. يُضاف إلى ذلك أن «المنكص» في
        المعاجم اسم مكان (موضع النكوص) لا اسم فاعل للشخص.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # ── المرشح ٣: المعتزل ──────────────────────────────────
    - lemma: "الْمُعتَزِل"
      source: stage1
      decision: removed
      decision_reason: >
        «المعتزل» مثقل بالحقل الديني/الكلامي (المعتزلة) مما يُفضي
        إلى التباس في أي سياق غير تخصصي في تاريخ الفكر الإسلامي.
        توظيفه في السياق الرياضي سيكون مُضلِّلاً ولن يُقبل في اللغة
        المعيارية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # ── المرشح ٤: تارك المنافسة ─────────────────────────────
    - lemma: "تَارِك الْمِنَافَسَة"
      source: stage1
      decision: removed
      decision_reason: >
        ليس مصطلحاً مسكوكاً ثابتاً؛ تفشل الجملة اختبار السكّ لأن
        «المنافسة» يمكن إبدالها بـ«السباق» أو «البطولة» فيبقى الوصف
        صالحاً، مما يُثبت أنها عبارة وصفية حرة لا وحدة معجمية ثابتة.
        لا أدلة على تقنين هذا المركب في أي معجم متخصص.
      evidence_assessment:
