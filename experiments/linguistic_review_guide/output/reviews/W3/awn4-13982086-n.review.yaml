# مراجعة المجموعة الترادفية — awn4-13982086-n (thereness)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«وجود هناك» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل اختبار السكّ (يمكن إبدالها بـ«كون هناك» أو «وجود هنالك»)"
      - "«هناكية» مصدر صناعي مولَّد من ظرف مكان، وهو تقليد حرفي للإنجليزية thereness — لا شاهد معجمي عليه"
      - "المفهوم فلسفي مجرد جداً (حالة الوجود هناك لا هنا) وليس له تعبير عربي راسخ"
    observations: >
      المجموعة تمثّل مفهوماً ظرفياً مكانياً مجرداً: حالة الوجود في مكان بعيد عن المتكلم مقابل القرب.
      الرأس الأعلى (hypernym) هو «حضور / وجود»، والمفهوم يخصّص الحضور بكونه في مكان بعيد (هناك) لا قريب (هنا).
      في العربية التراثية لا يوجد مصطلح اسمي مفرد يقابل thereness؛ التعبير الطبيعي يكون بالعبارة أو بالظرف نفسه.
      «هناكية» مقبولة صرفياً كمصدر صناعي من «هناك» لكنها مولَّدة حديثاً ولم تثبت في الاستعمال المعجمي.

  blind_candidates:
    - lemma: "هُنَاكِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الظرف «هُنَاك» على وزن فُعَالِيَّة، يدلّ على حالة الوجود هناك، قياساً على هُنَائِيَّة (hereness)"
    - lemma: "ثَمِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «ثَمَّ» الظرفية المكانية الفصيحة بمعنى هناك، أفصح من هناكية لأن «ثَمَّ» أصيلة في العربية القرآنية"
    - lemma: "بُعْدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «بُعْد»، يدلّ على حالة الوجود البعيد مكانياً — لكنه أعمّ من المطلوب إذ يشمل البعد الزمني"
    - lemma: "كَوْنٌ هُنَاكِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «كون» (وجود) و«هناكي» (منسوب إلى هناك) — لكنه يفشل اختبار السكّ لأنه ليس وحدة معجمية ثابتة"


