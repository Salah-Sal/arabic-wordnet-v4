stage3_analysis:
  per_lemma:
    - lemma: "هُنَاكِيَّة"
      decision: confirmed
      decision_reason: >
        مصدر صناعي صحيح التكوين من الظرف «هناك» على قياس المصادر الصناعية العربية (-يَّة).
        وإن لم يُسجَّل في المعاجم التراثية فهو مقبول بوصفه مصطلحاً فلسفياً مولَّداً يقابل thereness
        بشكل شفّاف ومباشر. يتوافق مع قاعدة إيثار المشتق العربي ويسهل تداوله.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح اسمي مفرد يدلّ على مفهوم الوجود هناك بصيغة مجردة فلسفية، أكثر اقتصاداً من العبارة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُنَاكِيَّة"

    - lemma: "وُجُود هُنَاك"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تفشل اختبار السكّ: يمكن إبدال «وجود» بـ«كون» أو «حضور» وتبقى صالحة كوصف،
        ويمكن إبدال «هناك» بـ«هنالك» أو «ثَمَّ». ليست وحدة معجمية ثابتة وإنما مركب نحوي حرّ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ثَمِّيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مصدر صناعي من «ثَمَّ» نظرياً ممكن، لكن «ثَمَّ» في الاستعمال الحديث تُفهم غالباً حرف عطف (ثُمَّ)
        لا ظرف مكان، مما يوقع في لبس. كما أن الجذر «ثمم» في مقاييس اللغة يدلّ على الجمع في لين (الثُّمام)
        لا على المكان البعيد، فالاشتقاق لا يستند إلى أصل دلالي واضح.
      evidence_assessment:
        case: no_material

    - lemma: "بُعْدِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصدر الصناعي «بُعْدِيَّة» من «بُعْد» يدلّ على حالة البعد عامّةً (مكاناً وزماناً ومعنًى)
        وليس على المفهوم المخصّص «الوجود هناك لا هنا». كما أن البعدية مصطلح مستعمل في سياقات أخرى
        (مقابل القَبْلِيَّة) فيقع اشتراك لفظي مُربك.
      evidence_assessment:
        case: no_material

    - lemma: "كَوْنٌ هُنَاكِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب وصفي حرّ يفشل اختبار السكّ — يمكن إبدال «كون» بـ«وجود» و«هناكي» بـ«بعيد»
        وتبقى الدلالة مفهومة. ليس وحدة معجمية ثابتة مسجلة.
      evidence_assessment:
        case: no_material


