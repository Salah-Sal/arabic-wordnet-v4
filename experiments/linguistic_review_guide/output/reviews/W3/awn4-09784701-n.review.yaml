# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُمَثِّل"
      decision: confirmed
      decision_reason: >
        اللمة موثقة توثيقاً قاطعاً في المعجم الوسيط وArabTerm والمورد الحديث بالمعنى
        المطلوب تحديداً (من يزاول مهنة التمثيل). الجذر مثل على وزن مُفَعِّل مناسب
        وظيفياً لأسماء مزاولي المهن. اجتازت جميع بوابات الجودة: الاطراد، يسر التداول،
        الملاءمة، الاشتقاقية. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُمَثِّل أخصُّ دلالةً من الفوقم (فنان ترفيهي) بكونه يتقمَّص شخصيةً أدبيةً أو
        تاريخيةً ويُجسِّدها بالكلام والحركة وفق نص موجَّه؛ يتمايز عن المغني والراقص
        والمهرِّج وإن اشتركوا في صفة الفاعلية الأدائية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُمَثِّل"

    - lemma: "مشخصاتي"
      decision: removed
      decision_reason: >
        صيغة عامية مصرية مُعرَّبة من التركية العثمانية عبر اللاحقة -اتي (= صاحب المهنة
        في اللهجة)؛ غائبة كلياً عن المعاجم الفصيحة والمصطلحية. لا تجتاز اختبار
        الفصاحة اللهجية ولا اختبار التوثيق المعجمي. تُستعاض عنها بـ(مُمَثِّل) المعياري.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُجَسِّد"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكلاسيكية تُثبت المُجَسَّد/المُجَسِّد على جذر (جسد) بمعنى الثوب
        الملامس للجسد، لا الممثل. الاستعمال الحديث (جسَّد الدور) فعلٌ لا اسمُ مهنة،
        ووجود المعنى اللباسي الراسخ يُشكِّل عائقاً دلالياً أمام التحويل المصطلحي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "حَاكٍ"
      source: stage1
      decision: removed
      decision_reason: >
        حاكي/حاكٍ مصطلح تقني مُستقرٌّ لجهاز الغراموفون في المعجمية العربية الحديثة،
        مما يُفضي إلى اشتراك لفظي قاتل مع معنى الممثل. فضلاً عن ذلك، جذر حوك/حيك
        راسخ في دلالة النسيج، وإحياء المعنى المحاكاتي لن يكتسب قبولاً في المشهد المعجمي
        الراهن.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "خَيَّال"
      source: stage1
      decision: removed
      decision_reason: >
        خيَّال بالتشديد ثابت في المعاجم بمعنى فارس الخيول لا الممثل، ولا يوجد أي
        استعمال معجمي مُوثَّق يربطه بالفن المسرحي. التوسيع الدلالي المقترح من خيال
        الظل يبقى افتراضاً غير مدعوم بشواهد.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُشَخِّص"
      source: stage1
      decision: removed
      decision_reason: >
        رغم شيوع (تشخيص الأدوار) فعلاً في الصحافة العربية، تُثبت المعاجم مُشَخِّص
        بمعنى المُميِّز والمحدِّد فحسب، ويرد المُشَخَّص بمعنى عملة ذهبية. غياب التوثيق
        المعجمي للمعنى التمثيلي يحول دون إضافته مصطلحاً في هذه المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فنان يؤدي أدواراً مسرحية أو تمثيلية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُقتَضَب ويكاد يتطابق مع تعريف الفوقم المباشر (فنان ترفيهي يؤدي
        عملاً درامياً). الفصل النوعي المميِّز للممثل — تقمُّص الشخصية وتجسيدها بالكلام
        والحركة — غائبٌ. كما أن الجمع بين (مسرحية أو تمثيلية) مُتداخل دلالياً
        إذ المسرحية نوعٌ فرعي من التمثيلية.
    authored:
      - type: terminological
        text: "فنانٌ يتقمَّصُ الشخصياتِ ويُؤدِّي الأدوارَ التمثيليةَ على خشبةِ المسرحِ أو أمامَ الكاميرا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          فنانٌ مُتخصِّصٌ في فنِّ التمثيل؛ يدرسُ النصَّ الدراميَّ ويستحضرُ الشخصيةَ
          بالتعبيرِ الجسديِّ والصوتيِّ والانفعاليِّ، سواءٌ أكانَ ذلك على خشبةِ المسرحِ،
          أم في الأفلامِ السينمائيةِ، أم في الأعمالِ التلفزيونية.
