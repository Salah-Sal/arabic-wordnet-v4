# AWN4 Review — awn4-09784701-n  |  actor / theatrical performer
# Pipeline v2 · 5 Stages
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (أعمى) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "مشخصاتي: صيغة عامية ذات لاحقة عثمانية (-اتي) دالة على الحرفة في اللهجة المصرية لا في الفصحى، وهي غائبة كلياً عن المعاجم الفصيحة والمصطلحية"
      - "كلتا اللمتين تفتقران إلى التشكيل الكامل في قاعدة البيانات"
      - "التعريف الحالي (فنان يؤدي أدواراً مسرحية أو تمثيلية) يحتمل التحسين؛ إذ يكاد يتطابق مع تعريف الفوقم المباشر"
    observations: >
      المجموعة الترادفية تصف الممثل المسرحي وهو مفهوم له تعبير عربي راسخ.
      اللمة الأولى (مشخصاتي) مشتقة من الفعل شخَّص لكنها تحمل اللاحقة العثمانية -اتي
      المألوفة في عامية القاهرة (كمثل: كوميدياتي، أوبراتي)، وهي غير مقبولة في الفصحى
      المعيارية. أما (ممثل) فهو المصطلح المعياري في العربية الحديثة بشهادة المعجم الوسيط
      والأكاديميات، ويستحق التأكيد والتشكيل. المجموعة تحتاج إلى حذف اللمة الدخيلة
      والإبقاء على المعيارية مع تحسين التعريف.
  blind_candidates:
    - lemma: "مُجَسِّد"
      generation_method: ishtiqaq
      justification: >
        من الفعل جَسَّدَ (جذر: جسد) على وزن مُفَعِّل للفاعلية؛ الممثل يُجسِّد الشخصية
        ويمنحها حضوراً ملموساً أمام الجمهور. الوزن مناسب لأسماء المهن الفنية
        (مُغنِّي، مُلحِّن، مُخرِج).
    - lemma: "حَاكٍ"
      generation_method: majaz
      justification: >
        إحياء دلالي من حكى (يحكي) بمعنى قلَّد وأشبه وحاكى؛ الحاكي في التراث العربي
        من يُشابه غيره ويُقلِّده، وهو جوهر عمل الممثل الذي يُقلِّد الشخصية ويستحضرها.
        الاسم الفاعل حاكٍ على وزن فاعل من حكى الثلاثي.
    - lemma: "خَيَّال"
      generation_method: majaz
      justification: >
        توسيع دلالي من مصطلح خيال الظل؛ كان الخيَّال فنان عروض الخيال في الموروث
        العربي الذي يُجسِّد شخصيات متخيَّلة خلف الستارة. يمكن تعميمه ليشمل كل
        من يُحيي شخصية خيالية أو تاريخية على الخشبة.
    - lemma: "مُشَخِّص"
      generation_method: ishtiqaq
      justification: >
        من شَخَّصَ (جذر: شخص) على وزن مُفَعِّل؛ تشخيص الأدوار تعبير سائد في الفصحى
        الحديثة للإشارة إلى أداء الأدوار التمثيلية. المُشَخِّص من يُبرز الشخصية
        ويُعطيها هيئتها وملامحها.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات مُنفَّذة:
# ١. مطابقة دفعية: مشخصاتي، ممثل + مرشحات المرحلة ١ (كل بصيغتي ال- وبدونها)
# ٢. جسر إنجليزي: actor, histrion, thespian, role player, theatrical performer
# ٣. FTS عربي: مسرح، تمثيل، يزاول، ممثل
# ٤. بحث إضافي: مشخصاتي، مسرحي
# ٥. مقاييس اللغة: جذرا مثل وشخص
