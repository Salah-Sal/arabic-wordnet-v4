        - text: "«(الممثل) من يزاول مهنة التَّمْثِيل على المسرح (مج)»"
          source: "المعجم الوسيط — Hawramani"
        - text: "«translation_en: actor»"
          source: "مسرد الإعلام والتواصل — ArabTerm (ALECSO)"
        - text: "«(2) المُمَثِّل المسرحيّ أو السينمائيّ»"
