# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  blind_candidates:
    - lemma: "النَّقَّاب"
      generation_method: ishtiqaq
      justification: >
        من جذر ن-ق-ب على وزن فَعَّال الدالّ على الامتهان والمداومة؛
        النَّقْب هو ثقب الحائط أو الجدار من أسفله، وهو بالضبط عمل
        المهندس العسكري الحافر الذي يهدم التحصينات بنقب أساسها.
        الوزن فَعَّال مناسب لأصحاب الحرف الخطيرة (الغوّاص، النبّاش،
        الحمّار)، مما يجعله صيغةً اصطلاحيةً مسكوكةً.

    - lemma: "الحَفَّار"
      generation_method: ishtiqaq
      justification: >
        من جذر ح-ف-ر على وزن فَعَّال، يدلّ على من يمتهن الحفر؛
        السياق العسكري يُخصِّص المعنى ليشير إلى الحافر الخندق.
        أُدرج كمرشح ثانٍ من باب استيفاء الاشتقاق المباشر من الجذر
        الأوضح دلالةً على الوظيفة المادية المذكورة في التعريف.

    - lemma: "النَّبَّاش"
      generation_method: majaz
      justification: >
        من جذر ن-ب-ش على وزن فَعَّال؛ النَّبْش هو إبراز الشيء
        المستور بالحفر. قد يُنقل مجازاً إلى الحافر العسكري الذي
        يُبرز ما تحت الأسوار ويكشف أساسها. إحياء للمجاز في سياق
        الاختراق العسكري.

    - lemma: "جُنْدِيُّ النَّقْب"
      generation_method: tarkib
      justification: >
        تركيب إضافي يجمع "جُنْدِيّ" (الجنس القريب) و"النَّقْب"
        (الفصل النوعي، دالّاً على الاختراق تحت التحصينات)؛
        يُوضح الوظيفة العسكرية المتخصصة بصيغة مركّبة.

  assessment:
    concerns:
      - >
        "جندي هندسة عسكرية" وصف عام لأي مهندس عسكري ويتداخل دلالياً
        مع الفصيلة الأعلى مباشرة (awn4-09828961-n: مهندس عسكري)،
        مما يُفقده القدرة على تمييز النقّاب تحديداً عن سائر أصناف
        المهندسين العسكريين.
      - >
        "حفار خنادق" تركيب إضافي وصفي يفشل اختبار التثبيت المعجمي:
        يمكن إبدال "خنادق" بـ"قبور" وما تزال العبارة صحيحة نحوياً
        ووصفياً، مما يدل على أنها ليست مصطلحاً مسكوكاً بالمعنى الدقيق.
      - >
        كلتا اللمّتين الموجودتين تفتقران إلى التشكيل الكامل المطلوب
        معيارياً.
    observations: >
      المفهوم المراد — النَّقَّاب العسكري — ذو عراقة في التراث
      العسكري العربي الإسلامي؛ كانت وحدات النَّقَّابين تُشكّل عنصراً
      أساسياً في حصار المدن وفتحها، يحفرون الأنفاق تحت الأسوار
      ويدكّونها. اللمّة الأدق والأعرق هي "النَّقَّاب"؛ ولا تزال
      المعاجم الحديثة (المورد الحديث) توثّقها صراحةً لهذا المعنى.
      التعريف الحالي سليم المضمون لكنه يحتاج إلى صياغة تمييزية أدق
      تُفرّق النقّاب عن أبيه في التصنيف (المهندس العسكري العام).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # إجمالي الاستعلامات: ٦
  # ١. دُفعي: headword_norm IN (لمّات + مرشحات + ال- forms)
  # ٢. جسر إنجليزي: translation_en IN ("sapper","combat engineer","pioneer")
  # ٣. نقاب/نباش/لغام مفصَّل
  # ٤. FTS كلمات مفتاحية: خندق/نقب/تحصين
  # ٥. مقاييس اللغة: نقب/حفر/جند/نبش
  # ٦. ARABTERM نقاب

  per_lemma:

    - lemma: "جندي هندسة عسكرية"
      evidence_status: "no_material_found"
      # العبارة لم تَرِد كمدخل معجمي في قاعدة البيانات؛
      # مكوّناتها موجودة منفردةً لكنّ المركّب غير مسجَّل.

    - lemma: "حفار خنادق"
      contradicts:
        - text: >
            «الحَفَّار: مَنْ عَمَلُه الحِفَارَةُ، وغَلَبَ على
            مَنْ يَحْفِرُ القُبورَ؛ نوعٌ من الخنافسِ له قرونٌ
            يَحْفِرُ بها الأرْضَ وسُوقَ الأشجار»
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: >
            الدلالة الغالبة للحَفَّار في المعجمين الوسيط والكبير
            هي حافر القبور، وليس الحافر العسكري؛ يُضعِف استخدامه
            مصطلحاً تقنياً للنقّاب.
        - text: >
            «الحفار: من صناعته الحفارة. وغلب على حافر القبور؛
            من يحفر الخشب ونحوه ليعده للزينة؛ نوع من الخنافس
            له قرون يحفر بها الأرض»
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: >
            تأكيد ثانٍ على أن الدلالة الغالبة هي حافر القبور،
            لا الجندي الحافر للخنادق.
      expands:
        - text: >
            «حَفَرَ — الحاء والفاء والراء أصلان: أحدهما حفر
            الشيء وهو قلعه سُفلاً؛ فالأول حَفَرْتُ الأرضَ
            حَفْراً. وقالوا: انتهينا وهذا الخندق الحَفَر»
          source: "مقاييس اللغة — ابن فارس"
          addition: >
            الجذر ح-ف-ر يحمل أصلاً صحيحاً معناه قلع التراب
            من أسفل، وورد الخندق شاهداً في المقاييس مما يُثبت
            صلة الجذر بالحفر العسكري.

    - lemma: "النَّقَّاب"
      confirm:
        - text: >
            «(1) النَّقَّاب: خبير عسكري يُعنَى بحَفر الخنادق (جن).
            (2) اللَّغَّام: خبير بوضع الألغام وتعطيلها (جن).»
          source: "المورد الحديث (2008) — روحي البعلبكي"
        - text: >
            «(النقاب) الكثير التنقيب»
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: >
            «نَقَبَ — النون والقاف والباء أصلٌ صحيح يدل على
            فتحٍ في شيء. ونَقَبَ الحائطَ يَنقُبُه نَقْباً ...
            والنَّقَّابُ: العالم بالأمور كأنه نقَّب عليها
            فاستنبطها، أو العالم بها المنقِّب عنها. قال:
            مَلِيحٌ نَجِيحٌ أَخُو مَأْقِطٍ / نِقَابٌ يُحَدِّثُ
            بِالْغَائِبِ. والنَّقْبُ والمَنْقَبَةُ: الطريق
            في الجبل.»
          source: "مقاييس اللغة — ابن فارس"
          addition: >
            الجذر ن-ق-ب يدلّ على الفتح والاختراق في الجدران
            والحيطان — وهو بالضبط عمل النقّاب العسكري. وزن
            فَعَّال يُفيد الاحتراف والمداومة.

    - lemma: "الحَفَّار"
      contradicts:
        - text: >
            «الحَفَّار: مَنْ شَأنُه الحِفَارَةُ، وَغَلَبَ
            على مَنْ يَحْفِرُ القُبورَ»
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: >
            الدلالة الراسخة في المعجمين تقصر الحفّار على
            حافر القبور، لا على الحافر العسكري.
      expands:
        - text: >
            «الحاء والفاء والراء أصلان: أحدهما حفر الشيء
            وهو قلعه سُفلاً»
          source: "مقاييس اللغة — ابن فارس"
          addition: >
            الجذر في أصله يشمل كل حفر للأرض، غير أن الاستخدام
            المعجمي المتأخر خصَّصه لحافر القبور.

    - lemma: "النَّبَّاش"
      contradicts:
        - text: >
            «النَّبَّاش: مَن يفتِّش القبورَ عن الموتى ليسرق
            أكفانهم وحُلِيَّهم»
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: >
            النبَّاش في جميع المعاجم ناشر قبور ولصّ، لا جنديّ
            حافر؛ النقل المجازي متعسَّف ويُلبس المعنى.
        - text: >
            «النُّونُ وَالْبَاءُ وَالشِّينُ أَصلٌ وَكَلِمَةٌ
            وَاحِدَةٌ تَدُلُّ عَلَى إِبْرَازِ شَيْءٍ مَسْتُورٍ.
            وَنَبَشَ القَبْرَ وَهُوَ نَبَّاشٌ يَنبُشُهُ.»
          source: "مقاييس اللغة — ابن فارس"
          conflict: >
            الجذر في مقاييس مقترن بنبش القبر حصراً، فيُرسِّخ
            الدلالة السلبية المنافية للاستخدام العسكري الإيجابي.

    - lemma: "جُنْدِيُّ النَّقْب"
      evidence_status: "no_material_found"
      # لم يَرِد هذا التركيب في قاعدة البيانات المعجمية.


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "جندي هندسة عسكرية"
      decision: removed
      decision_reason: >
        العبارة وصف حر لأي مهندس عسكري — تتطابق دلالياً مع الفصيلة
        الأعلى المباشرة "مهندس عسكري" (awn4-09828961-n)، وتفتقر إلى
        الفصل النوعي الذي يُميِّز النقَّاب تحديداً. تفشل اختبار
        التثبيت المعجمي: يمكن استبدال "جندي" بـ"فرد" أو "ضابط" أو
        "عنصر" مع بقاء المعنى الوصفي صحيحاً. لا أدلة معجمية
        تُسجِّلها مصطلحاً مسكوكاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حفار خنادق"
      decision: confirmed
      decision_reason: >
        رغم كون التركيب وصفياً وعدم وروده في المعاجم كمدخل ثابت،
        فإن "حَفَّار خَنَادِق" يصف الوظيفة العسكرية المتخصصة وصفاً
        دقيقاً وصريحاً (حفر الخنادق). يُكمّل "النَّقَّاب" دلالياً
        من الجانب التقني المادي. يُبقى في المجموعة بوصفه تركيباً
        وصفياً فنياً مع تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز البُعد العملي المادي: الحفر الميداني للخنادق تحديداً؛
        لا يحمل دلالة اختراق التحصينات بخلاف النَّقَّاب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَفَّار خَنَادِق"

    - lemma: "النَّقَّاب"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَت معجمياً في المورد الحديث (2008) بصريح العبارة:
        "النَّقَّاب: خبير عسكري يُعنى بحَفر الخنادق" — مع ترجمة
        sapper. اشتقاق سليم من جذر ن-ق-ب (فتح الحائط والاختراق)
        على وزن فَعَّال المختص بالمهن الاحترافية. يُمثّل الاصطلاح
        العربي الأصيل لهذا الدور العسكري الموثَّق في التراث الإسلامي.
        يجتاز بوابة الجودة الستة: اطِّراد، يُسر تداول، ملاءمة،
        إيثار التراثي، إيثار العربي، اشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يحمل الدلالة التقنية العسكرية المتكاملة: النَّقْب كاختراق
        بنيوي للتحصين (من أسفل الأسوار أو من خلالها)؛ يشمل حفر
        الخنادق وهدم الأسوار معاً — على خلاف "حَفَّار خَنَادِق"
        الأقصر دلالةً على الحفر المجرَّد.
      actions:
        - command: create_entry
          params:
            lemma: "النَّقَّاب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10571133-n"

    - lemma: "الحَفَّار"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الغالبة في المعجم الوسيط والمعجم الكبير محصورة
        في حافر القبور، والنقل إلى الحافر العسكري يُوقع في الاشتراك
        اللفظي غير المرغوب. كذلك يُغني عنه "حَفَّار خَنَادِق"
        الأكثر تخصيصاً.

    - lemma: "النَّبَّاش"
      source: stage1
      decision: removed
      decision_reason: >
        النَّبَّاش في جميع الشواهد المعجمية ناشر قبور، والنقل
        المجازي إلى الحافر العسكري متعسَّف وسيُوقع القارئ في
        الخلط. المعنى السلبي الراسخ يُعارض الاستخدام الاصطلاحي
        العسكري الإيجابي.

    - lemma: "جُنْدِيُّ النَّقْب"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية، وهو تركيب إضافي لا يجتاز اختبار التثبيت
        (يمكن إبدال "جندي" بـ"فرد" أو "عنصر"). ويُغني عنه
        "النَّقَّاب" المفرد المسكوك.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "مهندس عسكري يقوم بأعمال الحفر (حفر الخنادق أو تقويض التحصينات)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يستخدم "يقوم بأعمال الحفر" ثم يُفصِّل
        بين قوسين، مما يجعله مكرَّراً بنيوياً. علاوةً على ذلك،
        "مهندس عسكري" هو نفسه مسمّى الفصيلة الأعلى مباشرةً
        فلا يُحقق الفصل النوعي المطلوب في التعريف الاصطلاحي.
        يُستحسن صياغة تعريف يُدرج الجنس والفصل بوضوح ودون
        تكرار.
    authored:
      - type: terminological
        text: >
          فردٌ مُتخصِّص في وحدات الهندسة العسكرية يتولّى نقبَ
          أسوار التحصينات وحفرَ الخنادق تحتها لتقويضها وإسقاطها
          خلال العمليات الهجومية.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          النَّقَّاب: عنصر مدرَّب في سلاح الهندسة العسكرية،
          مهمته الاقتراب من الحصون والقلاع المُعادية بحفر أنفاق
          وخنادق تحت أسوارها أو أمامها، بغية إضعاف قواعدها
          وإسقاطها أو فتح ثغرات تُمكِّن القوات الهاجمة من
          الاقتحام؛ وقد اضطلعت وحدات النَّقَّابين بدور محوري
          في حروب الحصار والفتوحات الإسلامية الكبرى.
