# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «لاعب بلياردو» مُركَّب إضافي غير مُشكَّل، يفتقر إلى ضبط الحركات الإعرابية في المخرجات"
      - "التعريف الحالي «شخص يلعب البلياردو» يستعمل الجذر الدلالي نفسه في الجنس والفصل، وهو ضعيف تعريفياً"
      - "المجموعة تحتوي على لمّة واحدة فقط، وصيغة النسبة (بِلياردِيّ) المتداولة في المعاجم الثنائية غائبة"
    observations: >
      المجموعة الترادفية تصف شخصاً يمارس رياضة البلياردو، وهي لعبة دخيلة من اللغة الفرنسية (billard).
      النمط الأكثر إنتاجية في العربية المعاصرة لتسمية اللاعب هو: [لاعب + اسم الرياضة] (لاعب كرة القدم،
      لاعب التنس). يعكس المصطلح الحالي هذا النمط غير أنه يُغفل صيغة النسبة الإضافية (بِلياردِيّ)
      الواردة في المعاجم الثنائية، وهي صيغة منتجة في العربية على غرار «كروي» و«تنسي».
      كذلك يُلاحَظ أن الصيغة بالتعريف (لاعب البلياردو) أكثر رسوخاً صرفياً من الصيغة النكرة (لاعب بلياردو).
  blind_candidates:
    - lemma: "لاعِبُ البِلياردُو"
      generation_method: tarkib
      justification: >
        تركيب إضافي قياسي: لاعِب (اسم الفاعل من لَعِبَ، وزن فاعِل) مضافاً إلى البِلياردُو (اسم اللعبة المُعرَّب بالتعريف).
        يُشاكل هذا البناء: لاعِب كرة القدم، لاعِب التنس، لاعِب الشطرنج.
    - lemma: "بِلياردِيٌّ"
      generation_method: taarib
      justification: >
        اسم منسوب إلى «بلياردو» المُعرَّب بإضافة ياء النسبة، يُستعمل اسم جنس للشخص المنتسب إلى هذه الرياضة،
        على غرار «كُرَوِيّ» للاعب الكرة و«تِنسِيّ» للاعب التنس. الصيغة قابلة للتذكير والتأنيث والجمعين السالمين.
    - lemma: "ضَارِبُ البِلياردُو"
      generation_method: tarkib
      justification: >
        تركيب إضافي يُبرز الفعل الجوهري في رياضة البلياردو وهو الضرب بالعصا (الكيو) نحو الكرات.
        اسم الفاعل ضَارِب من جذر ضرب على وزن فاعِل، مُضاف إلى اسم اللعبة.
    - lemma: "مُسَدِّدُ الكُرَاتِ"
      generation_method: majaz
      justification: >
        مجاز عن المهارة الجوهرية في البلياردو وهي تسديد الكرات نحو الجيوب بدقة.
        اسم الفاعل مُسَدِّد من جذر سدد (وزن مُفَعِّل) مضافاً إلى الكرات. يُعبِّر عن الوظيفة الحركية الأساسية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية: لاعب بلياردو + لاعب البلياردو + بلياردو + البلياردو + بلياردي + البلياردي
#          + ضارب بلياردو + ضارب البلياردو + مسدد الكرات + مسدد كرات
#   Q2 — جسر إنجليزي: billiard player, billiards player, billiards, billiard, pool player, snooker player
#   Q3 — FTS عربي: "بلياردو" OR "بلياردي" OR "البلياردو" OR "لاعب البلياردو"
#   Q4 — مقاييس اللغة: جذر لعب (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "لاعب بلياردو"
      expands:
        - text: >
            «بلياردو [مفرد]: (رض) لُعبة تُعرف بكُرة المائدة، تُلعَب بِكُراتٍ عاجيَّة تُدحرج بعصًا على مائدة
            مستطيلة الشَّكل ذات جيوب، مفروشة بقُماش صوفيّ أخضر ولها إطار لُفَّ عليه مطاط.»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: >
            يوثّق هذا التعريف الاستخدام الرسمي لكلمة «بلياردو» في المعجمية العربية الحديثة، مما يُثبّت
            أحقية مكوِّن «بلياردو» في التركيب الإضافي «لاعب بلياردو».
        - text: >
            «الكرة المستهدفة: (رض) الكرة في لعبة البلياردو التي يضربها اللاعب أو يقصد ضربها أوّلا.»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: >
            تُثبّت هذه العبارة المعجمية الصياغةَ «اللاعب» في سياق «لعبة البلياردو»، مما يعزّز طبيعية
            التركيب الإضافي «لاعب البلياردو».

    - lemma: "لاعِبُ البِلياردُو"
      expands:
        - text: >
            «بلياردو [مفرد]: (رض) لُعبة تُعرف بكُرة المائدة، تُلعَب بِكُراتٍ عاجيَّة تُدحرج بعصًا على مائدة
            مستطيلة الشَّكل ذات جيوب، مفروشة بقُماش صوفيّ أخضر ولها إطار لُفَّ عليه مطاط.»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يؤيّد استخدام البِلياردُو (بالتعريف) كمضاف إليه في التركيب الإضافي."

    - lemma: "بِلياردِيٌّ"
      confirm:
        - text: >
            «(1) بِلْيارديّ (2) إصابة [في البليارد]» — المقابل العربي لـ «billiard»
          source: "المورد الحديث (2008) — أرابترم"
          addition: >
            يوثّق المعجم كلمة «بِلياردِيّ» كمصطلح عربي مسكوك في مقابل «billiard»، مما يُثبّت
            وجود هذه الصيغة في المعجمية الثنائية الحديثة وقابليتها لقبول لام التعريف والجمع.

    - lemma: "ضَارِبُ البِلياردُو"
