# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ──
    - lemma: "لاعب بلياردو"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي (لاعب + بلياردو) هو النمط القياسي في العربية المعاصرة لتسمية لاعبي الرياضات
        (لاعب كرة القدم، لاعب التنس، لاعب الشطرنج). مُثبَّت في المعجمية العربية المعاصرة وفي منظومة
        ألفاظ الرياضة. يستوفي اشتراطات الاشتقاقية والاطّراد والملاءمة. يحتاج إلى تشكيل كامل وإضافة
        الصيغة المُعرَّفة (لاعِبُ البِلياردُو) كصورة بديلة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      morphological_fitness: >
        صيغة فاعِل من لَعِبَ دالة على الفاعل المتلبّس بالفعل أو المُكثِر منه، وهي مناسبة تمام المناسبة
        للمشتغل بلعبة ما. الإضافة إلى اسم اللعبة تُخصِّص الجنس وتُميِّز اللاعب عن سائر اللاعبين.
      loan_check:
        lexical_borrowing: "معرَّبة — بلياردو من الفرنسية billard، مقبول في المعجمية العربية الحديثة"
        literal_translation: "لا تعارض مع المدلول"
        calque: "البنية الإضافية (لاعب + اسم الرياضة) نمط عربي خالص"
      nuance_differentiation: >
        التعبير المركب الصريح: يُستخدم في السياق الوصفي والرسمي والتقريري كاملاً دون اختزال.
        يُقابله «بِلياردِيٌّ» الذي هو الصيغة المختزلة ذات الطابع الوصفي الأسرع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبُ بِلياردُو"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "لاعِبُ البِلياردُو"

    # ── مرشح المرحلة ١ — مقبول ──
    - lemma: "بِلياردِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في المورد الحديث (2008) كمصطلح عربي مسكوك في مقابل «billiard»، ويعمل عمل اسم الجنس
        للشخص المنتسب إلى هذه الرياضة وفق نمط النسبة المنتج في العربية (كُرَوِيّ، تِنسِيّ، عدّائيّ).
        يقبل الجمع بالواو والنون (بِلياردِيُّون) وباء النسبة الجنسية، مما يُثبّت اشتقاقيته. يُضاف كلمّة
        ثانية تُثري المجموعة بصيغة مختزلة صرفياً إلى جانب التركيب الإضافي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fitness: >
        صيغة النسبة (فَعَلِيّ) دالة على الانتساب وتعمل في العربية اسماً للفاعل الاحترافي.
        الوزن مناسب للدلالة على الهوية المهنية/الرياضية.
      loan_check:
        lexical_borrowing: "معرَّبة — نسبة إلى بلياردو المُعرَّب، مقبولة"
        literal_translation: "لا تعارض"
        calque: "صيغة النسبة بنية عربية خالصة"
      nuance_differentiation: >
        الصيغة المختزلة ذات الطابع الوصفي/الهوياتي: تُستخدم وصفاً (لاعب بِلياردِيّ محترف) أو اسماً
        منفرداً (فاز البِلياردِيُّ المصري). تُقابل «لاعِبُ البِلياردُو» الذي هو التركيب الصريح المُفصَّل.
      actions:
        - command: create_entry
          params:
            lemma: "بِلياردِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09873827-n"

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "ضَارِبُ البِلياردُو"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية على هذا التركيب. «الضرب» ليس التسمية الاصطلاحية السائدة لحركة لاعب البلياردو في
        العربية المعاصرة؛ المعجمية الحديثة تستخدم «لاعب» لا «ضارب». يُضاف إلى ذلك أن «ضارب» تحمل
        حمولات دلالية سلبية (ضارب الخيمة، ضارب عرض الحائط) قد تُلتبَس على القارئ.

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "مُسَدِّدُ الكُرَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد على هذا التعبير. المصطلح فضفاض يشمل لاعبي كرة القدم والهوكي وسواهم؛ لا يخصّ
        البلياردو وحده. فضلاً عن ذلك، التسديد في البلياردو يُصيب به اللاعب الكرةَ المستهدفة (object ball)
        لا كل الكرات، فالتركيب يُضلّل دلالياً. اختبار السكّ يفشل: (مُدحرج الكرات، مُحرِّك الكرات) صالحة
        وصفاً، أي ليست مصطلحاً ثابتاً.


