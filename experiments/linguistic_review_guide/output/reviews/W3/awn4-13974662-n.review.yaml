# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13974662-n
# the state of being inferior — حالة كونه أدنى
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «حالة كونه أدنى» مقتضب جداً وترجمة حرفية للإنجليزي، يحتاج تأليفاً معجمياً"
      - "اللمّة «مكانة أدنى» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل اختبار السكّ (يمكن إبدالها بـ«منزلة أدنى» أو «رتبة أدنى»)"
      - "اللمّة «دونية» بدون تشكيل كامل"
    observations: "المجموعة تصف حالة مجردة (state) تحت فرط «ضعة/مكانة متدنية». المفهوم طبيعي في العربية ويُعبَّر عنه بلفظ «دونية» المشتق من «دون» بالمصدر الصناعي. اللمّة الثانية «مكانة أدنى» مركب وصفي مفتوح لا يرقى إلى وحدة معجمية ثابتة."
  blind_candidates:
    - lemma: "دُونِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «دُون» على وزن فُعُولِيَّة المختزل، يدل على حالة كون الشيء دون غيره درجةً أو منزلة. مستعمل في الكتابة المعاصرة (عُقدة الدونية) ومثبت في المورد الحديث."
    - lemma: "صَغَار"
      generation_method: ishtiqaq
      justification: "من الجذر «صغر» على وزن فَعَال، يدل على الذل والهوان والرضا بالضيم. ورد في القرآن: ﴿تُرْهِقُهُمْ ذِلَّةٌ﴾ وفي المعاجم الكبرى بمعنى الذل."
    - lemma: "خِسَّة"
      generation_method: ishtiqaq
      justification: "من الجذر «خسس» على وزن فِعْلَة، تدل على الحقارة والضعة. وردت في المعاجم الكلاسيكية ضمن باب الخسة والضعة."
    - lemma: "مَنْزِلَة دُنْيَا"
      generation_method: tarkib
      justification: "مركب وصفي من «منزلة» و«دنيا» (مؤنث أدنى). يصف حالة كون الشخص في مرتبة أقل."

stage2_evidence:
  per_lemma:
    - lemma: "دُونِيَّة"
      confirm:
        - text: "«الدّونيّة: كون الشيء دون غيره درجةً أو منزلة إلخ.»"
          source: "المورد الحديث (2008)"
        - text: "«دونية، نقص»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
        - text: "«عُقدة النَّقص؛ مُركَّب الدُّونية (نف).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«دُونيَّة: من (د و ن) مؤنث الدُّوني.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يبيّن أن اللفظ مشتق من «دون» بياء النسبة وتاء التأنيث، مما يؤكد كونه مصدراً صناعياً"
    - lemma: "مكانة أدنى"
      evidence_status: "no_material_found"
    - lemma: "صَغَار"
      contradicts:
        - text: "«الصَّغارُ: الذُّلُّ والهوانُ.»"
          source: "المعجم الكبير"
          conflict: "الصغار يختص بمعنى الذل والهوان والرضا بالضيم، وهو أضيق من مفهوم الدونية العام الذي يشمل تدني المرتبة والدرجة دون لزوم دلالة الإذلال"
      expands:
        - text: "«الصَّادُ وَالْغَيْنُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قِلَّةٍ وَحَقَارَةٍ. [...] وَالصَّاغِرُ: الرَّاضِي بِالضَّيْمِ صُغْرًا وَصَغَارًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدل على القلة والحقارة مع ملمح إضافي هو الرضا بالضيم"
    - lemma: "خِسَّة"
      contradicts:
        - text: "«بَاب الخسة والضعة: وغد دنيئ حيس نكس نذل مهين وسط نغل...»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
          conflict: "الخسة تدل على الحقارة والوضاعة الأخلاقية لا على تدني المرتبة الاجتماعية أو المعنوية"
    - lemma: "مَنْزِلَة دُنْيَا"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "دُونِيَّة"
      decision: confirmed
      decision_reason: "لفظ مشتق اشتقاقاً قياسياً من «دون» بالمصدر الصناعي، مثبت في المورد الحديث بتعريف يطابق دلالة المجموعة تماماً، ومستعمل في مصطلحات علم الاجتماع وعلم النفس (عقدة الدونية). فصيح شائع يسير التداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ مفرد مجرد يدل على الحالة ذاتها (كون الشيء دون غيره)، يصلح في السياقات النفسية والاجتماعية والعامة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُونِيَّة"
    - lemma: "مكانة أدنى"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل اختبار السكّ: يمكن إبدال «مكانة» بـ«منزلة» أو «رتبة» أو «درجة» ويبقى التعبير صالحاً. ليست وحدة معجمية ثابتة ولا مصطلحاً مسكوكاً. لم تُعثر على أدلة معجمية تثبتها كمركب اصطلاحي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "صَغَار"
      source: stage1
      decision: removed
      decision_reason: "الصغار يختص بدلالة الذل والهوان والرضا بالضيم، وهو أضيق وأشد سلبية من مفهوم الدونية العام الذي يعني مجرد تدني المرتبة أو الدرجة. لا ترادف بينهما."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "خِسَّة"
      source: stage1
      decision: removed
      decision_reason: "الخسة تدل على الوضاعة والحقارة الأخلاقية، وهي صفة ذاتية للشخص لا حالة نسبية في المرتبة. المفهوم مختلف عن الدونية التي تعني كون الشيء دون غيره درجةً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "مَنْزِلَة دُنْيَا"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي مفتوح يفشل اختبار السكّ كما «مكانة أدنى». عبارة وصفية حرة لا ترقى إلى مصطلح معجمي ثابت."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

