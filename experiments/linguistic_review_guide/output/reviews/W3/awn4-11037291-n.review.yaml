# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11037291-n | ILI: i95354 | POS: n
# المراجع: ناقد لغوي عربي | التاريخ: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (غروبيوس، فالتر غروبيوس) تفتقران إلى التشكيل الكامل الإلزامي"
      - "هذه المجموعة تمثّل عَلَمَ شخص بعينه (synset نموذجي - instance synset)، واللمّات هي تعريبات للاسم الأجنبي؛ التحقق من استقرار صيغة التعريب مطلوب"
      - "الصيغة 'فالتر' (بالفاء) تعريبٌ لـ Walter بالفاء بدلاً من الواو، وقد يُعدّ ذلك انزياحاً صوتياً عن الأصل الجرماني"
    observations: >
      يختصّ هذا السِّينسِت بشخصية تاريخية بعينها هي المعماري والتر غروبيوس (Walter Gropius)،
      مؤسّس مدرسة الباوهاوس الألمانية (1919). ولمّا كانت الأعلام الشخصية الأجنبية لا تخضع
      للاشتقاق العربي، فإن الوسيلة الوحيدة المشروعة لتوليد اللمّات هي التعريب (التعريب الصوتي).
      المجموعة تفتقر إلى التشكيل الكامل، وهو ضروري لإرشاد القارئ إلى النطق الصحيح للاسم الأجنبي.
      التعريف الحالي صحيح في جوهره لكنه يحتمل صياغة أكثر أناقةً وسلاسةً أسلوبياً.

  blind_candidates:
    - lemma: "غُرُوبيُوس"
      generation_method: taarib
      justification: >
        تعريب صوتي مباشر للّقب (Gropius)، بتحويل G→غ، r→ر، o→و، p→ب، i→ي، us→وس؛
        اللقب منفرداً هو أقصر صيغة للدلالة على صاحب هذه الترجمة.
    - lemma: "فَالْتِر غُرُوبيُوس"
      generation_method: taarib
      justification: >
        الاسم الكامل بتعريب الجزأين معاً؛ Walter→فَالْتِر (استناداً للتقليد التعريبي الشائع
        في المصادر العربية التي تُحوّل W إلى فـ في أسماء بعينها) وGropius→غُرُوبيُوس،
        مما يُعطي الصيغة الكاملة للتعريف الأولي وللاستشهاد الأكاديمي الرسمي.
    - lemma: "وَالْتِر غُرُوبيُوس"
      generation_method: taarib
      justification: >
        بديل صوتي أدق للاسم الكامل؛ Walter→وَالْتِر بالواو وهو الأقرب صوتياً للأصل الجرماني
        (W تُنطق واو في الألمانية والإنجليزية)، مع الحفاظ على اللقب غُرُوبيُوس.
    - lemma: "جُرُوبيُوس"
      generation_method: taarib
      justification: >
        بديل تعريبي بتحويل G→جـ، وهي ممارسة شائعة في بعض المعاجم التقنية العربية الأقدم
        للصوت /ɡ/ الذي يُنطق بعض العرب مقابله بالجيم؛ غير أن الغين أكثر شيوعاً في المصادر الحديثة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  query_log:
    - query_id: Q1
      purpose: "بحث دفعي بالمطابقة الدقيقة — جميع اللمّات الموجودة والمرشحات"
      terms_searched:
        - غروبيوس
        - الغروبيوس
        - فالتر غروبيوس
        - الفالتر غروبيوس
        - والتر غروبيوس
        - الوالتر غروبيوس
        - جروبيوس
        - الجروبيوس
      result: "لا نتائج — لم يُعثر على أيٍّ من هذه اللمّات في قاعدة البيانات"
    - query_id: Q2
      purpose: "الجسر الإنجليزي — Gropius / Walter Gropius / Bauhaus"
      terms_searched:
        - "Gropius"
        - "Walter Gropius"
        - "Bauhaus"
      result: "لا نتائج مطابقة تحديداً لغروبيوس أو والتر غروبيوس؛ وُجد مدخل باوهاوس"
    - query_id: Q3
      purpose: "بحث FTS عربي — باوهاوس، غروبيوس، غروبيس"
      result: "نتيجة واحدة لمدخل باوهاوس في المعجم الموحد لمصطلحات التقنيات التربوية"
    - query_id: Q4
      purpose: "جسر إنجليزي موسّع — architect / Bauhaus"
      result: "عدة مداخل لـ architect (معمار، مهندس معماري) لكن لا شيء عن غروبيوس تحديداً"
    - query_id: Q5
      purpose: "مقاييس اللغة لابن فارس — جذر عمر (للإثراء)"
      result: "مدخل عَمَرَ — dictionary_id 151"

  per_lemma:
    - lemma: "غُرُوبيُوس"
      evidence_status: "no_material_found"

    - lemma: "فَالْتِر غُرُوبيُوس"
      evidence_status: "no_material_found"

    - lemma: "وَالْتِر غُرُوبيُوس"
      evidence_status: "no_material_found"

    - lemma: "جُرُوبيُوس"
      evidence_status: "no_material_found"

  contextual_findings:
    - item: "مدخل باوهاوس"
      text: "«باوهاوس (ال…): مدرسة عليا للعمارة والزخرفة ظهرت عام 1919 في ألمانيا»"
      source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
      relevance: >
        يؤكد أن مصطلح الباوهاوس حاضر في المعجمية العربية المعاصرة مع تعريف دقيق يتطابق
        مع المعلومات الواردة في تعريف المجموعة؛ يدعم صحة الربط المفهومي في التعريف.
    - item: "مداخل معمار / مهندس معماري"
      text: "«(1) المهندس المِعماري (2) المهندس: المخطِّط والمنفِّذ لمشروع ضخم أو عسير»"
      source: "المورد الحديث (2008) — ARABTERM"
      relevance: "يدعم صحة التوصيف الوظيفي الوارد في تعريف المجموعة (معماري)"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى الموجودة ──
    - lemma: "غروبيوس"
      decision: confirmed
      decision_reason: >
        تعريب الاسم العلمي الشخصي لفالتر غروبيوس، اللقب منفرداً؛ وهو التعريب الأشيع في
        المصادر العربية الأكاديمية والإعلامية. غياب الدليل المعجمي مفهوم تماماً لأن المعاجم
        العامة لا تُدرج أعلام الأشخاص بالتفصيل. اللمّة تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      diacritization_check:
        needs_diacritics: true
        proposed: "غُرُوبيُوس"
      nuance_differentiation: >
        يُمثّل اللقب (الاسم الأخير) منفرداً؛ يُستعمل في السياقات التقنية والأكاديمية بعد
        التعريف الأولي بالاسم الكامل، أو حين يكون السياق لا يحتمل اللبس.
      morphological_check: >
        تعريب صوتي، لا ينتمي إلى الوزن الصرفي العربي؛ يقبل التنوين في بعض السياقات الرسمية
        (غُرُوبيُوسُ) لكن الشائع في الأعلام المُعرَّبة الاستغناء عنه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غُرُوبيُوس"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "فالتر غروبيوس"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المُعرَّب للمعماري (Walter Gropius)؛ هذه هي الصيغة المستقرّة في كثير
        من المصادر العربية. رغم أن "والتر" أقرب صوتياً إلى الأصل الجرماني، إلا أن "فالتر"
        ورد في مصادر عربية معتمدة وبات الشكل الأكثر شيوعاً لهذا الشخص بعينه. يحتاج تشكيلاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      mwe_integrity_check: >
        الاسم العلمي الكامل وحدة معجمية ثابتة غير قابلة للتبديل؛ لا يمكن إبدال "فالتر"
        بمرادف آخر مع بقاء الدلالة على الشخص ذاته (اختبار التثبيت: ناجح).
      diacritization_check:
        needs_diacritics: true
        proposed: "فَالْتِر غُرُوبيُوس"
      nuance_differentiation: >
        الاسم الكامل يُوظَّف عند الإشارة الأولى للشخص في النص، وفي السياقات الرسمية
        والمرجعية والببليوغرافية، بعكس اللقب المنفرد الذي يُستخدم في التكرار والإحالة.
      morphological_check: >
        تعريب صوتي مركّب؛ الجزء الأول (فَالْتِر) تعريب الاسم الشخصي، والثاني (غُرُوبيُوس)
        تعريب اللقب، كلاهما مُعرَّب ومقبول في العربية عبر التعريب الصوتي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَالْتِر غُرُوبيُوس"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "وَالْتِر غُرُوبيُوس"

    # ── مرشح المرحلة ١ — وَالْتِر غُرُوبيُوس ──
    - lemma: "وَالْتِر غُرُوبيُوس"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن "وَالْتِر" أدق صوتياً من "فَالْتِر" في تعريب Walter، إلا أن فَالْتِر غُرُوبيُوس
        هي الصيغة الأكثر تداولاً في المصادر العربية المعتمدة لهذه الشخصية بعينها؛ ولتجنب
        ازدواجية اللمّات على مستوى المجموعة، تُحفظ والتر كشكل بديل (add_form) على مدخل
        فالتر غروبيوس المؤكَّد بدلاً من إنشاء مدخل مستقل.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١ — جُرُوبيُوس ──
    - lemma: "جُرُوبيُوس"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب غير مستقر؛ الصوت /ɡ/ يُعرَّب بالغين (غ) في المصادر العربية الحديثة المتخصصة
        في العمارة والفنون، وغُرُوبيُوس بالغين هو التعريب الشائع والمتفق عليه. استخدام الجيم
        تقليد قديم لم يُثبَّت لهذا الاسم تحديداً.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري أمريكي (ولد في ألمانيا) ومؤسس مدرسة باوهاوس (1883-1969)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح المضمون لكنه يفتقر إلى: (أ) التشكيل على الكلمات المفتاحية؛
        (ب) أسلوب المعجم الوسيط في صياغة تعريفات الأعلام؛ (ج) تحديد طبيعة الباوهاوس
        بوصفها مدرسة عمارة وفنون تطبيقية لا مجرد "مدرسة باوهاوس" دون إيضاح؛
        (د) الصياغة "ولد في ألمانيا" أقل أناقةً من "من مولد ألماني" أو "من أصل ألماني".
    authored:
      - type: encyclopedic
        text: >
          مِعْمَارِيٌّ أَمْرِيكِيٌّ مِنْ مَوْلِدٍ أَلْمَانِيٍّ، وَمُؤَسِّسُ مَدْرَسَةِ
          البَاوْهَاوْس فِي العِمَارَةِ وَالفُنُونِ التَّطْبِيقِيَّةِ (1883-1969)
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11037291-n"
          definition_index: 0
          text: "مِعْمَارِيٌّ أَمْرِيكِيٌّ مِنْ مَوْلِدٍ أَلْمَانِيٍّ، وَمُؤَسِّسُ مَدْرَسَةِ البَاوْهَاوْس فِي العِمَارَةِ وَالفُنُونِ التَّطْبِيقِيَّةِ (1883-1969)"

