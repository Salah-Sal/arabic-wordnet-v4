            type: usage
      - lemma: "فَالْتِر غُرُوبيُوس"
        examples:
          - text: "أسَّسَ فَالْتِر غُرُوبيُوس مدرسةَ البَاوْهَاوْس عام 1919 في مدينة فايمار الألمانية، فأحدثَ ثورةً في مفهوم العمارة الحديثة."
            type: usage
