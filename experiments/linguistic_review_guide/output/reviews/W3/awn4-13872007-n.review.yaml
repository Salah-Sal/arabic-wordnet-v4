# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13872007-n (thousandth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «المتمم للألف» عبارة وصفية حرة لا مصطلح مسكوك، تفشل في اختبار السكّ (يمكن إبدالها بـ«المكمل للألف» بلا تغيّر)"
      - "التعريف العربي يستخدم الرقم 1,000 بدل التهجئة «ألف»، وهذا أسلوب غير معجمي"
      - "اللمّة «الألف» تشترك لفظياً مع حرف الألف ومع العدد الأصلي، ممّا يحتاج تمييزاً دقيقاً"
    observations: "المفهوم هو المركز الترتيبي رقم ألف في سلسلة معدودة. في العربية الفصحى، تُستخدم الأعداد الأصلية الكبيرة (فوق العاشر) مع أداة التعريف للدلالة على الترتيب، فيقال «الكتاب الألف» أي الكتاب ذو الرتبة ١٠٠٠. اللمّة «الألف» صحيحة لغوياً في هذا الاستعمال الترتيبي. أمّا «المتمم للألف» فعبارة شارحة لا ثبات معجمياً لها."
  blind_candidates:
    - lemma: "الأَلْف"
      generation_method: majaz
      justification: "استعمال العدد الأصلي «ألف» مع ال التعريف للدلالة على الترتيب، وهو القياس العربي المطّرد في الأعداد فوق العاشر"
    - lemma: "أَلْفِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الألف على وزن فَعْلِيّ، للدلالة على ما يتعلّق بالمرتبة الألفية"
    - lemma: "تَمَام الأَلْف"
      generation_method: tarkib
      justification: "مركّب إضافي يعني ما يُتمّم به العدد ألفاً، أي العنصر الذي يكمل السلسلة عند الألف"
    - lemma: "المُتِمّ لِلْأَلْف"
      generation_method: tarkib
      justification: "اسم فاعل مع حرف جر، يصف العنصر الذي يبلغ به العدد ألفاً في سلسلة"


stage2_evidence:
  per_lemma:
    - lemma: "الأَلْف"
      confirm:
        - text: "«الألْفُ من العَدَدِ: مُذَكَّرٌ، ولو أُنِّثَ باعْتبارِ الدَّراهِمِ لَجَازَ، ج: أُلُوفٌ وآلافٌ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الألف عشر مئات. ويقال: ألف مؤلف: تام»"
          source: "المعجم الوسيط"
        - text: "«الأَلْف: عَشْرُ مِئَات (مذكر ويجوز تأنيثه)»"
          source: "المعجم الكبير"
        - text: "«الألف: بسكون اللام، كمال العدد بكمال ثالث رتبة، قال ابن الأنباري: مذكر لا يجوز تأنيثه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(1) الألف the thousandth book (2) مُشَكِّل جزءًا من ألف a thousandth share of money (3) العضو الألف [في مجموعة] (4) جزء من ألف»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الألْفُ عددٌ، وهو مذكر، يقال: هذا ألْفٌ واحدٌ، ولا يقال: واحدة. وهذا أَلْفٌ أَقرعُ، أي تامٌّ»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "يؤكد تذكير الألف ويضيف وصف «أقرع» بمعنى تام"
        - text: "«الألف: بكسر اللام، عند القوم يشار به إلى الذات الأحدية أي الحق تعالى من حيث هو أول الأشياء في أزل الأزل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "دلالة صوفية للألف (بكسر اللام) مختلفة عن العدد (بسكون اللام)"

    - lemma: "المُتَمِّم لِلْأَلْف"
      evidence_status: "no_material_found"

    - lemma: "أَلْفِيّ"
      expands:
        - text: "«الألفيَّة؛ ذات الألف ورقة (نب)»"
          source: "المورد الحديث (2008)"
          addition: "الألفية مستعملة كنسبة للدلالة على ما يتصل بالألف، لكن في سياق نباتي لا ترتيبي"

    - lemma: "تَمَام الأَلْف"
      evidence_status: "no_material_found"

    - lemma: "المُتِمّ لِلْأَلْف"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "الأَلْف"
      decision: confirmed
      decision_reason: "ثابت في المعاجم العربية الكلاسيكية والحديثة بوصفه العدد ١٠٠٠، ويُستعمل مع ال التعريف للدلالة الترتيبية كما يؤكد المورد الحديث صراحة: «الألف the thousandth book» و«العضو الألف في مجموعة». هذا هو الاستعمال القياسي في العربية للأعداد الترتيبية الكبيرة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة المؤكدة في المجموعة؛ تدل على المركز الترتيبي ١٠٠٠ باستعمال العدد الأصلي مع التعريف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الأَلْف"

    - lemma: "المتمم للألف"
      decision: removed
      decision_reason: "عبارة وصفية حرة لا ثبات معجمياً لها. تفشل في اختبار السكّ لأنّ إبدال «المتمم» بـ«المكمل» أو «المتمِّم» لا يغيّر المعنى. لم تُوجَد أي شواهد معجمية تدعم استعمالها مصطلحاً ثابتاً للدلالة على الترتيب الألفي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "أَلْفِيّ"
      source: stage1
      decision: removed
      decision_reason: "الصيغة النسبية «ألفيّ» تدل على الانتساب إلى الألف بمعنى عام، لكنها لا تُستعمل في العربية للدلالة على المركز الترتيبي. كما أنّ «الألفية» مشغولة دلالياً بمعاني أخرى (ألفية ابن مالك، الألفية بمعنى millennium). لا شاهد معجمي يدعم استعمالها بمعنى thousandth."
      evidence_assessment:
        case: no_material

    - lemma: "تَمَام الأَلْف"
      source: stage1
      decision: removed
      decision_reason: "مركب إضافي وصفي حر، لا ثبات معجمياً له. يفشل في اختبار السكّ ولا يختلف وظيفياً عن «المتمم للألف» المرفوض."
      evidence_assessment:
        case: no_material

    - lemma: "المُتِمّ لِلْأَلْف"
      source: stage1
      decision: removed
      decision_reason: "مرادف تقريبي للمّة «المتمم للألف» المرفوضة، وعبارة وصفية حرة بلا سند معجمي."
      evidence_assessment:
        case: no_material


