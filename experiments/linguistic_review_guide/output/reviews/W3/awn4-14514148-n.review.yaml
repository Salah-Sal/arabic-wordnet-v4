# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14514148-n (debt)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «دين» بلا تشكيل، ولا يُعرف هل المقصود الدَّيْن (المال) أم الدِّين (المعتقد)"
      - "اللمّة «دين» موجودة أيضاً في المجموعة الأعلى (hypernym) awn4-14513903-n مما يُحدث تداخلاً بين الأب والابن"
      - "المجموعة تحتوي لمّة واحدة فقط وهي قليلة لمفهوم شائع كالدَّيْن"
    observations: "المفهوم المستهدف هو «حالة المديونية» لا «المبلغ المدين به» فحسب. التعريف العربي «حالة كون الشخص مديناً بشيء ما» يشير إلى الحالة (state) وليس إلى المال الواجب ذاته. في العربية يُفرَّق بين الدَّيْن (ما يُستقرض ويجب ردّه) والمَدْيُونِيَّة (حالة كون الشخص مديوناً). الجذر «د ي ن» غزير الاشتقاقات: دَيْن، مَدْيُون، مَدْيُونِيَّة، دائن، مُدَايَنَة، اسْتِدَانَة، تَدَايُن."
  blind_candidates:
    - lemma: "مَدْيُونِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «مَدْيُون» على وزن مَفْعُولِيَّة، يدلّ تحديداً على حالة كون الشخص مديوناً، وهو المعنى المطابق للتعريف. أقرّه مجمع اللغة العربية بالقاهرة."
    - lemma: "دَيْن"
      generation_method: ishtiqaq
      justification: "اسم من الجذر «د ي ن» بفتح الدال وسكون الياء، يدلّ على ما يجب في الذمّة من مال. مستعمل في القرآن والحديث والفقه والاقتصاد."
    - lemma: "اسْتِدَانَة"
      generation_method: ishtiqaq
      justification: "مصدر الفعل «اسْتَدَانَ» على وزن اسْتِفَالَة، يدلّ على طلب الدَّيْن وأخذه. قد يصلح للدلالة على فعل الاستدانة لا على حالتها."
    - lemma: "تَدَايُن"
      generation_method: ishtiqaq
      justification: "مصدر الفعل «تَدَايَنَ» على وزن تَفَاعُل، يدلّ على التعامل بالدَّيْن بين طرفين. ورد في القرآن: ﴿إِذَا تَدَايَنتُم بِدَيْنٍ﴾."


stage2_evidence:
  per_lemma:
    - lemma: "دَيْن"
      confirm:
        - text: "«الدَّيْنُ: ما لَه أجَلٌ، كالدِّيْنَةِ، بالكسر، وما لا أجَلَ له، فَقَرْضٌ، والمَوْتُ، وكُلُّ ما ليس حاضراً. ج: أدْيُنٌ ودُيونٌ. ودِنْتُه، بالكسر، وأدَنْتُه: أَعْطَيْتُهُ إلى أجَلٍ، وأقْرَضْتُه. ودانَ هو: أخَذَه. ورجُلٌ دائنٌ ومَدينٌ ومَدْيونٌ ومُدانٌ»"
          source: "القاموس المحيط"
        - text: "«الدَيْنُ: واحد الديونِ. تقول: دِنْتُ الرجل أقرضته، فهو مدينٌ ومَدْيونٌ. ودانَ فلان يدين ديناً: استقرض وصار عليه دَيْنٌ، فهو دائِنٌ»"
          source: "الصحاح في اللغة"
        - text: "«الدّين: بالفتح وسكون المثناة التحتانية شرعاً مال واجب في الذمة بالعقد أو الاستهلاك أو الاستقراض... والدين حقيقة وصف في الذمة عبارة عن شغل الذمة بمال وجب بسبب من الأسباب»"
          source: "كشاف اصطلاحات الفنون والعلوم"
      expands:
        - text: "«والدَّيْنُ مِنْ قِيَاسِ الْبَابِ الْمُطَّرِدِ، لِأَنَّ فِيهِ كُلَّ الذُّلِّ وَالذِّلِّ. وَلِذَلِكَ يَقُولُونَ: الدَّيْنُ ذُلٌّ بِالنَّهَارِ، وَغَمٌّ بِاللَّيْلِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «د ي ن» أصله الانقياد والذلّ، والدَّيْن من هذا الباب لما فيه من الذلّ"

    - lemma: "مَدْيُونِيَّة"
      confirm:
        - text: "«أقرَّ مجمع اللغة المصري كلمة مديونية بقرار خاص على أنها مصدر صناعي من مديون، واللفظ شائع في لغة القضاء والاقتصاد»"
          source: "معجم الصواب اللغوي (هوراماني)"
        - text: "«مديونية = indebtedness / endettement»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (أليكسو ٢٠٠٠)"
        - text: "«مديونية = indebtedness / endettement»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (أليكسو ١٩٩٥)"
        - text: "«المَدِينيّة؛ المديونيّة = indebtedness»"
          source: "المورد الحديث (٢٠٠٨)"

    - lemma: "اسْتِدَانَة"
      evidence_status: "no_material_found"

    - lemma: "تَدَايُن"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "دَيْن"
      decision: confirmed
      decision_reason: "لفظ عربي فصيح ثابت في المعاجم الكلاسيكية والمعاصرة بمعنى ما يجب في الذمّة من مال. وارد في القرآن والحديث والفقه والقانون والاقتصاد. اللمّة الحالية بلا تشكيل فتحتاج تحديث التشكيل إلى «دَيْن» بفتح الدال وسكون الياء تمييزاً عن «دِين» بكسر الدال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المال الواجب في الذمّة (ما يُقترض ويجب ردّه)، بينما المَدْيُونِيَّة تدلّ على حالة كون الشخص مديوناً. الدَّيْن أعمّ وأشيع استعمالاً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَيْن"

    - lemma: "مَدْيُونِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي من «مَدْيُون» أقرّه مجمع اللغة المصري، شائع في لغة القضاء والاقتصاد. يطابق تعريف المجموعة تماماً إذ يدلّ على حالة كون الشخص مديوناً (state of indebtedness). مسجّل في معاجم أليكسو والمورد الحديث بترجمة indebtedness."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ تحديداً على حالة المديونية (الوصف المجرد لكون الشخص مديوناً)، بخلاف الدَّيْن الذي يدلّ على المال الواجب نفسه. المَدْيُونِيَّة أدقّ في التعبير عن مفهوم state of owing."
      actions:
        - command: create_entry
          params:
            lemma: "مَدْيُونِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اسْتِدَانَة"
      source: stage1
      decision: removed
      decision_reason: "مصدر «استدان» يدلّ على فِعْل طلب الدَّيْن وأخذه (act of borrowing)، لا على حالة المديونية (state of owing). لا يطابق تعريف المجموعة ولم تُوجد له شواهد معجمية بهذا المعنى."

    - lemma: "تَدَايُن"
      source: stage1
      decision: removed
      decision_reason: "مصدر «تداين» يدلّ على التعامل بالدَّيْن بين طرفين (mutual lending)، وهو فعل تبادلي لا حالة ثابتة. دلالته أقرب إلى المعاملة المالية منها إلى حالة المديونية."


