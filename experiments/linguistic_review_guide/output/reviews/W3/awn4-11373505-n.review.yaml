    concerns:
      - "اللمّات الموجودة ('ماري توسو' و'مدام توسو') تفتقر إلى تشكيل كامل — يجب ضبطها"
      - "اللمّتان الموجودتان تُغطّيان صورتَي الاسم الأكثر شهرة، لكنهما لا تشملان اسم الميلاد (غروشولتز) ولا صيغة الكنية المنفردة (توسو)، في حين يتضمّن المقابل الإنجليزي الأربع الصيغ: Tussaud / Marie Tussaud / Madame Tussaud / Marie Grosholtz"
      - "الفئة الدلالية (pos: n) صحيحة في سياق قواعد WordNet رغم أن المدخل اسم علم — لا تعديل مطلوب"
      - "التعريف العربي الحالي يُعبِّر عن 'أقنعة شمعية' بدلاً من 'أقنعة وجه للموتى' (wax death masks) وهي الصياغة الأدق؛ ويغفل تفصيلتَي 'جولتها ببريطانيا' وتأريخ افتتاح المعرض عام 1835"
    observations: >
      هذه المجموعة الترادفية اسمُ علَمٍ لامرأة تاريخية بعينها هي ماري تُوسُو (Marie Tussaud)، الفنانة الفرنسية الألزاسية
      الأصل المتخصصة في صنع تماثيل الشمع، والتي رسّخت شهرتها في لندن خلال القرن التاسع عشر. تعريب اسمها العلَم يعتمد
      اصطلاح النقل الصوتي (التعريب)، ولا يُنتظر له مقابل اشتقاقي أو مجازي في العربية. اللمّات المقبولة ينبغي أن تُعادل
      الصيغ الأربع المعتمدة في OEWN. الملاءمة الثقافية تندرج ضمن فئة 'الحذف' (omission) إذ المفهوم شخصية أوروبية غريبة
      عن الموروث العربي رغم شهرة متحفها عالمياً.

  blind_candidates:
    - lemma: "مَادَام تُوسُو"
      generation_method: taarib
      justification: >
        الصيغة الأشهر عالمياً واسم المتحف المعروف؛ 'مادام' لقب فرنسي يُعرَّب نقلاً صوتياً، و'توسو' تعريب لكنية
        Tussaud. هذه الصيغة المركبة ثابتة في الإعلام العربي والترجمات المعاصرة.
    - lemma: "مَارِي تُوسُو"
      generation_method: taarib
      justification: >
        الصيغة الرسمية المكتملة للاسم (الاسم الأول + الكنية)، تُستخدم في المراجع التاريخية والموسوعية العربية
        وتعادل الصيغة الإنجليزية 'Marie Tussaud'.
    - lemma: "مَارِي غْرُوشُولْتْز"
      generation_method: taarib
      justification: >
        اسم الميلاد (الاسم قبل الزواج) لشخصية الفنانة؛ 'غروشولتز' تعريب صوتي للقب الألزاسي Grosholtz. يُدرَج
        لشموليّة التغطية المعجمية ولتعادل الصيغة الإنجليزية 'Marie Grosholtz' في OEWN.
    - lemma: "تُوسُو"
      generation_method: taarib
      justification: >
        الكنية المنفردة Tussaud معرَّبةً، تُستخدم اختزالاً في السياقات غير الرسمية والمراجع المختصرة،
        وتعادل صيغة OEWN 'Tussaud'.


