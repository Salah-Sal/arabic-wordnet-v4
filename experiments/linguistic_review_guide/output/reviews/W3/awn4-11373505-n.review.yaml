stage4_content:
  definition:
    current: "صانعة نماذج فرنسية (عاشت في إنجلترا) اشتهرت بصنع أقنعة شمعية لضحايا الثورة الفرنسية وافتتحت معرضاً دائماً للشمع في لندن (1761-1850)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يُهمل ثلاثة عناصر جوهرية: (١) دقّة الوصف 'أقنعة الموت الشمعية' (wax death masks)
        مقابل 'أقنعة شمعية' المبهم؛ (٢) تفصيلة 'جولتها ببريطانيا بنماذجها' الواردة في المصدر الإنجليزي؛
        (٣) تحديد عام 1835 كتاريخ افتتاح المعرض الدائم. كما تُعادل الصياغة الحالية ترجمةً حرفية غير
        دقيقة — يستوجب الأمر تأليف تعريف موسوعي وفق أسلوب المعجم الوسيط.
    authored:
      - type: encyclopedic
        text: >
          صانعةُ تماثيلَ شمعيةٍ فرنسيةٌ (١٧٦١-١٨٥٠)، أقامت في إنجلترا بعد عام ١٨٠٢؛ اشتُهرت بصنع
          قوالب شمعية للوجوه أخذتها عن ضحايا الثورة الفرنسية المشهورين بعد إعدامهم، وجالت ببريطانيا
          بمجموعتها من النماذج الشمعية، ثم أسّست عام ١٨٣٥ معرضاً دائماً للتماثيل الشمعية في لندن
          لا يزال قائماً باسمها حتى اليوم.
