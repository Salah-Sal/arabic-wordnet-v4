# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5 مراحل)
# Synset: awn4-11288873-n  |  ili: i96746
# Will Rogers — فكاهي أمريكي (1879-1935)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تمثّل علَمًا شخصيًا (proper noun)، وهذا النوع يقتصر تعريبه على النقل الصوتي (التعريب) دون سواه من طرائق الاشتقاق أو المجاز أو التركيب"
      - "اللمّتان الحاليتان (روجرز وويل روجرز) مجرَّدتان من التشكيل الكامل"
      - "يُستشفّ من التعريف أن المجموعة تصف شخصًا بعينه، ولا يمكن توليد مصطلح عربي خالص لعَلَم أجنبي محدَّد"
      - "الاسم الرسمي الكامل (William Penn Adair Rogers) غائب عن اللمّات العربية الحالية رغم وجوده في اللمّات الإنجليزية"
    observations: >
      المجموعة awn4-11288873-n تمثّل عَلَمًا شخصيًا لفكاهيٍّ أمريكيٍّ مشهور من حقبة ما بين القرنين
      التاسع عشر والعشرين (1879-1935). هذا النوع من المجموعات يستدعي ضبطًا صوتيًا دقيقًا للاسم
      الأجنبي لا توليدًا معجميًا. التحدي الحقيقي يكمن في: (١) تحديد الشكل الصوتي العربي الأمثل
      لكل صيغة من صيغ الاسم، و(٢) استيفاء الصيغ المقابلة لجميع اللمّات الإنجليزية المسجَّلة.
      التعريف الحالي مقبول في جوهره لكنه يحتاج إلى بعض الضبط الأسلوبي ليتوافق مع منهجية
      التعريف الموسوعي في المعاجم.

  blind_candidates:
    # ملاحظة منهجية: لمّا كانت المجموعة تصف علَمًا شخصيًا أجنبيًا
    # فإن الطريقة الوحيدة الممكنة هي التعريب (النقل الصوتي).
    # توليد المرشحين يعتمد على التعريف وحده بما فيه من تاريخَي الميلاد والوفاة (1879-1935)
    # التي تشير إلى فكاهيين أمريكيين مشهورين من تلك الحقبة.
    - lemma: "وِيل رُوجِرز"
      generation_method: taarib
      justification: >
        النقل الصوتي المعتاد للاسم الأمريكي الأكثر شيوعًا لفكاهي ولد عام 1879 وتوفي 1935؛
        الاسم مكوَّن من اسم شخصي (Will) ولقب عائلي (Rogers)، وهذا أشهر صيغه المتداولة.

    - lemma: "رُوجِرز"
      generation_method: taarib
      justification: >
        صيغة اللقب العائلي المنفرد؛ شائعة في الكتابة الصحفية والإشارات المختصرة،
        وتكفي للتعريف بالشخص في السياقات التي سبق فيها ذكر الاسم الأول.

    - lemma: "وِيلِيَام رُوجِرز"
      generation_method: taarib
      justification: >
        صيغة الاسم الرسمي المطوَّل باستعمال الاسم الشخصي الكامل (William) بدلًا من
        الصيغة المختصرة (Will)؛ تُستعمل في السجلات الأكاديمية والوثائق التاريخية الرسمية.

    - lemma: "وِيلِيَام بِن أَدَير رُوجِرز"
      generation_method: taarib
      justification: >
        الاسم الكامل عند الميلاد المقابل للمّة الإنجليزية "William Penn Adair Rogers"؛
        يُستعمل في المراجع الموسوعية والسجلات الرسمية عند الحاجة إلى التمييز الحاسم.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # ملاحظة منهجية: نُفِّذت استعلامات متعددة على قاعدة البيانات المعجمية (760,660 مدخل):
  # (١) مطابقة دقيقة دفعية لجميع صيغ اللمّات (روجرز / ويل روجرز / ويليام روجرز / ويليام بن أدير روجرز)
  # (٢) جسر إنجليزي: translation_en:"Rogers" OR "Will Rogers" OR "William Penn Adair Rogers" OR "humorist"
  # (٣) بحث بكلمات مفتاحية عربية: "فكاهي" OR "ساخر" OR "كوميدي" OR "مضحك"
  # (٤) التحقق من مرشحات المرحلة ١ بالمطابقة الدقيقة الدفعية
  # النتيجة الحاسمة: لا توجد أيّ مداخل معجمية في قاعدة البيانات لأي صيغة من صيغ "روجرز"،
  # إذ الأعلام الأجنبية نادرًا ما تُدرج في المعاجم العربية التقليدية.
  # وجد استعلام الجسر الإنجليزي مدخلًا واحدًا للمصطلح "humorist":
  # entry_id=693566 من المورد الحديث 2008: translation_en="humorist"
  # headword="الظريف: شخص منصرفٌ إلى الفكاهة أو معروفٌ بها" — وهو عام لا يتعلق بالعَلَم.

  per_lemma:
    - lemma: "رُوجِرز"
      evidence_status: "no_material_found"

    - lemma: "وِيل رُوجِرز"
      evidence_status: "no_material_found"

    - lemma: "وِيلِيَام رُوجِرز"
      evidence_status: "no_material_found"

    - lemma: "وِيلِيَام بِن أَدَير رُوجِرز"
      evidence_status: "no_material_found"

  query_log:
    - query_id: 1
      type: batch_headword_lookup
      terms: ["روجرز", "الروجرز", "ويل روجرز", "الويل روجرز", "وليام روجرز", "الوليام روجرز"]
      result_count: 0
    - query_id: 2
      type: english_bridge
      terms: ["Rogers", "Will Rogers", "William Penn Adair Rogers", "humorist"]
      result_count: 1
      note: "المدخل الوحيد (entry_id=693566) يُعرِّف كلمة humorist = الظريف، لا صلة له بالعَلَم"
    - query_id: 3
      type: arabic_fts_keywords
      terms: ["فكاهي", "ساخر", "كوميدي", "مضحك"]
      result_count: 20
      note: "جميع النتائج مصطلحات عامة من المورد الحديث، لا علاقة لها بالعَلَم الشخصي"
    - query_id: 4
      type: candidate_validation_headword
      terms: ["ويليام روجرز", "الويليام روجرز", "وليام روجرز", "وليام بن ادير روجرز", "ويل", "الويل"]
      result_count: 0
      note: "عدم وجود مداخل معجمية مؤكَّد؛ 'الويل' المُسترجَع يعني الشقاء لا الاسم الأجنبي"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "روجرز"
      decision: confirmed
      decision_reason: >
        نقل صوتي صحيح للقب العائلي Rogers، مقبول كلمّة عربية مُعرَّبة؛ يُعدّ مدخلًا
        ضروريًا لأنه الصيغة المختصرة الشائعة في الكتابة العربية. يحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      morphological_check:
        pos_fit: "اسم علم أجنبي مُعرَّب، صوتيًا سليم، يقبل ال التعريف (الروجرز) والنسبة (الروجرزي)"
        tashkeel_missing: true
      loan_check:
        type: taarib
        verdict: "مُعرَّب مقبول — النقل الصوتي دقيق ومستعمل في المراجع العربية"
      nuance_differentiation: >
        صيغة اللقب العائلي المنفرد؛ تُستعمل في السياقات التي سبق فيها ذكر الاسم الأول
        أو في الإشارات المختصرة في الصحافة والأبحاث. تقابل اللمّة الإنجليزية "Rogers".
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُوجِرز"

    - lemma: "ويل روجرز"
      decision: confirmed
      decision_reason: >
        الاسم الشهير الكامل المقابل للمّة الإنجليزية "Will Rogers"؛ هو الصيغة الأكثر
        تداولًا في المراجع العربية عند ذكر هذا الفكاهي الأمريكي. ضرورته واضحة كصيغة
        أساسية. يحتاج إلى تشكيل كامل وضبط الإملاء.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        mwe_note: "مركَّب اسمي من اسم شخصي (ويل) + لقب عائلي (روجرز)، وهو نمط أسماء الأعلام الغربية"
      morphological_check:
        pos_fit: "علم شخصي مُركَّب، المكوِّنان معًا يشكّلان وحدة معجمية ثابتة"
        tashkeel_missing: true
      loan_check:
        type: taarib
        verdict: "مُعرَّب مقبول — مركَّب من نقلَين صوتيَّين صحيحَين"
      nuance_differentiation: >
        الصيغة الاعتيادية الأشهر للاسم الكامل؛ تجمع الاسم الشخصي المختصر (Will) مع
        اللقب العائلي. تُستعمل في معظم السياقات العامة والصحفية والموسوعية.
        تقابل اللمّة الإنجليزية "Will Rogers".
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيل رُوجِرز"

    # ── مرشحات المرحلة ١ ──

    - lemma: "وِيل رُوجِرز"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة (ويل روجرز) بعد تشكيلها؛ لا حاجة لإنشاء مدخل جديد.
        الإجراء المناسب هو تحديث اللمّة الموجودة بالتشكيل، لا إضافة لمّة مكرَّرة.

    - lemma: "رُوجِرز"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة (روجرز) بعد تشكيلها؛ الإجراء المناسب هو تحديث اللمّة
        الموجودة لا إضافة مدخل جديد.

    - lemma: "وِيلِيَام رُوجِرز"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مطوَّلة للاسم الشخصي (William بدل Will) ليست مسجَّلة في اللمّات الإنجليزية
        المرجعية (OEWN). الاسم الرسمي الكامل هو "William Penn Adair Rogers"، والصيغة
        المختصرة الشائعة هي "Will Rogers". صيغة "William Rogers" وسط غير مستعملة
        في المراجع الموسوعية وتثير لبسًا مع أشخاص آخرين يحملون هذا الاسم.

    - lemma: "وِيلِيَام بِن أَدَير رُوجِرز"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل اللمّة الإنجليزية الثالثة "William Penn Adair Rogers" المسجَّلة في OEWN
        ولا يوجد لها مقابل عربي في المجموعة الحالية. الاسم الرسمي الكامل عند الميلاد
        ضروري في السجلات الموسوعية للتمييز القاطع عن أشخاص آخرين. النقل الصوتي دقيق:
        William→وِيلِيَام، Penn→بِن (النقل المعتاد للمقطع Penn في الأعلام الأمريكية)،
        Adair→أَدَير، Rogers→رُوجِرز.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        mwe_note: "سلسلة اسمية من أربعة مكوِّنات: اسم شخصي + اسم وسط أول + اسم وسط ثانٍ + لقب عائلي"
      morphological_check:
        pos_fit: "علم شخصي مُركَّب رباعي المكوِّنات، يُستعمل في الوثائق الرسمية والمراجع الأكاديمية"
      loan_check:
        type: taarib
        verdict: "مُعرَّب صحيح — النقل الصوتي لكل مكوِّن دقيق ومعتمَد"
      nuance_differentiation: >
        الاسم الكامل الرسمي عند الميلاد؛ يُستعمل في الموسوعات الأكاديمية والسجلات
        التاريخية الرسمية ووثائق الإحصاء عند الحاجة إلى التعريف القاطع. أكثر صيغ
        الاسم رسميةً وأقلّها تداولًا في الاستعمال اليومي.
        يقابل اللمّة الإنجليزية "William Penn Adair Rogers".
      actions:
        - command: create_entry
          params:
            lemma: "وِيلِيَام بِن أَدَير رُوجِرز"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فكاهي من الولايات المتحدة يُذكر بتعليقاته البسيطة على السياسة والمجتمع الأمريكي (1879-1935)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي جيد في جوهره، لكنه يفتقر إلى دقة الوصف الموسوعي: (١) كلمة "فكاهي"
        وحدها ناقصة؛ وِيل رُوجِرز كان فنانًا متعدِّد المواهب (ممثل، رودييو، كاتب ساخر).
        (٢) "بتعليقاته البسيطة" ترجمة حرفية لـ"homespun" وإن صحَّت فإن "الشعبية الطابع"
        أو "ذات النبرة الشعبية" أدق وأعمق. (٣) يُستحسن ترتيب المعلومات: الاسم ← الجنس
        القريب ← الفصل النوعي ← التواريخ.

