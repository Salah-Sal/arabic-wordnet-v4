# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # التوليد الأعمى — من التعريف المُقنَّع فقط (قبل الاطلاع على اللمّات)
  # المفهوم المستنتج: لاعب رياضي يُسَدِّد الكرة نحو المرمى أو السلة (بالركل أو الرمي)
  blind_candidates:
    - lemma: "هَدَّاف"
      generation_method: ishtiqaq
      justification: >
        من الجذر (هدف) على وزن فعَّال (صيغة مبالغة)، يدل على كثرة التسديد نحو الهدف
        وإتقانه. الوزن فعَّال يُلائم المهن الرياضية (سبَّاح، فرَّار، قنَّاص).
        المصطلح يُلائم الدلالة ولا يتضمن أي لفظ من التعريف ذاته.

    - lemma: "مُسَدِّد"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل سدَّد (الباب الثاني) على وزن مُفَعِّل، بمعنى "من يُسَدِّد
        الكرة نحو الهدف". الجذر (سدد) يدل على التوجيه والإصابة في المقتل. متسق مع
        مصطلح "التسديد" الشائع في التغطيات الرياضية العربية الحديثة.

    - lemma: "قَاذِف"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من قذف على وزن فاعل، بمعنى "من يقذف الكرة/يرميها نحو الهدف".
        يُلائم ألعاب الكرة التي تعتمد الرمي باليد كالسلة والكرة الطائرة.

    - lemma: "مُصَوِّب"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من صوَّب على وزن مُفَعِّل، بمعنى "من يُصَوِّب كرته نحو المرمى".
        الجذر (صوب) يدل على الصواب والاستقامة، ومنه "تصويب" بمعنى إصابة الهدف.

  # التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "لمّة رامٍ واردة دون تشكيل كامل في المدخل."
      - "لمّة مُسدد مبهمة دون تشكيل: هل هي مُسَدِّد (اسم فاعل — من يُسَدِّد) أم
        مُسَدَّد (اسم مفعول — الذي سُدِّد)؟ السياق يقتضي اسم الفاعل."
      - "الهَدَّاف مصطلح موثَّق في المعجم الوسيط بالدلالة الرياضية ذاتها لكنه غائب
        عن المجموعة."
      - "التعريف العربي الحالي يستخدم (يقود الكرة) وهو تعبير غير مألوف في السياق
        الرياضي العربي؛ المعهود (يُسَدِّد/يوجِّه)."
      - "البنية الجملية للتعريف بثيّة ومتداخلة، تحتاج إعادة صياغة."
    observations: >
      المجموعة تُغطي مفهوم اللاعب المُسَدِّد في الرياضات الجماعية (كرة القدم
      وكرة السلة)، وهو مفهوم له تعابير عربية أصيلة متعددة تتباين في دقائق
      الدلالة: رامٍ يُركِّز على فعل الرمي (مناسب للسلة)، ومُسَدِّد يُركِّز
      على التوجيه الدقيق نحو الهدف (يصلح لكلتيهما)، والهَدَّاف يُفيد المهارة
      وكثرة التسديد. غياب الهَدَّاف من المجموعة ثغرة واضحة يُكملها التوثيق
      المعجمي في الوسيط.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية:
  # استعلامات مُنفَّذة (مجموعها ٧ استعلامات):
  # ١. batch headword: رام/الرام، مسدد/المسدد، هداف/الهداف، مصوب/المصوب، قاذف/القاذف
  # ٢. إثراء مدمج (definitions + examples) لجميع entry_ids الناتجة
  # ٣. English bridge: "shooter", "goal shooter", "basket shooter"
  # ٤. FTS عربي: رمى، يرمي، مرمى، تسديد
  # ٥. عائلة جذر رمى (رامي/الرامي في OCR)
  # ٦. مقاييس اللغة (dictionary_id=151): رمى، هدف، صوب، سد
  # ٧. تحقق مرشحات المرحلة ١ (دفعي)

  per_lemma:

    # ───── لمّة موجودة: رامٍ ─────
    - lemma: "رامٍ"
      confirm:
        - text: "«الرَّامِي: مَنْ حِرْفَتُه الرِّمايَةُ»"
          source: "المعجم الكبير (entry_id: 39585)"
        - text: "«رَمَى الرَّاءُ وَالْمِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ،
            وَهُوَ نَبْذُ الشَّيْءِ. ثُمَّ يَحْمِلُ عَلَيْهِ اشْتِقَاقًا
            وَاسْتِعَارَةً. تَقُولُ رَمَيْتُ الشَّيْءَ أَرْمِيهِ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 986656)"
      expands:
        - text: "«الرَّامِي (فى الفلك): اسمٌ آخَرُ لِبُرجِ القَوْس. ويقال أيضًا:
            القَوْسُ الرَّامِى»"
          source: "المعجم الكبير (entry_id: 39588)"
          addition: >
            يُفيد أن الرَّامي في التراث يرتبط أصلاً بالقوس والرمي بالسهام،
            وقد امتد استعمالاً إلى كل من يرمي في السياق الرياضي الحديث.

    # ───── لمّة موجودة: مُسدد ─────
    - lemma: "مُسدد"
      contradicts:
        - text: "«المُسَدِّدُ: مَا يحتبس فِي المجرى لكثافته، أَو يبوسته، أَو غروسته»"
          source: "معجم مقاليد العلوم للسيوطي — hawramani (entry_id: 807559)"
          conflict: >
            الاستخدام الكلاسيكي لمُسَدِّد في السياق الطبي يعني "ما يسدّ المجرى"
            (عائق جسدي)، وهو خلاف المعنى الرياضي المقصود "من يُسَدِّد الكرة".
            التعارض في الدلالة الأساسية وليس في الجذر الاشتقاقي.
      expands:
        - text: "«السِّينُ وَالدَّالُ أَصْلٌ وَاحِدٌ، وَهُوَ يَدُلُّ عَلَى رَدْمِ شَيْءٍ
            وَمُلَاءَمَتِهِ... وَمِنْ ذَلِكَ السَّدِيدُ، ذُو السَّدَادِ، أَيِ
            الِاسْتِقَامَةِ؛ كَأَنَّهُ لَا ثُلْمَةَ فِيهِ. وَالصَّوَابُ أَيْضًا
            سَدَادٌ. يُقَالُ قُلْتُ سَدَادًا. وَسَدَّدَهُ اللَّهُ عَزَّ وَجَلَّ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 986917، الجذر سد)"
          addition: >
            مقاييس اللغة يُثبت أن الجذر (سد) يتضمن معنى "الاستقامة والتوجيه"
            (السديد = المستقيم، وسدَّده الله = وجَّهه). هذا يُعزِّز المشروعية
            الاشتقاقية لمُسَدِّد بمعنى "من يُوجِّه الكرة نحو الهدف"، وإن لم
            يُسجَّل المصطلح الرياضي في معجم تراثي بعينه.

    # ───── مرشح المرحلة ١: هَدَّاف ─────
    - lemma: "هَدَّاف"
      confirm:
        - text: "«الْهَدَّافُ: مَن يُحْسِنُ تَسْدِيدَ الكُرَةِ إِلَى الْمَرْمَى.
            (مُحْدَثَة)»"
          source: "المعجم الوسيط (entry_id: 31195)"
        - text: "«الهداف: من يحسن تسديد الكرة إِلَى المرمى (محدثة)»"
          source: "المعجم الوسيط — hawramani (entry_id: 886600)"
        - text: "«هَدَفَ: الْهَاءُ وَالدَّالُ وَالْفَاءُ أُصَيْلٌ يَدُلُّ عَلَى
            انْتِصَابٍ وَارْتِفَاعٍ. وَالْهَدَفُ: كُلُّ شَيْءٍ عَظِيمٍ مُرْتَفِعٍ،
            وَلِذَلِكَ سُمِّيَ الرَّجُلُ الشَّخِيصُ الْجَافِي هَدَفًا. وَالْهَدَفُ:
            الْغَرَضُ»"
          source: "مقاييس اللغة لابن فارس (entry_id: 989348)"

    # ───── مرشح المرحلة ١: مُسَدِّد ─────
    - lemma: "مُسَدِّد"
      expands:
        - text: "«يُسَدِّد؛ يُصوِّب — تسديد؛ تصويب — براعة التسديد» (ترجمة aim)"
          source: "المورد الحديث (2008) — arabterm (entry_id: 669421)"
          addition: >
            يُثبت أن مُسَدِّد (الفعل والمصدر) استُخدم في العربية الحديثة بمعنى
            "التوجيه الدقيق نحو الهدف"، مما يُضفي مشروعية على اسم الفاعل مُسَدِّد.

    # ───── مرشح المرحلة ١: قَاذِف ─────
    - lemma: "قَاذِف"
      evidence_status: "no_material_found"

    # ───── مرشح المرحلة ١: مُصَوِّب ─────
    - lemma: "مُصَوِّب"
      contradicts:
        - text: "«الْمِصْوَبُ: الْمِغْرَفَةُ»"
          source: "المعجم الكبير (entry_id: 57331)"
          conflict: >
            مُصوَّب/مِصوَب في المعجم يعني "المغرفة" (أداة مطبخية)، وهو بعيد كل
            البُعد عن الدلالة الرياضية المقصودة. الجذر صوب يدل أساساً على النزول
            والاستقرار (صوَّب = نحَّى لأسفل) لا على التسديد.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ───── لمّة موجودة: رامٍ ─────
    - lemma: "رامٍ"
      decision: confirmed
      decision_reason: >
        رامٍ اسم فاعل فصيح من الجذر المعتل (رمى)، يدل على من يرمي، وقد وثَّقه
        المعجم الكبير صراحةً بمعنى "من حرفته الرماية". ويُلائم مفهوم المجموعة
        لا سيما في رمي كرة السلة نحو السلة. المصطلح مستعمل في التغطيات الرياضية
        العربية (الرامي في كرة السلة). يحتاج فقط إلى ضبط التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        رَامٍ يُركِّز على فعل الرمي بالأصابع واليد، وهو الأنسب لكرة السلة
        والرياضات التي تعتمد الإطلاق باليد؛ يحمل طابع الحرفة والممارسة المتخصصة
        ("من حرفته الرماية").
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَامٍ"

    # ───── لمّة موجودة: مُسدد ─────
    - lemma: "مُسدد"
      decision: confirmed
      decision_reason: >
        الشكل المقصود هو مُسَدِّد (اسم فاعل من سدَّد، الباب الثاني) بمعنى "من
        يُسَدِّد الكرة نحو الهدف". الكتابة الحالية "مُسدد" بدون تشكيل تامّ تُبقيه
        مبهماً بين مُسَدِّد (فاعل) ومُسَدَّد (مفعول). الدليل المعجمي الوحيد الموجود
        (مقاليد العلوم) يُثبت مُسَدِّد بمعنى طبي مناقض، غير أن الاشتقاق الرياضي
        مشروع معجمياً ومُستخدَم فعلاً في الوسائط الإعلامية الحديثة، إذ يُقابل
        بوضوح مصطلح "shooter" في سياق التسديد. يُصحَّح التشكيل إلزامياً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُسَدِّد يُركِّز على التوجيه الدقيق والمُحكَم نحو الهدف (من سدَّد بمعنى
        قوَّم وأقام ووجَّه)، ويصلح لكرة القدم وكرة السلة وغيرهما؛ هو المصطلح
        الأكثر عمومية وشيوعاً في التغطيات الرياضية الحديثة لكل من يُصوِّب نحو
        المرمى، بصرف النظر عن نوع الحركة (ركل أو رمي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسَدِّد"

    # ───── مرشح المرحلة ١: هَدَّاف ─────
    - lemma: "هَدَّاف"
      source: stage1
      decision: confirmed
      decision_reason: >
        هَدَّاف مُسجَّل في المعجم الوسيط (الطبعة الحديثة) بالدلالة الرياضية ذاتها
        حرفياً: "من يُحسن تسديد الكرة إلى المرمى (محدثة)"، وهو تطابق معجمي مباشر
        لمفهوم المجموعة. صيغة فعَّال للمبالغة تُفيد الاحتراف والإتقان. الجذر
        هدف أصيل (الهدف = الغرض والمرتفع). المصطلح شائع في الصحافة الرياضية
        العربية. يجب إضافته إلى المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        هَدَّاف صيغة مبالغة تنطوي على الإتقان والكثرة ("من يُحسن تسديد الكرة")،
        وتُستخدم غالباً للاعب المُحترف كثير التصويب أو كثير التسجيل؛ وكثيراً ما
        تتضمن ضمناً مهارة الإصابة، لا مجرد محاولة التسديد.
      actions:
        - command: create_entry
          params:
            lemma: "هَدَّاف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ───── مرشح المرحلة ١: مُسَدِّد ─────
    - lemma: "مُسَدِّد"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق هذا المرشح مع اللمّة الموجودة (مُسدد) بعد تصحيح التشكيل. لا حاجة
        لإنشاء مدخل جديد؛ تكفي إجراءات update_lemma الواردة ضمن اللمّة الموجودة.

    # ───── مرشح المرحلة ١: قَاذِف ─────
    - lemma: "قَاذِف"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي دليل معجمي يُثبت قَاذِف بالدلالة الرياضية المقصودة.
        علاوة على ذلك، قذف في العربية يحمل تبعة دلالية سلبية في الفقه والأعراف
        (الاتهام)، مما يجعله مثقلاً بإيحاءات غير ملائمة للسياق الرياضي.

    # ───── مرشح المرحلة ١: مُصَوِّب ─────
    - lemma: "مُصَوِّب"
      source: stage1
      decision: removed
      decision_reason: >
        الدليل المعجمي الوحيد للجذر صوب في سياق الأدوات يُثبت مِصوَب بمعنى
        "مِغرفة" (أداة مطبخية). الجذر صوب يدل أصلاً على النزول والاستقرار لا على
        التسديد. ولم يُثبَت مُصَوِّب في أي معجم بالمعنى الرياضي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "(في الرياضة) لاعب يقود أو يركل الكرة نحو الهدف (أو لاعب كرة سلة يرمي
      نحو السلة)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يشوبه عدة إشكاليات: (١) "يقود الكرة" تعبير غير مألوف في
        العربية الرياضية (يُقال يُسَدِّد أو يُضرب لا يقود نحو الهدف)؛ (٢) البنية
        الأسلوبية بها تداخل بين قوسَيْن وتكرار (أو لاعب كرة سلة) يُضعف التماسك؛
        (٣) التعريف مترجَم حرفياً من الإنجليزية ولا يُقابله أسلوب المعجم العربي.
    authored:
      - type: terminological
        text: >
          لاعبٌ في إحدى الرياضات الجماعية يتولَّى تسديدَ الكرة نحو مرمى الفريق
          الخصم أو سلَّته، سواءٌ بركلها كما في كرة القدم، أو برميها كما في كرة
          السلة، بهدف إحراز النقاط.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          مَن يُسَدِّد الكرةَ نحو الهدف في الألعاب الجماعية ركلاً أو رمياً.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            لاعبٌ في إحدى الرياضات الجماعية يتولَّى تسديدَ الكرة نحو مرمى الفريق
            الخصم أو سلَّته، سواءٌ بركلها كما في كرة القدم، أو برميها كما في كرة
            السلة، بهدف إحراز النقاط.
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "مَن يُسَدِّد الكرةَ نحو الهدف في الألعاب الجماعية ركلاً أو رمياً."

  examples:
    per_lemma:
      - lemma: "رَامٍ"
        examples:
          - text: >
              أطلق الرَّامي في الربع الأخير ثلاثَ رميات متتالية صوب السلة
              فأحرز بها ستَّ نقاط رفعت رصيد فريقه إلى المقدمة.
            type: usage

