    concerns:
      - "المجموعة تصف شخصاً بعينه (instance synset)، لا مفهوماً مشتركاً؛ مما يجعل منهجية التوليد المصطلحي المعتادة (اشتقاق، مجاز، تركيب) غير قابلة للتطبيق — الوحيد الممكن هو التعريب الصوتي للاسم."
      - "التعريف الحالي 'معماري ياباني (ولد عام 1913)' شديد الإيجاز؛ لا يُميِّز صاحبه عن أي معماري ياباني آخر وُلد في العام نفسه، وهو ترجمة حرفية من الإنجليزية."
      - "اللمّتان خاليتان من التشكيل."
      - "غياب أي معلومة بيوغرافية مُميِّزة في التعريف."
    observations: "هذه مجموعة لاسم علم ياباني محدد (معماري مشهور مولود عام 1913)؛ كل لمّاتها تعريبات صوتية (transcriptions) وليست مصطلحات مولّدة. اللمّة الأولى هي اللقب وحده، والثانية هي الاسم الكامل. لا يُجدي البحث في المعاجم العربية لأسماء الأعلام الأجنبية عادةً. القضية الجوهرية هي جودة التشكيل وصحة التعريب، لا البحث عن مرادفات."
  blind_candidates:
    - lemma: "تَانْغِه"
      generation_method: taarib
      justification: "التعريب الصوتي المعياري لاسم العائلة Tange، بإضافة الهاء في النهاية لتعكس الحرف الأخير الياباني، وهو أسلوب شائع في تعريب الأسماء اليابانية."
    - lemma: "كِينْزُو تَانْغِه"
      generation_method: taarib
      justification: "التعريب الصوتي للاسم الكامل Kenzo Tange، مع الإبقاء على المدّة الطويلة في 'كِينْزُو' للتعبير عن الصوت الأصلي ケンゾウ."
    - lemma: "كَنْزُو تَانْغِه"
      generation_method: taarib
      justification: "صيغة بديلة شائعة في المصادر العربية تحذف مدّة الكسرة في 'كَنْزُو' وفق التعريب المقطعي المختصر، وكثيراً ما تظهر في المطبوعات العربية."
    - lemma: "تَانْغِي"
      generation_method: taarib
      justification: "صيغة بديلة تستبدل الهاء الأخيرة بالياء، متّبعاً أسلوباً يستخدمه بعض المترجمين العرب في تعريب الأسماء اليابانية المنتهية بـ e صامتة."


