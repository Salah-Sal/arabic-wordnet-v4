# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14487055-n
# المفهوم: a lack of competence — نقص الكفاءة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «عدم كفاءة» تعبير مركب إضافي سلبي (عدم + كفاءة)، قد لا يكون مصطلحاً مسكوكاً ثابتاً بل عبارة وصفية حرة"
      - "التعريف العربي «نقص الكفاءة» شديد الإيجاز ولا يميّز المفهوم عن المرادفات المحتملة"
      - "اللمّتان الموجودتان لا تحملان تشكيلاً"
    observations: "المفهوم يدلّ على حالة انعدام القدرة الكافية أو القصور عن بلوغ المطلوب، وهو مفهوم عربي أصيل تعبّر عنه ألفاظ عديدة مثل العجز والقصور والتقصير. التعريف الإنجليزي (a lack of competence) يركّز على غياب الكفاءة بوصفه صفة سلبية ملازمة وليس فعلاً إرادياً. المفهوم ينتمي إلى حقل العيوب ونقاط الضعف (hypernym: عيب أو نقطة ضعف)."
  blind_candidates:
    - lemma: "قُصُور"
      generation_method: ishtiqaq
      justification: "مصدر قَصَرَ عن الشيء قُصُوراً أي عجز عنه ولم يبلغ مداه، من جذر ق-ص-ر الدالّ على عدم بلوغ الغاية. مناسب تماماً لمفهوم نقص الكفاءة."
    - lemma: "عَجْز"
      generation_method: ishtiqaq
      justification: "مصدر عَجَزَ يَعْجِزُ من جذر ع-ج-ز الدالّ على الضعف وعدم القدرة. لفظ أصيل يفيد انعدام المقدرة."
    - lemma: "إِعْوَاز"
      generation_method: ishtiqaq
      justification: "مصدر أَعْوَزَ من جذر ع-و-ز الدالّ على سوء الحال والافتقار، يُستعمل مجازاً في نقص المقدرة والكفاية."
    - lemma: "تَقْصِير"
      generation_method: ishtiqaq
      justification: "مصدر قَصَّرَ تقصيراً من جذر ق-ص-ر على وزن تفعيل، يفيد التواني وعدم بلوغ المطلوب. يُستعمل في سياق القصور عن أداء الواجب."

stage2_evidence:
  per_lemma:
    - lemma: "عَدَمُ كَفَاءَة"
      confirm:
        - text: "«(1) لاملاءمة (2) نَقْص؛ عدم كفاية.»"
          source: "المورد الحديث (2008) — مقابل inadequacy"
        - text: "«(1) «أ» عدم كفاية [أخلاقية أو عقلية]. «ب» اللّاكفاءة: عدم الأهلية لمنصب (2) نَقْص؛ قصور [في المؤن إلخ]»"
          source: "المورد الحديث (2008) — مقابل insufficiency"
        - text: "«(1) لاأهليّة؛ لاصلاحية (2) عدم وفاء بالمراد (3) عجز؛ لاكفاءة.»"
          source: "المورد الحديث (2008) — مقابل incompetence"
      expands:
        - text: "«الكَفَاءَةُ: المماثلةُ فى القوة والشرف ومنه الكفاءة فى الزَّواج للعمل: القدرةُ عليه وحسن تصريفه»"
          source: "المعجم الوسيط"
          addition: "الكفاءة في أصلها المماثلة ثم توسّعت لتشمل القدرة على العمل، فعدمُها يعني غياب هذه القدرة"
        - text: "«كَفَاءَة — الرأي: مرفوضة — لأنها لم ترد بهذا المعنى في المعاجم. الصواب: كِفاية... ولكن يمكن تصحيح المثال المرفوض، لأن بعض المعاجم الحديثة كالمعجم الوسيط أوردت الكفاءة بمعنى الكفاية، وهو ما أجازه مجمع اللغة المصري.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الكفاءة بمعنى القدرة استعمال حديث أجازه المجمع اللغوي"

    - lemma: "قُصُور"
      confirm:
        - text: "«القُصور: العجزُ.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«القُصورُ: الخُلُوّ عن المعاني الباعثة على تحرّي الخيرات، والفضائل، وعدم التمكّن من أسبابها.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«قَصَرْتُ عنه قُصُوراً: عَجَزْتُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«قصور = insufficiency / inadequacy / incompetence / deficiency»"
          source: "المعجم الطبي الموحد (2009) + معاجم ALECSO المتعددة"
          addition: "قصور مصطلح مستقرّ في الطب والعلوم والاقتصاد بمعنى عدم الكفاية الوظيفية"

    - lemma: "عَجْز"
      confirm:
        - text: "«العَجْزُ والمَعْجِزُ والمَعْجِزَةُ والعُجُوزُ بالضم: الضَّعْفُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«عَجِزَ عن الشيء يَعْجِزُ عَجْزاً، فهو عاجزٌ، أي ضعيفٌ. وقولهم إنّ العَجْزَ نقيضُ الحَزْم فمن هذا؛ لأنه يَضْعُفُ رأيُه.»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«العَجْزُ: مُؤَخَّرُ الشيءِ... والعَجْزُ: الضَّعْفُ»"
          source: "القاموس المحيط"
          conflict: "العجز لفظ مشترك بين الضعف ومؤخّر الشيء، ودلالته أعمّ من مجرد نقص الكفاءة — يشمل العجز البدني والعقلي والإرادي"

    - lemma: "إِعْوَاز"
      contradicts:
        - text: "«العَوَز: أن يُعْوِزَ الإنسانَ الشيءُ الذي هو محتاجٌ إليه، يرومُه ولا يتهيّأ له. وأَعْوَزَ الرجلُ: ساءت حالُه.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الإعواز يدلّ على الفقر وسوء الحال المادي، وليس على نقص الكفاءة أو القدرة الذاتية"

    - lemma: "تَقْصِير"
      confirm:
        - text: "«تقصير = deficiency»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "«قَصَّرْتُ في الأمر تقصيراً، إذا تَوانَيْتُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "التقصير يفيد التواني الإرادي والتفريط في الواجب، بينما المفهوم المطلوب (lack of competence) صفة ملازمة وليست فعلاً اختيارياً"

stage3_analysis:
  per_lemma:
    - lemma: "عَدَمُ كَفَاءَة"
      decision: confirmed
      decision_reason: "تعبير مركب إضافي شائع في الاستعمال المعاصر لترجمة incompetence/inadequacy، وأقرّه المورد الحديث والمعاجم الموحّدة. وإن لم يكن مصطلحاً تراثياً مسكوكاً فهو وحدة معجمية مستقرة في لغة الإدارة والقانون."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على انعدام الأهلية والصلاحية الذاتية (الجانب الشخصي)، بينما القصور يركّز على عدم بلوغ الحدّ المطلوب (الجانب الوظيفي)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمُ كَفَاءَة"

    - lemma: "قُصُور"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل من جذر ق-ص-ر، ثابت في المعاجم الكلاسيكية (مقاييس اللغة، التعريفات الفقهية) بمعنى العجز وعدم بلوغ المدى. مصطلح مستقرّ في الطب والعلوم بمعنى insufficiency."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على عدم بلوغ الحدّ الوظيفي المطلوب والخلوّ عن أسباب الكمال، بينما «عدم كفاءة» يدلّ على غياب الأهلية الشخصية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قُصُور"

    - lemma: "عَجْز"
      source: stage1
      decision: removed
      decision_reason: "العجز أعمّ دلالةً من نقص الكفاءة، إذ يشمل الضعف البدني ومؤخّر الشيء وعدم القدرة عموماً. كما أنه يتقاطع مع ألفاظ المرادفة الأعلى (hypernym: ضعف، نقص). دلالته لا تختصّ بنقص المقدرة المهنية أو العقلية."
      evidence_assessment:
        case: mixed

    - lemma: "إِعْوَاز"
      source: stage1
      decision: removed
      decision_reason: "الإعواز في أصله اللغوي يدلّ على الفقر وسوء الحال المادي، وليس على نقص القدرة الذاتية أو الكفاءة. نقله إلى معنى lack of competence توسّع غير مسوّغ."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَقْصِير"
      source: stage1
      decision: removed
      decision_reason: "التقصير يفيد التواني الإرادي والتفريط في الواجب، وليس نقص القدرة الذاتية. المفهوم المطلوب صفة ملازمة (state) لا فعل اختياري (act). كما أنّ التقصير يحمل دلالة أخلاقية لا تنطبق على المعنى المجرد."
      evidence_assessment:
        case: mixed

