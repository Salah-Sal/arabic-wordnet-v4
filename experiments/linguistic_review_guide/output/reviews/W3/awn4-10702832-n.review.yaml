# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "سباح"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة دلالياً ومُوثَّقة في المعجم الوسيط والمعجم الكبير ومعجم اللغة
        العربية المعاصرة بمعنى «من يجيد السباحة». غير أن الرسم الخالي من التشكيل
        يُبيح لبساً في القراءة (سَبَاح اسم موضع، سِبَاح جمع سَبْحة). التشكيل الصحيح
        هو سَبَّاح على وزن فَعَّال الدال على الاحتراف والمبالغة في الفعل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: >
        وزن فَعَّال مناسب تماماً للرياضي المحترف: نجّار، بنّاء، سبّاح — يدل على
        الاحتراف والاتخاذ حرفةً أو اختصاصاً.
      nuance_differentiation: >
        سَبَّاح يُركّز على الاحتراف والمهارة العالية في السباحة بوصفها تخصصاً رياضياً
        (فَعَّال)، بينما عَوَّام يُركّز على جودة الأداء الحركي للسباحة ذاتها (السباح
        الماهر تقنياً). سَبَّاح هو المصطلح الأكثر شيوعاً في السياق الرياضي التنافسي
        المعاصر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَبَّاح"

    # ── مرشح المرحلة ١: سَابِح ──
    - lemma: "سَابِح"
      source: stage1
      decision: removed
      decision_reason: >
        سابح اسم فاعل (فاعل من سبح) يصف الحالة الآنية للسباحة، وهو في التراث
        العربي أكثر تعلقاً بوصف الخيل السريعة (كما في مقاييس اللغة والقرآن الكريم:
        «وَالسَّابِحَاتِ سَبْحًا»). استخدامه اسماً ثابتاً للرياضي المتخصص أضعف من
        سَبَّاح الذي يحمل دلالة الاحتراف والاختصاص. المورد الحديث يُدرجه إلى جانب
        سَبَّاح كبديل لا كمصطلح مستقل راسخ، وهذا لا يكفي للإدراج في مجموعة ترادفية
        تستلزم التمييز الدلالي الدقيق.
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: عَوَّام ──
    - lemma: "عَوَّام"
      source: stage1
      decision: confirmed
      decision_reason: >
        عَوَّام مُوثَّق في المعجم الوسيط (OCR) وهو أعلى درجات الأدلة بمعنى «السَّبَّاح
        الماهر»، كما ورد في المعجم الوسيط (hawramani) وموسوعة السلطان قابوس بنفس
        المعنى. وزن فَعَّال من جذر عوم (العوم = السباحة) يُعطيه مشروعية صرفية
        قوية. إدراجه يُثري المجموعة بمرادف ذي فارق دلالي طفيف عن سَبَّاح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_fit: >
        وزن فَعَّال من عوم صحيح قياسياً ومُنتج: عَوَّام يوازي سَبَّاح في صيغة
        المبالغة، مشتق من الجذر الرديف للسباحة في العربية.
      nuance_differentiation: >
        عَوَّام يُركّز على الإتقان التقني للسباحة (السباح الماهر بدقة الحركة) وجاء
        في معظم الشواهد وصفاً للكفاءة الحركية، بينما سَبَّاح مصطلح الاحتراف الرياضي
        والتنافسي المعاصر. الفارق كالفارق بين «ماهر في الفن» و«محترف في المهنة».
      actions:
        - command: create_entry
          params:
            lemma: "عَوَّام"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10702832-n"

    # ── مرشح المرحلة ١: رياضي السباحة ──
    - lemma: "رِيَاضِيُّ السِّبَاحَة"
      source: stage1
      decision: removed
      decision_reason: >
        رياضي السباحة عبارة وصفية حرة لا تُشكّل وحدة معجمية ثابتة. اختبار السكّ
        يُفشلها: يمكن إبدال «رياضي» بـ«بطل» أو «لاعب» وتبقى الجملة وصفاً سليماً،
        مما يُثبت أنها ليست مصطلحاً مسكوكاً. لا شاهد معجمي على تداولها وحدةً اصطلاحية.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: سَبَّاح (مكرر) ──
    - lemma: "سَبَّاح"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمة الموجودة «سباح» بعد ضبطها بالتشكيل الصحيح. الإجراء
        اللازم هو تحديث تشكيل اللمة الموجودة إلى «سَبَّاح» (راجع إجراء update_lemma
        أعلاه) لا إنشاء مدخل مكرر.
      evidence_assessment:
        case: confirm_only


