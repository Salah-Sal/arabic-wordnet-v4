# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «سباح» خالية من التشكيل؛ قد تُقرأ سَبَاح (اسم موضع) أو سِبَاح (جمع سَبْحة) بدلاً من سَبَّاح المقصودة على وزن فَعَّال"
      - "التعريف الحالي «رياضي مدرب يشارك في مسابقات السباحة» يُعيد ذكر الجنس المباشر (رياضي) دون إضافة فارقة كافية تُميّز السبّاح من سائر الرياضيين"
    observations: >
      المجموعة مخصصة للرياضي المتخصص في السباحة التنافسية. المفهوم عربي أصيل تتواتر ألفاظه
      في المعاجم الكلاسيكية والمعاصرة. اللمّة المُدرجة صحيحة المعنى لكنها تحتاج إلى ضبط
      بالتشكيل الكامل. العربية تمتلك اشتقاقَين راسخَين لهذا المعنى: سَبَّاح (من سبح، فَعَّال
      للاحتراف) وعَوَّام (من عوم، فَعَّال للمهارة). كلاهما مُوثَّق في المعجم الوسيط
      والمعجم الكبير ومعجم اللغة العربية المعاصرة.

  blind_candidates:
    - lemma: "سَابِح"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر سبح على وزن فاعل (اسم الفاعل) — الذي يسبح. مشتق مباشر طبيعي
        يُستخدم في اللغة وصفاً للمتنافس في مياه السباحة.
    - lemma: "عَوَّام"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر عوم على وزن فَعَّال الدال على الاحتراف والمبالغة في الفعل.
        العَوْم في العربية هو السباحة ذاتها، فالعَوَّام هو السبّاح المُتقِن المحترف.
    - lemma: "رِيَاضِيُّ السِّبَاحَة"
      generation_method: tarkib
      justification: >
        مركب إضافي: رياضي + السباحة، يُحدّد تخصص الرياضي ويُميّزه عن سائر الرياضيين.
        يلتزم بنية إضافة الاسم إلى المصدر لتحديد مجال الممارسة.
    - lemma: "سَبَّاح"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر سبح على وزن فَعَّال الدال على المبالغة والاحتراف والمداومة على
        الفعل. الوزن مُنتج للحِرَف والمهن: نجّار، بنّاء، سبّاح. يُفيد ملاءمة المعنى
        التنافسي الذي يستلزم الإتقان والمداومة.


