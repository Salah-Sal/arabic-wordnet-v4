# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14018863-n
# excessive freedom; lack of due restraint
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«تحرر مفرط» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تكرّر التعريف نفسه"
      - "«فلتان» صفة للرجل الجريء أو الفرس النشيط في المعاجم، لا اسم مجرد يدل على الحرية المفرطة"
      - "التعريف العربي الحالي أقرب إلى الشرح اللغوي منه إلى التعريف المعجمي المنهجي"
    observations: >
      المجموعة تدل على مفهوم أخلاقي-اجتماعي: الحرية التي تتجاوز حدودها حتى تصير تحللاً.
      المرادف الإنجليزي license/licence بمعناه الثالث (لا بمعنى الرخصة) يشير إلى
      التحلل من القيود الأخلاقية والاجتماعية. العربية غنية بألفاظ هذا الحقل الدلالي:
      إباحية، تسيّب، انفلات، تحلّل، مجون، فسوق. والمعنى الفارق لهذه المجموعة هو
      التركيز على «الإفراط في الحرية» لا على الفعل المنحرف ذاته.
  blind_candidates:
    - lemma: "إِبَاحِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «إباحة» على وزن فِعَالِيَّة، من جذر ب-و-ح الدال على السعة
        والبروز. الإباحة هي رفع الحظر، والإباحية هي حالة التحلل من القيود — مطابقة
        تامة لمعنى «حرية مفرطة وانعدام القيود».
    - lemma: "تَسَيُّب"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَعُّل من «سيَّبَ» أي ترك الشيء يذهب حيث شاء، من جذر س-ي-ب الدال
        على استمرار الشيء وذهابه بلا قيد. التسيّب يدل على انعدام الضوابط والإهمال
        في الالتزام بالقوانين.
    - lemma: "اِنْفِلَات"
      generation_method: ishtiqaq
      justification: >
        مصدر اِنْفِعَال من «فَلَتَ» أي تخلّص في سرعة، من جذر ف-ل-ت. الانفلات يدل
        على التحرر المفاجئ من القيود، ويُستعمل كثيراً في التعبير عن غياب الضبط
        (انفلات أخلاقي، انفلات أمني).
    - lemma: "تَحَلُّل"
      generation_method: ishtiqaq
      justification: >
        مصدر تَفَعُّل من «حَلَّ» القيدَ أي فكّه، من جذر ح-ل-ل. التحلل يدل على
        الانفكاك التدريجي من القيود والالتزامات الأخلاقية والقانونية.

stage2_evidence:
  per_lemma:
    - lemma: "إِبَاحِيَّة"
      confirm:
        - text: "«التحلُّل من قيود القوانين والأخلاق»"
          source: "المعجم الكبير"
        - text: "«التحلل من قيود القوانين والأخلاق»"
          source: "المعجم الوسيط"
        - text: "«إباحية، تحرّر مطلق: حركة ظهرت في القرن(16) اعتبرت العالم كله مادة، ونادت باستقلال القواعد الأخلاقية عن الكنيسة والدولة»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«إباحية، تحلُّل من الأعراف: حركة ظهرت في أوروبا في القرن (17)، تعني في الأصل التحرر من القواعد الدينية، وتعني حاليا التعاطي للملذات الجسدية بجرأة تتجاوز حدود الأخلاق المتعارف عليها»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«فرقة تُبطل قدرة العبد على اجتناب المنهيات والإتيان بالمأمورات وتنفي ملكية الفرد, وتشرك الجميع في الأموال والأزواج. (محدثة)»"
          source: "المعجم الوسيط"
          addition: "معنى ثانٍ للإباحية: فرقة من المتصوفة المبطلين — دلالة طائفية لا دلالة أخلاقية مجردة"
        - text: "«الإباحيّة: هي فرقة من المتصوّفة المبطلة. قالوا ليس قدرة لنا على الاجتناب عن المعاصي...»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "تأكيد المعنى الطائفي التاريخي"

    - lemma: "تَحَرُّر مُفْرِط"
      evidence_status: "no_material_found"

    - lemma: "فَلَتَان"
      contradicts:
        - text: "«من الخيل: الفَلْتُ. من الرجال: الصُّلْبُ الجريء الحديد الفؤاد. المكتنز اللحم»"
          source: "المعجم الوسيط"
          conflict: "الفَلَتان صفة مشبهة تدل على الجرأة والقوة في الرجال والنشاط في الخيل، لا اسم مجرد يدل على الحرية المفرطة"

    - lemma: "تَسَيُّب"
      confirm:
        - text: "«الإهمـالُ وانعـدامُ الضـوابط, وضَعْفُ الالتزام بالقوانين»"
          source: "المعجم الكبير"
        - text: "«التَّسَيُّب الإداريّ [صحيحة]. التعليق: لم يرد الفعل «تسيَّب» في المعاجم القديمة وإنما ورد «سيَّب» بمعنى ترك وأهمل، وكثيرًا ما تأتي صيغة تَفَعَّل مطاوعة لصيغة فَعَّل، وعلى ذلك يكون تسيَّب مطاوعًا للفعل سَيَّب، ويصح كذلك استعمال المصدر التسيُّب، وهذا ما جعل مجمع اللغة المصري يجيز هذا اللفظ»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"

    - lemma: "اِنْفِلَات"
      expands:
        - text: "«محرف مراقبة يستعمل عادة لإلغاء تنفيذ برنامج أو وظيفة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          addition: "المعنى المسجل في المعاجم المصطلحية هو معنى تقني (Escape) لا أخلاقي"

    - lemma: "تَحَلُّل"
      contradicts:
        - text: "«هدم نتيجة لتخريب الغشاء الخلويّ»"
          source: "المعجم الموحد لمصطلحات علم الوراثة"
          conflict: "الاستعمال المصطلحي المسجّل كيميائي/بيولوجي لا أخلاقي"
      expands:
        - text: "«التحلُّل من قيود القوانين والأخلاق»"
          source: "المعجم الوسيط (تحت مدخل الإباحية)"
          addition: "يرد التحلل في تعريف الإباحية ذاتها مما يؤكد العلاقة الدلالية، لكنه مستعمل كجزء من التعريف لا كمدخل مستقل بهذا المعنى"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "إِبَاحِيَّة"
      decision: confirmed
      decision_reason: >
        مؤكدة بأدلة قوية من المعجم الوسيط والمعجم الكبير والمعاجم المصطلحية.
        التعريف المعجمي «التحلل من قيود القوانين والأخلاق» يطابق معنى المجموعة تماماً.
        الجذر ب-و-ح يدل على السعة والبروز، والإباحية مصدر صناعي منتظم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تتميز «الإباحية» بدلالتها على التحلل الأخلاقي المنهجي والمبدئي من القيود،
        وترتبط بالموقف الفكري أو الحركة الاجتماعية، بخلاف «التسيّب» الذي يدل
        على الإهمال العملي والتراخي في تطبيق الضوابط.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِبَاحِيَّة"

    - lemma: "تَحَرُّر مُفْرِط"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تفشل في اختبار السكّ: يمكن إبدال «مفرط» بـ«شديد» أو «زائد»
        وتبقى العبارة وصفية صالحة. كما أنها تكاد تكرر التعريف نفسه (حرية مفرطة)
        مما يُوقع في الدوران. لا شاهد معجمي على تثبيتها كوحدة مصطلحية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فَلَتَان"
      decision: removed
      decision_reason: >
        الفَلَتان في المعاجم صفة مشبهة تدل على الرجل الجريء الصُّلب أو الفرس النشيط،
        وهي صفة للأشخاص لا اسم مجرد يدل على مفهوم «الحرية المفرطة».
        الاستعمال العامي المعاصر لـ«فلتان» بمعنى الخارج عن السيطرة لهجيّ لا فصيح،
        والنقل الدلالي من الصفة إلى المفهوم المجرد غير مسوّغ معجمياً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَسَيُّب"
      source: stage1
      decision: confirmed
      decision_reason: >
        مؤكد بأدلة من المعجم الكبير («الإهمال وانعدام الضوابط وضعف الالتزام بالقوانين»)
        ومعجم الصواب اللغوي (أجازه مجمع اللغة المصري). المعنى يتقاطع مع معنى المجموعة
        في جانب «انعدام القيود الواجبة». الوزن تَفَعُّل منتظم ومقبول صرفياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يتميز «التسيّب» بدلالته على الإهمال العملي والتراخي في تطبيق الضوابط والقوانين،
        وهو أقرب إلى السياق الإداري والمؤسسي، بخلاف «الإباحية» التي تدل على
        موقف مبدئي من القيود الأخلاقية.
      actions:
        - command: create_entry
          params:
            lemma: "تَسَيُّب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اِنْفِلَات"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوجد شاهد معجمي على استعمال «الانفلات» بمعنى الحرية المفرطة المجردة.
        المعنى المسجّل في المعاجم المصطلحية تقني (Escape). وإن شاع استعماله
        في الإعلام المعاصر (انفلات أمني/أخلاقي) فهو في تلك السياقات مركب إضافي
        لا لفظ مفرد مستقل بالدلالة المطلوبة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تَحَلُّل"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى المصطلحي المسجّل في المعاجم كيميائي/بيولوجي (decomposition).
        وإن ورد «التحلل من القيود» في تعريف الإباحية، فهو مستعمل كعنصر تفسيري
        في سياق التعريف لا كمدخل مستقل بهذا المعنى الأخلاقي المجرد.
        يؤدي إدراجه إلى اشتراك لفظي مُلبس مع الدلالة العلمية الراسخة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

