      reason: >
        التعريف الحالي أقرب إلى الشرح اللغوي السريع منه إلى التعريف المعجمي المنهجي.
        يفتقر إلى جنس قريب واضح وفصل نوعي دقيق. كما أن عبارة «القيود الواجبة»
        مبهمة ولا تحدد طبيعة هذه القيود.
    authored:
      - type: terminological
        text: "حالةٌ من التحلُّل من القيود الأخلاقية والاجتماعية والقانونية تتجاوز فيها الحريةُ الفرديةُ حدودَها المشروعة"
