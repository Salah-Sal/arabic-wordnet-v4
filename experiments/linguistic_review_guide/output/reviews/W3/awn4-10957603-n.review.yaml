# ── المرحلة ١: المراجعة والتوليد ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة دُورُوثِيا دِيكْس تفتقر إلى تشكيل كامل: الياء في (دُورُوثِيا) بلا فتحة"
      - "يوجد في الإنجليزية ثلاثة أشكال (Dix / Dorothea Dix / Dorothea Lynde Dix) في حين يوجد في العربية شكل واحد فقط"
      - "هذه المجموعة تُمثّل اسم عَلَم لشخصية تاريخية بعينها، والمناسب في قاعدة البيانات تسجيلها تحت pos=proper_noun لا pos=n مجرداً"
      - "التعريف العربي لا يذكر دورها في الإشراف على ممرضات الجيش في الحرب الأهلية"
    observations: >
      هذه مجموعة ترادفية لشخصية تاريخية فردية هي المُصلِحة الاجتماعية الأمريكية دوروثيا دِيكْس
      (1802-1887). اللمّة العربية الوحيدة هي تعريبٌ بالنقل الصوتي لاسمها الإنجليزي. نظراً لكون
      المجموعة تُمثّل اسم علم (proper noun)، فإن أساليب التوليد المعجمي الاشتقاقي والمجازي غير
      منطبقة؛ والتعريب (النقل الصوتي) هو الأسلوب الوحيد الممكن. التحدي الرئيسي يكمن في توحيد
      أشكال الاسم وضبط تشكيلها، وإضافة الشكل الكامل (بالاسم الأوسط) مقابلاً للإنجليزية.

  blind_candidates:
    - lemma: "دُورُوثِيَا دِيكْس"
      generation_method: taarib
      justification: >
        النقل الصوتي المعتاد لـ Dorothea Dix بكتابة عربية: دُورُوثِيَا (ضمة+سكون+فتحة+كسرة+فتحة)
        ودِيكْس (كسرة+سكون). هذا الشكل هو الأكثر شيوعاً في المصادر العربية للإشارة إلى هذه الشخصية.
    - lemma: "دُورُوثِيَا لِينْدِي دِيكْس"
      generation_method: taarib
      justification: >
        النقل الصوتي للاسم الكامل Dorothea Lynde Dix المسجّل في المصادر الإنجليزية؛ يُستخدم
        للتعريف الدقيق الذي يميّزها عن غيرها من حاملات الاسم الأول ذاته.
    - lemma: "دِيكْس"
      generation_method: taarib
      justification: >
        النقل الصوتي للقب Dix وحده، كما يُذكر أحياناً في المصادر مختصَراً.
    - lemma: "دُورُوثِيَا"
      generation_method: taarib
      justification: >
        النقل الصوتي للاسم الأول Dorothea وحده، ورد في موسوعة السلطان قابوس لأسماء العرب بوصفه
        صيغة تمليح إنجليزية للاسم دوروثي تستخدم للإناث.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────
# الاستعلامات المُنفَّذة (٣ استعلامات):
#   ١. مطابقة دفعية: دوروثيا ديكس / ديكس / دوروثيا / الديكس + صيغ ال-
#   ٢. إثراء بالمعرّفات: entry_ids (924947, 925121, 88291, 89866, 88284)
#   ٣. جسر إنجليزي: Dix / Dorothea Dix / Dorothea Lynde Dix
#   ٤. FTS عربي: "اصلاح السجون" / "المرضى العقليين" / "مصلح اجتماعي"
stage2_evidence:
  per_lemma:
    - lemma: "دُورُوثِيا دِيكْس"
      expands:
        - text: >
            «دوروثيا — إحدى صيغ التمليح الإنجليزية للإسم دوروثي. يستخدم للإناث.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يؤكد أن (دوروثيا) اسم للإناث وهو ما يتّسق مع كون صاحبة هذه المجموعة امرأة؛
            لكن المدخل لا يذكر اللقب (دِيكْس) ولا الشخصية التاريخية بالتحديد.
      contradicts:
        - text: >
            «ديكس — الصيغة المختصرة للإسم ديكستر المأخوذ عن اللاتينية بمعنى محظوظ وسعيد.
            يستخدم للذكور.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            المعجم يُسجّل (ديكس) بوصفه اسماً للذكور مختصراً من Dexter، وهو مختلف تماماً
            عن اللقب العائلي Dix الذي تحمله دوروثيا دِيكْس؛ وهذا يُنشئ خطر اشتراك لفظي
            مع اللمّة المرشحة (دِيكْس) وحدها.

    - lemma: "دُورُوثِيَا لِينْدِي دِيكْس"
      evidence_status: "no_material_found"

    - lemma: "دِيكْس"
      contradicts:
        - text: >
            «ديكس — الصيغة المختصرة للإسم ديكستر المأخوذ عن اللاتينية بمعنى محظوظ وسعيد.
            يستخدم للذكور.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            يُسجَّل (ديكس) في المعجم العربي اسماً للذكور بمعنى «محظوظ»، مما يتعارض مع
            استخدامه وحده للدلالة على الشخصية الأنثوية دوروثيا دِيكْس.
        - text: >
            «الدَّيِّكَسَ — الرَّجلُ في بيتهِ: اخْتَبَأ فيه ولم يَبْرُز لحاجة القوم»
          source: "المعجم الكبير"
          conflict: >
            الجذر (دكس) في المعاجم الكلاسيكية يحمل دلالات الاختباء والانزواء، وكذلك
            «الدَّيْكِسُ» بمعنى الدَّوْكَسُ من النَّعَم؛ وهذه المعاني الكلاسيكية تخلق
            تداخلاً دلالياً غير مرغوب لو استُخدم (دِيكْس) وحده في نص عربي.

    - lemma: "دُورُوثِيَا"
      expands:
        - text: >
            «دوروثيا — إحدى صيغ التمليح الإنجليزية للإسم دوروثي. يستخدم للإناث.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يثبت توثيق الاسم في المعجم العربي وكونه للإناث، لكنه يبقى اسماً أوّل
            عاماً غير كافٍ للتعريف بشخصية بعينها.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "دُورُوثِيا دِيكْس"
      decision: confirmed
      decision_reason: >
        هي التعريب الصوتي المعتاد والأكثر تداولاً للاسم Dorothea Dix في المصادر العربية.
        موسوعة السلطان قابوس تُثبّت (دوروثيا) بوصفه اسماً للإناث. اللمّة مقبولة لكنها
        تحتاج إلى تصحيح التشكيل: الياء في (دُورُوثِيا) تستلزم فتحة لتصبح (دُورُوثِيَا).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الشكل الثنائي (الاسم الأول + اللقب العائلي) هو الصيغة المعيارية الأكثر شيوعاً
        للإشارة إلى هذه الشخصية في السياق الأكاديمي والإعلامي. يختلف عن الشكل الثلاثي
        الكامل بغياب الاسم الأوسط (لِينْدِي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُورُوثِيَا دِيكْس"

    # ── مرشحات المرحلة ١ ──
    - lemma: "دُورُوثِيَا لِينْدِي دِيكْس"
      source: stage1
      decision: confirmed
      decision_reason: >
        يطابق الشكل الإنجليزي الكامل Dorothea Lynde Dix المُسجَّل في OEWN. إضافته تُحقق
        التوازي مع المصادر الإنجليزية ويُفيد في السياقات الأكاديمية والببليوغرافية التي
        تستلزم ذكر الاسم الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الشكل الثلاثي الكامل (الاسم الأول + الأوسط + اللقب) يُستخدم في المصادر الرسمية
        والأرشيفية للتمييز الدقيق ويُجنّب اللبس مع أي شخصية أخرى تحمل الاسم الأول ذاته.
      actions:
        - command: create_entry
          params:
            lemma: "دُورُوثِيَا لِينْدِي دِيكْس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "دِيكْس"
      source: stage1
      decision: removed
      decision_reason: >
        اللقب (دِيكْس) وحده مرفوض لسببين: (١) المعجم العربي يُسجّل (ديكس) اسماً للذكور
        مختصراً من Dexter، مما يُنشئ اشتراكاً لفظياً مع اسم ذكر بمعنى مختلف؛ (٢) اللقب
        وحده لا يُعيّن الشخصية بدقة كافية في النص العربي. فضلاً عن أن جذر (دكس) في المعاجم
        الكلاسيكية يحمل معاني الاختباء والماشية، مما يزيد التداخل الدلالي غير المرغوب.

    - lemma: "دُورُوثِيَا"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الأول وحده لا يُعيّن الشخصية التاريخية ولا يؤدي وظيفة معجمية متمايزة
        في شبكة دلالية تُعنى بالتحديد؛ وهو اسم مشترك بين كثيرات. اكتفاء المعجم بوصفه
        «صيغة تمليح إنجليزية للاسم دوروثي» يُثبّت أنه ليس مصطلحاً محدداً لهذه الشخصية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────
