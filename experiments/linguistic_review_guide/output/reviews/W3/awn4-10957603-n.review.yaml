      decision: revise
      reason: >
        التعريف الحالي يُهمل دورها البارز في الإشراف على ممرضات الجيش الأمريكي إبان الحرب
        الأهلية، وهو جزء أصيل من هويتها الموثّقة في المصادر. كما أن صياغة «كانت رائدة»
        أسلوب ركيك في لغة المعجم؛ والأولى التعبير بالمصدر المنسوب.
    authored:
      - type: encyclopedic
        text: >
          مُصلِحة اجتماعية أمريكية (1802-1887)، رائدة إصلاح السجون ورعاية المرضى العقليين
          في الولايات المتحدة، وقد أشرفت على ممرضات الجيش الأمريكي خلال الحرب الأهلية.
