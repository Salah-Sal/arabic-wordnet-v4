  per_lemma:
    - lemma: "تشامبرز"
      evidence_status: "no_material_found"
    - lemma: "ويليام تشامبرز"
      evidence_status: "no_material_found"
    - lemma: "وِلْيَامُ تشَامِبِرز"
      evidence_status: "no_material_found"
    - lemma: "رُوبِرْتُ آدَم"
      evidence_status: "no_material_found"
    - lemma: "جَيمزُ وَايَت"
      evidence_status: "no_material_found"
    - lemma: "جُورْجُ دَانْسُ الأَصْغَر"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "تشامبرز"
      decision: confirmed
      decision_reason: >
        تعريب صوتي مستقر للقب الإنجليزي "Chambers"، مستخدَم في الكتابات الموسوعية
        والأكاديمية العربية. لا وجود له في قاعدة البيانات المعجمية كونه علَم أعجمي،
        وهذا لا يُضعف قبوله. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المفرد (Chambers) يُستخدَم في الإحالات المختصرة وغير الرسمية وفي
        السياقات حيث السياق يُحدد الشخص بلا لبس؛ يُقابل "Chambers" في الإنجليزية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تشَامِبِرز"

    # ── لمّة موجودة ٢ ──
    - lemma: "ويليام تشامبرز"
      decision: confirmed
      decision_reason: >
        تعريب الاسم الكامل (الاسم الأول + اللقب) بدون لقب الفروسية "سير". الصيغة
        مستقرة ومقبولة في المراجع العربية المعمارية والتاريخية. تحتاج إلى تشكيل
        وتصحيح بسيط في ترتيب المقاطع الصوتية (وِلْيَام لا وِيلْيَام).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل (الأول + اللقب) أكثر رسمية وتحديداً من اللقب المفرد؛ يُستخدَم
        في السياقات الأكاديمية والتوثيقية؛ يُقابل "William Chambers" في الإنجليزية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِلْيَامُ تشَامِبِرز"

    # ── مرشحات المرحلة ١ (جميعها مرفوضة) ──
    - lemma: "وِلْيَامُ تشَامِبِرز"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة بعد تصحيح تشكيلها؛ لا داعي للتكرار.

    - lemma: "رُوبِرْتُ آدَم"
      source: stage1
      decision: removed
      decision_reason: >
        هذا اسم معماري بريطاني مختلف (Robert Adam، 1728-1792م) وليس صاحب هذه المجموعة.

    - lemma: "جَيمزُ وَايَت"
      source: stage1
      decision: removed
      decision_reason: >
        هذا اسم معماري إنجليزي مختلف (James Wyatt، 1746-1813م) لا يتطابق مع هذه المجموعة.

    - lemma: "جُورْجُ دَانْسُ الأَصْغَر"
      source: stage1
      decision: removed
      decision_reason: >
        هذا اسم معماري بريطاني مختلف (George Dance the Younger، 1741-1825م) لا يتطابق
        مع هذه المجموعة.

  synset_actions:
    # تصحيح صنف الكلمة على مستوى المجموعة
    - command: update_synset
      params:
        synset_id: "awn4-10909657-n"
        pos: proper_noun
    # إضافة لمّة ثالثة مقابل "Sir William Chambers" في OEWN (تكافؤ مع المصدر الإنجليزي)
