# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان (تشامبرز، ويليام تشامبرز) مكتوبتان بدون تشكيل"
      - "صنف الكلمة (POS) مسجَّل كـ n، والصواب proper_noun لأنه علَم لشخص بعينه"
      - "اللمّة الثالثة الواردة في المصدر الإنجليزي (Sir William Chambers) غائبة عن اللمّات العربية"
      - "التعريف العربي مختزل جداً: 'معماري إنجليزي (1723-1796)'، دون أي معلومة موسوعية تُمكِّن المستخدم من التعرف على الشخص"
    observations: >
      بعد قراءة الملف المُقنَّع، يتضح أن المجموعة تمثّل علَماً لشخص محدد يُوصف بأنه
      «معماري إنجليزي» ولد عام 1723 وتوفي عام 1796. هذه التواريخ الدقيقة تُشير بوضوح
      إلى Sir William Chambers أحد أبرز معماريي القرن الثامن عشر في بريطانيا.
      اللمّات يجب أن تكون تعريبات صوتية دقيقة للاسم الإنجليزي، لا مصطلحات مشتقة أو مجازية،
      إذ لا سبيل إلى توليد العَلَم العربي بمنهج الاشتقاق أو المجاز أو التركيب.
      المنهج الوحيد المُتاح هو التعريب (taarib)، ويقتضي معرفة الاسم الأصلي أو الاستنتاج
      من السياق التاريخي.

  blind_candidates:
    - lemma: "وِلْيَامُ تشَامِبِرز"
      generation_method: taarib
      justification: >
        التواريخ 1723-1796م تتطابق بدقة تامة مع سيرة المعماري البريطاني Sir William Chambers
        المعروف في التاريخ المعماري. التعريب الصوتي للاسم: وِلْيَام = William، تشَامِبِرز = Chambers.
    - lemma: "رُوبِرْتُ آدَم"
      generation_method: taarib
      justification: >
        Robert Adam (1728-1792م) معماري بريطاني بارز من الحقبة ذاتها، يُرجَّح أن يكون
        المقصود إذا لم تتطابق التواريخ مع وليام تشامبرز.
    - lemma: "جَيمزُ وَايَت"
      generation_method: taarib
      justification: >
        James Wyatt (1746-1813م) معماري إنجليزي معروف من النصف الثاني من القرن الثامن عشر،
        احتمال مرجَّح بصرف النظر عن التطابق الكامل للتواريخ.
    - lemma: "جُورْجُ دَانْسُ الأَصْغَر"
      generation_method: taarib
      justification: >
        George Dance the Younger (1741-1825م) معماري إنجليزي من نفس العصر، تعريبه المركّب
        يُميّزه عن والده George Dance the Elder.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   [١] بحث دفعي بصيغ: تشامبرز، التشامبرز، ويليام تشامبرز، الويليام تشامبرز،
#       تشمبرز، شامبرز → لا نتائج
#   [٢] جسر إنجليزي: translation_en:"Chambers" OR "William Chambers" OR
#       "Sir William Chambers" OR "architect" → لا نتائج للشخص؛ وجدت مداخل
#       معمار/مهندس معماري (لا صلة بالعَلَم) وغرف... (chambers بمعنى غرف)
#   [٣] FTS عربي: "تشامبرز" OR "تشمبرز" OR "ويليام" → وجدت مداخل اسم "ويليام"
#       في موسوعة أسماء العرب لكن لا علاقة لها بالشخص المعني
#   [٤] مقاييس اللغة (dictionary_id=151): جذر عمر (للاستفادة في Stage 5)
