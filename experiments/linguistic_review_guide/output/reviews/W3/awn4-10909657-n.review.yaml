stage4_content:
  definition:
    current: "معماري إنجليزي (1723-1796)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي اختزالي للغاية: يذكر المهنة والجنسية والتواريخ فحسب دون أي
        معلومة تُعرِّف الشخص وتُميِّزه. علَم كهذا يستوجب تعريفاً موسوعياً يذكر أبرز
        إسهاماته المعمارية وموطنه وأسلوبه الفني حتى يكون التعريف وافياً بمتطلبات
        الشبكة الدلالية. كما أن النسبة "إنجليزي" دقيقتها "بريطاني من أصل اسكتلندي".
    authored:
      - type: encyclopedic
        text: >
          مِعْمَارِيٌّ بِرِيطَانِيٌّ مِنْ أَصْلٍ اسْكُتْلَنْدِيٍّ (1723م - 1796م)، وُلِدَ فِي
          غُوتِنبُورغ بِالسُّوَيدِ؛ يُعَدُّ مِنْ أَبْرَزِ رُوَّادِ الطِّرَازِ الكلاسيكيِّ الْجَدِيدِ
          فِي الْعِمَارَةِ الْبِرِيطَانِيَّةِ فِي الْقَرْنِ الثَّامِنَ عَشَرَ، وَمِنْ أَشْهَرِ أَعْمَالِهِ
          مَبْنَى سُومِرسِيتْ هَاوْس فِي لَنْدَن وَحَدِيقَةُ كِيوُ الْمَلَكِيَّةُ.
    actions:
