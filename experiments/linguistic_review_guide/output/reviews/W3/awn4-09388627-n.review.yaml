stage1_review:
  assessment:
    concerns:
      - "خلو اللمة الحالية من التشكيل الكامل."
      - "الاقتصار على لمة واحدة بالرغم من وجود مترادفات دقيقة مثل 'جون'."
    observations: "المصطلح جغرافي متخصص، والتعريب المتبع فيه صوتي للجزء العلم (ناراغانسيت) مع استخدام التصنيف الجغرافي العربي (خليج)."
  blind_candidates:
    - lemma: "خَلِيجُ نَارَاغَانْسِيت"
      generation_method: tarkib
      justification: "التركيب الإضافي القياسي لتسمية المسطحات المائية في الجغرافيا العربية."
    - lemma: "جَوْنُ نَارَاغَانْسِيت"
      generation_method: tarkib
      justification: "استخدام 'جون' للدلالة على الخليج الصغير أو المدخل البحري العميق، وهو أدق وصفياً في بعض السياقات الجغرافية."
    - lemma: "مَدْخَلُ نَارَاغَانْسِيت"
      generation_method: tarkib
      justification: "ترجمة حرفية للمصطلح الوصفي (Inlet) الوارد في التعريف."
    - lemma: "شَرْمُ نَارَاغَانْسِيت"
      generation_method: tarkib
      justification: "استخدام اللفظ التراثي 'شرم' الذي يطلق على لسان البحر الداخل في البر."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيج نَارَاغَانْسِيت"
      confirm:
        - text: "«تقع المدينة عند مصب نهر بروفيدنس على رأس خليج ناراغانسيت (Narragansett Bay)»"
          source: "سياق مترجم (Reverso Context)"
      expands:
        - text: "«الخاء واللام والجيم أصل واحد يدل على ليّ وفتل وقلة استقامة. فمن ذلك الخليج، وهو ماء يميل ميلة عن معظم الماء فيستقر.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يوضح الأصل اللغوي لكلمة خليج وعلاقتها بالانحراف عن معظم الماء."
    - lemma: "جَوْن نَارَاغَانْسِيت"
      evidence_status: "no_material_found"
    - lemma: "مَدْخَل نَارَاغَانْسِيت"
      evidence_status: "no_material_found"
    - lemma: "شَرْم نَارَاغَانْسِيت"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خليج ناراغانسيت"
      decision: confirmed
      decision_reason: "الاسم الجغرافي المتعارف عليه في المصادر العربية الحديثة والموسوعات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ نَارَاغَانْسِيت"
    - lemma: "جَوْنُ نَارَاغَانْسِيت"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق لغوياً وجغرافياً لكلمة (Bay) في هذا السياق، ويوفر تنوعاً معجمياً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "جَوْنُ نَارَاغَانْسِيت", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09388627-n"}

