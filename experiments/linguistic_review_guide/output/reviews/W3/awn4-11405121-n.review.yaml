# ═══════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان خاليتان من التشكيل الكامل رغم أن التشكيل إلزامي في AWN4"
      - "لمّة 'ويتني' مبتورة (اسم أسرة منفرداً) وقد تُوهم بشخصية أخرى حاملة لهذا الاسم (مثل ويتني هيوستن) دون سياق"
      - "غياب التصنيف الصرفي proper_noun على مستوى المدخل — الإدخال مصنّف n وهو مقبول في إطار WordNet لكن يُستحسن الإشارة"
      - "التعريف الحالي يفتقر إلى التشكيل ولا يذكر سنة الاختراع المحددة (١٧٩٣م) مما يُضعف قيمته المعلوماتية"
    observations: >
      هذه المجموعة تمثّل علماً شخصياً (اسم خاص بشخص تاريخي) وهو المخترع الأمريكي إيلي ويتني
      (Eli Whitney، ١٧٦٥-١٨٢٥م)، مخترع مِحْلَج القطن الميكانيكي عام ١٧٩٣م. اللمّتان الموجودتان
      تعريبان صوتيان للاسم الإنجليزي: الأولى الاسم الكامل، والثانية اسم الأسرة منفرداً.
      بوصفهما اسمَي عَلَم أجنبيَّيْن، لا يوجد لهما جذر عربي ولا تصريف اشتقاقي؛ وطريقة التعبير
      الوحيدة الممكنة هي التعريب الصوتي (taarib). لا توجد أدلة في المعاجم العربية على اللمّتين
      بوصفهما اسمَيْ علم، وهو أمر طبيعي لأن المعاجم اللغوية لا تُدرج أعلام الأشخاص الأجانب
      عموماً.
  blind_candidates:
    - lemma: "إِيلِي وِيتْنِي"
      generation_method: taarib
      justification: >
        نقل صوتي للاسم الكامل Eli Whitney: "Eli" → إيلي (استخدام حرف الياء للمقطع
        الطويل /iː/)، "Whitney" → وِيتْنِي (و للصائت /w/، ي للصائت الطويل /iː/، ت
        ون للصامتَين، ي للنهاية). هذا الشكل هو المعتمد في معظم المصادر العربية الموثوقة.
    - lemma: "وِيتْنِي"
      generation_method: taarib
      justification: >
        تعريب اسم الأسرة Whitney منفرداً، وهو الشكل المختصر المستخدم في الإشارة
        إلى الشخص بعد أول ذكر للاسم الكامل، أو في الفهارس والمراجع الببليوغرافية.
    - lemma: "إِيلَاي وِيتْنِي"
      generation_method: taarib
      justification: >
        تعريب بديل للاسم الأول "Eli" على نمط تعريبات أخرى (مثل إيلاي منعم)،
        حيث تُحوَّل النهاية /aɪ/ إلى "اي". أقل شيوعاً في العربية لكنه محتمل.
    - lemma: "إِيلَاي وِيتْنِي"
      generation_method: taarib
      justification: >
        صيغة بديلة تجمع إيلاي + ويتني، تُستخدم أحياناً في المصادر الأكاديمية
        العربية التي تتحرى النقل الصوتي الدقيق للاسم الإنجليزي.


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────
# استعلامات قاعدة البيانات المُنفَّذة:
# ١. مطابقة دفعية: headword_norm IN ('ايلي ويتني','الايلي ويتني','ويتني','الويتني',
#    'ايلاي ويتني','ايلي وتني') → لا نتائج
# ٢. جسر إنجليزي: translation_en:"Whitney" OR "Eli Whitney" OR "cotton gin" → نتيجتان
# ٣. FTS عربي: "محلج" OR "محلاج" OR "ويتني" → نتائج عن الأداة لا الشخص
stage2_evidence:
  per_lemma:
    - lemma: "إِيلِي وِيتْنِي"
      evidence_status: "no_material_found"

    - lemma: "وِيتْنِي"
      expands:
        - text: >
            «مُخَطَّط وتني للإجهادات: مخطط يبين توزع الإجهادات في جائز من الخرسانة
            المسلحة وفقاً لنظرية الأحمال القصوى»
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
          addition: >
            هذا المدخل يُعريب "Whitney" بصيغة "وتني" (بدون ياء) في سياق هندسي
            (Whitney stress diagram). لا يتعلق بإيلي ويتني المخترع بل بآلفريد
            هدجمان ويتني (خبير الخرسانة)، لكنه يكشف أن بعض المصادر العربية
            تُسقط الياء الطويلة فتكتب "وتني" بدل "ويتني".

    - lemma: "إِيلَاي وِيتْنِي"
      evidence_status: "no_material_found"

    - lemma: "إِيلَاي وِيتِنِي"
      evidence_status: "no_material_found"

  # ملاحظة ببليوغرافية — المحلاج/المحلج:
  # وُجدت أدلة وافرة على الأداة التي اخترعها ويتني:
  # - "المِحْلاج: آلة لفصل ألياف القطن من بذوره" (المورد الحديث، 2008)
  # - "مِحْلَج: مكان حلج القطن أي تخليصه من بذره" (موسوعة السلطان قابوس)
  # - "والمِحْلاج الذي يُحلَج به" (المحكم والمحيط الأعظم لابن سيده)
  # هذه تُفيد تحريك لفظ محلج في التعريف (المرحلة ٤) لا في تحليل اللمّات.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إيلي ويتني"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للمخترع الأمريكي إيلي ويتني، وهو التعريب المعتمد في
        المصادر الموسوعية العربية (كالموسوعة العربية العالمية وويكيبيديا العربية).
        التعريب الصوتي متسق ومعتاد. يحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل (الاسم الأول + اسم الأسرة)؛ يُستخدم في التعريف الأول
        والسياقات الرسمية والتاريخية المتخصصة للتمييز القاطع عن أي شخصية
        أخرى تحمل اسم "ويتني".
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيلِي وِيتْنِي"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    - lemma: "ويتني"
      decision: confirmed
      decision_reason: >
        الشكل المختصر (اسم الأسرة منفرداً) مقبول كلمّة ثانوية في سياق قواميس
        الأعلام، إذ كثيراً ما تُدرج قواميس الأعلام الاسمَ مرتَّباً على الاسم الأخير.
        لكن التشكيل الكامل غائب ويجب إضافته.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اسم الأسرة منفرداً؛ شكل الاختزال الذي يُستخدم للإحالة الثانية أو
        في الفهارس المُرتَّبة أبجدياً. أقل دلالياً وأكثر التباساً عند الانعزال.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيتْنِي"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِيلَاي وِيتْنِي"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب "إيلاي" لـ "Eli" غير مستقر في العربية؛ غالبية المصادر العربية
        الموثوقة (ويكيبيديا عربي، موسوعة عربية، مجمعات اللغة) تكتب "إيلي"
        لا "إيلاي". والشكل الموجود "إيلي ويتني" يؤدي الوظيفة ذاتها.

    - lemma: "إِيلَاي وِيتِنِي"
      source: stage1
      decision: removed
      decision_reason: >
        مكرر للمرشح السابق مع اختلاف طفيف في ضبط المقطع الثاني من "ويتني"
        (كسر الياء بدل سكونها). كلا الشكلَيْن يعانيان من ضعف التثبيت،
        والصيغة الموجودة "إيلي ويتني" كافية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "مخترع أمريكي لمحلج القطن الميكانيكي (1765-1825)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه لكن يعاني من: (١) غياب التشكيل،
        (٢) صيغة "لمحلج القطن الميكانيكي" تجعل "محلج" قاصراً في الدلالة إذ
        يتعدد معناه بين (مكان الحلج) و(آلته)، والأدق "مِحْلَاج القطن الآلي"
        أو "مِحْلَج القطن الميكانيكي" بالتشكيل، (٣) أرقام السنوات بالأرقام
        اللاتينية بدل العربية المنسجمة مع النص.
    authored:
      - type: encyclopedic
        text: >
          مُخترع أمريكي (١٧٦٥-١٨٢٥م)، اشتُهر بابتكاره مِحْلَج القطن الآلي
          عام ١٧٩٣م الذي أحدث ثورةً في صناعة القطن بالولايات المتحدة الأمريكية؛
          كما يُنسب إليه تطوير مبدأ قابلية التبديل في الصناعة التحويلية.
      - type: terminological
        text: >
          مُخترع أمريكي (١٧٦٥-١٨٢٥م)، عُرف بابتكار مِحْلَج القطن الميكانيكي.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11405121-n"
          definition_index: 0
          text: "مُخترع أمريكي (١٧٦٥-١٨٢٥م)، اشتُهر بابتكاره مِحْلَج القطن الآلي عام ١٧٩٣م الذي أحدث ثورةً في صناعة القطن بالولايات المتحدة الأمريكية؛ كما يُنسب إليه تطوير مبدأ قابلية التبديل في الصناعة التحويلية."
      - command: add_definition
        params:
          synset_id: "awn4-11405121-n"
          text: "مُخترع أمريكي (١٧٦٥-١٨٢٥م)، عُرف بابتكار مِحْلَج القطن الميكانيكي."

  examples:
    per_lemma:
      - lemma: "إِيلِي وِيتْنِي"
        examples:
          - text: >
              غيَّر مِحْلَج القطن الذي ابتكره إِيلِي وِيتْنِي عام ١٧٩٣م وجهَ
              الاقتصاد الأمريكي، وأسهم في توسيع نطاق زراعة القطن بالجنوب الأمريكي.
            type: usage
      - lemma: "وِيتْنِي"
        examples:
          - text: >
              يُعدّ وِيتْنِي من رواد الثورة الصناعية الأمريكية بفضل إسهاماته في
              مبدأ قابلية التبديل في التصنيع الضخم.
            type: usage
    actions:
