# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-09782772-n (acolyte)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «شماس مساعد» تخلط بين الشَّمَّاس (deacon، وهو من الرتب الكبرى) والأكوليت (أعلى الرتب الصغرى)؛ فالمفهوم ليس شماساً مساعداً بل هو رتبة مستقلة أدنى من الشمّاسية"
      - "اللمّة «مساعد الكاهن» وصفية أكثر منها مصطلحاً كنسياً دقيقاً، لكنّها مؤيّدة في المورد الحديث كترجمة لـ acolyte"
      - "التعريف العربي ترجمة حرفية شبه كاملة من الإنجليزية، يحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المفهوم ينتمي إلى المصطلحات الكنسية المسيحية الكاثوليكية تحديداً. الرتب الصغرى (minor orders) في الكنيسة الكاثوليكية هي: حارس الأبواب، القارئ، العازر (exorcist)، والأكوليت (الأعلى). هذا المفهوم لا يوجد في الكنيسة الأنجليكانية ولا الأرثوذكسية الشرقية. في العربية المسيحية تُستخدم ألفاظ سريانية الأصل لهذه الرتب. لفظ «شِدْيَاق» أقرب دلالةً لهذا المفهوم من «شَمَّاس» الذي يدلّ على الرتبة الأعلى (deacon)."

  blind_candidates:
    - lemma: "خَادِمُ المَذْبَح"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين الخدمة والمذبح الكنسي؛ يُستخدم في الأدبيات المسيحية العربية للإشارة إلى من يخدم الكاهن عند المذبح أثناء القداس"
    - lemma: "شِدْيَاق"
      generation_method: majaz
      justification: "لفظ سرياني الأصل مُعرَّب ومثبت في المعاجم العربية (المعجم الكبير)، يدل على من يمارس خدمة الكاهن والترتيل معه، وهو أقرب دلالياً إلى مفهوم الأكوليت من الشمّاس"
    - lemma: "مُعَاوِنُ الكَاهِن"
      generation_method: tarkib
      justification: "مركب إضافي من المعاونة والكاهن؛ يصف الوظيفة الجوهرية للأكوليت وهي معاونة الكاهن في الخدمة الطقسية"
    - lemma: "أكُولِيت"
      generation_method: taarib
      justification: "تعريب مباشر من اليونانية (ἀκόλουθος = تابع)؛ يُلجأ إليه عند غياب مصطلح عربي دقيق لهذه الرتبة الكنسية المحددة"


stage2_evidence:
  per_lemma:
    - lemma: "شَمَّاس مُسَاعِد"
      contradicts:
        - text: "«(الشماس) الشَّديد الشموس وَمن يقوم بِالْخدمَةِ الكنسية ومرتبته دون القسيس (سريانية) (ج) شمامسة»"
          source: "المعجم الوسيط"
          conflict: "الشَّمَّاس = الديكون (deacon) وهو رتبة كبرى أعلى من الأكوليت، فإضافة «مساعد» إليه تعني مساعد الديكون (subdeacon) لا الأكوليت"
        - text: "«مُساعدُ الشَّمّاس (كن).»"
          source: "المورد الحديث (2008)"
          conflict: "المورد الحديث يترجم subdeacon بـ«مساعد الشمّاس»، مما يؤكد أن التركيب «شماس مساعد» يقع في منطقة دلالية مختلفة عن acolyte"

    - lemma: "مُسَاعِدُ الكَاهِن"
      confirm:
        - text: "«(1) الشّمّاس: مُساعد الكاهن (كن) (2) التابع؛ المُساعِد؛ المعاوِن.»"
          source: "المورد الحديث (2008)"
        - text: "«الشَّمّاس: مساعد الكاهن في قدّاس (نص).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(الشَّمَّاس) (فى الآرامية شمَّاشا: خادم الأسرار المقدسة خاصةً): مَنْ يقوم بالخِدمة الكَنَسِيَّة, ومرتبتُه دون القِسِّيس, وهو الذى يُساعدُه فى وظيفته. (سريانية)»"
          source: "المعجم الكبير"
          addition: "يوسّع فهم العلاقة بين الشماس والكاهن ويبيّن أن المساعدة في الوظيفة الكنسية مفهوم ثابت"

    - lemma: "خَادِمُ المَذْبَح"
      expands:
        - text: "«(المذبح) مَكَان الذّبْح أَو مَكَان تَقْدِيم القرابين فِي معابد غير الْمُسلمين والحلقوم ومذبح الْكَنِيسَة الْمَكَان الَّذِي يُقَام فِيهِ القداس وتذبح فِيهِ الذَّبِيحَة غير الدموية»"
          source: "المعجم الوسيط"
          addition: "يثبت استعمال «المذبح» للمكان الكنسي الذي يُقام فيه القداس، مما يسوّغ المركب «خادم المذبح»"
      # لا دليل مباشر يؤكد «خادم المذبح» كمصطلح ثابت للأكوليت تحديداً

    - lemma: "شِدْيَاق"
      confirm:
        - text: "«(عند بعض النصارى): مَنْ يُمارسُ خدمةَ الكاهنِ والترتيلَ معه فى أوقات الصلواتِ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الشَّمّاس؛ الشِّدياق (كن).»"
          source: "المورد الحديث (2008)"
          conflict: "المورد الحديث يجعل الشدياق مرادفاً للشمّاس (deacon)، وهي رتبة أعلى من الأكوليت"
        - text: "«شِدْياق: وجمعها شَدايقة: شماس رسائلي»"
          source: "تكملة المعاجم العربية لدوزي"
          conflict: "دوزي يعرّف الشدياق بأنه شماس رسائلي (epistolary deacon) لا أكوليت"

    - lemma: "مُعَاوِنُ الكَاهِن"
      expands:
        - text: "«(1) الشّمّاس: مُساعد الكاهن (كن) (2) التابع؛ المُساعِد؛ المعاوِن.»"
          source: "المورد الحديث (2008)"
          addition: "لفظ «المعاوِن» ورد في المورد الحديث ضمن ترجمة acolyte، مما يسوّغ المركب «معاون الكاهن» كبديل لـ«مساعد الكاهن»"

    - lemma: "أكُولِيت"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "شَمَّاس مُسَاعِد"
      decision: removed
      decision_reason: "الشَّمَّاس في المعاجم العربية = الديكون (deacon)، وهو رتبة كبرى أعلى من الأكوليت. التركيب «شماس مساعد» يوحي بأنه مساعد للديكون (أي subdeacon)، وهذا مفهوم مختلف تماماً عن الأكوليت الذي هو أعلى الرتب الصغرى. المورد الحديث يترجم subdeacon بـ«مساعد الشماس» مما يعزز الالتباس. الإبقاء على هذه اللمّة يُدخل خطأً تصنيفياً في الشبكة الدلالية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُسَاعِدُ الكَاهِن"
      decision: confirmed
      decision_reason: "المورد الحديث يترجم acolyte صراحةً بـ«مساعد الكاهن»، وتعريف المعجم الكبير للشمّاس يصفه بأنه «الذى يُساعدُه فى وظيفته» ممّا يؤكد ثبات هذا المركب في الاستعمال الكنسي العربي. وإن كان وصفياً فهو المصطلح المتداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مركب إضافي وصفي يصف الوظيفة مباشرةً (المساعدة في خدمة الكاهن)؛ هو الأشيع تداولاً في المراجع الثنائية اللغة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسَاعِدُ الكَاهِن"

    # ── مرشحات المرحلة ١ ──
    - lemma: "خَادِمُ المَذْبَح"
      source: stage1
      decision: removed
      decision_reason: "لم يُوثّق كمصطلح ثابت للأكوليت تحديداً في أيّ معجم عربي. لفظ «خادم المذبح» عبارة وصفية حرّة يمكن أن تشير إلى أي شخص يخدم عند المذبح (كاهن، شماس، أكوليت). يفشل في اختبار السَّكّ والتثبيت المعجمي."

    - lemma: "شِدْيَاق"
      source: stage1
      decision: removed
      decision_reason: "رغم أن المعجم الكبير يعرّفه بما يقارب مفهوم الأكوليت، فإن المورد الحديث يجعله مرادفاً للشمّاس (deacon)، ودوزي يصفه بأنه «شماس رسائلي». الأدلة متضاربة وترجيح دلالة الشدياق نحو الديكون أقوى. إدراجه هنا قد يُحدث تداخلاً مع مجموعة الشماس/الديكون."
      evidence_assessment:
        case: mixed

    - lemma: "مُعَاوِنُ الكَاهِن"
      source: stage1
      decision: removed
      decision_reason: "مرادف تامّ لـ«مساعد الكاهن» دون فرق دلالي يُذكر. ورود لفظ «المعاوِن» في المورد الحديث كان ضمن سلسلة مرادفات عامة لا كمصطلح مستقل. إضافته تكرار لا يُثري المجموعة."
      evidence_assessment:
        case: no_material

    - lemma: "أكُولِيت"
      source: stage1
      decision: removed
      decision_reason: "تعريب لم يُسجَّل في أي معجم عربي متاح، ولا شواهد على تداوله في النصوص العربية المسيحية. وجود «مساعد الكاهن» كمصطلح ثابت يُغني عن هذا التعريب."
      evidence_assessment:
        case: no_material


stage4_content:
  definition:
    current: "شخص يساعد الكاهن أو القس في الخدمة الليتورجية؛ رجل دين مرسوم في أعلى الرتب الصغرى في الكنيسة الكاثوليكية الرومانية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية تفتقر إلى الأسلوب المعجمي العربي، وتحتوي على مصطلح «الليتورجية» الأجنبي دون تفسير. يحتاج إعادة صياغة بأسلوب المعجم الوسيط مع إيضاح السياق الكنسي."
    authored:
      - type: terminological
        text: "رتبةٌ كَنَسِيَّةٌ هي أعلى الرُّتَبِ الصُّغرى في الكنيسة الكاثوليكيّة الرومانيّة، صاحبُها يُعِينُ الكاهنَ في إقامة شعائر القُدَّاس والصلوات الطَّقْسِيَّة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مَنْ يتولّى أعلى الرُّتَبِ الصُّغرى (الإكليريكيّة) في الكنيسة الكاثوليكيّة الرومانيّة، ويُعاوِنُ الكاهنَ أو القِسِّيسَ في الخِدْمة الطَّقْسِيَّة عند المذبح أثناء القُدَّاس. لا تُعرَف هذه الرتبة في الكنيسة الأنجليكانيّة ولا في الكنائس الأرثوذكسيّة الشرقيّة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
