# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'لين' منفردةً تتعارض مع الكلمة العربية الأصيلة التي تعني ضد الخشونة، مما يُوقع في اشتراك لفظي خطير"
      - "التعريف العربي يستخدم 'نحاتة' بدلاً من 'نحَّاتة' (بتشديد الحاء)، وهو الوزن الصحيح لصيغة المبالغة المؤنثة"
      - "'معمارية' وحدها غير كافية للتعبير عن مهنة المعماري؛ المصطلح المعتمد في المعاجم التقنية هو 'مهندسة معمارية'"
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل"
    observations: >-
      هذه المجموعة الترادفية تخص اسمَ علم لشخصية أمريكية معاصرة ذات أصول صينية، وهي نحّاتة ومهندسة معمارية
      اشتُهرت بتصميم نصب تذكاري لمحاربي حرب فيتنام. لا مجال هنا للتوليد الاشتقاقي أو المجازي، إذ تنحصر
      خيارات المصطلح في التعريب (نقل الاسم إلى الحروف العربية) مع اختيار أفضل صيغة تحقق الوضوح وتتجنب
      الاشتراك اللفظي مع الكلمة العربية الراسخة "اللِّين". التحدي المحوري هو أن اللقب العائلي "Lin"
      يتطابق صوتياً مع الكلمة العربية الأصيلة لِين، مما يستوجب الحرص على استخدام الاسم الكامل دائماً.

  blind_candidates:
    - lemma: "مَايَا لِين"
      generation_method: taarib
      justification: "التعريب الأمثل للاسم الأمريكي 'Maya Lin' بشقَّيه: الاسم الأول (مَايَا) واللقب العائلي (لِين). هذه الصيغة المركَّبة هي الأشيع في الصحافة العربية والمصادر الموسوعية لأنها تُزيل أي لبس."
    - lemma: "لِين"
      generation_method: taarib
      justification: "اللقب العائلي منفرداً، تعريب لـ 'Lin'. يُستخدم في بعض السياقات الأكاديمية للإشارة إلى صاحبه باللقب وحده، غير أنه يصطدم في العربية بكلمة 'اللِّين' الأصيلة."
    - lemma: "مَايَا"
      generation_method: taarib
      justification: "الاسم الأول منفرداً، تعريب لـ 'Maya'. غير مميَّز بما يكفي لأن 'مايا' اسم شائع لعدد من الشخصيات الدولية، ولا يُحيل بمفرده إلى هذه الشخصية بالذات."
    - lemma: "مَايَا لِن"
      generation_method: taarib
      justification: "تعريب بديل يحذف حرف الياء المد من اللقب ليقترب من النطق الصيني الأصلي 'Lín' بصوت أقصر. أقل شيوعاً من الصيغة الممدودة في الكتابة العربية."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دقيقة دفعية: لين، اللين، مايا لين، مايا
#   ٢. جسر إنجليزي: Maya Lin, Lin, sculptor, Vietnam War memorial
#   ٣. بحث FTS عربي: نحاتة، نحّاتة، معمارية، نصب تذكاري، فيتنام
#   ٤. مقاييس اللغة (dictionary_id=151): جذر لَيَنَ / ل-ي-ن
stage2_evidence:
  per_lemma:
    - lemma: "لين"
      contradicts:
        - text: "«اللين: ضد الخشونة، ويستعمل في الأجسام، ثم يستعار للخلق ولغيره من المعاني، فيقال فلان لين، وفلان خشن، وكل منهما يمدح به طورا، ويذم طورا بحسب اختلاف المواضع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "لِين كلمة عربية أصيلة ذات دلالة راسخة (ضد الخشونة)؛ استخدامها وحدها اسماً علماً لشخص يُوقع في اشتراك لفظي شديد الإضلال"
        - text: "«اللِّينُ: ضد الخشن. اسم قرية بمرو [...] واللين أيضا: أكبر قرية من كورة بين النهرين»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "المعجم يُثبت أن 'اللين' اسم لمواضع جغرافية عربية قديمة وليس اسماً لشخص أمريكي معاصر"
        - text: "«اللَّامُ وَالْيَاءُ وَالنُّونُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ اللِّينُ: ضِدُّ الْخُشُونَةِ. وَيُقَالُ: هُوَ فِي لَيَانٍ مِنْ عَيْشٍ، أَيْ نِعْمَةٍ، وَفُلَانٌ مَلْيَنَةٌ، أَيْ لَيِّنُ الْجَانِبِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر ل-ي-ن في مقاييس اللغة له معنى أصلي واحد هو اللِّين (ضد الخشونة)، ولا علاقة له البتة باللقب الأجنبي 'Lin'"
        - text: "«اللّين: [في الانكليزية] Flexibility, suppleness [في الفرنسية] Souplesse, flexibilité — بالكسر وسكون الياء التحتانية مقابل الصلابة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "حتى في المعاجم الاصطلاحية الحديثة لا يزال 'اللين' مرادفاً للمرونة والطواعية وليس لاسم علم"

    - lemma: "مايا لين"
      evidence_status: "no_material_found"

    - lemma: "مَايَا لِين"
      evidence_status: "no_material_found"

    - lemma: "مَايَا"
      evidence_status: "no_material_found"

    - lemma: "مَايَا لِن"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: لين ──
    - lemma: "لين"
      decision: removed
      decision_reason: >-
        لمّة 'لِين' منفردةً مرفوضة لثلاثة أسباب حاسمة: (١) الاشتراك اللفظي الكامل مع الكلمة العربية
        الفصيحة لِين (ضد الخشونة) الموثَّقة في مقاييس اللغة والتوقيف ومعجم البلدان وكشّاف التهانوي؛
        (٢) غياب أي تمييز سياقي يُرشد القارئ إلى أن المقصود اسم علم لا الصفة العربية؛ (٣) في جميع
        المصادر المعجمية التي ظهرت في الاستعلامات، 'لين' كلمة وصفية أو اسم مكان جغرافي عربي قديم،
        وليست اسماً لشخص أمريكي. الإبقاء عليها ضمن المجموعة يُضرّ بجودة الشبكة الدلالية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة: مايا لين ──
    - lemma: "مايا لين"
      decision: confirmed
      decision_reason: >-
        الاسم الكامل 'مايا لين' هو الصيغة الرسمية المعتمدة في الصحافة والمصادر الموسوعية العربية
        للإشارة إلى هذه الشخصية. ضم الاسمَيْن معاً يُزيل الاشتراك اللفظي مع 'اللِّين' العربية،
        ويُشكِّل وحدة معجمية ثابتة في هذا السياق الموسوعي. يحتاج إلى إضافة تشكيل كامل.
