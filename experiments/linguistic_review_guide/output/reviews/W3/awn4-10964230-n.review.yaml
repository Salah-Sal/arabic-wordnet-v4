# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (دوشامب، مارسيل دوشامب) خاليتان من التشكيل الكامل"
      - "التعريف الحالي مترجَمٌ حرفياً من الإنجليزية ولا يتبع أسلوب المعجم الوسيط"
      - "لا توجد أدلة لغوية معجمية لهذه الأعلام الشخصية في قواعد البيانات المتاحة"
      - "المجموعة تُعرِّف علماً شخصياً أجنبياً؛ الوسيلة المصطلحية الوحيدة الممكنة هي التعريب الصوتي"
    observations: "المجموعة ترادفية تخصّ مارسيل دوشامب (1887-1968)، فناناً فرنسياً-أمريكياً ورائداً في الفن التجهيزي وحركة الدادائية. طبيعة المجموعة عَلَمٌ شخصيٌّ بعينه لا تنتج عنه اشتقاقات أو مجازات عربية، وكل لمّاتها لا تعدو كونها تعريبات صوتية. لا يمكن توليد مرشحات اشتقاقية أو مجازية حقيقية لأن الكيان المُعبَّر عنه هو فرد تاريخي بعينه."
  blind_candidates:
    - lemma: "دُوشَامْب"
      generation_method: taarib
      justification: "تعريب صوتي للقب العائلي الفرنسي 'Duchamp'؛ يعكس الصوت الفرنسي الأصلي مع الإبقاء على الباء للدلالة على حرف /p/، وهو الأسلوب المعتمد في الصحافة والموسوعات العربية"
    - lemma: "مَارْسِيل دُوشَامْب"
      generation_method: taarib
      justification: "الاسم الكامل للفنان بتعريب صوتي مزدوج؛ 'Marcel' → مارسيل، 'Duchamp' → دوشامب؛ يُستخدم في السياقات الأكاديمية والتعريفية الرسمية"
    - lemma: "دُوشَان"
      generation_method: taarib
      justification: "بديل صوتي يُسقط /p/ الفرنسية ويُبدلها نوناً وفق نمط التعريب الذي يحذف الأصوات غير العربية الصعبة؛ مستخدَم في بعض المراجع العربية"
    - lemma: "مَارْسِيل دُوشَان"
      generation_method: taarib
      justification: "الاسم الكامل بالصيغة البديلة التي تعتمد حذف /p/؛ تُستخدم لدى من يرجّحون التعريب التبسيطي"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# ميزانية الاستعلامات المُنجزة: 3 استعلامات
#   ١. مطابقة دفعية: دوشامب + مارسيل دوشامب + دوشان + مارسيل دوشان (+ ال-) → لا نتائج
#   ٢. جسر إنجليزي: Duchamp + Marcel Duchamp → لا نتائج في ARABTERM
#   ٣. FTS عربي: دادائية + دادا + دوشامب → نتيجة واحدة ذات صلة:
#      entry_id=395247: "دادائية (ال..)" → translation_en="dadaïsm" (الحركة لا الشخص)
stage2_evidence:
  per_lemma:
    - lemma: "دوشامب"
      evidence_status: "no_material_found"

    - lemma: "مارسيل دوشامب"
      evidence_status: "no_material_found"

    - lemma: "دُوشَامْب"
      evidence_status: "no_material_found"

    - lemma: "مَارْسِيل دُوشَامْب"
      evidence_status: "no_material_found"

    - lemma: "دُوشَان"
      evidence_status: "no_material_found"

    - lemma: "مَارْسِيل دُوشَان"
      evidence_status: "no_material_found"

  context_note: >
    بحثٌ FTS عربي عن كلمات مفتاحية (دادائية، دادا، دوشامب) أسفر عن مدخل ARABTERM وحيد:
    entry_id=395247 «دادائية (ال..)» بترجمة إنجليزية «dadaïsm» من المعجم الموحد لمصطلحات
    التقنيات التربوية (1999) — وهو يخصّ الحركة الفنية لا الشخص، فلا يُعدّ دليلاً على اللمّات.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة: دوشامب ──
    - lemma: "دوشامب"
      decision: confirmed
      decision_reason: >
        اللقب العائلي المختصر للفنان؛ تعريب صوتي مستقر في الاستخدام العربي (موسوعات، صحافة،
        مناهج فنية)، يُستخدم منفرداً بعد التعريف الأول بالاسم الكامل. تشكيل كامل مطلوب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب المختصر وحده؛ يُستعمل في السياقات التي سبق فيها تقديم الاسم الكامل أو عند الإشارة الموجزة للفنان"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُوشَامْب"

    # ── اللمّة الموجودة: مارسيل دوشامب ──
    - lemma: "مارسيل دوشامب"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للفنان (اسم + لقب)؛ تعريب مزدوج مستقر، يُستخدم في التعريف الأول وفي
        السياقات الأكاديمية والرسمية. هو التعبير الأتمّ والأدقّ للدلالة على هوية الفنان.
        التعبير مركّب إضافي (اسم + لقب) يُعدّ وحدة معجمية ثابتة في أعلام الأشخاص.
        تشكيل كامل مطلوب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل؛ يُستخدم في التعريف الأول بالشخصية وفي السياقات التي تستدعي التحديد الكامل للهوية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَارْسِيل دُوشَامْب"

    # ── مرشح المرحلة ١: دُوشَان ──
    - lemma: "دُوشَان"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تُسقط الباء (/p/) وتُبدلها نوناً؛ هذا التعريب أقلّ دقةً من «دوشامب» الذي يُقرِّب
        الصوت الفرنسي الأصلي /p/ بالباء العربية، وهو الأسلوب الأرجح في المعاجم والموسوعات العربية
        المعاصرة. لا يُضاف لمّةٌ بديلة أدنى دقةً من الموجودة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشح المرحلة ١: مَارْسِيل دُوشَان ──
    - lemma: "مَارْسِيل دُوشَان"
      source: stage1
      decision: removed
      decision_reason: >
        نفس سبب رفض «دُوشَان»؛ إبدال /p/ بالنون في اللقب يُخلّ بالمقاربة الصوتية الأمثل.
        «مارسيل دوشامب» الموجودة أصحّ وأشيع.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فنان فرنسي هاجر إلى الولايات المتحدة؛ قائد في حركة الدادائية في مدينة نيويورك؛ كان أول من عرض الأشياء العادية كفن (1887-1968)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مترجَم ترجمةً آليةً شبه حرفية من الإنجليزية؛ تقطيع الجمل بالفاصلة
        المنقوطة يُوهن التسلسل الدلالي، وعبارة «قائد في حركة» ركيكةٌ والأدقّ «من روّاد»،
        كما أن «عرض الأشياء العادية كفن» تحتاج صياغةً أوضح. يُعادَ تأليفه بأسلوب المعجم الوسيط.
    authored:
      - type: encyclopedic
        text: >
          فنانٌ فرنسيٌّ (1887-1968) هاجرَ إلى الولايات المتحدة الأمريكية؛ أحدُ روَّاد حركةِ
          الدادائيةِ في نيويورك، اشتُهرَ بكونه أوَّل مَن اعتمدَ الأشياءَ اليوميةَ العاديةَ
          مادةً للعملِ الفنيّ (الجاهزات)
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10964230-n"
          definition_index: 0
          text: "فنانٌ فرنسيٌّ (1887-1968) هاجرَ إلى الولايات المتحدة الأمريكية؛ أحدُ روَّاد حركةِ الدادائيةِ في نيويورك، اشتُهرَ بكونه أوَّل مَن اعتمدَ الأشياءَ اليوميةَ العاديةَ مادةً للعملِ الفنيّ (الجاهزات)"

  examples:
