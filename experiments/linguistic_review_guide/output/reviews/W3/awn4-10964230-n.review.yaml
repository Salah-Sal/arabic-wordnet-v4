        examples:
          - text: "يُعَدُّ دُوشَامْب من أكثر الفنانين تأثيراً في مسار الفن الحديث خلال القرن العشرين"
            type: usage
      - lemma: "مَارْسِيل دُوشَامْب"
        examples:
          - text: "حوَّل مَارْسِيل دُوشَامْب مفهومَ الفن حين قدَّم مِجرفةَ الثلجِ ومِبولةَ الخزفِ أعمالاً فنيةً في المعارض الرسمية"
            type: usage
    actions:
