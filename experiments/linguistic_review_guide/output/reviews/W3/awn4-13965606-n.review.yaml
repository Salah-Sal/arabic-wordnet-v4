# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13965606-n
# profoundness — extremeness of degree
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «عمق» بدون تشكيل — تحتاج إلى تشكيل كامل (عُمْق)"
      - "التعريف العربي «تطرف الدرجة» مقتضب وقد يلتبس بالتطرف الأيديولوجي"
      - "المجموعة تحتوي لمّة واحدة فقط — قد تستفيد من إثراء بمرادفات"
    observations: "المفهوم هو بلوغ الشيء أقصى درجاته ومنتهاها، وهو مفهوم مجرد يُعبَّر عنه بالعربية عادةً بالاستعارة من العمق الحسي (عمق الأزمة، عمق الفكر). اللمّة الموجودة «عمق» مناسبة دلالياً لكنّها تحتاج تشكيلاً. التعريف يحتاج تحسيناً ليكون أوضح وأبعد عن الالتباس."
  blind_candidates:
    - lemma: "غَوْر"
      generation_method: majaz
      justification: "الغَوْر أصله قَعْر الشيء وعمقه، ويُستعار للمبالغة في الدرجة والتعمق، كقولهم «بعيد الغور» أي داهية عارف بالأمور"
    - lemma: "تَنَاهٍ"
      generation_method: ishtiqaq
      justification: "من الجذر «نهي» على وزن تَفَاعُل، بمعنى بلوغ المنتهى والغاية القصوى في الدرجة، مشتق من النهاية"
    - lemma: "إِفْرَاط"
      generation_method: ishtiqaq
      justification: "من الجذر «فرط» على وزن إِفْعَال، بمعنى تجاوز الحد في الدرجة والمبالغة فيها"
    - lemma: "شِدَّة"
      generation_method: ishtiqaq
      justification: "من الجذر «شدد» على وزن فِعْلَة، بمعنى القوة والحدة في الدرجة، تُستعمل في سياق تطرف الدرجة كشدة الحر وشدة البرد"

stage2_evidence:
  per_lemma:
    - lemma: "عُمْق"
      confirm:
        - text: "«(العمق) البعد إلى أسفل والوادي وما بعد من أطراف المفاوز (ج) أعماق وأعماق الأرض نواحيها و(في الهندسة) بعد رأسي تحت المستوى الذي يتخذ مبدأ للقياس»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«العَمْقُ، بالفتح، وبالضم، وبضمَّتَيْنِ: قَعْرُ البِئْرِ ونَحْوِها. عَمُقَ، ككَرُمَ، وبِئْرٌ عَميقَةٌ... وعَمَّقَ النَّظَرَ في الأمورِ: بالَغَ. وتَعَمَّقَ في كلامِهِ: تَنَطَّعَ.»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(1) عُمق التفكير (2) شيء عميق أو عويص (3) عُمْق شديد.»"
          source: "المورد الحديث (2008) — مقابل profundity"
      expands:
        - text: "«العمق: البعد سفلاً.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف مختصر يؤكد الدلالة الأصلية الحسية"
        - text: "«العمق: بالضم وسكون الميم يطلق على معان الأول الامتداد الثالث المقاطع لكل واحد من الامتدادين الأولين أي الطول والعرض على زوايا، وهو ثالث الأبعاد الجسمية...»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "توسيع في الدلالة الاصطلاحية الهندسية والفلسفية"
        - text: "«العين والميم والقاف أصل ذكره ابن الأعرابي، قال: العُمْقُ إذا كان صفة للطريق فهو البعد، وإذا كان صفة للبئر فهو طول جرابها... ومن الباب: تعمَّق الرجل في كلامه، إذا تنطَّع.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أن الجذر يدل على البعد والمبالغة مجازاً"

    - lemma: "غَوْر"
      confirm:
        - text: "«(الغَوْر) كل منخفض من الأرض ومن كل شيء قعره وعمقه يقال سبر غوره تبين حقيقته وسره... ويقال فلان بعيد الغور داهية»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«الغَوْرُ: القَعْرُ من كلِّ شيءٍ، كالغَوْرَى... وما بين ذاتِ عِرْقٍ إلى البَحْرِ، وكلُّ ما انْحَدَرَ مُغَرِّباً عن تهامَةَ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الغَوْر أوسع دلالةً من مجرد التطرف في الدرجة — يشمل أسماء أماكن وجغرافيا ومعاني حسية متعددة"
      expands:
        - text: "«الغين والواو والراء أصلان صحيحان: أحدهما خفوض في الشيء وانحطاط وتطامن، والأصل الآخر إقدام على أخذ مال قهراً أو حرباً.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الأول (الخفوض والانحطاط) يصلح للدلالة على العمق لكنه مقيد بالمعنى الحسي"

    - lemma: "تَنَاهٍ"
      contradicts:
        - text: "«التناهِي: بالفتح: موضع بين بطان والثعلبية من طريق مكة...»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "لم يرد «التناهي» بمعنى تطرف الدرجة في المعاجم — ورد اسمَ موضعٍ فحسب"

    - lemma: "إِفْرَاط"
      confirm:
        - text: "«الإفراط: الفرق بين الإفراط والتفريط؛ أن الإفراط يستعمل في تجاوز الحد من جانب الزيادة والكمال، والتفريط يستعمل في تجاوز الحد من جانب النقصان والتقصير.»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«إفراط؛ تطرّف؛ لااعتدال.»"
          source: "المورد الحديث (2008) — مقابل immoderacy"
          conflict: "الإفراط يدل على تجاوز الحد سلباً (excess)، وليس على مطلق التطرف في الدرجة (profoundness). المفهومان مختلفان: الإفراط قيمي سلبي، والعمق/التطرف في الدرجة وصفي محايد"

    - lemma: "شِدَّة"
      confirm:
        - text: "«(الشِّدَّة) الأمر يصعب تحمله وشدة العيش شظفه وضيقه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«الشِّدَّةُ، بالكسر: اسمٌ من الاشْتِدادِ، وبالفتح: الحَمْلَةُ في الحَرْبِ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الشدة تدل على القوة والصعوبة (intensity) لا على تطرف الدرجة بمعنى البلوغ إلى أقصى الحدود (profoundness). هي أقرب إلى مفهوم الكثافة منها إلى مفهوم العمق المجرد"

stage3_analysis:
  per_lemma:
    - lemma: "عُمْق"
      decision: confirmed
      decision_reason: "لمّة صحيحة لغوياً ودلالياً. الجذر «عمق» يدل على البعد والقعر حسياً، ويُستعمل مجازاً للتطرف في الدرجة والمبالغة (عمق التفكير، عمق الأزمة، عمق المعرفة). شواهد المعاجم تؤكد الاستعمال المجازي (عمَّق النظر: بالغ، تعمَّق: تنطَّع). المورد الحديث يقابل profundity بـ«عمق التفكير». اللمّة تحتاج تشكيلاً فقط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُمْق"

    - lemma: "غَوْر"
      source: stage1
      decision: removed
      decision_reason: "رغم أن الغَوْر يشترك مع العمق في الدلالة على القعر، إلا أنه لا يُستعمل مستقلاً بمعنى «تطرف الدرجة». التعبير «بعيد الغور» يدل على الدهاء لا على تطرف الدرجة. كما أن إضافته ستُنشئ ترادفاً شبه مطلق مع «عمق» دون فارق دلالي واضح في هذا السياق المجرد."

    - lemma: "تَنَاهٍ"
      source: stage1
      decision: removed
      decision_reason: "لم يُوثَّق في المعاجم بمعنى تطرف الدرجة. ورد فقط اسمَ موضعٍ في معجم البلدان. المصدر «تناهٍ» من «تناهى» يدل على الانتهاء والتوقف أو التناهي عن الشيء (الكف عنه)، لا على بلوغ أقصى الدرجات."

    - lemma: "إِفْرَاط"
      source: stage1
      decision: removed
      decision_reason: "الإفراط يدل على تجاوز الحد من جانب الزيادة، وهو مفهوم قيمي سلبي (excess/immoderacy)، بينما المجموعة تدل على مطلق التطرف في الدرجة (profoundness) وهو وصفي محايد. الفرق الدلالي جوهري ولا يصح وضعهما في مجموعة ترادفية واحدة."

    - lemma: "شِدَّة"
      source: stage1
      decision: removed
      decision_reason: "الشدة تدل على القوة والصعوبة والحدة (intensity/severity)، وهي مفهوم مختلف عن تطرف الدرجة (profoundness). الشدة صفة للشيء نفسه، بينما العمق/التطرف في الدرجة صفة لمقدار بلوغه أقصى الحدود."

