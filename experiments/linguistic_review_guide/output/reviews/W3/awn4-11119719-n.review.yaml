stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جين كيلي"
      decision: confirmed
      decision_reason: >
        هذه اللمّة هي الصيغة الأكثر تداولاً في العربية للإحالة إلى الراقص الأمريكي
        Gene Kelly — تعريب مباشر للاسم المعروف به دولياً. لا يوجد بديل عربي أصيل
        لأعلام الأشخاص، فالتعريب هو الأسلوب الوحيد. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الأشهر والأوسع تداولاً عربياً، تجمع الاسم الأول "جين" (المختصر من يوجين)
        واللقب "كيلي"، وهي الصيغة المعتمدة في معظم المصادر الإعلامية والثقافية العربية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِينْ كِيلِي"

    - lemma: "كيلي"
      decision: confirmed
      decision_reason: >
        اللقب العائلي وحده صيغة مقبولة ثانوية للإحالة إلى الشخص، تُستخدم في السياقات
        المختصرة. غير أن أدلة قاعدة البيانات تكشف عن التباس مع "كيلي" كاسم عربي
        من أصل أيرلندي ومع "كَيْلِيّ" العربية الأصيلة. يُقبَل بوصفه صيغة ثانوية
        لا اسماً منفرداً كافياً للتعريف، ويحتاج تشكيلاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صيغة مختصرة تقتصر على اللقب العائلي؛ تُستعمل حين يكون السياق واضحاً ولا
        حاجة للاسم الأول. تُعرِّض للالتباس مع مداخل أخرى في المعاجم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِيلِي"

    # ── مرشحات المرحلة ١ ──
    - lemma: "يُوجِين كِيلِي"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل الصيغة الإنجليزية "Eugene Kelly" الواردة في المعجم الإنجليزي OEWN وغير
        المُترجمة في AWN4 حتى الآن. الاسم الرسمي الكامل للراقص قبل اختصاره إلى "Gene"،
        ويُستخدم في السياقات الموسوعية والوثائقية الرسمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يمثّل الاسم الأول الرسمي الكامل "يوجين" مع اللقب، يُميّز عن "جين كيلي" باستخدام
        الاسم غير المختصر؛ يُفضَّل في الموسوعات والمراجع الأكاديمية.
      actions:
        - command: create_entry
          params:
            lemma: "يُوجِين كِيلِي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "يُوجِين كِيرَان كِيلِي"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل الصيغة الإنجليزية "Eugene Curran Kelly" الواردة في OEWN بوصفها الاسم
        الكامل الرسمي مع الاسم الأوسط. ضروري لاكتمال التغطية وللتمييز في السياقات
        التوثيقية الرسمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الرسمية الأكثر اكتمالاً تشمل الاسم الأوسط "كيران" (Curran)؛ تُستعمل
        حصراً في السياقات التوثيقية الرسمية كالشهادات والوثائق القانونية والسير الموسوعية
        المفصّلة.
      actions:
        - command: create_entry
          params:
            lemma: "يُوجِين كِيرَان كِيلِي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


