stage4_content:
  definition:
    current: "راقص أمريكي أدى في العديد من الأفلام الموسيقية (1912-1996)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية مختصرة من الإنجليزية، يُغفل كون كيلي كان
        ممثلاً ومخرجاً ومصمّم رقصات فضلاً عن كونه راقصاً، مما يُقيّد دلالته
        ويُبعده عن أسلوب المعجم الوسيط. التعريف الموسوعي مناسب لأعلام الأشخاص.
    authored:
      - type: encyclopedic
        text: >
          جِينْ كِيلِي (يُوجِين كِيرَان كِيلِي، 1912-1996): راقصٌ أمريكي ومُمثّلٌ
          سينمائي ومُخرجٌ ومصمّم رقصات، اشتُهر بأدواره في الأفلام الموسيقية
          الكلاسيكية في هوليوود، لا سيّما "غنِّ في المطر" (Singin' in the Rain).
          تميّز بأسلوبه الأثلتي المبتكر الذي مزج بين فنون الرياضة والرقص الشعبي
          والباليه، وأثّر تأثيراً بالغاً في تاريخ فن الرقص السينمائي.
