            سينمائي ومُخرجٌ ومصمّم رقصات، اشتُهر بأدواره في الأفلام الموسيقية
            الكلاسيكية في هوليوود، لا سيّما "غنِّ في المطر". تميّز بأسلوبه الأثلتي
            المبتكر الذي جمع بين الرياضة والرقص الشعبي والباليه.

