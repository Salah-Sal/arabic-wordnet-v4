# ══════════════════════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد (بدون أدلة)
# ══════════════════════════════════════════════════════════════════
stage1_review:
  assessment:
    concerns:
      - "اللمّات الحالية تفتقر إلى التشكيل الكامل الإلزامي"
      - "الاسم الكامل يُوجِين كِيرَان كِيلِي (Eugene Curran Kelly) غائب عن اللمّات العربية مع أنه موجود في الإنجليزية"
      - "لمّة 'كيلي' وحدها مبهمة — تشترك مع مصطلحات طبية ونفطية في قاعدة البيانات"
      - "المُشرِف المباشر (direct_hypernym) هو 'مصمم رقصات/كوريغراف' وهو صحيح لكن التعريف ينصّ على كونه راقصاً أولاً، مما قد يوحي بنقص في الوصف"
    observations: >
      المجموعة من نوع المثيل (instance synset) تُعرِّف شخصاً بعينه هو الراقص والممثل الأمريكي جين كيلي
      (1912-1996). هذا النوع من المجموعات يقتصر على الأعلام والأسماء الصريحة، ولا مجال فيه
      للاشتقاق العربي أو المجاز؛ كل اللمّات تعريبات لاسم شخص بعينه. المشكلة المحورية
      هي غياب الاسم الكامل يُوجِين كِيرَان كِيلِي وضعف التشكيل. المُشرِف الأعلى
      (choreographer) صحيح تاريخياً كون كيلي كان مصمماً للرقصات بالدرجة الأولى إلى
      جانب التمثيل.

  blind_candidates:
    - lemma: "جِينْ كِيلِي"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم المشهور به هذا الراقص الأمريكي "Gene Kelly"، وهو أكثر
        الصيغ تداولاً في المصادر العربية عند الإشارة إليه.
    - lemma: "يُوجِين كِيلِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الرسمي "Eugene Kelly" — الاسم الأول الكامل قبل اختصاره إلى "Gene"،
        يُستخدم في السياقات الرسمية والموسوعية.
    - lemma: "يُوجِين كِيرَان كِيلِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل الرسمي "Eugene Curran Kelly"، يضم الاسم الأوسط "Curran"،
        يُستخدم في السياقات التوثيقية والموسوعية المفصّلة.
    - lemma: "كِيلِي"
      generation_method: taarib
      justification: >
        تعريب اللقب العائلي "Kelly" وحده، يُستخدم أحياناً في السياقات المختصرة أو عند
        الإحالة بالاسم الأخير فقط.


# ══════════════════════════════════════════════════════════════════
# المرحلة ٢: جمع الأدلة
# ══════════════════════════════════════════════════════════════════
stage2_evidence:
  query_log:
    - query_num: 1
      pattern: "١ — Batch headword lookup"
      terms_searched:
        - "جين كيلي"
        - "كيلي"
        - "الكيلي"
        - "يوجين كيلي"
        - "يوجين كيران كيلي"
        - "الراقص جين كيلي"
        - "جين كيرلي"
      entry_ids_found: [835625, 941650, 941649]
    - query_num: 2
      pattern: "٧ — English bridge"
      terms_searched:
        - 'translation_en:"Gene Kelly"'
        - 'translation_en:"Kelly"'
        - 'translation_en:"Eugene Kelly"'
        - 'translation_en:"Eugene Curran Kelly"'
      note: >
        وُجدت نتائج لـ"Kelly" لكنها تعود لـ"Kelly's sign" و"Kelly's speculum" وغيرها
        من المصطلحات الطبية والنفطية — لا صلة لها بالراقص.
    - query_num: 3
      pattern: "٦ — Arabic FTS keywords"
      keywords_used:
        - "راقص"
        - "افلام موسيقية"
        - "فيلم موسيقي"
      note: لم تُسفر النتائج عن مداخل ذات صلة مباشرة بالمجموعة.

  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جِينْ كِيلِي"
      evidence_status: "no_material_found"

    - lemma: "كِيلِي"
      expands:
        - text: >
            «كيلي — عن الأيرلندية بمعنى مناضل ومحارب. يستخدم للذكور والإناث.»
          source: "موسوعة السلطان قابوس لأسماء العرب (حوراماني)"
          addition: >
            يؤكد أن "كيلي" اسم علم ذو أصل أيرلندي، مما يدعم كونه لقباً لشخص معين
            وإن كان المعجم يتحدث عن الاسم بوصفه اسم عربي من حيث الاستخدام.
        - text: >
            «كَيْلِيّ — من (ك ي ل) نسبة إلى الكَيْل بمعنى ما يكال به من حديد أو خشب
            أو نحوهما، أو نسبة إلى الكَيْلة بمعنى وعاء يكال به الحبوب ومقداره
            الآن ثمانية أقداح.»
          source: "موسوعة السلطان قابوس لأسماء العرب (حوراماني)"
          addition: >
            يكشف وجود تضارب مع "كَيْلِيّ" العربية الأصيلة ذات الصلة بمقياس الكيل —
            مما يزيد من غموض اللمّة "كيلي" حين تُستخدم منفردة.
      contradicts:
        - text: >
            «الكَيْلي: ما يكون مقابلته بالثمن مبنيّاً على الكيل.»
          source: "التعريفات الفقهية للبركتي (حوراماني)"
          conflict: >
            "كيلي/الكيلي" له دلالة فقهية عربية راسخة متعلقة بالبيع كيلاً، بعيدة تماماً
            عن اسم الراقص، مما يعرّض هذه اللمّة منفردةً لالتباس شديد.

    # ── مرشحات المرحلة ١ ──
    - lemma: "يُوجِين كِيلِي"
      evidence_status: "no_material_found"

    - lemma: "يُوجِين كِيرَان كِيلِي"
      evidence_status: "no_material_found"


