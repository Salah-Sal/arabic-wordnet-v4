# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14454897-n
# rank in a military organization
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (رتبة عسكرية)، وهو مركب إضافي وصفي يحتاج تأكيد تثبيته المعجمي"
      - "التعريف العربي الحالي مقتضب جداً ويحتاج إثراء"
    observations: "المفهوم واضح ومستقر في الثقافة العربية العسكرية. الرتبة العسكرية مصطلح شائع مسجّل في المعاجم الحديثة. المجموعة تقع تحت مفهوم أعم (المكانة النسبية) وتخصصه في السياق العسكري. المفهوم له حضور قوي في التراث العربي الإسلامي حيث عُرفت الرتب العسكرية منذ صدر الإسلام."

  blind_candidates:
    - lemma: "دَرَجَة حَرْبِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يجمع بين الدرجة (المكانة في سلّم تراتبي) والحربية (المتعلقة بالحرب والجيش)، محاولة لتقديم بديل تركيبي"
    - lemma: "شَارَة"
      generation_method: majaz
      justification: "الشارة في الأصل العلامة المميزة، ونُقلت مجازاً للدلالة على ما يميّز صاحبها من مكانة في الجيش"
    - lemma: "مَنْصِب جُنْدِيّ"
      generation_method: tarkib
      justification: "مركب إضافي وصفي من المنصب (المقام) والجندي (المتعلق بالجند)، يعبّر عن الموضع في التسلسل العسكري"
    - lemma: "نِيشَان"
      generation_method: taarib
      justification: "لفظ معرَّب من الفارسية/التركية بمعنى العلامة والوسام، شائع في العربية المعاصرة للدلالة على الأوسمة العسكرية"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "رُتْبَة عَسْكَرِيَّة"
      confirm:
        - text: "«الرُّتْبة العسكرية: الصِّفة أو اللَّقَب أو المَنْصِب الذى يُميز الوضعَ التنظيمىَّ لكلّ فردٍ من أفراد القوات المسلّحة.»"
          source: "المعجم الكبير"
        - text: "«العريف: رتبة عسكرية»"
          source: "المورد الحديث (2008) — مادة corporal"
        - text: "«رتبة عسكرية» (في ترجمة grade: «د» رتبة عسكرية)"
          source: "المورد الحديث (2008) — مادة grade"
      expands:
        - text: "«(الرُّتْبَة) الْمنزلَة والمكانة أَو الْمنزلَة الرفيعة ودرجة من درجات الشّرف تمنحها الدولة من ترى تكريمه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الرتبة بالمعنى العام تشمل المنزلة ودرجة الشرف مما يؤكد اتساع الدلالة"
        - text: "«المنزلة والمكانة, أو المنزلة الرفيعة درجةٌ من درجات الشرف تمنحها الدولة من ترى تكريمه»"
          source: "المعجم الوسيط"
          addition: "تعريف الرتبة العام يشمل المعنى العسكري بوصفه تخصيصاً"

    - lemma: "دَرَجَة حَرْبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "شَارَة"
      contradicts:
        - text: "«الجمال الرائع الهيئة اللباس الحسَن السِّمَن»"
          source: "المعجم الوسيط"
          conflict: "الشارة في المعاجم الكلاسيكية تعني الجمال والهيئة واللباس، لا الرتبة العسكرية"
      expands:
        - text: "«لباسُ الرَّجُل وهيئتُه وحُسْنُه السَّمَنُ العلامةُ المميِّزةُ»"
          source: "المعجم الكبير"
          addition: "المعجم الكبير يضيف معنى العلامة المميزة، لكنه يبقى بمعنى الشارة/الشعار لا الرتبة نفسها"
        - text: "«تركيب نسيجي يشبه الشرائط المثلثة على كتف الجنود.»"
          source: "مسرد صناعة النسيج (ALECSO)"
          addition: "الشارة في السياق العسكري هي الشكل النسيجي المميز على الكتف (chevron)، أي العلامة الدالة على الرتبة لا الرتبة ذاتها"

    - lemma: "مَنْصِب جُنْدِيّ"
      evidence_status: "no_material_found"

    - lemma: "نِيشَان"
      contradicts:
        - text: "«نِيشان [مفرد]: ج نَيَاشِينُ: وِسامٌ، شعار يُعطى كجائزة أو تقدير»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "النيشان وسام وجائزة تقديرية، وليس رتبة في التسلسل العسكري"
        - text: "«كلمة فارسية؛ وتأتي أيضا في صورة نشان بمعنى علامة، وسام، وهدف.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "النيشان من الفارسية بمعنى العلامة والوسام والهدف، وليس بمعنى الرتبة العسكرية"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "رُتْبَة عَسْكَرِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مثبت في المعجم الكبير بتعريف صريح ودقيق للمفهوم العسكري، وشائع في المورد الحديث وفي الاستعمال المعاصر"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُتْبَة عَسْكَرِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "دَرَجَة حَرْبِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركب غير مسكوك ولا مثبت معجمياً. يمكن إبدال حربية بعسكرية أو جيشية فيبقى وصفاً حراً، مما يفشل في اختبار السكّ"

    - lemma: "شَارَة"
      source: stage1
      decision: removed
      decision_reason: "الشارة تعني العلامة المميزة أو الشعار على الكتف (chevron)، وهي الدليل المادي على الرتبة لا الرتبة ذاتها. العلاقة مجاورة (metonymy) لا ترادف"

    - lemma: "مَنْصِب جُنْدِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركب غير مسكوك ولا مثبت معجمياً. المنصب أقرب إلى الوظيفة والمقام منه إلى الدرجة في سلّم التراتب. كما أن جندي نسبة إلى الجند العاديين فلا يشمل رتب الضباط"

    - lemma: "نِيشَان"
      source: stage1
      decision: removed
      decision_reason: "النيشان وسام يُعطى كجائزة تقديرية وليس رتبة في التسلسل الهرمي العسكري. الفرق جوهري: الرتبة موضع في السلّم التنظيمي، والنيشان تكريم يُمنح"

