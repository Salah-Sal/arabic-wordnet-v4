# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان (إريك مندلسون، مندلسون) تفتقران إلى التشكيل الكامل الإلزامي"
      - "ضبط تعريب الاسم الأول Erich غير موحَّد في المصادر العربية: يرد إريك وإيريك وإيريش وإيرش"
      - "المجموعة مصنَّفة pos=n لا proper_noun؛ وإن كان ذلك مقبولاً بمعايير WordNet فهو يستحق التنبيه"
      - "التعريف الحالي مقتضب ويغفل أسلوبه التعبيري (Expressionism) وأبرز أعماله التي نفَّذها في فلسطين/إسرائيل وأوروبا"
    observations: >-
      المجموعة تُعرِّف شخصاً تاريخياً بعينه هو المعماري الألماني اليهودي إريك مندلسون
      (1887-1953)، المعروف برائديته في العمارة التعبيرية وبمبنى برج اينشتاين في بوتسدام.
      هاجر إلى فلسطين الانتدابية عام 1934 أو 1937 (يتباين المصدران) وعمل مهندساً
      معمارياً بارزاً فيها قبل أن ينتقل لاحقاً إلى الولايات المتحدة. اللمّتان المتوفرتان
      تمثّلان الصيغة الكاملة للاسم (الاسم الأول + اللقب) والصيغة المختصرة (اللقب وحده).
      وهذا النمط الثنائي معيار في مجموعات أسماء الأعلام في AWN.

  # ── التوليد الأعمى من التعريف المُقنَّع فقط ──
  # التعريف المُقنَّع: "معماري ألماني هاجر إلى فلسطين عام 1937 (1887-1953)"
  # المنهج الوحيد الممكن هو التعريب (taarib) لأن المفهوم اسم علم أعجمي
  blind_candidates:
    - lemma: "إِيرِيك مَنْدِلْسُون"
      generation_method: taarib
      justification: >-
        تعريب مباشر للاسم الكامل Erich Mendelsohn، مع إثبات الياء بعد الهمزة للدلالة
        على المدّ في المقطع الأول وفق النطق الشائع في اللغات الأوروبية. هذا هو الشكل
        الأكثر شيوعاً في الكتابة العربية للاسم.
    - lemma: "إِيرِش مَنْدِلْزُون"
      generation_method: taarib
      justification: >-
        تعريب وفق النطق الألماني الأصلي: الاسم الأول Erich يُنطق في الألمانية إيرِش
        (بشين لا كاف)، والمقطع sohn يُنطق زون (بزاي لأن الألمانية تُصوِّت s بين
        المصوتات صوتاً مجهوراً). يُستخدم هذا الشكل في بعض المراجع الأكاديمية.
    - lemma: "مَنْدِلْسُون"
      generation_method: taarib
      justification: >-
        تعريب لقب الشخص منفرداً كما هو معهود في الإشارة إلى الأعلام في الكتابة
        المتخصصة والصحفية عند الإشارة الثانية. اللقب Mendelsohn → مَنْدِلْسُون.
    - lemma: "مَنْدِلْسُهْن"
      generation_method: taarib
      justification: >-
        ضبط بديل يُثبت هاء ساكنة في نهاية اللقب محاكاةً للإملاء الإنجليزي Mendelsohn
        (sohn = سُهْن) مع الحفاظ على الألف اللاتينية المحذوفة. يُعدّ هذا الشكل أقل
        شيوعاً ويُوجَد في بعض الفهارس الموسوعية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (4 استعلامات):
#   ١. البحث الدفعي عن اللمّات وصيغ al- (لا نتائج - إريك مندلسون غير موثَّق في المعاجم)
#   ٢. الجسر الإنجليزي: Mendelsohn / Erich Mendelsohn
#      → نتيجة واحدة لا صلة لها: اختبار مندلسون الطبي (entry_id 656110)
#   ٣. البحث النصي FTS: مندلسون، مندلسزون، مندلسوهن
#      → نفس النتيجة الطبية فقط
#   ٤. البحث عن: معمار / مهندس معماري (للسياق)
#      → مفيد للمرحلة ٤ فحسب، لا أدلة على الشخص
stage2_evidence:
  per_lemma:
    - lemma: "إريك مندلسون"
      evidence_status: "no_material_found"

    - lemma: "مندلسون"
      expands:
        - text: >-
            «اخْتِبارُ مندلسون (لكفاءة الوظيفة القلبية الوعائية)»
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          addition: >-
            الوحيد الذي يتضمن «مندلسون» في المعاجم العربية المتاحة هو اختبار طبي
            (Mendelsohn's test) لا علاقة له بالمعماري. الأثر يؤكد أن «مندلسون» كلقب
            مُعرَّب موثَّق في العربية، لكن في سياق مختلف تماماً.

    - lemma: "إِيرِيك مَنْدِلْسُون"
      evidence_status: "no_material_found"

    - lemma: "إِيرِش مَنْدِلْزُون"
      evidence_status: "no_material_found"

    - lemma: "مَنْدِلْسُون"
      evidence_status: "no_material_found"

    - lemma: "مَنْدِلْسُهْن"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى الموجودة ──
    - lemma: "إريك مندلسون"
      decision: confirmed
      decision_reason: >-
        الاسم الكامل للمعماري وهو الشكل الأساسي المعتمد في الموسوعات والدراسات العربية
        المتخصصة في تاريخ العمارة. غيابه من قواعد البيانات المعجمية أمر طبيعي تماماً
        لأن أسماء الأعلام الأجنبية لا تُدرَج عادةً في معاجم الألفاظ العربية العامة.
        يستوجب إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        الصيغة الكاملة (الاسم الأول + اللقب) تُستخدم في السياق الرسمي والأكاديمي
        وعند الإشارة الأولى إلى الشخص في النص، وهي لا لبس فيها ولا تشترك في الدلالة
        مع أي شخص آخر يحمل لقب مندلسون (كالموسيقار فيلكس مندلسون).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِرِيك مَنْدِلْسُون"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "مندلسون"
      decision: confirmed
      decision_reason: >-
        اللقب المختصر متداوَل في الكتابة العربية المتخصصة كما في معظم اللغات عند الإشارة
        المتكررة لشخص بعينه في سياق واضح. يستوجب إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        صيغة الاختصار (اللقب وحده) تُستخدم في الإشارة الثانية وما بعدها في النص، وفي
        الفهرسة والتوثيق. إلا أنها مُشتركة مع أشخاص آخرين يحملون نفس اللقب (أبرزهم
        الموسيقار فيلكس مندلسون)، لذا يُفضَّل استخدام الاسم الكامل عند أي غموض.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنْدِلْسُون"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِيرِيك مَنْدِلْسُون"
      source: stage1
      decision: removed
      decision_reason: >-
        يتطابق دلالياً مع اللمّة الموجودة «إريك مندلسون» مع فارق في الضبط الصوتي للمقطع
        الأول (إِيرِيك بياء مدّ، مقابل إِرِيك بكسرة). الشكل الموجود هو المعتمد في
        الموسوعات العربية (ويكيبيديا)، فلا داعي لإضافة شكل موازٍ.

    - lemma: "إِيرِش مَنْدِلْزُون"
      source: stage1
      decision: removed
      decision_reason: >-
        تعريب وفق النطق الألماني الضيّق غير متداوَل في الكتابة العربية الفعلية.
        المعاجم والموسوعات العربية تعتمد شكل إريك/إيريك لا إيرش. يُعدّ هذا الشكل
        أجنبياً في السياق العربي وغير مألوف للقارئ.

    - lemma: "مَنْدِلْسُون"
      source: stage1
      decision: removed
      decision_reason: >-
        يتطابق مع اللمّة الموجودة «مندلسون» مع إضافة التشكيل فحسب؛ وقد أُدرِج ضمن
        الإجراءات المطلوبة كتحديث تشكيل للمّة الأصلية لا كإضافة مدخل جديد.

    - lemma: "مَنْدِلْسُهْن"
      source: stage1
      decision: removed
      decision_reason: >-
        الشكل غير مستخدَم في المصادر العربية الموثوقة. إثبات الهاء في النهاية استناداً
        للإملاء الإنجليزي Mendelsohn يُخالف المعيار الصوتي العربي الذي يتعامل مع المقطع
        -sohn بوصفه -سون لا -سهن.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري ألماني هاجر إلى فلسطين عام 1937 (1887-1953)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي صحيح في جوهره لكنه مقتضب ويقتصر على الجنسية والمهنة والهجرة
        والتواريخ. ينبغي إثراؤه بذكر أسلوبه المعماري التعبيري الذي اشتهر به، وإن كانت
        الإضافة ينبغي أن تبقى موجزة بما يناسب أسلوب المعجم الوسيط لا الموسوعة.
    authored:
      - type: encyclopedic
        text: >-
          مُهَنْدِسٌ مِعْمَارِيٌّ أَلْمَانِيٌّ مِنْ رُوَّادِ الْعِمَارَةِ
          التَّعْبِيرِيَّةِ، وُلِدَ عَامَ 1887 وَتُوُفِّيَ عَامَ 1953،
          هَاجَرَ إِلَى فِلَسْطِينَ الاِنْتِدَابِيَّةِ عَامَ 1937 وَأَنْجَزَ
          فِيهَا أَعْمَالاً بَارِزَةً، ثُمَّ اسْتَقَرَّ لَاحِقاً فِي
          الْوِلَايَاتِ الْمُتَّحِدَةِ الْأَمْرِيكِيَّةِ.
    actions:
