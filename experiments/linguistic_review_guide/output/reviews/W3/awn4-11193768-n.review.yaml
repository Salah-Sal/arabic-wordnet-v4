            التَّعْبِيرِيَّةِ، وُلِدَ عَامَ 1887 وَتُوُفِّيَ عَامَ 1953،
            هَاجَرَ إِلَى فِلَسْطِينَ الاِنْتِدَابِيَّةِ عَامَ 1937 وَأَنْجَزَ
