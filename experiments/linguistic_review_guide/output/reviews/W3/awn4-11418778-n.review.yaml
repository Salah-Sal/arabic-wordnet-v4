stage2_evidence:
  per_lemma:
    - lemma: "رَايْت"
      expands:
        - text: "«وليم رايت Wright.W (١٨٣٠-١٨٨٩): مستشرق إنجليزي، ولد في البنغال، ودرس اللغات الشرقية في أسكتلندا وفي ليدن على 'دوزى'، وعُيِّن أستاذًا للغة العربية في جامعتَي لندن ودبلن، وعمل في مكتبة المتحف البريطاني، ثم أستاذًا في كمبردج. من آثاره: 'حرزة الحاطب وتحفة الطالب'...»"
          source: "المعجم الكبير (Al-Mu'jam Al-Kabir)"
          addition: "يُثبت النصُّ أن 'رايت' مستخدَمٌ في المعجمية العربية لتعريب اللقب Wright عند الإشارة إلى أعلام غربيين — وإن كان المقصودُ هنا شخصًا آخر (ويليام رايت المستشرق وليس ويلبر رايت الطيار). يُؤكِّد صحةَ الصيغة التعريبية دون أن يدعم المرجعَ الدلالي المحدد للمجموعة."
      contradicts:
        - text: "«وليم رايت Wright.W (١٨٣٠-١٨٨٩): مستشرق إنجليزي...»"
          source: "المعجم الكبير (Al-Mu'jam Al-Kabir)"
          conflict: "المدخل الوحيد في المعاجم العربية لـ'رايت' يُحيل إلى شخصية مختلفة تمامًا (المستشرق ويليام رايت)، لا إلى رائد الطيران ويلبر رايت — مما يُضعِف قيمة الدليل المعجمي لهذه اللمّة في سياق هذه المجموعة تحديدًا."

    - lemma: "وِيلْبُر رَايْت"
      evidence_status: "no_material_found"

    - lemma: "وِلْبُر رَايْت"
      evidence_status: "no_material_found"

    - lemma: "رَايْت الطَّيَّار"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "رايت"
      decision: confirmed
      decision_reason: "اللقب 'رايت' تعريب راسخ ومطَّرد للاسم العائلي Wright، ومستخدمٌ في المصادر العربية كالمعجم الكبير وغيره للإشارة إلى أعلام غربيين يحملون هذا اللقب. ضمُّه إلى هذه المجموعة جائز بوصفه اختصارًا متداولًا، مع تسجيل تحفُّظ على احتمال الاشتراك مع أورفيل رايت. صحته الصرفية كاسم علم معرَّب لا غبار عليها. يحتاج إلى إضافة التشكيل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب المختصر المنفرد، يصلح في السياقات التي يكون فيها المقصود واضحًا من المحيط، أو حين يُشار إلى الأخوين معًا؛ أعمُّ من 'ويلبر رايت' وأقل تحديدًا."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَايْت"

    - lemma: "ويلبر رايت"
      decision: confirmed
      decision_reason: "الاسم الكامل 'ويلبر رايت' هو التعبير المتداول في المصادر العربية والموسوعات للإشارة إلى هذا الرائد تحديدًا. وإن لم يرد في المعاجم المستعلَمة، فذلك لأن المعاجم العربية تُهمل الأعلام الشخصية الأجنبية في الغالب. التعريب صحيح مطَّرد، وهو اللمّة الأدق للمجموعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل الجامع بين الاسم الشخصي 'ويلبر' واللقب 'رايت' — أعلى تحديدًا ودقةً، يُميِّز ويلبر بعينه عن أخيه أورفيل وعن سائر أصحاب لقب رايت."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيلْبُر رَايْت"

    - lemma: "وِلْبُر رَايْت"
      source: stage1
      decision: removed
      decision_reason: "التعريب البديل بحذف صوت المدّ في 'Wilbur' (وِلْبُر بدلًا من وِيلْبُر) أقلُّ مطابقةً للصوت الإنجليزي الأصلي وأقل شيوعًا في المصادر العربية؛ لا توجد أدلة معجمية تدعمه، ولا ضرورة لتعدد التعريبات حين تكون الصيغة المعيارية 'وِيلْبُر' أوضح وأشيع."

    - lemma: "رَايْت الطَّيَّار"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي لا يرقى إلى مصطلح مسكوك: يفشل اختبار السكّ (يمكن إبداله بـ'رايت المخترع' أو 'رايت الرائد' وتبقى العبارة وصفيةً لا اصطلاحية)، ولا يُستخدم في أي مصدر عربي معياري كلمّة معجمية لويلبر رايت. اللمّة 'وِيلْبُر رَايْت' تُغني عنه بدقة أكبر."


