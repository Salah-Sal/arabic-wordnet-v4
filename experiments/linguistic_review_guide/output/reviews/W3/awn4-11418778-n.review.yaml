# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'رايت' (اللقب وحده) مشتركةٌ مع أشخاص عديدين يحملون هذا اللقب، أبرزهم: أُورفيل رايت أخو ويلبر، وسيوول رايت عالم الوراثة، وويليام رايت المستشرق. وجودها في هذه المجموعة دون مقابلها في مجموعة أورفيل رايت يُثير إشكالية التعدد الدلالي."
      - "اللمّتان خاليتان من التشكيل الكامل الإلزامي."
      - "الاسم 'أورفيل' في التعريف الحالي ورد بدون تشكيل ودون مراعاة الضبط الصحيح للمعرَّب."
    observations: "المجموعة تُمثِّل عَلَمًا شخصيًّا أجنبيًّا (Wilbur Wright)، وهي نوعٌ خاص من المجموعات لا يقبل إلا التعريبَ وسيلةً وحيدةً لتعريبه بالعربية، إذ لا أصلَ عربيًّا للاسم ولا يخضع للاشتقاق ولا للمجاز. تتضمن المجموعة لمّتين: لقبًا مختصرًا (رايت) واسمًا كاملًا (ويلبر رايت). اللمّة المركَّبة هي الأدقُّ والأكثر تحديدًا. المجموعة صحيحة في مجملها لكنها تستدعي تصحيح التشكيل والتدقيق في حدود دلالة اللقب المفرد."

  blind_candidates:
    - lemma: "وِيلْبُر رَايْت"
      generation_method: taarib
      justification: "تعريب الاسم الكامل 'Wilbur Wright' مع صوت المدّ الطويل في 'Wil-' (وِيلْ) — الأكثر دلالةً وتحديدًا على رائد الطيران المقصود دون لبس."
    - lemma: "رَايْت"
      generation_method: taarib
      justification: "تعريب اللقب 'Wright' وحده — يُستخدم اختصارًا مألوفًا في الكتابات العربية للإشارة إلى الأخوين رايت أو لأحدهما."
    - lemma: "وِلْبُر رَايْت"
      generation_method: taarib
      justification: "تعريب بديل للاسم 'Wilbur' بحذف صوت المدّ الطويل (وِلْبُر بدلًا من وِيلْبُر) — أقل شيوعًا وأبعد عن الصوت الإنجليزي الأصلي."
    - lemma: "رَايْت الطَّيَّار"
      generation_method: tarkib
      justification: "تركيب إضافي يضيف 'الطيّار' للتمييز عن أصحاب اللقب الآخرين — محاولة تخصيصية لكنها غير مسكوكة معجميًّا."


