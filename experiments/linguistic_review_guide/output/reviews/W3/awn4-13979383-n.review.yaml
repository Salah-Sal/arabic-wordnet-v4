# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13979383-n (reality)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «واقع» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "اللمّة «واقع» موجودة أيضاً في المجموعة الأعلى (hypernym) awn4-13978104-n (فعليّة/واقع) — تكرار اللمّة ذاتها في مجموعتين متراتبتين قد يُلبس"
      - "المجموعة تحتوي لمّة واحدة فقط — يُستحسن إثراؤها بمرادفات"
    observations: "المفهوم المستهدف هو «الواقع» بوصفه حالة العالم كما هو فعلاً في مقابل التمنّي والخيال. وهو مفهوم فلسفي-عامّ له جذور عميقة في التراث العربي الإسلامي، إذ ناقشه المتكلّمون والحكماء تحت مصطلحات «الواقع» و«نفس الأمر» و«الحقيقة». اللمّة الموجودة «واقع» مناسبة تماماً لكنها بحاجة إلى تشكيل، والمجموعة فقيرة بلمّة واحدة."
  blind_candidates:
    - lemma: "حَقِيقَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر «حقق» على وزن فَعِيلَة بمعنى الشيء الثابت يقيناً. تُستعمل في العربية المعاصرة مرادفةً لـ«الواقع» في سياق التمييز بين ما هو حقيقي وما هو متخيَّل أو مُتمنًّى."
    - lemma: "وَاقِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «وقع» بمعنى الحاصل والكائن فعلاً. يدلّ على ما سقط في الوجود وتحقّق، فهو أنسب لفظ للدلالة على حالة العالم كما هو."
    - lemma: "حَقّ"
      generation_method: majaz
      justification: "الحقّ نقيض الباطل ويدلّ على إحكام الشيء وصحّته، ويُستعمل مجازاً للدلالة على الواقع المُحقَّق. لكنّ دلالته أوسع وتشمل الحقّ القانوني والإلهي."
    - lemma: "كَيْنُونَة"
      generation_method: ishtiqaq
      justification: "مصدر من «كان يكون» على وزن فَيْعَلُولَة، يدلّ على حالة الوجود والكون. قد يصلح للدلالة على الواقع بوصفه حالة ما هو كائن."

stage2_evidence:
  per_lemma:
    - lemma: "وَاقِع"
      confirm:
        - text: "«(الْوَاقِع) الَّذِي ينقر الرَّحَى (ج) وقعه وَالْحَاصِل يُقَال أَمر وَاقع وطائر وَاقع إِذا كَانَ على شجر أَو نَحوه»"
          source: "المعجم الوسيط"
        - text: "«الواقع: عند المتكلمين: هو اللوح المحفوظ، وعند الحكماء: هو العقل الفعال.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الواقع: [في الانكليزية] reality ،real ،effective [...] وعند الحكماء والمتكلّمين هو الخارج»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الْوَاقِع: اعْلَم أَن فِي تَفْسِير الْوَاقِع وَنَفس الْأَمر اخْتِلَافا [...] وَالْحق مَا ذهب إِلَيْهِ الْمُحَقِّقُونَ من أَنَّهُمَا عبارتان عَن كَون الْمَوْضُوع بِحَيْثُ يَصح عَلَيْهِ الحكم بِأَنَّهُ كَذَا»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«(1) الحقيقيّة؛ الواقعيّة (2) حقيقة؛ واقع. in reality: في الحقّ؛ في الواقع.»"
          source: "المورد الحديث (2008)"
          addition: "يُستعمل واقع مرادفاً لحقيقة في ترجمة reality"
        - text: "«واقع» = reality — في مسارد الفلسفة وعلم النفس وعلم الاجتماع والتربية"
          source: "معاجم ALECSO المتعددة (ArabTerm)"
          addition: "شيوع المصطلح في الحقول المعرفية الحديثة"

    - lemma: "حَقِيقَة"
      confirm:
        - text: "«الحقيقة: اسم أريد به ما وضع له، فعيلةٌ من: حَقَّ الشيء، إذا ثبت [...] وفي الاصطلاح: هي الكلمة المستعملة فيما وضعت له»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«حقيقة الشيء: ما به الشيء هو هو [...] وقد يقال: إن ما به الشيء هو هو باعتبار تحققه: حقيقة»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«الحقيقة: هي اللَّفْظ الْمُسْتَعْمل فِيمَا وضع لَهُ فِي اصْطِلَاح التخاطب»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الدلالة الاصطلاحية لـ«حقيقة» في علوم البلاغة مختلفة عن دلالة «الواقع» كحالة للعالم"
      expands:
        - text: "«(1) الحقيقيّة؛ الواقعيّة (2) حقيقة؛ واقع.»"
          source: "المورد الحديث (2008)"
          addition: "حقيقة تُذكر مرادفةً لواقع في ترجمة reality"

    - lemma: "حَقّ"
      confirm:
        - text: "«الحَقّ ما هو الواقع صِدْقاً. والواجب خُلُقاً. والبيِّن ظهوراً»"
          source: "مفردات القرآن للفراهي"
      contradicts:
        - text: "«الحَقُّ: من أسماء اللهِ تعالى، أو من صِفاتِهِ، والقُرْآنُ، وضِدُّ الباطِلِ، والأمر المَقْضِيُّ، والعَدْلُ، والإِسْلامُ، والمالُ، والمِلْكُ، والمَوجود الثابِتُ، والصِدْقُ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "«الحقّ» مفرط التعدّد الدلالي — يشمل الحقّ القانوني والإلهي والفلسفي، ولا يختصّ بدلالة «الواقع» كحالة للعالم"
        - text: "«الحق: لغة الثابت الذي لا يسوغ إنكاره. وعرفاً: الحكم المطابق للواقع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الحقّ حُكم مطابق للواقع وليس الواقعَ نفسه — فثمّة فرق بين المُطابِق والمُطابَق"

    - lemma: "كَيْنُونَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "وَاقِع"
      decision: confirmed
      decision_reason: "اللمّة مؤيَّدة بأدلة معجمية قوية من المعجم الوسيط وكتب الاصطلاح (الجرجاني، التهانوي، الأحمدنكري)، وشائعة في المعاجم الاصطلاحية الحديثة بدلالة reality. المعنى الأصلي «الحاصل» (الوسيط) يتّسق مع تعريف المجموعة. اللمّة تحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على ما هو كائن وحاصل فعلاً — التركيز على الحالة الموضوعية للأشياء كما وقعت وتحقّقت في الخارج"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَاقِع"

    - lemma: "حَقِيقَة"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ «حقيقة» تُستعمل أحياناً مرادفةً لـ«واقع» في الاستعمال المعاصر، فإنّ دلالتها الأصلية والاصطلاحية تتمحور حول «ماهية الشيء وكنهه» و«اللفظ المستعمل فيما وُضع له» (مقابل المجاز). وهي أنسب لمجموعة ترادفية تتعلّق بـ«الحقيقة/الصدق» (truth) لا بـ«الواقع» (reality) كحالة موضوعية للعالم."
      evidence_assessment:
        case: mixed

    - lemma: "حَقّ"
      source: stage1
      decision: removed
      decision_reason: "«الحقّ» مُفرط التعدّد الدلالي (اسم من أسماء الله، نقيض الباطل، الحكم المطابق للواقع، الملك، العدل...). هو حُكم مطابق للواقع وليس الواقعَ ذاته. إدراجه في هذه المجموعة يخلط بين المُطابِق والمُطابَق."
      evidence_assessment:
        case: contradicts_only

    - lemma: "كَيْنُونَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على استعمال «كينونة» بمعنى «الواقع». دلالتها الأصلية على مطلق الوجود والكون أعمّ بكثير من دلالة هذه المجموعة المحدّدة."
      evidence_assessment:
        case: no_material

