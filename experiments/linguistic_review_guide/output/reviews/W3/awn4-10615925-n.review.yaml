# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «قارئ نوتة فوري» تستخدم «نوتة» بمعنى النوتة الموسيقية، بينما المعاجم العربية (المعجم الوسيط) تحصر معناها في «كناشة صغيرة تُقيَّد فيها الملاحظات»؛ وهذا استخدام معارَض معجمياً."
      - "التعبير ثلاثي الكلمات (قارئ + نوتة + فوري) لا يجتاز اختبار التثبيت المعجمي: يمكن إبدال «نوتة» بـ«ورقة» أو «مدوّنة» ويبقى التعبير وصفاً صالحاً، مما يكشف أنه ليس مصطلحاً مسكوكاً."
      - "المجموعة تضمّ لمّةً واحدةً فقط، دون أي ترادف داخلي يوفّر غنىً دلالياً."
    observations: >
      المفهوم الدلالي للمجموعة هو شخص يؤدّي الموسيقى (عزفاً أو غناءً) بقراءة النوتة فور أول
      اطلاعه عليها دون تحضير مسبق، وهو ما يعرف بـ«sight-reading» أو «prima vista» موسيقياً.
      التحدي اللغوي: العربية تفتقر إلى مصطلح راسخ للشخص (المؤدي) بوصفه وحدةً معجميةً منفردة؛
      فمعظم الشواهد الموجودة تُعبّر عن الفعل أو الممارسة (القراءة الآنية، الارتجال) لا عن
      الفاعل. يُرجَّح أن اللمّة الأصلح تُشتقّ من جذر «رجل» عبر «الارتجال» الذي وثّقته المعاجم
      الحديثة تحديداً بمعنى «القراءة أو العزف من غير استعداد أو دراسة مُسبَّقة».

  blind_candidates:
    - lemma: "مُرْتَجِل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «ارتجل» على وزن مُفْتَعِل، والارتجال في العربية يعني الأداء بلا استعداد
        مسبق. الجذر «رجل» أصيل في العربية، والمصدر «ارتجال» شائع في السياقين اللغوي والموسيقي.
        الوزن يناسب وظيفة اسم الفاعل الدالّ على الصفة المستمرة.

    - lemma: "قَارِئٌ فَوْرِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (موصوف + صفة): قارئ (اسم فاعل من قرأ) + فوري (نسبة إلى الفور أي الحين).
        يُعبّر عن الشخص الذي يقرأ على الفور دون تأخير أو تحضير. بنيته الوصفية ظاهرة وصياغته
        مقتصدة من كلمتين.

    - lemma: "مُبَادِه"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «بادهه» أي فاجأه أو لقيه بغتةً. والبديهة في العربية: أول الرأي قبل التفكّر.
        يُعبّر عن من يُؤدّي الأمر بادئ بديهته دون تروٍّ أو تحضير؛ وهو وزن مُفَاعِل يشير إلى
        المباغتة والفورية.

    - lemma: "قَارِئٌ ارْتِجَالِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي: قارئ (اسم فاعل، يدلّ على صلة القراءة بالنوتة) + ارتجالي (نسبة إلى الارتجال).
        يجمع بين بُعد القراءة (ضروري للتمييز عن الارتجال الإبداعي المحض) وبُعد الارتجال (الغياب
        التام للتحضير). أكثر تخصيصاً من «مُرتجِل» المجرّد.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "قارئ نوتة فوري"
      contradicts:
        - text: "«(النوتة) كناشة صغيرة تُقيَّد فيها الملاحظات والخواطر وما أشبه ذلك»"
          source: "المعجم الوسيط"
          conflict: >
            التعريف المعجمي لـ«نوتة» يحصرها في معنى الكناشة/الدفتر، لا النوتة الموسيقية؛
            فاستخدامها للدلالة على التدوين الموسيقي في اللمّة مُغايِرٌ للمعنى الراسخ معجمياً.
        - text: "«(النُّوتَةُ) كناشة صغيرة تقيّد فيها الملاحظات والخواطر وما أشبه ذلك»"
          source: "المعجم الوسيط لمجموعة المؤلفين (مصدر: hawramani)"
          conflict: >
            تأكيد ثانٍ لنفس المعنى: «نوتة» = كناشة ملاحظات؛ لا توجد شاهد معجمي يربطها بالتدوين
            الموسيقي في المعاجم العربية الموثّقة.

    - lemma: "مُرْتَجِل"
      confirm:
        - text: "«الارتجال: القراءة أو العَزْف من غير استعداد أو دراسة مُسَبّقة»"
          source: "المورد الحديث (2008) — ARABTERM، translation_en: sight reading"
        - text: "«(1) المُرْتَجَل: خطاب أو أداء مُرتجَل (2) مُرتَجَل (3) ارتجالاً»"
          source: "المورد الحديث (2008) — ARABTERM، translation_en: impromptu"
        - text: "«(1) ارتجال (2) شيء مُرْتَجَل»"
          source: "المورد الحديث (2008) — ARABTERM، translation_en: improvisation"
        - text: "«(1) ارتجالاً (2) مُرتجَل»"
          source: "المورد الحديث (2008) — ARABTERM، translation_en: extempore"
      expands:
        - text: "«المرتجل: الاسم الذي لم يوضع قبل العلمية»"
          source: "التوقيف على مهمات التعاريف للمناوي (hawramani)"
          addition: >
            هذا المعنى تقني-لغوي (علم الأسماء) يختلف عن معنى الأداء دون تحضير؛ يدلّ على
            تعدّد دلالات «مُرتجَل» عبر التاريخ، ويستوجب الحذر لدى السياق الموسيقي.
        - text: "«مرتَجَل: offhand»"
          source: "مسرد الإعلام والتواصل — ALECSO ARABTERM"
          addition: >
            التوثيق الاصطلاحي الحديث لـ«مرتجل» بمعنى «offhand» يؤكد الاستخدام المعاصر للكلمة
            بمعنى الأداء غير المُحضَّر في مجال التواصل.

    - lemma: "قَارِئٌ فَوْرِيٌّ"
      expands:
        - text: "«قارئ: reader»"
          source: "مسرد الإعلام والتواصل — ALECSO ARABTERM"
          addition: >
            الجزء الأول من المركب (قارئ) موثَّق في ARABTERM بمعنى reader. لكن التعبير المركب
            «قارئ فوري» بوصفه وحدة مصطلحية موحّدة غير موثَّق.
      evidence_status: "no_material_found"

    - lemma: "مُبَادِه"
      evidence_status: "no_material_found"

    - lemma: "قَارِئٌ ارْتِجَالِيٌّ"
      expands:
        - text: "«الارتجال: القراءة أو العَزْف من غير استعداد أو دراسة مُسَبّقة»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >
            الجذر الاشتقاقي للمركب (ارتجالي ← ارتجال) موثَّق بالمعنى المراد. غير أن المركب
            «قارئ ارتجالي» بوصفه وحدة مصطلحية مُثبَّتة غير موثَّق في المعاجم.
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "قارئ نوتة فوري"
      decision: removed
      decision_reason: >
        تتضافر على إسقاط هذه اللمّة أربعة أسباب: (١) الدليل المعجمي: «نوتة» في المعاجم المعتمدة
        (الوسيط، مجموعة المؤلفين) = «كناشة صغيرة للملاحظات»، لا النوتة الموسيقية؛ فالاستخدام
        معارَض معجمياً. (٢) اختبار السكّ: إبدال «نوتة» بـ«ورقة» أو «مدوّنة» يُبقي التعبير
        وصفاً صحيحاً، مما يثبت أنه تعبير حرّ لا مصطلح مسكوك. (٣) غياب التثبيت المعجمي: لم
        يَرِد التعبير في أي من معاجم ARABTERM أو الحديثة أو الكلاسيكية بوصفه وحدةً واحدة.
        (٤) الترجمة الحرفية العمياء: التعبير ترجمة آلية لـ«music-note reader» دون مراعاة
        الخصوصية الدلالية العربية لـ«نوتة».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُرْتَجِل"
      source: stage1
      decision: confirmed
      decision_reason: >
        توافر دليل صريح في المورد الحديث (ARABTERM) يربط «الارتجال» بمعنى «sight reading» تحديداً:
        «القراءة أو العَزْف من غير استعداد أو دراسة مُسَبّقة». اسم الفاعل «مُرتجِل» مشتقّ قياسياً
        من هذا المصدر. الكلمة تُؤدّي ثلاثة اختبارات معجمية: (أ) الاطّراد الصرفي — وزن مُفتَعِل
        سليم. (ب) يُسر التداول — لفظ واحد بسيط. (ج) الاشتقاقية — من جذر ثلاثي عريق (رجل).
        التحفّظ الوحيد: «مُرتجِل» في السياق الموسيقي يشمل الارتجال الإبداعي المحض إضافةً إلى
        القراءة الآنية، إلا أن التخصيص يتحقق بالسياق. وقد وثّقت المعاجم الحديثة استخدامه
        في مجال الأداء بلا تحضير.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكّدة؛ تُبرز البُعد الارتجالي (absence of preparation) وتشمل الأداء
        من القراءة الآنية دون تدرّب مسبق، مع دلالة ضمنية على المهارة والقدرة الفطرية.
      actions:
        - command: create_entry
          params:
            lemma: "مُرْتَجِل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "قَارِئٌ فَوْرِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير المركّب «قارئ فوري» لم يُثبَّت معجمياً بوصفه وحدة مصطلحية في أي من المصادر
        المُستعلَمة. يجتاز اختبار السكّ بالفشل: «قارئ سريع»، «قارئ لحظي» تؤدّي نفس الوظيفة
        الوصفية. فضلاً عن ذلك، «فوري» تُركّز على السرعة الزمنية لا على غياب التحضير المسبق،
        وهو الفارق الجوهري في تعريف المفهوم.

    - lemma: "مُبَادِه"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي يدعم استخدام «مُبادِه» في السياق الموسيقي أو بمعنى
        «قارئ النوتة الآني». والكلمة وإن صحّت اشتقاقياً، فإنها تُبرز المفاجأة والمباغتة
        بدلاً من القراءة الفنية المنضبطة؛ كما أن جذرها (بده) بعيد الاستحضار الدلالي في
        المجال الموسيقي.

    - lemma: "قَارِئٌ ارْتِجَالِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير المركّب وصفي لا مصطلحي: «قارئ ارتجالي» يصف الحالة وصفاً مباشراً ولا يُثبَّت
        بوصفه وحدةً معجميةً ثابتة. وهو أشدّ التباساً من «مُرتجِل» المُفرَد لأنه يوحي بتكرار
        الفعل وليس بالقدرة الذاتية للمؤدّي. الأقتصاد اللغوي يُرجّح «مُرتجِل» المفرد عليه.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مؤدٍ يقرأ ويعزف الموسيقى فوراً دون تحضير مسبق"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في جوهره لكنه يستحق التدقيق في ثلاثة مواضع: (١) «يقرأ ويعزف»
        تكرار جزئي (القراءة الآنية هي نفسها العزف من النوتة)؛ (٢) «فوراً» تُشير إلى السرعة
        لا إلى أوّلية الاطّلاع، والأدقّ «عند أول اطّلاع» أو «دون معرفة مسبقة»؛ (٣) التعريف
        لا يستخدم الجنس القريب (نوع المؤدّي) بشكل واضح.
    authored:
      - type: terminological
        text: >
          مُؤَدٍّ موسيقي يعزف العمل الموسيقي أو يُغنّيه عند أول اطّلاعه على النوتة المكتوبة
          دون تدرّب عليه أو معرفة مسبقة به
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مَن يملك القدرة على أداء الموسيقى مباشرةً من النوتة دون تدرّب مسبق؛ تُعدّ هذه
          الملَكة من أبرز الكفاءات في التعليم الموسيقي الأكاديمي وتُعرف بـ«prima vista»
          لاتينياً أو «sight-reading» إنجليزياً
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            مُؤَدٍّ موسيقي يعزف العمل الموسيقي أو يُغنّيه عند أول اطّلاعه على النوتة المكتوبة
            دون تدرّب عليه أو معرفة مسبقة به
      - command: add_definition
        params:
