stage3_analysis:
  per_lemma:
    - lemma: "جيني"
      decision: confirmed
      decision_reason: "الاسم الأخير للمهندس، ويُستخدم للإشارة إليه اختصاراً، والنقحرة صحيحة وتحتاج للضبط بالشكل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِينِي"

    - lemma: "ويليام لو بارون جيني"
      decision: confirmed
      decision_reason: "الاسم الكامل للمهندس بصيغته المنقحرة المتعارف عليها، يحتاج إلى التشكيل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيلْيَام لُو بَارُون جِينِي"

    - lemma: "وِيلْيَام لُو بَارُون جِينِي"
      source: stage1
      decision: removed
      decision_reason: "تطابق اللمة الموجودة في المجموعة بعد ضبطها."

    - lemma: "وِلْيَام لُو بَارُون جِينِي"
      source: stage1
      decision: removed
      decision_reason: "صيغة بديلة لا داعي لإضافتها تجنباً للتكرار."

    - lemma: "جِينِي"
      source: stage1
      decision: removed
      decision_reason: "تطابق اللمة الموجودة في المجموعة بعد ضبطها."

    - lemma: "وِيلْيَام جِينِي"
      source: stage1
      decision: removed
      decision_reason: "اختصار غير ضروري في ظل وجود الاسم الكامل واسم العائلة."

stage4_content:
  definition:
    current: "معماري أمريكي صمم أول ناطحة سحاب استخدم فيها هيكل معدني (1832-1907)"
    assessment:
      decision: revise
      reason: "التعريف يفتقر إلى الصياغة الموسوعية السليمة، ويمكن تحسينه لغوياً ليصبح أكثر دقة."
    authored:
      - type: encyclopedic
        text: "مُهَنْدِسٌ مِعْمَارِيٌّ أَمْرِيكِيٌّ (1832 - 1907م)، صَمَّمَ أَوَّلَ نَاطِحَةِ سَحَابٍ ذَاتِ هَيْكَلٍ مَعْدِنِيٍّ."
    actions:
