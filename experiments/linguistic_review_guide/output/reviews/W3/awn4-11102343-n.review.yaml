        examples:
          - text: "يُعَدُّ الْمِعْمَارِيُّ جِينِي مِنَ الْمُؤَسِّسِينَ لِمَدْرَسَةِ شِيكَاغُو الْمِعْمَارِيَّةِ."
            type: usage
      - lemma: "ويليام لو بارون جيني"
        examples:
          - text: "صَمَّمَ وِيلْيَام لُو بَارُون جِينِي مَبْنَى التَّأْمِينِ عَلَى الْمَنَازِلِ الْمُشَيَّدِ بِهَيْكَلٍ فُولَاذِيٍّ."
            type: usage
    actions:
