stage1_review:
  assessment:
    concerns:
      - "المصطلحات عبارة عن أسماء علم أجنبية (أعلام أشخاص) وبالتالي تغيب عن المعاجم اللغوية التقليدية."
      - "اللمة 'جيني' قد تلتبس مع مصطلحات أخرى (مثل النسبة إلى الجينات أو آلات الغزل) إذا وردت خارج السياق."
    observations: "المفهوم يشير إلى شخصية تاريخية محددة (المهندس المعماري ويليام لو بارون جيني). الأعلام الأجنبية تُنقَل إلى العربية بطريقة التعريب (النقحرة الصوتية). اللمات الموجودة صحيحة كنقحرة، وتحتاج فقط إلى الضبط بالشكل."
  blind_candidates:
    - lemma: "وِيلْيَام لُو بَارُون جِينِي"
      generation_method: taarib
      justification: "النقحرة الصوتية الدقيقة للاسم الأجنبي الكامل."
    - lemma: "وِلْيَام لُو بَارُون جِينِي"
      generation_method: taarib
      justification: "نقحرة بديلة وأكثر شيوعاً لاسم 'William'."
    - lemma: "جِينِي"
      generation_method: taarib
      justification: "نقحرة الاسم الأخير (اسم العائلة)، ويُستخدم للاختصار."
    - lemma: "وِيلْيَام جِينِي"
      generation_method: taarib
      justification: "الاسم الأول والأخير للمهندس اختصاراً."

