# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10730158-n | ILI: i93646 | POS: n
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة (مُتعادل) تفتقر إلى التشكيل الكامل — الصواب: مُتَعَادِل"
      - "وزن مُتَفَاعِل في الأصل صفة مشبهة أو اسم فاعل للفعل الاشتراكي (تَعَادَلَ)، وقد يُوهم الدلالة على الحالة لا على الشخص"
      - "التعريف العربي الحالي يستخدم تعبير «بعضهم البعض» وهو تعبير مكرور دلالياً مع «يتعادلون»"
      - "المجموعة تفتقر إلى تعريف على أسلوب المعجم الوسيط وإلى أمثلة استعمالية"
    observations: >
      المفهوم دقيق: ليس مجرد «منافس» (وهو الجنس الأعلى في المجموعة المباشرة)،
      بل هو المنافس الذي يُحقق نتيجة تعادل (درو) مع منافسه. المصطلح «مُتَعَادِل»
      مشتق اشتقاقاً شفافاً من الجذر (عدل) على وزن مُتَفَاعِل الذي يدل على الاشتراك
      والتبادل، وهو من ثَمَّ ملائم دلالياً وصرفياً. يُستخدم المصطلح بصورة واسعة
      في الصحافة الرياضية العربية للإشارة إلى الفريق أو اللاعب الذي أنهى المباراة
      بالتعادل. الجذر عدل في مقاييس اللغة يدل أصلاً على «الاستواء»، وهو المعنى
      المؤسِّس لهذا الاستخدام.

  blind_candidates:
    - lemma: "نِدٌّ"
      generation_method: majaz
      justification: >
        «النِّدّ» في المعاجم الكلاسيكية «المثل والنظير» ويُطلق على من يساويك
        في القوة والمكانة. مجازٌ طبيعي لمن يُساوي خصمه في نتيجة المباراة
        (يساويه دون أن يتفوق عليه). الوزن فَعْل (اسم جامد) يمنح المصطلح
        طابع الجمود الاسمي المناسب لاسم الشخص.
    - lemma: "مُعَادِل"
      generation_method: ishtiqaq
      justification: >
        مشتق من الفعل الثلاثي المزيد (عَادَلَ) على وزن مُفَاعِل (اسم الفاعل
        من المفاعلة)، بمعنى «من يعادل خصمه ويساويه في النتيجة». اشتقاق
        صريح من الجذر (عدل) الدال على الاستواء، وهو الوزن المنتج لاسم
        الفاعل في باب المفاعلة (مشارَكة طرفين).
    - lemma: "عَدِيل"
      generation_method: ishtiqaq
      justification: >
        على وزن فَعِيل بمعنى مُفَاعِل أو مُفعَّل — وهو وزن كثيراً ما يُستخدم
        لاسم الشريك في الفعل (كـ«جليس، خليط، شريك»). عديل الرجل في
        المحمل هو من يتساوى معه في الوزن والمكانة، وهو تصوير مقارب
        لمفهوم التعادل في المنافسة.
    - lemma: "مُتَكَافِئ"
      generation_method: ishtiqaq
      justification: >
        من الجذر (كفأ) على وزن مُتَفَاعِل الاشتراكي، بمعنى «من يتكافأ مع
        خصمه» أي يتساوى معه تكافؤاً متبادلاً. الوزن مُتَفَاعِل يحمل بُعد
        الاشتراك بين طرفين كما في مُتَعَادِل ومُتَسَاوٍ، وهو ملائم
        دلالياً لمفهوم المتنافسَيْن المتكافئَيْن.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  # الاستعلامات المنفَّذة:
  # ١. مطابقة دفعية: متعادل + المتعادل + مكافئ + المكافئ + عديل + العديل
  #    + ند + الند + مساو + المساو + مساوي + المساوي
  # ٢. FTS عربي: "تعادل" OR "يتعادلون" OR "منافس" OR "متعادل"
  # ٣. مقاييس اللغة: عدل (dictionary_id = 151)
  # ٤. الجسر الإنجليزي: tier / draw / equal / tied competitor

  per_lemma:
    - lemma: "مُتَعَادِل"
      expands:
        - text: >
            «إجهاد مُتعادِل» (neutral stress)، «توازن متعادل» (neutral equilibrium)،
            «جزيء متعادل» (neutral molecule)، «محايد، متعادل» (neutral)
          source: "ARABTERM — معاجم متخصصة (هندسة المياه، الفيزياء، علوم البحار، إلخ)"
          addition: >
            يدل هذا على أن «متعادل» شائع في السياق التقني العربي بمعنى
            «مُحايَد / متوازن» في المجالات العلمية، وهو توسُّع دلالي
            لا يتعارض مع المعنى الرياضي (نتيجة التعادل = تساوي الطرفين).
      evidence_status_note: "لم يُعثر على مدخل مستقل لـ«متعادل» بمعنى «شخص يُحقق نتيجة تعادل في منافسة» في المعاجم الكلاسيكية أو الوسيط، وهو ما يُعزى إلى حداثة المفهوم الرياضي وشيوع استخدامه في الصحافة الرياضية العربية المعاصرة."

    - lemma: "نِدٌّ"
      confirm:
        - text: >
            «(الند) الْمثل والنظير يُقَال هُوَ نده وَهِي ند فُلَانَة
            (ج) أنداد وَفِي التَّنْزِيل الْعَزِيز {فَلَا تجْعَلُوا لله أندادا}»
          source: "المعجم الوسيط لمجموعة من المؤلفين (الهيئة العامة للمعجمات — hawramani)"
        - text: >
            «النّد:[في الانكليزية] Peer ،equal [في الفرنسية] Egal ،pareil بالكسر
            والتشديد عند المتكلّمين هو المثل في الذات والمخالف في الصفات»
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777م)"
        - text: >
            «الند: المقاوم في صفة القيام والدوام. وقيل ند الشيء مشاركة في جوهر،
            وذلك ضرب من المماثلة لأن المثل يقال في أي مشاركة كانت، فكل ند مثل
            ولا عكس.»
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
      contradicts:
        - text: >
            «النّد: المثل في الذات والمخالف في الصفات» — يدل على المثيل
            أو النظير بوجه عام، لا على المتنافس الذي يتعادل تحديداً.
          source: "كشاف التهانوي"
          conflict: >
            «نِدّ» يعني النظير/المثيل بوجه عام ولا يحمل دلالة نتيجة التعادل
            في المنافسة تحديداً؛ فكل مُتعادِلَيْن نِدَّانِ، لكن ليس كل نِدَّيْن
            مُتعادِلَيْن في مباراة.

    - lemma: "مُعَادِل"
      evidence_status: "no_material_found"

    - lemma: "عَدِيل"
      confirm:
        - text: >
            «الْعَدِيلُ: الَّذِي يُعَادِلُكَ فِي الْمَحْمَلِ. وَالْعَدْلُ:
            قِيمَةُ الشَّيْءِ وَفِدَاؤُهُ. وَكُلُّ ذَلِكَ مِنَ الْمُعَادَلَةِ،
            وَهِيَ الْمُسَاوَاةُ.»
          source: "مقاييس اللغة لابن فارس (ت. 395ه)"
        - text: >
            «العَدِيلُ: المِثْلُ والنظير — عَدِيلُ الرَّجُل: زوج أُخت امرأته»
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة — OCR)"
        - text: >
            «(العديل) الْمثل والنظير وعديل الرجل زوج أُخْت امْرَأَته
            (ج) أعدال وعدلاء»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
      contradicts:
        - text: >
            «عديل الرجل: زوج أخت امرأته» — دلالة اجتماعية خاصة لا صلة
            لها بسياق التعادل في المنافسة.
          source: "المعجم الوسيط"
          conflict: >
            المعنى الراسخ لـ«عديل» في الاستعمال المعاصر هو القريب بالمصاهرة
            (زوج أخت الزوجة)، لا المتنافس المتعادل، مما يُوجب الاحتراز من
            الاشتراك اللفظي.

    - lemma: "مُتَكَافِئ"
      confirm:
        - text: >
            «مكافئ: equivalent» — في معجم مصطلحات الجيولوجيا وعلوم الزلازل
          source: "ARABTERM — المعجم الموحد لمصطلحات الجيولوجيا (2000)؛ علوم الزلازل (1999)"
      contradicts:
        - text: >
            «مكافئ: equivalent» — المعنى التقني الراسخ يدور حول التكافؤ
            الكيميائي أو الرياضي، لا نتيجة التعادل في منافسة رياضية.
          source: "ARABTERM"
          conflict: >
            مُكَافِئ راسخ في المصطلح العلمي بمعنى «مُعادِل/مُكافِئ كيميائي»
            وتحميله معنى «المتنافس المُتعادِل» يُوقع في الاشتراك اللفظي.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُتعادل"
      decision: confirmed
      decision_reason: >
        اللمة مشتقة اشتقاقاً صحيحاً من الفعل تَعَادَلَ (باب التفاعل، الجذر عدل)
        على وزن مُتَفَاعِل الذي يدل على الاشتراك بين طرفين، وهو أنسب الأوزان
        للتعبير عن «شخص يشترك مع آخر في نتيجة التعادل». يتسق مع الاستخدام
        الصحفي الرياضي العربي الواسع (المتعادلان، انتهت المباراة بالتعادل بين
        المتعادلَيْن). يحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      morphological_check: >
        وزن مُتَفَاعِل (اسم فاعل من الفعل السداسي تَعَادَلَ). يصح إطلاقه
        اسماً للشخص (الفاعل المشترك في التعادل) كما يصح وصفاً. لا غبار
        على الصواب الصرفي.
      borrowing_check:
        lexical_borrowing: native
        calque: false
      quality_gate:
        ittiraad: true
        yusr_tadawul: true
        mulaama: true
        turathi: false
        arabi: true
        ishtiqaqiyya: true
      nuance_differentiation: >
        اللمة الوحيدة في المجموعة؛ تختص بالمتنافس الذي تنتهي مبارته بالتعادل
        مع خصمه (أو أكثر)، وتحمل دلالة الاشتراك والتبادل في النتيجة بفضل
        وزن مُتَفَاعِل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَعَادِل"

    - lemma: "نِدٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «نِدّ» يعني النظير والمثيل بوجه عام، وليس المتنافس الذي يحقق
        نتيجة تعادل تحديداً. كما أن استخدامه المعاصر الشائع هو في
        سياق التنديد أو الندية (لا نظير له) وليس في سياق نتائج المباريات.
        لا يجتاز اختبار الإبدال في الجملة: «انتهت المباراة وكل فريق نِدٌّ»
        — غير مألوف في الاستعمال الرياضي.
      evidence_assessment:
        case: mixed

    - lemma: "مُعَادِل"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أدلة معجمية تدعم هذا المصطلح بمعنى «المتنافس المتعادل».
        مُعَادِل (اسم فاعل من عَادَلَ) يعني «من يجعل شيئاً يساوي آخر»،
        أي المُسوِّي، لا «من يتساوى مع خصمه في نتيجة المباراة». الفرق:
        مُعَادِل فاعلٌ متعدٍّ يُسوِّي غيره، أما المراد هنا فهو فاعل لازم
        يتساوى مع غيره — وهذا ما يُؤديه مُتَعَادِل (التفاعل).
      evidence_assessment:
        case: no_material

    - lemma: "عَدِيل"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ثروته المعجمية (المثل والنظير في مقاييس ابن فارس والوسيط)،
        إلا أن الاستعمال المعاصر الشائع لـ«عديل» ينصرف إلى قريب الزوجة
        (زوج أخت الزوجة)، مما يُحدث اشتراكاً لفظياً مُضلِّلاً. فضلاً
        عن أن «عديل» لا يحمل دلالة نتيجة التعادل في المنافسة تحديداً،
        بل مجرد التماثل والنظيرية.
      evidence_assessment:
        case: mixed

    - lemma: "مُتَكَافِئ"
      source: stage1
      decision: removed
      decision_reason: >
        مُتَكَافِئ راسخ في المصطلحية العلمية (الجيولوجيا، الكيمياء،
        الفيزياء) بمعنى «المُعادِل/ المُكافِئ» التقني. تحميله معنى
        «المتنافس المُتعادِل في مباراة» يُوقع في الاشتراك اللفظي مع
        المجالات العلمية الراسخة، ويخالف مبدأ الملاءمة في بوابة الجودة.
      evidence_assessment:
        case: contradicts_only


