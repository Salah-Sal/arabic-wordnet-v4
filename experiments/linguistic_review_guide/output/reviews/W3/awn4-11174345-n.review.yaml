# ── المرحلة ١: المراجعة والتوليد ────────────────────────────────────────
# Stage 1: Review + Generate
#
# قُرئ ملف synset_info_masked.yaml أولاً (بدون لمّات).
# التعريف المُقنّع: "معماري فرنسي قدم السقف المنسرد (1598-1666)"
# المفهوم: علم شخصي (proper noun) لمعماري فرنسي تاريخي —
# لا وجود له في التراث العربي، والتعريب هو الأسلوب الوحيد الممكن.
stage1_review:
  assessment:
    concerns:
      - "POS مسجّل كـ 'n' بينما الصواب 'proper_noun'، إذ المجموعة تمثّل علمًا شخصيًا لمعماري فرنسي بعينه."
      - "اللمّتان (فرانسوا مانسار، مانسار) تفتقران إلى التشكيل الكامل في قاعدة البيانات."
      - "مصطلح 'السقف المنسرد' في التعريف العربي الحالي غير موحَّد؛ المصطلح الموحَّد في مصادر ARABTERM هو 'السقف السندي'."
      - "خطر التباس 'مانسار' بالاسم العربي 'مِنْصَار' (من جذر ن-ص-ر) المذكور في موسوعة أسماء العرب."
    observations: >
      المجموعة awn4-11174345-n تمثّل علمًا شخصيًا لمعماري فرنسي هو François Mansart
      (1598-1666)، صاحب السقف السندي (mansard roof) المنسوب إليه.
      أسماء الأعلام الأعجمية لا تخضع لاشتقاق أو مجاز؛ فالتعريب (النقحرة) هو الأسلوب الوحيد المتاح.
      الاستعمال العربي المتداول في المصادر المتخصصة هو "مانسار" للقب، و"فرانسوا مانسار"
      للاسم الكامل، وهما اللمّتان المُدرجتان فعلاً في المجموعة.
      يُستحسن تصحيح POS إلى proper_noun وتصحيح التعريف وتشكيل اللمّتين.

  blind_candidates:
    - lemma: "مَانسَار"
      generation_method: taarib
      justification: >
        النقحرة الاعتيادية للقب الفرنسي Mansart في المصادر العربية المعاصرة،
        تُحذف فيها تاء الجمع الفرنسية (t) وفق تقاليد التعريب العربي.
    - lemma: "فرانسُوا مَانسَار"
      generation_method: taarib
      justification: >
        الاسم الكامل المعرَّب (François Mansart)، يجمع الاسم الأول الفرنسي
        "فرانسوا" (إحدى صيغ تعريب François) مع اللقب "مانسار"؛
        يمنح التعريف الفردي من الأسماء المتجانسة.
    - lemma: "فِرْنسُوا مَانسَار"
      generation_method: taarib
      justification: >
        صيغة بديلة للاسم الأول أقرب إلى النطق الفرنسي الأصلي (François تُنطق /frɑ̃swa/)،
        مسجَّلة في موسوعة السلطان قابوس لأسماء العرب تحت مدخل "فرنسوا".
    - lemma: "مَانسَارت"
      generation_method: taarib
      justification: >
        نقحرة حرفية تتضمّن الحرف الأخير (t) من الأصل الفرنسي Mansart،
        تُستخدم أحيانًا في المصادر الأكاديمية الأكثر تحرياً للدقة في نقل الأسماء الأجنبية.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────────────
# Stage 2: Evidence Gathering
#
# الاستعلامات المنفَّذة (٣ استعلامات):
#   ١. المطابقة الدفعية: فرانسوا مانسار + مانسار + المانسار + مانسارت +
#      فرنسوا مانسار + منصار + فرانسوا + فرنسوا
#   ٢. الجسر الإنجليزي: Mansart | Francois Mansart | mansard | mansard roof
#   ٣. FTS كلمات مفتاحية: معماري | منسرد | مانسار | منسارد
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "فرانسوا مانسار"
      evidence_status: "no_material_found"

    - lemma: "مانسار"
      contradicts:
        - text: "«مِنْصَار: من (ن ص ر) الكثير التفوق والغلبة والنجاة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            المدخل المُعثور عليه هو 'مِنْصَار' (بكسر الميم وفتح النون)
            من الجذر العربي ن-ص-ر، وهو اسم عربي أصيل لا علاقة له بالمعماري الفرنسي Mansart؛
            مما يُظهر خطر التباس الصيغتين في النص العربي غير المشكَّل.

    # ── مرشحات المرحلة ١ ──
    - lemma: "فِرْنسُوا مَانسَار"
      expands:
        - text: "«فرنسوا: إحدى الصيغ الفرنسية للاسم فرنسس المأخوذ عن اللاتينية بمعنى إنسان حر. يستخدم للإناث والذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (جامعة السلطان قابوس، 1985)"
          addition: >
            يؤكد أن 'فرنسوا' صيغة عربية مسجَّلة لاسم François، وهو
            تعريب مغاير للصيغة الأولى 'فرانسوا'. كلا الصيغتين واردتان في المعاجم العربية.

    - lemma: "مَانسَار"
      evidence_status: "no_material_found"

    - lemma: "مَانسَارت"
      evidence_status: "no_material_found"

  # ── الجسر الإنجليزي: نتائج المصطلح mansard ──
  # كشفت استعلامات ARABTERM أن المصطلح mansard roof يُعادَل عربياً بـ:
  #   - "السقف السندي" (المعجم الموحد للمصطلحات المهنية والتقنية)
  #   - "السطح السندي" (المورد الحديث 2008)
  #   - "سقيفة: غرفة منحنية السقف" (المعجم الموحد للمصطلحات المهنية)
  # هذه المعلومات مفيدة لتصحيح التعريف (المرحلة ٤) لا للمّات الشخص.
  english_bridge_notes: >
    الجسر الإنجليزي لم يُسفر عن مداخل للاسم العلم Mansart/François Mansart
    في ARABTERM (المصادر التقنية تعالج المصطلحات لا الأعلام).
    الكشف المهم: 'mansard roof' = 'السقف السندي' في المصادر الموحَّدة،
    مما يعني أن التعريف العربي الحالي ('السقف المنسرد') يستخدم مصطلحًا غير رسمي.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────────────
# Stage 3: Lemma Linguistic Analysis
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى (موجودة): فرانسوا مانسار ──
    - lemma: "فرانسوا مانسار"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المعرَّب (François Mansart) ضروري لتفريد الشخص عن غيره
        من حاملي اللقب. يتّسق مع الاستعمال الموثَّق في المصادر المتخصصة.
        صيغة 'فرانسوا' مسجَّلة في موسوعة أسماء العرب (مقابل 'فرنسوا')
        وهي الأكثر شيوعاً في المصادر المعمارية والتاريخية العربية.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل (الاسم الأول + اللقب) — يُستخدم عند الحاجة إلى التعريف الكامل
        أو التمييز من أعلام أخرى تحمل اسم مانسار، ولا سيما Jules Hardouin-Mansart حفيد أخيه
        الذي يُذكر أحياناً باسم Mansart أيضاً.
      borrowing_check:
        lexical_borrowing: "معرَّب مقبول — نقحرة فرنسية وفق التقاليد المعجمية العربية"
        blind_translation: "لا ينطبق — اسم علم لا مفهوم علمي"
        calque: "لا ينطبق"
      morphological_fit: >
        مركب إضافي فعلي (اسم + لقب) — البنية المعيارية للأسماء الأجنبية المعرَّبة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِرانسُوا مَانسَار"

    # ── اللمّة الثانية (موجودة): مانسار ──
    - lemma: "مانسار"
      decision: confirmed
      decision_reason: >
        اللقب المختصر (Mansart) هو الأكثر تداولاً في كتب تاريخ العمارة العربية
        والموسوعات للإشارة إلى المعماري. يُستخدم كمدخل مستقل في السياقات التي لا تستدعي
        ذكر الاسم الكامل. يحتاج تشكيلاً لتمييزه من 'مِنصار' العربي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب وحده (Mansart) — يُستخدم في السياقات العلمية والموسوعية المختصرة
        ويكفي للتعريف حيث لا لَبْس، خلافاً للاسم الكامل المستخدم في التعريفات الرسمية والترجمة.
      borrowing_check:
        lexical_borrowing: "معرَّب مقبول — اللقب الفرنسي Mansart بحذف t الأخيرة وفق أعراف التعريب"
        blind_translation: "لا ينطبق — اسم علم"
        calque: "لا ينطبق"
      morphological_fit: >
        نقحرة ثلاثية المقاطع (مَا-ن-سَار) مقبولة الوقع على الأذن العربية،
        قابلة للتعريف بـ ال- (المانسار) والنسبة (مانساري) والتعامل الصرفي المعتاد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَانسَار"

    # ── مرشحات المرحلة ١ ──
    - lemma: "فِرْنسُوا مَانسَار"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة 'فرنسوا' للاسم الأول وإن كانت مسجَّلة في موسوعة الأسماء،
        إلا أن 'فرانسوا' هي الصيغة الأشيع في المصادر المعمارية والتاريخية العربية
        للإحالة على François Mansart تحديداً. إدراج الصيغتين يُفضي إلى ازدواجية
        غير مبررة لنفس العلم الشخصي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مَانسَار"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة 'مانسار' المؤكَّدة أعلاه — لا إجراء إضافي مطلوب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مَانسَارت"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تتضمّن تاء الجمع الفرنسية الصامتة (t) غير المنطوقة؛ التقاليد العربية
        في النقحرة تُهمل الأحرف غير المنطوقة. الصيغة المعيارية العربية هي 'مانسار'
        بلا تاء، وهي الأوسع تداولاً. لا وجود معجمي لـ 'مانسارت' في قواعد البيانات.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-11174345-n"
        pos: proper_noun


