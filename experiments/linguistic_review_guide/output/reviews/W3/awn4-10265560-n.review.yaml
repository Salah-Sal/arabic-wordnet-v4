# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "لفظة «ميزات» في التعريف الحالي ترجمة حرفية ركيكة من features الإنجليزية"
      - "صيغة «يقوم بترتيب» تركيب فعلي ثقيل يفتقر إلى الإيجاز المعجمي"
      - "غياب لمّة تُقابل الإنجليزية landscapist في قائمة اللمّات العربية"
    observations: >
      المجموعة تُصنِّف مهنةً تجمع بين التصميم الهندسي والتنسيق الجمالي في الفضاءات الخارجية.
      اللمّة الأولى «منسق حدائق» تُركّز على الجانب التجميلي التنسيقي، فيما تُبرز الثانية
      «مهندس مناظر طبيعية» البُعد الهندسي التخطيطي. الجمع بينهما في مجموعة واحدة مقبول
      لأن الإنجليزية ذاتها تتراوح بين landscape gardener وlandscape architect.
      يلفت المراجعَ أن العربية تعتمد على مركّبات إضافية لا مفردة أحادية الكلمة، مما يُرجّح
      وجود «فجوة معجمية» في هذا الحقل المهني. جذرا المركّبَين (نسق وهندس+نظر) راسخان
      في التراث العربي، والتركيب الإضافي صيغة منتجة لأسماء المهن.
  blind_candidates:
    - lemma: "مُصَمِّم المَنَاظِر"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُصَمِّم» (ص-م-م وزن مُفَعِّل للتصميم الاحترافي) و«المَنَاظِر»
        (جمع منظر، ن-ظ-ر) — يُعبّر عن الشخص المتخصص في تصميم المناظر الطبيعية بأسلوب جمالي.
        اختُبر السكّ: «مصمم المناظر» وحدة معجمية مرشّحة في ميدان الهندسة المعمارية المفتوحة.
    - lemma: "جَنَّانٌ"
      generation_method: majaz
      justification: >
        إحياء لفظ من جذر ج-ن-ن؛ «الجنة» في العربية = البستان لأن الشجر بورقه يستر، والجنّة
        مشتقة من الاستتار. «جنّان» على وزن فَعَّال (صيغة المبالغة المفيدة للاحتراف) يُلمح إلى
        الشخص الاحترافي المتخصص في الجنات والبساتين وإعدادها. استُعيد هذا اللفظ تجنّبًا
        للاشتراك اللفظي مع المشتقات الحديثة.
    - lemma: "مُنَسِّق الفَضَاء الأَخْضَر"
      generation_method: tarkib
      justification: >
        تركيب إضافي وصفي من «مُنَسِّق» (ن-س-ق: التتابع والانتظام، وزن مُفَعِّل) و«الفضاء
        الأخضر» (اصطلاح شائع في التخطيط العمراني الحديث) — يُبرز دور المتخصص في تنسيق
        الفضاءات الخضراء العامة والخاصة بما يُناسب «landscaper» بمعناه الأشمل.
    - lemma: "مُبَدِّع المَنَاظِر"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُبَدِّع» (ب-د-ع وزن مُفَعِّل) و«المناظر» — يُبرز الجانب الإبداعي
        الفني في تشكيل المناظر الطبيعية بطريقة جذّابة، مُلائماً للمصطلح «landscapist» بمعنى
        الفنان المشتغل بالمناظر.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "منسق حدائق"
      confirm:
        - text: "«النُّونُ وَالسِّينُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَتَابُعٍ فِي الشَّيْءِ. وَكَلَامٌ نَسَقٌ: جَاءَ عَلَى نِظَامٍ وَاحِدٍ قَدْ عُطِفَ بَعْضُهُ عَلَى بَعْضٍ. وَأَصْلُهُ قَوْلُهُمْ: ثَغْرٌ نَسَقٌ، إِذَا كَانَتِ الْأَسْنَانُ مُتَنَاسِقَةً مُتَسَاوِيَةً. وَخَرَزٌ نَسَقٌ: مُنَظَّمٌ»"
          source: "مقاييس اللغة لابن فارس (جذر نسق)"
        - text: "«الحدائق: البساتين»"
          source: "غريب القرآن في شعر العرب لابن عباس (رواية ابن عباس)"
        - text: "«حَدَائِقَ وَأَعْنَاباً: الحدائق البساتين»"
          source: "الإعجاز البياني للقرآن لعائشة عبد الرحمن"
      expands:
        - text: "«الْحَاءُ وَالدَّالُ وَالْقَافُ أَصْلٌ وَاحِدٌ، [وَهُوَ الشَّيْءُ] يُحِيطُ بِشَيْءٍ. يُقَالُ حَدَقَ الْقَوْمُ بِالرَّجُلِ وَأَحْدَقُوا بِهِ. وَالتَّحْدِيقُ: شِدَّةُ النَّظَرِ. وَالْحَدِيقَةُ: الْأَرْ[ضُ الْمُحَاطَةُ بِشَجَرٍ]»"
          source: "مقاييس اللغة لابن فارس (جذر حدق)"
          addition: "يكشف أن «الحديقة» دالّة أصالةً على الأرض المُحاطة بالنبات والشجر، وهي جوهر بيئة عمل منسق الحدائق"

    - lemma: "مهندس مناظر طبيعية"
      confirm:
        - text: "«مهندس المناظر (را. المادة التالية). [translation_en: landscape architect]»"
          source: "المورد الحديث (2008)"
        - text: "«البَسْتنة المَناظرية: فن تخطيط الحدائق وتنسيق الأشجار والينابيع بحيث تخلّف في النفس أثرًا مُستحبًّا [translation_en: landscape gardening]»"
          source: "المورد الحديث (2008)"
        - text: "«هندسة المناظر الحدائقية [translation_en: landscape gardening; domain: Masonry - Carpentry]»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2: بناء - تجارة (1999)"
      expands:
        - text: "«(المهندس) من يُلِمُّ بعلم من العلوم الهندسية، من يمارس فنّاً من الفنون الهندسية»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة)"
          addition: "يُثبت أن «المهندس» في العربية الحديثة يشمل الممارس المتخصص في أي فن هندسي، بما يشمل هندسة المناظر"
        - text: "«المهندس: الذي يقدر الماء ومجاري القني حيث تحفر، وهي فارسية»"
          source: "المحيط في اللغة للصاحب بن عباد"
          addition: "يُبيّن الأصل الوظيفي لـ«المهندس» في التخطيط والقياس، وهو المعنى الجوهري في مصطلح مهندس المناظر"

    - lemma: "مُصَمِّم المَنَاظِر"
      contradicts:
        - text: "«مُصَمِّم المناظر: يضع هيكل المناظر ويشرف على صيانة لوازم الديكور [translation_en: carpenter (audio visual); domain: Information and Communication]»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: >
            المصطلح محجوز في ArabTerm للدلالة على مصمم ديكور السينما والإعلام المرئي لا على
