        - text: "«مُصَمِّم المناظر (سينما) [translation_en: designer; domain: Information and Communication]»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "تأكيد مكرر بنسبة المصطلح إلى السينما"
      expands:
        - text: "«(المصمِّم) الماضي في الأمر بعزيمة ثابتة؛ والسيف القاطع يمر في العظام ويمضي في الضربة»"
          source: "المعجم الوسيط"
          addition: "الدلالة الأصلية لـ«مُصَمِّم» في العربية لا تفيد التصميم الإبداعي الحديث، مما يُضعف انسجامه المعجمي"

    - lemma: "جَنَّانٌ"
      contradicts:
        - text: "«جَنَّان: جارية كانت أديبةً ظريفةً، تعرف الأخبار وتروي الأشعار، وكانت لآل عبد الوهاب بن عبد المجيد الثقفي. أحبّها أبو نواس — [ثم] جَبَلٌ أو وادٍ بنجد»"
          source: "المعجم الكبير (مجمع اللغة العربية بدمشق)"
          conflict: "«جنّان» في أوسع معاجم العربية ورد اسمَ علمٍ لامرأة واسمًا لموقع جغرافي، لا اسمًا للمهنة"
        - text: "«بَسْتَنِيّ؛ جِنانيّ. [translation_en: horticultural]»"
