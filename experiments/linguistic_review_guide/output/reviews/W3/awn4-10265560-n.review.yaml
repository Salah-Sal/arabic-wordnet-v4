# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "منسق حدائق"
      decision: confirmed
      decision_reason: >
        مصطلح ذو بنية إضافية شفّافة من جذرَين راسخَين (ن-س-ق وح-د-ق)، يُعبّر بدقة عن
        الشخص المتخصص في تنسيق الحدائق. لم يُعثر على مدخل معجمي له كمركّب، لكن مكوّنَيه
        موثّقان في أمهات المعاجم، و«مُفَعِّل + مضاف إليه» صيغة إضافية منتجة لأسماء المهن.
        يستوفي المعايير الستة: اطّراد صرفي، يُسر التداول، ملاءمة دلالية، عربي الجذر،
        قابلية اشتقاقية، إيثار للمصطلح التراثي (نسق وحدق). يلزم تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على الوظيفة الجمالية التنسيقية اليومية في نطاق الحديقة المحدودة؛ مرادف وظيفي
        لـ landscape gardener. ينصبّ على عملية ترتيب النباتات والأشجار وتنسيقها الحي،
        لا على التخطيط الهندسي الشامل للمشهد الطبيعي الأوسع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنَسِّق حَدَائِق"

    - lemma: "مهندس مناظر طبيعية"
      decision: confirmed
      decision_reason: >
        مدعوم مباشرةً من المورد الحديث (2008) الذي يُسوّي «مهندس المناظر» بـ landscape architect.
        الصيغة الموجودة أطول لكنها أوضح دلاليًّا. يستوفي المعايير الستة، ويُوافق السياق
        المؤسسي الرسمي (وزارات البيئة، شركات الهندسة). يلزم تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز البُعد الهندسي التخطيطي على نطاق المشهد الطبيعي الواسع بما يتجاوز الحديقة إلى
        التخطيط البيئي الشامل؛ مرادف وظيفي لـ landscape architect. يُلمح إلى تأهيل هندسي
        رسمي وإلى الاشتغال بمشاريع كبرى كالمتنزهات والطرق والمناطق الحضرية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُهَنْدِس مَنَاظِر طَبِيعِيَّة"

    - lemma: "مُهَنْدِس المَنَاظِر"
      decision: confirmed
      decision_reason: >
        مُثبَت مباشرةً في المورد الحديث (2008) مقابلاً صريحًا لـ landscape architect (entry 697581).
        وهو أوجز من «مهندس مناظر طبيعية» وأيسر تداولاً، ويُوصى بإضافته كلمّة مستقلة في
        المجموعة لتغطية المصطلح الجامع. الاكتشاف من مرحلة جمع الأدلة لا من التوليد الأعمى.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        صيغة مختصرة موثّقة معجميًّا تُغطّي كلا البُعدَين (الجمالي والهندسي)؛ تُلائم المصطلح
        الجامع landscaper أو landscape architect بإيجاز أوسع قبولاً في الخطاب المهني العام
        والإعلامي.
      actions:
        - command: create_entry
          params: {lemma: "مُهَنْدِس المَنَاظِر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُصَمِّم المَنَاظِر"
      source: stage1
      decision: removed
      decision_reason: >
        محجوز في ArabTerm للدلالة على مصمم ديكور السينما والإعلام المرئي (carpenter audio visual)،
        مما يُفضي إلى التباس دلالي حاد مع مهندس المناظر الطبيعية. يتعارض استخدامه مع
        مبدأ الاطّراد الاصطلاحي. علاوةً على ذلك «مُصَمِّم» في المعجمية العربية الكلاسيكية
        تعني «الحازم الماضي في أمره» لا المصمِّم الإبداعي، مما يُضعف انسجامه المعجمي.

    - lemma: "جَنَّانٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد «جنّان» في المعاجم بمعنى قائم الحديقة أو مصمم المناظر: ورد في المعجم الكبير
        اسمَ علمٍ لامرأة، وفي المورد الحديث تُستخدم الصيغة «جِنَانيّ» صفةً لا اسمًا للشخص.
        يفشل اختبار التثبيت المعجمي: لا يوجد سكٌّ اصطلاحي مقيَّد لـ«جنّان» بمعنى مهنة
        تصميم الحدائق في أي معجم من المعاجم المستعلَمة.

    - lemma: "مُنَسِّق الفَضَاء الأَخْضَر"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية. يفشل اختبار السكّ الاصطلاحي: يمكن إبدال «الأخضر» بـ«العام» أو
        «الحضري» أو «العمراني» مع بقاء الوصف صالحًا، مما يدل على أنه عبارة وصفية حرة
        لا مصطلح ثابت. كذلك يطول المركّب بحيث يُعسر تداوله الطبيعي في النصوص المتخصصة.

    - lemma: "مُبَدِّع المَنَاظِر"
      source: stage1
      decision: removed
      decision_reason: >
        «مُبَدِّع» دالٌّ على الإبداع الفني العام لا على التخصص المهني في تصميم المناظر؛ يُطبَّق
        على الشعراء والموسيقيين والمعماريين على حدٍّ سواء. لا شواهد معجمية تُثبته في حقل
        الهندسة الحدائقية، ولا تُلبَّى فيه متطلبات الدقة الفصلية للمصطلح التقني.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
