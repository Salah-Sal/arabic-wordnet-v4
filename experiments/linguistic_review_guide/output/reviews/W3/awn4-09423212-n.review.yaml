  definition:
    current: "خليج على الساحل الشمالي لألاسكا حيث تم اكتشاف النفط في عام 1968"
    assessment:
      decision: revise
      reason: "لإضفاء صبغة معجمية موسوعية أدق وربط الموقع بالمعالم الجغرافية والنفطية المرتبطة به."
    authored:
      - type: encyclopedic
        text: "جَوْنٌ أوْ خَلِيجٌ يَقَعُ عَلَى السَّاحِلِ الشَّمَالِيِّ لِوِلَايَةِ أَلَاسْكَا، يَطُلُّ عَلَى بَحْرِ بِيُوفُورت، اشْتُهِرَ بِأَنَّهُ مَرْكَزُ حَقْلِ بْرُودهُو بَاي النِّفْطِيِّ الَّذِي اكْتُشِفَ عَامَ ١٩٦٨م، وَمِنْهُ يَنْطَلِقُ خَطُّ أَنَابِيبِ أَلَاسْكَا."
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09423212-n"
          definition_index: 0
          text: "جَوْنٌ أوْ خَلِيجٌ يَقَعُ عَلَى السَّاحِلِ الشَّمَالِيِّ لِوِلَايَةِ أَلَاسْكَا، يَطُلُّ عَلَى بَحْرِ بِيُوفُورت، اشْتُهِرَ بِأَنَّهُ مَرْكَزُ حَقْلِ بْرُودهُو بَاي النِّفْطِيِّ الَّذِي اكْتُشِفَ عَامَ ١٩٦٨م، وَمِنْهُ يَنْطَلِقُ خَطُّ أَنَابِيبِ أَلَاسْكَا."
