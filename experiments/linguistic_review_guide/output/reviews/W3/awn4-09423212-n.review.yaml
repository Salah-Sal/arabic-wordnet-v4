stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - لا توجد لمات مرادفة أو أشكال بديلة للمصطلح في المجموعة.
    observations: "تعتمد التسمية العربية لهذا الموقع الجغرافي على التعريب الصوتي (transliteration) مضافاً إلى اللفظ الجغرافي العربي (خَلِيج). اللمة الحالية «خليج برودهو» هي الأكثر شيوعاً واستعمالاً في النصوص الجغرافية والاقتصادية العربية المتعلقة بصناعة النفط."
  blind_candidates:
    - lemma: "خَلِيجُ برُودهُو"
      generation_method: tarkib
      justification: "التركيب الإضافي القياسي لتعريب أسماء الخلجان الأجنبية، مع التزام النقل الصوتي للأصل الإنجليزي (Prudhoe)."
    - lemma: "جَوْنُ برُودهُو"
      generation_method: tarkib
      justification: "استخدام مصطلح (جَوْن) وهو مرادف لـ(خليج) في سياقات معينة، لاسيما في المسوحات الجغرافية الدقيقة."
    - lemma: "بْرُودهُو بَاي"
      generation_method: taarib
      justification: "تعريب صوتي مباشر للاسم الإنجليزي بالكامل، يُستخدم أحياناً في المراجع التقنية والنفطية."
    - lemma: "خَلِيجُ بْرُودُو"
      generation_method: tarkib
      justification: "تنويع إملائي صوتي للاسم الأجنبي (Prudhoe) بحذف حرف الهاء الذي قد يُعتبر صامتاً في بعض اللهجات أو النطق."

