        key: note
        value: '{"roots":[{"word":"أبو","root":"أبو","maqayis":"اسم أصيل لا جذر ثلاثي مستقل"},{"word":"الغواصات","root":"غوص","maqayis":"«الْغَيْنُ وَالْوَاوُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى هُجُومٍ عَلَى أَمْرٍ مُتَسَفِّلٍ...»"}]}'

