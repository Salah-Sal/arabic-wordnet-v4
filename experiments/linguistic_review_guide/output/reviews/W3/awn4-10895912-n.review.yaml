    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الكامل للسياقات الرسمية والموسوعية","mwe":true}'

    # بيانات وصفية للمعنى: أَبُو الغَوَّاصَات
    - command: set_metadata
