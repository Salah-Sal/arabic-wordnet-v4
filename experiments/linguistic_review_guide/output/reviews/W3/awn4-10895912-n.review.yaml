# ili: i94610
# pos: n
# lemmas: بوشنل | ديفيد بوشنل
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (بوشنل وديفيد بوشنل) خاليتان من التشكيل الكامل"
      - "لا يوجد مكافئ عربي للّقب الإنجليزي 'Father of the Submarine' رغم وروده لمّةً في OEWN"
      - "التعريف العربي الحالي ترجمةٌ حرفيةٌ متكلّفة: 'بالطاقة البشرية' و'أكسبته الاعتراف كرائد' لا يلائمان أسلوبَ المعجم الوسيط"
      - "موضع التواريخ (1742-1824) في نهاية التعريف يخالف الترتيب المعجمي المعتاد في الأعلام التاريخية"
    observations: >
      المجموعة ترادفية تمثّل شخصاً تاريخياً بعينه هو المخترع الأمريكي ديفيد بوشنل (1742-1824)،
      الذي يُنسب إليه تصميم أول غوّاصة تعمل بالجهد البشري عام 1775. اللمّات الطبيعية لهذه
      المجموعة هي: الاسم الكامل المُعرَّب، والاسم المختصر (الكنية)، فضلاً عن اللقب التكريمي
      المقابل للمّة الإنجليزية "Father of the Submarine". التشكيل الكامل إلزامي لجميع اللمّات
      المؤكدة. التعريف يحتاج صياغة بأسلوب المعجم الوسيط في تعريف الأعلام التاريخية.

  blind_candidates:
    - lemma: "أَبُو الغَوَّاصَات"
      generation_method: tarkib
      justification: >
        لقبٌ تكريميٌّ كنويٌّ إضافي (أبو + الغواصات) يُعبّر عن ريادة هذا الشخص في مجال
        الغواصات، مستوحىً من عبارة التعريف "اعتُرف كرائد للغواصات". يوازي صيغ التكريم
        العربية "أبو الفن/أبو العلم" الشائعة في التراث وفي المصطلح الحديث (أبو الكيمياء،
        أبو الطيران). اختبار السكّ: لا يصحّ إبدال "الغواصات" بمرادف مع الحفاظ على
        الدلالة الاصطلاحية العلمية ذاتها، وهو ما يؤكد تثبيته المعجمي.
    - lemma: "رَائِدُ الغَوَّاصَات"
      generation_method: tarkib
      justification: >
        مركّب إضافي من "رائد" (مشتق من جذر رود على وزن فاعِل) و"الغواصات"، يلتقط دلالة
        "submarine pioneer" الواردة في التعريف. أقل ثباتاً من الصيغة الكنوية لأنه وصفي
        عام يصلح لأي رائد في المجال.
    - lemma: "مُبتكِرُ الغَوَّاصَة"
      generation_method: tarkib
      justification: >
        مركّب إضافي من "مبتكر" (مشتق من جذر بكر على وزن مُفتَعِل) و"الغواصة"، يلتقط
        دلالة "inventor" الواردة في التعريف. عبارة وصفية محتملة لكن يُنتظر أن تكون غير
        مسكوكة لهذا الشخص بعينه.
    - lemma: "بُوشْنِل"
      generation_method: taarib
      justification: >
        استنتاج افتراضي من قرينتين: إشارة التعريف إلى تواريخ حياة محددة (1742-1824)
        وعام اختراع بعينه (1775)، مما يدلّ على شخص تاريخي بعينه. يُرجَّح أن يكون اسمه
        معرَّباً من الإنجليزية. الصيغة المقترحة تحاكي نطق Bushnell وفق قواعد التعريب
        الصوتية العربية المعيارية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # ملاحظة منهجية: لم يُعثر على مداخل لاسم بوشنل في قاعدة البيانات العربية
  # (متوقَّع: الاسم علمٌ لشخص غربي لا يرد في المعاجم العربية الكلاسيكية أو الحديثة)
  # الاستعلامات المُنفَّذة:
  #   ١. مطابقة دفعية: بوشنل، ديفيد بوشنل، بوشنيل، ديفيد بوشنيل، أبو الغواصات، رائد الغواصات
  #   ٢. الجسر الإنجليزي: Bushnell, David Bushnell, submarine pioneer, Father of the Submarine
  #   ٣. FTS عربي: غواصة، رائد، مخترع، غواصات
  #   ٤. مقاييس اللغة: جذر غوص

  per_lemma:
    - lemma: "بوشنل"
      evidence_status: "no_material_found"

    - lemma: "ديفيد بوشنل"
      evidence_status: "no_material_found"

    - lemma: "أَبُو الغَوَّاصَات"
      expands:
        - text: "«غَوَّاصة: submarine»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "يثبت أن 'غواصة' هو المقابل العربي المعياري لـ submarine في المعاجم الموحدة، مما يدعم بناء اللقب 'أبو الغواصات'"
        - text: "«غواصة: submarine»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "تأكيد إضافي على ثبات مصطلح 'غواصة' في المعجمية العربية الحديثة"

    - lemma: "رَائِدُ الغَوَّاصَات"
      expands:
        - text: "«رائد: pioneer (في اتجاه فني)»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "يؤكد أن 'رائد' المقابل الأقرب لـ pioneer، لكن المركّب 'رائد الغواصات' غير مثبت لقباً لبوشنل بعينه"
        - text: "«رائد: pioneer»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "يثبت شيوع استعمال 'رائد' في المعجمية العربية بمعنى pioneer، لكن في تراكيب مختلفة"

    - lemma: "مُبتكِرُ الغَوَّاصَة"
      expands:
        - text: "«مبتكر: innovator»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يؤكد دلالة الابتكار، لكن 'مبتكر الغواصة' لم يرد مسكوكاً لقباً لهذا الشخص بعينه في أي مصدر"

    - lemma: "بُوشْنِل"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "بوشنل"
      decision: confirmed
      decision_reason: >
        الشكل المختصر (الاسم الأخير وحده) هو الصورة الاختزالية الثابتة للإحالة إلى الشخص
        في السياقات المرجعية الموجزة. التعريب الصوتي مقبول ومطّرد (Bush=بُوش، nell=نِل).
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الشكل المختصر (الاسم الأخير وحده) يُستخدم في الإحالات الموجزة والسياقات المرجعية السريعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُوشْنِل"

    - lemma: "ديفيد بوشنل"
      decision: confirmed
      decision_reason: >
        الاسم الكامل (الأول والأخير) هو المدخل الرئيسي في الموسوعات والمعاجم التاريخية؛
        لا غنى عنه لتمييز صاحب الترجمة عن آخرين قد يشاركونه الاسم الأخير. التعريب
        الصوتي: David=دَيْفِيد (بالياء لتمثيل الصوت المطوّل)، Bushnell=بُوشْنِل.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الاسم الكامل يُستخدم في السياقات الموسوعية والتاريخية الرسمية التي تستوجب التحديد التام وتجنّب الاشتراك"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَيْفِيد بُوشْنِل"

    # ── مرشحات المرحلة ١ ──

    - lemma: "أَبُو الغَوَّاصَات"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل اللمّة الإنجليزية "Father of the Submarine" الواردة في OEWN. اللقب الكنوي
        مثبَّت في التقليد التسمياتي العربي (أبو X لمن يُعدّ مؤسس مجال X). مصطلح 'غواصة'
        ثابت في المعجمية العربية الحديثة (معاجم ALECSO). اختبار التثبيت المعجمي:
        المركّب محدّد بشخص بعينه ولا يصلح لغيره بالدلالة ذاتها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "اللقب التكريمي الريادي يُستخدم للتأكيد على مكانة بوشنل بوصفه مؤسس علم الغواصات؛ يحمل طابعاً تاريخياً وتكريمياً أقوى من الاسمين الآخرين"
      actions:
        - command: create_entry
          params:
            lemma: "أَبُو الغَوَّاصَات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رَائِدُ الغَوَّاصَات"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حر لا يرقى إلى مستوى اللقب المسكوك. يجتاز اختبار الاستبدال: يمكن
        القول "رائد الطيران/رائد الفضاء" بالبنية ذاتها لأشخاص آخرين دون تغيير جوهري.
        لم يثبت استعماله لقباً خاصاً ببوشنل في المصادر العربية.

    - lemma: "مُبتكِرُ الغَوَّاصَة"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تصف أي مخترع لغواصة. تجتاز اختبار الاستبدال بسهولة ('مصمّم
        الغواصة'، 'صانع الغواصة' متكافئة). لم يثبت استعماله لقباً خاصاً ببوشنل.

    - lemma: "بُوشْنِل"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة 'بوشنل' بعد التشكيل. الإضافة ستكون تكراراً بلا قيمة مضافة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مخترع أمريكي صمم في عام 1775 غواصة تعمل بالطاقة البشرية لم تكن فعالة لكنها أكسبته لاحقاً الاعتراف كرائد للغواصات (1742-1824)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية بأسلوب متكلّف: (١) 'بالطاقة البشرية'
        غريب — الأصحّ 'بالجَهد البشري'؛ (٢) 'أكسبته لاحقاً الاعتراف كرائد' متعسَّف —
        الأولى 'نالَ بها لقبَ رائد الغواصات'؛ (٣) وضع التواريخ في النهاية يخالف الأسلوب
        الموسوعي العربي الذي يُقدّم التواريخ في بداية الترجمة.
    authored:
      - type: encyclopedic
        text: "مُخترِعٌ أمريكيٌّ (1742-1824)، صمَّمَ عامَ 1775 أولَ غوَّاصةٍ تعملُ بالجَهدِ البشريِّ؛ وإن أخفقت في مهامِّها العسكرية، فقد نالَ بها لقبَ رائد الغوَّاصات."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُخترِعٌ أمريكيٌّ (1742-1824)، صمَّمَ عامَ 1775 أولَ غوَّاصةٍ تعملُ بالجَهدِ البشريِّ؛ وإن أخفقت في مهامِّها العسكرية، فقد نالَ بها لقبَ رائد الغوَّاصات."

  examples:
    per_lemma:
      - lemma: "بُوشْنِل"
        examples:
          - text: "يُعدُّ بُوشْنِل من أبرز رواد الهندسة البحرية في القرن الثامن عشر الميلادي."
            type: usage
      - lemma: "دَيْفِيد بُوشْنِل"
        examples:
          - text: "طوَّرَ دَيْفِيد بُوشْنِل مركبتَه الغاطسة المعروفة بـ'السلحفاة' (Turtle) إبّان الحرب الثورية الأمريكية."
            type: usage
      - lemma: "أَبُو الغَوَّاصَات"
        examples:
          - text: "خلَّد المؤرخون البحريون ذكرى بُوشْنِل بوصفه أبا الغوَّاصات، تكريماً لسبقه في تصميم أول مركبة تغوص تحت الماء."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدُّ بُوشْنِل من أبرز رواد الهندسة البحرية في القرن الثامن عشر الميلادي."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "طوَّرَ دَيْفِيد بُوشْنِل مركبتَه الغاطسة المعروفة بـ'السلحفاة' (Turtle) إبّان الحرب الثورية الأمريكية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "خلَّد المؤرخون البحريون ذكرى بُوشْنِل بوصفه أبا الغوَّاصات، تكريماً لسبقه في تصميم أول مركبة تغوص تحت الماء."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:
  per_entry:
    # اللمّتان الأوليان أعلامٌ معرَّبة من الإنجليزية؛ لا جذر عربي ولا مقاييس ينطبقان عليهما
    - lemma: "بُوشْنِل"
      entry_id: "{auto}"

    - lemma: "دَيْفِيد بُوشْنِل"
      entry_id: "{auto}"

    # اللمّة الثالثة مركّب عربي أصيل له جذور في مقاييس اللغة
    - lemma: "أَبُو الغَوَّاصَات"
      entry_id: "{auto}"
      roots:
        - word: "أبو"
          root: "أبو"
          maqayis_quote: "اسم أصيل (أب) لا جذر ثلاثي اشتقاقي مستقل له في مقاييس ابن فارس؛ وردَ ضمن مادة أخرى بوصفه اسماً مفرداً"
        - word: "الغَوَّاصَات"
          root: "غوص"
          maqayis_quote: "«الْغَيْنُ وَالْوَاوُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى هُجُومٍ عَلَى أَمْرٍ مُتَسَفِّلٍ مِنْ ذَلِكَ الْغَوْصُ: الدُّخُولُ تَحْتَ الْمَاءِ. وَالْهَاجِمُ عَلَى الشَّيْءِ غَائِصٌ. وَغَاصَ عَلَى الْعِلْمِ الْغَامِضِ حَتَّى اسْتَنْبَطَهُ.»"

  per_sense:
    - lemma: "بُوشْنِل"
      sense_id: "{auto}"
      nuance: "الشكل المختصر (الاسم الأخير وحده) للإحالة الموجزة في السياقات المرجعية السريعة"

    - lemma: "دَيْفِيد بُوشْنِل"
      sense_id: "{auto}"
      nuance: "الاسم الكامل للشخص يُستخدم في السياقات الموسوعية والتاريخية الرسمية التي تستوجب التحديد التام وتجنّب الاشتراك مع أشخاص آخرين"
      mwe: true

    - lemma: "أَبُو الغَوَّاصَات"
      sense_id: "{auto}"
      nuance: "اللقب التكريمي الريادي يُستخدم للتأكيد على مكانة بوشنل التأسيسية في علم الغواصات؛ يحمل طابعاً تاريخياً وتكريمياً أقوى من الاسم العلمي المجرّد"
      mwe: true

  synset:
    cultural_fit: omission

  actions:
    # بيانات وصفية لمدخل بُوشْنِل (علمٌ معرَّب)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"type":"proper_noun_transliteration","lang_origin":"en","original":"Bushnell"}'

    # بيانات وصفية لمدخل دَيْفِيد بُوشْنِل (علمٌ معرَّب مركّب)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
