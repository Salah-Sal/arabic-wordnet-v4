# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل المطلوب في قاعدة البيانات"
      - "المجموعة تجمع مفهومَيْن مرتبطَيْن لكن متمايزَيْن مهنياً: الإحصائيّ (statistician) والخبير الاكتواري (actuary)؛ وليسا مترادفَيْن تامَّيْن في السياق التخصصي"
      - "لمّة «خبير اكتواري» تتضمن «اكتواري» وهي كلمة معرَّبة من اللاتينية (actuarius)؛ يستوجب التحقق من مدى تثبيتها المعجمي"
      - "التعريف العربي الحالي يستخدم «متمكن من» وهي صياغة أقل دقةً من الأسلوب المعجمي المعتاد"
      - "التعريف يُعيد صياغة النص الإنجليزي حرفياً دون إعادة تأليف بأسلوب المعجم العربي"
    observations: >
      المجموعة تصف الشخص المتخصص في الإحصاء الرقمي، مع إشارة خاصة لمن يحسب أقساط التأمين.
      الجمع بين الإحصائيّ والخبير الاكتواري في مجموعة واحدة مبرَّر من ناحية التصنيف اللغوي العام
      (كلاهما يعمل بالأرقام والبيانات)، لكنه يُضعف الدقة التخصصية. جذر «أَحْصَى» عريق
      في العربية (قرآني: «أَحْصَاهُ اللَّهُ وَنَسُوهُ»)، ويُعطي «إِحْصَائِيّ» شرعية اشتقاقية
      راسخة. أما «خبير اكتواري» فمركب وصفي حديث استقر في المعاجم التخصصية المتعددة.

  blind_candidates:
    - lemma: "إِحْصَائِيّ"
      generation_method: ishtiqaq
      justification: >
        مشتق من «أَحْصَى» (الفعل الرباعي) على صيغة النسب الصناعي إلى المصدر «الإحصاء»؛
        يُعبِّر بدقة عن المتخصص في جمع البيانات العددية وتفسيرها. الوزن: فِعْلِيّ (إِحْصَائِيّ ← إحصاء + ياء النسب)،
        يناسب الدلالة على المنسوب إلى علم بعينه (كالطبيّ والقانونيّ).
    - lemma: "أَكْتُوَارِيّ"
      generation_method: taarib
      justification: >
        تعريب للمصطلح اللاتيني «actuarius» الذي يُعني القائم على السجلات والحسابات؛ يُعبِّر
        تحديداً عن المتخصص في حسابات التأمين والمخاطر المالية. الصيغة تقبل لام التعريف
        (الأكتواريّ) والنسبة والجمع السالم (أكتواريون)، وقد استُخدم الجذر التعريبي «كتو» في
        مشتقات موثقة معجمياً كـ«اكتواريّ» (صفة).
    - lemma: "مُحْصٍ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «أَحْصَى» (أَحْصَى الشيءَ: عدَّه وأطاقه)؛ يُعبِّر عن الفاعلية في
        عملية الإحصاء والعدّ. الوزن مُفْعِل ← مُفْعٍ (للثلاثي المعتل الآخر) يُناسب دلالة
        الفاعل المستمر في الصنعة.
    - lemma: "خَبِيرُ الإِحْصَاء"
      generation_method: tarkib
      justification: >
        مركب إضافي (مضاف ومضاف إليه) يضم «خَبِير» (صيغة مبالغة من خَبِرَ: علِم) و«الإِحْصَاء»
        (مصدر أحصى)؛ يُعبِّر عن المتمكن المتعمق في علم الإحصاء. النمط الإضافي شائع في
        التسميات المهنية العربية المعاصرة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "إحصائي"
      confirm:
        - text: "«الإحصائيّ: الخبير في الإحصاء.»"
          source: "المورد الحديث (2008) — ARABTERM | entry_id: 719833 | translation_en: statistician"
        - text: "«إِحْصَائِيّ»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — ARABTERM | entry_id: 465539 | translation_en: statistical"
      expands:
        - text: "«(1) إحصائيّ (2) المُفْرَدة: بَنْدٌ إحصائيّ مُفْرَد (3) علم الإحصاء.»"
          source: "المورد الحديث (2008) — ARABTERM | entry_id: 719831 | translation_en: statistic"
          addition: >
            يُثبت أن «إحصائيّ» متعدد الدلالات (صفة/علم/مفردة إحصائية)؛ مما يُوضح لماذا
            يلزم السياق لتخصيص المعنى المقصود (الشخص المتخصص).

    - lemma: "خبير اكتواري"
      confirm:
        - text: "«خبير التأمين.»"
          source: "المورد الحديث (2008) — ARABTERM | entry_id: 668872 | translation_en: actuary"
      expands:
        - text: "«خبير حسابيّ: محلل حسابات يعتمد على قواعد الرياضيات والإحصاء والاقتصاد لاستشراف احتمالات مخاطر مستقبل الالتزامات المالية بالنسبة لشركات التامين وصناديق معاشات التقاعد والضمان الاجتماعي والمصارف وما شابه.»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM | entry_id: 411632 | translation_en: actuary"
          addition: >
            يُثبت أن «خبير حسابيّ» هو المصطلح القياسي في معاجم التجارة والقانون للمعنى ذاته
            (actuary)، ويمنح تعريفاً موسوعياً دقيقاً يصلح لإثراء تعريف المجموعة.
        - text: "«اختصاصي الحسابات الاكتوارية»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM | entry_id: 536890 | translation_en: actuary"
          addition: "يُثبت أن «اكتواري» مُضاف ومُثبَّت في المعجمية الطبية التخصصية كصفة راسخة."
        - text: "«تَحْليلٌ اِكْتِوَاري»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM | entry_id: 536889 | translation_en: actuarial analysis"
          addition: "يُثبت استخدام «اكتواري» صفةً نسبية في المصطلح الطبي المتخصص."
        - text: "«أرصدة إكتوارية، احتياطات إكتوارية»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM | entry_id: 402840 | translation_en: actuarial"
          addition: "يُثبت شيوع الصفة «إكتواري/اكتواري» في السياق المالي والتجاري."
        - text: "«خبير حسابات تأمين»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000) — ARABTERM | entry_id: 441090 | translation_en: actuary"
          addition: "بديل مركب آخر لـ actuary موثق في معاجم متخصصة."

    - lemma: "إِحْصَائِيّ"
      source: stage1
      confirm:
        - text: "«الإحصائيّ: الخبير في الإحصاء.»"
          source: "المورد الحديث (2008) — ARABTERM | entry_id: 719833 | translation_en: statistician"

    - lemma: "أَكْتُوَارِيّ"
      source: stage1
      expands:
        - text: "«اختصاصي الحسابات الاكتوارية»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM | entry_id: 536890 | translation_en: actuary"
          addition: >
            يُثبت «اكتواري» كصفة نسبية راسخة لكنها لا تستعمل وحدها اسماً للشخص؛
            إذ يحتاج دائماً إلى موصوف (خبير، اختصاصي، إلخ).

    - lemma: "مُحْصٍ"
      source: stage1
      contradicts:
        - text: "«مُحْصٍ: من (ح ص ي) عارف قدر الشيء وحافظ الكتاب.»"
          source: "موسوعة السلطان قابوس لأسماء العرب | entry_id: 943277"
          conflict: >
            «مُحْصٍ» في التراث اسمٌ إلهي كريم (من أسماء الله الحسنى) يُعبِّر عن
            الإحصاء الإلهي الشامل؛ استخدامه اسماً لشخصٍ بشري يُحدث تداخلاً مع الاستخدام
            الديني الراسخ، ويجعله غير صالح كمصطلح دنيوي.

    - lemma: "خَبِيرُ الإِحْصَاء"
      source: stage1
      confirm:
        - text: "«خبير احصاء»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM | entry_id: 410561 | translation_en: statistician"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١: إحصائي ──
    - lemma: "إحصائي"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة بشواهد معجمية صريحة (المورد الحديث: «الخبير في الإحصاء» =
        statistician). الجذر «أَحْصَى» قرآني الأصل عريق في العربية. الوزن النسبي «إِحْصَائِيّ»
        مُطَّرد ومقيس. اللمّة تفتقر إلى التشكيل الكامل فتستوجب تحديثاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check:
        pattern: "فِعْلِيّ (نسبة إلى المصدر إِحْصَاء)"
        root: "حصو/حصي"
        functional_fit: "يُناسب الدلالة على المنتسب إلى علم بعينه — مُطَّرد ومقيس"
      borrowing_check:
        type: ishtiqaq
        verdict: "عربي أصيل مُشتق اشتقاقاً صحيحاً"
      term_quality:
        ittirrad: "مُطَّرد — قياسه جارٍ في العربية (طبيّ، قانونيّ، إحصائيّ)"
        yusr: "يسير التداول — مقطع واحد متجانس"
        mulaema: "ملائم دلالياً وصوتياً"
        ithara_turathi: "الجذر «أحصى» قرآني (المزمل: 20، المجادلة: 6)"
        ithara_arabi: "عربي خالص"
        ishtiqaqiyya: "قابل للاشتقاق: إحصاء، إحصائيات، إحصائيًّا"
      nuance_differentiation: >
        أعمُّ وأشمل من خبير اكتواري؛ يُطلق على كل من يشتغل بعلم الإحصاء في أي مجال
        (ديموغرافيا، اقتصاد، صحة عامة، بحوث). لا يقتصر على سياق التأمين.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِحْصَائِيّ"

    # ── اللمّة الموجودة ٢: خبير اكتواري ──
    - lemma: "خبير اكتواري"
      decision: confirmed
      decision_reason: >
        المركب «خبير اكتواري» مُثبَّت في المعاجم التخصصية (طبي، قانوني، تجاري) بمعنى
        actuary. «اكتواري» صفة نسبية معرَّبة استقرت استقراراً معجمياً واسعاً. اللمّة
        تفتقر إلى التشكيل الكامل فتستوجب تحديثاً. فحص MWE: «اكتواري» لا يمكن إبداله
        بحرية بصفة أخرى دون تغيير المفهوم (خبير ماليّ ≠ خبير اكتواريّ) — يجتاز الاختبار.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      morphological_check:
        pattern: "اسم (خَبِير: صيغة مبالغة من خَبِرَ) + نسبة تعريبية (اكتواريّ)"
        functional_fit: "المركب الوصفي (موصوف + صفة) مُطَّرد في المصطلح العربي الحديث"
      borrowing_check:
        type: taarib
        verdict: >
          «اكتواري» تعريب مقبول من اللاتينية «actuarius»؛ يقبل الإعراب الكامل
          والجمع (اكتواريون) والنسبة (اكتوارية). المصطلح مُتثبَّت في معجمين طبيين
          وقانوني وتجاري — يرقى إلى درجة الاستقرار المعجمي.
      term_quality:
        ittirrad: "المركب الوصفي مُطَّرد"
        yusr: "يسير النطق والكتابة"
        mulaema: "ملائم تخصصياً"
        ithara_turathi: "خبير له أصل عربي عريق (خ ب ر)"
        ithara_arabi: "المكوّن الأول عربي، الثاني معرَّب مستقر"
        ishtiqaqiyya: "يشتق منه: الاكتوارية (علم)، الحسابات الاكتوارية"
      nuance_differentiation: >
        أخص من إحصائيّ؛ يُقتصر استخدامه على من يطبق الرياضيات والإحصاء لحساب
        مخاطر التأمين وأقساطه وصناديق التقاعد والالتزامات المالية الآجلة — دوره
        حسابي تنبؤي ماليّ بخلاف الإحصائيّ الذي قد يكون بحثياً وصفياً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَبِيرٌ اكْتُوَارِيّ"

    # ── مرشح المرحلة ١ — إحصائي (تطابق مع موجود) ──
    - lemma: "إِحْصَائِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق هذا المرشح مع اللمّة الموجودة «إحصائي» التي أُكِّدت وعُولجت أعلاه.
        لا حاجة إلى إنشاء مدخل جديد.

    # ── مرشح المرحلة ١ — أكتواري ──
    - lemma: "أَكْتُوَارِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا يصح استخدام «أكتواريّ» وحده اسماً لشخص دون موصوف (خبير، اختصاصي).
        الأدلة تُثبت «اكتواري» صفةً نسبية تلتزم الجري مع الموصوف، ولا تستقل مصطلحاً
        بذاتها. الصيغة الصحيحة هي «خبير اكتواريّ» (موجودة بالفعل).

    # ── مرشح المرحلة ١ — مُحْصٍ ──
    - lemma: "مُحْصٍ"
      source: stage1
      decision: removed
      decision_reason: >
        «مُحْصٍ» من أسماء الله الحسنى الراسخة في التراث الديني الإسلامي؛ استعماله
        اسماً لشخصٍ بشري يُوقع في التداخل مع المقدس ويُنفِّر القارئ. فضلاً عن ذلك
        لا يُجسِّد المعنى التخصصي (البيانات الرقمية، أقساط التأمين) بما فيه الكفاية.

    # ── مرشح المرحلة ١ — خبير الإحصاء ──
    - lemma: "خَبِيرُ الإِحْصَاء"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق «خبير احصاء» في ARABTERM بمعنى statistician (entry_id 410561)،
        إلا أن اللمّة مكرِّرة لـ«إِحْصَائِيّ» المؤكَّدة دلالياً. اختبار الاستبدال:
        «إحصائيّ» و«خبير الإحصاء» قابلان للتبادل في أغلب السياقات — لا فرق nuance
        وظيفياً يبرر الإضافة. الاقتصاد اللغوي يُوجِّه إلى الاحتفاظ بالأقصر (إحصائيّ).


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
