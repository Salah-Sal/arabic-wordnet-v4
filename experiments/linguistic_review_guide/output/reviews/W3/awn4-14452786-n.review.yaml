# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14452786-n
# rating: standing or position on a scale
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تصنيف» دلالتها الأساسية هي التمييز والتبويب (classification) لا الموقع على مقياس (rating)"
      - "اللمّة «تقييم» تدل على عملية تحديد القيمة (evaluation/assessment) وليست نتيجة الموقع على سلّم"
      - "اللمّتان تفتقران إلى التشكيل الكامل"
    observations: "المجموعة تعبّر عن مفهوم المكانة أو الموقع المُحدَّد على مقياس مُدرَّج، وهو أقرب إلى نتيجة التقدير منه إلى عملية التصنيف أو التقييم ذاتها. الأعلى المباشر هو «سمعة/مكانة» مما يؤكد أن المقصود هو الوضع النهائي لا الفعل. يحتاج الأمر إلى لمّات تدل على الموقع المُعيَّن على سلّم تراتبي."
  blind_candidates:
    - lemma: "تَقْدِير"
      generation_method: ishtiqaq
      justification: "من جذر ق د ر على وزن تَفْعِيل، يدل على مبلغ الشيء ومقداره. يُستعمل في التعليم والصناعة للدلالة على الدرجة المعيَّنة على مقياس (تقدير ممتاز، تقدير جيد)."
    - lemma: "دَرَجَة"
      generation_method: ishtiqaq
      justification: "من جذر د ر ج على وزن فَعَلَة، تدل على المرتبة والمنزلة على سلّم مُدرَّج. مستعملة في «سلّم الدرجات» (rating scale)."
    - lemma: "مَرْتَبَة"
      generation_method: ishtiqaq
      justification: "من جذر ر ت ب على وزن مَفْعَلَة، تدل على المنزلة والمكانة. الوسيط: «المنزلة والمكانة»."
    - lemma: "رُتْبَة"
      generation_method: ishtiqaq
      justification: "من جذر ر ت ب على وزن فُعْلَة، تدل على المنزلة الرفيعة ودرجة الشرف. الوسيط: «المنزلة والمكانة، أو المنزلة الرفيعة»."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تَصْنِيف"
      confirm:
        - text: "«التصنيف: تمييز الأشياء بعضها عن بعض، ومنه تصنيف الكتب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«تقسيم المنتجات المختلفة حسب أسس أو معايير معينة»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
        - text: "«تقدير، تصنيف» = rating"
          source: "المعجم الموحد لمصطلحات علوم البحار"
      contradicts:
        - text: "«التَّصْنِيفُ: تَمْيِيزُ الْأَشْيَاءِ بَعْضِهَا عَنْ بَعْضٍ» — المعنى الأساسي هو الفرز والتبويب"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الدلالة الأصلية هي التمييز والفرز لا تعيين الموقع على مقياس"
      expands:
        - text: "«شهادة تصنيف» = rating certificate"
          source: "المعجم الموحد لمصطلحات علوم البحار"
          addition: "يُستعمل تصنيف بمعنى rating في السياق البحري والمالي (التصنيف الائتماني)"
        - text: "«تصنيف» = grading (مجال الفن والتسلية والرياضة)"
          source: "مسرد الفن والتسلية والرياضة — أليكسو"
          addition: "يدل على الترتيب التصاعدي في المجال الرياضي"

    - lemma: "تَقْيِيم"
      confirm:
        - text: "«تَقْيِيم: تحديد اختباري للعلاقة بين الكمية المطلوب قياسها والإشارة التي تعطيها الأداة أو الآلة أو طريقة القياس» = rating"
          source: "المعجم الموحد لمصطلحات المياه"
        - text: "«تقييم: جزء من نظام التوصية يُعيّن ترتيبًا لكل عنصر» = Scoring"
          source: "معجم البيانات والذكاء الاصطناعي"
      contradicts:
        - text: "«تَقْيِيم — الجذر: ق ي م — مرفوضة. الصواب والرتبة: تَقويم السلعة [فصيحة] — تقييم السلعة [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "الأصوب لغوياً تقويم لا تقييم، وإن أُجيزت تقييم"
      expands:
        - text: "«تقييم: تحديد دقيق لنشاط ما وفق معايير محددة» = appraisal"
          source: "مسرد الإعلام والتواصل — أليكسو"
          addition: "دلالة التقييم أوسع: تشمل تحديد القيمة والحكم على الجودة"

    - lemma: "تَقْدِير"
      confirm:
        - text: "«تقدير» = rating (مجال التربية)"
          source: "مسرد التربية — أليكسو"
        - text: "«تقدير» = rating (مجال النفط)"
          source: "المعجم الموحد لمصطلحات النفط"
        - text: "«تقدير، تصنيف» = rating (مجال علوم البحار)"
          source: "المعجم الموحد لمصطلحات علوم البحار"
        - text: "«تقدير مستوى النضج» = maturity rating"
          source: "مسرد التربية — أليكسو"
      expands:
        - text: "«الْقَافُ وَالدَّالُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَبْلَغِ الشَّيْءِ وَكُنْهِهِ وَنِهَايَتِهِ. فَالْقَدْرُ: مَبْلَغُ كُلِّ شَيْءٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على تحديد المبلغ والمقدار وهو أساس مفهوم الموقع على مقياس"

    - lemma: "دَرَجَة"
      confirm:
        - text: "«سلم الدرجات» = rating scale"
          source: "مسرد التربية — أليكسو"
      contradicts:
        - text: "«الدَّرَجَةُ: الأَدْرَجَةُ، وهى المِرْقاةُ» — المعنى الأصلي هو عتبة السلّم الحسّي"
          source: "المعجم الكبير"
          conflict: "درجة أعمّ من rating؛ هي الوحدة على المقياس لا الموقع المُعيَّن ذاته"

    - lemma: "مَرْتَبَة"
      contradicts:
        - text: "«المِرْتَبَةُ: القَطِيفَةُ ذاتُ الخَمْلِ» — معنى مختلف تماماً"
          source: "المعجم الكبير"
          conflict: "الوزن مِفْعَلة يحمل دلالة الفراش لا المنزلة"

    - lemma: "رُتْبَة"
      confirm:
        - text: "«الرُّتْبَةُ: المنزلة والمكانة، أو المنزلة الرفيعة. درجةٌ من درجات الشرف تمنحها الدولة من ترى تكريمه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الرَّتَبُ: مَا أَشْرَفَ مِنَ الْأَرْضِ كَالدَّرَجِ. تَقُولُ: رَتَبَةٌ وَرَتَبٌ، كَقَوْلِكَ دَرَجَةٌ وَدَرَجٌ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "رتبة أخصّ من rating؛ تدل على رتبة شرفية أو عسكرية لا موقع على مقياس عام"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تَصْنِيف"
      decision: confirmed
      decision_reason: "رغم أن الدلالة الأصلية هي التبويب والفرز، فقد استقر استعمال «تصنيف» بمعنى rating في الاستخدام المعاصر، خاصة في السياق المالي (التصنيف الائتماني) والرياضي (تصنيف الفيفا) والبحري (شهادة التصنيف). معجم علوم البحار يقرن مباشرة: تقدير، تصنيف = rating."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل للدلالة على الموقع النهائي ضمن فئة أو درجة محددة على سلّم تراتبي، غالباً في السياق الرسمي والمؤسسي (التصنيف الائتماني، تصنيف الجامعات)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصْنِيف"

    - lemma: "تَقْيِيم"
      decision: confirmed
      decision_reason: "تقييم مُجاز في الاستعمال الحديث رغم ملاحظة معجم الصواب أن الأصل تقويم. عدة معاجم مصطلحية حديثة تُقابله بـ rating مباشرة (معجم المياه). دلالته أقرب إلى الحكم القيمي المُعبَّر عنه بدرجة على مقياس."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركّز على الجانب التقويمي والحُكمي للموقع على المقياس، أي أنه ناتج عملية تحديد القيمة أو الجودة. أقرب إلى evaluation rating منه إلى positional ranking."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْيِيم"

    - lemma: "تَقْدِير"
      source: stage1
      decision: confirmed
      decision_reason: "مقابل مباشر لـ rating في معاجم التربية والنفط والبحار. الجذر ق د ر يدل على مبلغ الشيء وتحديد مقداره. شائع في الاستعمال التعليمي (تقدير ممتاز، تقدير جيد) للدلالة على الموقع على سلّم الدرجات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على الموقع المُقدَّر على مقياس كمّي أو نوعي، خاصة في السياق التعليمي والتقني. يختلف عن تصنيف بأنه يُعبَّر عنه عادةً بقيمة عددية أو وصفية (تقدير A، تقدير ممتاز) لا بفئة تصنيفية."
      actions:
        - command: create_entry
          params: {lemma: "تَقْدِير", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "دَرَجَة"
      source: stage1
      decision: removed
      decision_reason: "درجة مفهوم أعمّ يدل على الوحدة على المقياس (degree/grade) لا على الموقع المُعيَّن ذاته (rating). هي مكوّن المقياس لا نتيجة القياس. ينتمي لمجموعة ترادفية أخرى."

    - lemma: "مَرْتَبَة"
      source: stage1
      decision: removed
      decision_reason: "المرتبة بضم الميم تدل على الفراش في المعجم الكبير، وبفتحها (مَرْتَبَة) فيها لبس. كما أنها أخصّ من المطلوب: تدل على رتبة هرمية ثابتة لا على موقع متغير على مقياس."

    - lemma: "رُتْبَة"
      source: stage1
      decision: removed
      decision_reason: "الرتبة تدل على منزلة شرفية أو عسكرية أو إدارية ثابتة. وهي أخصّ من مفهوم rating العام الذي يشمل أي موقع على أي مقياس، لا الرتب المؤسسية فحسب."


