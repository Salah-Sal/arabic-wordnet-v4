# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "فائز مطعون في فوزه"
      decision: confirmed
      decision_reason: >
        رغم كونها عبارةً وصفية لا وحدةً معجمية مسكوكة، تُمثّل هذه الصياغة الأسلوبَ الشائع في اللغة القانونية العربية لوصف هذا المفهوم. لا يوجد مصطلحٌ أحادي الكلمة راسخٌ في المعجمية العربية يقابل 'contestee'، مما يجعل العبارة الإضافة الأنسب حفاظاً على الاكتمال الدلالي. يُحتفَظ بها مع إضافة التشكيل الكامل وحذف 'فائز' الزائد من الصدر — لأن الإبقاء على 'مطعون في فوزه' يُوفّر الجنس (الفائز) ضمنياً، في حين أن 'فائز' الصريحة تُضاعف المفهوم بلا فصل نوعي. غير أن حذف 'فائز' يُخاطر بالتباس مع طاعون الموتى (مطعون = مصابٌ بالطاعون)، لذا يُبقى مع إضافة التشكيل ليُفرَّق بين 'مَطعُون' (challenged) و'مَطعُون' (plague-stricken).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      substitution_test: "يمكن القول 'فائز محتجٌّ على فوزه' أو 'فائز متنازَعٌ في فوزه' بنفس المعنى → العبارة وصفية لا مسكوكة صرفاً؛ لكنها الأسلوب المعتاد إذ لا بديل مفرد راسخ."
      borrowing_check:
        lexical_borrowing: "لا اقتراض لفظي."
        blind_calque: "العبارة ترجمة حرفية لـ'a winner whose victory is contested'؛ الترجمة وافيةٌ دلالياً ومناسبة تركيبياً للعربية."
        conceptual_calque: "مفهوم خاص بالأطر القانونية-الانتخابية الحديثة، مُستَوْعَب بأدوات العربية."
      quality_gate:
        consistency: "اطراد: صيغة 'فاعل + مفعول في صفته' مألوفة."
        ease_of_use: "يُسر التداول: ستُّ كلمات — طويلةٌ نسبياً لكن واضحة."
        adequacy: "الملاءمة: مناسبةٌ للسياقين القانوني والإعلامي."
        heritage_preference: "الجذران (ف-و-ز) و(ط-ع-ن) عربيان أصيلان."
        arabic_preference: "العربية: نعم."
        derivability: "الاشتقاقية: محدودة بالعبارة، لا تشتقّ منها صفاتٌ جديدة بسهولة."
      morphological_fit: "مطعون: اسم مفعول من الفعل طعَن (يطعُن)، وزن مفعول — يناسب إضافة صفة الفعل إلى الموصوف."
      nuance_differentiation: "اللمّة تُصرِّح بالفوز أولاً ('فائز') ثم بالطعن؛ مما يُبرز تناقض الوضع: فائزٌ إلا أن فوزه مُعلَّق."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَائِزٌ مَطعُونٌ فِي فَوزِه"

    # ── المرشح ١: مَطعُونٌ فِيهِ ──
    - lemma: "مَطعُونٌ فِيهِ"
      source: stage1
      decision: removed
      decision_reason: >
        الدليل المعجمي يُثبت تخصيص 'المطعون' في التراث الحديثي لراوي الحديث المطعون في ثقته، لا للفائز في سباق. فضلاً عن ذلك، يُحمَل 'مطعون' في العربية الحديثة أولاً على معنى المصاب بالطاعون، مما يُوجب حضور 'في فوزه' صراحةً لإزالة اللبس — وهو ما تفعله اللمّة الموجودة بالفعل. 'مطعونٌ فيه' بدون إضافة محددة أشدُّ غموضاً.
      evidence_assessment:
        case: contradicts_only

    # ── المرشح ٢: مُنَازَعُ الفَوزِ ──
    - lemma: "مُنَازَعُ الفَوزِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مركَّبٌ إضافي صحيح: 'مُنازَع' (اسم مفعول من نازَع، أي: جُودِلَ عليه أو خُوصِمَ في حقه) + 'الفوز'. يُعبِّر عن المفهوم بإيجازٍ ووضوح دون الوقوع في التباس 'طاعون'. جذر نزع موثَّقٌ في المقاييس بمعنى الانتزاع والخصومة على الحق. المركَّب مقبولٌ كوحدة اصطلاحية في المصطلحية القانونية العربية قياساً على نظائر مشابهة (مجهول الهوية، مسلوب الإرادة). لا دليل معجمي على تثبيته كمدخل مستقل، لكنه يجتاز اختبار الاشتقاق والتركيب ويُقدَّم كمصطلح جديد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      substitution_test: "يمكن القول 'منازع الانتصار' بنفس المعنى وصفاً، لكنّ 'الفوز' هو المصطلح الثابت في السياق الانتخابي → المركَّب أكثر تخصصاً."
      borrowing_check:
        lexical_borrowing: "لا اقتراض."
        blind_calque: "مبنيٌّ على أدوات عربية خالصة."
      quality_gate:
        consistency: "اطراد: يتبع نمط المركَّبات الإضافية القانونية."
        ease_of_use: "يُسر التداول: كلمتان فقط — موجز."
        adequacy: "الملاءمة: مناسبٌ للسياق القانوني والإعلامي."
        heritage_preference: "الجذران (ن-ز-ع) و(ف-و-ز) عربيان أصيلان."
        arabic_preference: "العربية: نعم."
        derivability: "الاشتقاقية: 'منازعة الفوز' و'تنازع الفوز' مشتقان بسهولة."
      morphological_fit: "مُنَازَع: اسم مفعول من فعل المفاعلة نَازَع، وزن مُفَاعَل — يدلّ على أن الفعل وقع عليه من طرفٍ آخر."
      nuance_differentiation: "يُبرز جانب الخصومة والتنازع أكثر من جانب الإجراء القانوني (الطعن الرسمي)؛ أشمل من 'مطعون في فوزه' ليشمل أي نوع من المنازعة."
      actions:
        - command: create_entry
          params:
            lemma: "مُنَازَعُ الفَوزِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── المرشح ٣: مُعتَرَضٌ عَلَى فَوزِه ──
    - lemma: "مُعتَرَضٌ عَلَى فَوزِه"
      source: stage1
      decision: removed
      decision_reason: >
        عبارةٌ أطول من اللمّة الموجودة ولا تضيف ميزةً نوعية عليها. 'الاعتراض' أعمُّ من 'الطعن' القانوني ويفقد الدقة المصطلحية. لا أثر لها في المصادر المعجمية. مرفوضة لصالح 'منازع الفوز' الأكثر إيجازاً.
      evidence_assessment:
        case: no_material

    # ── المرشح ٤: فَائِزٌ مُتَنَازَعٌ عَلَيهِ ──
    - lemma: "فَائِزٌ مُتَنَازَعٌ عَلَيهِ"
      source: stage1
