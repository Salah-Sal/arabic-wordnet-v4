# ── المرحلة ١: المراجعة والتوليد (أعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'فائز مطعون في فوزه' عبارةٌ وصفية حرة لا وحدةٌ معجمية مسكوكة؛ يمكن إبدال 'مطعون في' بـ'محتجٌّ على' أو 'منازَعٌ في' فتظل الجملة صحيحة وصفاً → فشل اختبار الثبات."
      - "كلمة 'فائز' في صدر اللمّة زائدة دلالياً: من يُطعَن في فوزه هو حتماً فائز، فالإضافة تعديد للمحمول لا فصلٌ نوعي."
      - "اللمّة خاليةٌ من التشكيل، مخالفةً لاشتراط التشكيل الكامل في AWN4."
      - "لا يوجد مقابل عربي أحادي الكلمة راسخٌ للمفهوم الإنجليزي 'contestee'؛ المفهوم يُعبَّر عنه بعبارة لا بمصطلح مفرد، مما يجعل المجموعة 'phraset' في طبيعتها."
    observations: >
      المجموعة تصف مفهوماً قانونياً-انتخابياً دقيقاً: الشخصُ الذي أُعلن فوزُه في سباق أو انتخابات ثم طُعن في صحة هذا الفوز. المقابل الإنجليزي 'contestee' مصطلحٌ نادر حتى في الإنجليزية. في العربية القانونية والانتخابية يُعبَّر عن المفهوم بعبارة 'المطعون في فوزه'، وهي شبه مسكوكة في السياق الانتخابي. جذر الطعن (ط-ع-ن) موثَّقٌ في معاجم اللغة بمعنى الوخز ثم الاستعارة إلى النقد والاعتراض، وهو الأساس الاشتقاقي الأنسب. جذر نزع (ن-ز-ع) بمعنى انتزاع الحق يصلح أساساً لتركيب إضافي بديل.

  blind_candidates:
    - lemma: "مَطعُونٌ فِيهِ"
      generation_method: ishtiqaq
      justification: "اسم مفعول من طعَن على وزن مفعول، ومعه الجار 'فيه' الدال على الموضوع المطعون فيه. يُستعمل في اللغة القانونية العربية للحكم أو القرار الذي يُطعن فيه ('الحكم المطعون فيه')، وقد يُطبَّق على الشخص الفائز الذي يُطعَن في فوزه."
    - lemma: "مُنَازَعُ الفَوزِ"
      generation_method: tarkib
      justification: "مركَّبٌ إضافي: اسم مفعول من نازَع (= خَوصِمَ في حقه) مضافاً إلى 'الفوز'. يُوجز المعنى بدقة: من نُوزع فوزُه، أي يُتنازع على انتصاره. البنية الإضافية منتجةٌ في المصطلحية القانونية العربية (مجهول الهوية، مقطوع الرأس، مسلوب الإرادة)."
    - lemma: "مُعتَرَضٌ عَلَى فَوزِه"
      generation_method: tarkib
      justification: "تركيبٌ وصفي: اسم مفعول من اعتَرض مع الجار والمجرور 'على فوزه'. الاعتراض أعمُّ من الطعن القانوني ويشمل الاحتجاج غير الرسمي؛ يمكن استخدامه إذا أُريد توسيع نطاق المفهوم ليشمل السياقات غير القضائية."
    - lemma: "فَائِزٌ مُتَنَازَعٌ عَلَيهِ"
      generation_method: tarkib
      justification: "مركَّبٌ وصفي: فائز (الجنس القريب) + متنازَعٌ عليه (الفصل النوعي). 'التنازع' يعني التجاذب بين طرفين على شيء؛ المركَّب يصف فائزاً يتجاذب المتنافسون الحقَّ في إعلان فوزهم بديلاً عنه."


