# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "فائز (في سباق أو انتخابات وما إلى ذلك) يتم الطعن في فوزه"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُؤلَّفٌ بأسلوب وصفي لا معجمي: 'يتم الطعن' صيغةٌ مبنية للمجهول غير أسلوبية في التعريف المعجمي، والقوسان '(في سباق أو انتخابات وما إلى ذلك)' تُثقِّل النص دون فصل نوعي حقيقي. التعريف يفتقر إلى الجنس القريب الصريح والفصل النوعي الدقيق الكافيين لمعجم وصفي محكم. فضلاً عن ذلك، يُضيف التعريف الإنجليزي 'etc.' الذي لم يُترجَم تمام الترجمة.
    authored:
      - type: terminological
        text: "مَنْ أُعلِنَ فَوزُهُ فِي سِبَاقٍ أَو انتِخَابَاتٍ أَو مُسَابَقَةٍ، وَطُعِنَ مُنَافِسُهُ أَو طَرَفٌ ذُو مَصلَحَةٍ فِي صِحَّةِ هَذَا الفَوزِ أَمَامَ الجِهَةِ المُختَصَّة"
        quality_check:
          genus_present: true
          differentia_present: true
