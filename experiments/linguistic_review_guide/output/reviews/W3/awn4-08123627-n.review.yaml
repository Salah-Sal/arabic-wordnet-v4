stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية تفتقر إلى التشكيل الكامل الدقيق، مما يؤثر على النطق الصحيح في سياق المراتب التصنيفية."
    observations: "المفهوم علمي دقيق يتعلق بالتصنيف الأحيائي (Taxonomy). اللغة العربية تستخدم صيغة التصغير (فُعَيْلَة / فُعَيْل) للتعبير بامتياز عن المراتب الفرعية الدونية (مثل: شعبة -> شعيبة، طائفة -> طويئفة، صنف -> صنيف)، وهو أسلوب قياسي واقتصادي في صياغة المصطلحات."
  blind_candidates:
    - lemma: "طُوَيْئِفَة"
      generation_method: ishtiqaq
      justification: "تصغير (طائفة)، وهو القياس والأسلوب المعياري في المراتب التصنيفية الفرعية في علم الأحياء."
    - lemma: "صُنَيْف"
      generation_method: ishtiqaq
      justification: "تصغير (صِنْف)، كمرادف أو بديل لـ (طائفة) في بعض المدارس التصنيفية."
    - lemma: "تَحْتَ طَائِفَة"
      generation_method: tarkib
      justification: "ترجمة تركيبية حرفية للمصطلح الإنجليزي (subclass)."
    - lemma: "صِنْف فَرْعِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر بوضوح عن التقسيم الفرعي للصنف."

stage2_evidence:
  per_lemma:
    - lemma: "طُوَيْئِفَة"
      confirm:
        - text: "«فرع رئيسيّ [من طبقة]. وبخاصّةٍ: الطُّوَيْئفَة.»"
          source: "المورد الحديث (2008)"
        - text: "«(1) الخَيْشوميّ الأقدام: واحدٌ من خَيْشوميات الأقدام وهي طُوَيْئفة من القِشريات»"
          source: "المورد الحديث (2008)"
    - lemma: "صُنَيْف"
      confirm:
        - text: "«حيوان ثديي من الصنيف(طويئفة) ثيريا من رتبة آكلات الحشرات»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "تَحْتَ طَائِفَة"
      evidence_status: "no_material_found"
    - lemma: "صِنْف فَرْعِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "طُوَيْئِفَة"
      decision: confirmed
      decision_reason: "مصطلح علمي قياسي موثق ومعتمد في المعاجم الحديثة والموحدة للدلالة على المرتبة التصنيفية التي تلي الطائفة، وصيغة التصغير ملائمة جداً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طُوَيْئِفَة"
    - lemma: "صُنَيْف"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح رديف موثق في معجم البيولوجيا الموحد، ويتبع نفس أسلوب التصغير القياسي للمراتب الفرعية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "صُنَيْف"
            pos: "n"
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "تَحْتَ طَائِفَة"
      source: stage1
      decision: removed
      decision_reason: "لم يثبت كمركب معجمي اصطلاحي متداول مقارنة بالصيغ المشتقة بالتصغير، ويفضل إيثار المصطلحات المفردة الأقل طولاً."
    - lemma: "صِنْف فَرْعِيّ"
      source: stage1
      decision: removed
      decision_reason: "لم يثبت بالدليل في سياق علم الأحياء في المعاجم المرجعية مقارنة بالمصطلحات المصغرة التي تفي بالغرض."

stage4_content:
  definition:
    current: "(في الأحياء) فئة تصنيفية تحت الطائفة وفوق الرتبة"
    assessment:
      decision: revise
      reason: "صياغة التعريف لتكون على النمط المعجمي السليم بإزالة الأقواس السياقية ودمج التخصيص في الجنس المعرف بشكل طبيعي."
    authored:
      - type: terminological
        text: "مَرْتَبَةٌ فِي التَّصْنِيفِ الأَحْيَائِيِّ تَقَعُ دُونَ الطَّائِفَةِ وَفَوْقَ الرُّتْبَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَرْتَبَةٌ فِي التَّصْنِيفِ الأَحْيَائِيِّ تَقَعُ دُونَ الطَّائِفَةِ وَفَوْقَ الرُّتْبَةِ."
  examples:
    per_lemma:
      - lemma: "طُوَيْئِفَة"
        examples:
          - text: "تُصَنَّفُ الثَّدْيِيَّاتُ المَشِيمِيَّةُ ضِمْنَ طُوَيْئِفَةِ الوَحْشِيَّاتِ الحَقِيقِيَّةِ."
            type: usage
      - lemma: "صُنَيْف"
        examples:
          - text: "يَنْتَمِي هَذَا النَّوْعُ إِلَى صُنَيْفِ الأَسْمَاكِ الغُضْرُوفِيَّةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُصَنَّفُ الثَّدْيِيَّاتُ المَشِيمِيَّةُ ضِمْنَ طُوَيْئِفَةِ الوَحْشِيَّاتِ الحَقِيقِيَّةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يَنْتَمِي هَذَا النَّوْعُ إِلَى صُنَيْفِ الأَسْمَاكِ الغُضْرُوفِيَّةِ."

