      entry_id: "{auto}"
      root: "طوف"
      maqayis_quote: "«الطَّاءُ وَالْوَاوُ وَالْفَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى دَوَرَانِ الشَّيْءِ عَلَى الشَّيْءِ، وَأَنْ يُحَفَّ بِهِ.»"
