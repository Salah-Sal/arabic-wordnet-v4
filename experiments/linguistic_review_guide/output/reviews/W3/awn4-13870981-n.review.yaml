      confirm:
        - text: "«التَّاسِعُ عَشَرَ — الجذر: ت س ع — مثال: جَاء اليومُ التاسعُ عَشَرَ — الصواب والرتبة: جاء اليومُ التاسعَ عَشَرَ [فصيحة] — جاء اليومُ التاسعُ عَشَرَ [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«(1) التاسع عشر (2) بالغٌ جزءًا من 19 من كذا (3) التاسع عشر من كذا the nineteenth of May (4) جزء من 19»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التَّاسِعِ عَشَرَ — مثال: سيسافر في التاسِعِ عَشَرَ من هذا الشهر — الصواب والرتبة: سيسافر في التَّاسِعَ عَشَرَ من هذا الشهر [فصيحة] — سيسافر في التَّاسِعِ عَشَرَ من هذا الشهر [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "توضيح أنّ البناء على فتح الجزأين هو الأفصح، وإعراب الجزء الأول بالجرّ أو الرفع صحيح لكنه أقلّ فصاحة"
    - lemma: "التَّاسِعَةَ عَشْرَةَ"
