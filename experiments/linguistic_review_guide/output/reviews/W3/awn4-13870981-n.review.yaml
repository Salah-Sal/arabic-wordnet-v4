stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «التاسع عشر» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط وهي العدد الترتيبي المركب"
    observations: >
      المجموعة تمثّل مفهوم المَوْضِع التاسع عشر في سلسلة معدودة، وهو عدد ترتيبي مركّب
      من «تاسع» و«عشر». الأعداد المركّبة من 11 إلى 19 تُبنى على فتح الجزأين في الفصحى،
      فالصيغة المعيارية هي «التَّاسِعَ عَشَرَ». المفهوم بسيط ومباشر ولا يحتاج إلى توليد
      مصطلحي بقدر ما يحتاج إلى ضبط صرفي ونحوي.
  blind_candidates:
    - lemma: "التَّاسِعَ عَشَرَ"
      generation_method: tarkib
      justification: >
        العدد الترتيبي المركّب المبني على فتح الجزأين، وهو الصيغة الفصيحة المعيارية
        للدلالة على الموضع التاسع عشر في سلسلة
    - lemma: "التَّاسِعَةَ عَشْرَةَ"
      generation_method: tarkib
      justification: >
        الصيغة المؤنثة من العدد الترتيبي المركب، تُستخدم مع المعدود المؤنث
        كـ«المرتبة التاسعةَ عشرةَ»
    - lemma: "تَاسِعَ عَشَرَ"
      generation_method: tarkib
      justification: >
        الصيغة النكرة من العدد الترتيبي المركب بدون أداة التعريف،
        تُستخدم في سياقات الإضافة والتنكير
    - lemma: "التُّسَاعِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «تُساعيّ» على وزن فُعالِيَّة، لكنه يدلّ على ما يتألف من تسعة
        لا على الموضع التاسع عشر — مرشح ضعيف يُطرح للمقارنة فقط

stage2_evidence:
