stage3_analysis:
  per_lemma:
    - lemma: "التَّاسِعَ عَشَرَ"
      decision: confirmed
      decision_reason: >
        اللمّة الموجودة «التاسع عشر» هي العدد الترتيبي المركب الصحيح للدلالة على
        الموضع التاسع عشر. الأدلة المعجمية من معجم الصواب اللغوي والمورد الحديث تؤكد
        صحتها. يجب تحديث التشكيل إلى «التَّاسِعَ عَشَرَ» ببناء الجزأين على الفتح
        وفقاً للقاعدة الفصيحة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "التَّاسِعَ عَشَرَ"
    - lemma: "التَّاسِعَةَ عَشْرَةَ"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة المؤنثة لا تمثّل لمّة مستقلة بل هي تصريف سياقي للعدد الترتيبي
        مع المعدود المؤنث. المجموعة الترادفية تمثّل المفهوم المجرد للموضع ولا حاجة
        لإفراد صيغة المؤنث كلمّة مستقلة.
    - lemma: "تَاسِعَ عَشَرَ"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة النكرة بدون «ال» ليست لمّة مستقلة عن الصيغة المعرّفة في سياق
        المجموعة الترادفية. المفهوم هو «الموضع» المحدد فيلزمه التعريف.
    - lemma: "التُّسَاعِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المصدر الصناعي «التساعية» يدلّ على ما يتعلق بالتسعة أو يتألف منها،
        ولا يدلّ على الموضع التاسع عشر في سلسلة. لا علاقة دلالية بالمفهوم المطلوب.

