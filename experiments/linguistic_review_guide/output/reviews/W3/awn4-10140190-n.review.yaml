# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:

  per_entry:
    - lemma: "بُسْتَانِيّ"
      entry_id: "{auto}"
      root: "بستن"
      # ملاحظة: بُسْتَان لفظ فارسي الأصل (بوستان) دخل العربية قديماً؛
      # لذا لا يرد في مقاييس اللغة لابن فارس (القرن الرابع الهجري).
      # الجذر المُعرَّب الرباعي هو (ب س ت ن) ولا أصل له في المقاييس.

    - lemma: "جَنَائِنِيّ"
      entry_id: "{auto}"
      root: "جنن"
      maqayis_quote: >
        «الْجِيمُ وَالنُّونُ أَصْلٌ وَاحِدٌ، وَهُوَ السَّتْرُ وَالتَّسَتُّرُ.
        فَالْجَنَّةُ مَا يَصِيرُ إِلَيْهِ الْمُسْلِمُونَ فِي الْآخِرَةِ، وَهُوَ
        ثَوَابٌ مَسْتُورٌ عَنْهُمُ الْيَوْمَ. وَالْجَنَّةُ الْبُسْتَانُ، وَهُوَ
        ذَاكَ لِأَنَّ الشَّجَرَ بِوَرَقِهِ يَسْتُرُ»
        — ابن فارس، مقاييس اللغة (مادة: جِنٌّ)

