            type: usage
      - lemma: "جَنَائِنِيّ"
        examples:
          - text: "أبدعَ الجَنَائِنِيُّ في تصميم مساحات الخضرة وتوزيع نباتات الزينة على جانبَي المدخل."
            type: usage
    actions:
      - command: add_sense_example
        params:
