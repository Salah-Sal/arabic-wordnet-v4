# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10140190-n  |  ILI: i90152  |  POS: n
# المفهوم: البستاني (gardener)
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────
stage1_review:

  # أ. توليد اللمّات المرشحة من التعريف فقط (قبل الاطلاع على اللمّات الموجودة)
  # المدخل المُقنَّع: "شخص يعتني بحديقة" | الفرداس الأعلى: خبير في علم زراعة النباتات
  blind_candidates:
    - lemma: "جَنَّانٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ج ن ن) على وزن فَعَّال الإنتاجي للمِهَن والحِرَف (نجّار، حدّاد، بنّاء).
        الجَنَّة في أصلها العربي بستانٌ ذو شجر؛ فالجَنَّان من يعتني بالجنّة أي الحديقة.
        الوزن يُعبّر عن الاحتراف والديمومة في المهنة.

    - lemma: "جَنَائِنِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى الجنائن (جمع جنينة = حديقة صغيرة)، على نمط النسب إلى الجمع
        المُجاز عند مجمع اللغة العربية المصري حين يُقصد الاشتراك الجمعي.
        يدل على من اختصّ بالعناية بالجنائن والحدائق.

    - lemma: "حَدِيقِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة مباشرة إلى الحديقة (الأرض ذات الشجر والنبات المُحاطة بسور)؛
        وهو وزن منتج للنسب إلى الأماكن كالدار → داري، والسوق → سوقي.
        يدلّ على من يُعنى بالحديقة ويعمل فيها.

    - lemma: "غَرَّاسٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (غ ر س) على وزن فَعَّال للمهنة؛ الغَرْس إثبات الشيء وتثبيته
        في الأرض كغرس الشجر والنبات. الغرَّاس: المُكثِر من الغَرْس والعناية بالمزروعات.
        يصف من يعتني بالحديقة من جهة زراعة نباتاتها وإكثارها.

  # ب. التقييم الأولي بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة (بستاني) مكتوبة بلا تشكيل — يجب توفير الضبط الكامل: بُسْتَانِيّ"
      - >
        بُسْتَان لفظٌ فارسيّ الأصل (بوستان)، مما يعني أن اللمّة الوحيدة المُثبَّتة
        مُشتقَّة من دخيل؛ وهناك بديل عربي الجذر (جنائني) موثَّق في المعاجم الحديثة.
      - >
        التعريف العربي الحالي "شخص يعتني بحديقة" مُجمَل ولا يستوفي شرطَي الجنس
        القريب والفصل النوعي اللازمَيْن للتعريف المصطلحي الدقيق.
      - >
        المجموعة تضمّ لمّة واحدة فقط مع وجود مرادف موثَّق (جنائني) في المورد الحديث؛
        مما يُقلّل من الثراء المعجمي للشبكة.
    observations: >
      لمّة (بستاني) موثَّقة في المعجم الوسيط والمعجم الكبير ومصطلحيات ARABTERM
      بالمعنى المقصود (عامل البستان / gardener)، وهي المصطلح المُتداول في السياقَيْن
      الرسمي والمحكي. غير أن أصلها الفارسي يستوجب الإشارة معجمياً. يُقابلها في
      القاموس الثنائي المورد الحديث (2008) اللمّة (جنائني) التي تمثّل الجذر العربي
      الصميم (ج ن ن)، وقد أجاز مجمع اللغة المصري هذه الصيغة بوصفها فصيحة.
      الفرق الدلالي الدقيق: بُسْتَانِيّ أعمّ يشمل كل البساتين والحدائق،
      بينما جَنَائِنِيّ أخصّ بحدائق الزهور والنباتات الزينية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  # ملاحظة: جُمعت الأدلة عبر ٦ استعلامات:
  # (١) مطابقة دفعية للمّات الموجودة والمرشحات → ٧ إدخالات
  # (٢) إثراء مُدمَج (تعريفات + أمثلة + جموع) لـ entry_ids المُستخرَجة
  # (٣) جسر إنجليزي (gardener / horticulturist / landscaper)
  # (٤) FTS بكلمات مفتاحية (بستان، حديقة، جنينة، بستاني)
  # (٥) مقاييس اللغة لجذر بستن وجنن وزرع وحدق
  # (٦) التحقق من مرشحَي جنائني وحديقي ومزدرع

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "بستاني"
      confirm:
        - text: "«عامل البستان»"
          source: "المعجم الوسيط (مجمع اللغة العربية — OCR)"
        - text: "«نسبة إلى البستان، ويطلق على عامله. يقال: نبات بستاني: يزرع ويعتنى به»"
          source: "المعجم الكبير (مجمع اللغة العربية — OCR)"
        - text: "«الذي مهنته العمل في البساتين والحدائق» [translation_en: gardener]"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM"
        - text: "«(البستاني) عَامل الْبُسْتَان»"
          source: "المعجم الوسيط — نسخة هوراماني"
        - text: "«بُسْتانيّ — عن الفارسية نسبة إلى بُسْتان بمعنى القائم على شئون البستان»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«البُستانيّ؛ الجنائنيّ.» [ترجمة: gardener]"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«بستاني» [translation_en: horticulturist]"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM"
          addition: >
            يُثبّت استخدام بستاني بمعنى horticulturist أيضاً، وهو أشمل من gardener؛
            مما يدل على أن اللمّة تُغطّي طيفاً أوسع في الاستخدام المصطلحي.

    # ── المرشح الأول من المرحلة ١ ──
    - lemma: "جنّان"
      evidence_status: "no_material_found"

    # ── المرشح الثاني من المرحلة ١ ──
    - lemma: "جنائني"
      confirm:
        - text: "«البُستانيّ؛ الجنائنيّ.» [ترجمة: gardener]"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: >
            «جَنَائِنيّ — مثال: هو جنائنيّ — الصواب والرتبة: -هو جنائنيّ [فصيحة]
            التعليق: لما كان معنى الاشتراك الجمعي مقصوداً في هذا المثال فإن الأدق
            النسب إلى الجمع. وبرأيهم (الكوفيين) أخذ مجمع اللغة المصري؛ لأن السماع
            يؤيدهم؛ ولأن النسبة إلى الجمع قد تكون أبين وأدق في التعبير عن المراد»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"

    # ── المرشح الثالث من المرحلة ١ ──
    - lemma: "حديقي"
      contradicts:
        - text: "«بُستانيّ؛ حَدِيقيّ garden plants»"
          source: "المورد الحديث (2008) — ARABTERM"
          conflict: >
            حديقي وردت بوصفها صفة للنباتات (garden plants) لا وصفاً للشخص العامل
            في الحديقة؛ فالسياق لا يدعم استخدامها اسماً للبستاني.

    # ── المرشح الرابع من المرحلة ١ ──
    - lemma: "غرّاس"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:

    # ══ اللمّة الموجودة: بستاني ══
    - lemma: "بستاني"
      decision: confirmed
      decision_reason: >
        موثَّقة في أربعة مصادر معجمية متنوعة (وسيط، كبير، أرابترم، مورد حديث) بالمعنى
        المقصود (عامل البستان = gardener)، وهي المصطلح الرسمي الأوسع انتشاراً.
        تستوجب فقط إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ دلالةً؛ يشمل القائم على رعاية البساتين والحدائق بجميع أنواعها
        (الثمرية والزهرية والنباتية والزينية)، وهو المصطلح الشائع في السياقَيْن
        الرسمي والمحكي والتقني.
      borrowing_check:
        lexical_borrowing: >
          معرَّبٌ مقبول؛ بُسْتَان من الفارسية بوستان، دخل العربية قديماً وتعرَّب
          تعريباً كاملاً وقَبِل النسبة والتعريف والجمع (بساتين).
        blind_translation: لا توجد ترجمة حرفية — المصطلح متطابق مع المدلول.
        calque: لا ينطبق.
      quality_gate:
        ittiraad: "مطّرد وشائع في الفصحى المعاصرة"
        yusr: "سهل التداول والنطق"
        mulaama: "ملائم لحقل البستنة والزراعة"
        turaathi: "دخيل معرَّب قديم؛ يُفضَّل الإبقاء عليه لشيوعه"
        arabi: "جنائني أكثر أصالةً عربية، لكن بستاني أوسع انتشاراً"
        ishtiqaaqiyya: "قابل للاشتقاق (بستنة، مبستَن، يُبستِن)"
      morphological_fit: >
        نسبة على وزن فَعَالِيّ (نسبة إلى الاسم الدخيل)، شائع للنسب إلى الأماكن
        والمواطن؛ الوزن يناسب الاسم الوظيفي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُسْتَانِيّ"

    # ══ المرشح الأول: جنّان ══
    - lemma: "جَنَّانٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُسفر الاستعلامات عن أي دليل معجمي يُثبّت استخدام جنّان بمعنى البستاني
        أو عامل الحديقة. فضلاً عن ذلك، فإن جنّان قد يُوهم بالمعنى المتعلق بالجنّ
        (جِنّان = من له علاقة بالجن)، وهو اشتراك لفظي غير مرغوب.
      evidence_assessment:
        case: no_material

    # ══ المرشح الثاني: جنائني ══
    - lemma: "جَنَائِنِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في المورد الحديث (2008) بوصفه مرادفاً مباشراً لـ gardener جنباً إلى
        جنب مع البستاني. كذلك أقرَّه معجم الصواب اللغوي بوصفه فصيحاً بناءً على
        قرار مجمع اللغة العربية المصري. يمثّل البديل العربي الصميم للمصطلح المعرَّب
        بستاني، وجذره جنن أصيل عربي دلالته الأصلية الستر والإحاطة (ومنها الجنّة =
        البستان لأن الشجر يستر).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أخصّ نسبةً وأكثر أناقةً أسلوبية؛ يُشير بصفة خاصة إلى الاعتناء بالجنائن
        (حدائق الزهور والنباتات الجمالية والزينية)، ويُؤثَر في السياقات الأدبية
        والرسمية المتعلقة بتصميم الحدائق وتنسيقها.
      borrowing_check:
        lexical_borrowing: "عربي أصيل، جذره جنن."
        blind_translation: لا ينطبق.
        calque: لا ينطبق.
      quality_gate:
        ittiraad: "مطّرد صرفياً — نسبة إلى جمع تكسير مُجازة"
        yusr: "يسير في النطق والكتابة"
        mulaama: "ملائم لحقل البستنة والتنسيق والحدائق"
        turaathi: "يُمثّل الجذر العربي الأصيل في مقابل الدخيل المعرَّب"
        arabi: "أعلى أصالةً من بستاني"
        ishtiqaaqiyya: "مشتق من جذر منتج (جنّة، جنان، جنينة)"
      morphological_fit: >
        نسبة إلى جمع تكسير (جنائن) على نمط مقبول عند مجمع اللغة حين يُقصد الاشتراك
        الجمعي؛ الوزن يناسب الاسم الوظيفي لصاحب الحرفة.
      actions:
        - command: create_entry
          params:
            lemma: "جَنَائِنِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10140190-n"

    # ══ المرشح الثالث: حديقي ══
    - lemma: "حَدِيقِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المتوفرة (المورد الحديث) تُثبّت استخدام حديقي صفةً للنباتات
        (garden plants) لا اسماً للشخص. غياب أي توثيق لها كعنوان وظيفي
        (title for a person who tends a garden) يحول دون قبولها في هذه المجموعة.
      evidence_assessment:
        case: contradicts_only

    # ══ المرشح الرابع: غرّاس ══
    - lemma: "غَرَّاسٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي يُثبّت استخدام غرّاس بمعنى البستاني (gardener) في هذه القاعدة.
        فضلاً عن ذلك، الغرّاس أخصّ دلالةً (من يغرس الأشجار والنباتات بصفة خاصة)
        في حين يشمل البستاني عمليات متعددة (تنسيق، صيانة، ري، قطاف) تتجاوز الغرس.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
# (تعالج فقط اللمّات المؤكدة: بُسْتَانِيّ + جَنَائِنِيّ)
stage4_content:

  definition:
    current: "شخص يعتني بحديقة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُجمَل ومفتقر إلى الدقة المصطلحية؛ فهو يُحدّد الجنس (شخص)
        لكنه لا يُقيّد الفصل بما يكفي (يعتني: فعل عام قابل للتأويل). كذلك لا يُشير
        إلى الطابع المِهَني الاحترافي الذي يُميّز البستاني عن مجرد هاوي الحدائق،
        ولا يُحيل إلى طبيعة العمل الفعلي.
    authored:
      - type: terminological
        text: >
          مَنِ اتَّخَذَ رعايةَ الحدائقِ والبساتينِ حِرفةً، يضطلعُ بزراعةِ
          نباتاتِها وتنسيقِها وصيانتِها وسقايتِها
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          العاملُ الذي يُعنى بالحدائق العامة والخاصة والبساتين، ويتولّى زرعَ
          النباتات والأشجار والأزهار وتنسيقَ أرضِها وتقليمَها وسقايتَها
          وتسميدَها ومكافحةَ الآفات التي تُصيبها
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10140190-n"
          definition_index: 0
          text: "مَنِ اتَّخَذَ رعايةَ الحدائقِ والبساتينِ حِرفةً، يضطلعُ بزراعةِ نباتاتِها وتنسيقِها وصيانتِها وسقايتِها"
      - command: add_definition
