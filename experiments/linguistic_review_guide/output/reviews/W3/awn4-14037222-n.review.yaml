# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14037222-n — moratorium
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان كلتاهما مركبتان (تجميد النشاط / وقف مؤقت)، ولا يوجد مصطلح مفرد يؤدي المعنى"
      - "لفظ «تجميد» في سياق إيقاف النشاط استعمال مجازي حديث أنكره بعض اللغويين (معجم الصواب اللغوي)"
      - "التعريف العربي «تعليق نشاط جارٍ» يكاد يكون ترجمة حرفية للتعريف الإنجليزي"
    observations: >
      المفهوم يقع في حقل التوقف المؤقت عن فعل جارٍ، وهو فرع من hypernym «تعليق / وقف».
      المصطلح الإنجليزي moratorium يحمل بُعداً قانونياً واقتصادياً (تأجيل إلزامي للدفع)
      إضافة إلى المعنى العام (تعليق أو توقيف لنشاطٍ ما). العربية تعبّر عن هذا المعنى
      بألفاظ متعددة: تعليق، إيقاف، تجميد، إرجاء، لكن ليس ثمة لفظ مفرد مخصص
      لـ«التعليق المؤقت لنشاط جارٍ» بالتحديد.
  blind_candidates:
    - lemma: "إِرْجَاء"
      generation_method: ishtiqaq
      justification: >
        مصدر أَرْجَأَ على وزن إِفْعَال من الجذر «رجأ»، يدل على تأخير الأمر
        وتعليقه إلى وقت لاحق. مستعمل في الفصحى المعاصرة بمعنى التأجيل.
    - lemma: "تَجْمِيد"
      generation_method: majaz
      justification: >
        مصدر جَمَّدَ على وزن تَفْعِيل، أصله جمود السائل من البرد، ثم نُقل مجازاً
        إلى إيقاف الحركة والنشاط. شائع في لغة الإعلام والسياسة: تجميد المفاوضات،
        تجميد الأجور.
    - lemma: "مُهْلَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر «مهل» على وزن مُفْعَلة، تدل على التؤدة والإمهال. يمكن أن تُستعمل
        بمعنى الفترة التي يُعلَّق فيها النشاط ريثما يُتخذ قرار.
    - lemma: "تَعْطِيل"
      generation_method: ishtiqaq
      justification: >
        مصدر عَطَّلَ على وزن تَفْعِيل من الجذر «عطل» الدال على الخلوّ والفراغ.
        يدل على إبطال النشاط وإيقافه. مستعمل في التراث: تعطيل الثغور.

stage2_evidence:
  per_lemma:
    - lemma: "تَجْمِيد النَّشَاط"
      confirm:
        - text: "«(1) «أ», الموراتوريوم: «ب» قرار رسميّ بتأجيل دفع الديون المستحقّة [عند اشتداد الأزمة الاقتصادية]. «ج» الفترة التي يكون فيها هذا القرار نافذ المفعول (2) تعليق أو توقيف لنشاطٍ ما.»"
          source: "المورد الحديث (2008) — moratorium"
      expands:
        - text: "«تَجْمِيد المفاوضات — مرفوضة عند الأكثرين لعدم وجود الفعل «جمَّد» أو مصدره في المعاجم. المعنى: وَقْفها. الصواب والرتبة...»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يشير إلى أن استعمال «تجميد» بمعنى الإيقاف مرفوض عند الأكثرين لكن المجامع أجازته"
        - text: "«تجميد الأثمان»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — price freeze"
          addition: "يؤكد استعمال «تجميد» في السياق الاقتصادي بمعنى الإيقاف المؤقت"
        - text: "«تجميد الأجور»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — wage freeze"
          addition: "شاهد آخر على استعمال «تجميد» بمعنى الوقف المؤقت في المعجمية الحديثة"

    - lemma: "وَقْف مُؤَقَّت"
      confirm:
        - text: "«(1) تجاوزٌ عن؛ إغفال؛ حَذْف (2) إهمال (3) تعليق؛ وقفٌ مؤقَّت.»"
          source: "المورد الحديث (2008) — pretermission"
        - text: "«(1) «أ» حرمان مؤقَّت [من امتياز أو منصب إلخ]. «ب» تعطيل مؤقَّت. «ج» تعليق. «د» إرجاء. «هـ» توقّف عن الدَّفع»"
          source: "المورد الحديث (2008) — suspension"
      expands:
        - text: "«وقْف، إيقاف»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — suspension"
          addition: "يوثّق «وقف» كمقابل لـ suspension في المعجمية القانونية"

    - lemma: "إِرْجَاء"
      confirm:
        - text: "«إرجاء — إلى أجل مسمّى أو غير مسمّى»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — postponement"
        - text: "«(1) تأجيل؛ إرجاء (2) فضّ البرلمان.»"
          source: "المورد الحديث (2008) — prorogation"
        - text: "«(1) تعليق؛ إرجاء (2) «أ» قَلَقٌ؛ تَرَقُّبٌ قَلِق...»"
          source: "المورد الحديث (2008) — suspense"
      contradicts:
        - text: "«(1) إرجاء؛ تأجيل؛ إمهال. وبخاصة: إرجاء تنفيذ حكم بالإعدام (2) فترة راحة (3) يُرجئ؛ يُمْهِل.»"
          source: "المورد الحديث (2008) — respite"
          conflict: "الإرجاء يميل نحو التأجيل (postponement) لا التعليق المؤقت لنشاط جارٍ (moratorium)"

    - lemma: "تَجْمِيد"
      confirm:
        - text: "«(8) يُجمِّد [الفائدة المَصْرِفيّة] (10) تجميد»"
          source: "المورد الحديث (2008) — freeze"
      expands:
        - text: "«تَجْمِيد المفاوضات — مرفوضة عند الأكثرين لعدم وجود الفعل «جمَّد» أو مصدره في المعاجم»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "التجميد بمعنى الإيقاف المجازي أقرّته المجامع رغم الاعتراض"

    - lemma: "مُهْلَة"
      contradicts:
        - text: "«(المهلة) التؤدة والرفق يُقَال خُذ المهلة فِي أَمرك وَأخذ عَلَيْهِ المهلة تقدمه فِي سنّ أَو أدب وَبَقِيَّة جمر فِي الرماد»"
          source: "المعجم الوسيط"
          conflict: "المهلة تدل على التؤدة والإمهال لا على تعليق نشاط جارٍ"
        - text: "«مهلة — time limit»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "المهلة في الاصطلاح التجاري تعني مُدّة محددة (time limit) لا تعليقاً"

    - lemma: "تَعْطِيل"
      contradicts:
        - text: "«تخريب فعالية أو وظيفة أو بنية حيوية بتعريضها لعوامل فيزيائية أو كيميائية وغيرها.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — inactivation"
          conflict: "التعطيل في الاصطلاح العلمي يعني الإبطال النهائي (inactivation) لا التعليق المؤقت"
        - text: "«التّعطيل: هو عند البلغاء قسم من الحذف...والمعطل عند أهل الشرع هو الكافر الذي لا يعتقد بوجود الباري»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "دلالات التعطيل التراثية بعيدة عن معنى التعليق المؤقت"

stage3_analysis:
  per_lemma:
    - lemma: "تَجْمِيد النَّشَاط"
      decision: confirmed
      decision_reason: >
        مركب إضافي ثابت يُستعمل في لغة الإعلام والسياسة والاقتصاد بمعنى إيقاف نشاط
        جارٍ مؤقتاً. مدعوم بشواهد من المعجمية الحديثة (تجميد الأجور، تجميد الأثمان،
        تجميد المفاوضات). يتطابق مع المعنى الأول للـ moratorium العام.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يركّز على صورة الجمود والسكون: النشاط يتوقف كأنه تجمّد في مكانه.
        يوحي بقرار حازم وإيقاف شامل أكثر من مجرد تأجيل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجْمِيد النَّشَاط"

    - lemma: "وَقْف مُؤَقَّت"
      decision: confirmed
      decision_reason: >
        مركب وصفي ثابت موثّق في المورد الحديث (pretermission = تعليق؛ وقف مؤقت)
        وفي المعجمية القانونية. يعبّر عن المفهوم بوضوح: وقف + صفة التأقيت.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز عنصر التأقيت صراحةً: الوقف مقيّد بمدة ومآله الاستئناف.
        أعمّ من «تجميد النشاط» إذ يصلح لأي نوع من الإيقاف المؤقت.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَقْف مُؤَقَّت"

    - lemma: "إِرْجَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الإرجاء يعني التأجيل (postponement) لا تعليق نشاط جارٍ. الفرق أن المؤجَّل
        لم يبدأ بعد، أما المعلَّق فقد بدأ ثم أُوقِف. المورد الحديث يقرن الإرجاء
        بالتأجيل والإمهال، وهو أقرب إلى مفهوم respite/postponement.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَجْمِيد"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ مفرد يدل بالأصل على جمود السائل، ونُقل مجازاً إلى إيقاف الأمور.
        لكنه يحتاج إلى مضاف إليه ليتحدد (تجميد الأسعار، تجميد المفاوضات)؛
        بمفرده يبقى غامضاً وقد يُفهم بمعناه الحسي. المجموعة تحتوي أصلاً على
        «تجميد النشاط» وهو أدق.
      evidence_assessment:
        case: mixed

    - lemma: "مُهْلَة"
      source: stage1
      decision: removed
      decision_reason: >
        المهلة تعني التؤدة والإمهال أو المدة الممنوحة (time limit)، وليست تعليقاً
        لنشاط جارٍ. لا تتوافق مع دلالة moratorium بمعناها العام.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَعْطِيل"
      source: stage1
      decision: removed
      decision_reason: >
        التعطيل يدل على إبطال الوظيفة (inactivation/disabling) وهو أقرب إلى
        الإلغاء منه إلى التعليق المؤقت. دلالته التراثية (خلوّ وفراغ) والعلمية
        (تخريب الفعالية) لا تتوافقان مع عنصر التأقيت الجوهري في moratorium.
      evidence_assessment:
        case: contradicts_only

