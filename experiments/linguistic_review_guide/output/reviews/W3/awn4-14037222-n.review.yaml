      reason: >
        التعريف الحالي مقتضب ويكاد يكون ترجمة حرفية للتعريف الإنجليزي.
        ينقصه بيان عنصر التأقيت (أن الوقف مؤقت ومآله الاستئناف) وعنصر
        القرار الرسمي الذي كثيراً ما يصاحب المفهوم.
    authored:
      - type: terminological
        text: "إيقافٌ مؤقَّتٌ لنشاطٍ جارٍ بقرارٍ مقصود، يُرادُ منه التريُّث ريثما تتهيّأ ظروفُ الاستئناف"
