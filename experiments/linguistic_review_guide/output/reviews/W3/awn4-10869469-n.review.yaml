# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "الاسم لمّة دخيلة (اسم علم أجنبي)؛ التشكيل مفقود في المدخلَيْن الموجودَيْن"
      - "تضارب في رسم الاسم: AWN تستخدم «بيسمر» (بالياء) بينما المعاجم المعتمدة كالمورد الحديث تضبطه «بَسِّمَر» (بلا ياء وبشدّة على السين)"
      - "التعريف الحالي يُدرج الاسم «بيسمر» داخله مما يستلزم تحديثه عند تصحيح رسم الاسم"
      - "اللمّة «السير هنري بيسمر» تعبير مركب (MWE) متعدد المكونات يفتقر إلى ضبط صرفي واضح"
    observations: >
      المجموعة تُمثّل عَلَمًا شخصيًّا أجنبيًّا (proper noun) للمخترع البريطاني هنري بسّمر (1813–1898)
      المعروف بتطوير عملية بسّمر لإنتاج الفولاذ. الاسم مُعرَّب بالنقل الصوتي ولا جذر عربي له.
      القضية المحورية هي توحيد رسمه بين «بيسمر» و«بَسِّمَر»، وقد رجّح المورد الحديث (2008)
      الصيغةَ الثانية. يُستحسن اتباع المرجع الحديث ذي الطابع المعياري.
  blind_candidates:
    - lemma: "هِنْري بَسِّمَر"
      generation_method: taarib
      justification: >
        نقل صوتي مختصر للاسم الأجنبي Henry Bessemer دون اللقب الفخري «السير»، وهو أشيع في
        المراجع العلمية العربية المختصرة. الرسم يتبع نطق الاسم الإنجليزي بلا ياء زائدة.
    - lemma: "السِّيرُ بَسِّمَر"
      generation_method: tarkib
      justification: >
        تركيب إضافي يجمع اللقب الفخري المعرَّب «السير» مع اللقب العائلي «بسمر» وحده،
        صيغة مختصرة تُستخدم في النصوص الموسوعية والإشارات السريعة للشخصية.
    - lemma: "بَسِّمَر"
      generation_method: taarib
      justification: >
        اللقب العائلي وحده، وهو الأكثر استخدامًا في السياقات التقنية والعلمية (عملية بسمر،
        محول بسمر، فولاذ بسمر). ضبطه بالشدة على السين مستمد من المورد الحديث.
    - lemma: "السِّيرُ هِنْري بَسِّمَر"
      generation_method: tarkib
      justification: >
        الاسم الكامل الرسمي مع اللقب الفخري المعرَّب «السير» وفق الأعراف العربية في نقل
        الألقاب البريطانية، وهو الصيغة الموسوعية المعيارية في المراجع العربية التفصيلية.


