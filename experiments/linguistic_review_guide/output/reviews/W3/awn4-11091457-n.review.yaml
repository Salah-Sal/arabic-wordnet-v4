        - text: "«الدَّاءُ النَّشَوانِيُّ مِنْ نَمَطِ إنْدِيانا — amyloidosis Indiana type»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يكشف تعدّد استخدام 'إنديانا' مرجعاً لولاية أمريكية في المصطلحات الطبية، مما يُعزّز مخاوف الالتباس الدلالي عند استخدامه اسماً للفنان بمعزل"

    - lemma: "رُوبِرْت إِنْدِيَانَا"
      evidence_status: "no_material_found"

    - lemma: "رُوبِرْت كْلَارك"
      evidence_status: "no_material_found"

    - lemma: "أَنْدِي وَارْهُول"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إنديانا"
      decision: confirmed
      decision_reason: "اللقب الفني الشائع لروبرت إنديانا في المصادر العربية؛ التعريب 'إنديانا' مُدرج في معاجم ARABTERM كمقابل معتمد للفظ Indiana. يُقبل بشرط إضافة التشكيل الكامل وتوثيق دلالته الخاصة. اختبار الاستبدال: لا يمكن استبداله بـ'روبرت إنديانا' في العناوين المختصرة. فحص الاقتراض: تعريب صوتي مقبول لاسم علم أجنبي. بوابة الجودة: يوثّق الاطّراد في المصادر العربية، ويسر التداول عالٍ، لكن الملاءمة منقوصة بسبب الاشتراك مع اسم الولاية."
