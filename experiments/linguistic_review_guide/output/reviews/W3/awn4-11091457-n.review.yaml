# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تمثّل اسم علم (proper noun) لشخص بعينه؛ التوليد الاشتقاقي لا ينطبق عليها، وكل ما يُمكن توليده تعريباتٌ صوتية أو تركيبات للاسم الأجنبي"
      - "التعريف الحالي 'فنان بوب أمريكي (ولد عام 1928)' ناقصٌ: لا يذكر سنة الوفاة (2018)، ولا يُحدّد هوية الشخص، وصيغة 'ولد عام' وحدها تُوهم بأنه لا يزال حياً"
      - "اللمّتان مجرّدتان من التشكيل الكامل"
      - "'إنديانا' بمفردها لفظٌ مشترك يدلّ على ولاية أمريكية وعلى اسم الفنان، مما يُثير التباساً دلالياً"
    observations: "هذه مجموعة اسم علم خاص لفنان البوب الأمريكي روبرت إنديانا (Robert Indiana، اسمه الأصلي Robert Clark، 1928-2018). جميع اللمّات تعريبات صوتية للاسم الأجنبي. الحاجة الرئيسية: تصحيح التشكيل وإثراء التعريف بسنة الوفاة وبيان الشهرة. من الجدير بالملاحظة أن أندي وارهول (Andy Warhol) أيضاً وُلد عام 1928 وهو فنان بوب أمريكي، مما يكشف غموض التعريف الحالي إذ لا يُميّز بين الشخصين."
  blind_candidates:
    - lemma: "رُوبِرْت كْلَارك"
      generation_method: taarib
      justification: "الاسم الأصلي (birth name) للشخص قبل اختيار اللقب الفني؛ تعريب صوتي لـ Robert Clark، يمكن أن يكون صيغة بديلة في السجلات الأكاديمية"
    - lemma: "أَنْدِي وَارْهُول"
      generation_method: taarib
      justification: "فنان بوب أمريكي آخر شهير وُلد عام 1928 أيضاً، يطابق التعريف من حيث الجنس والجنسية وسنة الميلاد — انكشف لاحقاً أنه شخص مختلف تماماً"
    - lemma: "إِنْدِيَانَا"
      generation_method: taarib
      justification: "تعريب صوتي لـ Indiana، قد يكون لقباً فنياً مأخوذاً من اسم ولاية أمريكية"
    - lemma: "رُوبِرْت إِنْدِيَانَا"
      generation_method: tarkib
      justification: "تركيب إضافي (اسم أول + لقب فني) بتعريب الشطرين صوتياً؛ النمط المعتاد لكتابة أسماء الأعلام الغربيين بالعربية"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — Batch headword: انديانا + الانديانا + روبرت انديانا + روبرت كلارك + اندي وارهول
#   Q2 — English bridge: "Indiana" OR "Robert Indiana" OR "pop artist"
#   Q3 — Arabic FTS: "فنان بوب" OR "فن البوب" OR "فن الشعبي"
#   Q4 — Maqayis root ند (للتحقق من الجذر المُعيَّن خطأً)
