        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب المفرد — يُستخدم في السياقات الاختصارية والعناوين والإحالات الموجزة؛ قائم بذاته قد يُوهم بأنه اسم الولاية الأمريكية دون قرينة سياقية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِنْدِيَانَا"

    - lemma: "روبرت إنديانا"
      decision: confirmed
      decision_reason: "الاسم الكامل للفنان (الاسم الأول + اللقب الفني)؛ لا لبس فيه مع اسم الولاية أو مع أعلام أخرى. اختبار MWE: وحدة معجمية ثابتة مسكوكة لاسم عَلَم بعينه. اختبار الاستبدال: لا يمكن إبدال 'روبرت' بمرادف وهذا يُثبت أنه اسم عَلَم لا عبارة وصفية حرة. الصيغة المفضّلة في النصوص الرسمية والأكاديمية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل (الاسم الأول + اللقب الفني) — الأكثر دقةً وتحديداً؛ يُزيل اللبس ويُثبت الهوية في النصوص الرسمية والمراجع العلمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُوبِرْت إِنْدِيَانَا"

    - lemma: "رُوبِرْت كْلَارك"
      source: stage1
      decision: removed
      decision_reason: "الاسم الأصلي (birth name) نادراً ما يُستخدم في الإشارة إلى هذا الفنان في المصادر العربية؛ الاسم الفني هو المتداول والمعروف. لا أدلة معجمية على تداوله."
      evidence_assessment:
        case: no_material

    - lemma: "أَنْدِي وَارْهُول"
      source: stage1
      decision: removed
      decision_reason: "شخص مختلف تماماً عن المقصود بهذه المجموعة؛ أندي وارهول فنان بوب أمريكي آخر وُلد عام 1928 أيضاً، لكن هذه المجموعة خاصة بروبرت إنديانا."
