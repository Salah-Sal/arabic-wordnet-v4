stage2_evidence:
  per_lemma:
    - lemma: "صانع أدوات"
      confirm:
        - text: "«صانع [أو مُصْلِح] الأدوات [أو العُدَد].»"
          source: "المورد الحديث (2008) — ARABTERM، entry_id: 724016"
      expands:
        - text: "«صانع [أو مُصْلِح] الأدوات [أو العُدَد].»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يكشف النص المعجمي أن 'العُدَد' بديل كلاسيكي مقبول لـ'الأدوات'، وأن 'المُصْلِح' مرادف وظيفي للصانع في هذا السياق بالتبادل"

    - lemma: "القَيْنُ"
      confirm:
        - text: "«الْقَيْنُ: الْحَدَّادُ، لِأَنَّهُ يُصْلِحُ الْأَشْيَاءَ وَيَلُمُّهَا; وَجَمْعُهُ قُيُونٌ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الحَدَّاد, ثم أطلق على كل صانع»"
          source: "المعجم الوسيط"
        - text: "«القَيْنُ: الحَدَّادُ، وقيل: كل صانع قَيْنٌ»"
          source: "لسان العرب لابن منظور"
        - text: "«القَيْنُ الحدَّادُ ثم صار لكل صانع عند العرب وقيل: الذي يصلح الأسنَّة»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«كُلّ صانِع عندهم قَيْنٌ»"
          source: "المحيط في اللغة للصاحب بن عباد"
      contradicts:
        - text: "«القَيْنُ: الحَدَّادُ. وقيل: كل صانع: قين. والجمع: أقيان، وقيون... والقَيْنُ: العبدُ»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          conflict: "القين يحمل معنى 'العبد' إلى جانب 'الصانع'، مما يُوقع في الاشتراك اللفظي ويجعله غير صالح مصطلحاً دقيقاً لصانع الأدوات"
        - text: "«الحداد العبد المغنية (في العامة) أو الرجل المتزين باللباس (عند العرب)»"
          source: "كتاب العين"
          conflict: "أقدم المعاجم تُثبت معنى الحداد والعبد لا صانع الأدوات بعمومها"

    - lemma: "مِصْنَاعٌ"
      evidence_status: "no_material_found"

    - lemma: "صَانِعُ العُدَد"
      confirm:
        - text: "«صانع [أو مُصْلِح] الأدوات [أو العُدَد].»"
          source: "المورد الحديث (2008) — ARABTERM، entry_id: 724016"
      expands:
        - text: "«(عُدَّة) أداة»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يثبت أن العُدَّة مرادفة للأداة في المعاجم الحديثة، مما يُسند صحة المركب 'صانع العُدَد' ويُرسّخ تثبيته المعجمي"

    - lemma: "صَنَّاعٌ"
      confirm:
        - text: "«الماهر في الصناعة. يقال: رجلٌ أو امرأة صَنَاعُ اليد أو اليدين: ماهر أو ماهرة في العمل باليدين»"
          source: "المعجم الوسيط"
        - text: "«رجلٌ صُنَاعُ اليَدَيْنِ: حاذِقٌ ماهرٌ فى الصَّنْعَةِ مُجِيدٌ»"
          source: "المعجم الكبير"
        - text: "«وَامْرَأَةٌ صَنَاعٌ وَرَجُلٌ صَنَعٌ، إِذَا كَانَا حَاذِقَيْنِ فِيمَا يَصْنَعَانِهِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«الخَشَبُ يُتَّخَذُ ليُحْبَسَ به الماءُ ويمسكه حينًا»"
          source: "المعجم الكبير"
          conflict: "اشتراك لفظي صريح: الصَّنَّاع يعني خشبة حبس الماء في مجرى النهر، مما يُلبّس على القارئ بين المعنيين المتباينين"
        - text: "«(الصناع) خشب ونحوه يوضع في مجرى الماء لحبسه والماهر في الصناعة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "معنى 'الماهر في الصناعة' عام جداً يشمل كل حرفي ولا يخصص صانع الأدوات"


