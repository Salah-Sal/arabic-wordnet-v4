    - lemma: "صَانِعُ العُدَد"
      source: stage1
      decision: confirmed
      decision_reason: "مؤكد من المورد الحديث (2008) الذي ذكر 'العُدَد' صراحةً بديلاً لـ'الأدوات' في ترجمة toolmaker. يُضيف بُعداً كلاسيكياً فصيحاً تُشير إليه معاجم عريقة، والعُدَّة مرادفة للأداة في المعجمية العربية."
      evidence_assessment:
