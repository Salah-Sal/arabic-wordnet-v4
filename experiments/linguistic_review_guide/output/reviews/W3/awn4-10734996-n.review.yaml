# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة 'صانع أدوات' خالية من التشكيل الكامل"
      - "اللمة مركب إضافي وصفي لا مصطلح مسكوك بمعنى دقيق"
      - "غياب بدائل كلاسيكية فصيحة تُثري المجموعة"
      - "الجنس القريب في التعريف ('شخص') عام جداً"
    observations: "المجموعة تصف مفهوماً حرفياً محدداً هو المتخصص في صنع الأدوات وإصلاحها. التعريف العربي صحيح دلالياً لكنه يفتقر إلى الدقة المصطلحية التي يوفرها الجنس القريب الأدق 'حِرَفِيّ'. اللمة الحالية 'صانع أدوات' تعبير إضافي مباشر يؤدي الغرض لكنه يفتقر إلى التشكيل. العربية لا تمتلك مصطلحاً أحادياً متخصصاً لهذه المهنة تحديداً، مما يجعل المركبات الإضافية الملاذ المعجمي الطبيعي."
  blind_candidates:
    - lemma: "القَيْنُ"
      generation_method: majaz
      justification: "القَيْن في العربية الكلاسيكية هو الحداد، ثم اتسع ليشمل كل صانع يُصلح الأشياء ويعمل بالحديد. المشابهة الوظيفية بين القين القديم وصانع الأدوات الحديث (كلاهما يصنع ويُصلح) تجعله مرشحاً بالمجاز عبر إحياء لفظ قديم."
    - lemma: "مِصْنَاعٌ"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (صنع) على وزن مِفْعَال الدال على المهارة والإتقان في الصنعة، كمِعْمَار ومِنْجَار. يناسب دلالة المتخصص الماهر في صنع الأدوات."
    - lemma: "صَانِعُ العُدَد"
      generation_method: tarkib
      justification: "مركب إضافي يستخدم 'العُدَد' (جمع عُدَّة) بدلاً من 'الأدوات'، إذ العُدَّة هي الأداة في العربية الكلاسيكية. اختبار السكّ: لا يمكن إبدال 'عُدَد' بـ'أشياء' مع بقاء المعنى المصطلحي ذاته، مما يثبت تثبيته المعجمي."
    - lemma: "صَنَّاعٌ"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (صنع) على وزن فَعَّال الدال على الاحتراف والمهارة في الصنعة. يدل على من يمتهن الصنع ويتخصص فيه، وقد ورد في المعاجم بمعنى الحاذق ماهر الصنعة."


