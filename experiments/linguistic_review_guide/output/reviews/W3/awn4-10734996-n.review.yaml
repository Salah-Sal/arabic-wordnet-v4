      actions:
        - command: create_entry
          params:
            lemma: "صَانِعُ العُدَد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "صَنَّاعٌ"
