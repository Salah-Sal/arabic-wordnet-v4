# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13978438-n (entelechy)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان بلا تشكيل كامل"
      - "«إنتليخيا» معرَّب يوناني غير مثبت في المعاجم العربية التقليدية"
      - "«كمال التحقق» مركب إضافي لم يُعثر عليه كمدخل معجمي مستقل، لكن مكوّناته واردة في كتب المصطلحات"
    observations: >-
      المجموعة تعالج مفهوماً أرسطياً متخصصاً (الإنتليخيا) يقع عند تقاطع الفلسفة اليونانية
      والمصطلح العربي الكلامي. المفهوم حاضر في التراث الفلسفي العربي عبر ترجمات أرسطو
      (حنين بن إسحاق وغيره)، وقد عبّر عنه الفلاسفة المسلمون بصياغات متعددة.
      الفعلية (hypernym) مفهوم أعمّ، أمّا الإنتليخيا فهي الفعلية الكاملة المحققة.
  blind_candidates:
    - lemma: "كَمَالُ الفِعْلِ"
      generation_method: tarkib
      justification: >-
        مركب إضافي يجمع بين «كمال» (التمام) و«الفعل» (ضدّ القوة في اصطلاح الحكماء).
        يؤدي المعنى الأرسطي لحالة التحقق الكامل بالفعل في مقابل الإمكانية.
    - lemma: "تَحَقُّقِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مصدر صناعي من «تحقّق» على وزن تَفَعُّلِيَّة، يفيد حالة التحقق المطلق.
        لكنه لا يميّز بين التحقق الجزئي والكامل.
    - lemma: "إِنْتِلِيخِيَا"
      generation_method: taarib
      justification: >-
        تعريب مباشر للمصطلح اليوناني entelecheia الأرسطي. جرى عليه القلم
        في الكتابات الفلسفية العربية المعاصرة. يقبل لام التعريف والنسبة.
    - lemma: "اسْتِنْجَاز"
      generation_method: ishtiqaq
      justification: >-
        من الجذر «نجز» على وزن اسْتِفْعال، بمعنى طلب النَّجاز (الكمال والتمام).
        ورد في المعجم الطبي الموحد مقابلاً لـ entelechy.


stage2_evidence:
  per_lemma:
    - lemma: "إِنْتِلِيخِيَا"
      expands:
        - text: "«اسْتِنْجاز — entelechy — entéléchie»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المعجم الطبي يستعمل «استنجاز» مقابلاً لـ entelechy لا «إنتليخيا»، مما يشير إلى وجود بديل عربي مشتق"

    - lemma: "كَمَالُ التَّحَقُّقِ"
      confirm:
        - text: "«التّحقّق: هو عند الأشاعرة مرادف للثبوت والكون والوجود. وعند المعتزلة مرادف للثبوت وأعم من الكون والوجود»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الكمال: بالفتح وتخفيف الميم عند الحكماء يطلق على معنيين. أحدهما الحاصل بالفعل سواء كان مسبوقا بالقوة... وإنّما سمّي الحاصل بالفعل كمالا لأنّ في القوة نقصانا والفعل تمام بالقياس إليها... وبهذا المعنى يقال الكمال خروج الشيء من القوة إلى الفعل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«والفعل المقابل بالقوة هو التحقق في أحد الأزمنة»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«الكمال: الانتهاء إلى غاية ليس وراءها مزيد من كل وجه، ذكره الحرالي. وقال ابن الكمال: كمال الشيء حصول ما فيه الغرض منه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يوسّع مفهوم الكمال بوصفه بلوغ الغاية القصوى وحصول الغرض"

    - lemma: "كَمَالُ الفِعْلِ"
      confirm:
        - text: "«الكمال: الحاصل بالفعل... وبهذا المعنى يقال الكمال خروج الشيء من القوة إلى الفعل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«الفِعْل: هو التأثير... والفعل المقابل بالقوة هو التحقق في أحد الأزمنة»"
          source: "دستور العلماء للأحمدنكري"
          addition: "يربط الفعل بالتحقق الزمني في مقابل القوة"

    - lemma: "تَحَقُّقِيَّة"
      evidence_status: "no_material_found"

    - lemma: "اسْتِنْجَاز"
      confirm:
        - text: "«اسْتِنْجاز — entelechy — entéléchie»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«(نَجَزَ) النون والجيم والزاء أصل صحيح يدل على كمال شيء في عجلة من غير بطء. يقال: نجز الوعد ينجز»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر نجز يدل على الكمال والتمام، مما يناسب مفهوم الإنتليخيا دلالياً"


stage3_analysis:
  per_lemma:
    - lemma: "إِنْتِلِيخِيَا"
      decision: confirmed
      decision_reason: >-
        مصطلح معرَّب من اليونانية راسخ في الاستعمال الفلسفي العربي المعاصر.
        لا يوجد بديل عربي مفرد يؤدي دلالته بدقة. وهو الشكل المتداول في
        المراجع الفلسفية العربية (عبد الرحمن بدوي، يوسف كرم، وغيرهم).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يحيل مباشرة إلى المصطلح الأرسطي بلفظه الأصلي المعرَّب،
        ويُستعمل في السياقات الأكاديمية والفلسفية المتخصصة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِنْتِلِيخِيَا"

    - lemma: "كَمَالُ التَّحَقُّقِ"
      decision: confirmed
      decision_reason: >-
        مركب إضافي عربي صحيح يجمع مفهومَي الكمال والتحقق الواردَين في كتب
        المصطلحات الفلسفية الإسلامية. مكوّناه مؤكَّدان في التهانوي والأحمدنكري
        والمناوي. يوفّر بديلاً عربياً وصفياً للمصطلح المعرَّب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        صياغة عربية وصفية تشرح المفهوم بلغة الفلسفة الإسلامية، تُستعمل
        في السياقات التعليمية والتفسيرية حيث يُراد إيضاح المعنى لا مجرد الإحالة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَمَالُ التَّحَقُّقِ"

    - lemma: "كَمَالُ الفِعْلِ"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم ورود «الكمال» و«الفعل» في المصادر الفلسفية بصلة بالمعنى، فإنّ
        المركب «كمال الفعل» قد يلتبس بمعنى «إتقان العمل» في الاستعمال العام.
        كما أنّ «كمال التحقق» الموجود أدقّ تعبيراً عن الإنتليخيا.

    - lemma: "تَحَقُّقِيَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا شاهد معجمي ولا استعمال مثبت. المصدر الصناعي «تحققية» لا يميّز
        بين التحقق الجزئي والكامل، فهو أعمّ من المطلوب. كما أنه يقارب
        معنى «الفعلية» (hypernym) دون إضافة فارق نوعي.

    - lemma: "إِنْتِلِيخِيَا"
      source: stage1
      decision: removed
      decision_reason: >-
        مطابق للمّة الموجودة. لا حاجة لإضافته مرة ثانية.

    - lemma: "اسْتِنْجَاز"
      source: stage1
      decision: removed
      decision_reason: >-
        ورد في المعجم الطبي الموحد مقابلاً لـ entelechy، لكنه غير متداول
        في الكتابات الفلسفية العربية. الجذر «نجز» يتضمن معنى العجلة
        والسرعة وهو بعيد عن الدلالة الأرسطية للتحقق الكامل المستقر.
        إضافته قد تُحدث التباساً مع استعماله الطبي المحدود.


stage4_content:
  definition:
    current: "(عند أرسطو) حالة الشيء المتحقق بالكامل؛ الفعليّة في مقابل الإمكانية"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي جيد في مضمونه لكنه يحتاج إلى تحسين أسلوبي:
        إضافة الجنس القريب الصريح، واستعمال المصطلحات الفلسفية الدقيقة
        (بالفعل/بالقوة) بدلاً من (الفعلية/الإمكانية).
    authored:
      - type: terminological
        text: "حالةٌ فلسفيّةٌ أرسطيّةٌ تدلّ على بلوغ الشيء كمالَه الفعليَّ وخروجه من القوّة إلى الفعل خروجاً تامّاً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مصطلح أرسطيّ يعني الحالة التي يصير فيها ما كان بالقوّة متحققاً بالفعل تحققاً كاملاً؛ فالبذرة مثلاً بالقوّة شجرةٌ، والشجرة الكاملة النموّ هي إنتليخيا البذرة. وقد استعمله أرسطو في تعريف النفس بأنها كمالٌ أوّل لجسمٍ طبيعيّ آليّ ذي حياة بالقوّة."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالةٌ فلسفيّةٌ أرسطيّةٌ تدلّ على بلوغ الشيء كمالَه الفعليَّ وخروجه من القوّة إلى الفعل خروجاً تامّاً."

  examples:
    per_lemma:
      - lemma: "إِنْتِلِيخِيَا"
        examples:
          - text: "عرّف أرسطو النفسَ بأنّها إنتليخيا الجسم الطبيعيّ الآليّ ذي الحياة بالقوّة."
            type: usage
      - lemma: "كَمَالُ التَّحَقُّقِ"
        examples:
          - text: "يرى الفلاسفة أنّ كمال التحقق يعني انتقال الموجود من حالة الإمكان إلى حالة الوجود الفعليّ التامّ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "عرّف أرسطو النفسَ بأنّها إنتليخيا الجسم الطبيعيّ الآليّ ذي الحياة بالقوّة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يرى الفلاسفة أنّ كمال التحقق يعني انتقال الموجود من حالة الإمكان إلى حالة الوجود الفعليّ التامّ."


