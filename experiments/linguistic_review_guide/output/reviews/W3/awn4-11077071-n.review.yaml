# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «هولمز» مبهمة للغاية؛ تشترك في الاسم مع أبيه أوليفر ويندل هولمز الأب (1809-1894) الطبيب الشاعر، وغيره من المشاهير الحاملين لهذا اللقب."
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل الإلزامي في AWN4."
      - "لا تتضمن اللمّة الطويلة «أوليفر ويندل هولمز» مُميِّز «الابن» الضروري للتفريق بين القاضي (1841-1935) ووالده."
      - "التعريف الحالي يصفه بـ«قانوني» فحسب، في حين أن منصبه الأبرز هو قاضٍ في المحكمة العليا الأمريكية، وهو تمييز جوهري."
    observations: >
      هذه المجموعة الترادفية اسم علم لشخص تاريخي بعينه هو أوليفر ويندل هولمز الابن (1841-1935)،
      قاضي المحكمة العليا الأمريكية الأشهر في القرن العشرين. المجموعة تنتمي إلى صنف الأعلام
      المنقولة بالتعريب الصوتي (transliteration) من الإنجليزية، ولا يُرجى توليد مصطلح عربي
      أصيل لها. التحدي المنهجي الرئيسي هو الإزالة التامة للإبهام عبر إدراج «الابن» في كل صيغة
      مرجعية، وتوحيد التشكيل. لا ينطبق على هذه المجموعة منهجُ توليد المصطلح الاشتقاقي أو
      المجازي، إذ إن المفهوم اسم علم لا مصطلح تقني؛ وعليه تُبنى المرشحات الأربعة كلها على
      أساس إما تاريب الصيغة الكاملة أو تركيب صيغ مرجعية مختصرة.

  blind_candidates:
    - lemma: "أُولِيفَر وِيندِل هُولمز الاِبْن"
      generation_method: tarkib
      justification: >
        الصيغة الكاملة للاسم مضاف إليها «الابن» (إضافي وصفي) لرفع الإبهام عن الأب
        صاحب الاسم نفسه؛ هذا هو التعريب الصوتي الأكمل والأكثر وضوحاً في المصادر العربية.
    - lemma: "هُولمز الاِبْن"
      generation_method: tarkib
      justification: >
        صيغة مرجعية مختصرة (إضافي) تُستخدم في السياقات التي سبق فيها ذكر الاسم الكامل؛
        إضافة «الابن» ضرورية للتمييز. مناسبة كلمّة بديلة مختصرة داخل المجموعة.
    - lemma: "أُولِيفَر هُولمز"
      generation_method: taarib
      justification: >
        صيغة مختصرة تعريبية تحذف «ويندل» (الاسم الأوسط)؛ شائعة في بعض المراجع العربية
        غير الرسمية، وإن كانت أقل دقة من الصيغة الكاملة لعدم تضمنها «الابن».
    - lemma: "هُولمز جونيور"
      generation_method: taarib
      justification: >
        تعريب مركّب يجمع اللقب الإنجليزي «هولمز» مع «جونيور» (Jr.) معرَّباً؛ يُلجأ إليه
        أحياناً في الكتابة العربية الصحفية، غير أن هذا التركيب يخلط بين نظامين لغويين
        وقد يبدو ركيكاً في النص العربي الفصيح.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  query_log:
    - query_index: 1
      purpose: "مطابقة دقيقة دفعية لجميع اللمّات الموجودة والمرشحات"
      terms_searched:
        - "هولمز"
        - "الهولمز"
        - "اوليفر ويندل هولمز"
        - "اوليفر هولمز"
        - "هولمز الابن"
        - "القاضي هولمز"
      result: "لا نتائج — لا توجد مداخل معجمية في قاعدة البيانات تطابق هذه الأشكال."
    - query_index: 2
      purpose: "الجسر الإنجليزي — Holmes / Oliver Wendell Holmes"
      result: >
        أعادت ستة مداخل كلها لا تتعلق بالشخصية القانونية المقصودة:
        «طراز شارلوك هولمز» (نسيج)، «تنكس هولمز» (أعصاب)، «ظاهرة هولمز» (أعصاب)،
        «ظاهرة هولمز-ستيوارت» (أعصاب)، «متلازمة هولمز-إيدي» (أعصاب)،
        «لزمة آدي» (أعصاب). جميعها مصطلحات طبية تحمل اسم هولمز الطبيب أو هولمز
        الأعصاب، لا القاضي أوليفر ويندل هولمز الابن.
    - query_index: 3
      purpose: "FTS عربي بكلمات مفتاحية: قانوني، فقيه، ليبرالي — مقيَّد بـ proper_noun"
      result: "لا نتائج."

  per_lemma:
    - lemma: "أوليفر ويندل هولمز"
      evidence_status: "no_material_found"

    - lemma: "هولمز"
      evidence_status: "no_material_found"

    - lemma: "أُولِيفَر وِيندِل هُولمز الاِبْن"
      evidence_status: "no_material_found"

    - lemma: "هُولمز الاِبْن"
      evidence_status: "no_material_found"

    - lemma: "أُولِيفَر هُولمز"
      evidence_status: "no_material_found"

    - lemma: "هُولمز جونيور"
      evidence_status: "no_material_found"

  evidence_note: >
    غياب الأدلة المعجمية متوقع تماماً لهذا النوع من المجموعات؛ المعاجم العربية الكلاسيكية
    والمصطلحية (ALECSO) لا تُسجّل أعلام الأشخاص التاريخيين الأجانب. نتائج الجسر
    الإنجليزي أثبتت تضارب دلالي (هولمز الطبي ≠ هولمز القانوني)، مما يعزز ضرورة
    إزالة الإبهام في اللمّات.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "أوليفر ويندل هولمز"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة في جوهرها وتمثّل التعريب الأكثر شيوعاً للاسم في المراجع العربية،
        لكنها تحتاج إلى إصلاحَيْن: إضافة التشكيل الكامل، وإضافة «الابن» لرفع الإبهام.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الكاملة للاسم؛ تُستخدم في السياقات الرسمية والأكاديمية والموسوعية عند
        الإشارة إلى الشخصية لأول مرة، وتتيح التمييز التام عن الأب بعد إضافة «الابن».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُولِيفَر وِيندِل هُولمز الاِبْن"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "هولمز"
      decision: removed
      decision_reason: >
        اللمّة مبهمة بشكل حاد: «هولمز» وحده لا يُعيَّن به شخص بذاته داخل AWN4 أو
        خارجها؛ فهو يشترك بين القاضي أوليفر ويندل هولمز الابن، وأبيه الطبيب الشاعر،
        وأشخاص آخرين. لا توجد سياقات عربية تستخدمه منفرداً للإشارة حصراً إلى القاضي.
        إزالته تُقلّص خطر التعامل الخاطئ مع البيانات.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١ — أُولِيفَر وِيندِل هُولمز الاِبْن ──
    - lemma: "أُولِيفَر وِيندِل هُولمز الاِبْن"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة هي عين الصيغة المحدَّثة للمّة الموجودة «أوليفر ويندل هولمز» بعد
        إضافة التشكيل و«الابن». وقد تُولِّدها إجراءُ update_lemma في اللمّة ١ دون
        الحاجة إلى إنشاء مدخل مستقل. إنشاء مدخلَيْن متطابقَيْن سيُفضي إلى تكرار.

    # ── مرشح المرحلة ١ — هُولمز الاِبْن ──
    - lemma: "هُولمز الاِبْن"
      source: stage1
      decision: confirmed
      decision_reason: >
        صيغة مرجعية مختصرة مقبولة في السياقات العربية التي سبق فيها ذكر الاسم الكامل.
        إضافة «الابن» تُزيل الإبهام الجوهري الموجود في «هولمز» وحده. اجتازت اختبار
        التمييز: «هولمز الابن» ≠ «هولمز الأب» دلالياً وفي قواعد البيانات القانونية
        العربية. مقبولة كلمّة ثانوية مستقلة داخل المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        صيغة إحالية مختصرة مناسبة للاستخدام السياقي بعد الإشارة الأولى بالاسم الكامل؛
        تُقدّم الصفة «الابن» عاملَ تمييز صريحاً ودقيقاً دون ثقل الاسم الكامل.
      actions:
        - command: create_entry
          params:
            lemma: "هُولمز الاِبْن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-11077071-n"

    # ── مرشح المرحلة ١ — أُولِيفَر هُولمز ──
    - lemma: "أُولِيفَر هُولمز"
      source: stage1
      decision: removed
      decision_reason: >
        حذف الاسم الأوسط «ويندل» وغياب «الابن» يُبقيان الإبهام قائماً: قد تشير
        «أُولِيفَر هُولمز» إلى الأب أو الابن على حدٍّ سواء. لا قيمة مضافة على الصيغة
        الكاملة المحدَّثة.

    # ── مرشح المرحلة ١ — هُولمز جونيور ──
    - lemma: "هُولمز جونيور"
      source: stage1
      decision: removed
      decision_reason: >
        التركيب يجمع بين لقب عربي ومصطلح إنجليزي معرَّب («جونيور») في وحدة واحدة،
        مما يُفضي إلى ازدواجية لغوية مرفوضة في الفصيح. فضلاً عن ذلك، «الابن» هو
        المكافئ العربي الفصيح والأوضح لـ«Jr.»، وهو ما تتضمنه الصيغ المعتمدة.


