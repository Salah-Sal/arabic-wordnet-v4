        mwe_type: wasfi
      nuance_differentiation: "الاسم الثنائي الكامل (الاسم الشخصي + اللقب العائلي)؛ يُستخدم في التوثيق الرسمي والتعريف الأكاديمي حيث يُشترط التمييز التام بين أصحاب اللقب المشترك"
      actions:
        - command: update_lemma
