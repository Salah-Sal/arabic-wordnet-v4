      decision_reason: "الاسم الكامل للمعماري الأمريكي؛ يُمثّل الإحالة الأولى والأكثر دقةً في التمييز. غياب الأدلة المعجمية أمر طبيعي لأعلام الأشخاص الأجانب ولا يُسقط اللمّة. التعريب الصوتي المعتمد دارج في المصادر الأكاديمية والإعلامية العربية. يستلزم إضافة تشكيل كامل"
      evidence_assessment:
        case: no_material
      mwe_check:
