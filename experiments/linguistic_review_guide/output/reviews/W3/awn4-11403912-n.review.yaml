            new_lemma: "سْتانْفُورد وَايْت"

    - lemma: "وايت"
      decision: confirmed
      decision_reason: "اللقب المختصر مقبول كمداخلة ثانوية يُستعان بها في سياق يكون فيه المقصود واضحاً؛ كثير من قواميس الأعلام تُثبت الاسم الأخير مرجعاً مختصراً. غياب الأدلة المعجمية متوقَّع. يستلزم إضافة تشكيل"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب المختصر وحده؛ يُستخدم في الإشارة الضمنية بعد أن يُحدَّد السياق أن المقصود هو ستانفورد وايت لا غيره ممن يحملون هذا اللقب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَايْت"

    # ── مرشحات المرحلة ١ ──

    - lemma: "سْتانْفُورد وَايْت"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمّة الموجودة 'ستانفورد وايت' بعد إضافة التشكيل فحسب؛ تمت معالجته بأمر update_lemma على اللمّة الموجودة"

    - lemma: "وَايْت"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمّة الموجودة 'وايت' بعد إضافة التشكيل فحسب؛ تمت معالجته بأمر update_lemma على اللمّة الموجودة"

    - lemma: "سْتانْفُورد"
      source: stage1
      decision: removed
      decision_reason: "الاسم الأول وحده قاصر عن التمييز؛ 'ستانفورد' يُطلق كذلك على مدينة وجامعة وعدد من الشخصيات، فالالتباس الإحالي مرتفع. لا سند معجمي ولا دليل على استعماله مستقلاً للإحالة إلى هذا الشخص"

    - lemma: "ستانفورد وايت المعماري"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل اختبار السكّ: 'المعماري' قابل للإبدال بـ'المصمّم' أو 'المهندس' مع بقاء الوصف صالحاً، مما يؤكد أنها ليست وحدة معجمية مسكوكة. كذلك هي أطول من الاسم الثنائي الكامل بلا مسوّغ معجمي"


