# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تخصّ اسم علَم شخصيًّا أجنبيًّا؛ التعريف لا يتضمن الاسم صراحةً مما يُقيّد التوليد الأعمى بالاستنتاج من التواريخ والتخصص فحسب"
      - "لفظ 'معماري' في التعريف الحالي أقرب إلى الصفة منه إلى الاسم في العربية المعاصرة؛ المعيار الدقيق هو 'مهندس معماري' كما جاء في المعجم الموحد للمصطلحات المهنية (مِعْمَار، مهندس معماري — architect)"
      - "لمّة 'وايت' مجردةً من الاسم الكامل قد تُفضي إلى التباس إحالي إذ يحمل هذا اللقب عدد من الشخصيات الغربية المختلفة"
    observations: "هذه مجموعة ترادفية لاسم علَم شخصي أجنبي، وهو المعماري الأمريكي ستانفورد وايت (1853-1906). الوسيلة الوحيدة لتمثيل مثل هذه الأسماء في الشبكة الدلالية العربية هي التعريب الصوتي (النقل الحرفي)، إذ لا يمكن توليد ما يناظرها بالاشتقاق أو المجاز أو التركيب الدلالي. يُعدّ وايت من رواد العمارة الأمريكية في الحقبة الذهبية (Gilded Age)، اشتُهر بأعماله في الطراز الكلاسيكي الجديد ضمن مكتب ماكيم وميد ووايت. المفهوم غريب ثقافيًّا عن المعجمية العربية التقليدية، وتندرج ملاءمته في خانة الإغفال (omission). منهجية التوليد المصطلحي المعتادة (المجاز، الاشتقاق، التركيب) غير مجدية لأعلام الأشخاص الأجانب؛ الملاذ الحتمي هو التعريب الصوتي."
  blind_candidates:
    - lemma: "سْتانْفُورد وَايْت"
      generation_method: taarib
      justification: "نقل صوتي عربي للاسم الكامل 'Stanford White'؛ يُرجَّح أن يكون صاحب هذا التعريف بناءً على التواريخ (1853-1906) والتخصص المهني، إذ يبرز هذا المعماري من بين معماريي الحقبة. الاسم الثنائي هو المرجع الأول للتمييز الدقيق"
    - lemma: "وَايْت"
      generation_method: taarib
      justification: "نقل صوتي للاسم الأخير 'White' وحده؛ يُستعمل مرجعاً مختصراً في السياقات التوثيقية حين يُفهم من القرينة أن المقصود هو هذا المعماري بعينه لا سواه"
    - lemma: "سْتانْفُورد"
      generation_method: taarib
      justification: "نقل صوتي للاسم الأول 'Stanford' وحده؛ أقل شيوعاً في الاستعمال المستقل، لكنه ممكن في نصوص توثيقية متخصصة تفيد من السياق للتعريف"
    - lemma: "ستانفورد وايت المعماري"
      generation_method: tarkib
      justification: "تركيب وصفي يُضيف لقب المهنة للتمييز الكامل؛ غير أنه يخفق في اختبار السكّ: يمكن إبدال 'المعماري' بـ'المصمّم' أو 'المهندس' مع بقاء الوصف صالحاً، مما يدل على أنه عبارة وصفية حرة لا وحدة معجمية مسكوكة"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   ١) مطابقة دفعية: headword_norm IN ('ستانفورد وايت','وايت','ستانفورد',...) → لا نتائج
#   ٢) الجسر الإنجليزي: translation_en:"Stanford White" OR "Stanford" OR "White" → نتائج لـ white كلون فقط
#   ٣) FTS عربي: "معماري" OR "وايت" → مصطلحات معمارية عامة، لا إدخالات لاسم الشخص
#   النتيجة: لا تتوفر في قاعدة البيانات المعجمية مداخل تخصّ اسم ستانفورد وايت بوصفه شخصية.
#   هذا متوقّع: المعاجم العربية (تراثية وحديثة) لا تُدرج أعلام الأشخاص الأجانب عادةً.
stage2_evidence:
  per_lemma:
    - lemma: "ستانفورد وايت"
      evidence_status: "no_material_found"
    - lemma: "وايت"
      evidence_status: "no_material_found"
    - lemma: "سْتانْفُورد وَايْت"
      evidence_status: "no_material_found"
    - lemma: "وَايْت"
      evidence_status: "no_material_found"
    - lemma: "سْتانْفُورد"
      evidence_status: "no_material_found"
    - lemma: "ستانفورد وايت المعماري"
      evidence_status: "no_material_found"


