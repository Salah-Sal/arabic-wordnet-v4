# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14442914-n
# contact: the state or condition of touching or of being in immediate proximity
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «اتصال» مشتركة مع المجموعة الفوقية (hypernym) awn4-14442568-n التي تحتوي على اللمّة نفسها بمعنى أعمّ (حالة الاتصال)، ممّا يُحدث التباساً دلالياً"
      - "اللمّتان الموجودتان بدون تشكيل كامل"
      - "المجموعة تفتقر إلى لفظ «تماسّ» وهو الأكثر دقّة ومطابقة للمفهوم المادّي (اللمس والقرب المباشر)"
    observations: >
      المفهوم يدلّ على حالة فيزيائية: أن يكون جسمان متلامسين أو في قرب مباشر.
      «اتصال» مصدر «اتّصل» من الجذر و ص ل، ودلالته الأصلية ضمّ الشيء إلى الشيء
      وهي أعمّ من التلامس المادّي. «تلامس» مصدر تفاعل من ل م س يدلّ على حصول
      اللمس المتبادل. المفهوم أصيل في العربية وله ألفاظ تراثية غنية من جذرَيْ م س س و ل م س.
  blind_candidates:
    - lemma: "تَمَاسّ"
      generation_method: ishtiqaq
      justification: >
        مصدر تفاعل من الجذر م س س على وزن تَفَاعُل، يدلّ على حصول المسّ المتبادل بين جرمين.
        وارد في المعجم الوسيط والمعاجم المصطلحية بمعنى contact في الفيزياء والكيمياء والجيولوجيا.
    - lemma: "مُمَاسَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر مفاعلة من الجذر م س س، يدلّ على ملاقاة الجرمين بلا حائل بينهما.
        ذكره المناوي والتهانوي في تعريف المفهوم الفيزيائي والهندسي.
    - lemma: "مُلَامَسَة"
      generation_method: ishtiqaq
      justification: >
        مصدر مفاعلة من الجذر ل م س، يدلّ على تبادل اللمس بين طرفين.
        وارد في المعاجم الكلاسيكية وإن غلب عليه معنى بيع الملامسة في الفقه.
    - lemma: "مَسِيس"
      generation_method: ishtiqaq
      justification: >
        على وزن فَعِيل من الجذر م س س، يدلّ على حالة المسّ.
        وارد في المعجم الوسيط لكن في سياق «مسيس الحاجة» بمعنى إلجائها.

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اتصال"
      confirm:
        - text: "«تماس بين مُوصِلين يسمح بمرور رسالة ما.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«اتصال، تماس»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
      expands:
        - text: "«الاتصال: اتحاد الأشياء بعضها ببعض، كاتصال طرفي الدائرة، ويضاده الانفصال.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الدلالة الأصلية أعمّ: ضمّ الشيء إلى الشيء واتحاد النهايات"
        - text: "«الاتصال في اللغة ضد الانفصال وهو أمر إضافي يوصف به الشيء بالقياس إلى غيره. ويطلق على أمرين: أحدهما اتحاد النهايات... وثانيهما كون الشيء بحيث يتحرّك بحركة شيء آخر»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "المعنى الاصطلاحي فلسفي واسع يتجاوز مفهوم اللمس المادّي"

    - lemma: "تلامس"
      confirm:
        - text: "«تلامس — contact»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (1996)"
        - text: "«التّلامس: اتصال بين مُوَصِّلين يجري خلالهما التيّار»"
          source: "المورد الحديث (2008)"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَمَاسّ"
      confirm:
        - text: "«الجِرْمانِ: مسَّ أحدهما الآخر. الزوجان: تباضعا. ﴿فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ مِن قَبْلِ أَن يَتَمَاسَّا﴾»"
          source: "المعجم الوسيط (OCR)"
        - text: "«تماسٌ — contact»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«تماس — contact»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«تَمَاسٌّ: تلامس بين جسدين أو شخصين يكفي لنقل العوامل الممرضة من أحدهما للآخر.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«تماس: التقارب الشديد بين شيئين.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      expands:
        - text: "«تماس: السطح الفاصل بين نوعين مختلفين من الصخور»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "دلالة جيولوجية متخصّصة: السطح البَيْنِي بين صخرتين"
        - text: "«(تماس) الجرمان مس أَحدهمَا الآخر والزوجان تباضعا»"
          source: "المعجم الوسيط (هورماني)"
          addition: "يؤكّد الدلالة المزدوجة: الماديّة (مسّ الأجرام) والكنائية (التباضع)"

    - lemma: "مُمَاسَّة"
      confirm:
        - text: "«المماسة: ملاقاة الجرمين بلا حائل بينهما، ذكره الحرالي.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«المماسّة: بتشديد السين هي ملاقاة الشيئين لا بالتمام بل بالأطراف كأن يلاقي طرف جسم بطرف جسم آخر.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«مُماسَّة؛ تَماسّ — tangency»"
          source: "المورد الحديث (2008)"
          addition: "في الاستعمال الحديث صارت مرادفة لـ tangency (المماسّة الهندسية) أكثر من contact العامّ"

    - lemma: "مُلَامَسَة"
      contradicts:
        - text: "«الملامسة: من بيوع الجاهلية هي أن يتساوم الرجلان على سلعة فإذا لمسها المشتري لزمه البيع.»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الدلالة المعجمية الغالبة فقهية (بيع الملامسة) لا فيزيائية"
        - text: "«الملامسة: هي أن يقول المشتري للبائع إذا لمست ثوبك ولمست ثوبي فقد وجب البيع.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "تأكيد الدلالة الفقهية في مصادر متعدّدة"

    - lemma: "مَسِيس"
      contradicts:
        - text: "«مَسِيسُ الحاجةِ: إِلجاؤها»"
          source: "المعجم الوسيط (OCR)"
          conflict: "الاستعمال محصور في تركيب «مسيس الحاجة» بمعنى الإلجاء والإلحاح لا بمعنى التلامس المادّي"
        - text: "«نحن في مَسِيس الحاجة إلى الاتحاد — مرفوضة... لأنها لم ترد بهذا المعنى. المعنى: إلجائها»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "لا يُستعمل بمعنى الحالة الفيزيائية للتلامس"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِتِّصَال"
      decision: confirmed
      decision_reason: >
        «اتصال» وارد في المعاجم المصطلحية بمعنى contact في عدّة حقول (علم الاجتماع، الإعلام، علوم البحار).
        وإن كانت دلالته الأصلية أعمّ (ضمّ الشيء إلى الشيء)، فإنّ الاستعمال المصطلحي الحديث
        يسوّغ إبقاءه. يُلاحظ تداخله مع المجموعة الفوقية لكنّ ذلك من باب تعدّد المعنى لا الخطأ.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ على حالة الارتباط والوصل بين شيئين بوجه عامّ، ويشمل التلامس المادّي والمعنوي.
        أعمّ دلالةً من «تلامس» و«تماسّ» اللذين يختصّان بالمسّ الحسّي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِتِّصَال"

    - lemma: "تَلَامُس"
      decision: confirmed
      decision_reason: >
        «تلامس» مصدر تفاعل من ل م س بمعنى تبادل اللمس. وارد في المعاجم المصطلحية
        الحديثة بمعنى contact (المعجم الموحد للمصطلحات المهنية والتقنية، المورد الحديث).
        دلالته أقرب إلى المفهوم الأصلي (اللمس المتبادل) من «اتصال».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختصّ بالمسّ المتبادل بين جسمين عبر اللمس الحسّي (من الجذر ل م س).
        أخصّ من «اتصال» وأقرب إلى الدلالة الحسّية من «تماسّ».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَلَامُس"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَمَاسّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        «تماسّ» أقوى المرشحات دليلاً: مصدر تفاعل من م س س، وارد في المعجم الوسيط
        بشاهد قرآني، وفي أكثر من عشرة معاجم مصطلحية (كيمياء، فيزياء، جيولوجيا، صيدلة، طبّ)
        بمعنى contact. تعريف الصيدلة «تلامس بين جسدين أو شخصين يكفي لنقل العوامل الممرضة»
        مطابق تماماً لمفهوم المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ على حالة مسّ أحد الجرمين للآخر (من الجذر م س س). أدقّ من «اتصال» في الدلالة
        على التلاقي المادّي، وأشيع في المصطلحية العلمية الحديثة من «تلامس».
      actions:
        - command: create_entry
          params:
            lemma: "تَمَاسّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُمَاسَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورودها في المعاجم الكلاسيكية بمعنى «ملاقاة الجرمين بلا حائل»، غلب عليها
        في الاستعمال الحديث المعنى الهندسي (tangency = المماسّة) وهو أخصّ من contact.
        المورد الحديث يترجمها بـ tangency لا contact. إضافتها تُحدث التباساً مع المفهوم الرياضي.

    - lemma: "مُلَامَسَة"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المعجمية الغالبة فقهية (بيع الملامسة من بيوع الجاهلية) في جميع المصادر الكلاسيكية
        التي وثّقتها (التهانوي، البركتي، الأحمدنكري). لا يُستعمل المصطلح بمعنى الحالة الفيزيائية للتلامس.

    - lemma: "مَسِيس"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال محصور في تركيب «مسيس الحاجة» بمعنى إلجائها وإلحاحها كما في المعجم الوسيط
        ومعجم الصواب اللغوي. لا يُستعمل بمعنى الحالة الفيزيائية للتلامس أو القرب المادّي.

