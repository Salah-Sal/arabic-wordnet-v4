# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "أستاذ"
      decision: confirmed
      decision_reason: >
        لفظ معرَّب من الفارسية (أُسْتَادْ) استُعمل في العربية منذ العصر الوسيط وشاع
        في المعاجم الكبرى بمعنى «الماهر في الصناعة يُعلِّمها غيره»؛ وهو المعنى المطابق
        للمجموعة. موثَّق في المعجم الوسيط والكبير ومختار عمر ولين، وتشير جميعها إلى
        «craftmaster». اللفظ مُتَداوَل فصيح جارٍ مجرى العرب ومستوفٍ لمعايير بوابة
        الجودة المصطلحية. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «أُسْتَاذ» أوسعُ استعمالاً من مُرادفه؛ يتضمَّن المعلمَ الجامعي والفنانَ الماهر
        وصاحبَ الحِرفة العالي المهارة، ويُستعمل في سياقات التعليم الرسمي الحديث.
        دلالته على سيادة المهارة وليس فقط حق تعليمها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُسْتَاذ"

    - lemma: "معلِّم حرفة"
      decision: confirmed
      decision_reason: >
        مُركَّب إضافي ثابت بالمعجم الوسيط والكبير بالمعنى المطابق للمجموعة: «أرفع
        درجات نظام الصُّنَّاع كالنجارين والحدَّادين، من له الحق في ممارسة إحدى المهن
        استقلالاً وتعليمها». التعبير وحدة معجمية راسخة (اختبار السكّ: لا يمكن إبدال
        «حرفة» بـ«مهنة» وإبقاء الاصطلاح كاملاً في هذا السياق التاريخي). يحتاج تشكيلاً
        كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        «مُعَلِّمُ حِرْفَة» مقيَّدٌ بالسياق الحرفي والصناعي التقليدي؛ يُشير تحديداً
        إلى من نال حق المزاولة الاستقلالية في نظام الطوائف الحِرَفية التاريخي وبات
        مُؤهَّلاً لقبول التلاميذ وتخريجهم. دلالته أضيق وأكثر تخصيصاً من «أُسْتَاذ».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعَلِّمُ حِرْفَة"

    - lemma: "شَيْخُ الصَّنْعَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا مادة معجمية مباشرة للتركيب كوحدة مُدرَجة. وإن كانت كلمة «شيخ» تُستعمل
        مجازياً لرئيس الطائفة، فإن «شيخ الصنعة» لم يثبت كمصطلح مسكوك في المعاجم
        العربية المعتمدة المتاحة، ولا يجتاز اختبار التثبيت المعجمي. وجود «أُسْتَاذ»
        و«مُعَلِّمُ حِرْفَة» يُغني عنه.

    - lemma: "مُمَرِّن"
      source: stage1
      decision: removed
      decision_reason: >
        «مُمَرِّن» يدل على المدرِّب الذي يكتسب غيره المهارة الجسدية أو العملية
        (coach/trainer)، وهو يُفيد عملية التمرين لا درجة التأهيل والإجازة في نظام
        الصُّنَّاع. السياق اللغوي الشائع للكلمة (مُمَرِّن رياضي، مُمَرِّن عسكري)
        يُبعدها عن دلالة «أُسْتَاذ الحِرفة». لا مادة معجمية تربطها بالمجموعة.

    - lemma: "مُحْتَرِف"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم تُعرِّف «مُحْتَرِفاً» بـ«من له حرفة وصنعة» — أي كل ممارس مهنة — دون
        اشتراط الكمال أو حق التعليم. المعنى في المجموعة أخصّ: من بلغ أرفع درجة في
        نظام الصُّنَّاع وأُجيز بتأهيل المبتدئين. «مُحْتَرِف» في الاستعمال الحديث
        يُعادل «professional» العامّ لا «master craftsman» الخاصّ. الأدلة تتعارض.

    - lemma: "عَارِف"
      source: stage1
      decision: removed
      decision_reason: >
        تشير جميع المعاجم الكلاسيكية والحديثة إلى أن «العارف» مصطلح صوفي راسخ
        («من أشهده الرب نفسه»، «المختص بمعرفة الله ومعرفة ملكوته»). المجاز المُقترح
        لم يجد أي دليل معجمي يُسانده في السياق الحِرَفي. الاستعمال الصوفي متحجِّر
        ويُخلق اشتراكاً لفظياً مُشكلاً لا مبرِّر له.


