# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «أستاذ» بدون تشكيل كامل؛ الصواب: أُسْتَاذ"
      - "لمّة «معلِّم حرفة» بتشكيل جزئي؛ الصواب الكامل: مُعَلِّمُ حِرْفَة"
      - "التعريف «خبير مؤهل لتعليم المبتدئين والمتدربين» مقبول لكنه يفتقر إلى الإحالة على سياق نظام الصُّنَّاع التاريخي الذي يُميّز هذه الدرجة"
      - "الفرق الدلالي بين اللمّتين غير موثَّق في البيانات الراهنة"
    observations: >
      المجموعة تصف «أُسْتَاذَ الحِرْفَة» بمفهومه التاريخي في نظام الطوائف الحرفية،
      وهو من بلغ أرفع درجات هذا النظام (فوق المتدرِّب والصانع) وأُجيز بمزاولة حرفته
      استقلالاً وتعليمها لغيره. اللمّتان الموجودتان (أستاذ ومعلِّم حرفة) موثَّقتان
      معجمياً بهذا المعنى تحديداً، لكنّ «أستاذ» الأوسعُ استخداماً في السياقات الحديثة
      (أكاديمية، فنية)، في حين «معلِّم حرفة» مقيَّد بالسياق الحرفي/الصناعي التقليدي.
      الكلمة الأولى دخيلة فارسية معرَّبة. المفهوم حاضر في التراث العربي وله تعبير
      وطيد في المعجمية.

  # ── التوليد العمياء: قُرئ الملف المُقنَّع أولاً، وتوليد المرشحات قبل الاطلاع على اللمّات ──
  blind_candidates:
    - lemma: "شَيْخُ الصَّنْعَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «شَيْخ» (رئيس/كبير القوم) و«الصَّنْعَة» — استُعمل «الشيخ»
        تاريخياً لقباً لرئيس الطائفة الحرفية في نظام الصُّنَّاع، فالتركيب يُوحّد
        معنى الكبارة والسيادة الحرفية مع السياق الذي يُجيز التعليم.

    - lemma: "مُمَرِّن"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر م-ر-ن على وزن مُفَعِّل (صيغة المبالغة في التفعيل)، والمُمَرِّن
        هو من يُمرِّن غيره ويُكسبه الدُّرْبة والمهارة، مما يُلائم «الخبير المؤهَّل
        لتعليم المبتدئين».

    - lemma: "مُحْتَرِف"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر ح-ر-ف على وزن مُفْتَعِل، من «احتَرَف» بمعنى اتَّخذ حرفةً
        وأتقنها، فالمُحْتَرِف متمكِّن من حرفته تمكُّناً يُؤهِّله للتعليم. الوزن
        يُفيد الاكتساب والتمكُّن في آنٍ.

    - lemma: "عَارِف"
      generation_method: majaz
      justification: >
        مجاز عن الجذر ع-ر-ف؛ «العارف» في سياق الحرف يعني المتمكِّن من معرفة
        أسرار صنعته، ويوازي استعمال «connoisseur / initiated» في المصادر الكلاسيكية.
        أُريد به إحياء استعمال مجازي يُميّز «الخبير العليم بأصول حرفته» عن مجرَّد
        الممارس.


