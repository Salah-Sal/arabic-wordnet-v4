# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة اسم علم لشخص بعينه؛ التوليد الأعمى لا يُنتج إلا تخمينات تعريبية لأن الاسم لا يُستنبط من التعريف"
      - "اللمّتان الموجودتان (كانينغهام وميرس كانينغهام) خاليتان تماماً من التشكيل"
      - "سنة الميلاد في التعريف (1922) مغلوطة — ميرس كانينغهام وُلد عام 1919م ورحل 2009م وفق المصادر الموثوقة (PWN 3.1 يُثبت 1919)"
      - "التعريف لا يذكر سنة الوفاة ولا الإطار التخصصي مما يُفقده إتمام الفائدة الموسوعية"
    observations: >
      تُمثّل هذه المجموعة اسم علم لراقص أمريكي ومصمم رقصات، وهو ميرس كانينغهام (Merce Cunningham).
      اللمّتان تعريبان للقب Cunningham والاسم الكامل Merce Cunningham.
      التوليد الأعمى في أسماء الأعلام الأجنبية مقيّد بالتخمين لأن الاسم لا يُستنبط من التعريف الوظيفي؛
      كل المرشحات المنشأة أعمى هي بدائل تعريبية في ضبط الأصوات لا مقابلات اشتقاقية.
      المشكلة الجوهرية مزدوجة: غياب التشكيل وخطأ سنة الميلاد.

  blind_candidates:
    - lemma: "كَانِنْغهَام"
      generation_method: taarib
      justification: "تعريب مقطعي مُبسَّط للقب إنجليزي أمريكي، يُخفَّف فيه المقطع الأوسط (كَا-نِن-غهَام) حفظاً لسهولة النطق العربي"
    - lemma: "كَانِينجهَام"
      generation_method: taarib
      justification: "تعريب بديل يُعالج ثنائية الصوت gh بكتابة 'جه' بدلاً من 'غه'، توجه ورد في بعض المصادر الصحفية العربية"
    - lemma: "مِيرِس"
      generation_method: taarib
      justification: "تعريب لاسم أول ذكوري أمريكي يُنطق /mɪrs/ أو قريباً منه، يمثّل الجزء الأول من الاسم الكامل"
    - lemma: "مِيرِس كَانِينجهَام"
      generation_method: taarib
      justification: "الاسم الكامل المُعرَّب جامعاً الاسم الأول واللقب، صيغة المراجع الموسوعية المرجعية"


