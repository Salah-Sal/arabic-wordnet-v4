# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "كانينغهام"
      decision: confirmed
      decision_reason: >
        تعريب شائع ومستقر في المراجع والصحافة العربية للقب Cunningham؛
        الغين (غ) هي الأقيس في تعريب gh الإنجليزية الصامتة بريطانياً/الساكنة حرفاً.
        اللمّة سليمة من حيث الاختيار الصوتي لكنها تفتقر إلى التشكيل الكامل وجبَ إضافته.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب (الاسم العائلي) وحده؛ يُستخدم في الإحالة المختصرة أو عند تكرار الذكر حيث يُغني اللقب عن الاسم الكامل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَانِينْغهَام"

    - lemma: "ميرس كانينغهام"
      decision: confirmed
      decision_reason: >
        الاسم الكامل لـ Merce Cunningham — الصيغة التعريفية الأولى والأكثر دلالة
        في الكتابة الموسوعية والمراجع المتخصصة.
        تعريب "Merce" بـ"ميرس" مقبول؛ الصوت /mɜːrs/ يُنقل إلى مِيرْس بإمالة قياسية.
        اللمّة تفتقر إلى التشكيل ويجب تحديثها. التعبير إضافي (اسم + لقب).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل (الاسم الأول + اللقب)؛ يُزيل الإبهام عند تعدد حاملي اللقب ويُمثّل الصيغة الإحالية الكاملة في السياق الأول"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيرْس كَانِينْغهَام"

    - lemma: "كَانِنْغهَام"
      source: stage1
      decision: removed
      decision_reason: "تداخل مع اللمّة الموجودة (كانينغهام) بفارق توشيع صوتي طفيف (كَانِن- مقابل كَانِين-)؛ لا مسوّغ معجمياً لإضافتها كلمّة مستقلة"

    - lemma: "كَانِينجهَام"
      source: stage1
      decision: removed
      decision_reason: "تعريب بديل بالجيم غير مستقر؛ الصيغة السائدة في المعاجم والمراجع العربية تستخدم الغين (كانينغهام) الأوفق لنقل gh الإنجليزية"

    - lemma: "مِيرِس"
      source: stage1
      decision: removed
      decision_reason: "الاسم الأول منفرداً لا يُحيل بدقة على شخص بعينه وليس لمّة معجمية مستقلة دون اللقب"

    - lemma: "مِيرِس كَانِينجهَام"
      source: stage1
      decision: removed
      decision_reason: "تعريب بالجيم غير مُستقر؛ يُرفض لصالح الصيغة الموجودة ميرس كانينغهام بالغين"


