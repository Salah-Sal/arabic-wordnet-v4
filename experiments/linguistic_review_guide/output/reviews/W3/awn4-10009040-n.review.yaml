# ── المرحلة ١: المراجعة والتوليد (أعمى) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (راقص، راقص محترف) خاليتان من التشكيل"
      - "لمّة «راقص» وحدها لا تُصرّح بالاحتراف، إذ تُستعمل في الاستعمال العام للدلالة على كل من يرقص لا على المحترف حصرًا"
      - "التعريف «مؤدٍ يرقص بشكل احترافي» ترجمة حرفية من الإنجليزية، وتعبير «بشكل احترافي» ركيك لا يلائم أسلوب المعجم الوسيط"
    observations: "المجموعة تنتمي إلى مفهوم عربي أصيل؛ الرقص فن معروف في التراث العربي ويُؤديه المحترفون منذ العصر الجاهلي. تفتقر المجموعة إلى صيغة المبالغة «رَقَّاص» التي وردت في كبار المعاجم بمعنى «محترف الرقص» صراحةً، وهي أوفى من «راقص» في التعبير عن الاحتراف المُضمَّن في تعريف المجموعة. يُلاحَظ تداخل دلالي محتمل بين «راقص» المطلق و«راقص محترف» المقيّد، مما يستدعي توثيق الفرق الدقيق بينهما."
  blind_candidates:
    - lemma: "رَقَّاص"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن فَعَّال الدال على الحرفة والكثرة والتمكّن، من الجذر (ر ق ص). هذا الوزن من أقدم صيغ الحرفة في العربية ويُستعمل لمحترفي الصنائع كخبّاز وحدّاد ونجّار، فيناسب تمامًا معنى «من يتّخذ الرقص مهنةً». المصدر الصناعي منه: الرقاصة."
    - lemma: "قَيَّان"
      generation_method: majaz
      justification: "إحياء لفظ تراثي كان يُطلق على الفنانين المؤدّين في الحضارة العربية. أصل قَيْنَة المغنية الراقصة في الأدب الجاهلي والأموي، والمجاز مقترَح من فنون الأداء الحيّ إلى الرقص تحديدًا."
    - lemma: "مُحْتَرِفُ الرَّقْص"
      generation_method: tarkib
      justification: "تركيب إضافي يجعل الاحتراف هو الركن الأساس في الوصف، من مُحْتَرِف (اسم الفاعل من احترف، وزن افتعل) + الرقص (المفعول به المضاف إليه). يُصرّح بالجانب المهني ويضعه في صدر التعبير."
    - lemma: "فَنَّانُ الرَّقْص"
      generation_method: tarkib
      justification: "تركيب إضافي يؤكد الطابع الفني للأداء، من فَنَّان (فَعَّال للتخصص في الفن) + الرقص. يبرز البُعد الجمالي والأدائي ويُدرج الراقص ضمن منظومة الفنون."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٦ استعلامات):
#   ١. مطابقة دفعية: راقص/الراقص/رقاص/الرقاص/قيان/القيان/محترف الرقص/فنان الرقص
#   ٢. الجسر الإنجليزي: dancer / professional dancer / terpsichorean / dancing
#   ٣. إثراء مُدمج (تعريفات + شواهد + جموع) للمعرّفات المُجتمَعة
#   ٤. FTS عربي: راقص / رقاص / راقص محترف / محترف الرقص
#   ٥. مطابقة مباشرة لـ راقص/الراقص (أصناف المصادر OCR وHawramani)
#   ٦. مقاييس اللغة لجذرَي رقص وحرف
stage2_evidence:
  per_lemma:
    - lemma: "رَاقِص"
      confirm:
        - text: "«مَنْ يَحْتَرف الرَّقْصَ»"
          source: "المعجم الكبير"
        - text: "«(1) الرّاقص (2) الراقصة» — translation_en: dancer"
          source: "المورد الحديث (2008)"
        - text: "«راقص (ة)» — translation_en: dancer"
          source: "مسرد الفن والتسلية والرياضة (ALECSO)"
      expands:
        - text: "«راقصُ الباليْه»"
          source: "المورد الحديث (2008)"
          addition: "يُستعمل «راقص» رأسًا لمُركَّبات الإضافة التخصيصية، كراقص الباليه وراقص الفلامنكو وراقص الشعبي، مما يؤكد رسوخه معجميًا ومرونته في التركيب"

    - lemma: "رَاقِص مُحْتَرِف"
      confirm:
        - text: "«الرّاقص المستأجَر: راقص محترف تستأجره النِّسوةُ لمراقصتهنّ في الحانات»"
          source: "المورد الحديث (2008)"
        - text: "«الراقصة: الراقصة المحترفة» — translation_en: dancing girl"
          source: "المورد الحديث (2008)"

    - lemma: "رَقَّاص"
      confirm:
        - text: "«الكثيرُ الرقص / محترف الرقص / بندول الساعة»"
          source: "المعجم الوسيط"
        - text: "«الكثيرُ الرَّقْصِ... محترفُ الرَّقْص... بُنْدُولُ الساعةِ»"
          source: "المعجم الكبير"
        - text: "«(الرقاص) الْكثير الرقص ومحترفه و(بندول السَّاعَة)»"
          source: "المعجم الوسيط (رواية الهوراماني)"
        - text: "«رَقَّاص: من (ر ق ص) الكثير الرقص ومحترفه، وبندول الساعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«رقَّاص الساعة [فصيحة] — تستخدم المعاجم الحديثة كلمتي «بَنْدول» أو «رقَّاص»»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يُميّز بين استعمالَيْن متمايزَيْن: رقّاص بمعنى محترف الرقص (الأصل التراثي) ورقّاص الساعة (إزاحة دلالية معاصرة مقبولة)، مما يؤكد حيوية اللفظ واستمرار توظيفه"

    - lemma: "قَيَّان"
      contradicts:
        - text: "«قَيَّان: من (ق ي ن) محترف الحدادة، وصانع الحديد ومسويه، وجامع الشيء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "قَيَّان في مفرده المذكر يُحيل إلى الحداد وصانع الحديد، وهو بعيد كل البُعد عن فن الرقص"
        - text: "«قِيَان: من (ق ي ن) جمع قَيْنَة بمعنى المغنية، والأمة صانعة أو غير صانعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "القِيَان جمع قَيْنَة التي هي المغنية لا الراقصة تحديدًا؛ الجذر (ق ي ن) يدل على الصناعة والتشكيل والغناء، لا على الرقص"

    - lemma: "مُحْتَرِفُ الرَّقْص"
      evidence_status: "no_material_found"

    - lemma: "فَنَّانُ الرَّقْص"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "راقص"
      decision: confirmed
      decision_reason: "اسم الفاعل الصرفي المتداول لمن يرقص؛ عرّفه المعجم الكبير صراحةً بـ«من يحترف الرقص»، وهو الترجمة المعتمدة في المعاجم الحديثة للـ dancer. يحتاج إلى تشكيل كامل (رَاقِص). اجتاز فحص الاطّراد والشيوع وإيثار العربي والاشتقاقية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الاسم الشائع المطلق في الاستعمال اليومي والأدبي، أصله اسم الفاعل (فاعل) من رقص؛ يُستعمل للدلالة على الراقص دون تصريح باحترافه في السياق اليومي، لكن في الاصطلاح المعجمي يُحيل إلى المحترف. هو الحدّ الأدنى في التعبير عن المفهوم."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَاقِص"

    - lemma: "راقص محترف"
      decision: confirmed
      decision_reason: "مُركَّب وصفي راسخ الاستعمال مشهود له في المورد الحديث. يُصرّح بالاحتراف صراحةً بخلاف «راقص» المطلق. اجتاز اختبار المركَّب: لا يمكن إبدال «محترف» بمرادفه «متمرّس» دون تغيير الدلالة الاصطلاحية. يحتاج إلى تشكيل (رَاقِص مُحْتَرِف)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُفرّق صراحةً بين الراقص الهاوي والمحترف بإضافة صفة الاحتراف؛ مناسب للسياقات الرسمية والتوثيقية والإدارية حيث يُشترط تمييز المحترف قانونيًا أو ثقافيًا."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَاقِص مُحْتَرِف"

    - lemma: "رَقَّاص"
      source: stage1
      decision: confirmed
      decision_reason: "وردت صيغة رَقَّاص بمعنى «محترف الرقص» في المعجم الوسيط والمعجم الكبير وموسوعة السلطان قابوس صراحةً. وزن فَعَّال من أعرق صيغ الحرفة في العربية وأكثرها اطّرادًا واشتقاقيةً. اجتاز: اختبار السكّ (وحدة معجمية ثابتة مسجّلة)، وفحص الاطّراد، وإيثار التراثي، وفحص الملاءمة الصرفية (الوزن مناسب للحرفة). تُضيف إلى المجموعة صيغةً موروثة ذات مصداقية معجمية عالية تعبّر عن الاحتراف بنيويًا لا وصفيًا."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "صيغة فَعَّال التراثية الدالة على الكثرة والتمكّن والحرفة الراسخة؛ تُضمِّن معنى الاحتراف في بنيتها الصرفية ذاتها دون حاجة إلى قيد خارجي، وتميل إلى الاستعمال الأدبي والتراثي وتحمل رصانةً لغوية تميّزها عن «راقص» الأكثر شيوعًا."
      actions:
        - command: create_entry
          params: {lemma: "رَقَّاص", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "قَيَّان"
      source: stage1
      decision: removed
      decision_reason: "الجذر (ق ي ن) يدل في مفرده المذكر على الحداد وصانع الحديد، وفي قَيْنَة على المغنية — لا وجود لصلة بالرقص في أي من المصادر المعجمية. الإزاحة الدلالية المقترحة بعيدة جدًا وتُفضي إلى لبس مع مفاهيم مغايرة."

    - lemma: "مُحْتَرِفُ الرَّقْص"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على تثبيت هذا التركيب الإضافي. الاستعمال العربي المعتمد يُقلب التركيب ليصبح «راقص محترف» (وصفي بتقديم الموصوف) لا «محترف الرقص» (إضافي بتقديم الوصف)؛ والتركيب الوصفي موجود بالفعل في المجموعة."

    - lemma: "فَنَّانُ الرَّقْص"
      source: stage1
      decision: removed
      decision_reason: "لا توثيق معجمي لهذا التركيب. بيانات المعاجم تشير إلى أن العربية المعاصرة تعتمد «راقص + التخصص» (كراقص الباليه) لا «فنان الرقص». كلمة «فنان» تُضيف بُعدًا قيميًا لا يُشترط في تعريف المجموعة."


