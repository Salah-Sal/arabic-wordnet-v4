# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14373511-n — myelatelia
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية «نقص نمو النخاع» عبارة وصفية لا مصطلح معجمي ثابت"
      - "اللمّة بدون تشكيل"
      - "المعجم الطبي الموحد يستخدم مصطلح «نُقَاصُ النُّخاع» لا «نقص نمو النخاع»"
    observations: "المفهوم طبي تشريحي دقيق يتعلق بعيب تطوري (خِلْقي) في الحبل الشوكي. المصطلح الإنجليزي myelatelia مركب يوناني من myelo (نخاع) وatelia (عدم اكتمال). يُتوقع أن يكون المصطلح العربي مركباً إضافياً يجمع بين مفهوم النقص/التشوه والنخاع الشوكي. وزن فُعال منتج للأمراض والعيوب في المصطلحية الطبية العربية."
  blind_candidates:
    - lemma: "نُقَاصُ النُّخَاعِ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين نُقاص (على وزن فُعال الدال على الأمراض والعيوب من جذر ن-ق-ص) والنخاع (الحبل الشوكي). وزن فُعال منتج في المصطلحية الطبية (كالصُّداع والزُّكام)."
    - lemma: "تَشَوُّهٌ نُخَاعِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من تَشَوُّه (المذكور في المتفرع الأعلى) ونُخاعيّ (نسبة إلى النخاع). يصف العيب الخِلْقي في النخاع بعبارة عامة."
    - lemma: "سُوءُ تَخَلُّقِ النُّخَاعِ"
      generation_method: tarkib
      justification: "مركب إضافي مُتداخل: سوء + تخلُّق (تكوُّن خِلْقي) + النخاع. يقابل المفهوم الطبي dysgenesis of the spinal cord."
    - lemma: "مِيَالاتِيلْيَا"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح اللاتيني myelatelia. يُلجأ إليه عند غياب البديل العربي المسكوك، لكنه الملاذ الأخير."

stage2_evidence:
  per_lemma:
    - lemma: "نَقْصُ نُمُوِّ النُّخَاعِ"
      expands:
        - text: "«نَقْصُ نُمُوِّ الفَكّ» = jaw underdevelopment"
          source: "المعجم الطبي الموحد (2009)"
          addition: "نمط تركيبي مماثل (نقص نمو + عضو) موجود في المعجم الطبي، مما يعطي النمط شرعية تركيبية وإن لم يُسجَّل المركب بعينه"
    - lemma: "نُقَاصُ النُّخَاعِ"
      confirm:
        - text: "«نُقَاصُ النُّخاع» = myelatelia"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«نُقاصُ النُّخاع» = atelomyelia"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«نَقَّاص — من (ن ق ص) المبخس الناس أشياءهم، والكثير الطعن في الناس»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "صيغة نَقَّاص (فَعَّال) للفاعل، بينما نُقاص (فُعال) للمرض/العيب — تأكيد صرفي على اختلاف الوزنين"
    - lemma: "تَشَوُّهٌ نُخَاعِيٌّ"
      contradicts:
        - text: "«تَشَوُّهٌ خِلْقِيّ» = congenital malformation"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "تشوّه نخاعي عبارة وصفية عامة لا تحدد نوع التشوه (تطوري/خِلقي)، والمعجم يستخدم «تشوه خلقي» كمصطلح عام لا كمصطلح نوعي لعيب النخاع"
    - lemma: "سُوءُ تَخَلُّقِ النُّخَاعِ"
      evidence_status: "no_material_found"
    - lemma: "مِيَالاتِيلْيَا"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "نَقْصُ نُمُوِّ النُّخَاعِ"
      decision: confirmed
      decision_reason: "نمط «نقص نمو + عضو» موجود في المعجم الطبي الموحد (مثل نقص نمو الفك)، واللمّة مفهومة بوضوح وإن لم تُسجَّل بهذا التركيب بالذات. تُبقى كلمّة وصفية شائعة مقابل المصطلح المتخصص."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "عبارة وصفية شفافة تستخدم في السياق التعليمي والتبسيطي، أوسع دلالياً من نُقاص النخاع المتخصص"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَقْصُ نُمُوِّ النُّخَاعِ"

    - lemma: "نُقَاصُ النُّخَاعِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مسجّل في المعجم الطبي الموحد (2009) مقابل myelatelia وatelomyelia. مبني على وزن فُعال المنتج للأمراض من جذر ن-ق-ص. هو المصطلح الأدق والأكثر اصطلاحية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح الطبي المعياري المسجّل في المعجم الطبي الموحد، أدق وأخصّ من العبارة الوصفية"
      actions:
        - command: create_entry
          params:
            lemma: "نُقَاصُ النُّخَاعِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَشَوُّهٌ نُخَاعِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية عامة جداً لا تحدد نوع التشوه. المعجم الطبي يستخدم «تشوه خلقي» كمصطلح عام، و«نُقاص النخاع» للمفهوم الخاص. لا حاجة لهذا المرشح."

    - lemma: "سُوءُ تَخَلُّقِ النُّخَاعِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي دليل معجمي. المركب غير مسكوك ولا مسجّل في أي معجم طبي."

    - lemma: "مِيَالاتِيلْيَا"
      source: stage1
      decision: removed
      decision_reason: "تعريب غير ضروري لوجود المصطلح العربي الأصيل «نُقاص النخاع» المسجّل في المعجم الطبي الموحد. قاعدة إيثار العربي تمنع اللجوء إلى التعريب عند توفر البديل."

