# مراجعة AWN4 — Review Pipeline v2 (5 مراحل)
# المجموعة الترادفية: awn4-88253606-n
# المفهوم: المرأة الحِرفية الماهرة (craftswoman)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'مبدعة' عامة جداً ولا تختص بالفنون اليدوية؛ يصح وصف الشاعرة والعالمة والموسيقية بها، وهي ليست مرادفاً للحِرفية"
      - "التعبير المركب 'حرفية فنانة' ليس وحدةً معجميةً ثابتة: 'فنانة' تُوحي بالفنون الجميلة لا اليدوية الحِرَفية، و'حرفية' تحمل في المعاجم التقنية معاني 'الكوربورالية' (مذهب حرفي) و'التيبوغرافيا' — وهي معانٍ مخالفة"
      - "كلتا اللمّتين خاليتان من التشكيل الكامل"
      - "المعرّف ili فارغ (null)"
    observations: >
      المجموعة تُمثّل مفهوم المرأة الحِرفية الماهرة (craftswoman) وهو مفهوم عريق في اللغة العربية.
      المشكلة الجوهرية أن اللمّتين المختارتين لا تعكسان هذا المفهوم بدقة: 'مبدعة' واسعة دلالياً تشمل
      كل إبداع وابتكار، و'حرفية فنانة' مركّب غير مثبت معجمياً يخلط بين الحِرفة اليدوية والفن الجميل.
      العربية الكلاسيكية تمتلك صِيَغاً أدق لهذا المعنى منها صَنَاعٌ (ابن فارس) وصَنَّاعَة (المعجم الكبير)،
      وفي المعاصرة حِرَفِيَّة (مؤنث الحِرَفيّ المستعمل استعمالاً شائعاً بمعنى artisan).
  blind_candidates:
    - lemma: "حِرَفِيَّة"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (ح ر ف) على وزن النسبة (حرفيّ) بالتأنيث. الحِرفة هي العمل اليدوي الذي يحترفه الإنسان، والحِرَفِيَّة هي المرأة المنتسبة إلى هذا الميدان. الوزن منتج مطّرد في تأنيث الأعمال والمهن."
    - lemma: "صَانِعَة"
      generation_method: ishtiqaq
      justification: "اسم الفاعل المؤنث من صنع (صانع → صانعة)؛ تُفيد المرأة التي تمارس الصنع بيدها. الوزن قياسي لاسم الفاعل المؤنث."
    - lemma: "صَنَّاعَة"
      generation_method: ishtiqaq
      justification: "وزن فعّالة للمبالغة والاحتراف من جذر (ص ن ع)؛ تدل على امرأة بلغت درجة عالية من الإتقان في الصنعة. قياساً على صَنَّاع بمعنى المبالغ في إتقان الصنع."
    - lemma: "مُحْتَرِفَة"
      generation_method: ishtiqaq
      justification: "اسم فاعل مؤنث من الفعل الثامن احتَرَفَ (اتخذ الحِرفة مهنة)؛ تدل على امرأة اتخذت الحِرفة اليدوية مهنة واحترافاً، وهو اشتقاق مطّرد في العربية المعاصرة."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفّذة: ٤ استعلامات
#  ١) مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات + صيغ ال-)
#  ٢) إثراء بالمعرّف (definitions + examples + plurals) للمدخلات الرئيسية
#  ٣) الجسر الإنجليزي (craftswoman, artisan, craftsperson, craftsmanship)
#  ٤) مقاييس اللغة لابن فارس (جذور: حرف، صنع، بدع)
stage2_evidence:
  per_lemma:

    - lemma: "حرفية فنانة"
      evidence_status: "no_material_found"
      # المركب "حرفية فنانة" ككل لم يُعثر عليه في أي مصدر معجمي.
      # "حرفية" وحدها في ARABTERM لها معانٍ مخالفة (انظر الدليل على المرشح حِرَفِيَّة).

    - lemma: "مبدعة"
      contradicts:
        - text: "«(بَدَعَ) الْبَاءُ وَالدَّالُ وَالْعَيْنُ أَصْلَانِ: أَحَدُهُمَا ابْتِدَاءُ الشَّيْءِ وَصُنْعُهُ لَا عَنْ مِثَالٍ، وَالْآخَرُ الِانْقِطَاعُ وَالْكَلَالُ. فَالْأَوَّلُ قَوْلُهُمْ: أَبْدَعْتُ الشَّيْءَ قَوْلًا أَوْ فِعْلًا: إِذَا ابْتَدَأْتُهُ لَا عَنْ سَابِقِ مِثَالٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر بدع يعني ابتداء الشيء دون سابق نموذج (الابتكار المطلق)، لا يختص بالمهارة في الحِرف اليدوية؛ فالشاعر والعالم والمخترع كلهم مبدعون بهذا التعريف مما يجعل اللمّة أوسع بكثير من المقصود"

    - lemma: "حِرَفِيَّة"
      confirm:
        - text: "«الحِرَفيّ: الصانع الماهر»"
          source: "المورد الحديث (2008) — ترجمة: artisan"
        - text: "«حِرَفِيّ» — translation_en: artisan"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
        - text: "«فُلَانٌ يَحْرُفُ لِعِيَالِهِ، أَيْ يَكْسِبُ... وَكُلُّ ذَلِكَ مِنْ حَرَفَ وَاحْتَرَفَ أَيْ كَسَبَ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«حرفية: مذهب حرفي» — translation_en: corporatism"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "حرفية في هذا المعجم مصطلح اقتصادي (corporatism) لا علاقة له بالمرأة الحِرفية"
        - text: "«حرفية: تركيب نص بمساعدة حروف رصاصية... لمنح النص تركيبية قابلة للقراءة» — translation_en: typography"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "حرفية في اللسانيات مصطلح يعني التيبوغرافيا، مخالف للمعنى المقصود تماماً"

    - lemma: "صَانِعَة"
      contradicts:
        - text: "«وَامْرَأَةٌ صَنَاعٌ وَرَجُلٌ صَنَعٌ، إِذَا كَانَا حَاذِقَيْنِ فِيمَا يَصْنَعَانِهِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الصيغة الكلاسيكية للمرأة الماهرة في الصنع هي صَنَاع (بغير تاء) لا صانعة؛ صانعة اسم فاعل مؤنث قياسي لكنه يفتقر إلى دلالة الإتقان والاحتراف"
        - text: "«صَانِعَةُ الكلوروفيل؛ صَانِعَةُ اليَخْضور» — translation_en: chloroplast"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "صانعة في المعجم الطبي مصطلح بيولوجي (chloroplast) يختلف اختلافاً كلياً عن معنى الحِرفية"
      expands:
        - text: "«صانعة القبعات: صانعة الزينة، هي المختصة في متجر للقبعات بإعطاء آخر اللمسات والشكل النهائي للقبعة» — translation_en: milliner"
          source: "مسرد صناعة النسيج (ALECSO)"
          addition: "يدل هذا المدخل على أن صانعة تُستعمل في سياق الحِرفة اليدوية النسيجية في التركيبات الإضافية المقيَّدة، لكنها لا تُستعمل مفردةً دالةً على الحِرفية"

    - lemma: "صَنَّاعَة"
      confirm:
        - text: "«صَنَّاعَة: من (ص ن ع) مؤنث الصَّنَّاع، والخشب ونحوه يوضع في مجرى الماء لحبسه، والماهرة في الصناعة»"
          source: "الروضة المنضرة (معجم الفصيح والنوادر)"
        - text: "«الصَّنَّاعَةُ: الصَّنَّاع» — [أي مؤنث الصنّاع الماهر في الحِرفة]"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«الصَّادُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، وَهُوَ عَمَلُ الشَّيْءِ صُنْعًا. وَامْرَأَةٌ صَنَاعٌ وَرَجُلٌ صَنَعٌ، إِذَا كَانَا حَاذِقَيْنِ فِيمَا يَصْنَعَانِهِ»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "مُحْتَرِفَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "حرفية فنانة"
      decision: removed
      decision_reason: >
        فشل اختبار التعبير المركب: إبدال 'حرفية' بـ'مهنية' أو 'متخصصة' يُنتج عبارةً وصفية مقبولة
        مما يدل على أنه تعبير وصفي حر لا وحدة معجمية مثبّتة. علاوة على ذلك تحمل 'فنانة' دلالة
        الفنون الجميلة (fine arts) التي تتجاوز الحِرف اليدوية، مما يُضيّع الفصل النوعي المطلوب.
        لا وجود لهذا المركب في أي مصدر معجمي. إجراء: حذف الارتباط بالمجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مبدعة"
      decision: removed
      decision_reason: >
        الجذر بدع يدل على ابتداء الشيء دون سابق نموذج (ابتكار/إبداع مطلق) لا على المهارة الحِرفية
        اليدوية تحديداً. مبدعة أوسع دلالياً مما يقتضيه المفهوم: الشاعرة والمهندسة المعمارية والعازفة
        كلهن مبدعات. لا يوجد تخصيص للحِرف اليدوية في الجذر اللغوي ولا في المعجمية. إجراء: حذف الارتباط.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──

    - lemma: "حِرَفِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        حِرَفِيَّة هي المؤنث الطبيعي لحِرَفِيّ (artisan) المستعمل استعمالاً واسعاً في المعجمية
        العربية المعاصرة. المورد الحديث يُعرّف الحِرَفيّ بأنه 'الصانع الماهر' وترجمته artisan، وهذا
        هو المعنى المقصود بالضبط. المعاني التقنية المخالفة (corporatism, typography) محصورة في
        مصطلحات متخصصة لا تنفي المعنى الاشتقاقي الراسخ للكلمة. اختبار الاستبدال: حِرَفِيَّة ↔
        صَنَّاعَة كلتاهما في المجموعة لكن من وجهة نظر مختلفة (انظر nuance). تشكيل كامل مضاف.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُبرز الانتساب إلى الحِرفة بوصفها مهنة ذات تصنيف اجتماعي معترف به؛ أشيع في الاستخدام المعاصر والتوثيق الرسمي (قطاع الحِرف اليدوية، التصنيف المهني)"
      actions:
        - command: create_entry
          params:
            lemma: "حِرَفِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "صَنَّاعَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مدعومة مباشرةً بالمعجم الكبير والروضة المنضرة: 'مؤنث الصَّنَّاع، والماهرة في الصناعة'.
        مقاييس اللغة يؤكد أن العربية تقول 'امرأة صَنَاع' للمرأة الحاذقة في صنعها، وصنّاعة هي
        صيغة المبالغة المؤنثة الواردة في المعجم الكبير. الوزن فعّالة يحمل دلالة الاحتراف والإتقان
        العالي مما يناسب التعريف 'ذات مهارة عالية'. لا اشتراك لفظي مخلّ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُركّز على البراعة الشخصية العالية في عمل اليد؛ وزن فعّالة يحمل تكثيفاً دلالياً للاحتراف والتمرّس الشديد. أكثر تراثيةً وأرسخ في الموروث اللغوي الكلاسيكي"
      actions:
        - command: create_entry
          params:
            lemma: "صَنَّاعَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "صَانِعَة"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة الكلاسيكية للمرأة الماهرة في الصنع هي صَنَاع (على وزن فَعَال) لا صانعة، كما يُقرر
        ابن فارس صراحةً: 'امرأة صَنَاع... إذا كانت حاذقة فيما تصنعه'. أما صانعة (اسم فاعل مؤنث
        قياسي) فقد تخصصت في المعجمية التقنية المعاصرة بمعانٍ بيولوجية (صانعة الكلوروفيل، صانعة
        النواة)، مما يُوجد تشويشاً. صَنَّاعَة أدق وأثبت لغوياً.

    - lemma: "مُحْتَرِفَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أدلة معجمية تخصّص مُحتَرِفَة بالحِرف اليدوية. المفهوم واسع يشمل كل مهنة
        (الطبيبة المحترفة، المحامية المحترفة...) ولا يحمل الفصل النوعي المطلوب للحِرفة اليدوية.
        حِرَفِيَّة أدق وأكثر تخصيصاً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مبدعة أنثى ذات مهارة عالية في الفنون اليدوية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يستخدم 'مبدعة' وهي اللمّة المحذوفة، مما يُشكّل دوراناً جزئياً. كما أن
        أسلوبه قائم على النعت المتراكم لا على الجنس والفصل. 'الفنون اليدوية' أدق من 'الحِرف' لكن
        التعريف يحتاج إلى إعادة صياغة بأسلوب المعجم.
    authored:
      - type: terminological
        text: "امرأةٌ تمتهن إحدى الحِرَف اليدوية وتُتقن صنعتها وتبرع فيها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "من تمارس صناعةً يدويةً كالنسج والتطريز والخزف والتجليد وما شابهها مزاولةً متقنةً محترِفةً، وقد تتوارث أسرارها جيلاً بعد جيل"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "امرأةٌ تمتهن إحدى الحِرَف اليدوية وتُتقن صنعتها وتبرع فيها"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "من تمارس صناعةً يدويةً كالنسج والتطريز والخزف والتجليد وما شابهها مزاولةً متقنةً محترِفةً، وقد تتوارث أسرارها جيلاً بعد جيل"

  examples:
    per_lemma:
      - lemma: "حِرَفِيَّة"
        examples:
          - text: "أسهمت الحِرَفِيَّةُ الشابةُ في إحياء فنّ تطريز الثوب الفلسطيني التقليدي بعد أن تتلمذت على يد جدّتها."
            type: usage
      - lemma: "صَنَّاعَة"
        examples:
          - text: "لا تزال تلك الصَّنَّاعَةُ المتمرِّسة تتوارث أسرار نسج البُسُط الأندلسية وتُعلّمها لبناتها جيلاً بعد جيل."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تتميز الحِرَفِيَّات والصَّنَّاعات في فاس بمهاراتهن الاستثنائية في دبغ الجلود وصنع الخزف المطلي بالألوان التقليدية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أسهمت الحِرَفِيَّةُ الشابةُ في إحياء فنّ تطريز الثوب الفلسطيني التقليدي بعد أن تتلمذت على يد جدّتها."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "لا تزال تلك الصَّنَّاعَةُ المتمرِّسة تتوارث أسرار نسج البُسُط الأندلسية وتُعلّمها لبناتها جيلاً بعد جيل."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
stage5_enrichment:
  per_entry:
    - lemma: "حِرَفِيَّة"
      entry_id: "{auto}"
      root: "حرف"
      maqayis_quote: "«الْحَاءُ الرَّاءُ وَالْفَاءُ ثَلَاثَةُ أُصُولٍ: حَدُّ الشَّيْءِ، وَالْعُدُولُ، وَتَقْدِيرُ الشَّيْءِ... فُلَانٌ يَحْرُفُ لِعِيَالِهِ، أَيْ يَكْسِبُ... وَكُلُّ ذَلِكَ مِنْ حَرَفَ وَاحْتَرَفَ أَيْ كَسَبَ»"

    - lemma: "صَنَّاعَة"
