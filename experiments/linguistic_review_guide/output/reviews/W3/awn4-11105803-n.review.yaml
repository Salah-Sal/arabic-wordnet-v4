# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11105803-n | ILI: i95725
# مصمم رقصات أمريكي (1930-1988) — Robert Joffrey
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (جوفري، روبرت جوفري) خاليتان من التشكيل الكامل المطلوب في AWN4"
      - "المجموعة تمثّل اسم علم لشخص بعينه، مما يُقيّد منهجية توليد المصطلحات المعتادة؛ إذ ينحصر التعامل المعجمي في التعريب الصوتي فقط"
      - "التعريف العربي الحالي مقتضب جداً ولا يتضمّن أبرز ما اشتُهر به الشخص (تأسيسه فرقة جوفري للباليه)"
      - "غياب صيغة المفرد الكامل للاسم مع الكنية قد يُربك الاسترجاع المعجمي"
    observations: >
      هذه المجموعة تخصّ كياناً مسمّىً (Named Entity) هو مصمّم الرقصات الأمريكي الشهير
      روبرت جوفري (1930-1988)، مؤسّس فرقة جوفري للباليه عام 1956م. تندرج ضمن نماذج
      أسماء الأعلام في الشبكة الدلالية، وتتمثّل لمّاتها حصراً في تعريبات صوتية للاسم
      الأجنبي. لا مجال للاشتقاق أو المجاز أو التركيب الاصطلاحي هنا؛ والمعالجة المعجمية
      الملائمة تقتصر على ضبط الصوت بالتشكيل الكامل وانتقاء الصيغ الأكثر شيوعاً في
      المراجع العربية. نمط التوليد الوحيد المنطبق هو التعريب (taarib).

  blind_candidates:
    - lemma: "رُوبِرت جُوفْرِي"
      generation_method: taarib
      justification: >
        الصيغة العربية الأكثر شيوعاً في المصادر الموسوعية والإعلامية العربية للاسم الكامل
        Robert Joffrey، مع مراعاة النقل الصوتي القياسي: رُوبِرت للـ Robert وجُوفْرِي للـ Joffrey.
    - lemma: "جُوفْرِي"
      generation_method: taarib
      justification: >
        اللقب (الكنية) مفرداً كافٍ للإحالة إلى شخصية واسعة الشهرة؛ وهو الصيغة المختصرة
        الشائعة في النصوص المتخصصة في الرقص والباليه حين يُحيل السياق إلى شخصية الفرقة
        المؤسِّسة. نقل Joffrey صوتياً: جُوفْرِي أو جُوفِرِي.
    - lemma: "رُوبِيرت جُوفْرِي"
      generation_method: taarib
      justification: >
        صيغة تعريبية بديلة يرد فيها المقطع الثاني من Robert مُمطَّطاً (روبيرت)، وهو خيار
        بعض المترجمين العرب حين يُراعون إطالة الصائت في نطق الأمريكيين. صيغة موجودة في
        بعض الموسوعات لكن أقل شيوعاً من رُوبِرت.
    - lemma: "بُوبِي جُوفْرِي"
      generation_method: taarib
      justification: >
        الاسم المُصغَّر (Bobby Joffrey) الذي كان يُعرف به أحياناً في وسطه المهني؛ ومدخل
        موسوعة السلطان قابوس يُثبت أن «بوبي» صيغة شائعة للاسم روبرت في السياق العربي.
        غير أنه ليس الشكل الرسمي المعتمد.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  queries_run:
    - "Batch headword lookup: جوفري / الجوفري / روبرت جوفري / الروبرت جوفري / جوفيري"
    - "English bridge FTS: translation_en:\"Joffrey\" OR \"Robert Joffrey\" OR \"choreographer\""
    - "Arabic FTS keywords: مصمم رقصات / تصميم رقصات / كوريغراف / كوريوغراف"
    - "Candidate validation: روبرت / روبيرت / بوبي / عبدالله خان"

  per_lemma:
    # ── اللمّة الموجودة الأولى ──
    - lemma: "جوفري"
      confirm:
        - text: >
            «جوفري — عن الألمانية القديمة بمعنى السلام السماوي والسلام الإلهي.
            يستخدم للذكور.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: >
            «جوفري — عن الألمانية القديمة بمعنى السلام السماوي والسلام الإلهي.
            يستخدم للذكور.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يُثبت المعجم أن «جوفري» اسم علم مذكر معرَّب مستقلّ في المعجمية العربية،
            مشتقٌّ من الألمانية القديمة، ويُستخدم في السياق العربي كاسم شخصي. هذا
            يعزّز شرعية استخدامه لمّةً في مجموعة ترادفية لاسم علم مذكر.

    # ── اللمّة الموجودة الثانية ──
    - lemma: "روبرت جوفري"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١: رُوبِرت جُوفْرِي ──
    - lemma: "رُوبِرت جُوفْرِي"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١: رُوبِيرت جُوفْرِي ──
    - lemma: "رُوبِيرت جُوفْرِي"
      expands:
        - text: >
            «روبيرت — عن الإنجليزية القديمة بمعنى شهرة كبيرة.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            صيغة «روبيرت» مثبتة في المعجمية العربية كاسم معرَّب، مما يعني أن
            «روبيرت جوفري» صيغة بديلة مشروعة لغوياً وإن كانت أقل شيوعاً من «روبرت».

    # ── مرشح المرحلة ١: بُوبِي جُوفْرِي ──
    - lemma: "بُوبِي جُوفْرِي"
      expands:
        - text: >
            «بوبي — عن الفارسية بوب بمعنى بساط فاخر. بوبي — عن الأيرلندية بمعنى
            ذي شعر أصفر. بوبي — إحدى الصيغ الشائعة للاسم روبرت.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يُثبت المعجم صراحةً أن «بوبي» من الصيغ الشائعة للاسم روبرت في السياق
            العربي، مما يدعم استخدامها لمّةً بديلة للشخصية نفسها. غير أنها صيغة
            تعامليّة لا رسمية.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة: جوفري ──
    - lemma: "جوفري"
      decision: confirmed
      decision_reason: >
        اسم علم معرَّب مثبت في موسوعة السلطان قابوس لأسماء العرب بصفته اسماً مستقلاً
        في المعجمية العربية. هو اللقب المختصر الذي يُعرِّف الشخصية في السياقات المتخصصة
        بالرقص والباليه. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يمثّل الكنية (اللقب) المفردة التي تُحيل للشخصية في السياقات المتخصصة حين
        يستغني السياق عن الاسم الأول، ويُستخدم للإحالة إلى فرقة الباليه المنسوبة
        إليه (فرقة جوفري).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُوفْرِي"

    # ── اللمّة الموجودة: روبرت جوفري ──
    - lemma: "روبرت جوفري"
      decision: confirmed
      decision_reason: >
        الاسم الكامل الرسمي للشخصية وهو الأكثر دقةً في التعريف والتوثيق. رغم غيابه
        من قواعد البيانات المعجمية فهو يُمثّل الاسم القانوني الموثق الذي تُعرَّف به
        الشخصية في المصادر الموسوعية العربية. يُعدّ تعبيراً مركباً (مزجياً) هو الاسم
        الثنائي المعيار لشخصية بعينها. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: >
        الاسم الكامل الرسمي الذي يُستخدم في السياقات الرسمية والأكاديمية وفي أوّل
        ذكر للشخصية؛ يُميّز الشخصية بدقة عن أي آخرين يحملون اللقب جوفري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُوبِرت جُوفْرِي"

    # ── مرشح المرحلة ١: رُوبِرت جُوفْرِي (مكرّر للمّة الموجودة) ──
    - lemma: "رُوبِرت جُوفْرِي"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة (روبرت جوفري) بعد التشكيل، ولا داعي لإنشاء
        مدخل جديد؛ الإجراء المناسب هو تحديث اللمّة الموجودة بالتشكيل.

    # ── مرشح المرحلة ١: رُوبِيرت جُوفْرِي ──
    - lemma: "رُوبِيرت جُوفْرِي"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تعريبية بديلة أقل شيوعاً من رُوبِرت في المصادر العربية المعتمدة. الإبقاء
        على صيغة واحدة يُقلّل التشويش المعجمي، وصيغة «رُوبِرت» هي الأرسخ. كذلك فإن
        جمع الصيغتين في مجموعة ترادفية واحدة يُربك الترادف المقصود.

    # ── مرشح المرحلة ١: جُوفْرِي (مكرّر للمّة الموجودة) ──
    - lemma: "جُوفْرِي"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة (جوفري) بعد التشكيل؛ تمت معالجته ضمن تحديث اللمّة الموجودة.

    # ── مرشح المرحلة ١: بُوبِي جُوفْرِي ──
    - lemma: "بُوبِي جُوفْرِي"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم المُصغَّر (Bobby) هو اسم تعامليّ لا رسمي ولا يمثّل الطريقة المعيارية
        للإحالة إلى هذه الشخصية في المصادر العلمية والموسوعية العربية. إضافته ستُخلّ
        بمستوى الرسمية المطلوب لمجموعة تضمّ اسماً كاملاً.


