# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ─── اللمّات الموجودة ───
    - lemma: "خيال الروديو"
      decision: confirmed
      decision_reason: >
        المقصود بـ«خيال» هنا «خَيَّال» (بتشديد الياء) بمعنى «صاحب الخيول وفارسها»، وهو موثَّق
        في المعجم الوسيط والكبير. والمُركَّب «خَيَّال الرُّديو» يُعبِّر بدقة عن الفارس المؤدِّي في عروض
        الرديو. غير أن اللمّة الموجودة تحتاج إلى تصحيحَين: (أ) ضبط «خيَّال» بتشديد الياء، و(ب) تعديل
        «الروديو» إلى «الرُّديو» تبعاً لتعريب المورد الحديث المعتمد.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على دور الفارس الراكب للخيل (خيَّال) في عروض الرديو، وهو الجانب المحوري في الفروسية
        الاستعراضية الأمريكية. اللمّة وحيدة في المجموعة بعد حذف الأخرى.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَيَّالُ الرُّدِيو"

    - lemma: "مستعرض الروديو"
      decision: removed
      decision_reason: >
        أولاً: «مستعرض» في الاصطلاح العلمي والطبي الحديث راسخٌ بمعنى «عَرْضِيّ/transverse»
        (أثبتته عشرات مداخل أرابترم)، فيُولِّد غموضاً حاداً بدون تشكيل — إذ تُقرأ «مستعرَض»
        (صفة) لا «مستعرِض» (اسم فاعل). ثانياً: المُركَّب غير ثابت في أي مصدر معجمي.
        ثالثاً: الفرق الدلالي بينه وبين «خيَّال الرديو» غير موثَّق. رابعاً: يفشل اختبار السكّ
        (يمكن إبداله بـ«عارض الروديو» أو «مقدِّم الروديو» دون فقدان المعنى الوصفي).
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ─── مرشحات المرحلة ١ ───
    - lemma: "مُسْتَعْرِضُ الفُرُوسِيَّةِ"
      source: stage1
      decision: removed
      decision_reason: >
        يرث إشكالية «مستعرض» الدلالية نفسها (transverse في الاصطلاح الحديث). فضلاً عن ذلك،
        يفشل اختبار التثبيت المعجمي (لا يُعدّ وحدة ثابتة في أي معجم)، ويفشل اختبار السكّ
        (يمكن إبدال «مستعرض» بـ«مُقدِّم» أو «مُؤدِّي» مع بقاء العبارة صالحةً وصفياً).
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "فَارِسٌ اسْتِعْرَاضِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «فارس» موثَّق جيداً لكن «فارس استعراضي» عبارة وصفية حرة لا مصطلح مسكوك: يفشل
        اختبار التثبيت المعجمي (لا أثر له في أي معجم)، ويفشل اختبار السكّ (يمكن إبداله بـ«فارس
        ترفيهي» أو «فارس مهرج»). كما لا يُغطِّي جانبَي الوهق ومصارعة الثيران الواردَين في التعريف.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "رَوَّاضُ الثِّيرَانِ"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر «روض» والوزن «فَعَّال» صحيحان لغوياً، لكن المُركَّب لا يُغطِّي سوى جانب مصارعة
        الثيران دون جوانب ركوب الخيل والوهق. كما أنه غير ثابت معجمياً ولا مسكوك في السياق
        الاستعراضي. الاختبار: «رواض الثيران» قد يدل على مروِّض لا على فنان استعراضي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "رَاعِي البَقَرِ الاسْتِعْرَاضِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        مُركَّب ثلاثي الأجزاء لا يصلح وحدةً معجمية مسكوكة. يفشل اختبار التثبيت (لا وجود له
        في أي معجم)، ويفشل اختبار السكّ (يمكن إبدال «راعي البقر» بـ«فارس» أو «بقّار»).
        «راعي البقر» وحده أثبته المورد الحديث مقابلاً لـ cowboy، لكن إضافة «الاستعراضي» لا
        تكفي لصكّه مصطلحاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مؤدٍ يقدم استعراضات في ركوب الخيول واستخدام الحبال ومصارعة الثيران"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول من حيث المحتوى، لكنه يفتقر إلى الأسلوب المعجمي العربي الدقيق:
        (أ) «استخدام الحبال» ترجمة حرفية غير دقيقة للـ roping؛ الأصح «إلقاء الوَهق» أو «قنص
        الماشية بالوهق» (الوَهق موثَّق في المورد الحديث = lasso). (ب) يُستحسن ذكر «الرديو»
        لضبط السياق الثقافي الخاص. (ج) «مؤدٍ» في الجملة الأولى بدون تحديد يبدو غامضاً.
    authored:
      - type: terminological
        text: >
          مُؤدٍّ يحترف إقامةَ عروض الرُّديو، تشمل ركوبَ الخيل الجامحة، وقنصَ الماشية
          بالوَهق، ومصارعةَ الثيران أمام الجمهور.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          الرُّديو تقليدٌ أمريكي نشأ من مهارات رعاة البقر في مزارع الغرب الأمريكي؛ يُؤدِّي
          فيه الخَيَّالون عروضاً تتضمن ركوبَ الخيل والثيران الجامحة، وإلقاءَ الوهق (الحبل
          المُعقَّد) لاصطياد الماشية، ومصارعةَ الثيران بالأيدي. ويُعدّ خيّال الرديو حارساً
          لهذا الإرث الشعبي ومُتنافساً في آنٍ واحد.
    actions:
      - command: update_definition
        params:
