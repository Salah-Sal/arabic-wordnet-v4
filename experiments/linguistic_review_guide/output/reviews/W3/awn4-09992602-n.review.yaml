          source: "مقاييس اللغة لابن فارس (entry_id 986689، مادة رَوَضَ)"
          addition: >
            يُثبت أصل الجذر الدال على التليين والترويض، مما يُسوِّغ اشتقاق «رَوَّاض» للمبالغة في الترويض.
        - text: "«مُصارَعة الثيران»"
          source: "المورد الحديث (2008)، entry_id 675482، ترجمة: bullfight"
          addition: "يُثبت المصطلح العربي لمصارعة الثيران كأحد عناصر الرديو."

    - lemma: "رَاعِي البَقَرِ الاسْتِعْرَاضِيُّ"
      expands:
