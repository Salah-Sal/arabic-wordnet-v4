# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين الموجودتين تستخدمان صيغة التعريب «الروديو»، في حين أن المعجم الحديث المعتمد (المورد الحديث 2008) يضبطها «الرُّديو» بدون واو"
      - "الكلمة الأولى في لمّة «خيال الروديو» تشير إلى الخيال/الوهم لا إلى الفارس؛ المقصود «خَيَّال» بتشديد الياء (صاحب الخيول، فارسها) لا «خَيَل» بدون تشديد"
      - "«مستعرض» في المصطلحية العربية الحديثة يعني «عَرْضي/مستعرَض» (transverse) في الطب والفيزياء والجيولوجيا، مما يُولِّد التباساً دلالياً حاداً"
      - "اللمّتان تفتقران إلى التشكيل الكامل"
      - "الفرق الدلالي بين «خيال الروديو» و«مستعرض الروديو» غير موثَّق ولا يظهر في أي سياق معجمي"
    observations: >
      المجموعة تُمثِّل مفهوماً ثقافياً أمريكياً بحتاً (فنان الرديو) لا يُعرف في التراث العربي الكلاسيكي.
      أوضح لمّة لهذا المعنى هي «خَيَّال الرُّديو»: إذ وردت كلمة «خيَّال» (بتشديد الياء) في المعجم الوسيط
      والمعجم الكبير بمعنى «صاحب الخيول فارسها ومروِّضها»، وهو ما يُغطِّي جانب ركوب الخيل في التعريف.
      أما «الرُّديو» فقد أثبتها المورد الحديث (2008) بهذه الصيغة بمعنى «عرض للبراعة يُجرى بين رعاة البقر».
      في المقابل، «مستعرض» مُرتبط معجمياً بمفهوم «عرضي/transverse» في الاصطلاح الطبي والعلمي الحديث،
      مما يجعل «مستعرض الروديو» مُضلِّلاً في القراءة غير المُشكَّلة.

  blind_candidates:
    - lemma: "مُسْتَعْرِضُ الفُرُوسِيَّةِ"
      generation_method: tarkib
      justification: >
        مُركَّب إضافي من «مُسْتَعْرِض» (اسم فاعل من استعرض: قدَّم عرضاً) و«الفروسية» (ركوب الخيل وفنونه).
        يُغطِّي العرضَ والفروسيةَ معاً دون الحاجة إلى لفظ أجنبي، ويستوفي المعنى المحوري في التعريف.
    - lemma: "فَارِسٌ اسْتِعْرَاضِيٌّ"
      generation_method: tarkib
      justification: >
        مُركَّب وصفي من «فارس» (الحاذق بركوب الخيل) و«استعراضي» (نسبة إلى الاستعراض/العرض العلني).
        يُبيِّن الجنس (فارس) والفصل (الطابع الاستعراضي لا التنافسي).
    - lemma: "رَوَّاضُ الثِّيرَانِ"
      generation_method: ishtiqaq
      justification: >
        مُشتقّ من الجذر «ر-و-ض» على وزن فَعَّال للمبالغة والمهنة. مقاييس اللغة لابن فارس: «الراء والواو والضاد
        أصلان: أحدهما يدل على اتساع، والآخر على تليين وتسهيل»؛ والترويض هنا تليين الثور وإذلاله.
        يُجسِّد جانب مصارعة الثيران في التعريف.
    - lemma: "رَاعِي البَقَرِ الاسْتِعْرَاضِيُّ"
      generation_method: tarkib
      justification: >
        مُركَّب إضافي وصفي: «راعي البقر» (ثابت في المورد الحديث بمعنى cowboy) + «الاستعراضي» للتمييز بين
        الراعي الحقيقي وراعي عروض الرديو. يُلتقط المعنى الثقافي (cowboy) والوظيفة الاستعراضية معاً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خيال الروديو"
      expands:
        - text: "«الخَيَّالُ: صاحِبُ الخُيول فارِسُها»"
          source: "المعجم الوسيط (مادة خيّال، entry_id 8473)"
          addition: >
            يثبت أن «خيَّال» (بتشديد الياء) هو اللفظ الصحيح لراكب الخيل وصاحبها، وليس «خيال»
            (بدون تشديد) الذي يعني الوهم والظل.
        - text: "«الخَيَّالُ: صاحِبُ الخُيولِ، فارِسُ الخُيولِ، ومُرَوِّضُها. الخَيَّالَةُ: فِرْقَةٌ عَسْكَرِيَّةٌ تَرْكَبُ الخُيول»"
          source: "المعجم الكبير (مادة خيّال، entry_id 85780)"
          addition: "يُضيف معنى «مروِّض الخيل» إلى الدلالة، مما يُعزِّز العلاقة بفنون الفروسية الاستعراضية."
        - text: "«الرُّديو: مباراة [أو عرض للبراعة] تُجْرى بين رعاة البقر»"
          source: "المورد الحديث (2008)، entry_id 713810، ترجمة: rodeo"
          addition: >
            يُثبت أن الصيغة المعجمية المعتمدة للتعريب هي «الرُّديو» لا «الرُّوديو»، وأن دلالته
            «عرض للبراعة» تتوافق مع التعريف.

    - lemma: "مستعرض الروديو"
      contradicts:
        - text: "«مُسْتَعْرِض: transversalis NA»؛ «مُسْتَعْرِض: transverse»؛ «مُسْتَعْرِض: transversus NA»"
          source: "المعجم الطبي الموحد (2009)، entry_ids 659813–659821"
          conflict: >
            «مستعرض» في الاصطلاح الطبي والعلمي الحديث يعني «عَرْضِيّ/transverse»، فيُولِّد
            «مستعرض الروديو» قراءةً غير مقصودة بمعنى «العَرْضي في الرديو» دون تشكيل.
        - text: "«مستعرض: transverse» (فيزياء)؛ «مستعرض: transverse» (جيولوجيا)؛ «مستعرض: broadside» (كهرباء)"
          source: "معاجم أرابترم المتعددة (entry_ids 424826, 433857, 438564, 518438)"
          conflict: >
            تتطابق جميع مداخل الأرابترم على أن «مستعرض» يُترجَم بـ transverse في السياقات العلمية،
            مما يُرسِّخ اللبس ويجعل اللمّة مُشكلةً في السياق المصطلحي الحديث.
      expands:
        - text: "«الرُّديو: مباراة [أو عرض للبراعة] تُجْرى بين رعاة البقر»"
          source: "المورد الحديث (2008)، entry_id 713810"
          addition: "يُثبت دلالة «الرديو» وصيغة تعريبها الصحيحة."

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُسْتَعْرِضُ الفُرُوسِيَّةِ"
      contradicts:
        - text: "«مُسْتَعْرِض: transversalis NA»؛ «مُسْتَعْرِض: transverse»"
          source: "المعجم الطبي الموحد (2009)، entry_ids 659813–659821"
          conflict: >
            نفس إشكالية «مستعرض الروديو»: المصطلح «مستعرض» في الاستعمال الحديث مُقترن بمعنى
            «عرضي/transverse» لا باسم الفاعل من استعرض.
      expands:
        - text: "«الفُروسية: ركوب الخيل أو البراعةُ فيه»"
          source: "المورد الحديث (2008)، entry_id 693388، ترجمة: horsemanship"
          addition: "يُثبت دلالة الفروسية وشيوعها في اللغة المعاصرة."

    - lemma: "فَارِسٌ اسْتِعْرَاضِيٌّ"
