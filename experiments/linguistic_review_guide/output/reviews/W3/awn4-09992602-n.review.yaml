          addition: >
            يُثبت أن «راعي البقر» هو المقابل العربي المعتمد لـ cowboy في أرقى معاجم الترجمة الحديثة،
            مما يُعزِّز المكوِّن الأول للمرشح.
        - text: "«الرّاعي، راعي البقر»"
          source: "المورد الحديث (2008)، entry_id 726949، ترجمة: vaquero"
