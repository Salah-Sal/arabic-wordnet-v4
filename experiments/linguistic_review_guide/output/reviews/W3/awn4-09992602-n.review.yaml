          source: "المعجم الوسيط (entry_id 21409)"
          addition: "يُثبت أن «الفارس» يحمل دلالة البراعة في ركوب الخيل، مما يجعله مؤهَّلاً للتركيب الوصفي."
        - text: "«الفارس: الماهر في ركوب الخيل، الحاذق بما يمارس من الأشياء»"
          source: "المعجم الوسيط (entry_id 21424)"
