          definition_index: 0
          text: "مُؤدٍّ يحترف إقامةَ عروض الرُّديو، تشمل ركوبَ الخيل الجامحة، وقنصَ الماشية بالوَهق، ومصارعةَ الثيران أمام الجمهور."
      - command: add_definition
        params:
