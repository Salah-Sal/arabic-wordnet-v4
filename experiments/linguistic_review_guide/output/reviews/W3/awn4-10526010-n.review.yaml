# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمتين الموجودتين عبارتان وصفيتان حرتان، وليستا تعبيرين اصطلاحيين ثابتين؛ يمكن استبدال مكوناتهما بمرادفات مع بقاء العبارة وصفاً صادقاً، مما يُفشل اختبار التثبيت المعجمي"
      - "غياب التشكيل الكامل عن كلتا اللمتين"
      - "صاحب مزرعة مواشي: فيها خطأ صرفي إذ الصواب مزرعة مواشٍ (مجرور منوَّن) أو مزرعة للمواشي، لا مواشي بياء في آخره"
      - "مربي الماشية: دلالتها تتمحور حول نشاط التربية والتنشئة (من ربّى يُرَبِّي) أكثر من الملكية وإدارة المزرعة اللتين يتضمنهما مفهوم rancher تحديداً"
    observations: "تفتقر العربية إلى مصطلح مسكوك منفرد لمفهوم (rancher)؛ وهو فراغ معجمي معروف، إذ يُعبَّر عن هذا المفهوم عادةً بعبارات وصفية مركّبة. أقرب ما في المعاجم الحديثة هو مُرَبِّي الماشية (مركب إضافي)، فضلاً عن صاحب مَرْبَى الماشية الوارد في المورد الحديث 2008 لكنه أطول وأقل تثبيتاً. العقدة الأعلى (فلاح/مزارع) تصف عاملاً زراعياً عاماً، أما rancher فخاص بمالك مزرعة المواشي الكبيرة أو مديرها."
  blind_candidates:
    - lemma: "رَبُّ الرَّعِيِّ"
      generation_method: tarkib
      justification: "مركب إضافي كلاسيكي: رَبّ بمعنى المالك والمتولي للشيء، والرَّعِيّ بمعنى الماشية والقطيع؛ يعني مالك القطيع ومديره وهو أقرب المركبات العربية التراثية إلى مفهوم rancher"
    - lemma: "مُرَبِّي النَّعَمِ"
      generation_method: tarkib
      justification: "مركب إضافي: مُرَبِّي من الجذر ربو بمعنى القائم على التنشئة والرعاية، والنَّعَم هو المصطلح القرآني الكلاسيكي للإبل والبهائم؛ يصف من يتولى تربية المواشي في مزرعة كبيرة بأسلوب فصيح راسخ"
    - lemma: "رَعَّاء"
      generation_method: ishtiqaq
      justification: "اشتقاق من جذر رعي على وزن فِعَال (صيغة مبالغة)، يدل على الاحتراف والتكثير؛ يصف من يحترف رعي الماشية على نطاق واسع ويتولى الإشراف عليها، وهو قريب بالمجاز من مالك مزرعة الماشية الكبيرة ومديرها"
    - lemma: "صَاحِبُ المَرْعَى"
      generation_method: tarkib
      justification: "مركب إضافي: صَاحِب بمعنى المالك والملازم للشيء، والمَرْعَى بمعنى الأرض المخصصة للرعي؛ يصف مالك أرض الرعي الذي يُديرها لتربية الماشية"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "صاحب مزرعة مواشي"
      evidence_status: "no_material_found"

    - lemma: "مُرَبِّي الماشِيَة"
      confirm:
        - text: "«(1) مَرْبَى الماشية: مزرعة لتربية الخيل أو المواشي إلخ (2) يدير مَربًى للماشية أو يعمل فيه (3) يُربّي الماشية.»"
          source: "المورد الحديث (2008) — مدخل ranch"
        - text: "«صاحب مربَى الماشية أو مديرُهُ أو العامل فيه.»"
          source: "المورد الحديث (2008) — مدخل rancher"
        - text: "«مُرَبِّي: من يُغَذي وينشيء ومن ينمي الشيء، ومؤدب الطفل ومعلمه، ومن يرب الشيء ويعقده بالسكر.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«تربية المواشي» — livestock breeding"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — ARABTERM"
      expands:
        - text: "«مزارع تربية المواشي» — livestock farms"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC"
          addition: "يؤكد أن المركب مزرعة+تربية المواشي وحدة مفهومية مستعملة في المعاجم الزراعية الدولية"
        - text: "«الماشية: الإبل والبقر والغنم والخيل وجمعُها المواشي.»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "يحدد نطاق دلالة الماشية: الإبل والبقر والغنم والخيل، مما يتوافق مع نطاق ranch"
        - text: "«مكانُ تربيةِ الحيواناتِ ونحوها لغرضٍ استثمارىّ، كمزرعة الماشية ومزرعة الدواجن ومزرعة الأسماك»"
          source: "المعجم الكبير"
          addition: "يُثبت تركيب مزرعة الماشية مدخلاً معجمياً مستقلاً في المعجم الكبير"
      contradicts:
        - text: "«مرب — educator»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم — ArabTerm"
          conflict: "مُرَبٍّ/مُرَبِّي في المعاجم التعليمية يُرادف المربي والمعلم، وهذا التداخل الدلالي قد يُحدث لبساً عند استخدام اللمة منفردة بمعزل عن قيد الماشية"

    - lemma: "رَبُّ الرَّعِيِّ"
      evidence_status: "no_material_found"

    - lemma: "مُرَبِّي النَّعَمِ"
      expands:
        - text: "«النَّعَمُ: الإبل، لما فيه من الخير والنِّعمة... والأنعام: البهائم»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أن النَّعَم/الأنعام هو المصطلح القرآني الكلاسيكي للماشية، ما يسبغ على المركب طابعاً فصيحاً راسخاً؛ لكن النَّعَم يميل لتخصيص الإبل دون سائر الماشية"

    - lemma: "رَعَّاء"
      expands:
        - text: "«رِعَاء: جمع الراعي: من يحفظ الماشية ويرعاها، وكل من ولي أمرا بالحفظ والسياسة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يبيّن أن رِعَاء/رُعَاة يتضمن معنى الولاية والسياسة، مما يجعله أوسع من مجرد الرعي المادي"
        - text: "«رجل تُرعِيةٌ وتِرعَايةٌ: حسن الرعية بالإبل»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت وجود صيغ وزنية تدل على الاحتراف في رعي الإبل مما يدعم منهجية الاشتقاق"
