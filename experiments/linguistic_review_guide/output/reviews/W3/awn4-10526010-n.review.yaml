        - text: "«الرُّعاءُ: لغةٌ في الرِّعاءِ، جمعُ راعٍ»"
          source: "الشوارد للصغاني"
          conflict: "رَعَّاء/رُعَاء صيغة جمع في الاستعمال الكلاسيكي لا مفرد، وهي تصف الرعاة وليس مالك مزرعة الماشية ومديرها؛ كما أنها قد تُقرأ جمعاً وهو إشكال شكلي"

    - lemma: "صَاحِبُ المَرْعَى"
      expands:
        - text: "«الصاحب: يدل على مقارنة شيء ومقاربته»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أن صاحب يعني المتلازم للشيء ومالكه في الاستخدام الكلاسيكي"
        - text: "«المرعى: موضع الرعي»"
          source: "المعجم الوسيط"
          addition: "يُحدد أن المرعى هو الأرض لا المزرعة المتكاملة ذات البنية الاستثمارية"


