# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10746176-n  |  ILI: i93758  |  POS: n
# Lemma(s): رامي الأطباق  |  EN: trapshooter
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة 'رامي الأطباق' مركب إضافي شفاف دلالياً، قابل للاستبدال المكوّناتي ('صائد الأطباق')، مما يُضعف تحققه كوحدة معجمية ثابتة بالمعنى الاصطلاحي الصارم"
      - "غياب التشكيل الكامل عن اللمة الموجودة في قاعدة البيانات"
      - "المجموعة تضم لمة واحدة فقط لمفهوم رياضي حديث ذي طابع أولمبي دولي، مما يستوجب البحث عن مصطلح أكثر تخصصاً"
      - "التعريف الحالي يستخدم 'يشارك في رماية' وهي صياغة دائرية غير مباشرة"
    observations: >
      المجموعة تصف ممارسَ رياضة رماية الأطباق الطينية (Trap Shooting)، وهي رياضة أولمبية
      تُطلق فيها أقراص فخارية من آلة قذف ميكانيكية (Trap) نحو الهواء فيصوّب الرامي نحوها.
      الجذر 'رمى' أصيل في العربية بمعنى نبذ الشيء وإطلاقه، و'الأطباق' جمع طبق وتعني الأقراص
      المبسوطة. المركب الحالي شفاف تركيبياً لكنه وصفي صِرف. أشارت المعجمية العربية الحديثة
      (ARABTERM) إلى الرياضة بـ'رمادية الطرائد الطينية'، و'رماية صورية' لرياضة الأطباق الطائرة،
      مع تسمية الهدف ذاته 'الحمامة الصلصالية'. يبقى المصطلح الأمثل للممارِس مطلباً معجمياً.
  blind_candidates:
    - lemma: "رَامِي الطُّرُودِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من 'رامي' و'الطُّرود' (جمع طَرَد). الطرد لغةً هو الدفع والإبعاد، وهو
        المعنى الأصيل لآلة إطلاق الأطباق (Trap) التي تطرد الهدف وتبعده. يُشير 'رامي الطرود'
        إلى الرامي على أهداف مقذوفة بواسطة القاذف.
    - lemma: "قَنَّاصُ الأَطْبَاقِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من 'قَنَّاص' (فَعَّال من قنص) بمعنى الصائد الماهر، و'الأطباق' بمعنى
        الأقراص الطينية. وزن فَعَّال من أكثر الأوزان إنتاجيةً للمحترف في حِرفته. يُبرز
        دقة التصويب على الأهداف المتحركة.
    - lemma: "مُطَارِدُ الأَطْبَاقِ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من 'طارد' بمعنى المتتبع والمتعقب؛ إذ يُتابع الرامي الطبقَ الطينيَّ
        ببصره فور انطلاقه ويتعقبه قبل تصويبه. يربط أيضاً بالجذر 'طرد' الذي يُمثل مفهوم
        آلة الإطلاق في الإنجليزية (Trap).
    - lemma: "صَيَّادُ الأَطْبَاقِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من 'صَيَّاد' (فَيْعَال من صاد) و'الأطباق'. يستعير مصطلح الصيد للتعبير
        عن ملاحقة هدف متحرك في الهواء، على غرار صياد الطيور. وزن فَيْعَال من الأوزان
        المنتجة للمحترف أو المداوم على فعل.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمة الموجودة ──
    - lemma: "رامي الأطباق"
      expands:
        - text: "«الرَّامِي: مَنْ حِرْفَتُه الرِّمايَةُ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "يُثبت الجذر المعجمي لمكوّن 'رامي' بوصفه صاحب حرفة الرماية"
        - text: "«الحمامة الصَّلْصالية: قرص فخاريّ يُقذَف في الهواء ليُتَّخذ هدفًا للرماة»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن الهدف الطيني المقذوف يُسمى بالعربية 'الحمامة الصلصالية'، ومعادله اللاتيني clay pigeon؛ مما يدعم دلالة 'الأطباق' في المصطلح"
        - text: "«رمادية الطرائد الطينية» [في مقابل trap-shooting]"
          source: "مسرد الفن، التسلية والرياضة — المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
          addition: "يُظهر أن ARABTERM اختارت 'الطرائد الطينية' لا 'الأطباق' للدلالة على الهدف في رياضة رمي الفخار"
        - text: "«رماية صورية، حمام هيكلي» [في مقابل Clay pigeon shoots]"
          source: "مسرد الفن، التسلية والرياضة — ALECSO"
          addition: "مصطلح ALECSO لرياضة رمي الأطباق ككل؛ يُبيّن تعدد المصطلحات العربية للمفهوم ذاته"

    # ── المرشح ١ ──
    - lemma: "رامي الطرود"
      expands:
        - text: "«طرائد» [في مقابل game birds]"
          source: "المكنز الزراعي متعدد اللغات (AGROVOC)"
          addition: "يُثبت أن 'طرائد' (من جذر طرد) تُستخدم لأهداف الصيد الطبيعية، وهو ما يُوظَّف مجازياً لأهداف رماية الأطباق"

    # ── المرشح ٢ ──
    - lemma: "قناص الأطباق"
      confirm:
        - text: "«القُنَّاص: الصيَّاد»"
          source: "التعريفات الفقهية للبركتي (مصدر حوراماني)"
        - text: "«الْقَانِصُ: الصَّائِدُ. وَالْقَنَصُ: الصَّيْدُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«قنّاص أو مقاتل مَدَنيّ» [في مقابل franc-tireur]"
          source: "المورد الحديث (2008)"
          addition: "يدل على استخدام 'قناص' للمقاتل الماهر في الرماية، وهو مجاور دلالي للرامي الرياضي"
        - text: "«(1) قنّاص الخَلَل: عاملٌ خبير في تحديد موطن الخَلَل في الآلات» [troubleshooter]"
          source: "المورد الحديث (2008)"
          addition: "نموذج على إنتاجية 'قناص' في المركبات الإضافية الحديثة"

    # ── المرشح ٣ ──
    - lemma: "مطارد الأطباق"
      evidence_status: "no_material_found"

    # ── المرشح ٤ ──
    - lemma: "صياد الأطباق"
      expands:
        - text: "«الصَّيَّادُ: صاحبُ حِرْفة الصَّيْدِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "يُثبت أن 'صياد' وزنٌ إنتاجي لصاحب الحرفة، لكن دلالته مقيَّدة بالصيد الطبيعي للكائنات الحية"
        - text: "«صياد بالصنارة» [Angler]، «صياد إسفنج» [sponge diver]"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000) — ALECSO"
          addition: "يُبيّن إنتاجية 'صياد' في المركبات الاختصاصية، لكن كلها مرتبطة بالصيد الحيواني لا الرياضة الرمائية"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمة الموجودة ──
    - lemma: "رامي الأطباق"
      decision: confirmed
      decision_reason: >
        المركب الإضافي 'رامي الأطباق' هو المصطلح التوصيفي الأكثر تداولاً لهذا المفهوم في
        العربية المعاصرة. يعتمد على جذر 'رمى' الأصيل الدال على نبذ الشيء وإطلاقه، وعلى
        'أطباق' الدالة على الأقراص المبسوطة. لم يُعثر على مصطلح مفرد أو مركب أكثر تخصصاً
        وتثبيتاً معجمياً. يتوازى مع المصطلح الأعلى (hypernym) 'رامي' مع إضافة المخصص
        الدلالي 'الأطباق'. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يختص بالرامي الذي يستهدف تحديداً الأقراص الطينية المقذوفة من آلة ميكانيكية،
        على خلاف الرامي (المصطلح الأعلى) الذي يشمل كل من يمارس الرماية بصرف النظر عن
        الهدف ونوعه، وعلى خلاف قناص الذي يصيب هدفاً ثابتاً أو بطيئاً متوارياً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَامِي الأَطْبَاقِ"

    # ── المرشح ١ ──
    - lemma: "رامي الطرود"
      source: stage1
      decision: removed
      decision_reason: >
        'الطرود' (جمع طرد) مدعومة في AGROVOC بمعنى 'game birds' أي الطيور الصيدية الحقيقية،
        وليس الأقراص الطينية. استخدامها للدلالة على الأهداف الفخارية يفتقر إلى سند معجمي
        وقد يوقع في لبس مع الصيد الطبيعي. علاوة على ذلك، اللمة بديل طفيف لما هو موجود
        ولا تضيف دلالة مستقلة.

    # ── المرشح ٢ ──
    - lemma: "قناص الأطباق"
      source: stage1
      decision: removed
      decision_reason: >
        'قناص' يرتبط في أصله بالتربص والصيد الخفي (hunting by stealth)، وهو ما يتعارض
        مع طبيعة رماية الأطباق كرياضة رسمية علنية. وإن كانت المعاجم الحديثة توسّع
        استخدامه ليشمل الرامي الماهر والقنّاص العسكري، فإن الجمع بينه وبين 'الأطباق'
        يُنشئ مركباً غير مثبَّت معجمياً، ولا يضيف على 'رامي الأطباق' سوى نبرة مختلفة.
        يُستبقى كمصطلح منافس في لغة الرياضة اليومية لكن لا مسوّغ لإضافته إلى AWN4.

    # ── المرشح ٣ ──
    - lemma: "مطارد الأطباق"
      source: stage1
      decision: removed
      decision_reason: >
        المجاز الدلالي المقترح (مطارد بمعنى متعقب الأطباق) بعيد وغير مستقرّ. لا توجد
        شواهد معجمية ولا استعمال موثّق في سياق رماية الأطباق. يرتبط 'مطارد' في
        الاستعمال المعاصر بالملاحقة الحربية أو القانونية لا بالرياضة.

    # ── المرشح ٤ ──
    - lemma: "صياد الأطباق"
      source: stage1
      decision: removed
      decision_reason: >
        'صياد' محصور دلالياً في صيد الكائنات الحية (أسماك، طيور، حيوانات)، وتشهد
        المعاجم والمصطلحيات على هذا الحصر ('صياد إسفنج'، 'صياد الحشرات'، 'صياد بالصنارة').
        الجمع بين 'صياد' والأطباق الطينية الجامدة يُوقع في مفارقة دلالية. كذلك اجتاز
        اختبار الاستبدال بسهولة مما يكشف أنه وصف حر لا مصطلح مسكوك.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يشارك في رماية الأطباق الطينية التي تقذف في الهواء"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يستعمل 'يشارك في رماية' وهي صياغة غير مباشرة؛ إذ يكفي 'يرمي'.
        كما أن 'تُقذف في الهواء' مبني للمجهول دون تحديد أداة القذف التي هي ركيزة المفهوم
        (آلة الإطلاق). كذلك 'شخص' جنس غير كافٍ دون الإشارة إلى الطابع الرياضي. يحتاج
        التعريف إلى جنس قريب صريح وفصل نوعي يُميّزه عن سائر الرماة.
    authored:
      - type: terminological
        text: "لاعِبٌ رِيَاضِيٌّ يَرْمِي الأَطْبَاقَ الطِّينِيَّةَ الَّتِي تُطْلِقُهَا آلَةُ الإِطْلَاقِ نَحْوَ الهَوَاءِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          هو من يمارس رياضة رماية الأطباق الطينية (Trap Shooting)، وهي رياضة أولمبية
          يُطلق فيها قاذفٌ ميكانيكيٌّ أقراصاً فخارية في الهواء يصوِّب الرامي نحوها
          بالبندقية قبل سقوطها. تُقام مسابقاتها على مسافات ثابتة وبزوايا انطلاق
          متغيرة لزيادة صعوبة التصويب.
    actions:
      - command: update_definition
