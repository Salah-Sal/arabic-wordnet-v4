# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10894127-n  |  ILI: i94602  |  POS: n
# الموضوع: ويليام سيوارد بوروز الأوّل — مخترع آلة الجمع الأمريكي
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل المطلوب"
      - "الاسم المختصر 'بوروز' مشترك لفظيًّا مع حفيده الكاتب ويليام س. بوروز الأكثر شهرةً في الثقافة العربية، دون أي تمييز"
      - "المجموعة تفتقر إلى الصيغة الموازية للإنجليزية 'William Seward Burroughs I' (مع الترتيب العددي الأوّل)"
      - "لا توجد أي مداخل في قاعدة البيانات المعجمية تخص هذه الشخصية التاريخية، مما يدل على فجوة توثيقية"
    observations: >
      هذه مجموعة اسمية علمية لشخصية تاريخية أمريكية (مخترع، 1855-1898)، وليست مصطلحًا لغويًّا قابلًا
      للاشتقاق أو المجاز. اللمّتان الموجودتان تعريبان صوتيان مقبولان لاسم علم أجنبي وفق معايير التعريب
      الصوتي المعتمدة. التحدي الرئيسي ثلاثي: (١) غياب التشكيل، (٢) غياب لاحقة التمييز العددي «الأوّل»
      الضرورية لتجنب الخلط مع حفيده الكاتب الشهير، (٣) غياب الصيغة الأكاديمية الكاملة المقابلة لـ
      "William Seward Burroughs I". التوليد الأعمى لاسم علم أجنبي مقيّد بالتعريب الصوتي والتركيب
      التمييزي، لا بالاشتقاق أو المجاز.

  blind_candidates:
    - lemma: "بُورُوز الأوَّل"
      generation_method: tarkib
      justification: >
        مركب وصفي يضيف لاحقة الترتيب العددي «الأوّل» للاسم المختصر للعائلة، يوازي
        الإنجليزية «Burroughs I»، ويُفرّق الشخصية عن أقاربها الحاملين الاسم ذاته.
    - lemma: "وِيلْيَامُ بُورُوز"
      generation_method: taarib
      justification: >
        تعريب مختصر يجمع الاسم الأول واسم العائلة فقط، متجاهلًا الاسم الأوسط «سيوارد»،
        يناسب السياقات غير الرسمية والإشارية المختصرة.
    - lemma: "وِيلْيَامُ سِيوَارد بُورُوز الأوَّل"
      generation_method: tarkib
      justification: >
        مركب إضافي يجمع الاسم الكامل الثلاثي مع لاحقة التمييز «الأوّل»، يوازي بدقة
        الإنجليزية «William Seward Burroughs I»، وهو الأدق أكاديميًّا وموسوعيًّا.
    - lemma: "وِلِيمُ بُورُوز"
      generation_method: taarib
      justification: >
        تعريب بديل يعتمد وزن «فَعِيل» التقليدي للأسماء الأعجمية (وِلِيم بدل وِيلْيَام)،
        يمثل اصطلاحًا قديمًا لاتيني-عربي لاسم «William» يظهر في بعض المصادر العربية الكلاسيكية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: أُجريت ٥ استعلامات دفعية:
  # (١) مطابقة دقيقة لجميع اللمّات (الموجودة + المرشّحة)
  # (٢) جسر إنجليزي لـ Burroughs / William Seward Burroughs / adding machine
  # (٣) بحث كلمي عربي بمفاتيح: مخترع، آلة حاسبة، براءة اختراع
  # (٤) تحقق دفعي من المرشّحين
  # (٥) استعلام مقاييس اللغة (للسجل فقط)
  # النتيجة الكلية: لا مداخل معجمية لأي من اللمّات — جميعها أسماء أعلام أجنبية التعريب.

  per_lemma:
    - lemma: "بوروز"
      evidence_status: "no_material_found"

    - lemma: "ويليام سيوارد بوروز"
      evidence_status: "no_material_found"

    - lemma: "بُورُوز الأوَّل"
      evidence_status: "no_material_found"

    - lemma: "وِيلْيَامُ بُورُوز"
      evidence_status: "no_material_found"

    - lemma: "وِيلْيَامُ سِيوَارد بُورُوز الأوَّل"
      evidence_status: "no_material_found"

    - lemma: "وِلِيمُ بُورُوز"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "بوروز"
      decision: confirmed
      decision_reason: >
        الاسم المختصر لعائلة Burroughs، مقبول كصيغة إحالية مختصرة في المراجع غير
        الرسمية والسياقات الاختصارية. رغم اشتراكه اللفظي مع حفيده الكاتب، يكتسب
        سياقه من ارتباطه بالمجموعة الترادفية. يستوجب إضافة التشكيل الكامل.
        اختبار الاقتراض: معرَّب صوتي مقبول، مستوعَب في نسيج النص العربي (يقبل ال-
        والنسبة: البوروزي، والجمع: البوروزات). اختبار الاستبدال: لا يمكن استبداله
        بالاسم الكامل في كل سياق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة المختصرة لاسم العائلة وحده، تُستخدم في السياقات الإشارية المختصرة
        والحديث العلمي غير الرسمي؛ أقل دقةً من بقية الصيغ لأنها لا تُمثّل
        الشخصية تمييزًا كاملًا.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُورُوز"

    - lemma: "ويليام سيوارد بوروز"
      decision: confirmed
      decision_reason: >
        الاسم الكامل الثلاثي للمخترع، يوازي الإنجليزية «William Seward Burroughs»
        (بدون رقم تسلسلي). مقبول كصيغة موسوعية رئيسية، مع ملاحظة افتقاره إلى
        لاحقة التمييز «الأوّل» الموجودة في الإنجليزية. يستوجب إضافة التشكيل الكامل.
        اختبار التعبير المركب: تعبير اسمي مركب من ثلاثة عناصر (اسم أوّل + اسم أوسط
        + اسم عائلة)، يُعدّ MWE إضافيًّا (مضافًا إليه) في البنية النحوية العربية لأسماء
        الأعلام الأجنبية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل الثلاثي بدون تمييز عددي؛ يُستخدم في الكتابات الموسوعية
        والتاريخية العامة حين يكون السياق كافيًا للتمييز، وهو أكثر شيوعًا من
        الصيغة المختصرة في المصادر العربية الموثّقة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيلْيَامُ سِيوَارد بُورُوز"

    # ── مرشّحات المرحلة الأولى ───────────────────────────────

    - lemma: "بُورُوز الأوَّل"
      source: stage1
      decision: confirmed
      decision_reason: >
        يملأ فجوة تمييزية حقيقية وضرورية: يوازي «Burroughs I» الإنجليزية، ويُفرّق
        بوضوح بين المخترع (1855-1898) وحفيده الكاتب ويليام س. بوروز (1914-1997)
        الأكثر شهرةً في الثقافة العربية. اختبار السكّ: المركب ثابت لا يقبل إبدال
        «الأوّل» بـ«الكبير» بالمعنى ذاته في هذا السياق الاصطلاحي المحدد.
        اختبار التعبير المركب: مركب وصفي (موصوف + نعت عددي)، ثابت معجميًّا في
        مصطلح التمييز الترتيبي لأسماء الأعلام.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الصيغة المختصرة المميَّزة بالترتيب العددي؛ تُستخدم تحديدًا في السياقات
        التي يُحتمل فيها الخلط بينه وبين حفيده الكاتب، وهي الأنسب في المقالات
        المقارِنة والمراجع ذات الطابع التمييزي.
      actions:
        - command: create_entry
          params:
            lemma: "بُورُوز الأوَّل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "وِيلْيَامُ بُورُوز"
      source: stage1
      decision: removed
      decision_reason: >
        يحذف الاسم الأوسط «سيوارد» المميِّز ويبقي على الاشتراك اللفظي مع حفيده
        الكاتب ويليام بوروز بصورة أشدّ خطورةً؛ إذ يشيع في المصادر العربية أن
        «ويليام بوروز» يُحيل إلى الكاتب الأمريكي لا إلى المخترع، فيعرّض المجموعة
        لسوء التصنيف. لا يُضيف قيمةً تمييزيةً ويزيد من الغموض.

    - lemma: "وِيلْيَامُ سِيوَارد بُورُوز الأوَّل"
      source: stage1
      decision: confirmed
      decision_reason: >
        يوازي بدقة تامة الإنجليزية «William Seward Burroughs I»، وهو الاسم الرسمي
        الكامل في المصادر الأكاديمية والموسوعية. يجمع بين الاسم الكامل الثلاثي
        والتمييز العددي الضروري، فيحقق أعلى مستوى من الدقة التوثيقية. يُستحسن
        وجوده في AWN4 ليكافئ «William Seward Burroughs I» الموجود في OEWN.
        اختبار MWE: مركب إضافي ممتد من أربعة عناصر، وحدة معجمية ثابتة في أسماء
        الأعلام الأجنبية المعرَّبة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الأكاديمية الكاملة الأدق توثيقًا؛ تُستخدم في الموسوعات والمراجع
        العلمية والببليوجرافيات، وهي الأقرب إلى المصطلح الرسمي المعتمد في
        المصادر الإنجليزية الأصلية.
      actions:
        - command: create_entry
          params:
            lemma: "وِيلْيَامُ سِيوَارد بُورُوز الأوَّل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "وِلِيمُ بُورُوز"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب غير معياري لـ«William»؛ الاصطلاح المعتمد في المصادر العربية الحديثة
        هو «ويليام» لا «وِلِيم». إضافة صيغة شاذة تزيد من التشويش دون قيمة تمييزية.
        فحص الاطّراد: «ويليام» هو المعيار الشائع الفصيح في الصحافة والترجمة
        والموسوعات العربية المعاصرة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "مخترع أمريكي حصل على براءة اختراع أول آلة حاسبة عملية (1855-1898)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وصفي مقبول لكنه يفتقر إلى الأسلوب الموسوعي الذي يناسب
        شخصية تاريخية، ويكتفي بترجمة شبه حرفية للإنجليزية. يمكن تحسينه بصياغة
        موسوعية تُبرز منجز الشخصية وتضع التواريخ في موضعها الطبيعي لا بين قوسين
        مُلحَقَين، مع إضافة سياق يُميّز اختراعه (آلة الجمع) عن الحاسبة الحديثة.
    authored:
      - type: encyclopedic
        text: >
          مخترعٌ أمريكيٌّ وُلد عام 1855 وتوفّي عام 1898، اشتُهر بتصميم أوّل آلة
          جمعٍ آليةٍ عملية قابلة للتسويق وتسجيل براءة اختراعها، وقد أسهم اختراعه
          في تحويل العمليات الحسابية الإدارية من العمل اليدوي إلى الأتمتة الميكانيكية.
