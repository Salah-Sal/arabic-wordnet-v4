# ══════════════════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد
# Stage 1: Review + Generate
# ══════════════════════════════════════════════════════════════

stage1_review:

  # أ. التوليد الأعمى — قُرئ الملف المُقنَّع أولاً (بدون لمّات)
  # التعريف الماثل: "رياضي يلعب كرة القدم"
  blind_candidates:
    - lemma: "لاَعِبُ الكُرَةِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي ثنائي من «لاَعِب» + «الكُرَة»، يُشير إلى الرياضي المتخصص في
        لعبة الكرة. أقصر من الصيغة الثلاثية وأيسر تداولاً، غير أنه مُطلق يشمل
        كل ألعاب الكرة لا كرة القدم وحدها.

    - lemma: "كَرَوِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة على وزن فَعَلِيّ من «كُرَة» (جذر: كرو)، بمعنى المنسوب إلى الكرة.
        يُستخدم في بعض التعابير الرياضية للدلالة على الرياضي الكروي بوجه عام.

    - lemma: "قَدَمِيّ"
      generation_method: majaz
      justification: >
        نسبة مجازية إلى «القَدَم» بوصفها الآلة المميِّزة للعبة؛ فكرة القدم
        سُمِّيت باسم العضو المستخدم فيها. المجاز المُرسَل: ذكر الآلة وإرادة
        المتخصص في استخدامها.

    - lemma: "فُوتْبَالِيّ"
      generation_method: taarib
      justification: >
        تعريب الملاذ الأخير لكلمة "footballer/footballist"، موزونة على فُعْلالِيّ
        مع لحاق ياء النسب، تقبل التعريف واشتقاق الجمع السالم (فوتباليّون).
        شائعة في الإعلام الرياضي العربي غير الرسمي.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة الموجودة «لاعب كرة قدم» مُقدَّمة بدون تشكيل."
      - "المركّب ثلاثي المقاطع (لاعب + كرة + قدم)؛ وقد يُستخدم مع ال على «القدم» أحياناً، ولم تُسجَّل الصورتان معاً."
      - "التعريف الحالي «رياضي يلعب كرة القدم» فيه ضعف أسلوبي: فعل «يلعب» يُعيد تركيب «لاعب»، مما يُقرّبه من الدوران الجزئي."
      - "لا يوجد في المجموعة إلا لمّة واحدة، وهي المصطلح المركّب الأكثر شيوعاً؛ يُستحسن مراجعة إمكانية إضافة لمّة ثنائية مسكوكة."
    observations: >
      المجموعة awn4-10637858-n تُمثّل مفهوماً رياضياً حديثاً واضح الدلالة. المصطلح
      «لاعب كرة قدم» مركّب إضافي متسلسل (لاعب ← كرة ← قدم) راسخ في الاستعمال
      الإعلامي العربي المعاصر، ومُثبَّت في معاجم حديثة كالمورد. الأصل اللغوي سليم:
      جذر «لعب» للاعب، وجذر «كرو» للكرة، وجذر «قدم» للقدم. الضعف الرئيسي هو
      غياب التشكيل وغياب صيغة «لاعب كرة القدم» (بالتعريف) كشكل بديل مسجَّل.


# ══════════════════════════════════════════════════════════════
# المرحلة ٢: جمع الأدلة
# Stage 2: Evidence Gathering
# ══════════════════════════════════════════════════════════════

stage2_evidence:

  # ── الاستعلامات المُنفَّذة ──
  # ١. مطابقة دقيقة دفعية: لاعب كرة قدم + لاعب الكرة + كروي + قدمي + فوتبالي
  # ٢. إثراء بالمعرّف: definitions + examples + plurals لـ entry_ids المُعثور عليها
  # ٣. جسر إنجليزي: "soccer player" OR "football player" OR "footballer" OR "soccer" OR "football"
  # ٤. FTS عربي: "كرة القدم" OR "لاعب كرة" OR "فوتبال" OR "قدم"
  # ٥. مقاييس اللغة: جذور لعب، كري، قدم (dictionary_id = 151)

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "لاعب كرة قدم"
      confirm:
        - text: "«لاعبُ كرة القدم.»"
          source: "المورد الحديث (2008) — Al-Mawrid Al-Hadeeth، entry_id: 688819، translation_en: footballer"
        - text: "«لُعبة كُرَة القدم (رب).»"
          source: "المورد الحديث (2008)، entry_id: 671537، translation_en: association football"
      expands:
        - text: "«(1) «أ» كرة القدم (رب). «ب» الكرة نفسها (2) أُلعوبة»"
          source: "المورد الحديث (2008)، entry_id: 688818، translation_en: football"
          addition: >
            يُثبت أن «كرة القدم» هو المقابل العربي المعتمد لـ football/soccer في
            أبرز المعاجم الثنائية الحديثة.

    # ── مرشح المرحلة ١ ──
    - lemma: "لاعب الكرة"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١ ──
    - lemma: "كروي"
      contradicts:
        - text: "«(الكروي) مَا كَانَ على شكل الكرة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)، entry_id: 880710"
          conflict: >
            المصطلح يعني الشكل الكروي (spherical) لا الشخص الذي يلعب كرة القدم.
        - text: "«كُرويّ»، translation_en: spherical"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (arabterm)، entry_id: 353551"
          conflict: >
            في المعجمية التقنية «كروي» وصف هندسي للأجسام الكروية الشكل.
        - text: "«كُرَوِيّ»، translation_en: globular"
          source: "المعجم الموحد لمصطلحات علم الأحياء (arabterm)، entry_id: 454163"
          conflict: >
            «كروي» في علم الأحياء = globular (كالبروتينات الكروية)، بعيد تماماً
            عن دلالة لاعب كرة القدم.
        - text: "«كُرَوِيّ»، translation_en: ball"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (arabterm)، entry_id: 471825"
          conflict: >
            حتى في سياق «ball» التشريحي، المعنى وصفي لا اسمي للاعب الرياضي.

    # ── مرشح المرحلة ١ ──
    - lemma: "قدمي"
      contradicts:
        - text: "«قَدَمِيّ»، translation_en: pedal"
          source: "المعجم الطبي الموحد (arabterm)، entry_id: 624216"
          conflict: >
            المصطلح مُخصَّص في المعجمية الطبية للدلالة على «المتعلق بالقدم تشريحياً»
            (pedal/podalic)، فاستخدامه للاعب كرة القدم يُولِّد اشتراكاً لفظياً مضلِّلاً.
        - text: "«قَدَمِيّ»، translation_en: podalic"
          source: "المعجم الطبي الموحد (arabterm)، entry_id: 630204"
          conflict: >
            «podalic version» = الانعطاف القدمي في التوليد؛ مصطلح طبي راسخ لا صلة له
            بكرة القدم.

    # ── مرشح المرحلة ١ ──
    - lemma: "فوتبالي"
      evidence_status: "no_material_found"


# ══════════════════════════════════════════════════════════════
# المرحلة ٣: التحليل اللغوي للمّات
# Stage 3: Lemma Linguistic Analysis
# ══════════════════════════════════════════════════════════════

stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "لاعب كرة قدم"
      decision: confirmed
      decision_reason: >
        المصطلح مسكوك في المعجمية العربية المعاصرة وثّقه «المورد الحديث» بمعنى
        footballer/soccer player. المركّب الإضافي الثلاثي (لاعب + كرة + قدم) ثابت
        في الإعلام الرياضي العربي ومُتداوَل على نطاق واسع. اجتاز اختبار التثبيت
        المعجمي: لا يمكن إبدال «قدم» بـ«يد» مثلاً وتبقى الوحدة بمعناها نفسه
        (كرة اليد لعبة مختلفة)، مما يُثبت أنها وحدة معجمية ثابتة لا عبارة وصفية حرة.
        يجب تصحيح التشكيل وإضافة صيغة «لاعب كرة القدم» (بالتعريف على القدم).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة؛ تُحدِّد الرياضي بلعبة كرة القدم
        تحديداً دون سواها من ألعاب الكرة، بخلاف المُشير المباشر «لاعب» (hypernym)
        الذي يعمّ جميع الرياضيين.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاَعِبُ كُرَةِ قَدَمٍ"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "لاَعِبُ كُرَةِ الْقَدَمِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لاعب الكرة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية مسجَّلة على هذه الصيغة كمصطلح مسكوك مستقل. فضلاً عن ذلك،
        المصطلح مُطلق يشمل لاعبي كرة السلة وكرة اليد وغيرها، ولا يُحدِّد كرة
        القدم تحديداً. فشل اختبار التثبيت المعجمي: «لاعب الكرة» تعبير وصفي حر
        قابل للتبديل في مكوناته.

    - lemma: "كروي"
      source: stage1
      decision: removed
      decision_reason: >
        تعارض صريح مع الاستعمال المعجمي الراسخ: «كروي» في العربية المعيارية يعني
        «الشكل الكروي» (spherical/globular) في الهندسة والبيولوجيا والتشريح، وليس
        لاعب كرة القدم. استخدامه بمعنى اللاعب يُولِّد اشتراكاً لفظياً مُضلِّلاً
        مع المصطلحية التقنية الراسخة. علاوة على ذلك، جذره معجمياً «كر» الدال على
        التكرار والجمع، لا «كرو» الخاص بالكرة.

    - lemma: "قدمي"
      source: stage1
      decision: removed
      decision_reason: >
        تعارض صريح: المصطلح محجوز في المعجمية الطبية المعتمدة لـ pedal/podalic
        (المتعلق بالقدم تشريحياً). استخدامه للاعب كرة القدم مرفوض بمبدأ عدم
        الاشتراك اللفظي مع المصطلحية الراسخة. المجاز المقترح (الآلة → المستخدِم)
        لم يُسكَّ فعلياً في أي مرجع معجمي.

    - lemma: "فوتبالي"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا التعريب في أي معجم عربي معتمد. مبدأ التعريب يشترط
        القبولَ النظامي وإمكانية التصريف؛ غير أن المعجمية العربية استقرّت على
        «كرة القدم» كمصطلح مُعرَّب/مُترجَم لـ football، ولا داعي لتعريب صيغة
        الفاعل (footballer) طالما «لاعب كرة القدم» مُثبَّت ومتداول.


