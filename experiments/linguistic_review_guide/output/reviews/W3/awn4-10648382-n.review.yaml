# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10648382-n  |  ILI: i93171  |  POS: n
# المفهوم: الشخص الذي يبذر البذور / someone who sows
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمتين (باذر وزارع) خاليتان من التشكيل الكامل"
      - "لمة 'زارع' في المعاجم الكلاسيكية تحمل معنى ثانوياً مشهوراً: 'الزارع' اسم كلب بعينه في التراث، مما يستدعي التنبيه على الفرق بين المعرَّف والنكرة"
      - "التعريف الحالي يستخدم صيغة 'يقوم بنثر' المُطوَّلة بدلاً من الفعل المباشر، وهو مخالف لأسلوب المعجم الوسيط"
      - "التعريف لا يُميّز الباذر كافياً عن الفلاح/المزارع في المجموعة الأم (awn4-10098586-n)"
    observations: >
      المجموعة تُمثّل مفهوماً زراعياً أصيلاً في العربية وهو 'من يبذر البذور'. الجذران
      ب-ذ-ر وز-ر-ع كلاهما موثّقان في مقاييس اللغة بدلالات زراعية صريحة. اللمتان
      موجودتان لكنهما تفتقران إلى التشكيل الكامل وإلى تعريف دقيق يُفرق بينهما وبين
      المجموعة الأم. المفهوم عربي أصيل لا يحتاج إلى مصطلحات مستحدثة ولا إلى تعريب.
      الفرق الدلالي بين اللمتين قابل للتوثيق: باذر أخص (نثر البذور تحديداً) وزارع
      أعم (الزراعة بمعناها الشامل).

  blind_candidates:
    - lemma: "بَذَّار"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر ب-ذ-ر على وزن فَعَّال الدال على الاحتراف والمداومة (كعطَّار
        ونجَّار)، في مقابل فَاعِل الذي يدل على مجرد الحدوث. بَذَّار = من حِرفته
        البذر ومِهنته نثر الحبوب في الأرض.
    - lemma: "نَاثِر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الجذر ن-ث-ر على وزن فَاعِل. وردت في التعريف ذاته كلمة 'نثر'
        بوصفها الفعل الجوهري للمفهوم (يقوم بنثر البذور)، فالنَّاثِر هو من ينثر
        الشيء ويُفرّقه، ومنه نثر البذور في الأرض.
    - lemma: "زَرَّاع"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر ز-ر-ع على وزن فَعَّال الدال على الاحتراف. إذا كان زَارِع
        (فَاعِل) يدل على الفاعل المطلق، فزَرَّاع يدل على من حِرفته الزراعة
        والبذر، وهو أكثر تخصصاً في السياق المهني.
    - lemma: "حَارِث"
      generation_method: majaz
      justification: >
        اسم فاعل من حَرَثَ (شقّ الأرض وهيَّأها). المجاز هنا بالإزاحة الوظيفية:
        الحارث يُهيّئ التربة قبل البذر، وفي كثير من السياقات الزراعية الكلاسيكية
        يشمل الاسم المراحل الأولى كاملةً بما فيها البذر. وقد يُستعمل في الشعر
        بمعنى الفلاح الذي يزرع الأرض.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "باذر"
      confirm:
        - text: "«الباذر؛ الزّارع؛ النّاثر إلخ.»"
          source: "المورد الحديث (2008) — ترجمة sower"
      expands:
        - text: "«الْبَاءُ وَالذَّالُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ نَثْرُ الشَّيْءِ وَتَفْرِيقُهُ. يُقَالُ: بَذَرْتُ الْبَذْرَ أَبْذُرُهُ بَذْرًا، وَبَذَّرْتُ الْمَالَ أُبَذِّرُهُ تَبْذِيرًا»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ)"
          addition: >
            يُثبّت أن بَذَرَ فعل عربي أصيل جذره نثر الشيء وتفريقه، وبَاذِر اسمُ
            فاعله الطبيعي القياسي. الجذر واحد لا أصول متعددة.

    - lemma: "زارع"
      confirm:
        - text: "«زَارِع: من يبذر الحب في الأرض ومن يحرث الأرض للزراعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
      contradicts:
        - text: "«الزَّارِع: اسْمٌ للكَلْبِ. وقيل: اسْمُ كَلْبٍ بعَيْنِه. أولادُ زارِعٍ: الكِلابُ»"
          source: "المعجم الكبير لمجمع اللغة العربية"
          conflict: >
            المُدخَل المُعرَّف 'الزارع' (بأل التعريف) يُحيل في المعاجم الكلاسيكية
            والحديثة إلى اسم كلب بعينه أو جنس الكلاب. غير أن هذا يخصّ الصيغة
            المعرَّفة 'الزارع' لا النكرة 'زارع' التي هي اسم فاعل حيّ. التعارض
            قائم مع الصيغة بأل لا مع اللمة النكرة المقصودة.
        - text: "«الزَّارِع: اسم كلب بعينه وأولادُ زارعٍ: الكلاب (بالإضافة إليه)»"
          source: "المعجم الوسيط لمجمع اللغة العربية (1998)"
          conflict: >
            تُعرِّف المعاجم الحديثة مدخل 'الزارع' المعرَّف تحت جذر زرع بأنه
            اسم كلب بعينه. لكن 'زارع' النكرة (اسم الفاعل الحي) من 'زَرَعَ'
            يبقى صالحاً في الاستعمال الحديث بمعنى الفلاح الزارع.
      expands:
        - text: "«الزَّاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ يَدُلُّ عَلَى تَنْمِيَةِ الشَّيْءِ. وَكَانَ بَعْضُهُمْ يَقُولُ: الزَّرْعُ طَرْحُ الْبَذْرِ فِي الْأَرْضِ. وَزَارِعٌ: كَلْبٌ»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ)"
          addition: >
            الجذر أصله تنمية الشيء وطرح البذر في الأرض، مما يدعم الدلالة الزراعية
            لاسم الفاعل 'زارع' رغم الإشارة العَرَضية إلى التسمية الكلبية.

    - lemma: "بَذَّار"
      evidence_status: "no_material_found"

    - lemma: "نَاثِر"
      confirm:
        - text: "«الباذر؛ الزّارع؛ النّاثر إلخ.»"
          source: "المورد الحديث (2008) — ترجمة sower"
      contradicts:
        - text: "«النَّاثِرُ: مَن يجيد الكتابة نثرًا»"
          source: "المعجم الوسيط لمجمع اللغة العربية"
          conflict: >
            المعنى المُثبَّت للناثر في المعاجم المعيارية هو 'كاتب النثر الأدبي'
            لا ناثر البذور الزراعية. إدراجه في AWN4 بمعنى الباذر سيُنشئ تعارضاً
            مع معناه المعجمي الراسخ في الاستعمال الأدبي والتعليمي.
        - text: "«الناثر: من يجيد الكِتَابَة نثرا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين — مجمع القاهرة (1998)"
          conflict: "تأكيد من مصدر مستقل: الناثر في اللغة المعيارية كاتبُ النثر لا باذرُ البذور."

    - lemma: "زَرَّاع"
      confirm:
        - text: "«الزَّرَّاعُ: من يزرع الأرض. النَّمَّام»"
          source: "المعجم الوسيط لمجمع اللغة العربية"
        - text: "«الزَّرَّاعُ: مَنْ حِرْفَتُه الزِّراعة. النَّمَّامُ؛ قيل: لأَنَّه يَزْرَعُ الأَحقادَ فى قلوبِ الأَحِبَّاءِ»"
          source: "المعجم الكبير لمجمع اللغة العربية"
      expands:
        - text: "«زَرَّاع: معالج الزرع، والنمام الذي يزرع الأحقاد في قلوب الأحباء»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
          addition: >
            يُثبّت أن زَرَّاع كلمة حية في الاستعمال العربي بمعنيَيها: الأساسي
            (معالج الزرع) والمجازي (النمام). المعنى المُعجَمي يُحدّده بمن حِرفته
            الزراعة إجمالاً، وهو أوسع من 'الباذر' المتخصص في نثر البذور.

    - lemma: "حَارِث"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "باذر"
      decision: confirmed
      decision_reason: >
        لمة أصيلة: اسم فاعل قياسي (فَاعِل) من الجذر ب-ذ-ر الذي أصله 'نثر الشيء
        وتفريقه' (مقاييس اللغة). مُثبَّتة في المورد الحديث مع الزارع والناثر
        كمرادفات للـ sower. لا تعارض مع أي معنى آخر راسخ. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        بَاذِر أخص وأدق دلالةً: يُركّز صراحةً على فعل نثر البذور وتفريقها في
        التربة (من الجذر ب-ذ-ر = النثر والتفريق بالذات)، في حين يشمل زَارِع
        الزراعة بمعناها الأشمل من حرث ومعالجة وري. بَاذِر هو المصطلح الأدق
        للمفهوم الموصوف في هذه المجموعة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَاذِر"

    - lemma: "زارع"
      decision: confirmed
      decision_reason: >
        لمة عربية فصيحة اسم فاعل من زَرَعَ، مُثبَّتة في موسوعة السلطان قابوس
        بمعنى 'من يبذر الحب في الأرض'. التعارض المُلاحَظ في المعاجم يخص 'الزارع'
        المعرَّف بأل (الذي صار اسماً لكلب بعينه)، لا 'زارع' النكرة التي هي اسم
        فاعل حي في الاستعمال. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        زَارِع أوسع دلالةً يشمل جميع أعمال الزراعة (حرث وبذر وري ومعالجة)،
        ويُستعمل مجازاً في الوجدان (يزرع المودة، يزرع الخير)؛ في حين يقتصر
        بَاذِر على الفعل الفيزيائي المحدد وهو إلقاء البذور في التربة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَارِع"

    - lemma: "بَذَّار"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي توثيق معجمي لبَذَّار بوصفه اسم فاعل بمعنى 'الباذر
        المحترف'. الصيغة المُسجَّلة في قواعد البيانات هي بِذَار/بذار بمعنى البذور
        (المادة الزراعية لا الشخص)، وفق معجم AGROVOC. وزن فَعَّال من هذا الجذر
        لا يُؤثَر استعماله لاسم الفاعل الإنساني. بَاذِر كافٍ للتعبير عن المفهوم.

    - lemma: "نَاثِر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم إيراد المورد الحديث للناثر ضمن مرادفات sower، تُثبّت المعاجم العربية
        المعيارية (الوسيط والكبير) 'الناثر' بمعنى 'من يجيد الكتابة نثراً' وهو
        المعنى الراسخ في الوعي اللغوي والتعليمي العربي. توظيف ناثر بمعنى باذر
        البذور في AWN4 سيُنشئ التباساً دلالياً مع معناه الأدبي الأصيل الذي لا
        يمكن إغفاله.

    - lemma: "زَرَّاع"
      source: stage1
      decision: removed
      decision_reason: >
        زَرَّاع يعني في المعاجم 'من حِرفته الزراعة' أو 'من يزرع الأرض' بمعناه
        الأشمل، وهو مطابق للمجموعة الأم (فلاح/مزارع) لا لهذه المجموعة المتخصصة
        في الباذر. إدراجه هنا سيُسوّي بين الحيّز الدلالي لمجموعة الباذر وحيّز
        مجموعة الفلاح، فيُفقد الشبكة الدلالية دقتها الهرمية.

    - lemma: "حَارِث"
      source: stage1
      decision: removed
      decision_reason: >
        حَارِث اسم فاعل من حَرَثَ (شقّ الأرض وقلبها تهيئةً للزراعة)، وهو عمل
        سابق للبذر لا مطابق له. المجاز المقترح بتوسيع المعنى ليشمل البذر بعيد
        ولا تعضده الشواهد المعجمية. لا توجد أدلة تُثبّت حارث بمعنى الباذر.


