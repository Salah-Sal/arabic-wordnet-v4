# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14001317-n — earthquake / زلزال
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «اضطراب مدمر للغاية» مبهم جدًّا ولا يُميّز الزلزال عن أيّ كارثة أخرى؛ يفتقر إلى ذكر الأرض أو الاهتزاز"
      - "التعريف الإنجليزي «a disturbance that is extremely disruptive» عامّ أيضًا ولا يتطابق مع المفهوم الجيولوجي المحدَّد"
    observations: >
      المجموعة تضمّ لمَّتين: «زلزال» و«هزة أرضية». الأولى مصطلح أصيل رباعي الجذر (زلزل)،
      والثانية مركّب إضافي-وصفي حديث شائع في الإعلام والمعاجم التقنية. التعريف الحالي بحاجة
      ماسّة إلى تحسين لأنه لا يعكس الطبيعة الجيولوجية للمفهوم. القرآن الكريم استخدم «الرجفة»
      و«الزلزلة» للدلالة على هذا المعنى، فثمة بُعد ديني-ثقافي غني.
  blind_candidates:
    - lemma: "زَلْزَلَة"
      generation_method: ishtiqaq
      justification: "مصدر الفعل زَلْزَلَ على وزن فَعْلَلَة، يدلّ على حدث الاهتزاز العنيف. ورد في القرآن: ﴿إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا﴾"
    - lemma: "رَجْفَة"
      generation_method: ishtiqaq
      justification: "من الجذر رجف الدالّ على الاضطراب عند ابن فارس. ورد في القرآن: ﴿فَأَخَذَتْهُمُ الرَّجْفَةُ﴾، وعرّفه الوسيط بالزلزلة"
    - lemma: "هَزَّة أَرْضِيَّة"
      generation_method: tarkib
      justification: "مركّب إضافي وصفي (هزّة + أرضية) شائع في الاستعمال العلمي والإعلامي المعاصر للدلالة على الزلزال"
    - lemma: "زَعْزَعَة"
      generation_method: majaz
      justification: "من الجذر زعزع بمعنى التحريك الشديد، إزاحة دلالية من التحريك المطلق إلى اهتزاز الأرض المدمّر"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "زَلْزَال"
      confirm:
        - text: "«(الزلزال) هزة أرضية طبيعية تنشأ تَحت سطح الأَرْض (مج) والهول والبلية والشدة (ج) زلازل»"
          source: "المعجم الوسيط"
        - text: "«هَزَّةٌ أَرْضِيَّةٌ تَنْشأُ فى صُخور الْقِشْرَة الأَرْضِيَّة بِسَبَبِ تَصدُّعِها أو نَتيجَة رَدِّ فِعْلٍ لحركاتِ الصُّهارَةِ فيها»"
          source: "المعجم الكبير"
        - text: "«مصطلح يصف كل انزلاق مفاجئ لصفيحة على مستوى صدع، فتهتز الأرض نتيجة لذلك، وتنبعث الطاقة السيزمية الناتجة عن الانزلاق، أو نتيجة لنشاط بركاني أو لتدفق مواد منصهرة»"
          source: "مسرد المناخ والبيئة (ALECSO)"
      expands:
        - text: "«يفرّق اللغويون بين الزلزال بالفتح، والكسر، فيخصون الأول للاسم، والثاني للمصدر، ومنه قوله تعالى: إِذَا زُلْزِلَتِ الأَرْضُ زِلْزَالَهَا. ولكن كثرة استخدام المصدر اسمًا أو صفة تسمح بتصحيح الضبط المرفوض»"
          source: "معجم الصواب اللغوي"
          addition: "الزَّلْزَال بالفتح اسم، والزِّلْزَال بالكسر مصدر"
        - text: "«(الزُّلْزالُ): لغة الزَّلزال والزِّلْزال، وقرأَ الخَلِيلُ: وزُلْزِلُوا زُلْزالاً شَدِيداً»"
          source: "الشوارد للصغاني"
          addition: "ثلاث لغات في ضبط الزاي: الفتح والكسر والضمّ"
        - text: "«الْهَوْلُ والْبَلِيَّةُ والشِّدَّة (على التَّشْبِيه)»"
          source: "المعجم الكبير"
          addition: "للزلزال معنى مجازي: الهول والشدة والبلية"

    - lemma: "هَزَّة أَرْضِيَّة"
      confirm:
        - text: "«حركة جزء من سطح التربة على طول مستوٍ فالق مما يؤدي إلى انتشار أمواج اهتزازية في طبقات التربة تؤدي إلى اهتزاز الأبنية والمنشآت»"
          source: "المعجم الموحد للهندسة المدنية (2012)"
      expands:
        - text: "«(الهزة) يُقَال امْرَأَة هزة مرتاحة للشر نشيطة لَهُ (ج) هزات»"
          source: "المعجم الوسيط"
          addition: "«الهزّة» مفردةً لها معنى مختلف تمامًا؛ المركّب «هزّة أرضية» هو الذي يدلّ على الزلزال"

    - lemma: "زَلْزَلَة"
      confirm:
        - text: "«(الرجفة) الزلزلة»"
          source: "المعجم الوسيط"
        - text: "«الزَّلْزَلَة» [وردت في تعريف الرجفة في المعجم الكبير]"
          source: "المعجم الكبير"
      expands:
        - text: "«وَتَزَلْزَلَتِ الْأَرْضُ: اضْطَرَبَتْ، وَزُلْزِلَتْ زِلْزَالًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الزلزلة مصدر والزلزال اسم، والعلاقة اشتقاقية مباشرة"

    - lemma: "رَجْفَة"
      confirm:
        - text: "«(الرجفة) الزلزلة وَفِي التَّنْزِيل الْعَزِيز {فَأَخَذتهم الرجفة فَأَصْبحُوا فِي دَارهم جاثمين}»"
          source: "المعجم الوسيط"
        - text: "«الزلزلة الشديدة»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«زلزال ضعيف»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) / علوم الزلازل (1999)"
          conflict: "في المصطلحية العلمية الحديثة، الرجفة = tremor أي زلزال ضعيف، وليس مرادفًا للزلزال"
      expands:
        - text: "«وقيل: الرَّجْفَةُ فى القرآن: كُلُّ عَذَابٍ أَخَذَ قومًا. (عن اللَّيْث)»"
          source: "المعجم الكبير"
          addition: "في القرآن قد تعني كل عذاب لا الزلزال فحسب"
        - text: "«(رَجَفَ) الرَّاءُ وَالْجِيمُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى اضْطِرَابٍ. يُقَالُ رَجَفَتِ الْأَرْضُ وَالْقَلْبُ. وَالْبَحْرُ رَجَّافٌ لِاضْطِرَابِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر رجف أصل عام للاضطراب لا يختصّ بالزلزال"

    - lemma: "زَعْزَعَة"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "زَلْزَال"
      decision: confirmed
      decision_reason: >
        مصطلح أصيل رباعي الجذر (زلزل) مؤصَّل في القرآن والحديث والشعر والمعاجم الكلاسيكية والحديثة.
        جميع معاجم المصطلحات العلمية (جيولوجيا، زلازل، طاقة متجددة) تعتمده مقابلًا لـ earthquake.
        اللمّة الحالية بدون تشكيل؛ يُضبط بفتح الزاي الأولى (الزَّلْزَال) للدلالة على الاسم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المركزي الأصيل للزلزال؛ يحمل بُعدًا مجازيًّا (الهول والشدة) إلى جانب المعنى الحرفي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَلْزَال"

    - lemma: "هَزَّة أَرْضِيَّة"
      decision: confirmed
      decision_reason: >
        مركّب اصطلاحي ثابت مسجَّل في المعجم الموحد للهندسة المدنية (2012) مقابلًا لـ earthquake،
        وورد في تعريف الزلزال في الوسيط والكبير. وحدة معجمية راسخة لا يمكن استبدال مكوّناتها
        (لا يُقال «هزّة تُرابية» أو «هزّة جوّية» بنفس المعنى).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تعبير وصفي تقني حديث يُفضَّل في السياقات الإعلامية والعلمية؛ أقلّ شحنة أدبية ومجازية من «زلزال»"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَزَّة أَرْضِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "زَلْزَلَة"
      source: stage1
      decision: removed
      decision_reason: >
        الزلزلة مصدر الفعل زَلْزَلَ، والزلزال هو الاسم. في الاستعمال المعجمي الحديث يُفرَّق بينهما:
        الزلزال هو الحدث/الظاهرة، والزلزلة هي فعل الاهتزاز. إدراج المصدر إلى جانب الاسم في
        المجموعة نفسها يخلط بين الحدث والعملية. كما أنّ معجم الصواب اللغوي يميّز بين الصيغتين.
      evidence_assessment:
        case: mixed

    - lemma: "رَجْفَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أنّ المعاجم الكلاسيكية تعرّف الرجفة بالزلزلة، فإنّ المصطلحية العلمية الحديثة
        (معجم الجيولوجيا 2000، معجم علوم الزلازل 1999) تُقيّدها بمعنى «زلزال ضعيف» (tremor)،
        وهذا يتعارض مع مفهوم المجموعة (earthquake = زلزال كامل). إدراجها هنا يخلق لبسًا
        مصطلحيًّا في الحقل الجيولوجي.
      evidence_assessment:
        case: mixed

    - lemma: "هَزَّة أَرْضِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مكرّرة مع اللمّة الموجودة في المجموعة"
      evidence_assessment:
        case: confirm_only

    - lemma: "زَعْزَعَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية تربط الزعزعة بمفهوم الزلزال تحديدًا. الجذر زعزع يدلّ على
        التحريك الشديد عمومًا دون تخصيص بالأرض، ولم يرد في أيّ معجم مصطلحات جيولوجية.
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "اضطراب مدمر للغاية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مبهم وعامّ؛ لا يذكر الأرض ولا الاهتزاز ولا السبب الجيولوجي.
        يصلح لوصف أيّ كارثة (إعصار، فيضان...) وليس مميِّزًا للزلزال.
    authored:
      - type: terminological
        text: "هَزَّةٌ أَرْضِيَّةٌ طَبِيعِيَّةٌ عَنِيفَةٌ تَنْشَأُ فِي صُخُورِ القِشْرَةِ الأَرْضِيَّةِ بِسَبَبِ تَصَدُّعِهَا أَوْ نَشَاطٍ بُرْكَانِيٍّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
