# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-09945977-n  |  classicist
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «فنان كلاسيكي» مركبٌ وصفي حر لا يجتاز اختبار السك: يمكن إبدال «كلاسيكي» بـ«حديث» أو «رومانسي» ويبقى الوصف صالحاً، فهو عبارة توصيفية لا مصطلح مسكوك."
      - "كلتا اللمّتَيْن خاليتان من التشكيل في البيانات الأصلية."
      - "التعريف العربي «شخص فني يلتزم بالمذهب الكلاسيكي» يحتوي على مشتق من اللمّة نفسها (كلاسيكي ← الكلاسيكي) مما يُفضي إلى دوران تعريفي."
      - "«شخص فني» صياغة ركيكة؛ الأدق «فنان» أو «فنان وأديب»."
    observations: >
      المجموعة تُمثِّل المفهوم الأجنبي «classicist» أي الشخص الملتزم بمبادئ الكلاسيكيَّة
      (المذهب الفني والأدبي المحتذي بالحضارتَيْن الإغريقيَّة والرومانيَّة). المفهوم أجنبي المنشأ
      ولا يوجد له أصل عربي صميم في التراث، غير أن المصطلح «كلاسيكيٌّ» راسخٌ في المعجمية
      العربية المعاصرة بوصفه تعريباً مقبولاً يقبل التصريف (كلاسيكيَّة، كلاسيكيٌّ، كلاسيكيَّات).
      اللمّة المركبة «فنان كلاسيكي» تفتقر إلى التثبيت المعجمي وتعاني من ضعف الاصطلاح.

  blind_candidates:
    - lemma: "مُتَأَصِّلٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر (أ-ص-ل) على وزن مُتَفَعِّل للدلالة على التشبث بالأصول والتمسك بها؛
        من يتأصَّل في مذهبٍ فنيٍّ يعني التزامَه إياه والتجذُّر فيه. اشتُقَّ لمحاكاة
        معنى «يلتزم بالمذهب» مع تجنُّب اللفظ الدخيل.

    - lemma: "مُحَافِظٌ فَنِّيٌّ"
      generation_method: tarkib
      justification: >
        مركَّب وصفي من «مُحَافِظ» (اسم فاعل من حَفَظَ، للدلالة على صون التقاليد)
        و«فنِّيٌّ» (نسبة إلى الفنِّ) للتمييز عن المحافظ السياسي؛ يقابل
        «conservative artist» في الإنجليزية ويوحي بالالتزام بالأصول الفنية الراسخة.

    - lemma: "أَصِيلٌ"
      generation_method: majaz
      justification: >
        مجاز بالإزاحة الدلالية: «الأصيل» في العربية هو المتمكِّن في أصله الكريم العريق؛
        يُستعار للفنان المتجذِّر في التقاليد الفنية القديمة ومذاهبها الراسخة.

    - lemma: "كلاسِيسِيٌّ"
      generation_method: taarib
      justification: >
        تعريب مباشر لـ«classicist» بصيغة النسب العربي (-يٌّ)؛ يختلف عن «كلاسيكيٌّ»
        المشتق من «classic/classical» في أنه مشتق من «classicism» مضافاً إليه
        لاحقة الفاعل (-ist) التي تُعبَّر عنها عربياً باليائية. الملاذ الأخير.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "كلاسيكي"
      confirm:
        - text: "«الكلاسيكيّ: «أ» الملتزم قواعدَ الكلاسيكية في الأدب والفن. «ب» المنادي بضرورة دراسة أدب الإغريق والرومان. «ج» المتضلّع من هذا الأدب.»"
          source: "المورد الحديث (2008) — ARABTERM"
      contradicts:
        - text: "«فترة في تاريخ الموسيقى الأوروبية»"
          source: "مسرد الفن والتسلية والرياضة — ARABTERM"
          conflict: "يستخدم «كلاسيكي» بمعنى الصفة الزمنية (الحقبة الكلاسيكية) لا بمعنى الشخص الملتزم بالمذهب الكلاسيكي، فهو إذاً معنى مختلف."
      expands:
        - text: "«كلاسيكيّ [مفرد]: 1 - اسم منسوب إلى كلاسيكيَّة. 2 - صفة تُطلق على أيّ أدب ممتاز، يتميّز على الأقل ببعض المميّزات الآتية: الاتِّزان والوحدة الفنيّة والاعتدال والبساطة وتناسُب الأجزاء، ولو لم يكن قديمًا. كلاسيكيَّة [مفرد]: النَّزعة الكلاسيكيَّة الجديدة: اتِّجاه في الأدب الأوربيّ ظهر في عهود مختلفة منذ عصر النَّهضة حتى أواخر القرن الثَّامن عشر، الغرض منه بعث الاهتمام من جديد بالأساليب الأدبيّة لقدماء الإغريق والرُّومان والتَّمسك بمعاييرهم التَّقليديّة.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر — Hawramani"
          addition: "يكشف أن «كلاسيكيٌّ» صارت منسوبة معجمياً إلى «كلاسيكيَّة» (المذهب) وتُستعمل وصفاً للأديب أو الفنان المنتمي إلى هذا المذهب."

    - lemma: "فنان كلاسيكي"
      evidence_status: "no_material_found"

    - lemma: "مُتَأَصِّلٌ"
      contradicts:
        - text: "«متأصّل — inherent»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
          conflict: "المصطلح راسخٌ بمعنى «متأصَّل / كامن / ملازم» في حقل التقنيات التربوية والطب، وهو معنى مغاير تماماً لمعنى «الملتزم بالمذهب الكلاسيكي»."
        - text: "«مُتَأَصِّل — inherent»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          conflict: "يُجمع الأدب التقني العربي على استخدام «متأصّل» بمعنى inherent/intrinsic ولا وجود لاستخدامه في الحقل الفني."

    - lemma: "أَصِيلٌ"
      contradicts:
        - text: "«أصيل — genuine / authentic»"
          source: "مسرد التربية — ARABTERM"
          conflict: "دلالته الاصطلاحية المستقرة هي «الأصلي / الحقيقي» (genuine/authentic) في الحقول التقنية والتربوية، وليست وصفاً لمن يلتزم بمذهب فني."
        - text: "«أصيل: الشريف والنجيب.»"
          source: "موسوعة السلطان قابوس لأسماء العرب — Hawramani"
          conflict: "الدلالة المعجمية التراثية: الشريف النسب، وليس المتمسك بمذهب فني."

    - lemma: "مُحَافِظٌ فَنِّيٌّ"
      evidence_status: "no_material_found"

    - lemma: "كلاسِيسِيٌّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "كلاسيكي"
      decision: confirmed
      decision_reason: >
        اللمّة مثبتة معجمياً بوصفها الترجمة العربية المعتمدة لـ«classicist» في المورد الحديث (2008)؛
        وترد في معجم اللغة العربية المعاصرة بوصفها اسماً منسوباً قائماً بذاته. تقبل الإعراب
        والتأنيث (كلاسيكيَّة) والجمع (كلاسيكيُّون / كلاسيكيَّات) والنسب الثانوي (كلاسيكيَّاتٌ).
        رغم أنها تعريب، فإنها اجتازت اختبار التعريب المقبول: قبلت لام التعريف والصرف الكامل
        وثبتت في المعاجم الحديثة الموثوقة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphological_check: "وزن النسبة (-يٌّ) مناسب للصفة الدالة على الانتماء إلى مذهب أو مدرسة."
      loan_check:
        type: taarib
        verdict: "معرَّبة مقبولة — تقبل الصرف الكامل وقد رسخت في المعاجم المعاصرة."
      quality_gate:
        ittiraad: "مطَّرد في جميع السياقات الفنية والأدبية"
        yusr: "سهل التداول — مستخدم في الصحافة العربية والنقد الأدبي"
        mulaama: "ملائم للمفهوم الغربي المستورد"
        ithara_turathi: "لا يوجد مقابل تراثي — التعريب ضرورة"
        ithara_arabi: "لا يوجد اشتقاق عربي صريح للمفهوم"
        ishtiqaqiya: "يشتق منه: كلاسيكيَّة، كلاسيكيَّات، كلاسيكيٌّون"
      nuance_differentiation: >
        «كلاسيكيٌّ» يُحيل إلى الشخص (الفنان أو الأديب) بينما «كلاسيكيَّة» تُحيل إلى المذهب ذاته؛
        ويختلف عن «تقليديٌّ» (الذي يشير إلى الاحتذاء بأعراف أهل الزمان دون اشتراط التراث الإغريقي-الروماني)
        وعن «أكاديميٌّ» الذي يدل على الانتماء إلى المؤسسة التعليمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كلاسِيكِيٌّ"

    - lemma: "فنان كلاسيكي"
      decision: removed
      decision_reason: >
        لم يرد المركب «فنان كلاسيكي» في أي معجم عربي بوصفه وحدة معجمية مثبَّتة.
        يفشل اختبار السك: يمكن إبدال «كلاسيكي» بـ«رومانسي» أو «واقعي» أو «حداثي»
        ويبقى التركيب وصفاً صحيحاً، مما يثبت أنه عبارة توصيفية حرة لا مصطلح مسكوك.
        والمعنى مُغطَّى كاملاً بلمّة «كلاسيكيٌّ» المفردة، فلا مسوِّغ لإبقائه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُتَأَصِّلٌ"
      source: stage1
      decision: removed
      decision_reason: >
        ثبت معجمياً بمعنى «inherent / كامن / ملازم» في الحقول التقنية والطبية والتربوية؛
        لا علاقة له بالمذهب الكلاسيكي الفني. كما أن وزن مُتَفَعِّل يدل على التشبُّث التدريجي
        لا على الانتماء المذهبي، مما يُبعده دلالياً عن المفهوم المطلوب.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "أَصِيلٌ"
      source: stage1
      decision: removed
      decision_reason: >
        دلالته المستقرة في المعاجم الحديثة والتراثية هي «الحقيقي / الشريف الأصل / genuine»،
        وهي دلالة مغايرة تماماً لمعنى «الملتزم بالمذهب الكلاسيكي». استخدامه هنا مجازاً
        سيُنتج التباساً مع دلالته الراسخة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُحَافِظٌ فَنِّيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أساس معجمي له ولا تثبيت اصطلاحي. يفشل اختبار السك: «محافظ سياسي / ديني / أخلاقي»
        كلها صيغ متماثلة لا تشير إلى الكلاسيكية الفنية. فضلاً عن أن «المحافظ» يحمل إيحاءً
        سياسياً مُقحَماً غير مرغوب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "كلاسِيسِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود له في المعاجم العربية. وبما أن «كلاسيكيٌّ» رسخ بالفعل بمعنى «classicist»
        في المورد الحديث ومعجم مختار عمر، فإن إضافة تعريب موازٍ ثانٍ يُفضي إلى تشعُّب غير
        مبرَّر في المصطلحية. القاعدة: لا تُعرَّب كلمة تُغني عنها كلمة معرَّبة راسخة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص فني يلتزم بالمذهب الكلاسيكي"
    assessment:
      decision: revise
      reason: >
        ثلاثة عيوب: (١) «شخص فني» صياغة ركيكة — الأدق «فنانٌ أو أديبٌ».
        (٢) «المذهب الكلاسيكي» يحتوي على مشتق من اللمّة «كلاسيكيٌّ» مما يُنتج دوراناً تعريفياً.
        (٣) التعريف لا يُبيِّن محتوى المذهب (الاحتذاء بالحضارتَيْن الإغريقيَّة والرومانيَّة)،
        فيبقى خالياً من الفصل النوعي المميِّز.
    authored:
      - type: terminological
        text: "فنانٌ أو أديبٌ يلتزم بمبادئ الكلاسيكيَّة ومُثُلها الجماليَّة، محتذياً بالأنماط الفنيَّة والأدبيَّة للحضارتَيْن الإغريقيَّة والرومانيَّة في الاتِّزان والبساطة وتناسب الأجزاء."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "هو الفنانُ أو الأديبُ الذي يتخذ من الكلاسيكيَّة منهجاً في الإبداع، فيحتذي بأساليب الإغريق والرومان ويلتزم بمعاييرهم القائمة على الوضوح والتناسب والعقلانية والسيطرة على العواطف، ويرفض الانفلات الرومانسي والاضطراب الانطباعي."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "فنانٌ أو أديبٌ يلتزم بمبادئ الكلاسيكيَّة ومُثُلها الجماليَّة، محتذياً بالأنماط الفنيَّة والأدبيَّة للحضارتَيْن الإغريقيَّة والرومانيَّة في الاتِّزان والبساطة وتناسب الأجزاء."
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "هو الفنانُ أو الأديبُ الذي يتخذ من الكلاسيكيَّة منهجاً في الإبداع، فيحتذي بأساليب الإغريق والرومان ويلتزم بمعاييرهم القائمة على الوضوح والتناسب والعقلانية والسيطرة على العواطف، ويرفض الانفلات الرومانسي والاضطراب الانطباعي."

  examples:
    per_lemma:
      - lemma: "كلاسِيكِيٌّ"
        examples:
          - text: "يُعدُّ الرسامُ الفرنسيُّ جاك-لويس دافيد كلاسيكيًّا بارزاً، إذ كرَّس فنَّه للموضوعات المأخوذة من التاريخ الإغريقيِّ والرومانيِّ متمسِّكاً بقواعد الاتِّزان والبساطة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدُّ الرسامُ الفرنسيُّ جاك-لويس دافيد كلاسيكيًّا بارزاً، إذ كرَّس فنَّه للموضوعات المأخوذة من التاريخ الإغريقيِّ والرومانيِّ متمسِّكاً بقواعد الاتِّزان والبساطة."


