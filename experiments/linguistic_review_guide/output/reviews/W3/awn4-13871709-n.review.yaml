stage1_review:
  assessment:
    concerns:
      - "اللمّة «الثمانون» تفتقر إلى التشكيل الكامل"
      - "التعريف العربي ترجمة حرفية من الإنجليزية وليس بأسلوب المعجم الوسيط"
      - "المجموعة تحوي لمّة واحدة فقط، وهذا طبيعي للأعداد الترتيبية الكبيرة"
    observations: "هذه المجموعة تمثّل مفهوم العدد الترتيبي (الثمانون) بمعنى المركز الثمانين في سلسلة معدودة. في العربية، الأعداد الترتيبية فوق العاشر تُعبَّر عنها بلفظ العدد الأصلي نفسه مع أداة التعريف، فيُقال: الجزء الثمانون، أي الجزء المتمِّم للثمانين. أقرّ مجمع اللغة المصري هذا الاستعمال."

  blind_candidates:
    - lemma: "الثَّمَانُونَ"
      generation_method: ishtiqaq
      justification: "لفظ العقد «ثمانون» مع أداة التعريف، يُستعمل في العربية للدلالة على الترتيب فوق العاشر، فيُقال: الباب الثمانون، أي الباب المتمِّم للثمانين"
    - lemma: "ثَمَانِينِيّ"
      generation_method: ishtiqaq
      justification: "صفة منسوبة إلى لفظ العقد «ثمانين» على وزن فَعَالِينِيّ، تدلّ على ما يتعلّق بالرقم ثمانين، أجاز مجمع اللغة المصري النسب إلى ألفاظ العقود"
    - lemma: "مُتَمِّمُ الثَّمَانِينَ"
      generation_method: tarkib
      justification: "تركيب إضافي يعبّر عن المركز الثمانين بصيغة «مُتمِّم + عدد»، وهو التعبير الأصلي الذي حُذف منه المضاف في الاستعمال المعتاد"
    - lemma: "ثَمَانُونَ"
      generation_method: ishtiqaq
      justification: "لفظ العقد نفسه بدون أداة التعريف، يُستعمل خبراً أو حالاً للدلالة على الترتيب في سياقات معيّنة"

stage2_evidence:
  per_lemma:
    - lemma: "الثَّمَانُونَ"
      confirm:
        - text: "«عددٌ قَدْرُه ثمانِي عَرَاتٍ , وهو ما يَتْلُو التَّاسِعَ والسَّبْعِينَ في تَرْتِيبِهِ العَدَدِيّ , وقد يُوصَفُ به»"
          source: "المعجم الكبير"
        - text: "«العيد الثمانون — الصواب والرتبة: العيد المتمّ للثمانين [فصيحة] — العيد الثمانون [صحيحة]. التعليق: استخدم هذا الأسلوب جماعة من قدامى العلماء، ومنه قولهم: الجزء العشرون، والورقة العشرون على معنى تمام العشرين، فتحذف كلمة التمام وتقام العشرون مقامها، وقد أقره مجمع اللغة المصري.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«(1) ثمانون (2) pl.: العقد التاسع من العمر أو القرن.»"
          source: "المورد الحديث"
          addition: "يُضيف دلالة العقد التاسع من العمر أو القرن كمعنًى مجازيّ مرتبط"

    - lemma: "ثَمَانِينِيّ"
      confirm:
        - text: "«هذا هو العيد الثمانينيّ — الصواب والرتبة: هذا هو العيد الثمانينيّ [فصيحة]. التعليق: أجاز مجمع اللغة المصري النسب إلى ألفاظ العقود، دون ردها إلى مفردها، كما أجاز أن يلزم لفظ العقد الياء مع اختلاف الموقع الإعرابي.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: "«هذا هو العيد الثمانينيّ — الرأي: مرفوضة — السبب: للنسب إلى لفظ العقد دون رده إلى المفرد.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "اللفظ مرفوض عند بعض اللغويين وإن أجازه المجمع، وهو صفة (adj) لا اسم (n)، فلا يطابق POS المجموعة"

    - lemma: "مُتَمِّمُ الثَّمَانِينَ"
      evidence_status: "no_material_found"

    - lemma: "ثَمَانُونَ"
      confirm:
        - text: "«عددٌ قَدْرُه ثمانِي عَرَاتٍ , وهو ما يَتْلُو التَّاسِعَ والسَّبْعِينَ في تَرْتِيبِهِ العَدَدِيّ , وقد يُوصَفُ به»"
          source: "المعجم الكبير"
      expands:
        - text: "«(1) بالغٌ ثمانين (2) ثمانون.»"
          source: "المورد الحديث (ذيل fourscore)"
          addition: "يُترجم fourscore بثمانون"

stage3_analysis:
  per_lemma:
    - lemma: "الثَّمَانُونَ"
      decision: confirmed
      decision_reason: "لفظ العقد «الثمانون» مع أداة التعريف هو الصيغة المعيارية للتعبير عن الترتيب الثمانين في العربية. ورد في المعجم الكبير بوصفه عدداً يتلو التاسع والسبعين ويُوصف به، وأقرّه مجمع اللغة المصري صريحاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة في المجموعة؛ تدلّ على المركز الثمانين في سلسلة مرتّبة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الثَّمَانُونَ"

    - lemma: "ثَمَانِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "صفة نسبية (adj) لا اسم (n)، فلا تطابق POS المجموعة. كما أنّها تدلّ على النسبة إلى الثمانين (ما يتعلّق بالثمانين) لا على المركز الثمانين نفسه. فضلاً عن رفض بعض اللغويين لها وإن أجازها المجمع."
      evidence_assessment:
        case: mixed

    - lemma: "مُتَمِّمُ الثَّمَانِينَ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ وليس مصطلحاً مسكوكاً؛ لم يُعثر عليه في أيّ معجم. يمكن إبدال «مُتمِّم» بـ«مُكمِّل» فيبقى صالحاً، مما يثبت أنه ليس وحدة معجمية ثابتة (فشل اختبار السكّ)."
      evidence_assessment:
        case: no_material

    - lemma: "ثَمَانُونَ"
      source: stage1
      decision: removed
      decision_reason: "هو نفس اللكسيم «الثمانون» بدون أداة التعريف. اللمّة الموجودة «الثمانون» معرّفة وهي الصيغة الترتيبية المعيارية. لا حاجة لإضافة الصيغة النكرة بوصفها لمّة مستقلة."
      evidence_assessment:
        case: confirm_only

