# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:

  assessment:
    concerns:
      - "المجموعة تصف اسم علم لشخص بعينه؛ التصنيف proper_noun أدقّ من n الوظيفي المجرد،
        وإن كانت AWN4 قد تعتمد n اصطلاحاً موحَّداً لجميع الأسماء"
      - "التشكيل الكامل غائب عن اللمّتين الموجودتين «تيد شون» و«شون»"
      - "لمّة «شون» (اللقب وحده) قابلة للالتباس بوجود الجذر العربي «شن/شون» في المعاجم
        بمعنى خزن الغلة (شونة = مخزن)، وإن كان التعارض شكلياً لا دلالياً"
    observations: >
      المجموعة تنتمي إلى نمط الأعلام الشخصية (proper names) في الشبكة الدلالية، وهو نمط لا
      يقبل توليد لمّات مفهومية عربية أصيلة، إذ لا معادل عربياً وظيفياً لاسم شخص بعينه.
      يقتصر العمل هنا على تعريب الاسم الأجنبي نقلاً صوتياً بالحروف العربية (تأريب).
      تجدر الإشارة إلى أن «التيد» في المعجم العربي يعني الاتئاد والرفق، و«الشونة/شون» تعني
      مخزن الغلة؛ غير أن كليهما تشابه صوتي عرضي لا يُوجِد اشتراكاً لفظياً مُشكِلاً في السياق
      المتخصص لتاريخ الرقص الحديث.

  blind_candidates:
    - lemma: "تَيْد شَوْن"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل «Ted Shawn» مقطعاً بمقطع: «تَيْد» لـ Ted و«شَوْن» لـ Shawn.
        هذا الشكل الأقرب صوتياً والأشيع في المصادر العربية المتخصصة في تاريخ الرقص الحديث.
    - lemma: "شَوْن"
      generation_method: taarib
      justification: >
        تعريب اللقب «Shawn» وحده؛ يُستخدم في الإشارة المختصرة بعد ورود الاسم الكامل،
        وهو نمط معتاد في كتابات تاريخ الفنون الأمريكية المترجمة.
    - lemma: "تِيد شَاوْن"
      generation_method: taarib
      justification: >
        بديل تعريبي يعكس النطق الإنجليزي للمقطع الطويل /ʃɔːn/ باستخدام الألف الممدودة
        «شَاوْن»، وهو نمط استخدمه بعض المترجمين العرب لتفادي الالتباس مع «شون» العربية.
    - lemma: "إِيد شَوْن"
      generation_method: taarib
      justification: >
        تعريب بديل لـ «Ted» إلى «إِيد» قياساً على نمط تعريب الأسماء الإنجليزية ذات المقطع
        القصير المنتهي بصائت مثل Fred → فِريد، وEd → إِيد؛ غير أنه أقل شيوعاً من «تيد».


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
# Q1 — مطابقة دفعية: headword_norm IN ('تيد شون','التيد شون','شون','الشون','تيد','التيد')
# Q2 — جسر إنجليزي: translation_en:"Shawn" OR "Ted Shawn" OR "choreographer" OR "dancer"
# Q3 — FTS كلمات مفتاحية: "راقص" OR "مصمم رقصات" OR "كوريغراف"
# Q4 — مقاييس اللغة (dictionary_id=151): headword_norm IN ('شون','شن','تيد')
stage2_evidence:

  per_lemma:
    - lemma: "تيد شون"
      evidence_status: "no_material_found"
      # ملاحظة: لا يوجد مدخل في قاعدة البيانات لـ «تيد شون» كمركّب اسمي علمي؛
      # متوقَّع لأن الأعلام الشخصية الغربية نادراً ما تُفهرَس في المعاجم العربية.

    - lemma: "شون"
      contradicts:
        - text: "«شَوَّن الغلَّةَ ونحوَها: خزَنَها. شُونة [مفرد] ج شُونات وشُوَن: 1-مخزن
            الغلال «امتلأت الشّونة حبوبًا». 2-مكان يُجمع فيه التِّبْن.
            شَوَّان: خازِن الغَلَّة.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: >
            اللفظ «شون» موجود في العربية بمعنى خزن الغلة وليس اسماً علماً لشخص؛
            التعارض شكلي فحسب (تشابه صوتي عرضي بين اللقب الإنجليزي Shawn
            والجذر العربي شون/شن) ولا يُشكّل اشتراكاً لفظياً حقيقياً في السياق المتخصص.
        - text: "«الشَّوْنَةُ: المَرْأَةُ الحَمْقاءُ. والشَّوْنَةُ: مَخْزِنُ الغَلَّةِ،
            لُغَةٌ مِصْرِيَّةٌ. والشَّوْنَةُ: المَرْكَبُ المُعَدُّ للجِهادِ فِي البَحْرِ،
            لُغَةٌ مِصْرِيَّةٌ أَيْضاً.»"
          source: "تاج العروس لمرتضى الزبيدي"
          conflict: >
            اللقب Shawn المعرَّب لا رابط له بمادة «شون» العربية؛ التوافق الحرفي اتفاقي
            وليس اشتقاقياً ولا دلالياً.

    - lemma: "تَيْد شَوْن"
      evidence_status: "no_material_found"

    - lemma: "شَوْن"
      evidence_status: "no_material_found"

    - lemma: "تِيد شَاوْن"
      evidence_status: "no_material_found"

    - lemma: "إِيد شَوْن"
      evidence_status: "no_material_found"

  # أدلة سياقية مساندة من الجسر الإنجليزي:
  supplementary_en_bridge:
    - translation_en: "choreographer"
      arabic_found: "مُصَمِّم الرَّقَصات"
      source: "المورد الحديث (2008) — المورد الحديث (2008)"
      note: "يؤكد أن المصطلح العربي المقابل لـ choreographer هو «مصمم الرقصات»،
        وهو ما يتسق مع اللمّات المذكورة في المجموعة المرجعية awn4-09939741-n"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:

  per_lemma:

    # ── لمّات موجودة ──────────────────────────────────────────

    - lemma: "تيد شون"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المعرَّب للشخص المقصود (Ted Shawn)؛ هو اللمّة المرجعية الأساسية
        ولا بديل عربياً أصيلاً لاسم علم شخصي غربي. التشكيل الكامل مفقود → update_lemma.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يحمل الاسم الأول واللقب معاً فيُحدِّد الشخص تحديداً كاملاً؛ يُستخدم في الإشارة
        الرسمية الأولى أو حين يكون التمييز عن حاملي اللقب ذاته ضرورياً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَيْد شَوْن"

    - lemma: "شون"
      decision: confirmed
      decision_reason: >
        اللقب وحده يُستخدم اختصاراً في السياق المتخصص بعد ورود الاسم الكامل مرةً.
        التشكيل مفقود → update_lemma. التعارض الشكلي مع «شون» العربية (مخزن الغلة)
        عرضيٌّ ولا يُشكّل إشكالاً في السياق التخصصي لتاريخ الرقص.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        لقب عائلي مجرد بلا الاسم الأول؛ يوظَّف في الإشارة المختصرة ضمن السياق الذي
        سبق فيه ذكر الاسم الكامل، على نحو ما يجري في الكتابات الأكاديمية ومراجعات تاريخ الفن.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَوْن"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────

    - lemma: "تَيْد شَوْن"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة «تيد شون» بعد إضافة التشكيل؛ إجراء update_lemma على اللمّة
        الموجودة يكفي ولا حاجة إلى إنشاء مدخل جديد.

    - lemma: "شَوْن"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة «شون» بعد إضافة التشكيل؛ يُعالَج عبر update_lemma.

    - lemma: "تِيد شَاوْن"
      source: stage1
      decision: removed
      decision_reason: >
        الضبط «شَاوْن» بالألف الممدودة أقل شيوعاً في المصادر العربية المتاحة مقارنةً
        بـ «شَوْن»؛ إضافة صيغة موازية غير ضرورية وتُشتّت القارئ.

    - lemma: "إِيد شَوْن"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب «Ted» إلى «إِيد» غير معهود في المصادر الثقافية والأكاديمية العربية؛
        الصيغة السائدة هي «تيد» وقد سُجِّلت في المجموعة.


