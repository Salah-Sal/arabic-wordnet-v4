# التعريف: (في ألعاب الملاعب) اللاعب الذي يرسل الكرة لبدء نقطة
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة المُدرجة 'مُرسل' ناقصة التشكيل: مُرسَل (اسم مفعول = المُرسَل إليه) تختلف عن مُرسِل (اسم فاعل = من يرسل)، والأولى لا تعبِّر عن المعنى المقصود"
      - "المجموعة تضمّ لمّة واحدة فقط — تحتاج إثراء بمرادفات أو ألفاظ متداولة في أدبيات الألعاب الرياضية العربية"
      - "التعريف الحالي يُجمل السياق في 'ألعاب الملاعب' دون تخصيص أمثلة كالتنس أو الكرة الطائرة أو كرة الريشة"
    observations: >
      المجموعة تُمثِّل مفهوماً رياضياً محدوداً بألعاب الملاعب (court games): ذلك اللاعب الذي
      يبدأ النقطة بإرسال الكرة ضرباً (السيرف/الإرسالة الافتتاحية). الجذر المركزي للمصطلح هو
      (ر-س-ل) الدالُّ على الانبعاث والامتداد، وقد استقرَّ مصطلح «الإرسال» في الأدبيات الرياضية
      العربية للدلالة على هذه الضربة؛ فاسم الفاعل الطبيعي منه «مُرسِل». غير أن كلمة «مُستَهِلّ»
      (من استهلَّ بمعنى ابتدأ) تُوفِّر بديلاً راسخاً مُعجمياً مع تضمُّنها معنى الافتتاح والبدء.

  blind_candidates:
    - lemma: "مُرسِل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن مُفعِل من الجذر (ر-س-ل). ومصطلح «الإرسال» راسخٌ في لغة الرياضة
        العربية للدلالة على ضربة البداية (service)؛ فـ«مُرسِل الكرة» = من يُرسلها، وهذا مباشَرٌ
        دلالياً ومطَّرد صرفياً.
    - lemma: "مُستَهِلّ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن مُستَفعِل من الجذر (ه-ل-ل) عبر استهلَّ (بمعنى افتتح وابتدأ).
        التعريف يقول «لبدء نقطة»، واستهلال النقطة = الشروع فيها وافتتاحها؛ ومن ثَمَّ
        «المُستَهِلّ» = من يستهلّ/يفتتح كلَّ نقطة بضربته.
    - lemma: "مُبادِئ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن مُفاعِل من الجذر (ب-د-أ) عبر بادأَ (= بدأ أولاً). «اللاعب
        المُبادِئ» = من يتولَّى البدء والمبادأة بالضربة الأولى في كل نقطة.
    - lemma: "مُخدِم"
      generation_method: majaz
      justification: >
        إحياء بالمجاز من الجذر (خ-د-م): ضربة الإرسال تُسمَّى «الخدمة» (ترجمة لـ service)
        في بعض قواميس المصطلح الرياضي العربي؛ فـ«المُخدِم» = من يقدِّم الخدمة/الإرسالة
        الافتتاحية. وهو وزن مُفعِل من أَخدَمَ.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفَّذة: ٥ (headword batch × ١، English bridge × ١،
#                     Arabic FTS × ١، مرشِّح validation × ١، مقاييس × ١)
stage2_evidence:
  per_lemma:

    - lemma: "مُرسِل"
      expands:
        - text: >
            «الرَّاءُ وَالسِّينُ وَاللَّامُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ مُنْقَاسٌ، يَدُلُّ عَلَى
            الِانْبِعَاثِ وَالِامْتِدَادِ. فَالرَّسْلُ: السَّيْرُ السَّهْلُ... وَرَسِيلُ الرَّجُلِ:
            الَّذِي يَقِفُ مَعَهُ فِي نِضَالٍ أَوْ غَيْرِهِ، كَأَنَّهُ سُمِّيَ بِذَلِكَ لِأَنَّ
            إِرْسَالَهُ سَهْمَهُ يَكُونُ مَعَ إِرْسَالِ الْآخَرِ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر رسل يدلّ على الانبعاث والامتداد، وذكر ابن فارس «إرسال السهم» في سياق
            المنافسة، مما يعزِّز دلالة مُرسِل على من يُطلق ضربة الإرسال في الملعب.
        - text: >
            «المرسل: transmitter» [في مجال الكهرباء]؛
            «المرسل: consigner» [في مجال التجارة والمحاسبة]
          source: "موسوعة الكهرباء IEC 60050 / المعجم الموحد لمصطلحات التجارة (1995)"
          addition: >
            مُرسِل مُثبَتٌ في قواميس المصطلح الحديث بمعنى «من/ما يُرسِل»، مما يُثبِّت
            اشتقاقيته وقياسيتها ويُجيز استخدامه في السياق الرياضي.
      contradicts:
        - text: >
            «المُرْسَل: مَا سَقَطَ مِنْ إِسْنَادِهِ الصَّحَابِيُّ كَأَنْ يَقُولَ التَّابِعِيُّ
            قَالَ رَسُولُ اللَّهِ ﷺ»
          source: "المعجم الوسيط (hawramani) / كشاف اصطلاحات الفنون للتهانوي"
          conflict: >
            الصيغة السائدة في المعاجم الكلاسيكية هي «المُرسَل» بفتح السين (اسم مفعول)
            بالدلالة الحديثية، مما يعني أن الشكل الموجود في السجل قد يُقرأ خطأً بالفتح،
            ويستوجب تشكيل الكسرة صراحةً: مُرسِل.

    - lemma: "مُستَهِلّ"
      confirm:
        - text: >
            «(٢) المُستَهِلّ: مَن يستهلُّ ضربَ الكرة [في التنس إلخ]»
          source: "المورد الحديث (2008) — ترجمة server"
      expands:
        - text: >
            «الْهَاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى رَفْعِ صَوْتٍ، ثُمَّ يُتَوَسَّعُ
            فِيهِ... وَاسْتَهَلَّ الصَّبِيُّ صَارِخاً: صَوَّتَ عِنْدَ وِلَادِهِ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر ه-ل-ل يدلُّ على الابتداء بصوت وعلو؛ استهلَّ = ابتدأ وانطلق أولاً.
            وقد جاء المورد الحديث باستخدام «المستهلّ» اصطلاحاً رياضياً صريحاً.

    - lemma: "مُبادِئ"
      contradicts:
        - text: >
            «المبادئ: هي التي تتوقف مسائل العلم عليها كتحرير المذاهب...
            فللبحث أجزاء مترتبة بعضها على بعض وهي المبادئ والأواسط والمقاطع»
          source: "التوقيف على مهمات التعاريف للمناوي / كشاف اصطلاحات الفنون للتهانوي"
          conflict: >
            الصيغة «المبادئ» في المعاجم جمعٌ لـ«مبدأ» (= أسس/مبادئ علمية)، لا اسم
            فاعل من «بادأ». اسم الفاعل من بادأ هو «مُبادِئ» لكنه غير مُثبَت في سياق
            رياضي، وسيحمل القارئ على الخلط مع المعنى الأشيع (الجمع).

    - lemma: "مُخدِم"
      contradicts:
        - text: >
            «(المخدِّم) من عمله أن يقدِّم خادماً لغيره (محدثة)»
          source: "المعجم الوسيط"
          conflict: "المُخدِّم مستخدَم للوسيط في تقديم الخدم، لا للاعب يرسل الكرة."
        - text: >
            «مخدِّم: server» [في مجال المعلوماتية — مثل مخدِّم HTTP، مخدِّم FTP...]
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: >
            مُخدِّم راسخٌ رسوخاً تاماً بمعنى «خادم الشبكة» (IT server) في عشرات
            المصطلحات المعلوماتية؛ استخدامه للاعب الرياضي سيوقع في اشتراك لفظي حاد.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُرسل"
      decision: confirmed
      decision_reason: >
        الجذر رسل والاشتقاق الصرفي (اسم فاعل: مُرسِل) واضحان ومطَّردان، وقد استقرَّ
        مصطلح «الإرسال» في التنس والكرة الطائرة وكرة الريشة للدلالة على ضربة البداية،
        فـ«مُرسِل» هو الأنسب اشتقاقياً. غير أن الشكل المُدرَج «مُرسَل» (بالفتح) يُوحي
        باسم المفعول، لذا يجب تصحيحه إلى مُرسِل (بالكسر = اسم فاعل).
      evidence_assessment:
        case: mixed
      morphological_fitness: >
        وزن مُفعِل صحيح لاسم الفاعل من الرباعي المزيد أَفعَلَ؛ الإرسال = الفعل،
        المُرسِل = الفاعل. التشكيل القائم «مُرسَل» (فتح السين) يعطي اسم المفعول
        وهو غلط صرفي في هذا السياق.
      borrowing_check:
        type: ishtiqaq
        verdict: عربي أصيل — لا اقتراض
      quality_gate:
        consistency: مطَّردٌ على وزن مُفعِل القياسي
        ease_of_use: سهل التداول والاشتقاق
        suitability: مناسبٌ للسياق الرياضي
        heritage_preference: أصيلٌ من تراث عربي
        arabic_preference: عربي خالص
        derivability: يقبل المصدر (إرسال)، الجمع (مُرسِلون)، النسبة
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُرسِل يُركِّز على فعل الإرسال والإطلاق الجسدي للكرة — يُفيد الحركة الانبعاثية
        المحسوسة. يُستخدم أكثر في التنس والكرة الطائرة وكرة الطاولة حين تُشيع لغة
        «ضربة الإرسال».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرسِل"

    - lemma: "مُستَهِلّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        المورد الحديث (2008) يُثبِت المُستَهِلّ صراحةً بمعنى «من يستهلّ ضرب الكرة
        في التنس إلخ»، وهو توثيق معجمي حديث مباشر. الاشتقاق سليم (استهلَّ = بدأ
        وانطلق)، والجذر هلل يدلّ على البدء والانطلاق. يُكمِل مُرسِلاً بتضمُّنه
        معنى الافتتاح والمبادرة.
      evidence_assessment:
        case: confirm_only
      morphological_fitness: >
        وزن مُستَفعِل اسم فاعل من استفعل، قياسيٌّ وصحيح؛ يقبل الجمع (مُستَهِلُّون)
        والتأنيث (مُستَهِلَّة) والنسبة.
      borrowing_check:
        type: ishtiqaq
        verdict: عربي أصيل — لا اقتراض
      quality_gate:
        consistency: مطَّرد صرفياً
        ease_of_use: مقبول التداول
        suitability: ملائم جداً — يُعبِّر عن الافتتاح والبداية
        heritage_preference: جذر تراثي أصيل
        arabic_preference: عربي خالص
        derivability: يقبل الاشتقاق الكامل
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُستَهِلّ يُركِّز على البُعد الزمني: هو من يَستَهِلُّ النقطة ويفتتحها أولاً،
        مع إيحاء بالمبادرة والتصدِّي للإرسال. يُصلح خاصةً حين يكون التركيز على
        ترتيب الدور لا على الفعل الحركي للكرة.
      actions:
        - command: create_entry
          params:
            lemma: "مُسْتَهِلّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10602056-n"

    - lemma: "مُبادِئ"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة «مُبادِئ» في المعاجم معروفةٌ جمعاً لـ«مبدأ» لا اسمَ فاعل من «بادأ»؛
        مما يُفضي إلى خلط فوري. فضلاً عن ذلك فهي غير مُثبَتة في أي سياق رياضي،
        وتفشل اختبار الاستبدال (يمكن وصف اللاعب بعبارات متعددة).

    - lemma: "مُخدِم"
      source: stage1
      decision: removed
      decision_reason: >
        «مُخدِّم» مرسَّخٌ في عشرات المعاجم التقنية بمعنى «خادم الشبكة» (IT server)؛
        استخدامه للاعب الرياضي سيُوقع في اشتراك لفظي حاد لا يمكن تجاوزه.


