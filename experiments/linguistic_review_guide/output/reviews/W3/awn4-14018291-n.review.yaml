# مراجعة المجموعة الترادفية — awn4-14018291-n
# license / licence — حرية الانحراف عمداً عن القواعد
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«خروج عن المألوف» عبارة وصفية تدل على فعل الانحراف لا على حرية الانحراف؛ فالمجموعة تعبّر عن الحرية/الإذن لا عن الفعل ذاته"
      - "«رخصة» بدون تشكيل؛ ودلالتها الأولى في المعاجم العربية: التخفيف الشرعي (خلاف العزيمة) أو الإذن الحكومي، وليست حرية التجاوز الأدبي أو السلوكي"
      - "المجموعة الرأسية (hypernym) هي «حرية» مما يؤكد أن المطلوب اسم لنوع من الحرية لا لفعل الخروج"
    observations: "المفهوم المستهدف هو حرية الانحراف المتعمد عن القواعد المعتادة في السلوك أو الكلام، وهو ما يُعبَّر عنه في الإنجليزية بـ license/licence بالمعنى المجازي (لا معنى الترخيص الرسمي). في العربية يقترب من مفهوم «التَّرَخُّص» و«التَّجَوُّز» في الأساليب والكلام، وكذلك من «الرُّخْصَة» بمعناها الفقهي المعمَّم"
  blind_candidates:
    - lemma: "تَرَخُّص"
      generation_method: ishtiqaq
      justification: "مصدر تَرَخَّصَ من الجذر ر خ ص على وزن تَفَعُّل، ومعناه الأخذ بالرُّخصة والتوسع في الأمر دون استقصاء، وهو أقرب لفظ عربي يدل على حرية التجاوز عن القواعد"
    - lemma: "تَجَوُّز"
      generation_method: ishtiqaq
      justification: "مصدر تَجَوَّزَ من الجذر ج و ز على وزن تَفَعُّل، ومعناه التساهل في الأمر واحتماله والتكلم بالمجاز، ويُستعمل خصوصاً في سياق الكلام والأسلوب"
    - lemma: "تَسَاهُل"
      generation_method: ishtiqaq
      justification: "مصدر تَسَاهَلَ من الجذر س ه ل على وزن تَفَاعُل، ومعناه التسامح والتياسر، وقد يدل على حرية عدم التشدد في القواعد"
    - lemma: "إِبَاحِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من إباحة (ب و ح)، ومعناه في المعجم الوسيط: التحلل من قيود القوانين والأخلاق، وهو أقرب للدلالة على حرية التجاوز المطلق"


stage2_evidence:
  per_lemma:
    - lemma: "خروج عن المألوف"
      evidence_status: "no_material_found"

    - lemma: "رُخْصَة"
      confirm:
        - text: "«التسهيل في الأمر والتيسير»"
          source: "المعجم الوسيط"
        - text: "«(1) «أ» إذْن؛ رُخصة؛ ترخيص بعمل. «ب» حرية العمل (3) «أ» حرية يُساء استعمالها. «ب» فسق؛ فجور (4) الرُّخصة: انحراف عن الشكل أو القاعدة يقوم به الفنان أو الكاتب لِما يُحْدثه ذلك من أثر مستحبّ في نفس الناظر أو القارئ poetic license»"
          source: "المورد الحديث (ترجمة license)"
        - text: "«الرُّخْصَةُ فِي الْأَمْرِ: خِلَافُ التَّشْدِيدِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(في الشرع): ما يغير من الأمر الأصلي إلى يُسر وتخفيف, كصلاة السفر. وهى خلاف العزيمة»"
          source: "المعجم الوسيط"
          addition: "الدلالة الشرعية الأولى للرخصة هي التخفيف لعذر، وهي أضيق من دلالة المجموعة التي تشمل التجاوز المتعمد"
        - text: "«إِذْنٌ تُبِيحُ به الحكومة لحامله مزاولة عمل ما أو استعمال شيء, كرخصة الطاهي, ورخصة السيارة»"
          source: "المعجم الوسيط"
          addition: "دلالة الإذن الرسمي مغايرة لدلالة المجموعة"

    - lemma: "تَرَخُّص"
      confirm:
        - text: "«في الأمورِ: أَخَذ فيها بالرُّخْصَةِ»"
          source: "المعجم الكبير"
        - text: "«في حَقِّه: أَخَذَ كُلَّ ما تَيَسَّرَ منه ولم يَسْتَقْصِ»"
          source: "المعجم الكبير"
        - text: "«ترخص فِي الْأُمُور أَخذ فِيهَا بِالرُّخْصَةِ»"
          source: "المعجم الوسيط"

    - lemma: "تَجَوُّز"
      confirm:
        - text: "«في هذا الأمْرِ: احْتَمَلَه وتَساهَلَ فيه»"
          source: "المعجم الكبير"
        - text: "«في كلامه: تَكَلَّم بالمَجاز»"
          source: "المعجم الكبير"
        - text: "«في الصَّلاةِ: خَفَّفَ فيها»"
          source: "المعجم الكبير"
      expands:
        - text: "«الجَواز الشِّعريّ: ما يجوز للشاعر من خروج على القواعد أو الشكل التقليدي أو المنطق رغبةً في إحداث أثرٍ مطلوب»"
          source: "المورد الحديث (ترجمة poetic license)"
          addition: "تركيب «الجواز الشعري» يقابل poetic license تماماً، مما يؤكد أن جذر ج و ز يحمل دلالة التجاوز المقبول عن القواعد"

    - lemma: "تَسَاهُل"
      confirm:
        - text: "«الشىءُ: سَهُلَ ولم يَعْسُرْ. وــ فلانٌ: تسامَحَ. تِساهَل الناسُ: تياسروا وتسامحوا»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«التساهل: في العبارة أداء اللفظ بحيث لا يدل على المراد دلالةً صريحة»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "التساهل عند الجرجاني مصطلح بلاغي يعني الأداء غير الصريح، وليس حرية التجاوز عن القواعد"

    - lemma: "إِبَاحِيَّة"
      contradicts:
        - text: "«التحلل من قيود القوانين والأخلاق»"
          source: "المعجم الوسيط"
          conflict: "الإباحية تدل على التحلل المطلق والفوضى الأخلاقية، وهو أشد سلباً من مفهوم المجموعة الذي يعني حرية محدودة للتجاوز"
        - text: "«الإباحيّة: هي فرقة من المتصوّفة المبطلة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الدلالة التاريخية مرتبطة بفرقة دينية مذمومة، مما يجعل اللفظ محملاً بدلالات سلبية شديدة"


