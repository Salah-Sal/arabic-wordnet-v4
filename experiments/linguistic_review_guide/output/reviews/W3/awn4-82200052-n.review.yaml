# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (حرفي وصانع ماهر) خاليتان من التشكيل الكامل؛ وغيابه في (حرفي) خطير لأنه يُلبِّس بين حِرَفِيٌّ (نسبة إلى الحِرفة = craftsman) وحَرْفِيٌّ (نسبة إلى الحَرف = literal)، وكلا الشكلين موثّق في المعاجم بدلالتين مختلفتين"
      - "تتطابق لمّتا هذه المجموعة (حرفي، صانع ماهر) مع لمّتَي المجموعة الأم awn4-09994955-n تماماً — وهو تصادم معجمي يُلغي التمييز الدلالي بين الأصل وفرعه"
      - "التمييز بين هذه المجموعة وأمّها مبني على إضافة 'ذكر' وحدها، وهو تمييز مقتبس من بنية WordNet الإنجليزية؛ إذ إن حِرَفِيٌّ في العربية مذكّر بطبيعته الصرفية (المؤنث: حِرَفِيَّة)، فالتمييز الجنسي مُدمَج في البنية الصرفية العربية لا في مستوى المعجم"
      - "صانع ماهر لا يجتاز اختبار السكّ المعجمي بصرامة: يمكن إبدال (ماهر) بـ(بارع) أو (متقن) أو (حاذق) ويبقى الوصف صالحاً — مما يُضعف اعتباره تعبيراً اصطلاحياً ثابتاً"
    observations: "تعكس هذه المجموعة بنيةً تدرجية من WordNet الإنجليزي مبنيةً على التمييز الجنسي (craftsman ← male craftsman / female craftsman). هذا التمييز طبيعي في الإنجليزية لكنه زائد في العربية التي تُعبّر عنه بالصياغة الصرفية؛ فحِرَفِيٌّ مذكّر بذاته وحِرَفِيَّةٌ مؤنثٌ بذاته. الأجدر معجمياً أن تُميَّز هذه المجموعة عن أمّها بلمّة مذكّرة صريحة من خارج دائرة اللمّة الأم. التعريف الحالي مقبول البنية لكنه يُحيل 'مبدع' جنساً قريباً — واللائق معجمياً 'رجل' أو 'شخص من الذكور'. على الصعيد الإيجابي، حِرَفِيٌّ مصطلح راسخ موثَّق في المعجم الوسيط والمعجم الكبير وعشرات المعاجم التقنية."
  blind_candidates:
    - lemma: "صَنَّاعٌ"
      generation_method: ishtiqaq
      justification: "وزن فَعَّال من جذر (ص ن ع)، يدل على المبالغة في الإتقان والكثرة في الصنعة؛ استُعيد هذا الوزن ليُعبّر عن الحِرَفي البالغ الغاية في الصنعة اليدوية"
    - lemma: "حَاذِقٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (حذق) على وزن فَاعِل، والحذق هو الإتقان والمهارة الفائقة في الفن أو الصنعة؛ يُعبّر عن شخص بلغ الغاية في مهارة صناعة يدوية"
    - lemma: "أُسْتَاذُ الحِرْفَةِ"
      generation_method: tarkib
      justification: "مركّب إضافي: أستاذ (المتقن الماهر في صناعته) + الحِرفة (العمل اليدوي المتخصص)؛ يُعبّر بإيجاز عن مفهوم المتقن الأعلى في الحِرف اليدوية"
    - lemma: "مُتْقِنٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (أتقن) على وزن مُفْعِل، يدل على من أحكم صنعته وأجادها إلى أعلى مستوى؛ مناسب لمفهوم 'ذو مهارة عالية'"


