# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'لاعب كرة طائرة' خالية من التشكيل الكامل"
      - "التعريف الحالي 'شخص يلعب لعبة الكرة الطائرة' يستخدم 'شخص' جنساً قريباً أضعف من 'لاعب'، ويكرر 'لعبة' مع الفعل 'يلعب' مما يولّد حشواً"
      - "لا يوجد مدخل مستقل لـ'لاعب كرة طائرة' في المعاجم المُستعلَمة، مما يستدعي التحقق من الصيغة الأشيع"
    observations: >
      المجموعة بسيطة ومحددة المعنى: تعني الشخص الذي يمارس رياضة الكرة الطائرة.
      اللمّة الموجودة تركيب إضافي-وصفي (لاعب + كرة طائرة)، وهي قياسية في العربية.
      ثمة صيغة مختصرة شائعة في الصحافة الرياضية هي 'لاعب الطائرة' (بإضافة الألف واللام على المنعوت).
      الجذور المكوّنة هي: (ل-ع-ب) لمكوّن 'لاعب'، و(ك-و-ر) لمكوّن 'كرة'، و(ط-ي-ر) لمكوّن 'طائرة'.

  blind_candidates:
    - lemma: "لاعِبُ الطَّائِرَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي بين 'لاعِب' و'الطَّائِرَة'، وهي الصيغة المختصرة الشائعة
        للمصطلح في الصحافة الرياضية العربية؛ إذ يُحذف لفظ 'كرة' تخفيفاً
        ويُكتفى بالوصف الدالّ 'الطائرة' الذي يحيل على الكرة الطائرة بالمعهودية.

    - lemma: "لاعِبُ كُرَةِ الطَّائِرَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي-وصفي كامل (لاعِب + كُرَة + الطَّائِرَة) بإضافة ألف ولام التعريف
        على 'الطائرة'؛ وهي صيغة رسمية يُوظَّف فيها التعريف لتحديد الكرة المعروفة.

    - lemma: "طَائِرِيٌّ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق بالنسبة من 'الطائرة' (رياضة الكرة الطائرة) على وزن فَاعِلِيّ
        للدلالة على المنتسب إلى هذه الرياضة ممارسةً، يُستخدم اسماً بالتأويل
        ('اللاعب الطائري' → 'الطائري') كما في نظيره 'كروي' نسبةً إلى كرة القدم.

    - lemma: "مُطَيِّر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل 'طيَّرَ' (باب التفعيل) على وزن مُفَعِّل، بمعنى من يُطيِّر
        الكرة ويُمررها عبر الشبكة — استناداً إلى الأصل الدلالي لجذر (ط-ي-ر) الدالّ
        على الخفة في الهواء. مقترح نظري يحتاج إلى تثبيت معجمي.


