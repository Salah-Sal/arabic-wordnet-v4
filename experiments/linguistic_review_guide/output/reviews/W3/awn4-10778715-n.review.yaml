        رياضة الكرة الطائرة في السياق الرياضي العربي، مما يجعل 'لاعب الطائرة' وحدة
        معجمية ثابتة تجتاز اختبار السكّ (لا يمكن إبدال 'الطائرة' بـ'الجوية' مع بقاء
        الدلالة الرياضية). الصيغة شائعة في الصحافة الرياضية العربية ومتداولة تداولاً
        واسعاً في التقارير والمباريات.
      evidence_assessment:
