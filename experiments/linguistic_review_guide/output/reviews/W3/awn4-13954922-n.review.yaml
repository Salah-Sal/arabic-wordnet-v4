stage1_review:
  assessment:
    concerns:
      - "«علاقة غير شرعية» تعبير وصفي عام قد لا يكون وحدة معجمية ثابتة — يمكن إبدال «شرعية» بـ«مشروعة» مع بقاء المعنى"
      - "«نزوة» معناها الأصلي الوثبة والسَّورة، وتوسّعها للعلاقة الجنسية السرية توسّع مجازي حديث، وقد تدلّ على فعل عابر لا علاقة مستمرة"
      - "المجموعة تفتقر إلى مصطلح تراثي كلاسيكي مسكوك للعلاقة الجنسية غير المشروعة"
    observations: "المفهوم المستهدف هو علاقة (relationship) جنسية سرية أو غير مشروعة — أي صلة مستمرة لا مجرد فعل عابر. «علاقة غير شرعية» تركيب وصفي شائع في الإعلام الحديث لكنه لا يختص بالبُعد الجنسي. «نزوة» تدل على الاندفاع اللحظي أكثر من العلاقة الممتدة. يحتاج السَّياق إلى مصطلح يجمع بين البُعد الجنسي والسرية والاستمرار."

  blind_candidates:
    - lemma: "سِفَاح"
      generation_method: ishtiqaq
      justification: "من جذر «سفح» بمعنى إراقة الماء بلا عقد نكاح. مصطلح فقهي كلاسيكي مسكوك يدل على العلاقة الجنسية بغير عقد شرعي، وورد في القرآن والحديث والشعر"
    - lemma: "عَلَاقَة غَرَامِيَّة"
      generation_method: tarkib
      justification: "تركيب إضافي/وصفي مثبت في المعاجم الثنائية الحديثة (المورد) مقابل affair وamour، يجمع بين دلالة العلاقة المستمرة والبُعد العاطفي/الجنسي"
    - lemma: "غَرَام"
      generation_method: majaz
      justification: "من جذر «غرم» بمعنى الملازمة واللزوم — توسّع مجازياً للتعلّق الشديد والحب. لكنه أعمّ من العلاقة السرية"
    - lemma: "مُعَاشَرَة غَيْر شَرْعِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي مسجّل في المعجم الموحد لمصطلحات القانون مقابل concubinage، يدل على علاقة معاشرة بين خليل وخليلته"

