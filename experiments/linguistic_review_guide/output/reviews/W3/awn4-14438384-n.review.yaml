# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14438384-n (solitude)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «حالة أو وضع الانفراد» يستخدم لفظ «الانفراد» وهو أحد اللمّات — دوران جزئي"
      - "لمّة «وحدة» شديدة الاشتراك اللفظي (unit قياسية، وحدة سياسية، وحدة عسكرية) مما قد يُلبس"
    observations: "المجموعة تعبّر عن مفهوم الانفراد بالنفس والبقاء وحيداً دون رفقة، وهو مفهوم عربي أصيل ورد في الشعر والأدب والتصوف. المُقَيَّد العلوي (hypernym) هو الانعزال/العزلة، والفرق أن الانفراد قد يكون اختيارياً بينما العزلة قد تحمل معنى القسر أو البُعد عن الجماعة. الجذران الأساسيان المرشحان هما «فرد» و«وحد» و«خلو»."
  blind_candidates:
    - lemma: "خَلْوَة"
      generation_method: ishtiqaq
      justification: "من جذر خ ل و على وزن فَعْلَة (اسم هيئة)، تدل على حالة الانفراد بالنفس والخلوّ من الناس، وردت في المعاجم الكلاسيكية بمعنى Solitude"
    - lemma: "تَوَحُّد"
      generation_method: ishtiqaq
      justification: "من جذر و ح د على وزن تَفَعُّل (مصدر الفعل الخماسي توحَّد)، يدل على البقاء مفرداً والانفراد بالنفس"
    - lemma: "وَحْدَة"
      generation_method: ishtiqaq
      justification: "من جذر و ح د على وزن فَعْلَة، بمعنى الانفراد، ورد في كتب المصطلحات أنّ الوحدة هي الانفراد"
    - lemma: "فَرْدَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من فَرْدَان (المنفرد)، يدل على حالة كون المرء فرداً وحيداً"


stage2_evidence:
  per_lemma:
    - lemma: "اِنْفِرَاد"
      confirm:
        - text: "«الْفَاءُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى وُحْدَةٍ. مِنْ ذَلِكَ الْفَرْدُ وَهُوَ الْوَتْرُ. وَالْفَارِدُ وَالْفَرْدُ: الثَّوْرُ الْمُنْفَرِدُ.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«انفراد وتفرق»"
          source: "مقاييس اللغة لابن فارس (مادة فذّ)"
        - text: "«على انفراد؛ كلٌّ بمفرده»"
          source: "المورد الحديث"
      expands:
        - text: "«الانفراد — انظر: الانفرادة»"
          source: "مختصر العبارات لمعجم مصطلحات القراءات للدوسري"
          addition: "يُستعمل الانفراد في علم القراءات بمعنى تفرُّد قارئ بوجه من الأداء"

    - lemma: "وَحْدَة"
      confirm:
        - text: "«الوحدة: الانفراد، والواحد الذي لا ينقسم بوجه لا فرضا ولا وهما ولا فعلا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الْوَاوُ وَالْحَاءُ وَالدَّالُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ. مِنْ ذَلِكَ الْوَحْدَةِ.»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الإنفراد، والإتحاد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) عُزْلة؛ انعزال (2) القَفْر؛ الأرض المُقْفِرة» [ترجمة solitude]"
          source: "المورد الحديث"
      contradicts:
        - text: "«(الْوحدَة) المربعة (فِي الرياضة والهندسة) مربع طول أحد أضلاعه وحدة من وحدات الْقيَاس الطولي... و(فِي النظام السياسي) اتِّحَاد أمتين أَو أكثر»"
          source: "المعجم الوسيط"
          conflict: "الاشتراك اللفظي الشديد: وحدة بمعنى unit (قياسية/إدارية/عسكرية) أكثر شيوعاً في الاستعمال المعاصر من وحدة بمعنى الانفراد"

    - lemma: "خَلْوَة"
      confirm:
        - text: "«الخلوة:[في الانكليزية] Solitude، lonely place... عند بعض الصوفية هي العزلة، وعند بعضهم غير العزلة، فالخلوة من الأغيار والعزلة من النفس»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«خلوة الإنسان: انفرادُه بنفسه»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الخلوة: محادثة السر مع الحق، حيث لا أحد ولا ملك»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«(الْخلْوَة) مَكَان الِانْفِرَاد بِالنَّفسِ أَو بغَيْرهَا»"
          source: "المعجم الوسيط"
          conflict: "التعريف الأول في الوسيط يجعل الخلوة مكاناً لا حالة، والمجموعة تصف حالة"

    - lemma: "تَوَحُّد"
      confirm:
        - text: "«(توَحد) ... وَفُلَان: بَقِي مُفردا»"
          source: "المعجم الوسيط"
        - text: "«(1) توحّد؛ تنسُّك؛ اعتكاف (2) عُزْلة (3) سَجْن. وبخاصة: سَجْن انفراديّ» [ترجمة solitude]"
          source: "المورد الحديث"
      contradicts:
        - text: "«تَوَحُّدٌ تَنْظِيمِيٌّ»"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية"
          conflict: "في الاستعمال المعاصر أصبح «التوحد» مصطلحاً طبياً شائعاً لاضطراب طيف التوحد (autism)، مما يُثقل اللفظ بدلالة جديدة مهيمنة"

    - lemma: "فَرْدَانِيَّة"
      contradicts:
        - text: "«فردانية» [ترجمة individuality / haploidy]"
          source: "المعجم الموحد لمصطلحات علم الوراثة / مسرد علم الاجتماع"
          conflict: "الفردانية مصطلح مستقر بمعنى individualism في علم الاجتماع وhaploidy في الوراثة، وليس بمعنى الانفراد أو الوحدة"


stage3_analysis:
  per_lemma:
    - lemma: "اِنْفِرَاد"
      decision: confirmed
      decision_reason: "مصدر الفعل انفرد، يدل مباشرة على حالة كون المرء وحيداً. مؤيَّد بنص مقاييس اللغة (جذر فرد = الوحدة) وبالاستعمال المعاصر الواسع. لا اشتراك لفظي مُلبِس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الفعل الإرادي أو الحالة الناتجة عن التفرّد والابتعاد عن الجماعة، ويُستعمل في سياقات محايدة (على انفراد = privately/alone) دون إيحاء بالوحشة أو الحزن"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْفِرَاد"

    - lemma: "وَحْدَة"
      decision: confirmed
      decision_reason: "معنى الوحدة بمعنى الانفراد ثابت في كتب التعريفات والمصطلحات الكلاسيكية (المناوي: الوحدة = الانفراد). مقاييس اللغة يؤكد أن جذر وحد يدل على الانفراد. الاشتراك اللفظي مع وحدة (unit) موجود لكنه لا يمنع صحة الاستعمال بالمعنى المقصود."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تحمل إيحاءً وجدانياً بالوحشة والانقطاع عن الناس أكثر من «انفراد»، وتُستعمل للدلالة على حالة نفسية (شعر بالوحدة) لا مجرد وصف مكاني أو ظرفي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَحْدَة"

    - lemma: "خَلْوَة"
      source: stage1
      decision: removed
      decision_reason: "الخلوة في الاستعمال المعجمي الأعم تدل على المكان (مكان الانفراد بالنفس — المعجم الوسيط) أو على الممارسة الصوفية (محادثة السر مع الحق — الجرجاني)، وهي أخص من مفهوم المجموعة العام. كما أنها واردة بالفعل في المقيَّد العلوي (عزلة/انعزال) بوصفها قريبة منه دلالياً."
      evidence_assessment:
        case: mixed

    - lemma: "تَوَحُّد"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود المعنى في المعجم الوسيط والمورد الحديث، فقد هيمن على اللفظ في الاستعمال المعاصر معنى اضطراب طيف التوحد (autism)، مما يجعله مُلبِساً في سياق الشبكة الدلالية المعاصرة."
      evidence_assessment:
        case: mixed

    - lemma: "فَرْدَانِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الفردانية مصطلح مستقر في علم الاجتماع بمعنى individualism وفي علم الوراثة بمعنى haploidy، ولا يدل على حالة الانفراد والوحدة المقصودة في هذه المجموعة."
      evidence_assessment:
        case: contradicts_only


