stage1_review:
  candidates:
    - lemma: عَمُود
      generation_method: ishtiqaq
      justification: "من العمد وهو الاستقامة والارتفاع، واستعير للترتيب الرأسي للبيانات في الجداول"
    - lemma: رَتَل
      generation_method: majaz
      justification: "الرتل هو القطيع من الحيوانات أو الأفراد المنتظمين في خط، ويستعار هنا للترتيب العمودي للمعلومات"
    - lemma: قَائِمَة
      generation_method: ishtiqaq
      justification: "من القيام، وهي مجموعة من العناصر المرتبة عمودياً كالمعلومات والأسماء"
    - lemma: حَقْل بَيَانَات
      generation_method: tarkib
      justification: "تركيب إضافي يُستخدم في قواعد البيانات للتعبير عن العمود الذي يحوي نوعاً واحداً من المعلومات"
  concerns:
    - اللمة الموجودة تفتقر إلى التشكيل.
  observations:
    - اللمة "عمود" هي المصطلح القياسي المستخدم للتعبير عن الترتيب الرأسي في الجداول والمصفوفات ويقابلها بالإنجليزية "column".

stage2_evidence:
  - lemma: عَمُود
    evidence_status: found
    dictionary_entries:
      - source: "معجم مصطلحات المعلوماتية (2000)"
        text: "«1- سلسلةُ عناصرَ مرتبة عمودياً ضمن إطار عمل معيّن، مثل: سلاسل مستمرة من الخلايا تُنفَّذ من الأعلى إلى الأسفل ضمن وريقات الجدولة spreadsheet، أو مجموعة من الأسطر ذات عرض معيّن ضمن صفحة مطبوعة، أو خط عمودي من البكسلات على شاشة فيديوية، أو مجموعة قيم مرصوفة عمودياً في جدول أو مصفوفة.»"
        classification: confirm
      - source: "المورد الحديث (2008)"
        text: "«(1) عمود (2) نهرٌ أو عمود في صفحة مطبوعة (3) عمود [في صحيفة] مخصَّصٌ لموضوع أو لكاتب معيَّن (4) رَتَلٌ؛ طابور؛ صفّ طويل.»"
        classification: expands

  - lemma: رَتَل
    evidence_status: found
    dictionary_entries:
      - source: "المعجم الوسيط"
        text: "«(الرتل) الطيب من كل شيء وبياض الأسنان وكثرة مائها وجماعة من الخيل أو السيارات يتبع بعضها أثر بعض (محدثة)»"
        classification: contradicts
  
  - lemma: قَائِمَة
    evidence_status: found
    dictionary_entries:
      - source: "المعجم الوسيط"
        text: "«(القائمة) من السيف مقبضه وواحدة قوائم الدابة وتستعار للإنسان والخوان والسرير وورقة تقيد بها الأسماء والأشياء في صف قائم»"
        classification: contradicts

  - lemma: حَقْل بَيَانَات
    evidence_status: found
    dictionary_entries:
      - source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
        text: "«جزء محدد من تسجيلة قاعدة معطيات. الحقول من النوع نفسه تصلح دائما لتخزين المعطيات من النوع نفسه»"
        classification: contradicts

stage3_analysis:
  - lemma: عَمُود
    evidence_evaluation: confirm_only
    mwe_test: false
    dialectal_check: passes
    substitutability_test: passes
    borrowing_check:
      status: native
    quality_gate:
      - passes
    morphological_fit: "وزن فَعُول يدل على المبالغة والثبوت، ويناسب ما يعتمد عليه كالعمود المادي، واستعير للترتيب الرأسي للبيانات."
    final_decision: confirmed
    actions:
      - command: update_lemma
        params:
          lemma: عَمُود
      
  - lemma: رَتَل
    evidence_evaluation: contradicts_only
    mwe_test: false
    dialectal_check: passes
    substitutability_test: fails
    borrowing_check:
      status: native
    quality_gate:
      - fails
    morphological_fit: "لا يناسب الدلالة الخاصة بالمعلومات بل يدل على الطابور البشري أو المادي."
    final_decision: removed

  - lemma: قَائِمَة
    evidence_evaluation: contradicts_only
    mwe_test: false
    dialectal_check: passes
    substitutability_test: fails
    borrowing_check:
      status: native
    quality_gate:
      - fails
    morphological_fit: "يدل على الفهرس أو الورقة التي تقيد فيها الأسماء، وليس الترتيب الرأسي ضمن هيكل جدولي."
    final_decision: removed

  - lemma: حَقْل بَيَانَات
    evidence_evaluation: contradicts_only
    mwe_test: idafi
    dialectal_check: passes
    substitutability_test: fails
    borrowing_check:
      status: native
    quality_gate:
      - fails
    morphological_fit: "تركيب يخص قواعد البيانات ولا يطابق مفهوم العمود بشكل عام."
    final_decision: removed

stage4_content:
  definition:
    action: revise
    type: terminological
    text: "تَرْتِيبٌ رَأْسِيٌّ لِلأَرْقَامِ أَوِ المَعْلُومَاتِ كَمَا فِي الجَدَاوِلِ أَوِ المَصْفُوفَاتِ."
    quality_check: "تعريف مصطلحي دقيق يشمل الجنس القريب (ترتيب رأسي) والفصل النوعي (للأرقام والمعلومات في جداول) ويفضل على الترجمة الحرفية."
    actions:
      - command: update_definition
        params:
          text: "تَرْتِيبٌ رَأْسِيٌّ لِلأَرْقَامِ أَوِ المَعْلُومَاتِ كَمَا فِي الجَدَاوِلِ أَوِ المَصْفُوفَاتِ."
  
  examples:
    - lemma: عَمُود
      type: usage
      text: "يُمَثِّلُ كُلُّ عَمُودٍ فِي هَذَا الجَدْوَلِ نَوْعاً مُخْتَلِفاً مِنَ البَيَانَاتِ."
      actions:
        - command: add_sense_example
          params:
            lemma: عَمُود
            text: "يُمَثِّلُ كُلُّ عَمُودٍ فِي هَذَا الجَدْوَلِ نَوْعاً مُخْتَلِفاً مِنَ البَيَانَاتِ."

