# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13870446-n — الرابع عشر (fourteenth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «الرابع عشر» مركب عددي ترتيبي مبني على فتح الجزأين، وقد تحتاج ضبطاً دقيقاً لتشكيلها"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو أمر طبيعي للأعداد الترتيبية التي لا تملك مرادفات حقيقية"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي ويحتاج صياغة معجمية أصيلة"
    observations: "المفهوم هو العدد الترتيبي الرابع عشر بوصفه مرتبةً في سلسلة معدودة. الأعداد الترتيبية المركبة (من 11 إلى 19) في العربية تُبنى على فتح الجزأين عند الجمهور. لا يوجد ترادف حقيقي لهذا المفهوم لأنه عدد ترتيبي محدد بذاته."
  blind_candidates:
    - lemma: "الرَّابِعَ عَشَرَ"
      generation_method: tarkib
      justification: "المركب العددي الترتيبي المبني على فتح الجزأين، وهو الصيغة الفصيحة الوحيدة للدلالة على المرتبة 14 في سلسلة معدودة"
    - lemma: "رَابِعَ عَشَرَ"
      generation_method: tarkib
      justification: "الصيغة النكرة من المركب العددي الترتيبي، تُستعمل في سياقات الإضافة مثل: رابعَ عشرَ الشهرِ"
    - lemma: "الرَّابِعَةَ عَشْرَةَ"
      generation_method: tarkib
      justification: "الصيغة المؤنثة من المركب العددي الترتيبي، تُستعمل مع المعدود المؤنث مثل: المرتبة الرابعةَ عشرةَ"
    - lemma: "المَرْتَبَةُ الرَّابِعَةُ عَشْرَةَ"
      generation_method: tarkib
      justification: "تركيب وصفي إضافي يجمع بين لفظ المرتبة والعدد الترتيبي المؤنث، لكنه عبارة وصفية حرة وليس مصطلحاً مسكوكاً"

stage2_evidence:
  per_lemma:
    - lemma: "الرَّابِعَ عَشَرَ"
      confirm:
        - text: "«الرَّابِعُ عَشَرَ — الجذر: ر ب ع — مثال: جَاء اليومُ الرابِعُ عَشَرَ — الصواب والرتبة: جاء اليومُ الرابِعَ عَشَرَ [فصيحة] — جاء اليومُ الرابِعُ عَشَرَ [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«(1) الرابع عشر the fourteenth day (2) بالغ جزءًا من 14 من كذا a fourteenth share of the money (3) الرابع عشر من كذا the fourteenth of the month (4) جزء من أربعة عشر a fourteenth of the total»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«القاعدة السائدة أنَّ الأعداد المركَّبة، من 11 إلى 19، وكذلك الأوصاف منها تُبْنَى على فتح الجزأين، مهما كان موقعها الإعرابي في الجملة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "تأكيد القاعدة النحوية: البناء على فتح الجزأين هو الأفصح"
    - lemma: "رَابِعَ عَشَرَ"
      evidence_status: "no_material_found"
    - lemma: "الرَّابِعَةَ عَشْرَةَ"
      evidence_status: "no_material_found"
    - lemma: "المَرْتَبَةُ الرَّابِعَةُ عَشْرَةَ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الرَّابِعَ عَشَرَ"
      decision: confirmed
      decision_reason: "هذا هو العدد الترتيبي المركب الفصيح للدلالة على المرتبة 14، مؤكَّد في معجم الصواب اللغوي والمورد الحديث. الأفصح البناء على فتح الجزأين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الرَّابِعَ عَشَرَ"
    - lemma: "رَابِعَ عَشَرَ"
      source: stage1
      decision: removed
      decision_reason: "الصيغة النكرة لا تُستعمل وحدها للدلالة على المرتبة، بل تأتي دائماً مضافة أو معرّفة. لا حاجة لإضافتها مع وجود الصيغة المعرّفة."
    - lemma: "الرَّابِعَةَ عَشْرَةَ"
      source: stage1
      decision: removed
      decision_reason: "صيغة التأنيث تخصّ المعدود المؤنث فقط، وهي صيغة صرفية مختلفة وليست مرادفة دلالياً. في الشبكة الدلالية الإنجليزية الأصل تُستعمل صيغة واحدة محايدة (fourteenth)، والعربية تميّز بحسب جنس المعدود."
    - lemma: "المَرْتَبَةُ الرَّابِعَةُ عَشْرَةَ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست وحدة معجمية ثابتة. تفشل في اختبار السكّ: يمكن إبدال «المرتبة» بـ«الدرجة» أو «المنزلة» مع بقاء التعبير وصفاً صالحاً."

