    concerns:
      - "اللمّة «السادس» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "التعريف العربي دائري: يستخدم كلمة «السادس» في تعريف المجموعة التي لمّتها «السادس»"
      - "المجموعة تحتوي على لمّة واحدة فقط — قد يكفي ذلك لمفهوم عددي ترتيبي بسيط"
    observations: "المفهوم هو المرتبة السادسة في سلسلة معدودة، وهو مفهوم عددي ترتيبي أصيل في العربية. اسم الفاعل «سادِس» من الجذر «سدس» على وزن فاعِل هو الصيغة الفصيحة الوحيدة للدلالة على هذا الترتيب. لا حاجة لتوليد بدائل كثيرة لأن المفهوم مُعجَم بصيغة واحدة محددة."

  blind_candidates:
    - lemma: "سَادِسٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الفعل سَدَسَ على وزن فاعِل، يدل على الترتيب السادس في العدد. هو الصيغة الصرفية العربية الأصيلة للعدد الترتيبي من ستة."
    - lemma: "سَدِيسٌ"
      generation_method: ishtiqaq
      justification: "صيغة فَعِيل من الجذر سدس، وردت في المعاجم الكلاسيكية بمعنى السُّدُس (الكسر) وسن البعير في الثامنة. اختبار مبدئي لملاءمتها للدلالة الترتيبية."
    - lemma: "المَنْزِلَة السَّادِسَة"
      generation_method: tarkib
      justification: "مركب وصفي من «منزلة» (مرتبة) و«سادسة» (ترتيبي مؤنث). اختبار لإمكان وجود مركب اصطلاحي ثابت يدل على المرتبة السادسة."
    - lemma: "المَوْقِع السَّادِس"
      generation_method: tarkib
      justification: "مركب وصفي من «موقع» (مكان/مركز) و«سادس» (ترتيبي). اختبار لإمكان وجود مركب معجمي مسكوك."


stage2_evidence:
  per_lemma:
    - lemma: "السَّادِسُ"
      confirm:
        - text: "«(1) سادِس؛ سادِسة (2) سُدْسيّ: بالغٌ سُدْسَ شيء (3) السُّدْس: جزء من ستّة (4) السّادس؛ السادسة.»"
          source: "المورد الحديث (2008)"
        - text: "«سدَسَ يَسدُس ويسدِس، سَدْسًا، فهو سادِس، والمفعول مَسْدوس• سدَس القومَ: صار سادسَهم، كمَّلهم بنفسه سِتَّة.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«لا: سادس درجة في سلم دو الكبير»"
          source: "مسرد الفن، التسلية والرياضة (ArabTerm)"
      expands:
        - text: "«السِّينُ وَالدَّالُ وَالسِّينُ أَصْلٌ فِي الْعَدَدِ، وَهُوَ قَوْلُهُمُ السُّدُْسُ: جُزْءٌ مِنْ سِتَّةِ أَجْزَاءٍ. وَإِزَارٌ سَدِيسٌ، أَيْ سُدَاسِيٌّ. وَالسِّدْسُ مِنَ الْوِرْدِ فِي أَظْمَاءِ الْإِبِلِ: أَنْ تَنْقَطِعَ الْإِبِلُ عَنِ الْوِرْدِ خَمْسَةَ أَيَّامٍ وَتَرِدَ السَّادِسَ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أن أصل الجذر سدس في العدد، ويذكر ورود «السادس» في سياق الورد"

    - lemma: "سَدِيسٌ"
      contradicts:
        - text: "«وبعضهم يقول للسُدسِ سَديسٌ، كما يقال للعُشرِ عشير»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          conflict: "سديس يعني الكسر (السُّدُس = جزء من ستة)، لا الترتيب (السادس = الذي يأتي بعد الخامس)"
        - text: "«السَّديسُ: ضَرْبٌ من المَكاكيكِ، والشاةُ: أتَتْ عليها السنةُ السادسة، وإزارٌ طولُه ستةُ أذرُعٍ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "دلالات سديس في المعاجم تدور حول الكسر وعمر الحيوان والمقياس، لا الترتيب العددي"

    - lemma: "المَنْزِلَة السَّادِسَة"
      evidence_status: "no_material_found"

    - lemma: "المَوْقِع السَّادِس"
      evidence_status: "no_material_found"


