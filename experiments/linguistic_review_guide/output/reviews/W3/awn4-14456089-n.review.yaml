# مراجعة المجموعة الترادفية — awn4-14456089-n
# baronetcy / barony — رتبة أو مقام البارون أو البارونة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «لقب البارون» عبارة وصفية حرة وليست مصطلحاً مسكوكاً؛ يمكن إبدال «لقب» بـ«رتبة» أو «منصب» دون تغيير المعنى"
      - "المفهوم غربي إقطاعي لا نظير له في النظام العربي الإسلامي التقليدي"
      - "التعريف العربي يخلط بين baronetcy (رتبة البارونيت) وbarony (رتبة البارون) وهما رتبتان مختلفتان في نظام الألقاب البريطاني"
    observations: "المجموعة تتعلق بمفهوم من نظام الألقاب الإقطاعي الأوروبي. كلمة «بارون» معرَّبة عن الفرنسية/الألمانية وشائعة في الاستعمال العربي الحديث. الخيار الطبيعي هو الاشتقاق منها بالمصدر الصناعي (-يّة). أمّا التعبير «لقب البارون» فهو تركيب إضافي وصفي حر لا يفي بشروط المصطلحية."
  blind_candidates:
    - lemma: "بَارُونِيَّة"
      generation_method: taarib
      justification: "تعريب «barony» بإلحاق ياء النسبة وتاء المصدر الصناعي بالمعرَّب «بارون»، وهو الصيغة المعجمية المعتمدة في المعاجم العربية الحديثة كالمورد"
    - lemma: "رُتْبَةُ البَارُون"
      generation_method: tarkib
      justification: "تركيب إضافي يصف الرتبة مباشرةً؛ لكنه وصف حر وليس مصطلحاً ثابتاً"
    - lemma: "مَقَامُ البَارُون"
      generation_method: tarkib
      justification: "تركيب إضافي بديل يركز على جانب المكانة والمنزلة"
    - lemma: "بَارُونِيتِيَّة"
      generation_method: taarib
      justification: "تعريب «baronetcy» تحديداً، كما ورد في المورد الحديث؛ رتبة مختلفة عن البارونية"

