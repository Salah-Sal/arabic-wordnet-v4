        - text: "«البارونيّة: «أ» رتبة البارون أو أراضيه. «ب» أطيان.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«البارون: القُطْب: رجل عظيم النفوذ في حقلٍ ما. البارونيّة: قطعة من لحم البقر.»"
          source: "المورد الحديث (2008)"
          addition: "للبارونية معنى ثانٍ يدل على قطعة لحم بقر، وهو استعمال مجازي في سياق الطبخ"
    - lemma: "لَقَبُ البَارُون"
      evidence_status: "no_material_found"
    - lemma: "رُتْبَةُ البَارُون"
      evidence_status: "no_material_found"
    - lemma: "مَقَامُ البَارُون"
      evidence_status: "no_material_found"
    - lemma: "بَارُونِيتِيَّة"
      confirm:
        - text: "«البارونيتيّة: رتبة وراثية أو درجة شرف تحت البارون وفوق الفارس. البارونيت: حامل هذه الرتبة.»"
          source: "المورد الحديث (2008)"
    - lemma: "بَارُون"
      confirm:
        - text: "«بارون: عين (لقب نبالة) ويقال: باروني نسبة إليه.»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«بارون: عن الألمانية بمعنى من النبلاء. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

