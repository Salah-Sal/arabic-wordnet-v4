      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أشرف جِيَان لُورِينزُو بِرْنِينِي على تشييد البالداكين النحاسي الشامخ فوق قبر القديس بطرس في الفاتيكان."
