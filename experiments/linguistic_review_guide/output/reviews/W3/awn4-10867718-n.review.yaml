# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-10867718-n  |  ili: i94457  |  pos: n
# الموضوع: جيان لورينزو برنيني — نحّات ومعماري إيطالي باروكي
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل؛ والتشكيل إلزامي لكل لمّة مؤكدة"
      - "الاسم الإيطالي الأصلي Giovanni Lorenzo Bernini (جُوفَانِّي) غائب عن اللمّات رغم وروده في المكافئات الإنجليزية الرسمية"
      - "التعريف العربي الحالي مترجَم ترجمة حرفية من الإنجليزي ولا يتّبع أسلوب المعجم الموسوعي العربي"
      - "المجموعة تمثّل علَمًا شخصيًّا أجنبيًّا؛ وهو نوع يستوجب التحقق من صحة الضبط الصوتي للتعريب"
    observations: >
      هذه المجموعة الترادفية خاصة بعَلَم شخصي (proper noun) لفنان إيطالي بارز من القرن
      السابع عشر، هو جيان لورينزو برنيني (1598–1680) النحّات والمعماري الكبير مؤسس
      الأسلوب الباروكي في إيطاليا. ولمّا كانت الوحدة المعجمية هنا اسمَ عَلَم، فإن
      الوسيلة الوحيدة لتعريبه هي التعريب الصوتي (التأريب)، ولا مجال للاشتقاق أو المجاز
      أو التركيب. الشواهد المعجمية في قاعدة البيانات لا تُسجّل أعلام الأشخاص الأجانب
      بصورة منهجية، مما يجعل غياب المادة متوقَّعًا ولا يُضعف الإدراج. أولوية العمل هنا:
      ضبط التشكيل، وإضافة الشكل الإيطالي الأصلي (Giovanni)، وتحسين التعريف.

  blind_candidates:
    - lemma: "بِرْنِينِي"
      generation_method: taarib
      justification: >
        الشكل المختصر الشائع في المصادر العربية؛ تعريب صوتي للقب الإيطالي Bernini
        يقبل لام التعريف (البِرْنِينِي) والنسبة (البِرْنِينِيّ).
    - lemma: "جِيَان لُورِينزُو بِرْنِينِي"
      generation_method: taarib
      justification: >
        الاسم الكامل الذي اشتُهر به في المصادر العلمية العربية؛ Gian هو الصيغة
        الشائعة المختصرة من Giovanni في اللهجة الإيطالية التوسكانية.
    - lemma: "جُوفَانِّي لُورِينزُو بِرْنِينِي"
      generation_method: taarib
      justification: >
        الاسم المعمداني الأصلي (Giovanni Lorenzo Bernini) كما يرد في السجلات الكنسية
        والمصادر الإيطالية؛ وردت هذه الصيغة في المكافئات الإنجليزية الرسمية
        (lemmas_en: Giovanni Lorenzo Bernini)، لذا يجب أن تُسجَّل في AWN4.
    - lemma: "لُورِينزُو بِرْنِينِي"
      generation_method: taarib
      justification: >
        صيغة تجمع الاسم الأوسط مع اللقب، تُستخدم أحيانًا في المصادر الفنية الأوروبية
        والعربية التي تحذف الاسم الأول؛ إلا أنها أقل شيوعًا من الصيغتين الكاملتين.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  query_log:
    - "استعلام ١: بحث دفعي عن برنيني وجيان لورينزو برنيني وجوفاني لورينزو برنيني ولورينزو برنيني (مع صيغ ال-) → لا نتائج"
    - "استعلام ٢: جسر إنجليزي — translation_en:Bernini OR Gian Lorenzo Bernini OR Giovanni Lorenzo Bernini → لا نتائج"
    - "استعلام ٣: FTS عربي — نحات OR باروكي OR برنيني → نتائج لمصطلحات عامة (نحّات، باروك) لا لعَلَم الشخص"
    - "استعلام ٤: جسر إنجليزي — translator_en:sculptor OR baroque → نتائج لمصطلحات عامة فقط"

  per_lemma:
    - lemma: "بِرْنِينِي"
      evidence_status: "no_material_found"

    - lemma: "جِيَان لُورِينزُو بِرْنِينِي"
      evidence_status: "no_material_found"

    - lemma: "جُوفَانِّي لُورِينزُو بِرْنِينِي"
      evidence_status: "no_material_found"

    - lemma: "لُورِينزُو بِرْنِينِي"
      evidence_status: "no_material_found"

  contextual_evidence:
    - lemma: "نَحَّات / مَثَّال"
      confirm:
        - text: "«نحَّات؛ مَثَّال»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن نحّات هو المقابل المستقر لـ sculptor في المعجم العربي الحديث"
        - text: "«نحات: حجري أو رخامي أو خشبي أو غير ذلك»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "يُوسّع التعريف ليشمل مواد النحت المختلفة، مما يدعم وصف برنيني بالنحّات"
    - lemma: "بَارُوكِيّ"
      confirm:
        - text: >
            «باروكيّ: خاصّ بالأسلوب الباروكيّ أو ذو علاقة به. وهو أسلوب في التعبير
            الفني ازدهر في أوروبا من عام 1600 إلى عام 1750. يتميز بدقة الزخرفة
            وتساوقها، وأحيانًا بغرابتها، وباصطناع الأشكال المنحنية [في فن العمارة]»
          source: "المورد الحديث (2008)"
          addition: >
            يؤكد أن «الباروكي» مصطلح مستقر في المعجم العربي الحديث، وأن الحقبة
            1600–1750 مطابقة تمامًا لحياة برنيني (1598–1680)؛ مما يدعم صياغة
            التعريف الموسوعي بلفظ «العصر الباروكي».


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "برنيني"
      decision: confirmed
      decision_reason: >
        الشكل المختصر الشائع في المصادر العربية المتخصصة والصحافة الثقافية؛ اسم علم
        أجنبي معرَّب صوتيًّا. غياب المادة المعجمية متوقَّع لأعلام الأشخاص الأجانب ولا
        يُشكّل حجة للإزالة. اللمّة تحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      loan_check:
        type: taarib
        verdict: مقبول — الاسم الأعجمي ينطبق عليه التأريب الصوتي كقاعدة أصيلة
      nuance_differentiation: >
        الشكل المختصر (اللقب فقط) — يُستخدم في الإحالات الاعتيادية والسياقات الأدبية
        والفنية المختصرة، وهو الشكل المتداول في الموسوعات العربية القصيرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِرْنِينِي"

    - lemma: "جيان لورينزو برنيني"
      decision: confirmed
      decision_reason: >
        الاسم الكامل الرسمي كما يشيع في المصادر الأكاديمية والموسوعية؛ ضروري لتمييز
        الشخص بدقة عن سواه ممّن قد يشتركون في اللقب. يستلزم تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loan_check:
        type: taarib
        verdict: مقبول — تعريب صوتي لاسم علم إيطالي مركّب
      nuance_differentiation: >
        الاسم الثلاثي الكامل — يُستخدم في السياقات الأكاديمية والتوثيقية وبطاقات
        التعريف الموسوعي حيث يُشترط الإيضاح الكامل للهوية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِيَان لُورِينزُو بِرْنِينِي"

    # ── مرشحات المرحلة ١ ──
    - lemma: "جُوفَانِّي لُورِينزُو بِرْنِينِي"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم المعمداني الأصلي (Giovanni Lorenzo Bernini) الوارد في قائمة المكافئات
        الإنجليزية الرسمية لـ OEWN (lemmas_en: Giovanni Lorenzo Bernini)؛ من المتطلبات
        المنهجية لـ AWN4 استيعاب جميع الصور الرسمية للعَلَم الواردة في OEWN. الشكل
        مستعمَل في المصادر العربية الموسوعية المتخصصة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loan_check:
        type: taarib
        verdict: مقبول — Giovanni هي الصيغة الإيطالية الكاملة لـ Gian
      nuance_differentiation: >
        الصيغة الإيطالية الأصلية الكاملة بالاسم المعمداني (جوفاني)؛ تُفضَّل في السياقات
        الأكاديمية التاريخية والمصادر الإيطالية المترجمة، وتميّز عن الصيغة الشائعة
        المختصرة (جيان).
      actions:
        - command: create_entry
          params:
            lemma: "جُوفَانِّي لُورِينزُو بِرْنِينِي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10867718-n"

    - lemma: "لُورِينزُو بِرْنِينِي"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة جزئية غير مستقرة معجميًّا؛ لا توجد في قائمة المكافئات الإنجليزية الرسمية
        (OEWN)، ولا تُستخدم اصطلاحًا مستقلاً في المصادر الموثوقة. حذفها لا يُخلّ
        بتغطية المجموعة إذ تُمثّلها الصيغتان الكاملتان (جيان لورينزو + جوفاني لورينزو).


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "نحات ومعماري إيطالي من العصر الباروكي؛ صمم العديد من الكنائس والمصليات والمقابر والنوافير (1598-1680)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مترجَم ترجمةً شبه حرفية من الإنجليزية؛ ويفتقر إلى أسلوب المعجم
        الموسوعي العربي الذي يُقدّم العَلَم بصورة تفصيلية مرتّبة. كما أن صياغة
        «صمّم العديد من» ركيكة في العربية الفصيحة، والأدق «أبدع طائفةً من» أو «أشرف
        على تصميم».
    authored:
      - type: encyclopedic
        text: >
          جِيَان لُورِينزُو بِرْنِينِي (1598–1680): نحَّاتٌ إيطاليٌّ ومعماريٌّ، يُعدّ
          من أبرز روّاد الأسلوب الباروكي وأعظم مبدعيه في إيطاليا؛ أبدع طائفةً من
          الكنائس والمصليّات والمقابر والنوافير التي لا تزال تُزيّن روما حتى اليوم.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10867718-n"
          definition_index: 0
          text: >
            جِيَان لُورِينزُو بِرْنِينِي (1598–1680): نحَّاتٌ إيطاليٌّ ومعماريٌّ، يُعدّ
            من أبرز روّاد الأسلوب الباروكي وأعظم مبدعيه في إيطاليا؛ أبدع طائفةً من
            الكنائس والمصليّات والمقابر والنوافير التي لا تزال تُزيّن روما حتى اليوم.

  examples:
    per_lemma:
