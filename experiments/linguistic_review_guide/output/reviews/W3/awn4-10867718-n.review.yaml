            type: usage
      - lemma: "جُوفَانِّي لُورِينزُو بِرْنِينِي"
        examples:
          - text: "درس المؤرخون الإيطاليون وثائق مقتنيات جُوفَانِّي لُورِينزُو بِرْنِينِي للكشف عن أسرار منهجه النحتي."
