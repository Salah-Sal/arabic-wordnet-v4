      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"وسم","maqayis":"«الواو والسين والميم: أصل واحد يدل على أثر ومعلم. ووسمت الشيء وسماً: أثرت فيه بسمة...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُفيد التخصيص الرسمي بوسام ملموس تُقلِّده جهة مانحة معترفة به تقديراً للتفوق، بخلاف فائز الدال على مجرد الغلبة","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"lexical_gap"}'
    - command: set_confidence
      params:
