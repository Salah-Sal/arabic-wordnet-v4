# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# synset: awn4-10324729-n  |  ili: i91287  |  pos: n
# المفهوم: شخص فاز بميدالية — medalist / medallist
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «حائز على ميدالية» عبارة وصفية حرة تفشل اختبار السكّ؛ يصحّ إبدال «حائز» بـ«فائز» أو «نائل» ويظل الوصف صحيحاً، فليست مصطلحاً مسكوكاً."
      - "اللمّة خالية من التشكيل الكامل."
      - "توظّف المعرَّب «ميدالية» في حين يتوفر المقابل العربي الأصيل «وسام» في المعاجم العربية الرسمية."
      - "المجموعة تفتقر إلى مصطلح مفرد أو مركب اصطلاحي ثابت، وكل ما فيها عبارة وصفية مطولة."
    observations: >
      المفهوم يدور حول شخص ظفر بوسام أو ميدالية في مسابقة. والجذر «وسم» راسخ في
      المعجمية العربية الكلاسيكية بمعنى الأثر والعلامة، واشتُقّ منه «الوِسام» الذي
      أصبح المقابلَ الرسمي للـ medal في المعاجم العربية الحديثة. اللمّة الحالية وصفية
      مطوَّلة لا ترقى إلى مستوى المصطلح المعجمي، ومن المرجَّح وجود مصطلح مشتق من
      جذر «وسم» أجدر باحتلال هذا الموضع. يُلاحظ كذلك أن الاشتقاق من «حاز» على وزن
      فاعِل يُعطي «حائز» غير أن الفعل «حاز» لا يُلازم الوسامَ دلالياً كما يلازمه
      «وُسِّم».

  blind_candidates:
    - lemma: "مُوَسَّمٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق اسم مفعول على وزن مُفَعَّل من الجذر «وسم» بمعنى «من نِيلَ له الوسامُ
        وعُلِّق على صدره». الجذر يدلّ على الأثر والعلامة الظاهرة، و«الوسام» مشتق
        منه مباشرة. يُميَّز المُوَسَّمُ عن المَوْسِم (الوقت/الموسم) بالتشكيل وبالسياق.
    - lemma: "حَامِلُ الوِسَامِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «حامل» (اسم فاعل من حَمَلَ) و«الوسام» (الميدالية في الاصطلاح
        العربي). يصف من يحمل وساماً حازه في منافسة. تقييده بـ«الوسام» يُعطيه خصوصية
        دلالية نسبية.
    - lemma: "مُتَوَّجٌ"
      generation_method: majaz
      justification: >
        استعارة التتويج الدالة على الغلبة والإنجاز؛ التتويج بالميدالية استعارة مستعملة في
        الكتابة الرياضية العربية. اسم مفعول على وزن مُفَعَّل من الفعل «توَّجَ».
    - lemma: "مِيدَالِيٌّ"
      generation_method: taarib
      justification: >
        تعريب بالنسبة من «ميدالية» (مُعرَّبة أصلاً من الفرنسية médaille) بإضافة ياء
        النسبة. ملاذ أخير؛ يُستعمل في بعض السياقات الإعلامية العربية. يقبل لام
        التعريف والجمع السالم (الميداليون).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1: مطابقة دفعية — حايز على ميدالية + موسم + الموسم + متوج + المتوج
#       + ميدالي + الميدالي + حامل الوسام + وسام + الوسام + ميدالية + الميدالية
#   Q2: جسر إنجليزي — medalist | medallist | medal winner | medal
#   Q3: كلمات مفتاحية — ميدالية | وسام | فاز | فائز
#   Q4: مقاييس اللغة — جذر وسم + فوز (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "حائز على ميدالية"
      evidence_status: "no_material_found"

    - lemma: "مُوَسَّمٌ"
      confirm:
        - text: >-
            «(1) الوَسّام: مصمّم الأوسمة أو ناقشُها أو صانعُها
            (2) المُوَسَّم: الحامل وسامًا ما.»
          source: "المورد الحديث (2008) — ترجمة: medalist"
      expands:
        - text: >-
            «(الوِسَامُ) السِّمَة ما يعلَّق على صدر من أحسن عملا مكافأةً له عليه»
          source: "المعجم الوسيط"
          addition: >
            يُثبت أن «الوسام» هو الميدالية/الوشاح الممنوح جزاءَ الإجادة، مما يُرسّخ
            دلالة المُوَسَّم بوصفه صاحب هذا الوسام.
        - text: >-
            «الواو والسين والميم: أصل واحد يدل على أثر ومعلم. ووسمت الشيء وسماً: أثرت
            فيه بسمة. وفلان موسوم بالخير... والوسامة: الجمال.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يُثبت عمق الجذر «وسم» في الدلالة على العلامة الظاهرة الدالة على التميز،
            ومنه اشتُق الوسام ثم المُوَسَّم.

    - lemma: "حَامِلُ الوِسَامِ"
      evidence_status: "no_material_found"

    - lemma: "مُتَوَّجٌ"
      contradicts:
        - text: >-
            «المَتْوَجُ: مَوْضع التَّوُّج بالعِمَامَةِ»
          source: "المعجم الكبير"
          conflict: >
            الاسم المُوثَّق في المعجم لصيغة مَفْعَل هو اسم مكان (موضع التتويج)
            لا اسم فاعل/مفعول بمعنى شخص تُوِّج بميدالية. لا شاهد معجمي على
            استعمال مُتَوَّج لصاحب الميدالية.

    - lemma: "مِيدَالِيٌّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "حائز على ميدالية"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا مصطلح مسكوك: يصح إبدال «حائز» بـ«فائز» أو «نائل»
        ويبقى الوصف دقيقاً، مما يُثبت فشلها في اختبار السكّ. علاوة على ذلك: (١) لا
        توثيق معجمي لها. (٢) تستخدم المعرَّب «ميدالية» دون حاجة مع وجود «وسام»
        العربي. (٣) لا تشكيل. (٤) الجملة الوصفية تناسب التعريف لا اللمّة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُوَسَّمٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق مباشرة في المورد الحديث (2008) بوصفه الترجمة العربية الرسمية لـ
        medalist، مع تعريف صريح: «الحامل وسامًا ما». الاشتقاق على وزن مُفَعَّل من
        جذر «وسم» صحيح وقياسي. الجذر راسخ في مقاييس اللغة بدلالة الأثر والعلامة.
        يجتاز جميع بوابات جودة المصطلح: اطراد، يُسر، ملاءمة، إيثار العربي على
        المعرَّب، اشتقاقية. الوزن الصرفي مُفَعَّل (اسم المفعول) يناسب الدلالة:
        شخص وُسِّم أي مُنح الوسام بفعل جهة مانحة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُفيد التخصيص الرسمي بوسام من جهة مانحة معترف بها، بخلاف «فائز» الدال
        على مجرد الغلبة، و«منتصر» الدال على التغلب في الصراع. المُوَسَّم متلقٍّ
        لعلامة تشريفية ملموسة (الميدالية/الوسام) تُعلَّق على صدره.
      actions:
        - command: create_entry
          params:
            lemma: "مُوَسَّمٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حَامِلُ الوِسَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        مركب وصفي لا يجتاز اختبار التثبيت المعجمي: لا توثيق له في أي معجم بوصفه
        وحدة معجمية ثابتة. يفشل اختبار السكّ أيضاً: يمكن إبدال «حامل» بـ«نائل» أو
        «فائز» ويظل الوصف دقيقاً. مُوَسَّمٌ يغني عنه بصياغة أدق وأخصر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُتَوَّجٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي على استخدامه بمعنى صاحب الميدالية. الأثر المعجمي الوحيد
        للصيغة هو اسم المكان (مَتْوَج = موضع التتويج بالعمامة) لا اسم المفعول.
        فضلاً عن ذلك، «مُتَوَّج» عام يشمل كل تتويج (بالبطولة، باللقب، بالتاج)
        وليس خاصاً بالوسام/الميدالية، مما يُخلّ بالملاءمة الدلالية. مُوَسَّمٌ
        أدق وأوثق.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مِيدَالِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب لا ضرورة له مع وجود مُوَسَّمٌ المشتق من جذر عربي أصيل وموثَّق
        في المعاجم. مبدأ إيثار العربي على المعرَّب يقضي بإسقاطه. لا توثيق معجمي
        مستقل له بهذه الصيغة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "شخص فاز بميدالية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي قصير وغير محكم: يُسند الفوز بالميدالية دون ذكر السياق
        (المسابقة)، ويستخدم «ميدالية» المعرَّبة. ويفتقر إلى الجنس القريب والفصل
        النوعي الواضحين وفق أسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: "شَخْصٌ نَالَ وِسَامًا أو جائزةً مَعْدِنِيَّةً جزاءَ تَفَوُّقِهِ فِي مُسَابَقَةٍ أَو مَيدانٍ مِنْ مَيَادِينِ النَّشَاطِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَنِ احْتَازَ وِسَامًا تكريماً له على إجادتِه وتَفَوُّقِهِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ نَالَ وِسَامًا أو جائزةً مَعْدِنِيَّةً جزاءَ تَفَوُّقِهِ فِي مُسَابَقَةٍ أَو مَيدانٍ مِنْ مَيَادِينِ النَّشَاطِ"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "مَنِ احْتَازَ وِسَامًا تكريماً له على إجادتِه وتَفَوُّقِهِ"

  examples:
    per_lemma:
      - lemma: "مُوَسَّمٌ"
        examples:
          - text: "اعتلى المُوَسَّمُ مِنصَّةَ التَّتويجِ وسطَ تصفيقٍ حارٍّ بعد أن أحرزَ ثلاثَ وِسَاماتٍ ذهبيَّةٍ في دورةِ الألعابِ الأولمبيَّة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اعتلى المُوَسَّمُ مِنصَّةَ التَّتويجِ وسطَ تصفيقٍ حارٍّ بعد أن أحرزَ ثلاثَ وِسَاماتٍ ذهبيَّةٍ في دورةِ الألعابِ الأولمبيَّة."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
stage5_enrichment:
  per_entry:
    - lemma: "مُوَسَّمٌ"
      entry_id: "{auto}"
      root: "وسم"
      maqayis_quote: >-
        «الواو والسين والميم: أصل واحد يدل على أثر ومعلم. ووسمت الشيء وسماً: أثرت
        فيه بسمة. وفلان موسوم بالخير... والوسامة: الجمال.»

  per_sense:
    - lemma: "مُوَسَّمٌ"
      sense_id: "{auto}"
      nuance: >
        يُفيد التخصيص الرسمي بوسام ملموس تُقلِّده جهةٌ مانحةٌ معترفٌ بها تقديراً
        للتفوق، بخلاف «فائز» الدال على مجرد الغلبة دون إشارة إلى نوع الجائزة،
        و«منتصر» الدال على التغلب في الصراع. المُوَسَّمُ متلقٍّ لعلامة تشريفية ظاهرة.
      mwe: false

  synset:
    cultural_fit: lexical_gap

  actions:
