# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "الاسمان العلَمان يفتقران إلى التشكيل الكامل في قاعدة البيانات"
      - "التعريف يُوهم بأن الأعوام (1860-1929) تعود إلى كارير، وهي في الواقع أعوام هاستنغز نفسه — يستحسن التصريح بذلك"
      - "وصف 'مهمة' في التعريف (شركة معمارية مهمة) غير كافٍ للتعريف الموسوعي بعلم شخصي من هذا الوزن"
      - "المجموعة مصنّفة POS: n لكن المداخل أعلام أشخاص — يُفضَّل proper_noun على مستوى المدخل"
    observations: >
      المجموعة علَمٌ على شخص بعينه، هو المهندس المعماري الأمريكي توماس هاستنغز
      (1860-1929)، أحد مؤسِّسي مكتب «كارير وهاستنغز» الشهير الذي تولَّى تصميم
      مكتبة نيويورك العامة ومبانٍ بارزة أخرى. الأعلام الأجنبية لا تخضع لمعايير
      الاشتقاق والمجاز العربيين، بل تُدرج بالتعريب (النقل الصوتي) وحده. اللمّتان
      الموجودتان («توماس هاستينغز» و«هاستينغز») صحيحتان من حيث الاختيار، لكنهما
      تحتاجان تشكيلاً كاملاً. التعريف العربي يحتاج إعادة صياغة توسيعية تُبيّن أعوامه
      وتصفه بوضوح.

  # ── التوليد الأعمى (قبل الاطلاع على اللمّات) ─────────────
  # المصدر: synset_info_masked.yaml — التعريف فقط:
  # «معماري أمريكي أسس شركة معمارية مهمة مع جون ميرفين كارير (1860-1929)»
  # بما أن المفهوم علم شخصي أجنبي، جميع المرشحات تعريبات بتنويع في الضبط الصوتي.
  blind_candidates:
    - lemma: "تُومَاس هَاسْتِينْغز"
      generation_method: taarib
      justification: >
        النقل الصوتي المعياري للاسم الكامل «Thomas Hastings» وفق القواعد الصوتية
        العربية الشائعة في الموسوعات والمراجع الأكاديمية العربية؛ الغين لنطق /ɡ/
        الإنجليزية هو الخيار الراسخ في المعاجم الحديثة.
    - lemma: "هَاسْتِينْغز"
      generation_method: taarib
      justification: >
        اللقب العائلي وحده «Hastings» كما يُورد في المراجع المتخصصة عادةً بعد إيراد
        الاسم الكامل في أول ذكر؛ ضرورة معجمية لتيسير الإحالة المختصرة.
    - lemma: "تُومَاس هَاسْتِنْجز"
      generation_method: taarib
      justification: >
        بديل تعريبي باستخدام الجيم بدل الغين لنطق /ɡ/ وفق التقليد المصري؛ قد يُعرَض
        كصيغة بديلة وإن كانت أقل شيوعاً في المراجع العلمية الحديثة.
    - lemma: "تُومَاس هَيسْتِنْغز"
      generation_method: taarib
      justification: >
        بديل تعريبي يحاكي الثنائية الصوتية /eɪ/ في النطق الأصلي «Hey-stings»؛
        يُمثّل توجهاً صوتياً أدق لكنه مخالف للتعريب المستقر في أغلب المعاجم العربية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  # ملاحظة منهجية: الاستعلامات المنفَّذة (3 استعلامات):
  #  ١. مطابقة دقيقة دفعية: جميع اللمّات والمرشحات في استعلام واحد → مدخل واحد (توماس)
  #  ٢. جسر إنجليزي: "Hastings" OR "Thomas Hastings" OR "Carrere" → لا نتائج
  #  ٣. بحث FTS بكلمات مفتاحية معمارية → مصطلحات معمارية عامة، لا علاقة بالعلَم
  per_lemma:
    - lemma: "توماس هاستينغز"
      evidence_status: "no_material_found"

    - lemma: "هاستينغز"
      evidence_status: "no_material_found"

    - lemma: "تُومَاس هَاسْتِينْغز"
      evidence_status: "no_material_found"

    - lemma: "هَاسْتِينْغز"
      evidence_status: "no_material_found"

    - lemma: "تُومَاس هَاسْتِنْجز"
      evidence_status: "no_material_found"

    - lemma: "تُومَاس هَيسْتِنْغز"
      evidence_status: "no_material_found"

  # ملاحظة: مدخل «تُومَاس» (entry_id: 918884، موسوعة السلطان قابوس لأسماء العرب)
  # يُعرِّف الاسم بأصله الآرامي/العبري (= توأم) — لا صلة له بالمهندس هاستنغز،
  # لذا لم يُدرج في أدلة أيٍّ من اللمّات.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ────────────────────────────────────

    - lemma: "توماس هاستينغز"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخص المعني، وهو التعريب المعياري المستقر في الموسوعات العربية
        والمراجع الأكاديمية. اختبار السكّ: التعبير علَم ثابت غير قابل للإبدال.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل — يُستخدم في أول إيراد وفي السياقات الموسوعية والأكاديمية
        الرسمية التي تستوجب التعريف التام بالشخص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تُومَاس هَاسْتِينْغز"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    - lemma: "هاستينغز"
      decision: confirmed
      decision_reason: >
        اللقب العائلي المختصر، وهو الصيغة المتداولة في الإحالات المتخصصة والنصوص
        التي سبق فيها ذكر الاسم الكامل. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم العائلي وحده — يُستخدم في الإحالات المختصرة بعد تقديم الاسم الكامل،
        أو في السياقات التقنية المعمارية التي يُفهم فيها المقصود من السياق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَاسْتِينْغز"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشحات المرحلة ١ ────────────────────────────────────

    - lemma: "تُومَاس هَاسْتِينْغز"
      source: stage1
      decision: removed
      decision_reason: >
        يُطابق اللمّة الموجودة «توماس هاستينغز» بعد إضافة التشكيل؛ ستُعالج عبر
        update_lemma على المدخل القائم ولا حاجة لمدخل جديد.

    - lemma: "هَاسْتِينْغز"
      source: stage1
      decision: removed
      decision_reason: >
        يُطابق اللمّة الموجودة «هاستينغز» بعد إضافة التشكيل؛ ستُعالج عبر
        update_lemma على المدخل القائم.

    - lemma: "تُومَاس هَاسْتِنْجز"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب غير معياري باستخدام الجيم بدل الغين لنطق /ɡ/؛ التعريب المستقر في
        المراجع العربية هو «غ»، وإدراج هذا البديل سيُنشئ تشويشاً دون إضافة قيمة.

    - lemma: "تُومَاس هَيسْتِنْغز"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب غير معياري يحاكي النطق الدقيق /eɪ/ لكنه مخالف للتعريب المستقر
        «هاستينغز»؛ إدراجه سيُخالف الإجماع المعجمي العربي الحديث.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "معماري أمريكي أسس شركة معمارية مهمة مع جون ميرفين كارير (1860-1929)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقتضب ولا يُصرِّح بأن الأعوام (1860-1929) هي أعوام هاستنغز
        نفسه لا كارير، مما قد يُلبِس القارئ. كذلك وصف «مهمة» وحده غير كافٍ لعلَم
        من هذا المستوى؛ يستحسن توسيعه موسوعياً بذكر مكانة المكتب وبعض إنجازاته.
    authored:
      - type: encyclopedic
        text: >
          مهندسٌ معماري أمريكي (1860-1929)، أسَّس مع شريكه جون ميرفين كارير
          مكتبَ «كارير وهاستنغز» الذي اضطلع بتصميم عدد من أبرز المعالم المعمارية
          الأمريكية في مطلع القرن العشرين، ومن أشهرها مكتبةُ نيويورك العامة.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11054303-n"
          definition_index: 0
          text: "مهندسٌ معماري أمريكي (1860-1929)، أسَّس مع شريكه جون ميرفين كارير مكتبَ «كارير وهاستنغز» الذي اضطلع بتصميم عدد من أبرز المعالم المعمارية الأمريكية في مطلع القرن العشرين، ومن أشهرها مكتبةُ نيويورك العامة."

  examples:
    per_lemma:
      - lemma: "تُومَاس هَاسْتِينْغز"
        examples:
          - text: "يُعدُّ تُومَاس هَاسْتِينْغز من رواد العمارة الكلاسيكية الأمريكية في نهاية القرن التاسع عشر."
            type: usage
      - lemma: "هَاسْتِينْغز"
        examples:
          - text: "صمَّم هَاسْتِينْغز وكارير مبنى مكتبة نيويورك العامة الذي افتُتح عام 1911م."
            type: usage
    actions:
