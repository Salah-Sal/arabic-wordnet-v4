stage1_review:
  assessment:
    concerns: []
    observations: "المجموعة الترادفية تمثل اسم علم مهني للمعماري الأمريكي ريتشارد موريس هانت. تم استعمال النقحرة لنقل الاسم الأجنبي إلى العربية، وهي الطريقة المعيارية للتعامل مع أسماء الأعلام الغربية."
  blind_candidates:
    - lemma: "رِيتْشَارْد مُورِيس هَانْت"
      generation_method: taarib
      justification: "النقحرة الكاملة للاسم الإنجليزي (Richard Morris Hunt)."
    - lemma: "هَانْت"
      generation_method: taarib
      justification: "النقحرة للاسم الأخير أو اللقب (Hunt)."
    - lemma: "ر. م. هَانْت"
      generation_method: taarib
      justification: "النقحرة مع اختصار الأسماء الأولى، وهو أسلوب متبع في بعض الكتابات."
    - lemma: "رِيتْشَارْد هَانْت"
      generation_method: taarib
      justification: "نقحرة للاسم الأول واسم العائلة."

