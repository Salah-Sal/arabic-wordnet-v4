# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة مُسجّل تفتقر إلى تشكيل كامل يميّز اسم الفاعل (مُسَجِّل) من اسم المفعول (مُسَجَّل) أو من صيغ أخرى مشتركة في الرسم، وهو تمييز حاسم في المعنى."
      - "المجموعة تحتوي على لمّة واحدة فقط، في حين أن مرادف هَدَّاف موثَّق في المعجم الوسيط ومستعمل على نطاق واسع في الخطاب الرياضي العربي."
    observations: >
      المفهوم رياضي خالص: «اللاعب الذي يُحرِز نقاطاً أو يُسجّل أهدافاً في لعبة أو مسابقة».
      من التعريف تبرز ثلاثة محاور اشتقاقية: (أ) السِّجِلّ والكتابة والإثبات → مُسَجِّل،
      (ب) الهدف والتسديد → هَدَّاف، (ج) الإحراز والحيازة → مُحرِز.
      غير أن مُحرِز في التراث العربي يحمل دلالة قانونية مالية بحتة، كما أن صَائِب
      وصفٌ لا اسم ذات. المجموعة بحاجة إلى تصحيح التشكيل وإثراء بمرادف موثَّق.

  blind_candidates:
    - lemma: "مُسَجِّل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من (سجَّل) على وزن مُفَعِّل، يدل على من يُثبِّت الوقائع ويُقيِّدها.
        توظيفه للاعب الذي يُقيِّد النقاط في سجل اللعبة توظيفٌ مباشر ودقيق؛
        المطابقة بين الوزن الصرفي (مُفَعِّل = الفاعل المُتكرِّر) والوظيفة الرياضية واضحة.
    - lemma: "هَدَّاف"
      generation_method: ishtiqaq
      justification: >
        على وزن فَعَّال من (هدف)، يدل على كثرة التسديد نحو الهدف وإجادته.
        الوزن فَعَّال يحمل معنى التكثير والاحتراف، وهو ملائم لمن يتميّز بتسجيل الأهداف
        في الألعاب الجماعية كالقدم وكرة اليد. الاشتقاق من جذر هـ-د-ف الدال أصلاً
        على الارتفاع والانتصاب ثم على الغرض الذي يُرمى إليه.
    - lemma: "مُحرِز"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من (أحرز) على وزن مُفعِل، بمعنى من يجمع ويحوز. يُوظَّف في
        السياق الرياضي في عبارة «أحرز هدفاً/نقاطاً»، ومن ثَمَّ فالمُحرِز هو
        الذي يضمّ النقاط إلى رصيده. الجذر ح-ر-ز يدل أصلاً على الحفظ والتحفظ.
    - lemma: "صَائِب"
      generation_method: majaz
      justification: >
        إحياء دلالي لاسم الفاعل من (صاب يَصوب) بمعنى من أصاب الهدف ولم يُخطئ.
        الإزاحة الدلالية: من «الشيء النازل المستقر قراره» (أصل المقاييس) إلى «اللاعب
        الذي يصيب الهدف بدقة». غير أن الاستعمال أدبيّ لا اصطلاحي في السياق الرياضي.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُسجّل"
      confirm:
        - text: "«اللاعب المُسَجِّل: لاعب يُوَفَّق إلى إصابة الهدف.»"
          source: "المورد الحديث (2008)، entry_id: 715177"
        - text: "«مُسَجِّل: من (س ج ل) الكاتب، والحافظ من الضياع.»"
          source: "موسوعة السلطان قابوس لأسماء العرب، entry_id: 944322"
      contradicts:
        - text: "«مُسجِّل» بترجمة recorder / register في مجالات الهندسة الكهربائية والمياه والطب."
          source: "ARABTERM — مسرد الهندسة الكهربائية (entry_id: 377876-378700)، المعجم الطبي الموحد (entry_id: 638674)، المعجم الموحد لمصطلحات المياه (entry_id: 388309)"
          conflict: "الاستخدام التقني للفظة (جهاز تسجيل / ذاكرة حاسوبية) مباين تماماً للاستخدام الرياضي؛ الإحالة لمجال مختلف."
      expands:
        - text: "«المسجل: يُقال فعلنا ذلك والدهر مسجل لا يخاف أحد أحدًا.»"
          source: "المعجم الوسيط لمجموعة من المؤلفين، entry_id: 883073"
          addition: "يكشف أن مُسْجَل (بفتح الجيم) تعني في التراث «المباح لكل أحد»، مما يؤكد ضرورة تمييز الشكل الصرفي (مُسَجِّل بكسر الجيم) لتفادي اللبس."
        - text: "«المُسَجَّل: اكتسب صفة الرسمية بإثباته في دفتر خاص (محدثة).»"
          source: "المعجم الوسيط (Al_Waseet)، entry_id: 13054"
          addition: "يؤكد أن مُسَجَّل (اسم مفعول) يعني المُثبَّت رسمياً، بينما المراد في المجموعة هو مُسَجِّل (اسم فاعل). التمييز في التشكيل حاسم."

    - lemma: "هَدَّاف"
      source: stage1
      confirm:
        - text: "«الْهَدَّافُ: من يحسن تسديد الكرة إلى المرمَى. (محدثة)»"
          source: "المعجم الوسيط (Al_Waseet)، entry_id: 31195"
        - text: "«الهداف: من يحسن تسديد الكرة إِلَى المرمى (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين، entry_id: 886600"
      expands:
        - text: "«هَدَفَ: الْهَاءُ وَالدَّالُ وَالْفَاءُ أُصَيْلٌ يَدُلُّ عَلَى انْتِصَابٍ وَارْتِفَاعٍ. وَالْهَدَفُ: كُلُّ شَيْءٍ عَظِيمٍ مُرْتَفِعٍ ... وَالْهَدَفُ: الْغَرَضُ.»"
          source: "مقاييس اللغة لابن فارس (dictionary_id: 151)"
          addition: "الجذر يدل على الغرض المنتصب الذي يُرمى إليه، ومن ثَمَّ الهَدَّاف هو المُتفوِّق في بلوغ الغرض، والوزن فَعَّال يفيد الكثرة والاحتراف."

    - lemma: "مُحرِز"
      source: stage1
      contradicts:
        - text: "«مُحْرِز: مالك الشيء وحائزه، ومدخر المال.»"
          source: "موسوعة السلطان قابوس لأسماء العرب، entry_id: 943203"
          conflict: "الدلالة الموثَّقة مالية قانونية (حيازة الأموال وصونها) لا رياضية."
        - text: "«المحرز: مال ممنوع أن تصل إليه يد الغير سواء كان المانع بيتاً أو حافظاً.»"
          source: "كتاب التعريفات للشريف الجرجاني، entry_id: 795541"
          conflict: "التعريف الاصطلاحي الفقهي للمحرز يخص حماية المال لا التسجيل الرياضي."
        - text: "«حَرَزَ: الْحَاءُ وَالرَّاءُ وَالزَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ مِنَ الْحِفْظِ وَالتَّحَفُّظِ. يُقَالُ حَرَزْتُهُ وَاحْتَرَزَ هُوَ، أَيْ تَحَفَّظَ.»"
          source: "مقاييس اللغة لابن فارس (dictionary_id: 151)"
          conflict: "الأصل اللغوي دال على الحفظ والتحفظ والصون، لا على الإحراز الرياضي؛ توظيف «أحرز هدفاً» في العربية المعاصرة توظيف مجازي طارئ لم يُكسِب المشتقَّ (مُحرِز) دلالةً رياضية مستقلة."

    - lemma: "صَائِب"
      source: stage1
      contradicts:
        - text: "«صَائِب: من (ص و ب) كل ما أصاب الهدف ولم يخطئ والنازل من علو إلى سفل والقاصد والمريد.»"
          source: "موسوعة السلطان قابوس لأسماء العرب، entry_id: 931724"
          conflict: "صَائِب صفة مشبهة أو اسم فاعل يُطلق على الفعل أو الشيء المُصيب للهدف، لا على شخص بعينه في الاصطلاح الرياضي."
        - text: "«صَوَبَ: الصَّادُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نُزُولِ شَيْءٍ وَاسْتِقْرَارِهِ قَرَارَهُ. مِنْ ذَلِكَ الصَّوَابُ فِي الْقَوْلِ وَالْفِعْلِ.»"
          source: "مقاييس اللغة لابن فارس (dictionary_id: 151)"
          conflict: "الأصل يدل على النزول والاستقرار والصواب في القول والفعل، وليس على الفاعل الرياضي."


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُسجّل"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة اشتقاقاً؛ مُسَجِّل اسم فاعل من (سجَّل) على وزن مُفَعِّل،
        وهو الأنسب للدلالة على الفاعل المُحرِز. المورد الحديث (2008) وثَّقه صريحاً
        بقوله «اللاعب المُسَجِّل: لاعب يُوَفَّق إلى إصابة الهدف». غير أن التشكيل
        الموجود في AWN ناقص، مما يُوقع في اللبس مع مُسَجَّل (اسم المفعول). يلزم
        التصحيح إلى مُسَجِّل بكسر الجيم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُسَجِّل مصطلح عام يشمل كل من يُحرِز نقاطاً أو أهدافاً في أي نوع من
        الألعاب والمسابقات (ألعاب الورق، كرة السلة، السباحة، وغيرها)؛ يُركِّز
        على فعل التسجيل والإثبات في سجل النتيجة.
      morphological_check:
        weight: "مُفَعِّل"
        function_fit: true
        note: "الوزن مُفَعِّل (اسم فاعل من المضاعف الثلاثي المزيد بالتضعيف) صحيح لإفادة الفاعل المتكرر للفعل."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسَجِّل"

    - lemma: "هَدَّاف"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في المعجم الوسيط (طبعتَي مجمع اللغة العربية) بالتعريف «من يحسن
        تسديد الكرة إلى المرمى»، وهو مستعمل استعمالاً واسعاً في الصحافة الرياضية
        العربية. الوزن فَعَّال يفيد الكثرة والاحتراف، ويُضيف إلى المجموعة الترادفية
        لمّةً ذات دلالة أكثر تخصصاً ودلالة على التميز في الإحراز.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        هَدَّاف أخص من مُسَجِّل: يُستخدم في الألعاب القائمة على تسديد الكرة نحو
        مرمى، كالقدم وكرة اليد وكرة القدم الأمريكية. الوزن فَعَّال يحمل معنى
        الإتقان والكثرة؛ الهَدَّاف إذاً ليس من سجَّل هدفاً واحداً فحسب، بل من
        يُجيد الإحراز بصفة متكررة.
      morphological_check:
        weight: "فَعَّال"
        function_fit: true
        note: "وزن فَعَّال من هدف يفيد كثرة الفعل وإتقانه، ملائم تماماً لمفهوم scorer المتميز."
      actions:
        - command: create_entry
          params:
            lemma: "هَدَّاف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10581819-n"

    - lemma: "مُحرِز"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المعجمية الموثَّقة للمُحرِز في جميع المصادر الكلاسيكية والتعريفية
        مالية قانونية صرفة: «مالك الشيء وحائزه، ومدخر المال»، «مال ممنوع أن
        تصل إليه يد الغير». لا توجد شواهد موثَّقة على استخدام مُحرِز (اسم فاعل
        مستقل) مصطلحاً رياضياً في المعاجم العربية. التعبير «أحرز هدفاً» تعبير
        فعلي سياقي لا يُفرز مصطلحاً مسكوكاً.

    - lemma: "صَائِب"
      source: stage1
      decision: removed
      decision_reason: >
        صَائِب صفة مشبهة يصف الشيء أو الفعل المُصيب للهدف، لا اسم ذات يدل على
        الشخص المُحرِز. لم يُوثَّق استخدامه اصطلاحاً رياضياً في أي من المصادر.
        كذلك يُغلِّب عليه الاستخدامُ الصفتي (رأي صائب، حكم صائب) دلالةَ الإصابة
        الفكرية لا الإصابة الجسدية للمرمى.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
