        التعريف الحالي صحيح لكنه يقتصر على «نقاط»، في حين أن هَدَّاف (المرادف
        المُضاف) يرتبط بالأهداف لا النقاط. كما أن أسلوب الجملة الفعلية المباشرة
        يستحسَن توسيعه بصورة أكثر دقةً معجمية. ويُفضَّل تنقية الجملة لتشمل كلا
        صورتَي الإحراز (النقاط والأهداف).
    authored:
      - type: terminological
        text: "لاعبٌ يُحرِز نقاطاً أو يُدخِل أهدافاً لصالحه أو لصالح فريقه في مباراة أو مسابقة."
        quality_check:
