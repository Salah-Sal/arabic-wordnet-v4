stage1_review:
  assessment:
    concerns:
      - "«غيمة شك» تعبير مترجم حرفياً عن الإنجليزية (cloud of suspicion)، وليس تعبيراً عربياً مسكوكاً"
      - "التعريف العربي «شك يؤثر على سمعتك» ترجمة حرفية رديئة تستعمل ضمير المخاطب"
      - "لمّتان فقط في المجموعة: إحداهما مركبة مترجمة والأخرى مفردة عامة"
    observations: >-
      المفهوم المقصود هو الشبهة أو الظِّنّة التي تمسّ السمعة وتلحق بصاحبها عاراً.
      الهايبرنيم «اشتباه/شك» يدلّ على مطلق الشك، وهذه المجموعة تخصّصه بما يؤثر في السمعة.
      في العربية ألفاظ كثيرة تؤدّي هذا المعنى: وصمة، شائبة، مثلبة، ريبة.
      «غيمة شك» ترجمة حرفية للمجاز الإنجليزي cloud ولا تُستعمل في الفصحى.
  blind_candidates:
    - lemma: "شَائِبَة"
      generation_method: majaz
      justification: >-
        من جذر شوب (الخلط)، والشائبة في الاستعمال المعجمي: الشبهة التي تشوب السمعة.
        يقال «ما فيه شائبة» أي ليس فيه شبهة، و«بريء من الشوائب» أي ليس فيه ما يعيبه.
        فالشائبة تجمع بين معنى الشك (الشبهة) والأثر في السمعة (العيب).
    - lemma: "رِيبَة"
      generation_method: ishtiqaq
      justification: >-
        من جذر ريب، على وزن فِعْلَة. معناها في المعاجم: الظنّ والشك والتهمة.
        قريبة من المفهوم المطلوب لكنها قد تكون أعمّ من المقصود.
    - lemma: "مَثْلَبَة"
      generation_method: ishtiqaq
      justification: >-
        من جذر ثلب (العيب)، على وزن مَفْعَلة. معناها: العيب والمسبّة.
        تدلّ على ما يُعاب به المرء في سمعته.
    - lemma: "غُمَّة"
      generation_method: majaz
      justification: >-
        من جذر غمم (التغطية والالتباس)، على وزن فُعْلَة.
        يقال «أمر غُمَّة» أي مبهم ملتبس، فهي مجازاً: ما يُغشي السمعة ويُلبسها.


stage2_evidence:
  per_lemma:
    - lemma: "غَيْمَة شَكّ"
      contradicts:
        - text: "«غَيْمَة: القطعة من الغيم كالسحابة. شدة العطش»"
          source: "المعجم الوسيط"
          conflict: "غيمة معناها الحقيقي سحابة أو شدة العطش، ولم تُستعمل مجازياً في المعاجم العربية بمعنى الشبهة"
        - text: "«غَيْمَة — الرأي: مرفوضة — السبب: لأنها لم ترد في المعاجم بمعنى القطعة من الغيم. الصواب والرتبة: بَدَت في الأفق سحابة كبيرة [فصيحة] - بَدَت في الأفق غَيْمة كبيرة [فصيحة]»"
          source: "معجم الصواب اللغوي"
          conflict: "حتى الاستعمال الحقيقي لغيمة كان موضع خلاف، فكيف بالمجازي؟"

    - lemma: "وَصْمَة"
      confirm:
        - text: "«الفَتْرَةُ في الجسد. العيب. العار. اليمينُ في معصية»"
          source: "المعجم الوسيط"
        - text: "«يَدُلُّ عَلَى كَسْرٍ وَضَعْفٍ... وَيُحْمَلُ عَلَى هَذَا فَيُقَالُ لِلْعَارِ وَالْعَيْبِ: وَصْمٌ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(1) وصمة عارٍ (2) علامة أو خاصيّة مُمَيِّزة»"
          source: "المورد الحديث"
          addition: "تعبير «وصمة عار» مسكوك في العربية المعاصرة لترجمة stigma"

    - lemma: "شَائِبَة"
      confirm:
        - text: "«الشيء الغريب يختلط بغيره. ما فيه شائبة: ليس فيه شُبهةٌ. الدَّنَسُ والقَذَر ونحوهما»"
          source: "المعجم الوسيط"
        - text: "«فلانٌ بريءٌ من الشوائبِ: ليس فيه ما يَعيبه»"
          source: "المعجم الكبير"
      expands:
        - text: "«ولا شكَّ قلبى ساعةً في اعتقاده / ولا شابَ ظَنِّي قطُّ فيه الشوائِبُ»"
          source: "المعجم الكبير — شاهد شعري لأبي فراس الحمداني"
          addition: "الشاهد يجمع بين الشك والشوائب في سياق واحد، مما يؤكد دلالة الشائبة على الشبهة"
        - text: "«(الشِّينُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْخَلْطُ)»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الخلط، والشائبة ما يخالط الشيء فيُفسده"

    - lemma: "رِيبَة"
      confirm:
        - text: "«الظَّنُّ والشك والتهمة»"
          source: "المعجم الوسيط"
        - text: "«الشَّكُّ, والظِّنَّةُ, والتُّهَمَةُ»"
          source: "المعجم الكبير"
      expands:
        - text: "«الرَّاءُ وَالْيَاءُ وَالْبَاءُ أُصَيْلٌ يَدُلُّ عَلَى شَكٍّ، أَوْ شَكٍّ وَخَوْفٍ... وَأَرَابَ الرَّجُلُ: صَارَ ذَا رِيبَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الريبة تجمع بين الشك والخوف، لكنها لا تتضمّن بالضرورة الأثر في السمعة"
        - text: "«مَكْسَبَةٌ فيها بعضُ الرِّيبَة خيرٌ من المسأَلَة»"
          source: "المعجم الكبير — أثر عن عمر بن الخطاب"
          addition: "الريبة هنا بمعنى الشبهة في المكسب، مما يقرّبها من المعنى المطلوب"

    - lemma: "مَثْلَبَة"
      confirm:
        - text: "«العَيْبُ. يُقالُ: ما عَرَفْتُ في فلانٍ مَثْلَبَة ومَثْلُبَة»"
          source: "المعجم الكبير"
