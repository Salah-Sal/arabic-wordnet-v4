          source: "المعجم الوسيط"
          conflict: "الغمّة تدلّ على الغمّ والضيق والالتباس، لا على الشبهة المؤثرة في السمعة"
      expands:
        - text: "«أَمر غمَّة مُبْهَم ملتبس. وَإنَّهُ لفي غمَّة من أمره إِذا لم يهتد للمخرج»"
          source: "المعجم الوسيط"
          addition: "الغمّة التباس وحيرة ذاتية، لا شبهة اجتماعية تمسّ السمعة"


stage3_analysis:
  per_lemma:
    - lemma: "غَيْمَة شَكّ"
      decision: removed
      decision_reason: >-
        تعبير مترجم حرفياً عن الإنجليزية (a cloud of suspicion) ولم يثبت في المعاجم العربية
        كتعبير اصطلاحي. «غيمة» في العربية سحابة أو شدة عطش فحسب، واستعمالها المجازي
        بمعنى الشبهة اقتراض مفهومي (calque) لا سند له في التراث العربي. يفشل في
        اختبار التثبيت المعجمي واختبار السكّ (يمكن إبدال «غيمة» بـ«سحابة» أو «ضبابة»).
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وَصْمَة"
      decision: confirmed
      decision_reason: >-
        ثابتة في المعاجم بمعنى العيب والعار. الجذر «وصم» يدلّ على الكسر والضعف ومنه
        العار والعيب (مقاييس اللغة). تعبير «وصمة عار» مسكوك في العربية المعاصرة.
        تؤدّي المعنى المطلوب: شبهة تلحق بالسمعة فتكون كالعار.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        الوصمة تركّز على الأثر الباقي في السمعة (العار والعيب اللاحق) أكثر من طبيعة الشك نفسه.
        فهي نتيجة الشبهة لا الشبهة ذاتها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَصْمَة"

    - lemma: "شَائِبَة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        ثابتة في المعجم الوسيط والكبير بمعنى الشبهة: «ما فيه شائبة: ليس فيه شبهة»
        و«فلان بريء من الشوائب: ليس فيه ما يعيبه». تجمع بين دلالتَي الشبهة والعيب
        في السمعة، وهو صميم المعنى المطلوب. شاهد أبي فراس الحمداني يربط بين الشك
        والشوائب صراحةً. مصطلح عربي أصيل من جذر «شوب» (الخلط).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        الشائبة تركّز على ما يخالط السمعة فيُكدّرها، وهي أقرب إلى فعل الشك في السمعة
        (الشبهة المخالِطة) منها إلى النتيجة (العار).
      actions:
        - command: create_entry
          params:
            lemma: "شَائِبَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رِيبَة"
      source: stage1
      decision: removed
      decision_reason: >-
        الريبة معناها الشك والتهمة مطلقاً (المعجم الوسيط)، وهي أقرب إلى الهايبرنيم
        «اشتباه/شك» منها إلى هذه المجموعة المخصّصة بالشك المؤثر في السمعة.
        لا تتضمّن بالضرورة الأثر في السمعة، فهي عامة جداً.

    - lemma: "مَثْلَبَة"
      source: stage1
      decision: removed
      decision_reason: >-
        المثلبة تدلّ على العيب الثابت والمسبّة وشدة اللؤم (المعجم الكبير)، لا على
        الشك أو الشبهة. هي عيب محقّق لا شبهة، والمعنى المطلوب يتضمّن عنصر الشك.

    - lemma: "غُمَّة"
      source: stage1
      decision: removed
      decision_reason: >-
        الغمّة تدلّ على الغمّ والضيق والحيرة الذاتية (المعجم الوسيط)، لا على شبهة
        اجتماعية تمسّ السمعة. الدلالة على الالتباس الشخصي لا على العار العامّ.


