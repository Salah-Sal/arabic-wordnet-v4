# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14028443-n — tremolo
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تريمولو» اقتراض مباشر من الإيطالية بدون تشكيل"
      - "اللمّة «رجفة صوتية» مركب وصفي غير مسجّل كوحدة معجمية ثابتة في مجال الموسيقى"
      - "دلالة «رجفة» الأساسية في المعاجم هي الزلزلة لا الأثر الموسيقي"
      - "لا يوجد مصطلح مشتق عربي صريح في اللمّات الحالية يعبّر عن التكرار السريع للنغمة"
    observations: >
      المجموعة تصف مفهوماً موسيقياً اصطلاحياً (tremolo) وهو تأثير ينتج عن تكرار نغمة واحدة
      بسرعة أو التبادل السريع بين نغمتين. هذا المفهوم تقني متخصص يحتاج إلى مصطلح
      عربي دقيق. الجذور العربية المناسبة تدور حول معاني الاضطراب والرجفة والرعد،
      وهي غنية بالاشتقاقات التي يمكن أن تؤدي المعنى المطلوب.
  blind_candidates:
    - lemma: "تَرْجِيف"
      generation_method: ishtiqaq
      justification: >
        من الجذر ر-ج-ف الدال على الاضطراب، على وزن تَفْعِيل (مصدر رَجَّفَ)، بمعنى
        إحداث الرجفة في الصوت أو النغمة. الوزن مناسب لدلالة الإحداث والتكرار.
    - lemma: "تَرْعِيد"
      generation_method: ishtiqaq
      justification: >
        من الجذر ر-ع-د الدال على الحركة والاضطراب، على وزن تَفْعِيل، بمعنى إحداث
        الارتعاد في الصوت. الرعد والارتعاد من حقل الاهتزاز الصوتي.
    - lemma: "تَهَدُّج"
      generation_method: ishtiqaq
      justification: >
        من الجذر هـ-د-ج، على وزن تَفَعُّل. في المعاجم التَّهَدُّج تَقَطُّع الصوت،
        وهو قريب من المفهوم الموسيقي للتكرار السريع المتقطع.
    - lemma: "رِعْشَة نَغَمِيَّة"
      generation_method: tarkib
      justification: >
        مركب وصفي من «رعشة» (من رعش: الاهتزاز) و«نغمية» (نسبة إلى النغمة).
        يصف الأثر المرتعش في النغمة الموسيقية.

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تريمولو"
      confirm:
        - text: "«(1) اهتزاز (مو) (2) الهزّازة: أداة في الأرغن لإحداث الاهتزاز (مو).»"
          source: "المورد الحديث (2008) — مدخل tremolo"
      expands:
        - text: "«ترجيف الصوت — tremolo(It.)»"
          source: "مسرد الفن والتسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
          addition: "ARABTERM يقدّم «ترجيف الصوت» بديلاً عربياً رسمياً لـ tremolo"

    - lemma: "رَجْفَة صَوْتِيَّة"
      contradicts:
        - text: "«الرَّجْفَةُ: الزلزلة»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية للرجفة هي الزلزلة لا الأثر الموسيقي"
        - text: "«الزَّلْزَلَة وقيل: الرَّجْفَةُ فى القرآن: كُلُّ عَذَابٍ أَخَذَ قومًا. (عن اللَّيْث)»"
          source: "المعجم الكبير"
          conflict: "الرجفة في السياق القرآني تدل على العذاب والزلزال"
      expands:
        - text: "«(فى الطب) clonus: تَناوُبُ الانْقِباض والانبِساط في العَضلات, ويحدث بتَتابُعٍ سريعٍ»"
          source: "المعجم الكبير"
          addition: "في الطب الرجفة = تناوب سريع (قريب بنيوياً من مفهوم التريمولو)، لكنه مصطلح طبي لا موسيقي"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَرْجِيف"
      confirm:
        - text: "«ترجيف الصوت — tremolo(It.)»"
          source: "مسرد الفن والتسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
      expands:
        - text: "«(رَجَفَ) الرَّاءُ وَالْجِيمُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى اضْطِرَابٍ. يُقَالُ رَجَفَتِ الْأَرْضُ وَالْقَلْبُ. وَالْبَحْرُ رَجَّافٌ لِاضْطِرَابِهِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ر-ج-ف أصل صحيح في دلالة الاضطراب، يشمل الأرض والقلب والبحر"

    - lemma: "تَرْعِيد"
      contradicts:
        - text: "«أن يتكلَّف قارئُ القرآنِ إرْعاشَ صوتِه كالذى يُرْعَدُ من بَرْدٍ أو ألمٍ, وهو منهيٌّ عنه»"
          source: "المعجم الكبير"
          conflict: "الترعيد في تقاليد القراءة القرآنية فعل مذموم منهي عنه"
        - text: "«التّرعيد: بالعين المهملة عند بعض متأخري القرّاء هو أن يرعد صوت القرآن كالذي يرعد من برد أو ألم وهو منهي، كذا في الإتقان.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التهانوي يؤكد أن الترعيد منهي عنه في تجويد القرآن"

    - lemma: "تَهَدُّج"
      confirm:
        - text: "«وَمِمَّا شَذَّ عَنْ هَذَا الْأَصْلِ التَّهَدُّجُ: تَقَطُّعُ الصَّوْتِ.»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«تهديج الصوت - اهتزاز — vibrato»"
          source: "موسوعة الكهرباء (IEC 60050) — ARABTERM"
          conflict: "ARABTERM يخصّص «تهديج الصوت» لمصطلح vibrato لا tremolo، والمفهومان مختلفان"
      expands:
        - text: "«(1) يرتعش؛ يتهَدَّج (2) يتكلَّم أو يغنّي بتهدُّج (3) ارتعاش؛ تهدُّج (4) ذات السِّنّ: نغمة موسيقية خاصة.»"
          source: "المورد الحديث (2008) — مدخل quaver"
          addition: "التهدج يُقابل quaver في الإنجليزية ويُستخدم في سياق الغناء والكلام"

    - lemma: "رِعْشَة نَغَمِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تِرِيمُولُو"
      decision: confirmed
      decision_reason: >
        اقتراض مباشر من الإيطالية tremolo، شائع في الممارسة الموسيقية العربية المعاصرة
        ومفهوم لدى الموسيقيين. يقبل لام التعريف (التريمولو) والنسبة (تريمولوي).
        يُبقى كمصطلح دولي مع تفضيل البديل العربي «ترجيف».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح دولي مقترض يُستخدم في السياقات الموسيقية التطبيقية والأدائية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تِرِيمُولُو"

    - lemma: "رَجْفَة صَوْتِيَّة"
      decision: removed
      decision_reason: >
        مركب وصفي غير مسجّل كوحدة معجمية ثابتة في المجال الموسيقي.
        «الرجفة» في المعاجم العربية تدل أساساً على الزلزلة والعذاب القرآني،
        وفي الطب على تناوب انقباض العضلات. لم يُعثر على أي شاهد يربطها
        بالموسيقى. يُستبدل بـ«ترجيف» المعتمد في ARABTERM.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَرْجِيف"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصدر تَفْعِيل من رَجَّفَ (أحدث الرجفة)، معتمد في مسرد الفن والتسلية
        (ARABTERM/ALECSO) بصيغة «ترجيف الصوت» مقابلاً لـ tremolo.
        الجذر ر-ج-ف أصل صحيح يدل على الاضطراب (مقاييس اللغة).
        المصطلح يستوفي معايير الاطّراد والاشتقاقية والملاءمة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح عربي مشتق اشتقاقاً قياسياً، يُفضّل في السياقات العلمية والأكاديمية"
      actions:
        - command: create_entry
          params: {lemma: "تَرْجِيف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَرْعِيد"
      source: stage1
      decision: removed
      decision_reason: >
        الترعيد مصطلح مخصوص في علم التجويد يعني تكلّف إرعاش الصوت عند
        قراءة القرآن، وهو منهيّ عنه عند القرّاء (المعجم الكبير، كشاف التهانوي).
        هذه الدلالة السلبية تجعله غير ملائم لمصطلح موسيقي محايد.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَهَدُّج"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن التهدُّج يعني تقطّع الصوت (مقاييس اللغة)، فإن ARABTERM
        يخصّص «تهديج الصوت» لمصطلح vibrato لا tremolo.
        والفرق بينهما جوهري: التريمولو تكرار سريع للنغمة نفسها،
        أما الفيبراتو فتذبذب طفيف في حدّة النغمة. استخدام «تهدّج»
        للتريمولو يُحدث خلطاً اصطلاحياً.
      evidence_assessment:
        case: mixed

    - lemma: "رِعْشَة نَغَمِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مركب وصفي غير مسجّل في أي معجم. يفشل في اختبار السكّ:
        يمكن إبدال «نغمية» بـ«موسيقية» أو «صوتية» ويبقى وصفاً حراً.
        ليست وحدة معجمية ثابتة.
      evidence_assessment:
        case: no_material

