# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (مصور فوتوغرافي) تستخدم قيداً أجنبي الأصل (فوتوغرافي ← photographique) بينما تتوفر بدائل عربية خالصة موثقة في المعاجم المعتمدة"
      - "المجموعة تفتقر إلى اللمّة العربية الأصيلة (مُصَوِّر) التي يُعرِّفها المعجم الوسيط صراحةً بـ«من حرفته التصوير»"
      - "التعريف الحالي (شخص يلتقط الصور الفوتوغرافية بشكل احترافي) يستخدم أسلوباً عامياً (بشكل احترافي) بدلاً من الصياغة المعجمية الكلاسيكية"
      - "غياب التشكيل الكامل عن اللمّة الموجودة"
    observations: >
      المجموعة تمثّل مفهوماً مهنياً واضحاً (المحترف في التصوير الضوئي)؛ واللغة العربية تملك له
      تعبيراً أصيلاً هو «مُصَوِّر» (من وزن مُفَعِّل دالٍّ على الحِرفة) ورد في المعجم الوسيط
      والمعجم الكبير بالنص الحرفي «من حرفته التصوير». كما أن التعبير المركّب «مُصَوِّر ضَوْئِيّ»
      موثّق في المورد الحديث (2008) كمرادف عربي لـ«photographer» إلى جانب «المصوِّر الفوتوغرافيّ».
      يلزم توسيع المجموعة بإضافة هاتين اللمّتين وتصحيح التعريف وفق الأسلوب المعجمي الكلاسيكي.
  blind_candidates:
    - lemma: "مُصَوِّر"
      generation_method: majaz
      justification: >
        لفظ عربي كلاسيكي من مادة ص-و-ر على وزن مُفَعِّل يدلّ على الفاعل المتكرر أو المحترف؛
        استُخدم في القرآن الكريم لوصف الله «الْمُصَوِّرُ» (سورة الحشر) وانتقل دلالياً إلى
        «من حرفته التصوير». إحياءٌ دلالي طبيعي يربط بالجذر ذاته ربطاً وظيفياً مباشراً دون دوران.
    - lemma: "صَوَّار"
      generation_method: ishtiqaq
      justification: >
        من جذر ص-و-ر على وزن فَعَّال الدال على الاحتراف والمبالغة (كنَجَّار وغَسَّال)؛
        تقترح مشابهة صناعية «من يصوِّر كثيراً» أو «محترف التصوير». المقصود توليد نظير
        اشتقاقي قياسي للمهنة.
    - lemma: "مُصَوِّر ضَوْئِيّ"
      generation_method: tarkib
      justification: >
        مركَّب وصفي (idafi-wasfi): مُصَوِّر (اسم الحِرفة) + ضَوْئِيّ (نسبة إلى الضَّوْء؛
        وهو جوهر التصوير الفوتوغرافي القائم على تسجيل الضوء). يُميِّز هذا النوع من التصوير
        عن الرسم اليدوي أو التصوير الرقمي الاصطناعي بأداة عربية خالصة.
    - lemma: "مُحْتَرِف التَّصْوِير"
      generation_method: tarkib
      justification: >
        مركَّب إضافي: مُحترِف (صيغة اسم الفاعل من الاحتراف) + التصوير (المصدر)؛
        يُصرِّح بالبُعد المهني الذي تشير إليه «professionally» في التعريف الإنجليزي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفَّذة: ٥ استعلامات
#   ١. مطابقة دفعية للمات (الموجودة + المرشحات + صيغ ال-)
#   ٢. الجسر الإنجليزي (photographer / photography / photographic)
#   ٣. بحث FTS عربي (التصوير، مصور)  ← لم يُسفر عن نتائج جديدة
#   ٤. مقاييس اللغة لجذر صور
#   ٥. مقاييس اللغة لجذر ضوء
stage2_evidence:
  per_lemma:

    - lemma: "مصور فوتوغرافي"
      confirm:
        - text: "«المصوِّر الفوتوغرافيّ؛ المصوِّر الضَّوئيّ.»"
          source: "المورد الحديث (2008) — ARABTERM، entry_id=707653، translation_en: photographer"
      expands:
        - text: "«مصوِّر شمسي»"
          source: "مسرد الإعلام والتواصل — ARABTERM، entry_id=485465، translation_en: photographer; still man"
          addition: >
            يكشف أن ثمة مصطلحاً عربياً قديماً آخر (مصوِّر شمسي) استُخدم لنفس المفهوم؛
            «الشمسي» يُلمح إلى الاعتماد التاريخي على ضوء الشمس في التصوير الفوتوغرافي المبكر.
            وجوده في قاموسين مختلفين من ARABTERM يُرسِّخ حالة التعدد المصطلحي.

    - lemma: "مُصَوِّر"
      confirm:
        - text: "«من حِرْفتُه التصوير»"
          source: "المعجم الوسيط، مجمع اللغة العربية بالقاهرة — OCR، entry_id=16446"
        - text: "«مَنْ حِرْفَتُه التَّصويرُ»"
          source: "المعجم الكبير، مجمع اللغة العربية — OCR، entry_id=57427"
        - text: "«من حرفته التَّصْوِير»"
          source: "المعجم الوسيط (رواية هوارماني)، entry_id=883457"
        - text: "«من حرفته التصوير، والمصور: من أسماء الله الحسنى»"
          source: "موسوعة السلطان قابوس لأسماء العرب، entry_id=944856"
      expands:
        - text: "«من أسماءِ اللهِ الحُسْنَى, وهو الذى صَوَّر جميع الموجودات ورتَّبها, فأعطى كلَّ شىءٍ مِنْها صورةً خاصةً وهيئةً مفردةً يتميزُ بها»"
          source: "المعجم الكبير — OCR، entry_id=57426"
          addition: >
            يُظهر أن «مُصَوِّر» كلمة متعددة المعاني (polysemous): الاسم الإلهي والحرفة البشرية.
            في سياق المجموعة الترادفية المعنية يُقيَّد المعنى بالإنسان المحترف.

    - lemma: "صَوَّار"
      contradicts:
        - text: "«عُصْفورٌ صَوَّارٌ: يُجيب الداعى إِذا دَعَا»"
          source: "المعجم الكبير — OCR، entry_id=57419"
          conflict: "اللمّة موثّقة بمعنى «الطائر المستجيب للنداء» لا بمعنى محترف التصوير"
        - text: "«الصُّوَّارُ: القطيعُ من البقر ونَحْوه»"
          source: "المعجم الكبير — OCR، entry_id=57420"
          conflict: "يدلّ على قطيع البقر؛ بعيد تماماً عن دلالة التصوير الفوتوغرافي"
        - text: "«عُصْفُورٌ صَوَّارٌ وَهُوَ الَّذِي إِذَا دُعِيَ أَجَابَ... وَهَذَا لَا أَحْسَبُهُ عَرَبِيًّا»"
          source: "مقاييس اللغة لابن فارس، entry_id=987377"
          conflict: "ابن فارس نفسه شكَّك في كون الصيغة عربية الأصل؛ مما يُسقط حجية الاشتقاق"

    - lemma: "مُصَوِّر ضَوْئِيّ"
      confirm:
        - text: "«المصوِّر الفوتوغرافيّ؛ المصوِّر الضَّوئيّ.»"
          source: "المورد الحديث (2008) — ARABTERM، entry_id=707653، translation_en: photographer"
      expands:
        - text: "«مصوِّر شمسي» — translation_en: photographer; still man"
          source: "مسرد الإعلام والتواصل — ARABTERM، entry_id=485465"
          addition: >
            المصطلح العربي «مصوِّر شمسي» يؤكد أن الوصف الضوئي/الشمسي ظلّ في الاستخدام المعجمي
            الحديث للإشارة إلى المصوِّر الفوتوغرافي؛ وهو أقرب دلالةً إلى «مُصَوِّر ضَوْئِيّ»
            من حيث الطريقة الاشتقاقية.

    - lemma: "مُحْتَرِف التَّصْوِير"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مصور فوتوغرافي"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة في المورد الحديث (2008) كمقابل لـ«photographer» وتُعدّ المصطلح الأكثر
        انتشاراً في السياقات الرسمية والإعلامية. ونعم، القيد «فوتوغرافي» دخيل الأصل
        (من اليونانية عبر الفرنسية)، غير أن المعاجم المعتمدة تُقنِّنه. يُحتفظ به مع تصحيح
        التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مركَّب وصفي يستخدم القيد الأجنبي الدارج «فوتوغرافي» الذي يمنحه خصوصيةً اصطلاحيةً
        دوليةً ويُميِّزه عن مصوِّر الرسم أو مصوِّر الفيديو؛ الأنسب في النصوص القانونية والمهنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُصَوِّر فُوتُوغْرَافِيّ"

    - lemma: "مُصَوِّر"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق بشكل قاطع في المعجم الوسيط والمعجم الكبير ومعجم السلطان قابوس بنص صريح
        «من حرفته التصوير». الكلمة عربية أصيلة على وزن مُفَعِّل (اسم فاعل التضعيف) من
        مادة ص-و-ر. يجتاز اختبار التثبيت المعجمي. يُعدّ الأساس الاشتقاقي الذي بُني عليه
        المركَّب الوصفي الموجود.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللفظ العربي الأصيل غير المقيَّد؛ يُستخدم في السياق اليومي والصحافي ويحمل إيحاءً
        بالحرفة دون تخصيص الأداة؛ أشمل من أخواته وأقرب إلى الاستخدام المنطوق.
      actions:
        - command: create_entry
          params:
            lemma: "مُصَوِّر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "صَوَّار"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الموثوقة (الكبير، الوسيط) تُثبت «صَوَّار» بمعنى «الطائر المستجيب» أو
        «القطيع من البقر»؛ ولا صلة لأيٍّ منهما بالتصوير الفوتوغرافي. علاوةً على ذلك،
        ابن فارس في المقاييس شكَّك صراحةً في عروبة الصيغة (صَوَّار بمعنى الطائر)
        قائلاً «لا أحسبه عربياً»؛ فيسقط الأساس الاشتقاقي للمرشح.

    - lemma: "مُصَوِّر ضَوْئِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في المورد الحديث (2008) ضمن نفس المدخل المعجمي مع «المصوِّر الفوتوغرافيّ»
        كمرادف عربي لـ«photographer». القيد «ضَوْئِيّ» نسبة عربية خالصة إلى «ضَوْء»
        (الجذر ض-و-ء) يعكس الطبيعة الضوئية للتصوير بدقة علمية. يجتاز اختبار السكّ:
        التركيب ثابت لا يقبل إبدال «ضوئي» بـ«نوري» أو «إشعاعي» مع الاحتفاظ بالدلالة ذاتها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يستخدم قيداً عربياً خالصاً يُبرز الطبيعة الضوئية للتصوير؛ الأنسب في السياق الأكاديمي
        والتقني؛ يُفضَّل عند الحاجة إلى استبعاد المصطلح الأجنبي «فوتوغرافي».
      actions:
        - command: create_entry
          params:
            lemma: "مُصَوِّر ضَوْئِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُحْتَرِف التَّصْوِير"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية. والتعبير لا يجتاز اختبار السكّ: يمكن إبدال «محترف» بـ«متخصص»
        أو «خبير» مع الاحتفاظ بالمعنى الوصفي ذاته؛ مما يكشف أنه وصف حرّ لا مصطلح
        مسكوك. فضلاً عن ذلك، «مُحترف» في العربية المعاصرة يُستخدم كصفة لا كاسم مهنة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يلتقط الصور الفوتوغرافية بشكل احترافي"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح المعنى لكن يعتوره ثلاثة قصور: (١) «بشكل احترافي» تعبير عامي
        لا يناسب أسلوب المعجم؛ (٢) «شخص» جنس قريب صحيح لكن المعجم الوسيط يستخدم «مَنْ»
        في تعريف أصحاب الحِرَف؛ (٣) الصياغة لا تستحضر النمط المعجمي الكلاسيكي
        «من حرفته كذا» الذي يُثبته المعجم الوسيط للمصطلح ذاته.
    authored:
      - type: terminological
        text: "مَنْ حِرفَتُهُ التَّصويرُ الفوتوغرافيُّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مَنْ يمتهنُ التصويرَ الفوتوغرافيَّ بالآلةِ الضَّوئيَّة؛ يلتقطُ الصُّوَرَ
          لأغراضٍ فنيَّةٍ أو صحافيَّةٍ أو تجاريَّةٍ، ويتميَّزُ عن الهاوي باحترافِ
          الحِرفةِ وممارستِها مصدرَ رزق.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ حِرفَتُهُ التَّصويرُ الفوتوغرافيُّ"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
