  # "شخص يتبنى الجانب الأسوأ أو المعاكس فقط من أجل الجدال"
  blind_candidates:
    - lemma: "مُزَايِد"
      generation_method: majaz
      justification: >
        من "زَايَدَ" بمعنى رفع السقف في المزايدة؛ إزاحة دلالية نحو من يرفع سقف
        الاعتراض في النقاش متجاوزاً قناعاته الحقيقية. الجذر زيد يدل على الفضل
        والزيادة (ابن فارس)، فالمزايد يزيد على الموقف السائد بمعارضته المصطنعة.
        اختبار السكّ: مصطلح مستقل لا يتبدّل بمرادف مع بقاء الدلالة الاصطلاحية.

    - lemma: "مُتَعَكِّس"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر "عكس" على وزن مُتَفَعِّل الدال على التكلّف والقصد؛ أي من
        يعمد إلى عكس الموقف السائد عن سابق تدبّر. ابن فارس: العكس "رَدُّكَ آخِرَ
        الشَّيْءِ عَلَى أَوَّلِهِ". الوزن المُتَفَعِّل يُفيد التصنّع والاختيار
        المتعمّد، وهو جوهر المفهوم.

    - lemma: "مُثِيرُ الشُّبُهَات"
      generation_method: tarkib
      justification: >
        تركيب إضافي مستعمل في الخطاب الفلسفي والفقهي؛ يُطلق على من يطرح
        الإشكالات والاعتراضات لاختبار الحجج لا لرفضها. وحدة معجمية ثابتة النسج
        في التراث الجدلي الإسلامي. اختبار التثبيت: لا يمكن إبدال "الشبهات"
        بـ"الأسئلة" مع الحفاظ على الدلالة الاصطلاحية في هذا الخطاب.

    - lemma: "المُعارِضُ المُتَكَلَّف"
      generation_method: tarkib
      justification: >
        تركيب وصفي (مركب وصفي) يصف من يتصنّع المعارضة. "المتكلَّف" (من كلّف يكلّف)
        يُفيد التصنّع والافتعال، وهو ما يُميّز محامي الشيطان عن المعارض الحقيقي.
        الاسم المفعول "متكلَّف" معجمياً موثّق بمعنى المُصطنَع والمُبالَغ فيه.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        اللمّة الوحيدة "مُحامِي الشَّيْطان" كالكٌ (ترجمة حرفية مبنائية) مباشر من
        الإنجليزية "devil's advocate"، ولم يُصَكّ في التراث المعجمي العربي بوصفه
        مصطلحاً ثابتاً.
      - >
        المصطلح ذو أصل كنسي كاثوليكي صرف (advocatus diaboli: المحامي الذي يعارض
        تقديس القديسين في الكنيسة الرومانية)، وهو مفهوم غريب عن التقليد الجدلي
        الإسلامي والعربي، مما يجعل حضوره في شبكة WordNet العربية يستوجب ملاحظة.
      - >
        كلمة "الشيطان" في السياق الإسلامي محمّلة بدلالة دينية قوية (الكائن الشرير
        المشخّص)، وقد يُحدث استخدامها في مصطلح بلاغي لبساً بين المعنى المجازي
        والمعنى العقدي، وهو ما لا تعاني منه "devil" بالقدر ذاته في الإنجليزية.
      - >
        لا يوجد في قاعدة البيانات المعجمية أي توثيق للمركب "محامي الشيطان" كوحدة
        معجمية ثابتة، لا في المعاجم الكلاسيكية ولا في معاجم المصطلحات الحديثة.
      - >
        التعريف العربي الحالي "شخص يتبنى الجانب الأسوأ أو المعاكس فقط من أجل الجدال"
        جيد في جوهره لكنه يجمع بين وصفين غير متطابقَيْن ("الأسوأ" و"المعاكس") دون
        إيضاح العلاقة بينهما، كما أن تعبير "فقط من أجل الجدال" يُقلّل دلالة المفهوم
        الذي يشمل أيضاً غايات كاختبار الحجج وإثارة الرأي الآخر.
    observations: >
      المجموعة awn4-10030054-n تُمثّل مفهوماً جدلياً نقدياً يُعبّر عنه في العربية
      الحديثة عادةً بالتعبير المركب "محامي الشيطان" مستعاراً من الإنجليزية. لا يوجد
      للمفهوم مقابل عربي تراثي موحّد، وإن كانت الممارسة الجدلية التي يصفها معروفة في
      الفقه الإسلامي تحت مسمى "الإلزام" (إلزام الخصم بلوازم قوله) أو في المناظرات
      الكلامية حين يتبنّى المتناظر موقفاً افتراضياً لاختبار الحجج. اللمّة الحالية تؤدي
      وظيفتها التواصلية في العربية المعاصرة ولا ينبغي إزالتها، غير أن التعريف يحتاج
      إلى تدقيق، والمجموعة تستحق ملاحظة بشأن أصلها الثقافي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
