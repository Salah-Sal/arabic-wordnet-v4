# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُحامِي الشَّيْطان"
      decision: confirmed
      decision_reason: >
        اللمّة مركب إضافي ثابت في العربية المعاصرة، شائع في الخطاب الإعلامي
        والأكاديمي والتداولي للتعبير عن هذا المفهوم بعينه. غياب التوثيق المعجمي
        في المصادر الكلاسيكية مبرَّر بحداثة المفهوم وأصله الغربي. يجتاز اختبار
        السكّ: لا يمكن إبدال "الشيطان" بـ"المعارض" أو "الخصم" مع الحفاظ على
        الدلالة الاصطلاحية ذاتها. يجتاز اختبار التثبيت المعجمي: الوحدة متداولة
        بوصفها مصطلحاً كلياً لا وصفاً حراً. تقييم جودة المصطلح: يُخفق في معيار
        "إيثار التراثي" و"إيثار العربي" لكنه يجتاز معايير الاطراد والملاءمة
        والتداول. اللمّة فصيحة صرفياً ونحوياً، والوزن الصرفي (محامٍ → محامِي في
        الإضافة) صحيح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تحمل إيحاء المدافع المصطنع عن الرأي المخالف
        في إطار جدلي، مع طابع الاستعارة الكاملة من مرجعية الشيطان بوصفه رمزاً
        للمعارضة والتحدي. لا يُعبّر المصطلح عن المعارضة الصادقة (≠ مُعارِض) ولا
        عن المناظرة الأكاديمية المحايدة (≠ مُناظِر)، بل عن تبنّي الموقف الأضعف
        أو الأقلّ شعبية بوعي ومقصدية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحامِي الشَّيْطَان"

    - lemma: "مُزَايِد"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح موثّق في المعجم الموحد للتجارة والمحاسبة بمعنى "المشارك في المزاد
        العلني" (bidder)، وهو معنى بعيد كل البُعد عن المفهوم المطلوب. استخدامه
        بمعنى "مَن يتبنّى الموقف المعاكس في الجدال" سيُحدث اشتراكاً لفظياً مضراً.
        فضلاً عن ذلك، فإن "مزايد" في الخطاب السياسي العربي المعاصر يحمل دلالة
        سلبية (من يبالغ في مواقفه لأغراض انتخابية أو شعبوية)، مختلفة عن
        "محامي الشيطان" الذي يقوم بدور جدلي بنّاء.

    - lemma: "مُتَعَكِّس"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد معجمية على استخدام هذا الاشتقاق. رغم أن الوزن الصرفي
        (مُتَفَعِّل) صحيح ومنتج في العربية، وأن الجذر "عكس" يدل على رد آخر الشيء
        على أوله (ابن فارس)، إلا أن غياب أي توثيق وعدم تداول المصطلح يجعله
        مرفوضاً بمبدأ التثبيت المعجمي. اختبار الاستبدال: يمكن وصف المعنى بـ"ذو
        موقف معاكس" مما يدل على عدم السكّ الاصطلاحي.

    - lemma: "مُثِيرُ الشُّبُهَات"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير مستخدم في الخطاب الديني والفلسفي الإسلامي لكن بمعنى مغاير: هو من
        يثير الشكوك والتساؤلات لزعزعة اليقين (وغالباً بنيّة سيئة في السياق اللاهوتي)،
        لا من يتبنّى موقفاً مخالفاً عن سابق تدبر جدلي بنّاء. التضارب الدلالي
        مع المفهوم المطلوب يُسقط هذا المرشح. اختبار التثبيت: ليس وحدة معجمية
        مسكوكة بالمعنى الجدلي المطلوب.

    - lemma: "المُعارِضُ المُتَكَلَّف"
      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي في قاعدة البيانات. يفشل في اختبار السكّ: يمكن إبدال
        "المتكلَّف" بـ"المفتعَل" أو "المُصطنَع" مع بقاء التعبير وصفياً صالحاً
        للوصف الحر، مما يكشف أنه ليس مصطلحاً بل تعبيراً وصفياً مؤلَّفاً.
        لا يحمل قابلية الاشتقاق (لا يمكن بناء صفة نسبة أو جمع اصطلاحي منه).


