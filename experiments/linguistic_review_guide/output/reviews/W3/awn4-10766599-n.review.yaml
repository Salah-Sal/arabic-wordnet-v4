      decision_reason: "الجذر (نزو) أصيل وابن فارس يُوثّق 'نزا ينزو: وثب'، لكن 'نازياً' مفرد عام لكل من يثب ويرتفع ولا يختص بالقفز بالزانة تحديداً؛ كما أن اللفظ مهجور كلياً في الاستعمال المعاصر ولا يُفيد التواصل. إحياؤه يحتاج إلى تهيئة قبولية أطول."
