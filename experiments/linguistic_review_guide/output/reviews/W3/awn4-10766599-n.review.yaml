# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10766599-n  |  ILI: i93893  |  POS: n
# المفهوم: لاعب القفز بالزانة (pole vaulter)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة الموجودة 'قافز بالزانة' تعبير وصفي لا مصطلح مسكوك بمعنى دقيق؛ يجتاز اختبار التثبيت المعجمي من حيث الشيوع في الكتابات الرياضية المعاصرة، لكنه لا يجتاز اختبار السكّ (يمكن إبداله بـ'واثب بالزانة' أو 'مُتَزَانٍ' دون أن يفقد صلاحيته الوصفية)"
      - "التعريف الحالي يقع في نصف دائرية جزئية: كلمة 'يقفز' مشتقة من الجذر ذاته الموجود في اللمّة 'قافز'"
      - "غياب التشكيل الكامل على اللمّة المُدرجة"
    observations: "المجموعة الترادفية تعبّر عن مفهوم رياضي حديث متخصص. الفصحى المعاصرة تستعمل تعبير 'القفز العالي بالعصا' أو 'القفز بالزانة' للرياضة ذاتها (كما في المورد الحديث)، لكن المصطلح المُسكَّك الخاص بالرياضي الممارس لهذا الفن يبقى في طور التكوين المعجمي. بنية 'اسم فاعل + جار ومجرور' هي الأشيع في النصوص الرياضية العربية المعاصرة، وهي تُؤدّي وظيفة التسمية الاصطلاحية بفضل ثباتها النسبي. يُلاحَظ أن 'الزانة' جاء جذرها (زون) موضع تشكيك عند ابن فارس في المقاييس ('ليس هو عندي أصلاً')، مما يُرجّح دخالتها أو أصلها غير العربي الصريح."

  blind_candidates:
    - lemma: "وَثَّاب"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن فَعَّال من الجذر الثلاثي (وثب) الدال على الارتفاع والطفر؛ يُبنى هذا الوزن للمبالغة في الوصف الدلالي، فالوثّاب هو من كثر وثوبه وقفزه، وهو يلائم الرياضي المتخصص في الوثوب"
    - lemma: "قَافِزُ الزَّانَة"
      generation_method: tarkib
      justification: "تركيب إضافي من 'قافز' (اسم الفاعل من قفز) مضافاً إلى 'الزانة' (القضيب الطويل المرن)؛ يُحدّد الرياضي بأداته الخاصة موازياً تعابير التسمية الاصطلاحية بالأداة كـ'رامي الرمح' و'حامل اللواء'"
    - lemma: "وَاثِبُ الزَّانَة"
      generation_method: tarkib
      justification: "تركيب إضافي من 'واثب' (اسم الفاعل من وثب) مضافاً إلى 'الزانة'؛ يوظّف 'وثب' الأفصح والأعمق جذراً، إذ يدل الجذر وثب في الفصحى على الطفر والارتفاع الحاد، وهو ما يُميّز القفز بالزانة عن ألوان القفز الأخرى"
    - lemma: "نَازٍ"
      generation_method: majaz
      justification: "إحياء للفظ قديم من الجذر (نزو)؛ قال ابن فارس 'نزا ينزو: وثب'، وهو أصل صحيح يرجع إلى معنى الوثبان والارتفاع والسموّ؛ استخدامه مجازاً وظيفياً لمن يتخصص في القفز الارتفاعي يُحيي لفظاً عربياً أصيلاً ويُجنّب الاشتراك اللفظي"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1: مطابقة دفعية (headword_norm) — جميع اللمّات + المرشحات
#   Q2: الجسر الإنجليزي (entries_translations_fts) — vaulter / pole vaulter / pole vault
#   Q3: البحث بالكلمات المفتاحية (entries_fts) — زانة / وثب / قفز / عارضة
#   Q4: مقاييس اللغة (dictionary_id=151) — جذور: قفز / وثب / نزو / زون
stage2_evidence:
  per_lemma:
    - lemma: "قافز بالزانة"
      confirm:
        - text: "«فا vault. وبخاصة: لاعب في مباراة القفز العالي بالعصا.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«القفز العالي بالعصا (رب).»"
          source: "المورد الحديث (2008)"
          addition: "يُثبّت المورد الحديث أن 'القفز العالي بالعصا' هو المصطلح الرسمي الرائج لهذه الرياضة، وأن الرياضي الممارس لها يُوصف بـ'لاعب في مباراة القفز العالي بالعصا'؛ وهو دليل على ثبات العبارة الوصفية في الاستعمال المعاصر"

    - lemma: "وثاب"
      contradicts:
        - text: "«السَّرير الفِراش [في لغة حمير]»"
          source: "المعجم الوسيط"
          conflict: "وَثَّاب في المعجم الوسيط (مصدر OCR) يعني السرير أو الفراش في لهجة حمير، لا الرياضي القافز؛ وهذا الاشتراك اللفظي المُثبَّت في أرسخ معاجم الفصحى الحديثة يُعيق توظيفه مصطلحاً"
        - text: "«(الوثاب) السرير والفراش (في لغة حمير)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني 35)"
          conflict: "تكرار الدلالة ذاتها في مصدر مستقل يُرسّخ الاشتراك اللفظي ويجعل التوظيف الرياضي ملبِّساً"
      expands:
        - text: "«وَثَّاب: الكثير القفز سريع البلوغ إلى المجد والشرف وغيرهما، وسريع النهوض والقيام.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "تؤيّد هذه الدلالة (كثير القفز) توظيفه رياضياً، غير أن المعجم يستخدمه اسماً علماً (في سياق أسماء الأعلام) لا مصطلحاً عاماً"

    - lemma: "قافز الزانة"
      confirm:
        - text: "«قَافِز: من (ق ف ز) الواثب.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«الْقَافُ وَالْفَاءُ وَالزَّاءُ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى شُبَهِ الْوَثْبِ، وَالْآخَرُ عَلَى شَيْءٍ يُلْبَسُ. فَالْأَوَّلُ الْقَفَزَانُ: مَصْدَرُ قَفَزَ. وَيُقَالُ لِلضَّفَادِعِ: الْقَوَافِزُ.»"
          source: "مقاييس اللغة (ابن فارس)"
          addition: "يؤكد أصالة جذر (قفز) في الدلالة على الوثوب والارتفاع، وأن اسم الفاعل 'قافز' يحمل هذا المعنى الأصيل"

    - lemma: "واثب الزانة"
      expands:
        - text: "«الْوَاوُ وَالثَّاءُ وَالْبَاءُ يَدُلُّ فِي لُغَةِ الْعَرَبِ عَلَى الظَّفْرِ، إِلَّا فِي لُغَاتٍ مِنْ لُغَاتِ حِمْيَرَ فَإِنَّهُ بِخِلَافِ هَذَا. وَوَثَبَ مِنْ مَكَانِهِ: طَفَرَ.»"
          source: "مقاييس اللغة (ابن فارس)"
          addition: "يُثبّت أن جذر (وثب) أصيل في العربية الفصيحة بمعنى الطفر والارتفاع الحاد، وأن دلالته أعمق وأدق من (قفز) في وصف الوثوب العمودي المميَّز"

    - lemma: "نازٍ"
      expands:
        - text: "«النُّونُ وَالزَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ يَرْجِعُ إِلَى مَعْنًى وَاحِدٍ، هُوَ الْوَثَبَانُ وَالِارْتِفَاعُ وَالسُّمُوُّ. مِنْ ذَلِكَ النَّزْوِ. نَزَا يَنْزُو: وَثَبَ. وَنُزَاءُ الذَّكَرِ عَلَى أُنْثَاهُ. وَهُوَ يَنْزُو إِلَى كَذَا، إِذَا نَازَعَ إِلَيْهِ، كَأَنَّهُ سَمَا لَهُ. وَالتَّنَزِّي مِثْلُ النَّزْوِ.»"
          source: "مقاييس اللغة (ابن فارس)"
          addition: "الجذر (نزو) أصيل صحيح بمعنى الوثبان والارتفاع والسمو؛ 'نازٍ' اسم فاعل منه، ويُسوّغ إحياءه مجازاً، لكنه غير مُخصَّص بالقفز بالزانة"


