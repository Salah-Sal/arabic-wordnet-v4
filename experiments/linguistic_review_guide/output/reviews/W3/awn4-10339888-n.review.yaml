            الجذر (كثف) يدل على التراكم والتجمع والكثافة، وهو المعنى النقيض لجوهر التبسيطية الفنية التي تقوم على الاختزال والتقليل؛ فالتكثيفي سيعني (مَن يكثِّف ويُضخِّم) لا (مَن يُبسِّط ويُقلِّل).


