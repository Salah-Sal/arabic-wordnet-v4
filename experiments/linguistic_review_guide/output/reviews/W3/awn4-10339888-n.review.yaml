      evidence_status: "no_material_found"

    - lemma: "اخْتِزَالِيّ"
      contradicts:
        - text: >
            «اختزال: تمثيل لأي كلمة أو سلسلة من الكلمات باستخدام بعض الحروف الواردة فيها.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM، entry_id=495822"
          conflict: "المعنى المستقر لـ(الاختزال) في المعاجم العربية المتخصصة هو الاختصار الكتابي أو الاختزال الكيميائي أو الرياضي، لا الحدّ من العناصر الفنية؛ مما يُقيِّد دلالة (اختزالي) في مجالات أخرى غير التبسيطية الفنية."
        - text: >
            «خَزَلَ: الْخَاءُ وَالزَّاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْقِطَاعِ وَالضَّعْفِ. يُقَالُ خَزَلْتُ الشَّيْءَ: قَطَعْتُهُ. وَانْخَزَلَ فُلَانٌ: ضَعُفَ.»
          source: "مقاييس اللغة لابن فارس، dictionary_id=151"
          conflict: "الأصل الجذري (خزل) يدلّ على الانقطاع والضعف، وهو بعيد عن الدلالة الجمالية لمصطلح التبسيطية الفنية؛ فالمصطلح المشتق منه سيحمل إيحاءات انقطاعية سلبية غير ملائمة."

