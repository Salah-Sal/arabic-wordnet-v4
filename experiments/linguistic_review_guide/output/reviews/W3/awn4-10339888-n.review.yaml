stage1_review:
  assessment:
    concerns:
      - "اللمّة «تبسيطي» مكتوبة بدون تشكيل، وتحتاج إلى ضبط كامل: تَبْسِيطِيّ"
      - "اللمّة «فنان الحد الأدنى» عبارةٌ وصفية تركيبية لا تجتاز اختبار التثبيت المعجمي — يمكن إبدال (فنان) بـ(مصوِّر أو موسيقي) وتبقى العبارة صالحة كوصف، مما يدل على أنها ليست مصطلحاً مسكوكاً"
      - "التعريف العربي «مذهب التبسيطية الفني» فيه إشكال في الاتفاق النحوي: الصفة (الفني) مذكّرة والموصوف (التبسيطية) مؤنث، والأصح (الفنية) أو إعادة الصياغة إلى (في الفن)"
      - "لا شاهد معجمي كلاسيكي أو حديث على اللمّتين الموجودتين؛ ما يستوجب مزيداً من التمحيص"
    observations: >
      المجموعة الترادفية تُحيل إلى مفهوم وافد من الحداثة الغربية (minimalism) وهو مذهب فني يقوم على اختزال العناصر الجمالية إلى أدناها. الإشكال الرئيسي أن العربية لا تملك لهذا المفهوم مصطلحاً مستقراً في كتب الفن والنقد؛ فاللمّة (تبسيطي) مشتقة اشتقاقاً صحيحاً على وزن النسبة من مصدر صناعي (تبسيطية)، وهو نمط منتج في العربية المعاصرة (حداثي، واقعي، رمزي). أما (فنان الحد الأدنى) فعبارة شرحية تفتقر إلى التثبيت المعجمي الذي يشترطه المصطلح الناضج. ولم يُعثر في المراجع المعجمية المتاحة على أي من اللمّتين بوصفهما مُصطلحَيْن راسخَيْن.

  blind_candidates:
    - lemma: "تَقْلِيلِيّ"
      generation_method: ishtiqaq
      justification: >
        مشتق من المصدر (التقليل) على وزن النسبة (فَعْلِيّ)، جامع بين الاسمية والصفة، يُعبِّر عن المنتسب إلى مذهب تقليل العناصر وردِّها إلى الجوهر — وهو لبّ التبسيطية الفنية. الوزن منتج في العربية المعاصرة لأسماء أصحاب المذاهب الفكرية.
    - lemma: "اخْتِزَالِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى الاختزال (من خ-ز-ل)؛ الاختزال في النقد الفني يعني ردّ العمل إلى مكوناته الجوهرية الصارمة. الوزن (افتعال + نسبة) يُشير إلى الانتساب النشط إلى هذه الممارسة، مما يلائم وصف ممارس التبسيطية.
    - lemma: "مُزْهِد"
      generation_method: majaz
      justification: >
        إحياء لمعنى الزهد الجمالي — فاعل من (أزهد) الرباعي، أي من يُقِلّ ويتحاشى الترف والزيادة. وجه المجاز أن التبسيطي الفني يمارس نوعاً من الزهد في العناصر البصرية أو الصوتية. الصيغة تُوسِّع معنى المزهد الديني نحو دلالة جمالية.
    - lemma: "تَكْثِيفِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى التكثيف (من ك-ث-ف)؛ التكثيف في الخطاب النقدي العربي المعاصر يُستخدم لوصف تقليص العمل الفني إلى لبِّه ومُعظَمِه، ويوحي بتكثيف الدلالة في حيّز ضيِّق من العناصر.


stage2_evidence:
  per_lemma:
    - lemma: "تبسيطي"
      expands:
        - text: >
            «لحظة اختيار نظام تمثيلية في مختلف مستويات التحليل، وهي تبسيطية ووظيفية تطبق على البرمجة الزمنية في سرد معقد، كما أنها تبسيطية وجمالية في الأحداث الخطابية.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          addition: >
            يُثبت المعجم استخدام (تبسيطية) بوصفها صفة جمالية ولغوية في سياقات التحليل، مما يدعم جذر المفهوم الذي يُشتق منه (تبسيطي) كمصطلح للمنتسب إليه.

    - lemma: "فنان الحد الأدنى"
      expands:
        - text: >
            «المعتدل: من يدعو إلى الاقتصار على الحدّ الأدنى، أو إلى الاكتفاء بتحقيق الحدّ الأدنى من برنامج أو سلطات حزب إلخ.»
          source: "المورد الحديث (2008) — ARABTERM، entry_id=701407، ترجمة: minimalist"
          addition: >
            يكشف أن المرجع اللغوي الحديث يُترجم (minimalist) بـ(المعتدل: من يدعو إلى الاقتصار على الحد الأدنى) لا بـ(فنان الحد الأدنى)، وأن مصطلح (الحد الأدنى) في استخدامه السائد يرتبط بالسياسة والبرامج لا بالفن.
        - text: >
            «طراز الحد الأدنى: يشبه هذا النمط نمط التدقيق في اللغة في تدقيقه واعتماده على بنيات صارمة بواسطة مؤثرات صغيرة.»
          source: "مسرد صناعة النسيج — ALECSO (ARABTERM)، entry_id=369079، ترجمة: minimalism"
          addition: >
            يُثبت استخدام (طراز الحد الأدنى) = minimalism في المعاجم التقنية، مما يُشير إلى أن التركيب (الحد الأدنى) مقبول في هذا السياق، لكنه يرتبط بالطراز والنمط لا بالشخص الممارس.

