          conflict: "المزهد في المعجم الجغرافي اسم مكان (حصن في اليمن)، وهذا يُشكّل عائقاً أمام استخدامه مصطلحاً للشخص الممارس للتبسيطية الفنية."
        - text: >
            «وَهُوَ مُزْهِدٌ: قَلِيلُ الْمَالِ. وَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ: «أَفْضَلُ النَّاسِ مُؤْمِنٌ مُزْهِدٌ» وَهُوَ الْمُقِلُّ...»
