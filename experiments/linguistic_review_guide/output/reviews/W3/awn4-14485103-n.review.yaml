# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14485103-n
# comprehensiveness / fullness — الكمال على نطاق واسع
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «امتلاء» دلالته الأساسية حسّيّة/طبّيّة (الشِّبَع، امتلاء البدن) وليست دلالة الكمال المجرّد على نطاق واسع"
      - "التعريف العربي الحالي «الكمال على نطاق واسع» مقتضب جدّاً ولا يميّز المجموعة عن المجموعة الأمّ (تمام/كمال)"
      - "اللمّتان الحاليّتان لا تغطّيان جانب الاستيفاء والإتمام الذي يقابل fullness في الإنجليزية"
    observations: "المفهوم المستهدف هو صفة مجرّدة تدلّ على بلوغ الكمال في تغطية جميع الجوانب والتفاصيل. جذر ش م ل في العربية هو الأنسب لنقل دلالة الشمول والإحاطة الواسعة، بينما امتلاء يميل إلى الدلالة الحسّيّة. يُحتاج إلى إعادة تقييم اللمّات وإضافة ما يغطّي جانب الاستيفاء."

  blind_candidates:
    - lemma: "شُمُولِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من شُمُول (ش م ل)، يدلّ على صفة الاستيعاب الواسع لجميع الجوانب، وهو الأقرب لمعنى comprehensiveness"
    - lemma: "اسْتِيفَاء"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من وَفَى (و ف ي)، أصله إكمال وإتمام، ويدلّ على بلوغ التمام والكمال دون إبقاء شيء، يقابل fullness/exhaustiveness"
    - lemma: "إِحَاطَة"
      generation_method: ishtiqaq
      justification: "مصدر من أَحَاطَ (ح و ط)، يدلّ على الإدراك الشامل والاستدارة بالشيء من جميع جوانبه"
    - lemma: "اسْتِيعَاب"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من وَعَبَ (و ع ب)، أصله أخذ الشيء كلّه واستيظافه، يدلّ على الاحتواء الكامل"


stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "امتلاء"
      contradicts:
        - text: "«الامتلاء: هو أن يمتلئ البدن من خلط من الأخلاط الأربعة ويشرف الإنسان على العلّة، وقد يطلق الامتلاء على رداءة الأخلاط في الكيفية. وأما الامتلاء من الطعام والشراب فقلّ إطلاقه في كلام الأطباء بهذا المعنى كذا في بحر الجواهر. والامتلاء عند المنجّمين عبارة عن الاستقبال كما في كفاية التعليم.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الدلالة الاصطلاحية طبّيّة (شِبَع/تُخَمة) أو فلكيّة (استقبال)، لا علاقة لها بالكمال المجرّد"
      expands:
        - text: "«وإذا هُمِزَ دلّ على المساواة والكمال في الشيء. ومَلَأْتُ الشيءَ أمْلَؤُهُ مَلْئاً. والمِلْءُ: الاسم للمقدار الذي يُملأ؛ وسُمّي لأنه مساوٍ لوعائه في قدره.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر م ل أ يحمل دلالة المساواة والكمال أصلاً، لكنّ الاستعمال الاصطلاحي لـ«امتلاء» انحصر في الحسّيّ"

    - lemma: "شمولية"
      confirm:
        - text: "«التطرق إلى كل الجوانب التي تتعلق بموضوع معين.»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«صفة تنعت بها الدراسة أو المتن الذي يضع في الحسبان جميع الوقائع اللغوية قيد الدرس.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«(شَمَلَ) الشين والميم واللام أصلان منقاسان مطّردان... فالأوّل يدلّ على دوران الشيء بالشيء وأخذه إيّاه من جوانبه. من ذلك قولهم: شمِلهم الأمرُ، إذا عمّهم. وهذا أمرٌ شامل.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ش م ل يؤصّل دلالة العموم والإحاطة من جميع الجوانب"

    # ── المرشحات ──
    - lemma: "اسْتِيفَاء"
      confirm:
        - text: "«استيفاء — fullness»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
        - text: "«الاستيفاء: هو عند البلغاء أن يسعى الشاعر أقصى جهده في المدح والوصف حتى يبلغ الغاية التي ليس وراءها غاية. وهذا عين البلاغة.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«(وَفَى) الواو والفاء والحرف المعتلّ: كلمة تدلّ على إكمالٍ وإتمام. منه الوفاء: إتمام العهد وإكمال الشرط... وتوفّيت الشيء واستوفيته؛ إذا أخذته كلّه حتى لم تترك منه شيئاً.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر و ف ي يؤصّل دلالة الإكمال والإتمام دون إبقاء شيء"

    - lemma: "إِحَاطَة"
      contradicts:
        - text: "«الإحاطة: إدراك الشيء بكماله ظاهراً وباطناً.»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "الدلالة معرفيّة/إدراكيّة (إحاطة عِلْميّة)، وليست صفة مجرّدة للكمال الشامل"
        - text: "«وقال ابن الكمال: الإحاطة بالشيء علماً أن يعلم وجوده وجنسه وقدره وصفته وكيفيته وغرضه المقصود به وما يكون به ومنه وعليه، وذلك لا يكون إلا لله تعالى.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الإحاطة متعدّية بالباء (إحاطة بـ) وتدلّ على الإدراك والعلم لا على صفة الكمال ذاتها"

    - lemma: "اسْتِيعَاب"
      expands:
        - text: "«الاستيعاب: أخذ الشيء كلّه، يقال وعبته وعباً وأوعبته إيعاباً، واستوعبته، كلّها بمعنى. وفي التهذيب: الوعب إيعابك الشيء في الشيء حتى تأتي عليه كلّه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الاستيعاب يدلّ على أخذ الشيء كلّه، وهو قريب من المعنى المطلوب"
        - text: "«الاستيعاب: هو الاستيفاء والأخذ أجمعَ.»"
          source: "التعريفات الفقهية للبركتي"
          addition: "ترادف صريح بين الاستيعاب والاستيفاء"
      contradicts:
        - text: "«استيعاب — assimilation»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "في الاصطلاح اللساني الحديث استُعمل بمعنى التمثّل/الاندماج لا بمعنى الكمال الشامل"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِمْتِلَاء"
      decision: removed
      decision_reason: "دلالة «الامتلاء» الاصطلاحية انحصرت في المجال الحسّيّ والطبّيّ (شِبَع البدن، التُّخَمة) كما نصّ التهانوي، ولا تُستعمل في العربية المعاصرة بمعنى الكمال المجرّد على نطاق واسع. وجود الجذر م ل أ بمعنى الكمال في مقاييس اللغة لا يكفي لتسويغ استعمال المصدر «امتلاء» في هذا السياق الدلالي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "شُمُولِيَّة"
      decision: confirmed
      decision_reason: "مصدر صناعي من شُمُول، جذر ش م ل الذي يدلّ على «دوران الشيء بالشيء وأخذه إيّاه من جوانبه» (ابن فارس). مؤيَّد بتعريفات ALECSO المتعدّدة التي تربطه صراحةً بالتطرّق إلى جميع الجوانب. اللفظ شائع في الاستعمال المعاصر الفصيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على البُعد المكاني/النطاقي: اتّساع التغطية لتشمل جميع الجوانب والعناصر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شُمُولِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "شُمُولِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مطابق للّمّة الموجودة، لا حاجة لتكراره"

    - lemma: "اسْتِيفَاء"
      source: stage1
      decision: confirmed
      decision_reason: "جذر و ف ي يدلّ على «إكمال وإتمام» (ابن فارس)، واستوفيته = أخذته كلّه حتى لم أترك منه شيئاً. ترجمته في ARABTERM بـ fullness وExhaustive. يُضيف بُعد الإتمام والاستقصاء الذي يُكمّل دلالة الشمولية. الوزن استفعال يناسب طلب التمام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على بُعد العُمق والإتمام: بلوغ الغاية القصوى في الكمال دون إبقاء شيء ناقصاً"
      actions:
        - command: create_entry
          params:
            lemma: "اسْتِيفَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "إِحَاطَة"
      source: stage1
      decision: removed
      decision_reason: "الإحاطة في الاستعمال الاصطلاحي الراسخ (الجرجاني، المناوي، البركتي) تدلّ على الإدراك المعرفي الشامل لا على صفة الكمال المجرّدة. وهي متعدّية بالباء (إحاطة بالشيء)، ممّا يجعلها فعلاً معرفيّاً لا وصفاً لحالة."

    - lemma: "اسْتِيعَاب"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ أصله «أخذ الشيء كلّه» (المناوي)، فإنّ الاستعمال المعاصر غلب عليه معنى الفهم والإدراك العقلي أو التمثّل (assimilation) في المصطلحيّات الحديثة، ممّا يُوقع في لَبس دلالي. البركتي نفسه ربطه بالاستيفاء، فالاستيفاء أَوْلى لخلوّه من هذا اللَّبس."


