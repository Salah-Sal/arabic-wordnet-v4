# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (مهندس طرق) مُدرجة بدون تشكيل كامل"
      - "التعريف الحالي يكرر لفظ «الطرق» مرتين في صياغة مُقتضبة، وهو أقرب إلى ترجمة آلية حرفية من الإنجليزية منه إلى تأليف معجمي أصيل"
      - "التعريف لا يذكر «التخطيط» (layout/planning) المتضمَّن في دلالة الاختصاص الهندسي الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط لمفهوم تقني محدد، مما قد يُفقد الثراء المعجمي"
    observations: >
      المجموعة تُعرِّف اختصاصًا هندسيًا دقيقًا هو «مهندس الطرق»، وهو تخصص فرعي من
      الهندسة المدنية (المجموعة الأم awn4-09943998-n). المفهوم واضح الدلالة في العربية،
      والتعبير عنه بالتركيب الإضافي (مهندس + طرق) سائغ قياسًا على ما استقر في المعجمية
      العربية التقنية الحديثة (مهندس حفر، مهندس مقيم، مهندس استشاري...).
      غير أن غياب البديل المفردي الصحيح يجعل التعريف قائمًا على المركّب فحسب.

  blind_candidates:
    - lemma: "مُهَنْدِسُ الطُّرُق"
      generation_method: tarkib
      justification: >
        تركيب إضافي قياسي (مهندس + الطرق)، يُشير بدقة إلى المختص بإنشاء الطرق وتصميمها.
        الصيغة بـ«ال» تجعله اسمًا للنوع المحدَّد. يستقيم مع نمط: مهندس المياه،
        مهندس المنشآت، مهندس الجسور.

    - lemma: "مُخَطِّطُ الطُّرُق"
      generation_method: tarkib
      justification: >
        تركيب إضافي من خطَّط (وزن فعَّل بمعنى التصميم والتخطيط) + الطرق. يُبرز الجانب
        التصميمي والتخطيطي في الاختصاص. مُخَطِّط على وزن مُفَعِّل اسم فاعل من خطّط.

    - lemma: "مُعَبِّدُ الطُّرُق"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر عبد (عبَّد الطريقَ: سلكه وذلّله للمرور، والطريق المعبَّد هو
        الممهَّد المُعَدُّ للسير). في العربية الحديثة «التعبيد» يعني الرصف والتمهيد.
        مُعَبِّد الطرق: من يُعِدّ الطرق ويُمهِّدها. وزن مُفَعِّل اسم فاعل قياسي.

    - lemma: "مُرَاصِفُ الطُّرُق"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر رصف (رصَف الحجارةَ: ضمَّ بعضها إلى بعض). الرصف في عربية
        الهندسة هو تبليط الطريق وفرش سطحه. مُرَاصِف على وزن مُفَاعِل، اسم فاعل
        يُشير إلى المختص بعمليات الرصف والتبليط.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  # ملاحظة منهجية: أُجريت الاستعلامات التالية على قاعدة البيانات:
  # (١) مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات)
  # (٢) جسر إنجليزي: "highway engineer", "road engineer", "civil engineer"
  # (٣) FTS عربي: "مهندس طرق", "مهندس الطرق", "هندسة الطرق", "مهندس مدني"
  # (٤) مقاييس اللغة (dictionary_id=151): جذور هندس، طرق، عبد، رصف
  # الميزانية المُستخدمة: ٤ استعلامات

  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "مهندس طرق"
      evidence_status: "no_material_found"
      # لم يُعثر على أي مدخل معجمي بالمطابقة الدقيقة لـ«مهندس طرق» أو «مهندس الطرق»
      # في أي من مصادر قاعدة البيانات (ocr / hawramani / arabterm).
      # الجسر الإنجليزي لـ "highway engineer" / "road engineer" لم يُسفر عن نتائج.
      # المرجع الأقرب: «المهندس المدني» من المورد الحديث (2008) translation_en:"civil engineer"
      # وهو المصطلح الأعمّ (المجموعة الأم) لا المصطلح المبحوث عنه.

    # ── المرشح ١ ──
    - lemma: "مُهَنْدِسُ الطُّرُق"
      evidence_status: "no_material_found"
      # الصيغة بـ«ال» لم تُوجَد في قاعدة البيانات. نتائج ARABTERM تحتوي على طرق
      # من باب: طريق سريع، طريق رئيسي، مواصفات تصميم الطرق — لكن لا مدخل للمهندس.

    # ── المرشح ٢ ──
    - lemma: "مُخَطِّطُ الطُّرُق"
      evidence_status: "no_material_found"

    # ── المرشح ٣ ──
    - lemma: "مُعَبِّدُ الطُّرُق"
      expands:
        - text: >
            «وَمِنَ الْبَابِ: الطَّرِيقُ الْمُعَبَّدُ، وَهُوَ الْمَسْلُوكُ الْمُذَلَّلُ»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            يُثبت أن «عبَّد الطريق» من الاستعمال العربي الأصيل بمعنى تذليله وتمهيده
            للسير، وهو أصل دلالي للتعبيد الحديث بمعنى الرصف والتبليط. لكن المدخل
            يصف الطريق المُعبَّد (نعت للطريق)، لا مُعَبِّد الطرق (صاحب المهنة).
        - text: >
            «رصف، تعبيد» — translation_en: "pavement; paving"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.٢ (arabterm)"
          addition: >
            يُؤكد أن «التعبيد» مصطلح تقني معتمد في العربية الحديثة بمعنى الرصف،
            وهو العملية التي يُشرف عليها مُعَبِّد الطرق. لكن المدخل يُعبِّر عن
            العملية لا الشخص.

    # ── المرشح ٤ ──
    - lemma: "مُرَاصِفُ الطُّرُق"
      expands:
        - text: >
            «الرَّاءُ وَالصَّادُ وَالْفَاءُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ مُطَّرِدٌ، وَهُوَ
            ضَمُّ الشَّيْءِ بَعْضِهِ إِلَى بَعْضٍ. فَالرَّصْفُ: ضَمُّ الْحِجَارَةِ
            بَعْضِهَا إِلَى بَعْضٍ. وَمِنْ ذَلِكَ رَصْفُ الصَّخْرِ فِي الْبِنَاءِ.»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            يُثبت أصالة الجذر رصف بمعنى فرش الحجارة وضم بعضها ببعض، وهو أصل
            الرصف الهندسي الحديث (تبليط الطريق). لكن المدخل يصف العملية لا الشخص،
            وصيغة «مُرَاصِف» على وزن مُفَاعِل قياسية اشتقاقًا.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "مهندس طرق"
      decision: confirmed
      decision_reason: >
        المركّب الإضافي «مهندس طرق» مصطلح تقني مستقر في العربية الهندسية الحديثة،
        يجري على سنن «مهندس حفر» (drilling engineer) و«مهندس مقيم» (resident engineer)
        التي وثّقتها قواعد المصطلحات العربية (ARABTERM، المعجم الموحد للهندسة المدنية).
        وإن لم يرد مستقلًا في مدخل معجمي، فإنه شفاف الدلالة ومطّرد البنية. الصيغة
        بدون «ال» في المضاف إليه هي الأصح للدلالة على التخصص النوعي (نكرة المجال).
        يستلزم إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُميّز هذا المهندس المدني بكون تخصصه منصبًّا
        على الطرق والطرق السريعة تصميمًا وإنشاءً، على خلاف المهندس المدني العام
        الذي يشمل اختصاصه الجسور والموانئ والمنشآت وسائر الأشغال العامة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُهَنْدِسُ طُرُق"

    # ── المرشح ١ ──
    - lemma: "مُهَنْدِسُ الطُّرُق"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة بـ«ال» (مهندس الطرق) مرادفة شكلية للمّة الموجودة (مهندس طرق)؛ الفرق
        الوحيد هو التعريف الذي لا يُغيِّر الدلالة المصطلحية. في اصطلاحات العربية
        التقنية تُفضَّل الصيغة النكرة في الإضافة للدلالة على التخصص النوعي دون تعريف.
        إضافتها تُكرِّر ما هو موجود بلا قيمة مضافة.

    # ── المرشح ٢ ──
    - lemma: "مُخَطِّطُ الطُّرُق"
      source: stage1
      decision: removed
      decision_reason: >
        «مُخَطِّط الطرق» يُشير إلى جانب التخطيط والتصميم وحده، ولا يشمل جانب البناء
        والإنشاء المنصوص عليه في تعريف المجموعة. كما أن «مخطط» يُستخدم في العربية
        للمخطط العمراني (urban planner) بعمومه، مما يُولِّد لبسًا مع اختصاصات
        أخرى. اختبار الاستبدال: مُخَطِّط الطرق قد يُحيل إلى من يُخطّط مسارات
        الطرق دون إشراف على إنشائها.

    # ── المرشح ٣ ──
    - lemma: "مُعَبِّدُ الطُّرُق"
      source: stage1
      decision: removed
      decision_reason: >
        «مُعَبِّد» يدلّ في العربية الأصيلة على تذليل الطريق وسلوكه (الطريق المعبَّد =
        المسلوك المذلَّل)، وفي الاستعمال الحديث يُحيل إلى عامل الرصف والتبليط
        الفيزيائي لا إلى المهندس المتخصص في التصميم والبناء. انتقال المعنى من
        المهندس إلى العامل يُوقع في التشويه الدلالي. فضلًا عن ذلك لم يرد المصطلح
        في أي قاعدة مصطلحات هندسية معتمدة بهذه الدلالة.

    # ── المرشح ٤ ──
    - lemma: "مُرَاصِفُ الطُّرُق"
      source: stage1
      decision: removed
      decision_reason: >
        «مُرَاصِف» يدلّ على القائم بعملية الرصف (فرش الحجارة والتبليط الفيزيائي)،
        وهو الحِرفي العامل لا المهندس المتخصص في التصميم والإنشاء. تحقق بوابة
        جودة المصطلح يكشف غياب الاطراد في الاستعمال التقني، وعدم وروده في معاجم
        الهندسة المدنية المتاحة. اختبار الاستبدال: «مرصوف» و«رصّاف» أقرب إلى
        وصف العملية من إلى وصف الاختصاص الهندسي.


