stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - المصطلح جغرافي متخصص قد لا يرد في المعاجم اللغوية العامة ولكن تواتره في المعاجم الجغرافية والترجمات الرسمية عالٍ.
    observations: "المصطلح عبارة عن اسم علم مركب لكيان جغرافي (خليج). الترجمة المعتمدة هي 'خليج غالفيستون' بتعريب الاسم العلم 'Galveston'."
  blind_candidates:
    - lemma: "خَلِيجُ غَالْفِسْتُون"
      generation_method: tarkib
      justification: "التركيب الإضافي أو الوصفي الأكثر شيوعاً لترجمة 'Bay' متبوعاً باسم العلم."
    - lemma: "جَوْنُ غَالْفِسْتُون"
      generation_method: tarkib
      justification: "استخدام كلمة 'جون' المقابلة لـ 'Bay' في المعاجم الجغرافية الدقيقة."
    - lemma: "خَلِيجَةُ غَالْفِسْتُون"
      generation_method: ishtiqaq
      justification: "اشتقاق صيغة التصغير/التأنيث 'خليجة' للتعبير عن 'Bay' تمييزاً لها عن 'Gulf' (خليج)."
    - lemma: "غَالْفِسْتُون"
      generation_method: taarib
      justification: "استخدام اسم العلم منفرداً للإشارة إلى الكيان المائي في السياقات الجغرافية."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيج غَالْفِسْتُون"
      evidence_status: "no_material_found"
    - lemma: "جَوْن غَالْفِسْتُون"
      evidence_status: "no_material_found"
    - lemma: "تِكْسَاس"
      confirm:
        - text: "إحدى الولايات المتحدة الأمريكية , مساحتها ٦٩٢٣٠٨ كم٢ يزيد عَدَدُ سُكَّانِها على ثمانية ملايين نسمة , عاصمتها أوستين (Osten)"
          source: "المعجم الكبير"
    - lemma: "خَلِيج المكسيك"
      confirm:
        - text: "خليج المكسيك"
          source: "المَكنَز الزراعي متعدد اللغات"
    - lemma: "خَلِيج"
      confirm:
        - text: "وَالْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ."
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "خليج غالفيستون"
      decision: confirmed
      decision_reason: "الاسم الرسمي والمتعارف عليه جغرافياً لهذا الكيان المائي في تكساس."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ غَالْفِسْتُون"
    - lemma: "خَلِيجُ غَالْفِسْتُون"
      source: stage1
      decision: confirmed
      decision_reason: "تم تأكيده كنسخة مشكلة من اللمة الموجودة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

stage4_content:
  definition:
    current: "ذراع من خليج المكسيك في تكساس إلى الجنوب من هيوستن"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق جغرافياً لكن يحتاج لصياغة معجمية أكثر سلاسة."
    authored:
      - type: encyclopedic
        text: "ذراعٌ مائيٌّ من خَليجِ المَكْسيكِ، يَقَعُ في وِلَايَةِ تِكْسَاس الأمريكيَّةِ، إلى الجَنوبِ من مَدينَةِ هيوسْتُن."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09309224-n"
          definition_index: 0
          text: "ذراعٌ مائيٌّ من خَليجِ المَكْسيكِ، يَقَعُ في وِلَايَةِ تِكْسَاس الأمريكيَّةِ، إلى الجَنوبِ من مَدينَةِ هيوسْتُن."
  examples:
    per_lemma:
      - lemma: "خَلِيجُ غَالْفِسْتُون"
        examples:
          - text: "يُعَدُّ خَلِيجُ غَالْفِسْتُون مَمَرًّا مَائِيًّا حَيَوِيًّا لِلتِّجَارَةِ فِي وِلَايَةِ تِكْسَاس."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-09309224-n"
          text: "تَمتدُّ مَوانِئُ عَدِيدَةٌ على طُولِ شَواطِئ خَلِيج غَالْفِسْتُون."

