stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدو ترجمة حرفية نوعاً ما (كون الشيء ثنائياً) ويجمع بين معنيين: الحالة (الثنائية) والعملية (الانقسام أو التصنيف)."
    observations: "المجموعة الترادفية تغطي مفهومين مترابطين في الإنجليزية (duality و dichotomy). يمكن التعبير عن الأول بالثنائية أو الازدواجية، وعن الثاني بالانقسام الثنائي أو التقسيم الثنائي."
  blind_candidates:
    - lemma: "ثُنَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من ثنائي، يعبر عن حالة كون الشيء مكوناً من شقين أو قسمين."
    - lemma: "اِزْدِوَاجِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من الازدواج، يدل على اقتران شيئين أو وجود شقين للشيء."
    - lemma: "اِنْقِسَامٌ ثُنَائِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يدل على التشعب أو التصنيف إلى قسمين اثنين."
    - lemma: "تَقْسِيمٌ ثُنَائِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يركز على فعل التصنيف والفرز إلى فئتين متقابلتين."

stage2_evidence:
  per_lemma:
    - lemma: "انقسام ثنائي"
      confirm:
        - text: "binary division : انقسام ثنائي"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "ثنائية"
      confirm:
        - text: "الثُّنائية: كون الشيء ثُنائيًّا"
          source: "المورد الحديث (2008)"
        - text: "مَذْهَبٌ يَرُدُّ تَفْسِيرَ العالمِ إلى مَبْدَأَيْنِ مُتَقابِلَيْنِ كَالخَيْرِ والشَّرِّ , والنَّفْسِ والجِسْمِ"
          source: "المعجم الكبير"
    - lemma: "اِزْدِوَاجِيَّة"
      confirm:
        - text: "ثنائيّة؛ ازدواجية. (duality)"
          source: "المورد الحديث (2008)"
    - lemma: "تَقْسِيمٌ ثُنَائِيّ"
      confirm:
        - text: "تقسيم ثنائي : dichotomy"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"

stage3_analysis:
  per_lemma:
    - lemma: "انقسام ثنائي"
      decision: confirmed
      decision_reason: "مصطلح مركب دقيق للتعبير عن التشعب والانقسام إلى جزأين متقابلين (dichotomy)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْقِسَامٌ ثُنَائِيّ"
    - lemma: "ثنائية"
      decision: confirmed
      decision_reason: "مصطلح فصيح شائع ومثبت معجمياً للتعبير عن الحالة المكونة من جزأين (duality)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
