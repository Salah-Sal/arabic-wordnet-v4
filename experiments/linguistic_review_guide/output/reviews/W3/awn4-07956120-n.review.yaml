      - lemma: "تَقْسِيمٌ ثُنَائِيّ"
        examples:
          - text: "لَجَأَ البَاحِثُ إِلَى تَقْسِيمٍ ثُنَائِيٍّ لِتَبْسِيطِ دِرَاسَةِ الظَّوَاهِرِ المُعَقَّدَةِ."
