    - lemma: "تَقْسِيمٌ ثُنَائِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق للتعبير عن عملية التصنيف والفرز إلى فئتين، وهو المعنى الثاني في المجموعة."
      evidence_assessment:
        case: confirm_only
