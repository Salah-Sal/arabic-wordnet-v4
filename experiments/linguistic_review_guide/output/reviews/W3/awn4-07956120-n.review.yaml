            type: usage
      - lemma: "ثنائية"
        examples:
          - text: "تَطْرَحُ الرِّوَايَةُ ثُنَائِيَّةَ الخَيْرِ وَالشَّرِّ بِشَكْلٍ عَمِيقٍ."
            type: usage
      - lemma: "اِزْدِوَاجِيَّة"
        examples:
          - text: "يُعَانِي المُجْتَمَعُ مِنْ اِزْدِوَاجِيَّةٍ فِي المَعَايِيرِ المُتَّبَعَةِ."
