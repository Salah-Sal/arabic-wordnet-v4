stage4_content:
  definition:
    current: "كون الشيء ثنائياً؛ تصنيف إلى جزأين أو فئتين فرعيتين متضادتين"
    assessment:
      decision: revise
      reason: "الصياغة الحالية ركيكة وتمثل ترجمة حرفية غير سلسة. يمكن دمج المعنيين (الحالة والعملية) بأسلوب معجمي عربي أوضح."
    authored:
      - type: linguistic
        text: "حَالَةُ كَوْنِ الشَّيْءِ مُكَوَّنًا مِنْ جُزْأَيْنِ أَو شِقَّيْنِ مُتَقَابِلَيْنِ، ويُطْلَقُ أَيْضاً عَلَى التَّصْنِيفِ الَّذِي يُقَسِّمُ الشَّيْءَ إِلَى فِئَتَيْنِ مُتَضَادَّتَيْنِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07956120-n", definition_index: 0, text: "حَالَةُ كَوْنِ الشَّيْءِ مُكَوَّنًا مِنْ جُزْأَيْنِ أَو شِقَّيْنِ مُتَقَابِلَيْنِ، ويُطْلَقُ أَيْضاً عَلَى التَّصْنِيفِ الَّذِي يُقَسِّمُ الشَّيْءَ إِلَى فِئَتَيْنِ مُتَضَادَّتَيْنِ."}

