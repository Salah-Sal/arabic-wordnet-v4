# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-10969184-n  |  ILI: i94995  |  POS: n
# الموضوع: توماس أَلفَا إِدِيسُون — المخترع الأمريكي (1847-1931)
# تاريخ المراجعة: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة 'إديسون' خالية من التشكيل — تحتاج إلى ضبط كامل بالحركات"
      - "اللمّة 'توماس إديسون' خالية من التشكيل — تحتاج إلى ضبط كامل"
      - "التعريف العربي الحالي يذكر 'السينماتوجراف' في حين أن المقابل الإنجليزي هو Kinetoscope (الكينيتوسكوب)؛ وهذان جهازان مختلفان: الكينيتوسكوب اختراع إديسون، أما السينيماتوغراف فهو اختراع الأخوين لوميير"
      - "مقابل 'Thomas Alva Edison' الإنجليزي غائب من اللمّات العربية"
    observations: >
      هذه المجموعة تخصّ اسمَ عَلَم لشخص تاريخي بعينه (المخترع الأمريكي توماس إديسون، 1847-1931م).
      يندرج الاسم في باب الأعلام الأعجمية المعرَّبة صوتياً، فلا سبيل إلى تعريبه بالاشتقاق أو المجاز
      الاصطلاحي. وحيث إن اللمّات الإنجليزية ثلاث (Edison / Thomas Edison / Thomas Alva Edison)
      فينبغي أن تقابلها ثلاث لمّات عربية متوازية، غير أن اللمّات العربية الحالية قاصرة على اثنتين.
      وقد كشفت مراجعة التعريف عن خطأ مصطلحي في ترجمة «Kinetoscope» بـ«السينماتوجراف».

  blind_candidates:
    # ١ — الاسم المختصر (اللقب العائلي فحسب) — الأشيع في الاستخدام العربي
    - lemma: "إِدِيسُون"
      generation_method: taarib
      justification: >
        تعريب صوتي مباشر للقب العائلي Edison؛ هو الشكل الأكثر تداولاً في الصحافة والموسوعات العربية
        للإشارة إلى المخترع. القاعدة: (إ) لحرف E + (دِي) لـ di + (سُون) لـ son.

    # ٢ — الاسم الأول مع اللقب — الصيغة الأكثر رسمية في الكتابة العربية
    - lemma: "تُومَاس إِدِيسُون"
      generation_method: taarib
      justification: >
        تعريب صوتي مزدوج: (تُومَاس) لـ Thomas + (إِدِيسُون) لـ Edison. هذه الصيغة شائعة في المصادر
        الأكاديمية والموسوعية العربية عند الحاجة إلى التمييز عن مجرد اللقب.

    # ٣ — الاسم الرسمي الكامل (مع الاسم الأوسط) — الأدق في السياق الموسوعي
    - lemma: "تُومَاس أَلْفَا إِدِيسُون"
      generation_method: taarib
      justification: >
        الاسم الرسمي الثلاثي الكامل: Thomas Alva Edison. يُستخدم في المراجع الموسوعية الرسمية
        والوثائق التاريخية لتمييز الشخص عن سواه بصورة قاطعة. (أَلْفَا) تعريب لـ Alva.

    # ٤ — لقب عربي توصيفي (مجاز) — محاولة إيجاد مقابل عربي للقبه الشهير
    - lemma: "سَاحِرُ مِنْلُو بَارْك"
      generation_method: majaz
      justification: >
        ترجمة اللقب الشهير «Wizard of Menlo Park» الذي أُطلق على إديسون في عصره، مستعيرًا من دلالة
        السحر والإعجاز. غير أن هذا التعبير مركب وصفي إضافي ولا يُشكّل وحدة معجمية مسكوكة ثابتة في
        العربية؛ فهو عبارة توصيفية لا مصطلح. يُذكر كمحاولة ثم سيُستبعد في التحليل.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات قاعدة البيانات المنفَّذة:
# [١] مطابقة دقيقة دفعية: headword_norm IN (اديسون, الاديسون, توماس اديسون, ...)
# [٢] جسر إنجليزي: translation_en:"Edison" OR "Thomas Edison" OR "Thomas Alva Edison"
# [٣] FTS عربي: "اديسون" OR "اديسن" OR "فونوغراف" OR "مصباح كهربائي"
# [٤] تحقق من المرشحين: headword_norm IN (توماس الفا اديسون, ابو المصباح, ساحر منلو...)
# النتيجة الإجمالية: لا مدخل معجمي في أي قاموس عربي للاسم العَلَم إديسون بوصفه شخصاً
stage2_evidence:

  per_lemma:

    - lemma: "إديسون"
      expands:
        - text: "«قاعدة اديسون» [Edison screw cap] — مصطلح كهربائي يُشير إلى قاعدة المصباح ذات اللولب التي ابتكرها إديسون"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1: طباعة - كهرباء (1996)"
          addition: "يُثبت أن اسم إديسون راسخ في المعجمية التقنية العربية كمرجع اختراعي، وإن كان المدخل تقنياً لا تعريفياً"
        - text: "«تأثير <أديسون>» [Edison effect] — ظاهرة فيزيائية اكتُشفت في مصباح إديسون وأُسِّست عليها صناعة الإلكترون"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "يُؤكد ربط اللمّة بالسياق الإنجليزي Edison في المعجمية العربية الحديثة"
      # ملاحظة: لا مدخل مستقل للاسم العَلَم إديسون (المخترع) في أي قاموس كلاسيكي أو حديث مُفهرَس

    - lemma: "توماس إديسون"
      evidence_status: "no_material_found"
      # الشرح: لا مدخل لـ«توماس إديسون» بوصفه وحدة معجمية في قاعدة البيانات المستعلَمة

    # ── المرشّحات من المرحلة ١ ──

    - lemma: "إِدِيسُون"
      expands:
        - text: "«قاعدة اديسون» [Edison screw cap]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1 (1996)"
          addition: "يُعزز اعتماد الشكل (اديسون/إديسون) للتعبير عن انتساب الاختراعات إلى صاحبها"
      # يُطابق في جوهره «إديسون» الموجودة

    - lemma: "تُومَاس إِدِيسُون"
      evidence_status: "no_material_found"

    - lemma: "تُومَاس أَلْفَا إِدِيسُون"
      evidence_status: "no_material_found"

    - lemma: "سَاحِرُ مِنْلُو بَارْك"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "إديسون"
      decision: confirmed
      decision_reason: >
        تعريب صوتي مستقرّ للقب العائلي Edison، شائع في الاستخدام العربي الصحفي والموسوعي.
        اللفظ مُقبَل صرفياً: يقبل الـ التعريف (الإديسون)، والنسبة (الإديسوني)، كما نصّت عليه
        مصادر المعجمية التقنية العربية («قاعدة اديسون»، «تأثير أديسون»). يحتاج فقط إلى ضبط
        تشكيلي كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      morphological_check:
        pos_fit: proper_noun
        note: "اسم علم أعجمي معرَّب صوتياً؛ لا جذر عربي ولا وزن صرفي"
      borrowing_check:
        type: taarib
        verdict: مقبول
        note: "تعريب لفظي للقب الأجنبي Edison؛ مُستعمَل في المعجمية العربية الرسمية"
      quality_gate:
        ittiraad: "التعريب متسق في المصادر العربية الحديثة"
        yusr_tadawul: "قصير أحادي الكلمة — سهل التداول"
        mulaama: "ملائم لسياق الأعلام الأجنبية"
        itar_turathi: "لا يُطبَّق — اسم علم أعجمي"
        itar_arabi: "لا يُطبَّق — لا بديل عربي متاح"
        ishtiqqiyya: "لا تُطبَّق — ليس اشتقاقاً"
      nuance_differentiation: >
        الاسم المختصر (اللقب العائلي فحسب)؛ يُستخدم في السياقات الصحفية والمختصرة والمألوفة
        حين يكون السياق كافياً لتحديد الشخص دون ذكر الاسم الأول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِدِيسُون"

    - lemma: "توماس إديسون"
      decision: confirmed
      decision_reason: >
        الصيغة الأكثر شيوعاً في المصادر العربية الأكاديمية والموسوعية للإحالة إلى المخترع.
        مركّب من الاسم الأول (تُومَاس) واللقب العائلي (إِدِيسُون). يجتاز اختبار التثبيت
        المعجمي بوصفه وحدة اسمية علمية ثابتة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        note: "مركّب إضافي: اسم + لقب عائلي — بنية الأعلام الغربية المعرَّبة"
      morphological_check:
        pos_fit: proper_noun
        note: "مركّب اسمي علمي ثنائي، معرَّب صوتياً"
      nuance_differentiation: >
        الصيغة الثنائية (الاسم الأول + اللقب)؛ هي الصيغة الرسمية المعتادة في التعريف الكامل
        للشخص، تتجاوز الإيجاز المحض لـ«إديسون» دون الثقل الموسوعي لذكر الاسم الأوسط.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تُومَاس إِدِيسُون"

    # ── مرشّحات المرحلة ١ ──

    - lemma: "تُومَاس أَلْفَا إِدِيسُون"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الثلاثي الكامل لـ Thomas Alva Edison؛ يُقابل اللمّة الإنجليزية الثالثة
        «Thomas Alva Edison» الغائبة من اللمّات العربية الحالية. يُستخدم في الموسوعات العربية
        الرسمية والسياقات التاريخية القانونية للتمييز الدقيق. اللمّة مركّبة ثلاثية المكوّنات
        وثابتة كوحدة اسمية علمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        note: "مركّب ثلاثي: اسم أول + اسم أوسط + لقب عائلي — نمط الأعلام الغربية الثلاثية"
      morphological_check:
        pos_fit: proper_noun
      borrowing_check:
        type: taarib
        verdict: مقبول
      nuance_differentiation: >
        الصيغة الثلاثية الرسمية الكاملة؛ تُستخدم في السياقات التوثيقية والموسوعية حين يُراد
        تحديد الشخص بأكمل صوره وأدقّها، وتُقابل «Thomas Alva Edison» في المصادر الإنجليزية.
      actions:
        - command: create_entry
          params:
            lemma: "تُومَاس أَلْفَا إِدِيسُون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10969184-n"

    - lemma: "سَاحِرُ مِنْلُو بَارْك"
      source: stage1
      decision: removed
      decision_reason: >
        لا يجتاز اختبار السكّ المعجمي: العبارة وصفية حرة لا مصطلح ثابت. يمكن إبدال أي مكوّن
        فيها («فيلسوف مينلو» / «عبقري مينلو» ...) ويبقى التعبير صالحاً كوصف. فضلاً عن ذلك،
        «مِنْلُو بَارْك» تعريب لاسم مكان يحتاج تثبيتاً خاصاً. العبارة لقبية أدبية لا تُشكّل
        وحدة معجمية قابلة للإدراج في شبكة دلالية.


