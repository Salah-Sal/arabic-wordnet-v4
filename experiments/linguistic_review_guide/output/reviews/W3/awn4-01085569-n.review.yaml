stage1_review:
  assessment:
    concerns:
      - "كلمة 'محاصصة' في الاستخدام المعاصر ترتبط عادة بتوزيع الحصص السياسية أو الوظيفية بشكل قد يكون ذا دلالة سلبية، ولكنها من حيث الأصل تدل على اقتسام الحصص."
      - "التعريف الحالي يحتوي على دور دلالي باستخدام كلمة 'التوزيع' لتعريف نفسها وتكرار ألفاظ اللمات."
    observations: "المجموعة الترادفية تعبر عن مفهوم تجزئة الشيء وتفريق حصصه، سواء كان ذلك وفق نظام معين، أو إعطاء كل ذي حق حقه. المصطلحات الموجودة جيدة وتغطي الجانبين: جعل الشيء في حصص (تقسيم/محاصصة) وتعيينه لجهة معينة (تخصيص)."
  blind_candidates:
    - lemma: "تَوْزِيع"
      generation_method: ishtiqaq
      justification: "مصدر وزع، يدل على عملية تفريق الأشياء على مستحقيها."
    - lemma: "قِسْمَة"
      generation_method: ishtiqaq
      justification: "مصدر قسم، ويدل على عملية تحديد وفرز أنصبة الشركاء والمستحقين."
    - lemma: "إِفْرَاز"
      generation_method: ishtiqaq
      justification: "مصدر أفرز، ويُستخدم في السياق الفقهي والقانوني لتمييز وتعيين الحصص في الملك المشاع."
    - lemma: "تَقْسِيط"
      generation_method: ishtiqaq
      justification: "توزيع الأداء أو الدفعات على مدد زمنية مجزأة."

stage2_evidence:
  per_lemma:
    - lemma: "تخصيص"
      confirm:
        - text: "التخصيص: تفرد بعض الشيء بما لا يشاركه فيه الجملة، ذكره الراغب. وعبر عنه الأصوليون بقولهم: التخصيص، قصر العام على افراده..."
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "التّخصيص: [في الانكليزية] Particularization [في الفرنسية] Particularisation هو في اللغة تمييز بعض الجملة بحكم. ولذا يقال خصّ فلان بكذا..."
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
    - lemma: "تقسيم"
      confirm:
        - text: "التقسيم: هو ضم قيود متخالفة بحيث يحصل عن كل واحد منها قسمٌ، وأيضاً هو بمعنى القسمة، يعني تعيينُ الحصَّة الشائعة وإفرازُ الحصص بعضِها من بعض بمقياس أو غيره."
          source: "التعريفات الفقهيّة للبركتي"
    - lemma: "محاصصة"
      evidence_status: "no_material_found"
    - lemma: "توزيع"
      confirm:
        - text: "التوزيع: التقسيم، وتوزعوه اقتسموه."
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "(التَّوْزِيع) التَّفْرِيق"
          source: "المعجم الوسيط"
    - lemma: "قسمة"
      confirm:
        - text: "القسْمَة: إِفْرَاز حق كل ذِي حق من الْملك شرعا."
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "(الْقِسْمَة) اسْم من اقتسام الشَّيْء والنصيب"
          source: "المعجم الوسيط"
    - lemma: "إفراز"
      expands:
        - text: "والقسمة ... ولا تعري القسمة مطلقا عن معنى إفراز هو أخذ عين حقّه"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُذكر الإفراز كعملية مصاحبة للقسمة"
    - lemma: "تقسيط"
      contradicts:
        - text: "التقسيط: هو تأجيلُ أداء الدين مفرَّقاً إلى أوقات متعددة معينة."
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "المصطلح يختص بالديون والأموال المؤجلة وليس مطلق التوزيع"

stage3_analysis:
  per_lemma:
    - lemma: "تخصيص"
      decision: confirmed
      decision_reason: "مصطلح أساسي ودقيق يعبر عن إفراد حصص أو أجزاء لغايات أو جهات معينة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَخْصِيص"
    - lemma: "تقسيم"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع يدل على تجزئة الشيء وتوزيعه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْسِيم"
    - lemma: "محاصصة"
      decision: confirmed
      decision_reason: "مصطلح فصيح يستعمل في السياقات السياسية والاقتصادية للدلالة على توزيع الحصص، ورغم عدم توفر نص معجمي قديم مباشر في النتائج، فهو متداول ومناسب للمعنى."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَاصَصَة"
    - lemma: "تَوْزِيع"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف قوي وأساسي، بل هو الكلمة الأعم في الدلالة على الفعل ووردت في التعريف الأصلي للمجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَوْزِيع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "قِسْمَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف دقيق يدل على تعيين وفرز الحصص وإعطائها لمستحقيها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "قِسْمَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "إِفْرَاز"
      source: stage1
      decision: removed
      decision_reason: "مصطلح يغلب عليه الاستعمال القانوني والعقاري في فرز الأراضي أو في السياق البيولوجي، ولا يدل على مطلق التوزيع وفق خطة."
    - lemma: "تَقْسِيط"
      source: stage1
      decision: removed
      decision_reason: "مقصور على تجزئة الديون أو المدفوعات زمنياً."

stage4_content:
  definition:
    current: "فعل التوزيع عن طريق التخصيص أو التقسيم؛ التوزيع وفقاً لخطة"
    assessment:
      decision: revise
      reason: "التعريف به دور دلالي لاستخدامه كلمة (التوزيع) لتعريف التوزيع، وتكرار ألفاظ اللمات بداخل التعريف."
    authored:
      - type: terminological
        text: "عملية تجزئة الشيء وتفريق حصصه على مستحقيها وفق نظام أو خطة معينة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "عملية تجزئة الشيء وتفريق حصصه على مستحقيها وفق نظام أو خطة معينة."}
  examples:
    per_lemma:
      - lemma: "تخصيص"
        examples:
          - text: "قررت الحكومة تخصيص جزء من الميزانية للتعليم."
            type: usage
      - lemma: "تقسيم"
        examples:
          - text: "تم تقسيم الأرباح بالتساوي بين الشركاء."
            type: usage
      - lemma: "محاصصة"
        examples:
          - text: "تم توزيع المناصب الإدارية وفق نظام المحاصصة."
            type: usage
      - lemma: "تَوْزِيع"
        examples:
          - text: "أشرف المدير على توزيع المهام على الموظفين."
            type: usage
      - lemma: "قِسْمَة"
        examples:
          - text: "تمت قسمة التركة بين الورثة وفقاً للشرع."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "قررت الحكومة تخصيص جزء من الميزانية للتعليم."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تم تقسيم الأرباح بالتساوي بين الشركاء."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تم توزيع المناصب الإدارية وفق نظام المحاصصة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "أشرف المدير على توزيع المهام على الموظفين."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تمت قسمة التركة بين الورثة وفقاً للشرع."}

