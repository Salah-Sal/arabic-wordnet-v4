# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'مؤدي سافويارد' خالية من التشكيل الكامل"
      - "المفهوم ثقافي خاص جداً (مسرح سافوي البريطاني في القرن التاسع عشر) وغريب عن السياق الثقافي العربي"
      - "المركّب هجين: مفردة عربية 'مؤدي' + معرَّبة 'سافويارد'، ما يُضعف نقاءه الصرفي"
      - "التعريف الحالي يستعمل 'شخص' العامّة بدلاً من المصطلح التقني 'مُؤَدٍّ' المناسب للمجموعة الأب"
    observations: >
      المجموعة تمثّل مفهوماً من التراث المسرحي البريطاني الفيكتوري، إذ يُطلق مصطلح
      «Savoyard» على المؤدي في الأوبريتات الكوميدية لجيلبرت وسوليفان التي اشتُهِرت
      بعروضها في مسرح السافوي بلندن (1881–1896). اللمّة الحالية «مؤدي سافويارد» مركَّبٌ
      إضافي يجمع اسم الفاعل العربي «مؤدي» والمعرَّب «سافويارد»، وهي الترجمة المعتمدة
      في السياقات الثقافية العربية المعاصرة. لا يوجد لهذا المفهوم مقابل عربي أصيل في
      المعاجم الكلاسيكية أو الحديثة، إذ إنه مفهوم غريب ثقافياً (omission).

  blind_candidates:
    - lemma: "سَافُويَارْدِيّ"
      generation_method: taarib
      justification: >
        تعريب «Savoyard» بإضافة ياء النسبة العربية، فيصبح وصفاً واسم جنس في الآن ذاته
        لمن ينتمي إلى تقليد السافوي المسرحي. الوزن المنتج فعيلي نسبي شائع في
        الاصطلاح العربي للمنتسب إلى المؤسسات والمدارس الفنية.
    - lemma: "مُؤَدِّي أوبريتا السَّافوي"
      generation_method: tarkib
      justification: >
        مركّب إضافي ثلاثي: مُؤَدِّي (اسم فاعل من أدّى) + أوبريتا (معرَّب) + السافوي
        (نسبة إلى مسرح Savoy). يُصرّح بدور المؤدي ويحدّد المنبع الثقافي
        (مسرح السافوي) دون الحاجة إلى الاسمين العلمين «جيلبرت» و«سوليفان».
    - lemma: "مُمَثِّلُ جيلبرت وسوليفان"
      generation_method: tarkib
      justification: >
        مركّب إضافي بالأسماء العَلَم مباشرةً لتحقيق أقصى دقة في التعيين؛ على غرار
        «مسرح شكسبير» و«موسيقى بيتهوفن» في الاصطلاح العربي. «مُمَثِّل» من الجذر
        م-ث-ل دالٌّ على أداء الشخصيات المسرحية.
    - lemma: "فَنَّانُ السَّافوي"
      generation_method: tarkib
      justification: >
        مركّب إضافي مُوجَز: فَنَّانُ (اسم من الجذر ف-ن-ن) + السافوي (نسبة إلى Savoy).
        أقصر من البدائل وأعمّ دلالةً، يغطي المغنين والمُمثلين والراقصين الذين
        يشاركون في عروض السافوي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية لجميع اللمّات والمرشحات (headword_norm IN)
#   Q2 — جسر إنجليزي (entries_translations_fts MATCH "Savoyard" OR "Gilbert and Sullivan" OR ...)
#   Q3 — بحث FTS بالكلمات المفتاحية: أوبريتا / سافوي / جيلبرت / سوليفان
#   Q4 — مقاييس اللغة لجذر أدي (dictionary_id = 151)
# النتيجة الإجمالية: لا توجد مداخل معجمية للمصطلح "سافويارد" بوصفه مؤدياً في أوبريتات
# جيلبرت وسوليفان. الأدلة الوحيدة المتوفرة: مدخل "أوبريت" في ARABTERM، وأسماء
# علم مستقلة في موسوعة أسماء العرب، ومدخل جذر أدي في مقاييس اللغة.

stage2_evidence:
  per_lemma:
    - lemma: "مؤدي سافويارد"
      evidence_status: "no_material_found"

    - lemma: "سَافُويَارْدِيّ"
      evidence_status: "no_material_found"

    - lemma: "مُؤَدِّي أوبريتا السَّافوي"
      expands:
        - text: "«أوبريت: نص غنائي مسرحي خفيف»"
          source: "مسرد الفن والتسلية والرياضة — أليكسو (ARABTERM)"
          addition: >
            يُثبت المعجم المصطلحَ «أوبريت» ويُعرِّفه تعريفاً موجزاً يناسب أوبريتات
            جيلبرت وسوليفان، ويدعم المكوَّن الثاني للمركّب المقترح.
        - text: "«أوبريت [مفرد]: (فن) مسرحيّة غنائيّة قصيرة تشتمل عادة على حبكة عاطفيّة
            نهايتها سعيدة، كما تحتوي على مواقف من الحوار الملفوظ والرَّقص التعبيريّ
            أو الاستعراضيّ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: >
            تعريف أكثر تفصيلاً يُثبت دخول «أوبريت» إلى المعجم الحديث ويصف خصائصها
            الفنية التي تنطبق تماماً على أعمال جيلبرت وسوليفان.

    - lemma: "مُمَثِّلُ جيلبرت وسوليفان"
      expands:
        - text: "«جيلبرت: عن الألمانية والانجليزية القديمة بمعنى رهينة ورهان مشهور»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            الاسم العَلَم «جيلبرت» مُعرَّب في المعاجم العربية — مما يُسوِّغ استخدامه
            بلا تأهيل إضافي في المركّب العربي.
        - text: "«سوليفان: عن الأيرلندية بمعنى أسود العينين»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            الاسم العَلَم «سوليفان» مُعرَّب أيضاً، ما يجعل المركّب «مُمَثِّلُ جيلبرت
            وسوليفان» سليم التركيب العربي من حيث الأسماء المكوِّنة له.

    - lemma: "فَنَّانُ السَّافوي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────

stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "مؤدي سافويارد"
      decision: confirmed
      decision_reason: >
        المركّب الإضافي «مُؤَدِّي سَافُويَارْد» هو الترجمة المعتمدة في السياقات
        الثقافية العربية. «مؤدي» اسم فاعل من الجذر أدي بمعنى مَن يُقدِّم عرضاً
        فنياً، و«سافويارد» تعريب راسخ لـ Savoyard بوصفه مصطلحاً ثقافياً لا اسم
        مكان فحسب. يجتاز اختبار السكّ: «مؤدي سافويارد» وحدة معجمية لا يمكن
        إبدال «مؤدي» فيها بـ«فنان» أو «ممثل» دون تغيير الدلالة الدقيقة، لأن
        «الأداء» يشمل الغناء والتمثيل والحضور المسرحي معاً. يحتاج المصطلح
        إلى تصحيح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loan_check:
        loanword_type: "تعريب مصطلح ثقافي (Savoyard → سافويارد) — معرَّب مقبول يقبل لام التعريف والنسبة"
        calque_check: "لا — المركّب ليس ترجمة حرفية عمياء بل توليف بين مفردة عربية ومعرَّبة"
        semantic_alignment: "المدلول مطابق: Savoyard = مؤدٍّ في أوبريتات جيلبرت وسوليفان"
      quality_gate:
        ittiraad: "الوزن الاشتقاقي لـ«مؤدي» (اسم فاعل فعّل) مطّرد في وصف المؤدين"
        yusr: "مقبول للسياق المتخصص؛ ثقيل نسبياً على غير المتخصص"
        mulaaimah: "ملائم للسياق الفني والمسرحي"
        turathi: "لا ينطبق — المفهوم غربي حديث"
        arabiyyah: "نصف المركّب عربي فصيح (مؤدي)"
        ishtiqaaqiyyah: "عالية في الجزء العربي: أدي → أدّى → مُؤَدٍّ"
      nuance_differentiation: "الوحيدة في المجموعة؛ تُحدِّد بدقة المؤدي المنتمي إلى تقليد أوبريتات جيلبرت وسوليفان تحديداً دون غيرها من فنون الأوبريتا"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُؤَدِّي سَافُويَارْد"

    # ── مرشحات المرحلة ١ ──
    - lemma: "سَافُويَارْدِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة النسبة «سَافُويَارْدِيّ» تُنتج وصفاً/نسبة لا اسماً صريحاً لشخص،
        مما يجعلها أقل صراحةً في الدلالة على المؤدي من «مُؤَدِّي سَافُويَارْد».
        إضافةً إلى ذلك تُضيف طبقة غموض (أيّ شيء سافويارد أو من ينتسب إليه)،
        بينما المطلوب مصطلح خاص بالمؤدي المسرحي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُؤَدِّي أوبريتا السَّافوي"
      source: stage1
      decision: removed
      decision_reason: >
        المركّب أطول من اللازم (ثلاث مكوّنات)، و«السافوي» وحده أقل شهرة من
        «سافويارد» في الاستخدام العربي المعاصر. يفشل اختبار التثبيت المعجمي:
        لا يوجد دليل على استخدامه كوحدة اصطلاحية ثابتة في أي مصدر معجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُمَثِّلُ جيلبرت وسوليفان"
      source: stage1
      decision: removed
      decision_reason: >
        «مُمَثِّل» أضيق دلالةً من «مُؤَدٍّ» (الأول للتمثيل الحواري، الثاني للأداء
        الفني الشامل بما فيه الغناء)، وأوبريتات جيلبرت وسوليفان تجمع المغنين
        والممثلين معاً. فضلاً عن ذلك، المركّب بالأسماء العَلَم يظل وصفاً حرّاً
        لا مصطلحاً مسكوكاً — يفشل اختبار السكّ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "فَنَّانُ السَّافوي"
      source: stage1
      decision: removed
      decision_reason: >
        «فنان» أعمّ من «مؤدي»، يشمل فنانين تشكيليين وعازفين ومؤلفين وغيرهم،
        فلا يُحدَّد الدور الأدائي. كما أن «السافوي» وحده يُوحي بمسرح السافوي
        لكن لا يَذكر جيلبرت وسوليفان صراحةً — خسارة في المعلومات التعريفية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────

stage4_content:
  definition:
    current: "شخص يؤدي في أوبريتات جيلبرت وسوليفان"
    assessment:
      decision: revise
      reason: >
        استخدام «شخص» عامٌّ لا يُناسب الأسلوب المعجمي الاصطلاحي؛ الأوْلى «مُؤَدٍّ»
        الذي يُحيل إلى الجنس القريب (الفنان الترفيهي / المُؤَدِّي الفني) كما في
        المجموعة الأب. كذلك يفتقر التعريف الحالي إلى الفصل النوعي الذي يُميِّز
        هذا النوع من الأداء (أوبريتا كوميدية — مسرح السافوي — القرن التاسع عشر).
    authored:
      - type: terminological
        text: >
          مُؤَدٍّ مُتَخَصِّصٌ في الأوبريتات الكوميدية الساخرة لجيلبرت وسوليفان،
          التي اشتُهِرت بعروضها في مسرح السافوي بلندن إبّان القرن التاسع عشر
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مُؤَدٍّ يُشارك في تقديم الأوبريتات الغنائية الكوميدية التي ألَّفها الكاتب
          الإنجليزي ويليام شوينك جيلبرت ولحَّنها الملحّن آرثر سيمور سوليفان، وقد
          قُدِّمت معظمها على خشبة مسرح دويلي كارت (سابقاً: مسرح السافوي) في لندن
          خلال الفترة (1871–1896)، وتتضمن أعمالاً شهيرة كـ«بينافور» و«ميكادو»
          و«لصوص البنزانس»
