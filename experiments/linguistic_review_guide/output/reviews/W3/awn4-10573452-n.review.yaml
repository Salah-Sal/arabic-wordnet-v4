# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10573452-n  |  ILI: i92725  |  POS: n
# Lemmas: مؤدي سافويارد
# Definition: a person who performs in the operettas of Gilbert and Sullivan
