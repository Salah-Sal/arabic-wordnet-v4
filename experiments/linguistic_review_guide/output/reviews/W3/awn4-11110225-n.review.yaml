      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية، ينقصه ذكر الاسم وتحديد أدق لإنجازاته المعمارية"
    authored:
      - type: encyclopedic
        text: "مِعْمارِيٌّ إنجليزيٌّ رائد (١٥٧٣-١٦٥٢م)، يُعَدُّ أوّلَ مَن أدخلَ الطِّرازَ الكلاسيكيَّ الإيطاليَّ إلى العمارة الإنجليزية، واشتُهِرَ بتصميم المسارح والمناظر المسرحية"
