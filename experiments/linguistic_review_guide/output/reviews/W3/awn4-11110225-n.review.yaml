# مراجعة المجموعة الترادفية: awn4-11110225-n (Inigo Jones)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تمثّل عَلَماً أعجمياً (اسم شخص) لا مصطلحاً لغوياً، فلا مجال للاشتقاق أو المجاز"
      - "اللمّة «جونز» مشتركة مع أشخاص كثيرين آخرين يحملون اللقب نفسه، فلا تكفي وحدها لتحديد المرجع"
      - "التعريف العربي ترجمة حرفية للإنجليزي وينقصه ذكر الاسم الكامل أو الجنسية بدقة"
    observations: >
      هذه المجموعة من نوع الأسماء العَلَمية الأعجمية (proper nouns) لشخصية تاريخية إنجليزية.
      التوليد المصطلحي بالمجاز أو الاشتقاق أو التركيب غير وارد هنا؛ الخيار الوحيد هو التعريب
      (النقل الصوتي) للاسم الأجنبي بأشكال إملائية مختلفة. لا بد من الاسم الكامل كلمّة أساسية
      ولقب العائلة وحده كلمّة مختصرة.
  blind_candidates:
    - lemma: "إِنِيغُو جُونْز"
      generation_method: taarib
      justification: "تعريب صوتي للاسم الكامل Inigo Jones بالنقل الحرفي المعتاد في المصادر العربية"
    - lemma: "جُونْز"
      generation_method: taarib
      justification: "تعريب لقب العائلة Jones وحده، وهو الشكل المختصر الشائع للإشارة إلى الشخص"
    - lemma: "إِنِيجُو جُونْز"
      generation_method: taarib
      justification: "تعريب بديل بإبدال الغين جيماً (إنيجو بدل إنيغو) كما يظهر في بعض المصادر العربية"
    - lemma: "إِينِيغُو جُونْز"
      generation_method: taarib
      justification: "تعريب بديل بإشباع الكسرة الأولى ألفاً (إينيغو) محاكاةً للنطق الإنجليزي الممدود"

stage2_evidence:
  per_lemma:
    - lemma: "إِنِيغُو جُونْز"
      evidence_status: "no_material_found"
    - lemma: "جُونْز"
      expands:
        - text: "«جُونْز» يظهر في مركبات عديدة في المعجم الطبي الموحد (بِنْس جُونْز، هِندرسن-جُونز) وفي مؤشر داو جونز، كلها لأشخاص مختلفين"
          source: "المعجم الطبي الموحد (2009) / مسرد المناخ والبيئة"
          addition: "اللقب «جونز» شائع في التعريب العربي بصيغة واحدة ثابتة مما يؤكد صحة الرسم"
    - lemma: "إِنِيجُو جُونْز"
      evidence_status: "no_material_found"
    - lemma: "إِينِيغُو جُونْز"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "إِنِيغُو جُونْز"
      decision: confirmed
      decision_reason: "الاسم الكامل المعرَّب للشخصية التاريخية، وهو الشكل المرجعي الأساسي اللازم لتحديد الهوية"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِنِيغُو جُونْز"

    - lemma: "جُونْز"
      decision: confirmed
      decision_reason: "لقب العائلة وحده شكل مختصر مقبول للإشارة إلى الشخصية في السياق الذي يُفهم فيه المرجع"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُونْز"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِنِيجُو جُونْز"
      source: stage1
      decision: removed
      decision_reason: "شكل إملائي بديل لم يثبت استعماله في المصادر العربية المتاحة؛ الصيغة بالغين (إنيغو) أقرب للنطق الأصلي وأشيع"

    - lemma: "إِينِيغُو جُونْز"
      source: stage1
      decision: removed
      decision_reason: "إشباع الكسرة ألفاً زائدة لا مسوّغ له؛ الصيغة المعتمدة «إنيغو» أخصر وأدق"

