# ── المرحلة ١: المراجعة والتوليد (أعمى — بدون اللمّات) ──────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تصف علماً لشخص بعينه (مصمم أزياء إسباني، 1895-1972)، مما يجعل توليد اللمّات أعمياً محدوداً جداً إذ لا يُستدلّ على الاسم من التعريف وحده."
      - "الوحيد الممكن هنا هو التعريب (الملاذ الأخير في المنهجية)، لأن أعلام الأشخاص لا تقبل الاشتقاق ولا المجاز ولا التركيب الوصفي كلمّات مسكوكة."
      - "اللمّات الموجودة — حين تُكشف — ستفتقر على الأرجح إلى التشكيل الكامل."
      - "التعريف الموسوعي الحالي يمكن إثراؤه بذكر الأصل الباسكي وأسلوبه المعماري المميز."
    observations: >
      هذه مجموعة علم شخصي (proper noun synset) لمصمم أزياء إسباني ذي حيّز زمني محدد
      (1895–1972). التوليد الأعمى هنا مقيَّد بالضرورة بمنطق التعريب، لأن لمّات الأعلام لا
      تنشأ بالاشتقاق ولا المجاز؛ فالتعريف الدلالي يُرشد إلى علَم أجنبي يجب نقله صوتياً.
      أُولوية المراجعة هنا: ضمان صحة التعريب الصوتي، وإضافة التشكيل الكامل، وتحسين التعريف
      الموسوعي لاستيفاء المعلومات الجوهرية (أصل الشخص، مدرسته، أثره).
  blind_candidates:
    - lemma: "بَالِنْسِيَاغَا"
      generation_method: taarib
      justification: >
        تعريب صوتي للقب الإسباني المرجَّح استناداً إلى سياق (مصمم إسباني شهير في القرن
        العشرين)، باعتماد التحويل المعتاد: B→ب، a→َا، l→لِ، n→نْ، ci→سِ، a→يَا، g→غَ،
        a→ا. هذا أشيع التعريبات للاسم في الصحافة العربية.
    - lemma: "كْرِيسْتُوبَال بَالِنْسِيَاغَا"
      generation_method: taarib
      justification: >
        الاسم الكامل المعرَّب (اسم + لقب): Cristobal→كريستوبال + Balenciaga→بالنسياغا.
        ضروري لتعيين الشخص بعينه في السياقات السير ذاتية، وتمييزه عن أي دار أزياء تحمل اسمه.
    - lemma: "بَالِنْثِيَاغَا"
      generation_method: taarib
      justification: >
        تعريب بديل أقرب إلى النطق الإسباني الأصيل: في الإسبانية القشتالية تُنطق "ci" ثاءً
        (ث) لا سيناً، فيصبح: Balen-cia-ga → بالنثياغا. غير أن الصيغة بالسين أكثر شيوعاً
        في الكتابة العربية المعاصرة.
    - lemma: "الإِسْبَانِيُّ بَالِنْسِيَاغَا"
      generation_method: tarkib
      justification: >
        مركب وصفي إضافي يجمع الوصف الجنسي (الإسباني) مع اللقب للتمييز في حالة التشابه بين
        أشخاص يحملون الاسم ذاته. غير أنه يفشل اختبار السكّ (يمكن إبدال "الإسباني" بـ"الفرنسي"
        فيظل عبارةً وصفية) — وليس مصطلحاً مثبَّتاً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────────
# استعلامات منفَّذة: ٣ استعلامات
