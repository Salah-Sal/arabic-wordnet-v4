      evidence_status: "no_material_found"

    - lemma: "بَالِنْثِيَاغَا"
      evidence_status: "no_material_found"

    - lemma: "الإِسْبَانِيُّ بَالِنْسِيَاغَا"
      evidence_status: "no_material_found"

  bridge_note: >
    الجسر الإنجليزي أرجع ثلاثة مداخل من ARABTERM: (١) مُصَمِّم أزياء — translation_en:
    "fashion designer" [entry_id: 484261, 395310]؛ (٢) مُبْدِع الموضة — translation_en:
    "fashion designer" [entry_id: 369090]؛ (٣) كوتورييه — translation_en: "couturier"
    [entry_id: 680737]. هذه الأدلة تدعم المصطلح العام للمفرط الاشتمالي (hypernym)، لا
    للمجموعة الفردية (علم شخصي)، لذا لا تُصنَّف ضمن confirm/contradicts/expands لأيٍّ
    من لمّات هذه المجموعة.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "بالنسياغا"
      decision: confirmed
      decision_reason: >
        تعريب صوتي دقيق مستقرّ في الصحافة العربية المتخصصة في الموضة؛ يُمثّل اللقب وحده
        الذي يُحيل في الخطاب المعاصر إلى الشخص وإلى الدار التي تحمل اسمه. لا بديل عربياً
        أصيلاً ممكناً لعلم شخصي أجنبي. يلزم إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب منفرداً (بالنسياغا) يُحيل في الاستعمال المعاصر إلى الدار والعلامة التجارية
        الحية فضلاً عن الشخص؛ وهو الشكل الإعلامي والتجاري الأكثر شيوعاً في نصوص الموضة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَالِنْسِيَاغَا"

    # ── لمّة موجودة ٢ ──
    - lemma: "كريستوبال بالنسياغا"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المعرَّب ضروري لتعيين الشخص التاريخي تحديداً (1895-1972)، وتمييزه عن
        دار الأزياء التي تواصل نشاطها بعد وفاته تحت إدارة مصمّمين آخرين. يُستخدم في
        السياقات الأكاديمية والسير ذاتية. يُعدّ تعبيراً مركباً (MWE إضافي: اسم + لقب).
        يلزم تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل يُحيل حصراً إلى شخص المصمم التاريخي المحدد، ولا يشمل دلالة الدار أو
        العلامة التجارية؛ يُفضَّل في الكتابة الأكاديمية والنقدية والسير ذاتية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كْرِيسْتُوبَال بَالِنْسِيَاغَا"

    # ── مرشح المرحلة ١ — أ ──
    - lemma: "بَالِنْسِيَاغَا"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق تماماً للمّة الموجودة "بالنسياغا" — لا إجراء مطلوب؛ الإدخال المُنشأ أعمى
        يتطابق مع ما هو موجود في المجموعة. تُعالَج اللمّة عبر update_lemma أعلاه.

    # ── مرشح المرحلة ١ — ب ──
    - lemma: "كْرِيسْتُوبَال بَالِنْسِيَاغَا"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة "كريستوبال بالنسياغا" — لا إجراء مطلوب؛ يُعالَج عبر
        update_lemma أعلاه.

    # ── مرشح المرحلة ١ — ج ──
    - lemma: "بَالِنْثِيَاغَا"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بالثاء غير مستقرّة في الكتابة العربية المعتمدة لهذا الاسم؛ الصيغة الأشيع
        "بالنسياغا" بالسين، وهي الموجودة في المجموعة ومؤكَّدة. إضافة صيغة ثانية متذبذبة
        تُشوِّش لا تُثري.

    # ── مرشح المرحلة ١ — د ──
    - lemma: "الإِسْبَانِيُّ بَالِنْسِيَاغَا"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حر لا مصطلح مسكوك؛ يفشل اختبار التثبيت المعجمي (يمكن إبدال "الإسباني"
        بأي وصف جنسي آخر فيظل عبارة تعريفية). لا يصلح لمّةً معجمية لعلم شخصي.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────────
stage4_content:
  definition:
    current: "مصمم أزياء إسباني معروف بتصاميمه الأنيقة الصارمة (1895-1972)"
    assessment:
      decision: revise
      reason: >
        التعريف صحيح في جوهره لكنه يفتقر إلى الدقة الموسوعية اللازمة لعلم شخصي: (أ) لا يذكر
        الأصل الباسكي الذي يُميّزه عرقياً وثقافياً عن الإسبان بوجه عام؛ (ب) "الأنيقة الصارمة"
        وصف صحيح لكنه مختزَل — أسلوبه كان معمارياً هندسياً بالدرجة الأولى، مع إتقان استثنائي
        في تشكيل القماش؛ (ج) إغفال تأسيس داره الباريسية (1937) الذي يُحدد حقبته الأهم.
    authored:
      - type: encyclopedic
        text: >
          مُصَمِّمُ أَزْيَاءٍ إِسْبَانِيٌّ مِنْ أَصْلٍ بَاسْكِيٍّ، يُعَدُّ مِنْ أَبْرَزِ
          رُوَّادِ الْأَزْيَاءِ الرَّاقِيَةِ فِي الْقَرْنِ الْعِشْرِينَ؛ اشْتُهِرَ بِأُسْلُوبِهِ
