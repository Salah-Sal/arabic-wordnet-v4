# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10516300-n  |  ILI: i92373  |  POS: n
# English: pyrographer — an artist who practices pyrography
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «فنان الحرق على الخشب» عبارة وصفية طويلة من أربع كلمات، تكرّر كلمات التعريف ذاتها (فنان، حرق، خشب)، وتفشل اختبار التثبيت المعجمي."
      - "لمّة «حارق الخشب» جيدة الصياغة صرفياً، غير أن «الحارق» ورد في المعجم الوسيط بمعنى مغاير (سنّ السَّبع)، مما يُثير خطر الاشتراك اللفظي."
      - "كلتا اللمّتين خاليتان من التشكيل الكامل."
      - "لا يوجد في قاعدة البيانات مصطلح عربي أحادي الكلمة راسخ لـ«المحترق الفني» (pyrographer)؛ المعجم الوحيد المُوثِّق الفنَّ هو ARABTERM بصيغة «وَسْم الخشب بالحرق» لا للممارِس."
    observations: >
      تنتمي المجموعة إلى الحقل الفني المتخصص. العربية تمتلك جذوراً غنية للحرق
      (حرق، كوى، وسم) لكنها لم ترسّخ بعدُ مصطلحاً أحادياً للممارِس. اللمّة
      «حارق الخشب» مركّب إضافي مفهوم وقياسي، وهي الخيار الأقصر المتاح. أما
      «فنان الحرق على الخشب» فهي مجرد تحليل دلالي حر لا مصطلح ثابت.
      يُقترح الاحتفاظ بـ«حارق الخشب» بعد ضبط تشكيله، وحذف الصيغة المطوّلة.

  blind_candidates:
    - lemma: "كَوَّاء"
      generation_method: ishtiqaq
      justification: >
        من جذر «كوى»، وزن فَعَّال الدال على الحِرَفية والمبالغة. المعنى الأصلي
        «من يكوي بالنار»؛ بالمجاز الوظيفي ينتقل إلى من يستخدم أداة محمّاة للرسم
        الفني، وهو ما يقوم عليه فن الحرق على الخشب. إحياء لمعنى الكَيّ النار-وظيفي.
    - lemma: "رَاسِم بِالكَيّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي (wasfi): اسم الفاعل «راسم» + الجار والمجرور «بالكيّ» الدال على
        الأداة. يجمع بين وظيفة الرسم وطريقته بالحرق، دون تكرار كلمة «خشب» الواردة
        في التعريف.
    - lemma: "نَقَّاش بِالجَمْر"
      generation_method: tarkib
      justification: >
        مركّب وصفي: «نقّاش» (وزن فَعَّال من نقش، يدل على الحِرَفية في النقش
        والزخرفة) + «بالجمر» (الأداة الحارقة). يُبرز الطابع الزخرفي لفن الحرق
        ويتجنب التكرار مع التعريف.
    - lemma: "بَيرُوغرَافِيّ"
      generation_method: taarib
      justification: >
        تعريب مباشر من «pyrographer» الإنجليزية بصياغة نسبية عربية (ياء النسب).
        يقبل لام التعريف والجمع السالم (بيروغرافيون) والنسبة (بيروغرافيّ).
        خيار أخير بعد استنفاد الإمكانيات الاشتقاقية والتركيبية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١. مطابقة دفعية شاملة لجميع اللمّات والمرشحات (Pattern ١)
# ٢. الجسر الإنجليزي لـ pyrographer/pyrography (Pattern ٧)
# ٣. بحث FTS عربي بكلمات مفتاحية: حرق، كي، وشم، رسم، نقش (Pattern ٦)
# ٤. مقاييس اللغة لجذور: حرق، كوي، وسم، دمغ، خشب (Pattern إثراء)
# ٥. استعلام تفصيلي مُستهدَف للمدخل 396005 (ARABTERM)
stage2_evidence:
  per_lemma:
    - lemma: "حارق الخشب"
      confirm:
        - text: >
            «الْحَاءُ وَالرَّاءُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا حَكُّ الشَّيْءِ
            بِالشَّيْءِ مَعَ حَرَارَةٍ وَالْتِهَابٍ، وَإِلَيْهِ يَرْجِعُ فُرُوعٌ
            كَثِيرَةٌ. وَالْآخَرُ شَيْءٌ مِنَ الْبَدَنِ.»
          source: "مقاييس اللغة لابن فارس (جذر حرق)"
      contradicts:
        - text: "«(الحارق) سنّ السَّبع»"
          source: "المعجم الوسيط"
          conflict: >
            «الحارق» في المعجم الوسيط مُعجمٌ بمعنى «سنّ السَّبع» (الناب)،
            وهو معنى بيولوجي متخصص مغاير تماماً لدلالة الممارس الفني.
            يُثير ذلك خطر الاشتراك اللفظي عند استخدام الكلمة بمفردها، وإن
            كانت صيغة المركّب الإضافي «حارق الخشب» تحدّ من هذا الخطر.
      expands:
        - text: >
            «وَسْم الخشب بالحرق: طريقة الرسم بالحرق على الخشب» [ترجمة إنجليزية:
            pyrography]
          source: "المعجم الموحد لمصطلحات التقنيات التربوية 1999 (ARABTERM)"
          addition: >
            يُثبت المعجم الموحد أن المصطلح المعتمد لِلفَنِّ هو «وَسْم الخشب
            بالحرق» لا «حرق الخشب»، مما يُرجّح استخدام مشتقات جذر «وسم»
            بدلاً من «حرق» في التسمية المعيارية للفنّ وممارِسه.
        - text: >
            «الدَّمْغ الوَشْميّ: فن طبع الرسوم على الخشب والجلد وغيرهما بأداةٍ
            مُحمّاةٍ.» [ترجمة إنجليزية: pyrography]
          source: "المورد الحديث 2008 (ARABTERM)"
          addition: >
            يُقدّم «الدمغ الوشمي» كتعبير مركّب بديل لفن البيروغرافيا؛ وهو
            يوضح الأداة المُحمّاة وربط الفن بالوشم والنقش، لا بالحرق المجرد.

    - lemma: "فنان الحرق على الخشب"
      evidence_status: "no_material_found"

    - lemma: "كَوَّاء"
      contradicts:
        - text: >
            «فعَّال للمبالغة من الكاوى، مَن حرفته كَيُّ الملابس، الخبيثُ اللِّسان
            الشَّتَّامُ»
          source: "المعجم الوسيط (مجمع اللغة العربية — OCR، جذر كوي)"
          conflict: >
            «الكَوَّاء» مُسجَّل في المعجم الوسيط بمعنيين: (١) مُكوي الملابس
            (laundry presser)، (٢) شتّام سيء اللسان. كلاهما بعيد عن الفنان
            الممارس للحرق الفني على الخشب. لا توجد إشارة إلى استخدام فني.

    - lemma: "رَاسِم بِالكَيّ"
      evidence_status: "no_material_found"

    - lemma: "نَقَّاش بِالجَمْر"
      evidence_status: "no_material_found"

    - lemma: "بَيرُوغرَافِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ١ ──
    - lemma: "حارق الخشب"
      decision: confirmed
      decision_reason: >
        مركّب إضافي قياسي من اسم الفاعل «حارق» (الحارق للشيء) مضافاً إلى
        «الخشب». المعنى الأصلي لجذر حرق يدعم الدلالة (مقاييس ابن فارس: حك
        الشيء مع حرارة والتهاب). أحكام المعجم الوسيط في «الحارق = سنّ السَّبع»
        مقتصرة على السياق البيولوجي ولا تُلغي استخدام اسم الفاعل في المعنى
        الاشتقاقي الأصلي. لم يُعثر على مصطلح عربي أحادي راسخ أفضل منه.
        اللمّة صحيحة لغوياً وتحتاج فقط إلى ضبط التشكيل الكامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة؛ تنفرد بالدلالة على الممارس لفن
        الحرق بأداة محمّاة على سطح خشبي. التركيب الإضافي يحدد الفاعل (حارق)
        والمفعول به (الخشب) مما يميّزها عن مصطلحات الحرق الأخرى.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَارِق الخَشَب"

    # ── لمّة موجودة ٢ ──
    - lemma: "فنان الحرق على الخشب"
      decision: removed
      decision_reason: >
        تفشل اختبار التثبيت المعجمي: يمكن إبدال «فنان» بـ«ممارس» أو «صانع»،
        وإبدال «الحرق» بـ«الكيّ» أو «الوسم»، وتبقى العبارة صالحة كوصف —
        دليل على أنها ليست وحدة معجمية مسكوكة. تعيد استخدام كلمات التعريف
        (فنان، حرق، خشب) بالكامل. المركّب من أربع كلمات، أطول مما تحتاجه
        لمّة معجمية. لا أثر لها في أي معجم.
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "كَوَّاء"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الوسيط يُثبّت «الكَوَّاء» بمعنى «من حرفته كيّ الملابس»؛ الدلالة
        المعجمية الراسخة على المكواتي تحول دون استخدامه مصطلحاً لفنان الحرق
        الفني. الاشتراك اللفظي يُضعف القدرة على التداول بلا إشكال.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "رَاسِم بِالكَيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أثر له في أي معجم أو مصطلحية. اختبار السكّ يثبت أنه عبارة وصفية
        حرة: يمكن إبدال «راسم» بـ«ناقش» أو «فنان» فيبقى الوصف صحيحاً.
        لم يتحقق شرط الوحدة المعجمية الثابتة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "نَقَّاش بِالجَمْر"
      source: stage1
      decision: removed
      decision_reason: >
        لا أثر معجمي له. فضلاً عن ذلك يُحيل «الجمر» إلى الجمر المتّقد
        لا إلى الأداة المُحمَّاة المدبَّبة المستخدمة في البيروغرافيا، مما يُعطي
        انطباعاً خاطئاً عن التقنية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "بَيرُوغرَافِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب ملاذ أخير يُلجأ إليه بعد استنفاد الاشتقاق والتركيب. لا أثر
        للكلمة في أي معجم أو مصطلحية عربية. إذ توجد مصطلحية عربية مقبولة
        («وسم الخشب بالحرق» في ARABTERM)، يُفضَّل البقاء ضمن المنظومة
        الاشتقاقية العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
