        التعريف الحالي ترجمة حرفية للإنجليزية، يخلو من الفَصْل النوعي الحاسم:
        لا يُحدد الأداة المُحمَّاة التي تميّز البيروغرافيا عن الحرق العادي.
        كما أن مصطلحية ARABTERM تُثبت أن فن البيروغرافيا يُعرَّف بـ«الرسم
        بالأداة المُحمَّاة» لا بـ«الحرق» المجرد.
