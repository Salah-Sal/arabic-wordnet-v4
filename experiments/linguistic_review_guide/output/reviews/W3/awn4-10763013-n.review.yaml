        التفسيريان وعبارة "لكن عادة" لا تليقان بصياغة المعجم. كما يخلو من الجنس
        القريب (اسم ينضوي تحت المصلح الاجتماعي) والفصل النوعي (الخاصية المميزة:
        أن رؤيته مثالية يصعب تطبيقها).
