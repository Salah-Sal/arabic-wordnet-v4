# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "التشكيل ناقص في كلتا اللمّتين: طُوباوِيّ (حرف الباء بلا حركة) ومِثالِيّ (حرف الثاء بلا حركة)"
      - "التعريف الحالي مكتوب بأسلوب غير معجمي (قوسان تفسيريان)، ويفتقر إلى الجنس القريب والفصل النوعي"
      - "مِثالِيّ مدخلٌ صرفيٌّ صفوي في المعاجم (adj)، غير أن AWN يستخدمه اسماً؛ هذه النقلة الوظيفية تحتاج توضيحاً دلالياً"
    observations: >
      المجموعة تصف إنساناً محدداً: المُصلح الاجتماعي ذو التوجه المثالي العسير التطبيق.
      الإنجليزية تستخدم Utopian (نسبة إلى Utopia لتوماس مور)، وقد وجد العربيون مقابلين:
      الأول طُوبَاوِيّ (من طُوبى العربية الأصيلة: الخير والنعيم المجرّد) والثاني مِثَالِيّ
      (من المِثَال والمُثُل العليا). الجذران متمايزان: الأول يحمل إيحاء الفردوس المنشود
      بعيد المنال، والثاني ينبع من فلسفة الاحتذاء بالنماذج المثلى. كلاهما مستعمل في
      الأدبيات العربية الحديثة وصالح للمجموعة.

  blind_candidates:
    - lemma: "طُوبَاوِيّ"
      generation_method: majaz
      justification: >
        إحياء دلالي من "طُوبى" القرآنية (الحُسنى وكل مستطاب في الجنة)؛ المجاز هنا إزاحة
        من معنى "النعيم المجرّد البعيد المنال" إلى "من يسعى إليه دون أن يناله". الوزن
        فُعْلَى → نسبة بـ -اوِيّ قياسية (كصحراوِيّ من صحراء). يُفضَّل على التعريب
        المباشر "يوطوبيّ" لأنه يعيد توظيف لفظ عربي أصيل بدلاً من اقتراض صوتي.
    - lemma: "تَطَلُّعِيّ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (طلع) على وزن التَّفَعُّل ثم نسبة؛ التطلّع في العربية يحمل
        معنى الطموح نحو ما لم يُبلَغ بعد، وهو قريب من "المثالية". إلا أن الاشتقاق
        أفرز صفة للشخص الطامح لا للمصلح الاجتماعي تحديداً.
    - lemma: "حَالِمُ الإِصْلَاحِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من حالم (mwe_type: idafi) + الإصلاح؛ يجمع بين صفة الحلم
        (دلالة الإفراط في المثالية) وموضوع الإصلاح الاجتماعي. يستعيد الاستعمال
        العربي الكلاسيكي لـ"حالم" بمعنى من يسبح في عالم الخيال.
    - lemma: "فَاضِلِيّ"
      generation_method: ishtiqaq
      justification: >
        مشتق من (فضل) على وزن فاعِلِيّ النسبي؛ يستحضر مصطلح "المدينة الفاضلة" لأبي
        نصر الفارابي الذي يعدّ المرجع الفلسفي العربي لمفهوم اليوتوبيا. "فاضِلِيّ"
        أي منسوب إلى الفضيلة المثالية المنشودة لا الواقع المُعاش.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "طُوبَاوِيّ"
      confirm:
        - text: "«اشتراكية مثالية، اشتراكية طوباوية»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — ARABTERM"
          # يثبت استخدام طوباوية نسبةً إلى اليوتوبيا في السياق الاجتماعي-الاقتصادي
      expands:
        - text: "«(الطُّوبَى) الحسنى والخير وكل مستطاب في الجنة من بقاء بلا فناء وعزّ بلا زوال وغنىً بلا فقر»"
          source: "المعجم الوسيط (hawramani)"
          addition: >
            يكشف عن الدلالة الأصلية لطوبى (النعيم المثالي الكامل غير القابل للتحقق في
            الدنيا)، وهو المنطلق الدلالي الذي يجعل طُوبَاوِيّ مقابلاً طبيعياً لـ Utopian.
        - text: "«(طُوبَى) يقال: طُوبى لك: دعاء بالخير والسرور والبركة; طُوبى وطُوباك: شجرة في الجنة، أو اسم من أسماء الجنة»"
          source: "المعجم الكبير (ocr)"
          addition: "يؤكد انتماء طوبى إلى دلالة الخير المثالي البعيد عن الدنيا، مما يعزز الإزاحة المجازية"
        - text: "«اليوطوبيّ: مُصلِح سياسيّ أو اجتماعيّ متحمِّس ولكنه غير عمليّ»"
          source: "المورد الحديث (2008) — ARABTERM (entry 726758)"
          addition: >
            يثبت استخدام المورد الحديث مصطلح "يوطوبيّ" (الشكل البديل) بنفس الدلالة المطلوبة
            للمجموعة، مما يعزز أن طوباوي/يوطوبي هما مترادفان للمفهوم ذاته.

    - lemma: "مِثَالِيّ"
      confirm:
        - text: "«(المثاليّ): شخص يستهدي في سيرته بالمُثل العليا. وبخاصة: من يقدّم المثل العليا على الاعتبارات العملية»"
          source: "المورد الحديث (2008) — ARABTERM (entry 694006)"
        - text: "مثالي — translation_en: \"idealist\" — domain: Philosophy and Psychology"
          source: "مسرد الفلسفة وعلم النفس، ALECSO — ARABTERM (entry 489766)"
      expands:
        - text: "«وصف لكل ما هو كامل فى بابه، كالخلق المثالي، واللوحة المثالية»"
          source: "المعجم الوسيط (ocr, entry 26929)"
          addition: >
            يثبت أن الاستخدام الأصلي في الوسيط صفوي (adjective)؛ غير أن الاستعمال
            الاسمي المُدرَج في المورد الحديث ومسرد الفلسفة يكشف عن توسيع دلالي مقبول.

    - lemma: "تَطَلُّعِيّ"
      evidence_status: "no_material_found"

    - lemma: "حَالِمُ الإِصْلَاحِ"
      expands:
        - text: "«(1) الحالم (2) العائش أو السابح في دنيا الخيال»"
          source: "المورد الحديث (2008) — ARABTERM (entry 684688, translation_en: dreamer)"
          addition: "يثبت دلالة حالم على الحالم بالمستحيل، غير أن المركب حالم الإصلاح لم يرد كوحدة معجمية ثابتة"

    - lemma: "فَاضِلِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "طُوباوِيّ"
      decision: confirmed
      decision_reason: >
        الأدلة تؤكد استخدام "طوباوية" نسبةً إلى اليوتوبيا في معاجم حديثة موثوقة. الاشتقاق
        من طُوبى (العربية الأصيلة) سليم قياساً (صحراء→صحراوي، طوبى→طوباوي). مقاييس اللغة
        تؤكد أن طُوبى مشتقة من جذر طيب. الصيغة تفوق "يوطوبيّ" المُعرَّبة لأنها تستحضر
        مرجعاً ثقافياً عربياً قرآنياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        طُوبَاوِيّ يحمل إيحاء الفردوس المنشود البعيد المنال؛ المصطلح يجعل المصلحَ
        الاجتماعي من يسعى نحو "طُوبى" غير قابلة للتحقق. الدلالة تميل إلى الوصف
        من الخارج (تصنيف الآخرين لصاحبه بأنه حالم بالمستحيل).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طُوبَاوِيّ"

    - lemma: "مِثالِيّ"
      decision: confirmed
      decision_reason: >
        مثالي بمعنى "المثاليّ الفيلسوف أو الشخص الذي يقدّم المُثُل العليا على الاعتبارات
        العملية" ثابت في المورد الحديث ومسرد الفلسفة (translation: idealist). استخدامه
        اسماً قياسي في العربية (الصفة المُسنَمة). الأصل اللغوي في مثل/مثال يجعله
        دقيقاً من الناحية المصطلحية ومألوفاً في الخطاب الفلسفي والاجتماعي العربي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مِثَالِيّ يركز على الانتساب إلى المُثُل العليا الفلسفية المجرّدة (المدرسة
        الفلسفية المثالية Idealism)؛ قد يوصف الشخص بأنه مِثَالِيّ تقديراً أو نقداً
        من الداخل. في حين طُوبَاوِيّ يصف غالباً المصلح الاجتماعي-السياسي ذا الرؤية
        المستحيلة التطبيق من منظور خارجي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِثَالِيّ"

    - lemma: "تَطَلُّعِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استخدام "تطلّعي" مصطلحاً للمصلح الاجتماعي المثالي.
        الكلمة صفة عامة للطموح، غير مسكوكة في هذا المعنى المتخصص، وتفتقر
        إلى التثبيت المعجمي اللازم للإدراج.

    - lemma: "حَالِمُ الإِصْلَاحِ"
      source: stage1
      decision: removed
      decision_reason: >
        المركب الإضافي يفشل اختبار السكّ: يمكن إبداله بـ"حالم التغيير" أو "حالم
        السياسة" ويبقى وصفاً صالحاً، مما يعني أنه ليس وحدة معجمية ثابتة. كما
        لم يرد في أيٍّ من المعاجم المستعلَمة.

    - lemma: "فَاضِلِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. رغم الارتباط الاشتقاقي بمصطلح "المدينة الفاضلة"، فإن
        "فاضلي" كنسبة مستقلة بمعنى "utopian reformer" غير موثّق ولا شائع في
        الاستخدام الحديث.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────────
stage4_content:

