# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "خاسر في لعبة العانس"
      decision: confirmed
      decision_reason: >
        على الرغم من أن هذه اللمة عبارة وصفية لا مصطلح مسكوك بالمعنى الصارم، فإنها
        تبقى الصياغة العربية الأدق والأوسع تداولًا للمفهوم في غياب أي بديل مُعجمي ثابت.
        لا تُوجد في المعجمية العربية كلمة مفردة أو تعبير اصطلاحي ثابت مخصوص بالخاسر
        في لعبة العانس. الإبقاء عليها مشروط بتصحيح التشكيل وتوثيق طابعها الوصفي.
        بوابة جودة المصطلح: تُخفق في معيار الاطّراد (لا تُكوِّن عائلة اشتقاقية) ومعيار
        الإيثار التراثي (مفهوم حادث)، لكنها تجتاز معيار الملاءمة (تُعبِّر عن المفهوم
        بدقة) ومعيار يُسر التداول.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
        # بنية: اسم (خاسر) + شبه جملة جارّة وصفية (في لعبة العانس)
        # ملاحظة اختبار السكّ: يمكن قول «مهزوم في لعبة العانس» وتبقى العبارة وصفًا
        # صحيحًا، مما يُثبِت أنها ليست وحدة معجمية ثابتة بالمعنى الاصطلاحي الدقيق.
        # غير أن العبارة تُقبَل استثناءً لعدم وجود بديل أفضل.
      nuance_differentiation: >
        تتخصّص هذه اللمة في الخسارة في سياق لعبة العانس تحديدًا، لا الخسارة العامة في
        التنافس (كما هو حال «خاسر» و«منهزم» في المجموعة الأم). الخسارة هنا ذات طبيعة
        مميَّزة: تُحدَّد بحيازة ورقة منفردة لا مُزاوِج لها، لا بالتسبيق أو النقاط.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَاسِرٌ فِي لُعبَةِ الْعَانِسِ"

    - lemma: "الْمُعَنَّسُ"
      source: stage1
      decision: removed
      decision_reason: >
        المورد الحديث يُثبِت «العانس» للعبة ذاتها (old maid) لا للخاسر فيها. استعمال
        «المُعَنَّس» بمعنى الخاسر سيُوقع في اشتراك لفظي حادّ مع دلالة الشخص الذي بقي
        دون زواج. الإزاحة الدلالية المقترحة غير مستقرة معجميًّا ولا سند لها في استعمال
        عربي موثّق.

    - lemma: "الْخَاسِئُ"
      source: stage1
      decision: removed
      decision_reason: >
        «الخاسئ» من (خسأ) بمعنى المُبعَد والمُقصى. الدلالة في القرآن الكريم ذات طابع
        عقابي وديني («قال اخسئوا فيها»). استعماله للخاسر في لعبة ورق خفيفة يُفضي إلى
        قلق أسلوبي بسبب الثقل الديني للجذر. لا شاهد معجمي على استعماله في سياق الألعاب.

    - lemma: "صَاحِبُ الْوَرَقَةِ الْيَتِيمَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: لا يُوجد شاهد على هذه الصياغة كوحدة اصطلاحية ثابتة
        في أي معجم. اختبار الاستبدال يكشف إمكانية قول «صاحب الورقة المنفردة» أو «حامل
        الورقة اليتيمة» دون أن تُفقَد الدلالة، مما يُثبِت أنها عبارة وصفية حرة لا مصطلح.

    - lemma: "الْمُخَلَّفُ"
      source: stage1
      decision: removed
      decision_reason: >
        الأصل الجذري (خلف) لا يتضمّن معنى الخسارة في سياق الألعاب. المعاجم توثّق
        «المُخلَف» بمعنى الطريق أو من أُخلف وعده، وكلاهما بعيد عن المفهوم المطلوب.
        الإزاحة الدلالية مُتكلَّفة ولا سند لها في الاستعمال المعجمي.


