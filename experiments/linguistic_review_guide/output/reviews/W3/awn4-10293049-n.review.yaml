          source: "المعجم الكبير (مجمع اللغة العربية) — مادة: المُخْلَف"
          conflict: >
            المُخْلَف في أدق معانيه المعجمية يُشير إلى مكان أو من أُخلف وعده لا إلى
            خاسر في لعبة. الدلالة الموثّقة مغايرة للمعنى المقصود.
        - text: >
            «(خَلَفَ) الْخَاءُ وَاللَّامُ وَالْفَاءُ أُصُولٌ ثَلَاثَةٌ: أَحَدُهَا
            أَنْ يَجِيءَ شَيْءٌ بَعْدَ شَيْءٍ يَقُومُ مَقَامَهُ، وَالثَّانِي
            خِلَافُ قُدَّامٍ، وَالثَّالِثُ التَّغَيُّرُ.»
          source: "مقاييس اللغة لابن فارس — مادة: خَلَفَ"
          conflict: >
            أصول الجذر (جاء بعد / ضدّ القُدَّام / تغيّر) لا تُفضي بطريق طبيعي إلى
