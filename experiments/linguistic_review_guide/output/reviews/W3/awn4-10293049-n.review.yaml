# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'خاسر في لعبة العانس' عبارةٌ وصفية حرة لا مصطلح مسكوك: يمكن استبدال 'لعبة' بـ'مباراة' دون أن يتغيّر المعنى، مما يُفشل اختبار السكّ."
      - "اللمة خالية من التشكيل الكامل."
      - "المفهوم ذو طابع ثقافي غريب عن البيئة العربية الأصيلة (لعبة ورق غربية المنشأ)، مما يُعسِّر إيجاد مقابل عربي مسكوك."
      - "التعريف الحالي يتضمّن نصًّا إنجليزيًّا بين قوسين وعلامات اقتباس زائدة، بما يخالف أسلوب المعجم الوسيط."
    observations: >
      تنتمي هذه المجموعة إلى حقل ألعاب الورق الاجتماعية، وهو حقل طارئ على المعجمية العربية
      الكلاسيكية. الجذر الدلالي للمفهوم ثنائي المحور: (أ) الخسارة في السياق التنافسي
      (خسر)، و(ب) لعبة العانس تحديدًا (عنس). المورد الحديث (2008) أثبت «العانِس» ترجمةً
      للعبة old maid، مما يُضفي شرعيةً لغوية على المكوِّن الثاني في اللمة. غير أن التحدي
      يكمن في أن الشخص الخاسر في هذه اللعبة تحديدًا (لا الخاسر عمومًا) لا يُعبَّر عنه
      إلا بعبارة وصفية، ولا يُعرف له مصطلح عربي مسكوك في تراث المعجمية.

  blind_candidates:
    - lemma: "الْمُعَنَّسُ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من الجذر (عنس): العانِس هي التي بقيت دون زواج، فالمُعَنَّسُ في لعبة
        العانس هو مَن «بقي بيده الورقة المنفردة» على غرار من بقي دون مُزاوَج. الإزاحة
        قائمة على تشابه وظيفي بين «البقاء بلا مُزاوِج» في الاجتماع و«البقاء بلا مُزاوَجة»
        في اللعبة. يُحيي لفظًا موجودًا في التراث في سياق اصطلاحي جديد.
    - lemma: "الْخَاسِئُ"
      generation_method: majaz
      justification: >
        من الجذر (خسأ) بمعنى الإبعاد والطرد والإقصاء؛ يقال «خَسَأَه» أي أبعده وأقصاه.
        يُستعمل مجازيًّا للاعب الذي يُقصى في نهاية الجولة بإلزامه الورقة اليتيمة. إحياء
        للفظ قرآني أصيل («قال اخسئوا فيها») في تعبير اصطلاحي جديد. يتميّز عن «الخاسر»
        بإضافة مدلول الإقصاء والإبعاد.
    - lemma: "صَاحِبُ الْوَرَقَةِ الْيَتِيمَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من ثلاثة مكونات: «صاحب» (الحامل/المالك) + «الورقة» (ورقة اللعب) +
        «اليتيمة» (غير المُزاوَجة، من يتم بمعنى الانفراد). يصف المفهوم بدقة تامة من خلال
        التركيب الإضافي الثلاثي. «اليتيمة» مستعملة في العربية لما انفرد وليس له مثيل أو قرين.
    - lemma: "الْمُخَلَّفُ"
      generation_method: ishtiqaq
      justification: >
        على وزن مُفَعَّل من الجذر (خلف): «من خُلِّف وراء الآخرين وبقي بعد انتهاء الجولة».
        يُعبِّر بدلالة صرفية مباشرة عن مفهوم «من يتخلّف ويظل في نهاية اللعبة مع ورقة
        يتيمة». الوزن مُفَعَّل يدلّ على من وقع عليه الفعل وأُلزم موقعًا غير مرغوب.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
