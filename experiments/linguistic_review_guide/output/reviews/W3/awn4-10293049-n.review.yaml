stage2_evidence:
  per_lemma:
    - lemma: "خاسر في لعبة العانس"
      confirm:
        - text: >
            «(1) العانِس (2) المُعَنِّس: امرؤ متزمّت أو عصبيّ المزاج صعب الإرضاء
            (3) ضربٌ من لعِب الورق.»
          source: "المورد الحديث (2008) — ترجمة: old maid"
          # يُثبِت أن «العانس» هو المقابل العربي المعجمي للعبة old maid، مما يدعم
          # المكوِّن الثاني في اللمة المركبة.
        - text: >
            «الذى ذَهَب مالُه وعَقْلُه؛ الذى يَنْقُصُ المِكْيالَ والمِيزانَ إذا
            أَعْطَى وَيَسْتَزِيدُ إِذَا أَخَذَ؛ العاجِزُ»
          source: "المعجم الكبير (مجمع اللغة العربية) — مادة: الخاسِرُ"
          # يُثبِت أن «الخاسر» مفردة عربية أصيلة بمعنى من يخسر، وإن كان التعريف
          # يميل إلى السياق المالي والمعنوي لا سياق الألعاب.
      expands:
        - text: >
            «(1) الخاسر (2) اللّاكُفؤ: شخصٌ تعوزه الكفاءَة.»
          source: "المورد الحديث (2008) — ترجمة: loser"
          addition: >
            يُضيف أن «الخاسر» يمكن أن يُستعمل للدلالة على من يخسر في سياق تنافسي
            عام (وليس السياق المالي فقط)، مما يدعم استخدامه في سياق الألعاب.

    - lemma: "الْمُعَنَّسُ"
      confirm:
        - text: >
            «(1) العانِس (2) المُعَنِّس: امرؤ متزمّت أو عصبيّ المزاج صعب الإرضاء
            (3) ضربٌ من لعِب الورق.»
          source: "المورد الحديث (2008) — ترجمة: old maid"
      contradicts:
        - text: >
            «عَنَسَتِ الْمَرْأَةُ، وَهِيَ تَعْنُسُ عُنُوسًا، إِذَا صَارَتْ
            نَصَفًا وَهِيَ بَعْدُ بِكْرٌ لَمْ تَزَوَّجْ. وَعَنَّسَهَا أَهْلُهَا
            تَعْنِيسًا، إِذَا حَبَسُوهَا عَنِ الْأَزْوَاجِ حَتَّى جَازَتْ فَتَاءَ
            السِّنِّ.»
          source: "مقاييس اللغة لابن فارس — مادة: عَنَسَ"
          conflict: >
            الجذر (عنس) يدلّ على بقاء المرأة دون زواج. صيغة «مُعَنَّس» (مفعول) ليست
            موثّقة بمعنى الخاسر في اللعبة؛ والمورد الحديث يُثبت «العانس» للعبة ذاتها
            لا للخاسر فيها، مما يجعل الإزاحة الدلالية غير مستقرة.

    - lemma: "الْخَاسِئُ"
      expands:
        - text: >
            «(خَسَأَ) الْخَاءُ وَالسِّينُ وَالْهَمْزَةُ يَدُلُّ عَلَى الْإِبْعَادِ.
            يُقَالُ خَسَأْتُ الْكَلْبَ. وَفِي الْقُرْآنِ: {قَالَ اخْسَئُوا فِيهَا
            وَلَا تُكَلِّمُونِ} [المؤمنون: 108] ، كَمَا يُقَالُ ابْعُدُوا.»
          source: "مقاييس اللغة لابن فارس — مادة: خَسَأَ"
          addition: >
            يُثبِت أن الجذر يدلّ على الإبعاد والإقصاء، وهو قابل للتوسيع المجازي
            نحو معنى «من أُبعد وخسر». لكنه لا يُثبِت الاستعمال في سياق الألعاب.

    - lemma: "صَاحِبُ الْوَرَقَةِ الْيَتِيمَةِ"
      evidence_status: "no_material_found"

    - lemma: "الْمُخَلَّفُ"
      contradicts:
        - text: >
