# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10014058-n (deacon / شماس)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «شماس» بدون تشكيل — يلزم إضافة تشكيل كامل"
      - "المجموعة تحوي لمّة واحدة فقط؛ قد تكون هناك مرادفات مثل «شِدْيَاق»"
      - "التعريف العربي يستخدم «الكاهن» بينما المعاجم العربية تستخدم «القسّيس» للدلالة على الرتبة الأعلى مباشرة"
    observations: "المفهوم يمثّل رتبة كنسية مسيحية معروفة في العربية منذ القدم عبر الاقتراض من السريانية. لفظ «شَمَّاس» مثبت في المعاجم العربية الكبرى (الوسيط والكبير) بوصفه معرَّباً من السريانية «شمَّاشا» بمعنى خادم الأسرار المقدسة. المفهوم له حضور في الشعر العربي القديم (عنترة). التعريف الحالي مقبول في مجمله لكنه يستخدم «الكاهن» وهو أقرب إلى priest بينما المعاجم تستخدم «القسّيس»."
  blind_candidates:
    - lemma: "خَادِمٌ"
      generation_method: majaz
      justification: "الأصل اليوناني diakonos يعني «الخادم»، فيمكن توظيف «خادم» مجازاً للدلالة على هذه الرتبة الكنسية. غير أنّ اللفظ عامّ جداً ولا يختصّ بالسياق الكنسي."
    - lemma: "شِدْيَاقٌ"
      generation_method: taarib
      justification: "لفظ سرياني/آرامي معرَّب يُستعمل عند بعض النصارى العرب للدلالة على مَنْ يمارس خدمة الكاهن والترتيل معه في أوقات الصلوات، وهو مرادف لشمّاس في بعض الطوائف."
    - lemma: "شَمَّاسٌ"
      generation_method: taarib
      justification: "معرَّب من السريانية «شمَّاشا» بمعنى خادم الأسرار المقدسة، وهو اللفظ الأكثر شيوعاً في العربية للدلالة على هذه الرتبة الكنسية، مثبت في المعجم الوسيط والمعجم الكبير."
    - lemma: "دِيَاقُونٌ"
      generation_method: taarib
      justification: "تعريب مباشر من اليونانية diakonos عبر اللاتينية diaconus. لم يُثبت في المعاجم العربية المعتمدة لكنه قد يرد في بعض النصوص الكنسية المترجمة."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "شَمَّاس"
      confirm:
        - text: "«الشديد الشموس من يقوم بالخدمة الكنسية, ومرتبته دون القسيس. [سريانية]»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(فى الآرامية شمَّاشا: خادم الأسرار المقدسة خاصةً): مَنْ يقوم بالخِدمة الكَنَسِيَّة, ومرتبتُه دون القِسِّيس, وهو الذى يُساعدُه فى وظيفته. (سريانية)»"
          source: "المعجم الكبير (OCR)"
        - text: "«الشَّمّاس؛ الشِّدياق (كن).»"
          source: "المورد الحديث (2008) — ترجمة deacon"
        - text: "«من (ش م س) الشديد النفور والعسير الصحبة، ومن يقوم بالخدمة الكنيسة وهو دون القسيس.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«إذا اشْتَغَلَتْ أَهْلُ البَطَالَةِ فى الكاسِ / أوِ اغتَبَقـوهــا بَينَ قسٍّ وشَمَّاسِ»"
          source: "المعجم الكبير — شاهد شعري لعنترة"
          addition: "شاهد شعري جاهلي يؤكّد قِدَم استعمال اللفظ في العربية وارتباطه بالسياق الكنسي"
        - text: "«شَمَامِسَةٌ، شَمَامِسُ، شَمَامِيسُ»"
          source: "المعجم الكبير — جموع"
          addition: "ثلاثة جموع تكسير مسجّلة"
    - lemma: "شِدْيَاقٌ"
      confirm:
        - text: "«وجمعها شَدايقة: شماس رسائلي»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«(عند بعض النصارى): مَنْ يُمارسُ خدمةَ الكاهنِ والترتيلَ معه فى أوقات الصلواتِ»"
          source: "المعجم الكبير (OCR)"
        - text: "«الشَّمّاس؛ الشِّدياق (كن).»"
          source: "المورد الحديث (2008) — ترجمة deacon"
      expands:
        - text: "«لقبُ أحمد فارس الشِّدياق (١٣٠٤هـ = ١٨٨٧م). صحفىٌّ ولغوىٌّ وشاعرٌ لبنانىٌّ»"
          source: "المعجم الكبير (OCR)"
          addition: "اللفظ أصبح أيضاً لقباً عائلياً مشهوراً"
    - lemma: "خَادِمٌ"
      contradicts:
        - text: "«من يخدم غيره (أمة أو عبدا)»"
          source: "المعجم الكبير (OCR)"
          conflict: "المعنى عامّ تماماً ولا يختصّ بالرتبة الكنسية"
        - text: "«مَنْ خدم أحداً ومَهَنه وعمل له وهو واحدُ الخَدَم غلاماً كان أو جاريةً.»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "تعريف فقهي عامّ لا علاقة له بالرتب الكنسية"
    - lemma: "دِيَاقُونٌ"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "شَمَّاسٌ"
      decision: confirmed
      decision_reason: "لفظ معرَّب من السريانية مثبت في أكبر المعاجم العربية (الوسيط، الكبير، المورد) بتعريف مطابق تماماً لمعنى المجموعة الترادفية. له شاهد شعري جاهلي (عنترة) يدلّ على قِدَم تداوله. الجموع مسجّلة (شمامسة، شمامس، شماميس). يقبل ال-التعريف والنسبة والجمع — تعريب مكتمل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ الأعمّ والأشهر استعمالاً في جميع الطوائف المسيحية العربية، وهو المصطلح المعياري في المعاجم الحديثة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَمَّاسٌ"

    - lemma: "شِدْيَاقٌ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ موثّق في المعجم الكبير وتكملة المعاجم والمورد الحديث بوصفه مرادفاً لشمّاس في السياق الكنسي. يُستعمل عند بعض الطوائف المسيحية العربية (خاصة المارونية). له جمع مسجّل (شدايقة). يقبل ال- والنسبة (شِدياقيّ)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل خاصّة في الطوائف المسيحية الشرقية (المارونية واللبنانية)، ويدلّ على مَنْ يمارس الترتيل وخدمة الكاهن في الصلوات، بينما «شمّاس» أعمّ وأشيع."
      actions:
        - command: create_entry
          params:
            lemma: "شِدْيَاقٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "خَادِمٌ"
      source: stage1
      decision: removed
      decision_reason: "لفظ عامّ يدلّ على مَنْ يخدم غيره مطلقاً، ولم يُثبت في أيّ معجم عربي بمعنى الرتبة الكنسية تحديداً. يؤدّي إلى التباس شديد مع المعاني العامّة والتقنية (خادم حاسوبي = server)."
      evidence_assessment:
        case: contradicts_only

    - lemma: "دِيَاقُونٌ"
      source: stage1
      decision: removed
      decision_reason: "لا وجود لهذا اللفظ في أيّ معجم عربي من المعاجم المستشارة. التعريب لم يُثبت ولم يشِع في الاستعمال العربي؛ وقد استغنت العربية عنه بلفظ «شمّاس» المأخوذ من السريانية."
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "رجل دين رتبته أقل بقليل من الكاهن في الكنائس المسيحية؛ إحدى الرتب الكهنوتية المقدسة"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم «الكاهن» وهو مصطلح غير دقيق في هذا السياق؛ المعاجم العربية تستخدم «القسّيس» للرتبة الأعلى مباشرة من الشمّاس. كما أنّ عبارة «أقل بقليل» ركيكة أسلوبياً."
    authored:
      - type: terminological
        text: "رُتْبَةٌ كَنَسِيَّةٌ مِنَ الرُّتَبِ الكَهَنُوتِيَّةِ المُقَدَّسَةِ، صاحبُها دونَ القِسِّيسِ مَنزِلَةً، يقومُ بِالخِدمَةِ الكَنَسِيَّةِ ومُساعَدَةِ القِسِّيسِ في وَظائِفِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "إِحْدَى الرُّتَبِ الكَهَنُوتِيَّةِ المُقَدَّسَةِ فِي الكَنَائِسِ المَسِيحِيَّةِ، مَنْزِلَتُهَا دُونَ القِسِّيسِ. يَقُومُ الشَّمَّاسُ بِخِدْمَةِ المَذْبَحِ والتَّرتِيلِ ومُعَاوَنَةِ الكَاهِنِ فِي الصَّلَوَاتِ والطُّقُوسِ. اللَّفْظُ مُعَرَّبٌ مِنَ السُّرْيَانِيَّةِ «شَمَّاشَا» أَيْ خَادِمُ الأَسْرَارِ المُقَدَّسَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "رُتْبَةٌ كَنَسِيَّةٌ مِنَ الرُّتَبِ الكَهَنُوتِيَّةِ المُقَدَّسَةِ، صاحبُها دونَ القِسِّيسِ مَنزِلَةً، يقومُ بِالخِدمَةِ الكَنَسِيَّةِ ومُساعَدَةِ القِسِّيسِ في وَظائِفِهِ."

  examples:
    per_lemma:
      - lemma: "شَمَّاسٌ"
        examples:
          - text: "رُسِمَ شَمَّاساً في كَنيسَةِ القِدِّيسِ مَرقُسَ، وباشَرَ خِدمَةَ المَذبَحِ والتَّرتيلَ مَعَ القِسِّيسِ."
            type: usage
          - text: "أوِ اغتَبَقـوهــا بَينَ قسٍّ وشَمَّاسِ"
            type: poetry
            source: "عنترة بن شدّاد"
      - lemma: "شِدْيَاقٌ"
        examples:
          - text: "عُيِّنَ شِدياقاً في الكَنيسَةِ المارونِيَّةِ، فَكانَ يُرَتِّلُ مَعَ الكاهِنِ في أَوقاتِ الصَّلَواتِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "رُسِمَ شَمَّاساً في كَنيسَةِ القِدِّيسِ مَرقُسَ، وباشَرَ خِدمَةَ المَذبَحِ والتَّرتيلَ مَعَ القِسِّيسِ."
      - command: add_sense_example
        params:
