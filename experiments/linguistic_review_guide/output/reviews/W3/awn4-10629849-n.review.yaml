# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «متزلج بالزلاجة» عبارةٌ وصفية حرّة تحوي مكوّنًا حرفيًّا جارًّا (بالزلاجة)، ولا تُعدّ مصطلحًا مسكوكًا ثابتًا في المعجمية العربية"
      - "لفظ «متزلج» وحده مصطلحٌ أعمّ يشمل التزلج على الجليد بعمومه (تزلج، تزحلق)، فالتوسيع بـ«بالزلاجة» غير كافٍ لضبط الدلالة معجميًّا"
      - "لفظ «زلاجة» في التعريف يحيل في المعاجم الكلاسيكية والحديثة على لوح التزلج على القدمين (ski)، لا على مركبة الثلج ذات المزالج (sled)"
      - "المجموعة خالية تمامًا من أي مصطلح عربي مسكوك يوازي الإنجليزية sledder المشتقة من sled"
    observations: >
      تتناول هذه المجموعة رياضيًّا مختصًّا بركوب مركبة الثلج الانزلاقية (sled)
      المستخدمة في رياضات مثل اللوج والزلاجة الطائرة (bobsled). ويُعدّ الواجب
      المصطلحي هنا التمييزَ الدقيق بين ثلاثة مفاهيم متداخلة في العربية:
      (أ) التزلج الجليدي على القدمين (skiing)، (ب) التزحلق على الجليد
      (ice skating)، (ج) ركوب مركبة الثلج (sledding). المعاجم الحديثة كالمورد
      الحديث تستخدم «مِزْلَجَة» للسلج (sled) و«التَّمَزْلُج» لفعل الركوب،
      مما يتيح اشتقاقًا صريحًا لمصطلح فاعله.

  blind_candidates:
    - lemma: "زَلَّاجٌ"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من الجذر (زلج) يدل على كثير الممارسة لفعل الزلج.
        من أوزان المبالغة والاحتراف التي تستعملها العربية لأصحاب الحرف
        والرياضات (كسبّاح، رمّاح). يُعرب ويجمع جمع مذكر سالمًا.
    - lemma: "مُتَزَلِّجٌ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من تزلَّج (باب تفعّل) يدل على المنخرط في فعل الانزلاق.
        الوزن مُتَفَعِّل يُعبّر عن التكلّف والمزاولة المقصودة، وهو ما
        يناسب الممارسة الرياضية. شائع الاستخدام في السياق الرياضي الحديث.
    - lemma: "رَاكِبُ الزَّلاجَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي (مضاف ومضاف إليه): راكب + الزلاجة. صريح دلاليًّا على
        الشخص الذي يركب مركبة الانزلاق. الاشتقاق من «ركب» فاعلًا دالًّا
        على الاستعمال والممارسة، وإضافته إلى «الزلاجة» تحدّد أداة الركوب.
    - lemma: "سَائِقُ الزَّلاجَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: سائق + الزلاجة. يُبرز البُعد التحكّمي في توجيه المركبة،
        إذ إن بعض رياضات الزلاجة كالبوبسليد والمونوبوب تتطلب قيادةً فعليةً
        لا مجرد ركوب. فاعل من ساق (يَسوق) بمعنى يوجّه ويتحكم.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
# ١. مطابقة دفعية: متزلج بالزلاجة + زلاج + متزلج + راكب الزلاجة + سائق الزلاجة + زلاجة + زلج
# ٢. استعلام مُكمَّل: متمزلج + مزلجة + تمزلج + مزلج
# ٣. جسر إنجليزي: sledder + sled + sledding + toboggan + luge + bobsled
# ٤. بحث FTS عربي: زلاجة + زلاج + تزلج + ثلج
stage2_evidence:
  per_lemma:
    # ── اللمة الموجودة ──────────────────────────────────────────
    - lemma: "متزلج بالزلاجة"
      expands:
        - text: >
            «التَّزَلُّجُ: في التربية الرياضية: رياضةُ الانزلاقِ على الماءِ أو الجليدِ»
          source: "المعجم الكبير"
          addition: >
            يثبت أن «تزلّج» و«متزلج» يُستعملان للرياضة الانزلاقية العامة
            (على الجليد أو الماء) دون تخصيص لركوب مركبة الزلاجة (sled)،
            مما يجعل «متزلج» وحده مصطلحًا مشتركًا بين الزلج بالزلاجة والتزلج
            الرياضي العام.
        - text: >
            «الزَّلاَّجَةُ: لوحٌ مستطيلٌ غيرُ عريضٍ، يكون مدبَّبًا أو منحنيًا
            لأعلى عند مقدِّمته، يُثبَّتُ في أسفل كلٍّ من القدمين لتسهيل
            التزلُّجِ على الجليد أو فوق سطح الماء»
          source: "المعجم الكبير"
          addition: >
            يكشف أن «زلاجة» في التراث اللغوي الحديث تعني الـski (لوح يُثبَّت
            في القدم)، لا الـsled (مركبة تُركَب). ومن ثَمَّ فإن «متزلج
            بالزلاجة» يُوهم بأنه متزلّج على الجليد لا راكب مركبة الزلاجة.

    # ── مرشح ١: زَلَّاج ──────────────────────────────────────
    - lemma: "زَلَّاجٌ"
      contradicts:
        - text: >
            «الزَّلَّاجُ: ضربٌ من الزوارق النهريةِ الخفيفةِ السريعةِ،
            كان معروفًا في مصرَ إبّانَ الفتحِ الإسلامي»
          source: "المعجم الكبير"
          conflict: >
            «الزلاج» في المعاجم دالٌّ على نوع زورق نهري خفيف، لا على
            شخص يمارس رياضة الزلاجة. الاشتراك اللفظي يجعل هذا المصطلح
            غير صالح للاستخدام دون إيقاع التباس.
        - text: >
            «الزَّلاَّجُ: المِغلاقُ، يُفتَحُ باليدِ أو بالمفتاح»
          source: "المعجم الكبير"
          conflict: >
            يحمل لفظ «الزلاج» أيضًا دلالة المغلاق (bolt/latch)، مما يُكثّف
            الاشتراك اللفظي ويُعيق استخدامه مصطلحًا رياضيًّا.

    # ── مرشح ٢: مُتَزَلِّج ──────────────────────────────────
    - lemma: "مُتَزَلِّجٌ"
      expands:
        - text: >
            «التَّزَلُّجُ: في التربية الرياضية: رياضةُ الانزلاقِ على الماءِ
            أو الجليدِ»
          source: "المعجم الكبير"
          addition: >
            «تزلّج» فعلٌ عام للانزلاق الرياضي بكل أشكاله. «مُتَزَلِّج» اسم
            فاعله صالحٌ للتزلج على القدمين (skiing) وعلى الجليد (skating)
            وسائر الأشكال، دون تخصيص لركوب الزلاجة (sled).
        - text: >
            «تزلج: زلج وَالشراب أكثر من شربه»
          source: "المعجم الوسيط (الهوراماني)"
          addition: >
            التعريف الهوراماني لتزلّج يُثبت وجود معنى آخر (الإكثار من الشرب)،
            مما يُشير إلى تعدد دلالات الجذع «تزلج» وضرورة التحديد.

    # ── مرشح ٣: رَاكِبُ الزَّلاجَةِ ──────────────────────────
    - lemma: "رَاكِبُ الزَّلاجَةِ"
      evidence_status: "no_material_found"

    # ── مرشح ٤: سَائِقُ الزَّلاجَةِ ──────────────────────────
    - lemma: "سَائِقُ الزَّلاجَةِ"
      evidence_status: "no_material_found"

    # ── مصطلح مكتشف من الأدلة: مُتَمَزْلِجٌ ──────────────────
    - lemma: "مُتَمَزْلِجٌ"
      confirm:
        - text: >
            «sled: (1) مِزْلَجَة — (2) يُمَزْلِج: ينقل بمِزْلجة —
            (3) يَتَمَزْلَج: يركب مِزلَجةً / يَرحل بمِزلَجة —
            كلبُ المَزالج: كلبٌ مدرَّب على جرّ المِزلجة»
          source: "المورد الحديث (ARABTERM)"
        - text: >
            «sledding: (1) التَّمَزْلُج: ركوب المِزْلَجة —
            (2) المَزْلَجَة: النقل بمِزلَجة —
            (3) المِزْلاجيّة: الأحوال الملائمة للتَّمَزلُج»
          source: "المورد الحديث (ARABTERM)"
        - text: >
            «bobsled: (1) الزَّلّاجة / مِزلجة قصيرة تُقرَن عادةً بأخرى مماثلة /
            مِزلجة مزدوجة على هذا النحو — (2) ينزلق [على الجليد] بزلاجة»
          source: "المورد الحديث (ARABTERM)"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمة الموجودة ──────────────────────────────────────────
    - lemma: "متزلج بالزلاجة"
      decision: removed
      decision_reason: >
        اللمّة تعبيرٌ وصفي مركّب من اسم فاعل وجار ومجرور، وليست وحدةً معجميةً
        ثابتةً. تفشل اختبارَ السكّ: يمكن إبدال «بالزلاجة» بـ«على الزلاجة»
        أو «فوق الزلاجة» مع احتفاظ التعبير بصلاحيته الوصفية، مما يثبت أنه
        عبارة لا مصطلح. فضلًا عن ذلك، «متزلج» وحده مصطلحٌ عام يشمل كل
        أنواع التزلج بما فيها skiing وice skating، فإضافة «بالزلاجة» تمييزٌ
        معجميٌّ هشّ. والبديل الأدقّ والأكثر إيجازًا هو «مُتَمَزْلِجٌ» المشتق
        من المصطلح المعتمد «مِزْلَجَة» (sled) عند المورد الحديث.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح ١: زَلَّاج ──────────────────────────────────────
    - lemma: "زَلَّاجٌ"
      source: stage1
      decision: removed
      decision_reason: >
        مردودٌ بالأدلة المعجمية: «الزَّلَّاج» في المعجم الكبير يدل على زورق
        نهري خفيف وعلى المغلاق (bolt). الاشتراك اللفظي الثقيل يجعل
        إحياء هذا اللفظ بدلالة «ركاب الزلاجة» مُلبِسًا لا مُوضِّحًا.
        مبدأ إيثار التراثي لا يُوجب اقتحام اللفظ المستعمل باشتراك ضار.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── مرشح ٢: مُتَزَلِّج ──────────────────────────────────
    - lemma: "مُتَزَلِّجٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «مُتَزَلِّج» اسم فاعل من تزلّج، وهو مصطلحٌ أعمّ يشمل الزلج على
        الجليد والماء بعمومه، ويُستخدم شائعًا بمعنى الـskier في الرياضة
        الحديثة. تخصيصه بركوب مركبة الزلاجة (sled) يستلزم قرينةً خارجيةً
        دائمًا. وبوجود «مُتَمَزْلِجٌ» المشتق مباشرةً من «مِزْلَجَة» (sled)،
        يغدو «مُتَزَلِّجٌ» مبهمًا في هذا الموضع.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    # ── مرشح ٣: رَاكِبُ الزَّلاجَةِ ──────────────────────────
    - lemma: "رَاكِبُ الزَّلاجَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي توثيق معجمي لهذا التركيب كوحدة ثابتة. يفشل اختبار
        التثبيت المعجمي: يمكن استبدال «راكب» بـ«مستقلّ» أو «مستعمل» مع
        احتفاظ التعبير بمعناه، مما يثبت أنه وصفٌ لا مصطلح. التركيب الإضافي
        الوصفي الحرّ ليس وحدةً اصطلاحيةً في حد ذاته.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح ٤: سَائِقُ الزَّلاجَةِ ──────────────────────────
    - lemma: "سَائِقُ الزَّلاجَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي. كذلك يُضيّق المصطلح الدلالة تضييقًا مُخِلًّا: كثير
        من ركّاب الزلاجات لا «يسوقون» بل يُشكّلون حمولة بشرية فحسب (كالمقعد
        الخلفي في البوبسليد). التركيب وصفيٌّ لا اصطلاحي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مصطلح مكتشف من الأدلة: مُتَمَزْلِجٌ ──────────────────
    - lemma: "مُتَمَزْلِجٌ"
      decision: confirmed
      decision_reason: >
        مصطلحٌ مشتق من «مِزْلَجَة» (sled)، وهو المقابل المعتمد في المورد
        الحديث (ARABTERM). الفعل «تَمَزْلَجَ» مُسجَّلٌ بمعنى «ركب مِزلَجةً»،
        واسم فاعله «مُتَمَزْلِجٌ» = من يركب المِزلَجة. يجري على قياس
        الاشتقاق من الأسماء الرباعية بالباب الخامس (تَفَعْلَلَ). يُعبَّر
        عنه بكلمة مفردة دون حاجة إلى قيد جارّ، ويُميَّز بدقة عن «مُتَزَلِّج»
        (skier/skater) الذي يشتق مباشرةً من الفعل زلَّج لا من الأداة مِزْلَجَة.
        يقبل التثنية والجمع (مُتَمَزْلِجون) ولام التعريف والنسبة (تَمَزْلُجِيّ).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختصُّ بشخص يركب مركبةَ الثلج الانزلاقية (مِزْلَجَة)، بخلاف «رياضي»
        الذي هو المصطلح العام الأشمل، و«مُتَزَلِّج» الذي يشمل التزلج
        على الجليد بعمومه بما فيه skiing وice skating.
      actions:
        - command: create_entry
          params:
            lemma: "مُتَمَزْلِجٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
