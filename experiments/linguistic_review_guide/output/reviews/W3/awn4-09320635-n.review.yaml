      decision: confirmed
      decision_reason: "الاسم الجغرافي المعتمد والشائع في الأطالس العربية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ كَامْبِيتْشِي"
    - lemma: "خَلِيجُ كَمْبِيش"
      source: stage1
      decision: confirmed
      decision_reason: "يتفق مع التعريب العلمي المعتمد في المكنز الزراعي (AGROVOC)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "خَلِيجُ كَمْبِيش", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09320635-n"}
    - lemma: "خَلِيجُ كَامْبِيشِي"
      source: stage1
      decision: confirmed
      decision_reason: "بديل تعريبي شائع يراعي قواعد النطق العربي للأسماء الأجنبية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "خَلِيجُ كَامْبِيشِي", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-09320635-n"}
    - lemma: "جَوْنُ كَامْبِيتْشِي"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من صحته لغوياً، إلا أن (الخليج) هو المصطلح المستقر جغرافياً لهذا المعلم."

stage4_content:
  definition:
    current: "جزء من خليج المكسيك إلى الغرب من يوكاتان"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب ويحتاج إلى ضبط بأسلوب المعاجم العربية مع تحديد طبيعة المعلم الجغرافي (شبه جزيرة يوكاتان)."
    authored:
      - type: terminological
        text: "خَلِيجٌ بَحْرِيٌّ يَقَعُ فِي الجُزْءِ الجَنُوبِيِّ لِخَلِيجِ المَكْسِيكِ، إِلَى الغَرْبِ مِنْ شِبْهِ جَزِيرَةِ يُوكَاتَان."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09320635-n", definition_index: 0, text: "خَلِيجٌ بَحْرِيٌّ يَقَعُ فِي الجُزْءِ الجَنُوبِيِّ لِخَلِيجِ المَكْسِيكِ، إِلَى الغَرْبِ مِنْ شِبْهِ جَزِيرَةِ يُوكَاتَان."}
  examples:
    per_lemma:
      - lemma: "خَلِيجُ كَامْبِيتْشِي"
        examples:
          - text: "يُعَدُّ خَلِيجُ كَامْبِيتْشِي مَوْطِناً لِبَعْضِ أَكْبَرِ حُقُولِ النِّفْطِ فِي المَكْسِيكِ."
            type: usage
      - lemma: "خَلِيجُ كَمْبِيش"
        examples:
          - text: "تَمْتَازُ الثَّرْوَةُ السَّمَكِيَّةُ فِي خَلِيجِ كَمْبِيش بِتَنَوُّعِهَا الكَبِيرِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يُعَدُّ خَلِيجُ كَامْبِيتْشِي مَوْطِناً لِبَعْضِ أَكْبَرِ حُقُولِ النِّفْطِ فِي المَكْسِيكِ."}

