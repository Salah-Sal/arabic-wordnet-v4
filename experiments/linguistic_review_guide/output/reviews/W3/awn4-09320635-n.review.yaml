stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - لا توجد لمات مرادفة تدعم التنوع الاصطلاحي (مثل التعريب العلمي في المعاجم المتخصصة).
    observations: "المجموعة تشير إلى معلم جغرافي محدد (خليج كامبيتشي). الترجمة الحالية دقيقة من حيث الدلالة، ولكنها تحتاج إلى ضبط معجمي وإضافة بدائل تعريبية فصيحة."
  blind_candidates:
    - lemma: "خَلِيجُ كَامْبِيتْشِي"
      generation_method: tarkib
      justification: "التعريب الأشيع والأساسي للاسم الجغرافي (Campeche) مع المكون النوعي (Gulf)."
    - lemma: "خَلِيجُ كَمْبِيش"
      generation_method: tarkib
      justification: "بناءً على تعريب (Campeche) بـ(كمبيش) في المكنز الزراعي (AGROVOC)."
    - lemma: "جَوْنُ كَامْبِيتْشِي"
      generation_method: tarkib
      justification: "استخدام (جون) كبديل لـ(خليج) في سياق المسطحات المائية المحاطة باليابسة."
    - lemma: "خَلِيجُ كَامْبِيشِي"
      generation_method: tarkib
      justification: "صيغة تعريبية بديلة شائعة تعتمد إبدال (ch) الإسبانية بـ(ش) العربية."

