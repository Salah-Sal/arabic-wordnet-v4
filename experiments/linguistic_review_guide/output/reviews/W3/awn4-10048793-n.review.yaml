# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id: awn4-10048793-n  |  ili: i89605  |  pos: n
# lemma: رسام  |  drawer (an artist skilled at drawing)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «رسام» مكتوبة بدون تشكيل، والصواب «رَسَّام» على وزن فَعَّال الدالّ على الاحتراف"
      - "التعريف الحالي «فنان ماهر في الرسم» وصفيٌّ مبتسَر ويفتقر إلى الفصل النوعي الكافي الذي يُميِّز الرسَّام عن سائر الفنانين"
    observations: >
      المجموعة الترادفية تُصنِّف فناناً متخصصاً في فن الرسم.
      اللمّة «رسام» صيغةٌ عربية فصيحة راسخة على وزن «فَعَّال» الدالّ على الحرفة والاحتراف،
      وقد أقرّ مجمع اللغة العربية قياسيّة هذا الوزن للدلالة على الاحتراف.
      المجموعة الأم (فنان / مبدع) أوسع دلالةً، والرسام أخصّ منها بتخصّصه في الرسم.
      التعريف العربي الحالي صحيح المعنى لكنه يفتقر إلى صياغة معجمية دقيقة تجمع الجنس القريب والفصل النوعي.

  blind_candidates:
    # ── توليد أعمى من التعريف "فنان ماهر في الرسم" ──
    - lemma: "رَاسِمٌ"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من رَسَمَ يَرْسُمُ على وزن فَاعِل، يدلّ على من يقوم بفعل الرسم؛
        وهو أخفّ صياغةً من «فعّال» في الدلالة على مجرد الممارسة لا الاحتراف.
    - lemma: "مُصَوِّرٌ"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من صَوَّرَ يُصَوِّرُ على وزن مُفَعِّل، يدلّ على من يُنشئ الصُّوَر؛
        والتصوير يشمل الرسم والتشكيل وهو مرتبط بالمعنى الوظيفي لإنشاء المرئيات.
    - lemma: "خَطَّاطٌ"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من جذر (خ ط ط)، يدلّ على المحترف في رسم الخطوط والزخارف،
        مُستعمَل في سياق الفنانين التشكيليين المتخصصين.
    - lemma: "نَقَّاشٌ"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من جذر (ن ق ش)، يدلّ على محترف الرسم الغائر والنقش على الأسطح؛
        فالنقش ضرب من الرسم يجمع الدقة والمهارة الفنية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # ── ملاحظات الاستعلام ──
  # الاستعلام ١: مطابقة دفعية — رسام, راسم, مصور, خطاط, نقاش (مع ال- وبدونها)
  # الاستعلام ٢: جسر إنجليزي — drawer, draughtsman, draftsman, illustrator, artist
  # الاستعلام ٣: مقاييس اللغة — جذور رسم / صور / نقش / خطط
  # الاستعلام ٤: شواهد وإثراء بالمعرّف — entry_ids من الاستعلام ١
  # المجموع: ٤ استعلامات

  per_lemma:

    # ───────── رسام (اللمّة الموجودة) ─────────
    - lemma: "رسام"
      confirm:
        - text: "«مَن يرسم بالقلم أشكالاً، أو صُوراً، أو خطوطاً»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«من يَحْتَرِفُ الرَّسْمَ، مَن يَنْقُشُ الألواحَ، مَن يَرْسُم بالقَلَمِ وغَيْرِه أشكالاً أو صُوَرًا أو خطوطًا»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«(الرسام) من يرسم بالقلم أشكالا أَو صورا أَو خُطُوطًا»"
          source: "المعجم الوسيط — رواية حوراماني"
        - text: "«رسَّام: من يرسم بالقلم أشكالا أو صورا أو خطوطا والكثير الخط على الورق والكتابة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) النّادِل؛ السّاقي [في حانة] (2) الرَّسّام (3) ساحب الحَوالة (4) pl.: سِروال تحتانيّ (5) دُرْج؛ جارور»"
          source: "المورد الحديث (2008) — مقابل كلمة drawer"
          addition: "يُثبت أن «رسام» هو المقابل العربي المعتمد لـ drawer بمعنى الرسام الفنان"
        - text: "«(1) المُصَمِّم؛ المُخَطِّط… (3) الرَّسّام»"
          source: "المورد الحديث (2008) — مقابل كلمة draftsman"
      expands:
        - text: "«رسّام توضيحي» مقابل illustrator / «رسّام تنفيذي» مقابل draughtsman (or: draftsman) / «رسّام إنشائي» مقابل structural draftsman / «رسام الزجاج» مقابل artist in stained glass"
          source: "المعاجم الموحّدة لمصطلحات التقنيات التربوية والهندسة المدنية (ARABTERM)"
          addition: >
            تُثبت هذه المركّبات الاصطلاحية أن «رسام» هو الجذع المعجمي الحي والمُنتِج
            الذي تتفرّع منه مصطلحات الرسم التقني والفني معاً في المعجمية العربية الحديثة.

    # ───────── رَاسِمٌ (مرشح أعمى ١) ─────────
    - lemma: "رَاسِمٌ"
      contradicts:
        - text: "«الرَّاسِمُ: الماء الجارى»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "الدلالة المستقرّة لـ«رَاسِم» في المعجمية العربية هي الماء الجاري، لا الفنان الرسام"
        - text: "«(الراسم) المَاء الْجَارِي (ج) رواسم»"
          source: "المعجم الوسيط — رواية حوراماني"
          conflict: "تؤكد أن الدلالة الأولى والمستقرّة هي الماء الجاري"
        - text: "«وَقِيلَ الرَّاسِمُ: الْمَاءُ الْجَارِي. فَإِنْ كَانَ صَحِيحًا فَلِأَنَّهُ إِذَا جَرَى أَثَّرَ وَأَبْقَى الرَّسْمَ»"
          source: "مقاييس اللغة لابن فارس — مادة (رسم)"
          conflict: "ابن فارس نفسه يتشكّك في صحة هذا القول مما يدلّ على ضعف هذا الاستعمال أصلاً"
      expands:
        - text: "«رَاسِم: وحدة إخراج للحاسوب لرسم المخططات، وهي طابعة كبيرة الحجم تنتج مستندات عالية الجودة»"
          source: "مسرد التربية — ARABTERM (مقابل plotter)"
          addition: "«راسم» في المصطلحية الحديثة تحوّل إلى مصطلح تقني (جهاز الرسم/plotter) لا إلى فنان رسام"

    # ───────── مُصَوِّرٌ (مرشح أعمى ٢) ─────────
    - lemma: "مُصَوِّرٌ"
      confirm:
        - text: "«مَنْ حِرْفَتُه التَّصويرُ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«من حِرْفتُه التصوير»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«من حرفته التَّصْوِير»"
          source: "المعجم الوسيط — رواية حوراماني"
        - text: "«خَرَجْتَ به عن طَوْق كُلِّ مُصَوِّرٍ / يُجيدُ دقيقَ الفَنِّ فِي جَوْفِ مَصْنَعِ»"
          source: "حافظ إبراهيم (المعجم الكبير)"
        - text: "«أما الْمُصَوِّرُ فَهُوَ فَتَّانٌ يَرَى / ما كان مِنْ صُوَر الحياةِ دقيقا»"
          source: "معروف الرُّصافي (المعجم الكبير)"
      contradicts:
        - text: "«من أسماءِ اللهِ الحُسْنَى, وهو الذى صَوَّر جميع الموجودات ورتَّبها»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            «المُصَوِّر» من أسماء الله الحسنى، مما يُوجد مشتركاً لفظياً مع الاسم الإلهي
            يجعل توظيفه لمّةً في سياق الفنان مُشكلاً دينياً ولغوياً
        - text: "«مُصَوِّر: من (ص و ر) من حرفته التصوير، والمصور: من أسماء الله الحسنى»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المعجم يُدرج الاسم الإلهي والحرفة معاً في مدخل واحد مما يُبرز الاشتراك اللفظي"

    # ───────── خَطَّاطٌ (مرشح أعمى ٣) ─────────
    - lemma: "خَطَّاطٌ"
      confirm:
        - text: "«من حِرْفته الخَطُّ»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(الخطاط) من حرفته الْخط»"
          source: "المعجم الوسيط — رواية حوراماني"
      contradicts:
        - text: "«الخَطَّاطُ: ذَرُورٌ يُسْتَخْدمُ لتَسْويدِ شَعْرِ الحاجِبِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "وجود دلالة ثانية منفصلة تماماً (مستحضر تجميلي) يدلّ على اشتراك لفظي"
        - text: "«خطّاط: شخص كان في الماضي يرسم العناوين الكبيرة للجرائد والتلفزة بالقلم»"
          source: "مسرد الإعلام والتواصل — ARABTERM (مقابل calligrapher)"
          conflict: >
            «الخطاط» في المصطلحية الحديثة مخصّص للمحترف بالخطّ العربي الزخرفي (calligrapher)
            لا للرسام الفنان العام (drawer/artist)؛ وهذا أخصّ مما تتطلبه المجموعة

    # ───────── نَقَّاشٌ (مرشح أعمى ٤) ─────────
    - lemma: "نَقَّاشٌ"
      confirm:
        - text: "«مَن حرفته النَّقْش»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«من حرفته زخرفة الأشياء وتزيينها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: >
            «نَقَّاش الرُّخام [صحيحة] … ورد بناء «فَعّال» للدلالة على الحرفة بقلَّة، ثم شاع هذا الاستعمال
            في مراحل العربية المتأخرة»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: >
            «نقاش» بدلالة الرسام / النقّاش ورد في المعاجم القديمة بقلّة، مما يدلّ على محدودية رسوخه
            في التراث اللغوي الكلاسيكي
        - text: "«تبادل الحديث حول موضوع مختَلَف فيه»"
          source: "مسرد الإعلام والتواصل — ARABTERM (مقابل talk / discussion)"
          conflict: >
            «نِقَاش» (بالكسر) بمعنى المناقشة والحوار شائعٌ في العربية الحديثة المحكية والمكتوبة
            مما يُنشئ التباساً صوتياً وكتابياً مع «نَقَّاش» بالتشديد، فيُضعف صلاحيته مصطلحاً


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ─── رسام (اللمّة الموجودة) ───
    - lemma: "رسام"
      decision: confirmed
      decision_reason: >
        «رَسَّام» صيغة عربية فصيحة راسخة على وزن فَعَّال الدالّ على الاحتراف والمبالغة،
        مُثبَتة في كبريات المعاجم الحديثة (الوسيط، الكبير) بالدلالة ذاتها، ومُعتمَدة في ARABTERM
        جذعاً لسلسلة مصطلحية وافرة (رسام توضيحي، رسام تنفيذي، رسام إنشائي…).
        الوزن يناسب الوظيفة الدلالية (حِرفة) اطّراداً قياسياً مُقرَّراً عند مجمع اللغة العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «الرَّسَّامُ» أخصّ من المُشترك الأعلى «الفنان» في المجموعة الأم؛ إذ يتخصّص في إنشاء
        الصور والأشكال بالأدوات الرسومية (قلم / فرشاة) دون سائر أنواع الفنون كالنحت والموسيقى.
        داخل المجموعة الراهنة لا تنافس بين اللمّات إذ هي لمّة منفردة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَسَّامٌ"

    # ─── رَاسِمٌ (مرشح أعمى ١) ───
    - lemma: "رَاسِمٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المستقرة لـ«رَاسِم» في المعجمية العربية هي «الماء الجاري» لا الفنان الرسام؛
        وهو ما أثبته الوسيط والمعاجم الحوراماني ومقاييس اللغة.
        أما إثباته «الخاط على الورق» في موسوعة قابوس فهو إثبات اسم عَلَم (شخص اسمه راسم)
        لا تعريف معجمي. فضلاً عن أن «راسم» تحوّل في المصطلحية الحديثة إلى جهاز الـ plotter،
        مما يُعمّق الالتباس. الاستبقاء يُوقع في المشترك اللفظي.
      evidence_assessment:
        case: contradicts_only

    # ─── مُصَوِّرٌ (مرشح أعمى ٢) ───
    - lemma: "مُصَوِّرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «المُصَوِّر» مُشترك لفظي عميق: يُطلق على اسم الله الحسنى، وعلى محترف التصوير الضوئي
        (photographer) في الاستعمال المعاصر، وعلى من يرسم الصور.
        إضافته للمجموعة يُفضي إلى ضبابية دلالية؛ فالمجموعة تُعنى بـ drawer
        (الرسم بالأدوات، لا التصوير الآلي أو الإلهي).
        الشواهد الشعرية إيجابية لكن لا تكفي لتجاوز المشترك اللفظي الخطير مع اسم الله.
      evidence_assessment:
        case: mixed

    # ─── خَطَّاطٌ (مرشح أعمى ٣) ───
    - lemma: "خَطَّاطٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «خَطَّاط» أخصّ من الرسام العام؛ دلالته في المعجمية الحديثة مُستقرّة على «محترف
        الخط العربي» (calligrapher) لا الرسام (drawer). كما أن للمصطلح دلالة ثانية (ذرور تجميلي)
        في المعجم الكبير. إضافته للمجموعة يُوهم بتضييق نطاقها إلى خطّاطي الحروف.
      evidence_assessment:
        case: mixed

    # ─── نَقَّاشٌ (مرشح أعمى ٤) ───
    - lemma: "نَقَّاشٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «نَقَّاش» بدلالة الرسام وردت في المعاجم القديمة بقلّة حسب معجم الصواب.
        دلالته المتخصصة (محترف النقش البارز والغائر) أضيق من المجموعة (فنان ماهر في الرسم عموماً).
        فضلاً عن الالتباس مع «نِقَاش» (مناقشة / حوار) الشائع في العربية الحديثة.
      evidence_assessment:
        case: mixed


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
