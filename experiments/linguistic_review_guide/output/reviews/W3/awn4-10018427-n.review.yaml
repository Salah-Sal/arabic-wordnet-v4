# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الأولى 'مزخرف' مكتوبة بدون تشكيل، وهي تحتمل قراءتين متضادتين: مُزَخْرِف (اسم فاعل = الديكوراتي/المزيِّن) أو مُزَخْرَف (اسم مفعول = الشيء المُزخرَف)؛ والمقصود في سياق المجموعة هو اسم الفاعل بكسر الراء."
      - "اللمة الثانية 'مصمم ديكور' تركيب إضافي يستخدم الكلمة المُعرَّبة 'ديكور' (من الفرنسية décor)، بينما المصطلح الموثَّق في المعاجم المتخصصة هو 'مصمم داخلي' أو 'منسق داخلي'."
      - "التعريف العربي الحالي يتضمن 'الديكور' وهو لفظ مقترض يُستحسن تعويضه بصياغة عربية أصيلة."
    observations: "المجموعة تضم مفهومَين متداخلَين: decorator بمعنى من يزخرف ويُزيّن الأماكن والأشياء، وornamentalist بمعنى المتخصص في فن الزخرفة وصنع النقوش. اللمة 'مزخرف' (بعد التصحيح: مُزَخْرِف) تُغطي المعنيين معاً، بينما 'مصمم ديكور' يميل إلى الدلالة على المصمم الداخلي. المجال الدلالي راسخ في التراث العربي عبر ألفاظ كالنقاش والزخرفي، ولكنه يفتقر إلى تشكيل صحيح وتوثيق معجمي كافٍ في AWN."
  blind_candidates:
    - lemma: "نَقَّاش"
      generation_method: ishtiqaq
      justification: "اشتقاق قياسي على وزن فَعَّال للحِرَف والمهن، من الجذر (ن ق ش) الدال على الإخراج والتحسين. النَّقَّاش: من يحترف تزيين الأسطح بالنقوش والزخارف، وهو أكثر الألفاظ العربية التراثية دقةً للدلالة على هذا المهني."
    - lemma: "زَيَّان"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن فَعَّال من الجذر (ز ي ن) الدال على حُسن الشيء وتحسينه؛ للدلالة على من يحترف الزينة والتزيين، قياساً على أوزان المهن كنجّار وحدّاد."
    - lemma: "وَشَّاء"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن فَعَّال من الجذر (و ش ي) الدال على تزيين الثياب بالألوان والنقوش؛ الواشي من يُبدع في وشي الأقمشة وتطريزها بالزخارف."
    - lemma: "مُنَسِّق الديكور"
      generation_method: tarkib
      justification: "تركيب إضافي: مُنَسِّق (اسم فاعل من الرباعي نسَّق، على وزن مُفَعِّل) + الديكور، للدلالة على الشخص الذي ينسِّق عناصر التزيين والزخرفة ويرتبها."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "مزخرف"
      confirm:
        - text: "«(1) المُزَخرِف / (2) المُزَخْرِف المحترِف [لداخل المنزل أو المكتب] / (3) صالحٌ للزخرفة الداخلية decorator fabrics»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الحرفُ الأولُ الْمُحَلَّى فى المخطوطات الأوروبية المحلاَّة فى العُصُورِ الوُسْطَى»"
          source: "المعجم الكبير"
          conflict: "هذا التعريف يخصّ المُزَخْرَف (اسم مفعول بفتح الراء) أي الشيء المُحلَّى، لا الشخص المُزَخْرِف (اسم فاعل بكسر الراء)؛ مما يكشف خطورة الاستعمال بلا تشكيل."
      expands:
        - text: "«زخرفة: ديكور» — المورد: decorator fabrics / décor"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "يُثبت أن الزخرفة تُرادف الديكور في المعجمية التربوية الحديثة، مما يدعم استخدام مُزَخْرِف مقابل decorator."

    - lemma: "مصمم ديكور"
      confirm:
        - text: "«مُصَمِّم — designer» (ضمن مجالات: الهندسة المدنية، هندسة المياه، التقنيات التربوية، الكهرباء)"
          source: "معاجم ARABTERM المتعددة"
      expands:
        - text: "«مصمم داخلي — interior designer»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "التركيب الموثَّق في المعاجم هو 'مصمم داخلي' (interior designer) وليس 'مصمم ديكور'؛ والشكل المُعرَّب 'ديكور' غير مُفضَّل."
        - text: "«مُنسِّق داخلي — interior decorator» — التعريف: كزخرفة داخل المنازل ونحوها"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "يُثبت أن 'منسق داخلي' هو المصطلح الموثَّق للديكوراتي (interior decorator)، وهو أدق من 'مصمم داخلي' في التطابق مع المعنى."

    - lemma: "نَقَّاش"
      confirm:
        - text: "«مَن حرفته النَّقْش»"
          source: "المعجم الوسيط"
        - text: "«من حرفته زخرفة الأشياء وتزيينها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«نَقَّاش الرُّخام [صحيحة] — التعليق: ورد بناء «فَعّال» للدلالة على الحرفة بقلَّة، ثم شاع هذا الاستعمال في مراحل العربية المتأخرة؛ ولذا فقد أقرّ مجمع اللغة المصري قياسيّة صيغة «فَعّال» للدلالة على الاحتراف أو ملازمة الشيء، وقد وردت كلمة «نَقَّاش» في المعاجم الحديثة كالوسيط والأساسي والمنجد»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«نَقَّاش: من (ن ق ش) من حرفته زخرفة الأشياء وتزيينها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُثبت أن نَقَّاش في المعجمية العربية يُقصد به من يزخرف الأشياء ويُزيّنها، وهو أدق تعريف للمفهوم المطلوب."

    - lemma: "زَيَّان"
      contradicts:
        - text: "«كلُّ ما يُتزيَّن به»"
          source: "المعجم الوسيط"
          conflict: "الزَّيَّان/الزِّيَان في المعجم الوسيط اسمٌ جامد يدل على الزينة والحُلي (أدوات الزينة)، لا على الشخص الذي يُزيِّن."
        - text: "«قَمَرٌ زَيَانٌ: حَسَنٌ»"
          source: "المعجم الكبير"
          conflict: "الزَّيَان هنا صفة مشبهة بمعنى الحَسَن الجميل، لا اسم فاعل للحِرفة."

    - lemma: "وَشَّاء"
      contradicts:
        - text: "«صيغة مبالغة، والنَّمَّام والكذَّاب، والذى يبيع ثياب الإبريسم»"
          source: "المعجم الوسيط"
          conflict: "الوَشَّاء في المعجمية العربية يدل على النمّام والكذّاب أو بائع ثياب الحرير، لا على مزيِّن الأماكن والأشياء."
        - text: "«كثرة المال»"
          source: "المعجم الوسيط"
          conflict: "الوَشاء (بالقصر) يعني كثرة المال، وهو مدلول آخر بعيد عن معنى المجموعة."

    - lemma: "مُنَسِّق الديكور"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مزخرف"
      decision: confirmed
      decision_reason: "المورد الحديث يُثبت بشكل صريح أن مُزَخْرِف (بكسر الراء، اسم الفاعل) هو المقابل العربي الصحيح لـ decorator. غير أن اللمة في AWN مكتوبة بلا تشكيل مما يجعلها محتملة للاسم المفعول المُزَخْرَف (بفتح الراء)، وهو خطأ دلالي فادح. يجب تصحيح التشكيل إلى مُزَخْرِف."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مُزَخْرِف يُركِّز على الجانب الفني الإبداعي في خلق الزخارف وابتكارها، مع دلالة على الأصالة الفنية والتراث الزخرفي؛ يُستعمل في السياق الفني والأثري والمعماري لمن يُبدع في صنع الزخرفة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُزَخْرِف"

    - lemma: "مصمم ديكور"
      decision: confirmed
      decision_reason: "المفهوم موثَّق في المعاجم المتخصصة بالصيغة الأقرب 'مُصَمِّم داخليّ' (interior designer) في ARABTERM؛ والشكل 'مصمم ديكور' يستخدم الكلمة المُعرَّبة 'ديكور' بدلاً من 'داخلي'. التركيب مقبول دلالياً لكنه يحتاج تعديلاً ليوافق المصطلح الموثَّق في المعاجم المتخصصة. الكلمة مُثبَّتة معجمياً كوحدة اصطلاحية في مجال التصميم."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مُصَمِّم داخليّ يُركِّز على التصميم الشامل والتخطيط المتكامل للفضاءات الداخلية، مع دلالة على الاحترافية والرؤية المعمارية؛ يُستعمل في سياقات الهندسة الداخلية والفنادق والمكاتب."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُصَمِّم داخليّ"

    - lemma: "نَقَّاش"
      source: stage1
      decision: confirmed
      decision_reason: "موثَّق في المعجم الوسيط وموسوعة السلطان قابوس بصراحة: 'من حرفته النقش' و'من حرفته زخرفة الأشياء وتزيينها'. مجمع اللغة المصري أقرَّ قياسية صيغة فَعَّال للحِرف، وأقرَّ نَقَّاش بذاتها. اللمة تُغطي المعنى الحرفي التقليدي للزخرفة والتزيين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "نَقَّاش يُركِّز على الجانب الحِرفي التقليدي في النقش على الأسطح (الرخام والخشب والجصّ والمعادن)، مع دلالة على المهارة اليدوية الدقيقة؛ يُستعمل في سياق الحِرف التقليدية والتراثية."
      actions:
        - command: create_entry
          params:
            lemma: "نَقَّاش"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10018427-n"

    - lemma: "زَيَّان"
      source: stage1
      decision: removed
      decision_reason: "الزَّيَّان/الزِّيَان في المعاجم المعتمدة يدل على الزينة والحُلي (أدوات التزيين، لا الشخص المُزيِّن)، أو صفة مشبهة بمعنى الحسن الجميل. ورودُه بمعنى الشخص المحترف للزينة في موسوعة السلطان قابوس هو في سياق أسماء الأعلام لا في سياق المصطلحات المهنية. لا يصلح لمّةً مستقلة بديلة عن مُزَخْرِف."

    - lemma: "وَشَّاء"
      source: stage1
      decision: removed
      decision_reason: "المعاجم المعتمدة (الوسيط والكبير) تُثبت أن الوَشَّاء يعني النمّام والكذّاب أو بائع ثياب الحرير، وهو مدلول مناقض تماماً لمعنى المجموعة. ورود وشى بمعنى تزيين الثياب هو فعل تصنيع النسيج الموشّى، لكن المشتق الوَشَّاء يحمل دلالة النميمة السلبية في الاستعمال الراسخ."

    - lemma: "مُنَسِّق الديكور"
      source: stage1
      decision: removed
      decision_reason: "الصيغة 'منسق الديكور' بكلمة 'الديكور' المعرَّبة غير موثَّقة في المعاجم. الصيغة الموثَّقة هي 'مُنَسِّق داخليّ' في ARABTERM، وهي تختلف عن المرشح المُولَّد. فضلاً عن ذلك، فإن 'منسِّق' تعني coordinator أساساً لا decorator؛ والدلالة على التزيين مستفادة من الوصف 'داخلي' لا من اللفظ نفسه."


