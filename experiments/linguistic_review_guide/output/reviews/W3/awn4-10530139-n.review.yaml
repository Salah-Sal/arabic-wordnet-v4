stage5_enrichment:
  per_entry:
    - lemma: "مُدْحِض"
      entry_id: "{auto}"
      root: "دحض"
      maqayis_quote: >
        «الدَّالُ وَالْحَاءُ وَالضَّادُ أَصْلٌ يَدُلُّ عَلَى زَوَالٍ وَزَلَقٍ.
        يُقَالُ دَحَضَتْ رِجْلُهُ: زَلِقَتْ. وَمِنْهُ دَحَضَتِ الشَّمْسُ: زَالَتْ.
        وَدَحَضَتْ حُجَّةُ فُلَانٍ، إِذَا لَمْ تَثْبُتْ. قَالَ اللَّهُ جَلَّ
        ثَنَاؤُهُ: {حُجَّتُهُمْ دَاحِضَةٌ عِنْدَ رَبِّهِمْ}»

    - lemma: "مُفَنِّد"
      entry_id: "{auto}"
      root: "فند"
      maqayis_quote: >
        «الْفَاءُ وَالنُّونُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ثِقَلٍ
        وَشِدَّةٍ... وَمِمَّا يُقَاسُ عَلَيْهِ التَّفْنِيدُ، وَهُوَ اللَّوْمُ،
        لِأَنَّهُ كَلَامٌ يَثْقُلُ عَلَى سَامِعِهِ وَيَشْتَدُّ. وَالْفَنَدُ:
        الْهَرَمُ. يُقَالُ أَفْنَدَ الرَّجُلُ فَهُوَ مُفْنِدٌ، إِذَا أُهْتِرَ»

    - lemma: "نَافٍ"
