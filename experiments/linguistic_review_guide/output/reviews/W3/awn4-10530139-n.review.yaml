        تَعْرِيَةِ شَيْءٍ مِنْ شَيْءٍ وَإِبْعَادِهِ مِنْهُ. وَنَفَيْتُ الشَّيْءَ
        أَنْفِيهِ نَفْيًا، وَانْتَفَى هُوَ انْتِفَاءً»

