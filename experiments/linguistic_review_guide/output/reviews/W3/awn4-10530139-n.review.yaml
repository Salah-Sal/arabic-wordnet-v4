# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يستخدم الفعلين «يدحض» و«يفند» مباشرةً في وصف الشخص المُعرَّف، مما يقترب من الدوران الاشتقاقي مع لمّتَي «مُدْحِض» و«مُفَنِّد»."
      - "لمّة «نافٍ» أعمّ دلالةً من المطلوب: النفي لا يستلزم الأدلة المعاكسة، بخلاف الدحض والتفنيد."
      - "اللمّات الثلاث غير مشكَّلة تشكيلاً كاملاً في بيانات AWN."
    observations: >
      المجموعة تصف فاعلاً إنسانياً متخصصاً في الجدل والنقض: هو «مناظر» لكنه
      مُقيَّد بوظيفة الدحض والتفنيد بالدليل المعاكس. الجنس القريب (مناظر) صحيح.
      الفصل النوعي (بأدلة أو حجج معاكسة) دقيق. اللمّات الثلاث تُغطّي الحقل
      الدلالي من زوايا مختلفة: الإسقاط (دحض)، وكشف الوهن (تفنيد)، والرفض (نفي).
      يستحسن مراجعة مدى انتساب «التفنيد» في الأصل اللغوي إلى معنى إبطال الحجة.

  blind_candidates:
    - lemma: "دَاحِضٌ"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من الثلاثي «دَحَضَ» (لا الرباعي أَدْحَضَ) على وزن فَاعِل.
        «دَحَضَتِ الحُجَّةُ»: بطلت. المرشَّح يُعبِّر عن «من تبطل بسببه الحجة»،
        في مقابل «مُدْحِض» (من أَدْحَضَ الرباعي) الموجود في المجموعة.
    - lemma: "نَاقِضٌ"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من «نَقَضَ» على وزن فَاعِل. النقض: هدم الشيء وإبطاله؛
        يُقال «نقض الحجة» أي هدمها وردَّها. يُعبِّر عن الإبطال البنيوي
        للادعاء، وهو أعمق من مجرد «نفي».
    - lemma: "مُبْطِلٌ"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من «أَبْطَلَ» على وزن مُفْعِل. يدل على من يُبطل ادعاءً
        أو حجةً ببيان زيفها؛ مقابلُهُ في المعنى صحيح تماماً للمفهوم المطلوب.
        قريبٌ دلالياً من «مدحض» لكن جذره مختلف.
    - lemma: "رَادٌّ"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من «رَدَّ» (ثلاثي مضاعف) على وزن فَاعِل. «رَدَّ الحجةَ»:
        أبطلها ولم يقبلها. «رَادٌّ للحجة» تعبير عربي أصيل، وقد وُظِّف
        في سياقات الجدل الكلامي للدلالة على من يردّ الادعاء ويبطله.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── لمّات AWN الموجودة ──

    - lemma: "مُدْحِض"
      confirm:
        - text: >
            «أَدْحَضَهَا اللَّهُ» ودَحَضَتِ الشمسُ: زَالَتْ. ودَحَضَتْ حُجَّةُ
            فُلَانٍ، إِذَا لَمْ تَثْبُتْ. قَالَ اللَّهُ: {حُجَّتُهُمْ دَاحِضَةٌ
            عِنْدَ رَبِّهِمْ}
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «دَحَضَتْ حُجَّتُهُ بَطَلَتْ وَبَابُهُ خَضَعَ وَأَدْحَضَهَا اللَّهُ.
            وَالْإِدْحَاضُ الْإِزْلَاقُ»
          source: "مختار الصحاح للرازي"
        - text: >
            «يَدْحَضُ؛ يُفنِّد»
          source: "المورد الحديث (2008) — ترجمة: refute"
        - text: >
            «(1) يُفحم [خصمًا] (2) يَدْحَضُ [حُجّةً]»
          source: "المورد الحديث (2008) — ترجمة: confute"
        - text: >
            «يَدْحَضُ: يُثبت بُطلانَ شيء أو صحَّتَه»
          source: "المورد الحديث (2008) — ترجمة: disprove"
      expands:
        - text: >
            «{مِنَ الْمُدْحَضِينَ}: الْمَغْلُوبِينَ»
          source: "تحفة الأريب بما في القرآن من الغريب لأبي حيان"
          addition: >
            يُشير إلى أن «المدحَضين» (اسم مفعول) تعني المغلوبين المقهورين؛
            وعليه «المُدْحِض» (اسم الفاعل) هو الغالب الذي يسقط حجة خصمه.
        - text: >
            «دَحْضٌ» = refutation (مجال: الفلسفة وعلم النفس)
          source: "مسرد الفلسفة وعلم النفس — ALECSO ArabTerm"
          addition: "يؤكد استخدام جذر «دحض» مصطلحاً فلسفياً للدحض والإبطال."

    - lemma: "مُفَنِّد"
      confirm:
        - text: >
            «يَدْحَضُ؛ يُفنِّد» — refute
          source: "المورد الحديث (2008)"
        - text: >
            «(1) غير مفنَّد؛ من غير تفنيد (2) لا نزاع فيه» — unquestioned
          source: "المورد الحديث (2008)"

      contradicts:
        - text: >
            «(الْمُفَنَّدُ) الضَّعِيفُ الرَّأْيِ»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          conflict: >
            المعجم يسجّل «المُفَنَّد» (اسم مفعول، مفتوح النون) بمعنى «الضعيف
            الرأي»، وهو اشتباه صرفي — الموجود في المجموعة هو «مُفَنِّد»
            (اسم فاعل، مكسور النون) = الذي يُفنِّد، وهو معنى مختلف جذرياً.
      expands:
        - text: >
            «الْفَاءُ وَالنُّونُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ثِقَلٍ
            وَشِدَّةٍ... وَمِمَّا يُقَاسُ عَلَيْهِ التَّفْنِيدُ وَهُوَ اللَّوْمُ،
            لِأَنَّهُ كَلَامٌ يَثْقُلُ عَلَى سَامِعِهِ. وَالْفَنَدُ: الْهَرَمُ.
            يُقَالُ أَفْنَدَ الرَّجُلُ فَهُوَ مُفْنِدٌ، إِذَا أُهْتِرَ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            ابن فارس يُحدِّد «التفنيد» بمعنى اللوم الثقيل، لا إبطال الحجة.
            «أفنَد» = خرِف وضعف رأيه. هذا يعني أن استخدام «مُفَنِّد» بمعنى
            «من يُبطل الحجة» هو استخدام مستحدث لم يُثبته ابن فارس. فيه توسّع
            دلالي من اللوم إلى الإبطال.

    - lemma: "نافٍ"
      expands:
        - text: >
            «النُّونُ وَالْفَاءُ وَالْحَرْفُ الْمُعْتَلُّ أُصَيْلٌ يَدُلُّ عَلَى
            تَعْرِيَةِ شَيْءٍ مِنْ شَيْءٍ وَإِبْعَادِهِ مِنْهُ. وَنَفَيْتُ
            الشَّيْءَ أَنْفِيهِ نَفْيًا، وَانْتَفَى هُوَ انْتِفَاءً»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            النفي في أصله يدل على التعرية والإبعاد، وهو أعمّ من الدحض؛
            يشمل نفي الشيء بدليل ونفيه بمجرد الإنكار. وجوده في المجموعة
            يُضفي بُعداً منطقياً (النفي الصوري للقضية) إضافةً إلى البُعد
            البلاغي الجدلي (الدحض، التفنيد).
      contradicts:
        - text: >
            «(الناف) النيرُ في لُغَةِ فَلَّاحِي مصر»
          source: "المعجم الوسيط"
          conflict: >
            «الناف» المسجَّل في المعجم هو اسم أداة زراعية، لا اسم الفاعل
            من «نَفَى». الفارق صرفي وضبطي: «نافٍ» (بالتنوين المكسور على
            الياء المحذوفة) هو اسم الفاعل المطلوب، لا «الناف» (بلام التعريف
            والألف المقصورة).

    # ── مرشحات المرحلة ١ ──

    - lemma: "دَاحِضٌ"
      contradicts:
        - text: >
            «يُقَالُ فُلَانٌ دَاحِضٌ لَا ثَبَاتَ لَهُ وَلَا عَزِيمَةَ فِي
            الْأُمُورِ (ج) دُحَّضٌ»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          conflict: >
            «داحض» يُستخدم معجمياً بمعنى «لا ثبات له في الأمور» أي المتزلزل
            الضعيف — وهو عكس المعنى المطلوب تماماً. المعنى المطلوب هو «من
            تبطل بسببه حجة الخصم»، في حين المعنى الموثَّق هو «من تبطل حجتُه
            هو لاضطرابه».
        - text: >
            «الدَّاحِضُ: الَّذِي لَا ثَبَاتَ لَهُ وَلَا عَزِيمَةَ فِي الْأُمُورِ»
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: >
            المعجم الكبير يؤكد نفس المعنى: «داحض» صفة للمتزلزل الرأي،
            لا للمُدحِض المبطِل لحجة الخصم.

    - lemma: "نَاقِضٌ"
      evidence_status: "no_material_found"

    - lemma: "مُبْطِلٌ"
      evidence_status: "no_material_found"

    - lemma: "رَادٌّ"
      contradicts:
        - text: >
            «(الرَّادُّ) مَنْ فِي وَجْهِهِ رَدَّةٌ»
          source: "المعجم الوسيط"
          conflict: >
            «الرادّ» الموثَّق هو من في وجهه ردّة (قُبح)، ليس من يرد الحجة.
            استخدام «رادّ» بمعنى «رادّ الحجة» يبقى وصفياً غير مسكوك معجمياً.
        - text: >
            «الرَّادُّ: مَنْ في وَجْهِه رَدَّةٌ (قُبْحٌ أو عَيْب)، وهى بتاء.
            من الإبل: الَّتِي تَرُدُّ ما فى بُطونها من الماءِ»
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: >
            المعجم الكبير يؤكد أن «الرادّ» لا يُستخدم مصطلحاً للمجادل الدافع.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُدْحِض"
      decision: confirmed
      decision_reason: >
        اسم فاعل مشتق قياسي من «أَدْحَضَ» الرباعي (على وزن مُفْعِل)، وهو
        فعل موثَّق معجمياً في سياق إبطال الحجة: «أَدْحَضَهَا اللَّهُ» =
        أبطلها. جذره «دحض» في مقاييس اللغة يدل على الزوال والزلق، ومنه
        إسقاط الحجة. الجسر الإنجليزي يؤكده بصورة مباشرة
        (confute/refute → «يدحض»). عدم التسجيل المباشر لـ«مُدْحِض» كمدخل
        مستقل في المعاجم القديمة مقبول؛ اسم الفاعل من الرباعي قياسي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على الإسقاط التام للحجة وإزالتها من الأساس (من الدحض =
        الزلق والإبطال)؛ أقوى اللمّات الثلاث في الدلالة على الانتصار
        الحُجَجي الكامل على الخصم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدْحِض"

    - lemma: "مُفَنِّد"
      decision: confirmed
      decision_reason: >
        اسم فاعل من «فَنَّدَ» (ثلاثي مزيد بالتضعيف) على وزن مُفَعِّل. في
        العربية المعاصرة الفصيحة استقرَّ «فنَّد الادعاءَ» بمعنى أثبت
        زيفه وبيَّن وهنه. المورد الحديث يستخدمه صراحةً: «يَدْحَضُ؛ يُفنِّد»
        لترجمة refute. التحفُّظ اللغوي: ابن فارس يُقيِّد «التفنيد» باللوم
        لا إبطال الحجة، لكن التطور الدلالي المعاصر معتمَد. يجب التمييز
        الصرفي الدقيق: «مُفَنِّد» (اسم فاعل، كاسر النون) # «مُفَنَّد» (اسم
        مفعول، فاتح النون) الذي يعني الضعيف الرأي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على كشف الخطأ وإثبات الوهن في الادعاء مع ظل من اللوم
        والاعتراض الصريح (أصل «التفنيد» = إثقال السامع بالرد)؛ أشد
        مباشرةً في الاعتراض من «مدحض» وأكثر تركيزاً على إثبات الزيف
        من «نافٍ».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُفَنِّد"

    - lemma: "نافٍ"
      decision: confirmed
      decision_reason: >
        اسم فاعل قياسي من «نَفَى» (معتل الآخر) على وزن فَاعِل المنقوص
        (فَاعٍ). النفي في منطق الجدل يعني إنكار الادعاء أو القضية؛ وهو
        بُعد ضروري في المجموعة لأنه يُغطِّي الجانب المنطقي الصوري
        (رفض القضية). ضبطه الكامل «نَافٍ» بالتنوين. يحتاج التمييز من
        «الناف» المعجمي (أداة زراعية في لغة فلاحي مصر).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ اللمّات الثلاث — يدل على الرفض والإنكار بصفة عامة سواء استند
        إلى دليل معاكس أم اكتفى بالإنكار الصريح؛ يُعبِّر عن البُعد
        المنطقي/الصوري للدحض أكثر من البُعد البلاغي الجدلي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَافٍ"

    # ── مرشحات المرحلة ١ (مرفوضة) ──

    - lemma: "دَاحِضٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المعجمان (الوسيط والكبير) يُسجِّلان «داحض» بمعنى «لا ثبات له ولا
        عزيمة في الأمور» — أي المتزلزل الضعيف — وهو معنى معاكس تماماً
        للمطلوب. الخلط نابع من أن «حجة داحضة» (صفة للحجة = باطلة) يختلف
        عن «رجل داحض» (صفة للشخص = ضعيف الرأي). استخدام «داحض» بمعنى
        «المدحِض» ملبِّس وغير موثَّق.

    - lemma: "نَاقِضٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية مباشرة تُثبِّته مصطلحاً للمجادل الدافع. وإن كان
        «نقض الحجة» تعبيراً عربياً فصيحاً، فإن «ناقض» ينصرف في الاستعمال
        إلى المتناقض أو الذي ينقض العهد. عدم وجود أدلة تثبيت معجمي مع
        وجود لمّات كافية في المجموعة يُوجب إسقاطه.

    - lemma: "مُبْطِلٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية مباشرة تُثبِّته مصطلحاً في سياق الجدل والمناظرة.
        «مبطل» في الاستعمال ينصرف غالباً إلى من يأتي بالباطل أو يتبطَّل،
        لا من يُبطل حجة الخصم. المجموعة مكتفية بلمّاتها الثلاث.

    - lemma: "رَادٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «الرادّ» الموثَّق معجمياً هو «من في وجهه ردّة» (قُبح)، لا من يرد
        الحجة. وإن كان «ردّ الحجةَ» تعبيراً صحيحاً، فإن «رادٌّ» مجرداً
        لا يُفيد هذا المعنى دون إضافة. اختبار السكّ: يمكن قول «رادٌّ لحجته»
        بدل «رادٌّ» فتبقى العبارة وصفية ولا تُشكّل مصطلحاً ثابتاً.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────
stage4_content:
  definition:
    current: "مناظر يدحض أو يفند من خلال تقديم أدلة أو حجج معاكسة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُشتَق من ترجمة التعريف الإنجليزي ترجمةً شبه حرفية،
        ويستخدم الفعلين «يدحض» و«يفند» وهما مشتقّان من اللمّتين «مُدْحِض»
        و«مُفَنِّد»، مما يُوقعه في شبه دوران. يُفضَّل تعريف مصطلحي بجنس
        قريب وفصل نوعي واضح بلغة معجمية أصيلة.
    authored:
      - type: terminological
