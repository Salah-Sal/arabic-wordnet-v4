stage1_review:
  assessment:
    concerns:
      - "لمّة «الأول» بدون تشكيل في المدخل الأصلي — تحتاج تشكيلاً كاملاً"
      - "لمّة «رقم واحد» مركّب ترقيمي حديث منقول عن الإنجليزية (number one) — يحتاج تقييم مدى تثبيته المعجمي"
      - "التعريف العربي الحالي يستخدم لفظة «الأول» وهي اللمّة ذاتها — دوران جزئي"
    observations: >
      المجموعة تصف مرتبة ترتيبية — المكانة الأولى أو الأعلى في سياق ترتيب أو سلسلة.
      الأصل الرتبي «الأوّل» اسم تفضيل على وزن أَفْعَل استُعمل استعمال الاسم بالتعريف.
      المركّب «رقم واحد» ترجمة حرفية لـ number one وإن شاع في الإعلام العربي الحديث.
      المفهوم بسيط ويقابله في التراث العربي ألفاظ مثل الصَّدارة والأوّليّة.
  blind_candidates:
    - lemma: "صَدَارَة"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر (ص د ر) على وزن فَعَالة، يدلّ على التقدّم والمكانة الأولى في القوم، وثّقه المعجم الوسيط بمعنى «التَّقَدُّم»"
    - lemma: "أَوَّلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «أوّل» بزيادة ياء النسب والتاء، يدلّ على مرتبة التقدّم والأسبقية، ورد في المعجم الكبير: «جاء في أوّليّة الناس»"
    - lemma: "رِيَادَة"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر (ر و د) على وزن فِعَالة، يدلّ على التقدّم والسبق، يُستعمل حديثاً بمعنى القيادة والتفوّق"
    - lemma: "سَبْق"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر (س ب ق) على وزن فَعْل، يدلّ على التقدّم في الترتيب والأسبقية"

stage2_evidence:
  per_lemma:
    - lemma: "الْأَوَّلُ"
      confirm:
        - text: "«الأول: فرد لا يكون غيره من جنسه سابقا عليه ولا مقارنا له، ذكره ابن الكمال. وقال الراغب: هو الذي يترتب عليه غيره ويستعمل على أوجه أحدهما المتقدم بالزمان... الثاني المتقدم بالرياسة بالشيء وكون غيره مجتذبا به نحو الأمير ثم الوزير»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الأول: بالفتح وتشديد الواو نقيض الآخر... ويستعمل على أوجه»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«(1) أول؛ أُولى (3) الأول (8) الأوّليّة: الدرجة الأولى أو المقام الأول في مسابقة»"
          source: "المورد الحديث (2008)"
          addition: "يوضّح الاستعمال الاسمي لـ «الأوّل» بمعنى المرتبة الأولى في مسابقة"
    - lemma: "رَقْمٌ وَاحِدٌ"
      confirm:
        - text: "«(1) الأوّل؛ الرئيسي (2) ممتاز؛ رائع»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«يُعْنَى بنفسه أو بمصالحه الشخصية — look after number one»"
          source: "المورد الحديث (2008)"
          addition: "يوسّع الاستعمال إلى التعبير الاصطلاحي الدارج"
    - lemma: "صَدَارَة"
      confirm:
        - text: "«(الصدارة) التَّقَدُّم يُقَال فلَان لَهُ الصدارة فِي الْقَوْم»"
          source: "المعجم الوسيط"
        - text: "«التَّقَدُّمُ. يقالُ: فلانٌ لهُ الصُّدارةُ فى القوم. مِنَ الوادى: أعْلاه ومَقادِمُهُ»"
          source: "المعجم الكبير"
        - text: "«صَدَارَة... جاء في الصَّدَارة — الصواب والرتبة: فصيحة. التعليق: وَرَد في القاموس: وصدور الوادي أعاليه ومقادمه... وفي التاج: الصَّدَارة بالفتح: التقدم»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
    - lemma: "أَوَّلِيَّة"
      confirm:
        - text: "«مصدر صناعى، يقال: جاء فى أَوَّليّة الناس. وفلان له أَوَّليّة: لآبائه مفاخر»"
          source: "المعجم الكبير"
        - text: "«أَوَّلِيَّة... الصواب والرتبة: فصيحة. التعليق: جاء ضمن قرارات مجمع اللغة المصري أنه إذا أريد صنع مصدر من كلمة يزاد عليها ياء النسب والتاء»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«الأوّليّة: الدرجة الأولى أو المقام الأول في مسابقة»"
          source: "المورد الحديث (2008)"
          addition: "يثبت استعمال أوّلية بمعنى المرتبة الأولى في مسابقة تحديداً"
    - lemma: "رِيَادَة"
      evidence_status: "no_material_found"
    - lemma: "سَبْق"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "الْأَوَّلُ"
      decision: confirmed
      decision_reason: "اسم تفضيل على وزن أَفْعَل مثبت في المعاجم الكلاسيكية والحديثة بمعنى المتقدّم في الترتيب، مؤيَّد بنصوص المناوي والتهانوي والمعجم الكبير"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المرتبة الأولى بوصفه اسم تفضيل مُعرَّفاً — أعمّ الألفاظ في هذه المجموعة وأكثرها حياداً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْأَوَّلُ"

    - lemma: "رَقْمٌ وَاحِدٌ"
      decision: confirmed
      decision_reason: "مركّب ترقيمي ثابت في الاستعمال الحديث، وثّقه المورد الحديث بمعنى «الأوّل؛ الرئيسي»، شائع في الإعلام والخطاب المعاصر"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تعبير عصري غير رسمي يُستعمل في السياقات التصنيفية والرياضية والإعلامية، أقرب إلى الأسلوب المحكي منه إلى المعجمي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَقْمٌ وَاحِدٌ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "صَدَارَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر فصيح من الجذر (ص د ر) وثّقه المعجم الوسيط والمعجم الكبير ومعجم الصواب اللغوي بمعنى «التقدّم»، ومعناه ينطبق تماماً على مفهوم المجموعة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على موضع التقدّم والريادة في جماعة أو ترتيب — يحمل دلالة التفوّق والبروز أكثر من مجرد الترتيب الرقمي"
      actions:
        - command: create_entry
          params: {lemma: "صَدَارَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "أَوَّلِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «أوّلية» بمعنى المرتبة الأولى في بعض المصادر، فإنّ دلالتها الأوسع (الأسبقية المطلقة، الأولوية، الأوّلية الرياضية) تجعلها متعددة المعاني بما يُبعدها عن دقة المجموعة، فضلاً عن أنّ «صدارة» أدقّ وأقلّ التباساً"

    - lemma: "رِيَادَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تدعم استعمال «ريادة» بمعنى المرتبة الأولى في ترتيب، ودلالتها الأساسية «الاستطلاع والقيادة» لا تطابق المفهوم المطلوب"

    - lemma: "سَبْق"
      source: stage1
      decision: removed
      decision_reason: "«السبق» يدلّ على فعل التقدّم لا على المرتبة ذاتها، ولم تُوجد أدلة معجمية تسنده بمعنى «المركز الأول في ترتيب»"

