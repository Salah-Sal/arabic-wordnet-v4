      - lemma: "اِسْتِسْقَاء"
        examples:
          - text: "أظهرت الفحوصات أن المريض يعاني من اسْتِسْقاءٍ حادٍّ في التجويف البريتوني نتيجةَ تشمُّع الكبد."
            type: usage
      - lemma: "وَذَمَة"
        examples:
          - text: "لاحظ الطبيب وَذَمَةً واضحة في الأطراف السفلية، فأوصى بإجراء فحوصات لوظائف القلب."
            type: usage
      - lemma: "خَزَب"
        examples:
          - text: "وصف الأطباء العرب القدامى الخَزَبَ بأنه ورمٌ رَخْصٌ في اللحم من غير ألم، ينجم عن احتباس الرطوبات."
            type: usage
    actions:
