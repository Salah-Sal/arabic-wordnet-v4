        الجنس القريب المُحكم وإلى الفصل النوعي الكافي. "يجادل" تصف فعلاً لا طبعاً،
        و"أو" بين الصخب والغضب يُوهم بأنهما بديلان متساويان حين أن الغالب اجتماعهما.
        يُستحسن تعريف يُبرز الطبع الثابت على الخصام مع قيد الصخب.
