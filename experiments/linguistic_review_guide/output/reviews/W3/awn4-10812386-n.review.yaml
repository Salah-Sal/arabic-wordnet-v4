# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  blind_candidates:
    - lemma: "صَخَّاب"
      generation_method: ishtiqaq
      justification: >-
        مشتق من الجذر ص-خ-ب على وزن فَعَّال الدال على كثرة الفعل ومداومته؛
        الصخب هو الصوت العالي المختلط. يصف من يرفع صوته في الخصام، وهو بذلك
        يجمع عنصري الصخب والجدال الواردين في التعريف.

    - lemma: "لَجُوج"
      generation_method: ishtiqaq
      justification: >-
        مشتق من الجذر ل-ج-ج على وزن فَعُول الدال على الثبوت والمداومة؛
        اللجاج هو التمادي في الخصومة والإصرار عليها. يناسب معنى من يجادل بعناد
        وغضب لا يكفّ.

    - lemma: "مَرَّاء"
      generation_method: ishtiqaq
      justification: >-
        مشتق من الجذر م-ر-ي (مارى يُماري) على وزن فَعَّال للمبالغة؛
        المِراء في التراث العربي هو الجدال وطعن الغير في الكلام. مَرَّاء يصف
        من يُكثر هذا النوع من الخصام.

    - lemma: "مِجْدَال"
      generation_method: ishtiqaq
      justification: >-
        مشتق من الجذر ج-د-ل على وزن مِفْعَال الدال على كثرة الفعل؛
        الجدل هو امتداد الخصومة ومراجعة الكلام. مِجْدَال يصف من يُكثر الجدال
        ويتمادى فيه.

  assessment:
    concerns:
      - "اللمّتان (مُخاصِم، مُشاكِس) مكتوبتان بتشكيل ناقص: تفتقران إلى فتحة على الحرف الثاني (خ، ش)، مما يُخلّ بضبط القراءة."
      - "لا يوجد فرق دلالي موثَّق بين اللمّتين في السجل الحالي، مما يُوهم بترادف مطلق."
      - "التعريف الحالي (شخص يجادل بصخب أو غضب) ترجمة حرفية من الإنجليزية، يفتقر إلى أسلوب المعجم الوسيط."
    observations: >-
      المجموعة الترادفية تصف شخصاً مُتمادياً في الجدال بصوت عالٍ أو غضب. كلتا اللمّتين
      اسمَا فاعل على وزن مُفَاعِل من جذرين مختلفين (خ-ص-م وش-ك-س)، مما يُعطي
      المجموعة غنًى اشتقاقياً. الفعل "خاصَمَ" يحمل معنى المنازعة الرسمية والعداء،
      بينما "شاكَسَ" يُشير إلى الشراسة في الطبع والمضايقة. الفجوة الدلالية بينهما
      حقيقية ومهمة. المجموعة الأُمّ (مُجادِل/مُناظِر) تمثّل المجادِل الهادئ، وهذه
      المجموعة تُضيف عليها قيد الصخب والغضب تمييزاً واضحاً. يُستحسن الاحتفاظ
      باللمّتين بعد تصحيح تشكيلهما.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "مُخَاصِم"
      confirm:
        - text: "«الْخَاءُ وَالصَّادُ وَالْمِيمُ أَصْلَانِ: أَحَدُهُمَا الْمُنَازَعَةُ... فَالْأَوَّلُ الْخَصْمُ الَّذِي يُخَاصِمُ. وَالذَّكَرُ وَالْأُنْثَى فِيهِ سَوَاءٌ. وَالْخِصَامُ: مَصْدَرُ خَاصَمْتُهُ مُخَاصَمَةً وَخِصَامًا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(1) المُشاحِن؛ المُخاصِم إلخ (2) راعي البقر»"
          source: "المورد الحديث (2008) — ترجمة: wrangler"
        - text: "«مُخاصِم؛ معادٍ؛ مُناوئ؛ منافِس»"
          source: "المورد الحديث (2008)"
        - text: "«مُخاصِم؛ مُعادٍ؛ متضارب»"
          source: "المورد الحديث (2008)"

    - lemma: "مُشَاكِس"
      confirm:
        - text: "«شَاكَسَ فلانٌ فلانًا: غاضَبَه وعاسَرَه»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«شاكسَ يشاكس، مشاكسةً، فهو مُشاكِس، والمفعول مُشاكَس• شاكس الطِّفلُ صديقَه: ضايقَه، غاضبه، أساء معاملتَه. يعامل برفق شخصًا مشاكسًا— يشاكس الرجلُ الشريرُ جيرانَه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«تشاكسَ الرَّجُلان: تخالفا، تخاصما، تعاسرا ﴿فِيهِ شُرَكَاءُ مُتَشَاكِسُونَ﴾»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«مُشاكِس: مولَعٌ بالقتال والخِصام»"
          source: "المورد الحديث (2008)"
        - text: "«مُشاكِس؛ مُحِبٌّ للنزاع والخصام»"
          source: "المورد الحديث (2008)"
        - text: "«مُشاكِس؛ مُوْلَعٌ بالخصام»"
          source: "المورد الحديث (2008)"

    - lemma: "صَخَّاب"
      contradicts:
        - text: "«الصَّخَابُ: القِلادةُ المُتَّخَذَةُ من الطَّيب ونحوه»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "لفظ الصخاب مُحتَلٌّ في المعجم الكبير بمعنى القلادة العطرية، فيُفضي استخدامه للمجادل الصاخب إلى تعارض مع هذه الدلالة المعجمية المثبتة."
        - text: "«الصَّخَّابُ: طائرٌ يعرف باسم القطرس (Albatross)»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "وزن فَعَّال من الجذر ذاته مُلتزَمٌ في المعاجم الحديثة لطائر القطرس، مما يُثقل استخدام صَخَّاب للدلالة على شخص."
      expands:
        - text: "«وهو صخاب في الأسواق. واصطخبوا وتصاخبوا»"
          source: "أساس البلاغة للزمخشري"
          addition: "يُثبت الزمخشري صيغة صَخَّاب وصفاً للشخص الصاخب في الأسواق، مما يُشير إلى أن الوزن كان مستخدماً لوصف الشخص في التراث، لكنه تعارض مع الدلالة الحديثة للطائر."

    - lemma: "لَجُوج"
      contradicts:
        - text: "«مُلِحّ؛ مِلْحاح؛ لَجُوج a persistent salesman»"
          source: "المورد الحديث (2008)"
          conflict: "لَجُوج يُترجَم به الإلحاحُ والإصرارُ (persistence)، لا الجدالُ الصاخب الغاضب (noisy arguing). الدلالة المحورية للإلحاح والمثابرة تختلف عن مفهوم المجموعة."
        - text: "«مُلِحّ: متطلِّبٌ عملًا عاجلًا... لجوج؛ كثير الإلحاح»"
          source: "المورد الحديث (2008)"
          conflict: "يؤكد المصدر ذاته أن لجوج مرادف للإلحاح لا للخصام الصاخب."

    - lemma: "مَرَّاء"
      contradicts:
        - text: "«المراء: طعن في كلام الغير لإظهار خلل عنه من غير أن يرتبط به غرضٌ سوى تحقير الغير»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المراء في الاصطلاح الكلاسيكي هو طعن خاص في الكلام لأغراض تحقيرية، لا مطابق للجدال الصاخب الغاضب."
        - text: "«المِراء: طعن في كلام الغير لإظهار خلل فيه من غير أن يرتبط به غرضٌ سوى التحقير»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "نفس التعريف الاصطلاحي المُقيَّد يؤكد أن المراء جنس خاص من الجدال، لا جدال صاخب عام."
      expands:
        - text: "«وَعِنْدَنَا أَنَّ الْمِرَاءَ مِمَّا يَتَمَارَى فِيهِ الرَّجُلَانِ... لِأَنَّهُ كَلَامٌ فِيهِ بَعْضُ الشِّدَّةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُقرّ ابن فارس بأن في المراء شيئاً من الشدة، لكنه يظل مقيَّداً بالتمارُي في القول، وليس بالصخب والغضب."

    - lemma: "مِجْدَال"
      contradicts:
        - text: "«وَالْمِجْدَلُ: الْقَصْرُ»"
          source: "مقاييس اللغة لابن فارس (باب جَدَلَ)"
          conflict: "مِفْعَل من جذر جدل لُوقِّعَ على معنى القصر لا على الشخص المجادل. ولم يثبت أن مِجْدَال استُعمل لشخص يجادل في معجم كلاسيكي أو حديث."


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "مُخَاصِم"
      decision: confirmed
      decision_reason: >-
        الجذر خصم موثَّق في أقدم طبقات المعجم العربي (مقاييس ابن فارس) بصريح معنى
        المنازعة، وصيغة مُفَاعِل (مُخاصِم) هي اسم فاعل قياسي من خَاصَمَ. الشاهد الإنجليزي
        (المورد الحديث) يُثبت مُخاصِم أول ترجمة لـ wrangler. لا تعارض معجمي. يحتاج
        فقط إلى استكمال التشكيل بإضافة فتحة على الخاء.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُشير إلى طرف في خصومة رسمية أو عدائية بمعنى المنازعة المنظَّمة؛ له إيحاء
        بالعداء الصريح والتعارض الجوهري مع الطرف الآخر. يصلح في سياقات القضاء
        والسياسة والخلاف العلني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَاصِم"

    - lemma: "مُشَاكِس"
      decision: confirmed
      decision_reason: >-
        جذر شكس موثَّق في المعاجم الكلاسيكية بمعنى سوء الخُلق والعُسر في المعاملة؛
        وشاكَسَ الفعل الثلاثي الزائد يعني "غاضبه وعاسره" (المعجم الكبير). اسم الفاعل
        مُشاكِس شائع في المعاجم الحديثة بمعنى "مُحِبّ النزاع والخصام". وظّفه القرآن
        الكريم بصيغة الجمع {مُتَشَاكِسُونَ} تأييداً للاستعمال الراسخ. يحتاج فتحة على الشين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُركّز على الطبع الشرس والمضايقة في التعامل اليومي أكثر من الخصومة الرسمية؛
        يحمل دلالة الإزعاج المتعمد وإساءة المعاملة. يصلح في سياقات العلاقات
        الاجتماعية والجوار والتعامل الشخصي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُشَاكِس"

    - lemma: "صَخَّاب"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم صحة الاشتقاق من جذر صخب، فإن الصيغة صَخَّاب مُحتَلَّة في المعجم الكبير
        الحديث بمعنيين آخرين: القلادة العطرية، وطائر القطرس (Albatross). هذا التصادم
        يُفضي إلى اشتراك لفظي حادّ في المعجم المعاصر، ويُعرِّض المصطلح للغموض.
        فضلاً عن ذلك، لم تُثبت المعاجم الكلاسيكية صَخَّاب (وزن فَعَّال) بمعنى الشخص
        الصاخب تحديداً، بل اقتصر التراث على صاخِب وصَخُوب وصَخْبان.
      evidence_assessment:
        case: mixed

    - lemma: "لَجُوج"
      source: stage1
      decision: removed
      decision_reason: >-
        لَجُوج دلالته المحورية في المعاجم الحديثة هي "الإلحاح والإصرار" (persistence/
        insistence)، وهو ما يُترجَم به المِلحاح. هذه الدلالة مُبايِنة لدلالة "يجادل
        بصخب أو غضب"؛ فاللجاجة إصرارٌ على أمر ما، لكنها لا تستلزم الصخب ولا الغضب.
        الاستبدال السياقي لا يصحّ: "المُلحاح في الخصام" ليس بالضرورة صاخباً غاضباً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَرَّاء"
      source: stage1
      decision: removed
      decision_reason: >-
        المراء في الاصطلاح الكلاسيكي (الجرجاني، المناوي، البركتي) مُقيَّد بـ"طعن
        في كلام الغير لإظهار خلل فيه بقصد التحقير"، وهو جنس خاص من الجدال الذهني
        لا يستلزم الصخب أو الغضب. مَرَّاء (فَعَّال من مرى) كمصطلح سيحمل هذه الدلالة
        الاصطلاحية المُحدَّدة، لا الجدال الصاخب العام. التعارض الدلالي جوهري.
      evidence_assessment:
        case: mixed

    - lemma: "مِجْدَال"
      source: stage1
      decision: removed
      decision_reason: >-
        مِفْعَال من جذر جدل لم يُثبَت في أي معجم بمعنى الشخص المجادل. وابن فارس
        يُثبت مِجْدَل بمعنى القصر استعمالاً وحيداً لهذا الوزن من الجذر. اختبار السكّ
        يفشل: لا يُعدّ مِجْدَال وحدةً معجمية ثابتة. والوزن مِفْعَال قياسياً للآلات
        والمقاييس، لا لأسماء المبالغة الدالة على الشخص.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "شخص يجادل بصخب أو غضب"
