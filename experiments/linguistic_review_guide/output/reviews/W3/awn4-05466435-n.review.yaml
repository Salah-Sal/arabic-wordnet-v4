# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-05466435-n (spermatocele)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «قيلة منوية» تعبير مركب وصفي طبي، ينبغي التحقق من تثبيته في المعاجم الطبية العربية"
      - "لا يوجد سوى لمّة واحدة في المجموعة؛ المفهوم طبي متخصص قد يصعب إيجاد مرادفات عربية أصيلة له"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي"
    observations: "المجموعة تصف حالة مرضية تشريحية متخصصة (كيسة على البربخ أو الخصية تحتوي على حيوانات منوية). المصطلح الإنجليزي spermatocele مشتق من اليونانية (σπέρμα + κήλη). في الطب العربي التقليدي لم يُعرف هذا المصطلح بصيغته الحالية، لكنّ لفظة «قيلة» مستعملة استعمالاً واسعاً في المصطلحية الطبية العربية الحديثة كمقابل للاحقة -cele اليونانية."

  blind_candidates:
    - lemma: "قِيلَة مَنَوِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «قيلة» (المقابل العربي المعرَّب لـ -cele بمعنى الفتق أو التورم الكيسي) و«منوية» (نسبة إلى المني). هذا التركيب يوافق النمط السائد في المعجمية الطبية العربية (قيلة دماغية، قيلة بطنية، إلخ)."
    - lemma: "كِيسَة بَرْبَخِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «كيسة» (cyst) و«بربخية» (نسبة إلى البربخ). يصف الحالة من زاوية موقعها التشريحي بدلاً من محتواها."
    - lemma: "كِيسَة مَنَوِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من «كيسة» و«منوية»، يركز على طبيعة المحتوى (السائل المنوي) بدلاً من نوع الانتفاخ."
    - lemma: "سْبِرْمَاتُوسِيل"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي spermatocele، يُلجأ إليه عند تعذر المقابل العربي المسكوك. لكنه أدنى مرتبة من التركيب."


stage2_evidence:
  per_lemma:
    - lemma: "قِيلَة مَنَوِيَّة"
      confirm:
        - text: "«قِيْلَةٌ مَنَوِيَّة — spermatocele»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«قِيلَةٌ مَنَوِيَّة — hydrospermatocele»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«قيلَةٌ مَنَوِيَّة — gonocele»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«قيلة» مستعملة في عشرات المركبات الطبية: قيلة دماغية، قيلة بطنية، قيلة إحليلية، قيلة أربية، قيلة المريء، قيلة القرنية... إلخ"
          source: "المعجم الطبي الموحد (2009)"
          addition: "لفظة «قيلة» مصطلح طبي عربي معرَّب ثابت ومنتج، يقابل اللاحقة اليونانية -cele"

    - lemma: "كِيسَة بَرْبَخِيَّة"
      evidence_status: "no_material_found"

    - lemma: "كِيسَة مَنَوِيَّة"
      confirm:
        - text: "«كيسَةٌ مَنَوِيَّة — seminal cyst»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«كيسَةٌ مَنَوِيَّة — seminal cyst» وليس spermatocele"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي الموحد يخصص «كيسة منوية» لـ seminal cyst وهو مفهوم أعمّ من spermatocele؛ بينما يخصص «قيلة منوية» لـ spermatocele تحديداً"

    - lemma: "سْبِرْمَاتُوسِيل"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "قِيلَة مَنَوِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مثبت في المعجم الطبي الموحد (2009) كمقابل مباشر لـ spermatocele. وهو مبني على نمط اصطلاحي منتج (قيلة + صفة نسبة) مستعمل في عشرات المصطلحات الطبية العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِيلَة مَنَوِيَّة"

    - lemma: "كِيسَة بَرْبَخِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي دليل معجمي يثبت هذا المركب كمصطلح مسكوك. وهو تعبير وصفي حر لا يجتاز اختبار السكّ."

    - lemma: "كِيسَة مَنَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المعجم الطبي الموحد يخصص «كيسة منوية» كمقابل لـ seminal cyst لا لـ spermatocele. إدراجه في هذه المجموعة يخلط بين مفهومين طبيين متمايزين."

    - lemma: "سْبِرْمَاتُوسِيل"
      source: stage1
      decision: removed
      decision_reason: "تعريب مباشر لا حاجة إليه مع وجود المقابل العربي المسكوك «قيلة منوية» المثبت في المعجم الطبي الموحد. كما أنه لا يقبل الاشتقاق ولا يتساوق مع النظام المصطلحي العربي القائم على «قيلة + صفة»."


stage4_content:
  definition:
    current: "تورم في البربخ أو الخصية؛ يحتوي عادة على حيوانات منوية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي. يحتاج إلى صياغة معجمية عربية أدق مع تحديد الجنس القريب (كيسة حميدة) بدلاً من «تورم» الذي هو وصف عام."
    authored:
      - type: terminological
        text: "كِيسَة حَمِيدَة تتكوّن في البَرْبَخ أو بالقرب من الخُصْيَة، تحتوي على سائل رائق فيه حيوانات منوية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "كِيسَة حَمِيدَة مملوءة بسائل تنشأ عادةً في رأس البَرْبَخ، وتحتوي على حيوانات منوية ميتة أو حية. تظهر كانتفاخ غير مؤلم خلف الخُصْيَة، وتتمايز عن القِيلَة المائية بوجود الحيوانات المنوية في سائلها."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "كِيسَة حَمِيدَة تتكوّن في البَرْبَخ أو بالقرب من الخُصْيَة، تحتوي على سائل رائق فيه حيوانات منوية."

  examples:
    per_lemma:
      - lemma: "قِيلَة مَنَوِيَّة"
        examples:
          - text: "كشف الفحص بالموجات فوق الصوتية عن قِيلَة مَنَوِيَّة صغيرة في رأس البربخ الأيمن لا تستدعي التدخل الجراحي."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "كشف الفحص بالموجات فوق الصوتية عن قِيلَة مَنَوِيَّة صغيرة في رأس البربخ الأيمن لا تستدعي التدخل الجراحي."


