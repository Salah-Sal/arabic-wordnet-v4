  per_entry:
    - lemma: "قِيلَة مَنَوِيَّة"
      entry_id: "{auto}"
      roots:
        - word: "قيلة"
          root: "قيل"
          maqayis_quote: "«الْقَافُ وَالْيَاءُ وَاللَّامُ أَصْلُ كَلِمِهِ الْوَاوُ... فَالْقَيْلُ: الْمَلِكُ مِنْ مُلُوكِ حِمْيَرٍ» — ملاحظة: لفظة «قيلة» في الاصطلاح الطبي مُعرَّبة من اليونانية κήλη (kēlē) بمعنى الفتق، وليست من هذا الأصل العربي"
