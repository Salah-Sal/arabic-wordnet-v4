# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14007292-n
# المعنى: الغياب التام للضوء (total absence of light)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «سواد» تدل أساساً على اللون (ضد البياض) لا على غياب الضوء، فإدراجها خلط بين المفهوم اللوني والضوئي"
      - "لمّة «حلكة» بدون تشكيل كامل في البيانات الأصلية"
      - "المجموعة تفتقر إلى ألفاظ تراثية غنية بالدلالة على الظلمة الشديدة كالحندس"
    observations: "المجموعة تمثل مفهوم الظلمة القصوى (الغياب التام للضوء)، وهو مفهوم غني في التراث اللغوي العربي بألفاظ عديدة كالحِنْدِس والدَّيْجُور والغَيْهَب. التعريف الحالي دقيق وموافق للمعنى. المركب الوصفي «ظلام دامس» يطابق التعريف تمام المطابقة. لمّة «سواد» إشكالية لأن دلالتها الأساسية لونية (ضد البياض)، وهي أقرب إلى مفهوم اللون منها إلى مفهوم انعدام الضوء."
  blind_candidates:
    - lemma: "حِنْدِسٌ"
      generation_method: majaz
      justification: "لفظ عربي كلاسيكي بمعنى الظلمة الشديدة والليل المظلم، ورد في الحديث النبوي (ليلة ظلماء حِنْدِس)، إحياء للفظ تراثي يدل على الإظلام الشديد"
    - lemma: "دَيْجُور"
      generation_method: majaz
      justification: "لفظ كلاسيكي بمعنى الظلمة، استعمله العرب في وصف شدة الإظلام، جمعه دياجير"
    - lemma: "غَيْهَب"
      generation_method: majaz
      justification: "لفظ عربي قديم بمعنى الظلام الشديد، من ألفاظ الليل والظلمة في التراث العربي"
    - lemma: "حَلَك"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر ح-ل-ك على وزن فَعَل بمعنى شدة السواد، أصل اشتقاقي لحالك ومُحلَولِك وحُلكوك"


stage2_evidence:
  per_lemma:
    - lemma: "حُلْكَة"
      confirm:
        - text: "«الحُلْكَةُ، بالضم، والحَلَكُ، مُحرَّكةً: شِدَّة السَّوادِ، حَلِكَ، كفَرِحَ، فهو حالِكٌ ومُحْلَوْلِكٌ وحُلَكْلِكٌ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الحلكة) الحلك»"
          source: "المعجم الوسيط"
        - text: "«شِدَّةُ السَّوادِ»"
          source: "المعجم الكبير"
      expands:
        - text: "«والحُلْكَةُ، بالضم: الحُكْلَةُ، ودُوَيْبَّةٌ تَغوصُ في الرَّمْلِ، أو ضَرْبٌ من العَظاءِ»"
          source: "القاموس المحيط"
          addition: "للحُلْكَة معانٍ أخرى (الحُكْلَة أي العُجْمة واللُّثْغة، ونوع من العظاء) غير المعنى المقصود هنا"

    - lemma: "سَوَاد"
      confirm:
        - text: "«سَوَاد: ضد البياض من الألوان، وشخص كل شيء من متاع وغيره»"
          source: "المعجم المفصل"
      contradicts:
        - text: "«السواد: اللون المضاد للبياض ويعبر به عن الشخص المترائي من بعد وعن سواد العين وعن الجمع الكثير»"
          source: "التعريفات للجرجاني"
          conflict: "المعنى الأساسي لون لا غياب ضوء، فالسواد صفة لونية لا حالة ضوئية"
      expands:
        - text: "«فَالسَّوَادُ فِي اللَّوْنِ مَعْرُوفٌ. وَعِنْدَ قَوْمٍ أَنَّ كُلَّ شَيْءٍ خَالَفَ الْبَيَاضَ، أَيِّ لَوْنٍ كَانَ، فَهُوَ فِي حَيِّزِ السَّوَادِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "السواد عند بعض اللغويين يشمل كل ما خالف البياض، وهو دلالة لونية محضة لا ضوئية"

    - lemma: "ظَلَامٌ دَامِسٌ"
      confirm:
        - text: "«الظَّلَامُ: ذَهَابُ النُّور»"
          source: "المعجم الوسيط"
        - text: "«انعدامُ النُّورِ»"
          source: "المعجم الكبير"
      expands:
        - text: "«اسمٌ لِلظُّلْمَةِ مُطلَقًا, يَجْرِي مَجْرَى المصدرِ, فلا يُجْمَعُ؛ كالسَّوَادِ والبَيَاضِ»"
          source: "المعجم الكبير"
          addition: "الظلام اسم جنس لا يُجمع، يجري مجرى المصدر"

    - lemma: "حِنْدِسٌ"
      confirm:
        - text: "«الحِنْدِسُ، بالكسرِ: الليلُ المُظْلِمُ، والظُّلْمَةُ ج: حَنادِسُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الحندس) الظلمَة واللَّيْل الشَّديد الظلمَة وأسود حندس شَدِيد السوَاد (ج) حنادس»"
          source: "المعجم الوسيط"
        - text: "«الحِنْدِسُ: الظُّلْمَةُ. وتَحَنْدَسَ الرَّجُلُ: سَقَطَ وضَعُفَ، والنُّوْنُ زائدةٌ»"
          source: "المختصر للزمخشري"
      expands:
        - text: "«في حديث أبي هريرة: كُنَّا عِنْدَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي ليْلة ظَلْماء حِنْدِس أَيْ شَدِيدة الظُّلْمة»"
          source: "النهاية في غريب الحديث لابن الأثير"
          addition: "ورد في الحديث النبوي وصفاً للظلمة الشديدة، مما يؤكد دلالته على الغياب التام للضوء"

    - lemma: "دَيْجُور"
      confirm:
        - text: "«(الديجور) الظلمَة ووصفوا بِهِ فَقَالُوا ليل ديجور وَلَيْلَة ديجور»"
          source: "المعجم الوسيط"
        - text: "«الدَّيْجُور: الظُّلمة»"
          source: "المعجم الكبير"
      expands:
        - text: "«وديمة ديجور مظْلمَة بِمَا تحمل من المَاء وتراب ديجور أغبر يضْرب إِلَى السوَاد»"
          source: "المعجم الوسيط"
          addition: "يُستعمل صفةً في الغالب (ليل ديجور، ديمة ديجور)، ومعانيه متعددة تشمل التراب الأغبر"

    - lemma: "غَيْهَب"
      evidence_status: "no_material_found"

    - lemma: "حَلَك"
      confirm:
        - text: "«(الحلك) شدَّة السوَاد»"
          source: "المعجم الوسيط"
        - text: "«شِدَّةُ السَّوادِ»"
          source: "المعجم الكبير"
        - text: "«الحَاءُ وَاللَّامُ وَالْكَافُ حَرْفٌ يَدُلُّ عَلَى السَّوَادِ»"
          source: "مقاييس اللغة لابن فارس"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "حُلْكَة"
      decision: confirmed
      decision_reason: "ثابتة في المعاجم الكبرى (الوسيط والكبير والقاموس المحيط) بمعنى شدة السواد. وإن كانت الدلالة لونية بالأصل، فإن شدة السواد ملازمة لانعدام الضوء التام في الاستعمال العربي (ليل حالك). اللمّة الموجودة بدون تشكيل، فتحتاج تحديثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الشدة القصوى في السواد بوصفه الصفة البصرية المصاحبة لانعدام الضوء، فهي تصف المظهر اللوني للظلمة لا حالتها الفيزيائية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُلْكَة"

    - lemma: "سَوَاد"
      decision: removed
      decision_reason: "المعنى الأساسي للسواد هو اللون المضاد للبياض (مقاييس اللغة: خلاف البياض في اللون)، وهو مفهوم لوني لا يدل بذاته على غياب الضوء. السطح الأسود له سواد حتى في الضوء الساطع، والغرفة المظلمة فيها ظلمة لا سواد. إبقاؤه يخلط بين حقلَيْن دلاليَّيْن مختلفَيْن."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ظَلَامٌ دَامِسٌ"
      decision: confirmed
      decision_reason: "مركب وصفي ثابت يطابق التعريف تمام المطابقة: ظلام (ذهاب النور / انعدام النور) + دامس (شديد مطبق لا فُرجة فيه). أدق تعبير عربي عن مفهوم الغياب التام للضوء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يصف الحالة الفيزيائية لانعدام الضوء انعداماً تاماً شاملاً مطبقاً، وهو الأعم استعمالاً والأدق دلالةً بين لمّات المجموعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ظَلَامٌ دَامِسٌ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "حِنْدِسٌ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ كلاسيكي ثابت في المعاجم الكبرى (القاموس المحيط والوسيط والنهاية والمختصر) بمعنى الظلمة والليل الشديد الظلمة. ورد في الحديث النبوي: «ليلة ظلماء حِنْدِس». يضيف بُعداً تراثياً أدبياً للمجموعة ويُثريها بلفظ فصيح دقيق الدلالة على الظلمة الشديدة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ أدبي تراثي يدل على الظلمة الشديدة الدامسة، يُفضَّل في السياقات الفصيحة والأدبية والدينية على التعبيرات العامة"
      actions:
        - command: create_entry
          params: {lemma: "حِنْدِسٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "دَيْجُور"
      source: stage1
      decision: removed
      decision_reason: "يدل على الظلمة عموماً دون تخصيص بالشدة القصوى، ويُستعمل في الغالب وصفاً (ليل ديجور، ديمة ديجور) لا اسماً مستقلاً. كما أن معانيه تتعدد لتشمل التراب الأغبر والكلأ الكثير. دلالته أقرب إلى المجموعة الأعلى (ظلام/عتمة) منها إلى الغياب التام للضوء."

    - lemma: "غَيْهَب"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر له على شواهد معجمية في قاعدة البيانات المُستَعلَمة، مما يُضعف توثيقه ويمنع التحقق من دقة دلالته."

    - lemma: "حَلَك"
      source: stage1
      decision: removed
      decision_reason: "مرادف تام لـ«حُلْكَة» الموجودة في المجموعة (المعجم الوسيط: الحلكة = الحلك)، فإدراجه تكرار لا يضيف فرقاً دلالياً يُذكر."


