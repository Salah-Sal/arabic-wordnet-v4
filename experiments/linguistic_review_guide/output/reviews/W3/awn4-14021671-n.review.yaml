# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14021671-n (peonage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «حالة العامل بالسخرة» دوريّ؛ إذ يعرّف المفهوم بلفظ من أسرة اللمّة نفسها"
      - "المجموعة تحتوي لمّة واحدة فقط (سخرة) وهو ضعف معجمي"
      - "لفظ سُخْرَة في المعاجم يدلّ على العمل القسريّ نفسه أو على مَن يُسخَّر، لا على حالة العامل المسخَّر؛ فهناك انزياح دلالي طفيف بين اللمّة والتعريف"
    observations: "المفهوم الإنجليزي peonage يخصّ نظام عبودية الدَّيْن حيث يُلزَم العامل بالخدمة وفاءً لدَيْنه، وهو مفهوم قانوني اجتماعي نشأ في أمريكا اللاتينية. في العربية ثمة مصطلح السُّخْرَة الذي يغطي العمل القسري بلا أجر عموماً، لكنه لا يخصّ عبودية الدَّيْن تحديداً. الجنس القريب للمفهوم هو الإخضاع والخضوع القسري (المعنى الأعمّ)."

  blind_candidates:
    - lemma: "اسْتِعْبَاد"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من جذر (عبد)، يدلّ على إلزام الغير بالعمل قسراً واتخاذه عبداً، وهو أقرب المشتقات للدلالة على حالة الإكراه على العمل"
    - lemma: "رِقّ"
      generation_method: majaz
      justification: "الرِّقّ في الأصل العبودية والمِلك، يُمَدّ مجازاً ليشمل أي حالة خضوع قسري للعمل"
    - lemma: "عُبُودِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من (عبد)، يدلّ على حالة كون المرء عبداً أو خاضعاً، وهو خلاف الحرية كما في المعجم الوسيط"
    - lemma: "ارْتِهَان"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من (رهن)، يدلّ على كون المرء مرتهَناً ومأسوراً بدَيْن، وهو أقرب لمفهوم عبودية الدَّيْن"


stage2_evidence:
  per_lemma:
    - lemma: "سُخْرَة"
      confirm:
        - text: "«ما سُخِّرتَه من دابة أو رجل بلا أجر ولا ثمن. يقال: هم سُخْرَة»"
          source: "المعجم الوسيط"
        - text: "«ما تَسَخَّرْتَه من دابة, أو خادم»"
          source: "المعجم الكبير"
        - text: "«(فى النظام الإقطاعى): خدمات إجبارية تُقَدَّم لأمير أو لسيد أو مَلِكٍ»"
          source: "المعجم الكبير"
        - text: "«السُّخَرة: من يَسخَر من الناس وبسكون الخاء من يُسخَر منه أو ما سَخَّرتَ من خادم ودابَّة بلا أجر ولا ثَمَن»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«البَيُّونيّة: «أ» تسخير العُمّال وفاءً لدَيْن. «ب» السُّخرة التأجيرية: تأجير المحكوم عليهم بالسّجن لجماعة من الملتزمين يسخّرونهم في مختلف الأعمال. «ج» وَضْع العامل أو الكادح»"
          source: "المورد الحديث (2008)"
          addition: "المورد يترجم peonage بالبَيُّونيّة ويذكر السُّخرة التأجيرية كنوع منها، مما يؤكد أن السُّخْرَة مصطلح شامل يغطي المفهوم"

    - lemma: "اسْتِعْبَاد"
      confirm:
        - text: "«(1) استعباد؛ استرقاق (2) إخضاع»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(1) كَدْح (2) استعباد (3) «أ» عبوديّة؛ رِقّ. «ب» الاسترقاق: شراء العبيد وامتلاكهم»"
          source: "المورد الحديث (2008)"
          conflict: "الاستعباد يعني الاسترقاق والإخضاع عموماً، وهو أعمّ من السُّخْرَة ولا يخصّ عبودية الدَّيْن"

    - lemma: "رِقّ"
      confirm:
        - text: "«الرِّقّ: بالكسر والتشديد في اللغة الضّعف... وفي الشرع عجز حكمي للشخص بقاء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«وبالكسرِ: المِلْكُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الرِّقُّ: العُبُودَةُ، والجميع الرقِيقُ»"
          source: "المحيط في اللغة للصاحب بن عباد"
      contradicts:
        - text: "«الرق: في اللغة: الضعف... وفي عرف الفقهاء: عبارة عن عجز حكمي شرع في الأصل جزاءً عن الكفر»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الرِّقّ اصطلاح فقهي يخصّ العبودية المشروعة جزاءً عن الكفر، وهو أخصّ من جهة وأعمّ من جهة أخرى عن مفهوم السُّخْرَة"

    - lemma: "عُبُودِيَّة"
      confirm:
        - text: "«(الْعُبُودِيَّة) خلاف الْحُرِّيَّة»"
          source: "المعجم الوسيط"
        - text: "«العبودية: [في الانكليزية] Slavery، bondage»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«العبودية: الوفاء بالعهود، وحفظ الحدود، والرضا بالموجود، والصبر على المفقود»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "العبودية في الاصطلاح الصوفي تعني التذلل لله والعبادة، لا العبودية الاجتماعية"

    - lemma: "ارْتِهَان"
      contradicts:
        - text: "«الارتهان: أخذُ الرهن، والراهن: هو الذي أعطى الرهن، والمرتهن: هو آخذُ الرهن»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الارتهان في الفقه يعني أخذ الرهن (من جانب المرتَهِن)، لا حالة كون المرء مرهوناً أو مستعبَداً بسبب دَيْنه"


stage3_analysis:
  per_lemma:
    - lemma: "سُخْرَة"
      decision: confirmed
      decision_reason: "اللمّة مؤكَّدة في المعاجم الكلاسيكية والحديثة بدلالة العمل القسري بلا أجر، وهي أقرب لفظ عربي لمفهوم peonage. المعجم الكبير يذكرها صراحةً في سياق النظام الإقطاعي. تحتاج تصحيح التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على العمل القسري بلا أجر تحديداً، وعلى مَن يُسخَّر في الخدمة، بخلاف العبودية العامة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُخْرَة"

    - lemma: "اسْتِعْبَاد"
      source: stage1
      decision: removed
      decision_reason: "الاستعباد أعمّ من السُّخْرَة؛ يدلّ على الاسترقاق والإخضاع عموماً ولا يخصّ العمل القسري بلا أجر أو عبودية الدَّيْن. إضافته تُفقد المجموعة دقّتها الدلالية."
      evidence_assessment:
        case: mixed

    - lemma: "رِقّ"
      source: stage1
      decision: removed
      decision_reason: "الرِّقّ مصطلح فقهي راسخ يعني العبودية الشرعية المقرّرة جزاءً عن الكفر، وهو مفهوم أوسع وأخصّ في آن: أوسع لأنه يشمل كل ملكية للإنسان، وأخصّ لأنه مقيَّد بالسياق الشرعي. لا يصلح مرادفاً للسُّخْرَة."
      evidence_assessment:
        case: mixed

    - lemma: "عُبُودِيَّة"
      source: stage1
      decision: removed
      decision_reason: "العبودية خلاف الحرية مطلقاً كما في الوسيط، وهي أعمّ بكثير من مفهوم السُّخْرَة. المجموعة الأعلى (hypernym) هي الإخضاع/الخضوع، والعبودية أقرب إلى ذلك المستوى منها إلى السُّخْرَة تحديداً."
      evidence_assessment:
        case: mixed

    - lemma: "ارْتِهَان"
      source: stage1
      decision: removed
      decision_reason: "الارتهان في الفقه يعني أخذ الرهن من جانب الدائن، لا حالة المدين المستعبَد. الدلالة لا تتقاطع مع مفهوم السُّخْرَة."
      evidence_assessment:
        case: contradicts_only


