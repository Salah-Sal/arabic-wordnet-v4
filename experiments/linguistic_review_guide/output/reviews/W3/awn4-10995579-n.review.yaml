# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10995579-n  |  ILI: i95135
# المراجِع: ناقد لغوي عربي متخصص في AWN4
# التاريخ: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('ديك فوسبري' و'فوسبري') خاليتان من التشكيل، وإن كان التشكيل الكامل للأجزاء الأجنبية غير ممكن لغوياً."
      - "التعريف العربي يحتوي على نص إنجليزي '(Fosbury flop)' يجب استبداله بوصف عربي."
      - "لا يوجد في اللمّات العربية ما يقابل اللمّة الإنجليزية 'Richard D. Fosbury' (الاسم الرسمي الكامل)."
      - "المجموعة تمثّل اسم علم لشخص بعينه؛ وهو ما يقيّد توليد المرشحات على أساليب التعريب فحسب دون إمكانية الاشتقاق أو المجاز."
    observations: >
      هذه المجموعة خاصة برياضي أمريكي بعينه، هو ريتشارد (ديك) فوسبري، مبتكر أسلوب الارتقاء الظهري
      في الوثب العالي الذي عُرف باسمه. الأسماء الأعلام الشخصية الأجنبية لا تقبل في العربية إلا
      التعريب (نقل الأصوات)، وهو ما يعني أن التنافس بين اللمّات يقتصر على صياغات التعريب المختلفة.
      التعريف الحالي سليم في جوهره لكنه يحتاج تحرير النص الإنجليزي المقحَم. المجموعة تفتقر إلى
      تمثيل الاسم الرسمي الكامل (ريتشارد دي فوسبري) المقابل للمّة الإنجليزية "Richard D. Fosbury".

  # التوليد الأعمى — بناءً على التعريف المُقنّع فقط (قبل الاطلاع على اللمّات الموجودة)
  # ملاحظة: لمّا كانت المجموعة تصف شخصاً بعينه فإن "التعريب" هو الأسلوب الوحيد المتاح
  blind_candidates:
    - lemma: "فوزبري"
      generation_method: taarib
      justification: >
        تعريب بديل للاسم الأجنبي Fosbury يعكس النطق الفعلي /ˈfɒzbri/ بالزاي عوضاً
        عن السين، إذ أن الصوت الأصلي هو /z/ وليس /s/.
    - lemma: "رِيتشارد فوسبري"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل Richard Fosbury دون الحرف الأوسط، اعتماداً على الاسم
        الرسمي المسجَّل للرياضي.
    - lemma: "دِيك فوزبري"
      generation_method: taarib
      justification: >
        الجمع بين الاسم الأول "ديك" (الصورة الشائعة لـ Dick) والاسم الأخير بالنطق
        الفعلي بالزاي، مزاوجةً بين الألفة والدقة الصوتية.
    - lemma: "رِيتشارد دِي فوسبري"
      generation_method: taarib
      justification: >
        تعريب الاسم الرسمي الكامل Richard D. Fosbury بما يشمل الحرف الأوسط (D.)
        المُعرَّب "دي"، وهو الاسم المعتمد في الوثائق الرسمية والسجلات الأولمبية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
# (١) مطابقة دفعية: 'ديك فوسبري','فوسبري','الفوسبري','فوزبري','الفوزبري',
#     'ريتشارد فوسبري','ديك فوزبري','ريتشارد دي فوسبري' → لا نتائج
# (٢) جسر إنجليزي: translation_en:"Fosbury" OR "Dick Fosbury" OR "Richard Fosbury" OR "high jump"
#     → وجد: "القفز العالي (رب)." من المورد الحديث 2008 (سياق دلالي فقط)
# (٣) FTS عربي: '"وثب" OR "وثب عال" OR "قفز عال" OR "رياضي امريكي"'
#     → وجد مداخل عن الجذر "وثب" لكن لا شيء عن فوسبري
# النتيجة: المعاجم العربية لا تُسجّل أسماء الأعلام الأجنبية المعاصرة.
stage2_evidence:
  per_lemma:
    - lemma: "ديك فوسبري"
      evidence_status: "no_material_found"

    - lemma: "فوسبري"
      expands:
        - text: "«القفز العالي (رب).» ترجمة: high jump"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >
            يكشف هذا المدخل أن المصطلح الرياضي المحوري لهذه المجموعة (الوثب العالي)
            مُقنَّن في المعاجم الاصطلاحية العربية بصيغة "القفز العالي"، مما يُثري
            السياق الدلالي للمجموعة وإن لم يُثبت اللمّة نفسها.

    - lemma: "فوزبري"
      evidence_status: "no_material_found"

    - lemma: "ريتشارد فوسبري"
      evidence_status: "no_material_found"

    - lemma: "ديك فوزبري"
      evidence_status: "no_material_found"

    - lemma: "ريتشارد دي فوسبري"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ─── اللمّة الموجودة: ديك فوسبري ───
    - lemma: "ديك فوسبري"
      decision: confirmed
      decision_reason: >
        الاسم الأول والأخير معاً بصيغتهما العربية المعتمدة في الإعلام الرياضي العربي.
        يُقابل اللمّة الإنجليزية "Dick Fosbury" مباشرةً، وهو الاسم الذي اشتُهر به
        الرياضي في حياته وفي الوثائق الأولمبية. كلمة "ديك" هي تعريب الاسم الأول
        الإنجليزي Dick (الاسم المختصر لـ Richard). التشكيل المستحَق: "دِيك فوسبري".
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يجمع الاسم الأول "ديك" (الصورة المألوفة) مع الاسم الأخير؛ فيُستخدم عند الإشارة
        الشخصية للرياضي وفي السياقات التي تقتضي التمييز عن غيره ممن يحملون اسم العائلة
        "فوسبري". يغلب في المصادر الأولمبية والتغطيات الرياضية المعاصرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دِيك فوسبري"

    # ─── اللمّة الموجودة: فوسبري ───
    - lemma: "فوسبري"
      decision: confirmed
      decision_reason: >
        اسم العائلة المفرد، وهو الأكثر شيوعاً في الكتابة العربية للإشارة إلى هذه
        الشخصية أو إلى التقنية التي تحمل اسمه (قفزة فوسبري، أسلوب فوسبري). لا
        يوجد تشكيل عربي قياسي لهذا الاسم الأجنبي، وبقاؤه بلا تشكيل هو الممارسة
        المعتمدة في المعاجم والدوريات الرياضية العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اسم العائلة المفرد؛ يُستخدم حين لا يُخشى التباس مع آخرين، ولا سيما عند
        نسبة التقنية أو الأسلوب ("قفزة فوسبري"). أكثر إيجازاً من "ديك فوسبري"
        ويُفضَّل في العناوين والمراجع الإحصائية.

    # ─── المرشح من المرحلة ١: فوزبري ───
    - lemma: "فوزبري"
      source: stage1
      decision: removed
      decision_reason: >
        وإن كان نطق Fosbury يبدأ فعلاً بصوت /z/ في الإنجليزية، إلا أن التعريب الرسمي
        المستقر في المصادر العربية المعتمدة هو "فوسبري" بالسين. لا تُقبَل صياغة بديلة
        غير مؤسَّسة في مقابل صياغة راسخة لأسم علم ثابت.

    # ─── المرشح من المرحلة ١: ريتشارد فوسبري ───
    - lemma: "ريتشارد فوسبري"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الرسمي المسجَّل في السجلات الأولمبية والوثائق الرسمية هو "Richard D. Fosbury"
        بالحرف الأوسط D؛ لذا فإن "ريتشارد فوسبري" دون الحرف الأوسط صياغة ناقصة تتعارض
        مع الاسم الإنجليزي "Richard D. Fosbury" الوارد في المصدر. يُفضَّل الاسم الكامل.

    # ─── المرشح من المرحلة ١: ديك فوزبري ───
    - lemma: "ديك فوزبري"
      source: stage1
      decision: removed
      decision_reason: >
        كما هو الحال في "فوزبري"، لا تُقبَل صياغة بالزاي في مقابل التعريب المستقر
        "فوسبري" بالسين. لا مُسوِّغ لإدخال تعريب موازٍ غير مؤسَّس.

    # ─── المرشح من المرحلة ١: ريتشارد دي فوسبري ───
    - lemma: "رِيتشارد دِي فوسبري"
      source: stage1
      decision: confirmed
      decision_reason: >
        يُقابل مباشرةً اللمّة الإنجليزية "Richard D. Fosbury" الواردة في المصدر OEWN
        وهو الاسم الرسمي الكامل للرياضي. تمثيله عربياً ضروري لضمان اكتمال التغطية
        الاصطلاحية وتمكين البحث عن الاسم الرسمي في قواعد بيانات اللغة العربية.
        "ريتشارد" تعريب Richard، "دي" تعريب D.، "فوسبري" تعريب Fosbury المستقر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الكامل بما يشمل الحرف الأوسط؛ يُستخدم في السياقات الموثَّقة
        والأكاديمية والتاريخية حين يُراد تمييزه عن سواه بأكبر قدر من الدقة. أقل
        شيوعاً في الاستخدام اليومي من "ديك فوسبري" لكنه أكثر رسمية وأدق توثيقاً.
      actions:
        - command: create_entry
          params:
            lemma: "رِيتشارد دِي فوسبري"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "رياضي أمريكي أحدث ثورة في الوثب العالي بتقديم قفزة فوسبري (Fosbury flop) في أولمبياد 1968 (ولد عام 1947)"
    assessment:
      decision: revise
      reason: >
        التعريف سليم في جوهره لكنه يتضمن نصاً إنجليزياً "(Fosbury flop)" يجب إزالته
        لصالح وصف عربي. كذلك فإن تسمية "قفزة فوسبري" داخل تعريف لمّة "فوسبري" تُفضي
        إلى دوران نسبي؛ يُستحسَن وصف الأسلوب بدلاً من الاكتفاء باسمه. كما يمكن إضافة
        تحديد مكان الأولمبياد (مكسيكو) للدقة الموسوعية.
    authored:
      - type: encyclopedic
        text: >
          رياضيٌّ أمريكيٌّ أحدث ثورةً في رياضة الوثب العالي بابتكاره أسلوبَ الارتقاء
          الظهري لاجتياز العارضة — المعروف بقفزة فوسبري — في أولمبياد مكسيكو عام
          1968، مولودٌ عام 1947.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "رياضيٌّ أمريكيٌّ أحدث ثورةً في رياضة الوثب العالي بابتكاره أسلوبَ الارتقاء الظهري لاجتياز العارضة — المعروف بقفزة فوسبري — في أولمبياد مكسيكو عام 1968، مولودٌ عام 1947."

  examples:
    per_lemma:
      - lemma: "دِيك فوسبري"
        examples:
          - text: "غيَّر دِيك فوسبري تاريخ الوثب العالي حين أدار ظهره للعارضة فعبرها بأسلوب لم يكن أحدٌ قد جرَّبه من قبل."
            type: usage
      - lemma: "فوسبري"
        examples:
          - text: "لا يزال أسلوب فوسبري حتى اليوم هو الأسلوب الوحيد السائد في منافسات الوثب العالي على المستوى الدولي."
            type: usage
      - lemma: "رِيتشارد دِي فوسبري"
        examples:
          - text: "سجَّلت الأرشيفات الأولمبية اسمَ رِيتشارد دِي فوسبري بوصفه أحد أكثر الرياضيين تأثيراً في تاريخ ألعاب القوى."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "غيَّر دِيك فوسبري تاريخ الوثب العالي حين أدار ظهره للعارضة فعبرها بأسلوب لم يكن أحدٌ قد جرَّبه من قبل."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "لا يزال أسلوب فوسبري حتى اليوم هو الأسلوب الوحيد السائد في منافسات الوثب العالي على المستوى الدولي."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "سجَّلت الأرشيفات الأولمبية اسمَ رِيتشارد دِي فوسبري بوصفه أحد أكثر الرياضيين تأثيراً في تاريخ ألعاب القوى."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
# ملاحظة: جميع اللمّات المؤكدة أسماء أعلام شخصية أجنبية معرَّبة.
# لا ينطبق عليها مفهوم الجذر العربي ولا اقتباس مقاييس اللغة.
stage5_enrichment:
  per_entry:
    - lemma: "دِيك فوسبري"
      entry_id: "{auto}"
      # root: لا ينطبق — اسم علم أجنبي معرَّب
      # maqayis_quote: لا ينطبق

    - lemma: "فوسبري"
      entry_id: "{auto}"
      # root: لا ينطبق — اسم علم أجنبي معرَّب
      # maqayis_quote: لا ينطبق

    - lemma: "رِيتشارد دِي فوسبري"
      entry_id: "{auto}"
      # root: لا ينطبق — اسم علم أجنبي معرَّب
      # maqayis_quote: لا ينطبق

  per_sense:
    - lemma: "دِيك فوسبري"
      sense_id: "{auto}"
      nuance: >
        الاسم المركب (الأول + الأخير) في صورته المألوفة؛ يُستخدم في السياقات
        الرياضية اليومية وفي التغطيات الصحفية والوثائق الأولمبية العامة حين يُراد
        استحضار شخصية الرياضي بصورة كاملة ومألوفة.
      mwe: true
    - lemma: "فوسبري"
      sense_id: "{auto}"
      nuance: >
        اسم العائلة المفرد؛ يؤدي وظيفةً مزدوجة: الإشارة إلى الشخص (بصورة مختصرة)
        والإشارة إلى التقنية التي تحمل اسمه (قفزة فوسبري، أسلوب فوسبري). أكثر
        إيجازاً وأوسع استخداماً في نسب التقنية.
    - lemma: "رِيتشارد دِي فوسبري"
      sense_id: "{auto}"
      nuance: >
        الاسم الرسمي الكامل بما يشمل الحرف الأوسط؛ يُستخدم في السياقات الأكاديمية
        والوثائق الرسمية والتراجم المتخصصة التي تستوجب دقة التوثيق وتمييز الشخصية
        عن سواها بأقصى درجة من التحديد.
      mwe: true

  synset:
