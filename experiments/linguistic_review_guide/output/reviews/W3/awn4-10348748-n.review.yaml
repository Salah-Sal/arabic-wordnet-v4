          addition: "تُثبت وجود الصيغة الصرفية «مُناجي» بمعنى مَن يُسِرّ ما في نفسه، وهو قريب من المونولوج الداخلي"
        - text: "«مُناجاة: نشاط فردي لشخص يدخل في حوار ذاتي، ويتقاطع مع (المونولوج) بشكل تعسفي. كما تتم المناجاة في السيميائية المسرحية على الحلبة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — أعرابتيرم"
          addition: "تُقرن المناجاة بالمونولوج في السياق المسرحي، مما يُرسّخ الصلة الدلالية بين الجذرين"

    - lemma: "مُؤَدٍّ فَرْدِيٌّ"
