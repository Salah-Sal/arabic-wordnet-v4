# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «منولوجست» تعريب ناقص غير منضبط: حُذف من الكلمة مقطع «مو-» الأول وبقيت على صورة غريبة عن أبنية العربية"
      - "اللمّة «مؤدي المونولوج» عبارة وصفية مركّبة تركيباً إضافياً، لكنها تفشل اختبار التثبيت المعجمي (يمكن إبدال «مؤدي» بـ«مقدم» أو «صاحب» وتبقى صالحة وصفاً)"
      - "كلا اللمّتين مكتوبتان بلا تشكيل"
      - "لا يوجد في المجموعة مصطلح عربي أصيل يغني عن المعرَّب؛ والمفهوم واسع الاستخدام في المسرح العربي الحديث"
    observations: >
      المفهوم الإنجليزي (monologist) يُحيل إلى فنان يمثّل عرضاً فردياً منفرداً، أي يقوم بتقديم «مونولوج» وحده أمام الجمهور.
      المفهوم راسخ في المسرح العربي، غير أن مصطلحه العربي لا يزال يدور في فلك المعرَّب (مونولوج) أو العبارات الوصفية.
      الحاجة ملحّة إلى مصطلح مشتق أو مركّب موحَّد يستغني به عن الاستعانة الدائمة بالمعرَّب.

  blind_candidates:
    - lemma: "الرَّاوِي"
      generation_method: majaz
      justification: >
        الرَّاوِي في تراث العرب هو من يُبلّغ القصص والأشعار منفرداً أمام المستمعين؛ وظيفته الأساسية أداء خطاب فردي لجمهور.
        يمكن توسيع دلالته بالمجاز ليشمل كل فنان يُقدّم عرضاً قولياً منفرداً. إحياء لفظ عربي قديم بدلاً من استخدام المعرَّب.
    - lemma: "مُنَاجٍ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر ن-ج-و على وزن مُفَاعِل (من ناجَى يُنَاجِي). المُناجي هو من يُسِرّ بما في نفسه أو يخاطب غيره خطاباً خاصاً.
        يناسب وظيفة المُنفرِد الذي يُكلِّم الجمهورَ وكأنه يُناجيه. الجذر راسخ، والوزن منتج في صياغة أسماء الفاعل.
    - lemma: "مُؤَدٍّ فَرْدِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (wasfi) من «مُؤَدٍّ» (فاعل من أدّى) و«فَرْدِيٌّ» (نسبة إلى الفرد = المنفرد).
        الجمع بين المؤدِّي ووصف الفردية يُعطي مصطلحاً دقيقاً للعرض المنفرد دون التخصيص بنوع الفن.
    - lemma: "مُونُولُوجِيسْت"
      generation_method: taarib
      justification: >
        تعريب مُنضبط للإنجليزية «monologist»: مُو-نُو-لُو-جِيسْت. يقبل لام التعريف والجمع بالواو والنون (مونولوجيستون).
        ملاذ أخير في غياب بديل عربي راسخ؛ مقبول لأن «مونولوج» نفسه معرَّب ومتداول في المعجمية العربية الحديثة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
