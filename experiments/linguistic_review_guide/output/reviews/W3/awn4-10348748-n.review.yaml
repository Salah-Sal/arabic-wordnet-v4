        - text: "«ناقِلُ الحَدِيث أو الشِّعْرِ أو القِصَّة أو غيرِها. مَنْ يقوم على الخَيْل. (عن ابن سيده)»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
