# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مؤدي المونولوج"
      decision: confirmed
      decision_reason: >
        رغم أن العبارة تفشل اختبار التثبيت المعجمي الصارم (يمكن إبدال «مؤدي» بـ«مقدم»)، فإنها التعبير التقني الوحيد الموجود في المجموعة
        وهي مستخدمة في الصحافة الفنية العربية. سيُضاف إليها «مُؤَدٍّ فَرْدِيٌّ» كمصطلح تكميلي.
        يُصحَّح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُحدِّد طبيعة العرض صراحةً (المونولوج)؛ أخصّ من «مُؤَدٍّ فَرْدِيٌّ» لأنه يُقيّد الانفراد بنوع الفن المسرحي الكلامي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُؤَدِّي الْمُونُولُوج"

    - lemma: "منولوجست"
      decision: removed
      decision_reason: >
        التعريب ناقص وغير منضبط: حُذف المقطع الأول «مو-» من «مونولوج»، فجاءت الصورة «منولوج» لا «مونولوج»، مخالفةً المعيار المستخدم في المعجمية العربية.
        لا وجود للمفردة في أي مصدر معجمي. فضلاً عن ذلك يوجد مرشح أفضل (مُؤَدٍّ فَرْدِيٌّ) ولا حاجة للتعريب في حال قبوله.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الرَّاوِي"
      source: stage1
      decision: removed
      decision_reason: >
        دلالة «الراوي» في العربية محدودة بنقل الحديث والشعر والرواية التراثية (ناقل، محدِّث)،
        وليس الأداء الفني الترفيهي المنفرد. الفرق: الراوي يُبلِّغ ما هو لغيره، أما المونولوجيست
        فيُقدِّم عملاً فنياً أصيلاً. الاستعمال بالمعنى المراد سيُخلّ بالمعجمية المستقرة.
        اختبار الاستبدال: «الراوي» يُستعمل بدل «المحدِّث» في كل سياق، دليل على عدم تخصصه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُنَاجٍ"
      source: stage1
      decision: removed
      decision_reason: >
        «مُناجٍ» يعني من يُسِرّ بأسراره أو عواطفه لغيره، وهو أقرب إلى المونولوج الداخلي (interior monologue)
        منه إلى الفنان المُنفرِد العام. استخدامه لمطلق مؤدي العروض الانفرادية سيُوقع في لبس مع المعنى اللغوي الأصلي.
        كذلك الصيغة «مُناجي» الموجودة في الموسوعة تُثبت أن الكلمة موجودة بمعنى آخر ثابت.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُؤَدٍّ فَرْدِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        تركيب وصفي شفاف ودقيق: «مُؤَدٍّ» (أسم فاعل من أدّى: performer) + «فَرْدِيٌّ» (solo/individual).
        الأدلة تُثبت أن «منفرد» يقابل «solo» في سياق الفنون (مسرد الفن والرياضة)، و«عرض انفرادي» يقابل «one-man show».
        بوابة الجودة: اطّراد (مُؤَدٍّ فردي، عرض فردي، غناء فردي — سلسلة منتظمة)؛ يُسر في التداول؛ ملاءمة للسياق؛ عربي الأساس.
        الفارق الدلالي عن «مُؤَدِّي الْمُونُولُوج»: هذا أعمّ (أي عرض منفرد) وذاك أخصّ (المونولوج تحديداً).
        ملاحظة: في سياق الفنون المسرحية قد يُفضَّل «انفرادي» على «فردي» قياساً على «عرض انفرادي» المستعمل. كلا الوصفين مقبول.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "أشمل من «مُؤَدِّي الْمُونُولُوج» لأنه لا يُقيَّد بفن المونولوج الكلامي؛ يصف أي فنان يُؤدِّي عرضه منفرداً"
      actions:
        - command: create_entry
          params:
            lemma: "مُؤَدٍّ فَرْدِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10348748-n"

    - lemma: "مُونُولُوجِيسْت"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب ملاذ أخير ويُقبل فقط بعد استنفاد البدائل العربية. بما أن «مُؤَدٍّ فَرْدِيٌّ» جرى تأكيده مصطلحاً عربياً وافياً،
        فلا حاجة إلى تعريب جديد. فضلاً عن ذلك فإن «مونولوجيست» تصوغ الكلمة بمقياس إنجليزي (-ist) دون أن يقابله في العربية
        نسق صرفي مقنَّن للاقتراض.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


