        «ساخر» بأنه يحمل طابعاً أسلوبياً تعبيرياً أكثر منه صفةً شخصية، وعن «هجّاء»
        بأنه لا يرتبط بالشعر ولا بتعديد المعايب بصورة مباشرة.
      actions:
