        «لَمَّاز» يُبرز أسلوب الغمز والإشارة غير المباشرة والتعريض؛ هو من يُعيب
        الناسَ بالتلميح لا بالتصريح. يتمايز عن «هجّاء» الذي يهجم مواجهةً وتعديداً
        للمعايب، وعن «ساخر» الذي يُركّز على الاحتقار الاستهزائي، وعن «متهكم» الذي
        يستخدم الأسلوب البلاغي التهكّمي.
      actions:
        - command: create_entry
          params:
            lemma: "لَمَّاز"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10572170-n"

    - lemma: "سَخَّار"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة المسجَّلة في المعاجم هي «السُّخَار» (فُعَال) بمعنى الاسم المجرَّد
        للسخرية (المصدر/المعنى المجرَّد) لا اسم الفاعل الشخصي. لا يوجد في المصادر
        توثيق لـ«سَخَّار» على فَعَّال بمعنى شخص يكثر السخرية. في غياب التوثيق
        المعجمي لا يُقبَل الاشتقاق.

    - lemma: "مُعَرِّض"
      source: stage1
      decision: removed
      decision_reason: >
        «المُعرِّض» لا يُسجَّل في المعاجم بمعنى «الساخر بالتعريض». المعاجم تُوثَّق
        «المَعرِض/المِعرَض» بمعنى المكان والثوب، و«التعريض» كأسلوب بلاغي (مصدر)،
        لكن اسم الفاعل الشخصي «مُعرِّض» بدلالة 'satirist' غير مستخدَم ولا مُسجَّل.
        الاشتقاق سليم نظرياً لكنه يفشل في اختبار التثبيت المعجمي.


