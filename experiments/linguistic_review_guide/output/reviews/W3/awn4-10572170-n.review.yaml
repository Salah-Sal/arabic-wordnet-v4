          conflict: "المعاجم تُسجّل «المَعْرِض/المِعْرَض» بمعنى المكان وثوب العرض،
            وتُسجّل التعريض البلاغي كمصدر لا كاسم فاعل شخصي. «المُعرِّض» بمعنى
            'satirist' غير موثَّق، وفي الاستخدام المعاصر يُفيد أساساً «العارض» لا
            «الساخر بالتعريض»."


