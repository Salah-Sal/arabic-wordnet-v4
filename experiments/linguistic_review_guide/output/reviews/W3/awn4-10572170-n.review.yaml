      nuance_differentiation: >
        «سَاخِر» يصف الصفة الشخصية العامة — الإنسان الذي يميل بطبعه إلى الاستهزاء
        والاحتقار الضمني؛ فهو أكثر شموليةً وأقل تخصصاً أدبياً من «هجّاء» الذي
