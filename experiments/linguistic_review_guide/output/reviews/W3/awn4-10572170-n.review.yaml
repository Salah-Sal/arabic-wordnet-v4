        - text: "«لَمَزَ — اللَّامُ وَالْمِيمُ وَالزَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ
            اللَّمْزُ، وَهُوَ الْعَيْبُ. يُقَالُ لَمَزَ يَلْمِزُ لَمْزًا. قَالَ
            اللَّهُ تَعَالَى: {وَمِنْهُمْ مَنْ يَلْمِزُكَ فِي الصَّدَقَاتِ}.
