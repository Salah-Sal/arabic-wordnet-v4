# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — قُرئ synset_info_masked.yaml أولاً (بدون لمّات)
  # التعريف المُقنّع: "فكاهي يستخدم السخرية والتهكم والغمز لانتقاد الرذائل أو الحماقات"
  blind_candidates:
    - lemma: "هَجَّاء"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (هجو) على وزن فَعَّال الدالّ على كثرة الفعل وشدّته؛ فالهجّاء
        هو من يكثر هجاء الناس وتعديد معايبهم شعراً ونثراً. الوزن يُناسب دلالة «من
        يُمارس السخرية النقدية بإفراط واحتراف»، وهو مصطلح تراثي راسخ في النقد الأدبي
        العربي لوصف الشاعر أو الكاتب الذي يُعنى بانتقاد الرذائل عبر الهجاء.

    - lemma: "لَمَّاز"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (لمز) على وزن فَعَّال؛ واللمز هو العيب والطعن والغمز. اختير
        لأن التعريف يذكر «الغمز» صراحةً، واللمّاز هو من يُعيب الناس ويُلمزهم
        بالإشارة والتعريض. الوزن فعّال يُفيد الكثرة والاحتراف، وهو وارد صريحاً في
        القرآن الكريم (الهُمَزَة اللُّمَزَة) مما يُثبّت سكّه المعجمي.

    - lemma: "سَخَّار"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (سخر) على وزن فَعَّال؛ أي من يكثر السخرية والاستهزاء. ولمّا
        كان التعريف يتمحور حول «السخرية»، فإن اشتقاق اسم الفاعل المكثِّف على فعّال
        يُعطي مصطلحاً مباشراً لمن يحترف السخرية انتقاداً للرذائل.

    - lemma: "مُعَرِّض"
      generation_method: ishtiqaq
      justification: >
        من الجذر (عرض) باب التفعيل، على وزن مُفَعِّل؛ والتعريض في البلاغة هو الإشارة
        إلى المعنى من غير تصريح — وهو من أبرز أساليب الساخر الذي يُلمح ولا يُصرّح
        كما يُفيده «الغمز» في التعريف. المعرِّض هو من يُعرِّض بالناس وينتقدهم تعريضاً.

  # ب. التقييم الأولي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "لمّة «ناقد ساخر» تركيبٌ وصفي حرّ لا يجتاز اختبار التثبيت المعجمي: يمكن إبدال
        «ساخر» بـ«لاذع» أو «حادّ» وتبقى العبارة وصفاً مقبولاً؛ فهي ليست وحدةً معجمية
        ثابتة تُرادف 'satirist' بدلالة محدّدة."
      - "اللمّتان «ساخر» و«متهكم» مكتوبتان بدون تشكيل في السجل — يجب إضافة تشكيل كامل."
      - "التعريف الحالي يبدأ بـ«فكاهي» الذي هو الجنس القريب للمجموعة الأمّ (الفكاهيون)؛
        وهذا يُضعف التمييز بين المجموعتين ولا يُبرز الوظيفة النقدية التي تُميّز الساخر
        عن مجرد الفكاهي."
      - "الترجمة الإنجليزية تذكر 'irony' لكن التعريف العربي يستخدم «الغمز» بدلاً من
        «السخرية اللفظية» أو «الكناية التهكمية» — تقابل دلالي منقوص."
    observations: >
      المجموعة تصف نوعاً أدبياً وإنسانياً عريقاً في الثقافة العربية: الهجّاء المُنتقِد
      للرذائل والحماقات. المفهوم له جذور راسخة في الشعر الجاهلي والإسلامي (هجاء جرير
      والفرزدق والأخطل). اللمّتان الأساسيتان «ساخر» و«متهكم» فصيحتان ومتداولتان في
      العربية المعاصرة، غير أنهما يَصفان الصفةَ الشخصية أكثر مما يصفان الاحتراف
      الأدبي؛ فيما يغطّي المرشّح «هجّاء» الدلالة التراثية الاحترافية. اللمّة «لمّاز»
      تُضيف بُعد الغمز والإشارة الضمنية الذي ورد في التعريف. يُستحسن إزالة «ناقد ساخر»
      لأنها عبارة وصفية حرّة لا مصطلح معجمي، وإضافة «هجّاء» و«لمّاز» كلمّتين موثّقتين.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:

  per_lemma:

    # —— اللمّات الموجودة ——

    - lemma: "ساخر"
      confirm:
        - text: "«الساخر: الميّال إلى السخرية أو البارع فيها.»"
          source: "المورد الحديث (2008) — ARABTERM، translation_en: ironist"
      expands:
        - text: "«سَخِرَ — السِّينُ وَالْخَاءُ وَالرَّاءُ أَصْلٌ مُطَّرِدٌ مُسْتَقِيمٌ
            يَدُلُّ عَلَى احْتِقَارٍ وَاسْتِذْلَالٍ... سَخِرْتُ مِنْهُ، إِذَا هَزِئْتَ
            بِهِ.»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ)"
          addition: "يُفيد الأصل الاشتقاقي أن السخرية تنطوي على الاحتقار والاستذلال،
            مما يمنح اسم الفاعل «ساخر» دلالةً تقييميةً سلبية تجاه المسخور منه."

    - lemma: "متهكم"
      confirm:
        - text: "«التَّهَكُّمُ: التَّهَزُّؤُ.»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ) — مادة هكم"
        - text: "«التَّهَكُّمُ: التَّهَدُّمُ في البِئْرِ ونحوِها، والاسْتِهْزاءُ...»"
          source: "القاموس المحيط للفيروزآبادي (ت. 817هـ)"
        - text: "«التهكم: الِاسْتِهْزَاء.»"
          source: "دستور العلماء للأحمدنكري (ق. 12هـ)"
        - text: "«التّهكّم: هو الاستهزاء. [في الإنجليزية] Mocking, irony»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«هَكَمَ — الْهَاءُ وَالْكَافُ وَالْمِيمُ تَدُلُّ عَلَى تَقَحُّمٍ
            وَتَهَدُّمُ. وَهَكَمَ هَكْمًا: تَقَحَّمَ عَلَى النَّاسِ وَتَعَرَّضَهُمْ
            بِشَرٍّ. وَالتَّهَكُّمُ: التَّهَزُّؤُ.»"
          source: "مقاييس اللغة لابن فارس (ت. 395هـ)"
          addition: "الجذر يدلّ على التقحّم والتهدّم، مما يُضفي على التهكّم معنى الهجوم
            الحادّ الذي يُحطّم هيبة المتهكَّم منه — لا مجرد السخرية الخفيفة."
        - text: "«(تهكم) فلان... وعلى غيره اشتدّ غضبه وحُمقه ووقع فيه وتبختر بطراً...
            وفلاناً وبه: استهزأ به واستخفّ.»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
          addition: "يكشف أن التهكّم يجمع بين الاستهزاء والتعالي والغضب المُبطَّن،
            مما يجعله أشدّ حدّةً من مجرد السخرية."

    - lemma: "ناقد ساخر"
      expands:
        - text: "«ناقِد — critic, reviewer»"
          source: "مسرد الإعلام والتواصل، ALECSO (ArabTerm)"
          addition: "المكوّن «ناقد» موثَّق كمصطلح مستقل بمعنى critic/reviewer، لكن
            التركيب «ناقد ساخر» غير مسجَّل كوحدة معجمية ثابتة في أيٍّ من المصادر."

    # —— مرشحات المرحلة ١ ——

