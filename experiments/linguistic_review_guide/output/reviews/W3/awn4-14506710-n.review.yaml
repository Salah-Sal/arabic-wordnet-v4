# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14506710-n
# impossibility / impossibleness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «استحالة» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط، وهي فقيرة مقارنة بنظيرتها الإنجليزية (impossibility, impossibleness)"
      - "لفظة «استحالة» مشتركة لفظياً: في التراث الفلسفي تعني التغيُّر في الكيف (transformation)، وفي الاستعمال الحديث تعني عدم الإمكان (impossibility) — ينبغي التنبيه على هذا الاشتراك"
    observations: >
      المفهوم المقصود هو الحالة المجردة لعدم إمكان الوجود أو الحدوث، وهو مفهوم فلسفي-منطقي
      له حضور قوي في التراث العربي الإسلامي تحت مصطلحات عدة: الاستحالة، الامتناع، المحال.
      التعريف الحالي واضح وسليم لغوياً. المجموعة الرأسية (hypernym) هي «عدم / لا وجود» وهي ملائمة.
  blind_candidates:
    - lemma: "اِسْتِحَالَة"
      generation_method: ishtiqaq
      justification: "مصدر استحالَ (صارَ مُحالاً) على وزن اسْتِفْعَالَة، يدلّ على حالة كون الشيء محالاً لا يمكن وجوده"
    - lemma: "اِمْتِنَاع"
      generation_method: ishtiqaq
      justification: "مصدر امتنعَ على وزن افْتِعَال من جذر م-ن-ع، يدلّ على وجوب العدم وعدم إمكان الوجود، مصطلح فلسفي راسخ"
    - lemma: "تَعَذُّر"
      generation_method: ishtiqaq
      justification: "مصدر تَعَذَّرَ على وزن تَفَعُّل من جذر ع-ذ-ر، يدلّ على عدم الاستقامة والتعسّر"
    - lemma: "مُحَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من مُحَال على وزن فُعَالِيَّة، يدلّ على صفة كون الشيء محالاً بوصفها حالة مجردة"


stage2_evidence:
  per_lemma:
    - lemma: "اِسْتِحَالَة"
      confirm:
        - text: "«عدم إمكان حصول الشيء.»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«استحالة — impossibility»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«(1) استحالة؛ تعذّر (2) شيء مستحيل أو متعذِّر.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الاستحالة: حركةٌ في الكيف؛ كتسخن الماء وتبرده مع بقاء صورته النوعية.»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى التراثي الفلسفي للاستحالة هو التغيُّر الكيفي (transformation) لا عدم الإمكان"
        - text: "«الاستحالة عند الحكماء هي الحركة الكيفية، وهي الانتقال من كيفية إلى كيفية أخرى تدريجا»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "تأكيد إضافي على أنّ المعنى الأصلي هو التحوّل لا الامتناع"
      expands:
        - text: "«استحال الشيء صار محالا فهو مستحيل، أي أخذ في أن يصير محالا»"
          source: "التوقيف على مهمات التعاريف للمناوي (نقلاً عن الراغب)"
          addition: "يُبيّن الجسر الدلالي بين المعنيين: استحال = تحوّل، ثم استحال = صار محالاً"
        - text: "«(في العُلُوم الطبيعيّة) transformation: تغيَّرُ المادةِ من حالةٍ إلى أخرى»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "في السياق العلمي الحديث تُستعمل استحالة أيضاً بمعنى التحوّل المادي"

    - lemma: "اِمْتِنَاع"
      confirm:
        - text: "«الامتناع: هو عدم الوجوب وعدم الإمكان، والممتنع ما ليس بواجب ولا ممكن.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الامتناع: ضرورة اقتضاء الذات عدم الوجود الخارجي.»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«الامتناع: ضرورة اقتضاء الذات عدم الوجود الخارجي وهذا هو الامتناع الذاتي أو وجوب العدم أولا إمكان الوجود»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«فإن كان وجوب العدم أولا إمكان الوجود بمقتضى الذات فهو الامتناع الذاتي كامتناع شريك الباري أو بمقتضى الغير فهو الامتناع بالغير»"
          source: "دستور العلماء للأحمدنكري"
          addition: "تقسيم الامتناع إلى ذاتي وبالغير يُثري الفهم الدلالي"

    - lemma: "تَعَذُّر"
      confirm:
        - text: "«(1) استحالة؛ تعذّر (2) شيء مستحيل أو متعذِّر.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(تعذر) عَن الأمر تأخّر ومن الذنب تنصّل واحتجّ لنفسه وعليه الأمر شقّ وتعسّر»"
          source: "المعجم الوسيط"
          conflict: "التعذّر يدلّ على الصعوبة والتعسّر لا على الامتناع المطلق؛ فهو أقرب إلى infeasibility منه إلى impossibility"
        - text: "«عليه الأمر: صعُب — الشيء: انمحى»"
          source: "المعجم الوسيط (OCR)"
          conflict: "التأكيد على أنّ تعذّر = صعُب وتعسّر، وليس = استحال"

    - lemma: "مُحَالِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "اِسْتِحَالَة"
      decision: confirmed
      decision_reason: >
        لفظة «استحالة» راسخة في الاستعمال العربي الحديث بمعنى عدم الإمكان (impossibility)،
        وهي مثبتة في معاجم المصطلحات المعاصرة (القانون، الإعلام، اللسانيات، الطب) بهذا المعنى.
        وإن كان المعنى التراثي هو التغيّر الكيفي (transformation)، فقد استقرّ التحوّل الدلالي
        في العربية المعاصرة عبر الوسيط «استحال = صار محالاً». تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تُستعمل في السياقات العامة والقانونية والعلمية المعاصرة، وهي الأكثر شيوعاً وتداولاً للدلالة على عدم الإمكان"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِحَالَة"

    - lemma: "اِمْتِنَاع"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح فلسفي-منطقي تراثي موثّق في كتب التعريفات والمصطلحات الكلاسيكية
        (الجرجاني، التهانوي، الأحمدنكري) بمعنى صريح هو «عدم الوجوب وعدم الإمكان»
        و«ضرورة اقتضاء الذات عدم الوجود الخارجي». هذا المعنى مطابق تماماً لدلالة المجموعة.
        يُضاف لإثراء المجموعة بمصطلح تراثي دقيق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح فلسفي-كلامي تراثي يُستعمل في المنطق وعلم الكلام، يركّز على الضرورة العقلية لعدم الوجود"
      actions:
        - command: create_entry
          params:
            lemma: "اِمْتِنَاع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَعَذُّر"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تدلّ على أنّ «تعذّر» يعني الصعوبة والتعسّر (infeasibility/difficulty)
        لا الامتناع المطلق (impossibility). في المعجم الوسيط: «تعذّر عليه الأمر: شقّ وتعسّر».
        هذا يجعله أقرب دلالياً إلى مفهوم «الصعوبة» أو «عدم الجدوى» لا إلى «الاستحالة المطلقة».

    - lemma: "مُحَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية على استعمال هذا المصدر الصناعي. اللفظة غير مسجّلة في المعاجم
        التراثية أو المعاصرة، ووجود «استحالة» و«امتناع» يُغني عنها.


stage4_content:
  definition:
    current: "عدم القدرة على الوجود أو الحدوث"
    assessment:
      decision: retain
      reason: >
        التعريف واضح ودقيق ومطابق للمفهوم المقصود (incapability of existing or occurring).
        يتّسق مع تعريفات المعاجم العربية المعاصرة مثل «عدم إمكان حصول الشيء» (مسرد الإعلام).
        الجنس القريب (عدم القدرة) والفصل النوعي (على الوجود أو الحدوث) حاضران.
        لا حاجة إلى تعديل.
  examples:
