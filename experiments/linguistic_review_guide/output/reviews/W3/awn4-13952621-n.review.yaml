    - lemma: "زَمَالَة"
      decision: removed
      decision_reason: "الزمالة في المعاجم العربية الحديثة مقصورة على المعنى الأكاديمي (درجة علمية / عضوية مؤسسية). لم يُسجَّل لها في أيّ معجم عربي معنى «حالة الوجود مع شخص». الربط مبنيّ على ترجمة حرفية لـ fellowship الإنجليزية دون مراعاة الاستعمال العربي الفعلي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "صُحْبَة"
      decision: confirmed
      decision_reason: "صُحْبَة مصدر من صَحِبَ يدلّ على المرافقة والمعاشرة صراحةً في المعاجم الكلاسيكية والحديثة. هي أقرب اللمّات إلى جوهر التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ اللمّات دلالةً، تدلّ على مطلق المرافقة والمعاشرة بلا تقييد بسفر أو مخالطة حميمة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صُحْبَة"

    - lemma: "عِشْرَة"
      source: stage1
      decision: confirmed
      decision_reason: "العِشْرَة من أصل يدلّ على المداخلة والمخالطة عند ابن فارس، وتردف الرُّفْقَة والصُّحْبَة في المورد الحديث ترجمةً لـ companionship وcompany وsociety. لفظة فصيحة ثابتة في التراث اللغوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على المخالطة الحميمة والمداخلة في شؤون الحياة اليومية، أعمق من مجرد الصحبة العابرة"
      actions:
        - command: create_entry
          params:
            lemma: "عِشْرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُرَافَقَة"
      source: stage1
      decision: removed
      decision_reason: "المُرَافَقَة مصدر ميمي يدلّ على فعل المصاحبة أكثر من الحالة ذاتها. وهي أقرب إلى accompaniment منها إلى companionship. لا تضيف بُعداً دلالياً جديداً لا تغطيه الصُّحْبَة."
      evidence_assessment:
        case: mixed

    - lemma: "أُنْس"
      source: stage1
      decision: removed
      decision_reason: "الأُنْس يدلّ على الشعور الوجداني الداخلي (ضدّ الوحشة) لا على حالة الوجود الموضوعية مع شخص. حقله الدلالي مختلف، وقد انزاح عند المتصوفة إلى معانٍ باطنية بعيدة عن المعنى المطلوب."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُعَايَشَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد لها أدلّة معجمية مباشرة. المعايشة تدلّ على المشاركة في العيش (cohabitation) وهو أخصّ من حالة الوجود مع شخص، وقد يتضمّن معنى الإقامة المشتركة الذي يتجاوز نطاق هذه المجموعة."
      evidence_assessment:
        case: no_material


