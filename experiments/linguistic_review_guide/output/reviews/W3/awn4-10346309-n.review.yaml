# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-10346309-n  |  ili: i91421  |  pos: n
# modernist — فنان يُحدث قطيعة متعمدة مع الأنماط السابقة
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان مكتوبتان بلا تشكيل كامل"
      - "'فنان حداثي' مركب وصفي حر لا يستوفي اشتراط التثبيت المعجمي؛ يمكن إبدال 'حداثي' بـ'تجديدي' أو 'طليعي' مع بقاء المعنى الوصفي، مما يدل على أنه ليس وحدة معجمية مسكوكة"
      - "لمّة 'حداثي' مستخدمة كاسم بالتحويل الصرفي من الصفة النسبية، وهو استخدام مقبول لكنه غير موثَّق صراحةً كمدخل اسمي في المعاجم الكلاسيكية"
    observations: >
      المجموعة تمثّل مفهوماً نقدياً فنياً حديثاً هو 'الفنان الحداثي' (modernist). الجذر الدلالي
      الطبيعي في العربية هو حدث/حداثة؛ وقد ترسّخ مصطلح 'الحداثة' كمقابل لـ modernisme في
      المعاجم الموحّدة والمعجم الكبير. أما الاسم 'حداثي' (نسبة إلى الحداثة) فيُستخدم في النقد
      الأدبي والفني بوصفه صفةً مُجوَّهرة (substantivized adjective)، وهو مسلك صرفي مشروع في
      العربية. المشكلة الرئيسية تكمن في لمّة 'فنان حداثي' التي هي عبارة وصفية لا مصطلح مسكوك.
  blind_candidates:
    - lemma: "مُجَدِّد"
      generation_method: ishtiqaq
      justification: "مشتق من جذر ج-د-د على وزن مُفَعِّل، يدل على من يُجدِّد ويتجاوز القديم ليأتي بما لم يكن معهوداً؛ التعريف يقول 'يُحدث قطيعة مع الأنماط السابقة' وهذا جوهر معنى التجديد"
    - lemma: "طَلِيعِيّ"
      generation_method: majaz
      justification: "مجاز بالإزاحة الدلالية من 'طليعة الجيش' (من يسبق الصفوف ويستطلع)؛ وُظِّف في النقد الفني بمعنى الفنان الذي يسبق تيارات عصره ويخترق المألوف، وهو قريب جداً من مفهوم الحداثي"
    - lemma: "مُتَجَاوِز"
      generation_method: ishtiqaq
      justification: "مشتق من جذر ج-و-ز على وزن مُتَفَاعِل، يدل على من يتعمَّد تجاوز الحدود والأطر السابقة ورفضها؛ التعريف يُبرز 'القطيعة المتعمَّدة' وهي جوهر معنى التجاوز"
    - lemma: "حَدَاثِيّ"
      generation_method: ishtiqaq
      justification: "اسم منسوب إلى 'الحَداثة' على الوزن النسبي فَعَالِيّ، يعني المنتسب إلى مذهب الحداثة الفنية والأدبية؛ مصطلح مسكوك في النقد العربي المعاصر ومثبَّت في معجمَي الوسيط والكبير كمفهوم ثقافي فني"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "حداثي"
      expands:
        - text: "«في الأدب والفن modernisme: مصطلح أُطلِق على مجموعة الحركات الأدبية التي ظهرت في أوربا الغربية بعد الحرب العالمية الأولى مباشرةً، وشملَتْ هذه الحركة الاتجاهات المستحدَثة في الشعر والفنون، من تجريد ونَفعية مستقبلية وتعبيرية»"
          source: "المعجم الكبير"
          addition: "يوثّق 'الحداثة' كمصطلح فني/أدبي مقابلاً لـ modernisme؛ يُثبّت الجذر الاشتقاقي لـ'حداثي' ويدعم المعنى الفني للمجموعة"
        - text: "«حركة أدبية وفنية بداية القرن العشرين، تستبعد التقاليد القديمة وتدعو إلى عالم حداثي بحضارة مَدَنية تتصدرها الآلة والسّرعة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "ورود صفة 'حداثي' في النص الاصطلاحي يُثبّت استخدام الكلمة صفةً راسخة في المعجمية العربية المعاصرة"

    - lemma: "فنان حداثي"
      evidence_status: "no_material_found"

    # ── مرشحات المرحلة ١ ──

    - lemma: "مُجَدِّد"
      contradicts:
        - text: "«المُجَدَّد: من الثياب: ما فيه خيوط مختلفة»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأثبت في المعاجم الحديثة لـ'المجدَّد' (اسم مفعول) هو النسيج المخطَّط، لا الفنان المجدِّد"
        - text: "«المُجَدِّد: مَنْ يُحيي ما اندرس من العمل بالكتاب والسنة»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "المعنى الراسخ للمُجَدِّد (اسم فاعل) هو المُحيي للدين، وهو حمل ديني ثقيل يُصعِّب توظيفه للدلالة على الفنان الحداثي"
      expands:
        - text: "«المجدَّد: في الإنكليزية: Innovated poetry without love — على صيغة اسم المفعول من التجديد عند الشعراء: هو القصيدة التي لا تشبيب فيها»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُثبّت أن اصطلاح 'التجديد' يُستخدم في سياق النقد الفني والأدبي، وإن كان المعنى المحدد هنا مختلفاً"

    - lemma: "طَلِيعِيّ"
      confirm:
        - text: "avant-garde — مجال: الإعلام والتواصل"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
      expands:
        - text: "precursory — مجال: المعجم الطبي الموحد"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُثبّت أن 'طليعي' مصطلح موحَّد عربي مستخدَم في أكثر من حقل، وإن تباينت حقوله بين الفني (avant-garde) والطبي (precursory)"

    - lemma: "مُتَجَاوِز"
      evidence_status: "no_material_found"

    - lemma: "حَدَاثِيّ"
      expands:
        - text: "«حداثة: modernism — مجال: التقنيات التربوية»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          addition: "يُثبّت 'حداثة' كمقابل رسمي لـ modernism في المعجمية الموحّدة؛ يدعم صحة النسبة 'حداثي' للدلالة على المنتسب إلى هذا المفهوم"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حداثي"
      decision: confirmed
      decision_reason: >
        الاسم المنسوب 'حداثي' مشتق بصورة قياسية من 'الحداثة' (modernism) التي ثبتت معجمياً
        كمقابل لـ modernisme/modernism في المعجمية الموحّدة والمعجمين الوسيط والكبير. تجوهر
        الصفة النسبية إلى اسم للشخص أسلوب عربي منتج ومشروع (كـ'إسلامي' → المنتسب إلى الإسلام،
        و'اشتراكي' → المنتسب إلى الاشتراكية). اللمّة مُستخدَمة في النقد الأدبي والفني العربي
        المعاصر. تحتاج فقط إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكّدة في المجموعة بعد حذف المركب الوصفي؛ تُبرز الانتساب الصريح
        إلى مذهب الحداثة الفنية وقصدية الخروج على الأنماط السابقة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَدَاثِيّ"

    - lemma: "فنان حداثي"
      decision: removed
      decision_reason: >
        فشل في اختبار التثبيت المعجمي (MWE fixedness test): يمكن إبدال 'حداثي' بـ'تجديدي'
        أو 'طليعي' أو 'تجريبي' مع بقاء التركيب وصفاً نحوياً صحيحاً، مما يُثبّت أنه عبارة
        وصفية حرة لا وحدة معجمية مسكوكة. لم يُعثَر عليه في أي معجم كمدخل مستقل. الحذف
        لا يُخِلّ بالمجموعة لأن 'حداثي' وحده كافٍ للتعبير عن المفهوم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُجَدِّد"
      source: stage1
      decision: removed
      decision_reason: >
        الحِمْل الدلالي الراسخ لـ'المُجَدِّد' في المعاجم مزدوج الإشكالية: (أ) الاستخدام
        الفقهي الغالب هو 'من يُحيي الدين كل مائة سنة' (حديث أبي داود)، وهذا حمل ديني ثقيل
        يُفقِد الكلمة صلاحيتها لمعنى الفنان الحداثي. (ب) المعنى اللغوي في المعجم الوسيط هو
        نوع من الثياب المُخطَّطة. لا تُوجَد شواهد معجمية تدعم استخدام 'المجدِّد' للفنان
        الحداثي تحديداً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "طَلِيعِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم تأكيد 'طليعي' = avant-garde في ARABTERM، فإن 'الطليعي' ليس مرادفاً دقيقاً
        لـ'الحداثي': الطليعي يدل على السبق والتقدم على الغير (forward-looking), بينما
        الحداثي يدل على القطيعة المتعمَّدة مع الأنماط السابقة (break with the past).
        الفارق دلالي جوهري: قد يكون الفنان طليعياً دون أن يكون حداثياً بالمعنى الاصطلاحي.
        إضافته ستُحدث توسيعاً دلالياً غير دقيق للمجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُتَجَاوِز"
      source: stage1
      decision: removed
      decision_reason: >
        لا سند معجمي يُثبّت هذه اللمّة للدلالة على الفنان الحداثي. الكلمة صحيحة اشتقاقاً
        لكنها عامة جداً (تعني كل من يتجاوز حداً أو موضعاً)، ولا تُكوِّن وحدةً اصطلاحية
        ثابتة في الخطاب الفني أو النقدي العربي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "حَدَاثِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة 'حداثي' بعد إضافة التشكيل؛ هو ليس لمّةً جديدة بل
        تصحيح للمّة القائمة. تمت معالجة هذا الأمر بإجراء update_lemma على اللمّة الموجودة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


