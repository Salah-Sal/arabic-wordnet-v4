# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-10213162-n  |  ILI: i90622  |  POS: n
# Concept: hunting guide (دليل صيد)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # ── أ. اللمّات المرشحة (توليد أعمى من الملف المُقنَّع) ──
  blind_candidates:
    - lemma: "مُرْشِدُ الصَّيْدِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من "مُرْشِد" (اسم فاعل من أرشدَ على وزن مُفْعِل، جذر رشد)
        و"الصَّيْد" (نشاط الاصطياد). الإرشاد يفيد إقامة الطريق واستقامته، وهو
        أنسب من "دليل" للتعبير عن المتخصص الذي يُرافق الصيادين ويوجّههم
        ميدانياً في أراضٍ غير مألوفة. النمط التركيبي "مُرْشِد + X" شائع في
        العربية المعاصرة (المرشد السياحي، مرشد السفن).

    - lemma: "رَائِدُ الصَّيَّادِينَ"
      generation_method: majaz
      justification: >
        "الرَّائِد" في أصله الكلاسيكي من يتقدَّم القوم يبصر لهم الكلأ ومساقط
        الغيث في الأراضي المجهولة — وهي وظيفة متطابقة جوهرياً مع "دليل الصيد".
        إحياء للفظ الميت بتوسيع دلالته من استطلاع المراعي إلى استطلاع مناطق
        الصيد وإرشاد الصيادين فيها.

    - lemma: "هَادِي الصَّيَّادِينَ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من "هَادٍ" (اسم فاعل من هدى، جذر هدي، بمعنى المتقدِّم
        للإرشاد) و"الصَّيَّادِين". الهادي مرادف "الدليل" في المعجم الوسيط،
        والتركيب يُخصِّص هذا الإرشاد بالصيادين.

    - lemma: "مُتَتَبِّعُ الصَّيْدِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من "مُتَتَبِّع" (اسم فاعل من تتبَّعَ على وزن مُتَفَعِّل،
        جذر تبع) و"الصَّيْد". يصف من يتتبَّع آثار الفريسة ويقفو مسالك الصيد
        في مناطق غير مألوفة ليدلَّ عليها الصيادين.

  # ── ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل) ──
  assessment:
    concerns:
      - "اللمّة الوحيدة 'دليل صيد' تفتقر إلى التشكيل الكامل."
      - "المجموعة لا تحتوي إلا على لمّة واحدة — يُعدّ ذلك فقراً مصطلحياً في مجال الإرشاد السياحي والصيدي."
      - "التركيب 'دليل صيد' (نكرة + نكرة) صيغة خام؛ الصيغة الأكثر تقليداً في المعجمية 'دَلِيلُ صَيْدٍ' بالتنوين الكامل."
    observations: >
      "دليل صيد" تركيب إضافي إضافي (مضاف ومضاف إليه نكرتان) يؤدي المعنى
      المطلوب: شخص يتولى إرشاد الصيادين في مناطق لا يعرفونها. الجنس القريب
      هو "دليل" (شخص يُبيّن الطريق بأمارة)، والفصل النوعي هو تخصيص ذلك
      بنشاط الصيد في مناطق غير مألوفة. يعاني التعريف الحالي من صياغة جملة
      وصفية معلَّقة بدلاً من التعريف المعجمي الحدِّي، كما يفتقر المجموع
      إلى لمّة بديلة تُثري الشبكة الدلالية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  # استعلامات مُنفَّذة:
  # Q1: مطابقة دفعية — مرشد، رائد، هادي، قاص، دليل، صياد، صيد
  # Q2: جسر إنجليزي — hunting guide, hunt guide, game guide, safari guide
  # Q3: FTS عربي — صيد، صياد، دليل الصيد، مرشد الصيد
  # Q4: مقاييس اللغة — دلل، رشد، رود، هدي، صيد

  per_lemma:

    - lemma: "دليل صيد"
      confirm:
        - text: >
            «الدليل: لغة، المرشد وما به الإرشاد. وفي عرف أهل الميزان: ما يلزم
            من العلم به العلم بآخر، والأول الدال والثاني المدلول.»
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: >
            «الدَّلِيل: في اللغة المرشد وما به الإرشاد.»
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: >
            «(الدَّالُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا إِبَانَةُ الشَّيْءِ
            بِأَمَارَةٍ تَتَعَلَّمُهَا... دَلَلْتُ فُلَانًا عَلَى الطَّرِيقِ.
            وَالدَّلِيلُ: الْأَمَارَةُ فِي الشَّيْءِ.)»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يُثبت مقاييس اللغة أن أصل "دليل" هو إبانة الطريق بأمارة مكتسبة —
            وهذا يلتقي مع الدليل الصيدي الذي يعتمد على معرفة الأرض المكتسبة
            بالخبرة.

    - lemma: "مُرْشِدُ الصَّيْدِ"
      confirm:
        - text: >
            «المُرْشِد: الواعظ، هادي السفن في المضايق، دليل الشرطة.»
          source: "المعجم الوسيط"
        - text: >
            «المُرْشِد: الواعظ، وقيل: الهادي. هادي السفن في المضايق. دليل
            الشرطة إلى الخارجين على القانون. المُرْشِد السياحيُّ: من يصحب
            السياح في زيارتهم للآثار ليشرح لهم ما يرونه.»
          source: "المعجم الكبير"
      expands:
        - text: >
            «الرَّاءُ وَالشِّينُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى
            اسْتِقَامَةِ الطَّرِيقِ. فَالْمَرَاشِدُ: مَقَاصِدُ الطُّرُقِ.
            وَالرُّشْدُ وَالرَّشَدُ: خِلَافُ الْغَيِّ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            جذر رشد يدل على استقامة الطريق ومقاصده — دلالة ملائمة تماماً
            للمرشد الصيدي الذي يُقيم الطريق لصيادين في أرض مجهولة.

    - lemma: "رَائِدُ الصَّيَّادِينَ"
      confirm:
        - text: >
            «(الرَّائِد): مَنْ يتقدَّم القومَ يبصر لهم الكلأَ ومساقط الغيث.»
          source: "المعجم الوسيط"
        - text: >
            «الرَّائِد: الذي يتقدم القوم يبصر لهم مواضع الكلأ ومساقط الغيث.
            من يقدم — غير مسبوق — على عمل فيمهد الطريق لمن بعده، كرائد الفضاء.»
          source: "المعجم الكبير"
      expands:
        - text: >
            «الرَّاءُ وَالْوَاوُ وَالدَّالُ مُعْظَمُ بَابِهِ يَدُلُّ عَلَى
            مَجِيءٍ وَذَهَابٍ مِنِ انْطِلَاقٍ فِي جِهَةٍ وَاحِدَةٍ...
            يَقُولُ: بَعَثْنَا رَائِدًا يَرُودُ الْكَلَأَ، أَيْ يَنْظُرُه
            وَيَطْلُبُهُ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            "رائد" في مقاييس اللغة يعني من يتقدَّم لاستكشاف الأرض وطلب ما
            ينفع القوم — وهو فعلياً دور الدليل الصيدي في أراضٍ غير مألوفة.

    - lemma: "هَادِي الصَّيَّادِينَ"
      confirm:
        - text: >
            «(الهادي): الدليل.»
          source: "المعجم الوسيط"
        - text: >
            «هَدَيْتُهُ الطَّرِيقَ هِدَايَةً، أَيْ تَقَدَّمْتُهُ لِأُرْشِدَهُ.
            وَكُلُّ مُتَقَدِّمٍ لِذَلِكَ هَادٍ.»
          source: "مقاييس اللغة لابن فارس"

    - lemma: "مُتَتَبِّعُ الصَّيْدِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "دليل صيد"
      decision: confirmed
      decision_reason: >
        تركيب إضافي كلاسيكي واضح الدلالة على المفهوم: شخص يُبيّن الطريق
        (دليل) في نشاط الصيد. أدلة المعجم تؤكد "دليل" بمعنى المرشد البشري.
        اللمّة مقبولة معجمياً وتختبر اختبار السكّ (لا يمكن إبدال "صيد" بمرادف
        دون تغيير الاختصاص). تحتاج فقط تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        "دَلِيلُ صَيْدٍ" يُركّز على وظيفة الإبانة والدلالة بالأمارة
        (من دلَّ على الطريق)، وهو أكثر رسمية ووظيفية. يُستعمل في السياقات
        التوثيقية والإدارية لتسمية المهنة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَلِيلُ صَيْدٍ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُرْشِدُ الصَّيْدِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        تركيب إضافي راسخ يوازي "المرشد السياحي" الموثَّق في المعجم الكبير.
        جذر رشد يدل على استقامة الطريق — دلالة ملائمة تماماً لمن يُقيم
        الطريق في أراضي الصيد المجهولة. يختبر اختبار السكّ بنجاح.
        لا يمكن إبدال "الصَّيْد" بمرادف دون تغيير التخصص.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        "مُرْشِدُ الصَّيْدِ" يحمل دلالة الإرشاد الفعّال والتوجيه الميداني
        (من الإرشاد = الهداية الإيجابية)، وهو أكثر شيوعاً في الخطاب
        السياحي المعاصر. يُضمِّن معنى الصلاحية الواسعة (إرشاد + نصح +
        توجيه).
      actions:
        - command: create_entry
          params:
            lemma: "مُرْشِدُ الصَّيْدِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رَائِدُ الصَّيَّادِينَ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم عراقة "رائد" الكلاسيكي ودلالته القريبة جداً من المفهوم، فإن
        "رائد الصيادين" (بصيغة جمع المضاف إليه) ثقيل التركيب وغير متداول
        في المعجمية المعاصرة. فضلاً عن ذلك، "رائد" اليوم يُوحي بالريادة
        والإبداع السابق (رائد الفضاء، رائد التقنية) أكثر من دور المُرافق
        الخبير؛ مما يُولِّد التباساً دلالياً مع السياق المطلوب.

    - lemma: "هَادِي الصَّيَّادِينَ"
      source: stage1
      decision: removed
      decision_reason: >
        "الهادي" مرادف مباشر للدليل دون فارق نوعي مستقل. وجود "دَلِيلُ
        صَيْدٍ" في المجموعة يُغني عنه، إذ لا تضيف "هادي الصيادين" نُوانسة
        دلالية تُبرِّر إدراجها كلمّة مستقلة.

    - lemma: "مُتَتَبِّعُ الصَّيْدِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. التعبير وصفي حر لا يجتاز اختبار التثبيت المعجمي:
        يمكن إبدال "الصَّيْد" بـ"الطريدة" أو "الفريسة" وتبقى العبارة
        صالحة كوصف — دليلٌ على أنها ليست وحدة معجمية مسكوكة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "دليل للأشخاص الذين يصطدون في مناطق غير مألوفة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي جملة وصفية معلَّقة تبدأ بـ"دليل" الذي هو المضاف في
        اللمّة نفسها (خطر الدوران)، وتستخدم صيغة "الذين يصطدون" العامية
        المشوبة. يفتقر التعريف إلى جنس قريب محدَّد (شخص / متخصص) وفصل
        نوعي واضح يُبيِّن الاختصاص الجغرافي والوظيفي.
    authored:
      - type: terminological
        text: >
          شَخْصٌ مُتَخَصِّصٌ يُرافق الصَّيَّادِين في المناطق غير المألوفة
          لإرشادهم إلى مسالك الطرائد وأماكن تجمُّعها، مُعتمِداً على معرفته
          الميدانية بالأرض وعاداتها.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          يضطلع دليل الصيد بمهمة قيادة الصيادين عبر أراضٍ وغاباتٍ لا
          يألفونها، فيُحدِّد مواطن الطرائد ومساراتها، ويُقدِّم خبرته
          في أساليب الاقتراب والإيقاع. كثيراً ما يكون هذا المتخصص من
          أبناء المنطقة الذين اكتسبوا خبرتهم بالممارسة الطويلة.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            شَخْصٌ مُتَخَصِّصٌ يُرافق الصَّيَّادِين في المناطق غير المألوفة
            لإرشادهم إلى مسالك الطرائد وأماكن تجمُّعها، مُعتمِداً على معرفته
            الميدانية بالأرض وعاداتها.
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >
            يضطلع دليل الصيد بمهمة قيادة الصيادين عبر أراضٍ وغاباتٍ لا
            يألفونها، فيُحدِّد مواطن الطرائد ومساراتها، ويُقدِّم خبرته
            في أساليب الاقتراب والإيقاع.

  examples:
    per_lemma:
      - lemma: "دَلِيلُ صَيْدٍ"
        examples:
          - text: >
              اصطحب الرحَّالةُ دليلَ صيدٍ محلِيّاً يعرف مسالك الغابة
              وأماكن تجمُّع الطرائد فيها.
            type: usage

      - lemma: "مُرْشِدُ الصَّيْدِ"
        examples:
          - text: >
              عيَّنت الشركةُ السياحيةُ مُرْشِدَ صيدٍ متمرِّساً لمرافقة
              الوفد خلال رحلتهم في السهول البعيدة التي لم يزوروها من قبل.
            type: usage

    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: >
            اصطحب الرحَّالةُ دليلَ صيدٍ محلِيّاً يعرف مسالك الغابة
            وأماكن تجمُّع الطرائد فيها.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
