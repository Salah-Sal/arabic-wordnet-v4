# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14037020-n
# cold storage — في حالة تعليق أو تأجيل
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «حفظ بارد» ترجمة حرفية للإنجليزية cold storage ولم تُسجَّل في أيّ معجم عربي بوصفها وحدة معجمية ثابتة"
      - "التعريف العربي «في حالة تعليق أو تأجيل» عبارة وصفية ظرفية وليس تعريفاً معجمياً سليماً؛ ينقصه الجنس القريب"
      - "المفهوم مجازي (التخزين البارد كناية عن التأجيل) وهو مفهوم إنجليزي لا يوجد له مقابل اصطلاحي ثابت بالعربية بنفس الصورة"
    observations: "المجموعة تمثّل المعنى المجازي للتعبير الإنجليزي cold storage أي حالة تعليق أمر أو إرجائه إلى أجل غير مسمّى. في العربية يُعبَّر عن هذا المعنى بلفظ «تجميد» مجازاً (تجميد المفاوضات، تجميد الأسعار)، وهو مجاز مُكتسَب حديثاً أجازه مجمع اللغة المصري. أمّا «حفظ بارد» فتركيب إضافي لا سابقة له في الاستعمال العربي."
  blind_candidates:
    - lemma: "تَجْمِيد"
      generation_method: majaz
      justification: "مجاز من التجميد الحسّي (تحويل السائل إلى جامد) إلى تجميد الأمور والقرارات، أي تعليقها ووقفها مؤقتاً. شائع في الاستعمال الحديث: تجميد المفاوضات، تجميد الأسعار."
    - lemma: "إِرْجَاء"
      generation_method: ishtiqaq
      justification: "مصدر أَرْجَأَ على وزن إِفْعَال من الجذر رجأ، بمعنى التأخير إلى أجل. ورد في معاجم المصطلحات الحديثة مقابلاً لـ postponement."
    - lemma: "تَعْطِيل"
      generation_method: ishtiqaq
      justification: "مصدر عَطَّلَ على وزن تَفْعِيل من الجذر عطل، بمعنى الإيقاف المؤقت عن العمل. ورد في المورد الحديث مقابلاً لـ abeyance بمعنى تعطيل مؤقت."
    - lemma: "رَكْن"
      generation_method: majaz
      justification: "مجاز من ركن الشيء أي وضعه جانباً وأسنده إلى ركن، كناية عن إهماله وتعليقه. لكنّ هذا الاستعمال المجازي غير مسجّل معجمياً."

stage2_evidence:
  per_lemma:
    - lemma: "تَجْمِيد"
      confirm:
        - text: "«تَجْمِيد المفاوضات — الرأي: مرفوضة عند الأكثرين — الصواب والرتبة: تَجْمِيد المفاوضات [فصيحة] — التعليق: ورد الفعل «جمّد» بتضعيف الميم لازمًا في تاج العروس، وكذا ورد مصدره «تجميد»، وأجاز مجمع اللغة المصري استخدام الفعل «جَمّد» ومصدره «التجميد» ... واعتبر وصف المفاوضات بالتجميد ضربًا من المجاز»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«تجميد الأثمان» = freezing of prices؛ «تجميد الأسعار» = price freeze؛ «تجميد الأجور» = wage freeze؛ «تجميد رأس المال» = capital consolidation؛ «تجميد دين» = debt consolidation"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) والاقتصاد (2000)"
      expands:
        - text: "«بانخفاض درجة الحرارة يتحول السائل إلى بلورات صلبة (نقية من الأملاح)»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "المعنى الحسّي الأصلي للتجميد الذي انبثق منه المجاز"

    - lemma: "حفظ بارد"
      contradicts:
        - text: "«تخزين بارد» = cold storage (المَكنَز الزراعي)؛ «تَخْزِين بَارِد» = cold storage (المعجم الموحد لمصطلحات علم الصيدلة)؛ «تخزين مُبرَّد» = cold storage (المعجم الموحد لمصطلحات تقانات الأغذية)"
          source: "ARABTERM — عدة معاجم"
          conflict: "المعاجم العربية المتخصصة تستعمل «تخزين بارد» أو «تخزين مبرَّد» للمعنى الحسّي لـ cold storage، ولم يرد «حفظ بارد» في أيّ منها. كما أنّ هذه المصطلحات تشير إلى التخزين المادي لا المعنى المجازي (التعليق والتأجيل)."

    - lemma: "إِرْجَاء"
      confirm:
        - text: "«إرجاء — إلى أجل مسمّى أو غير مسمّى» = postponement"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
        - text: "«تأجيل؛ إرجاء؛ تأخير» = postponement"
          source: "المورد الحديث (2008)"
        - text: "«(1) تعليق؛ إرجاء ... in suspense: مُعَلَّق؛ غير مفصول فيه» = suspense"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) «أ» حرمان مؤقَّت ... «ب» تعطيل مؤقَّت. «ج» تعليق. «د» إرجاء. «هـ» توقّف عن الدَّفع» = suspension"
          source: "المورد الحديث (2008)"
          addition: "الإرجاء يُذكَر مرادفاً للتعليق في سياق المعنى المجرد لـ suspension"

    - lemma: "تَعْطِيل"
      confirm:
        - text: "«(1) تعطيل؛ تعليق؛ إيقاف مؤقَّت (2) لافعّاليّة مؤقّتة» = abeyance"
          source: "المورد الحديث (2008)"
        - text: "«تعليق (عَمَلٍ أو وَظيفَة)» = abeyance"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "رَكْن"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَجْمِيد"
      decision: confirmed
      decision_reason: "لفظ «تجميد» مجاز مُجاز من مجمع اللغة المصري للدلالة على التعليق المؤقت (تجميد المفاوضات، تجميد الأسعار). وهو أقرب مقابل عربي لمفهوم cold storage المجازي، إذ يستحضر صورة التبريد/التجميد نفسها. مُؤصَّل صرفياً على وزن تَفْعِيل من جَمَّدَ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يحمل صورة مجازية حسّية (التبريد) تُوحي بتوقّف مؤقّت مع إمكانية الإعادة لاحقاً، وهو أخصّ من مجرّد التأجيل أو التعليق."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَجْمِيد"

    - lemma: "حفظ بارد"
      decision: removed
      decision_reason: "تركيب إضافي غير مسجّل في أيّ معجم عربي. المعاجم المتخصصة تستعمل «تخزين بارد» أو «تخزين مبرَّد» للمعنى الحسّي، ولم يرد «حفظ بارد» قطّ. فضلاً عن ذلك، المعنى المجازي (التأجيل) لا يُعبَّر عنه بهذا التركيب في العربية. يفشل في اختبار التثبيت المعجمي واختبار السكّ."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِرْجَاء"
      source: stage1
      decision: removed
      decision_reason: "الإرجاء مرادف عامّ للتأجيل والتعليق وهما لمّتا المشمول الأعلى (hypernym: awn4-14034107-n). إضافته إلى هذه المجموعة يُلغي الفرق بين المستويين في الهرم الدلالي. المجموعة الحالية تخصّ المعنى المجازي المتضمّن صورة التبريد/التجميد لا مطلق الإرجاء."

    - lemma: "تَعْطِيل"
      source: stage1
      decision: removed
      decision_reason: "التعطيل يعني الإيقاف المؤقت بصورة عامة، وهو أقرب إلى مفهوم المشمول الأعلى (تعليق/وقف) منه إلى المعنى المجازي الخاص بالتجميد. لا يحمل صورة التبريد المميّزة لهذه المجموعة."

    - lemma: "رَكْن"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استعمال «ركن» بمعنى التأجيل أو التعليق. الجذر يدلّ على القوة والثبات والجانب، ولا صلة دلالية بالمفهوم المطلوب."

