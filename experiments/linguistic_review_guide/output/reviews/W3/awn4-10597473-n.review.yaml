# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'متأهل لنصف النهائي' عبارة وصفية طويلة تفتقر إلى التشكيل وإلى التثبيت المعجمي الرسمي كوحدة معجمية"
      - "المجموعة تخلو من أي مصطلح مفرد أو وحيد الكلمة للمفهوم"
      - "تضمين حرف الجر (لـ) في اللمّة يُثقل البنية ويُبعدها عن الصيغة الإضافية المعهودة"
      - "التعريف العربي سليم جوهرياً لكن الصياغة تفتقر إلى الجنس القريب الصريح والمصطلح التقني (دور نصف النهائي)"
    observations: >
      المفهوم (semifinalist) مصطلح رياضي حديث يدل على أحد أربعة متنافسين في دور نصف النهائي
      ببطولة إقصائية. العربية لا تملك كلمة مفردة له، فتلجأ إلى التركيب. أشيع الصيغ في
      الإعلام الرياضي العربي هي العبارتان 'متأهل لنصف النهائي' (بحرف جر) و'مُتَأَهِّلُ النِّصفِ
      النِّهَائيّ' (مركّب إضافي). الجذور المشكِّلة للعبارة (أهل، نصف، نهي) جذور عربية
      فصيحة موثقة في مقاييس اللغة. المفهوم لا يقبل اشتقاقاً مفرداً مُقنعاً، ومسلك التركيب
      الإضافي هو المناسب للتوليد المصطلحي.

  blind_candidates:
    - lemma: "مُتَأَهِّلُ النِّصْفِ النِّهَائِيِّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي خالص من ثلاث كلمات: مُتَأَهِّل + النِّصف + النِّهَائيّ. يُعبّر بإيجاز
        ووضوح عن الفرد الذي بلغ دور نصف النهائي؛ يُستعمل في التقارير والقوائم الرياضية
        العربية كوحدة اصطلاحية شبه ثابتة. يجتاز اختبار السكّ: لا يمكن إبدال 'نصف' بـ
        'شطر' دون تغيير المعنى الاصطلاحي.
    - lemma: "نِصْفِيٌّ"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (ن-ص-ف) على وزن فِعْلِيّ (نسبة). يُحيل إلى الكائن في 'النصف' أي
        مرحلة نصف النهائي؛ مصطلح موجز محتمل وإن لم يُوثَّق استعماله الرياضي في المعاجم.
    - lemma: "رُبَاعِيٌّ"
      generation_method: majaz
      justification: >
        من جذر (ر-ب-ع)؛ المفهوم يدل على 'واحد من أربعة متبقين'، فاستُعيد المجاز العددي
        الذي قد يدل على المتنافس ضمن الأربعة الأوائل. محاولة لإحياء لفظ قديم بدلالة
        رياضية جديدة.
    - lemma: "شِبْهُ نِهَائِيٍّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من شِبْه + نِهَائِيّ، يُقابل البادئة (semi-) في semifinalist؛ يصف
        المتنافس الواصل إلى ما يُشبه النهائي، أي مرحلة ما قبله مباشرة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت:
# Q1 — مطابقة دفعية: متأهل لنصف النهائي + المرشحات الأربعة (بالصيغتين)
# Q2 — جسر إنجليزي: semifinalist / semi-finalist / semifinal / semi-final
# Q3 — إثراء بالمعرّف: entry_ids 715988, 715989
# Q4 — بحث FTS عربي: نصف نهائي، الإقصاء، متأهل، دور الأربعة
# Q5 — مقاييس اللغة: جذور أهل / نصف / نهي / خصم
stage2_evidence:
  per_lemma:
    - lemma: "متأهل لنصف النهائي"
      evidence_status: "no_material_found"

    - lemma: "مُتَأَهِّلُ النِّصْفِ النِّهَائِيِّ"
      confirm:
        - text: "«نِصْف النّهائيّ: لاعب أو فريقٌ مشترك في مباراة نصف نهائية.»"
          source: "المورد الحديث (2008) — entry_id 715989، translation_en: semifinalist"

    - lemma: "نِصْفِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "رُبَاعِيٌّ"
      contradicts:
        - text: "«الرُّباعي: مَا كَانَ على أَرْبَعَة أحرف.»"
          source: "معجم مقاليد العلوم للسيوطي (hawramani) — entry_id 806952"
          conflict: "الاستعمال ينحصر في الوصف الصرفي (الكلمة الرباعية الأحرف)، لا في الرياضة"
        - text: "«(الرباعي) مَا ركب من أَرْبَعَة أَشْيَاء وَهِي رُبَاعِيَّة، وَ(فِي الرياضية والهندسة) شكل مستو مَحْدُود بِأَرْبَع أضلاع مُسْتَقِيمَة»"
          source: "المعجم الوسيط — entry_id 873658"
          conflict: "الكلمة تُستعمل في الهندسة والصرف حصراً، لا دلالة لها على شخص متنافس"
        - text: "«رُباعيّ: فرد يحتوي على أربعة طواقم من الصبغيات.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009) — entry_id 462118، translation_en: tetraploid"
          conflict: "في العلوم البيولوجية تُعني رباعي الصبغيات، لا صلة بالبطولات"
      expands:
        - text: "«رُبَاعيّ: مجموعةٌ تتكون من أربعة أرقام تنتمي إلى نظام الأعداد.»"
          source: "مسرد الهندسة الكهربائية، ALECSO (entry_id 377475) — translation_en: tetrad"
          addition: "تُستعمل الكلمة للدلالة على الرباعيات (مجموعات رباعية) في الرياضيات والموسيقى، لا في الرياضة البدنية"

    - lemma: "شِبْهُ نِهَائِيٍّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "متأهل لنصف النهائي"
      decision: confirmed
      decision_reason: >
        العبارة مستعملة في التقارير الرياضية العربية المعاصرة للدلالة على المتنافس الذي
        بلغ دور نصف النهائي، وهي المصطلح الوحيد المعتمد في AWN4. تفتقر إلى التشكيل
        الكامل فتُصحَّح بإضافته. بنيتها (اسم فاعل + حرف جر + مركب إضافي) مقبولة في
        العربية وإن كانت أقل إيجازاً من الصيغة الإضافية الخالصة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز الدلالة الفعلية للتأهل بتضمين حرف الجر (لـ)، مما يُفيد الصيرورة والبلوغ
        نحو الهدف؛ مناسب للاستعمال الوصفي الدينامي في السياق الإخباري
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَأَهِّلٌ لِنِصْفِ النِّهَائِيِّ"

    - lemma: "مُتَأَهِّلُ النِّصْفِ النِّهَائِيِّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        المركب الإضافي الخالص أكثر إيجازاً وملاءمةً للقوائم والعناوين الرسمية؛ يُثبّته
        المورد الحديث (2008) بصورة غير مباشرة إذ يُورد 'نصف النهائي' ترجمةً لـ semifinalist
        مع تعريف 'لاعب أو فريق مشترك في مباراة نصف نهائية'. البنية الإضافية (مُتَأَهِّلُ
        النِّصف + النِّهَائيّ) مثبّتة معجمياً وتجتاز اختبار السكّ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصورة الاسمية الإضافية الخالصة؛ أكثر ثباتاً في الاستعمال الرسمي والإعلامي
        للتسمية والتصنيف، ولا تتضمن إحالة صريحة إلى فعل التأهل
      actions:
        - command: create_entry
          params: {lemma: "مُتَأَهِّلُ النِّصْفِ النِّهَائِيِّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-10597473-n"}

    - lemma: "نِصْفِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية تدعم استعماله في السياق الرياضي. اللفظ مبهم ويُحيل إلى معانٍ
        متعددة (نسبة إلى النصف بمعانيه الهندسية أو الأدبية أو العمرية). يفشل اختبار
        التثبيت المعجمي: لا وحدة معجمية ثابتة موثقة.

    - lemma: "رُبَاعِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم تتفق على توظيفه في الصرف اللغوي والهندسة والبيولوجيا والعلوم التطبيقية.
        لا شاهد واحد لاستعماله للدلالة على متنافس في بطولة. المعنى المجازي المقترح
        (واحد من أربعة) لا يملك تثبيتاً معجمياً ويتعارض مع المعنى الراسخ.

    - lemma: "شِبْهُ نِهَائِيٍّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. فضلاً عن ذلك، 'شبه نهائي' صفة للمباراة أو الدور (semi-final round)
        لا لشخص المتنافس؛ استعماله للدلالة على الشخص فيه خلط بين الدلالتين.


