          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الرّعشة: علّة آلية تحدث عن عجز القوة المحرّكة عن تحريك العضل على الاتصال أو إثباته على الاتصال... والفرق بينه وبين الاختلاج أنّ الحركة في الاختلاج تظهر سواء كان العضو ساكناً أو متحرّكاً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«رعْشة، ارتجاف، رَعْدة — tremor»"
