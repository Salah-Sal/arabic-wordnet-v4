# مراجعة المجموعة الترادفية — awn4-14028622-n
# tremor: shaking or trembling (usually from weakness/stress/disease)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «ارتجاف» مصدر افتعال من ر-ج-ف، لكن المعنى الكلاسيكي عند المناوي هو «إيقاع الرجفة بالفعل أو بالقول» أي التسبّب في الرجفة لا الارتجاف ذاته، وإن كان الاستعمال الحديث يُطابق المعنى المطلوب"
      - "المجموعة تحتوي على لمّتين فقط، وهو عدد قليل لمفهوم غنيّ بالألفاظ العربية الأصيلة"
      - "اللمّتان الموجودتان بدون تشكيل كامل"
    observations: "المفهوم — الاهتزاز الجسدي الناجم عن ضعف أو توتر أو مرض — مفهوم أصيل في العربية وله حقل معجمي ثريّ يتوزّع على عدة جذور: ر-ج-ف (الرجفة)، ر-ع-ش (الرعشة/الرعاش)، ر-ع-د (الرعدة/الارتعاد). التعريف الحالي وافٍ لكنه يمكن تحسينه بأسلوب المعجم الوسيط. المجموعة الفائقة (hypernym) تشمل ارتعاش واهتزاز ورجفة وهي أعمّ، فيجب أن تقتصر لمّات هذه المجموعة على ما يدلّ تحديداً على الاهتزاز المرضي أو الناتج عن ضعف."
  blind_candidates:
    - lemma: "رِعْدَة"
      generation_method: ishtiqaq
      justification: "من الجذر ر-ع-د على وزن فِعْلَة، دالّة على اضطراب الجسم من فزع أو حمّى أو مرض، وهي اللفظ الأدقّ للمفهوم في المعاجم الكلاسيكية"
    - lemma: "رُعَاش"
      generation_method: ishtiqaq
      justification: "من الجذر ر-ع-ش على وزن فُعال المخصّص للأمراض والعلل، وهو المصطلح الطبي المعتمد في المعجم الطبي الموحد لمقابل tremor"
    - lemma: "ارْتِعَاد"
      generation_method: ishtiqaq
      justification: "مصدر ارتعد (افتعال من ر-ع-د)، يدلّ على حالة الاضطراب والارتجاف من خوف أو برد أو مرض"
    - lemma: "نَافِض"
      generation_method: majaz
      justification: "من ن-ف-ض، النافض في لسان العرب هو الحمّى ذات الرعدة لأنها تنفض البدن نفضاً، فيه مجاز من النفض المادي إلى الارتجاف المرضي"

