        - text: "«ارتعاش الجِسْمِ من فَزَعٍ أو حُمَّى أو غيرهما»"
          source: "المعجم الكبير"
        - text: "«رِعْدَة — shakes»"
          source: "المعجم الطبي الموحد"

    - lemma: "رُعَاش"
      confirm:
        - text: "«رُعاش [ج:رعاشات] — tremor»"
          source: "المعجم الطبي الموحد"
        - text: "«رعاش — tremor»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«رُعاشُ الفِعْل (رُعاشُ الحَرَكَة) — action tremor»، «رُعاشٌ مُتَناوِب — alternating tremor»، «رُعاشٌ بارْكِنْسونيّ — parkinsonian tremor» (وعشرات المركبات الأخرى)"
          source: "المعجم الطبي الموحد"
          addition: "رُعاش هو الأساس الاشتقاقي لمنظومة كاملة من المصطلحات الطبية المركبة في المعجم الطبي الموحد"

    - lemma: "اِرْتِعَاد"
      evidence_status: "no_material_found"

    - lemma: "نَافِض"
      confirm:
