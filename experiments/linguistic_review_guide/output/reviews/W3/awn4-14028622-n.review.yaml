      expands:
        - text: "«(الرعشة) الرعدة والعجلة والسرعة يُقال به رعشة إلى لقاء العدو»"
          source: "المعجم الوسيط (مجمع القاهرة)"
          addition: "للرعشة معنى ثانٍ هو العجلة والسرعة إلى الشيء (بدلالة إيجابية)"
