stage1_review:
  assessment:
    concerns:
      - "اللمّتان (شارح، معلّق نصي) خاليتان من التشكيل الكامل الإلزامي."
      - "التعريف الحالي يستخدم كلمة (معلّق) وهي جزء من لمّة المجموعة ذاتها، مما يُوقع في دوران جزئي."
      - "اللمّة المركّبة (معلّق نصي) تفتقر إلى توثيق مُعجمي مباشر كوحدة معجمية مُثبَّتة."
      - "غياب لمّة (مُحَشِّي) رغم أنها الترجمة الأولى لـ annotator في المعاجم الحديثة (المورد الحديث 2008)."
    observations: >
      المجموعة تدور حول مفهوم «كاتب الحواشي والتعليقات على النص»، وهو مفهوم تراثي راسخ في
      الثقافة العربية. الجذر (شرح) يحمل معنى الفتح والبيان وهو الأنسب للدلالة على صاحب الشرح،
      بينما الجذر (حشو/حشي) يمنح الاسم (مُحَشِّي) دلالة دقيقة على كاتب الحواشي الهامشية
      تحديداً. استخدام (معلّق نصي) مُبرَّر وظيفياً لتمييز المعلّق الأكاديمي عن المعلّق الإعلامي،
      غير أن المصطلح المُثبَّت في المعاجم الحديثة هو (مُحَشِّي). ينبغي إثراء المجموعة بإضافته.

  blind_candidates:
    - lemma: "شَارِح"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل شَرَحَ (الثلاثي المجرد)، على وزن فاعِل. الشَّرح لغةً هو
        الفتح والبيان، ويُقال شَرَحَ الكلامَ إذا بيَّنه وأوضحه. فالشارح هو من
        يبيّن النص ويوضّحه بالملاحظات والتعليقات، مطابقاً تمام المطابقة للتعريف.
    - lemma: "مُحَشٍّ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل حَشَّى (الرباعي المزيد بالتضعيف)، يُقال: حَشَّى الكتابَ
        إذا عَلَّقَ عليه حواشيَ. الحاشية هي التعليق الهامشي على النص، وهي الصورة
        الكلاسيكية للملاحظات التوضيحية التي يكتبها المعلّق. المصطلح يتجنّب الاشتراك
        اللفظي مع معلّق (commentator إعلامي) ويخصّص الدلالة للسياق النصي العلمي.
    - lemma: "مُفَسِّر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من فَسَّرَ (الرباعي المزيد). يُطلق على من يُبيّن معاني النص
        ويكشف مقاصده. وإن كان يغلب على السياق القرآني، إلا أن دلالته تمتد
        لكل من يوضّح نصاً بالشرح والتحليل.
    - lemma: "مُذَيِّل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من ذَيَّلَ (الرباعي المزيد من ذيل). الذَّيل هو الطرف والتتمة،
        ويُقال ذَيَّلَ الكتابَ إذا أضاف في آخره ملاحظاتٍ وزيادات. المُذَيِّل
        هو من يُلحق تعليقاته بالنص في ذيوله وهوامشه.


stage2_evidence:
  per_lemma:

    - lemma: "شارح"
      confirm:
        - text: >
            «مَنْ يَخْتَصُّ بتفسير وتحليل النصوصِ والمتون ونحوها.
            يقال: شارح ألفية ابن مالك، و: شارح أشعار الهذليين»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «(1) الشارح؛ المفسِّر
            (2) المَسْرَدِيّ: واضعُ مسارِد المصطلحات»
          source: "المورد الحديث (2008) — مقابل: glossarist/glossator"
        - text: >
            «الشارح؛ المعلِّق؛ واضع الحواشي»
          source: "المورد الحديث (2008) — مقابل: scholiast"
      expands:
        - text: >
            «الحافظ. يقال: شارِحُ الزَّرْعِ من الطُّيور وغيرها»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            للمدخل معنى إضافي قديم (الحافظ/الطائر الحارس للزرع) غير ذي صلة بالمجموعة،
            مما يؤكد أن دلالة (كاتب الشرح) هي المعنى المستحدث المثبَّت في المعجم الكبير.

    - lemma: "معلّق نصي"
      confirm:
        - text: >
            «المعلِّق. وبخاصة: المعلِّق على الأنباء في الإذاعة أو التلفزيون»
          source: "المورد الحديث (2008) — مقابل: commentator"
        - text: >
            «الشارح؛ المعلِّق؛ واضع الحواشي»
          source: "المورد الحديث (2008) — مقابل: scholiast"
        - text: >
            «مُعلِّق — الشخص الذي يقوم بالتعليق على الأحداث»
          source: "مسرد الإعلام والتواصل، ALECSO — مقابل: commentator"
      contradicts:
        - text: >
            «معلِّق — commentator; narrator»
          source: "مسرد الإعلام والتواصل، ALECSO"
          conflict: >
            الاستعمال الشائع لـ(معلّق) يُحيل إلى المعلّق الإعلامي (commentator في التلفزيون
            والراديو)، لا إلى كاتب الحواشي على النصوص. المُركَّب (معلّق نصي) لم يَرِد
            كوحدة معجمية مُثبَّتة في أيٍّ من المعاجم المستعلَمة.

    - lemma: "مُحَشٍّ"
      source: stage1
      confirm:
        - text: >
            «المُحشِّي؛ مُعَلِّق الحواشي؛ الشارح؛ المفسِّر»
          source: "المورد الحديث (2008) — مقابل: annotator"
        - text: >
            «يُحشِّي: يُعلِّق الحواشي على كتاب»
          source: "المورد الحديث (2008) — مقابل: annotate (الفعل)"
        - text: >
            «(1) حاشية [تفسيرية]
            (2) التَّحْشِية: تعليق الحواشي»
          source: "المورد الحديث (2008) — مقابل: annotation"
        - text: >
            «تعليق، حاشية»
          source: "المورد الحديث (2008) — مقابل: annotation (فن وترفيه)"

    - lemma: "مُفَسِّر"
      source: stage1
      contradicts:
        - text: >
            «الْمُفَسّر: مَا يفهم مَعْنَاهُ من لَفظه، وَلَا يقبل التَّأْوِيل،
            وَقيل: الْمُفَسّر والمحكم وَاحِد»
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: >
            المُفَسَّر في كتب الأصول يدل على «النص الواضح الذي لا يقبل التأويل»،
            لا على الشخص الذي يكتب التعليقات. كما يغلب على المُفَسِّر الشخصي
            دلالةُ مفسّر القرآن الكريم تحديداً، مما يُضيّق الدلالة عن المراد.

    - lemma: "مُذَيِّل"
      source: stage1
      contradicts:
        - text: >
            «(المذيل) الْمَرِيض لَيْسَ لَهُ قَرَار وَهُوَ ضَعِيف وَالْحَدِيد
            يسهل كَسره»
          source: "المعجم الوسيط (مجموعة من المؤلفين)"
          conflict: >
            المذيل في المعاجم يدل على الشيء ضعيف الجوهر أو المريض المضطرب،
            وليس على من يكتب التعليقات. استعمال مُذَيِّل بدلالة (كاتب الذيول
            والملاحق) غير موثَّق معجمياً، والاستعمال الراسخ هو (المُذَيَّل) لصفة
            الشيء طويل الذيل، لا للفاعل.


stage3_analysis:
  per_lemma:

    - lemma: "شارح"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة توثيقاً قاطعاً في المعجم الكبير بالدلالة المقصودة (من يختص
        بتفسير وتحليل النصوص والمتون). وردت في المورد الحديث مرادفاً للـ scholiast
        و glossator. الجذر شرح من أصحّ الجذور دلالةً على البيان والإيضاح. تحتاج
        اللمّة إلى إضافة تشكيل كامل: شَارِح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        شَارِح يُستعمل خاصةً في السياق العلمي الكلاسيكي للدلالة على من يُؤلِّف شرحاً
        موسَّعاً لنص معين (كشارح الألفية، شارح ديوان المتنبي). الدلالة تحمل طابع
        التأليف المستقل الموسّع لا مجرد تعليق هامشي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَارِح"

    - lemma: "معلّق نصي"
      decision: confirmed
      decision_reason: >
        مُعَلِّق موثَّق في المعاجم الحديثة للدلالة على المعلّق والشارح. إضافة (نصي)
        ضرورية تقنياً لتمييز هذه الدلالة عن المعلّق الإعلامي الشائع. وإن كانت الوحدة
        المُركَّبة غير مُسجَّلة كمدخل مستقل في المعاجم المستعلَمة، فإن البنية الوصفية
        مقبولة لغوياً كمصطلح تقني (noun + adjective نسبي). اللمّة تحتاج تشكيلاً
        كاملاً: مُعَلِّق نَصِّيّ.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        مُعَلِّق نَصِّيّ أحدث وأعمّ؛ يُستخدم في السياق الأكاديمي المعاصر للدلالة على
        من يكتب تعليقات مضمَّنة أو هامشية في النص المحقَّق. التقييد بـ(نصي) يُخرجه
        من دلالة المعلّق الإذاعي/التلفزيوني نحو السياق الفيلولوجي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُعَلِّق نَصِّيّ"

    - lemma: "مُحَشٍّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُحَشٍّ (أو مُحَشِّي بالياء) هو الترجمة الأولى والصريحة لـ annotator في
        المورد الحديث (2008) وهو أبرز المعاجم المزدوجة العربية الإنجليزية. الفعل
        حَشَّى بمعنى «علّق الحواشي على كتاب» موثَّق صراحةً. الحاشية التوضيحية
        هي بعينها «الملاحظة التوضيحية» المذكورة في تعريف المجموعة. غياب هذه
        اللمّة عن المجموعة يُعدّ إغفالاً معجمياً يجب تداركه.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُحَشٍّ يُركّز تحديداً على فعل كتابة الحواشي الهامشية (marginal annotations)
        على النص؛ هو أخصّ من شارح (الذي يُؤلِّف شرحاً كاملاً) وأخصّ من معلّق نصي
        (الأعمّ). الاستعمال التراثي يُطلقه على من يضيف حواشيَ لكتاب كلاسيكي دون
        تأليف شرح مستقل.
      actions:
        - command: create_entry
          params:
            lemma: "مُحَشٍّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09814451-n"

    - lemma: "مُفَسِّر"
      source: stage1
      decision: removed
      decision_reason: >
        غلبة الدلالة القرآنية (مفسّر القرآن) والأصولية (النص الواضح غير القابل للتأويل)
        تُضيّق الدلالة العامة على كاتب الملاحظات. إضافته ستُحدث لبساً بين المفهوم
        المُراد (annotator of texts) والمفهوم الديني الراسخ.

    - lemma: "مُذَيِّل"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالات المعجمية المُثبَّتة لمذيل ومذيَّل تدور حول الضعف والمرض أو طول
        الذيل، ولا صلة لها بالكتابة التوضيحية. الاستعمال المُراد (من يُلحق ذيولاً
        بكتاب) غير موثَّق معجمياً، ويُعدّ اشتقاقاً حديثاً لم يُثبِّته الاستعمال.


stage4_content:
  definition:
    current: "معلّق يكتب ملاحظات توضيحية لنص ما"
    assessment:
      decision: revise
      reason: >
        يستخدم التعريف الحالي كلمة (معلّق) وهي جزء من لمّة المجموعة (معلّق نصي)
        مما يُوقع في دوران دلالي جزئي. كما أن الصياغة تُفقد التعريفَ الصبغةَ
        المعجمية الرصينة المطلوبة؛ الأفضل استبدال «معلّق» بجنس أعلى محايد كـ«عالم»
        أو «من يتولى»، وإبراز خاصية الكتابة الهامشية التوضيحية بوصفها الفصل
        النوعي الأساسي.
