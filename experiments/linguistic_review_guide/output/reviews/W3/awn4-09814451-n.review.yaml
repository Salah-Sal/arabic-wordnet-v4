          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          عالمٌ أو باحثٌ يُضيفُ إلى النصوص العلمية أو الأدبية ملاحظاتٍ تفسيريةً
          وحواشيَ إيضاحيةً، إما في هوامش المخطوط أو في ذيوله أو مُدمَجةً في صلبه،
          بهدف توضيح المعاني الغامضة وربط المصطلحات بمصادرها وتوجيه القارئ.
