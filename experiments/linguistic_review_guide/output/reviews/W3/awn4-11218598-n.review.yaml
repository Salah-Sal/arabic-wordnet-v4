# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-11218598-n  |  ili: i96359  |  pos: n
# الموضوع: إيدوارد مويبريدج — رائد تصوير الحركة (1830-1904)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (إدوارد مويبريدج، مويبريدج) تفتقران إلى التشكيل الكامل"
      - "المجموعة تغطي ثلاثة لمّات إنجليزية (Muybridge / Eadweard Muybridge / Edward James Muggeridge) بينما تضم فقط لمّتين عربيتين دون مقابل لاسم الميلاد Muggeridge"
      - "التعريف العربي الحالي ترجمة حرفية للتعريف الإنجليزي دون مراعاة أسلوب المعاجم الموسوعية العربية"
    observations: >
      المجموعة الترادفية تخص عَلَماً شخصياً بعينه هو إيدوارد مويبريدج (1830-1904)، المصوّر البريطاني
      الأمريكي الرائد في تصوير الحركة التسلسلية. وُلد Edward James Muggeridge في إنجلترا، وغيّر اسمه
      لاحقاً إلى Eadweard Muybridge. جميع اللمّات المتوقعة تعريبات صوتية لأسماء أجنبية؛ إذ لا يوجد
      مقابل عربي أصيل لهذا العَلَم. تبرز أهمية إضافة اسم الميلاد Muggeridge مقابلاً عربياً لاستيفاء
      التغطية الدلالية الكاملة للمجموعة.

  blind_candidates:
    - lemma: "مُوَيْبِريدْج"
      generation_method: taarib
      justification: "تعريب صوتي مباشر للقب Muybridge الذي اتخذه إدوارد بديلاً عن لقب Muggeridge الأصلي؛ أشيع صيغة في المصادر العربية المعنية بتاريخ السينما وتصوير الحركة"

    - lemma: "إِدْوَارد مُوَيْبِريدْج"
      generation_method: taarib
      justification: "الاسم الكامل المُعرَّب جامعاً الاسم الأول (Edward/Eadweard) ولقبه المشتهر؛ يُستخدم في المصادر الأكاديمية والموسوعية العربية للإحالة الرسمية الكاملة"

    - lemma: "إِدْوَارد جَيْمِس مُوغِريدْج"
      generation_method: taarib
      justification: "تعريب الاسم الأصلي عند الميلاد Edward James Muggeridge؛ لازم لتوثيق هوية الشخص في السجلات التاريخية والوثائق البيوغرافية الرسمية"

    - lemma: "مُوغِريدْج"
      generation_method: taarib
      justification: "تعريب اللقب الأصلي Muggeridge الذي وُلد به قبل تغييره؛ قد يُحال إليه بهذه الصيغة في المصادر التاريخية الوثائقية"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# ملاحظة منهجية: نُفِّذت ثلاثة استعلامات على قاعدة البيانات:
# ١. مطابقة دقيقة دفعية لجميع اللمّات والمرشحات (headword_norm IN ...)
# ٢. جسر إنجليزي (entries_translations_fts MATCH "Muybridge" OR "Eadweard" OR ...)
# ٣. بحث بالكلمات المفتاحية (سينمائي، خيول، كاميرا، تصوير الحركة، رائد)
# النتيجة: لا توجد مداخل معجمية في القاعدة لأيٍّ من الأسماء — وهو أمر متوقع
# لأن قاعدة البيانات تشمل المعاجم اللغوية ولا تشمل الموسوعات الأعلامية.
stage2_evidence:
  per_lemma:
    - lemma: "إدوارد مويبريدج"
      evidence_status: "no_material_found"

    - lemma: "مويبريدج"
      evidence_status: "no_material_found"

    - lemma: "مُوَيْبِريدْج"
      evidence_status: "no_material_found"

    - lemma: "إِدْوَارد مُوَيْبِريدْج"
      evidence_status: "no_material_found"

    - lemma: "إِدْوَارد جَيْمِس مُوغِريدْج"
      evidence_status: "no_material_found"

    - lemma: "مُوغِريدْج"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "إدوارد مويبريدج"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المُعرَّب الأكثر شيوعاً في المصادر الثقافية والأكاديمية العربية للإحالة
        إلى هذا العَلَم؛ يجمع الاسم الأول واللقب المشتهر، وهو مدخل ضروري للتعرف الكامل على
        الشخص. يستوجب تصحيح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الاسم الكامل بعد التغيير (الاسم الأول + اللقب المُستحدَث)؛ الصيغة المعتمدة في المصادر الموسوعية والأكاديمية العربية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِدْوَارد مُوَيْبِريدْج"

    # ── لمّة موجودة ٢ ──
    - lemma: "مويبريدج"
      decision: confirmed
      decision_reason: >
        اللقب المُختصر المُعرَّب المُستخدم للإحالة السريعة في النصوص العلمية والنقدية؛
        يعمل كمدخل موجَز كافٍ للتعريف في السياقات غير الرسمية. يستوجب تصحيح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب المُختصر وحده؛ يُستخدم للإحالة المُكثَّفة في النصوص العلمية والصحفية ومنصات الإنترنت"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَيْبِريدْج"

    # ── مرشح المرحلة ١ — أ (مكرر مع الموجود) ──
    - lemma: "مُوَيْبِريدْج"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمّة الموجودة (مويبريدج) بعد تصحيح التشكيل؛ لا حاجة لإنشاء مدخل جديد"

    # ── مرشح المرحلة ١ — ب (قريب جداً من الموجود) ──
    - lemma: "إِدْوَارد مُوَيْبِريدْج"
      source: stage1
      decision: removed
      decision_reason: "يُعدّ تصحيح تشكيل للمّة إدوارد مويبريدج الموجودة لا لمّة جديدة؛ تمت معالجته ضمن إجراء update_lemma أعلاه"

    # ── مرشح المرحلة ١ — ج (اسم الميلاد — جديد) ──
    - lemma: "إِدْوَارد جَيْمِس مُوغِريدْج"
      source: stage1
      decision: confirmed
      decision_reason: >
        يُعرَّب هنا اسم الميلاد الكامل Edward James Muggeridge المُدرَج في اللمّات الإنجليزية
        (lemmas_en) للمجموعة دون مقابل عربي حتى الآن. ضرورته ماسّة في السجلات التاريخية
        والوثائق البيوغرافية ومعجمَي الأعلام. المركب: اسم أول + اسم وسط + لقب عائلي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الاسم الأصلي الكامل عند الميلاد قبل تغييره؛ يرد في الوثائق التاريخية والسجلات الرسمية لتحديد الهوية بلا لبس"
      actions:
        - command: create_entry
          params:
            lemma: "إِدْوَارد جَيْمِس مُوغِريدْج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-11218598-n"

    # ── مرشح المرحلة ١ — د (لقب الميلاد وحده) ──
    - lemma: "مُوغِريدْج"
      source: stage1
      decision: removed
      decision_reason: >
        اللقب المُختصر Muggeridge لا يُستخدم وحده كمعرِّف مستقل في المصادر العربية المعروفة؛
        مشمول ضمن الصيغة الكاملة إِدْوَارد جَيْمِس مُوغِريدْج المُضافة أعلاه.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "رائد سينمائي أمريكي يُذكر بصوره للخيول الراكضة المأخوذة بسلسلة من الكاميرات الثابتة (ولد في إنجلترا) (1830-1904)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي؛ يفتقر إلى الأسلوب الموسوعي العربي،
        ولا يذكر جنسيته البريطانية في مقابل انتسابه الأمريكي، ولا يشير إلى الأثر المنهجي
        لتجربته (إثبات أن الخيل ترفع قوائمها كلياً عن الأرض). يستحق تعريفاً موسوعياً
        يستوعب سياقه التاريخي وإسهاماته المنهجية.
    authored:
      - type: encyclopedic
        text: >
          مُصَوِّرٌ وعالمٌ بريطانيٌّ أمريكيُّ الجنسية (1830-1904)، وُلد في إنجلترا باسم
          إِدْوَارد جَيْمِس مُوغِريدْج، ثم غيَّر اسمه إلى إِدْوَارد مُوَيْبِريدْج. يُعدُّ
          رائداً في تصوير الحركة المتسلسلة؛ اشتُهِرَ بتجربته الفريدة عام 1878م إذ صوَّر
          حصانًا يركض بسلسلة متتابعة من الكاميرات الثابتة، فأثبت أن الخيل ترفع قوائمها
          الأربع عن الأرض في آنٍ واحد لحظة العدو. أسهمت أعماله في تأسيس علم تحليل الحركة
          وفتحت الطريق أمام اختراع السينماتوغراف.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11218598-n"
          definition_index: 0
          text: >
            مُصَوِّرٌ وعالمٌ بريطانيٌّ أمريكيُّ الجنسية (1830-1904)، وُلد في إنجلترا باسم
            إِدْوَارد جَيْمِس مُوغِريدْج، ثم غيَّر اسمه إلى إِدْوَارد مُوَيْبِريدْج. يُعدُّ
            رائداً في تصوير الحركة المتسلسلة؛ اشتُهِرَ بتجربته الفريدة عام 1878م إذ صوَّر
            حصانًا يركض بسلسلة متتابعة من الكاميرات الثابتة، فأثبت أن الخيل ترفع قوائمها
            الأربع عن الأرض في آنٍ واحد لحظة العدو. أسهمت أعماله في تأسيس علم تحليل الحركة
            وفتحت الطريق أمام اختراع السينماتوغراف.

  examples:
    per_lemma:
      - lemma: "إِدْوَارد مُوَيْبِريدْج"
        examples:
          - text: "أحدث إِدْوَارد مُوَيْبِريدْج ثورةً في فهم حركة الحيوانات حين نجح عام 1878م في تصوير حصانٍ عادٍ بسلسلة من الكاميرات الثابتة المتتالية."
            type: usage

      - lemma: "مُوَيْبِريدْج"
        examples:
          - text: "تُعدُّ دراسات مُوَيْبِريدْج للحركة المتسلسلة المرجعَ الأساسي لكل من يتناول تاريخ الفوتوغرافيا والسينما في القرن التاسع عشر."
            type: usage

      - lemma: "إِدْوَارد جَيْمِس مُوغِريدْج"
        examples:
          - text: "سُجِّل في وثائق الميلاد البريطانية باسم إِدْوَارد جَيْمِس مُوغِريدْج، قبل أن يُغيِّر اسمه ويُصبح أحد رواد الصورة المتحركة في التاريخ."
