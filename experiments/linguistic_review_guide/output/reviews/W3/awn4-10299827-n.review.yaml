# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:
  per_entry:
    # أستاذ — معرَّب من الفارسية؛ لا جذر عربي في مقاييس اللغة
    - lemma: "أُسْتَاذ"
      entry_id: "{auto}"
      root: "ستذ"
      maqayis_quote: >
        «لا أصل له في مقاييس اللغة لأنه معرَّب من الفارسية (أُستَاد). قال ابن دِحية: لم يُوجَد
        في شعر الجاهلية ولا في لغتهم. وهو يدل على الماهر بالشيء والمعلِّم.»
        [التوقيف على مهمات التعاريف — المناوي]

    # فنان بارع — مركّب وصفي؛ جذران: فنن + برع
    - lemma: "فَنَّانٌ بَارِع"
      entry_id: "{auto}"
      roots:
        - word: "فنان"
          root: "فنن"
          maqayis_quote: >
            «الْفَاءُ وَالنُّونُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَعْنِيَةٍ،
            وَالْآخَرُ عَلَى ضَرْبٍ مِنَ الضُّرُوبِ فِي الْأَشْيَاءِ كُلِّهَا.
            وَالْأَفَانِينُ: أَجْنَاسُ الشَّيْءِ وَطُرُقُهُ»
            [مقاييس اللغة لابن فارس]
        - word: "بارع"
          root: "برع"
          maqayis_quote: >
            «الْبَاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلَانِ: أَحَدُهُمَا التَّطَوُّعُ بِالشَّيْءِ مِنْ غَيْرِ وُجُوبٍ.
            وَالْآخَرُ التَّبْرِيزُ وَالْفَضْلُ. قَالَ الْخَلِيلُ: تَقُولُ بَرَعَ يَبْرَعُ بُرُوعًا وَبَرَاعَةً.
            وَالْبَارِعُ: الْأَصِيلُ الْجَيِّدُ الرَّأْيِ»
            [مقاييس اللغة لابن فارس]

    # مايسترو — تعريب إيطالي؛ لا جذر عربي
    - lemma: "مَايِسْتَرُو"
      entry_id: "{auto}"

  per_sense:
