# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10299827-n  (ili: i91139)
# definition_en: an artist of consummate skill
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «مايسترو» تعريب غير موحَّد: المورد الحديث يُثبتها «الميستر»، وتختلف المعاجم الحديثة في الضبط الصوتي"
      - "لمّة «فنان بارع» مركّبة وصفية قابلة للإبدال، وهو ما يُثير تساؤلاً حول ثباتها المعجمي"
      - "لمّة «أستاذ» معرَّبة من الفارسية (أُستَاد) وتحمل دلالة التعليم الغالبة، مما يُوسّع حدود المعنى المقصود"
      - "التعريف العربي الحالي «فنان ذو مهارة وإتقان فائقين» وصفي ولا يستوفي اشتراط الجنس والفصل بأسلوب المعجم الوسيط"
    observations: >
      المجموعة تُمثّل مفهوماً معجمياً راسخاً في العربية — إذ للعربية قدرة تعبيرية أصيلة
      عن «المُتقِن في فنّه». الإشكال الرئيسي هو التمييز بين ثلاثة مفاهيم متداخلة: الأستاذ
      (المعلِّم الخبير)، والفنان البارع (المتفوق في الأداء)، والمايسترو (قائد الجوق عادةً).
      ويُلاحَظ أن المجموعة الإنجليزية تجمع «maestro» و«master» بوصفهما مترادفَيْن في هذا
      السياق، وهو ما ينعكس على اختيار اللمّات العربية.

  blind_candidates:
    - lemma: "الفَحْلُ"
      generation_method: majaz
      justification: >
        «الفَحْل» في العربية يُستعمل مجازاً للدلالة على «خيار القوم ومتفوّقهم»؛ والمعجم الوسيط
        يُثبت «فحول الشعر أو العلم: الفائقون فيه». إحياءٌ لمجاز عربي قديم يتجنّب الاشتراك مع
        المصطلحات الحديثة.
    - lemma: "مُحْكِمٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ح ك م) على وزن مُفْعِل (اسم فاعل من أَحْكَمَ): «من أتقن صنعته وأحكمها».
        مقاييس اللغة: «أصل يدل على المنع والإتقان». الوزن مناسب للفاعلية الحرفية.
    - lemma: "إِمَامُ الفَنِّ"
      generation_method: tarkib
      justification: >
        تركيب إضافي بالقياس على «إمام النحو» و«إمام الفقه» الذي يُستعمل في التراث للدلالة على
        السلطة المرجعية في الحقل. يُفيد معنى «من يُقتدى به في الفن».
    - lemma: "فِيرْتُوزُو"
      generation_method: taarib
      justification: >
        تعريب الإيطالية (virtuoso) التي تُقابل تماماً مفهوم «الفنان ذو المهارة الفائقة». تعريب
        ملاذ أخير بعد استنفاد البدائل العربية الأصيلة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة: ٦ استعلامات
# ١. مطابقة دفعية: أستاذ + فنان بارع + مايسترو + فحل + محكم + مرشحات
# ٢. إثراء بالمعرّف للأمثلة
# ٣. جسر إنجليزي: maestro + master + virtuoso
# ٤. بحث FTS عربي: مهارة + إتقان + بارع + حاذق
# ٥. مقاييس اللغة: جذور فن + برع + فحل + تقن
# ٦. تحقق من معرّف قاموس مقاييس الهوراماني (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "أستاذ"
      confirm:
        - text: >
            «أُسْتَاذٌ — a foreign word... A master: a skilful man, who is held in high estimation:
            a preceptor; a tutor; a teacher: a craftmaster»
          source: "المعجم العربي الإنجليزي لإدوارد وليام لين (Hawramani)"
        - text: "«الأستاذ: الماهر بالشيء، وهي عجمية معربة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الأستاذ) المعلم والماهر في الصناعة يعلمها غيره ولقب علمي عالٍ في الجامعة (ج) أساتذة وأساتيذ»"
          source: "المعجم الوسيط"
        - text: "«الأستاذ: رسام أو موسيقي من الطراز الأول»"
          source: "المورد الحديث (2008) — ذيل مدخل master"
      expands:
        - text: >
            «أُستاذ [مفرد]: ج أستاذون وأَساتذة وأَساتيذُ — ١. مُعلِّم، من يُمارس تعليم علم
            أو فنّ. ٢. لقب علميّ جامعيّ. ° أستاذ مُبَرِّز»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يكشف عن تطور دلالي: من الماهر/المعلم إلى اللقب الأكاديمي، مما يُفسّر استعماله للمفهوم"

    - lemma: "فنان بارع"
      confirm:
        - text: "«فنان بارع» ← translation_en: virtuoso"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
        - text: "«عازف بارع» ← translation_en: virtuoso(It.)"
          source: "مسرد الفن والتسلية والرياضة — ARABTERM"
      expands:
        - text: >
            «(1) الباحث؛ العالِم. (2) «أ» الفنّان. «ب» متذوِّق الفنّ. (3) عازف الكمان إلخ.»
          source: "المورد الحديث (2008) — مدخل virtuoso"
          addition: "يُثبت أن المقابل العربي المعتمد لـ virtuoso هو مركّب «(عازف/فنان) بارع»"

    - lemma: "مايسترو"
      confirm:
        - text: "«المَيْسْتَر: أستاذ في فنٍّ ما. وبخاصة: مؤلف موسيقي، أو قائد فرقة موسيقية، بارزٌ أو لامع.»"
          source: "المورد الحديث (2008) — مدخل maestro"
      contradicts:
        - text: "«قائد جوق» ← translation_en: maestro(It.)"
          source: "مسرد الفن والتسلية والرياضة — ARABTERM"
          conflict: >
            المعجم الموحد للفن يُقابل «maestro» بـ«قائد جوق» (المعنى المُضيَّق: قائد الأوركسترا)،
            لا بالمعنى الأعم «أستاذ في فنٍّ ما». كما أن شكل التعريب في المورد هو «الميستر» لا «مايسترو».
      expands:
        - text: "«الأستاذ: رسام أو موسيقي من الطراز الأول» — أحد معاني master"
          source: "المورد الحديث (2008)"
          addition: "يُشير إلى أن أقرب ترجمة للمعنى العام لـ maestro في العربية هو «أستاذ في الفن»"

    - lemma: "الفَحْل"
      confirm:
        - text: "«(الفَحْل) الذكر القوي من كل حيوان (ج) فحول — وفحول الشعر أو العلم: الفائقون فيه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: >
            «فَحَلَ — الفاء والحاء واللام أصل صحيح يدل على ذكارة وقوة. من ذلك الفحل من كل
            شيء، وهو الذكر الباسل»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          conflict: "الأصل الدلالي للكلمة هو الذكورة والقوة الجسدية، والاستعمال المجازي للتفوق الفكري/الفني ثانوي وغير مُثبَّت خارج سياق الشعر تحديداً"
        - text: "«فَحْلٌ — sire» ← مصطلح بيطري للذكر الفحل"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010) — ARABTERM"
          conflict: "التخصص البيطري للكلمة يُعزّز الدلالة الحيوانية ويُبعدها عن الاستعمال الفني"

    - lemma: "مُحْكِم"
      contradicts:
        - text: "«(المُحكَم) المتقن ومن القرآن الظاهر الذي لا شبهة فيه ولا يحتاج إلى تأويل»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال الراسخ للمُحكَم في علوم القرآن والأصول يحول دون توظيفه للفنان المتقن"
        - text: "«المُحكَم: ما أحكِم المراد به عن التبديل والتغيير والنسخ»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "المصطلح محمّل بحمولة دينية/فقهية ثقيلة تجعل استعماله للفنان مُضلِّلاً"

    - lemma: "إِمَامُ الفَنِّ"
      evidence_status: "no_material_found"

    - lemma: "فِيرْتُوزُو"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── أستاذ (موجودة) ──
    - lemma: "أستاذ"
      decision: confirmed
      decision_reason: >
        مُعرَّب راسخ من الفارسية (أُستَاد)، يُوثِّق تخصُّص «الماهر في الصناعة» في معاجم
        كلاسيكية ومعاصرة. المورد الحديث يُثبته صريحاً بمعنى «رسام أو موسيقي من الطراز الأول».
        يجتاز فحص الاقتراض: مقبول (معرَّب لا دخيل). بوابة الجودة: شائع الفصيح، يسير التداول،
        ملائم، عربي الصياغة، اشتقاقي في بيئته الأصلية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «أستاذ» يُركّز على جانب الأستاذية والريادة؛ يُوحي بنقل الخبرة والتعليم،
        ويمتد إلى اللقب الأكاديمي. يُستعمل في سياق الفنانين الكبار الذين تتلمذ عليهم غيرهم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُسْتَاذ"

    # ── فنان بارع (موجودة) ──
    - lemma: "فنان بارع"
      decision: confirmed
      decision_reason: >
        مُثبَّت في ARABTERM (المعجم الموحد للتقنيات التربوية) كمقابل رسمي لـ «virtuoso».
        مسرد الفن يُثبت «عازف بارع» للمعنى ذاته. اجتاز اختبار السكّ بصعوبة — إذ يمكن
        إبدال «بارع» بـ«ماهر» مع بقاء الوصف صحيحاً، إلا أن التثبيت المعجمي في ARABTERM
        يمنحه وضع المصطلح الرسمي. تصنيف المركب: وصفي (wasfi). لا يوجد مقابل مفرد راسخ
        غيره لمفهوم «virtuoso» في العربية المعيارية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        «فنان بارع» يُركّز على التفوق الأدائي والتنفيذي في الفن؛ يُوحي بالبراعة الحسّية
        والتقنية في التعبير الفني دون اشتراط المكانة التعليمية. يُستعمل في وصف المؤدّين
        المتقنين (موسيقيين، رسامين، ممثلين).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَنَّانٌ بَارِع"

    # ── مايسترو (موجودة) ──
    - lemma: "مايسترو"
      decision: confirmed
      decision_reason: >
        المورد الحديث يُثبت «الميستر» بمعنى «أستاذ في فنٍّ ما، قائد فرقة موسيقية بارز».
        هناك اختلاف في الضبط الصوتي بين «مايسترو» (من الإيطالية مباشرة) و«الميستر» (من
        الإنجليزية). الشكلان متداولان. الإبقاء على «مايسترو» بوصفه التعريب المباشر من
        الإيطالية مع إضافة الصيغة البديلة. فحص الاقتراض: معرَّب مقبول يقبل لام التعريف
        والنسبة والجمع (مايسترو جات/مايسترو جون).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «مايسترو» مختصّ في الغالب بالفن الموسيقي؛ يحمل إيحاءً بالقيادة الفنية (قيادة
        الأوركسترا) ويُستعمل في السياق الرسمي والأكاديمي للموسيقى دون غيرها من الفنون.
        درجة من الرسمية والتخصص أعلى من «أستاذ».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَايِسْتَرُو"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "الْمَيْسْتَر"

    # ── الفحل (مرشح المرحلة ١) ──
    - lemma: "الفَحْل"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ثبوت «فحول الشعر: الفائقون فيه» في المعجم الوسيط، فإن الاستعمال المجازي محدود
        ببيئة الشعر الكلاسيكي ولا يجتاز فحص التعميم إلى سائر الفنون. الأصل الدلالي (الذكر
        الباسل) يُهيمن على الاستعمال المعاصر، ويُعزّزه المعجم البيطري. ثمة خطر الإيهام في
        سياق الخطاب الفني العام. يُحفَظ كمعلومة ثقافية لا كلمّة مُقرَّرة.

    # ── محكم (مرشح المرحلة ١) ──
    - lemma: "مُحْكِم"
      source: stage1
      decision: removed
      decision_reason: >
        الكلمة محمَّلة بحمولة تخصصية ثقيلة (علوم القرآن، الأصول، الصوفية). لم يُثبِت أي
        مصدر استعمالها للدلالة على «الفنان المتقن». يخفق في بوابة الجودة (الملاءمة): إيثار
        السياق يُبعده عن الاستعمال في حقل الفنون.

    # ── إمام الفن (مرشح المرحلة ١) ──
    - lemma: "إِمَامُ الفَنِّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على تثبيته وحدةً معجمية. يخفق في اختبار السكّ: «إمام الفن» يمكن
        إبداله بـ«زعيم الفن» أو «شيخ الفن» مع بقاء المعنى الوصفي، وهذا يعني أنه تعبير
        وصفي حرّ لا مصطلح ثابت. لا تثبيت معجمي مسجَّل.

    # ── فيرتوزو (مرشح المرحلة ١) ──
    - lemma: "فِيرْتُوزُو"
      source: stage1
      decision: removed
      decision_reason: >
        المعادل العربي الرسمي «فنان بارع» مُثبَّت في ARABTERM وموجود أصلاً في المجموعة.
        تعريب المصطلح زائد عن الحاجة في ظل وجود البديل المعرَّب الموثَّق. المبدأ: لا تُعرِّب
        ما وُجد له مقابل عربي راسخ.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
