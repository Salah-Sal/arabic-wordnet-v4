      sense_id: "{auto}"
      nuance: >
        يُركّز على جانب الأستاذية والريادة بما ينطوي على نقل الخبرة والتعليم؛ يُستعمل
        للفنانين الكبار الذين يُشكّلون مدارس وأتباعاً. أعمّ من «مايسترو» إذ لا يقتصر
        على الموسيقى.
    - lemma: "فَنَّانٌ بَارِع"
