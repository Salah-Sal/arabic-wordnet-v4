# مراجعة المجموعة الترادفية — Synset Review
# ID: awn4-11065101-n  |  ILI: i95502  |  POS: n
# هيرو / هيرو الإسكندري — Hero / Heron / Hero of Alexandria
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان (هيرو، هيرو الإسكندري) خاليتان من التشكيل الكامل"
      - "صنف الكلمة (pos=n) لا يُمثّل حقيقة المدخل؛ المدخل اسم علم على شخص (proper_noun)"
      - "لمّة 'هيرو' تُغفل النون الأصيلة في الاسم اليوناني Ἥρων/Heron، مما يُفقد الصورة الصوتية جزءاً من أمانتها"
      - "كلمة 'رياضي' في التعريف العربي مُلتبسة؛ في الاستعمال الحديث تعني athlete لا mathematician، فيُستحسن تعديلها إلى 'عالم رياضيات'"
    observations: >
      المجموعة ترادفية تخصّ شخصية تاريخية يونانية محددة هي هيرو/هيرون الإسكندري
      (القرن الأول الميلادي)، مخترع وعالم رياضيات اشتُهر بصياغة قانون مساحة المثلث
      (قانون هيرون) ووصف آلات ميكانيكية متعددة. اللمّات الحالية عبارة عن
      تعريبات فونولوجية للاسم اليوناني لا اشتقاقات عربية. الصياغة المثلى
      تجمع بين الشكل الأقرب للأصل اليوناني (هيرون بالنون) والشكل المختصر
      (هيرو)، مع نسبة إلى الإسكندرية للتمييز. التعريف جيد في جوهره
      لكنه يحتاج إصلاح كلمة "رياضي" غير الدقيقة.

  blind_candidates:
    - lemma: "هِيرُون"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم اليوناني الأصيل Ἥρων مع استبقاء النون الأخيرة
        التي تمثّل جزءاً من البنية الصوتية الأصلية للاسم؛ وهو الشكل الأوفى
        أمانةً للمصدر اليوناني مقارنةً بـ'هيرو' الذي أسقط النون.
    - lemma: "هِيرُون الإِسْكَنْدَرِيُّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي: الاسم المعرَّب (هيرون) مضافاً إليه نسبة مكانية
        (الإسكندري) للتمييز بين هذا العالم وأشخاص آخرين يحملون الاسم نفسه؛
        يوازي الصيغة الإنجليزية "Hero of Alexandria".
    - lemma: "بَطَلُ الإِسْكَنْدَرِيَّة"
      generation_method: tarkib
      justification: >
        تركيب إضافي بالترجمة الحرفية الدلالية للاسم اليوناني: Hero يعني
        البطل في اليونانية، مضافاً إليه المدينة. محاولة استئناس اللفظ
        بالعربية عوضاً عن الصوت الأجنبي المجرد.
    - lemma: "أَبُو الآلَات"
      generation_method: majaz
      justification: >
        لقب وصفي بالمجاز الكنائي: كثرة ابتكاراته في الآلات الميكانيكية
        وأجهزة البخار (كالتوربين البخاري الأول) تجعل هذه الكنية لائقةً
        به بوصفه رائد هندسة الآلات في العالم القديم.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  query_log:
    - query_num: 1
      purpose: "مطابقة دفعية لجميع اللمات الموجودة والمرشحة"
      terms_searched: ["هيرو","الهيرو","هيرو الاسكندري","الهيرو الاسكندري","هيرون","الهيرون","هيرون الاسكندري","الهيرون الاسكندري","بطل الاسكندرية","ابو الالات"]
    - query_num: 2
      purpose: "جسر إنجليزي: Hero, Heron, Hero of Alexandria"
    - query_num: 3
      purpose: "بحث نصي عربي بمصطلحات هيرون، هيرو الإسكندري"
    - query_num: 4
      purpose: "جلب بيانات الإثراء الكاملة للمداخل المكتشفة"

  per_lemma:
    - lemma: "هيرو"
      expands:
        - text: "«هَيْرُو — من (ه ي ر) مركب من الهَيْر والواو لاحقة تفيد النسبة أو تدليل»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يُعامَل المعجمُ الكلمةَ معاملةَ اسم عربي مشتق من جذر (هير)
            وليس اسماً أجنبياً مُعرَّباً، وهو ما يعكس توطيناً اسمياً في المعجمية
            العربية، لكنه لا يرتبط بعالم الرياضيات اليوناني تحديداً.
        - text: "«هِيْرُو — من (ه ي ر) مركب من الهَيْر والواو لاحقة تفيد النسبة أو هي للتدليل»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "ضبطان للاسم (هَيْرُو / هِيْرُو) وكلاهما مقبول صرفياً."

    - lemma: "هيرو الإسكندري"
      evidence_status: "no_material_found"

    - lemma: "هِيرُون"
      confirm:
        - text: "«حيز الاحتراق 'هيرون' (Heron) — هو حيز احتراق تم تطويره في بريطانيا لمحركات البنزين [...] يُستخدم حيز الاحتراق 'هيرون' بصفة غالبة في محركات آودي (Audi) وفولكس فاجن (VW)»"
          source: "مسرد هندسة وتكنولوجيا السيارات، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«الهَيْرُونُ، كزَيْتونٍ: ضَرْبٌ من التَّمْرِ. وهارونُ: اسمٌ. وهارانُ بنُ تارَحَ: أخو إبراهيم وأبو لوطٍ عليهم السلام. والهَرْنَوَى أو الهَرْنُوَةُ: نَبْتٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: >
            مدخل مستقل في الفيروزآبادي بالصيغة (الهَيْرُون) لكنه يدور على
            صنف من التمر ونبات، لا على عالم الرياضيات. يدل على أن الصيغة
            الصوتية معروفة في العربية لكن بدلالة مختلفة.

    - lemma: "هِيرُون الإِسْكَنْدَرِيُّ"
      evidence_status: "no_material_found"

    - lemma: "بَطَلُ الإِسْكَنْدَرِيَّة"
      contradicts:
        - text: "«بطل — فكرة سردية تقابل الفاعل سيميائياً [...] ترتبط بكفاءة خاصة وسلطة معرفية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: >
            المعاجم توثّق 'بطل' بمعنى الشخصية الرئيسية أو المتفوق أو المقاتل
            البارز، لا بوصفه ترجمةً لاسم علم على شخص بعينه؛ استخدامه اسماً
            علماً للمخترع هيرون يُشكّل خلطاً بين الاسم العلم ومدلوله اللغوي
            الوصفي الحر.
        - text: "«البطل: «أ» المتفوّق على أقرانه في مجال ما. «ب» بطل أسطوريّ. «ج» محارب بارز. «د» شخص مَحُوطٌ بالإعجاب لمنجزاته أو صفاته»"
          source: "المورد الحديث (2008)"
          conflict: "تعريف وصفي عام لا علمي خاص؛ لا يصلح أن يكون اسم علم لشخص بعينه."

    - lemma: "أَبُو الآلَات"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "هيرو"
      decision: confirmed
      decision_reason: >
        الشكل المختصر المتداول لاسم العالم اليوناني في المصادر العربية، وقد
        وثّقته موسوعة السلطان قابوس لأسماء العرب بضبطين (هَيْرُو / هِيْرُو).
        يُبقَى في المجموعة مع تصحيح التشكيل إلى (هِيرُو) إذ يُعادل الإنجليزية
        "Hero" وهو الشكل الأقصر للاسم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: taarib
        verdict: "معرَّب مقبول — يقبل التعريف والنسبة والجمع السالم، وقد وردت صيغتا (هَيْرُو/هِيْرُو) في معجم موثوق"
      nuance_differentiation: >
        الشكل المختصر غير الموصوف؛ يُستعمل عادةً حين يكون السياق كافياً للتعريف
        دون ذكر المدينة، أو في عناوين المراجع المختصرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِيرُو"

    - lemma: "هيرو الإسكندري"
      decision: confirmed
      decision_reason: >
        الصيغة المُميِّزة الكاملة للشخصية ومقابل الإنجليزية "Hero of Alexandria"؛
        وإن لم يرد لها شاهد معجمي مستقل، فإن المنطق التسموي العربي يُجيز تركيب
        الاسم المعرَّب مع النسبة للتمييز، وهو أسلوب مطّرد في المصادر العلمية.
        يُصحَّح تشكيله.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      borrowing_check:
        type: taarib
        verdict: "اسم مُعرَّب + نسبة عربية، التركيب سليم"
      nuance_differentiation: >
        الصيغة التمييزية الكاملة؛ تُستخدم في السياقات التي يُخشى فيها الالتباس
        مع أشخاص آخرين يحملون اسم (هيرو)، وهي المقابل الطبيعي للإنجليزية
        "Hero of Alexandria".
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِيرُو الإِسْكَنْدَرِيّ"

    - lemma: "هِيرُون"
      source: stage1
      decision: confirmed
      decision_reason: >
        الشكل الأوفى أمانةً للأصل اليوناني Ἥρων مع استبقاء النون الخاتمة.
        يُثبَّت بشاهد معجمي موثوق: مسرد ArabTerm الهندسي يستعمل "هيرون"
        اسماً لحيز الاحتراق المنسوب إلى هذا العالم بعينه، مما يدل على أن
        "هيرون" هو الشكل المعتمد في الأدبيات العلمية العربية الحديثة.
        تجدر ملاحظة أن "الهيرون" وردت في القاموس المحيط بمعنى صنف من التمر،
        لكن دلالات الأسماء العلمية تتمايز بالسياق ولا تُبطل بعضها بعضاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: taarib
        verdict: "معرَّب مقبول، يُفضَّل على (هيرو) في الكتابات العلمية"
      nuance_differentiation: >
        الشكل العلمي الأوفى صوتاً بالأصل اليوناني؛ يغلب استعماله في الأدبيات
        الأكاديمية والتقنية المتخصصة، ويُعادل الإنجليزية "Heron".
      actions:
        - command: create_entry
          params:
            lemma: "هِيرُون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "هِيرُون الإِسْكَنْدَرِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب مستحسن نظرياً لكنه زائد في ضوء وجود "هِيرُو الإِسْكَنْدَرِيّ" و"هِيرُون"
        معاً في المجموعة. إضافته لا تُضيف قيمةً تمييزيةً جديدة ويُثقل المجموعة
        بصيغ متكررة. لا دليل معجمي مستقل يوجب إدراجه.

    - lemma: "بَطَلُ الإِسْكَنْدَرِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        فشل في اختبار السكّ المعجمي: "بطل" وصف دلالي حرّ يعني المتفوق أو
        المحارب، ولم يُسكَّ قط اسماً لشخص بعينه في المصادر العربية المعجمية.
        الترجمة الحرفية للاسم اليوناني "Hero" بـ"بطل" تقع في خطأ الاقتراض
        المفهومي الأعمى: الاسم اليوناني "Ἥρων" اسم علم لا صفة وصفية،
        ومن ثَمّ لا يجوز ترجمته كما تُترجم الصفات.

    - lemma: "أَبُو الآلَات"
      source: stage1
      decision: removed
      decision_reason: >
        لقب ابتكاري لا شاهد له في أي مصدر معجمي. اختبار التثبيت المعجمي
        يفشل: إذ يمكن إبداله بـ"والد الآلات" أو "صاحب الآلات" وتبقى العبارة
        وصفاً صالحاً، مما يعني أنها ليست مصطلحاً مسكوكاً بل وصفاً حراً.
        يُرفض.

  synset_actions:
    - command: update_synset
      params:
