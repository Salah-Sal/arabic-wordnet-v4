      decision: revise
      reason: >
        كلمة "رياضي" مُلتبسة؛ في العربية المعاصرة تعني رياضياً بدنياً (athlete)
        أكثر من عالم الرياضيات (mathematician). ينبغي استبدالها بـ"عالم رياضيات"
        للدقة. يُستحسن أيضاً إضافة تعريف موسوعي يُجلّي أهم إسهاماته
