# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. اللمّات المرشحة — توليد عمياء من التعريف فقط
  # التعريف: مهندس طيران إنجليزي اخترع محرك الطائرات النفاثة (1907-1996)
  # الخلاصة: شخصية تاريخية بعينها (علم شخصي أجنبي) → اللمّات تعريبات صوتية للاسم المتوقَّع
  blind_candidates:
    - lemma: "وِيتِل"
      generation_method: taarib
      justification: "تعريب صوتي للقب الشخصية (Whittle) وفق أعراف التعريب العربي الشائعة؛ اللقب يُعادل نطق الطاء الإنجليزية بالواو والياء والتاء"

    - lemma: "فرانك وِيتِل"
      generation_method: taarib
      justification: "تعريب الاسم الأول (Frank) مع اللقب (Whittle) في مركّب إضافي، وهو الصيغة المتداولة لأسماء الأعلام الغربية في المصادر العربية"

    - lemma: "السِّير فرانك وِيتِل"
      generation_method: taarib
      justification: "تعريب الاسم الكامل مع اللقب الفخري 'Sir' الذي مُنح لهذه الشخصية؛ مطابق للمّة 'Sir Frank Whittle' في المجموعة الإنجليزية الأصل (OEWN)"

    - lemma: "فرانك هوِيتِل"
      generation_method: taarib
      justification: "صيغة تعريب بديلة تحاكي النطق البريطاني للاسم (Wh-) بإضافة هاء مُقدَّمة، وهي ظاهرة شائعة في بعض المصادر العربية القديمة لتعريب أسماء W الإنجليزية"

  # ب. التقييم الأولي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "اللمّتان الموجودتان 'فرانك ويتل' و'ويتل' تفتقران إلى التشكيل الكامل الإلزامي"
      - "غياب لمّة 'السير فرانك ويتل' الموجودة في المجموعة الإنجليزية الأصل (Sir Frank Whittle)"
      - "لمّة 'ويتل' وحدها قاصرة في التمييز إذ قد يلتبس اللقب مع أسماء أخرى خارج السياق"
    observations: "المجموعة خاصة بالسير فرانك ويتل (1907-1996)، مهندس الطيران البريطاني مخترع المحرك التوربيني النفاث. الاستخدام العربي لاسمه يعتمد التعريب الصوتي بلا بديل عربي أصيل. اللمّات الحالية صحيحة في جوهرها لكنها تحتاج إلى: تشكيل كامل، وإضافة صيغة 'السير' لمطابقة OEWN. لمّة 'ويتل' المختصرة مقبولة ومتعارَف عليها في النصوص الأكاديمية والتاريخية العربية المتخصصة."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١. مطابقة دفعية لجميع اللمّات (headword_norm)         → لا نتائج للأسماء الشخصية
# ٢. جسر إنجليزي (Whittle / Frank Whittle / jet engine) → نتيجة جزئية واحدة لـ whittle الفعل
# ٣. FTS عربي بكلمات مفتاحية (ويتل / نفاث / محرك نفاث) → أدلة غير مباشرة
stage2_evidence:
  per_lemma:

    - lemma: "فرانك ويتل"
      evidence_status: "no_material_found"

    - lemma: "ويتل"
      expands:
        - text: "«مثقب (ويتل) العنفي»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "يُستخدم اسم 'ويتل' منسوباً في مصطلح 'whittle - turbo-drill' (مثقب توربيني نفاث)، مما يُثبت شيوع تعريب اللقب بهذه الصورة الضبطية في المعاجم العربية المتخصصة"

    - lemma: "السِّير فرانك وِيتِل"
      evidence_status: "no_material_found"

    - lemma: "فرانك هوِيتِل"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: فرانك ويتل ──────────────────────────────
    - lemma: "فرانك ويتل"
      decision: confirmed
      decision_reason: "الصيغة الأكثر شيوعاً وأكثر تداولاً في المصادر العربية للإحالة إلى هذه الشخصية؛ مركّب إضافي صحيح من اسم أول ولقب. تحتاج فقط إلى تشكيل كامل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الصيغة الرسمية الأساسية للاسم الكامل؛ تُستخدم في السياقات التوثيقية والأكاديمية والإعلامية عند أول ذكر للشخصية"
      morphology_check:
        pos_fit: "تعريب صوتي لاسم علم أجنبي — لا يخضع للوزن الصرفي العربي"
        borrowing_check: "تعريب لفظي مقبول (معرَّب) يقبل التعريف والجمع النسبي وفق قواعد الأعلام الأجنبية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فرانك وِيتِل"

    # ── لمّة موجودة: ويتل ─────────────────────────────────────
    - lemma: "ويتل"
      decision: confirmed
      decision_reason: "اللقب المختصر المعرَّب، مدعوم بوروده في المعجم الموحد لمصطلحات النفط منسوباً، وشائع في الكتابة الأكاديمية العربية لاختصار أسماء الأعلام."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب وحده — يُستخدم في السياقات الموجزة أو عند تكرار الذكر بعد إيراد الاسم الكامل أول مرة، وفي نسب الاختراعات والمصطلحات المُسمَّاة باسمه"
      morphology_check:
        pos_fit: "تعريب صوتي للقب أجنبي أحادي المقطع"
        borrowing_check: "تعريب لفظي مقبول مطَّرد في مصادر متخصصة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيتِل"

    # ── مرشح المرحلة ١: السِّير فرانك وِيتِل ────────────────
    - lemma: "السِّير فرانك وِيتِل"
      source: stage1
      decision: confirmed
      decision_reason: "مطابق للمّة 'Sir Frank Whittle' في OEWN؛ اللقب 'السير' (Sir) مُنح له عام 1948 وهو جزء لا يتجزأ من اسمه الرسمي. إضافته تُكمل التغطية وتُسهم في دقة التعريف."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الصيغة الرسمية الأكمل مع اللقب الفخري؛ تُستخدم في النصوص الرسمية والوثائق التاريخية والمراجع الموسوعية التي تُولي الألقاب اهتماماً خاصاً"
      morphology_check:
        pos_fit: "مركب إضافي مؤلف من لقب فخري أجنبي معرَّب + اسم علم أجنبي"
        borrowing_check: "تعريب لفظي مقبول للقب الفخري البريطاني 'Sir'"
      actions:
        - command: create_entry
          params:
            lemma: "السِّير فرانك وِيتِل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: فرانك هوِيتِل — مرفوض ───────────────
    - lemma: "فرانك هوِيتِل"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد في المصادر العربية المعتمدة على هذه الصيغة؛ إضافة هاء مُقدَّمة للحرف W غير مطَّردة في التعريب المعاصر، والصيغة الشائعة هي 'ويتل' لا 'هويتل'."


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
# اللمّات المؤكدة: فرانك وِيتِل / وِيتِل / السِّير فرانك وِيتِل
