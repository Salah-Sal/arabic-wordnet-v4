# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
stage5_enrichment:

  # per_entry: الأسماء المرشحة أعلام أجنبية معرَّبة — لا جذر عربي قابل للتطبيق
  # لا يوجد اقتباس من مقاييس اللغة لأن الكلمات ليست عربية الأصل
  # → حقول root و maqayis_quote محذوفة وفق قاعدة DRY

  per_sense:
    - lemma: "فرانك وِيتِل"
      sense_id: "{auto}"
      nuance: "الاسم الكامل (اسم أول + لقب) — الصيغة الرسمية الأساسية عند أول ذكر؛ الأوسع انتشاراً في المصادر العربية الموسوعية والأكاديمية"
      mwe: true

    - lemma: "وِيتِل"
      sense_id: "{auto}"
      nuance: "اللقب المختصر وحده — يُستعمل بعد ذكر الاسم الكامل أول مرة، أو في السياقات التقنية والتاريخية الموجزة، ومنه تُشتق النسبة في مصطلحات كـ'مثقب ويتل'"
      mwe: false

    - lemma: "السِّير فرانك وِيتِل"
      sense_id: "{auto}"
      nuance: "الاسم الرسمي الكامل مع اللقب الفخري — الصيغة الأعلى رسمية وتُستخدم في المراجع والتوثيقات الرسمية والمراسيم البريطانية"
      mwe: true

  synset:
    cultural_fit: omission

  actions:
    # مدخل: فرانك وِيتِل (MWE — علم أجنبي معرَّب)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"mwe":true,"mwe_type":"idafi","borrowing":"taarib","foreign_name":true}'

    # مدخل: وِيتِل (علم أجنبي معرَّب)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"mwe":false,"borrowing":"taarib","foreign_name":true}'

    # مدخل: السِّير فرانك وِيتِل (MWE — علم أجنبي معرَّب مع لقب)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"mwe":true,"mwe_type":"idafi","borrowing":"taarib","foreign_name":true,"honorific":"Sir"}'

    # معنى: فرانك وِيتِل
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الكامل — الصيغة الرسمية الأساسية عند أول ذكر","mwe":true}'

    # معنى: وِيتِل
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللقب المختصر — يُستعمل في السياقات الموجزة وبعد سبق الاسم الكامل","mwe":false}'

    # معنى: السِّير فرانك وِيتِل
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الكامل مع اللقب الفخري — الصيغة الأعلى رسمية","mwe":true}'

    # المجموعة الترادفية
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"omission","note":"علم شخصي أجنبي لا جذر عربي له — يُعرَّب صوتياً"}'

    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.82
