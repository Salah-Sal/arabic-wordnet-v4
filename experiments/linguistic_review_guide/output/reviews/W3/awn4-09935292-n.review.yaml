# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset: awn4-09935292-n  |  ili: i88954  |  pos: n
# chess player / لاعب شطرنج
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «لاعب شطرنج» تفتقر إلى التشكيل الكامل المطلوب"
      - "المجموعة تضمّ لمّةً واحدةً فقط؛ وكلمة «شطرنجي» المُسجَّلة في المعاجم الكلاسيكية والمعاصرة غائبة"
    observations: >-
      المجموعة تصف مُمارِس لعبة الشطرنج. اللمّة الموجودة «لاعب شطرنج» مركّبٌ إضافيٌّ
      مناسب لكنه يفتقر إلى التشكيل. للعربية الكلاسيكية والمعاصرة مصطلح صرفي مُدمَج
      هو «شطرنجي» وردت في الثعالبي وابن خلكان ومعجم اللغة العربية المعاصرة. التعريف
      الحالي مقبول بيد أنّ صياغته تحتمل تحسيناً أسلوبياً.

  blind_candidates:
    - lemma: "شَطْرَنْجِيٌّ"
      generation_method: ishtiqaq
      justification: >-
        نسبة إلى «شطرنج» على وزن فَعْلَنِيّ (وفيه إشباع النسبة) مع تحويل المعنى
        من الصفة إلى الاسم الدالّ على مُمارِس اللعبة، قياساً على: كُرَوِيّ (لاعب كرة)،
        وهو من أوجز الاشتقاقات وأيسرها تداولاً.
    - lemma: "لَاعِبُ شِطْرَنْجٍ"
      generation_method: tarkib
      justification: >-
        مركّب إضافي من اسم الفاعل «لاعب» مضافاً إلى «شطرنج» على النمط العربي
        الفصيح «لاعب كرة / لاعب تنس». وحدة معجمية مثبَّتة في معاجم اللغة العربية
        المعاصرة.
    - lemma: "رُقْعِيٌّ"
      generation_method: majaz
      justification: >-
        مجاز مرسل بعلاقة الظرفية: الرُّقْعَة هي لوح الشطرنج، ونسبة اللاعب إليها
        على وزن فُعْلِيّ محاولةٌ لإيجاد مصطلح مدمج عربي خالص.
    - lemma: "مُشَطْرِجٌ"
      generation_method: ishtiqaq
      justification: >-
        اشتقاق على وزن مُفَعْلِل من الجذر الرباعي «شطرج» (نسخة مقصورة من شطرنج)،
        صيغة اسم الفاعل من باب الفَعْلَلَة للدلالة على الفاعل.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ── ملاحظة منهجية ──
  # الاستعلامات المنفَّذة (٥ استعلامات):
  # ١. مطابقة دفعية: لاعب شطرنج + شطرنجي + شطرنج + رقعي + مشطرج (بصيغتَي ال- وبدونها)
  # ٢. جسر إنجليزي: chess player / chess في entries_translations_fts
  # ٣. بحث FTS عربي: شطرنجي | لاعب الشطرنج | لاعب شطرنج
  # ٤. لاعب (مفرد) للمعلومات الصرفية
  # ٥. مقاييس اللغة: جذر لعب (dictionary_id=151)

  per_lemma:
    - lemma: "لَاعِبُ شِطْرَنْجٍ"
      confirm:
        - text: "«لاعب كرة السَّلَّة- لاعبو المصارعة- لاعبات الجُمْباز- لاعب شطرنج ماهر»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«مات الشاه!: تعبير يعلن فيه لاعب الشّطرنج أنه قد قام بحركة أماتت شاهَ الخصم»"
          source: "المورد الحديث (2008)"

    - lemma: "شَطْرَنْجِيٌّ"
      confirm:
        - text: "«شطرنجي: لاعب الشطرنج (فوك) (الثعالبي) في (يواقيت المواقيت فصل 53) (خلكان 7، 51) (حياة تيمور 2، 872)»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«فلَان حسن الدست شطرنجي ماهر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«فلان حسن الدست: أي شطرنجي حاذق»"
          source: "أساس البلاغة للزمخشري"
      expands:
        - text: "«شطرنجي: الضيف الذي يمسك بقطعة، ثم يضعها، ويأخذ أخرى ويعود إلى الأولى ويمسك بالثالثة كلاعب لم يستقر على رأي»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: >-
            تُفيد بأن «شطرنجي» استُعير مجازياً للدلالة على كثير التردد وعدم
            الحسم، وهو توسّع دلالي لا يعارض الاستعمال الحقيقي بمعنى لاعب الشطرنج.

    - lemma: "رُقْعِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "مُشَطْرِجٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "لاعب شطرنج"
      decision: confirmed
      decision_reason: >-
        مركّب إضافي فصيح مُثبَّت في معجم اللغة العربية المعاصرة ومعاجم حديثة أخرى.
        يؤدّي الوظيفة الدلالية بوضوح. يُصحَّح تشكيله إلى «لَاعِبُ شِطْرَنْجٍ».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        أكثر انتشاراً في السياق الإعلامي والتعليمي الحديث، يصلح وصفاً لأي ممارس
        للعبة دون دلالة على الاحتراف أو الإتقان. يُستعمل في السياقات الوصفية
        والتعريفية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاعِبُ شِطْرَنْجٍ"

    # ── مرشّح المرحلة ١ ──
    - lemma: "شَطْرَنْجِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >-
        مصطلح مُسجَّل في مصادر كلاسيكية وحديثة موثوقة: الثعالبي، ابن خلكان، أساس
        البلاغة للزمخشري، المعجم الوسيط، وتكملة المعاجم لدوزي. يُمثّل الاشتقاق
        النسبي الأقصر والأيسر تداولاً لأداء هذا المعنى. اجتاز اختبار التثبيت
        المعجمي بنجاح (وارد في مصادر كلاسيكية متعددة مستقلة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يحمل ظلالاً من الاحتراف والإتقان في استعمالاته الكلاسيكية («شطرنجي حاذق»،
        «شطرنجي ماهر»)، ويَرِد كثيراً للدلالة على من نَسَبَ نفسه إلى هذه اللعبة
        أو اشتُهر بها. أوجز من «لاعب شطرنج» ويصلح للسياقات الرسمية والأدبية.
      actions:
        - command: create_entry
          params:
            lemma: "شَطْرَنْجِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09935292-n"

    - lemma: "رُقْعِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا يوجد أي شاهد معجمي يثبّت استعمال «رقعي» بمعنى لاعب الشطرنج. «الرقعة»
        تُستعمل دلالياً للوحة الشطرنج لكن النسبة منها لم تُسكَّ اصطلاحاً للاعب.
        خطر الاشتراك مع معانٍ أخرى (رقعة الثوب، الرقعة الأرضية) مرتفع.

    - lemma: "مُشَطْرِجٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا شاهد معجمي يُثبّت هذه الصيغة. الجذر «شطرج» (بحذف النون) غير مُثبَّت
        في المعاجم باعتباره جذراً صرفياً عاملاً. «شطرنج» معرَّب يصعب إدراجه ضمن
        أوزان الفعللة دون دليل استعمالي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يلعب لعبة الشطرنج"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي فيه تضعيف أسلوبي: ورود «لعبة» مع «يلعب» يُحدث تجانساً
        لفظياً (يلعب لعبة) مثيراً للانتقاد المعجمي. أسلوب المعجم الوسيط يُفضّل
        «يمارس» أو «يحترف» مع حذف المفعول الداخلي.
    authored:
      - type: terminological
        text: "مَنْ يُمارِسُ لُعْبَةَ الشِّطْرَنْجِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَنْ يَلْعَبُ الشِّطْرَنْجَ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09935292-n"
          definition_index: 0
          text: "مَنْ يُمارِسُ لُعْبَةَ الشِّطْرَنْجِ"

  examples:
    per_lemma:
      - lemma: "لَاعِبُ شِطْرَنْجٍ"
        examples:
          - text: "فاز لاعبُ الشطرنجِ الروسيُّ بالبطولة العالمية بعد مباراة استمرت خمسَ ساعات."
            type: usage
      - lemma: "شَطْرَنْجِيٌّ"
        examples:
          - text: "كان ابن خلكان يصفه بأنه شطرنجيٌّ بارع لا يُجارى في دقّة حساباته."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "فاز لاعبُ الشطرنجِ الروسيُّ بالبطولة العالمية بعد مباراة استمرت خمسَ ساعات."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كان ابن خلكان يصفه بأنه شطرنجيٌّ بارع لا يُجارى في دقّة حساباته."


