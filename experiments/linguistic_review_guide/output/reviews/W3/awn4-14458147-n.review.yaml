# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14458147-n
# importance / grandness — مكانة بارزة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أهمية، عظمة) بدون تشكيل كامل"
      - "«عظمة» غلب استعمالها في المعاجم القديمة بمعنى الكبرياء والنخوة، واستعمالها بمعنى عِظَم المكانة حديث"
      - "المجموعة تحتاج لمّات تُبرز بُعد المنزلة الاجتماعية الرفيعة (status) لا مجرد الأهمية المجردة"
    observations: >
      المفهوم يدور حول المكانة البارزة بوصفها وضعاً اجتماعياً مرموقاً، وهو فرع من المكانة/السمعة.
      اللمّتان الموجودتان تغطّيان بُعدَي القيمة (أهمية) والفخامة (عظمة)، لكنهما لا تغطّيان
      بُعد الرُّتبة الاجتماعية والقدر بين الناس. المفهوم غنيّ في العربية وله ألفاظ تراثية عديدة.
  blind_candidates:
    - lemma: "شَأْن"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ش أ ن)، يدلّ على المنزلة والقدر والأمر العظيم. ورد في القرآن والمعاجم بمعنى
        المنزلة والقدر، ويُقال «رجل من ذوي الشأن». يُغطّي بُعد الوضع والمنزلة الاجتماعية.
    - lemma: "رِفْعَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ر ف ع) على وزن فِعْلَة، تدلّ على الشرف وارتفاع القدر والمنزلة.
        لفظ تراثي فصيح يُعبّر عن علوّ المكانة وسموّها، وهو أقرب الألفاظ إلى معنى «مكانة بارزة».
    - lemma: "جَلَال"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ج ل ل)، يدلّ على عِظَم القدر. غير أنّ غلبة استعماله في السياق الإلهي
        والصوفي قد تُضعف ملاءمته للمكانة الاجتماعية العامة.
    - lemma: "مَهَابَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ه ي ب) على وزن مَفْعَلَة، تدلّ على الوقار والهيبة. لكنها أقرب إلى الخشية
        والتوقير منها إلى المكانة البارزة بذاتها.

stage2_evidence:
  per_lemma:
    - lemma: "أَهَمِّيَّة"
      confirm:
        - text: "«أَهَمِّيَّة — الجذر: هـ م م — مصدر صناعي قياسي من أفعل التفضيل أَهَمّ، وقد أوردتها بعض المعاجم الحديثة كالأساسي»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«أهميّة؛ شأن»"
          source: "المورد الحديث (ترجمة importance)"
      expands:
        - text: "«شُهرة؛ شأن؛ أهميّة»"
          source: "المورد الحديث (ترجمة prominence)"
          addition: "ربط الأهمية بالبروز والشهرة، ما يؤكد ملاءمتها لمعنى المكانة البارزة"

    - lemma: "عَظَمَة"
      confirm:
        - text: "«عَظَمَة — يشيع استعمالها بمعنى عِظَم المكانة، والأصل في استعمالها أنها لمعنى الكِبْر والتجبر، وهي على هذا — فصيحة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«العظمة: والعلو والفوقية معناها استحقاقه تعالى نعوت الجلال وصفات التعالي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«العظمة — من الذراع واللسان: ما غلُظ منهما — الكبرياء — النخوة — الزهو»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأول فيزيائي (ما غلُظ)، والمعاني التالية (كبرياء، نخوة، زهو) فيها دلالة سلبية على التكبّر"

    - lemma: "شَأْن"
      confirm:
        - text: "«المنزلة والقدر. يُقال: رجل من ذوي الشأن»"
          source: "المعجم الوسيط"
        - text: "«الأمرُ والحالُ — الطلبُ والحاجة — المنزلةُ والقدرُ»"
          source: "المعجم الكبير"
        - text: "«شأَن الشخصُ: ارتفع قدرُه وعلت منزلتُه وسمت مكانتُه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«الشأن: الحال والأمر الذي يتّفق ويصلح، ولا يقال إلا فيما يعظم من الأحوال والأمور»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
      expands:
        - text: "«أهمية؛ شأن It's of no consequence — مكانة؛ منزلة اجتماعية رفيعة a man of consequence»"
          source: "المورد الحديث (ترجمة consequence)"
          addition: "ربط شأن بالأهمية والمكانة الاجتماعية في الاستعمال الإنجليزي"

    - lemma: "رِفْعَة"
      confirm:
        - text: "«الشَّرف وارتفاع القدر والمنزلة»"
          source: "المعجم الوسيط"
        - text: "«الشَّرَفُ والسُّمُوُّ والعِزَّةُ، خلافُ الذِّلَّة والضَّعَة»"
          source: "المعجم الكبير"

    - lemma: "جَلَال"
      confirm:
        - text: "«الجلالة عظم القدر وبغيرها التناهي فيه، وخُصّ به تعالى فقيل ذو الجلال، ولم يُستعمل في غيره»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الجلال: احتجاب الحق عنا بعزته — الجلال من الصفات ما يتعلق بالقهر والغضب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "خُصّ بالصفات الإلهية ولم يُستعمل في غير الله تعالى عند كثير من اللغويين"

    - lemma: "مَهَابَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أَهَمِّيَّة"
      decision: confirmed
      decision_reason: >
        مصدر صناعي قياسي من «أهمّ»، صحّحه معجم الصواب اللغوي وأقرّته المعاجم الحديثة.
        يدلّ على القيمة والقدر، ويُستعمل استعمالاً واسعاً في العربية المعاصرة بمعنى المكانة والوزن.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على القيمة الذاتية والوزن المعنوي للشيء أو الشخص، مع تركيز على الجانب التقييمي المجرّد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَهَمِّيَّة"

    - lemma: "عَظَمَة"
      decision: confirmed
      decision_reason: >
        صحّحها معجم الصواب اللغوي بمعنى عِظَم المكانة والقدر، وإن كان أصلها في الكبرياء والنخوة.
        تُغطّي بُعد الفخامة والجلال في المكانة، وتُقابل الإنجليزية grandness تماماً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الفخامة والجلال في المكانة، مع إيحاء بالهيبة والكِبَر، وتُستعمل للأشخاص والأمور ذات القدر العظيم"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَظَمَة"

    - lemma: "شَأْن"
      source: stage1
      decision: confirmed
      decision_reason: >
        ثبت في المعجم الوسيط والمعجم الكبير بمعنى «المنزلة والقدر»، وأكّده معجم اللغة المعاصرة
        بمعنى «ارتفع قدره وعلت منزلته». لفظ تراثي أصيل قرآني متعدّد المعاني، لكنّ دلالة
        المنزلة والقدر فيه راسخة ومُثبتة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المنزلة والقدر بين الناس مع إيحاء بالأمر العظيم الذي يُعتنى به، ويُركّز على البُعد الاجتماعي للمكانة"
      actions:
        - command: create_entry
          params:
            lemma: "شَأْن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رِفْعَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        ثبت في المعجم الوسيط بمعنى «الشرف وارتفاع القدر والمنزلة»، وفي المعجم الكبير
        بمعنى «الشرف والسمو والعزّة، خلاف الذلّة والضَّعَة». لفظ تراثي فصيح يُعبّر
        عن علوّ المكانة بدقّة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على ارتفاع القدر والمنزلة مع إيحاء بالشرف والسموّ، وتقابل الضَّعَة والذِّلَّة، فهي أخصّ بالعلوّ في المراتب"
      actions:
        - command: create_entry
          params:
            lemma: "رِفْعَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "جَلَال"
      source: stage1
      decision: removed
      decision_reason: >
        غلبت عليه الدلالة الإلهية والصوفية حتى خُصّ بالله تعالى عند كثير من اللغويين،
        فقال الراغب: «خُصّ به تعالى فقيل ذو الجلال ولم يُستعمل في غيره».
        لا يصلح للدلالة على المكانة الاجتماعية العامة.

    - lemma: "مَهَابَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجَد أدلة معجمية مباشرة، والمهابة أقرب إلى الخشية والتوقير والرهبة
        منها إلى المكانة البارزة بذاتها. وهي تصف أثر المكانة لا المكانة نفسها.

