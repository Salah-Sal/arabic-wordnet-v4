# مراجعة المجموعة الترادفية — awn4-14018633-n
# latitude: freedom from normal restraints in conduct
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «حرية تصرف» تركيب إضافي قد لا يكون وحدة معجمية ثابتة بل عبارة وصفية حرة"
      - "اللمّة «سعة» متعددة الدلالات جداً (سعة فيزيائية، طاقة، غنى) مما قد يُضعف دقتها"
      - "التعريف العربي «التحرر من القيود العادية في السلوك» ترجمة حرفية من الإنجليزية ويحتاج صياغة معجمية"
    observations: "المفهوم المراد هو حالة التحلل من القيود المعهودة في السلوك، أي المجال الذي يتحرك فيه المرء دون رقابة أو تضييق. وهو ضرب من الحرية لا يتعلق بالسياسة أو الفكر بل بالممارسة السلوكية. المعنى قريب من الانفساح والتساهل والترخص. الجنس القريب: حرية، والفصل النوعي: كونها في مجال السلوك والتصرف لا في مجال الاعتقاد أو التعبير."
  blind_candidates:
    - lemma: "فُسْحَة"
      generation_method: majaz
      justification: "الفُسحة في الأصل السَّعة المكانية، ثم توسّع العرب في استعمالها مجازاً لتشمل السعة في الأمر والحرية في التصرف. وقد ورد في المعجم الوسيط: «في هذا الأمر فسحة أي سعة». فهي مجاز مكاني دالّ على الحرية في السلوك."
    - lemma: "تَرَخُّص"
      generation_method: ishtiqaq
      justification: "من الجذر ر-خ-ص على وزن تَفَعُّل، بمعنى الأخذ بالرخصة وعدم الاستقصاء في الأمور. ودلالته على التحلل من القيود السلوكية واضحة، لكنه مصدر فعلي وقد يكون أنسب للفعل منه للاسم."
    - lemma: "تَسَاهُل"
      generation_method: ishtiqaq
      justification: "من الجذر س-ه-ل على وزن تَفَاعُل الدال على المشاركة والتماثل، بمعنى التسامح وعدم التشدد. ودلالته قريبة من المفهوم لكنه يركز على الموقف تجاه الغير أكثر من حالة صاحبه."
    - lemma: "انْفِسَاح"
      generation_method: ishtiqaq
      justification: "من الجذر ف-س-ح على وزن انفعال، يدل على التوسع والانبساط. يجمع بين دلالة الفسحة المكانية والحرية المعنوية في التصرف."

stage2_evidence:
  per_lemma:
    - lemma: "حُرِّيَّة تَصَرُّف"
      evidence_status: "no_material_found"

    - lemma: "سَعَة"
      confirm:
        - text: "«الطَّاقة والقُوَّة. الدَّعَة والغِنى والرَّفاهِيَة. يقال: هو في سَعَةٍ من العيش»"
          source: "المعجم الوسيط (OCR)"
        - text: "«السّعة: بفتح السين هي بالفارسية (فراخي) والتّوسعة والاحتواء والغنى. والوسع بالضم كذلك: ووصول اليد للشيء والاستطاعة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«(وَسَعَ) الْوَاوُ وَالسِّينُ وَالْعَيْنُ: كَلِمَةٌ تَدُلُّ عَلَى خِلَافِ الضِّيقِ وَالْعُسْرِ. يُقَالُ وَسُعَ الشَّيْءُ وَاتَّسَعَ. وَالْوُسْعُ: الْغِنَى. وَالْوُسْعُ: الْجِدَةُ وَالطَّاقَةُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدل على خلاف الضيق، وهو ما يتوافق مع مفهوم الحرية من القيود"
      contradicts:
        - text: "«سَعَة: capacity / amplitude»"
          source: "معاجم أرابتيرم المتعددة (هندسة، فيزياء، كيمياء)"
          conflict: "الدلالة التقنية السائدة لكلمة «سعة» في المصطلحات الحديثة هي السعة الفيزيائية أو الحجمية، لا الحرية السلوكية"

    - lemma: "فُسْحَة"
      confirm:
        - text: "«الفُسْحَةُ، بالضم: السَّعَةُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(الفسحة) السعَة (ج) فسح يُقَال فِي هَذَا الْأَمر فسحة أَي سَعَة»"
          source: "المعجم الوسيط (هوراماني)"
        - text: "«الفُسْحَةُ: السَّعَةُ. في هذا الأمر فُسْحة: أى سَعَة»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«(فَسَحَ) الْفَاءُ وَالسِّينُ وَالْحَاءُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى سَعَةٍ وَاتِّسَاعٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ف-س-ح أصل واحد لا يخرج عن معنى السعة والاتساع"
        - text: "«ورَجُلٌ فُسُحٌ وفُسْحُمٌ: واسِعُ الصَّدْرِ. والفَسْحُ، بالفتح: شِبْهُ الجَوازِ. فَسَحَ له الأمير في السَّفَرِ: كتَبَ له الفَسْحَ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الفسح بمعنى الإذن والجواز دلالة مباشرة على الحرية في التصرف"

    - lemma: "تَرَخُّص"
      confirm:
        - text: "«(ترخص) فِي الْأُمُور أَخذ فِيهَا بِالرُّخْصَةِ»"
          source: "المعجم الوسيط (هوراماني)"
        - text: "«في الأمورِ: أَخَذ فيها بالرُّخْصَةِ. في حَقِّه: أَخَذَ كُلَّ ما تَيَسَّرَ منه ولم يَسْتَقْصِ»"
          source: "المعجم الكبير (OCR)"
        - text: "«الترخص: في الأمر، التيسير وعدم الاستقصاء»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«(رَخَصَ) الرَّاءُ وَالْخَاءُ وَالصَّادُ أَصْلٌ يَدُلُّ عَلَى لِينٍ وَخِلَافِ شِدَّةٍ. وَالرُّخْصَةُ فِي الْأَمْرِ: خِلَافُ التَّشْدِيدِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدل على اللين وخلاف الشدة، مما يناسب مفهوم رفع القيود"

    - lemma: "تَسَاهُل"
      confirm:
        - text: "«(تساهل) الشَّيْء سهل وَلم يتعاسر وَفُلَان تسَامح وَالنَّاس بَعضهم مَعَ بعض تياسروا وتسامحوا»"
          source: "المعجم الوسيط (هوراماني)"
      contradicts:
        - text: "«التساهل: في العبارة أداء اللفظ بحيث لا يدل على المراد دلالةً صريحة»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "التساهل في الاصطلاح العلمي يعني التقصير في الدقة اللفظية لا الحرية السلوكية"
        - text: "«تساهُل: tolerance»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
          conflict: "المعنى التقني (التفاوت المسموح به) يبتعد عن دلالة الحرية السلوكية"

    - lemma: "انْفِسَاح"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "حُرِّيَّة تَصَرُّف"
      decision: confirmed
      decision_reason: "تركيب إضافي مفهوم ودقيق في التعبير عن المفهوم: حرية مقيدة بمجال التصرف والسلوك. وإن لم يكن مسجلاً كوحدة معجمية في المعاجم الكلاسيكية، فإنه شائع في الاستعمال القانوني والإداري الحديث بمعنى الصلاحية في اتخاذ القرار دون قيد. وقد ورد في المورد الحديث ترجمة latitude بمعنى «حرية العمل أو الاختيار»، مما يدعم هذا التركيب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركز على البعد العملي والقراري للحرية، أي قدرة المرء على اتخاذ ما يشاء من قرارات وأفعال دون رقابة. أقرب إلى الاستعمال الرسمي والقانوني."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُرِّيَّة تَصَرُّف"

    - lemma: "سَعَة"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل من الجذر و-س-ع يدل على خلاف الضيق. ورد في المعجم الوسيط بمعنى الطاقة والقوة والدعة، وفي كشاف الاصطلاحات بمعنى التوسعة والاحتواء. يصلح للدلالة على الحرية السلوكية بالمعنى المجازي (سعة في التصرف). وإن كانت الدلالة التقنية (capacity/amplitude) شائعة، فإن الدلالة اللغوية الأصلية واضحة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على المجال الواسع الذي يتحرك فيه المرء بلا ضيق أو حرج. أعمّ من حرية تصرف لأنها تشمل اليسر والرفاه والطاقة، لا مجرد القدرة على الفعل."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَعَة"

    - lemma: "فُسْحَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي فصيح من الجذر ف-س-ح، معناه الأصلي السعة، وقد استعمل مجازاً بمعنى المتسع في الأمر. ورد في القاموس المحيط والمعجم الوسيط: «في هذا الأمر فسحة أي سعة». وأصل الجذر عند ابن فارس يدل على السعة والاتساع حصراً. كما أن الفَسْح بمعنى الجواز والإذن يدعم الدلالة على الحرية. يضيف بعداً دلالياً مميزاً إلى المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركز على المساحة المتاحة للفعل والمتسع فيه، بدلالة مكانية مجازية. تُستعمل عادة في سياق «في هذا الأمر فسحة» أي مجال للتصرف والاختيار. أخص من سعة وأقل رسمية من حرية تصرف."
      actions:
        - command: create_entry
          params:
            lemma: "فُسْحَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَرَخُّص"
      source: stage1
      decision: removed
      decision_reason: "ترخّص مصدر للفعل تَرَخَّصَ، والفعل مسجل في المعجم الكبير والوسيط بنصّ واحد: «أخذ فيها بالرخصة». دلالته أقرب إلى فعل الأخذ بالتيسير منها إلى حالة الحرية ذاتها. كما أن المصطلح محصور غالباً في السياق الفقهي (الأخذ بالرخصة الشرعية) مما يُضيّق مجاله الدلالي عن المفهوم المطلوب."

    - lemma: "تَسَاهُل"
      source: stage1
      decision: removed
      decision_reason: "دلالة التساهل في المعاجم تتأرجح بين التسامح (إيجابي) والتقصير في الدقة (سلبي اصطلاحي). وقد اصطلح عليه في الهندسة المدنية بمعنى tolerance. كما أن المعنى الأساسي يركز على الموقف تجاه الغير (تسامح) لا على حالة الحرية الذاتية من القيود، مما يبعده عن مفهوم المجموعة."

    - lemma: "انْفِسَاح"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد له شواهد معجمية، وهو مصدر قياسي لانفسح لكنه غير مسكوك ولا شائع الاستعمال. والفُسحة المفردة أجود منه وأكثر تداولاً وأقرب إلى أسلوب المعاجم."

