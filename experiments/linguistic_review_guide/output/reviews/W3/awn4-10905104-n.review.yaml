    current: "رجل دين إنجليزي اخترع نول الطاقة (1743-1823)"
    assessment:
      decision: revise
      reason: >
        التعريف صحيح في مضمونه لكنه يحتاج تحسينًا من ناحيتين:
        (أ) "رجل دين" تعبير عام يشمل رجال الدين في جميع الأديان، و"قسيس" أدق لمن ينتمي
        إلى الكنيسة الأنجليكانية؛
        (ب) الأسلوب الموسوعي يقتضي صياغة أوفى تُبيّن مكانة الاختراع وأثره.
    authored:
      - type: encyclopedic
        text: "قَسِّيسٌ وَمُخْتَرِعٌ إِنجليزيٌّ (1743-1823)، اشتُهِرَ بِاخْتِرَاعِ نَوْلِ الطَّاقَةِ الآلِيِّ نَحْوَ عَامِ 1785م، وَكَانَ لِاخْتِرَاعِهِ أَثَرٌ بَالِغٌ فِي تَطَوُّرِ صِنَاعَةِ النَّسِيجِ إِبَّانَ الثَّوْرَةِ الصِّنَاعِيَّةِ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "قَسِّيسٌ وَمُخْتَرِعٌ إِنجليزيٌّ (1743-1823)، اشتُهِرَ بِاخْتِرَاعِ نَوْلِ الطَّاقَةِ الآلِيِّ نَحْوَ عَامِ 1785م، وَكَانَ لِاخْتِرَاعِهِ أَثَرٌ بَالِغٌ فِي تَطَوُّرِ صِنَاعَةِ النَّسِيجِ إِبَّانَ الثَّوْرَةِ الصِّنَاعِيَّةِ."

