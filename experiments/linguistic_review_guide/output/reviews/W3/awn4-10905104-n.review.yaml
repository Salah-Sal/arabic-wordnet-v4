# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (إدموند كارترايت، كارترايت) تفتقران إلى التشكيل الكامل"
      - "المدخلان علَمان شخصيان أجنبيان معرَّبان؛ يُستحسن أن يُصنَّف نوعهما النحوي proper_noun لا n في نظام المداخل"
      - "التعريف الحالي دقيق في جوهره لكنه يفتقر إلى الأسلوب الموسوعي المعجمي الأمثل: 'رجل دين' عبارة عامة و'قسيس' أدق لرجال الكنيسة الأنجليكانية"
    observations: >
      المجموعة ترادفية لعَلَم شخصي أجنبي هو إدموند كارترايت (1743-1823)، القسيس الإنجليزي
      مخترع نول الطاقة. هذا النوع من المداخل لا يقبل إلا التعريب (الملاذ الأخير) نظرًا لكونه
      اسم عَلَم أجنبي دون جذر عربي أصيل. الصيغة المعتادة في المعاجم والموسوعات العربية لمثل
      هؤلاء الأعلام: الاسم الكامل (الأول+العائلي) باعتباره المدخل الرئيسي، واللقب وحده
      باعتباره إحالة مختصرة. يُلاحَظ أن لفظ "cartwright" الإنجليزي هو في الأصل اسم حرفة
      (صانع العربات: cart+wright)، ثم تحوّل إلى لقب عائلي؛ وقد وردت هذه الدلالة في المورد
      الحديث (2008)، كما استُخدم الرسم التعريبي "كارترايت" في المعجم الطبي الموحد (2009)
      للفصيلة الدموية، مما يعزز صحة هذا الرسم ويكشف عن تعدد في الإحالة يستوجب الانتباه.
  blind_candidates:
    - lemma: "كَارترَايت"
      generation_method: taarib
      justification: "نقل صوتي مباشر للقب العائلي Cartwright الخاص بمخترع نول الطاقة الإنجليزي المذكور في التعريف"
    - lemma: "إِدْمُنْد كَارترَايت"
      generation_method: taarib
      justification: "نقل صوتي للاسم الكامل Edmund Cartwright (الأول+العائلي)، وهو المدخل الرسمي المعتاد في المعاجم الموسوعية لأعلام التاريخ"
    - lemma: "إِدْمُونْد كَارتْرَايت"
      generation_method: taarib
      justification: "صيغة بديلة لنقل الاسم الأول Edmund بإثبات الواو الساكنة (إِدْمُونْد)، وهو تهجٍّ موجود في بعض المراجع العربية"
    - lemma: "إِدْمُنْد"
      generation_method: taarib
      justification: "الاسم الأول وحده بوصفه محاولة للإحالة الاختزالية، غير أنه غير كافٍ للتمييز الفردي عن سائر حاملي هذا الاسم"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات قاعدة البيانات المُنفَّذة:
#  Q1 — مطابقة دفعية للمّات الموجودة + المرشحات (headword_norm IN)  → لا نتائج
#  Q2 — الجسر الإنجليزي: MATCH 'translation_en:"Cartwright" OR translation_en:"Edmund Cartwright" OR translation_en:"power loom"'
#       → مدخلان: الزمرة الدموية كارترايت (طبي)، وصانع الكارّات (المورد الحديث)
#  Q3 — FTS عربي: MATCH '"كارترايت" OR "كارتريت" OR "ادموند" OR "نول الطاقة"'
#       → نفس المدخلَيْن + إحالة لـ"ادموند سپنسر" (غير ذات صلة)
stage2_evidence:
  per_lemma:
    - lemma: "إدموند كارترايت"
      evidence_status: "no_material_found"

    - lemma: "كارترايت"
      expands:
        - text: "«صانع الكارّات أو عربات النقل.»"
          source: "المورد الحديث (2008)"
          addition: >
            يكشف أن اللفظ الإنجليزي cartwright أصله اسم حرفة (صانع العربات = cart+wright)
            ثم تحوّل إلى لقب عائلي شائع في إنجلترا. لا يؤكد الاستخدامَ علَمًا شخصيًا بعينه،
            لكنه يُبيّن الجذر الاشتقاقي الإنجليزي الذي انبثق منه هذا اللقب.
        - text: "«الزُّمْرَةُ الدَّمَوِيَّةُ كارْترايت»"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُثبت أن الرسم التعريبي "كارترايت" مستخدَم في المصطلحية الطبية العربية الحديثة
            لمفهوم مستقل (فصيلة دموية تُنسب إلى أسرة مغايرة)؛ مما يعزز صحة هذا الرسم
            التعريبي المعتمَد في AWN4، ويكشف في الآن ذاته عن ازدواجية في الإحالة تستدعي
            الانتباه عند البحث المعجمي.

    - lemma: "كَارترَايت"
      evidence_status: "no_material_found"

    - lemma: "إِدْمُنْد كَارترَايت"
      evidence_status: "no_material_found"

    - lemma: "إِدْمُونْد كَارتْرَايت"
      evidence_status: "no_material_found"

    - lemma: "إِدْمُنْد"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة: الاسم الكامل ──
    - lemma: "إدموند كارترايت"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للعَلَم الشخصي (الأول + اللقب) بالنقل الصوتي المعتمَد؛ هو المدخل
        الرئيسي الأوفى للتمييز والتعريف الموسوعي. لا يوجد في قاعدة البيانات ما يناقضه.
        يحتاج إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الرسمية الكاملة (الاسم الأول + اللقب العائلي)؛ تُستخدم عند تقديم الشخصية
        لأول مرة وفي السياقات الموسوعية والأكاديمية التي تستلزم التمييز التام عن سائر
        من يحملون اللقب وحده
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِدْمُنْد كَارترَايت"

    # ── اللمّة الموجودة: اللقب وحده ──
    - lemma: "كارترايت"
      decision: confirmed
      decision_reason: >
        اللقب العائلي وحده بوصفه صيغة إحالة مختصرة معتمَدة في الكتابات العلمية والتاريخية
        العربية. وجوده في المجموعة إلى جانب الاسم الكامل يتوافق مع الممارسة المعجمية
        المعيارية للأعلام الأجنبية. يحتاج إضافة التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة المختصرة (اللقب العائلي وحده)؛ تُستخدم في الإحالة اللاحقة بعد ذكر الاسم
        الكامل، وتشيع في الكتابات التخصصية التاريخية والصناعية
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَارترَايت"

    # ── مرشحات المرحلة ١ (جميعها مرفوضة) ──
    - lemma: "كَارترَايت"
      source: stage1
      decision: removed
      decision_reason: "يتطابق مع اللمّة الموجودة 'كارترايت' بعد إضافة التشكيل؛ لا حاجة لإنشاء مدخل مكرر."

    - lemma: "إِدْمُنْد كَارترَايت"
      source: stage1
      decision: removed
      decision_reason: "يتطابق جوهريًا مع اللمّة الموجودة 'إدموند كارترايت' بعد ضبط التشكيل؛ لا حاجة لإنشاء مدخل مكرر."

    - lemma: "إِدْمُونْد كَارتْرَايت"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بديلة متقاربة لا تُضيف قيمة تمييزية؛ الرسم "إِدْمُنْد" بالسكون على الميم
        هو الأدق صوتيًا للنطق الإنجليزي (ED-mund) والأشيع في المراجع العربية المعاصرة.

    - lemma: "إِدْمُنْد"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الأول وحده غير كافٍ للتعريف الفردي؛ إذ يُعدُّ Edmund اسمًا إنجليزيًا شائعًا
        يحمله كثيرون من الشخصيات التاريخية، ولا يحقق الفصل التمييزي الضروري للعَلَم الشخصي.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
# (تُعالَج اللمّات المؤكدة فقط: إِدْمُنْد كَارترَايت، كَارترَايت)
