# ── المرحلة ١: المراجعة والتوليد (أعمى — بدون لمّات) ──────────
stage1_review:
  assessment:
    concerns:
      - "POS خاطئ: المجموعة مصنَّفة (n) وهي في الحقيقة علم شخص (proper_noun)."
      - "اللمّة «بوش» وحدها مبهمة: تشترك مع كلمة عربية فصيحة تعني الجماعة المختلطة (بَوْشٌ) وتشترك كذلك مع أسماء شخصيات أمريكية أشهر (جورج بوش الأب والابن)، مما يُفقد التحديد."
      - "التشكيل غائب عن اللمّتين رغم أن التعريب الكامل يقتضي ضبطاً."
      - "التعريف الحالي وصفي وظيفي لكنه لا يُحيل إلى الإسهام العلمي الأبرز (محلل التفاضل — Differential Analyzer) بمصطلحه الأدق."
    observations: >
      هذه المجموعة علم شخص لـ«فانيفار بوش» (Vannevar Bush)، المهندس الكهربائي الأمريكي
      (1890-1974)، الذي أسهم في بناء محلل التفاضل التناظري وقاد برنامج البحث العلمي
      الأمريكي في الحرب العالمية الثانية عبر مكتب البحث والتطوير العلمي (OSRD).
      يحتوي التعريف العربي على المعلومات الجوهرية ويُعدّ مقبولاً، غير أن وجود «بوش»
      دون توصيف يُوقع في الاشتراك مع الكلمة العربية الفصيحة (البَوْش = الجماعة المختلطة)
      وكذلك مع أسماء رؤساء أمريكيين. الحلّ الأمثل الإبقاء على «فانيفار بوش» فقط
      بوصفها اللمّة المُعرِّفة الكاملة، وتصحيح POS إلى proper_noun.

  blind_candidates:
    - lemma: "فانيفار بوش"
      generation_method: taarib
      justification: >
        تعريبٌ مباشر لـ«Vannevar Bush»؛ الجزء الأول «فانيفار» تعريب لـ«Vannevar» والثاني
        «بوش» تعريب لـ«Bush». الاسم الكامل يرفع الإبهام عن مجرد اللقب. التعريب وفق
        قواعد المعيار العربي الصوتي: V→ف، ee→ي، ar→ار.
    - lemma: "فانيڤار بوش"
      generation_method: taarib
      justification: >
        تعريب بديل يستخدم الحرف «ڤ» للتعبير عن صوت V غير الأصيل في العربية؛ مقبول في
        بعض المعاجم الحديثة والصحافة المتخصصة، غير أنه أقل شيوعاً من «ف» في التعريب
        الأكاديمي العربي الرسمي.
    - lemma: "فانيفر بوش"
      generation_method: taarib
      justification: >
        تعريب مختصر بحذف المدّة الوسطى في «فانيفار»، يُحاكي بعض الضبط الصوتي المختزل
        المعتمد في ترجمات المصادر الأكاديمية العربية للأسماء الأجنبية ذات المقاطع الكثيرة.
    - lemma: "بوش"
      generation_method: taarib
      justification: >
        اللقب وحده تعريبٌ مبسَّط لـ«Bush». مشكلته التصادم التام مع الكلمة العربية الفصيحة
        «البَوْشُ» (الجماعة المختلطة من قبائل شتى) الواردة في الصحاح ولسان العرب
        والمقاييس، فضلاً عن اشتراكه مع أسماء شخصيات أشهر. لا يُوصى به منفرداً.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: استُعلمت قاعدة البيانات بـ 3 استعلامات:
  # (1) مطابقة دفعية لجميع اللمّات والمرشحات
  # (2) جسر إنجليزي لـ Bush / Vannevar Bush / analogue computer
  # (3) FTS بالكلمات المفتاحية: مهندس كهربائي، حاسوب تناظري، برنامج علمي

  per_lemma:

    - lemma: "بوش"
      contradicts:
        - text: >
            «البَوْشُ: الجَماعَةُ المُخْتَلِطَةُ، أو لا يكونُونَ إلاَّ من قَبَائِلَ شَتَّى،
            أو الكَثْرَةُ من الناسِ... والبَوْشِيُّ: الفَقِيرُ المُعِيلُ، ومَنْ هو مِن
            خُمَّان الناسِ ودَهْمائهِمْ.»
          source: "القاموس المحيط للفيروزآبادي"
          conflict: >
            «بوش» لفظ عربي فصيح بمعنى الجماعة المختلطة، لا صلة له بالعلَم الشخصي
            الأمريكي. استخدامه لمّةً تعريبية دون تمييز يُوقع في تداخل دلالي حاد.
        - text: >
            «(بَوْشٌ) الْبَاءُ وَالْوَاوُ وَالشِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّجَمُّعُ
            مِنْ أَصْنَافٍ مُخْتَلِفِينَ. يُقَالُ: بَوْشٌ بَائِشٌ، وَلَيْسَ هُوَ عِنْدَنَا
            مِنْ صَمِيمِ كَلَامِ الْعَرَبِ.»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          conflict: >
            ابن فارس نفسه يستدرك بأنه ليس من صميم كلام العرب، مما يشير إلى أصل غير عربي
            صرف للكلمة. رغم ذلك فهي مُعجمة ولها دلالة مغايرة تماماً للعلَم الشخصي.
        - text: >
            «البَوْشُ: الجَمَاعَةُ الكثيرةُ في كثرةٍ واختلاط والغوغاء. (ج) أبواش وأوباش
            (على القلب)»
          source: "المعجم الوسيط لمجمع اللغة العربية بالقاهرة"
          conflict: >
            التوثيق الحديث يُثبّت المعنى العربي للكلمة في المعجم الوسيط المعياري، مما
            يُعزز الإشكالية.

    - lemma: "فانيفار بوش"
      evidence_status: "no_material_found"
      # لا يوجد في قاعدة البيانات أي مدخل معجمي يذكر «فانيفار بوش» بوصفه علَماً شخصياً.
      # الجسر الإنجليزي لـ «Vannevar Bush» لم يُسفر عن نتائج في ARABTERM أو المعاجم.

    - lemma: "فانيفار بوش"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "فانيڤار بوش"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "فانيفر بوش"
      source: stage1
      evidence_status: "no_material_found"

    # ── شاهد سياقي مفيد (حاسوب تناظري) ──
    # وُجد في ARABTERM توثيق للمصطلح المُستخدَم في التعريف:
    # «حَاسُوبٌ تَنَاظُريّ» (translation_en: analog computer)
    # المعجم الموحد لمصطلحات تقانة المعلومات (2011)
    # هذا يُقرّ استخدام «تناظري» في التعريف.


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "بوش"
      decision: removed
      decision_reason: >
        «بوش» لفظٌ عربي فصيح موثَّق في عشرات المعاجم من الصحاح إلى المعجم الوسيط
        بمعنى «الجماعة المختلطة من قبائل شتى». استخدامه لمّةً لعلَم شخص أجنبي بعينه
        يُحدث تعارضاً دلالياً حاداً. علاوةً على ذلك فإن اللقب وحده يشترك مع عائلة بوش
        الرئاسية الأمريكية (جورج بوش الأب والابن)، مما يجعله غير محدِّد لفانيفار بوش.
        الحلّ: يُحذف الربط بهذه المجموعة (remove_sense)، واللمّة الكاملة «فانيفار بوش»
        تؤدي الغرض دون التباس.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فانيفار بوش"
      decision: confirmed
      decision_reason: >
        «فانيفار بوش» هي الصورة التعريبية الكاملة والمُعرِّفة لـ Vannevar Bush. تجمع
        بين الاسم الشخصي واللقب فتُعيّن الشخص تعييناً لا لبس فيه. التعريب وفق القواعد
        الصوتية المعتمدة: V→ف، Vannevar→فانيفار، Bush→بوش. لا وجود في المعاجم يُؤكدها
        أو يعارضها بوصفها علَماً شخصياً، وهذا متوقع لأعلام الأشخاص الأجانب. تجتاز
        اختبار التثبيت المعجمي بوصفها تعبيراً مُعرِّفاً ثابتاً لشخصية تاريخية واحدة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة، فلا ترادف يستلزم تمييزاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فانيفار بوش"

    - lemma: "فانيڤار بوش"
      source: stage1
      decision: removed
      decision_reason: >
        الحرف «ڤ» غير مُعياري في التعريب الأكاديمي العربي الرسمي لهذا الاسم؛ معظم
        المصادر العربية المتخصصة تكتبه «فانيفار» بالفاء. غياب الأدلة المعجمية يُرجّح
        عدم الإضافة تجنباً للتشتت.

    - lemma: "فانيفر بوش"
      source: stage1
      decision: removed
      decision_reason: >
        الاختصار الصوتي غير موثَّق ولا يُضيف قيمة معجمية. الصورة الكاملة «فانيفار بوش»
        أولى.

    - lemma: "بوش"
      source: stage1
      decision: removed
      decision_reason: >
        مكرَّر مع اللمّة الموجودة المرفوضة أعلاه. اللقب وحده غير مُحدِّد.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "مهندس كهربائي أمريكي صمم حاسوباً تناظرياً مبكراً وقاد البرنامج العلمي للولايات المتحدة خلال الحرب العالمية الثانية (1890-1974)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في جوهره لكنه يستحق تحسينَيْن: (أ) استبدال «حاسوباً تناظرياً»
        بالمصطلح الأدق «محلل التفاضل التناظري» (Differential Analyzer) الذي بناه بوش فعلاً،
        (ب) الإشارة إلى مكتب البحث والتطوير العلمي (OSRD) الذي قاده، لتكون المعلومة التاريخية
        أدق، (ج) إضافة تعريف موسوعي مستقل يليق بالأعلام.
    authored:
      - type: encyclopedic
        text: >
          فانيفار بوش (1890-1974): مهندسٌ كهربائي أمريكي، بنى في ثلاثينيات القرن العشرين
          محلَّل التفاضل التناظري أحد أوائل الحواسيب التناظرية الكبرى. قاد خلال الحرب
          العالمية الثانية مكتبَ البحث والتطوير العلمي (OSRD) الذي أشرف على المشاريع
          العلمية العسكرية الأمريكية بما فيها مراحل من مشروع مانهاتن. وضع عام 1945م مقالته
          الشهيرة «كما قد نُفكِّر» (As We May Think) التي تُعدّ بذرةً للفكر المعلوماتي
          وشبكة الويب لاحقاً.
