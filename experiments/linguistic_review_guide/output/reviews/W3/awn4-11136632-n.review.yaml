        صورة صوتية غير مستقرة تُحاكي النطق الإنجليزي دون سند معجمي عربي. التراث
        العربي يُرسّخ "صَمُوئِيل" (من العبرية شَمُوئِيل) بدلاً من "سَامُوئِيل"،
