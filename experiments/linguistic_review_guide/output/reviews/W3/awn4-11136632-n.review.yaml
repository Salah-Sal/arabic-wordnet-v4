# Samuel Pierpont Langley — فلكي ورائد طيران أمريكي (1834-1906)
# ══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل، وهو إلزامي للأسماء الأعجمية المُعرَّبة."
      - "لمّة 'لانغلي' وحدها مُبهمة: تشترك بين صَمُوئِيلُ لَانْغْلِي (فلكي، 1834-1906) وجون نيوبورت لانغلي (عالِم أعصاب، 1852-1925)؛ فضلاً عن كونها وحدةَ قياس إشعاع شمسي مسمّاة باسمه."
      - "الاسم الرسمي الثلاثي 'صَمُوئِيلُ بِيرْبُونْتُ لَانْغْلِي' غائب عن اللمّات، وهو مذكور في OEWN."
      - "هجاء الاسم الأول 'صمويل' يعكس صورة ثانوية؛ الصورة المعتمدة كلاسيكياً هي 'صَمُوئِيل' (كما في سفر صموئيل)."
      - "تعريف المجموعة يستخدم 'البولومتر' بصيغة معرَّبة دون إشارة تفسيرية، وإن كان له مدخله المستقل في AWN."
    observations: >
      هذه المجموعة اسمُ عَلَمٍ لشخصية علمية غربية تاريخية. الأسلوب الوحيد الصالح
      لتوليد اللمّات هو التعريب (النقل الصوتي)، إذ لا مجال للاشتقاق أو المجاز أو
      التركيب في أسماء الأعلام. ويجب أن تعكس اللمّات الاسمَ الثنائي الشائع، والثلاثي
      الرسمي، والاسم الأخير المنفرد كما شاع في المعاجم التقنية العربية. وحدة القياس
      "لانغلي" المشتقة من اسمه تؤكد حضور هذا النقل الصوتي في المصادر العربية.
  blind_candidates:
    - lemma: "صَمُوئِيلُ لَانْغْلِي"
      generation_method: taarib
      justification: >
        النقل الصوتي للاسم الثنائي Samuel Langley؛ "صَمُوئِيل" الصورة المعتمدة
        للاسم العبري الأصل (شموئيل) في التراث العربي والترجمات التاريخية.
    - lemma: "سَامُوئِيلُ لَانْغْلِي"
      generation_method: taarib
      justification: >
        نقل صوتي بديل يُحاكي النطق الإنجليزي لـ Samuel بصورة أقرب للتعريب الحديث،
        غير أنه أقل استقراراً من الصورة الكلاسيكية "صَمُوئِيل".
    - lemma: "لَانْغْلِي"
      generation_method: taarib
      justification: >
        الاسم الأخير منفرداً؛ الشكل الذي اعتمدته المعاجم التقنية العربية لوحدة
        قياس الإشعاع الشمسي المسمّاة باسمه (langley)، وهو شائع في السياق العلمي.
    - lemma: "صَمُوئِيلُ بِيرْبُونْتُ لَانْغْلِي"
      generation_method: taarib
      justification: >
        النقل الصوتي للاسم الرسمي الثلاثي الكامل Samuel Pierpont Langley؛
        ضروري للتوثيق الأكاديمي والمراجع العلمية الرسمية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1: مطابقة دقيقة دفعية — headword_norm للمّات الموجودة والمرشحات
#   Q2: جسر إنجليزي — translation_en: Langley / bolometer / Samuel Langley
#
# النتائج الرئيسية:
#   - entry_id 932403: "صمويل" (معجم أسماء)
#   - entry_id 467626: "لانغلي" وحدة قياس إشعاع، استشعار عن بعد
#   - entry_id 381886: "لانجلي" وحدة قياس، طاقة متجددة
#   - entry_id 697594: "اللّانغلي: وحدة لقياس الإشعاع الشمسي"
#   - عدة مداخل "بولومتر" بترجمات تقنية متعددة
#   - مداخل طبية تخص جون نيوبورت لانغلي (شخص مختلف)
stage2_evidence:
  per_lemma:
    - lemma: "صمويل لانغلي"
      expands:
        - text: "«صمويل: عن العبرية شموئيل بمعنى اسم الرب. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يؤكد أن "صمويل" صورةٌ واردة في المعجمية العربية للاسم العبري الأصل،
            وأن الصورة الأصح لغةً هي "صَمُوئِيل".
        - text: "«صمويل: إحدى صور صموئيل. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            صريح في أن "صمويل" صورة ثانوية، و"صموئيل" هو الشكل الأصيل الموثَّق.
        - text: "«لانغلي: واحدة قياس شدة الإضاءة وتساوي 4.184 مضروب 10 أس 4 جول/متر مربع»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          addition: >
            وحدة القياس "لانغلي" مسمّاة بصراحة نسبةً إلى صاحبها؛ يثبت أن النقل
            الصوتي "لانغلي" راسخٌ في المعجمية التقنية العربية.
        - text: "«اللّانغلي: وحدة لقياس الإشعاع الشمسي.»"
          source: "المورد الحديث (2008)"
          addition: >
            يؤكد الاستخدام المعجمي لـ"لانغلي" (مع ال-) دلالةً على وحدة القياس
            المسمّاة باسم صَمُوئِيل لَانْغْلِي.

    - lemma: "لانغلي"
      expands:
        - text: "«لانغلي: واحدة قياس شدة الإضاءة وتساوي 4.184 مضروب 10 أس 4 جول/متر مربع»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          addition: >
            يثبت تثبيت "لانغلي" (بالغين) صورةً صوتية للاسم في معاجم تقنية عربية
            رسمية صادرة عن منظمات دولية.
        - text: "«اللّانغلي: وحدة لقياس الإشعاع الشمسي.»"
          source: "المورد الحديث (2008)"
          addition: >
            المعجم الحديث يُدرج "اللانغلي" (مع ال-) بوصفه وحدة قياس مستقلة، مما
            يعكس رسوخ الاسم في المصادر العربية المعاصرة.
      contradicts:
        - text: "«لانجلي: وحدة قياس الإشعاعية الشمسية. ويساوي الواحد لانجلي 85.93 كيلوواط ساعة لكل متر مربع.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: >
            يستخدم "لانجلي" بالجيم بدلاً من الغين؛ وهو تهجئة بديلة واردة في معاجم
            رسمية أخرى، مما يُظهر عدم اتساق الهجاء العربي لهذا الاسم.

    - lemma: "صَمُوئِيلُ لَانْغْلِي"
      evidence_status: "no_material_found"

    - lemma: "سَامُوئِيلُ لَانْغْلِي"
      evidence_status: "no_material_found"

    - lemma: "صَمُوئِيلُ بِيرْبُونْتُ لَانْغْلِي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ١ ──
    - lemma: "صمويل لانغلي"
      decision: confirmed
      decision_reason: >
        الاسم الثنائي (الأول + الأخير) مُستخدَم في المصادر العربية ويمثّل الشكل
        الأكثر شيوعاً لهذه الشخصية. يحتاج تصحيح الهجاء من "صمويل" إلى الصورة
        الأصيلة "صَمُوئِيل"، وإضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الثنائي الشائع في المصادر العربية العامة؛ يُستخدم حين يكفي الاسمُ
        الأول والأخير للتعريف، ويختلف عن اللمّة الثلاثية بغياب الاسم الأوسط،
        وعن الاسم الأخير المنفرد بتحديد أكبر وانتفاء الالتباس مع أعلام أخرى.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَمُوئِيلُ لَانْغْلِي"

    # ── لمّة موجودة ٢ ──
    - lemma: "لانغلي"
      decision: confirmed
      decision_reason: >
        الاسم الأخير المنفرد ثابتٌ في المعجمية التقنية العربية (معجم الاستشعار عن
        بعد، المورد الحديث) بوصفه الصيغة الرسمية لوحدة القياس المسمّاة باسمه.
        الإبهامُ المحتمل مع جون نيوبورت لانغلي يُعالَج بالسياق ولا يستوجب الحذف.
        يحتاج تشكيلاً كاملاً وإضافة صيغة "لانجلي" شكلاً بديلاً موثَّقاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم الأخير المجرّد؛ يُستخدم في السياق التقني والعلمي حيث يكون المقصود
        واضحاً (وحدة القياس، الإحالات المرجعية)، ويختلف عن الاسمَين الثنائي
        والثلاثي بأنه الأقصر والأكثر مرونةً في التداول التقني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَانْغْلِي"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "لَانْجِلِي"

    # ── مرشح المرحلة ١ — مقبول ──
    - lemma: "صَمُوئِيلُ بِيرْبُونْتُ لَانْغْلِي"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الثلاثي الكامل المُثبَت في OEWN (Samuel Pierpont Langley)؛
        ضروري للتوثيق الأكاديمي والمراجع العلمية الرسمية وقواميس التراجم. إدراجه
        يُكمل منظومة تمثيل الاسم (ثلاثي كامل / ثنائي شائع / أخير مجرد).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الثلاثي الكامل؛ الأعلى تحديداً والأكثر رسمية، يُستخدم في
        المراجع الأكاديمية وقواميس التراجم والوثائق الرسمية، ويتميز بإدراج
        الاسم الأوسط "بِيرْبُونْت" غير الوارد في اللمّتين الأخريين.
      actions:
