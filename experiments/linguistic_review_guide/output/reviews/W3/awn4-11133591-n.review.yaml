# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مصمم رقصات مجري طور نظام تدوين الحركة المسمى لابانوتيشن (1879-1958)"
    assessment:
      decision: revise
      reason: >
        التعريف يخلو من التشكيل الكامل؛ «مجري» تحتاج إلى «مَجَرِيّ»، و«طور» تحتاج
        إلى «طَوَّرَ»، كما أن «لابانوتيشن» صياغة غير موحَّدة يُستحسن استبدالها
        بما يُوضِّح طبيعة النظام ويربطه بصاحبه، مع إثراء التعريف بمعلومة نوعية
        (تدوين الرقص كتخصص)
    authored:
      - type: encyclopedic
        text: >
          مُصَمِّمُ رَقَصَاتٍ مَجَرِيٌّ (1879-1958)، طَوَّرَ نِظَامًا عَالَمِيًّا
          لِتَدْوِينِ الحَرَكَةِ الرَّاقِصَةِ عُرِفَ بـ«تَدْوِينِ لابَان»
          (Labanotation)، وَأَرْسَى أُسُسَ تَحْلِيلِ الحَرَكَةِ البَشَرِيَّةِ
          فِي فَنِّ الرَّقْصِ الحَدِيثِ
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            مُصَمِّمُ رَقَصَاتٍ مَجَرِيٌّ (1879-1958)، طَوَّرَ نِظَامًا عَالَمِيًّا
