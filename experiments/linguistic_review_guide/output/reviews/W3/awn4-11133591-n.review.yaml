# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تُعبِّر عن عَلَمٍ شخصي أجنبي (مصمم رقصات مجري)؛ جميع اللمّات المتوقعة ستكون تعريباً لأشكال الاسم، لا توليداً من الجذر العربي"
      - "التعريف الحالي يخلو من التشكيل: «مجري» يجب أن تكون «مَجَرِيّ»"
      - "«لابانوتيشن» في التعريف صياغة غير موحَّدة لاسم نظام التدوين؛ يُستحسن إعادة صياغتها"
      - "اللمّة «لابان» قد تُوهم بالاشتراك اللفظي مع الجذر العربي (لبن = اللبن المشروب) رغم انعدام الصلة الدلالية"
    observations: >
      المجموعة الترادفية تُعرِّف بشخصية تاريخية بعينها (مصمم رقصات مجري طوّر نظام تدوين الحركة
      بين 1879 و1958). المفهوم علَمٌ شخصي خالص، لا مجال فيه لتوليد مصطلح عربي أصيل عبر الاشتقاق
      أو المجاز أو التركيب؛ إذ لا يُعبَّر عن الأعلام الشخصية الأجنبية إلا بالتعريب (النقل الصوتي).
      تكمن قيمة المراجعة هنا في ضبط أشكال التعريب وتوحيدها، وتحسين التعريف العربي.

  blind_candidates:
    - lemma: "لابَان"
      generation_method: taarib
      justification: >
        اللقب المختصر للشخص المستنتَج من تسمية النظام «لابانوتيشن»؛ أبسط صيغة
        تعريب ممكنة، ومألوفة في المراجع الأكاديمية العربية للإشارة السريعة
    - lemma: "رُودُولف لابَان"
      generation_method: taarib
      justification: >
        الاسم الأول مضافاً إليه اللقب بدون حرف النسبة الألماني (von)؛ صيغة
        شائعة في بعض المراجع العربية حين يُراد الإشارة إلى الشخص باسمه الثنائي
        دون التأكيد على نسبته الأرستقراطية
    - lemma: "رُودُولف فُون لابَان"
      generation_method: taarib
      justification: >
        الاسم الكامل مع تعريب حرف النسبة الألماني (von → فُون)؛ الصيغة الرسمية
        الأكاديمية المعتمدة في أغلب المصادر العربية الموثِّقة لهذا الشخص
    - lemma: "رُودُولف فان لابَان"
      generation_method: taarib
      justification: >
        صيغة تعريب بديلة تنقل (von) بالفاء والألف (فان) كما يرد في بعض المراجع
        العربية التي تخلط بين «von» الألمانية و«van» الهولندية؛ مُدرَجة للاختبار


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفَّذة:
#   Q1 — مطابقة دقيقة دفعية: رودولف فون لابان / لابان / رودولف لابان / رودولف فان لابان (+ ال- لكل منها)
#   Q2 — جسر إنجليزي: "Rudolf von Laban" OR "Laban" OR "Rudolph Laban" OR "Labanotation" OR "choreographer"
#   Q3 — FTS عربي: "تدوين الحركة" OR "لابانوتيشن" OR "لابان" OR "تدوين الرقص"
#   Q4 — مقاييس اللغة: جذور لبن / رقص / دون / حرك
stage2_evidence:
  per_lemma:
    - lemma: "رودولف فون لابان"
      evidence_status: "no_material_found"

    - lemma: "لابان"
      contradicts:
        - text: "«لَبَنَ: اللَّامُ وَالْبَاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَتَفَرَّعُ مِنْهُ كَلِمَاتٌ، وَهُوَ اللَّبَنُ الْمَشْرُوبُ. يُقَالُ: لَبِنْتُهُ أَلْبِنُهُ، إِذَا سَقَيْتَهُ اللَّبَنَ»"
          source: "مقاييس اللغة — ابن فارس (dictionary_id=151)"
          conflict: >
            الجذر (لبن) في المعاجم العربية يدل على اللبن المشروب وما يتفرع منه؛
            لا علاقة له بالعَلَم الشخصي «لابان» الذي هو اسم أجنبي مُعرَّب
            تعريباً صوتياً بحتاً من المجرية/الألمانية
        - text: "«لبن رايب في بلاد الشام ولبن زبادي في مصر، كما يدعى يوغرت بالتركية، وهو ناتج تخمير الحليب بأنواع من البكتيريا أهمها lactobacillus»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM"
          conflict: >
            المدخل يدل على منتج غذائي (اللبن/الزبادي)، لا صلة له بالكوريغراف
            المجري رودولف فون لابان. التشابه صوتي عَرَضي

    - lemma: "رُودُولف لابَان"
      evidence_status: "no_material_found"

    - lemma: "رُودُولف فُون لابَان"
      evidence_status: "no_material_found"

    - lemma: "رُودُولف فان لابَان"
      evidence_status: "no_material_found"

  # شاهد سياقي مفيد وجد في القاعدة (غير مباشر):
  context_note: >
    الجسر الإنجليزي أعطى مدخلاً وحيداً ذا صلة:
    «مُصَمِّم الرَّقَصات» بوصفه ترجمة لـ choreographer في المورد الحديث (2008)،
    وهو ما يؤكد صحة صياغة التعريف الحالي في وصف الشخص، وإن احتاج إلى تحسين.


