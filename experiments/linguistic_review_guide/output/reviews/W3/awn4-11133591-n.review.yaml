        للصيغة الإنجليزية الثانية «Laban». الاشتراك الصوتي مع الجذر العربي (لبن)
        عَرَضي وغير مُشكِل في السياق المتخصص في فن الرقص. يحتاج إلى تشكيل: لابَان
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب وحده مختصراً؛ يُستخدم في الإشارات السريعة وسياقات الحديث المتخصص
        حين يُفهم الشخص من السياق دون حاجة إلى الاسم الكامل
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لابَان"

    - lemma: "رُودُولف لابَان"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل الصيغة الإنجليزية الثالثة الموجودة في المجموعة «Rudolph Laban»
        التي لم تُغطَّ حتى الآن بلمّة عربية في AWN4. الصيغة بدون «فون» شائعة
        في بعض المراجع العربية التي تُورد الاسم ثنائياً دون التأكيد على النسبة
        الأرستقراطية؛ إضافتها تُثري التغطية وتتوافق مع التنوع في المصادر الإنجليزية
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        صيغة وسطى تجمع الاسم الأول واللقب دون الإشارة إلى النسبة الأرستقراطية؛
        تُوازي الاستخدام الإنجليزي «Rudolph Laban» وتُناسب السياقات التي تُعرِّف
        بالشخص دون التشديد على لقبه النبيل
      actions:
