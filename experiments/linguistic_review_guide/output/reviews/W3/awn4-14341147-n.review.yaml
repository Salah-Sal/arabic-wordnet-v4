# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14341147-n
# intumescence / intumescency — انتفاخ بالدم أو السوائل
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «توزم» لا علاقة لها بالانتفاخ الطبي؛ فهي في المعجم الوسيط بمعنى «اشتدَّ وطْؤُه» من جذر وزم الدالّ على الأكل والوطء الشديد"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية ويحتاج إعادة صياغة بأسلوب معجمي عربي"
      - "المجموعة تفتقر إلى المصطلح الطبي الدقيق «انتباج» المعتمد في المعجم الطبي الموحد مقابل intumescence"
    observations: "المفهوم طبي يدل على تورم النسيج بسبب احتقان الدم أو السوائل. الانتفاخ لفظ عام يصلح جنساً قريباً لكنه ليس المصطلح التخصصي. المصطلح الطبي العربي المعتمد هو «انتباج» كما في المعجم الطبي الموحد والمعجم الموحد لعلم التشريح العياني. أما «توزم» فهي خطأ واضح؛ إذ الجذر «وزم» لا يتصل بالانتفاخ البتة."
  blind_candidates:
    - lemma: "تَوَذُّم"
      generation_method: ishtiqaq
      justification: "من جذر «وذم»، والوَذَمة مصطلح طبي للوَرَم المائي، على وزن تَفَعُّل الدال على التحوّل التدريجي"
    - lemma: "اِنْتِبَاج"
      generation_method: ishtiqaq
      justification: "من جذر «نبج» على وزن انفعال/افتعال، والنَّبْج يدل على الارتفاع والنتوء، فالانتباج هو التورم والبروز"
    - lemma: "تَوَرُّم احْتِقَانِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يجمع بين التورم والاحتقان لتحديد نوع الانتفاخ الناتج عن تجمع الدم والسوائل"
    - lemma: "تَنَفُّخ"
      generation_method: ishtiqaq
      justification: "من جذر «نفخ» على وزن تَفَعُّل، يدل على حصول الانتفاخ تدريجياً في الأنسجة"

stage2_evidence:
  per_lemma:
    - lemma: "اِنْتِفَاخ"
      confirm:
        - text: "«خاصية الانتفاخ بالتسخين بسبب انطلاق غازات»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«حالة من التضخم أو التوسع أو الانتفاخ.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«(1) انتفاخ؛ تضخُّم (2) شيء منتفخ.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«النُّونُ وَالْفَاءُ وَالْخَاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْتِفَاخٍ وَعُلُوٍّ. مِنْهُ انْتَفَخَ الشَّيْءُ انْتِفَاخًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "تأصيل الجذر نفخ بمعنى الانتفاخ والعلو"

    - lemma: "تَوَزُّم"
      contradicts:
        - text: "«اشتدَّ وطْؤُه»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي هو شدة الوطء لا الانتفاخ أو التورم"
        - text: "«الْوَاوُ وَالزَّاءُ وَالْمِيمُ: بِنَاءٌ أَيْضًا عَلَى غَيْرِ قِيَاسٍ... فَالْوَزْمَةُ أَنْ يَأْكُلَ الرَّجُلُ مَرَّةً وَاحِدَةً كَالْوَجْبَةِ... وَالْمُتَوَزِّمُ: الشَّدِيدُ الْوَطْءِ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "جذر وزم لا يتصل بالانتفاخ في أي معجم عربي قديم أو حديث"

    - lemma: "تَوَذُّم"
      contradicts:
        - text: "«edematization»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "التوذم مصطلح للوذمة (edema) وهي تجمع السوائل في الأنسجة، وليس الانتفاخ الاحتقاني (intumescence)"
      expands:
        - text: "«وذم: ورم قرب الشرج، سعدانة (اصطلاح طبي)»"
          source: "تكملة المعاجم العربية لدوزي"
          addition: "الوذم في الاستعمال الطبي القديم نوع خاص من الورم لا يطابق المفهوم المطلوب"

    - lemma: "اِنْتِبَاج"
      confirm:
        - text: "«intumescence»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَوَرُّم عاديّ أو غير عاديّ - ناتئ الورم.»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
      expands:
        - text: "«النُّونُ وَالْبَاءُ وَالْجِيمُ. يَقُولُونَ: النَّبَّاجُ: الرَّفِيعُ [الصَّوْتِ]، وَهِيَ كَلِمَةٌ وَاحِدَةٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر نبج في الأصل للصوت المرتفع، ثم توسع دلالياً إلى النتوء والبروز في الاستعمال الطبي"

    - lemma: "تَوَرُّم اِحْتِقَانِيّ"
      evidence_status: "no_material_found"

    - lemma: "تَنَفُّخ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "اِنْتِفَاخ"
      decision: confirmed
      decision_reason: "لفظ عربي فصيح راسخ من جذر «نفخ» الدال أصالةً على الانتفاخ والعلو كما في مقاييس اللغة. مسجّل في المعجم الموحد للجيولوجيا مقابل intumescence تحديداً، وفي معاجم طبية عديدة مقابل swelling وdistention."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ عام يدل على الانتفاخ بجميع أنواعه ولا يختص بالسوائل أو الدم، يصلح لسائر المجالات العلمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْتِفَاخ"

    - lemma: "تَوَزُّم"
      decision: removed
      decision_reason: "خطأ معجمي صريح. تَوَزَّمَ في المعجم الوسيط ومقاييس اللغة بمعنى «اشتدَّ وطْؤُه» أي الوطء الشديد، ولا علاقة له بالانتفاخ أو التورم إطلاقاً. جذر وزم يدور حول الأكل مرة واحدة وحزمة البقل واللحم المجفف."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اِنْتِبَاج"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الطبي العربي المعتمد في المعجم الطبي الموحد (2009) والمعجم الموحد لعلم التشريح العياني (2015) مقابل intumescence تحديداً. معرّف بأنه «تَوَرُّم عاديّ أو غير عاديّ - ناتئ الورم». على وزن انفعال من نبج."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح طبي تخصصي يدل على التورم البارز والنتوء، أدق من «انتفاخ» العام، وهو المقابل المعتمد رسمياً لـ intumescence"
      actions:
        - command: create_entry
          params: {lemma: "اِنْتِبَاج", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَوَذُّم"
      source: stage1
      decision: removed
      decision_reason: "التوذم مصطلح طبي يقابل edematization (الوَذَمة) وهو تجمع السوائل في الأنسجة الخلالية، ولا يقابل intumescence الذي يعني الانتفاخ الاحتقاني العام بالدم أو السوائل. مفهومان مختلفان."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "تَوَرُّم اِحْتِقَانِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر وليس مصطلحاً مسكوكاً. لم يُعثر عليه في أي معجم. يمكن إبدال «احتقاني» بـ«دموي» مثلاً ويبقى صالحاً كوصف، مما يخفق في اختبار السكّ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تَنَفُّخ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي لاستعمال «تنفخ» كمصطلح طبي أو علمي. اللفظ الشائع من هذا الجذر هو «انتفاخ» وهو موجود بالفعل في المجموعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

