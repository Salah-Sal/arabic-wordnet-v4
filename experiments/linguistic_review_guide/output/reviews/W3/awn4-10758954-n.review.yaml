# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية «خبير يونكس» خالية من التشكيل"
      - "التعريف العربي «خبير في نظام التشغيل يونكس» يُكرِّر كلمة «خبير» الواردة في اللمّة ذاتها، مما يُوقع في الدوران"
      - "المجموعة أحادية اللمّة رغم وجود مصطلحات أخرى مستخدمة للمفهوم ذاته في معاجم المعلوماتية العربية"
    observations: >
      المجموعة تُمثِّل مفهوماً تقنياً متخصصاً هو «خبير نظام التشغيل يونكس» (UNIX guru)،
      وهو فئة فرعية من المجموعة الأبوية «خبير حاسوب» (awn4-09970396-n).
      «يونكس» تعريبٌ مستقر لاسم النظام UNIX في المعجمية التقنية العربية.
      نمط التركيب الإضافي (خبير + اسم النظام) شائع في المعاجم التقنية الموحَّدة، كـ«خبير أخشاب»
      و«خبير تسويق» و«خبير تخطيط». اللمّة صحيحة بنيوياً لكنها تحتاج تشكيلاً وإثراءً.

  blind_candidates:
    - lemma: "حُجَّةُ يُونِكْس"
      generation_method: tarkib
      justification: >
        تركيبٌ إضافي يستخدم «حُجَّة» بمعنى السلطةِ العلمية المرجعية (مجاز عن الدليل القاطع)
        ليدلَّ على بالغ الخبرة الذي يُرجَع إليه في مسائل نظام يونكس.
    - lemma: "مُتَمَرِّسٌ يُونِكْسِيّ"
      generation_method: ishtiqaq
      justification: >
        مُشتقٌّ من الجذر (م-ر-س) على وزن مُتَفَعِّل بمعنى المتدرِّب المتمكِّن، مع نسبة
        يُونِكْسِيّ للدلالة على تخصُّصه في هذا النظام تحديداً.
    - lemma: "حَاذِقُ يُونِكْس"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «حَاذِق» (الماهر المتمكِّن من صنعته) + «يونكس». الحاذق في التراث
        العربي هو من يَقطع الأمر ولا يَدَع فيه مُتَعَلَّقاً، وهو توصيفٌ دقيق لخبير يُونِكْس.
    - lemma: "مُحْتَرِفُ يُونِكْس"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُحْتَرِف» (من اتَّخذ من شيء حرفةً ومهنة) + «يونكس»، للدلالة
        على من يتقن نظام يونكس إتقاناً احترافياً.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
