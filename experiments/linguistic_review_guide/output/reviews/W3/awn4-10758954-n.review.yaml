  per_lemma:

    - lemma: "خبير يونكس"
      confirm:
        - text: >
            «خبير — بالآثار والفنون» ترجمته الإنجليزية: connoisseur
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
        - text: >
            «خبير» ترجمته الإنجليزية: expert; competent person; skilled person
          source: "موسوعة الكهرباء (IEC 60050) — ARABTERM"
        - text: >
            «(الْخَبِيرُ) اسمٌ مِن أسماءِ اللهِ عَزَّ وَجَلَّ: الْعَالِمُ بِما كَانَ وَبِما يَكُونُ.
            ذُو الْخِبْرَةِ الَّذِي يُخْبِرُ الشَّيْءَ بِعِلْمِهِ»
          source: "المعجم الوسيط — OCR"
        - text: >
            «خبير أخشاب» → timber expert؛ «خبير حسابي» → actuary؛
            «خبير تسويق» → marketing expert؛ «خبير صحي» → hygienist
          source: "المعاجم الموحَّدة (ALECSO) — ARABTERM — نماذج متعددة"
      expands:
        - text: >
            «مَنْ أعلمُ الناسِ بالرجلِ: صاحبُه ومخالطُه. الرئيسُ. المُخْبِرُ. الإدامُ —
            الطعامُ المأدومُ من اللحمِ وغيرِه. الأكَّار (الحرَّاث)»
          source: "المعجم الكبير — OCR"
          addition: >
            يكشف أنَّ «خبير» في أصل اللغة يدلُّ على عمق المعرفة والمخالطة، لا مجرد الإلمام السطحي،
            مما يُقوِّي ملاءمته للدلالة على «guru» بمعنى المرجعية العميقة.

    - lemma: "عرّاف يونكس"
      confirm:
        - text: >
            «عرّاف UNIX: مبرمجُ UNIX ذو خبرةٍ ومقدرةٍ على تقديمِ المساعدة.
            تَستخدِمُ بعضُ الشركاتِ هذه العبارةَ كاسمِ وظيفة.
            يمكِن الرجوعُ إلى المجموعةِ الأخبارية comp.unix.wizards للإجابةِ عن
            أسئلةِ المستخدِمين حول الموضوع.» ترجمته: UNIX wizard
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
      expands:
        - text: >
            «الْعَيْنُ وَالرَّاءُ وَالْفَاءُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَتَابُعِ الشَّيْءِ
            مُتَّصِلًا بَعْضُهُ بِبَعْضٍ، وَالآخَرُ عَلَى السُّكُونِ وَالطُّمَأْنِينَةِ.
            [وَمِنْهُ] الْمَعْرِفَةُ وَالْعِرْفَانُ [...] وَأَمَّا الْعَرِيفُ فَقَالَ الْخَلِيلُ:
            هُوَ الْقَيِّمُ بِأَمْرِ قَوْمٍ قَدْ عَرَفَ عَلَيْهِمْ»
          source: "مقاييس اللغة — ابن فارس (توفي 395هـ)"
          addition: >
            الجذر عرف يدلُّ أصلاً على الاطمئنان والإدراك الشامل، والعريفُ هو القيِّمُ بشؤون
            قومه — توصيفٌ يُعزِّز استخدام «عرّاف» دلالةً على المرجع التقني الموثوق.

    - lemma: "حُجَّةُ يُونِكْس"
      evidence_status: "no_material_found"

    - lemma: "مُتَمَرِّسٌ يُونِكْسِيّ"
      evidence_status: "no_material_found"

    - lemma: "حَاذِقُ يُونِكْس"
      confirm:
        - text: >
            «حَاذِق: الماهرُ والقاطع»
          source: "موسوعة السلطان قابوس لأسماء العرب — Hawramani"
        - text: >
            «الْحَاءُ وَالذَّالُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ الْقَطْعُ [...] وَمِنْ هَذَا الْقِيَاسِ
            الرَّجُلُ الْحَاذِقُ فِي صِنَاعَتِهِ، وَهُوَ الْمَاهِرُ، وَذَلِكَ أَنَّهُ يَحْذِقُ الأَمْرَ
            يَقْطَعُهُ لَا يَدَعُ فِيهِ مُتَعَلَّقًا»
          source: "مقاييس اللغة — ابن فارس"

    - lemma: "مُحْتَرِفُ يُونِكْس"
      confirm:
        - text: >
            «(الْمُحْتَرِفُ) مَنْ لَهُ حِرْفَةٌ وَصَنْعَةٌ»
          source: "المعجم الكبير — OCR"
        - text: >
            «مُحْتَرِف (فصيحة) — جاء في اللسان: الحرفةُ: اسمٌ من الاحتراف، وهو الاكتساب،
            وفي الوسيط: احترف: اتَّخذ حرفة»
          source: "معجم الصواب اللغوي — أحمد مختار عمر — Hawramani"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "خبير يونكس"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي «خبير يونكس» ثابتٌ في النمط المعجمي للمصطلحية العربية الموحَّدة (ALECSO)،
        إذ تشيع صيغة «خبير + مجال» لتوصيف المتخصصين (خبير أخشاب، خبير تسويق، خبير صحي...).
        اللمّة تجتاز اختبار التثبيت المعجمي ولا تقبل الاستبدال الحرَّ لمكوِّناتها دون تغيير المعنى.
        تحتاج إلى تحديث بالتشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُرسِّخ الطابعَ المهنيَّ الأكاديميَّ، ويُشيع في الوثائق التقنية الرسمية والسياقات
        المؤسسية، مع دلالةٍ على الخبرة المكتسبة والمُعترَف بها.
      loan_check:
        lexical_borrowing: "يونكس معرَّب من UNIX، مقبول لكونه اسم علم تقني عالمي"
        calque_check: "لا يوجد اقتراض مفهومي أعمى — التركيب الإضافي أصيل عربياً"
      quality_gate:
        ittiraad: "نعم — نمط خبير+مجال مطَّرد ومنتج"
        yusr: "نعم — سهل التداول والنطق"
        mulaaamah: "نعم — ملائم للسياق التقني"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَبِيرُ يُونِكْس"

    # ── لمّة جديدة مكتشفة من أدلة المرحلة ٢ ──
    - lemma: "عرّاف يونكس"
      source: stage2
      decision: confirmed
      decision_reason: >
        معجم مصطلحات المعلوماتية (2000) — أحد أوثق المعاجم التقنية العربية — يُثبِّت
        «عرّاف UNIX» مصطلحاً عربياً لمفهوم «UNIX wizard»، وهو مرادف دلالي وثيق
        لـ«UNIX guru» في السياق التقني الحوسبي. الجذر (عرف) يحمل دلالة المعرفة الشاملة
        العميقة (العِرفان)، والعرّافُ وزنُ فَعَّال يدلُّ على الكثرة والمبالغة في المعرفة.
        ملاحظة ثقافية: «عرّاف» في الاستخدام الكلاسيكي يُعني الكاهن أو قارئ الغيب
        وهو ذو حساسية دينية، لكنَّه في السياق التقني المعاصر — كما أثبته المعجم — يُعيد
        توظيف الكلمة بمعنى «wizard» المُجازي (الساحر في الحوسبة = الخارق في إتقانه).
        يُضاف بوصفه مرادفاً دلالياً يُبرِّز البُعد الاستثنائي للخبرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرِّز العمقَ الاستثنائيَّ للمعرفة وكأنها موهبة فطرية خارقة، يُستخدم في السياقات
        غير الرسمية والأوساط التقنية الاحترافية، ويقابل دلالة «wizard» الإنجليزية
        المتضمِّنة لمعنى الإعجاز والبراعة الفائقة.
      loan_check:
        lexical_borrowing: "يونكس معرَّب من UNIX — مقبول كاسم علم"
        calque_check: "تعبير مسكوك في معجم متخصص موثوق"
      quality_gate:
        ittiraad: "نعم — نمط فَعَّال + مجال ينتج مصطلحات راسخة"
        yusr: "نعم — سهل النطق والكتابة"
        mulaaamah: "مقبول في السياق التقني مع الحذر الثقافي"
      actions:
        - command: create_entry
          params:
            lemma: "عَرَّافُ يُونِكْس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشحات المرحلة ١ المرفوضة ──
    - lemma: "حُجَّةُ يُونِكْس"
      source: stage1
      decision: removed
      decision_reason: >
        «حُجَّة» في العربية تدلُّ أصلاً على الدليل والبرهان الإقناعي، وتُستخدم مجازاً بمعنى
        السلطة العلمية — وهي موظَّفةٌ فعلاً في تعريف المجموعة الأبوية «حجة في أجهزة الكمبيوتر
        والحوسبة»، مما يُنشئ تداخلاً هرمياً مُربِكاً. فضلاً عن ذلك، لا أدلة معجمية على
        تثبيت هذا المركب في المصطلحية التقنية.

    - lemma: "مُتَمَرِّسٌ يُونِكْسِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على تثبيت هذا التركيب. التركيب المزدوج (اسم فاعل + نسبة وصفية)
        غير مستقر معجمياً، ولا يجتاز اختبار السكِّ: يمكن إبدال «متمرِّس» بـ«ماهر» أو
        «بارع» دون أن يفقد التعبيرُ قوامَه الوصفي، دليلٌ على أنه وصفٌ حرٌّ لا مصطلح.

    - lemma: "حَاذِقُ يُونِكْس"
      source: stage1
      decision: removed
      decision_reason: >
        رغم صحة «حاذق» لغةً (الماهر المتمكِّن)، فإنَّ «guru» يتضمَّن دلالة المرجعية
        الاستثنائية وعمق المعرفة الفائق الذي يتجاوز مجرد المهارة. لا أدلة على تثبيت هذا
        المركب في المعاجم التقنية. كذلك لا يجتاز اختبار التثبيت المعجمي.

    - lemma: "مُحْتَرِفُ يُونِكْس"
      source: stage1
      decision: removed
      decision_reason: >
        «مُحترِف» يدلُّ على من اتَّخذ شيئاً حرفةً ومصدر رزق، وهو يُؤطِّر العلاقة
        بالمهنة من منظور اقتصادي لا معرفي. «UNIX guru» يعني بالغ الإتقان والمرجعية،
        وليس مجرد من يحترف العمل على يونكس. لا أدلة على تثبيت هذا المركب معجمياً.


