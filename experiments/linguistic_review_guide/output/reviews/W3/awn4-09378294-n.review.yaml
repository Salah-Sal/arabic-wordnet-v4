        examples:
          - text: "أَصْبَحَ خَلِيجُ مِينَامَاتَا رَمْزاً عَالَمِيّاً لِلْمَخَاطِرِ الصِّنَاعِيَّةِ عَلَى الْبِيئَةِ وَصِحَّةِ الإِنْسَانِ."
            type: usage
    actions:
