stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي طويل نوعاً ما ويميل للأسلوب السردي أكثر من الأسلوب المعجمي."
    observations: "المصطلح اسم علم لموقع جغرافي ياباني، وهو مصطلح مركب (تعبير مسكوك). يرتبط المفهوم أساساً بكارثة بيئية شهيرة (تسمم الزئبق)، مما يجعل ذكره في المعجم ذا طابع موسوعي."
  blind_candidates:
    - lemma: "خَلِيجُ مِينَامَاتَا"
      generation_method: tarkib
      justification: "الترجمة والنقل الصوتي المباشر للمصطلح الإنجليزي (Minamata Bay)، وهو الاسم الشائع في المصادر العربية."
    - lemma: "خَلِيجُ مِينَمَاتَا"
      generation_method: tarkib
      justification: "صيغة بديلة للنقل الصوتي بحذف ألف المد الثانية، وهي شائعة أيضاً في التقارير البيئية."
    - lemma: "جَوْنُ مِينَامَاتَا"
      generation_method: tarkib
      justification: "استخدام لفظ 'جون' للدلالة على الخليج الصغير، وهو ما يشير إليه تعريف المستوى الأعلى (Hypernym)."
    - lemma: "مِينَامَاتَا"
      generation_method: majaz
      justification: "استخدام اسم المنطقة أو المدينة للدلالة على الخليج من باب تسمية المحل باسم الحال أو العكس، لكنه أقل دقة للموقع الجغرافي البحري."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيجُ مِينَامَاتَا"
      confirm:
        - text: "«داءُ ميناماتا (الاضْطِرابُ العَصَبِيُّ بِالتَّسَمُّمِ بأَلْكيلِ الزِّئْبَق)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يؤكد النقل الصوتي للاسم 'ميناماتا' في سياق الكارثة البيئية المرتبطة بهذا الموقع."
    - lemma: "خَلِيج"
      confirm:
        - text: "«الْخَلِيجُ: وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ. وَخَلِيجَا النَّهْرِ أَوِ الْبَحْرِ: جَنَاحَاهُ.»"
          source: "مقاييس اللغة (ابن فارس)"
      expands:
        - text: "«الخَلِيجُ: جُزْءٌ مِنَ البَحْرِ أو النَّهْرِ يَمْتَدُّ في البَرِّ.»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "خليج ميناماتا"
      decision: confirmed
      decision_reason: "هو المصطلح المعياري المستعمل في اللغة العربية للدلالة على هذا الموقع الجغرافي، مع ضرورة ضبطه بالشكل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ مِينَامَاتَا"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "خَلِيج مِينَمَاتَا"

stage4_content:
  definition:
    current: "خليج على الساحل الغربي لكيوشو؛ في الخمسينيات تسببت النفايات الصناعية في تسمم بالزئبق بين اليابانيين الذين أكلوا الأسماك من خليج ميناماتا"
    assessment:
      decision: revise
      reason: "التعريف الحالي طويل ويشبه المدخل الموسوعي أكثر من التعريف اللغوي المختصر، كما يحتاج إلى تحسين الصياغة العربية."
    authored:
      - type: terminological
        text: "خَلِيجٌ يَقَعُ عَلَى السَّاحِلِ الْغَرْبِيِّ لِجَزِيرَةِ كِيُوشُو فِي الْيَابَانِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "خَلِيجٌ بَحْرِيٌّ فِي جَزِيرَةِ كِيُوشُو الْيَابَانِيَّةِ، اشْتَهَرَ بِكَارِثَةِ التَّلَوُّثِ بِالزِّئْبَقِ فِي الْخَمْسِينِيَّاتِ الَّتِي حَدَثَتْ فِيهِ وَأَدَّتْ إِلَى تَسَمُّمِ السُّكَّانِ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَلِيجٌ يَقَعُ عَلَى السَّاحِلِ الْغَرْبِيِّ لِجَزِيرَةِ كِيُوشُو فِي الْيَابَانِ."
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "خَلِيجٌ بَحْرِيٌّ فِي جَزِيرَةِ كِيُوشُو الْيَابَانِيَّةِ، اشْتَهَرَ بِكَارِثَةِ التَّلَوُّثِ بِالزِّئْبَقِ فِي الْخَمْسِينِيَّاتِ الَّتِي حَدَثَتْ فِيهِ وَأَدَّتْ إِلَى تَسَمُّمِ السُّكَّانِ."

  examples:
