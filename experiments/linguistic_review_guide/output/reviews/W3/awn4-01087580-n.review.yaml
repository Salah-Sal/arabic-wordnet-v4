stage1_review:
  assessment:
    concerns:
      - "التعريف يقتصر على 'الدخل الضريبي الفيدرالي'، وهو توصيف ذو طابع أمريكي بحت (federal)، بينما المفهوم الاقتصادي يشمل أي توزيع للإيرادات المركزية أو الاتحادية."
    observations: "مصطلح 'مشاركة الإيرادات' (revenue sharing) يعبر بدقة عن توزيع الدخل المالي (الضرائب عادة) بين الحكومة المركزية والحكومات المحلية، وهو مصطلح مستقر في الأدبيات الاقتصادية."
  blind_candidates:
    - lemma: "مُشَارَكَةُ الْعَائِدَاتِ"
      generation_method: tarkib
      justification: "تركيب إضافي يعكس معنى مشاركة الدخل المالي."
    - lemma: "تَقَاسُمُ الْعَائِدَاتِ"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر عن قسمة الموارد المالية بين الأطراف."
    - lemma: "تَوْزِيعُ الْإِيرَادَاتِ"
      generation_method: tarkib
      justification: "ترجمة مباشرة لمعنى التوزيع الوارد في التعريف."
    - lemma: "مُحَاصَصَةُ الْعَائِدَاتِ"
      generation_method: tarkib
      justification: "استخدام مصطلح المحاصصة الذي يدل على اقتسام الحصص المالية."

stage2_evidence:
  per_lemma:
    - lemma: "مشاركة الإيرادات"
      evidence_status: "no_material_found"
    - lemma: "مُشَارَكَةُ الْعَائِدَاتِ"
      evidence_status: "no_material_found"
    - lemma: "تَقَاسُمُ الْعَائِدَاتِ"
      confirm:
        - text: "«تقاسم العائدات: في الوقت ذاته يتم تقسيم أرباح تذاكر وأسعار النقل المتفق عليها من قبل اتحادات التسعيرة وروابط النقل على جميع شركات النقل المشتركة.»"
          source: "Arabterm (Transport and Infrastructure)"
    - lemma: "تَوْزِيعُ الْإِيرَادَاتِ"
      evidence_status: "no_material_found"
    - lemma: "مُحَاصَصَةُ الْعَائِدَاتِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مشاركة الإيرادات"
      decision: confirmed
      decision_reason: "مصطلح معتمد وشائع في الاقتصاد للدلالة على اقتسام الدخل الضريبي أو الإيرادات."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُشَارَكَةُ الْإِيرَادَاتِ"

    - lemma: "تَقَاسُمُ الْعَائِدَاتِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح دقيق وموثق في معاجم المصطلحات (Arabterm) للدلالة على نفس المفهوم المالي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "تَقَاسُمُ الْعَائِدَاتِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُشَارَكَةُ الْعَائِدَاتِ"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف شائع يعبر بوضوح عن مشاركة الأرباح والمداخيل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "مُشَارَكَةُ الْعَائِدَاتِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَوْزِيعُ الْإِيرَادَاتِ"
      source: stage1
      decision: removed
      decision_reason: "تركيب عام يفتقر إلى التخصيص الاصطلاحي الدقيق مقارنة بالمشاركة أو التقاسم."

    - lemma: "مُحَاصَصَةُ الْعَائِدَاتِ"
      source: stage1
      decision: removed
      decision_reason: "استخدام غير شائع وكلمة المحاصصة غالبا ما ترتبط بتقسيم الحصص السياسية أو غيرها."

stage4_content:
  definition:
    current: "توزيع جزء من الدخل الضريبي الفيدرالي على الولايات والبلديات"
    assessment:
      decision: revise
      reason: "تعديل التعريف ليكون أكثر دقة وشمولية في السياق العربي باستبدال 'الفيدرالي' بـ 'الاتحادي'."
    authored:
      - type: terminological
        text: "تَوْزِيعُ جُزْءٍ مِنَ الدَّخْلِ الضَّرِيبِيِّ الِاتِّحَادِيِّ عَلَى الْوِلَايَاتِ وَالْبَلَدِيَّاتِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "تَوْزِيعُ جُزْءٍ مِنَ الدَّخْلِ الضَّرِيبِيِّ الِاتِّحَادِيِّ عَلَى الْوِلَايَاتِ وَالْبَلَدِيَّاتِ."}
  examples:
    per_lemma:
      - lemma: "مشاركة الإيرادات"
        examples:
          - text: "تُسْهِمُ مُشَارَكَةُ الْإِيرَادَاتِ فِي تَعْزِيزِ مِيزَانِيَّةِ الْحُكُومَاتِ الْمَحَلِّيَّةِ."
            type: usage
      - lemma: "تَقَاسُمُ الْعَائِدَاتِ"
        examples:
          - text: "اتَّفَقَتِ الْأَطْرَافُ عَلَى تَقَاسُمِ الْعَائِدَاتِ النَّاجِمَةِ عَنِ الْمَشْرُوعِ."
            type: usage
      - lemma: "مُشَارَكَةُ الْعَائِدَاتِ"
        examples:
          - text: "يَضْمَنُ نِظَامُ مُشَارَكَةِ الْعَائِدَاتِ عَدَالَةَ التَّوْزِيعِ بَيْنَ الْحُكُومَةِ وَالْبَلَدِيَّاتِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تُسْهِمُ مُشَارَكَةُ الْإِيرَادَاتِ فِي تَعْزِيزِ مِيزَانِيَّةِ الْحُكُومَاتِ الْمَحَلِّيَّةِ."}

