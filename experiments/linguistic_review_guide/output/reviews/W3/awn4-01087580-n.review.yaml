          root: "ورد"
          maqayis_quote: "«الْوَاوُ وَالرَّاءُ وَالدَّالُ: أَصْلَانِ، أَحَدُهُمَا الْمُوَافَاةُ إِلَى الشَّيْءِ، وَالثَّانِي لَوْنٌ مِنَ الْأَلْوَانِ.»"
