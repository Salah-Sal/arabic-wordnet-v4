      decision_reason: >
        يفشل اختبار السكّ المعجمي ذاته: 'رائد' + أي حقل معرفي = عبارة وصفية حرة.
        الألقاب الوصفية للأعلام التاريخيين ليست لمّات معجمية مستقلة في الشبكة
