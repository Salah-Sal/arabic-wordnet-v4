# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ─────────────────
stage1_review:

  # ── أ. التوليد الأعمى (من synset_info_masked.yaml — بدون لمّات) ──
  blind_candidates:
    - lemma: "مَارْكُونِي"
      generation_method: taarib
      justification: >
        تعريب الاسم العائلي الإيطالي Marconi بتعريب مباشر متوافق مع قواعد التعريب:
        يقبل ال- (المارکوني) والجمع السالم والنسبة (ماركوني = الصفة). وهو الاسم
        المرجعي الأقصر لمخترع التلغراف اللاسلكي الذي أرسل إشارات راديو عبر
        المحيط الأطلسي عام 1901 (1874-1937).
    - lemma: "غُولْيَلْمُو مَارْكُونِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل Guglielmo Marconi وفق أحكام التعريب الصوتي لأسماء الأعلام
        الإيطالية: Gu → غُو، gliel → لْيَلْ (مع سكون اللام الأولى بحسب النطق الإيطالي)،
        mo → مُو. الاسم الكامل ضروري في المداخل المعجمية والموسوعية للتمييز عن أسماء
        الأسرة المشتركة.
    - lemma: "مُخْتَرِع التَّلَغْرَاف اللَّاسِلْكِيّ"
      generation_method: tarkib
      justification: >
        تركيب إضافي يُعرِّف الشخصية بأبرز إنجازها. مرشح احتياطي في حال غياب
        تعريب معتمد — يجمع 'مخترع' (اسم فاعل من اخترع) و'التلغراف اللاسلكي'
        المصطلح التقني المعتمد.
    - lemma: "رَائِد الإِبْرَاق اللَّاسِلْكِيّ"
      generation_method: tarkib
      justification: >
        تركيب إضافي بديل: 'رائد' (من رود: التقدّم والسبق) + 'الإبراق اللاسلكي'
        وهو المصطلح الفصيح المعتمد في المعاجم الحديثة لـ wireless telegraphy.
        يُبرز الريادة لا مجرد الاختراع.

  # ── ب. التقييم بعد الاطلاع على synset_info الكامل ──
  assessment:
    concerns:
      - "اللمّتان الموجودتان (غولييلمو ماركوني، ماركوني) خاليتان من التشكيل الكامل"
      - "تهجئة الاسم الأول 'غولييلمو' (بياءين) قد تكون غير دقيقة؛ يورد المورد الحديث (2008) الصيغة: غولْيَلْمو (بسكون اللام وياء واحدة مفتوحة)"
      - "التعريف الحالي يستخدم 'إشارات راديو' (نكرة غير موصوفة) بدلاً من 'إشارات راديوية' أو 'إشارات لاسلكية'"
      - "التعريف لا يذكر جائزة نوبل (1909) وهي معلومة جوهرية في الترجمة الحيوية الموسوعية"
    observations: >
      المجموعة الترادفية تمثّل علماً شخصياً (proper noun) على مهندس كهربائي إيطالي
      مشهور هو غوليلمو ماركوني (1874-1937). اللمّتان الموجودتان صحيحتان في جوهرهما:
      الأولى (الاسم الكامل) تُستخدم في السياقات الأكاديمية والرسمية، والثانية (اللقب
      وحده) هي الأكثر تداولاً في المراجع والنصوص العلمية. الإشكالية الرئيسية تقنية:
      غياب التشكيل واحتمال الخطأ الإملائي في تهجئة الاسم الأول. طريقة التوليد
      المصطلحي الوحيدة الملائمة للأعلام الأعجمية هي التعريب (taarib)؛ أما المرشحات
      الوصفية (تركيب) فتفشل اختبار السكّ المعجمي لكونها عبارات حرة لا أسماء علم.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — Batch headword lookup: غوليلمو ماركوني + ماركوني + صيغ ال- (0 نتائج في headword)
#   Q2 — English bridge: Marconi, Guglielmo Marconi, wireless telegraphy, radio telegraphy
#   Q3 — Arabic FTS: ماركوني، التلغراف اللاسلكي، اللاسلكي، الإبراق اللاسلكي
stage2_evidence:
  per_lemma:

    - lemma: "غولييلمو ماركوني"
      evidence_status: "no_material_found"
      # لا يوجد مدخل في قاعدة البيانات بهذه الصيغة تحديداً

    - lemma: "ماركوني"
      expands:
        - text: >
            «ماركونيّ: ذو علاقة بطريقة الإبراق اللاسلكيّ التي اختزلها غولْيَلْمو
            ماركوني (1874-1937).»
          source: "المورد الحديث (2008) — entry_id: 700188"
          addition: >
            يُثبت المورد الحديث الاسم 'ماركوني' علماً على مخترع الإبراق اللاسلكي،
            ويشتق منه صفة النسبة 'ماركونيّ'. كما يورد الصيغة المعتمدة للاسم الأول:
            غولْيَلْمو (بسكون اللام الأولى وياء واحدة مفتوحة)، مما يرجّح أن تهجئة
            'غولييلمو' (بياءين) في اللمّة الموجودة تستوجب التصحيح.

    - lemma: "مَارْكُونِي"
      source: stage1
      expands:
        - text: >
            «ماركونيّ: ذو علاقة بطريقة الإبراق اللاسلكيّ التي اختزلها غولْيَلْمو
            ماركوني (1874-1937).»
          source: "المورد الحديث (2008) — entry_id: 700188"
          addition: >
            يؤكد أن 'ماركوني' هو الاسم العائلي المعتمد في المعجمية العربية الحديثة
            للإشارة إلى هذه الشخصية.

    - lemma: "غُولْيَلْمُو مَارْكُونِي"
      source: stage1
      expands:
        - text: >
            «ماركونيّ: ذو علاقة بطريقة الإبراق اللاسلكيّ التي اختزلها غولْيَلْمو
            ماركوني (1874-1937).»
          source: "المورد الحديث (2008) — entry_id: 700188"
          addition: >
            يُقدّم المورد الحديث الصيغة المعتمدة للاسم الكامل: غولْيَلْمو ماركوني.
            وهذا يُرجّح أن الاسم الأول يُكتب بسكون اللام الأولى وياء واحدة مفتوحة
            (غُولْيَلْمُو)، لا بياءين متتاليتين كما في اللمّة الموجودة.

    - lemma: "مُخْتَرِع التَّلَغْرَاف اللَّاسِلْكِيّ"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "رَائِد الإِبْرَاق اللَّاسِلْكِيّ"
      source: stage1
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّات موجودة ──
    - lemma: "غولييلمو ماركوني"
      decision: confirmed
      decision_reason: >
        اللمّة ضرورية بوصفها الاسم الكامل للشخصية المُمثَّلة. غير أن تهجئة الاسم
        الأول تستوجب التصحيح وفق المورد الحديث (2008): 'غولْيَلْمو' بدلاً من
        'غولييلمو' (بياءين). كذلك يجب إضافة التشكيل الكامل لكلا الجزأين.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: >
        الصيغة الرسمية الكاملة (الاسم الشخصي + اللقب العائلي). تُستخدم في
        السياقات الأكاديمية والموسوعية والتوثيقية، وعند الإشارة إلى الشخصية لأول
        مرة في النص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غُولْيَلْمُو مَارْكُونِي"

    - lemma: "ماركوني"
      decision: confirmed
      decision_reason: >
        الاسم العائلي وحده، مُعتمَد في المورد الحديث (2008) وهو الصيغة الأكثر
        تداولاً في النصوص العلمية والصحفية والموسوعية. يحتاج إلى إضافة التشكيل
        الكامل فقط.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة المختصرة (اللقب العائلي وحده). أكثر شيوعاً في الإشارات المكررة
        داخل النص وفي العناوين والمصطلحات المشتقة (كالصفة 'ماركونيّ').
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَارْكُونِي"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَارْكُونِي"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة 'ماركوني' التي تمّ تأكيدها وتشكيلها أعلاه.
        لا حاجة لإجراء إضافي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "غُولْيَلْمُو مَارْكُونِي"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو ذاته الشكل المُحدَّث المُوصى به للمّة الموجودة 'غولييلمو
        ماركوني'. يُعالجه إجراء update_lemma الوارد أعلاه، ولا داعي لإنشاء مدخل
        مستقل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji

    - lemma: "مُخْتَرِع التَّلَغْرَاف اللَّاسِلْكِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ المعجمي: العبارة وصفية حرة قابلة للإبدال والتعديل
        (يصحّ قول: 'مبتكر الإبراق اللاسلكي'، 'مكتشف التلغراف اللاسلكي'...).
        لا تُعدّ وحدةً معجميةً ثابتة مسجّلة. كما أن الشبكة الدلالية لا تقبل
        العبارات الوصفية الحرة أسماء أعلام لشخصيات بعينها.
      evidence_assessment:
