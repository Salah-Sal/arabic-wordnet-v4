# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "أوليفر هيفسايد"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة من حيث المبدأ (الاسم الكامل للعالم) وتتوافق مع المقابل الإنجليزي "Oliver Heaviside"،
        غير أنها تستوجب تصحيحَيْن: (أ) تصحيح التهجئة من "هيفسايد" إلى "هيفيسايد" بالياء الوسطى
        وفق ما تُثبته المعاجم العربية المتخصصة (مصطلحات الفيزياء 1989، موسوعة الكهرباء IEC)،
        و(ب) إضافة التشكيل الكامل الإلزامي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل للعالم — يُستخدم في السياقات الموسوعية والأكاديمية الرسمية حيث يُطلوب التعريف الكامل
        بالشخصية والتمييز عن غيرها. يوازي الاستخدام الإنجليزي "Oliver Heaviside".
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُولِيفَر هِيفِيسَايْد"

    # ── مرشح المرحلة ١: هِيفِيسَايْد ──
    - lemma: "هِيفِيسَايْد"
      source: stage1
      decision: confirmed
      decision_reason: >
        اللقب المفرد مُثبَتٌ توثيقياً في ثلاثة مداخل من معاجم عربية متخصصة بهيئة "هيفيسايد"
        (طبقة هيفيسايد، دالة هيفيسايد). كما أن المقابل الإنجليزي في OEWN يتضمّن "Heaviside"
        اللقب المفرد كلمّة مستقلة. إضافة هذه اللمّة تسدّ فراغاً حقيقياً في المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب وحده — يُستخدم في السياقات العلمية المختصرة ولا سيما حين يرتبط بمصطلح علمي منسوب
        إليه (طبقة هيفيسايد، دالة هيفيسايد). يوازي الاستخدام الإنجليزي "Heaviside".
      actions:
        - command: create_entry
          params:
            lemma: "هِيفِيسَايْد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: أُولِيفَر هِيفِيسَايْد ──
    - lemma: "أُولِيفَر هِيفِيسَايْد"
      source: stage1
      decision: removed
      decision_reason: >
        هذه اللمّة هي عين اللمّة الموجودة بعد تصحيح تهجئتها وتشكيلها؛ لا حاجة إلى
        إنشاء مدخل جديد لأن المدخل الموجود سيُحدَّث بالأمر update_lemma.

    # ── مرشح المرحلة ١: أُولِيفَر هِيفسَايْد ──
    - lemma: "أُولِيفَر هِيفسَايْد"
      source: stage1
      decision: removed
      decision_reason: >
        تهجئة "هيفسايد" (دون ياء وسطى) لا تطابق الشكل المعتمد في المعاجم العربية المتخصصة.
        لا أدلة تدعمها، والشكل الأصح "هِيفِيسَايْد" يُغني عنها.

    # ── مرشح المرحلة ١: هِيفسَايْد ──
    - lemma: "هِيفسَايْد"
      source: stage1
      decision: removed
      decision_reason: >
        التهجئة المختصرة (دون ياء وسطى) لا تُوافق المعيار الصوتي لتعريب /hɛvɪsaɪd/،
        وتخالف الشكل الموثّق في المعاجم. المرشح "هِيفِيسَايْد" (بالياء) أولى منها.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فيزيائي ومهندس كهربائي إنجليزي ساعد في تطوير الاتصالات التلغرافية والهاتفية؛ في عام 1902 (بشكل مستقل عن كينيلي) اقترح وجود طبقة جوية تعكس موجات الراديو إلى الأرض (1850-1925)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمةٌ شبه حرفية من الإنجليزية. يفتقر إلى:
        (أ) الأسلوب الموسوعي الجامع للجنس والفصل النوعي،
        (ب) ذكر اسم الطبقة الجوية المشهورة باسمه (طبقة هيفيسايد/الغلاف الأيوني)،
        (ج) التحسين الأسلوبي العربي: "بشكل مستقل" → "مستقلاً"، وتدقيق اسم كينيلي.
    authored:
      - type: encyclopedic
        text: >
          فيزيائيٌّ ومهندسٌ كهربائيٌّ إنجليزيٌّ (1850-1925)، أسهم في تطوير الاتصالات
          التلغرافية والهاتفية، واقترح عام 1902 — مستقلاً عن عالِمِه الأمريكي آرثر إدوين
          كينيلي — وجود طبقة في الغلاف الجوي تعكس موجات الراديو إلى سطح الأرض؛
          وقد عُرفت هذه الطبقة باسم "طبقة هيفيسايد" أو "طبقة كينيلي–هيفيسايد"،
          وهي جزء مما يُعرف اليوم بالغلاف الأيوني.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            فيزيائيٌّ ومهندسٌ كهربائيٌّ إنجليزيٌّ (1850-1925)، أسهم في تطوير الاتصالات
            التلغرافية والهاتفية، واقترح عام 1902 — مستقلاً عن عالِمِه الأمريكي آرثر إدوين
            كينيلي — وجود طبقة في الغلاف الجوي تعكس موجات الراديو إلى سطح الأرض؛
            وقد عُرفت هذه الطبقة باسم "طبقة هيفيسايد" أو "طبقة كينيلي–هيفيسايد"،
            وهي جزء مما يُعرف اليوم بالغلاف الأيوني.

  examples:
