# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'أوليفر هيفسايد' تفتقر إلى التشكيل الكامل الإلزامي"
      - "تهجئة 'هيفسايد' تخالف الشكل المعتمد في المعاجم العربية المتخصصة ('هيفيسايد' بالياء الوسطى)"
      - "المجموعة تحتوي على لمّة واحدة فقط في حين أن المقابل الإنجليزي يتضمّن لمّتين: 'Heaviside' (لقب) و'Oliver Heaviside' (الاسم الكامل)"
      - "التعريف الحالي ترجمةٌ شبه حرفية من الإنجليزية وينقصه الأسلوب الموسوعي العربي"
    observations: >
      هذه المجموعة الترادفية ترسم صورة شخصية علمية إنجليزية محددة عاشت بين 1850 و1925.
      الشخص فيزيائيٌّ ومهندسٌ كهربائي أسهم في مجالين: الاتصالات التلغرافية والهاتفية، وتفسير ظاهرة انعكاس موجات الراديو من طبقة الغلاف الجوي.
      وجود اسم "كينيلي" في التعريف يُرجّح أن هذه الشخصية هي الطرف الآخر في ثنائية "كينيلي–هيفيسايد" التاريخية المعروفة.
      اللمّات في هذه المجموعة ستكون حتماً تعريباً لاسم أعجمي.
  blind_candidates:
    - lemma: "هِيفِيسَايْد"
      generation_method: taarib
      justification: >
        استُنتج الاسم من الإشارة إلى "كينيلي" في التعريف، إذ اقترح الاثنان معاً وجود الطبقة الجوية العاكسة؛
        والمصطلح المعروف هو "طبقة كينيلي–هيفيسايد". اللقب وحده شائع في السياقات العلمية العربية
        (طبقة هيفيسايد، دالة هيفيسايد). التهجئة تتبع نظام التعريب العربي المعياري للصوت /hɛvɪsaɪd/.
    - lemma: "أُولِيفَر هِيفِيسَايْد"
      generation_method: taarib
      justification: >
        الاسم الكامل مُركَّبٌ من الاسم الأول "أُولِيفَر" (Oliver) ولقب العائلة "هِيفِيسَايْد" (Heaviside).
        يُستخدم الاسم الكامل في السياقات الموسوعية والأكاديمية الرسمية للتمييز عن علماء آخرين يحملون لقب Heaviside.
    - lemma: "أُولِيفَر هِيفسَايْد"
      generation_method: taarib
      justification: >
        صيغة بديلة للاسم الكامل بتهجئة مختصرة لـ Heaviside دون ياء وسطى ("هيفسايد")،
        وهي تهجئة تُستخدم أحياناً في بعض المصادر العربية غير المتخصصة.
    - lemma: "هِيفسَايْد"
      generation_method: taarib
      justification: >
        لقب العائلة بالتهجئة المختصرة (دون ياء وسطى). هذا الشكل أقل دقةً من الناحية الصوتية
        لأن المقطع /ɪ/ في Heaviside يُمثَّل عادةً بالياء في التعريب العربي.


