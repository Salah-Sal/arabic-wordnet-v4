        examples:
          - text: "يُعدُّ أُولِيفَر هِيفِيسَايْد من أبرز علماء الكهرباء في القرن التاسع عشر، وقد طوَّر الصياغة المتجهية الحديثة لمعادلات ماكسويل."
            type: usage
      - lemma: "هِيفِيسَايْد"
        examples:
          - text: "اكتشفت الدراسات الحديثة أن طبقة هِيفِيسَايْد تلعب دوراً محورياً في انتشار موجات الراديو متوسطة التردد عبر مسافات بعيدة."
            type: usage
    actions:
