# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14484815-n
# entirety / entireness / integrality / totality
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تمام» مشتركة مع المجموعة الأعلى (awn4-14484558-n) التي تضمّ «تمام» و«كمال»، ممّا يُشكل تداخلاً دلالياً ويُضعف التمييز بين المجموعتين"
      - "اللمّة «كليّة» شديدة الالتباس: تحتمل الكُلْية (العضو)، والكُلِّيَّة (المفهوم المنطقي)، والكُلِّيَّة (المؤسسة التعليمية)، ولا تشكيل يُزيل الالتباس"
      - "اللمّة «مجموع» تدلّ في الاستعمال المعجمي الراسخ على الحاصل الرياضي أو الجمع النحوي، لا على حالة الكُلِّيَّة والتَّمام"
      - "جميع اللمّات الثلاث بلا تشكيل"
    observations: "المجموعة تعبّر عن مفهوم مجرد هو حالة كون الشيء كلّيّاً وكاملاً، وهو مفهوم قريب جداً من المجموعة الأعلى (completeness) مع تأكيد على جانب الشمول والإحاطة. الفرق الدقيق أنّ هذه المجموعة تركّز على شمول جميع الأجزاء دون تخلّف شيء منها (entirety/totality)، بينما الأعلى تركّز على استيفاء الشروط والمطلوب (completeness). يحتاج التمييز إلى تعريف أدقّ ولمّات أنسب."
  blind_candidates:
    - lemma: "شُمُول"
      generation_method: ishtiqaq
      justification: "مصدر من شَمِلَ على وزن فُعُول، يدلّ على العموم والإحاطة بجميع الأجزاء، وهو قريب من معنى entirety"
    - lemma: "اسْتِكْمَال"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من كَمَلَ، يدلّ على طلب الكمال وتحصيله، أي بلوغ حالة التمام"
    - lemma: "تَمَامِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من تَمَام، يعبّر عن حالة كون الشيء تامّاً بوصفها صفة مجرّدة"
    - lemma: "جَامِعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من جَامِع، يدلّ على صفة الجمع والإحاطة بالأجزاء كلّها"


stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَمَام"
      confirm:
        - text: "«(التَّمام) تَمام الشَّيْء مَا يتم بِهِ وَلَيْلَة التَّمام لَيْلَة أَربع عشرَة من الشَّهْر الْقمرِي حِين يَسْتَوِي الْقَمَر فَيصير بَدْرًا»"
          source: "المعجم الوسيط (هورماني)"
        - text: "«ما تَمَّ به الشَّيْءُ : يقال : هَذِه الدراهمُ تَمامُ هذه المِئة . الكَمالُ»"
          source: "المعجم الكبير"
        - text: "«تَمَام — مِن (ت م م) الكمال»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«وقيل : بَيْن التَّمامِ والكمالِ فَرْقٌ : هو أنَّ التَّامَّ : ما تُجُزَّأُ منه أجْزاؤُه . فلا يَفْهَم السامعُ من « رَجُل تـامُّ الخَلْق » إلَّا أنه لا نَقْصَ فى أعضائه, ويَفْهَم من « كَامِل الخَلْق » مَعْنَى زائِدًا على التَّمـامِ , كالحُسْن , والفَضْل , فالكَمالُ تَمـام وزيادةٌ»"
          source: "المعجم الكبير"
          addition: "التمام يدلّ على عدم النقص في الأجزاء، بينما الكمال تمام وزيادة — وهذا يؤكّد أنّ التمام أقرب لمعنى entirety من الكمال"

    - lemma: "كُلِّيَّة"
      confirm:
        - text: "«الكلّية: تطلق على كون المفهوم كلّيا حقيقيا كان أو إضافيا، وعلى قضية حملية حكم فيها على جميع أفراد الموضوع»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«كُلِّية — كل ما تشترك فيه المخلوقات البشرية ويميزها عن غيرها من المخلوقات»"
          source: "مسرد الإعلام والتواصل (ARABTERM) — universality"
        - text: "«يمكن تصحيح المثال المرفوض بحمله على المصدر الصناعي، وهو بناء قياسي كما قرر مجمع اللغة المصري، وقد ورد في بعض المعاجم الحديثة بمعنى: بمجموعه، أو من أوله إلى آخره»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«الْكُلية: إِمْكَان فرض الِاشْتِرَاك والجزئية استحالته»"
          source: "دستور العلماء للأحمدنكري"
          addition: "معنى منطقي اصطلاحي يركّز على الإحاطة بجميع الأفراد"

    - lemma: "مَجْمُوع"
      contradicts:
        - text: "«(الْمَجْمُوع) (فِي علم الرياضة) نتيجة ضم الْأَعْدَاد أَو الْحُدُود الجبرية المتشابهة»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأساسي رياضي (sum)، لا يدلّ على حالة الكلّيّة"
        - text: "«المجموع: ما دل على آحاد مقصودة بحروف مفردة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى نحوي (الجمع)، لا يدلّ على حالة التمام"
      expands:
        - text: "«المجموع: عند المحاسبين هو الحاصل من عمل الجمع... والعلماء قد يستعملونه في معان أخر. منها الأجزاء من غير أن يعتبر معها الهيئة الوحدانية أي الكثير المحض. ومنها الأجزاء مع الهيئة الوحدانية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يُستعمل بمعنى مجموع الأجزاء (aggregate) لا بمعنى حالة الكلّيّة (state of totality)"

    # ── مرشحات المرحلة ١ ──
    - lemma: "شُمُول"
      contradicts:
        - text: "«(الشُّمُول) ريح الشمَال وَالْخمر»"
          source: "المعجم الوسيط (هورماني)"
          conflict: "المعنى الأساسي ريح الشمال أو الخمر، لا الإحاطة"
      expands:
        - text: "«الشُّمولُ: العمومُ»"
          source: "المعجم الكبير"
          addition: "ورد بمعنى العموم في المعجم الكبير لكنّه معنى فرعي غير شائع"

    - lemma: "اسْتِكْمَال"
      contradicts:
        - text: "«استكمال — interpolation»"
          source: "مسرد الهندسة الكهربائية (ARABTERM)"
          conflict: "المعنى التقني المعاصر هو الاستكمال الرياضي (interpolation/extrapolation)، لا حالة التمام"

    - lemma: "تَمَامِيَّة"
      evidence_status: "no_material_found"

    - lemma: "جَامِعِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَمَام"
      decision: confirmed
      decision_reason: "دلالة التمام على الكمال وعدم النقص ثابتة في المعاجم الكلاسيكية والمعاصرة، وهي مؤكّدة في مقاييس اللغة. التمام يعني بلوغ الشيء حدّه دون نقص، وهو صميم معنى entirety"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على بلوغ الشيء غايتَه دون نقصان في أجزائه، مع تركيز على اكتمال العملية أو الحدث (تمام الشهر، تمام الخَلْق)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَمَام"

    - lemma: "كُلِّيَّة"
      decision: confirmed
      decision_reason: "مصدر صناعي قياسي من كُلّ، أقرّه مجمع اللغة المصري كما في معجم الصواب اللغوي، ويُستعمل بمعنى الشمول والإحاطة بالجميع. ورد في كشّاف اصطلاحات الفنون وفي مسارد ARABTERM بمعنى universality"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على صفة الإحاطة بجميع الأفراد أو الأجزاء من حيث هي صفة مجرّدة (universality/totality)، مع تركيز على الشمول المنطقي لا على اكتمال عملية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كُلِّيَّة"

    - lemma: "مَجْمُوع"
      decision: removed
      decision_reason: "الأدلة المعجمية تُظهر أنّ مجموع يدلّ أساساً على الحاصل الرياضي (sum) أو الجمع النحوي (plural) أو مجموع الأجزاء كحاصل مادي (aggregate). لا يدلّ على الحالة المجردة للكلّيّة والتمام (state of being total) التي يعبّر عنها هذا المعنى"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "شُمُول"
      source: stage1
      decision: removed
      decision_reason: "الشُّمُول في المعاجم يدلّ أساساً على ريح الشمال أو الخمر. ورد بمعنى العموم في المعجم الكبير لكنّه معنى هامشي غير مستقرّ، ولا يُستعمل اسماً للحالة المجردة"
      evidence_assessment:
        case: mixed

    - lemma: "اسْتِكْمَال"
      source: stage1
      decision: removed
      decision_reason: "استُهلك المصطلح في الاستعمال التقني المعاصر بمعنى interpolation/extrapolation، ولا يدلّ على حالة التمام والكلّيّة"
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَمَامِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا شواهد معجمية على استعمالها بهذا المعنى. وإن كانت قياسية صرفياً فإنّ التمام نفسه يؤدّي المعنى دون حاجة إلى مصدر صناعي مُوَلَّد"
      evidence_assessment:
        case: no_material

    - lemma: "جَامِعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا شواهد معجمية، والمصدر الصناعي من جامع لا يُستعمل بمعنى الكلّيّة أو التمام"
      evidence_assessment:
        case: no_material


