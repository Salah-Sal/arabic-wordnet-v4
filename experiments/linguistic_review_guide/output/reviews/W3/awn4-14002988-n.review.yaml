# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — Synset Review: awn4-14002988-n
# حالة من الهياج أو التغيير المضطرب أو التطور
# a state of agitation or turbulent change or development
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «قَلَق» تُستعمل في العربية المعاصرة بمعنى القلق النفسي (anxiety) أكثر من معنى الهياج الاجتماعي (unrest/agitation)، فقد يلتبس المعنى"
      - "لفظة «غليان» دلالتها الأولى فيزيائية (boiling)، واستعمالها المجازي للاضطراب الاجتماعي ثانوي"
      - "التعريف العربي الحالي يبدو ترجمة حرفية من الإنجليزية، وعبارة «التغيير المضطرب أو التطور» ركيكة"
      - "التعريف يستعمل لفظة «هياج» وهي من لمّات المجموعة نفسها، فيقع الدور"
    observations: "المجموعة تعبّر عن مفهوم الاضطراب والتحوّل العنيف في السياق الاجتماعي أو السياسي، وهو مفهوم عربي أصيل له ألفاظ متعددة. اللمّات الثلاث الحالية تغطّي جوانب مختلفة من المفهوم: الغليان (الفوران المجازي)، القلق (الانزعاج وعدم الاستقرار)، الهياج (الثوران والإثارة). المجموعة الأمّ تتحدث عن «الاضطراب والفوضى العنيفة»، وهذه المجموعة أخصّ منها بالتركيز على حالة التحوّل والتغيّر المضطرب."

  blind_candidates:
    - lemma: "فَوَرَان"
      generation_method: ishtiqaq
      justification: "من الجذر «فور» على وزن فَعَلان الدال على الحركة والاضطراب. قال ابن فارس: «الفاء والواو والراء كلمة تدل على غليان». يُستعمل مجازاً للاضطراب الاجتماعي: فوران شعبي"
    - lemma: "اضْطِرَام"
      generation_method: ishtiqaq
      justification: "من الجذر «ضرم» على وزن افتعال. الأصل في الاشتعال والالتهاب، ويُستعار للتوقّد والهياج النفسي والاجتماعي"
    - lemma: "مَخَاض"
      generation_method: majaz
      justification: "أصل المخاض وجع الولادة والطلق. يُستعار لحالة التحوّل العنيف: «مخاض التغيير»، «في مخاض التحوّل». وهو مجاز راسخ في الاستعمال العربي المعاصر"
    - lemma: "تَمَخُّض"
      generation_method: majaz
      justification: "من المخض، وفي المثل العربي: «تمخّض الجبل فولد فأراً». يُستعمل للدلالة على حالة التحوّل المضطرب التي تُفضي إلى نتيجة. وفي المعجم الوسيط: «تمخّض الدهرُ بالفتنة: أتى بها»"


stage2_evidence:
  per_lemma:
    - lemma: "غَلَيَان"
      confirm:
        - text: "«غلَتِ القِدْرُ ونحوُها: سخَنت وفارت بفعل الحرارة... غلَى الشَّخصُ: اشتدَّ غيظُه... غَلَيان شَعْبِيّ: فَوَران، ثورة، هيجان»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«غَلَتِ القِدْرُ تَغْلِي غَلْياً وغَلَياناً... وغَلِيَ الرجلُ: اشتدّ غيظه»"
          source: "المعجم الوسيط"
      expands:
        - text: "«غ ل ى: غَلَتِ الْقِدْرُ مِنْ بَابِ رَمَى وَغَلَيَانًا أَيْضًا بِفَتْحَتَيْنِ»"
          source: "مختار الصحاح للرازي"
          addition: "تأكيد الوزن الصرفي غَلَيان بفتحتين"
        - text: "«غَلْيَة والجمع غِلى: غليان، جيشان، فوران... غِليان وغَليان: فوران... غليان الدم: فوران الدم»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "التوسع المجازي للغليان إلى فوران الدم والغضب"

    - lemma: "قَلَق"
      confirm:
        - text: "«القَلَقُ، مُحرَّكةً: الانْزِعاجُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الْقَافُ وَاللَّامُ وَالْقَافُ كَلِمَةٌ تَدُلُّ عَلَى الِانْزِعَاجِ. يُقَالُ: قَلِقَ يَقْلَقُ قَلَقًا»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«قلق: لم يستقِرَّ في مكان واحد، لم يستقِرَّ على حال، اضطرب وانزعج»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(القلق) حَالَة انفعالية تتَمَيَّز بالخوف مِمَّا قد يحدث (مج)»"
          source: "المعجم الوسيط"
          conflict: "هذا التعريف المُجمعي يخصّ القلق النفسي (anxiety)، وهو المعنى السائد حديثاً، ويختلف عن معنى الهياج والاضطراب الاجتماعي المراد في المجموعة"
      expands:
        - text: "«(1) قَلَق (2) اضطراب؛ اهتياج social unrest»"
          source: "المورد الحديث (2008) — ترجمة unrest"
          addition: "يؤكد أن «قلق» يُستعمل بمعنى عدم الاستقرار الاجتماعي في المعاجم الثنائية"
        - text: "«قلق اجتماعي — social unrest»"
          source: "المَكنَز الزراعي متعدد اللغات"
          addition: "مصطلح مركب يدل على استعمال «قلق» بمعنى الاضطراب الاجتماعي"

    - lemma: "هِيَاج"
      confirm:
        - text: "«الْهَاءُ وَالْيَاءُ وَالْجِيمُ أَصْلَانِ صَحِيحَانِ: أَحَدُهُمَا يَدُلُّ عَلَى ثَوَرَانِ شَيْءٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«هاج الشيء يهيج هيجاً وهَيَجاناً... أي ثارَ. وهاجَهُ غيرُهُ... ويومُ الهِياج: يوم القتال»"
          source: "تاج اللغة وصحاح العربية للجوهري"
      expands:
        - text: "«(الْهياج) الهيجاء»"
          source: "المعجم الوسيط"
          addition: "المعجم الوسيط يقصر معنى الهياج على الهيجاء (الحرب)، لكن المعاجم الكلاسيكية أوسع"
        - text: "«هياج — agitation»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
          addition: "يُستعمل في المصطلحية الطبية بمعنى الهياج والإثارة"
        - text: "«هِياج — furor»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "الهياج بمعنى الثورة والغضب الشديد"

    - lemma: "فَوَرَان"
      confirm:
        - text: "«الْفَاءُ وَالْوَاوُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى غَلَيَانٍ... فَالْفَوْرُ: الْغَلَيَانُ. يُقَالُ: فَارَتِ الْقِدْرُ تَفُورُ فَوْرًا... وَفَارَ غَضَبُهُ، إِذَا جَاشَ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«فَوَران — effervescence»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "في المصطلحية العلمية، الفوران خُصّص للمعنى الفيزيائي (effervescence) لا الاجتماعي"
        - text: "«فُورَانُ: قرية قريبة من همذان»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "فوران بضم الفاء اسم موضع، يجب التمييز بالتشكيل: فَوَرَان (مصدر) لا فُورَان (علم)"

    - lemma: "اضْطِرَام"
      confirm:
        - text: "«بَاب الاضطرام: أضرم وأورى وسعر وأوقد وشب وألهب وأجج»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
      contradicts:
        - text: "«الضَّادُ وَالرَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى حَرَارَةٍ وَالْتِهَابٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر مخصص للحرارة والاشتعال الحسّي، والاستعارة للاضطراب الاجتماعي غير مسجّلة معجمياً"

    - lemma: "مَخَاض"
      confirm:
        - text: "«الْمِيمُ وَالْخَاءُ وَالضَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اضْطِرَابِ شَيْءٍ فِي وِعَائِهِ مَائِعٍ، ثُمَّ يُسْتَعَارُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«المَخَاض: وجع الولادة، وهو الطلق»"
          source: "المعجم الوسيط"
      expands:
        - text: "«المَخَاض: هو وجع الولادة»"
          source: "التعريفات الفقهية للبركتي"
          addition: "تأكيد أن المعنى الأساسي مقصور على الولادة"

    - lemma: "تَمَخُّض"
      confirm:
        - text: "«تمخّض اللبنُ والولدُ: امتخض. والسماء: تهيّأت للمطر. والحامل: مخضت. وفي المثل: تمخّض الجبل فولد فأراً... والدهرُ بالفتنة: أتى بها»"
          source: "المعجم الوسيط"
      expands:
        - text: "«السماءُ: تهيَّأت للمطر. الدَّهر بالفتنة: أتى بها. تَمَخَّضَتِ اللَّيلَةُ عن يومِ سَوْءٍ»"
          source: "المعجم الوسيط (OCR)"
          addition: "الاستعمال المجازي للتمخض ثابت في المعاجم مع الدهر والزمن"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──

    - lemma: "غَلَيَان"
      decision: confirmed
      decision_reason: "الغليان مصدر غلى، ودلالته الأصلية فوران السائل بالحرارة. التوسع المجازي إلى الاضطراب الاجتماعي والسياسي مسجّل في المعاجم المعاصرة (غليان شعبي) ومتّسق مع المفهوم الإنجليزي ferment. لفظ عربي فصيح على وزن فَعَلان المصدري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على حالة الفوران والتصاعد التدريجي، كالسائل الذي يغلي ببطء ثم ينفجر. يُستعمل غالباً مع الأوضاع الاجتماعية والسياسية التي تتفاقم تدريجياً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَلَيَان"

    - lemma: "قَلَق"
      decision: confirmed
      decision_reason: "القلق في أصله اللغوي يدلّ على الانزعاج وعدم الاستقرار (كما في مقاييس اللغة والصحاح)، وهو أعمّ من المعنى النفسي المعاصر (anxiety). يُستعمل بمعنى الاضطراب الاجتماعي في مركّبات مثل «قلق اجتماعي» (social unrest). المعنى مقبول مع التنبيه على الالتباس المحتمل مع القلق النفسي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على حالة عدم الاستقرار والانزعاج الداخلي، مع بُعد نفسي-اجتماعي. أقرب إلى unrest الإنجليزية من agitation. يتميّز عن الغليان بأنه لا يستلزم عنفاً ظاهراً، وعن الهياج بأنه أهدأ وأكثر كموناً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَلَق"

    - lemma: "هِيَاج"
      decision: confirmed
      decision_reason: "الهياج من الجذر «هيج» الدال على ثوران الشيء (مقاييس اللغة). وهو المصدر الأقرب دلالياً إلى agitation الإنجليزية. مسجّل في المعاجم المصطلحية الحديثة بمعنى agitation وfuror. لفظ فصيح على وزن فِعال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على حالة الثوران والاندفاع الظاهر، وهو الأشدّ في الثلاثة. يتميّز بالعنف والصخب، وهو أقرب إلى agitation وtempestuousness."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِيَاج"

    # ── مرشحات المرحلة ١ ──

    - lemma: "فَوَرَان"
      source: stage1
      decision: removed
      decision_reason: "الفوران في المصطلحية العلمية العربية خُصّص للمعنى الفيزيائي (effervescence/spurting). الاستعمال المجازي وارد لكنه قريب جداً من الغليان ولا يضيف تمييزاً دلالياً كافياً. وجوده مع الغليان في المجموعة نفسها يُحدث تكراراً."

    - lemma: "اضْطِرَام"
      source: stage1
      decision: removed
      decision_reason: "الجذر «ضرم» مخصص في الأصل للحرارة والالتهاب الحسّي (النار). الاستعارة إلى الاضطراب الاجتماعي غير مسجّلة في المعاجم، والمعاني المعجمية مقصورة على الاشتعال والإيقاد."

    - lemma: "مَخَاض"
      source: stage1
      decision: removed
      decision_reason: "المخاض معناه الأصلي وجع الولادة. وإن استُعير مجازياً في العربية المعاصرة (مخاض التحول)، فهو يركّز على عملية الولادة والإنتاج لا على مجرد حالة الاضطراب. ودلالته أضيق من مفهوم المجموعة."

    - lemma: "تَمَخُّض"
      source: stage1
      decision: removed
      decision_reason: "التمخّض فعل متصرّف (تفعُّل) لا اسم جامد، وPOS المجموعة اسم (n). كما أن دلالته تتضمن نتيجةً (تمخّض عن كذا)، بينما المجموعة تصف حالةً لا عمليةً ذات نتيجة. المثل «تمخّض الجبل فولد فأراً» يؤكد هذا البعد."


