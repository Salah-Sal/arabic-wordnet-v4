      generation_method: majaz
      justification: >
        من الجذر صَوَلَ/صَالَ يَصُولُ (صول): صال عليه = سطا عليه وقهره؛ قال المعجم
        الوسيط: «صال عليه صَوْلاً: سطا عليه ليقهره». التوسع المجازي يُفضي إلى
        «الصائل» بمعنى من يندفع نحو مرمى الخصم بقوة وسرعة، مما يناسب مفهوم
        المهاجم في كرة القدم. اللفظ عربي فصيح خالص يُحيي مفهوم الاندفاع الهجومي.
    - lemma: "مُتَقَدِّم"
