        الموضع الأمامي في الفريق؛ وهو وزن قياسي اشتقاقي واضح الدلالة على
        الوظيفة الموضعية للمهاجم الذي يتقدّم صفوف زملائه نحو مرمى الخصم.
    - lemma: "لَاعِبُ الطَّلِيعَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «لاعب» + «طليعة»؛ والطليعة في العربية الكلاسيكية هي
        «مقدمة الجيش ومن يُبعث قُدّامه» (المعجم الكبير). نقل هذا المصطلح العسكري
        إلى ميدان كرة القدم يُعطي دلالة «اللاعب الذي يقود الخط الأمامي في الفريق».
    - lemma: "رَامٍ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من رَمَى يَرْمِي على وزن فَاعِل: «من يرمي الكرة نحو المرمى».
        المهاجم في كرة القدم يتميّز بوظيفة الرمي/التسديد على المرمى، وهذا المشتق
        يُبرز هذه الوظيفة الجوهرية. ورد في المعجم الكبير: «رامٍ: اسم فاعل من رمى؛
        فلانٌ من رُمَاةِ الحَدَق».


