        «مُتَقَدِّم» لفظ مستخدَم في المعاجم الفلسفية والكلامية بمعنى السابق زماناً أو
        طبعاً. وفي الطبيّ يعني «المتقدّم في المرض». لم يُوثَّق مصطلحاً لكرة القدم
        في أيٍّ من المصادر المُستعلَمة. إضافةً إلى ذلك، يصف الموضع دون أن يُشير
        إلى الوظيفة الهجومية، مما يجعله أقل دقةً من «مُهَاجِم».
      evidence_assessment:
        case: contradicts_only

    - lemma: "لَاعِبُ الطَّلِيعَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        «طليعة» في المعجمية الكلاسيكية تدل على الكاشف الاستطلاعي وليس المهاجم؛
        وظيفتها الكشف والاستطلاع لا الهجوم والتسجيل. التعبير المركّب «لاعب الطليعة»
        لا يجتاز اختبار السكّ: يمكن إبداله بـ«لاعب المقدمة» أو «لاعب الصف الأول»
        وظلّ وصفاً صحيحاً — مما يعني أنه عبارة وصفية لا مصطلح ثابت.
      evidence_assessment:
        case: mixed

    - lemma: "رَامٍ"
      source: stage1
      decision: removed
      decision_reason: >
        «رامٍ» كلمة عربية فصيحة لكنها تدل على رامي السهام لا على مصطلح رياضي.
        لا توثيق لها كمصطلح في كرة القدم في أي من المعاجم المُستعلَمة. دلالتها على
        الرمي العام (النبل، الحجارة) لا تُحدِّد وظيفة المهاجم في الكرة تحديداً كافياً.
      evidence_assessment:
        case: contradicts_only


