# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14458911-n
# eminence / distinction / preeminence / note
# أهمية المكانة العالية بسبب التفوق الملحوظ
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «امتياز» في الاستعمال المعاصر تُطلق غالباً على الحقّ القانوني (concession/privilege/franchise)، واستعمالها بمعنى الرفعة والتفوق أقلّ شيوعاً"
      - "اللمّات الثلاث بدون تشكيل كامل في المجموعة الأصلية"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المفهوم يدور حول الأهمية الناشئة عن علوّ المكانة بسبب تفوّق ملحوظ. هذا مفهوم عربي أصيل تعبّر عنه ألفاظ عربية غزيرة من جذور متعدّدة: ر-ف-ع، س-م-و، ع-ل-و، ن-ب-ه. اللمّات الموجودة (رفعة، سمو) ملائمة جداً، لكنّ (امتياز) فيها التباس مع المعنى القانوني الحديث."
  blind_candidates:
    - lemma: "سُؤْدُد"
      generation_method: ishtiqaq
      justification: "من جذر س-و-د على وزن فُعْلُل، يدلّ على المجد والسيادة وعلوّ المنزلة"
    - lemma: "نَبَاهَة"
      generation_method: ishtiqaq
      justification: "من جذر ن-ب-ه، تدلّ على الشرف والشهرة المكتسبة بالتفوّق، ومقاييس اللغة يؤكّد أنّ الأصل يدلّ على ارتفاع وسموّ"
    - lemma: "عَلَاء"
      generation_method: ishtiqaq
      justification: "من جذر ع-ل-و، يدلّ على الرفعة والشرف، وهو مطابق لمفهوم المكانة العالية بسبب التفوّق"
    - lemma: "جَلَال"
      generation_method: ishtiqaq
      justification: "من جذر ج-ل-ل، يدلّ على التناهي في عظم القدر، وفي المعجم الكبير: التناهي في عظم القدر"

stage2_evidence:
  per_lemma:
    - lemma: "اِمْتِيَاز"
      confirm:
        - text: "«امْتِيَاز من (م ي ز) ظهور الفضل والانفصال»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(11) شهرة؛ امتياز؛ بُعد صيت a family of note»"
          source: "المورد الحديث (2008) — مدخل note"
        - text: "«(6) امتياز؛ تفوُّق»"
          source: "المورد الحديث (2008) — مدخل distinction"
      contradicts:
        - text: "«تمنح الدولة لفرد أو شركة حق القيام ببعض الأعمال العامة، وتفرض عليه التزامات وشروطا»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "المعنى السائد في المعاجم الاصطلاحية الحديثة هو الحقّ القانوني (concession/privilege) لا الرفعة والتفوّق"
        - text: "«حق أولوية يمنحه القانون على أموال المدين نظرا لسبب الدين»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "المعنى القانوني (privilege) يطغى على معنى التفوّق والرفعة"
      expands:
        - text: "«الْمِيمُ وَالْيَاءُ وَالزَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَزَبُّلِ شَيْءٍ مِنْ شَيْءٍ وَتَزْيِيلِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر م-ي-ز يدلّ على التفريق والفصل، ومنه الامتياز بمعنى التميّز والانفراد بالفضل"

    - lemma: "رِفْعَة"
      confirm:
        - text: "«الشَّرَفُ والسُّمُوُّ والعِزَّةُ, خِلافُ الذِّلَّة والضَّعَة»"
          source: "المعجم الكبير"
        - text: "«الشَّرف وارتفاع القدر والمنزلة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الرَّاءُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى خِلَافِ الْوَضْعِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ر-ف-ع أصل واحد يدلّ على الإعلاء والارتفاع"

    - lemma: "سُمُوّ"
      confirm:
        - text: "«العُلُوُّ والرفعة صاحب السُّموّ: لقب كل أمير (مو)»"
          source: "المعجم الوسيط"
        - text: "«السمو: العلو، وسماء كل شيء أعلاه، ومنه سمت همته إلى المعالي إذا طلب العز والشرف»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«السِّينُ وَالْمِيمُ وَالْوَاوُ أَصْلٌ يَدُلُّ عَلَى الْعُلُوِّ. يُقَالُ سَمَوْتُ، إِذَا عَلَوْتَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر س-م-و أصل يدلّ على العلوّ والارتفاع"

    - lemma: "سُؤْدُد"
      confirm:
        - text: "«سُؤْدَد من (س و د) مَجْد»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«فَأَمَّا السِّيَادَةُ فَقَالَ قَوْمٌ: السَّيِّدُ: الْحَلِيمُ... إِنَّمَا سُمِّيَ سَيِّدًا لِأَنَّ النَّاسَ يَلْتَجِئُونَ إِلَى سَوَادِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "السؤدد مرتبط بالسيادة والرياسة أكثر من مجرّد علوّ المكانة بالتفوّق"

    - lemma: "نَبَاهَة"
      confirm:
        - text: "«الشَّرَف الشُّهْرَة الفِطنة»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الشَّرَف الشُّهْرَة الفِطنة»"
          source: "المعجم الوسيط"
          conflict: "المعنى الثالث (الفطنة) يطغى في الاستعمال المعاصر، فيقال: نباهة فلان بمعنى ذكائه لا شرفه"
      expands:
        - text: "«النُّونُ وَالْبَاءُ وَالْهَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَسُمُوٍّ. وَمِنْهُ رَجُلٌ نَبِيهٌ، أَيْ شَرِيفٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي يدعم معنى الشرف والارتفاع"

    - lemma: "عَلَاء"
      confirm:
        - text: "«الرّفعة والشَّرَف»"
          source: "المعجم الوسيط"
        - text: "«(1) «أ» سُمُوّ؛ علاء»"
          source: "المورد الحديث (2008) — مدخل eminence"
      expands:
        - text: "«الْعَيْنُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ... أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى السُّمُوِّ وَالِارْتِفَاعِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ع-ل-و أصل واحد يدلّ على السموّ والارتفاع"

    - lemma: "جَلَال"
      confirm:
        - text: "«التَّناهِي في عِظَمِ القَدْر»"
          source: "المعجم الكبير"
        - text: "«من (ج ل ل) المكانة والتنزه والصغائر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«الجلال من الصفات ما يتعلق بالقهر والغضب، وقال الراغب: الجلالة عظم القدر وبغيرها التناهي فيه، وخص به تعالى فقيل ذو الجلال، ولم يستعمل في غيره»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الراغب نصّ على أنّ الجلالة (بمعنى التناهي في العظمة) خُصّت بالله تعالى ولم تُستعمل في غيره"
      expands:
        - text: "«جَلَّ الشَّيْءُ: عَظُمَ، وَجُلُّ الشَّيْءِ مُعْظَمُهُ. وَجَلَالُ اللَّهِ: عَظَمَتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدلّ على العظمة، لكنّه ارتبط بالسياق الإلهي"

stage3_analysis:
  per_lemma:
    - lemma: "اِمْتِيَاز"
      decision: confirmed
      decision_reason: "اللفظة مشتقّة من جذر م-ي-ز الدالّ على التفريق والفصل، وامتاز بمعنى تميّز وظهر فضله ثابت لغوياً، وإن كان الاستعمال الاصطلاحي الحديث (concession) يطغى. المورد الحديث يوثّق المعنى المطلوب (تفوّق، بُعد صيت)، وموسوعة السلطان قابوس تؤكّد: ظهور الفضل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على التميّز والانفراد بالفضل عن الأقران، أقرب إلى distinction/preeminence"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِمْتِيَاز"

    - lemma: "رِفْعَة"
      decision: confirmed
      decision_reason: "مؤكّدة بأدلّة قوية من المعجم الوسيط والمعجم الكبير. معنى الشرف وارتفاع القدر والمنزلة مطابق تماماً لمفهوم المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على ارتفاع القدر والمنزلة والشرف، وهي خلاف الذلّة والضَّعة، أقرب إلى eminence بمعناه العامّ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِفْعَة"

    - lemma: "سُمُوّ"
      decision: confirmed
      decision_reason: "مؤكّدة بأدلّة قوية من المعجم الوسيط والمناوي ومقاييس اللغة. العلوّ والرفعة، ولقب صاحب السموّ يؤكّد الدلالة على المكانة العالية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على العلوّ المطلق في المكانة والقدر، وهو أعمّ من الرفعة، ويُستعمل لقباً رسمياً (صاحب السموّ)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُمُوّ"

    - lemma: "عَلَاء"
      source: stage1
      decision: confirmed
      decision_reason: "المعجم الوسيط يعرّفها بـ«الرفعة والشرف» وهو مطابق تماماً لمفهوم المجموعة. المورد الحديث يترجم eminence بـ«سُمُوّ؛ علاء». اللفظة من جذر ع-ل-و الدالّ على السموّ والارتفاع، وهي إضافة قيّمة لتغطية الفارق الدلالي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الرفعة والشرف المتوارثَيْن أو المكتسبَيْن، وهو أقرب إلى eminence بمعنى السموّ الشخصي والمكانة الرفيعة"
      actions:
        - command: create_entry
          params:
            lemma: "عَلَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "سُؤْدُد"
      source: stage1
      decision: removed
      decision_reason: "السؤدد يدلّ على المجد والسيادة والرياسة على القوم، وهو أقرب إلى lordship/sovereignty منه إلى eminence. المعنى مرتبط بالزعامة لا بمجرّد علوّ المكانة بالتفوّق الملحوظ."

    - lemma: "نَبَاهَة"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ الأصل اللغوي (ن-ب-ه) يدلّ على الارتفاع والسموّ، فإنّ الاستعمال المعاصر يغلب عليه معنى الفطنة والذكاء، ممّا يسبّب التباساً دلالياً مع المفهوم المطلوب."

    - lemma: "جَلَال"
      source: stage1
      decision: removed
      decision_reason: "الجلال في الاستعمال الشائع مخصوص بعظمة الله تعالى (ذو الجلال والإكرام)، والراغب نصّ على تخصيصه بالله. استعماله للبشر قد يوقع في سوء فهم ثقافي وديني."

