# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:

  # أ. التوليد الأعمى — من الملف المُقنَّع فقط (قبل الاطلاع على اللمّات)
  # المفهوم المستخلَص: فاعل بشري متخصص داخل مهنة المساحة، يضع أعمدةً
  # في الأرض لتحديد نقاط الخط الميداني بصرياً.

  blind_candidates:
    - lemma: "وَاتِدُ الخَطِّ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «وَاتِد» (اسم فاعل من وتَّدَ: رسَّخَ وتداً في الأرض)
        و«الخَطّ» (survey line). الوتد هو الشيء المضروب في الأرض، وعمود
        القياس يُركَّز في التربة على خط المسح — فالمصطلح يصف الوظيفة
        الجوهرية للمساح بدقة مرئية. يجتاز اختبار السكّ: «واتد» لا يمكن
        إبداله بمرادف («ناصب الخط»، «راكز الخط») دون تغيير الدلالة.

    - lemma: "مُعَلِّمُ الخُطُوطِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُعَلِّم» (اسم فاعل من علَّمَ: وضع علامةً) و«الخطوط»
        (جمع خطّ المساحي). يصف وظيفة الشخص الذي يُجسِّد الخطوط المساحية
        بعلامات مرئية على الأرض. الجمع «الخطوط» يُفيد الاستمرارية والتعدد
        الوظيفي.

    - lemma: "الرَّائِزُ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر «روز» (راز: اختبر وخبر وفحص). الرائز: المُختبِر
        الفاحص. في سياق المساحة الميدانية قد يُطلق على من يفحص الأرض
        ويختبر نقاطها. الوزن «فَاعِل» يناسب اسم الفاعل للمهنة. يُميّز
        الوظيفة التقنية (الفحص والاختبار) عن مجرد الوصف المكاني.

    - lemma: "مُشَيِّرُ المَسَاحَةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُشَيِّر» (اسم فاعل من شيَّر: أشار ووضع إشارةً)
        و«المساحة» (Surveying). يصف الشخص الذي يضع الإشارات المرئية
        (الأعمدة الملوّنة) في عملية المسح الأرضي. مرتبط بالوظيفة
        البصرية-التوجيهية لعمود القياس.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الموجودة «مساح خطي» خالية من التشكيل الكامل؛ يلزم تحديثها إلى «مَسَّاحٌ خَطِّيٌّ»"
      - "صيغة «مَسَّاح» (فَعَّال للمهن) صحيحة، لكن التشكيل المعتمد لا يُثبِّت تضعيف السين"
      - "لفظ «خَطِّيّ» في المعاجم العلمية يُقابل «linear» الرياضية بالدرجة الأولى، مما قد يُوهم بـ«مساح خطي التفكير» أو «خطي الأسلوب»؛ غير أن السياق المساحي يُحدِّد المعنى"
      - "«عمود القياس» في التعريف الحالي مصطلح غير مُقنَّن في المعاجم المتخصصة؛ الأكثر شيوعاً «عمود الإشارة» أو «الشاهد المساحي»"
      - "المجموعة تضم لمّةً واحدة فقط؛ غياب الترادف يُضعف الإثراء الدلالي"
    observations: >
      المجموعة تُمثِّل دوراً مهنياً تقنياً فرعياً داخل مهنة المساحة: الشخص
      الذي يعمل ميدانياً بعمود الإشارة لتجسيد الخطوط المساحية على الأرض.
      الأب المباشر (مساح / مهندس مساحة) صحيح ومناسب. الترجمة «مساح خطي»
      مقبولة اصطلاحياً كمقابل لـ«line surveyor»، وإن كان التركيب الإضافي
      «مَسَّاحُ الخَطِّ» أدق من الناحية الصرفية. التعريف العربي الحالي مناسب
      في مضمونه لكنه يحتاج تدقيقاً في مصطلح «عمود القياس».


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# ميزانية الاستعلامات المُستخدَمة: ٥ استعلامات
# ١. مطابقة دقيقة دفعية (الموجودة + المرشحات + كلمات مفتاحية)
# ٢. جسر إنجليزي (line surveyor, surveyor, range pole, land surveyor)
# ٣. FTS عربي (مساح خطي، عمود القياس، خطي، مساحة خطية)
# ٤. مقاييس اللغة (مسح، وتد، روز، خط)
# ٥. جذر خط في المقاييس (استعلام إضافي)
stage2_evidence:

  per_lemma:

    - lemma: "مَسَّاحٌ خَطِّيٌّ"
      confirm:
        - text: "«(المَسَّاحُ) من حرفته المساحة»"
          source: "المعجم الوسيط"
        - text: "«(المساح) من حرفته المساحة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
        - text: "«مسّاح — field surveyor» (مجال: الهندسة المدنية)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
        - text: "«خطيّ — linear» (مجال: الرياضيات والفلك)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — ARABTERM"
        - text: "«خطي — linear» (مجال: الجيولوجيا)"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000) — ARABTERM"
      expands:
        - text: "«مساح أراضٍ — land surveyor» (مجال: التجارة والمحاسبة)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — ARABTERM"
          addition: >
            يُثبّت استخدام «مساح» كجنس قريب لأنواع متخصصة من المساحين
            (مساح أراضٍ، مساح ميداني)؛ «مساح خطي» ينتظم في هذا النسق الإضافي
        - text: "«مسّاح — topographer»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012) — ARABTERM"
          addition: >
            يكشف عن مرادف آخر للمساح (الطبوغرافي)، ويُفيد في تحديد الفرق
            بين أنواع المساحين المتخصصين

    - lemma: "وَاتِدُ الخَطِّ"
      evidence_status: "no_material_found"

    - lemma: "مُعَلِّمُ الخُطُوطِ"
      evidence_status: "no_material_found"

    - lemma: "الرَّائِزُ"
      expands:
        - text: >
            «(رَوَزَ) الرَّاءُ وَالْوَاوُ وَالزَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ تَدُلُّ
            عَلَى اخْتِبَارٍ وَتَجْرِيبٍ. يُقَالُ رُزْتُ الشَّيْءَ أَرُوزُهُ،
            إِذَا جَرَّبْتَهُ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يُثبّت الجذر «روز» بمعنى الاختبار والتجريب، لكن لا يُثبّت
            استخدام «الرائز» مصطلحاً مساحياً. الدلالة تقتصر على الاختبار
            العام ولا تُحيل إلى وضع الأعمدة أو تحديد المواقع الميدانية

    - lemma: "مُشَيِّرُ المَسَاحَةِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "مساح خطي"
      decision: confirmed
      decision_reason: >
        المصطلح مُكوَّن من «مَسَّاح» (فَعَّال للمهنة، موثَّق في المعجم
        الوسيط والمعاجم التقنية) و«خَطِّيّ» (نسبة إلى الخط، موثَّقة في
        المعاجم التقنية بمعنى linear/line). التعبير المركب «مساح خطي» مقابل
        مُستقرّ لـ«line surveyor» في السياق المساحي الهندسي، ويجتاز اختبار
        السكّ (لا يمكن إبدال «خطي» بـ«مستوي» أو «عمودي» دون إفساد المعنى
        التخصصي). التشكيل يحتاج تحديثاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      morphology_check: >
        «مَسَّاح» على وزن فَعَّال مناسب للحِرَف والأشخاص. «خَطِّيّ» نسبة صحيحة
        من «خَطّ». الوصف يؤدي دور الفصل النوعي لتمييز هذا النوع من المساحين.
      borrowing_check:
        lexical: "عربي خالص — لا اقتراض"
        calque: >
          «line surveyor» → «مساح خطي» ترجمة حرفية مقبولة بنيوياً؛
          الهيكل الإضافي-الوصفي واضح ولا يُشوّه الدلالة
        blind_translation: >
          «خطي» قد يُوهم بـ«linear» الرياضية لكن السياق المهني يُحدّد
          المعنى المساحي بوضوح
      quality_gate:
        regularity: "مطّرد — اسم فاعل + نسبة"
        circulation_ease: "جيد — مقطعان مألوفان"
        aptness: "دقيق في السياق المساحي"
        heritage_preference: "كلاهما عربيان أصيلان"
        arabic_preference: "نعم"
        derivability: "مشتقّ بصورة قياسية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَسَّاحٌ خَطِّيٌّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "وَاتِدُ الخَطِّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على المصطلح المركب في أي من قواعد البيانات المعجمية.
        رغم دقة الوصف الوظيفي وثراء الجذر (وتد = رسّخ وتداً)، يبقى
        التعبير عبارةً وصفية حرة لم تُسكَّ كوحدة معجمية ثابتة. اختبار
        التثبيت المعجمي: غير مُسجَّل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُعَلِّمُ الخُطُوطِ"
      source: stage1
      decision: removed
      decision_reason: >
        غير موثَّق في أي معجم كمصطلح اصطلاحي ثابت. «مُعَلِّم» في العربية
        المعاصرة غلب عليه معنى «المدرّس»، مما يُوجِد اشتراكاً لفظياً
        مُربِكاً في سياق المساحة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "الرَّائِزُ"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر «روز» موثَّق في مقاييس اللغة بمعنى الاختبار والتجريب، وهي
        دلالة قريبة من القياس والفحص. غير أن «الرائز» لم يُوظَّف اصطلاحياً
        في سياق المساحة الأرضية في أي مصدر من قواعد البيانات المستعلَمة.
        الانتقال من «الاختبار العام» إلى «وضع أعمدة الإشارة» يحتاج توثيقاً
        غير متوفر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُشَيِّرُ المَسَاحَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        غير موثَّق في المعاجم ولا في قواعد المصطلحات التقنية. التعبير
        وصفي حر لا يرقى إلى مستوى المصطلح المسكوك.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
# تُعالَج فقط اللمّة المؤكَّدة: «مَسَّاحٌ خَطِّيٌّ»
stage4_content:

  definition:
    current: "مساح يحدد المواقع باستخدام عمود القياس"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي قريب من الصواب لكنه يفتقر إلى:
        (١) تدقيق الجنس القريب: «مساح» وحده غير كافٍ — الفصل النوعي يحتاج
        التخصيص داخل فريق المساحة.
        (٢) «عمود القياس» مصطلح غير مُقنَّن؛ المُعادِل الشائع في الهندسة
        المساحية العربية هو «عمود الإشارة» أو «الشاهد المساحي».
        (٣) غياب الإشارة إلى البُعد الميداني (التنفيذ على الأرض لا الحسابي).
    authored:
      - type: terminological
        text: >
          مَسَّاحٌ مُتَخَصِّصٌ يَتَوَلَّى تَعْيِينَ النُّقَاطِ وَضَبْطَ
          خُطُوطِ المَسْحِ مَيْدَانِياً، مُسْتَعِيناً بِأَعْمِدَةِ
          الإِشَارَةِ الْمِسَاحِيَّةِ لِتَحْدِيدِ الاتِّجَاهَاتِ
          وَتَجْسِيدِ الْخُطُوطِ عَلَى الْأَرْضِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          في فرق المساحة الميدانية يُكلَّف المَسَّاحُ الخَطِّيُّ بالعمل
          بالقرب من جهاز المسح (الثيودوليت أو محطة القياس الشامل)، إذ
          يضع أعمدة الإشارة الملوَّنة (حمراء-بيضاء) على الخطوط المرسومة
          في الخرائط التخطيطية، مما يُتيح للمساح الرئيسي رؤيتها بصرياً
          من مسافات بعيدة وتحديد الإحداثيات الدقيقة
