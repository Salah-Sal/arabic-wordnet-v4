        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"ترقيق","root":"رقق","maqayis":"«الرَّاءُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا صِفَةٌ تَكُونُ مُخَالِفَةً لِلْجَفَاءِ، وَالثَّانِي اضْطِرَابُ شَيْءٍ مَائِعٍ.»"},{"word":"المعدن","root":"عدن","maqayis":"«الْعَيْنُ وَالدَّالُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الْإِقَامَةِ... وَمِنَ الْبَابِ الْمَعْدِنُ: مَعْدِنُ الْجَوَاهِرِ.»"}]}'
    - command: set_metadata
