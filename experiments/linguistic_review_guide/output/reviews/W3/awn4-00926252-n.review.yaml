stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (ترقيق المعدن) صحيحة لكنها تعبير مركب صريح، ويمكن إضافة المصادر المفردة التي تؤدي نفس الدلالة."
    observations: "التعريف يركز على إنتاج الرقائق المعدنية (foil) بالطرق أو القطع، وهي عملية تُعرف في الصناعة والصياغة بالترقيق أو التطريق."
  blind_candidates:
    - lemma: "تَرْقِيقٌ"
      generation_method: ishtiqaq
      justification: "مصدر يدل على جعل الشيء رقيقاً، ويناسب عملية طرق المعدن ليصبح أوراقاً رقيقة (رقائق)."
    - lemma: "تَطْرِيقٌ"
      generation_method: ishtiqaq
      justification: "مصدر يدل على ضرب المعدن وتمديده بالمطرقة ليصبح في شكل صفائح أو رقائق."
    - lemma: "تَصْفِيحٌ"
      generation_method: ishtiqaq
      justification: "مصدر يدل على تحويل المادة إلى صفائح."
    - lemma: "تَوْرِيقٌ"
      generation_method: majaz
      justification: "استعارة من أوراق الشجر للدلالة على تحويل المعدن إلى أوراق رقيقة جداً (foliation)."

stage2_evidence:
  per_lemma:
    - lemma: "ترقيق المعدن"
      confirm:
        - text: "الترقيق: ترقيق المعادن أو تطريقها لتصبح رقائق أو صفائح"
          source: "المورد الحديث (2008)"
    - lemma: "تَرْقِيقٌ"
      confirm:
        - text: "الترقيق: ترقيق المعادن أو تطريقها لتصبح رقائق أو صفائح\n(foliation)"
          source: "المورد الحديث (2008)"
    - lemma: "تَطْرِيقٌ"
      confirm:
        - text: "الترقيق: ترقيق المعادن أو تطريقها لتصبح رقائق أو صفائح"
          source: "المورد الحديث (2008)"
        - text: "طَرَّقَ الصائغ الذهب: مدده ورققه"
          source: "المعجم الكبير"
    - lemma: "تَصْفِيحٌ"
      contradicts:
        - text: "طلاء معدني (plating of metal) \n عملية تقسيم الذاكرة إلى صفحات (paging)"
          source: "موقع ArabTerm"
          conflict: "يُستخدم أكثر للدلالة على الطلاء المعدني (plating) أو التصفيح الإنشائي (lamination/armouring) وليس بالضرورة لإنتاج الرقائق الدقيقة جداً."
    - lemma: "تَوْرِيقٌ"
      contradicts:
        - text: "تزيين بنقوش تمثل أوراق نبات. زخرف شبيه بورقة نبات.\nترقيم ورقات المخطوطة."
          source: "المورد الحديث (2008)"
          conflict: "الكلمة مستقرة للدلالة على ترقيم الأوراق أو الزخارف النباتية، ولا تستخدم في سياق المعادن إلا نادراً."

stage3_analysis:
  per_lemma:
    - lemma: "ترقيق المعدن"
      decision: confirmed
      decision_reason: "مصطلح دقيق وواضح يصف العملية بشكل مباشر، وهو مطابق لتعريف المجموعة الترادفية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرْقِيقُ المَعْدِنِ"

    - lemma: "تَرْقِيقٌ"
      source: stage1
      decision: confirmed
      decision_reason: "هو المصدر المفرد القياسي الذي يعبر عن هذه العملية الصناعية الدقيقة، ومؤيد بالمعاجم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَرْقِيقٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَطْرِيقٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر دقيق يصف عملية تمديد المعدن بالضرب (الطرق) لجعله رقائق، وهو وارد في المعاجم لوصف عمل الصائغ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "تَطْرِيقٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَصْفِيحٌ"
      source: stage1
      decision: removed
      decision_reason: "يختص بالتغطية بألواح أو طلاء معدني (plating/armouring) وليس بصناعة الرقائق (foil)."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَوْرِيقٌ"
      source: stage1
      decision: removed
      decision_reason: "يختص بترقيم المخطوطات أو الزخرفة النباتية، واستخدامه للمعادن غير شائع."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "إنتاج الرقائق عن طريق قطع أو طرق المعدن إلى أوراق رقيقة"
    assessment:
      decision: retain
      reason: "التعريف دقيق وواضح ويشرح المفهوم بشكل سليم متوافق مع التعريف الإنجليزي والأدلة المعجمية."
  examples:
    per_lemma:
      - lemma: "تَرْقِيقُ المَعْدِنِ"
        examples:
          - text: "تتطلب عملية تَرْقِيقِ المَعْدِنِ مهارة عالية للحصول على أوراق ذهبية بالغة الدقة."
            type: usage
      - lemma: "تَرْقِيقٌ"
        examples:
          - text: "تُستخدَم آلات حديثة في تَرْقِيقِ الذهب وصياغته."
            type: usage
      - lemma: "تَطْرِيقٌ"
        examples:
          - text: "يُعَدُّ التَّطْرِيقُ من أقدم العمليات الصناعية المستخدمة في تشكيل المعادن."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تتطلب عملية تَرْقِيقِ المَعْدِنِ مهارة عالية للحصول على أوراق ذهبية بالغة الدقة."}

stage5_enrichment:
  per_entry:
    - lemma: "تَرْقِيقُ المَعْدِنِ"
      entry_id: "{auto}"
      roots:
        - word: "ترقيق"
          root: "رقق"
          maqayis_quote: "«الرَّاءُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا صِفَةٌ تَكُونُ مُخَالِفَةً لِلْجَفَاءِ، وَالثَّانِي اضْطِرَابُ شَيْءٍ مَائِعٍ.»"
        - word: "المعدن"
          root: "عدن"
          maqayis_quote: "«الْعَيْنُ وَالدَّالُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى الْإِقَامَةِ... وَمِنَ الْبَابِ الْمَعْدِنُ: مَعْدِنُ الْجَوَاهِرِ.»"
    - lemma: "تَرْقِيقٌ"
      entry_id: "{auto}"
      root: "رقق"
      maqayis_quote: "«الرَّاءُ وَالْقَافُ أَصْلَانِ: أَحَدُهُمَا صِفَةٌ تَكُونُ مُخَالِفَةً لِلْجَفَاءِ، وَالثَّانِي اضْطِرَابُ شَيْءٍ مَائِعٍ.»"
    - lemma: "تَطْرِيقٌ"
      entry_id: "{auto}"
      root: "طرق"
      maqayis_quote: "«الطَّاءُ وَالرَّاءُ وَالْقَافُ أَرْبَعَةُ أُصُولٍ، أَحَدُهَا: الْإِتْيَانُ مَسَاءً، وَالثَّانِي: الضَّرْبُ، وَالثَّالِثُ: جِنْسٌ مِنِ اسْتِرْخَاءِ الشَّيْءِ، وَالرَّابِعُ: خَصْفُ شَيْءٍ عَلَى شَيْءٍ.»"

  per_sense:
    - lemma: "تَرْقِيقُ المَعْدِنِ"
      sense_id: "{auto}"
      nuance: "تعبير مركب صريح يوضح المادة التي يقع عليها الفعل."
      mwe: true
    - lemma: "تَرْقِيقٌ"
      sense_id: "{auto}"
      nuance: "مصدر مفرد يركز على نتيجة العملية المتمثلة في جعل المادة رقيقة."
      mwe: false
    - lemma: "تَطْرِيقٌ"
      sense_id: "{auto}"
      nuance: "مصدر مفرد يركز على الآلية الميكانيكية للعملية، وهي الضرب وتمديد المعدن."
      mwe: false

  synset:
    cultural_fit: native

  actions:
