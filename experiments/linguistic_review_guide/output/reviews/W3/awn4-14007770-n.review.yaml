# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14007770-n — partial darkness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «شبه ظلام» تركيب إضافي وصفي حرّ وليست مصطلحاً مسكوكاً — يمكن إبدال «شبه» بـ«نصف» أو «بعض» والتعبير يبقى صالحاً كوصف (يفشل في اختبار السكّ)"
      - "اللمّة بدون تشكيل"
      - "التعريف العربي «ظلام جزئي» مقتضب جداً ويبدو ترجمة حرفية للتعريف الإنجليزي"
    observations: "المفهوم — ظلام ناقص لا يبلغ حدّ الإظلام التام — له ألفاظ عربية أصيلة متعددة في التراث المعجمي، أبرزها الغَبَش والغَلَس، وكلاهما يدلّ على ظلمة ممزوجة بضوء. التعبير «شبه ظلام» عبارة وصفية شارحة لا ترقى إلى مصطلح معجمي ثابت."
  blind_candidates:
    - lemma: "غَبَش"
      generation_method: majaz
      justification: "الغَبَش في الأصل بقيّة ظلام الليل أو ظلمة آخره الممزوجة ببياض الفجر، وهو ظلام ناقص بطبيعته فيصلح مجازاً للدلالة على كل ظلام جزئي"
    - lemma: "غَلَس"
      generation_method: majaz
      justification: "الغَلَس ظلام آخر الليل إذا اختلط بضوء الصباح، فهو تعبير عن حالة وسطى بين الظلام والنور، أي ظلام جزئي بالمعنى الدقيق"
    - lemma: "غُبْشَة"
      generation_method: ishtiqaq
      justification: "من الجذر غ ب ش على وزن فُعْلة للدلالة على الهيئة والحالة، تفيد حالة الظلام الناقص"
    - lemma: "غَسَق"
      generation_method: majaz
      justification: "الغَسَق أول ظلمة الليل عند مغيب الشفق، وهو بداية الظلام حين لا يكون تامّاً بعد"

stage2_evidence:
  per_lemma:
    - lemma: "شِبْهُ ظَلَام"
      evidence_status: "no_material_found"

    - lemma: "غَبَش"
      confirm:
        - text: "«الغَبَش: ظلمة جزئية.»"
          source: "المورد الحديث (2008)"
        - text: "«غبش = half-light; semo-darkness»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "«(الغبش) بَقِيَّة اللَّيْل وظلمة آخِره»"
          source: "المعجم الوسيط"
        - text: "«الْغَبَشُ بِفَتْحَتَيْنِ الْبَقِيَّةُ مِنَ اللَّيْلِ وَقِيلَ ظُلْمَةُ آخِرِ اللَّيْلِ»"
          source: "مختار الصحاح للرازي"
        - text: "«الغَبَشُ بالتحريك: البقيَّة من الليل، ويقال ظلمة آخر الليل»"
          source: "تاج اللغة وصحاح العربية للجوهري"
      contradicts:
        - text: "«الْغَبَشُ: شِدَّةُ الظُّلْمَةِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "ابن فارس يجعل الغبش شدّة الظلمة لا نقصانها، لكنّ أبا عبيد (الذي نقله ابن فارس نفسه) يفسّره بالبقية، والجمهور على البقية"
        - text: "«شدة الظلمة»"
          source: "كتاب العين"
          conflict: "الخليل يفسّره بالشدة، خلافاً لجمهور المعجميين"
      expands:
        - text: "«غَبَش... ضوء محدود غير لامع... بقيَّة اللَّيل»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يوسّع الدلالة إلى مطلق الضوء المحدود غير اللامع"
        - text: "«غبِش اللَّيلُ: خالط بياضُ الفجرِ بقيَّةَ ظُلمَتِه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يوضّح أنّ الغبش حالة امتزاج بين الظلمة والضوء"
        - text: "«الغَبَشُ: شِدَّةُ الظُّلْمَةِ. وَقيل: هُوَ بقّية اللَّيْل. وَقيل: هُوَ مِمَّا يَلِي الصُّبح. وَقيل: هُوَ حِين يُصبح»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
          addition: "يجمع الأقوال ويبيّن تعدد الاستعمالات"

    - lemma: "غَلَس"
      confirm:
        - text: "«الغَلَسُ: ظلمة آخر الليل»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«الغَلَسُ، وَذَلِكَ ظَلَامُ آخَرِ اللَّيْلِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الغَلَس: ظُلْمَةُ آخِرِ اللَّيْلِ إِذَا اخْتَلَطَتْ بِضَوْءِ الصَّبَاحِ»"
          source: "النهاية في غريب الحديث والأثر لابن الأثير"
        - text: "«الْغَلَسُ بِفَتْحَتَيْنِ ظَلَامُ آخِرِ اللَّيْلِ»"
          source: "المصباح المنير للفيّومي"
        - text: "«غلَس: ظُلمة آخر الليل إذا اختلطت بضوء الصَّباح»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«غَلَسِيّ = crepuscular (twilight)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُشتقّ منه النسبة غَلَسِيّ في المصطلحية الطبية الحديثة بمعنى شفقي"

    - lemma: "غُبْشَة"
      confirm:
        - text: "«غُبْشة: مصدر غبِشَ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«غبِشَ يَغبَش، غَبَشًا وغُبْشةً، فهو أغبشُ وغَبِش»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "غُبْشَة مصدر للفعل غبِش لا اسم مستقل للحالة"

    - lemma: "غَسَق"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "شِبْهُ ظَلَام"
      decision: removed
      decision_reason: "تركيب وصفي حرّ يفشل في اختبار السكّ (يمكن إبدال «شبه» بـ«نصف» أو «جزء من» والعبارة تبقى صالحة)، ولا يوجد له أيّ توثيق معجمي. الأولى استعمال المصطلحات العربية الأصيلة كالغَبَش والغَلَس."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غَبَش"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل وثّقه المورد الحديث بالتعريف الحرفي «ظلمة جزئية» وهو المعنى المطلوب بالضبط، ويقابله في معجم الفيزياء semi-darkness. الجمهور من المعجميين القدماء على أنّه بقيّة الليل أو ظلمة آخره، وهو ظلام ناقص بطبيعته."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الظلمة الناقصة أو بقيّة الظلام عموماً، ويمتدّ إلى كلّ حالة ظلام جزئي دون تقييد زمني صارم"
      actions:
        - command: create_entry
          params:
            lemma: "غَبَش"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "غَلَس"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح ثابت أجمعت عليه المعاجم الكلاسيكية والحديثة بمعنى ظلام آخر الليل الممتزج بنور الفجر، وهو نوع مخصوص من الظلام الجزئي. يُشتقّ منه غَلَسِيّ في المصطلحية الطبية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بظلام آخر الليل حين يمتزج ببياض الفجر، فهو مقيّد بالسياق الزمني (ما قبل الصبح) بخلاف الغَبَش الأعمّ"
      actions:
        - command: create_entry
          params:
            lemma: "غَلَس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "غُبْشَة"
      source: stage1
      decision: removed
      decision_reason: "مصدر للفعل غبِش وليست اسماً مستقلّاً للحالة، والاكتفاء بـ«غَبَش» أولى لأنّه الاسم المعجمي الثابت الدالّ على المفهوم"

    - lemma: "غَسَق"
      source: stage1
      decision: removed
      decision_reason: "الغَسَق أوّل ظلمة الليل عند مغيب الشفق، وهو بداية دخول في الظلام الكامل لا حالة ظلام جزئي مستقرّة. المعاجم تجعله أقرب إلى الظُّلمة منه إلى بقاياها."

stage4_content:
  definition:
    current: "ظلام جزئي"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويبدو ترجمة حرفية مباشرة للإنجليزية (partial darkness)، لا يميّز المفهوم عن فوقه (ظلام) تمييزاً كافياً ولا يصف طبيعة الحالة"
    authored:
      - type: terminological
        text: "ظُلْمَةٌ ناقصةٌ يُخالطُها شيءٌ من الضوءِ فلا يكونُ غيابُ النُّورِ فيها تامّاً"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما بَقِيَ من الظَّلامِ مُمتزجاً ببَياضٍ أو ضوءٍ خفيفٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "ظُلْمَةٌ ناقصةٌ يُخالطُها شيءٌ من الضوءِ فلا يكونُ غيابُ النُّورِ فيها تامّاً"

  examples:
    per_lemma:
      - lemma: "غَبَش"
        examples:
          - text: "كان السائقون يتوخَّوْن الحذرَ في غَبَشِ الفجرِ حين لا تتبيَّنُ العينُ معالمَ الطريق."
            type: usage
      - lemma: "غَلَس"
        examples:
          - text: "خرج المصلُّون إلى المسجدِ بغَلَسٍ لأداءِ صلاةِ الفجرِ قبل أن ينبلجَ الصبحُ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "كان السائقون يتوخَّوْن الحذرَ في غَبَشِ الفجرِ حين لا تتبيَّنُ العينُ معالمَ الطريق."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "خرج المصلُّون إلى المسجدِ بغَلَسٍ لأداءِ صلاةِ الفجرِ قبل أن ينبلجَ الصبحُ."

