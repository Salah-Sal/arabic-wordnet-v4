# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14041789-n
# grogginess: a groggy state resulting from weariness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "دَوران في التعريف: لفظ «ترنح» مُستخدَم في التعريف وهو أيضاً لمّة في المجموعة"
      - "لمّة «دوار» تدل طبّياً على الدُّوَار (vertigo) وهو حالة مختلفة عن الترنح من الإعياء"
      - "اللمّتان بدون تشكيل"
    observations: "المجموعة تصف حالة من الوهن الجسدي الناتج عن التعب الشديد، يفقد فيها المرء توازنه وتركيزه. المفرط العلوي (hypernym) هو «إرهاق / إعياء / تعب»، مما يؤكد أن المفهوم يقع في حقل الإعياء الجسدي لا في حقل الدوار الطبي. لفظ «ترنح» (مصدر تَرَنَّحَ) يصلح للدلالة على حالة التمايل من التعب، لكنّ «دوار» (vertigo) مفهوم مختلف يتعلق بإحساس دوران المحيط، لا بالوهن من الإرهاق."
  blind_candidates:
    - lemma: "فُتُور"
      generation_method: ishtiqaq
      justification: "من جذر ف ت ر على وزن فُعُول (مصدر فَتَرَ). يدل على ضعف بعد قوة واسترخاء في الجسم، وهو أقرب المعاني إلى حالة الوهن والترنح الناتجة عن الإعياء"
    - lemma: "خَدَر"
      generation_method: majaz
      justification: "الخَدَر في الأصل امذلال يغشى الأعضاء، يُزاح مجازياً إلى حالة الثقل والاسترخاء العامّ الناتج عن التعب الشديد"
    - lemma: "وَسَن"
      generation_method: majaz
      justification: "الوَسَن ثقل النوم أو أوله أو النعاس، يُزاح إلى حالة شبيهة بالنعاس تعتري المُتعَب فيفقد صفاء ذهنه وتوازنه"
    - lemma: "كَلَال"
      generation_method: ishtiqaq
      justification: "من جذر ك ل ل على وزن فَعَال (مصدر كَلَّ). يدل على الإعياء والتعب، فالكَلَال هو ما يصيب المرء من وهن بعد جهد"

stage2_evidence:
  per_lemma:
    - lemma: "تَرَنُّح"
      confirm:
        - text: "«فلانٌ: رَنَّح. يقال: تَرَنَّحَ السَّكْرانُ. وتَرَنَّح من التَّعبِ, وتَرَنَّحَ من النُّعاس أو الجوع»"
          source: "المعجم الكبير"
        - text: "«الراء والنون والحاء أصل يدل على تمايل. يقال ترنّح، إذا تمايل كما يترنّح السكران. ويقال رُنِّح فلان، إذا اعتراه وهن في عظامه، فهو مُرنَّح»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(1) مترنِّح [من أثر لكمة إلخ] (2) سَكران»"
          source: "المورد الحديث (ترجمة groggy)"
      expands:
        - text: "«فلان: رنح وللشيء تحرك له وطلبه وعلى فلان مال عليه بالتطاول»"
          source: "المعجم الوسيط"
          addition: "ترنّح يتعدى إلى معانٍ أخرى كالتحرك للشيء وطلبه والتطاول"

    - lemma: "دُوَار"
      contradicts:
        - text: "«الدُّوَارُ: ظلمة تعتري البصر عند القيام، وقيل: هو أن يتخيل الأشياء تدور»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الدُّوَار حالة بصرية (vertigo) لا حالة وهن عام من التعب"
        - text: "«حالة يتخيل لصاحبها أنّ الأشياء تدور عليه وأنّ بدنه ودماغه يدوران فلا يملك أن يثبت ويسكن بل يسقط. والفرق بينه وبين الصرع أنّ الدوار يثبت مدة والصرع يكون دفعة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الدوار حالة طبية محددة (vertigo) تتضمن تخيّل دوران الأشياء، وهذا مختلف عن حالة الترنح من الإعياء"
        - text: "«شِبْهُ الدَّوَرَانِ يَأْخُذُ فى الرَّأْسِ»"
          source: "المعجم الكبير"
          conflict: "تعريف الدوار مرتبط بإحساس الدوران في الرأس لا بالوهن من التعب"
      expands:
        - text: "«الدوران يأخذ في الرأس»"
          source: "المعجم الوسيط"
          addition: "الوسيط يؤكد أن الدوار مرتبط بالرأس تحديداً"

    - lemma: "فُتُور"
      confirm:
        - text: "«الفاء والتاء والراء أصل صحيح يدل على ضعف في الشيء. من ذلك: فتر الشيء يفتر فتوراً. والطرف الفاتر: الذي ليس بحديد شزر»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«عَرأهُ كَسَلٌ وفُتُورٌ واسْتِرْخاءٌ»"
          source: "المعجم الكبير (مادة خَدِرَ)"
      expands:
        - text: "«فتور = lethargy»"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989)"
          addition: "فتور يُقابل lethargy في المصطلحات الحديثة"
        - text: "«(1) فتور الشعور (2) لامبالاة = apathy»"
          source: "المورد الحديث (2008)"
          addition: "فتور يتوسع إلى فتور الشعور واللامبالاة"

    - lemma: "خَدَر"
      confirm:
        - text: "«خَدِرَ خدراً: عراه فتور واسترخاء، خدِر من الشراب أو الدواء، خدر جسمه، خدرت عظامه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الخَدَرُ: عِلّة آلية يحدث في الجسّ اللمسي نُقصاناً»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الخدر في المصطلح الطبي الكلاسيكي = فقد الإحساس اللمسي (numbness)، لا وهن عام من التعب"
        - text: "«الخدر: [في الانكليزية] Numbness [في الفرنسية] Engourdissement بفتح الخاء والدال المهملة، والمعنى ضعف الجسم، وفقدان حاسّة اللّمس»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الخدر numbness/engourdissement، دلالته الاصطلاحية فقد الحسّ لا الوهن من التعب"

    - lemma: "وَسَن"
      contradicts:
        - text: "«الوَسَنُ: النُّعَاسُ، وكذا السِّنَةُ. ورجل وَسْنَانُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الوَسَن = النعاس (drowsiness) وهو حالة قرب من النوم، لا حالة ترنّح من الإعياء"
        - text: "«شدة النوم، أو أوله، أو النعاس»"
          source: "القاموس المحيط"
          conflict: "معاجم متعددة تحصر الوسن في دائرة النوم/النعاس"
      expands:
        - text: "«الوسن: والسنة، الغفلة والفتور»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المناوي يوسع الوسن إلى الغفلة والفتور، لكنه استعمال ثانوي"

    - lemma: "كَلَال"
      evidence_status: "no_material_found"

