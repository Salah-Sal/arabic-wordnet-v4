# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13971834-n
# center stage / centre stage — موقع البروز أو الأهمية
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «بؤرة الاهتمام» تعبير مركب إضافي يدل على محل تركّز الأنظار، وليس بالضرورة على «موقع» بمعنى مرتبة أو منزلة كما في التعريف الإنجليزي"
      - "لمّة «صدارة» بلا تشكيل في المدخل الحالي"
      - "التعريف العربي «موقع البروز أو الأهمية» مقتضب ويحتمل التحسين ليوضّح البعد المجازي للمصطلح الإنجليزي center stage"
    observations: "المجموعة تمثّل مفهوماً مجازياً مستعاراً من المسرح (وسط خشبة المسرح) للدلالة على موقع البروز والاهتمام. اللمّتان الموجودتان تغطّيان جانبين مختلفين: «صدارة» تدل على التقدم والأولية، و«بؤرة الاهتمام» تدل على محل تركّز الأنظار. كلتاهما تصلح للمفهوم مع فارق دلالي واضح."
  blind_candidates:
    - lemma: "صَدَارَة"
      generation_method: ishtiqaq
      justification: "من الجذر «صدر» على وزن فَعَالَة، تدل على التقدم والأولية والبروز في القوم، وهي مناسبة تماماً لمفهوم موقع البروز"
    - lemma: "بُؤْرَةُ الِاهْتِمَامِ"
      generation_method: tarkib
      justification: "تركيب إضافي من «بؤرة» (نقطة التركز) و«الاهتمام»، يدل على محل تركز الأنظار والعناية، وهو المعادل الطبيعي للتعبير الإنجليزي center stage"
    - lemma: "وَاجِهَة"
      generation_method: majaz
      justification: "أصلها مقدمة البناء ووجهه، توسّعت مجازياً للدلالة على موقع الظهور والبروز أمام الناس"
    - lemma: "طَلِيعَة"
      generation_method: ishtiqaq
      justification: "من الجذر «طلع» على وزن فَعِيلَة، تدل على المقدمة والريادة، استعملت في سياق الأدب والفن بمعنى الطليعة المتقدمة"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بُؤْرَةُ الِاهْتِمَامِ"
      confirm:
        - text: "«بؤرة الكلام، الجديدُ فيه المُستَرعي للانتباه»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«التركيز على عنصر معين»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«محدق بصريات يمثل مركزا للاهتمام وقبلة ذات أبعاد تصويرية مضبوطة»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«(البؤرة) الحفرة والحفرة توقد فِيهَا النَّار وَمَا يدّخر (ج) بؤر و(فِي علم الطبيعة) نقطة تتلاقى أَو تتفرق عِنْدهَا الأشعة الضوئية أَو الحرارية أَو الصوتية»"
          source: "المعجم الوسيط"
          addition: "الأصل الحسي للبؤرة هو نقطة تلاقي الأشعة، ومنه امتد المعنى المجازي إلى محل تركز الاهتمام"

    - lemma: "صَدَارَة"
      confirm:
        - text: "«(الصدارة) التَّقَدُّم يُقَال فلَان لَهُ الصدارة فِي الْقَوْم»"
          source: "المعجم الوسيط"
        - text: "«التَّقَدُّمُ. يقالُ: فلانٌ لهُ الصُّدارةُ فى القوم»"
          source: "المعجم الكبير"
        - text: "«وَرَد في القاموس: وصدور الوادي أعاليه ومقادمه .. جمع صَدَارة وفي التاج: الصَّدَارة بالفتح: التقدم وقد استعملها النحاة في كتبهم ... ودونتها المعاجم الحديثة، مما يدل على فصاحتها»"
          source: "معجم الصواب اللغوي"
        - text: "«تَصَدَّر — limelight (to be in)»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"

    - lemma: "وَاجِهَة"
      contradicts:
        - text: "«واجِهَة المنزل — الرأي: مرفوضة — لعدم ورودها في المعاجم القديمة بهذا المعنى. المعنى: ما استقبلْتَه منه — الصواب والرتبة: واجِهَة المنزل [فصيحة]»"
          source: "معجم الصواب اللغوي"
          conflict: "الواجهة تدل على السطح الأمامي للبناء أو الشيء، وليس على مرتبة أو موقع بروز معنوي"
      expands:
        - text: "«façade — واجهة»"
          source: "المعجم الموحد للمصطلحات المهنية"
          addition: "الاستعمال الغالب في المعاجم المتخصصة هو المعنى المادي (واجهة بناء) أو التقني (واجهة بينية)"

    - lemma: "طَلِيعَة"
      confirm:
        - text: "«مُقدّمة حركة أدبية تقطع مع الوضع القائم لجمالية، وترتبط بإصدار بيانات على غرار السوريالية وكل الحركات والتيارات المتزعمة لأفكار وأساليب جديدة»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      contradicts:
        - text: "«صَدْر؛ مُقَدَّم؛ طليعة — forefront»"
          source: "المورد الحديث"
          conflict: "الطليعة تدل على الريادة والتقدم في مجال ما (avant-garde/forefront)، وليس على موقع البروز والاهتمام العام (center stage)"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "بُؤْرَةُ الِاهْتِمَامِ"
      decision: confirmed
      decision_reason: "تعبير اصطلاحي ثابت مسجّل في معاجم اللسانيات والإعلام، يدل على محل تركز الأنظار والعناية، ويطابق المفهوم الإنجليزي center stage من حيث الدلالة على موقع البروز"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تركّز على جانب استقطاب الانتباه والأنظار، وتصوّر الموقع بوصفه نقطة تتلاقى عندها اهتمامات الناس، بينما «صدارة» تركّز على الترتيب والأولية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُؤْرَةُ الِاهْتِمَامِ"

    - lemma: "صَدَارَة"
      decision: confirmed
      decision_reason: "لفظة فصيحة مسجّلة في المعجم الوسيط والمعجم الكبير ومعجم الصواب اللغوي بمعنى التقدم والأولية في القوم، وتطابق مفهوم المجموعة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على التقدم والأولية في الترتيب بين الأقران، بينما «بؤرة الاهتمام» تدل على استقطاب الأنظار بغض النظر عن الترتيب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَدَارَة"

    - lemma: "وَاجِهَة"
      source: stage1
      decision: removed
      decision_reason: "الواجهة تدل في الاستعمال المعجمي الغالب على السطح الأمامي المادي (واجهة بناء) أو التقني (واجهة بينية)، ولم تثبت دلالتها على موقع البروز المعنوي أو المكانة، فلا تناسب هذه المجموعة"
      evidence_assessment:
        case: contradicts_only

    - lemma: "طَلِيعَة"
      source: stage1
      decision: removed
      decision_reason: "الطليعة تدل على الريادة والتقدم في مجال ما (avant-garde)، وهي أقرب إلى مفهوم forefront منها إلى center stage. المجموعة تدل على موقع البروز والاهتمام العام لا على الريادة والابتكار"
      evidence_assessment:
        case: mixed


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
