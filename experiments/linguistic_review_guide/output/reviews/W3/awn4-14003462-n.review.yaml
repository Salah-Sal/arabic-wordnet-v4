            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تصاعدت موجة العُنْف في المنطقة حتى أسفرت عن سقوط عشرات الضحايا وتدمير البنى التحتية."

