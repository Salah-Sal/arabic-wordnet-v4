# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14003462-n (violence)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عنف» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط — ينبغي التحقق من إمكانية إضافة مرادفات"
    observations: >
      التعريف العربي «حالة مضطربة تؤدي إلى إصابات ودمار وما إلى ذلك» واضح ومحدد.
      المفهوم يدلّ على حالة (state) لا على فعل بعينه، وهو ما يستوجب لفظاً مصدرياً
      أو اسمَ حالةٍ يدلّ على الوضع العام لا على الحدث المفرد.
      الفرق بين «العنف» بوصفه حالةً و«البطش» أو «العدوان» بوصفهما فعلَيْن جوهريّ.
  blind_candidates:
    - lemma: "عُنْف"
      generation_method: ishtiqaq
      justification: >
        مصدر سماعيّ من الجذر ع-ن-ف على وزن فُعْل، يدلّ على ضدّ الرفق والليّن،
        وهو المصطلح العربي الأصيل المباشر للدلالة على حالة الاضطراب المؤدية إلى الإيذاء والتدمير.
    - lemma: "بَطْش"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر ب-ط-ش، يدلّ على الأخذ بالشدة والقوة والسطوة.
        ورد في القرآن الكريم «إنّ بطشَ ربّك لشديد»، فهو يحمل دلالة القوة المدمّرة.
    - lemma: "عُدْوَان"
      generation_method: ishtiqaq
      justification: >
        مصدر من الجذر ع-د-و، يدلّ على مجاوزة الحدّ في الاعتداء والظلم.
        ورد في القرآن «فلا عدوان إلا على الظالمين»، ويُستعمل في سياق العنف السياسي والحربي.
    - lemma: "سَوْرَة"
      generation_method: majaz
      justification: >
        من الجذر س-و-ر، تدلّ على ثورة الشيء واشتداده، يقال «سَوْرة الغضب» و«سَوْرة الخمر».
        يمكن توسيع الدلالة مجازياً لتشمل حالة الاضطراب العنيف المفضي إلى الأذى.

stage2_evidence:
  per_lemma:
    - lemma: "عُنْف"
      confirm:
        - text: "«عُنْف: ضدّ الرِّفق»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«عَنَفَ: به، وعليه: أخذه بشدّة وقسوة. لامَه وعيَّره»"
          source: "المعجم الوسيط"
        - text: "«الْعَيْنُ وَالنُّونُ وَالْفَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خِلَافِ الرِّفْقِ. قَالَ الْخَلِيلُ: الْعُنْفُ: ضِدُّ الرِّفْقِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(1) عُنْف (2) أذًى (3) اغتصاب (4) «أ» اتِّقاد [في الشُّعور]. «ب» شدَّة؛ قسوة (5) التَّحريف (6) قوّة جامحة (7) خلاف؛ نزاع»"
          source: "المورد الحديث (2008) — ترجمة violence"
      expands:
        - text: "«العُنْف: ضدّ الرفق. عَنَفَ يَعْنُفُ عَنْفاً فهو عنيفٌ. وعنّفته تعنيفاً، ووجدت له عليك عُنْفاً ومشقّة»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: "يبيّن أنّ العنف يشمل المشقّة والإيذاء وليس فقط ضدّ الرفق"
        - text: "«ضد الرفق وهو عدم اللين في الأمر»"
          source: "مقاييس اللغة (OCR)"
          addition: "يؤكد أنّ العنف غياب اللين في المعاملة"

    - lemma: "بَطْش"
      confirm:
        - text: "«البَطْشَة: السَّطوةُ والأخْذُ بالعنف»"
          source: "تاج اللغة وصحاح العربية للجوهري"
      contradicts:
        - text: "«(بَطَشَ) الْبَاءُ وَالطَّاءُ وَالشِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ أَخْذُ الشَّيْءِ بِقَهْرٍ وَغَلَبَةٍ وَقُوَّةٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "البطش يدلّ على فعل الأخذ بالقوة لا على حالة مستمرة من الاضطراب"
        - text: "«البطش: تناول الشيء بعنف وأخذه بصولة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "البطش تناوُلٌ وأخذٌ — أي فعل آنيّ — لا حالة عامة مضطربة"

    - lemma: "عُدْوَان"
      contradicts:
        - text: "«العدوان: أسوأ الاعتداء في قول أو فعل أو حال»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "العدوان يدلّ على فعل الاعتداء المتعمّد وتجاوز الحدّ، وهو أخصّ من حالة العنف العامة"
        - text: "«لا عُدْوان على فلان: لا سبيل ولا سلطان عليه»"
          source: "المعجم الوسيط"
          conflict: "العدوان يركّز على التعدّي والظلم لا على الحالة المضطربة المؤدية إلى الدمار"

    - lemma: "سَوْرَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عُنْف"
      decision: confirmed
      decision_reason: >
        اللمّة الموجودة «عنف» هي المقابل العربي الدقيق لمفهوم violence بوصفه حالةً مضطربةً
        مؤدّيةً إلى الإصابات والدمار. أكّدت جميع المعاجم العربية الكلاسيكية والمعاصرة هذه الدلالة.
        اللمّة تحتاج فقط إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُنْف"

    - lemma: "بَطْش"
      source: stage1
      decision: removed
      decision_reason: >
        البطش يدلّ على فعل الأخذ بالشدّة والسطوة — وهو حدث آنيّ محدّد — لا على حالة
        مضطربة عامة كما يقتضي تعريف المجموعة. جميع المعاجم تُعرّفه بالتناول والأخذ بقوّة،
        وهو أقرب إلى مفهوم assault منه إلى violence كحالة.
      evidence_assessment:
        case: mixed

    - lemma: "عُدْوَان"
      source: stage1
      decision: removed
      decision_reason: >
        العدوان يدلّ على فعل الاعتداء المتعمّد وتجاوز الحدّ في الظلم، وهو مفهوم أخصّ
        يركّز على قصد المعتدي لا على الحالة العامة. يقابله aggression في الإنجليزية
        وله مجموعة ترادفية مستقلة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "سَوْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        السورة تدلّ على ثورة الغضب أو الحمّى اللحظية وهي حالة عابرة مؤقتة،
        في حين أنّ مفهوم المجموعة يشمل حالة مستمرة من الاضطراب. كما لم تُوجد
        أدلة معجمية تربط السورة بالدمار والإصابات.
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "حالة مضطربة تؤدي إلى إصابات ودمار وما إلى ذلك"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول في مضمونه لكنّه يعتمد على عبارة «وما إلى ذلك» المبهمة،
        ويفتقر إلى الجنس القريب الدقيق والفصل النوعي الواضح بأسلوب المعجم العربي.
    authored:
      - type: terminological
        text: "حالةٌ من الشِّدَّةِ والاضطرابِ يُلجَأُ فيها إلى القُوَّةِ، فتُفضي إلى إيذاءٍ جسديٍّ أو تدميرٍ مادّيّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ضِدُّ الرِّفْقِ واللِّينِ، وهو اسْتِخدامُ القُوَّةِ الشَّديدةِ على وَجْهٍ يُؤدّي إلى الأذى والخراب"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
