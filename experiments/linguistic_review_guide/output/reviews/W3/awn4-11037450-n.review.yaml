# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (غروتيوس، هوغو غروتيوس) خاليتان من التشكيل الكامل."
      - "الاسم الهولندي الأصلي (Huig de Groot = هُيخ دِي خرُوت) غائب، وهو مُدرَج في قوائم OEWN الإنجليزية."
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يفتقر إلى لقب الشخصية المعروف «أبو القانون الدولي»."
      - "المجموعة تُصنَّف تحت pos: n وهو صحيح اصطلاحاً في شبكات الكلمات، لكن المحتوى اسم علم."
    observations: >
      هذه المجموعة تمثّل شخصية تاريخية بعينها — هوغو غروتيوس (1583-1645)، الفقيه والدبلوماسي الهولندي
      الذي يُعدّ مؤسّس القانون الدولي الحديث. ويُعرَف بثلاثة أشكال: اللاتيني «Grotius»،
      والكامل «Hugo Grotius»، والهولندي الأصلي «Huig de Groot». التحدي المعجمي هنا أن جميع
      اللمّات تعريبات لأسماء أعجمية؛ فلا جذر عربي ولا اشتقاق ينطبق عليها. وقد استُخدم في
      المراجع العربية شكلا «غروتيوس» و«هوغو غروتيوس» على نطاق واسع. أما لقب «أبو القانون الدولي»
      فهو وصف تعريفي مشهور لكنه يخفق في اختبار السكّ المعجمي الثابت.

  blind_candidates:
    - lemma: "غرُوتيُوس"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم اللاتيني Grotius وفق القواعد الصوتية العربية: G→غ، r→ر، o→و، t→ت،
        i→ي، u→و، s→س. وهو الشكل الأكثر شيوعاً في المصادر الأكاديمية العربية عند ذكر هذه
        الشخصية القانونية التاريخية.

    - lemma: "هُوغُو غرُوتيُوس"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل Hugo Grotius. Hugo تُعرَّب هُوغُو وهو شائع في المعجمية العربية
        الحديثة (المورد الحديث ونظائره). الصيغة الكاملة ضرورية لتمييز الشخصية عن أي حامل
        آخر لاسم غروتيوس.

    - lemma: "هُيخ دِي خرُوت"
      generation_method: taarib
      justification: >
        تعريب الاسم الهولندي الأصلي Huig de Groot. يُنطق Huig تقريباً [هُيخ] في الهولندية،
        وde هو أداة التعريف الهولندية، وGroot = خرُوت. يُستعمل في السياقات التاريخية
        الهولندية وفي المصادر التي تُميّز بين الاسم اللاتيني والأصل الهولندي.

    - lemma: "أَبُو القَانُونِ الدَّوْلِيِّ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «أبو» + «القانون الدولي»، يُعبّر عن اللقب الأكاديمي المتداول لهذه
        الشخصية. غير أن اختبار السكّ يكشف أنه وصف تعريفي حرّ لا وحدة معجمية مسكوكة ثابتة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  queries_run:
    - "Batch headword lookup: غروتيوس، هوغو غروتيوس، هيخ دي خروت، ابو القانون الدولي (+ صيغ ال-)"
    - "English bridge FTS: translation_en:\"Grotius\" OR \"Hugo Grotius\" OR \"Huig de Groot\""
    - "Arabic FTS keywords: \"غروتيوس\" OR \"هوغو\" OR \"هولندي\" OR \"القانون الدولي\""
    - "Maqayis al-Lugha lookup: dictionary_id=151, roots فقه، دول"

  per_lemma:
    - lemma: "غرُوتيُوس"
      evidence_status: "no_material_found"

    - lemma: "هُوغُو غرُوتيُوس"
      evidence_status: "no_material_found"

    - lemma: "هُيخ دِي خرُوت"
      evidence_status: "no_material_found"

    - lemma: "أَبُو القَانُونِ الدَّوْلِيِّ"
      evidence_status: "no_material_found"

  contextual_finds:
    - note: >
        رصد استعلام FTS مدخلاً في «المورد الحديث (2008)» يترجم «publicist» بـ:
        «(1) «أ» الخبير في القانون الدُّولي. «ب» الخبير في الشؤون العامّة أو المعلِّق عليها»
        وهو ذو صلة بالتعريف الوظيفي لغروتيوس لكنه لا يذكره بالاسم.
      source: "المورد الحديث (2008)"
    - note: >
        مدخل «القانون الدُّوَليّ» في «المورد الحديث (2008)» بترجمتي «international law»
        و«jus gentium» و«law of nations» — يُثبت استعمال المصطلح في عناوين معجمية رسمية.
      source: "المورد الحديث (2008)"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "غروتيوس"
      decision: confirmed
      decision_reason: >
        الاسم موثّق في الكتابة الأكاديمية العربية للقانون الدولي وتاريخ القانون.
        يمثّل صيغة الاسم الأخير المختصر التي تُستخدم في الإحالات العلمية.
        لا أدلة معجمية مباشرة بسبب طبيعته كاسم علم غير عربي، وهذا متوقع.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      morphological_check:
        pos_fit: "اسم علم معرَّب — لا وزن صرفي عربي ينطبق عليه."
        borrowing_type: "تعريب لفظي مقبول (proper noun)؛ يقبل لام التعريف والنسبة: الغروتيوسي."
      nuance_differentiation: >
        يختلف عن «هُوغُو غرُوتيُوس» في كونه صيغة الاسم الأخير المُختصرة المُستخدمة في
        الإحالات الأكاديمية والمراجع العلمية المختصرة (كتب «غروتيوس...»)، بينما الاسم
        الكامل يُستخدم عند التعريف الأول أو في الكتابة التاريخية الرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غرُوتيُوس"

    - lemma: "هوغو غروتيوس"
      decision: confirmed
      decision_reason: >
        صيغة الاسم الكامل المُعرَّبة، شائعة في المصادر العربية التاريخية والقانونية.
        اسم مركّب ثنائي (اسم أول + لقب) — تعبير مركّب ثابت بحكم كونه اسم علم شخصي.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      mwe_stability: >
        التعبير مستقر بوصفه اسم علم ثنائي الجزء. لا يمكن إبدال «هوغو» بـ«هيوغو» أو
        «هيغو» دون تغيير دلالة المقصود — وهو مؤشر على ثبوت الوحدة المعجمية.
      morphological_check:
        pos_fit: "اسم علم معرَّب مركّب — لا وزن صرفي عربي ينطبق."
        borrowing_type: "تعريب لفظي مقبول."
      nuance_differentiation: >
        الاسم الكامل يُستخدم في المؤلفات التاريخية الرسمية والتعريف الأول بالشخصية،
        بعكس الاسم المختصر «غرُوتيُوس» المستخدم في الإحالات الأكاديمية المُتكررة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُوغُو غرُوتيُوس"

    - lemma: "هُيخ دِي خرُوت"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الهولندي الأصلي لـ Huig de Groot مُدرَج في قوائم OEWN الإنجليزية الثلاثة
        (Grotius / Hugo Grotius / Huig de Groot)، وغيابه يجعل المجموعة غير مكتملة.
        ضرورته قائمة في الكتابات التاريخية التي تُشير إلى هويته الثقافية الهولندية الأصلية.
        لا أدلة معجمية — متوقع لأسماء الأعلام الأجنبية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      morphological_check:
        pos_fit: "اسم علم هولندي معرَّب ثلاثي الجزء."
        borrowing_type: "تعريب لفظي — de أداة هولندية تُنقل كما هي."
      nuance_differentiation: >
        الاسم الهولندي الأصلي، يُستخدم تحديداً في السياقات التي تُميّز بين اسمه
        الهولندي الأصلي ولقبه اللاتيني «Grotius»، أو في المراجع التاريخية الهولندية.
      actions:
        - command: create_entry
          params:
            lemma: "هُيخ دِي خرُوت"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أَبُو القَانُونِ الدَّوْلِيِّ"
      source: stage1
      decision: removed
      decision_reason: >
        يخفق في اختبار السكّ المعجمي: يمكن استبدال «القانون الدولي» بـ«القانون الطبيعي»
        أو «علم الأمم» ويبقى الوصف صالحاً كلقب تكريمي — وهو ما يكشف أنه عبارة وصفية
        حرّة لا وحدة معجمية ثابتة. كما أنه لقب وليس اسماً (لا تختزله إلى هوية الشخص
        بصورة حصرية). يصلح استخدامه في التعريف لكن ليس كلمّة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "فقيه ودبلوماسي هولندي أرست كتاباته أساس القانون الدولي الحديث (1583-1645)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزي، سليم المعنى لكنه يفتقر إلى:
        (أ) لقبه الأشهر «أبو القانون الدولي» الذي يُفيد في الفهم الموسوعي،
        (ب) التشكيل الكامل المطلوب في قواعد AWN4،
        (ج) أسلوب المعجم الوسيط الموسوعي المناسب لمداخل أعلام الأشخاص.
    authored:
      - type: encyclopedic
        text: >
          فَقِيهٌ وَدِبْلُومَاسِيٌّ هُوَلَنْدِيٌّ (1583-1645)، يُلَقَّبُ بِأَبِي
