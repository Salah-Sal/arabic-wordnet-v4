# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14001613-n
# a prominent or sensational but short-lived news event
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«فرقعة إعلامية» تعبير وصفي حرّ وليس مصطلحاً مسكوكاً؛ فرقعة في المعاجم تعني الصوت الفيزيائي (طقطقة، قرقعة) لا الحدث الإخباري"
      - "المركّب «فرقعة إعلامية» يجتاز اختبار السكّ: يمكن قول «فرقعة صحفية» أو «فرقعة إخبارية» بنفس الدلالة، ممّا يدلّ على أنه ليس وحدة معجمية ثابتة"
      - "اللمّة «ضجة» تفتقر إلى التشكيل الكامل في المدخل"
    observations: "المجموعة تعبّر عن مفهوم الحدث الإخباري المثير الذي يخبو سريعاً. لفظ «ضجّة» مناسب تماماً ومدعوم معجمياً؛ فالمعجم الكبير يورد: «أمرٌ أحدثَ ضجّة»، وهو ما يتطابق مع دلالة المجموعة. أما «فرقعة إعلامية» فيبدو ترجمة حرفية لـ splash/sensation بدلالة الصوت لا الحدث."

  blind_candidates:
    - lemma: "زَوْبَعَة إِعْلَامِيَّة"
      generation_method: tarkib
      justification: "مركّب وصفي من «زوبعة» (الإعصار، مجازاً: الأمر المثير القصير) و«إعلامية»؛ يشيع في الخطاب الصحفي العربي المعاصر لوصف حدث إعلامي عاصف يخبو سريعاً"
    - lemma: "هَوْجَة"
      generation_method: majaz
      justification: "من الجذر هـ و ج الدالّ على التسرّع والتعسّف (مقاييس اللغة)؛ مجاز لحدث مفاجئ عنيف ثم يهدأ، كأنه ريح هوجاء"
    - lemma: "لَغَط"
      generation_method: majaz
      justification: "أصل اللغط: أصوات مبهمة مختلطة (الأصوات المرتفعة عند التجمّع)؛ يُستعمل مجازاً في الإعلام للدلالة على الضجيج الخبري المؤقت"
    - lemma: "صَخْبَة"
      generation_method: ishtiqaq
      justification: "من الجذر ص خ ب الدالّ على صوت عالٍ (مقاييس اللغة)؛ على وزن فَعْلة للمرّة الواحدة من الصَّخَب"

stage2_evidence:
  per_lemma:
    - lemma: "ضَجَّة"
      confirm:
        - text: "«الجلبةُ والصياحُ»"
          source: "المعجم الوسيط"
        - text: "«الجلبةُ والصِّياحُ. يقال: سَمِعتُ ضَجَّةَ القوم, وسَمِعتُ لَهُ ضَجَّةً مُنْكَرَةً»"
          source: "المعجم الكبير"
        - text: "«أَمْرٌ أَحْدثَ ضَجَّةً»"
          source: "المعجم الكبير"
        - text: "«(12) ضجّة created a considerable stir in the press»"
          source: "المورد الحديث (2008) — مادة stir"
        - text: "«(3) اهتياج؛ ضجة؛ شعور قويّ The news created a great sensation throughout the country.»"
          source: "المورد الحديث (2008) — مادة sensation"
      expands:
        - text: "«إلامَ الخُلْفُ بَيْنَكُمُ إلاما؟ / وهذى الضَّجَّةُ الكُبْرى عَلاما؟» — أحمد شوقى"
          source: "المعجم الكبير — شاهد شعري"
          addition: "شاهد شعري يؤكد استعمال «الضجّة» في سياق الأحداث الكبرى والاهتياج العام"
        - text: "«من فُرص اللِّصِّ ضَجَّةُ السوق»"
          source: "المعجم الكبير — مَثَل"
          addition: "مَثَل يدلّ على أنّ الضجّة حالة مؤقتة يُنتهز فيها الوقت"

    - lemma: "فَرْقَعَة إِعْلَامِيَّة"
      contradicts:
        - text: "«طَقْطقة؛ فَرْقعة»"
          source: "المورد الحديث (2008) — مادة crackling"
          conflict: "فرقعة في المعاجم = صوت فيزيائي (طقطقة، قرقعة)، لا حدث إخباري"
        - text: "«دَويٌّ ناتج عن اصطدام جسم بآخر»"
          source: "المعجم الموحد لمصطلحات الطب البيطري"
          conflict: "التعريف المعجمي يقصر الفرقعة على الصوت المادي"
        - text: "«تفاعل ناشر للحرارة يجري بسرعة كبيرة ينتج عنه صوت وفرقعة»"
          source: "المعجم الموحد لمصطلحات الكيمياء — مادة detonation"
          conflict: "الاستعمال الاصطلاحي العلمي يؤكد الدلالة الصوتية الفيزيائية"

    - lemma: "زَوْبَعَة إِعْلَامِيَّة"
      confirm:
        - text: "«(الزوبعة) الإعصار»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(زَبَعَ) الزَّاءُ وَالْبَاءُ وَالْعَيْنُ قَرِيبٌ مِنَ الَّذِي قَبْلَهُ، وَهُوَ يَدُلُّ عَلَى تَغَيُّظٍ وَعَزِيمَةِ شَرٍّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على التغيّظ وعزيمة الشرّ، مما يعزّز الدلالة المجازية على الحدث العاصف"

    - lemma: "هَوْجَة"
      expands:
        - text: "«(هَوَجَ) الْهَاءُ وَالْوَاوُ وَالْجِيمُ: كَلِمَةٌ تَدُلُّ عَلَى تَسَرُّعٍ وَتَعَسُّفٍ. يَقُولُونَ: الْأَهْوَجُ: الرَّجُلُ الْمُتَسَرِّعُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على التسرّع والاندفاع، وهو ملائم دلالياً لكنّ «هوجة» بمعنى الحدث الإخباري غير مأثورة"

    - lemma: "لَغَط"
      confirm:
        - text: "«لَغَط؛ ضجّة؛ اهتياج.»"
          source: "المورد الحديث (2008) — مادة to-do"
      expands:
        - text: "«دوشة: جلبة، لغط، ضجة، صخب، ضوضاء»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "اللغط يرد مع الضجة والصخب كمترادفات قريبة في حقل الأصوات المختلطة"

    - lemma: "صَخْبَة"
      contradicts:
        - text: "«العَطْفَةُ, وهى الخرزة تُسْتَعْمَلُ في الحبِّ والبُغْض والمسافرة»"
          source: "المعجم الكبير"
          conflict: "«الصَّخْبة» في المعجم الكبير = نوع من الخرز، لا علاقة لها بالصوت أو الضجيج"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "ضَجَّة"
      decision: confirmed
      decision_reason: "لفظ فصيح راسخ مدعوم بالمعاجم الكلاسيكية والمعاصرة. المعجم الكبير يورد صراحةً «أَمْرٌ أَحْدثَ ضَجَّةً» ممّا يؤكد الامتداد الدلالي من الصوت إلى الحدث المثير. والمورد الحديث يقابله بـ stir في سياق الصحافة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الجلبة والصياح الناشئين عن حدث مثير، مع إيحاء بالمؤقتية والاتساع؛ وهي اللفظ العربي الأصيل الجامع لمعنى stir/splash الإعلامي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ضَجَّة"

    - lemma: "فَرْقَعَة إِعْلَامِيَّة"
      decision: removed
      decision_reason: "«فرقعة» في جميع المعاجم المتاحة تعني الصوت الفيزيائي (طقطقة، دويّ اصطدام)، ولا شاهد معجمي على استعمالها مجازاً للحدث الإخباري. كما أنّ المركّب يجتاز اختبار السكّ (يمكن إبدال «إعلامية» بـ«صحفية» أو «إخبارية») فليس وحدة معجمية ثابتة. يبدو ترجمة حرفية مُقحَمة لـ splash."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "زَوْبَعَة إِعْلَامِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم شيوع التعبير في الخطاب الصحفي المعاصر، فإنه يجتاز اختبار السكّ (زوبعة صحفية / زوبعة سياسية)، فهو تركيب وصفي حرّ لا وحدة معجمية ثابتة. كما أنّ «الزوبعة» تدلّ على الإعصار وتوحي بالعنف والدمار أكثر من مجرّد الإثارة الإعلامية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "هَوْجَة"
      source: stage1
      decision: removed
      decision_reason: "رغم ملاءمة الجذر (هوج = تسرّع وتعسّف)، لا يوجد شاهد معجمي على استعمال «هَوْجَة» بمعنى الحدث الإخباري المثير. اللفظ غير مأثور في هذه الدلالة ولا يرد في المعاجم الكلاسيكية بهذا المعنى."
      evidence_assessment:
        case: no_material

    - lemma: "لَغَط"
      source: stage1
      decision: removed
      decision_reason: "اللغط يعني الأصوات المبهمة المختلطة، وهو أقرب إلى الضوضاء الكلامية منه إلى الحدث الإخباري. دلالته أعمّ من المجموعة الترادفية التي تخصّ الأحداث الإعلامية البارزة قصيرة الأجل، ولا يتضمّن بُعد الإثارة والبروز."
      evidence_assessment:
        case: mixed

    - lemma: "صَخْبَة"
      source: stage1
      decision: removed
      decision_reason: "المعجم الكبير يعرّف «الصَّخْبَة» بأنها خرزة تُستعمل في الحبّ والبغض، لا علاقة لها بالصوت. وعلى فرض أنها من الصَّخَب، فإنّ صيغة فَعْلَة للمرّة لم تُسمع من هذا الجذر."
      evidence_assessment:
        case: contradicts_only

