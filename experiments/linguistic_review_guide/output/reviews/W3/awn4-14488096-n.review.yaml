# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14488096-n (blister — surface flaw)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «فقاعة» تدل أساساً على الفقاعة الهوائية (bubble) لا على العيب السطحي (blister/flaw)؛ المصطلح الأدق لهذا المفهوم هو «نفطة»"
      - "اللمّة بدون تشكيل كامل"
    observations: >
      المجموعة تصف عيباً سطحياً ينشأ عن عدم التصاق مادة مطبقة (كفقاعة هواء في طبقة طلاء)،
      وهو ما يُعرف في الصناعة والهندسة بـ«blister». المصطلح العربي المعتمد في المعاجم التقنية
      (المعجم الطبي الموحد، معجم النقل، المورد الحديث) هو «نَفْطَة» لا «فُقَّاعَة».
      اللمّة الحالية تستخدم المعنى العام (فقاعة = bubble) وليس المعنى التقني (blister = نفطة).
      يُحتمل أن يكون ذلك ناتجاً عن ترجمة آلية للتعريف الإنجليزي.
  blind_candidates:
    - lemma: "نَفْطَة"
      generation_method: majaz
      justification: >
        لفظ عربي أصيل يعني في الأصل البثرة التي تظهر في اليد من العمل (ابن فارس: «النَّفَطُ: قَرْحٌ يَخْرُجُ فِي الْيَدِ مِنَ الْعَمَلِ»).
        امتدّ مجازياً ليشمل أي انتفاخ سطحي ناتج عن انفصال طبقة عن أخرى، وهو المصطلح المعتمد في المعاجم التقنية العربية لـ blister.
    - lemma: "نُفَاخَة"
      generation_method: ishtiqaq
      justification: >
        من جذر ن-ف-خ على وزن فُعَالَة، تدل على التجويف أو الانتفاخ البسيط في المواد.
        وردت في معجم المصطلحات المهنية والتقنية بمعنى blister في المعادن والزجاج والجصّ.
    - lemma: "تَنَفُّط"
      generation_method: ishtiqaq
      justification: >
        مصدر تفعُّل من نفط، يدل على عملية ظهور النفطات (التنفّط). قد يصلح اسماً للعيب ذاته
        لكنه أقرب إلى الحدث (المصدر) منه إلى الاسم الجامد.
    - lemma: "بَثْرَة"
      generation_method: majaz
      justification: >
        لفظ عربي قديم يعني الحبّة أو النتوء الصغير على الجلد. يمكن توسيعه مجازياً لعيوب
        السطح، لكنه أكثر التصاقاً بالسياق الطبي (الجلدي) منه بالسياق الصناعي.


stage2_evidence:
  per_lemma:
    - lemma: "فُقَّاعَة"
      confirm:
        - text: "«نفاخات ترتفع على سطح الماء والشراب كالقوارير, تنفقئ سريعاً»"
          source: "المعجم الوسيط"
        - text: "«فُقاعة — زئبقية» (translation_en: bubble)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
      contradicts:
        - text: "«فُقَّاعَة» (translation_en: bubble) — جميع مداخل ARABTERM تترجمها إلى bubble لا blister"
          source: "معاجم ARABTERM المتعددة (فيزياء، كيمياء، وراثة، تشريح، طب)"
          conflict: "المصطلح يقابل bubble (فقاعة هوائية) وليس blister (عيب سطحي من عدم الالتصاق)"
      expands:
        - text: "«الْفُقَّاعُ فَيُقَالُ إِنَّهُ عَرَبِيٌّ. قَالَ الْخَلِيلُ: سُمِّيَ فُقَّاعًا لِمَا يَرْتَفِعُ فِي رَأْسِهِ مِنَ الزَّبَدِ. قَالَ: وَالْفَقَاقِيعُ كَالْقَوَارِيرِ فَوْقَ الْمَاءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر فقع يدور حول الانتفاخ والانفقاء السريع، والفقاقيع هي النفاخات الهوائية فوق الماء"

    - lemma: "نَفْطَة"
      confirm:
        - text: "«النَّفْطة؛ البَثْرة؛ القَرْح: انتفاخ [في البشرة]. انتفاخ مماثل في النبات»"
          source: "المورد الحديث (2008)"
        - text: "«نَفْطَة» (translation_en: blister)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«نَفْطَةٌ» (translation_en: blister)"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
        - text: "«حويصل صغير، يظهر على بشرة الجلد، يحتوي على سائل»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«تجمع سائل مصلي تحت البشرة»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«النَّفَطُ: المَجلُ. وقد نَفطتْ يده نَفْطاً ونَفيطاً، وتَنَفَّطَتْ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
      expands:
        - text: "«النَّفَطُ: قَرْحٌ يَخْرُجُ فِي الْيَدِ مِنَ الْعَمَلِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ن-ف-ط يدل أصلاً على البثرة الناتجة من العمل، ثم توسّع ليشمل أي انتفاخ سطحي"
        - text: "«وكف نفيطة ومنفوطة ونافطة: أصابتها النَّفطة ... أي الجدري أو البثرة أورق جلدها من العمل فصار فيها كالماء»"
          source: "العباب الزاخر للصغاني"
          addition: "النَّفطة تدل على انفصال طبقة الجلد وتجمّع سائل تحتها — وهذا يوازي تماماً عيب عدم الالتصاق في الطلاء"

    - lemma: "نُفَاخَة"
      confirm:
        - text: "«تجويف أو انتفاخ بسيط في المعدن أو الزجاج أو السقف المجصص مثلا من أثر النار» (translation_en: blister)"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 2: بناء - تجارة (1999)"
      expands:
        - text: "«نُفَّاخة: الفقاعة الهوائية فوق الماء، ولعبة للأطفال ينفخون فيها فتنتفخ»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المعنى العام هو الفقاعة الهوائية، والمعنى التقني هو التجويف في المواد"

    - lemma: "تَنَفُّط"
      confirm:
        - text: "«(تنفطت) القدر نفطت ويقال تنفط فلان احترق غضبا ويده من العمل نفطت»"
          source: "المعجم الوسيط (هورماني)"
      contradicts:
        - text: "«تنفطت يده من العمل نفطت» — المصدر يدل على الحدث لا على العيب ذاته"
          source: "المعجم الوسيط"
          conflict: "تَنَفُّط مصدر (اسم حدث) وليس اسماً للعيب السطحي نفسه؛ المجموعة تحتاج اسم ذات لا اسم حدث"

    - lemma: "بَثْرَة"
      confirm:
        - text: "«البَثْرُ والبُثورُ: خرّاجٌ صغار، واحدتها بَثْرَة. وتَبَثَّرَ جلدُه: تنفط»"
          source: "تاج اللغة وصحاح العربية للجوهري"
      contradicts:
        - text: "«تَبَثَّرَ جلدُه: تنفط» — البثرة مرتبطة حصرياً بالجلد (سياق طبي)"
          source: "تاج اللغة وصحاح العربية للجوهري"
          conflict: "البثرة مصطلح طبي/جلدي حصراً، لا يُستخدم لعيوب الأسطح الصناعية"


stage3_analysis:
  per_lemma:
    - lemma: "فُقَّاعَة"
      decision: confirmed
      decision_reason: >
        رغم أن المعنى الأصلي هو الفقاعة الهوائية (bubble)، فإن الاستعمال في سياق عيوب الطلاء
        والأسطح مفهوم وشائع في العربية المعاصرة. اللمّة تصف الشكل الفيزيائي للعيب (فقاعة هواء
        محبوسة تحت الطبقة). تُبقى مع تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تصف الشكل الفيزيائي للعيب (انتفاخ هوائي كروي)، وتركّز على المظهر الخارجي للفقاعة
        المحبوسة تحت السطح. أعمّ من نَفْطَة التي تركّز على الانفصال والتقشّر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُقَّاعَة"

    - lemma: "نَفْطَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصطلح العربي المعتمد في المعاجم التقنية والطبية العربية لـ blister. شواهده غزيرة:
        المعجم الطبي الموحد، معجم النقل، المورد الحديث، معجم الصيدلة. الجذر ن-ف-ط يدل على
        انفصال طبقة وتجمّع سائل أو هواء تحتها — وهو المعنى الدقيق للعيب السطحي المقصود.
        مُثبت في العربية الكلاسيكية (الجوهري، ابن فارس، الصغاني) والحديثة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تدل على العيب الناتج عن انفصال طبقة عن أخرى مع تجمّع سائل أو هواء بينهما.
        أخصّ من فُقَّاعَة لأنها تركّز على آلية الانفصال لا على الشكل الكروي فحسب.
        المصطلح التقني الأدق في سياقات الطلاء والصناعة.
      actions:
        - command: create_entry
          params:
            lemma: "نَفْطَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نُفَاخَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورودها في معجم واحد (المعجم الموحد للمصطلحات المهنية والتقنية) بمعنى blister في
        المعادن والزجاج، فإن شيوعها محدود جداً مقارنة بنَفْطَة. المعنى الأساسي هو الفقاعة
        الهوائية أو لعبة الأطفال، مما قد يُحدث لبساً. لا تُضاف حفاظاً على دقة المجموعة.

    - lemma: "تَنَفُّط"
      source: stage1
      decision: removed
      decision_reason: >
        مصدر (اسم حدث) على وزن تَفَعُّل، يدل على عملية ظهور النفطات لا على العيب ذاته.
        المجموعة تحتاج اسم ذات (noun — اسم للعيب السطحي) لا اسم حدث. لا يصلح لمّةً في
        مجموعة ترادفية من نوع noun.

    - lemma: "بَثْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ مقصور على السياق الطبي/الجلدي (خرّاج صغير على الجلد). لا يُستخدم لعيوب الأسطح
        الصناعية أو الطلاء. لا يوجد شاهد على استعماله في هذا السياق التقني.


