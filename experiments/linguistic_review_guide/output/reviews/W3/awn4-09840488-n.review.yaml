# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «ملحق» مكتوبة بدون تشكيل، يجب تقييدها كـ«مُلحَق»"
      - "المجموعة تحتوي على لمّة واحدة فقط؛ المركبات الاصطلاحية الشائعة (ملحق عسكري، ملحق ثقافي) تُدرج عادةً كصيغ مشتقة لا كلمّات مستقلة"
    observations: >
      المجموعة تمثل مصطلحاً دبلوماسياً وقانونياً راسخاً في العربية المعاصرة. اللمّة «ملحق»
      مشتقة من الجذر (لحق) على وزن اسم المفعول (مُفعَل)، مما يعبّر بدقة عن المعنى الإلحاقي
      للوظيفة: الشخص المُضمَّ والمُلصَق بطاقم بعثة قائمة. يوثّق المعجم الوسيط وغيره استعمالها
      بوضوح في حقل القانون الدولي. التعريف الحالي مقبول لكنه قابل للتطوير.
  blind_candidates:
    - lemma: "مُلحَق"
      generation_method: ishtiqaq
      justification: >
        من جذر (لحق) على وزن مُفعَل (اسم المفعول)؛ المُلحَق هو من أُلحق وضُمَّ إلى طاقم
        البعثة الدبلوماسية القائمة دون أن يكون عضواً أصيلاً فيها، والوزن ملائم تماماً لدلالة
        الانضمام الوظيفي إلى هيئة موجودة
    - lemma: "مُنتَدَب"
      generation_method: ishtiqaq
      justification: >
        من جذر (ندب) على وزن مُنتَفَل (اسم المفعول للثلاثي المزيد بالافتعال)؛ النَّدب هو
        تعيين الشخص لمهمة بعينها بصفة مؤقتة أو متخصصة، مما يلتقي مع دلالة «متخصص معين
        لعمل خاص» في التعريف
    - lemma: "خَبِيرُ البَعثَة"
      generation_method: tarkib
      justification: >
        مركب إضافي من (خبير) المشتق من (خبر) بمعنى العارف الحاذق، و(البعثة) المشتق من
        (بعث) بمعنى إيفاد الممثلية؛ يصف المتخصص المرتبط بالبعثة الدبلوماسية ارتباطاً
        وظيفياً، والمركب الإضافي من الأنماط المنتجة في المصطلحية العربية
    - lemma: "مُبعُوث"
      generation_method: ishtiqaq
      justification: >
        من جذر (بعث) على وزن مُفعُول (اسم المفعول)؛ المبعوث هو من أُوفد وأُرسل في مهمة
        محددة، مما يتقاطع مع دلالة «معين ضمن بعثة»، ويقترب من المفهوم الدبلوماسي


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُلحَق"
      confirm:
        - text: "«موظف يعيَّن فى سفارة الدولة للقيام بعمل خاص، كالملحق العسكرىِّ والملحق الثقافىِّ والصحافىِّ»"
          source: "المعجم الوسيط — مجمع اللغة العربية بالقاهرة (OCR)"
        - text: "«مُلْحَق [ثقافي إلخ] في سفارة.» = attaché"
          source: "المورد الحديث (2008)"
        - text: "«الملحق العسكري.» = military attaché"
          source: "المورد الحديث (2008)"
        - text: "«مُلْحَق صحفي» = press attache; press officer / attaché de presse"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«ملحق تجاريّ» = commercial attaché / attaché commercial"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ArabTerm"
        - text: "«ملحق سياحي» = tourist attaché / attaché du tourisme"
          source: "مسرد الفن والتسلية والرياضة — ArabTerm"
      expands:
        - text: "«(الملحق) (فِي القانون الدولي الْعَام) اللحق (ج) ملحقات وموظف يعين فِي سفارة الدولة للْقِيَام بِعَمَل خَاص كالملحق العسكري والملحق الثقافي والصحافي»"
          source: "المعجم الوسيط — مجمع اللغة العربية (طبعة 1998 — hawramani)"
          addition: >
            يكشف أن (اللَّحَق) هو المصطلح القانوني الدولي الأصيل الموازي لـ«ملحق»،
            ويحدد إطار الاستعمال بصراحة: «القانون الدولي العام»، كما يبيّن الجمع (ملحقات)
            ويسرد الأنواع الثلاثة الشائعة

    - lemma: "مُنتَدَب"
      evidence_status: "no_material_found"

    - lemma: "خَبِيرُ البَعثَة"
      evidence_status: "no_material_found"

    - lemma: "مُبعُوث"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُلحَق"
      decision: confirmed
      decision_reason: >
        اللمّة موثقة توثيقاً قاطعاً في المعجم الوسيط (OCR وhawramani) والمورد الحديث
        وستة مصادر ArabTerm بدلالة الموظف الدبلوماسي المتخصص. وهي الترجمة العربية
        الراسخة لـattaché في الأدبيات القانونية والدبلوماسية العربية. الجذر (لحق) والوزن
        (مُفعَل) يُجسّدان دلالة الانضمام الوظيفي إلى البعثة. تحتاج اللمّة إلى تقييد
        التشكيل فحسب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يتميز المُلحَق عن الأخصائي/المتخصص (hypernym) بثلاثة فصول نوعية: (١) ارتباطه
        المؤسسي الصريح بسفارة الدولة أو بعثتها الدبلوماسية، (٢) انحصار نشاطه في ميدان
        متخصص بعينه (عسكري، ثقافي، صحفي، تجاري…)، (٣) خضوعه لإطار القانون الدولي العام
        لا مجرد علاقة توظيف عادية
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُلحَق"

    - lemma: "مُنتَدَب"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أدلة معجمية تربط «منتدب» بالمعنى الدبلوماسي الخاص. فضلاً عن ذلك،
        «المنتدب» في الاستعمال العربي يشير إلى أي شخص مُعيَّن مؤقتاً لأي مهمة، وهو
        مفهوم أشمل وأعم من الملحق الدبلوماسي المتخصص. خطر التداخل مع «المُفوَّض السامي
        المنتدب» في السياق التاريخي يزيد اللبس.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "خَبِيرُ البَعثَة"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: يمكن إبدال (خبير) بـ(متخصص) أو (أخصائي) وتبقى
        العبارة وصفاً حراً مقبولاً لا مصطلحاً مسكوكاً. كذلك يفشل اختبار السك: الإضافة
        «خبير البعثة» قابلة للتفكيك بلا خسارة دلالية. لا وجود لهذا المركب في أي معجم
        من المعاجم المستعلَمة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُبعُوث"
      source: stage1
      decision: removed
      decision_reason: >
        «المبعوث» يحمل في الاستعمال العربي دلالة المفوَّض السياسي الكامل أو المبعوث
        الخاص (special envoy)، وهو أرفع رتبةً ومختلف وظيفياً عن الملحق المتخصص. لا يوجد
        دليل معجمي يربطه بالمعنى الدقيق لـattaché. استعمال «مبعوث» هنا سيولّد اشتراكاً
        لفظياً مع مفاهيم دبلوماسية مختلفة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────
stage4_content:
  definition:
    current: "متخصص معين ضمن طاقم بعثة دبلوماسية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح دلالياً لكنه يستعمل «متخصص» جنساً قريباً، في حين يوثّق
        المعجم الوسيط أن الجنس القريب الدقيق هو «موظف»، مما يُقيّد المفهوم تقييداً
        مؤسسياً وقانونياً ضرورياً. يفتقر التعريف أيضاً إلى: (١) ذكر إطار «القانون الدولي
        العام» المؤطِّر للمصطلح، (٢) تحديد طبيعة العمل الخاص بأنه متخصص في ميدان بعينه.
    authored:
      - type: terminological
        text: "مَوظَّفٌ يُعيَّن فِي سَفَارةِ الدَّولةِ أَوْ بَعثَتِهَا الدِّبلومَاسِيَّةِ لِلقِيَامِ بِعَمَلٍ مُتَخَصِّصٍ فِي مَيدَانٍ بِعَيْنِهِ، كَالشُّؤُونِ العَسكَرِيَّةِ أَوِ الثَّقَافِيَّةِ أَوِ الصِّحَافِيَّةِ أَوِ التِّجَارِيَّةِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09840488-n"
          definition_index: 0
          text: "مَوظَّفٌ يُعيَّن فِي سَفَارةِ الدَّولةِ أَوْ بَعثَتِهَا الدِّبلومَاسِيَّةِ لِلقِيَامِ بِعَمَلٍ مُتَخَصِّصٍ فِي مَيدَانٍ بِعَيْنِهِ، كَالشُّؤُونِ العَسكَرِيَّةِ أَوِ الثَّقَافِيَّةِ أَوِ الصِّحَافِيَّةِ أَوِ التِّجَارِيَّةِ"

  examples:
