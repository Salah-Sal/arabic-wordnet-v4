      - lemma: "مُلحَق"
        examples:
          - text: "عُيِّن الضابطُ الرَّفيعُ مُلحَقاً عسكرياً في سفارة بلاده بباريس."
            type: usage
          - text: "يتولَّى المُلحَقُ الثقافيُّ للسفارة تنسيقَ شؤون الطلاب الدارسين في الخارج ومتابعةَ برامج التبادل الأكاديمي."
            type: usage
    actions:
      - command: add_sense_example
