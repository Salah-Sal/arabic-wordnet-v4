stage1_review:
  assessment:
    concerns:
      - "اللَّمَّة المَوْجُودَة (خَلِيج جِيمس) تَفْتَقِرُ إِلَى التَّشْكِيلِ الكَامِلِ."
      - "تَعْرِيفُ المَجْمُوعَةِ الحَالِيُّ يُمْكِنُ تَحْسِينُ صِيَاغَتِهِ لِيَكُونَ أَكْثَرَ مَعْجَمِيَّةً."
    observations: "خَلِيجُ جِيمس هُوَ عَلَمٌ عَلَى مَوْقِعٍ جُغْرَافِيٍّ مَحْدُودٍ (Proper Noun Phrase)، وَالتَّعْرِيبُ السَّائِدُ لِلِاسْمِ العَلَمِ 'James' هُوَ 'جِيمس' بِالسِّينِ، رَغْمَ أَنَّ 'جِيمز' بِالزَّايِ أَقْرَبُ نُطْقاً، إِلَّا أَنَّ المَعَاجِمَ العَرَبِيَّةَ المُعَاصِرَةَ وَالمَوْسُوعَاتِ تُثَبِّتُهُ بِالسِّينِ."
  blind_candidates:
    - lemma: "خَلِيج جِيمس"
      generation_method: tarkib
      justification: "التَّعْرِيبُ القِيَاسِيُّ وَالسَّائِدُ لِلِاسْمِ الجُغْرَافِيِّ فِي المَصَادِرِ العَرَبِيَّةِ."
    - lemma: "خَلِيج جِيمْس"
      generation_method: tarkib
      justification: "تَنْوِيعٌ فِي تَشْكِيلِ آخِرِ الِاسْمِ العَلَمِ بِالسُّكُونِ."
    - lemma: "جَوْن جِيمس"
      generation_method: tarkib
      justification: "اسْتِخْدَامُ لَفْظِ 'جَوْن' كَمُرَادِفٍ لِـ 'خَلِيج' فِي الوَصْفِ الجُغْرَافِيِّ لِلْمِسَاحَاتِ المَائِيَّةِ الأَصْغَرَ."
    - lemma: "خَلِيج جِيمز"
      generation_method: tarkib
      justification: "تَعْرِيبٌ بَدِيلٌ يَعْتَمِدُ النُّطْقَ الإِنْجِلِيزِيَّ لِلِاسْمِ (James)."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيج"
      confirm:
        - text: "«(الخَلِيجُ) امْتِدَادٌ مِنَ المَاءِ مُتَوَغِّلٌ فِي اليَابِسِ»"
          source: "المعجم الوسيط"
        - text: "«رِجْلٌ - أَى شُعْبة - من البَحْرِ تُخْتَلَجُ منه شَرْمٌ من البَحْرِ ما انْقَطَع من مُعْظَم الماءِ»"
          source: "المعجم الكبير"
    - lemma: "جيمس"
      confirm:
        - text: "«جِيمس: الصِّيغَةُ اللَّاتِينِيَّةُ لِلِاسْمِ يَعْقُوب يُسْتَخْدَمُ لِلذُّكُورِ.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "خليج هدسن"
      expands:
        - text: "«خليج هدسن: Hudson Bay»"
          source: "المكنز الزراعي متعدد اللغات"
          addition: "يُؤَكِّدُ نَمَطَ التَّسْمِيَةِ (خَلِيج + اسْم عَلم) فِي المَعَاجِمِ لِهَذِهِ المِنْطَقَةِ."
    - lemma: "جَوْن"
      confirm:
        - text: "«الخَلِيجُ الصَّغِيرُ»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "خليج جيمس"
      decision: confirmed
      decision_reason: "هُوَ الِاسْمُ العَلَمُ السَّائِدُ وَالمُعْتَمَدُ جُغْرَافِيّاً لِهَذَا المَوْقِعِ فِي الكُتُبِ وَالأَطَالِسِ العَرَبِيَّةِ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيج جِيمس"
    - lemma: "جَوْن جِيمس"
      source: stage1
      decision: removed
      decision_reason: "رَغْمَ صِحَّةِ 'جَوْن' لُغَوِيّاً، إِلَّا أَنَّ 'خَلِيج' هُوَ المُصْطَلَحُ المِعْيَارِيُّ المُسْتَخْدَمُ فِي تَرْجَمَةِ هَذَا الِاسْمِ الجُغْرَافِيِّ بِالذَّاتِ."
    - lemma: "خَلِيج جِيمز"
      source: stage1
      decision: removed
      decision_reason: "تَعْرِيبُ 'جِيمس' بِالسِّينِ أَكْثَرُ شُيُوعاً وَاسْتِقْرَاراً فِي الكِتَابَةِ العَرَبِيَّةِ مِنَ الزَّايِ."

stage4_content:
  definition:
    current: "الامتداد الجنوبي لخليج هدسون في كندا بين غرب كيبيك وشمال شرق أونتاريو"
    assessment:
      decision: revise
      reason: "الصِّيغَةُ الحَالِيَّةُ هِيَ تَرْجَمَةٌ حَرْفِيَّةٌ لِلتَّعْرِيفِ الإِنْجِلِيزِيِّ، وَيُفَضَّلُ صِيَاغَتُهَا بِأُسْلُوبٍ مَعْجَمِيٍّ عَرَبِيٍّ أَدَقَّ."
    authored:
      - type: encyclopedic
        text: "ذِراعٌ جَنوبِيَّةٌ لِخَليجِ هِدْسُن في كَنَدا، يَقَعُ مَوْقِعُهُ الفَلَكِيُّ وَالجُغْرَافِيُّ بَيْنَ مُقاطَعَتَيْ كِيبِيك وَأُونْتاريُو."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "ذِراعٌ جَنوبِيَّةٌ لِخَليجِ هِدْسُن في كَنَدا، يَقَعُ مَوْقِعُهُ الفَلَكِيُّ وَالجُغْرَافِيُّ بَيْنَ مُقاطَعَتَيْ كِيبِيك وَأُونْتاريُو."

  examples:
    per_lemma:
      - lemma: "خَلِيج جِيمس"
        examples:
          - text: "يُعَدُّ خَلِيج جِيمس مَوْطِناً لِلْعَدِيدِ مِنَ السَّكَانِ الأَصْلِيِّينَ (الكري) فِي كَنَدا."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعَدُّ خَلِيج جِيمس مَوْطِناً لِلْعَدِيدِ مِنَ السَّكَانِ الأَصْلِيِّينَ (الكري) فِي كَنَدا."

stage5_enrichment:
  per_entry:
    - lemma: "خَلِيج جِيمس"
      entry_id: "{auto}"
      roots:
        - word: "خَلِيج"
          root: "خلج"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ. فَمِنْ ذَلِكَ الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ.»"
        - word: "جِيمس"
          root: null
          maqayis_quote: "اسْمُ عَلمٍ أَعْجَمِيٌّ مُعَرَّبٌ، لَا أَصْلَ لَهُ فِي اللُّغَةِ العَرَبِيَّةِ."
  per_sense:
    - lemma: "خَلِيج جِيمس"
      sense_id: "{auto}"
      nuance: "عَلَمٌ عَلَى مَوْقِعٍ جُغْرَافِيٍّ مَحْدُودٍ يُمَيِّزُهُ عَنْ غَيْرِهِ مِنَ الخُلْجَانِ."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"خَلِيج","root":"خلج","maqayis":"«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ...»"},{"word":"جِيمس","root":null,"maqayis":"اسْمُ عَلمٍ أَعْجَمِيٌّ مُعَرَّبٌ..."}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"عَلَمٌ عَلَى مَوْقِعٍ جُغْرَافِيٍّ مَحْدُودٍ يُمَيِّزُهُ عَنْ غَيْرِهِ مِنَ الخُلْجَانِ.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
