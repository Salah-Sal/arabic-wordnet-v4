# ═══════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-10124525-n  |  ili: i90045  |  pos: n
# forester / tree farmer / arboriculturist
# ═══════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (عمياء) ────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث كلها مجردة من التشكيل"
      - "«خبير الغابات» و«زارع الأشجار» عبارتان وصفيتان مفتوحتان تجتازان اختبار الاستبدال (يمكن إبدال «الغابات» بـ«الأحراج» ولا يزال الوصف صحيحاً) — فلا يُعدَّان وحدتَيْن معجميتَيْن مسكوكتَيْن"
      - "«حراجي» يحتمل ضبطَيْن: حِرَاجِيٌّ (نسبة إلى الحِراج = الأحراج) وحَرَّاجِيٌّ (نسبة إلى الحَرَّاج = كثير الغضب)، وهما بمعنيَيْن مختلفَيْن؛ يجب حسم الضبط"
      - "غياب لمّة «شجّار» المؤكدة في المعاجم المتخصصة لـ arboriculturist"
    observations: "تضمُّ المجموعة ثلاثة مرادفات تمثّل مستويات تخصصية مختلفة: المصطلح العلمي الأكاديمي (حراجي)، والوصف الوظيفي الإداري (خبير الغابات)، والتخصص التطبيقي (زارع الأشجار). التعريف الحالي صحيح من حيث المحتوى لكنه مترجَم ترجمةً حرفية من الإنجليزية يفتقر إلى أسلوب المعجم الوسيط. اللمّة الأكثر رسوخاً معجمياً هي «حراجي» إذ تُقابل forester مباشرةً في المعاجم الحديثة. الحاجة ماسَّة إلى تحديد تشكيل كل لمّة وإضافة المصطلح المفرد المسكوك لـ arboriculturist."
  blind_candidates:
    - lemma: "حَرَّاجٌ"
      generation_method: ishtiqaq
      justification: "على وزن فَعَّال من جذر ح-ر-ج، الوزن الدال على الحرفة والاحتراف (نجّار، حدّاد، بنّاء). الحَرَجَة = مجتمع الشجر والحِراج = الأحراج؛ فالحَرَّاج مَن يحترف شأن الحراج وإدارتها."
    - lemma: "مُشَجِّرٌ"
      generation_method: ishtiqaq
      justification: "على وزن مُفَعِّل من ش-ج-ر، اسم فاعل للفعل شجَّر = زرع الأشجار وكسا الأرضَ بها. الوزن يناسب من يقوم بتشجير الأراضي وإنشاء الغابات باحترافية."
    - lemma: "خَبِيرُ الْحَرَاجَةِ"
      generation_method: tarkib
      justification: "مركب إضافي من خبير (المتخصص) + الحراجة (العلم الغابوي). يبرز البُعد الأكاديمي للمفهوم بدلالة واضحة، ويتمايز عن وصف الممارس الميداني."
    - lemma: "مُحَرِّجٌ"
      generation_method: ishtiqaq
      justification: "على وزن مُفَعِّل من ح-ر-ج، اسم فاعل لـ«حرَّج» بمعنى جعل حَرَجاً من الشجر وأنشأ أحراجاً. محتمَل دلالياً لمن يُنشئ الغابات ويرعاها."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# الاستعلامات المنفَّذة (6 استعلامات):
#   ١. مطابقة دفعية بالعناوين (اللمّات الموجودة + المرشحات + صيغ ال-)
#   ٢. جسر إنجليزي (forester, arboriculturist, silviculturist, tree farmer)
#   ٣. FTS عربي بالكلمات المفتاحية (حراجة، حرج، غابات، أشجار، تشجير)
#   ٤. إثراء بالمعرِّف (تعريفات + أمثلة للمداخل الرئيسية)
#   ٥. مقاييس اللغة لابن فارس — جذر حرج، شجر، زرع، غيب، غيض
#   ٦. مقاييس اللغة — جذر خبر
stage2_evidence:
  per_lemma:

    - lemma: "حراجي"
      confirm:
        - text: "«(1) الحِراجِيّ: الخبير بعلم الحِراجة»"
          source: "المورد الحديث (2008) — ترجمة forester"
      expands:
        - text: "«حِرَاجيّ من (ح ر ج) نسبة إلى الحِرَاج: جمع الحرج: حبالة الصائد وقلادة الحيوان وجماعة الغنم؛ أو جمع الحرجة: غوطة الشجر الملتفة التي لا يقدر أحد أن ينفذ فيها والشجرة تكون بين الأشجار يصعب الوصول إليها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُثبت أن حِرَاجيّ نسبة إلى الحِراج (الأحراج = جمع حرجة الغابة الملتفة) لا إلى حَرَّاج؛ مما يحسم الضبط بـ حِرَاجِيٌّ لا حَرَّاجِيٌّ"

    - lemma: "خبير الغابات"
      evidence_status: "no_material_found"

    - lemma: "زارع الأشجار"
      confirm:
        - text: "«زراعة الأشجار» = arboriculture"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC"
      expands:
        - text: "«الشَّجّار: زارع أشجار التزيين»"
          source: "المورد الحديث (2008) — ترجمة arboriculturist"
          addition: "يُثبت أن شجّار هو المصطلح المفرد المسكوك لهذا المفهوم، مما يجعل «زارع الأشجار» وصفاً وظيفياً مفتوحاً في مقابل المصطلح المعجمي المفرد"

    - lemma: "حَرَّاجٌ"
      confirm:
        - text: "«(2) الحرّاج: مراقب الأحراج»"
          source: "المورد الحديث (2008) — ترجمة forester (المعنى الثاني)"

    - lemma: "مُشَجِّرٌ"
      contradicts:
        - text: "«(المشجر) منبت الشّجر وكل مساحة يغطيها الشّجر قليلا كان أو كثيرا»"
          source: "المعجم الوسيط"
          conflict: "المشجَّر في المعاجم اسم مكان (arboretum) لا اسم شخص أو مهنة"
        - text: "«مَشْجَر» = arboretum"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) ومسرد المناخ والبيئة"
          conflict: "التطابق مع المكان (arboretum) يناقض الاستخدام المقصود للدلالة على شخص"

    - lemma: "خَبِيرُ الْحَرَاجَةِ"
      evidence_status: "no_material_found"

    - lemma: "مُحَرِّجٌ"
      contradicts:
        - text: "«حرَّجَ الشَّيءَ: منعه وحرَّمه. حرَّج عليه: ضيَّق وشدَّد»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "التحريج في الاستعمال الفصيح الموثَّق = التضييق والتحريم، لا إنشاء الأحراج الغابية. الدلالة تناقض مفهوم المجموعة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "حراجي"
      decision: confirmed
      decision_reason: "المورد الحديث يُثبت صراحةً «الحِراجِيّ: الخبير بعلم الحِراجة» لـ forester. الأدلة تحسم الضبط: حِرَاجِيٌّ (نسبة إلى الحِراج = الأحراج) لا حَرَّاجِيٌّ. المصطلح راسخ في المعجمية الحديثة، وزنه الصرفي فِعَالِيّ (نسبة) مناسب للانتساب إلى الحقل العلمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح العلمي الأكاديمي الأدق للمتخصص في الحراجة كعلم مُقنَّن؛ يُركِّز على التكوين الأكاديمي والبُعد البحثي والعلمي، في مقابل سائر اللمّات التي تبرز جوانب وظيفية أو تطبيقية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِرَاجِيٌّ"

    - lemma: "خبير الغابات"
      decision: confirmed
      decision_reason: "وإن لم يُعثَر عليه مدخلاً مستقلاً في المعاجم، فهو مركب إضافي شفاف مستعمَل في الأدبيات العلمية العربية لإدارة الغابات. يجتاز اختبار التثبيت المعجمي بوصفه وصفاً وظيفياً راسخاً في اللغة المتخصصة. مقبول مع التحفظ على كونه وصفياً مفتوحاً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الوصف الوظيفي الأشمل للاختصاصي في شؤون الغابات بمعناها الإداري والاستشاري والميداني؛ أوسع دلالةً من حِرَاجِيٌّ الذي يقيِّد المعنى بالتكوين العلمي الأكاديمي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَبِيرُ الْغَابَاتِ"

    - lemma: "زارع الأشجار"
      decision: confirmed
      decision_reason: "يطابق arboriculturist بصورة أدق من forester: AGROVOC يُساوي «زراعة الأشجار» بـ arboriculture، والمورد الحديث يُعرِّف الشجّار بـ«زارع أشجار التزيين» = arboriculturist. المركب وصفي مفتوح لكنه صحيح دلالياً ويؤدي وظيفة تمييزية في المجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يبرز الجانب التطبيقي المتخصص في زراعة الأشجار وتربيتها وخاصةً الزينية منها (≈ arboriculturist)؛ في مقابل حِرَاجِيٌّ الذي يُركِّز على العلم الغابوي الأشمل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَارِعُ الْأَشْجَارِ"

    - lemma: "حَرَّاجٌ"
      source: stage1
      decision: confirmed
      decision_reason: "المورد الحديث يُثبت «الحرّاج: مراقب الأحراج» ضمن مداخل forester. وزن فَعَّال من ح-ر-ج دال على الحرفة الميدانية (نجّار، حدّاد). مصطلح مفرد مسكوك لا يجتاز اختبار الاستبدال. يُضاف بوصفه مرادفاً مكمِّلاً للجانب الإشرافي الميداني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مُشرف الأحراج ومراقبها ميدانياً؛ يُركِّز على الدور الإشرافي والحراسي دون اشتراط التكوين الأكاديمي الذي تستلزمه «حِرَاجِيٌّ»"
      actions:
        - command: create_entry
          params:
            lemma: "حَرَّاجٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10124525-n"

    - lemma: "مُشَجِّرٌ"
      source: stage1
      decision: removed
      decision_reason: "المعاجم تُجمع على أن المشجَّر اسم مكان (منبت الشجر = arboretum)، لا اسم فاعل لشخص. الوزن مُفَعِّل يُستعمل هنا للمكان لا للمهنة. لا مسوِّغ لإدراجه."

    - lemma: "خَبِيرُ الْحَرَاجَةِ"
      source: stage1
