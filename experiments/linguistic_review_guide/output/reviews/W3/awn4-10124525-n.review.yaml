      decision_reason: "مكرِّر دلالياً مع «خبير الغابات» الموجودة في المجموعة دون فرق دلالي واضح يستحق التمييز. لا شاهد معجمي مستقل. مردود بمبدأ عدم التكرار."

    - lemma: "مُحَرِّجٌ"
      source: stage1
      decision: removed
      decision_reason: "حرَّج في الاستعمال الفصيح الموثَّق = ضيَّق وحرَّم، لا أنشأ حرجاً من الأشجار. الدلالة تعارض مفهوم المجموعة تعارضاً جذرياً."

