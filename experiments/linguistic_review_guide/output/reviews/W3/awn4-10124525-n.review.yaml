      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المفرد المسكوك المقابل لـ arboriculturist — المختص بزراعة الأشجار وتربيتها خاصةً للتزيين؛ في مقابل «زَارِعُ الْأَشْجَارِ» الوصفي المفتوح الذي يؤدي معناه ذاته"
