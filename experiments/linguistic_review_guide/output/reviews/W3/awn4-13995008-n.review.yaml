# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13995008-n (conciliation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «توفيق» يحمل حمولة دلالية تراثية قوية (التوفيق الإلهي) قد تلتبس بالمعنى المصطلحي الحديث (التوفيق بين الأطراف)"
      - "التعريف العربي الحالي يصف العملية أكثر من الحالة الناتجة عنها؛ المفهوم الإنجليزي يؤكد أنها حالة (state) لا فعل"
      - "لفظ «مصالحة» أقرب دلالياً إلى reconciliation منه إلى conciliation، وهما مفهومان متمايزان في القانون الدولي"
    observations: "المجموعة تنتمي إلى حقل السلام والعلاقات بين الأطراف، وهي فرع من awn4-13993683-n (سلام). المفهوم المستهدف هو الحالة التي يُبدي فيها الطرفان حسن النية والتعاون بعد تسوية خلافهما، لا عملية التسوية نفسها. في العربية التراثية والمعاصرة توجد ألفاظ متعددة تغطي هذا الحقل الدلالي: صلح، وفاق، مصالحة، توفيق، موادعة."

  blind_candidates:
    - lemma: "وِفَاق"
      generation_method: ishtiqaq
      justification: "من الجذر و-ف-ق على وزن فِعَال الدال على الحالة، يدل على الملاءمة والاجتماع على أمر واحد، وهو أقرب إلى وصف حالة التوافق بعد الصلح"
    - lemma: "مُصَافَاة"
      generation_method: ishtiqaq
      justification: "من الجذر ص-ف-و على وزن مُفَاعَلَة، تدل على إخلاص المودة وصدق الإخاء، وهي حالة تعقب التصالح حين يصفو ما بين الطرفين"
    - lemma: "تَصَالُح"
      generation_method: ishtiqaq
      justification: "من الجذر ص-ل-ح على وزن تَفَاعُل الدال على المشاركة، يصف حالة الاصطلاح المتبادل بين طرفين"
    - lemma: "مُوَادَعَة"
      generation_method: ishtiqaq
      justification: "من الجذر و-د-ع على وزن مُفَاعَلَة، تدل على المسالمة والمتاركة وهي شبه المصالحة كما في كتاب العين"

stage2_evidence:
  per_lemma:
    - lemma: "تَوْفِيق"
      confirm:
        - text: "«(التَّوْفِيق) من الله للعبد سد طريق الشر وتسهيل طريق الخير... و(في القانون الدولي) محاولة إحدى الدول الإصلاح بين دولتين متنازعتين (مج)»"
          source: "المعجم الوسيط"
        - text: "«تسوية خلاف بين دولتين أو أكثر عن طريق لجنة تتولّى دراسة أسباب الخلاف أو النزاع وتقدم اقتراحات لإنهائه قد يقبل بها الأطراف أو يرفضونها.»"
          source: "المعجم الموحد لمصطلحات المياه (ARABTERM) — translation_en: conciliation"
        - text: "«تَوْفيق: من (و ف ق) الإصلاح بين القوم، وسد الله طريق الشر للعبد وتسهيل طريق الخير له، ومحاولة الإصلاح بين المتنازعين.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«مصالحة؛ توفيق إلخ.» — translation_en: reconciliation|reconcilement"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التوفيق: جعل الله فعل عباده موافقًا بما يحبه ويرضاه.»"
          source: "كتاب التعريفات للجرجاني"
          addition: "المعنى الأصلي الكلامي: التوفيق الإلهي، مختلف عن المعنى المصطلحي الحديث"
        - text: "«التوفيق: خلق القدرة على الطاعة»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "معنى كلامي عقدي لا صلة له بالتوفيق الدبلوماسي"

    - lemma: "مُصَالَحَة"
      confirm:
        - text: "«الخطوات المتخذة لمعالجة أو لتحسين العلاقات التي أصابها التوتر بسبب نزاع معين.» — translation_en: reconciliation"
          source: "المعجم الموحد لمصطلحات المياه (ARABTERM)"
        - text: "«مصالحة؛ توفيق إلخ.» — translation_en: reconciliation|reconcilement"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«لجنة التوفيق، لجنة المصالحة — من وسائل المصالحة بين نقابات العمال وأرباب العمل» — translation_en: conciliation commission"
          source: "المعجم الموحد لمصطلحات الاقتصاد (ARABTERM)"
          addition: "المصالحة والتوفيق يُستعملان معاً في سياق تسوية النزاعات"

    - lemma: "وِفَاق"
      contradicts:
        - text: "«(الوِفَاق) (في القانون الدولي) اصطلاح يطلق على مختلف الاتفاقات الدولية في أي صورة كانت ولو بتبادل الخطابات مثلاً (مج)»"
          source: "المعجم الوسيط"
          conflict: "الوفاق في المعجم الوسيط يدل على الاتفاقات الدولية عموماً لا على حالة ما بعد المصالحة خصوصاً"
      expands:
        - text: "«وِفَاق: من (و ف ق) الملاءمة بين الشيئين، والاجتماع على أمر واحد.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المعنى العام: توافق وملاءمة، وليس خاصاً بما بعد الخلاف"

    - lemma: "مُصَافَاة"
      confirm:
        - text: "«مُصَافَاة: من (ص ف و) صدق الإخاء والمودة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«مُصَافَاة: من (ص ف و) صدق الإخاء والمودة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المصافاة تدل على إخلاص المودة بشكل عام، لا تختص بحالة ما بعد التصالح"

    - lemma: "تَصَالُح"
      confirm:
        - text: "«تَصَالَحَ القومُ: اصْطَلحُوا»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«تَصَالَحَ القومُ: اصْطَلحُوا»"
          source: "المعجم الكبير"
          conflict: "المُدوَّن في المعجم فعل (تَصَالَحَ) لا مصدر (تَصَالُح)، والمعنى هو فعل الاصطلاح لا الحالة الناتجة"

    - lemma: "مُوَادَعَة"
      confirm:
        - text: "«المُوادَعَة: شبه المصالحة»"
          source: "كتاب العين"
      contradicts:
        - text: "«المُوَادعة: متاركةُ الحرب.»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "الموادعة أقرب إلى الهدنة والمتاركة منها إلى حالة حسن النية والتعاون"
      expands:
        - text: "«المُوَادَعَةُ: الْمُصَالَحَةُ وَالْمُتَارَكَةُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يجمع بين المصالحة والمتاركة في معنى الموادعة"

stage3_analysis:
  per_lemma:
    - lemma: "تَوْفِيق"
      decision: confirmed
      decision_reason: "ثبت استعمال «توفيق» بمعنى conciliation في المعاجم المصطلحية الحديثة (القانون، الاقتصاد، هندسة المياه) وفي المعجم الوسيط بمعنى الإصلاح بين المتنازعين. وإن كان المعنى التراثي مختلفاً (التوفيق الإلهي)، فالمعنى الاصطلاحي مستقر ومقبول."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل في السياق الرسمي والدبلوماسي والقانوني، ويشير إلى عملية التوفيق بين أطراف متنازعة عبر طرف ثالث، ثم حالة الوفاق الناتجة. يختلف عن «مصالحة» بأنه يفترض وساطة طرف خارجي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوْفِيق"

    - lemma: "مُصَالَحَة"
      decision: confirmed
      decision_reason: "ثبت استعمال «مصالحة» بمعنى reconciliation وconciliation في المعاجم الحديثة والمصطلحية، وهي مصدر ميمي من صالَحَ يدل على المشاركة في الصلح. لفظ فصيح مسكوك مستقر الاستعمال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على عملية الصلح المتبادل بين الطرفين مباشرة دون اشتراط وسيط، وعلى الحالة الناتجة. أعمّ من «توفيق» الذي يفترض طرفاً ثالثاً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُصَالَحَة"

    - lemma: "وِفَاق"
      source: stage1
      decision: removed
      decision_reason: "الوفاق في المعجم الوسيط مصطلح قانوني دولي يطلق على الاتفاقات الدولية عموماً (entente/accord)، وليس خاصاً بحالة ما بعد التصالح. دلالته أعمّ وأبعد عن المفهوم المستهدف."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُصَافَاة"
      source: stage1
      decision: removed
      decision_reason: "المصافاة تدل على إخلاص المودة وصدق الإخاء بشكل عام، وليست مختصة بحالة ما بعد التصالح أو النزاع. لا تحمل دلالة التسوية أو حل الخلاف."
      evidence_assessment:
        case: mixed

    - lemma: "تَصَالُح"
      source: stage1
      decision: removed
      decision_reason: "المادة المعجمية تسجّل الفعل «تصالح» لا المصدر، والمعنى هو فعل الاصطلاح المتبادل لا الحالة الناتجة عنه. كما أن المفهوم المستهدف (conciliation) يتمايز عن مجرد التصالح بوجود بُعد حسن النية والتعاون المستمر."
      evidence_assessment:
        case: mixed

    - lemma: "مُوَادَعَة"
      source: stage1
      decision: removed
      decision_reason: "الموادعة في التعريفات الفقهية «متاركة الحرب» أي هدنة أو كفّ عن القتال، وهي أقرب إلى ceasefire/truce منها إلى conciliation. دلالتها سلبية (كفّ عن الشر) لا إيجابية (إبداء حسن النية والتعاون)."
      evidence_assessment:
        case: mixed

