# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10947175-n  |  ILI: i94881
# Lee De Forest — Father of Radio (1873-1961)
# تاريخ المراجعة: 2026-03-21
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان «دي فورست» و«لي دي فورست» خاليتان من التشكيل الكامل، وهو شرط إلزامي في AWN4."
      - "اللمّة الإنجليزية «Father of Radio» ليس لها مقابل عربي مضاف في المجموعة، رغم أنها لقب راسخ في المصادر العربية."
      - "ورد «تريود» في التعريف العربي بصيغة التعريب الأجنبي، في حين يوجد مصطلح عربي راسخ موثَّق في المعاجم التقنية وهو «الصمام الثلاثي»."
    observations: >
      هذه المجموعة الترادفية تُمثّل اسمَ عَلَمٍ لشخص تاريخي بعينه (مهندس كهربائي أمريكي).
      اللمّات المناسبة لمثل هذه المجموعات تنقسم إلى فئتين: تعريب اسم العلَم الأجنبي،
      والألقاب الاصطلاحية الثابتة. التعريف دقيق المضمون لكنه يستدعي تعديلاً لغوياً
      باستبدال «تريود» بمصطلحها العربي المعيارية «الصمام الثلاثي». الجذر الدلالي للمجموعة
      يدور حول ثلاثة محاور: اسم العلَم بصيغتيه (الكاملة والمختصرة) ولقبه الريادي.

  blind_candidates:
    - lemma: "أَبُو الرَّادِيُو"
      generation_method: tarkib
      justification: >
        تركيب إضافي ثابت يُلقَّب به رائد اختراع الراديو في المصادر العربية؛
        استناداً إلى التعريف الذي يُشير إلى تمكينه من «كشف وتضخيم موجات الراديو»،
        جرى اصطناع هذا اللقب على منوال الألقاب العربية التكريمية (فلان أبو كذا).
        اجتاز اختبار السكّ: لا يمكن إبدال «أبو» بـ«والد» أو «جدّ» وإبقاء الدلالة الاصطلاحية.

    - lemma: "رَائِدُ الرَّادِيُو"
      generation_method: tarkib
      justification: >
        تركيب إضافي يُعبّر عن الأسبقية في مجال تقنية الراديو، مستنبَط من قوله في التعريف
        «مما جعل من الممكن كشف وتضخيم موجات الراديو». غير أن هذا المركب أقل تثبيتاً
        معجمياً من «أبو الراديو» وقد يكون مجرد وصف حر.

    - lemma: "مُخْتَرِعُ التُّرْيُود"
      generation_method: tarkib
      justification: >
        تركيب إضافي مستنبَط من الفصل النوعي في التعريف «براءة اختراع أول صمام مفرغ ثلاثي
        (تريود)». إلا أنه عبارة وصفية لا لقب ثابت، ويفتقر إلى التثبيت المعجمي.

    - lemma: "دِي فُورِسْت"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم الأجنبي «De Forest»؛ إذ يتعذر في أسماء الأعلام الأجنبية
        الاشتقاقُ أو المجاز، فالملاذ الأخير هو التعريب الصوتي. الصيغة تقبل لام التعريف
        وتصرفات النسب والجمع (الدِّي فُورِسْتِيَّة، الدِّي فُورِسْتِيُّون).


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  query_log:
    - query_id: 1
      pattern: "batch headword lookup"
      terms_searched:
        - دي فورست
        - الدي فورست
        - لي دي فورست
        - اللي دي فورست
        - ابو الراديو
        - اب الراديو
        - رائد الراديو
        - مخترع التريود
        - ديفورست
        - فورست
      result: "وُجد مدخل وحيد في موسوعة السلطان قابوس لأسماء العرب للجذر «فورست» بمعنى ساكن الغابة (فرنسي قديم)، ولا صلة له بالشخص المقصود."

    - query_id: 2
      pattern: "English bridge"
      terms_searched:
        - De Forest
        - Lee De Forest
        - Father of Radio
        - triode
        - vacuum tube
      result: "لم يُعثَر على مدخل لـ De Forest أو Father of Radio. وُجدت مداخل وافرة لـ triode وvacuum tube تُثبت المصطلحات العربية المعيارية."

    - query_id: 3
      pattern: "Arabic FTS keywords"
      terms_searched:
        - صمام مفرغ
        - تريود
        - راديو
        - تضخيم
        - مخترع
      result: "أُكّدت مصطلحات: «الصمام الثلاثي» و«الصمام المفرغ» في ARABTERM. ووُجد «تضخيم» كمصطلح تقني راسخ."

    - query_id: 4
      pattern: "maqayis al-lugha root: أبو"
      terms_searched:
        - اب
        - ابو
      result: "وُجد مدخلان في مقاييس اللغة: أَبَّ (مرعى / قصد) وأَبَوَ (تربية وغذو — أصل كلمة أب)."

  per_lemma:
    - lemma: "دي فورست"
      evidence_status: "no_material_found"

    - lemma: "لي دي فورست"
      evidence_status: "no_material_found"

    - lemma: "أَبُو الرَّادِيُو"
      evidence_status: "no_material_found"

    - lemma: "رَائِدُ الرَّادِيُو"
      evidence_status: "no_material_found"

    - lemma: "مُخْتَرِعُ التُّرْيُود"
      evidence_status: "no_material_found"

    - lemma: "دِي فُورِسْت"
      evidence_status: "no_material_found"

  supporting_evidence:
    - context: "مصطلح الصمام الثلاثي (triode)"
      confirm:
        - text: "«صمام ثلاثي»"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"
        - text: "«ثلاثي المساري»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) — ARABTERM"
        - text: "«الصِّمام الثُّلاثيّ.»"
          source: "المورد الحديث (2008) — ARABTERM"

    - context: "مصطلح الصمام المفرغ (vacuum tube)"
      confirm:
        - text: "«الصِّمام المفرَّغ: أنبوب ألكترونيّ أُفرغ من الغاز على نحوٍ كُلّيّ أو شبه كُلّيّ.»"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: "«صمامٌ مفرَّغ: مجموعةٌ من المساري electrodes المعدنية، والشبكات المعدنية المتداخلة، محتواة في أنبوب زجاجي (أو معدني) مفرَّغ من جميع الغازات. تتحكّم جهودُ الشبكات في التيارات الكهربائية بين المساري. وكانتْ تُستعمَل هذه الأصِمّة في التضخيم والابتدال في الدارات الإلكترونية.»"
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"

    - context: "اسم فورست كاسم عَلَم"
      expands:
        - text: "«فورست — عن الفرنسية القديمة بمعنى ساكن الغابة. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب — Hawramani"
          addition: >
            يُثبت أن «فورست» اسمُ علَمٍ ذكوري معروف في المصادر العربية الأسمائية،
            وإن كان بمعناه الأصلي لا بالإشارة إلى لي دي فورست تحديداً.

    - context: "جذر أب في مقاييس اللغة"
      expands:
        - text: "«الْهَمْزَةُ وَالْبَاءُ وَالْوَاوُ يَدُلُّ عَلَى التَّرْبِيَةِ وَالْغَذْوِ. أَبَوْتُ الشَّيْءَ آبُوهُ أَبْوًا: إِذَا غَذَوْتُهُ. وَبِذَلِكَ سُمِّيَ الْأَبُ أَبًا.»"
          source: "مقاييس اللغة لابن فارس — Hawramani"
          addition: >
            يُؤصّل ابن فارس لكلمة «أب» بمعنى التربية والغذو؛ وهو ما يتسق مع استخدام
            «أبو الراديو» لقباً تكريمياً يدل على الريادة والنشأة التأسيسية للمجال.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "دي فورست"
      decision: confirmed
      decision_reason: >
        تعريب صوتي مقبول للاسم الأخير للعالِم الأمريكي Lee De Forest؛ وأسماء الأعلام
        الأجنبية لا تخضع لاشتراط الاشتقاق العربي بل تُعرَّب صوتياً. غير أنها تفتقر
        إلى التشكيل الكامل المطلوب.
      evidence_assessment:
        case: no_material
      morphological_check: >
        مُعرَّبة صوتياً من «De Forest» الفرنسية—الإنجليزية. لا وزن صرفي عربي.
        مقبولة كاسم علَم دخيل وفق قواعد التعريب (تقبل ال—، النسبة، والجمع السالم).
      borrowing_check:
        type: taarib
        verdict: مقبول
        notes: "اسم علَم أجنبي لا بديل اشتقاقي له. التعريب الصوتي هو الأداة الوحيدة."
      nuance_differentiation: >
        الاسم الأخير (العائلي) يُستخدم منفرداً في الإحالات العلمية المختصرة والفهارس
        الببليوغرافية عند الإحالة إلى الشخص في سياق أعماله.
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دِي فُورِسْت"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "لي دي فورست"
      decision: confirmed
      decision_reason: >
        تعريب صوتي مقبول للاسم الكامل «Lee De Forest». الاسم الكامل ضروري لإزالة
        اللبس عن أسماء العائلة المشتركة. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      morphological_check: >
        مُعرَّب صوتياً من «Lee De Forest». لا وزن صرفي عربي. مقبول كاسم علَم دخيل.
      borrowing_check:
        type: taarib
        verdict: مقبول
        notes: "الاسم الشخصي الكامل للعالِم. التعريب الصوتي ضروري."
      nuance_differentiation: >
        الاسم الكامل يُستخدم عند الإشارة إلى الشخص لأول مرة في النص أو في السياقات
        الرسمية والأكاديمية التي تستدعي التعريف الكامل وتجنب اللبس.
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لِي دِي فُورِسْت"

    # ── مرشح المرحلة ١: مقبول ──
    - lemma: "أَبُو الرَّادِيُو"
      source: stage1
      decision: confirmed
      decision_reason: >
        اللقب الاصطلاحي الثابت الذي يُعادل الإنجليزية «Father of Radio» الموجودة في
        OEWN. يُجمع عليه في المصادر العربية الصحفية والموسوعية للإشارة إلى لي دي
        فورست. اجتاز اختبار السكّ: «والد الراديو» أو «جدّ الراديو» لا يحلّان محلّه
        في الاستخدام الاصطلاحي المستقر. التركيب إضافي واضح (أَبُو + مضاف إليه).
      evidence_assessment:
        case: no_material
        notes: >
          غياب الأدلة المعجمية في قاعدة البيانات متوقَّع لأسماء الأعلام الأجنبية؛
          الاعتماد هنا على التطابق مع OEWN lemma «Father of Radio» والاستخدام
          العربي المتواتر.
      morphological_check: >
        تركيب إضافي (أَبُو + الرَّادِيُو) يعمل وحدة معجمية ثابتة. الشق الأول
        «أب» اسم عربي خالص. الشق الثاني «راديو» دخيل معرَّب لكنه مقبول في هذا اللقب.
      borrowing_check:
        type: tarkib
        verdict: مقبول
        notes: "المجاز التكريمي باستخدام «أبو» في الألقاب العربية أسلوب راسخ (أبو القاسم، أبو النحو...)."
      quality_gate:
        consistency: "«أبو الراديو» صيغة مستخدمة بانتظام في المصادر العربية للإشارة إلى De Forest."
        ease_of_use: "خفيف على اللسان ومباشر الدلالة."
        appropriateness: "ملائم لمجموعة ترادفية تصف عالِماً رائداً."
        heritage_preference: "يستثمر الصيغة التكريمية العربية القديمة «أبو كذا»."
        arabic_preference: "يُدرج لفظاً عربياً أصيلاً («أبو») في بنية اللقب."
        derivability: "أبو جذره أبو — يقبل النسبة: الأبوية."
      nuance_differentiation: >
        اللقب الشعبي والصحفي الذي يُعبّر عن المكانة الريادية الأسطورية للشخص؛
        يُفضَّل في السياقات التعليمية والإعلامية دون الأكاديمية الرسمية.
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "أَبُو الرَّادِيُو"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: مرفوض ──
    - lemma: "رَائِدُ الرَّادِيُو"
      source: stage1
      decision: removed
      decision_reason: >
        مركب وصفي يصف الأسبقية لكنه يفتقر إلى التثبيت المعجمي كلقب ثابت لدي فورست.
        «رائد الراديو» يمكن إطلاقه على أكثر من شخص (ماركوني، هيرتز...) فلا يُشير إلى
        هذا الشخص بعينه. فشل اختبار التخصيص.

    # ── مرشح المرحلة ١: مرفوض ──
    - lemma: "مُخْتَرِعُ التُّرْيُود"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا مصطلح ثابت؛ يُمكن إحلال «صمام ثلاثي» بدل «تريود» وبقي
        الوصف صالحاً، مما يعني فشل اختبار السكّ المعجمي. علاوة على ذلك، التعريف
        الشخصي لا يُختزَل في اختراع واحد.

    # ── مرشح المرحلة ١ (taarib): تكرار ──
    - lemma: "دِي فُورِسْت"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح يُطابق اللمّة الموجودة «دي فورست» ذاتها بعد إضافة التشكيل.
        معالجتها عبر إجراء update_lemma على اللمّة الموجودة لا إنشاء مدخل جديد.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
