# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
stage5_enrichment:
  per_entry:
    # اللمّة ١: دِي فُورِسْت — اسم علَم أجنبي، لا جذر عربي
    - lemma: "دِي فُورِسْت"
