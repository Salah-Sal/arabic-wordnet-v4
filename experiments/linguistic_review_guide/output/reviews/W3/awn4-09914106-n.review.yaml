# ══════════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-09914106-n  |  ILI: i88825  |  POS: n
# Concept: card player (لاعب ورق)
# ══════════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائري جزئياً: يستخدم فعل «يلعب» لتعريف اسم الفاعل «لاعب»، وهو ما يُفضي إلى استدارة منطقية"
      - "اللمّة الوحيدة «لاعب ورق» مركّبة وتفتقر إلى التشكيل الكامل في قاعدة البيانات"
      - "المجموعة تحتوي على لمّة واحدة فقط، مع احتمال وجود مرادفات أو صياغات بديلة شائعة"
    observations: >
      المجموعة الترادفية تمثّل مفهوماً دلالياً محدّداً هو «الشخص الذي يمارس ألعاب الورق».
      اللمّة الموجودة مركّبة إضافية (لاعب + ورق) وهي الصياغة الأكثر شيوعاً في العربية المعاصرة.
      الجذر لعب يحمل دلالة صريحة على النشاط الترفيهي غير الجادّ، في حين أن الجذر ورق يُحيل
      أصالةً إلى ورق الشجر ثم توسّع إلى الورق الكتابي ثم أوراق اللعب. التركيب الإضافي «لاعب ورق»
      هو الأصيل في هذا الاستخدام.
  blind_candidates:
    - lemma: "لاعِبُ الأَوْرَاقِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي بين اسم الفاعل «لاعِب» من الجذر لعب، وجمع «الأوراق» المُحدَّد بـ«ال».
        صيغة طبيعية في العربية تُوازي المفهوم المقصود، مع استخدام صيغة الجمع التي تُشير
        صراحةً إلى أوراق اللعب المتعددة لا إلى ورقة واحدة.
    - lemma: "وَرَّاقٌ"
      generation_method: majaz
      justification: >
        مجاز بالإزاحة الدلالية: الوَرَّاق أصله مَن يعمل بالورق (المورِّق والناسخ). يمكن
        استحياء هذا اللفظ مجازاً للدلالة على «المتعامل مع أوراق اللعب»، مستلهِماً تجانس
        المادة المادية (الورق). غير أنه لفظ ضعيف لاحتمال الاشتراك مع المعنى الأصلي.
    - lemma: "لَعَّابُ الوَرَقِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي بين «لَعَّاب» على وزن فعَّال (للمبالغة والحرفة) واسم «الورق».
        صيغة فعَّال تدلّ على الاحتراف أو المداومة على الفعل؛ وقد ورد في المعجم الوسيط
        «اللَّعَّاب: الذي حرفتُه اللعب»، مما يوحي بأنه الأكثر تعبيراً عن الممارسة المتكرّرة
        مقارنةً بـ«لاعب» التي تدلّ على مجرد المشاركة.
    - lemma: "مُلَاعِبُ الأَوْرَاقِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي بين اسم الفاعل على وزن مُفَاعِل (يدلّ على المشاركة والتبادل) و«الأوراق».
        صيغة المفاعلة تُلمح إلى البُعد الاجتماعي لألعاب الورق بوصفها نشاطاً تشاركياً بين
        أكثر من طرف، في إيحاء لا يتضمّنه «لاعب» البسيط.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات DB المُنفَّذة:
# [1] مطابقة دفعية: لاعب ورق + لاعب الورق + لاعب اوراق + وراق + الوراق + لعاب + اللعاب + ملاعب
# [2] الجسر الإنجليزي: "card player" OR "card game" OR "card games" → لا نتائج
# [3] FTS عربي: "لعب الورق" OR "لاعب ورق" OR "ألعاب الورق" → أثمر عن ذِكر عَرَضي
# [4] مقاييس اللغة: جذرَا لعب وورق (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "لاعِبُ وَرَقٍ"
      expands:
        - text: "«اللِّعَّابُ: اللعبةُ والَّذي حِرفتُه اللَّعِبُ كالحاوي والقرَّاد»"
          source: "المعجم الوسيط (OCR)"
          addition: >
            وإن كان الشاهد لصيغة «لعَّاب» لا «لاعب»، فإنه يثبت أن العربية تعرف
            النمط التعريفي «مَن حرفته اللعب»، وهو ما يُسنِد المفهوم الكليّ للمجموعة.
        - text: "«leg and leg: متعادل [في السباق أو لعب الورق]»"
          source: "المورد الوسيط (معجم عربي-إنجليزي، أدرج في FTS)"
          addition: >
            شاهد عَرَضي يُثبت أن مصطلح «لعب الورق» مستخدَم في السياق المعجمي العربي
            الحديث للإحالة إلى ألعاب الورق بوصفها نشاطاً محدداً.

    - lemma: "لاعِبُ الأَوْرَاقِ"
      evidence_status: "no_material_found"

    - lemma: "وَرَّاقٌ"
      contradicts:
        - text: "«الوَرَّاقُ: مورِّق الكتب الذى يورِّق ويكتب. الكثيرُ الدراهم. رجلٌ وَرَّاق: صاحب ورق»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            المعجم يثبت قطعاً أن «وَرَّاق» يدلّ على الناسخ/المورِّق أو صاحب المال،
            لا على لاعب أوراق. استخدامه للمفهوم المقصود سيُفضي إلى اشتراك لفظي حادّ.
        - text: "«وَرَّاق: مَن هيَّأ ورق الكتاب والكاتب فيه، والكثير الدراهم، محترف الوَرَّاقة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            يؤكّد المعنى الأصلي: مُهيِّئ الورق وكاتبه. لا صلة باللعب.

    - lemma: "لَعَّابُ الوَرَقِ"
      expands:
        - text: "«اللِّعَّابُ: اللعبةُ والَّذي حِرفتُه اللَّعِبُ كالحاوي والقرَّاد»"
          source: "المعجم الوسيط (OCR)"
          addition: >
            يُثبت وجود صيغة «لَعَّاب» بمعنى «من حرفته اللعب» في المعجم الوسيط،
            مما يدعم إمكانية تركيب «لعَّاب الورق» من حيث القياس الصرفي،
            وإن لم يُعثَر على هذا التركيب بعينه في المصادر.

    - lemma: "مُلَاعِبُ الأَوْرَاقِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "لاعب ورق"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة صرفياً ودلالياً: تركيب إضافي من اسم الفاعل «لاعِب» (فاعل من لعب)
        مضافاً إلى «ورق» بمعنى أوراق اللعب. التركيب شائع وطبيعي في العربية المعاصرة
        ويؤدّي المعنى المقصود بدقّة. يحتاج فقط إلى ضبط التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تجمع بين دلالة الممارسة الفعلية للّعب (لاعِب)
        ودلالة أداة اللعب المحدّدة (الورق)، فتُميِّز لاعبَ الورق عن لاعب الشطرنج
        أو لاعب الكرة أو غيره من الألعاب.
      borrowing_check:
        lexical: "عربي خالص — اسم فاعل مضاف، لا اقتراض"
        calque: "لا تُرجمة حرفية — تركيب عربي أصيل"
      morphological_fit: >
        اسم الفاعل «فَاعِل» من الجذر لعب يُلائم الدلالة على الممارِس المعتاد للفعل.
        الإضافة إلى «ورق» تحدّد نوع اللعب بدقّة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبُ وَرَقٍ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لاعِبُ الأَوْرَاقِ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم صحّة التركيب الصرفي، فإن هذه الصيغة مجرّد بديل شكلي للمّة الموجودة
        (لاعب ورق) بإضافة أداة التعريف وصيغة الجمع. لا تتمايز دلالياً تمايزاً كافياً
        يبرّر إضافتها لمّةً مستقلّة. لا أدلّة معجمية مثبِّتة.

    - lemma: "وَرَّاقٌ"
      source: stage1
      decision: removed
      decision_reason: >
        تعارض تامّ مع المعاجم: «وَرَّاق» محفوظ في التراث العربي بمعنى «مورِّق الكتب
        والناسخ وصاحب الورق». توظيفه للدلالة على «لاعب الورق» سيُنشئ اشتراكاً لفظياً
        حادّاً ويُصادم الدلالة الراسخة. المجاز غير مقبول هنا لأن الفصل بين المعنيين
        ليس اعتبارياً بل ينتمي كلٌّ منهما إلى حقل دلالي مختلف تماماً.

    - lemma: "لَعَّابُ الوَرَقِ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن صيغة «لَعَّاب» موثَّقة في المعجم الوسيط (الذي حِرفته اللعب)، فإن
        التركيب «لعَّاب الورق» لم يُعثَر له على توثيق معجمي، وهو يُفيد التخصيص
        المهني الزائد (المحترف) بينما المجموعة أوسع تعريفاً (يشمل من يعرف اللعب دون
        احتراف). كما أن «لاعب ورق» أشيع وأوضح.

    - lemma: "مُلَاعِبُ الأَوْرَاقِ"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة المفاعلة «مُلَاعِب» تدلّ أصلاً على الاشتراك في اللعب مع طرف آخر، وهو
        وجه دلالي زائد قد لا يناسب كل سياقات المجموعة (فلاعب الورق قد يلعب منفرداً
        بعض الأحيان). لا شواهد معجمية للتركيب. تُرفَض.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يلعب (أو يعرف كيف يلعب) ألعاب الورق"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يقع في دائرية لغوية جزئية: يستخدم «يلعب» لتعريف «لاعب»،
        وهما من الجذر نفسه. علاوةً على ذلك، العبارة الاعتراضية «أو يعرف كيف يلعب»
        أسلوب ركيك في التعريف المعجمي. يجب إعادة الصياغة وفق أسلوب المعجم الوسيط
        بجنس قريب وفصل نوعي.
    authored:
      - type: terminological
        text: "مَنْ يمارس ألعاب الورق أو يُحسن القيام بها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَنِ اعتاد اللعبَ بأوراق اللعب المصوَّرة أو أتقنها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09914106-n"
          definition_index: 0
          text: "مَنْ يمارس ألعاب الورق أو يُحسن القيام بها"

  examples:
    per_lemma:
