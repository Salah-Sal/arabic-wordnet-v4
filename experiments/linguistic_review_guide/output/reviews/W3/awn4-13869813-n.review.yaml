# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «الثامن» معرَّفة بأل، وهي صفة مشبّهة تُستعمل استعمال الاسم للدلالة على الرتبة، وقد تحتاج تشكيلاً كاملاً"
      - "نوع الكلمة في الشبكة (n) بينما الكلمة صرفيّاً صفة (adj) تُؤوَّل بالاسم"
    observations: "المجموعة بسيطة، تمثّل مفهوماً عددياً ترتيبياً (العدد الثامن بوصفه رتبةً في سلسلة). الأعداد الترتيبية في العربية تأتي على وزن فَاعِل من الجذر العددي، وتُستخدم استخدام الأسماء حين تدلّ على المرتبة ذاتها لا على الموصوف. اللمّة الوحيدة كافية دلالياً لكنّها تحتاج ضبطاً بالشكل."
  blind_candidates:
    - lemma: "ثَامِن"
      generation_method: ishtiqaq
      justification: "العدد الترتيبي المشتق من الجذر ث م ن على وزن فَاعِل، يدلّ مباشرة على الرتبة الثامنة. صيغة النكرة بدون أل التعريف."
    - lemma: "ثُمْن"
      generation_method: majaz
      justification: "أصله الجزء من ثمانية أجزاء (الكسر)، يُمدّ مجازاً بعلاقة المجاورة العددية إلى دلالة الرتبة الثامنة. ورد في المورد الحديث مقابلاً لـ eighth."
    - lemma: "الثَّامِنَة"
      generation_method: ishtiqaq
      justification: "مؤنث الثامن على وزن فَاعِلَة، يُستعمل حين يكون المعدود مؤنثاً أو محذوفاً مقدّراً بالمؤنث (كالساعة أو المرتبة أو الدرجة)."
    - lemma: "ثَمَانِيَة"
      generation_method: ishtiqaq
      justification: "العدد الأصلي (الكمّي) من نفس الجذر، يُستعمل أحياناً في سياقات التعداد، لكنّه يدلّ على الكمّ لا الترتيب."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "الثَّامِن"
      confirm:
        - text: "«عددٌ يقع - في الرُّتْبَة - بين السابع والتائسع»"
          source: "المعجم الكبير"
        - text: "«(1) الثامن؛ الثامنة (2) ثُمن.»"
          source: "المورد الحديث (2008)"
    - lemma: "ثَامِن"
      confirm:
        - text: "«عددٌ يقع - في الرُّتْبَة - بين السابع والتائسع»"
          source: "المعجم الكبير"
      expands:
        - text: "«ثامَنَه فى السلعة: ساومَهُ فى ثمنها»"
          source: "المعجم الوسيط"
          addition: "الفعل ثامَنَ يدلّ على المساومة لا على الرتبة، فالدلالة الترتيبية خاصّة بالصفة المشبّهة لا بالفعل"
    - lemma: "ثُمْن"
      contradicts:
        - text: "«وَأَمَّا الثُّمُنُ فَوَاحِدٌ مِنْ ثَمَانِيَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الثُّمْن دلالته الأصلية الكسر (جزء من ثمانية) لا الرتبة الثامنة"
      expands:
        - text: "«(2) ثُمن.»"
          source: "المورد الحديث (2008)"
          addition: "المورد الحديث يذكره مقابلاً ثانوياً لـ eighth بعد الثامن/الثامنة، مما يشير إلى استعمال ثانوي"
    - lemma: "الثَّامِنَة"
      confirm:
        - text: "«(1) الثامن؛ الثامنة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الثّامنة: عند أهل الهيئة والمنجّمين هي سدس عشر السابعة سواء أخذت السابعة من الدرجات أو من الساعات»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "دلالة فلكية اصطلاحية مختلفة عن الرتبة العامة"
        - text: "«من الإبل: التي يكونُ ظِمْؤُها الثَّمْنَ , وهو وُرودُ الماء الليلة الثامنة . عند أهْلِ الهَيْئة: سُدُسُ عُشْرِ الساعة»"
          source: "المعجم الكبير"
          addition: "دلالات متخصصة: إبلية (ورود الماء) وفلكية (جزء من الساعة)"
    - lemma: "ثَمَانِيَة"
      contradicts:
        - text: "«عددٌ للمُذَكَّرِ يُقالُ : سَبْعُ لَيالٍ وثمانِيَةُ أيامٍ»"
          source: "المعجم الكبير"
          conflict: "ثمانية عدد كمّي أصلي يدلّ على المقدار لا على الرتبة والترتيب"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "الثَّامِن"
      decision: confirmed
      decision_reason: "اللمّة صحيحة لغوياً ودلالياً، وهي الصيغة المعيارية للعدد الترتيبي الثامن المعرَّف بأل. المعجم الكبير يعرّفه بأنّه «عدد يقع في الرتبة بين السابع والتاسع» وهو مطابق تماماً لدلالة المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الثَّامِن"

    - lemma: "ثَامِن"
      source: stage1
      decision: removed
      decision_reason: "هي نفس اللمّة «الثامن» بدون أل التعريف. في سياق الأعداد الترتيبية المستعملة استعمال الأسماء للدلالة على الرتبة، الصيغة المعرّفة بأل هي المعيارية (الأوّل، الثاني، ... الثامن). إضافة صيغة النكرة لا تضيف قيمة معجمية جديدة."

    - lemma: "ثُمْن"
      source: stage1
      decision: removed
      decision_reason: "الثُّمن في المعاجم العربية يدلّ على الكسر (جزء واحد من ثمانية) لا على الرتبة الترتيبية. وإن ورد في المورد الحديث مقابلاً لـ eighth فإنّه بدلالة الكسر لا الترتيب. الخلط بينهما يُفسد الشبكة الدلالية."

    - lemma: "الثَّامِنَة"
      source: stage1
      decision: removed
      decision_reason: "مؤنث الثامن، وهي صيغة تخصيصية تُستعمل حين يكون المعدود مؤنثاً (الساعة الثامنة، المرتبة الثامنة). في الشبكة الدلالية، المجموعة تمثّل المفهوم المجرد للرتبة الثامنة بصرف النظر عن جنس المعدود، واللمّة المذكّرة «الثامن» تمثّل ذلك تمثيلاً أشمل. كذلك لها دلالات اصطلاحية مختلفة (فلكية، إبلية) قد تُسبّب التباساً."

    - lemma: "ثَمَانِيَة"
      source: stage1
      decision: removed
      decision_reason: "عدد كمّي أصلي يدلّ على المقدار والعدّ (ثمانية أيام) لا على الترتيب والرتبة. المعجم الكبير يعرّفه صراحةً بأنّه «عدد للمذكّر» بدلالة الكمّ."

