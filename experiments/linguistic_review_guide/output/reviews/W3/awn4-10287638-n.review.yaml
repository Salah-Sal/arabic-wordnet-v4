stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «خبير الطقوس» تركيبٌ إضافي وصفي حر، غير مسجّل كوحدة معجمية مستقلة في المعاجم المستعملة."
      - "غياب التشكيل الكامل عن اللمّة الموجودة."
      - "التعريف الحالي «حجة في الطقوس الدينية» قاصر: يُعيد استخدام مصطلح المستوى الأعلى (حجة) دون فصل نوعي كافٍ يميّز هذا المفهوم."
      - "كلمة «الطقوس» معرَّبة من اليونانية عبر السريانية (taxis/ṭaqsā)، وليس لها جذر عربي أصيل في المعاجم القديمة، مما يُعقّد الاشتقاق."
    observations: >
      المفهوم يُشير إلى متخصص في الطقوس الدينية (Liturgist) بمعنى الخبير الذي تُعدّ آراؤه مرجعاً
      في شعائر الكنيسة وترتيبها. هذا المفهوم ذو طابع مسيحي في الغالب. تدلّ المعاجم العربية الحديثة
      على أن العربية لا تملك مصطلحاً مفرداً راسخاً له، بل تعبّر عنه بعبارات وصفية (phraset).
      كلمة «خبير» موثّقة جيداً بمعنى ذي الخبرة والعلم، و«الطقوس» وارد في المعجم الوسيط جمعاً لـ«طقس»
      بمعنى «نظام الخدمة الدينية أو شعائرها واحتفالاتها (عند النصارى)».
  blind_candidates:
    - lemma: "طُقُوسِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة على وزن فُعُولِيّ مُشتقّة من «طُقُوس» (جمع طَقْس) بمعنى شعائر دينية، يمكن أن تُستعمل
        اسماً مجسِّداً (substantivized nisba) للدلالة على المتخصص في الطقوس الدينية.
        أسلوب معروف في العربية لبناء أسماء المتخصصين (كـ«مَسْرَحِيّ» و«سِينَمَائِيّ»).
    - lemma: "مَنَاسِكِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة مشتقة من «مَنَاسِك» (جمع مَنْسَك، جذر: نسك) بمعنى شعائر العبادة والتقرّب إلى الله.
        الجذر «نسك» دالٌّ على العبادة والتقرب في مقاييس اللغة. الصيغة الاسمية تشير
        إلى المتخصص في الشعائر الدينية.
    - lemma: "فَقِيهُ الطُّقُوس"
      generation_method: tarkib
      justification: >
        تركيب إضافي: «فَقِيه» (العالم الفطن بأصول الشريعة) + «الطُّقُوس» (الشعائر الدينية).
        يُفيد المعنى: الخبير في أحكام الطقوس الدينية وفقهها، على غرار المصطلحات التراثية
        كـ«فقيه الدار» و«فقيه اللغة».
    - lemma: "رِتْلِيٌّ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من «رَتَّلَ / تَرْتِيل» (التلاوة الموزونة المرتّبة)، جذر: رتل.
        الترتيل في الأصل يشير إلى الإلقاء المنظّم لنصوص مقدسة؛ والطقوس الدينية تُؤدَّى
        بترتيل وترتيب. المجاز: من فعل الترتيل → المتخصص في ترتيب الطقوس وإقامتها.


