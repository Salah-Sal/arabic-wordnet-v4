stage3_analysis:
  per_lemma:

    - lemma: "خبير الطقوس"
      decision: confirmed
      decision_reason: >
        المركب الإضافي «خَبِيرُ الطُّقُوس» يعبّر تعبيراً وظيفياً مقبولاً عن مفهوم «an authority on
        liturgies»؛ فـ«خبير» موثَّق بمعنى «ذي الخبرة والعلم» في المعجم الوسيط والكبير، و«الطقوس»
        موثَّق بمعنى شعائر الكنيسة الدينية. غياب مصطلح مفرد راسخ للمفهوم في العربية (phraset) يجعل
        هذا المركب الاستعمال الأفضل المتاح. يُصحَّح التشكيل ليكون: خَبِيرُ الطُّقُوس.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تجمع بين دلالة «الخبرة المعرفية» (خبير) و«السلطة المرجعية»
        في ميدان الطقوس الدينية، وهو ما يميّزها عن الصياغات الإجرائية كـ«الكاهن» (فاعل الطقوس)
        أو «المتمسك بالطقوس» (الملتزم بها).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَبِيرُ الطُّقُوس"

    - lemma: "طُقُوسِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «طُقُوسيّ» غير موثَّق اسماً مستقلاً يدل على شخص في أيٍّ من المعاجم. المصادر تثبت
        «طَقْسيّ» (بالفتح لا الضم) كصفة فحسب. اختبار السكّ يُخفق: «الطقوسيّ» لا يُعدّ وحدة
        معجمية ثابتة لهذا المعنى. فضلاً عن أن الوزن النسبي فُعُولِيّ قياسي لكن غير مُفعَّل
        بهذا المعنى في مصادر معتمدة.

    - lemma: "مَنَاسِكِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «مناسكيّ» غير وارد في أيٍّ من المعاجم المستعملة. كما أن «مناسك» في الاستعمال
        العربي مرتبطة أساساً بمناسك الحج، لا بالطقوس الكنسية تحديداً، مما يُوجد تضارباً
        دلالياً مع المفهوم المقصود.

    - lemma: "فَقِيهُ الطُّقُوس"
      source: stage1
      decision: removed
      decision_reason: >
        «فقيه» يحمل دلالة إسلامية راسخة (عالم الشريعة)، مما يُفضي إلى التباس حين
        يُضاف إلى «الطقوس» ذات الطابع المسيحي. فضلاً عن ذلك، لم يرد هذا التركيب في
        أيٍّ من المصادر المعجمية. اختبار الاستبدال يكشف أنه مجرد عبارة وصفية حرة.

    - lemma: "رِتْلِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود لـ«رِتْلِيّ» في المعاجم بمعنى متخصص في الطقوس. جذر «رتل» يدل على
        الترتيل الصوتي لا على الخبرة في الطقوس بمفهومها الأشمل. المجاز مُقنع نظرياً
        لكن غير متحقق في الاستعمال المعجمي الفعلي.


