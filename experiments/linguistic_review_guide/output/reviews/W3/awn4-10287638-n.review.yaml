stage2_evidence:
  per_lemma:

    - lemma: "خبير الطقوس"
      confirm:
        - text: >
            «الطَّقْسُ: النظام والترتيب (عند النصارى): نظام الخدمة الدينية أو شعائرها
            واحتفالاتها؛ حالة الجو أو المناخ (محدثة)»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >
            «الطَّقْسُ: الطَّرِيقَةُ, وغَلَبَ على الطَّريقَة الدينيَّةِ, بمعنى النظام والترتيب
            وإقامة الشعائر»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «خَبِير: أعلم الناس بالرجل صاحبه ومخالطه؛ الرئيس؛ المُخبِر (فعيل بمعنى مُفعِل)»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: >
            «خبير: (بالآثار والفنون)» — translation_en: connoisseur
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ALECSO)"
      expands:
        - text: >
            «(1) المتمسك بالطقوس الدينيّة؛ (2) الكاهن الذي يقود المؤمنين في أداء الطقوس الدينية؛
            (3) الاختصاصيّ في الطقوس الدينيّة.»
          source: "المورد الحديث (2008)، المقابل العربي لـ liturgist"
          addition: >
            يُقدّم المورد الحديث ثلاثة مقابلات عربية للـliturgist، كلّها عبارات وصفية لا مصطلح مفرد،
            مما يؤكد أن المفهوم phraset في العربية. المقابل الثالث «الاختصاصيّ في الطقوس الدينيّة»
            هو الأقرب لمعنى السينسيت (سلطة/خبرة لا مجرد ممارسة).
        - text: >
            «طقس: (باليونانية تَكْسِيس): عند النصارى شعائر الديانة واحتفالاتها.
            طَقْسيّ: مختص بالطَقْس الكنسي أي نظام الخدمة الدينية أو أمور التعبد.»
          source: "تكملة المعاجم العربية (دوزي، ت. 1883)"
          addition: >
            يُثبت دوزي استعمال «طقسي» نسبةً إلى الطقس الكنسي، ويُؤرخ لدخول الكلمة المعرّبة
            من اليونانية عبر السريانية، مما يُعزّز مقبوليّة «خبير الطقوس» كمصطلح حديث.

    - lemma: "طُقُوسِيٌّ"
      expands:
        - text: >
            «سُلوكٌ طُقوسِيّ» — translation_en: ritualistic behavior
          source: "المعجم الطبي الموحد (ALECSO، 2009)"
          addition: >
            «طقوسي» مُوثَّق كصفة في التركيبات الاصطلاحية الطبية، لكنه غير موثَّق
            اسماً مستقلاً يدل على شخص.
        - text: >
            «ليتورجيّ؛ طَقْسيّ: «أ» ذو علاقة بالطقوس الدينية. «ب» ممارسٌ أو محبِّذ
            لممارسة الطقوس الدينية.»
          source: "المورد الحديث (2008)، المقابل العربي لـ liturgical"
          addition: >
            المورد الحديث يُقابل «liturgical» بـ«طَقْسيّ» (بصاد مكسورة لا مضمومة)،
            وليس «طُقُوسِيّ». هذا يُشير إلى أن الصيغة المعيارية هي «طَقْسيّ» لا «طُقُوسيّ».

    - lemma: "مَنَاسِكِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "فَقِيهُ الطُّقُوس"
      expands:
        - text: >
            «الفقيه: العالم الفَطِنُ؛ العالِم بأصول الشريعة وأحكامها, واستعمل فيمن يقرأ
            القرآن ويعلِّمه»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: >
            «فقيه» مُخصَّص في الاستعمال الحديث لعالم الشريعة الإسلامية. استخدامه
            في سياق الطقوس المسيحية مُصطنع ويوقع التباساً.

    - lemma: "رِتْلِيٌّ"
      evidence_status: "no_material_found"


