stage4_content:
  definition:
    current: "خليج من البحر الأبيض المتوسط في جنوب غرب تركيا"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق لكن يمكن تحسين صياغته لغوياً وتشكيله."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ بَحْرِيٌّ فِي الْبَحْرِ الْأَبْيَضِ الْمُتَوَسِّطِ، يَقَعُ فِي الْجِهَةِ الْجَنُوبِيَّةِ الْغَرْبِيَّةِ مِنَ السَّاحِلِ التُّرْكِيِّ، وَيَضُمُّ مَدِينَةَ أَنْطَالِيَا السِّيَاحِيَّةَ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09320010-n", definition_index: 0, text: "خَلِيجٌ بَحْرِيٌّ فِي الْبَحْرِ الْأَبْيَضِ الْمُتَوَسِّطِ، يَقَعُ فِي الْجِهَةِ الْجَنُوبِيَّةِ الْغَرْبِيَّةِ مِنَ السَّاحِلِ التُّرْكِيِّ."}
  examples:
    per_lemma:
      - lemma: "خَلِيجُ أَنْطَالِيَا"
        examples:
          - text: "يُعَدُّ خَلِيجُ أَنْطَالِيَا مِنْ أَهَمِّ الْمَرَافِقِ الطَّبِيعِيَّةِ عَلَى سَاحِلِ لِيقِيَا التَّارِيخِيِّ."
            type: usage
      - lemma: "خَلِيجُ أَدَالِيَا"
        examples:
          - text: "عُرِفَ خَلِيجُ أَنْطَالِيَا فِي بَعْضِ الْخَرَائِطِ الْبَحْرِيَّةِ الْقَدِيمَةِ بِاسْمِ خَلِيجِ أَدَالِيَا."
            type: usage
      - lemma: "خَلِيجُ أَنْطَالِيَة"
        examples:
          - text: "وَصَفَ الْجُغْرَافِيُّونَ الْعَرَبُ قَدِيمًا خَلِيجَ أَنْطَالِيَةَ بِأَنَّهُ حِصْنٌ مَنِيعٌ عَلَى شَطِّ الْبَحْرِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-09320010-n", text: "يَمْتَدُّ خَلِيجُ أَنْطَالِيَا لِمَسَافَةٍ طَوِيلَةٍ عَلَى السَّاحِلِ الْجَنُوبِيِّ لِتُرْكِيَا."}

