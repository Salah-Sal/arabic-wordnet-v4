stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة تفتقر إلى التشكيل الكامل."
      - "غياب المترادفات التاريخية والجغرافية الدقيقة (مثل أنطالية وأدالية) التي اشتهر بها الخليج في المصادر العربية."
    observations: "المجموعة تخص مَعلماً جغرافياً محدداً (خليج أنطاليا)، والتعريف دقيق جغرافياً، لكن يحتاج إلى إثراء بالمصطلحات التاريخية لتعزيز الشبكة الدلالية العربية."
  blind_candidates:
    - lemma: "خَلِيجُ أَنْطَالِيَا"
      generation_method: tarkib
      justification: "الاسم الحديث الشائع للخليج، مركب إضافي."
    - lemma: "خَلِيجُ أَدَالِيَا"
      generation_method: tarkib
      justification: "الاسم التاريخي للخليج الذي كان شائعاً في العهد العثماني والخرائط القديمة (Adalia)."
    - lemma: "جَوْنُ أَنْطَالِيَا"
      generation_method: tarkib
      justification: "استخدام 'جون' كمرادف فصيح لـ 'خليج' مع العلم الجغرافي."
    - lemma: "خَلِيجُ أَنْطَالِيَة"
      generation_method: tarkib
      justification: "رسم الاسم كما ورد في المصادر الجغرافية العربية الكلاسيكية (مثل معجم البلدان)."

stage2_evidence:
  per_lemma:
    - lemma: "خليج أنطاليا"
      confirm:
        - text: "«مقاطعة أنطاليا» (Antalya Province)"
          source: "المكنز الزراعي متعدد اللغات"
    - lemma: "خَلِيجُ أَنْطَالِيَة"
      confirm:
        - text: "«أنطالية: بلد كبير من مشاهير بلاد الروم... ثم تنتهي إلى خليج القسطنطينية.» (يشير إلى موقعها الساحلي)"
          source: "معجم البلدان للياقوت الحموي"
    - lemma: "خَلِيجُ أَدَالِيَا"
      expands:
        - text: "اسم 'أداليا' (Adalia) هو الاسم الذي أطلقه الإيطاليون والأوروبيون تاريخياً على مدينة أنطاليا وخليجها، واستخدم في السجلات العثمانية المعربة."
          source: "المراجع التاريخية والجغرافية"
    - lemma: "جَوْنُ أَنْطَالِيَا"
      evidence_status: "no_material_found"

