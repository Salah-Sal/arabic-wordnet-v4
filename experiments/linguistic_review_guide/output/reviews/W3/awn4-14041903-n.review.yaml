# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14041903-n
# a dull and listless state resulting from weariness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «خمول» دلالتها المعجمية الأصلية خفاء القدر والذكر لا الحالة الجسدية الناتجة عن التعب، وإن شاع استعمالها حديثاً بمعنى الكسل والسبات"
      - "التعريف العربي يستخدم «فاترة» من نفس جذر اللمّة «فتور»، مما يُحدث دوراً جزئياً"
    observations: "المجموعة تصف حالةً نفسية-جسدية تجمع بين البلادة والسكون وتنشأ عن الإعياء. اللمّتان الموجودتان (خمول، فتور) شائعتان في الاستعمال المعاصر لكن خمول أقرب إلى الخمود والسكون بينما فتور أقرب إلى ضعف النشاط بعد حدّة. المفهوم الفوقي (الإرهاق/الإعياء/التعب) يمثل السبب، والمجموعة المراجَعة تمثل الحالة الناتجة عنه."

  blind_candidates:
    - lemma: "كَلَال"
      generation_method: ishtiqaq
      justification: "مصدر كَلَّ يَكِلُّ بمعنى تَعِبَ وأَعْيَا وضَعُفَ، على وزن فَعَال الدالّ على الحالة المستمرة"
    - lemma: "وَهَن"
      generation_method: ishtiqaq
      justification: "من جذر و-ه-ن بمعنى الضعف العام في الجسم والنفس، يصلح لوصف حالة الضعف الناتجة عن الإعياء"
    - lemma: "خَدَر"
      generation_method: majaz
      justification: "الخدر أصله فقد الإحساس واسترخاء الأعضاء، يُمَدّ مجازاً إلى حالة البلادة العامة الناتجة عن التعب"
    - lemma: "سُبَات"
      generation_method: majaz
      justification: "السُّبات حالة شبيهة بالنوم العميق تعتري الإنسان فيسكن ويخمد، تصلح مجازاً لوصف الحالة البليدة الفاترة"


stage2_evidence:
  per_lemma:
    - lemma: "خُمُول"
      confirm:
        - text: "«الخمول: خفاء القدر والذكر، وأصله السكون والخفاء، ومنه، خمل البساط لأنه يستر ما خلفه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«لخمول — lethargy»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«الخاء والميم واللام أصل واحد يدلّ على انخفاض واسترسال وسقوط. يقال خمل ذكره يخمل خمولاً. والخامل: الخفيّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الدلالي للجذر هو الانخفاض والسقوط، مما يسوّغ امتداده إلى الخمود الجسدي"
        - text: "«خمل = خفي فلم يُعرف ولم يُذكر. خمل ذِكره وصيته: خفي. الصوت: انخفض»"
          source: "المعجم الوسيط"
          addition: "المعنى المعجمي الأساسي خفاء الذكر لا الحالة الجسدية، لكن الانخفاض والسكون يُمدّان إلى معنى الخمود"

    - lemma: "فُتُور"
      confirm:
        - text: "«الفاء والتاء والراء أصل صحيح يدلّ على ضعف في الشيء. من ذلك: فتر الشيء يفتر فتوراً. والطرف الفاتر: الذي ليس بحديد شزر»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«لان بعد شدة، أو سكن بعد حدّة ونشاط. فترت المفاصل، وفتر الماء الساخن، وفتر البرد»"
          source: "المعجم الوسيط"
        - text: "«الشرابُ الجسمَ: جعله خامداً خاملاً»"
          source: "المعجم الوسيط (مادة فتّر)"
        - text: "«فتور (ن) — lethargy»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية"
        - text: "«فُتَار — torpor»"
          source: "المعجم الطبي الموحد"
      expands:
        - text: "«سكن عن حدته ولان بعد شدته»"
          source: "كتاب العين للخليل"
          addition: "تأكيد المعنى الأصلي للجذر منذ أقدم المعاجم العربية"

    - lemma: "كَلَال"
      confirm:
        - text: "«كلّ العامل: تعب وأعيا وضعف»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«الكلال» مصدر صحيح لكلّ بمعنى تعب، أقره مجمع اللغة المصري"
          source: "معجم الصواب اللغوي"
      contradicts:
        - text: "«كلّ عن الشيء: تثاقل وفتر عمّا لا ينبغي أن يتثاقل عنه»"
          source: "المعجم الوسيط"
          conflict: "الكلال يدلّ على فعل التعب والإعياء ذاته لا على الحالة البليدة الناتجة عنه؛ فهو أقرب إلى المفهوم الفوقي (الإرهاق/الإعياء) منه إلى هذه المجموعة"

    - lemma: "وَهَن"
      confirm:
        - text: "«(١) وَهَن؛ ضَنًى (٢) تراخٍ؛ كسَل — languor»"
          source: "المورد الحديث"
      contradicts:
        - text: "الوهن ضعف عام في القوة والعزيمة لا يشترط فيه نتوجه عن التعب تحديداً"
          source: "تحليل دلالي"
          conflict: "الوهن أعمّ من المطلوب؛ لا يختص بالحالة البليدة الناتجة عن الإعياء"

    - lemma: "خَدَر"
      confirm:
        - text: "«خدرا: عراه فتور واسترخاء. خدر من الشراب أو الدواء»"
          source: "المعجم الوسيط"
        - text: "«(١) خَدَر (٢) بلادة (٣) سُبات؛ خُدار — torpor»"
          source: "المورد الحديث"
      contradicts:
        - text: "«الخدر: علّة آلية تحدث في حسّ لمس بها آفة إما بطلاناً أو نقصاناً»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الخدر في الاصطلاح الطبي والفلسفي مختص بفقد الإحساس اللمسي لا بالحالة النفسية-الجسدية العامة"
        - text: "«الخاء والدال والراء أصلان: الظلمة والستر، والبطء والإقامة»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "أصلا الجذر بعيدان عن مفهوم الحالة البليدة الناتجة عن التعب"

    - lemma: "سُبَات"
      contradicts:
        - text: "«(١) نُوام؛ سُبات؛ نعاس أو نوم غير سويّ (٢) كسل؛ بلادة (٣) لامبالاة — lethargy»"
          source: "المورد الحديث"
          conflict: "السبات حالة أشدّ من المطلوب؛ تقترب من النوم المَرَضي لا من مجرد البلادة والفتور"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خُمُول"
      decision: confirmed
      decision_reason: "رغم أن المعنى المعجمي الكلاسيكي هو خفاء الذكر، فإن الاستعمال المعاصر رسّخ «خمول» بمعنى الكسل والسكون الجسدي، وأقرّته المعاجم المتخصصة (المَكنَز الزراعي = lethargy). الجذر يدلّ على الانخفاض والسقوط مما يسوّغ الامتداد الدلالي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الخمول يركّز على جانب السكون والخمود وانعدام الرغبة في الحركة، بينما الفتور يركّز على ضعف النشاط وتراخي الهمّة بعد حدّة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُمُول"

    - lemma: "فُتُور"
      decision: confirmed
      decision_reason: "الفتور من جذر فتر الدالّ على الضعف بعد الشدة، وهو مطابق تماماً لمفهوم المجموعة. أقدم المعاجم (العين، مقاييس اللغة) تؤكد هذا المعنى، والمعاجم المتخصصة تستعمله مقابل lethargy وtorpor."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الفتور يركّز على اللين والضعف بعد النشاط والحدّة، أي الانتقال من حالة قوية إلى حالة ضعيفة، بينما الخمول يصف حالة السكون والركود ذاتها"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُتُور"

    # ── مرشحات المرحلة ١ ──
    - lemma: "كَلَال"
      source: stage1
      decision: removed
      decision_reason: "الكلال مصدر كلّ بمعنى تَعِبَ وأَعْيَا، وهو يدلّ على فعل التعب ذاته لا على الحالة الناتجة عنه. ينتمي دلالياً إلى المفهوم الفوقي (إرهاق/إعياء/تعب) أكثر من انتمائه إلى هذه المجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "وَهَن"
      source: stage1
      decision: removed
      decision_reason: "الوهن ضعف عام لا يشترط فيه النتوج عن التعب؛ وهو أعمّ من المطلوب ولا يتضمّن دلالة البلادة والسكون التي تميّز هذه المجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "خَدَر"
      source: stage1
      decision: removed
      decision_reason: "الخدر في الاصطلاح يختصّ بفقد الإحساس اللمسي (numbness)، وأصلا جذره (الظلمة والستر، والبطء والإقامة) بعيدان عن مفهوم البلادة الناتجة عن الإعياء."
      evidence_assessment:
        case: contradicts_only

    - lemma: "سُبَات"
      source: stage1
      decision: removed
      decision_reason: "السبات حالة أشدّ تقترب من النوم المَرَضي (coma/sopor)، وهي أقوى بكثير من الحالة البليدة الفاترة التي تصفها المجموعة."
      evidence_assessment:
        case: contradicts_only


