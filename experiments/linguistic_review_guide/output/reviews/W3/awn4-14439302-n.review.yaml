# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14439302-n (anomie / anomy)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «أنوميا» تعريب صوتي صرف للمصطلح الفرنسي anomie دون تكييف صرفي عربي كافٍ؛ لا تقبل الاشتقاق بيسر"
      - "اللمّة «لامعيارية» مصطلح حديث مسكوك بتركيب لا + معيارية، يحتاج تشكيلاً كاملاً"
      - "التعريف العربي الحالي ترجمة شبه حرفية للتعريف الإنجليزي ويفتقر إلى الإحالة لمفهوم دوركهايم الاجتماعي الأصلي"
    observations: >
      المفهوم اجتماعي-نفسي أصيل صاغه إميل دوركهايم (anomie) لوصف حالة غياب المعايير والضوابط الاجتماعية
      التي تُفضي إلى عزلة الفرد وقلقه. في التراث العربي لا يوجد مصطلح مفرد جاهز يغطي هذا المفهوم تماماً،
      لكنّ الألفاظ العربية «تفسُّخ» و«انحلال» و«اغتراب» تُستخدم في سياقات مقاربة.
      المورد الحديث (2008) يترجم anomie بـ«تفسُّخ؛ انحلال / ضَياع؛ قلق؛ اغتراب؛ استلاب»، ممّا يدلّ
      على أنّ المفهوم يُعبَّر عنه عادةً بمجموعة ألفاظ لا بلفظ واحد. المصطلح «لامعيارية» هو الأكثر تخصيصاً
      في الأدبيات الاجتماعية العربية المعاصرة.
  blind_candidates:
    - lemma: "تَفَسُّخ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من التفسُّخ المادي (انحلال المادة العضوية) إلى التفسُّخ الاجتماعي-الأخلاقي.
        المورد الحديث يوثّق هذا المجاز صراحةً في ترجمة anomie.
    - lemma: "لامِعْيَارِيَّة"
      generation_method: ishtiqaq
      justification: >
        تركيب اشتقاقي: لا (النافية) + مِعْيار (على وزن مِفْعال من عَيَّرَ) + يَّة (المصدر الصناعي).
        يدلّ على غياب المعايير والضوابط، وهو لُبّ مفهوم الأنومي.
    - lemma: "اِنْحِلَال مِعْيَارِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي: انحلال (مصدر انحلّ = تفكُّك) + معياري (نسبة إلى المعيار).
        يصف تفكُّك المنظومة المعيارية الاجتماعية.
    - lemma: "أَنُومِيَا"
      generation_method: taarib
      justification: >
        تعريب صوتي للمصطلح الفرنسي-اليوناني anomie/anomia. مستعمل في بعض الكتابات
        الاجتماعية العربية. يقبل لام التعريف (الأنوميا) والنسبة (أنومياوي) بصعوبة.

stage2_evidence:
  per_lemma:
    - lemma: "أَنُومِيَا"
      expands:
        - text: "«(1) تفسُّخ؛ انحلال (2) ضَياع؛ قلق؛ اغتراب؛ استلاب (نف).»"
          source: "المورد الحديث (2008)"
          addition: "المورد يترجم anomie بمرادفات عربية متعددة ولا يُثبت الشكل المعرَّب «أنوميا» مدخلاً مستقلاً"
    - lemma: "لامِعْيَارِيَّة"
      confirm:
        - text: "«لامعيارية (ال…)»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
      expands:
        - text: "«anomie → لامعيارية (ال…)»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
          addition: "المصطلح مُثبت رسمياً في مسرد ALECSO لعلم الاجتماع مقابل anomie"
    - lemma: "تَفَسُّخ"
      confirm:
        - text: "«(1) تفسُّخ؛ انحلال (2) ضَياع؛ قلق؛ اغتراب؛ استلاب (نف).»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الشيءُ: انفسخ. المادة العُضْوِيَّة: انحلَّت بتأثير الجراثيم. الشَّعر عن الجلد: زال وتطايَر.»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي مادي-حسي (انحلال عضوي)، والدلالة الاجتماعية توسّع مجازي غير مُعجَم في المعاجم العربية الكلاسيكية"
        - text: "«تفكك للمادة العضوية بتأثير الجراثيم، يؤدي عادة إلى ظهور مركبات كريهة الرائحة مثل النشادر.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "جميع الاستخدامات المصطلحية المُثبتة في المعاجم التقنية تقتصر على التفسُّخ المادي (putrefaction)"
      expands:
        - text: "«تفسُّخ؛ انحطاط؛ تدهوُر.» (ترجمة decadence)"
          source: "المورد الحديث (2008)"
          addition: "يُستعمل تفسُّخ بمعنى الانحطاط الأخلاقي عموماً، لا بمعنى غياب المعايير تحديداً"
    - lemma: "اِنْحِلَال مِعْيَارِيّ"
      evidence_status: "no_material_found"
    - lemma: "نُشُوز"
      confirm:
        - text: "«نشوز → anomaly; anomy»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
      contradicts:
        - text: "«النُّونُ وَالشِّينُ وَالزَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَعُلُوٍّ... نَشَزَتِ الْمَرْأَةُ: اسْتَصْعَبَتْ عَلَى بَعْلِهَا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدلّ على الارتفاع والعلو، والنشوز في الاستعمال القرآني والفقهي يعني عصيان المرأة لزوجها، فاستعماله بمعنى الأنومي يُحدث لبساً شديداً"

stage3_analysis:
  per_lemma:
    - lemma: "أَنُومِيَا"
      decision: confirmed
      decision_reason: >
        تعريب مقبول لمصطلح ذي أصل يوناني-فرنسي عالمي التداول في علم الاجتماع.
        رغم ضعف اشتقاقيّته في العربية، فهو شائع في الأدبيات الأكاديمية العربية
        ويُعرف لدى المتخصصين. يُبقى مع لامعيارية كبديل مقبول.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصطلح تقني معرَّب يُستخدم في السياق الأكاديمي المتخصص حين يُراد الإحالة
        المباشرة إلى مفهوم دوركهايم بلا وساطة ترجمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَنُومِيَا"

    - lemma: "لامِعْيَارِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح مُثبت رسمياً في مسرد ALECSO لعلم الاجتماع والأنثروبولوجيا مقابل anomie.
        تركيبه الصرفي شفّاف (لا + معيار + ية = غياب المعيار) ويقبل الاشتقاق والإضافة.
        هو الخيار الأمثل بوصفه مصطلحاً عربياً أصيل البنية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصطلح عربي اصطلاحي يصف المفهوم بدقة من حيث المحتوى الدلالي (غياب المعايير)،
        يُفضَّل في الكتابة العلمية الرسمية والمعجمية العربية على التعريب الصوتي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لامِعْيَارِيَّة"

    - lemma: "تَفَسُّخ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق المورد الحديث لهذا اللفظ ضمن ترجمات anomie، فإنّ المعنى الأصلي
        والسائد هو التحلل المادي العضوي (putrefaction). جميع المعاجم التقنية العربية
        (الصيدلة، الكيمياء، الطب البيطري، الأغذية) تُثبته بهذا المعنى المادي حصراً.
        إدراجه في مجموعة الأنومي يُحدث اشتراكاً لفظياً مُضلِّلاً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "اِنْحِلَال مِعْيَارِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب وصفي حرّ غير مسكوك ولا مُثبت في أي مصدر معجمي أو مصطلحي.
        يفشل في اختبار السكّ: يمكن إبدال «انحلال» بـ«تفكُّك» أو «انهيار» وتبقى العبارة
        وصفاً حراً لا مصطلحاً. لا يصلح لمّةً معجمية.
      evidence_assessment:
        case: no_material

    - lemma: "نُشُوز"
      source: stage1
      decision: removed
      decision_reason: >
        رغم إثباته في مسرد ARABTERM مقابل anomy، فإنّ الحمولة الدلالية القرآنية والفقهية
        (نشوز المرأة) تجعل استعماله في سياق علم الاجتماع بمعنى غياب المعايير
        مُربكاً وغير ملائم. الجذر يدلّ على الارتفاع والاستصعاب لا على فقدان النظام.

stage4_content:
  definition:
    current: "حالة شخصية من العزلة والقلق ناتجة عن عدم وجود رقابة وتنظيم اجتماعي"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي، ويفتقر إلى ذكر السياق
        الاجتماعي الدوركهايمي. كما أنّ عبارة «عدم وجود رقابة وتنظيم» غير دقيقة؛
        الأنومي حالة انهيار المعايير لا مجرد غياب الرقابة.
    authored:
      - type: terminological
        text: "حالةٌ نفسيّةٌ واجتماعيّةٌ تتّسم بالعُزلة والقلق، تنشأ حين تضعف المعاييرُ والضوابطُ الاجتماعيّةُ أو تنهار فيفقد الفردُ الإحساسَ بالانتماء والتوجيه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "مصطلح صاغه عالم الاجتماع إميل دوركهايم لوصف حالة الفرد حين يَضْعُف أثرُ المنظومة المعياريّة للمجتمع فيه، فيشعر بالعزلة والضياع والقلق نتيجة غياب الروابط الاجتماعيّة الفاعلة والقواعد الموجِّهة للسلوك"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالةٌ نفسيّةٌ واجتماعيّةٌ تتّسم بالعُزلة والقلق، تنشأ حين تضعف المعاييرُ والضوابطُ الاجتماعيّةُ أو تنهار فيفقد الفردُ الإحساسَ بالانتماء والتوجيه"

  examples:
