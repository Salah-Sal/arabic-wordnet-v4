        examples:
          - text: "رصدت الدراسة ارتفاع مؤشرات اللامعيارية بين الشباب في المجتمعات التي شهدت تحولات اقتصادية سريعة."
            type: usage
      - lemma: "أَنُومِيَا"
        examples:
          - text: "وصف دوركهايم حالة الأنوميا بأنّها نتاج اختلال التوازن بين طموحات الفرد والقيود الاجتماعية المُنظِّمة لها."
            type: usage
