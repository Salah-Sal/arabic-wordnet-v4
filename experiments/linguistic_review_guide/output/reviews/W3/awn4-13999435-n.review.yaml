# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13999435-n
# demoralization / demoralisation — حالة من الاضطراب والارتباك
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظة «إحباط» تُترجَم في المعاجم المصطلحية بـ frustration لا demoralization، فهي تدلّ على حالة نفسية ناجمة عن عدم تحقّق الطموحات، لا على اضطراب وارتباك ناتج عن انهيار المعنويات"
      - "لفظة «تثبيط» أقرب دلالياً لكنّها تدلّ على الفعل (إضعاف الهمّة) أكثر من الحالة الناتجة (الاضطراب والارتباك)"
      - "التعريف العربي الحالي «حالة من الاضطراب والارتباك» عام جداً ولا يحدّد سبب الاضطراب (انهيار المعنويات)"
    observations: "المجموعة تصف الحالة الناتجة عن انهيار الروح المعنوية: فقدان النظام والتماسك في جماعة أو فرد بسبب ضعف المعنويات. اللمّتان الموجودتان تقتربان من المفهوم لكنّ كلتيهما تميلان إلى دلالات مجاورة (الإحباط = الخيبة، التثبيط = المنع والتعويق). المفهوم ذاته له تعبير طبيعي في العربية عبر عبارات مثل «انهيار المعنويات» أو «تحطّم الروح المعنوية» لكنّه يفتقر إلى مصطلح مفرد مسكوك."
  blind_candidates:
    - lemma: "خَوَر"
      generation_method: ishtiqaq
      justification: "من الجذر خ و ر على وزن فَعَل، يدلّ على الضعف والانكسار في كل شيء. قال ابن فارس: الخَوَّار الضعيف من كل شيء. يصلح للدلالة على حالة الضعف والاضطراب الناتجة عن انهيار العزيمة"
    - lemma: "تَخَاذُل"
      generation_method: ishtiqaq
      justification: "من الجذر خ ذ ل على وزن تَفَاعُل الدالّ على المشاركة والتبادل، أي تخاذل القوم: خذل بعضهم بعضاً فوقع الاضطراب بينهم"
    - lemma: "فُتُور"
      generation_method: ishtiqaq
      justification: "من الجذر ف ت ر، قال ابن فارس: أصل صحيح يدلّ على ضعف في الشيء. الفتور حالة من ضعف الهمّة والنشاط قد تقارب حالة الاضطراب المعنوي"
    - lemma: "انْحِلَال"
      generation_method: ishtiqaq
      justification: "من الجذر ح ل ل على وزن انفعال، يدلّ على تفكّك النظام وذهاب التماسك، وهو قريب من مفهوم الاضطراب الناتج عن انهيار المعنويات"

stage2_evidence:
  per_lemma:
    - lemma: "إِحْبَاط"
      contradicts:
        - text: "«إحباط — frustration — حالة نفسية تتميز بتوتر نفسي بسبب عدم تحقق طموحات الشخص نتيجة وجود عوامل خارجية.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          conflict: "الإحباط يُترجَم بـ frustration لا demoralization، ودلالته على خيبة الأمل والتوتر النفسي لا على اضطراب وفوضى"
        - text: "«احباط — frustration»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
          conflict: "المصطلح مقابل لـ frustration في علم الاجتماع أيضاً"
      expands:
        - text: "«(حَبِطَ) الحاء والباء والطاء أصل واحد يدلّ على بطلان أو ألم. يُقال: أحبط الله عمل الكافر، أي أبطله.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على البطلان والإبطال، فالإحباط أصلاً إبطال العمل وإذهابه، ثم استُعمل حديثاً بمعنى الخيبة النفسية"

    - lemma: "تَثْبِيط"
      confirm:
        - text: "«تثبيط — demoralization — اضعاف الروح المعنوية»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
      expands:
        - text: "«ثَبَّطَه عن الأمر تثبيطاً: شغله عنه. وفي التنزيل: ولكن كره الله انبعاثهم فثبّطهم. قال أبو إسحاق: التثبيط ردّك الإنسان عن الشيء يفعله»"
          source: "لسان العرب لابن منظور"
          addition: "الأصل اللغوي: التعويق والمنع والشغل عن المراد، ثم توسّع حديثاً ليشمل إضعاف المعنويات"
        - text: "«ثَبَّطَ فلاناً: فَعَدَ به عن الأمر، وشغله عنه، ومنعه تخذيلاً»"
          source: "المعجم الكبير"
          addition: "يربط التثبيط بالتخذيل وهو قريب من معنى تحطيم المعنويات"
        - text: "«ثَبِطَ فلان ثَبَطاً: ضعُف وثقُل»"
          source: "المعجم الوسيط"
          addition: "الفعل اللازم يدلّ على حالة الضعف والثقل الناتجة"
        - text: "«(1) يُفسد الأخلاق (2) يُضعف المعنويات؛ يُثَبِّط الهِمّة (3) يُرْبِك؛ يُشوِّش؛ يُوْقِع الفوضى»"
          source: "المورد الحديث (2008) — مادة demoralize"
          addition: "المورد يربط demoralize بتثبيط الهمّة مباشرة في المعنى الثاني"

    - lemma: "خَوَر"
      contradicts:
        - text: "«(الخَوْر) مصبّ الماء في البحر والمنخفض من الأرض بين مرتفعين والخليج»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأول للخَوْر جغرافي لا علاقة له بالمعنويات"
      expands:
        - text: "«(خَوِرَ) الخاء والواو والراء أصلان: أحدهما يدلّ على صوت، والآخر على ضعف. فالخَوَّار: الضعيف من كل شيء.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الضعف العام لكنّه لا يختصّ بالاضطراب والارتباك الجماعي"
        - text: "«خار الرجل: ضعُف وانكسر، فتر، وهى. خارت عزيمته: ضعفت همّته»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "يدلّ على ضعف فردي لا على حالة فوضى واضطراب"

    - lemma: "تَخَاذُل"
      evidence_status: "no_material_found"

    - lemma: "فُتُور"
      expands:
        - text: "«(فَتَرَ) الفاء والتاء والراء أصل صحيح يدلّ على ضعف في الشيء. فتر الشيء يفتر فتوراً.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يدلّ على ضعف عام لا على اضطراب وارتباك"
        - text: "«الفتور — hypoactivity — نقص مرضي في النشاط»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "استُعمل طبياً بمعنى نقص النشاط لا الاضطراب"

    - lemma: "انْحِلَال"
      contradicts:
        - text: "«الانحلال: عند المنطقيين هو التحليل. وانحلال الفرد عند الأطباء تفرّق اتصال يحدث الأعضاء المتشابهة.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الانحلال في الاصطلاح القديم تحليل منطقي أو تفكّك عضوي، لا اضطراب معنوي"
        - text: "«انحلال — decay — سلسلة عمليات كيميائية وحيوية يتم من خلالها تقسيم المواد العضوية»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          conflict: "استُعمل حديثاً بمعنى التحلّل الكيميائي والبيولوجي"

stage3_analysis:
  per_lemma:
    - lemma: "إِحْبَاط"
      decision: confirmed
      decision_reason: "رغم أنّ الإحباط يُقابل frustration أكثر من demoralization في المعاجم المصطلحية، فقد شاع استخدامه في العربية المعاصرة للدلالة على حالة اليأس والاضطراب النفسي الناتج عن الفشل، وهو يتقاطع مع مفهوم المجموعة. يُبقى مع التنبيه على الفرق الدقيق."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الجانب النفسي الذاتي: شعور الخيبة واليأس الناتج عن فشل تحقيق الهدف، أقرب إلى الحالة الانفعالية الداخلية منه إلى الفوضى الخارجية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِحْبَاط"

    - lemma: "تَثْبِيط"
      decision: confirmed
      decision_reason: "تثبيط مُثبت في مسرد علم الاجتماع مقابلاً مباشراً لـ demoralization بمعنى إضعاف الروح المعنوية، وهو أقرب اللمّات الموجودة إلى المفهوم المقصود. الأصل اللغوي (التعويق والمنع) توسّع حديثاً ليشمل تحطيم المعنويات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الفعل الخارجي وأثره: إضعاف الروح المعنوية وتعويق الهمّة مما يؤدّي إلى الاضطراب والارتباك، أقرب إلى العملية السببية منه إلى الحالة الانفعالية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَثْبِيط"

    - lemma: "خَوَر"
      source: stage1
      decision: removed
      decision_reason: "الخَوَر يدلّ على الضعف العام والانكسار الفردي (خارت قواه)، لكنّه لا يتضمّن دلالة الاضطراب والارتباك والفوضى التي هي جوهر المجموعة. كما أنّ المعنى الجغرافي (مصبّ الماء) هو الأشهر للاسم."

    - lemma: "تَخَاذُل"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية للمصطلح في قاعدة البيانات. التخاذل يدلّ على تخلّي القوم بعضهم عن بعض لا على حالة الاضطراب والارتباك."

    - lemma: "فُتُور"
      source: stage1
      decision: removed
      decision_reason: "الفتور يدلّ على ضعف النشاط والهمّة (سكون بعد حدّة) لا على اضطراب وفوضى. استُعمل طبياً مقابل hypoactivity وهو مفهوم مختلف."

    - lemma: "انْحِلَال"
      source: stage1
      decision: removed
      decision_reason: "الانحلال في المعاجم الاصطلاحية والعلمية يدلّ على التحليل المنطقي أو التفكّك الكيميائي/العضوي، ولا يُستعمل للدلالة على الاضطراب المعنوي."

