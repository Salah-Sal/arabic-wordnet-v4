          source: "المعجم الكبير"
          conflict: "لفظ 'الرافع' محمَّل دلالياً باسم من أسماء الله، مما يجعل استخدامه بمعنى 'صاحب الاقتراح' تعدياً على الحقل الديني"
        - text: "«الرَّافِع: اسم من أسماء الله الحُسْنَى. برقٌ رافعٌ: ساطع. ناقةٌ رافع: ترفع لبنها في ضَرعها ولا تدرّ.»"
