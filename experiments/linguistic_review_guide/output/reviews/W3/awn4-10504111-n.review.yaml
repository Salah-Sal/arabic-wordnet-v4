    concerns:
      - "الموصوف الأعلى (hypernym: awn4-10403515-n) هو 'شخص يبتكر أو ينشئ أشياء جديدة'، وهذا الوصف لا يصدق بالضرورة على مقدِّم الاقتراح البرلماني؛ إذ لا يُشترط في الإجراء البرلماني أن يكون الاقتراح ابتكاراً أو إنشاءً، بل يكفي التقديم الرسمي الإجرائي"
      - "اللمّة 'مقدم الاقتراح' تفتقر إلى تشكيل كامل"
      - "اللمّة 'مقدم الاقتراح' تعبير وصفي حر لا يجتاز اختبار التثبيت المعجمي بصورة كافية؛ إذ ترد في السياق تعبيرات مماثلة مثل 'مقدم المشروع'، مما يُشير إلى أن المركَّب إضافي وظيفي لا اصطلاحي تام"
    observations: "المجموعة تُعرِّف دوراً برلمانياً إجرائياً بحتاً. اللمّة مُقْتَرِح المشكوكة من الباب الثامن (اقترح، ق-ر-ح) ترتكز على أصل قرآني وبلاغي عريق؛ فالقريحة أوّل ما يستنبط من البئر، وفعل 'اقترح' يعني استنبط الشيء عن غير سماع — وهذه الدلالة تنسجم تمام الانسجام مع مقدِّم الفكرة البكر رسمياً. اللمّة المركبة 'مقدم الاقتراح' وصفية إجرائية تُبرز فعل التقديم الشكلي أكثر من الفاعل نفسه، غير أنها مستخدمة في الوثائق البرلمانية العربية."
  blind_candidates:
    - lemma: "مُقْتَرِح"
      generation_method: ishtiqaq
      justification: "اسم فاعل على وزن مُفْتَعِل من الفعل 'اقترح' (الباب الثامن من ق-ر-ح)؛ الجذر يدل على استنباط الشيء من القريحة عن غير سماع، فهو من يُطرح الاقتراح رسمياً مستنبطاً إياه من تفكيره ورأيه"
    - lemma: "طَارِح"
      generation_method: ishtiqaq
      justification: "اسم فاعل على وزن فَاعِل من الفعل 'طرح' (ط-ر-ح)؛ تُستخدم العربية تعبير 'طرح اقتراحاً' أو 'طرح الأمر للتصويت' في السياق البرلماني بمعنى عرضه رسمياً"
    - lemma: "رَافِعُ الاقْتِرَاح"
      generation_method: tarkib
      justification: "تركيب إضافي من 'رافع' (اسم فاعل من ر-ف-ع) + 'الاقتراح'؛ يشيع في اللغة البرلمانية العربية تعبير 'رفع اقتراحاً' بمعنى تقديمه رسمياً أمام الهيئة"
    - lemma: "مُبَادِر"
      generation_method: majaz
      justification: "اسم فاعل من 'بادر' (باب المفاعلة من ب-د-ر) دالّ على السبق والمبادأة؛ إزاحة دلالية من 'من يسبق إلى الفعل' إلى 'من يبادر بطرح الاقتراح' في السياق البرلماني الإجرائي"


