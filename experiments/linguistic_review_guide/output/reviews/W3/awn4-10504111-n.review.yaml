          source: "مسرد الإعلام والتواصل — ARABTERM"
          conflict: "لفظ 'مقدِّم' منفرداً له حمولة دلالية راسخة في مجال الإعلام (presenter/anchorperson)، مما يُفضي إلى تعدد دلالي مع المقصود"
        - text: "«مقدِّم: presenter, host»"
          source: "مسرد الإعلام والتواصل — ARABTERM"
          conflict: "التعبير 'مقدم' يُحيل أولاً إلى مقدِّم البرامج في الوعي اللغوي المعاصر، لا إلى صاحب الاقتراح البرلماني"
      expands:
        - text: "«الاقتراح: (الفكرة تُهَيَّأُ وتشرح وتُقدَّم للبحث والحكم — محدثة)»"
          source: "المعجم الوسيط"
          addition: "يُثبت أن 'تُقدَّم' هو الفعل المرتبط باللغة البرلمانية لـ'الاقتراح'"

    - lemma: "طَارِح"
      contradicts:
        - text: "«طارح — eliminant»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          conflict: "المصطلح الطبي 'طارح' بمعنى 'eliminant' راسخ في الأدبيات الطبية العربية، مما يُنشئ تعارضاً دلالياً مع الاستخدام البرلماني المقترح"
        - text: "«طارح — subtracter»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          conflict: "الاستخدام الرياضي-الطبي لـ'طارح' بمعنى 'الطارح' في عمليات الطرح يُعمِّق التعارض الدلالي"
        - text: "«طارَحَ فلانٌ فلانًا الحديثَ ونحوَه: حاوَرَه وبادَلَه»"
          source: "المعجم الكبير"
          conflict: "الاستخدام الكلاسيكي لـ'طارح' يدل على المحاورة المتبادلة لا على الإلقاء الأحادي للاقتراح"
      expands:
        - text: "«يطرح [اقتراحاً] على التصويت — put the question»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن 'طرح الاقتراح' يُستخدم في السياق البرلماني، غير أنه يُشير إلى طرحه للتصويت لا إلى صاحبه"

    - lemma: "رَافِعُ الاقْتِرَاح"
      contradicts:
