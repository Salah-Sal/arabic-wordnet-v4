        - text: "«الاقتراح: تقديم الاقتراحات; اقتراح؛ مُقْتَرح؛ عَرْض. وبخاصة: طلبُ اليد للزواج.»"
          source: "المورد الحديث (2008) — proposal"
        - text: "«مُقْتَرَح؛ اقتراح؛ عرض; رأي معروض [للمناقشة]»"
          source: "المورد الحديث (2008) — proposition"
      expands:
        - text: "«(1) يعتزم؛ ينوي (2) يعرض عليها الزواج (3) يقترح to propose a plan (4) يشرب نخبه.»"
          source: "المورد الحديث (2008) — propose"
          addition: "يُثبت أن 'يقترح' هو المقابل العربي الراسخ للفعل الإنجليزي propose، مما يُعزز مشروعية اسم الفاعل مُقْتَرِح"

    - lemma: "مقدم الاقتراح"
