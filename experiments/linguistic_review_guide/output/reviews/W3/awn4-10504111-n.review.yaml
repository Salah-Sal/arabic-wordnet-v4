        - text: "«يقترح؛ يقدِّم؛ يَعْرِض للمناقشة.»"
          source: "المورد الحديث (2008) — propound"
          addition: "يُثبت أن 'يقدِّم' مرادف لـ'يقترح' في السياق الاصطلاحي"
