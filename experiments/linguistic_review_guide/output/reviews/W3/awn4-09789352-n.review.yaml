# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان كلتاهما تعبيران مركبان إضافيان؛ تفتقر المجموعة إلى مصطلح أحادي مُكثَّف"
      - "«مُسوي» تحمل تشكيلاً جزئياً، و«وكيل مطالبات» خالية تماماً من التشكيل"
      - "«وكيل مطالبات» قد يُوحي بالتمثيل القانوني للمُطالِب لا بالتحقيق والتسوية المستقلَّين الذي هو جوهر الدور"
    observations: "المجموعة تصف وظيفةً مهنية تأمينية متخصصة تجمع بين التحقيق الميداني في المطالبات وتقدير الأضرار والتوصية بالتسوية. جذر «سوا» المنتِج لـ«مُسَوِّي» يدل على المعادلة والتقويم وهو ملائم جذرياً للمفهوم؛ أما جذر «وكل» الدال على الاعتماد والإنابة فيُبرز جانباً واحداً من الدور وهو التمثيل لا التحقيق المستقل. تستدعي المراجعة البحث عن تعبير يُبرز البُعد التحقيقي والتقييمي الفني إلى جانب بُعد التسوية."

  blind_candidates:
    - lemma: "مُعَدِّل"
      generation_method: ishtiqaq
      justification: "مشتق من جذر «عدل» على وزن مُفَعِّل بمعنى من يُعَدِّل ويُسَوِّي؛ والتعديل يقابل مباشرةً الـ«adjustment» في الإنجليزية. الوزن مُفَعِّل وزن منتج في المصطلح الحديث للأشخاص أصحاب الاختصاص المهني المتكرر."
    - lemma: "خَبِيرُ خَسَائِر"
      generation_method: tarkib
      justification: "تركيب إضافي من «خَبِير» (الماهر العارف، فعيل من جذر خبر) و«خَسَائِر» (جمع خسارة من جذر خسر). يُبرز البُعد التحقيقي والتقييمي الفني للوظيفة إذ يختص هؤلاء بتقدير قيمة الأضرار والخسائر الفعلية قبل إقرار التسوية. مقابله الإنجليزي «loss adjuster» شائع في التأمين البحري والتجاري."
    - lemma: "مُفَتِّشُ مُطَالَبَات"
      generation_method: tarkib
      justification: "تركيب إضافي من «مُفَتِّش» (وزن مُفَعِّل من جذر فتش، من يتفقد ويراجع) و«مُطَالَبَات». يُبرز الجانب الرقابي والتحقيقي للوظيفة؛ يُستخدم «التفتيش» في السياق المؤسسي العربي للتحقق من صحة الوثائق والادعاءات."
    - lemma: "مُقَدِّر"
      generation_method: ishtiqaq
      justification: "مشتق من جذر «قدر» على وزن مُفَعِّل بمعنى من يُحدِّد مبلغ الشيء ونهايته؛ وتقدير الأضرار هو المهمة المحورية لمُسَوِّي المطالبات. الجذر قدر يدل على مبلغ الشيء وكنهه كما في مقاييس اللغة."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة: 5 (بدون evidence.json)
# ١. مطابقة دفعية لجميع اللمّات والمرشحات ومكوناتها
# ٢. الجسر الإنجليزي (adjuster / adjustor / claims adjuster / loss adjuster)
# ٣. إثراء بالمعرِّف (definitions + examples لنتائج الجسر الإنجليزي)
# ٤. FTS عربي (مطالبات التأمين، تسوية مطالبات، خبير تأمين)
# ٥. مقاييس اللغة (سوي، وكل، عدل، قدر، خبر، طلب، خسر)
stage2_evidence:
  per_lemma:

    - lemma: "مُسَوِّي مطالبات"
      confirm:
        - text: "«المُسَوِّي؛ الضابط؛ المعدِّل.»"
          source: "المورد الحديث (2008) — ترجمة عربية مباشرة لـ adjuster | adjustor"
        - text: "«مُسَوِّي: من (س و ي) من يقوم الشيء ويعدله ويجعله سويا.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«المِسْوَى: العدْلُ القَصْدُ — سَوَّى الشيء: وسطَه غيرَه بدله»"
          source: "المعجم الوسيط (OCR)"

    - lemma: "وكيل مطالبات"
      confirm:
        - text: "«الوَكِيلُ: من أسماء الله تعالى, وهو الكفيل بأرزاق العباد — الحافظ الكفيل الذى يسعى فى عمل غيره, وينوب عنه فيه. الوكيل بالعُمولة [فى الاقتصاد السياسي]: شخص يعمل لحساب آخر بمقتضى عقد توكيل, ويتعاقد باسمه الخاصّ. (مج)»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الوكيل: فعيل بمعنى مفعول. والتوكيل أن تعتمد على غيرك.»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت. 1622م)"
        - text: "«الوكيل: هو الذي فوض إليه التصرف بإقامة المفوض أي الموكل إياه مقام نفسه في التصرفات.»"
          source: "دستور العلماء للأحمدنكري (ق. 18م)"
      expands:
        - text: "«الوكيل بالعمالة (العمولة) (في الاقتصاد السياسي) شخص يعمل لحساب آخر بمقتضى عقد توكيل ويتعاقد باسمه الخاص (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (الطبعة الحديثة)"
          addition: "يُثبت استخدام «وكيل» في السياق الاقتصادي والتجاري الحديث، مما يعزز ملاءمته للوظيفة التأمينية بوصف وكيل المطالبات عاملاً لحساب طرف آخر"

    - lemma: "مُعَدِّل"
      confirm:
        - text: "«المُسَوِّي؛ الضابط؛ المعدِّل.»"
          source: "المورد الحديث (2008) — ترجمة adjuster | adjustor"
      contradicts:
        - text: "«المعدّل: [في الانكليزية] Equinoctial line — بفتح الدال المشددة عند أهل الهيئة هو ما وقع فيه التعديل.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت. 1777م)"
          conflict: "«المعدَّل» (بفتح الدال) مشغول تراثياً بمصطلح فلكي (خط الاعتدال)، مما يُوجِد لبساً مع «المُعَدِّل» الفاعل"
        - text: "«معدل: rate / tempered»"
          source: "ARABTERM — Education, Arts, Recreation"
          conflict: "«معدل» يُستخدم شيوعاً بمعنى «نسبة / معدل» في المصطلح التقني الحديث، مما يُضعف تخصيصه للوظيفة التأمينية بلا مركَّب مُقيِّد"

    - lemma: "خَبِيرُ خَسَائِر"
      confirm:
        - text: "«خبير تسوية العوارية»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000) — ترجمة average adjuster"
        - text: "«خبير: expert; competent person; skilled person»"
          source: "ARABTERM — Electropedia / Law / Educational Techniques"
        - text: "«خَبِير: أعلم الناس بالرجل صاحبه ومخالطه الرئيس المخبر (فعيل بمعنى مفعَّل)»"
          source: "المعجم الكبير (OCR)"
      expands:
        - text: "«مهذِّب الخشب: أي مسوِّيه ومهذِّب جنباته — adjuster of timber»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2 (1999)"
          addition: "يُثبت استخدام «adjuster» بمعنى من يُقوِّم ويُصلح في السياق المهني العربي مما يعزز الجذر الدلالي"

    - lemma: "مُفَتِّشُ مُطَالَبَات"
      confirm:
        - text: "«المُفَتِّشُ: موظف يقوم بتفتيش أعمال حكومية أو غيرها (محدثة)»"
          source: "المعجم الوسيط (OCR)"
      contradicts:
        - text: "«المفتش: موظف يقوم بتفتيش أعمال حكومية أو غيرها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "التعريف يُقيِّد المفتش بالأعمال الحكومية ولا يُشير إلى وظيفة التقييم المالي والتوصية بالتسوية التي هي لبّ دور مُسَوِّي المطالبات"

    - lemma: "مُقَدِّر"
      expands:
        - text: "«الْقَافُ وَالدَّالُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مَبْلَغِ الشَّيْءِ وَكُنْهِهِ وَنِهَايَتِهِ. فَالْقَدْرُ: مَبْلَغُ كُلِّ شَيْءٍ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر قدر يُعطي «مُقَدِّر» معنى من يُحدِّد مبلغ الشيء ونهايته، وهو أساس تقدير الأضرار التأمينية"
      contradicts:
        - text: "«المقدَّر: هو المحذوف [في علم النحو] — وكل لفظ حذف من التلفظ لا النية فهو مقدَّر»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "صيغة «المُقَدَّر» (اسم مفعول) مشغولة في التراث النحوي بمعنى المحذوف، مما يُوجد اشتباهاً مع «المُقَدِّر» (اسم فاعل)"


