# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# synset_id : awn4-10956708-n
# ili       : i94930
# pos       : n  (proper_noun effectively)
# lemmas    : ديور | كريستيان ديور
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "غياب التشكيل الكامل على كلتا اللمّتين (ديور، كريستيان ديور)"
      - "تصنيف pos = n غير دقيق؛ المجموعة تمثّل اسم علم لشخص بعينه (proper_noun) وليس اسماً جنسياً"
      - "كتابة 'نيو لوك' بأحرف لاتينية داخل التعريف العربي تعكّر نقاء النص؛ يُفضَّل التعريب أو الوضع بين قوسين مع الترجمة"
      - "اشتراك لفظي محتمل: كلمة «الديور» موجودة في المعجم العربي بمعنى «لا أحد في الدار» (جمع دِيَار) مما قد يُسبب لبساً"
      - "التعريف الحالي يتضمن السنوات الميلادية في متن التعريف، وهو اختيار أسلوبي مقبول للأعلام لكن يمكن نقلها إلى قوسين منفصلين"
    observations: >
      هذه المجموعة مخصصة لاسم علم شخصي — المصمم الفرنسي كريستيان ديور (1905-1957) —
      الذي اشتُهر بمجموعة 1947 التي أسّست أسلوب «النيو لوك» في عالم الأزياء.
      إذ إن اللمّات الوحيدة المشروعة لمثل هذا الاسم هي تعريبات وترجمات صوتية للاسم الأصلي الفرنسي،
      فإن هامش التدخل اللغوي محدود للغاية.
      يلاحظ أن المعاجم العربية لا تُدرج أعلام الأشخاص الأجانب عادةً، مما يجعل الأدلة المعجمية
      شبه منعدمة، وهو أمر متوقع لهذا الصنف من المجموعات.

  blind_candidates:
    - lemma: "دِيُور"
      generation_method: taarib
      justification: >
        تعريب صوتي مباشر للاسم الفرنسي «Dior» وهو لقب المصمم. يقبل «ال» التعريف والنسبة
        (ديوري) ويطّرد في العربية المعاصرة.
    - lemma: "كرِيسْتِيَان دِيُور"
      generation_method: taarib
      justification: >
        تعريب صوتي للاسم الكامل «Christian Dior»؛ الصيغة الرسمية المتداولة في المصادر
        العربية المتخصصة وفي إعلانات دار الأزياء نفسها.
    - lemma: "دِيوُر"
      generation_method: taarib
      justification: >
        صيغة تعريب بديلة بضمّ الواو تحاكي نطقاً فرنسياً مختلفاً، وردت في بعض المطبوعات
        العربية غير المتخصصة.
    - lemma: "كِرِيسْتِيان دِيُور"
      generation_method: taarib
      justification: >
        صيغة تعريب أخرى للاسم الأول «Christian» بكسر الكاف، شائعة في المصادر الإخبارية
        العربية المتعددة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:

  query_log:
    - query_num: 1
      purpose: "مطابقة دفعية لجميع اللمّات والمرشّحات"
      terms_searched:
        - ديور
        - الديور
        - كريستيان ديور
        - الكريستيان ديور
        - ديوار
        - ديور (بدون تشكيل)
    - query_num: 2
      purpose: "الجسر الإنجليزي: Dior / Christian Dior / couturier / fashion designer"
    - query_num: 3
      purpose: "بحث FTS بالكلمات المفتاحية: مصمم ازياء / نيو لوك / خياط"

  per_lemma:

    - lemma: "ديور"
      contradicts:
        - text: "«(الدَّيُّورُ) يُقَال مَا بِالدَّارِ دِيُّورٌ: مَا بِهَا أَحَدٌ»"
          source: "المعجم الكبير (OCR)"
          conflict: >
            «الديور» في المعجم العربي كلمة عربية أصيلة تعني عدم وجود أحد في المكان،
            مشتقة من جذر (دور) أو (دير)، وهي مغايرة تماماً لاسم العلم الفرنسي «Dior».
            هذا الاشتراك اللفظي يستوجب التنبيه لكنه لا يمنع استخدام اللمّة بوصفها اسم علم.
        - text: "«(الديور) يُقَال مَا بِالدَّار ديور أحد»"
          source: "المعجم الوسيط (Hawramani)"
          conflict: >
            تأكيد لما سبق: «ديور» في التراث العربي عبارة اصطلاحية بمعنى الخلاء.

    - lemma: "كريستيان ديور"
      evidence_status: "no_material_found"

    - lemma: "دِيُور"
      evidence_status: "no_material_found"

    - lemma: "كرِيسْتِيَان دِيُور"
      evidence_status: "no_material_found"

    - lemma: "دِيوُر"
      evidence_status: "no_material_found"

    - lemma: "كِرِيسْتِيان دِيُور"
      evidence_status: "no_material_found"

  english_bridge_findings:
    - note: >
        لم تُسفر استعلامات الجسر الإنجليزي عن مداخل خاصة بالاسم «Dior» أو «Christian Dior»
        بوصفهما اسم علم. وُجدت مداخل لـ «couturier» تُترجم بـ «مصمم الأزياء» و«مؤسسة
        لتصميم الملابس النسائية» (المورد الحديث 2008) وهي ترجمات للمفهوم لا للاسم العلم.
    - couturier_entry:
        text: "«(1) مؤسَّسة لتصميم الملابس النسائية (2) صاحب هذه المؤسسة أو مصمِّم الأزياء فيها.»"
        source: "المورد الحديث (2008)"
        addition: "يؤكد أن المعادل العربي الموثّق لـ couturier هو «مصمم الأزياء» وهو ما استُخدم بالفعل في تعريف المجموعة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "ديور"
      decision: confirmed
      decision_reason: >
        اللقب المعرَّب «ديور» هو الصيغة المختصرة الأكثر تداولاً في الصحافة العربية
        والوثائق الرسمية للعلامة التجارية في البلاد العربية. رغم الاشتراك اللفظي مع
        الكلمة العربية القديمة «الديور/الديّور» (= لا أحد في الدار)، فإن السياق الخاص
        بمجموعة اسم علم يرفع الإلباس. يستوجب التشكيل الكامل.
      evidence_assessment:
        case: mixed
        note: >
          الأدلة الوحيدة الموجودة تتعلق بالكلمة العربية المشتركة لفظاً، لا بالاسم
          العلم نفسه. غياب الأدلة الإيجابية طبيعي لأسماء الأعلام الأجنبية في المعاجم
          العربية التقليدية.
      mwe_check:
        is_mwe: false
      loan_check:
        type: taarib
        verdict: "معرَّب مقبول — يقبل التعريف والنسبة والتنوين في حالات معينة"
      morphological_fit: "اسم علم غير قابل للاشتقاق، الوزن الصوتي يحاكي بنية «فَعُول»"
      nuance_differentiation: >
        «ديور» هو اللقب المختصر (الشهرة) — يُستخدم وحده في السياق غير الرسمي وفي ذكر
        العلامة التجارية وحدها دون التعريف الشخصي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دِيُور"

    - lemma: "كريستيان ديور"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للمصمم هو الصيغة الرسمية الموثّقة في المصادر العربية المتخصصة
        ودار الأزياء الفرنسية نفسها. يجمع الاسم الأول والاسم الأخير في وحدة معجمية
        ثابتة لاسم العلم. يستوجب التشكيل الكامل.
      evidence_assessment:
        case: no_material
        note: "طبيعي لأسماء الأعلام الأجنبية — غياب الأدلة لا يُضعف المشروعية"
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        note: >
          التعبير المركب «كريستيان ديور» هو اسم علم مركّب من اسم أول (كريستيان) +
          لقب (ديور)، مثبّت معجمياً في الاستخدام العربي. اجتاز اختبار التثبيت:
          لا يمكن إبدال «كريستيان» بمرادف آخر وبقاء الاسم صالحاً كاسم علم.
      loan_check:
        type: taarib
        verdict: "تعريب صوتي للاسم الفرنسي — مقبول ومستقرّ في الاستخدام"
      nuance_differentiation: >
        «كريستيان ديور» هو الاسم الرسمي الكامل للشخص — يُستخدم في السياقات الرسمية
        والأكاديمية والتاريخية حين يُراد التعريف بالمصمم كشخص بعينه لا كعلامة
        تجارية فحسب. وهو أكثر توضيحاً وأقل إيهاماً من «ديور» المنفرد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كرِيسْتِيَان دِيُور"

    # ── مرشحات المرحلة ١ ──

    - lemma: "دِيُور"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة «ديور» بعد التشكيل، فلا حاجة إلى إضافته
        بوصفه مدخلاً مستقلاً.

    - lemma: "كرِيسْتِيَان دِيُور"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة «كريستيان ديور» بعد التشكيل. الإجراء المناسب هو
        update_lemma على اللمّة الموجودة لا create_entry جديد.

    - lemma: "دِيوُر"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بديلة غير مستقرة ولا مدعومة بأدلة على انتشارها في المصادر المعتمدة.
        التعريب الأصح هو «دِيُور» بالضمة على الياء لا الواو.

    - lemma: "كِرِيسْتِيان دِيُور"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تعريب بديلة (بكسر الكاف) أقل شيوعاً من «كرِيسْتِيَان» بفتح الكاف.
        الاقتصار على الصيغة الأكثر انتشاراً واستقراراً أولى.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-10956708-n"
        pos: n
      note: >
        يُبقى POS = n لأن نظام AWN4 يُصنّف أسماء الأعلام تحت 'n' وفق اصطلاح
        WordNet الأصلي (instance hyponyms). التغيير إلى proper_noun يتطلب
        قراراً على مستوى المشروع ككل.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:

  definition:
    current: "مصمم أزياء فرنسي خلقت مجموعته الأولى في عام 1947 أسلوباً عرف باسم 'نيو لوك' (1905-1957)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يحتوي على مصطلح 'نيو لوك' بأحرف لاتينية وعلامات اقتباس
        مفردة داخل النص العربي، وهو ما يُخلّ بنقاء النص. كذلك فإن عبارة «خلقت
        مجموعته» ركيكة أسلوبياً؛ الأدق «أسّست» أو «كرّست». يُعاد صياغة التعريف
        بأسلوب موسوعي معجمي أنقى.
    authored:
      - type: encyclopedic
        text: >
          مصمِّمُ أزياءٍ فرنسيٌّ (1905-1957)، اشتُهر بإطلاق مجموعته الأولى عام 1947
          التي كرَّست أسلوباً ثورياً في الأزياء النسائية عُرف بـ«النظرة الجديدة»
          (New Look)، أعاد بها الأنوثة الكلاسيكية إلى الموضة الأوروبية في مرحلة
          ما بعد الحرب العالمية الثانية.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false

    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10956708-n"
          definition_index: 0
          text: >
            مصمِّمُ أزياءٍ فرنسيٌّ (1905-1957)، اشتُهر بإطلاق مجموعته الأولى عام 1947
            التي كرَّست أسلوباً ثورياً في الأزياء النسائية عُرف بـ«النظرة الجديدة»
            (New Look)، أعاد بها الأنوثة الكلاسيكية إلى الموضة الأوروبية في مرحلة
            ما بعد الحرب العالمية الثانية.

  examples:
    per_lemma:
      - lemma: "دِيُور"
        examples:
          - text: "أعادت دار دِيُور إطلاقَ عطرها الكلاسيكي بمناسبة الذكرى السنوية لتأسيسها."
            type: usage

      - lemma: "كرِيسْتِيَان دِيُور"
        examples:
          - text: "يُعدُّ كرِيسْتِيَان دِيُور من أبرز من أعادوا تشكيلَ ملامح الأزياء الأوروبية في القرن العشرين."
            type: usage

    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أعادت دار دِيُور إطلاقَ عطرها الكلاسيكي بمناسبة الذكرى السنوية لتأسيسها."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدُّ كرِيسْتِيَان دِيُور من أبرز من أعادوا تشكيلَ ملامح الأزياء الأوروبية في القرن العشرين."


