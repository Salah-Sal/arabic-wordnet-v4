# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14016841-n
# autarky / autarchy — الاكتفاء الذاتي الاقتصادي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «اكتفاء ذاتي اقتصادي» مركّب ثلاثي غير مسكوك؛ المصطلح المعتمد في المعاجم الاقتصادية هو «اكتفاء ذاتي» دون تقييد بـ«اقتصادي»."
      - "المجموعة تحتوي لمّة واحدة فقط — فقر مصطلحي يحتاج إثراء."
      - "التعريف العربي مقتضب ولا يفصل بين الاكتفاء الذاتي العام وسياسة الأوتاركية بوصفها نهجاً اقتصادياً كلّياً."
    observations: "المفهوم يقع في حقل الاقتصاد السياسي: سياسة دولة تهدف إلى الاستغناء عن الاستيراد بالاعتماد على الموارد المحلية. وهو مفهوم حديث نسبياً في الأدبيات العربية، لكنّ له تعبيراً راسخاً هو «الاكتفاء الذاتي» مثبتاً في المعجم الوسيط ومعاجم الألكسو. المركّب الحالي يُضيف «اقتصادي» وهو زائد لأنّ السياق الاقتصادي مستفاد من التعريف ومن ربط المعاجم."

  blind_candidates:
    - lemma: "اكْتِفَاء ذَاتِيّ"
      generation_method: tarkib
      justification: "مركّب إضافي ثابت يدلّ على استغناء الكيان بإمكاناته عن غيره، وهو التعبير الأكثر شيوعاً وتداولاً في النصوص الاقتصادية العربية للدلالة على autarky."

    - lemma: "اكْتِفَائِيَّة ذَاتِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «اكتفاء» على وزن فِعَالِيَّة، يحوّل المصدر إلى مفهوم مجرد يدلّ على السياسة أو المذهب — أي النزعة نحو الاكتفاء الذاتي بوصفها منهجاً كلّياً."

    - lemma: "اسْتِكْفَاء اقْتِصَادِيّ"
      generation_method: tarkib
      justification: "مركّب إضافي من «استكفاء» (مصدر استكفى: طلب الكفاية) مع «اقتصادي»، يوظّف صيغة الاستفعال للدلالة على طلب الاكتفاء الاقتصادي."

    - lemma: "أُوتَارْكِيَّة"
      generation_method: taarib
      justification: "تعريب للمصطلح الأجنبي autarky/autarchie على وزن فُوعَالِيَّة مع لاحقة النسبة -يَّة، يقبل لام التعريف والجمع. يُلجأ إليه كملاذ أخير عند غياب البديل العربي."


stage2_evidence:
  per_lemma:
    - lemma: "اكْتِفَاء ذَاتِيّ اقْتِصَادِيّ"
      evidence_status: "no_material_found"

    - lemma: "اكْتِفَاء ذَاتِيّ"
      confirm:
        - text: "«(الِاكْتِفَاء الذاتي) (فِي الاقتصاد) أَن تَسْتَغْنِي الدولة بإنتاجها عَن الاستيراد من غَيرهَا (محدثة)»"
          source: "المعجم الوسيط (هَوَرَماني)"
        - text: "«(فى الاقتصاد): أن تستغنى الدولة بإنتاجها عن الاستيراد من غيرها»"
          source: "المعجم الوسيط (OCR)"
        - text: "«سياسة تعتمدها العديد من الدول تحاول من خلالها الاعتماد على إمكانياتها ومواردها الذاتية لتأمين جميع احتياجاتها من السلع والمنتجات الاستهلاكية والاستثمارية.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«اكتفاء ذاتي — autarky — autarcie»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يثبت المصطلح مقابلاً صريحاً لـ autarky في حقل التجارة."
        - text: "«اكتفاء ذاتي — autosufficiency — auto-suffisance»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "يربط المصطلح بمفهوم الاكتفاء الذاتي العام في الاقتصاد."
        - text: "«اكتفاء ذاتي — self-sufficiency — auto-suffisance»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
          addition: "يمتد استعمال المصطلح إلى حقلي الجغرافيا والتاريخ."

    - lemma: "اكْتِفَائِيَّة ذَاتِيَّة"
      confirm:
        - text: "«(2) الاكتفائية الذاتية: سياسة تهدف إلى الاكتفاء الذاتيّ»"
          source: "المورد الحديث (2008)"

    - lemma: "اسْتِكْفَاء اقْتِصَادِيّ"
      confirm:
        - text: "«استكفاء اقتصادي — autarchy — autarcie»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
      expands:
        - text: "«autarchy — (1) السيادة المُطْلَقَة (2) الحُكم المُطْلَق؛ حكومة الفرد.»"
          source: "المورد الحديث (2008)"
          addition: "في المورد الحديث autarchy يميل إلى الدلالة السياسية (الحكم المطلق) لا الاقتصادية، ما يوجب التمييز بين المفهومين."

    - lemma: "أُوتَارْكِيَّة"
      evidence_status: "no_material_found"


