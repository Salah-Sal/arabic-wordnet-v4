      decision_reason: "اللمّة هي التعريب المتعارف عليه للقب 'Tesla' حين يُشار به إلى الشخص في المصادر العربية الإعلامية والأكاديمية. لا دليل معجمي مباشر لكونها اسمَ عَلَم وليس مصطلحاً. تحتاج تحديث الشكل بتشكيل كامل"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب المنفرد؛ يُستخدم في السياقات المختصرة وفي التعابير الاصطلاحية المركبة كـ'ملف تيسلا' و'محرك تيسلا' و'وحدة تيسلا' حين يُراد نسبتها إلى الشخص صراحةً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تِيسْلَا"

    - lemma: "نيكولا تيسلا"
      decision: confirmed
      decision_reason: "الاسم الكامل للعالِم بتعريبه الشائع، لا غنى عنه في السياق الموسوعي للتعريف الدقيق بالشخص وتمييزه عن وحدة القياس الفيزيائية التي تحمل اللقب ذاته"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل (اسم + لقب)؛ يُستخدم في السياقات الرسمية والموسوعية وفي التعريف التام بالشخص، ويقطع اللبسَ بين العَلَم الشخصي واسم الوحدة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِيكُولَا تِيسْلَا"

    - lemma: "نِيقُولَا تِيسْلَا"
      source: stage1
      decision: confirmed
      decision_reason: "رسم بديل موثَّق للاسم الكامل؛ تُثبت موسوعة السلطان قابوس لأسماء العرب أن 'نيقولا' رسمٌ عربي صحيح لـ Nikola/Nicolas. يُستحسن إدراجه لاستيعاب التباين في الهجاء بين المصادر العربية"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "رسم بديل للاسم الكامل يعتمد 'نيقولا' بدلاً من 'نيكولا'، متداول في الموسوعات والمصادر العربية التي تميل إلى تقليد التعريب اليوناني/الكلاسيكي للاسم"
      actions:
        - command: create_entry
          params:
            lemma: "نِيقُولَا تِيسْلَا"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تِسْلَا"
      source: stage1
      decision: removed
      decision_reason: "الرسم مُعتمَد في المعجمية العلمية العربية المعيارية (ARABTERM، المورد الحديث) للدلالة على وحدة كثافة التدفق المغنطيسي (SI unit)، وليس للإشارة إلى الشخص. إدراجه في المجموعة الخاصة بالعالِم يُوقع في اشتراك لفظي مُضلِّل"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "مهندس كهربائي ومخترع أمريكي (ولد في كرواتيا ولكن من أصل صربي) اكتشف مبادئ التيارات المترددة وطور أول محرك تحريضي للتيار المتردد وملف تيسلا وعدة أشكال من المذبذبات (1856-1943)"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية: جملة 'ولد في كرواتيا ولكن من أصل صربي' ركيكة أسلوبياً، والتواريخ مدمجة في نهاية الجملة خلافاً للأسلوب الموسوعي العربي الذي يفرد المعلومات البيوغرافية ببنية واضحة. كذلك فإن الوصف بـ'أمريكي' صحيح من الناحية القانونية (تجنّس 1891) لكنه يستدعي إيضاح الأصل."
