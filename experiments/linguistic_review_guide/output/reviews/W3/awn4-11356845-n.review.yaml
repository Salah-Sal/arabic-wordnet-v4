# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11356845-n  |  ILI: i97133
# الموضوع: نيكولا تيسلا (المخترع والمهندس الكهربائي)
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (أعمى — بدون اطلاع على اللمّات) ──
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان مجرّدتان من التشكيل الكامل الإلزامي للمداخل المؤكّدة"
      - "هجاء 'تيسلا' (بياء المد) يختلف عن الهجاء المعتمد في المعجمية العلمية العربية 'تسلا' (بدون ياء) الخاص بوحدة القياس الفيزيائية؛ ويستوجب الأمر التمييز الصريح بين اسم العَلَم (الشخص) واسم الوحدة (SI unit)"
      - "لا تشمل اللمّات الرسمَ البديل 'نيقولا تيسلا' المتداول في طائفة من المصادر والموسوعات العربية"
    observations: >
      هذه المجموعة الترادفية خاصة بالعالم والمخترع نيكولا تيسلا (1856-1943). جميع لمّاتها الممكنة
      عبارة عن تعريبات صوتية للاسم الصربي/اللاتيني الأصل، ولا جذر عربي لأيٍّ منها.
      التعريف الحالي دقيق من حيث المضمون غير أنه ترجمة حرفية من الإنجليزية، ويفتقر إلى الأسلوب
      الموسوعي العربي الرصين. ويجدر التنبيه إلى أن وحدة قياس كثافة التدفق المغنطيسي (SI unit: tesla)
      مُسمَّاةٌ على اسم هذا العالم، وقد تظهر بهجاء مقارب في بعض المصادر مما يستوجب الحرص
      على عدم الخلط بين دلالتَي: الشخص (العَلَم) والوحدة الفيزيائية (المصطلح).
  blind_candidates:
    - lemma: "تِيسْلَا"
      generation_method: taarib
      justification: "الاسم مذكور صراحةً في نص التعريف ضمن 'ملف تيسلا'، وهو التعريب الشائع للقب العالِم في المصادر العربية الحديثة والإعلامية"
    - lemma: "نِيكُولَا تِيسْلَا"
      generation_method: taarib
      justification: "الاسم الكامل للعالِم تعريباً صوتياً مبنياً على الرسم اللاتيني Nikola Tesla؛ ضروري للتعريف الموسوعي الدقيق وللتمييز بين الشخص ووحدة القياس"
    - lemma: "نِيقُولَا تِيسْلَا"
      generation_method: taarib
      justification: "رسم بديل معتمد للاسم الأول في جملة من الموسوعات والمعاجم العربية؛ 'نيقولا' تعريب صحيح لـ Nikola بديلاً من 'نيكولا'"
    - lemma: "تِسْلَا"
      generation_method: taarib
      justification: "رسم بديل للقب بدون ياء مدٍّ، مستخدم في المصادر العلمية العربية؛ يُحتمل وروده إحالةً إلى الشخص وإن كان الغالب استعماله للوحدة الفيزيائية"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دفعية: تيسلا + التيسلا + نيكولا تيسلا + نيكولا + نيقولا + تسلا (وصيغ ال-)
#   ٢. إثراء بالمعرّف: definitions + examples للمداخل الموجودة (IDs: 468078, 948764, 722872)
#   ٣. جسر إنجليزي: translation_en:"Tesla" OR "Nikola Tesla"
#   ٤. بحث FTS بمفاتيح: "تيسلا" OR "تسلا" OR "نيكولا" OR "نيقولا" OR "مخترع" OR "كهربائي"
stage2_evidence:
  per_lemma:
    - lemma: "تِيسْلَا"
      evidence_status: "no_material_found"

    - lemma: "نِيكُولَا تِيسْلَا"
      evidence_status: "no_material_found"

    - lemma: "نِيقُولَا تِيسْلَا"
      expands:
        - text: "«نيقولا: صورة كتابية صوتية من نقولا»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُثبت أن 'نيقولا' رسمٌ عربي صحيح ومتداول لتعريب الاسم الأجنبي Nikola/Nicolas، مما يُسوِّغ استخدام 'نيقولا تيسلا' رسماً بديلاً للاسم الكامل"

    - lemma: "تِسْلَا"
      contradicts:
        - text: "«وحدة عالمية لقياس كثافة التدفق المغنطيسي، تساوي 10 اس 4 كاوس»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)، ARABTERM"
          conflict: "هذا الرسم مُعتمَد في المعجمية العلمية العربية المعيارية للدلالة على وحدة القياس (SI unit) لا على الشخص، مما يُفضي إلى اشتراك لفظي مُضلِّل عند إدراجه في مجموعة العَلَم الشخصي"
        - text: "«التَّسْلة: وحدة كثافة التدفُّق المغنطيسيّ (فز).»"
          source: "المورد الحديث (2008)"
          conflict: "المورد الحديث يُورد 'التسلة' بصيغة مختلفة للدلالة على الوحدة الفيزيائية ذاتها، مما يؤكد اقتران رسم 'تسلا/التسلة' بالوحدة لا بالشخص في المصادر المرجعية"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────
stage3_analysis:
