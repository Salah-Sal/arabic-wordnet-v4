        text: "مهندسٌ كهربائيٌّ ومخترعٌ أمريكيٌّ من أصلٍ صربيٍّ، وُلِدَ في كرواتيا عام 1856 وتُوُفِّيَ عام 1943؛ رائدٌ في علم الكهرومغناطيسية، اكتشفَ مبادئَ التيارات المترددة، وطوَّرَ أوَّلَ محرِّكٍ تحريضيٍّ للتيار المتردد، وابتكرَ ملفَ تيسلا وعدةَ أشكالٍ من المذبذبات الكهربائية"
