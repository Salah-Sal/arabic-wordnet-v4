stage1_review:
  assessment:
    concerns:
      - "لمّة «راقصة تعري» تفتقر إلى أداة التعريف في المضاف إليه: الصواب «رَاقِصَةُ التَّعَرِّي» لأن المصدر في التركيب الإضافي يحتاج إلى «ال» ليكون محدداً"
      - "لمّة «متعرية» مكتوبة بدون تشكيل كامل، وتحتاج إلى تحديد صيغتها الصرفية الدقيقة: «مُتَعَرِّيَة»"
      - "اللمّتان الموجودتان متقاربتان دلالياً لدرجة تجعلهما شبه مترادفتين تامتين مع غياب توثيق للفرق الدقيق بينهما"
      - "غياب أي لفظ تراثي أصيل يقابل هذا المفهوم، مما يجعل المجموعة خالية من المصطلحية العربية الراسخة"
      - "المفهوم يقتصر على الجنس المؤنث في التعريف وكذلك اللمّات، وهو تضييق قد لا يعكس واقع الاستخدام الموسوعي"
    observations: >
      المجموعة تصف فنانة تؤدي عروض التعري الفني (striptease). كلا اللمّتين مشتقّتان من
      جذر «عري» — الأولى تركيب إضافي والثانية اسم فاعل مؤنث على وزن مُتَفَعِّلَة.
      التعريف العربي الحالي وظيفي ومقبول لكن يمكن تحسينه. المفهوم غريب ثقافياً على
      الموروث العربي الإسلامي، وهو ما يفسّر شُح المصطلحية المتخصصة فيه. التعريف
      الإنجليزي يورد ستة مرادفات أبرزها «ecdysiast» وهو المصطلح الأدبي الراقي الذي
      يقابله في المعجم الحديث «المتجرّدة».

  blind_candidates:
    - lemma: "نَاضِيَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر «نضا/ينضو» على وزن فَاعِلَة: «التي تنضو ثيابها» أي تخلعها.
        الفعل «نضا الثوبَ» ثابت في المعجمية العربية بمعنى خلع اللباس، وورد في شعر
        امرئ القيس. إحياء للفظ تراثي أصيل تجنباً للدوران اللفظي مع مكونات التعريف.
    - lemma: "مُجَرِّدَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر «جرد» على وزن مُفَعِّلَة: التي تجرّد ثيابها عن نفسها.
        الجذر «جرد» يدل على كشف الظاهر وعدم الستر كما في مقاييس اللغة.
        تحتاج مراجعة صرفية للتحقق من أن الوزن يفيد المعنى المراد دون التباس.
    - lemma: "رَاقِصَةُ التَّعَرِّي"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «راقصة» + مصدر «التعرّي» بأداة التعريف. يجمع العنصرَين
        الأساسيَّين في المفهوم: الرقص والتعري. أدق صياغةً من «راقصة تعري» الشائعة
        في الاستخدام الحالي الذي يفتقر إلى «ال».
    - lemma: "خَالِعَة"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر «خلع» على وزن فَاعِلَة: التي تخلع ثيابها. الفعل «خلع» هو
        المقابل اللغوي الأول لـ «undressing» في التعريف الإنجليزي. بسيط وشفاف دلالياً.


