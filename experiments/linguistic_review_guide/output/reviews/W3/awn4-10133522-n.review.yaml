# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمة «مرشح للفوز» عبارة وصفية حرة تفشل اختبار التثبيت المعجمي: يمكن استبدال «للفوز» بـ«للجائزة» أو «للرئاسة» دون فقدان الدلالة، مما يدل على أنها ليست وحدة معجمية مجمّدة."
      - "لمة «مفضل» مكتوبة بدون تشكيل في AWN، وتحتاج إلى ضبط كامل."
      - "المجموعة تفتقر إلى المصطلح العربي الأكثر تأصيلاً وتخصصاً لهذا المفهوم في سياق السباقات والمنافسات."
    observations: >
      تمثّل هذه المجموعة مفهومًا دقيقًا في خطاب المنافسة: ليس مجرد المتقدم في السباق
      (سابق)، ولا المنتصر بالفعل، بل المنافس الذي تميل الآراء والتقديرات إلى أنه سيفوز.
      وللمفهوم في العربية ثلاثة محاور: محور الأفضلية (مُفَضَّل)، ومحور الرجحان الاحتمالي
      (مُرَجَّح)، ومحور الترشيح (مرشح لـ). وقد وقع الاختيار على محوَري الأفضلية
      والوصف المركّب، وغاب المحور الأصح لغويًا وأعمقه توثيقًا.

  blind_candidates:
    - lemma: "مُرَجَّح"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ر-ج-ح) على وزن مُفَعَّل، وهو اسم مفعول يفيد «مَن جُعل راجحًا»
        أي من ثقُلت كِفَّته وزادت احتمالية فوزه. والرجحان في الميزان تمثيل دقيق للمفهوم:
        كأن ميزان التقدير يميل لصالحه. لا تكرار لكلمات التعريف.
    - lemma: "سَابِق"
      generation_method: majaz
      justification: >
        إحياء دلالي للفظ العربي الكلاسيكي «سابق» الذي كان يُطلق على الفرس المتقدم في
        السباق. يمكن إزاحته دلاليًا من «مَن تقدّم» إلى «مَن يُتوقَّع أن يتقدّم».
        غير أن هذه الإزاحة تُغيِّر الزمن الدلالي (من الإنجاز إلى التوقع).
    - lemma: "مُتَصَدِّر"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ص-د-ر) على وزن مُتَفَعِّل، بمعنى «الذي تصدّر القائمة». يُستخدم كثيرًا
        في سياقات ترتيب المنافسين، ويُشير إلى من يحتل المركز الأول في التقديرات.
    - lemma: "حَظِيٌّ"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ح-ظ-و/ح-ظ-ظ) على وزن فَعِيل، بمعنى «ذو الحظ والحُظوة»، أي المحظوظ
        المُؤيَّد بالأسباب المرجِّحة للفوز. وقد جاء في المعجم أن «مَحْظيّ» بمعنى «مُفَضَّل».


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات منفّذة: ٥ (دفعي شامل، جسر إنجليزي، بدون ال-، FTS عربي، مقاييس)
stage2_evidence:
  per_lemma:

    - lemma: "مرشح للفوز"
      contradicts:
        - text: >
            «(المرشح) البطانة الَّتِي تَحت لبد السرج وَنَحْوه لِأَنَّهَا تنشف الرشح
            وَمَا يلبس تَحت الثَّوْب لتنشيف الرشح (ج) مراشح»
          source: "المعجم الوسيط"
          conflict: >
            جميع مداخل «المرشح» في المعاجم الحديثة (الوسيط، الكبير) تدور على الأجهزة
            والمواد المادية للترشيح، لا على الشخص المُتنافِس. لا وجود للمعنى الانتخابي
            أو التنافسي كمدخل مستقل.
        - text: >
            «(المُرَشَّح) جهاز الترشيح (مج)»
          source: "المعجم الوسيط"
          conflict: >
            «المُرَشَّح» بالتشديد يعني جهاز الترشيح (الفيلتر)، وليس المنافس المُرَشَّح
            للفوز.
      expands:
        - text: >
            «الرَّاءُ وَالشِّينُ وَالْحَاءُ أَصْلٌ وَاحِدٌ; وَهُوَ النَّدَى يَبْدُو
            مِنَ الشَّيْءِ. فَالرَّشْحُ: الْعَرَقُ... ثُمَّ اسْتُعِيرَ ذَلِكَ لِكُلِّ
            مَنْ رُبِّيَ، فَقِيلَ يُرَشَّحُ لِلْخِلَافَةِ; كَأَنَّهُ يُرَبَّى لَهَا»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يؤكد ابن فارس أن «يُرَشَّح لـ» تعبير عربي قديم بمعنى «يُهَيَّأ ويُرَبَّى
            لشيء»، غير أن الصيغة المركبة «مرشح للفوز» قابلة للتبديل (مرشح للجائزة /
            للرئاسة)، مما يُثبت أنها ليست وحدة معجمية مجمّدة بل تعبير مفتوح النمط.

    - lemma: "مفضل"
      confirm:
        - text: >
            «(1) «أ» الأثير؛ المفضَّل؛ المَحْظيّ. «ب» المحبوب. «ج» المحسوب [على رجل
            ذي سلطان] (2) المُرَجَّح: فرس تُجمع الآراء على أنه سيفوز بقَصَب السَّبْق
            (3) أثير؛ مفضَّل؛ مَحْظيّ.»
          source: "المورد الحديث (2008)"
        - text: >
            «مُفَضَّل — translation_en: favorite — domain: Information and Communication»
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      expands:
        - text: >
            «الْفَاءُ وَالضَّادُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى زِيَادَةٍ فِي
            شَيْءٍ. مِنْ ذَلِكَ الْفَضْلُ: الزِّيَادَةُ وَالْخَيْرُ. وَالْإِفْضَالُ:
            الْإِحْسَانُ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر فضل يدل على الزيادة والمفارقة، فالمُفَضَّل هو من جُعل زائدًا على غيره
            في التقدير، وهو المعنى الدقيق لـ«المحبوب الأوفر حظًا».

    - lemma: "مُرَجَّح"
      confirm:
        - text: >
            «(2) المُرَجَّح: فرس تُجمع الآراء على أنه سيفوز بقَصَب السَّبْق»
          source: "المورد الحديث (2008)"
        - text: >
            «احتياطي محتَمل، احتياطي مرجَّح — translation_en: probable reserve»
          source: "المعجم الموحد لمصطلحات النفط (1999)"
      contradicts:
        - text: >
            «(المُرَجَّحُ) الحليمُ»
          source: "المعجم الكبير"
          conflict: >
            في المعجم الكبير «المُرَجَّح» يُراد به الحليم الرزين (صفة شخصية)، وهو معنى
            مختلف عن المنافس المرجَّح للفوز، لكن المورد الحديث يؤكد المعنى التنافسي
            بنص صريح، فالحالة إذن مختلطة بين دلالتين.
      expands:
        - text: >
            «الرَّاءُ وَالْجِيمُ وَالْحَاءُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى رَزَانَةٍ
            وَزِيَادَةٍ. يُقَالُ: رَجَحَ الشَّيْءُ، وَهُوَ رَاجِحٌ، إِذَا رَزَنَ،
            وَهُوَ مِنَ الرُّجْحَانِ... وَقَوْمٌ مَرَاجِيحُ فِي الْحِلْمِ;
            الْوَاحِدُ مِرْجَاحٌ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الرجحان = الثقل والزيادة في الميزان. المُرَجَّح هو من جُعل راجحًا، أي من
            ثقلت كِفَّته. الاستعمال التنافسي مجاز دقيق من هذا الأصل: كأن ميزان التقدير
            يميل لصالحه.

    - lemma: "سَابِق"
      expands:
        - text: >
            «الفرس الذي يجيء قبل غيره»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            السابق يصف الفرس الذي جاء فعلاً أولاً (إنجاز محقق)، لا المُتوقَّع فوزه.
            فارق زمني دلالي: الماضي مقابل المستقبل المُتوقَّع.
        - text: >
            «من يتقدم في الجري أو الكرم أو غير ذلك»
          source: "المعجم الكبير"
          addition: >
            يدل على التقدم الفعلي لا التوقع، وهو غير مناسب لمعنى المجموعة.

    - lemma: "مُتَصَدِّر"
      evidence_status: "no_material_found"

    - lemma: "حَظِيٌّ"
      contradicts:
        - text: >
            «(الحَظِيُّ) الثَّامِنُ خَيْل الحَلْبَةِ العَشَرَة»
          source: "المعجم الكبير"
          conflict: >
            «الحَظِيُّ» في اصطلاح سباق الخيل هو الفرس الثامن في عشرة، أي قُرب الأخير
            لا الأول! هذا يناقض تمامًا معنى «المتوقَّع الفوز».
        - text: >
            «(الحَظِيُّ) المجْدُودُ ذو الحظِّ من الرِّزْقِ»
          source: "المعجم الكبير"
          conflict: >
            المعنى اللغوي العام (المحظوظ بالرزق) لا يُحدّد السياق التنافسي ولا يُفيد
            معنى «المتوقَّع الفوز».


# ── المرحلة ٣: التحليل اللغوي للمات ───────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مرشح للفوز"
      decision: removed
      decision_reason: >
        تفشل هذه اللمة اختبار التثبيت المعجمي: النمط «مرشح + لـ + مصدر» مفتوح القياس
        (مرشح للجائزة، مرشح للرئاسة، مرشح للمنافسة)، مما يُثبت أنها عبارة وصفية حرة
        لا وحدة معجمية مجمّدة. لا يوجد في المعاجم العربية مدخل لها بهذه الصيغة المركبة
        في سياق المنافسة التنافسية. وقد أكد المورد الحديث أن المصطلح الصحيح لهذا المفهوم
        في سياق السباقات هو «المُرَجَّح».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مفضل"
      decision: confirmed
      decision_reason: >
        أكد المورد الحديث (2008) استخدام «المفضَّل» ترجمةً لـ«favorite» بمعنى «الأثير
        المحبوب». والجذر فضل يدل على الزيادة والتفضيل. يُستخدم الاصطلاح على نطاق واسع
        في الصحافة الرياضية العربية المعاصرة. يحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «مُفَضَّل» يُركّز على جانب الأفضلية الذاتية عند الجمهور والمراقبين: من أعطوه
        تفضيلهم وأثَّروا له على غيره. يُشير إلى العلاقة بين المنافس وجمهوره أو حُكّامه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُفَضَّل"

    - lemma: "مُرَجَّح"
      source: stage1
      decision: confirmed
      decision_reason: >
        أكده المورد الحديث (2008) بنص صريح: «المُرَجَّح: فرس تُجمع الآراء على أنه سيفوز
        بقَصَب السَّبْق». وهذا تعريف مطابق تمامًا للمجموعة الترادفية. الجذر رجح عند ابن
        فارس يدل على «رزانة وزيادة»، فالمُرَجَّح هو من ثقلت كِفَّته في الميزان التقديري.
        وكون المعجم الكبير يُثبت للمُرَجَّح معنى «الحليم» لا يُلغي الاستعمال التنافسي
        الموثَّق في المورد الحديث.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «مُرَجَّح» يُركّز على الجانب الاحتمالي والتحليلي: من رجحت كِفَّتُه وفق الحسابات
        والتقديرات الموضوعية. يُشير إلى الترجيح القائم على تقييم الأداء والإمكانات،
        لا على الهوى والتفضيل الجماهيري.
      actions:
        - command: create_entry
          params:
            lemma: "مُرَجَّح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10133522-n"

    - lemma: "سَابِق"
      source: stage1
      decision: removed
      decision_reason: >
        «السابق» يصف من أحرز التقدم فعلاً (إنجاز محقق في الزمن الماضي)، بينما تصف
        المجموعة مَن يُتوقَّع فوزه (توقع مستقبلي). الفارق الزمني الدلالي يجعل اللمة
        غير مطابقة للمجموعة.

    - lemma: "مُتَصَدِّر"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شواهد معجمية تُثبت استخدامه اصطلاحًا في سياق المنافسات التنافسية
        بمعنى «المتوقَّع الفوز». فضلاً عن ذلك، «المتصدر» يصف الترتيب الراهن (من يتصدر
        القائمة) لا التوقع المستقبلي.

    - lemma: "حَظِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «الحَظِيُّ» في اصطلاح سباق الخيل (المعجم الكبير) هو الثامن في عشرة خيل، أي
        قُرب الأخير لا الأول. وهذا تناقض مباشر مع معنى «المتوقَّع الفوز». المعنى اللغوي
        العام (المحظوظ) فضفاض ولا يُحدّد السياق التنافسي بما يكفي.


