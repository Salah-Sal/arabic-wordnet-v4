stage1_review:
  assessment:
    concerns:
      - "المصطلح «مجموعة السرخسيات البذرية» يحوي كلمة «مجموعة» التي قد تكون زائدة إن لم يكن القصد التأكيد على الرتبة التصنيفية، لكنها مقبولة."
    observations: "المفهوم يشير إلى مجموعة نباتية منقرضة تعرف بـ Pteridospermae أو Cycadofilicales. المصطلح الأساسي يتألف من شقين يعبران عن «سرخس» و«بذرة»."
  blind_candidates:
    - lemma: "سَرْخَسِيَّات بِذْرِيَّة"
      generation_method: ishtiqaq
      justification: "الترجمة القياسية لـ Pteridospermae، حيث Pterido تعني سرخس وsperm تعني بذرة."
    - lemma: "نَبَاتَات سَرْخَسِيَّة بِذْرِيَّة"
      generation_method: tarkib
      justification: "وصف أدق للمجموعة ككائنات نباتية."
    - lemma: "سِيكَادِيَّات سَرْخَسِيَّة"
      generation_method: taarib
      justification: "تعريب/ترجمة مباشرة لرتبة Cycadofilicales المرادفة للمجموعة."
    - lemma: "سَرَاخِس بِذْرِيَّة"
      generation_method: tarkib
      justification: "استخدام جمع التكسير لـ «سرخس» مع الصفة، وهو متداول في الكتابات العلمية المبسطة."

