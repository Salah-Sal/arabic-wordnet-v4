stage2_evidence:
  per_lemma:
    - lemma: "إِرْهَابِيٌّ إِلِكْتِرُونِيٌّ"
      confirm:
        - text: "«إرهابيّ» ← terrorist"
          source: "المعجم الموحد لمصطلحات القانون، أليكسو (2017) — مجال: القانون"
        - text: "«(1) الإرهابيّ (2) أو: إرهابيّ.» ← terrorist"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "المركّب «إرهابي إلكتروني» لم يَرِد مدخلاً مستقلاً في أيٍّ من المعاجم المستعلَمة (٧٦٠٠٠٠+ مدخل)"
          source: "قاعدة بيانات المعاجم — بحث headword_norm"
          conflict: "غياب تقنين معجمي رسمي للمركّب يُشكّل ثغرةً توثيقية، وإن كان المصطلح جارياً في الاستعمال المعاصر"

    - lemma: "قِرْصَانٌ مَعْلُومَاتِيٌّ"
      confirm:
        - text: "«قُرْصَان: شخص يقوم باستنساخ البرمجيات بكيفية غير مشروعة أو اختراق الأنظمة والاطلاع على معلومات دون أن يكون له الحق في ذلك» ← hacker"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات، أليكسو (2011)"
        - text: "«قُرْصَان إعلاميّ: قرصان إعلامي يقوم عن قصد بإلحاق ضرر أو خسارات بنظام معلوماتي» ← black hat; hacker"
          source: "مسرد الإعلام والتواصل، أليكسو (موقع ArabTerm)"
        - text: "«لِصُّ البحر»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«مبرمِج مقتحم، قرصان معلوماتية: مبرمِج يهوى العبث بحزم البرامج الخاصة بالحاسوب ونظم المعالجة، وذلك إما لأغراض حميدة كإضافة خصائص مفيدة إلى هذه البرامج، وإما لأغراض خبيثة مثل تعطيل النظام أو تقليل سرعته أو غزوه بالفيروسات.» ← hacker programmer"
          source: "مسرد التربية، أليكسو"
          addition: "يُثبت أن «قرصان معلوماتية/ي» تركيبٌ معلوم في المعجمية الأليكسية ويربطه بمبرمج يُلحق الضرر بالأنظمة؛ صيغة «معلوماتية» تُقرّب «قرصان معلوماتي» المُرشَّح"
        - text: "«قرصان أبيض: قرصان إعلامي يقوم باختراقات وأعمال لفتح البرامج المعلوماتية للعموم» ← white hat; hacker"
          source: "مسرد الإعلام والتواصل، أليكسو"
          addition: "وجود ثنائية قرصان أبيض / قرصان إعلامي (أسود) يُثبّت استعمال «قرصان + صفة» وحدةً اصطلاحية في أمن المعلومات"
        - text: "«قُرْصَانُ — أجاز مجمع اللغة المصري استعمال هذه الكلمة، وقد ذكرها الأساسي والمنجد بهذا المعنى»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "إجازة مجمعية صريحة تُعزّز الفصاحة وتدفع الاعتراض على الاستخدام"

    - lemma: "مُخَرِّبٌ رَقْمِيٌّ"
      contradicts:
        - text: "«مخرَّب: صفةٌ لتَصرُّفٍ يَجري بطريقةٍ خاطئةٍ أو مدمِّرة... واجهةُ مستخدِمٍ غامضةٌ وغيرُ بدهية، وعدمُ الاستجابةِ للأوامر استجابة يمكِن التنبؤ بها» ← braindamaged"
          source: "معجم مصطلحات المعلوماتية، أليكسو (2000)"
          conflict: "«مخرَّب» في المعلوماتية صفةٌ للبرمجيات المعيبة لا للأشخاص الخبيثين؛ الاشتباه الدلالي يعيق استخدامه وصفاً للإنسان الإرهابي"
        - text: "«مُخَرِّب» ← anerectic (destructive); destructive"
          source: "المعجم الطبي الموحد، أليكسو (2009)"
          conflict: "الاستعمال الموثَّق لـ«مخرِّب» في المعجمية الأليكسية الحديثة يقتصر على السياق الطبي بمعنى «مُتلِف» لا بمعنى الإرهابي الرقمي"

    - lemma: "مُخْتَرِقُ الشَّبَكَاتِ"
      confirm:
        - text: "«مخترق» ← hacker — مجال: موسوعة الكهرباء (Electropedia / IEC 60050)"
          source: "موسوعة الكهرباء، أليكسو"
      contradicts:
        - text: "«المُخْتَرَق: المَمَرُّ — المَوْضِعُ الذى تَخْتَرِقُه الرِّياحُ — مَهَبُّ الرِّياح»"
          source: "المعجم الكبير (OCR)"
          conflict: "«المُخْتَرَق» (بالفتح) اسم مكان لا اسم فاعل؛ يُوجد التباساً بين صيغتَي الفاعل (مُخْتَرِق بالكسر) والمكان (مُخْتَرَق بالفتح) ويُضعف المصطلح"
        - text: "«المخترق: مخترق الرِّيَاح مهبها وممرها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          conflict: "تُرسّخ المعاجم الحديثة أيضاً المعنى الكلاسيكي للمكان لا الشخص، مما يزيد من مخاطر الإيهام الصرفي"

    - lemma: "إِرْهَابِيٌّ سَيْبَرَانِيٌّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "إِرْهَابِيٌّ إِلِكْتِرُونِيٌّ"
      decision: confirmed
      decision_reason: >
        اللمّة راسخةٌ في الاستعمال العربي المعاصر بوصفها المصطلح الرسمي والإعلامي السائد
        للتعبير عن «cyber-terrorist»؛ وهي وحدةٌ معجمية مسكوكة — يؤكد ذلك اختبار السكّ:
        لا يمكن إحلال «إرهابي رقمي» أو «إرهابي تقني» محلّها في نفس السياق القانوني
        والإعلامي دون تغيير الدلالة المقننة. بوابة جودة المصطلح: الاطّراد ✓ — يُسر
        التداول ✓ — الملاءمة ✓ — إيثار العربي ✓. الضعف الوحيد: غياب التقنين المعجمي
        الرسمي، وهو أمر قابل للإصلاح بالتوثيق الحالي. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على الهوية الإرهابية: الدافع السياسي والإيديولوجي هو المُميِّز الجوهري؛
        ويُستعمل في السياقات القانونية والأمنية والتشريعية. «الإلكتروني» يُحدّد الوسيلة
        ويُفرّقه عن الإرهابي التقليدي، لا الطابع التقني للشخص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِرْهَابِيٌّ إِلِكْتِرُونِيٌّ"

    - lemma: "قِرْصَانٌ مَعْلُومَاتِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        ثلاثة أدلة معجمية متضافرة: (أ) «قرصان» موثَّقٌ في أليكسو بمعنى hacker في مجال
        تكنولوجيا المعلومات. (ب) «قرصان إعلامي» = black-hat hacker (من يُلحق ضرراً متعمَّداً)
        وهو أقرب المعاني إلى مفهوم المجموعة. (ج) «قرصان معلوماتية» ورد مكوّناً في اسم مدخل
        أليكسي معادِلاً لـhacker programmer — مما يُثبت استعمال التركيب مع «معلوماتي/ة».
        اختبار السكّ: «قرصان تقني» أو «قرصان رقمي» لا تقوم مقامها في السياق الأمني المعلوماتي.
        بوابة الجودة: الاطّراد ✓ — إيثار التراثي (القرصان من التراث المعجمي) ✓
        — إيثار العربي ✓ — الاشتقاقية ✓. تأييد مجمعي لكلمة «قرصان» ✓.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز الجانب التقني (فعل القرصنة والاختراق الخبيث) دون اشتراط صريح لدافع إرهابي؛
        أعمّ من «إرهابي إلكتروني» ويشمل كل مخترق خبيث (black-hat) بما فيه المُحرَّك
        بدوافع إرهابية. يُستعمل في السياقات التقنية والإعلامية والتثقيفية أكثر من القانونية.
      actions:
        - command: create_entry
          params:
            lemma: "قِرْصَانٌ مَعْلُومَاتِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُخَرِّبٌ رَقْمِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «مُخَرِّب» في المعجمية الأليكسية الحديثة يُستعمل صفةً للبرمجيات المعيبة أو وصفاً طبياً
        لا للأشخاص الإرهابيين؛ مما يُوجد التباساً دلالياً. علاوة على ذلك، المركّب لا يحمل
        أي إشارة إلى الدافع الإرهابي الذي هو جوهر المفهوم. بوابة الجودة: الملاءمة ✗.

    - lemma: "مُخْتَرِقُ الشَّبَكَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        إشكاليتان جوهريتان: (أ) الصرفية — المعاجم الكلاسيكية والحديثة تُوثّق «المُخْتَرَق»
        (بالفتح، اسم مكان) بمعنى ممرّ الريح، مما يُوجد التباساً مع اسم الفاعل «المُخْتَرِق»
        (بالكسر). (ب) الدلالية — حتى في صيغة اسم الفاعل، يدلّ على الهوية التقنية (المخترِق)
        لا على الدافع الإرهابي الذي هو الخاصّة المميِّزة. بوابة الجودة: يُسر التداول ✗
        (التباس بين صيغتَي الفاعل والمكان) — الملاءمة ✗.

    - lemma: "إِرْهَابِيٌّ سَيْبَرَانِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «سيبراني» تعريبٌ غير مستقرّ في المعجمية العربية ولم يُوثَّق في أيٍّ من المعاجم المستعلَمة.
        «إلكتروني» أرسخ وأشيع في الاستعمال الرسمي العربي ضمن هذا السياق، وقد استقرّت عليه
        التشريعات والمؤسسات. الاستعاضة بـ«إرهابي إلكتروني» المُثبَّت معجمياً أولى.
        بوابة الجودة: الاطّراد ✗ — إيثار العربي ✗.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "مبرمج يخترق أنظمة الكمبيوتر لسرقة أو تغيير أو تدمير المعلومات كشكل من أشكال الإرهاب الإلكتروني"
    assessment:
      decision: revise
      reason: >
        ثلاث علل: (١) «مبرمج» جنسٌ ضيّق يستبعد من يمتلك مهارات اختراق دون احتراف البرمجة.
        (٢) «الكمبيوتر» لفظٌ عامي؛ «الحاسوب» هو الفصيح المُقنَّن. (٣) مادة «الإرهاب الإلكتروني»
        تُعاد في التعريف مما يُقرّب من الدوران. وسلوب الترجمة الحرفية عن الإنجليزية ظاهرٌ ولا
        يُلائم أسلوب المعجم الوسيط في صياغة التعريفات.
    authored:
      - type: terminological
        text: "مخترقٌ إلكترونيٌّ يوظِّفُ اختراقَ أنظمةِ الحاسوبِ والشبكاتِ الرقميةِ — سرقةً لبياناتها أو تحريفاً أو إتلافاً — وسيلةً لتحقيق غاياتٍ إرهابية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "شخصٌ يمتلك مهاراتٍ تقنيةً في اختراق الشبكاتِ الرقميةِ وأنظمةِ الحاسوب ويوظِّفها أداةً للإرهاب؛ إذ يستهدف البنيةَ التحتيةَ المعلوماتيةَ الحيويةَ — كالاتصالات والخدمات الحكومية — قصدَ إلحاق الأذى بالمجتمعات أو إكراهَ الحكومات على الاستجابة لمطالب سياسية"
    actions:
      - command: update_definition
        params:
