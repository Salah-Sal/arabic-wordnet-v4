# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "الجنس في التعريف «مبرمج» ضيّقٌ جداً؛ ليس كل إرهابي إلكتروني مبرمجاً بالمعنى المهني الدقيق — وقد يكون مجرد مشغِّل أدوات"
      - "استخدام «الكمبيوتر» بدلاً من «الحاسوب» أو «الحاسب» يُخلّ بفصاحة التعريف"
      - "شبه دوران: اللمّة الموجودة «إرهابي إلكتروني» تُعيد مادة التعريف (الإرهاب الإلكتروني) ذاتها"
      - "المصطلح الإنجليزي المصاحب «cyberpunk» ينتمي في الغالب إلى الجنس الأدبي الخيالي والثقافة الفرعية (Gibson, Dick)، وليس إلى مجال الإرهاب الإلكتروني؛ ربطُه بهذا المفهوم قد يكون خطأً في تصنيف OEWN يستحق المراجعة"
      - "اللمّة الموجودة «إرهابي إلكتروني» تفتقر إلى التشكيل الكامل"
    observations: >
      المجموعة تصف شخصاً يمزج بين مهارات الاختراق الإلكتروني والدوافع الإرهابية، وهو مفهومٌ
      مستحدث بات له حضور في التشريعات العربية ووسائل الإعلام. اللمّة «إرهابي إلكتروني» هي
      التسمية الأشيع في الاستخدام الرسمي والإعلامي العربي، غير أن التعريف يحتاج إلى تنقيح:
      تعميم الجنس من «مبرمج» إلى «مخترق إلكتروني»، واستبدال «كمبيوتر» بـ«حاسوب». كما أن
      إدراج «cyberpunk» ضمن اللمّات الإنجليزية يستحق مراجعة مستقلة على مستوى OEWN.
  blind_candidates:
    - lemma: "قِرْصَانٌ مَعْلُومَاتِيٌّ"
      generation_method: majaz
      justification: >
        استحضارٌ لصورة القرصان الذي يُغير على السفن نهباً وتخريباً، وإزاحتها إلى الفضاء
        المعلوماتي؛ ففعل الاختراق الإلكتروني يشترك مع القرصنة البحرية في الإغارة والنهب
        وإلحاق الضرر المتعمَّد. وإحياء لفظ «القرصان» الكلاسيكي يتفادى الاشتراك اللفظي مع
        الألفاظ الحية. التركيب الوصفي «معلوماتي» يُخصّص المجال ويُشكّل وحدةً معجميةً ثابتة.
    - lemma: "مُخَرِّبٌ رَقْمِيٌّ"
      generation_method: ishtiqaq
      justification: >
        «مُخَرِّب» اسم فاعل من الرباعي خرَّب على وزن مُفَعِّل، يحمل معنى الإيقاع المتعمَّد
        للدمار وإفساد الإنشاء، وهو ما يلائم مفهوم تدمير المعلومات وتخريب الأنظمة. و«رقمي»
        يُقيّد المجال الإلكتروني. الوزن مناسب للدلالة على فاعل متمرّس يمارس التخريب باستمرار.
    - lemma: "مُخْتَرِقُ الشَّبَكَاتِ"
      generation_method: ishtiqaq
      justification: >
        «مُخْتَرِق» اسم فاعل من الباب الثامن (اخترق) يدلّ على من يجوب الشيء ويخترق حدوده،
        والتركيب الإضافي مع «الشبكات» يُقيّد المجال. الجذر خرق في مقاييس ابن فارس يدلّ على
        «مزق الشيء وجوبه» وهو قريب من الاختراق الرقمي. بنية إضافية واضحة: مُخْتَرِقُ + الشَّبَكَاتِ.
    - lemma: "إِرْهَابِيٌّ سَيْبَرَانِيٌّ"
      generation_method: tarkib
      justification: >
        تركيبٌ وصفي بين «إرهابي» (من الجذر رهب) و«سيبراني» (تعريب مقبول لـ cybernetic / cyber)
        يُبرز الجانبين التقني والإرهابي معاً. بات «سيبراني» يُستخدم في الخطاب الأمني العربي
        كمرادف لـ«إلكتروني» في سياقات الفضاء الرقمي، مما يمنح المركّب دلالةً اصطلاحية واضحة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة (٧ استعلامات):
