# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «خبيرة نباتات» مُجرَّدة من التشكيل الكامل"
      - "«نباتات» في اللمّة تُوحي بعلم النبات (botany) لا البستنة (horticulture)، مما يُفضي إلى خلط مع «عالمة نبات»"
      - "تناقض دلالي بين اللمّة (نباتات) والتراتب الأعلى (بستنة): التوافق المصطلحي يستوجب «خبيرة بستنة»"
      - "التعريف مترجم حرفياً من الإنجليزية دون تكييف بأسلوب المعجم العربي"
      - "التصنيف الجنسي المنفصل للمجموعات (مذكر/مؤنث) نمط غير مألوف في المعجمية العربية التقليدية التي تُعالج التأنيث صرفياً"
    observations: >-
      تمثّل هذه المجموعة مفهوم «خبيرة البستنة» (plantswoman / female horticulturist). اللمّة
      الموجودة «خبيرة نباتات» مفهومة في السياق العام إلا أنها تنزع نحو علم النبات (botany) لا
      البستنة (horticulture). والفرق دقيق لكنه حاسم: عالمة النبات تدرس النباتات علمياً، بينما
      خبيرة البستنة تُعنى بزراعة الأشجار المُثمِرة والخضر والأزهار ونباتات الزينة ورعايتها.
      وقد كشفت مقاييس اللغة لابن فارس أن «الخبير» يعني أيضاً «الأكّار» (العامل في الأرض)
      وأن «الخبير» يُطلق على النبات اللين — مما يمنح «خبيرة» دلالةً زراعية عميقة في الموروث
      اللغوي العربي، وهو ما يُعزّز صلاحية التركيب «خبيرة بستنة» اصطلاحاً.
  blind_candidates:
    - lemma: "بُسْتَانِيَّة"
      generation_method: ishtiqaq
      justification: >-
        مؤنّث «بُسْتَانِيّ» بصيغة النسبة (فُعْلانِيّ → فُعْلانِيَّة). «بستاني» مصطلح مُثبَّت
        في المعاجم الاصطلاحية للمتخصص في زراعة البساتين والحدائق. التأنيث الصرفي بالتاء
        المربوطة جارٍ على القياس العربي كـ«معمارية» و«قانونية».
    - lemma: "خَبِيرَةُ بُسْتَنَةٍ"
      generation_method: tarkib
      justification: >-
        تركيب إضافي يوازي التراتب الأعلى «خبير بستنة» مع إضافة علامة التأنيث. «بستنة» مصطلح
        علمي معتمد للـ horticulture في المعاجم الاصطلاحية العربية الحديثة. اجتاز اختبار السكّ:
        لا يُعوَّض «بستنة» بـ«زراعة» دون تغيير الحقل الدلالي التخصصي.
    - lemma: "عَالِمَةُ بَسَاتِين"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من «عالمة» (اسم فاعل مؤنث للعلم) و«بساتين» (جمع بستان). يُعبّر عن الخبرة
        العلمية في إدارة البساتين، على نمط «عالمة أحياء» و«عالمة نبات».
    - lemma: "زَرَّاعَة"
      generation_method: ishtiqaq
      justification: >-
        مؤنث «زرَّاع» على وزن فَعَّالة للمبالغة والمهنة، من الجذر (ز-ر-ع) الذي تُعرِّفه مقاييس
        اللغة بأنه «يدل على تنمية الشيء». تُشير إلى المرأة المُتفنِّنة في فنون الزراعة والتنبيت.


