# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11100591-n  |  ILI: i95698
# الموضوع: جوديث جاميسون — راقصة ومصممة رقصات أمريكية
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة مُصنَّفة بـ pos: n (اسم عام) في حين أنها تُحيل إلى شخصية بعينها (اسم علم شخصي) — يجب تصحيحه إلى proper_noun"
      - "اللمّتان الموجودتان (جاميسون، جوديث جاميسون) خاليتان من التشكيل الكامل المطلوب لكل لمّة مؤكَّدة"
      - "التعريف العربي الحالي مُختزَل للغاية — يقتصر على بيانات السيرة الذاتية الأساسية دون تمييز الشخصية بما اشتُهرت به"
      - "تغيير pos من n إلى proper_noun قد يستلزم تغيير المعرّف نفسه (awn4-11100591-n → awn4-11100591-p) — يجب التنسيق مع النظام"
    observations: >-
      هذه مجموعة ترادفية لاسم عَلَم شخصي أجنبي — الراقصة الأمريكية جوديث جاميسون (مواليد 1944).
      الملف المُقنَّع لا يُفصح عن الاسم، إذ يقتصر على وصف وظيفي وسيرة ذاتية مختزلة؛
      لذا فإن التوليد الأعمى لا يستطيع تخمين الاسم الصحيح بل يقتصر على إنتاج تعريبات
      صوتية محتملة لأسماء أجنبية شائعة. الأسماء الأعجمية الخاصة لا تقبل الاشتقاق ولا المجاز
      ولا التركيب — الوسيلة الوحيدة هي التعريب الصوتي (taarib).
      إن غياب الجذر العربي يجعل المعالجة المعجمية مقتصرة على تسجيل الصورة الصوتية للاسم.
  blind_candidates:
    - lemma: "جُودِيث جَامِيسُون"
      generation_method: taarib
      justification: >-
        تعريب صوتي للاسم الكامل المركّب من الاسم الأول (جوديث / Judith) والاسم الأخير
        (جاميسون / Jamison) — الصورة الأكثر وضوحاً وتمييزاً في السياق الموسوعي
    - lemma: "جَامِيسُون"
      generation_method: taarib
      justification: >-
        اللقب (الاسم الأخير) وحده — شائع في الاستخدام المرجعي المختصر كالفهارس
        والهوامش الأكاديمية
    - lemma: "جُودِيث جَيمِيسُون"
      generation_method: taarib
      justification: >-
        تعريب بديل للاسم الكامل مع ضبط حركي مختلف للجزء الثاني (جَيمِيسُون بدلاً من
        جَامِيسُون) — يعكس نطقاً آخر محتملاً في العربية الإعلامية
    - lemma: "جَيمِيسُون"
      generation_method: taarib
      justification: >-
        اللقب بصورة التعريب البديلة (جَيمِيسُون) — يعكس تبايناً في النقل الصوتي
        بين الإعلام العربي المختلف


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# ملاحظة المراجع: أُجريت ٣ استعلامات على قاعدة البيانات:
#   [١] مطابقة دفعية (جاميسون، الجاميسون، جوديث جاميسون، جوديث، جميسون، ...) → لا نتائج
#   [٢] جسر إنجليزي (Jamison, Judith Jamison, dancer, choreographer) → مداخل عامة فقط
#   [٣] FTS عربي (راقصة، كوريغراف، مصممة رقصات) → مداخل عامة غير ذات صلة بالشخصية
# النتيجة: لا توجد مداخل معجمية للشخصية بالاسم — متوقّع لأسماء الأعلام الأجنبية.
stage2_evidence:
  per_lemma:
    - lemma: "جاميسون"
      evidence_status: no_material_found
    - lemma: "جوديث جاميسون"
      evidence_status: no_material_found
    - lemma: "جُودِيث جَامِيسُون"
      evidence_status: no_material_found
    - lemma: "جَامِيسُون"
      evidence_status: no_material_found
    - lemma: "جُودِيث جَيمِيسُون"
      evidence_status: no_material_found
    - lemma: "جَيمِيسُون"
      evidence_status: no_material_found


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "جاميسون"
      decision: confirmed
      decision_reason: >-
        تعريب صوتي صحيح للقب Jamison — يصلح مرجعاً مختصراً للشخصية في السياقات
        النقدية والفهرسية التي تفترض معرفة القارئ بهوية الشخصية. يحتاج تصحيح التشكيل
        وتصحيح POS إلى proper_noun.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        الاسم الأخير (اللقب) وحده — صيغة مختصرة تُستخدم في السياقات المرجعية
        والنقدية المتخصصة؛ أقل دقةً من الاسم الكامل لكن أخفّ في الاستعمال اليومي
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَامِيسُون"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    - lemma: "جوديث جاميسون"
      decision: confirmed
      decision_reason: >-
        الاسم الكامل — الصيغة الأساسية المعتمدة في الموسوعات والمراجع الرسمية.
        أكثر تمييزاً ودقةً من اللقب المنفرد، إذ تُزيل أي التباس مع شخصيات أخرى
        تحمل اللقب نفسه. يحتاج تشكيلاً كاملاً وتصحيح POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الاسم الكامل (الاسم الأول + اللقب) — الصيغة المعيارية في الموسوعات
        والمراجع الرسمية والنصوص الأكاديمية؛ أعلى دقةً وتمييزاً من اللقب وحده
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُودِيث جَامِيسُون"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشحات المرحلة ١ ──────────────────────────────────────

    - lemma: "جُودِيث جَامِيسُون"
      source: stage1
      decision: removed
      decision_reason: >-
        مكرّرة عملياً مع اللمّة الموجودة (جوديث جاميسون) — الإجراء المطلوب هو
        تصحيح تشكيل اللمّة الموجودة لا إضافة مدخل جديد

    - lemma: "جَامِيسُون"
      source: stage1
      decision: removed
      decision_reason: >-
        مكرّرة عملياً مع اللمّة الموجودة (جاميسون) — الإجراء المطلوب هو تصحيح
        التشكيل لا إنشاء مدخل جديد

    - lemma: "جُودِيث جَيمِيسُون"
      source: stage1
      decision: removed
      decision_reason: >-
        هذا التعريب البديل (جَيمِيسُون بدلاً من جَامِيسُون) أقل دقةً صوتياً؛
        فـ Jamison تُنطق /ˈdʒeɪmɪsən/ والإغلاق الأول /eɪ/ يُعرَّب باتساق أكبر
        بـ «آ» لا «يم» — الصيغة المعتمدة جَامِيسُون أدق

    - lemma: "جَيمِيسُون"
      source: stage1
      decision: removed
      decision_reason: >-
        تعريب بديل أقل دقةً صوتياً ومكرَّر مع المرشح السابق الذي رُفض أيضاً؛
        اللمّة الموجودة بعد التشكيل (جَامِيسُون) تُغني عنه

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-11100591-n"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "راقصة ومصممة رقصات أمريكية (ولدت عام 1944)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي وصفيٌّ مُختزَل يُعطي بيانات السيرة الذاتية الأدنى (المهنة +
        الجنسية + سنة الميلاد) دون أن يُميِّز الشخصية بما اشتُهرت به. في المجموعات
        ذات الأعلام الشخصية يُستحسن تعريف موسوعي يُضمِّن أبرز الإسهامات.
    authored:
      - type: encyclopedic
        text: >-
          جُودِيث جَامِيسُون: راقصة ومصمِّمة رقصات أمريكية، وُلدت عام 1944 في فيلادلفيا،
          اشتُهرت بأدائها المتميز ضمن فرقة Alvin Ailey American Dance Theater وبشراكتها
          الفنية الطويلة مع المصمم ألفين آيلي، وتولَّت رئاسة الفرقة خلفاً له منذ عام 1989.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11100591-n"
          definition_index: 0
          text: >-
            جُودِيث جَامِيسُون: راقصة ومصمِّمة رقصات أمريكية، وُلدت عام 1944 في فيلادلفيا،
            اشتُهرت بأدائها المتميز ضمن فرقة Alvin Ailey American Dance Theater وبشراكتها
            الفنية الطويلة مع المصمم ألفين آيلي، وتولَّت رئاسة الفرقة خلفاً له منذ عام 1989.

  examples:
    per_lemma:
      - lemma: "جَامِيسُون"
        examples:
          - text: "تُعدّ جَامِيسُون من أبرز شخصيات الرقص الأمريكي الحديث في القرن العشرين."
            type: usage
      - lemma: "جُودِيث جَامِيسُون"
        examples:
          - text: "أسهمت جُودِيث جَامِيسُون في ترسيخ مكانة فرقة ألفين آيلي بين الفرق الراقصة العالمية الكبرى."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعدّ جَامِيسُون من أبرز شخصيات الرقص الأمريكي الحديث في القرن العشرين."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أسهمت جُودِيث جَامِيسُون في ترسيخ مكانة فرقة ألفين آيلي بين الفرق الراقصة العالمية الكبرى."


