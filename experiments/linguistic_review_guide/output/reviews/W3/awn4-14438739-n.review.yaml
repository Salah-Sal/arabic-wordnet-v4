          - text: "فَرَضَتِ السُّلطاتُ الصحيّةُ حَجْرًا صِحِّيًّا مُشَدَّدًا على المنطقةِ بعدَ تسجيلِ إصاباتٍ بالوباء"
            type: usage
          - text: "أَعلنَتِ الوزارةُ رَفْعَ الحَجْرِ الصِّحِّيِّ عن المدينةِ بعدَ انقضاءِ فترةِ الحَضانة"
