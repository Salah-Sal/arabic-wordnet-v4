  per_lemma:
    - lemma: "إِدْوِين لاند"
      evidence_status: "no_material_found"
      # لم يُعثَر على أي مدخل معجمي بهذا الاسم في قاعدة البيانات

    - lemma: "لاند"
      contradicts:
        - text: "«لانْدْ: غطاء نباتي مغلق وكثيف»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "المدخل الوحيد الموجود لـ«لاند» هو المصطلح الجغرافي الفرنسي الأصل landes؛ لا يوجد مدخل للاسم الشخصي"

    - lemma: "إِدْوِين هِيرْبِيرْت لاند"
      evidence_status: "no_material_found"

    - lemma: "دِين لاند"
      evidence_status: "no_material_found"

  # ملاحظة مرحلة ٢: وجد الجسر الإنجليزي مدخل Polaroid (entry_id=708837) في
  # المورد الحديث (2008): «المستقطِبة: مادة مستقطِبة للضوء تُستعمَل في المصابيح
  # والنظارات وغيرها لمنع السطوع المؤذي للعين.» — هذا يفيد في صياغة التعريف (المرحلة ٤)
  # لكنه لا يتعلق مباشرةً بأي لمّة من لمّات المجموعة.


