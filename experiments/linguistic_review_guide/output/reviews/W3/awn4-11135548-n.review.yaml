# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة «لاند» مبهمة في غياب السياق؛ تشترك مع المصطلح الجغرافي «landes» (غطاء نباتي مغلق كثيف) الموجود في قاعدة البيانات، مما قد يُفضي إلى تشويش دلالي"
      - "التعريف العربي الحالي ترجمة حرفية ركيكة؛ عبارة «دمج فيلم بولارويد في العدسات» ملتبسة ولا تُصوِّر بدقة ما اخترعه (الأفلام المستقطِبة للضوء المُدمجة في العدسات)"
      - "الاسمان الرسمي الكامل (Edwin Herbert Land) والكنية (Din Land) الواردان في lemmas_en غائبان عن اللمّات العربية الحالية"
      - "اللمّتان الحاليتان خاليتان من التشكيل"
    observations: >
      المجموعة تمثِّل علماً شخصياً لمخترع أمريكي هو إدوين هيربرت لاند (1909-1991)،
      مؤسِّس شركة بولارويد، صاحب اختراعَيْن بارزَيْن: (أ) الأفلام المستقطِبة للضوء
      المُدمجة في العدسات الشمسية وعدسات التصوير، (ب) آلة التصوير الفوري ذات الخطوة
      الواحدة. بما أن اللمّات أسماء أعلام أجنبية، لا تنطبق عليها أوزان الاشتقاق العربي
      ولا منهجية المجاز أو التركيب، والتعريب هو الطريقة الوحيدة الملائمة. يُوصى بإضافة
      الاسم الرسمي الكامل والكنية لمطابقة المعادل الإنجليزي في OEWN.

  blind_candidates:
    - lemma: "إِدْوِين لاند"
      generation_method: taarib
      justification: "تعريب صوتي للاسم الشائع Edwin Land؛ الصيغة الأكثر تداولاً في المراجع العربية للإشارة إلى هذا المخترع"
    - lemma: "لاند"
      generation_method: taarib
      justification: "تعريب اللقب وحده (Land)، يُستخدم في الإحالات المختصرة والفهارس العلمية"
    - lemma: "إِدْوِين هِيرْبِيرْت لاند"
      generation_method: taarib
      justification: "تعريب الاسم الرسمي الكامل Edwin Herbert Land المستخدَم في السياقات الأكاديمية والتوثيقية الرسمية"
    - lemma: "دِين لاند"
      generation_method: taarib
      justification: "تعريب الكنية المعروفة Din Land التي كان يُعرف بها في السياقات غير الرسمية، ووردت لمّةً في OEWN"


