# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-09809109-n (anagnost)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «قارئ» عامة جداً وتدلّ على من يقرأ أي نص، بينما المفهوم المقصود هو رتبة كنسية محددة في الكنيسة الأرثوذكسية الشرقية"
      - "اللمّة بلا تشكيل — يجب إضافة التشكيل الكامل: قَارِئ"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزية، ويحتاج صياغة معجمية أصيلة"
      - "المصطلح الإنجليزي anagnost من اليونانية ἀναγνώστης، وهو مصطلح تقني كنسي لا مقابل عربي مسكوك له سوى «القارئ» في الاستعمال الكنسي"
    observations: "المفهوم يشير إلى رتبة كنسية صغرى في الكنيسة الأرثوذكسية الشرقية، تقابل رتبة القارئ (lector) في الكنيسة الكاثوليكية. هذه الرتبة تختص بتلاوة فصول من الكتاب المقدس جهراً أثناء القداس الإلهي. المفهوم متداول في أدبيات الكنائس الشرقية بالعربية، إذ تستخدم الكنائس العربية مصطلح «القارئ» للدلالة على هذه الرتبة. اللمّة الموجودة مناسبة من حيث المبدأ لكنها تحتاج تقييداً سياقياً لتمييزها عن المعنى العام."

  blind_candidates:
    - lemma: "تَالٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تَلَا يَتْلُو بمعنى قرأ وتَبِعَ، والتلاوة أقرب دلالياً إلى القراءة الجهرية الطقسية من القراءة العامة، فالتلاوة تشير إلى الترتيل والقراءة المتتابعة بصوت مسموع"
    - lemma: "مُرَتِّل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رَتَّلَ يُرَتِّلُ بمعنى قرأ بتمهّل وتبيين، وهو مصطلح مستعمل في السياق الكنسي للدلالة على من يقود الترتيل والتلاوة الطقسية"
    - lemma: "أَنَاغْنُوسْطِس"
      generation_method: taarib
      justification: "تعريب مباشر للفظ اليوناني ἀναγνώστης (أناغنوستيس) الذي يدل على هذه الرتبة الكنسية بالتحديد، وهو مستعمل في بعض النصوص الكنسية العربية"
    - lemma: "نَاطِقٌ"
      generation_method: majaz
      justification: "مجاز من النُّطق بمعنى الإبانة والتلفّظ بالكلام، على سبيل التوسّع في الدلالة من مطلق التلفّظ إلى التلفّظ الطقسي بنصوص مقدسة في سياق العبادة"


stage2_evidence:
  per_lemma:
    - lemma: "قَارِئ"
      confirm:
        - text: "«القارئ: شخص مهمّته تلاوة فصول من الكتاب المقدَّس في قدّاس.»"
          source: "المورد الحديث (2008)"
        - text: "«(1) «أ» القارئ. «ب» lector. «ج» مصحِّح التجارب...»"
          source: "المورد الحديث (2008) — مدخل reader"
      expands:
        - text: "«(الْقَارئ) المتنسك»"
          source: "المعجم الوسيط"
          addition: "المعنى الأصلي للقارئ في العربية الفصحى هو المتنسك المتعبد، وهو قريب دلالياً من المعنى الكنسي"
        - text: "«القارئ: الذي جمع القرآن حفظاً عن ظهر قلب»"
          source: "مختصر العبارات لمعجم مصطلحات القراءات للدوسري"
          addition: "معنى إسلامي خاص بحافظ القرآن، يوضّح تعدد دلالات اللفظ حسب السياق الديني"

    - lemma: "تَالٍ"
      evidence_status: "no_material_found"

    - lemma: "مُرَتِّل"
      evidence_status: "no_material_found"

    - lemma: "أَنَاغْنُوسْطِس"
      evidence_status: "no_material_found"

    - lemma: "نَاطِقٌ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "قَارِئ"
      decision: confirmed
      decision_reason: "لمّة مؤكدة بأدلة معجمية قوية من المورد الحديث (2008) الذي يترجم lector بـ«القارئ» ويعرّفه بأنه شخص مهمته تلاوة فصول من الكتاب المقدس في القداس، وهذا مطابق تماماً لمفهوم المجموعة الترادفية. كما أن المعجم الوسيط يعرّف القارئ بـ«المتنسك»، وهو معنى قريب. اللفظ مشتق من جذر عربي أصيل (ق ر أ) على وزن فَاعِل، وهو الاستعمال المتداول في الكنائس العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَارِئ"

    - lemma: "تَالٍ"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام يدل على من يتلو أي نص، ولا يحمل دلالة كنسية مخصوصة. لم تُعثر على أدلة معجمية تربطه برتبة كنسية. كما أن استعماله سيؤدي إلى لبس مع المعنى الأصلي (التالي بمعنى اللاحق)."

    - lemma: "مُرَتِّل"
      source: stage1
      decision: removed
      decision_reason: "المرتّل في الاستعمال الكنسي يشير إلى من يقود الترتيل والأناشيد الكنسية (cantor/chanter)، وهو رتبة مختلفة عن القارئ (anagnost) الذي يتلو الدروس والفصول الكتابية. الخلط بينهما يوقع في خطأ مفهومي."

    - lemma: "أَنَاغْنُوسْطِس"
      source: stage1
      decision: removed
      decision_reason: "تعريب غير ضروري لأن المقابل العربي «قارئ» متداول ومثبت في المعاجم ثنائية اللغة. اللفظ ثقيل صوتياً ولا يقبل الاشتقاق بيسر، ولم يُعثر عليه في أي معجم عربي."

    - lemma: "نَاطِقٌ"
      source: stage1
      decision: removed
      decision_reason: "لفظ عام جداً يدل على كل من ينطق بالكلام، ولا صلة تخصيصية له بالسياق الكنسي. المجاز ضعيف ولا سند معجمي له في هذا المعنى."


stage4_content:
  definition:
    current: "رجل دين في الرتب الصغرى للكنيسة الأرثوذكسية الشرقية يقرأ الدروس بصوت عالٍ في الليتورجيا (يقابله القارئ في الكنيسة الكاثوليكية)"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة شبه حرفية من الإنجليزية، تحتاج إعادة صياغة بأسلوب معجمي عربي أصيل مع تقديم الجنس القريب (رتبة كنسية) والفصل النوعي (تلاوة الفصول الكتابية في القداس)"
    authored:
      - type: terminological
        text: "رُتْبَةٌ كَنَسِيَّةٌ صُغْرَى فِي الكَنِيسَةِ الأُرْثُوذُكْسِيَّةِ الشَّرْقِيَّةِ، صَاحِبُهَا مُكَلَّفٌ بِتِلَاوَةِ فُصُولٍ مِنَ الكِتَابِ المُقَدَّسِ جَهْرًا فِي أَثْنَاءِ القُدَّاسِ الإِلَهِيِّ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "رُتْبَةٌ مِنَ الرُّتَبِ الكَهَنُوتِيَّةِ الصُّغْرَى فِي الكَنِيسَةِ الأُرْثُوذُكْسِيَّةِ الشَّرْقِيَّةِ، يُعْهَدُ إِلَى حَامِلِهَا بِقِرَاءَةِ الدُّرُوسِ وَالنُّصُوصِ الكِتَابِيَّةِ عَلَى مَسَامِعِ المُصَلِّينَ خِلَالَ اللِّيتُورْجِيَا (القُدَّاسِ الإِلَهِيِّ)، وَتُقَابِلُ رُتْبَةَ القَارِئِ (lector) فِي الكَنِيسَةِ الكَاثُولِيكِيَّةِ الرُّومَانِيَّةِ"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "رُتْبَةٌ كَنَسِيَّةٌ صُغْرَى فِي الكَنِيسَةِ الأُرْثُوذُكْسِيَّةِ الشَّرْقِيَّةِ، صَاحِبُهَا مُكَلَّفٌ بِتِلَاوَةِ فُصُولٍ مِنَ الكِتَابِ المُقَدَّسِ جَهْرًا فِي أَثْنَاءِ القُدَّاسِ الإِلَهِيِّ"

  examples:
    per_lemma:
      - lemma: "قَارِئ"
        examples:
          - text: "رُسِمَ الشَّمَّاسُ الشَّابُّ قَارِئًا فِي كَنِيسَةِ القِدِّيسِ مَرْقُسَ، فَصَارَ يَتْلُو الرِّسَالَةَ وَفُصُولَ العَهْدِ القَدِيمِ عَلَى المُصَلِّينَ فِي كُلِّ قُدَّاسٍ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "رُسِمَ الشَّمَّاسُ الشَّابُّ قَارِئًا فِي كَنِيسَةِ القِدِّيسِ مَرْقُسَ، فَصَارَ يَتْلُو الرِّسَالَةَ وَفُصُولَ العَهْدِ القَدِيمِ عَلَى المُصَلِّينَ فِي كُلِّ قُدَّاسٍ."


