# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13871279-n (fortieth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «الأربعون» هي اسم العدد الأصلي (cardinal) لا العدد الترتيبي (ordinal)، لكنّ العربية تستخدم العدد الأصلي للدلالة على الترتيب فيما فوق العشرة، فلا إشكال"
      - "التعريف الحالي ترجمة حرفية من الإنجليزية، يحتاج صياغة عربية أصيلة"
    observations: "المفهوم هو الرتبة الأربعون في سلسلة ترتيبية. في العربية لا توجد صيغة ترتيبية مستقلة للأعداد فوق العشرة، بل يُستعمل العدد الأصلي معرّفاً بأل للدلالة على الترتيب: «الجزء الأربعون» و«الصفحة الأربعون». اللمّة الوحيدة المتوقعة هي «الأربعون» بوصفها اسم عدد يؤدي وظيفة الترتيب."
  blind_candidates:
    - lemma: "الأَرْبَعُونَ"
      generation_method: ishtiqaq
      justification: "اسم العدد المشتق من الجذر «ربع» على وزن أَفْعَلون، يُستخدم في العربية للدلالة على المركز الأربعين في الترتيب لعدم وجود صيغة ترتيبية مخصوصة فوق العشرة"
    - lemma: "الرُّتْبَةُ الأَرْبَعُونَ"
      generation_method: tarkib
      justification: "مركب وصفي من «الرتبة» + «الأربعون» يصف المركز الترتيبي صراحةً"
    - lemma: "المَوْضِعُ الأَرْبَعُونَ"
      generation_method: tarkib
      justification: "مركب وصفي من «الموضع» + «الأربعون» يدل على المكان في السلسلة"
    - lemma: "الأَرْبَعِينِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الأربعين على وزن فَعِيلِيّ، للدلالة على ما يتعلق بالأربعين ترتيباً"

stage2_evidence:
  per_lemma:
    - lemma: "الأَرْبَعُونَ"
      confirm:
        - text: "«(الْأَرْبَعُونَ) من الْعدَد أَربع عشرات»"
          source: "المعجم الوسيط (حوراماني)"
        - text: "«من العدد: أربع عشرات»"
          source: "المعجم الوسيط (OCR)"
        - text: "«من العَدَدِ: أربعُ عَشَراتٍ. وتُعرب إعراب جَمْع المُذَكَّر السَّالم, فتُرْفَعُ بالواو وتُنْصَبُ وتُجَرُّ بالياءِ»"
          source: "المعجم الكبير"
        - text: "«(4) العضو الأربعون في سلسلة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«وَإِذْ وَاعَدْنَا مُوسَى أَرْبَعِينَ لَيْلَةً»"
          source: "المعجم الكبير — شاهد قرآني"
          addition: "شاهد على استعمال الأربعين في القرآن الكريم"
        - text: "«وماذا يَدَّرِي الشُّعراءُ مِنِّى ... وقد جاوَزْتُ حَدَّ الأَرْبعين» — سُحَيْمُ بن وَثِيل الرِّياحِيّ"
          source: "المعجم الكبير — شاهد شعري"
          addition: "شاهد شعري على استعمال الأربعين بمعنى سنّ الأربعين"
    - lemma: "الرُّتْبَةُ الأَرْبَعُونَ"
      evidence_status: "no_material_found"
    - lemma: "المَوْضِعُ الأَرْبَعُونَ"
      evidence_status: "no_material_found"
    - lemma: "الأَرْبَعِينِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الأَرْبَعُونَ"
      decision: confirmed
      decision_reason: "اللمّة مؤكّدة بأدلة معجمية متعددة من المعجم الوسيط والمعجم الكبير والمورد الحديث. وهي الصيغة القياسية في العربية للدلالة على العدد الأربعين بوظيفة ترتيبية وأصلية على السواء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الأَرْبَعُونَ"
    - lemma: "الرُّتْبَةُ الأَرْبَعُونَ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة وليست وحدة معجمية ثابتة. يمكن استبدال «الرتبة» بـ«المكانة» أو «الدرجة» فيبقى المعنى، مما يثبت عدم تثبّتها معجمياً (فشل اختبار السكّ)."
    - lemma: "المَوْضِعُ الأَرْبَعُونَ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة لا تعبير اصطلاحي ثابت. يمكن إبدال «الموضع» بـ«المكان» أو «المحلّ» دون تغيير الوظيفة، فهي ليست مصطلحاً مسكوكاً."
    - lemma: "الأَرْبَعِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على هذه النسبة بمعنى الترتيب الأربعين. الصيغة تدل في الاستعمال المعاصر على ما يتعلق بفترة الأربعين يوماً (كالأربعينية في الحداد) لا على الترتيب العددي. ولا حاجة إليها مع وجود «الأربعون» الأصلية."

