      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية مع ثلاث مشكلات: (١) يستخدم علامات
        اقتباس لاتينية بدلاً من الشوليتين العربيتين «»، (٢) يفتقر إلى السياق المعرفي
        (مدرسة شيكاغو المعمارية) الذي يُحدِّد مكانة سوليفان تاريخياً، (٣) أسلوبه
        وصفي ركيك لا يتوافق مع أسلوب المعجم الوسيط.
