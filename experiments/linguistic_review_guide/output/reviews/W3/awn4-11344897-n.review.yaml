# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل"
      - "الشكل الرسمي الكامل للاسم (لويس هنري سوليفان / Louis Henry Sullivan) غائب عن المجموعة"
      - "التعريف الحالي ترجمة حرفية من الإنجليزية، ويستخدم علامات اقتباس لاتينية بدلاً من الشوليتين العربيتين «»"
    observations: >
      هذه المجموعة تمثّل اسم علم لمعماري أمريكي بارز (1856-1924) اشتُهر بتصميم ناطحات
      السحاب ذات الهياكل الفولاذية وبصياغة مبدأ «الشكل يتبع الوظيفة». لا مجال هنا
      للاشتقاق أو المجاز لأن المدخل اسم علم أعجمي — الوحيد المنهجي هو التعريب الصوتي.
      الاسم «Sullivan» من أصل أيرلندي موثَّق في موسوعة السلطان قابوس لأسماء العرب،
      مما يؤكد تداول هذا التعريب في المنظومة الاسمية العربية. التحدي الرئيسي هو تحديد
      الأشكال المعيارية المكتملة وضبطها بالتشكيل.
  blind_candidates:
    - lemma: "سُولِيفَان"
      generation_method: taarib
      justification: "تعريب صوتي للقب 'Sullivan' الأيرلندي الأصل؛ هو الشكل المختصر الأكثر شيوعاً في الإحالة إلى هذا المعماري في المصادر العربية المتخصصة"
    - lemma: "لُوِيس سُولِيفَان"
      generation_method: taarib
      justification: "تعريب الاسم الثنائي (الاسم الأول + اللقب)، وهو الشكل الأكثر تداولاً في المصادر العربية المعمارية والموسوعية"
    - lemma: "لُوِيس هِنْرِي سُولِيفَان"
      generation_method: taarib
      justification: "تعريب الاسم الرسمي الكامل بالاسم الأوسط 'Henry'؛ يُستخدم في السياقات الموسوعية التي تستلزم التعريف الكامل للشخصية بلا لبس"
    - lemma: "لُوِيس هَنْرِي سُولِيفَان"
      generation_method: taarib
      justification: "تعريب بديل يعكس النطق الفرنسي للاسم الأوسط 'Henri' (المسجَّل في المصادر الإنجليزية بصيغة Louis Henri Sullivan) — فارق فونولوجي دقيق بين كسر الهاء وفتحها"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دقيقة دفعية: سوليفان، لويس سوليفان، لويس هنري سوليفان، لويس هنرى سوليفان
#   Q2 — الجسر الإنجليزي: Sullivan / Louis Sullivan / Louis Henry Sullivan
#   Q3 — بحث FTS: ناطحات السحاب، الشكل يتبع الوظيفة، معماري امريكي
stage2_evidence:
  per_lemma:
    - lemma: "سوليفان"
      expands:
        - text: "«سوليفان: عن الأيرلندية بمعنى أسود العينين. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يوثِّق المصدر الأصل الأيرلندي للاسم ويؤكد قبوله في المنظومة الاسمية العربية المعاصرة، مما يدعم شرعية هذا الشكل المُعرَّب"

    - lemma: "لويس سوليفان"
      evidence_status: "no_material_found"

    - lemma: "لُوِيس هِنْرِي سُولِيفَان"
      evidence_status: "no_material_found"

    - lemma: "لُوِيس هَنْرِي سُولِيفَان"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "سوليفان"
      decision: confirmed
      decision_reason: >
        الشكل موثَّق في موسوعة عربية متخصصة لأسماء الأعلام، وهو التعريب الصوتي المعياري
        للقب 'Sullivan'. يُقبل كلمّة مرجعية للإحالة المختصرة. يحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الشكل المختصر (اللقب وحده)، يُستخدم في الإحالات الاختصارية وعند الاكتفاء بالتعريف الضمني في السياق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُولِيفَان"

    - lemma: "لويس سوليفان"
      decision: confirmed
      decision_reason: >
        هذا الشكل الثنائي (الاسم الأول + اللقب) هو الأكثر تداولاً في المصادر العربية
        المعمارية والموسوعية، ويُغطي الاستخدام اليومي في الكتابة العربية. لا أدلة معجمية
        مباشرة لكن التعريب راسخ ومنتظم. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الشكل الشائع المعتمد في أغلب المصادر العربية، يجمع الاسم الأول واللقب دون الاسم الأوسط"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُوِيس سُولِيفَان"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────

    - lemma: "سُولِيفَان"
      source: stage1
      decision: removed
      decision_reason: "مطابق تماماً للمّة الموجودة 'سوليفان' — سيُعالَج ضمن أمر update_lemma للمّة الموجودة"

    - lemma: "لُوِيس سُولِيفَان"
      source: stage1
      decision: removed
      decision_reason: "مطابق تماماً للمّة الموجودة 'لويس سوليفان' — سيُعالَج ضمن أمر update_lemma للمّة الموجودة"

    - lemma: "لُوِيس هِنْرِي سُولِيفَان"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل للمعماري (Louis Henry Sullivan) مسجَّل في OEWN بصيغتيه
        (Henry / Henri). الشكل الثلاثي ضروري في السياقات الموسوعية والأكاديمية التي
        تستلزم التمييز القاطع عن أشخاص آخرين يحملون الاسم ذاته. لا أدلة معجمية مباشرة
        لكن التعريب منتظم ومتوقَّع.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الرسمي الكامل بثلاثة مكوّنات، مخصَّص للسياقات الموسوعية والأكاديمية الرسمية التي تتطلب تعريفاً لا لبس فيه"
      actions:
        - command: create_entry
          params:
            lemma: "لُوِيس هِنْرِي سُولِيفَان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "لُوِيس هَنْرِي سُولِيفَان"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب العربي المعياري للاسمين الإنجليزي (Henry) والفرنسي (Henri) لا يختلف في
        الكتابة العربية — كلاهما يُكتب «هِنْرِي». لا مسوّغ لشكلين منفصلين يمثّلان
        الشخصية ذاتها بنطقَيْن متقاربَيْن جداً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
