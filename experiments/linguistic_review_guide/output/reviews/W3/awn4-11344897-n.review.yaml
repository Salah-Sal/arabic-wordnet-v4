        text: "مُعَمَّارٌ أَمْرِيكِيٌّ (1856-1924)، من رواد مدرسة شيكاغو المعمارية، اشتُهر بتصميم ناطحات السحاب ذات الهياكل الفولاذية، وبصياغته مبدأ «الشكل يتبع الوظيفة» الذي أرسى قواعد العمارة الوظيفية الحديثة."
