# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13986678-n
# ghetto — أي نمط حياة أو عمل منعزل ناتج عن التحيز أو التنميط
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «جيتو» غير مشكّلة وتحتاج ضبطاً صرفياً"
      - "اللمّة «معزل» غير مشكّلة؛ وهي في المعاجم تعني مكان الانفراد أو الحجر الصحي، ولا تحمل بالضرورة دلالة التحيّز الاجتماعي"
      - "المجموعة تفتقر إلى مصطلح عربي أصيل يجمع بين العزل والتمييز العنصري"
      - "تعريب «جيتو» غير موحّد في المعاجم: المورد الحديث يستخدم «الغَيْت» لا «جيتو»"
    observations: >
      المفهوم المقصود هو نمط حياة قائم على العزل القسري الناتج عن التحيّز العنصري أو الطبقي.
      هذا المفهوم وافد ثقافياً من السياق الأوروبي (أحياء اليهود في البندقية ثم أوروبا)،
      وقد انتقل إلى العربية بالتعريب. اللمّة «معزل» تؤدي المعنى العام للعزل لكنها لا تستوعب
      البعد الاجتماعي التمييزي الذي يميّز هذا المفهوم عن مجرد الانعزال الطوعي أو الحجر الصحي.

  blind_candidates:
    - lemma: "مَنْبَذ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن-ب-ذ (النبذ والإقصاء) على وزن مَفْعَل الدال على المكان أو الحال،
        ليدلّ على الموضع أو النمط الذي يُنبَذ فيه الإنسان ويُقصى بسبب التحيّز.
    - lemma: "تَهْمِيش"
      generation_method: ishtiqaq
      justification: >
        من الجذر هـ-م-ش بمعنى الإقصاء إلى الهامش، مصدر على وزن تَفْعِيل،
        يشير إلى عملية الإبعاد الاجتماعي الناتج عن التمييز. لكنه يدلّ على الفعل لا على النمط الناتج.
    - lemma: "حَيْزُ العُزْلَة"
      generation_method: tarkib
      justification: >
        مركب إضافي من «حيّز» (نطاق/مجال) و«العزلة»، ليدلّ على النطاق المعيشي المنعزل.
        لكنه تعبير وصفي حرّ وليس مصطلحاً مسكوكاً.
    - lemma: "غِيتُو"
      generation_method: taarib
      justification: >
        تعريب للفظ الإيطالي ghetto، وهو مصطلح ذو صيغة عالمية مستقرة.
        يقبل لام التعريف (الغيتو) والجمع السالم (غيتوات).

stage2_evidence:
  per_lemma:
    - lemma: "جِيتُو"
      evidence_status: "no_material_found"

    - lemma: "مَعْزِل"
      confirm:
        - text: "«مكان الانفراد»"
          source: "المعجم الوسيط"
        - text: "«﴿وَكَانَ فِي مَعْزِلٍ﴾»"
          source: "المعجم الوسيط (شاهد قرآني)"
      expands:
        - text: "«يُقَال هُوَ بمعزل عَن كَذَا مُجَانب لَهُ وَمَكَان يعْزل فِيهِ المرضى عَن الأصحاء اتقاء الْعَدْوى (محدثة)»"
          source: "المعجم الوسيط"
          addition: "المعنى المحدث للمعزل هو مكان الحجر الصحي، وهو أخصّ من المفهوم المطلوب"
        - text: "«الصواب والرتبة: جَلَسَ بمَعْزِل عنهم [فصيحة] - جَلَسَ بمَعْزَل عنهم [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الضبط الفصيح بكسر الزاي: مَعْزِل"

    - lemma: "مَنْبَذ"
      contradicts:
        - text: "«جهاز لطرد المياه يعتمد على القوة النابذة لفصل جسيمات ذات كثافة يختلف بعضها عن بعض»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
          conflict: "المنبذ مصطلح تقني بمعنى الطرد المركزي (centrifuge)، ولا علاقة له بالعزل الاجتماعي"

    - lemma: "تَهْمِيش"
      evidence_status: "no_material_found"

    - lemma: "حَيْزُ العُزْلَة"
      evidence_status: "no_material_found"

    - lemma: "غِيتُو"
      expands:
        - text: "«الغَيْت: حيّ اليهود [أو الأقلّيّات] في مدينة.»"
          source: "المورد الحديث (2008)"
          addition: "المورد يستخدم صيغة «الغَيْت» لا «غيتو»، ويحصر المعنى في الحيّ السكني للأقليات"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جِيتُو"
      decision: confirmed
      decision_reason: >
        تعريب شائع ومتداول في الإعلام والكتابات العربية المعاصرة للدلالة على نمط العيش المنعزل
        بسبب التمييز. وإن لم يرد في المعاجم التقليدية بهذه الصيغة، فإنه مستقرّ في الاستعمال
        الصحفي والأكاديمي العربي. يحتاج تشكيلاً: جِيتُو.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختصّ بالدلالة على مفهوم الغيتو التاريخي والاجتماعي بأبعاده التمييزية، وهو مصطلح دولي
        يحمل شحنة ثقافية خاصة لا يؤديها لفظ «معزل» العام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِيتُو"

    - lemma: "مَعْزِل"
      decision: confirmed
      decision_reason: >
        لفظ عربي فصيح من الجذر ع-ز-ل، ورد في المعجم الوسيط بمعنى «مكان الانفراد»
        وله شاهد قرآني ﴿وَكَانَ فِي مَعْزِلٍ﴾. يؤدي المعنى العام للعزل والانفصال عن الجماعة،
        وإن كان لا يحمل بذاته دلالة التحيّز. يحتاج تشكيلاً: مَعْزِل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ على مطلق العزلة والانفراد عن الجماعة دون تخصيص بالتمييز العنصري،
        وهو اللفظ العربي الأصيل الأعمّ دلالةً من «جيتو» المعرَّب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَعْزِل"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَنْبَذ"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ مشغول في المعاجم التقنية بمعنى «الطرد المركزي» (centrifuge)،
        ولا شواهد على استخدامه بمعنى العزل الاجتماعي. توليد غير مسنود.

    - lemma: "تَهْمِيش"
      source: stage1
      decision: removed
      decision_reason: >
        يدلّ على فعل الإقصاء (العملية) لا على النمط المعيشي الناتج عنه.
        المجموعة الترادفية تصف حالةً/نمطاً لا فعلاً.

    - lemma: "حَيْزُ العُزْلَة"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ لا مصطلح مسكوك. يمكن إبدال «حيّز» بـ«نطاق» أو «مجال»
        ويبقى التعبير صالحاً، مما يدلّ على أنه ليس وحدة معجمية ثابتة (فشل اختبار السكّ).

    - lemma: "غِيتُو"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة إملائية بديلة لـ«جيتو» الموجودة أصلاً. لا حاجة لإضافة صيغتين
        لتعريب واحد. الصيغة «جيتو» أشيع في الاستعمال الصحفي العربي.

stage4_content:
  definition:
    current: "أي نمط حياة أو عمل منعزل ناتج عن التحيز أو التنميط"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية، ويحتاج إعادة صياغة بأسلوب معجمي عربي.
        كلمة «التنميط» في العربية تعني التوحيد القياسي (standardization) أكثر مما تعني
        القولبة النمطية (stereotyping).
    authored:
      - type: terminological
        text: "نمطٌ من العيش أو العمل قائمٌ على عزل فئة من الناس عن سائر المجتمع بسبب التمييز أو التحامل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "حالة اجتماعية يُجبَر فيها أفراد فئة بعينها — عرقية أو دينية أو إثنية — على الإقامة والعمل في نطاق منعزل عن بقية المجتمع، نتيجة سياسات تمييزية أو أحكام مسبقة راسخة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "نمطٌ من العيش أو العمل قائمٌ على عزل فئة من الناس عن سائر المجتمع بسبب التمييز أو التحامل."

  examples:
    per_lemma:
      - lemma: "جِيتُو"
        examples:
          - text: "عاشت الأقلية في جيتو مغلق على أطراف المدينة لعقود طويلة قبل أن تُرفَع عنها القيود."
            type: usage
      - lemma: "مَعْزِل"
        examples:
          - text: "ظلّ العمال المهاجرون يعيشون في معزل عن السكان المحليين بسبب سياسات التمييز السائدة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "عاشت الأقلية في جيتو مغلق على أطراف المدينة لعقود طويلة قبل أن تُرفَع عنها القيود."
      - command: add_sense_example
