stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف العربي يحتاج إلى صياغة أكثر دقة وموسوعية."
    observations: "المجموعة تتعلق بمَعلم جغرافي محدد (خليج نيويورك)، وهو مصطلح مركب يجمع بين اسم فني (خليج) واسم علم أعجمي (نيويورك). الترجمة المباشرة هي الأكثر شيوعاً واستقراراً في المعاجم الجغرافية المعاصرة."
  blind_candidates:
    - lemma: "خَلِيج نِيُويُورْك"
      generation_method: tarkib
      justification: "الترجمة المصطلحية المباشرة والمستقرة جغرافياً للمعلم."
    - lemma: "خَلِيجُ نِيُويُورْك الأَعْلَى"
      generation_method: tarkib
      justification: "تحديد للجزء الشمالي من الخليج (Upper Bay) حيث يصب نهر هدسون."
    - lemma: "خَلِيجُ نِيُويُورْك الأَدْنَى"
      generation_method: tarkib
      justification: "تحديد للجزء الجنوبي من الخليج (Lower Bay)."
    - lemma: "جَوْن نِيُويُورْك"
      generation_method: tarkib
      justification: "استخدام 'جون' كمرادف تقني لـ 'خليج' في بعض السياقات الجغرافية."

stage2_evidence:
  per_lemma:
    - lemma: "خليج نيويورك"
      confirm:
        - text: "«نيويورك... تقع على قمة هرم المدن العالمية. رواق ضفاف نهر / رواق متشاطئ»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ. وَخَلِيجَا النَّهْرِ أَوِ الْبَحْرِ: جَنَاحَاهُ.»"
          source: "مقاييس اللغة"
          addition: "يوضح الدلالة اللغوية لكلمة 'خليج' كجناح من البحر أو النهر."
    - lemma: "خَلِيج نِيُويُورْك"
      confirm:
        - text: "«الخَلِيج: شَرْمٌ من البحر يمتدُّ في البَرّ.»"
          source: "المعجم الوسيط"
    - lemma: "جَوْن نِيُويُورْك"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خليج نيويورك"
      decision: confirmed
      decision_reason: "الاسم الجغرافي القياسي والمعتمد عالمياً لهذا الموقع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ نِيُويُورْك"
    - lemma: "خَلِيج نِيُويُورْك"
      source: stage1
      decision: confirmed
      decision_reason: "هو نفسه اللمة الموجودة مع إضافة التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions: []

