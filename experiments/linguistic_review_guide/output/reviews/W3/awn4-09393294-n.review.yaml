    authored:
      - type: encyclopedic
        text: "خَلِيجٌ بَحْرِيٌّ يَقَعُ فِي شَمَالِ الْمُحِيطِ الأَطْلَسِيِّ عِنْدَ مَصَبِّ نَهْرِ هِدْسُون، يَتَكَوَّنُ مِنْ جُزْأَيْنِ رَئِيسِيَّيْنِ (الأَعْلَى وَالأَدْنَى) وَيُعَدُّ مِنْ أَهَمِّ الْمَرَافِئِ الطَّبِيعِيَّةِ فِي الْعَالَمِ."
