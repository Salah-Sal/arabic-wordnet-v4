# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13871493-n (sixtieth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «الستون» مخزّنة بدون تشكيل، والصواب «السِّتُّونَ» بتشديد السين والتاء"
      - "المجموعة تحتوي لمّة واحدة فقط، وهو مقبول للأعداد الترتيبية التي ليس لها صيغة بديلة في العربية"
    observations: >
      المفهوم هو العدد الترتيبي «السِّتُّون» الدالّ على المركز ٦٠ في سلسلة معدودة.
      في العربية، الأعداد الترتيبية من أحد عشر فصاعداً تُصاغ باستعمال العدد الأصلي
      مسبوقاً بـ«ال» التعريف، فلا توجد صيغة ترتيبية مستقلة كما في الأعداد من واحد إلى عشرة
      (أوّل، ثانٍ، ثالث...). لذا فإنّ «السِّتُّونَ» هي الصيغة الوحيدة الصحيحة نحوياً.
      التعريف الحالي ترجمة حرفية مقبولة لكنّها تحتاج تحسيناً أسلوبياً.
  blind_candidates:
    - lemma: "السِّتُّونَ"
      generation_method: ishtiqaq
      justification: >
        العدد الترتيبي لستين، يُصاغ بإدخال «ال» على العدد الأصلي «سِتُّونَ» المشتق
        من الجذر «س ت ت» (أصله «س د س»). هذه هي الصيغة القياسية الوحيدة في العربية
        للترتيب فوق العشرة.
    - lemma: "سِتِّينِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى «سِتِّين» على وزن فِعِّيلِيّ، تدلّ على ما يتعلق بالعدد ستين.
        لكنّها تدلّ على النسبة لا على الترتيب، فهي أقرب إلى معنى «sexagesimal/sexagenary».
    - lemma: "السِّتُّونِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى «السِّتُّون» بإضافة ياء النسبة. تُستعمل صفةً للدلالة على
        ما يتصل بالعدد ستين (كالنظام الستوني). لا تصلح اسماً ترتيبياً مستقلاً.
    - lemma: "الْمَرْتَبَة السِّتُّونَ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «المرتبة» و«الستون»، يفيد الموضع الستين في سلسلة.
        لكنّه عبارة وصفية حرّة وليس مصطلحاً مسكوكاً، فيُخفق في اختبار السكّ
        (يمكن إبدال «المرتبة» بـ«الدرجة» أو «المنزلة»).

stage2_evidence:
  per_lemma:
    - lemma: "الستون"
      confirm:
        - text: "«(1) السِّتّون (2) جزء من ستّين.»"
          source: "المورد الحديث (2008)"
        - text: "«(1) سِتّون (2) pl.: السِّتّونات؛ السِّتينات: العقد السّابع من العمر أو القرن.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) «أ», سِتّونيّ: «ب» ذو علاقة بالرقم ستين. «ج» في الستّينات [أو في العقد السابع من العمر] (2) السِّتونيّ؛ شخص ستّونيّ: شخص في العقد السابع من العمر [أي في ما بين الستين والتاسعة والستين].»"
          source: "المورد الحديث (2008)"
          addition: "التفريق بين الترتيبي «السِّتُّون» والنِّسبي «سِتُّونِيّ» الدالّ على الانتماء إلى عقد الستينات"
    - lemma: "سِتِّينِيّ"
      contradicts:
        - text: "«(1) سِتّونيّ: ذو علاقة بالرقم ستين أو مَبْنِيّ عليه (2) الكَسْر السِّتّونيّ (ر).»"
          source: "المورد الحديث (2008)"
          conflict: "الدلالة نِسبية (sexagesimal) لا ترتيبية، فلا يصلح للدلالة على المركز ٦٠"
    - lemma: "السِّتُّونِيّ"
      confirm:
        - text: "«نظام(ال...) السّتوني — منسوب إلى الرقم ستين»"
          source: "مسرد الجغرافيا والتاريخ، ALECSO"
      contradicts:
        - text: "«(1) سِتّونيّ: ذو علاقة بالرقم ستين أو مَبْنِيّ عليه»"
          source: "المورد الحديث (2008)"
          conflict: "يدلّ على النسبة إلى الستين (صفة) لا على الموضع الترتيبي (اسم)"
    - lemma: "الْمَرْتَبَة السِّتُّونَ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "السِّتُّونَ"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة لغوياً ومؤيَّدة بالمورد الحديث الذي يوردها ترجمةً لـ sixtieth.
        الأعداد الترتيبية لألفاظ العقود في العربية تُصاغ بإدخال «ال» على العدد الأصلي.
        تحتاج تصحيح التشكيل من «الستون» إلى «السِّتُّونَ».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "السِّتُّونَ"

    - lemma: "سِتِّينِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        دلالتها نِسبية (ما يتعلق بالعدد ستين أو المبني عليه) لا ترتيبية.
        المورد الحديث يوردها بمعنى sexagesimal/sexagenary لا sixtieth.
        لا تصلح للدلالة على المركز ٦٠ في سلسلة.

    - lemma: "السِّتُّونِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        صفة نسبية تدلّ على الانتماء إلى نظام الستين (كالنظام الستوني في الجغرافيا)
        ولا تدلّ على الموضع الترتيبي. الأدلة المعجمية تؤكد أنّها صفة لا اسم ترتيبي.

    - lemma: "الْمَرْتَبَة السِّتُّونَ"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرّة وليست مصطلحاً مسكوكاً. تُخفق في اختبار السكّ:
        يمكن إبدال «المرتبة» بـ«الدرجة» أو «المنزلة» مع بقاء المعنى.
        لم تُوجد لها شواهد معجمية بوصفها وحدة ثابتة.

