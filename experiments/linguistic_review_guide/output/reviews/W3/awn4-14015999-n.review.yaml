# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14015999-n
# autonomy / liberty — الاستقلالية / الحكم الذاتي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي ترجمة حرفية ثقيلة من الإنجليزية؛ عبارة «الحصانة من الممارسة التعسفية للسلطة» غير طبيعية في الأسلوب المعجمي العربي"
      - "اللمّة «استقلالية» مشتقة من «الاستقلال» الوارد في التعريف نفسه، مما قد يثير إشكال الدوران المعجمي"
      - "المفهوم يحتاج تمييزاً دقيقاً عن المجموعة الأعمّ (الاستقلال) التي هي فوقه مباشرة في الشبكة"
    observations: "المجموعة تعبّر عن مفهوم سياسي-قانوني راسخ في الثقافة العربية المعاصرة، وله مصطلحات مسكوكة واضحة. الفرق بين هذه المجموعة وبين المجموعة الأعمّ (استقلال) هو التركيز على الحصانة من التعسف والحكم الذاتي تحديداً، لا مطلق الاستقلال. اللمّتان الموجودتان تغطيان المفهوم جيداً: «استقلالية» كمصطلح مجرد، و«حكم ذاتي» كمركب وصفي سياسي."

  blind_candidates:
    - lemma: "حُكْم ذَاتِيّ"
      generation_method: tarkib
      justification: "مركب وصفي مسكوك في المعجمات القانونية والسياسية العربية، يدلّ على نظام الحكم الذي يتمتّع فيه الكيان بإدارة شؤونه بنفسه"
    - lemma: "حُرِّيَّة"
      generation_method: ishtiqaq
      justification: "من جذر «حرر» على وزن فُعّيلة (مصدر صناعي)، يدلّ على حالة التحرّر من القيود والسلطة التعسفية"
    - lemma: "سِيَادَة"
      generation_method: majaz
      justification: "أصلها من «سود» بمعنى الزعامة والتملّك، توسّعت مجازاً لتشمل حقّ الكيان في حكم نفسه دون تبعية"
    - lemma: "ذَاتِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «ذات»، يدلّ على الاكتفاء بالنفس والاستقلال في اتخاذ القرار"


stage2_evidence:
  per_lemma:
    - lemma: "اسْتِقْلَالِيَّة"
      confirm:
        - text: "«اسْتِقْلاَلِيَّةٌ — autonomy / autonomie»"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020)"
        - text: "«استقلالية — Autonome / Autonome — عند أندريه مارتني (1965)، ميزة بعض المركبات اللغوية التي ترد في أماكن مختلفة من الجملة وتحتفظ بدورها دون أن تكون مقيدة بمكان معين»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«الإستقلالية الوظيفية — functional independence»"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "المصطلح يُستخدم في سياقات تقنية متعددة بمعنى الاستقلال الوظيفي"

    - lemma: "حُكْم ذَاتِيّ"
      confirm:
        - text: "«استقلال ذاتيّ، حُكْم ذاتيّ — autonomy; self-government / autonomie»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«البَرْغ: مدينة أسكتلندية ذات حكم ذاتيّ»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«تحكم ذاتي — Autonomy»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "صيغة بديلة «تحكم ذاتي» تُستخدم في السياق التقني"

    - lemma: "حُرِّيَّة"
      confirm:
        - text: "«الخلوص من الشوائب أو الرق أو اللُّؤم كونُ الشَّعب أو الرجل حُرًّا (في الاقتصاد): مذهب اقتصادى يرمى إلى إعفاء التجارة الدولية من القيود والرسوم»"
          source: "المعجم الوسيط"
        - text: "«حرية — liberty / liberté»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
      contradicts:
        - text: "«ضد الرق. يقال: إنه لحر يبين الحريّة (freedom): هي تمتع الإنسان باستقلال الإرادة والقدرة على تنفيذ ما يراه صائبا ويستطيع تحمل مسؤوليته»"
          source: "المعجم الكبير"
          conflict: "التعريف يركّز على الحرية الفردية العامة واستقلال الإرادة، لا على الحصانة من تعسف السلطة تحديداً"
      expands:
        - text: "«الحرية: في اصطلاح أهل الحقيقة: الخروج عن رق الكائنات وقطع جميع العلائق والأغيار»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "دلالة صوفية واسعة تتجاوز المعنى السياسي"

    - lemma: "سِيَادَة"
      evidence_status: "no_material_found"

    - lemma: "ذَاتِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اسْتِقْلَالِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مسكوك مُثبت في معجمات ALECSO المتخصصة بمعنى autonomy، ومستعمل في سياقات تربوية ولسانية وتقنية. المصدر الصناعي على وزن استفعالية يناسب الدلالة على حالة مجردة دائمة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مجرّد يدلّ على صفة الاستقلال بوصفها سمة مؤسسية أو سياسية ثابتة، أقرب إلى الوصف النظري والأكاديمي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِقْلَالِيَّة"

    - lemma: "حُكْم ذَاتِيّ"
      decision: confirmed
      decision_reason: "مركب وصفي مسكوك في المعجم الموحد لمصطلحات القانون (2017) كمرادف لـ autonomy وself-government. مصطلح سياسي راسخ في الاستعمال العربي المعاصر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "مركب وصفي يدلّ على نظام حكم محلّي ضمن كيان سياسي أكبر، أقرب إلى الوصف العملي والتطبيقي للمفهوم"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُكْم ذَاتِيّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "حُرِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "حُرِّيَّة أعمّ وأشمل من المفهوم المقصود؛ فهي تشمل التحرر من الرق والعبودية والقيود عموماً، بينما المجموعة الترادفية تختصّ بالحصانة من تعسف السلطة والاستقلال السياسي تحديداً. كما أنّ «حرية» على الأرجح مربوطة بمجموعة ترادفية أخرى أعلى في التسلسل الهرمي (freedom)."
      evidence_assessment:
        case: mixed

    - lemma: "سِيَادَة"
      source: stage1
      decision: removed
      decision_reason: "السيادة تدلّ على السلطة العليا والحكم المطلق (sovereignty)، وليست مرادفاً للاستقلالية أو الحكم الذاتي. المفهوم مختلف: السيادة حقّ الدولة في الحكم الأعلى، أما الاستقلالية فهي الحصانة من التعسّف وحقّ إدارة الشؤون ذاتياً."
      evidence_assessment:
        case: no_material

    - lemma: "ذَاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: "ذاتية بمعنى الاستقلال ليست مصطلحاً معجمياً ثابتاً في السياق السياسي أو القانوني، ولم تُعثر على شواهد معجمية تدعم هذا الاستعمال. المصطلح يُستخدم عادةً بمعنى الأنانية (subjectivism) أو الذاتية الفلسفية."
      evidence_assessment:
        case: no_material


