      entry_id: "{auto}"
      roots:
        - word: "لاعب"
          root: "لعب"
          maqayis_quote: "«اللَّامُ وَالْعَيْنُ وَالْبَاءُ كَلِمَتَانِ مِنْهُمَا يَتَفَرَّعُ كَلِمَاتٌ. إِحْدَاهُمَا اللَّعِبُ مَعْرُوفٌ. وَالتِّلْعَابَةُ: الْكَثِيرُ اللَّعِبِ. وَالْمَلْعَبُ: مَكَانُ اللَّعِبِ.»"
        - word: "التشكيلة"
          root: "شكل"
          maqayis_quote: "«الشِّينُ وَالْكَافُ وَاللَّامُ مُعْظَمُ بَابِهِ الْمُمَاثَلَةُ. تَقُولُ: هَذَا شَِكْلُ هَذَا، أَيْ مِثْلُهُ. وَمِنْ ذَلِكَ يُقَالُ أَمْرٌ مُشْكِلٌ، كَمَا يُقَالُ أَمْرٌ مُشْتَبِهٌ.»"

  per_sense:
