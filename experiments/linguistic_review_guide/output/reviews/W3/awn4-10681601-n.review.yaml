      sense_id: "{auto}"
      nuance: >-
        يتمايز عن الأب المباشر «لاعب / مشارك» بتقييد الانتماء الرسمي للتشكيلة
        المُعلَنة، لا بالمشاركة الفعلية؛ فالعضو في التشكيلة قد يبقى على مقاعد
        الاحتياط طوال الموسم ومع ذلك يُعدّ «لاعباً في التشكيلة» طالما هو
        مُدرَج في القائمة الرسمية للفريق.
