# ── المرحلة ١: المراجعة والتوليد (قراءة الملف المُقنَّع أولاً) ─────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية «لاعب في التشكيلة» عبارة وصفية حرة وليست وحدة معجمية ثابتة — تفشل اختبار السكّ (يمكن إبدال «لاعب» بـ«عضو» أو «فرد» فتبقى الجملة صالحة كوصف)"
      - "الاسم دائري جزئياً: يكرر «التشكيلة» الواردة في التعريف نفسه، ويتضمن «لاعب» الوارد في الأب المباشر"
      - "غياب التشكيل الكامل على اللمّة الموجودة"
      - "التعريف «عضو في تشكيلة الفريق» مُختزَل جداً ولا يحوي جنساً قريباً واضحاً"
    observations: >-
      المصطلح الإنجليزي «stringer» في السياق الرياضي يدلّ على لاعب مُدرَج ضمن
      التشكيلة الرسمية لفريق ما بصرف النظر عن مشاركته الفعلية، وهو يُرتَّب بحسب
      مرتبته في التشكيلة (first-stringer / second-stringer). المعجم «المورد الحديث»
      يُعرّفه بـ«شخص مُعْتَبَرٌ ذا مرتبةٍ معيَّنة من الامتياز أو الفعّاليّة».
      العربية تميل إلى التعبير عن هذا المفهوم بعبارة مركّبة لا بمفرد اصطلاحي
      راسخ، مما يجعل المجموعة أقرب إلى فئة «phraset» ثقافياً. جذر «ردف» يحمل
      في التراث معنى التعاقب والخلافة والاحتياط وهو أقرب المداخل العربية تراثياً.

  blind_candidates:
    - lemma: "رَدِيفٌ"
      generation_method: majaz
      justification: >-
        من ردف: «الذي يتبع ويخلف». في التراث «أرداف الملوك: الذين كانوا يخلفون
        الملوك». استعارة وظيفية: الرديف في الفريق هو من يأتي بعد الأساسيين
        ويحلّ محلّهم، كما أن الوسيط يورد معنى عسكرياً مستحدثاً «من يُسرَّح
        من الجيش العامل ليكون مدداً في التعبئة العامة» — وهو موازٍ وظيفياً
        للاعب الاحتياطي في تشكيلة الفريق.
    - lemma: "مُصَطَفٌّ"
      generation_method: ishtiqaq
      justification: >-
        وزن مُفْتَعِل من جذر ص-ف-ف (افتعال)، بمعنى «من انتظم في صفّ أو تشكيل».
        الوزن مناسب للدلالة على الانتماء إلى تنظيم جماعي (التشكيلة = الصفوف
        المنظَّمة). يجتنب تكرار كلمتَي «لاعب» و«تشكيلة».
    - lemma: "عُضْوُ الصَّفِّ"
      generation_method: tarkib
      justification: >-
        مركّب إضافي: عضو + الصف، حيث «الصف» يدلّ على التشكيل المنظَّم في
        السياق الرياضي. أكثر إيجازاً من «لاعب في التشكيلة»، ويتجنّب الدوران
        مع التعريف.
    - lemma: "مُصَافٌّ"
      generation_method: ishtiqaq
      justification: >-
        وزن مُفَاعِل من صافَّ (المفاعلة)، بمعنى «من يقف جنباً إلى جنب مع
        غيره في تشكيلة منظَّمة». الوزن يناسب دلالة الاشتراك والتوافق في
        الصفوف، كما في تشكيلة الفريق.


