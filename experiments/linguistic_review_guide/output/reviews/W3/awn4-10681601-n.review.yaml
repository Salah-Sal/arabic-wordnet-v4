# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "لَاعِبٌ فِي التَّشْكِيلَةِ"
      decision: confirmed
      decision_reason: >-
        اللمّة موجودة في AWN وهي المصطلح الوحيد للمجموعة، ولا يوجد مرادف عربي
        أحادي راسخ يُغني عنها. مع ضعفها المعجمي (عدم الثبات، الدوران الجزئي)
        إلا أن حذفها يُفضي إلى فراغ معجمي كامل في المجموعة. تُقبَل مع تصحيح
        التشكيل وتوثيق طبيعتها العبارية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      morphological_check: >-
        العبارة تتكوّن من اسم فاعل «لَاعِب» + حرف جر «في» + اسم معرّف «التَّشْكِيلَة».
        ليست إضافةً صرفة ولا وصفاً نعتياً بالمعنى الدقيق، بل شبه جملة جرية.
        غير أن هذا البناء مألوف في المصطلحات العربية الحديثة.
      fixedness_test: >-
        يمكن إبدال «لاعب» بـ«عضو» أو «فرد» وتبقى العبارة وصفاً صالحاً —
        مما يدلّ على أنها ليست وحدة معجمية مُحكمة. غير أن «لاعب في التشكيلة»
        أكثر تداولاً في الصحافة الرياضية العربية من «عضو التشكيلة».
      nuance_differentiation: >-
        يتمايز عن الأب المباشر «لاعب / مشارك» بتقييد العضوية بإطار التشكيلة
        الرسمية للفريق، لا بالمشاركة الفعلية في المباراة؛ فقد يكون اللاعب
        في التشكيلة دون أن يلعب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاعِبٌ فِي التَّشْكِيلَةِ"

    # ── مرشّح المرحلة ١ — رَدِيفٌ ──
    - lemma: "رَدِيفٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم أن «رديف» يحمل معنى الاحتياطي العسكري (محدثة) وأصلاً تراثياً
        في التعاقب والخلافة، إلا أن الشواهد المعجمية لا توثّق استعماله
        في السياق الرياضي تحديداً. فضلاً عن ذلك، يُرجَّح أن «رديف» في
        السياق الرياضي يدلّ على «اللاعب الاحتياطي/البديل» (substitute) لا
        على «العضو في التشكيلة» بوجه عام — وهو مفهوم أضيق من مدلول المجموعة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      borrowing_check: >-
        لفظ عربي أصيل، لا اقتراض. الأصل في «ردف» صحيح وموثَّق في مقاييس اللغة.
      quality_gate: >-
        يعاني من انزياح دلالي غير مُعجمَن في الحقل الرياضي؛ الشيوع في الفصيح
        الرياضي المعاصر ضعيف في هذا المعنى التحديدي.

    # ── مرشّح المرحلة ١ — مُصَطَفٌّ ──
    - lemma: "مُصَطَفٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على أي دليل معجمي في قاعدة البيانات بصيغة «مُصَطَفّ» بالمعنى
        الرياضي. الاشتقاق محكم صرفياً لكنه غير موثَّق معجمياً كوحدة اصطلاحية
        في هذا المعنى.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشّح المرحلة ١ — عُضْوُ الصَّفِّ ──
    - lemma: "عُضْوُ الصَّفِّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على «عضو الصفّ» كمركّب إضافي ثابت في قاعدة البيانات أو
        في الصحافة الرياضية. العبارة تصف الانتماء لصفٍّ لا لتشكيلة رياضية
        محدّدة، مما يُضعف دلالتها في هذا السياق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشّح المرحلة ١ — مُصَافٌّ ──
    - lemma: "مُصَافٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر على «مُصَافّ» كمصطلح رياضي في قاعدة البيانات. الاشتقاق
        قياسي من صافَّ لكنه غير مُعجمَن في هذا الحقل الدلالي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "عضو في تشكيلة الفريق"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي دقيق لكنه مُختزَل لدرجة الإجمال: لا يُميّز بين عضوية
        التشكيلة الرسمية والمشاركة الفعلية في اللعب، ولا يُشير إلى الطابع
        الرياضي المنظَّم. كما أنه يكرر كلمة «تشكيلة» الواردة في اللمّة،
        مما يُوحي بالدوران.
    authored:
      - type: terminological
        text: "لَاعِبٌ مُدْرَجٌ ضِمْنَ الْقَائِمَةِ الرَّسْمِيَّةِ لِفَرِيقٍ رِيَاضِيٍّ، سَوَاءٌ أَشَارَكَ فِي الْمُبَارَيَاتِ أَمْ كَانَ عَلَى قَائِمَةِ الِاحْتِيَاطِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "فِي الرِّيَاضَةِ الْجَمَاعِيَّةِ: كُلُّ لَاعِبٍ مُسَجَّلٍ فِي تَشْكِيلَةِ فَرِيقٍ مَا ضِمْنَ قَائِمَةِ اللَّاعِبِينَ الرَّسْمِيَّةِ (roster)، بِصَرْفِ النَّظَرِ عَنْ تَرْتِيبِهِ أَوَّلِيًّا أَوِ احْتِيَاطِيًّا. يُصْطَلَحُ فِي الإِنْجْلِيزِيَّةِ عَلَى أَعْضَاءِ الدَّرَجَاتِ الْمُخْتَلِفَةِ بـ first-stringer وَsecond-stringer وَمَا إِلَى ذَلِكَ."
