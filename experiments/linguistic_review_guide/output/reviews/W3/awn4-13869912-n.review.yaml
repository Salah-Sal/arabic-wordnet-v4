# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13869912-n (ninth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «التاسع» مخزّنة بدون تشكيل كامل، والصيغة بأل التعريف فقط"
      - "المجموعة تحتوي لمّة واحدة فقط لمفهوم ترتيبي بسيط"
    observations: >
      المجموعة تمثّل مفهوم العدد الترتيبي التاسع بوصفه موضعاً في سلسلة معدودة.
      وهو مفهوم أساسي في العربية يُعبَّر عنه باسم الفاعل من الجذر «تسع» على وزن فاعِل.
      التعريف العربي الحالي واضح لكنه يكرّر اللفظ «التاسع» داخل التعريف ذاته، وهو دور معجمي.
  blind_candidates:
    - lemma: "تَاسِعَة"
      generation_method: ishtiqaq
      justification: "الصيغة المؤنثة للعدد الترتيبي من الجذر تسع على وزن فاعِلة، تُستعمل عند الإشارة إلى مرتبة مؤنثة كالساعة أو الحلقة"
    - lemma: "تُسْع"
      generation_method: ishtiqaq
      justification: "من الجذر تسع على وزن فُعْل، يدلّ على الجزء الواحد من تسعة أجزاء، قد يُستعمل بمعنى المرتبة التاسعة مجازاً"
    - lemma: "تُسْعِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى تُسْع بالمصدر الصناعي، صفة تدل على ما يتعلق بالرتبة التاسعة"
    - lemma: "المَنْزِلَة التَّاسِعَة"
      generation_method: tarkib
      justification: "مركب وصفي من المنزلة + التاسعة، يدلّ على الموضع التاسع في ترتيب ما"

stage2_evidence:
  per_lemma:
    - lemma: "التَّاسِع"
      confirm:
        - text: "«التَّاسِع: يَوْم عَاشُورَاء»"
          source: "المعجم الكبير"
        - text: "«(1) التاسع (2) تُسْعيّ: بالغٌ جزءًا من تسعة (3) التاسع من كذا the ninth of May (4) التُّسْع»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التَّاءُ وَالسِّينُ وَالْعَيْنُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ التِّسْعَةُ فِي الْعَدَدِ. تَقُولُ تَسَعْتُ الْقَوْمَ، أَيْ صِرْتُ تَاسِعَهُمْ. وَأَتْسَعْتُ الشَّيْءَ إِذَا كَانَ ثَمَانِيَةً فَأَتْمَمْتُهُ تِسْعَةً.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أن تاسع مشتق من الجذر تسع بمعنى صيرورة القوم تسعة"
    - lemma: "تَاسِعَة"
      confirm:
        - text: "«تاسعة — translation_en: ninth»"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm)"
      expands:
        - text: "«التاسعة: عند أهل الهيئة والمنجّمين هو سدس عشر الثامنة، كما وقع في كتبهم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "استعمال فلكي اصطلاحي خاص بالفلك القديم، لا يناسب المعنى الترتيبي العام"
    - lemma: "تُسْع"
      contradicts:
        - text: "«جُزءٌ من تِسْعَةِ أجزَاء من شَيءٍ مُعَيَّن أو كَمِّيَّة مُعَيَّنَة»"
          source: "المعجم الكبير"
          conflict: "التُّسْع هو الكسر (١/٩) وليس العدد الترتيبي التاسع"
        - text: "«(التسع) جُزْء من تِسْعَة أَجزَاء (ج) أتساع»"
          source: "المعجم الوسيط"
          conflict: "التعريف صريح في أنه الكسر لا الترتيب"
    - lemma: "تُسْعِيّ"
      evidence_status: "no_material_found"
    - lemma: "المَنْزِلَة التَّاسِعَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "التَّاسِع"
      decision: confirmed
      decision_reason: >
        العدد الترتيبي الأصيل من الجذر تسع على وزن فاعِل، مثبت في المعاجم الكلاسيكية والحديثة
        بمعنى المرتبة التاسعة. يحتاج تصحيح التشكيل من «التاسع» إلى «التَّاسِع».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "التَّاسِع"

    - lemma: "تَاسِعَة"
      source: stage1
      decision: removed
      decision_reason: >
        هي الصيغة المؤنثة للعدد الترتيبي نفسه، وليست مفهوماً مستقلاً عن التاسع.
        في الشبكة الدلالية تكفي اللمّة المذكرة التي تمثّل المفهوم الترتيبي العام.
        الاستعمال الفلكي عند التهانوي مفهوم مختلف تماماً.

    - lemma: "تُسْع"
      source: stage1
      decision: removed
      decision_reason: >
        التُّسْع بضمّ التاء يدلّ على الكسر (جزء من تسعة أجزاء) لا على المرتبة الترتيبية.
        المعاجم متّفقة على هذا التمييز. المفهوم مختلف ويستحق مجموعة ترادفية مستقلة.

    - lemma: "تُسْعِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا سند معجمي لهذه النسبة، وهي صفة لا اسم، ولا تناسب مفهوم المرتبة الترتيبية.

    - lemma: "المَنْزِلَة التَّاسِعَة"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة وليست مصطلحاً مسكوكاً. يمكن إبدال «المنزلة» بـ«الرتبة» أو «الدرجة»
        مع بقاء المعنى، مما يدل على أنها ليست وحدة معجمية ثابتة (فشل اختبار السكّ).

stage4_content:
  definition:
    current: "المركز التاسع في سلسلة معدودة من الأشياء"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يكرّر اللفظ «التاسع» في تعريف المجموعة ذاتها وهو دور معجمي.
        كما أن عبارة «من الأشياء» فضفاضة. يُستحسن تعريف لا يستعمل المُعرَّف.
    authored:
      - type: linguistic
        text: "ما يأتي بعد الثامن مباشرة في سلسلة ترتيبية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "ما يأتي بعد الثامن مباشرة في سلسلة ترتيبية"

  examples:
    per_lemma:
      - lemma: "التَّاسِع"
        examples:
          - text: "احتلّ الفريقُ المركزَ التاسعَ في بطولة الدوري هذا الموسم."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "احتلّ الفريقُ المركزَ التاسعَ في بطولة الدوري هذا الموسم."

