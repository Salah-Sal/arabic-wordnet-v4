# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "صاحب نكتة عبارةٌ وصفية حرة لا ترقى إلى مستوى المصطلح المعجمي المسكوك؛ يمكن استبدال
        'نكتة' بـ'طرفة' أو 'دعابة' دون أن يفسد التعبير وصفاً، مما يُخفق في اختبار التثبيت المعجمي."
      - "خفيف الظل تعبير مركب ذو حضور واسع في العربية المعاصرة والعامية، لكنه يفتقر إلى توثيق
        كلاسيكي مباشر بهذه الصيغة؛ الشائع في التراث هو 'خفيف الروح' لا 'خفيف الظل'."
      - "ظريف كلمة متعددة الدلالات في التراث (البراعة والذكاء، وكذلك اللطافة الجسدية والرشاقة)؛
        المجموعة لا توثّق أي تحديد دلالي يفصلها عن هذه المعاني المتداخلة."
      - "المجموعة تخلو من لمّة منفردة على صيغة فَعَّال (نكّات، هزّال) التي تُعدّ الصيغة الأنسب
        لمبالغة الفاعلية في العربية."
    observations: >
      تتضمن المجموعة ثلاث لمّات تتوزع بين المصطلح المنفرد (ظريف) والعبارتين المركبتين
      (خفيف الظل، صاحب نكتة). التعريف العربي الحالي «شخص ذكي ومسلّي يلقي النكات»
      مفهومٌ لكنه مُجمَل؛ إذ يقتصر على التعريف بالفعل (يلقي النكات) دون تحديد الجنس
      القريب بكفاية، كما يُهمل ملكة سرعة البديهة وحدّة الذكاء التي هي جوهر المفهوم.
      يُلاحَظ غياب التشكيل الكامل على اللمّات الثلاث.

  blind_candidates:
    - lemma: "نَكَّاتٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن-ك-ت على وزن فَعَّال للمبالغة والكثرة؛ الوزن المنتج يُفيد
        كثرة الفعل واعتياده، فالنكّات هو الكثير التنكيت الدائم إيراد النكات.
        الاشتقاق مستقيم صرفياً ومستوفٍ للدلالة المطلوبة.

    - lemma: "مُمَلِّحٌ"
      generation_method: majaz
      justification: >
        مجاز من «ملَّح الكلامَ» أي أضاف إليه ملحاً من الطرافة والظرف؛
        المُمَلِّح هو من يُضفي على حديثه بهجةً وطرافة كما يُحسّن المِلحُ
        طعمَ الطعام. صيغة اسم الفاعل مُفَعِّل لمن يمارس فعل التمليح.

    - lemma: "هَزَّالٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ه-ز-ل على وزن فَعَّال؛ الهزل نقيض الجِدّ، والهزّال هو
        الكثير الهزل الميّال إلى المزاح والتندّر. الوزن فَعَّال مطّرد
        للكثرة والمبالغة في العربية.

    - lemma: "فَاكِهٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر ف-ك-ه على وزن فَاعِل؛ يشتق من الفكاهة (الطرافة والمزاح)
        فالفاكِه هو صاحب الفكاهة ومن اتّصف بها طبعاً وعادةً، كما يُقال
        «رجل فكِه» بمعنى ضحّاك مزّاح.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "خفيف الظل"
      expands:
        - text: "«هو خفيف الروح: ظريف؛ خفيف القلب: ذكيٌّ»"
          source: "المعجم الوسيط (OCR)"
          addition: >
            يثبت المعجم الوسيط أن صيغة «خفيف + [عضو]» مستعملة لوصف الظريف
            الذكي، وإن كانت الصيغة المُقيَّدة فيه هي «خفيف الروح» لا «خفيف
            الظل»، مما يشير إلى أن «خفيف الظل» تطور معاصر أو تنوّع إقليمي
            للعبارة ذاتها.
        - text: "«يُقال هو خفيف الرُّوح ظريف وخفيف القَلْب ذكي وخفيف ذَات اليَد فقير قليل المال»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          addition: >
            يوضح أن نمط «خفيف + [X]» عبارة اصطلاحية لوصف الشخص، وظريف
            هو المقابل المعجمي المباشر لـ«خفيف الروح».

    - lemma: "صاحب نكتة"
      evidence_status: "no_material_found"

    - lemma: "ظريف"
      confirm:
        - text: "«مَنْ يَتَّصِفُ بسرعةِ البَدِيهَةِ، والقدرةِ على إِثارة البهجة والتَّرفيهِ عن النَّفْس»"
          source: "المعجم الكبير (OCR)"
        - text: "«الظريف: شخص منصرفٌ إلى الفكاهة أو معروفٌ بها»"
          source: "المورد الحديث (2008) — ترجمة humorist"
        - text: "«شخصٌ ذو ظرفٍ أو دُعابة»"
          source: "المورد الحديث (2008) — ترجمة card"
      expands:
        - text: "«ليس الظَّريفُ بكاملٍ في ظَرْفِه / حتى يكونَ عن الحرامِ عَفيفا»"
          source: "المعجم الكبير (OCR) — شاهد شعري"
          addition: >
            يكشف الشاهد أن الظرف عند القدماء يشمل البُعد الأخلاقي إلى جانب
            البُعد الفكاهي، مما يُشير إلى سعة دلالة «ظريف» مقارنةً بمجرد
            «يلقي النكات».

    - lemma: "نَكَّاتٌ"
      confirm:
        - text: "«الكثير النَّكْت، الكثير التَّنْكِيت»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(النكات) الكثير النكت والكثير التنكيت»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«المزّاح؛ المُنَكِّت: الكثير المزاح أو التنكيت»"
          source: "المورد الحديث (2008) — ترجمة joker"
      contradicts:
        - text: "«ورجل منكِّت ونكَّات. وفلان نكَّات في الأعراض: طعَّان»"
          source: "أساس البلاغة للزمخشري (Hawramani)"
          conflict: >
            يثبت الزمخشري (ت 538 هـ) أن «نكّات في الأعراض» تعني طعّاناً في
            أعراض الناس بالقول اللاذع، أي الهجّاء المُقذِع لا المُضحِك،
            مما يُبيّن ازدواجية الدلالة: قد تكون النكتة لاذعةً أذيةً لا
            طريفةً مُسلّية.

    - lemma: "مُمَلِّحٌ"
      evidence_status: "no_material_found"

    - lemma: "هَزَّالٌ"
      contradicts:
        - text: "«هُزَال» — مصطلح طبي بيطري وإنساني بمعنى النحول والضمور"
          source: "المعجم الطبي الموحد (2009) + معجم الطب البيطري"
          conflict: >
            «هزال» المسجّل معجمياً هو مصدر هَزَلَ بمعنى نَحَل وضَعُف لا
            بمعنى مَزَح؛ وابن فارس يُصرّح: «الهزل نقيض الجِدّ والهُزال
            خلاف السِّمَن»، مما يعني أن هَزَّالاً (فَعَّال من هزل) غير
            مسكوك بمعنى كثير المزاح وسيُوقع التباساً مع هُزَال (النحول).

    - lemma: "فَاكِهٌ"
      expands:
        - text: "«شخص فكِهٌ جداً»"
          source: "المورد الحديث (2008) — ترجمة comedian"
          addition: >
            يظهر «فكِه» بوصفه صفةً لا اسماً فاعلاً في هذا السياق؛ ولم
            يُعثَر على «فاكِه» بصيغة اسم الفاعل من ف-ك-ه مُستعملاً
            للدلالة على هذا الإنسان في المعاجم المُستعلَمة.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "خفيف الظل"
      decision: confirmed
      decision_reason: >
        تعبير مركب إضافي ثابت الاستعمال في العربية المعاصرة بمعنى الشخص
        الخفيف الدم الطريف الحضور. وإن كانت الصيغة الكلاسيكية الأدق هي
        «خفيف الروح»، فإن «خفيف الظل» قد اكتسب رسوخاً واسعاً في الصحافة
        والأدب المعاصر حتى باتت وحدةً معجمية مستقلة لا يُعدّ أحد مكوّنيها
        قابلاً للاستبدال في هذا المعنى تحديداً. اختبار الاستبدال: لا يُقال
        «خفيف الفيء» أو «ضئيل الظل» بنفس الدلالة، ومن ثمّ فهي وحدة
        معجمية ثابتة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على الخفّة الاجتماعية والأُنس الفطري وحسن الحضور بين الناس؛
        دلالته أشمل من مجرد إلقاء النكات، إذ يعني القدرة على تحسين أجواء
        المجالس وجعل الجلوس مريحاً ومحبباً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَفِيفُ الظِّلِّ"

    - lemma: "صاحب نكتة"
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: يمكن استبدال «نكتة» بـ«طرفة» أو
        «دعابة» أو «نادرة» في نفس البنية التركيبية (صاحب + [X]) دون أن
        يتغير المعنى الوصفي، مما يُثبت أن التعبير عبارة وصفية حرة لا
        مصطلح مسكوك. كذلك لم يُعثَر له على توثيق معجمي بوصفه لمّة ثابتة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ظريف"
      decision: confirmed
      decision_reason: >
        لمّة منفردة عريقة، موثّقة في المعجم الكبير والمعجم الوسيط والمورد
        الحديث بمعنى يطابق المجموعة مباشرةً. الجذر ظ-ر-ف راسخ والاشتقاق
        سليم والوزن فَعِيل مناسب للصفة المشبّهة والاسم. التشكيل غائب في
        البيانات الحالية يستوجب التصحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يحمل إرثاً تراثياً أعمق يشمل البراعة الفكرية والأدبية وحُسن
        المعشر وليس النكتة وحدها؛ الأكثر استعمالاً في الأدب الكلاسيكي
        والحديث معاً، ويُؤثَر على أخواته في السياق الرسمي والأدبي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ظَرِيفٌ"

    - lemma: "نَكَّاتٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثّق في المعجم الوسيط بصيغته الصحيحة (الكثير النكت الكثير التنكيت)
        وفي المورد الحديث كترجمة لـ«joker». الوزن فَعَّال مطّرد للمبالغة
        في صناعة النكت وكثرتها، وهو الأدق في التعبير عن المفهوم المُحدَّد
        لهذه المجموعة. تُوثَّق الازدواجية الدلالية القديمة (طعّان في
        الأعراض) في حقل nuance.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يتمحور حول فعل إيراد النكات تحديداً (الكثير التنكيت)، أضيق دلالةً
        من «ظريف»؛ يُستخدم في السياق اليومي المعاصر للإشارة إلى من اشتُهر
        بإلقاء النكات وكثرة المزاح التلقائي. يُحذَر من الاستعمال الكلاسيكي
        الذي يجعله مرادفاً للهجّاء اللاذع.
      actions:
        - command: create_entry
          params:
            lemma: "نَكَّاتٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُمَلِّحٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على توثيق معجمي مباشر لـ«مُمَلِّح» بمعنى الشخص الطريف.
        وإن كان فعل «ملَّح الكلامَ» مُثبتاً في المعاجم، فإن اسم الفاعل
        «مُمَلِّح» لم يستقر بوصفه اسماً لهذا الإنسان في المعجمية العربية.

    - lemma: "هَزَّالٌ"
      source: stage1
      decision: removed
      decision_reason: >
        يتعارض مع «هُزَال» (مصطلح طبي راسخ يعني النحول والضمور)؛ إدراجه
        في المجموعة سيُوقع لبساً صوتياً ودلالياً مع المصطلح الطبي المعروف.
        فضلاً عن ذلك لم يُوثَّق «هَزَّال» بمعنى كثير الهزل في مصدر معجمي
        موثوق.

    - lemma: "فَاكِهٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوثَّق «فاكِه» بصيغة اسم الفاعل بمعنى «صاحب الفكاهة» في
        المعاجم المُستعلَمة؛ المُوثَّق هو «فكِه» بوصفه صفةً لا اسماً.
        كما أن جذر ف-ك-ه يُحيل أصلاً إلى الفاكهة (الثمر)، مما يُضعف
        الصلة الاشتقاقية الواضحة بالمعنى المطلوب.


