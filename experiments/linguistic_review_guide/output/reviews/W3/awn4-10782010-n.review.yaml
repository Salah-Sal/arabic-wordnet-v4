        يَقُولُونَ: هَذَا وِعَاءُ الشَّيْءِ وَظَرْفُهُ، ثُمَّ يُسَمُّونَ
        الْبَرَاعَةَ ظَرْفًا، وَذَكَاءَ الْقَلْبِ كَذَلِكَ. وَمَعْنَى
        ذَلِكَ أَنَّهُ وِعَاءٌ لِذَلِكَ. وَهُوَ ظَرِيفٌ.»

    - lemma: "نَكَّاتٌ"
      entry_id: "{auto}"
      root: "نكت"
      maqayis_quote: >
        «النُّونُ وَالْكَافُ وَالتَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى
        تَأْثِيرٍ يَسِيرٍ فِي الشَّيْءِ كَالنُّكْتَةِ وَنَحْوِهَا.
        وَنَكَتَ فِي الْأَرْضِ بِقَضِيبِهِ يَنْكُتُ، إِذَا أَثَّرَ فِيهَا.
