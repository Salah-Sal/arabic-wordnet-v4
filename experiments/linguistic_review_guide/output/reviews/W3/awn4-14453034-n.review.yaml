# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14453034-n
# موقع نسبي في سلسلة متدرجة — gradation, step
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «خطوة» دلالتها الأساسية حسية (مسافة ما بين القدمين عند الخطو)، واستعمالها بمعنى الموقع النسبي في سلسلة متدرجة مجازي وغير شائع"
      - "لمّة «مرحلة» تدل أساساً على المسافة بين المنزلين أو القدر المحدد من شيء، وهي أقرب إلى مفهوم الطور الزمني منها إلى الموقع في سلم متدرج"
      - "اللمّات الثلاث بدون تشكيل كامل"
    observations: "المجموعة تعبّر عن مفهوم الموقع النسبي في تراتب أو سلسلة مرتبة. اللمّة الأنسب من بين الموجودات هي «درجة» لأنها تدل في المعاجم على المرقاة والرتبة. أما «خطوة» فدلالتها الأصلية حركية لا ترتيبية، و«مرحلة» تفيد التتابع الزمني أكثر من التراتب القيمي."
  blind_candidates:
    - lemma: "مَرْتَبَة"
      generation_method: ishtiqaq
      justification: "من الجذر «رتب» على وزن مَفْعَلَة، تدل على المنزلة والمكانة في تراتب هرمي، وهي أخت «رتبة» ولكن أكثر شيوعاً في الاستعمال المعاصر للدلالة على الموقع في سلسلة متدرجة"
    - lemma: "مَنْزِلَة"
      generation_method: ishtiqaq
      justification: "من الجذر «نزل» على وزن مَفْعِلَة، تدل على المكانة والمرتبة، وتُستعمل كثيراً بمعنى الموقع النسبي بين الأقران"
    - lemma: "طَوْر"
      generation_method: ishtiqaq
      justification: "من الجذر «طور» بمعنى الحد والمرحلة والصنف، يدل على حالة من حالات الشيء في تتابعه"
    - lemma: "رُتْبَة"
      generation_method: ishtiqaq
      justification: "من الجذر «رتب» على وزن فُعْلَة، تدل على المنزلة والمكانة ودرجة من درجات الشرف، وهي مرادف قريب لدرجة في سياق التراتب"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "خُطْوَة"
      contradicts:
        - text: "«(الخطوة) مَسَافَة مَا بَين الْقَدَمَيْنِ عِنْد الخطو»"
          source: "المعجم الوسيط"
          conflict: "التعريف المعجمي يقصر الدلالة على المسافة الحسية بين القدمين، لا على الموقع في سلسلة متدرجة"
        - text: "«المَرَّةُ الواحِدَةُ من الخَطْو مَسافَةُ ما بَيْنَ القَدَمَيْنِ عندَ الخَطْوِ فى المَشْى»"
          source: "المعجم الكبير"
          conflict: "الدلالة حسية حركية وليست ترتيبية"
      expands:
        - text: "«(فى علم الميكانيكا): المَسافَةُ بَين نُقْطَتَيْنِ مُتَشابِهَتَيْن فى سِنَّتَيْنِ مُتَتَالِيَتَيْن فى اللَّوالِب والحَلَزُوناتِ والتّروس»"
          source: "المعجم الكبير"
          addition: "استعمال تقني للخطوة بمعنى المسافة بين وحدتين متتاليتين، وهو أقرب إلى مفهوم الفجوة بين الدرجات منه إلى الموقع ذاته"

    - lemma: "دَرَجَة"
      confirm:
        - text: "«المِرْقاة الرُّتْبَةُ له عليه دَرَجة: منزلة ورتبة فى الشرف»"
          source: "المعجم الوسيط"
        - text: "«الدرجَة: محركة نحو المنزلة لكن يقال للمنزلة درجة إذا اعتبرت بالصعود دون الامتداد على البسيطة كدرجة السطح والسلم، ويعبر بها عن المنزلة الرفيعة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الدّرجة: [...] في اللغة پايه ومرتبه الدرجات والدرج جمع، ومنه درجة الدواء وهي مرتبة في التأثير»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«عبارة عن قسم من ثلاثمائة وستين قسماً من الفلك إذا قسم عليها»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "استعمال فلكي قديم يؤكد دلالة الوحدة في سلسلة مقسمة"

    - lemma: "مَرْحَلَة"
      confirm:
        - text: "«القَدْرُ المُحَدَّدُ من الشىء. يقال: هذه مرحلةٌ أُولى من البَحْث أو المَشْروع»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الْمسَافَة يقطعهَا السائر فِي نَحْو يَوْم أَو مَا بَين المنزلين»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأصلية مكانية-زمنية (مسافة سفر)، لا ترتيبية في سلسلة قيمية"

    - lemma: "مَرْتَبَة"
      confirm:
        - text: "«الرُّتْبَةُ, وهى المَنْزِلة والمكانة»"
          source: "المعجم الكبير"
        - text: "«الرُّتْبَة والمرقبة وكل مقام شديد وَفِي علم الحساب: الموضع الذي يكون العدد المطلق فيها ذا قيمة خاصة بحسبها»"
          source: "المعجم الوسيط"
      expands:
        - text: "«المراتب في الجبال والصحارى: هي الأعلام التي تُرتَّب فيها العيون والرقباء»"
          source: "المعجم الكبير"
          addition: "الدلالة الأصلية تشمل المواقع المرتبة المتعاقبة"

    - lemma: "مَنْزِلَة"
      confirm:
        - text: "«الدارُ المكانة والمرتبة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الدَّار والمكانة والمرتبة [...] يقال له منزلة عند الأمير: مكانة، وهو رفيع المنازل: المراتب»"
          source: "المعجم الوسيط (الحواشي)"
          addition: "منزلة تُستعمل غالباً للمكانة الاجتماعية أكثر من الموقع في سلسلة مقاسة"

    - lemma: "طَوْر"
      contradicts:
        - text: "«الطَّوْرُ: التَّارَةُ [...] والحد وما كان على حد الشيء أو بحذائه [...] والصنف والنوع والحال والهيئة»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية هي التارة والحد والحال، لا الموقع في سلسلة ترتيبية"
      expands:
        - text: "«المرحلةُ مِن مَراحلِ شيءٍ أو نِظامٍ أو ظاهِرَةٍ»"
          source: "المعجم الكبير"
          addition: "معنى حديث يقترب من مفهوم المجموعة لكنه يفيد التتابع الزمني"

    - lemma: "رُتْبَة"
      confirm:
        - text: "«المنزلة والمكانة, أو المنزلة الرفيعة درجةٌ من درجات الشرف تمنحها الدولة من ترى تكريمه»"
          source: "المعجم الوسيط"
        - text: "«الدرجة من درجات السلم والمنزلة والمكانة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خُطْوَة"
      decision: removed
      decision_reason: "دلالة «خطوة» المعجمية الأساسية هي المسافة الحسية بين القدمين عند المشي، ولا تدل على موقع ثابت في سلسلة متدرجة. الاستعمال المجازي (خطوة إلى الأمام) يفيد التقدم الحركي لا الموقع الترتيبي. لا تجتاز اختبار الاستبدال مع «درجة» في سياق: «هو في الدرجة الثالثة من السلم الوظيفي»."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "دَرَجَة"
      decision: confirmed
      decision_reason: "دلالتها المعجمية الأولى هي المرقاة والرتبة والمنزلة، وهي مطابقة تماماً لمفهوم الموقع النسبي في سلسلة متدرجة. مدعومة بشواهد من المعجم الوسيط والتهانوي والمناوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الموضع المحدد في سلّم مُقاس أو متدرج، وتصلح للسياقات العلمية والعملية (درجة الحرارة، الدرجة الوظيفية)، وهي الأعم والأكثر حياداً بين لمّات المجموعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَرَجَة"

    - lemma: "مَرْحَلَة"
      decision: confirmed
      decision_reason: "المعجم الكبير يعرّفها بـ«القدر المحدد من الشيء» ويمثّل لها بمراحل البحث والمشروع، وهذا يتوافق مع مفهوم الموقع في سلسلة متعاقبة. رغم أن دلالتها الأصلية مكانية-زمنية، فإن استعمالها المعاصر في التراتب المرحلي راسخ."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على قسم زمني أو منطقي في سلسلة متعاقبة، وتفيد التتابع والانتقال من حالة إلى حالة أكثر من الترتيب الرقمي الصرف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَرْحَلَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَرْتَبَة"
      source: stage1
      decision: confirmed
      decision_reason: "المعجم الوسيط والكبير يعرّفانها بالرتبة والمنزلة والمكانة، والمعجم الوسيط يضيف معنى حسابياً (الموضع الذي يكون العدد فيها ذا قيمة خاصة بحسبها)، وهو مطابق لمفهوم الموقع في سلسلة متدرجة. شائعة الاستعمال ومتميزة عن لمّات المجموعة الرتبية الأخرى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على المنزلة في تراتب هرمي تفاضلي، وتحمل ظلالاً من الشرف والتمايز، وتُستعمل كثيراً في السياقات الإدارية والعسكرية"
      actions:
        - command: create_entry
          params:
            lemma: "مَرْتَبَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَنْزِلَة"
      source: stage1
      decision: removed
      decision_reason: "دلالتها على المكانة العامة والمرتبة الاجتماعية تتطابق مع معنى المجموعة الفوقية (المكانة النسبية) أكثر من تطابقها مع هذه المجموعة تحديداً. لا تضيف دلالة التدرج في سلسلة مقاسة."

    - lemma: "طَوْر"
      source: stage1
      decision: removed
      decision_reason: "دلالته المعجمية الأساسية هي التارة والحد والحال، واستعماله الاصطلاحي المعاصر مقصور على معنى «phase» (الطور الكهربائي/الفيزيائي). لا يدل على موقع في سلسلة ترتيبية."

    - lemma: "رُتْبَة"
      source: stage1
      decision: removed
      decision_reason: "هي لمّة في المجموعة الفوقية المباشرة (awn4-14453411-n: درجة، رتبة — المكانة النسبية). إدراجها هنا يخلق تكراراً مع الفوقية ويضعف التمايز الهرمي."

