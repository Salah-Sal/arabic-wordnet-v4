      reason: "التعريف الحالي صحيح في جوهره لكنه مُقتضَب؛ لا يُميّز الشخصَ عن غيره من المخترعين إلا بالتواريخ والتخصص. الأدلة المعجمية (معجم المعلوماتية 2000) تُتيح إثراءه بمعطيات تحديدية: التعداد السكاني 1890، دوره في إرساء نشأة IBM، ونسبة ترميز البيانات إليه. يناسب التعريف الموسوعي لأنه علم شخصي."
