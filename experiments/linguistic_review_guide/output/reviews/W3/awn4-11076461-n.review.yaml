# ── المرحلة ١: المراجعة والتوليد (التوليد الأعمى) ───────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تمثّل علماً على شخص بعينه (مخترع أمريكي من القرن التاسع عشر)؛ اللمّات الصحيحة الوحيدة الممكنة هي تعريبات اسمه — لا مجال للاشتقاق أو المجاز."
      - "اللمّتان الموجودتان (هوليريث، هيرمان هوليريث) تفتقران إلى التشكيل الكامل."
      - "POS مسجَّل كـ n على مستوى المجموعة وهو صحيح وفق تقاليد WordNet، غير أن مدخلَي المعجم ينبغي أن يُصنَّفا proper_noun على مستوى المدخل."
    observations: "هذه المجموعة الترادفية تحتوي على علم شخصي لمخترع أمريكي هو هيرمان هوليريث (1860-1929)، مخترع نظام تسجيل البيانات على البطاقات المثقوبة الذي استُخدم في التعداد السكاني الأمريكي عام 1890، ومهّد الطريق لشركة IBM لاحقاً. في هذا النوع من الأعلام الشخصية لا يصح اشتقاق لفظ عربي خالص، والمنهج الوحيد الصائب هو تعريب الاسم الأجنبي على أفصح صورة صوتية ممكنة مع ضبط التشكيل الكامل."
  blind_candidates:
    - lemma: "هُولِيرِيث"
      generation_method: taarib
      justification: "تعريب مباشر للقب الإنجليزي Hollerith بالاعتماد على القيمة الصوتية الكاملة للمقاطع: Ho-ller-ith → هُو-لِيرِ-يث. هو الاسم المختصر للمخترع الذي يُستخدم في مصطلحات 'ترميز هوليريث' و'آلة هوليريث'."
    - lemma: "هِرْمَان هُولِيرِيث"
      generation_method: taarib
      justification: "تعريب الاسم الكامل Herman Hollerith؛ يُناسب السياقات التاريخية والرسمية حين يُقصد التعريف الكامل بالشخص لا مجرد الإحالة إليه."
    - lemma: "هُولِرِيث"
      generation_method: taarib
      justification: "نسخة تعريبية مضغوطة للقب Hollerith بحذف مقطع -ie- الوسيط (Hol-rith)، تظهر أحياناً في بعض المراجع العربية المختصرة."
    - lemma: "هِرْمَان هُولِرِيث"
      generation_method: taarib
      justification: "الاسم الكامل بالصيغة التعريبية المضغوطة للقب؛ بديل للمرشح الثاني يجمع بين الاسم الأول كاملاً واللقب المختصر."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دفعية: هوليريث / هيرمان هوليريث / هولريث / هرمان هوليريث
#      + المرشحات الأربعة → لا نتائج مباشرة
#   ٢. جسر إنجليزي: Hollerith | Herman Hollerith | punched card | punch card
#      → نتائج من معجم المعلوماتية (2000) والمورد الحديث
#   ٣. FTS عربي: بطاقات مثقوبة / ثقوب / هوليريث → لا نتائج ذات صلة بالشخص
stage2_evidence:
  per_lemma:
    - lemma: "هوليريث"
      expands:
        - text: "«آلةٌ كهرميكانيكيةٌ اخترعها Herman Hollerith في أواخر العقد الأول من القرن التاسع عشر لمعالجة المعطيات المعطاة على شكل ثقوب في مواضع محددة سلفاً على بطاقات. تُغلِق التماساتُ (من خلال الثقوب) الداراتِ الكهربائية، لتسمح للإشارات بالمرور إلى تجهيزات تعداد وجدولة. أسهمتْ هذه الآلةُ بتقليص الزمن المطلوب لإنجاز الإحصائية الرسمية لسكان الولايات المتحدة لعام 1890 إلى الثلث. صَنَّعتْ مثل هذه الآلات في بدايات القرن العشرين شركةُ Hollerith لآلات الجدولة، التي أصبحتْ في آخر الأمر شركةَ الآلات التجارية العالمية IBM.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُؤكِّد هوية هوليريث مخترعاً لنظام البطاقات المثقوبة، ويُوثِّق ارتباطه بالتعداد السكاني عام 1890 ونشأة IBM"
        - text: "«وسيطةُ إدخالٍ حاسوبيةٌ قديمةٌ مصنوعةٌ من ورقٍ متين يخزِّنُ بتّات المعطيات في أعمدةٍ تحوي أشكالاً نمطية لثقوب مثقبة. تسمّى طريقةُ إنشاءِ الأشكال النمطية المستعمَلة لقيم البايتات المختلفة ترميزَ Hollerith.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُؤكِّد نسبة نظام الترميز الأبجدي الرقمي إلى هوليريث، وهو بالضبط ما يصفه تعريف المجموعة بـ'نظام تسجيل المعلومات الأبجدية الرقمية'"

    - lemma: "هيرمان هوليريث"
      expands:
        - text: "«آلةٌ كهرميكانيكيةٌ اخترعها Herman Hollerith في أواخر العقد الأول من القرن التاسع عشر لمعالجة المعطيات المعطاة على شكل ثقوب في مواضع محددة سلفاً على بطاقات...»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُؤكِّد أن الاسم الكامل للمخترع هو Herman Hollerith وأنه صاحب الاختراع المذكور في تعريف المجموعة"

    - lemma: "هُولِيرِيث"
      expands:
        - text: "«آلةٌ كهرميكانيكيةٌ اخترعها Herman Hollerith...»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يدعم صحة التعريب المبني على اللقب Hollerith بوصفه الصيغة المرجعية للمخترع في الأدبيات التقنية العربية"

    - lemma: "هِرْمَان هُولِيرِيث"
      expands:
        - text: "«اخترعها Herman Hollerith...»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "يُثبِّت أن الاسم الكامل الإنجليزي هو Herman Hollerith مما يدعم الصيغة التعريبية هِرْمَان هُولِيرِيث"

    - lemma: "هُولِرِيث"
      evidence_status: "no_material_found"

    - lemma: "هِرْمَان هُولِرِيث"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: هوليريث ──
    - lemma: "هوليريث"
      decision: confirmed
      decision_reason: "اللقب المعرَّب هُولِيرِيث هو الاسم المتداول في الأدبيات التقنية العربية للإشارة إلى هذا المخترع ('ترميز هوليريث'، 'آلة هوليريث'). لم يُعثَر على مدخل معجمي مستقل له لكن الاستخدام التقني المعجمي يُثبِّت صحته. يحتاج إلى إضافة التشكيل الكامل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة المختصرة للاسم (اللقب وحده)؛ أكثر شيوعاً في السياقات التقنية والعلمية كـ'ترميز هُولِيرِيث' و'آلة هُولِيرِيث'"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُولِيرِيث"

    # ── لمّة موجودة: هيرمان هوليريث ──
    - lemma: "هيرمان هوليريث"
      decision: confirmed
      decision_reason: "الاسم الكامل للمخترع (Herman Hollerith) وهو الأدق في التعريف بالشخص في السياقات التاريخية والموسوعية. تعريب الاسم الأول 'هِرْمَان' (لا 'هِيرْمَان') أقرب صوتياً من النطق الأمريكي [ˈhɜːrmən]. يحتاج إلى تصحيح التشكيل وضبط الصيغة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل للمخترع (الاسم الشخصي + اللقب)؛ يُفضَّل في السياقات التاريخية والرسمية والموسوعية حين يكون التعريف بالشخص مقصوداً لذاته"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِرْمَان هُولِيرِيث"

    # ── مرشحات المرحلة ١ ──
    - lemma: "هُولِيرِيث"
      source: stage1
      decision: removed
      decision_reason: "يتطابق مع اللمّة الموجودة هوليريث بعد إضافة التشكيل؛ الإجراء update_lemma على اللمّة الأصلية يُغني عن إنشاء مدخل جديد."

    - lemma: "هِرْمَان هُولِيرِيث"
      source: stage1
      decision: removed
      decision_reason: "يتطابق مع اللمّة الموجودة هيرمان هوليريث بعد تصحيح التشكيل والصيغة؛ الإجراء update_lemma على اللمّة الأصلية يُغني عن مدخل جديد."

    - lemma: "هُولِرِيث"
      source: stage1
      decision: removed
      decision_reason: "صيغة تعريبية مضغوطة أقل دقة صوتية من هُولِيرِيث (تحذف مقطع -ie- دون مسوّغ)؛ لا دليل معجمي عليها، ولا مسوّغ لإضافتها طالما الصيغة المعيارية موجودة."

    - lemma: "هِرْمَان هُولِرِيث"
      source: stage1
      decision: removed
      decision_reason: "يرثُ حكم رفض هُولِرِيث لأنه يجمع الاسم الكامل باللقب المضغوط الأقل دقة؛ الصيغة المعتمدة هي هِرْمَان هُولِيرِيث."


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
