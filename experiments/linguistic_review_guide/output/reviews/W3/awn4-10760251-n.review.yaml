# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «قالب الموازين» مكتوبة بلا تشكيل — يجب تشكيلها: قَالِبُ الْمَوَازِينِ"
      - "اللمّة عبارة مركبة (MWE) لم تُوثَّق كوحدة معجمية ثابتة في معجم مؤلَّف"
      - "«قالب» يُقرأ عادةً بمعنى القالب (المِصبَّة/الكالَب) لا اسم الفاعل من «قَلَب»، مما يُفضي إلى التباس دلالي"
      - "التعريف الحالي ذو بنية ثنائية بفاصلة منقوطة (;) يكرر المعنى دون إضافة — يستحسن صياغته على نهج المعجم الوسيط"
    observations: >
      المجموعة تُعبِّر عن مفهوم «الفائز المُدهش» (upsetter): المتنافس الذي يفوز رغم أن
      الأرجح هزيمتُه، محقِّقاً مفاجأة تُقلب توقعات الجمهور. اللمّة الوحيدة «قالب الموازين»
      مبنية على المجاز الجذري لـ«قلب»: رد الشيء من جهة إلى جهة؛ إذ «قلب الموازين» تعبير
      سائر في العربية بمعنى تغيير الموازين وقلب الحسابات. غير أن «قالب» — اسم الفاعل من
      «قلب» — يُلتبَس شكلاً بـ«قالَب» (المِصبَّة)، فلا يمكن تمييزهما إلا بالتشكيل الذي
      يغيب عن التسجيل الحالي. لم تُعثَر في المصادر المعجمية على «قالب الموازين» كوحدة
      مُدوَّنة ثابتة؛ إلا أن تعبير «مفاجأة الحلبة» ورد في المورد الحديث (2008) بمعنى قريب.

  blind_candidates:
    - lemma: "مُفاجِئٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن مُفَاعِل من الجذر «فجأ». المفاجئ = من يفاجئ الآخرين بفوزه.
        التفعيل المزيد يُفيد المطاوعة الانتقالية: «فاجأهم بنتيجة غير متوقعة».
        إلا أن الصيغة صفة مشبهة أكثر منها اسم ذات ثابت للشخص الفائز فجأةً.
    - lemma: "الْبَاغِتُ"
      generation_method: majaz
      justification: >
        مجاز من «بَغَتَ»: فجأ الشيءُ وباغَتَه. «البَغْت»: الإتيان فجأةً بلا استئذان.
        تحوّل دلالي: من «الذي يباغت الخصومَ» إلى «الذي يفوز على غير توقع».
        الدلالة الأصلية «الإتيان بغتةً» قابلة للإزاحة نحو «الفوز المباغِت».
    - lemma: "قَاهِرُ الْمُفَضَّلِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «قاهر» (اسم فاعل من قهر) + «المفضَّل» (اسم المفعول من فضَّل).
        حرفياً: «من يقهر المرشَّح الأوفر حظًّا». يُحيط بكلا مكوِّنَي المفهوم:
        الهزيمة (قاهر) والمنافس الأوفر حظًّا (المفضَّل). لكنه يخضع لاختبار الاستبدال
        (قاهر ← هازم، ماحق) مما يُضعف سكَّه كمصطلح ثابت.
    - lemma: "الطَّارِئُ"
      generation_method: majaz
      justification: >
        مجاز من «طرأ»: حدثَ فجأةً وبغير توقع. «الطارئ» في المعجم الكبير: «الغريب الحادثُ
        المفاجِئُ». إزاحة دلالية من «القادم على غير توقع» إلى «الفائز على غير توقع».
        المعنى الحركي (القادم من بعيد) يُلامس المعنى المقصود، لكنه لا يُصرِّح بالفوز
        ولا بهزيمة المفضَّل.


