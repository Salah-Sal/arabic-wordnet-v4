            وَاسْتِقَامَةٍ. وَوَزَنْتُ الشَّيْءَ وَزْنًا. [...] وَوَزِينُ الرَّأْيِ:
            مُعْتَدِلُهُ. وَهُوَ رَاجِحُ الْوَزْنِ، إِذَا نَسَبُوهُ إِلَى
            رَجَاحَةِ الرَّأْيِ وَشِدَّةِ الْعَقْلِ.»
          source: "مقاييس اللغة — ابن فارس (ت. 395هـ)"
          addition: >
            «الموازين» في المجاز العربي رمز التقدير والتوقع؛ «قلب الموازين» = عكس
