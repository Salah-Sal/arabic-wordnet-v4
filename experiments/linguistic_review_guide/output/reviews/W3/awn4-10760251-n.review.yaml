# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "قَالِبُ الْمَوَازِينِ"
      decision: confirmed
      decision_reason: >
        المركب مبنيٌّ على أساس اشتقاقي سليم (قالب: اسم فاعل من قلب) وتركيب إضافي
        فصيح (قالب + الموازين). الدلالة المجازية «من يُحوِّل الحسابات ويُبدِّل
        التوقعات» متسقة مع تعريف المجموعة. رغم غياب التوثيق المعجمي المباشر للمركب،
        فالنسيج الدلالي لجذر «قلب» (رد الشيء من جهة إلى جهة) يُسوِّغه. التباس «قالب»
        مع المصبَّة يُعالَج بإلزامية التشكيل. لا توجد أدلة معجمية مناقضة للمركب
        بهذه الدلالة المجازية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      morphology_check: >
        «قَالِب» وزن فَاعِل (اسم فاعل من قلب الثلاثي). «الْمَوَازِينِ» جمع تكسير
        «مِيزَان» (مَفَاعِيل ← مَوَازِين) من الجذر «وزن». المركب مجرور بالإضافة.
        الإشكال: «قالَب» وزن فَاعَل يُقرأ كذلك بمعنى القالب (المصبَّة) — مضادان
        في الضبط، ولا فرق بينهما رسماً في الكتابة العارية.
      loan_check:
        lexical_borrowing: "لا اقتراض"
        blind_literal_translation: "غير قائم"
        calque: "غير قائم"
      quality_gate:
        ittiraad: "وزن فاعل فصيح على التمام، التركيب الإضافي مطَّرد"
        yusr: "التداول محدود نسبياً في المصادر المعاصرة"
        mulaama: "مُلائم ثقافياً — تعبير مجازي ذو إيحاء رياضي وأدبي"
        turaath: "يستند إلى الجذر القرآني «قلب» (قَلَبَ اللهُ قُلُوبَكُمْ)"
        arabiyya: "عربي أصيل"
        ishtiqaaqiyya: "اشتقاقي على أساس جذر ثلاثي فصيح"
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تتمايز عن شقيقتها الأُم «فائز / منتصر»
        (awn4-10802616-n) بتضمُّنها الأثرَ الخاصّ: الفوز رغم كون الخصم هو المُرجَّح،
        أي «قلب الموازين» الانتظارية لدى المشاهدين.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَالِبُ الْمَوَازِينِ"

    - lemma: "مُفاجِئٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «مُفاجِئ» صفة مشبهة (اسم فاعل من فاجأ) تدلّ على صفة الإتيان فجأةً، لا على
        اسم ذات ثابت للفائز المُدهش. يخلو المعجم من تسجيله اسمًا لشخص يفوز على غير
        توقع. لا يجتاز اختبار التثبيت المعجمي كمصطلح منفرد لهذا المفهوم.
      evidence_assessment:
        case: no_material

    - lemma: "الْبَاغِتُ"
      source: stage1
      decision: removed
      decision_reason: >
        «باغت» في المعاجم إما فعل متعدٍّ (باغته = فاجأه) وإما دالٌّ على البغاء في
        الوسيط. اسم الفاعل «البَاغِت» غير مُدوَّن بدلالة «الفائز المُدهش». يُضاف
        إلى ذلك الدلالة السلبية المصاحِبة لـ«باغت» في بعض المعاجم.
      evidence_assessment:
        case: contradicts_only

    - lemma: "قَاهِرُ الْمُفَضَّلِ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ يفشل اختبار السكّ: يُمكن إبدال «قاهر» بـ«هازم» أو «غالب»
        وتبقى العبارة وصفاً صالحاً. لا توجد أدلة معجمية. ليس وحدة معجمية ثابتة.
      evidence_assessment:
        case: no_material

    - lemma: "الطَّارِئُ"
      source: stage1
      decision: removed
      decision_reason: >
        «الطارئ» في المعاجم يعني «الغريب» أو «الحادث المفاجئ» — لا يختص بالفوز
        في مسابقة ولا بهزيمة مفضَّل. الدلالة الحركية (القادم من الخارج فجأةً) تلامس
        المفهوم لكنها لا تُوفيه. إدراجه سيُخلّ بالدقة الدلالية للمجموعة.
      evidence_assessment:
        case: mixed


