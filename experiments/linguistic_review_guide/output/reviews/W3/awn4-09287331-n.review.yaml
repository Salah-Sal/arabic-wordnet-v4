stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي هو ترجمة شبه حرفية للتعريف الإنجليزي ويفتقر للضبط اللغوي."
    observations: "المجموعة تتعلق بمعلم جغرافي محدد (خليج ديلاوير). المصطلح العربي المعتمد يتبع نمط (خليج + الاسم العلم) وهو نمط قياسي في التعريب الجغرافي."
  blind_candidates:
    - lemma: "خَلِيج دِيلَاوِير"
      generation_method: tarkib
      justification: "الترجمة المباشرة والقياسية للمصطلح الجغرافي (Delaware Bay)، حيث 'خَلِيج' هو الجنس القريب."
    - lemma: "جَوْن دِيلَاوِير"
      generation_method: tarkib
      justification: "استخدام 'الجون' كبديل لـ'الخليج' في التسميات المائية، وهو مصطلح تراثي ومعاصر للمداخل البحرية."
    - lemma: "مَصَبّ دِيلَاوِير"
      generation_method: tarkib
      justification: "وصف وظيفي للمكان كونه مَصَبّاً لنهر ديلاوير في المحيط الأطلسي."
    - lemma: "ثَغْر دِيلَاوِير"
      generation_method: tarkib
      justification: "استخدام 'الثغر' للتعبير عن المدخل البحري أو الميناء، وهو مصطلح تراثي فصيح."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيج"
      confirm:
        - text: "«الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ. وَخَلِيجَا النَّهْرِ أَوِ الْبَحْرِ: جَنَاحَاهُ.»"
          source: "مقاييس اللغة"
        - text: "«الخليج: جانِبٌ من البحر يمتدُّ في البَرِّ.»"
          source: "المعجم الوسيط"
    - lemma: "دِيلَاوِير"
      confirm:
        - text: "«ديلاوير: Delaware»"
          source: "المكنز الزراعي متعدد اللغات"

stage3_analysis:
  per_lemma:
    - lemma: "خليج ديلاوير"
      decision: confirmed
      decision_reason: "الاسم الرسمي والمعتمد جغرافياً في اللغة العربية لهذا المعلم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيج دِيلَاوِير"

stage4_content:
  definition:
    current: "مدخل لشمال المحيط الأطلسي؛ يغذيه نهر ديلاوير"
    assessment:
      decision: revise
      reason: "لإضافة التشكيل الكامل وتحسين الصياغة لتكون أكثر جزالة."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ مَائِيٌّ يَقَعُ عَلَى السَّاحِلِ الشَّرْقِيِّ لِلْوِلَايَاتِ الْمُتَّحِدَةِ، يُمَثِّلُ مَصَبَّ نَهْرِ دِيلَاوِير فِي شَمَالِ الْمُحِيطِ الْأَطْلَسِيِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَلِيجٌ مَائِيٌّ يَقَعُ عَلَى السَّاحِلِ الشَّرْقِيِّ لِلْوِلَايَاتِ الْمُتَّحِدَةِ، يُمَثِّلُ مَصَبَّ نَهْرِ دِيلَاوِير فِي شَمَالِ الْمُحِيطِ الْأَطْلَسِيِّ."
  examples:
    per_lemma:
      - lemma: "خَلِيج دِيلَاوِير"
        examples:
          - text: "يُعَدُّ خَلِيجُ دِيلَاوِير مَصَبًّا مَائِيًّا حَيَوِيًّا يُمَثِّلُ حُدوداً بَيْنَ وِلايَتَي دِيلَاوِير وَنِيُوجِيرْسِي."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعَدُّ خَلِيجُ دِيلَاوِير مَصَبًّا مَائِيًّا حَيَوِيًّا يُمَثِّلُ حُدوداً بَيْنَ وِلايَتَي دِيلَاوِير وَنِيُوجِيرْسِي."

stage5_enrichment:
  per_entry:
    - lemma: "خَلِيج دِيلَاوِير"
      entry_id: "{auto}"
      roots:
        - word: "خليج"
          root: "خلج"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ. فَمِنْ ذَلِكَ الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ.»"
        - word: "ديلاوير"
          root: null
  per_sense:
    - lemma: "خَلِيج دِيلَاوِير"
      sense_id: "{auto}"
      nuance: "الاسم العلم الجغرافي المحدد لهذا المعلم المائي."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"خليج","root":"خلج","maqayis":"«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ...»"},{"word":"ديلاوير","root":null}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم العلم الجغرافي المحدد لهذا المعلم المائي.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
