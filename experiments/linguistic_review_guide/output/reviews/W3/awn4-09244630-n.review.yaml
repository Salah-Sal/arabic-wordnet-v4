          params: {entry_id: "{auto}", synset_id: "awn4-09244630-n"}
    - lemma: "خَلِيجُ بِيسْكِين"
      source: stage1
      decision: confirmed
      decision_reason: "نطق بديل شائع للمصطلح في العربية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
