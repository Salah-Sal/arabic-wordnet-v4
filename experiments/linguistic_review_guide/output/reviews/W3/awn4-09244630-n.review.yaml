# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة حرفية ركيكة للتعريف الإنجليزي."
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
    observations: "المجموعة تخص معلماً جغرافياً محدداً (Proper Noun)، والتعامل معها يتطلب الموازنة بين التعريب الصوتي (Transliteration) والمصطلح الجغرافي الوصفي."
  blind_candidates:
    - lemma: "خَلِيجُ بِيسْكَايْن"
      generation_method: tarkib
      justification: "الاسم الشائع والمستقر في الأطالس العربية لهذا المعلم الجغرافي."
    - lemma: "خَلِيجُ بِيسْكِين"
      generation_method: taarib
      justification: "نطق بديل يعتمد على الكسر في المقطع الأخير، مستخدم في بعض المصادر."
    - lemma: "جَوْنُ بِيسْكَايْن"
      generation_method: tarkib
      justification: "استخدام 'جون' (Bay/Cove) لبيان ضيق الخليج وصغر مساحته مقارنة بالخليج الكبير (Gulf)."
    - lemma: "خَلِيجُ بِيصْقِين"
      generation_method: taarib
      justification: "خيار تعريب صوتي بديل يراعي مخارج الحروف العربية الأصلية (الصاد والقاف)."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "خليج بيسكاين"
      evidence_status: "no_material_found"
    - lemma: "جون"
      confirm:
        - text: "«الجَوْنُ: خليج صغير»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
    - lemma: "خليج"
      confirm:
        - text: "«الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ. وَخَلِيجَا النَّهْرِ أَوِ الْبَحْرِ: جَنَاحَاهُ.»"
          source: "مقاييس اللغة لابن فارس"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
