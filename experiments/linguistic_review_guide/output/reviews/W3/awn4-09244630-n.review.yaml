          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09244630-n", definition_index: 0, text: "خَلِيجٌ بَحْرِيٌّ ضَيِّقٌ يَقَعُ فِي الجُزْءِ الجَنُوبِيِّ الشَّرْقِيِّ مِنْ وِلَايَةِ فْلُورِيدَا الأَمْرِيكِيَّةِ، وَيُشَكِّلُ مَدْخَلًا لِلْمُحِيطِ الأَطْلَسِيِّ."}

