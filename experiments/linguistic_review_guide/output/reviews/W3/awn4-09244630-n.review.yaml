          - text: "تُعَدُّ مِنْطَقَةُ خَلِيجِ بِيسْكَايْن فِي فْلُورِيدَا مَوْطِنًا لِلْعَدِيدِ مِنَ الشِّعَابِ المَرْجَانِيَّةِ وَالأَحْيَاءِ المَائِيَّةِ."
