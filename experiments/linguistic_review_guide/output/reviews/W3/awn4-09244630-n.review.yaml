      decision: revise
      reason: "التعريف الحالي ركيك ومترجم آلياً. يحتاج صياغة أكثر دقة وموسوعية."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ بَحْرِيٌّ ضَيِّقٌ يَقَعُ فِي الجُزْءِ الجَنُوبِيِّ الشَّرْقِيِّ مِنْ وِلَايَةِ فْلُورِيدَا الأَمْرِيكِيَّةِ، وَيُشَكِّلُ مَدْخَلًا لِلْمُحِيطِ الأَطْلَسِيِّ."
