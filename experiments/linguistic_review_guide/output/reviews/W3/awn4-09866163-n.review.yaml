# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
# (اللمّة المؤكدة الوحيدة: نَحَّال)
stage5_enrichment:

  per_entry:
    - lemma: "نَحَّال"
      entry_id: "{auto}"
      root: "نحل"
      # مقاييس اللغة لابن فارس (dictionary_id=151، OCR entry النَّحَلَ)
      maqayis_quote: >-
        «النُّونُ وَالْحَاءُ وَاللَّامُ كَلِمَاتٌ ثَلَاثٌ: الْأُولَى تَدُلُّ
        عَلَى دِقَّةٍ وَهُزَالٍ، وَالْأُخْرَى عَلَى عَطَاءٍ، وَالثَّالِثَةُ
        عَلَى ادِّعَاءٍ. فَالثَّانِيَةُ: نَحَلْتُهُ كَذَا، أَيْ أَعْطَيْتُهُ.
        وَالِاسْمُ النُّحْلُ. وَيَقُولُونَ: النُّحْلُ: أَنْ تُعْطِيَ شَيْئًا
        بِلَا اسْتِعْوَاضٍ»

  per_sense:
    - lemma: "نَحَّال"
      sense_id: "{auto}"
      nuance: >-
