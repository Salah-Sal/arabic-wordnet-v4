# ── المرحلة ١: المراجعة والتوليد (قراءة المُقنَّع أولاً) ──────
stage1_review:

  # ① توليد اللمّات المرشحة (قبل الاطلاع على اللمّات الموجودة)
  # المصدر: synset_info_masked.yaml
  # التعريف فقط: «مزارع يربي النحل للحصول على العسل»
  blind_candidates:
    - lemma: "نَحَّال"
      generation_method: ishtiqaq
      justification: >-
        مشتق من جذر (ن ح ل) على وزن فَعَّال الدالّ على الاحتراف والمداومة،
        قياساً على: بَنَّاء، نَجَّار، بَقَّال، جَزَّار. الوزن يُلائم الدلالة
        على المحترف بتربية النحل احترافاً منهجياً.

    - lemma: "مُرَبِّي النَّحْل"
      generation_method: tarkib
      justification: >-
        مركَّب إضافي من اسم الفاعل «مُرَبِّي» ومضافه «النَّحْل». تعبير شائع
        في الكتابة التقنية العربية، مبني على ما تُقرّه مجامع اللغة من قبول
        الوصف الإضافي مصطلحاً حين يُستقرّ استخدامه.

    - lemma: "عَسَّال"
      generation_method: ishtiqaq
      justification: >-
        مشتق من جذر (ع س ل) على وزن فَعَّال، دالٌّ على المختص بالعسل
        إنتاجاً واستثماراً. قياس على: زيَّات، لَبَّان، سَمَّان. وقد يمتد
        المعنى من «مستخرج العسل» إلى من يُربّي النحل للحصول عليه.

    - lemma: "يَعْسُوب"
      generation_method: majaz
      justification: >-
        لفظ تراثي يدلّ أصلاً على ملكة النحل (قائد الخليَّة) وعلى زعيم القوم.
        محاولة إحياء بإزاحة دلالية: من «أمير النحل» إلى «راعي النحل وصاحب
        المنحل». إحياء الألفاظ التراثية أولى من الاشتقاق الجديد.

  # ② التقييم الأولي (بعد قراءة synset_info الكامل)
  assessment:
    concerns:
      - "اللمّتان الموجودتان (نحّال، مربي النحل) مكتوبتان بلا تشكيل؛ والتشكيل الكامل شرط في المخرجات"
      - >-
        لَمَّة «مربي النحل» عبارة وصفية حرة لا تجتاز اختبار السكّ المعجمي:
        يمكن إبدال «مربي» بـ«مُعتني» أو «صاحب» أو «حارس» وتبقى العبارة
        صالحة وصفاً مفهوماً، مما يعني أنها ليست وحدة معجمية ثابتة
      - >-
        «مربي النحل» يرد في المعجمات تعريفاً للفظ «النحّال»، لا مدخلاً
        مستقلاً؛ مما يُرسّخ كونها عبارة تفسيرية لا مصطلحاً مسكوكاً
    observations: >-
      المجموعة تمثّل مفهوماً عربياً أصيلاً ذا تعبير معجمي ثابت هو «النَّحَّال»،
      رسّخته المعجمات الحديثة (الوسيط، المورد الحديث، الطب البيطري) واستخدمته
      ترجمةً لـbeekeeper وapiarist وapiculturist على حدٍّ سواء. الجذر (نحل)
      يحمل في مقاييس اللغة لابن فارس معنى العطاء والمنح—وهو ملائم دلالياً
      لمن يُنتج العسل ويُعطيه. أما «عسّال» فراسخ في دلالة جامع العسل البري
      ومبيعه، و«يعسوب» راسخ في دلالة ملكة النحل، ولا يصلح كلاهما لهذه المجموعة.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المُنفَّذة (٥ استعلامات):
#  ١. مطابقة دفعية لجميع اللمّات (موجودة + مرشحة)
#  ٢. جسر إنجليزي (beekeeper, apiarist, apiculturist)
#  ٣. إثراء بالمعرّف (تعريفات + أمثلة + جموع)
#  ٤. مقاييس اللغة (جذور نحل، عسل)
#  ٥. بحث FTS عربي (نحال، تربية النحل، النحالة)
stage2_evidence:
  per_lemma:

    - lemma: "نحّال"
      confirm:
        - text: "«النَّحَّالُ: مُرَبِّى النَّحل»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR، id=28727)"
        - text: "«(النحال) مربي النَّحْل»"
          source: "المعجم الوسيط — نسخة هوراماني (id=885620)"
        - text: "«مربِّي النحل» — translation_en: beekeeper"
          source: "المعجم الموحد لمصطلحات الطب البيطري 2010 (id=468604)"
        - text: "«النَّحّال: المشتغل بتربية النحل» — translation_en: apiarist"
          source: "المورد الحديث 2008 (id=670717)"
        - text: "«النَّحّال: مُربِّي النَّحل» — translation_en: apiculturist"
          source: "المورد الحديث 2008 (id=670724)"
        - text: "«النَّحّال: مُرَبّي النَّحل» — translation_en: beekeeper"
          source: "المورد الحديث 2008 (id=673184)"
      expands:
        - text: "«نَحَّال: من (ن ح ل) مربي النحل، والكثير العطاء»"
          source: "موسوعة السلطان قابوس لأسماء العرب (id=947626)"
          addition: >-
            يكشف أن «نَحَّال» كان يُستخدم اسماً علماً بمعنى كثير العطاء،
            مما يُغني البعد الدلالي للجذر ويُؤكد ارتباطه بمعنى البذل الوفير
            (العسل والشمع) لا بالنحل وحده

    - lemma: "مربي النحل"
      confirm:
        - text: "«النَّحَّالُ: مُرَبِّى النَّحل»"
          source: "المعجم الوسيط"
        - text: "«النَّحّال: مُربِّي النَّحل»"
          source: "المورد الحديث 2008"
      contradicts:
        - text: "«تربية النحل» — translation_en: apiculture"
          source: "المعجم الموحد لمصطلحات الطب البيطري 2010 (id=403121، 750087)"
          conflict: >-
            «تربية النحل» يرد ترجمةً لـapiculture (النشاط)، لا لـbeekeeper
            (الشخص)؛ مما يُثبت أن «مربي النحل» ليس مصطلحاً معجمياً مستقلاً
            بل وصف حر يُستخدم تعريفاً للفظ «النحّال»

    # ── مرشّحات المرحلة ١ ──
    - lemma: "نَحَّال"
      confirm:
        - text: "«النَّحَّالُ: مُرَبِّى النَّحل»"
          source: "المعجم الوسيط"
        - text: "«نحَّال: مربِّي النحل» — translation_en: beekeeper"
          source: "المعجم الموحد لمصطلحات الطب البيطري 2010"

    - lemma: "مُرَبِّي النَّحْل"
      confirm:
        - text: "«مربِّي النحل» — translation_en: beekeeper"
          source: "المعجم الموحد لمصطلحات الطب البيطري 2010"
      contradicts:
        - text: "«النِّحالة: تربية النَّحل» — translation_en: apiculture"
          source: "المورد الحديث 2008 (id=670723)"
          conflict: >-
            المعجمات تُعالج «مربي النحل» دائماً في سياق تعريف «نحّال»،
            لا كمدخل مستقل؛ مما يُؤكد أنه وصف حر لا وحدة معجمية مسكوكة

    - lemma: "عَسَّال"
      contradicts:
        - text: "«العَسَّالُ: مُستخرجُ العسل من موضعه، بائعُه»"
          source: "المعجم الوسيط (id=18879)"
          conflict: >-
            العَسَّال يدلّ على مستخرج العسل البري ومبيعه، وهو أعمّ من مربي
            النحل؛ إذ قد يجمع العسل من أماكن طبيعية دون تربية النحل
        - text: "«الْعَاسِلُ: صَاحِبُ الْعَسَلِ الَّذِي يَشْتَارَهُ مِنْ مَوْضِعِهِ يَسْتَخْرِجُهُ»"
          source: "مقاييس اللغة لابن فارس (جذر عسل)"
          conflict: "الأصل الدلالي عند ابن فارس يختص بجمع العسل البري (المشتار)، لا بالنحّال المحترف"

    - lemma: "يَعْسُوب"
      contradicts:
        - text: "«اليَعْسُوبُ: ملكة النحل، وهي أنثى... رئيس القوم وكبيرهم ومقدَّمُهُم»"
          source: "المعجم الوسيط (id=18824)"
          conflict: >-
            يعسوب يدلّ على ملكة النحل (داخل الخلية) وعلى زعيم القوم؛
            لا علاقة له بمن يُربّي النحل
        - text: "«أمير النحل»"
          source: "مجمل اللغة لابن فارس (id=109763)"
          conflict: "الدلالة راسخة في القيادة والسيادة لا في الرعاية والتربية"
        - text: >-
            «في ح على: أنا يعسوب المؤمنين والمال يعسوب الكفار أي يلوذ بي
            المؤمنون ويلوذ بالمال الكفار كما يلوذ النحل بمقدمها وسيدها»
          source: "مجمع بحار الأنوار (id=812631)"
          conflict: "الحديث الشريف يُرسّخ معنى الزعامة والتقدم، لا التربية والإدارة"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "نحّال"
      decision: confirmed
      decision_reason: >-
        لَمَّة مُثبتة بنصوص معجمية متعددة حديثة وتراثية، وهي المصطلح المعيار
        لـbeekeeper/apiarist/apiculturist في معجمات المصطلحات العربية الموحدة.
        الوزن الصرفي (فَعَّال) ملائم دلالياً للاحتراف والمداومة. اختبار
        الاستبدال: لا يمكن إبدال «نَحَّال» بلفظ آخر دون خسارة دقيقة.
        اختبار اللهجية: فصيح موثَّق في مصادر معيارية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        النَّحَّال مصطلح مُسكَّك على وزن فَعَّال الدالّ على التخصص المهني؛
        يُفيد الاحتراف وإدارة المناحل، بخلاف «مُرَبِّي النَّحل» الذي هو
        وصف حر يُفيد القيام بفعل التربية دون دلالة على الاحتراف. ويتمايز
        أيضاً عن «عَسَّال» الذي يُفيد جمع العسل البري أو بيعه
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَحَّال"

    - lemma: "مربي النحل"
      decision: removed
      decision_reason: >-
        فشل اختبار السكّ المعجمي: يمكن إبدال «مربي» بـ«مُعتني» أو «صاحب»
        أو «حارس» وتبقى العبارة صالحة وصفاً؛ مما يُثبت أنها عبارة وصفية حرة.
        تظهر في المعجمات حصراً بوصفها تعريفاً للفظ «النحّال»، لا مدخلاً
        مستقلاً. المصطلح المعيار في جميع معجمات المصطلحات التقنية هو «نحّال».
        فضلاً عن ذلك، الإبقاء على تعبير تفسيري في مجموعة ترادفية يُفضي إلى
        ترادف زائف مع المصطلح الأصيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشّحات المرحلة ١ ──

    - lemma: "نَحَّال"
      source: stage1
      decision: removed
      decision_reason: >-
        مطابق للَمَّة الموجودة «نحّال» المؤكدة والمُصحَّحة تشكيلاً أعلاه؛
        لا يستدعي إجراءً إضافياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "مُرَبِّي النَّحْل"
      source: stage1
      decision: removed
      decision_reason: >-
        مطابق للَمَّة الموجودة «مربي النحل» المُقرَّر حذفها لفشلها في اختبار
        السكّ، والتشكيل لا يُغير الحكم على الكيان المعجمي ذاته.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "عَسَّال"
      source: stage1
      decision: removed
      decision_reason: >-
        دلالة «عَسَّال» في المعجمات راسخة في معنى مستخرج العسل البري ومبيعه،
        وهو غير مربي النحل المحترف (النَّحَّال). استخدامه يُوقع في اشتراك
        لفظي واضح: قد يكون العَسَّال لا يُربّي النحل أصلاً.
        فحص اقتراض مفهومي: لا توجد ترجمة حرفية عمياء هنا، بل تحريف دلالي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "يَعْسُوب"
      source: stage1
      decision: removed
      decision_reason: >-
        يعسوب يدلّ في المعجمات على ملكة النحل وزعيم القوم، وهو معنى راسخ
        لا يصلح معه الاستخدام دلالةً على مربي النحل دون إيقاع لبس شديد.
        الإزاحة الدلالية المقترحة بعيدة جداً ولا سند لها في الاستخدام المعاصر.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


