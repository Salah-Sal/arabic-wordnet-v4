# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10784668-n  |  ILI: i94012  |  POS: n
# Definition (EN): a winner by a wide margin
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (فائز ساحق) خالية من التشكيل الكامل"
      - "المجموعة تضمّ لمّة واحدة فقط، وهذا فقر معجمي لمفهوم يقبل عدة تعبيرات"
      - "التعريف 'فائز بفارق كبير' مختصر وشبه دائري؛ لا يُحدد السياق التنافسي ولا درجة الفارق"
    observations: >
      المجموعة تصف مفهوماً تنافسياً محدداً: شخص يفوز بفارق واسع يتجاوز به أقرب منافسيه.
      مقابله الإنجليزي «walloper» نادر حتى في الإنجليزية. اللمّة «فائز ساحق» تركيب وصفي
      متداول في الإعلام العربي لوصف الانتصارات الساحقة والأغلبيات الكبيرة.
      الفارق الجوهري بين هذه المجموعة ومجموعة الأب (فائز/منتصر) هو تخصيص «الفارق الكبير»
      الذي يُعلي المفهوم فوق مجرد الفوز.
  blind_candidates:
    - lemma: "مُكْتَسِح"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل «اكتسح» على وزن مُفْتَعِل، من جذر (ك س ح) بمعنى التنقية
        والإزالة الشاملة. في العربية المعاصرة استقرّ بمعنى الفوز الكاسح الذي لا يُبقي
        للمنافسين فرصة، مما يناسب الشخص الفائز بفارق كبير.
    - lemma: "قَاهِر"
      generation_method: majaz
      justification: >
        اسم فاعل من «قَهَرَ» على وزن فَاعِل، من جذر (ق ه ر) بمعنى الغلبة والعلو.
        مجاز إزاحة دلالية من القهر المادي نحو الفوز الساحق في المنافسة، إحياء للفظ
        كلاسيكي يحمل ظلال القوة والحسم.
    - lemma: "سَبَّاق"
      generation_method: ishtiqaq
      justification: >
        اسم على وزن فَعَّال للمبالغة من جذر (س ب ق). السبّاق: الكثير السبق،
        أي من يتقدم تقدماً ملموساً على الآخرين مما يستلزم فارقاً واضحاً.
    - lemma: "مُتَقَدِّم بِفَارِق"
      generation_method: tarkib
      justification: >
        تركيب إضافي (متقدم + بفارق) يصف من يتصدر المنافسة بتقدم واضح.
        مستعمل في التعليق الرياضي العربي للإشارة إلى الفوز بفارق ملحوظ.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "فَائِزٌ سَاحِقٌ"
      confirm:
        - text: "«(1) ساحق؛ ماحق (2) مُفحِم؛ مُسكِت (3) حاسم» — ترجمة كلمة crushing"
          source: "المورد الحديث (2008)"
        - text: "«(ب) انتصار ساحق — (3) ساحق؛ مُبين a landslide victory — (4) ينتصر انتصاراً ساحقاً» — ترجمة كلمة landslide"
          source: "المورد الحديث (2008)"
        - text: "«فَازَ يَفُوزُ، إِذَا نَجَا، وَهُوَ فَائِزٌ. وَفَازَ بِالْأَمْرِ، إِذَا ذَهَبَ بِهِ وَخَلَصَ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(1) غامِر overwhelming joy (2) ساحق overwhelming majority (3) دامغ an overwhelming evidence» — ترجمة كلمة overwhelming"
          source: "المورد الحديث (2008)"
          addition: >
            يؤكد أن «ساحق» يُستخدم للدلالة على الأغلبية الساحقة والتفوق الطاغي،
            مما يدعم استخدامه وصفاً للفائز بفارق كبير.

    - lemma: "مُكْتَسِح"
      expands:
        - text: >
            «الْكَافُ وَالسِّينُ وَالْحَاءُ لَهُ مَعْنَيَانِ صَحِيحَانِ: أَحَدُهُمَا
            تَنْقِيَةُ الشَّيْءِ، وَالْمَعْنَى الْآخَرُ عَيْبٌ فِي الْخِلْقَةِ.
            فَالْأَوَّلُ الْكَسْحُ. يُقَالُ: كَسَحْتُ الْبَيْتَ، وَكَسَحَتِ الرِّيحُ
            الْأَرْضَ: قَشَرَتْ عَنْهَا التُّرَابَ. وَيُقَالُ: أَغَارُوا عَلَى بَنِي
            فُلَانٍ فَاكْتَسَحُوهُمْ، أَيْ أَخَذُوا مَالَهُمْ كُلَّهُ»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يُثبت أن «اكتسح» كلاسيكياً بمعنى الاستيلاء الكامل والشامل. التحوّل
            الدلالي إلى «الفوز الكاسح» طبيعي ومنطقي ومستقر في الاستعمال المعاصر.

    - lemma: "قَاهِر"
      confirm:
        - text: >
            «الْقَافُ وَالْهَاءُ وَالرَّاءُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى غَلَبَةٍ
            وَعُلُوٍّ. يُقَالُ: قَهَرَهُ يَقْهَرُهُ قَهْرًا. وَالْقَاهِرُ: الْغَالِبُ.
            وَأُقْهِرَ الرَّجُلُ، إِذَا صُيِّرَ فِي حَالٍ يُذَلُّ فِيهَا»
          source: "مقاييس اللغة لابن فارس"

    - lemma: "سَبَّاق"
      confirm:
        - text: "«السَّبَّاقُ: الكثير السبق»"
          source: "المعجم الوسيط"
        - text: "«السَّبَّاقُ: الكثيرُ السَّبْق — سَبَّاقُ غاياتٍ: حائزٌ قَصَبَاتِ السَّبْق»"
          source: "المعجم الكبير"
        - text: >
            «السِّينُ وَالْبَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى
            التَّقْدِيمِ. يُقَالُ سَبَقَ يَسْبِقُ سَبْقًا. فَأَمَّا السَّبَقُ فَهُوَ
            الْخَطَرُ الَّذِي يَأْخُذُهُ السَّابِقُ»
          source: "مقاييس اللغة لابن فارس"

    - lemma: "مُتَقَدِّم بِفَارِق"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "فَائِزٌ سَاحِقٌ"
      decision: confirmed
      decision_reason: >
        تركيب وصفي (فائز + ساحق) راسخ في الإعلام العربي الرياضي والسياسي.
        مكوّناه موثّقان لغوياً: «فائز» من فاز بمعنى الظفر والخلاص، و«ساحق»
        بمعنى الكاسح الطاغي الذي يتفوق بما لا يُرد. التركيب يجتاز اختبار
        التثبيت المعجمي كوحدة اصطلاحية تُستعمل في سياقات التعليق الرياضي
        والانتخابي للدلالة على الفوز بفارق كبير. اللمّة تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز صفة الفوز الساحق كسمة ثابتة لازمة للفائز؛ مناسب للسياقات الوصفية
        التي تُركّز على طبيعة الفوز ودرجته، لا على الفعل الآني وحده.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَائِزٌ سَاحِقٌ"

    - lemma: "مُكْتَسِح"
      source: stage1
      decision: confirmed
      decision_reason: >
        اسم فاعل من «اكتسح» موثوق الجذر في مقاييس اللغة بمعنى الأخذ والاستيلاء
        الشامل. التحوّل الدلالي إلى الفوز الكاسح بفارق كبير طبيعي ومستقر في
        الاستعمال المعاصر. يمثّل مفردة مفردة أكثر إيجازاً من المركب، ويُثري
        المجموعة بدلالة الفاعلية والحسم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الجانب الفعلي-الحركي للفوز: المُكتسِح من يكتسح الميدانَ بأسره
        ويُحكم سيطرته الشاملة، مما يُفيد الحسم والانفراد لا مجرد التقدم بفارق.
      actions:
        - command: create_entry
          params:
            lemma: "مُكْتَسِح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "قَاهِر"
      source: stage1
      decision: removed
      decision_reason: >
        القاهر = الغالب؛ معناه عام يشمل كل فائز وليس بالضرورة بفارق كبير.
        لا يحمل القيد الدلالي المميّز للمجموعة (الفارق الواسع)، ويتداخل مع
        المجموعة الأم (فائز/منتصر) دون إضافة فارقة، مما يُخلّ بمبدأ
        عدم الترادف المطلق.

    - lemma: "سَبَّاق"
      source: stage1
      decision: removed
      decision_reason: >
        السبّاق = الكثير السبق؛ يدل على الصفة الاعتيادية المتكررة (من يسبق دائماً)،
        لا على حدث واحد بفارق كبير. هذه دلالة عادة وطبع راسخ لا دلالة فوز ساحق
        في مناسبة بعينها، فيبتعد بذلك عن مراد المجموعة.

    - lemma: "مُتَقَدِّم بِفَارِق"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ: يمكن إبدال «متقدم» بـ«فائز» أو «متصدر» وتظل العبارة
        وصفاً حراً صالحاً لا مصطلحاً ثابتاً. ليست وحدة معجمية مثبتة.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
