        text: "من يَفوزُ في المنافسة بتفوقٍ ساحقٍ يُبعده بُعداً بيّناً عن سائر المتنافسين"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
