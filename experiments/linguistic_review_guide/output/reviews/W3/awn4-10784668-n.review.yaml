      reason: >
        التعريف الحالي مختصر ومائل إلى الدوران (يستخدم «فائز» وهي جزء من لمّة
        المجموعة)، ولا يُحدد السياق التنافسي ولا درجة الفارق.
    authored:
      - type: terminological
        text: "المنافسُ الذي يَحرزُ الفوزَ في السباق أو المباراة متفوقاً على أقرب خصومه بفارقٍ واسعٍ لافت"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
