# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'صانع أشرعة' عبارة وصفية حرة تفشل اختبار السكّ؛ يمكن إبدال 'صانع' بـ'ناسج' أو 'خيّاط' وتبقى صالحةً كوصف"
      - "اللمّة خالية من التشكيل الكامل"
      - "التعريف الحالي 'صانع للأشرعة' يكاد يكون نسخةً من اللمّة نفسها، مما يُفضي إلى دوران لغوي"
      - "غياب لمّة اشتقاقية مُفردة في حين يتوافر في العربية وزن (فَعَّال) القياسي لأسماء الحِرَف"
    observations: >
      المجموعة تصف حرفياً بحرياً متخصصاً في صنع أشرعة السفن. الجذر (ش-ر-ع) يُنتج
      بصورة طبيعية وزن (فَعَّال) الدالّ على الاحتراف نظير: نجّار، خيّاط، حدّاد.
      وثمة جذر موازٍ هو (ق-ل-ع) إذ القِلْعُ هو الشراع في العربية الكلاسيكية،
      مما يتيح مجازاً أو اشتقاقاً بديلاً. التعريف يحتاج تأليفاً يُفرّق بين الجنس
      والفصل بدلاً من تكرار اللمّة.

  blind_candidates:
    - lemma: "شَرَّاعٌ"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال القياسي لأسماء الحِرَف والمِهَن من جذر (ش-ر-ع)؛ الشِّرَاعُ هو
        قِلْعُ السفينة، فـ«شَرَّاع» قياسٌ على نجّار من النجر، وخيّاط من الخيط.
        الوزن أقرّه مجمع اللغة المصري لاسم الحرفة.

    - lemma: "قَلَّاعٌ"
      generation_method: majaz
      justification: >
        القِلْعُ هو الشراع في العربية القديمة (كما في قِلَاعُ السفينة)؛ يُحتمل أن
        يكون «قَلَّاع» على وزن فَعَّال مَجازاً من صانع القِلَع (= الأشرعة)، إحياءً
        للفظ تراثي متخصص في السياق البحري.

    - lemma: "حَائِكُ الأَشْرِعَةِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من (حائك + الأشرعة)؛ الحوك هو النسج أو الحياكة، وصنع الأشرعة
        يقوم أساساً على حياكة أقمشة متينة، فالمركّب يُبرز الجانب التقني للحرفة.

    - lemma: "خَيَّاطُ الشِّرَاعِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي من (خيّاط + الشراع)؛ يُبرز خياطة قماش الشراع بوصفها الحرفة
        المُميِّزة، وهو مفهوم مألوف في لغة الصناعات البحرية التقليدية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات قاعدة البيانات المُنفَّذة:
# ١) مطابقة دقيقة دفعية: صانع اشرعة + شراع + قلاع + حايك + خياط
# ٢) إثراء بالمعرّف لـ entry_ids: 51103, 14878, 51096, 23945, 872502, 8430
# ٣) جسر إنجليزي: sailmaker / sail maker / canvas worker
# ٤) مقاييس اللغة (dictionary_id=151): جذور شرع، قلع، صنع، حوك، خيط
stage2_evidence:
  per_lemma:

    - lemma: "صانع أشرعة"
      evidence_status: "no_material_found"
      # لم يُعثر على المركّب «صانع أشرعة» بوصفه وحدةً معجميةً في أي معجم مستعلَم.

    - lemma: "شَرَّاعٌ"
      confirm:
        - text: >
            «مَنْ يَبِيعُ الكَتَّانَ الجَيِّدَ ؛ صَانِعُ أَشْرِعَةِ السَّفِينَةِ ؛
            مَنْ يَرْفَعُ أَشْرِعَةَ السَّفِينَةِ»
          source: "المعجم الكبير (مجمع اللغة العربية)"
      expands:
        - text: >
            «الشِّينُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، وَهُوَ شَيْءٌ يُفْتَحُ
            فِي امْتِدَادٍ يَكُونُ فِيهِ... وَمِنْ ذَلِكَ شِرَاعُ السَّفِينَةِ،
            وَهُوَ مَمْدُودٌ فِي عُلُوٍّ»
          source: "مقاييس اللغة لابن فارس (مادة: شرع)"
          addition: >
            يُثبت الجذر الاشتقاقي (ش-ر-ع) ويُرسّخ الصلة الدلالية بين
            الشِّرَاع بوصفه ما يُمدَّد في علوٍّ وبين وزن شَرَّاع الدالّ على
            الاحتراف بصنعه.

    - lemma: "قَلَّاعٌ"
      contradicts:
        - text: >
            «القَلَّاعُ: الشُّرْطِيُّ الساعي إلى السلطان بالباطل في حق الناس؛
            النبَّاش؛ الكذَّاب»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            المعنى الراسخ للفظ «قَلَّاع» في المعاجم الحديثة والكلاسيكية يتعلق
            بمن يسعى بالنمائم ويقلع الناس عن مكانتهم، وليس بصانع الأشرعة.
        - text: >
            «وَالْقَلَاعُ: الرَّجُلُ يَرَى الرَّجُلَ قَدِ ارْتَفَعَ مَكَانُهُ
            عِنْدَ آخَرَ فَلَا يَزَالُ يَشِي بَيْنَهُمَا حَتَّى يَقْلَعَهُ.
            وَرُوِيَ فِي حَدِيثٍ: «لَا يَدْخُلُ الْجَنَّةَ دَيْبُوبٌ وَلَا قَلَاعٌ»»
          source: "مقاييس اللغة لابن فارس (مادة: قلع)"
          conflict: >
            المقاييس يُصرّح بأن «القَلَاع» هو الساعي بالنميمة، لا صانع الشراع؛
            و«القِلْعُ» (شراع السفينة) يختلف وزنه عن «قَلَّاع»، ولا يُشتق منه
            هذا الوزن بمعنى صانع الأشرعة.

    - lemma: "حَائِكُ الأَشْرِعَةِ"
      evidence_status: "no_material_found"
      # وردت «حَايِك» بمعنى ناسج الثياب (موسوعة السلطان قابوس)، لكن المركّب
      # «حائك الأشرعة» لم يرد وحدةً معجميةً ثابتةً في المصادر المُستعلَمة.

    - lemma: "خَيَّاطُ الشِّرَاعِ"
      evidence_status: "no_material_found"
      # «الخَيَّاط» في المعاجم هو من حرفته خياطة الثياب (المعجم الوسيط، الكبير)،
      # ولم يرد المركّب «خيّاط الشراع» وحدةً اصطلاحيةً ثابتةً.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "صانع أشرعة"
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ: يُمكن إبدال «صانع» بـ«ناسج» أو «خيّاط» أو «محترف»
        ويبقى التعبير صالحاً كوصف، مما يكشف أنه عبارة وصفية حرة لا وحدة معجمية
        مسكوكة. فضلاً عن ذلك، لم يرد المركّب في أي معجم مُستعلَم بوصفه مصطلحاً
        ثابتاً، ويتوافر بديل أدق وأوثق هو «شَرَّاعٌ» المُثبَت في المعجم الكبير
        بالدلالة ذاتها مباشرةً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "شَرَّاعٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَتٌ صراحةً في المعجم الكبير بالمعنى الدقيق: «صَانِعُ أَشْرِعَةِ
        السَّفِينَةِ»؛ مُشتقٌّ على وزن فَعَّال القياسي للحِرَف والمهن من جذر
        (ش-ر-ع)، ويُجاز اشتقاقه مجمعياً. لا اشتراك لفظي ضارّ في السياق البحري.
        يجتاز اختبار السكّ إذ لا يُعوَّض بكلمة أخرى مع الحفاظ على الدلالة الاشتقاقية
        ذاتها. يُعدّ الخيار الأمثل لقياس التوليد المصطلحي (إحياء لفظ كلاسيكي موثّق).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اسم حرفة مشتق مباشرة من جذر الشِّرَاع على وزن الاحتراف؛ يحمل
        الدلالة التخصصية الكاملة في لفظ مُفرَد بعكس المركّب الوصفي.
      actions:
        - command: create_entry
          params:
            lemma: "شَرَّاعٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "قَلَّاعٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «قَلَّاع» في المعاجم العربية الكلاسيكية والحديثة يعني الشرطي الساعي
        بالنميمة والكذّاب، وأكده حديثٌ نبوي. المعنى المعجمي الراسخ يتعارض
        تعارضاً تاماً مع دلالة صانع الأشرعة، ولا سبيل إلى إحياء اللفظ بمعنى
        مغاير دون خلط ضارّ.

    - lemma: "حَائِكُ الأَشْرِعَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ (يمكن إبدال «حائك» بـ«صانع» أو «خيّاط») وليس وحدة
        معجمية ثابتة مسجّلة. كما أن «حائك» في المعاجم ناسج الثياب لا الأشرعة
        تحديداً، فلا خصوصية دلالية للمركّب.

    - lemma: "خَيَّاطُ الشِّرَاعِ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ ولم يرد وحدةً اصطلاحية ثابتة. «الخيّاط» عام
        يشمل كل خيّاط ثياب، فلا يُخصّص الحرفة المقصودة. وجود «شَرَّاع» المُثبَت
        يُغني عن هذا المركّب الوصفي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "صانع للأشرعة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يُعيد صياغة اللمّة بلفظ مختلف قليلاً (صانع للأشرعة ≈ صانع
        أشرعة)، فيقع في الدوران اللغوي ولا يتضمّن جنساً قريباً ولا فصلاً نوعياً
        يُميّز المفهوم. يحتاج إلى تعريف يُحدّد نوع الصنعة والمادة والغرض.
    authored:
      - type: terminological
        text: >
          حِرَفِيٌّ مُتَخَصِّصٌ في قَطْعِ أَشْرِعَةِ السُّفُنِ الشِّرَاعِيَّةِ
          مِن أَقْمِشَةٍ مَتِينَةٍ كَالكَتَّانِ، وخِيَاطَتِها وَتَرْكِيبِها
          وإِصْلَاحِها.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مَن يَحْتَرِفُ صُنْعَ أَشْرِعَةِ السُّفُنِ وإِصْلَاحَها؛ وقِوَامُ
          صَنعَتِهِ اختِيارُ الأَقْمِشَةِ الصَّفِيقَةِ المُقاوِمَةِ لِلرِّيَاحِ
          — وأَجوَدُها الكَتَّانُ — وقَطْعُها وَخِيَاطَتُها عَلى أَشْكَالٍ
          مُحكَمَةٍ تُمَكِّنُ السَّفِينَةَ مِن اصطِيادِ الرِّيحِ والإِبْحَارِ.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            حِرَفِيٌّ مُتَخَصِّصٌ في قَطْعِ أَشْرِعَةِ السُّفُنِ الشِّرَاعِيَّةِ
            مِن أَقْمِشَةٍ مَتِينَةٍ كَالكَتَّانِ، وخِيَاطَتِها وَتَرْكِيبِها
            وإِصْلَاحِها.
      - command: add_definition
        params:
