# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان خاليتان من التشكيل الكامل"
      - "اللمّة «غيلبرت» منفردةً مشتركة لفظاً مع وحدة القوة الدافعة المغناطيسية (gilbert) في المعاجم العلمية العربية"
      - "«كاس» مقابل «Cass» تعريب صوتي غير موحَّد؛ بعض المصادر تُفضِّل «كاسيوس» (الاسم اللاتيني الكامل)"
      - "التعريف الحالي ترجمة شبه حرفية من الإنجليزية، يفتقر إلى الجنس القريب والأسلوب الموسوعي المعجمي العربي"
    observations: >
      المجموعة خاصة باسم علَم موسوعي لشخص بعينه هو المهندس المعماري الأمريكي كاس غيلبرت
      (1859-1934). هذا النوع من المداخل موسوعي بطبيعته؛ وتُبنى لمّاته على التعريب الصوتي
      لا على الاشتقاق أو المجاز. اللمّتان صحيحتان في الجوهر، غير أن غياب التشكيل ينقص
      دقتهما الإملائية. «كاس غيلبرت» هي الصيغة الأشمل والأدق، في حين أن «غيلبرت» وحدها
      تحتمل التباساً مع الوحدة الفيزيائية أو أعلام أخرى تحمل نفس اللقب.
  blind_candidates:
    - lemma: "كَاس غِيلْبِرْت"
      generation_method: taarib
      justification: "نقل صوتي للاسم الكامل (Cass Gilbert) وهو المنهج الوحيد الممكن للأعلام الشخصية الأجنبية؛ يُخصِّص الشخصية بلا لبس"
    - lemma: "غِيلْبِرْت"
      generation_method: taarib
      justification: "نقل صوتي للقب العائلي (Gilbert) مفرداً، مشروع في السياق الأكاديمي بعد تقديم الاسم الكامل أول مرة"
    - lemma: "كَاسْ جِيلْبِرْت"
      generation_method: taarib
      justification: "صيغة بديلة تكتب G بالجيم وفق تقليد المعاجم الطبية العربية (جيلبير، جيلبرت)؛ تعكس تنوع التعريب في المصادر"
    - lemma: "جِيلْبِرْت"
      generation_method: taarib
      justification: "نقل صوتي بالجيم للقب مفرداً، موثَّق في موسوعة السلطان قابوس لأسماء العرب وبعض المعاجم الطبية العربية"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلام ١ — مطابقة دفعية للمّات والمرشحات
# نتيجة: غيلبرت ← entry 583775 (وحدة مغناطيسية، تعارض)
#         جيلبرت ← entry 920613 (اسم علم، يوسّع)
#         كاس غيلبرت / كاس جيلبرت ← لا مادة
# استعلام ٢ — الجسر الإنجليزي (Gilbert, skyscraper, architect)
# نتيجة: entry 583775, entry 690490 (وحدة مغناطيسية)، أعلام طبية
stage2_evidence:
  per_lemma:
    - lemma: "غيلبرت"
      contradicts:
        - text: "«غيلبرت (وَحْدَةُ القُوَّةِ المُحَرِّكَةِ المِغْناطيسِيَّة)»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المدخل يعرّف «غيلبرت» بوصفه وحدة قياس في الكهرومغناطيسية لا معمارياً، مما يكشف اشتراكاً لفظياً مباشراً يُوجب الحذر"

    - lemma: "كاس غيلبرت"
      evidence_status: "no_material_found"

    - lemma: "كَاسْ جِيلْبِرْت"
      evidence_status: "no_material_found"

    - lemma: "جِيلْبِرْت"
      expands:
        - text: "«جيلبرت: عن الألمانية والانجليزية القديمة بمعنى رهينة ورهان مشهور»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكد أن «جيلبرت» اسم علَم راسخ في المصادر العربية، ويوثّق الصيغة بالجيم بوصفها بديلاً مقبولاً"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "غيلبرت"
      decision: confirmed
      decision_reason: >
        اللمّة راسخة كتعريب للقب "Gilbert" وتُستخدم للإحالة المختصرة في السياق المعماري
        الأكاديمي. الاشتراك اللفظي مع وحدة القياس المغناطيسي لا يُلغي صحتها لأن السياق
        الدلالي للمجموعة كافٍ للتمييز. تحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب مفرداً يُستخدم اختصاراً في الخطاب الأكاديمي بعد ذكر الاسم الكامل؛
        أقل تحديداً من «كاس غيلبرت» ويفتقر إلى التمييز الكامل عن أعلام أخرى تحمل نفس اللقب
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غِيلْبِرْت"

    - lemma: "كاس غيلبرت"
      decision: confirmed
      decision_reason: >
        الاسم الكامل هو المدخل الرئيسي للمجموعة؛ يُخصِّص الشخصية بلا لبس ويُميّزها عن
        أي اسم غيلبرت آخر. غياب الأدلة المعجمية المباشرة مفهوم لأعلام الأشخاص الأجانب.
        يحتاج إلى تشكيل كامل وتمييز MWE.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل للشخصية، وهو المدخل الأساسي للتعريف الأول؛ يُزيل اللبس مع الوحدة
        الفيزيائية والأعلام الأخرى، ويصلح للذكر المستقل في النصوص الموسوعية والأكاديمية
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَاس غِيلْبِرْت"

    - lemma: "كَاسْ جِيلْبِرْت"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بديلة بالجيم غير موثَّقة في المصادر العربية للإشارة إلى هذا الشخص بالذات؛
        صيغة الغين «كاس غيلبرت» أرسخ في السياق المعماري العربي وإضافة هذه الصيغة تُحدث
        تكراراً غير مُبرَّر

    - lemma: "جِيلْبِرْت"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق الصيغة بالجيم في موسوعة السلطان قابوس، تظل «غيلبرت» بالغين أكثر تداولاً
        في السياق المعماري العربي وفي تعريبات AWN4 المماثلة؛ إدراج الصيغتين معاً دون سند
        مؤسسي يزيد التشتت


