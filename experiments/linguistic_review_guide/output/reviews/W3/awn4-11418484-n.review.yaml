# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «رايت» مبهمة وتشمل في المعاجم العربية أكثر من شخصية غربية مشهورة (وليم رايت المستشرق 1830-1889، والأخوان رايت للطيران، وسيسيل رايت وغيرهم)، مما يُفضي إلى اشتراك لفظي على مستوى التعريف المعجمي."
      - "التعريف الحالي مقتضب جداً ولا يُبيّن إسهامات المعماري ومدرسته الفكرية (العمارة العضوية) ولا أبرز أعماله."
      - "اللمّتان خاليتان من التشكيل، وإن كان ذلك معهوداً في أسماء الأعلام الغربية المعرَّبة؛ إلا أن النظام يتطلّب معالجتها صراحةً."
      - "المجموعة مُصنَّفة pos: n وليس proper_noun، وهذا يتوافق مع اصطلاح Princeton WordNet لأسماء الأعلام، غير أنه يستحق الإشارة."
    observations: >
      المجموعة الترادفية تُمثّل عَلَماً شخصياً — المعماري الأمريكي فرانك لويد رايت. وجودُ
      الأعوام (1869-1959) في التعريف دليلٌ قاطع على أن المدخل لشخص بعينه لا لمفهوم عام.
      اللمّتان الواردتان هما تعريب (تاريخي) للاسم الإنجليزي، وهو الأسلوب المعياري في المعاجم
      والموسوعات العربية لأسماء الأعلام الغربية. لمّة الاسم الكامل «فرانك لويد رايت» أدق
      وأقل التباساً من اللقب المجرد «رايت» الذي يشترك فيه عشرات الشخصيات الغربية. التعريف
      يحتاج إثراءً موسوعياً يُبرز الطابع الفكري للمعماري ومنجزاته البارزة.
  blind_candidates:
    - lemma: "رايت"
      generation_method: taarib
      justification: "تعريب اللقب الإنجليزي Wright؛ الصيغة الأكثر إيجازاً وشيوعاً في المراجع العربية للإشارة إلى أصحاب هذا اللقب."
    - lemma: "فرانك لويد رايت"
      generation_method: taarib
      justification: "تعريب الاسم الكامل Frank Lloyd Wright بصيغته الثلاثية، وهو الأكثر دقةً وتمييزاً للشخصية المقصودة وأبعدها عن الاشتراك اللفظي."
    - lemma: "فرانك رايت"
      generation_method: taarib
      justification: "تعريب بالاسم الأول واللقب فقط دون الاسم الأوسط (لويد)، صيغة مختصرة تستخدمها بعض المصادر العربية."
    - lemma: "لويد رايت"
      generation_method: taarib
      justification: "تعريب بالاسم الأوسط واللقب (Lloyd Wright)، صيغة يستخدمها بعض مؤرخي العمارة للتمييز بين أفراد عائلة رايت المعمارية."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت: (١) مطابقة دقيقة دُفعية، (٢) جسر إنجليزي،
#                   (٣) بحث FTS عربي بالكلمات المفتاحية
# entry_ids استُعيد عليها: 91196, 91200 (رايت - المعجم الكبير)
stage2_evidence:
  per_lemma:
    - lemma: "رايت"
      contradicts:
        - text: "«وليم رايت Wright.W (١٨٣٠-١٨٨٩): مستشرق إنجليزي، ولد في البنغال، ودرس اللغات الشرقية في أسكتلندا وفي ليدن على «دوزى»، وعيِّن أستاذًا للغة العربية في جامعتَي لندن ودبلن، وعمل في مكتبة المتحف البريطاني، ثم أستاذًا في كمبردج. من آثاره: «حرزة الحاطب وتحفة الطالب»، و«أخبار الرواد وما حمد من الكلام» لابن دريد، و«تلقيب القوافي» لابن كيسان.»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "المدخل يُعرِّف رايت بوصفه وليم رايت المستشرق الإنجليزي (1830-1889)، لا فرانك لويد رايت المعماري الأمريكي (1869-1959)؛ وهذا يؤكد أن «رايت» في المعاجم العربية مرتبطٌ أولاً بشخصية مختلفة تماماً."
        - text: "«معامل رايت للزواج بالأقارب (ف)»، «تلوين رايت (لطفيليات الملاريا)»، «متلازمة رايت (مرض وعائي عصبي في الطرف العلوي)»، «تشخيص مصليّ لوِرايت»"
          source: "المعجم الطبي الموحد (2009) / معجم مصطلحات علم الوراثة (2009) — ARABTERM"
          conflict: "لفظة «رايت» في المعاجم العلمية العربية المتخصصة مرتبطة بمصطلحات طبية وجينية تعود إلى عالم الجينات Sewall Wright وإلى الطبيب Almroth Wright، لا إلى المعماري فرانك لويد رايت."

    - lemma: "فرانك لويد رايت"
      evidence_status: "no_material_found"

    - lemma: "فرانك رايت"
      evidence_status: "no_material_found"

    - lemma: "لويد رايت"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة: رايت ──
    - lemma: "رايت"
      decision: confirmed
      decision_reason: >
        رغم غياب الأدلة المعجمية الداعمة لهذا الاستخدام (والأدلة الموجودة تشير إلى شخصيات أخرى
        بنفس اللقب)، تبقى «رايت» لمّةً معتمدة في سياق هذه المجموعة لأن المجموعة الترادفية
        ذاتها توفّر السياق الكافي للتمييز (إذ تُحدّد الشخص بالأعوام والوصف المعماري). وهي الصيغة
        المختصرة المقبولة للإشارة إلى فرانك لويد رايت في الكتابة العلمية والمعجمية العربية.
        غير أنها لمّة ثانوية؛ أما «فرانك لويد رايت» فهي اللمّة الرئيسية الأوضح.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقبُ المختصر المُفرَد؛ يُستخدم حين يكون السياقُ كافياً للتمييز، ويُعرِّض لاشتراك لفظي مع شخصيات أخرى تحمل اللقب نفسه."

    # ── اللمّة الموجودة: فرانك لويد رايت ──
    - lemma: "فرانك لويد رايت"
      decision: confirmed
      decision_reason: >
        الاسم الكامل الثلاثي هو اللمّة المُثلى لعَلَم شخصي من هذا النوع؛ لا تعريف بديل موثَّق
        في المعاجم العربية لأنه اسم عَلَم غربي يُنقل بالتعريب. غياب المادة المعجمية لا يُضعف
        اللمّة بل يعكس طبيعة أسماء الأعلام الغربية في القاموسية العربية. وهي اللمّة المفضَّلة
        والأقل التباساً بسبب إدراج الاسم الأوسط «لويد» الذي يميّز هذا المعماري عن سائر حاملي
        اللقب رايت.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسمُ الكاملُ الرسميُّ بصيغته الثلاثية؛ يُزيل أيَّ التباس ويُعرِّف الشخصَ تعريفاً لا لبسَ فيه، وهو الأنسب في السياقات الرسمية والمصادر المرجعية."

    # ── مرشح المرحلة ١: فرانك رايت ──
    - lemma: "فرانك رايت"
      source: stage1
      decision: removed
      decision_reason: >
        اللمّة المختصرة «رايت» تؤدي وظيفة الصيغة المختصرة، وإضافة «فرانك» دون «لويد» لا تُضيف
        قيمةً تمييزيةً كافيةً ولا تعكس الاسم الأشيع في المصادر العربية. كما أن غياب الاسم
        الأوسط يُبقي على إمكانية الاشتراك مع معماريين آخرين من عائلة رايت (كـ Lloyd Wright Jr.).

    # ── مرشح المرحلة ١: لويد رايت ──
    - lemma: "لويد رايت"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة (الاسم الأوسط + اللقب) غير موثَّقة في المصادر العربية ولا تُمثّل الاستخدام
        المعياري لاسم هذا المعماري. كما أنها تشترك في الاشتراك اللفظي مع Lloyd Wright Jr.
        نجل المعماري نفسه الذي عمل في المجال ذاته.


