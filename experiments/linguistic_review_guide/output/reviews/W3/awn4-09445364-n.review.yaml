stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - لا توجد لمات بديلة للمصطلح الجغرافي بالرغم من وجود تنوعات إملائية محتملة للاسم المعرب.
    observations: "المصطلح الحالي «خليج سان فرانسيسكو» هو التسمية العربية القياسية لهذا المعلم الجغرافي، وهو مركب إضافي يجمع بين اسم الجنس «خليج» والاسم العلم المعرب «سان فرانسيسكو». المعجم الكبير يثبت هذا الاستخدام ضمن تعريف مدينة سان فرانسيسكو."
  blind_candidates:
    - lemma: "خَلِيجُ سَان فْرَانْسِيسْكُو"
      generation_method: tarkib
      justification: "التركيب الإضافي القياسي لاسم العلم الجغرافي."
    - lemma: "خَلِيجُ سَان فْرَنْسِيسْكُو"
      generation_method: tarkib
      justification: "تنوع إملائي شائع للاسم المعرب (بكسر الراء بدلاً من فتحها)."
    - lemma: "جَوْنُ سَان فْرَانْسِيسْكُو"
      generation_method: tarkib
      justification: "استخدام مرادف «جَوْن» كبديل لـ «خليج» في المصطلحات الجغرافية."
    - lemma: "مِيناءُ سَان فْرَانْسِيسْكُو"
      generation_method: tarkib
      justification: "استخدام «ميناء» للإشارة إلى الخليج في السياق الملاحي والتجاري."

