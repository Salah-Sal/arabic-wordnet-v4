      - type: encyclopedic
        text: "خَلِيجٌ كَبِيرٌ يَقَعُ فِي غَرْبِيِّ وِلَايَةِ كَالِيفُورْنِيَا الأَمْرِيكِيَّةِ، يَتَّصِلُ بِالمُحِيطِ الهَادِئِ عَبْرَ مَضِيقِ «البَوَّابَةِ الذَّهَبِيَّةِ»، وَتُطِلُّ عَلَيْهِ مَدِينَةُ سَان فْرَانْسِيسْكُو وَتُحِيطُ بِهِ عِدَّةُ مُدُنٍ أُخْرَى."
