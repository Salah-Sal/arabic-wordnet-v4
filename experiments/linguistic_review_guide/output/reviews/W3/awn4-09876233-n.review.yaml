# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة الموجودة (ناشِط لِتَحْدِيد النَّسْل) عبارةٌ وصفية حرّة لا تجتاز اختبار التثبيت المعجمي؛ إذ يمكن إبدال «ناشط» بـ«مناضل» أو «مدافع» وتبقى الجملة وصفاً صحيحاً"
      - "دلالة «ناشط» في المعجمية الكلاسيكية (ناقِض الحبل ليُضفَر ثانية — المعجم الوسيط) بعيدةٌ كل البُعد عن معنى الناشط الحقوقي المقصود"
      - "المجموعة تفتقر إلى مصطلح منفرد أو مكثَّف يحمل الدلالة الإيديولوجية النظرية لمفهوم الدعوة إلى تحديد النسل (كالمالثوسية)"
    observations: "تمثّل المجموعة صنفاً إنسانياً متخصصاً يجمع بين الإصلاح الاجتماعي والدعوة لقضية ديموغرافية. يستخدم «ناشط» في العربية المعاصرة بمعنى activist، وهو استخدام موثَّق في المعجمية الحديثة، غير أنّه عامٌّ لا يختصّ بتحديد النسل. تُشير طبيعة المفهوم إلى فجوة معجمية أصيلة في التراث، إذ لم يعرف العرب القدامى هذا النوع من الدعاة مؤسسةً اجتماعية. يُلاحَظ وجود مصطلح مُعرَّب واسع التداول في الأدبيات الأكاديمية هو «المالثوسيّ» يُعبّر عن هذا المفهوم بدقة."
  blind_candidates:
    - lemma: "مُنَظِّم النَّسْل"
      generation_method: tarkib
      justification: "تركيب إضافي من اسم الفاعل «مُنَظِّم» (وزن مُفَعِّل من نظّم) والمضاف إليه «النَّسْل»؛ يستند إلى المصطلح المقنَّن «تنظيم النسل» الموثَّق في مصادر أرابتيرم المتعددة بمعنى birth control."
    - lemma: "مَالْتُوسِيّ"
      generation_method: taarib
      justification: "تعريب لـ Malthusian نسبةً إلى عالِم السكان توماس مالثوس (1766–1834)؛ يُطلق في الخطاب الأكاديمي العربي على المؤمن بضرورة تحديد النسل درءاً للاكتظاظ السكاني والفقر، وهو يتطابق مع الدلالة الجوهرية للمجموعة."
    - lemma: "مُحَدِّد النَّسْل"
      generation_method: tarkib
      justification: "تركيب إضافي من اسم الفاعل «مُحَدِّد» (وزن مُفَعِّل من حدَّد) و«النَّسْل»؛ الجذر «حدد» يحمل دلالة المنع والتقييد في مقاييس اللغة لابن فارس، وهو ملائم مفهومياً لمن يدعو إلى الحدّ من التناسل."
    - lemma: "مُصْلِح سُكَّانِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «مُصْلِح» (اسم فاعل من أصلح) و«سُكَّانِيّ» (نسبة إلى السكان)؛ يُعبّر عن الجانب الإصلاحي-الاجتماعي المصرَّح به في التعريف «مصلح اجتماعي»."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "ناشِط لِتَحْدِيد النَّسْل"
      confirm:
        - text: "«ناشط في مجال المناخ» = Climate activist"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (أرابتيرم)"
      contradicts:
        - text: "«النَّاشِطُ: ناقِض الحَبْل لِيُضفَر ثانية»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأصيلة المادية (عمل يدوي بالحبال) لا علاقة لها بالناشط الحقوقي المُراد، مما يُثبت أنّ «ناشط» بمعنى activist توسُّعٌ دلاليٌّ حديث"
      expands:
        - text: "«النُّونُ وَالشِّينُ وَالطَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اهْتِزَازٍ وَحَرَكَةٍ. مِنْهُ النَّشَاطُ مَعْرُوفٌ وَهُوَ لِمَا فِيهِ مِنَ الْحَرَكَةِ وَالِاهْتِزَازِ وَالتَّفَتُّحِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر نشط يدلّ على الحركة والانطلاق، وهو المنطق الدلالي الذي جعل «الناشط» ترجمةً للـactivist في العربية المعاصرة؛ انتقالٌ مجازيٌّ من الحركة المادية إلى الحركة الاجتماعية"

    - lemma: "مُنَظِّم النَّسْل"
      contradicts:
        - text: "مُنَظِّم = control unit / controller / loop controller / regulator"
          source: "المعجم الموحد لمصطلحات المياه (أرابتيرم)"
          conflict: "الاستخدام التقني الراسخ لـ«مُنَظِّم» يُصرفه نحو الأجهزة والآليات لا الأشخاص الدُّعاة"
        - text: "مُنظِّم = organizer / regulator"
          source: "المعجم الطبي الموحد (2009) — أرابتيرم"
          conflict: "حتى في السياق الطبي، منظّم = organizer بمعنى الجهاز أو الوظيفة البيولوجية لا الشخص الداعية"
      expands:
        - text: "«تنظيم النسل» = birth control، و«تنظيم الأسرة» = family planning"
          source: "أرابتيرم — مصادر متعددة (الاقتصاد، التجارة، الاجتماع، الطب)"
          addition: "يُثبت أنّ الجذر نظم + النسل/الأسرة مستخدَمٌ في سياق منع الحمل، لكنّ المدخَّل هو المصدر «التنظيم» لا اسم الفاعل «المُنَظِّم» الدالّ على الشخص"

    - lemma: "مَالْتُوسِيّ"
      confirm:
        - text: "«(1) مالثوسي: ذو علاقة بتوماس روبرت مالثوس (1766-1834) أو بنظريته القائلة إنّ عدد السكّان يتزايد بنسبة تفوق ازدياد الموارد الغذائيّة وبأنّ النسل يجب أن يُحدَّد (2) المالثوسيّ: أحد القائلين بالمالثوسية»"
          source: "المورد الحديث (2008)"

    - lemma: "مُحَدِّد النَّسْل"
      contradicts:
        - text: "مُحَدِّد = limiter / delimiter / determinant — مصطلحات تقنية بحتة"
          source: "أرابتيرم (مجالات: المياه، الكهرباء، الرياضيات، المعلوماتية، علم الأحياء)"
          conflict: "«محدِّد» محتلٌّ بمعانٍ تقنية راسخة في عشرات المعاجم المتخصصة؛ استخدامه بمعنى «الداعية لتحديد النسل» سيُفضي إلى اشتراك لفظي مُخِلّ"
      expands:
        - text: "«الْحَاءُ وَالدَّالُ أَصْلَانِ: الْأَوَّلُ الْمَنْعُ، وَالثَّانِي طَرَفُ الشَّيْءِ. فَالْحَدُّ: الْحَاجِزُ بَيْنَ الشَّيْئَيْنِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "دلالة الحدّ = المنع والحاجز تناسب مفهوم تحديد النسل اشتقاقياً، غير أنّها لا تُسعف في بناء مصطلح خاص بالشخص الداعية"

    - lemma: "مُصْلِح سُكَّانِيّ"
      expands:
        - text: "«المُصْلِح: المُناضِلُ مِن أجل الإصلاحِ»"
          source: "المعجم الكبير"
          addition: "«مُصلِح» وحده يُعبّر عن الجنس القريب في تعريف المجموعة «مصلح اجتماعي»، غير أنّ المركَّب «مُصلِح سُكَّانيّ» لم يُوثَّق كوحدة معجمية ثابتة"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "ناشِط لِتَحْدِيد النَّسْل"
      decision: confirmed
      decision_reason: "اللمّة مدعومة بنمط أرابتيرمي موثَّق (ناشط في مجال المناخ = Climate activist)، ويُعزّزها المنطق الاشتقاقي للجذر «نشط» (حركة وانطلاق). على الرغم من طبيعتها الوصفية وغياب تثبيتها كوحدة معجمية أحادية، فإنّ المركَّبات الوصفية من هذا النمط شائعةٌ ومقبولةٌ في أرابتيرم، وهي الصياغة الأتيح في غياب مصطلح مكثَّف. تُصحَّح الدياكريتيكس الداخلية لتحديد."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُؤكّد الجانب الناشط-الميداني والحملاتي (campaigner) في الدعوة لتحديد النسل؛ يُستخدم في السياق الصحفي والسياسي دون إشارة لانتماء نظري محدد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ناشِط لِتَحْدِيدِ النَّسْل"

    - lemma: "مُنَظِّم النَّسْل"
      source: stage1
      decision: removed
      decision_reason: "اللفظ «مُنَظِّم» محتلٌّ في المعجمية التقنية المعاصرة بمعنى regulator/controller الآلي، ولا يدلّ بوضوح على الشخص الداعية؛ فضلاً عن أنّه يفشل اختبار التثبيت المعجمي (إبدال «مُنَظِّم» بـ«مُدير» أو «مُشرف» لا يُغيّر المعنى الوصفي)."

    - lemma: "مَالْتُوسِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "الصيغة الصحيحة المعجمياً هي «مَالْثُوسِيّ» (بالثاء) وفق توثيق المورد الحديث (2008). موثَّقٌ صراحةً بمعنى «أحد القائلين بالمالثوسية» أي الداعي إلى تحديد النسل انطلاقاً من نظرية مالثوس السكانية. يُعبّر عن المفهوم بمصطلح مكثَّف أحادي يجتاز اختبار الاشتقاقية (يقبل ال- والجمع المالثوسيون والنسبة). يُصحَّح رسمه من الـتاء المُشتبَه بها إلى الثاء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُشير تحديداً إلى المؤمن بنظرية مالثوس السكانية القائلة بأنّ النسل يجب تحديده للحيلولة دون استنزاف الموارد؛ يُستخدم في الخطاب النظري والأكاديمي ويحمل بُعداً إيديولوجياً لا تمتلكه الصيغة الأولى"
      actions:
        - command: create_entry
          params:
            lemma: "مَالْثُوسِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُحَدِّد النَّسْل"
      source: stage1
      decision: removed
      decision_reason: "لم يُوثَّق كوحدة معجمية ثابتة في أيٍّ من المصادر المستعلَمة، و«محدِّد» محتلٌّ بمعانٍ تقنية راسخة (delimiter, limiter, determinant) في أكثر من عشرة معاجم متخصصة؛ استخدامه بمعنى الداعية لتحديد النسل سيُفضي إلى اشتراك لفظي."

    - lemma: "مُصْلِح سُكَّانِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركَّب وصفي غير مسكوك ولم يُوثَّق في أيٍّ من المصادر؛ يصف صنفاً واسعاً من المصلحين السكانيين دون تمييز للداعية لتحديد النسل تحديداً، وتُبيَّن هشاشته بأنّ «مُدافع سُكَّانيّ» أو «مُصلح بيئيّ» ستكون كلّها أوصافاً مقبولة للتعبير الحرّ نفسه."


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
