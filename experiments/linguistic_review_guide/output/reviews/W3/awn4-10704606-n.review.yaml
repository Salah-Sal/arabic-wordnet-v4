        الوصف الاصطلاحي الوحيد الموجود لهذا المفهوم في AWN4، ولا يوجد في المعاجم مصطلح مفرد
        راسخ يُعادل «syllogist» بمعنى الشخص المتخصص في القياس. اللمّة المركبة مقبولة كحل
        وصفي تفسيري بانتظار تثبيت لمّة اشتقاقية أفضل. تحتاج إلى تشكيل كامل.
