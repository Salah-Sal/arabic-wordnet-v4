        صيغة مبالغة فَعَّال من جذر «قوس/قيس» الموثق في مقاييس اللغة بمعنى تقدير شيء بشيء.
        الوزن فَعَّال منتج للأشخاص المحترفين في العربية (نجّار، حدّاد، خزّاف). يُعبّر عن المنطقي
        الذي يُكثر من استخدام القياس ويحترف صياغته. لا تعارض مع جذر الكلمة وصيغتها.
        اختبار السك: لا يمكن إبدال أي مكوّن لأن الكلمة مفردة. اختبار التثبيت: مشتق صرفي منتج.
