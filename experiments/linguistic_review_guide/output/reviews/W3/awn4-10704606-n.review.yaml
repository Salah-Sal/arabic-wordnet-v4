# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «خبير القياس المنطقي» عبارة وصفية حرة لا مصطلحٌ مُسكَّك؛ إذ يجوز إبدال «خبير» بـ«ماهر» أو «متخصص» دون أن يفقد التعبير صحته الوصفية، وهذا يدل على افتقاره للتثبيت المعجمي."
      - "التعريف «منطقي ماهر في الاستدلال القياسي» شبه دائري: كلمة «منطقي» هي الـhypernym المباشر للمجموعة، مما يجعل التعريف يُعرِّف الأخص بالأعم دون فصل نوعي كافٍ."
      - "المجموعة تفتقر إلى لمّة اشتقاقية مُفردة مقابل المصطلح الإنجليزي syllogist/syllogizer."
    observations: >-
      المفهوم المقصود هو الشخص المتخصص في القياس المنطقي الأرسطي (syllogism)، وهو ضرب من الاستدلال المؤلَّف
      من مقدمتين ونتيجة. التراث المنطقي العربي الكلاسيكي أوسع فيه حافلٌ بالقياس والتعامل معه، لكن
      الاسم المخصص لصاحب هذا الفن (كالطبيب لصاحب الطب) غير مُسكَّك. جذر «قوس/قيس» يُرجّح
      إمكان الاشتقاق بصيغة مبالغة (قَيَّاس) أو اسم فاعل (مُقَايِس). اللمّة المركبة الموجودة مقبولة
      وصفياً لكن تحتاج إلى مرافقة لمّة مفردة أكثر إيجازاً.

  blind_candidates:
    - lemma: "قَيَّاسٌ"
      generation_method: ishtiqaq
      justification: >-
        صيغة مبالغة على وزن فَعَّال من جذر «قوس/قيس» الذي يدل على تقدير شيء بشيء.
        وزن فَعَّال منتج جداً لأسماء المحترفين: حَمَّال، عَطَّار، نَجَّار. يُفيد هنا
        كثرةَ استخدام القياس المنطقي واحترافَه، وهو وصف مناسب للمنطقي المتخصص في هذا الفن.
    - lemma: "مُقَايِسٌ"
      generation_method: ishtiqaq
      justification: >-
        اسم فاعل من «قَايَسَ» على وزن مُفَاعِل، يدل على من يمارس القياس. ورد في المعاجم
        فعلُ المقايسة بمعنى المعارضة والمقارنة؛ ومن ثَمَّ يمكن توسيعه ليشمل المنطقي
        الذي يُقايس المقدمات ويستنتج النتائج.
    - lemma: "عَالِمُ الْقِيَاسِيَّاتِ"
      generation_method: tarkib
      justification: >-
        مركب إضافي: «عالم» جنس قريب + «القياسيات» (جمع القياسية، أي المسائل القياسية).
        القياسيات = مجال دراسة القياسات المنطقية الأرسطية. مماثل لـ«عالم الرياضيات»
        و«عالم الفيزياء»، وهو نمط اشتقاقي منتج في المصطلحية العلمية العربية.
    - lemma: "قِيَاسِيٌّ"
      generation_method: ishtiqaq
      justification: >-
        نسبة إلى «القياس» على وزن فَعَالِيّ، يُستعمل اسماً بالتنقيل الصرفي للدلالة على
        المتخصص في القياس المنطقي. نظيره: «نحويّ» للنحو، «بلاغيّ» للبلاغة. وقد ورد
        «قِياسيّ» في المورد الحديث بمعنى syllogistic مما يدل على أصالة الجذر في هذا المجال.


