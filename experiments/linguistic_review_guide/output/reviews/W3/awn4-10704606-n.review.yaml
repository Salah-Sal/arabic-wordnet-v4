  per_lemma:
    - lemma: "خبير القياس المنطقي"
      evidence_status: "no_material_found"

    - lemma: "قَيَّاسٌ"
      evidence_status: "no_material_found"

    - lemma: "مُقَايِسٌ"
      expands:
        - text: "«وَمِنْهُ الْقِيَاسُ، وَهُوَ تَقْدِيرُ الشَّيْءِ بِالشَّيْءِ، وَالْمِقْدَارُ مِقْيَاسٌ. تَقُولُ: قَايَسْتُ الْأَمْرَيْنِ مُقَايَسَةً وَقِيَاسًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن فعل «قَايَسَ» واسم المصدر «مقايسة» موثقان في أصول اللغة، مما يُجيز اشتقاق اسم الفاعل «مُقَايِس»، غير أن المعنى الأصلي هو المقارنة لا الاستدلال المنطقي."
      contradicts:
        - text: "«يَخْزَى الْوَشِيظُ إِذَا قَالَ الصَّرِيحُ لَهُمْ ... عُدُّوا الْحَصَى ثُمَّ قِيسُوا بِالْمَقَايِيسِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "«المقاييس» جمع «مقياس» بمعنى أداة القياس لا الشخص، مما يُضعف استعمال «مُقَايِس» بمعنى المتخصص في القياس المنطقي."

    - lemma: "عَالِمُ الْقِيَاسِيَّاتِ"
      evidence_status: "no_material_found"

    - lemma: "قِيَاسِيٌّ"
      confirm:
        - text: "«قِياسيّ (مق).» = syllogistic"
          source: "المورد الحديث (2008)"
        - text: "«القياسي: مَا يُمكن أَن يذكر فِيهِ ضابطة عِنْد وجود تِلْكَ الضابطة يُوجد هُوَ»"
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: "«قِياسيّ (مق).» = syllogistic [صفة]"
          source: "المورد الحديث (2008)"
          conflict: "الاستعمال المُوثَّق لـ«قياسيّ» هو الصفة (syllogistic) لا اسم الشخص المتخصص (syllogist)."

  supporting_concepts:
    - concept: "القياس المنطقي"
      confirm:
        - text: "«الْقيَاس: قَول مؤلف من قضايا إِذا سلمت لزم عَنهُ لذاته قَول آخر»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«القياس: عند أهل الميزان: مؤلف من قضايا إذا سلمت لزم عنها لذاتها قول آخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«قياس» = syllogism"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«القياس؛ القياس المنطقيّ (مق).» = syllogism"
          source: "المورد الحديث (2008)"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
