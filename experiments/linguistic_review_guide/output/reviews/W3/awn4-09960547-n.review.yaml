            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "طَالِعٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكلاسيكية تُثبّت دلالة «الطالع» في المعاني الفلكية والمنجمية
        (الهلال، الفجر الكاذب، برج الميلاد). لا يُوجد في المعاجم ما يدعم استخدامه
        مصطلحاً للإنسان الواعد؛ ومجاز «حظه طالع» لا يُنتج منه مصطلح مسكوك ثابت،
        فلا يصمد أمام اختبار التثبيت المعجمي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مَرْجُوٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        اسم مفعول من رَجَا يَرْجُو (جذر ر ج و) بمعنى «الذي يُرجى له الخير
        والنجاح». مُثبَت في مقاييس اللغة (الرجاء = الأمل)، وفي موسوعة السلطان
        قابوس: «المرغوب فيه»، وفي المعجم الكبير بمعنى النخلة الداني ثمرها
        (مجاز الاكتمال الوشيك). المورد الحديث يُعطيه صريحاً ترجمةً لـpromising
        وlup-and-coming. يُتمّم الفجوة التي تركتها إزالة «واعد».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الرجاء والانتظار المُلحّ؛ يُوحي بأن النجاح مُتوقَّع وقريب
        ومُرتقَب، ويُستخدم في السياقات الرسمية والعلمية والمهنية مع دلالة
        أكثر اتزاناً وأقل حماساً من «نجم صاعد».
      actions:
