# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص ذو مستقبل واعد"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دوّار: يستخدم «واعد» (لمّة مُزالة) لتعريف المجموعة. فضلاً
        عن ذلك تركيب «ذو مستقبل واعد» عبارة وصفية حرة لا تستوفي شرط الجنس القريب
