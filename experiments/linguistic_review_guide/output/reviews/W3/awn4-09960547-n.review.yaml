        وَالِانْتِظَارُ، وَالثَّانِي الْحَبْلُ مِنَ الرَّمْلِ. فَأَمَّا الْأَوَّلُ
        فَقَالَ الْخَلِيلُ: الْأَمَلُ الرَّجَاءُ، فَتَقُولُ أَمَّلْتُهُ أُؤَمِّلُهُ
