# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «واعد» منفردةً اسمٌ مرفوض لغوياً في هذا السياق؛ يُثبت معجم الصواب اللغوي أنها ترجمة حرفية عمياء من الإنجليزية (promising)، ومعنى الكلمة في المعاجم الكلاسيكية لا يشمل الإنسان الواعد."
      - "التعريف الحالي «شخص ذو مستقبل واعد» دوّار لأنه يتضمن «واعد» وهي إحدى لمّات المجموعة نفسها."
      - "الهايبرنيم المُختار «خصم/غريم/منافس» (المتسابق الذي تأمل في هزيمته) غير ملائم دلالياً لـ«شخص ذو مستقبل واعد»؛ الجنس القريب الأنسب هو «شخص» أو «موهوب»، لا «منافس»."
      - "المجموعة تفتقر إلى لمّة اسمية مفردة فصيحة ذات جذر عربي صريح."
    observations: >
      المجموعة awn4-09960547-n تُعبِّر عن مفهوم إنجليزي واحد هو "comer" بمعنى الشخص
      الذي يُبشّر بمستقبل زاهر. «نجم صاعد» تركيبٌ وصفي مجازي مقبول ومتداول في العربية
      المعاصرة، يُوحي بالصعود المتسارع والبروز الظاهر. غير أن «واعد» منفردةً إشكاليةٌ
      مزدوجة: فهي لا تُستخدم وصفاً للإنسان في المعاجم الكلاسيكية (بل للفرس والغيم
      والأيام)، وقد نصّ معجم الصواب اللغوي على رفضها في هذا السياق لأنها ترجمة حرفية
      من الإنجليزية. يحتاج الحقل إلى لمّة مفردة فصيحة كـ«مَرْجُوّ» أو «مُؤَمَّل»
      تحمل المعنى المطلوب بجذر عربي أصيل.

  blind_candidates:
    - lemma: "مُؤَمَّلٌ"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من أمَّلَ يُؤَمِّل على وزن مُفَعَّل، من جذر (أ م ل)، بمعنى
        «الذي تُعقد عليه الآمال». يناسب الوظيفة الدلالية المطلوبة دون دوران،
        إذ لا يتضمن مفردة التعريف.
    - lemma: "طَالِعٌ"
      generation_method: majaz
      justification: >
        اسم فاعل من طَلَعَ، والطلوع في اللغة دالٌّ على الظهور والبروز؛ استُعمل
        مجازاً في العربية بمعنى القادم المُقبل على خير ومستقبل مشرق (حظه طالع).
        إحياء لمعنى فلكي-أخلاقي قديم بإزاحة دلالية نحو الإنسان الصاعد.
    - lemma: "مَرْجُوٌّ"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من رَجَا يَرْجُو على وزن مَفْعُول (مَرْجُوّ)، من جذر (ر ج و)،
        بمعنى «الذي يُرجى له الخير والنجاح». يؤدي معنى المجموعة بوضوح ولا يُكرّر
        مفردة التعريف.
    - lemma: "نَجْمُ الْغَدِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «نجم» و«الغد»، يعني صاحب المستقبل المُشرق؛ يختلف عن
        «نجم صاعد» في أن الثاني يُشير إلى فعل الصعود الآني، بينما هذا يُشير
        إلى الانتساب الزمني للغد والمستقبل.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # الاستعلامات المُنفَّذة:
  # Q1 — مطابقة دقيقة دفعية لجميع اللمّات والمرشحات
  # Q2 — إثراء (definitions + examples) بـentry_id
  # Q3 — جسر إنجليزي: comer / promising / up-and-coming / rising star
  # Q4 — مقاييس اللغة: جذور وعد / طلع / رجى / أمل / نجم / صعد

  per_lemma:

    - lemma: "نجم صاعد"
      confirm:
        - text: >
            «(النَّجْمُ) أحد الأجرام السماوية المضيئة بذاتها... علم على الثريا
            خاصة... والكوكب... ونَجَمَ الشيءُ: طَلَعَ وظهر وبرز»
          source: "المعجم الوسيط"
        - text: >
            «(الصاعد) يقال: بلغ كذا فصاعداً: فما فوقه»
          source: "المعجم الوسيط"
        - text: >
            «نجم — شخصيَّة فنيَّة مرموقة»
          source: "مسرد الإعلام والتواصل، منظمة أليكسو (ARABTERM)"
      expands:
        - text: >
            «(نَجَمَ) النُّونُ وَالْجِيمُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى
            طُلُوعٍ وَظُهُورٍ. وَنَجَمَ النَّجْمُ: طَلَعَ. وَنَجَمَ السِّنُّ
            وَالْقَرْنُ: طَلَعَا.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            دلالة «نجم» على الظهور والبروز الأصلية تُسوِّغ الاستخدام المجازي
            لـ«نجم صاعد» بمعنى الشخص البارز الصاعد.
        - text: >
            «(صَعَدَ) الصَّادُ وَالْعَيْنُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ
            عَلَى ارْتِفَاعٍ وَمَشَقَّةٍ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            «صاعد» يُضيف دلالة الارتفاع المستمر، مما يُعزز المعنى المجازي
            للتركيب الوصفي.

    - lemma: "واعد"
      contradicts:
        - text: >
            «وَاعِد — الجذر: و ع د — مثال: شبابٌ واعِد — الرأي: مرفوضة —
            السبب: لأن كلمة «واعد» في دلالتها على هذا المعنى منقولة بطريقة الترجمة
            من الإنجليزية. المعنى: مُتَوَفِّرَ له من الكفاية ما يُبَشِّرُ بمستقبل
            مشرق»
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: >
            المعجم يرفض صراحةً استخدام «واعد» بهذه الدلالة ويُصنِّفها ترجمة
            حرفية عمياء من الإنجليزية (calque مرفوض).
        - text: >
            «(الواعد) يُقال فرسٌ واعدٌ: يَعِدُك جريًا بعد جَرْي؛ ويوم واعدٌ:
            يَعِدُك أوَّلُه بحرٍّ أو برد؛ وسحابٌ واعدٌ: كأنه وَعَدَ بالمطر»
          source: "المعجم الوسيط"
          conflict: >
            الاستخدام الكلاسيكي لـ«واعد» صفةٌ للفرس والأيام والسحاب لا للإنسان،
            مما يؤكد أن وصف الإنسان بها حديث النشأة ومنقول.
        - text: >
            «وَاعِد — من (و ع د) الممني غيره، والذي يهدد بالشر»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            التعريف الاسمي لـ«واعد» في سياق الأسماء يحمل دلالة التهديد لا
            الوعد الخيري، مما يُناقض المعنى المراد.
      expands:
        - text: >
            «(1) القادم؛ الوافد — (2) الواعد: شخص يحقّق نجاحًا ملحوظاً
            أو يَعِدُ بمستقبل زاهر»
          source: "المورد الحديث (2008)"
          addition: >
            المورد الحديث يُسجّل «الواعد» ترجمةً لـcomer في معناه الحديث،
            مما يُثبت أن هذا الاستخدام حديث ومعرَّب المعنى وليس عربياً أصيلاً.

    - lemma: "مُؤَمَّلٌ"
      confirm:
        - text: >
            «(أَمَلَ) الْهَمْزَةُ وَالْمِيمُ وَاللَّامُ أَصْلَانِ: الْأَوَّلُ
            التَّثَبُّتُ وَالِانْتِظَارُ... الْأَمَلُ الرَّجَاءُ، فَتَقُولُ
            أَمَّلْتُهُ أُؤَمِّلُهُ تَأْمِيلًا»
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «واعد؛ مَرْجُوّ؛ يُنتظر له مستقبلٌ مرموق»
          source: "المورد الحديث (2008) — ترجمة promising"
      expands:
        - text: >
            «(المؤمَّل) الثامن من خَيْل الحلبة العشرة»
          source: "المعجم الوسيط"
          addition: >
            هذا المعنى الخاص باسم الفرس السابع/الثامن لا يُناقض المعنى اللغوي
            الاشتقاقي لـ«مُؤَمَّل» بمعنى «الذي يُؤمَّل فيه»؛ هو مجرد توظيف
            خاص للوزن في ميدان سباق الخيل.

    - lemma: "طَالِعٌ"
      contradicts:
        - text: >
            «الطالع: الهلال، والفجر الكاذب، والسهم الذي يقع وراء الهدف؛
            (في اصطلاح المُنَجِّمين): ما تنبأ به المنجم من الحوادث بطلوع
            كوكب معيَّن»
          source: "المعجم الوسيط"
          conflict: >
            المعاجم الكلاسيكية تُعطي «الطالع» معاني فلكية ومنجمية محددة
            لا صلة لها بدلالة «الشخص الواعد»، فلا يُكوَّن منها اصطلاح
            للمفهوم المطلوب دون لبس.
        - text: >
            «الطالعُ: هو البرج الموافي للأفق عند الولادة، أو أمرٌ ما»
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: >
            دلالة فلكية ثابتة لا يمكن تجاوزها دون إيقاع التباس.

    - lemma: "مَرْجُوٌّ"
      confirm:
        - text: >
            «(رَجَى) الرَّاءُ وَالْجِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ
            مُتَبَايِنَانِ، يَدُلُّ أَحَدُهُمَا عَلَى الْأَمَلِ... الرَّجَاءُ
            وَهُوَ الْأَمَلُ. يُقَالُ رَجَوْتُ الْأَمْرَ أَرْجُوهُ رَجَاءً.»
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «مَرْجُوّ — من (ر ج و) بمعنى المرغوب فيه»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >
            «واعد؛ مَرْجُوّ؛ يُنتظر له مستقبلٌ مرموق»
          source: "المورد الحديث (2008) — ترجمة promising"
        - text: >
            «مرجوّ؛ متوقَّع له النَّجاح أو الازدهار»
          source: "المورد الحديث (2008) — ترجمة up-and-coming"
      expands:
        - text: >
            «المَرْجُوُّ من النَّخل: الذي دنا حِمْلُه»
          source: "المعجم الكبير"
          addition: >
            الاستخدام الكلاسيكي لـ«مرجو» مرتبط بالاكتمال الوشيك والثمر
            المُنتظر، وهذا يُعزز المجاز المطلوب: الشخص الذي يُنتظر ثمر
            مواهبه وجني نجاحاته.

    - lemma: "نَجْمُ الْغَدِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "نجم صاعد"
      decision: confirmed
      decision_reason: >
        «نجم صاعد» تركيبٌ وصفي مجازي راسخ في العربية المعاصرة، مُستوفٍ لشروط
        التثبيت المعجمي؛ يُسجّله مسرد أليكسو للإعلام بمعنى «شخصية فنية مرموقة».
        الجذران «نجم» (طلوع وظهور) و«صاعد» (ارتفاع) يُشكّلان معاً إزاحةً دلالية
        واضحة نحو الشخص البارز المتصاعد. يصمد أمام اختبار السكّ: لا يمكن إبدال
        «صاعد» بـ«بارز» أو «مرموق» بنفس المعنى المصطلحي المقصود. يحتاج إلى
        تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركّز على الصعود الدينامي المتسارع والبروز الظاهر للعيان؛ يُستخدم
        غالباً في سياقات الشهرة والرياضة والفن، ويُوحي بفعل الصعود الجاري
        لا بالإمكانية المستقبلية فحسب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَجْمٌ صَاعِدٌ"

    - lemma: "واعد"
      decision: removed
      decision_reason: >
        أدان معجم الصواب اللغوي استخدام «واعد» بهذه الدلالة صراحةً ووصفها بأنها
        ترجمة حرفية عمياء من الإنجليزية (calque). المعاجم الكلاسيكية (الوسيط، الكبير)
        تقصر «واعد» صفةً على الفرس والأيام والسحاب. موسوعة السلطان قابوس تُعرّفها
        اسماً بمعنى «الممني غيره، والذي يهدد بالشر» — وهو معنى مناقض. كما أن
        الكلمة صفة (adjective) في الأصل لا اسم، ولا يستقيم استخدامها اسماً
        قائماً بذاته للإنسان الواعد بالمستقبل.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُؤَمَّلٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        اسم مفعول من أمَّلَ على وزن مُفَعَّل بمعنى «الذي يُؤَمَّل فيه وتُعقد
        عليه الآمال». الجذر (أ م ل) مُثبَت في مقاييس اللغة بمعنى التثبت والانتظار
        والرجاء. الاشتقاق قياسي صحيح. المورد الحديث يُعطي «مَرْجُوّ» و«يُنتظر له
        مستقبل مرموق» ضمن مرادفات promising، مما يُثبت حاجة المجموعة لهذا النمط
        الاشتقاقي. يصمد أمام بوابة جودة المصطلح: مُطَّرِد ويسير في التداول
        وعربي أصيل ومشتق.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الآمال المعقودة عليه من الآخرين وعلى توقعات المحيط؛ فيه إشعار
        بالمسؤولية الاجتماعية والتوقع الجماعي، ويُستخدم غالباً في السياقات
        التعليمية والمهنية الرسمية.
      actions:
        - command: create_entry
          params:
