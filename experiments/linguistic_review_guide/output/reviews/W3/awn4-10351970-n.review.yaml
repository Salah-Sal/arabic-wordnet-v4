            type: usage
      - lemma: "اللَّاعِبُ الأَنْفَس"
        examples:
          - text: "غدا اللاعبُ الأَنْفَسُ في الفريقِ العاملَ الحاسمَ في إحرازِ اللقبِ، إذ لا يخلو تركيبُ الفريقِ من حضورِه وتأثيرِه في المنعطفاتِ الكبرى."
            type: usage
