# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-10351970-n  |  ILI: i91461  |  POS: n
# المفهوم: أفضل لاعب / Most Valuable Player (MVP)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «اللاعب الأكثر قيمة» تعبير وصفي حر لا يرقى إلى مستوى المصطلح المسكوك؛ هي ترجمة حرفية للإنجليزية ولا تجتاز اختبار السك."
      - "التعريف العربي الحالي «للرياضة أو الفريق» غير دقيق؛ MVP لقبٌ يُمنح في سياق فريق أو بطولة أو موسم، لا بالنسبة إلى الرياضة بمفهومها الكلي."
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل."
    observations: "المجموعة تُعبّر عن مفهوم رياضي مؤسسي حديث (Most Valuable Player / MVP): لقبٌ رسمي يُمنح بحكم هيئة أو تصويت. اللغة العربية تملك أدوات اشتقاقية كافية للتعبير عنه؛ فالجذر (ن ف س) يُنتج «الأنفس» بمعنى الأعظم قيمةً، والجذر (ف ض ل) يُنتج «أفضل» بمعنى الأكثر تفوقاً. المفهوم موجود في الثقافة الرياضية المعاصرة ويحتاج إلى مصطلح مسكوك لا إلى عبارة وصفية طويلة."

  blind_candidates:
    - lemma: "اللَّاعِبُ الأَنْفَس"
      generation_method: tarkib
      justification: "تركيب وصفي من صيغة التفضيل «الأنفس» (من ن-ف-س) بمعنى الأعظم قيمةً والأجلّ شأناً؛ وهو يقابل «most valuable» تماماً من حيث الدلالة على القيمة الجوهرية العليا. يجتاز اختبار الاستبدال: لا يمكن إبدال «الأنفس» بـ«الأكبر» دون تغيير المعنى جذرياً."
    - lemma: "أَفْضَلُ لاعِب"
      generation_method: tarkib
      justification: "تركيب إضافي من أفعل التفضيل (أفضل) مضافاً إلى (لاعب نكرة)، من الجذر (ف-ض-ل) الدال على الزيادة والتفوق. مقابل شائع لـ«best player» في الصحافة الرياضية العربية، ويجتاز اختبار السك بوصفه وحدة دلالية متعارفاً عليها."
    - lemma: "قِوَامُ الفَرِيق"
      generation_method: majaz
      justification: "مجاز إحيائي يستعمل «القِوَام» (عماد الشيء ونظامه) ليصف اللاعب الذي يقوم عليه الفريق ولا يستقيم أمره بدونه. مستند على شاهد لغوي راسخ: «قِوَامُ الدِّينِ وَالْحَقِّ، أَيْ بِهِ يَقُومُ»."
    - lemma: "اللَّاعِبُ الأَحَقّ"
      generation_method: tarkib
      justification: "تركيب وصفي من أفعل التفضيل (أحق) من الجذر (ح-ق-ق) بمعنى الأجدر والأولى والأنبت. يصف اللاعب الأجدر بالاعتراف والتقدير من بين أقرانه. ورد في المعجم الكبير: «الأَمْرُ الأَحَقُّ: الأَجْدَرُ وَالأَوْلَى وَالأَنْبَتُ»."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دفعية: جميع اللمّات + المرشحات (headword_norm IN)
#   ٢. الجسر الإنجليزي: most valuable player, MVP, best player, player of the year
#   ٣. FTS كلمات مفتاحية: لاعب، أفضل لاعب، اللاعب الأفضل، أنفس لاعب
#   ٤. مقاييس اللغة: جذور نفس، فضل، قوم، لعب (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "أفضل لاعب"
      confirm:
        - text: "«الْفَاءُ وَالضَّادُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى زِيَادَةٍ فِي شَيْءٍ. مِنْ ذَلِكَ الْفَضْلُ: الزِّيَادَةُ وَالْخَيْرُ. وَالْإِفْضَالُ: الْإِحْسَانُ»"
          source: "مقاييس اللغة لابن فارس (جذر فضل)"
      expands:
        - text: "«(أفضل) عَلَيْهِ أحسن إِلَيْهِ وَمِنَ الشَّيْء أَبقى مِنْهُ بَقِيَّة وَعَلَيْهِ فِي الحَسب وَالشَّرف زَاد عَلَيْهِ فيهما»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يدل الفعل (أفضل) على التفوق في الشرف والمكانة، وهو مناسب لوصف التميز الرياضي الذي يُجمع عليه."

    - lemma: "اللاعب الأكثر قيمة"
      evidence_status: "no_material_found"

    - lemma: "اللَّاعِبُ الأَنْفَس"
      confirm:
        - text: "«الأَنْفَسُ: الأَعظَمُ قيمةً، الأَطْوَل، الأمثل، الأفسَحُ، والأوْسَعُ»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(الأنفس) الأعظم قيمةً والأطول والأمثل والأفسح والأوسع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«شَيْءٌ نَفِيسٌ، أَيْ ذُو نَفْسٍ وَخَطَرٍ يُتَنَافَسُ بِهِ. وَالتَّنَافُسُ: أَنْ يُبْرِزَ كُلُّ وَاحِدٍ مِنَ الْمُتَبَارِزَيْنِ قُوَّةَ نَفْسِهِ»"
          source: "مقاييس اللغة لابن فارس (جذر نفس)"

    - lemma: "قِوَامُ الفَرِيق"
      expands:
        - text: "«القوام: لما يقوم به الشيء أي يثبت كالعماد والسناد»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُثبت أن «القوام» يدل في التراث على ما به يقوم الشيء ويثبت، وهو مناسب لوصف العماد البشري في الفريق."
        - text: "«(القوام) قوام كل شيء عماده ونظامه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "تأكيد على دلالة «القِوَام» بمعنى العماد والنظام."
        - text: "«هَذَا قِوَامُ الدِّينِ وَالْحَقِّ، أَيْ بِهِ يَقُومُ. وَأَصْلُ الْقِيمَةِ الْوَاوُ، وَأَصْلُهُ أَنَّكَ تُقِيمُ هَذَا مَكَانَ ذَاكَ»"
          source: "مقاييس اللغة لابن فارس (جذر قوم)"
          addition: "اللافت أن ابن فارس يربط القيمة نفسها بالجذر (ق و م)، مما يمنح المجاز سنداً اشتقاقياً."

    - lemma: "اللَّاعِبُ الأَحَقّ"
      expands:
        - text: "«الأَحَقُّ: هُوَ أَحَقُّ بِكَذَا، لَهُ مَعْنَيَانِ: الأَوَّلُ: اخْتِصَاصُهُ بِغَيْرِ شَرِيكٍ. وَالثَّانِي: أَنْ يَكُونَ أَفْعَلَ تَفْضِيل، فَيَقْتَضِي اشْتِرَاكَهُ مَعَ غَيْرِهِ وَتَرْجِيحَهُ عَلَيْهِ. الأَمْرُ الأَحَقُّ: الأَجْدَرُ، والأَوْلَى، والأَنْبَتُ»"
          source: "المعجم الكبير (OCR)"
          addition: "يُثبت أن «الأحق» يدل على الأجدرية من منظور الحق والاستحقاق، لا على القيمة الجوهرية أو الإسهام الرياضي."


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "أفضل لاعب"
      decision: confirmed
      decision_reason: "مصطلح مركب إضافي راسخ في الصحافة الرياضية العربية لترجمة MVP، مشتق من الجذر (ف ض ل) الدال على الزيادة والخير والتفوق. يجتاز اختبار السك: لا يمكن إبدال «أفضل» بمرادف اعتباطي (كـ«أكبر» أو «أطول») دون قلب المعنى. يُصحَّح تشكيله ليكون كاملاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُعبّر عن التفوق الكلي في جودة الأداء وعلو الشأن (الفضل = الزيادة في الخير)، وهو المصطلح الأشيع في التداول الإعلامي والرسمي لترجمة MVP."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَفْضَلُ لاعِب"

    - lemma: "اللاعب الأكثر قيمة"
      decision: removed
      decision_reason: "عبارة وصفية حرة لا تجتاز اختبار السك: يمكن إبدال «الأكثر قيمة» بـ«الأعظم قيمةً» أو «الأرفع شأناً» وتبقى صالحة كوصف، مما يعني أنها ليست وحدة معجمية مثبّتة. وهي كذلك ترجمة حرفية للمصطلح الإنجليزي (calque أعمى) دون مراعاة البنية العربية، في حين تتوفر بدائل عربية أجود وأقصر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اللَّاعِبُ الأَنْفَس"
      source: stage1
      decision: confirmed
      decision_reason: "تركيب وصفي مسكوك من صيغة التفضيل «الأنفس» (من ن-ف-س)؛ وقد أثبت المعجم الوسيط صراحةً أن «الأنفس» = الأعظم قيمةً، وهو ما يقابل «most valuable» تقابلاً دقيقاً. الأنفس مستعمل في التراث العربي الكلاسيكي وفصيح، ويختلف عن «أفضل» بتركيزه على القيمة الجوهرية لا على التفوق في الأداء."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركّز على القيمة الجوهرية للاعب وأثره البالغ في مصير الفريق (من «النفاسة» = الشيء ذو الخطر الذي يُتنافس عليه)، وهو أدق دلالةً من «أفضل لاعب» في تصوير مفهوم القيمة المطلقة (value) لا الأداء فحسب."
      actions:
        - command: create_entry
          params:
            lemma: "اللَّاعِبُ الأَنْفَس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "قِوَامُ الفَرِيق"
      source: stage1
      decision: removed
      decision_reason: "رغم صحة التركيب الإضافي وثراء الشاهد اللغوي، فإن «قِوَامُ الفَرِيق» يُعبّر عن الأهمية البنيوية العامة للاعب داخل الفريق، لا عن اللقب الرسمي المؤسسي الذي يُمنح بحكم هيئة. MVP مصطلح مؤسسي له ثبوت رسمي (جائزة محددة)، وليس مجرد صفة تصويرية."

    - lemma: "اللَّاعِبُ الأَحَقّ"
      source: stage1
      decision: removed
      decision_reason: "يدل «الأحق» على الاستحقاق من منظور الحق القانوني والأجدرية، لا على القيمة الرياضية أو الإسهام (value). المفهوم المطلوب يتعلق بمن هو أعظم قيمةً وأكثر إسهاماً، لا بمن هو أجدر حقاً. كما يفتقر التركيب إلى تثبيت معجمي كمصطلح رياضي."


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "اللاعب الذي يُحكم عليه بأنه الأكثر أهمية للرياضة أو الفريق"
    assessment:
      decision: revise
      reason: "ثلاثة إشكاليات: (أ) «للرياضة» غامض — MVP يُمنح في سياق فريق أو بطولة أو موسم، لا بالنسبة إلى الرياضة كله. (ب) «يُحكم عليه» ثقيل أسلوبياً ويوحي بالحكم القضائي. (ج) التعريف لا يشير إلى الطابع الرسمي للجائزة ولا إلى الجهة المانحة."
    authored:
      - type: terminological
        text: "لاعبٌ يُقدَّر أنه الأكثر إسهاماً وتأثيراً في أداء فريقه أو سير البطولة، ويُمنح لقباً رسمياً تكريماً لذلك."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "لقبٌ رياضيٌّ شرفيٌّ يُمنح للاعب الأكثر تأثيراً خلال موسم أو مباريات محددة، بحكم لجنة متخصصة أو بتصويت الصحفيين أو الجماهير؛ ومن أبرز أمثلته جائزة «أفضل لاعب» في دوري كرة السلة الأمريكي (NBA) ونظيراتها في سائر الرياضات الجماعية والفردية."
