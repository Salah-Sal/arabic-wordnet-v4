# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان مكتوبتان بدون تشكيل كامل"
      - "تعريب الاسم الأول 'فيليب' خطأ — Philibert ليس Philippe/Philip، والصحيح 'فِيلِيبِير'"
      - "غياب صيغة 'دو لورم' (de l'Orme) و'فيليبير دو لورم' (Philibert de l'Orme) المقابِلَتين للمّتين الإنجليزيتين المعتمدتين"
      - "التعريف الحالي صحيح مضموناً لكنه يحتاج ضبطاً أسلوبياً معجمياً"
    observations: >
      هذه المجموعة علمٌ شخصي (proper noun synset) لمعماري ملكي فرنسي من أعلام عصر
      النهضة (1515-1570م)، اشتُهر ببناء قصر التويلري وحدائقه في باريس لكاترين دي
      ميديشي. اللمّات المنتظرة هي تعريبات للاسم الفرنسي Philibert de l'Orme / Delorme.
      المشكلة الأبرز: استخدام "فيليب" تعريباً لـPhilibert، وهو خطأ لأن "فيليب" تعريب
      Philippe/Philip لا Philibert. كذلك تفتقر اللمّات إلى تشكيل كامل، ويغيب تعريب
      صيغة "دو لورم" المنفصلة الأكثر شيوعاً في المصادر التاريخية والعربية المعاصرة.
      هذا النوع من المجموعات (أعلام تاريخية أجنبية) لن يرد في المعاجم العربية المعيارية،
      ولذا تقتصر الأدلة المعجمية على غياب المادة.

  blind_candidates:
    - lemma: "فِيلِيبِير دُولُورْم"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم الفرنسي الكامل Philibert Delorme؛ "فِيلِيبِير" نقل صوتي
        لـPhilibert مع إبقاء المقطع الأخير -ير لمقابلة النهاية الفرنسية [-bɛʁ]،
        و"دُولُورْم" تعريب Delorme يراعي اللفظ الفرنسي [dəlɔʁm].
    - lemma: "فِيلِيبِير دُو لُورْم"
      generation_method: taarib
      justification: >
        تعريب الصيغة الفرنسية المنفصلة Philibert de l'Orme التي تُبقي حرف الجر "de"
        ظاهراً؛ مُعرَّبة "دُو لُورْم". هذه الصيغة شائعة في المصادر التاريخية الفرنسية
        والعربية الموسوعية المعاصرة (تعريب المصادر الفرنسية مباشرةً).
    - lemma: "دُو لُورْم"
      generation_method: taarib
      justification: >
        تعريب اللقب المنفصل de l'Orme وحده (= من أيكة الدردار)، مقابل English lemma
        "de l'Orme". يُستخدم هذا اللقب المجرد في السياقات الأكاديمية التاريخية
        الاختصارية.
    - lemma: "دِيلُورْم"
      generation_method: taarib
      justification: >
        تعريب اللقب المدمج Delorme في صورته المختصرة الشائعة في المراجع الإنجليزية
        والعربية المتأثرة بها؛ النطق الفرنسي المدمج [dəlɔʁm] يُنقل عربياً بصيغة
        "دِيلُورْم" أو "دُولُورْم".


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — Batch headword lookup: ديلورم / فيليب ديلورم / دولورم /
#         فيليبير دولورم / فيليبير / دو لورم / ديلورم (normalized forms)
#         → 0 results
#   Q2 — English bridge FTS: "Delorme" OR "de l Orme" OR "Philibert" OR
