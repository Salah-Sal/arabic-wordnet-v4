          text: "يُعَدُّ دِيلُورْم أَحَدَ أَبْرَزِ مُعَمَّارِي عَصْرِ النَّهْضَة فِي فَرَنْسَا، وَقَدْ خَلَّفَ إِرْثاً مَعْمَارِيًّا لَا يَزَالُ شَاهِداً فِي قَلْبِ بَارِيس."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَرْسَى فِيلِيبِير دِيلُورْم دَعَائِمَ الأُسْلُوبِ الكْلَاسِيكِيِّ الفَرَنْسِيِّ فِي العِمَارَة، وَكَانَ أَوَّلَ مَنِ اسْتَلْهَمَ النِّظَامَ المَعْمَارِيَّ الفَرَنْسِيَّ المُسْتَقِلَّ عَنِ النَّمَاذِجِ الإِيطَالِيَّة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وَثَّقَ فِيلِيبِير دُو لُورْم مَبَادِئَهُ المَعْمَارِيَّة فِي مُؤَلَّفِهِ «Nouvelles Inventions» الصَّادِرِ عَامَ 1561م، مُرْسِياً قَوَاعِدَ نَظَرِيَّة لِعِلْمِ البِنَاءِ فِي فَرَنْسَا."


