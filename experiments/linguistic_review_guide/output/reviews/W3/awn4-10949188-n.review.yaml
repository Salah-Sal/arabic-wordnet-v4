    - lemma: "فيليب ديلورم"
      evidence_status: "no_material_found"

    - lemma: "فِيلِيبِير دُولُورْم"
      evidence_status: "no_material_found"

    - lemma: "فِيلِيبِير دُو لُورْم"
      evidence_status: "no_material_found"

    - lemma: "دُو لُورْم"
      evidence_status: "no_material_found"

    - lemma: "دِيلُورْم"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّات موجودة ──────────────────────────────────────────

    - lemma: "ديلورم"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة كتعريب للقب المدمج Delorme وهي الصيغة الاختصارية المعتمدة في
        المراجع. غير أنها تفتقر إلى التشكيل الكامل الإلزامي للمّات المؤكّدة؛ تُحدَّث
        إلى "دِيلُورْم". لا تعارض في الأدلة (لا أدلة أصلاً — علَم أجنبي).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المجرد (دون الاسم الأول)، يعادل English "Delorme" — يُستخدم حين يُكتفى
        بالإحالة إلى الشخصية بلقبها في السياق الأكاديمي المختصر أو الفهارس.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دِيلُورْم"

    - lemma: "فيليب ديلورم"
      decision: confirmed
      decision_reason: >
        اللمّة تمثّل الاسم الكامل وهي ضرورية للتعريف بالشخصية. لكنها تحمل خطأين:
        (١) "فيليب" تعريب لـPhilippe/Philip لا لـPhilibert — الصحيح "فِيلِيبِير"
        إذ إن Philibert اسم فرنكي قديم [filibɛʁ] يختلف صوتاً ومعنىً عن Philippe.
        (٢) غياب التشكيل الكامل.
        يُصحَّح إلى "فِيلِيبِير دِيلُورْم" مع الإبقاء على صيغة "دِيلُورْم" للجزء الثاني
        توافقاً مع اللمّة المختصرة المُثبَّتة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل بصيغته المدمجة (فيليبير ديلورم) — يعادل English "Philibert Delorme".
        الأكثر رسميةً وتعريفاً بالشخصية كاملة، مناسب للسياق الموسوعي والأكاديمي العام
        حيث يُذكر الاسم أول مرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِيلِيبِير دِيلُورْم"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────

    - lemma: "فِيلِيبِير دُولُورْم"
      source: stage1
      decision: removed
      decision_reason: >
        مكرَّر فعلياً مع الشكل المصحَّح "فِيلِيبِير دِيلُورْم" — الفارق بين "دِيلُورْم" و
        "دُولُورْم" تهجئي وترددي بحت دون فارق دلالي؛ ولا تُجيز قواعد تعدد اللمّات
        إضافة صيغتين مترادفتين تهجئياً للاسم الكامل ذاته. يُكتفى بالصيغة المعتمدة
        في اللمّة الموجودة المُصحَّحة.

    - lemma: "فِيلِيبِير دُو لُورْم"
      source: stage1
      decision: confirmed
      decision_reason: >
        تعريب الصيغة المنفصلة Philibert de l'Orme الغائبة عن اللمّات الحالية مع أنها
        مُدرَجة في الإنجليزية. هذه الصيغة هي الأشيع في المصادر العربية الموسوعية
        (ويكيبيديا العربية تُعنوِن المقالة "فيليبير دو لورم") وفي الترجمات الأكاديمية
        المنقولة مباشرةً عن المراجع الفرنسية التاريخية. إضافتها تُكمل التناظر مع
        lemma "Philibert de l'Orme" الإنجليزية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل بصيغة "دو لورم" المنفصلة — يعادل English "Philibert de l'Orme".
        يُفضَّل في السياقات التاريخية والفنية التي تُبقي على صيغة de l'Orme وفاءً
        للمصدر الفرنسي الأصيل، ويُشيع استخدامه في الكتابات الأكاديمية العربية المعاصرة
        المنقولة عن الفرنسية مباشرةً.
      actions:
        - command: create_entry
          params:
            lemma: "فِيلِيبِير دُو لُورْم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "دُو لُورْم"
      source: stage1
      decision: removed
      decision_reason: >
        اللقب المجرد "دو لورم" صيغة ناقصة مُبهمة تلتبس مع عائلات أخرى تبدأ بـ"دو"
        (de + اسم)؛ يُستعاض عنها بـ"دِيلُورْم" المدمجة الأوضح كلمّة اختصارية.
        إضافة صيغة لقب مجرد غير مدمج لا تضيف وضوحاً وقد تُلبس في فهارس الأعلام.

    - lemma: "دِيلُورْم"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق تماماً للمّة الموجودة بعد تصحيحها ("دِيلُورْم") — لا داعي لإنشاء مدخل جديد.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري ملكي فرنسي بنى قصر وحدائق التويلري في باريس لكاترين دي ميديشي (1515-1570)"
    assessment:
      decision: revise
      reason: >
        المضمون صحيح لكن الأسلوب يحتاج تحسيناً: (١) "بنى" تصلح للبيوت العامية؛
        الأدق "صَمَّمَ" للمعماري المخطِّط. (٢) "قصر وحدائق التويلري" تركيب مُلتبس —
        الأصوب "قصر التويلري وحدائقه". (٣) تفتقر الصياغة إلى إشارة إلى عصر النهضة
        مما يُضفي سياقاً تاريخياً ضرورياً لتمييزه معمارياً. (٤) "لكاترين دي ميديشي"
        تحتاج ضبطاً نحوياً أوضح بحرف جر "لِحِسَابِ" أو "بِأَمْرِ".
    authored:
      - type: encyclopedic
        text: >
          مُعَمِّارٌ مَلَكِيٌّ فَرَنْسِيٌّ مِنْ أَعْلَامِ عَصْرِ النَّهْضَة،
          صَمَّمَ قَصْرَ التُّويلِرِي وَحَدَائِقَهُ فِي بَارِيس بِأَمْرِ
          كَاتِرِين دِي مِيدِيشِي (1515–1570م).
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُعَمِّارٌ مَلَكِيٌّ فَرَنْسِيٌّ مِنْ أَعْلَامِ عَصْرِ النَّهْضَة، صَمَّمَ قَصْرَ التُّويلِرِي وَحَدَائِقَهُ فِي بَارِيس بِأَمْرِ كَاتِرِين دِي مِيدِيشِي (1515–1570م)."

  examples:
    per_lemma:
      - lemma: "دِيلُورْم"
        examples:
          - text: "يُعَدُّ دِيلُورْم أَحَدَ أَبْرَزِ مُعَمَّارِي عَصْرِ النَّهْضَة فِي فَرَنْسَا، وَقَدْ خَلَّفَ إِرْثاً مَعْمَارِيًّا لَا يَزَالُ شَاهِداً فِي قَلْبِ بَارِيس."
            type: usage

      - lemma: "فِيلِيبِير دِيلُورْم"
        examples:
          - text: "أَرْسَى فِيلِيبِير دِيلُورْم دَعَائِمَ الأُسْلُوبِ الكْلَاسِيكِيِّ الفَرَنْسِيِّ فِي العِمَارَة، وَكَانَ أَوَّلَ مَنِ اسْتَلْهَمَ النِّظَامَ المَعْمَارِيَّ الفَرَنْسِيَّ المُسْتَقِلَّ عَنِ النَّمَاذِجِ الإِيطَالِيَّة."
            type: usage

      - lemma: "فِيلِيبِير دُو لُورْم"
        examples:
          - text: "وَثَّقَ فِيلِيبِير دُو لُورْم مَبَادِئَهُ المَعْمَارِيَّة فِي مُؤَلَّفِهِ «Nouvelles Inventions» الصَّادِرِ عَامَ 1561م، مُرْسِياً قَوَاعِدَ نَظَرِيَّة لِعِلْمِ البِنَاءِ فِي فَرَنْسَا."
            type: usage

    actions:
      - command: add_sense_example
        params:
