# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان (فكاهي، كوميدي) صفتا نسبة في أصلهما، موظَّفتان اسماً للمؤدي، وقد يستوجب ذلك مراجعة التصنيف الصرفي في المداخل."
      - "لفظة (كوميدي) معرَّبة من اليونانية عبر الفرنسية، وإن كانت مستقرة في الاستعمال المعاصر فهي تفتقر إلى عمق اشتقاقي عربي."
      - "التعريف العربي الحالي يبدو مُترجَماً حرفياً من الإنجليزية دون مراعاة أسلوب المعجم العربي."
      - "المجموعة تخلو من مصطلح اشتقاقي عربي صريح يُعبِّر عن المؤدي الكوميدي المحترف بجذر عربي أصيل."
    observations: >
      المجموعة الترادفية تُعبِّر عن مفهوم واضح المعالم في التراث العربي؛ إذ عرف العرب
      قديماً الهَزْل وأهله (الهَزَّال، الفَكِه، المزَّاح)، ومجالسَ الأدب والفكاهة. غير أن
      مفهوم (المؤدي الكوميدي المحترف) بوصفه حرفةً فنيةً مستقلة ذات طابع مسرحي أو
      استعراضي هو في جوهره مفهوم حديث النشأة في الثقافة العربية. اللمّتان الموجودتان
      تمثلان مستويين مختلفين دلالياً وتاريخياً: (فكاهي) ذو جذر عربي أصيل من الفكاهة
      والمزاح المستحلى، بينما (كوميدي) معرَّب من الكوميديا اليونانية. الغياب اللافت
      هو عدم وجود اسم فاعل مباشر على وزن مُفَعِّل أو فَعَّال لتسمية المحترف في هذا الفن.

  blind_candidates:
    - lemma: "هَزَّال"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (هـ ز ل) على وزن فَعَّال الدال على الكثرة والاحتراف؛
        فالهَزْل نقيض الجِد، والهَزَّال من يُكثر الهزل ويمارسه احترافاً.
        الوزن فَعَّال يُلائم الدلالة على المحترف المتخصص كعطَّار وحدَّاد.
    - lemma: "مُضْحِك"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من أَضْحَكَ على وزن مُفْعِل، دال على من يُضحك الآخرين.
        الوزن يُلائم الدلالة الوظيفية للكوميدي الذي غايته إضحاك جمهوره.
        المصدر ضَحِك من الجذور العربية الراسخة.
    - lemma: "مُفَكِّه"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من فَكَّهَ على وزن مُفَعِّل، من الجذر (ف ك ه) الدال على
        الطيب والاستطابة. المُفَاكَهَة هي المزاحة وما يُستحلى من كلام.
        المُفَكِّه هو من يُمتع الآخرين بالفكاهة ويجلب لهم البهجة.
    - lemma: "مُهَرِّج"
      generation_method: majaz
      justification: >
        اسم فاعل من هَرَّجَ، استُعير للمؤدي الذي يُضحك الناس بحركاته
        وكلماته وهيئته في المسرح والسيرك. تحوّل المعنى من (الاختلاط والتخليط)
        إلى الأداء الهزلي بطريق المجاز الوظيفي. مُعتمَد من مجمع اللغة المصري.


