# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «صانع عطور» عبارة وصفية حرة تُعيد صياغة التعريف نفسه، وليست مصطلحاً معجمياً مسكوكاً؛ مما يُفضي إلى ترادف دائري."
      - "اللمّتان الموجودتان بدون تشكيل — يجب إضافة الضبط الكامل."
      - "تعريف المجموعة «شخص يصنع (ويبيع) العطور» يُقدِّم الصنع على البيع، في حين أن المعاجم الكلاسيكية تُعرِّف العطَّار أساساً بالبيع؛ مما يستوجب مراجعة دقيقة للتعريف."
    observations: >-
      المجموعة تمثّل مفهوماً تراثياً عربياً عريقاً؛ فالعطّار حِرفةٌ معروفة في التراث الإسلامي والعربي منذ القديم.
      جذر ع-ط-ر أصيل وثري، واللفظ «عطّار» موثَّق في معظم المعاجم الكلاسيكية والمعاصرة.
      المشكلة الجوهرية هي وجود لمّة وصفية (صانع عطور) بجانب لمّة اصطلاحية حقيقية (عطّار)؛ وهذا خلل في مستوى التمثيل المعجمي.

  blind_candidates:
    - lemma: "عَطَّار"
      generation_method: ishtiqaq
      justification: >-
        مشتق على وزن فَعَّال من جذر ع-ط-ر، وهو من أكثر أوزان الصيغ المُنتِجة للحِرف والمهن في العربية.
        الجذر يدلّ على العِطر وكل ما يُعالَج بالطيب. الوزن فَعَّال يفيد الاحتراف والمداومة.
    - lemma: "طَيَّاب"
      generation_method: majaz
      justification: >-
        من جذر ط-ي-ب (الطيب والعِطر)، على وزن فَعَّال للمهن. إزاحة دلالية نحو المحترف بالطيب.
        الطِّيب عُرف قديماً بمعنى العِطر والمسك والبخور، فالطَيَّاب من يحترف هذا المجال.
    - lemma: "صَانِعُ الْعُطُور"
      generation_method: tarkib
      justification: >-
        مركّب إضافي من «صانع» + «العطور»، يُحدِّد النشاط (صناعة) والمادة (العطور).
        التركيب الإضافي منتج في المصطلحية العربية المعاصرة.
    - lemma: "مُعَطِّر"
      generation_method: ishtiqaq
      justification: >-
        اسم فاعل من الفعل عَطَّرَ (الباب الثاني)، يدل على مَن يتولى عملية التعطير والتطييب.
        الوزن مُفَعِّل يناسب الفاعل المحترف.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عطار"
      confirm:
        - text: "«بائعُ العِطر يطلق على بائع الأقاوية»"
          source: "المعجم الوسيط (OCR)"
        - text: "«بَائِع الْعطر وَيُطلق على بَائِع الأفاويه»"
          source: "المعجم الوسيط — مجموعة من المؤلفين (hawramani)"
        - text: "«بائع العطر والأعشاب الطبية»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«عطَّار: 1- بائعُ العطورِ «نشتري البُخورَ من عند العطَّار» ° هل يُصلح العَطَّار ما أفسد الدّهْرُ [مثل]: يُضرب فيمن يحاول إصلاح ما لا يمكن صلاحه. 2- بائعُ التَّوابِل»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«وَهُوَ الْعِطْرُ لِلْأَشْيَاءِ الْمُعَالَجَةِ بِالطِّيبِ، وَفَاعِلُهُ الْعَطَّارُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(1) المُعَطِّر (2) العَطّار: صانع العطور أو بائعُها»"
          source: "المورد الحديث (2008)"
        - text: "«عطار: بائع العقاقير والعطور والشموع»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
      expands:
        - text: "«عِطارة [مفرد]: حرفة العَطَّار: صناعةُ العطور أو تجارتها «وَرِث العِطارةَ عن جَدِّه وأبيه»»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يُثبت أن العِطارة مصدرٌ صناعي مسكوك لحرفة العطّار، مما يُرسِّخ كون العطّار صاحب حِرفة متكاملة تشمل الصنع والتجارة."
        - text: "«غَاندِي: اسم مأخوذ عن كندهي في الهندية بمعنى عطار وهو المشتغل بصناعة العطور وتجارتها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُبيّن أن «عطار» يشمل في التراث العربي مَن يشتغل بالصناعة والتجارة معاً."

    - lemma: "صانع عطور"
      expands:
        - text: "«(2) العَطّار: صانع العطور أو بائعُها»"
          source: "المورد الحديث (2008)"
          addition: "العبارة «صانع العطور» تظهر في المورد الحديث تعريفاً للعطّار لا مصطلحاً قائماً بذاته؛ مما يُثبت أنها عبارة وصفية لا اسم مهنة مسكوك."

    - lemma: "طَيَّاب"
      contradicts:
        - text: "«الطِّيَابُ: ريحُ الشَّمَال»"
          source: "المعجم الكبير"
          conflict: "الطِّياب بكسر الطاء في المعاجم يعني ريح الشمال أو نوعاً من نخل البصرة، لا مَن يحترف العطور."
        - text: "«الطِّيَابُ ضَربٌ من النَّخْل بالبصرة، إذا أرْطَبَ وتأَخَّرَ جَنْيُه تساقَطَ عن نواه»"
          source: "المعجم الكبير"
          conflict: "دلالة اسمية خاصة بنوع نخل، بعيدة كل البعد عن مهنة العطّار."
        - text: "«الطِّيَابُ من كل شيءٍ: ما تَسْتَلِذُّه النَّفْسُ وتَسْتَحْسِنُه»"
          source: "المعجم الكبير"
          conflict: "صفة عامة للطيّب (المستلذّ) وليست اسم فاعل مهني."

    - lemma: "مُعَطِّر"
      confirm:
        - text: "«(1) المُعَطِّر (2) العَطّار: صانع العطور أو بائعُها»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«مُعَطِّر [مفرد]: 1- اسم فاعل من عطَّرَ. 2- عِطْر، مُسْتَحْضَر ذو رائحة ذكيَّة فوَّاحة يُتَطيَّب به «اشترت العروسُ بعض المعطِّرات وأدوات التَّجميل»»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "مُعَطِّر مشترك لفظي بين (أ) مَن يُعطِّر أو يبيع العطر، و(ب) المُنتَج ذاته (العِطر/المستحضر العطري)؛ مما يُوجِد غموضاً مرجعياً يُضعف صلاحيته كمصطلح للمهنة."

    - lemma: "صَانِعُ الْعُطُور"
      expands:
        - text: "«(2) العَطّار: صانع العطور أو بائعُها»"
          source: "المورد الحديث (2008)"
          addition: "العبارة «صانع العطور» تظهر في تعريف العطّار وليس مصطلحاً مستقلاً، كما أن التناوب بين «صانع عطور» و«صانع العطور» يكشف عدم ثباتها معجمياً."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عطار"
      decision: confirmed
      decision_reason: >-
        موثَّق في أمهات المعاجم من الوسيط واللسان إلى المعاصر؛ جذره ع-ط-ر أصيل، ومقاييس اللغة تُصرِّح بأن «فاعله العطّار».
        الوزن فَعَّال يناسب صيغة الحِرفة تماماً. يشمل في استعمال المعاجم المعاصرة الصنع والبيع كليهما.
        يحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        عَطَّار يُركِّز على الهوية المهنية (صاحب الحِرفة والتجارة) لا على الفعل المؤقت؛
        فهو لا يدل على مَن عطَّر شيئاً مرة واحدة بل على مَن اتّخذ العطارة حِرفةً راسخة.
        يتميز عن الهايبرنيم «صانع» بتخصُّصه في مادة العِطر والطيب دون سواها،
        وعن «مُعَطِّر» باختصاصه بالمهنة لا بالفعل أو المنتَج.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَطَّار"

    - lemma: "صانع عطور"
      decision: removed
      decision_reason: >-
        عبارة وصفية حرة تُعيد صياغة التعريف (شخص يصنع العطور)، لا مصطلح معجمي مسكوك.
        تفشل اختبار السكّ: يمكن إبدال «عطور» بـ«طيب» أو «مسك» أو «بخور» وتبقى العبارة صالحة كوصف.
        تفشل اختبار التثبيت المعجمي: لا مُدخَل لها في أي معجم باعتبارها وحدة مستقلة.
        في المورد الحديث تظهر «صانع العطور» في تعريف «عطّار»، أي إنها تعريف لا مصطلح.
        إبقاؤها يُفضي إلى الترادف الدائري بين المصطلح وتعريفه.

    - lemma: "عَطَّار"
      source: stage1
      decision: removed
      decision_reason: >-
        مطابق للمّة الموجودة «عطار» المؤكَّدة بعد تشكيلها. لا داعي لإضافة مدخل جديد.

    - lemma: "طَيَّاب"
      source: stage1
      decision: removed
      decision_reason: >-
        الأدلة المعجمية تُثبت أن «الطِّياب» بكسر الطاء يعني: ريح الشمال، أو نوعاً من النخل في البصرة، أو ما تستلذه النفس بوجه عام.
        لا شاهد واحد في المعاجم على استعماله بمعنى المحترف بصناعة العطور أو بيعها.
        الاقتراح مبنيّ على قياس غير موثّق، وإدراجه يُحدث التباساً دلالياً خطيراً.

    - lemma: "صَانِعُ الْعُطُور"
      source: stage1
      decision: removed
      decision_reason: >-
        نفس إشكاليات «صانع عطور» الموجودة: عبارة وصفية حرة لا وحدة معجمية.
        تفشل اختبار السكّ واختبار التثبيت المعجمي.
        ظهورها في المورد الحديث تعريفٌ وليس مصطلحاً.

    - lemma: "مُعَطِّر"
      source: stage1
      decision: removed
      decision_reason: >-
        مشترك لفظي بين المعنيين: (أ) مَن يُعطِّر، و(ب) المُستحضَر العطري (product).
        معجم اللغة العربية المعاصرة يُورده بالمعنيين متكافئَين. هذا الغموض يجعله غير صالح
        كمصطلح مهني واضح. علاوةً على ذلك، «مُعَطِّر» في الاستعمال الشائع يُقصد به مَن
        يضع العِطر على نفسه لا مَن يحترف صنعه. الأفضل الاكتفاء بـ«عَطَّار» الأوضح والأقدم.


