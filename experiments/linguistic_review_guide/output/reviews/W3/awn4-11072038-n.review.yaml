        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب منفرداً، يُستخدم اختصاراً بعد ورود الاسم الكامل، أو في السياقات الإشارية حيث يكون السياق كافياً للتمييز."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِيرشفِيلد"

    # ── مرشحات المرحلة ١ (جميعها مرفوضة) ──
    - lemma: "هِيرشفِيلد"
      source: stage1
      decision: removed
      decision_reason: "يطابق تماماً اللمّة الموجودة «هيرشفيلد» بعد إضافة التشكيل — سيُعالج بأمر update_lemma على اللمّة الموجودة."
