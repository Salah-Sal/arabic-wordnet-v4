# ══════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد (التوليد الأعمى)
# ══════════════════════════════════════════════
stage1_review:
  assessment:
    concerns:
      - "المجموعة تخصّ فرداً بعينه (اسم علم لشخص تاريخي محدد) لا فئة مفاهيمية عامة، مما يجعل توليد اللمّات المرشحة بمنهج الاشتقاق أو المجاز أو التركيب متعذراً من حيث المبدأ؛ فالأسماء الأعلام لا تخضع لمنهجية التوليد المصطلحي العادية."
      - "التعريف لا يكشف عن اسم الشخص، مما يجعل «التوليد الأعمى» للمّات الاسم العلم محدوداً باجتهادات صوتية."
      - "كلتا اللمّتين الموجودتين (آل هيرشفيلد / هيرشفيلد) تخلوان من التشكيل الكامل."
      - "لمّة «آل هيرشفيلد» تستخدم «آل» تعريباً صوتياً للاسم الأول الإنجليزي «Al» (اختصار لـ Albert)، غير أن «آل» في العربية توحي بمعنى «عائلة» (كـ«آل البيت»)، مما قد يوقع القارئ في التباس دلالي. يُستحسن توثيق هذه الملاحظة في البيانات الوصفية."
    observations: "المجموعة من نوع «اسم العلم» (proper noun instance synset) مصنَّفة pos: n وفق اصطلاح ووردنت الشائع للأعلام. المدخل يعود إلى آل هيرشفيلد (1904–2003)، الرسام الأمريكي الذي اشتُهر بأسلوبه الفريد في رسم الكاريكاتور الخطي، ولا سيما صور نجوم المسرح والسينما بخطوط نابضة. التعريف العربي الحالي مقبول بنيوياً (جنس + فصل + تاريخ) لكنه يحتاج إلى تشكيل وضبط طفيف. الأسلوب الوحيد المتاح لتوليد لمّات اسم علم أجنبي هو التعريب الصوتي (تعريب). لا وجود لأي جذر عربي قياسي لهذين الاسمين."

  blind_candidates:
    - lemma: "هِيرشفِيلد"
      generation_method: taarib
      justification: "تعريب صوتي مباشر للقب «Hirschfeld» باعتماد الترتيب الصوتي المعتاد في الموسوعات العربية: ها-كسرة، ياء، راء ساكنة، شين، فاء-كسرة، ياء، لام ساكنة، دال. وهو الشكل الأكثر ورواجاً في المصادر العربية للإحالة إلى هذا الفنان."
    - lemma: "آلُ هِيرشفِيلد"
      generation_method: taarib
      justification: "تعريب الاسم الكامل «Al Hirschfeld» بإضافة «آل» مقابلاً للمقطع الأول «Al» (اختصار ألبرت)؛ صيغة مستخدمة في الموسوعات العربية للأعلام الأجنبية التي يبدأ اسمها بـ«Al» الإنجليزية."
    - lemma: "أَلْبَرْت هِيرشفِيلد"
      generation_method: taarib
      justification: "تعريب الاسم الكامل الرسمي «Albert Hirschfeld»؛ ذكر الاسم الأصلي يزيل الإيهام بين «آل» الإنجليزية الاسمية و«آل» العربية الدالة على العائلة."
    - lemma: "هِيرشفِيلت"
      generation_method: taarib
      justification: "بديل إملائي صوتي بإنهاء اللقب بالتاء بدلاً من الدال، كما يرد أحياناً في بعض المصادر العربية عند تعريب الأسماء الألمانية الأصل المنتهية بصوت مهموس."


# ════════════════════════════════
# المرحلة ٢: جمع الأدلة المعجمية
# ════════════════════════════════
# الاستعلامات المنفَّذة (ميزانية: ٣ استعلامات)
# ١. بحث دفعي في headword_norm لجميع اللمّات (الموجودة + المرشحات) — لم تُسفر عن نتائج.
# ٢. الجسر الإنجليزي عبر entries_translations_fts: "Hirschfeld" OR "Al Hirschfeld" OR "caricaturist" OR "caricature artist"
#    → نتيجتان:
#      أ. "الرسّام الكاريكاتوريّ" (translation_en:"caricaturist") في المورد الحديث — مصطلح عام لا علاقة له بالشخص.
#      ب. "أَنْفاقُ هرشفيلد (الأنفاق بين الأسنان)" (Hirschfeld's canals) في المعجم الطبي الموحد —
#         يعود إلى شخص آخر (د. إميل هيرشفيلد، التشريح السنّي)، لا صلة له بالرسام آل هيرشفيلد.
# ٣. بحث FTS عربي بكلمات مفتاحية: "كاريكاتور" OR "كاريكاتوري" OR "رسوم خطية"
#    → نتائج لمصطلح الكاريكاتور العام ومادة "رسم" وما اشتُقّ منها — لا شيء يخص الشخص.

stage2_evidence:
  query_log:
    - query_num: 1
      purpose: "بحث دفعي في headword_norm لجميع اللمّات (الموجودة + المرشحات)"
      terms_searched:
        - هيرشفيلد
        - الهيرشفيلد
        - هرشفيلد
        - الهرشفيلد
        - هيرشفيلت
        - الهيرشفيلت
      result_count: 0

    - query_num: 2
      purpose: "الجسر الإنجليزي — كل المصطلحات الإنجليزية دفعة واحدة"
      terms_searched:
        - "Hirschfeld"
        - "Al Hirschfeld"
        - "caricaturist"
        - "caricature artist"
      result_count: 2
      notes: "النتيجتان لا تتعلقان بالشخص المقصود: الأولى مصطلح عام (caricaturist)، والثانية تحيل إلى شخص مختلف (أنفاق هرشفيلد في التشريح السنّي)."

    - query_num: 3
      purpose: "FTS عربي — كلمات مفتاحية من التعريف"
      terms_searched:
        - كاريكاتور
        - كاريكاتوري
        - رسوم خطية
      result_count: 8
      notes: "جميع النتائج مصطلحات عامة تتعلق بفن الكاريكاتور، لا ترد فيها إشارة إلى آل هيرشفيلد."

  per_lemma:
    - lemma: "آل هيرشفيلد"
      evidence_status: "no_material_found"

    - lemma: "هيرشفيلد"
      evidence_status: "no_material_found"

    - lemma: "هِيرشفِيلد"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "آلُ هِيرشفِيلد"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "أَلْبَرْت هِيرشفِيلد"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "هِيرشفِيلت"
      source: stage1
      evidence_status: "no_material_found"

  side_finding:
    text: "«أَنْفاقُ هِرشفِيلد (الأَنْفاقُ بَيْنَ الأسنان)» — translation_en: Hirschfeld's canals (interdental canals)"
    source: "المعجم الطبي الموحد (2009)"
    relevance: "لا صلة بالمجموعة الترادفية — يحيل إلى شخص مختلف تماماً (اكتُشفت الأنفاق بين الأسنان على يد باحث طبي يحمل اللقب نفسه)."


