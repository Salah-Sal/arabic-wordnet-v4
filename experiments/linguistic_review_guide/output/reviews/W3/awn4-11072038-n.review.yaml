      decision_reason: "اللقب (اسم العائلة) منفرداً هو الصيغة الأكثر شيوعاً في السياقات الصحفية والنقدية بعد التعريف الأولي بالشخص. تعريب صوتي مباشر مستقر. يجب إضافة التشكيل الكامل."
