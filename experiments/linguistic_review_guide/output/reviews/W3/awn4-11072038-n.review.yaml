      decision_reason: "يطابق تماماً اللمّة الموجودة «آل هيرشفيلد» بعد إضافة التشكيل — سيُعالج بأمر update_lemma على اللمّة الموجودة."
      evidence_assessment:
        case: no_material

    - lemma: "أَلْبَرْت هِيرشفِيلد"
      source: stage1
      decision: removed
      decision_reason: "الاسم الكامل «Albert» غير مستخدم في الدوريات والموسوعات العربية؛ الفنان اشتُهر باختصار «Al» وليس «Albert». إدراج «ألبرت» يُضاف غرابةً لا قيمة تمييزية."
