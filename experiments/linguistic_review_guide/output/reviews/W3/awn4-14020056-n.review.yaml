# مراجعة المجموعة الترادفية — awn4-14020056-n
# repression — حالة الإخضاع القسري
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «قمع» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط — قد تحتاج إلى إثراء بمرادفات"
      - "التعريف العربي «حالة الإخضاع القسري» مقتضب ويحتاج إلى تفصيل"
    observations: "المفهوم يتعلّق بحالة سياسية/اجتماعية من الإخضاع بالقوة، وهو أخصّ من مطلق القهر أو الغلبة. الجذر ق م ع في العربية يحمل دلالة الإذلال والقهر كما في مقاييس اللغة، وهو ملائم تماماً. المفهوم له حضور قويّ في الخطاب السياسي العربي المعاصر."
  blind_candidates:
    - lemma: "كَبْت"
      generation_method: ishtiqaq
      justification: "مصدر كَبَتَ على وزن فَعْل، يدلّ على الردّ بعنف والإذلال والصرف عن الشيء. يُستخدم في السياقات السياسية والنفسية بمعنى قمع الحريات أو المشاعر."
    - lemma: "قَهْر"
      generation_method: ishtiqaq
      justification: "مصدر قَهَرَ على وزن فَعْل، يدلّ على الغلبة والأخذ من فوق على طريق التذليل. يُستخدم للتعبير عن حالة الإخضاع القسري."
    - lemma: "اضْطِهاد"
      generation_method: ishtiqaq
      justification: "مصدر اضْطَهَدَ على وزن افتعال من جذر ض ه د، يدلّ على المعاملة التعسّفية الجائرة من السلطة تجاه فئة من المجتمع."
    - lemma: "طُغْيان"
      generation_method: ishtiqaq
      justification: "مصدر طَغَى على وزن فُعْلان، يدلّ على تجاوز الحدّ في الظلم والاستبداد، وهو حالة من الإخضاع القسري المتطرّف."


stage2_evidence:
  per_lemma:
    - lemma: "قَمْع"
      confirm:
        - text: "«قمعه وأقمعه: قهره وأذلّه فانقمع»"
          source: "الصحاح للجوهري"
        - text: "«قَمَعَ فلاناً: منعه عمّا يريد، قهره وذلَّله»"
          source: "المعجم الوسيط"
        - text: "«قمع الشخصَ: زجره وردعه، قهره وذلّله — قمع غرائزه / الشغب / الثوار / التمرّد»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«قَمْع؛ إخماد؛ كَبْح إلخ.»"
          source: "المورد الحديث (2008) — ترجمة suppression"
      expands:
        - text: "«الْقَافُ وَالْمِيمُ وَالْعَيْنُ أُصُولٌ ثَلَاثَةٌ صَحِيحَةٌ: أَحَدُهَا نُزُولُ شَيْءٍ مَائِعٍ فِي أَدَاةٍ تُعْمَلُ لَهُ، وَالْآخَرُ إِذْلَالٌ وَقَهْرٌ، وَالثَّالِثُ جِنْسٌ مِنَ الْحَيَوَانِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الثاني (إذلال وقهر) هو الملائم لدلالة المجموعة الترادفية"

    - lemma: "كَبْت"
      confirm:
        - text: "«الكبت: الرد بعنف وتذليل»"
          source: "التعريفات للجرجاني (هرماني)"
        - text: "«الْكَافُ وَالْبَاءُ وَالتَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ مِنَ الْإِذْلَالِ وَالصَّرْفِ عَنِ الشَّيْءِ. يُقَالُ: كَبَتَ اللَّهُ الْعَدُوَّ يَكْبِتُهُ، إِذَا صَرَفَهُ وَأَذَلَّهُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«كبت = repression»"
          source: "مسرد الفلسفة وعلم النفس (ARABTERM)"
        - text: "«كبت = repression»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
      expands:
        - text: "«(1) كَبْحٌ (2) كَبْتٌ؛ كَظْمٌ (3) قمعٌ (4) إخضاع.»"
          source: "المورد الحديث (2008) — ترجمة repression"
          addition: "الكبت يأتي مقابلاً لـ repression في المعاجم ثنائية اللغة إلى جانب القمع"

    - lemma: "قَهْر"
      confirm:
        - text: "«القَهْرُ: الغَلَبَةُ والأَخذ من فَوق»"
          source: "لسان العرب لابن منظور"
        - text: "«القَهْرُ: الغَلَبَةُ والأَخْذُ من فَوْقٍ عَلَى طَرِيقِ التَّذْلِيل»"
          source: "تاج العروس للزبيدي"
      contradicts:
        - text: "«الْقَافُ وَالْهَاءُ وَالرَّاءُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى غَلَبَةٍ وَعُلُوٍّ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "القهر أعمّ من القمع — يدلّ على مطلق الغلبة والعلوّ، لا على حالة الإخضاع القسري المستمرّ تحديداً"

    - lemma: "اضْطِهاد"
      confirm:
        - text: "«المعاملةُ التَّعَسُّفِيَّةُ الجائرةُ من السُّلْطةِ تجاهَ فِئَةٍ من المجتمع؛ لأسبابٍ عِرْقِيَّةٍ أو مَذْهبيَّةٍ, أو لخلافاتٍ سياسيَّةٍ, ونَحْوِها»"
          source: "المعجم الكبير (OCR)"
      contradicts:
        - text: "«اضطهاد = persecution / oppression»"
          source: "مسرد الفلسفة وعلم النفس (ARABTERM)"
          conflict: "الاضطهاد يقابل persecution لا repression — فهو معاملة تعسّفية لفئة معيّنة لا حالة إخضاع عامّة"

    - lemma: "طُغْيان"
      contradicts:
        - text: "«تجاوزُ الحدِّ في الظلم أو فى الماء»"
          source: "المعجم الوسيط"
          conflict: "الطغيان يدلّ على تجاوز الحدّ في العصيان والظلم، وهو وصف لسلوك الطاغي لا لحالة المَقموع"
        - text: "«طغيان = tyranny»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
          conflict: "الطغيان يقابل tyranny لا repression — مفهوم مختلف"


stage3_analysis:
  per_lemma:
    - lemma: "قَمْع"
      decision: confirmed
      decision_reason: "لمّة أصيلة مؤصّلة في المعاجم الكلاسيكية والمعاصرة بدلالة الإذلال والقهر والمنع بالقوة، وهي المقابل العربي الأوّل لـ repression/suppression في المعاجم ثنائية اللغة. الجذر ق م ع في مقاييس اللغة يحمل أصل «إذلال وقهر» وهو مطابق لدلالة المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَمْع"

    - lemma: "كَبْت"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ الكبت يُستخدم مقابلاً لـ repression في بعض المعاجم، إلا أنّه في الاستعمال المعاصر انزاح دلالياً نحو القمع النفسي (الكبت الفرويدي) — أي إخفاء المشاعر والرغبات لا سيّما في علم النفس. أمّا المجموعة الترادفية فتصف حالة إخضاع سياسي/اجتماعي قسري، وهو ما يناسبه «القمع» أكثر. إضافة الكبت قد تُحدث خلطاً دلالياً مع المفهوم النفسي."
      evidence_assessment:
        case: mixed

    - lemma: "قَهْر"
      source: stage1
      decision: removed
      decision_reason: "القهر أعمّ من القمع — يدلّ على مطلق الغلبة والتذليل، ولا يختصّ بحالة الإخضاع القسري المنظّم. كما أنّه في القرآن والاستعمال الشائع يدلّ على صفة الله (القاهر القهّار) وعلى الغلبة في المعركة ونحوها، فلا يتطابق مع المعنى السياسي المحدّد للمجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "اضْطِهاد"
      source: stage1
      decision: removed
      decision_reason: "الاضطهاد يقابل persecution لا repression — فهو يدلّ على المعاملة التعسّفية الجائرة الموجّهة نحو فئة بعينها لأسباب عرقية أو دينية، بينما القمع (repression) حالة إخضاع قسري عامّة قد لا تستهدف فئة محدّدة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "طُغْيان"
      source: stage1
      decision: removed
      decision_reason: "الطغيان يصف سلوك الطاغي (تجاوز الحدّ في الظلم والعصيان) وليس حالة المقهورين. كما يقابل tyranny لا repression — وهما مفهومان مختلفان في التصنيف الدلالي."
      evidence_assessment:
        case: contradicts_only


