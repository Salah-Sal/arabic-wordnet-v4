      reason: >
        التعريف الحالي دوري جزئياً: يستخدم «الجناح» (وهو المصطلح نفسه) لتعريف
        المفهوم. كما أنه مقتضَب ولا يصف الموقع الجغرافي في الملعب ولا يُفرّق
        بين الجناح الأيمن والأيسر. يُراد تعريف يصلح للمجموعة كلها.
    authored:
      - type: terminological
        text: >
          لاعبٌ في كُرَةِ القَدَمِ وما شابَهَها مِنَ الرِّياضاتِ الجَماعِيَّةِ،
          يَتَّخِذُ مَوقِعَهُ بِالقُرْبِ مِنَ الخَطِّ الجانِبيِّ للمَلعَبِ،
          وهو نوعانِ: جَناحٌ أيمَنُ وجَناحٌ أيسَرُ
