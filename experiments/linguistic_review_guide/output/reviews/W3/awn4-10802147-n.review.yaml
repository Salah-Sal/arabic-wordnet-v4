# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (جناح) مدوَّنة بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "التعريف الحالي فيه دوران جزئي: يستخدم كلمة (الجناح) لتعريف لمّة هي نفسها (جناح)"
      - "المجموعة تفتقر إلى التعبير المركّب الاصطلاحي الشائع (لاعب الجناح) الذي يُستخدم في المعاجم الحديثة"
    observations: >
      المجموعة ترادفية بسيطة تتمحور حول مصطلح رياضي واحد. اللفظ «جناح» في كرة القدم
      مجازٌ حيٌّ راسخٌ: انتقل من معنى «الجانب والناحية» إلى تسمية موقع اللاعب القريب
      من الحدود الجانبية للملعب، ثم انتقل بالمجاز المُرسَل (إطلاق اسم المكان على
      صاحبه) ليدلّ على اللاعب نفسه. هذا الانتقال موثَّق في المعجم الوسيط والمعجم
      الكبير. المعجم يحتاج إلى لمّة مركّبة (لاعب الجناح) تكون الترجمة الصريحة
      للمصطلح الإنجليزي winger.

  blind_candidates:
    - lemma: "جَانِحٌ"
      generation_method: majaz
      justification: >
        اسم فاعل من «جَنَحَ» بمعنى مالَ إلى الجانب وانحرف نحوه؛ والمجاز واضح:
        اللاعب الذي يميل إلى الجانبين ويشتغل على هامش الملعب. إحياء للمعنى الأصلي
        الفراغي قبل تخصّصه في الاصطلاح القانوني (الجانح = المذنب).
    - lemma: "لَاعِبُ الجَنَاحِ"
      generation_method: tarkib
      justification: >
        مركَّب إضافي من «لاعب» + «الجناح»، يصف اللاعب بموقعه على الجناح. الأنسب
        لمصطلحات الرياضة حيث تسير على نمط «حارس المرمى» و«مدافع الأوسط».
        اختبار السكّ: التعبير وحدة ثابتة لا يمكن إبدال «الجناح» بمرادف آخر
        ويبقى المصطلح صالحاً في سياق التعيين الوظيفي.
    - lemma: "جَنَاحِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة على وزن فَعَالِيّ من «جَنَاح»، يُستخدم وصفاً اسمياً للدلالة على
        اللاعب المنتسب إلى موقع الجناح؛ أسلوب مشهود في «مركزي» و«دفاعي» وما شابه
        من الاشتقاقات الرياضية الحديثة.
    - lemma: "مُجَنِّحٌ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «جَنَّحَ» (فَعَّلَ) بمعنى جعل الشيء ذا جناحَيْن أو عمل على
        جناحه؛ على المجاز يدل على اللاعب الذي يُفعِّل ويُحرِّك جناح الهجوم.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "جناح"
      confirm:
        - text: >
            «أحدُ لاعبي كرة القدم الأحد عشر, وهما جناحان: أيمن وأيسر»
          source: "المعجم الوسيط (OCR)"
        - text: >
            «في لُعْبَةِ كُرَةِ القَدَم (wing): أَحدُ لاعبى الهُجُوم, ومكانه
            بالقُرْب من الحدود الخارجية للمَلْعَب»
          source: "المعجم الكبير (OCR)"
        - text: >
            «وَأَحَد لاعبي كرة الْقدَم الأَحَد عشر وهما جَنَاحَانِ أَيمن وأيسر»
          source: "المعجم الوسيط للمناوي (Hawramani)"
      expands:
        - text: >
            «جَنَاحَا العَسْكَر: جانِباهُ: المَيْمَنَةُ, والمَيْسَرةُ»
          source: "المعجم الكبير (OCR)"
          addition: >
            يكشف أن استعمال الجناح للدلالة على الطرف/الجانب في التشكيلات البشرية
            عريقٌ في اللغة، وهو ما مهّد الطريق لاستعماله الرياضي الحديث.
        - text: >
            «(الْجنَاح) مَا يطير بِهِ الطَّائِر وَنَحْوه وهما جَنَاحَانِ
            والعضد والإبط والجانب وَمِنْه جنَاح الْقصر وَنَحْوه والطائفة من
            الشَّيْء ... وأَحَد لاعبي كرة الْقدَم الأَحَد عشر»
          source: "المعجم الوسيط للمناوي (Hawramani)"
          addition: >
            يثبت التطوّر الدلالي المتسلسل: جناح الطائر ← جانب الجسم ← جانب
            الجيش ← جانب الملعب ← اللاعب في ذلك الجانب.

    - lemma: "جَانِحٌ"
      contradicts:
        - text: >
            «جانح: سلوك مضاد للمجتمع أو القانون.» (translation_en: delinquent)
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM)"
          conflict: >
            اللفظ «جانح» مستأثَرٌ في الاصطلاح القانوني والطبي بمعنى «المذنب/
            الجانح الحَدَث»، وهو متعارضٌ كلياً مع الدلالة الرياضية المقترحة.

    - lemma: "لَاعِبُ الجَنَاحِ"
      confirm:
        - text: >
            «لاعب الجَناح [في كرة القدم أو هوكي الجليد].»
            (translation_en: winger)
          source: "المورد الحديث (2008) — ARABTERM"

    - lemma: "جَنَاحِيٌّ"
      contradicts:
        - text: >
            «جَناحِيّ: ما يتعلّق بالجناح» (translation_en: alar)
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015) — ARABTERM"
          conflict: >
            الاصطلاح «جناحي» مُستخدَم في التشريح بمعنى «يتعلق بالجناح/العملية
            الجناحية»، وهو وصفٌ لا اسمٌ للاعب، مما يجعله غير صالح للمجموعة.

    - lemma: "مُجَنِّحٌ"
      contradicts:
        - text: >
            «مُجَنِّح: من يعمل للشيء جناحين، ومن يعد المخالفة أو الجريمة جنحة.»
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani)"
          conflict: >
            المعجم يقيّد «مجنِّح» بمعنيَيْن: الأول بنيوي (صانع الجناحين)،
            والثاني قانوني (من يصنّف الفعل جنحةً). لا شاهد على استعماله الرياضي.
        - text: >
            «مُجَنَّح: winged» (translation_en: winged / alate)
          source: "المعجم الطبي الموحد (ARABTERM)"
          conflict: >
            صيغة اسم المفعول «مجنَّح» تعني «ذو جناح / مجنَّح» في البيولوجيا والطب،
            وهي بعيدة عن الدلالة الرياضية.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "جناح"
      decision: confirmed
      decision_reason: >
        اللفظ موثَّق في المعجم الوسيط والمعجم الكبير بالمعنى الرياضي المقصود صراحةً،
        وهو مجازٌ مُرسَل راسخٌ تطوَّر عبر سلسلة دلالية واضحة (جانب الطائر ← جانب
        الجيش ← الجانب في الملعب ← اللاعب في ذلك الجانب). يجتاز جميع بوابات الجودة:
        اطّرادٌ مع الأوزان العربية، يُسرُ تداول، موثَّق في المعجمَيْن الرئيسيَّيْن،
        عربيٌّ أصيلٌ من الجذر (جنح). يحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبِّر عن اللاعب بمجاز مُرسَل (تسمية الشخص باسم موقعه)، شائعٌ في سياق
        التحليل التكتيكي والتعليق الرياضي: «سجَّل الجناحُ الأيمن الهدفَ الأول».
        وحيدٌ في المجموعة حالياً؛ يتمايز عن المركَّب «لاعب الجناح» بكونه أكثر
        إيجازاً واستعمالاً في الخطاب العفوي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَنَاحٌ"

    - lemma: "جَانِحٌ"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ مُستأثَرٌ في الاصطلاح القانوني والنفسي بمعنى «الجانح الحَدَث / المذنب»
        (delinquent)، وهو معنى راسخٌ يتعارض تماماً مع الدلالة الرياضية. استعادة المعنى
        الفراغي الأصلي ستُولِّد لَبْساً مصطلحياً خطيراً.

    - lemma: "لَاعِبُ الجَنَاحِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        التعبير المركَّب موثَّقٌ في المورد الحديث (2008) ترجمةً صريحة لـwinger في
        سياق كرة القدم وهوكي الجليد. يجتاز اختبار السكّ: الوحدة ثابتة لا تقبل
        الاستبدال الحر. يُعدّ الاستخدام الرسمي المصطلحي في مقابل «جناح» الذي هو
        الاستخدام العفوي المختصَر.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        مركَّب إضافي صريح يُبرِز دور اللاعب: «لاعب» (الجنس) + «الجناح» (الفصل
        الموضعي). يُستخدم في السياقات التقنية والرسمية والتعليمية حين يُراد التوضيح
        المصطلحي. يتمايز عن «جناح» المختصَر المستعمَل في التعليق الحي والتحليل السريع.
      actions:
        - command: create_entry
          params:
            lemma: "لَاعِبُ الجَنَاحِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "جَنَاحِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة موجودة في المعجم بمعنى «يتعلق بالجناح» (alar) في التشريح، وهي صفة
        لا اسمٌ للاعب. استخدامها اسماً للشخص يُخالف الاستعمال المعجمي الموثَّق
        ويُفضي إلى التباس مع الاصطلاح التشريحي.

    - lemma: "مُجَنِّحٌ"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ موجود بمعنيَيْن: بنيوي (صانع الجناحين) وقانوني (من يصنّف فعلاً جنحةً).
        لا شاهد على استعماله الرياضي، ولا تدعمه قواعد الاشتقاق الوظيفي لمصطلحات
        الرياضة الحديثة.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "(في الرياضة) لاعب في مركز الجناح"
    assessment:
