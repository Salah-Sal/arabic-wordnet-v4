          الجَليدِ، اللاعبُ الذي يَعمَلُ على أحَدِ جانِبَيِ الفَريقِ بَعيداً
          عَنِ المَركَزِ، مُهِمَّتُهُ الأساسيَّةُ الانطِلاقُ على الأجنِحَةِ
          وتَمريرُ الكُرَةِ أو التَّسدِيدُ نحوَ المَرمى
