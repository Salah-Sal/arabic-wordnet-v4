# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11223910-n  |  ILI: i96388
# المهندس المعماري الإيطالي بيير لويجي نيرفي (١٨٩١-١٩٧٩)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (أعمى) ────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل وهو إلزامي لكل لمّة مؤكَّدة"
      - "التعريف الحالي يستخدم الأرقام الغربية (1891-1979) بدلاً من الأرقام العربية (١٨٩١-١٩٧٩)"
      - "كلمة «معماري» وحدها تكفي عُرفاً، لكن النمط الموسوعي يُفضّل «مهندس معماري» لتجنّب الالتباس مع الصفة"
      - "لا يوجد تمييز صريح بين دور اللمّة الكاملة (اسم رسمي) ولمّة الاسم الأخير (اسم مختصر للتداول)"
    observations: >
      هذه المجموعة تُدرج اسمَ علمٍ لمهندس معماري إيطالي شهير، وهو نوع خاص من المداخل المعجمية
      يختلف عن الأسماء العامة. الاسم معرَّب بالنقل الصوتي من الإيطالية: Pier Luigi Nervi.
      اللمّتان الموجودتان تمثّلان نمطاً معجمياً طبيعياً في AWN للأعلام الأجنبية: الاسم الكامل
      الرسمي وصيغة الاسم الأخير المختصرة. المجموعة سليمة في هيكلها ولكنها تحتاج تشكيلاً
      وتحسيناً في التعريف.
  blind_candidates:
    - lemma: "نِيرْفِي"
      generation_method: taarib
      justification: >
        تعريب صوتي لاسم الأسرة الإيطالي Nervi (< لاتيني nervus = عصب/وتر)؛
        الصيغة المختصرة الشائعة في الإحالة على هذا المهندس في المصادر العربية المعاصرة.
    - lemma: "بِيِيرْ لُوِيجِي نِيرْفِي"
      generation_method: taarib
      justification: >
        تعريب صوتي كامل للاسم الثلاثي Pier Luigi Nervi؛ Pier (من Pietro الإيطالية) →
        بِيِيرْ، Luigi → لُوِيجِي، Nervi → نِيرْفِي. يُستخدم في السياقات الأكاديمية والتوثيقية.
    - lemma: "بِيِيرْ نِيرْفِي"
      generation_method: taarib
      justification: >
        صيغة تعريب ثنائية تحذف الاسم الأوسط «لويجي»، شائعة في بعض المصادر العربية والصحفية
        التي تختصر إلى الاسم الأول والأخير فقط.
    - lemma: "بِيَرْ لُوِيجِي نِيرْفِي"
      generation_method: taarib
      justification: >
        صيغة تعريب بديلة لـ Pier حيث تُنقل الثنائية /je/ إلى «يَـ» بدلاً من «يِيـ»، نمط
        وارد في بعض المعاجم العربية لأسماء إيطالية/فرنسية مشابهة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   [Q1] مطابقة دقيقة لجميع اللمّات + المرشحات — نتيجة: لا مداخل
#   [Q2] جسر إنجليزي: "Nervi" OR "Pier Luigi Nervi" — نتيجة: نتائج طبية لا صلة لها
#   [Q3] FTS عربي: "خرسانة مسلحة" OR "خرسانة" OR "معماري" — نتيجة: مصطلحات تقنية عامة
# ملاحظة: عدم الوجود متوقَّع تماماً لأن المجموعة تمثّل اسم علم لشخص أجنبي.
stage2_evidence:
  per_lemma:
    - lemma: "بيير لويجي نيرفي"
      evidence_status: "no_material_found"
    - lemma: "نيرفي"
      evidence_status: "no_material_found"
    - lemma: "نِيرْفِي"
      evidence_status: "no_material_found"
    - lemma: "بِيِيرْ لُوِيجِي نِيرْفِي"
      evidence_status: "no_material_found"
    - lemma: "بِيِيرْ نِيرْفِي"
      evidence_status: "no_material_found"
    - lemma: "بِيَرْ لُوِيجِي نِيرْفِي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "بيير لويجي نيرفي"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المُعرَّب لـ Pier Luigi Nervi هو التعريب القياسي الأوثق في المصادر
        العربية المعتمدة (الموسوعات، الكتب الأكاديمية). يُستخدم في السياقات الرسمية
        والتوثيقية. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الكامل (اسم أول + اسم أوسط + لقب)؛ يُستخدم في التوثيق الأكاديمي
        والببليوغرافي والموسوعي، ويمثّل المرجعية الأكثر دقةً وتفصيلاً في تعريف شخصية هذا
        المعماري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِيِيرْ لُوِيجِي نِيرْفِي"

    # ── لمّة موجودة ٢ ──
    - lemma: "نيرفي"
      decision: confirmed
      decision_reason: >
        الاسم الأخير «نيرفي» هو الصيغة المختصرة الشائعة في الإشارة إلى هذا المهندس في
        النصوص التخصصية والصحفية. عدم وجوده في قواعد البيانات المعجمية متوقَّع لكونه اسم
        علم أجنبي؛ التعريب الصوتي صحيح ومطّرد. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم الأخير (اللقب العائلي) المختصر؛ أكثر شيوعاً في الاستخدام الصحفي والإشاري
        السريع، كما في «اشتُهر نيرفي بأسلوبه في الخرسانة المسلحة». لا يُحدِّد من بين
        أفراد العائلة إن وُجد غيره.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِيرْفِي"

    # ── مرشح المرحلة ١: أ ──
    - lemma: "نِيرْفِي"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة «نيرفي» بعد إضافة التشكيل؛ إدراجه كمدخل جديد يُنشئ تكراراً.
        التصحيح المطلوب هو update_lemma على المدخل الموجود لا إنشاء مدخل جديد.

    # ── مرشح المرحلة ١: ب ──
    - lemma: "بِيِيرْ لُوِيجِي نِيرْفِي"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة «بيير لويجي نيرفي» بعد إضافة التشكيل؛ الإجراء المناسب هو
        update_lemma على المدخل القائم.

    # ── مرشح المرحلة ١: ج ──
    - lemma: "بِيِيرْ نِيرْفِي"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة غير موثَّقة في المصادر الأكاديمية العربية المعتمدة؛ المجموعة تضمّ بالفعل
        الشكلَين الكافيَين: الاسم الكامل الثلاثي والاسم الأخير وحده، فلا حاجة لصيغة ثنائية
        وسطى غير قياسية.

    # ── مرشح المرحلة ١: د ──
    - lemma: "بِيَرْ لُوِيجِي نِيرْفِي"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب الأكثر شيوعاً وتوثيقاً في المصادر العربية هو «بِيِيرْ» لا «بِيَرْ»؛ الصيغة
        الثانية مرجوحة ودخيل محتمل من لغات أخرى. إبقاء الصيغة المُثبَتة أولى من إضافة
        بديل مرجوح.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
# تعالج المرحلتان ٤ و٥ فقط اللمّتين المؤكَّدتين من المرحلة ٣:
# بِيِيرْ لُوِيجِي نِيرْفِي  |  نِيرْفِي
stage4_content:
  definition:
    current: "معماري إيطالي كان رائداً في استخدام الخرسانة المسلحة (1891-1979)"
    assessment:
      decision: revise
      reason: >
        ثلاثة أوجه تستوجب التعديل:
        (١) «معماري» وصف لا يكفي وحده كجنس قريب لترجمة engineer — الأصح «مهندس معماري».
        (٢) الأرقام الغربية (1891-1979) تُستبدل بالأرقام العربية (١٨٩١-١٩٧٩) وفق أسلوب
        المعجم الوسيط.
        (٣) صيغة «كان رائداً في استخدام» أقرب إلى الترجمة الحرفية من الإنجليزية؛ الأسلوب
        المعجمي العربي يُفضّل البناء الجملي الفعلي أو المصدري الأكثر إيجازاً.
    authored:
      - type: encyclopedic
        text: >
          مهندس معماري إيطالي (١٨٩١-١٩٧٩)، رائدٌ في توظيف الخرسانة المسلحة في الإنشاء
          المعماري؛ ابتكر أشكالاً هيكلية جريئة جمعت بين الكفاءة الإنشائية والجماليات
          المعمارية، من أبرز أعماله قاعة الرياضات الأولمبية في روما (١٩٦٠).
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11223910-n"
          definition_index: 0
          text: >
            مهندس معماري إيطالي (١٨٩١-١٩٧٩)، رائدٌ في توظيف الخرسانة المسلحة في الإنشاء
            المعماري؛ ابتكر أشكالاً هيكلية جريئة جمعت بين الكفاءة الإنشائية والجماليات
            المعمارية، من أبرز أعماله قاعة الرياضات الأولمبية في روما (١٩٦٠).

  examples:
    per_lemma:
      - lemma: "بِيِيرْ لُوِيجِي نِيرْفِي"
        examples:
          - text: >
              صمَّم بِيِيرْ لُوِيجِي نِيرْفِي عدداً من أشهر المنشآت الرياضية في إيطاليا،
              مستثمِراً خصائص الخرسانة المسلحة في تحقيق قِبابٍ رقيقة ذات مساحات شاسعة
              خاليةٍ من الدعامات.
            type: usage
      - lemma: "نِيرْفِي"
        examples:
          - text: >
              يُعدُّ نِيرْفِي من أبرز مَن أسهموا في تحويل الخرسانة المسلحة من مادةٍ
              إنشائية خامٍ إلى أداةٍ للتعبير المعماري الجمالي خلال القرن العشرين.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            صمَّم بِيِيرْ لُوِيجِي نِيرْفِي عدداً من أشهر المنشآت الرياضية في إيطاليا،
            مستثمِراً خصائص الخرسانة المسلحة في تحقيق قِبابٍ رقيقة ذات مساحات شاسعة
            خاليةٍ من الدعامات.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            يُعدُّ نِيرْفِي من أبرز مَن أسهموا في تحويل الخرسانة المسلحة من مادةٍ
            إنشائية خامٍ إلى أداةٍ للتعبير المعماري الجمالي خلال القرن العشرين.


