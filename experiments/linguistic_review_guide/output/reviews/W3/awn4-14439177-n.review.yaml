# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14439177-n
# alienation / estrangement — الانفصال الناتج عن العداء
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «نفرة» غير مؤيَّدة معجمياً بمعنى الانفصال الناتج عن العداء؛ المعاجم تسجّلها بمعنى التعويذة أو الجماعة"
      - "لمّة «اغتراب» دلالتها أوسع من المجموعة: تشمل الاغتراب النفسي والفلسفي والجغرافي، لا الانفصال بسبب العداء فحسب"
      - "التعريف العربي الحالي ترجمة حرفية مختصرة تحتاج إلى إعادة صياغة"
    observations: >-
      المجموعة تعبّر عن مفهوم القطيعة والجفاء الناتجَيْن عن العداوة، وهو مفهوم
      راسخ في الثقافة العربية. اللمّتان الموجودتان تغطّيان جانبَيْن مختلفَيْن:
      «اغتراب» يركّز على الشعور بالبُعد، و«نفرة» تركّز على الانقباض. لكن
      القطيعة (الهجران والصدّ) هي الأقرب للتعريف الإنجليزي.
  blind_candidates:
    - lemma: "قَطِيعَة"
      generation_method: ishtiqaq
      justification: >-
        من الجذر ق-ط-ع على وزن فَعِيلَة، بمعنى الصَّرم والإبانة. القطيعة
        هي الهجران والصدّ، وهو أدقّ تعبير عن الانفصال الناتج عن العداوة.
    - lemma: "تَنَافُر"
      generation_method: ishtiqaq
      justification: >-
        من الجذر ن-ف-ر على وزن تَفَاعُل، يدلّ على التباعد المتبادل والتخاصم.
        استُعمل في المعاجم الحديثة بمعنى التخاصم والتجافي.
    - lemma: "جَفْوَة"
      generation_method: ishtiqaq
      justification: >-
        من الجذر ج-ف-و على وزن فَعْلَة، معناه الجفاء والتباعد بين الناس.
        مقاييس اللغة: «يدلّ على نُبُوّ الشيء عن الشيء».
    - lemma: "نُفُور"
      generation_method: ishtiqaq
      justification: >-
        من الجذر ن-ف-ر على وزن فُعُول (مصدر)، يدلّ على التجافي والتباعد.
        مسجّل في مسرد علم الاجتماع بمعنى antipathy.

stage2_evidence:
  per_lemma:
    - lemma: "اِغْتِرَاب"
      confirm:
        - text: "«alienation — اغتراب»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
        - text: "«alienation — اغتراب»"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
        - text: "«عملية الابتعاد عن الثقافة الأصلية — alienation — استلاب، اغتراب»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "«ابتعاد عن كل شيء — getting away from all that — اغتراب»"
          source: "مسرد الفن والتسلية والرياضة (ArabTerm)"
          addition: "يوسّع الدلالة إلى الابتعاد المطلق لا المقتصر على العداء"
        - text: "«(1) «أ» تنفير؛ إبعاد. «ب» نفور (2) تحويل المِلْكية (3) جنون؛ خَبَل (4) اغتراب؛ استلاب؛ ضَياع — alienation»"
          source: "المورد الحديث (2008)"
          addition: "يُظهر تعدد معاني alienation؛ الاغتراب هو المعنى النفسي فقط"
        - text: "«الغُرْبَةُ: البُعْدُ عَنِ الوَطَن»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر غ-ر-ب يدلّ على البُعد المكاني لا العدائي"

    - lemma: "نَفْرَة"
      contradicts:
        - text: "«النُّفْرَةُ: ما يُعلَّق على الصِّبيان لردِّ العين»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يسجّل النُّفْرَة بمعنى التعويذة لا بمعنى الانفصال"
      expands:
        - text: "«النُّونُ وَالفَاءُ وَالرَّاءُ أَصلٌ صَحيحٌ يَدُلُّ عَلَى تَجَافٍ وَتَبَاعُد»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ن-ف-ر يدعم دلالة التباعد، لكن الصيغة نَفْرَة لم تُسجَّل معجمياً بهذا المعنى"

    - lemma: "قَطِيعَة"
      confirm:
        - text: "«القَطِيعَةُ: الهِجْرانُ والصَّدُّ. ومنه تَرْكُ البِرّ والإحسان إلى الأهل والأقارب»"
          source: "المعجم الوسيط"
        - text: "«القَافُ وَالطَّاءُ وَالعَيْنُ أَصلٌ صَحيحٌ يَدُلُّ عَلَى صَرْمٍ وَإبَانَةِ شَيءٍ مِنْ شَيءٍ. والقَطِيعَةُ: الهِجْرَانُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«القطيعة والمصارمة والمجانية والمباينة والمباعدة والمشاحنة والمهاجرة والهجران»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
      expands:
        - text: "«(القطيعة) الهجران والصدّ ومنه ترك البرّ والإحسان إلى الأهل والأقارب ومن الشيء ما قطعته منه والجزء من الأرض يملكه الحاكم لمن يريد من أتباعه منحة»"
          source: "المعجم الوسيط (حوراماني)"
          addition: "للقطيعة معنى آخر: الإقطاع (قطعة أرض)، لكنه لا يُشكل إلا بسياقه"

    - lemma: "تَنَافُر"
      contradicts:
        - text: "«التنافرُ: إِيرَاد الكلام على وَجه لا يسهل على اللسان»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المعنى الاصطلاحي الأوّل للتنافر هو ثقل اللسان في البلاغة لا الانفصال بين الناس"
        - text: "«discord — تنافر» / «repulsion — تنافر» / «incompatibility — تنافر»"
          source: "معاجم ArabTerm متعددة"
          conflict: "التنافر في المصطلحات الحديثة = التنافر الفيزيائي أو عدم التوافق، لا الانفصال الاجتماعي بسبب العداء"
      confirm:
        - text: "«تَنَافَرَ القومُ: تخاصموا وتفاخروا»"
          source: "المعجم الوسيط"
      expands:
        - text: "«تَنَافُر: التباعد والمخاصمة والتفاخر»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يشمل التفاخر وهو غير موجود في دلالة المجموعة"

    - lemma: "جَفْوَة"
      confirm:
        - text: "«الجَفَاءُ. يقال: رجُلٌ ظاهرُ الجَفْوَةِ. أصابتْه جَفْوَةُ الزَّمان (مجاز). يقال: رجلٌ به جِفْوَةٌ: إذا كان مَجْفُوًّا من النَّاس»"
          source: "المعجم الكبير"
      expands:
        - text: "«الجِيمُ وَالفَاءُ وَالحَرْفُ المُعْتَلُّ يَدُلُّ عَلَى أَصلٍ وَاحِدٍ: نُبُوُّ الشَّيءِ عَنِ الشَّيءِ. والجَفَاءُ: خِلَافُ البِرِّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجفوة تدلّ على نُبُوّ الشيء عن الشيء وهو خلاف البرّ، وهذا قريب من الانفصال الناتج عن العداء لكنه أخفّ"

    - lemma: "نُفُور"
      confirm:
        - text: "«antipathy — نفور»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
      expands:
        - text: "«النُّونُ وَالفَاءُ وَالرَّاءُ أَصلٌ صَحيحٌ يَدُلُّ عَلَى تَجَافٍ وَتَبَاعُد»"
          source: "مقاييس اللغة لابن فارس"
          addition: "النفور مصدر يدلّ على الشعور بالتجافي لا على حالة الانفصال الناتجة"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِغْتِرَاب"
      decision: confirmed
      decision_reason: >-
        مصطلح راسخ في علم الاجتماع وعلم النفس بمعنى alienation، مؤيَّد بمعاجم
        ArabTerm المتعددة. وإن كانت دلالته أوسع من المجموعة (تشمل الاغتراب
        الوجودي والجغرافي)، فإنه يغطّي المعنى المطلوب ضمنياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يركّز على البُعد النفسي والشعوري بالغُربة عن المحيط، وقد يكون ناتجاً
        عن عداء أو عن عوامل أخرى. أعمّ من قطيعة ونفرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِغْتِرَاب"

    - lemma: "نَفْرَة"
      decision: confirmed
      decision_reason: >-
        من الجذر ن-ف-ر الدالّ على التجافي والتباعد (مقاييس اللغة). وإن كانت
        صيغة نُفْرَة (بالضم) تعني التعويذة، فإنّ نَفْرَة (بالفتح) تُستعمل
        في الفصحى المعاصرة بمعنى الانقباض والتباعد بسبب الكراهية. الفعل نَفَرَ
        من الشيء ونَفْرَة مصدر مرّة يدلّ على حدث تباعد واحد.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تدلّ على ردّ فعل انفعالي حادّ ولحظي تجاه شخص أو موقف، وهي أخصّ من
        اغتراب وأقلّ ديمومة من قطيعة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَفْرَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "قَطِيعَة"
      source: stage1
      decision: confirmed
      decision_reason: >-
        أقوى المرشحات أدلّةً: المعجم الوسيط يعرّفها بـ«الهجران والصدّ»، ومقاييس
        اللغة يردّها إلى «صَرْم وإبانة شيء من شيء». تطابق تعريف المجموعة
        (الانفصال الناتج عن العداء) تطابقاً شبه تامّ. ثبتت في باب القطيعة
        عند ابن مالك مع المصارمة والمهاجرة والهجران.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        تدلّ على قطع العلاقة قطعاً تامّاً مع هجران وصدّ، وهي أشدّ من الاغتراب
        وأدوم من النفرة. تُستعمل خاصّةً في سياق الأرحام والعلاقات الاجتماعية.
      actions:
        - command: create_entry
          params: {lemma: "قَطِيعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَنَافُر"
      source: stage1
      decision: removed
      decision_reason: >-
        دلالته الأولى اصطلاحية بلاغية (ثقل اللسان)، ودلالته الحديثة تتوزّع
        على التنافر الفيزيائي وعدم التوافق والنشاز. وإن سجّل الوسيط «تخاصموا»
        للفعل، فإنّ المصدر تنافُر لا يدلّ على حالة انفصال ناتجة بل على فعل
        تخاصم متبادل. الاشتراك اللفظي الكثيف يجعله غير مناسب.

    - lemma: "جَفْوَة"
      source: stage1
      decision: removed
      decision_reason: >-
        الجفوة تدلّ على الجفاء وهو خلاف البرّ وسوء المعاملة، لا على الانفصال
        التامّ. هي أقرب إلى «المعاملة الخشنة» منها إلى «الانفصال الناتج عن
        العداء». الفرق الدلالي كبير بما يكفي لإقصائها من هذه المجموعة.

    - lemma: "نُفُور"
      source: stage1
      decision: removed
      decision_reason: >-
        النفور مصدر يدلّ على الشعور بالتجافي والكراهية (antipathy)، وهو وصف
        للحالة الشعورية لا لنتيجة الانفصال. المجموعة تبحث عن حالة الانفصال
        الناتجة (separation resulting from hostility) لا عن الشعور المسبِّب لها.

