# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11025046-n  |  ILI: i95289
# الاسم: بيتر غولدمارك (Peter Carl Goldmark)
# التاريخ: 2026-03-21
# ══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة اسم علم لشخص تاريخي محدد؛ لا يمكن توليد مصطلح عربي أصيل عبر الاشتقاق أو المجاز أو التركيب، إذ الضبط الوحيد الممكن هو التعريب الصوتي للاسم الأجنبي."
      - "اللمّتان الموجودتان (بيتر غولدمارك، غولدمارك) تفتقران إلى التشكيل الكامل المطلوب."
      - "التعريف الحالي يحمل معلومة مضللة: عبارة 'أول بث تلفزيوني' غير دقيقة؛ والأصح 'أول بث تلفزيوني ملوّن'، إذ يُنسب إلى غولدمارك تحديداً أول عرض للتلفزيون الملوّن لا أول البث التلفزيوني على الإطلاق."
      - "اللمّة Peter Carl Goldmark الواردة في OEWN غائبة من المجموعة العربية."
    observations: "هذه المجموعة خاصة بشخصية تاريخية بعينها هي بيتر كارل غولدمارك (1906-1977)، مخترع أمريكي مجري الأصل اشتُهر بريادته في البث التلفزيوني الملوَّن (1940)، واختراع الأسطوانة الممتدة (LP) (1948)، وريادته في تقنية تسجيل الفيديو على شريط الكاسيت. لمّا كانت المجموعة اسم علم لشخص بعينه، فإن جميع اللمّات المُرشَّحة لا تعدو تعريبات صوتية متنوعة للاسم ذاته؛ ومن ثَمَّ لا تنتمي إلى الاشتقاق ولا المجاز ولا التركيب العربي الأصيل. الخيار الوحيد هو التعريب (taarib)."
  blind_candidates:
    - lemma: "بِيتَر غُولدمارك"
      generation_method: taarib
      justification: "التعريب الصوتي المعتاد للاسم الأوروبي المُكوَّن من الاسم الأول (بيتر) والكنية (غولدمارك)؛ الغين المعجمة تُستخدم بديلاً صوتياً مقبولاً عن حرف G الإنجليزي في اللهجات الأوروبية الشمالية والألمانية."
    - lemma: "بِيتَر كَارل غُولدمارك"
      generation_method: taarib
      justification: "الاسم الرسمي الكامل بذكر الاسم الأوسط كارل؛ يُستخدم في السياقات الموسوعية والأكاديمية والتوثيقية للدلالة الدقيقة على الهوية وتمييز الشخص عن أقاربه."
    - lemma: "بِيتَر جُولدمارك"
      generation_method: taarib
      justification: "تعريب بديل باستعمال الجيم بدلاً من الغين لتأدية صوت G الإنجليزي؛ شائع في بعض المصادر العربية الصحفية."
    - lemma: "غُولدمارك"
      generation_method: taarib
      justification: "الكنية وحدها (اللقب العائلي)، وهي الصيغة المختصرة الأكثر تداولاً في السياق الأكاديمي والإعلامي حين يكون المقصود معروفاً سلفاً من السياق."


