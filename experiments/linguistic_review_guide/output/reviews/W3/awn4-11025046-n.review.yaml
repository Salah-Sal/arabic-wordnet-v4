    # ── لمّات موجودة ──
    - lemma: "بيتر غولدمارك"
      decision: confirmed
      decision_reason: "الصيغة الأشيع والأكثر تداولاً في المصادر العربية الموسوعية والإعلامية لهذه الشخصية، تجمع الاسم الأول والكنية. تحتاج إلى إضافة التشكيل الكامل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
      nuance_differentiation: "الصيغة المركَّبة الأكثر شيوعاً في المصادر العربية، تجمع الاسم الأول والكنية وهي الرجوع المعتاد في التعريفات الأولى."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِيتَر غُولدمارك"

    - lemma: "غولدمارك"
      decision: confirmed
      decision_reason: "الكنية وحدها صيغة مختصرة معهودة في الكتابة الأكاديمية والإعلامية بعد ذكر الاسم الكامل. تحتاج إلى إضافة التشكيل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "صيغة مختصرة تقتصر على الكنية العائلية، تُستعمل في السياقات الأكاديمية والإعلامية للإيجاز حين يكون المقصود واضحاً من السياق."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غُولدمارك"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بِيتَر غُولدمارك"
      source: stage1
      decision: removed
      decision_reason: "يتطابق مع اللمّة الموجودة (بيتر غولدمارك) بعد التشكيل؛ المعالجة تتم عبر update_lemma على المدخل الموجود لا بإنشاء مدخل مكرر."

    - lemma: "بِيتَر كَارل غُولدمارك"
      source: stage1
      decision: confirmed
      decision_reason: "يُقابل اللمّة الإنجليزية Peter Carl Goldmark الواردة في OEWN وغائبة عن المجموعة العربية. الاسم الرسمي الكامل بذكر الاسم الأوسط كارل ضروري للتوثيق الموسوعي الدقيق."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
      nuance_differentiation: "الاسم الرسمي الكامل بذكر الاسم الأوسط، يُستخدم في التوثيق الموسوعي والمراجع الأكاديمية الرسمية للتحديد الدقيق للهوية."
      actions:
        - command: create_entry
          params:
            lemma: "بِيتَر كَارل غُولدمارك"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "بِيتَر جُولدمارك"
      source: stage1
      decision: removed
      decision_reason: "تعريب بالجيم بديل عن الغين المعجمة؛ الصيغة بالغين (غولدمارك) أكثر تواتراً وأدق صوتياً لأداء الصوت الاحتكاكي الخلفي في الألمانية الأصل للاسم. الجمع بين صيغتين متطابقتين إلا في حرف واحد يُولِّد تشويشاً معجمياً بلا فائدة."

    - lemma: "غُولدمارك"
      source: stage1
      decision: removed
      decision_reason: "يتطابق مع اللمّة الموجودة (غولدمارك) بعد التشكيل؛ المعالجة تتم عبر update_lemma على المدخل الموجود."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
