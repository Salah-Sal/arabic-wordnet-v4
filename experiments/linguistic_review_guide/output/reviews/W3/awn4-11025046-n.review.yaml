  definition:
    current: "مخترع أمريكي (ولد في المجر) قام بأول بث تلفزيوني عام 1940 واخترع الأسطوانة طويلة التشغيل عام 1948 وكان رائداً في تسجيل الفيديو كاسيت (1906-1977)"
    assessment:
      decision: revise
      reason: "التعريف صحيح في مجمله لكنه يحتاج إلى تدقيق في ثلاثة مواضع: (١) 'أول بث تلفزيوني' مُضلِّلة؛ المقصود أول بث تلفزيوني ملوَّن لا أول بث تلفزيوني على الإطلاق. (٢) 'الأسطوانة طويلة التشغيل' صياغة مقبولة لكن 'الأسطوانة الممتدة (LP)' أدق وأكثر تداولاً في الأوساط التقنية. (٣) 'تسجيل الفيديو كاسيت' ركيك أسلوبياً، والأنسب 'تسجيل الفيديو على شريط الكاسيت'. (٤) صياغة 'مخترع أمريكي (ولد في المجر)' يمكن تحسينها إلى 'مخترع أمريكي مجري الأصل' للسلاسة."
    authored:
      - type: encyclopedic
        text: "مخترع أمريكي مجري الأصل (1906-1977)، أجرى أوّلَ عرضٍ للبث التلفزيوني الملوَّن عام 1940، واخترع الأسطوانة الممتدة (LP) عام 1948، وكان من رواد تقنية تسجيل الفيديو على شريط الكاسيت."
