# الاستعلامات المُنفَّذة:
#   ١. مطابقة دُفعية لجميع اللمّات الموجودة والمرشحات (نتيجة: فارغة)
#   ٢. جسر إنجليزي لـ Goldmark / Peter Goldmark / Peter Carl Goldmark (نتيجة: فارغة)
#   ٣. FTS عربي بكلمات مفتاحية: غولدمارك، جولدمارك، بيتر (نتيجة: إحالات غير ذات صلة)
