  per_entry:
    - lemma: "مَنْع"
      entry_id: "{auto}"
      root: "منع"
      maqayis_quote: "«الْمِيمُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ هُوَ خِلَافُ الْإِعْطَاءِ. وَمَنَعْتُهُ الشَّيْءَ مَنْعًا، وَهُوَ مَانِعٌ وَمَنَّاعٌ.»"
    - lemma: "حَظْر"
