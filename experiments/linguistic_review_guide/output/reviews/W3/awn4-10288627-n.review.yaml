# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10288627-n  |  ILI: i91066  |  POS: n
# EN: a person who fixes the boundaries of land claims
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - >
        اللمّة الوحيدة «محدد المواقع» تحمل اشتراكاً لفظياً مؤثِّراً في العربية
        المعاصرة: يُفهم منها في الغالب أجهزةُ تحديد المواقع الجغرافية (GPS
        locator) أو التطبيقات الرقمية، لا المهنيَّ المتخصص في ترسيم حدود
        مطالبات الأراضي.
      - >
        التعريف العربي الحالي «شخص يحدد حدود مطالبات الأراضي» ترجمةٌ حرفية
        من الإنجليزية؛ ويحتوي على تكرار صرفي (حدود ← حدَّد) وتعبير «مطالبات
        الأراضي» ركيك أسلوبياً.
      - >
        اللمّة الموجودة خالية من التشكيل الكامل المطلوب.
    observations: >
      المجموعة تصف متخصصاً يقوم بتعيين الحدود القانونية لقطع الأراضي وترسيمها
      في السجلات العقارية، وهو تخصص فرعي من المساحة (hypernym: مساح/مهندس مساحة).
      المصطلح المثالي ينبغي أن يستدعي دلالة «الترسيم» أو «الضبط»
      أو «التخطيط» المرتبطة بالأراضي تحديداً، لا دلالة الكشف الموضعي الرقمي.
      المقاييس تمنحنا ذخيرة ثرية: التُّخوم (أعلام الأرض وحدودها)، وفرز (عزل
      الشيء عن غيره)، وحوز (الجمع والتجمع والضم إلى النفس).

  blind_candidates:
    - lemma: "مُحَدِّدُ التُّخُومِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: مُحَدِّد (اسم فاعل من حدَّدَ) + التُّخوم (حدود الأرض
        وأعلامها؛ لفظ عربي قديم موثّق في الحديث النبوي «ملعون من غيّر تُخوم
        الأرض»). يجمع المركّب بين الفعل الاصطلاحي الحديث (تحديد) والمصطلح
        التراثي للحدود (تُخوم)، فيحمل دلالة ميدانية وقانونية في آنٍ واحد.
    - lemma: "رَاسِمُ الحُدُودِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي بمجاز وظيفي: رَاسِم (اسم فاعل من رَسَمَ = خطّ وعلَّم وأثبت)
        + الحدود. «رسم الحدود» تعبير فصيح راسخ يعني ترسيم الحدود وتثبيتها.
        المجاز من «الرسم» (الإمرار بسطاً) إلى «الترسيم» (التثبيت الرسمي للحدود).
    - lemma: "حَوَّازٌ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن فَعَّال (يفيد الامتهان والمداومة) من الجذر حوز. الحَوْز
        والحِيَازة في الفقه والقانون = الاستيلاء الشرعي وضبط الملكية.
        حَوَّاز = من مهنته تعيين حيازات الأراضي وضبطها، على نمط: نجّار (يعمل
        بالنجارة)، حدّاد (يعمل بالحديد).
    - lemma: "مُقَيِّدُ الأَطْيَانِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: مُقَيِّد (اسم فاعل من قَيَّدَ = أثبت وقيَّد في السجل)
        + الأطيان (جمع طِين، الأراضي والأملاك العقارية؛ مصطلح عربي كلاسيكي
        رائج في الاستعمال الرسمي). يفيد المركّب إثبات حدود الأطيان وتقييدها
        في الوثائق الرسمية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "محدد المواقع"
      confirm:
        - text: >
            «باعث تحديد الموقع عند الطوارئ» [ترجمة: emergency locator
            transmitter]
          source: "المعجم الموحد لمصطلحات علوم البحار (2000) — ARABTERM"
          # يؤكد أن «تحديد الموقع» يُستخدم ترجمةً لـ locator في العربية
      expands:
        - text: >
            «مُحَدِّد» — ترجمات واردة: delimiter، limiter، determinant،
            delimited، locator (في سياقات: هندسة المياه، تقانة المعلومات،
            الرياضيات، علم الأحياء).
          source: "معاجم ARABTERM متعددة (1989–2011)"
          addition: >
            تتعدد دلالات «مُحَدِّد» في المعاجم المتخصصة ولا تقتصر على
            تحديد المواقع؛ مما يؤكد أن «محدد المواقع» صياغة عامة قابلة
            للتأويل.
        - text: >
            «تحديد الحدود» = delimitation of frontiers [هندسة مدنية].
            «تحديد الحدود، وضع الحدود» = delimitation of boundaries;
            drawing boundaries [قانون].
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)؛ المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
          addition: >
            «تحديد الحدود» مصطلح عربي فصيح راسخ في المعجمية القانونية
            والهندسية؛ وهو الفعل الذي تمارسه اللمّة لا اسمها.

    - lemma: "مُحَدِّدُ التُّخُومِ"
      confirm:
        - text: >
            «التُّخُومُ: أَعْلَامُ الْأَرْضِ وَحُدُودُهَا. وَفِي الْحَدِيثِ:
            مَلْعُونٌ مَنْ غَيَّرَ تُخُومَ الْأَرْضِ. قَالَ قَوْمٌ: أَرَادَ
            حُدُودَ الْحَرَمِ. وَقَالَ آخَرُونَ: هُوَ أَنْ يَدْخُلَ الرَّجُلُ
            فِي حُدُودِ غَيْرِهِ فَيَحُوزَهَا ظُلْمًا.»
          source: "مقاييس اللغة لابن فارس — مادة (تُخُم)"
      expands:
        - text: >
            «[تخم] التَّخْمُ: منتهى كلِّ قرية أو أرض. يقال: فلان على تخْمٍ
            من الأرض، والجمع تُخومٌ مثل فلس وفلوس. وقال الفراء: تخومها:
            حدودها.»
          source: "تاج اللغة وصحاح العربية للجوهري — مادة تخم"
          addition: >
            التخم = منتهى الأرض وحدّها؛ يؤكد ملاءمة «التُّخوم» للمركّب
            المقترح.
        - text: >
            «تَخْم؛ حدّ» = boundary [المورد الحديث 2008]
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >
            التخم يُترجم boundary في المعاجم الحديثة أيضاً.

    - lemma: "رَاسِمُ الحُدُودِ"
      confirm:
        - text: >
            «تحديد الحدود، وَضْع الحدود» = delimitation of boundaries;
            drawing boundaries
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
      expands:
        - text: >
            «(مَسَحَ) الْمِيمُ وَالسِّينُ وَالْحَاءُ أَصْلٌ صَحِيحٌ، وَهُوَ
            إِمْرَارُ الشَّيْءِ عَلَى الشَّيْءِ بَسْطًا.»
          source: "مقاييس اللغة لابن فارس — مادة (مسح)"
          addition: >
            المسح (إمرار الشيء) بمعنى المساحة يتشابه مع الرسم بمعنى التخطيط
            والترسيم؛ يعزز منهجية «مجاز الحركة إلى الضبط».

    - lemma: "حَوَّازٌ"
      expands:
        - text: >
            «(حَوَزَ) الْحَاءُ وَالْوَاوُ وَالزَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ
            الْجَمْعُ وَالتَّجَمُّعُ... وَكُلُّ مَنْ ضَمَّ شَيْئًا إِلَى
            نَفْسِهِ فَقَدْ حَازَهُ حَوْزًا.»
          source: "مقاييس اللغة لابن فارس — مادة (حوز)"
          addition: >
            الحوز = الجمع والضم والاستيلاء؛ في الفقه العربي والقانون العربي
            الحديث الحِيَازة = التمليك والسيطرة على الأرض، مما يجعل فَعَّال
            منه (حَوَّاز) منطقياً لمن يمارس هذه العملية مهنياً.

    - lemma: "مُقَيِّدُ الأَطْيَانِ"
      expands:
        - text: >
            «سِجِلّ الأطيان: سجلّ يبيّن حدودَ الأراضي ومساحتها إلخ.»
            [ترجمة terrier في المورد الحديث]
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >
            «الأطيان» مصطلح عربي راسخ في السجلات العقارية الرسمية لتعيين
            الأراضي وحدودها؛ يؤكد ملاءمة المركّب «مُقَيِّد الأطيان».
        - text: >
            «السجل العقاري» = cadastral register؛ «الإدارة المساحية» =
            cadastral administration؛ «المساحة التفصيلية [للأملاك والعقارات]»
            = cadastral survey.
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)؛ المورد الحديث (2008) — ARABTERM"
          addition: >
            السياق العقاري (cadastral) هو بيئة عمل صاحب هذه المهنة؛ وهو
            مجال تكثر فيه كلمة «أطيان» في السجلات الرسمية العربية.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "محدد المواقع"
      decision: confirmed
      decision_reason: >
        اللمّة مفهومة وقابلة للاستخدام، وتعبّر عن المفهوم المطلوب بصورة
        مباشرة (من يُحدِّد المواقع = يعيّن حدود القطع). وإن كانت تعاني
        الاشتراكَ اللفظي مع أجهزة GPS إلا أنها الأوفر توثيقاً للمفهوم ضمن
        هذه المجموعة. يُصحَّح تشكيلها ويُبقى عليها بانتظار مصطلح بديل
        مؤسَّس في المعجمية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الفرد الوحيد في المجموعة؛ يصف المتخصص في تعيين مواضع الحدود
        القانونية لمطالبات الأراضي، وهو تخصص أضيق من المساح العام (hypernym:
        مساح) الذي يعمل بالحدود والارتفاعات معاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَدِّدُ الْمَوَاقِعِ"

    - lemma: "مُحَدِّدُ التُّخُومِ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم الدقة الدلالية العالية وثراء الأدلة المعجمية لـ«التخوم»، يتداخل
        هذا المركّب مع اللمّة الموجودة «محدد المواقع» في البنية الاشتقاقية
        (مُحَدِّد + مضاف)، ولم يُعثر له على توثيق معجمي كوحدة مسكوكة مستقلة.
        اختبار التثبيت المعجمي: يمكن إبدال «التُّخوم» بـ«الحدود/الأراضي»
        وتبقى العبارة وصفاً، ليست مصطلحاً جامداً.

    - lemma: "رَاسِمُ الحُدُودِ"
      source: stage1
      decision: removed
      decision_reason: >
        «راسم الحدود» عبارة وصفية مقبولة لكنها لا تجتاز اختبار التثبيت
        المعجمي: يمكن إبدال «الحدود» بـ«التخوم/الأراضي/المناطق» ويبقى
        المركّب وصفاً لا مصطلحاً جامداً. لا يوجد توثيق له كاسم مهنة ثابت.

    - lemma: "حَوَّازٌ"
      source: stage1
      decision: removed
      decision_reason: >
        وزن فَعَّال للمهن صحيح قياساً، لكن «حَوَّاز» غير موثَّق في أي مصدر
        معجمي. فضلاً عن ذلك، الدلالة الغالبة لـ«حاز» هي الاستيلاء والتملك
        لا تعيين الحدود، مما يثير التباساً دلالياً. لا إجراء.

    - lemma: "مُقَيِّدُ الأَطْيَانِ"
      source: stage1
      decision: removed
      decision_reason: >
        «التقييد» يوحي بالتسجيل والإثبات في الوثائق، لا بالعمل الميداني في
        تعيين الحدود وترسيمها. دلالته قانونية-إدارية أكثر منها مساحية-ميدانية،
        وهو لم يُعثر له على توثيق كمصطلح ثابت لهذه المهنة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يحدد حدود مطالبات الأراضي"
    assessment:
      decision: revise
      reason: >
        التعريف ترجمة حرفية مباشرة من الإنجليزية؛ يحتوي على تكرار صرفي
        (حدود ← حدَّدَ)، وصياغة «مطالبات الأراضي» ثقيلة على التعبير العربي
        الفصيح. يفتقر إلى الجنس القريب الواضح ولا يصف الطابع المهني.
    authored:
      - type: terminological
        text: >
          مُتَخَصِّصٌ مَسَاحِيٌّ يَقُومُ بِتَعْيِينِ حُدُودِ قِطَعِ
          الأَرَاضِي وَتَثْبِيتِهَا وَفْقَ الْوَثَائِقِ الْعَقَارِيَّةِ
          وَالسِّجِلَّاتِ الرَّسْمِيَّةِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مَن تَخَصَّصَ في رَسْمِ حُدودِ مَطَالِبِ الأَرَاضِي وَتَوْثِيقِهَا؛
          يَعْمَلُ عَادَةً ضِمْنَ مَنْظُومَةِ التَّسْجِيلِ الْعَقَارِيِّ
          وَالمِسَاحَةِ التَّفْصِيلِيَّةِ (الكَاداسْتَر)، وَيُتِيحُ تَحْدِيدَ
          مَلَكِيَّةِ الأَرْضِ وَفَصْلَهَا عَنْ سِوَاهَا.
