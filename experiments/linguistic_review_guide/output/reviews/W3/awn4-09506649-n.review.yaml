stage1_review:
  assessment:
    concerns:
      - عدم وجود تشكيل كامل على اللمات الحالية.
      - "بحر الجنوب" ترجمة حرفية قد تسبب التباساً مع معانٍ أخرى لولا السياق.
    observations: "المجموعة تشير إلى معلم جغرافي محدد في هولندا. اللمات الموجودة تجمع بين التعريب (النقحر) والترجمة الحرفية (بحر الجنوب)."
  blind_candidates:
    - lemma: "بَحْرُ الزَّايْدَرْزِي"
      generation_method: tarkib
      justification: "إضافة لفظ 'بحر' إلى الاسم العلم المنقحر لبيان طبيعة المعلم الجغرافي."
    - lemma: "خَلِيجُ زَايْدَرْزِي"
      generation_method: tarkib
      justification: "استخدام 'خليج' كبديل لـ 'Inlet' المذكورة في التعريف، وهو وصف دقيق للمدخل المائي."
    - lemma: "بَحْرُ الجَنُوبِ"
      generation_method: majaz
      justification: "ترجمة دقيقة للاسم الهولندي (Zuiderzee) الذي يعني البحر الجنوبي."
    - lemma: "زَايْدَرْزِي"
      generation_method: taarib
      justification: "نقحر الاسم العلم كما هو شائع في المصادر الجغرافية العربية الحديثة."

stage2_evidence:
  per_lemma:
    - lemma: "بحر الجنوب"
      evidence_status: "no_material_found"
    - lemma: "زايدرزي"
      evidence_status: "no_material_found"
    - lemma: "خَلِيجُ زَايْدَرْزِي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "بحر الجنوب"
      decision: confirmed
      decision_reason: "ترجمة عربية فصيحة ومستقرة في الأدبيات الجغرافية كمعادل للاسم الأصلي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَحْرُ الجَنُوبِ"
    - lemma: "زايدرزي"
      decision: confirmed
      decision_reason: "الاسم العلم المنقحر والأكثر شيوعاً في الخرائط والموسوعات المعاصرة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَايْدَرْزِي"
    - lemma: "خَلِيجُ زَايْدَرْزِي"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق يوضح طبيعة المعلم المذكور في التعريف (لسان بحري)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "خَلِيجُ زَايْدَرْزِي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "مدخل سابق لبحر الشمال في الساحل الشمالي لهولندا؛ تم عزله عن البحر في عام 1932 بواسطة سد مما أدى إلى إنشاء بحيرة آيسل"
    assessment:
      decision: revise
      reason: "لتحسين الصياغة اللغوية وجعلها أكثر دقة مع إضافة التفاصيل الجغرافية اللازمة بأسلوب معجمي."
    authored:
      - type: encyclopedic
        text: "مَدْخَلٌ بَحْرِيٌّ (لِسَانٌ بَحْرِيٌّ) سَابِقٌ كَانَ جُزْءًا مِنْ بَحْرِ الشَّمَالِ عِنْدَ السَّاحِلِ الشَّمَالِيِّ لِهُولَنْدَا، فُصِلَ عَنِ البَحْرِ بِسَدٍّ مَنِيعٍ عَامَ 1932 مِمَّا حَوَّلَهُ إِلَى بُحَيْرَةٍ عُذْبَةٍ تُعْرَفُ بِبُحَيْرَةِ آيْسِل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَدْخَلٌ بَحْرِيٌّ سَابِقٌ لِبَحْرِ الشَّمَالِ فِي السَّاحِلِ الشَّمَالِيِّ لِهُولَنْدَا، عُزِلَ عَنِ البَحْرِ بِسَدٍّ عَامَ 1932 مِمَّا أَدَّى إِلَى تَحَوُّلِهِ إِلَى بُحَيْرَةِ آيْسِل."
  examples:
    per_lemma:
      - lemma: "بَحْرُ الجَنُوبِ"
        examples:
          - text: "يُعَدُّ بَحْرُ الجَنُوبِ فِي هُولَنْدَا مِثَالاً نَادِرًا لِتَحَوُّلِ لِسَانٍ بَحْرِيٍّ مَالِحٍ إِلَى بُحَيْرَةٍ عُذْبَةٍ بَعْدَ إِغْلَاقِ السُّدُودِ."
            type: usage
      - lemma: "زَايْدَرْزِي"
        examples:
          - text: "اِخْتَفَى اِسْمُ زَايْدَرْزِي مِنَ الخَرَائِطِ المَلَاحِيَّةِ بَعْدَ أَنْ حَلَّتْ بُحَيْرَةُ آيْسِل مَحَلَّهُ."
            type: usage
      - lemma: "خَلِيجُ زَايْدَرْزِي"
        examples:
          - text: "كَانَ خَلِيجُ زَايْدَرْزِي مَوْرِدًا هَامًّا لِصَيْدِ الأَسْمَاكِ قَبْلَ بِنَاءِ سَدِّ الإِغْلَاقِ الكَبِيرِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تَمَّ اسْتِصْلَاحُ أَرَاضٍ شَاسِعَةٍ مِنْ قَاعِ بَحْرِ الجَنُوبِ بَعْدَ جَفَافِ أَجْزَاءٍ مِنْهُ."

stage5_enrichment:
  per_entry:
    - lemma: "بَحْرُ الجَنُوبِ"
      entry_id: "{auto}"
      roots:
        - word: "بحر"
          root: "بحر"
          maqayis_quote: "«الْبَاءُ وَالْحَاءُ وَالرَّاءُ. قَالَ الْخَلِيلُ سُمِّيَ الْبَحْرُ بَحْرًا لِاسْتِبْحَارِهِ وَهُوَ انْبِسَاطُهُ وَسَعَتُهُ.»"
        - word: "الجنوب"
          root: "جنب"
          maqayis_quote: "«الْجِيمُ وَالنُّونُ وَالْبَاءُ أَصْلَانِ مُتَقَارِبَانِ أَحَدُهُمَا: النَّاحِيَةُ، وَالَآخَرُ الْبُعْدُ.»"
    - lemma: "زَايْدَرْزِي"
      entry_id: "{auto}"
      note: "اسم علم أعجمي منقحر."
    - lemma: "خَلِيجُ زَايْدَرْزِي"
      entry_id: "{auto}"
      roots:
        - word: "خليج"
          root: "خلج"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْتِزَاعِ وَمَا قَارَبَهُ... وَالْخَلِيجُ: النَّهَرُ يَنْفَلِقُ مِنَ النَّهَرِ الْعَظِيمِ.»"
  per_sense:
    - lemma: "بَحْرُ الجَنُوبِ"
      sense_id: "{auto}"
      nuance: "ترجمة معنوية للاسم الهولندي الأصلي، يُستخدم غالباً في السياقات التاريخية."
      mwe: true
    - lemma: "زَايْدَرْزِي"
      sense_id: "{auto}"
      nuance: "الاسم العلم المباشر المستخدم دولياً."
      mwe: false
    - lemma: "خَلِيجُ زَايْدَرْزِي"
      sense_id: "{auto}"
      nuance: "تعبير يجمع بين الوصف الجغرافي (خليج) والاسم العلم."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"بحر","root":"بحر","maqayis":"«الْبَاءُ وَالْحَاءُ وَالرَّاءُ...»"},{"word":"الجنوب","root":"جنب","maqayis":"«الْجِيمُ وَالنُّونُ وَالْبَاءُ...»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"ترجمة معنوية للاسم الهولندي الأصلي","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
