# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13994359-n
# armistice / cease-fire / truce
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يكرر لفظة «سلام» مرتين (حالة سلام... شروط السلام) وهو من أبناء المجموعة الأعلى (سلام/سلم)، مما يُحدث دوراً جزئياً"
      - "التعريف لا يُصرّح بأن الهدنة مؤقتة بطبيعتها، وهذا فارق جوهري عن الصلح الدائم"
      - "لمّة «وقف إطلاق النار» مركّب إضافي حديث لا يحمل تشكيلاً في المدخل الحالي"
    observations: "المجموعة تمثّل مفهوماً محورياً في الثقافة العربية الإسلامية، إذ وردت الهدنة والمهادنة والموادعة في كتب الفقه والسير. يتوقع وجود مرادفات تراثية غنية إلى جانب المصطلح الحديث «وقف إطلاق النار». التعريف الحالي أقرب إلى الترجمة منه إلى التأليف المعجمي العربي."
  blind_candidates:
    - lemma: "هُدْنَة"
      generation_method: ishtiqaq
      justification: "من الجذر (هـ د ن) الدال على السكون والاستقامة، على وزن فُعْلَة للدلالة على الحالة أو المرّة. أشهر لفظ عربي للمفهوم، مستعمل في القرآن والحديث والفقه."
    - lemma: "مُتَارَكَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ت ر ك) على وزن مُفَاعَلَة، بمعنى الترك المتبادل للقتال. المعنى الاشتقاقي واضح: متاركة الحرب أي تراضي الطرفين على تركها."
    - lemma: "مُوَادَعَة"
      generation_method: ishtiqaq
      justification: "من الجذر (و د ع) الدال على الترك والتخلية والدَّعة، على وزن مُفَاعَلَة. مستعملة في كتب الفقه بمعنى متاركة الحرب والمصالحة المؤقتة."
    - lemma: "مُهَادَنَة"
      generation_method: ishtiqaq
      justification: "من الجذر (هـ د ن) نفسه على وزن مُفَاعَلَة، بمعنى عقد الهدنة. مصطلح فقهي راسخ يعني ترك القتال لمصلحة."

stage2_evidence:
  per_lemma:
    - lemma: "هُدْنَة"
      confirm:
        - text: "«المصالحة بعد الحرب, أو فترة تعقب الحرب يتهيأ فيها العدوان للصلح, ولها شروط خاصة»"
          source: "المعجم الوسيط"
        - text: "«الهُدنة: بالضم المصالحة والدَعَة والسكون والهِدانة المصالحة بعد الحرب.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«وقف الحرب أو الصراع بين دولتين أو أكثر في حالة حرب.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«هُدْنَة — من (ه د ن) الدعة والسكون، والمصالحة بعد الحرب، وانتقاض عزم الرجال بخبر يأتيه.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(ج) هدن والدعة والسكون وانتقاض عزم الرجل بِخَبَر يَأْتِيهِ»"
          source: "المعجم الوسيط (هورماني)"
          addition: "جمع هُدْنَة هو هُدَن، وللكلمة معانٍ أخرى غير المصالحة: الدَّعة والسكون"

    - lemma: "وَقْف إِطْلَاق النَّار"
      confirm:
        - text: "«(1) وَقْف إطلاق النار (2) هدنة.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) وَقْف إطلاق النار (2) هدنة.» — ترجمة cease-fire"
          source: "المورد الحديث (2008)"
          addition: "المورد يقرن المصطلح بالهدنة مباشرة كمرادف في السياق العسكري الحديث"

    - lemma: "مُتَارَكَة"
      confirm:
        - text: "«الهُدْنة.»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«واتَّفقُوا على المُتَارَكَة والمُهلة زمناً مِقداره سِتَّة أَشْهُر»"
          source: "الجَبَرْتِي (شاهد استعمالي)"

    - lemma: "مُوَادَعَة"
      confirm:
        - text: "«المُوَادعة: متاركةُ الحرب.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«شبه المصالحة»"
          source: "كتاب العين — الخليل بن أحمد الفراهيدي"
        - text: "«المُوَادَعَةُ: الْمُصَالَحَةُ وَالْمُتَارَكَةُ»"
          source: "مقاييس اللغة — ابن فارس"

    - lemma: "مُهَادَنَة"
      confirm:
        - text: "«المُهَادَنَة: ترك الإِمَام أَو نَائِبه قتال الْكفَّار لمصْلحَة.»"
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "«المُهَادَنَة: ترك الإِمَام أَو نَائِبه قتال الْكفَّار لمصْلحَة.»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "التعريف الفقهي يقصر المهادنة على قرار الإمام أو نائبه بترك القتال لمصلحة، مما يجعلها أضيق من الهدنة العامة"

stage3_analysis:
  per_lemma:
    - lemma: "هُدْنَة"
      decision: confirmed
      decision_reason: "لفظ تراثي أصيل راسخ في الاستعمال الفصيح قديماً وحديثاً. مؤيَّد بالمعجم الوسيط والمعجم الكبير والتعريفات الفقهية والمعجم الموحد للقانون. هو اللفظ الأول للمفهوم في العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ الأعمّ والأشيع، يدل على حالة المصالحة المؤقتة بعد الحرب بإطلاق، دون تقييد بطرف أو سبب."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُدْنَة"

    - lemma: "وَقْف إِطْلَاق النَّار"
      decision: confirmed
      decision_reason: "مركّب إضافي حديث شائع في لغة الإعلام والسياسة والقانون الدولي. مسجَّل في المورد الحديث مقابل cease-fire. وحدة معجمية ثابتة لا يمكن استبدال أحد مكوناتها بمرادف (لا يقال: إيقاف إطلاق النار، ولا وقف رمي النار بالمعنى نفسه)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مصطلح عسكري حديث يركّز على الجانب الإجرائي (وقف العمليات العسكرية)، أضيق من الهدنة التي تشمل حالة السلام المؤقت بمجملها."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَقْف إِطْلَاق النَّار"

    - lemma: "مُتَارَكَة"
      source: stage1
      decision: confirmed
      decision_reason: "معرَّفة في المعجم الكبير (مجمع اللغة العربية) بمعنى الهدنة صراحة. مشهود لها في نثر الجبرتي. لفظ فصيح على وزن مُفَاعَلَة من (ت ر ك) يفيد التبادل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تبرز معنى الترك المتبادل للقتال؛ أقرب إلى الجانب العملي (كفّ الطرفين عن القتال) منها إلى حالة السلام المنظَّمة."
      actions:
        - command: create_entry
          params: {lemma: "مُتَارَكَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُوَادَعَة"
      source: stage1
      decision: confirmed
      decision_reason: "مؤيَّدة بثلاثة مصادر تراثية: كتاب العين (شبه المصالحة)، والتعريفات الفقهية (متاركة الحرب)، ومقاييس اللغة (المصالحة والمتاركة). لفظ فصيح أصيل من جذر (و د ع)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تؤكد جانب السكون والدَّعة (من أصل الجذر: الترك والراحة)؛ أقرب إلى المسالمة المبنية على التراضي والتوادع منها إلى مجرد وقف القتال."
      actions:
        - command: create_entry
          params: {lemma: "مُوَادَعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُهَادَنَة"
      source: stage1
      decision: removed
      decision_reason: "التعريف الفقهي الوحيد المتوفر يقصرها على قرار الإمام أو نائبه بترك قتال الكفار لمصلحة، وهو أضيق من مفهوم الهدنة العامة المتبادلة بين خصوم. كما أنها مصدر ميمي يغلب عليه الدلالة على فعل المهادنة (العملية) لا على الحالة الناتجة، والمجموعة تصف حالة (state). ووجود هُدْنَة من الجذر نفسه يُغني عنها."

