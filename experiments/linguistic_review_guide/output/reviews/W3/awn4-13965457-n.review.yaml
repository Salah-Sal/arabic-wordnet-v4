# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13965457-n
# the greatest or utmost degree — أعظم أو أقصى درجة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «أقصى درجات» عبارة وصفية إضافية لا مصطلح معجمي ثابت، وتكاد تتطابق مع نص التعريف «أعظم أو أقصى درجة» مما يوقع في الدور"
      - "اللمّة «غاية» دلالتها المركزية في الاستعمال المعاصر هي الهدف والمقصد، ودلالة المنتهى ثانوية"
    observations: "المفهوم المستهدف هو أقصى حدٍّ يبلغه الشيء في الشدة أو القوة أو العظم، وهو مفهوم أصيل في العربية تعبّر عنه ألفاظ عديدة كالمنتهى والغاية والذروة. اللمّة «أقصى درجات» مركّب إضافي وصفي حرّ لا يجتاز اختبار السكّ (يمكن إبداله بـ«أعلى درجات» أو «أبعد درجات» دون تغيير)."
  blind_candidates:
    - lemma: "مُنْتَهَى"
      generation_method: ishtiqaq
      justification: "من الجذر ن-ه-ي على صيغة اسم المكان/الزمان من انتهى (مُفْتَعَل)، يدل على أقصى حدٍّ يُنتهى إليه. قال ابن فارس: النون والهاء والياء أصل يدل على غاية وبلوغ"
    - lemma: "غَايَة"
      generation_method: ishtiqaq
      justification: "من الجذر غ-و-ي / غ-ي-ي، أصلها الراية ثم سُمّيت نهاية الشيء غاية لأنه يُنتهى إليها. المعجم الوسيط: غاية كل شيء نهايته وآخره"
    - lemma: "ذِرْوَة"
      generation_method: majaz
      justification: "أصلها أعلى السنام، ثم استُعملت مجازاً لأعلى درجة في أي شيء: ذروة المجد، ذروة الشدة"
    - lemma: "قُصَارَى"
      generation_method: ishtiqaq
      justification: "من الجذر ق-ص-و بمعنى البُعد والتطرف، على وزن فُعَالَى للدلالة على أقصى ما يُبلغ: قُصَارَاك أن تفعل كذا"

stage2_evidence:
  per_lemma:
    - lemma: "أَقْصَى دَرَجَاتٍ"
      evidence_status: "no_material_found"

    - lemma: "غَايَة"
      confirm:
        - text: "«النهاية والآخر. فغاية كل شيء: نهايته وآخره. الرّاية»"
          source: "المعجم الوسيط"
        - text: "«من (غ ي ي) النهاية والآخر، والراية»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«فَأَمَّا الْغَايَةُ فَهِيَ الرَّايَةُ، وَسُمِّيَتْ بِذَلِكَ لِأَنَّهَا تُظِلُّ مَنْ تَحْتَهَا... ثُمَّ سُمِّيَتْ نِهَايَةُ الشَّيْءِ غَايَةً»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الغاية: ما لأجله وجود الشيء»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "دلالة فلسفية على العلة الغائية، وهي أوسع من مجرد النهاية"
        - text: "«الغَايَة: ما يكون مؤثرا في مؤثرية الشيء»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "دلالة فلسفية منطقية تتصل بالعلّية"

    - lemma: "مُنْتَهَى"
      confirm:
        - text: "«النُّونُ وَالْهَاءُ وَالْيَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى غَايَةٍ وَبُلُوغٍ. وَمِنْهُ... نِهَايَةُ كُلِّ شَيْءٍ: غَايَتُهُ»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "ذِرْوَة"
      confirm:
        - text: "«ذروةُ كلِّ شيءٍ: أعلاه»"
          source: "المعجم الوسيط"
        - text: "«أعْلَى كُلِّ شيءٍ»"
          source: "المعجم الكبير"
        - text: "«الذِّرْوَةُ: أَعْلَى السَّنَامِ وَغَيْرِهِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«أقصى الشدة، مثل ما يحدث في المرض»"
          source: "معجم المصطلحات الطبية"
          addition: "استعمال طبي حديث يدل على أقصى درجة الشدة — يقترب من معنى المجموعة"

    - lemma: "قُصَارَى"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أَقْصَى دَرَجَاتٍ"
      decision: removed
      decision_reason: "عبارة وصفية إضافية حرّة لا مصطلح معجمي ثابت؛ تفشل في اختبار السكّ (يمكن إبدال «أقصى» بـ«أعلى» أو «أبعد» وتبقى العبارة صالحة). كما أنها شبه مطابقة للتعريف مما يوقع في الدور المعجمي"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "غَايَة"
      decision: confirmed
      decision_reason: "لمّة عربية فصيحة موثقة في المعاجم الكلاسيكية والحديثة بدلالة النهاية والمنتهى، وهي من أقدم الألفاظ العربية للتعبير عن أقصى حدّ"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تؤكد البلوغ إلى الحد الأقصى مع دلالة على القصد والتوجه، وتحمل ظلالاً فلسفية (العلة الغائية)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَايَة"

    - lemma: "مُنْتَهَى"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر ميمي / اسم مكان من انتهى، أصل مادته يدل على الغاية والبلوغ كما في مقاييس اللغة، ويُستعمل استعمالاً واسعاً في الفصحى المعاصرة بمعنى أقصى درجة: منتهى السعادة، منتهى القوة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركز على الانتهاء والوصول إلى الحد الأخير دون إمكان التجاوز، ويُستعمل غالباً في التراكيب الإضافية: منتهى الأمل"
      actions:
        - command: create_entry
          params:
            lemma: "مُنْتَهَى"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "ذِرْوَة"
      source: stage1
      decision: removed
      decision_reason: "دلالتها المركزية هي الأعلى والقمة (أعلى السنام وأعلى كل شيء)، وهي أنسب لمجموعة ترادفية تدل على القمة أو الأوج لا على أقصى الدرجات بإطلاق. الاستعمال الطبي (أقصى الشدة) خاص بسياق المرض"

    - lemma: "قُصَارَى"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد لها مادة معجمية مستقلة في قاعدة البيانات، وهي في الاستعمال الفعلي مقصورة على التراكيب الإضافية (قصاراك أن...) ولا تُستعمل مفردة للدلالة على المفهوم"

