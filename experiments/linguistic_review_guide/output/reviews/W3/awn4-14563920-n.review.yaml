# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14563920-n (Pax Romana)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (السلام الروماني) وهي ترجمة حرفية للمصطلح اللاتيني Pax Romana"
      - "اللمّة الموجودة بدون تشكيل كامل"
      - "المفهوم تاريخي غربي محدد يحتاج تعاملاً خاصاً في المعجمية العربية"
    observations: >
      المجموعة الترادفية تمثّل مفهوماً تاريخياً محدداً هو «السلام الروماني» (Pax Romana)،
      وهو فترة الاستقرار والسلام النسبي التي سادت الإمبراطورية الرومانية تقريباً من عهد أغسطس
      (27 ق.م) إلى عهد ماركوس أوريليوس (180 م). المفهوم مُصطلح تاريخي عالمي مُتداول
      في الأدبيات العربية الحديثة بصيغة «السلام الروماني» أو بالتعريب «باكس رومانا».
      التعريف العربي الحالي سليم لغوياً ويؤدي المعنى المطلوب.
  blind_candidates:
    - lemma: "السَّلَامُ الرُّومَانِيُّ"
      generation_method: tarkib
      justification: "مركب وصفي من «السلام» بمعنى الصلح وانتفاء الحرب، و«الروماني» نسبةً إلى روما. هذا هو المصطلح المتداول في الكتابات التاريخية العربية المعاصرة."
    - lemma: "السِّلْمُ الرُّومَانِيُّ"
      generation_method: tarkib
      justification: "مركب وصفي بديل يستخدم «السلم» (بكسر السين وسكون اللام) بمعنى الصلح والمسالمة، وهو أقرب إلى الدلالة على حالة انتفاء الحرب من «السلام» الذي يغلب عليه معنى التحية."
    - lemma: "بَاكْسْ رُومَانَا"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح اللاتيني Pax Romana، يُستخدم في بعض المصادر العربية المتخصصة في التاريخ القديم."
    - lemma: "سَلَامُ رُومَا"
      generation_method: tarkib
      justification: "مركب إضافي يربط السلام بروما مباشرة على نمط المركبات الإضافية العربية مثل «صلح الحديبية»."

stage2_evidence:
  per_lemma:
    - lemma: "السَّلَامُ الرُّومَانِيُّ"
      confirm:
        - text: "«(السَّلَام) اسْم من أَسْمَائِهِ تَعَالَى وَالتَّسْلِيم والتحية عِنْد الْمُسلمين والسلامة والبراءة من الْعُيُوب والأمان وَالصُّلْح والنشيد الوطني الرسمي (محدثة) وَضرب من الشّجر وَدَار السَّلَام الْجنَّة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«السِّلْمُ: وهي الصلح، مؤنثة بكسر السين وإسكان اللام وربما ذكرت في الشهر»"
          source: "المذكر والمؤنث لابن التستري"
          addition: "التمييز بين السلام والسلم في الدلالة على الصلح وانتفاء الحرب"
    - lemma: "السِّلْمُ الرُّومَانِيُّ"
      confirm:
        - text: "«السِّلْمُ: وهي الصلح، مؤنثة بكسر السين وإسكان اللام وربما ذكرت في الشهر»"
          source: "المذكر والمؤنث لابن التستري"
        - text: "«وسالمت العدو مسالمة، وتسالموا، وخذوا بالسلم، وفلان سلم لفلان وحرب له»"
          source: "أساس البلاغة للزمخشري"
      expands:
        - text: "«السَّلَمُ: بفتح السين واللام، يذكر وهو الاستسلام، من قوله عز وجل: وألقوا إلى الله يومئذ السلم أي استسلموا لله عز وجل وأعطوا بأيديهم»"
          source: "المذكر والمؤنث لابن التستري"
          addition: "تمييز السَّلَم (الاستسلام) عن السِّلْم (الصلح) صرفياً ودلالياً"
    - lemma: "بَاكْسْ رُومَانَا"
      evidence_status: "no_material_found"
    - lemma: "سَلَامُ رُومَا"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "السَّلَامُ الرُّومَانِيُّ"
      decision: confirmed
      decision_reason: >
        المصطلح هو الترجمة العربية المتداولة لمفهوم Pax Romana في الأدبيات التاريخية العربية.
        «السلام» ثابت في المعجم الوسيط بمعنى الصلح، والمركب الوصفي «السلام الروماني»
        وحدة اصطلاحية مستقرة في الكتابة التاريخية المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "السَّلَامُ الرُّومَانِيُّ"
    - lemma: "السِّلْمُ الرُّومَانِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «السلم» أدق دلالياً في الإشارة إلى حالة انتفاء الحرب،
        إلا أن المصطلح المستقر في الاستعمال التاريخي العربي هو «السلام الروماني» لا «السلم الروماني».
        إضافة هذا البديل قد تُشتت المستخدم دون فائدة معجمية واضحة.
      evidence_assessment:
        case: mixed
    - lemma: "بَاكْسْ رُومَانَا"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب حرفي لا ضرورة له مع وجود المصطلح العربي المتداول «السلام الروماني».
        لا يقبل الاشتقاق ولا التصريف العربي ولم يُوثّق في أي معجم عربي.
      evidence_assessment:
        case: no_material
    - lemma: "سَلَامُ رُومَا"
      source: stage1
      decision: removed
      decision_reason: >
        مركب إضافي محتمل لكنه ليس مصطلحاً مسكوكاً ولا مستقراً في الاستعمال.
        «السلام الروماني» (وصفي) هو الصيغة المعتمدة والمتداولة.
      evidence_assessment:
        case: no_material

