# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "متخصص في علم الاحتكاك (الترايبولوجيا)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دائري (يستخدم «متخصص» وهي اللمّة المراد تعريفها)، وتوضيح
        «(الترايبولوجيا)» في قوس هو حاشية لا فصل نوعي. يفتقر إلى الجنس القريب الصحيح
        وإلى الفصول النوعية التي تُحدّد ما يدرسه هذا العالم تحديداً (الاحتكاك + التشحيم
        + التآكل بين الأسطح). لا يُميِّز عن المهندس الميكانيكي العام.
    authored:
      - type: terminological
        text: >
          عَالِمٌ مُتَخَصِّصٌ في دِرَاسَةِ الاحْتِكَاكِ وَالتَّشْحِيمِ وَالتَّآكُلِ
          بَيْنَ الأَسْطُحِ المُتَلَامِسَةِ المُتَحَرِّكَةِ، وَتَطبِيقِ نَتَائِجِ
          هَذِهِ الدِّرَاسَاتِ فِي تَحْسِينِ أَدَاءِ الآلَاتِ وَإِطَالَةِ عُمْرِهَا
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مُهَنْدِسٌ أَوْ عَالِمٌ يَبْحَثُ فِي الظَّوَاهِرِ الثَّلَاثِ الَّتِي تُشَكِّلُ
          عِلْمَ الاحْتِكَاكِ (الترايبولوجيا): الاحْتِكَاكُ بَيْنَ الأَسْطُحِ، وَالتَّشْحِيمُ
          لِتَقلِيلِ المُقَاوَمَةِ، وَالتَّآكُلُ النَّاجِمُ عَنِ الحَرَكَةِ المُتَوَاصِلَةِ.
          تَمْتَدُّ اهْتِمَامَاتُهُ مِنَ الأَبْحَاثِ الأَسَاسِيَّةِ إِلَى التَّطبِيقَاتِ
          الصِّنَاعِيَّةِ كَالمُحَرِّكَاتِ والمَحَامِلِ والأَدَوَاتِ الجِرَاحِيَّةِ
    actions:
