          definition_index: 0
          text: "عَالِمٌ مُتَخَصِّصٌ في دِرَاسَةِ الاحْتِكَاكِ وَالتَّشْحِيمِ وَالتَّآكُلِ بَيْنَ الأَسْطُحِ المُتَلَامِسَةِ المُتَحَرِّكَةِ، وَتَطبِيقِ نَتَائِجِ هَذِهِ الدِّرَاسَاتِ فِي تَحْسِينِ أَدَاءِ الآلَاتِ وَإِطَالَةِ عُمْرِهَا"
