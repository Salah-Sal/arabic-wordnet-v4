# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «متخصص في علم الاحتكاك» عبارة وصفية حرة تفشل اختبار السكّ: يمكن إبدال «الاحتكاك» بأي علم آخر ويبقى التعبير صالحاً كوصف، مما يعني أنها ليست وحدة معجمية ثابتة"
      - "اللمّة خالية من التشكيل"
      - "التعريف يحتوي على قوسين توضيحيَّين «(الترايبولوجيا)» بدلاً من فصل نوعي حقيقي، مما يجعله أشبه بحاشية من التعريف المعجمي الصحيح"
      - "المجموعة تفتقر إلى مصطلح مسكوك رغم وجود جذر عربي أصيل (حكك) يحمل المعنى الجوهري لمفهوم الاحتكاك"
    observations: >
      المجموعة تُعبِّر عن مفهوم أكاديمي-تقني متخصص: عَالِم يدرس ظواهر الاحتكاك والتشحيم والتآكل بين
      الأسطح المتلامسة. التراتب الهرمي (مهندس ميكانيكي) مناسب. الجذر العربي «حكك» يحمل في أصل معجمية
      ابن فارس معنى التلامس والتمرّس بين شيئين، وهو تماماً جوهر الاحتكاك الفيزيائي، مما يجعل «الاحتكاك»
      قاعدةً اشتقاقية صالحة. غياب المصطلح المسكوك يعكس فجوة معجمية حقيقية في علم متخصص نسبياً.

  blind_candidates:
    - lemma: "عَالِمُ الاحْتِكَاكِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي (إضافي) على نمط «عالم الفيزياء» و«عالم الكيمياء» الذي تعتمده العربية المعاصرة
        للدلالة على المتخصص في حقل علمي بعينه. «عالم» الجنس القريب، و«الاحتكاك» الفصل النوعي.
        مختبَر بالسكّ: لا يمكن إبداله بمركّب آخر مع الحفاظ على نفس الدلالة التخصصية.

    - lemma: "تِرَايبُولُوجِيٌّ"
      generation_method: taarib
      justification: >
        تعريب مباشر للفظ «tribologist» الإنجليزي (من اليونانية tribos = احتكاك + logos = علم + ist =
        متخصص) وفق قواعد التعريب العربية: ضبط الحركات بما يلائم النطق العربي، إضافة تنوين الرفع،
        قبول ال- التعريف (التِّرَايبُولُوجِيّ). اللجوء إليه لأن الاشتقاق والتركيب لم يُنتجا مصطلحاً
        فردياً غير مُلتبس. يتمتع بالتداول في الدوريات العلمية العربية.

    - lemma: "احْتِكَاكِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة من «احتكاك» على قياس «فيزيائي» من «فيزياء» و«كيميائي» من «كيمياء»، لتدل على
        المتخصص في الحقل. الوزن: اسم منسوب. المشكلة المحتملة: تداخل مع مصطلح «احتكاكي»
        بمعنى «fricative» في اللسانيات.

    - lemma: "خَبِيرُ الاحْتِكَاكِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي على نمط «خبير التسليح / خبير الاقتصاد»، حيث «خبير» يُشير إلى الجانب التطبيقي
        والمهاري أكثر من «عالم»، مناسب للتركيز على الخبرة العملية في قياس الاحتكاك وإدارته في
        المنظومات الصناعية.


