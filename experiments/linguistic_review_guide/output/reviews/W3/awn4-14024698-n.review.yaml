# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14024698-n
# المفهوم: الاستقلال السياسي (political independence / separateness)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (انفصال) وهي فقيرة ترادفياً"
      - "التعريف العربي (الاستقلال السياسي) موجز جداً ولا يميّز المجموعة بوضوح عن المجموعة الأمّ (استقلال)"
      - "اللمّة الموجودة بدون تشكيل"
    observations: "المفهوم يدلّ على حالة الانفصال والتمايز السياسي، وهو نوع خاصّ من الاستقلال يركّز على البُعد السياسي. اللفظة الإنجليزية separateness تدلّ على حالة كون الشيء منفصلاً أو متمايزاً، وهو ما يناسبه في العربية ألفاظ من جذر ف ص ل. المجموعة بحاجة إلى إثراء ترادفي وتعريف أدقّ."
  blind_candidates:
    - lemma: "اِنْفِصَال"
      generation_method: ishtiqaq
      justification: "مصدر انفعل من جذر ف ص ل، يدلّ على حدوث الفصل والمفارقة، وهو أقرب لفظ عربي لمفهوم separateness بوصفه حالة التمايز السياسي"
    - lemma: "اِنْشِقَاق"
      generation_method: ishtiqaq
      justification: "مصدر انفعل من جذر ش ق ق، يُستعمل في سياق الانشقاق السياسي والخروج عن الجماعة"
    - lemma: "اِنْفِكَاك"
      generation_method: ishtiqaq
      justification: "مصدر انفعل من جذر ف ك ك، يدلّ على التحرّر من القيد والارتباط"
    - lemma: "سِيَادَة"
      generation_method: ishtiqaq
      justification: "مصدر من جذر س و د على وزن فِعَالة، يدلّ على السلطة العليا والاستقلال في التصرّف"

stage2_evidence:
  per_lemma:
    - lemma: "اِنْفِصَال"
      confirm:
        - text: "«الِانْفِصَال: عدم الِاتِّصَال عَمَّا من شَأْنه الِاتِّصَال وَقيل الِانْفِصَال حُدُوث هويتين.»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«الانفصال: هو ضد الاتصال. والحكماء يطلقونه أيضا على كون الشيء بحيث لا يمكن أن يفرض فيه أجزاء مشتركة في الحدود.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«انْفِصَال: من (ف ص ل) الانقطاع والمفارقة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(1) انعزال (2) انشقاق؛ انفصال.»"
          source: "المورد الحديث (2008) — مدخل secession"
          addition: "يُربط الانفصال بمفهوم الانشقاق السياسي (secession)"
        - text: "«انفصال — translation_en: separation — domain: Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
          addition: "الانفصال مصطلح مُثبّت في العلوم الاجتماعية بمعنى separation"
    - lemma: "اِنْشِقَاق"
      confirm:
        - text: "«(1) انعزال (2) انشقاق؛ انفصال.»"
          source: "المورد الحديث (2008) — مدخل secession"
      contradicts:
        - text: "«انشقاق المادة إلى فلقتين أو أكثر كشق الخشب وغيره»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          conflict: "الدلالة الأساسية مادّية فيزيائية (splitting) وليست سياسية"
    - lemma: "اِنْفِكَاك"
      evidence_status: "no_material_found"
    - lemma: "سِيَادَة"
      contradicts:
        - text: "«الغَلَبَةُ والسيطرة والهيمنةُ, أو حريَّةُ التصرفِ. يقال: دولةٌ ذات سيادة, أى: مستقِلَّةٌ»"
          source: "المعجم الكبير"
          conflict: "السيادة تدلّ على الغلبة والهيمنة وحقّ التصرّف، لا على حالة الانفصال والتمايز"
        - text: "«حق الدولة في ممارسة كافة صلاحياتها وبحرية على إقليمها البري والبحري والجوي ودون الخضوع لسلطة أية دولة أو سلطة أجنبية.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "السيادة مفهوم قانوني يتعلّق بالسلطة لا بالانفصال ذاته"

stage3_analysis:
  per_lemma:
    - lemma: "اِنْفِصَال"
      decision: confirmed
      decision_reason: "لمّة مؤكَّدة بأدلّة معجمية قوية من مصادر كلاسيكية ومعاصرة؛ الجذر ف ص ل يدلّ على تمييز الشيء من الشيء وإبانته عنه كما في مقاييس اللغة، والمصدر الانفعالي يدلّ على حالة الفصل والمفارقة وهو صميم مفهوم separateness"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على حالة المفارقة والانقطاع بين كيانين كانا متّصلين، مع تركيز على حصول الفصل ذاته"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْفِصَال"
    - lemma: "اِنْشِقَاق"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الأساسية مادّية (splitting, schistasis)، واستعماله السياسي بمعنى secession مقيّد ولا يرادف separateness بل يدلّ على فعل الخروج لا على حالة التمايز"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "اِنْفِكَاك"
      source: stage1
      decision: removed
      decision_reason: "لا أدلّة معجمية تدعم استعماله بالمعنى السياسي؛ المادة المعجمية الوحيدة طبّية (disinsertion)"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "سِيَادَة"
      source: stage1
      decision: removed
      decision_reason: "السيادة مفهوم مغاير دلالياً؛ تدلّ على الغلبة والسلطة العليا وحقّ التصرّف، بينما separateness يدلّ على حالة التمايز والانفصال. الفرق بينهما جوهري: السيادة نتيجة محتملة للانفصال وليست مرادفة له"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

