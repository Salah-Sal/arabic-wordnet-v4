        - text: "«بذرة — seed» (مجال: هندسة المياه)"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«بذرة — seed» (مجال: AGROVOC)"
          source: "المَكنَز الزراعي متعدد اللغات"
        - text: "«جسم صغير، عادة مدور أو مكور تقريباً، وأحياناً مجنح للمساعدة على الانتقال والانتشار بفعل الرياح، الذي يتطور من تلقيح البويضة، والذي تنشأ منه نبتة (شجرة) جديدة بعد الإنبات.»"
