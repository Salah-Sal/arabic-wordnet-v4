    - lemma: "لاعب مصنف"
      decision: confirmed
      decision_reason: >-
        المركب الوصفي «لاعِبٌ مُصَنَّف» هو الاصطلاح العربي الأمثن لمفهوم seeded player: جذر «لعب» يستوعب
        المعنى المرتبط باللاعب، وجذر «صنف» يعكس بدقة دلالة التصنيف والترتيب الرياضي. لم يظهر في قاعدة
        البيانات المعجمية بديلٌ مفرد موثَّق يضاهيه في الشيوع والدقة. الاستعمال الصحفي والرياضي العربي المعاصر
        يُرسِّخ هذا المركب. يحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        اللمة الوحيدة في المجموعة — الفرق الدلالي مقارنةً بالمفهوم العام «لاعب» (الهايبرنيم) أن «لاعِبٌ مُصَنَّف»
        يدل على تصنيف رسمي في بطولة مع ترتيب مدروس في جدول المباريات لمنع المواجهة المبكرة بين المصنَّفين؛
        وهو ما يميزه عن مجرد اللاعب البارع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبٌ مُصَنَّف"

    # ── مرشح ١: بَذْرَة (stage1) ──
    - lemma: "بَذْرَة"
      source: stage1
      decision: removed
      decision_reason: >-
        «بَذْرَة» موثَّق في المعاجم بمعناه النباتي/الزراعي حصراً (ما يتكون في الثمرة ويحوي الجنين النباتي).
        لا شاهد على استعماله في السياق الرياضي في العربية. بينما يستعير الإنجليزي «seed» من نفس الحقل
        الدلالي، فإن العربية اتجهت نحو المسار الاشتقاقي (مُصَنَّف) لا المجازي، فاستعمال «بذرة» الآن
        سيُحدث تنافراً بين الدلالة المعجمية الراسخة والاستعمال الرياضي المرغوب. اختبار السكّ: «بذرة» قابلة
        للإبدال بـ«حبة» أو «نواة» وصفاً لشيء آخر → ليست مصطلحاً رياضياً مثبَّتاً.

    # ── مرشح ٢: مُصَافٍ (stage1) ──
    - lemma: "مُصَافٍ"
      source: stage1
      decision: removed
      decision_reason: >-
        الصيغة «مُصَافٍ» على وزن مُفَاعِل من جذر «صفا» غير موثَّقة في المعاجم بالمعنى المراد. «مَصَافّ»
        الموثَّق جمعٌ لـ«مَصَفّ» ومعناه الصفوف/الرتب، لا اسم فاعل يعني «المُصطَفَى». الاشتقاق المقترح
        مصنوع ويفتقر إلى الشواهد، ويُخلط بين جذرَي صفو وصفف مما يُضعف الاطّراد.

    # ── مرشح ٣: مُقَدَّمٌ (stage1) ──
    - lemma: "مُقَدَّمٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        «مُقَدَّم» مشغول بمعانٍ راسخة متعددة: (أ) رتبة عسكرية/شرطية، (ب) المُقَدَّم المنطقي (antecedent)
        في الرياضيات والمنطق، (ج) الإبداع من «مقدِّم البرامج» في الإعلام. هذه الاشتراكات اللفظية الكثيفة
        تُحدث لبساً دلالياً يُعيق قبوله مصطلحاً رياضياً مُتفرِّداً. فضلاً عن ذلك لا شاهد على استعماله
        بمعنى «اللاعب المصنَّف» في أي مرجع معجمي.

    # ── مرشح ٤: رَأْسُ الجَدْوَل (stage1) ──
    - lemma: "رَأْسُ الجَدْوَل"
      source: stage1
      decision: removed
      decision_reason: >-
        اختبار التثبيت المعجمي: لا يُعثر على هذا التركيب في أي مصدر معجمي أو مصطلحي. اختبار السكّ:
        يمكن إبدال «رأس» بـ«قمة» أو «صدر» وبقيت العبارة وصفاً حراً — ليست مصطلحاً مسكوكاً. التركيب
        وصفي تحليلي لا يُفي بمعيار التثبيت الاصطلاحي.


