# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمّة الوحيدة «لاعب مصنف» خالية من التشكيل الكامل — يجب ضبطها بالشكل."
      - "المصطلح الإنجليزي «seed» (المفرد) غير ممثَّل بلمّة مستقلة في العربية؛ يُعبَّر عنه حصراً بالمركب الوصفي."
      - "التعريف العربي الحالي مصوغ بأسلوب حديث غير رسمي: استخدام صيغة «يتم» والجملة الاعتراضية بين قوسين يُضعفان دقته المعجمية."
      - "المفهوم (اللاعب المُصنَّف رياضياً) مُقتبَس من المنظومة الغربية للمسابقات، ولا يوجد له مقابل عربي مفرد راسخ في المعاجم."
    observations: >-
      المجموعة تُغطي مفهوماً رياضياً مُحدداً، هو اللاعب الذي يحمل تصنيفاً متقدماً في بطولة فيُوزَّع في جدول المباريات
      بعيداً عن نظرائه المصنَّفين تجنّباً لمواجهتهم في الجولات الأولى. المصطلح الإنجليزي «seed» يعتمد على الاستعارة من
      البذر الزراعي (البذرة تُزرع في موضع مخطَّط له)، وهذا المجاز لم يُستعَر في الاصطلاح الرياضي العربي، الذي اتجه
      إلى التركيب الوصفي «لاعب مصنَّف» نسبةً إلى جذر «صنَفَ» بمعنى التمييز والترتيب. اللمّة الحالية صحيحة من حيث
      الجوهر الدلالي لكنها تفتقر إلى التشكيل، وقد تحتمل المجموعة إضافة لمّة مفردة مشتقة إن وجدت شواهد.

  # المرشحات الأربعة — توليد أعمى (قبل الاطلاع على اللمات الموجودة)
  blind_candidates:
    - lemma: "بَذْرَة"
      generation_method: majaz
      justification: >-
        استعارة من جذر «بذر» (نثر الشيء وتفريقه)؛ الإنجليزية تستخدم «seed» بالدلالة ذاتها — اللاعب المزروع
        في موضع مخطَّط في جدول البطولة كما تُزرع البذرة في تربة مختارة. إحياء للمجاز الزراعي الغائب عن
        الاصطلاح الرياضي العربي.

    - lemma: "مُصَافٍ"
      generation_method: ishtiqaq
      justification: >-
        اشتقاق من جذر «صفو» (الخلوص والنقاء والاصطفاء) على وزن مُفَاعِل. «الصَّفِيُّ» في الأصل ما اصطفاه
        الإمام من المغنم لنفسه، أي المختار الأفضل. «مُصَافٍ» يحمل معنى «المُصطَفَى المُتقدِّم في الصُّفوف» دلالةً
        على اللاعب الذي اختاره التصنيف ووضعه في مقدمة المتنافسين.

    - lemma: "مُقَدَّمٌ"
      generation_method: ishtiqaq
      justification: >-
        اشتقاق من جذر «قدم» (السبق والتقدم) على وزن مُفَعَّل بمعنى «من جُعل في الأمام». يدل على اللاعب الذي
        قدَّمه التصنيفُ وجعله في المراتب الأولى من الجدول، بما يعكس الدلالة الوظيفية للمصنَّف في البطولات.

    - lemma: "رَأْسُ الجَدْوَل"
      generation_method: tarkib
      justification: >-
        مركب إضافي من «رأس» (الأول والمتقدم) + «الجدول» (جدول التوزيع والمباريات). اللاعب المصنَّف هو من
        يُوضع في رأس الجدول أي في موضع متقدم بعيد عن نظرائه المصنَّفين، وهذا التركيب الإضافي يعكس
        الآلية التنظيمية للمصطلح.


