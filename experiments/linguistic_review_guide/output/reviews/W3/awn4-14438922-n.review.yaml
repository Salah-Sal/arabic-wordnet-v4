      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يحمل دلالة مجازية على الانغلاق الإرادي داخل حيّز ضيّق (كالقوقعة)، ويُستخدم غالباً في السياقات الاجتماعية والنفسية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقَوْقُع"

    - lemma: "اِعْتِزَال"
      source: stage1
      decision: removed
      decision_reason: "رغم ثبوته معجمياً، فإنّ دلالته تميل إلى الانسحاب الإرادي من منصب أو جماعة (عمالة أو إمارة)، وهو أضيق من المفهوم العامّ للمجموعة. كما أنّ وجود «انعزال» من الجذر نفسه يجعل إضافته تكراراً جذرياً دون فائدة تمييزية كافية"

    - lemma: "اِنْزِوَاء"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر على شواهد معجمية، والجذر ز-و-ي يدلّ أصلاً على الانضمام والتجمُّع عند ابن فارس لا على الانفصال، فالدلالة المعاصرة توسُّع دلالي غير مؤصَّل"

    - lemma: "تَقَوْقُع"
      source: stage1
      decision: removed
      decision_reason: "موجود فعلاً ضمن لمّات المجموعة الحالية، فلا حاجة لإضافته مرشَّحاً"

    - lemma: "تَنَائِي"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر على شواهد معجمية، وصيغة التفاعل تدلّ على التباعد المتبادل بين طرفين لا على حالة العزلة الذاتية"


