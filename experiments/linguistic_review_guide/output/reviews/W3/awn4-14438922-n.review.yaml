# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14438922-n
# the state of being isolated or detached
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «انعزال» مشتركة مع المجموعة الأعلى (hypernym awn4-14438119-n) التي تحتوي أيضاً على «انعزال» و«عزلة»، ممّا يُضعف التمييز بين المستويَيْن"
      - "التعريف العربي «حالة العزلة أو الانفصال» شبه دائري، إذ يستخدم «العزلة» لتعريف مجموعة تحتوي «انعزال» من الجذر نفسه"
      - "التعريف يكاد يطابق تعريف المجموعة الأعلى «حالة انفصال بين الأشخاص أو المجموعات»، ولا يُبرز الفصل النوعي بينهما"
    observations: "المجموعة تُعبّر عن حالة الانفصال والانقطاع عن المحيط بمعناها العامّ، وتقابل المصطلحات الإنجليزية insulation/insularity/detachment. اللمّة «تقوقع» تضيف بُعداً مجازياً (الانغلاق داخل قوقعة) يميّز هذه المجموعة عن المجموعة الأعلى الأعمّ. اللمّة «انعزال» مصدر الفعل انعزل (باب الانفعال) ودلالته على حالة ناتجة عن فعل التنحية، وهو مناسب دلالياً."

  blind_candidates:
    - lemma: "اِعْتِزَال"
      generation_method: ishtiqaq
      justification: "مصدر الفعل اعتزل (باب الافتعال) من جذر ع-ز-ل، يدلّ على اختيار الانفراد والتباعد عن الجماعة طوعاً، وهو مثبت في المعاجم الكلاسيكية"
    - lemma: "اِنْزِوَاء"
      generation_method: ishtiqaq
      justification: "مصدر انزوى (باب الانفعال) من جذر ز-و-ي، يدلّ على الانكفاء والتقبُّض في ناحية، وأصله من الانضمام والتجمُّع عند ابن فارس"
    - lemma: "تَقَوْقُع"
      generation_method: majaz
      justification: "مجاز من القوقعة (صَدَفة الحلزون)، يدلّ على الانكماش داخل غلاف والانغلاق على الذات كالحلزون في قوقعته"
    - lemma: "تَنَائِي"
      generation_method: ishtiqaq
      justification: "مصدر تنائى (باب التفاعل) من جذر ن-أ-ي، يدلّ على التباعد المتبادل بين الأطراف"


stage2_evidence:
  per_lemma:
    - lemma: "اِنْعِزَال"
      confirm:
        - text: "«انعِزَال — seclusion»"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
        - text: "«انعزال — isolation: الحالة التي تفصل فيها حواجز بيئية أو اجتماعية بين الجماعات التي لديها القدرة على التزاوج، وبذلك يحال بينهم وبين التزاوج»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«انعزال — segregation»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«(1) «أ» عَزْل. «ب» انعزال (2) العازل: مادة عازلة — insulation»"
          source: "المورد الحديث (2008)"
        - text: "«(1) عَزْل (2) عُزْلة؛ انعزال — isolation»"
          source: "المورد الحديث (2008)"
        - text: "«(4) انعزال — detachment»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«انْعِزالٌ اجْتِماعِيّ — desocialization»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستخدم «انعزال» مركَّباً مع صفات تخصيصية في المصطلحات العلمية"

    - lemma: "تَقَوْقُع"
      evidence_status: "no_material_found"

    - lemma: "اِعْتِزَال"
      confirm:
        - text: "«باعده وباينه وَخَالفهُ وزايله واعتزله وانفصل عَنهُ وفارقه»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
        - text: "«الاعتزال: طلب العزل، وهو الانفراد عما شأنه الاشتراك. والاعتزال تجنب الشيء عمالة أو إمارة أو غيرهما بالبدن أو القلب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«(2) اعتزال — retirement»"
          source: "المورد الحديث (2008)"
          addition: "يُستخدم «اعتزال» بمعنى التقاعد والانسحاب الإرادي"

    - lemma: "اِنْزِوَاء"
      evidence_status: "no_material_found"

    - lemma: "تَنَائِي"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "اِنْعِزَال"
      decision: confirmed
      decision_reason: "مصدر مثبت في معاجم المصطلحات الحديثة بدلالة isolation/seclusion/insulation، وهو المقابل الأدقّ للمفهوم. رغم وجوده في المجموعة الأعلى، فإنّ تعدّد المعاني (polysemy) يبرّر ذلك"
