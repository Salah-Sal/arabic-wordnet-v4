# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14037117-n
# a state of abeyance or suspended business — حالة تعليق أو وقف الأعمال
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «عطلة» تدلّ في الاستعمال المعاصر على الإجازة (vacation) أكثر من دلالتها على حالة وقف الأعمال (abeyance)، فقد يختلط المفهومان"
      - "المجموعة تفتقر إلى لمّة تعبّر عن البُعد الدلالي للإرجاء المفتوح غير المحدّد بأجل"
      - "اللمّتان الموجودتان بدون تشكيل"
    observations: "المجموعة تعبّر عن حالة (state) لا عن فعل، وهي تجمع مفهومَيْن متقاربَيْن: التأجيل (deferral) وهو تأخير الأمر إلى وقت لاحق، والعطلة (recess) وهي مدة توقّف الأعمال. المفهوم الجامع بينهما هو التعليق المؤقت للنشاط. يستحسن إضافة لمّة تغطي دلالة الإرجاء."
  blind_candidates:
    - lemma: "إِرْجَاء"
      generation_method: ishtiqaq
      justification: "مصدر أَرْجَأَ على وزن إِفْعَال من الجذر (رجأ)، يدلّ على تأخير الأمر وتعليقه إلى أجل مسمّى أو غير مسمّى، وهو أقرب اللمّات إلى مفهوم abeyance"
    - lemma: "تَعْطِيل"
      generation_method: ishtiqaq
      justification: "مصدر عَطَّلَ على وزن تَفْعِيل من الجذر (عطل)، يدلّ على إيقاف الشيء عن وظيفته وتعليق العمل به مؤقتاً"
    - lemma: "مُهْلَة"
      generation_method: ishtiqaq
      justification: "من الجذر (مهل) على وزن فُعْلَة، تدلّ على التُّؤَدَة والتريّث وإتاحة فسحة من الوقت قبل استئناف العمل"
    - lemma: "رُكُود"
      generation_method: majaz
      justification: "من الجذر (ركد) بمعنى السكون والثبات، مجاز عن حالة الجمود وتوقّف الحركة في الأعمال"

stage2_evidence:
  per_lemma:
    - lemma: "تَأْجِيل"
      confirm:
        - text: "«التأجيل: ضرب الأجَل للشيء وجعله في المؤجَّل، وأيضاً تعليقُ الدَّين وتأخيره إلى وقت معين، والتأجُّل: طلب التأجيل.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«تأجيل؛ إرجاء؛ تأخير.»"
          source: "المورد الحديث (2008) — ترجمة postponement"
        - text: "«تأجيل السير في الدعوى، قرار تتخذه المحكمة عندما لا تتمكن من البت في قضية في جلسة معينة، بحيث تؤجل القضية إلى جلسة أخرى لاستكمال دراسة الدعوى.»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — adjournment"
      expands:
        - text: "«تأجيل — postponement»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يُستعمل في المجال القانوني بمعنى التأخير الإجرائي"
        - text: "«تَأْجيل — postponement»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُستعمل أيضاً في المجال الطبي"

    - lemma: "عُطْلَة"
      confirm:
        - text: "«بقاء العامل بلا عمل، مدة يوم أو أكثر تعطَّلُ فيها الدواوين والمدارس. (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«(4) عطلة.»"
          source: "المورد الحديث (2008) — ترجمة recess"
        - text: "«عُطْلة — من (ع ط ل) الإجازة من العمل ومن الدراسة.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«عطلة — vacation»"
          source: "مسرد التربية، أليكسو"
          addition: "الاستعمال المعاصر يركّز على معنى الإجازة (vacation) أكثر من معنى وقف الأعمال (recess)"

    - lemma: "إِرْجَاء"
      confirm:
        - text: "«إرجاء — إلى أجل مسمّى أو غير مسمّى — postponement»"
          source: "مسرد الإعلام والتواصل، أليكسو"
        - text: "«(1) ... «د» إرجاء. «هـ» توقّف عن الدَّفع»"
          source: "المورد الحديث (2008) — ترجمة suspension"
        - text: "«تأجيل؛ إرجاء؛ تأخير.»"
          source: "المورد الحديث (2008) — ترجمة postponement"

    - lemma: "تَعْطِيل"
      confirm:
        - text: "«(1) تعطيل؛ تعليق؛ إيقاف مؤقَّت»"
          source: "المورد الحديث (2008) — ترجمة abeyance"
        - text: "«(1) «ب» تعطيل مؤقَّت. «ج» تعليق.»"
          source: "المورد الحديث (2008) — ترجمة suspension"
      contradicts:
        - text: "«تخريب فعالية أو وظيفة أو بنية حيوية بتعريضها لعوامل فيزيائية أوكيميائية وغيرها — inactivation»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          conflict: "في المجال العلمي يدلّ التعطيل على الإبطال الكلي للفعالية لا على التعليق المؤقت"
        - text: "«التّعطيل: عند البلغاء قسم من الحذف... والمعطل عند أهل الشرع هو الكافر الذي لا يعتقد بوجود الباري»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المصطلح محمّل بدلالات بلاغية وعقدية قد تشوّش على المعنى المراد"

    - lemma: "مُهْلَة"
      contradicts:
        - text: "«التُّؤَدَة والرِّفْق. يقال: خذ المُهْلَة في أمرك»"
          source: "المعجم الوسيط"
          conflict: "المهلة تدلّ على التُّؤَدَة والرِّفْق والفسحة الزمنية، لا على حالة وقف الأعمال"
        - text: "«مهلة — time limit»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "في الاصطلاح التجاري تعني المهلة الحدّ الزمني لا التعليق"

    - lemma: "رُكُود"
      contradicts:
        - text: "«الرُّكودُ: السُّكونُ، والثَّباتُ.»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الركود سكون دائم وثبات لا تعليق مؤقت"
        - text: "«ركود — stagnation»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "في الاقتصاد يدلّ على ركود السوق وهو مفهوم مختلف عن تعليق الأعمال"

stage3_analysis:
  per_lemma:
    - lemma: "تَأْجِيل"
      decision: confirmed
      decision_reason: "لمّة فصيحة مؤصّلة من الجذر (أجل)، مُوثَّقة في المعاجم الكلاسيكية والمعاصرة بمعنى تأخير الأمر إلى وقت لاحق، تُطابق الدلالة الإنجليزية deferral مطابقة دقيقة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على فكرة ضرب أجل محدَّد وتأخير الأمر إليه، أي التأخير المُجدوَل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَأْجِيل"

    - lemma: "عُطْلَة"
      decision: confirmed
      decision_reason: "لمّة محدثة ثابتة في المعجم الوسيط بمعنى مدة وقف الأعمال في الدواوين والمدارس، تُطابق دلالة recess بوصفها فترة تعليق رسمي للنشاط"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الفترة الزمنية المحدّدة التي تتوقف فيها الأعمال رسمياً (إجازة مؤسسية)، بخلاف التأجيل الذي يركّز على فعل التأخير"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُطْلَة"

    - lemma: "إِرْجَاء"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر أَرْجَأَ، مُوثَّق في أليكسو والمورد الحديث بمعنى التأخير إلى أجل مسمّى أو غير مسمّى، يُغطّي البُعد الدلالي للإرجاء المفتوح (abeyance) الذي لا تغطيه اللمّتان الأخريان بدقة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على تأخير الأمر دون تحديد أجل بالضرورة، أي التعليق الذي قد يكون مفتوحاً، وهو الأقرب إلى مفهوم abeyance"
      actions:
        - command: create_entry
          params:
            lemma: "إِرْجَاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَعْطِيل"
      source: stage1
      decision: removed
      decision_reason: "رغم وروده في المورد الحديث ترجمةً لـ abeyance، فإنّ دلالته الأساسية في المعاجم المتخصصة هي الإبطال الكلي للفعالية (inactivation/deactivation)، وهو محمّل بدلالات عقدية (التعطيل عند المتكلمين)، فلا يصلح للترادف مع تأجيل وعطلة"

    - lemma: "مُهْلَة"
      source: stage1
      decision: removed
      decision_reason: "المهلة تدلّ على التُّؤَدَة والفسحة الزمنية الممنوحة، لا على حالة وقف الأعمال ذاتها. وفي الاصطلاح التجاري تعني الحدّ الزمني (time limit)، وهو مفهوم مغاير"

    - lemma: "رُكُود"
      source: stage1
      decision: removed
      decision_reason: "الركود يدلّ على السكون الدائم والجمود الاقتصادي (stagnation)، وهو حالة سلبية مستمرة لا تعليق مؤقت يُنتظر بعده استئناف"

