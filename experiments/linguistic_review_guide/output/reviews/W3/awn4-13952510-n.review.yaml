# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13952510-n
# blood brotherhood — أخوة الدم
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «أخوة الدم» تعبير مركب إضافي قد يكون ترجمة حرفية للإنجليزية blood brotherhood"
      - "المجموعة تحتوي على لمّة واحدة فقط، ما يُضعف التغطية المعجمية"
      - "التعريف العربي «الصداقة المميزة لإخوة الدم» فيه دَور جزئي — يُعرّف أخوة الدم بإخوة الدم"
    observations: "المفهوم يتعلق بالرابطة التي تنشأ بين شخصين يتعاهدان بمزج دمائهما أو بعهد مقدّس، فيصيران كالأخوين. هذا المفهوم معروف في الثقافة العربية تحت مسمّيات عدة: المؤاخاة (كما في مؤاخاة النبي ﷺ بين المهاجرين والأنصار)، والحِلف (كأحلاف الجاهلية)، والصداقة المؤكَّدة بالعهد. التعريف الحالي ضعيف لأنه يدور على نفسه ويحتاج إعادة صياغة."
  blind_candidates:
    - lemma: "مُؤَاخَاة"
      generation_method: ishtiqaq
      justification: "مصدر «آخَى يُؤاخِي مُؤاخَاةً» على وزن مُفَاعَلة، يدل على اتخاذ شخص أخاً لك بالعهد لا بالنسب. استُعمل تاريخياً في مؤاخاة النبي ﷺ بين المهاجرين والأنصار، وهو أقرب مصطلح عربي أصيل لمفهوم الأخوة بالعهد والدم."
    - lemma: "حِلْفُ الدَّمِ"
      generation_method: tarkib
      justification: "مركب إضافي من «حِلْف» (العهد والتحالف) و«الدم»، يشير إلى العهد المؤكَّد بالدم بين شخصين في التقاليد العربية القديمة. الحِلف مصطلح جاهلي ثابت يدل على الرابطة المقدّسة."
    - lemma: "إِخَاء"
      generation_method: ishtiqaq
      justification: "مصدر «آخَى» على وزن إفْعال، يدل على رابطة الأخوة غير النسبية. ورد في القرآن ﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾ بمعنى الأخوة الروحية. يُستعمل للأخوة المُختارة لا البيولوجية."
    - lemma: "أُخُوَّةُ الدَّمِ"
      generation_method: tarkib
      justification: "إعادة تشكيل اللمّة الموجودة بصيغة «أُخُوَّة» المعيارية (بتشديد الواو وتاء التأنيث المربوطة) بدل «أخوة» المجرّدة من التشكيل. هذا هو الضبط الصحيح الوارد في المعاجم."

stage2_evidence:
  per_lemma:
    - lemma: "أُخُوَّةُ الدَّمِ"
      confirm:
        - text: "«أُخُوَّة الدم؛ الأُخُوَّة بالدم.» — ترجمة blood brotherhood"
          source: "المورد الحديث (2008)"
        - text: "«أخوة الدم» — ترجمة blood brother hood في مجال علم الاجتماع والأنثروبولوجيا"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm/ALECSO)"
      expands:
        - text: "«الصلة بين الأخوين بالقرابة أو بالرضاعة أو بالصداقة»"
          source: "المعجم الكبير"
          addition: "تعريف الأُخُوَّة العام يشمل ثلاثة أنواع: القرابة والرضاعة والصداقة، ما يؤكد أن أخوة الدم نوع خاص من الأخوة"

    - lemma: "مُؤَاخَاة"
      evidence_status: "no_material_found"

    - lemma: "حِلْفُ الدَّمِ"
      expands:
        - text: "«الحَلْفُ والحَلِفُ في القَسَم... وحالَفَ فلانٌ فلاناً، فهو حَليفُه، وبينَهما حِلْفٌ لأنَّهُما تَحالَفا بالأَيْمانِ أنْ يَفيَ كُلٌّ لكُلٍّ»"
          source: "كتاب العين — الخليل بن أحمد"
          addition: "الحِلف يدل على التعاهد بالأيمان والوفاء المتبادل، وهو قريب من مفهوم أخوة الدم لكنه أعم — يشمل التحالف القبلي والسياسي"

    - lemma: "إِخَاء"
      confirm:
        - text: "«(1) أُخُوَّة (2) إخاء (3) أَخَوِيّة؛ رَهْبنة؛ منظَّمة؛ نقابةُ صُنّاع» — ترجمة brotherhood"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) الأخَويّة: جماعة منظَّمة لغرض مشترك (2) جمعية (3) إخاء؛ أخوَّة» — ترجمة fraternity"
          source: "المورد الحديث (2008)"
          addition: "الإخاء يُرادف الأخوّة في الدلالة العامة على رابطة الأخوة، لكنه أعم من أخوة الدم تحديداً"

stage3_analysis:
  per_lemma:
    - lemma: "أُخُوَّةُ الدَّمِ"
      decision: confirmed
      decision_reason: "مصطلح ثابت مسجّل في المورد الحديث ومسرد علم الاجتماع والأنثروبولوجيا (ALECSO) مقابل blood brotherhood. مركب إضافي مسكوك لا يقبل الاستبدال (لا يصح: *صداقة الدم، *رابطة الدم بنفس المعنى المخصوص). يحتاج تصحيح التشكيل من «أخوة الدم» إلى «أُخُوَّةُ الدَّمِ»."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح الاصطلاحي المباشر لمفهوم blood brotherhood، يدل تحديداً على الرابطة المؤسَّسة بطقس مزج الدم أو التعاهد عليه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُخُوَّةُ الدَّمِ"

    - lemma: "مُؤَاخَاة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل مشتق من «آخَى يُؤاخِي مُؤاخاةً»، يدل على اتخاذ الأخ بالاختيار لا بالنسب. له سند تاريخي راسخ في مؤاخاة النبي ﷺ بين المهاجرين والأنصار. وإن لم يرد في قاعدة البيانات المعجمية بمدخل مستقل، فهو مصدر قياسي لفعل ثابت، واسع الاستعمال في كتب السيرة والتاريخ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على فعل اتخاذ الأخوة بالاختيار والعهد (المصدر)، ويركّز على البُعد الإرادي والعهدي للرابطة دون تخصيص بطقس الدم"
      actions:
        - command: create_entry
          params: {lemma: "مُؤَاخَاة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حِلْفُ الدَّمِ"
      source: stage1
      decision: removed
      decision_reason: "الحِلف أعم من أخوة الدم — يشمل التحالف القبلي والسياسي والعسكري. لم يُسجَّل «حلف الدم» بوصفه وحدة معجمية ثابتة في أي معجم. كما أن الحلف يفتقر إلى بُعد الصداقة الحميمة الذي يميّز هذه المجموعة الترادفية."

    - lemma: "إِخَاء"
      source: stage1
      decision: removed
      decision_reason: "الإخاء مرادف عام للأخوّة يشمل كل أنواع الأخوة (بالنسب والدين والصداقة). لا يتخصص بمفهوم أخوة الدم تحديداً. إضافته ستوسّع المجموعة عن نطاقها المقصود."

    - lemma: "أُخُوَّةٌ بِالدَّمِ"
      source: stage1
      decision: removed
      decision_reason: "ورد في المورد الحديث بصيغة «الأُخُوَّة بالدم» كمرادف لأخوة الدم، لكنه تعبير وصفي حر (يصح: أخوة بالرضاع، أخوة بالنسب) وليس مصطلحاً مسكوكاً. يُكتفى بالمركب الإضافي «أخوة الدم»."

