# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14039067-n (logjam)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي وتحتاج صياغة معجمية أصيلة"
      - "اللمّة «انسداد» عامّة جداً (أي سدّ) ولا تختصّ بالتوقف الناجم عن نشاط غير عادي"
      - "المركب «طريق مسدود» معناه الحرفي الطريق المغلق (dead end) لا التوقف المؤقت بسبب التراكم"
      - "اللمّتان بلا تشكيل"
    observations: "المجموعة تمثّل مفهوم الـlogjam المجازي: توقّف حركة الأمور بسبب تراكم النشاط أو تشابكه. المفرط الدلاليّ هو «توقّف/كبح»، والفارق النوعي هو أنّ سبب التوقف نشاطٌ غير عاديّ (ازدحام، تراكم). يحتاج المفهوم إلى لمّة تجمع بين دلالتَي الانسداد والتراكم."
  blind_candidates:
    - lemma: "اِخْتِنَاق"
      generation_method: ishtiqaq
      justification: "من جذر خ ن ق على وزن افتعال، يدلّ على الضيق الشديد الذي يعوق الحركة، وقد استُعمل في الاقتصاد والمرور بمعنى الاختناق المروري (bottleneck)."
    - lemma: "تَكَدُّس"
      generation_method: ishtiqaq
      justification: "من جذر ك د س على وزن تفعّل، يدلّ على تراكم الأشياء بعضها فوق بعض حتى تتكوّم، وهو قريب من المعنى الحرفي لـlogjam (تراكم الأخشاب)."
    - lemma: "اِحْتِقَان"
      generation_method: ishtiqaq
      justification: "من جذر ح ق ن على وزن افتعال، يدلّ على تجمّع السوائل وعدم جريانها، وقد يمتدّ مجازاً إلى تراكم الأعمال وتوقّفها."
    - lemma: "مَأْزِق"
      generation_method: ishtiqaq
      justification: "من جذر أ ز ق على وزن مَفْعِل، المضيق الحرج الذي يتعذّر فيه التقدّم. وقد استُعمل في المورد الحديث ترجمةً لـlogjam وdeadlock."

stage2_evidence:
  per_lemma:
    - lemma: "اِنْسِدَاد"
      confirm:
        - text: "«السِّينُ وَالدَّالُ أَصْلٌ وَاحِدٌ، وَهُوَ يَدُلُّ عَلَى رَدْمِ شَيْءٍ وَمُلَاءَمَتِهِ. مِنْ ذَلِكَ سَدَدْتُ الثُّلْمَةَ سَدًّا. وَكُلُّ حَاجِزٍ بَيْنَ الشَّيْئَيْنِ سَدٌّ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«(1) سَدّ؛ اعتراض سبيل (2) انسداد»"
          source: "المورد الحديث — blockage"
      expands:
        - text: "«إنسداد الفتحة» — aperture blockage"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يُستعمل انسداد في السياقات التقنية بمعنى الانغلاق المادّي"

    - lemma: "طَرِيقٌ مَسْدُود"
      confirm:
        - text: "«الطريق المسدود: توقُّفٌ تامّ أو حالة يُصبح فيها التقدُّم مستحيلًا؛ إخفاق تامّ في التوصّل إلى اتفاق لتسوية نزاع ما»"
          source: "المورد الحديث — deadlock"
        - text: "«(1) الطُّفاوة المتشابكة: أخشاب طافية متشابكة بحيث يتعذّر تحريكها (2) مأزِق؛ طريق مسدود»"
          source: "المورد الحديث — logjam"
      expands:
        - text: "«(5) مأزِق؛ طريق مسدود»"
          source: "المورد الحديث — bottleneck"
          addition: "يُستعمل طريق مسدود مجازياً للدلالة على الجمود التفاوضي"

    - lemma: "مَأْزِق"
      confirm:
        - text: "«المَضِيق الحَرِج»"
          source: "المعجم الوسيط"
        - text: "«(2) مأزِق؛ طريق مسدود»"
          source: "المورد الحديث — logjam"
        - text: "«(2) ورطة؛ مأزق»"
          source: "المورد الحديث — stalemate"
      expands:
        - text: "«الْهَمْزَةُ وَالزَّاءُ وَالْقَافُ قِيَاسٌ وَاحِدٌ وَأَصْلٌ وَاحِدٌ، وَهُوَ الضِّيقُ. الْأَزْقُ الضِّيقُ فِي الْحَرْبِ، وَكَذَلِكَ يُدْعَى مَكَانُ الْوَغَى الْمَأْزِقُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر الضيق في الحرب، والمأزق أصلاً مكان الحرب الضيّق ثم عُمّم"

    - lemma: "اِخْتِنَاق"
      confirm:
        - text: "«مرحلة يتعطل فيها تدفق الانتاج عن المستوى المطلوب يعبر عنه في الأدبيات الاقتصادية بـ‹عنق الزجاجة›»"
          source: "المعجم الموحد لمصطلحات الاقتصاد — مُخْتَنَق/bottleneck"
      contradicts:
        - text: "«الاختناق: امتناع نفوذ النفس إلى الرية والقلب أو تعسره. واختناق الرحم...»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المعنى الأصلي والطبي هو الخنق الجسدي (suffocation) لا التوقف بسبب التراكم"
      expands:
        - text: "«الْخَاءُ وَالنُّونُ وَالْقَافُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ضِيقٍ. فَالْخَانِقُ: الشِّعْبُ الضَّيِّقُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر الضيق، لكنّه يُستعمل في المصطلح الاقتصادي بصيغة مُخْتَنَق لا اختناق"

    - lemma: "تَكَدُّس"
      contradicts:
        - text: "«الْكَافُ وَالدَّالُ وَالسِّينُ ثَلَاثُ كَلِمَاتٍ لَا يُشْبِهُ بَعْضُهَا بَعْضًا. فَالْأُولَى: كُدْسُ الطَّعَامِ. وَالثَّانِيَةُ التَّكَدُّسُ، وَهُوَ مَشْيُ الْفَرَسِ كَأَنَّهُ مُثْقَلٌ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "التكدّس في اللغة إما تراكم الطعام أو مشي الفرس المثقل، وليس فيه دلالة على التوقف أو الانسداد"

    - lemma: "اِحْتِقَان"
      contradicts:
        - text: "«زيادة الدم في أوعية جزء أو عضو، ينشأ إما بورود دم أكثر من معدل التصريف الطبيعي، أو تعويق في هذا التصريف»"
          source: "معجم المصطلحات الطبية"
          conflict: "الاحتقان مصطلح طبي خالص يدلّ على تجمّع الدم في الأوعية، لا على التوقف الناجم عن نشاط غير عادي"

stage3_analysis:
  per_lemma:
    - lemma: "اِنْسِدَاد"
      decision: confirmed
      decision_reason: "مصدر على وزن انفعال من سدّ، يدلّ على حدوث الانسداد/الانغلاق. وإن كان عامّاً فإنه يغطي المفهوم بوصفه توقّفاً ناجماً عن عائق. اللمّة الأصلية بلا تشكيل فتحتاج تحديثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد المادي للانغلاق والانسداد، ويُستعمل في السياقات التقنية والمرورية بمعنى الانسداد الفعلي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْسِدَاد"

    - lemma: "طَرِيقٌ مَسْدُود"
      decision: confirmed
      decision_reason: "مركب وصفي ثابت معجمياً، مُوثّق في المورد الحديث ترجمةً لـdeadlock وlogjam. يدلّ على حالة الجمود التام والعجز عن التقدّم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على البُعد المجازي: استحالة التقدّم والوصول إلى نتيجة، ويُستعمل غالباً في السياقات السياسية والتفاوضية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَرِيقٌ مَسْدُود"

    - lemma: "مَأْزِق"
      source: stage1
      decision: confirmed
      decision_reason: "وارد في المعجم الوسيط بمعنى المضيق الحرج، ومُوثّق في المورد الحديث ترجمةً مباشرة لـlogjam. جذره أزق يدلّ على الضيق. مصطلح فصيح أصيل ومتداول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الحرج والضيق الذي لا مخرج منه، ويجمع بين المعنى الحسّي (المضيق) والمجازي (الورطة)، ويُستعمل في السياقات العامة والإعلامية"
      actions:
        - command: create_entry
          params: {lemma: "مَأْزِق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "اِخْتِنَاق"
      source: stage1
      decision: removed
      decision_reason: "معناه الأصلي الخنق الجسدي (suffocation). والاستعمال الاقتصادي بمعنى bottleneck يأتي بصيغة مُخْتَنَق لا اختناق. فضلاً عن أنّ المجموعة تمثّل logjam لا bottleneck."

    - lemma: "تَكَدُّس"
      source: stage1
      decision: removed
      decision_reason: "التكدّس يدلّ على التراكم والتكوّم لا على التوقف. ومقاييس اللغة يحصره في كدس الطعام ومشي الفرس المثقل. لا يتضمّن دلالة الانسداد أو التعطّل."

    - lemma: "اِحْتِقَان"
      source: stage1
      decision: removed
      decision_reason: "مصطلح طبي خالص يدلّ على تجمّع الدم في الأوعية. لا يناسب دلالة المجموعة (توقف بسبب نشاط غير عادي)."

