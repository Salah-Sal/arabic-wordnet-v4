# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13871081-n (twentieth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «المتمم للعشرين» تستخدم صيغة «المُتَمِّم» (اسم فاعل فعّل) بينما المصادر المعجمية تذكر «المُتِمّ» (اسم فاعل أتمّ) في التعبير الفصيح «الكتاب المتمّ للعشرين»"
      - "اللمّتان بلا تشكيل كامل"
      - "التعريف العربي ترجمة حرفية من الإنجليزي ولا يتّسق مع أسلوب المعاجم العربية"
    observations: "المجموعة تمثّل العدد الترتيبي العشرين، وهو مفهوم نحوي عربي أصيل. العربية تستخدم ألفاظ العقود (عشرون، ثلاثون...) في مقام الأعداد الترتيبية بإضافة «ال» التعريف، وقد أقرّ مجمع اللغة العربية بالقاهرة هذا الاستعمال. الأسلوب الفصيح الأصلي هو «المتمّ للعشرين» لكنّ «العشرون» صحيح مُجمعيّاً."

  blind_candidates:
    - lemma: "الْعِشْرُونَ"
      generation_method: ishtiqaq
      justification: "العدد عشرون بأل التعريف يُستعمل في العربية للدلالة على المرتبة العشرين في سلسلة، وهو مشتق من الجذر ع-ش-ر"
    - lemma: "الْمُتِمُّ لِلْعِشْرِينَ"
      generation_method: tarkib
      justification: "تركيب وصفي ثابت يعني الذي يُتمّ العشرين، وهو التعبير الفصيح الأصلي عن المرتبة العشرين"
    - lemma: "تَمَامُ الْعِشْرِينَ"
      generation_method: tarkib
      justification: "تركيب إضافي بمعنى ما يكتمل به العشرون، مأخوذ من المعنى الأصلي للتعبير عن الترتيب في ألفاظ العقود"
    - lemma: "عِشْرِينِيّ"
      generation_method: ishtiqaq
      justification: "اشتقاق بالنسبة من عشرين على وزن فِعْلِينِيّ للدلالة على النسبة إلى العشرين"

stage2_evidence:
  per_lemma:
    - lemma: "الْعِشْرُونَ"
      confirm:
        - text: "«العِشْرُون — الجذر: ع ش ر — مثال: الكتاب العشرون — الرأي: مرفوضة — السبب: لاستعمال لفظ العقد «عشرون» وصفًا للمفرد — الصواب والرتبة: الكتاب المتم للعشرين [فصيحة] - الكتاب العشرون [صحيحة] — التعليق: استخدم هذا الأسلوب جماعة من قدامى العلماء، ومنه قولهم: الجزء العشرون، والورقة العشرون على معنى تمام العشرين، فتحذف كلمة التمام وتقام العشرون مقامها، وقد أقره مجمع اللغة المصري.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«(1) العشرون the twentieth day (2) مؤلِّفٌ جزءًا من عشرين (3) العشرون من the twentieth of June (4) جزء من عشرين.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«عِشْرُونَ: بلفظ عشرون في العدد، قال الليث: قلت للخليل ما معنى العشرين؟ قال: جماعة عشر من أظماء الإبل... والصحيح عند النحويين أن هذا الاسم وضع لهذا العدد بهذه الصيغة وليس بجمع لعشر»"
          source: "معجم البلدان لياقوت الحموي"
          addition: "يوضّح أن عشرين اسم وُضع لهذا العدد بصيغته ولا يُعدّ جمعاً لعشر"

    - lemma: "الْمُتَمِّمُ لِلْعِشْرِينَ"
      contradicts:
        - text: "«الصواب والرتبة: الكتاب المتم للعشرين [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "الصيغة الفصيحة هي «المُتِمّ» (اسم فاعل أتمّ، الرباعي) لا «المُتَمِّم» (اسم فاعل تمّم، المضعّف). اللمّة الحالية تستخدم صيغة مختلفة عن المثبتة في المعاجم."
      expands:
        - text: "«المتَمِّمُ: يُقال للركن الثالث في بحر الرمل، يكون بلا نقصان كما هو في الأصل.»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "المُتَمِّم في الاصطلاح العروضي يدلّ على الركن التام، وهو معنى مختلف عن الترتيب العددي"

    - lemma: "تَمَامُ الْعِشْرِينَ"
      confirm:
        - text: "«الكتاب العشرون على معنى تمام العشرين، فتحذف كلمة التمام وتقام العشرون مقامها»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«(تَمَّ) التَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ، وَهُوَ دَلِيلُ الْكَمَالِ. يُقَالُ تَمَّ الشَّيْءُ، إِذَا كَمَلَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل المادة يدلّ على الكمال والتمام"

    - lemma: "عِشْرِينِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الْعِشْرُونَ"
      decision: confirmed
      decision_reason: "لفظ «العشرون» مع أل التعريف هو التعبير المعياري عن المرتبة العشرين، أقرّه مجمع اللغة المصري وشاع استعماله قديماً وحديثاً. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الشكل المختصر الشائع الذي يُستعمل وصفاً مباشراً للمعدود (الجزء العشرون)، وهو أيسر تداولاً من «المتمّ للعشرين»"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْعِشْرُونَ"

    - lemma: "الْمُتَمِّمُ لِلْعِشْرِينَ"
      decision: confirmed
      decision_reason: "التعبير صحيح من حيث المعنى لكنّ الصيغة الفصيحة المثبتة في معجم الصواب اللغوي هي «المُتِمّ للعشرين» (من أتمّ) لا «المُتَمِّم» (من تمّم). يُصحَّح التشكيل والصيغة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "التعبير الفصيح الأصلي الذي يكشف البنية الدلالية الكامنة (= الذي يُتمّ العشرين)، أفصح من «العشرون» وإن كان أقلّ شيوعاً في الاستعمال المعاصر"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْمُتِمُّ لِلْعِشْرِينَ"

    - lemma: "الْعِشْرُونَ"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمّة الموجودة «العشرون»، لا حاجة لتكراره"

    - lemma: "الْمُتِمُّ لِلْعِشْرِينَ"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمّة الموجودة «المتمم للعشرين» بعد تصحيح صيغتها إلى «المتمّ للعشرين»"

    - lemma: "تَمَامُ الْعِشْرِينَ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً مسكوكاً ثابتاً، إذ يمكن إبدال «تمام» بـ«اكتمال» أو «إتمام» والمعنى لا يتغير، فلا تجتاز اختبار السكّ"

    - lemma: "عِشْرِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "النسبة إلى العشرين تدلّ على الانتساب لا على الترتيب، ولم ترد في المعاجم بمعنى المرتبة العشرين"

