    concerns:
      - "اللمّتان الحاليتان خاليتان من التشكيل الكامل"
      - "لمّة «سينغر» وحدها مشتركة لفظياً مع الاسم المشترك الإنجليزي singer (مغنٍّ)، وهو ما قد يُشكّل التباساً عند الاستخدام خارج السياق"
      - "المجموعة الترادفية تُمثّل علماً شخصياً (proper noun) لمخترع تاريخي؛ وليس لكل لمّة في الأعمدة الإنجليزية الأربعة مقابلٌ عربي مُقنَّن في AWN (إسحاق م. سينغر — إسحاق مِيرِيت سينغر)"
    observations: >-
      هذه المجموعة الترادفية تمثّل علماً شخصياً للمخترع الأمريكي إسحاق مِيرِيت سينغر
      (Isaac Merrit Singer، 1811-1875)، مؤسّس شركة Singer ومطوّر ماكينة الخياطة
      بغرزة السلسلة. اللمّتان الموجودتان هما تعريبٌ حرفي للاسم الإنجليزي، وهو
      الأسلوب الوحيد الممكن للأعلام الشخصية الغربية. التعريف الحالي دقيق وظيفياً لكنه
      يحتمل تحسيناً أسلوبياً. ليس ثمة معجم عربي تراثي أو حديث يُفرد مدخلاً لهذا
      الشخص، مما يعني غياب الشاهد المعجمي العربي ويجعل التحقّق مقتصراً على المصادر
      الموسوعية.

  blind_candidates:
    - lemma: "إِسْحَاقُ سِينْغَر"
      generation_method: taarib
      justification: >-
        التعريب الأوثق لـ«Isaac Singer» وفق قواعد التعريب المعتمدة (إسحاق مقابل
        Isaac، سينغر مقابل Singer). هذه الصيغة هي الأكثر شيوعاً في المراجع العربية
        عند الإشارة إلى هذا المخترع.
    - lemma: "سِينْغَر"
      generation_method: taarib
      justification: >-
        اللقب العائلي منفرداً يُستخدم على نطاق واسع في السياقات التجارية والإعلامية
        عند الإشارة إلى العلامة التجارية أو إلى الشخص. مقبول كلمّة ثانوية في المجموعة.
    - lemma: "إِسْحَاقُ مِيرِيت سِينْغَر"
      generation_method: taarib
      justification: >-
        الاسم الكامل الثلاثي (Isaac Merrit Singer) الوارد في اللمّات الإنجليزية
        للمجموعة awn4-11322767-n؛ يُستخدم في الكتابة الأكاديمية والتوثيقية عند
        الحاجة إلى التمييز القاطع بين أفراد العائلة أو المصادر المتعددة.
    - lemma: "إِيزَاكُ سِينْغَر"
      generation_method: taarib
      justification: >-
        تعريب صوتي بديل لـ«Isaac» يحاكي النطق الإنجليزي المباشر. أقل شيوعاً من
        «إسحاق» في المراجع العربية الرسمية، لكنه يرد في بعض المصادر الأكاديمية
        الحديثة.


