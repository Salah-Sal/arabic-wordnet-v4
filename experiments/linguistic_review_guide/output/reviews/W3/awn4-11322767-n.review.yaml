stage4_content:
  definition:
    current: "مخترع أمريكي لماكينة خياطة محسنة بغرزة السلسلة (1811-1875)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي دقيق في جوهره، غير أن تعبير «لماكينة خياطة محسنة» يوحي
        بأنه حيازي (صاحب ماكينة) لا تطويري. والأدق أن يقال «طوّر» أو «أسهم في
        تطوير» ليعكس أنه أضاف تحسينات جوهرية على ماكينات سابقة. كما أن «بغرزة
        السلسلة» وحدها قد لا تُوفي بالتعريف الكامل إذ اشتهر بتقنية الغرزة
        المتشابكة (lockstitch) أيضاً في المراحل اللاحقة. يُستحسن إضافة لمسة
        موسوعية بذكر تأسيسه الشركة.
    authored:
      - type: encyclopedic
        text: >-
          مُخْتَرِعٌ أَمْرِيكِيٌّ (1811-1875) طَوَّرَ مَاكِينَةَ الْخِيَاطَةِ
          بِإِدْخَالِ غُرْزَةِ السَّلْسَلَةِ الْمُحَسَّنَةِ، وَأَسَّسَ شَرِكَةَ
          «سِينْغَر» لِصِنَاعَةِ مَاكِينَاتِ الْخِيَاطَةِ الَّتِي غَدَتْ مِنْ
          أَشْهَرِ الْعَلَامَاتِ التِّجَارِيَّةِ فِي الْعَالَمِ.
      - type: terminological
        text: >-
          مُخْتَرِعٌ أَمْرِيكِيٌّ عَاشَ بَيْنَ (1811-1875)، اشْتُهِرَ بِتَطْوِيرِ
