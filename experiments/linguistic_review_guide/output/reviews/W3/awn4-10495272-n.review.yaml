# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «صانع طباعة» تعبير وصفي حر لا يجتاز اختبار السكّ: يمكن إبداله بـ«صانع طبع» أو «عامل طباعة» ويبقى وصفاً صالحاً، مما يكشف أنه عبارة لا مصطلح مسكوك."
      - "لمّة «فنان غرافيكي» أوسع دلالياً من المفهوم المقصود: graphic artist يشمل مصمّم الجرافيك الرقمي والإعلاني، بينما المجموعة تخص صانع المطبوعات الفنية اليدوية (printmaker)."
      - "«غرافيكي» لفظ دخيل مستخدم قبل استنفاد البدائل العربية الأصيلة كـ«نقاش» و«حفار»."
      - "اللمّتان الموجودتان بدون تشكيل."
    observations: "المجموعة تعاني من خلط مفاهيمي بين printmaker (الأخص: صانع المطبوعات الفنية اليدوية) وgraphic artist (الأعم). التراث العربي يملك مصطلحَي «نقاش» (من حرفته النقش) و«حفار» (من يحفر الخشب ونحوه ليُعدّه للزينة والطباعة)، وكلاهما موثق معجمياً ويغطّي المفهوم المقصود بوثاقة أكبر من اللمّات الحالية."
  blind_candidates:
    - lemma: "نَقَّاش"
      generation_method: majaz
      justification: "إحياء لفظ تراثي يعني «من حرفته النقش»؛ دلالة النقش في التراث العربي تشمل الرسم والحفر والتزيين على الأسطح، وهو ما يُطابق صانع المطبوعات الفنية الذي يحفر وينقش الألواح."
    - lemma: "حَفَّار"
      generation_method: ishtiqaq
      justification: "من جذر «حفر» على وزن «فَعَّال» (صيغة الحرفة المعتادة)؛ المعاجم الحديثة وثّقت «من يحفر الخشب ونحوه ليُعدّه للزينة»، وهو الوصف الدقيق لفنان الطباعة الحفرية (engraving/etching)."
    - lemma: "مُنَقِّش"
      generation_method: ishtiqaq
      justification: "من جذر «نقش» على وزن «مُفَعِّل» (اسم الفاعل من نقَّش)؛ يُبرز الصنعة المتكررة في إنشاء النقوش والزخارف المطبوعة."
    - lemma: "طَرَّاز"
      generation_method: majaz
      justification: "الطراز في التراث صانع الأنماط والرسوم على الأقمشة؛ مجازاً يمكن إطلاقه على فنان المطبوعات الذي يُبدع الأنماط الزخرفية ليطبعها."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1: مطابقة دفعية (headword_norm) لجميع اللمّات والمرشحين
#   Q2: جسر إنجليزي (translation_en) — printmaker / graphic artist / engraver
#   Q3: FTS عربي — كلمات مفتاحية من التعريف (طباعة، مطبوعات، حفر الخشب)
#   Q4: مقاييس اللغة (dictionary_id=151) — جذور: نقش، حفر، طبع، صنع
stage2_evidence:
  per_lemma:
    - lemma: "صانع طباعة"
      evidence_status: "no_material_found"

    - lemma: "فنان غرافيكي"
      evidence_status: "no_material_found"

    - lemma: "نَقَّاش"
      confirm:
        - text: "«مَن حرفته النَّقْش»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(النقاش) من حرفته النقش»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani_35)"
        - text: "«نقاش أنواط» — translation_en: medal engraver, domain: Educational and Computer Techniques"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM 1999)"
      expands:
        - text: "«(نَقَشَ) النُّونُ وَالْقَافُ وَالشِّينُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اسْتِخْرَاجِ شَيْءٍ وَاسْتِيعَابِهِ حَتَّى لَا يُتْرَكَ مِنْهُ شَيْءٌ؛ مِنْهُ نَقْشُ الشَّعْرِ بِالْمِنْقَاشِ وَهُوَ نَتْفُهُ... وَمِنَ الْبَابِ: نَقْشُ الشَّيْءِ تَحْسِينُهُ، كَأَنَّهُ يَنْقُشُهُ أَيْ يَنْفِي عَنْهُ مَعَايِبَهُ وَيُحَسِّنُهُ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: "الجذر يدل على الاستخراج الدقيق والتحسين؛ يعكس جوهر صنعة النقاش في انتزاع المادة من اللوح وتجميله."

    - lemma: "حَفَّار"
      confirm:
        - text: "«من صناعته الحفارة. وغلب على حافر القبور من يحفر الخشب ونحوه ليعده للزينة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«حفَّار» — translation_en: engraver, domain: Educational and Computer Techniques"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM 1999)"
        - text: "«حفَّار بماء نار» — translation_en: etcher, domain: Printing - Electricity"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1: طباعة - كهرباء (ARABTERM 1996)"
        - text: "«حفار ناسخ: حفار يقوم بطبع نسخ متعددة للعمل الفني الواحد» — translation_en: reproductive engraver"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM 1999)"
        - text: "«حفار خشب: حفّار أو نقاش على الخشب بأسلوب عرضاني أو طولاني» — translation_en: xylograph (wood engraver)"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM 1999)"
        - text: "«حفَّار: من (ح ف ر) من يحفر الخشب، ومن صناعته الحفارة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani_48)"
      contradicts:
        - text: "«مَنْ عَمَلُه الحِفَارَةُ, وغَلَب على مَنْ يَحْفِرُ القُبورَ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "المعنى الغالب في هذه الرواية مقيَّد بحافر القبور لا بالفنان الحفار؛ غير أن المعجم الوسيط ومعاجم التقنية التربوية يُثبتان المعنى الفني الحِرَفي."
      expands:
        - text: "«(حَفَرَ) الْحَاءُ وَالْفَاءُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا حَفْرِ الشَّيْءِ، وَهُوَ قَلْعُهُ سُفْلًا؛ وَالْآخَرُ أَوَّلُ الْأَمْرِ. فَالْأَوَّلُ حَفَرْتُ الْأَرْضَ حَفْرًا»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: "الجذر يدل على القلع من الأسفل والإزالة الدقيقة، وهو جوهر تقنية الحفر الغائر في صناعة قوالب الطباعة الفنية."

    - lemma: "مُنَقِّش"
      contradicts:
        - text: "«منقش» — translation_en: graver, translation_fr: échoppe, domain: Geography and History"
          source: "مسرد الجغرافيا والتاريخ — ALECSO (ARABTERM)"
          conflict: "«échoppe» الفرنسية تعني أداة الحفر (مِنقاش) لا الحرفي الشخص؛ المعجميون العرب يستخدمون «نقاش» للدلالة على الشخص (نقاش أنواط = medal engraver)، لا «مُنَقِّش»."

    - lemma: "طَرَّاز"
      contradicts:
        - text: "«الطَّرَّاز: الرَّقامُ الذي يعمل الطِّراز، أو يطرِّز الثياب ونحوها بخيوط الحرير أو بأسلاك الذهب أو الفضة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "الطَّرَّاز مختص بالتطريز والنسيج (embroiderer)، لا بصناعة المطبوعات الفنية."
        - text: "«الطِّراز: ما ينسج من الثياب للسلطان (فارسيّ معرب)»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "الجذر نفسه مستعار من الفارسية (تَرَاز = ثوب ملكي)، مما يُضعف استخدامه في السياق الفني الطباعي."


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "صانع طباعة"
      decision: removed
      decision_reason: "تعبير وصفي حر يفشل اختبار السكّ (يمكن التعبير عن نفس المفهوم بـ«صانع طبع» أو «عامل طباعة»). غير موثق في أي معجم عربي كوحدة معجمية ثابتة. يفتقر إلى القيد الفصيل الذي يُميّز printmaker عن printer."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "فنان غرافيكي"
      decision: removed
      decision_reason: "«غرافيكي» لفظ دخيل غير مُعرَّب تعريباً قياسياً ولا يرد في المعاجم العربية المعتمدة. فضلاً عن ذلك، المصطلح أوسع دلالياً من المفهوم المقصود (printmaker): graphic artist يشمل الجرافيك الرقمي والتجاري. التراث يملك بدائل أدق وأصح."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "نَقَّاش"
      source: stage1
      decision: confirmed
      decision_reason: "موثق في المعجم الوسيط بتعريف مباشر «مَن حرفته النَّقْش»، وفي معاجم ARABTERM في تعابير كـ«نقاش أنواط» (medal engraver). جذره نقش موثق في مقاييس اللغة بدلالة الاستخراج الدقيق والتحسين، وهو جوهر صنعة صانع المطبوعات. لا دوران في التعريف، وثبوت معجمي متعدد المصادر."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الجانب الفني والتزييني في إبداع الصور المنقوشة؛ يُستعمل في السياق الفني للإشارة إلى المُبدع الذي يُصمّم النقوش والمطبوعات الفنية بوصفه فناناً مبتكراً."
      actions:
        - command: create_entry
          params: {lemma: "نَقَّاش", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حَفَّار"
      source: stage1
      decision: confirmed
      decision_reason: "موثق في المعجم الوسيط بـ«من يحفر الخشب ونحوه ليُعدّه للزينة»، وفي معاجم ARABTERM بـ«engraver» و«etcher» في سياق التقنيات التربوية والطباعة. عبارة «حفار ناسخ» (يقوم بطبع نسخ متعددة للعمل الفني الواحد) تُقرّب المصطلح جداً من المفهوم المقصود. الأدلة المتعارضة (حافر القبور) لا تمنع الاستخدام الفني المُثبَت."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركز على الصنعة الحِرَفية الجسدية لحفر الألواح وإعداد قوالب الطباعة؛ يُفضَّل في السياقات التقنية المتخصصة كالحفر الغائر (intaglio)، والحفر بالحمض (etching)، وحفر الخشب (xylography)."
      actions:
        - command: create_entry
          params: {lemma: "حَفَّار", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُنَقِّش"
      source: stage1
      decision: removed
      decision_reason: "الأدلة تُشير إلى أن الشكل المُعَجمَن «منقش» يدل على الأداة (مِنقاش/graver = échoppe) لا على الشخص. المعاجم تستخدم «نقاش» (لا «مُنَقِّش») للدلالة على الحرفي الفنان، مما يجعل المرشح نافلاً مع وجود «نقاش»."

    - lemma: "طَرَّاز"
      source: stage1
      decision: removed
      decision_reason: "الطَّرَّاز في جميع المعاجم المُستعلَمة مختص بالتطريز والنسيج (embroiderer)، وجذره الفارسي المُعرَّب (تَرَاز) لا يتصل بصناعة المطبوعات الفنية. لا وجه للمجاز المقترح."


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "فنان يصمم ويصنع المطبوعات"
    assessment:
      decision: revise
      reason: "«المطبوعات» مبهم (printed matter أم art prints؟)؛ لا يُفرَّق بين الطابع الحِرَفي اليدوي الفني الذي يُميّز printmaker عن الطابع التجاري. يفتقر التعريف إلى ذكر أسلوب الصنعة وطابعها الإبداعي."
    authored:
      - type: terminological
        text: "فَنَّانٌ حِرَفِيٌّ يُصَمِّمُ وَيَصْنَعُ مَطْبُوعَاتٍ فَنِّيَّةً يَدَوِيَّةً بِأَسَالِيبَ كَالْحَفْرِ الْغَائِرِ وَالطِّبَاعَةِ الْحَجَرِيَّةِ وَالشَّاشَةِ الْحَرِيرِيَّةِ"
