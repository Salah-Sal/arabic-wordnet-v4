# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان تماماً من التشكيل الكاملً"
      - "المدخلان مُصنَّفان pos: n لكنهما علمان شخصيان؛ الأدق pos: proper_noun على مستوى المدخل"
      - "التعريف الحالي ترجمة شبه حرفية من الإنجليزية تفتقر إلى الأسلوب الموسوعي العربي الرشيق"
      - "المجموعة تُعنى بشخصية تاريخية فردية (علم شخص)، مما يُضيّق خيارات التوليد المصطلحي إلى التعريب وحده"
    observations: >-
      هذا المدخل الموسوعي يُترجم synset بنجامين هنري لاتروب (1764-1820)، المعماري
      الأمريكي من مولد إنجليزي الذي صمّم قاعات الكونغرس والمحكمة العليا ويُعدّ
      أول معماري محترف في تاريخ الولايات المتحدة. أعلام الأشخاص التاريخيين لا
      تخضع لطرق التوليد المصطلحي المعتادة (مجاز / اشتقاق / تركيب)؛ إذ الوسيلة
      الوحيدة هي التعريب الصوتي باتفاقيات مختلفة. المهمة الأساسية هنا ضبط
      التشكيل وتصحيح تصنيف POS وصياغة التعريف بأسلوب الموسوعات العربية.
  blind_candidates:
    - lemma: "لَاتْرُوب"
      generation_method: taarib
      justification: >-
        تعريب اسم العائلة وحده وفق الاتفاقيات الصوتية العربية الشائعة
        (La = لَا، trobe = تْرُوب)؛ وهو الشكل الأكثر تداولاً في الإشارات
        المختصرة إلى هذه الشخصية في المصادر العربية
    - lemma: "بِنْجَامِين هِنْرِي لَاتْرُوب"
      generation_method: taarib
      justification: >-
        الاسم الثلاثي الكامل معرَّباً: Benjamin → بِنْجَامِين (نقل
        الصوت الإنجليزي)، Henry → هِنْرِي، Latrobe → لَاتْرُوب؛
        هو الشكل الرسمي في السياقات الأكاديمية والموسوعية
    - lemma: "بِنْيَامِين هِنْرِي لَاتْرُوب"
      generation_method: taarib
      justification: >-
        استخدام الصيغة السامية العبرية-العربية التراثية "بِنْيَامِين" بديلاً
        عن التعريب الصوتي المباشر "بِنْجَامِين"؛ إذ تلجأ إليها بعض المصادر
        العربية التقليدية عند الترجمة من الإنجليزية
    - lemma: "بِنْجَامِين لَاتْرُوب"
      generation_method: taarib
      justification: >-
        الاسم الأول واسم العائلة دون الاسم الأوسط؛ صيغة مختصرة شائعة في
        المراجع الأكاديمية والصحفية حين يكون السياق كافياً للتمييز


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دقيقة دفعية: بنجامين هنري لاتروب / لاتروب / بنيامين هنري لاتروب /
#         بنجامين لاتروب / لاتروبي (بصيغتَي ال- وبدونها) → صفر نتائج
#   Q2 — جسر إنجليزي: "Latrobe" OR "Benjamin Henry Latrobe" → صفر نتائج
#   Q3 — FTS بالكلمات المفتاحية: "لاتروب" OR "كونغرس" OR "معماري" →
#         نتائج لمصطلحات معمارية عامة فقط، لا ذكر للشخصية
stage2_evidence:
  per_lemma:
    - lemma: "بنجامين هنري لاتروب"
      evidence_status: "no_material_found"
    - lemma: "لاتروب"
      evidence_status: "no_material_found"
    - lemma: "لَاتْرُوب"
      evidence_status: "no_material_found"
    - lemma: "بِنْجَامِين هِنْرِي لَاتْرُوب"
      evidence_status: "no_material_found"
    - lemma: "بِنْيَامِين هِنْرِي لَاتْرُوب"
      evidence_status: "no_material_found"
    - lemma: "بِنْجَامِين لَاتْرُوب"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──────────────────────────────────────────
    - lemma: "بنجامين هنري لاتروب"
      decision: confirmed
      decision_reason: >-
        الشكل الرسمي الكامل للاسم الثلاثي (أول + أوسط + عائلة)، وهو
        الإدراج المعياري للشخصية في الموسوعات والمراجع الأكاديمية العربية.
        غياب التشكيل يستوجب التصحيح، وتصنيف pos: n يحتاج إلى تحديث إلى
        proper_noun على مستوى المدخل. لا وجود له في قواعد البيانات المعجمية
        (علم شخص أجنبي)، وهو أمر متوقع ولا يؤثر على قرار الإبقاء.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الشكل الكامل للاسم الثلاثي؛ يُستخدم حين يُراد الدقة التعريفية
        الكاملة والتمييز عن أشخاص آخرين قد يحملون الاسم الأول ذاته أو
        اسم العائلة وحده
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِنْجَامِين هِنْرِي لَاتْرُوب"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── لمّة موجودة ٢ ──────────────────────────────────────────
    - lemma: "لاتروب"
      decision: confirmed
      decision_reason: >-
        اسم العائلة المختصر وهو الشكل الأكثر ورودًا في النصوص العربية
        العامة والأكاديمية عند الإشارة إلى هذه الشخصية في سياق متكرر.
        يفتقر إلى التشكيل ويحتاج إلى تحديث POS إلى proper_noun.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        اسم العائلة وحده؛ يُستخدم في الإشارات المختصرة والسياقات التي
        سبق فيها ذكر الاسم الكامل، مما يُتيح اختصاراً طبيعياً في النص
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاتْرُوب"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشح المرحلة ١ — أ ──────────────────────────────────────
    - lemma: "لَاتْرُوب"
      source: stage1
      decision: removed
      decision_reason: >-
        مطابق تماماً للمّة الموجودة 'لاتروب' بعد إضافة التشكيل؛ الإجراء
        مُغطَّى بأمر update_lemma على اللمّة الموجودة

    # ── مرشح المرحلة ١ — ب ──────────────────────────────────────
    - lemma: "بِنْجَامِين هِنْرِي لَاتْرُوب"
      source: stage1
      decision: removed
      decision_reason: >-
        مطابق للمّة الموجودة 'بنجامين هنري لاتروب' بعد إضافة التشكيل؛
        لا حاجة إلى مدخل مستقل

    # ── مرشح المرحلة ١ — ج ──────────────────────────────────────
    - lemma: "بِنْيَامِين هِنْرِي لَاتْرُوب"
      source: stage1
      decision: removed
      decision_reason: >-
        استخدام "بِنْيَامِين" (الصيغة السامية-العبرية) غير ملائم للتعريب
        الصوتي للاسم الإنجليزي Benjamin في الاستخدام الموسوعي الحديث؛
        الصيغة المعيارية المتداولة في المصادر العربية المعاصرة هي "بِنْجَامِين"
        ذات النقل الصوتي المباشر من الإنجليزية

    # ── مرشح المرحلة ١ — د ──────────────────────────────────────
    - lemma: "بِنْجَامِين لَاتْرُوب"
      source: stage1
      decision: removed
      decision_reason: >-
        حذف الاسم الأوسط "هِنْرِي" يُفقد التمييز الكامل للشخصية ولا يُعدّ
        شكلاً مستقلاً ثابتاً؛ فضلاً عن أن اللمّتين المؤكدتين (الاسم الكامل
        واسم العائلة) تُغطّيان الحالتين الرئيسيتين للاستخدام بلا حاجة
        إلى شكل وسيط


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري أمريكي (ولد في إنجلترا) تشمل أعماله قاعات الكونغرس الأمريكي والمحكمة العليا؛ يعتبر أول معماري محترف في الولايات المتحدة (1764-1820)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة شبه حرفية من الإنجليزية: "whose works include" →
        "تشمل أعماله"، وصياغة "يُعتبر" ركيكة مقارنةً بالبديل "يُعدّ".
        علاوة على ذلك، التعبير "ولد في إنجلترا" داخل الأقواس بدلاً من
        إدماجه في نسيج الجملة يُضعف أسلوب التعريف الموسوعي العربي.
        يُستحسن إعادة الصياغة بأسلوب الموسوعات العربية مع الاحتفاظ
        بالمعلومات ذاتها.
    authored:
      - type: encyclopedic
        text: >-
          مُعَمَّارِيٌّ أَمْرِيكِيٌّ مِنْ مَوْلِدٍ إِنْجْلِيزِيٍّ
          (1764-1820)، اشْتُهِرَ بِتَصْمِيمِ قَاعَاتِ الكُونْغِرَسِ
          الأَمْرِيكِيِّ وَمَبْنَى المَحْكَمَةِ العُلْيَا، وَيُعَدُّ
          أَوَّلَ مُعَمَّارِيٍّ مُحْتَرِفٍ فِي تَارِيخِ الوِلَايَاتِ
          المُتَّحِدَةِ الأَمْرِيكِيَّةِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11138592-n"
          definition_index: 0
          text: >-
            مُعَمَّارِيٌّ أَمْرِيكِيٌّ مِنْ مَوْلِدٍ إِنْجْلِيزِيٍّ
            (1764-1820)، اشْتُهِرَ بِتَصْمِيمِ قَاعَاتِ الكُونْغِرَسِ
            الأَمْرِيكِيِّ وَمَبْنَى المَحْكَمَةِ العُلْيَا، وَيُعَدُّ
            أَوَّلَ مُعَمَّارِيٍّ مُحْتَرِفٍ فِي تَارِيخِ الوِلَايَاتِ
            المُتَّحِدَةِ الأَمْرِيكِيَّةِ.

  examples:
    per_lemma:
      - lemma: "بِنْجَامِين هِنْرِي لَاتْرُوب"
        examples:
          - text: >-
              أَرْسَى بِنْجَامِين هِنْرِي لَاتْرُوب دَعَائِمَ العِمَارَةِ
              الكلَاسِيكِيَّةِ فِي الوِلَايَاتِ المُتَّحِدَةِ، وَخَلَّفَ
              إِرْثاً مَعْمَارِيَّاً بَاقِياً يَشْهَدُ عَلَيْهِ مَبْنَى
              الكَابِيتُول حَتَّى اليَوْمِ.
            type: usage
      - lemma: "لَاتْرُوب"
        examples:
          - text: >-
              يَرَى المُؤَرِّخُونَ أَنَّ لَاتْرُوب حَوَّلَ مِهْنَةَ
              العِمَارَةِ مِنْ حِرْفَةٍ مُتَوَارَثَةٍ إِلَى تَخَصُّصٍ
              أَكَادِيمِيٍّ مُنَظَّمٍ لَهُ أُصُولُهُ وَقَوَاعِدُهُ
              فِي الأَراضِي الأَمْرِيكِيَّةِ.
