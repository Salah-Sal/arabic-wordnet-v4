# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "أمير المرح"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي «أمير + المرح» راسخ على نمط «أمير الشعراء» و«أمير البيان»
        المستعمَلَين في التراث العربي للدلالة على الزعامة في حقل ما.
        مرح = مسرّة لا يكاد يستقر معها طربًا (ابن فارس) — أي الفرح الصاخب المنطلق،
        وهو يُطابق دلالة revels الإنجليزية. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الجانب الإيجابي المرِح من المنصب: قائد الأفراح الصاخبة والمسرّات
        المنطلقة؛ التركيز على البهجة لا على الفوضى.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَمِيرُ الْمَرَحِ"

    - lemma: "سيد الفوضى"
      decision: confirmed
      decision_reason: >
        «سيد الفوضى» يلتقط بدقة الشق الثاني من المفهوم الإنجليزي: Lord of Misrule =
        سيد اللانظام / الفوضى. مقاييس اللغة تُثبت أن «فوضى» تعني الاختلاط
        (باتوا فوضى أي مختلطين)، وهو انقلاب الأدوار الاجتماعية المتعمَّد في هذا التقليد.
        الالتباس مع الفوضوية السياسية قائم لكنه ينتفي بالسياق الواضح للمجموعة.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الجانب السلطوي الانقلابي: سيادة على الفوضى المنظَّمة وقلب الأدوار
        الاجتماعية الاحتفالي، موازٍ مباشر للـ Misrule الإنجليزية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَيِّدُ الْفَوْضَى"

    - lemma: "رَئِيسُ السُّمَّار"
      source: stage1
      decision: removed
      decision_reason: >
        السمار يدل على مجالس السهر والأنس الليلي بالحديث والحكاية، لا على الاحتفالات
        الصاخبة ذات الفوضى الاحتفالية. الدلالة أضيق من المفهوم المطلوب.
        علاوة على ذلك، ابن فارس يربط أصل الجذر بالسمرة (اللون) لا بالاحتفال
        مباشرةً. أمير المرح أقرب دلاليًا وأشمل.

    - lemma: "نَقِيبُ الاحْتِفَالِ"
      source: stage1
      decision: removed
      decision_reason: >
        نقيب يحمل طابعًا بيروقراطيًا رسميًا (رئيس النقابة، الرتبة العسكرية)
        لا يتلاءم مع الطابع الاحتفالي المرِح والعفوي لهذا الدور. الجذر (فتح وثقب)
        بعيد دلاليًا عن الاحتفال.

    - lemma: "قَيِّمُ الأَفْرَاحِ"
      source: stage1
      decision: removed
      decision_reason: >
        قيّم يُفيد الإشراف الإداري (القوامة)، وهو مصطلح محايد لا يحمل دلالة
        اللقب الشرفي ولا طابع الزعامة المرِحة المميِّزة لهذا المنصب.

    - lemma: "أَمِيرُ الفَرَحِ"
      source: stage1
      decision: removed
      decision_reason: >
        الفرح دلالته أعمّ من المرح؛ ابن فارس يُميّز بينهما في آية واحدة
        ({بما كنتم تفرحون... وبما كنتم تمرحون}). مرح أدق في إفادة الفرح الصاخب
        المنطلق. التركيب مكرِّر لـ«أمير المرح» الموجود وأضعف منه.


