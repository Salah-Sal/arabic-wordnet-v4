# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "تكرار لفظ «احتفالات» مرتين في التعريف العربي الحالي: «مسؤول عن الاحتفالات في احتفالات عيد الميلاد»"
      - "عبارة «تقليد قديم» مُضافة بين قوسين كملاحظة، لا كفصل نوعي داخل التعريف المعجمي"
      - "اللمّتان خاليتان من التشكيل في السجل الحالي"
      - "«سيد الفوضى» قد يوهم بالدلالة السياسية (زعيم الفوضوية) في سياق غير احتفالي"
    observations: >
      المجموعة تمثّل مفهومًا إنجليزيًا قرووسطيًا خالصًا (Lord of Misrule) وهو لقب كان يُمنح
      لشخص يقود الاحتفالات الميلادية الصاخبة في إنجلترا بين القرنين الثالث عشر والسابع عشر.
      المفهوم غريب ثقافيًا عن التراث العربي؛ إذ لا يوجد تقليد مقابل فيه.
      اللمّتان الموجودتان «أمير المرح» و«سيد الفوضى» هما ترجمتان وصفيتان تلتقطان جانبَين
      مختلفَين من المفهوم: الأول يُبرز بهجة الاحتفال، والثاني يُبرز انقلاب النظام المتعمَّد.
      كلتاهما مركّبتان إضافيّتان وليستا وحدتَين معجميتَين مُثبَّتتَين في التراث العربي.
  blind_candidates:
    - lemma: "رَئِيسُ السُّمَّار"
      generation_method: tarkib
      justification: >
        السُّمَّار جمع سامر، وهم القوم يتحدثون ليلًا في مجالس الأنس والمرح؛
        جاء في المعجم الكبير: «مجلس السمار». فرئيس السمار = من يتولى قيادة
        مجالس السهر الاحتفالية، وهو تركيب إضافي يلتقط جانب الرئاسة على
        الجمع الاحتفالي الليلي بلفظٍ عربي أصيل.
    - lemma: "نَقِيبُ الاحْتِفَالِ"
      generation_method: tarkib
      justification: >
        النقيب لقب تراثي عربي لكبير القوم المعنيّ بشؤونهم (المعجم الوسيط:
        «كبير القوم المعنى بشؤونهم»)، وإضافته إلى الاحتفال تُنتج مصطلحًا
        إضافيًا يحمل دلالة التعيين والمسؤولية عن الاحتفال.
    - lemma: "قَيِّمُ الأَفْرَاحِ"
      generation_method: tarkib
      justification: >
        القيّم من القوامة: المتولّي والمشرف على الأمر. الأفراح جمع فرح
        بمعنى الاحتفالات والمناسبات السارّة. التركيب الإضافي «قيّم الأفراح»
        يلتقط المعنى الوظيفي للتعيين والإشراف على الاحتفالات.
    - lemma: "أَمِيرُ الفَرَحِ"
      generation_method: tarkib
      justification: >
        على نمط «أمير الشعراء» و«أمير البيان» الذي يُطلَق في العربية
        على من يتصدّر ميدانًا ما؛ فأمير الفرح = من يتصدّر الاحتفال
        ويقوده، تركيب إضافي موازٍ للنمط الإنجليزي Lord of...


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  queries_run:
    - "استعلام ١: بحث دفعي بالمفردات الرئيسية (امير، سيد، مرح، فوضي، سمار، نقيب، فرح) — المعاجم المحققة (OCR)"
    - "استعلام ٢: مقاييس اللغة (dictionary_id=151) للجذور: امر، مرح، سود، فوض، سمر، فرح، نقب"
    - "استعلام ٣: الجسر الإنجليزي — Lord of Misrule، master of revels، master of ceremonies"
    - "استعلام ٤: البحث النصي العربي — احتفالات، عيد الميلاد، مسؤول عن الاحتفال"

  per_lemma:
    - lemma: "أمير المرح"
      confirm:
        - text: "«لَقَبٌ يُطلق على مَنْ بَرَزَ فى فَنٍّ من الفُنون، يقال: أمير البيان، وأمير الشعراء»"
          source: "المعجم الكبير، مجمع اللغة العربية بالقاهرة"
        - text: "«الْمِيمُ وَالرَّاءُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى مَسَرَّةٍ لَا يَكَادُ يَسْتَقِرُّ مَعَهَا طَرَبًا. وَمَرِحَ يَمْرَحُ»"
          source: "مقاييس اللغة، ابن فارس (ت 395 هـ)"
        - text: "«المَرَحُ: شِدَّةُ الفرح أو النَّشاط العُجْب والاختيال»"
          source: "المعجم الوسيط، مجمع اللغة العربية بالقاهرة"
      expands:
        - text: "«أمير المؤمنين: لقب لخليفة المسلمين» — يدل على أن صيغة «أمير + مضاف» راسخة في العربية لإفادة الرئاسة على جماعة أو حقل»"
          source: "المعجم الوسيط"
          addition: "يُثبت أن النمط التركيبي «أمير + المضاف إليه» استُعمل تاريخيًا للدلالة على الزعامة في مجال بعينه"

    - lemma: "سيد الفوضى"
      confirm:
        - text: "«السَّيِّدُ: المالك الملِك المولى ذو العبيد والخدم المُتوَلِّي للجماعة الكثيرة كلُّ من افترَضَت طاعته»"
          source: "المعجم الوسيط"
        - text: "«السِّينُ وَالْوَاوُ وَالدَّالُ أَصْلٌ وَاحِدٌ، وَهُوَ خِلَافُ الْبَيَاضِ فِي اللَّوْنِ، ثُمَّ يُحْمَلُ عَلَيْهِ وَيُشْتَقُّ مِنْهُ»"
          source: "مقاييس اللغة، ابن فارس"
        - text: "«الْفَاءُ وَالْوَاوُ وَالضَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى اتِّكَالٍ فِي الْأَمْرِ عَلَى آخَرَ وَرَدِّهِ عَلَيْهِ... بَاتُوا فَوْضَى، أَيْ مُخْتَلِطِينَ»"
          source: "مقاييس اللغة، ابن فارس"
      contradicts:
        - text: "«فوضى» في الاستعمال الحديث تنصرف إلى الاضطراب السياسي والاجتماعي، لا إلى الفوضى الاحتفالية المنظَّمة"
          source: "استعمال معاصر — المعجم الوسيط (تأمّل)"
          conflict: "الدلالة الحديثة لـ«فوضى» تُوحي بالفوضوية السياسية أو الإهمال، مما يجعل «سيد الفوضى» ملتبسًا في سياق غير احتفالي"

    - lemma: "رَئِيسُ السُّمَّار"
      expands:
        - text: "«السِّينُ وَالْمِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى خِلَافِ الْبَيَاضِ فِي اللَّوْنِ... فَأَمَّا السَّامِرُ فَالْقَوْمُ يَسْمُرُونَ. وَالسَّامِرُ: الْمَكَانُ الَّذِي يَجْتَمِعُونَ فِيهِ»"
          source: "مقاييس اللغة، ابن فارس"
          addition: "السُّمَّار = جمع سامر، يدل على مجالس السهر والأنس الليلي، ولكن ابن فارس يربط الأصل بالسمرة اللونية لا بالاحتفال تحديدًا"
        - text: "«السَّمَرُ: الحديثُ بالليل، والحكايات التى يُسْمَرُ بها. مجلس السَّمَر. ضوءُ القمر»"
          source: "المعجم الوسيط"
          addition: "السمر يدل على جلسات الأنس الليلية، وهو قريب من الاحتفال لكن أضيق دلالةً"

    - lemma: "نَقِيبُ الاحْتِفَالِ"
      expands:
        - text: "«النَّقِيبُ: الزِّمَار. لسان الميزان. رئيس النِقابة. رتبة من رتب الجيش والشَّرطة فوق الملازم الأول ودون الرائد. كبير القوم المعنَى بشؤونهم»"
          source: "المعجم الوسيط"
          addition: "نقيب يحمل معنى الزعامة والرعاية، لكن دلالته الأولى (الزمار = الرقيب) تحمل طابع الرقابة والبحث، بعيدةً عن الاحتفال"
        - text: "«النُّونُ وَالْقَافُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى فَتْحٍ فِي شَيْءٍ»"
          source: "مقاييس اللغة، ابن فارس"
          addition: "الجذر يدل على الثقب والفتح، ودلالة «كبير القوم» مشتقة من الكشف والبحث في الأمور"

    - lemma: "قَيِّمُ الأَفْرَاحِ"
      evidence_status: "no_material_found"

    - lemma: "أَمِيرُ الفَرَحِ"
      expands:
        - text: "«الْفَرَحُ، يُقَالُ فَرِحَ يَفْرَحُ فَرَحًا، فَهُوَ فَرِحٌ. قَالَ اللَّهُ - تَعَالَى: {ذَلِكُمْ بِمَا كُنْتُمْ تَفْرَحُونَ فِي الْأَرْضِ بِغَيْرِ الْحَقِّ وَبِمَا كُنْتُمْ تَمْرَحُونَ}»"
          source: "مقاييس اللغة، ابن فارس"
          addition: "الآية القرآنية تُقارن الفرح والمرح معًا، مما يُثبت قرابتهما الدلالية ويُميّز مرح (فرح صاخب) عن فرح (سعادة عامة)"

  english_bridge_results:
    - headword: "مدير المراسم؛ رئيس «التشريفات»"
      translation_en: "master of ceremonies"
      source: "المورد الحديث (2008)"
      note: "أقرب مطابقة إنجليزية موجودة في قاعدة البيانات، لكنها تقابل master of ceremonies لا Lord of Misrule تحديدًا"
