# ── المرحلة ١: المراجعة والتوليد (التوليد الأعمى) ─────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين (جاكار، جوزيف ماري جاكار) تفتقران إلى التشكيل الكامل"
      - "اللمّة الأولى تحيل إلى اللقب وحده، في حين اللمّة الثانية تمثّل الاسم الكامل؛ والنوع الوسيط (جوزيف م. جاكار) المقابل للإنجليزية Joseph M. Jacquard مفقود"
      - "التعريف العربي يُعدّ ترجمة شبه حرفية للتعريف الإنجليزي؛ وهو بحاجة إلى صياغة موسوعية أكثر دقةً وإثراءً بالمعلومات التاريخية"
    observations: >-
      المجموعة اسم علم لشخص تاريخي (proper noun) — هو المخترع الفرنسي جوزيف ماري جاكار
      (1752-1834) صاحب النول الشهير. جميع اللمّات المنتظَرة من هذا النوع لا تقبل
      الاشتقاق ولا المجاز ولا التركيب الدلالي، بل هي تعريبات حرفية للاسم الأجنبي
      (taarib). يُلاحَظ أن المعاجم العربية تستخدم "جاكار" و"جاكارد" بالتبادل، غير أن
      الأولى (بدون حرف الدال) أقرب إلى النطق الفرنسي الصحيح للاسم (phonème /ʒa.kaʁ/).
      كما أن دلالة "جاكار" في المعاجم الحديثة انزاحت من اسم الشخص إلى اسم الاختراع
      (النول والقماش).

  blind_candidates:
    - lemma: "جُوزِيف مَارِي جَاكَار"
      generation_method: taarib
      justification: >-
        تعريب الاسم الكامل للمخترع المذكور في التعريف (Joseph Marie Jacquard)؛
        إذ إن المجموعة تمثّل اسم علم شخصي فرنسي والتعريب هو السبيل الوحيد الممكن.
        الجزء الأخير "جاكار" هو اللقب الأعرف، وقد ورد في التعريف ذاته.

    - lemma: "جُوزِيف م. جَاكَار"
      generation_method: taarib
      justification: >-
        الصيغة المختصرة للاسم الكامل (Joseph M. Jacquard) بكتابة حرف الاسم الأوسط
        مُختصَراً، وهي صيغة شائعة في الإسناد الأكاديمي والموسوعي الإنجليزي ولها
        مقابل في قائمة اللمّات الإنجليزية للمجموعة.

    - lemma: "جَاكَارْد"
      generation_method: taarib
      justification: >-
        تعريب بديل يُثبت الحرف الأخير من الكلمة الأصلية الفرنسية (Jacquard)؛ ورد
        هذا الشكل في بعض معاجم النسيج العربية ("جاكارد") ويُمثّل تيار التعريب الأميل
        إلى الحرفية.

    - lemma: "جُوزِيف جَاكَار"
      generation_method: taarib
      justification: >-
        صيغة مختصرة تضمّ الاسم الأول واللقب فقط دون الاسم الأوسط، وهي مستخدمة في
        بعض المصادر الموسوعية العربية عند الإشارة إلى المخترع.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# ميزانية الاستعلامات المستخدمة: 3 استعلامات
# الاستعلام ١: مطابقة دقيقة دفعية (headword_norm) — نتيجة فارغة لجميع الأشكال المستعلَمة
# الاستعلام ٢: جسر إنجليزي (translation_en Jacquard / Joseph Marie Jacquard)
# الاستعلام ٣: FTS بالكلمات المفتاحية العربية
stage2_evidence:
  queries_run:
    - pattern: "batch_headword"
      terms: ["جاكار","الجاكار","جكار","الجكار","جوزيف ماري جاكار","جوزيف م جاكار","جوزيف مارى جاكار"]
      result_count: 0
    - pattern: "english_bridge"
      terms: ["Jacquard","Joseph Marie Jacquard","Joseph M. Jacquard"]
      result_count: 7
      entry_ids: [696412, 367902, 368156, 368157, 368158, 368755, 531286]
    - pattern: "arabic_fts"
      keywords: ["مخترع فرنسي","جاكار","نول جاكار"]
      result_count: 5
      entry_ids: [541324, 367281, 368777, 369029, 369715]

  per_lemma:
    - lemma: "جاكار"
      confirm:
        - text: >-
            «الجاكار: «أ» نَوْل جاكار لحياكة الأقمشة المصوَّرة. «ب» قماش قطني
            حِيْكَ على نَوْل جاكار.»
          source: "المورد الحديث (2008) — ArabTerm"
        - text: >-
            «نموذج جاكار: تقنية الحياكة والنسيج بالتراكيب النسيجية المزركشة التي
            تشغل مساحة كبيرة، يتم فيها رفع كل سلسلة الخيوط على حدة.»
          source: "مسرد صناعة النسيج — ALECSO ArabTerm"
      expands:
        - text: >-
            «نول Jacquard: أوّلُ آلةٍ تَستعمِلُ البطاقاتِ المثقّبةَ للتحكّم في
            عملياتها. يوجد في هذا النول (الذي ابتكره عام 1801 المخترعُ الفرنسي
            Joseph Jacquard) حتى 24000 بطاقة متوضعة على الأسطوانة الدوارة. [...]
            كافأ الأمبراطورُ نابليون المخترعَ Jacquard بمدالية على اختراعه هذا.»
          source: "معجم مصطلحات المعلوماتية (2000) — ArabTerm"
          addition: >-
            يُثبت أن "جاكار" هو الاسم العربي الرائج للمخترع ونوله، ويُفيد أن
            الاختراع كان عام 1801 لا 1752 (وهو تاريخ الميلاد). كما يُبيّن أن
            بعض المصادر تكتبه "Joseph Jacquard" مقتصِرةً على اللقب والاسم الأول.

    - lemma: "جوزيف ماري جاكار"
      evidence_status: "no_material_found"

    # ── المرشحات من المرحلة ١ ──
    - lemma: "جُوزِيف مَارِي جَاكَار"
      evidence_status: "no_material_found"

    - lemma: "جُوزِيف م. جَاكَار"
      evidence_status: "no_material_found"

    - lemma: "جَاكَارْد"
      confirm:
        - text: >-
            «نسيج جاركارد: الأنسجة ذات تركيب نسجي مزركش، لا يبرز إلا من خلال
            رفع خيوط السداء المُفردة للأعلى.»
          source: "مسرد صناعة النسيج — ALECSO ArabTerm"
        - text: >-
            «قطيفة جاكارد: مخمل (قطيفة) لا يُنتج إلا بتقنية مخمل السداء [...]
            من خلال نسيج بتقنية الجاكارد.»
          source: "مسرد صناعة النسيج — ALECSO ArabTerm"
        - text: >-
            «قماش تريكو جاكارد: أقمشة تريكو أحادية اللون أو مُزركشة بألوان،
            غالبًا ما تكونُ عالية الجودة، وتعتمد زركشتها على تقنية يمين/يمين
            للأقمشة المُضَّلعة.»
          source: "مسرد صناعة النسيج — ALECSO ArabTerm"

    - lemma: "جُوزِيف جَاكَار"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "جاكار"
      decision: confirmed
      decision_reason: >-
        الاسم راسخ في المعاجم العربية الحديثة للإشارة إلى النول وإلى المخترع بوصفه
        الجذر الأصلي لهذا الاسم. التعريب "جاكار" (بدون دال) صواب لأنه يعكس النطق
        الفرنسي الأصيل للاسم. تحتاج اللمّة إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      morphology_check: >-
        اسم علم أعجمي مُعرَّب؛ لا جذر عربي له. وزنه الصرفي فَاعَال (مضارع قياسي
        للأسماء الأعجمية الرباعية).
      borrowing_check:
        loan_type: taarib
        verdict: مقبول — تعريب راسخ ومُدوَّن في معاجم معيارية
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        اللقب المختصر؛ يُستخدم في السياقات التقنية والنسيجية وعند الاستشهاد المختصر
        بالمخترع. يختلف عن اللمّة الكاملة بأنه أكثر شيوعاً في الخطاب العلمي
        الاختصاصي وفي الدلالة على الاختراع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَاكَار"

    - lemma: "جوزيف ماري جاكار"
      decision: confirmed
      decision_reason: >-
        الاسم الكامل للمخترع يُمثّل لمّةً قياسيةً لازمة في المجموعة، إذ يُمكّن من
        تمييزه عن أسماء مشتركة أو أفراد آخرين. لا أدلة معجمية مباشرة وهذا متوقع
        لاسم علم شخصي. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الاسم الكامل الثلاثي؛ يُستخدم في السياقات التاريخية والموسوعية والأكاديمية
        حيث يُراد التعريف الدقيق بالشخص. يتميّز عن "جَاكَار" بالصراحة التامة في
        تحديد هوية الشخص دون لبس.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُوزِيف مَارِي جَاكَار"

    # ── مرشحات المرحلة ١ ──

    - lemma: "جُوزِيف مَارِي جَاكَار"
      source: stage1
      decision: removed
      decision_reason: >-
        هذا المرشح مطابق للمّة الموجودة "جوزيف ماري جاكار" بعد إضافة التشكيل؛
        وقد تُعولَج الأصيلة بتحديث التشكيل عليها مباشرةً.

    - lemma: "جُوزِيف م. جَاكَار"
      source: stage1
      decision: removed
      decision_reason: >-
        الصيغة المختصرة بحرف "م." لا تتوافق مع أعراف الكتابة العربية للأسماء الأعجمية؛
        ولا يُعهد توثيقها في المعاجم. الاختصار بالحرف الأول مقبول في الإنجليزية
        لكنه نادر في الإسناد العربي. اللمّة "جَاكَار" تفي بهذا الغرض الاختصاري.

    - lemma: "جَاكَارْد"
      source: stage1
      decision: removed
      decision_reason: >-
        الشكل "جاكارد" (بالدال) وارد في بعض معاجم النسيج، غير أن "جاكار" (بدون
        دال) أصوب لأنه يعكس النطق الفرنسي الأصيل حيث الدال صامتة. الأسلم إضافته
        صيغةً بديلة (add_form) على مدخل "جَاكَار" لا إنشاء لمّة مستقلة.
      actions:
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "جَاكَارْد"

    - lemma: "جُوزِيف جَاكَار"
      source: stage1
      decision: removed
      decision_reason: >-
        صيغة مبتسرة لا تتمايز دلالياً عن "جَاكَار" (اللقب وحده) ولا تضيف قيمةً
        معجمية فارقة. الاسمان الموجودان (اللقب والاسم الكامل) يغطّيان الحاجة التمثيلية
        للمجموعة.


