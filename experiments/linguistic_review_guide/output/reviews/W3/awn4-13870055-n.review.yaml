# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13870055-n
# tenth — المركز العاشر في سلسلة معدودة من الأشياء
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «العاشر» بدون تشكيل، وتحتاج تشكيلاً كاملاً"
      - "التعريف العربي يحتوي على كلمة «العاشر» وهي اللمّة نفسها — دوران جزئي"
      - "المجموعة تحتوي لمّة واحدة فقط، قد يكون ذلك كافياً لمفهوم ترتيبي بسيط"
    observations: "المفهوم هو العدد الترتيبي العاشر مستعملاً اسماً دالاً على المرتبة في سلسلة معدودة. في العربية يُعبَّر عن الأعداد الترتيبية بصيغة فاعِل من الجذر العددي، فالعاشر من عَشَرَ على وزن فاعِل. المفهوم بسيط ومباشر ولا يحتاج إلا إلى لمّة واحدة أو اثنتين."
  blind_candidates:
    - lemma: "عَاشِر"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الجذر «عشر» على وزن فاعِل، وهو الصيغة القياسية للعدد الترتيبي العاشر في العربية الفصحى"
    - lemma: "عَاشِرَة"
      generation_method: ishtiqaq
      justification: "مؤنث العدد الترتيبي عاشر، يُستعمل إذا كان المعدود مؤنثاً: المرتبة العاشرة"
    - lemma: "الرُّتْبَة العَاشِرَة"
      generation_method: tarkib
      justification: "مركب وصفي من الرتبة + العاشرة، لكنه عبارة وصفية حرة وليس مصطلحاً مسكوكاً"
    - lemma: "المَوْضِع العَاشِر"
      generation_method: tarkib
      justification: "مركب وصفي من الموضع + العاشر، عبارة وصفية حرة تصف المفهوم لكنها ليست وحدة معجمية ثابتة"

stage2_evidence:
  per_lemma:
    - lemma: "الْعَاشِر"
      confirm:
        - text: "«عاشِر ... العاشر ... العُشْر» — ترجمة tenth"
          source: "المورد الحديث (2008)"
        - text: "«عَشَرْتُ الْقَوْمَ أَعْشِرُهُمْ، إِذَا صِرْتَ عَاشِرَهُمْ. وَكُنْتُ عَاشِرَ عَشَرَةٍ، أَيْ كَانُوا تِسْعَةً فَتُمُّوا بِي عَشَرَةَ رِجَالٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«فلانٌ عشْراً: أَخَذَ واحدًا من عَشَرَةٍ ... القومَ: صار عاشرهم»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«العاشر: هو من نَصَبهَ الإمامُ على الطريق ليأخذ الصدقات من التجار»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "دلالة فقهية مختلفة: العاشر = جابي العُشر، وليس العدد الترتيبي"
      expands:
        - text: "«وَعَاشُورَاءُ: الْيَوْمُ الْعَاشِرُ مِنَ الْمُحَرَّمِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "اشتقاق عاشوراء من عاشر يؤكد رسوخ الدلالة الترتيبية في الجذر"
    - lemma: "عَاشِر"
      confirm:
        - text: "«(1) عاشِر (2) عَشْريّ: مؤلِّفٌ جزءًا من عشرة أجزاء متساوية (3) العاشر (4) العُشْر»"
          source: "المورد الحديث (2008)"
        - text: "«عَشَرَ القومَ: صار عاشرهم. فهو عاشرٌ»"
          source: "المعجم الوسيط"
    - lemma: "عَاشِرَة"
      evidence_status: "no_material_found"
    - lemma: "الرُّتْبَة العَاشِرَة"
      evidence_status: "no_material_found"
    - lemma: "المَوْضِع العَاشِر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الْعَاشِر"
      decision: confirmed
      decision_reason: "العدد الترتيبي العاشر معرَّفاً بأل، وهو الصيغة الاسمية المستعملة للدلالة على المرتبة العاشرة. الأدلة المعجمية تؤكد استعماله ترتيبياً وإن وُجد اشتراك لفظي مع المعنى الفقهي (جابي العشر)، إلا أن السياق يميّز بينهما بوضوح."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة المعرَّفة بأل تدل على المرتبة العاشرة بعينها في سلسلة محددة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْعَاشِر"

    - lemma: "عَاشِر"
      source: stage1
      decision: removed
      decision_reason: "هو نفس اللمّة الموجودة «العاشر» بدون أداة التعريف. لا حاجة لإضافته مدخلاً مستقلاً لأن الفرق بينهما تعريف وتنكير فحسب، وليس اختلافاً دلالياً."

    - lemma: "عَاشِرَة"
      source: stage1
      decision: removed
      decision_reason: "مؤنث العدد الترتيبي، يُستعمل صفةً للمعدود المؤنث (المرتبة العاشرة)، لكنه لا يُستعمل اسماً مستقلاً للدلالة على المرتبة العاشرة في السلسلة. ولم تُوجد أدلة معجمية تدعم استعماله اسمياً."

    - lemma: "الرُّتْبَة العَاشِرَة"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة تتألف من نعت وموصوف، وليست وحدة معجمية ثابتة. تفشل في اختبار السكّ: يمكن إبدال «الرتبة» بـ«المنزلة» أو «الدرجة» ويبقى المعنى صالحاً."

    - lemma: "المَوْضِع العَاشِر"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة كسابقتها، وليست مصطلحاً مسكوكاً. تفشل في اختبار السكّ."

