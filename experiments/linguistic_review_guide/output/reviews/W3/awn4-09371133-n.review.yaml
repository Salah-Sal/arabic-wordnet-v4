stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - عدم وجود تنوع في المصطلحات (مثل المتغيرات الصوتية للاسم الأعجمي).
    observations: "المجموعة تعبر عن ملمح جغرافي محدد (خليج) مرتبط باسم علم أعجمي (ماساتشوستس). الترجمة الحالية دقيقة من الناحية الدلالية، لكنها تحتاج لضبط شكلي وتوثيق."
  blind_candidates:
    - lemma: "خَلِيج مَاسَاتْشُوسِتْس"
      generation_method: tarkib
      justification: "الترجمة المباشرة والأكثر شيوعاً للمصطلح الجغرافي (Massachusetts Bay)."
    - lemma: "جَوْن مَاسَاتْشُوسِتْس"
      generation_method: tarkib
      justification: "استخدام 'جون' كمرادف لخليج، وإن كان المصطلح الإنجليزي يفضل 'خليج'."
    - lemma: "خَلِيج مَاسَاشُوسِتْس"
      generation_method: tarkib
      justification: "تنويع في كتابة الاسم الأعجمي بناءً على النطق (sh)."
    - lemma: "مَدْخَل مَاسَاتْشُوسِتْس"
      generation_method: tarkib
      justification: "اشتقاق من وصف التعريف (مدخل للمحيط الأطلسي)."

stage2_evidence:
  per_lemma:
    - lemma: "خليج ماساتشوستس"
      evidence_status: "no_material_found"
    - lemma: "ماساشوسيتس"
