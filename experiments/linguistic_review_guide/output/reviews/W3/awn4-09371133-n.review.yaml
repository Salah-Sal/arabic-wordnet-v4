        - text: "ماساشوسيتس (Massachusetts)"
          source: "المكنز الزراعي متعدد اللغات (ArabTerm)"
    - lemma: "خَلِيج"
      confirm:
        - text: "الخَلِيجُ: وهو ماءٌ يميلُ مَيْلةً عن مُعْظم الماء فيستقر."
          source: "مقاييس اللغة لابن فارس"

stage3_analysis:
  per_lemma:
    - lemma: "خليج ماساتشوستس"
      decision: confirmed
      decision_reason: "الاسم الرسمي والمعياري لهذا المعلم الجغرافي في اللغة العربية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيج مَاسَاتْشُوسِتْس"
    - lemma: "خَلِيج مَاسَاشُوسِتْس"
      source: stage1
      decision: confirmed
      decision_reason: "متغير صوتي مقبول للاسم الأعجمي يعكس النطق الإنجليزي (sh) بدلاً من (tch)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params:
            lemma: "خَلِيج مَاسَاشُوسِتْس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09371133-n"

stage4_content:
  definition:
    current: "مدخل للمحيط الأطلسي قبالة شرق ماساتشوستس يمتد من كيب آن في الشمال إلى كيب كود في الجنوب"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي جداً ويستخدم مصطلحات أجنبية (كيب آن، كيب كود) يمكن تعريبها بـ 'رأس'."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ يَقَعُ فِي الْمُحِيطِ الْأَطْلَسِيِّ قُبَالَةَ السَّاحِلِ الشَّرْقِيِّ لِوِلَايَةِ مَاسَاتْشُوسِتْس الْأَمْرِيكِيَّةِ، يَمْتَدُّ مِنْ رَأْسِ آنَ شَمَالًا إِلَى رَأْسِ كُودٍ جَنُوبًا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09371133-n"
          definition_index: 0
          text: "خَلِيجٌ يَقَعُ فِي الْمُحِيطِ الْأَطْلَسِيِّ قُبَالَةَ السَّاحِلِ الشَّرْقِيِّ لِوِلَايَةِ مَاسَاتْشُوسِتْس الْأَمْرِيكِيَّةِ، يَمْتَدُّ مِنْ رَأْسِ آنَ شَمَالًا إِلَى رَأْسِ كُودٍ جَنُوبًا."
  examples:
    per_lemma:
      - lemma: "خَلِيج مَاسَاتْشُوسِتْس"
        examples:
          - text: "تُطِلُّ مَدِينَةُ بُوسْطُن عَلَى خَلِيجِ مَاسَاتْشُوسِتْس، مِمَّا جَعَلَهَا مِينَاءً حَيَوِيًّا فِي شَمَالِ شَرْقِ الْوِلَايَاتِ الْمُتَّحِدَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-09371133-n"
          text: "تُطِلُّ مَدِينَةُ بُوسْطُن عَلَى خَلِيجِ مَاسَاتْشُوسِتْس، مِمَّا جَعَلَهَا مِينَاءً حَيَوِيًّا فِي شَمَالِ شَرْقِ الْوِلَايَاتِ الْمُتَّحِدَةِ."

