# مراجعة المجموعة الترادفية — awn4-14037452-n (hibernation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (سبات شتوي) وهي مركب وصفي، بينما توجد مصطلحات مفردة مثل إشتاء"
      - "اللمّة الموجودة بدون تشكيل كامل"
      - "المفهوم يملك عدة مصطلحات عربية مقرّة في معاجم المصطلحات العلمية لم تُدرج"
    observations: >
      المفهوم هو حالة الخمول البيولوجي خلال فصل الشتاء، وهو مفهوم علمي أحيائي له عدة مقابلات عربية مقرّة.
      الفرق بين المجموعة الحالية (سبات شتوي) ومُشمولها (سبات/سكون/كمون) واضح: المُشمول عامّ بينما هذه المجموعة
      مخصصة بالشتاء. جذر «سبت» يدلّ على الراحة والسكون وهو مناسب دلالياً. المعجم الوسيط يُسجّل «البيات الشتوي»
      كمصطلح، ومعاجم المصطلحات الطبية تُسجّل «إشتاء» و«بيات»، مما يستدعي إثراء المجموعة.
  blind_candidates:
    - lemma: "سُبَاتٌ شَتْوِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «سبات» (نوم/خمول) و«شتوي» (نسبة إلى الشتاء)، يصف حالة الخمول الشتوي بدقة"
    - lemma: "إِشْتَاءٌ"
      generation_method: ishtiqaq
      justification: "مصدر على وزن افتعال من جذر شتو، يدل على الدخول في حالة الشتاء والتكيّف معها"
    - lemma: "بَيَاتٌ شَتْوِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «بيات» (المبيت والإقامة) و«شتوي»، يعبّر عن حالة السكون الشتوي"
    - lemma: "تَشْتِيَةٌ"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفْعِلَة من جذر شتو، يدل على عملية تمضية الشتاء في خمول"

stage2_evidence:
  per_lemma:
    - lemma: "سُبَاتٌ شَتْوِيٌّ"
      confirm:
        - text: "«اكتنان الشتاء أي فتور الحياة في بعض النباتات والحيوانات في الشتاء»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«سبات شتوي — hibernation»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«سُبات — dormancy»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "الجذر سبات يُستخدم أيضاً بمعنى الكمون العام دون تخصيص شتوي"
        - text: "«سُبَات — حالة شبه سكون يوضع فيها الحاسوب دون إطفائه في انتظار استعمال لاحق — hibernate»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
          addition: "امتداد دلالي للمصطلح إلى مجال الحوسبة"

    - lemma: "إِشْتَاءٌ"
      confirm:
        - text: "«إِشْتاءٌ اصْطِنَاعِيّ — artificial hibernation»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إشتاء (ال...)، بيات شتويّ — hibernation»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«يُسْبِت: يُنفق فصل الشتاء في الإسبات — hibernate»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«يُشْتِي — hibernate»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "الفعل المضارع المقابل يؤكد حيوية الجذر شتو في هذا السياق"

    - lemma: "بَيَاتٌ شَتْوِيٌّ"
      confirm:
        - text: "«البيات الشتوي حالة تعين النبات أو الحيوان على تمضية الفصل البارد في سكون أو نوم»"
          source: "المعجم الوسيط (1998)"
        - text: "«البَياتُ الشَّتْوِيُّ: (تَشْتِيَةٌ), وهو خُمود بعض الأحياء في الشتاء»"
          source: "المعجم الكبير"
        - text: "«بيات — حالة من السكون تمر بها بعض الحيوانات في أثناء الشتاء وتتميز بنوع من الخدر ونقص حاد في درجة حرارة الجسم ومعدل الأيض — hibernation»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"

    - lemma: "تَشْتِيَةٌ"
      confirm:
        - text: "«البَياتُ الشَّتْوِيُّ: (تَشْتِيَةٌ), وهو خُمود بعض الأحياء في الشتاء»"
          source: "المعجم الكبير"
      expands:
        - text: "«شَتَوَ: الشِّينُ وَالتَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ لِزَمَانٍ مِنَ الْأَزْمِنَةِ، وَهُوَ الشِّتَاءُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر شتو أصل واحد يدلّ على زمان الشتاء"

stage3_analysis:
  per_lemma:
    - lemma: "سُبَاتٌ شَتْوِيٌّ"
      decision: confirmed
      decision_reason: >
        مصطلح مقرّ في معاجم المصطلحات العلمية (علم الأحياء، AGROVOC) بمعنى hibernation.
        مطابق لتعريف المجموعة. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على جانب النوم والخمول (سُبات) في الحالة الشتوية، وهو المصطلح الأحيائي الشائع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُبَاتٌ شَتْوِيٌّ"

    - lemma: "إِشْتَاءٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مقرّ في المعجم الطبي الموحد والمعجم الموحد للطب البيطري والمورد الحديث.
        مصدر على وزن افتعال من جذر شتو، يدلّ على الدخول في حالة الشتاء.
        مصطلح مفرد (غير مركب) وهو أكثر اقتصاداً لغوياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح طبي/بيطري مفرد يُعبّر عن العملية الفسيولوجية للدخول في خمول الشتاء"
      actions:
        - command: create_entry
          params: {lemma: "إِشْتَاءٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "بَيَاتٌ شَتْوِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مسجّل في المعجم الوسيط والمعجم الكبير ومعجم المصطلحات الطبية.
        تعريف الوسيط يتطابق تماماً مع تعريف المجموعة الترادفية.
        من أكثر المصطلحات شيوعاً واستعمالاً في الكتابة العلمية العربية المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على جانب الإقامة والمكث (بيات) في حالة السكون الشتوي، وهو المصطلح الأكثر شيوعاً في الاستعمال العام والتعليمي"
      actions:
        - command: create_entry
          params: {lemma: "بَيَاتٌ شَتْوِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَشْتِيَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        وردت كمرادف شارح بين قوسين في المعجم الكبير فقط، ولم ترد كمدخل مستقل في أي معجم مصطلحات.
        المصدر تَفْعِلَة يدلّ أصلاً على فعل الإقامة في الشتاء (تشتية المواشي) لا على الحالة البيولوجية تحديداً،
        مما يجعلها أقل دقة من المصطلحات الأخرى.

