# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي «معماري إنجليزي (1664-1726)» موجز جداً ويخلو من أي معلومات موسوعية تُعرِّف بالشخص تعريفاً وافياً."
      - "اللمّتان الحاليتان «جون فانبرة» و«فانبرة» مجرد تعريب للاسم الأجنبي؛ لا توجد أدلة معجمية عربية تدعمهما في قاعدة البيانات."
      - "تهجئة «فانبرة» بالتاء المربوطة لإنهاء الاسم الأجنبي صحيحة إملائياً لكنها غير موحّدة في المصادر؛ تُستعمل أشكال متعددة كـ«فانبرو» أو «فانبرغ»."
      - "اللمّتان الحاليتان تفتقران إلى تشكيل كامل."
      - "POS الحالي (n) يصحّ، لكنّ الشخصية اسم علم (proper_noun) — يُوصى بالنظر في تحديث POS على مستوى المجموعة."
    observations: >
      هذه المجموعة تُمثّل اسم علم لشخصية تاريخية هي سير جون فانبرة (1664-1726)، المعماري وكاتب الكوميديا الإنجليزي البارز في عصر الباروك.
      تتضمن المجموعة لمّتين هما الاسم الكامل (جون فانبرة) واللقب وحده (فانبرة)، وهو الأسلوب المعتاد في أسماء الأعلام الأجنبية المعرَّبة.
      نظراً لأن المدخل اسم علم أجنبي، فإن جميع الأدوات الاشتقاقية والمجازية معطَّلة؛ التعريب هو الوسيلة الوحيدة الممكنة.
      الاسم الأصلي "Vanbrugh" من أصل هولندي، ويُنطق نطقاً يقترب من "VAN-bra" في الإنجليزية الحديثة (الـ-ugh صامتة).
      الترجمة العربية «فانبرة» بالتاء المربوطة تعكس التقليد العربي في إضافة حرف علة مفتوح في نهاية الأسماء الأجنبية المنتهية بصوت صامت.

  blind_candidates:
    - lemma: "جُون فَانْبَرَة"
      generation_method: taarib
      justification: >
        تعريب للاسم الكامل "John Vanbrugh" بأسلوب التعريب الفونيمي المعتاد:
        John → جون (جيم مضمومة + واو ساكنة + نون)،
        Vanbrugh → فانبرة (فاء مفتوحة + ألف + نون ساكنة + باء مفتوحة + راء مفتوحة + تاء مربوطة).
        التاء المربوطة خاتمةٌ شائعة في تعريب الأسماء الأجنبية المنتهية بصامت.
    - lemma: "فَانْبَرُو"
      generation_method: taarib
      justification: >
        تعريب بديل للقب "Vanbrugh" مع اعتماد الواو خاتمةً بدلاً من التاء المربوطة،
        محاكاةً لصوت النهاية في بعض قراءات الاسم الأجنبي. يُستعمل هذا الأسلوب في بعض المصادر العربية الموسوعية.
    - lemma: "فَانْبَرْغ"
      generation_method: taarib
      justification: >
        تعريب بديل يُثبت حرف الغين في آخر الاسم للمحافظة على الصوت الكتابي "-gh"
        بوصفه غيناً عربية، وهو تقليد شائع في تعريب الأسماء الهولندية والألمانية المنتهية بـ"-gh".
    - lemma: "سِير جُون فَانْبَرَة"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل مع لقب الفروسية "Sir" بصيغته المعرَّبة "سير"،
        وهو الشكل الأكثر رسمية الذي يرد في المصادر الأكاديمية والموسوعية العربية عند الإشارة إلى الشخصية
        لأول مرة. لقب "Sir" الإنجليزي يُعرَّب عادةً بـ"سير" في الكتابة العربية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية: جون فانبره / جون فانبرة / فانبره / فانبرة / فانبرو / فانبري
#        + صيغ ال- لكل منها → صفر نتائج
#   Q2 — جسر إنجليزي: translation_en:"Vanbrugh" OR "John Vanbrugh" OR "architect" OR "Vanbrigh"
#        → نتائج عامة للفظ "architect" (معمار، مهندس معماري) لا صلة لها بالشخصية
#   Q3 — FTS عربي: "فانبر" OR "فانبرة" OR "فانبرو" OR "فنبرة" → صفر نتائج
stage2_evidence:
  per_lemma:
    - lemma: "جون فانبرة"
      evidence_status: "no_material_found"

    - lemma: "فانبرة"
      evidence_status: "no_material_found"

    - lemma: "جُون فَانْبَرَة"
      evidence_status: "no_material_found"

    - lemma: "فَانْبَرُو"
      evidence_status: "no_material_found"

    - lemma: "فَانْبَرْغ"
      evidence_status: "no_material_found"

    - lemma: "سِير جُون فَانْبَرَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: جون فانبرة ──
    - lemma: "جون فانبرة"
      decision: confirmed
      decision_reason: >
        الاسم الكامل «جون فانبرة» هو التعريب المعتمد للشخصية في الشبكة الدلالية؛
        يفي باشتراط الوجود في مصادر الإحالة الموسوعية العربية رغم غياب توثيقه في قاعدة البيانات المعجمية الحالية.
        لا يوجد بديل اشتقاقي أو مجازي لاسم علم أجنبي. يحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل (الاسم الأول + اللقب)؛ يُستخدم في الذكر الأول والسياق الرسمي والأكاديمي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُون فَانْبَرَة"

    # ── لمّة موجودة: فانبرة ──
    - lemma: "فانبرة"
      decision: confirmed
      decision_reason: >
        الصيغة المختصرة (اللقب وحده) شائعة الاستخدام في المصادر العربية عند الإشارة اللاحقة للشخصية،
        وهي موافقة لقاعدة الاقتصاد اللغوي في إعادة الذكر. يحتاج إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب (اسم العائلة) وحده؛ يُستخدم في الإشارة اللاحقة وفي السياق غير الرسمي أو الاختصاري."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَانْبَرَة"

    # ── مرشح المرحلة ١: جُون فَانْبَرَة ──
    - lemma: "جُون فَانْبَرَة"
      source: stage1
      decision: removed
      decision_reason: >
        يطابق اللمّة الموجودة «جون فانبرة» بعد التشكيل؛ لا داعي لإضافة مدخل مستقل.
        تُعالَج اللمّة الموجودة بإجراء update_lemma.

    # ── مرشح المرحلة ١: فَانْبَرُو ──
    - lemma: "فَانْبَرُو"
      source: stage1
      decision: removed
      decision_reason: >
        لا يوجد توثيق معجمي أو موسوعي عربي لهذه الصيغة. التهجئة بالواو أقل شيوعاً
        من التهجئة بالتاء المربوطة في السياقات العربية المعتمدة. إدراجها يزيد التشتيت دون قيمة مضافة.

    # ── مرشح المرحلة ١: فَانْبَرْغ ──
    - lemma: "فَانْبَرْغ"
      source: stage1
      decision: removed
      decision_reason: >
        تهجئة بالغين غير موثّقة في المصادر العربية الموسوعية. اللمّة الحالية «فانبرة»
        بالتاء المربوطة أقرب إلى الاتفاقيات العربية في تعريب الأسماء الإنجليزية المنتهية بـ-ugh.

    # ── مرشح المرحلة ١: سِير جُون فَانْبَرَة ──
    - lemma: "سِير جُون فَانْبَرَة"
      source: stage1
      decision: removed
      decision_reason: >
        إضافة لقب الفروسية "سير" يُطوِّل اللمّة دون ضرورة معجمية؛ في معاجم الأعلام العربية
        يُذكر "سير" في الشرح لا في اللمّة نفسها. الصيغة «جون فانبرة» كافية كمصطلح إحالة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
