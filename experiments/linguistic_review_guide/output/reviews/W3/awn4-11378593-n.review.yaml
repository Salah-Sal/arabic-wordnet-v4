    current: "معماري إنجليزي (1664-1726)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مجرد وصف مقتضب ومؤرَّخ، يفتقر إلى الجنس القريب الواضح
        والفصول النوعية الكافية لتمييز هذه الشخصية عن سائر المعماريين الإنجليز.
        تعريف الأعلام يستدعي أسلوباً موسوعياً يذكر أبرز أعماله وطرازه المعماري.
    authored:
      - type: encyclopedic
        text: >
          سِيرْ جُون فَانْبَرَة (١٦٦٤-١٧٢٦): مَعمارِيٌّ وكاتِبٌ مَسرحِيٌّ إنجلِيزِيٌّ،
          مِنْ رُوَّادِ طِرازِ الباروكِ في إنجلترا، اشتُهِرَ بِتَصمِيمِ قَصرِ بلِنهايم
          وَقَصرِ هاوارد، وَكانَ أيضاً مِن كُتَّابِ الكوميديا الاجتماعية في عَصرِ الاستِعادة.
