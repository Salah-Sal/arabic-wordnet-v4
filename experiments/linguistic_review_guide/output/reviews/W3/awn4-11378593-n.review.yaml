          definition_index: 0
          text: "سِيرْ جُون فَانْبَرَة (١٦٦٤-١٧٢٦): مَعمارِيٌّ وكاتِبٌ مَسرحِيٌّ إنجلِيزِيٌّ، مِنْ رُوَّادِ طِرازِ الباروكِ في إنجلترا، اشتُهِرَ بِتَصمِيمِ قَصرِ بلِنهايم وَقَصرِ هاوارد."

