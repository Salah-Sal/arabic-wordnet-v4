stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم لفظ «حالة» وهي إحدى لمّات المجموعة، مما يُوقع في الدوران المعجمي"
      - "اللمّتان الموجودتان (حالة، نوبة) بدون تشكيل كامل"
      - "لفظ «حالة» شديد العموم، يصلح لأي وضع أو هيئة، وليس مقصوراً على الحالة الذهنية المؤقتة"
    observations: "المجموعة تصف مفهوم «الحالة الذهنية المحددة والمؤقتة»، وهو أخص من مجرد «الحالة» وأعم من «النوبة» التي تحمل ظلال المرض والعارض. فالمفهوم يشمل نوبات الغضب والقلق والفرح المفاجئ ونحوها. يحتاج المجموعة إلى لمّة تسدّ الفجوة بين العموم المفرط (حالة) والتخصيص المرضي (نوبة)."
  blind_candidates:
    - lemma: "نَوْبَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ن و ب) على وزن فَعْلَة، تدل على ما ينوب الإنسانَ من عارض مؤقت ثم يزول، وتُستعمل في: نوبة غضب، نوبة قلق، نوبة هلع — فهي أقرب اللمّات إلى المفهوم"
    - lemma: "عَارِضَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ع ر ض) على وزن فاعِلة، بمعنى ما يعرض للذهن من حالة طارئة ثم يزول — غير أنّ الدلالة الشائعة مادية (عارضة خشبية، عارضة أزياء)"
    - lemma: "خَلْجَة"
      generation_method: ishtiqaq
      justification: "من الجذر (خ ل ج) على وزن فَعْلة، تدل على حركة نفسية خاطفة أو اضطراب عابر في الذهن"
    - lemma: "طَوْر"
      generation_method: majaz
      justification: "من الجذر (ط و ر) بمعنى الحال والهيئة والمرحلة المؤقتة، مجاز من الامتداد الزمني المحدود — غير أنه أقرب إلى المرحلة منه إلى الحالة الذهنية العارضة"

