        - text: "«(النّوبَة) اسْم من المناوبة يُقَال جَاءَت نوبَته والنازلة يُقَال اعترته نوبَة عصبية أَو نوبَة جُنُون»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
