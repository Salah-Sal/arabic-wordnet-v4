          source: "المعجم الوسيط (OCR)"
          conflict: "الدلالات المعجمية كلها مادية أو مجازية بعيدة عن الحالة الذهنية المؤقتة"
        - text: "«العَارِضَةُ: نفقات تحدث»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "دلالة مالية لا نفسية"
    - lemma: "خَلْجَة"
      contradicts:
        - text: "«يُقال: بَيْننا وبَيْنَهم خُلْجَةٌ: وهو قَدْرُ ما يُمْشَى حتى يعْيَى مَرَّةً واحدةً»"
          source: "المعجم الكبير"
          conflict: "الدلالة المسجلة تتعلق بالمسافة لا بالحالة الذهنية"
      expands:
        - text: "«خلجة — tic»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (أرابترم)"
          addition: "اللاإرادية الحركية (tic) — دلالة جسدية لا ذهنية"
    - lemma: "طَوْر"
      confirm:
        - text: "«المَرَّةُ والتَّارَةُ. الحدُّ. ما كان على حدِّ الشيء أو بحذائه. الصنف والنوع. الحال والهيئة»"
          source: "المعجم الوسيط (OCR)"
      contradicts:
        - text: "«طَوْر — phase»"
          source: "المعجم الموحد لمصطلحات الفيزياء (أرابترم)"
          conflict: "الاستعمال الاصطلاحي الحديث ثبّت «طور» بمعنى phase الفيزيائية، مما يُبعده عن الحالة الذهنية"

