      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سَرَّاج"
      source: stage1
      decision: confirmed
      decision_reason: "الاسم الكلاسيكي الراسخ لصانع السروج على وزن فَعَّال الحِرَفي، موثّق في خمسة مصادر معجمية مستقلة (الوسيط، الكبير، القاموس المحيط، المورد الحديث، موسوعة قابوس) بدلالة مطابقة تماماً لمفهوم المجموعة. الجسر الإنجليزي يُترجمه مباشرةً بـ saddler. الغياب عن لمّات المجموعة ثغرةٌ معجمية واضحة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الاسم الكلاسيكي التراثي على وزن فَعَّال الحِرَفي الجامع لمعاني الصنع والبيع والإصلاح، أرسخ توثيقاً في الموروث المعجمي القديم والحديث، ومنه اشتُقّت المَسْرَجة (الدكّان) والسِّراجة (المهنة)"
      actions:
        - command: create_entry
          params:
            lemma: "سَرَّاج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10564972-n"

    - lemma: "عَتَّاد"
      source: stage1
      decision: removed
      decision_reason: "العَتَاد اسم جمع للأدوات والمعدات لا صيغة حِرفة. وزن فَعَّال (عَتَّاد) غير وارد في هذا المعنى في أيّ معجم، وأصل الجذر يدلّ على الحضور والإعداد لا على الصانع. الاقتراح مبنيٌّ على تحليل خاطئ للوزن."

    - lemma: "خَرَّاز"
      source: stage1
      decision: removed
      decision_reason: "الخرّاز حِرفيٌّ متخصّص في خياطة الجلد عموماً وصناعة الأحذية، لا يختصّ بمعدات الخيل. المعاجم لا تُدرجه ضمن مصطلحات صناعة السروج، ودلالته أعمّ من مفهوم المجموعة فلا يصلح مرادفاً."

    - lemma: "صَانِعُ السُّرُوج"
      source: stage1
      decision: removed
      decision_reason: "تكرار وصفي للمّة 'صانع سروج' الموجودة (بإضافة ال-) مع الفشل ذاته في اختبار التثبيت المعجمي. الوحدة المعجمية المسكوكة لهذا المفهوم هي سَرَّاج لا أيّ مركّب إضافي."


