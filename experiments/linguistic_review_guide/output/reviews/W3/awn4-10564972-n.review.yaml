      decision_reason: "عبارة وصفية تركيبية إضافية لا تجتاز اختبار التثبيت المعجمي: إذ يمكن إبدال (سروج) بـ(ركاب) أو (لجام) وتبقى الجملة وصفاً نحوياً صحيحاً، مما يكشف أنها ليست وحدة معجمية. لا يوجد شاهد معجمي على تداولها مدخلاً مستقلاً. المصطلح الكلاسيكي المقابل الراسخ هو سَرَّاج."
      evidence_assessment:
