# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10564972-n  |  ILI: i92677  |  POS: n
# English: saddler — a maker and repairer and seller of equipment for horses
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'سروجي' نسبة حديثة ذات ملمح عامّي، وتفتقر إلى تشكيل كامل"
      - "اللمّة 'صانع سروج' عبارة وصفية تركيبية لا تجتاز اختبار التثبيت المعجمي: يمكن إبدال (سروج) بـ(ركاب) أو (لجام) ويبقى الوصف صحيحاً، مما ينفي كونها وحدةً معجميةً مسكوكة"
      - "غياب المصطلح الكلاسيكي الراسخ 'سَرَّاج' الذي يُمثّل الأصل الفصيح المعجمي لهذا المفهوم في أمهات المعاجم"
    observations: >
      المجموعة الترادفية تصف مهنة صناعة السروج وأدوات الخيل وبيعها وإصلاحها، وهي حِرفة عريقة
      في التراث العربي لها مصطلحها الكلاسيكي الراسخ (سَرَّاج) على وزن فَعَّال الدالّ على الاحتراف
      والاختصاص في الحِرفة. التعريف الحالي وظيفيٌّ صحيح من حيث المضمون لكنه يعاني من ضعف في
      البناء النحوي (حذف الضمير في ومصلح وبائع). إضافة سَرَّاج إلزامية لاستيفاء التمثيل المعجمي.
  blind_candidates:
    - lemma: "سَرَّاج"
      generation_method: ishtiqaq
      justification: "مشتقٌّ على وزن فَعَّال من جذر س-ر-ج (السَّرْج = رَحْلُ الدابة)، وهو الوزن الصناعي الدالّ على احتراف الحِرفة كـ(نجّار، حدّاد، خبّاز، قصّاب). الأصل الجذري يُوثّق مباشرةً صناعة معدات الخيل."
    - lemma: "عَتَّاد"
      generation_method: ishtiqaq
      justification: "مشتقٌّ على وزن فَعَّال من جذر ع-ت-د (العَتَاد = ما يُعدّ من الأدوات والمعدات)، مُقترحٌ للدلالة على من يتخصّص في توفير معدات الخيل وإعدادها. الأصل يدلّ على الحضور والإعداد."
    - lemma: "خَرَّاز"
      generation_method: majaz
      justification: "إزاحة دلالية من (خيّاط الجلد العامّ) نحو صانع السروج تحديداً، استناداً إلى الصلة الوثيقة بين صناعة السروج وخياطة الجلد المدبوغ، إذ السروج في جوهرها منتج جلدي."
    - lemma: "صَانِعُ السُّرُوج"
      generation_method: tarkib
      justification: "تركيب إضافي من (صانع) جنساً قريباً و(السروج) فصلاً نوعياً مُحدِّداً. الصيغة المُعرَّفة بالألف واللام أقرب إلى الوحدة المعجمية من الصيغة المنكورة."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة: ٤ استعلامات
#   ١. مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات)
#   ٢. إثراء بالمعرّف (definitions + examples) لـ entry_ids الرئيسية
#   ٣. الجسر الإنجليزي: saddler / saddlery / saddle maker / harness maker
#   ٤. مقاييس اللغة: جذور سرج، خرز، عتد (dictionary_id = 151)
stage2_evidence:
  per_lemma:
    - lemma: "سروجي"
      confirm:
        - text: "«صانعُ السُّرُوج, وبائعُها»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      expands:
        - text: "«سروجيّ [فصيحة] التعليق: جاء في التاج واللسان والوسيط: السَّرج: رحل الدابة والسَّرَّاج متخذه وصانعه أو بائعه، ويمكن تصويب سروجيّ على أنها نسبة إلى السروج التي يصنعها، وقد تطورت دلالتها ولم تعد مقصورة على من يصنع سروج الدوابّ، بل أصبحت تُطلق على من يقوم بتنجيد كراسي السيارات، وبين المعنيين شبه واضح»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت 2003 م)"
          addition: "تصريح بقبول سروجي فصيحةً على أنها نسبة إلى السروج، مع الإشارة إلى توسّع دلالتها المعاصر نحو تنجيد المركبات"

    - lemma: "صانع سروج"
      evidence_status: "no_material_found"

    - lemma: "سَرَّاج"
      confirm:
        - text: "«بائعُ السُّرُوج صانعُها الكذَّابُ»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«صانعُ السُّرُوجِ. بائعُها.»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«السّرّاج: صانع السّروج أو بائعها أو مُصْلحها»  [translation_en: saddler]"
          source: "المورد الحديث (2008)"
        - text: "«سَرَّاج: من (س ر ج) صانع السروج وبائعها، والكذاب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«السَّرَّاجُ: مُتَّخِذُهُ وحِرْفَتُهُ: السِّراجَةُ»"
          source: "القاموس المحيط للفيروزآبادي (ت 1414 م)"
      expands:
        - text: "«(1) السِّراجة: حِرفة السّرّاج (2) المَسْرَجة: دكّان السَّرّاج (3) السُّروج وما إليها» [translation_en: saddlery]"
          source: "المورد الحديث (2008)"
          addition: "يكشف أن سَرَّاج هو المصطلح المرجعي في المصادر الحديثة، ومنه اشتُقّت السِّراجة (المهنة) والمَسْرَجة (دكان الصنعة)، مما يُثبت رسوخه كمحور اصطلاحي"

    - lemma: "عَتَّاد"
      contradicts:
        - text: "«(العتاد) عدَّة كل شيء ويُقال عتاد الحرب: الأسلحة والدواب وغيرها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
          conflict: "العتاد اسم جمع لأدوات الحرب واللوازم لا صيغة حِرفة ولا اسم لشخص؛ ووزن فَعَّال (عَتَّاد) غير وارد في هذا المعنى في المعاجم"
        - text: "«الْعَيْنُ وَالتَّاءُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حُضُورٍ وَقُرْبٍ. تَقُولُ عَتُدَ الشَّيْءُ وَهُوَ يَعْتُدُ عَتَادًا فَهُوَ عَتِيدٌ حَاضِرٌ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر ع-ت-د يدلّ على الحضور والإعداد (أدوات جاهزة) لا على الحِرفيّ الذي يصنعها"

    - lemma: "خَرَّاز"
      contradicts:
        - text: "«صانع الخَرَز مَنْ حرفته خياطة الجلد»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "الخرّاز متخصّص في خياطة الجلد عموماً وصناعة الأحذية، لا يختصّ بمعدات الخيل؛ المسمّى أعمّ من مفهوم المجموعة"
        - text: "«صانِعُ الخُفِّ وغيرِه أو الخَرْز»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "الخرّاز يعمل في الأخفاف والجلود عموماً، وهو أعمّ من المعنى المطلوب وليس مرادفاً لسَرَّاج في المعاجم"

    - lemma: "صَانِعُ السُّرُوج"
      expands:
        - text: "«صانعُ السُّرُوج، وبائعُها» (عن السَّرُوجِيّ)"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "العبارة واردة في المعجم كتعريف ميتالغوي للسروجي لا كمصطلح مستقلّ في حقل المُداخل، مما يؤكد أنها وصفية تحليلية لا وحدة معجمية مسكوكة"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "سروجي"
      decision: confirmed
      decision_reason: "اللمّة موثّقة في المعجم الكبير بوصفها مدخلاً معجمياً، وقُبلت رسمياً في معجم الصواب اللغوي بوصفها فصيحة. تحتاج إلى إضافة تشكيل كامل."
      evidence_assessment:
