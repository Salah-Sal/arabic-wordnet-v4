      nuance_differentiation: "نسبة إلى جمع السُّرُوج، حديثة الاستعمال نسبياً، وقد توسّعت دلالتها في العصر الحديث لتشمل المنجّد ومن يعمل في تنجيد كراسي المركبات، وهي أقلّ رسوخاً من سَرَّاج في الموروث الكلاسيكي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَرُوجِيّ"

    - lemma: "صانع سروج"
