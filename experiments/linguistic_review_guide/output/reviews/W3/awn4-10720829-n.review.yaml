        - text: "«ملعب تنس، ملعب كرة المضرب» — tennis court"
          source: "مسرد الفن والتسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«لباس كرة المضرب» — tennis clothes"
          source: "مسرد صناعة النسيج، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«مِرْفقُ التَّنّاسين؛ مرفق لاعبي التَّنِس (مض).» — tennis elbow"
          source: "المورد الحديث (2008)"
          addition: "يكشف وجود صيغة 'التنّاسين' (جمع تنّاس) كمرادف لـ'لاعبي التنس'، مما يثبت ثبوت 'كرة المضرب' مرادفاً راسخاً لـ'التنس'"

    - lemma: "لاعِبُ الْمِضْرَبِ"
      expands:
        - text: "«(في الرياضة): أداةٌ ذاتُ أشكال مختلفةٍ تُستخدَمُ لضرب الكرة فى كثير مِن اللُّعْباتِ الرِّياضية, كالتِّنِس, وتنس الطاولة»"
          source: "المعجم الكبير"
          addition: "يُثبت أن 'المضرب' يشمل أدوات رياضات متعددة (التنس، تنس الطاولة)، مما يجعل 'لاعب المضرب' عاماً لا خاصاً بلاعب التنس"

    - lemma: "لاعِبُ كُرَةِ الْمِضْرَبِ"
      confirm:
        - text: "«التنس، كرة المضرب» — tennis"
