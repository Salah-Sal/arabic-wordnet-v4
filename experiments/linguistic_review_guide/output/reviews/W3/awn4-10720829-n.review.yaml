    - lemma: "لاعب تنس"
      confirm:
        - text: "«ذِراعُ لاعِبِ التِّنِس (مِرْفَقُ لاعِبِ التِّنِس)» — lawn tennis arm (tennis elbow)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مِرْفَقُ لاعِبِي التَّنس» — tennis elbow"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«ساقُ لاعِبِ التِّنِس» — tennis leg"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إِبْهامُ لاعِبِي التَّنس» — tennis thumb"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«إصْبَعُ قَدَمِ لاعِبِ التِّنِس» — tennis toe"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مِعْصَمُ لاعِبِ التِّنْس» — tennis wrist"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«(التنس) لعبة كرة تكون دائماً بين لاعبين, تفصل بينهما شبكة, ويتقاذفان الكرة بمضربين. (د)»"
          source: "المعجم الوسيط"
          addition: "يؤكد أن التنس لعبة بين لاعبَين بمضربَين، مما يدعم مصطلح 'لاعب التنس' باعتبار اللاعب محوراً للتعريف"
        - text: "«لعبة كرة تكون بين لاعبين، تفصل بينهما شبكة ويتقاذفان الكرة بمضرَبين، وقد تكونُ بَيْنَ أَربعةِ لاعبين»"
          source: "المعجم الكبير"
          addition: "يقدّم التعريف الكامل للتنس مع إمكانية اللعب بأربعة لاعبين (زوجي)"

    - lemma: "لاعب كرة مضرب"
      confirm:
        - text: "«التَّنِس؛ كُرَة المِضْرَب (رب).» — tennis"
          source: "المورد الحديث (2008)"
        - text: "«التنس، كرة المضرب» — tennis"
