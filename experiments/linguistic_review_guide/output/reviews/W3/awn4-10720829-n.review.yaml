        - text: "«لباس كرة المضرب» — tennis clothes"
          source: "مسرد صناعة النسيج، المنظمة العربية للتربية والثقافة والعلوم"

    - lemma: "مِضْرَبِيّ"
      evidence_status: "no_material_found"

    - lemma: "تِنِّيسِيّ"
      contradicts:
