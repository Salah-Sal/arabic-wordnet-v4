# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "ضبط المضاف إليه: 'تنس' و'مضرب' يردان بلا لام التعريف، والأصوب 'التِّنِس' و'الْمِضْرَب' باعتبارهما علمَين على الرياضة في الاستعمال العربي المعاصر"
      - "التعريف 'رياضي يلعب التنس' دوراني جزئياً: يستعمل جذر (ل-ع-ب) وكلمة 'التنس' وهما المكوّنان الأساسيّان للمّتَي المجموعة"
    observations: >
      المجموعة تعبّر عن لاعب رياضة التنس، مفهوم حديث مرتبط بالرياضة الغربية المُعرَّبة.
      يستعمل اللسان العربي الحديث لهذه الرياضة مصطلحَين متوازيَين: 'التِّنِس'
      (نقل صوتي) و'كُرَةُ الْمِضْرَب' (ترجمة وصفية). كلاهما موثَّق في المعاجم
      التقنية الحديثة، وقد استقرّ مركّب 'لاعب التنس' في معاجم الطب العربي
      كمصطلح إسنادي ثابت. اللمّتان تمثّلان الاسمَين البديلَين للرياضة لا
      اختلافاً في المفهوم.

  blind_candidates:
    - lemma: "لاعِبُ الْمِضْرَبِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من 'لاعب' و'المضرب'؛ المضرب هو الأداة المحدِّدة للرياضة،
        ومن شأنه تعريف اللاعب بأداته المميِّزة، قياساً على 'لاعب الورق' و'لاعب
        الشطرنج'.
    - lemma: "لاعِبُ كُرَةِ الْمِضْرَبِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي موسَّع من 'لاعب' + 'كرة' + 'المضرب'؛ يستعمل الاسم العربي
        الوصفي الكامل لرياضة التنس 'كرة المضرب' لتمييزها عن سائر رياضات المضرب
        كالاسكواش وتنس الطاولة.
    - lemma: "مِضْرَبِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة اشتقاقية من 'مضرب' على وزن فِعَلِيّ، تعني المنتسب إلى رياضة
        المضرب؛ قياسٌ على كُرَوِيّ وكريكتيّ ورُقْبِيّ في اللغة الرياضية.
    - lemma: "تِنِّيسِيّ"
      generation_method: taarib
      justification: >
        تعريب 'tennis' بإضافة ياء النسبة إلى الاسم المعرَّب تِنِّيس،
        بمعنى المنتسب إلى رياضة التنس؛ ملاذ أخير بعد استنفاد الاشتقاق
        والتركيب.


