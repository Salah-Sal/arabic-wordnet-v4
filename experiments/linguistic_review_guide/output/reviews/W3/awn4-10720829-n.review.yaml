          source: "المعجم الكبير"
          conflict: "تِنِّيسِيّ في المعاجم العربية نسبة إلى 'تِنِّيس' المدينة المصرية القديمة لا إلى رياضة التنس؛ مما يُوقع في اشتراك لفظي مع علَم المكان"
        - text: "«تِنِّيسُ: د بِجَزِيرَةٍ من جَزائِرِ بَحْرِ الرُّومِ قُرْبَ دِمْيَاطَ، تُنْسَبُ إليه الثِّيَابُ الفاخِرَةُ»"
          source: "القاموس المحيط"
          conflict: "يؤكد أن تنيس اسم مكان مصري قديم، فالنسبة إليه 'تنيسي' لا علاقة لها بالرياضة"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّات موجودة ──
    - lemma: "لاعب تنس"
      decision: confirmed
      decision_reason: >
        المركّب موثَّق توثيقاً واسعاً في المعاجم الطبية العربية الرسمية
        (المعجم الطبي الموحد) بصيغة 'لاعب التنس' كمصطلح إسنادي ثابت.
        يحتاج تصحيح التشكيل وإضافة لام التعريف إلى 'التنس'.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يستعمل الاسم الأجنبي المعرَّب 'التنس' لتعريف الرياضة؛ أكثر شيوعاً
        في الاستعمال الإعلامي والمحادثة اليومية، وأقصر وأيسر تداولاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبُ التِّنِس"

    - lemma: "لاعب كرة مضرب"
      decision: confirmed
      decision_reason: >
        مصطلح 'كرة المضرب' وصف عربي أصيل للتنس موثَّق في معاجم المصطلحات
        الصادرة عن المنظمة العربية للتربية والثقافة والعلوم (ألكسو) والمورد
        الحديث. المركّب 'لاعب كرة المضرب' هو تعميم طبيعي لهذا الاسم.
        يحتاج تصحيح التشكيل وإضافة لام التعريف إلى 'المضرب'.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يستعمل الاسم العربي الأصيل 'كرة المضرب' لتعريف الرياضة؛ أكثر
        استعمالاً في الكتابة الرسمية والتقنية والمعاجم المتخصصة، ويُبرز
        الطابع العربي للمصطلح.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبُ كُرَةِ الْمِضْرَبِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لاعِبُ الْمِضْرَبِ"
      source: stage1
      decision: removed
      decision_reason: >
        'المضرب' وحده لا يحدّد التنس بالذات، بل يشمل كل رياضات المضرب
        (التنس، تنس الطاولة، الاسكواش، الريشة الطائرة)؛ أثبت المعجم الكبير
        أن المضرب الرياضي يُستعمل في 'كثير من اللعبات الرياضية'. لذا يفتقر
        المركّب إلى الخصوصية الدلالية المطلوبة للمجموعة الترادفية.

    - lemma: "لاعِبُ كُرَةِ الْمِضْرَبِ"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح هو الصورة المصوَّبة للمّة الموجودة 'لاعب كرة مضرب'؛
        إذ قرَّرنا في التحليل السابق تحديث اللمّة الموجودة إلى هذه الصيغة
        بالضبط. إدراجه كمدخل مستقل سيُفضي إلى تكرار داخل المجموعة.

    - lemma: "مِضْرَبِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا الاشتقاق في أي مصدر معجمي. يبقى غير مسكوك
        ومفتقراً إلى الثبوت المعجمي. فضلاً عن ذلك فإن 'مضربي' قد يُلتبس
        بصفة نسبية للمضرب (الآلة) لا للرياضة.

    - lemma: "تِنِّيسِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        'تنيسي' في المعاجم العربية نسبة إلى 'تِنِّيس' المدينة المصرية القديمة
        لا إلى رياضة التنس؛ يُثبت المعجم الكبير والقاموس المحيط ومعجم البلدان
        ذلك. استعماله للدلالة على لاعب التنس يوقع في اشتراك لفظي مُخِل مع
        النسبة التاريخية إلى المدينة المصرية.


