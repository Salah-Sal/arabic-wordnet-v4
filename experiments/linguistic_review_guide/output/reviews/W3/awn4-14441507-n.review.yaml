# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14441507-n
# incoherence / incoherency — نقص التماسك أو الوضوح أو التنظيم
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تفكك» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "اللمّة «عدم ترابط» تركيب إضافي سلبي — يحتاج فحص اختبار السكّ والتثبيت المعجمي"
      - "تكرار اللمّة «تفكك» في المجموعة وفي المشمول الأعلى (awn4-14441101-n) — قد يسبب التباساً"
    observations: "المفهوم يدور حول غياب الترابط والتماسك والوضوح والتنظيم، وهو مفهوم مجرد يتعلق بحالة سلبية. في العربية يُعبَّر عنه عادةً بمصادر الأفعال الدالة على الانحلال والتفرق (تفكُّك، تشتُّت) أو بتراكيب سلبية (عدم ترابط، عدم انسجام). المورد الحديث يترجم incoherence بـ«تفكُّك» و«تشوّش» و«لا تماسك أو ترابط» و«تنافر»، مما يؤكد أن المجال الدلالي واسع."

  blind_candidates:
    - lemma: "تَنَافُر"
      generation_method: ishtiqaq
      justification: "من الجذر «نفر» على وزن تَفَاعُل الدال على التبادل والتماثل، يدل على عدم الانسجام بين العناصر وتباعدها عن بعضها — مما يعبّر عن نقص التماسك"
    - lemma: "تَشَتُّت"
      generation_method: ishtiqaq
      justification: "من الجذر «شتت» على وزن تَفَعُّل، يدل على تفرُّق الأجزاء وعدم اجتماعها — مما يعبّر عن غياب التنظيم والترابط"
    - lemma: "عَدَمُ انْسِجَام"
      generation_method: tarkib
      justification: "تركيب إضافي سلبي يعبّر مباشرة عن فقدان التوافق والتناغم بين الأجزاء"
    - lemma: "اخْتِلَال"
      generation_method: ishtiqaq
      justification: "من الجذر «خلل» على وزن افتعال، يدل على فساد النظام والترتيب ووجود خلل في البنية"


stage2_evidence:
  per_lemma:
    - lemma: "تَفَكُّك"
      confirm:
        - text: "«(تفكك) انْفَكَّ وَيُقَال تفككت شخصية فلَان ضعفت وَفُلَان يتفكك فِي مَشْيه وَكَلَامه يضطرب فيهمَا»"
          source: "المعجم الوسيط"
        - text: "«(1) تفكُّك (2) «أ» تشوّش. «ب» لاتماسك أو ترابط (3) تنافر (4) شيء مشوَّش أو متنافر إلخ.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْفَاءُ وَالْكَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَفَتُّحٍ وَانْفِرَاجٍ. مِنْ ذَلِكَ فَكَاكُ الرَّهْنِ، وَهُوَ فَتْحُهُ مِنَ الِانْغِلَاقِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر فك يدل على الانفتاح والانفراج، مما يدعم دلالة التفكك على زوال التماسك"

    - lemma: "عَدَمُ تَرَابُط"
      confirm:
        - text: "«(1) تفكُّك (2) «أ» تشوّش. «ب» لاتماسك أو ترابط (3) تنافر»"
          source: "المورد الحديث (2008)"
        - text: "«لاتَرَابُطٌ ؛ عَدَمُ التَّرَابُط»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الرَّاءُ وَالْبَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى شَدٍّ وَثَبَاتٍ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ربط يدل على الشدّ والثبات، فعدم الترابط نفيٌ لهذا المعنى الأصيل"

    - lemma: "تَنَافُر"
      confirm:
        - text: "«(1) تفكُّك (2) «أ» تشوّش. «ب» لاتماسك أو ترابط (3) تنافر»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«التنافرُ: إِيرَاد الْكَلَام على وَجه لَا يسهل على اللِّسَان، إِمَّا لبعد شَدِيد بَين المخرجين، أَو لقرب بليغ بَينهمَا.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "التنافر في المعاجم الكلاسيكية مصطلح بلاغي يتعلق بثقل الألفاظ على اللسان، لا بنقص التماسك المعنوي أو التنظيمي"
        - text: "«التنافر: في اللغة اصله التحاكم في الحسب ثم كثر حتى استعمل في كل تحاكم. وعند أهل المعاني، وصف في الكلمة يوجب ثقلها على اللسان وعسر النطق بها كهعخع.»"
          source: "التعريفات الفقهية للبركتي"

    - lemma: "تَشَتُّت"
      contradicts:
        - text: "«تفكيك الركام إلى أجزاء مُفردة، بحيث يكون كل جزء منها كوحدة مُستقلة.»"
          source: "المعجم الموحد لمصطلحات هندسة المياه"
          conflict: "التشتت في المعاجم المصطلحية يدل على التفرق المادي (dispersion/scattering) لا على نقص التماسك المفهومي"
      expands:
        - text: "«الشِّينُ وَالتَّاءُ أَصْلٌ يَدُلُّ عَلَى تَفَرُّقٍ وَتَزَيُّلٍ، مِنْ ذَلِكَ تَشْتِيتُ الشَّيْءِ الْمُتَفَرِّقِ، تَقُولُ: شَتَّ شَعْبُهُمْ شَتَاتًا وَشَتًّا، أَيْ تَفَرَّقَ جَمْعُهُمْ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على التفرّق لكن بالمعنى المادي الملموس لا المجرد"

    - lemma: "عَدَمُ انْسِجَام"
      confirm:
        - text: "«عدم انسجام»"
          source: "المعجم الموحد لمصطلحات البيئة والمناخ"
      contradicts:
        - text: "«يدل على الفروق في الارتفاع النسبي لأصناف مختلفة أو مستويات تغذية في أوساط مجتمعات الجزر مقارنة مع تلك الموجودة على البر الرئيسى القريب.»"
          source: "المعجم الموحد لمصطلحات البيئة والمناخ"
          conflict: "ترجمة لـ disharmony وهو مفهوم بيئي مختلف عن incoherence"

    - lemma: "اخْتِلَال"
      contradicts:
        - text: "«تغير يصيب بالتلف عضوا ما أو معظم أنسجته مما يؤدي إلى فقدان خصائصه.»"
          source: "معجم المصطلحات الطبية"
          conflict: "الاختلال يدل على الاضطراب والفساد العضوي (disorder/disorganization) لا على نقص التماسك المنطقي"
      expands:
        - text: "«الْخَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَتَقَارَبُ فَرَوْعُهُ، وَمَرْجِعُ ذَلِكَ إِمَّا إِلَى دِقَّةٍ أَوْ فُرْجَةٍ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر خلل يدل على الفرجة والثغرة، وهو أقرب إلى الخلل والفساد منه إلى غياب التماسك"


