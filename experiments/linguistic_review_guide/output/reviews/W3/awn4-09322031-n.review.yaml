      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"خليج","root":"خلج","maqayis":"«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصلٌ واحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ...»"},{"word":"عمان","root":"عمن","maqayis":"«الْعَيْنُ وَالْمِيمُ وَالنُّونُ لَيْسَ بِأَصْلٍ، وَفِيهِ عُمَانُ: بَلَدٌ.»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"بحر","root":"بحر","maqayis":"«الْبَاءُ وَالْحَاءُ وَالرَّاءُ... سُمِّيَ الْبَحْرُ بَحْرًا لِاسْتِبْحَارِهِ وَهُوَ انْبِسَاطُهُ وَسَعَتُهُ.»"},{"word":"عمان","root":"عمن","maqayis":"«الْعَيْنُ وَالْمِيمُ وَالنُّونُ لَيْسَ بِأَصْلٍ، وَفِيهِ عُمَانُ: بَلَدٌ.»"}]}'
