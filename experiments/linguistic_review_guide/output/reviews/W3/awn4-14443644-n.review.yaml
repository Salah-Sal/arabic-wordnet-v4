# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14443644-n
# interconnection / interconnectedness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ترابط متبادل» حشوية؛ إذ إنّ وزن تَفَاعُل (تَرَابُط) يتضمّن أصلاً معنى التبادل والمشاركة، فإضافة «متبادل» تكرار دلالي"
      - "المجموعة تحوي لمّة واحدة فقط، والمطلوب إثراؤها بمرادفات إضافية"
      - "اللمّة الموجودة خالية من التشكيل"
      - "اللمّة «ترابط» واردة في المجموعة الرأسية (hypernym: awn4-14442568-n)، مما يستلزم تمييزاً دقيقاً بين المستويَيْن"
    observations: "المفهوم المستهدف هو حالة الاتصال المتبادل بين كيانات متعددة (interconnectedness)، وهو أخصّ من مطلق الاتصال (connection) الذي يمثّله الأصل. وزن تَفَاعُل في العربية مُنتِج جداً للدلالة على التشارك والتبادل (تعاون، تواصل، تشابك)، مما يجعله الوزن الأمثل هنا. لكن ينبغي التمييز بين هذا المستوى الدلالي والمستوى الأعلى الذي يستخدم ترابط واتصال وصلة."

  blind_candidates:
    - lemma: "تَرَابُط"
      generation_method: ishtiqaq
      justification: "مصدر تَرَابَطَ على وزن تَفَاعُل من الجذر ر-ب-ط، يدلّ على الارتباط المتبادل بين طرفين أو أكثر. الوزن يتضمّن معنى المشاركة والتبادل ذاتياً."
    - lemma: "تَوَاصُل"
      generation_method: ishtiqaq
      justification: "مصدر تَوَاصَلَ على وزن تَفَاعُل من الجذر و-ص-ل، يدلّ على الاتصال المتبادل. ورد في المعاجم المعاصرة بمعنى الاتصال المتبادل (intercommunication)."
    - lemma: "تَشَابُك"
      generation_method: ishtiqaq
      justification: "مصدر تَشَابَكَ على وزن تَفَاعُل من الجذر ش-ب-ك، يدلّ على تداخل الأشياء بعضها في بعض. يتضمّن معنى الربط المتبادل مع إيحاء بالتعقيد الشبكي."
    - lemma: "تَرَابُطٌ بَيْنِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من تَرَابُط + بَيْنِيّ (= inter-)، على غرار المصطلحات التقنية المعتمدة: ربط بيني، رابط بيني، توصيل بيني. يميّز المفهوم عن مطلق الترابط بإضافة البُعد البيني."

stage2_evidence:
  per_lemma:
    - lemma: "تَرَابُطٌ مُتَبَادَلٌ"
      confirm:
        - text: "«اتصال متبادل — المنظومة البيئية منظومة شبكية، ترتبط مكوناتها ببعضها البعض بشكل مباشر وغير مباشر»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
      expands:
        - text: "«علاقة — اتصال متبادل بين أشخاص أو مجموعات»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          addition: "يبيّن أنّ مفهوم الاتصال المتبادل يُعبَّر عنه بـ«علاقة» أيضاً"

    - lemma: "تَرَابُط"
      confirm:
        - text: "«(الترابط) (في علم الفلسفة) قيام علاقة بين مدرَكين لاقترانهما فى الذهن بسبب ما»"
          source: "المعجم الوسيط"
        - text: "«ترَابُط — interconnection»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«ربط (ترابط) — interconnection; interconnexion»"
          source: "موسوعة الكهرباء (IEC 60050)"
      expands:
        - text: "«تتابع مجموعات ترتبط، بعضها ببعض، كتلاحق ظروف وأحداث قصصية، حسب قواعد انسجامية»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يوسّع الدلالة لتشمل الترابط النصّي والسردي"
        - text: "«درجة العلاقة، أو التوافق، بين سلسلتي معطيات أو أكثر»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
          addition: "دلالة إحصائية: ترابط = correlation"
      contradicts:
        - text: "«ترابط — connexity»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "في الرياضيات يُستخدم ترابط بمعنى connexity (خاصية طوبولوجية)، وهو معنى مغاير"

    - lemma: "تَوَاصُل"
      confirm:
        - text: "«تواصُل — اتصال متبادل — intercommunication»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      contradicts:
        - text: "«تواصل — communication — الحوار وتمكين الناس من فهم العوامل الرئيسية لبيئتهم»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          conflict: "الاستخدام الغالب لتواصل هو communication (تبليغ رسالة)، لا مجرد حالة اتصال متبادل"
        - text: "«نقل الأخبار بواسطة العلامات والإشارات بين مرسل إلى متلقٍ عبر قناة ما»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "يؤكد أنّ تواصل = عملية نقل رسائل، لا حالة ارتباط ساكنة"

    - lemma: "تَشَابُك"
      confirm:
        - text: "«تشابك — linkage»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (1996)"
      contradicts:
        - text: "«(تشابك) الشيء شَبَكَ يُقال تشابكت الأمور اختلط بعضها ببعض»"
          source: "المعجم الوسيط (حوراماني)"
          conflict: "الدلالة الأساسية هي الاختلاط والتعقيد (entanglement)، لا مجرد الاتصال المتبادل المنتظم"
        - text: "«تشابك — interlocking / knotting / tangling»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "الترجمات تؤكد دلالة التشابك الفيزيائي والعقد"

    - lemma: "تَرَابُطٌ بَيْنِيّ"
      expands:
        - text: "«رابط بيني — مُوَصِّل يُهيئ ترابطاً بينياً كهربائياً بين الخلايا الشمسية — interconnect»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يثبت استخدام «ترابط بيني» في السياق التقني بمعنى interconnection"
        - text: "«وصل بين — خلق علاقة بين عدة محيطيات مختلفة بحيث يصبح التشغيل مترابطاً — interconnection»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "يؤكد نمط «بين/بيني» كمقابل لـ inter- في مصطلحات الربط"

stage3_analysis:
  per_lemma:
    - lemma: "تَرَابُطٌ مُتَبَادَلٌ"
      decision: confirmed
      decision_reason: "رغم الحشو الدلالي الجزئي (تَفَاعُل يتضمن التبادل)، فإنّ اللمّة تخدم غرضاً تمييزياً ضرورياً عن «ترابط» الوارد في المجموعة الرأسية. التعبير مفهوم وشفاف دلالياً، وإن لم يكن مصطلحاً مسكوكاً بالمعنى الدقيق."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُبرز صراحةً البُعد التبادلي للارتباط، ويُستخدم في السياقات العامة والاجتماعية"
