      decision_reason: "اللمّة واردة في المجموعة الرأسية (awn4-14442568-n) بوصفها مرادفاً لـ«اتصال» و«صلة». إضافتها هنا تُلغي التمييز بين المستوى الأعمّ (connection) والأخصّ (interconnection)."
      evidence_assessment:
        case: confirm_only

    - lemma: "تَوَاصُل"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود تعريف «اتصال متبادل» في مسرد الإعلام والتواصل، فإنّ الاستخدام الغالب والمستقرّ لـ«تواصل» هو communication (نقل رسالة عبر قناة)، وليس حالة ارتباط ساكنة. إدراجه هنا يُوقع لبساً مع مجموعات التواصل/الاتصال."
      evidence_assessment:
        case: mixed

    - lemma: "تَشَابُك"
      source: stage1
      decision: removed
      decision_reason: "دلالته الأصلية في المعجم الوسيط هي الاختلاط والتعقيد (entanglement)، وترجماته التقنية (interlocking, knotting, tangling) تؤكد البُعد الفيزيائي والعقدي. لا يناسب حالة الاتصال المتبادل المنتظم."
      evidence_assessment:
        case: mixed

    - lemma: "تَرَابُطٌ بَيْنِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب وصفي منتظم على نمط المصطلحات التقنية المعتمدة (ربط بيني، رابط بيني، توصيل بيني). «بيني» مقابل مستقرّ لـ inter- في المعاجم الموحدة. ورد «ترابط بيني» في سياق تقني (المعجم الموحد للطاقة المتجددة). يميّز المفهوم عن مطلق الترابط بإضافة البُعد البيني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُبرز البُعد البيني (بين أنظمة أو كيانات)، ويُستخدم في السياقات التقنية والهندسية"
