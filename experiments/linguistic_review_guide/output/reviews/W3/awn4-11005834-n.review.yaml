          باخرة تجارية ناجحة تجارياً أطلقها على نهر هدسون عام 1807م، فضلاً عن
          تصميم أول سفينة حربية تعمل بالبخار. أحدث بإبداعاته ثورةً في الملاحة
          والنقل البحريَّيْن وصناعة الأسلحة البحرية.
