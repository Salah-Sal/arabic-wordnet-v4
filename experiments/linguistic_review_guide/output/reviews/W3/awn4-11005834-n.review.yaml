# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان 'روبرت فولتون' و'فولتون' مكتوبتان بدون تشكيل، وهو مطلب إلزامي في AWN4."
      - "التهجية العربية لـ 'Fulton' تحتمل أشكالاً متعددة (فولتون / فُلتون / فُولتُون) — يجب توحيدها وفق المعيار الأكثر شيوعاً في المصادر العربية المعاصرة."
      - "المجموعة تخلو من أي مثال استعمالي على مستوى المعنى أو المجموعة."
      - "اللمّتان كلتاهما ترادفان لاسم علم واحد (روبرت فولتون) بمستويين: الاسم الكامل والاسم المختصر — يجب توثيق الفرق الاستعمالي بينهما."
    observations: >
      هذه المجموعة الترادفية تمثّل اسم علم أجنبي مُعرَّباً لشخصية تاريخية أمريكية، وهي
      روبرت فولتون (1765–1815)، مخترع الباخرة التجارية الأولى والسفينة الحربية البخارية
      الأولى. الأسماء الأعلام المُعرَّبة في المعجمية العربية لا تخضع لقواعد الاشتقاق
      والتوليد الاعتيادية، وإنما تُكتسب صيغتها العربية بالتعريب الصوتي. أبرز ما يُلاحَظ
      غياب التشكيل وانعدام الأمثلة الاستعمالية.

  blind_candidates:
    # المرحلة العمياء: المجموعة تصف مخترعاً أمريكياً من القرن الثامن عشر،
    # مما يكشف عن اسم علم لشخصية تاريخية. المرشحات أدناه مبنية على وصف التعريف فقط.
    - lemma: "أَبُو البَاخِرَة"
      generation_method: majaz
      justification: >
        كُنية مجازية على نمط أبو (فلان) تُوظَّف في العربية للإشارة إلى رائد
        مجال ما أو مُبتكره الأوّل؛ فالشخص المقصود هو مَن مكّن الإبحار بالبخار
        لأول مرة تجارياً، مما يجعل الكنية المجازية "أبو الباخرة" ملائمة وصفياً
        من التعريف وحده. (يُلاحَظ أن هذا لقب وصفي لا اسم علم، وقد يُرفض في مرحلة لاحقة.)
    - lemma: "رَائِد الإِبْحَار البُخَارِي"
      generation_method: tarkib
      justification: >
        مركب إضافي-وصفي من رائد + الإبحار + البخاري، يصف صاحب الريادة
        في مجال الإبحار بالبخار. يستوفي وصف التعريف دون تكرار مكوناته الحرفية.
        (لقب وصفي مركب، ليس اسماً علماً.)
    - lemma: "مُبْدِع المِلاحَة البُخَارِيَّة"
      generation_method: tarkib
      justification: >
        مركب إضافي-وصفي من مُبدِع + الملاحة + البخارية. يستند إلى وزن "مُفعِل"
        للدلالة على الفاعل المُبدِع، ويُشير إلى ريادة الشخصية في الملاحة البخارية.
    - lemma: "فُولتُون"
      generation_method: taarib
      justification: >
        تعريب صوتي للقب الأجنبي "Fulton" — وهو الملاذ الأخير للأسماء الأعجمية
        ذات الصيغة العالمية التي لا يمكن الاشتقاق منها. يقبل لام التعريف
        (الفولتون) والنسبة (فولتوني) والجمع السالم (فولتونيون).


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  # سجل الاستعلامات المُنفَّذة:
  # ١. مطابقة دفعية: روبرت فولتون / فولتون / روبرت (وصيغ ال-) — نتيجة: لا مدخلات
  # ٢. جسر إنجليزي: Fulton / Robert Fulton / steamboat / steam warship — واحد ذو صلة جزئية
  # ٣. FTS عربي: فولتون / باخرة / بخار / مخترع — لا صلة بالاسم العلم
  # ٤. تحقق من المرشحات: جميع المرشحات غير موجودة في القاعدة

  per_lemma:
    - lemma: "روبرت فولتون"
      evidence_status: "no_material_found"
      # الاستعلام الدفعي بجميع الصيغ لم يُعِد أي مدخل مطابق في قاعدة البيانات.
      # هذا متوقع: أسماء الأعلام الأجنبية المُعرَّبة نادراً ما تُدرج في المعاجم العربية الكلاسيكية.

    - lemma: "فولتون"
      evidence_status: "no_material_found"
      # كذلك، لا مدخل لـ "فولتون" منفرداً في قاعدة البيانات.

    - lemma: "أَبُو البَاخِرَة"
      evidence_status: "no_material_found"

    - lemma: "رَائِد الإِبْحَار البُخَارِي"
      evidence_status: "no_material_found"

    - lemma: "مُبْدِع المِلاحَة البُخَارِيَّة"
      evidence_status: "no_material_found"

    - lemma: "فُولتُون"
      # استعلام الجسر الإنجليزي أعاد مدخلاً واحداً ذا صلة جزئية:
      expands:
        - text: "«الباخرة: سفينة بُخاريّة.»"
          source: "المورد الحديث (2008)"
          addition: >
            يؤكد أن المصطلح العربي الراسخ للـ steamboat هو "الباخرة" — وهو مصطلح
            مرتبط بالسياق الذي اشتُهر فيه روبرت فولتون، مما يُرسّخ أهمية الشخصية
            في سياق الملاحة البخارية. غير أن المدخل لا يتضمن ذكراً للاسم "فولتون".


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "روبرت فولتون"
      decision: confirmed
      decision_reason: >
        اسم الشخصية الكامل في صيغته العربية المعرَّبة الشائعة. الاسم الكامل ضروري
        في المجموعة الترادفية لأسماء الأعلام لكونه الشكل الرسمي الأكثر توضيحاً
        وتمييزاً من الأشخاص الآخرين الذين قد يحملون اللقب "فولتون". يجب تشكيله
        وفق النطق الإنجليزي المعرَّب المعياري.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
        # اسم علم مُركَّب من اسم أول (روبرت) + لقب عائلي (فولتون) — مزجي بالمعنى الواسع.
      nuance_differentiation: >
        الاسم الكامل يُستخدم في السياقات الرسمية والموسوعية والأكاديمية عند أول
        ذكر للشخصية، وفي سياقات التمييز عند تعدّد الأفراد الحاملين للقب فولتون.
        يتصدّر النصوص البيوغرافية الرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُوبِرْت فُولتُون"

    - lemma: "فولتون"
      decision: confirmed
      decision_reason: >
        الاسم المختصر (اللقب العائلي) للشخصية، وهو الشكل المتداول في النصوص
        الأكاديمية والإخبارية والموسوعية بعد الذكر الأول للاسم الكامل. ضروري
        في المجموعة الترادفية لتغطية السياقات التي تُحيل إلى الشخصية بلقبها فقط.
        يجب تشكيله وفق النطق المعيار.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المختصر يُستخدم بعد أول ذكر للاسم الكامل في النصوص الأكاديمية
        والإخبارية، ويُعادل استخدام الكنية في التراث العربي. أقل رسمية من الاسم
        الكامل وأكثر شيوعاً في التداول السريع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُولتُون"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أَبُو البَاخِرَة"
      source: stage1
      decision: removed
      decision_reason: >
        لقب وصفي وليس اسم علم. فشل في اختبار التثبيت المعجمي: لا وجود له في أي
        معجم، وهو عبارة وصفية حرة يمكن إبدال "الباخرة" فيها بمرادف (أبو البواخر /
        أبو الملاحة) فيبقى وصفاً مقبولاً. لا يصلح لمّة في شبكة دلالية للأسماء الأعلام.

    - lemma: "رَائِد الإِبْحَار البُخَارِي"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية مركّبة تصف دور الشخصية لا اسمها العلَمي. فشل في اختبار السكّ:
        يمكن إبدال "الإبحار" بـ"الملاحة" أو البخاري بـ"البحري" فيبقى الوصف مقبولاً.
        ليست وحدة معجمية مثبّتة.

    - lemma: "مُبْدِع المِلاحَة البُخَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        نفس العلّة: عبارة وصفية حرة، غير ثابتة معجمياً، ولا تصلح لمّة في سياق
        الاسم العلم لشخصية تاريخية.

    - lemma: "فُولتُون"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة مطابقة في دلالتها للمّة الموجودة "فولتون" بعد تشكيلها
        الصحيح. لا حاجة إلى إدراجها من جديد كمرشح منفصل إذ ستُعالَج بتحديث
        التشكيل على اللمّة الموجودة.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
