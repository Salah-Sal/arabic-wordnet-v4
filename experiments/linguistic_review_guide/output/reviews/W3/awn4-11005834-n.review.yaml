      decision: revise
      reason: >
        التعريف الحالي دقيق من حيث المضمون، غير أنه يفتقر إلى أسلوب المعجم الوسيط
        البيوغرافي: يُفضَّل بدء التعريف بالاسم كاملاً أو الإشارة إليه، وإضافة بُعد
        المكانة التاريخية، وترتيب المعلومات من العامة إلى الخاصة. كذلك استُخدم
        "قارب بخاري" بينما المصطلح العربي الراسخ هو "باخرة" أو "سفينة بخارية".
