stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان عبارة عن تراكيب وصفية حرة وليستا مصطلحين معجميين مستقرين للتعبير عن المجموعة التصنيفية."
      - "التعريف الحالي يتضمن إشارة لغوية ميتا-وصفية ('تستخدم في بعض أنظمة التصنيف...') وليس تعريفاً مصطلحياً مباشراً للمفهوم."
    observations: "المفهوم يشير إلى طويئفة نباتية تاريخية كانت تعرف باسم Amentiferae لأنها تحمل نوارات تشبه ذيل الهر (catkin). الاصطلاح الأنسب يجب أن يكون مصطلحاً علمياً بصيغة الجمع المألوف في التصنيف النباتي (-يات)."
  blind_candidates:
    - lemma: "هِرِّيَّات"
      generation_method: ishtiqaq
      justification: "صيغة الجمع المؤنث السالم على وزن الفصائل والرتب النباتية، مشتقة من صفة (هرّي) نسبة للهرّ للإشارة لشكل النورة."
    - lemma: "حَامِلَاتُ النَّوْرَاتِ الْهِرِّيَّة"
      generation_method: tarkib
      justification: "ترجمة دلالية للمصطلح اللاتيني Amentiferae الذي يعني حاملات الهرير."
    - lemma: "ذَوَاتُ النَّوْرَاتِ الْهِرِّيَّة"
      generation_method: tarkib
      justification: "مركب وصفي يعبر عن الخاصية الأبرز لهذه النباتات بطريقة وصفية."
    - lemma: "عُنَيْقِيدِيَّات"
      generation_method: ishtiqaq
      justification: "نسبة إلى (عنيقيد) وهو الترجمة الدقيقة لكلمة ament التي سميت بها المجموعة."

stage2_evidence:
  per_lemma:
    - lemma: "مجموعة النباتات الهرية"
      evidence_status: "no_material_found"
    - lemma: "نباتات هرية"
      evidence_status: "no_material_found"
    - lemma: "هِرِّيَّات"
      confirm:
        - text: "هريات"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
    - lemma: "حَامِلَاتُ النَّوْرَاتِ الْهِرِّيَّة"
      evidence_status: "no_material_found"
    - lemma: "ذَوَاتُ النَّوْرَاتِ الْهِرِّيَّة"
      evidence_status: "no_material_found"
    - lemma: "عُنَيْقِيدِيَّات"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مجموعة النباتات الهرية"
      decision: removed
      decision_reason: "عبارة وصفية غير مسكوكة وليست مصطلحاً علمياً مستقراً لتسمية المجموعة التصنيفية."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params: {sense_id: "{auto}"}
    - lemma: "نباتات هرية"
      decision: removed
      decision_reason: "تركيب وصفي غير مسكوك؛ المصطلح العلمي الأدق في علم التصنيف النباتي هو الكلمة المجموعة الدالة على الطائفة كـ(هريات)."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params: {sense_id: "{auto}"}
    - lemma: "هِرِّيَّات"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح علمي موثق ومطابق لمقاييس التسمية التصنيفية في علم النبات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "هِرِّيَّات", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "حَامِلَاتُ النَّوْرَاتِ الْهِرِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية غير مستقرة مصطلحياً والأفضل اعتماد المصطلح المفرد الموجز."
      evidence_assessment:
        case: no_material
    - lemma: "ذَوَاتُ النَّوْرَاتِ الْهِرِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي يفتقر للتوثيق المعجمي كاسم تصنيفي مقارنة بـ (هريات)."
      evidence_assessment:
        case: no_material
    - lemma: "عُنَيْقِيدِيَّات"
      source: stage1
      decision: removed
      decision_reason: "مصطلح مقترح لا يدعمه الاستعمال المعجمي الفعلي."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "تستخدم في بعض أنظمة التصنيف للنباتات التي تحمل نوارات هرية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على صياغة لغوية (تستخدم في...) بدلاً من أن يكون تعريفاً مباشراً للكيان التصنيفي."
    authored:
      - type: terminological
        text: "طويئفة تصنيفية تاريخية من النباتات ذوات الفلقتين، تتميز بأن أزهارها تتجمع في نوارات هرّيّة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "طويئفة تصنيفية تاريخية من النباتات ذوات الفلقتين، تتميز بأن أزهارها تتجمع في نوارات هرّيّة."}
  examples:
    per_lemma:
      - lemma: "هِرِّيَّات"
        examples:
          - text: "تضم طويئفة الهريات فصائل نباتية مثل الصفصافيات والبلوطيات التي تلقح بواسطة الرياح."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تضم طويئفة الهريات فصائل نباتية مثل الصفصافيات والبلوطيات التي تلقح بواسطة الرياح."}

stage5_enrichment:
  per_entry:
    - lemma: "هِرِّيَّات"
      entry_id: "{auto}"
      root: "هرر"
      maqayis_quote: "«(هَرَّ) الْهَاءُ وَالرَّاءُ: أُصَيْلٌ صَحِيحٌ يَدُلُّ عَلَى صَوْتٍ مِنَ الْأَصْوَاتِ، وَيُقَاسُ عَلَيْهِ. يَقُولُونَ: الْهِرُّ: دُعَاءُ الْغَنَمِ. وَالْهِرَّةُ: السِّنَّوْرَةُ، وَكَأَنَّهَا سُمِّيَتْ لِصَوْتِهَا إِذَا هَرَّتْ.»"
  per_sense:
    - lemma: "هِرِّيَّات"
      sense_id: "{auto}"
      nuance: "المصطلح المعتمد والوحيد للتعبير عن هذه الطويئفة النباتية."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"هرر","maqayis":"«(هَرَّ) الْهَاءُ وَالرَّاءُ: أُصَيْلٌ صَحِيحٌ يَدُلُّ عَلَى صَوْتٍ مِنَ الْأَصْوَاتِ، وَيُقَاسُ عَلَيْهِ. يَقُولُونَ: الْهِرُّ: دُعَاءُ الْغَنَمِ. وَالْهِرَّةُ: السِّنَّوْرَةُ، وَكَأَنَّهَا سُمِّيَتْ لِصَوْتِهَا إِذَا هَرَّتْ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح المعتمد والوحيد للتعبير عن هذه الطويئفة النباتية.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95