# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13970354-n
# equality of score in a contest — تساوي النتيجة في مسابقة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «تعادل» بدون تشكيل كامل"
      - "المجموعة تحتوي على لمّة واحدة فقط، والمفهوم شائع في العربية ويستحق إثراءً بلمّات إضافية"
    observations: >
      المفهوم واضح ومألوف في الثقافة العربية الرياضية: تساوي النتيجة بين فريقين أو متسابقين.
      اللمّة «تعادل» مشتقة من الجذر ع-د-ل على وزن تَفَاعُل الدال على المشاركة والتبادل،
      وهي الأكثر شيوعاً في الاستعمال الرياضي المعاصر. التعريف العربي موجز ودقيق.
      الأفعال القريبة كثيرة (مُعَادَلَة، مُسَاوَاة) لكن المطلوب اسم الحدث لا المصدر العام.
  blind_candidates:
    - lemma: "تَعَادُل"
      generation_method: ishtiqaq
      justification: >
        من الجذر ع-د-ل على وزن تَفَاعُل الدال على المشاركة بين طرفين؛
        يفيد التساوي المتبادل في النتائج، وهو الاشتقاق الطبيعي للدلالة على تكافؤ النقاط في المسابقات.
    - lemma: "سِجَال"
      generation_method: majaz
      justification: >
        من قولهم «الحرب سِجَال» أي الغلبة فيها تتناوب بين الطرفين؛
        نُقل مجازاً إلى المنافسة التي لا ينتصر فيها طرف على آخر.
    - lemma: "كِفَاء"
      generation_method: ishtiqaq
      justification: >
        من الجذر ك-ف-أ بمعنى المماثلة والمساواة؛ يُقال «لا كِفاء له» أي لا مماثل.
        على وزن فِعَال كمصدر أو اسم يدل على التكافؤ بين المتنافسين.
    - lemma: "مُنَاصَفَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ن-ص-ف على وزن مُفَاعَلَة؛ يدل على اقتسام الشيء بالتساوي بين طرفين،
        فيُستعمل مجازاً لتساوي النتيجة حين يأخذ كل فريق نصف الفوز.

stage2_evidence:
  per_lemma:
    - lemma: "تَعَادُل"
      confirm:
        - text: "«التعادل: التساوي بين الشيئين، ومنه قسمة التعديل وهي قسمة الشيء باعتبار القيمة والمنفعة لا باعتبار العدل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«تَعَادُل — equivalence» (مجال الهندسة الكهربائية)"
          source: "مسرد الهندسة الكهربائية، أليكسو (ArabTerm)"
          addition: "يُستخدم التعادل أيضاً في المنطق والهندسة بمعنى التكافؤ المنطقي"
        - text: "«تعادل — temperament» (مجال الفن والتسلية والرياضة)"
          source: "مسرد الفن والتسلية والرياضة، أليكسو (ArabTerm)"
          addition: "ورود المصطلح في مجال الرياضة يؤكد استعماله في السياق الرياضي وإن كانت الترجمة الإنجليزية غير دقيقة"
    - lemma: "سِجَال"
      contradicts:
        - text: "«الحرب سِجال، أي مُبَارَاة مَرَّةً كذا ومَرَّةً كذا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "السِّجال يدل على التناوب والمداولة لا على التساوي في النتيجة؛ فالحرب سجال تعني أن الغلبة تتناوب لا أنها متعادلة"
        - text: "«سِجَال — نقاش ومناظرة حول موضوع جِدالي، يحاول فيه طرف إفحام الطرف الآخر»"
          source: "المعجم الموحد لمصطلحات اللسانيات (ArabTerm)"
          conflict: "المعنى الاصطلاحي الحديث هو المناظرة والجدال لا تساوي النتيجة"
      expands:
        - text: "«ساجله مساجلة: إذا باراه وفاخره بأن صنع مثل صَنْعِه؛ ومن ثم يصح استخدام سجال مصدراً؛ لأن فِعَال يطرد مصدراً لـ فَاعَل. ويجوز أن تكون سجال جمع سَجْل وهو الدلو الملأى، ويكون الكلام على المجاز كما قالوا: الحرب سجال»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يؤكد أن السجال يدل على المباراة والتنافس لا على تساوي النتائج تحديداً"
    - lemma: "كِفَاء"
      expands:
        - text: "«لا كِفاء له: لا مماثل. سُتْرَة تلقى على الخباء حتى تبلغ الأرض كإزارٍ له. (ج) أَكْفِيَة»"
          source: "المعجم الوسيط"
          addition: "الكِفاء يدل على المماثلة العامة لا على تساوي النتيجة في مسابقة تحديداً"
        - text: "«كِفَاء — من (ك ف أ) المماثل، والقادر على تصريف العمل»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُستعمل اسماً للأشخاص لا مصطلحاً رياضياً"
    - lemma: "مُنَاصَفَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَعَادُل"
      decision: confirmed
      decision_reason: >
        اللمّة مدعومة بدليل معجمي صريح من المناوي يعرّف التعادل بالتساوي بين الشيئين،
        وهي الأكثر شيوعاً واستعمالاً في السياق الرياضي العربي المعاصر.
        الجذر ع-د-ل من أصول الاستواء عند ابن فارس، ووزن تَفَاعُل يناسب المشاركة بين طرفين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الرياضي الأول والأشيع للدلالة على تساوي النقاط في نهاية المباراة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَادُل"

    - lemma: "سِجَال"
      source: stage1
      decision: removed
      decision_reason: >
        السِّجال يدل على المداولة والتناوب في الغلبة لا على تساوي النتيجة النهائية.
        «الحرب سجال» تعني أن الكرّ والفرّ يتناوبان، وقد ينتهي بغلبة طرف.
        المعنى الاصطلاحي الحديث انصرف إلى المناظرة والجدال. لا يصلح مرادفاً دقيقاً للتعادل.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "كِفَاء"
      source: stage1
      decision: removed
      decision_reason: >
        الكِفاء يدل على المماثلة والمساواة بوجه عام، وهو أقرب إلى المعنى العلوي (التكافؤ/المساواة)
        منه إلى المعنى المخصوص بتساوي النقاط في مسابقة. ليس مصطلحاً رياضياً مستعملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُنَاصَفَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي على استعمال «مناصفة» بمعنى تساوي النتيجة في مسابقة.
        المناصفة تدل على اقتسام شيء بالنصف، وهي أقرب إلى المشاركة المادية منها إلى تساوي النقاط.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "تساوي النتيجة في مسابقة"
    assessment:
      decision: retain
      reason: >
        التعريف موجز ودقيق ويتضمن الجنس القريب (تساوي النتيجة) والفصل النوعي (في مسابقة).
        يتوافق مع تعريف المناوي «التساوي بين الشيئين» مع تخصيصه بسياق المسابقة.
        لا حاجة إلى تعديل.
  examples:
    per_lemma:
      - lemma: "تَعَادُل"
        examples:
          - text: "انتهت المباراة بالتَّعَادُل بهدفين لكل فريق، ممّا أبقى الفريقين في صدارة المجموعة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "انتهت المباراة بالتَّعَادُل بهدفين لكل فريق، ممّا أبقى الفريقين في صدارة المجموعة."

