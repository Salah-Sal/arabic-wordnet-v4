# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-11239111-n
# ili       : i96480
# pos       : n
# المراجع   : روبرت أوين — مصلح اجتماعي ويلزي (1771-1858)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. التوليد العمياء — قُرئ synset_info_masked.yaml أولاً
  # التعريف: صناعي ومصلح اجتماعي ويلزي أسس مجتمعات تعاونية (1771-1858)
  # هذا علَم شخصي غربي من القرن 18-19، فمسار التوليد هو التعريب أولاً ثم التركيب.
  blind_candidates:
    - lemma: "أُوِين"
      generation_method: taarib
      justification: >
        تعريب للقب العائلة الويلزي-الإنجليزي "Owen"، يُنطق [ˈoʊɪn].
        الصيغة الأكثر شيوعاً في المراجع العربية للإشارة المختصرة إلى هذا العلَم.
    - lemma: "رُوبِرت أُوِين"
      generation_method: tarkib
      justification: >
        مركب إضافي (اسم + لقب) يمثّل الاسم الكامل "Robert Owen".
        ضرورة في السياقات الرسمية والأكاديمية التي تتطلب التمييز عن أشخاص
        آخرين يحملون نفس اللقب.
    - lemma: "أُوَن"
      generation_method: taarib
      justification: >
        نسخة بديلة في التعريب تعكس النطق الويلزي الأصلي "Owain/Owen"
        بفتح الواو بدلاً من كسرها، وهي واردة في بعض المصادر العربية القديمة.
    - lemma: "رُوبِيرت أُوِين"
      generation_method: taarib
      justification: >
        صيغة تعريب بديلة للاسم "Robert" تعكس النطق البريطاني بمدّ الياء
        [ˈrɒb.ɪt]، وردت في بعض المعجمات والموسوعات العربية المترجمة.

  # ب. التقييم الأولي — بعد الاطّلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة «أوين» خالية من التشكيل الكامل، مما يُفضي إلى التباس في النطق."
      - "اللمّة «روبرت أوين» خالية من التشكيل الكامل."
      - >
        الوصف في التعريف «اقتصادي» في مرجع المعجم الموحد للاقتصاد مختلف قليلاً
        عن «صناعي» في AWN4؛ كلاهما صحيح لكن «صناعي» أدق تاريخياً
        إذ يعكس دوره كصاحب مصانع نسيج في نيو لاناراك.
      - >
        غياب أي إشارة إلى دوره الريادي في نشأة الحركة الاشتراكية والتعاونية
        الأوروبية، مما يُضيّق دلالة التعريف.
    observations: >
      هذه مجموعة ترادفية لعلَم شخصي (proper noun): روبرت أوين، صناعي
      ومصلح اجتماعي ويلزي الأصل (1771-1858). تشتمل على لمّتَين تمثّلان
      تعريب الاسم العلَم بصيغتَيه المختصرة (أوين) والكاملة (روبرت أوين).
      كلتا اللمّتَين صحيحتان دلالياً وورودهما في المعجمية العربية مؤكَّد
      (أوينية = Owenism في المعجم الموحد للاقتصاد؛ خطوط أُوِين في
      المعجم الطبي الموحد). لا جذر عربي لأيٍّ منهما كونهما تعريب خالص
      لاسم علَم. المجموعة غريبة ثقافياً (omission) لأنها علَم لشخصية
      غربية لا مقابل لها في التراث العربي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # الاستعلامات المُنفَّذة:
  # ١. بحث headword_norm عن أوين وروبرت أوين (نتيجة: لا مداخل مستقلة مطابقة)
  # ٢. جسر إنجليزي translation_en: "Owen" OR "Robert Owen"
  # ٣. بحث FTS عربي: تعاوني + مصلح اجتماعي + اصلاح اجتماعي
  # ٤. بحث واسع headword_bare LIKE '%اوين%' (أوين طبياً واقتصادياً)

  per_lemma:

    - lemma: "أُوِين"
      confirm:
        - text: >
            «أوينية: مذهب (أوين) وهو اقتصادي انجليزي يعود إلى القرن 19»
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)، مادة: أوينية"
        - text: >
            «خُطوطُ التَّطَبُّقِ لأُوِيْن [أسنان] — incremental lines of Owen»
          source: "المعجم الطبي الموحد (2009)، مادة: خطوط التطبق لأُوِيْن"
        - text: >
            «كِفافُ خُيوطِ أوين — contour lines of Owen»
          source: "المعجم الطبي الموحد (2009)، مادة: كفاف خيوط أوين"
        - text: >
            «خُطوطُ أُوين (¬ خُطُوْطُ الكِفَاف) — lines of Owen (®contour lines)»
          source: "المعجم الطبي الموحد (2009)، مادة: خطوط أُوين"

    - lemma: "رُوبِرت أُوِين"
      evidence_status: "no_material_found"
      # لم يُعثر على مدخل مستقل بالاسم الكامل "روبرت أوين" في قاعدة البيانات؛
      # الاسم المركّب لا يُسجَّل عادةً في معجمات المصطلحات، بل يُكتفى بالمُشتق (أوينية).

    - lemma: "أُوَن"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "رُوبِيرت أُوِين"
      source: stage1
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة الأولى: أوين ──
    - lemma: "أوين"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة: الاسم العلَم "Owen" موثَّق في المعجمية العربية
        المعاصرة بصيغة "أوين" (أوينية = Owenism، خطوط أُوِين في طب الأسنان).
        هي الصيغة المختصرة المعتمدة للإشارة إلى صاحب اللقب.
        تحتاج إلى تشكيل كامل: أُوِين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check: >
        الكلمة تعريب خالص، لا جذر عربي لها. قابلة للتعريف بال-
        (الأوينية) والنسبة (أويني) والجمع السالم (الأوينيون).
        الوزن الصرفي: فُعِيل (u-i-n)، مناسب للأعلام الأعجمية.
      nuance_differentiation: >
        الاسم الأخير (اللقب) منفرداً: يُستخدم في سياقات الإشارة المختصرة
        غير الرسمية أو في التضمينات الاشتقاقية (أوينية، الأوينيون)،
        بينما الاسم الكامل يُفضَّل في السياقات الأكاديمية والرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُوِين"

    # ── اللمّة الموجودة الثانية: روبرت أوين ──
    - lemma: "روبرت أوين"
      decision: confirmed
      decision_reason: >
        الاسم الكامل "Robert Owen" ضروري كلمّة ثانية في المجموعة لضمان
        التعريف الكامل والتمييز عن أشخاص آخرين يحملون لقب "Owen".
        يحتاج إلى تشكيل كامل: رُوبِرت أُوِين.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      mwe_validation: >
        مركّب إضافي من اسمَيْن علَمَيْن (اسم الشخص + لقبه).
        اختبار السكّ: التعبير ثابت معجمياً، لا يُبدَّل أحد مكوّنيه.
        اختبار التثبيت المعجمي: الاسم الكامل وحدة معجمية راسخة.
      nuance_differentiation: >
        الاسم الكامل المزدوج (الاسم + اللقب): يُستخدم في السياق الرسمي
        والأكاديمي والتاريخي، ويُميَّز به الشخص تمييزاً تاماً عن غيره.
        على عكس الصيغة المختصرة (أُوِين) التي قد تُحيل إلى شخصيات أخرى.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُوبِرت أُوِين"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "أُوَن"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية عربية تدعم هذا الرسم للاسم العلَم.
        الصيغة المعتمدة في المعاجم العربية هي أُوِين وليس أُوَن.
        إزالتها تحسّن الاتساق المصطلحي.

    - lemma: "رُوبِيرت أُوِين"
      source: stage1
      decision: removed
      decision_reason: >
        الرسم رُوبِرت (بدون مدّ الياء) هو المعتمد في المعاجم العربية
        (المورد الحديث، وسائل الإعلام العربية). رُوبِيرت مع مدّ الياء
        تقريب أقل شيوعاً لا داعي لإضافته.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:

  definition:
    current: "صناعي ومصلح اجتماعي ويلزي أسس مجتمعات تعاونية (1771-1858)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في جوهره لكن يمكن تحسينه من حيث:
        ١) تقديم الجنسية قبل الوصف الوظيفي للاتساق مع أسلوب المعجم الوسيط
           في تعريف الأعلام.
        ٢) إضافة إشارة إلى دوره الريادي في الفكر الاشتراكي التعاوني
           لتمييزه عمّن أسّسوا مجتمعات تعاونية دون بلوغ هذه الأهمية.
        ٣) إدراج اسمه الكامل في مستهلّ التعريف وفق أسلوب تعريف الأعلام.
    authored:
      - type: encyclopedic
        text: >
          رُوبِرت أُوِين (1771-1858): صِنَاعِيٌّ وَمُصْلِحٌ اجتِمَاعِيٌّ وِيلزِيُّ
          الأَصل، يُعَدُّ مِن رُوَّادِ الفِكرِ الاشتِرَاكِيِّ التَّعَاوُنِيِّ في
          بريطانيا؛ أَسَّسَ مُجتَمَعَاتٍ تَعَاوُنِيَّةً تَقُومُ عَلَى مَبدَأ
          المِلكِيَّةِ المُشتَرَكَةِ وَالعَمَلِ الجَمَاعِيِّ، وَكَانَ مِن أَوَائِلِ
          المُطَالِبِينَ بحُقُوقِ العُمَّالِ وَتَعلِيمِ الأَطفَالِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            رُوبِرت أُوِين (1771-1858): صِنَاعِيٌّ وَمُصْلِحٌ اجتِمَاعِيٌّ
            وِيلزِيُّ الأَصل، يُعَدُّ مِن رُوَّادِ الفِكرِ الاشتِرَاكِيِّ
            التَّعَاوُنِيِّ في بريطانيا؛ أَسَّسَ مُجتَمَعَاتٍ تَعَاوُنِيَّةً
            تَقُومُ عَلَى مَبدَأ المِلكِيَّةِ المُشتَرَكَةِ وَالعَمَلِ
            الجَمَاعِيِّ، وَكَانَ مِن أَوَائِلِ المُطَالِبِينَ بحُقُوقِ
            العُمَّالِ وَتَعلِيمِ الأَطفَالِ.

  examples:
    per_lemma:
      - lemma: "أُوِين"
        examples:
          - text: >
              تُمثِّلُ الأوينيَّةُ أحدَ التيَّارات الرائدة في الفكر الاشتراكي
              الأوروبي خلال القرن التاسع عشر، إذ دعا أُوِين إلى إنشاء مجتمعات
              عمالية تعاونية مكتفية بذاتها.
            type: usage
      - lemma: "رُوبِرت أُوِين"
        examples:
          - text: >
              أَسَّسَ رُوبِرت أُوِين في عام 1825م مُستعمَرةَ «نيو هارموني»
              بالولايات المتحدة الأمريكية، تجسيداً لمبادئه في الإصلاح
              الاجتماعي والحياة التعاونية.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            تُمثِّلُ الأوينيَّةُ أحدَ التيَّارات الرائدة في الفكر الاشتراكي
            الأوروبي خلال القرن التاسع عشر، إذ دعا أُوِين إلى إنشاء مجتمعات
            عمالية تعاونية مكتفية بذاتها.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            أَسَّسَ رُوبِرت أُوِين في عام 1825م مُستعمَرةَ «نيو هارموني»
            بالولايات المتحدة الأمريكية، تجسيداً لمبادئه في الإصلاح
            الاجتماعي والحياة التعاونية.


