# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «محرك الدمى» مفتقرة إلى التشكيل الكامل"
      - "التعريف العربي يستخدم «الماريونيت» وهو مصطلح دخيل غير معرَّب، والأَولى تعريبه بـ«دُمى الخيوط» أو وصفه بأسلوب عربي"
      - "المجموعة تضم لمّة واحدة فقط، مما يُضيِّق التغطية المصطلحية لمفهوم ذي تاريخ في التراث العربي"
      - "التعريف الحالي قريب من الترجمة الحرفية «شخص يحرك» دون إثراء دلالي أو أسلوبي"
    observations: >
      المجموعة تصف شخصاً متخصصاً في فن الدمى (puppeteer)، وهو فن أدائي تمثيلي
      له جذور عميقة في التراث العربي عبر «خيال الظل» الذي ازدهر في مصر والشام.
      اللمّة الحالية «محرك الدمى» تركيب إضافي حديث يصف الوظيفة الميكانيكية،
      غير أن التراث العربي عرف هذا الفن بمصطلح «خيال الظل» للعرض وللممارس معاً.
      التعريف يحتاج تنقيةً لغويةً واستبدال الدخيل «الماريونيت» بمقابل عربي.
      من الأجدر تعدد اللمّات لتغطية الجوانب الميكانيكية والفنية لهذا الدور.

  blind_candidates:
    - lemma: "الخَيَّال"
      generation_method: majaz
      justification: >
        إحياء لفظ ميت: ارتبط لفظ «الخيّال» في التراث العربي بفن «خيال الظل»،
        وكان منفِّذ هذا الفن يُعرف بالخيَّال. الإزاحة الدلالية من أصل اللفظ
        (الصورة والظل) إلى منفِّذ هذا الفن تمثّل مجازاً وظيفياً يحيي
        لفظاً ميتاً بدلاً من الاصطدام بالمعنى الغالب (الخيال = imagination).
    - lemma: "مُلَعِّبُ الدُّمى"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُلَعِّب» على وزن فَعَّل للدلالة على التسبب في اللعب
        والتحريك الفني + الدمى. يُبرز الطابع الأدائي أكثر من «محرك» الذي قد
        يوحي بالتحريك الآلي. والفعل لَعَّبَ يدل على جعل الشيء يؤدي ويتحرك
        بإتقان، مما يلائم طبيعة هذا الفن.
    - lemma: "عَارِضُ الدُّمى"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «عارض» (اسم فاعل من عرَضَ) + الدمى. يُبرز الجانب
        التقديمي والجمهوري لهذه المهنة؛ محرّك الدمى يُقدِّم عرضاً أمام جمهور،
        فاسم الفاعل «عارض» يلتقط هذا البُعد الأدائي-التواصلي.
    - lemma: "فَنَّانُ الدُّمى"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «فنان» + «الدمى». يضع الممارس في سياق الفنون الأدائية
        وهو ما يتوافق مع المجموعة العليا «فنان استعراضي». وزن فَعَّال يدل على
        الاحتراف والإتقان، مما يُعبِّر عن طبيعة هذه المهنة المتخصصة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دفعية: محرك الدمى + مرشحات المرحلة ١ + دمية + خيال
#   ٢. جسر إنجليزي: puppeteer + puppet + marionette + puppet show
#   ٣. FTS عربي: دمى + دمية + خيال الظل + عرائس + ماريونيت
#   ٤. تحقق من مرشحات: ملعب + عارض الدمى + خيال الظل + عرائسي
#   ٥. مقاييس اللغة: جذور حرك + لعب
stage2_evidence:
  per_lemma:
    - lemma: "محرك الدمى"
      confirm:
        - text: "«مُحرِّك الدُّمَى أو مُلَعِّبها.» [مقابل: puppeteer]"
          source: "المورد الحديث (2008)، مصدر arabterm"
      expands:
        - text: "«خيال الظل: فنٌّ تمثيلىّ يُشبه مسرحَ العرائس، وفيه تتحركُ مجموعةٌ من الدُّمَى من جانبٍ مُضَاءٍ، وخلف سِتارة بيضاء، أمَّا جانب الجمهور فيكون مُظلِمًا حتى يَستطيعَ المُشاهدون رُؤيةَ الخيال على السِّتارةِ، وفى أثناءِ تحريكِ الدُّمَى يدورُ حوار نَثرِىّ أو شعرِىّ يقدّم حكايةً إنسانِيَّةً بسيطة»"
          source: "المعجم الكبير، مصدر ocr"
          addition: "يُثبت أن تحريك الدمى فن تمثيلي معروف في التراث العربي، ويُبيّن السياق الثقافي الذي يمارس فيه محرك الدمى عمله"

    - lemma: "الخَيَّال"
      expands:
        - text: "«الخيال: أصله القوة المجردة كالصورة المتصورة في المنام وفي المرآة وفي القلب، ثم استُعمل في صورة كل أمر متصور، وفي كل شخص دقيق يجري مجرى الخيال. والخيال كل شيء تراه كالظل.»"
          source: "التوقيف على مهمات التعاريف للمناوي، مصدر hawramani"
          addition: "يثبت أن «الخيال» يُطلق على كل شيء يُرى كالظل، مما يوضح العلاقة الدلالية التأصيلية مع فن خيال الظل، لكنه لا يُثبت الخيّال بمعنى مُحرِّك الدمى"
        - text: "«خيال الظل» [مقابل: fantoccimi]"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم، مصدر arabterm"
          addition: "يثبت وجود مصطلح «خيال الظل» للدلالة على فن الدمى (fantoccimi)، لا على شخص مُحرِّك الدمى"
      contradicts:
        - text: "«الخيال: قوة مرتبة في مؤخر التجويف الأول من الدماغ تحفظ جميع صور المحسوسات وتمثّلها بعد الغيبوبة...»"
          source: "دستور العلماء للأحمدنكري، مصدر hawramani"
          conflict: "المعنى الغالب في المعاجم لـ«الخيال» هو القوة الإدراكية والصورة الذهنية، لا الشخص المُحرِّك للدمى. تعدد المعاجم على هذا المعنى يُضعف صلاحية «الخيّال» مصطلحاً لمحرك الدمى دون إضافة قيد."

    - lemma: "مُلَعِّبُ الدُّمى"
      confirm:
        - text: "«مُحرِّك الدُّمَى أو مُلَعِّبها.» [مقابل: puppeteer]"
          source: "المورد الحديث (2008)، مصدر arabterm"
      contradicts:
        - text: "«مُلَعِّب: مُسِيل اللُّعاب.» [مقابل: sialalogue]"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)، مصدر arabterm"
          conflict: "«مُلَعِّب» كمفرد مُعجَّم يُستخدم في الصيدلة بمعنى «مُسِيل اللُّعاب»، وهو تعارض مع الاستخدام المنشود. غير أن المركب «مُلَعِّبُ الدُّمى» يُزيل هذا اللبس بالتقييد الدلالي."

    - lemma: "عَارِضُ الدُّمى"
      expands:
        - text: "«(1) عرض الدُّمى المتحركة (2) دُمًى متحركة.» [مقابل: fantoccini]"
          source: "المورد الحديث (2008)، مصدر arabterm"
          addition: "يُثبت أن «عرض الدمى» مصطلح مستعمل للدلالة على العرض أو الدمى ذاتها، لا على الشخص المُحرِّك. يُشير إلى الحقل الدلالي الصحيح لكنه لا يُثبت «عارض الدمى» مصطلحاً للمهنة."

    - lemma: "فَنَّانُ الدُّمى"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "محرك الدمى"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة بدليل مباشر من المورد الحديث (2008) الذي يُترجم «puppeteer»
        بـ«مُحرِّك الدُّمى أو مُلَعِّبها». التركيب الإضافي صحيح لغوياً ومتداول
        في السياقات الثقافية والإعلامية العربية الحديثة. تحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز البُعد التقني والميكانيكي في عمل محرّك الدمى؛ الفعل «حرَّكَ» يدل
        على الإعمال المادي المباشر للدمية وتسييرها، مما يُناسب السياقات التقنية
        والتعليمية التي تصف الآلية والأسلوب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَرِّكُ الدُّمى"

    - lemma: "الخَيَّال"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُثبت المعاجم «الخيّال» مصطلحاً مستقلاً لمحرِّك الدمى؛ فجميع
        المداخل المعجمية للفظ «الخيال» تدور حول القوة الإدراكية والصورة الذهنية
        والظل. وإن كان «خيال الظل» يدل على فن تحريك الدمى، فهو تركيب مقيَّد
        يصف الفن لا المحترف. والاستعمال بمفرده «الخيّال» محملٌ بالإشراك اللفظي
        مع المعنى المهيمن (imagination)، مما يُفضي إلى لبس دلالي غير مقبول.

    - lemma: "مُلَعِّبُ الدُّمى"
      source: stage1
      decision: confirmed
      decision_reason: >
        المورد الحديث (2008) يُثبت «مُلَعِّبها» بديلاً مُعجَّماً لـ«مُحرِّك الدُّمى»
        في سياق «puppeteer». التركيب «مُلَعِّبُ الدُّمى» على وزن فَعَّل (للتسبب والتحريك
        الفني) تركيب إضافي ثابت. التعارض مع الاستخدام الصيدلاني لـ«مُلَعِّب» مُنتفٍ
        في المركب لأن التقييد بـ«الدمى» يُزيل اللبس كلياً. اجتاز اختبار السكّ:
        لا يمكن إبدال «الدمى» بمرادف وصفي مع بقاء المعنى التخصصي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز البُعد الفني والأدائي في عمل محرّك الدمى؛ الفعل «لعَّبَ» يدل على
        جعل الدمية تلعب وتؤدي بإتقان وحيوية، مما يُناسب السياقات الأدبية والنقدية
        التي تُركِّز على الجمال الفني وإضفاء الحياة على الدمية.
      actions:
        - command: create_entry
          params:
            lemma: "مُلَعِّبُ الدُّمى"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10513270-n"

    - lemma: "عَارِضُ الدُّمى"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُثبت البحث المعجمي «عارض الدمى» مصطلحاً مُعجَّماً للمهنة؛ الأدلة
        المتاحة تُثبت «عرض الدمى» كعرض أو تجمُّع من الدمى (fantoccini)، لا كمصطلح
        للمحترف. «عرض» في الحقل الدلالي للعروض يستحضر عروض الدمى لا شخص المؤدّي،
        مما يُربك الدلالة. في غياب تثبيت معجمي كافٍ يُرفض هذا الترشيح.

    - lemma: "فَنَّانُ الدُّمى"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي لهذا التعبير. «فنان» لفظ عام لا يُضيف
        تخصيصاً دلالياً كافياً يُميّزه عن سائر الفنانين. كما أن إضافة «الدمى»
        لا تُرسِّخ التعبير كوحدة معجمية ثابتة بل يبدو وصفاً حراً قابلاً للتحليل.
        لم يجتز اختبار التثبيت المعجمي.


