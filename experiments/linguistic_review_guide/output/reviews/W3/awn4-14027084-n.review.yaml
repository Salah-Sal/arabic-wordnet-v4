# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14027084-n (Nash equilibrium)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (توازن ناش)، وهو مصطلح مركّب إضافي يجمع كلمة عربية (توازن) واسم عَلَم أعجمي معرَّب (ناش)"
      - "اللمّة الحالية بلا تشكيل — يجب إضافة التشكيل الكامل"
      - "المفهوم عالي التخصّص (نظرية الألعاب) وقد لا توجد له بدائل عربية خالصة لارتباطه باسم عَلَم"
    observations: "المجموعة تمثّل مفهوماً رياضياً مسمًّى باسم عالِم الرياضيات الأمريكي جون ناش. المصطلح مركب إضافي من نوع (مُضاف عربي + مُضاف إليه مُعرَّب) وهو النمط المعتاد في المصطلحات العلمية المنسوبة لأعلام أجانب. التعريف يبدو ترجمة مقبولة للتعريف الإنجليزي ويلتقط الجوهر الدلالي للمفهوم."

  blind_candidates:
    - lemma: "تَوَازُنٌ اسْتِرَاتِيجِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي يصف الحالة المستقرة التي لا يُجدي فيها تغيير الاستراتيجية، من جذر وزن (التعديل والاستقامة) وصفة منسوبة إلى الاستراتيجية"
    - lemma: "اتِّزَانٌ لُعْبِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي يربط مفهوم الاتزان (مصدر افتعال من وزن) بالسياق اللعبي (نظرية اللعبة)، ومصطلح اتزان مستعمل في الفيزياء والهندسة"
    - lemma: "نُقْطَةُ الِاسْتِقْرَارِ"
      generation_method: tarkib
      justification: "مركب إضافي يركّز على كون الحالة نقطة ثابتة لا يُحسِّن الخروجُ منها وضعَ أي مشارك، من جذر قرر (الثبات والدوام)"
    - lemma: "ثَبَاتٌ تَنَافُسِيٌّ"
      generation_method: ishtiqaq
      justification: "ثبات (مصدر من ثبت) مع صفة تنافسي — يشير إلى حالة الاستقرار في سياق التنافس بين عدة أطراف"


stage2_evidence:
  per_lemma:
    - lemma: "تَوَازُنُ نَاش"
      confirm:
        - text: "«توازن: equilibrium — وهي الحالة التي لا يتحرك فيها الجسم، ويكون في حالة توازن مستقر عندما تزيد أدنى حركة من طاقته الكامنة فيعود إلى مكانه الأصلي»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«توازن: equilibrium — كمية الإنتاج المتوفرة تساوي الكمية المطلوبة. في حالة توازن، لا تميل الأسعار بالسوق لا إلى الارتفاع ولا إلى الانخفاض ولكن تستقر على حالها»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
        - text: "«نقطة توازن: equilibrium point — نقطة تحقق فيها منظومة دينامكية استقراراً أو شبه استقرار»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
      expands:
        - text: "«نظرية اللعبة: فرع من فروع النمذجة الرياضية يهتم بدراسة الصراع والتعاون بين صناع القرار العقلانيين»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "يؤكد وجود مصطلح نظرية اللعبة في الاستعمال المصطلحي العربي، وهو السياق الذي يرد فيه توازن ناش"
        - text: "«نظرية المباراة: نظرية رياضية لعملية اتخاذ القرار بواسطة مجموعة من المشتركين المتنافسين ذوي المصالح المتضادة»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يقدم بديلاً اصطلاحياً لنظرية اللعبة هو نظرية المباراة"

    - lemma: "تَوَازُنٌ اسْتِرَاتِيجِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "اتِّزَانٌ لُعْبِيٌّ"
      expands:
        - text: "«(الاتزان) (في الرياضة والهندسة) يُقال اتزان لا مُستقر وهو اتزان الجسم الذي إذا أزيح قليلاً عن موضعه لم يعد إلى وضعه الأصلي واختل التوازن (مج)»"
          source: "المعجم الوسيط"
          addition: "الاتزان مُستعمل في العلوم الدقيقة لكن لم يُعثر على المركب اتزان لعبي بوصفه وحدة معجمية ثابتة"

    - lemma: "نُقْطَةُ الِاسْتِقْرَارِ"
      evidence_status: "no_material_found"

    - lemma: "ثَبَاتٌ تَنَافُسِيٌّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "تَوَازُنُ نَاش"
      decision: confirmed
      decision_reason: "مصطلح مركب إضافي مستقر في الأدبيات الرياضية والاقتصادية العربية، يجمع بين لفظ عربي فصيح (توازن) واسم عَلَم أعجمي مُعرَّب (ناش). لا بديل عربي خالصاً لهذا المفهوم المنسوب لعالِم بعينه. المكوّن الأول (توازن) موثّق في معاجم مصطلحية متعددة بمعنى equilibrium."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَازُنُ نَاش"

    - lemma: "تَوَازُنٌ اسْتِرَاتِيجِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي لم يُعثر عليه وحدةً معجمية ثابتة في أي معجم. وهو أعمّ من المفهوم المقصود إذ يشمل أي توازن ذي طابع استراتيجي وليس بالضرورة توازن ناش بتعريفه الدقيق."

    - lemma: "اتِّزَانٌ لُعْبِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر عليه مركباً ثابتاً في أي مصدر معجمي. ومع أن الاتزان مرادف مقبول للتوازن في السياق العلمي، فإن المركب اتزان لعبي غير مسكوك ولا يحمل الدلالة التخصيصية لتوازن ناش المرتبط باسم العَلَم."

    - lemma: "نُقْطَةُ الِاسْتِقْرَارِ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على هذا المركب في أي معجم. والمصطلح المُثبَت هو نقطة توازن (equilibrium point) لا نقطة الاستقرار. فضلاً عن أن المفهوم المُراجَع ليس نقطة بل حالة."

    - lemma: "ثَبَاتٌ تَنَافُسِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي غير مسكوك، لا أساس له في المصادر المعجمية أو المصطلحية. ولا يحمل أي إشارة إلى السياق الرياضي المتخصص (نظرية الألعاب)."


stage4_content:
  definition:
    current: "(في نظرية اللعبة) حالة مستقرة لنظام يشمل عدة مشاركين متفاعلين حيث لا يمكن لأي مشارك أن يكسب بتغيير استراتيجيته طالما بقي الآخرون دون تغيير"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقبول في مجمله لكنه يحتاج تحسيناً أسلوبياً: (أ) إضافة الجنس القريب بوضوح (حالة من حالات التوازن)، (ب) تدقيق العبارة 'يكسب بتغيير' إلى صياغة أدق، (ج) ربط المفهوم بجون ناش صراحة"
    authored:
      - type: terminological
        text: "حالةٌ من حالاتِ التَّوازُنِ في نظريَّةِ الألعابِ، لا يستطيعُ فيها أيُّ مُشارِكٍ تحسينَ مكسبِهِ بتبديلِ استراتيجيَّتِهِ منفرداً ما دامَ سائرُ المشاركينَ مُلتزمينَ باستراتيجيَّاتِهِم. نُسِبَ إلى عالِمِ الرِّياضيَّاتِ الأمريكيِّ جون ناش."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالةٌ من حالاتِ التَّوازُنِ في نظريَّةِ الألعابِ، لا يستطيعُ فيها أيُّ مُشارِكٍ تحسينَ مكسبِهِ بتبديلِ استراتيجيَّتِهِ منفرداً ما دامَ سائرُ المشاركينَ مُلتزمينَ باستراتيجيَّاتِهِم. نُسِبَ إلى عالِمِ الرِّياضيَّاتِ الأمريكيِّ جون ناش."

  examples:
    per_lemma:
      - lemma: "تَوَازُنُ نَاش"
        examples:
          - text: "يُعَدُّ تَوَازُنُ نَاش أحدَ الأدواتِ الأساسيَّةِ لتحليلِ الأسواقِ الاحتكاريَّةِ القِلِّيَّةِ، إذ يُمكِنُ التنبُّؤُ بسلوكِ الشَّرِكاتِ المُتنافِسةِ حينَ لا تملِكُ أيٌّ منها حافزاً للانحرافِ عن استراتيجيَّتِها."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ تَوَازُنُ نَاش أحدَ الأدواتِ الأساسيَّةِ لتحليلِ الأسواقِ الاحتكاريَّةِ القِلِّيَّةِ، إذ يُمكِنُ التنبُّؤُ بسلوكِ الشَّرِكاتِ المُتنافِسةِ حينَ لا تملِكُ أيٌّ منها حافزاً للانحرافِ عن استراتيجيَّتِها."


