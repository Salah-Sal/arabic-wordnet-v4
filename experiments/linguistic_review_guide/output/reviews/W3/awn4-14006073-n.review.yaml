# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14006073-n — disunity
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «فرقة» بدون تشكيل مشتركة لفظياً بين فُرْقَة (الافتراق) وفِرْقَة (الطائفة)، ما يوجب ضبطها بالشكل"
      - "التعريف العربي الحالي ترجمة شبه حرفية للإنجليزي، يحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المفهوم المستهدف هو حالة غياب الوحدة الناتجة عن الشقاق والخلاف، وهو مفهوم راسخ في الثقافة العربية الإسلامية. اللمّتان الموجودتان (انقسام، فرقة) تغطيان الدلالة الأساسية، لكن فُرْقَة أدق من فِرْقَة هنا. الجذران ق س م وف ر ق غنيّان بالاشتقاقات الدالة على التجزئة والتمييز."
  blind_candidates:
    - lemma: "تَفَرُّق"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من الجذر ف ر ق، يدل على التبدد وذهاب كل فريق في طريق، وهو أقرب المصادر دلالةً إلى نقص الوحدة"
    - lemma: "شِتَات"
      generation_method: ishtiqaq
      justification: "من الجذر ش ت ت، يدل على التفرق والتبدد، وشتات الأمر يعني الاختلاف فيه واختلال الأحوال، وهو قريب من المعنى المطلوب"
    - lemma: "تَمَزُّق"
      generation_method: majaz
      justification: "مجاز من التمزق المادي إلى التفرق الاجتماعي والسياسي، يقال تمزَّق جمعُهم أي تفرقوا"
    - lemma: "اِفْتِرَاق"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من ف ر ق، يدل على المفارقة والانفصال، والفُرْقَة في المعاجم تُعرَّف بالافتراق"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "انقسام"
      confirm:
        - text: "«خِلاف؛ شِقاق؛ انقسام؛ لاوَحْدة»"
          source: "المورد الحديث (2008) — مادة disunity"
        - text: "«انقسام؛ انفصال. شقاق؛ اختلاف»"
          source: "المورد الحديث (2008) — مادة schism"
      expands:
        - text: "«انقسام = fission»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يُستعمل في السياق القانوني بمعنى الانشطار"
        - text: "«انقسام = division»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          addition: "يُستعمل في العلوم الطبيعية بمعنى الانقسام الخلوي"

    - lemma: "فُرْقَة"
      confirm:
        - text: "«(الفُرْقَة) الافتراق»"
          source: "المعجم الوسيط"
        - text: "«الفُرْقَة: بالضمّ (جدائي)»"
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: "«(الفِرْقَة) الطائفة من الناس يُقال فرقة التمثيل وفرقة الألعاب وفرقة المطافئ»"
          source: "المعجم الوسيط"
          conflict: "بكسر الفاء تعني الطائفة من الناس لا الافتراق، ما يوجب التشكيل الدقيق"

    - lemma: "تَفَرُّق"
      confirm:
        - text: "«(تفرق) الشيءُ تَفَرُّقاً وتَفْراقاً: تَبَدَّد، والرجلان: ذهب كلٌّ منهما في طريق»"
          source: "المعجم الوسيط"
      expands:
        - text: "«تَفَرَّق: لم تُفرِّق معظم المعاجم القديمة والحديثة بين الفعلين افْتَرَقَ وتَفَرَّقَ»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "التفرق والافتراق متقاربان دلالياً في المعاجم"

    - lemma: "شِتَات"
      confirm:
        - text: "«الشَّتَات: الفُرقة والتبدد. يقال: إنّي أخاف عليكم الشتات»"
          source: "المعجم الكبير"
        - text: "«شتات الأمر: الاختلاف فيه, وقيل الفرقة واختلال الأحوال»"
          source: "المعجم الكبير"
        - text: "«(الشتات) التَّفَرُّق وأمر شتات: متشتت»"
          source: "المعجم الوسيط"
      expands:
        - text: "«اللهم إني أعوذ بك من عذاب القبر وشتات الأمر»"
          source: "المعجم الكبير — حديث نبوي"
          addition: "استعمال نبوي يربط الشتات بالفوضى والخلاف"

    - lemma: "تَمَزُّق"
      confirm:
        - text: "«(تمزق) تشقق والقومُ تفرقوا ويقال تمزق جمعُهم»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«تمزُّق = disruption / tear / rupture / rhexis»"
          source: "المعاجم الموحدة (جيولوجيا، أحياء، طب)"
          conflict: "الاستعمال الاصطلاحي المعاصر يغلب عليه المعنى المادي (التشقق والتمزق الفيزيائي)"

    - lemma: "اِفْتِرَاق"
      confirm:
        - text: "«الافتراق: كون الجوهرين في حيزين بحيث يمكن التفاضل بينهما»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الافتراقُ: حُصُول جوهرين في حيزين بحيث يمكن أن يتوسطهما ثالث»"
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "«افتراق = divergence»"
          source: "مسرد الجغرافيا والتاريخ"
          addition: "يُستعمل اصطلاحياً بمعنى التباعد"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِنْقِسَام"
      decision: confirmed
      decision_reason: "مصدر انفعال من الجذر ق س م، دلالته الأساسية على التجزئة والانشطار، ويُستعمل مجازاً للدلالة على الخلاف وغياب الوحدة. مؤيَّد بالمورد الحديث الذي يُترجم disunity بـ«انقسام». يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على فعل الانشطار ونتيجته، ويوحي بانقسام كتلة واحدة إلى فريقين أو أكثر، بخلاف فُرْقَة التي تركز على حالة الافتراق ذاتها"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْقِسَام"

    - lemma: "فُرْقَة"
      decision: confirmed
      decision_reason: "بالضم: الافتراق، كما في المعجم الوسيط ودستور العلماء. يجب ضبطها بالضم تمييزاً لها عن فِرْقَة (الطائفة). اللمّة الأصلية بلا تشكيل فيجب تحديثها."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على حالة الافتراق والتباعد بين الناس، وتوحي بالمفارقة الوجدانية والاجتماعية أكثر من الانشطار المادي الذي يوحي به انقسام"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فُرْقَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَفَرُّق"
      source: stage1
      decision: removed
      decision_reason: "وإن كان مؤيَّداً معجمياً، فدلالته الغالبة على التبدد المادي (ذهاب كلٍّ في طريق) لا على حالة نقص الوحدة الناتجة عن الشقاق. يتداخل دلالياً مع فُرْقَة دون إضافة تمييز واضح."
      evidence_assessment:
        case: confirm_only

    - lemma: "شِتَات"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «شتات الأمر: الاختلاف فيه» في المعجم الكبير، فإن الاستعمال المعاصر الغالب للشتات هو التشتت الجغرافي والمنفى (الشتات الفلسطيني)، ما يُبعده عن دلالة نقص الوحدة الناتج عن الشقاق الداخلي."
      evidence_assessment:
        case: mixed

    - lemma: "تَمَزُّق"
      source: stage1
      decision: removed
      decision_reason: "دلالته الأساسية مادية (التشقق والتمزق الفيزيائي)، واستعماله المجازي للتفرق الاجتماعي ضعيف ومحدود. المعاجم الاصطلاحية تحصره في المعنى الفيزيائي (rupture, tear, disruption)."
      evidence_assessment:
        case: mixed

    - lemma: "اِفْتِرَاق"
      source: stage1
      decision: removed
      decision_reason: "معناه في كتب المصطلح فلسفي-كلامي (كون الجوهرين في حيزين)، وهو أعمّ من المطلوب إذ يدل على مطلق المفارقة لا على نقص الوحدة الناتج عن الشقاق تحديداً. والفُرْقَة تؤدي معناه وزيادة."
      evidence_assessment:
        case: confirm_only

