stage1_review:
  assessment:
    concerns:
      - "التعريف العربي مترجم حرفياً من الإنجليزية (مصفوفة مرتبة) ولا يصاغ بأسلوب المعاجم العربية."
    observations: "مصطلح (طيف) استخدم مجازاً في الفيزياء للتعبير عن spectrum واستقر في المعاجم العلمية الحديثة كالمعجم الموحد للمصطلحات العلمية، وهو مأخوذ من طيف الخيال."
  blind_candidates:
    - lemma: "طَيْف"
      generation_method: majaz
      justification: "مجاز من الطيف (الخيال) لانعكاس صورة الموجات أو الألوان، واستقر كمصطلح علمي."
    - lemma: "مَصْفُوفَة اِنْبِعَاث"
      generation_method: tarkib
      justification: "ترجمة وصفية لمكونات الانبعاث وترتيبها."
    - lemma: "تَشَكُّل مَوْجِيّ"
      generation_method: tarkib
      justification: "لوصف الشكل الذي تتخذه الموجات المترتبة."
    - lemma: "تَوْزِيع مَوْجِيّ"
      generation_method: tarkib
      justification: "لأن المفهوم يعبر عن توزيع الموجات بحسب أطوالها."

stage2_evidence:
  per_lemma:
    - lemma: "طيف"
      confirm:
        - text: "«سلسلة للطاقة مرتبة حسب الطول الموجي (أو التردد) في الضوء، الطيف عبارة عن سلسلة أخيلة تنتج عندما تخضع حزمة ضوئية للتبدد على ألوان تعبِّر عن أطوال موجية مختلفة»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
        - text: "«ألوان الطيف (في الفيزياء): ألوانٌ سبعةٌ أساسيَّةٌ يَتَحَلَّلُ إليها الضوءُ المرئِيُّ الأبيضُ»"
          source: "المعجم الكبير"
    - lemma: "طَيْف"
      confirm:
        - text: "«سلسلة للطاقة مرتبة حسب الطول الموجي (أو التردد) في الضوء، الطيف عبارة عن سلسلة أخيلة تنتج عندما تخضع حزمة ضوئية للتبدد على ألوان تعبِّر عن أطوال موجية مختلفة»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
        - text: "«ألوان الطيف (في الفيزياء): ألوانٌ سبعةٌ أساسيَّةٌ يَتَحَلَّلُ إليها الضوءُ المرئِيُّ الأبيضُ»"
          source: "المعجم الكبير"
    - lemma: "مَصْفُوفَة اِنْبِعَاث"
      evidence_status: "no_material_found"
    - lemma: "تَشَكُّل مَوْجِيّ"
      evidence_status: "no_material_found"
    - lemma: "تَوْزِيع مَوْجِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "طيف"
      decision: confirmed
      decision_reason: "مصطلح علمي مستقر ومجمع عليه في المعاجم المتخصصة لترجمة spectrum، وهو مجاز عربي فصيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance: "المصطلح العلمي الشامل المعتمد للمفهوم الفيزيائي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَيْف"
    - lemma: "طَيْف"
      source: stage1
      decision: removed
      decision_reason: "مكرر مع اللمة الموجودة مسبقاً في المجموعة التي تم تأكيدها وتشكيلها."
    - lemma: "مَصْفُوفَة اِنْبِعَاث"
      source: stage1
      decision: removed
      decision_reason: "ترجمة وصفية حرفية وليست مصطلحاً معجمياً مستقراً للمفهوم الشامل للطيف."
    - lemma: "تَشَكُّل مَوْجِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي عام لا يمثل المصطلح العلمي الدقيق للمفهوم."
    - lemma: "تَوْزِيع مَوْجِيّ"
      source: stage1
      decision: removed
      decision_reason: "يصف العملية (التوزيع) أكثر من النتيجة الثابتة التي يعبر عنها الطيف."

stage4_content:
  definition:
    current: "مصفوفة مرتبة لمكونات انبعاث أو موجة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مترجم حرفياً باستخدام تعبير (مصفوفة مرتبة). الصياغة الأفضل يجب أن تعكس دلالته الفيزيائية بأسلوب المعجم الوسيط كالسلسلة أو التوزيع."
    authored:
      - type: terminological
        text: "سلسلة أو توزيع للطاقة أو للأطوال الموجية الناتجة عن انبعاث كهرومغناطيسي أو صوتي، كالألوان التي يتحلل إليها الضوء المرئي."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "سلسلة أو توزيع للطاقة أو للأطوال الموجية الناتجة عن انبعاث كهرومغناطيسي أو صوتي، كالألوان التي يتحلل إليها الضوء المرئي."

  examples:
    per_lemma:
      - lemma: "طَيْف"
        examples:
          - text: "أظهر التحليل الطيفي للمجرة طيف انبعاث غني بغاز الهيدروجين."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أظهر التحليل الطيفي للمجرة طيف انبعاث غني بغاز الهيدروجين."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أظهر التحليل الطيفي للمجرة طيف انبعاث غني بغاز الهيدروجين."

stage5_enrichment:
  per_entry:
    - lemma: "طَيْف"
      entry_id: "{auto}"
      root: "طوف"
      maqayis_quote: "«الطَّاءُ وَالْوَاوُ وَالْفَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى دَوَرَانِ الشَّيْءِ عَلَى الشَّيْءِ... وَالطَّيْفُ وَالطَّائِفُ: مَا أَطَافَ بِالْإِنْسَانِ مِنَ الْجِنَّانِ.»"
  per_sense:
    - lemma: "طَيْف"
      sense_id: "{auto}"
      nuance: "المصطلح العلمي الشامل المعتمد للمفهوم الفيزيائي."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"طوف","maqayis":"«الطَّاءُ وَالْوَاوُ وَالْفَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى دَوَرَانِ الشَّيْءِ عَلَى الشَّيْءِ... وَالطَّيْفُ وَالطَّائِفُ: مَا أَطَافَ بِالْإِنْسَانِ مِنَ الْجِنَّانِ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح العلمي الشامل المعتمد للمفهوم الفيزيائي.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
