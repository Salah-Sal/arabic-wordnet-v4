# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-11418190-n
# ili       : i97486
# pos       : n  →  proper_noun (see stage3 synset_actions)
# subject   : Sir Christopher Wren — English architect (1632-1723)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تُمثِّل اسمَ علَمٍ لشخصية تاريخية بعينها، لا مفهوماً عاماً — وهذا يستوجب وسم POS بـ proper_noun لا n"
      - "اللمّة «رن» بمفردها تتصادم تصادماً شديداً مع الفعل العربي الأصيل «رَنَّ» (أصدر صوتاً / رنَّ) المُثبَت في كتاب العين ومقاييس اللغة والمعجم الوسيط، مما يُولِّد اشتراكاً لفظياً مُضلِّلاً"
      - "التعريف الحالي ترجمةٌ حرفية للنص الإنجليزي؛ لا يُشير إلى أشهر أعماله (كاتدرائية القديس بولس) ولا إلى السياق التاريخي (الحريق العظيم 1666م)"
    observations: >
      المجموعة مجموعةٌ من نوع الأعلام (proper noun synset) للمهندس المعماري الإنجليزي سير كريستوفر رِن (1632-1723م)،
      الذي أعاد تشكيل أُفق لندن بعد حريقها العظيم. جميع اللمّات المُمكنة لهذه المجموعة هي تعريبٌ صوتي للاسم الأجنبي
      لا اشتقاقٌ عربي؛ إذ لا يَصلح المجاز ولا الاشتقاق ولا التركيب لتوليد اسم علَم. اللمّة الكاملة «السِّير كريستوفر رِن»
      هي الصيغة الأمثل في المصادر الأكاديمية والموسوعية العربية، أما «رن» وحيدةً فتُشكِّل التباساً صرفياً مع الفعل رَنَّ.
  blind_candidates:
    - lemma: "كريستوفر رِن"
      generation_method: taarib
      justification: "ترجمةٌ صوتية للاسم «Christopher Wren» دون اللقب الفخري، شائعة في الكتابة العربية الأكاديمية والتعليمية"
    - lemma: "السِّير كريستوفر رِن"
      generation_method: taarib
      justification: "الصيغة الرسمية الكاملة مع اللقب الفخري «السير» (تعريب Sir)، وهي الأشيع في المراجع الموسوعية العربية كموسوعة الأعلام"
    - lemma: "كريستوفر وِرِن"
      generation_method: taarib
      justification: "تعريب بديل يُراعي حرف w الإنجليزي بواو مستقلة في المستهل، إلا أنه أقل استقراراً في المصادر العربية"
    - lemma: "رِن"
      generation_method: taarib
      justification: "تعريب صوتي مختصر للكنية Wren بكسر الراء محاولةً لتمييزها عن الفعل رَنَّ، لكن التمييز ضعيف في الكتابة العارية"


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────
# استعلامات نُفِّذت:
#  ١. مطابقة دفعية: رن، الرن، السير كريستوفر رن، كريستوفر رن، كريستوفر وين، رين
#  ٢. جسر إنجليزي: Wren, Christopher Wren, Sir Christopher Wren
#  ٣. مقاييس اللغة: جذر رن (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "السير كريستوفر رن"
      evidence_status: "no_material_found"

    - lemma: "رن"
      contradicts:
        - text: "«(رَنَّ) الرَّاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى صَوْتٍ. فَالْإِرْنَانُ: الصَّوْتُ. وَالرَّنَّةُ وَالرَّنِينُ: صَيْحَةُ ذِي الْحُزْنِ. وَيُقَالُ أَرَنَّتِ الْقَوْسُ عِنْدَ إِنْبَاضِ الرَّامِي عَنْهَا»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "«رن» جذرٌ عربي أصيل يدل على الصوت والرنين، فاستعماله اسم علَم للمهندس Wren يُوقع في اشتراك لفظي مُضلِّل"
        - text: "«(رن) رنينا صَوت وَصَاح وَإِلَيْهِ أصغى»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يُثبت «رن» فعلاً لا اسماً ولا علَماً، مما يُضعف صلاحيته لمّةً لاسم علَم أجنبي"
        - text: "«رَنَّ: الرَّنّةُ: الصَّيْحةُ الحَزِينةُ. والرَّنِينُ: الصِّياحُ عند البُكاء. والإِرْنانُ: الصَّوْتُ الشَّدِيد»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          conflict: "الخليل يُرسِّخ «رن» فعلاً صوتياً عربياً، لا يصلح وحده اسماً لشخص أجنبي"

    - lemma: "كريستوفر رِن"
      evidence_status: "no_material_found"

    - lemma: "السِّير كريستوفر رِن"
      evidence_status: "no_material_found"

    - lemma: "كريستوفر وِرِن"
      evidence_status: "no_material_found"

    - lemma: "رِن"
      contradicts:
        - text: "«(رَنَّ) الرَّاءُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى صَوْتٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "حتى بالكسر (رِن) يظل الاشتراك البصري مع مادة (ر-ن) قائماً في الكتابة غير المشكولة، وثمانية مداخل معجمية تحمل هذه الصورة"


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "السير كريستوفر رن"
      decision: confirmed
      decision_reason: >
        الصيغة الرسمية المستقرة لاسم سير كريستوفر رِن في المصادر الموسوعية العربية؛ تجمع اللقب الفخري «السير»
        (تعريب Sir) مع الاسم الكامل وتخلو من الالتباس اللفظي الذي تُحدثه «رن» وحيدةً.
        اختبار الاستبدال: لا يُمكن إبدال أي مكوِّن بمرادف آخر مع الإبقاء على الدلالة، فهي وحدة معجمية ثابتة.
        التشكيل ناقص — يستوجب update_lemma.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الصيغة الرسمية الكاملة باللقب الفخري «السير»، تُستعمل في الكتابة الأكاديمية والموسوعية والمراسلات الرسمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "السِّير كريستوفر رِن"

    - lemma: "رن"
      decision: removed
      decision_reason: >
        «رن» متصادمٌ تصادماً تاماً مع الفعل العربي الأصيل «رَنَّ» (دلَّ على صوت / رَنَّتِ القوس) المُثبَت في ثلاثة
        معاجم رئيسية (العين، مقاييس اللغة، الوسيط)؛ فتشكيل الاشتراك شديد لاسيما في الكتابة غير المشكولة.
        فحص الاقتراض: «رن» كتعريب للكنية Wren مقبول نظرياً لكنه يفتقر إلى التثبيت المعجمي ويُسبِّب التباساً
        لا مبرر له حين تتوفر الصيغة الكاملة «السِّير كريستوفر رِن» بديلاً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كريستوفر رِن"
      source: stage1
      decision: confirmed
      decision_reason: >
        صيغة مختصرة شائعة الاستخدام في الكتابة العربية للإشارة إلى الشخصية دون اللقب الفخري؛ تُفيد في السياقات
        الأدبية والتعليمية وغير الرسمية. اختبار السكّ: التعبير مُثبَّت معجمياً في نمط «اسم + كنية» الشائع للأعلام.
        خالٍ من الاشتراك اللفظي على عكس «رن» وحيدةً. يُكمِّل «السِّير كريستوفر رِن» ولا يُكرِّره.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الصيغة المختصرة بحذف اللقب الفخري، تُستعمل في السياقات غير الرسمية والتعليمية والأدبية"
      actions:
        - command: create_entry
          params:
            lemma: "كريستوفر رِن"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "السِّير كريستوفر رِن"
      source: stage1
      decision: removed
      decision_reason: "مُكرِّرةٌ للمّة الموجودة «السير كريستوفر رن» بعد تصحيح تشكيلها — لا حاجة لإضافة مدخل جديد"
      evidence_assessment:
        case: no_material

    - lemma: "كريستوفر وِرِن"
      source: stage1
      decision: removed
      decision_reason: "تهجئة غير معيارية لا تتفق مع الاستخدام الراسخ في المصادر الموسوعية العربية التي تُثبِّت «كريستوفر رن» لا «وِرِن»"
      evidence_assessment:
        case: no_material

    - lemma: "رِن"
      source: stage1
      decision: removed
      decision_reason: "الكسر وحده لا يكفي لإزالة الالتباس البصري في الكتابة غير المشكولة، واللمّة أحادية المقطع تفتقر إلى الكثافة الشكلية اللازمة لاسم علَم مُميَّز"
      evidence_assessment:
        case: contradicts_only

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: proper_noun


