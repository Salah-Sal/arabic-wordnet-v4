stage1_review:
  assessment:
    concerns: []
    observations: "المصطلحات الموجودة في المجموعة ممتازة، ومصطلح 'إرقاء' هو المصطلح الطبي الدقيق والمعتمد لعملية انقطاع أو إيقاف النزف (hemostasis)."
  blind_candidates:
    - lemma: "إِرْقَاء"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (رقأ)، يُقال رَقَأَ الدَّمُ أي انقطع، فالإرقاء هو إيقاف الدم."
    - lemma: "قَطْعُ النَّزْفِ"
      generation_method: tarkib
      justification: "تعبير مركّب إضافي يصف الإجراء بدقة ووضوح."
    - lemma: "سَدُّ النَّزْفِ"
      generation_method: tarkib
      justification: "تعبير وصفي بديل يشير إلى إغلاق مسار النزيف."
    - lemma: "حَبْسُ الدَّمِ"
      generation_method: tarkib
      justification: "تعبير دارج ووصفي لمنع تدفق الدم."

stage2_evidence:
  per_lemma:
    - lemma: "إِرْقَاء"
      confirm:
        - text: "إِرْقاء (hemostasis)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "الإرقاء: وقْف النزف الدموي. (hemostasis)"
          source: "المورد الحديث (2008)"
    - lemma: "قَطْعُ النَّزْفِ"
      expands:
        - text: "أ- وقف النزف بوسائل فسيولوجية (انقباض الأوعية الدموية وتجلط الدم) أو جراحية."
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "يثبت استخدام تركيب (وقف النزف) أو (قطع النزف) كمرادف لمفهوم الإرقاء الطبي."
    - lemma: "سَدُّ النَّزْفِ"
      evidence_status: "no_material_found"
    - lemma: "حَبْسُ الدَّمِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "إرقاء"
      decision: confirmed
      decision_reason: "المصطلح الطبي المتخصص والدقيق، مدعوم بأدلة قوية من المعاجم الطبية الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِرْقَاء"

    - lemma: "قطع النزف"
      decision: confirmed
      decision_reason: "تعبير طبي وصفي شائع الاستخدام ويعبر عن العملية بوضوح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَطْعُ النَّزْفِ"

    - lemma: "سَدُّ النَّزْفِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير غير اصطلاحي مقارنة بـ(إرقاء) و(قطع النزف)."
      evidence_assessment:
        case: no_material

    - lemma: "حَبْسُ الدَّمِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير عام وغير دقيق طبياً للتعبير عن العملية الجراحية المتخصصة."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "إجراء جراحي لوقف تدفق الدم"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه يفتقر إلى الدقة المعجمية التي توضح طبيعة الإجراء ومكانه."
    authored:
      - type: terminological
        text: "إجراءٌ جِراحيٌّ يُتَّخَذُ لِوَقْفِ نَزْفِ الدَّمِ وتَدَفُّقِهِ مِنَ الأَوْعِيَةِ الدَّمَوِيَّةِ، غَالِباً بِاسْتِخْدَامِ أَدَوَاتٍ جِراحِيَّةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "إجراءٌ جِراحيٌّ يُتَّخَذُ لِوَقْفِ نَزْفِ الدَّمِ وتَدَفُّقِهِ مِنَ الأَوْعِيَةِ الدَّمَوِيَّةِ، غَالِباً بِاسْتِخْدَامِ أَدَوَاتٍ جِراحِيَّةٍ."

  examples:
    per_lemma:
      - lemma: "إرقاء"
        examples:
          - text: "قامَ الجَرَّاحُ بِخُطُوَاتِ الإِرْقَاءِ السَّلِيمَةِ لِلسَّيْطَرَةِ عَلَى النَّزْفِ أَثْنَاءَ العَمَلِيَّةِ."
            type: usage
      - lemma: "قطع النزف"
        examples:
          - text: "اسْتَخْدَمَ الطَّبِيبُ المِرْقَأَةَ لِضَمَانِ قَطْعِ النَّزْفِ سَرِيعاً."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "قامَ الجَرَّاحُ بِخُطُوَاتِ الإِرْقَاءِ السَّلِيمَةِ لِلسَّيْطَرَةِ عَلَى النَّزْفِ أَثْنَاءَ العَمَلِيَّةِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اسْتَخْدَمَ الطَّبِيبُ المِرْقَأَةَ لِضَمَانِ قَطْعِ النَّزْفِ سَرِيعاً."

stage5_enrichment:
  per_entry:
    - lemma: "إِرْقَاء"
      entry_id: "{auto}"
      root: "رقأ"
      maqayis_quote: "«الرَّاءُ وَالْقَافُ وَالْهَمْزَةُ كَلِمَةٌ وَاحِدَةٌ. يُقَالُ: رَقَأَ الدَّمُ وَالدَّمْعُ، إِذَا انْقَطَعَا.»"
    - lemma: "قَطْعُ النَّزْفِ"
      entry_id: "{auto}"
      roots:
        - word: "قطع"
          root: "قطع"
          maqayis_quote: "«الْقَافُ وَالطَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى صَرْمٍ وَإِبَانَةِ شَيْءٍ مِنْ شَيْءٍ. يُقَالُ: قَطَعْتُ الشَّيْءَ أَقْطَعُهُ قَطْعًا.»"
        - word: "النزف"
          root: "نزف"
          maqayis_quote: "«النُّونُ وَالزَّاءُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى نَفَادِ شَيْءٍ وَانْقِطَاعٍ. وَنُزِفَ دَمُهُ: خَرَجَ كُلُّهُ.»"

  per_sense:
    - lemma: "إِرْقَاء"
      sense_id: "{auto}"
      nuance: "المصطلح الطبي المتخصص والدقيق لعملية وقف تدفق الدم."
      mwe: false
    - lemma: "قَطْعُ النَّزْفِ"
      sense_id: "{auto}"
      nuance: "تعبير طبي وصفي يركز على النتيجة المباشرة للإجراء الجراحي."
      mwe: true

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"رقأ","maqayis":"«الرَّاءُ وَالْقَافُ وَالْهَمْزَةُ كَلِمَةٌ وَاحِدَةٌ. يُقَالُ: رَقَأَ الدَّمُ وَالدَّمْعُ، إِذَا انْقَطَعَا.»"}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"قطع","root":"قطع","maqayis":"«الْقَافُ وَالطَّاءُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى صَرْمٍ وَإِبَانَةِ شَيْءٍ مِنْ شَيْءٍ. يُقَالُ: قَطَعْتُ الشَّيْءَ أَقْطَعُهُ قَطْعًا.»"},{"word":"النزف","root":"نزف","maqayis":"«النُّونُ وَالزَّاءُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى نَفَادِ شَيْءٍ وَانْقِطَاعٍ. وَنُزِفَ دَمُهُ: خَرَجَ كُلُّهُ.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الطبي المتخصص والدقيق لعملية وقف تدفق الدم.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبير طبي وصفي يركز على النتيجة المباشرة للإجراء الجراحي.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95