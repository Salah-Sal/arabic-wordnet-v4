  per_entry:
    # الأعلام الشخصية المُعرَّبة لا جذر عربياً لها — يُدرج ذلك في الملاحظة
    - lemma: "بِيتَر بِيرِنْز"
      entry_id: "{auto}"
      note: "علَمٌ شخصي أجنبي مُعرَّب — لا جذر عربي ولا شاهد من مقاييس اللغة"
    - lemma: "بِيرِنْز"
      entry_id: "{auto}"
      note: "علَمٌ شخصي أجنبي مُعرَّب (لقب فقط) — لا جذر عربي ولا شاهد من مقاييس اللغة"

  per_sense:
    - lemma: "بِيتَر بِيرِنْز"
      sense_id: "{auto}"
      nuance: >
        الاسم الكامل (اسم + لقب) — يُستخدم في التعريفات الأولى والسياقات الرسمية والببليوغرافية
        لتمييز الشخص عن غيره من حاملي اللقب.
      mwe: true
    - lemma: "بِيرِنْز"
      sense_id: "{auto}"
