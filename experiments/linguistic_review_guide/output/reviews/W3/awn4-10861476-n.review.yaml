# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10861476-n  |  ILI: i94421
# المراجع: ناقد لغوي عربي خبير
# التاريخ: 2026-03-21
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء) ───────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان (بيتر بيرنز / بيرنز) خاليتان من التشكيل الكامل"
      - "وصف pos بـ n (noun عام) بينما الأصوب تصنيف العلَم الشخصي proper_noun — غير أن نظام AWN/WordNet يدرج الأعلام ضمن n، فلا يُقترح تغيير"
      - "التعريف العربي ترجمة مباشرة للإنجليزي بأسلوب غير مصقول؛ يحتاج صياغة موسوعية أنسب"
      - "المجموعة علَمٌ شخصي لمعماري غير مشهور في الثقافة العربية — وجوده في الشبكة مشروط بضرورة التوثيق الدقيق"
    observations: >
      المجموعة تُحيل إلى علَم شخصي (بيتر بيرنز، المعماري الألماني 1868–1940)، وهو رائد عمارة الحداثة الوظيفية
      وأستاذ عدد من عمالقة المعمار كغروبيوس وميس فان دير روه ولو كوربوزييه. الاسم الأجنبي لا يقبل اشتقاقاً
      عربياً حقيقياً؛ كل الخيارات تعريبٌ للاسم الأجنبي. المطلوب ضبط التشكيل وتحسين التعريف.

  blind_candidates:
    - lemma: "بِيتَر بِيرِنْز"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل (Peter Behrens) بصيغته الشائعة في المصادر العربية: ب+ي+ت+ر لـ Peter،
        وب+ي+ر+ن+ز لـ Behrens بنقل الصوت النهائي s إلى ز — وهو الأكثر شيوعاً في المراجع العلمية العربية.
    - lemma: "بِيرِنْز"
      generation_method: taarib
      justification: >
        اختصار الاسم إلى اللقب فقط (Behrens)، وهو الأسلوب المعتاد في السياقات الأكاديمية حين يُستغنى
        عن الاسم الأول بعد أول ورود للاسم الكامل.
    - lemma: "بِيتَر بِيرِنْس"
      generation_method: taarib
      justification: >
        تعريب بديل يستخدم س بدل ز لنقل الصوت s النهائي في Behrens — نجده في بعض المصادر العربية
        القديمة والمترجمات غير الموحَّدة.
    - lemma: "بِيرِنْس"
      generation_method: taarib
      justification: >
        اللقب فقط بالتهجئة البديلة بالسين — يُستخدم في بعض المراجع المترجمة ليوافق النطق الألماني
        الذي يُخفَّف فيه صوت s النهائي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  queries_run:
    - "Batch headword lookup: بيتر بيرنز / بيرنز / بيتر بيرنس / بيرنس (+ صيغ ال-) — لا نتائج"
    - "English bridge: translation_en:\"Behrens\" OR translation_en:\"Peter Behrens\" — لا نتائج"
    - "Arabic FTS: \"معماري\" OR \"مصانع\" OR \"نفعي\" — لا صلة بالعلَم الشخصي"
  per_lemma:
    - lemma: "بِيتَر بِيرِنْز"
      evidence_status: "no_material_found"
    - lemma: "بِيرِنْز"
      evidence_status: "no_material_found"
    - lemma: "بِيتَر بِيرِنْس"
      evidence_status: "no_material_found"
    - lemma: "بِيرِنْس"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة ١ ──
    - lemma: "بيتر بيرنز"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للعلَم (Peter Behrens) مُعرَّب بصورة شائعة وصحيحة. يضم الاسم الأول والأخير
        معاً مما يُزيل اللبس مع أشخاص آخرين يحملون اللقب نفسه. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        صيغة الاسم الكامل (اسم + لقب) — تُستخدم في السياق الأول والرسمي لتمييز الشخص عن غيره
        ممن يشاركونه اللقب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِيتَر بِيرِنْز"

    # ── لمّة موجودة ٢ ──
    - lemma: "بيرنز"
      decision: confirmed
      decision_reason: >
        اللقب المختصر (Behrens) شائع الاستخدام في الكتابة الأكاديمية العربية المتخصصة في تاريخ العمارة
        بعد ذكر الاسم الكامل. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صيغة اللقب المختصر — تُستخدم في السياقات الأكاديمية المتخصصة بعد ذكر الاسم الكامل أول مرة،
        وفي الفهارس والإحالات المرجعية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِيرِنْز"

    # ── مرشح المرحلة ١ (٣) — مرفوض ──
    - lemma: "بِيتَر بِيرِنْس"
      source: stage1
      decision: removed
      decision_reason: >
        التهجئة بالسين (بيرنس) أقل شيوعاً وأقل دقة في نقل الصوت الأصلي للاسم Behrens؛ المصادر العربية
        الرئيسية والموسوعات العلمية تستخدم الزاي (بيرنز). قبول صيغتين متنافستين يُشتّت القارئ.

    # ── مرشح المرحلة ١ (٤) — مرفوض ──
    - lemma: "بِيرِنْس"
      source: stage1
      decision: removed
      decision_reason: >
        لنفس أسباب رفض بيتر بيرنس — التهجئة بالسين تمثل شيوعاً أقل ودقة أدنى. الإبقاء على المجموعة
        بصيغتَي بيرنز الأكثر تداولاً واعتماداً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "معماري ألماني معروف بمباني المصانع النفعية البسيطة (1868-1940)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية مباشرة للإنجليزي بأسلوب مقتضب لا يُعطي القارئ العربي سياقاً
        كافياً. تعبير "بمباني المصانع النفعية البسيطة" ركيكٌ ويحتاج إعادة صياغة. والتعريف الموسوعي
        يستوجب ذكر مكانته الريادية في العمارة الحديثة.
    authored:
      - type: encyclopedic
        text: >
          مهندسٌ معماريٌّ أَلمانيٌّ (1868–1940م)، يُعدُّ من رُوَّاد حركة العمارة الحداثية الوظيفية؛
          اشتُهر بتصميم مبانٍ صناعية ذات طابع بسيط خالٍ من الزخرفة يُقدِّم الغاية الوظيفية على
          الجمالية. تتلمذ على يديه عددٌ من أعلام العمارة الحديثة كفالتر غروبيوس وميس فان دير روه.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10861476-n"
          definition_index: 0
          text: >
            مهندسٌ معماريٌّ أَلمانيٌّ (1868–1940م)، يُعدُّ من رُوَّاد حركة العمارة الحداثية الوظيفية؛
            اشتُهر بتصميم مبانٍ صناعية ذات طابع بسيط خالٍ من الزخرفة يُقدِّم الغاية الوظيفية على
            الجمالية. تتلمذ على يديه عددٌ من أعلام العمارة الحديثة كفالتر غروبيوس وميس فان دير روه.

  examples:
    per_lemma:
      - lemma: "بِيتَر بِيرِنْز"
        examples:
          - text: "أَرسى بِيتَر بِيرِنْز قواعدَ العمارة الصناعية الحديثة بتصميمه مصنعَ توربينات AEG في برلين عام 1909م."
            type: usage
      - lemma: "بِيرِنْز"
        examples:
          - text: "يرى المؤرخون أن بِيرِنْز كان المُحرِّك الأساسي لتحوُّل العمارة الغربية نحو البساطة الوظيفية في مطلع القرن العشرين."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَرسى بِيتَر بِيرِنْز قواعدَ العمارة الصناعية الحديثة بتصميمه مصنعَ توربينات AEG في برلين عام 1909م."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يرى المؤرخون أن بِيرِنْز كان المُحرِّك الأساسي لتحوُّل العمارة الغربية نحو البساطة الوظيفية في مطلع القرن العشرين."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
