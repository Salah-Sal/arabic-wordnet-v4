    # ملاحظة المدخل ٢ (اللقب)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"note":"علم شخصي أجنبي معرَّب — لقب فقط"}'
    # ملاحظة المعنى ١
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الكامل — للتعريف الأول والسياقات الرسمية","mwe":true}'
    # ملاحظة المعنى ٢
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللقب المختصر — للسياقات الأكاديمية بعد ذكر الاسم الكامل","mwe":false}'
    # ملاحظة المجموعة
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "awn4-10861476-n"
