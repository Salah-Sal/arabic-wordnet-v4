# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14027365-n (poise)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «توازن» تتطابق مع لمّة المجموعة الأعلى (awn4-13957933-n) مما يُولّد تداخلاً هرمياً بين الأمّ والبنت"
      - "اللمّتان بلا تشكيل في البيانات الأصلية"
      - "التعريف العربي يستخدم كلمة «التوازن» وهي لمّة في المجموعة ذاتها — دوران جزئي"
    observations: "المجموعة تمثّل مفهوم الاتزان المستقرّ (poise) وهو نوع خاصّ من التوازن العامّ. في المصطلحية العربية المعيارية يُفرَّق بين «التوازن» بوصفه مفهوماً عامّاً و«التوازن المستقرّ» أو «الاتزان» بوصفه حالةً مخصوصة. ورود «توازن» في كلتا المجموعتين (الأمّ والبنت) يُضعف التمييز الدلالي بينهما."
  blind_candidates:
    - lemma: "اتِّزَان"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من الجذر و-ز-ن على وزن افْتِعَال، يدلّ على حالة الاعتدال والاستقامة الذاتية، أقرب دلالةً إلى الاستقرار المتوازن من «توازن» العامّ"
    - lemma: "رَزَانَة"
      generation_method: ishtiqaq
      justification: "من الجذر ر-ز-ن على وزن فَعَالَة، يدلّ عند ابن فارس على التجمّع والثبات والثقل، فقد يُمَدّ مجازاً إلى الاستقرار المتوازن"
    - lemma: "ثَبَات"
      generation_method: ishtiqaq
      justification: "مصدر ثَبَتَ على وزن فَعَال، يدلّ على دوام الشيء واستقراره، وقد يُستعمل بمعنى الاستقرار في موضعه"
    - lemma: "رَصَانَة"
      generation_method: ishtiqaq
      justification: "من الجذر ر-ص-ن على وزن فَعَالَة، يدلّ على الإحكام والمتانة، وقد يُمدّ إلى ثبات الوضع المتوازن"

stage2_evidence:
  per_lemma:
    - lemma: "اتِّزَان"
      confirm:
        - text: "«(في الرياضة والهندسة): يقال: اتزانٌ لا مُستقِرٌّ: وهو اتزان الجسم الذي إذا أزيح قليلاً عن موضعه لم يَعُد إلى وضعه الأصلي واختلَّ التوازن. (مج)»"
          source: "المعجم الوسيط"
        - text: "«(6) توازُن؛ اتِّزان؛ رباطة جأش»"
          source: "المورد الحديث (2008) — مدخل poise"
      expands:
        - text: "«اتّزان — stability»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يُستعمل اتزان بمعنى stability في السياق الهندسي"
        - text: "«اتزان — equilibration»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
          addition: "يُستعمل في سياق التوازن الجسدي والفسيولوجي"
        - text: "«استقرار، اتزان — stability; steadiness»"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "يُقرن الاتزان بالاستقرار في السياق العلمي"

    - lemma: "تَوَازُن"
      confirm:
        - text: "«توازن — equilibrium: وهي الحالة التي لا يتحرك فيها الجسم، ويكون في حالة توازن مستقر عندما تزيد أدنى حركة من طاقته الكامنة فيعود إلى مكانه الأصلي لدى تركه»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«توازن — equilibrium: حالة تتكافأ فيها القوى المضادة لتحديد الوضع»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      contradicts:
        - text: "«(توازن) الشيئان تَسَاويا فِي الْوَزْن»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يُثبت «تَوَازَنَ» فعلاً لا اسماً، بمعنى التساوي في الوزن لا حالة الاستقرار"
      expands:
        - text: "«توازن ثابت، توازن مستقر — stable equilibrium: إذا انحرف الوضع تظهر قوى تعيده إلى حاله»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "المفهوم الدقيق للمجموعة هو «توازن مستقر» المركّب، لا «توازن» المفرد"
        - text: "«توازن مستقِرّ — stable equilibrium»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "في الفيزياء يُميَّز بين التوازن المستقرّ وغير المستقرّ بمركّب وصفي"

    - lemma: "رَزَانَة"
      contradicts:
        - text: "«الرَّزَانَةُ: الوَقارُ»"
          source: "المعجم الكبير"
          conflict: "الرزانة في المعاجم تعني الوقار والحِلم لا التوازن الفيزيائي"
        - text: "«يقال: فيه رزانة: وقار»"
          source: "المعجم الوسيط"
          conflict: "تؤكّد الدلالة على صفة شخصية (وقار) لا حالة فيزيائية"
      expands:
        - text: "«(رَزَنَ) الرَّاءُ وَالزَّاءُ وَالنُّونُ أَصْلٌ يَدُلُّ عَلَى تَجَمُّعٍ وَثَبَاتٍ. يَقُولُونَ رَزُنَ الشَّيْءُ: ثَقُلَ. وَرَجُلٌ رَزِينٌ وَامْرَأَةٌ رَزَانٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الثقل والثبات المادي لكنّ الاستعمال المعجمي انحصر في الوقار"

    - lemma: "ثَبَات"
      contradicts:
        - text: "«(ثَبَتَ) الثَّاءُ وَالْبَاءُ وَالتَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ دَوَامُ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الثبات يدلّ على الدوام والبقاء لا على التوازن بين قوى متقابلة"
        - text: "«(الثَّبَات) ضد الزوال»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "مقابل الزوال لا مقابل الاختلال"
      expands:
        - text: "«ثبات — stability; steadiness; persistence; constancy; immobility; fixity»"
          source: "معاجم ARABTERM المتعددة"
          addition: "يُترجم ثبات بمعانٍ متنوعة (استقرار، دوام، ثبوت) لكنها جميعاً تدلّ على عدم التغيّر لا على التوازن"

    - lemma: "رَصَانَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "اتِّزَان"
      decision: confirmed
      decision_reason: "لمّة فصيحة مشتقّة من الجذر و-ز-ن على وزن افتعال، مثبتة في المعجم الوسيط في سياق الرياضة والهندسة بمعنى توازن الجسم، ومقترنة بـ poise في المورد الحديث. تتميّز عن «توازن» بدلالتها على حالة الاعتدال الذاتي المستقرّ."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اتِّزَان"

    - lemma: "تَوَازُن"
      decision: confirmed
      decision_reason: "مصطلح واسع الانتشار في المعاجم المصطلحية العربية بمعنى equilibrium، وإن كان يتداخل مع لمّة المجموعة الأمّ. يبقى مقبولاً لأنّ الكلمة الواحدة قد تنتمي لأكثر من مجموعة ترادفية (تعدّد المعاني). غير أنّ الدلالة الأدقّ للمجموعة هي «التوازن المستقرّ» لا «التوازن» المطلق."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَازُن"

    - lemma: "رَزَانَة"
      source: stage1
      decision: removed
      decision_reason: "الرزانة في المعاجم العربية منحصرة في دلالة الوقار والحِلم (صفة شخصية)، ولا تُستعمل بمعنى التوازن الفيزيائي أو الاستقرار الميكانيكي رغم أنّ جذرها يدلّ على الثقل والثبات."

    - lemma: "ثَبَات"
      source: stage1
      decision: removed
      decision_reason: "الثبات يدلّ على الدوام وعدم الزوال (permanence/stability) لا على التوازن بين قوى متقابلة (equilibrium). فهو مقابل لـ stability لا لـ poise أو equilibrium."

    - lemma: "رَصَانَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تدعم استعمال الرصانة بمعنى التوازن المستقرّ. دلالتها منحصرة في الإحكام والمتانة (solidness)."

