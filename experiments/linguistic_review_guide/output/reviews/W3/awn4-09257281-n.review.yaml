    current: "الجزء الجنوبي من خليج ماساتشوستس"
    assessment:
      decision: revise
      reason: "التعريف يحتاج لإضافة السياق الجغرافي العام (المحيط الأطلسي، الولاية الأمريكية) ليكون أدق وأوضح."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ كَبِيرٌ فِي المُحِيطِ الأَطْلَسِيِّ يَقَعُ قُبَالَةَ سَاحِلِ وِلَايَةِ مَاسَاتْشُوسِيتْس الأَمْرِيكِيَّةِ، وَيُشَكِّلُ الجُزْءَ الجَنُوبِيَّ مِنْ خَلِيجِ مَاسَاتْشُوسِيتْس."
        quality_check:
          genus_present: true
          differentia_present: true
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09257281-n", definition_index: 0, text: "خَلِيجٌ كَبِيرٌ فِي المُحِيطِ الأَطْلَسِيِّ يَقَعُ قُبَالَةَ سَاحِلِ وِلَايَةِ مَاسَاتْشُوسِيتْس الأَمْرِيكِيَّةِ، وَيُشَكِّلُ الجُزْءَ الجَنُوبِيَّ مِنْ خَلِيجِ مَاسَاتْشُوسِيتْس."}
  examples:
    per_lemma:
      - lemma: "خَلِيجُ كِيب كُود"
        examples:
          - text: "تُعَدُّ مِياه خَلِيجِ كِيب كُود مَوْطِناً لِلعديدِ مِنَ الحِيتانِ المهدَّدَةِ بالانقِراض."
            type: usage
      - lemma: "خَلِيجُ رَأْسِ كُود"
        examples:
          - text: "تَمْتَدُّ الشَّواطِئُ الرَّمْلِيَّةُ عَلى طُولِ خَلِيجِ رَأْسِ كُود فِي وِلَايَةِ مَاسَاتْشُوسِيتْس."
