stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي مقتضب جداً ويفتقر للبيانات الجغرافية الكافية (الموقع، المسطح المائي الرئيسي)."
      - "اللمة الموجودة تفتقر للتشكيل الكامل."
    observations: "المصطلح اسم علم لموقع جغرافي أجنبي، والتعريب المباشر (كيب كود) هو الشائع، مع إمكانية ترجمة المكونات الوصفية (Cape -> رأس)."
  blind_candidates:
    - lemma: "خَلِيجُ كِيب كُود"
      generation_method: tarkib
      justification: "التعريب المباشر لاسم العلم (Cape Cod Bay) مع الحفاظ على بنية التركيب الإضافي."
    - lemma: "خَلِيجُ رَأْسِ كُود"
      generation_method: tarkib
      justification: "ترجمة المكون الوصفي (Cape) إلى (رأس) وتعريب الجزء الأساسي من الاسم."
    - lemma: "خَلِيجُ رَأْسِ القَدِّ"
      generation_method: tarkib
      justification: "ترجمة كاملة لاسم الموقع، حيث أن (Cod) تعني سمك القد، وهو اسم الرأس الأصلي."
    - lemma: "جَوْنُ كِيب كُود"
      generation_method: tarkib
      justification: "استخدام لفظ (جون) كمرادف دقيق للخليج الصغير أو الغائر في اليابسة."

