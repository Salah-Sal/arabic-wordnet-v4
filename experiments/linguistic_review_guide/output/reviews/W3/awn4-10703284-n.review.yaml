# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10703284-n  |  ILI: i93487  |  POS: n
# Lemmas: ضارب، مُلوح
# Definition EN: someone who swings sports implements
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة «ضارب» مكتوبة بدون تشكيل كامل — تحتاج إلى ضَارِب"
      - "اللمة «مُلوح» مكتوبة بتشكيل ناقص — الصورة المقصودة غالباً هي مُلَوِّح (اسم فاعل من لوّح) لكن بدون التشديد والكسرة يقع لبسٌ مع المِلْوَح (السريع العطش)"
      - "التعريف الحالي يستخدم «يلوح» وهو الثلاثي (لاح = لمع وظهر) بدلاً من «يُلوِّح» الرباعي المقصود (لوّح = أشار وهزّ)"
      - "المجموعة تفتقر إلى تعريف بأسلوب المعجم المنهجي (جنس قريب + فصل نوعي)"
    observations: >
      المجموعة awn4-10703284-n تُمثِّل نوعاً من الرياضي الذي تقوم ممارسته على تأرجح أداة رياضية
      (كمضرب التنس أو عصا الغولف أو مضرب البيسبول). اللمتان الحاليتان ضارب ومُلوح تمثلان اشتقاقين
      عربيين صحيحين من جذرَي ض-ر-ب ول-و-ح على التوالي، غير أن تشكيلهما في النظام منقوص؛ وتعاني «مُلوح»
      تحديداً من التباس مع كلمات أخرى مستقرة في المعاجم. يُلاحَظ أن التعريف الموجود عامٌّ يصلح وصفاً لا
      تعريفاً معجمياً منهجياً، كما أن المجموعة تفتقر إلى أمثلة استعمالية.
  blind_candidates:
    - lemma: "ضَرَّاب"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من جذر ض-ر-ب، يفيد المبالغة والحِرَفية في فعل الضرب بالأداة؛ نظيرُه «نجّار وبنّاء»
        في الدلالة على الاحتراف. مناسب للرياضي الذي يضرب بمضرب التنس أو عصا الغولف باحتراف وتكرار.
    - lemma: "هَزَّاز"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من جذر هـ-ز-ز، يدل على من يهز الأداة بقوة وتكرار. الهزّ هو الحركة التأرجحية
        الأساسية لمضرب التنس أو الغولف قبيل الضربة؛ والصيغة فَعَّال وصفٌ صريح للاحتراف.
    - lemma: "مُرَجِّح"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من رجّح (الرباعي)، من جذر ر-ج-ح الدال على الرزانة والتأرجح؛ ومنه الأُرجوحة (swing).
        يصف من يُرجِّح أداته الرياضية كالبندول قبل الضربة، وهي الحركة الجوهرية في رياضات المضرب.
    - lemma: "مَاخِر"
      generation_method: majaz
      justification: >
        من مخر يمخر: شقّ الماء (مقاييس اللغة: «يَدُلُّ عَلَى شَقٍّ وَفَتْحٍ»). بالمجاز: من يشق الهواء
        بحركة أداته الرياضية شقاً سريعاً قوياً. إحياء لفظ عربي قديم ببُعد دلالي وصفي للحركة.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "ضارب"
      confirm:
        - text: >
            «(3) المِضْرب: مِضْرب كرة البَيْسبول أو الكريكيت أو كرة الطاولة.
            (4) «أ» ضربُ الكرة [بالمضرب]. «ب» دَوْر اللاعب في الضّرْب.
            «ج» الضارب: اللاعب الضارب للكرة بمِضْرَبِهِ»
          source: "المورد الحديث (2008) — ترجمة bat"
        - text: >
            «(1) «أ», فا strike، مثل: «ب» اللاعب الضاربُ للكُرَة.»
          source: "المورد الحديث (2008) — ترجمة striker"
      expands:
        - text: >
            «الضَّادُ وَالرَّاءُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، ثُمَّ يُسْتَعَارُ وَيُحْمَلُ عَلَيْهِ.
            مِنْ ذَلِكَ ضَرَبْتُ ضَرْبًا، إِذَا أَوْقَعْتَ بِغَيْرِكَ ضَرْبًا.»
          source: "مقاييس اللغة لابن فارس — مادة ضرب (entry_id=987423)"
          addition: >
            الجذر ض-ر-ب أصل واحد يدل على الإيقاع والإصابة؛ وهذا يسنُد اتساع
            المعنى ليشمل الضرب بأدوات رياضية كالمضرب وعصا الغولف.
        - text: >
            «الموكَّلُ بالقِداح وقيل: الذى يَضْرِبُ بها.
            العاملُ لأنه يضربُ في الأرض.»
          source: "المعجم الكبير — مادة الضَّارِبُ (entry_id=58288)"
          addition: >
            يُثبت الاستخدام التاريخي لـ«ضارب» اسم فاعل يصف من يضرب بأداة؛ ولا يقتصر
            على الضرب المباشر.

    - lemma: "مُلوح"
      contradicts:
        - text: "«السريع العطش»"
          source: "المعجم الوسيط (entry_id=26678) — مادة المِلْوَح"
          conflict: >
            الشكل المكتوب «مُلوح» بدون تشكيل كامل يلتبس مع المِلْوَح/الملوح المعجمي
            الدال على «السريع العطش»؛ وهو معنى مناقض تماماً للمقصود هنا (من يُلوِّح
            بأدوات رياضية). الصورة المقصودة هي «مُلَوِّح» (اسم فاعل من لوّح).
        - text: "«(الملوح) السَّرِيع الْعَطش»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (entry_id=884487)"
          conflict: >
            تأكيد ثانٍ على أن «الملوح» بهذا الشكل يعني السريع العطش في مصادر متعددة.
      expands:
        - text: >
            «اللَّامُ وَالْوَاوُ وَالْحَاءُ أَصْلٌ صَحِيحٌ، مُعْظَمُهُ مُقَارَبَةُ بَابِ اللَّمَعَانِ.
            يُقَالُ: لَاحَ الشَّيْءُ يَلُوحُ، إِذَا لَمَحَ وَلَمَعَ. وَيُقَالُ: أَلَاحَ بِسَيْفِهِ:
            لَمَعَ بِهِ.»
          source: "مقاييس اللغة لابن فارس — مادة لوح (entry_id=988748)"
          addition: >
            الأصل «أَلَاحَ بِسَيْفِهِ: لَمَعَ بِهِ» — أي أشار به وأظهره بحركة — يسند دلالياً
            «مُلَوِّح» (من لوّح الرباعي) اسم فاعل بمعنى «من يُلوِّح بأداته الرياضية».
            غير أن الشكل الموجود «مُلوح» يفتقر إلى التشديد والكسرة على الواو.

    - lemma: "ضَرَّاب"
      evidence_status: "no_material_found"

    - lemma: "هَزَّاز"
      contradicts:
        - text: "«vibrator»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989) (entry_id=424979)"
          conflict: >
            «هزاز» مستقر في المعاجم التقنية العربية بمعنى «جهاز اهتزاز» (vibrator)؛
            اعتماده اسماً لشخص رياضي يُحدث لبساً مع هذا المصطلح المعمول به.
        - text: "«vibrator»"
          source: "المعجم الطبي الموحد (2009) (entry_id=666036)"
          conflict: "تأكيد ثانٍ: هزاز = vibrator في المجال الطبي."

    - lemma: "مُرَجِّح"
      contradicts:
        - text: "«المُرَجَّحُ: الحليمُ»"
          source: "المعجم الكبير (entry_id=92291)"
          conflict: >
            «المُرَجَّح» بهذا الوزن يعني الحليمَ الرزين؛ وهو معنى مختلف تماماً عن
            الرياضي الذي يضرب بالأداة.
      expands:
        - text: >
            «مرجح: هدهد، تحرك في المهد ومع المهد (بوشر).
            مرجح (بالتشديد): اهتز، وتمايل المشنوق.»
          source: "تكملة المعاجم العربية لرينهارت دوزي (entry_id=848627)"
          addition: >
            الفعل «مرجّح» يحمل دلالة الاهتزاز والتحرك ذات اليمين والشمال؛ غير أن الاستخدام
            المعجمي لا يسنده بمعنى رياضي أو احترافي.

    - lemma: "مَاخِر"
      expands:
        - text: >
            «مَخَرَتِ السَّفِينَةُ الْمَاءَ مَخْرًا: شَقَّتْهُ.»
          source: "مقاييس اللغة لابن فارس — مادة مخر (entry_id=988815)"
          addition: >
            الأصل «شق الماء» بحركة قوية ومتواصلة؛ يمكن تطبيقه مجازياً على شق الهواء بالأداة
            الرياضية، إلا أن هذا المجاز بعيد ولا يُجمع عليه في التداول المعاصر.
        - text: >
            «مَاخِر: في اصطلاح البحرية مع الريح.»
          source: "تكملة المعاجم العربية لرينهارت دوزي (entry_id=848530)"
          addition: >
            الاستخدام المعجمي محصور في المصطلحية البحرية؛ مما يُضعف احتمال قبوله في السياق
            الرياضي.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "ضارب"
      decision: confirmed
      decision_reason: >
        اللمة اسم فاعل عربي أصيل من جذر ض-ر-ب، مؤيَّد بشواهد معجمية معاصرة صريحة
        («الضارب: اللاعب الضارب للكرة بمِضْرَبِهِ» في المورد الحديث). الجذر ضرب يحمل الدلالة
        الجوهرية لمفهوم المجموعة. تحتاج اللمة إلى تصحيح التشكيل الكامل: ضَارِب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يؤكد البُعد الإجرائي والإصابي: الضارب هو من يُصيب الهدف بأداته بقوة وإتقان؛
        الدلالة منصبّة على فعل الإيقاع والإصابة أكثر من وصف الحركة.
      morphology_check:
        pattern: "فَاعِل (اسم فاعل من الثلاثي المجرد)"
        fit: >
          وزن فَاعِل مناسب جداً لاسم الفاعل الذي يصف الشخص بالفعل المتكرر؛
          مقيس ومطرد في الفصيح.
      borrowing_check:
        lexical_borrowing: "عربي أصيل — لا اقتراض"
      quality_gate:
        consistency: "مطّرد، اسم الفاعل من ضرب شائع في الفصيح"
        ease_of_use: "يسير التداول في السياق الرياضي (ضارب الكرة)"
        fitness: "ملائم للسياق الرياضي وغير الرياضي"
        heritage_preference: "لفظ تراثي عريق"
        arabic_preference: "عربي خالص"
        derivability: "قابل للاشتقاق (ضاربة، ضوارب، ...)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ضَارِب"

    - lemma: "مُلوح"
      decision: confirmed
      decision_reason: >
        اللمة مقصود بها مُلَوِّح (اسم فاعل من لوّح الرباعي)، وهي مناسبة دلالياً لأن
        «لوّح بالشيء» = أشار به وأظهره بحركة واضحة. غير أن الشكل المكتوب «مُلوح»
        ناقص التشكيل ويلتبس مع المِلْوَح (السريع العطش)؛ يجب تصحيح التشكيل إلى مُلَوِّح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يؤكد البُعد الحركي الوصفي: المُلَوِّح هو من يُلوِّح بأداته (يهزّها ويديرها في الهواء)
        قبل الضربة أو خلالها؛ الدلالة منصبّة على الحركة الواسعة المرئية للأداة أكثر من
        التركيز على فعل الإصابة.
      morphology_check:
        pattern: "مُفَعِّل (اسم فاعل من الرباعي المزيد بالتضعيف)"
        fit: >
          وزن مُفَعِّل مناسب للاسم الفاعل من الفعل الرباعي لوّح؛ الوزن مطرد
          ومقيس في الفصيح.
      borrowing_check:
        lexical_borrowing: "عربي أصيل — لا اقتراض"
      quality_gate:
        consistency: "مطّرد بعد تصحيح التشكيل"
        ease_of_use: "يسير التداول بعد ضبط الضبط الكامل"
        fitness: "ملائم للسياق الرياضي"
        heritage_preference: "لفظ تراثي — جذر لوح أصيل"
        arabic_preference: "عربي خالص"
        derivability: "قابل للاشتقاق (تلويح، ملوِّحة، ...)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُلَوِّح"

    - lemma: "ضَرَّاب"
      source: stage1
      decision: removed
      decision_reason: >
        وزن فَعَّال من ضرب غير مسكوك في قواميس الرياضة؛ لم تُسفر الاستعلامات عن
        أي شاهد معجمي يربطه بالسياق الرياضي. علاوة على ذلك، لا ضرورة لإضافته
        مع وجود «ضَارِب» المؤكد الذي يؤدي المعنى ذاته بدرجة مطابقة أعلى.

    - lemma: "هَزَّاز"
      source: stage1
      decision: removed
      decision_reason: >
        «هزاز» مستقر في المعاجم التقنية العربية المعيارية بمعنى «vibrator» (فيزياء وطب)؛
        اعتماده للإنسان الرياضي يُحدث اشتراكاً لفظياً مع مصطلح تقني معمول به.

    - lemma: "مُرَجِّح"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم المعتمدة تُثبت «المُرَجَّح» بمعنى الحليم، و«مرجّح» بمعنى الموازَن
        أو المتأرجح في المهد؛ لا شاهد على استخدامه في سياق رياضي احترافي.

    - lemma: "مَاخِر"
      source: stage1
      decision: removed
      decision_reason: >
        المجاز بعيد ومتكلَّف، والاستخدام المعجمي للفظ محصور في المصطلحية البحرية؛
        لا يُرجَّح قبوله في السياق الرياضي دون سند نصي كافٍ.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "شخص يلوح بأدوات رياضية (مثل المضرب)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يعاني من ثلاث مشكلات: (١) استخدام «يلوح» (ثلاثي، أصله اللمعان)
        بدلاً من «يُلوِّح» (رباعي = يُشير ويُهز)، (٢) «شخص» مبهم — يُفضَّل «رياضيٌّ»
        لإدراجه ضمن فئة أعلى متوافقة مع المجموعة الأم (رياضي/لاعب رياضي)،
        (٣) التعريف وصفٌ حر لا يستوفي شرطَي الجنس القريب والفصل النوعي المنهجيَّين.
    authored:
      - type: terminological
        text: >
          رياضيٌّ يُلوِّح بأدوات اللعب الرياضية كالمضرب وعصا الغولف أو يضرب بها
          في مختلف الألعاب.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          يشمل لاعبَ التنس والغولف والكريكيت والبيسبول وغيرهم ممن تقوم ممارستهم
          الرياضية على تأرجح أداة ضرب بحركة منحنية أو دائرية.
    actions:
      - command: update_definition
        params:
