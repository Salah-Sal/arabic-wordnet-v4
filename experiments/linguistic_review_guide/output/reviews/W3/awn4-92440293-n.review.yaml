# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92440293-n
# subsistence level / مستوى الكفاف
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مستوى الكفاف» مركب إضافي بدون تشكيل"
      - "المجموعة تحتوي لمّة واحدة فقط؛ يُستحسن إثراؤها بمرادف"
      - "التعريف العربي ترجمة حرفية من الإنجليزية ويحتاج صياغة معجمية"
    observations: >
      المفهوم يتعلق بالحد الأدنى من المعيشة الذي يكفي بالكاد للبقاء على قيد الحياة.
      هذا مفهوم اقتصادي واجتماعي راسخ في الثقافة العربية، وله تعبيرات متعددة
      في المعاجم الاصطلاحية العربية الحديثة. «الكفاف» لفظ عربي أصيل يدل على
      ما يكون بقدر الحاجة دون فضل، وهو من جذر «كفف» الدال على القبض والانقباض.
      المركب «مستوى الكفاف» طبيعي في العربية ويوازي البنية الإضافية الشائعة
      في المركبات الاقتصادية (اقتصاد الكفاف، أجر الكفاف، زراعة الكفاف).
  blind_candidates:
    - lemma: "حَدّ الكَفَاف"
      generation_method: tarkib
      justification: >
        مركب إضافي يجمع بين «حد» (الحد الأدنى) و«الكفاف» (ما يكفي بقدر الحاجة).
        يعبّر عن الخط الفاصل بين الفقر والكفاية، وهو أقرب إلى مفهوم عتبة المعيشة الدنيا.
    - lemma: "عَيْش الكَفَاف"
      generation_method: tarkib
      justification: >
        مركب إضافي يربط «العيش» (الحياة اليومية) بـ«الكفاف»، يشير إلى نمط الحياة
        الذي لا يتجاوز الكفاية الأساسية.
    - lemma: "الكَفَاف"
      generation_method: majaz
      justification: >
        إطلاق المصدر على المستوى المعيشي مجازاً مرسلاً؛ الكفاف في التعريفات
        الكلاسيكية هو ما يكون بقدر الحاجة ولا يفضل منه شيء.
    - lemma: "أَدْنَى المَعِيشَة"
      generation_method: tarkib
      justification: >
        مركب إضافي تفضيلي يعبّر عن أخفض درجات المعيشة الممكنة للبقاء.

stage2_evidence:
  per_lemma:
    - lemma: "مُسْتَوَى الكَفَاف"
      expands:
        - text: "«الكفاف: ما يكون بقدر الحاجة ولا يفضل منه شيء، ويكف عن السؤال.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يؤصّل دلالة الكفاف بمعنى ما يسدّ الحاجة دون زيادة"
        - text: "«الكفاف — subsistence»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "يؤكد مطابقة الكفاف للمفهوم الإنجليزي subsistence"
        - text: "«اقتصاد الكفاف — subsistence economy» و«أجر الكفاف — subsistence wage» و«زراعة الكفاف — subsistence farming»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) والاقتصاد (2000)"
          addition: "يثبت إنتاجية المركبات الإضافية مع الكفاف في المصطلحية الاقتصادية"

    - lemma: "حَدّ الكَفَاف"
      confirm:
        - text: "«حد الكفاف — poverty line»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«حد الكفاف — minimum of subsistance»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      expands:
        - text: "«خط الفقر هو مستوى الدخل الذي يعتبر الناس بمدخول أقل منه فقراء... ويسمى أيضا الحد الأدنى للكفاف.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          addition: "يربط بين حد الكفاف وخط الفقر، ويؤكد أن الحد الأدنى للكفاف مرادف لخط الفقر"

    - lemma: "عَيْش الكَفَاف"
      evidence_status: "no_material_found"

    - lemma: "الكَفَاف"
      confirm:
        - text: "«الكفاف: ما يكون بقدر الحاجة ولا يفضل منه شيء، ويكف عن السؤال.»"
          source: "كتاب التعريفات للشريف الجرجاني"
      contradicts:
        - text: "«كِفَاف — contour / circumference / profile line»"
          source: "المعجم الطبي الموحد (2009) والمعجم الموحد لمصطلحات المياه (2000)"
          conflict: "الكفاف بمعنى المحيط/الكنتور دلالة مختلفة تماماً، مما يُحدث اشتراكاً لفظياً"

    - lemma: "أَدْنَى المَعِيشَة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مُسْتَوَى الكَفَاف"
      decision: confirmed
      decision_reason: >
        مركب إضافي طبيعي يوازي البنية الشائعة في المصطلحية الاقتصادية العربية
        (اقتصاد الكفاف، أجر الكفاف، زراعة الكفاف). «الكفاف» مؤصّل في التراث
        اللغوي بمعنى ما يسدّ الحاجة دون فضل (الجرجاني)، و«مستوى» يحدد
        الدرجة المعيشية. المركب واضح ومباشر.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَوَى الكَفَاف"

    - lemma: "حَدّ الكَفَاف"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مسجّل في المعجم الموحد لمصطلحات الاقتصاد (2000) بمعنى «poverty line»
        وفي معجم التجارة والمحاسبة (1995) بمعنى «minimum of subsistence». وهو قريب
        جداً من مفهوم المجموعة. يختلف عن «مستوى الكفاف» بكونه يركّز على العتبة/الحد
        لا على الدرجة المعيشية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "حَدّ الكَفَاف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عَيْش الكَفَاف"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على تثبيته كمصطلح. «عيش الكفاف» يشير إلى نمط الحياة
        لا إلى المستوى أو الحد المعيشي. كما أنه يصلح وصفاً حراً لا مصطلحاً ثابتاً؛
        يمكن إبدال «عيش» بـ«حياة» أو «معيشة» دون تغيير المعنى (فشل اختبار السكّ).

    - lemma: "الكَفَاف"
      source: stage1
      decision: removed
      decision_reason: >
        رغم تأصّل «الكفاف» بمعنى ما يسدّ الحاجة، فإنه يعاني من اشتراك لفظي
        حاد مع «الكفاف» بمعنى المحيط/الكنتور (المعجم الطبي، معجم المياه).
        استخدامه وحده بدون مضاف (مستوى/حد) لا يحدد المعنى الاقتصادي بدقة.

    - lemma: "أَدْنَى المَعِيشَة"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لم تُسجّل في أي معجم اصطلاحي. يمكن إبدال «أدنى»
        بـ«أقل» أو «أخفض» دون تغيير المعنى، مما يؤكد أنها ليست مصطلحاً مسكوكاً.

stage4_content:
  definition:
    current: "مستوى معيشي يكفي بالكاد لدعم الحياة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية. «يكفي بالكاد» تعبير ركيك
        في سياق التعريف المعجمي، و«لدعم الحياة» مبهم. يحتاج صياغة على
        أسلوب المعجم الوسيط مع جنس قريب وفصل نوعي.
    authored:
      - type: terminological
        text: "الدرجةُ الدُّنيا من المعيشة التي تكفي لسدّ الحاجات الأساسية من مأكل ومشرب ومسكن دون فضل أو رفاهية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "أَقَلُّ ما يَعيشُ به المرءُ ويَسُدُّ رَمَقَه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الدرجةُ الدُّنيا من المعيشة التي تكفي لسدّ الحاجات الأساسية من مأكل ومشرب ومسكن دون فضل أو رفاهية."

  examples:
    per_lemma:
      - lemma: "مُسْتَوَى الكَفَاف"
        examples:
          - text: "يعيش ملايين الناس في البلدان النامية عند مستوى الكفاف أو دونه."
            type: usage
      - lemma: "حَدّ الكَفَاف"
        examples:
          - text: "رفعت المنظمة الدولية حدّ الكفاف إلى دولارين يومياً بعد احتساب التضخم."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يعيش ملايين الناس في البلدان النامية عند مستوى الكفاف أو دونه."
      - command: add_sense_example
