# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13971206-n
# المفهوم: مكانة اجتماعية عالية — high social status (quality)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان بدون تشكيل كامل"
      - "«حسب ونسب» تعبير عطفي مركب، نوع نادر من المركبات يحتاج تحققاً"
      - "المقابل الإنجليزي quality بمعنى المكانة العالية استعمال أدبي قديم وغير شائع اليوم"
    observations: "المفهوم (المكانة الاجتماعية العالية) مفهوم أصيل في الثقافة العربية، وله ألفاظ تراثية غزيرة: الحسب والنسب والشرف والمجد والسؤدد والوجاهة. الرَّفعة مصدر هيئة من رفع يدل على ارتفاع القدر والمنزلة. التعريف الحالي موجز جداً ويحتاج توسيعاً."
  blind_candidates:
    - lemma: "شَرَفٌ"
      generation_method: ishtiqaq
      justification: "من الجذر ش-ر-ف على وزن فَعَل، يدل على العلو والمجد، وخصّه بعض اللغويين بالشرف بالآباء، فهو أقرب ما يكون إلى المكانة الاجتماعية العالية"
    - lemma: "وَجَاهَة"
      generation_method: ishtiqaq
      justification: "من الجذر و-ج-ه على وزن فَعَالة، تدل على الجاه والحرمة والقدر بين الناس"
    - lemma: "سُؤْدُد"
      generation_method: ishtiqaq
      justification: "من الجذر س-و-د على وزن فُعْلُل، يدل على السيادة والمجد والمكانة العليا"
    - lemma: "عِزَّة"
      generation_method: ishtiqaq
      justification: "من الجذر ع-ز-ز على وزن فِعْلة، تدل على الرفعة والمنعة والأنفة"


stage2_evidence:
  per_lemma:
    - lemma: "حَسَبٌ وَنَسَبٌ"
      confirm:
        - text: "«الحَسَبُ: الشَرَف الثابت في الآباء»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«الحَسَب: ما يعدُّه المرء من مفاخر نفسه وآبائِه»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«ما يعُدُّه المرء من مناقبه أو شرف آبائه»"
          source: "المعجم الوسيط"
        - text: "«الحسب: بفتحتين: العظمة، والشّهامة من صفات الإنسان في دينه وماله. وفي فتح القدير الحسب مكارم الأخلاق. الحسيب هو الذي له جاه وحشمة ومنصب»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«النَّسَب: القرابةُ وما يَصِل من الأبوين من الشرافة والدناءة، ويقابله الحسبُ الحاصل بالكسب»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "التفريق بين الحسب (مكتسب) والنسب (موروث من الأبوين)"
        - text: "«النَّسَبُ: القَرابَةُ، أو في الآباءِ خاصَّةً»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "النسب يخصّ القرابة في الآباء"

    - lemma: "رِفْعَة"
      confirm:
        - text: "«الرِّفْعَة: الشَّرف وارتفاع القدر والمنزلة»"
          source: "المعجم الوسيط"
        - text: "«الشَّرَفُ والسُّمُوُّ والعِزَّةُ, خِلافُ الذِّلَّة والضَّعَة»"
          source: "المعجم الكبير"

    - lemma: "شَرَفٌ"
      confirm:
        - text: "«الشَّرَفُ: العُلُوُّ، والمكانُ العالي، والمَجْدُ، أو لا يكونُ إلاَّ بالآباءِ، أو عُلُوُّ الحَسَبِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الشَّرَفُ الحَسَبُ بالآباءِ»"
          source: "المحكم والمحيط الأعظم لابن سيده"
        - text: "«الموضع العالي يُشرف على ما حوله، العُلُوّ والمجد؛ وقيل لا يكون إلا بالآباء»"
          source: "المعجم الوسيط"
        - text: "«الشَّرفُ: يُؤثر عَن الآبَاء»"
          source: "معجم مقاليد العلوم للسيوطي"

    - lemma: "وَجَاهَة"
      confirm:
        - text: "«الحُرْمَة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«وجاهة: من (و ج ه) الحرمة، والقدر، والجاه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الوجاهة تعني القدر والجاه وليست مرادفاً دقيقاً للمكانة الاجتماعية العالية"

    - lemma: "سُؤْدُد"
      expands:
        - text: "«له شرف وسُؤْدَد — المعنى: مَجْد»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "السؤدد يعني المجد بمعنى عام، أوسع من المكانة الاجتماعية"

    - lemma: "عِزَّة"
      contradicts:
        - text: "«العِزَّة: القُوَّة والغَلَبَة والحَمِيَّة والأَنَفَة»"
          source: "المعجم الوسيط"
          conflict: "العزة تدل على القوة والغلبة والحمية لا على المكانة الاجتماعية تحديداً"
        - text: "«العِزَّةُ: التأبي عَن حمل المذلة، وقيل: الترفع عَمَّا تلْحقهُ غَضَاضَة»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "العزة صفة نفسية (التأبي والترفع) لا مكانة اجتماعية"


stage3_analysis:
  per_lemma:
    - lemma: "حَسَبٌ وَنَسَبٌ"
      decision: confirmed
      decision_reason: "تعبير عطفي ثابت في اللغة العربية يدل على الشرف الموروث والمكتسب معاً. شواهده غزيرة في المعاجم الكلاسيكية. يُكثر العرب من الجمع بين الحسب والنسب في سياق الفخر والمكانة. اللمّة تحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يختصّ بالمكانة الموروثة عن الآباء (النسب) والمكتسبة بالأفعال (الحسب) مجتمعتين، وهو أخصّ من رِفعة وشَرَف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَسَبٌ وَنَسَبٌ"

    - lemma: "رِفْعَة"
      decision: confirmed
      decision_reason: "لفظ فصيح ثابت في المعاجم بمعنى الشرف وارتفاع القدر والمنزلة. أكده المعجم الوسيط والمعجم الكبير. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على علو القدر والمنزلة بمعنى عام دون تخصيص بالآباء أو الأفعال، وهي أعمّ من حسب ونسب وأقرب إلى المعنى المجرد للارتفاع في المرتبة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِفْعَة"

    - lemma: "شَرَفٌ"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي أصيل بمعنى العلو والمجد، خصّه كثير من اللغويين بالشرف بالآباء (عُلُوّ الحسب). أدلة معجمية قوية من كتاب العين والقاموس المحيط والوسيط وابن سيده. يُثري المجموعة بلفظ مفرد شائع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على العلو والمجد المرتبط بالآباء خاصّةً عند كثير من اللغويين، وهو أخصّ من رِفعة (التي تشمل أي ارتفاع في القدر) وأعمّ من حسب ونسب (لأنه لا يستلزم الجمع بين الموروث والمكتسب)"
      actions:
        - command: create_entry
          params:
            lemma: "شَرَفٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "وَجَاهَة"
      source: stage1
      decision: removed
      decision_reason: "الوجاهة تعني الحُرمة والقدر والجاه، وهي أقرب إلى الهيبة والاحترام منها إلى المكانة الاجتماعية العالية بمعنى الرتبة في التسلسل الهرمي. الفرق الدلالي واضح: الوجاهة صفة تُنسب للشخص بينما المجموعة تصف موضعاً في سُلَّم اجتماعي."

    - lemma: "سُؤْدُد"
      source: stage1
      decision: removed
      decision_reason: "السؤدد بمعنى المجد والسيادة مفهوم أوسع من المكانة الاجتماعية العالية. السيادة تتضمن القيادة والتأثير وليست مجرد موضع في هرم اجتماعي."

    - lemma: "عِزَّة"
      source: stage1
      decision: removed
      decision_reason: "العزة في المعاجم تدل على القوة والغلبة والحمية والأنفة والتأبي عن حمل المذلة — وهي صفات نفسية وسلوكية لا مكانة اجتماعية. الأدلة تناقض الاستخدام المطلوب."


