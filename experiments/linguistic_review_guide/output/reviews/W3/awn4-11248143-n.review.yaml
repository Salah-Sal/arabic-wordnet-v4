# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-11248143-n | ILI: i96530
# المهندس المعماري آي. إم. بَيْ
# التاريخ: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (عمياء) ────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (آي إم بي، بي) تفتقران إلى التشكيل الكامل الإلزامي"
      - "تصنيف POS للمجموعة هو 'n' (اسم عام) بينما هذه المجموعة تمثّل اسمَ عَلَمٍ لشخص بعينه وينبغي أن تكون 'proper_noun'"
      - "لمّة الاسم الكامل (إيوه مينغ بي) مقابل الإنجليزية 'Ieoh Ming Pei' مفقودة من المجموعة"
      - "التعريف العربي لا يتضمّن سنة الوفاة (2019) وقد رحل المعماري، فأصبح التعريف ناقصاً"
      - "لمّة 'بي' وحيدة مبهمة ومضلِّلة دون سياق الاسم الكامل"
    observations: >
      هذه المجموعة الترادفية اسمُ عَلَمٍ لشخص تاريخي مشهور هو المهندس المعماري الأمريكي الصيني الأصل
      آي. إم. بَيْ (1917-2019)، صاحب هرم اللوفر وغيره من المعالم المعمارية البارزة.
      المجموعة تُصنَّف خطأً تحت POS العام (n) عوضاً عن (proper_noun)، وهي ظاهرة شائعة في
      WordNet الأصلي لأسماء الأعلام. اللمّتان الحاليّتان هما تعريبُ الحروف الأولى للاسم وتعريبُ اللقب،
      لكنّهما ناقصتا التشكيل، فضلاً عن غياب لمّة الاسم الميلادي الكامل (Ieoh Ming Pei).
      لا يُتوقَّع وجود مادة معجمية في قواعد البيانات العربية لهذا الاسم العَلَم تحديداً.

  blind_candidates:
    # التوليد العمياء: التعريف فقط هو "معماري أمريكي (ولد في الصين عام 1917)"
    # بما أن المفهوم اسم علم لشخص، فالمنهج الوحيد الممكن هو التعريب (taarib)
    - lemma: "إِيُوه مِينغ بَيْ"
      generation_method: taarib
      justification: >
        تعريب صوتي للاسم الميلادي الكامل كما يُنطق في الإنجليزية "Ieoh Ming Pei"؛
        الجزء الأول صوت صيني والأوسط اسم صيني والأخير اللقب العائلي، وهو النمط
        المتّبع في التعريب الصوتي لأسماء الأعلام الآسيوية في الإعلام العربي.
    - lemma: "آيْ إِمْ بَيْ"
      generation_method: taarib
      justification: >
        تعريب صوتي للصيغة المختصرة المتداولة "I. M. Pei"، وتُكتب الحروف الأولى
        بأسمائها الإنجليزية: آيْ (I) وإِمْ (M) ثم اللقب بَيْ (Pei)؛ وهي الصيغة
        الأكثر شيوعاً في المنابر الأكاديمية والإعلامية العربية.
    - lemma: "يُوه مِينغ بَيْ"
      generation_method: taarib
      justification: >
        تعريب بديل مختصر يحذف المقطع الأول "إي" من "Ieoh" ويبدأ من "Yoh Ming Pei"؛
        أسلوب تقريبي يُستخدم أحياناً حين يُعامل الاسم كأنه "Yoh Ming Pei".
    - lemma: "بَيْ يُوه مِينغ"
      generation_method: taarib
      justification: >
        ترتيب الاسم وفق النمط الصيني (اللقب أولاً) كما يُكتب الاسم في الصينية
        بَيْ يُوه مِينغ (贝聿铭)، وقد يُستخدم في المصادر العربية المتخصصة بالدراسات الشرقية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١. مطابقة دفعية: headword_norm IN ('اي ام بي','الاي ام بي','بي','البي','بيه','البيه',
#    'ايوه مينغ بي','الايوه مينغ بي','اي.ام.بي','اي ام باي')
# ٢. جسر إنجليزي: translation_en:"Pei" OR "I. M. Pei" OR "Ieoh Ming Pei" OR "architect"
# ٣. مرشحات المرحلة ١: headword_norm IN ('ايوه مينغ بي','الايوه مينغ بي','مينغ بي'...)
# ٤. FTS عربي: "معماري" OR "مهندس معماري" OR "الصين" OR "أمريكي"
stage2_evidence:
  per_lemma:
    - lemma: "آي إم بي"
      evidence_status: "no_material_found"
      # لم تُسفر المطابقة الدقيقة عن أي مدخل معجمي لهذه التعريبة المحددة.

    - lemma: "بي"
      contradicts:
        - text: "«البَيُّ: يقال لمن لا يُعرف أصله: هو هَيُّ بن بيّ. ويقال: أَيُّ هَيِّ بن بيِّ هو؟؛ أَيُّ الناس هو؟»"
          source: "المعجم الوسيط"
          conflict: >
            المعجم يُعرّف 'البيّ' بمعنى مجهول النسب أو الخسيس من الرجال، وهو معنى
            لا صلة له باسم العَلَم 'Pei' المراد. وجود هذا المعنى القديم يُشكّل خطر
            التباس دلالي ضعيف لأن الاسم العَلَم يتمايز بالتعريف والسياق.
        - text: "«البَيُّ: الخَسيسُ من الرِّجال، يُقال: هو هُـنُّ ابنُ بَيٍّ الذى لا يُعرَف أَصْلُه»"
          source: "المعجم الكبير"
          conflict: >
            تأكيد لنفس المعنى السلبي في المعجم الكبير؛ يُعزّز ضرورة التشكيل
            الصريح للمّة (بَيْ) لتمييزها عن (البيّ).
      expands:
        - text: "«بي: عن اللاتينية إحدى صيغ الاسم بياتريس بمعنى جالبة السعادة. يُستخدم للإناث.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يُثبت الدليل أن 'بي' مُستخدَم فعلاً كاسم علم في السياق العربي (وإن كان
            أصله لاتينياً وللإناث)، مما يُشير إلى أن استخدام 'بي' اسمَ علمٍ مألوف
            ومقبول صياغةً، ويدعم إبقاءه بعد تشكيله.

    # ─── مرشحات المرحلة ١ ───
    - lemma: "إِيُوه مِينغ بَيْ"
      evidence_status: "no_material_found"
      # لا توجد مداخل بهذا التعريب في القاعدة المعجمية.

    - lemma: "آيْ إِمْ بَيْ"
      evidence_status: "no_material_found"
      # مطابق للمّة الموجودة 'آي إم بي' بعد التطبيع، ولا توجد مداخل معجمية له.

    - lemma: "يُوه مِينغ بَيْ"
      evidence_status: "no_material_found"

    - lemma: "بَيْ يُوه مِينغ"
      evidence_status: "no_material_found"

  db_queries_log:
    - query_id: 1
      pattern: "batch_headword"
      terms_searched:
        - "اي ام بي"
        - "الاي ام بي"
        - "بي"
        - "البي"
        - "بيه"
        - "البيه"
        - "ايوه مينغ بي"
        - "الايوه مينغ بي"
      results_count: 13
      notes: "النتائج لـ'البي/البيّ' غير ذات صلة (معنى مجهول النسب). نتيجة 'بي' في موسوعة قابوس مفيدة."
    - query_id: 2
      pattern: "english_bridge"
      terms_searched: ["Pei", "I. M. Pei", "Ieoh Ming Pei", "architect"]
      results_count: 8
      notes: "أسفر عن مصطلحات 'معمار' و'مهندس معماري'؛ لا شيء خاص بالشخص."
    - query_id: 3
      pattern: "candidate_validation"
      terms_searched: ["ايوه مينغ بي", "مينغ بي", "بي يوه مينغ"]
      results_count: 0
      notes: "لا مداخل للمرشحات — متوقَّع لأسماء الأعلام الأجنبية."
    - query_id: 4
      pattern: "arabic_fts_keyword"
      terms_searched: ["معماري", "مهندس معماري", "الصين", "أمريكي"]
      results_count: 25
      notes: "مصطلحات معمارية عامة؛ لا شيء متعلق بالشخص."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ─── اللمّات الموجودة ───
    - lemma: "آي إم بي"
      decision: confirmed
      decision_reason: >
        تعريب مستقر للصيغة الأكثر تداولاً دولياً لاسم المعماري "I. M. Pei"؛ مقبول
        باعتباره اسم علم. يُحتفظ به مع إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
        notes: "مركب مزجي من تعريب ثلاثة مقاطع صوتية (حرفان + لقب)"
      loan_check:
        type: taarib
        verdict: "مقبول — التعريب الصوتي هو الأسلوب المعياري لأسماء الأعلام الأجنبية"
      morphological_fit: "لا ينطبق — اسم علم معرَّب غير خاضع لأوزان الاشتقاق العربي"
      nuance_differentiation: >
        الصيغة المختصرة الأكثر شيوعاً في المنابر الإعلامية والأكاديمية العربية؛
        تُستخدم حين يُشار إلى المعماري بلقبه المهني المعتمد دولياً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "آيْ إِمْ بَيْ"

    - lemma: "بي"
      decision: confirmed
      decision_reason: >
        تعريب اللقب العائلي "Pei" وحده — صيغة مختصرة للإحالة. رغم أن المعاجم الكلاسيكية
        تُعرّف 'البيّ' بمعنى الخسيس، إلا أن هذا الاشتراك اللفظي لا أثر له في السياق
        الحديث عند استخدامه اسم علم مشكَّلاً (بَيْ). يُحتفظ به مع التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      loan_check:
        type: taarib
        verdict: "مقبول — تعريب صوتي لمقطع صوتي واحد هو اللقب العائلي"
      morphological_fit: "لا ينطبق — اسم علم معرَّب"
      nuance_differentiation: >
        اللقب العائلي مُفرداً — يُستخدم في السياقات المختصرة والإحالات المتكررة
        داخل النص حين يكون الاسم الكامل قد سبق ذكره.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَيْ"

    # ─── مرشحات المرحلة ١ ───
    - lemma: "إِيُوه مِينغ بَيْ"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل اللمّة الإنجليزية "Ieoh Ming Pei" المُدرجة في قائمة OEWN الموسّعة ولكنها
        غائبة عن اللمّات العربية الحالية. الاسم الميلادي الكامل يستحق التمثيل لأنه
        يُستخدم في المصادر الموسوعية والأكاديمية العربية للتعريف الكامل بالشخص.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
        notes: "مركب مزجي من تعريب ثلاثة مقاطع اسمية صوتية"
      loan_check:
        type: taarib
        verdict: "مقبول — تعريب الاسم الميلادي الكامل بالترتيب الغربي"
      morphological_fit: "لا ينطبق — اسم علم معرَّب"
      nuance_differentiation: >
        الاسم الميلادي الكامل كما وُلد به المعماري؛ يُستخدم في السجلات الرسمية
        والمصادر الموسوعية للتعريف الكامل وللتمييز عن أفراد العائلة.
      actions:
        - command: create_entry
          params:
            lemma: "إِيُوه مِينغ بَيْ"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "يُوه مِينغ بَيْ"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب مختزل غير مستقر يحذف أول مقطع من الاسم "Ieoh"؛ لا يقابل أياً من
        اللمّات الإنجليزية المعتمدة ولا يوجد في مصادر عربية موثوقة.

    - lemma: "آيْ إِمْ بَيْ"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق بعد التطبيع للمّة الموجودة 'آي إم بي' — مكرر لا حاجة لإضافته.

    - lemma: "بَيْ يُوه مِينغ"
      source: stage1
      decision: removed
      decision_reason: >
        الترتيب الصيني (اللقب أولاً) غير مستخدم في التعريب العربي المعاصر لهذا الاسم؛
        قد يُسبّب التباساً مع أسماء عائلية أخرى.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
# اللمّات المؤكدة: آيْ إِمْ بَيْ | بَيْ | إِيُوه مِينغ بَيْ
stage4_content:
  definition:
    current: "معماري أمريكي (ولد في الصين عام 1917)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح جزئياً لكنه ناقص: (١) يُفيد بأنه لا يزال حياً إذ لم يذكر
        وفاته (توفي عام 2019 ولا سيما أن التاريخ الحالي 2026)، (٢) لا يذكر الاسم
        الصيني الأصل ولا أبرز منجزاته مما يجعله مختزلاً لشخصية من طراز عالمي،
        (٣) كلمة 'معماري' وحدها أقل دقة من 'مهندس معماري' في الاستخدام الحديث.
    authored:
      - type: encyclopedic
        text: >
          مهندسٌ معماريٌّ أمريكيٌّ من أصلٍ صينيٍّ (1917-2019)، وُلد في قوانغتشو
          وتلقَّى تعليمَه في جامعتَي ماساتشوستس وهارفارد، واشتُهر بأسلوبٍ تحديثيٍّ
          يمزج الهندسة الراقية بالمواد الحديثة، ومن أبرز أعماله هرمُ متحف اللوفر
          في باريس وبرجُ بنك الصين في هونغ كونغ ومتحفُ الفن الحديث في واشنطن.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            مهندسٌ معماريٌّ أمريكيٌّ من أصلٍ صينيٍّ (1917-2019)، وُلد في قوانغتشو
            وتلقَّى تعليمَه في جامعتَي ماساتشوستس وهارفارد، واشتُهر بأسلوبٍ تحديثيٍّ
            يمزج الهندسة الراقية بالمواد الحديثة، ومن أبرز أعماله هرمُ متحف اللوفر
            في باريس وبرجُ بنك الصين في هونغ كونغ ومتحفُ الفن الحديث في واشنطن.

  examples:
    per_lemma:
      - lemma: "آيْ إِمْ بَيْ"
        examples:
          - text: "صمَّم آيْ إِمْ بَيْ هرمَ اللوفر الزجاجي الذي غدا واحداً من أكثر المعالم المعمارية جدلاً وتميُّزاً في القرن العشرين."
            type: usage
      - lemma: "بَيْ"
        examples:
          - text: "يُعدُّ بَيْ من أبرز ممثّلي العمارة الحديثة الذين جمعوا بين الموروث الشرقي والتقنية الغربية في أعمال خالدة."
            type: usage
      - lemma: "إِيُوه مِينغ بَيْ"
        examples:
          - text: "وُلد إِيُوه مِينغ بَيْ في قوانغتشو عام 1917 لعائلة مصرفية عريقة، ورحل إلى الولايات المتحدة لإتمام دراسته المعمارية."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "صمَّم آيْ إِمْ بَيْ هرمَ اللوفر الزجاجي الذي غدا واحداً من أكثر المعالم المعمارية جدلاً وتميُّزاً في القرن العشرين."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدُّ بَيْ من أبرز ممثّلي العمارة الحديثة الذين جمعوا بين الموروث الشرقي والتقنية الغربية في أعمال خالدة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وُلد إِيُوه مِينغ بَيْ في قوانغتشو عام 1917 لعائلة مصرفية عريقة، ورحل إلى الولايات المتحدة لإتمام دراسته المعمارية."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
stage5_enrichment:
  per_entry:
    - lemma: "آيْ إِمْ بَيْ"
      entry_id: "{auto}"
      notes: >
        اسم علم معرَّب بالكامل — لا جذر عربي ولا اقتباس من مقاييس اللغة ينطبق عليه.
        المكوّنات: (آيْ = I) + (إِمْ = M) + (بَيْ = Pei اللقب الصيني).

    - lemma: "بَيْ"
      entry_id: "{auto}"
      notes: >
        لقب عائلي معرَّب صوتياً من الصينية 贝 (Bèi/Pei) — لا جذر عربي ينطبق عليه.
        يُلاحَظ وجود كلمة 'البيّ' بمعنى مجهول النسب في المعاجم الكلاسيكية (جذر: بيي)
        لكنها غير ذات صلة باسم العَلَم، والتشكيل يُزيل الإبهام.

    - lemma: "إِيُوه مِينغ بَيْ"
      entry_id: "{auto}"
      notes: >
        اسم ميلادي كامل معرَّب صوتياً: (إِيُوه = Ieoh) + (مِينغ = Ming) + (بَيْ = Pei).
        لا جذر عربي ولا مقاييس تنطبق. الاسم الصيني الكامل: 贝聿铭 (Bèi Yùmíng).

  per_sense:
    - lemma: "آيْ إِمْ بَيْ"
      sense_id: "{auto}"
      nuance: >
        الصيغة الأكثر تداولاً وانتشاراً في الإعلام والأكاديميا العربية؛
        تمثّل الهوية المهنية الدولية للمعماري كما يُعرَّف في المنابر العالمية.
      mwe: true

    - lemma: "بَيْ"
      sense_id: "{auto}"
      nuance: >
