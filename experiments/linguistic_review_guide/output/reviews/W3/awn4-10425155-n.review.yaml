# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'صاحب براءة اختراع' مفتقرة إلى التشكيل الكامل"
      - "المجموعة تقتصر على لمّة مركّبة واحدة دون ضمّ البديل العربي الموثَّق 'حامل براءة اختراع'"
      - "التعريف العربي الحالي يكرِّر مادة 'اخترع' مرتين (المخترع / براءة اختراع) مما يقرّبه من الدوران المعجمي"
    observations: "المفهوم خاصٌّ بمن صدرت له وثيقة براءة اختراع رسمية. الجنس القريب هو المخترع، والفصل النوعي هو حيازة البراءة. المصطلح العربي الحديث يتوزع بين 'صاحب' الدالة على التملك القانوني و'حامل' الدالة على الحيازة الفعلية. كلا الصيغتين مُثبَتتان في معاجم الاصطلاح الحديثة. لا وجود لمصطلح أحادي مسكوك لهذا المفهوم في العربية، إذ يُعبَّر عنه حصراً بتعابير مركّبة."
  blind_candidates:
    - lemma: "حَامِلُ الْبَرَاءَةِ"
      generation_method: tarkib
      justification: "مركب إضافي: حامِل (اسم فاعل من حَمَلَ = يحوز الشيء ويُمسك به) + البراءة (الوثيقة الرسمية). يُعبِّر عن واجد البراءة وحائزها، وهو مقابل طبيعي لـ patent holder."
    - lemma: "مَمْنُوحُ الْبَرَاءَةِ"
      generation_method: tarkib
      justification: "مركب إضافي: ممنوح (اسم مفعول من مَنَحَ = أُعطي) + البراءة. يُركِّز على الطابع الإسنادي للمفهوم؛ البراءة مَنَحَتْها جهةٌ مختصة لشخص بعينه، مما يُميِّزه عن سائر المخترعين."
    - lemma: "الْحَائِزُ عَلَى الْبَرَاءَةِ"
      generation_method: majaz
      justification: "من حاز يحوز = ضمَّ الشيء إلى نفسه وتملَّكه (المقاييس). إزاحة دلالية: الحائز على البراءة = من ضمَّ إليه حقَّ التملك القانوني لاختراعه بموجب وثيقة رسمية."
    - lemma: "الْمُخْتَرِعُ الْمُرَخَّصُ"
      generation_method: tarkib
      justification: "مركب وصفي: المخترع (الجنس) + المرخَّص (اسم مفعول من رخَّص = أَذِنَ وأَجَازَ). يُضيِّق الدلالة على المخترع الذي نال إذناً رسمياً وترخيصاً من جهة مختصة."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة (٤ استعلامات):
#   ١. batch headword: براءة/اختراع/صاحب/حامل/ممنوح/مجاز/حائز + ال- variants
#   ٢. English bridge: patentee / patent holder / patent owner / patent grantee
#   ٣. Arabic FTS: براءة اختراع / صاحب البراءة / حامل البراءة / مانح البراءة
#   ٤. Maqayis al-Lugha: جذور برأ / صحب / حمل / خرع / حوز / منح
stage2_evidence:
  per_lemma:
    - lemma: "صاحب براءة اختراع"
      confirm:
        - text: "«صاحبُ البراءَة أو الامتياز.»"
          source: "المورد الحديث (2008) — المعجم الموحد، entry_id 706490، [translation_en: patentee]"
      expands:
        - text: "«براءة اختراع: سند أو وثيقة تسلمها الهيئات المختصة عبر المكتب المكلف بالملكية الصناعية للشخص المخترع تثبت حق الاختراع على اختراعه، بحيث يصبح له الحق وحده في استغلال ما اخترعه، وذلك خلال مدة معينة ووفقاً لبعض الشروط التي تختلف من تشريع لآخر.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يوضِّح طبيعة البراءة التي يصدر لصاحبها: وثيقة رسمية حصرية تُثبت حق الاختراع وتُخوِّل الاستغلال الانفرادي خلال مدة محددة"
        - text: "«الصَّادُ وَالْحَاءُ وَالْبَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُقَارَنَةِ شَيْءٍ وَمُقَارَبَتِهِ. مِنْ ذَلِكَ الصَّاحِبُ... وَيُقَالُ لِمَالِكِ الشَّيْءِ صَاحِبُهُ، وَكَذَا لِمَنْ يَمْلِكُ التَّصَرُّفَ فِيهِ»"
          source: "مقاييس اللغة لابن فارس + التوقيف على مهمات التعاريف للمناوي"
          addition: "يُثبت أن 'صاحب' تدل على مالك الشيء وحائز التصرف فيه، مما يدعم استخدامها للدلالة على من يملك البراءة ويتصرف في حقوقها"

    - lemma: "حَامِلُ الْبَرَاءَةِ"
      confirm:
        - text: "«حامل براءة اختراع» [translation_en: patent holder]"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) — entry_id 408629"
      expands:
        - text: "«الْحَاءُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِقْلَالِ الشَّيْءِ. يُقَالُ حَمَلْتُ الشَّيْءَ أَحْمِلُهُ حَمْلًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُثبت أن الحامل هو من يرفع الشيء ويُمسك به؛ استعارةٌ طبيعية للدلالة على من يحوز وثيقة البراءة ويملك حقوقها"

    - lemma: "مَمْنُوحُ الْبَرَاءَةِ"
      expands:
        - text: "«الممنوح: المركب الحرفي في فئة الأفعال ذوي مفعولين. مثال: المركب الحرفي 'لعمرو' هو الممنوح في 'أعطى زيد كتاباً لعمرو'»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يُثبت أن 'ممنوح' يُستخدم في العربية الحديثة للدلالة على المتلقّي في سياق المنح، مما يدعم صياغة 'ممنوح البراءة' من الناحية الصرفية"
        - text: "«مَنَحَ: الْمِيمُ وَالنُّونُ وَالْحَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى عَطِيَّةٍ. قَالَ الْأَصْمَعِيُّ: يُقَالُ امْتُنِحْتُ الْمَالَ أَيْ رُزِقْتُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على العطية والمنح؛ 'ممنوح البراءة' = من أُعطيت له البراءة رزقاً ومنحاً من جهة مختصة"

    - lemma: "الْحَائِزُ عَلَى الْبَرَاءَةِ"
      expands:
        - text: "«حَائِز: من ينال الشيء ويملكه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُثبت المعنى الأصلي للحائز: من ينال الشيء ويملكه؛ يدعم المجاز الدلالي للدلالة على من نال حق البراءة وتملَّكه"
        - text: "«حَوَزَ: الْحَاءُ وَالْوَاوُ وَالزَّاءُ أَصْلٌ وَاحِدٌ وَهُوَ الْجَمْعُ وَالتَّجَمُّعُ... وَكُلُّ مَنْ ضَمَّ شَيْئًا إِلَى نَفْسِهِ فَقَدْ حَازَهُ حَوْزًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُؤكِّد معنى الحيازة والضمّ إلى النفس؛ لكن 'الحائز على البراءة' بنيةٌ طويلة غير مُثبتة اصطلاحاً"

    - lemma: "الْمُخْتَرِعُ الْمُرَخَّصُ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "صاحب براءة اختراع"
      decision: confirmed
      decision_reason: "مُثبَت في المورد الحديث (2008) مباشرةً بمعنى patentee مطابق للمجموعة. التعبير مركب إضافي راسخ في الاصطلاح القانوني والتجاري العربي الحديث. يجتاز اختبار السكّ: لا يمكن إبدال 'صاحب' بـ'مالك' أو 'واجد' والحصول على المصطلح ذاته. اللمّة مفتقرة إلى التشكيل → update_lemma."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُركِّز على جانب التملك القانوني والحقوق الملكية (صاحب = مالك الشيء وحائز التصرف فيه)؛ يُستعمل أكثر في السياق الرسمي القانوني والتعاقدي وفي وثائق الملكية الفكرية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَاحِبُ بَرَاءَةِ اخْتِرَاعٍ"

    - lemma: "حَامِلُ الْبَرَاءَةِ"
      source: stage1
      decision: confirmed
      decision_reason: "مُثبَت مباشرةً في المعجم الموحد لمصطلحات التجارة والمحاسبة (1995) بصيغة 'حامل براءة اختراع' = patent holder. تعبير مركب إضافي ثابت يجتاز اختبار السكّ: 'حامل' لا يُبدَّل بعشوائية. الصيغة المُثبتة في arabterm تُتَّخذ أساساً للمدخل الجديد بصيغتها الكاملة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُركِّز على جانب الحيازة الفعلية للوثيقة وحملها (حامل = من يقلّ الشيء ويُمسك به)؛ أشيع في سياق نقل الحقوق وتداول الملكية الفكرية تجارياً."
      actions:
        - command: create_entry
          params: {lemma: "حَامِلُ بَرَاءَةِ اخْتِرَاعٍ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَمْنُوحُ الْبَرَاءَةِ"
      source: stage1
      decision: removed
      decision_reason: "التعبير وصفي حرٌّ لا مصطلحٌ مسكوك: يمكن إبدال 'البراءة' بأي مفعول ('ممنوح الجائزة'، 'ممنوح الدرجة') دون أن يفقد صلاحيته كوصف، وهو ما يُسقطه في اختبار السكّ. لم يرد اصطلاحاً ثابتاً في أي من معاجم الاصطلاح الحديثة بمعنى patentee."

    - lemma: "الْحَائِزُ عَلَى الْبَرَاءَةِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي تحليلي طويل (فاعل + جار ومجرور) غير مُسكوك معجمياً. بنية 'فاعل + على + مفعول' ليست وحدة معجمية ثابتة في العربية الاصطلاحية. الأجدر الاكتفاء بـ'حامل براءة اختراع' المُثبَت مباشرةً."

    - lemma: "الْمُخْتَرِعُ الْمُرَخَّصُ"
      source: stage1
      decision: removed
      decision_reason: "'مرخَّص' تعني 'مأذون له/مجاز' لا 'حامل براءة' تحديداً؛ الترخيص أعمُّ من البراءة ويشمل مَن يُرخَّص له استخدام اختراع الغير أيضاً. ثمة خلط دلالي مع 'صاحب الرخصة'. لا شواهد على استخدام هذا المركب اصطلاحاً مقابل patentee."


