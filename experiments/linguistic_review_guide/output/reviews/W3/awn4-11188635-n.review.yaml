# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى الموجودة ──
    - lemma: "سايروس ماكورميك"
      decision: confirmed
      decision_reason: >
        التعريب الصوتي المعياري لـ Cyrus McCormick؛ الاسم الثنائي الكامل هو الصيغة المعيارية
        الأكثر دقةً وشيوعًا في المصادر الموسوعية العربية للإشارة إلى هذا المخترع.
        غياب الأدلة المعجمية متوقَّع إذ إن المعاجم العربية لا تُدرج أسماء الأعلام الأجنبية عادةً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: >
        الصيغة المزدوجة (الاسم الأول + اسم العائلة) هي الأكثر تحديدًا وإزالةً للإبهام؛
        تُستخدم في المقامات الرسمية والموسوعية وعند أول ذكر للشخص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَايِروس مَاكُورْمِيك"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── اللمّة الثانية الموجودة ──
    - lemma: "ماكورميك"
      decision: confirmed
      decision_reason: >
        اسم العائلة المنفرد صيغة مختصرة مقبولة تُستخدم في السياق التقني والتاريخي بعد ورود
        الاسم الكامل. تتبع أسلوب الاختصار المعياري بالاسم الأخير في الكتابة الأكاديمية.
        ينبغي تصحيح التشكيل وتحديد POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صيغة مبتورة تُستخدم بعد التعريف الأول بالاسم الثنائي الكامل؛ أكثر اختصارًا وأقل
        تحديدًا في حالة الاستخدام المنفرد. قد تُحيل نظريًّا لأفراد آخرين من آل ماكورميك.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَاكُورْمِيك"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشح المرحلة ١ — الاسم الكامل الثلاثي ──
    - lemma: "سَايِروس هُول مَاكُورْمِيك"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الكامل الثلاثي (Cyrus Hall McCormick) هو الاسم الرسمي الموسوعي لهذا المخترع،
        ويُستخدم في المراجع الأكاديمية والموسوعات للتمييز الدقيق. نظيره الإنجليزي
        "Cyrus Hall McCormick" مُدرَج في OEWN بوصفه لمّة مستقلة. غياب الأدلة المعجمية
        متوقَّع لأسماء الأعلام الأجنبية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: >
        الصيغة الكاملة ثلاثية الأجزاء تُستخدم في السياقات الرسمية والوثائقية والموسوعية
        التي تستلزم التعريف القاطع للشخص تمييزًا عن أقاربه (ابنه Cyrus McCormick II مثلًا).
      actions:
        - command: create_entry
          params:
            lemma: "سَايِروس هُول مَاكُورْمِيك"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — التعريب البديل ──
    - lemma: "سِيرُوس مَاكُورْمِيك"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب «سِيرُوس» أقل شيوعًا وأقل مطابقةً للنطق الإنجليزي الأمريكي الفعلي لـ Cyrus.
        الصيغة «سَايِروس» هي التعريب المعياري المعتمد في المصادر العربية الحديثة.
        إدراج صيغة أقل دقةً يُربك المستخدمين دون إضافة حقيقية.

  synset_actions:
