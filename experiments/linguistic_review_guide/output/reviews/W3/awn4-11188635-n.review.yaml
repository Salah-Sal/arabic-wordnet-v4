# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11188635-n | ILI: i96183
# الموضوع: سايروس ماكورميك — مخترع الحاصدة الميكانيكية
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "صنف المجموعة (pos) مسجَّل بوصفه n (اسم) في حين أن المجموعة تمثّل اسم علم لشخص بعينه؛ ينبغي أن يكون pos المدخل proper_noun"
      - "اللمّتان الموجودتان (سايروس ماكورميك، ماكورميك) تفتقران إلى التشكيل الكامل المطلوب"
      - "لمّة (ماكورميك) وحدها غامضة ومبتورة؛ فهي تحيل إلى اسم العائلة فقط دون تمييز عن أفراد آخرين يحملون الاسم ذاته"
      - "الاسم الكامل الثلاثي (Cyrus Hall McCormick) غائب عن اللمّات العربية"
    observations: >
      المجموعة awn4-11188635-n هي مجموعة ترادفية لاسم علم (proper noun) يشير إلى
      سايروس هول ماكورميك (1809-1884)، المخترع الأمريكي الذي طوّر الحاصدة الميكانيكية عام 1831
      وأسّس شركة ماكورميك للآلات الزراعية. بما أن المجموعة تمثّل شخصًا تاريخيًّا بعينه
      بتواريخ ميلاد ووفاة محددة، فإن اللمّات لا تكون إلا تعريبات (ترجمة صوتية) للاسم الإنجليزي،
      وليس ثمة طريقة اشتقاقية أو مجازية أو تركيبية عربية مناسبة.
      التشكيل غائب عن اللمّات الحالية. القضية المحورية هي صواب تصنيف POS
      على مستوى المدخل وضبط التشكيل.

  blind_candidates:
    - lemma: "سَايِروس مَاكُورْمِيك"
      generation_method: taarib
      justification: >
        التعريب المعياري للاسم الإنجليزي Cyrus McCormick؛ «سَايِروس» ترجمة صوتية لـ Cyrus،
        و«مَاكُورْمِيك» ترجمة صوتية لـ McCormick. هذا الشكل هو الأكثر تداولاً في المصادر
        العربية عند الإشارة إلى هذا المخترع بالاسم الكامل المزدوج.
    - lemma: "مَاكُورْمِيك"
      generation_method: taarib
      justification: >
        اسم العائلة منفردًا بوصفه صيغة مختصرة شائعة في السياق التقني والتاريخي حين يكون
        المقصود واضحًا من السياق. يتبع أسلوب التعريب الصوتي لـ McCormick.
    - lemma: "سَايِروس هُول مَاكُورْمِيك"
      generation_method: taarib
      justification: >
        الاسم الرباعي الكامل (Cyrus Hall McCormick) بتعريب صوتي شامل؛ «هُول» لـ Hall.
        هذا الشكل ضروري للتمييز القانوني والموسوعي عن بقية حاملي الاسم الأساسي.
    - lemma: "سِيرُوس مَاكُورْمِيك"
      generation_method: taarib
      justification: >
        تعريب بديل لـ Cyrus عبر النطق اللاتيني القديم «سِيرُوس»، مستخدَم في بعض المصادر
        العربية الكلاسيكية الحديثة تمييزًا عن النطق الإنجليزي الحديث «سَايِروس».


