stage4_content:
  definition:
    current: "مخترع ومصنع أمريكي للحاصدة الميكانيكية (1809-1884)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وصفيٌّ موجز لكنه يفتقر إلى السياق التاريخي الكافي وذكر مساهمته
        الجوهرية في الزراعة الميكانيكية. أسلوبه أقرب إلى الترجمة الحرفية للتعريف الإنجليزي
        دون الوفاء بمعايير التعريف الموسوعي بأسلوب المعجم الوسيط.
    authored:
      - type: encyclopedic
        text: >
          سَايِروس هُول مَاكُورْمِيك (1809-1884)، مخترعٌ وصناعيٌّ أمريكي، وُلد في مقاطعة
          روكبريدج بولاية فيرجينيا. اخترع الحاصدةَ الميكانيكية عام 1831 وطوّرها حتى حصل
          على براءة اختراعها عام 1834، ثم أسّس عام 1847 شركةَ ماكورميك للآلات الزراعية
          في شيكاغو التي غدت لاحقًا النواة الأولى لشركة إنترناشيونال هارفستر. أحدثت
          حاصدته ثورةً في الإنتاج الزراعي الأمريكي وأسهمت في التحوّل إلى الزراعة
          الصناعية الواسعة.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            سَايِروس هُول مَاكُورْمِيك (1809-1884)، مخترعٌ وصناعيٌّ أمريكي، اخترع الحاصدةَ
            الميكانيكية عام 1831 وأسّس شركةَ ماكورميك للآلات الزراعية، فأحدث ثورةً في
            الإنتاج الزراعي وأسهم في تطور الزراعة الصناعية الحديثة.

