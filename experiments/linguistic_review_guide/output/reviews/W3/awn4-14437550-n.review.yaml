# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-14437550-n (reprobation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«إدانة» مصطلح قانوني بالدرجة الأولى (conviction/condemnation)، ولا يحمل بُعداً لاهوتياً واضحاً يدل على الإبعاد الإلهي الأبدي"
      - "«نبذ إلهي» عبارة وصفية حرة وليست مصطلحاً معجمياً ثابتاً — يمكن إبدال «إلهي» بـ«رباني» أو «سماوي» مع بقاء المعنى"
      - "التعريف العربي ترجمة حرفية شبه كاملة للتعريف الإنجليزي، وينبغي تأليفه بأسلوب عربي معجمي"
    observations: "المفهوم لاهوتي مسيحي بالأساس (الكالفينية): حُكم الله المسبق على بعض البشر بالشقاء الأبدي. في الموروث الإسلامي يقابله مفهوم «الخِذلان» عند الأشاعرة أو «اللعنة» بمعنى الإبعاد من رحمة الله. اللمّتان الموجودتان لا تغطيان البعد اللاهوتي الخاص بالمصطلح تغطيةً دقيقة."
  blind_candidates:
    - lemma: "لَعْنَة"
      generation_method: majaz
      justification: "اللعنة في الاصطلاح الشرعي: إبعاد الله العبدَ من رحمته، وهو المعنى الجوهري للمفهوم (rejection by God). اللفظ حيّ مستعمل في القرآن والحديث والتراث اللاهوتي."
    - lemma: "خِذْلَان"
      generation_method: ishtiqaq
      justification: "من الجذر «خ ذ ل» على وزن فِعْلان، مصطلح كلامي أشعري يعني خلقَ قدرة المعصية في العبد وتركَ معونته، وهو أقرب مقابل إسلامي لمفهوم الـreprobation."
    - lemma: "مَقْت"
      generation_method: majaz
      justification: "المقت أشد البغض، وقد ورد في القرآن منسوباً لله تعالى: {كَبُرَ مَقْتاً عِندَ اللَّهِ}. يحمل دلالة الرفض الإلهي الشديد."
    - lemma: "شَقَاوَة"
      generation_method: ishtiqaq
      justification: "من الجذر «ش ق و» على وزن فَعَالَة، ضد السعادة. المفهوم يتضمن حالة الحكم بالشقاء الأبدي، والشقاوة تدل على هذه الحالة عند المتكلمين."

stage2_evidence:
  per_lemma:
    - lemma: "إِدَانَة"
      confirm:
        - text: "«صدور مقرر قضائي من طرف المحكمة يقضي بثبوت الجريمة أو الجرائم المرتكبة من طرف المتهم، ومعاقبته من أجل ذلك.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«condemnation»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«إِدَانة — الجذر: د ي ن — مثال: حكمت المحكمة بإدانته — الرأي: مرفوضة — السبب: لأن هذا المعنى لم يرد في المعاجم. المعنى: إثبات الجريمة عليه — الصواب والرتبة: حكمت المحكمة بإدانته [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "المعنى المعجمي المسجل قانوني-قضائي (إثبات الجريمة)، لا لاهوتي"
      expands:
        - text: "«(1) شَجْب (2) إدانة (3) حُكمٌ على (4) المُدانيّة؛ المحكوميّة: كون المرء مُدانًا أو محكومًا عليه (5) سبب الإدانة إلخ (6) مصادرة الممتلكات [من أجل المصلحة العامة].»"
          source: "المورد الحديث (2008) — مقابل condemnation"
          addition: "المورد يربط إدانة بمفهوم condemnation العام لا بالمعنى اللاهوتي خاصة"

    - lemma: "نَبْذ إِلٰهِيّ"
      expands:
        - text: "«النَّبْذُ: إلقاء الشيء وطرحه لقلة الاعتداد به»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "النبذ يعني الطرح والإلقاء، لكن المركب «نبذ إلهي» غير مسجل كوحدة معجمية"
        - text: "«(نَبَذَ) النُّونُ وَالْبَاءُ وَالذَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى طَرْحٍ وَإِلْقَاءٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الطرح والإلقاء مطلقاً، لا على الإبعاد الإلهي"

    - lemma: "لَعْنَة"
      confirm:
        - text: "«اللَّعْنة: شرعاً إبعاد الله من رحمته في الدنيا بانقطاع التوفيق وفي العقبى بالابتلاء بالعقوبة.»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«اللّعنة: في الأصل الطّرد، وشرعاً إبعاد الله العبد من رحمته في الدنيا بانقطاع التوفيق وفي العقبى بالابتلاء بالعقوبة [...] وأمّا في حقّ المؤمنين فإسقاطهم عن درجة الأبرار ومقام الصالحين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«اللعنة خلاف النصر. قال تعالى: {وَمَنْ يَلْعَنِ اللَّهُ فَلَنْ تَجِدَ لَهُ نَصِيرًا} وهي في اللغة: الطرد.»"
          source: "مفردات القرآن للفراهي"
      expands:
        - text: "«(اللَّعْنَة) الْعَذَاب يُقَال أَصَابَته لعنة من السَّمَاء (ج) لعان ولعنات»"
          source: "المعجم الوسيط"
          addition: "اللعنة تعني أيضاً العذاب النازل من السماء"
        - text: "«(1) «أ» الإدانة؛ اللَّعْن. «ب» المُدانيّة؛ الملعونيّة: كون الشيء مُدانًا أو ملعونًا (2) الخطيئة المُمِيتة: خطيئة يستحق صاحبها العقوبة السرمدية»"
          source: "المورد الحديث (2008) — مقابل damnation"
          addition: "المورد يقرن اللعن بالإدانة في المعنى اللاهوتي ويربطه بالعقوبة السرمدية"

    - lemma: "خِذْلَان"
      confirm:
        - text: "«الخِذْلانُ: خلق الْقُدْرَة على الْمعْصِيَة.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الخذلان: خلق قدرة المعصية في العبد [...] وخذله تخذيلاً حمله على الفشل وترك القتال.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الخذلان: [...] وعند المعتزلة هو منع اللطف»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الخذلان مصطلح كلامي يعني ترك المعونة الإلهية، لا الحكم بالعذاب الأبدي"
      expands:
        - text: "«(خَذَلَ) الْخَاءُ وَالذَّالُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَرْكِ الشَّيْءِ وَالْقُعُودِ عَنْهُ. فَالْخِذْلَانُ: تَرْكُ الْمَعُونَةِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدل على الترك والقعود، والخذلان تحديداً ترك المعونة"

    - lemma: "مَقْت"
      contradicts:
        - text: "«المقت: بغض شديد ناشئ عن فعل قبيح.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المقت حالة شعورية (أشد البغض) وليس حُكماً بالشقاء الأبدي"
        - text: "«(مَقَتَ) الْمِيمُ وَالْقَافُ وَالتَّاءُ كَلِمَةٌ وَاحِدَةٌ تَدَلُّ عَلَى شَنَاءَةٍ وَقُبْحٍ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدل على البغض والشناءة لا على الحكم والإدانة"

    - lemma: "شَقَاوَة"
      confirm:
        - text: "«الشقاوة: ضد السعادة، وكما أن السعادة ضربان: أخروية ودنيوية ثم الدنيوية ثلاثة أضرب: سعادة نفسية وبدنية وخارجية فالشقاء كذلك.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«(الشقاوة) الشَّقَاء»"
          source: "المعجم الوسيط"
          conflict: "الشقاوة مفهوم عام مقابل للسعادة، لا يختص بالحكم الإلهي بالعذاب الأبدي"
      expands:
        - text: "«(شَقُوَ) الشِّينُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى الْمُعَانَاةِ وَخِلَافِ السُّهُولَةِ وَالسَّعَادَةِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يشمل المعاناة عموماً ولا يختص بالإبعاد الإلهي"

stage3_analysis:
  per_lemma:
    - lemma: "إِدَانَة"
      decision: confirmed
      decision_reason: "رغم أن الاستعمال الغالب قانوني، فإن «إدانة» تصلح للدلالة على الحكم بالعقوبة — وهو أحد وجهَيِ المفهوم (condemnation). المورد الحديث يستعملها مقابل condemnation وdamnation. تُبقى مع تسجيل الفارق الدلالي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على جانب الحكم والقضاء بالعقوبة (condemnation)، وتغلب عليها الدلالة القانونية-القضائية أكثر من الدلالة اللاهوتية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِدَانَة"

    - lemma: "نَبْذ إِلٰهِيّ"
      decision: removed
      decision_reason: "عبارة وصفية حرة لا مصطلح ثابت — يجتاز اختبار الاستبدال (نبذ ربّاني، رفض إلهي) مما يدل على أنه تركيب حر لا وحدة معجمية مسكوكة. لم يُسجَّل في أي معجم كمصطلح."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "لَعْنَة"
      source: stage1
      decision: confirmed
      decision_reason: "أدلة معجمية قوية من مصادر متعددة: البركتي والتهانوي والفراهي يعرّفونها بأنها إبعاد الله العبد من رحمته في الدنيا والآخرة. هذا مطابق تماماً لمفهوم الـreprobation. المورد يقرنها بـdamnation."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على الإبعاد الإلهي من الرحمة والطرد من الخير — الجانب اللاهوتي من المفهوم (rejection by God)، بخلاف «إدانة» التي تركز على جانب الحكم القضائي"
      actions:
        - command: create_entry
          params: {lemma: "لَعْنَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "خِذْلَان"
      source: stage1
      decision: removed
      decision_reason: "الخذلان مصطلح كلامي أشعري يعني خلق قدرة المعصية في العبد أو ترك المعونة الإلهية، وهو مختلف عن مفهوم الحكم بالشقاء الأبدي في الجحيم. الفرق جوهري: الخذلان ترك، والـreprobation حُكم إيجابي بالعذاب."

    - lemma: "مَقْت"
      source: stage1
      decision: removed
      decision_reason: "المقت حالة شعورية (أشد البغض) وليس حالة حُكمية. المفهوم المطلوب هو «حالة الحكم بالشقاء الأبدي» لا «الشعور بالبغض الشديد». الفرق بين المقت والإدانة كالفرق بين الكراهية والحكم."

    - lemma: "شَقَاوَة"
      source: stage1
      decision: removed
      decision_reason: "الشقاوة مفهوم عام يقابل السعادة ويشمل الدنيوية والأخروية، ولا يختص بالحكم الإلهي بالعذاب الأبدي. هو حالة المعاناة لا فعل الحكم والإبعاد الإلهي."

