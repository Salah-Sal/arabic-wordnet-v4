# ── المرحلة ١: المراجعة والتوليد (أعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «مُتأهل للنهائي» تفتقر إلى التشكيل الكامل"
      - "«للنهائي» بصيغة المفرد قد لا تعبّر عن «المراحل النهائية» بدقة، إذ الأنسب «لِلنِّهَائِيَّات» (جمع) أو «لِلنِّهَائِيِّ» (المباراة النهائية بعينها)"
      - "المجموعة تفتقر إلى لمّة أحادية مفردة شائعة الاستخدام في الصحافة الرياضية العربية"
      - "التعريف العربي مقبول لكنه يفتقر إلى التشكيل ويمكن صياغته بأسلوب أكثر إحكاماً"
    observations: >
      المفهوم المقصود هو «المتسابق الذي يبلغ الأدوار النهائية في منافسة» (finalist بالإنجليزية).
      هذا مفهوم شائع في الصحافة الرياضية العربية، ويُعبَّر عنه عادةً بـ«المتأهّل» أو «المتأهّل للنهائي».
      الجذر (أهل) راسخ في العربية بمعنى الصلاحية والاستحقاق، والمزيد (تَأَهَّل) يفيد بلوغ مرحلة
      يصير فيها الشخص أهلاً لأمر ما؛ وهو استخدام دقيق لوصف التأهل في المسابقات.
      الهرمي المباشر (awn4-10552570-n) يضم «منافس» و«خصم»، مما يؤكد السياق التنافسي.

  blind_candidates:
    - lemma: "مُتَأَهِّل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل «تَأَهَّلَ» (باب التَّفَعُّل) من جذر (أهل). يفيد من صار أهلاً لأمر
        وبلغ مرحلة مؤهِّلة. يُستخدم على نطاق واسع في الصحافة الرياضية العربية للدلالة
        على من اجتاز الأدوار التمهيدية وبلغ النهائيات. يمتاز بأنه مفرد واضح يقبل الجمع
        (مُتَأَهِّلون) والتأنيث (مُتَأَهِّلة) وإضافة الجار والمجرور.
    - lemma: "بَالِغُ النِّهَائِيَّات"
      generation_method: tarkib
      justification: >
        مركب إضافي من «بالغ» (اسم فاعل من بَلَغَ، جذر بلغ) و«النهائيات» (جمع النهائية،
        جذر نهي). يُفيد بدقة الوصول إلى الأدوار النهائية، مع تمييز «النهائيات» جمعاً
        عن «النهائي» المفرد. التركيب إضافي واضح البنية.
    - lemma: "نِهَائِيّ"
      generation_method: majaz
      justification: >
        إزاحة دلالية بتحويل الصفة «نهائيّ» إلى اسم بالتضمين الاسمي، على غرار «دَوْلِيّ»
        (اللاعب الدولي → الدولي) و«إقليمي». يُستخدم في التعليق الرياضي الشفهي أحياناً
        للدلالة على المتنافس في الدور النهائي.
    - lemma: "خَاتِمِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى «خاتِمة» (النهاية)، من جذر (ختم) الدال على بلوغ آخر الشيء كما في مقاييس
        اللغة: «بلوغ آخر الشيء». يُفيد نسبة الشخص إلى المرحلة الخاتمة/النهائية.
        محاولة إحياء الجذر العربي بدلاً من اللفظ المركّب.


