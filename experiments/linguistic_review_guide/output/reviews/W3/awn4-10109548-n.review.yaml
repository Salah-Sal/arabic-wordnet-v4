# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "مُتأهل للنهائي"
      decision: confirmed
      decision_reason: >
        المركب معروف في الاستخدام الرياضي العربي المعاصر وهو إضافي الطابع (مُتَأَهِّل + لِلنِّهَائِيِّ).
        غير أنه يحتاج إلى تصحيح تشكيل كامل، ويُفضَّل ضبط «للنهائي» على أنه يعني
        «للمباراة النهائية» بعينها (وهو التفسير الأدق إذ الـfinalist يصل إلى نهائي واحد محدد).
        المركب ثابت في الاستخدام الصحفي ويجتاز اختبار السكّ: لا يمكن إبدال «للنهائي»
        بـ«للدور التالي» دون تغيير الدلالة الجوهرية المرتبطة تحديداً بالنهائي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُحدِّد بدقة المرحلةَ المقصودة وهي النهائي بعينه، لا مجرد التأهل العام؛
        ومن ثَمَّ يكون أشد تخصيصاً من «مُتَأَهِّل» المجرد الذي قد يُفيد التأهل لأي مرحلة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَأَهِّلٌ لِلنِّهَائِيِّ"

    # ── مرشّح المرحلة ١: مُتَأَهِّل ──
    - lemma: "مُتَأَهِّل"
      source: stage1
      decision: confirmed
      decision_reason: >
        اسم فاعل راسخ من جذر (أهل) على وزن مُتَفَعِّل، ثابت في المعاجم الكلاسيكية والحديثة.
        يُستخدم بكثافة في الصحافة الرياضية العربية للدلالة على من بلغ الأدوار النهائية.
        اجتاز اختبارات الجودة الستة: يمتاز بالاطّراد الصرفي (جمعه: مُتَأَهِّلون، مؤنثه:
        مُتَأَهِّلة)، ويُسر التداول، وملاءمة الوزن الصرفي للفاعلية، وأصالته العربية الخالصة،
        واشتقاقيته المنتجة. القيد الوحيد: يحمل في التراث الكلاسيكي معنى «المتزوج»، غير أن
        السياق الرياضي يرفع هذا الالتباس.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ وأشيع في الاستخدام اليومي والصحفي؛ يُكتفى به حين يكون السياق كافياً،
        بخلاف «مُتَأَهِّلٌ لِلنِّهَائِيِّ» الذي يُحدِّد المرحلة تحديداً صريحاً.
      actions:
        - command: create_entry
          params:
            lemma: "مُتَأَهِّل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشّح المرحلة ١: بَالِغُ النِّهَائِيَّات ──
    - lemma: "بَالِغُ النِّهَائِيَّات"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي للمركب كوحدة ثابتة. فشل اختبار التثبيت المعجمي:
        يمكن إبدال «النهائيات» بـ«الدور الربع النهائي» أو «الأدوار الأخيرة» مع الحفاظ
        على بنية وصفية مقبولة، مما يُثبت أنه عبارة وصفية حرة لا مصطلح مسكوك.

    # ── مرشّح المرحلة ١: نِهَائِيّ ──
    - lemma: "نِهَائِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة تُثبت أن «نهائيّ» صفة راسخة (final, terminal, definitive) في المعجمية
        العربية الحديثة. المورد الحديث نفسه لم يُفرده اسماً، بل قيّده بالتركيب الوصفي
        «اللاعب النهائيّ». استخدامه اسماً منفرداً للدلالة على «المتأهل للنهائي» يتعارض
        مع الاستخدام المعجمي السائد ويُوقع في الاشتراك اللفظي مع المعنى الصفتي.

    # ── مرشّح المرحلة ١: خَاتِمِيّ ──
    - lemma: "خَاتِمِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت أن «خاتمي» اسم علم للذكور لا وصف وظيفي. جذر (ختم) صالح
        دلالياً لمعنى «بلوغ آخر الشيء»، غير أن صيغة النسبة «خاتمي» استُهلكت في الاستعمال
        الاسمي العَلَمي ولم تُوثَّق كوصف رياضي في أي مصدر، فتنبغي إزالتها تفادياً للالتباس.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "متسابق يصل إلى المراحل النهائية من المنافسة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح من حيث المعنى لكنه يفتقر إلى التشكيل الكامل، وصيغة «يصل إلى»
        أقل إحكاماً من «يبلغ» التي تُفيد الوصول الحقيقي لا مجرد المحاولة. كذلك «المراحل النهائية»
        أعمّ مما يقتضيه المفهوم؛ فـ«finalist» يصف تحديداً من أحرز حق الدخول إلى النهائيات،
        لا من وصل إلى أي مرحلة متأخرة. يستحسن التحديد والإيجاز بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: "مُتَسَابِقٌ يَبلُغُ الأَدْوَارَ النِّهَائِيَّةَ مِن مُنَافَسَةٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
