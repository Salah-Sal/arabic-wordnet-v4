# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
stage5_enrichment:
  per_entry:
    - lemma: "مُتَأَهِّلٌ لِلنِّهَائِيِّ"
      entry_id: "{auto}"
      roots:
        - word: "مُتَأَهِّل"
          root: "أهل"
          maqayis_quote: >
