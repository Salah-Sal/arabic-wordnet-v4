# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14456341-n
# earldom: the dignity or rank or position of an earl or countess
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«كونتية» في المعاجم الحديثة (المورد الحديث) تعني الإقليم الخاضع لسلطة الكونت (county)، لا رتبته أو منصبه (earldom)؛ فهناك خلط بين المفهومين"
      - "«رتبة الكونت» تركيب إضافي شفاف يمكن إبدال مكوّناته (رتبة البارون، رتبة الماركيز...)، فلا يجتاز اختبار السكّ بوصفه مصطلحاً ثابتاً، لكنه يؤدي المعنى"
      - "المفهوم أوروبي إقطاعي لا مقابل عربي أصيل له؛ معظم المصطلحات المتاحة معرّبة"
    observations: "المجموعة تصف رتبة نبالة أوروبية (إيرل في التقليد الإنجليزي، كونت في التقليد القاري). في العربية وردت ألفاظ معرّبة لهذه الألقاب: «كونت» و«إيرل» و«قومس» (من اللاتينية comes). التعريف الحالي ترجمة حرفية مقبولة لكن يحتاج تحسيناً أسلوبياً."
  blind_candidates:
    - lemma: "إِيرْلِيَّة"
      generation_method: taarib
      justification: "مصدر صناعي من «إيرل» المعرّب عن الإنجليزية earl، على نمط تشكيل ألقاب الرتب بإضافة -يّة (كما في ملكيّة، أميريّة). المورد الحديث يسجّل «الإيرلية: رتبة الإيرل أو لقبه»."
    - lemma: "قُومُسِيَّة"
      generation_method: taarib
      justification: "مصدر صناعي من «قومس» وهو المقابل العربي القديم للقب الكونت (من اللاتينية comes)، ورد في تكملة المعاجم العربية لدوزي. القياس على نمط -يّة للدلالة على الرتبة."
    - lemma: "نَبَالَة"
      generation_method: ishtiqaq
      justification: "من الجذر «نبل» على وزن فَعالة للدلالة على الشرف والرتبة. المعجم الوسيط: «النبالة: الذكاء والنجابة والشرف». لكنها أعمّ من مفهوم earldom."
    - lemma: "رُتْبَةُ النَّبِيل"
      generation_method: tarkib
      justification: "تركيب إضافي من «رتبة» (المنزلة) و«النبيل» (صاحب لقب الشرف). يعبّر عن المفهوم بألفاظ عربية دون استعارة لفظية، لكنه أعمّ من earldom المحدّد."

stage2_evidence:
  per_lemma:
    - lemma: "رُتْبَةُ الكُونْت"
      evidence_status: "no_material_found"

    - lemma: "كُونْتِيَّة"
      contradicts:
        - text: "«(1) «أ», الكونتيّة: إقليم خاضعٌ لسلطة «كونت» (2) إقليم؛ مقاطعة؛ سكان الإقليم أو المقاطعة.»"
          source: "المورد الحديث (2008)"
          conflict: "الكونتية في المورد تعني الإقليم/المقاطعة (county) لا الرتبة أو المنصب (earldom)"

    - lemma: "إِيرْلِيَّة"
      confirm:
        - text: "«الإيرلية: رتبة الإيرل أو لقبُهُ.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الإيرل: لقب إنكليزي أدنى من مركيز وأرفع من فيكونت.»"
          source: "المورد الحديث (2008)"
          addition: "يحدد موقع رتبة الإيرل في سلّم النبالة الإنجليزية"

    - lemma: "قُومُسِيَّة"
      expands:
        - text: "«قومس: كونت، لقب شرف، وقد ذكرها فريتاج في معجمه (معجم البلاذري) وقد وردت في مادة قمس. وجمعها قوامس وقواميس.»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "يثبت أن «قومس» هو المقابل العربي القديم للقب الكونت، لكن لا شاهد على المصدر الصناعي «قومسيّة»"

    - lemma: "نَبَالَة"
      contradicts:
        - text: "«(النبالة) الذكاء والنجابة والشرف»"
          source: "المعجم الوسيط"
          conflict: "النبالة تدل على صفة الشرف والنجابة عموماً، لا على رتبة محددة كالإيرلية"
      expands:
        - text: "«(2) النَّبالة: رتبة النبيل أو مَقامُهُ (3) سِجلّ النَّبالة: كتاب يشتمل على أسماء النبلاء.»"
          source: "المورد الحديث (2008)"
          addition: "في المورد النبالة = peerage (رتبة النبيل عموماً)، وهي أعمّ من earldom"

    - lemma: "رُتْبَةُ النَّبِيل"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "رُتْبَةُ الكُونْت"
      decision: confirmed
      decision_reason: "تركيب إضافي شفاف يؤدي المعنى بدقة: الرتبة المنسوبة إلى الكونت. رغم عدم ورود المركب بعينه في المعاجم، فإن مكوّنيه ثابتان («رتبة» = المنزلة والمكانة، و«الكونت» = نبيل أوروبي). وهو الأنسب للتقليد القاري."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُستعمل للدلالة على رتبة النبالة في التقليد القاري الأوروبي (الكونت/الكونتيسة) تحديداً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُتْبَةُ الكُونْت"

    - lemma: "كُونْتِيَّة"
      decision: removed
      decision_reason: "الدليل المعجمي (المورد الحديث) يُثبت أن «الكونتية» تعني الإقليم الخاضع لسلطة الكونت (county = المقاطعة)، لا رتبة الكونت (earldom). فهناك خلط دلالي بين الرتبة والإقليم."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِيرْلِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "المورد الحديث يسجّل «الإيرلية: رتبة الإيرل أو لقبه» بما يطابق تعريف المجموعة تماماً. وهي المقابل العربي المباشر لـ earldom في التقليد الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ تحديداً على رتبة الإيرل في التقليد الإنجليزي، بخلاف «رتبة الكونت» التي تشير إلى التقليد القاري"
      actions:
        - command: create_entry
          params: {lemma: "إِيرْلِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14456341-n"}

    - lemma: "قُومُسِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم ثبوت «قومس» بمعنى كونت في تكملة المعاجم لدوزي، فإن المصدر الصناعي «قومسيّة» لم يُسجَّل في أي معجم ولا شاهد على استعماله. اللفظ مهجور تماماً ولا يتداوله أحد."
      evidence_assessment:
        case: no_material

    - lemma: "نَبَالَة"
      source: stage1
      decision: removed
      decision_reason: "النبالة في المعاجم العربية تعني الشرف والنجابة عموماً (المعجم الوسيط)، وفي المورد تعني peerage (رتبة النبيل عموماً). وهي أعمّ بكثير من مفهوم earldom المحدّد برتبة الإيرل/الكونت."
      evidence_assessment:
        case: mixed

    - lemma: "رُتْبَةُ النَّبِيل"
      source: stage1
      decision: removed
      decision_reason: "تركيب إضافي شفاف أعمّ من المطلوب؛ «رتبة النبيل» تشمل كل رتب النبالة (دوق، ماركيز، إيرل، فيكونت، بارون) ولا تختص برتبة الإيرل/الكونت."
      evidence_assessment:
        case: no_material

