# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10411352-n  |  ILI: i91823  |  POS: n
# English: painter (an artist who paints)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يقيّد الرسم بـ«بالألوان» عبر قوسَيْن — والقوسان أسلوب تعليقي لا تعريفي، مما يُضعف صياغة التعريف."
      - "تعريف AWN 'فنان يمارس الرسم (بالألوان)' أضيق من المعنى المعجمي لـ«رسّام» في العربية؛ إذ تعرّفه المعاجم بـ«من يرسم بالقلم أشكالاً أو صُوراً أو خطوطاً» دون تقييد بالألوان."
      - "اللمّة 'رسام' مثبّتة في قاعدة البيانات بلا تشكيل — تحتاج تحديثاً إلى رَسَّام بتشكيل كامل."
      - "يُفتقر إلى مرادفات فنية فصيحة تُغطي البُعد التشكيلي للمصطلح (الرسم بالألوان تحديداً لا الرسم الخطي)."
    observations: >
      المجموعة الترادفية تمثّل مفهوم «الرسام» في سياقه الفني التشكيلي (painter بالإنجليزية) —
      أي الفنان الذي يُنجز لوحات بالألوان والأصباغ، لا مجرد من يرسم خطوطاً. المشكلة أن
      «رسّام» في العربية أوسع من ذلك (يشمل رسام الكاريكاتير والرسام التقني والمصمم الجرافيكي)،
      بينما الإنجليزية تُفرّق بين painter (يستخدم الألوان) وdrawer/illustrator (يرسم بالخط).
      المعجم الكبير يُقرّب بتعريفه الثلاثي: من يحترف الرسم / من ينقش الألواح / من يرسم بالقلم وغيره.

  blind_candidates:
    - lemma: "مُصَوِّر"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر صور على وزن مُفَعِّل، والتصوير الفني (الرسم بالألوان) من معانيه الراسخة، وقد تعرّفه المعاجم بـ«من حرفته التصوير». يُعبّر عن الجانب البصري الجمالي الذي يُميّز الرسام الفنان من غيره."
    - lemma: "طَلَّاء"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر طلى على وزن فَعَّال، ويعني من يطلي الأسطح بمادة لونية. التطبيق المجازي: من يُغطّي القماش أو اللوح بطبقات الألوان — وهذه العملية التقنية في صميم فعل الرسم بالألوان."
    - lemma: "لَوَّان"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر لون على وزن فَعَّال — صيغة المُداوِم على الفعل أو المحترِف، ومعناه من يُلوِّن ويعتمد الألوان في عمله. التعريف ذكر «(بالألوان)» صراحةً، ومن ثَمَّ جاء لوّان وصفاً دقيقاً لهذا الجانب."
    - lemma: "نَقَّاش"
      generation_method: majaz
      justification: "من الجذر نقش على وزن فَعَّال. النقش في العربية يشمل الرسم والتزيين وترصيع الألوان على الأسطح؛ ومن ثَمَّ استُخدم نقاش قديماً وحديثاً للدلالة على الرسام المُزيِّن بالألوان. إحياء للمعنى الكلاسيكي قبل أن يتخصص في الزخرف والحفر."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — batch headword lookup: رسام/الرسام + مصور/المصور + طلاء/الطلاء + لوان/اللوان + نقاش/النقاش
#   Q2 — English bridge: translation_en:"painter" OR translation_en:"artist painter" OR translation_en:"oil painter"
#   Q3 — Arabic FTS: "رسم" OR "رسام" OR "لون" OR "الوان"
#   Q4 — combined enrichment by entry_id for OCR entries
#   Q5 — Maqayis: dictionary_id=151, root رسم
stage2_evidence:
  per_lemma:
    - lemma: "رَسَّام"
      confirm:
        - text: "«مَن يرسم بالقلم أشكالاً، أو صُوراً، أو خطوطاً»"
          source: "المعجم الوسيط (entry_id: 10669)"
        - text: "«من يَحْتَرِفُ الرَّسْمَ — من يَنْقُشُ الألواح — من يَرْسُم بالقَلَم وغَيْرِه أشكالاً أو صُوَرًا أو خطوطاً»"
          source: "المعجم الكبير (entry_id: 93585)"
        - text: "«(1) الرَّسّام؛ الدَّهّان» [ترجمة لـ painter]"
          source: "المورد الحديث (entry_id: 705792)"
      contradicts:
        - text: "«rассам» → draftsman"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2 بناء-تجارة (entry_id: 479087)"
          conflict: "في السياق المهني-التقني يُعادَل رسّام بـ draftsman (الرسام التقني/المهندس) لا بـ painter (الفنان الذي يرسم لوحات). هذا يكشف تعدّد دلالة رسّام العربية."
      expands:
        - text: "«رسّام الطبيعة: رسّام يُعْنَى بتصوير المناظر الطبيعية»"
          source: "المورد الحديث (entry_id: 697585)"
          addition: "يؤكد أن رسّام يُستخدم بالفعل في سياق الفن التشكيلي الأصيل، وأنه يقبل التخصيص بالمجال (طبيعة، منمنمات، إلخ)."
        - text: "«رسام المنمنمات»، «رسّام تشخيصي»، «رسّام توضيحي»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (entry_ids: 395753, 395407, 395038)"
          addition: "يُثبت أن رسّام جذع مُنتج في تشكيل مصطلحات الفنون المتخصصة."

    - lemma: "مُصَوِّر"
      confirm:
        - text: "«من حِرْفَتُه التَّصويرُ»"
          source: "المعجم الوسيط (entry_id: 16446)، المعجم الكبير (entry_id: 57427)"
        - text: "«مصوِّر (زيتي)» → painter"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (entry_id: 395861)"
        - text: "«مصور (بالألوان)» → painter"
          source: "مسرد الجغرافيا والتاريخ (entry_id: 503812)"
        - text: "«مصور حيوانات» → animal painter، «مصور جداري» → fresco painter، «مصور أزهار» → flower painter»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (entry_ids: 394916, 395462, 395438)"
      contradicts:
        - text: "«مَنْ حِرْفَتُهُ التَّصويرُ» — من أسماء الله الحُسنى: «الذى صَوَّر جميع الموجودات ورتَّبها»"
          source: "المعجم الكبير (entry_id: 57426)"
          conflict: "المصوِّر بإطلاقه يشمل الاسم الإلهي والمصوِّر الفوتوغرافي والسينمائي والفنان — اشتراك لفظي واسع قد يُبهم الدلالة على المعنى المخصوص بالرسام التشكيلي."

    - lemma: "طَلَّاء"
      contradicts:
        - text: "«مَنْ يَطلي المعادن ونحوها»"
          source: "المعجم الوسيط (entry_id: 17602)"
          conflict: "الطلّاء في المعاجم العربية مختص بطلاء المعادن وما شابهها (الصناعة)، لا بالفنان الذي ينجز لوحات فنية."
        - text: "«طلاء، دهّان» → painter (Masonry - Carpentry)"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية (entry_id: 479800)"
          conflict: "الاستخدام الموثّق لطلاء كـpainted يخصّ الدهان المهني (طلاء الجدران والمعادن)، لا فنان اللوحات."

    - lemma: "لَوَّان"
      evidence_status: "no_material_found"

    - lemma: "نَقَّاش"
      confirm:
        - text: "«مَن حرفته النَّقْش»"
          source: "المعجم الوسيط (entry_id: 29982)"
      contradicts:
        - text: "«مَن حرفته النَّقْش»"
          source: "المعجم الوسيط (entry_id: 29982)"
          conflict: "النقش في العربية المعاصرة يعني الزخرفة والحفر والتزيين على الأسطح الصلبة، لا إنشاء لوحات فنية بالألوان — وهو المعنى المقصود في المجموعة الترادفية."


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ──
    - lemma: "رَسَّام"
      decision: confirmed
      decision_reason: >
        لمّة راسخة في المعاجم العربية المعتمدة (الوسيط، الكبير، المورد الحديث)، مشتقة اشتقاقاً
        صحيحاً من الجذر «رسم» على وزن فَعَّال (للمحترف). وثّقت المعاجم أنها الترجمة الأولى
        لـ painter في سياق الفنون. التعارض مع دلالة draftsman في السياق التقني لا يُسقطها لأن
        المجموعة الترادفية تُقيّدها بالسياق الفني بوجود المُشترك الأعلى «فنان/مبدع». تحتاج
        تحديث التشكيل فقط.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphology_check:
        wazn: "فَعَّال"
        root: "رسم"
        fitness: "الوزن فَعَّال مناسب تماماً لدلالة المحترف بالصنعة — اطّردت عليه العربية في نظائره (نجّار، خيّاط، بنّاء)."
      borrowing_check:
        lexical: "عربية أصيلة"
        calque: "لا"
        terminological_validity: "مُقرَّر في اللغة والمصطلح الفني"
      quality_gate:
        consistency: "مطّرد على وزن فعّال"
        ease_of_use: "سهل التداول والنسبة (رسّامون، رسّامة)"
        appropriateness: "ملائم للسياق الفني"
        prefers_heritage: "عربي تراثي أصيل"
        prefers_arabic: "نعم"
        derivability: "منتج في المصطلح (رسام جداري، رسام المنمنمات...)"
      nuance_differentiation: >
        رسّام هو المصطلح الجذع الذي يُعبّر عن الفنان التشكيلي بالرسم؛ يختص بمن يُعالج
        التكوين البصري عبر الخطوط والألوان على أسطح مختلفة. يُميّزه عن «مصوِّر» أن
        الأخير يشمل التصوير الفوتوغرافي والسينمائي؛ وعن «نقّاش» أن الأخير يُعنى بالزخرفة
        والحفر لا بإنشاء اللوحات الفنية الحرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَسَّام"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "مُصَوِّر"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق «مصوِّر (زيتي)» و«مصور (بالألوان)» في ARABTERM كترجمتين لـ painter،
        فإن اللمّة بصيغتها المجرّدة «مصوِّر» تنطوي على اشتراك لفظي واسع: تشمل الاسم الإلهي،
        والمصوِّر الفوتوغرافي، والسينمائي، وفنان الكمبيوتر. إضافتها بلا قيد إلى مجموعة
        «painter» يُوهم بترادف تام مع لمّات تلك التخصصات الأخرى، وهو ما تمنعه قاعدة عدم
        الترادف المطلق. الصيغة المقيَّدة «مصوِّر زيتي» هي الدقيقة لكنها MWE لمجموعة أخرى.

    - lemma: "طَلَّاء"
      source: stage1
      decision: removed
      decision_reason: >
        الطلّاء في المعاجم العربية يخص طالي المعادن والجدران (house/industrial painter)،
        وتوثّقه المعاجم المهنية في سياق البناء والنجارة. الفنان التشكيلي الذي ينجز لوحات
        بالألوان لا يُسمّى طلّاءً في أي نص فصيح أو مصطلح فني.

    - lemma: "لَوَّان"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي يُثبت «لوّان» بمعنى الرسام الفنان. صيغة فَعَّال من
        «لون» تصفه بتوظيف الألوان، إلا أن اللفظ غير مسكوك ولا يجتاز اختبار التثبيت المعجمي.

    - lemma: "نَقَّاش"
      source: stage1
      decision: removed
      decision_reason: >
        النقّاش موثّق بمعنى «من حرفته النقش» — وهو الزخرف والحفّار وراسم الزخارف على
        الأخشاب والمعادن والجص. في العربية المعاصرة يُستخدم أيضاً لدهّان الجدران في بعض
        البلدان، ولكنه لا يُطلق على الفنان التشكيلي صاحب اللوحات. لا يُصلح لهذه المجموعة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فنان يمارس الرسم (بالألوان)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يعتمد على قوسَيْن توضيحيَّيْن «(بالألوان)» بدلاً من أن يدمج
        الدلالة بنية واحدة محكمة؛ كما أن «يمارس» فعلٌ عام لا يُبيّن الاحتراف أو التوجه
        الجمالي. والمعاجم العربية تُعرّف الرسّام بالاحتراف («من يَحتَرِفُ الرَّسمَ»).
        كذلك لا يشير التعريف إلى أن المقصود إنشاء لوحات فنية تشكيلية لا مجرد الخطوط.
    authored:
      - type: terminological
        text: "فنانٌ يَحترِفُ إنشاءَ اللوحاتِ الفنيَّةِ بالأصباغِ والألوانِ على القماشِ أو الخشبِ أو غيرِهما من الأسطحِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَن حِرفَتُهُ الرَّسمُ؛ يُلوِّنُ اللوحاتِ الفنيَّةَ ويُشكِّلُها بالأصباغ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
