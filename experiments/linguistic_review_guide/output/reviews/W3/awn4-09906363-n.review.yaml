# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — أُجري قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "وَغْد"
      generation_method: majaz
      justification: >
        لفظٌ عربيٌّ كلاسيكيٌّ قديم يُحيي معنى الجمع بين الضَّعف والدَّناءة؛ أصله
        قِدح لا نصيب له في الميسر، ثم أُطلق مجازاً على الرجل الحقير الضعيف.
        يجمع في حقل دلالي واحد الوَهَن والرَّذالة بما يوافق "caitiff" الإنجليزية.

    - lemma: "نَذِيل"
      generation_method: ishtiqaq
      justification: >
        مشتقٌّ من جذر (ن-ذ-ل) على وزن فَعِيل الدالّ على الاتّصاف الراسخ،
        يُعبّر عن خِسَّة الطبع وانحطاط الهمَّة. يُميَّز عن "نَذْل" (الاسم الصريح)
        بدلالة الصفة المُلازمة الشديدة.

    - lemma: "رَعْدِيد"
      generation_method: ishtiqaq
      justification: >
        مشتقٌّ من جذر (ر-ع-د) على وزن فَعْلِيل المُبالَغة الدالّ على المفرط
        في صفته؛ وهو الجبان المُضطرب المُرتعش خوفاً. يُركّز على ذلّة الجُبن
        التي تقترن بالاحتقار الاجتماعي.

    - lemma: "مُتَخَاذِل"
      generation_method: ishtiqaq
      justification: >
        مشتقٌّ من جذر (خ-ذ-ل) على وزن مُتَفَاعِل؛ يُفيد من يتخلّى عن نصرة
        الحق جُبناً وخِذلاناً. يجمع بين ذلّة التخلّي وانعدام المروءة، وقد يوافق
        "caitiff" في سياقات المواجهة والخذلان.

  # ب. التقييم الأولي بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - >
        اللمّة «جبان حقير» عبارةٌ وصفية حرّة لا تُعدّ وحدةً معجمية مُثبَّتة؛
        تفشل اختبار السكّ (يمكن إبدال «جبان رذيل» أو «جبان دنيء» دون أن تتحوّل
        إلى مصطلح مختلف)، وهي تكرارٌ للتعريف ذاته بألفاظه.
      - >
        اللمّة «لئيم» تغطّي معنى الدناءة والشُّح (خلاف الكريم) دون أن تستوعب
        صراحةً معنى الجُبن المُشترط في التعريف. الجمع بين الصفتين ليس صريحاً
        في الاستعمال الكلاسيكي للمة.
      - >
        التعريف الحالي «شخص جبان وحقير» مبنيٌّ ببساطة تترجم الإنجليزية حرفياً،
        ويفتقر إلى الجنس القريب والفصل النوعي بأسلوب المعجم.
    observations: >
      المجموعة تُعبّر عن مفهوم «caitiff» الإنجليزي: شخصٌ يجمع بين الجُبن والخِسَّة
      في آنٍ معاً، لا مجرّد الاتصاف بإحداهما. للعربية ثروةٌ من الألفاظ في هذا الحقل
      (وَغْد، رذل، خسيس، نذل، لئيم) غير أن معظمها يُعبّر عن الدناءة أو الضعف منفردَيْن.
      الاسم «وَغْد» هو الأقرب في التراث العربي لأنه يجمع المعنيين في وحدة صرفية واحدة
      ويُقابل «caitiff» في أوّل ترجمة مُعجمية حديثة. كذلك تحتاج المجموعة إلى تعريف
      يُتقن الفصل بين هذا المفهوم والمفهوم الأعلى (شخص جبان أو حقير بإحدى الصفتين).


