stage2_evidence:
  per_lemma:

    - lemma: "جبان حقير"
      evidence_status: "no_material_found"
      # لم تُعثَر على أي مدخل معجمي يُثبّت هذا التعبير كوحدة مسكوكة.

    - lemma: "لَئِيم"
      confirm:
        - text: >
            «اللَّئِيمُ: خلاف الكَرِيم. الشَّبِيه. يقال: هو لئيمه: مثله وشبهه.»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >
            «اللَّئِيمُ: (اللَّئِيم) خلاف الْكَرِيم والشبيه يُقَال هُوَ لئيمه مثله
            وَشبهه (ج) لئام وألآم»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
      expands:
        - text: >
            «اللُّؤْمِ. يَقُولُونَ: إِنَّ اللَّئِيمَ: الشَّحِيحُ الْمَهِينُ النَّفْسِ،
            الدَّنِيُّ السِّنْخِ. يُقَالُ: قَدْ لَؤُمَ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            المقاييس يُحدّد ثلاثة أبعاد: الشُّح (ضدّ الكرم)، الهوان النفسي، ودناءة الأصل.
            هذا يُغطّي جانب الخِسَّة والاحتقار في المجموعة، لكن ليس الجُبن صراحةً.
      contradicts:
        - text: >
            «اللَّئِيم: فِي الْكَرِيم.» [أي يُعرَّف في مقابل الكريم]
          source: "دستور العلماء للأحمدنكري"
          conflict: >
            التعريفات تُصوّر اللئيم أساساً في مقابل الكريم (البخيل الدنيء) لا الجبان؛
            مما يعني أن «لئيم» لا يستلزم الجُبن من حيث الوضع الأصيل.

    - lemma: "وَغْد"
      source: stage1
      confirm:
        - text: >
            «الوَغْدُ: قِدْحٌ من سهام الميسر لا نصيبَ له. الأحمقُ الدَّنِيء الرَّذْل.
            الضعيف الجسم. خادمُ القوم بطعام بطنه. ثمر الباذنجان.»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >
            «وغد؛ خسيس؛ حقير؛ جبان.»
          source: "المورد الحديث (2008) — ترجمة caitiff"
        - text: >
            «الوَغْدُ: الأَحمقُ الضَّعيفُ الخَفيفُ العَقْلِ الرَّذْلُ الدَّنِيءُ،
            وقيل: الضعيف في بدنه. وقد وَغُدَ وغادةً. ويقال: فلان من أوغاد القوم
            ووُغدانهم أي من أَذِلاَّئهم وضعُفائهم.»
          source: "لسان العرب لابن منظور"
        - text: >
            «الوَغْدُ: الأَحمقُ الضَّعِيفُ الرَّذْلُ الدَّنِىءُ، الخَسِيس.»
          source: "تاج العروس من جواهر القاموس"
        - text: >
            «الوَغْدُ: الرَّجُلُ الدَّنِيءُ الَّذِي يَخْدُمُ بِطَعَامِ بَطْنِهِ.»
          source: "مختار الصحاح للرازي"
        - text: >
            «هو وغد من الأوغاد: دنيّ وأصله سهم لا حظّ له.»
          source: "أساس البلاغة للزمخشري"
      expands:
        - text: >
            «الْوَاوُ وَالْغَيْنُ وَالدَّالُ: كَلِمَةٌ تَدُلُّ عَلَى دَنَاءَةٍ.
            وَرَجُلٌ وَغْدٌ وَهُوَ الدَّنِيُّ، مِنْ قَوْلِكَ وَغَدْتُهُمْ أَغِدُهُمْ،
            إِذَا خَدَمْتَهُمْ. وَالْأَصْلُ الْوَغْدُ: قِدْحٌ لَا حَظَّ لَهُ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر يدلّ أصالةً على الدناءة المُطلقة؛ والوَغْد في الأصل القِدح الخاسر،
            وهو استعارةٌ مُثلى للرجل الذي لا حظّ له من مكرمة ولا شجاعة.
        - text: >
            «وَغَدَهُم يَغِدُهمَ وَغْداً: خَدَمَهم؛ قال أبو حاتم: قلت لأُمّ الهيثم:
            أَوَيَقال للعَبد وَغْدٌ؟ قالت: ومن أَوْغَدُ منه؟»
          source: "لسان العرب لابن منظور"
          addition: >
            يُعبّر عن أقصى درجات الحقارة الاجتماعية؛ مستشهَداً به مثلاً في احتقار العبد.

    - lemma: "نَذِيل"
      source: stage1
      evidence_status: "no_material_found"
      # جذر نذل موثَّق في المقاييس بمعنى «كلمة تدلّ على خساسة في الشيء»،
      # لكن صيغة فَعِيل (نَذِيل) لم تُعثَر عليها في المعاجم المستعلَمة.
      # الصيغة الشائعة هي «نَذْل» وهي لمّةٌ في المجموعة الأعلى (الأعمّ).

    - lemma: "رَعْدِيد"
      source: stage1
      confirm:
        - text: >
            «(1) جبان؛ رِعديد (2) شخص جبان (3) يُجْبِن: يجعله جبانًا.»
