        وهوان النفس؛ أما الجُبن فيدخل ضمنياً في انحطاط الهمَّة لا صراحةً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَئِيم"

    - lemma: "وَغْد"
      source: stage1
      decision: confirmed
      decision_reason: >
        الأمثل في المجموعة: موثَّق توثيقاً وافراً منذ القرن الثامن الميلادي حتى
        المعاجم الحديثة، ويجمع الدناءةَ والضعفَ والرذالةَ في لفظٍ واحد. وقد جاء
        أوّل ترجمة لـ«caitiff» في المورد الحديث. يجتاز اختبار السكّ (كلمة مفردة
        مُثبَّتة)، ويجتاز الاشتقاقية (جذر عربي فصيح). رفعه يُكمل اللمّة الناقصة
