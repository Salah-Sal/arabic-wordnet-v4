      decision_reason: >
        موثَّق في المعاجم الكلاسيكية والحديثة بمعنى الشحيح المهين النفس الدنيء الأصل،
        وهو يُغطّي جانب الخِسَّة والدناءة في المجموعة. رغم أن «اللؤم» لا يستلزم
