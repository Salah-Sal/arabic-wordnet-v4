# ميزانية الاستعلامات المستخدمة: 5 استعلامات
# 1) دفعي: جبان حقير، لئيم، وغد، ارذل، خوار، متخذل
# 2) دفعي: لئيم، وغد (تفصيلي)
# 3) إثراء بالمعرّف (definitions + examples)
# 4) جسر إنجليزي: caitiff / cowardly / despicable / craven / dastardly
