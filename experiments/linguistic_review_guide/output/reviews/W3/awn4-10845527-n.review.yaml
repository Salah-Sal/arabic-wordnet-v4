      reason: >
        التعريف الحالي صحيح لكنه مقتضب ومكتفٍ بالتسمية الوظيفية والتأريخ
        الميلادي-الوفاتي. لا يُشير إلى مكانته الريادية ولا إلى المؤسسة الفنية
        التي ارتبط بها (الرويال باليه)، ولا إلى تأثيره في تأسيس هوية الباليه
        البريطاني. يستدعي إثراءً موسوعياً يُميّزه عن غيره من مصمّمي الرقصات
        البريطانيين.
    authored:
