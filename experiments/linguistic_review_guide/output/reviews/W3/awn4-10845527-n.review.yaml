# ── المرحلة ١: المراجعة والتوليد (عمياء — بدون أدلة) ──────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات خالية من التشكيل الكامل (أشتون، فريدريك أشتون)، وهذا خلاف المعيار المطلوب."
      - "اللمّة الكاملة 'فريدريك أشتون' تفتقر إلى اللقب الفخري 'السير' الذي يرد صراحةً في المقابل الإنجليزي 'Sir Frederick Ashton'."
      - "الوصف المعجمي 'مصمم رقصات بريطاني' دقيق دلالياً لكنه شحيح إثراءً موسوعياً؛ لا يشير إلى ارتباطه بالرويال باليه البريطاني."
      - "تصنيف pos='n' يستحق مراجعة: هذا اسم علم لشخص بعينه (بعض المعاجم الرقمية تميّز proper_noun)؛ وإن كان اصطلاح AWN4 يُوحِّد الأعلام تحت n، فلا يلزم التغيير."
    observations: >
      هذه المجموعة الترادفية تمثّل اسم علم لشخص تاريخي بعينه: السير فريدريك أشتون
      (1906–1988)، مصمم الرقصات البريطاني الكبير المرتبط اسمه بـ«الرويال باليه».
      المنهجية اللغوية الوحيدة الممكنة في تعريب أسماء الأعلام الأجنبية هي التعريب
      (التحريف الصوتي/ التعريب المُعرَّب)، إذ لا مجال للاشتقاق أو المجاز في تسمية
      الأشخاص. ينبغي أن تحمل اللمّات تشكيلاً كاملاً، وأن تُغطّي الصيغة المختصرة
      (اللقب وحده) والصيغة الرسمية الكاملة (مع اللقب الفخري «السير»).

  blind_candidates:
    - lemma: "أَشْتُون"
      generation_method: taarib
      justification: >
        تحريف صوتي للقب Ashton بنقل الحروف: A→أَ، sh→شْ، t→تُ، on→ون.
        اللقب وحده يكفي في السياقات المختصرة والأكاديمية. فُضِّل على «آشتون» لأن
        همزة القطع أدق صوتياً للمقطع الأول القصير.

    - lemma: "فْرِيدِرِيك أَشْتُون"
      generation_method: tarkib
      justification: >
        تركيب إضافي من مكوّنَيْن مُعرَّبَيْن: Frederick→فريدريك وAshton→أشتون.
        يُمثّل الصيغة الرسمية الكاملة (الاسم الأول + اللقب) الأكثر تداولاً في
        المصادر العربية المتخصصة بالفنون الأدائية.

    - lemma: "السِّير فْرِيدِرِيك أَشْتُون"
      generation_method: tarkib
      justification: >
        تركيب إضافي من ثلاثة عناصر: السِّير (تعريب Sir، وهو لقب الفروسية البريطاني)
        + فريدريك + أشتون. يقابل المقابل الإنجليزي «Sir Frederick Ashton» مباشرةً
        ويعكس مكانته الرسمية في قائمة الفرسان الملكيين. شائع في المصادر الثقافية
        العربية الجادة.

    - lemma: "فْرِيدِرِيك وِيلْيَام مَالَنْدِين أَشْتُون"
      generation_method: taarib
      justification: >
        الاسم الميلادي الكامل للشخصية: Frederick William Mallandaine Ashton.
        مرشح احتياطي يُستخدم في السياقات البيوغرافية الأكاديمية الصارمة التي
        تستلزم تحديد الهوية القانونية. مستبعَد من التداول الاعتيادي لطوله.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفَّذة:
#  ١. مطابقة دفعية: headword_norm IN (اشتون، الاشتون، فريدريك اشتون، ...)
#  ٢. جسر إنجليزي: translation_en:"Ashton" OR "Frederick Ashton" OR "choreographer" OR "ballet choreographer"
#  ٣. FTS عربي: رقصات OR تصميم رقصات OR باليه OR كوريغراف OR بريطاني
#  ٤. مطابقة دفعية للمرشحات: السير فريدريك اشتون، كوريغراف، مصمم رقصات، ...
stage2_evidence:
  per_lemma:
    - lemma: "أَشْتُون"
      expands:
        - text: >
            «أُشْتُونُ: مثل الذي قبله، إلّا أنّ عوض الميم نون: حصن بالأندلس من
            أعمال كورة جيّان، وفي ديوان المتنبي يذكر: وخرج أبو العشائر يتصيّد
            بالأشتون، أظنه قرب أنطاكية والله أعلم.»
          source: "معجم البلدان لياقوت الحموي (ت 626هـ)"
          addition: >
            يُثبت الدليل أن التسلسل الصوتي «أشتون» موجود في التراث الجغرافي
            العربي الكلاسيكي بوصفه اسم موضع، مما يعني أن الحروف مألوفة ومستساغة
            صوتياً في العربية. لا علاقة للمدخل بالكوريغراف، لكنه يكشف أن العرب
            استعملوا هذا الشكل مبكراً.

    - lemma: "فْرِيدِرِيك أَشْتُون"
      evidence_status: "no_material_found"

    - lemma: "السِّير فْرِيدِرِيك أَشْتُون"
      evidence_status: "no_material_found"

    - lemma: "فْرِيدِرِيك وِيلْيَام مَالَنْدِين أَشْتُون"
      evidence_status: "no_material_found"

  # شاهد إضافي على المصطلح العام «مصمم الرقصات» (كوريغراف) من قاعدة البيانات:
  supplementary_findings:
    - note: >
        الجسر الإنجليزي أعاد «مُصَمِّم الرَّقَصَات» (translation_en=choreographer)
        من المورد الحديث (2008)، entry_id=677907. يؤكد أن المصطلح العربي الفوقي
        المستخدم في تعريف المجموعة الترادفية الأمّ صحيح ومعتمد معجمياً.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة الأولى ──────────────────────────────
    - lemma: "أشتون"
      decision: confirmed
      decision_reason: >
        التعريب الصوتي الصحيح للقب Ashton. الأكثر تداولاً في المصادر العربية
        المتخصصة بالفنون الأدائية. الشاهد المعجمي الوحيد يتعلق باسم موضع جغرافي
        تاريخي ولا يتعارض مع استخدام الشكل نفسه للدلالة على لقب عَلَم. يلزم
        إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      morphological_check: >
        الشكل معرَّب من Ashton بنقل صوتي دقيق: /æʃtən/ → أَشْتُون. الوزن لا
        ينتمي لأوزان الاشتقاق العربي وهو متوقع في أسماء الأعلام الأجنبية
        المعرَّبة.
      borrowing_check:
        type: taarib
        verdict: مقبول — تعريب صوتي معتاد لأسماء الأعلام الأجنبية.
      nuance_differentiation: >
        الصيغة المختصرة (اللقب العائلي وحده): تُستخدم في الإحالات السريعة
        والفهارس والعناوين الجانبية، كما في «أسلوب أشتون في الباليه».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَشْتُون"

    # ── اللمّة الموجودة الثانية ─────────────────────────────
    - lemma: "فريدريك أشتون"
      decision: confirmed
      decision_reason: >
        تركيب إضافي معرَّب صحيح من مكوّنَيْن (الاسم الأول + اللقب). يُمثّل
        الصيغة الرسمية الأوسع انتشاراً في الكتابة العربية المتعلقة بالفنون.
        يلزم إضافة التشكيل الكامل. لاحَظ المراجع أن المقابل الإنجليزي «Sir
        Frederick Ashton» يتضمّن لقب الفروسية، وقد يُستحسن إضافة صيغة ثالثة
        بالسِّير، لكن هذه الصيغة تُبقَى هي الأساس إذ يكثر حذف Sir في العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      morphological_check: >
        مركب إضافي من عَلَمَيْن مُعرَّبَيْن. النمط شائع في العربية لتسمية
        الأعلام الأجنبية ذات البنية (اسم + لقب).
      borrowing_check:
        type: tarkib
        verdict: مقبول — تركيب إضافي معيار لأسماء الأعلام الأجنبية.
      nuance_differentiation: >
        الصيغة الرسمية المتوازنة بين الإيجاز والتحديد: تُستخدم في الكتابات
        الأكاديمية والمقالات الفنية حين لا يُراد تضمين اللقب الفخري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فْرِيدِرِيك أَشْتُون"

    # ── مرشح المرحلة ١ — السير فريدريك أشتون ───────────────
    - lemma: "السِّير فْرِيدِرِيك أَشْتُون"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل مباشرةً المدخل الإنجليزي «Sir Frederick Ashton» الموجود في المجموعة.
        لقب «السِّير» تعريب راسخ معتمد لـSir في المصادر العربية الرسمية والثقافية.
        إضافته تُكمل التغطية المصطلحية وتُيسّر الاسترجاع. لم يُعثر عليه في قاعدة
        البيانات إلا أن غياب الدليل لا يمنع الاعتماد في أسماء الأعلام المعرَّبة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الرسمية الكاملة مع اللقب الفخري: تُستخدم في السياقات الرسمية
        والتوثيقية التي تستلزم ذكر التشريف الملكي (وسام الفروسية).
      actions:
        - command: create_entry
          params:
            lemma: "السِّير فْرِيدِرِيك أَشْتُون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — الاسم الميلادي الكامل ─────────────
    - lemma: "فْرِيدِرِيك وِيلْيَام مَالَنْدِين أَشْتُون"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الميلادي الكامل مفرط الطول ولا يُستخدم في التداول الأدبي أو
        الأكاديمي العادي. يقتصر توظيفه على وثائق الهوية والسجلات المدنية. ليس
        لمّةً معجمية مُسكَّكة بالمعنى الاصطلاحي. مرفوض.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مصمم رقصات بريطاني (1906-1988)"
    assessment:
