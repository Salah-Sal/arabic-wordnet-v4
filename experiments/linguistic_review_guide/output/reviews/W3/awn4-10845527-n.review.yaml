          ومصمِّماً رئيساً لعقود، وخلَّف أكثر من مئة وستين عملاً راقصاً باتت
          من الكلاسيكيات المعتمدة في مناهج الباليه العالمي. مُنح لقب الفروسية
          (السير) تكريماً لإسهاماته الفنية.
