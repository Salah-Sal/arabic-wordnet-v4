# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14024516-n
# personal independence / الاستقلال الشخصي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي مقتضب جداً (الاستقلال الشخصي) — يحتاج إلى توسيع وصياغة معجمية"
      - "اللمّة الثانية (اعتماد على النفس) تعبير حر وليس مصطلحاً مسكوكاً ثابتاً — يحتاج تحققاً"
      - "اللمّتان بدون تشكيل كامل"
    observations: "المجموعة تمثّل مفهوم الاستقلالية الشخصية بوصفها صفة ذاتية للفرد، وهي تندرج تحت مفهوم الاستقلال العام (التحرر من سيطرة الغير). المفهوم متجذّر في الثقافة العربية ولا يُعدّ غريباً عنها، لكنّ التعبير عنه بمصطلح مفرد مسكوك يحتاج إلى تدقيق. الفرق بين الاستقلال (المصدر) والاستقلالية (المصدر الصناعي) جوهري: الأول حدث والثاني صفة راسخة."
  blind_candidates:
    - lemma: "اسْتِقْلَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من استقلال على وزن استفعالية، يدلّ على صفة الاستقلال الراسخة في الشخص لا على حدث الاستقلال نفسه، وهو أدقّ تعبيراً عن المفهوم المطلوب."
    - lemma: "عِصَامِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من عِصام، والعرب تقول (نفسُ عصامٍ سوّدت عصاماً) للدلالة على من ساد بنفسه لا بآبائه. العصامية تدلّ على الاعتماد على الذات والاستغناء عن الغير."
    - lemma: "اعْتِمَاد عَلَى النَّفْس"
      generation_method: tarkib
      justification: "تركيب جارّ ومجرور شائع في المعاجم الثنائية الحديثة مقابل self-reliance، يعبّر عن الاتّكال على القدرات الذاتية دون الحاجة إلى الغير."
    - lemma: "اكْتِفَاء ذَاتِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي مسجّل في معاجم المصطلحات مقابل self-sufficiency، يدلّ على استغناء الكيان عن غيره في تلبية حاجاته."

stage2_evidence:
  per_lemma:
    - lemma: "اسْتِقْلَالِيَّة"
      confirm:
        - text: "«Autonome — عند أندريه مارتني (1965)، ميزة بعض المركبات اللغوية التي ترد في أماكن مختلفة من الجملة وتحتفظ بدورها دون أن تكون مقيدة بمكان معين.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«اسْتِقْلاَلِيَّةٌ — autonomy»"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020)"
      expands:
        - text: "«استقلال — من (ق ل ل) أن يتحاكم الشعب نفسها من غير تداخل خارجي، والرحيل، والقليل، والتفرد.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يوضّح أصل الاستقلال من جذر ق ل ل ويربطه بالتفرد وعدم التداخل الخارجي"

    - lemma: "اعْتِمَاد عَلَى النَّفْس"
      confirm:
        - text: "«اعتماد على النفس — self reliance»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«الاِعْتِمَادُ على النَّفْس — self-reliance»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الاعتماد [أو التعويل] على الذات. — self-reliance»"
          source: "المورد الحديث (2008)"
          addition: "يقدّم البديل (التعويل على الذات) ويستعمل (الذات) بدل (النفس)"

    - lemma: "عِصَامِيَّة"
      expands:
        - text: "«عصامية وطنية — اعتماد على الذات الوطنية — national self-reliance»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "تُستعمل العصامية في السياق الاقتصادي بمعنى الاعتماد على الذات"
        - text: "«عصامي — طالب أو باحث منقطع عن العالم الخارجي يخصص كل وقته لدراساته أو بحوثه»"
          source: "مسرد الإعلام والتواصل"
          addition: "العصامي في سياق الإعلام يعني المنقطع المستقل في عمله"
      contradicts:
        - text: "«نَفْسُ عِصَامٍ سَوَّدَتْ عِصَامًا — يقولون للسائد بنفسه لا بآبائه»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "العصامية في الأصل تدلّ على السيادة بالجهد الذاتي (self-madeness) لا على الاستقلال الشخصي كصفة نفسية"

    - lemma: "اكْتِفَاء ذَاتِيّ"
      confirm:
        - text: "«اكتفاء ذاتيّ — self-sufficiency»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
        - text: "«اكتفاء ذاتيّ — autarky»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "«(الِاكْتِفَاء الذاتي) (فِي الاقتصاد) أَن تَسْتَغْنِي الدولة بإنتاجها عَن الاستيراد من غَيرهَا (محدثة)»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يحصر الاكتفاء الذاتي في المجال الاقتصادي على مستوى الدولة، لا على مستوى الفرد"
        - text: "«سياسة تعتمدها العديد من الدول تحاول من خلالها الاعتماد على إمكانياتها ومواردها الذاتية لتأمين جميع احتياجاتها من السلع والمنتجات الاستهلاكية والاستثمارية.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "التعريف يخصّ الدول والسياسات الاقتصادية، لا الأفراد والاستقلالية الشخصية"

stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١ ──
    - lemma: "اسْتِقْلَالِيَّة"
      decision: confirmed
      decision_reason: "مصدر صناعي مشتقّ من استقلال على وزن استفعالية، مسجّل في معاجم المصطلحات الحديثة (التربية، اللسانيات) مقابل autonomy. يدلّ على صفة الاستقلال الراسخة وهو أدقّ من المصدر (استقلال) في التعبير عن الحالة الشخصية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الصفة المتأصّلة والقدرة الذاتية على الاستقلال بوصفها سمة شخصية ثابتة، في مقابل (اعتماد على النفس) الذي يصف السلوك الفعلي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِقْلَالِيَّة"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "اعْتِمَاد عَلَى النَّفْس"
      decision: confirmed
      decision_reason: "مركّب مسجّل في المعجم الطبي الموحد والمعجم الموحد لمصطلحات التجارة مقابل self-reliance. تعبير اصطلاحي ثابت يمثّل الجانب السلوكي من الاستقلالية الشخصية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يصف السلوك الفعلي المتمثّل في الاتّكال على القدرات الذاتية في الحياة العملية، بينما (استقلالية) تدلّ على السمة النفسية الكامنة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اعْتِمَادٌ عَلَى النَّفْس"

    # ── مرشّح المرحلة ١: عصامية ──
    - lemma: "عِصَامِيَّة"
      source: stage1
      decision: removed
      decision_reason: "العصامية في أصلها تدلّ على السيادة بالجهد الذاتي (نفسُ عصامٍ سوّدت عصاماً)، وهي أقرب إلى مفهوم (self-madeness) منها إلى الاستقلالية الشخصية (autonomy). الفرق الدلالي جوهري: العصامية إنجاز اجتماعي، والاستقلالية صفة نفسية."
      evidence_assessment:
        case: mixed

    # ── مرشّح المرحلة ١: اكتفاء ذاتي ──
    - lemma: "اكْتِفَاء ذَاتِيّ"
      source: stage1
      decision: removed
      decision_reason: "الاكتفاء الذاتي مصطلح مقصور على المجال الاقتصادي (استغناء الدولة بإنتاجها عن الاستيراد) كما نصّ المعجم الوسيط. لا يُستعمل في السياق النفسي أو الشخصي الذي تعبّر عنه هذه المجموعة الترادفية."
      evidence_assessment:
        case: mixed

