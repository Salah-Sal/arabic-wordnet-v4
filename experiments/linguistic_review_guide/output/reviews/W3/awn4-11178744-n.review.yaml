# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11178744-n  |  ILI: i96129  |  POS: n
# الموضوع: جون مارشال — فقيه أمريكي ورئيس المحكمة العليا (1755–1835)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان ('جون مارشال' و'مارشال') مجردتان من التشكيل — يتعذّر التحقق من صحة النقحرة دون ضبط."
      - "لمّة 'مارشال' منفردةً مشتركة لفظياً مع المعنى العسكري (رُتبة المُشِير)، مما يُوقع التباساً دلالياً."
      - "المجموعة خاصة بشخص تاريخي بعينه (اسم علم)؛ ولمّاتها تعريباتٌ صوتية لا مصطلحاتٌ مشتقة، فالتوليد الاشتقاقي لا يُطبَّق هنا."
    observations: >-
      هذه المجموعة اسم عَلَم لشخص تاريخي محدد هو جون مارشال (1755–1835)،
      رئيس المحكمة العليا الأمريكية الذي أرسى مبادئ القانون الدستوري الأمريكي.
      الطابع الصرفي لكل اللمّات المتوقعة هو التعريب الصوتي (نقل اسم أجنبي إلى الحروف العربية)،
      ولا مجال للاشتقاق أو التوليد من جذر عربي. المشكلة الجوهرية ليست في اختيار المصطلح
      بل في ضبط النقحرة ورسمها، وفي التمييز بين التسمية الكاملة والاختصار الاصطلاحي.

  blind_candidates:
    - lemma: "جُونْ مَارْشَال"
      generation_method: taarib
      justification: >-
        النقحرة المعيارية للاسم الأجنبي "John Marshall" بصيغته الكاملة؛
        وهي الطريقة الوحيدة الممكنة لاسم علم أجنبي، مع إضافة همزة على ألف المد في "جُون".
    - lemma: "مَارْشَال"
      generation_method: taarib
      justification: >-
        اللقب (الاسم الأخير) منفرداً هو الصيغة المختصرة المتداولة في المراجع الأكاديمية والقانونية العربية
        للإحالة على الشخص بعد أول ذكر للاسم الكامل.
    - lemma: "جُون مَارْشَل"
      generation_method: taarib
      justification: >-
        تهجئة بديلة بإسقاط الألف الأخيرة من "مارشال"؛ شائعة في بعض المصادر العربية المُعرِّبة
        بحذف حرف المدّ الأخير استناداً إلى النطق الإنجليزي.
    - lemma: "جُون مَارْشَالْ"
      generation_method: taarib
      justification: >-
        تهجئة بديلة بتسكين اللام الأخيرة وفق النطق الفصيح لأسماء الأعلام الأجنبية
        المُعرَّبة دون تنوين، مع الحفاظ على الألف المقصورة في "مارشال".


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  queries_executed:
    - query_num: 1
      pattern: "مطابقة دقيقة دفعية (batch headword)"
      terms_searched:
        - "جون مارشال / الجون مارشال"
        - "مارشال / المارشال"
        - "جون مارشل / الجون مارشل"
        - "مارشل / المارشل"
    - query_num: 2
      pattern: "جسر إنجليزي (English bridge)"
      terms_searched: ["Marshall", "John Marshall"]
    - query_num: 3
      pattern: "بحث FTS بالكلمات المفتاحية"
      terms_searched: ["فقيه", "المحكمة العليا", "دستوري", "القانون الدستوري"]

  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "جون مارشال"
      evidence_status: "no_material_found"

    - lemma: "مارشال"
      contradicts:
        - text: >-
            «مارشال [مفرد]: ج مارشالات: (سك) رتبة عسكريّة عليا تعني مُشِير
            "شاركت في ترتيب زيارة للمارشال الفرنسي"»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: >-
            المعجم يُثبت "مارشال" بمعنى الرتبة العسكرية العليا (مُشير)، وهو مختلف كلياً عن استخدامه
            اسم علم لشخص بعينه؛ مما يؤكد أن "مارشال" بوصفه لقباً لجون مارشال القانوني
            يشترك لفظياً مع هذا المعنى العسكري.

    # ── مرشحات المرحلة ١ ──
    - lemma: "جُونْ مَارْشَال"
      evidence_status: "no_material_found"

    - lemma: "مَارْشَال"
      contradicts:
        - text: >-
            «مارشال [مفرد]: ج مارشالات: (سك) رتبة عسكريّة عليا تعني مُشِير»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "نفس الإشكال الوارد في لمة 'مارشال' الموجودة — المعجم يُثبته لقباً عسكرياً لا اسم علم."

    - lemma: "جُون مَارْشَل"
      evidence_status: "no_material_found"

    - lemma: "جُون مَارْشَالْ"
      evidence_status: "no_material_found"

  contextual_evidence:
    - text: >-
        «(1) رئيس المحكمة / (2) cap.: رئيس المحكمة العليا [في الولايات المتحدة الأمريكية]»
      source: "المورد الحديث (2008)"
      note: >-
        يُثبت المعجم أن "رئيس المحكمة العليا" هو المقابل العربي المعتمد لـ chief justice
        في السياق الأمريكي — يدعم صياغة التعريف.
    - text: >-
        «فقيه قانوني: شخص متمكن من المادة القانونية وقادر على إعطاء رأيه في النصوص القانونية
        والتعليق عليها واستنباط الأحكام منها»
      source: "المعجم الموحد لمصطلحات القانون (2017)"
      note: "يؤكد أن 'فقيه قانوني' هو المصطلح المعتمد للمفهوم الذي يصف مارشال كشخص."


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى الموجودة ──
    - lemma: "جون مارشال"
      decision: confirmed
      decision_reason: >-
        اسم علم أجنبي منقول صوتياً إلى العربية بصورته الكاملة (جون = John، مارشال = Marshall)؛
        وهو التمثيل المعياري للشخص في المصادر القانونية والموسوعية العربية.
        التعريب الصوتي هو الوسيلة الإلزامية الوحيدة للأعلام الأجنبية.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الصيغة الكاملة للاسم (الاسم الأول + اللقب)؛ تُستخدم في الذكر الأول والسياقات الرسمية
        والمراجع الأكاديمية التي تقتضي التعريف الكامل بالشخص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُونْ مَارْشَال"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "مارشال"
      decision: confirmed
      decision_reason: >-
        اللقب منفرداً بمثابة الصيغة المختصرة المعتمدة للإحالة على الشخص بعد ذكر اسمه الكامل.
        رغم الاشتراك اللفظي مع المعنى العسكري (مُشير)، فإن السياق القانوني الدستوري والمجموعة
        الترادفية المحددة تُزيل اللبس؛ وهذا الاشتراك قائم بين كلمتين متمايزتين وليس خطأً.
        يحتاج إلى تشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        الصيغة المختصرة (اللقب وحده)؛ تُستخدم في الإحالة العودية بعد الذكر الأول،
        وفي العناوين المحددة (مثل: "حكم مارشال"، "مبدأ مارشال").
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَارْشَال"

    # ── مرشحات المرحلة ١ ──
    - lemma: "جُونْ مَارْشَال"
      source: stage1
      decision: removed
      decision_reason: >-
        هذا المرشح هو نفس اللمّة الموجودة الأولى "جون مارشال" بعد إضافة التشكيل؛
        وقد تمت معالجتها بإجراء update_lemma عليها، فلا حاجة لإنشاء مدخل مستقل.

    - lemma: "مَارْشَال"
      source: stage1
      decision: removed
      decision_reason: >-
        نفس اللمّة الموجودة الثانية "مارشال" بعد التشكيل؛ تمت معالجتها بإجراء update_lemma، لا حاجة لتكرار.

    - lemma: "جُون مَارْشَل"
      source: stage1
      decision: removed
      decision_reason: >-
        تهجئة بديلة بإسقاط الألف الأخيرة. لا تُضيف معنىً جديداً وليست صورة مستقلة معتمدة؛
        يمكن إضافتها كصورة بديلة (add_form) إن احتيج إليها مستقبلاً،
        لكنها لا تستحق لمّة مستقلة في هذه المجموعة.

    - lemma: "جُون مَارْشَالْ"
      source: stage1
      decision: removed
      decision_reason: >-
        تهجئة بتسكين اللام الأخيرة؛ لا تُمثّل مصطلحاً مستقلاً بل مجرد ضبط إملائي مختلف.
        الاسمان المُعرَّبان في الشائع لا يُسكَّن آخرهما في الكتابة المعجمية.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "فقيه أمريكي؛ أسس بصفته رئيساً للمحكمة العليا مبادئ القانون الدستوري الأمريكي (1755-1835)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي جيد في جوهره لكنه يعاني من ثلاثة قصور: (١) الفصل بفاصلة منقوطة يجعل
        التعريف يبدو جملتين مستقلتين لا وحدة تعريفية متسقة. (٢) "فقيه أمريكي" مجرد كناية عن
        قانوني، والمصطلح الأدق "فقيه قانوني أمريكي" يُوضّح التخصص. (٣) التواريخ تُدرج في نهاية
        التعريف لا بين قوسين وسطه وفق أسلوب المعجم الوسيط.
    authored:
      - type: encyclopedic
        text: >-
          فقيه قانوني أمريكي (1755–1835)، تولّى رئاسة المحكمة العليا للولايات المتحدة
          وأرسى أسس القانون الدستوري الأمريكي بأحكامه التاريخية التي كرّست سلطة المراجعة القضائية.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11178744-n"
          definition_index: 0
          text: >-
            فقيه قانوني أمريكي (1755–1835)، تولّى رئاسة المحكمة العليا للولايات المتحدة
            وأرسى أسس القانون الدستوري الأمريكي بأحكامه التاريخية التي كرّست سلطة المراجعة القضائية.

  examples:
    per_lemma:
      - lemma: "جُونْ مَارْشَال"
        examples:
          - text: >-
              يُعدُّ جون مارشال من أبرز القضاة في التاريخ الأمريكي،
              إذ وضع بأحكامه الفاصلة حجرَ الأساس للقانون الدستوري الأمريكي.
            type: usage
      - lemma: "مَارْشَال"
        examples:
          - text: >-
              أكّد مارشال في حكمه الشهير في قضية ماربري ضد ماديسون
              أن للمحكمة العليا صلاحية إلغاء القوانين المخالفة للدستور.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >-
            يُعدُّ جون مارشال من أبرز القضاة في التاريخ الأمريكي،
            إذ وضع بأحكامه الفاصلة حجرَ الأساس للقانون الدستوري الأمريكي.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >-
            أكّد مارشال في حكمه الشهير في قضية ماربري ضد ماديسون
            أن للمحكمة العليا صلاحية إلغاء القوانين المخالفة للدستور.


