# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13871591-n (seventieth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «السبعون» بدون تشكيل كامل — تحتاج إلى ضبط"
      - "التعريف العربي الحالي يستخدم الرقم 70 بدلاً من الكلمة، وهو أسلوب غير معجمي"
      - "المجموعة تحتوي على لمّة واحدة فقط وهو أمر طبيعي لمفهوم العدد الترتيبي"
    observations: "المجموعة تمثّل مفهوم العدد الترتيبي (السبعون) بوصفه المركز السبعين في سلسلة. في العربية، تُستخدم ألفاظ العقود (عشرون، ثلاثون... سبعون) مع أل التعريف للدلالة على الترتيب، وقد أقرّ مجمع اللغة المصري هذا الاستعمال. هذا المفهوم بسيط ولا يحتمل تعدّد المترادفات."
  blind_candidates:
    - lemma: "السَّبْعُونَ"
      generation_method: ishtiqaq
      justification: "لفظ العقد «سبعون» مع أل التعريف يُستخدم للدلالة على المركز السبعين في الترتيب، على نحو ما أقرّه مجمع اللغة المصري"
    - lemma: "المُتَمِّمُ لِلسَّبْعِينَ"
      generation_method: tarkib
      justification: "تعبير تركيبي إضافي يُستعمل بديلاً فصيحاً للدلالة على الترتيب السبعيني، ذكره معجم الصواب اللغوي بوصفه الصيغة الفصيحة"
    - lemma: "سَبْعِينِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى سبعين على وزن فَعِيلِيّ، لكنها تدلّ على المنسوب إلى السبعين لا على الترتيب ذاته"
    - lemma: "السُّبَاعِينِيّ"
      generation_method: ishtiqaq
      justification: "اشتقاق نظري من سبعين على وزن فُعَالِينِيّ، لكنه غير مسموع ولا مستعمل"

stage2_evidence:
  per_lemma:
    - lemma: "السَّبْعُونَ"
      confirm:
        - text: "«ما بعد الستِّين وقبل الثَّمانين من العقود وقد يُرادُ به الكثرةُ»"
          source: "المعجم الكبير"
        - text: "«(1) السَّبعون (2) جزء من سبعين.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«السَّبعون — مثال: إِنَّه الرجل السبعون الَّذي يحصل على هذه الجائزة — الرأي: مرفوضة — السبب: لاستعمال لفظ العقد «سبعين» وصفًا للمفرد — الصواب والرتبة: إِنَّه الرجل المتمّ للسبعين الذي يحصل على هذه الجائزة [فصيحة] — إِنَّه الرجل السبعون الذي يحصل على هذه الجائزة [صحيحة] — التعليق: استخدم هذا الأسلوب جماعة من قدامى العلماء، ومنه قولهم: الجزء العشرون، والورقة العشرون على معنى تمام العشرين، فتحذف كلمة التمام وتقام العشرون مقامها، وقد أقره مجمع اللغة المصري.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يوثّق الخلاف حول استعمال ألفاظ العقود للترتيب ويبيّن أن مجمع اللغة المصري أقرّه"
    - lemma: "المُتَمِّمُ لِلسَّبْعِينَ"
      evidence_status: "no_material_found"
    - lemma: "سَبْعِينِيّ"
      evidence_status: "no_material_found"
    - lemma: "السُّبَاعِينِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "السَّبْعُونَ"
      decision: confirmed
      decision_reason: "اللمّة مؤكّدة بأدلة معجمية متعددة: المعجم الكبير يعرّفها بوصفها لفظ عقد، والمورد الحديث يترجمها بـ seventieth، ومعجم الصواب اللغوي يقرّ استعمالها للترتيب بتأييد مجمع اللغة المصري. تحتاج إلى تشكيل كامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "السَّبْعُونَ"
    - lemma: "المُتَمِّمُ لِلسَّبْعِينَ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً معجمياً ثابتاً. يمكن إبدال «المتمّم» بـ«المكمّل» والمعنى يبقى صالحاً، ما يعني أنها تفشل في اختبار السكّ. كما أنها لم ترد مدخلاً معجمياً مستقلاً."
      evidence_assessment:
        case: no_material
    - lemma: "سَبْعِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "النسبة «سبعينيّ» تدلّ على المنسوب إلى فترة السبعينيات أو شخص في السبعينيات من عمره، لا على المركز الترتيبي السبعين. لا تناسب دلالة المجموعة."
      evidence_assessment:
        case: no_material
    - lemma: "السُّبَاعِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "اشتقاق نظري غير مسموع ولا مستعمل في أي معجم. لا أدلة عليه."
      evidence_assessment:
        case: no_material

