# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة (مبارز) خالية من التشكيل الكامل"
      - "التعريف العربي ضعيف البناء: يحتوي على قوسَيْن بالإنجليزية (Tilt or Joust)
        وهو أسلوب غير مناسب للمعجم"
      - "التعريف دائري: يُعرَّف «مبارز» بالإحالة إلى «مبارزة» دون تحديد النوع
        الفروسي الخاص (طعن بالرمح على الجواد)"
      - "المجموعة تخصّ مفهومًا أوروبيًا وسيطيًا (jousting) وقد لا تكفيه لمة
        واحدة عامة"
    observations: >
      المجموعة تصف «المُبَارِز بالرمح في المناظرات الفروسية» وهو مفهوم
      مرتبط بفروسية أوروبا القرون الوسطى. اللمة الوحيدة «مبارز» صحيحة
      من حيث الاشتقاق (جذر برز) ودلالتها المحورية على البروز للخصم،
      غير أنها أعمّ من المفهوم الإنجليزي المقصود، إذ تشمل كل مبارزة
      فردية بالسيف أو غيره، ولا تختص بالطعن بالرمح على ظهر الجواد.
      الأصلح إبقاؤها مع تحسين التشكيل وتطوير التعريف.

  blind_candidates:
    - lemma: "مُطَاعِن"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل طاعَنَ (باب المفاعلة) على وزن مُفَاعِل. الجذر
        (ط-ع-ن) يدل على الطعن بالرمح، والصيغة المفاعِلية تفيد التبادل
        بين طرفَيْن، وهو جوهر المبارزة الفروسية بالرمح (Joust).
    - lemma: "رَامِح"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن فَاعِل من الجذر (ر-م-ح). يصف حامل الرمح
        ومستخدمه. الرمح هو السلاح الجوهري في مبارزة الفروسية (Tilt/Joust)،
        وقد اشتُهر الفارس الإنجليزي القديم بتسميته «لانسر» (حامل الرمح).
    - lemma: "مُنَازِل"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من نازَلَ (باب المفاعلة) على وزن مُفَاعِل. الجذر (ن-ز-ل)
        يدل على النزول إلى الميدان ومواجهة الخصم، وهو وصف دقيق للفارس
        الذي ينزل إلى قائمة المبارزة ليتحدى منافسه.
    - lemma: "فَارِسُ الطِّعَان"
      generation_method: tarkib
      justification: >
        مركب إضافي من «فارس» (راكب الجواد المحارب) و«الطِّعَان» (مصدر
        طاعَنَ = تبادُل الطعن بالرماح). يجمع بين الفروسية والطعن
        بالرمح في وحدة دلالية تصف المشارك في الـ Joust بدقة أكثر.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "مبارز"
      confirm:
        - text: "«مُبَارز: من (ب ر ز) البارز إلى الخصم ومنازله بالسيف ونحوه.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(1) مُبارَزة (2) نزاع (3) يُبارِز؛ يُنازِل.»"
          source: "المورد الحديث (2008)"
          addition: >
            ترجمة «duel» بالمبارزة والمنازلة، مما يؤكد دلالة اللمة على
            المواجهة الفردية المنظَّمة وصلتها بجذر برز.

    - lemma: "مُطَاعِن"
      evidence_status: "no_material_found"

    - lemma: "رَامِح"
      confirm:
        - text: "«ذو الرُّمْح، لا فِعْلَ له. قيل: هو على النَّسَب مثل لابن
            وتامِر.»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
        - text: "«(الرامح) ذُو الرمْح (لَا فعل لَهُ) وثور رامح لَهُ قرنان
            والسماك الرامح نجم قُدَّام الفكة يقدمهُ نجم مستطيل الشعاع
            يَقُولُونَ هُوَ رمحه.»"
          source: "المعجم الوسيط"
        - text: "«الرّامح: جنديّ حاملٌ رمحًا.»"
          source: "المورد الحديث (2008) — ترجمة pikeman"
      expands:
        - text: "«رَامَحَ فلانٌ فلانًا: طاعَنَهُ بالرّمح.»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
          addition: >
            الفعل رامَحَ يدل على تبادل الطعن بالرمح بين اثنين؛ ومنه
            رامِح (اسم فاعل) لكن المعاجم أثبتته معنى حامل الرمح لا
            مشارك المبارزة الفروسية تحديدًا.
      contradicts:
        - text: "«رامِح — lancinating»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >
            المعجم الطبي يُوظّف «رامح» بمعنى الألم الطاعن (lancinating pain)،
            مما يُشير إلى تشعّب دلالي يُبعِد اللفظ عن الخصوصية المطلوبة.

    - lemma: "مُنَازِل"
      contradicts:
        - text: "«الْمنَازل: جمع الْمنزل وَهُوَ مَحل نزُول الشَّيْء قمرًا
            أَو شمسًا أَو غير ذَلِك.»"
          source: "دستور العلماء للأحمدنكري"
          conflict: >
            جميع مداخل قاعدة البيانات المرتبطة بالجذر نزل تعود إلى مَنَازِل
            (جمع مَنْزِل) ولا يرد مُنَازِل (اسم فاعل من نازَلَ) مدخلاً
            مستقلاً؛ مما يكشف خطر الاشتراك اللفظي الخطير في الرسم غير
            المُشكَّل.

    - lemma: "فَارِسُ الطِّعَان"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مبارز"
      decision: confirmed
      decision_reason: >
        اللمة ثابتة في المعجمية العربية بجذر راسخ (برز) وتوثيق معجمي
        واضح. تعني البارز إلى الخصم لمنازلته، وهي الأقرب في العربية
        للمفهوم المطلوب وإن تجاوزت خصوصية الطعن بالرمح على الجواد.
        لا يوجد في القاموس العربي لفظ مُثبَت أدق تخصصًا لهذا المفهوم
        الفروسي الأوروبي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphology_check: >
        الوزن: مُفَاعِل (اسم فاعل من باب المفاعلة برَزَ/بارَزَ). الوزن
        مناسب لأسماء الفاعلين في المواجهة المتبادلة. يقبل جمع السالم
        (مبارزون) وجمع التكسير (مبارزة). تشكيل اللمة الحالي ناقص →
        يستدعي update_lemma.
      loanword_check: لفظ عربي خالص، لا اقتراض.
      quality_gate:
        consistency: "مطّرد، مستخدَم في الفصحى المعاصرة والإعلام العربي"
        ease_of_use: "يسير التداول والصرف"
        appropriateness: "ملائم للمفهوم مع قدر من العموم المقبول"
        classical_preference: "جذر تراثي أصيل (برز)"
        arabic_preference: "لفظ عربي صرف"
        derivability: "اشتقاقية عالية: مبارزة، مبارزون، بارز، بروز"
      nuance_differentiation: >
        مُبَارِز يختص بالمقاتل الذي يبرز من صفوف جيشه أو فريقه ليواجه
        خصمًا في مبارزة فردية مُنظَّمة، وهو أخص من «خصم» و«منافس»
        اللذَيْن يشملان كل تنافس، وأخص من «غريم» الدالّ على الخصومة
        القانونية أو الشخصية. غير أن مُبَارِز أعمّ من «tilter» الإنجليزية
        التي تختص بمسابقة الطعن بالرمح على ظهر الجواد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُبَارِز"

    - lemma: "مُطَاعِن"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد مُطَاعِن مدخلاً مستقلاً في أيٍّ من المعاجم المُستعلَمة.
        وأشد ما يُخلّ به أن رسمه المجرد (مطاعن) يتطابق مع جمع مَطعَن
        (= مواطن الضعف والطعن)، مما يُفضي إلى التباس صرفي خطير في
        النص غير المُشكَّل. لذا يُستبعَد ولا يُوصى بإضافته.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "رَامِح"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ ثابت في المعجمية بمعنى «حامل الرمح أو المسلّح به» (ذو
        الرمح لا فعل له)، وليس مصطلحًا للمشارك في مسابقة فروسية منظَّمة.
        المعجم الطبي يستخدمه لـ«الألم الطاعن» (lancinating). الدلالة
        إذن واسعة ومتشعّبة، ولا تخصّص مفهوم الـ Joust بما يكفي.
        فضلاً عن ذلك يشيع استخدام الرامح في الشعر للثور الوحشي ذي
        القرنَيْن لا للفارس، مما يُضعف التخصيص.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُنَازِل"
      source: stage1
      decision: removed
      decision_reason: >
        اسم الفاعل مُنَازِل (من نازَلَ = واجه في القتال) صحيح اشتقاقيًا،
        لكن رسمه المجرد (منازل) يتطابق كليًا مع مَنَازِل (جمع مَنْزِل =
        الأماكن والمحطات) وهو من أشيع الكلمات العربية؛ مما يُحدث خلطًا
        فادحًا في النصوص غير المُشكَّلة. لم يرد مُنَازِل مدخلاً مستقلاً
        دالاً على المقاتل في المعاجم المُستعلَمة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "فَارِسُ الطِّعَان"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد في المعاجم المُستعلَمة كوحدة معجمية ثابتة. وبتطبيق اختبار
        السكّ يتبيّن أن «الطعان» يمكن إبداله بـ«القتال» أو «السيوف» مع
        بقاء التعبير وصفًا صالحًا، مما يعني عدم تثبيت المركب معجميًا.
        هو عبارة وصفية حرة لا مصطلح مسكوك.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يشارك في مبارزة (Tilt or Joust)"
    assessment:
      decision: revise
      reason: >
        ثلاثة عيوب تستوجب المراجعة: (١) وجود قوسَيْن بالإنجليزية
        داخل التعريف العربي — وهو أسلوب غير مقبول في المعجمية.
        (٢) الدوران: «مبارز» مُعرَّف بـ«مبارزة» دون إضافة معلومة جديدة.
        (٣) غياب الفصل النوعي الأساسي: الطعن بالرمح على ظهر الجواد
        في منافسة فروسية منظَّمة.
    authored:
      - type: terminological
        text: >
          فارسٌ يدخل منافسة فروسية يُقاتل فيها خصمَه طاعنًا إياه بالرمح
          وهو راكب جوادَه في ميدان مخصَّص أمام المتفرجين.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مُشارِك في رياضة المبارزة الفروسية بالرمح (Jousting) التي
          اشتُهرت في أوروبا خلال القرون الوسطى، كان الفارسان فيها
          يتسابقان على ظهرَيْ جوادَيْهما في ممرٍّ مُقسَّم، ويحاول
          كلٌّ منهما إسقاط الآخر برمحه أو تحطيم رمح خصمه.
