    - lemma: "فينتوري"
      decision: confirmed
      decision_reason: >
        اللقب العائلي وحده صيغة مختصرة مقبولة، تُستخدم في الإحالات الأكاديمية المتخصصة حين يُفهم الشخص
        المقصود من السياق. الصيغة «فينتوري» بالياء مدعومة من مصادر ArabTerm المناخية وتُرجَّح على
        «فنتوري» بدون ياء. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب العائلي المجرد، يُستخدم في السياقات المتخصصة التي يُفهم فيها الشخص المقصود دون الحاجة للاسم الأول"
      actions:
