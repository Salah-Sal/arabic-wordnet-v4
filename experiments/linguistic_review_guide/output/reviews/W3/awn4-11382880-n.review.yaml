      decision_reason: >
        الاسم الرسمي الكامل للمعماري يتضمن الاسم الأوسط «Charles»، وهو مذكور ضمن اللمّات الإنجليزية
        (Robert Charles Venturi) لذا يجب توفير مقابله العربي في المجموعة لاستيفاء البيانات واتساق
        التمثيل بين اللمّات العربية والإنجليزية.
      evidence_assessment:
