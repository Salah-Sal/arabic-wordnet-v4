            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "فَنْتُورِي"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة «فِينْتُورِي» بياء المدّ هي الأكثر دقةً صوتيةً وانتشاراً في المصادر الأكاديمية العربية
        المعتمدة (مسرد المناخ والبيئة من ArabTerm)، وتعكس النطق الدولي المعياري للاسم. أما «فنتوري»
        بدون ياء فصيغة ثانوية محصورة في بعض المعاجم الهندسية القديمة، ولا مسوّغ لإضافتها كلمّة
