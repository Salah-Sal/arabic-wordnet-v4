# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي شحيح جداً: يذكر الجنسية وعام الميلاد فقط، دون ذكر عام الوفاة (2018) ولا أي إشارة إلى مكانة المعماري أو ارتباطه بحركة العمارة ما بعد الحداثة"
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل المطلوب"
      - "الاسم الرسمي الكامل 'Robert Charles Venturi' مذكور في اللمّات الإنجليزية لكنه غائب عن اللمّات العربية"
      - "المجموعة تمثّل علماً شخصياً (proper noun)، مما يُقيّد إمكانية توليد الأعمى القائم على الاشتقاق أو المجاز"
    observations: >
      هذه المجموعة تُمثّل اسم عَلَم لمعماري أمريكي بارز. التعريف المُقنَّع يُشير إلى «معماري أمريكي (ولد عام 1925)»
      دون ذكر الاسم، مما يجعل توليد اللمّات تخمينياً قائماً على معرفة أبرز المعماريين الأمريكيين في تلك الحقبة.
      جميع اللمّات المرشحة ستكون تعريبات صوتية (تعريب)، إذ لا مجال للاشتقاق من جذر عربي أو المجاز في أسماء الأعلام الأجنبية.
      أبرز معماري أمريكي وُلد عام 1925 هو روبرت فينتوري رائد حركة ما بعد الحداثة.

  blind_candidates:
    - lemma: "رُوبِرْت فِينْتُورِي"
      generation_method: taarib
      justification: "تعريب صوتي للاسم الكامل لأبرز معماري أمريكي وُلد عام 1925، وهو روبرت فينتوري صاحب كتاب «التعقيد والتناقض في العمارة»"
    - lemma: "فِينْتُورِي"
      generation_method: taarib
      justification: "الاسم الأخير (اللقب) وحده كصيغة مختصرة متداولة في الإحالات الأكاديمية حين يُفهم الشخص المقصود من السياق"
    - lemma: "رُوبِرْت شَارْلِز فِينْتُورِي"
      generation_method: taarib
      justification: "تعريب الاسم الرسمي الكامل المتضمِّن الاسم الأوسط 'Charles'، لاستيفاء الهوية القانونية الكاملة كما في المصادر الرسمية"
    - lemma: "فَنْتُورِي"
      generation_method: taarib
      justification: "تعريب بديل أقرب للنطق الإيطالي الأصلي (Venturi) بفتح الفاء وبدون ياء مدّ، كما يرد في بعض المعاجم التقنية العربية"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المُنفَّذة:
#   1. مطابقة دقيقة دفعية: روبرت فينتوري، فينتوري، روبرت (مع ال- وبدونها) → لا نتائج
#   2. جسر إنجليزي: "Venturi" OR "Robert Venturi" OR "Robert Charles Venturi" → 16 نتيجة (مصطلحات هندسية/طبية)
#   3. بحث FTS عربي: "معماري" OR "مهندس معماري" → نتائج عامة غير مرتبطة بالشخص
stage2_evidence:
  per_lemma:
    - lemma: "روبرت فينتوري"
      evidence_status: "no_material_found"

    - lemma: "فينتوري"
      expands:
        - text: "«تأثير فينتوري: ظاهرة انخفاض محلي في الضغط التي تحدث، على سبيل المثال، عندما تهب الرياح من خلال واد جبلي ضيق أو بين المباني. ويمكن الاستفادة من هذه الظاهرة، باستعمال بنية أنبوبية مناسبة، في قياس التدفق، وفي جهاز غسيل (غازات منبعثة) بكفاءة عالية لمراقبة تلوث الهواء»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "يُثبت أن الصيغة «فينتوري» بالياء هي التعريب المعتمد في المصادر الأكاديمية العربية للاسم Venturi؛ والمقصود هنا الفيزيائي الإيطالي جيوفاني باتيستا فينتوري لا المعماري روبرت فينتوري، غير أن الاسم الأخير واحد وتعريبه يستند إلى ذات الأصل الإيطالي"
        - text: "«أُنبوبُ «فنتوري» [لقياس كمّيّة السائل المتدفّق]»"
          source: "المورد الحديث (2008) (ArabTerm)"
          addition: "يُظهر التعريب البديل «فنتوري» بدون ياء مدّ، المستخدم في المعاجم الهندسية؛ مما يُشير إلى وجود تنافس بين صيغتي التعريب"
        - text: "«فُوهة فنتورية قياسية: أنبوب ضيق العنق، يكونُ مخروطيّ الشكل أو مُشابهاً لفوهة»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "يُؤكد انتشار الصيغة «فنتوري» في الأوساط الهندسية، مع اشتقاق صفة «فنتورية» منها"

    - lemma: "رُوبِرْت شَارْلِز فِينْتُورِي"
      evidence_status: "no_material_found"

    - lemma: "فَنْتُورِي"
      expands:
        - text: "«مِقياس فنتوري» [Water Engineering]"
          source: "المعجم الموحد لمصطلحات المياه (2000) (ArabTerm)"
          addition: "يُثبت استخدام «فنتوري» بدون ياء في المعاجم الهندسية العربية المتخصصة بوصفها تعريباً بديلاً"
        - text: "«مَسيل فنتوري»، «أُنْبوب فنتوري»"
          source: "المعجم الموحد لمصطلحات المياه (2000) (ArabTerm)"
          addition: "تكرار الصيغة «فنتوري» في مصطلحات متعددة من نفس المعجم يعكس توحيداً اصطلاحياً ضمن هذا الحقل"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────
stage3_analysis:
