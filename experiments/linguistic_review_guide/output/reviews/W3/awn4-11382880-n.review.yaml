        هذا المعماري. تعريب «روبرت» مستقرّ في العربية، وتعريب «فينتوري» مدعوم بمصادر ArabTerm المعتمدة.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
