        text: >
          عَالِمٌ فيزيائيٌّ ومُخترعٌ إنجليزيٌّ (1802-1875)، مِن رُوَّاد علم الكهرباء
          في القرن التاسع عشر؛ يُنسب إليه ابتكار الدائرة الكهربائية لقياس
          المقاومات المعروفة بـ«قنطرة ويتستون»، وأسهم في تطوير التلغراف
          الكهربائي وبراءة اختراع الكهربومغناطيسية.
