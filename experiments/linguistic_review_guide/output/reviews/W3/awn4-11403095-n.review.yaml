# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11403095-n  |  ILI: i97400  |  POS: n
# الموضوع: السير تشارلز ويتستون — فيزيائي ومخترع إنجليزي (1802-1875)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل؛ وهو ضروري للتعريبات."
      - "لمّة «السير تشارلز ويتستون»: استخدام «ال-» قبل «السير» (السِّير) مثار جدل؛ عرف النقل الأمين للقب الإنجليزي Sir في المصادر العربية بصيغتَي «سير» و«السير»."
      - "التعريف الحالي يتضمن اسم صاحب المجموعة الترادفية ضمن «قنطرة ويتستون» مما ينتج دوراناً خفياً في التعريف (تعريف الشخص بذكر ما سُمِّي باسمه)."
      - "التعريف لا يذكر مساهمات ويتستون في التلغراف الكهربائي التي تُعدّ من أبرز إنجازاته."
    observations: >
      هذه مجموعة ترادفية من نوع العَلَم الشخصي (proper noun synset) لشخصية تاريخية
      علمية غربية. اللمّتان المسجّلتان هما: الاسم المختصر (الكنية فقط) والاسم الكامل
      مع اللقب الفخري «سير». كلتاهما تعريبتان صوتيتان (taarib) للاسم الإنجليزي
      Wheatstone. ويتستون (Wheatstone) عَلَمٌ على مخترع القنطرة الكهربائية الشهيرة؛
      والقنطرة نفسها موثّقة في المعاجم العربية المتخصصة بصيغة «قنطرة ويتستون» و«جسر
      ويتستون»، مما يشهد بتوطّن الشكل «ويتستون» في الاستعمال العربي. المجموعة سليمة
      من حيث البنية والتصنيف النحوي.

  blind_candidates:
    - lemma: "وِيتِسْتُون"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم الإنجليزي Wheatstone بنقل الأصوات: Wh→و، ea→ي، t→ت،
        s→س، t→ت، o→و، n→ن. يوافق الاستعمال المتداول في المصادر العربية المتخصصة
        (قنطرة ويتستون، جسر ويتستون).
    - lemma: "هْوِيتِسْتُون"
      generation_method: taarib
      justification: >
        تعريب بديل يحافظ على الصوت الابتدائي «هـ» الذي يقابل صوت Wh الإنجليزي في
        بعض التعريبات؛ ويرد هذا الشكل في المورد الحديث ومعجم الكيمياء بصيغة «قنطرة
        هويتستون».
    - lemma: "تْشَارْلز وِيتِسْتُون"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل (الاسم الأول + الكنية) دون اللقب الفخري «سير»؛ شائع في
        السياقات الأكاديمية والموسوعية التي تذكر الاسم الكامل بدون ألقاب.
    - lemma: "سِير تْشَارْلز وِيتِسْتُون"
      generation_method: taarib
      justification: >
        تعريب اللقب الفخري Sir مع الاسم الكامل، دون إضافة «ال-» التعريف — وهو
        الشكل الأنسب صرفياً لأن «سير» هنا لقبٌ أعجمي لا يخضع لقواعد التعريف العربي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المنفَّذة:
# ١. مطابقة دقيقة دفعية: ويتستون + هويتستون + وتستون + تشارلز (لم تُنتج نتيجة)
# ٢. جسر إنجليزي: Wheatstone + Sir Charles Wheatstone + Charles Wheatstone
# ٣. FTS عربي: ويتستون + هويتستون + وهيتستون
stage2_evidence:
  per_lemma:
    - lemma: "ويتستون"
      confirm:
        - text: "«قنطرة ويتستون» — مدخل مستقل تحت: Wheatstone bridge"
          source: "موسوعة الكهرباء — Electropedia (IEC 60050)"
        - text: "«جسر ويتستون» — مدخل مستقل تحت: Wheatstone bridge"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.١: طباعة - كهرباء (1996)"
        - text: "«قنطرة قياس ويتستون» — تجهيزة قياس تُستخدم في قياس المُقاومات الأومية (مُقاومات التيار المُستمر). تتركَّب هذه التجهيزة من 4 مُقاومات تُوصَّل معًا في حلقةٍ مُفرغة أو مُربَّع..."
          source: "مسرد الهندسة الكهربائية — ALECSO (ArabTerm)"
        - text: "«قنطرة <ويتستون>» — مدخل تحت: wheatston bridge"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
        - text: "وهي تشبه من حيثُ تركيبها قنطرة ويتستون، وتعتمد على دائرة ذات أربعة أسلاك..."
          source: "مسرد الهندسة الكهربائية — ALECSO (ArabTerm) [ضمن تعريف قنطرة طومسون]"

    - lemma: "السير تشارلز ويتستون"
      confirm:
        - text: "«قنطرة ويتستون» — (راجع أدلة لمّة «ويتستون» أعلاه؛ الاسم الكامل ورد ضمنياً في التسمية)"
          source: "متعددة (انظر أعلاه)"
      expands:
        - text: "«نظام (هويستون) التلقائي» — مدخل تحت: Wheatstone automatic system"
          source: "موسوعة الكهرباء — Electropedia (IEC 60050)"
          addition: "يشير إلى أن «ويتستون» ارتبط بالأنظمة الأوتوماتيكية (التلغراف)، مما يدعم ذكر إسهاماته في التلغراف في التعريف."

    # المرشحات من المرحلة ١
    - lemma: "وِيتِسْتُون"
      confirm:
        - text: "«قنطرة ويتستون» و«جسر ويتستون» — (نفس أدلة لمّة «ويتستون»؛ هذه اللمّة هي نفسها مع تشكيل)"
          source: "متعددة (انظر أدلة ويتستون)"

    - lemma: "هْوِيتِسْتُون"
      confirm:
        - text: "«قنطرة هْوِيْتْسْتون (كب).» — مدخل تحت: Wheatstone bridge"
          source: "المورد الحديث (2008)"
        - text: "«حسر هويتستون» — مدخل تحت: Wheatstone bridge"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"

    - lemma: "تْشَارْلز وِيتِسْتُون"
      evidence_status: "no_material_found"

    - lemma: "سِير تْشَارْلز وِيتِسْتُون"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "ويتستون"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة توثيقاً جيداً في المصادر العربية المتخصصة المتعددة (موسوعة
        الكهرباء، مسرد الهندسة الكهربائية، معجم الفيزياء) بوصفها جزءاً من مصطلح
        «قنطرة ويتستون». الشكل مستقر ومعروف في الاستعمال العربي المعاصر.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الكنية المختصرة (اسم العائلة فقط)؛ تُستخدم في السياقات العلمية والمرجعية
        المختصرة، وفي مصطلح «قنطرة ويتستون». تُمثّل الشكل الأكثر تداولاً في الأدبيات
        التقنية العربية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيتِسْتُون"

    - lemma: "السير تشارلز ويتستون"
      decision: confirmed
      decision_reason: >
        الاسم الكامل مع اللقب الفخري البريطاني «سير» ضروري في السياقات الرسمية
        والتاريخية والموسوعية. استخدام «السِّير» (مع ال-التعريف) شائع في التراث
        العربي المعاصر لنقل الألقاب البريطانية. يحتاج إلى تشكيل كامل.
        ملاحظة: الشكل البديل «سير» (دون ال-) موجود لكن «السير» أكثر شيوعاً في
        الموسوعات العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الكامل مع اللقب الفخري؛ يُستخدم في السياقات التاريخية والأكاديمية
        الرسمية حين يُراد الإشارة الكاملة إلى شخصية ويتستون بمكانتها الرسمية كفارس
        إنجليزي حائز على لقب «Sir».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "السِّير تْشَارلز وِيتِسْتُون"

    # ── مرشحات المرحلة ١ ──

    - lemma: "وِيتِسْتُون"
      source: stage1
      decision: removed
      decision_reason: >
        هذه اللمّة هي نفس اللمّة الموجودة «ويتستون» مع تشكيل كامل؛ لا تُشكّل إضافةً
        معجمية مستقلة. التشكيل سيُضاف عبر إجراء update_lemma على اللمّة الأصل.

    - lemma: "هْوِيتِسْتُون"
      source: stage1
      decision: removed
      decision_reason: >
        الشكل «هويتستون» موثّق في مصدرَين (المورد الحديث، معجم الكيمياء)، غير أن
        «ويتستون» أكثر شيوعاً بثلاثة مصادر مقابل مصدرَين. إضافة الشكلَين معاً
        لعَلَم شخصي واحد ستُربك المستخدم. الأفضل الإبقاء على الشكل الأشيع
        «وِيتِسْتُون» وعدم إضافة «هويتستون» لمّةً مستقلة.

    - lemma: "تْشَارْلز وِيتِسْتُون"
      source: stage1
      decision: removed
      decision_reason: >
        هذا الشكل هو الاسم الكامل دون اللقب «سير»؛ لا يُضيف قيمةً معجمية مستقلة
        بوجود «السِّير تْشَارلز وِيتِسْتُون»، ولا يُعادله في الرسمية. الاكتفاء بالشكل
        الكامل والمختصر أوفى.

    - lemma: "سِير تْشَارْلز وِيتِسْتُون"
      source: stage1
      decision: removed
      decision_reason: >
        الشكل «سِير» (دون ال-التعريف) صحيح صرفياً لكن الشكل الموجود «السِّير» أكثر
        تداولاً في الموسوعات العربية لأعلام البريطانيين. لا داعي لمضاعفة الشكلَين
        في المجموعة الترادفية.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────
stage4_content:
  definition:
    current: "فيزيائي ومخترع إنجليزي ابتكر قنطرة ويتستون (1802-1875)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول لكنه يعاني من دوران دلالي خفيف: تعريف الشخص بذكر ما
        سُمِّي باسمه («قنطرة ويتستون»). فضلاً عن ذلك، أسهم ويتستون في اختراع
        التلغراف الكهربائي وتطويره، وهو إنجاز لا يقل أهمية عن القنطرة، ولا يرد في
        التعريف. يستحق التعريف صياغةً أكثر ثراءً تُجنّب الدوران وتذكر الإسهامات
        الرئيسية.
    authored:
