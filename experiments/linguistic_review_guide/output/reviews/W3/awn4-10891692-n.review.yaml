        examples:
          - text: "أمضى لُوثَر بُورْبَانك أكثر من خمسين عاماً في مزرعته بولاية كاليفورنيا يُجري تجارب التهجين النباتي التي أفضت إلى تطوير ما يزيد على ثمانمائة صنف جديد من النباتات."
