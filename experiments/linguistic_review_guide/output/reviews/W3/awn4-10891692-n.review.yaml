# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-10891692-n  |  ili: i94589  |  pos: n
# Luther Burbank — خبير بستنة أمريكي
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تمثّل عَلَماً شخصياً لشخصية تاريخية غربية، وكل مقابل عربي مناسب لن يكون إلا تعريباً صوتياً للاسم الأجنبي — وهو الملاذ الأخير في سلّم المنهجية المصطلحية"
      - "اللمّات الموجودة (بوربانك، لوثر بوربانك) تفتقران إلى التشكيل الكامل الإلزامي"
      - "لا يُتوقع وجود أي أدلة معجمية عربية لأسماء الأعلام الشخصية الأجنبية المُعرَّبة"
      - "يجب التحقق من اتساق صيغة التعريب مع المراجع الموسوعية العربية المعتمدة"
    observations: >
      هذه المجموعة الترادفية مخصصة للعالِم الأمريكي لوثر بوربانك (1849-1926)، عالم النبات
      والمُربّي النباتي الشهير. الحالة نموذجية للأعلام الأجنبية: لا مجال للاشتقاق أو المجاز
      أو التركيب، والتعريب الصوتي هو الطريق الوحيد الممكن. المسألة الجوهرية هنا ليست في
      توليد المصطلح بل في اختيار الصيغة التعريبية الأكثر شيوعاً واستقراراً في المصادر
      العربية الموثوقة. التعريف الحالي وظيفي لكنه يفتقر إلى التفصيل الموسوعي اللائق
      بالأعلام التاريخية.
  blind_candidates:
    - lemma: "لُوثَر بُورْبَانك"
      generation_method: taarib
      justification: "تعريب صوتي للاسم الكامل Luther Burbank وفق قواعد التعريب المعيارية الحديثة؛ الواو في 'بُورْبَانك' تُعبّر عن الصوت /ɜː/ في Bur-، والنون الطويلة تُعبّر عن /-æŋk/. هذه الصيغة هي الأشيع في الموسوعات والمراجع العربية"
    - lemma: "بُورْبَانك"
      generation_method: taarib
      justification: "تعريب لقب العائلة Burbank منفرداً؛ كثيراً ما يُشار إلى العلماء في السياقات الأكاديمية والعلمية بلقب العائلة فقط، وهذا الشكل المختصر ضروري لاكتمال الشبكة الدلالية"
    - lemma: "لُوثَر بَرْبَانك"
      generation_method: taarib
      justification: "صيغة تعريب بديلة تستخدم الفتحة على الباء الأولى بدلاً من الضمة مع الواو؛ تُلاحَظ هذه الصيغة في بعض الترجمات العربية القديمة التي لا تُفرق بين vowel qualities الإنجليزية"
    - lemma: "بَرْبَانك"
      generation_method: taarib
      justification: "صيغة تعريب مختصرة للقب تستغني عن الواو الوسيطة؛ تظهر في بعض المصادر العربية المختصرة أو القديمة، وإن كانت مرجوحة قياساً بالصيغة ذات الواو"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١. مطابقة دقيقة دفعية: بوربانك، لوثر بوربانك، بربانك، لوثر (+ صيغ ال-) → لا نتائج
# ٢. جسر إنجليزي: "Burbank" OR "Luther Burbank" OR "horticulturist" → بستاني (entry_id: 454585)
# ٣. FTS عربي: "بستنة" OR "خبير بستنة" → مداخل بستنة فقط (لا تمس الأعلام)
stage2_evidence:
  per_lemma:
    - lemma: "بوربانك"
      evidence_status: "no_material_found"
    - lemma: "لوثر بوربانك"
      evidence_status: "no_material_found"
    - lemma: "لُوثَر بُورْبَانك"
      evidence_status: "no_material_found"
    - lemma: "بُورْبَانك"
      evidence_status: "no_material_found"
    - lemma: "لُوثَر بَرْبَانك"
      evidence_status: "no_material_found"
    - lemma: "بَرْبَانك"
      evidence_status: "no_material_found"
  # ملاحظة عامة: غياب الأدلة المعجمية متوقع تماماً للأعلام الشخصية الأجنبية المُعرَّبة.
  # وُجد في قاعدة البيانات: بستاني = horticulturist (entry_id: 454585، علم الأحياء)
  # وعدة مداخل لـ بستنة = horticulture — لكنها لا تتعلق بلمّات المجموعة مباشرةً.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى الموجودة ──
    - lemma: "بوربانك"
      decision: confirmed
      decision_reason: >
        عَلَم شخصي أجنبي مُعرَّب؛ غياب الأدلة المعجمية متوقع ولا يُعدّ مسوّغاً للرفض.
        الشكل 'بوربانك' يُمثّل اللقب العائلي Burbank وهو المقابل العربي المستقر الأكثر
        تداولاً في السياقات العلمية والأكاديمية. يحتاج إلى تحديث التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الشكل المختصر للاسم (اللقب العائلي فقط: Burbank)، يُستخدم في السياقات الأكاديمية والعلمية التي تشير إلى العالِم بلقبه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُورْبَانك"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "لوثر بوربانك"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخصية التاريخية (Luther Burbank). هذا هو الشكل المعتمد في المراجع
        الموسوعية العربية الكبرى. التعريب بالواو في 'بُورْبَانك' هو الأصح صوتياً والأشيع
        استخداماً. تعبير مركب إضافي (اسم + لقب) — وحدة معجمية ثابتة. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل (الاسم الأول + اللقب العائلي)، يُستخدم في السياقات الرسمية والتعريفية والموسوعية عند ذكر الشخصية لأول مرة أو في عناوين المقالات"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُوثَر بُورْبَانك"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لُوثَر بُورْبَانك"
      source: stage1
      decision: removed
      decision_reason: "يتطابق تماماً مع الشكل المُحدَّث للمّة الموجودة 'لوثر بوربانك' بعد إضافة التشكيل؛ لا حاجة لإنشاء مدخل مستقل."

    - lemma: "بُورْبَانك"
      source: stage1
      decision: removed
      decision_reason: "يتطابق تماماً مع الشكل المُحدَّث للمّة الموجودة 'بوربانك' بعد إضافة التشكيل؛ لا حاجة لإنشاء مدخل مستقل."

    - lemma: "لُوثَر بَرْبَانك"
      source: stage1
      decision: removed
      decision_reason: "صيغة تعريب مرجوحة؛ تُغفل الواو الأصلية في النطق الإنجليزي /bɜːr/، والصواب المعتمد هو بُورْبَانك بالواو لا بَرْبَانك بالفتح."

    - lemma: "بَرْبَانك"
      source: stage1
      decision: removed
      decision_reason: "صيغة مختصرة غير معيارية تحذف الواو الوسيطة؛ مرجوحة مقارنةً بـ'بُورْبَانك' التي تُعبّر عن النطق الإنجليزي بدقة أكبر."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "خبير بستنة أمريكي طور العديد من الأصناف الجديدة من الفواكه والخضروات والزهور (1849-1926)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وظيفي لكنه يصف لوثر بوربانك بـ'خبير بستنة' فحسب، وهو وصف ناقص
        لعالِم اكتسب شهرة عالمية كمُربٍّ نباتي (plant breeder) حقّق منجزات رائدة في
        الانتقاء الاصطناعي والتهجين. كما أن التعريف الحالي مجرد ترجمة حرفية للتعريف الإنجليزي
        دون أسلوب المعجم الوسيط الموسوعي المناسب للأعلام. يُضاف أن 'بستاني' في المعجم
        الموحد للأحياء هو المقابل لـ horticulturist، أما 'عالِم نباتات' فأشمل وأدق لبوربانك.
    authored:
      - type: encyclopedic
        text: "عالِم نباتات ومُربٍّ نباتي أمريكي (1849-1926)، اشتُهر بتطوير مئات الأصناف الجديدة من الفواكه والخضروات والزهور والأشجار باستخدام أساليب الانتقاء الاصطناعي والتهجين النباتي، وتُعدّ إنجازاته في علم تحسين النباتات من أبرز ما أثرى الزراعة الأمريكية في مطلع القرن العشرين."
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10891692-n"
          definition_index: 0
          text: "عالِم نباتات ومُربٍّ نباتي أمريكي (1849-1926)، اشتُهر بتطوير مئات الأصناف الجديدة من الفواكه والخضروات والزهور والأشجار باستخدام أساليب الانتقاء الاصطناعي والتهجين النباتي، وتُعدّ إنجازاته في علم تحسين النباتات من أبرز ما أثرى الزراعة الأمريكية في مطلع القرن العشرين."

  examples:
