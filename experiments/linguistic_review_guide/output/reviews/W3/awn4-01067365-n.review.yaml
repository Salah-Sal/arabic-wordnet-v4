stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي عام جداً ويمكن أن ينطبق على الخمول المطلق أو التقاعد، بينما المعنى المطلوب يتضمن إضاعة الوقت وعدم توفر العمل (idleness, loafing)."
      - "بعض اللمات مثل تسكع تتعلق أكثر بقضاء الوقت بلا هدف، وهو مناسب لمعنى loafing، لكن يجب ربطه بحالة عدم وجود وظيفة."
    observations: "المجموعة تعبر عن حالة سلبية من عدم ممارسة عمل مفيد إما بسبب عدم توفر وظيفة (بطالة) أو تجنب العمل (تسكع وتعطل)."
  blind_candidates:
    - lemma: "بَطَالَة"
      generation_method: ishtiqaq
      justification: "مصدر يدل على الانقطاع عن العمل والفراغ منه."
    - lemma: "تَعَطُّل"
      generation_method: ishtiqaq
      justification: "الخلو من العمل والحركة، وهو مصدر على وزن تفعّل للدلالة على الصيرورة."
    - lemma: "فَرَاغ"
      generation_method: majaz
      justification: "خلو الوقت من الشواغل، ويُستخدم مجازاً للدلالة على من لا عمل له."
    - lemma: "قُعُود"
      generation_method: majaz
      justification: "القعود عن العمل تركُه والتراخي عنه، ويُستخدم للدلالة على التقاعس."

stage2_evidence:
  per_lemma:
    - lemma: "بطالة"
      confirm:
        - text: "عَدَم توافر العمل لشَخْص راغب فيه , وقادر عليه , فى حِرفة تَتَّفق مع استعداده , نظراً لحالة سُوق العمَل"
          source: "المعجم الكبير"
      expands:
        - text: "البطالة: ترك العمل لأن الأحوال تبطل بذلك."
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يوضح أن البطالة تنتج عن بطلان الأحوال أو الأعمال."
    - lemma: "تسكع"
      confirm:
        - text: "سكع وَتَمَادَى فِي الْبَاطِل وتسكع فِي الظلام وَفِي الضلال تخبط وَفِي أمره لم يهتد لوجهته"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "تعطل"
      confirm:
        - text: "(تعطل) بَقِي بِلَا عمل"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "فراغ"
      expands:
        - text: "(الْفَرَاغ) الْخُلُو وَالْمَكَان الْخَالِي"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "يدل على المكان أو الزمان الخالي، وليس حالة فقدان الوظيفة تحديداً."
    - lemma: "قعود"
      expands:
        - text: "وعن الترصد للشيء بالقعود نحو {لَأَقْعُدَنَّ لَهُم} ."
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يدل أكثر على الجلوس الحقيقي أو التراخي."

stage3_analysis:
  per_lemma:
    - lemma: "بطالة"
      decision: confirmed
      decision_reason: "مصدر صريح وشائع يعبر بدقة عن حالة عدم توفر العمل، ويقابل idleness."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَطَالَة"
    - lemma: "تسكع"
      decision: confirmed
      decision_reason: "مصدر فصيح يدل على قضاء الوقت بلا هدف أو عمل مفيد، يقابل loafing تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسَكُّع"
    - lemma: "تعطل"
      decision: confirmed
      decision_reason: "مصدر يدل على الانقطاع عن العمل والبقاء بلا عمل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعَطُّل"
    - lemma: "فراغ"
      source: stage1
      decision: removed
      decision_reason: "يدل على خلو الوقت أو المكان وليس بالضرورة فقدان الوظيفة أو المهنة."
    - lemma: "قعود"
      source: stage1
      decision: removed
      decision_reason: "المعنى الأساسي هو الجلوس، واستخدامه للبطالة يتطلب تخصيصاً مثل 'القعود عن العمل'."

stage4_content:
  definition:
    current: "عدم القيام بعمل أو وظيفة"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب ولا يشمل مفهوم إضاعة الوقت أو انعدام فرصة العمل الملازم للمفهوم."
    authored:
      - type: terminological
        text: "حالة انقطاع عن العمل أو عدم التوفر على وظيفة، أو قضاء الوقت في الفراغ دون نشاط مهني مفيد."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-01067365-n"
          definition_index: 0
          text: "حالة انقطاع عن العمل أو عدم التوفر على وظيفة، أو قضاء الوقت في الفراغ دون نشاط مهني مفيد."
  examples:
    per_lemma:
      - lemma: "بطالة"
        examples:
          - text: "ارتفعت نسبة البطالة في صفوف الشباب حديثي التخرج."
            type: usage
      - lemma: "تسكع"
        examples:
          - text: "يقضي وقته في التسكع في الشوارع هرباً من الفراغ."
            type: usage
      - lemma: "تعطل"
        examples:
          - text: "أدى تعطل العمال إلى تراجع الإنتاج المحلي."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-01067365-n"
          text: "ارتفعت نسبة البطالة في صفوف الشباب حديثي التخرج."
      - command: add_synset_example
        params:
          synset_id: "awn4-01067365-n"
          text: "يقضي وقته في التسكع في الشوارع هرباً من الفراغ."
      - command: add_synset_example
        params:
          synset_id: "awn4-01067365-n"
          text: "أدى تعطل العمال إلى تراجع الإنتاج المحلي."

