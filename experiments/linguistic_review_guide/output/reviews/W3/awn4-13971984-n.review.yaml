# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13971984-n — stardom / نجومية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «نجومية» مكتوبة بدون تشكيل"
      - "التعريف العربي «مكانة كونه معترفاً به كنجم» ترجمة حرفية ركيكة من الإنجليزية"
      - "المجموعة تحتوي على لمّة واحدة فقط، وقد يكون هناك مرادفات مناسبة"
    observations: "المفهوم يدور حول المكانة الاجتماعية العالية التي يحظى بها شخص اشتُهر في مجال الفنون أو الرياضة حتى صار «نجماً». هو نوع خاص من الشهرة مقيّد بمجال الأداء (تمثيل، غناء، رياضة). الفرق بينه وبين الشهرة المطلقة أنه يستلزم الاعتراف بالتفوق لا مجرد الانتشار. الجذر «نجم» غني بدلالة الطلوع والظهور، والمصدر الصناعي «نجومية» منه مقبول صرفياً."

  blind_candidates:
    - lemma: "نَجْمِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «نَجْم» على وزن فَعْلِيَّة، يدل على حالة كون المرء نجماً. أقصر من «نجومية» وأقرب إلى المفرد."
    - lemma: "كَوْكَبِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «كَوْكَب» الذي يُستعمل مجازاً للشخص المتألق البارز. يعطي ظلالاً تراثية لأن العرب استعملوا «كوكب القوم» لسيدهم."
    - lemma: "تَنَجُّم"
      generation_method: ishtiqaq
      justification: "مصدر تَفَعُّل من «نَجَمَ»، يدل على التحول إلى نجم أو بلوغ مرتبة النجومية. لكنه أقرب للحدث منه للحالة."
    - lemma: "صَدَارَة فَنِّيَّة"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يجمع «الصدارة» (التقدم) و«الفنية» (المتعلقة بالفن). لكنه مقيد بالمجال الفني ولا يشمل الرياضة وغيرها."


stage2_evidence:
  per_lemma:
    - lemma: "نُجُومِيَّة"
      confirm:
        - text: "«النَّجميّة؛ النُّجوميّة: كون الممثِّل نجمًا لامعًا؛ مَرْتبة النُّجوم اللامعين»"
          source: "المورد الحديث (2008)"

    - lemma: "نَجْمِيَّة"
      confirm:
        - text: "«النَّجميّة؛ النُّجوميّة: كون الممثِّل نجمًا لامعًا؛ مَرْتبة النُّجوم اللامعين»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«النُّونُ وَالْجِيمُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى طُلُوعٍ وَظُهُورٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «نجم» أصله الطلوع والظهور، مما يدعم الدلالة المجازية على البروز والتفوق"

    - lemma: "كَوْكَبِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَنَجُّم"
      evidence_status: "no_material_found"

    - lemma: "صَدَارَة فَنِّيَّة"
      contradicts:
        - text: "«(الصدارة) التَّقَدُّم يُقَال فلَان لَهُ الصدارة فِي الْقَوْم»"
          source: "المعجم الوسيط"
          conflict: "الصدارة تدل على التقدم العام وليس على مكانة النجومية تحديداً، والمركب ليس وحدة معجمية مسجلة"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "نُجُومِيَّة"
      decision: confirmed
      decision_reason: "مصدر صناعي من «نجوم» (جمع نجم) على وزن فُعُولِيَّة، مسجّل في المورد الحديث بترجمة مطابقة لـ stardom. اللفظ شائع في الإعلام العربي المعاصر ومفهوم بلا لبس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُجُومِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَجْمِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مسجّلة في المورد الحديث كمرادف لـ «نجومية» في مدخل stardom ذاته. مصدر صناعي من المفرد «نجم» بدلاً من الجمع «نجوم»، وهي أخف لفظاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مشتقة من المفرد «نجم» فهي أخف وأقرب إلى الاستعمال الأدبي، بينما «نجومية» من الجمع «نجوم» وأكثر شيوعاً في الإعلام"
      actions:
        - command: create_entry
          params: {lemma: "نَجْمِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "كَوْكَبِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على استعمالها بمعنى النجومية الفنية. لفظ «كوكبية» غير مسكوك ولا شائع في هذا السياق."

    - lemma: "تَنَجُّم"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية. وزن تَفَعُّل يدل على الحدث والتحوّل لا على الحالة المستقرة، والمطلوب هنا اسم حالة (status) لا مصدر فعلي."

    - lemma: "صَدَارَة فَنِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي حرّ لا مصطلح مسكوك. يفشل في اختبار السكّ: يمكن إبدال «فنية» بـ«رياضية» أو «إعلامية» ويبقى وصفاً صالحاً. كما أنه مقيّد بالفن وstardom أعمّ."


