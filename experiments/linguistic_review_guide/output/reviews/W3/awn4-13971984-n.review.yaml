    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية ركيكة من الإنجليزية (the status of being acknowledged as a star)، لا يتّسق مع أسلوب المعجم العربي"
    authored:
      - type: terminological
        text: "مَكانةٌ رَفيعةٌ يَبلُغُها الفَنّانُ أو الرِّياضِيُّ حينَ يُعترَفُ لهُ بالتَّفَوُّقِ والتَّمَيُّزِ فَيَصيرُ نَجْمًا مَشهورًا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "بُلوغُ مَرتبةِ النُّجومِ اللّامِعينَ في مَجالٍ مِنَ المَجالاتِ كالفَنِّ والرِّياضةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَكانةٌ رَفيعةٌ يَبلُغُها الفَنّانُ أو الرِّياضِيُّ حينَ يُعترَفُ لهُ بالتَّفَوُّقِ والتَّمَيُّزِ فَيَصيرُ نَجْمًا مَشهورًا."

  examples:
