    - lemma: "مؤدي عروض المنستريل"
      decision: removed
      decision_reason: "عبارةٌ وصفية حرة تفشل اختبار السكّ: إبدال 'عروض' بـ'أداءات' أو 'مشاهد' لا يُغيِّر الدلالة المعجمية، مما يدل على أنها ليست وحدة معجمية ثابتة. علاوة على ذلك تتضمن اللفظ الأجنبي 'المنستريل' غير المُعرَّب وفق المعايير الاصطلاحية. لا تجتاز اختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material
      mwe_check:
