          params:
            sense_id: "{auto}"

    - lemma: "منشد متجول"
      decision: confirmed
      decision_reason: "اللمّة معتمدة في المعاجم الحديثة (المعجم الوسيط) بمعنى مؤدي الشعر بتلحين وإيقاع، ويُعزِّز 'متجول' طابع الجوّال الملازم لفناني الفِرَق. وإن كانت أقرب دلاليًا إلى الجانجلور، فهي أفضل لمّة معجمية عربية متاحة في غياب مصطلح مسكوك خاص بعروض المنستريل. تحتاج إلى تشكيل كامل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تُخصِّص الأداء بالصوت والتلحين والإنشاد (منشد)، مقرونًا بطابع التجوال والتنقل بين الجماهير (متجول)، مُميِّزةً المؤدي عن الهرم المباشر (فنان استعراضي) بالتركيز على الأداء الصوتي الغنائي لا الدرامي أو الجسدي المجرَّد."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْشِدٌ مُتَجَوِّلٌ"

    - lemma: "مُطْرِبٌ هَزْلِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حر لا يجتاز اختبار السكّ: إبدال هَزْلي بـ'كوميدي' أو 'مُضحك' أو 'فكِه' لا يُغيِّر الدلالة، مما يدل على أنه عبارة وصفية لا مصطلح مسكوك. لم يُسجَّل المركَّب كوحدة في أي معجم مُفهرَس من قواعد البيانات المُراجَعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "مُشَخِّصٌ مُتَجَوِّلٌ"
      source: stage1
      decision: removed
      decision_reason: "مُشَخِّص في المعاجم العربية المعتمدة إما نوع من الدنانير الذهبية (المعجم الكبير) أو المُميِّز بين الأشياء (موسوعة السلطان قابوس)، ولا يحمل معنى المؤدي المسرحي في المصادر الوثيقة. استخدام مُشخَّص بمعنى 'من أدّى دورًا' حديثٌ غير راسخ في المعاجم الكلاسيكية والمعيارية."
      evidence_assessment:
