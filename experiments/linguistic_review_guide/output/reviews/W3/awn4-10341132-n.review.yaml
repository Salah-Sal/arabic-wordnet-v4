# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'مؤدي عروض المنستريل' عبارةٌ وصفية حرة لا تجتاز اختبار التثبيت المعجمي، وتتضمن اللفظ الأجنبي غير المُعرَّب 'المنستريل'"
      - "لمّة 'منشد متجول' تُطابق مفهوم الجانجلور أو التروبادور أكثر من مؤدي عروض المنستريل الأمريكية تحديدًا، كما أكده المورد الحديث"
      - "التعريف يُساوي بين المنستريل القروسطي (المغني الجوّال) وعروض المنستريل الأمريكية (فرقة كوميدية-غنائية) دون فصل نوعي كافٍ"
      - "كلتا اللمّتين مجرَّدتان من التشكيل الكامل"
      - "غياب مصطلح عربي مسكوك خاص بهذا المفهوم الثقافي الغربي المتخصص"
    observations: "المجموعة تمثّل مفهومًا ثقافيًا غربيًا شديد التخصص هو مؤدي عروض المنستريل الأمريكية (minstrel show)، وهي فِرَق استعراضية أمريكية من القرن التاسع عشر تجمع الغناء والفكاهة وكثيرًا ما اعتمدت على تقليد الأفارقة الأمريكيين. لا يوجد في الموروث العربي مصطلح مسكوك بدقة لهذا المفهوم. أقرب ما في المعاجم الحديثة هو 'الكوميدي المُسْتَزْنِج' (المورد الحديث 2008)، غير أن هذا التعبير يحمل أبعادًا عرقية إشكالية ولا يصلح لمّةً مفردة. اللمّتان الحاليتان إما وصفية لفظية (مؤدي عروض المنستريل) أو مقيِّسة على إطار أوسع لا يُطابق المفهوم تمامًا (منشد متجول)."
  blind_candidates:
    - lemma: "مُطْرِبٌ هَزْلِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع الأداء الغنائي الموسيقي (مُطرب = المغنّي الحسن الصوت والأداء) والبُعد الكوميدي الفكاهي (هَزْلي = مثير للضحك والتسلية)، وهما المُعرِّفان الجوهريان لعروض المنستريل الجامعة بين الموسيقى والفكاهة."
    - lemma: "مُشَخِّصٌ مُتَجَوِّلٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يدمج التشخيص المسرحي (مُشَخِّص = من يؤدي دورًا ويُجسِّد شخصية) مع طابع التجوال الملازم لفِرَق العروض الجوّالة في الأرياف والمدن."
    - lemma: "مَهْرَجٌ"
      generation_method: majaz
      justification: "إحياء اللفظ العربي بتوسيع دلالي نحو المؤدي الكوميدي المتنوع، لاشتراكه مع مفهوم المنستريل في إضحاك الجمهور بالحركة والكلام والهيئة في سياق الاستعراض العام."
    - lemma: "مِنِسْتِرِيلُ"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي minstrel بإضفاء الصيغة الصرفية العربية (قبول ال- والجمع والنسبة)، كملاذ أخير إذا تعذّر توفير مقابل عربي مُقنَّن كافٍ."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "مؤدي عروض المنستريل"
      evidence_status: "no_material_found"

    - lemma: "منشد متجول"
      confirm:
        - text: "«مَن يؤدِّى الشعر بتلحين وحسن إيقاع»"
          source: "المعجم الوسيط"
        - text: "«(المنشد) من يُؤَدِّي الشّعْر بتلحين وَحسن إِيقَاع (مو)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«اشتهر الشعراء المُنْشدون على نغمات قيثار لإعطاء أشعارهم طابعا غنائيا، وهي ظاهرة مرتبطة بالمجتمعات الحية.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ALECSO"
      expands:
        - text: "«(1) المغنّي [وبخاصة على أنغام القيثار في القرون الوسطى] (2) «أ» الموسيقي. «ب» الشاعر (3) «أ» الكوميدي المُسْتَزْنِج: عضو في فرقة كوميدية مؤلّفةٍ عادةً من ممثلين بِيْض يظهرون على المسرح بمظهر الزنوج ويقدّمون للنظّارة ضروبًا من الأغاني والنكات إلخ. «ب» البرنامج المُسْتَزْنِج: برنامج مسرحيّ تقدّمه هذه الفرقة الكوميديّة.»"
          source: "المورد الحديث (2008) — مقابل minstrel"
          addition: "يُفرِّق المورد بين المغني القروسطي الجوّال (الحسّ الأول) ومؤدي عروض المنستريل الأمريكية (الحسّ الثالث: الكوميدي المستزنج)؛ وهذه المجموعة الترادفية تعني الحسّ الثالث تحديدًا، في حين أن 'منشد متجول' يُطابق الحسّ الأول."
        - text: "«المغنّي أو الشاعر المتجوِّل.»"
          source: "المورد الحديث (2008) — مقابل jongleur"
          addition: "يُطابق المورد الحديث هذا التعبير مع الجانجلور لا مع المنستريل، مما يكشف أن 'منشد متجول' أدق تمثيلاً للجانجلور منه لمؤدي عروض المنستريل."

    - lemma: "مُطْرِبٌ هَزْلِيٌّ"
      confirm:
        - text: "«المغنِّي الحَسَنُ الصَّوْتِ والأداءِ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«اسم فاعل من أطْرَب غلب في المغنّي الحسن الصوت والأداء»"
          source: "المعجم الوسيط"
        - text: "«(المطرب) اسْم فَاعل من أطرب وَغلب فِي المغنى الْحسن الصَّوْت وَالْأَدَاء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«نوع أدبي مثير للضحك ونازعٌ إلى التسلية وسخرية غير لاذعة تستهدف الفرجة والمتعة في المسرح.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مقابل humorous"
          addition: "يُثبِّت المعجم أن هَزْلي في السياق المسرحي يعني الأداء الكوميدي المُسلِّي، غير أن المركَّب 'مُطرب هَزْلي' لم يُسجَّل كوحدة معجمية ثابتة."

    - lemma: "مُشَخِّصٌ مُتَجَوِّلٌ"
      contradicts:
        - text: "«ضرب من دنانير الذهب المصورة كان معروفًا في البندقية بإيطاليا, وعرفته مصر منذ القرن الثاني عشر الهجري»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: "المُشَخَّص في المعجم الكبير نوعٌ من العملات الذهبية المصوَّرة، ولا صلة له بالأداء المسرحي."
        - text: "«من يعيد الشيء ويميزه عما سواه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المُشَخِّص بمعنى المُميِّز بين الأشياء، لا المؤدي المسرحي."

    - lemma: "مَهْرَجٌ"
      confirm:
        - text: "«مَن يروِّج الهَرْج والمرَج, ويذيع الأباطيل المزيِّفَة من يُضحك القوم بحركاته وكلماته وهيئته»"
          source: "المعجم الوسيط"
        - text: "«من يضحك الناس بحركاته وكلماته وهيئته في السيرك»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«(المهرج) من يروج الهرج والمرج ويذيع الأباطيل المزيفة وَمن يضْحك الْقَوْم بحركاته وكلماته وهيئته (مو)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الدلالة تتضمن ترويج الفوضى والأباطيل، مما يُضيف حِملاً سلبيًا لا يُطابق الفنان الترفيهي المحترف."
      expands:
        - text: "«(1) مُهَرِّج (2) هَزْليّ.»"
          source: "المورد الحديث (2008) — مقابل buffo"
          addition: "يُطابق المورد مُهَرِّج مع buffo (الأداء الكوميدي الفكاهي الغنائي)، مما يقترب من البُعد الكوميدي للمنستريل، لكن البُعد الموسيقي يظل غائبًا."

    - lemma: "مِنِسْتِرِيلُ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
