# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «مستعرض بالعصا» ليست تركيباً إضافياً مسكوكاً، بل عبارة وصفية حرة (اسم فاعل + جار ومجرور) تفتقر إلى الثبات المعجمي."
      - "لفظ «مستعرض» يحمل في الاستخدام التقني المعاصر دلالةً هندسيةً راسخةً (transverse)، مما يُحدث اشتراكاً لفظياً مُضلِّلاً."
      - "اللمّتان الحاليتان بلا تشكيل كامل؛ يتعذّر تحديد الضبط الصرفي دون ترقيم."
      - "المفهوم ذو طابع غربي خالص (baton twirling) لا تقابله وحدة معجمية مسكوكة في المعاجم العربية."
    observations: >
      المجموعة تصف فنان استعراضي متخصص في لعب العصا وتدويرها ضمن العروض والمواكب الموسيقية.
      الفعل الجوهري هو «دوّر» أو «أدار» العصا، والإطار العام هو الاستعراض الفني أمام الجمهور.
      الجذر (ل-ع-ب) المُتجلِّي في «لاعب» يدل على المهارة والأداء، وهو الأوفق دلالياً.
      لم يوفّق الواضعون في صياغة اللمّة الثانية؛ فإن «مستعرضاً بالعصا» وصفٌ لا مصطلح.
  blind_candidates:
    - lemma: "دَوَّارُ الْعَصَا"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «دَوَّار» (وزن فَعَّال للمبالغة والاحتراف، من الجذر د-و-ر دالاً على الدوران)
        مضافاً إلى «الْعَصَا». الوزن فَعَّال مطّرد لمن يُكثر من فعل ما: غَوَّاص، صَوَّاغ، بَنَّاء.
        يعني: من يحترف تدوير العصا ويُكثر منه — يُصوِّر المهارة المحورية في المفهوم.
    - lemma: "مُدِيرُ الْعَصَا"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مُدِير» (اسم فاعل من أَدَارَ يُدير = يُدوِّر ويُحرِّك دورياً) مضافاً
        إلى «الْعَصَا». «أدار الشيء» = جعله يدور؛ ويعني هنا من يُدير العصا بيده مهاراً.
    - lemma: "عَصَّاء"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من «عصا» للدلالة على الاحتراف والإكثار، قياساً على: خَيَّاط، حَدَّاد، نَجَّار.
        «العصّاء» = من يحترف اللعب بالعصا ويُمثِّلها أداةً لفنّه.
    - lemma: "رَاشِق"
      generation_method: majaz
      justification: >
        من الجذر ر-ش-ق الدال على الخفة والإتقان في الرمي والحركة؛ «الرَّشَق» = الخفة والرشاقة
        في الأداء. بالمجاز يُطلق على من يُؤدي حركات سريعة خفيفة بالعصا بمهارة فائقة في الاستعراض.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  queries_run:
    - id: Q1
      type: batch_headword
      description: "بحث دفعي بالرأسية لجميع اللمّات (الموجودة + المرشحات)"
      terms: ["لاعب العصا", "مستعرض بالعصا", "دوار العصا", "مدير العصا", "عصاء", "راشق"]
    - id: Q2
      type: english_bridge
      description: "جسر إنجليزي — baton twirler, twirler, majorette, baton"
    - id: Q3
      type: fts_arabic
      description: "بحث بالكلمات المفتاحية: تدوير، عصا، استعراض، مستعرض"
    - id: Q4
      type: maqayis
      description: "مقاييس اللغة لجذور: دور، لعب، عصوي، عرض"
    - id: Q5
      type: component_words
      description: "مكوّنات اللمّات: لاعب، عصا — من مصادر OCR"

  per_lemma:
    - lemma: "لاعب العصا"
      expands:
        - text: "«العَصا: ما يُتَّخَذُ من خشب وغيره للتَّوَكُّؤِ أو الضَّرْب [مؤنث]»"
          source: "المعجم الوسيط"
          addition: "يؤكد أن «العصا» أداة مادية صلبة، مما يعزز دلالة «لاعب العصا» على من يمسكها ويُعرِض بها."
        - text: "«لعب يلعب لعباً فهو لاعب»"
          source: "كتاب العين"
          addition: "يثبت وزن «فاعل» من لعب للدلالة على القائم بالفعل باستمرار."
        - text: "«اللَّامُ وَالْعَيْنُ وَالْبَاءُ كَلِمَتَانِ مِنْهُمَا يَتَفَرَّعُ كَلِمَاتٌ. إِحْدَاهُمَا اللَّعِبُ مَعْرُوفٌ. وَالتِّلْعَابَةُ: الْكَثِيرُ اللَّعِبِ. وَالْمَلْعَبُ: مَكَانُ اللَّعِبِ»"
          source: "مقاييس اللغة"
          addition: "يرسّخ أن اللعب معروف ومن مشتقاته «لاعب»."
        - text: "«الْعَيْنُ وَالصَّادُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ... فَالْأَوَّلُ الْعَصَا، سُمِّيَتْ بِذَلِكَ لِاشْتِمَالِ يَدِ مُمْسِكِهَا عَلَيْهَا، ثُمَّ قِيسَ ذَلِكَ فَقِيلَ لِلْجَمَاعَةِ عَصًا»"
          source: "مقاييس اللغة"
          addition: "يعلّل تسمية العصا باحتواء اليد لها، مما يُوطِّد الصلة بين «لاعب العصا» وفعل الإمساك والتحريك."

    - lemma: "مستعرض بالعصا"
      contradicts:
        - text: "«مستعرض» → transverse (عمودي على الاتجاه الرأسي)"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          conflict: "الاستخدام التقني الراسخ لـ«مستعرض» في العربية المعاصرة يعني «عرضي/عمودي» (transverse)، مما يُحدث تعارضاً دلالياً صارخاً."
        - text: "«مستعرض» → transverse (broadside)"
          source: "موسوعة الكهرباء (IEC 60050)"
          conflict: "توكيد إضافي على تحوّل «مستعرض» لمصطلح تقني ثابت بمعنى العَرْضي/المتعامد."
      expands:
        - text: "«استعراض المواهب: استعراضٌ مؤلَّف من سلسلة من الأغاني أو المعزوفات المنفردة يقدِّمُها عدد من الهواة»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد أن «الاستعراض» بمعنى العرض الفني صحيح لغوياً، لكن «مستعرضاً» هو اسم فاعل من استعرض وليس مصطلحاً مسكوكاً."

    - lemma: "دوار العصا"
      expands:
        - text: "«الدَّالُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى إِحْدَاقِ الشَّيْءِ بِالشَّيْءِ مِنْ حَوَالَيْهِ. يُقَالُ دَارَ يَدُورُ دَوَرَانًا. وَالدَّوَّارِيُّ: الدَّهْرُ؛ لِأَنَّهُ يَدُورُ بِالنَّاسِ أَحْوَالًا»"
          source: "مقاييس اللغة"
          addition: "يثبت أن جذر د-و-ر أصل واحد يدل على الدوران والإحداق، مما يُسوِّغ اشتقاق «دَوَّار» للدلالة على المُكثِر من الدوران."
      evidence_status_note: "لم يُعثر على «دوار العصا» كمركّب مسجّل في أي معجم، لكن الأصول الجذرية سليمة."

    - lemma: "مدير العصا"
      evidence_status: "no_material_found"

    - lemma: "عصاء"
      contradicts:
        - text: "«العدوى بالعصيات (الباسيلات)» — translation_en: bacillosis"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          conflict: "«عُصاء» مصطلح طبي راسخ لمرض «الداء العصياتي» (bacillosis)؛ استخدامه بمعنى لاعب العصا يُوقع في الاشتراك اللفظي الضار."

    - lemma: "راشق"
      contradicts:
        - text: "«راشَقَه: سايرَه وجاراه. راشَقَنِى مَقْصِدى: بارانى فى المَسيرِ إليه. (وهو مجان) بالسِّهام: بادَلَهُ الرَّمْىَ بها»"
          source: "المعجم الكبير"
          conflict: "«راشق» في المعجم فعل ثلاثي (pos: verb)، وليس اسماً. اسم الفاعل «رَاشِق» إن اشتُقَّ يدل على «رامي السهام» لا على «مُدوِّر العصا»؛ المجاز المقترح بعيد ومتكلَّف."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "لاعب العصا"
      decision: confirmed
      decision_reason: >
        تركيب إضافي مسكوك واضح الدلالة: «لاعب» (اسم فاعل من لَعِب) مضاف إلى «العصا».
        الجذر (ل-ع-ب) يدل على المهارة الأدائية؛ والعصا أداةٌ موثَّقة في جميع المعاجم.
        يجتاز اختبار التثبيت المعجمي: «لاعب العصا» وحدة اصطلاحية لا يمكن إبدال «العصا»
        فيها بـ«السيف» مع بقاء الدلالة نفسها. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        «لاعِبُ الْعَصَا» يُبرِز الجانب الأدائي والترفيهي القائم على المهارة بالعصا،
        وله صدى في الموروث العربي (رقص العصا، لعب العصا)، مما يجعله الأوسع قبولاً
        والأعمق جذوراً في الوجدان اللغوي العربي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاعِبُ الْعَصَا"

    - lemma: "مستعرض بالعصا"
      decision: removed
      decision_reason: >
        أولاً: لا تجتاز اختبار السكّ المعجمي — يمكن إبدال «بالعصا» بـ«بالسيف» أو «بالقضيب»
        مع بقاء العبارة وصفاً صحيحاً. ثانياً: «مُسْتَعْرِض» في الاستخدام التقني المعاصر
        مصطلحٌ هندسي راسخ بمعنى «عَرْضي/transverse». ثالثاً: التركيب ليس إضافياً
        بل اسم فاعل مع شبه جملة، مما يجعله عبارة وصفية حرة لا مصطلحاً مسكوكاً.
        يُستبدل بـ«دَوَّارُ الْعَصَا» الأكثر دقةً وثباتاً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "دوار العصا"
      source: stage1
      decision: confirmed
      decision_reason: >
        تركيب إضافي مسكوك من «دَوَّار» (وزن فَعَّال للمبالغة والاحتراف من جذر د-و-ر المثبَّت
        في المقاييس) مضافاً إلى «الْعَصَا». يجتاز اختبار السكّ: لا يمكن إبدال «العصا»
        فيه بمرادف دون تغيير الدلالة الاصطلاحية. يُركِّز تحديداً على حركة التدوير
        كمهارة محورية — أكثر دقةً من «لاعب العصا» في وصف هذا الفن تحديداً.
        الوزن (فَعَّال) مطّرد للمحترفين: غَوَّاص، نَجَّار، صَوَّاغ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        «دَوَّارُ الْعَصَا» يُخصِّص المهارة بالتدوير والإدارة الدائرية للعصا، وهو المهارة
        المميِّزة لهذا الفن في الاستعراضات الرسمية والمواكب الموسيقية؛ أكثر تخصصاً
        وأعلى تقنيةً من «لاعب العصا» الذي يشمل كل أشكال اللعب بالعصا.
      actions:
        - command: create_entry
          params:
            lemma: "دَوَّارُ الْعَصَا"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مدير العصا"
      source: stage1
      decision: removed
      decision_reason: >
        «مُدِير» اسم فاعل من أدار يُفيد الإدارة بمعنى التوجيه والرئاسة أكثر من الدوران
        الجسدي؛ قد يُفهم منه «مدير الفرقة الموسيقية» لا «من يُدوِّر العصا». «دَوَّارُ الْعَصَا»
        أدق وأسلم من الالتباس.

    - lemma: "عصاء"
      source: stage1
      decision: removed
      decision_reason: >
        «عُصاء» مصطلح طبي مسكوك في المعجم العربي للمصطلحات الطبية يعني «الداء العصياتي»
        (bacillosis). استخدامه بمعنى لاعب العصا يُفضي إلى اشتراك لفظي ضار لا يُقبل.

    - lemma: "راشق"
      source: stage1
      decision: removed
      decision_reason: >
        «راشَقَ» فعلٌ في جميع مصادر قاعدة البيانات (pos: verb)، وإذا اشتُقَّ منه اسم الفاعل
        «رَاشِق» دلَّ على رامي السهام لا على مُدوِّر العصا؛ المجاز مرفوض لبُعده
        وعدم اطِّراده. لا يصلح حتى باب المجاز لغياب الصلة الوظيفية أو الشكلية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "شخص يقوم بتدوير العصا بمهارة كجزء من استعراض"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي عامي الأسلوب («يقوم بـ» مطوَّلة)، وشبه دائري (يُعرِّف «دوار العصا»
        بـ«تدوير العصا»)، وغير محدِّد للسياق (أي استعراض؟ فردي أم جماعي؟).
        يفتقر إلى الجنس القريب الكافي ولا يُميِّز الشخص من الفن نفسه.
    authored:
      - type: terminological
        text: >
          فنانٌ استعراضيٌّ يُحكِم إدارةَ عصا طويلة ورميَها وإيقاعَها بحركاتٍ إيقاعيةٍ
          مُتقَنةٍ ضمن مواكب الفرق الموسيقية أو العروض الترفيهية العامة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          شخصٌ يؤدي فنَّ دوران العصا (baton twirling) في الاستعراضات العامة والمواكب
          الموسيقية، إذ يُدير عصا معدنية أو بلاستيكية مُثقَّلة الطرفين إدارةً سريعةً
          مع رميها في الهواء وإمساكها بمهارة، وكثيراً ما يُرافق ذلك أداءٌ راقصٌ
          وحركاتٌ بهلوانية. يُعدُّ هذا الفن من مكوِّنات الثقافة الترفيهية الغربية
          المرتبطة بالفرق الموسيقية (الماجوريت).
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            فنانٌ استعراضيٌّ يُحكِم إدارةَ عصا طويلة ورميَها وإيقاعَها بحركاتٍ إيقاعيةٍ
            مُتقَنةٍ ضمن مواكب الفرق الموسيقية أو العروض الترفيهية العامة.
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >
            شخصٌ يؤدي فنَّ دوران العصا في الاستعراضات العامة والمواكب الموسيقية، إذ
            يُدير عصا مُثقَّلة الطرفين إدارةً سريعةً مع رميها في الهواء وإمساكها
            بمهارة، وكثيراً ما يُرافق ذلك أداءٌ راقصٌ وحركاتٌ بهلوانية.

  examples:
    per_lemma:
      - lemma: "لَاعِبُ الْعَصَا"
        examples:
          - text: "بَرَعَ لَاعِبُ الْعَصَا فِي أَدَاءِ فِقْرَتِهِ أَمَامَ الْجُمْهُورِ مُثِيراً إِعْجَابَهُمْ بِخِفَّةِ حَرَكَاتِهِ."
            type: usage
      - lemma: "دَوَّارُ الْعَصَا"
        examples:
          - text: "أَدَّى دَوَّارُ الْعَصَا حَرَكَاتٍ بَهْلَوَانِيَّةً مُبْهِرَةً فِي مُقَدِّمَةِ الْمَوْكِبِ الْمُوسِيقِيِّ."
            type: usage
    actions:
