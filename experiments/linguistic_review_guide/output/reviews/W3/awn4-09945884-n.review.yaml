# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «فنان كلاسيكي» تفتقر إلى التشكيل الكامل"
      - "مكوّن «كلاسيكي» تعريب لا جذر عربياً له، مما يُضعف أصالة المصطلح"
      - "التعريف «فنان أبدع أعمالاً كلاسيكية» دائريٌّ: يستعمل «كلاسيكية» في تعريف «كلاسيكي»"
      - "المجموعة تحتوي لمّة واحدة فقط، وهو تمثيل دلالي هزيل لمفهوم واسع الانتشار في النقد الفني"
    observations: >
      المجموعة ترادفية تشير إلى مفهوم «الفنان الكلاسيكي» بمعنى من أبدع أعمالاً راسخة
      في ذاكرة الفنون الإنسانية وغدت مرجعاً خالداً. اللمّة الموجودة مركّب وصفي (إضافة
      وصفية)، موثّق في المعجمية العربية الحديثة لكنه يعتمد اعتماداً كلياً على تعريب
      «كلاسيكي». يكشف تحليل الفجوة المعجمية أن العربية تفتقر إلى مصطلح مفرد أصيل لهذا
      المفهوم، إذ تقتصر الاصطلاحات المعاصرة على المركّب «فنان كلاسيكي». الجذر الأعلى
      في الشجرة هو awn4-09831743-n (فنان/مبدع) وهو يناسب هذا الوضع.

  # ── التوليد الأعمى: قبل الاطلاع على اللمّات الموجودة ──
  blind_candidates:
    - lemma: "أَصِيل"
      generation_method: ishtiqaq
      justification: >
        من جذر (أصل): وزن فَعِيل للنسب والاختصاص. «الأصيل» يدل على من يمثّل جوهر
        شيء ما أصالةً وامتيازاً. يمكن أن يُطلق على الفنان الذي تُمثّل أعماله الأصل
        الذي يُحتذى به. وهو أمثل من «أصيل» الأدب في الاستعمال الحديث.
    - lemma: "فَحْل"
      generation_method: majaz
      justification: >
        إحياء للاستعمال التراثي في «فحول الشعراء»؛ إذ سمّت العرب كبار الشعراء فحولاً
        على سبيل المجاز من الفحل الكريم المنجب. امتداد المجاز إلى سائر الفنون ممكن
        صياغةً، على وزن فَعْل للدلالة على القدرة والتمكّن.
    - lemma: "عَمِيدُ الفُنُون"
      generation_method: tarkib
      justification: >
        مركّب إضافي: «عميد» (من عمد أي اعتُمد عليه وكان عماداً) + «الفنون». استخدام
        «عميد» للدلالة على الريادة والسيادة في الحقل راسخ في الاستخدام الثقافي العربي
        المعاصر (عميد الأدب العربي طه حسين). التعبير يشير إلى أبرز أعلام الفنون.
    - lemma: "كلاسِيكِيّ"
      generation_method: taarib
      justification: >
        تعريب مستقر لـ classique/classic يقبل التعريف والنسبة والجمع (كلاسيكيون).
        يُستخدم في النقد الأدبي والفني العربي المعاصر اسماً للدلالة على الفنان
        المنتسب إلى التقليد الكلاسيكي. ملاذ أخير بعد استنفاد الخيارات الأعلى رتبةً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  # ── الاستعلامات المُنفَّذة (٥ استعلامات) ──
  # Q1: مطابقة دفعية (فنان كلاسيكي + المرشحات الأربعة)
  # Q2: جسر إنجليزي (classic, classicist, classical artist)
  # Q3: FTS عربي (فنان كلاسيكي، الفنان الكلاسيكي)
  # Q4: مقاييس اللغة لابن فارس (فنن، فحل، أصل)
  # Q5: إثراء (تعريفات كلاسيك في الحوراماني)

  per_lemma:

    - lemma: "فنان كلاسيكي"
      confirm:
        - text: >
            «(8) الكاتب أو الفنان الكلاسيكيّ»
          source: "المورد الحديث (2008) — مدخل classic (اسم)"
        - text: >
            «(3) «أ», كلاسيكيّ: «ب» مُلتزم بالأشكال التقليدية. «ج» متضلّع من أدب
            الإغريق والرومان. (4) تقليديّ؛ أصيل: مُعتبَرٌ عمدةً في حقل من حقول
            المعرفة بوصفه متميزاً عن النظريات الجديدة أو غير المألوفة»
          source: "المورد الحديث (2008) — مدخل classical (صفة)"
        - text: >
            «كلاسيكيّ [مفرد]: اسم منسوب إلى كلاسيكيّة. صفة تُطلق على أيّ أدب ممتاز،
            يتميّز على الأقل ببعض المميّزات الآتية: الاتّزان والوحدة الفنيّة والاعتدال
            والبساطة وتناسُب الأجزاء، ولو لم يكن قديماً»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: >
            «فترة في تاريخ الموسيقى الأوروبية» [translation_en: classical]
          source: "مسرد الفن والتسلية والرياضة — المنظمة العربية للتربية والثقافة والعلوم"

    - lemma: "أَصِيل"
      contradicts:
        - text: >
            «الشريف والنجيب»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            «أصيل» هنا صفة للشخص ذي النسب الرفيع، لا للفنان صاحب الأعمال الكلاسيكية.
            المعنى يدور على الأصل والنسب لا على الإبداع الفني.
        - text: >
            «صفةٌ لشيءٍ في شكله الأصلي» [translation_en: native]
          source: "معجم مصطلحات المعلوماتية (2000) — ARABTERM"
          conflict: >
            «أصيل» في الاستعمال التقني يُشير إلى الملف أو الصيغة الأصلية، لا إلى
            الشخص الفنان. الدلالة مجردة وتقنية.
        - text: >
            «كلمة تشير إلى المنتَج الأصلي» [translation_en: genuine]
          source: "مسرد التربية — المنظمة العربية للتربية والثقافة والعلوم"
          conflict: >
            «أصيل» = منتج أصلي (مقابل مزيّف)؛ لا علاقة له بالمعنى المنشود.
      expands:
        - text: >
            «الْهَمْزَةُ وَالصَّادُ وَاللَّامُ، ثَلَاثَةُ أُصُولٍ مُتَبَاعِدٍ بَعْضُهَا
            مِنْ بَعْضٍ، أَحَدُهَا: أَسَاسُ الشَّيْءِ [...] وَيُقَالُ: مَجْدٌ أَصِيلٌ»
          source: "مقاييس اللغة لابن فارس — مادة أصل"
          addition: >
            الجذر (أصل) يدل على الأساس والأصل. «مجد أصيل» أي راسخ ثابت. يمكن توظيف
            هذه الدلالة في وصف الأعمال الفنية الراسخة لكن المصطلح كاسم للشخص لا أصل
            له في هذه المصادر.

    - lemma: "فَحْل"
      confirm:
        - text: >
            «وفُحولُ الشِّعْرِ: الغالِبونَ بالهجاءِ مَنْ هاجاهُم، وكذا كلُّ مَنْ إذا
            عارَضَ شاعراً فُضِّلَ عليه»
          source: "القاموس المحيط للفيروزآبادي"
        - text: >
            «الْفَاءُ وَالْحَاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ذَكَارَةٍ
            وَقُوَّةٍ. مِنْ ذَلِكَ الْفَحْلُ مِنْ كُلِّ شَيْءٍ، وَهُوَ الذَّكَرُ
            الْبَاسِلُ [...] وَفَحْلٌ فَحِيَلٌ: كَرِيمٌ»
          source: "مقاييس اللغة لابن فارس — مادة فحل"
      contradicts:
        - text: >
            «الغالِبونَ بالهجاءِ مَنْ هاجاهُم» — الفحل من الشعراء هو المنتصر في
            مبارزة الهجاء، أي في التفوق التنافسي.
          source: "القاموس المحيط للفيروزآبادي"
          conflict: >
            مفهوم «فحول الشعر» يدل على التفوق في المنافسة الشعرية، لا على إبداع
            أعمال خالدة راسخة. المنشود هو دلالة الرسوخ الزمني والكنوزية (canonicity)
            لا التفوق التنافسي.

    - lemma: "عَمِيدُ الفُنُون"
      evidence_status: "no_material_found"

    - lemma: "كلاسِيكِيّ"
      confirm:
        - text: >
            «الكلاسيكيّ: «أ» الملتزم قواعدَ الكلاسيكية في الأدب والفن. «ب» المنادي
            بضرورة دراسة أدب الإغريق والرومان. «ج» المتضلّع من هذا الأدب»
          source: "المورد الحديث (2008) — مدخل classicist"
        - text: >
            «(1) ممتاز؛ من الطراز الأول [...] (8) الكاتب أو الفنان الكلاسيكيّ»
          source: "المورد الحديث (2008) — مدخل classic"
      contradicts:
        - text: >
            «فترة في تاريخ الموسيقى الأوروبية» — الكلاسيكي في هذا المعجم يُشير إلى
            حقبة زمنية، لا إلى شخص.
          source: "مسرد الفن والتسلية والرياضة — ARABTERM"
          conflict: >
            «كلاسيكي» وحده (بدون «فنان») يحتمل معاني عدة: الصفة (كلاسيكي الأسلوب)،
            الحقبة الموسيقية، المنتسب للتقليد الكلاسيكي. الدلالة على «الفنان الذي
            أبدع أعمالاً كلاسيكية» غير مستقلة بدون السياق أو الإضافة «فنان».


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ──
    - lemma: "فنان كلاسيكي"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في المورد الحديث (2008) كترجمة مباشرة لـ classic (بمعناه الاسمي)
        بصيغة «الكاتب أو الفنان الكلاسيكيّ». المركّب الوصفي سليم صرفياً ودلالياً، ويُشاع
        في النقد الفني العربي المعاصر. التعريب في «كلاسيكي» مقبول إذ استوفى شروط
        قبول لام التعريف والنسبة والجمع السالم (كلاسيكيون). اللمّة تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُشير إلى الفنان الذي تُعدّ أعماله نموذجاً راسخاً
        يُحتذى به في تاريخ الفنون، بما تضمّنه من اتزان وأناقة وعمق يجعلها مرجعاً خالداً.
        تتمايز عن المفاهيم المجاورة: المبدع (فنان مبتكر، أعم)، والرائد (أسبق في الزمن)،
        والكلاسيكيّ كصفة محضة.
      # فحوص إضافية
      borrowing_check:
        lexical_borrowing: "معرَّبة مقبولة — كلاسيكي استوفى معايير التعريب"
        blind_calque: "المصطلح يتوافق مع المدلول العلمي المقصود"
        conceptual_calque: "مقبول — الهيكل الإضافي العربي (فنان + كلاسيكي) واضح"
      morphological_fit: >
        المركّب الوصفي (فنان + نعت) وزن منتج للفاعل المتسم بصفة، مناسب لتصنيف الأشخاص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَنَّان كلاسِيكِيّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أَصِيل"
      source: stage1
      decision: removed
      decision_reason: >
        «أصيل» في المعجمية العربية يدل على: (أ) الشريف النسيب، (ب) الوقت بعد العصر،
        (ج) في الاستعمال التقني: الأصل/الأصلي. لا تدعم هذه الدلالات معنى «الفنان الذي
        أبدع أعمالاً كلاسيكية». كما أنه لا يجتاز اختبار السكّ باسم لشخص بعينه من الفنانين.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "فَحْل"
      source: stage1
      decision: removed
      decision_reason: >
        «فحول الشعر» في التراث العربي يعني المتفوقين في المبارزة الشعرية التنافسية،
        وهو مختلف جوهرياً عن الفنان الذي أبدع أعمالاً راسخة كلاسيكية. مفهوم «الكلاسيكي»
        يقوم على الرسوخ الزمني والكنوزية (canonicity)، بينما «الفحل» يقوم على التفوق
        في المنافسة الآنية. الدلالتان متمايزتان ولا يصح الخلط بينهما.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "عَمِيدُ الفُنُون"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: يمكن إبدال «الفنون» بـ «الآداب» أو «الموسيقى»
        أو «الرياضة» وتبقى العبارة وصفاً صحيحاً، مما يدل على أنها وصف حر لا مصطلح
        مسكوك. لا وجود له في قاعدة البيانات المعجمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "كلاسِيكِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المورد الحديث يستخدم «الكلاسيكيّ» اسماً للدلالة على المنتسب للتقليد الكلاسيكي
        (classicist) أو المتضلع من آدابه — وهو مفهوم أوسع وأقل دقةً من «الفنان الذي
        أبدع أعمالاً كلاسيكية». «كلاسيكيّ» وحده يحتمل معاني عدة (صفة، حقبة، مذهب)
        ولا يقوم مستقلاً دلالةً على الشخص المنشود إلا بالقرينة. اللمّة الموجودة
        «فنان كلاسيكي» أدق وأوضح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


