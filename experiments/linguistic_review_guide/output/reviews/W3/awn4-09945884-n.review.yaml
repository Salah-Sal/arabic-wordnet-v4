# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
stage5_enrichment:
  per_entry:
    # مدخل مركّب (MWE): فنان كلاسيكي
    - lemma: "فَنَّان كلاسِيكِيّ"
      entry_id: "{auto}"
      roots:
