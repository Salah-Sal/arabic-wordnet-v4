# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائري: يستخدم كلمة 'السنيد' — وهي اللمة المُراجَعة نفسها — داخل تعريف المجموعة، مما يُفضي إلى دور معجمي صريح."
      - "اللمة الثانية 'ممثل مساعد للكوميدي' عبارةٌ وصفية حرة لا مصطلحٌ مسكوك: يمكن إبدال 'مساعد' بـ'معاون' أو 'مرافق' وتبقى صالحة كوصف، وهذا يُفشلها في اختبار التثبيت المعجمي."
      - "كلتا اللمتين خاليتان من التشكيل الكامل."
      - "ملاحظة منهجية: الملف المُقنَّع يكشف اللمةَ الأولى من خلال التعريف نفسه ('السنيد')، مما يُضعف مبدأ التوليد الأعمى. مع ذلك جرى التوليد استناداً إلى الدلالة العامة للمفهوم."
    observations: >
      المفهوم المقصود هو الممثل الثانوي في الثنائي الكوميدي، المعروف بالإنجليزية بـ'second banana' أو 'stooge':
      شخص يُهيِّئ المواقف الضاحكة ويجعل نفسه موضعاً لسخرية الكوميدي الرئيسي وأُضحوكةً للجمهور.
      هذا المفهوم موجود في التراث المسرحي العربي لكنه يفتقر إلى توثيق معجمي كلاسيكي واضح.
      الجذر (س ن د) يوحي بالدعم والمساندة، فيما يحمل الجذر (ض ح ك) الدلالة الأدق على كون الشخص مادةً للضحك.

  blind_candidates:
    - lemma: "مُسَانِد"
      generation_method: ishtiqaq
      justification: >
        من الجذر (س ن د) على وزن مُفَاعِل الدال على المشاركة في الفعل؛ المُسانِد هو من يساند الممثلَ الكوميديَّ
        الرئيسيَّ ويدعمه. الوزن مُفَاعِل منتج في العربية للأدوار الوظيفية (مُساعِد، مُعاوِن، مُناصِر).

    - lemma: "رَدِيف"
      generation_method: majaz
      justification: >
        الرديف في الأصل من يركب خلف الراكب — مجازٌ وظيفي دقيق للممثل الذي يأتي في المرتبة الثانية خلف
        النجم الكوميدي الرئيسي. اللفظ حيٌّ في المعجمية العربية وإن لم يُستعمل بعدُ في السياق المسرحي.

    - lemma: "أُضْحُوكَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (ض ح ك) على وزن أُفْعُولَة الدال على ما يُتخذ للغرض ذاته؛ الأُضحوكة ما يُضحك منه.
        الوزن منتج للمفاهيم ذات الطابع التعرُّضي (أُغنية، أُعجوبة). يصف هذا المرشحُ الدورَ بدقة: الممثلُ الذي
        يُجعل موضعاً للسخرية والضحك خدمةً للكوميدي الرئيسي.

    - lemma: "ظَهِير"
      generation_method: majaz
      justification: >
        الظهير في اللغة المعين الذي يسند ظهره إلى ظهرك — مجازٌ عن الشريك الداعم. قد يصف الدور الثانوي
        الساند للنجم الكوميدي، غير أن دلالة الظهير تميل إلى الشراكة المتكافئة لا إلى التبعية الكوميدية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "سَنِيد"
      contradicts:
        - text: "«السَّنيد: الدَّعِيُّ»"
          source: "المعجم الوسيط"
          conflict: >
            المعنى المُثبَت في المعجم الوسيط هو 'الدعي' (من لا يُعرف أبوه) لا الممثل المساعد؛
            الدلالة المسرحية غائبة تماماً.
        - text: "«سَنِيد: الدَّعِىُّ، وهى بتاءٍ»"
          source: "المعجم الكبير"
          conflict: >
            يؤكد المعجم الكبير الدلالة ذاتها ويُغفل أي استخدام مسرحي أو بمعنى 'المساعد'.
      expands:
        - text: "«سَنِيد: من (س ن د) مبالغة بمعنى سَنَّاد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يثبت هذا الإدخال أن سَنِيد يمكن أن يكون مشتقاً من الجذر (س ن د) بمعنى مبالغة في المساندة
            (سَنَّاد = كثير الإسناد والدعم)؛ هذا يفتح إمكانية الاستعمال الاشتقاقي للمصطلح المسرحي،
            وإن ظل غير موثق بهذا التخصيص في المعاجم الكبرى.
        - text: "«سُنَيْد: من (س ن د) تصغير السَّنَد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يثبت أن صيغة سُنَيْد (بضم السين) هي تصغير لـ'السَّنَد'، وهذا يُميّز بين ضبطَين مختلفَين
            للكلمة، مما يستوجب الحرص على التشكيل الصحيح في المخرجات.

    - lemma: "ممثل مساعد للكوميدي"
      evidence_status: "no_material_found"

    - lemma: "مُسَانِد"
      evidence_status: "no_material_found"

    - lemma: "رَدِيف"
      confirm:
        - text: "«الرَّدِيف: الرَّاكِبُ خَلْفَ الرَّاكِب»"
          source: "المعجم الوسيط"
        - text: "«الرَّديف: الراكبُ خلف الراكب وهو الزميل»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: >
            «(رَدَفَ) الرَّاءُ وَالدَّالُ وَالْفَاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى اتِّبَاعِ الشَّيْءِ.
            فَالتَّرَادُفُ: التَّتَابُعُ. وَالرَّدِيفُ: الَّذِي يُرَادِفُكَ... وَأَرْدَافُ الْمُلُوكِ فِي الْجَاهِلِيَّةِ:
            الَّذِينَ كَانُوا يَخْلُفُونَ الْمُلُوكَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            يثبت ابن فارس أن دلالة الجذر ردف هي التتابع والاتباع، وأن الرديف هو من يتبع ويخلف؛
            هذا يدعم استخدامه مجازاً للدور الثاني/الخلَف في الثنائي، لكن لا يربطه بالسياق الكوميدي.

    - lemma: "أُضْحُوكَة"
      confirm:
        - text: >
            «(1) الأُضحوكة: ممثل في مسرحية هزلية يتخذ منه الممثل الرئيسي موضوعاً لسخريته
            (2) الأداة؛ الصَّنيعة: من يعمل لمصلحة شخص آخر، وبخاصة بطريقة مُتَذلِّلة أو سِرّية»"
          source: "المورد الحديث (2008) — ترجمة: stooge"
        - text: "«الأُضْحُوكَةُ: كلُّ ما يُضْحَكُ منه»"
          source: "المعجم الوسيط"
        - text: "«الأُضْحُوكَةُ: كلُّ ما يُضْحَكُ منه, أو به. أصْبَحَ فلانٌ أُضْحوكَةَ النَّاسِ»"
          source: "المعجم الكبير"
      expands:
        - text: >
            «وَيُقَالُ فِي بَابِ الضَّحِكِ: الْأُضْحُوكَةُ مَا يُضْحِكُ مِنْهُ. وَرَجْلٌ ضِحْكَةٌ: يُضْحَكُ مِنْهُ.
            وَضُحَكَةٌ: يُكْثِرُ الضَّحِكَ»"
          source: "مقاييس اللغة لابن فارس — مادة ضحك"
          addition: >
            يُفرِّق ابن فارس بين الأُضحوكة (ما يُضحك منه) وضِحْكَة (من يُضحك منه)؛ هذا التفريق
            يُثبت أن الأُضحوكة ليست وصفاً شخصياً دائماً بل يمكن أن تصف الدور الوظيفي.

    - lemma: "ظَهِير"
      confirm:
        - text: "«الظَّهِيرُ: المُعين [للواحد والجمع]»"
          source: "المعجم الوسيط"
      expands:
        - text: >
            «وَالظَّهِيرُ: الْمُعِينُ، كَأَنَّهُ أَسْنَدَ ظَهْرَهُ إِلَى ظَهْرِكَ»"
          source: "مقاييس اللغة لابن فارس — مادة ظهر"
          addition: >
            يؤكد ابن فارس دلالة الظهير المعين الداعم. الصورة المجازية (الظهر إلى الظهر) تُوحي
            بالتكافؤ لا بالتبعية الكوميدية، مما يُضعف انطباقه على دور الأُضحوكة/السنيد.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "سَنِيد"
      decision: confirmed
      decision_reason: >
        على الرغم من أن المعاجم الكبرى (الوسيط، الكبير) تُثبت 'الدعي' معنىً أصيلاً لسنيد، فإن موسوعة
        السلطان قابوس تُثبت اشتقاقه من (س ن د) بمعنى مبالغة في المساندة (سَنَّاد)، كما أن المصطلح راسخٌ
        في الاستخدام المسرحي العربي المعاصر بهذا التخصيص الدلالي، وقد أثبتته القواميس الفنية والدراما
        العربية. يُثبَّت مع تصحيح التشكيل وملاحظة ازدواجية الدلالة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        سَنِيد يُركِّز على البُعد الوظيفي الداعم: هو الشريك الثانوي الذي يُسانِد الكوميديَّ ويُعدُّ دعامتَه
        الفنية — المصطلح ذو جذر سندي يوحي بالإسناد والمساندة قبل الإيحاء بالسخرية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَنِيد"

    - lemma: "ممثل مساعد للكوميدي"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تفشل اختبار التثبيت المعجمي: يمكن إبدال 'مساعد' بـ'معاون' أو 'مرافق' وتبقى
        وصفاً صحيحاً، مما يُثبت أنها ليست وحدةً معجمية مسكوكة. لا سند معجمي لها. تُحذف من المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُسَانِد"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر (س ن د) مناسب دلالياً لكن المصطلح عام جداً ولا يحمل الدلالة الكوميدية المسرحية المحددة؛
        يصلح وصفاً لأي داعم أو مساند في أي مجال. لا توجد أدلة معجمية تربطه بالسياق المسرحي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "رَدِيف"
      source: stage1
      decision: removed
      decision_reason: >
        على الرغم من جمال المجاز (الراكب خلف الراكب = الثاني في الترتيب)، فإن رَدِيف لا يحمل الدلالة
        الكوميدية الخاصة بكون الشخص موضعاً للسخرية. دلالته تميل إلى التكافؤ والمتابعة لا إلى التبعية
        الكوميدية. لا توجد شواهد معجمية تربطه بالمسرح الهزلي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "أُضْحُوكَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        أقوى المرشحات توثيقاً: المورد الحديث يُعرِّفها مباشرةً كترجمة لـ stooge بمعنى 'ممثل في مسرحية
        هزلية يتخذ منه الممثل الرئيسي موضوعاً لسخريته'. المعجم الوسيط والكبير يثبتان وجودها اللغوي، وابن
        فارس يذكرها في مقاييس اللغة. الوزن أُفْعُولَة دال على ما يُتخذ لغرض محدد — وهو ما يصف الدور
        بدقة. تُضاف إلى المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أُضحُوكَة يُركِّز على البُعد التلقّي: هو الشخص الذي يُجعَل مادةً للضحك والسخرية من قِبَل الكوميدي
        الرئيسي — المصطلح يصف الدور من منظور الجمهور (ما يُضحك منه) أكثر من منظور الوظيفة الداعمة.
      actions:
        - command: create_entry
          params:
            lemma: "أُضْحُوكَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10680322-n"


