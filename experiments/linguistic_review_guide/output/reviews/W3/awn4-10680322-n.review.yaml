      reason: >
        التعريف دائري: يستخدم 'السنيد' داخل تعريف المجموعة التي اللمة 'سنيد' عضوٌ فيها.
        علاوةً على ذلك، يقتصر التعريف على الوظيفة العامة دون أن يُحدِّد الطابع الكوميدي (كون الممثل
        موضعاً للسخرية لا مجرد مساعد). يُقترح تعريف يصف الجنس القريب (مُمثِّل هزلي) والفصل النوعي
        (دوره جعل نفسه أُضحوكةً للكوميدي الرئيسي).
