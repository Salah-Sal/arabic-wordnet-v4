# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # ── أ. المرشحات العمياء (قبل الاطلاع على اللمّات الموجودة) ──
  # المجموعة تصف شخصاً بعينه: "معماري نمساوي ورائد في العمارة الحديثة (1841-1918)"
  # هذا اسم علم لشخصية تاريخية غربية، فالأسلوب الوحيد المتاح هو التعريب.
  # انطلاقاً من الدلالات التاريخية (معماري نمساوي، 1841-1918) يمكن التعرف على
  # أوتو فاغنر، ومن ثَمَّ توليد أشكال تعريب مختلفة.
  blind_candidates:
    - lemma: "أُوتُو فَاغْنَر"
      generation_method: taarib
      justification: "التعريب الأكثر شيوعاً للاسم الكامل الألماني Otto Wagner، يُثبَّت بصيغة الاسم المركب المعرَّب حيث تُعرَّب الفاء من الحرف الألماني 'W' في التقليد العربي المشرقي."

    - lemma: "فَاغْنَر"
      generation_method: taarib
      justification: "الاسم الأخير وحده كما يُستخدم في السياقات الأكاديمية العربية عند الإحالة المتكررة، وهو التعريب المعتاد للقب Wagner في المصادر العربية."

    - lemma: "أُوتُو وَاغْنَر"
      generation_method: taarib
      justification: "شكل تعريبي بديل يُؤثر الواو على الفاء في نقل الحرف الألماني 'W'، مستخدَم في بعض المراجع الطبية والعلمية العربية (كما في مصطلحات 'بُقَع واغنر')."

    - lemma: "وَاغْنَر"
      generation_method: taarib
      justification: "الاسم الأخير بالصيغة البديلة، يُشابه الأشكال المثبَّتة في المعجم الطبي الموحد كـ'بقع واغنر' و'داء واغنر'، وهو نمط تعريبي موثَّق."

  # ── ب. التقييم الأولي (بعد الاطلاع على الملف الكامل) ──
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('أوتو فاغنر' و'فاغنر') خاليتان من التشكيل الكامل — يجب تصحيحه."
      - "لمّة 'فاغنر' وحدها مبهمة في العربية: اللقب 'فاغنر' يُقترن في الوعي الثقافي العربي أكثر بالموسيقار ريتشارد فاغنر، مما قد يُوقع القارئ في اشتباه."
      - "التعريف العربي الحالي مقتضب ومنقول عن الإنجليزية — يفتقر إلى تحديد أعمال الشخصية ومدرستها المعمارية."
      - "غياب أي ذكر لأبرز إسهامات أوتو فاغنر (مدرسة فيينا الانفصالية، محطات المترو، مبنى البريد)."
    observations: >
      هذه المجموعة تُمثّل اسمَ علمٍ لشخصية تاريخية أوروبية (المعماري النمساوي أوتو فاغنر 1841-1918).
      لمّاتها تعريبٌ محض لأجزاء الاسم الأصلي. لا توجد كلمة عربية مشتقة أو مجازية تُعبّر عن
      هذا الاسم العلم، وهذا طبيعي في أسماء الأعلام الأجنبية. تبرز مشكلتان رئيستان: أولاهما
      غياب التشكيل، وثانيتهما ضعف التمييز الدلالي لـ'فاغنر' وحدها دون سياق يُحيل صراحةً
      إلى المعماري دون الموسيقار. الأسلوب الأنسب هو الإبقاء على الشكلين مع التشكيل الكامل،
      وتحسين التعريف ليُبرز الهوية المعمارية تمييزاً واضحاً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفَّذة:
# [1] مطابقة دفعية: فاغنر/الفاغنر + واغنر/الواغنر + اوتو فاغنر + اوتو واغنر
#     → لا نتائج للمعماري أوتو فاغنر
# [2] الجسر الإنجليزي: "Wagner" OR "Otto Wagner" OR "Otto Wagner architect"
#     → ٨ مداخل طبية ونسيجية لـ"فاغنر" تشير إلى أشخاص مختلفين (ليس المعماري)
# [3] FTS عربي: "فاغنر" OR "واغنر" OR "اوتو" OR "معماري نمساوي"
#     → "أوتو" في سياق دورة أوتو الحرارية فقط — لا صلة بالمعماري
stage2_evidence:
  per_lemma:
    - lemma: "أُوتُو فَاغْنَر"
      evidence_status: "no_material_found"

    - lemma: "فَاغْنَر"
      contradicts:
        - text: "«جُسَيماتُ فاغنر (جُسَيماتٌ لَمْسِيَّة) — Wagner's corpuscles (corpuscula tactus)»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "يشير إلى واغنر الطبيب (Rudolph Wagner 1805-1864) لا إلى المعماري أوتو فاغنر، مما يُثبت تشعّب دلالة اللقب وحده."
        - text: "«داءُ فاغْنَر (الدُّخَينَةُ الغَرَوانِيَّة) — Wagner's disease (colloid milium)»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "يشير إلى Moritz Wagner الطبيب — لقب 'فاغنر' وحده متعدد الإحالة في المراجع العربية."
        - text: "«خَطُّ فاغنر — Wagner's line»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "مصطلح طبي لا علاقة له بالمعماري أوتو فاغنر."

    - lemma: "أُوتُو وَاغْنَر"
      contradicts:
        - text: "«بُقَعُ واغنر (نُوَيَّةُ البَيْضَة) — Wagner's spot»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الشكل 'واغنر' مستخدَم طبياً للإشارة إلى أشخاص يحملون اسم Wagner في الطب، وليس إلى المعماري."

    - lemma: "وَاغْنَر"
      contradicts:
        - text: "«بُقَعُ واغنر (نُوَيَّةُ البَيْضَة) — Wagner's spot»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الشكل 'واغنر' مثبَّت في المعجم الطبي لأشخاص آخرين — إدخاله في سياق المعماري يُضاعف الالتباس."


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة ١: أوتو فاغنر (موجودة) ──
    - lemma: "أوتو فاغنر"
      decision: confirmed
      decision_reason: >
        هذا هو الاسم الكامل للمعماري أوتو فاغنر المعرَّب، وهو اللمّة الأساسية
        للمجموعة ولا بديل عنها. تحتاج إلى تشكيل كامل وضبط صحيح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      loan_check:
        type: taarib
        verdict: "تعريب مقبول لاسم علم أعجمي — يقبل لام التعريف والنسبة والجمع السالم بصيغة 'الفاغنريّون'."
      morphological_fit: "اسم علم مركب مُعرَّب — لا ينطبق عليه ميزان صرفي عربي."
      nuance_differentiation: "الاسم الكامل — يُستخدم في الإشارة الأولى وفي السياقات الرسمية والعلمية والببليوغرافية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُوتُو فَاغْنَر"

    # ── اللمّة ٢: فاغنر (موجودة) ──
    - lemma: "فاغنر"
      decision: confirmed
      decision_reason: >
        اللقب وحده مستخدَم في السياقات الأكاديمية عند تكرار الإشارة. رغم أن
        'فاغنر' وحدها قد توحي بالموسيقار ريتشارد فاغنر، إلا أن السياق اللغوي
        لهذه المجموعة تحديداً يُحدِّد الإحالة. تُبقى مع تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      loan_check:
        type: taarib
        verdict: "تعريب مقبول للقب الألماني Wagner."
      morphological_fit: "اسم علم مُعرَّب مفرد."
      nuance_differentiation: "اللقب الأسري وحده — يُستخدم في الإحالات المتكررة داخل النص بعد ذكر الاسم الكامل."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَاغْنَر"

    # ── المرشح ١ من المرحلة ١: أُوتُو وَاغْنَر ──
    - lemma: "أُوتُو وَاغْنَر"
      source: stage1
      decision: removed
      decision_reason: >
        الشكل 'واغنر' مثبَّت في المعجم الطبي الموحد للإشارة إلى أطباء يحملون
        اسم Wagner، مما يُضاعف الاشتباه إذا أُضيف لهذه المجموعة. يفضَّل الإبقاء
        على الصيغة الأكثر شيوعاً في السياق المعماري وهي 'فاغنر' بالفاء.
      evidence_assessment:
        case: contradicts_only

    # ── المرشح ٢ من المرحلة ١: وَاغْنَر ──
    - lemma: "وَاغْنَر"
      source: stage1
      decision: removed
      decision_reason: >
        الشكل 'واغنر' وحده محمَّل بإحالات طبية إلى أشخاص مختلفين في المعجم
        الطبي الموحد، ولا يضيف تمييزاً على 'فاغنر' الموجود بل يُضاف إلى الاشتباه.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "معماري نمساوي ورائد في العمارة الحديثة (1841-1918)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقتضب وهو ترجمة شبه حرفية للتعريف الإنجليزي. لا يذكر
        أبرز إسهامات الشخصية، ولا مدرستها المعمارية، ولا أعمالها البارزة التي
        تُميّزها عن غيرها من المهندسين المعماريين النمساويين في الحقبة ذاتها.
    authored:
      - type: encyclopedic
        text: >
          أُوتُو فَاغْنَر (1841-1918): مهندس معماري نمساوي يُعدّ من رواد حركة
          العمارة الحديثة، أرسى أسلوباً وظيفياً يُقدِّم الغرضَ على الزخرفة
          التاريخية، وأسهم في تأسيس الحركة الانفصالية الفيينية (Secession)،
          ومن أبرز أعماله محطات مترو فيينا ومبنى صندوق البريد الإمبراطوري
          الذي يُعدّ باكورة العمارة الوظيفية الحديثة.
