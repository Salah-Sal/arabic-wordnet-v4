      decision_reason: "السرمدية مفهوم فلسفي مجرد يدلّ على ما لا أول له ولا آخر خارج مقولة الزمان، وليس على الحياة الأبدية تحديداً. الفرق بينه وبين المجموعة أنّ المجموعة نوع من الحياة لا صفة زمانية مجردة"
      evidence_assessment:
        case: mixed

    - lemma: "أَبَدِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الأبدية مصدر صناعي مجرد يدلّ على الديمومة المطلقة، وهو أقرب إلى مفهوم «eternity» المجرد لا «eternal life». المجموعة الترادفية تخصّ نوعاً من الحياة لا مفهوم الدوام ذاته"
      evidence_assessment:
        case: mixed

    - lemma: "حَيَاة خَالِدَة"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد شواهد معجمية على هذا التركيب بوصفه وحدة ثابتة. «خالدة» اسم فاعل يصلح وصفاً حراً لا مصطلحاً مسكوكاً، ويمكن إبداله بـ «باقية» أو «دائمة» — فشل اختبار السكّ"
      evidence_assessment:
