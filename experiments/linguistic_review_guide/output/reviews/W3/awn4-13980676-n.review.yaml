# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13980676-n
# eternal life / حياة بلا بداية أو نهاية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «حياة بلا بداية أو نهاية» يناسب مفهوم السَّرْمَدِيَّة (ما لا أول له ولا آخر) أكثر من الأَبَدِيَّة (ما لا نهاية له فقط)، لكن الاستعمال الشائع يسوّغ اللفظ"
      - "اللمّتان الموجودتان بلا تشكيل — يجب إضافته"
    observations: "المجموعة تعبّر عن مفهوم ديني-فلسفي راسخ في الثقافة العربية الإسلامية. «الخلود» مفردة جذرية مشتقة من خ-ل-د تدلّ على الثبات والملازمة والبقاء، وهي الأكثر شيوعاً في هذا السياق. «حياة أبدية» تركيب وصفي يصف الحياة بالأبدية صراحةً. الرابط الفوقي «حياة» مناسب تماماً."
  blind_candidates:
    - lemma: "خُلُود"
      generation_method: ishtiqaq
      justification: "مصدر «خَلَدَ» على وزن فُعُول، يدلّ على البقاء والدوام. من أشهر الألفاظ الدالة على الحياة الدائمة في القرآن والحديث: ﴿ذلك يوم الخلود﴾"
    - lemma: "سَرْمَدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «سَرْمَد» (الدائم الذي لا ينقطع)، يدلّ على ما لا أول له ولا آخر — يطابق التعريف تماماً"
    - lemma: "أَبَدِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «الأبد» (الدهر)، يدلّ على الديمومة التي لا تنقطع. مسجّلة في الوسيط والكبير"
    - lemma: "حَيَاة خَالِدَة"
      generation_method: tarkib
      justification: "تركيب وصفي من «حياة» + اسم الفاعل «خالدة» بمعنى باقية دائمة، قريب دلالياً من «حياة أبدية»"


stage2_evidence:
  per_lemma:
    - lemma: "خُلُود"
      confirm:
        - text: "«الخلود: طول الإقامة بالقرار. وقال الراغب: تبرؤ الشيء من أعراض الفساد وبقاؤه على الحالة التي هو عليها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«يومُ الخُلُودِ: يومُ البقاءِ الدَّائِمِ»"
          source: "المعجم الكبير"
        - text: "«خُلُود: من (خ ل د) البقاء والدوام، ودار الخلود: الجنة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(الخلود) دَار الخلود: الجنة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«وكلما يتباطأ عنه التغير والفساد تصفه العرب بالخلود كقولهم للأثافي خوالد لطول مكثها لا لدوام بقائها، وأصل المخلد الذي يبقى مدة طويلة، ثم استعير للمبقى دائماً»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الخلود في الأصل قد يدلّ على طول المكث لا الدوام المطلق، لكنّه استُعير للبقاء الدائم"

    - lemma: "حَيَاة أَبَدِيَّة"
      confirm:
        - text: "«الأبدية: مصدر صناعي من الأبد»"
          source: "المعجم الوسيط"
        - text: "«الأَبَدِيَّة: الدَّيمومة التي لا تنقطع»"
          source: "المعجم الكبير"
        - text: "«الأبدي: ما لا يكون منعدماً»"
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: "«الأبد: استمرار الوجود في أزمنة مقدرة غير متناهية في جانب المستقبل، كما أن الأزل استمرار الوجود في أزمنة مقدرة غير متناهية في جانب الماضي»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "الأبد يختص بجانب المستقبل فقط، بينما التعريف يشمل نفي البداية والنهاية معاً"

    - lemma: "سَرْمَدِيَّة"
      confirm:
        - text: "«السرمدي: ما لا أول له ولا آخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(في الفلسفة): ما لا أول له ولا آخر؛ فهو خارج عن مقولة الزمان, وموجود بلا بدء ولا نهاية»"
          source: "المعجم الكبير"
        - text: "«السَّرْمَدُ: الدائم الذي لا ينقطع»"
          source: "المعجم الوسيط"
      expands:
        - text: "«السَّرْمَدُ: دوام الزمان من ليل أو نهار. وليل سرمد: طويل»"
          source: "لسان العرب لابن منظور"
          addition: "السرمد يُستعمل أيضاً بمعنى الطويل لا الدائم المطلق"

    - lemma: "أَبَدِيَّة"
      confirm:
        - text: "«الأبدية: مصدر صناعي من الأبد»"
          source: "المعجم الوسيط"
        - text: "«الأَبَدِيَّة: الدَّيمومة التي لا تنقطع»"
          source: "المعجم الكبير"
      expands:
        - text: "«الأبد: الدهر، والجمع آباد وأبود. والأبد أيضاً: الدائم. والتأبيد: التخليد»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          addition: "التأبيد والتخليد مترادفان عند الجوهري"

    - lemma: "حَيَاة خَالِدَة"
      evidence_status: "no_material_found"


