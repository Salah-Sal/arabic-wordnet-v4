      decision_reason: "مصدر راسخ في الاستعمال القرآني والحديثي، دلالته على البقاء الدائم مؤكّدة في جميع المعاجم الكلاسيكية والحديثة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصدر مجرد يدلّ على مطلق البقاء والدوام دون تقييد بالحياة، أعمّ من «حياة أبدية» ويُستعمل في سياقات دينية وأدبية أوسع"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُلُود"

    - lemma: "سَرْمَدِيَّة"
      source: stage1
