          شخصٌ يُلازِم طرفَ الحفلةِ أو التجمُّعِ الاجتماعيِّ دون مشاركةٍ في فعالياته؛
          يكتفي بمشاهدة الآخرين خجلاً أو إغفالاً من الحضور إيّاه
