          maqayis_quote: >
            «الجِيمُ وَاللَّامُ وَالسِّينُ كَلِمَةٌ وَاحِدَةٌ وَأَصْلٌ وَاحِدٌ، وَهُوَ
            الِارْتِفَاعُ فِي الشَّيْءِ، يُقَالُ جَلَسَ الرَّجُلُ جُلُوسًا»
        - word: "الحائط"
          root: "حوط"
          maqayis_quote: >
            «الحَاءُ وَالْوَاوُ وَالطَّاءُ كَلِمَةٌ وَاحِدَةٌ، وَهُوَ الشَّيْءُ يُطِيفُ
            بِالشَّيْءِ. فَالْحَوْطُ مِنْ حَاطَهُ حَوْطًا. وَحَوَّطْتُ حَائِطًا»

    - lemma: "مُنْفَرِد"
      entry_id: "{auto}"
      root: "فرد"
      maqayis_quote: >
        «الفَاءُ وَالرَّاءُ وَالدَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى وُحْدَةٍ. مِنْ ذَلِكَ
        الفَرْدُ وَهُوَ الوَتْرُ. وَالفَارِدُ وَالفَرْدُ: الثَّوْرُ المُنْفَرِدُ. وَظَبْيَةٌ
        فَارِدٌ: انْقَطَعَتْ عَنِ القَطِيعِ»

