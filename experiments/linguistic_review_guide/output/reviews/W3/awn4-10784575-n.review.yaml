# wallflower — شخص يبقى على الهامش في المناسبات الاجتماعية
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «جليس الحائط» خالية من التشكيل"
      - "كلمة «جليس» تعني في المعاجم المُصاحِبَ الكثيرَ الجلوس مع الآخرين، وهذا يتعارض مع معنى الانفراد والابتعاد عن الآخرين الذي يصفه التعريف"
      - "المجموعة تحتوي على لمّة واحدة فقط — وهو ضعف في التغطية المعجمية"
      - "التعريف الحالي يستخدم «هامش» وهو مصطلح حديث النشأة، وليس من أصل عربي أصيل"
      - "المفهوم مرتبط بثقافة حفلات الرقص الغربية، مما يستدعي تعريفاً أوسع من الرقص فقط"
    observations: >
      المجموعة تصف نمطاً اجتماعياً محدداً: شخص حاضر في التجمع الاجتماعي لكنه لا يشارك فيه،
      يلتصق بأطرافه خجلاً أو إغفالاً من الحضور. يُسمى في الإنجليزية wallflower تشبيهاً له
      بزهرة الخيري التي تنمو على الجدران ولا تُقطف. المُفردة الموجودة «جليس الحائط» مركَّب
      إضافي يصوِّر الصورة البصرية (الجلوس بجانب الحائط)، غير أن «الجليس» في الأصل يعني
      المصاحب المُجالِس، مما ينقل دلالةً تناقضية. الأجدر البحث عن مصطلح يُعبِّر عن الانفراد
      والتقوقع دون إيحاء بالمصاحبة.

  blind_candidates:
    - lemma: "جَالِسُ الجُدْرَانِ"
      generation_method: tarkib
      justification: >
        مركَّب إضافي يوازي الصورة التي يرسمها المقابل الإنجليزي wallflower: شخص يلتصق بالجدران
        ولا يبارحها. «جالس» اسم فاعل من جَلَسَ، و«الجدران» جمع جدار. أقوى دلالةً من «جليس الحائط»
        لأن الجمع «الجدران» يُعمِّق صورة التكرار والاعتياد، ولأن «جالس» لا تتضمن معنى المصاحبة.
    - lemma: "مُنْزَوٍ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «انزوى» (الفعل من الباب السابع من زَوَى-يَزوِي)، وزنه مُنْفَعِل. الجذر
        زوى يدل على الانضمام والتجمع إلى الزاوية، ومنه «زاوية البيت لاجتماع الحائطين». مُنْزَوٍ
        يعني من آثر الركن والطرف عن المركز، وهو ما يتطابق مع بقاء الشخص في هامش التجمع.
    - lemma: "هَامِشِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة اشتقاقية من «هامش» (المساحة خارج المتن)، على وزن فَاعِلِيّ. يصف من ينتمي
        إلى هامش الفعل الاجتماعي لا متنه. وزن النسبة هنا يحوِّل الاسم المكاني إلى وصف
        إنساني، وهو أسلوب مستعمَل في العربية الحديثة.
    - lemma: "خَجُولُ المَحَافِلِ"
      generation_method: tarkib
      justification: >
        مركَّب إضافي من «خجول» (صيغة مبالغة من خَجِلَ على وزن فَعُول للقابلية والاستمرار)
        و«المحافل» (جمع محفل: التجمع الرسمي أو الاجتماعي). يُخصِّص الخجل بسياق التجمعات
        الاجتماعية ولا يُطلِقه تطليقاً مطلقاً، مما يقيّد الدلالة للمعنى المطلوب.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  # ── ملاحظة منهجية ──
  # الاستعلامات المُنجَزة:
  # ١. مطابقة دفعية: جليس الحائط + المكوّنات + جميع المرشحات
  # ٢. الجسر الإنجليزي: wallflower → أسفر عن مدخلَي المورد الحديث
  # ٣. FTS عربي: هامش، انزوى، منفرد، خجول
  # ٤. مقاييس اللغة: جلس، حوط، زوي، فرد، همش، نزو
  # ٥. مطابقة دفعية للتحقق: منفرد، المنفرد، منزوٍ، انزوى

  per_lemma:

    - lemma: "جَلِيسُ الحَائِطِ"
      expands:
        - text: "«الجليس: المجالِسُ الكثير الجلوس»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: >
            يُثبت أن «الجليس» بُنيَ على وزن فَعِيل للدلالة على كثرة الجلوس، وهو أساس
            تسمية الشخص الراسي في موضعه بجانب الحائط «جليساً» — أي المُلازِم لمكانه.
        - text: "«مِن الناس: المُجالِسُ الكثِيرُ الجُلوس، المُجالِسُ لقبٌ على عليّ بن الجهم
            الشاعر العباسيّ، قيل لمجالسته الخليفةَ المتوكِّلَ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            يُوضِّح أن «الجليس» في الأصل لقبٌ لمن يُجالس الكبار، وهي دلالة مصاحبة
            وقُرب لا عزلة — مما يكشف التوتر الدلالي في المركَّب «جليس الحائط».
        - text: "«الحائط: الجدار، البستان»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: >
            يُثبت أن الحائط = الجدار، وهو الركن البصري المحوري في صورة الشخص المُلتصق بالجدار.
      contradicts:
        - text: "«الجليس: المجالِسُ، الكثير الجلوس»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
          conflict: >
            دلالة «الجليس» الأصلية هي المُصاحَبة والمُجالَسة مع الآخرين، لا الانفراد عنهم.
            فالمركَّب «جليس الحائط» يُوحي في ظاهره بأن الحائطَ هو رفيق الشخص لا الناس —
            وهو ما يُفيد العزلة بطريق الكناية، لكنه قد يُلبِّس على غير المتأمل.

    - lemma: "المُنْفَرِد"
      confirm:
        - text: "«(٢) المُنْفَرِد: شخص [رجلاً كان أو امرأة] يَقنَع بمشاهدة الرقص إمّا حياءً
            وإمّا لأن أحداً لم يَدعُه إلى الرقص معه.»"
          source: "المورد الحديث، منير البعلبكي (٢٠٠٨)"
      expands:
        - text: "«المنفرد: اللفظ الموضوع لمعنى واحد سواء كان علماً أو غيره، ويقابله المشترك.
            وعند الفقهاء هو الشخص الذي يصلّي الصلاة بغير جماعة.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: >
            يُثبت أن «المنفرد» راسخ في المعجمية العربية بمعنى من يكون وحده بعيداً عن
            الجماعة — الدلالة الفقهية (يصلي بلا جماعة) وثيقة الصلة بالعزلة الاجتماعية.
        - text: "«المنفرد: من يصلِّي وحده.»"
          source: "التعريفات الفقهية للبركتي"
          addition: "يُرسِّخ معنى الانعزال والبُعد عن الجماعة."

    - lemma: "جَالِسُ الجُدْرَانِ"
      evidence_status: "no_material_found"

    - lemma: "مُنْزَوٍ"
      confirm:
        - text: "«انزوى: صار في زاوية البيت ونحوه، وانقبض. والقومُ بعضهم إلى بعض: تدانوا
            وتضامُّوا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
      expands:
        - text: "«انزوى فلانٌ: زَوَّى. ويقال: انزوى في زاوية الشيء: تنحَّى، تجمَّعَ وتقبَّضَ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            يُثبت أن «انزوى» يحمل معنى التنحي إلى الزاوية والانقباض — وهو وصف دقيق
            للشخص الذي يتراجع إلى طرف القاعة.
        - text: "«زَوِيَ: الزاءُ والواوُ والياءُ أصلٌ يدل على انضمامٍ وتجمُّع. يقال زويتُ
            الشيءَ: جمعته [...] وزاويةُ البيت لاجتماع الحائطَين»"
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر زوى يُفيد الانضمام إلى الزاوية (حيث يلتقي الحائطان)، وهو تأصيل دقيق
            لصورة الشخص المُنزوي في طرف القاعة.

    - lemma: "هَامِشِيٌّ"
      contradicts:
        - text: "«هامشي: كميّة إضافية أو إضافة من شيء. إذا كان أحد يشرب ستة مشروبات غازية
            في يوم واحد، فإن الصودا الهامشي يكون الصودا السادس.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"
          conflict: "المصطلح مُختصٌّ بالاستعمال التقني/الاقتصادي ولا يُستعمَل للأشخاص."
        - text: "«هَمَشَ: الهاء والميم والشين أصل يدل على سرعة عمل أو كلام. الهَمِشُ: السريع
            العمل بأصابعه. [...] والهَمش: الصوت والجلبة.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            الجذر المعجمي لـ«هامش» في مقاييس اللغة لا علاقة له بالحواشي أو الهوامش بل
            يُفيد السرعة والجلبة — مما يكشف أن «هامش» بمعنى margin مصطلحٌ عربي حديث
            ليس له تأصيل تراثي.

    - lemma: "خَجُولُ المَحَافِلِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "جَلِيسُ الحَائِطِ"
      decision: confirmed
      decision_reason: >
        على الرغم من التوتر الدلالي الكامن في كلمة «جليس» (إذ تُفيد المصاحبة)، إلا أن
        المركَّب «جليس الحائط» ككل قد استقر كمصطلح اصطلاحي يُعبِّر عن هذا المفهوم في
        العربية المعاصرة، وهو مُسجَّل في AWN4 ومُتداوَل. يجوز توجيهه على أن الحائطَ
        هو «الجليس» (المُرافق) — كناية عمّن لا يُرافقه أحدٌ سوى الجدار. تبقى الحاجة
        إلى تشكيل كامل وإضافة لمّة ثانية أقوى دلالةً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الصورة البصرية المكانية: الالتصاق بالحائط وعدم مغادرة الطرف. يحمل
        إيحاءً فكاهياً لطيفاً (الحائط كرفيق) يجعله أنسب للاستخدام الأسلوبي والعامي المثقَّف.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَلِيسُ الحَائِطِ"

    # ── مرشح من المرحلة الثانية (الجسر الإنجليزي) ──
    - lemma: "المُنْفَرِد"
      decision: confirmed
      decision_reason: >
        اكتُشف من خلال الجسر الإنجليزي في مرحلة جمع الأدلة: المورد الحديث (٢٠٠٨) يُعطي
        «المُنْفَرِد» صراحةً كترجمة للمعنى الاجتماعي لـ wallflower: «شخص يقنع بمشاهدة الرقص
        إما حياءً وإما لأن أحداً لم يدعه إلى الرقص معه.» الكلمة مشتقة اشتقاقاً قياسياً
        من الجذر فرد (على وزن اسم الفاعل من انفرد: مُنْفَرِد)، راسخة في المعجمية العربية،
        وتُفيد من اعتزل الجماعة أو لم يُقبِل عليه أحد. دلالتها أعمق وأكثر سلامةً من
        «جليس الحائط».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز على حالة الانفراد النفسي والاجتماعي: الشخص الذي يظل وحيداً في التجمع
        سواء لخجله أو لأن الآخرين لم يُبادِروه. أدق دلالةً من «جليس الحائط» وأوفى
        بالمعنى الكامل للمفهوم.
      actions:
        - command: create_entry
          params:
            lemma: "مُنْفَرِد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "جَالِسُ الجُدْرَانِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم تتأكد في أي مصدر معجمي. اختبار السكّ يُفشِلها: «قاطن الجدران»، «مُلازِم
        الجدران» تعمل وصفاً بالقدر ذاته — إذن ليست وحدة معجمية مسكوكة. كذلك تُعيد
        إنتاج المشكلة ذاتها الموجودة في «جليس الحائط» مع تعدد فائدة أقل.
      evidence_assessment:
        case: no_material

    - lemma: "مُنْزَوٍ"
      source: stage1
      decision: removed
      decision_reason: >
        على الرغم من تأصيله الجذري الدقيق (زوى = الانضمام إلى الزاوية) ومن كونه مُؤكَّداً
        في المعجم الوسيط، إلا أن «مُنْزَوٍ» أعمُّ من المفهوم المطلوب: يُطلَق على كل
        مُنطوٍ ومُنعزِل في أي سياق، ويتداخل مع المورد المباشر «انطوائي» الذي هو الوالد
        الدلالي لهذه المجموعة. إضافته تخلق تكراراً مع الطبقة الفوقية لا تمييزاً.
      evidence_assessment:
        case: mixed

    - lemma: "هَامِشِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم تُثبت أنه مصطلح تقني حصري (علم البيئة، الاقتصاد، الجيولوجيا) ولا يُستعمَل
        لوصف أشخاص في سياق اجتماعي. علاوة على ذلك، مقاييس اللغة لابن فارس يُثبت أن
        الجذر همش لا يُفيد «الهامش» بمعنى الحاشية، بل يُفيد السرعة والجلبة — مما يكشف
        أن «هامشي» مصطلح حديث لا تراثي.
      evidence_assessment:
        case: contradicts_only

    - lemma: "خَجُولُ المَحَافِلِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. اختبار السكّ يُخفِق: «خجول المجالس»، «خجول الحفلات» تُؤدي المعنى
        ذاته — ليست وحدة اصطلاحية ثابتة. كذلك هي عبارة وصفية حرة لا مصطلح مسكوك، وتنتقل
        الدلالة إلى وصف الخجل الاجتماعي عموماً لا الـ«wallflower» تحديداً.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
stage4_content:
  definition:
    current: "شخص يبقى على الهامش في المناسبات الاجتماعية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وظيفي لكنه يعاني من ثلاثة قصور: (١) يستخدم «هامش» وهو مصطلح حديث
        لا أصالة له في التراث اللغوي؛ (٢) «مناسبات اجتماعية» مصطلح فضفاض يشمل الجنازات
        والمؤتمرات والأعراس — بينما المقصود تحديداً التجمعات الترفيهية والحفلات؛ (٣) يُغفِل
        العنصر المحوري في دلالة المصطلح وهو الانفراد إما خجلاً وإما لأن أحداً لم يُقبِل
        على صاحبه.
