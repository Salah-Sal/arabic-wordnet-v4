# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة الموجودة (صاحب المزرعة) عامة جداً تشمل كل أصحاب المزارع بصرف النظر عن حجمها أو طابعها الاستعماري، وهي لا تُميّز plantation owner عن أي farm owner"
      - "اللمة مركّبة إضافية مفتقرة إلى التشكيل الكامل"
      - "المجموعة تفتقر إلى مصطلح عربي مفرد يعادل planter بأبعاده الاستعمارية والطبقية"
      - "اللمة الموجودة تتشارك جذر (زرع) مع لمّات الأب المعجمي (فلاح، مزارع)، مما يُضعف التمييز الدلالي بين المستويين"
    observations: >
      يُعبَّر عن مفهوم (صاحب المزرعة الاستعمارية الكبيرة) في العربية غالباً بالتركيب الإضافي
      أو العبارات الوصفية، وليس بمصطلح مفرد محدد. تقع المجموعة في فجوة معجمية جزئية:
      المفهوم معروف ثقافياً (ارتبط بالحقبة الاستعمارية وزراعة المحاصيل النقدية كالقطن
      والسكر والتبغ) لكنه يفتقر إلى مصطلح عربي خاص ومسكوك. المقابل الأقرب في التراث
      العربي هو صاحب الضيعة وإن كان الإقطاعي يحمل الأبعاد الطبقية ذاتها. اللمة الموجودة
      صحيحة وظيفياً لكنها دون الدقة المطلوبة.
  blind_candidates:
    - lemma: "غَارِسٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من الجذر غ-ر-س على وزن فاعل، والأصل يدل على إثبات الشجر في الأرض؛ يُناسب من يُرسّخ مزرعته ويُثبّتها، وهو الأقرب إلى planter بمعناه الاشتقاقي الإنجليزي (one who plants)"
    - lemma: "صَاحِبُ الضَّيْعَةِ"
      generation_method: tarkib
      justification: "تركيب إضافي من صاحب + الضيعة؛ الضيعة مصطلح فقهي عربي راسخ للأرض المغلة ذات الغلة، وتُطلق على المزرعة الكبيرة المنتجة، فيكون التركيب أدق في الدلالة على مالك الأرض الزراعية الضخمة"
    - lemma: "مُقْطِعٌ"
      generation_method: majaz
      justification: "اسم فاعل من أَقْطَعَ (أي منح إقطاعاً أرضياً)؛ في التراث الإسلامي المُقْطِع هو من يمنح أرضاً ويتولى شؤونها، ومن باب المجاز يمتد إلى من يمتلك مزرعة كبيرة ويُدير العمل فيها"
    - lemma: "إِقْطَاعِيٌّ"
      generation_method: ishtiqaq
      justification: "اسم منسوب إلى الإقطاع (نظام ملكية الأرض الكبيرة وتشغيل العمال فيها)؛ يُستعمل في العربية المعاصرة للدلالة على الملاك الكبار أصحاب الأراضي الواسعة الذين يُشغّلون العمال، وهو الأقرب دلالياً إلى plantation owner بأبعاده الطبقية والاستعمارية"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "صاحب المزرعة"
      confirm:
        - text: "«(1) «أ» فلّاح؛ مُزارع. «ب» صاحب مزرعة (2) المستعمِر: من يعمِّر أو يشارك في تعمير موطن تستقرّ فيه جماعة ما في منطقة جديدة (3) أَصِيص [تُزرع فيه الرياحين] (4) المِغْرَسة: آلة لغَرْس البذور»"
          source: "المورد الحديث (2008) — ترجمة planter"
      expands:
        - text: "«(1) زَرْع؛ زُروع (2) المستعمَرة: موطن يُعمَّر ويُستقَرّ فيه ببلد جديد أو منطقة جديدة (3) مزرعة»"
          source: "المورد الحديث (2008) — ترجمة plantation"
          addition: "المعجم يُرادف بين مزرعة والمستعمرة في سياق plantation، مما يؤكد الطابع الاستعماري للمفهوم"
        - text: "«مزرعة تجارية»"
          source: "مسرد الجغرافيا والتاريخ، ALECSO — ترجمة plantation"
          addition: "تُقيّد مزرعة بـ(تجارية) للتمييز عن الأرض الزراعية العامة، وهو ما يُعبّر عنه مفهوم plantation"

    - lemma: "غَارِسٌ"
      evidence_status: "no_material_found"

    - lemma: "صَاحِبُ الضَّيْعَةِ"
      expands:
        - text: "«الضَّيْعَة: الأرضُ ذاتُ الغَلَّةِ (عند أهل الحاضرة): مالُ الرَّجُلِ من النَّخْلِ والكَرْمِ والأرضِ. وقيل: المَزْرَعَةُ»"
          source: "المعجم الكبير"
          addition: "الضيعة مرادفة للمزرعة في أحد معانيها، مما يُسوّغ التركيب نظرياً"
        - text: "«الأرْضُ المغلَّة»"
          source: "المعجم الوسيط"
          addition: "الضيعة هي الأرض المنتجة ذات الغلة، مما يقترب من معنى plantation"
      contradicts:
        - text: "«فَأَمَّا تَسْمِيَتُهُمُ الْعَقَارَ ضَيْعَةً فَمَا أَحْسَبُهَا مِنَ اللُّغَةِ الْأَصِيلَةِ، وَأَظُنُّهُ مِنْ مُحْدَثِ الْكَلَامِ»"
          source: "مقاييس اللغة لابن فارس — مادة ضيع"
          conflict: "ابن فارس يعتبر استخدام ضيعة للأرض/العقار استخداماً محدثاً غير أصيل، مما يُضعف اعتماده في المصطلحية"

    - lemma: "مُقْطِعٌ"
      contradicts:
        - text: "«(المقطع) من كل شيء آخره حيث ينقطع وينتهي كمقاطع الرمال والأودية والمزارع ... والوحدة الصوتية اللغوية التي تتألف منها الكلمة»"
          source: "المعجم الوسيط"
          conflict: "المقطع في المعاجم يدل على الصوت الكلامي أو مكان الانقطاع، لا على مالك المزرعة"
        - text: "«المُقَطِّع: ما يقسم المادة إلى أجزاء صغار»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المقطّع يدل على آلة تقطيع، لا على صاحب أرض"

    - lemma: "إِقْطَاعِيٌّ"
      confirm:
        - text: "«المالك الذى يملك الأرض على نِظام الإقطاع»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الإقطاعي: الْمَالِك الَّذِي يملك الأَرْض على نظام الإقطاع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
      expands:
        - text: "«وَأَقْطَعْتُ الرَّجُلَ إِقْطَاعًا، كَأَنَّهُ طَائِفَةٌ قَدْ قُطِعَتْ مِنْ بَلَدٍ»"
          source: "مقاييس اللغة لابن فارس — مادة قطع"
          addition: "الإقطاع أصله منح قطعة أرض للاستثمار والإنتاج، وهو قريب دلالياً من مفهوم منح أرض المزرعة الكبيرة وإدارتها"


