      decision_reason: "اللمة مُثبتة في المعجم الوسيط بتعريف صريح (المالك الذي يملك الأرض على نظام الإقطاع)؛ وتُستعمل في الخطاب العربي المعاصر للدلالة على الملاك الكبار الذين يحوزون أراضي واسعة ويُشغّلون عليها العمال، وهو ما يُطابق ببُعده الطبقي مفهوم plantation owner. اسم المُدخل المعجمي بـ(ال) التعريف (الإقطاعي) والمقصود ربط المعنى بالمجموعة."
