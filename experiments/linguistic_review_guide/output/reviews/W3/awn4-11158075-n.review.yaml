# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11158075-n  |  ILI: i96004  |  POS: n
# Definition: معماري نمساوي (1870-1933) — Austrian architect (1870-1933)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تخصّ عَلَماً شخصياً أجنبياً، مما يجعل التوليد المصطلحي الاشتقاقي والمجازي غير ممكن؛ الطريقة الوحيدة المتاحة هي التعريب (النقل الصوتي)"
      - "اللمّتان الموجودتان (أدولف لوس، لوس) تفتقران إلى التشكيل الكامل"
      - "كلمة 'لوس' لها وجود في المعجمية العربية بمعنى 'التذوق والتطعم' (من الجذر ل-و-س)، مما يُولّد إيهاماً لفظياً محتملاً"
      - "التعريف الحالي 'معماري نمساوي (1870-1933)' مُختزَل جداً ويفتقر إلى المعلومات الموسوعية التي تُميّز هذه الشخصية"
    observations: >
      هذه المجموعة تمثّل عَلَماً شخصياً أجنبياً للمعماري النمساوي أدولف لوس (Adolf Loos،
      1870-1933)، أحد رواد الحداثة المعمارية الغربية واشتهر بمقولته الشهيرة 'الزينة جريمة'
      (Ornament and Crime, 1908). ومن الناحية اللغوية، لا يمكن اشتقاق اسم العَلَم من جذر
      عربي، فالتعريب هو الأسلوب الوحيد الممكن. والجدير بالملاحظة أن العربية تملك جذراً
      قائماً (ل-و-س) بمعنى التذوق والتطعم، وهو مغاير تماماً للاسم الأجنبي المعرَّب؛
      مما يستوجب التشكيل الكامل (لُوس) للتمييز. التوليد الأعمى من التعريف المقنَّع
      الذي لا يحتوي إلا على 'معماري نمساوي (1870-1933)' يقتضي محاولة أشكال نقل صوتي
      مختلفة لاسم يُستشَفّ من السياق التاريخي.
  blind_candidates:
    - lemma: "أَدُولف لُوس"
      generation_method: taarib
      justification: >
        النقل الصوتي المعياري للاسم الكامل «Adolf Loos» وفق التقاليد العربية في تعريب
        الأسماء الألمانية والنمساوية؛ «أَدُولف» نقل مباشر لـ Adolf، و«لُوس» نقل لـ Loos
        مع إبقاء الصوت الساكن الأخير بالسين وفق ما هو شائع في المطبوعات العربية
    - lemma: "أَدُولف لُوز"
      generation_method: taarib
      justification: >
        بديل صوتي مع تجهير الصوت الأخير (s → z) بناءً على أن الحرف الألماني الأخير
        في «Loos» قد يُنطق مجهوراً في بعض السياقات؛ درجت بعض المراجع العربية على
        هذا التجهير في نقل الأسماء الجرمانية
    - lemma: "آدُولف لُوس"
      generation_method: taarib
      justification: >
        صيغة بديلة تعتمد مد الألف (آ) في استهلال «Adolf»، وهو أسلوب مستخدم في
        نقل المقاطع المفتوحة الطويلة ذات الألف الممدودة في الأسماء الأوروبية
    - lemma: "لُوس المعمار"
      generation_method: tarkib
      justification: >
        تركيب إضافي يجمع اللقب (لُوس) بالمهنة (المعمار) للتمييز الصريح عن الجذر
        العربي المشترك؛ غير أن هذا التركيب يُفقد الاسمَ طابعَه كعَلَم صرف


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات منفَّذة:
# (١) مطابقة دقيقة دفعية: headword_norm IN ('ادولف لوس','لوس','اللوس','ادولف','الادولف')
# (٢) جسر إنجليزي: translation_en:"Loos" OR "Adolf Loos" OR "architect" OR "Austrian architect"
# (٣) بحث FTS عربي: "معماري" OR "نمساوي"
stage2_evidence:
  per_lemma:
    - lemma: "أدولف لوس"
      evidence_status: "no_material_found"

    - lemma: "لوس"
      contradicts:
        - text: >
            «اللَّوْسُ: تَتَبُّعُ الإِنسانِ الحَلاواتِ وغَيْرها ليأكُلَها. لاسَ، فهو
            لائِسٌ ولَؤُوسٌ ولَوَّاسٌ، والذَّوْقُ، وإدارَةُ الشيءِ في الفَمِ باللسان،
            وبالضم: الطَّعامُ. واللُّواسَةُ، بالضم: اللقمَةُ. وما ذُقْتُ لَؤُوساً ولا
            لَواساً: ذَواقاً.»
          source: "القاموس المحيط للفيروزآبادي"
          conflict: >
            كلمة «لوس» في المعاجم العربية جذرٌ مستقل بمعنى التذوق والتطعم، لا صلة
            له باسم المعماري النمساوي؛ يُوجب هذا الإيهامُ التشكيلَ الكاملَ (لُوس)
            للتمييز، أو اعتمادَ الاسم الكامل (أدولف لوس) أولاً
        - text: "«(اللوس) يُقَال مَا ذاق عِنْده لوسا ذواقا»"
          source: "المعجم الوسيط (مجمع اللغة العربية بالقاهرة، 1998)"
          conflict: >
            المعجم الوسيط يُوثّق «اللوس» بمعنى الذواق لا كاسم علم، مما يؤكد
            الإيهام عند الاستخدام المنفرد بلا تشكيل
        - text: >
            «(لَوَسَ) اللَّامُ وَالْوَاوُ وَالسِّينُ كَلِمَةٌ تَدُلُّ عَلَى شَيْءٍ
            مِنَ التَّطَعُّمِ. قَالُوا: اللَّوْسُ أَنْ يَتَتَبَّعَ الْإِنْسَانُ
            الْمَآكِلَ. يُقَالُ: لَاسَ يَلُوسُ لَوْسًا. وَيَقُولُونَ: اللُّوَاسَةُ:
            اللُّقْمَةُ. قَالَ ابْنُ دُرَيْدٍ: لُسْتُ الشَّيْءَ فِي فَمِي، إِذَا
            أَدَرْتَهُ بِلِسَانِكَ.»
          source: "مقاييس اللغة لابن فارس (ت. 1004م)"
          conflict: >
            ابن فارس يؤصّل الجذر (ل-و-س) بمعنى التطعم أصالةً من غير اشتراك؛
            فالتقاء الاسم الأجنبي المعرَّب مع هذا الجذر محضُ تصادف صوتي

    - lemma: "أَدُولف لُوز"
      evidence_status: "no_material_found"

    - lemma: "آدُولف لُوس"
      evidence_status: "no_material_found"

    - lemma: "لُوس المعمار"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "أدولف لوس"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للمعماري النمساوي بالنقل الصوتي المعتاد في المراجع العربية؛
        هو اللمّة الأساسية الأكثر دقةً وانعداماً للإيهام، ويُستخدم في الكتابات
        الأكاديمية والموسوعية. يحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الجامع للاسم الشخصي (أدولف) واللقب (لوس) معاً؛ يُستخدم في السياق
        الرسمي والأكاديمي وعند أول ذكر للشخص، وهو الأكثر تحديداً وتمييزاً دون أي لبس
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَدُولف لُوس"

    - lemma: "لوس"
      decision: confirmed
      decision_reason: >
        اللقب المنفرد مقبول كصيغة مختصرة متداولة في الكتابات المتخصصة بتاريخ
        العمارة حين يكون السياق مانعاً للإيهام. غير أن التشكيل الكامل (لُوس) واجب
        للتمييز من الجذر العربي «لوس» (التذوق)؛ فالضمة الوحيدة هي الفارق الكتابي
        الوحيد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب وحده يُستخدم في السياق التخصصي المتأخر (نقد العمارة، الدراسات
        الأكاديمية) حين يكون المقصود معروفاً من السياق؛ أقل رسمية من الاسم الكامل
        وأكثر اقتصاداً في اللغة المتخصصة
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُوس"

    - lemma: "أَدُولف لُوز"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة بالزاي (لُوز) غير موثقة في المراجع العربية المتعلقة بأدولف لوس؛
        التجهير (s→z) غير مسوَّغ إذ إن الحرف الأصلي في الألمانية ساكن لا مجهور
        في هذا الموضع، والنقل بالسين (لُوس) هو الشائع في المطبوعات العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "آدُولف لُوس"
      source: stage1
      decision: removed
      decision_reason: >
        المد (آ) في أول «أدولف» غير موثق؛ المقطع الأول «Ad-» مفتوح قصير لا
        يستوجب مداً، والصيغة الشائعة في المراجع العربية هي (أَدُولف) بالفتح
        القصير. لا حاجة لصيغة بديلة ما دامت (أَدُولف لُوس) مؤكَّدة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "لُوس المعمار"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب توصيفي غير ثابت معجمياً؛ لا يصلح لمّةً في شبكة دلالية لأنه
        عبارة وصفية لا اسم علم مستقل. اختبار السكّ يُثبت عدم ثباته: يمكن إبداله
        بـ«لُوس البنّاء» أو «لُوس المصمم» ويبقى وصفاً عاماً صالحاً، وهذا
        ينقضه كمصطلح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "معماري نمساوي (1870-1933)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُختزَل جداً؛ لا يعدو العبارةَ الوصفية العامة التي تُطابق
        عشرات المعماريين النمساويين. التعريف الموسوعي الكافي يستوجب: ذكر مكان الولادة
        والوفاة، وتحديد مكانته في تاريخ العمارة، والإشارة إلى إسهامه الفكري المميّز
        (نظرية «الزينة جريمة»، الوظيفية في العمارة). أسلوب المعجم الوسيط يقتضي
        تعريفاً مُرتَّباً لا مجرد تأريخ.
    authored:
      - type: encyclopedic
        text: >
          مهندسٌ معماريٌّ نمساويٌّ، وُلد في بِرْنو (Brno) عام 1870م، وتُوُفِّي في
          كالسْبَاد (Kalspad) عام 1933م. من رواد الحداثة في العمارة الغربية، اشتُهر
          بمقالته «الزينة جريمة» (1908م) التي رفضت فيها الزخرفةَ المعمارية وأرست
          مبادئ العمارة الوظيفية النقية؛ كان له أثرٌ بالغٌ في تشكيل الفكر المعماري
          في القرن العشرين وفي ما عُرف بـ«حركة الطراز الدولي».
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11158075-n"
          definition_index: 0
          text: >
            مهندسٌ معماريٌّ نمساويٌّ، وُلد في بِرْنو (Brno) عام 1870م، وتُوُفِّي في
            كالسْبَاد (Kalspad) عام 1933م. من رواد الحداثة في العمارة الغربية، اشتُهر
            بمقالته «الزينة جريمة» (1908م) التي رفضت فيها الزخرفةَ المعمارية وأرست
            مبادئ العمارة الوظيفية النقية؛ كان له أثرٌ بالغٌ في تشكيل الفكر المعماري
            في القرن العشرين وفي ما عُرف بـ«حركة الطراز الدولي».

