      sense_id: "{auto}"
      nuance: "الاسم الرسمي والأكثر شيوعاً للمعلم الجغرافي."
      mwe: true
    - lemma: "مَصَبُّ أُوب"
      sense_id: "{auto}"
      nuance: "يؤكد على الطبيعة الهيدرولوجية للمعلم كمكان التقاء النهر بالبحر."
      mwe: true

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
