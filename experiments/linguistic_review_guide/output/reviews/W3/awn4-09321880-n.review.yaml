        value: '{"roots":[{"word":"خليج","root":"خلج","maqayis":"«الخاء واللام والجيم أصل واحد...»"},{"word":"أوب","root":"أوب","maqayis":"«الهمزة والواو والباء أصل واحد...»"}]}'
