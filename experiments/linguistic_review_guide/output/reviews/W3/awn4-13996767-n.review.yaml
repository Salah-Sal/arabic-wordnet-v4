        text: "مَذْهَبٌ فِكْرِيٌّ يَقُومُ عَلَى إِنْكَارِ كُلِّ سُلْطَةٍ قَائِمَةٍ وَنَفْيِ أَيِّ أَسَاسٍ مَوْضُوعِيٍّ لِلْقِيَمِ وَالْمُعْتَقَدَاتِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
