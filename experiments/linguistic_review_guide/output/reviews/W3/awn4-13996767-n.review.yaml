# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13996767-n (nihilism)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «عدمية» تفتقر إلى التشكيل الكامل"
      - "المجموعة تضمّ لمّة واحدة فقط، وهو أمر غير كافٍ لشبكة دلالية غنية"
    observations: >
      المفهوم فلسفي-سياسي حديث (nihilism) ظهر أصلاً في السياق الأوروبي التاسع عشر.
      التعريف العربي «الإنكار الكامل لكل السلطات والمؤسسات القائمة» يُركّز على البُعد السياسي
      دون البُعد الفلسفي (نفي الوجود والقيم)، وهو يُطابق أحد معاني nihilism لا كلّها.
      اللمّة «عدمية» مشتقّة من الجذر ع-د-م بالمصدر الصناعي (-يَّة) وهي مسكوكة ومعتمدة
      في المعاجم المصطلحية العربية الحديثة. الجنس القريب هو «لا سلطوية / فوضى عارمة»
      (anarchism) وهو ملائم.
  blind_candidates:
    - lemma: "عَدَمِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «العَدَم» (ضدّ الوجود) على وزن فَعَلِيَّة، يدلّ على المذهب
        القائل بنفي كلّ سلطة وقيمة قائمة. الجذر ع-د-م أصيل ومعناه «فقدان الشيء وذهابه»
        فيناسب مفهوم الإنكار المطلق.
    - lemma: "نِهِلِسْتِيَّة"
      generation_method: taarib
      justification: >
        تعريب للفظ الأوروبي nihilism بإلحاق تاء النسبة والمصدر الصناعي.
        يقبل لام التعريف (النِّهِلِسْتِيَّة) والنسبة (نِهِلِسْتِيّ).
        ورد في المورد الحديث بصيغة «النِّهلِسْتية».
    - lemma: "إِنْكَارِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «الإنكار» على وزن إفعالِيَّة، يدلّ على النزعة القائمة
        على الإنكار المطلق للسلطات. لكنّ الإنكار أعمّ من العدمية الفلسفية.
    - lemma: "مَذْهَبُ الهَدْم"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مذهب» و«الهدم»، يصوّر العدمية بوصفها مذهباً يسعى
        لهدم كلّ بنية قائمة. المورد الحديث يذكر أن العدمية «مذهب يقول بأن الهدم
        مرغوب فيه لذاته».

stage2_evidence:
  per_lemma:
    - lemma: "عَدَمِيَّة"
      confirm:
        - text: "«عدميّة — nihilism»"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
        - text: "«العَدَمِيَّة [طب نفسي] — nihilism»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(1) «أ», العَدَميّة؛ النِّهلِسْتية: «ب» وجهة نظر تقول بأن القيَم والمعتقدات التقليدية لا أساس لها من الصحة وأن الوجود لا معنى له ولا غَناء فيه. «ج» مذهب يُنكر أن يكون للمبادئ الأخلاقيّة أيّ أساس موضوعيّ. «د» مذهب يقول بأن الأحوال في المجتمع هي من السّوء بمحلّ يجعل الهدم مرغوبًا فيه لِذاتِهِ وبمعزِلٍ عن أيّ برنامج إنشائيّ»"
          source: "المورد الحديث (2008)"
        - text: "«وُهَامٌ عَدَمِيّ — nihilistic delusion»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«عَدَمِي — من (ع د م) نسبة إلى العَدَم: الفقر، وضد الوجود.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكّد أنّ النسبة «عَدَمِيّ» مسكوكة ومعتمدة"
        - text: "«العَدَمُ: انْتِفَاء الْكَوْن.»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يربط الجذر بمفهوم نفي الوجود الفلسفي"
        - text: "«كُلّيّ أو عَدَميّ (أح).»"
          source: "المورد الحديث (2008)"
          addition: "يؤكّد استخدام «عَدَمِيّ» بمعنى all-or-nothing"
    - lemma: "نِهِلِسْتِيَّة"
      confirm:
        - text: "«(1) «أ», العَدَميّة؛ النِّهلِسْتية»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) «أ», العَدَميّة؛ النِّهلِسْتية: «ب» وجهة نظر تقول بأن القيَم والمعتقدات التقليدية لا أساس لها من الصحة وأن الوجود لا معنى له ولا غَناء فيه.»"
          source: "المورد الحديث (2008)"
          addition: "وردت كمرادف ثانٍ للعدمية في سياق التعريف الكامل"
    - lemma: "إِنْكَارِيَّة"
      evidence_status: "no_material_found"
    - lemma: "مَذْهَبُ الهَدْم"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "عَدَمِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح مسكوك ومعتمد في معاجم مصطلحية متعددة (مسرد الفلسفة، المعجم الطبي الموحد،
        المورد الحديث). مشتقّ اشتقاقاً قياسياً من الجذر ع-د-م بالمصدر الصناعي.
        يتّسق مع أسلوب التسمية العربي للمذاهب الفكرية (قياساً على: وُجودِيَّة، مَادِّيَّة، مِثالِيَّة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَمِيَّة"

    - lemma: "نِهِلِسْتِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مصطلح معرَّب ورد في المورد الحديث كمرادف ثانوي. لكنه يخالف مبدأ «إيثار العربي»؛
        فما دام المصطلح العربي «عَدَمِيَّة» مسكوكاً وشائعاً ومعتمداً في معاجم المنظمة
        العربية، لا حاجة لتعريب أجنبي. كما أنّ الصيغة ثقيلة على اللسان (نِهِلِسْتِيَّة)
        وتفتقر إلى الشفافية الدلالية.

    - lemma: "إِنْكَارِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على سكّ هذا المصطلح. «الإنكار» لفظ عامّ يشمل أنواعاً كثيرة
        من الرفض (إنكار العدالة، إنكار الأبوّة، إلخ)، ولا يختصّ بالمذهب الفلسفي-السياسي.
        «عَدَمِيَّة» أدقّ وأخصّ لأنها تحيل إلى نفي الوجود والقيمة لا مجرد الإنكار.

    - lemma: "مَذْهَبُ الهَدْم"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب إضافي وصفي حرّ وليس مصطلحاً مسكوكاً. يمكن إبدال «الهدم» بـ«التدمير»
        أو «التخريب» ويبقى صالحاً كوصف ← يخفق في اختبار السكّ. لا أدلة معجمية
        على تثبيته كوحدة معجمية.

stage4_content:
  definition:
    current: "الإنكار الكامل لكل السلطات والمؤسسات القائمة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يُركّز على البُعد السياسي فقط (إنكار السلطات والمؤسسات)
        ويُغفل البُعد الفلسفي الأساسي (نفي القيم والمعتقدات والمعنى).
        المورد الحديث يُحدّد أربعة أبعاد للعدمية، والتعريف الحالي لا يُغطّي إلا أحدها.
    authored:
