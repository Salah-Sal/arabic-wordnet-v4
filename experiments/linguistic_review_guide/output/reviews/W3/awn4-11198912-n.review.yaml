    - query_num: 2
      purpose: "الجسر الإنجليزي — ARABTERM"
      terms_searched:
        - "Mies Van Der Rohe"
        - "Ludwig Mies"
        - "Mies"
      result_summary: "لا نتائج مطابقة للشخصية في قاعدة البيانات."
    - query_num: 3
      purpose: "بحث FTS بالكلمات المفتاحية من التعريف"
      terms_searched:
        - "ناطحات سحاب"
        - "هياكل فولاذية"
        - "معماري"
      result_summary: "وُجدت مداخل لمصطلحات معمارية عامة لا تخص الشخص."

  per_lemma:
    - lemma: "لودفيغ ميس فان دير روه"
      evidence_status: "no_material_found"

    - lemma: "ميس فان دير روه"
      evidence_status: "no_material_found"

    - lemma: "لُودفِيغ مِيس فَان دِير رُوهِي"
      evidence_status: "no_material_found"

    - lemma: "لُودفِيك مِيس فَان دِير رُوه"
      evidence_status: "no_material_found"

    - lemma: "مِيس فَان دِير رُوهِي"
      evidence_status: "no_material_found"

    - lemma: "مِيس"
      contradicts:
        - text: "«ميس: المَيْس: التَبَخْتُر، ماسَ يَمِيسُ ميساً ومَيَساناً: تَبَخْتَر واخْتالَ»"
          source: "لسان العرب (Hawramani)"
          conflict: >
            الكلمة العربية «ميس» لها دلالة راسخة في المعاجم (التبختر في المشي)،
            مما يجعل استخدامها منفردةً علماً على شخص يُوقع لبساً دلالياً واضحاً.
        - text: "«ميس: جنس شجر من الفصيلة البقسية»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (ARABTERM)"
          conflict: >
            الكلمة «ميس» لها استخدام مصطلحي بيولوجي أيضاً، ما يزيد من إشكالية
            الاشتراك اللفظي إن استُخدمت منفردةً للدلالة على الشخص.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى الموجودة ──
    - lemma: "لودفيغ ميس فان دير روه"
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل للمعماري، مُعرَّب بصورة مستقرة في المصادر العربية
        المتخصصة بتاريخ العمارة الحديثة. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الكاملة للاسم الأول (لودفيغ) مع اللقب المركب؛ تُستخدم في السياقات
        الأكاديمية والمراجع الموسوعية عند ذكر الشخصية لأول مرة، وتُميِّزه بوضوح
        عن غيره من أصحاب اللقب نفسه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُودفِيغ مِيس فَان دِير رُوه"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "ميس فان دير روه"
      decision: confirmed
      decision_reason: >
        الاسم المختصر الشائع بحذف الاسم الأول (لودفيغ)، ويُكتفى به في معظم
        المراجع المعمارية والنقدية بعد التعريف الأول بالاسم الكامل. يحتاج إلى
        تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة المختصرة المعيارية للقب العائلي المركب وحده دون الاسم الأول؛
        أكثر تداولاً في الكتابة المعمارية التحليلية والتقارير الاحترافية حيث
        يكتفي الكاتب باللقب بعد أول تعريف كامل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيس فَان دِير رُوه"

    # ── مرشحات المرحلة ١ ──
    - lemma: "لُودفِيغ مِيس فَان دِير رُوهِي"
      source: stage1
      decision: removed
      decision_reason: >
        إضافة الياء في النهاية (روهي) ليست الصيغة الغالبة في المصادر العربية؛
        الشكل الأوفق هو «روه» بلا تنهية، وهو ما تُثبته المصادر الموسوعية
        العربية المعتمدة كويكيبيديا العربية والمراجع الأكاديمية.

    - lemma: "لُودفِيك مِيس فَان دِير رُوه"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب «لودفيك» شاذّ وغير مستقر؛ الصيغة المستقرة في المصادر العربية هي
        «لودفيغ» بالغين لا الكاف، تمثيلاً أدق للنطق الألماني [ç~ɪç].

    - lemma: "مِيس فَان دِير رُوهِي"
      source: stage1
      decision: removed
      decision_reason: >
        الياء في النهاية غير مستقرة في التعريبات العربية لهذا الاسم؛ الصيغة
        المقبولة «مِيس فَان دِير رُوه» بلا تنهية، وهي اللمّة الموجودة أصلاً.

    - lemma: "مِيس"
      source: stage1
      decision: removed
      decision_reason: >
        الاختصار الأقصى «ميس» منفرداً غير مقبول لمّةً معجمية لهذه المجموعة؛
        فللكلمة دلالة عربية راسخة (التبختر في المشي، وشجر البقسية) تُوقع لبساً
        دلالياً وتجعل هذا الشكل المبتور مُضلِّلاً خارج السياق.


