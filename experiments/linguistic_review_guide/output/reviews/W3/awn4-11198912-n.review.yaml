# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11198912-n  |  ILI: i96243
# الموضوع: لودفيغ ميس فان دير روه (معماري ألماني-أمريكي، 1886-1969)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان تفتقران إلى التشكيل الكامل، وهو إلزامي لكل لمّة مؤكدة."
      - "المجموعة تخص علماً شخصياً أجنبياً (اسم معماري بعينه)، وهذا يُضيِّق خيارات التوليد على التعريب حصراً."
      - "اللمّة ميس فان دير روه قد تُوهم بالاشتراك اللفظي مع الكلمة العربية (ميس: التبختر، وشجر البقسية) عند العزل عن السياق؛ غير أنها في تضافر المكونات لا لبس فيها."
      - "لا يوجد تعريف عربي بأسلوب معجمي رصين — التعريف الحالي قائم على الترجمة الحرفية للإنجليزية."
    observations: >
      هذه المجموعة الترادفية خُصِّصت لشخصية تاريخية بعينها، هو المعماري
      لودفيغ ميس فان دير روه (Ludwig Mies van der Rohe)، رائد العمارة الحديثة
      الوظيفية. جميع لمّاتها هي تعريبات للاسم الأجنبي، لا مصطلحات اشتقاقية
      أو مجازية. ولذلك يقتصر توليد المرشحين على منهج التعريب (taarib).
      التعريف الحالي يؤدي المعنى لكنه مترجم حرفياً ويفتقر إلى الأسلوب
      المعجمي العربي، ويستحسن صياغته موسوعياً. حقل pos قيمته (n) وهو صحيح
      وفق اصطلاح WordNet حتى للأعلام.

  blind_candidates:
    - lemma: "لُودفِيغ مِيس فَان دِير رُوهِي"
      generation_method: taarib
      justification: >
        تعريب للاسم الكامل مع إضافة ياء التنهية على «روه» لمحاكاة النطق الألماني
        Rohe وتسهيل انسجام الصوت في العربية، وهي صيغة ترد في بعض المصادر
        العربية المتخصصة بتاريخ العمارة.
    - lemma: "لُودفِيك مِيس فَان دِير رُوه"
      generation_method: taarib
      justification: >
        يُعرَّب الاسم الألماني Ludwig أحياناً بـ«لودفيك» محاكاةً للنطق الألماني
        بتحويل [ç] إلى كاف، وهذه الصيغة مستخدمة في بعض الترجمات العربية
        الأكاديمية القديمة.
    - lemma: "مِيس فَان دِير رُوهِي"
      generation_method: taarib
      justification: >
        الاسم المختصر المؤلف من اللقب العائلي المركب، بإضافة ياء التنهية على
        آخره لمحاكاة النطق الأصلي، وهو شكل مستخدم في بعض المصادر العربية
        المعمارية.
    - lemma: "مِيس"
      generation_method: taarib
      justification: >
        الاختصار الأقصى الذي يُكتفى به في بعض النصوص النقدية المعمارية
        المتخصصة عند الإشارة للمعماري بعد تعريفه بالاسم الكامل، غير أن
        اشتراكه اللفظي مع كلمة عربية أصيلة (ميس: التبختر وشجر البقسية)
        يُضعفه.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
