# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13970190-n
# egality / egalite — المساواة الاجتماعية والسياسية
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مساواة تامة» تعبير وصفي حرّ وليس مصطلحاً مسكوكاً؛ يمكن إبدال «تامة» بـ«كاملة» دون تغيّر الوظيفة"
      - "المجموعة تحتوي لمّة واحدة فقط مما يُضعف تمثيلها الدلالي"
      - "«مساواة تامة» لا تحدّد البُعد الاجتماعي والسياسي — فقد تعني المساواة التامة في أي مجال"
    observations: "المفهوم المقصود هو المساواة بوصفها مبدأً اجتماعياً وسياسياً شاملاً (égalité الفرنسية)، وهو نوع خاص من المساواة العامة (المفرط: تكافؤ/مساواة). العربية تعبّر عن هذا المفهوم عادةً بلفظ «مساواة» مجرداً أو بعبارة وصفية، ولا يوجد لفظ مفرد مكافئ لـ egality تماماً، مما يجعله فجوة معجمية جزئية."
  blind_candidates:
    - lemma: "مُسَاوَاتِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «مساواة» على وزن فُعَالاتِيَّة، يدلّ على مبدأ المساواة الشاملة بين الناس في الحقوق والواجبات"
    - lemma: "تَعَادُلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تعادُل» (جذر ع د ل)، يؤدّي معنى التساوي والإنصاف في الشؤون الاجتماعية"
    - lemma: "سَوِيَّة"
      generation_method: ishtiqaq
      justification: "من جذر س و ي على وزن فَعِيلة، بمعنى حالة الاستواء بين الناس، ومنه «هم على سوية من الأمر»"
    - lemma: "إِيغَالِيَّة"
      generation_method: taarib
      justification: "تعريب للفرنسية égalité بإلحاق ياء النسبة والتاء، على غرار تعريب ليبرالية وديمقراطية"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مُسَاوَاةٌ تَامَّةٌ"
      evidence_status: "no_material_found"

    - lemma: "مُسَاوَاة"
      confirm:
        - text: "«(فى علم الفلسفة) Equality: ضربان: ١- مادية, وهى تَعَادُلُ الأفراد فى ظروفهم الواقعية. ٢- معنوِيَّةٌ, وهى تساوى الأفراد فى الحقوق والواجبات فيكونون سواءً أمام القانون والوظائف العامة.»"
          source: "المعجم الكبير"
        - text: "«علاقة تكافؤ بين الأفراد أو المجموعات.»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
      expands:
        - text: "«حالة شيء واحد مشابهة لحالة شيء آخر من حيث الطبيعة والشكل والجودة والكمية. تحقيق هدف المساواة يتجاوز مجرد حظر أو القضاء على التمييز.»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "يوسّع المفهوم ليشمل تجاوز الحظر إلى المساواة الفعلية"
        - text: "«[في الانكليزية] Equality ،equivalence [في الفرنسية] Egalite ،equivalence معناها عند المتكلّمين والحكماء والمنطقيين ... وأمّا معناها عند أهل المعاني فقد ورد في لفظ الإطناب وهي واسطة بين الإيجاز والإطناب.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يبيّن أن المساواة مصطلح متعدد الحقول: فلسفي ومنطقي وبلاغي"

    - lemma: "مُسَاوَاتِيَّة"
      confirm:
        - text: "«المُساواتيّة: الإيمان بالمساواة بين البشر.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«المُساواتيّة: الإيمان بالمساواة بين البشر.»"
          source: "المورد الحديث (2008)"
          conflict: "المساواتية تعني مذهب الإيمان بالمساواة (egalitarianism) وليس حالة المساواة نفسها (egality)"

    - lemma: "تَعَادُلِيَّة"
      confirm:
        - text: "«تعادلية — egalitarianism»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
      contradicts:
        - text: "«تعادلية — egalitarianism»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          conflict: "المصطلح يقابل egalitarianism (المذهب) لا egality (الحالة)"

    - lemma: "سَوِيَّة"
      evidence_status: "no_material_found"

    - lemma: "إِيغَالِيَّة"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُسَاوَاةٌ تَامَّةٌ"
      decision: confirmed
      decision_reason: "رغم أنها تعبير وصفي حرّ يخفق في اختبار السكّ (يمكن إبدال «تامة» بـ«كاملة»)، فإنها التمثيل المتاح الوحيد لمفهوم المساواة الكاملة اجتماعياً وسياسياً. وإزالتها تترك المجموعة فارغة. تُبقى مع تسجيل التحفّظ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسَاوَاةٌ تَامَّةٌ"

    - lemma: "مُسَاوَاتِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تؤكد أن المساواتية تقابل egalitarianism (مذهب الإيمان بالمساواة) لا egality (حالة المساواة ذاتها). المجموعة الحالية تمثّل الحالة لا المذهب."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَعَادُلِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مسجّل في المعجم الموحد للاقتصاد مقابل egalitarianism وليس egality. فضلاً عن أن جذر «عدل» يوحي بالعدالة والإنصاف أكثر من التساوي المطلق."
      evidence_assessment:
        case: contradicts_only

    - lemma: "سَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استعمال «سوية» بمعنى المساواة الاجتماعية والسياسية. الاستعمال المعروف «على سوية» يعني على استواء عام، ولم يتخصص بهذا المعنى السياسي."
      evidence_assessment:
        case: no_material

    - lemma: "إِيغَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة على تداول هذا التعريب في المعاجم أو الاستعمال العربي. والتعريب ملاذ أخير لا يُلجأ إليه مع وجود بدائل عربية مثل «مساواة تامة»."
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
