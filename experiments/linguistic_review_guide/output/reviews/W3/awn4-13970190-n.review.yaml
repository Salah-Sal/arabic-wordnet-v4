  definition:
    current: "المساواة الاجتماعية والسياسية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية مباشرة للإنجليزية، يفتقر إلى الجنس القريب والفصل النوعي، ولا يبيّن طبيعة المفهوم بوصفه حالة مثالية"
    authored:
      - type: terminological
        text: "حالةُ التَّساوي التامِّ بينَ أفرادِ المجتمعِ في الحقوقِ والواجباتِ الاجتماعيَّةِ والسِّياسيَّةِ دونَ تمييزٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالةُ التَّساوي التامِّ بينَ أفرادِ المجتمعِ في الحقوقِ والواجباتِ الاجتماعيَّةِ والسِّياسيَّةِ دونَ تمييزٍ"
  examples:
    per_lemma:
      - lemma: "مُسَاوَاةٌ تَامَّةٌ"
        examples:
          - text: "نصَّ الدستورُ على مُسَاوَاةٍ تَامَّةٍ بينَ المواطنينَ في الحقوقِ المدنيَّةِ والسِّياسيَّةِ بصرفِ النظرِ عن الجنسِ أو العِرقِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "نصَّ الدستورُ على مُسَاوَاةٍ تَامَّةٍ بينَ المواطنينَ في الحقوقِ المدنيَّةِ والسِّياسيَّةِ بصرفِ النظرِ عن الجنسِ أو العِرقِ."

