# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────
stage1_review:
  assessment:
    concerns:
      - اللمات الحالية تفتقر إلى التشكيل الكامل.
      - الاقتصار على اسم واحد (بالاتون) دون الإشارة إلى الاسم الألماني التاريخي (Plattensee) الذي قد يرد في بعض المصادر.
    observations: "المجموعة تمثل كياناً جغرافياً محدداً (بحيرة في المجر). التسمية العربية المعتمدة هي 'بالاتون' نقلاً عن المجرية، و'هنغاريا' أو 'المجر' للدولة."
  blind_candidates:
    - lemma: "بَالَاتُون"
      generation_method: taarib
      justification: "التعريب المباشر للاسم المجري (Balaton) وهو الأكثر شيوعاً."
    - lemma: "بُحَيْرَة بَالَاتُون"
      generation_method: tarkib
      justification: "الاسم المركب الوصفي المعتاد للمسطحات المائية."
    - lemma: "بْلَاتِنْسِي"
      generation_method: taarib
      justification: "تعريب الاسم الألماني للبحيرة (Plattensee) الذي قد يرد في المصادر التاريخية أو الجغرافية المتأثرة بالألمانية."
    - lemma: "بُحَيْرَة بْلَاتِنْسِي"
      generation_method: tarkib
      justification: "الصيغة المركبة للاسم الألماني."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بالاتون"
      evidence_status: "no_material_found"
    - lemma: "بحيرة بالاتون"
      evidence_status: "no_material_found"
    - lemma: "المجر"
      confirm:
        - text: "«عِيَارٌ ذَهَبِيٌّ نُسِبَ إِلَى بِلَادِ المَجَرِ»"
          source: "المعجم الوسيط"
    - lemma: "بحر"
      confirm:
        - text: "«سُمِّيَ الْبَحْرُ بَحْرًا لِاسْتِبْحَارِهِ وَهُوَ انْبِسَاطُهُ وَسَعَتُهُ... وَالْأَنْهَارُ كُلُّهَا بِحَارٌ»"
          source: "مقاييس اللغة"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "بالاتون"
      decision: confirmed
      decision_reason: "الاسم المعتمد للبحيرة في اللغة العربية المعاصرة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَالَاتُون"
    - lemma: "بحيرة بالاتون"
      decision: confirmed
      decision_reason: "الصيغة المركبة الأكثر شيوعاً وتعريفاً للكيان الجغرافي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُحَيْرَة بَالَاتُون"

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "بحيرة كبيرة ضحلة في غرب المجر"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه يفتقر إلى التفاصيل الموسوعية التي تميز هذه البحيرة تحديداً في السياق الجغرافي العربي."
    authored:
      - type: encyclopedic
        text: "بُحَيْرَةٌ عَذْبَةٌ كَبِيرَةٌ تَقَعُ فِي غَرْبِ المَجَرِ، تُعَدُّ أَكْبَرُ بُحَيْرَةٍ فِي أُورُوبَّا الوُسْطَى، وَتَشْتَهِرُ بِضَحَالَةِ مِيَاهِهَا وَأَهَمِّيَّتِهَا السِّياحِيَّةِ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "بُحَيْرَةٌ عَذْبَةٌ كَبِيرَةٌ تَقَعُ فِي غَرْبِ المَجَرِ، تُعَدُّ أَكْبَرُ بُحَيْرَةٍ فِي أُورُوبَّا الوُسْطَى، وَتَشْتَهِرُ بِضَحَالَةِ مِيَاهِهَا."
  examples:
    per_lemma:
      - lemma: "بَالَاتُون"
        examples:
          - text: "تُعْتَبَرُ بَالَاتُون مَقْصِداً سِيَاحِيّاً رَئِيسِيّاً فِي المَجَرِ لِجَمَالِ طَبِيعَتِهَا."
            type: usage
      - lemma: "بُحَيْرَة بَالَاتُون"
        examples:
          - text: "تَمْتَازُ بُحَيْرَة بَالَاتُون بِمِيَاهِهَا الدافِئَةِ رَغْمَ وُقُوعِهَا فِي مَنَاطِقَ بَارِدَةٍ نِسْبِيّاً."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُعَدُّ بَالَاتُون أَكْبَرُ بُحَيْرَةٍ فِي أُورُوبَّا الوُسْطَى."

