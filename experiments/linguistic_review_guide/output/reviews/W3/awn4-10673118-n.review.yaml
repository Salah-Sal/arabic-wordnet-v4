# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "كلتا اللمّتين الموجودتين (صانع فولاذ، عامل صلب) تفتقران إلى التشكيل الكامل"
      - "لمّة «عامل صلب» مبهمة: قد تُقرأ «عَامِلٌ صُلْبٌ» (أي عامل شديد متين) لا «عامل في صناعة الصُّلْبِ»؛ سبب الإبهام: غياب «ال» على صلب، فيُوهم الصفة لا الإضافة"
      - "التعريف الحالي «عامل يعمل في صنع الفولاذ» يكرر الجذر نفسه (ع-م-ل) في «عامل» و«يعمل» مما يُشبه الدوران الجزئي"
      - "«صانع فولاذ» جاء بدون «ال» على فولاذ، بينما الاستعمال المعجمي المؤصَّل في المورد الحديث يُثبتها: «عامل الفولاذ»"
    observations: >
      المجموعة تعالج مفهوماً صناعياً حديثاً: العامل في صناعة الفولاذ. كلمة «فولاذ» لفظٌ
      دخيل من الفارسية (فولاد)، بينما «صُلْب» لفظٌ عربي أصيل يُؤدي المعنى ذاته في التقاليد
      المعجمية الحديثة (أثبتته ARABTERM بمعنى steel). اللمّتان معاً تمثّلان التمييز الإنجليزي
      بين steelMAKER (التركيز على صنع الفولاذ) وsteelWORKER (التركيز على العمل في قطاع الفولاذ).
      أبرز مشكلة هي الالتباس الإعرابي في «عامل صلب» الذي يستوجب التصحيح.

  blind_candidates:
    - lemma: "صَلَّاب"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن فَعَّال من جذر ص-ل-ب؛ الصُّلْبُ في العربية يعني الشيء الشديد القوي، وقد
        استُعمل في المعاجم الحديثة للدلالة على الفولاذ. قياسًا على حَدَّاد (صانع الحديد) يمكن اشتقاق
        صَلَّاب (صانع الصُّلْب/الفولاذ) على الوزن ذاته المخصص للحرفيين.
    - lemma: "صانِعُ الصُّلْبِ"
      generation_method: tarkib
      justification: >
        مركب إضافي من «صانع» (مُشتق من ص-ن-ع) + «الصُّلْب» (الكلمة العربية الأصيلة لمادة
        الفولاذ). يوازي «صانع الفولاذ» لكنه يستعمل اللفظ العربي بديلًا عن الدخيل الفارسي.
    - lemma: "مُصَلِّب"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل صَلَّبَ (الباب الثاني)؛ معناه «من يُصلِّب» أي يجعل المادة صُلْبًا/فولاذًا.
        على وزن مُفَعِّل المناسب لمن يُمارس عملية التصليب الصناعي للمعادن.
    - lemma: "صَهَّار"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن فَعَّال من جذر ص-ه-ر (صَهَرَ: أذاب المعدن وأفرز دُهْنَه). الصناعة الأولية
        للفولاذ تقوم على صهر الحديد الخام، فصَهَّار يعني من يمارس هذا الصهر اليومي احترافًا.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   ١. مطابقة دفعية: لمّات المجموعة + المرشحات (مع ال وبدونها)
#   ٢. جسر إنجليزي: steelworker, steelmaker, steel worker, steel maker
#   ٣. FTS عربي: فولاذ، صلب، صناعة الصلب
#   ٤. مقاييس اللغة لابن فارس: جذور صنع، صلب، عمل، فلذ
stage2_evidence:

  per_lemma:

    - lemma: "صانع فولاذ"
      expands:
        - text: "«عامل الفولاذ: عاملٌ في مصنع للفولاذ.» [translation_en: steelworker]"
          source: "المورد الحديث (2008) — al-Mawrid al-Hadeeth"
          addition: >
            المعجم يُثبت المصطلح بصيغة «عامل الفولاذ» (لا «صانع فولاذ»)، وهو يؤكد الفكرة
            الكبرى لكنه يفضّل «عامل» ويُلزم «ال» قبل فولاذ في المركب الإضافي.
        - text: "«الصَّانِع: من يصنع بيدَيْهِ، ومن يحترف الصِّناعة»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
          addition: "يؤكد أن صانع وصف عربي راسخ للحِرَفي المُنتِج."
        - text: "«الصَّانِعُ: كُلُّ مُحْتَرِفٍ بيده مُتَكَسِّبٌ من حِرْفَتِه»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          addition: "يُرسّخ «صانع» بمعنى المحترف الماهر باليد، ويناسب سياق العمل الصناعي."

    - lemma: "عامل صلب"
      confirm:
        - text: "«عامل الفولاذ: عاملٌ في مصنع للفولاذ.» [translation_en: steelworker]"
          source: "المورد الحديث (2008) — al-Mawrid al-Hadeeth"
      expands:
        - text: "«الصُلب: الحديد المحتوي على نسبة ضئيلة من الكربون.» [translation_en: steel, domain: Automotive Engineering]"
          source: "مسرد هندسة وتكنولوجيا السيارات، ALECSO (ARABTERM)"
          addition: >
            يُثبت أن «الصُّلْب» مقابل عربي فني معتمد للـ steel في المعاجم التقنية الحديثة،
            مما يشرعن استعمال «عامل الصُّلْب» أو «عامل الفولاذ» على حدٍّ سواء.

    - lemma: "صَلَّاب"
      contradicts:
        - text: "«صَلَّاب: من (ص ل ب) مبالغة في الصَّلْب: شد أطراف الجسم وتعليقه وهو من أنواع القتل وشي اللحم واستخراج دسمه.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
          conflict: >
            المعجم يُثبت «صلاب» بمعنى «بالغ الشدة في تنفيذ الصَّلْب» (أي الإعدام بشدّ الأطراف)،
            وهو مغاير كلياً لمعنى «صانع الفولاذ». الاشتراك اللفظي هنا خطير لأن الجذر الأول
            لـ صلب في الاستعمال القرآني والتراثي هو الصَّلْب=الإعدام، لا الصُّلْب=الفولاذ.

    - lemma: "صانِعُ الصُّلْبِ"
      expands:
        - text: "«الصُلب: الحديد المحتوي على نسبة ضئيلة من الكربون.» [translation_en: steel]"
          source: "مسرد هندسة وتكنولوجيا السيارات، ALECSO (ARABTERM)"
          addition: >
            يُؤكد أن «صانع الصلب» مفهوم متسق مع المعجم التقني، لكن التركيب كوحدة معجمية
            ثابتة لم يُعثر له على توثيق مستقل؛ فالمورد الحديث اعتمد «عامل الفولاذ» لا «صانع الصلب».

    - lemma: "مُصَلِّب"
      contradicts:
        - text: "«مُصَلِّب: مسرع (معجل) جفاف الدهان» [translation_en: hardener; accelerator, domain: Petroleum]"
          source: "المعجم الموحد لمصطلحات النفط (1999) — ALECSO (ARABTERM)"
          conflict: >
            المعجم التقني يستعمل «مصلِّب» للمادة الكيميائية المُعجِّلة لجفاف الدهان (hardener)،
            لا لشخص يعمل في صناعة الفولاذ. فضلاً عن ذلك، المعجم الطبي الموحد (2009)
            يورد «مصلِّب» بمعاني scleratogenous/sclerogenic/sclerosing — كلها تقنية
            غير متصلة بمفهوم عامل الفولاذ.
        - text: "«مُصَلِّب» [translation_en: sclerogenic / sclerosing / scleratogenous, domain: The Unified Medical Dictionary]"
          source: "المعجم الطبي الموحد (2009) — ALECSO (ARABTERM)"
          conflict: "دلالة طبية راسخة تتعارض مع المقصود هنا وتُوجب رفض المرشح."

    - lemma: "صَهَّار"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "صانع فولاذ"
      decision: confirmed
      decision_reason: >
        المركب الإضافي «صانع فولاذ» يُعبِّر تعبيراً صحيحاً عن مفهوم steelmaker؛ جذر صنع
        راسخ في المعجم الوسيط والكبير لمعنى الحرفي المُنتِج. المشكلة الوحيدة هي غياب «ال»
        قبل فولاذ وغياب التشكيل؛ يُصحَّح إلى «صانِعُ الفُولاذِ» ليتوافق مع أسلوب المركب
        الإضافي الفصيح (المضاف إليه محدَّد بـال في تقليد المصطلحات التقنية).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على دور الصنع والإنتاج (صانع = manufacturer/maker)؛ يُقابل «steelmaker» بمعنى
        من يُنتج الفولاذ ويُصنِّعه صناعةً مباشرة، بخلاف «عامِلُ الفُولاذِ» الذي يشمل كل
        من يعمل في القطاع دون اشتراط الدور الإنتاجي المباشر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صانِعُ الفُولاذِ"

    # ── لمّة موجودة ٢ ──
    - lemma: "عامل صلب"
      decision: confirmed
      decision_reason: >
        الفكرة الدلالية صحيحة (عامل في صناعة الفولاذ = steelworker)، لكن الصيغة الحالية مُشكلة:
        «عامل صلب» بدون «ال» يُقرأ إعرابيًا «عاملٌ صُلْبٌ» أي «عامل متين/شديد» — وهو معنى
        آخر كلياً. والمورد الحديث (2008) يوثّق الصيغة الصحيحة المعتمدة: «عامل الفولاذ»
        (بال + فولاذ)، لذا يُصحَّح المصطلح إلى «عامِلُ الفُولاذِ» مع تشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على وضعية العمل والانتماء إلى قطاع الفولاذ (عامل = worker/laborer)؛ يُقابل
        «steelworker» بمعنى أشمل يضم عمال الصهر والتشكيل والتشريب وغيرهم، بخلاف
        «صانِعُ الفُولاذِ» الذي يحصر الدور في الإنتاج الفعلي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عامِلُ الفُولاذِ"

    # ── مرشح المرحلة ١ — أ ──
    - lemma: "صَلَّاب"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم يُثبت «صلاب» بمعنى «البالغ في تنفيذ الصلب» (الإعدام) من الجذر ص-ل-ب
        بدلالته الأولى (القتل والتعليق)، لا من الدلالة الثانية (الشدة/الفولاذ). هذا الاشتراك اللفظي
        يجعل المصطلح خطيرًا ومُلبِسًا في أي نص يذكره، فضلًا عن أن وزن فَعَّال من صلب
        يُفيد المبالغة في الفعل لا الحرفة المادية. يُرفض رفضاً قاطعاً.

    # ── مرشح المرحلة ١ — ب ──
    - lemma: "صانِعُ الصُّلْبِ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «الصُّلْب» مُثبَتٌ في ARABTERM مقابلاً تقنياً للـ steel، فإن «صانع الصُّلب» لم
        يُوثَّق كوحدة معجمية ثابتة في أي مصدر. المورد الحديث اعتمد «عامل الفولاذ» ولم
        يُورد «صانع الصلب». كذلك فإن إضافة هذا المرشح ستُنشئ تكراراً مع «صانِعُ الفُولاذِ»
        المؤكَّدة، وهما يُعبِّران عن المفهوم ذاته (steelmaker) بمادتين لغويتين مترادفتين
        (فولاذ = الصُّلب) دون فارق دلالي في سياق هذه المجموعة.

    # ── مرشح المرحلة ١ — ج ──
    - lemma: "مُصَلِّب"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبت «مصلِّب» في حقلين تقنيين راسخين: (أ) مصطلح بترولي بمعنى
        hardener/accelerator للدهانات، (ب) مصطلح طبي بمعنى sclerogenic. كلا الاستعمالين
        يتعارضان تعارضًا صريحًا مع المعنى المقصود (شخص يعمل في صناعة الفولاذ). استعمال
        هذا المصطلح في المجموعة سيُولِّد التباساً حاداً مع المعاجم التقنية المتداولة.

    # ── مرشح المرحلة ١ — د ──
    - lemma: "صَهَّار"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على «صهّار» في قواعد البيانات المعجمية المستعلَمة، ولا يُوجد توثيق لاستعماله
        مصطلحاً للعامل في صناعة الفولاذ. فضلاً عن ذلك، الصهر عملية واحدة من مراحل
        صناعة الفولاذ، فصَهَّار أعمُّ دلالةً (يشمل صاهر الذهب والنحاس وغيرها)، مما يجعله
        غير محدد بما يكفي للمجموعة المراد التعبير عنها.


