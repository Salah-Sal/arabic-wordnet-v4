  per_entry:
    - lemma: "مَضِيق"
      entry_id: "{auto}"
      root: "ضيق"
      maqayis_quote: "«الضَّادُ وَالْيَاءُ وَالْقَافُ أَصْلَانِ، أَحَدُهُمَا يَدُلُّ عَلَى خِلَافِ السَّعَةِ، وَالْآخَرُ يَدُلُّ عَلَى بَعْضِ الطَّيْرِ. فَالْأَوَّلُ الضِّيقُ.»"
    - lemma: "بُوغاز"
