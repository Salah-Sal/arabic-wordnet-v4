          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "الناقر في المعجم المحكَّم يُعنى بالسهم المصيب للهدف، لا بصانع المنحوتات"
        - text: "«(الناقر): السهمُ يُصيبُ الهدف. ويقال: أخطأت نواقره: لم يستقم على الصواب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "تأكيد نفس المعنى: الناقر = السهم لا النحّات"


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:

  per_lemma:

    # ── مثّال (موجودة) ──
    - lemma: "مثّال"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكدة لغوياً ومعجمياً؛ صرّح المعجم الوسيط بأن المَثَّال = صانع التماثيل وأشار إلى
        أنه مُقرَّر مجمعياً (مج)، مما يمنحه أعلى درجات التثبيت المعجمي. الوزن فَعَّال دالٌّ على
        الحرفة والاحتراف. تحتاج اللمّة إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مَثَّال تُركّز على الجانب الإبداعي التصويري: صنع مثيل للأصل (من مَثَلَ = ناظَرَ وشابَهَ).
        الدلالة فنية بامتياز وتنصبّ على التمثيل الفني الدقيق لهيئة الأشياء. يُستعمل بشكل خاص
        للنحّات الذي يُنتج تماثيل وأشكالاً فنية محكمة تُحاكي الواقع.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَثَّال"

    # ── نحات (موجودة) ──
    - lemma: "نحات"
      decision: confirmed
      decision_reason: >
        اللمّة راسخة في المعجم الوسيط بتعريف «من مهنته النحاتة»، وشاع استخدامها في المعاجم
        التقنية والمتخصصة مقابلاً لـ sculptor وcarver. الوزن فَعَّال يدلّ على الاحتراف. تحتاج
        اللمّة إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        نَحَّات يُركّز على الحِرفة اليدوية في النحت والحفر والبري (من نَحَتَ = نجَرَ شيئاً وسوَّاه
        بحديدة). يشمل نطاقٌ أوسعَ: نحّات الخشب، ونحّات الحجر، والنحّات الفني. أقلّ خصوصية
        من مثّال في الإيحاء الفني الجمالي، وأقرب إلى وصف المحترف الماهر في أعمال النحت
        عموماً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَحَّات"

    # ── ناحت (مرشح المرحلة ١) ──
    - lemma: "ناحت"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية على استخدام ناحت (اسم فاعل) كمصطلح مسكوك لصانع التماثيل؛ وزن فاعل
        يدلّ على الفعل العارض لا الاحتراف. المعاجم تُؤثر نحّات (فعّال) للحرفي المحترف. اجتاز
        اختبار السكّ لغوياً لكنه لم يُثبَّت معجمياً، فيُزال تفادياً لإدخال مصطلح غير موثّق.

    # ── صوّار (مرشح المرحلة ١) ──
    - lemma: "صوّار"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة تناقض هذا الترشيح تناقضاً قاطعاً؛ صوار/صوّار في المعاجم العربية الكلاسيكية
        والحديثة = القطيع من البقر / وعاء المسك / الالتحام التشريحي. الاشتراك اللفظي شديد
        ويُوقع في لبس مزدوج ثقافي ومفهومي.

    # ── مجسّم (مرشح المرحلة ١) ──
    - lemma: "مجسّم"
      source: stage1
      decision: removed
      decision_reason: >
        المجسَّم (اسم مفعول) راسخ في الاستعمال المعجمي والرياضي للدلالة على الجسم الهندسي ذي
        الأبعاد الثلاثة، وليس على الشخص الصانع له. يناقض هذه المجموعة دلالياً لأن المطلوب
        الفاعل (الفنان) لا المفعول (الجسم). كما أن استخدامه هنا سيُحدث التباساً مع مصطلحه
        الرياضي الراسخ.

    # ── ناقر (مرشح المرحلة ١) ──
    - lemma: "ناقر"
      source: stage1
      decision: removed
      decision_reason: >
        الناقر في المعجم المحكَّم يعني السهم المصيب للهدف لا الحِرفي. وإن كانت اللغة تسمح
        بتوليد ناقر = من ينقر الحجر، فلا شاهد على سكّ هذا المعنى. اختبار التثبيت المعجمي
        يرفضه.


