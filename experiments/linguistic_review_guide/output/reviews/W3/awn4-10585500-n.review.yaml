# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "لمّتا المجموعة (مثّال، نحات) خاليتان من التشكيل الكامل"
      - "التعريف العربي الحالي «فنان يبدع المنحوتات» مقتضب؛ لا يذكر الجنس القريب الكافي ولا المواد المستعملة"
      - "مثّال وزنها مَثَّال (فَعَّال) مما يوجب توضيح الجذر وفصله عن المِثال (مِفعال) في المعجم"
    observations: >
      المجموعة تُعنى بفنان تشكيلي يعمل في المواد الصلبة ثلاثية الأبعاد (الحجر، الخشب، المعدن).
      اللمّتان الموجودتان (مثّال ونحات) كلتاهما راسختان في المعجم العربي الحديث؛ غير أن مثّال
      جاء على وزن فَعَّال الدالّ على الاحتراف والكثرة، في حين نحات صيغة مهنية مباشرة من الجذر
      نحت. يجدر التأكد من التشكيل الصحيح ومن الجذور الأصلية لكليهما.

  blind_candidates:
    - lemma: "نَاحِت"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن فَاعِل من الفعل نَحَتَ (يَنْحِتُ)؛ أي الذي يمارس فعل النحت بالفعل.
        الجذر نحت يدلّ لغوياً على نجر الشيء وتسويته بحديدة، وهو صفة دقيقة لصانع المنحوتات.
        الوزن فاعل مقبول اشتقاقياً ومُطَّرد في الدلالة على صاحب الفعل.

    - lemma: "صَوَّار"
      generation_method: ishtiqaq
      justification: >
        اسم على وزن فَعَّال من جذر صور (يصوِّر)؛ صانع الصور والأشكال. الجذر صور يدل على
        تشكيل الهيئات والأشكال، وهو ما يفعله النحّات حين يُفرغ المادة الصلبة في هيئة فنية.
        الوزن فعّال موصوف بالكثرة والاحتراف، مما يلائم وصف الفنان المحترف.

    - lemma: "مُجَسِّم"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل جَسَّمَ (فعل من الباب الثاني)، بمعنى من يمنح شيئاً هيئةً جسمانيةً
        وأبعاداً ثلاثية. النحّات بطبيعته يحوّل المادة المسطّحة أو الكتلة الخام إلى جسم ذي طول
        وعرض وعمق، فالمجسِّم وصف دقيق لهذه الوظيفة.

    - lemma: "نَاقِر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن فَاعِل من نَقَرَ (ينقُر)، أي الذي ينقر الحجر أو المعدن ويحفره.
        مقاييس اللغة لابن فارس تؤصّل النقر بأنه «قرع الشيء حتى تُهزم فيه هزمة»، وهذا يطابق
        حركة يد النحّات حين يعمل على المواد الصلبة.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:

  # ملاحظة الاستعلامات (تتبّع الميزانية):
  # Q1 — مطابقة دقيقة دفعية: مثال/المثال، نحات/النحات، ناحت/الناحت، صوار/الصوار، مجسم/المجسم، ناقر/الناقر
  # Q2 — جسر إنجليزي: sculptor / sculpturer / carver / statue maker
  # Q3 — FTS عربي: نحت / منحوتة / تمثال / نحاتة / صانع التماثيل
  # Q4 — مقاييس اللغة (dictionary_id=151): نحت / مثل / نقر / جسم

  per_lemma:

    # ── لمّة موجودة: مثّال ──
    - lemma: "مثّال"
      confirm:
        - text: "«المَثَّالُ: صانع التماثيل»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(الْمِثَال): صانع التماثيل (مج)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«مَثَّال نصفي: صانع التماثيل النصفية» ترجمة: bust sculptor"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      expands:
        - text: "«النحّات؛ المثّال.» مقابلاً لـ sculptor"
          source: "المورد الحديث (2008)"
          addition: "يُستعمل مثّال مرادفاً لنحّات في السياق المعاصر للدلالة على sculptor بوجه عام"

    # ── لمّة موجودة: نحات ──
    - lemma: "نحات"
      confirm:
        - text: "«النَّحَّاتُ: من مهنته النِّحاتة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«(النحات): من مهنته النحاتة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«نحّات، حفّار» مقابلاً لـ carver (Masonry - Carpentry)"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2 (1999)"
        - text: "«نحّات على الخشب» مقابلاً لـ sculptor; wood carver"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2 (1999)"
        - text: "«نحات خشب» مقابلاً لـ wood carver (sculptor)"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
      expands:
        - text: "«(1) النّحّات؛ النقّاش» مقابلاً لـ carver"
          source: "المورد الحديث (2008)"
          addition: "النحّات قد يُستخدم أيضاً للنقاش والحفّار، مما يجعله أعمّ قليلاً من مثّال"
        - text: "«النحّات؛ المثّال.» مقابلاً لـ sculptor"
          source: "المورد الحديث (2008)"
          addition: "يُعادل sculptor تماماً حين يُقرن بمثّال في الترجمة الثنائية"

    # ── مرشح المرحلة ١: ناحت ──
    - lemma: "ناحت"
      evidence_status: "no_material_found"

    # ── مرشح المرحلة ١: صوّار ──
    - lemma: "صوّار"
      contradicts:
        - text: "«الصُّوارُ: وعاءُ الْمِسْكِ. وقيل: المِسكُ نَفْسُه, أو القليلُ منه. وقيل: الرائحةُ الطيِّبَةُ. القطيعُ من البقر»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "صوار/صوّار لا يدلّ على صانع التماثيل بل على القطيع من البقر ووعاء المسك، وهو معنى متباعد تماماً"
        - text: "«الصِّوارُ: القطيعُ من البقر»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "تأكيد إضافي أن الصوار = القطيع من البقر"
        - text: "«صِوار» مقابلاً لـ commissure (Gross Anatomy)"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          conflict: "الاستخدام التقني الحديث للصوار في التشريح (الالتحام العصبي)، لا علاقة له بالنحت"

    # ── مرشح المرحلة ١: مجسّم ──
    - lemma: "مجسّم"
      contradicts:
        - text: "«المُجَسَّم: ما له طول وعرض وسمك»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "المجسَّم اسم مفعول يدلّ على الشيء ذي الأبعاد الثلاثة (الجسم الهندسي)، لا على الشخص الصانع له"
        - text: "«المجسّم عند المهندسين يطلق على شكل يحيط به سطح واحد أو أكثر»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الاستعمال الاصطلاحي الراسخ للمجسّم في الرياضيات والهندسة يعني الجسم الهندسي لا الفنان"

    # ── مرشح المرحلة ١: ناقر ──
    - lemma: "ناقر"
