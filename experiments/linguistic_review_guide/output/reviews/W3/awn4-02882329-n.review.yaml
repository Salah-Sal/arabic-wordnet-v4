stage4_content:
  definition:
    current: "ترتيب للزهور يُعطى عادة كهدية"
    assessment:
      decision: revise
      reason: "التعريف الحالي عبارة عن ترجمة حرفية ركيكة (ترتيب للزهور). التعريف المعجمي يجب أن يبين الجنس (حزمة/ضميمة) والغرض."
    authored:
      - type: terminological
        text: "حُزْمَةٌ مِنَ الزُّهُورِ تُنَسَّقُ بِمَهَارَةٍ لِتُقَدَّمَ هَدِيَّةً أَو تُسْتَعْمَلَ لِلزِّينَةِ."
