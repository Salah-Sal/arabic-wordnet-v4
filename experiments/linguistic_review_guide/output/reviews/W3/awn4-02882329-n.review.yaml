stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'باقة ورد' مقبولة وشائعة، لكنها تخصص المفهوم بالورد فقط، بينما التعريف الإنجليزي والأصل الدلالي يشمل الزهور عامة (flowers)."
      - "التعريف الحالي ركيك ويميل إلى الترجمة الحرفية من الإنجليزية (ترتيب للزهور يُعطى عادة كهدية)."
    observations: "تاريخياً، استُخدمت كلمة 'طاقة' للتعبير عن حزمة الريحان أو الزهر، بينما كانت 'باقة' تُطلق على حزمة البقل. في العصر الحديث، اتسع دلالة 'باقة' مجازياً لتشمل الزهور والورود، وأقر مجمع اللغة العربية بالقاهرة هذا الاستعمال. يمكن التعبير عن المفهوم بكلمة مفردة (باقة) أو مركبة (باقة زهور، طاقة ورد)."
  blind_candidates:
    - lemma: "طَاقَةُ زَهْرٍ"
      generation_method: majaz
      justification: "استعمال فصيح قديم؛ فالطاقة هي الشعبة أو الحزمة من الريحان أو الزهر."
    - lemma: "بَاقَةُ زُهُورٍ"
      generation_method: tarkib
      justification: "تركيب إضافي شائع ومناسب يشمل مختلف أنواع الأزهار، وهو أدق من تخصيصه بالورد."
    - lemma: "بَاقَة"
      generation_method: majaz
      justification: "اتساع دلالي حديث لكلمة باقة (حزمة البقل) لتصبح مصطلحاً مستقلاً يعني حزمة الزهور المنسقة."
    - lemma: "ضِمَامَة"
      generation_method: ishtiqaq
      justification: "الضمامة هي ما يُضَمُّ ويُجْمَع، وتصلح للدلالة على حزمة الزهور المضمومة."

stage2_evidence:
  per_lemma:
    - lemma: "باقة ورد"
      confirm:
        - text: "«الصواب والرتبة: -طاقة ورد [فصيحة]-باقة ورد [صحيحة] التعليق: ورد في التاج: «الباقة: الحزمة من البقل» والبقل نبات كالريحان والورد وعليه فيجوز استعمال الباقة مع الورود ويكون الاستعمال مجازيًّا لعلاقة المشابهة وقد أجاز مجمع اللغة المصري استعمال الكلمتين «طاقة وباقة» وإن كان يفضل الأولى.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
    - lemma: "باقة زهور"
      confirm:
        - text: "«الصِّدارية: باقة زهر صغيرة تزيِّن بها المرأة كتِفها أو خَصْرها.»"
          source: "المورد الحديث"
    - lemma: "باقة"
      confirm:
        - text: "«باقة [مفرد]: ج باقات: حزمة من البقل، ويُطلقها المحدثون على الضميمة من الزّهر وعلى الحزمة من كلّ شيء»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«بَاقَة: bouquet»"
          source: "المعجم الطبي الموحد (2009)"
    - lemma: "طاقة ورد"
      confirm:
        - text: "«الصواب والرتبة: -طاقة ورد [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
    - lemma: "طاقة"
      confirm:
        - text: "«الطَّاقةُ: شعبةٌ أو حزمةٌ من ريحان, أو زهر, أو شعر, أو عيدان, أو خيوط, أو حبال»"
          source: "المعجم الوسيط"

