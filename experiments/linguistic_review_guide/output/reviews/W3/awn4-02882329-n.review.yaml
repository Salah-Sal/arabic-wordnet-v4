      evidence_assessment:
        case: mixed
    - lemma: "طَاقَةُ زَهْرٍ"
      source: stage1
      decision: removed
      decision_reason: "تم الاستعاضة عنها بـ 'طاقة ورد' الأكثر تداولاً فصاحةً وشيوعاً حسب المعاجم، ولتجنب تكديس المرادفات المتقاربة جداً."
