          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حُزْمَةٌ مِنَ الزُّهُورِ تُنَسَّقُ بِمَهَارَةٍ لِتُقَدَّمَ هَدِيَّةً أَو تُسْتَعْمَلَ لِلزِّينَةِ."

