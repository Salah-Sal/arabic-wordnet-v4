# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13869437-n
# المفهوم: المركز الخامس (fifth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «الخامس» بدون تشكيل كامل"
      - "المجموعة تحوي لمّة واحدة فقط، وهو أمر طبيعي لعدد ترتيبي"
      - "التعريف العربي يستخدم لفظ «الخامس» لتعريف المفهوم ذاته (دوران جزئي)"
    observations: >
      المفهوم عدد ترتيبي بسيط (الخامس)، وهو من المفاهيم الأساسية في كل لغة.
      العربية تشتق الأعداد الترتيبية من ٣ إلى ١٠ على وزن فَاعِل (ثالث، رابع، خامس...).
      المجموعة الفائقة هي «درجة / رتبة» (المكانة النسبية) وهي مناسبة.
      لا يُتوقع وجود مرادفات حقيقية لعدد ترتيبي، فالترادف في الأعداد نادر جداً.
  blind_candidates:
    - lemma: "خَامِسٌ"
      generation_method: ishtiqaq
      justification: >
        العدد الترتيبي المشتق من الجذر خ م س على وزن فَاعِل، وهو الوزن القياسي
        للأعداد الترتيبية من ٣ إلى ١٠ في العربية. هذا هو اللفظ الأصلي بدون أداة التعريف.
    - lemma: "خَامِسَةٌ"
      generation_method: ishtiqaq
      justification: >
        المؤنث من «خامس»، يُستعمل عند إسناد الرتبة إلى مؤنث
        (المرتبة الخامسة، الجولة الخامسة). صيغة اشتقاقية من نفس الجذر.
    - lemma: "خُمَاسِيٌّ"
      generation_method: ishtiqaq
      justification: >
        صفة نسبية من «خمسة» على وزن فُعَالِيّ، تدل على ما يتعلق بالخمسة
        أو ما بلغ خمسة. لكنها تدل على النسبة لا على الترتيب.
    - lemma: "المَقَامُ الخَامِسُ"
      generation_method: tarkib
      justification: >
        مركب وصفي (المقام + الخامس) يدل على الموضع الخامس في سلسلة.
        لكنه عبارة وصفية حرة لا مصطلح مسكوك.

stage2_evidence:
  per_lemma:
    - lemma: "الخَامِسُ"
      confirm:
        - text: "«الذى يَلِى الرّابِعَ فى الرُّتْبَةِ والعَدَدِ»"
          source: "المعجم الكبير"
        - text: "«جاءَ فلانٌ خامِسًا وخامِيًا»"
          source: "المعجم الكبير (شاهد استعمالي)"
        - text: "«(1) خامس the fifth day … (3) الخامس the fifth of May»"
          source: "المورد الحديث"
      expands:
        - text: "«Quint (quintus)»"
          source: "المعجم الطبي الموحد"
          addition: "يُستعمل في السياق الطبي بمعنى الخامس (quintus)"
        - text: "«مَضَى ثلاثُ سِنِينَ مُنْذُ حَلَّ بها *** وعامَ حُلَّتْ وهذا التابعُ الخامِى»"
          source: "المعجم الكبير (شعر الحادرة)"
          addition: "صيغة «خامي» لغة في «خامس» بإبدال السين ياءً"
    - lemma: "خَامِسٌ"
      source: stage1
      confirm:
        - text: "«خَامِس من (خ م س) الآخذ خمس المال، ومن يصير خامس القوم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الذى يَلِى الرّابِعَ فى الرُّتْبَةِ والعَدَدِ»"
          source: "المعجم الكبير"
    - lemma: "خَامِسَةٌ"
      source: stage1
      confirm:
        - text: "«خامسة(ال..) — fifth»"
          source: "مسرد الفن والتسلية والرياضة (أليكسو)"
    - lemma: "خُمَاسِيٌّ"
      source: stage1
      contradicts:
        - text: "«الْخُمَاسِيُّ وَالْخُمَاسِيَّةُ: الْوَصِيفُ وَالْوَصِيفَةُ طُولُهُ خَمْسَةُ أَشْبَارٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "خُماسي يدل على ما بلغ خمسة (نسبة) لا على الترتيب الخامس"
    - lemma: "المَقَامُ الخَامِسُ"
      source: stage1
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الخَامِسُ"
      decision: confirmed
      decision_reason: >
        لفظ فصيح مطّرد، وهو العدد الترتيبي القياسي من الجذر خ م س على وزن فَاعِل
        مع أداة التعريف. شواهده وفيرة في المعاجم الكلاسيكية والحديثة.
        التعريف في المعجم الكبير مطابق تماماً لدلالة المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الخَامِسُ"

    - lemma: "خَامِسٌ"
      source: stage1
      decision: removed
      decision_reason: >
        هو نفس اللمّة الموجودة «الخامس» بدون أداة التعريف. لا حاجة لإضافة
        صيغة نكرة مستقلة لأن الفرق بينهما صرفي فقط (التعريف والتنكير)
        وليس دلالياً. المدخل الموجود يغطي الاستعمالين.

    - lemma: "خَامِسَةٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المؤنث من «خامس» يُستعمل صفةً لموصوف مؤنث (الجولة الخامسة)
        وليس اسماً مستقلاً يدل على المركز الخامس. لا يصلح لمّةً مستقلة لهذه المجموعة.

    - lemma: "خُمَاسِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        يدل على النسبة إلى الخمسة (ما بلغ خمسة أو ما يتكون من خمسة أجزاء)
        لا على الرتبة الخامسة. دلالته مختلفة عن مفهوم المجموعة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "المَقَامُ الخَامِسُ"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة وليس مصطلحاً مسكوكاً. يمكن إبدال «المقام» بـ«المركز»
        أو «المنزلة» أو «الدرجة» فيبقى المعنى صالحاً، مما يثبت أنه ليس وحدة معجمية ثابتة
        (فشل اختبار السكّ).
      evidence_assessment:
        case: no_material

