# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11316269-n  |  ILI: i96893
# Josh Billings / Henry Wheeler Shaw — US humorist (1818-1885)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "جميع اللمّات الموجودة أسماء أعلام أجنبية معرَّبة فقط — المجموعة تمثّل شخصاً تاريخياً بعينه ولا مجال لاشتقاق عربي أصيل"
      - "وصف الصنف الصرفي pos مضبوط على n بينما الأدق proper_noun على مستوى المداخل"
      - "اللمّة 'شو' قائمة على الاسم الأخير (Shaw) وحده، وهي قصيرة وغامضة وتتعارض مع مادة عربية كلاسيكية (شو/شوش = ناقة سريعة)"
      - "جميع اللمّات خالية من التشكيل الكامل المطلوب"
    observations: >
      المجموعة خاصة بشخص تاريخي أمريكي فكاهي (1818-1885)، وهو ما يقتضي حصر المداخل في
      تعريبات الاسم وأشكاله المختلفة. التحدي الأبرز في توليد المرشحين اعتماداً على التعريف
      المُقنَّع وحده هو انعدام القرائن الاسمية — إذ لا يمكن استنتاج اسم علم بعينه من مجرد
      وصف مهنة الشخص وفترته الزمنية؛ غير أن تضييق نطاق الفكاهيين الأمريكيين الكاتبين
      عن الحياة الريفية في النصف الثاني من القرن التاسع عشر يُعيّن بضعة أسماء محتملة.

  blind_candidates:
    - lemma: "جُوش بيلينجز"
      generation_method: taarib
      justification: >
        تعريب بديل للاسم المستعار Josh Billings مع الجيم بدل الغين في نهاية الثانية؛
        اصطلاح تعريب Billings متذبذب في المراجع العربية بين (بيلينغز) و(بيلينجز)،
        والصيغتان مقبولتان صوتياً.
    - lemma: "مارك توَين"
      generation_method: taarib
      justification: >
        تخمين مبني على وصف "فكاهي أمريكي كتب عن الحياة الريفية في القرن التاسع عشر"؛
        مارك توين (1835–1910) أشهر من يحمل هذا الوصف في الوعي العربي، وإن كانت تواريخه
        لا تطابق التعريف تماماً.
    - lemma: "أرتيماس وارد"
      generation_method: taarib
      justification: >
        تعريب Artemus Ward (1834–1867)، كاتب فكاهي أمريكي من الحقبة ذاتها اشتهر بالكتابة
        عن الحياة الريفية بالتهجئة الخاطئة المتعمَّدة — أسلوب يُشابه أسلوب جوش بيلينغز
        ويجمعهما التأثير المتبادل.
    - lemma: "هنري شو"
      generation_method: taarib
      justification: >
        تعريب مختصر لاسم Henry Shaw دون الاسم الأوسط Wheeler؛ يُحتمل أن يكون الشخص
        المقصود من عائلة Shaw المشهورة بالكتابة في القرن التاسع عشر.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات مُنفَّذة:
# [1] مطابقة دفعية: جوش بيلينغز، شو، هنري ويلر شو + مكوّنات + مرشحات المرحلة ١
# [2] جسر إنجليزي: Shaw, Josh Billings, Henry Wheeler Shaw, humorist, rural
# [3] بحث FTS عربي: فكاهي، ساخر، هزلي، فكاهة، كاتب ساخر
stage2_evidence:
  per_lemma:
    - lemma: "جوش بيلينغز"
      evidence_status: "no_material_found"

    - lemma: "شو"
      contradicts:
        - text: >
            «الشين والواو شوشو ناقةٌ شَوْشَاةٌ وشَوْشَاءُ يَعْنِي سريعةً
            فأمَّا قولُ الأَسْوَدِ: على ذات لَوْثٍ أو بِأهْوَجَ شَوْشَوٍ
            صَنيعٍ نبيلٍ يملأ الرَّحْل كاهلُه»
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي"
          conflict: >
            اللفظ 'شو' في التراث العربي مرتبط بمادة لغوية أصيلة (وصف الناقة السريعة
            والشدة)، مما يُوجد تداخلاً اشتراكياً مضلِّلاً مع استخدامه اسم علم أجنبي

    - lemma: "هنري ويلر شو"
      evidence_status: "no_material_found"

    - lemma: "جُوش بيلينجز"
      evidence_status: "no_material_found"

    - lemma: "مارك توَين"
      evidence_status: "no_material_found"

    - lemma: "أرتيماس وارد"
      evidence_status: "no_material_found"

    - lemma: "هنري شو"
      expands:
        - text: "«هنري: Henry — وحدة الحث»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: >
            الكلمة 'هنري' مُوظَّفة في المعاجم العربية الحديثة وحدةً فيزيائية للحث
            الكهرومغناطيسي (نسبةً للعالم جوزيف هنري)، وهو تداخل اصطلاحي ينبغي مراعاته
            عند توظيف 'هنري شو' منفرداً بلا سياق مُميِّز


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "جوش بيلينغز"
      decision: confirmed
      decision_reason: >
        الاسم المستعار (pen name) الأشهر عالمياً لهذا الشخص في الموسوعات والمصادر الأدبية؛
        يُوفّر التعريف الأكثر فورية وشيوعاً لهذه المجموعة الترادفية ويعمل الهوية الإبداعية
        الأولى للشخص. لا أدلة معجمية مباشرة (كما هو متوقع لاسم علم أجنبي)، غير أن
        انعدام الأدلة لا يقدح في الصحة هنا.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم المستعار الأدبي — يُستخدم في السياقات الأدبية والثقافية والموسوعية العامة
        باعتباره الهوية الإبداعية المُتَعارَف عليها دولياً
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُوش بيلينغز"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    - lemma: "شو"
      decision: removed
      decision_reason: >
        الاسم الأخير Shaw وحده غير كافٍ لتمييز هذا الشخص عن سواه ممن يحملون اللقب ذاته؛
        أضف إلى ذلك تعارضه مع مادة عربية كلاسيكية أصيلة (شو/شوشاء = ناقة سريعة) فيُوجد
        اشتراكاً لفظياً مضلِّلاً يُضعف قابلية الاستخدام في نظام معجمي. الصيغة الكاملة
        'هنري ويلر شو' تُغني عنه وتُزيل الغموض.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "هنري ويلر شو"
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل للشخص؛ ضروري للتعريف الموثوق في السياقات التاريخية والتوثيقية
        وللتمييز الدقيق بين الشخص الفعلي واسمه المستعار. يُكمل لمّة 'جوش بيلينغز' ولا
        يتعارض معها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم القانوني الرسمي — يُستخدم في السياقات التاريخية والأكاديمية والتوثيقية
        لتحديد هوية الشخص الحقيقية بمعزل عن الاسم الأدبي المستعار
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِنري وِيلر شو"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    - lemma: "جُوش بيلينجز"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب بديل للاسم الموجود أصلاً بصيغة 'جوش بيلينغز' — التمييز بين الغين والجيم
        في نهاية Billings لا يُمثّل فارقاً دلالياً بل اختياراً صوتياً. إضافة صيغتين
        متوازيتين للاسم المستعار نفسه يُضخّم المجموعة دون إفادة.

    - lemma: "مارك توَين"
      source: stage1
      decision: removed
      decision_reason: >
        اسم شخص مختلف كلياً — مارك توين (Samuel Langhorne Clemens, 1835–1910) وليس
        جوش بيلينغز (1818–1885). التخمين لم يصب.

    - lemma: "أرتيماس وارد"
      source: stage1
      decision: removed
      decision_reason: >
        اسم شخص آخر — Artemus Ward (Charles Farrar Browne, 1834–1867)، كاتب فكاهي
        مختلف من الحقبة ذاتها. التشابه الأسلوبي لا يُبرر الدمج.

    - lemma: "هنري شو"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مبتورة من الاسم الكامل 'هنري ويلر شو' الموجود في المجموعة — إضافتها تتسبب
        في تكرار جزئي غير مُفيد، فضلاً عن التداخل مع وحدة الحث الفيزيائية (هنري).


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "فكاهي من الولايات المتحدة كتب عن الحياة الريفية (1818-1885)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مبتور: لا يُشير إلى الاسم المستعار الأشهر (جوش بيلينغز) ولا إلى
        أسلوب الكتابة المميّز القائم على التهجئة الخاطئة المتعمَّدة؛ جاء ترجمةً حرفية
        للتعريف الإنجليزي دون صياغة موسوعية تُثري المعنى.
    authored:
      - type: encyclopedic
        text: >
          كاتب فكاهي أمريكي (1818–1885)، اشتُهر باسمه المستعار جُوش بيلينغز، عُرف
          بمقالاته الساخرة في وصف الحياة الريفية والحكمة الشعبية، وبأسلوبه الأدبي
          الفريد القائم على التهجئة الخاطئة المتعمَّدة ومحاكاة لهجة العامة.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            كاتب فكاهي أمريكي (1818–1885)، اشتُهر باسمه المستعار جُوش بيلينغز، عُرف
            بمقالاته الساخرة في وصف الحياة الريفية والحكمة الشعبية، وبأسلوبه الأدبي
            الفريد القائم على التهجئة الخاطئة المتعمَّدة ومحاكاة لهجة العامة.

  examples:
    per_lemma:
      - lemma: "جُوش بيلينغز"
        examples:
          - text: >
              يُعدّ جُوش بيلينغز من أبرز أسماء الفكاهة الريفية في أمريكا القرن التاسع
              عشر، وقد أتقن فنّ السخرية من البساطة الريفية بأسلوب تهجئة خاطئة مقصودة
              أضحى علامته الأسلوبية الفارقة.
            type: usage
      - lemma: "هِنري وِيلر شو"
        examples:
          - text: >
              وُلد هِنري وِيلر شو عام 1818 في مانشستر بولاية ماساتشوستس، وكرّس قلمه
              لرصد ملامح الحياة الريفية الأمريكية ونقدها بأسلوب فكاهي ساخر حتى وفاته
              عام 1885.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            يُعدّ جُوش بيلينغز من أبرز أسماء الفكاهة الريفية في أمريكا القرن التاسع
            عشر، وقد أتقن فنّ السخرية من البساطة الريفية بأسلوب تهجئة خاطئة مقصودة
            أضحى علامته الأسلوبية الفارقة.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            وُلد هِنري وِيلر شو عام 1818 في مانشستر بولاية ماساتشوستس، وكرّس قلمه
            لرصد ملامح الحياة الريفية الأمريكية ونقدها بأسلوب فكاهي ساخر حتى وفاته
            عام 1885.


