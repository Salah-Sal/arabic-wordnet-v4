stage2_evidence:
  per_lemma:
    - lemma: "إرنست فيرنر فون سيمنز"
      evidence_status: "no_material_found"
      # لا يوجد مدخل معجمي يطابق الاسم الكامل كعَلَم شخصي في القاعدة

    - lemma: "سيمنز"
      expands:
        - text: "«سيمنز؛ وحدة قياس الموصلية»"
          source: "موسوعة الكهرباء IEC 60050 (Electropedia)"
          addition: >
            تُثبت هذه الوثيقة أن الصيغة العربية المعتمدة في معجم كهربائي دولي
            هي 'سيمنز' (بسين+يم+نون+زاي)، وهي مسمّاة نسبةً إلى المهندس نفسه
            صاحب هذه المجموعة. يُعزز ذلك صحة الرسم الإملائي للقب العائلي.
        - text: "«سِيمَنْس (وَحْدَةُ المُوَصِّلِيَّةِ فِي النِّظَامِ الدُّوَلِيّ)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُثبت ورود صيغة بديلة 'سيمنس' (بسينين) في المعجم الطبي الموحد،
            مما يؤكد تعدد صيغ التعريب ويُرجِّح الحاجة إلى التوحيد.
        - text: "«مو (=سِيمَنْس)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يكشف أن 'مو' (mho) هو الاسم القديم لوحدة 'سيمنس'، مما يدل على أن
            'سيمنس/سيمنز' ترسّخت كمصطلح كهربائي موحَّد في المعجمية العربية الحديثة.

    - lemma: "وِيرنِر فُون زِيمِنس"
      evidence_status: "no_material_found"

    - lemma: "زِيمِنس"
      expands:
        - text: "«داءُ فِيرنر-هِيس (حُمَّى الخَنادِق)» — Werner-His disease"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُثبت أن 'فيرنر' هو التعريب العربي المستقر للاسم الألماني Werner
            في السياق الطبي-العلمي، مما يُرجِّح أن 'سيمنز/زيمنس' كلتيهما مقبولتان.
      contradicts:
        - text: "«مُتَلاَزِمَةُ كريست-سيمنز-توراين»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >
            يُبيّن أن 'سيمنز' (في المتلازمة الطبية) تشير إلى طبيب آخر اسمه Siemens
            لا إلى المهندس إرنست فيرنر؛ مما يكشف عن اشتراك لفظي محتمل بين اللمّتين.

    - lemma: "إِرنِسْت وِيرنِر فُون زِيمِنس"
      evidence_status: "no_material_found"

    - lemma: "فُون زِيمِنس"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١: الاسم الكامل ──────────────────
    - lemma: "إرنست فيرنر فون سيمنز"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخص هو الصيغة الرئيسية في كل مصدر أكاديمي وتاريخي يتناول
        هذه الشخصية. لا بديل اشتقاقياً أو مجازياً عن الأعلام الشخصية؛ التعريب هو
        الوسيلة الوحيدة. يجب إبقاؤه مع إضافة التشكيل الكامل وتصحيح نهاية اللمّة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل الرسمي المتضمن الاسم الأول (إرنست) والاسم الأوسط (فيرنر)
        ولقب النبالة (فون) والاسم العائلي (سيمنز)؛ يُستخدم في السياقات الأكاديمية
        والتوثيقية الرسمية لتمييز هذه الشخصية عن غيرها من حاملي اللقب ذاته.
      morphology_check: >
        تعريب مركّب من أربعة عناصر أجنبية: إرنست (Ernst) + فيرنر (Werner) +
        فون (von، لقب نبالة) + سيمنز (Siemens). الوزن الصرفي العربي لا ينطبق
        على الأعلام الأجنبية المعرَّبة. الصيغة سليمة.
      borrowing_check:
        lexical_borrowing: "معرَّب (مقبول) — علم أجنبي مُعرَّب بالحروف العربية"
        blind_calque: "لا ينطبق — اسم علم لا يقبل الترجمة"
        conceptual_calque: "لا ينطبق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِرْنِسْت فِيرْنِر فُون سِيمِنْز"

    # ── اللمّة الموجودة ٢: اللقب العائلي ─────────────────
    - lemma: "سيمنز"
      decision: confirmed
      decision_reason: >
        اللقب العائلي المختصر (Siemens) هو الصيغة الأكثر شيوعاً في المراجع العربية
        العامة والتقنية. الأدلة المعجمية تُثبت ترسُّخه في المعجمية الكهربائية
        والطبية العربية. يُحتاج إلى تشكيل وتوحيد الرسم الإملائي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم المختصر (اللقب العائلي فقط)؛ يُستخدم في المراجع العامة والمصطلحات
        العلمية غير الرسمية، وفي تسمية الشركة والوحدة الكهربائية المنسوبة إليه.
        يتعايش مع صيغة 'سيمنس' (ذات السينين) في بعض المصادر.
      morphology_check: >
        لفظة أحادية مُعرَّبة من Siemens، تقبل التعريف بـ 'ال' والنسبة (السيمنزي)
        والتنوين في الضرورة. رسمها الأقرب للنطق الألماني 'سِيمِنْز' بسين+ياء+ميم+نون+زاي.
      borrowing_check:
        lexical_borrowing: "معرَّب (مقبول) — لقب عائلي ألماني مُعرَّب"
        blind_calque: "لا ينطبق — اسم علم"
        conceptual_calque: "لا ينطبق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِيمِنْز"

    # ── مرشح المرحلة ١ أ: وِيرنِر فُون زِيمِنس ───────────
    - lemma: "وِيرنِر فُون زِيمِنس"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة تستخدم 'و' لبداية Werner، وهو تعريب غير شائع في المصادر
        العربية التي تُجمع على 'فيرنر' (بالفاء)، بما فيها المعجم الطبي الموحد
        ('داء فيرنر-هيس'). كذلك تستخدم 'زيمنس' بالزاي بدلاً من 'سيمنز' الراسخة
        في Electropedia. الصيغة الموجودة 'إرنست فيرنر فون سيمنز' أصح وأشيع.

    # ── مرشح المرحلة ١ ب: زِيمِنس ─────────────────────────
    - lemma: "زِيمِنس"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن 'زيمنس' أقرب للنطق الألماني، إلا أن الصيغة المعتمدة في
        Electropedia (المعجم الكهربائي الدولي المرجعي) هي 'سيمنز' بالسين لا الزاي.
        إضافة بديل تعريبي ثانٍ سيزيد التشتت الإملائي. يُكتفى بـ 'سيمنز'.

    # ── مرشح المرحلة ١ ج: إِرنِسْت وِيرنِر فُون زِيمِنس ──
    - lemma: "إِرنِسْت وِيرنِر فُون زِيمِنس"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح يجمع خطأين: 'وِيرنِر' بالواو بدلاً من 'فِيرنِر' المعتمدة،
        و'زِيمِنس' بالزاي بدلاً من 'سِيمِنْز'. الشكل الموجود 'إرنست فيرنر فون سيمنز'
        أصح وسيُصحَّح تشكيله في المرحلة ٣.

    # ── مرشح المرحلة ١ د: فُون زِيمِنس ────────────────────
    - lemma: "فُون زِيمِنس"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة جزئية تحذف الاسم الأول والاسم الأوسط وتبقي على لقب النبالة والاسم
        العائلي فقط؛ ليست معتمدة في المراجع العربية ولا في قواعد المعجميات للتعبير
        عن شخصية بعينها. اللمّتان الموجودتان (الاسم الكامل + اللقب المختصر) تكفيان.


