# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. التوليد الأعمى من synset_info_masked.yaml
  # (التعريف فقط: "مهندس كهربائي ألماني (1816-1892)"، بدون لمّات)
  blind_candidates:
    - lemma: "وِيرنِر فُون زِيمِنس"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم الألماني Werner von Siemens مع مراعاة النطق الألماني الأصيل:
        الحرف W يُعرَّب بالواو (و)، وثنائية 'ie' تُقرأ ياءً مطوّلة فتصبح 'ي'،
        والنهاية الألمانية s تُكتب سيناً (س). الاسم يصف مهندساً ألمانياً بارزاً
        من تلك الحقبة (1816-1892) يُعرف في المراجع التقنية بهذا الاسم المختصر.

    - lemma: "زِيمِنس"
      generation_method: taarib
      justification: >
        تعريب للقب العائلي Siemens وفق قواعد الصوتيات الألمانية: S أول الكلمة
        تُنطق z فتُعرَّب بالزاي (ز)، و'ie' تصبح ياءً، والنهاية s تُكتب سيناً.
        الصيغة المختصرة (اللقب فقط) تُستخدم عادةً في المراجع الاصطلاحية العلمية.

    - lemma: "إِرنِسْت وِيرنِر فُون زِيمِنس"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل Ernst Werner von Siemens مع مزج الاصطلاحين: استخدام
        'وِيرنِر' (بالواو) بدلاً من 'فِيرنِر' (بالفاء) لأن الألمانية لا تملك
        مقابلاً للفاء في هذا الموضع. هذه الصيغة تُوثَّق في السياقات الأكاديمية
        والتاريخية التي تشترط ذكر الاسم الكامل.

    - lemma: "فُون زِيمِنس"
      generation_method: taarib
      justification: >
        تعريب اللقب الأسري المركب von Siemens؛ 'فُون' لقب نبالة ألماني يدلّ
        على الأصل الأرستقراطي. بعض المراجع التاريخية تُعرِّف الشخصية بهذا
        الشكل المختصر (اللقب الأرستقراطي + اسم العائلة) لتمييزه عن أقاربه
        الذين يشتركون في الاسم الأول.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "غياب التشكيل الكامل على اللمّتين الموجودتين: 'إرنست فيرنر فون سيمنز' و'سيمنز'، مما يُعسِّر ضبط النطق الدقيق."
      - "اللمّة 'سيمنز' مشتركة لفظياً بين اسم الشخص ووحدة قياس الموصلية الكهربائية (siemens) المسمّاة باسمه — وهذا اشتراك لفظي يستوجب التوثيق."
      - "عدم اتساق التعريب: تُستخدم 'سيمنز' (بسين وزاي) في Electropedia، و'سيمنس' (بسينين) في المعجم الطبي الموحد؛ ينبغي توحيد الصيغة."
      - "التصنيف الصرفي للمدخل الرئيسي يستحق مراجعة: هل يجب أن يكون pos=proper_noun بدلاً من pos=n على مستوى المدخل المعجمي؟"
      - "التعريف الحالي مقتضب جداً: 'مهندس كهربائي ألماني (1816-1892)' يخلو من أي إشارة إلى أبرز إسهاماته."
    observations: >
      هذه المجموعة تُخصَّص لشخصية تاريخية هي إرنست فيرنر فون سيمنز (Ernst Werner von Siemens)،
      مهندس كهربائي وصناعي ألماني بارز (1816-1892)، مؤسس شركة سيمنز، وأحد رواد تطوير
      التلغراف الكهربائي. اللمّتان صحيحتان من حيث المضمون: الأولى هي الاسم الكامل الرسمي
      والثانية هي اللقب العائلي المختصر. كلتاهما تعريب (taarib) لا اشتقاق.
      المشكلة الأبرز هي غياب التشكيل وتعدد صيغ الكتابة في المصادر العربية.


