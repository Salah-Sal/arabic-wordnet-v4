# مراجعة المجموعة الترادفية — awn4-13870663-n (sixteenth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «السادس عشر» مخزّنة بدون تشكيل، والعدد المركب يحتاج ضبطاً دقيقاً لكون جزأيه مبنيَّين على الفتح"
      - "المجموعة تحتوي على لمّة واحدة فقط ولا تتيح تمييزاً ترادفياً"
      - "التعريف العربي ترجمة حرفية للإنجليزي ويحتاج صياغة معجمية أصيلة"
    observations: "المفهوم عدد ترتيبي مركّب بسيط (السادسَ عشرَ)، وهو من الأعداد المركّبة من 11 إلى 19 التي تُبنى على فتح الجزأين في الفصحى. نطاق التوليد ضيّق جداً لأن العربية لا تملك إلا صيغة واحدة ثابتة للأعداد الترتيبية المركّبة."
  blind_candidates:
    - lemma: "السَّادِسَ عَشَرَ"
      generation_method: tarkib
      justification: "الصيغة الترتيبية المركّبة الفصيحة للعدد 16، مبنية على فتح الجزأين وفق القاعدة النحوية للأعداد المركّبة"
    - lemma: "سَادِسَ عَشَرَ"
      generation_method: tarkib
      justification: "صيغة نكرة من العدد الترتيبي المركّب، تُستعمل في سياقات الإضافة والحال"
    - lemma: "السَّادِسَةَ عَشْرَةَ"
      generation_method: tarkib
      justification: "صيغة المؤنث من الترتيبي المركّب، تُستعمل مع المعدود المؤنث كالدرجة والمرتبة"
    - lemma: "سُدَاسِيَّ عَشْرِيّ"
      generation_method: ishtiqaq
      justification: "محاولة اشتقاق صفة نسبية على وزن فُعالِيّ من الجذر سدس مع نسبة إلى عشر — تركيب غير مسكوك ولا يُستعمل في العربية لهذا المعنى"

stage2_evidence:
  per_lemma:
    - lemma: "السَّادِسَ عَشَرَ"
      confirm:
        - text: "«السَّادِسُ عَشَرَ — الجذر: س د س — مثال: جَاء اليومُ السادِسُ عَشَرَ — الصواب والرتبة: جاء اليومُ السادِسَ عَشَرَ [فصيحة] — جاء اليومُ السادِسُ عَشَرَ [صحيحة] — التعليق: القاعدة السائدة أنَّ الأعداد المركَّبة، من 11 إلى 19، وكذلك الأوصاف منها تُبْنَى على فتح الجزأين»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«(1) السادس عَشَر (2) جزء من ستةَ عشَر (1/16) (3) العضو السادس عشَر [في مجموعة]»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«السَّادِسِ عَشَرَ — مثال: سيسافر في السادِسِ عَشَرَ من هذا الشهر — الصواب: سيسافر في السَّادِسَ عَشَرَ من هذا الشهر [فصيحة] — يمكن تصحيح المرفوض باعتباره جاء على أحد الوجوه التي ذكرها النحاة في الوصف من العدد المركَّب عندما يضاف إلى لفظ العدد»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يجوز إعراب الجزء الأول حسب موقعه الإعرابي على أحد الوجوه النحوية وإن كان الفتح أفصح"
    - lemma: "سَادِسَ عَشَرَ"
      confirm:
        - text: "«الصواب والرتبة: جاء اليومُ السادِسَ عَشَرَ [فصيحة] — القاعدة السائدة أنَّ الأعداد المركَّبة تُبْنَى على فتح الجزأين»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
    - lemma: "السَّادِسَةَ عَشْرَةَ"
      evidence_status: "no_material_found"
    - lemma: "سُدَاسِيَّ عَشْرِيّ"
      evidence_status: "no_material_found"

