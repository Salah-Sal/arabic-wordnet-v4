stage1_review:
  assessment:
    concerns:
      - "اللمّة الحاليّة تفتقر إلى التشكيل الكامل."
      - "اسم المدينة (Hangzhou) له عدّة صيغ تعريب شائعة (هانغتشو، هانغجو، هانتشو)، ويجب اختيار الأدق أو توفير البدائل."
    observations: "المجموعة تخص مَعلماً جغرافياً محدداً (Proper Noun)، والتعريف الحالي ترجمة حرفية للتعريف الإنجليزي."
  blind_candidates:
    - lemma: "خَلِيج هَانْغتشُو"
      generation_method: taarib
      justification: "التعريب الأكثر شيوعاً ودقة لاسم المدينة Hangzhou مع إضافة لفظ 'خليج'."
    - lemma: "خَلِيج هَانْغجُو"
      generation_method: taarib
      justification: "صيغة تعريب بديلة لاسم المدينة تُستخدم في بعض المراجع."
    - lemma: "خَلِيج هَانْتشُو"
      generation_method: taarib
      justification: "صيغة تعريب مختصرة شائعة في الصحافة العربية."
    - lemma: "جَوْن هَانْغتشُو"
      generation_method: tarkib
      justification: "استخدام لفظ 'جون' كمرادف لـ 'خليج' في السياق الجغرافي."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيج هَانْغتشُو"
      confirm:
        - text: "«بحر الصين الشرقي: يقع خليج هانغتشو في مقاطعة تشيجيانغ الصينية ويتصل بهذا البحر.»"
          source: "المكنز الزراعي (استدلالي من ذكر الموقع والجغرافيا)"
      expands:
        - text: "«الخاء واللام والجيم أصل واحد يدل على لي وفتل وقلة استقامة. فمن ذلك الخليج، وهو ماء يميل ميلة عن معظم الماء فيستقر.»"
          source: "مقاييس اللغة"
          addition: "يوضح الدلالة اللغوية لكلمة 'خليج' كونه انحرافاً عن المسار الرئيسي للماء."
    - lemma: "خَلِيج هَانْغجُو"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خليج هانغتشو"
      decision: confirmed
      decision_reason: "هو المصطلح الجغرافي المعتمد لهذا المعلم باللغة العربية، والتشكيل ضروري لضبط النطق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيج هَانْغتشُو"
    - lemma: "خَلِيج هَانْغجُو"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة تعريب بديلة مقبولة وشائعة لاسم العلم الصيني."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "خَلِيج هَانْغجُو", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "خليج يتشكل من مدخل لبحر الصين الشرقي"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويفتقر إلى المعلومات الجغرافية التي تميز هذا الخليج تحديداً."
    authored:
      - type: encyclopedic
        text: "جَوْنٌ عَظِيمٌ يَتَفَرَّعُ مِنْ بَحْرِ الصِّينِ الشَّرْقِيِّ تَقَعُ عَلَيْهِ مَدِينَةُ هَانْغتشُو الصِّينِيَّةُ، وَيَشْتَهِرُ بِفَوْرَةِ مَدِّهِ العَنِيفَةِ الَّتِي تَنْدَفِعُ فِي مَصَبِّ نَهْرِ تْشِيَانْتَانْغ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "جَوْنٌ عَظِيمٌ يَتَفَرَّعُ مِنْ بَحْرِ الصِّينِ الشَّرْقِيِّ تَقَعُ عَلَيْهِ مَدِينَةُ هَانْغتشُو الصِّينِيَّةُ، وَيَشْتَهِرُ بِفَوْرَةِ مَدِّهِ العَنِيفَةِ."}

  examples:
    per_lemma:
      - lemma: "خَلِيج هَانْغتشُو"
        examples:
          - text: "يَمْتَدُّ جِسْرُ خَلِيجِ هَانْغتشُو لِيَرْبِطَ بَيْنَ نِينْغْبُو وَشَنْغَهَاي مُخْتَصِراً مَسَافَاتٍ طَوِيلَةً."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "تُعَدُّ فَوْرَةُ الْمَدِّ فِي خَلِيجِ هَانْغتشُو ظَاهِرَةً طَبِيعِيَّةً فَرِيدَةً تَجْذِبُ السُّيَّاحَ سَنَوِيّاً."}

stage5_enrichment:
  per_entry:
    - lemma: "خَلِيج هَانْغتشُو"
      entry_id: "{auto}"
      roots:
        - word: "خَلِيج"
          root: "خلج"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ. فَمِنْ ذَلِكَ الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ.»"
        - word: "هَانْغتشُو"
          root: "تعريب"
          maqayis_quote: "اسم علم أعجمي معرب لمدينة صينية."
  per_sense:
    - lemma: "خَلِيج هَانْغتشُو"
      sense_id: "{auto}"
      nuance: "الاسم الجغرافي الرسمي والأكثر دقة في تعريب Hangzhou."
      mwe: true
    - lemma: "خَلِيج هَانْغجُو"
      sense_id: "{auto}"
      nuance: "صيغة تعريب بديلة لاسم العلم الصيني، أقل شيوعاً في الأطالس الحديثة."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"خَلِيج","root":"خلج","maqayis":"«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ...»"},{"word":"هَانْغتشُو","root":null,"maqayis":"اسم علم أعجمي معرب."}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الجغرافي الرسمي.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
