stage1_review:
  assessment:
    concerns:
      - "استخدام كلمة «شريط» في التعريف الحالي كترجمة لـ (band) يبدو حرفياً ولا يعكس الجانب الجمالي والتركيبي للمفهوم؛ الأنسب استخدام كلمات مثل «طاقة» أو «طوق» أو «إكليل»."
    observations: "المفهوم (wreath/garland) يقابله في العربية التراثية والمعاصرة لفظ «إكليل»، وهو مستقر معجمياً. كما توجد تعابير مركبة تفي بالغرض لوصف أنواع خاصة من الأكاليل."
  blind_candidates:
    - lemma: "إِكْلِيل"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر «كلل» الذي يفيد الإحاطة، وهو الاسم الشائع المعبر عن طوق من الزهور يوضع على الرأس أو يزين به المكان."
    - lemma: "طَوْق زَهْرِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر بدقة عن الشكل الدائري والمادة المصنوع منها المفهوم."
    - lemma: "عِقْد زُهُور"
      generation_method: tarkib
      justification: "مركب إضافي يشير إلى ما يطوق العنق من الأزهار للتزيين، ويطابق مفهوم (lei)."
    - lemma: "ضَفِيرَة زُهُور"
      generation_method: tarkib
      justification: "مركب إضافي يصف طريقة صنع الطوق الدائري عبر تضفير الزهور مع بعضها."

stage2_evidence:
  per_lemma:
    - lemma: "إِكْلِيل"
      confirm:
        - text: "«طاقة من الورود والأزهار على هيئة التاج تكلِّلُ الرأس أو تطوِّق العنق للتزيين»"
          source: "المعجم الوسيط"
        - text: "«شريط يلف حول الجبين أو على الرأس لكن يبقى مفتوحا من الخلف، يصنع من مواد يمكن ضفرها أو من القماش أو من معادن نفيسة ويتم تزيينه في وسط الجبين. ويعود أصل الإكليل كقطعة للزينة إلى مصر القديمة حيث استعمل للدلالة على المكانة الاجتماعية.»"
          source: "مسرد صناعة النسيج، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
    - lemma: "طَوْق زَهْرِيّ"
      evidence_status: "no_material_found"
    - lemma: "عِقْد زُهُور"
      confirm:
        - text: "«(1) اللَّيّ: إكليل أو عقد من الزهور [في هاوايي].»"
          source: "المورد الحديث (2008)"
    - lemma: "ضَفِيرَة زُهُور"
      confirm:
        - text: "«ضفيرة زهور»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"

stage3_analysis:
  per_lemma:
    - lemma: "إِكْلِيل"
      decision: confirmed
      decision_reason: "المصطلح الأصيل والأكثر فصاحة وشيوعاً، ومعناه مدعوم بقوة في المعاجم القديمة والحديثة كطاقة من الزهور على شكل تاج للتزيين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِكْلِيل"

    - lemma: "ضَفِيرَة زُهُور"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير مسكوك معجمياً معتمد في معجم علم الأحياء كترجمة لـ(garland)، وهو دقيق في وصف طريقة الصنع المتشابكة للزهور."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "ضَفِيرَة زُهُور"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04613372-n"

    - lemma: "عِقْد زُهُور"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير مركب معتمد معجمياً (في المورد الحديث) لترجمة مفهوم (lei)، ويناسب تحديداً الأطواق التي تعلق حول العنق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "عِقْد زُهُور"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04613372-n"

    - lemma: "طَوْق زَهْرِيّ"
      source: stage1
      decision: removed
      decision_reason: "المركب غير ثابت معجمياً، كما أن اللمات المعتمدة (إكليل، وضفيرة زهور) تفي بالغرض الدلالي بشكل أدق."

stage4_content:
  definition:
    current: "تنسيق زهور يتكون من شريط دائري من أوراق الشجر أو الزهور لأغراض الزينة"
    assessment:
      decision: revise
      reason: "استخدام «شريط» كترجمة حرفية لا يتناسب مع طبيعة الزهور؛ صياغة التعريف بالاعتماد على «طاقة مضفورة» أقرب للأسلوب المعجمي العربي."
    authored:
      - type: terminological
        text: "طاقةٌ مَضفُورَةٌ من الورودِ والأزهارِ وأوراقِ الشجرِ على هيئةِ تاجٍ أو طَوقٍ، تكلِّلُ الرأسَ أو تطوِّقُ العُنقَ وتُعلَّقُ لأغراضِ الزينةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-04613372-n"
          definition_index: 0
          text: "طاقةٌ مَضفُورَةٌ من الورودِ والأزهارِ وأوراقِ الشجرِ على هيئةِ تاجٍ أو طَوقٍ، تكلِّلُ الرأسَ أو تطوِّقُ العُنقَ وتُعلَّقُ لأغراضِ الزينةِ."

  examples:
    per_lemma:
      - lemma: "إِكْلِيل"
        examples:
          - text: "وُضِعَ إِكْلِيلٌ من الزهورِ على ضريحِ الجنديِّ المجهولِ تكريماً لذكراهُ."
            type: usage
      - lemma: "ضَفِيرَة زُهُور"
        examples:
          - text: "عُلِّقَت ضَفِيرَةُ زُهُورٍ زاهيةٍ على بابِ المنزلِ للترحيبِ بالضيوفِ."
            type: usage
      - lemma: "عِقْد زُهُور"
        examples:
          - text: "استُقبِلَ الزوارُ في الجزيرةِ بتقليدِهِم عُقُودَ زُهُورٍ عطرةٍ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-04613372-n"
          text: "وُضِعَ إِكْلِيلٌ من الزهورِ على ضريحِ الجنديِّ المجهولِ تكريماً لذكراهُ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وُضِعَ إِكْلِيلٌ من الزهورِ على ضريحِ الجنديِّ المجهولِ تكريماً لذكراهُ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "عُلِّقَت ضَفِيرَةُ زُهُورٍ زاهيةٍ على بابِ المنزلِ للترحيبِ بالضيوفِ."
