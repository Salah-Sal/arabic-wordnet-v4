stage1_review:
  assessment:
    concerns:
      - "المدخلات الحالية تفتقر إلى التشكيل الكامل."
      - "قاعدة البيانات المعجمية لا تحتوي على قيود مباشرة لهذا العلم الجغرافي، وهو أمر متوقع للأعلام غير المسماة في المعاجم اللغوية."
    observations: "المصطلحان (بايكال) و(بحيرة بايكال) هما التسميتان القياسيتان في اللغة العربية لهذا العلم الجغرافي."
  blind_candidates:
    - lemma: "بَايْكَال"
      generation_method: taarib
      justification: "التعريب الصوتي المباشر لاسم البحيرة كما هو شائع في المصادر الجغرافية."
    - lemma: "بُحَيْرَة بَايْكَال"
      generation_method: tarkib
      justification: "التركيب الوصفي الإضافي لتحديد طبيعة المَعلم الجغرافي."
    - lemma: "بَيكَال"
      generation_method: taarib
      justification: "صيغة بديلة للتعريب مستخدمة في بعض الأطالس."
    - lemma: "بَحْر بَايْكَال"
      generation_method: tarkib
      justification: "تسمية محلية أو وصفية أحياناً نظراً لضخامة البحيرة وعمقها."

stage2_evidence:
  per_lemma:
    - lemma: "بايكال"
      evidence_status: "no_material_found"
    - lemma: "بحيرة بايكال"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "بايكال"
      decision: confirmed
      decision_reason: "الاسم العلم المعرب والمشهور عالمياً لهذه البحيرة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَايْكَال"
    - lemma: "بحيرة بايكال"
      decision: confirmed
      decision_reason: "الصيغة المركبة الأكثر دقة لتحديد المَعلم الجغرافي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُحَيْرَة بَايْكَال"

stage4_content:
  definition:
    current: "أكبر بحيرة للمياه العذبة في آسيا أو أوروبا وأعمق بحيرة في العالم"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق علمياً لكنه يفتقر إلى الأسلوب المعجمي الجغرافي الذي يحدد الموقع ونوع المَعلم بدقة أكبر."
    authored:
      - type: encyclopedic
        text: "بُحَيْرَةٌ عَظِيمَةٌ تَقَعُ فِي جَنُوبِ سِيبِيرْيَا بِرُوسْيَا، تَعُدُّ أَعْمَقَ بُحَيْرَةٍ فِي الْعَالَمِ وَأَكْبَرَ خَزَّانٍ لِلْمِيَاهِ الْعَذْبَةِ مِنْ حَيْثُ الْحَجْمُ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "بُحَيْرَةٌ عَظِيمَةٌ تَقَعُ فِي جَنُوبِ سِيبِيرْيَا بِرُوسْيَا، تَعُدُّ أَعْمَقَ بُحَيْرَةٍ فِي الْعَالَمِ وَأَكْبَرَ خَزَّانٍ لِلْمِيَاهِ الْعَذْبَةِ مِنْ حَيْثُ الْحَجْمُ."
  examples:
    per_lemma:
      - lemma: "بَايْكَال"
        examples:
          - text: "تَحْتَوِي بُحَيْرَةُ بَايْكَال عَلَى نَحْوِ خُمْسِ مِيَاهِ الْأَرْضِ الْعَذْبَةِ السَّطْحِيَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تُعَدُّ بَايْكَال مَحْمِيَّةً طَبِيعِيَّةً فَرِيدَةً تَعِيشُ فِيهَا أَنْوَاعٌ نَادِرَةٌ مِنَ الْكَائِنَاتِ."

