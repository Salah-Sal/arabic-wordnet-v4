# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-11426137-n  |  ILI: i97534  |  POS: n
# المخترع الألماني الكونت فرديناند فون زيبلين (1838-1917)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل"
      - "هذه المجموعة خاصة بشخص بعينه (اسم علم أجنبي معرَّب)، مما يُقيّد التوليد الاشتقاقي والمجازي ويُحصره في التعريب"
      - "استُخدم اللقب 'كونت' (من الفرنسية/الإنجليزية) بدلاً من اللقب الألماني الأصيل 'غراف'، وهو اختيار شائع في العربية ولكن يستحق التوثيق"
    observations: >
      المجموعة تُمثّل علَماً شخصياً تاريخياً للمخترع الألماني فرديناند فون زيبلين (1838-1917).
      اللمّتان الموجودتان تُغطّيان الاستخدام العربي الشائع: الاسم الكامل مع اللقب، والاسم المختصر.
      نظراً لطبيعة المجموعة — اسم علم أجنبي — فإن التوليد يقتصر على التعريب الصوتي والتنويع بين صيغ الاسم
      (كامل/مختصر، مع اللقب/بدونه). لا مجال للاشتقاق أو المجاز أو التركيب غير الإضافي هنا.
  blind_candidates:
    - lemma: "زِيبِّلِين"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم الألماني Zeppelin؛ راعيت الشدة على الباء مقابل المقطع الثقيل في الألمانية
        (Zep-pe-lin). هذه هي الصيغة الأكثر شيوعاً في المصادر العربية المعاصرة.
    - lemma: "فِرْدِينَانْد فُونْ زِيبِّلِين"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل دون اللقب الأرستقراطي؛ يُستخدم هذا الأسلوب في السياقات العلمية
        والتقنية حين يُراد التركيز على الشخص دون إبراز رتبته.
    - lemma: "الكُونْت فِرْدِينَانْد فُونْ زِيبِّلِين"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل مع اللقب الأرستقراطي بصيغته الفرنسية/الإنجليزية 'Count' المعرَّبة
        'كونت'، وهي الصيغة الشائعة في الموسوعات العربية.
    - lemma: "الكُونْت زِيبِّلِين"
      generation_method: taarib
      justification: >
        صيغة مختصرة تجمع اللقب مع اسم العائلة فقط، نمط متداول في العربية للإشارة إلى الأعلام
        الأوروبية ذات الألقاب الأرستقراطية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت:
# (١) مطابقة دفعية: زيبلين + الزيبلين + الكونت فرديناند فون زيبلين + صيغ المرشحات → لا نتائج
# (٢) جسر إنجليزي: Zeppelin OR dirigible OR Count Ferdinand von Zeppelin → 3 نتائج
# (٣) إثراء بالمعرّف: entry_ids (683643, 730293, 439574) → تعريفات
# (٤) بحث FTS عربي: زيبلين OR زبلن OR زيبلن OR منطاد صلب → لا نتائج إضافية
# (٥) مقاييس اللغة: جذور زبل، زبن، كون → لا صلة للاسم الأجنبي
stage2_evidence:
  per_lemma:
    - lemma: "الكونت فرديناند فون زيبلين"
      evidence_status: "no_material_found"

    - lemma: "زيبلين"
      expands:
        - text: "«مُنْطاد؛ مُنطاد زَبْلِن.»"
          source: "المورد الحديث (2008)"
          addition: >
            يُوثّق المورد الحديث صيغة 'زَبْلِن' كتعريب بديل للفظة Zeppelin بمعنى نوع المنطاد
            المسمّى باسم المخترع — لا يُحيل إلى الشخص مباشرة، لكنه يؤكد ربط الاسم بالمفهوم
            العربي 'مُنطاد'.

    - lemma: "زِيبِّلِين"
      expands:
        - text: "«مُنْطاد؛ مُنطاد زَبْلِن.»"
          source: "المورد الحديث (2008)"
          addition: >
            ذات الدليل السابق؛ 'زبلن' صيغة صوتية مختزلة لنفس الاسم 'زيبلين'،
            تؤكد شيوع الاسم في المعجمية العربية الحديثة.

    - lemma: "فِرْدِينَانْد فُونْ زِيبِّلِين"
      evidence_status: "no_material_found"

    - lemma: "الكُونْت فِرْدِينَانْد فُونْ زِيبِّلِين"
      evidence_status: "no_material_found"

    - lemma: "الكُونْت زِيبِّلِين"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: الاسم الكامل ──
    - lemma: "الكونت فرديناند فون زيبلين"
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل للمخترع في المصادر العربية الموسوعية والأكاديمية. يشمل اللقب الأرستقراطي
        'كونت' (تعريب Count)، والاسم الشخصي 'فرديناند'، والنسبة الألمانية 'فون'، والاسم العائلي
        'زيبلين'. رغم غياب الأدلة المعجمية المباشرة (طبيعي للأعلام الشخصية الأجنبية)، فإن هذه
        الصيغة هي المعيار في المصادر العربية. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الرسمية الكاملة المستخدمة في السياقات الأكاديمية والتاريخية حيث يُراد تعريف
        الشخصية بدقة وتمييزها عن غيرها ممن يحملون الاسم الأخير زيبلين.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الكُونْت فِرْدِينَانْد فُونْ زِيبِّلِين"

    # ── لمّة موجودة: الاسم المختصر ──
    - lemma: "زيبلين"
      decision: confirmed
      decision_reason: >
        الاسم المختصر الشائع في العربية العامة والإعلامية؛ موثّق في المورد الحديث (2008) بصيغة
        مقاربة 'زبلن'. يحتاج تشكيلاً كاملاً مع الشدة على الباء مراعاةً للمقطع الألماني الأصلي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة المختزلة المتداولة في الكتابة العامة والإعلامية؛ يُستخدم الاسم أحياناً كصفة
        لوصف نوع المناطيد (منطاد زيبلين)، لكن في هذه المجموعة يُحيل إلى الشخص بعينه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زِيبِّلِين"

    # ── مرشح المرحلة ١ ──
    - lemma: "زِيبِّلِين"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق تشكيلياً للمّة الموجودة 'زيبلين' بعد التصحيح — لا إضافة معجمية جديدة.

    - lemma: "فِرْدِينَانْد فُونْ زِيبِّلِين"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة ناقصة تحذف اللقب الأرستقراطي الذي هو جزء من الهوية التاريخية الرسمية للشخص.
        لا تُضيف قيمة مع وجود الصيغة الكاملة والمختصرة في المجموعة.

    - lemma: "الكُونْت فِرْدِينَانْد فُونْ زِيبِّلِين"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة الأولى بعد تصحيح التشكيل — لا إضافة.

    - lemma: "الكُونْت زِيبِّلِين"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة هجينة غير معيارية في العربية؛ المصادر العربية تُفضّل إما الاسم الكامل أو
        الاسم الأخير (زيبلين) منفرداً. هذه الصيغة تخلط بين الأسلوبين دون مبرر أسلوبي.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
