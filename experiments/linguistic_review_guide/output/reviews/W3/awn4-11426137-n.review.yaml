        ما يخالف أسلوب تعريف الأعلام في المعجم الوسيط الذي يُصدّر التعريف بالاسم الكامل.
        فضلاً عن ذلك، يمكن إثراؤه بإضافة السياق التاريخي (إسهاماته، المسمّى الذي أُطلق باسمه).
