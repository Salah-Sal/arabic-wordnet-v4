stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر للتشكيل الكامل.
      - اللمة عبارة عن اسم علم جغرافي أجنبي، وهناك تنوع في طرق تعريبه (بازاردز مقابل بوزاردز).
    observations: "المجموعة تشير إلى معلم جغرافي محدد في الولايات المتحدة. التعريب المعتمد في اللمة الحالية مقبول صوتياً، ولكن يحتاج لضبط بالشكل وإضافة بدائل شائعة."
  blind_candidates:
    - lemma: "خَلِيجُ بَازَارْدِز"
      generation_method: tarkib
      justification: "ترجمة (Bay) إلى (خليج) مع تعريب الاسم الأجنبي (Buzzards) صوتياً."
    - lemma: "خَلِيجُ بُوزَارْدِز"
      generation_method: tarkib
      justification: "تعريب بديل للاسم الأجنبي بضمة الباء لتناسب نطق حرف (U) في (Buzzards)."
    - lemma: "جَوْنُ بَازَارْدِز"
      generation_method: tarkib
      justification: "استخدام (جون) كبديل لـ (خليج) للتعبير عن الانبعاج الساحلي الصغير (inlet)."
    - lemma: "خَلِيجُ الصُّقُورِ الجَرَّاحَةِ"
      generation_method: tarkib
      justification: "ترجمة دلالية للاسم (Buzzards) الذي يشير إلى نوع من الصقور."

stage2_evidence:
  per_lemma:
    - lemma: "خليج بازاردز"
      evidence_status: "no_material_found"
    - lemma: "الخَلِيج"
      confirm:
        - text: "«امتدادٌ من مياه البِحارِ أو الأَنْهارِ مُتَوغِّلٌ فى اليابسِ.»"
          source: "المعجم الكبير"
        - text: "«الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ.»"
          source: "مقاييس اللغة"
    - lemma: "بَازَارْدِز"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خليج بازاردز"
      decision: confirmed
      decision_reason: "تعريب مقبول لاسم العلم الجغرافي، مع إضافة التشكيل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ بَازَارْدِز"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "خَلِيجُ بُوزَارْدِز"
    - lemma: "خَلِيجُ بُوزَارْدِز"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة بديلة شائعة لتعريب الاسم (Buzzards) تعتمد ضمة الباء."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "خَلِيجُ بُوزَارْدِز"

stage4_content:
  definition:
    current: "مدخل للمحيط الأطلسي في جنوب شرق ماساتشوستس"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً ويحتاج لتوضيح الطبيعة الجغرافية والتبعية السياسية بشكل أكمل."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ بَحْرِيٌّ يَقَعُ فِي الجَانِبِ الجَنُوبِيِّ الشَّرْقِيِّ لِوِلَايَةِ مَاسَاتْشُوسِتْس الأَمْرِيكِيَّةِ، يَتَّصِلُ بِالمُحِيطِ الأَطْلَسِيِّ وَيُعَدُّ مَمَرًّا مَائِيًّا هَامًّا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَلِيجٌ بَحْرِيٌّ يَقَعُ فِي الجَانِبِ الجَنُوبِيِّ الشَّرْقِيِّ لِوِلَايَةِ مَاسَاتْشُوسِتْس الأَمْرِيكِيَّةِ، يَتَّصِلُ بِالمُحِيطِ الأَطْلَسِيِّ."
  examples:
    per_lemma:
      - lemma: "خَلِيجُ بَازَارْدِز"
        examples:
          - text: "تُعَدُّ مِيَاهُ خَلِيجِ بَازَارْدِز مَقْصِدًا سِيَاحِيًّا هَامًّا لِأَنْشِطَةِ الصَّيْدِ وَالتَّنَزُّهِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يَمْتَدُّ خَلِيجُ بَازَارْدِز عَلَى طُولِ السَّاحِلِ الجَنُوبِيِّ لِمَاسَاتْشُوسِتْس."

