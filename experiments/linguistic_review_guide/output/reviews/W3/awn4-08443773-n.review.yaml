stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل."
      - "التعريف الحالي يحتوي على دوران باشتماله على اللفظ نفسه (تشكيل)."
    observations: "المفهوم يشير إلى التنظيم والترتيب الهيكلي والميداني للقوات المسلحة، ويُعد مصطلح (تشكيل عسكري) مقابلاً اصطلاحياً دقيقاً ومستقراً في الأدبيات العسكرية العربية."
  blind_candidates:
    - lemma: "تَشْكِيلٌ عَسْكَرِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر بدقة عن تنظيم القوات المسلحة في نسق محدد، وهو مصطلح شائع ومعتمد."
    - lemma: "نَسَقٌ عَسْكَرِيّ"
      generation_method: tarkib
      justification: "استخدام لفظ النسق للدلالة على الترتيب والانتظام، مضافاً إليه الوصف العسكري."
    - lemma: "وَحْدَةٌ قِتَالِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي يشير إلى مجموعة مترابطة من القوات تؤدي غرضاً عسكرياً."
    - lemma: "فِئَةٌ عَسْكَرِيَّة"
      generation_method: tarkib
      justification: "استخدام لفظ الفئة للدلالة على الجماعة من الناس المنظمة عسكرياً."

stage2_evidence:
  per_lemma:
    - lemma: "تشكيل عسكري"
      confirm:
        - text: "«الحَرَس الجمهوريّ: تشكيل عسكريّ مسئول عن النظام في القصر الجمهوريّ وعن حماية الرئيس»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "تَشْكِيلٌ عَسْكَرِيّ"
      confirm:
        - text: "«الحَرَس الجمهوريّ: تشكيل عسكريّ مسئول عن النظام في القصر الجمهوريّ وعن حماية الرئيس»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
    - lemma: "نَسَقٌ عَسْكَرِيّ"
      evidence_status: no_material_found
    - lemma: "وَحْدَةٌ قِتَالِيَّة"
      evidence_status: no_material_found
    - lemma: "فِئَةٌ عَسْكَرِيَّة"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "تشكيل عسكري"
      decision: confirmed
      decision_reason: "مصطلح مركب شائع ومستخدم في المعاجم المعاصرة للتعبير عن الوحدات والتنظيمات العسكرية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشْكِيلٌ عَسْكَرِيّ"
    - lemma: "تَشْكِيلٌ عَسْكَرِيّ"
      source: stage1
      decision: removed
      decision_reason: "مطابق تماماً للمة الموجودة في المجموعة، ولذا يُكتفى بتحديث اللمة السابقة لتشمل التشكيل."
    - lemma: "نَسَقٌ عَسْكَرِيّ"
      source: stage1
      decision: removed
      decision_reason: "يشير النسق إلى الاصطفاف المادي والمكاني وليس بالضرورة التنظيم الإداري أو البنائي الشامل كالتشكيل."
    - lemma: "وَحْدَةٌ قِتَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الوحدة القتالية تشير إلى جزء محدد له مهام قتالية حصرية، بينما التشكيل أعم وقد يشمل مهام غير قتالية كالدعم اللوجستي."
    - lemma: "فِئَةٌ عَسْكَرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير دقيق عسكرياً ولا يمثل الترجمة الاصطلاحية المعتمدة للتنظيمات العسكرية."

stage4_content:
  definition:
    current: "تشكيل من القوات"
    assessment:
      decision: revise
      reason: "التعريف الحالي يحتوي على تكرار للفظ (تشكيل) المكون للمصطلح، ويمكن صياغته بشكل أكثر دقة واصطلاحية."
    authored:
      - type: terminological
        text: "ترتيب وتنظيم محدد لمجموعة من القوات المسلحة للعمل كوحدة واحدة متكاملة الأهداف والمهام."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-08443773-n"
          definition_index: 0
          text: "ترتيب وتنظيم محدد لمجموعة من القوات المسلحة للعمل كوحدة واحدة متكاملة الأهداف والمهام."

  examples:
    per_lemma:
      - lemma: "تشكيل عسكري"
        examples:
          - text: "أعادت القيادة العامة تنظيم التشكيلات العسكرية المنتشرة على الحدود."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-08443773-n"
          text: "أعادت القيادة العامة تنظيم التشكيلات العسكرية المنتشرة على الحدود."

