# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-09831473-n  |  ILI: i88314  |  POS: n
# المفهوم: illustrator — الرسّام التوضيحي
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «مصور» متعددة الدلالات تعدداً حاداً: تُحيل إلى اسم الله الحسنى الجليل، وتعني في الغالب الأعمّ من الاستعمال المعاصر المصوِّرَ الفوتوغرافي (photographer)، مما يُولِّد لبساً مع مفهوم الرسّام التوضيحي المطلوب"
      - "التعريف الحالي ترجمة حرفية ركيكة للتعريف الإنجليزي؛ العبارة «يقوم بعمل» ضعيفة أسلوبياً وغريبة عن أسلوب المعجم الوسيط"
      - "غياب التشكيل الكامل عن اللمّات المدرجة في المجموعة"
    observations: "المجموعة تُعبِّر عن مفهوم الرسّام التوضيحي (illustrator)، وهو فنان متخصص في إعداد الرسوم الإيضاحية للمطبوعات. المصطلح العربي المستقر هو «رسّام توضيحي» الذي وثّقته المعاجم المصطلحية الحديثة (ARABTERM) بترجمة مباشرة 'illustrator' و'book illustrator'. أما «مصور» فقد انزاحت دلالته في الاستعمال الحديث المهيمن نحو الفوتوغرافي، ويتعارض حمله الديني الراسخ مع ضرورة تداوله اصطلاحياً لهذا المفهوم. بوجه عام المجموعة تحتاج إلى تنقية لمّاتها وتحسين تعريفها."
  blind_candidates:
    - lemma: "رَسَّام"
      generation_method: ishtiqaq
      justification: "من الجذر (رسم)، على وزن فَعَّال الدال على الحرفة والاحتراف، يعني من يحترف الرسم ويتخذه مهنة. وزن فَعَّال من أكثر أوزان المهن انتشاراً في العربية (نجّار، حدّاد، رسّام)."
    - lemma: "مُوَضِّح"
      generation_method: ishtiqaq
      justification: "من الجذر (وضح)، على وزن مُفَعِّل، اسم فاعل من وضَّح يُوضِّح، يعني من يُبيِّن ويُجلِّي المعنى. ومنه «الرسم التوضيحي» الذي يُوضِّح النصَّ ويُعينه بصرياً."
    - lemma: "مُصَوِّر"
      generation_method: ishtiqaq
      justification: "من الجذر (صور)، على وزن مُفَعِّل، اسم فاعل من صوَّر يُصوِّر، يعني من يُنتج الصور. قد يُساوي مفهوم من يصنع رسوماً توضيحية تصويرية."
    - lemma: "رَاسِم"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (رسم) على وزن فَاعِل، يدل على من يقوم بفعل الرسم في اللحظة الحاضرة أو بحكم صفته."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
#   ١. مطابقة دقيقة دفعية لجميع اللمّات + المرشحات + صيغ ال-
#   ٢. جسر إنجليزي: illustrator / book illustrator / illuminator
#   ٣. بحث FTS عربي: رسوم توضيحية / رسام / توضيح
#   ٤. إثراء بالمعرّف (تعريفات + أمثلة)
#   ٥. مقاييس اللغة (dictionary_id=151) للجذرين رسم + وضح
stage2_evidence:
  per_lemma:
    - lemma: "رسام توضيحي"
      confirm:
        - text: "«رسام للكتب بتزويدها بالرسوم الإيضاحية»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM، 1999) — entry_id: 395038"
        - text: "translation_en: \"book illustrator\""
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM، 1999) — entry_id: 395038"
        - text: "translation_en: \"illustrator\""
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM، 1999) — entry_id: 395592"

    - lemma: "مصور"
      confirm:
        - text: "«من حِرْفتُه التصوير»"
          source: "المعجم الوسيط، مجمع اللغة العربية — entry_id: 16446"
        - text: "«مَنْ حِرْفَتُه التَّصويرُ»"
          source: "المعجم الكبير، مجمع اللغة العربية — entry_id: 57427"
        - text: "«خَرَجْتَ به عن طَوْق كُلِّ مُصَوِّرٍ / يُجيدُ دقيقَ الفَنِّ فِي جَوْفِ مَصْنَعِ» (حافظ إبراهيم)"
          source: "المعجم الكبير، مجمع اللغة العربية — شاهد شعري، entry_id: 57427"
      contradicts:
        - text: "«من أسماءِ اللهِ الحُسْنَى، وهو الذى صَوَّر جميع الموجودات ورتَّبها، فأعطى كلَّ شىءٍ مِنْها صورةً خاصةً وهيئةً مفردةً يتميزُ بها على اختلافها وكثرتها»"
          source: "المعجم الكبير، مجمع اللغة العربية — entry_id: 57426"
          conflict: "المصوِّر اسم جليل من أسماء الله الحسنى، يستوجب الاحتراز من توظيفه مصطلحاً لحرفة إنسانية"
        - text: "translation_en: \"pictorial\""
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM) — entry_id: 485473"
          conflict: "المعجم المصطلحي يُقابل «مصوَّر» بـ pictorial (صفة) لا بـ illustrator (اسم شخص محترف)؛ ويشير إلى الصورية لا إلى الرسام"

    - lemma: "رَسَّام"
      confirm:
        - text: "«مَن يرسم بالقلم أشكالاً أو صُوراً أو خطوطاً»"
          source: "المعجم الوسيط، مجمع اللغة العربية — entry_id: 10669"
        - text: "«من يَحْتَرِفُ الرَّسْمَ؛ مَن يَنْقُشُ الألواح؛ مَن يَرْسُم بالقَلَم وغَيْرِه أشكالاً أو صُوَرًا أو خطوطًا»"
          source: "المعجم الكبير، مجمع اللغة العربية — entry_id: 93585"
        - text: "«من يرسم بالقلم أشكالا أو صورا أو خطوطا والكثير الخط على الورق والكتابة»"
          source: "موسوعة السلطان قابوس لأسماء العرب — entry_id: 926007"
      expands:
        - text: "translation_en: \"draughtsman\" / \"draftsman\""
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2: بناء-تجارة (ARABTERM) — entry_ids: 479087, 479092"
          addition: "المعاجم المصطلحية تُقابل «رسّام» بـ draughtsman (رسام تقني/هندسي) لا بـ illustrator تحديداً؛ مما يكشف فارقاً دلالياً"
        - text: "translation_en: \"draughtsman\""
          source: "مسرد الجغرافيا والتاريخ (ARABTERM) — entry_id: 502748"
          addition: "تأكيد ثانٍ على أن الاستعمال المصطلحي لـ«رسّام» يتجه نحو draughtsman (رسام تقني) لا illustrator (رسام توضيحي فني)"

    - lemma: "مُوَضِّح"
      evidence_status: "no_material_found"

    - lemma: "رَاسِم"
      contradicts:
        - text: "«الراسم: الماء الجاري»"
          source: "المعجم الوسيط، مجمع اللغة العربية — entry_id: 10666"
          conflict: "الراسم في المعجمية العربية الكلاسيكية والحديثة يعني الماء الجاري، لا من يرسم الصور"
        - text: "«(الراسم) الْمَاء الْجَارِي (ج) رواسم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين، مجمع القاهرة (1998) — entry_id: 873579"
          conflict: "تأكيد ثانٍ من مصدر مستقل: الراسم = الماء الجاري"
        - text: "translation_en: \"plotter\""
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM) — entry_id: 399000"
          conflict: "المصطلحية الحديثة تستخدم «راسم» لجهاز الرسم الحاسوبي (plotter)، وهو جهاز لا شخص"
        - text: "translation_en: \"racemize (to)\""
          source: "المعجم الموحد لمصطلحات الكيمياء (ARABTERM) — entry_id: 428623"
          conflict: "في الكيمياء، «راسَمَ» فعل يعني «أجرى عملية تراسُم» — لا صلة بمفهوم الرسم الفني"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "رسام توضيحي"
      decision: confirmed
      decision_reason: "مصطلح موثَّق صراحةً في المعاجم المصطلحية العربية الموحَّدة بمعنى 'illustrator' تحديداً (ARABTERM، التقنيات التربوية 1999). التركيب وصفي صحيح (اسم + نعت). يجتاز اختبار السكّ: رسّام توضيحي ≠ رسّام تشخيصي ≠ رسّام إنشائي — المكوِّنان غير قابلَين للتبادل الحر مع بقاء الدلالة، وهو مُثبَّت معجمياً. يجتاز فحص الجودة المصطلحية: اطّراد، يُسر تداول، ملاءمة، اشتقاقية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "الوحيدة في المجموعة بعد حذف «مصور»؛ تختص بمن يحترف الرسم التوضيحي للمطبوعات تحديداً، وهو أخصّ من «رسام» (الرسام العام والتقني) وأدقّ من «مصور» (يوحي بالتصوير الفوتوغرافي في الاستعمال الحديث)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَسَّام تَوْضِيحِيّ"

    - lemma: "مصور"
      decision: removed
      decision_reason: "ثلاثة أسباب قاطعة تستوجب الحذف: (١) الحمل الديني — المصوِّر من أسماء الله الحسنى الجليلة، واستعماله مصطلحاً للحرفة الإنسانية مثار اعتراض ثقافي وديني راسخ؛ (٢) الانزياح الدلالي الحديث — في الاستعمال الحديث المهيمن «مصور» = photographer (مصوِّر فوتوغرافي)، وهو مفهوم مستقل؛ (٣) غياب التوثيق المصطلحي — المعاجم المصطلحية لا تُقابل «مصور» بـ illustrator بل بـ 'pictorial' (صفة). التعريف المعجمي «من حرفته التصوير» أشمل مما يُثبت الدلالة الضيقة المطلوبة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "رَسَّام"
      source: stage1
      decision: removed
      decision_reason: "رَسَّام مفهوم أعمّ من المطلوب؛ المعاجم المصطلحية تُقابله بـ draughtsman (رسام تقني/هندسي) لا بـ illustrator. إدراجه في هذه المجموعة الضيقة (illustrator) يُدخل مصطلحاً لمفهوم أعلى رتبةً مما يُخلّ بضبط المجموعة. رَسَّام المناسب له مجموعته الخاصة الأوسع."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُوَضِّح"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على استعمال مُوَضِّح اسمَ فاعل مُسكَّكاً للدلالة على مَن يحترف الرسم التوضيحي. الجذر وضح يدل على الإبانة والبيان — ومنه مُوضِحَة الشِّجَاج والواضحة (الأسنان) — لكنه لم يُثبَّت في المعجمية مصطلحاً لصاحب حرفة الرسم التوضيحي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "رَاسِم"
      source: stage1
      decision: removed
      decision_reason: "المعجمية العربية قاطعة وموثَّقة بمصدرين مستقلَّين: الراسم = الماء الجاري (المعجم الوسيط، ومعجم مجمع القاهرة 1998). وفي مقاييس اللغة لابن فارس: «وَقِيلَ الرَّاسِمُ: الْمَاءُ الْجَارِي، فَإِنْ كَانَ صَحِيحًا فَلِأَنَّهُ إِذَا جَرَى أَثَّرَ وَأَبْقَى الرَّسْمَ». أما في المصطلحية الحديثة فيُحيل إلى جهاز الرسم الحاسوبي (plotter) لا إلى شخص. لا مساغ لإدراجه."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


