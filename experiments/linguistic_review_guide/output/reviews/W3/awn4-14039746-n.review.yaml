# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14039746-n
# thinking cap — حالة ينهمك فيها المرء بالتفكير
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «وضعية التفكير» تستخدم كلمة «وضعية» التي تعني في المعاجم العربية الهيئة الجسدية أو مذهب أوغست كونت الفلسفي، ولا تؤدّي معنى الحالة الذهنية"
      - "اللمّتان الموجودتان كلتاهما مركّبات إضافية وصفية، لا مصطلحات مسكوكة ثابتة في المعاجم"
      - "المفهوم الإنجليزي thinking cap تعبير اصطلاحي عامّي يدلّ على حالة الاستغراق في التفكير، وليس مصطلحاً علمياً"
    observations: "المجموعة تمثّل مفهوماً بسيطاً: حالة ذهنية يكون فيها المرء منشغلاً بالتفكير. المصطلح الإنجليزي thinking cap مجازي (قبّعة التفكير)، والعربية تعبّر عن هذا المفهوم عادةً بمصادر الأفعال الدالّة على التفكير والتأمل، أو بمركّبات إضافية من نوع «حالة + مصدر». الجنس القريب هو «حالة ذهنية / مزاج» وهو متوفر في الأصل الأعلى."
  blind_candidates:
    - lemma: "تَأَمُّل"
      generation_method: ishtiqaq
      justification: "مصدر تَأَمَّلَ على وزن تَفَعُّل من جذر أ م ل، يدلّ على التثبّت في النظر وإعادته مرّة بعد أخرى، وهو أقرب مفرد عربي لمفهوم الانهماك الذهني"
    - lemma: "تَفَكُّر"
      generation_method: ishtiqaq
      justification: "مصدر تَفَكَّرَ على وزن تَفَعُّل من جذر ف ك ر، يدلّ على تصرّف القلب في معاني الأشياء لإدراك المطلوب، وهو لفظ قرآني كريم"
    - lemma: "اسْتِغْرَاق"
      generation_method: majaz
      justification: "من جذر غ ر ق الدالّ على الانتهاء في الشيء وبلوغ أقصاه، استُعمل مجازاً بمعنى الانهماك التامّ في التفكير عند الصوفية وفي الاستعمال الحديث"
    - lemma: "تَدَبُّر"
      generation_method: ishtiqaq
      justification: "مصدر تَدَبَّرَ على وزن تَفَعُّل من جذر د ب ر، يدلّ على النظر في عواقب الأمور وهو قريب من التفكّر كما نصّ المعجم الكبير"

stage2_evidence:
  per_lemma:
    - lemma: "حَالَةُ تَأَمُّلٍ"
      confirm:
        - text: "«مزاج التأمُّل أو التفكير Put on your thinking cap»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التأمل: تدبر الشيء وإعادة النظر فيه مرة بعد أخرى ليتحققه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يوضّح أنّ التأمل يتضمّن التكرار والتثبّت"
        - text: "«استغراق الذهن في موضوع تفكير، يستبعد الذات والموضوع عند الصوفية، وهو درجة من درجات الإدراك المعرفي التجريدي»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يربط التأمل بالاستغراق الذهني وهو جوهر المفهوم المطلوب"

    - lemma: "وَضْعِيَّةُ التَّفْكِيرِ"
      contradicts:
        - text: "«الوَضْعِيَّةُ: مذهب أوجست كونت وهو يُنكر الميتافيزيقا ما وراء الطبيعة ويقيم المعرفة على الوقائع والتجربة»"
          source: "المعجم الوسيط"
          conflict: "وضعية مصطلح فلسفي (positivism) لا يدلّ على الحالة الذهنية"

    - lemma: "تَأَمُّل"
      confirm:
        - text: "«تَأَمَّلَ: تلبَّث في الأمر والنظر. الشيءَ وفيه: تدبّره وأعاد النظر فيه مرّة بعد أخرى ليستيقنه»"
          source: "المعجم الوسيط"
        - text: "«التأمّل: التثبّت في النظر»"
          source: "مقاييس اللغة لابن فارس (نقلاً عن الخليل)"
        - text: "«نوع من عمليات التفكير خاصيتها التركيز»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
      expands:
        - text: "«تأمُّل [روحيّ أو دينيّ]؛ تفكُّر؛ دراسة؛ تأمُّل؛ إنعام نظر»"
          source: "المورد الحديث (2008)"
          addition: "يبيّن تعدّد استعمالات التأمل من الروحي إلى الدراسي"

    - lemma: "تَفَكُّر"
      confirm:
        - text: "«التفكر: تصرف القلب في معاني الأشياء؛ لدرك المطلوب»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«تَفَكَّرَ في الأمر: افتكر»"
          source: "المعجم الوسيط"
      expands:
        - text: "«التفكر: سراج القلب يرى به خيره وشره، ومنافعه ومضاره، وكل قلب لا تفكر فيه فهو في ظلمات يتخبط»"
          source: "كتاب التعريفات للجرجاني"
          addition: "يوسّع المفهوم ليشمل البعد الأخلاقي والروحي للتفكر"

    - lemma: "اسْتِغْرَاق"
      contradicts:
        - text: "«الاستغراق: الشمول لجميع الأفراد، بحيث لا يخرج عنه شيء»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى الأصلي منطقي (الشمول الكلّي) لا ذهني"
      expands:
        - text: "«الاستغراق: هو عند الصوفية أن لا يلتفت قلب الذاكر إلى الذكر في أثناء الذكر ولا إلى القلب، ويعبّر العارفون عن هذه الحالة عن الفناء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "المعنى الصوفي يدلّ على حالة ذهنية عميقة لكنها أخصّ من مطلق التفكير"

    - lemma: "تَدَبُّر"
      confirm:
        - text: "«التَّدَبُّرُ: النَظَرُ فى عواقبِ الأُمورِ، وهو قريبٌ من التَّفَكُّرِ»"
          source: "المعجم الكبير"
        - text: "«تَدَبَّرَ الأَمْرَ وفيه: تَفَكَّرَ فيه، ونَظَرَ فى عاقبَتِه»"
          source: "المعجم الكبير"
      expands:
        - text: "«التدبير: أنْ يدبّر الإنسان أمره، وذلك أنه ينظر إلى ما تصير عاقبته وآخره وهو دُبُره»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدلّ على النظر في الأواخر والعواقب فهو أخصّ من مطلق التفكير"

stage3_analysis:
  per_lemma:
    - lemma: "حَالَةُ تَأَمُّلٍ"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت يقابل تماماً تعريف المجموعة «حالة ينهمك فيها المرء بالتفكير». ورد في المورد الحديث ترجمةً لـ thinking cap. الجنس (حالة) مطابق لأصل المجموعة الأعلى (حالة ذهنية)، والفصل (تأمل) مؤكَّد معجمياً"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير صريح عن الحالة الذهنية بتسمية جنسها (حالة) وفصلها (تأمل)، أوضح وأكثر رسمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالَةُ تَأَمُّلٍ"

    - lemma: "وَضْعِيَّةُ التَّفْكِيرِ"
      decision: removed
      decision_reason: "كلمة «وضعية» لا تدلّ على الحالة الذهنية في المعاجم العربية؛ معناها المعجمي إمّا الهيئة الجسدية (posture) وإمّا المذهب الوضعي (positivism). استعمالها بمعنى «حالة» ترجمة حرفية غير مقبولة"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَأَمُّل"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر مؤكَّد في المعجم الوسيط والمعاجم الاصطلاحية بدلالة التثبّت في النظر والاستغراق الذهني. يصلح مفرداً للدلالة على حالة التأمل ذاتها لأنّ المصدر العربي يدلّ على الحدث وعلى حالة الفاعل معاً"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مفرد يركّز على فعل التثبّت وإعادة النظر ذاته، أعمّ من حالة تأمل التي تصرّح بكونها حالة"
      actions:
        - command: create_entry
          params: {lemma: "تَأَمُّل", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَفَكُّر"
      source: stage1
      decision: removed
      decision_reason: "رغم ثبوته معجمياً بدلالة «تصرّف القلب في معاني الأشياء»، فإنه يركّز على العملية الذهنية الفاعلة (process) أكثر من الحالة (state)، ويكاد يكون مرادفاً تامّاً للتأمل مع فارق ضئيل لا يبرّر ازدحام المجموعة"

    - lemma: "اسْتِغْرَاق"
      source: stage1
      decision: removed
      decision_reason: "معناه الأصلي في المنطق والأصول «الشمول الكلّي»، واستعماله الصوفي أخصّ بكثير من مفهوم المجموعة العامّ. الاشتراك اللفظي يولّد لبساً غير مقبول"

    - lemma: "تَدَبُّر"
      source: stage1
      decision: removed
      decision_reason: "معناه أخصّ من المطلوب: النظر في العواقب والمآلات. المجموعة تدلّ على مطلق الانهماك بالتفكير لا على التفكير في العواقب تحديداً"

