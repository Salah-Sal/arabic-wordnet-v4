stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر للتشكيل الكامل.
    observations: "المصطلح جغرافي مستقر، وهو ترجمة مباشرة للمسمى العالمي 'Gulf of Guinea'. التعريف الحالي دقيق جغرافياً ولكنه مقتضب."
  blind_candidates:
    - lemma: "خَلِيجُ غِينْيَا"
      generation_method: tarkib
      justification: "الاسم الجغرافي العربي الشائع والمعتمد لهذه المنطقة البحرية."
    - lemma: "خَلِيجُ غِينِيَا"
      generation_method: tarkib
      justification: "صيغة بديلة بكتابة الياء (غينيا/غينيا) تعكس النطق المحلي."
    - lemma: "جَوْنُ غِينْيَا"
      generation_method: majaz
      justification: "استخدام لفظ 'جون' التراثي للدلالة على الخليج أو المتسع من البحر."
    - lemma: "شَرْمُ غِينْيَا"
      generation_method: majaz
      justification: "استخدام لفظ 'شرم' وهو من مرادفات الخليج في بعض السياقات الجغرافية."

stage2_evidence:
  per_lemma:
    - lemma: "خليج غينيا"
      confirm:
        - text: "خليج غينيا (guinean gulf / golfe de guinée)"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
    - lemma: "غينيا"
      expands:
        - text: "غينيا"
          source: "المكنز الزراعي متعدد اللغات"
          addition: "ورد ذكرها كاسم منطقة جغرافية ترتبط بها بعض الأنواع الحيوية."
    - lemma: "خَلِيجُ غِينْيَا"
      evidence_status: "no_material_found"
    - lemma: "خَلِيجُ غِينِيَا"
      evidence_status: "no_material_found"
    - lemma: "جَوْنُ غِينْيَا"
      evidence_status: "no_material_found"
    - lemma: "شَرْمُ غِينْيَا"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خليج غينيا"
      decision: confirmed
      decision_reason: "المصطلح العلمي والجغرافي الموحد والمعتمد في المعاجم المتخصصة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ غِينْيَا"

stage4_content:
  definition:
    current: "خليج قبالة الساحل الجنوبي الغربي لأفريقيا"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً، يحتاج لمزيد من التفاصيل الجغرافية لتوضيح المعنى وتجنب اللبس."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ يَقَعُ فِي الْجُزْءِ الشَّرْقِيِّ لِلْمُحِيطِ الأَطْلَسِيِّ، يَمْتَدُّ عَلَى طُولِ السَّاحِلِ الْجَنُوبِيِّ لِغَرْبِ أَفْرِيقْيَا، وَتَصُبُّ فِيهِ مِيَاهُ نَهْرِ النَّيْجَرِ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَلِيجٌ يَقَعُ فِي الْجُزْءِ الشَّرْقِيِّ لِلْمُحِيطِ الأَطْلَسِيِّ، يَمْتَدُّ عَلَى طُولِ السَّاحِلِ الْجَنُوبِيِّ لِغَرْبِ أَفْرِيقْيَا، وَتَصُبُّ فِيهِ مِيَاهُ نَهْرِ النَّيْجَرِ."
  examples:
    per_lemma:
      - lemma: "خليج غينيا"
        examples:
          - text: "يُعَدُّ خَلِيجُ غِينْيَا مِنْ أَكْثَرِ الْمَنَاطِقِ غِنًى بِالنِّفْطِ فِي الْقَارَّةِ الأَفْرِيقِيَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدُّ خَلِيجُ غِينْيَا مِنْ أَكْثَرِ الْمَنَاطِقِ غِنًى بِالنِّفْطِ فِي الْقَارَّةِ الأَفْرِيقِيَّةِ."

