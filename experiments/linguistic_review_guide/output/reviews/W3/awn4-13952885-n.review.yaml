# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13952885-n
# a trustful relationship / علاقة مبنية على الثقة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي دائري: «علاقة مبنية على الثقة» يستخدم لفظ «الثقة» وهو اللمّة ذاتها"
      - "المجموعة تحتوي لمّة واحدة فقط رغم أنّ المفهوم قابل للتعبير بألفاظ عدّة في العربية"
    observations: "المفهوم هو نوع من العلاقات الإنسانية (تحت الصداقة) قائم على الاطمئنان وحسن الظنّ المتبادل. الجذر الرئيسي المتوقَّع هو و-ث-ق الذي يدور حول العقد والإحكام. لفظ «ثقة» مصدر شائع يصلح للدلالة على هذا المفهوم، لكن ينبغي التأكّد من تمييزه عن الاستعمال الوصفيّ (رجل ثقة) والاستعمال الاصطلاحي المالي (ائتمان)."
  blind_candidates:
    - lemma: "وُثُوق"
      generation_method: ishtiqaq
      justification: "مصدر وَثِقَ بِهِ على وزن فُعُول، يدلّ على حالة الاعتماد والتسليم بين طرفَيْن، ويُستعمل في سياق العلاقة الشخصية دون الالتباس بالمعنى المالي"
    - lemma: "تَوَاثُق"
      generation_method: ishtiqaq
      justification: "من الجذر و-ث-ق على وزن تَفاعُل الدالّ على المشاركة والتبادل، فيُشير إلى الثقة المتبادلة بين طرفَيْن كعلاقة"
    - lemma: "ائْتِمَان"
      generation_method: ishtiqaq
      justification: "من الجذر أ-م-ن على وزن افتعال، يدلّ على جعل الغير أميناً والاعتماد عليه، وهو مفهوم قريب من علاقة الثقة"
    - lemma: "اعْتِمَاد"
      generation_method: ishtiqaq
      justification: "من الجذر ع-م-د على وزن افتعال، يدلّ على التعويل والاتّكال على الغير، وهو من لوازم علاقة الثقة"


stage2_evidence:
  per_lemma:
    - lemma: "ثِقَة"
      confirm:
        - text: "«مصدر؛ وقد يُوصف به, [يستوي فيه المفرد والمثنى والجمع بنوعيهما], فيقال: هو وهى وهما وهم وهن ثِقَةٌ»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(الثِّقَة) مصدر وَقد يُوصف بِهِ (يَسْتَوِي فِيهِ الْمُفْرد والمثنى وَالْجمع بنوعيهما) فَيُقَال هُوَ وَهِي وهما وهم وَهن ثِقَة وَقد يجمع فِي الذُّكُور وَالْإِنَاث على ثِقَات»"
          source: "المعجم الوسيط (حوراماني)"
        - text: "«الشعور بالأمن المتبادل بين المتكلم والمخاطب يجعل التواصل بينهما ناجحا وشفافا.»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«(1) ثِقة. (ب) ائتمان. (ج) موضع ثقة أو ائتمان»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الثقة: هي التي يُعتمد عليها في الأقوال والأفعال.»"
          source: "كتاب التعريفات للجرجاني"
          addition: "الاستعمال الوصفي: يُوصف به الشخص الموثوق"
        - text: "«الثقة: من يعتمد عليه في القول والفعل.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تأكيد الاستعمال الوصفي في المصطلح الحديثي"
        - text: "«مستوى الثقة لدى المستخدم أو صاحب المصلحة في أن النظام أو المنتج سيعمل بالشكل المطلوب.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          addition: "الاستعمال التقني الحديث في مجال الذكاء الاصطناعي"

    - lemma: "وُثُوق"
      evidence_status: "no_material_found"

    - lemma: "تَوَاثُق"
      contradicts:
        - text: "«القومُ على الأَمر: تعاهدوا وتحالفوا»"
          source: "المعجم الوسيط (OCR)"
          conflict: "تواثق فعل لا اسم، ومعناه التعاهد والتحالف وليس العلاقة القائمة على الثقة"
        - text: "«(تواثق) الْقَوْم على الْأَمر تَعَاهَدُوا وتحالفوا»"
          source: "المعجم الوسيط (حوراماني)"
          conflict: "تأكيد كونه فعلاً بمعنى التعاهد لا اسماً لعلاقة الثقة"

    - lemma: "ائْتِمَان"
      contradicts:
        - text: "«إقراض المال لآجِلٍ , وقد يكون مقترنا بضمان عينىٍّ أو شخصىٍّ , أو بغير ضمان .»"
          source: "المعجم الكبير (OCR)"
          conflict: "الائتمان في الاستعمال المعاصر مصطلح مالي بحت (credit) لا يدلّ على علاقة الثقة بين الأشخاص"

    - lemma: "اعْتِمَاد"
      expands:
        - text: "«(1) تعويل؛ اعتماد؛ ثقة؛ اتّكال (2) المُعَوَّل: كلّ ما يُعَوَّل عليه.»"
          source: "المورد الحديث (2008)"
          addition: "الاعتماد يدلّ على التعويل والاتّكال وهو أعمّ من الثقة كعلاقة شخصية"


stage3_analysis:
  per_lemma:
    - lemma: "ثِقَة"
      decision: confirmed
      decision_reason: "لفظ «ثِقَة» مصدر من الجذر و-ث-ق مثبت في المعاجم الكلاسيكية والمعاصرة، ويدلّ على الاطمئنان إلى الغير والاعتماد عليه. وهو اللفظ الأكثر شيوعاً وطبيعيةً للدلالة على هذا المفهوم في العربية الفصيحة. أكّدته أدلة معجمية متعددة من المعجم الوسيط والجرجاني والمصطلحات الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثِقَة"

    - lemma: "وُثُوق"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية مباشرة لهذا اللفظ بمعنى علاقة الثقة. وُثُوق مصدر يدلّ على صفة الشيء الموثوق لا على العلاقة بين طرفَيْن."

    - lemma: "تَوَاثُق"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية (المعجم الوسيط) تُثبت أنّ «تواثق» فعل بمعنى «تعاهدوا وتحالفوا» وليس اسماً. معناه التعاهد والتحالف على أمر مُحدّد، وليس الحالة الدائمة من الثقة المتبادلة التي يصفها المجموعة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "ائْتِمَان"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية (المعجم الكبير) تُثبت أنّ «الائتمان» مصطلح مالي بمعنى إقراض المال لأجل (credit). استعماله للدلالة على علاقة الثقة الشخصية يُوقع في لبس مع المصطلح المالي الراسخ."
      evidence_assessment:
        case: contradicts_only

    - lemma: "اعْتِمَاد"
      source: stage1
      decision: removed
      decision_reason: "الاعتماد يدلّ على التعويل والاتّكال وهو أعمّ من الثقة كعلاقة شخصية. يشمل الاعتماد على الأشياء والأنظمة لا الأشخاص فحسب، ولا يتضمّن بالضرورة البُعد العاطفي والاطمئناني الذي تتميّز به علاقة الثقة."
      evidence_assessment:
        case: mixed


