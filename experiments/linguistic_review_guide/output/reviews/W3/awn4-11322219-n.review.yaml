      evidence_status: "no_material_found"

    - lemma: "سِير كلَايف سِنكلِير"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "كلَايف مَارلز سِنكلِير"
      source: stage1
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:

    - lemma: "سنكلير"
      decision: confirmed
      decision_reason: >
        اسم علَم مُعرَّب مؤكد، موثّق في موسوعة السلطان قابوس لأسماء العرب. يمثّل الشكل
        المختصر الأكثر شيوعاً في الإشارة إلى المهندس وشركته ومنتجاته. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الشكل المختصر (اسم العائلة وحده) يُستخدم في السياقات غير الرسمية والتقنية للإشارة
        إلى الشخص أو منتجاته (حاسوب سنكلير، شركة سنكلير)؛ لا يُميّز الشخص عن أفراد آخرين
        في العائلة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِنكلِير"

    - lemma: "كلايف سنكلير"
      decision: confirmed
      decision_reason: >
        الاسم الثنائي (الشخصي + العائلي) هو الشكل الأكثر تداولاً في الإعلام العربي التقني
        للإشارة إلى الشخص بعينه. يُميّزه عن أفراد عائلة سنكلير الآخرين. يحتاج تشكيلاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الشكل الثنائي المعتمد في الصحافة العربية التقنية والموسوعية؛ يُعيّن الشخص بدقة
        كافية للسياقات الأكاديمية والصحفية دون الحاجة إلى اللقب الفخري.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كلَايف سِنكلِير"

    - lemma: "سِير كلَايف سِنكلِير"
      source: stage1
      decision: confirmed
      decision_reason: >
        يُقابل اللمّة الثالثة في OEWN (Sir Clive Marles Sinclair) ويُعبّر عن الاسم الرسمي
        الكامل مع اللقب الفخري البريطاني sir. تعريب "سِير" لـ Sir راسخ في الصحافة العربية
        (سير ونستون تشرشل، سير إسحاق نيوتن). إدراجه يكمل تغطية AWN لتعادل OEWN.
        اختبار السكّ: الوحدة ثابتة، لا يمكن إبدال "كلَايف" بمرادف ويبقى المصطلح صالحاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الشكل الرسمي الكامل مع اللقب الفخري؛ يُستخدم في الوثائق الرسمية والمراجع
        الموسوعية والسياقات التي تستوجب الدقة التوثيقية. أكثر رسمية من "كلَايف سِنكلِير".
      actions:
        - command: create_entry
          params:
            lemma: "سِير كلَايف سِنكلِير"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "كلَايف مَارلز سِنكلِير"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الأوسط "مَارلز" نادر في الكتابة العربية؛ لا يرد في مصادر إعلامية أو
        موسوعية عربية مُعتمدة. المجموعة مُكتملة بإضافة "سِير كلَايف سِنكلِير" الذي يُغطي
        الاسم الرسمي. إدراج شكل بالاسم الأوسط دون لقبه (Sir) يُشوّه الصورة المعجمية.


stage4_content:
  definition:
    current: "مهندس كهربائي إنجليزي أسس شركة قدمت العديد من المنتجات المبتكرة (ولد عام 1940)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي منقوص من ثلاثة أوجه: (١) يذكر المولد دون الوفاة (توفي 2021) —
        الشكل المثبَّت في المعاجم الموسوعية يشمل القوسين الزمنيين. (٢) لا يذكر اسم
        الشركة (Sinclair Research) ولا أبرز منتجاته (ZX Spectrum) مما يُفقده التمييز.
        (٣) عبارة "شركة قدمت العديد من المنتجات المبتكرة" شائعة وغير كافية للتعريف
        بشخص بعينه. التعريف الموسوعي الأنسب لاسم العلَم.
    authored:
      - type: encyclopedic
        text: >
          مهندس كهربائي إنجليزي (1940-2021)، مؤسس شركة سِنكلِير للأبحاث (Sinclair Research)؛
          اشتُهر بتصميم حاسوب ZX Spectrum وطائفة من الأجهزة الإلكترونية الشخصية المبتكرة
          التي أسهمت في انتشار الحوسبة المنزلية في بريطانيا، وقد نال لقب "سير" الفخري
          تقديراً لإسهاماته عام 1983.
    actions:
