# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11322219-n | ILI: i96927 | POS: n
# الموضوع: السير كلايف مارلز سنكلير — مهندس كهربائي إنجليزي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (سنكلير، كلايف سنكلير) بدون تشكيل"
      - "المجموعة الإنجليزية (OEWN) تضم ثلاث لمّات (Sinclair / Clive Sinclair / Sir Clive Marles Sinclair)، بينما AWN يملك لمّتين فقط — اللمّة الثالثة غائبة"
      - "التعريف يُشير إلى المولد عام 1940 دون ذكر الوفاة (توفي سبتمبر 2021)"
      - "التعريف لا يذكر اسم الشركة ولا أبرز منتجاته، مما يجعله عاماً بلا تمييز كافٍ"
    observations: >
      هذه المجموعة الترادفية خاصة بشخص علَم محدد هو السير كلايف مارلز سنكلير (1940-2021)،
      المهندس الكهربائي الإنجليزي مؤسس شركة Sinclair Research، الشهير بحاسوب ZX Spectrum
      وأجهزة الجيب الإلكترونية. لمّات هذه المجموعة هي حصراً تعريبات لاسمه العلَم، إذ لا
      يوجد مقابل عربي أصيل لاسم شخص أجنبي. الأولوية في التوليد: التعريب (تاعريب) وحده
      ينطبق هنا، لأن مناهج المجاز والاشتقاق والتركيب لا تصلح للأسماء الأعلام الأجنبية.
  blind_candidates:
    - lemma: "سِنكلِير"
      generation_method: taarib
      justification: >
        تعريب اسم العائلة الإنجليزي Sinclair؛ وهو الشكل الأكثر شيوعاً في المصادر العربية
        للإشارة إلى هذا المهندس ومنتجاته. يقبل لام التعريف (السِّنكلير) والنسبة (سِنكلِيرِيّ).
    - lemma: "كلَايف سِنكلِير"
      generation_method: taarib
      justification: >
        تعريب مركب للاسم الشخصي والعائلي Clive Sinclair؛ يُميّز الشخص عن حاملي اللقب ذاته.
        يُستخدم على نطاق واسع في الصحافة التقنية العربية.
    - lemma: "سِير كلَايف سِنكلِير"
      generation_method: taarib
      justification: >
        تعريب الاسم الرسمي مع لقبه الفخري Sir (= سِير) الذي مُنح له عام 1983. يرد هذا الشكل
        في الموسوعات العربية والمصادر الرسمية ويقابل اللمّة الثالثة في OEWN
        (Sir Clive Marles Sinclair).
    - lemma: "كلَايف مَارلز سِنكلِير"
      generation_method: taarib
      justification: >
        تعريب الاسم الثلاثي الكامل Clive Marles Sinclair بالاسم الأوسط؛ يقابل
        الصياغة الكاملة في OEWN. الاسم الأوسط غير شائع في الكتابة العربية.


