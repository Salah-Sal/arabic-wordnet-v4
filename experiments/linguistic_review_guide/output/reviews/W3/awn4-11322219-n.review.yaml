          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُثبت أن سنكلير اسم علَم مُعرَّب متداول، وأصله الفرنسي Saint-Clair مشتق من اسم المدينة؛ وجوده في معجم الأسماء العربية يؤكد تعريبه المقبول رغم عدم تصنيفه في المعاجم العلمية المتخصصة."

