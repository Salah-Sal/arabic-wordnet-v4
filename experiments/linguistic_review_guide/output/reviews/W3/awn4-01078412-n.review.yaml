stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يبدو مترجماً حرفياً من الإنجليزية (غرس الخوف أو الشك)."
      - "اللمة الموجودة تفتقر إلى التشكيل."
    observations: "المفهوم يتعلق بالمنع والكف الاستباقي عن طريق التهديد أو التخويف، واللفظ العربي التراثي والمعاصر الذي يؤدي هذا المعنى بدقة هو «الردع»."
  blind_candidates:
    - lemma: "رَدْع"
      generation_method: ishtiqaq
      justification: "مصدر من الفعل ردع، ويعني الكف والمنع، وهو المقابل المباشر والأدق لمفهوم deterrence."
    - lemma: "تَخْوِيف"
      generation_method: ishtiqaq
      justification: "مصدر من خوّف، يركز على الآلية المذكورة في التعريف وهي بث الخوف لمنع الفعل."
    - lemma: "تَرْهِيب"
      generation_method: ishtiqaq
      justification: "مصدر من رهّب، يحمل معنى إيقاع الرعب والخوف لمنع الخصم."
    - lemma: "زَجْر"
      generation_method: ishtiqaq
      justification: "مصدر من زجر، ويعني المنع والنهي، وقد يستخدم في سياقات مشابهة."

stage2_evidence:
  per_lemma:
    - lemma: "ردع"
      confirm:
        - text: "ردَعَ يَردَع، رَدْعًا، فهو رادع، والمفعول مَرْدوع• ردَع الوالدُ ولدَه عن الكذِب: زجَره وكفَّه ومنَعه عنه... رَدْع [مفرد]:1 - مصدر ردَعَ ° قوات الرَّدْع"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "رَدَعْتُهُ عَنْ الشَّيْءِ أَرْدَعُهُ رَدْعًا مَنَعَتُهُ وَزَجَرْتُهُ"
          source: "المصباح المنير للفيّومي"
        - text: "ثَنْي؛ إعاقة؛ مَنْع؛ رَدْع. (deterrence)"
          source: "المورد الحديث"
    - lemma: "تخويف"
      expands:
        - text: "أسلوب في التواصل يعتمد على التخويف وسيلة للإقناع، ثم التصديق."
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يدل على بث الخوف كآلية، ولكنه لا يتضمن بالضرورة معنى الكف والمنع الصريح."
    - lemma: "ترهيب"
      evidence_status: "no_material_found"
    - lemma: "زجر"
      expands:
        - text: "الزجر: طرد بصوت ثم يستعمل في الطرد تارة، وفي الصوت أخرى ذكره ابن الكمال. وقال أبو البقاء: الزجر منع بتهديد."
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الزجر فيه معنى المنع بالتهديد، لكنه يغلب في السياقات اللفظية أو التأديبية."

stage3_analysis:
  per_lemma:
    - lemma: "ردع"
      decision: confirmed
      decision_reason: "المصطلح دقيق ومؤيد بالمعاجم التراثية والمعاصرة، وهو المقابل المعتمد والشائع لـ deterrence."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَدْع"
    - lemma: "تَخْوِيف"
      source: stage1
      decision: removed
      decision_reason: "التخويف يركز على إثارة الخوف كشعور، ولا يتضمن بالضرورة النتيجة المرجوة وهي المنع والكف (الردع)."
    - lemma: "تَرْهِيب"
      source: stage1
      decision: removed
      decision_reason: "أقرب إلى intimidation، ولا يتطابق تماماً مع مفهوم الردع."
    - lemma: "زَجْر"
      source: stage1
      decision: removed
      decision_reason: "يُستخدم غالباً في سياق النهي والمنع اللفظي أو التأديبي، في حين أن الردع أشمل ويناسب السياقات الاستراتيجية والمادية."

stage4_content:
  definition:
    current: "فعل أو عملية تثبيط الإجراءات أو منع الحوادث عن طريق غرس الخوف أو الشك"
    assessment:
      decision: revise
      reason: "التعريف الحالي صياغته تبدو مترجمة حرفياً (غرس الخوف أو الشك)، ويمكن تحسينه ليكون أسلوبه أكثر فصاحة وعربية."
    authored:
      - type: terminological
        text: "عملية كفّ شخص أو جهة عن الإقدام على فعل ما أو هجوم عن طريق التخويف أو التهديد بالعواقب."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية كفّ شخص أو جهة عن الإقدام على فعل ما أو هجوم عن طريق التخويف أو التهديد بالعواقب."

  examples:
    per_lemma:
      - lemma: "رَدْع"
        examples:
          - text: "تهدف العقوبات الصارمة إلى تحقيق الردع لمنع تكرار الجريمة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تهدف العقوبات الصارمة إلى تحقيق الردع لمنع تكرار الجريمة."

stage5_enrichment:
  per_entry:
    - lemma: "رَدْع"
      entry_id: "{auto}"
      root: "ردع"
      maqayis_quote: "«الرَّاءُ وَالدَّالُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مَنْعٍ وَصَرْعٍ. يُقَالُ رَدَعْتُهُ عَنْ هَذَا الْأَمْرِ فَارْتَدَعَ.»"
  per_sense:
    - lemma: "رَدْع"
      sense_id: "{auto}"
      nuance: "الكف والمنع الناتج عن الخوف من العواقب، وهو أدق تعبير عن المفهوم."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"ردع","maqayis":"«الرَّاءُ وَالدَّالُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مَنْعٍ وَصَرْعٍ. يُقَالُ رَدَعْتُهُ عَنْ هَذَا الْأَمْرِ فَارْتَدَعَ.»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الكف والمنع الناتج عن الخوف من العواقب، وهو أدق تعبير عن المفهوم.","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95