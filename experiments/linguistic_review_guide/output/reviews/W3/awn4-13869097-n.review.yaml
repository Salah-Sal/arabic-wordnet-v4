# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13869097-n — third (المركز الثالث)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «الثالث» مصحوبة بأل التعريف، والمعتاد في المعاجم العربية أن يكون المدخل بدون أل"
      - "اللمّة بدون تشكيل كامل"
      - "المعجم الكبير يصنّف «الثالث» صفةً (adj) بينما المجموعة اسم (n)؛ لكن الاستعمال الاسمي للعدد الترتيبي مقبول نحوياً"
    observations: >-
      المجموعة تعبّر عن مفهوم ترتيبي بسيط: المرتبة التي تلي الثاني مباشرة.
      المفهوم أصيل في العربية ولا يحتاج إلى سكّ مصطلح جديد. الجذر «ث ل ث» من أغزر
      الجذور العددية اشتقاقاً. اسم الفاعل «ثَالِث» على وزن فاعِل هو الصيغة الطبيعية
      للأعداد الترتيبية من ثلاثة إلى عشرة في العربية.
  blind_candidates:
    - lemma: "ثَالِثٌ"
      generation_method: ishtiqaq
      justification: >-
        اسم فاعل من الجذر «ث ل ث» على وزن فاعِل، وهو الصيغة القياسية للعدد
        الترتيبي الثالث في العربية. يدلّ على من يشغل المرتبة بعد الثاني.
    - lemma: "ثَالِثَةٌ"
      generation_method: ishtiqaq
      justification: >-
        مؤنّث «ثالث»، يُستعمل عند إرادة تأنيث المرتبة أو الدرجة
        (الدرجة الثالثة، الرتبة الثالثة).
    - lemma: "ثُلْثٌ"
      generation_method: ishtiqaq
      justification: >-
        من الجذر نفسه على وزن فُعْل، لكنّه يدلّ على الكسر (واحد من ثلاثة أجزاء)
        لا على الترتيب. مرشّح للاستبعاد.
    - lemma: "المَرْتَبَة الثَّالِثَة"
      generation_method: tarkib
      justification: >-
        مركب وصفي يجمع بين «المرتبة» (الجنس القريب من المُشْتَرَك الأعلى)
        و«الثالثة» (الفصل النوعي). لكنّه عبارة وصفية حرة لا مصطلح مسكوك.


stage2_evidence:
  per_lemma:
    - lemma: "الثَّالِثُ"
      confirm:
        - text: "«ما يَجِيءُ بعد الثاني مُباشرةً في ترتيب العَدَدِ»"
          source: "المعجم الكبير"
        - text: "«هو ثالِثُ ثَلاثَةٍ: واحدٌ منهم»"
          source: "المعجم الكبير"
        - text: "«(1) ثالث (2) ثُلْثيّ (3) الثالث (4) ثُلْث»"
          source: "المورد الحديث"
      expands:
        - text: "«يُفْدِيكِ ياسُرَّعُ أَبى وخالي * قَدْ مَرَّ يَوْمانِ وهذا الثَّالي * وأَنْتِ بالهَجْرانِ لا تُبَالِي»"
          source: "المعجم الكبير — شاهد شعري"
          addition: "شاهد على الاستعمال الاسمي للعدد الترتيبي مع لام التعريف"

    - lemma: "ثَالِثٌ"
      confirm:
        - text: "«ما يَجِيءُ بعد الثاني مُباشرةً في ترتيب العَدَدِ»"
          source: "المعجم الكبير (مدخل «الثالث»)"
        - text: "«(1) ثالث» — ترجمة third"
          source: "المورد الحديث"

    - lemma: "ثَالِثَةٌ"
      contradicts:
        - text: "«(عند الفَلَكِيين): قِسْمٌ من سِتِّينَ قِسْماً تَنْقَسِمُ إليها الثانِيَةُ»"
          source: "المعجم الكبير"
          conflict: "الثالثة في المعجم الكبير مصطلح فلكي بمعنى وحدة زمنية (1/60 من الثانية)، لا بمعنى المرتبة الثالثة"
        - text: "«عند أهل الهيئة والمنجّمين هي سدس عشر الثانية التي هي سدس عشر الدقيقة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "تأكيد للدلالة الفلكية المتخصصة"
      expands:
        - text: "«ما بين الثانية والرابعة، ومن تأخذ ثلث الشيء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يوسّع الدلالة لتشمل ما بين الثانية والرابعة في الترتيب العام"

    - lemma: "ثُلْثٌ"
      contradicts:
        - text: "«ثُلْثٌ — ترجمة third في المعجم الموحد للرياضيات والفلك»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
          conflict: "ثُلْث يدلّ على الكسر (1/3) لا على الترتيب (المركز الثالث)"

    - lemma: "المَرْتَبَة الثَّالِثَة"
      confirm:
        - text: "«(1) المرتبة الثالثة (2) الدرجة الثالثة [في باخرة إلخ]»"
          source: "المورد الحديث — ترجمة third class"
      contradicts:
        - text: "«(1) المرتبة الثالثة (2) الدرجة الثالثة»"
          source: "المورد الحديث"
          conflict: "العبارة ترجمة لـ third class (الدرجة الثالثة) لا لـ third (الثالث)؛ عبارة وصفية حرة وليست مصطلحاً ثابتاً"


stage3_analysis:
  per_lemma:
    - lemma: "الثَّالِثُ"
      decision: confirmed
      decision_reason: >-
        اللمّة مدعومة بشاهد المعجم الكبير الذي يعرّفها بـ«ما يجيء بعد الثاني مباشرة
        في ترتيب العدد»، وهو مطابق تماماً لدلالة المجموعة. الاستعمال الاسمي للعدد
        الترتيبي مع أل التعريف أسلوب عربي فصيح مألوف. يحتاج المدخل إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة المعرّفة بأل، تُستعمل عند الإشارة إلى مرتبة محددة معهودة في سياق ترتيبي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الثَّالِثُ"

    - lemma: "ثَالِثٌ"
      source: stage1
      decision: confirmed
      decision_reason: >-
        الصيغة النكرة من العدد الترتيبي «ثالث» على وزن فاعل، مؤيَّدة بتعريف
        المعجم الكبير وبالمورد الحديث الذي يوردها ترجمةً أولى لـ third.
        إضافتها تُثري المجموعة بالصيغة المجرّدة من أل التي تُستعمل في
        الإضافة (ثالثُ ثلاثةٍ) وفي السياقات الخبرية (جاء ثالثاً).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة النكرة بدون أل، تُستعمل في الإضافة (ثالثُ ثلاثةٍ) وفي الحال والخبر (جاءَ ثالثاً)"
      actions:
        - command: create_entry
          params:
            lemma: "ثَالِثٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "ثَالِثَةٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        الأدلة المعجمية تُظهر أنّ «الثالثة» بالتأنيث مصطلح فلكي مُتخصّص
        (1/60 من الثانية) في المعجم الكبير وكشّاف الفنون، ولا تدلّ على المرتبة
        الترتيبية بمعناها العام. إضافتها ستُوقع في لبس مع المفهوم الفلكي.

    - lemma: "ثُلْثٌ"
      source: stage1
      decision: removed
      decision_reason: >-
        «ثُلْث» يدلّ على الكسر (واحد من ثلاثة أجزاء) لا على الترتيب.
        المعجم الموحد للرياضيات يؤكد أنّ third بمعنى الكسر = ثُلْث.
        مفهوم المجموعة ترتيبي لا كسري، فلا يصحّ إدراجه.

    - lemma: "المَرْتَبَة الثَّالِثَة"
      source: stage1
      decision: removed
      decision_reason: >-
        عبارة وصفية حرة يمكن إبدال «المرتبة» بـ«الدرجة» أو «المنزلة» وتبقى صالحة
        وصفياً (تفشل في اختبار السكّ). المورد الحديث يوردها ترجمةً لـ third class
        لا لـ third. ليست وحدة معجمية ثابتة.


