    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط."
    observations: "المفهوم اسم عَلَم جغرافي مخصص لكيان مائي محدد، والتسمية العربية الحالية قياسية ومستقرة."
  blind_candidates:
    - lemma: "خَلِيج فِنْلَنْدَا"
      generation_method: tarkib
      justification: "الاسم الجغرافي المباشر المكوّن من مضاف (خليج) ومضاف إليه (الدولة المطلة)."
    - lemma: "الخَلِيج الفِنْلَنْدِيّ"
      generation_method: tarkib
      justification: "تسمية وصفية بنسبة الخليج إلى فنلندا."
    - lemma: "جَوْن فِنْلَنْدَا"
      generation_method: majaz
      justification: "استخدام لفظ 'جون' التراثي الذي يعني الخليج أو الداخل من البحر في اليابس."
    - lemma: "شَرْم فِنْلَنْدَا"
      generation_method: majaz
      justification: "استخدام لفظ 'شرم' الذي يطلق على الخلجان والمداخل البحرية الضيقة."

