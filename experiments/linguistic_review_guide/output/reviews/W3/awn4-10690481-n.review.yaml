      confirm:
        - text: "«البَدِيلُ: الخَلَفُ والعوض، واحد الأبدال عند الصوفية؛ جمعه: أبدال وبُدَلاء»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الْبَاءُ وَالدَّالُ وَاللَّامُ أَصْلٌ وَاحِدٌ، وَهُوَ قِيَامُ الشَّيْءِ مَقَامَ الشَّيْءِ الذَّاهِبِ. يُقَالُ: هَذَا بَدَلُ الشَّيْءِ وَبَدِيلُهُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«بَديل [ج:أَبْدال] — substitute»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«بَدِيل — Substitute»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«بديل — substitute»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      expands:
        - text: "«معلّم بديل — substitute teacher»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "يُثبِت نمط التركيب الوصفي (اسم + بديل) في التعبير عن البديل المتخصص في مجالات عدة، مما يعزز ملاءمة اللفظ في السياق الرياضي"
        - text: "«بديل إجمالي — gross substitute»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "يُظهر اطّراد (بديل) اشتقاقياً في التخصصات الحديثة مركَّباً وصفياً"

    - lemma: "لاعب احتياط"
      confirm:
