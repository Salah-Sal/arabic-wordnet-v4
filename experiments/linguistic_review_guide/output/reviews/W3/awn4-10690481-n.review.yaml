          addition: "يُثبت نمط التركيب (اسم + احتياط) إضافياً للدلالة على الشخص الاحتياطي في مجال الجيش، وهو توازٍ مع السياق الرياضي"
        - text: "«سيارة الاحتياط — reserve car»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "يُظهر اطّراد نمط (اسم + احتياط) الإضافي في اللغة التقنية الحديثة"

    - lemma: "رِدْف"
      confirm:
        - text: "«الرِّدْفُ: الراكِبُ خَلْفَ الراكِبِ، كالمُرْتَدِفِ والرَّديفِ... وجَليسُ المَلِكِ عن يمينِهِ، يَشْرَبُ بعدَهُ، ويَخْلُفُهُ إذا غَزا»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«أَرْدَافُ الْمُلُوكِ فِي الْجَاهِلِيَّةِ: الَّذِينَ كَانُوا يَخْلُفُونَ الْمُلُوكَ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«رَدِيف: من يسرح من الجيش العامل ليكون مدداً في التعبئة العامة»"
