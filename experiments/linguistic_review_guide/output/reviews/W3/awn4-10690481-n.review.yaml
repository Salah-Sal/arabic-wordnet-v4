# ── المرحلة ١: المراجعة والتوليد (أعمى) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (بديل، لاعب احتياط) مكتوبتان بدون تشكيل كامل"
      - "التركيب (لاعب احتياط) يحتاج تحققاً من ثباته المعجمي في المصادر الكلاسيكية"
      - "التعريف العربي الحالي صحيح المضمون لكنه يفتقر إلى أسلوب المعجم (جنس قريب + فصل نوعي)"
    observations: >
      المجموعة تشير إلى اللاعب الاحتياطي في الرياضة الجماعية، وهو من يجلس خارج
      الملعب انتظاراً لدخوله بديلاً عن أحد الأساسيين. المفهوم عربيٌّ راسخٌ في
      الصحافة الرياضية. جذر (ب د ل) يحمل بدقة معنى "قيام الشيء مقام الشيء
      الذاهب" (مقاييس اللغة)، فـ"بديل" مصطلح دقيق ومطّرد. أما "لاعب احتياط"
      فتركيب إضافي شائع في الإعلام الرياضي يُحدِّد الوضع التنظيمي للاعب في قائمة
      الفريق. الفروق الدلالية بين اللمّتين حقيقية ومُسوِّغة للإبقاء على كليهما.
  blind_candidates:
    - lemma: "بَدِيل"
      generation_method: ishtiqaq
      justification: "وزن فَعِيل من جذر (ب د ل)، يدل على من يقوم مقام غيره؛ وهو الوزن المناسب لمعنى الإحلال والتعويض الدائم"
    - lemma: "رِدْف"
      generation_method: majaz
      justification: "الرِّدف في الأصل من يركب خلف الراكب، ثم اتُّسع به مجازاً ليشمل من يَخلُف غيره عند الحاجة؛ وقد استُخدم في الإشارة إلى من يَخلُف الملوك"
    - lemma: "إِحْلَالِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الإحلال (مصدر أحلَّ يُحِلّ)، على المصدر الصناعي، يُشير إلى من يتولى عملية الإحلال في المنافسة"
    - lemma: "احْتِيَاطِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى الاحتياط من جذر (ح و ط)، يُعيَّن مصطلحاً لمن يُحتفظ به احتياطاً، وهو وصف شائع للمورد الاحتياطي في مجالات عدة"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٧ استعلامات):
#   ١. مطابقة دقيقة دفعية — المعاجم الكلاسيكية (ocr + hawramani)
#   ٢. ARABTERM الرياضي — (لاعب احتياط + احتياطي في مجالات ذات صلة)
#   ٣. جسر إنجليزي — substitute, reserve, second-stringer, bench player
#   ٤. إثراء بالمعرّف — تعريفات وأمثلة وجموع (entry_ids: 1481, 868680, 798291)
#   ٥. بحث FTS بالكلمات المفتاحية — استبدل، لاعب بديل، رديف، الاحتياط
#   ٦. مقاييس اللغة — جذور: بدل، حوط، ردف، لعب
