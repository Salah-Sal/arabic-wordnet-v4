# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "بديل"
      decision: confirmed
      decision_reason: >
        لفظ أصيل من جذر (بدل) راسخ في المعجم العربي الكلاسيكي والحديث، يحمل معنى
        "قيام الشيء مقام الشيء الذاهب" (مقاييس اللغة). موثَّق في المعجم الوسيط
        وعشرات مصادر ArabTerm الحديثة بمعنى substitute. مطّرد اشتقاقياً (بديل،
        أبدال، بُدَلاء، إبدال). ملائم تماماً للاعب البديل في الرياضة. يحتاج
        تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز فعل الإحلال ذاته والتعويض الفعلي (الشيء الذي يقوم مقام الآخر)؛
        يُستخدم غالباً في التعليق الرياضي الفوري لحظة دخول اللاعب إلى الملعب،
        وفيه دلالة التعويض الكامل بصرف النظر عن الوضع في قائمة الفريق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَدِيل"

    - lemma: "لاعب احتياط"
      decision: confirmed
      decision_reason: >
        تركيب إضافي (لاعب + احتياط) شائع في الصحافة والإعلام الرياضي العربي
        استخداماً واسعاً موثَّقاً. يُوازي نمط التركيب (جندي احتياط، سيارة
        احتياط) المسجَّل في معاجم ArabTerm. يصف وضع اللاعب في قائمة الفريق
        وصفاً دقيقاً. اجتاز اختبار السكّ: لا يمكن إبدال "احتياط" بمرادف
        (لاعب ذخيرة / لاعب ظهير) بالقدر ذاته من الثبات والشيوع. يحتاج
        تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الوضع التنظيمي للاعب ضمن قائمة الفريق (كونه مُعيَّناً في خانة
        الاحتياط)؛ يُستخدم للإشارة إلى وضعه قبل دخول الملعب وأثناء جلوسه على
        دكة الاحتياط، وفيه دلالة الترقب والانتظار أكثر من دلالة فعل الإحلال.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبُ احْتِيَاطٍ"

    - lemma: "رِدْف"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أصالة اللفظ وثراء دلالته في معنى التتابع والخلافة، إلا أنه لم يُسجَّل
        في أي مصدر حديث للاستخدام الرياضي ولا في إطار أي لعبة جماعية. إحياؤه في
        هذا السياق ينطوي على خطر الالتباس بمعانيه الشعرية (الرِّدف العروضي) وغيرها.
        دلالته مغطاة بـ(بديل).

    - lemma: "إِحْلَالِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر له على توثيق في أي مصدر معجمي، وهو وزن نسبي مصنوع دون سند تراثي
        أو استخدام معاصر موثَّق. دلالته الوظيفية مغطاة تماماً بـ(بديل).

    - lemma: "احْتِيَاطِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        يُستخدم في المعاجم الحديثة صفةً (وصفياً) لا اسماً للشخص؛ فهو يصف المورد
        أو الشيء بكونه احتياطياً. استخدامه اسماً مستقلاً للاعب ضعيف التوثيق.
        دلالته الوظيفية مغطاة بالتركيب (لاعب احتياط).


