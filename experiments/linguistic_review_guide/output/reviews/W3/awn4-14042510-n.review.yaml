# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14042510-n
# sottishness — ذهول ناتج عن الشراب
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ذهول السكر» مركّب إضافي وصفي لا يبدو مصطلحاً مسكوكاً، بل عبارة حرة"
      - "المجموعة تحتوي لمّة واحدة فقط، وهو عدد قليل لمفهوم له جذور عميقة في المعجم العربي"
      - "التعريف العربي «ذهول ناتج عن الشراب» ترجمة حرفية شبه آلية للتعريف الإنجليزي"
    observations: "المفهوم يصف حالة ذهنية محددة: التبلّد والغشاوة الناجمان عن شرب المسكر، وهو نوع فرعي من السُّكْر (الأب المباشر). العربية غنية بمفردات الخمر وأحوال الشاربين، فمن المتوقع وجود ألفاظ مفردة تغطي هذا المعنى دون الحاجة إلى تركيب إضافي."

  blind_candidates:
    - lemma: "خُمْرَة"
      generation_method: ishtiqaq
      justification: "من جذر خ م ر الدالّ على التغطية والمخالطة في ستر؛ والخُمْرَة ما غشي المخمور من أثر الخمر في قلبه وعقله، فهي تدلّ تحديداً على الغشاوة الذهنية الناتجة عن الشراب"
    - lemma: "سُكَار"
      generation_method: ishtiqaq
      justification: "من جذر س ك ر على وزن فُعَال المستعمل في الأحوال والأدواء (كالخُمَار والصُّدَاع)، فيكون دالاً على حالة التبلّد من السُّكْر"
    - lemma: "بَلَادَة السُّكْر"
      generation_method: tarkib
      justification: "مركّب إضافي يجمع بين البلادة (تبلّد الذهن) والسُّكْر (الثمالة)، فيصف تحديداً حالة التغيّب العقلي الناتج عن الشراب"
    - lemma: "تَسَكُّر"
      generation_method: ishtiqaq
      justification: "من جذر س ك ر على وزن تَفَعُّل الدالّ على التكلّف والتدرّج في الصفة، فيكون بمعنى التدرّج في حالة السُّكْر حتى الذهول"


stage2_evidence:
  per_lemma:
    - lemma: "ذُهُولُ السُّكْرِ"
      expands:
        - text: "«الذهول: شغل يورث حزنا ونسيانا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُثبت أن الذهول حالة شغل عن الوعي تورث النسيان، وهو ما ينطبق على أثر السُّكْر"
        - text: "«الذّهول: [في الانكليزية] Stupor, distraction — بالضم وبالهاء يجيء تفسيره في لفظ النسيان»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يؤكد المعادل الإنجليزي Stupor ويربطه بالنسيان"
        - text: "«السُّكْرُ: الغَيْبَة عن تمييز الأشياء بوارد استيلاء سلطان الحال»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يعرّف السُّكْر بالغيبة عن التمييز، مما يدعم المعنى المركّب"
        - text: "«السكر: غفلة تعرض لغلبة السرور على النفس بمباشرة ما يوجبها. وقيل أن لا يعلم السماء من الأرض ولا الطول من العرض»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُظهر أن السُّكر يشمل الذهول التام عن المحسوسات"

    - lemma: "خُمْرَة"
      confirm:
        - text: "«وخُمْرَتُها: ما غَشِيَ المخمورَ من الخُمارِ والسُّكْرِ في قلبه»"
          source: "مقاييس اللغة لابن فارس (نقلاً عن الخليل)"
      expands:
        - text: "«الخاء والميم والراء أصل واحد يدلّ على التغطية والمخالطة في ستر. فالخمر: الشراب المعروف»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر يدلّ على التغطية والستر، والخُمْرَة ما يغطي عقل الشارب ويستره"

    - lemma: "سُكَار"
      contradicts:
        - text: "«السَّكَّارُ: بائعُ السُّكَّر من الخمر والنبيذ وما أشبههما»"
          source: "المعجم الوسيط"
          conflict: "السكّار (بتشديد الكاف) يعني بائع المسكرات لا حالة السُّكْر، ولم يُعثر على سُكَار (بفتح أو ضم) بمعنى حالة التبلّد"

    - lemma: "بَلَادَة السُّكْر"
      expands:
        - text: "«بَلاَدَة: dulling / hebetude / hypothymia»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "البلادة في الاصطلاح الطبي الحديث تعني نقص النشاط الانفعالي، وهو أعمّ من الذهول الناتج عن الشراب تحديداً"
        - text: "«البلادة: يجيء في لفظ الحمق»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "البلادة أقرب إلى الحمق العام منها إلى الذهول الخمري"

    - lemma: "تَسَكُّر"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "ذُهُولُ السُّكْرِ"
      decision: confirmed
      decision_reason: "مركّب إضافي يتوافق مع نمط المصطلحات الطبية المعاصرة (ذُهول تعطيلي، ذُهول جامودي، ذُهول صرعي)، ويصف المفهوم بدقة. وإن لم يكن مسجّلاً في المعاجم التقليدية كوحدة معجمية، فإنه يتبع قياساً إنتاجياً ثابتاً في المصطلحات الطبية العربية."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ذُهُولُ السُّكْرِ"

    - lemma: "خُمْرَة"
      source: stage1
      decision: confirmed
      decision_reason: "ثابتة في مقاييس اللغة نقلاً عن الخليل بمعنى «ما غشي المخمور من الخمار والسكر في قلبه»، وهي تطابق مفهوم المجموعة (stupefaction from drink) تطابقاً دقيقاً. مفردة كلاسيكية تحيي لفظاً عربياً أصيلاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ مفرد كلاسيكي يركّز على الأثر الباطني للخمر في القلب والعقل (الغشاوة والتغطية)، بينما «ذهول السكر» مركّب وصفي يركّز على البُعد الذهني (فقدان الوعي والتمييز)"
      actions:
        - command: create_entry
          params: {lemma: "خُمْرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "سُكَار"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على هذا اللفظ بمعنى حالة التبلّد من السُّكْر في أي معجم. السكّار المسجّل يعني بائع المسكرات، فالاستعمال المقترح غير مسنود معجمياً."

    - lemma: "بَلَادَة السُّكْر"
      source: stage1
      decision: removed
      decision_reason: "البلادة في المعاجم تعني نقص النشاط الانفعالي أو الحمق العام، ولا تختصّ بأثر الشراب. المركّب غير مسجّل ولا يُضيف دقة على «ذهول السكر» الموجود."

    - lemma: "تَسَكُّر"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي شاهد معجمي لهذا اللفظ. وزن تفعّل من سكر غير مسموع في هذا الباب."


