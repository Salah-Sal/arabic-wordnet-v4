      keywords: ["واشنطن", "لانفان", "لنفان", "مخطط المدينة"]
      result: "لا نتائج متعلقة بالمجموعة — النتائج الظاهرة غير صلة (مصطلحات طاقة ومعلوماتية)"

  per_lemma:
    - lemma: "بيير شارل لانفان"
      evidence_status: "no_material_found"

    - lemma: "لانفان"
      evidence_status: "no_material_found"

    - lemma: "بِيير شَارل لَانفَان"
