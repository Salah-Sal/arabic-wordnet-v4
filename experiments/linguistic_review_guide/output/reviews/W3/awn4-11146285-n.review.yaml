# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّتان خاليتان من التشكيل الكامل؛ وإن كانت أسماء الأعلام الأعجمية لا تُشكَّل عادةً في المعاجم، فإن قاعدة التشكيل الإلزامي في المنظومة تستوجب إضافة الحركات لتوحيد الضبط."
      - "اللمّة 'لانفان' مبتورة (لقب فقط) وتفتقر إلى سياق يربطها بالمجموعة خارج قاعدة البيانات."
      - "المجموعة لا تحتوي إلا على لمّتين، في حين أن الاسم الإنجليزي يُستخدم بثلاث صيغ (L'Enfant / Charles L'Enfant / Pierre Charles L'Enfant)؛ صيغة 'شارل لانفان' العربية قد تكون وجيهة."
      - "التعريف العربي الحالي قريب من الترجمة الحرفية للإنجليزية، ويمكن صياغته بأسلوب المعجم العربي."
    observations: >
      هذه المجموعة تخص اسم علم لشخص تاريخي بعينه، وهو المُعَمَّارِيّ الفرنسي-الأمريكي بيير شارل لانفان (Pierre Charles L'Enfant)
      واضع مخطط مدينة واشنطن العاصمة. أسماء الأعلام الأعجمية لا تخضع لمنهجية الاشتقاق أو المجاز أو التركيب الاصطلاحي،
      بل تُعالَج حصراً بالتعريب الصوتي (التعريب). اللمّتان الموجودتان صحيحتان في جوهرهما: الأولى تمثّل الاسم الثلاثي الكامل
      والثانية اللقبَ العائلي المختصر. التحدي هنا ليس في المصطلحية بل في توحيد الضبط وإثراء التعريف بأسلوب موسوعي أرقى.

  blind_candidates:
    - lemma: "بِيير شَارل لَانفَان"
      generation_method: taarib
      justification: >
        الاسم الثلاثي الكامل للمعماري (Pierre Charles L'Enfant) مُعرَّبٌ صوتياً.
        بيير = تعريب Pierre الفرنسي، شارل = تعريب Charles، لانفان = تعريب L'Enfant.
        هذا هو الشكل المعجمي الأتمّ والأصوب للإحالة الرسمية.
    - lemma: "لَانفَان"
      generation_method: taarib
      justification: >
        اللقب العائلي وحده (L'Enfant) مُعرَّباً. شائع في الإحالات المختصرة بالعربية
        على غرار التقليد الإنجليزي في قول "L'Enfant" للإشارة للشخص في السياقات العلمية.
    - lemma: "بِيير لَانفَان"
      generation_method: taarib
      justification: >
        صيغة مختصرة تجمع الاسم الأول واللقب فقط (Pierre L'Enfant)، تُستخدم أحياناً
        في بعض المصادر العربية كصيغة توسطية بين الاسم الكامل ومجرد اللقب.
    - lemma: "شَارل لَانفَان"
      generation_method: taarib
      justification: >
        تعريب الصيغة الفرنسية المتداولة (Charles L'Enfant) التي تُستعمل في المصادر
        الفرنسية والعربية المنقولة عنها إذ يُقدَّم باسم شارل لا بيير في بعض المراجع الأوروبية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
