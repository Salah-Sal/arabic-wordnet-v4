    - lemma: "شَارل لَانفَان"
      source: stage1
      evidence_status: "no_material_found"

  evidence_note: >
    غياب الأدلة متوقَّع تماماً: المجموعة تخص اسم علم لشخصية تاريخية أجنبية، ولا يُنتظر من
    المعاجم اللغوية العربية الكلاسيكية أو معاجم المصطلحات أن تتضمن مدخلاً بهذه التعريبات.
    المراجع ذات الصلة هي الموسوعات والمصادر التاريخية لا المعاجم اللغوية.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "بيير شارل لانفان"
      decision: confirmed
      decision_reason: >
        الصيغة الكاملة الرسمية للاسم الثلاثي المُعرَّب صوتياً لـ Pierre Charles L'Enfant.
        مقبولة معجمياً بوصفها التعريب الأتمّ والأكثر دقةً في التعريف والسياقات الأكاديمية.
        تحتاج إضافة تشكيل لتوحيد الضبط.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      nuance_differentiation: "الصيغة الكاملة الثلاثية (اسم + اسم وسط + لقب)؛ تُستخدم في التعريف الرسمي والإحالات الأكاديمية التخصصية."
      morphological_check: >
        تعريب مزجي من ثلاثة مكوّنات أعجمية (فرنسية الأصل): لا ينطبق عليه الفحص الصرفي
        للأوزان العربية. التعريب الصوتي مطّرد.
      borrowing_check:
        lexical_borrowing: "معرَّب (اقتراض لفظي مقبول لأسماء الأعلام)"
        calque_risk: "لا ينطبق — اسم علم لا مفهوم مجرد"
        conceptual_accuracy: "التعريب يعكس النطق الفرنسي بدقة معقولة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِيير شَارل لَانفَان"

    - lemma: "لانفان"
      decision: confirmed
      decision_reason: >
        اللقب العائلي المختصر (L'Enfant) المُعرَّب، وهو الشكل الأكثر تداولاً في الإحالات
        العلمية المختصرة. يُكمل الصيغة الكاملة دون تكرارها. تحتاج إضافة تشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب العائلي وحده (Surname-only form)؛ يُستخدم في الإحالات المختصرة والتعريف الضمني بعد ذكر الاسم الكامل."
      borrowing_check:
        lexical_borrowing: "معرَّب (مقبول لأسماء الأعلام)"
        conceptual_accuracy: "التعريب يعكس النطق الفرنسي [lɑ̃fɑ̃] بصورة مقبولة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَانفَان"

    # ── مرشحات المرحلة ١ ─────────────────────────────────────

    - lemma: "بِيير شَارل لَانفَان"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة 'بيير شارل لانفان' بعد إضافة التشكيل — تمت معالجته
        بإجراء update_lemma على اللمّة الأصلية. لا حاجة لإنشاء مدخل جديد.

    - lemma: "لَانفَان"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة 'لانفان' بعد إضافة التشكيل — تمت معالجته
        بإجراء update_lemma على اللمّة الأصلية. لا حاجة لإنشاء مدخل جديد.

    - lemma: "بِيير لَانفَان"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة غير مستقرة في المصادر العربية: المدوّنات العربية تستخدم إما الاسم الكامل
        الثلاثي أو اللقب وحده. 'بيير لانفان' لا تُضيف قيمة تمييزية وتُربك القارئ.

    - lemma: "شَارل لَانفَان"
      source: stage1
      decision: removed
      decision_reason: >
        وإن وردت في بعض المصادر الفرنسية، فإنها غير رائجة في المكتبة العربية.
        إضافتها توسّع المجموعة دون مبرر كافٍ؛ الصيغة الكاملة 'بيير شارل لانفان'
        تُغني عنها.


