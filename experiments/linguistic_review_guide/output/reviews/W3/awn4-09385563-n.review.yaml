          root: "قنو"
          maqayis_quote: "«الْقَافُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ... وَالْأَصْلُ الْآخَرُ: الْقَنَا: احْدِيدَابٌ فِي الْأَنْفِ... وَيُمْكِنُ أَنْ تَكُونَ الْقَنَاةُ مِنْ هَذَا، لِأَنَّهَا تُنْصَبُ وَتُرْفَعُ... وَقَنَاةُ الْمَاءِ عِنْدَنَا مُشَبَّهَةٌ بِهَذِهِ الْقَنَاةِ.»"
        - word: "موزمبيق"
          root: null
          maqayis_quote: null
    - lemma: "مَضِيقُ مُوزَمْبِيقَ"
      entry_id: "{auto}"
      roots:
        - word: "مضيق"
          root: "ضيق"
          maqayis_quote: "«الضَّادُ وَالْيَاءُ وَالْقَافُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى خِلَافِ السَّعَةِ، وَذَلِكَ هُوَ الضِّيقُ.»"
        - word: "موزمبيق"
          root: null
          maqayis_quote: null
  per_sense:
