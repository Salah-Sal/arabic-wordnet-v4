        value: '{"roots":[{"word":"مضيق","root":"ضيق","maqayis":"«الضَّادُ وَالْيَاءُ وَالْقَافُ كَلِمَةٌ وَاحِدَةٌ تَدُلُّ عَلَى خِلَافِ السَّعَةِ.»"},{"word":"موزمبيق","root":null}]}'
    - command: set_metadata
