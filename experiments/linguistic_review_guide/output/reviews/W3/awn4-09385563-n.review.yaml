    - lemma: "مَضِيقُ مُوزَمْبِيقَ"
      sense_id: "{auto}"
      nuance: "تستخدم للدلالة على الممر المائي بصفته 'مضيقاً' (Strait) يربط بين أجزاء المحيط الهندي."
      mwe: true
