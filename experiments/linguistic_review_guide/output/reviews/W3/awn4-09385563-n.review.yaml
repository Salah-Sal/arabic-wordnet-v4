stage1_review:
  assessment:
    concerns:
      - اللمّات الحالية تفتقر إلى التشكيل الكامل.
      - عدم وجود تعريف موسوعي يوضح الأبعاد الجغرافية أو الأهمية الملاحية.
    observations: "المجموعة تمثل معلماً جغرافياً محدداً (قناة موزمبيق). اللمّات المستخدمة حالياً هي الترجمات المعيارية للمصطلح الإنجليزي 'Mozambique Channel'. استخدام 'قناة' هنا يعبر عن الممر المائي العريض، بينما 'مضيق' يعبر عن المفهوم الجيومورفولوجي للممر بين يابستين."
  blind_candidates:
    - lemma: "قَنَاةُ مُوزَمْبِيقَ"
      generation_method: tarkib
      justification: "الاسم الجغرافي المعياري في اللغة العربية للممر المائي المشار إليه في التعريف."
    - lemma: "مَضِيقُ مُوزَمْبِيقَ"
      generation_method: tarkib
      justification: "تسمية بديلة شائعة تعامل القناة كأنها مضيق مائي بين مدغشقر وأفريقيا."
    - lemma: "مَجْرَى مُوزَمْبِيقَ"
      generation_method: tarkib
      justification: "تعبير وصفي يستخدم أحياناً في السياقات الملاحية للإشارة إلى المسار المائي في تلك المنطقة."
    - lemma: "بَحْرُ مُوزَمْبِيقَ"
      generation_method: tarkib
      justification: "يستخدم أحياناً للإشارة إلى المسطح المائي الواسع بين مدغشقر واليابسة الأفريقية."

stage2_evidence:
  per_lemma:
    - lemma: "مُوزَمْبِيق"
      confirm:
        - text: "موزمبيق - Mozambique"
          source: "المكنز الزراعي متعدد اللغات"
        - text: "موزمبيق من الشرق والشمال الشرقى"
          source: "المعجم الكبير (في تعريف زيمبابوي)"
    - lemma: "قَنَاة"
      confirm:
        - text: "قناة: مجرى مائي طبيعي أو اصطناعي يحتوي على ماء جار"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
        - text: "قناة الماء"
          source: "المعجم الوسيط (في تعريف المفتح)"
    - lemma: "مَضِيق"
      confirm:
        - text: "مضيق الوادى"
          source: "المعجم الوسيط (في تعريف المخنة)"
        - text: "دفعه في مضيق"
          source: "المعجم الوسيط (في تعريف زحمه)"

stage3_analysis:
  per_lemma:
    - lemma: "قناة موزمبيق"
      decision: confirmed
      decision_reason: "الاسم الأكثر شيوعاً ومعيارية في الجغرافيا العربية لهذا الممر المائي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَنَاةُ مُوزَمْبِيقَ"
    - lemma: "مضيق موزمبيق"
      decision: confirmed
      decision_reason: "مرادف صحيح يستخدم في الكتب الجغرافية والموسوعات العربية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَضِيقُ مُوزَمْبِيقَ"

stage4_content:
  definition:
    current: "ذراع من المحيط الهندي بين مدغشقر وجنوب شرق أفريقيا"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق ومباشر ويترجم المفهوم الإنجليزي بدقة."
    authored:
      - type: encyclopedic
        text: "ممر مائي عريض يقع في غرب المحيط الهندي، يفصل بين جزيرة مدغشقر والساحل الجنوبي الشرقي للقارة الأفريقية، ويُعد من أطول القنوات المائية في العالم."
  examples:
    per_lemma:
      - lemma: "قَنَاةُ مُوزَمْبِيقَ"
        examples:
          - text: "تُعتبر قناة موزمبيق ممراً ملاحياً استراتيجياً لناقلات النفط المتجهة من الخليج العربي إلى أوروبا."
            type: usage
      - lemma: "مَضِيقُ مُوزَمْبِيقَ"
        examples:
          - text: "يتميز مضيق موزمبيق بتيارات مائية قوية تؤثر على حركة الملاحة البحرية في المنطقة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تقع جزر القمر في المدخل الشمالي لقناة موزمبيق."

