# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-09636148-n  |  ILI: i87186  |  POS: n
# المفهوم: فلاح إيطالي (contadino)
# تاريخ المراجعة: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مزارع إيطالي» تفتقر إلى التشكيل الكامل"
      - "اللمّة تركيب وصفي حرّ وليست مصطلحاً مسكوكاً في معاجم متخصصة"
      - "التعريف الحالي «فلاح أو مزارع» يستخدم مترادفَيْن في الجنس القريب بدلاً من جنس واحد محدد"
      - "المجموعة تفتقر إلى لمّة ثانية تُعبِّر عن البُعد الريفي التقليدي للفلّاح الإيطالي (contadino)"
    observations: >
      المجموعة تصف فئة بشرية جغرافية-مهنية محددة: الفلاح الإيطالي (contadino).
      المقابل العربي الطبيعي تركيب وصفي (مُضاف إليه + نعت)، إذ لا تمتلك العربية مفردة جذرية
      واحدة خاصة بالفلاح الإيطالي دون غيره. جذر «فلح» يحمل دلالة الشق والحرث الأصيلة،
      وجذر «زرع» يحمل دلالة الزراعة والتنمية. كلاهما صالح للتعبير عن هذا المفهوم،
      غير أن «فلاح» أكثر حضوراً في المعاجم الكلاسيكية والمعاصرة للدلالة على الريفي المحترف.

  blind_candidates:
    - lemma: "فَلَّاحٌ إِيطَالِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «فَلَّاح» (محترف الفلاحة، جذر فلح = شقّ الأرض)
        و«إِيطَالِيّ» (نسبة إلى إيطاليا). يُعبِّر عن البُعد الريفي التقليدي
        للكلمة الإيطالية contadino، ويُميِّزه عن «مزارع» بدلالة الحِرفة الموروثة.

    - lemma: "زَرَّاعٌ إِيطَالِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «زَرَّاع» (صيغة مبالغة من زرع = من حرفته الزراعة)
        و«إِيطَالِيّ». يُركِّز على نشاط الزراعة كحرفة متقنة ومتكررة،
        ويُمكن أن يكون بديلاً عن «مزارع إيطالي».

    - lemma: "كُونْتَادِينُو"
      generation_method: taarib
      justification: >
        تعريب مباشر للكلمة الإيطالية contadino، وهي المصطلح الأصلي في اللغة المصدر.
        تقبل الكلمة لام التعريف (الكونتادينو) والجمع السالم (كونتادينون).
        تُستخدم كمصطلح ثقافي في الأدب والعلوم الاجتماعية العربية أحياناً.

    - lemma: "رَيِّفِيٌّ إِيطَالِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «رَيِّفِيّ» (نسبة إلى الريف، جذر ريف = خِصب وعمران)
        و«إِيطَالِيّ». يُركِّز على الانتماء المكاني الريفي لا على الحرفة الزراعية،
        مما يجعله أشمل دلالةً من «فلاح» و«مزارع».


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   [Q1] مطابقة دفعية للمّات + المرشحات (headword_norm IN ...)
#   [Q2] جسر إنجليزي (contadino / Italian farmer / peasant farmer) → لا نتائج
#   [Q3] FTS عربي بكلمات مفتاحية (إيطالي، إيطاليا، كونتادينو) → لا يخص المفهوم
#   [Q4] مقاييس اللغة للجذور فلح، زرع، ريف
stage2_evidence:
  per_lemma:

    - lemma: "مزارع إيطالي"
      expands:
        - text: >
            «شخص يعمل في الزراعة وتربية الكائنات الحية بهدف إنتاج مواد غذائية
            للإنسان والحيوان أو أزهار للزينة أو أعشاب عطرية أو توابل أو أعشاب طبية
            أو مواد أولية لصناعة الملابس أو الورق أو غيرها.»
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO-ArabTerm)"
          addition: "يُثبّت «مزارع» كمصطلح موحّد للفلاح/المزارع مع translation_en=farmer"
        - text: "«من مهنته زراعة الأرض»"
          source: "مسرد ALECSO-ArabTerm (مصطلحات متعددة)"
          addition: "تعريف موجز يؤكد المهنة الزراعية"

    - lemma: "فَلَّاحٌ إِيطَالِيٌّ"
      confirm:
        - text: "«مَنْ حِرْفَتُه الفِلاحةُ»"
          source: "المعجم الوسيط (OCR)"
        - text: "«محترف الفلاحة مَلَّاحُ السفينة»"
          source: "المعجم الوسيط (OCR) — entry_id=22063"
        - text: "«فَلَّاح: محترف الفلاحة، ومَلَّاح السفينة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
      expands:
        - text: "translation_en: peasant | translation_fr: paysan"
          source: "مسرد الجغرافيا والتاريخ (ALECSO-ArabTerm) — entry_id=500853"
          addition: "يرادف «contadino» الإيطالية في المعنى: peasant/paysan"
        - text: "translation_en: farmer | translation_fr: fermier; cultivateur"
          source: "المعجم الموحد لمصطلحات علم الأحياء 1993 (ALECSO-ArabTerm) — entry_id=453667"
          addition: "يُثبِّت الاستخدام المعياري الموحَّد لـ«فلاح» مقابل farmer في المعاجم العلمية"

    - lemma: "زَرَّاعٌ إِيطَالِيٌّ"
      confirm:
        - text: "«من يزرع الأرضَ، والنَّمَّام»"
          source: "المعجم الوسيط (OCR) — entry_id=12124"
        - text: "«زَرَّاع: من (ز ر ع) معالج الزرع، والنمام الذي يزرع الأحقاد في قلوب الأحباء»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani) — entry_id=926950"

    - lemma: "كُونْتَادِينُو"
      evidence_status: "no_material_found"

    - lemma: "رَيِّفِيٌّ إِيطَالِيٌّ"
      contradicts:
        - text: "translation_en: rural | domain: Sociology and Anthropology"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO-ArabTerm) — entry_id=399562"
          conflict: >
            «ريفي» صفة بمعنى (rural = ينتمي إلى الريف) وليست اسماً للفلاح.
            لا تدل على الحرفة الزراعية بل على الانتساب المكاني، مما يجعلها خارج الدلالة المطلوبة.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مزارع إيطالي"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة ووافية؛ «مزارع» مصطلح معياري موحَّد في ALECSO بمعنى farmer/agriculteur،
        والتركيب الوصفي مع «إيطالي» سليم ومفهوم. المشكلة الوحيدة غياب التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على الوظيفة الاقتصادية (الزراعة كمهنة ومصدر إنتاج)؛ جذر «زرع» يحمل
        دلالة التنمية والإنبات. أكثر شيوعاً في السياقات الرسمية والتقنية الحديثة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُزَارِعٌ إِيطَالِيٌّ"

    - lemma: "فَلَّاحٌ إِيطَالِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        «فلاح» ثابت في المعاجم الكلاسيكية والحديثة بمعنى محترف الفلاحة، ويُقابل تحديداً
        المعنى المُراد من «contadino» الإيطالية (peasant/paysan). يُضيف للمجموعة بُعداً
        دلالياً مميزاً: الطابع الريفي التقليدي للحرفة الموروثة. الأدلة المعجمية وافرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على البُعد الريفي التقليدي والحرفة الموروثة؛ جذر «فلح» يحمل دلالة شقّ الأرض
        والحرث (ولذلك سُمِّي الأكَّار فلَّاحاً وفق ابن فارس). يُستخدم في السياقات الأدبية
        والتاريخية والأنثروبولوجية أكثر من السياقات التقنية.
      actions:
        - command: create_entry
          params:
            lemma: "فَلَّاحٌ إِيطَالِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "زَرَّاعٌ إِيطَالِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «زرّاع» يشترك مع «مزارع» في الجذر (زرع) وفي الدلالة الجوهرية. وجود المصطلحَيْن
        في مجموعة واحدة يُفضي إلى ترادف مطلق مع تمايز دلالي ضعيف جداً.
        المجموعة الترادفية مكتفية بـ«مزارع» و«فلاح» معاً.

    - lemma: "كُونْتَادِينُو"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية في قاعدة البيانات. التعريب هو الملاذ الأخير، والتركيبان العربيان
        «مزارع إيطالي» و«فلاح إيطالي» يؤدِّيان المعنى المطلوب بيُسر وفصاحة.
        لا مسوِّغ لاقتراض اللفظ الإيطالي.

    - lemma: "رَيِّفِيٌّ إِيطَالِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «ريفي» صفة بمعنى (rural) لا اسم لصاحب الحرفة الزراعية. لا يجتاز اختبار الاستبدال
        دلالياً: «الريفي الإيطالي» أشمل من «الفلاح الإيطالي». الأدلة المعجمية تناقض الاستخدام.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فلاح أو مزارع من إيطاليا"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يستخدم مترادفَيْن في الجنس القريب («فلاح أو مزارع») دون تمييز،
        مما يُولِّد دوراناً جزئياً. بُعد الانتساب الجغرافي صحيح لكنه مُصاغ بأسلوب
        وصفي بسيط لا يُوفِّر فصلاً نوعياً. يحتاج إلى تعريف اصطلاحي جنس+فصل.

    authored:
      - type: terminological
        text: >
          مَنْ يحترف الزراعةَ ويقوم بحراثة الأرض وزرعها في الريف الإيطالي
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false

      - type: encyclopedic
        text: >
          الفلاح الريفي في إيطاليا؛ وهو مصطلح يُشير تاريخياً إلى السكان الزراعيين
          في الأرياف الإيطالية، ولا سيما في جنوب إيطاليا وصقلية، وقد اقترن بظاهرة
          الهجرة الإيطالية إلى الأمريكتَيْن في أواخر القرن التاسع عشر ومطلع العشرين.

    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْ يحترف الزراعةَ ويقوم بحراثة الأرض وزرعها في الريف الإيطالي"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: >
            الفلاح الريفي في إيطاليا؛ وهو مصطلح يُشير تاريخياً إلى السكان الزراعيين
            في الأرياف الإيطالية، ولا سيما في جنوب إيطاليا وصقلية، وقد اقترن بظاهرة
            الهجرة الإيطالية إلى الأمريكتَيْن في أواخر القرن التاسع عشر ومطلع العشرين.

  examples:
    per_lemma:
      - lemma: "مُزَارِعٌ إِيطَالِيٌّ"
        examples:
          - text: >
              رَسَمَتِ الرِّوايةُ صورةً حيَّةً لمُزَارِعٍ إيطاليٍّ في سُهول توسكانا،
              يَشقُّ أرضَهُ كلَّ صباحٍ بالمِحراث قبل أن يَتغلغل الضبابُ في الوديان.
            type: usage

      - lemma: "فَلَّاحٌ إِيطَالِيٌّ"
        examples:
          - text: >
              هاجَرَ كثيرٌ من الفلَّاحين الإيطاليين إلى الأمريكتَيْن مطلعَ القرن
              الماضي، هرباً من شظَف العيش وضيق الأراضي الزراعية في جنوب إيطاليا.
            type: usage

    actions:
