          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يذكر معاني فيزيائية وبدنية أولاً؛ المعنى الفلسفي ليس الغالب"

    - lemma: "اسْتِعْدَاد"
      confirm:
        - text: "«الاستعداد: لغة، طلب التأهب، وعرفا كون الشيء بالقوة القريبة أو البعيدة متهيأ إلى الفعل.»"
