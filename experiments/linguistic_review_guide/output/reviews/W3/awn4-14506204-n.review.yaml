          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الاستعداد أخصّ من القوة الكامنة: هو تهيؤ مشروط بزوال الموانع، لا إمكان كامن ذاتي"

    - lemma: "كُمُونِيَّة"
      confirm:
