stage1_review:
  assessment:
    concerns:
      - "اللمّة «إمكانية» مشتركة مع المجموعة الأعلى (awn4-14505513-n) مما يولّد التباساً دلالياً بين المستويين"
      - "اللمّة «قدرة كامنة» عبارة وصفية حرة وليست مصطلحاً معجمياً ثابتاً — تفشل في اختبار السكّ"
      - "اللمّة «كمون» متعددة الدلالة: الاستتار، الكمون الفيزيائي (potential)، ونبات الكمّون (cumin)"
    observations: "المجموعة تمثّل مفهوم القوة الكامنة (potentiality) في مقابل الفعل (actuality)، وهو مفهوم متجذّر في الفلسفة الإسلامية منذ ترجمات أرسطو. المصطلح الفلسفي الأصيل هو «القوة» مقابل «الفعل»، لكن شدة اشتراكه اللفظي تجعله غير عملي كلمّة معجمية مستقلة. المصدر الصناعي «كمونيّة» مسجّل في المورد الحديث ترجمةً لـ potentiality وهو أدقّ من «كمون» المجرّد."
  blind_candidates:
    - lemma: "قُوَّة"
      generation_method: ishtiqaq
      justification: "من جذر ق-و-ي، المصطلح الفلسفي الأرسطي لمفهوم الإمكان الكامن (δύναμις)، يقابل «الفعل» (ἐνέργεια). مستعمل في كشّاف التهانوي ودستور العلماء بمعنى إمكان حصول الشيء مع عدم حصوله بالفعل."
    - lemma: "اسْتِعْدَاد"
      generation_method: ishtiqaq
      justification: "من جذر ع-د-د على وزن استفعال، بمعنى التهيؤ والقابلية الكامنة. يُعرَّف في الاصطلاح بأنه كون الشيء بالقوة القريبة أو البعيدة متهيأً إلى الفعل."
    - lemma: "كُمُونِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «كمون» + -يَّة، يخصّص المفهوم المجرّد للإمكان الكامن. مسجّل في المورد الحديث (2008) ترجمةً لـ potentiality."
    - lemma: "إِمْكَان"
      generation_method: ishtiqaq
      justification: "من جذر م-ك-ن على وزن إفعال، مصطلح فلسفي بمعنى عدم اقتضاء الذات للوجود والعدم. قريب من المفهوم لكن أعمّ منه."

