stage1_review:
  assessment:
    concerns:
      - "اللمّة «واقع» موجودة أيضاً في المجموعة الأعلى (awn4-13978104-n) مما يُحدث تداخلاً بين الأمّ والبنت"
      - "اللمّة «واقعية» تُستخدم في المعاجم العربية أساساً بمعنى المذهب الفلسفي/الأدبي (realism كحركة) لا بمعنى حالة كون الشيء حقيقياً (realness)"
      - "التعريف العربي «حالة كونه فعلياً أو حقيقياً» ترجمة حرفية من الإنجليزية، يحتاج صياغة معجمية أصيلة"
    observations: "المجموعة تمثّل مفهوماً فلسفياً مجرداً (حالة الوجود الحقيقي مقابل الوَهْم أو الخيال). الجذر «حقق» هو الأنسب للتعبير عن هذا المفهوم في العربية، إذ يدلّ على إحكام الشيء وصحّته وثبوته. أمّا الجذر «وقع» فدلالته الأصلية على السقوط والحصول، وانتقاله إلى معنى الواقع (reality) انتقال مجازي حديث نسبياً."
  blind_candidates:
    - lemma: "حَقَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «حَقّ» على وزن فَعَالِيَّة، يدلّ على حالة كون الشيء حقّاً ثابتاً، أي صفة الحقّيّة المجردة"
    - lemma: "يَقِين"
      generation_method: majaz
      justification: "مجاز مرسل من العلاقة اللزومية: اليقين يلزم ما هو حقيقي ثابت، فأُطلق اسم الأثر المعرفي على الحالة الوجودية"
    - lemma: "عَيَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «عِيَان» (المشاهدة بالعين)، يدلّ على حالة الوجود المحسوس المباشر مقابل الغيب والوَهْم"
    - lemma: "تَحَقُّق"
      generation_method: ishtiqaq
      justification: "مصدر تفعُّل من «حَقَّقَ»، يدلّ على صيرورة الشيء حقيقةً ووقوعه فعلاً، أي حالة كونه قد تحقّق"


stage2_evidence:
  per_lemma:
    - lemma: "حَقِيقَة"
      confirm:
        - text: "«(الحَقِيقَة) الشَّيْء الثَّابِت يَقِينا و(عِنْد اللغويين) مَا اسْتُعْمِل فِي مَعْنَاهُ الأَصْلِيّ وَحَقِيقَة الشَّيْء خالِصُه وكُنْهُه وَحَقِيقَة الأَمْر يَقِين شَأْنه»"
          source: "المعجم الوسيط"
        - text: "«وُجُوبُ الأَمْرِ وأَحِقِيَّتُه ... في الفَلْسَفَةِ: مُطابَقَةُ الفِكْرِ للواقع»"
          source: "المعجم الكبير"
        - text: "«حقيقة الشيء ما به الشيء هو هو كالحيوان الناطق للإنسان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«الحَقِيقَة: هِيَ اللَّفْظ الْمُسْتَعْمل فِيمَا وضع لَهُ فِي اصْطِلَاح التخاطب»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "دلالة اصطلاحية لغوية (الحقيقة مقابل المجاز) غير المعنى الوجودي المطلوب هنا"
        - text: "«الحَقِيقَةُ الشَّرْعِيَّةُ: هي اللَّفْظَةُ التي يُسْتَفادُ - من جِهَةِ الشَّرْعِ - وَضْعُها لمعنًى غيرِ ما كانت تَدُلُّ عليه في أَصْلِ وضْعِها اللُّغويِّ»"
          source: "المعجم الكبير"
          addition: "دلالة شرعية بلاغية إضافية لا تتعلق بالمفهوم الوجودي"

    - lemma: "وَاقِع"
      confirm:
        - text: "«الواقع: عند الحكماء والمتكلّمين هو الخارج»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الْوَاقِع: اعْلَم أَن فِي تَفْسِير الْوَاقِع وَنَفس الْأَمر اخْتِلَافا... وَقيل إنَّهُمَا عبارتان عَن الْعقل الفعال»"
          source: "دستور العلماء للأحمدنكري"
      contradicts:
        - text: "«(الْوَاقِع) الَّذِي ينقر الرَّحَى (ج) وقعه وَالْحَاصِل يُقَال أَمر وَاقع وطائر وَاقع إِذا كَانَ على شجر أَو نَحوه»"
          source: "المعجم الوسيط"
          conflict: "المعنى الأصلي في الوسيط هو اسم فاعل من وقع (السقوط/الحصول) لا اسم لحالة مجردة. استعماله بمعنى reality انتقال دلالي حديث"
      expands:
        - text: "«الواقع: عند المتكلمين: هو اللوح المحفوظ، وعند الحكماء: هو العقل الفعال»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "دلالة فلسفية كلامية خاصة تختلف عن المعنى العام المعاصر"

    - lemma: "وَاقِعِيَّة"
      contradicts:
        - text: "«(الواقعية) (فِي الفلسفة) مَذْهَب يلْتَزم فِيهِ التَّصْوِير الأَمين لِمَظَاهر الطبيعة والحياة كَمَا هِيَ وَكَذَلِكَ عرض الآراء والأحداث والظروف والملابسات دون نظر مثالي (مج) وَمذهب أدبي يعْتَمد على الوقائع ويعنى بتصوير أَحْوَال الْمُجْتَمع (مو)»"
          source: "المعجم الوسيط"
          conflict: "الواقعية في المعاجم العربية تعني المذهب الفلسفي/الأدبي (realism كحركة) لا حالة كون الشيء واقعياً (realness)"
      expands:
        - text: "«(1) الحقيقيّة؛ الواقعيّة (2) حقيقة؛ واقع. in reality: في الحقّ؛ في الواقع»"
          source: "المورد الحديث"
          addition: "القاموس ثنائي اللغة يقبل الواقعية كترجمة لـ reality لكنه قاموس ترجمة لا تعريف"

    - lemma: "حَقَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "يَقِين"
      contradicts:
        - text: "«(الْيَقِين) الْعلم الَّذِي لَا شكّ مَعَه و(فِي الفلسفة) اطمئنان النَّفس إِلَى حكم مَعَ الاعْتِقَاد بِصِحَّتِهِ»"
          source: "المعجم الوسيط"
          conflict: "اليقين حالة معرفية إدراكية (علم بلا شك) لا حالة وجودية (كون الشيء حقيقياً). الفارق بين المستوى الإبستمولوجي والأنطولوجي"

    - lemma: "عَيَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "تَحَقُّق"
      contradicts:
        - text: "«(تحقق) الأَمر صَحَّ وَوَقع وَالأَمر عرف حَقِيقَته»"
          source: "المعجم الوسيط"
          conflict: "التحقق مصدر فعلي يدلّ على حدث (صيرورة الشيء حقيقة أو التثبت منه = verification) لا على حالة ثابتة (كون الشيء حقيقياً)"


