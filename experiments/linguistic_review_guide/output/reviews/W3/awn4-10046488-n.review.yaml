    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية عن الإنجليزية فيه تراكيب أعجمية (تم إلغاؤها من قبل)، ويفتقر إلى الجنس القريب الواضح والفصل النوعي المنهجي."
    authored:
      - type: terminological
        text: "رتبةٌ كهنوتيةٌ صُغرى في الكنيسة الغربية قبل إصلاحها، كان صاحبها يتولى حراسة أبواب الكنيسة وفتحها وإغلاقها، وهي أدنى الرُّتَب الصغرى المقدسة، وقد ألغتها الكنيسة الكاثوليكية الرومانية."
