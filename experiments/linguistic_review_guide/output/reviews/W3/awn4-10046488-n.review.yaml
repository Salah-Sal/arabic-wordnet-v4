      decision: confirmed
      decision_reason: "لفظ «بَوَّاب» هو المقابل العربي المباشر لـ doorkeeper، والمورد الحديث يستعمله صراحةً في ترجمة ostiary بصيغة «بوّاب الكنيسة». وهو اللفظ العام الذي يشمل السياق الكنسي عند التخصيص بالسياق."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المعنى العام لحافظ الباب، يشمل البوّاب الكنسي والدنيوي والتشريحي. في سياق المجموعة يُخصَّص بالرتبة الكنسية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَوَّاب"

    - lemma: "قَنْدَلَفْت"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ معرّب قديم مسجّل في تكملة المعاجم لدوزي والمورد الحديث، يدل صراحةً على خادم الكنيسة ذي الرتبة الدنيا. وهو أدق من «بواب» في السياق الكنسي إذ لا يشترك مع معانٍ أخرى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح كنسي متخصص يدل على خادم الكنيسة ومُشعل قناديلها، أكثر تخصيصاً من «بوّاب» في السياق الديني المسيحي."
      actions:
        - command: create_entry
          params: {lemma: "قَنْدَلَفْت", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "حِجَابَة"
      source: stage1
      decision: removed
      decision_reason: "الحِجَابَة حرفة الحاجب (بوّاب الملك أو مانع الدخول)، وهي مرتبطة بالسلطة الزمنية في التراث العربي الإسلامي ولا سابقة لاستعمالها في سياق الرتب الكنسية."

    - lemma: "سِدَانَة"
      source: stage1
      decision: removed
      decision_reason: "السِّدَانَة مقصورة معجمياً على خدمة الكعبة أو بيت الصنم، ونقلها إلى الكنيسة يُحدث تشويشاً دلالياً ولا شاهد على هذا الاستعمال."

    - lemma: "بَوَّابِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصدر صناعي غير مسجّل في المعاجم. المعجم الوسيط يسجّل «البِوَابة» (بكسر الباء) بمعنى حرفة البواب، والبَوَّابِيَّة ليست وحدة معجمية ثابتة."


