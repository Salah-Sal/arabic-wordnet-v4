          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "أدنى الدرجات الكهنوتية الصغرى السبع في الكنيسة اللاتينية قبل إصلاحات المجمع الفاتيكاني الثاني (١٩٦٢-١٩٦٥)، وكان المُرسَم فيها يُعهد إليه بحراسة أبواب الكنيسة ودعوة المؤمنين إلى الصلاة وصدّ غير المعمّدين عن الدخول. أُلغيت هذه الرتبة بالرسالة الرسولية «خدمات بعينها» (Ministeria Quaedam) التي أصدرها البابا بولس السادس عام ١٩٧٢."
