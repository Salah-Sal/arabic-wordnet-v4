# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10046488-n
# ostiary / doorkeeper — أدنى الرتب الصغرى المقدسة في الكنيسة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بواب» عامة جداً وتدل على حافظ الباب عموماً، ولا تحمل أي خصوصية كنسية"
      - "التعريف العربي ترجمة حرفية عن الإنجليزية وفيه ركاكة: «تم إلغاؤها الآن من قبل» صياغة أعجمية"
      - "المفهوم متخصص بالكنيسة الغربية (الرتبة الكهنوتية الصغرى) ولا يكفي لفظ «بواب» وحده للتمييز"
      - "اللمّة بدون تشكيل في المصدر"
    observations: "المجموعة الترادفية تشير إلى رتبة كهنوتية دنيا في الكنيسة الكاثوليكية الرومانية قبل إصلاحاتها، كان صاحبها يتولى حراسة أبواب الكنيسة. المفهوم غريب عن الثقافة العربية الإسلامية لكنه موجود في الأدبيات العربية المسيحية. لفظ «بواب» يغطي المعنى العام لكنه لا يميّز الرتبة الكنسية عن البوّاب العادي."
  blind_candidates:
    - lemma: "حِجَابَة"
      generation_method: ishtiqaq
      justification: "من الجذر «حجب»، والحِجَابَة هي ولاية الباب ومنع الدخول، وهي حرفة الحاجب. لكنها تدل على الوظيفة لا على الرتبة الكنسية."
    - lemma: "سِدَانَة"
      generation_method: majaz
      justification: "السِّدَانَة خدمة الكعبة وحجابتها، وفيها إزاحة دلالية من خدمة البيت الحرام إلى خدمة بيت العبادة المسيحي (الكنيسة). لكن الارتباط بالكعبة قد يُشكل."
    - lemma: "بَوَّابِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «بَوَّاب» على وزن فَعَّالِيَّة، للدلالة على الرتبة أو المنصب لا الشخص. لكن المعجم الوسيط يسجّل «البِوَابة» بمعنى حرفة البواب."
    - lemma: "قَنْدَلَفْت"
      generation_method: taarib
      justification: "معرّب من اليونانية κανδηλάπτης (كَنْدِلابْتِس = مُشعل القناديل)، مصطلح مسيحي عربي قديم يُطلق على خادم الكنيسة ذي الرتبة الدنيا."


stage2_evidence:
  per_lemma:
    - lemma: "بَوَّاب"
      confirm:
        - text: "«(البواب) حَافظ الْبَاب وفتحة الْمعدة الموصلة إِلَى الاثْنَي عشري»"
          source: "المعجم الوسيط"
        - text: "«حافظ الباب فتحة المعدة الموصلة إلى الاثنا عَشَرِيّ»"
          source: "المعجم الوسيط (OCR)"
        - text: "«البوّاب؛ الحاجب.» (ترجمة doorkeeper)"
          source: "المورد الحديث"
        - text: "«(1) بوّاب؛ بوّاب الكنيسة (2) القَنْدَلَفْت: رجل من رجال الكنيسة الكاثوليكية ذو مرتبةٍ دنيا.» (ترجمة ostiary)"
          source: "المورد الحديث"
      expands:
        - text: "«بَوَّاب: من (ب و ب) حارس البيت.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكد المعنى العام (حارس البيت) دون تخصيص كنسي"
        - text: "«حافظ الباب (Pylorus): الفُوَّهـة السُّفْلِيّة (اليمنى)...»"
          source: "المعجم الكبير"
          addition: "المعنى الطبي التشريحي (بوّاب المعدة) يُشكّل اشتراكاً لفظياً"

    - lemma: "قَنْدَلَفْت"
      confirm:
        - text: "«قندلفت (باليونانية قندلفتوس) وهي كلمة هجينة مؤلفة من لغتين من الكلمة اللاتينية candela ومن الكلمة اليونانية انثا: بمعنى أشعل. فيكون معنى قندلفت: مشعل القناديل... وخادم الكنيسة»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«(1) بوّاب؛ بوّاب الكنيسة (2) القَنْدَلَفْت: رجل من رجال الكنيسة الكاثوليكية ذو مرتبةٍ دنيا.» (ترجمة ostiary)"
          source: "المورد الحديث"

    - lemma: "حِجَابَة"
      contradicts:
        - text: "«(الْحَاجِب) البواب (صفة غالبة)... والعظم الَّذِي فَوق الْعين...»"
          source: "المعجم الوسيط"
          conflict: "الحاجب يُستعمل بوّاباً عاماً أو بوّاب الملك خاصة، والحِجَابَة حرفة الحَجْب لا رتبة كنسية"
        - text: "«الحاجب: من يمنع الوارثَ عن أخذ الفرائض... وأيضاً البوَّاب وقيل: خاصٌ ببوَّاب الملك.»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "الحاجب مرتبط بالسلطة الزمنية (بوّاب الملك) لا بالرتب الكنسية"

    - lemma: "سِدَانَة"
      contradicts:
        - text: "«(السِّدَانَة) الحِجَابَة خِدْمَةُ الكَعْبَة»"
          source: "المعجم الكبير"
          conflict: "السدانة مقصورة على خدمة الكعبة في الاستعمال المعجمي، ونقلها إلى الكنيسة تكلّف غير مألوف"
        - text: "«السَّادِنُ: الحاجِبُ خادِمُ الكعبة أو بَيْت الصَّنَم»"
          source: "المعجم الكبير"
          conflict: "السادن خاص بالمعابد الوثنية والكعبة، ولا سابقة لاستعماله في السياق المسيحي"

    - lemma: "بَوَّابِيَّة"
      contradicts:
        - text: "«(البوابة) حِرْفَة البواب»"
          source: "المعجم الوسيط"
          conflict: "البِوَابة (بكسر الباء) هي حرفة البواب لا رتبة كنسية، والبَوَّابِيَّة مصدر صناعي غير مسجّل"


stage3_analysis:
