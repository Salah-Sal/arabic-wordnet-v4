# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة المختصرة «بيل» مُلتبسة: «بيل» في المعاجم الكلاسيكية اسمٌ لنهر وناحيةٍ جغرافية، مما يخلق تضارباً دلالياً مع استخدامها اسمَ عائلةٍ للمخترع."
      - "تصنيف POS = n قياسيٌّ في WordNet للأسماء الشخصية، غير أن المدخل في طبيعته proper_noun — يستحق التوثيق."
      - "اللمّة «بيل» وحدها غير كافية للتعريف الدقيق؛ إذ يتشارك اللقبَ ذاتَه عددٌ من المشاهير (تشارلز بيل مكتشف شلل الوجه، وغيره)."
      - "التعريف الحالي صياغةٌ مترجمة حرفياً من الإنجليزية، يحتاج إلى صياغة موسوعية عربية بأسلوب المعجم الوسيط."
    observations: >
      المجموعة تخصّ عَلَماً شخصياً (proper noun) لمخترع غربي حقبة القرن التاسع عشر.
      المعالجة اللغوية محدودة النطاق: لا اشتقاق ولا مجاز ولا تركيب — الوحيد الممكن هو التعريب
      (نقل الاسم إلى الخط العربي). اللمّتان الموجودتان هما الاسم الكامل والكنية، وكلاهما تعريب.
      المشكلة الجوهرية في «بيل» هي تصادمها مع لفظ عربي قديم مختلف المعنى.

  blind_candidates:
    - lemma: "أَلِكْسَنْدَر غَرَاهَام بِيلْ"
      generation_method: taarib
      justification: >
        النقل الكامل للاسم الثلاثي (الاسم الأول + الاسم الأوسط + اللقب) إلى الخط العربي
        وفق أنظمة النقل الحرفي المعتمدة عربياً؛ هذه الصيغة هي الأكثر تمييزاً وتداولاً في
        المصادر الأكاديمية والموسوعية العربية.
    - lemma: "بِيلْ"
      generation_method: taarib
      justification: >
        الكنية (اللقب) وحدها كصيغة مختصرة شائعة في النصوص العربية الإخبارية والتعليمية
        حين يكون السياق واضحاً، على غرار الإشارة إلى «داروين» أو «نيوتن» بلقبهما فقط.
    - lemma: "أَلِكْسَنْدَر بِيلْ"
      generation_method: taarib
      justification: >
        الاسم الأول مع اللقب دون الاسم الأوسط؛ صيغة وسطى بين الاسم الكامل والكنية المفردة،
        أقل تداولاً من الصيغة الكاملة لكنها أكثر تمييزاً من الكنية وحدها.
    - lemma: "غَرَاهَام بِيلْ"
      generation_method: taarib
      justification: >
        الاسم الأوسط مع اللقب، وهي صيغة نادرة الاستخدام في المصادر العربية لكنها ترد
        أحياناً في إشارات متخصصة، إذ كان المخترع نفسه يُفضّل أن يُعرَّف بـ"Graham Bell".


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  queries_run:
    - id: Q1
      type: batch_headword_lookup
      terms: ["بيل", "البيل", "الكسندر غراهام بيل", "الكسندر بيل", "غراهام بيل", "اليكسندر بيل"]
    - id: Q2
      type: english_bridge
      terms: ["Bell", "Alexander Bell", "Alexander Graham Bell", "Graham Bell"]
    - id: Q3
      type: arabic_fts_keyword
      terms: ["هاتف", "مخترع", "تلفون", "تلغراف", "بيل", "الكسندر"]

  per_lemma:
    - lemma: "ألكسندر غراهام بيل"
      evidence_status: "no_material_found"

    - lemma: "بيل"
      contradicts:
        - text: "«[ب ي ل] بَيْلٌ نَهْرٌ»"
          source: "المحكم والمحيط الأعظم لابن سيده الأندلسي (ت. 1066م)"
          conflict: "«بيل» في هذا المصدر اسم نهر، لا لقب شخص."
        - text: "«بيل: بِيلُ: بالكسر، واللام، قال أبو سعد: ظني أنها من قرى الرّيّ، وقال نصر: بيل ناحية بالري»"
          source: "معجم البلدان لياقوت الحموي (ت. 1229م)"
          conflict: "«بيل» اسم ناحية جغرافية في إقليم الري، وليس لقباً لشخص."
        - text: "«بيل: بِيلٌ، بالكسر: ناحيةٌ بالرَّيِّ»"
          source: "القاموس المحيط للفيروزآبادي (ت. 1414م)"
          conflict: "الدلالة الجغرافية السائدة في المعاجم الكلاسيكية تتعارض مع استخدامه علَماً شخصياً."
        - text: "«بيلٌ … ناحيةٌ بالرَّيِّ … وة بسَرَخْسَ … وة بالسِنْدِ … وفي اللّسان: نَهْرٌ»"
          source: "تاج العروس لمرتضى الزبيدي (ت. 1790م)"
          conflict: "المعاجم الكلاسيكية تُجمع على أن «بيل» لفظٌ عربي للمواضع والأنهار."
      expands:
        - text: "«شَلَلُ بِلْ» — Bell's paralysis (Bell's palsy)"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يكشف هذا المدخل أن الصيغة المستخدمة في الاصطلاح الطبي العربي الحديث لنسب
            الشلل إلى تشارلز بيل هي «بِلْ» (بدون ياء)، لا «بيل» (بالياء)؛ مما يُشير إلى
            تعدد صيغ نقل اللقب ذاته.

    - lemma: "أَلِكْسَنْدَر بِيلْ"
      evidence_status: "no_material_found"

    - lemma: "غَرَاهَام بِيلْ"
      evidence_status: "no_material_found"

  english_bridge_note: >
    الجسر الإنجليزي لـ «Bell» أعاد نتائج متعلقة بالجرس والناقوس (جرس، ناقوس) — ليس
    بالشخص ألكسندر غراهام بيل. هذا مؤشر واضح على غياب ترجمة عربية مخصصة للشخص في
    قواعد المصطلحات المتاحة (ARABTERM).


# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: الاسم الكامل ──
    - lemma: "ألكسندر غراهام بيل"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المُعرَّب هو المصطلح المرجعي الوحيد لهذا الشخص في الموسوعات العربية.
        لا يوجد له بديل عربي أصيل (المفهوم غريب ثقافياً)، وهذه الصيغة هي الأكثر تحديداً
        وتداولاً في المصادر الأكاديمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loan_check:
        type: taarib
        verdict: مقبول
        note: >
          اسم علم أجنبي نُقل إلى الخط العربي بالنقل الحرفي المعتمد. التعريب ضرورة
          لا بديل عنها في حالة الأعلام الشخصية الأجنبية.
      nuance_differentiation: >
        الاسم الرسمي الكامل (الاسم الأول + الأوسط + اللقب)؛ يُستخدم في السياقات
        الأكاديمية والموسوعية والرسمية عند الحاجة إلى التمييز الدقيق عن غيره من
        حاملي اللقب «بيل».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَلِكْسَنْدَر غَرَاهَام بِيلْ"

    # ── لمّة موجودة: الكنية المفردة ──
    - lemma: "بيل"
      decision: removed
      decision_reason: >
        «بيل» وحدها مُلتبسة لأسباب ثلاثة: (أ) في المعاجم العربية الكلاسيكية «بيل» اسم
        نهر وناحية جغرافية، مما يُنشئ تصادماً دلالياً مع استخدامها علَماً شخصياً؛
        (ب) اللقب «Bell» تشترك فيه شخصيات بارزة عدة كتشارلز بيل (مكتشف شلل الوجه)،
        مما يفقدها القدرة التمييزية؛ (ج) المصطلح الطبي العربي الرسمي يستخدم «بِلْ»
        (لا «بيل») للإحالة إلى تشارلز بيل، مما يُضيف التباساً إضافياً.
        لذا يُستحسن الاكتفاء بالاسم الكامل والصيغة المختصرة المُقرَّة أدناه.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: أَلِكْسَنْدَر بِيلْ ──
    - lemma: "أَلِكْسَنْدَر بِيلْ"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الأول مع اللقب (دون الاسم الأوسط) صيغةٌ مشروعة ومتداولة في المصادر
        العربية المختصرة، وتُميّز المخترع بوضوح عن تشارلز بيل صاحب شلل الوجه.
        تُكمّل الاسم الكامل كصيغة ثانوية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loan_check:
        type: taarib
        verdict: مقبول
        note: نقل حرفي معياري للاسم الأجنبي.
      nuance_differentiation: >
        صيغة مختصرة تحذف الاسم الأوسط «غراهام»؛ تُستخدم في الكتابات التعليمية والإعلامية
        حيث لا يكون الاسم الأوسط ضرورياً للتعريف.
      actions:
        - command: create_entry
          params:
            lemma: "أَلِكْسَنْدَر بِيلْ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: غَرَاهَام بِيلْ ──
    - lemma: "غَرَاهَام بِيلْ"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة نادرة في الاستخدام العربي ولا تُميّز الشخص بدرجة كافية. الاكتفاء
        بالاسم الكامل والصيغة المختصرة (أَلِكْسَنْدَر بِيلْ) يُغطي جميع السياقات.


