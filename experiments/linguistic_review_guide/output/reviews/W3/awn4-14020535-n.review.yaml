# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14020535-n
# the state of being a slave — حالة كونه عبداً
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «أسر» تدل أصالةً على الحبس والقيد لا على العبودية بذاتها؛ والأَسْر حالة مؤقتة بخلاف العبودية التي هي حالة قانونية دائمة"
      - "اللمّة «استعباد» مصدر الفعل استعبد، وتدلّ على فعل الاستعباد (الإيقاع) لا على حالة كون المرء عبداً"
      - "التعريف العربي «حالة كونه عبداً» ترجمة حرفية للإنجليزي، والأفضل استخدام مصطلح معجمي دقيق"
    observations: "المجموعة تمثّل مفهوم حالة العبودية (state)، وهو مفهوم عربي أصيل ورد في القرآن والفقه. المصطلحان الأدقّ هما «الرِّقّ» و«العُبُودِيَّة»، وكلاهما مسجّل في المعاجم التراثية بهذه الدلالة تحديداً. أما «أسر» فأصله الشدّ والحبس، و«استعباد» فهو فعل الاسترقاق لا الحالة."
  blind_candidates:
    - lemma: "عُبُودِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «عبد» على وزن فُعُولِيَّة، يدلّ على حالة كون المرء عبداً. ورد في المعجم الوسيط: «العبودية: خلاف الحرية»"
    - lemma: "رِقّ"
      generation_method: ishtiqaq
      justification: "من الجذر ر ق ق، مصطلح فقهي ومعجمي أصيل يدلّ على المِلك والعبودية. قال الجرجاني: «الرقّ عبارة عن عجز حكمي شُرع في الأصل جزاءً عن الكفر»"
    - lemma: "اسْتِرْقَاق"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من ر ق ق، يدلّ على شراء العبيد وامتلاكهم. جاء في المورد الحديث: «الاسترقاق: شراء العبيد وامتلاكهم»"
    - lemma: "عُبُودَة"
      generation_method: ishtiqaq
      justification: "من الجذر ع ب د على وزن فُعُولَة، وهو مصدر أقدم من المصدر الصناعي «عبودية»، ورد في المحيط في اللغة: «الرِّقُّ: العُبُودَة»"


stage2_evidence:
  per_lemma:
    - lemma: "أَسْر"
      contradicts:
        - text: "«الأَسْرُ: الشَّدُّ والعَصْبُ... والأَسِيرُ: الأَخِيذُ، وأصله من ذلك، وكلُّ مَحبوسٍ في قِدٍّ أو سِجنٍ أسيرٌ»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          conflict: "الأَسْر يدلّ على فعل الحبس والقبض، لا على حالة العبودية الدائمة"
        - text: "«(أَسَرَ) الْهَمْزَةُ وَالسِّينُ وَالرَّاءُ أَصْلٌ وَاحِدٌ، وَقِيَاسٌ مُطَّرِدٌ، وَهُوَ الْحَبْسُ، وَهُوَ الْإِمْسَاكُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "أصل المادة الحبس والإمساك، وليس الملك والعبودية"
      expands:
        - text: "«أَسْرٌ: رق، عبودية»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "دوزي يذكر استعمال «أسر» بمعنى الرقّ والعبودية، لكنه استعمال متأخر وليس أصيلاً"

    - lemma: "اسْتِعْبَاد"
      confirm:
        - text: "«(1) استعباد؛ استرقاق (2) إخضاع»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«طراز اِسْتِعْباد: من الإنجليزية القيود والاستعباد، الإكراه»"
          source: "مسرد صناعة النسيج (ArabTerm)"
          addition: "يؤكد استعمال الكلمة بدلالة الإكراه والإخضاع القسري، وهو فعل لا حالة"

    - lemma: "عُبُودِيَّة"
      confirm:
        - text: "«العُبُودِيَّةُ: خِلافُ الحُرِّيَّة»"
          source: "المعجم الوسيط"
        - text: "«العبودية: [في الانكليزية] Slavery, bondage»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«عبودية — servitude»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
        - text: "«عبودية — slavery»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
      expands:
        - text: "«العُبُودِيَّةُ: تَذَلُّلٌ وتبرُّمٌ من الحَوْل والقوة في العبادة»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "في الاستعمال الصوفي تدلّ على التذلّل لله، وهو معنًى مجازيّ لا يتعارض مع الدلالة المعجمية"

    - lemma: "رِقّ"
      confirm:
        - text: "«الرِّقُّ: العُبُودَة، والجميع الرَّقِيقُ»"
          source: "المحيط في اللغة للصاحب بن عباد"
        - text: "«وبالكسرِ: المِلْكُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الرق: في اللغة الضعف... وفي عرف الفقهاء: عبارة عن عجز حكمي شُرع في الأصل جزاءً عن الكفر»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الرِّقُّ: العُبُودِيَّةُ والمِلْكُ»"
          source: "المعجم الكبير"
        - text: "«رق — servitude»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
        - text: "«رق — slavery»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"

    - lemma: "اسْتِرْقَاق"
      confirm:
        - text: "«استرقاق — serfdom»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
      expands:
        - text: "«الاسترقاق: شراء العبيد وامتلاكهم»"
          source: "المورد الحديث (2008)"
          addition: "يدلّ على فعل الاسترقاق (شراء العبيد وتملّكهم) أكثر من دلالته على حالة العبودية ذاتها"

    - lemma: "عُبُودَة"
      confirm:
        - text: "«الرِّقُّ: العُبُودَةُ»"
          source: "المحيط في اللغة للصاحب بن عباد"


stage3_analysis:
  per_lemma:
    - lemma: "أَسْر"
      decision: removed
      decision_reason: "الأَسْر في أصل اللغة الحبس والشدّ بالقيد، وهو حالة مؤقتة ناتجة عن القبض في الحرب، لا حالة العبودية الدائمة المُقنّنة. ابن فارس يحصر أصل المادة في الحبس والإمساك. والاستعمال بمعنى الرقّ متأخر ولا يُعتمد عليه في الشبكة الدلالية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اسْتِعْبَاد"
      decision: confirmed
      decision_reason: "الاستعباد مصدر استعبد، ويدلّ على إيقاع العبودية على الغير وإخضاعه، وهو قريب من مفهوم enslavement الإنجليزي. وإن كان يميل إلى دلالة الفعل أكثر من الحالة، فإنه مقبول ضمن المجموعة لأنه يتضمّن معنى الحالة الناتجة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على فعل الإخضاع والإكراه على العبودية، ويُستعمل غالباً بمعنى العملية لا الحالة المستقرّة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِعْبَاد"

    - lemma: "عُبُودِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معجمي أصيل عرّفه المعجم الوسيط بـ«خلاف الحرية»، وهو أدقّ مقابل لـ state of being a slave. مسجّل في معاجم المصطلحات الحديثة بمقابل slavery وservitude وbondage."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الحالة الاجتماعية والقانونية الدائمة لمن هو عبد، وهو المصطلح العامّ الأشمل"
      actions:
        - command: create_entry
          params: {lemma: "عُبُودِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "رِقّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فقهي ومعجمي تراثي أصيل، عرّفه الجرجاني بأنه «عجز حكمي شُرع في الأصل جزاءً عن الكفر»، ونصّ الصاحب بن عباد على أن «الرِّقّ العُبُودة». وهو مرادف دقيق للمفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح فقهي تراثي يركّز على الجانب الحكمي والشرعي للعبودية، ويُستعمل في السياق القانوني والتاريخي"
      actions:
        - command: create_entry
          params: {lemma: "رِقّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "اسْتِرْقَاق"
      source: stage1
      decision: removed
      decision_reason: "الاسترقاق يدلّ على فعل شراء العبيد وتملّكهم (عملية الاسترقاق)، لا على حالة كون المرء عبداً. هو أقرب إلى enslaving منه إلى enslavement بمعنى الحالة."

    - lemma: "عُبُودَة"
      source: stage1
      decision: removed
      decision_reason: "رغم ورودها في المحيط في اللغة، فهي صيغة نادرة غير متداولة، واستُبدلت في الاستعمال المعاصر بـ«عبودية». إبقاؤها يثقل المجموعة بلا فائدة تمييزية."


