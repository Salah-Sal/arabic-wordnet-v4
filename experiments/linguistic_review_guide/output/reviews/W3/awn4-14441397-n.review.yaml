# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14441397-n (separability)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «قابلية الفصل» مركب إضافي وصفي لا اصطلاحي مسكوك، وقد يُعَدّ عبارة حرّة"
      - "التعريف العربي «القدرة على الفصل» قصير ودوراني: يكرّر مكوّن اللمّة ذاته"
      - "المجموعة تحتوي لمّة واحدة فقط، ممّا يُضعف تمثيلها الدلالي"
    observations: >
      المفهوم (separability) يُعبَّر عنه في العربية المعاصرة بصيغ مختلفة: «قابلية الفصل»،
      «قابلية الانفصال»، «إمكانية الانفصال». الصيغة بالمصدر الصناعي (-يّة) من جذر فصل
      ممكنة نظرياً لكنها قد تلتبس بدلالات أخرى (فَصْلِيَّة = ربع سنوية). المفهوم واضح
      ثقافياً وموجود في الاستعمال العلمي العربي، لكنه يفتقر إلى مصطلح مفرد مسكوك.
  blind_candidates:
    - lemma: "فَصْلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «فَصْل» على وزن فَعْلِيَّة، للدلالة على خاصية القابلية للفصل، كما في «مرونة» من «مَرِنَ»"
    - lemma: "اِنْفِصَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «انفصال» (المطاوع)، يُبرز جانب المطاوعة: الشيء قابل لأن ينفصل من تلقاء نفسه"
    - lemma: "قَابِلِيَّةُ الِانْفِصَالِ"
      generation_method: tarkib
      justification: "مركب إضافي من «قابلية» + «الانفصال»، صيغة شائعة في المعاجم الثنائية لترجمة separability"
    - lemma: "تَفَاصُلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تَفاصُل» (التفاعل)، يدل على التشارك في الانفصال بين الأجزاء"

stage2_evidence:
  per_lemma:
    - lemma: "قَابِلِيَّةُ الْفَصْلِ"
      confirm:
        - text: "«شبكة عصبية ترشيحية قابلة للفصل عمقًا»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«القَابِلِيَّةُ: الاستعداد للقبول [مصدر صناعي]»"
          source: "المعجم الوسيط"
        - text: "«الفَصْلُ: الحاجِزُ بين الشَّيْئَيْنِ... فَصَل بينهما يَفْصِل فَصْلاً فانْفَصَل»"
          source: "المحكم والمحيط الأعظم لابن سيده"
      expands:
        - text: "«الْفَاءُ وَالصَّادُ وَاللَّامُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى تَمْيِيزِ الشَّيْءِ مِنَ الشَّيْءِ وَإِبَانَتِهِ عَنْهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «فصل» أصل صحيح في التمييز والإبانة، يؤكد ملاءمة المكوّن"

    - lemma: "فَصْلِيَّة"
      contradicts:
        - text: "«فَصليَّة: دوريَّة تصدر كل ثلاثة أشهر»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          conflict: "المعنى المسجّل هو «ربع سنوية» (quarterly)، لا علاقة له بالقدرة على الفصل"
        - text: "«أَرَجِيَّةٌ فَصْلِيَّة (حُمَّى الكَلأ)»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "فَصْلِيَّة هنا صفة بمعنى «موسمية» (seasonal)، لا صلة بدلالة الفصل/القطع"

    - lemma: "اِنْفِصَالِيَّة"
      evidence_status: "no_material_found"

    - lemma: "قَابِلِيَّةُ الِانْفِصَالِ"
      confirm:
        - text: "«إمكانية [أو قابلية] الانفصال»"
          source: "المورد الحديث (2008)"
        - text: "«ممكنٌ فَصْلُهُ؛ قابلٌ للانفصال»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الِانْفِصَال: عدم الِاتِّصَال عَمَّا من شَأْنه الِاتِّصَال وَقيل الِانْفِصَال حُدُوث هويتين»"
          source: "دستور العلماء للأحمدنكري"
          addition: "يضيف بُعداً فلسفياً: الانفصال حدوث هويتين مستقلتين"

    - lemma: "تَفَاصُلِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "قَابِلِيَّةُ الْفَصْلِ"
      decision: confirmed
      decision_reason: >
        مركب إضافي ثابت في الاستعمال التقني العربي المعاصر، مكوّناه واضحان ومسجّلان معجمياً:
        «قابلية» (المعجم الوسيط) + «الفصل» (جميع المعاجم الكلاسيكية). يُستعمل في سياقات
        علمية كالذكاء الاصطناعي والهندسة. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على الفعل المتعدّي (فَصْل شيء عن شيء بفاعل خارجي)، بخلاف «قابلية الانفصال» الذي يدلّ على المطاوعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ الْفَصْلِ"

    - lemma: "قَابِلِيَّةُ الِانْفِصَالِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح موثّق مباشرة في المورد الحديث (2008) كترجمة لـ separability، وهو مركب إضافي
        ثابت مكوّن من «قابلية» + «الانفصال». صيغة المطاوعة «انفصال» أنسب دلالياً لأن
        المفهوم يصف خاصية ذاتية في الشيء (أن ينفصل) لا فعلاً خارجياً عليه.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على المطاوعة (الشيء ينفصل من تلقاء طبيعته)، أدقّ من «قابلية الفصل» الذي يوحي بفاعل خارجي"
      actions:
        - command: create_entry
          params:
            lemma: "قَابِلِيَّةُ الِانْفِصَالِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "فَصْلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى المسجّل في المعاجم هو «دورية ربع سنوية» (quarterly) أو صفة بمعنى «موسمية»
        (seasonal). لا يوجد أي شاهد على استعمالها بمعنى «القدرة على الفصل». استعمالها
        سيولّد اشتراكاً لفظياً ضاراً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "اِنْفِصَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية تدعم هذا الاستعمال. كما أن «انفصالية» في الاستعمال المعاصر ترتبط
        ارتباطاً وثيقاً بالسياق السياسي (separatism/secessionism)، ممّا يجعلها ملتبسة
        وغير ملائمة للدلالة المطلوبة.
      evidence_assessment:
        case: no_material

    - lemma: "تَفَاصُلِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. الوزن «تَفاعُل» يدلّ على المشاركة بين طرفين، وهو بُعد دلالي
        غير موجود في المفهوم الأصلي (separability خاصية لشيء واحد). المصطلح غير مسكوك
        ولا مسجّل.
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "القدرة على الفصل"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي قصير جداً ودوراني: يكرّر مكوّن اللمّة «الفصل» ذاته دون تقديم جنس
        قريب واضح أو فصل نوعي. لا يبيّن أن المفهوم خاصية كامنة في الشيء.
    authored:
      - type: terminological
        text: "خاصّةٌ في الشيءِ تجعلُهُ قابلاً لأن يُفْصَلَ إلى أجزائِهِ أو يُنْفَصَلَ بعضُهُ عن بعضٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "صفةُ ما يمكنُ فَصْلُ أجزائِهِ بعضِها عن بعضٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خاصّةٌ في الشيءِ تجعلُهُ قابلاً لأن يُفْصَلَ إلى أجزائِهِ أو يُنْفَصَلَ بعضُهُ عن بعضٍ"

  examples:
    per_lemma:
      - lemma: "قَابِلِيَّةُ الْفَصْلِ"
        examples:
          - text: "تعتمد كفاءة التقطير على قابلية الفصل بين المكوّنات ذات درجات الغليان المتقاربة."
            type: usage
      - lemma: "قَابِلِيَّةُ الِانْفِصَالِ"
        examples:
          - text: "أظهرت التجارب أن قابلية الانفصال في هذه المادة المركّبة تزداد مع ارتفاع درجة الحرارة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تعتمد كفاءة التقطير على قابلية الفصل بين المكوّنات ذات درجات الغليان المتقاربة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أظهرت التجارب أن قابلية الانفصال في هذه المادة المركّبة تزداد مع ارتفاع درجة الحرارة."

