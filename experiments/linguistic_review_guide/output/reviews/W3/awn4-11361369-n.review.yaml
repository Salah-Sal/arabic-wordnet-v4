# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11361369-n | ILI: i97156
# ويليام ثورنتون — American architect (1759-1828)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (ثورنتون، ويليام ثورنتون) تفتقران إلى التشكيل الكامل المطلوب"
      - "التعريف العربي الحالي بالغ الإيجاز ولا يُشير إلى أبرز أعمال هذا المعماري (تصميم الكابيتول الأمريكي)"
      - "المجموعة مجموعة اسم علم (proper noun synset) لشخصية تاريخية غير عربية؛ لذا فإن توليد اللمّات يقتصر على التعريب وضبط النقحرة"
    observations: >-
      هذا المدخل اسم علم لشخصية تاريخية بعينها، وهي المعماري الأمريكي ويليام ثورنتون (1759-1828)،
      الذي اشتُهر بتصميمه مبنى الكابيتول في واشنطن. تواريخ الميلاد والوفاة تُعيِّنه بشكل قاطع
      لا يحتمل الالتباس. في مثل هذه المجموعات لا مجال للاشتقاق أو المجاز أو التركيب الدلالي،
      بل يقتصر العمل على إيجاد أفضل تعريب للاسم الأجنبي وتحقيق الضبط الشكلي الكامل وإغناء
      التعريف بمعلومات موسوعية مناسبة.
  blind_candidates:
    - lemma: "ثُورنتُون"
      generation_method: taarib
      justification: >-
        تعريب اسم العائلة الإنجليزي Thornton بالنقحرة العربية الشائعة
        (ث-و-ر-ن-ت-و-ن)؛ الثاء لصوت th والتاء لـ t والواو لـ on.
        هذا هو الشكل الأكثر شيوعاً في المصادر العربية الحديثة للإحالة المختصرة
        إلى هذا المعماري.
    - lemma: "وِيلْيَام ثُورنتُون"
      generation_method: taarib
      justification: >-
        الاسم الكامل لهذا المعماري الأمريكي مُعرَّباً: William Thornton.
        صيغة "ويليام" (بالياء بعد الواو) تحافظ على الصوت الأصلي wi-
        وهي الأشيع في المصادر العربية المعاصرة المشار إليها من تاريخ العمارة.
    - lemma: "وِلْيَام ثُورنتُون"
      generation_method: taarib
      justification: >-
        بديل تعريبي لـ William Thornton بصيغة "وَلْيَام" المختصرة
        (دون الياء الثانية بعد الواو)، مستخدمة في بعض المعاجم العربية
        التقليدية كما يظهر من مدخل "وليام" في موسوعة أسماء العرب.
    - lemma: "ثُورنطُون"
      generation_method: taarib
      justification: >-
        بديل تعريبي لـ Thornton باستخدام الطاء بدلاً من التاء في الـ t الأخيرة،
        على نهج بعض التعريبات العربية القديمة التي تستعيض بالطاء عن الحروف
        الإنجليزية المتوسطة t/d.


stage2_evidence:
  # ── الاستعلامات المُنفَّذة ──────────────────────────────────
  # الاستعلام ١: مطابقة دفعية للمّات الموجودة والمرشحة
  #   WHERE headword_norm IN ('ثورنتون','الثورنتون','وليام ثورنتون',
  #   'وليام ثورنتون','ثورنطون','الثورنطون','وليم ثورنتون') → صفر نتائج ذات صلة
  # الاستعلام ٢: جسر إنجليزي: translation_en:"Thornton" OR "William Thornton"
  #   OR "architect" OR "Capitol" → نتائج عامة، لا شيء عن شخص ثورنتون المعماري
  # الاستعلام ٣: FTS عربي: "ثورنتون" OR "معماري امريكي" OR "وليام"
  #   → وُجد مدخل "وليام" في موسوعة الأسماء، و"علامة ثورنتون" الطبية لشخص آخر
  per_lemma:
    - lemma: "ثورنتون"
      evidence_status: "no_material_found"

    - lemma: "ويليام ثورنتون"
      evidence_status: "no_material_found"

    - lemma: "ثُورنتُون"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "وِيلْيَام ثُورنتُون"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "وِلْيَام ثُورنتُون"
      source: stage1
      expands:
        - text: "«وليام — عن الأيرلندية للاسم ويليام المأخوذ عن اللغة الألمانية القديمة بمعنى مدافع مقام شجاع»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >-
            يؤكد أن "وليام" (بدون ياء بعد الواو) شكل عربي موثَّق لاسم William،
            مما يجعل صيغة "وليام ثورنتون" بديلاً مشروعاً من الناحية المعجمية.

    - lemma: "ثُورنطُون"
      source: stage1
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة الأولى ──────────────────────────────
    - lemma: "ثورنتون"
      decision: confirmed
      decision_reason: >-
        الاسم المعرَّب الشائع لـ Thornton، يُستخدم كاسم مختصر (اسم العائلة)
        للإشارة إلى هذا المعماري في المصادر العربية بعد ذكر اسمه الكامل.
        غياب الأدلة المعجمية متوقَّع لأسماء الأعلام الأجنبية المعرَّبة الحديثة.
        يستلزم التصحيح الشكلي بإضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        اسم العائلة المختصر؛ يُستخدم للإحالة إلى الشخصية بعد تعريفها الأول
        في النص، أو في السياقات الأكاديمية التي تكتفي باللقب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثُورنتُون"

    # ── اللمّة الموجودة الثانية ────────────────────────────
    - lemma: "ويليام ثورنتون"
      decision: confirmed
      decision_reason: >-
        الاسم الكامل المعرَّب للمعماري الأمريكي؛ تعريف أول ذكر ولازمة
        في السياقات الرسمية والأكاديمية. صيغة "ويليام" بالياء بعد الواو
        هي الأكثر شيوعاً في الكتابة العربية المعاصرة لأنها أقرب للنطق الأصلي wi-.
        يستلزم تصحيح التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الاسم الكامل (الاسم الشخصي + اسم العائلة)؛ يُستخدم للتعريف الأول
        بالشخصية، وفي عناوين الكتب والمراجع الأكاديمية والسياقات الرسمية
        التي تشترط الاسم كاملاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيلْيَام ثُورنتُون"

    # ── مرشح المرحلة ١: وليام ثورنتون ────────────────────
    - lemma: "وِلْيَام ثُورنتُون"
      source: stage1
      decision: removed
      decision_reason: >-
        صيغة "وَلْيَام" (بدون الياء بعد الواو) موثَّقة في موسوعة الأسماء
        العربية، غير أن الصيغة "وِيلْيَام" (الموجودة بالفعل) هي الأكثر شيوعاً
        في المصادر العربية الحديثة المتعلقة بتاريخ العمارة الأمريكية، وهي
        أدق في تمثيل النطق الإنجليزي wi-. وجود لمّة "ويليام ثورنتون" يغني
        عن هذه الصيغة البديلة تجنّباً للتكرار.

    # ── مرشح المرحلة ١: ثورنطون ──────────────────────────
    - lemma: "ثُورنطُون"
      source: stage1
      decision: removed
      decision_reason: >-
        التعريب بالطاء (ثورنطون) أقل شيوعاً وأقل دقة من التعريب بالتاء
        (ثورنتون). الصوت الإنجليزي t في Thornton يُعرَّب بالتاء في
        الكتابة العربية المعاصرة للأعلام الأجنبية، وذلك هو التعريب الرسمي
        المعتمد في المراجع العربية لهذا الاسم.


stage4_content:
  definition:
    current: "معماري أمريكي (1759-1828)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي بالغ الإيجاز؛ يكتفي بذكر المهنة والجنسية والتواريخ،
        لكنه لا يُعرِّف ما يميز هذه الشخصية ويبرر وجودها في الشبكة الدلالية.
        للأعلام الشخصية التاريخية يُشترط التعريف الموسوعي الذي يذكر أبرز إسهام
        للشخصية لإتاحة التمييز عن غيرها من المعماريين الأمريكيين.
    authored:
      - type: encyclopedic
        text: >-
          مُعَمِّر أمريكي (1759-1828)؛ وُلد في جزر الهند الغربية البريطانية،
          وفاز بمسابقة تصميم مبنى الكابيتول (الكونغرس) في واشنطن عام 1793،
          وتولى أول منصب لرئاسة مكتب براءات الاختراع الأمريكي (1802-1828).
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11361369-n"
          definition_index: 0
          text: "مُعَمِّر أمريكي (1759-1828)؛ وُلد في جزر الهند الغربية البريطانية، وفاز بمسابقة تصميم مبنى الكابيتول (الكونغرس) في واشنطن عام 1793، وتولى أول منصب لرئاسة مكتب براءات الاختراع الأمريكي (1802-1828)."

  examples:
    per_lemma:
      - lemma: "ثُورنتُون"
        examples:
          - text: "يُعدُّ ثُورنتُون من أبرز المعماريين الأمريكيين في القرن الثامن عشر، إذ فاز تصميمُه لمبنى الكابيتول بالجائزة الأولى عام 1793."
            type: usage
      - lemma: "وِيلْيَام ثُورنتُون"
        examples:
          - text: "أعرب جورج واشنطن عن إعجابه الشديد بمخططات وِيلْيَام ثُورنتُون للكونغرس، ووصفها بأنها تجمع «الجمال والرشاقة والسهولة»."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدُّ ثُورنتُون من أبرز المعماريين الأمريكيين في القرن الثامن عشر، إذ فاز تصميمُه لمبنى الكابيتول بالجائزة الأولى عام 1793."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أعرب جورج واشنطن عن إعجابه الشديد بمخططات وِيلْيَام ثُورنتُون للكونغرس، ووصفها بأنها تجمع «الجمال والرشاقة والسهولة»."


stage5_enrichment:
  # ── ملاحظة ────────────────────────────────────────────────
  # كلتا اللمّتين اسمان علمان معرَّبان (نقحرة لاسم أجنبي).
  # لا جذور عربية لاستخراجها، ولا مداخل في مقاييس اللغة لابن فارس.
  # تُحذف حقلا root و maqayis_quote من كلا المدخلَيْن.
  per_entry:
    - lemma: "ثُورنتُون"
      entry_id: "{auto}"
      # لا جذر عربي — اسم علم أجنبي معرَّب (نقحرة)
    - lemma: "وِيلْيَام ثُورنتُون"
      entry_id: "{auto}"
      roots:
        - word: "ويليام"
          root: null
          # لا جذر عربي — نقحرة لـ William
        - word: "ثورنتون"
          root: null
          # لا جذر عربي — نقحرة لـ Thornton

  per_sense:
    - lemma: "ثُورنتُون"
      sense_id: "{auto}"
      nuance: >-
        اسم العائلة المختصر؛ يُستعمل كإحالة ثانوية بعد تعريف الشخصية
        باسمها الكامل، وفي السياقات الأكاديمية والببليوغرافية التي تكتفي باللقب.
      mwe: false
    - lemma: "وِيلْيَام ثُورنتُون"
      sense_id: "{auto}"
      nuance: >-
        الاسم الكامل (الاسم الشخصي + اسم العائلة)؛ لازمة التعريف الأول
        بالشخصية في أي نص، وهو الشكل المعتمد في الموسوعات والمراجع الرسمية.
      mwe: true

  synset:
    cultural_fit: omission

  actions:
    # ── بيانات وصفية: المدخل الأول (ثورنتون) ──────────────
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"transliteration_source":"Thornton","lang_origin":"en","person_dates":"1759-1828"}'

    # ── بيانات وصفية: المدخل الثاني (ويليام ثورنتون) ──────
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"transliteration_source":"William Thornton","lang_origin":"en","person_dates":"1759-1828","mwe":true}'

    # ── بيانات وصفية: المعنى الأول ────────────────────────
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اسم العائلة المختصر، إحالة ثانوية بعد التعريف الأول","mwe":false}'

    # ── بيانات وصفية: المعنى الثاني ──────────────────────
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الكامل، لازمة التعريف الأول بالشخصية","mwe":true}'

    # ── بيانات وصفية: المجموعة الترادفية ─────────────────
    - command: set_metadata
