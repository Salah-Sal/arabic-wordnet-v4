# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10925800-n  |  ILI: i94766
# Lemma: أَنْتُونِي كُومْسْتُوك  (Anthony Comstock)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تمثّل اسم عَلَم شخصيًا لفرد بعينه (أنتوني كومستوك)، لا فئةً عامة؛ ومن ثمّ يجب تحديث POS إلى proper_noun على مستوى المدخل والمجموعة."
      - "اللمّة الوحيدة المسجّلة تعريبٌ للاسم الأجنبي، وهو الأسلوب الوحيد الممكن للأعلام الشخصية الأجنبية — غير أنّ وجود صيغة مختصرة (اللقب منفردًا) قد يُفيد كشكل بديل."
      - "التعريف العربي الحالي أقرب إلى الترجمة الحرفية من التعريف الإنجليزي؛ ويفتقر إلى الأسلوب الموسوعي المناسب للأعلام الشخصية."
    observations: >
      المجموعة مدخلٌ موسوعي لشخصية تاريخية أمريكية بعينها — أنتوني كومستوك (1844-1915)
      — اشتُهر بنشاطه في مكافحة ما عدَّه فُحشًا في الفنّ والأدب، وكان المفتّشَ الرئيسيَّ
      للجمعية الأمريكية لقمع الرذيلة. لا تتيح هذه الطبيعة (علم شخصي أجنبي) أيَّ توليد
      مصطلحي اشتقاقي أو مجازي؛ والنهج الوحيد هو التعريب (تحويل الرسم الصوتي إلى العربية).
      يختلف المُعرِّبون في رسم الاسم الأول Anthony: بالتاء (أنتوني)، بالطاء (أنطوني)،
      أو بالثاء (أنثوني)؛ والأكثر شيوعًا في المصادر العربية الحديثة هو التاء.
  blind_candidates:
    - lemma: "أَنتُونِي كُومْسْتُوك"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل بالتاء للاسم الأول Anthony — وهو الرسم الأكثر شيوعًا في
        المصادر العربية المعاصرة (الصحافة، الموسوعات الرقمية) — مع رسم اللقب Comstock
        بالكاف والميم والسين والتاء والواو والكاف.
    - lemma: "كُومْسْتُوك"
      generation_method: taarib
      justification: >
        اللقب منفردًا، وهو الشكل المختصر الشائع في السياق الأكاديمي والصحفي حين يُشار
        إلى الشخصية بعد أول ذكر، وقد يُفيد كصيغة بديلة في المدخل.
    - lemma: "أَنطُونِي كُومْسْتُوك"
      generation_method: taarib
      justification: >
        تعريب بديل بالطاء للاسم الأول، وهو وارد في بعض المصادر العربية التي تُحاكي
        النطق الإنجليزي الأمريكي لـ Anthony بأقرب صوت عربي إليه.
    - lemma: "أَنثُونِي كُومسْتُوك"
      generation_method: taarib
      justification: >
        تعريب بالثاء محاكاةً للحرف th في الإنجليزية Anthony؛ وإن كان هذا الخيار أقلَّ
        شيوعًا في العربية المعاصرة إلّا أنه موجود في بعض المصادر الأكاديمية المتخصصة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات مُنفَّذة:
#   ١. مطابقة دقيقة دفعية: انتوني كومستوك + كومستوك + انطوني كومستوك + انثوني كومستوك (→ لا نتائج)
#   ٢. الجسر الإنجليزي: "Comstock" OR "Anthony Comstock" OR "reformer" OR "moral crusade" (→ نتائج غير ذات صلة)
#   ٣. بحث FTS عربي: "مصلح" OR "أخلاق" OR "فاحشة" OR "عفة" (→ نتائج غير ذات صلة)
#   ٤. التحقق من المرشحات: انتوني كومستوك + انطوني كومستوك + انثوني كومستوك (→ لا نتائج)
# ملاحظة: غياب الأدلة المعجمية متوقّع تمامًا — الأعلام الشخصية الأجنبية لا تُدرَج في المعاجم العربية العامة.
stage2_evidence:
  per_lemma:
    - lemma: "أَنْتُونِي كُومْسْتُوك"
      evidence_status: "no_material_found"
    - lemma: "أَنتُونِي كُومْسْتُوك"
      evidence_status: "no_material_found"
    - lemma: "كُومْسْتُوك"
      evidence_status: "no_material_found"
    - lemma: "أَنطُونِي كُومْسْتُوك"
      evidence_status: "no_material_found"
    - lemma: "أَنثُونِي كُومسْتُوك"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "أَنْتُونِي كُومْسْتُوك"
      decision: confirmed
      decision_reason: >
        هذه اللمّة هي التعريب الكامل المعياري للاسم الإنجليزي Anthony Comstock بالتاء،
        وهو الرسم الأوفر شيوعًا في المصادر العربية. غياب الأدلة المعجمية متوقّع لأنّ
        الأعلام الشخصية الأجنبية لا تُعالَج في المعاجم اللغوية بل في دور الموسوعات.
        يتطابق هذا المدخل مع المرشّح الأول من المرحلة ١ مما يُعزّز صحّة الاختيار.
        يستلزم تحديث POS إلى proper_noun، وإضافة اللقب المنفرد كُومْسْتُوك صيغةً بديلة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        اللمّة الوحيدة المُدرَجة في المجموعة؛ وهي الصيغة الكاملة الرسمية للاسم
        (الاسم الأول + اللقب) المُعتمَدة في السياقات الموسوعية والأكاديمية.
      actions:
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "كُومْسْتُوك"

    # ── مرشّح المرحلة ١ — أنتوني (مطابق للمّة الموجودة) ──
    - lemma: "أَنتُونِي كُومْسْتُوك"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشّح مطابق للمّة الموجودة أَنْتُونِي كُومْسْتُوك في الجوهر (اختلاف
        في مستوى التشكيل لا في البنية)؛ يُدمَج مع المدخل الموجود ولا يُنشأ له مدخل مستقل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشّح المرحلة ١ — اللقب منفردًا ──
    - lemma: "كُومْسْتُوك"
      source: stage1
      decision: removed
      decision_reason: >
        اللقب المنفرد ليس لمّة مستقلة بل شكل مختصر للاسم الكامل؛ يُفيد كصيغة بديلة
        (add_form) على مدخل اللمّة الأصلية لا كلمّة منفصلة في المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشّح المرحلة ١ — بالطاء ──
    - lemma: "أَنطُونِي كُومْسْتُوك"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة بالطاء لا تتمايز دلاليًا عن اللمّة الموجودة بالتاء؛ كلتاهما تعريب
        لاسم واحد. إدراج تعريبَيْن لنفس الاسم كلمّتَيْن مستقلّتَيْن يُربك المُستخدم
        ويُخلّ بمبدأ عدم الترادف المطلق داخل المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشّح المرحلة ١ — بالثاء ──
    - lemma: "أَنثُونِي كُومسْتُوك"
      source: stage1
      decision: removed
      decision_reason: >
        الرسم بالثاء نادر في المصادر العربية المعاصرة للاسم Anthony، ولا يُضيف قيمة
        معجمية مستقلة. الصيغة بالتاء هي المعيار الغالب وتكفي وحدها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مصلح أمريكي قاد حملات أخلاقية ضد الفن والأدب التي اعتبرها فاحشة (1844-1915)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية من الإنجليزية. يفتقر إلى: (١) ذكر الاسم داخل
        التعريف على غرار أسلوب المعجم الموسوعي، (٢) تحديد الجنس القريب بدقة
        (مُصلِح اجتماعي لا مجرّد مُصلِح)، (٣) تفصيل الإسهام المميَّز. يُصاغ
        التعريف على نمط المعجم الوسيط للأعلام: الاسم + التواريخ + الجنسية + الوظيفة +
        الإسهام.
    authored:
      - type: encyclopedic
        text: >
          أَنتُونِي كُومسْتُوك (1844-1915): مُصلِحٌ اجتماعيٌّ أمريكيٌّ، تزعَّم حملاتٍ
          أخلاقيّةً ضدَّ الأعمال الفنّيّة والأدبيّة التي عدَّها فاحشةً أو مُخِلَّةً
          بالآداب العامّة، واشتُهر بنشاطه في فرض قوانين مكافحة الفُحش وتطبيقها
          في الولايات المتحدة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            أَنتُونِي كُومسْتُوك (1844-1915): مُصلِحٌ اجتماعيٌّ أمريكيٌّ، تزعَّم حملاتٍ
            أخلاقيّةً ضدَّ الأعمال الفنّيّة والأدبيّة التي عدَّها فاحشةً أو مُخِلَّةً
            بالآداب العامّة، واشتُهر بنشاطه في فرض قوانين مكافحة الفُحش وتطبيقها
            في الولايات المتحدة.

  examples:
    per_lemma:
      - lemma: "أَنْتُونِي كُومْسْتُوك"
        examples:
          - text: >
              يُعدُّ أَنتُونِي كُومسْتُوك من أكثر المُصلحين الأخلاقيّين جدلاً في تاريخ
              الولايات المتحدة؛ أسَّس عام 1873 جمعيةَ نيويورك لقمع الرذيلة وعمل
              مفتّشًا خاصًّا لها حتى وفاته، فأتلف كميّاتٍ ضخمةً من المطبوعات
              التي رأى فيها فُحشًا.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            يُعدُّ أَنتُونِي كُومسْتُوك من أكثر المُصلحين الأخلاقيّين جدلاً في تاريخ
            الولايات المتحدة؛ أسَّس عام 1873 جمعيةَ نيويورك لقمع الرذيلة وعمل
            مفتّشًا خاصًّا لها حتى وفاته، فأتلف كميّاتٍ ضخمةً من المطبوعات
            التي رأى فيها فُحشًا.


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ───────────────────
