# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تأهب قصوى» فيها إشكال في المطابقة بين المضاف والصفة: «تأهب» مصدر مذكر و«قصوى» مؤنث، والصواب «تأهب أقصى»"
      - "«تأهب قصوى» أعمّ من المفهوم المقصود؛ فهي تدل على أي حالة استعداد أقصى، لا على المستوى الأعلى المحدد في منظومة الإنذار المُلوَّن"
      - "اللمّتان بلا تشكيل"
    observations: "المجموعة تصف مفهوماً عسكرياً حديثاً (نظام الإنذار بالألوان) حيث «الأحمر» يدل على أعلى درجات الخطر. للأحمر في العربية دلالة الشدة والخطر: «الموت الأحمر» و«احمرّ البأس» أي اشتدّ. التعبير «إنذار أحمر» مركب وصفي ثابت مسجَّل في المعاجم الحديثة. أما «تأهب قصوى» فتعبير شائع إعلامياً لكنه لا يختصّ بهذا المفهوم بعينه."

  blind_candidates:
    - lemma: "نَفِيرٌ عَامٌّ"
      generation_method: tarkib
      justification: "مركب وصفي مسجّل في المعجم الوسيط بمعنى «قيام عامة الناس لقتال العدو»، يشير إلى أقصى درجات الاستنفار العسكري"
    - lemma: "اسْتِنْفَارٌ أَقْصَى"
      generation_method: tarkib
      justification: "مركب وصفي من «استنفار» (طلب النفرة للقتال) و«أقصى» (أعلى)، يدل على أقصى مراتب التأهب"
    - lemma: "إِنْذَارٌ أَقْصَى"
      generation_method: tarkib
      justification: "مركب وصفي من «إنذار» (إبلاغ بخطر) و«أقصى» (أعلى)، يصف أعلى مستوى في سُلَّم الإنذارات"
    - lemma: "تَأَهُّبٌ تَامٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «تأهب» (استعداد) و«تام» (كامل)، يفيد بلوغ الاستعداد منتهاه"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "إِنْذَارٌ أَحْمَرُ"
      confirm:
        - text: "«الإنذار الأحمر: المرحلة الأخيرة من إنذار بغارة جوية وهو يدلّ على أن غارة العدوّ أمست وشيكةً.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الإنذار: الإعلام بما يحذر. قال ابن عطية ولا يكاد يكون إلا في تخويف يسع زمانه الاحتراز»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يبيّن أن الإنذار يتضمن عنصر الزمن الكافي للاحتراز"
        - text: "«الإنذارُ: إخبار فيه تخويف كما أن التبشيرَ إخبار فيه سرور.»"
          source: "التعريفات الفقهية للبركتي"
          addition: "يوضح المقابلة بين الإنذار والتبشير"
        - text: "«يُقَالُ مَوْتٌ أَحْمَرُ، وَذَلِكَ إِذَا وُصِفَ بِالشِّدَّةِ. وَقَالَ عَلِيٌّ: كُنَّا إِذَا احْمَرَّ الْبَأْسُ اتَّقَيْنَا بِرَسُولِ اللَّهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد دلالة الأحمر على الشدة والخطر في التراث العربي"

    - lemma: "تَأَهُّبٌ قُصْوَى"
      confirm:
        - text: "«(تأهب) لَهُ استعد يُقَال تأهب للسَّفر وللأمر»"
          source: "المعجم الوسيط"
        - text: "«تأهب عالٍ: حالة تتجند فيها كل طاقات مؤسسة إعلامية عند حلول مناسبة كبيرة أو عند حدوث طوارئ»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
      contradicts:
        - text: "«الاستعداد لأحداث معينة أو غير متوقعة.»"
          source: "مسرد المناخ والبيئة (ALECSO)"
          conflict: "التعريف يدل على تأهب عام لا على مستوى محدد في منظومة إنذار مُلوَّنة"
      expands:
        - text: "«للأمر: أَهَبَ، يقال: تَأَهَّبَ للسَّفر.»"
          source: "المعجم الكبير"
          addition: "يؤكد أن التأهب مصدر مذكر (تَفَعُّل)"

    # ── مرشحات المرحلة ١ ──
    - lemma: "نَفِيرٌ عَامٌّ"
      confirm:
        - text: "«(النفير الْعَام) قيام عَامَّة النَّاس لقِتَال الْعَدو»"
          source: "المعجم الوسيط"
        - text: "«النَّفِيرُ: ... القوم يَنْفِرُون للقتال. (النَّفِير العَامُّ): قيام عامة الناس لقتال العدوِّ»"
          source: "المعجم الوسيط (OCR)"
      contradicts:
        - text: "«(النفير الْعَام) قيام عَامَّة النَّاس لقِتَال الْعَدو»"
          source: "المعجم الوسيط"
          conflict: "النفير العام يدل على التعبئة الشاملة للقتال لا على مستوى الإنذار الأعلى؛ فهو فعل لا حالة"

    - lemma: "اسْتِنْفَارٌ أَقْصَى"
      evidence_status: "no_material_found"

    - lemma: "إِنْذَارٌ أَقْصَى"
      evidence_status: "no_material_found"

    - lemma: "تَأَهُّبٌ تَامٌّ"
      evidence_status: "no_material_found"


