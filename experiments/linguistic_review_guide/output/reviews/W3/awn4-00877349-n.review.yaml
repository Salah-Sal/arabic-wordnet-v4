stage1_review:
  assessment:
    concerns:
      - "غياب التشكيل عن اللمة الحالية."
      - "استخدام كلمة (لوجستي) المعربة، رغم شيوعها في السياق العسكري المعاصر."
    observations: "المفهوم عسكري متخصص، واللمة الحالية (تقييم لوجستي) هي الترجمة الحرفية والمصطلح العسكري المعتمد لـ (logistic assessment)، وتتكون من مركب وصفي يجمع بين التقييم (التقدير والحكم) واللوجستية (الإمداد والدعم العسكري)."
  blind_candidates:
    - lemma: "تَقْيِيمٌ لُوجِسْتِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يعبر عن الحكم أو التقدير (تقييم) للإمدادات (لوجستي)، وهو الشائع في الاستعمال العسكري."
    - lemma: "تَقْدِيرُ الإِمْدَادَاتِ"
      generation_method: tarkib
      justification: "مركب إضافي من أصل عربي خالص، يعبر عن حساب وتقدير الدعم المادي والعسكري."
    - lemma: "تَقْيِيمٌ إِمْدَادِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يستخدم صفة الإمداد كبديل عربي خالص لكلمة لوجستي."
    - lemma: "تَقْيِيمُ الإِسْنَادِ"
      generation_method: tarkib
      justification: "مركب إضافي يعتمد على مصطلح الإسناد المستخدم عسكرياً للدعم."

stage2_evidence:
  per_lemma:
    - lemma: "تقييم لوجستي"
      confirm:
        - text: "«تَقْييم: الرأي والحُكم الفنيّ والقانونيّ عن حالة شيء ما... لتحديد إذا ما كان الأمر بحاجة إلى المزيد من التصرف والجهد.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«إِمْدَادِيّ ؛ لُوجِسْتِي: logistic»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«تَقْيِيم الجَذْر: ق ي م ... المعنى: مَعْرِفَة قِيمَتِها، الصَّوابُ والرُّتْبَةُ: - تَقْوِيم السِّلْعَةِ [فَصِيحَةٌ]-تَقْيِيم السِّلْعَةِ [صَحِيحَةٌ]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
    - lemma: "تَقْدِيرُ الإِمْدَادَاتِ"
      confirm:
        - text: "«الإمداد: توالي المنافع، وأصله من المادة وهو كل ما لا ينقطع بالأخذ منه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«إِمْدَاد: من (م د د) الإعانة والإمهال.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"

stage3_analysis:
  per_lemma:
    - lemma: "تقييم لوجستي"
      decision: confirmed
      decision_reason: "مصطلح عسكري مسكوك ومستقر، وهو الترجمة المعتمدة لمفهوم (logistic assessment) في السياقات العسكرية المعاصرة، ويتوافق تماماً مع التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْيِيمٌ لُوجِسْتِيّ"

stage4_content:
  definition:
    current: "حكم على الدعم اللوجستي المطلوب لعملية عسكرية معينة"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق وواضح، ولكن يحتاج إلى ضبط لغوي وتشكيل ليصبح أقرب للأسلوب المعجمي المصطلحي."
    authored:
      - type: terminological
        text: "حُكْمٌ أَوْ تَقْدِيرٌ لِلدَّعْمِ اللُّوجِسْتِيِّ (الإِمْدَادِيِّ) الْمَطْلُوبِ لِتَنْفِيذِ عَمَلِيَّةٍ عَسْكَرِيَّةٍ مُعَيَّنَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حُكْمٌ أَوْ تَقْدِيرٌ لِلدَّعْمِ اللُّوجِسْتِيِّ (الإِمْدَادِيِّ) الْمَطْلُوبِ لِتَنْفِيذِ عَمَلِيَّةٍ عَسْكَرِيَّةٍ مُعَيَّنَةٍ."

  examples:
    per_lemma:
      - lemma: "تقييم لوجستي"
        examples:
          - text: "بِنَاءً عَلَى التَّقْيِيمِ اللُّوجِسْتِيِّ لِمَسْرَحِ الْعَمَلِيَّاتِ، تَقَرَّرَ تَأْجِيلُ الْهُجُومِ لِحِينِ وُصُولِ الإِمْدَادَاتِ الْمَطْلُوبَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "بِنَاءً عَلَى التَّقْيِيمِ اللُّوجِسْتِيِّ لِمَسْرَحِ الْعَمَلِيَّاتِ، تَقَرَّرَ تَأْجِيلُ الْهُجُومِ لِحِينِ وُصُولِ الإِمْدَادَاتِ الْمَطْلُوبَةِ."

