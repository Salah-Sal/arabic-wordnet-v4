        value: '{"roots":[{"word":"تَقْيِيم","root":"قوم","maqayis_quote":"«الْقَافُ وَالْوَاوُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ... وَمِنَ الْبَابِ: قَوَّمْتُ الشَّيْءَ تَقْوِيمًا. وَأَصْلُ الْقِيمَةِ الْوَاوُ»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الوحيد في المجموعة، وهو مركب وصفي يعبر بدقة عن عملية تقدير متطلبات الإمداد والدعم للعمليات العسكرية، مستخدماً اللفظة المعربة المستقرة عسكرياً (لوجستي).","mwe":true}'
    - command: set_metadata
