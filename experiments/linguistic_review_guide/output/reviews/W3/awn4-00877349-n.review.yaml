  per_entry:
    - lemma: "تَقْيِيمٌ لُوجِسْتِيّ"
      entry_id: "{auto}"
      roots:
        - word: "تَقْيِيم"
          root: "قوم"
          maqayis_quote: "«الْقَافُ وَالْوَاوُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ... وَمِنَ الْبَابِ: قَوَّمْتُ الشَّيْءَ تَقْوِيمًا. وَأَصْلُ الْقِيمَةِ الْوَاوُ»"
  per_sense:
    - lemma: "تقييم لوجستي"
      sense_id: "{auto}"
      nuance: "المصطلح الوحيد في المجموعة، وهو مركب وصفي يعبر بدقة عن عملية تقدير متطلبات الإمداد والدعم للعمليات العسكرية، مستخدماً اللفظة المعربة المستقرة عسكرياً (لوجستي)."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
