# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11281354-n  |  ILI: i96704
# المُراجَع: هنري هوبسون ريتشاردسون — معماري أمريكي (1838-1886)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلا اللمّتين تفتقران إلى التشكيل الكامل الإلزامي"
      - "تصنيف الصنف النحوي (pos) مُسجَّل على أنه 'n' بينما المجموعة تعبيرٌ عن اسم علَم لشخص بعينه، والصواب 'proper_noun'"
      - "التعريف العربي الحالي (معماري أمريكي 1838-1886) بالغُ الإيجاز، خالٍ من الجنس القريب والفصل النوعي، ولا يُعرِّف بما اشتُهر به الشخص"
    observations: >
      هذه المجموعة الترادفية اسمٌ علَمٌ لشخص تاريخي بعينه — المعماري الأمريكي هنري هوبسون ريتشاردسون
      (1838-1886)، مؤسِّس الطرازِ الرومانيسكيِّ التجديديِّ في الولايات المتحدة. مثل هذه المجموعات لا تقبل
      توليد لمّات بالاشتقاق أو المجاز أو التركيب، إذ اللمّة المناسبة الوحيدة هي تعريب اسم الشخص.
      أسلوب التوليد المتاح الوحيد هو (taarib)، والمرشحات لا تعدو كونها تخمينات لأسماء معماريين أمريكيين
      بارزين في تلك الحقبة، قبل الاطلاع على اللمّات الموجودة. كلتا اللمّتين الموجودتين صحيحتان من حيث
      المبدأ (مختصرة + كاملة)، غير أنهما تحتاجان إلى تشكيل، وتحتاج المجموعة إلى تصحيح الصنف النحوي
      وتحسين التعريف.

  blind_candidates:
    - lemma: "رِيتشَاردسُون"
      generation_method: taarib
      justification: >
        تعريب لاسم عائلي إنجليزي شائع في السياق الأمريكي؛ Richardson اسمٌ شهير في الدراسات المعمارية
        الأمريكية للقرن التاسع عشر، وقد استُخدم هذا التعريب في مصادر عربية متعددة.
    - lemma: "هَنت"
      generation_method: taarib
      justification: >
        تعريب لاسم Hunt نسبةً إلى ريتشارد موريس هنت (1827-1895)، معماري أمريكي بارز في الحقبة
        ذاتها، كان مرشحاً محتملاً للمجموعة قبل الاطلاع على اللمّات الموجودة.
    - lemma: "سُولِيفَان"
      generation_method: taarib
      justification: >
        تعريب لاسم Sullivan نسبةً إلى لويس سوليفان، معماري أمريكي من أبرز أعلام تلك الحقبة،
        طُرح كتخمين أولي قبل الاطلاع على اللمّات الموجودة.
    - lemma: "رِيتشَارد مُورِيس هَنت"
      generation_method: taarib
      justification: >
        تعريب للاسم الكامل لريتشارد موريس هنت — المعماري الأمريكي (1827-1895) — باعتباره
        مرشحاً بصيغة الاسم الثلاثي الكاملة، تناظراً مع صيغة الاسم الكامل المحتملة للمجموعة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  # ملاحظة منهجية: هذه المجموعة اسم علَم لشخص تاريخي غربي؛ المعاجم العربية الكلاسيكية لا تتناوله،
  # والأدلة المتاحة من ARABTERM تخصّ مصطلحات علمية تحمل نفس الاسم (عدد ريتشاردسون، ثابت ريتشاردسون)
  # لا شخصَ المعماري نفسه. معجم الدوزي يستشهد بـ"ريتشاردسون" كمرجع مكتبي (مستكشف بريطاني).
  per_lemma:
    - lemma: "ريتشاردسون"
      expands:
        - text: "«ريتشاردسون رحلات في المغرب 2: 259 ... مكو: مكاء: طائر»"
          source: "تكملة المعاجم العربية لرينهارت دوزي (hawramani)"
          addition: >
            يُثبت المعجمُ استخدامَ التعريب «ريتشاردسون» (بالراء والياء والتاء) مرجعاً في المعاجم العربية
            الحديثة، مما يؤكد اتساق هذه الصيغة في الكتابة العلمية العربية وإن كان الشخص المُشار إليه
            هنا جيمس ريتشاردسون المستكشف لا هنري هوبسون ريتشاردسون المعماري.
        - text: "«عَلاَمَةُ ريتشاردسون (لتشخيص الموت)» — translation_en: Richardson's sign"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          addition: "تؤكد صيغة التعريب «ريتشاردسون» في المعجمية الطبية الموحدة الحديثة."
        - text: "«عدد ريتشاردسون» — translation_en: Richardson number"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — ARABTERM"
          addition: "تعزز شيوع صيغة التعريب «ريتشاردسون» في المصطلحات العلمية الموحدة."
        - text: "«ثابت ريتشاردسون» — translation_en: Richardson constant"
          source: "موسوعة الكهرباء (IEC 60050) — ARABTERM"
          addition: "تأكيد إضافي لصيغة التعريب في المصطلحات الكهربائية الدولية."
        - text: "«عَدَدُ رتْشاردْسُن» — translation_en: Richardson number"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999) — ARABTERM"
          addition: >
            يكشف عن صيغة تعريب بديلة مختصرة «رتشاردسن» (بدون واو وبدون الياء) في الأرصاد الجوية،
            مما يدل على تعدد الصيغ التعريبية لهذا الاسم في المصادر العربية الموحدة.

    - lemma: "هنري هوبسون ريتشاردسون"
      evidence_status: "no_material_found"

    - lemma: "هَنت"
      contradicts:
        - text: "«هنت: هنتات: قَبيلة من البَرْبَر»"
          source: "تاج العروس لمرتضى الزبيدي (hawramani)"
          conflict: "اللفظ «هنت» في المعجم العربي اسمٌ لقبيلة بربرية، لا علاقة له بالمعماري هنت."
        - text: "«هَنْت: عن الإنجليزية القديمة بمعنى صياد»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
          conflict: >
            المدخل يُعرِّف «هنت» بوصفه اسماً إنجليزياً قديماً بمعنى «صياد»، مما يدل على عدم تثبيت
            هذا التعريب مرتبطاً بالمعماري ريتشارد موريس هنت في المعجمية العربية.

    - lemma: "سُولِيفَان"
      contradicts:
        - text: "«سوليفان: عن الأيرلندية بمعنى أسود العينين. يستخدم للذكور»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
          conflict: >
            المدخل يُثبت «سوليفان» بوصفه اسماً ذكورياً مشتقاً من الأيرلندية بمعنى «أسود العيون»، وهو
            اسم عربيٌّ مُعرَّب مستقل لا صلة بالمعماري لويس سوليفان في هذا السياق المعجمي.

    - lemma: "رِيتشَارد مُورِيس هَنت"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة الأولى ──
    - lemma: "ريتشاردسون"
      decision: confirmed
      decision_reason: >
        تعريبٌ راسخٌ في المعجمية العربية الموحدة الحديثة (ARABTERM، مرجع الدوزي). الصيغة «ريتشاردسون»
        هي الأشيع والأكثر اتساقاً بين الصيغ التعريبية المتداولة (في مقابل «رتشاردسن» الأقل شيوعاً).
        اللمّة صحيحة لكنها تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة المختصرة للاسم (اسم العائلة وحده)؛ تُستخدم في السياقات الموجزة والإشارات العلمية
        والأكاديمية السريعة (كـ«عدد ريتشاردسون»)، وهي أقل رسمية من الاسم الثلاثي الكامل.
      morphological_fit: >
        اسم علَم مُعرَّب، لا وزن صرفي عربي أصيل. تقبل ال- التعريف (الريتشاردسوني) والنسبة
        (ريتشاردسوني) وجمع التكسير بالمقاس (ريتشاردسونات للمصطلحات المنسوبة إليه).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِيتشَاردسُون"

    # ── اللمّة الموجودة الثانية ──
    - lemma: "هنري هوبسون ريتشاردسون"
      decision: confirmed
      decision_reason: >
        الاسم الثلاثي الكامل للمعماري؛ ضروري في المجموعة الترادفية لتمييز الشخص بدقة تامة
        ودفع اللبس مع آخرين يحملون لقب «ريتشاردسون». يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الرسمية الكاملة للاسم؛ تُستخدم في السياقات التاريخية والأكاديمية الرسمية
        وفي التوثيق الموسوعي والتعريفات الشخصية، وهي المعيار في الإسناد الببليوغرافي.
      morphological_fit: >
        مُركَّبٌ إضافيٌّ من أسماء علَم مُعرَّبة متسلسلة (اسم + اسم أب + اسم عائلة)، وهو النمط
        الغربي الثلاثي الشائع في التعريب. مقبولٌ معجمياً كوحدة إضافية ثابتة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِنْرِي هُوبْسُون رِيتشَاردسُون"

    # ── المرشحات من المرحلة ١ ──
    - lemma: "رِيتشَاردسُون"
      source: stage1
      decision: removed
      decision_reason: >
        يُطابق اللمّة الموجودة الأولى بعد التشكيل — لا داعي لإنشاء مدخل مستقل.

    - lemma: "هَنت"
      source: stage1
      decision: removed
      decision_reason: >
        يُشير إلى شخص مختلف تماماً (ريتشارد موريس هنت 1827-1895). فضلاً عن ذلك،
        فإن «هنت» في المعجمية العربية مُثبَّتٌ بمعنى قبيلة بربرية أو اسم إنجليزي بمعنى صياد،
        مما يُفضي إلى اشتراك لفظي مضلِّل.

    - lemma: "سُولِيفَان"
      source: stage1
      decision: removed
      decision_reason: >
        يُشير إلى لويس سوليفان (1856-1924)، معماري مختلف ومن حقبة لاحقة. «سوليفان» في
        المعجمية العربية مُثبَّتٌ بمعنى اسم ذكوري أيرلندي الأصل.

    - lemma: "رِيتشَارد مُورِيس هَنت"
      source: stage1
      decision: removed
      decision_reason: >
        يُشير إلى شخص مختلف تماماً (هنت لا ريتشاردسون)؛ لا صلة له بهذه المجموعة الترادفية.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-11281354-n"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري أمريكي (1838-1886)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي أقرب إلى التصنيف الببليوغرافي منه إلى التعريف المعجمي؛ يفتقر إلى
        الجنس القريب الصريح (معماريٌّ أمريكيٌّ ← هذا موجود لكن مبتور) والفصل النوعي
        (ما الذي اشتُهر به؟). لا يُميِّز ريتشاردسون عن غيره من المعماريين الأمريكيين.
