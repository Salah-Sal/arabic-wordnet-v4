        text: >
          مُعمَارِيٌّ أمريكيٌّ (1838-1886)، يُعدُّ من أبرزِ روّادِ إحياءِ الطرازِ
          الرومانيسكيِّ في الولاياتِ المتحدةِ وتطويرِه وفقَ رؤيةٍ أمريكيةٍ مُبتكَرة،
          عُرِفَ هذا الطرازُ لاحقاً بـ«الرومانيسكيِّ الرِّيتشَاردسُونيِّ»؛
          ومن أبرزِ أعمالِه كنيسةُ الثالوثِ المُقدَّسِ في بوسطن.
