# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14454342-n
# second class — not the highest rank in a classification
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي سلبي الصياغة (ليست أعلى...) ولا يحدّد المفهوم إيجاباً"
      - "المجموعة تحتوي على لمّة واحدة فقط (درجة ثانية) دون تشكيل"
      - "التعريف لا يميّز بين الدرجة الثانية تحديداً وأي رتبة دون العليا"
    observations: "المفهوم يدور حول مرتبة تصنيفية تلي العليا، ويُستخدم في سياقات السفر والخدمات والتصنيفات الإدارية. المصطلح العربي الشائع «الدرجة الثانية» راسخ في الاستعمال. المفهوم له جنسه القريب (درجة/رتبة) من المقولة الأعلى (المكانة النسبية)."
  blind_candidates:
    - lemma: "مَرْتَبَة ثَانِيَة"
      generation_method: tarkib
      justification: "مركب وصفي من «مرتبة» (منزلة) و«ثانية» (التالية للأولى)، يؤدي دلالة الرتبة التي تلي العليا في سلّم التصنيف"
    - lemma: "رُتْبَة دُنْيَا"
      generation_method: tarkib
      justification: "مركب وصفي من «رتبة» و«دنيا» (أي أقل من العليا)، يعبّر عن المنزلة التي لا تبلغ الأعلى"
    - lemma: "دُونِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «دون» على وزن فُعُولِيَّة، يدل على حالة كون الشيء دون غيره في المرتبة"
    - lemma: "ثَانَوِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «ثانوي» المنسوب إلى «ثاني»، يدل على صفة ما ليس في المرتبة الأولى"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "دَرَجَة ثَانِيَة"
      confirm:
        - text: "«درجة ثانية» — translation_en: second class, translation_fr: deuxième classe; seconde classe; seconde"
          source: "مسرد الفن والتسلية والرياضة (ARABTERM)"
        - text: "«(1) المرتبة الثانية (2) الدرجة الثانية [في باخرة].» — translation_en: second class"
          source: "المورد الحديث (2008)"
        - text: "«درجة قمرية» — definitions_text: درجة ثانية وسياحية (في سفن الركاب) — translation_en: cabin class"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
      expands:
        - text: "«الدّرجة: بفتح الدال والراء المهملتين في اللغة پايه ومرتبه... ويعبر بها عن المنزلة الرفيعة»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يؤكد أن الدرجة تُستعمل بمعنى المنزلة والمرتبة في التصنيف"
        - text: "«الدرجة: محركة نحو المنزلة لكن يقال للمنزلة درجة إذا اعتبرت بالصعود دون الامتداد على البسيطة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يبيّن أن الدرجة تختص بالمنزلة حين يُعتبر فيها الصعود والتدرج"

    - lemma: "مَرْتَبَة ثَانِيَة"
      confirm:
        - text: "«(1) المرتبة الثانية (2) الدرجة الثانية [في باخرة].» — translation_en: second class"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الرُّتْبَة: المنزلة والمكانة أو المنزلة الرفيعة ودرجة من درجات الشرف تمنحها الدولة من ترى تكريمه»"
          source: "المعجم الوسيط"
          addition: "يوضح أن الرتبة والمرتبة تُستعملان بمعنى المنزلة والدرجة"

    - lemma: "رُتْبَة دُنْيَا"
      contradicts:
        - text: "«الرُّتْبَة: المنزلة والمكانة, أو المنزلة الرفيعة — order: مرتبة في سلّم تصنيف النبات والحيوان أدنى من الطائفة وأعلى من الفصيلة»"
          source: "المعجم الكبير"
          conflict: "«رتبة دنيا» تعبير وصفي حر وليس مصطلحاً مسكوكاً؛ يمكن إبدال «دنيا» بـ«صغيرة» أو «منخفضة» دون تغير المعنى، مما يفشل في اختبار السكّ"

    - lemma: "دُونِيَّة"
      contradicts:
        - text: "«دُونيَّة: من (د و ن) مؤنث الدُّوني»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الدونية تدل على حالة النقص والانحطاط (عقدة الدونية)، وهي مفهوم نفسي مختلف عن التصنيف في مراتب"

    - lemma: "ثَانَوِيَّة"
      contradicts:
        - text: "«ثَانَوِيَّة: من (ث ن ي) مؤنث ثانوي»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الثانوية تُستعمل بكثرة للمدرسة الثانوية، واستعمالها بمعنى الرتبة الثانية يولّد التباساً شديداً"

# ── المرحلة ٣: التحليل اللغوي ────────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "دَرَجَة ثَانِيَة"
      decision: confirmed
      decision_reason: "مصطلح راسخ في الاستعمال العربي المعاصر، مؤيَّد بشواهد معجمية متعددة من ARABTERM والمورد الحديث ومعجم علوم البحار. يطابق المفهوم الإنجليزي second class تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُستعمل خاصة في سياقات السفر والخدمات والتصنيفات الرياضية، ويدل على الرتبة التالية مباشرة للدرجة الأولى"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَرَجَة ثَانِيَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَرْتَبَة ثَانِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "مؤيَّد بالمورد الحديث الذي يورد «المرتبة الثانية» مقابلاً صريحاً لـ second class. والمرتبة مرادف للدرجة في سياق التصنيف، ومؤكَّدة في المعجم الوسيط."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "أعمّ من «درجة ثانية» إذ تشمل التصنيفات الإدارية والاجتماعية، لا السفر وحده"
      actions:
        - command: create_entry
          params: {lemma: "مَرْتَبَة ثَانِيَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14454342-n"}

    - lemma: "رُتْبَة دُنْيَا"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ يفشل في اختبار السكّ (يمكن إبدال «دنيا» بـ«منخفضة» أو «متدنية»). كما أن «دنيا» تدل على الحدّ الأدنى لا على الرتبة الثانية تحديداً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "دُونِيَّة"
      source: stage1
      decision: removed
      decision_reason: "الدونية مصطلح نفسي يدل على الشعور بالنقص (عقدة الدونية)، وليس تصنيفاً في سلّم المراتب. لا شواهد معجمية تدعم استعماله بمعنى الدرجة الثانية."
      evidence_assessment:
        case: contradicts_only

    - lemma: "ثَانَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مثقلة بدلالة المدرسة الثانوية في الاستعمال المعاصر. واستعمالها بمعنى الرتبة الثانية يولّد التباساً كبيراً. كما أنها صفة مجرّدة لا تدل على رتبة محددة في تصنيف."
      evidence_assessment:
        case: contradicts_only

