      decision_reason: "رغم ورود «المنفذ» بمعنى executant في المورد الحديث، فإن الدلالة الراسخة في المعاجم تقنية هندسية (مخرج، منفذ)؛ استخدامه منفرداً في سياق الأداء الفني يُفضي إلى لبس دلالي شديد؛ ولا يوجد تثبيت اصطلاحي في معاجم الفنون الموسيقية العربية"


