# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «عازف منفذ» مركب وصفي غير مسجَّل في المعاجم كوحدة معجمية ثابتة؛ ويفشل في اختبار السكّ لأن «منفذ» يمكن إبدالها بـ«ماهر» أو «بارع» دون تغيير المعنى الوصفي، مما يكشف أنها صفة حرة لا مصطلح"
      - "لفظة «عازف» أضيق دلالياً من المفهوم المطلوب: تختص بعازفي الآلات وتستثني المغنين وسائر المؤدين الموسيقيين"
      - "كلتا اللمّتين الموجودتين («عازف منفذ» و«مؤدٍ موسيقي») بدون تشكيل كامل"
      - "التعريف العربي الحالي «مؤدٍ (عادة للأعمال الموسيقية)» مختزل: يُعيد كلمة «مؤدٍ» من الجنس الأعلى دون فصل كافٍ، وكلمة «عادة» تُضعف التحديد"
      - "اللمّة «مؤدٍ» مشتركة بين هذه المجموعة والمجموعة الأعلى (awn4-10435383-n) مما قد يُحدث التباساً في التمييز الهرمي"
    observations: "تُمثِّل المجموعة مفهوم «executant» بمعناه الموسيقي الدقيق، أي المؤدي المحترف الذي يُنفِّذ الأعمال الموسيقية أمام الجمهور — عزفاً أو غناءً — دون أن يكون بالضرورة مؤلِّفها. الجذر الدلالي الأنسب هو «أدّى — أداء» لا «عزف»، لأن «أدّى» يشمل كل ضروب الأداء الفني ولا يقتصر على الآلات. المعجمية العربية المعاصرة وفّرت مصطلح «الموسيقار» في المعجم الوسيط بمعنى «من حرفته الموسيقى»، وهو مرشح قوي يستحق الإضافة. كما أن المركب الوصفي «مُؤَدٍّ مُوسِيقِيّ» يُجسِّد بنية تصنيفية سليمة (جنس + فصل) وينبغي إبقاؤه مع تصحيح التشكيل."

  blind_candidates:
    - lemma: "مُوسِيقَار"
      generation_method: ishtiqaq
      justification: "اسم مشتق من «مُوسِيقَى» على الوزن الصناعي «فوعال» الدال على الاحتراف والتمكن من فن بعينه (كـ«نجّار» و«خيّاط» في دلالة الحرفة)؛ يُجمع على «مُوسِيقَارون» مما يدل على تثبيته المعجمي في العربية الحديثة، ويُعبِّر عن المؤدي الموسيقي المحترف بإيجاز لفظي وافٍ"
    - lemma: "مُؤَدٍّ مُوسِيقِيّ"
      generation_method: tarkib
      justification: "مركب وصفي (wasfi) من «مُؤَدٍّ» — اسم فاعل من أدَّى يُؤَدِّي، الجنس القريب الشامل لكل من يُوصِل عملاً فنياً إلى الجمهور — و«مُوسِيقِيّ» فصل نوعي مُقيِّد؛ يشمل العازفين والمغنين على حدٍّ سواء ويتوافق مع بنية المصطلح الإنجليزي musical performer"
    - lemma: "عَازِف"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «عَزَفَ» على وزن «فَاعِل»؛ جذر عزف يدل في أحد أصليه على الصوت والعزف في الملاهي (ابن فارس)؛ والكلمة دارجة في العربية المعاصرة في «عازف الكمان» وسواه، غير أن احتمال القصور الدلالي واردٌ لاقتصاره على الآلي"
    - lemma: "مُنَفِّذ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «نَفَّذَ» على وزن «مُفَعِّل» الدال على الإتمام والإنجاز؛ يُوازي اشتقاقياً الجذر اللاتيني لكلمة executant (ex+sequi = to follow out = ينفذ حتى النهاية)؛ وقد استخدمه المورد الحديث (2008) صراحةً بمعنى executant"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "عازف منفذ"
      evidence_status: "no_material_found"

    - lemma: "مؤدٍ موسيقي"
      confirm:
        - text: "«المُنْجِز؛ المُؤَدّي؛ العازف؛ الممثّل إلخ.»"
          source: "المورد الحديث (2008) — بوصفها ترجمة لـ performer"
      expands:
        - text: "«الْهَمْزَةُ وَالدَّالُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ إِيصَالُ الشَّيْءِ إِلَى الشَّيْءِ أَوْ وُصُولُهُ إِلَيْهِ مِنْ تِلْقَاءِ نَفْسِهِ... أَدَّى فُلَانٌ يُؤَدِّي مَا عَلَيْهِ أَدَاءً وَتَأْدِيَةً»"
          source: "مقاييس اللغة لابن فارس (جذر أدي)"
          addition: "جذر «أدي» يؤصِّل دلالة الإيصال والإنجاز، مما يجعل «مُؤَدٍّ» اسم الفاعل المثالي لمن يوصِل العمل الفني إلى الجمهور ويُنجزه أمامه"

    - lemma: "مُوسِيقَار"
      confirm:
        - text: "«(الموسيقار) من حرفته الموسيقى»"
          source: "المعجم الوسيط (OCR + Hawramani)"
        - text: "«موسيقار: الموسيقي (همبرت 97). موسيقاري: منسوب إلى الموسيقى، الآلات الموسيقية... الصنعة الموسيقارية»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"

    - lemma: "عَازِف"
      confirm:
        - text: "«وَاشْتُقَّ مِنْ هَذَا الْعَزْفُ فِي اللَّعِبِ وَالْمَلَاهِي»"
          source: "مقاييس اللغة لابن فارس (جذر عزف)"
        - text: "«عَازِفٌ: بالزاي المكسورة ثم الفاء، يقال: عزفت نفسه عن الشيء عزوفاً فهو عازف إذا انصرفت، والعزيف: الصوت»"
          source: "معجم البلدان لياقوت الحموي"
      contradicts:
        - text: "«عازف الكمان»، «عازف الفلوت»، «عازف البوق»، «عازف الأكورديون»، «عازف القيثارة»، «عازف الجاز»"
          source: "المورد الحديث (2008) — شواهد متعددة"
          conflict: "جميع شواهد الاستخدام المعجمي تربط «عازف» بآلة موسيقية بعينها، مما يكشف أن دلالته محدودة بالأداء الآلي ولا يشمل المغنين والمؤدين الصوتيين"

    - lemma: "مُنَفِّذ"
      confirm:
        - text: "«(1) المُنْجِز؛ المُنفِّذ (2) البارع في فنّ [وبخاصة في الموسيقى]»"
          source: "المورد الحديث (2008) — ترجمة لـ executant"
      contradicts:
        - text: "«(المنفذ) موضع نفوذ الشيء والممر النافذ (ج) منافذ»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الراسخة في المعاجم العربية الكلاسيكية والحديثة تقنية بنائية (مخرج، فتحة)، ولا يوجد تثبيت اصطلاحي لـ«المنفذ» كمصطلح فني في معاجم الموسيقى أو الفنون"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
