      nuance_differentiation: "يصف الفعل الأدائي الحيّ بوصفه نشاطاً فنياً متجدداً أمام جمهور، ولا يشترط الاحتراف الكامل أو الامتراف؛ أعمّ من «المُوسِيقَار» لأنه يصف الدور الآني لا المهنة الدائمة"
      actions:
