    - lemma: "مؤدٍ موسيقي"
      decision: confirmed
      decision_reason: "يُعبِّر عن المفهوم بدقة: «مُؤَدٍّ» جنس قريب صحيح يشمل العازفين والمغنين وسائر المؤدين الفنيين، و«مُوسِيقِيّ» فصل نوعي مُحدِّد؛ مدعوم بترجمة performer في المورد الحديث؛ لا يعاني من ضيق الدلالة الذي يعاني منه «عازف»"
      evidence_assessment:
