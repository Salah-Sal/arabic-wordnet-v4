            new_lemma: "مُؤَدٍّ مُوسِيقِيّ"

    - lemma: "مُوسِيقَار"
      source: stage1
      decision: confirmed
      decision_reason: "موثَّق في المعجم الوسيط بتعريف صريح «من حرفته الموسيقى» وفي تكملة دوزي؛ مفرد خفيف يقبل التصريف والإضافة والجمع؛ يُضيف إلى المجموعة دلالة الاحتراف والامتراف الغائبة عن «مُؤَدٍّ مُوسِيقِيّ»"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على الاحتراف الموسيقي المُستدام بوصفه حرفة أو مهنة («من حرفته الموسيقى»)، ويحمل إيحاء بالتمجيد والبراعة؛ بخلاف «مُؤَدٍّ مُوسِيقِيّ» الذي يصف الفعل الأدائي ولا يستلزم الامتراف"
      actions:
        - command: create_entry
          params:
            lemma: "مُوسِيقَار"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "عَازِف"
      source: stage1
      decision: removed
      decision_reason: "رغم توثيقه في المعاجم واشتقاقه السليم من جذر «عزف»، تقصر دلالته على عازفي الآلات ولا يشمل المغنين؛ شواهد الاستخدام في المورد الحديث تُقيِّده دائماً بآلة بعينها (عازف الكمان، عازف الفلوت، إلخ)، مما يُضيِّق المفهوم ويجعله لا يُعادل executant الأشمل"

    - lemma: "مُنَفِّذ"
      source: stage1
