# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10834947-n  |  ILI: i94285
# الموضوع: أليسيا ألونسو — راقصة ومصممة رقصات كوبية
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "جميع اللمّات خالية من التشكيل — التشكيل الكامل إلزامي."
      - "صنف النحو (POS) مسجَّل n (اسم عام)، والصواب proper_noun لأنه اسم علم لشخص بعينه."
      - "لمّة «ألونسو» وحدها ملتبسة: اللقب مشترك بين شخصيات عديدة (سباقات السيارات، الفن، السياسة)، والاستخدام المنفرد دون الاسم الأول قد يُوقع في لبس."
      - "التعريف لا يُصنّف نوع الرقص (باليه)، وهو جوهري في وصف أليسيا ألونسو."
    observations: >
      المجموعة تمثّل اسم علم (proper noun) لشخصية تاريخية بعينها، هي راقصة الباليه
      الكوبية الشهيرة أليسيا ألونسو (1920/1921–2019). لمّتا المجموعة هما تعريبان
      صوتيّان للاسم الإسبانيّ: الاسم الكامل «أليسيا ألونسو» والمجهول المحتمل
      «ألونسو» باللقب وحده. جميع مرشحات التوليد ستكون من طريقة التعريب لأنه لا
      سبيل إلى اشتقاق اسم العلم أو بناء مركّب دلاليّ له في هذا السياق.

  blind_candidates:
    - lemma: "أَلِيسْيَا أَلُونْسُو"
      generation_method: taarib
      justification: >
        تعريب صوتيّ مباشر للاسمَيْن الإسبانيَّيْن Alicia Alonso. الصوائت طويلة
        في الموضعين (أَلِيسْيَا = /aˈlisja/، أَلُونْسُو = /aˈlonso/). هذا هو
        الشكل الأكثر تداولاً في المصادر العربية المعاصرة.
    - lemma: "أَلُونْسُو"
      generation_method: taarib
      justification: >
        تعريب اللقب الإسباني Alonso منفرداً؛ يُستعمل في سياقات الإحالة المختصرة
        حين يكون المرجع معلوماً من السياق أو من الاسم الكامل المذكور قبله.
    - lemma: "أَلِيثْيَا أَلُونْسُو"
      generation_method: taarib
      justification: >
        صيغة بديلة تعكس نطق الاسم في القشتالية الأوروبية إذ تُنطق فيها السين بين
        الأسنانية /θ/ (Alicia = /aˈliθja/)؛ غير شائعة في العربية لأن المصادر
        العربية تعتمد النطق الكوبي-اللاتيني /s/.
    - lemma: "أَلِيسْيَا"
      generation_method: taarib
      justification: >
        الاسم الأول وحده بوصفه صيغة اختصار مألوفة في الكتابة العربية عن شخصيات
        مشهورة بأسمائهم الأولى؛ مسجَّل في موسوعة السلطان قابوس لأسماء العرب
        بوصفه «إحدى صيغ الاسم اليس».


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   ١. مطابقة دقيقة دفعية: headword_norm IN (الونسو، اليسيا الونسو، اليسيا...) — صفر نتيجة للمة الأولى
#   ٢. الجسر الإنجليزي: translation_en:"Alonso" OR "Alicia Alonso" OR "choreographer" — نتيجتان
#   ٣. FTS عربي: "راقصة" OR "كوبية" OR "اليسيا" — نتائج سياقية
#   ٤. إثراء المعرّفات: entry_id IN (914038, 677907)
stage2_evidence:
  per_lemma:
    - lemma: "أَلُونْسُو"
      evidence_status: "no_material_found"

    - lemma: "أَلِيسْيَا أَلُونْسُو"
      evidence_status: "no_material_found"

    - lemma: "أَلِيسْيَا"
      expands:
        - text: "«اليسيا: إحدى صيغ الاسم اليس.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (جامعة السلطان قابوس، 1985)"
          addition: >
            يؤكد أن «اليسيا / أليسيا» اسم معروف في معجمية الأسماء العربية بوصفه
            معرَّباً من اسم أعجمي مؤنث، وهو ما يدعم شرعية استخدامه لمّةً عربية
            لشخصية تحمل هذا الاسم.

    - lemma: "أَلِيثْيَا أَلُونْسُو"
      evidence_status: "no_material_found"

    # أدلة سياقية مفيدة للمرحلة ٤
    - lemma: "[سياق — مصمم الرقصات]"
      confirm:
        - text: "«مُصَمِّم الرَّقَصات.»"
          source: "المورد الحديث (2008) — ترجمة choreographer"
      expands:
        - text: "«باليهـباليه [مفرد]: (فن) نوع مِن الرقص الإيقاعيّ التعبيريّ، عرضٌ مسرحيّ جماعيّ في الغالب، أساسه الرقص على موسيقى خاصّة، يحكي قصّة أو يُعبِّر عن فكرة.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يُثبّت المصطلح العربي الفصيح «باليه» بوصفه نوع الرقص الذي اشتُهرت به أليسيا ألونسو."
        - text: "«الهافانيّة: رقصة كوبيّة أو موسيقاها.»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد وجود مفردة عربية خاصة بالرقص الكوبي، ما يدعم دلالة الوصف الجغرافي في التعريف."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "أليسيا ألونسو"
      decision: confirmed
      decision_reason: >
        هذا هو الاسم الكامل للشخصية التاريخية المقصودة، وهو اللمّة المرجعية
        الأساسية التي تعرّف المجموعة دون التباس. يوجب التشكيل الكامل واستبدال
        الصنف النحوي للمدخل من noun إلى proper_noun.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل — يُحدّد الشخصية بدقة تامة ويمنع اللبس مع أي شخصية أخرى
        تحمل اللقب نفسه «ألونسو».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَلِيسْيَا أَلُونْسُو"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    - lemma: "ألونسو"
      decision: confirmed
      decision_reason: >
        اللقب وحده لمّة ثانوية مقبولة في مجموعات أعلام الأشخاص، إذ تعتمدها
        المصادر الموسوعية عند الإحالة المختصرة. يُبقى لكنه يحتاج تشكيلاً وتصويب
        الصنف النحوي إلى proper_noun.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب وحده — يُستعمل في السياق المختصر أو المرجعي حين يكون المرجع معلوماً،
        ويختلف عن الاسم الكامل في أنه لا يكفي للتعريف دون سياق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَلُونْسُو"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشحات المرحلة ١ ──

    - lemma: "أَلِيسْيَا أَلُونْسُو"
      source: stage1
      decision: removed
      decision_reason: >
        مكرّر — هذا هو اللمّة الموجودة ذاتها وقد أُخذت قراراتها أعلاه. لا حاجة
        لإجراء إضافي.

    - lemma: "أَلُونْسُو"
      source: stage1
      decision: removed
      decision_reason: >
        مكرّر — اللمّة الموجودة ذاتها. لا حاجة لإجراء إضافي.

    - lemma: "أَلِيثْيَا أَلُونْسُو"
      source: stage1
      decision: removed
      decision_reason: >
        النطق الأوروبي القشتالي /θ/ غير شائع في التعريب العربي للأسماء
        الإسبانية اللاتينية؛ المصادر العربية الموثوقة تعتمد «أليسيا» لا «أليثيا».
        لا دليل معجمي يدعمها.

    - lemma: "أَلِيسْيَا"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الأول وحده غير كافٍ لتحديد الشخصية دون اللقب؛ «أليسيا» اسم مشترك
        بين نساء كثيرات. استخدامها لمّةً منفردة لهذا الsynset يُوقع في لبس.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "راقصة ومصممة رقصات كوبية (ولدت عام 1921)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول من حيث الجوهر لكنه يفتقر إلى:
        (أ) ذكر نوع الرقص (الباليه) الذي اشتُهرت به الشخصية وهو جوهري للتمييز،
        (ب) التشكيل على الكلمات الجوهرية،
        (ج) التعريف الموسوعي الأدق الذي يُثبّت دورها التاريخي.
    authored:
      - type: encyclopedic
        text: >
          راقصةُ باليه كوبيّة بارزة ومصمِّمة رقصات، وُلدت عام 1921م،
          تُعدّ من أعظم راقصات الباليه الكلاسيكي في القرن العشرين،
          اشتُهرت بدور «جيزيل» وأسّست فرقة الباليه الوطنية الكوبية.
      - type: terminological
        text: >
          شخصية بعينها: راقصة باليه كوبية ومصمِّمة رقصات (مولودة 1921م).
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10834947-n"
          definition_index: 0
          text: "راقصةُ باليه كوبيّة بارزة ومصمِّمة رقصات، وُلدت عام 1921م، تُعدّ من أعظم راقصات الباليه الكلاسيكي في القرن العشرين، اشتُهرت بدور «جيزيل» وأسّست فرقة الباليه الوطنية الكوبية."
      - command: add_definition
        params:
          synset_id: "awn4-10834947-n"
          text: "شخصية بعينها: راقصة باليه كوبية ومصمِّمة رقصات (مولودة 1921م)."

  examples:
    per_lemma:
      - lemma: "أَلِيسْيَا أَلُونْسُو"
        examples:
          - text: "تُعدّ أَلِيسْيَا أَلُونْسُو من أبرز رائدات الباليه الكوبي، وقد أسّست فرقةً وطنيّةً حملت اسمها وذاع صيتها في العالم."
            type: usage
      - lemma: "أَلُونْسُو"
        examples:
          - text: "بلغت أَلُونْسُو قمة المجد الفنّي وهي تؤدّي دور جيزيل على خشبة المسرح الهافاني رغم كفاحها مع الإعاقة البصريّة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعدّ أَلِيسْيَا أَلُونْسُو من أبرز رائدات الباليه الكوبي، وقد أسّست فرقةً وطنيّةً حملت اسمها وذاع صيتها في العالم."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "بلغت أَلُونْسُو قمة المجد الفنّي وهي تؤدّي دور جيزيل على خشبة المسرح الهافاني رغم كفاحها مع الإعاقة البصريّة."


