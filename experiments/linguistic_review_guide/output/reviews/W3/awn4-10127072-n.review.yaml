# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان 'مؤسس' و'أب مؤسس' مكتوبتان بلا تشكيل كامل"
      - "اللمّة الإنجليزية 'beginner' في OEWN قد تُوحي بمعنى 'المتعلم المبتدئ' ظاهرياً، غير أن سياق المجموعة يُبيّن أنها تعني 'من يبدأ/يُنشئ' (founder)؛ يجب ألا يُضاف 'مبتدئ' أو 'ناشئ' بالمعنى التعليمي إلى هذه المجموعة"
      - "كلمة 'مُنْشِئ' ظهرت في المورد الحديث ترجمةً موازيةً لـ'founder/founding father'، إلا أنها موجودة بالفعل في لمّات المجموعة الفوقية (awn4-10403515-n)؛ إضافتها هنا يُربك التراتبية الدلالية"
      - "التعريف الحالي 'شخص يؤسس أو يقيم مؤسسة ما' يعاني من شبه دوران: الفعل يُؤَسِّس والاسم مُؤَسَّسة كلاهما من الجذر ذاته (أسس)"
    observations: "المجموعة تمثل مفهوم المؤسِّس (من أنشأ مؤسسةً أو هيئةً أو حركةً)، وهو مفهوم عربي راسخ ذو جذر أصيل (أسس). الجذر عند ابن فارس يدل على 'الأصل والشيء الوطيد الثابت'، وهو يناسب مفهوم التأسيس تماماً. اللمّة 'أب مؤسس' calque وصفي من 'founding father' ومقبول في السياق التاريخي والاحتفائي، ويُستعمل في الغالب بصيغة الجمع 'الآباء المؤسسون'. يجدر التنبّه إلى أن لمّة OEWN 'beginner' تقصد هنا 'البادئ/المنشئ' لا 'المتعلم الناشئ'."
  blind_candidates:
    - lemma: "وَاضِع"
      generation_method: ishtiqaq
      justification: "فَاعِل من و-ض-ع؛ يُستعمل كلاسيكياً في 'واضع النحو' و'واضع الأساس' للدلالة على من سنّ شيئاً أو أرساه لأول مرة؛ يُعيد إحياء استخدام فصيح قديم"
    - lemma: "بَانٍ"
      generation_method: majaz
      justification: "فَاعِل من بَنَى؛ إزاحة دلالية من 'من يشيّد البنيان' إلى 'من يُرسي مؤسسة'؛ شائع مجازاً في 'بانٍ للدولة' و'بانٍ للحضارة'"
    - lemma: "رَائِد"
      generation_method: majaz
      justification: "من رَادَ يَرُود؛ الرائد أصلاً من يتقدم القوم ليكشف الطريق؛ إزاحة وظيفية نحو من يُنشئ ويُمهّد أولاً في مجاله"
    - lemma: "نَاصِب"
      generation_method: ishtiqaq
      justification: "فَاعِل من نَصَبَ؛ نصبَ الشيء أي أقامه وأثبته؛ قياساً على من ينصب دعائم مؤسسة ويُقيمها"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مؤسس"
      confirm:
        - text: "«مؤسس» translation_en: founder — domain: Commerce and Accounting"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM، 1995)"
        - text: "«مؤسس» translation_en: founder — domain: Educational and Computer Techniques"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ARABTERM، 1999)"
        - text: "«مؤسِّس» translation_en: founder — domain: Law"
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM، 2017)"
        - text: "«المؤسِّس؛ المُنْشِئ»"
          source: "المورد الحديث (2008) — ترجمة عربية مباشرة لـ founder"

    - lemma: "أب مؤسس"
      confirm:
        - text: "«المُؤَسِّس؛ المُنْشِئ [لحركة أو مؤسَّسةٍ ما]»"
          source: "المورد الحديث (2008) — ترجمة عربية لـ founding father"
      expands:
        - text: "«المُؤَسِّس؛ المُنْشِئ [لحركة أو مؤسَّسةٍ ما]»"
          source: "المورد الحديث (2008)"
          addition: "المورد الحديث يُفضّل 'مؤسس' أو 'منشئ' مفرداً لترجمة founding father دون اشتراط لفظة 'أب'، مما يُشير إلى أن 'أب مؤسس' calque ثقيل نسبياً وإن كان مقبولاً في السياق الاحتفائي"

    - lemma: "واضع"
      contradicts:
        - text: "«واضَعَ الرجلَ مُواضَعَةً: أمال العِدلَ على المربِعة... راهنه وافقه في الأمر ناظره فيه»"
          source: "المعجم الوسيط"
          conflict: "المادة المعجمية لـ واضَعَ (Form III) تحمل دلالة المفاعلة والمراهنة والمشاورة لا التأسيس والإنشاء"
        - text: "«الْوَاوُ وَالضَّادُ وَالْعَيْنُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْخَفْضِ [لِلشَّيْءِ] وَحَطِّهِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "دلالة الجذر الأصلية في مقاييس اللغة هي الخفض والحط، وليست الإنشاء والإقامة؛ 'واضع النحو' الكلاسيكي غير مُدوَّن في المعاجم المستعلَمة كمصطلح مسكوك"

    - lemma: "بانٍ"
      evidence_status: "no_material_found"

    - lemma: "رائد"
      contradicts:
        - text: "«الذى يتقدم القوم يبصر لهم مواضع الكلأ ومساقط الغيث، من يقدم — غير مسبوق — على عمل فيمهد الطريق لمن بعده»"
          source: "المعجم الكبير"
          conflict: "الرائد يدل على السبق والتمهيد (pioneer)، وهو مفهوم مجاور للتأسيس ومغاير له؛ التأسيس يستلزم إنشاء مؤسسة دائمة، أما الريادة فتعني السبق بصرف النظر عن الإنشاء"
        - text: "«من يتَقَدَّم الْقَوْم يبصر لَهُم الْكلأ ومساقط الْغَيْث» — «الرائد لَا يكذب أَهله» (مثل)"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          conflict: "الاستعمال المستقر للرائد هو المعنى المكاني/الزمني (السابق المتقدم)، لا الإنشاء المؤسسي"

    - lemma: "ناصب"
      contradicts:
        - text: "«هَمّ ناصِب: مُتعِب عيش ناصب: فيه كدٌّ وجُهد»"
          source: "المعجم الوسيط"
          conflict: "ناصب في المعاجم الكلاسيكية والحديثة صفة مشبهة بمعنى 'مُتعِب/مُكِد'، لا اسم فاعل بمعنى 'من يُقيم/يُنشئ'"
        - text: "«كل ما يدفع إلى الإنتصاب، مثل العضلات التي تحمل جزءاً ما أو ترفعه» — translation_en: erector"
          source: "معجم المصطلحات الطبية ج.2 (ARABTERM، 2003)"
          conflict: "الاستعمال الاصطلاحي الحديث لـ'ناصب' محصور في السياق التشريحي (العضلة الناصبة)"


