        الاسم المُسجَّل في وثائق الميلاد والوفاة ويُستخدم في السياقات الموسوعية الرسمية.
    - lemma: "بَيْب زاهارياس"
      generation_method: taarib
      justification: >
        الصورة المختصرة الشائعة (Babe Zaharias) الجامعة بين اللقب الشهير
        واسم الزوج، وهي الصيغة الأكثر تداولاً في الأدبيات العربية الرياضية
        الحديثة إن وُجدت.
    - lemma: "دِيدريكسون"
      generation_method: taarib
      justification: >
        اللقب العائلي الأصلي (Didrikson) قبل الزواج، ويُستخدم في السياقات
        التاريخية عند الإشارة إلى مرحلة مسيرتها الأولى في ألعاب القوى والأولمبياد.


