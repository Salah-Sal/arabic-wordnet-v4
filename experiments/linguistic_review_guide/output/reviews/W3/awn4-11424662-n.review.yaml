stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة مجرّدة من التشكيل الكامل، وهو شرط إلزامي في AWN4."
      - "النسخة العربية تحتوي على لمّتين فقط (بيب ديدريكسون زاهارياس، وزاهارياس) في حين تشتمل النسخة الإنجليزية على سبع لمّات؛ يُلاحَظ غياب الصور الاختصارية الشائعة كـ'بَيْب زاهارياس' و'ديدريكسون'."
      - "لمّة 'زاهارياس' منفردةً غامضة دلالياً وقد تُحيل إلى أشخاص آخرين يحملون هذا اللقب."
      - "تعريف المجموعة الحالي ('رياضية أمريكية بارزة') مُقتضَب جداً ولا يُفيد المستخدم بشيء عن هوية الشخص."
      - "هذه المجموعة من نوع الاسم العلَم (proper noun) ولا يوجد لها مادة معجمية في قاعدة البيانات المُستعلَمة — المصادر الكلاسيكية والحديثة خالية من هذا العَلَم."
    observations: >
      المجموعة الترادفية awn4-11424662-n تمثّل اسم عَلَم لشخص بعينه، هي الرياضية الأمريكية
      «بَيْب ديدريكسون زاهارياس» (الاسم الكامل: Mildred Ella Didrikson Zaharias) المولودة
      عام 1911 والمتوفاة عام 1956، وتُعدّ من أبرز الرياضيات في تاريخ الولايات المتحدة
      خلال القرن العشرين. أسلوب التلمية (التعريب الصوتي/taarib) هو السبيل الوحيد
      المتاح لتوليد لمّات لهذه المجموعة، إذ لا تنتمي المكوّنات إلى جذور عربية.
      تعمل اللمّة 'بيب' نقلاً صوتياً للّقب الإنجليزي "Babe"، واللمّة 'زاهارياس'
      نقلاً للقب الزوج. جميع المرشحات العمياء تنتمي بالضرورة إلى طريقة التعريب.

