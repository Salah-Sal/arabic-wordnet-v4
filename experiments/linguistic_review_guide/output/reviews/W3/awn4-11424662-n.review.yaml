        ذي المقطع المفتوح الشائع في تعريب الأسماء الأنثوية الإنجليزية، مضافاً
        إليها الاسم العائلي المعرَّب.
    - lemma: "مِيلدريد إيلا دِيدريكسون زاهارياس"
      generation_method: taarib
      justification: >
