# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13985502-n
# survival, endurance — بقاء، نجاة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «حالة البقاء على قيد الحياة» يستعمل لفظ «البقاء» وهو أحد لمّات المجموعة، مما يوقع في الدَّوْر المعجمي"
      - "اللمّة «نجاة» دلالتها الأصلية الخلاص من الخطر لا مجرد الاستمرار في الحياة، فثمة فرق دلالي دقيق بينها وبين «بقاء»"
    observations: "المجموعة تمثّل مفهوم البقاء على قيد الحياة بوصفه حالة (اسم مصدر)، وهو مفهوم عربي أصيل وردت مادّته في القرآن والحديث والشعر. اللمّتان الحاليتان تغطّيان وجهَيْ المفهوم: البقاء (الدوام والاستمرار) والنجاة (الخلاص من الهلاك). العلاقة بفوقيّها «حياة» واضحة: البقاء حالة خاصة من الحياة تتضمّن معنى الاستمرار رغم التهديد."
  blind_candidates:
    - lemma: "نَجَاء"
      generation_method: ishtiqaq
      justification: "مصدر نَجَا يَنْجُو، على وزن فَعَال، يدلّ على الإسراع في النجاة والخلاص"
    - lemma: "اسْتِبْقَاء"
      generation_method: ishtiqaq
      justification: "مصدر اسْتَبْقَى على وزن اسْتِفْعَال، يدلّ على طلب البقاء والحفاظ على الحياة"
    - lemma: "صُمُود"
      generation_method: majaz
      justification: "مصدر صَمَدَ بمعنى الثبات والمقاومة، يُستعار مجازاً للدلالة على البقاء والتحمّل (endurance)"
    - lemma: "تَعَمُّر"
      generation_method: ishtiqaq
      justification: "مصدر تَعَمَّرَ من الجذر عمر الدالّ على الحياة وامتداد الزمان، بمعنى طول العمر والبقاء"


stage2_evidence:
  per_lemma:
    - lemma: "بَقَاء"
      confirm:
        - text: "«البقاء: ثبات الشيء على الحالة الأولى ويضاده الفناء»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«بقاء — survival» (مصطلح في علم الاجتماع والأنثروبولوجيا)"
          source: "مسرد علم الاجتماع والأنثروبولوجيا، أليكسو"
        - text: "«بقاء — survival» (مصطلح زراعي)"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC"
        - text: "«(1) البقاء: بقاء المرء أو الشيء بعد زوال غيره»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«البقاء: قيام الأوصاف المحمودة»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "دلالة اصطلاحية صوفية إضافية لا تؤثر على المعنى اللغوي العام"
        - text: "«(بَقِيَ) الباء والقاف والياء أصل واحد، وهو الدوام. يقال: بَقِيَ الشيء يبقى بقاءً، وهو ضدّ الفناء»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكّد أنّ الجذر بقي أصله الدوام وضدّه الفناء"

    - lemma: "نَجَاة"
      confirm:
        - text: "«النجاة: الخلاص مما فيه المخافة ونظيرها السلامة، ذكره الحرالي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«نَجَاة — من (ن ج و) الخلاص من الأذى، وما ارتفع من الأرض، وناقة نجاة: سريعة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(نجا) منه نجاءً ونجاةً خلص من أذاه»"
          source: "المعجم الوسيط"
          addition: "يؤكّد أنّ النجاة مصدر نجا بمعنى الخلاص من الأذى"
        - text: "«(نَجَوَ) النون والجيم والحرف المعتل أصلان، يدلّ أحدهما على كشط وكشف، والآخر على ستر وإخفاء... والنجاة والنجوة من الأرض وهي التي لا يعلوها سيل»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الأول (الكشط والانكشاف) يتفرّع منه معنى الذهاب والنجاة"

    - lemma: "نَجَاء"
      contradicts:
        - text: "«(النَّجَاء) الإسهال أو داء يورثه»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي الأوّل في الوسيط هو الإسهال أو داء، لا البقاء على قيد الحياة"
      expands:
        - text: "«(نجا) منه نجاءً ونجاةً خلص من أذاه، ونجاءً أسرع»"
          source: "المعجم الوسيط"
          addition: "نجاء بالمدّ مصدر أيضاً لكنّه يغلب عليه معنى الإسراع، والمعجم يفرّق بينه وبين نجاة"

    - lemma: "اسْتِبْقَاء"
      contradicts:
        - text: "«استبقاء — retention» (مصطلح في إدارة النفايات)"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، أليكسو"
          conflict: "المعنى المصطلحي المعاصر هو الإبقاء/الاحتفاظ (retention) لا البقاء على قيد الحياة (survival)"
        - text: "«اسْتِبْقاء — sparing»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعنى الطبي هو الإعفاء/العفو (sparing) وهو مختلف عن حالة البقاء"

    - lemma: "صُمُود"
      contradicts:
        - text: "«صمود — invariance» (مصطلح رياضيات)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          conflict: "الصمود في الاصطلاح الرياضي يعني الثبات (invariance) لا البقاء الحيوي"
        - text: "«صمود — Resilience: قدرة النظام على استعادة العمليات بسرعة بعد وقوع حادث»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
          conflict: "الصمود بمعنى المرونة/المقاومة (resilience) يختلف دلالياً عن البقاء على قيد الحياة"
      expands:
        - text: "«صُمُود — من (ص م د) الثبات والاستمرار»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "المعنى اللغوي العام هو الثبات والاستمرار، وهو أعمّ من البقاء على قيد الحياة"
        - text: "«(صَمَدَ) الصاد والميم والدال أصلان: أحدهما القصد، والآخر الصلابة في الشيء»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الثاني (الصلابة) قريب من الثبات لكنّه لا يتضمّن معنى البقاء حيّاً"

    - lemma: "تَعَمُّر"
      contradicts:
        - text: "«(تعمر) أدّى العمرة»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي الوحيد لتَعَمَّرَ في الوسيط هو أداء العمرة، لا البقاء على قيد الحياة"
        - text: "«تَعْمُرُ: موضع باليمامة. وتعمر أيضا: قرية بالسواد»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "اسم موضع جغرافي لا علاقة له بالمفهوم"


stage3_analysis:
  per_lemma:
    - lemma: "بَقَاء"
      decision: confirmed
      decision_reason: "لفظ عربي فصيح أصيل من الجذر بقي الدالّ على الدوام، وهو مصدر بَقِيَ يَبْقَى. تؤكّد المعاجم الكلاسيكية والحديثة والمصطلحيات المعاصرة استخدامه بمعنى survival. ثبت في المناوي والسيوطي والمورد الحديث ومصطلحيات أليكسو الطبية والزراعية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الدوام والاستمرار في الوجود بشكل عام، ولا يستلزم سبق خطر أو تهديد. هو الأعمّ دلالياً."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَقَاء"

    - lemma: "نَجَاة"
      decision: confirmed
      decision_reason: "لفظ عربي فصيح من الجذر نجو، مصدر نَجَا يَنْجُو. دلالته الخلاص من الأذى والمخافة، وهو متوافق مع المعنى الإنجليزي surviving بمعنى النجاة من الهلاك. ثبت في المناوي والوسيط وموسوعة السلطان قابوس."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الخلاص والسلامة من خطر محدق أو أذى واقع، فيتضمّن عنصر التهديد السابق الذي لا يتضمّنه «بقاء»."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَجَاة"

    - lemma: "نَجَاء"
      source: stage1
      decision: removed
      decision_reason: "النَّجَاء بالمدّ معناه الأوّل في المعجم الوسيط الإسهال أو داء يورثه، ومعناه الثاني الإسراع في السير. وهو يتداخل مع «نجاة» الموجودة أصلاً في المجموعة دون إضافة دلالية جديدة، فضلاً عن الالتباس بالمعنى المرضي."
      evidence_assessment:
        case: mixed

    - lemma: "اسْتِبْقَاء"
      source: stage1
      decision: removed
      decision_reason: "الاستبقاء في المصطلحيات المعاصرة يُقابل retention وsparing، أي الإبقاء والاحتفاظ، وهو مفهوم متعدٍّ (فاعل يُبقي مفعولاً) لا لازم (حالة الشيء الباقي). البقاء على قيد الحياة حالة لازمة وليست فعل إبقاء."
      evidence_assessment:
        case: contradicts_only

    - lemma: "صُمُود"
      source: stage1
      decision: removed
      decision_reason: "الصمود بمعنى الثبات والمقاومة والمرونة (resilience/invariance) يختلف دلالياً عن حالة البقاء على قيد الحياة. فهو يصف موقفاً إرادياً أو خاصية فيزيائية، لا حالة وجودية بيولوجية. إدراجه يُحدث ضبابية دلالية."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَعَمُّر"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعجمي الوحيد لتعمّر في الوسيط هو أداء العمرة، ولم يُسجَّل بمعنى البقاء أو طول العمر. الجذر عمر يدلّ على الحياة لكنّ هذا الوزن (تفعُّل) لم يُستعمل في هذا المعنى."
      evidence_assessment:
        case: contradicts_only


