    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُخصِّص الحاسِبَ في عملية الطرح تحديداً دون سائر العمليات الحسابية","mwe":false}'
    - command: set_metadata
      params:
