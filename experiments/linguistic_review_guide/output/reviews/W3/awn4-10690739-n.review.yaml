# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10690739-n  |  ILI: i93412  |  POS: n
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة الموجودة «طاحر» مشكوك في صحتها: الجذر ط-ح-ر لا علاقة له
        بعملية الطرح الحسابي، وجميع المعاجم التي وثّقته (المعجم الكبير) تُعرِّفه بـ«سعة
        العيش» — وهو معنى مختلف كلياً. يُرجَّح أنها خطأ مطبعي بالقلب المكاني بين ر وح
        (طارح ← طاحر)."
      - "التعريف العربي «شخص يقوم بطرح الأرقام» وظيفي لا معجمي، ويفتقر إلى الجنس
        القريب والفصل النوعي الذي يُميّز التعريف المصطلحي."
      - "لا يوجد في المجموعة سوى لمّة واحدة، وهي موضع شك؛ مما يجعل المجموعة بحاجة
        إلى إعادة بناء كاملة."
    observations: >
      المجموعة تُمثّل مفهوماً حسابياً: «مَن يجري عملية الطرح». الطرح
      (subtraction) مصطلح راسخ في التراث العربي والحديث؛ فالفعل طَرَحَ يعني
      «أسقط وأزال»، ومنه «الطرح» بمعنى الإسقاط الحسابي. اسم الفاعل المنتظر
      هو «طارِح»، لا «طاحر». المجموعة الأمّ (حاسب/مُحسِّب) تُشير إلى أن
      المقصود شخص متخصص في الحساب بوجه عام، وهذه المجموعة تُضيق إلى من
      يختص بالطرح تحديداً.

  blind_candidates:
    - lemma: "طارِح"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الجذر ط-ر-ح على وزن فاعِل؛ الطرح هو الاسم العربي
        المعيار لعملية الإسقاط الحسابي (subtraction)، فـ«طارِح» هو من
        يُجري هذه العملية. الوزن (فاعِل) يُعبّر عن اسم الفاعل الذي هو
        المقصود هنا (شخص يقوم بالفعل).
    - lemma: "طَرَّاح"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال يُفيد الاحتراف والمبالغة (مثل: حسَّاب، عدَّاد)؛
        قياساً عليه «طَرَّاح» لمن يحترف عملية الطرح الحسابي أو يُكثر
        منها. محاولة لتمييز المحترف عن من يُجري الطرح عَرَضاً.
    - lemma: "مُطَرِّح"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من طَرَّحَ (Form II)، بمعنى من يُكثر الطرح أو يُمارسه
        على وجه التكثير. محاولة اشتقاقية بديلة تستعمل صيغة التضعيف.
    - lemma: "خافِض"
      generation_method: majaz
      justification: >
        مجاز دلالي من الجذر خ-ف-ض بمعنى «من يُخفِّض/يُنقص»؛ الطرح
        في جوهره خفض لقيمة العدد، فقد يُستعمل «خافض» مجازاً للدلالة
        على من يُنقص الأرقام. إلا أن الاستعمال الراسخ لهذا الوزن في
        العربية لا يتجه نحو العمليات الحسابية.


stage2_evidence:
  per_lemma:
    - lemma: "طاحر"
      contradicts:
        - text: "«الطَّاحِرُ مِنَ الْعَيْشِ: سَعَتُهُ»"
          source: "المعجم الكبير (OCR)"
          conflict: >
            المعنى الموثّق لـ«الطاحر» في المعاجم هو «سعة العيش وبحبوحته» من
            جذر ط-ح-ر، وهو معنى لا صلة له البتة بعملية الطرح الحسابي
            أو الشخص الذي يُجريها.
        - text: "«الطَّاءُ وَالْحَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى
            الْحَفْزِ وَالرَّمْيِ وَالْقَذْفِ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          conflict: >
            أصل الجذر ط-ح-ر عند ابن فارس هو «الحفز والرمي والقذف»، وليس
            الإسقاط الحسابي؛ مما يؤكد أن «طاحر» لا يصلح لمّةً لهذا المفهوم.

    - lemma: "طارِح"
      confirm:
        - text: "«طَارِحٌ» — translation_en: subtracter"
          source: "المعجم الطبي الموحد 2009 (ARABTERM)"
        - text: "«طارِح» — translation_en: eliminant"
          source: "المعجم الطبي الموحد 2009 (ARABTERM)"
        - text: "«طَرَحَ» — translation_en: subtract (to-)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك 1990 (ARABTERM)"
      expands:
        - text: "«طارَحَ الشيءُ فلانًا: رده إلى أصول بعيدة. فلانٌ فلانًا الحديثَ:
            حاوَرَه وبادَلَه»"
          source: "المعجم الكبير (OCR)"
          addition: >
            يُظهر أن الجذر ط-ر-ح بصيغة المفاعلة (طارَحَ Form III) له معنى
            مختلف (المحاورة والمبادلة)؛ لكن اسم الفاعل «طارِح» من Form I
            يظل صحيحاً لمن يُجري الطرح الحسابي حسب توثيق ARABTERM.
        - text: "«الطَّاءُ وَالرَّاءُ وَالْحَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى
            نَبْذِ الشَّيْءِ وَإِلْقَائِهِ. يُقَالُ: طَرَحَ الشَّيْءَ يَطْرَحُهُ
            طَرْحًا»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            ابن فارس يُرجع الطرح إلى أصل «النبذ والإلقاء»؛ وهو ما اتّسع
            دلالياً في الاستعمال الحسابي ليعني إسقاط عدد من آخر، إذ
            الطرح كالنبذ إسقاطٌ ورمي.

    - lemma: "طَرَّاح"
      contradicts:
        - text: "«الطَّراحُ: المكان البعيد الشاسع»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            «الطَّراح» و«الطَّرَّاح» في المعاجم يعنيان «المكان البعيد»
            لا الشخص المُجري لعملية الطرح، وهو معنى مغاير.
        - text: "«مِنَ الأماكن ونحوها: البَعِيدُ وقيل البعيد الشَّاسِع»"
          source: "المعجم الكبير (OCR)"
          conflict: >
            التوثيق المعجمي لـ«الطَّرَّاح» (وزن فَعَّال من ط-ر-ح) لا يُثبت
            معنى الشخص المُجري للطرح الحسابي، بل يُثبت معنى المكان البعيد.

    - lemma: "مُطَرِّح"
      evidence_status: "no_material_found"

    - lemma: "خافِض"
      contradicts:
        - text: "«يُقَال هُوَ خافض الْجنَاح وخافض الطير وقور سَاكن»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            المعنى المعجمي الموثَّق لـ«خافض» هو الوقار والسكون (خافض الجناح)،
            ولا يمتد في الاستعمال العربي إلى الطرح الحسابي.


stage3_analysis:
  per_lemma:
    - lemma: "طاحر"
      decision: removed
      decision_reason: >
        «طاحر» جذره ط-ح-ر وليس ط-ر-ح؛ معناه في المعاجم «سعة العيش»
        (المعجم الكبير) لا الطرح الحسابي. ابن فارس يُرجع ط-ح-ر إلى
        «الحفز والرمي والقذف» — وهو مغاير تماماً. الترجيح القوي أن
        «طاحر» خطأ مطبعي بالقلب المكاني لـ«طارح» (تقديم الحاء على الراء).
        يجب إزالة ربط هذه اللمّة بالمجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "طارِح"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في المعجم الطبي الموحد (ARABTERM 2009) بمعنى «subtracter»
        مباشرةً. اسم الفاعل «طارِح» من الجذر الراسخ ط-ر-ح الذي يعني
        في الحساب العربي «إسقاط عدد من آخر»، وقد استُعمل «الطرح» بهذا
        المعنى في مصطلحات الرياضيات. الوزن (فاعِل) مناسب تماماً للدلالة
        على اسم الفاعل الإنساني. يُستبدل به «طاحر» الخاطئ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة بعد إزالة «طاحر»؛ تُعبّر عن الشخص
        الذي يُجري عملية الطرح الحسابي تحديداً، وتتمايز عن المُصطلح
        الأعمّ «حاسِب» (hypernym) بتخصيصها في عملية الطرح دون سواها.
      actions:
        - command: create_entry
          params:
            lemma: "طارِح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "طَرَّاح"
      source: stage1
      decision: removed
      decision_reason: >
        «الطَّراح» و«الطَّرَّاح» في المعاجم يدلان على المكان البعيد الشاسع
        (المعجم الوسيط والكبير)؛ ولا يوجد توثيق لاستعمال «طَرَّاح» بمعنى
        مَن يُجري الطرح الحسابي، مع أن الوزن مُنتِج للاحتراف. الاستعمال
        الراسخ يُعيق السكّ في هذا المسار.

    - lemma: "مُطَرِّح"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية تُثبت استعمال «مُطَرِّح» بمعنى الشخص المُجري
        للطرح الحسابي. Form II «طَرَّحَ» غير مُثبَّت في المعاجم بهذا
        المعنى، ووجود «طارِح» الأوفر دليلاً يُغني عنه.

    - lemma: "خافِض"
      source: stage1
      decision: removed
      decision_reason: >
        «خافِض» موثَّق بمعنى الوقار والسكون (خافض الجناح) ولا يمتد
        دلالياً إلى الطرح الحسابي في الاستعمال العربي. اختبار الاستبدال
        يُفشل هذا المرشح: لا يمكن تعويض «طارِح» بـ«خافِض» في سياق
        الحساب مع الحفاظ على المعنى الحسابي الدقيق.


stage4_content:
  definition:
    current: "شخص يقوم بطرح الأرقام"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وظيفي عامي («يقوم بطرح») يفتقر إلى الجنس القريب
        الصريح والفصل النوعي، ولا يتطابق مع أسلوب المعجم الوسيط.
        كما أن صياغة «يقوم بـ» ثقيلة ويمكن تجاوزها باسم الفاعل المباشر.
    authored:
      - type: terminological
        text: >
          مَن يُجري عملية الطرح الحسابي، وهي إسقاط عددٍ (المطروح)
          من عددٍ آخر (المطروح منه) للحصول على الباقي
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          الشخصُ القائمُ بالطرحِ في الحسابِ؛ يُسقِطُ المطروحَ من
          المطروح منه فيحصل على الفرق بينهما
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَن يُجري عملية الطرح الحسابي، وهي إسقاط عددٍ (المطروح) من عددٍ آخر (المطروح منه) للحصول على الباقي"

  examples:
    per_lemma:
      - lemma: "طارِح"
        examples:
          - text: "أجرى الطارحُ العملية الحسابية بإسقاط خمسةٍ من اثني عشر، فكان الباقي سبعةً"
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أجرى الطارحُ العملية الحسابية بإسقاط خمسةٍ من اثني عشر، فكان الباقي سبعةً"


stage5_enrichment:
  per_entry:
    - lemma: "طارِح"
      entry_id: "{auto}"
      root: "طرح"
      maqayis_quote: >
        «الطَّاءُ وَالرَّاءُ وَالْحَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى نَبْذِ
        الشَّيْءِ وَإِلْقَائِهِ. يُقَالُ: طَرَحَ الشَّيْءَ يَطْرَحُهُ طَرْحًا.
        وَمِنْ ذَلِكَ الطَّرَحُ، وَهُوَ الْمَكَانُ الْبَعِيدُ»

  per_sense:
    - lemma: "طارِح"
      sense_id: "{auto}"
      nuance: >
        المصطلح الوحيد في المجموعة؛ يُخصِّص مفهوم «الحاسِب» (الأعمّ)
        في عملية الطرح تحديداً — وهي إسقاط عدد من آخر — دون سائر
        العمليات الحسابية كالجمع والضرب والقسمة. يمتاز بأنه اسم فاعل
        منتظم على وزن فاعِل من الجذر ط-ر-ح الموثَّق معجمياً بالمعنى
        الحسابي في مصطلحيات ARABTERM.

  synset:
