      evidence_assessment:
        case: no_material

    - lemma: "تَخَلُّفُ الإِيقَاع"
      source: stage1
      decision: removed
      decision_reason: "غير مسجّل في المعاجم. المركّب واضح المعنى لكنه لم يثبت استعمالاً ولا يكفي للتوصية به مصطلحاً"
      evidence_assessment:
        case: no_material

    - lemma: "إِعْيَاءُ النَّفَّاثَة"
      source: stage1
