# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14040504-n (jet lag)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«اضطراب الرحلات الجوية الطويلة» عبارة وصفية مطوّلة (٤ كلمات) لا تستوفي شروط المصطلح المعجمي؛ يمكن إبدال أيّ مكوّن بمرادفه والعبارة تبقى صالحة كوصف حرّ"
      - "«إعياء السفر» عامّ جداً ولا يختصّ بالسفر الجوّي أو اختلاف المناطق الزمنية؛ قد ينطبق على أيّ تعب من السفر"
      - "المجموعة تفتقر إلى المصطلح الطبّي المعياري المعتمد في المعاجم الطبّية الموحّدة"
    observations: "المفهوم حديث مرتبط بالطيران النفّاث عبر المناطق الزمنية. يحتاج إلى مصطلح عربي دقيق يميّزه عن مطلق التعب من السفر. الجنس القريب هو الإرهاق/الإعياء، والفصل النوعي هو اختلال الإيقاع اليوماوي بسبب عبور المناطق الزمنية بالطائرة النفّاثة."

  blind_candidates:
    - lemma: "إِرْهَاقُ الطَّيَرَان"
      generation_method: tarkib
      justification: "مركّب إضافي يجمع بين الإرهاق (الجنس القريب في التعريف) والطيران (الوسيلة المسبِّبة)، أخصّ من إعياء السفر لأنه يقصره على السفر الجوّي"
    - lemma: "تَخَلُّفُ الإِيقَاع"
      generation_method: tarkib
      justification: "مركّب إضافي من تخلُّف (تأخُّر، من خ-ل-ف) والإيقاع (إيقاع الجسم البيولوجي)؛ يعكس جوهر الظاهرة وهو تأخّر الساعة الداخلية عن التوقيت المحلّي"
    - lemma: "إِعْيَاءُ النَّفَّاثَة"
      generation_method: tarkib
      justification: "مركّب إضافي يربط الإعياء بالنفّاثة (الطائرة النفّاثة كما في المعجم الوسيط)؛ ترجمة بنيوية دقيقة لـ jet fatigue"
    - lemma: "جِتْلَاغ"
      generation_method: taarib
      justification: "تعريب صوتي لـ jet lag على وزن فِعْلال؛ ملاذ أخير لانعدام مصطلح مفرد عربي شائع"

stage2_evidence:
  per_lemma:
    - lemma: "إِعْيَاءُ السَّفَر"
      confirm:
        - text: "«الإعياء: عجز يلحق البدن من المشي»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الإعياء عند الأطباء كلال مفرط يعرض في المفاصل والعضلات ويسمّى في العرف تعباً... وإن حدث بتوسط الحركة يسمّى الإعياء الرياضي، وإن حدث بذاته بلا واسطة الحركة يسمّى الإعياء الذي لا يعرف له سبب وهذا مقدمة المرض»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«السِّينُ وَالْفَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْكِشَافِ وَالْجَلَاءِ. مِنْ ذَلِكَ السَّفَرُ، سُمِّيَ بِذَلِكَ لِأَنَّ النَّاسَ يَنْكَشِفُونَ عَنْ أَمَاكِنِهِمْ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "دلالة الجذر على الانكشاف عن المكان تناسب مفهوم السفر عموماً لا السفر الجوّي خصوصاً"

    - lemma: "اضْطِرَابُ الرِّحْلَاتِ الجَوِّيَّةِ الطَّوِيلَة"
      evidence_status: "no_material_found"

    - lemma: "إِرْهَاقُ الطَّيَرَان"
      evidence_status: "no_material_found"

    - lemma: "تَخَلُّفُ الإِيقَاع"
      evidence_status: "no_material_found"

    - lemma: "إِعْيَاءُ النَّفَّاثَة"
      expands:
        - text: "«النفاثة: طائرة سريعة تعتمد في طيرانها على نفث الهواء (محدثة)»"
          source: "المعجم الوسيط"
          addition: "يؤكد أنّ النفّاثة مصطلح معجمي مقبول للطائرة النفّاثة"

    - lemma: "جِتْلَاغ"
      evidence_status: "no_material_found"

    - lemma: "تَلَكُّؤُ النَّفَّاثَة"
      confirm:
        - text: "«تَلَكُّؤُ النَفَّاثَةِ (الاختلاف الذي يولده اختلاف الوقت في النظم البيولوجية للجسم عند الطيران السريع من منطقة لاخرى)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«النَّفَّاثَةُ: طائرة سريعة تعتمد فى طيرانها على نفث الهواء»"
          source: "المعجم الوسيط"
      expands:
        - text: "«تلكؤ» = lagging"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "يؤكد استخدام تلكؤ بمعنى التأخّر والتباطؤ في المصطلحية العلمية العربية"
        - text: "«النُّونُ وَالْفَاءُ وَالثَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى خُرُوجِ شَيْءٍ مِنْ فَمٍ أَوْ غَيْرِهِ بِأَدْنَى جَرْسٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر ن-ف-ث يدلّ على النفث والقذف، ومنه اشتقّت النفّاثة"

    - lemma: "إِنْهَاكُ تَفَاوُتِ الوَقْت"
      confirm:
        - text: "«إنهاك تفاوت الوقت، إنهاك تفاوت التوقيت» = jetlag"
          source: "مسرد الفن والتسلية والرياضة (ALECSO/ArabTerm)"
      contradicts:
        - text: "«انهأك فلانٌ: تَحيَّر وتَهوَّر»"
          source: "المعجم الوسيط"
          conflict: "الجذر هـ-و-ك يدلّ على التحيّر والتهوّر في المعجم الوسيط، بينما الاستخدام الحديث يقصد بالإنهاك الإرهاق الشديد من جذر ن-ه-ك، وهو خلط صرفي"

