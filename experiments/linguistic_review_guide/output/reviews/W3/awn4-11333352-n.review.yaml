# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-11333352-n  |  ILI: i96991
# Francis Edgar Stanley — مخترع السيارة البخارية
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل، وهو إلزامي لكل مدخل مؤكَّد."
      - "اللمّة 'ستانلي' مشتركة بين عدة أعلام مشهورين (المستكشف هنري مورتون ستانلي، وغيره)، مما يُنتج لبسًا محتملاً بدون السياق الكامل."
      - "المجموعة تمثل اسم علم شخصي (proper noun instance) لمخترع أمريكي بعينه؛ ووسمها بـ pos: n مقبول في اصطلاح WordNet لكن يستحق التوثيق."
      - "لم يُشَر إلى سيارة ستانلي البخارية (Stanley Steamer) بالاسم في التعريف، وهي أبرز ما يُعرَّف به."
    observations: >
      هذه المجموعة الترادفية تُمثّل مدخلاً لاسم علم شخصي (named entity instance) وليست مفهوماً
      لغوياً اشتقاقياً. فرانسيس إدغار ستانلي (1849-1918) مخترع أمريكي صنع مع أخيه التوأم
      فريلان أوسكار ستانلي سيارةً تسير بالبخار عُرفت بـ«ستانلي ستيمر» (Stanley Steamer).
      اللمّتان الحاليتان هما تعريبان (transliteration) للاسم الإنجليزي، وهو المنهج الصواب
      لأسماء الأعلام الأجنبية. الإشكالية الرئيسية هي غياب التشكيل وأن اللمّة المختصرة (ستانلي)
      غامضة. لا يمكن توليد لمّات اشتقاقية حقيقية لاسم علم أجنبي، بل يقتصر التوليد على
      صيغ تعريب بديلة.

  blind_candidates:
    - lemma: "سْتَانْلِي"
      generation_method: taarib
      justification: >
        التعريب الصوتي المختصر للاسم الإنجليزي Stanley؛ قياساً على العلم الواحد المنسوب
        إلى صاحب الاختراع، إذ تُختصر الأسماء المركبة في الاستخدام الشائع.
    - lemma: "فرَانْسِيس سْتَانْلِي"
      generation_method: taarib
      justification: >
        صيغة الاسم الثنائية (الاسم الأول + اللقب) الأكثر شيوعاً في الإشارة إلى الأعلام
        الأمريكيين في المصادر العربية الموسوعية؛ تُوازن بين الاختصار والتمييز.
    - lemma: "فرَانْسِيس إدغَار سْتَانْلِي"
      generation_method: taarib
      justification: >
        الاسم الثلاثي الكامل (الاسم الأول + الاسم الأوسط + اللقب) الضروري للتمييز القاطع
        عن سائر من يحملون اللقب ستانلي في المصادر التاريخية والأكاديمية.
    - lemma: "سْتَانْلِي الْمُخْتَرِع"
      generation_method: tarkib
      justification: >
        مركب وصفي يضيف كلمة «المخترع» للتمييز عن بقية أصحاب الاسم؛ غير أنه غير مألوف
        في الاستخدام الموسوعي المعياري ويُدرَج كمرشح احتياطي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة: 4 استعلامات
# 1. Batch headword lookup: ستانلي / فرانسيس ادغار ستانلي / فرانسيس ستانلي / سيارة بخارية
# 2. English bridge: "Stanley" / "Francis Edgar Stanley" / "steam automobile" / "steam car"
# 3. Arabic FTS: "مخترع" / "سيارة بخارية" / "بخارية" / "اختراع"
# 4. Maqayis query: سَتَنَ / سَطَنَ (للتحقق من وجود جذر عربي مقابل)
stage2_evidence:
  per_lemma:
    - lemma: "ستانلي"
      confirm:
        - text: "«ستانلي — عن الإنجليزية القديمة بمعنى أعلى الباب. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«عُصَيَّةُ ستانلي (السَّلْمُونيلَةُ الْمُلْهِبَةُ لِلأَمْعاء)» — Stanley bacillus (Salmonella enteritidis)"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُثبت أن «ستانلي» اسم علم عربي متداول في السياقات التخصصية، لكنه يُحيل هنا
            إلى شخص مختلف (عالم أحياء دقيقة)، مما يُعزز مخاوف الغموض.
        - text: "«حُزْمَةُ ستانلي كِينت (الحُزْمَةُ الأُذَيْنِيَّةُ البُطَيْنِيَّة)» — bundle of Stanley Kent"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            دليل إضافي على تعدد الأعلام «ستانلي» في المصادر العربية المتخصصة، مما يُوجب
            إيراد الاسم الكامل للتمييز في المجموعات الترادفية.

    - lemma: "فرانسيس إدغار ستانلي"
      evidence_status: "no_material_found"

    - lemma: "سْتَانْلِي"
      evidence_status: "no_material_found"

    - lemma: "فرَانْسِيس سْتَانْلِي"
      evidence_status: "no_material_found"

    - lemma: "فرَانْسِيس إدغَار سْتَانْلِي"
      evidence_status: "no_material_found"

    - lemma: "سْتَانْلِي الْمُخْتَرِع"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى الموجودة ──
    - lemma: "ستانلي"
      decision: confirmed
      decision_reason: >
        اللمّة مُستخدَمة في المصادر العربية كاسم علم (موسوعة السلطان قابوس)، وهي الصيغة
        المختصرة الشائعة للاسم Stanley. تحتاج إلى تشكيل كامل. رغم الغموض المحتمل مع
        أسماء علم أخرى (كالمستكشف هنري مورتون ستانلي)، يُميّزها السياق (hypernym: مخترع)
        ولذا تُبقى مع تصحيح التشكيل.
      evidence_assessment:
        case: mixed
      morphological_check:
        note: >
          اسم علم أعجمي معرَّب بالنقل الصوتي؛ لا جذر عربي، ولا وزن صرفي قياسي.
          التشكيل الصوتي المقترح: سْتَانْلِي (سين ساكنة + تاء مفتوحة + ألف مدية + نون ساكنة + لام مكسورة + ياء).
      nuance_differentiation: >
        الصيغة المختصرة المألوفة في الخطاب الإعلامي والموسوعي العام؛ تُستخدم حين يكون السياق
        كافياً للتمييز. تفتقر إلى الدقة المرجعية الكاملة مقارنةً بالاسم الثلاثي.
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سْتَانْلِي"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "فرانسيس إدغار ستانلي"
      decision: confirmed
      decision_reason: >
        الاسم الثلاثي الكامل هو المرجع الأدق لهذا الشخص بعينه، ويُميّزه عن كل من يحمل
        اللقب «ستانلي». لم تُعثر له على ترجمة موحّدة في المعاجم المتخصصة، لكنه التعريب
        الصوتي الصحيح لـ Francis Edgar Stanley ويتوافق مع اصطلاح الموسوعات العربية.
        يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        mwe_note: >
          تركيب إضافي من ثلاثة عناصر: الاسم الأول (فرانسيس) + الاسم الأوسط (إدغار) +
          اللقب العائلي (ستانلي). وحدة معجمية ثابتة خاصة بهذا العلم.
      nuance_differentiation: >
        الاسم الكامل الرسمي المستخدم في المصادر الأكاديمية والأرشيفية؛ يُزيل كل لبس
        مع أصحاب اللقب الآخرين، ويمثل الإحالة المرجعية الدقيقة. يُفضَّل في الاستشهاد
        العلمي والتوثيق الموسوعي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فرَانْسِيس إدغَار سْتَانْلِي"

    # ── مرشحات المرحلة ١ ──
    - lemma: "فرَانْسِيس سْتَانْلِي"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الثنائي (الأول + اللقب) متاح لكنه أقل دقة من الاسم الثلاثي الموجود بالفعل،
        ولا يضيف قيمة مرجعية جديدة للمجموعة. اللمّتان الموجودتان (المختصرة والكاملة) كافيتان.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "سْتَانْلِي الْمُخْتَرِع"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب وصفي غير مسكوك معجمياً، ولا يُعدّ اسمًا علمًا ثابتًا. إضافة «المخترع» إلى
        اسم العلم لا تمنحه وضع اللمّة المعجمية بل تُحوّله إلى وصف حر يفشل اختبار السكّ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


