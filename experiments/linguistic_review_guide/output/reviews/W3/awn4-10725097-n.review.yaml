# ── المرحلة ١: المراجعة والتوليد (التوليد الأعمى) ───────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'منتج مسرحي' تفتقر إلى التشكيل الكامل"
      - "المجموعة تضم لمّة واحدة فقط، مما يُضيِّق نطاق التغطية المعجمية للمفهوم"
      - "التعريف العربي 'شخص ينتج عروضاً مسرحية' دائري اشتقاقياً إذ يتضمن 'ينتج' المشتقة من الجذر ذاته للمّة 'منتج'"
    observations: >-
      المجموعة تُعرِّف مفهوم 'المنتج المسرحي'، وهو دور محوري في صناعة المسرح؛ يقوم على ثلاثة محاور: التمويل، والإشراف الإداري، وتقديم العرض للجمهور.
      اللمّة الموجودة مركّبة وصفية (موصوف + صفة: منتج + مسرحي) وتتبع النمط العربي المعاصر في تسمية الأدوار المهنية المتخصصة.
      يقع المفهوم بين المجموعة الأم (منتج / منتج فني) والتخصصات المقابلة (سينمائي، تلفزيوني). يُلاحَظ وجود مقابلات عربية موازية
      كـ'مدير الفرقة' (impresario) والراعي، مما يستوجب الفحص والتمييز الدلالي الدقيق.

  blind_candidates:
    - lemma: "مُنْتِج مَسْرَحِيّ"
      generation_method: tarkib
      justification: >-
        تركيب وصفي من 'مُنْتِج' (اسم فاعل من أنتج على وزن مُفْعِل) منسوباً إلى 'مَسْرَحِيّ'
        (نسبة إلى المسرح). يتبع النمط القياسي في عربية المصطلحات المعاصرة لتخصيص الأدوار
        المهنية الإنتاجية (قِس: كاتب مسرحي، مخرج مسرحي، ممثل مسرحي).
    - lemma: "مُدِيرُ الْفِرْقَة"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من 'مُدِير' (اسم فاعل من أدار) مضافاً إلى 'الفِرْقَة' (الجماعة الفنية المسرحية).
        يُعبِّر عن من يدير شؤون الفرقة المسرحية ويُشرف على عروضها وجولاتها، وهو مقابل عربي
        تقليدي يستحق المقارنة مع المنتج المسرحي.
    - lemma: "رَاعِي الْمَسْرَح"
      generation_method: majaz
      justification: >-
        مجاز من 'رَعَى' بمعنى أشرف وتكفَّل ورقب (مقاييس اللغة: الراء والعين والحرف المعتل —
        أصلان: المراقبة والحفظ). يُحيي المعنى التراثي للرعاية بوصفها إشرافاً وكفالةً، مما يُناسب
        دور المنتج المتكفِّل بالعمل المسرحي تمويلاً وإشرافاً.
    - lemma: "مُمَوِّلُ الْعُرُوض"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من 'مُمَوِّل' (اسم فاعل من موّل، باب التفعيل) مضافاً إلى 'العُرُوض'
        (جمع عرض). يُبرز الجانب التمويلي الذي يُشكِّل جوهر مهمة المنتج وفق التعريف
        (يجد التمويل ويُشرف)، لكنه يخص التمويل دون سائر المهام.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية لجميع اللمّات والمرشحات (headword_norm IN ...)
#   Q2 — جسر إنجليزي: theatrical producer / impresario / showman / stage producer
#   Q3 — FTS عربي: مسرحي + منتج + عروض مسرحية
#   Q4 — تحقق المرشحين: منتج مسرحي / مدير الفرقة / منتج أفلام ...
#   Q5 — مقاييس اللغة: جذور نتج / سرح / رعي
stage2_evidence:
  per_lemma:

    - lemma: "منتج مسرحي"
      confirm:
        - text: "«منتِج أفلام» — translation_en: film producer"
          source: "مسرد الفن والتسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم — أرابترم (entry 484312)"
        - text: "«منتِج» — translation_en: producer"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)، أرابترم (entry 409122)"
        - text: "«مُنْتِج» — translation_en: producer"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)، أرابترم (entry 465104)"
      contradicts:
        - text: "«(الْمُنْتِج) وَقت الإنتاج (ج) مناتج»"
          source: "المعجم الوسيط، هوراماني (entry 884635)"
          conflict: "المُنْتِج في المعجمية الكلاسيكية يدل على وقت النتاج (موسم الولادة عند الحيوانات)، لا على الشخص المُنتِج، مما يُظهر انزياحاً دلالياً حديثاً"
        - text: "«الْمُنْتِجُ وقت الإنتاج»"
          source: "المعجم الوسيط، OCR (entry 28452)"
          conflict: "يؤكد المعنى الكلاسيكي ذاته — المُنتِج كظرف زماني لا فاعل إنساني"
      expands:
        - text: "«(1) مدير الفرقة (مو) (2) الراعي: مَنْ يَرْعَى حفلة أو برنامجًا تلفزيونيًا (3) المدير أو المنتج.»"
          source: "المورد الحديث (2008) — مدخل: impresario (entry 694413)"
          addition: "يكشف أن المعجم المعاصر يُدرج 'المنتج' ضمن مقابلات impresario، مما يؤكد رسوخ الكلمة في الدلالة المهنية الحديثة للمنتج الفني"

    - lemma: "مُدِيرُ الْفِرْقَة"
      confirm:
        - text: "«(1) مدير الفرقة (مو) (2) الراعي: مَنْ يَرْعَى حفلة أو برنامجًا تلفزيونيًا (3) المدير أو المنتج.»"
          source: "المورد الحديث (2008) — مدخل: impresario (entry 694413)"

    - lemma: "رَاعِي الْمَسْرَح"
      expands:
        - text: "«الراعي: مَنْ يَرْعَى حفلة أو برنامجًا تلفزيونيًا»"
          source: "المورد الحديث (2008) — مدخل: impresario (entry 694413)"
          addition: "يُثبِّت 'الراعي' في سياق الإشراف على الحفل والبرنامج، غير أنه يميل نحو معنى الكفيل/الممول لا المنتج الفني المسؤول عن الإشراف الشامل"
      contradicts:
        - text: "«(رَعَى) الرَّاءُ وَالْعَيْنُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ: أَحَدُهُمَا الْمُرَاقَبَةُ وَالْحِفْظُ، وَالْآخَرُ الرُّجُوعُ. فَالْأَوَّلُ رَعَيْتُ الشَّيْءَ، رَقَبْتُهُ; وَرَعَيْتُهُ، إِذَا لَاحَظْتَهُ. وَالرَّاعِي: الْوَالِي.»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151) — مدخل: رعى"
          conflict: "الأصل اللغوي للراعي يدل على المراقبة والحفظ والولاية، وهو أعم من دور المنتج المسرحي ولا يُثبِّت الاستخدام التقني التخصصي"

    - lemma: "مُمَوِّلُ الْعُرُوض"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "منتج مسرحي"
      decision: confirmed
      decision_reason: >-
        اللمّة مُثبَّتة في المعجمية العربية المعاصرة: توجد صيغة الإضافة الوصفية الموازية
        'منتج أفلام' (film producer) في أرابترم مما يُؤكد النمط الإنتاجي للتركيب (منتج + نوع الإنتاج).
        كما يُقرّ المورد الحديث 'المنتج' مقابلاً لـimpresario. الأدلة الكلاسيكية
        المتعارضة (المُنتِج = وقت النتاج) لا تُضعف اللمّةَ لأنها تعكس انزياحاً دلالياً
        مكتمل الاستقرار في عربية القرن العشرين. التشكيل مفقود ويجب إضافته.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        اللمّة الوحيدة في المجموعة؛ تختص بالإنتاج المسرحي تحديداً دون الإنتاج السينمائي
        (منتج سينمائي) أو التلفزيوني (منتج تلفزيوني). تتمايز عن المخرج المسرحي بأنها تُعنى
        بالتمويل والإشراف الإداري الشامل لا بالتوجيه الفني والإخراجي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْتِج مَسْرَحِيّ"

    - lemma: "مُدِيرُ الْفِرْقَة"
      source: stage1
      decision: removed
      decision_reason: >-
        'مدير الفرقة' هو المقابل المعجمي المُثبَّت لـimpresario (المورد الحديث 2008)، وهو مفهوم
        مجاور لكنه مختلف دلالياً: يُركِّز على إدارة أعضاء الفرقة الفنية وتنظيم جولاتهم الفنية،
        بينما المنتج المسرحي يتولى الإنتاج بأكمله من التمويل إلى العرض. إدراجه في هذه المجموعة
        يُربِك الحدود الدلالية بين awn4-10725097-n وسياق مفهوم impresario المستقل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "رَاعِي الْمَسْرَح"
      source: stage1
      decision: removed
      decision_reason: >-
        'الراعي' في الاستعمال العربي المعاصر يدل على المموّل/الكفيل/الراعي الرسمي (sponsor)
        لا على المنتج الفني المسؤول عن الإشراف الشامل والتنفيذ. الأدلة تُثبِّت المعنى العام
        (من يرعى حفلة) لا المعنى التخصصي للمنتج المسرحي. كذلك لم يُوجَد التركيب 'راعي المسرح'
        بوصفه وحدة معجمية مُثبَّتة، فيخضع لاختبار الاستبدال ويفشل فيه (يمكن تعويض 'راعي'
        بـ'مموّل' مع بقاء الوصف صالحاً → ليس مصطلحاً ثابتاً).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُمَوِّلُ الْعُرُوض"
      source: stage1
      decision: removed
      decision_reason: >-
        لا توجد أدلة معجمية تُثبِّت هذا التركيب. فضلاً عن ذلك، 'المُمَوِّل' يُعبِّر عن
        الجانب التمويلي فحسب، بينما المنتج المسرحي يُشرف على العمل في مجمله (تمويل + إدارة
        + تنفيذ + تقديم). المصطلح ناقص دلالياً ولا يستوعب الدلالة الكاملة للمجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


