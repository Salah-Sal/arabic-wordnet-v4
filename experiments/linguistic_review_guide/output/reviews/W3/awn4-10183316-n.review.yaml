# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "الفنان المتصدر — عبارة وصفية حرة لا تجتاز اختبار السكّ المعجمي: يمكن إبدال 'الفنان' بـ'الممثل' أو 'المغني' دون أن تفقد الصياغةُ صلاحيتَها كوصف، مما يدل على أنها ليست مصطلحًا مسكوكًا ثابتًا"
      - "كلا اللمّتين خاليتان من التشكيل الكامل"
      - "نجم الحفل — مركَّب إضافي ملائم لكنه مُقيَّد بحفل بعينه، في حين أن المفهوم يشمل الصدارة الإعلانية عمومًا"
      - "التعريف يستخدم صيغة المجهول 'يوضع' دون مرجع صريح، و'الأبرز' تحتاج إلى مرجع مقارَن"
    observations: >
      المفهوم يدور حول مفهوم 'الصدارة الإعلانية' للفنان — أي الفنان الذي يُمنح أعلى مرتبة في قوائم العرض
      والمواد الدعائية لكونه الاسمَ الأكثر جذبًا للجمهور. هذا المفهوم معروف في العربية المعاصرة، وللمفردة
      العربية 'النجم' جذرٌ راسخ في الدلالة على الظهور والبروز (من نَجَمَ = طلع وظهر)، مما يجعلها مرشحةً
      طبيعيةً. اللمّة الثانية 'نجم الحفل' تُضيِّق الدلالة بربطها بحفلة واحدة بعينها.
  blind_candidates:
    - lemma: "مُتَصَدِّر"
      generation_method: majaz
      justification: >
        مصدره صَدَرَ (Form V: تَصَدَّرَ = تقدَّم وتربَّع على الصدارة). المُتَصَدِّر مستخدَم في العربية
        المعاصرة للدلالة على صاحب المرتبة الأولى (في الدوري، في القائمة)؛ والتوسُّع المجازي إلى الفنان
        المتصدِّر للإعلانات قريب ومنطقي. الوزن مُتَفَعِّل يُفيد الاستمرار والتمكُّن.
    - lemma: "نَجْمُ الصَّدارَة"
      generation_method: tarkib
      justification: >
        مركَّب إضافي من نَجْم (نجم الفن/المسرح) + الصَّدارة (التقدُّم والأوَّلية). يُركِّز على الجانب
        الإعلاني (صدارة القوائم) بدلًا من ربط المفهوم بحفلة واحدة، مما يجعله أشمل. يُوازي
        التعبير الإنجليزي 'top-billed star'.
    - lemma: "عَنْوَانُ الحَفْل"
      generation_method: tarkib
      justification: >
        مركَّب إضافي موازٍ أصلًا لـ'headliner' اشتقاقًا (headline → عنوان). يُفيد أن الفنانَ هو
        'عنوان' العرض أي محوره الرئيسي الذي يُعرَّف به، كما يُعرَّف المقال بعنوانه. يَصُبُّ المعنى
        في وصف الفنان بوصفه الاسمَ الطاغيَ على ترويج الحفل.
    - lemma: "النَّجْم"
      generation_method: majaz
      justification: >
        إحياء دلاليٌّ للفظ التراثي 'النجم' (من نَجَمَ = طلع وظهر وبرز) وتوظيفه في سياق فنون الأداء.
        النجم في أصله يدل على الطلوع والظهور البارز، وهو بالضبط ما يُميِّز فنان الصدارة عن غيره.
        الوزن فَعْل يوحي بالفردية والتميُّز. الاستعمال المعاصر لـ'النجم' بمعنى 'star' راسخٌ في
        العربية الإعلامية والأدبية الحديثة.


# ── المرحلة ٢: جمع الأدلة ───────────────────────────────────
# استعلام ١ (مطابقة دفعية): نجم / النجم / نجم الحفل / متصدر / المتصدر / صدارة
# استعلام ٢ (جسر إنجليزي): headliner / star / top billing / headline act
# استعلام ٣ (مقاييس اللغة): صدر / نجم / حفل
# إجمالي الاستعلامات المُنفَّذة: 4
stage2_evidence:
  per_lemma:

    - lemma: "نجم الحفل"
      confirm:
        - text: >
            «النَّجم: ممثِّل لامع يُبرَز اسمُهُ في الإعلانات.»
          source: "المورد الحديث (2008) — المدخل: النجم، translation_en: headliner"
        - text: >
            «نَجْم: شخصيَّة فنيَّة مرموقة»
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم، translation_en: star"
      expands:
        - text: >
            «top billing: (1) المركز الأول [في قائمة أسماء ممثلي فيلم إلخ] Samira got top billing.
            (2) توجيه؛ تظهير Few of these events have received top billing in the French press.»
          source: "المورد الحديث (2008) — المدخل: top billing"
          addition: >
            يُثبِّت المعجمُ أن 'top billing' = 'المركز الأول في قائمة الممثلين'؛ وهذا هو الجوهر
            الدلالي للمفهوم الذي تتناوله المجموعة الترادفية.
        - text: >
            «(6) يُقدِّم [ممثِّلًا] بوصفه نجمَ الفيلم أو بطله إلخ. (7) يُمثِّل دورَ البطولة [في فيلم إلخ].
            (10) لامع؛ متألِّق؛ ممتاز a star diplomat.»
          source: "المورد الحديث (2008) — المدخل: star"
          addition: >
            يُثبِّت الفعل 'starred' وصيغاته أن 'نجم' فعلٌ مُشتقٌّ يُستخدم لوصف الفنان الذي يتصدَّر
            العرض، مما يُرسِّخ دلالة 'نجم الحفل' كعبارة اصطلاحية.

    - lemma: "الفنان المتصدر"
      expands:
        - text: >
            «الصُّدارة: التَّقَدُّمُ. يقالُ: فلانٌ لهُ الصُّدارةُ فى القوم.»
          source: "المعجم الكبير — مجمع اللغة العربية"
          addition: >
            يُثبِّت أن 'الصدارة' تعني التقدُّم والأوَّلية، وهو مكوِّن دلاليٌّ صحيح في التعبير؛
            غير أن المركَّب 'الفنان المتصدر' لم يُثبَّت معجميًا كوحدة اصطلاحية واحدة.
        - text: >
            «(5) صَدارة؛ مركز تفوُّق أو زعامة.»
          source: "المورد الحديث (2008) — المدخل: front"
          addition: >
            يُؤكِّد أن 'الصدارة' مرادفة لـ'front' بمعنى التقدُّم والزعامة، وهو ملائم للمفهوم.

    - lemma: "مُتَصَدِّر"
      evidence_status: "no_material_found"

    - lemma: "نَجْمُ الصَّدارَة"
      evidence_status: "no_material_found"

    - lemma: "عَنْوَانُ الحَفْل"
      evidence_status: "no_material_found"

    - lemma: "النَّجْم"
      confirm:
        - text: >
            «النَّجم: ممثِّل لامع يُبرَز اسمُهُ في الإعلانات.»
          source: "المورد الحديث (2008) — المدخل: النجم، translation_en: headliner"
        - text: >
            «نَجْم: شخصيَّة فنيَّة مرموقة»
          source: "مسرد الإعلام والتواصل (موقع ArabTerm) — translation_en: star"
      expands:
        - text: >
            «النُّونُ وَالْجِيمُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى طُلُوعٍ وَظُهُورٍ. وَنَجَمَ النَّجْمُ:
            طَلَعَ. وَلَيْسَ لِهَذَا الْحَدِيثِ نَجْمٌ، أَيْ أَصْلٌ وَمَطْلِعٌ.»
          source: "مقاييس اللغة لابن فارس — الجذر: نجم"
          addition: >
            الجذر 'نجم' يدل أصلًا على الطلوع والظهور؛ وهذا هو عين ما يُميِّز فنانَ الصدارة:
            الظهور والبروز على سائر المؤدِّين، مما يُضفي على الاستعمال المجازي عمقًا تأصيليًا.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى (موجودة) ──────────────────────────────
    - lemma: "نجم الحفل"
      decision: confirmed
      decision_reason: >
        مركَّب إضافي مُثبَّت دلاليًا بأدلة معجمية مباشرة: المورد الحديث يُعرِّف 'النجم' صراحةً بأنه
        'ممثّل لامع يُبرَز اسمُهُ في الإعلانات' (translation_en: headliner)، وهو تعريف يكاد يُطابق
        تعريف المجموعة الترادفية. إضافة 'الحفل' تُضيِّق الدلالة إلى سياق عرض محدد وهو إثراء لا
        إخلال. التعبير مستخدَم في الإعلام العربي المعاصر كوحدة اصطلاحية. يحتاج التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        مُقيَّد بالسياق التطبيقي لحفلة واحدة أو عرض بعينه؛ يُشير إلى الفنان الذي يُمثِّل الاسمَ
        الرئيسيَّ في ذلك الحدث تحديدًا، بخلاف 'النجم' المُطلَق الذي يُعبِّر عن النجومية العامة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَجْمُ الحَفْل"

    # ── اللمّة الثانية (موجودة) ──────────────────────────────
    - lemma: "الفنان المتصدر"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا تجتاز اختبار السكّ المعجمي: يمكن إبدال 'الفنان' بـ'الممثل' أو 'المطرب'
        أو 'الراقص' دون أن تفقد الصياغةُ صلاحيتها التوصيفية، مما يدل على أنها ليست وحدة اصطلاحية
        ثابتة. علاوةً على ذلك، يُغفل المركَّبُ الجانبَ الإعلاني (صدارة الإعلانات) الذي هو جوهر
        المفهوم، فيبدو مرادفًا لـ'الفنان الأول' العام. لا توجد أدلة على تثبيته معجميًا كوحدة واحدة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────
    - lemma: "مُتَصَدِّر"
      source: stage1
      decision: removed
      decision_reason: >
        لفظ عام متعدِّد السياقات (رياضة، سياسة، أعمال) لا يحمل دلالة تأدائية أو فنية بذاته؛
        'المتصدِّر' وحدَه لا يوحي بأنه فنان. كما أن المعنى يرتبط بالترتيب الآني لا بالمنح
        الإعلاني الدلالي الذي هو جوهر المفهوم. لا مادة معجمية تدعم هذا الاستخدام.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "نَجْمُ الصَّدارَة"
      source: stage1
      decision: removed
      decision_reason: >
        مركَّب غير مُثبَّت معجميًا كوحدة اصطلاحية؛ والمفهوم المُراد تغطيته موجود بصورة أفضل
        في 'نجم الحفل' (أكثر انتشارًا وأقرب إلى الاستعمال الفعلي). التكرار الدلالي ('نجم' +
        'الصدارة') يُثقِّل التعبير دون مكسب دلالي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "عَنْوَانُ الحَفْل"
      source: stage1
      decision: removed
      decision_reason: >
        يُوقع في لبس دلالي: 'عنوان الحفل' سيُفهم أولًا وبداهةً على أنه اسم الحفلة وموضوعها
        لا الفنان المتصدِّر فيها. الموازاة الاشتقاقية مع 'headliner' (headline → عنوان) ذكيةٌ
        نظريًا لكنها تتعارض مع الاستعمال العربي الطبيعي لكلمة 'عنوان'.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── لمّة مُكتشَفة بالأدلة (المرحلة ٢) ───────────────────
    - lemma: "النَّجْم"
      source: stage1
      decision: confirmed
      decision_reason: >
        الأدلة المعجمية قاطعة: المورد الحديث (2008) يُترجم 'headliner' مباشرةً بـ'النجم' ويُعرِّفه
        بـ'ممثّل لامع يُبرَز اسمُهُ في الإعلانات' — وهو تعريف يُطابق تعريف المجموعة الترادفية
        تقريبًا. ابن فارس يُرجع الجذر 'نجم' إلى الطلوع والظهور، وهو المعنى الكامن في دلالة
        النجومية الفنية. اللفظ مُفرَد سهل التداول، ذو اشتقاقية واسعة (نجومية، تنجيم، ينجم، نجّم).
        يُكمِّل 'نجم الحفل' بتغطية الدلالة العامة للنجومية غير المُقيَّدة بحفل واحد، وهو ما يُقابل
        المرادف الإنجليزي 'star' في قائمة OEWN.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        لفظ مُطلَق يُعبِّر عن النجومية الفنية العامة بصرف النظر عن الحدث؛ يُقابل الإنجليزية 'star'
        بمعنى celebrity-headliner، في حين يُقابل 'نجم الحفل' مفهوم 'headliner' المُقيَّد بعرض بعينه.
      actions:
        - command: create_entry
          params:
            lemma: "النَّجْم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "فنان يوضع اسمه في صدارة الإعلانات لكونه الأبرز"
    assessment:
      decision: revise
      reason: >
        التعريف صحيح في جوهره لكنه يحتاج إلى تحسينات ثلاثة: (١) صيغة 'يُوضع' (مجهول الفاعل)
        غامضة الفاعلية — لم يُحدَّد مَن الذي يضع الاسم؛ (٢) 'الأبرز' بلا مرجع مقارَن صريح،
        يكفي 'بين المؤدِّين' أو 'على سائر الفنانين'؛ (٣) الأسلوب ترجمي قريب من الإنجليزية،
        يُفضَّل صياغة بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: >
          فنانٌ بارزٌ يُمنح صدارةَ الإعلانات ولوائحِ أسماء المؤدِّين في عرضٍ ما، لكونه الاسمَ
          الرئيسيَّ الجاذبَ للجمهور والمُحرِّكَ لشبابيك التذاكر.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          فنانٌ أو مؤدٍّ يُكلَّف بالدور الأبرز في حفل أو عرض مسرحي أو موسيقي؛ يتصدَّر اسمُه
          المواد الإعلانية ويُعلَن في مقدِّمة قوائم الفنانين المشاركين، ويُعدُّ الاسمَ الأكثر
          إقبالًا من قِبَل الجمهور. من أمثلته: نجوم الحفلات الغنائية الكبرى ومهرجانات الموسيقى.
