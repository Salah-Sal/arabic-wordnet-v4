# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
stage5_enrichment:
  per_entry:
    - lemma: "نَجْمُ الحَفْل"
      entry_id: "{auto}"
      roots:
        - word: "نجم"
