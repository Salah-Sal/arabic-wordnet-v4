# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14442374-n
# federalization / federalisation
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «فدرلة» بدون تشكيل"
      - "اللمّة تعريب محض على وزن فَعْلَلَة ولا يوجد بديل عربي صرف"
      - "المجموعة تحتوي لمّة واحدة فقط مما يُضعف التغطية المعجمية"
    observations: >
      المفهوم يتعلق بعملية إخضاع كيان سياسي للنظام الاتحادي (الفيدرالي)، وهو مفهوم
      سياسي حديث مُقترض من التجربة الغربية. التعريف الحالي «حالة الخضوع للسيطرة الفيدرالية»
      مقبول لكنّه يستعمل لفظ «الفيدرالية» المعرَّب في التعريف نفسه. المرادف المتاح هو «اتحادية»
      لكنّه يدل على المذهب (federalism) لا على عملية التحويل (federalization). الجنس
      القريب هو «حالة الاندماج في جسم واحد» (awn4-14442066-n) وهو مناسب.
  blind_candidates:
    - lemma: "اتِّحَادِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من «اتحاد» (جذر و-ح-د)، يُستعمل في الخطاب السياسي العربي
        للدلالة على النظام الاتحادي. قد يُمدّ دلالياً ليشمل عملية الأَتْحَدة.
    - lemma: "تَفَدْرُل"
      generation_method: taarib
      justification: >
        تعريب على وزن تَفَعْلُل (قياساً على تَأَسْلُم وتَأَمْرُك)، يدل على
        عملية التحوّل إلى النظام الفيدرالي.
    - lemma: "فِدْرَالِيَّة"
      generation_method: taarib
      justification: >
        تعريب شائع لـ federalism/federality بإضافة ياء النسبة وتاء المصدر الصناعي،
        مُثبَت في معاجم حديثة عديدة.
    - lemma: "فَدْرَلَة"
      generation_method: taarib
      justification: >
        تعريب على وزن فَعْلَلَة (قياساً على عَوْلَمَة وأَمْرَكَة)، يدل تحديداً
        على عملية التحويل إلى النظام الفيدرالي لا على المذهب نفسه.


stage2_evidence:
  per_lemma:
    - lemma: "فَدْرَلَة"
      evidence_status: "no_material_found"

    - lemma: "اتِّحَادِيَّة"
      confirm:
        - text: "«اتحادية» = federalism"
          source: "مسرد الجغرافيا والتاريخ (ALECSO/ArabTerm)"
        - text: "«نظام فدراليّ، اتحادية» = federalism"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      contradicts:
        - text: "«اتحادية» تقابل federalism (المذهب/النظام) لا federalization (عملية التحويل)"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          conflict: "الدلالة على المذهب لا على عملية التحويل"

    - lemma: "تَفَدْرُل"
      evidence_status: "no_material_found"

    - lemma: "فِدْرَالِيَّة"
      confirm:
        - text: "«فِدراليَّة [مفرد]: (سة) مجموعة من الدول أو الولايات تتمحور حول سلطة مركزية تدير الشئون الدفاعيّة والدبلوماسيّة، والنقديّة، أما الدول أو الولايات التابعة فتهتمّ بالشئون الاجتماعيّة والتربية والأمن.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«فيدراليَّة [مفرد]: خاص باتحاد ولايات تعترف بسيادة سلطة مركزيّة وتحتفظ ببعض القوى الحكوميّة الباقية. • مذهب الفيدراليَّة: (سة) نظام سياسيّ يعترف بوجود حكومة مركزيّة للدولة كلّها إلى جانب حكومات إقليميّة أخرى ذات استقلال سياسيّ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«فيدرالية» = federalism"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      contradicts:
        - text: "جميع المصادر تُقابل فِدْرَالِيَّة بـ federalism (المذهب/النظام) لا federalization (عملية الإخضاع)"
          source: "معجم اللغة العربية المعاصرة + AGROVOC"
          conflict: "فِدْرَالِيَّة = federalism ≠ federalization"

    - lemma: "فَدْرَلَة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "فَدْرَلَة"
      decision: confirmed
      decision_reason: >
        اللمّة الموجودة «فدرلة» تعريب صحيح على وزن فَعْلَلَة الذي يدل على عملية التحويل
        (قياساً على عَوْلَمَة، أَمْرَكَة، خَصْخَصَة). هذا الوزن يميّزها دلالياً عن «فِدْرَالِيَّة»
        (= المذهب/النظام) و«اتحادية» (= النظام الاتحادي). رغم عدم ورودها في المعاجم المتاحة،
        فإنّ القياس الصرفي سليم والمصطلح متداول في الإعلام والكتابات السياسية العربية المعاصرة.
        تحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: taarib
        status: acceptable
        note: "تعريب مقبول على وزن فَعْلَلَة، يقبل لام التعريف والنسبة والجمع"
      morphological_fit:
        pattern: "فَعْلَلَة"
        suitable: true
        note: "وزن فَعْلَلَة منتج للدلالة على عملية التحويل (عَوْلَمَة، أَمْرَكَة، حَوْسَبَة)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَدْرَلَة"

    - lemma: "اتِّحَادِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «اتِّحَادِيَّة» تقابل في المعاجم العربية مصطلح federalism (المذهب/النظام الاتحادي)
        وليس federalization (عملية الإخضاع للنظام الاتحادي). الفرق الدلالي جوهري:
        الأولى حالة قائمة (نظام)، والثانية عملية تحويل إلى تلك الحالة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَفَدْرُل"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر على أي شاهد معجمي لهذه الصيغة. وزن تَفَعْلُل وإن كان قياسياً في التعريب
        (تَأَسْلُم، تَأَمْرُك) إلا أنّ الصيغة غير متداولة ولا مُثبتة، وفَعْلَلَة (فَدْرَلَة)
        أكثر شيوعاً وتداولاً في هذا السياق.
      evidence_assessment:
        case: no_material

    - lemma: "فِدْرَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        «فِدْرَالِيَّة» مُثبتة في عدة معاجم لكنّها تقابل federalism (المذهب/النظام)
        وليس federalization (حالة الإخضاع). المعاجم تُعرّفها بأنها «مجموعة من الدول
        تتمحور حول سلطة مركزية» أو «نظام سياسي يعترف بحكومة مركزية وحكومات إقليمية»،
        وهذا يختلف عن مفهوم المجموعة الترادفية الحالية.
      evidence_assessment:
        case: mixed

    - lemma: "فَدْرَلَة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشّح مطابق للّمّة الموجودة أصلاً في المجموعة، فلا حاجة لإضافته مجدداً.
      evidence_assessment:
        case: no_material


