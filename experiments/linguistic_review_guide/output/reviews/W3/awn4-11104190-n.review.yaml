# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11104190-n  |  ILI: i95715  |  POS: n
# الموضوع: ويليام ستانلي جيفونز — William Stanley Jevons
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'ويليام ستانلي جيفونز' تفتقر إلى التشكيل الكامل"
      - "غياب لمّة مختصرة 'جيفونز' رغم شيوع استخدامها في الأدبيات الاقتصادية والفلسفية العربية"
      - "المجموعة تقتصر على لمّة واحدة لشخصية أكاديمية بارزة ذات إسهام اقتصادي ومنطقي واسع"
      - "التعريف العربي الحالي يفتقر إلى التشكيل ولا يتبع أسلوب التعريف الموسوعي الملائم لأسماء الأعلام"
    observations: >
      المجموعة تصف عَلَمًا تاريخيًا بعينه يرتبط اسمه بتطوير نظرية المنفعة الحدية في الاقتصاد، وبإسهامات في المنطق الرياضي في القرن التاسع عشر.
      لا يُتصوَّر لمثل هذه المجموعات مصطلحات مُشتقَّة أو مجازية إذ تختص بالأعلام التاريخية،
      وتنحصر الخيارات في صيغ التهجئة العربية الممكنة للاسم الأجنبي (تعريب). تشير الأدبيات الاقتصادية العربية
      إلى هذه الشخصية باسميها: الاسم الكامل في السياقات الرسمية والتاريخية، والكنية وحدها ('جيفونز')
      في الدراسات التخصصية كما يتجلى في مصطلح 'مفارقة جيفونز' المتداول.
  blind_candidates:
    - lemma: "وِيلْيَام سْتَانِلِي جِيفُونْز"
      generation_method: taarib
      justification: "تعريب للاسم الكامل للشخصية (الاسم الأول + الاسم الأوسط + الكنية)، وهو الصيغة الرسمية المعتمدة في المراجع الأكاديمية والموسوعات العربية."
    - lemma: "جِيفُونْز"
      generation_method: taarib
      justification: "تعريب للكنية (الاسم العائلي) وحدها، وهي الأشيع في الأدبيات الاقتصادية عند الإشارة إلى هذه الشخصية أو الأفكار المرتبطة بها كمفارقة جيفونز."
    - lemma: "وِيلْيَام جِيفُونْز"
      generation_method: taarib
      justification: "تعريب للاسم الأول مع الكنية مع حذف الاسم الأوسط 'ستانلي'، صيغة مختصرة قد تستخدمها بعض الترجمات العربية."
    - lemma: "جِيفُونِز"
      generation_method: taarib
      justification: "صيغة تهجئة بديلة للكنية تضبط النون بالكسر بدلاً من الضم، قد ترد في بعض الترجمات العربية غير المعيارية."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١. مطابقة دفعية لجميع اللمّات (headword_norm) — نتيجة فارغة للاسم الكامل
# ٢. جسر إنجليزي: "Jevons" + "William Stanley Jevons" + "marginal utility" — وجد "مفارقة جيفونز"
# ٣. FTS عربي: "جيفونز" + "ستانلي" — أكّد مفارقة جيفونز + "منفعة حدية"
stage2_evidence:
  per_lemma:
    - lemma: "وِيلْيَام سْتَانِلِي جِيفُونْز"
      evidence_status: "no_material_found"

    - lemma: "جِيفُونْز"
      confirm:
        - text: "«مفارقة جيفونز» — headword مع ترجمة: Jevons paradox"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — arabterm"

    - lemma: "وِيلْيَام جِيفُونْز"
      evidence_status: "no_material_found"

    - lemma: "جِيفُونِز"
      evidence_status: "no_material_found"

  # ملاحظة: المصطلح الاقتصادي المذكور في تعريف المجموعة موثّق في قاعدة البيانات:
  # - "منفعة حدية" (entry_ids: 401802, 407749) — المعجم الموحد لمصطلحات الاقتصاد
  # - "تناقص المنفعة الحدية" (entry_id: 360408) — مسرد المناخ والبيئة
  # يؤكد صحة المصطلح الاقتصادي الوارد في التعريف.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "ويليام ستانلي جيفونز"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخصية التاريخية وهو الصيغة الرسمية الأنسب لقواعد AWN4. رغم انعدام الأدلة المعجمية المستقلة لهذه الصيغة
        (إذ نادراً ما تُدرج المعاجم العربية أسماء الأعلام الأجنبية)، إلا أن الصيغة مقبولة اصطلاحاً.
        يستوجب تحديث التشكيل إلى الشكل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
      nuance_differentiation: "الاسم الرسمي الكامل للشخصية (الاسم الثلاثي)، يُستخدم في السياقات الأكاديمية الرسمية والمراجع الموسوعية والتاريخية حين يُراد التحديد الدقيق."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيلْيَام سْتَانِلِي جِيفُونْز"

    - lemma: "جِيفُونْز"
      source: stage1
      decision: confirmed
      decision_reason: >
        الكنية المختصرة موثّقة في قاعدة البيانات المعجمية العربية ضمن مصطلح 'مفارقة جيفونز'
        في المَكنَز الزراعي متعدد اللغات، مما يُثبت أن هذه التهجئة هي الصيغة المعتمدة عربياً.
        يُسر التداول في الأدبيات العلمية يقتضي وجود الكنية المختصرة كلمّة مستقلة.
        تجتاز اختبار السكّ: لا يمكن إبدال 'جيفونز' بمرادف آخر في السياق إذ هي علم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الكنية المختصرة (الاسم العائلي)، الأكثر تداولاً في الأدبيات التخصصية الاقتصادية والفلسفية، تُستخدم في الإحالة إلى أعمال الشخصية أو المفاهيم المنسوبة إليها."
      actions:
        - command: create_entry
          params: {lemma: "جِيفُونْز", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "وِيلْيَام جِيفُونْز"
      source: stage1
      decision: removed
      decision_reason: "صيغة غير موثّقة في أي مرجع معجمي عربي، ولا تُضيف قيمة فوق اللمّتين المؤكدتين (الاسم الكامل والكنية المستقلة). حذف الاسم الأوسط 'ستانلي' دون مسوّغ."

    - lemma: "جِيفُونِز"
      source: stage1
      decision: removed
      decision_reason: "صيغة تهجئة غير معيارية وغير موثّقة في المراجع العربية؛ الضبط بالضم في 'جِيفُونْز' هو الأشيع والموثّق، واجتماع صيغتين متشابهتين يُشكل اشتراكاً لفظياً مُضلِّلاً."


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
stage4_content:
  definition:
    current: "اقتصادي ومنطقي إنجليزي ساهم في تطوير نظرية المنفعة الحدية (1835-1882)"
    assessment:
      decision: revise
      reason: >
        التعريف صحيح من حيث المضمون لكنه يفتقر إلى: (١) التشكيل الكامل، (٢) الصياغة الموسوعية
        الملائمة لأسماء الأعلام التاريخية التي تقتضي ذكر الحقبة الزمنية وتأطير الإسهام بوضوح أكبر.
    authored:
      - type: encyclopedic
        text: "اقْتِصَادِيٌّ وَمَنْطِقِيٌّ إِنْجِلِيزِيٌّ (1835-1882)، أَسْهَمَ فِي تَطْوِيرِ نَظَرِيَّةِ المَنْفَعَةِ الحَدِيَّةِ، وَيُعَدُّ مِنْ رُوَّادِ مَدْرَسَةِ الاقْتِصَادِ الحَدِّيِّ (النِّيُوكْلَاسِيكِيِّ) فِي القَرْنِ التَّاسِعِ عَشَرَ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "اقْتِصَادِيٌّ وَمَنْطِقِيٌّ إِنْجِلِيزِيٌّ (1835-1882)، أَسْهَمَ فِي تَطْوِيرِ نَظَرِيَّةِ المَنْفَعَةِ الحَدِيَّةِ، وَيُعَدُّ مِنْ رُوَّادِ مَدْرَسَةِ الاقْتِصَادِ الحَدِّيِّ فِي القَرْنِ التَّاسِعِ عَشَرَ."

  examples:
    per_lemma:
      - lemma: "وِيلْيَام سْتَانِلِي جِيفُونْز"
        examples:
          - text: "أَرْسَى وِيلْيَام سْتَانِلِي جِيفُونْز أُسُسَ نَظَرِيَّةِ المَنْفَعَةِ الحَدِيَّةِ، وَأَثَّرَ تَأْثِيرًا عَمِيقًا فِي مَسَارِ الفِكْرِ الاقْتِصَادِيِّ الحَدِيثِ."
            type: usage
      - lemma: "جِيفُونْز"
        examples:
          - text: "يَتَنَاوَلُ الاقْتِصَادِيُّونَ مَفَارَقَةَ جِيفُونْز لِفَهْمِ أَثَرِ الكَفَاءَةِ التِّقَنِيَّةِ فِي زِيَادَةِ اسْتِهْلَاكِ المَوَارِدِ لَا تَخْفِيضِهِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أَرْسَى وِيلْيَام سْتَانِلِي جِيفُونْز أُسُسَ نَظَرِيَّةِ المَنْفَعَةِ الحَدِيَّةِ، وَأَثَّرَ تَأْثِيرًا عَمِيقًا فِي مَسَارِ الفِكْرِ الاقْتِصَادِيِّ الحَدِيثِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يَتَنَاوَلُ الاقْتِصَادِيُّونَ مَفَارَقَةَ جِيفُونْز لِفَهْمِ أَثَرِ الكَفَاءَةِ التِّقَنِيَّةِ فِي زِيَادَةِ اسْتِهْلَاكِ المَوَارِدِ لَا تَخْفِيضِهِ."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
stage5_enrichment:
  per_entry:
    # الاسم الكامل — اسم علم أجنبي معرَّب (MWE ثلاثي الكلمات)، لا جذر عربي
    - lemma: "وِيلْيَام سْتَانِلِي جِيفُونْز"
      entry_id: "{auto}"
    # الكنية المختصرة — اسم علم أجنبي، لا جذر عربي
    - lemma: "جِيفُونْز"
      entry_id: "{auto}"

  per_sense:
    - lemma: "وِيلْيَام سْتَانِلِي جِيفُونْز"
      sense_id: "{auto}"
      nuance: "الاسم الثلاثي الرسمي للشخصية، يُفضَّل في السياقات الأكاديمية الرسمية والمراجع الموسوعية والتاريخية التي تقتضي التعريف الكامل بالشخص."
      mwe: true
    - lemma: "جِيفُونْز"
      sense_id: "{auto}"
      nuance: "الكنية المختصرة الشائعة في الأدبيات الاقتصادية والفلسفية التخصصية؛ تُستخدم حين تكون الشخصية معروفة في السياق، ولا سيما في الإشارة إلى المفاهيم المنسوبة إليها كـ'مفارقة جيفونز' و'مبدأ جيفونز'."

  synset:
    cultural_fit: omission

  actions:
    # بيانات مدخل الاسم الكامل — علم أجنبي، توثيق الأصل
    - command: set_metadata
      params:
        entity_type: entry
