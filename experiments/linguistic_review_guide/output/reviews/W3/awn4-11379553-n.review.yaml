      evidence_status: "no_material_found"

    - lemma: "هِنْرِي فَانْ دِي فِيلْدِي"
      evidence_status: "no_material_found"

    - lemma: "هَانْرِيخ فَانْ دِي فِيلْدِي"
      evidence_status: "no_material_found"

    - lemma: "هَانْرِي فَانْ دِي فِيلْدَه"
      evidence_status: "no_material_found"

    - lemma: "هِنْرِي كْلِيمَانْس فَانْ دِي فِيلْدِي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى الموجودة ──
    - lemma: "فان دي فيلدي"
      decision: confirmed
      decision_reason: >-
        كنية الشخص المعنية مستعملة في المصادر العربية كاسم عائلة منفرد للإحالة
        إلى فان دي فيلدي، وهو استخدام متعارف عليه في النقد الفني والأدبيات
        المعمارية. لا توجد أدلة معجمية لكونه علماً أجنبياً خارج نطاق المعاجم
        العربية. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يمثّل الكنية المجردة دون ذكر الاسم الأول؛ يُستخدم عادةً في النصوص
        الفنية بعد الإشارة الأولى إلى الاسم الكامل، أو حين تكون الشهرة كافية
        للتمييز بالكنية وحدها.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَانْ دِي فِيلْدِي"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "هنري فان دي فيلدي"
      decision: confirmed
      decision_reason: >-
        الاسم الكامل المتداول في الأوساط الثقافية والأكاديمية العربية للإشارة
        إلى هذا المعماري. "هنري" هو التعريب المستقر لـHenri/Henry في العربية
        الحديثة. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الاسم الكامل المُعيِّن للشخص بلا التباس؛ يُستخدم في المقدمات الأولى
        والمراجع الببليوغرافية وعناوين الأعمال المتعلقة به، بينما "فان دي
        فيلدي" يُستخدم للإحالة المختصرة بعد التعريف الأول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِنْرِي فَانْ دِي فِيلْدِي"

    # ── المرشح الأول (المرحلة ١) ──
    - lemma: "هِنْرِي فَانْ دِي فِيلْدِي"
      source: stage1
      decision: removed
      decision_reason: >-
        هذا المرشح مطابق تماماً للمّة الموجودة "هنري فان دي فيلدي" بعد تصحيح
        تشكيلها؛ لا حاجة إلى إنشاء مدخل جديد لأن التصحيح يتم بإجراء update_lemma
        على اللمّة الموجودة.

    # ── المرشح الثاني (المرحلة ١) ──
    - lemma: "هَانْرِيخ فَانْ دِي فِيلْدِي"
      source: stage1
      decision: removed
      decision_reason: >-
        التعريب الألماني "هانريخ" غير مستعمل للشخص المعني في المصادر العربية؛
        اسمه الأصلي بلجيكي-فرنسي "Henri" لا ألماني. إضافة هذا الشكل تُدخل
        لبساً لا ضرورة له.

    # ── المرشح الثالث (المرحلة ١) ──
    - lemma: "هَانْرِي فَانْ دِي فِيلْدَه"
      source: stage1
      decision: removed
      decision_reason: >-
        نطق غير مستقر وغير مستعمل في الكتابة العربية؛ الصيغة المعتمدة هي
        "فيلدي" لا "فيلده". لا قيمة معجمية إضافية.

    # ── المرشح الرابع (المرحلة ١) ──
    - lemma: "هِنْرِي كْلِيمَانْس فَانْ دِي فِيلْدِي"
      source: stage1
      decision: removed
      decision_reason: >-
        الاسم الكامل الثلاثي مفيد للتوثيق الأكاديمي لكنه ثقيل جداً للاستخدام
        المعجمي؛ لا يضيف تمييزاً ضرورياً لأن المجموعة الترادفية تختص بشخص واحد.
        اللمّتان الموجودتان كافيتان للإحالة.


