# الموضوع: هنري فان دي فيلدي — معماري بلجيكي (1863-1957)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "الاسم الأصلي للشخص هو Henri (فرنسي/بلجيكي) وليس Henry (إنجليزي)، والتعريب الحالي مقبول لكلا الصيغتين غير أن الإشارة إلى الأصل مهمّة"
      - "التعريف الحالي شديد الاختصار ولا يذكر مكانة الشخص العلمية والفنية"
      - "المجموعة تفتقر إلى أي مثال استعمالي"
    observations: >-
      هذه مجموعة ترادفية لعَلَمٍ شخصي أجنبي (proper noun)، وهو المعماري والمصمم البلجيكي
      هِنْرِي فَانْ دِي فِيلْدِي (Henri van de Velde، 1863-1957)، أحد رواد حركة الفن
      الجديد (Art Nouveau) ومن مؤسسي مدرسة باوهاوس في وايمار. تحتوي المجموعة على
      لمّتين: الكنية المجردة "فان دي فيلدي" والاسم الكامل "هنري فان دي فيلدي". كلتا
      اللمّتين صحيحتان ومتداولتان في المصادر العربية لكنهما تفتقران إلى التشكيل.
      التوليد العمياء للأعلام الأجنبية لا ينتج عنه إلا تنويعات صوتية للتعريب.

  blind_candidates:
    - lemma: "هِنْرِي فَانْ دِي فِيلْدِي"
      generation_method: taarib
      justification: >-
        التعريب الأقرب للنطق الفرنسي-البلجيكي "Henri van de Velde"؛ صيغة مألوفة
        في المصادر العربية المتخصصة بتاريخ الفن والعمارة. (توليد مرشح قياسي للاسم الكامل)
    - lemma: "هَانْرِيخ فَانْ دِي فِيلْدِي"
      generation_method: taarib
      justification: >-
        تعريب صوتي بديل يستند إلى الأصل الألماني-الفلمنكي للاسم "Heinrich van de
        Velde"؛ المعماري من أسرة فلمنكية ناطقة بالهولندية، وكان اسمه يُكتب أحياناً
        بالصيغة الألمانية.
    - lemma: "هَانْرِي فَانْ دِي فِيلْدَه"
      generation_method: taarib
      justification: >-
        نطق مغاير يعكس الصيغة الهولندية الأصيلة "Velde" بالهاء الأخيرة الصامتة
        المحتملة في التعريب؛ أقل شيوعاً من الصيغة المعتادة.
    - lemma: "هِنْرِي كْلِيمَانْس فَانْ دِي فِيلْدِي"
      generation_method: taarib
      justification: >-
        تعريب الاسم الكامل "Henri Clemens van de Velde"؛ يستخدم في الأوساط
        الأكاديمية والموسوعات للتمييز عن غيره ممن حملوا الاسم نفسه.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
