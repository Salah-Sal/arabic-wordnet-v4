    assessment:
      decision: revise
      reason: >-
        التعريف الحالي صحيح لكنه مقتضب جداً ولا يذكر ما يميّز الشخص ومكانته
        في تاريخ العمارة والفن. المناسب للأعلام الشخصية في موارد المعرفة هو
        التعريف الموسوعي الذي يذكر التخصص الرئيسي والمساهمات الكبرى.
    authored:
      - type: encyclopedic
        text: >-
