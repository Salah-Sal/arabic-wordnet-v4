          حركة الفن الجديد (Art Nouveau) في أواخر القرن التاسع عشر، وقد
          أسهم في تأسيس معهد الفنون التطبيقية في وايمار الذي أصبح نواةً
          لمدرسة الباوهاوس؛ اشتُهر بتصاميمه الجامعة بين الوظيفة والجمال
          في الفن والأثاث والعمارة.
