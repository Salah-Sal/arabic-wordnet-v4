# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "بالنشين"
      decision: confirmed
      decision_reason: >
        هذه اللمّة هي التعريب المختصر لكنية Balanchine (الكنية فقط). وإن لم توجد في قاعدة البيانات المعجمية، فذلك لأن الشخصيات التاريخية الأجنبية نادرًا ما تُدرَج في المعاجم العربية التقليدية.
        الشكل موثَّقٌ في المصادر العربية الموسوعية والنقدية. غير أن التهجئة الأكثر صحةً صوتيًا هي "بالانشين" (بألف بعد اللام)، إذ تعكس المقطع الثاني من الاسم الأصلي (Ba-lan-chine).
        يُوصى بتحديث اللمّة إلى الصيغة الأدق مع تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      loan_check:
        loan_type: taarib
        verdict: "معرَّب مقبول — يقبل لام التعريف (البالانشين) والنسبة (البالانشيني)"
      transliteration_note: "الشكل الأدق صوتيًا: بَالَانْشِين (مع ألف بعد اللام تعكس المقطع الثاني)"
      nuance_differentiation: "صيغة الكنية المُجرَّدة (surname only)؛ أكثر استخدامًا في السياقات العلمية والنقدية المختصرة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَالَانْشِين"

    - lemma: "جورج بالنشين"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المُعرَّب للشخصية. المركب (اسم + كنية) ضروري لتمييز الشخصية عن أي لبس محتمل، وهو الأسلوب المتبع في الموسوعات العربية ومحركات البحث.
        الكنية تستوجب ذات التصحيح الإملائي المُوصى به في اللمّة الأولى (إضافة الألف).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loan_check:
        loan_type: taarib
        verdict: "معرَّب مقبول — مركب (اسم + كنية) معرَّبان"
      nuance_differentiation: "صيغة الاسم الكامل (full name)؛ أوفى للتحديد وأصلح للاستشهاد الموسوعي والببليوغرافي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُورْجُ بَالَانْشِين"

    # ── مرشحات المرحلة ١ ──

    - lemma: "بَالَانْشِين"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح يطابق في جوهره اللمّة الموجودة "بالنشين" بعد تصحيح التهجئة. لا حاجة لإنشاء مدخل جديد؛ التصحيح يتم بتحديث اللمّة القائمة عبر update_lemma الواردة أعلاه.

    - lemma: "جُورْجُ بَالَانْشِين"
      source: stage1
      decision: removed
      decision_reason: >
        يطابق اللمّة الموجودة الثانية بعد تصحيح التهجئة. التصحيح يتم بتحديث المدخل القائم، لا بإنشاء مدخل جديد.

    - lemma: "أَبُو الْبَالِيهِ الأَمْرِيكِيِّ"
      source: stage1
      decision: removed
      decision_reason: >
        فشل اختبار السكّ: اللقب عبارة وصفية حرة لا مصطلح مسكوك — يمكن إبدال "الأمريكي" بـ"الحديث" أو "المعاصر" دون أن يفقد التعبير صحته كوصف. فضلاً عن ذلك، هو لقبٌ ثانوي لا يُغني عن الاسم الحقيقي في الفهرسة المعجمية.

    - lemma: "بَالَنْشِين"
      source: stage1
      decision: removed
      decision_reason: >
        هذا الشكل البديل يُسقط الألف في المقطع الثاني (Ba-lan → بَالَن لا بَالَنْ) مما يُشوّه البنية الصوتية للاسم. الشكل الأكثر دقةً صوتيًا وشيوعًا هو بَالَانْشِين (مع ألف تمييزية)، وقد اعتُمد في تحديث اللمّة الأولى.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
stage4_content:
  definition:
    current: "راقص ومصمم رقصات أمريكي (روسي المولد) اشتهر بأعماله التجريدية والرسمية (1904-1983)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمةٌ شبه حرفية للتعريف الإنجليزي. يصح المعنى لكن الأسلوب قاصر: (أ) لا يُسمّي المجالات الفنية بدقة كافية، (ب) يُغفل إسهامه التأسيسي في مدرسة الباليه الأمريكية، (ج) التعريب الإنجليزي المنقول أفقد التعريفَ طابعَه المعجمي العربي.
    authored:
      - type: encyclopedic
        text: >
          جُورْجُ بَالَانْشِين (1904-1983): مصمِّم رقصات وراقص أمريكي من أصل روسي، يُعدُّ أحد أبرز رواد الباليه في القرن العشرين.
          وُلد في سانت بطرسبرغ، وتلقّى تدريبه في مدرسة الإمبراطورية الإمبراطورية للباليه. هاجر لاحقًا إلى الولايات المتحدة، وأسَّس مدرسة الأمريكية للباليه (1934) ورفيق الباليه في نيويورك.
          اشتُهر بتصاميمه التجريدية التي جرّدت الرقص من العناصر السردية والديكورية مُركِّزةً على الشكل الحركي المحض، مما أرسى ما بات يُعرَف بـ"الباليه الأمريكي" ذي الطابع الشكلاني الصارم.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false

    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10851252-n"
          definition_index: 0
          text: "جُورْجُ بَالَانْشِين (1904-1983): مصمِّم رقصات وراقص أمريكي من أصل روسي، يُعدُّ أحد أبرز رواد الباليه في القرن العشرين، اشتُهر بتصاميمه التجريدية الشكلانية التي أسَّست للباليه الأمريكي الحديث."

  examples:
