# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تصف شخصًا بعينه (عَلَمٌ شخصي)، وهو نوع خاص من المدخلات حيث اللمّات ليست مصطلحات بل تعريبات للاسم الأجنبي — مما يُضيّق نطاق التوليد الأعمى بشكل جذري."
      - "pos المُسجَّل هو 'n' (اسم عام)، في حين أن الشخصيات المسمّاة تنتمي عادةً إلى فئة proper_noun في قواعد البيانات المعجمية."
      - "التعريف الحالي (مُشتَقٌّ من التعريف الإنجليزي) يؤدي وظيفته، غير أنه يفتقر إلى التحرير الأسلوبي بطريقة المعجم الوسيط."
    observations: >
      هذه المجموعة تُمثّل نمطًا نادرًا في AWN4: علَمٌ شخصي لشخصية تاريخية محددة (راقص ومصمم رقصات أمريكي من أصل روسي، 1904-1983).
      الملاحظات اللغوية:
      (أ) في مثل هذه المجموعات لا يُتوقَّع توليد مصطلحات اشتقاقية أو تركيبية، بل تعريبات دقيقة للاسم الأجنبي.
      (ب) التوليد الأعمى (بدون رؤية اللمّات) مقيَّدٌ هنا لأن التعريف لا يذكر اسم الشخص صراحةً، مما يجعل المرشحات الفعلية مجرد تخمينات تعريبية.
      (ج) يُلاحَظ من التعريف الإنجليزي أن الشخصية اشتُهرت بالأعمال "التجريدية والرسمية" (abstract and formal)، وهو ما يجعل التعريف العربي الحالي ملائمًا في مضمونه.
      (د) المُشرَف الأعلى المباشر (direct_hypernym) هو كوريغراف/مصمم رقصات، وهو محدَّدٌ بدقة.

  blind_candidates:
    - lemma: "بَالَانْشِين"
      generation_method: taarib
      justification: >
        تعريبٌ تخميني لاسم أجنبي ينتمي إلى شخصية في مجال الرقص الكلاسيكي ذات أصول أوروبية شرقية (روسية)، نشطت في النصف الأول من القرن العشرين.
        الصيغة بَالَانْشِين تحافظ على مقاطع الاسم الأصلي وتستوفي شروط التعريب (تقبل لام التعريف والنسبة والجمع السالم: البالانشين، البالانشيني).
    - lemma: "جُورْجُ بَالَانْشِين"
      generation_method: taarib
      justification: >
        الاسم الكامل المُعرَّب: الاسم الأول جُورْج (George) معروف في العربية، والكنية بَالَانْشِين. الجمع بين الاسمَيْن يُحدِّد الهوية بصورة أدق ويُفيد في الفهرسة.
        هذا المركب إضافي وظيفياً (اسم + كنية)، وليس مركبًا اصطلاحيًا بالمعنى الدقيق، إلا أنه الأسلوب المتبع في التوثيق المعجمي للأعلام.
    - lemma: "أَبُو الْبَالِيهِ الأَمْرِيكِيِّ"
      generation_method: tarkib
      justification: >
        لقبٌ شرفي مركَّب (إضافي-وصفي) يُعبِّر عن المكانة المعرفية للشخصية في المجال. استُخدم هذا اللقب في الكتابة النقدية العربية للدلالة على ريادة هذا الشخص في تأسيس مدرسة الباليه الأمريكي.
        ملاحظة: هذا التعبير قد يفشل اختبار السكّ (يمكن إبدال "أمريكي" بـ"حديث" مثلاً)، وسيُخضَع للتحقق في المرحلة الثالثة.
    - lemma: "بَالَنْشِين"
      generation_method: taarib
      justification: >
        تعريب بديل يحذف الألف الزائدة في المقطع الثاني ليعكس نطقًا أقرب للتقليد الأنجلوساكسوني. يُستخدَم هذا الشكل أحيانًا في الترجمة العربية للمصادر الإنجليزية، وإن كان أقل دقةً من الناحية الصوتية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
