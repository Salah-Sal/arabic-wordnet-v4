        examples:
          - text: "غيَّر بَالَانْشِين مسار الباليه العالمي حين تخلّى عن السرد والأزياء الفاخرة، واكتفى بالحركة الخالصة وسيلةً للتعبير الفني."
            type: usage
      - lemma: "جُورْجُ بَالَانْشِين"
        examples:
          - text: "يرى المختصون أن جُورْجُ بَالَانْشِين أعاد تعريف لغة الجسد في الباليه من خلال التجريد والصرامة الشكلية التي ميَّزت أعماله الكبرى."
            type: usage

    actions:
