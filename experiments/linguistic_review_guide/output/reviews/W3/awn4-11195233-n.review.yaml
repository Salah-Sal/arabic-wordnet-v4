# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين (جيراردوس مركاتور، مركاتور) مكتوبتان بدون تشكيل."
      - "الاسم الميلادي الأصلي للشخص (Gerhard Kremer / جيرهارد كريمر) مدرج في اللمّات الإنجليزية لكنه غائب عن اللمّات العربية."
      - "التعريف يصف الشخص بـ'جغرافي' فحسب، وهو وصف أعمّ من الدقيق؛ إذ كان رسّام خرائط (كارتوغرافياً) بالدرجة الأولى."
    observations: >
      المجموعة تخصّ شخصاً تاريخياً بعينه هو جيراردوس مركاتور (1512-1594)، الرسّام الفلمنكي الكبير الذي
      أحدث ثورة في علم رسم الخرائط بابتكاره الإسقاط الذي يحمل اسمه. المدخل عَلَمٌ أجنبي مُعرَّب لا جذر
      عربي له، فجميع اللمّات المحتملة تنتمي إلى منهج التعريب (taarib). التمييز بين اللمّات يقوم على
      مستوى الرسمية (الاسم الكامل/المختصر) وطبيعة الاسم (اللاتيني المُعرَّب/ الاسم الميلادي الفلمنكي).
      يستدعي الملف تحديث التشكيل وإضافة الاسم الميلادي.

  blind_candidates:
    - lemma: "مَرْكَاتُور"
      generation_method: taarib
      justification: >
        تعريب الاسم اللاتيني Mercator (بمعنى التاجر) وهو اللقب الذي اتخذه الجغرافي، وقد ورد منسوباً
        إليه في تعبير "إسقاط مركاتور" الذي نصّ عليه التعريف صراحةً. هذا الشكل هو الأكثر تداولاً في
        النصوص العربية العلمية كاسم مختصر.
    - lemma: "جِيرَارْدُوس مَرْكَاتُور"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل اللاتيني Gerardus Mercator، وهو الصيغة الرسمية الأكاديمية للعَلَم في
        المراجع الجغرافية والتاريخية العربية الموسوعية. يُستعمل في السياقات التي تستوجب التحديد الكامل
        للشخصية.
    - lemma: "جِيرْهَارْد كرَيمِير"
      generation_method: taarib
      justification: >
        تعريب الاسم الميلادي الأصلي Gerhard Kremer (بالفلمنكية/الألمانية القديمة، بمعنى التاجر أيضاً).
        هذا هو الاسم الذي وُلد به الشخص قبل أن يُلاتنه. يُستعمل في كتب التاريخ والتراجم حين يُشار إلى
        أصوله الفلمنكية.
    - lemma: "جِيرَارْد مَرْكَاتُور"
      generation_method: taarib
      justification: >
        صيغة مختصرة شائعة في المصادر الفرانكوفونية والمعرَّبة عنها، تحذف اللاحقة اللاتينية (-us)
        وتُعطي طابعاً أكثر حداثةً ومألوفية في بعض المصادر العربية غير المتخصصة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   ١. المطابقة الدقيقة الدفعية — لمّات المجموعة والمرشحات (0 نتائج للأسماء الشخصية)
#   ٢. الجسر الإنجليزي — Mercator / Gerardus Mercator / Gerhard Kremer (4 نتائج لمصطلح الإسقاط)
#   ٣. FTS عربي — مركاتور / ميركاتور / مرقاطر (2 نتائج لمصطلح الإسقاط)
stage2_evidence:
  per_lemma:
    - lemma: "جيراردوس مركاتور"
      evidence_status: "no_material_found"

    - lemma: "مركاتور"
      expands:
        - text: "«الإسقاط المركاتوري: طريقة في رسم الخرائط تُمثَّل فيها خطوط الطول والعرض بخطوط مستقيمة لا بخطوط منحنية، وتتزايد فيها المسافات بين خطوط العرض كلَّما ابتعد خط العَرْض عن خط الاستواء.»"
          source: "المورد الحديث (2008)"
          addition: >
            يُثبت الدليل أن مصطلح الإسقاط المنسوب إلى مركاتور راسخ في المعجمية العربية الحديثة،
            مما يؤكد شهرة الاسم وعلمية استخدامه في السياق الجغرافي العربي.
        - text: "«مسقط ميركيتور» (= Mercator's projection)"
          source: "مسرد الجغرافيا والتاريخ — ALECSO"
          addition: >
            يكشف الدليل عن تنوع في تعريب الاسم (ميركيتور / مركاتور)، مع تفضيل المصادر الحديثة لصيغة
            'مركاتور'. كما يُظهر أن الإسقاط يُنسب إليه بصيغة الملكية.
        - text: "«إسقاط ميركاتوري» (= mercator projection)"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000) — ALECSO"
          addition: "يُثبت استخدام صيغة 'ميركاتوري' كصفة نسبية للإسقاط في المصطلحية البحرية."
        - text: "«إحداثيات مركاتور العَرْضَانية» (= transverse Mercator coordinates)"
          source: "المعجم الموحد لمصطلحات النفط (1999) — ALECSO"
          addition: "يُثبت شيوع النسبة إلى 'مركاتور' في سياقات جيوديسية ونفطية متخصصة."

    - lemma: "جِيرَارْدُوس مَرْكَاتُور"
      evidence_status: "no_material_found"

    - lemma: "جِيرْهَارْد كرَيمِير"
      evidence_status: "no_material_found"

    - lemma: "جِيرَارْد مَرْكَاتُور"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
