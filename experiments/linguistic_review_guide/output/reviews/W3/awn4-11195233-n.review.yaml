            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-11195233-n"

    - lemma: "جِيرَارْد مَرْكَاتُور"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مختصرة غير متمايزة بما يكفي عن 'جِيرَارْدُوس مَرْكَاتُور'؛ إدراجها يُحدث ازدواجية دون
        قيمة مضافة. الصيغة الرسمية المُستخدمة في المراجع العربية هي 'جيراردوس' وليس 'جيرارد'. لا حاجة
        لإنشاء مدخل.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "جغرافي فلمنكي عاش في ألمانيا؛ اخترع إسقاط مركاتور لخرائط الكرة الأرضية (1512-1594)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول لكنه يصف مركاتور بـ'جغرافي' وهو وصف أعمّ؛ فالدقيق الأمين أنه كان
        رسّام خرائط (كارتوغرافياً) وعالم فَلَك، وقد حوّل 'رسم الخرائط' من فن حرفي إلى علم منهجي.
        كما أن الصياغة تُشبه الترجمة الحرفية للنص الإنجليزي، والأجدى أن تُصاغ بأسلوب معجمي عربي
        يُبرز ما اشتُهر به الشخص في تراثنا الجغرافي.
    authored:
      - type: encyclopedic
        text: >
          رسَّام خرائط فلمنكي وعالم جغرافيا وفَلَك (1512-1594)، وُلد في مدينة رَنُّرمُونْد
          واشتغل في ألمانيا؛ اشتُهر باختراعه الإسقاطَ الخرائطي المسمّى باسمه (الإسقاط المركاتوري)
          الذي يُمثَّل فيه سطح الكرة الأرضية على مستوى مستوٍ بخطوط طول وعرض متعامدة مستقيمة،
          وكان لإسقاطه أثرٌ بالغ في تطوير الملاحة البحرية.
