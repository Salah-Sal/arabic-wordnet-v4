    - lemma: "جيراردوس مركاتور"
      decision: confirmed
      decision_reason: >
        الاسم الكامل الأكاديمي للشخص، ولا نظير له يمكن الاستغناء به عنه. يُمثّل الصيغة اللاتينية
        الرسمية المُعرَّبة الأكثر استخداماً في المراجع الموسوعية العربية. يستوجب تحديث التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل باللاتينية المُعرَّبة، يُفيد التحديد الرسمي الأكاديمي الدقيق للشخصية في المراجع
        العلمية والموسوعية؛ يتمايز عن 'مركاتور' المختصر بكونه لا يحتمل اللبس مع أي تاريخ آخر.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِيرَارْدُوس مَرْكَاتُور"

    - lemma: "مركاتور"
      decision: confirmed
      decision_reason: >
        اللقب المختصر الشائع الذي يُعرَّف به الشخص في الاستخدام العلمي والتعليمي العربي. تؤكد أدلة
        المرحلة ٢ رسوخه في المعجمية الجغرافية العربية من خلال مصطلحات الإسقاط المنسوبة إليه. يستوجب
        تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المختصر المشهور الذي انتقل إلى العربية مع مصطلح 'إسقاط مركاتور'؛ يُستخدم منفرداً في
        السياقات العلمية والتعليمية الموجزة، ويتمايز عن الاسم الكامل بالاختصار وسهولة التداول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَرْكَاتُور"

    # ── مرشحات المرحلة ١ ─────────────────────────────────────

    - lemma: "جِيرَارْدُوس مَرْكَاتُور"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة 'جيراردوس مركاتور' بعد إضافة التشكيل. لا يُنشأ مدخل جديد
        بل يُكتفى بتحديث اللمّة الموجودة عبر update_lemma في الإجراءات أعلاه.

    - lemma: "جِيرْهَارْد كرَيمِير"
      source: stage1
      decision: confirmed
      decision_reason: >
        هذا الاسم الميلادي الفلمنكي الأصلي (Gerhard Kremer) مُدرج صراحةً في اللمّات الإنجليزية
        للمجموعة (OEWN: Gerhard Kremer) لكنه غائب عن اللمّات العربية. إدراجه يكمل التوازي بين
        النسختين ويُفيد الباحثين في مصادر التراجم والتاريخ الذين يُشيرون إليه باسمه الأصلي قبل التلاتن.
        لم تُوجد أدلة معجمية لعدم شيوعه كاسم مستقل في المعاجم، غير أن وجوده في OEWN يُوجب تمثيله.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الميلادي الأصلي بالفلمنكية/الألمانية قبل تلاتنته؛ يُستخدم في كتب التراجم والتاريخ حين
        يُستعرض أصل الشخصية، ويتمايز عن الاسمين السابقين بكونه الهوية الأولى قبل الشهرة.
      actions:
        - command: create_entry
