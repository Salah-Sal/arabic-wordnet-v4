# ── المرحلة ١: المراجعة والتوليد (أعمى — قبل الاطلاع على اللمّات) ──
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "الصنف النحوي n قد لا يعكس طبيعة الاسم العلم بدقة كافية؛ يُفضَّل proper_noun في الأنظمة التي تدعمه"
      - "التعريف الحالي مقتضب جداً ويقتصر على البيانات البيوغرافية الجافة دون الإشارة إلى الإسهامات المعمارية"
    observations: >
      المجموعة خاصة باسم علم شخصي أجنبي هو إيرو سارينن، المعمار الأمريكي-الفنلندي
      (1910-1961) أحد رواد العمارة الحديثة التعبيرية. لا يُتوقّع وجود أي دليل
      معجمي عربي لاسم العلم الأجنبي، وهو أمر طبيعي تماماً. اللمّات الممكنة حصراً
      هي نقل حرفي (تعريب) لاسمه الكامل وللقبه الأسري وحده. الأولويات: ضبط التشكيل
      الكامل وإثراء التعريف بما يُميّز سارينن معمارياً.
  blind_candidates:
    - lemma: "إِيرُو سَارِينَن"
      generation_method: taarib
      justification: "نقل حرفي معياري للاسم الكامل Eero Saarinen وفق الأنماط الإملائية العربية المعتمدة لنقل الأسماء الفنلندية-الإنجليزية"
    - lemma: "سَارِينَن"
      generation_method: taarib
      justification: "نقل حرفي للقب الأسري Saarinen وحده، الشكل الأكثر شيوعاً في الإحالات العلمية المختصرة"
    - lemma: "إِيرُو سَارَنِن"
      generation_method: taarib
      justification: "صيغة بديلة للنقل الحرفي مع تخفيف الياء في المقطع الثالث من اللقب (نمط تعريب أقل شيوعاً)"
    - lemma: "سَارَنِن"
      generation_method: taarib
      justification: "صيغة بديلة مختصرة للقب مع تخفيف الياء، تظهر أحياناً في بعض المصادر العربية"


