    - lemma: "سَارِينَن"
      evidence_status: "no_material_found"
    - lemma: "إِيرُو سَارَنِن"
      evidence_status: "no_material_found"
    - lemma: "سَارَنِن"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة الأولى ──
    - lemma: "إيرو سارينن"
      decision: confirmed
      decision_reason: >
        الاسم الكامل (الاسم الشخصي + اللقب الأسري) هو الصيغة الأكثر دقةً وتوثيقاً
        للدلالة على المُعمار؛ يُستخدم في السياقات الرسمية والمراجع الأكاديمية التي
        تستوجب الإحالة الكاملة. الشكل سليم صوتياً ولا إشكال في البنية؛ الحاجة الوحيدة
        هي إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل (اسم شخصي + لقب أسري)؛ يُستخدم في السياقات الرسمية والمراجع الأكاديمية والتعريفية حيث يُراد التعريف الكامل بالشخص"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيرُو سَارِينَن"

    # ── اللمّة الموجودة الثانية ──
    - lemma: "سارينن"
      decision: confirmed
      decision_reason: >
        اللقب الأسري وحده هو الشكل الاختزالي الأكثر شيوعاً في الكتابة المتخصصة
        والصحفية؛ بمجرد التعريف بالشخص يُكتفى باللقب في الإحالات اللاحقة.
        الشكل سليم صوتياً ويحتاج فقط إلى ضبط التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب الأسري المجرد؛ يُستخدم في الإحالات المختصرة والسياقات غير الرسمية حيث سبق ذكر الشخص وتعريفه"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَارِينَن"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِيرُو سَارِينَن"
      source: stage1
      decision: removed
      decision_reason: "يطابق اللمّة الموجودة «إيرو سارينن» بعد ضبط التشكيل المقرر؛ الإجراء update_lemma على اللمّة الموجودة يُغني عن إنشاء مدخل جديد."

    - lemma: "سَارِينَن"
      source: stage1
      decision: removed
      decision_reason: "يطابق اللمّة الموجودة «سارينن» بعد ضبط التشكيل المقرر؛ مُغنيَةٌ عنه."

    - lemma: "إِيرُو سَارَنِن"
      source: stage1
      decision: removed
      decision_reason: "صيغة غير معيارية للنقل الحرفي؛ الشكل الشائع في المصادر العربية هو سَارِينَن (بالياء الصريحة) لا سَارَنِن."

    - lemma: "سَارَنِن"
