# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (صمويل مورس، مورس) تفتقران إلى التشكيل الكامل"
      - "صنف POS مُحدَّد بـ n (اسم نكرة) في حين أن المجموعة تُمثّل اسم علم (proper_noun)؛ قد يستوجب تعديلاً إن كان AWN4 يُفرّق بين الصنفين"
      - "«مورس» وحده غامض الدلالة: في المعاجم البيولوجية تُترجم morse الإنجليزية بـ«فيل البحر» (الفَظّ)؛ وفي موسوعة السلطان قابوس تُعدّ صيغةً من صيغ الاسم «موريس» الذكوري"
      - "التعريف العربي يتضمن «بورتريه» الدخيلة بدلاً من المقابل الفصيح «صورة شخصية»"
      - "اللمّات الإنجليزية تشمل أربع صيغ (Morse، Samuel Morse، Samuel F. B. Morse، Samuel Finley Breese Morse) بينما العربية تغطي صيغتين فقط"
    observations: >
      هذه المجموعة تُمثّل اسم علم لشخصية تاريخية غربية هي صمويل فينلي بريز مورس (1791-1872م)،
      الرسام الأمريكي البارز ومخترع التلغراف الكهربائي ومبتكر الشفرة البرقية الدولية.
      اللمّات المُعتمدة حالياً هي تعريبات صوتية صحيحة للصيغتين الإنجليزيتين Samuel Morse وMorse،
      غير أنها خالية من التشكيل. الاسم الرباعي الكامل مفقود من المجموعة العربية رغم حضوره في
      المقابل الإنجليزي. ينبغي تحديث التشكيل وإضافة الاسم الكامل وتنقية التعريف من الألفاظ الدخيلة.
  blind_candidates:
    - lemma: "مُورِس"
      generation_method: taarib
      justification: "اللقب المختصر لمخترع التلغراف، مأخوذ من الاسم الإنجليزي Morse بالتعريب الصوتي؛ وقد ورد ضمنياً في التعريف في تعبير «شفرة مورس»"
    - lemma: "صَمُويِل مُورِس"
      generation_method: taarib
      justification: "الاسم الثنائي الأكثر شيوعاً في المصادر العربية للإحالة إلى هذه الشخصية؛ يجمع الاسم الأول Samuel والاسم العائلي Morse معرَّبَيْن صوتياً في مركّب إضافي"
    - lemma: "صَمُويِل فِينلِي بريز مُورِس"
      generation_method: taarib
      justification: "الاسم الرباعي الكامل للشخصية بالتعريب الصوتي، مطابق للمقابل الإنجليزي Samuel Finley Breese Morse؛ ضروري لاستيعاب المراجع الأكاديمية التي تلجأ إلى الاسم الكامل للتمييز"
    - lemma: "سَام مُورِس"
      generation_method: taarib
      justification: "الصيغة المختصرة غير الرسمية (Sam) مع اللقب، قد تَرِد في النصوص الصحفية المترجمة من الإنجليزية"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية: صمويل مورس، مورس، المورس، سام مورس، صمويل فينلي بريز مورس
#   Q2 — جسر إنجليزي: Morse، Samuel Morse، Samuel F. B. Morse، Samuel Finley Breese Morse، Morse code، telegraph
stage2_evidence:
  per_lemma:
    - lemma: "صَمُويِل مُورِس"
      evidence_status: "no_material_found"

    - lemma: "مُورِس"
      contradicts:
        - text: "«مورس: إحدى صور الاسم موريس. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المدخل يُعامل «مورس» بوصفه صيغةً من صيغ الاسم الشخصي «موريس» لا لقباً للمخترع صمويل مورس، مما يُثبت الغموض الدلالي للمفردة المفردة"
      expands:
        - text: "«إبراق (مورس)» (= Morse telegraphy)"
          source: "موسوعة الكهرباء — IEC 60050"
          addition: "يؤكد ورود «مورس» في المصطلحية التقنية العربية منسوباً إلى الشخصية ذاتها في سياق الإبراق البرقي"
        - text: "«تلغراف مورس» (= morse telegraph)"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "توثيق استخدام «مورس» منسوباً إلى التلغراف في المعاجم التقنية العربية"
        - text: "«إشارات مورس» (= morse code)"
          source: "المعجم الموحد لمصطلحات علوم البحار (2000)"
          addition: "الاستخدام المصطلحي لـ«مورس» في سياق الإشارات البرقية"
        - text: "«شفرة مورس» (= Morse code)"
          source: "موسوعة الكهرباء — IEC 60050"
          addition: "توثيق المصطلح التقني الأشهر المنسوب إلى مورس؛ يُثبت شيوع اللقب في الاستخدام العربي المتخصص"
        - text: "«دقّاق <مورس>» (= Morse sounder)"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "توثيق إضافي لارتباط اللقب بالمصطلحية التقنية العربية"
        - text: "«حالة علامة (في شفرة مورس)» (= mark condition in Morse code)"
          source: "موسوعة الكهرباء — IEC 60050"
          addition: "استخدام اللقب «مورس» في وصف حالات شفرته البرقية"

    - lemma: "صَمُويِل فِينلِي بريز مُورِس"
      evidence_status: "no_material_found"

    - lemma: "سَام مُورِس"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "صمويل مورس"
      decision: confirmed
      decision_reason: >
        الاسم الثنائي هو الصيغة الأكثر شيوعاً وانتشاراً في الكتابات العربية للإحالة إلى هذه
        الشخصية التاريخية؛ لا يوجد دليل يعارضه. يُعدَّل التشكيل ليكون «صَمُويِل مُورِس».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الأكثر شيوعاً والأكثر تحديداً من «مُورِس» وحده؛ تجمع الاسم الشخصي والعائلي
        وتُزيل الغموض الناتج عن تعدد حاملي اللقب أو تداخله مع «موريس»
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَمُويِل مُورِس"

    - lemma: "مورس"
      decision: confirmed
      decision_reason: >
        اللقب المختصر وثيق الصلة بالمجموعة وثبت استخدامه في مصطلحات تقنية عربية معتمدة
        (شفرة مورس، تلغراف مورس، إبراق مورس). رغم الغموض الذي تكشفه موسوعة السلطان قابوس
        (مورس = صيغة موريس) وتداخله البيولوجي (morse = فيل البحر)، فإن السياق الترادفي
        المتخصص وانتماءه إلى هذه المجموعة يرفعان هذا الغموض. يُحدَّث بالتشكيل: «مُورِس».
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المختصر وحده، يُستخدم حين يكون السياق جلياً أو بعد ذكر الاسم الكامل؛
        أكثر إيجازاً وأقل تحديداً من «صَمُويِل مُورِس»، وأعرض استخداماً في المصطلحية التقنية
        المنسوبة إليه (شفرة مورس، تلغراف مورس)
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُورِس"

    - lemma: "صَمُويِل فِينلِي بريز مُورِس"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرباعي الكامل ضروري من الناحية المعجمية لتوافق المجموعة العربية مع نظيرها
        الإنجليزي (Samuel Finley Breese Morse)؛ يُستخدم في المراجع الأكاديمية والسير
        الذاتية المترجمة حين يُراد التحديد القاطع للشخصية دون لبس مع شخصيات تاريخية أخرى.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرباعي الكامل، أعلى درجات الرسمية والتحديد؛ يُحيل إلى الشخصية دون أدنى لبس
        ويُستخدم في السياقات الأكاديمية وصفحات السيرة الذاتية
      actions:
        - command: create_entry
          params:
            lemma: "صَمُويِل فِينلِي بريز مُورِس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-11212656-n"

    - lemma: "سَام مُورِس"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة غير رسمية ومختصرة لا تَرِد في المعاجم العربية المتخصصة ولا في المصادر
        الأكاديمية المعتمدة. الاختصار «سام» لـ Samuel غير موثَّق في التقليد العربي للتعريب،
        وإدراجه قد يُربك القارئ بدل أن يُفيده.


