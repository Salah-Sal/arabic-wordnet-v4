# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14027502-n (thermal equilibrium)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «توازن حراري» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط — ينبغي إثراؤها بمرادفات"
    observations: >
      المفهوم فيزيائي أساسي (التوازن الحراري) يصف حالة تتساوى فيها درجة الحرارة
      في جميع أجزاء النظام. التعريف العربي الحالي واضح ومباشر. المصطلح العربي
      «توازن حراري» مركب وصفي شائع في الأدبيات العلمية العربية. يوجد مرادف
      مُثبت في معاجم الفيزياء وهو «اتزان حراري». المفهوم جنس قريب: توازن (hypernym).
  blind_candidates:
    - lemma: "تَوَازُنٌ حَرَارِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «تَوَازُن» (مصدر تَوَازَنَ على وزن تَفَاعُل يدل على التشارك
        في الاتزان) و«حَرَارِيّ» (نسبة إلى الحرارة). هذا التركيب هو الأكثر شيوعاً
        في المعاجم العلمية العربية لهذا المفهوم.
    - lemma: "اتِّزَانٌ حَرَارِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «اتِّزَان» (مصدر اتَّزَنَ على وزن افْتَعَل من جذر وزن)
        و«حَرَارِيّ». صيغة افتعال تدل على المطاوعة والحصول على التوازن ذاتياً.
        يُستعمل في معاجم الفيزياء والجيولوجيا مرادفاً لـ«توازن».
    - lemma: "تَسَاوٍ حَرَارِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «تَسَاوٍ» (مصدر تَسَاوَى، يدل على التماثل) و«حَرَارِيّ».
        يعكس جوهر المفهوم: تساوي درجة الحرارة في أجزاء النظام.
    - lemma: "تَكَافُؤٌ حَرَارِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من «تَكَافُؤ» (مصدر تَكَافَأَ على وزن تَفَاعُل من جذر كفأ،
        يدل على التعادل والتماثل) و«حَرَارِيّ». يُستعمل «تكافؤ» في الكيمياء
        والفيزياء بمعنى التعادل.

stage2_evidence:
  per_lemma:
    - lemma: "تَوَازُنٌ حَرَارِيٌّ"
      confirm:
        - text: "«تساوي درجة الحرارة بين طورين مُتجاورين.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«thermal equilibrium — توازن حراري»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«heat balance — تَوازُنٌ حَرارِيّ»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«جهاز يقوم بقياس معدل فقدان و اكتساب النظام للحرارة.»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "تعريف المصطلح في سياق هندسة المياه بدلالة «heat balance» وليس «thermal equilibrium» تماماً"
        - text: "«حَصيلةُ حرارية — توازن حراري» (heat balance)"
          source: "المعجم الموحد لمصطلحات الأرصاد الجوية (1999)"
          addition: "يُستعمل «توازن حراري» أيضاً بمعنى الحصيلة الحرارية في الأرصاد الجوية"

    - lemma: "اتِّزَانٌ حَرَارِيٌّ"
      confirm:
        - text: "«قانون ينصّ على أن جميع الأنظمة التي توجد في حالة توازن حراري مع نظام مُعين، تكون في حالة اتزان حراري بين بعضها البعض.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — مدخل القانون الصفري"
      expands:
        - text: "«اتّزان، توازُن — equilibrium»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "المعجم يذكر «اتزان» و«توازن» مترادفَيْن لمفهوم الاتزان العام"
        - text: "«توازن، اتّزان — equilibrium»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "نفس الترادف مثبت في معجم الفيزياء"

    - lemma: "تَسَاوٍ حَرَارِيٌّ"
      contradicts:
        - text: "«تساوي الحرارة — isotherm»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          conflict: "«تساوي الحرارة» مصطلح مُثبت لمفهوم مختلف (isotherm) وليس thermal equilibrium"

    - lemma: "تَكَافُؤٌ حَرَارِيٌّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَوَازُنٌ حَرَارِيٌّ"
      decision: confirmed
      decision_reason: >
        مصطلح مُثبت في عدة معاجم علمية عربية موحّدة (الطاقة المتجددة، الكهرباء،
        الطب، المياه، الأرصاد الجوية). التعريف في معجم الطاقة المتجددة يطابق
        دلالة المجموعة الترادفية. اللمّة الأصلية بدون تشكيل — يجب تحديثها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الصيغة الأكثر شيوعاً واستعمالاً في النصوص العلمية العربية المعاصرة.
        صيغة التفاعل (تَوَازُن) تدل على التشارك والتبادل في الوزن/القوة بين
        أجزاء النظام. هي الصيغة المعيارية في معاجم ALECSO.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَازُنٌ حَرَارِيٌّ"

    - lemma: "اتِّزَانٌ حَرَارِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مثبت كمرادف لـ«توازن حراري» في نص القانون الصفري للديناميكا الحرارية
        (معجم الطاقة المتجددة). كما أن ترادف «اتزان» و«توازن» مثبت في معاجم
        الفيزياء والجيولوجيا والزلازل. صيغة الافتعال (اتِّزَان) تدل على
        المطاوعة والتحقق الذاتي للتوازن.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        صيغة الافتعال (اتِّزَان) تؤكد على حصول التوازن واستقراره ذاتياً،
        بينما «تَوَازُن» (تفاعل) تؤكد على التشارك بين الأجزاء. «اتزان»
        أكثر شيوعاً في الفيزياء النووية والجيولوجيا، و«توازن» أعمّ استعمالاً.
      actions:
        - command: create_entry
          params:
            lemma: "اتِّزَانٌ حَرَارِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَسَاوٍ حَرَارِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «تساوي الحرارة» مصطلح مُثبت بدلالة مختلفة (isotherm = خط تساوي الحرارة)
        في معاجم الفيزياء والكيمياء والجيولوجيا. استعمال «تساوٍ حراري» للتوازن
        الحراري يُحدث اشتراكاً لفظياً مُربكاً مع مفهوم علمي راسخ.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَكَافُؤٌ حَرَارِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي على استعمال هذا المركب. «تكافؤ» في السياق العلمي العربي
        يرتبط بمفهوم التكافؤ الكيميائي (valence) أكثر من التوازن الفيزيائي.
        إدخاله يُحدث لبساً مع المصطلح الكيميائي.
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "حالة تكون فيها جميع أجزاء النظام عند نفس درجة الحرارة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه لكنه يفتقر إلى الجنس القريب الصريح
        (حالة اتزان) ولا يذكر انعدام انتقال الحرارة وهو الشرط الجوهري.
        ينبغي تحسينه بأسلوب المعجم الوسيط مع إضافة الفصل النوعي.
    authored:
      - type: terminological
        text: "حالةُ اتِّزانٍ تتساوى فيها دَرَجاتُ الحَرارةِ في جميعِ أجزاءِ النِّظامِ فلا تنتقلُ حرارةٌ بينَها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "حالةٌ من حالاتِ التَّوازُنِ الدِّيناميكيِّ الحَراريِّ تتساوى فيها دَرَجاتُ الحَرارةِ في جميعِ أجزاءِ المَنظومةِ الفيزيائيَّةِ بحيثُ ينعدمُ التَّدفُّقُ الحَراريُّ الصَّافي بينَ أيِّ جُزأيْنِ منها، وهيَ الأساسُ الذي يقومُ عليهِ القانونُ الصِّفريُّ للدِّيناميكا الحَراريَّة"
    actions:
