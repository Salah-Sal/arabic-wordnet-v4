# مراجعة المجموعة الترادفية awn4-14026917-n — isostasy
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الثانية «توازن تضاغطي» مركب وصفي غير موثّق بنصّه في المعاجم المصطلحية المتاحة"
      - "التعريف العربي الحالي ترجمة شبه حرفية للتعريف الإنجليزي، ويحتاج إلى صياغة معجمية أصيلة"
    observations: "المفهوم جيولوجي تخصصي يعبّر عن حالة التوازن الهيدروستاتيكي للقشرة الأرضية فوق الوشاح. اللمّة الأولى مركب إضافي ثلاثي طويل نسبياً لكنه مستقر في الاستعمال المصطلحي. اللمّة الثانية تستعمل صفة «تضاغطي» (= isostatic) لكنها ليست الشكل المعجمي المعتاد للمفهوم بل وصف لنوع التوازن."
  blind_candidates:
    - lemma: "تَوَازُنِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «توازن» على وزن فَعَالنِيَّة، يحيل إلى حالة التوازن المجردة، وهو نمط إنتاجي في المصطلحية العربية (قارن: مغناطيسية، كهربائية)"
    - lemma: "تَضَاغُطِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تضاغط» (التفاعل بالضغط المتبادل)، يعبّر عن حالة الخضوع لضغط متساوٍ من جميع الجهات"
    - lemma: "تَكَافُؤُ القِشْرَةِ"
      generation_method: tarkib
      justification: "مركب إضافي من «تكافؤ» (تساوي القوى) و«القشرة»، يعبّر عن تساوي القوى الرافعة والخافضة في القشرة الأرضية"
    - lemma: "إِيزُوسْتَاسِي"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي isostasy على وزن يقبل الاشتقاق (إيزوستاسيّ، إيزوستاسيّة)"

stage2_evidence:
  per_lemma:
    - lemma: "تَوَازُنُ القِشْرَةِ الأَرْضِيَّةِ"
      confirm:
        - text: "«توازن القشرة الأرضية — حالة توازن»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
        - text: "«توازن القشرة الأرضية — حالة توازن» (translation_en: isostasy; isoseismal balance)"
          source: "المعجم الموحد لمصطلحات علوم الزلازل (1999)"
        - text: "«توازن القشرة الأرضية» (translation_en: isostasy)"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"
      expands:
        - text: "«(2) توازن القشرة الأرضية (جي).»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد أن المصطلح يُستخدم تحديداً في مجال الجيولوجيا"
        - text: "«نظرية توازن القشرة الأرضية» (translation_en: isostatic theory)"
          source: "مسرد الجغرافيا والتاريخ"
          addition: "يوجد مركب أطول يدل على النظرية المرتبطة بالمفهوم"
        - text: "«توازن مكونات القشرة — طفو الصفائح، التي هي أقل كثافة فوق غلاف موري الأعلى كثافة، تقريبا مثل طفو قطعة من الخشب فوق الماء.» (translation_en: isostasy)"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          addition: "صيغة بديلة تشرح آلية التوازن عبر الطفو"

    - lemma: "تَوَازُنٌ تَضَاغُطِيٌّ"
      contradicts:
        - text: "«(1) التضاغطيّة: الخضوع لضغط متساوٍ من جميع الجهات (فز) (2) توازن القشرة الأرضية (جي).»"
          source: "المورد الحديث (2008)"
          conflict: "المورد يفصل بين المعنى الفيزيائي (التضاغطية) والجيولوجي (توازن القشرة الأرضية)، ولا يستعمل تركيب «توازن تضاغطي» بل يستعمل المصدر الصناعي أو المركب الإضافي"
      expands:
        - text: "«إحكام تضاغطي» (translation_en: isostatic readjustment)"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "يُثبت استعمال الصفة «تضاغطي» بمعنى isostatic في المصطلحية العربية"
        - text: "«موجة تضاغطية» (translation_en: compressional wave)"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يُثبت حيوية الصفة «تضاغطي/تضاغطية» في الاستعمال العلمي"

    - lemma: "تَوَازُنِيَّة"
      confirm:
        - text: "«التوازنية — حالة التوازن التي توجد عليها مختلف المجموعات القارية لكونها توجد فوق الغطاء اللزج» (translation_en: isostay [=isostasy])"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"

    - lemma: "تَضَاغُطِيَّة"
      confirm:
        - text: "«(1) التضاغطيّة: الخضوع لضغط متساوٍ من جميع الجهات (فز)»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(1) التضاغطيّة: الخضوع لضغط متساوٍ من جميع الجهات (فز) (2) توازن القشرة الأرضية (جي).»"
          source: "المورد الحديث (2008)"
          conflict: "المورد يخصّ «التضاغطيّة» بالمعنى الفيزيائي (ضغط متساوٍ) ويفصلها عن المعنى الجيولوجي"

    - lemma: "تَكَافُؤُ القِشْرَةِ"
      evidence_status: "no_material_found"

    - lemma: "إِيزُوسْتَاسِي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَوَازُنُ القِشْرَةِ الأَرْضِيَّةِ"
      decision: confirmed
      decision_reason: "مصطلح مثبت في ثلاثة معاجم مصطلحية عربية موحّدة (الجيولوجيا، الزلازل، الجغرافيا) بمقابل isostasy، وهو الشكل المعتمد من المنظمة العربية للتربية والثقافة والعلوم"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح الجيولوجي الرسمي الكامل، يحدد المفهوم بوضوح عبر ذكر موضع التوازن (القشرة الأرضية)، وهو الأكثر شيوعاً في النصوص الأكاديمية والمعجمية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَازُنُ القِشْرَةِ الأَرْضِيَّةِ"

    - lemma: "تَوَازُنٌ تَضَاغُطِيٌّ"
      decision: confirmed
      decision_reason: "مركب وصفي مقبول لغوياً (توازن + تضاغطي = isostatic equilibrium)، والصفة «تضاغطي» مثبتة في معاجم النفط والزلازل بمعنى isostatic. وإن لم يُوثّق المركب بنصّه، فهو تركيب اصطلاحي شفّاف ومتّسق مع أنماط التسمية العلمية العربية"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يصف نمط التوازن (تضاغطي = ناتج عن ضغوط متبادلة) دون تحديد الموضع، وهو أقرب إلى الاستعمال الفيزيائي منه إلى الجيولوجي الصرف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَازُنٌ تَضَاغُطِيٌّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَوَازُنِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح مثبت في مسرد الجغرافيا والتاريخ (أليكسو) بتعريف صريح يطابق مفهوم المجموعة: «حالة التوازن التي توجد عليها مختلف المجموعات القارية لكونها توجد فوق الغطاء اللزج»، وهو مقابل isostasy"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصدر صناعي مفرد يعبّر عن الحالة المجردة للتوازن الأرضي، وهو أوجز من المركبات الأخرى ويصلح للاستعمال في السياقات التي تتطلب إيجازاً"
      actions:
        - command: create_entry
          params: {lemma: "تَوَازُنِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "تَضَاغُطِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المورد الحديث يخصّ «التضاغطيّة» بالمعنى الفيزيائي (الخضوع لضغط متساوٍ من جميع الجهات) ويفصلها صراحةً عن المعنى الجيولوجي الذي يقابله بـ«توازن القشرة الأرضية». إدراجها في مجموعة جيولوجية يخلط بين حقلين دلاليين مختلفين"

    - lemma: "تَكَافُؤُ القِشْرَةِ"
      source: stage1
