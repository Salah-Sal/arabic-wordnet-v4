        text: "(في الجيولوجيا) حالةُ توازنٍ تتحقّق حين تطفو كُتَلُ القشرةِ الأرضيّة — وهي أقلّ كثافة — فوق الغلاف الموريّ اللزج الأعلى كثافة، على نحوٍ يشبه طفوَ قطعة خشب فوق الماء؛ فكلّما زاد سُمك الكتلة القشريّة غاصت أعمق في الوشاح وارتفعت أكثر فوق سطحه"
        quality_check:
