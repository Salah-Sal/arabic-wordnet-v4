stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة حالياً تفتقر للتشكيل الكامل."
    observations: "المجموعة تشير إلى معلم جغرافي محدد (خليج مونتيري)، والمصطلح المستخدم هو الترجمة المعيارية له في العربية. التعريف دقيق ومباشر."
  blind_candidates:
    - lemma: "خَلِيجُ مُونْتِيرِي"
      generation_method: tarkib
      justification: "الترجمة الحرفية والمعيارية للمصطلح الإنجليزي (Monterey Bay)، حيث 'خليج' هو النوع الجغرافي و'مونتيري' هو اسم العلم."
    - lemma: "جَوْنُ مُونْتِيرِي"
      generation_method: tarkib
      justification: "استخدام 'جون' كبديل لـ 'خليج' للدلالة على المسطح المائي المحاط باليابسة، وهو مصطلح جغرافي فصيح."
    - lemma: "دَاخِلَةُ مُونْتِيرِي"
      generation_method: majaz
      justification: "استخدام 'داخلة' كمصطلح قديم للإشارة إلى الخليج أو مدخل البحر في اليابسة."
    - lemma: "شَرْمُ مُونْتِيرِي"
      generation_method: tarkib
      justification: "استخدام 'شرم' للدلالة على المدخل المائي، وإن كان يُستخدم غالباً للمداخل الضيقة."

stage2_evidence:
  per_lemma:
    - lemma: "خليج"
      confirm:
        - text: "«(الخَلِيجُ): امتدادٌ من المَاء متوغل فِي الْيَابِس.»"
          source: "المعجم الوسيط"
        - text: "«الخَلِيج: فى الجغرافيا gulf: امتدادٌ من مياه البِحارِ أو الأَنْهارِ مُتَوغِّلٌ فى اليابسِ.»"
          source: "المعجم الكبير"
      expands:
        - text: "«خَلِيجَا النَّهْرِ أَوِ الْبَحْرِ: جَنَاحَاهُ.»"
          source: "مقاييس اللغة"
    - lemma: "خليج مونتيري"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خليج مونتيري"
      decision: confirmed
      decision_reason: "هو الاسم العربي المعياري والشائع لهذا المعلم الجغرافي، ويتفق تماماً مع التعريف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ مُونْتِيرِي"

stage4_content:
  definition:
    current: "مدخل للمحيط الهادئ في غرب كاليفورنيا"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق ولكنه يحتاج إلى صياغة أكثر شمولاً ومطابقة لأسلوب المعاجم الجغرافية."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ بَحْرِيٌّ يَقَعُ عَلَى سَاحِلِ المُحِيطِ الهَادِئِ فِي وِلَايَةِ كَالِيفُورْنْيَا الأَمْرِيكِيَّةِ، يَشْتَهِرُ بِتَنَوُّعِهِ البَيُولُوجِيِّ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَلِيجٌ بَحْرِيٌّ يَقَعُ عَلَى سَاحِلِ المُحِيطِ الهَادِئِ فِي وِلَايَةِ كَالِيفُورْنْيَا الأَمْرِيكِيَّةِ، يَشْتَهِرُ بِتَنَوُّعِهِ البَيُولُوجِيِّ."

  examples:
    per_lemma:
      - lemma: "خليج مونتيري"
        examples:
          - text: "يُعَدُّ خَلِيجُ مُونْتِيرِي مَقْصِداً سِيَاحِيّاً هَامّاً فِي غَرْبِ الوِلَايَاتِ المُتَّحِدَةِ."
            type: usage

stage5_enrichment:
  per_entry:
    - lemma: "خَلِيجُ مُونْتِيرِي"
      entry_id: "{auto}"
      roots:
        - word: "خليج"
          root: "خلج"
          maqayis_quote: "«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ. فَمِنْ ذَلِكَ الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ.»"
        - word: "مونتيري"
          root: null
          maqayis_quote: null
  per_sense:
    - lemma: "خَلِيجُ مُونْتِيرِي"
      sense_id: "{auto}"
      nuance: "يُستعمل كاسم علم جغرافي حصري لهذا الموقع."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"خليج","root":"خلج","maqayis":"«الْخَاءُ وَاللَّامُ وَالْجِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى لَيٍّ وَفَتْلٍ وَقِلَّةِ اسْتِقَامَةٍ. فَمِنْ ذَلِكَ الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ.»"},{"word":"مونتيري","root":null}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
