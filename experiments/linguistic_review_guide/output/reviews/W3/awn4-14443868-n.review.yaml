# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14443868-n
# coherence / cohesion — حالة التماسك أو الالتصاق معاً
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تلاحم، تماسك) بدون تشكيل كامل"
      - "التعريف العربي يستخدم كلمة «تماسك» وهي لمّة في المجموعة نفسها — دوران جزئي"
    observations: >
      المفهوم يدلّ على حالة التصاق الأجزاء وترابطها في كلٍّ واحد، وهو مفهوم فيزيائي-مجرّد
      يجمع بين الدلالة الحسية (الالتصاق المادي) والمعنوية (الترابط والانسجام).
      التصنيف تحت «حالة الاتصال» صحيح. المجموعة تحتاج إلى تمييز دقيق بين
      اللمّات من حيث التخصص الدلالي.
  blind_candidates:
    - lemma: "تَلاحُم"
      generation_method: ishtiqaq
      justification: "من جذر ل-ح-م على وزن تَفاعُل الدالّ على المشاركة، يفيد تداخل الأجزاء بعضها في بعض كاللحم المتداخل"
    - lemma: "تَماسُك"
      generation_method: ishtiqaq
      justification: "من جذر م-س-ك على وزن تَفاعُل، يفيد حبس الأجزاء بعضها لبعض وعدم تفرّقها"
    - lemma: "الْتِحام"
      generation_method: ishtiqaq
      justification: "من جذر ل-ح-م على وزن اِفْتِعال، يفيد الاندماج والتحام الأجزاء في كلٍّ واحد"
    - lemma: "تَلاصُق"
      generation_method: ishtiqaq
      justification: "من جذر ل-ص-ق على وزن تَفاعُل، يفيد ملازمة الشيء للشيء والتصاقه به"

stage2_evidence:
  per_lemma:
    - lemma: "تَلاحُم"
      confirm:
        - text: "«في المدرسة الكلوسيماتية، خاصية للوظيفة التي يتآلف فيها عنصران مثل العلاقة بين المضمون والتشكل أو المعنى واللفظ.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«طريقةُ ودرجةُ ارتباط المهمّات التي تُنجزها نَسِيقَةٌ برمجيةٌ وحيدةٌ بعضِها ببعض.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«(1) تلاحُم؛ تماسُك (2) ترابُط منطقيّ.» — ترجمة coherence"
          source: "المورد الحديث (2008)"
        - text: "«(1) تلاحُم؛ تلاصُق (2) التّماسُك (فز).» — ترجمة cohesion"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«اللَّامُ وَالْحَاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَدَاخُلٍ، كَاللَّحْمِ الَّذِي هُوَ مُتَدَاخِلٌ بَعْضُهُ فِي بَعْضٍ. وَسُمِّيَتِ الْحَرْبُ مَلْحَمَةً لِمَعْنَيَيْنِ: أَحَدُهُمَا تَلَاحُمُ النَّاسِ: تَدَاخُلُهُمْ بَعْضِهِمْ فِي بَعْضٍ.»"
          source: "مقاييس اللغة — ابن فارس"
          addition: "الجذر يدلّ على التداخل والاندماج، وهو أصل دلالة التلاحم"

    - lemma: "تَماسُك"
      confirm:
        - text: "«ترابُط أجزاء الشيء حِسِّيًّا أو معنويًّا. التماسُك الاجتماعى: ترابط أجزاء المجتمع الواحد. (مج)»"
          source: "المعجم الوسيط"
        - text: "«(التماسك) ترابط أَجزَاء الشَّيْء حسيا أَو معنويا وَمِنْه التماسك الاجتماعي»"
          source: "المعجم الوسيط (هورماني)"
        - text: "ترجمة coherence في معاجم: التقنيات التربوية، الكهرباء"
          source: "ARABTERM — مصادر متعددة"
        - text: "ترجمة cohesion في معاجم: الهندسة المدنية، الكيمياء، الجيولوجيا، الزلازل، الأحياء، الفلسفة، الطب"
          source: "ARABTERM — مصادر متعددة"
      expands:
        - text: "«الالتصاق بين المونة الإسمنتية وحصويات الخرسانة» — ترجمة cohesion"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "يبيّن الاستعمال التقني الحسّي للتماسك بمعنى الالتصاق الداخلي"
        - text: "«الْمِيمُ وَالسِّينُ وَالْكَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى حَبْسِ الشَّيْءِ أَوْ تَحَبُّسِهِ.»"
          source: "مقاييس اللغة — ابن فارس"
          addition: "الجذر يدلّ على الحبس والإمساك، وهو أساس دلالة التماسك"
        - text: "«التصاق جزيئات المادة فيما بينها.» — ترجمة cohesion"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "تعريف علمي دقيق يؤكد المعنى الفيزيائي للتماسك"

    - lemma: "الْتِحام"
      confirm:
        - text: "ترجمة adherence/adhesion في معجم المياه والتقنيات التربوية"
          source: "ARABTERM"
        - text: "ترجمة coalescence في معجم النقل والمعجم الطبي"
          source: "ARABTERM"
      contradicts:
        - text: "«(فى علم الأحياء): اتحاد أعضاء ليست من نوع واحد، وخاصة في الزهرة، كاتحاد البَتَلَات بالأَسْدِيَة»"
          source: "المعجم الوسيط"
          conflict: "التعريف الوحيد في الوسيط يحصر الالتحام في المعنى البيولوجي (اتحاد أعضاء مختلفة)، وهو أخصّ من المعنى العام للمجموعة"

    - lemma: "تَلاصُق"
      confirm:
        - text: "ترجمة coherence في معجم المياه"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "ترجمة cohesion في معجم المياه"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
      contradicts:
        - text: "ترجمة adhesion في معاجم: الهندسة المدنية، الرياضيات، الفيزياء، الجيولوجيا، الزلازل"
          source: "ARABTERM — مصادر متعددة"
          conflict: "الدلالة الغالبة للتلاصق في المعاجم المتخصصة هي adhesion (التصاق سطحي خارجي بين مادتين مختلفتين)، لا cohesion (تماسك داخلي بين جزيئات المادة الواحدة)"
      expands:
        - text: "«اللَّامُ وَالصَّادُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مُلَازَمَةِ الشَّيْءِ لِلشَّيْءِ.»"
          source: "مقاييس اللغة — ابن فارس"
          addition: "الجذر يدلّ على الملازمة والالتصاق السطحي"

stage3_analysis:
  per_lemma:
    - lemma: "تَلاحُم"
      decision: confirmed
      decision_reason: >
        لمّة فصيحة مشتقة من جذر (ل ح م) على وزن تَفاعُل الدالّ على المشاركة والتداخل.
        أكّدتها معاجم متعددة (المورد الحديث، اللسانيات، المعلوماتية) بمعنى coherence/cohesion.
        ابن فارس ينصّ على أنّ الجذر يدلّ على «تداخلٍ»، وهو صميم معنى المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على جانب التداخل والاندماج العضوي بين الأجزاء (من صورة اللحم المتداخل)،
        ويُستعمل أكثر في السياقات المجازية والمعنوية (تلاحم اجتماعي، تلاحم برمجي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَلاحُم"

    - lemma: "تَماسُك"
      decision: confirmed
      decision_reason: >
        لمّة فصيحة من جذر (م س ك) على وزن تَفاعُل. ثبتت في المعجم الوسيط بتعريف صريح:
        «ترابط أجزاء الشيء حسّيًّا أو معنويًّا»، وهو مطابق تماماً لمعنى المجموعة.
        مستعملة في عشرات المعاجم المتخصصة ترجمةً لـ coherence و cohesion.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على جانب الإمساك والحبس (من أصل الجذر)، أي قوة الترابط التي تمنع التفكك.
        أوسع استعمالاً من «تلاحم» في الحقول العلمية (الفيزياء، الكيمياء، الجيولوجيا)
        وفي الاستعمال العام (التماسك النفسي، الاجتماعي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَماسُك"

    - lemma: "الْتِحام"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الوسيط يقصره على المعنى البيولوجي (اتحاد أعضاء مختلفة النوع).
        في المعاجم المتخصصة يُترجم غالباً بـ adherence/coalescence/cementation وهي
        معانٍ أخصّ تدلّ على الاندماج لا على حالة التماسك العامة. إضافته ستُدخل
        غموضاً دلالياً لأنه يميل إلى الحدث (المصدر الفعلي) لا إلى الحالة.

    - lemma: "تَلاصُق"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الغالبة في المعاجم المتخصصة هي adhesion (التصاق سطحي بين مادتين مختلفتين)،
        وهو مفهوم مغاير لـ cohesion (تماسك داخلي). ورد بمعنى coherence في معجم المياه فقط،
        لكنّ الاستعمال الأعمّ يجعله مرشحاً أضعف. ابن فارس يحصر الجذر في «ملازمة الشيء للشيء»
        وهو أقرب إلى الالتصاق السطحي منه إلى التماسك الداخلي.

