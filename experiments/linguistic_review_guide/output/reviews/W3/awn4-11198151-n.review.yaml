# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11198151-n  |  ILI: i96239
# الموضوع: مايكل أنجلو بوناروتي (1475-1564)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل، وهو إلزامي في AWN4"
      - "الصيغة «مايكل أنجلو» مشتقة من النطق الإنجليزي (Michael Angelo) لا من الأصل الإيطالي (Michelangelo)، وهي صيغة مُعرَّبة عبر الإنجليزية لا مباشرة من الإيطالية"
      - "اللمّة الأولى مختصرة (تفتقر إلى اسم العائلة)، والثانية كاملة — التمييز بينهما يحتاج توثيقاً"
      - "المجموعة تُصنَّف POS: n في WordNet، لكن مدخلاتها أسماء أعلام (proper_noun)؛ هذا مقبول باصطلاح WordNet لكن يستوجب تنبيهاً"
    observations: >
      هذه المجموعة خاصة بشخصية تاريخية بعينها وهي النحات والرسام والمعماري الإيطالي
      مِيكِيلَانْجِيلُو بُونَارُوتِي (1475-1564)، أحد أبرز عباقرة عصر النهضة الإيطالية.
      اللمّات من نوع أسماء الأعلام الأعجمية المُعرَّبة، لذا تنتفي إمكانية الاشتقاق
      والمجاز والتركيب الاصطلاحي؛ والتعريب (taarib) هو الأسلوب الوحيد الممكن.
      تُظهر الممارسة الإعلامية والأكاديمية العربية تداوُل صيغتين رئيسيتين:
      «مايكل أنجلو» (من الإنجليزية) و«ميكيلانجيلو» (من الإيطالية المباشرة).

  blind_candidates:
    - lemma: "مِيكِيلَانْجِيلُو"
      generation_method: taarib
      justification: >
        التعريب المباشر من الاسم الإيطالي الأصلي Michelangelo، وهو أدق
        صوتياً من الصيغة الإنجليزية. يُستخدم في كثير من المصادر الأكاديمية
        العربية المتخصصة في تاريخ الفن.
    - lemma: "مِيكِيلَانْجِيلُو بُونَارُوتِي"
      generation_method: taarib
      justification: >
        الاسم الكامل مُعرَّباً مباشرة من الإيطالية (Michelangelo Buonarroti)،
        يجمع الاسم الأول واسم العائلة، ضروري للسياقات الأكاديمية والموسوعية.
    - lemma: "مِيخَائِيلُ أَنْجِلُو"
      generation_method: taarib
      justification: >
        صيغة عربية تستعمل المقابل السامي-العربي لاسم Michele وهو «ميخائيل»،
        مع إبقاء «أنجلو» تعريباً للجزء الثاني Angelo. تجمع بين الإحساس العربي
        وقربها من الجذر السامي المشترك.
    - lemma: "مِيشِيلَانْجِلُو"
      generation_method: taarib
      justification: >
        صيغة تعريبية شائعة في بعض المصادر العربية تُقرِّب النطق الإيطالي
        بتحويل صوت (ke) إلى (she) وفق الميل الصوتي العربي لبعض المتحدثين،
        وإن كانت أقل دقة صوتياً من مِيكِيلَانْجِيلُو.


