# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى الموجودة ──
    - lemma: "مَايْكِلُ أَنْجِلُو"
      decision: confirmed
      decision_reason: >
        الصيغة المختصرة للاسم مُستقرَّة في الاستخدام الإعلامي والثقافي العربي
        الواسع، وإن كانت مستمَدة من الإنجليزية لا الإيطالية. تُمثّل الاسم
        المعروف به في المصادر العربية الجماهيرية. تحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      morphology_check: >
        اسم علم أعجمي مُعرَّب من صيغتين: مَايْكِل (= Michael الإنجليزية ← Michele الإيطالية
        ← ميخائيل العبرية) + أَنْجِلُو (= Angelo الإيطالية). لا جذر عربي. الوزن
        الصرفي لا ينطبق على الأسماء الأعجمية المُعرَّبة.
      loan_check:
        borrowing_type: تعريب صوتي عبر وسيط إنجليزي
        verdict: مقبول — الاستخدام مستقر ومتداول
      nuance_differentiation: >
        الصيغة المختصرة الشائعة في الاستخدام اليومي والإعلامي؛ يُكتفى بها في السياق
        العام دون الحاجة إلى اسم العائلة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَايْكِلُ أَنْجِلُو"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "مَايْكِلُ أَنْجِلُو بُونَارُوتِي"
      decision: confirmed
      decision_reason: >
        الاسم الكامل بصيغته المستقرة في المصادر العربية الأكاديمية والموسوعية؛
        يضيف اسم العائلة (بوناروتي) للتمييز الدقيق والتوثيق الرسمي.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      morphology_check: >
        اسم علم أعجمي مُعرَّب ثلاثي المكونات: مَايْكِل + أَنْجِلُو + بُونَارُوتِي
        (= Buonarroti الإيطالية). لا جذر عربي لأي مكوّن.
      loan_check:
        borrowing_type: تعريب صوتي عبر وسيط إنجليزي (للمكوّنين الأولين) وإيطالي مباشر (للمكوّن الثالث)
        verdict: مقبول — الاستخدام مستقر في السياقات الأكاديمية
      nuance_differentiation: >
        الاسم الكامل المستخدم في السياقات الأكاديمية والموسوعية والتوثيقية؛ يُميّزه
        عن الصيغة المختصرة باستيعابه اسم العائلة بوناروتي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَايْكِلُ أَنْجِلُو بُونَارُوتِي"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مِيكِيلَانْجِيلُو"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة أدق صوتياً من الإيطالية، لكن الصيغتين الموجودتين في AWN4
        (مايكل أنجلو / مايكل أنجلو بوناروتي) مستقرتان ومتداولتان بما يكفي.
        إضافة صيغة ثالثة تُشتِّت المرجعية دون إضافة دلالية فارقة. يمكن النظر
        فيها مستقبلاً كصيغة بديلة (add_form) إذا أثبت المعجم الأكاديمي رسوخها.
      evidence_assessment:
        case: no_material

    - lemma: "مِيكِيلَانْجِيلُو بُونَارُوتِي"
      source: stage1
      decision: removed
      decision_reason: >
        مماثل للمرشح السابق. الاسم الكامل موجود بالفعل في الصيغة (مايكل أنجلو
        بوناروتي)، ولا داعي لإضافة نسخة مكررة بتعريب مختلف.
      evidence_assessment:
        case: no_material

    - lemma: "مِيخَائِيلُ أَنْجِلُو"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «ميخائيل» هو المقابل العربي السامي لـ Michel/Michael، فإن هذه
        الصيغة غير مستقرة في الاستخدام العربي لهذه الشخصية تحديداً؛ بل قد
        تُوهم بالإشارة إلى أشخاص آخرين اسمهم ميخائيل أنجلو. لا تجتاز اختبار
        التثبيت المعجمي.
      evidence_assessment:
        case: no_material

    - lemma: "مِيشِيلَانْجِلُو"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة شاذة صوتياً لا تعكس لا الأصل الإيطالي ولا العربي المستقر؛ انعدام
        أدلة استخدامها في المصادر الموثوقة يجعلها مرفوضة.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "نحات ورسام ومعماري فلورنسي؛ أحد الشخصيات البارزة في عصر النهضة (1475-1564)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية، مقبول المضمون لكنه يفتقر إلى
        الأسلوب المعجمي الموسوعي العربي؛ كما أن وصف «فلورنسي» مجازيٌّ
        (وُلد في كابريزي قرب أريتسو لكنه ارتبط بفلورنسا وروما ارتباطاً وثيقاً).
        يُحسَّن بإضافة القومية الإيطالية صراحةً وتعديل البنية الإسنادية.
    authored:
      - type: encyclopedic
        text: >
          فَنَّانٌ إِيطَالِيٌّ جَمَعَ بَيْنَ النَّحْتِ وَالتَّصْوِيرِ وَالعِمَارَةِ (1475-1564)؛
          وَلِدَ فِي كَابْرِيزِي بِالتُّوسْكَانَا وَعَمِلَ فِي فِلُورَنْسَا وَرُومَا، وَيُعَدُّ
          مِنْ أَبْرَزِ عُبَقَرِيِّي عَصْرِ النَّهْضَةِ الإِيطَالِيَّةِ. مِنْ أَشْهَرِ أَعْمَالِهِ
          تِمْثَالُ دَاوُودَ، وَتِمْثَالُ مُوسَى، وَسَقْفُ كَنِيسَةِ السِّيسْتِينِ.
