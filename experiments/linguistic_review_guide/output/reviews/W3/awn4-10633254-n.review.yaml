# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10633254-n  |  ILI: i93083
# المفهوم: المزارع الصغير (a farmer on a small farm)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'مزارع صغير' تعبيرٌ وصفي حرّ (اسم + صفة) لا يحمل تشكيلاً كاملاً"
      - "اختبار السكّ: يمكن إبدال 'صغير' بـ'متوسط' أو 'كبير' وتبقى العبارة وصفاً صحيحاً، مما يُضعف وضعها كمصطلح مسكوك؛ غير أن تسجيلها في المورد الحديث يمنحها شرعية معجمية"
      - "المجموعة تحتوي لمّة واحدة فقط، والبحث عن بدائل مصطلحية راسخة أمر مستحسن"
      - "التعريف الحالي يبدأ بـ'مزارع' وهو الجذر ذاته في اللمّة، مما يُقرّبه من الدوران"
    observations: >
      المجموعة الترادفية تمثّل مفهوماً زراعياً مألوفاً في الثقافة العربية الريفية؛ وهو
      الفلاح الذي تقتصر زراعته على رقعة أرض صغيرة. اللمّة الحالية 'مزارع صغير' تركيبٌ
      وصفي (إضافي ناقص / نعتي) مألوف، ومسجَّل في المورد الحديث ترجمةً لـ"crofter".
      اللافت أن التراث العربي يزخر بمصطلح 'الأَكَّار' الذي طُبّق تاريخياً على المزارع
      المستأجِر لقطعة أرض، غير أنه لا يُقيّد الصِّغَر الصريح بل يدلّ على مطلق الحرّاث.
      المجموعة بحاجة إلى تشكيل اللمّة وتحرير تعريفها.

  blind_candidates:
    - lemma: "أَكَّار"
      generation_method: majaz
      justification: >
        لفظٌ عربي تراثي أصيل ورد في شعر الأخطل والمعاجم الكبرى (المعجم الوسيط: 'الحرّاث').
        يتضمّن دلالياً معنى المزارع المستأجِر الذي يفلح قطعة أرض لحساب غيره، وهو في الغالب
        صغير الحيازة. استُخدم أداةً للإزاحة الدلالية: من 'الحافر' (أصل الجذر أكر = الحفر)
        إلى 'من يحفر الأرض ويزرعها'. إحياء للفظ قديم بدلاً من التركيب الوصفي.
    - lemma: "صَغِيرُ الحِيَازَة"
      generation_method: tarkib
      justification: >
        مركب إضافي (idafi): صغير [مضاف] + الحيازة [مضاف إليه]، بمعنى 'من تصغر حيازته
        الزراعية'. 'الحيازة' مصطلح قانوني-زراعي راسخ للدلالة على الرقعة الأرضية التي
        يحوزها الشخص ويزرعها. يُوازي المصطلح الإنجليزي 'smallholder' توازياً مباشراً.
    - lemma: "حَرَّاث"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر ح-ر-ث على وزن فَعَّال (للمبالغة في الحرفة)، يدلّ على من يمارس
        الحراثة مهنةً. كثيراً ما ينصرف في الاستعمال إلى المزارع المعيشي البسيط الذي
        يحرث بيده على قطعة صغيرة، خلافاً للمزارع الآلي الكبير.
    - lemma: "مُزَارِعٌ هَامِشِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي (wasfi): مزارع + هامشي. 'الهامشي' يدلّ على من يعمل في الهامش الاقتصادي
        الزراعي، أي بموارد محدودة وإنتاج ضيّق. يُستخدم في الأدبيات الاقتصادية العربية
        للدلالة على صغار المزارعين ذوي الحيازات الدون-اقتصادية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  queries_run:
    - "Q1: مطابقة دفعية لجميع اللمّات (الموجودة + المرشحات + مصطلحات ذات صلة)"
    - "Q2: إثراء (تعريفات + أمثلة) للمداخل المكتشفة بالـ entry_id"
    - "Q3: جسر إنجليزي موسّع (small farmer / smallholder / crofter / peasant)"
    - "Q4: مقاييس اللغة لجذور أكر، حرث، زرع، فلح"
    - "Q5: جسر إنجليزي إضافي (smallholder / crofter / peasant) — أسفر عن entry_id 681107"
    - "Q6: مقاييس اللغة لجذري صغر وأكر"

  per_lemma:

    - lemma: "مُزَارِعٌ صَغِيرٌ"
      confirm:
        - text: "«المُزارع الصغير.»"
          source: "المورد الحديث (2008) — ترجمة كلمة crofter"
      expands:
        - text: "«(1) حقل صغير مُسَوَّر (2) مزرعة صغيرة (بر).»"
          source: "المورد الحديث (2008) — ترجمة كلمة croft"
          addition: "يُبيّن أن المفهوم الأصلي (croft) يعني مزرعة صغيرة أو حقلاً مسوَّراً، مما يُرسّخ الصِّلة الدلالية بين المزارع الصغير وهذا النوع من الأرض"

    - lemma: "أَكَّار"
      confirm:
        - text: "«(الأكار) الحراث (ج) أكرة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35)"
        - text: "«فلاح الحرّاث والزراع»"
          source: "المعجم الكبير — مجمع اللغة العربية"
        - text: "«الأُكْرَةُ حُفْرَةٌ تُحْفَرُ إِلَى جَنْبِ الْغَدِيرِ وَالْحَوْضِ، لِيَصْفُوَ فِيهَا الْمَاءُ; يُقَالُ: تَأَكَّرْتُ أُكْرَةً. وَبِذَلِكَ سُمِّيَ الْأَكَّارُ.»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«فلو غيرُ أَكَّارٍ قتلني!»"
          source: "المعجم الكبير — حديث قتل أبي جهل"
          addition: "يُشير إلى أن الأكار كان يُنظر إليه على أنه مزارع متواضع الشأن، مما يُقيّده ضمنياً بصغار الزرّاعين"
        - text: "«إنَّ الفوارس يعرفون ظهوركم / أولاد كلِّ مُقَبِّحٍ أكَّارِ»"
          source: "المعجم الكبير — الأخطل"
          addition: "استُعمل في السياق الشعري للدلالة على الانحدار الاجتماعي، مما يُلمح إلى أن الأكار كان يرمز إلى المزارع الصغير ذي المكانة المتواضعة"

    - lemma: "صَغِيرُ الحِيَازَة"
      evidence_status: "no_material_found"

    - lemma: "حَرَّاث"
      confirm:
        - text: "«من يحرث الأرض»"
          source: "المعجم الوسيط — مجمع اللغة العربية"
        - text: "«الزَّرَّاعُ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
      expands:
        - text: "«الْحَاءُ وَالرَّاءُ وَالثَّاءُ أَصْلَانِ مُتَفَاوِتَانِ: أَحَدُهُمَا الْجَمْعُ وَالْكَسْبُ، وَالْآخَرُ أَنْ يُهْزَلَ الشَّيْءُ. فَالْأَوَّلُ الْحَرْثُ، وَهُوَ الْكَسْبُ وَالْجَمْعُ... وَمِنْ هَذَا الْبَابِ حَرْثُ الزَّرْعِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر حرث يدلّ على الكسب والجمع ثم على إثارة الأرض، وهو وصف لمن يفلح الأرض بشكل عام دون تقييد بالحجم"

    - lemma: "مُزَارِعٌ هَامِشِيٌّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مزارع صغير"
      decision: confirmed
      decision_reason: >
        اللمّة مسجَّلة في المورد الحديث (2008) ترجمةً لكلمة 'crofter' (المزارع الصغير)،
        مما يُثبت لها شرعية معجمية حديثة. وإن كانت تركيباً وصفياً حرّاً من الناحية
        الصرفية، فإن اعتمادها في مصدر معجمي موثوق يُضفي عليها طابع الوحدة المعجمية
        الثابتة في سياقها. يُطلب تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ لا مقارنة داخلية مطلوبة. تتميّز عن المصطلح الأشمل
        'فلاح' أو 'مزارع' بقيد الصِّغَر الصريح (صغير الحيازة أو المساحة المزروعة).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُزَارِعٌ صَغِيرٌ"

    - lemma: "أَكَّار"
      source: stage1
      decision: removed
      decision_reason: >
        الأَكَّار لفظٌ تراثي موثَّق ومعناه 'الحراث/الزراع' بوجه عام، دون أن يُقيّد
        الصِّغَر صراحةً. هو أقرب في الدلالة إلى المجموعة الأم (فلاح/مزارع — awn4-10098586-n)
        منه إلى هذه المجموعة المتخصصة بالمزارع الصغير. إضافته هنا قد تُسبّب تداخلاً
        مع المستوى الأعلى في التسلسل الهرمي الدلالي.

    - lemma: "صَغِيرُ الحِيَازَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا يوجد توثيق معجمي للمركب كوحدة معجمية ثابتة. وإن كان التعبير شائعاً في
        الأدبيات الزراعية الاقتصادية، فإنه يفتقر إلى التسجيل المعجمي الذي يُضفي عليه
        صفة اللمّة القابلة للإدراج. يمكن إعادة النظر فيه مستقبلاً إذا تطور استعماله.

    - lemma: "حَرَّاث"
      source: stage1
      decision: removed
      decision_reason: >
        الحَرَّاث يعني 'من يحرث الأرض' بإطلاق، وهو مرادف لـ'فلاح/مزارع' دون تقييد
        بصِغَر المساحة. يُسبّب وضعه في هذه المجموعة توسيعاً غير مبرر في الشبكة الدلالية
        والخلط مع الأبناء الآخرين للمجموعة الأم. مرفوض.

    - lemma: "مُزَارِعٌ هَامِشِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        'الهامشي' يحمل حمولة دلالية اقتصادية-اجتماعية (الهشاشة والفقر) لا تنحصر في
        صِغَر المساحة بل قد تتعلق بضعف الاندماج في السوق أو الفقر. المعنى أوسع وأقل
        دقة من 'مزارع صغير'. لا أدلة معجمية تدعمه. مرفوض.


