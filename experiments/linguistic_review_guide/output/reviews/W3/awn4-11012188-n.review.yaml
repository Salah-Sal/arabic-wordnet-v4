# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان خاليتان من التشكيل الكامل المطلوب في AWN4."
      - "هذه المجموعة اسم علم (proper noun) لشخص تاريخي أمريكي، وجميع المرشحات المحتملة لا تعدو كونها اختلافات في التعريب الصوتي لاسم أجنبي، مما يُضيّق هامش التوليد المعجمي."
      - "التعريف الحالي 'لأول مدفع سريع الطلقات' قد يُفهم منه أن غاتلينغ هو المخترع المطلق الأول، وهو تدقيق تاريخي يستحق مراجعة الصياغة."
      - "لا يوجد تعريف موسوعي بالعربية يرقى إلى مستوى المعجم الشامل للأعلام."
    observations: >
      المجموعة الترادفية تمثّل اسم علم لشخص تاريخي (مخترع أمريكي من القرن التاسع عشر)، وهو ريتشارد
      جوردان غاتلينغ (1818-1903)، صاحب مدفع غاتلينغ الدوّار متعدد الأسطوانات. طبيعة الأعلام
      الأجنبية تجعل التوليد المعجمي العربي مقيّداً بالتعريب الصوتي (التعريب) لا بالاشتقاق أو
      المجاز. اللمّتان الراهنتان صحيحتان من حيث المرجع، غير أنهما تفتقران إلى التشكيل. التعريف
      يستحق توسيعاً موسوعياً يذكر السياق التاريخي للاختراع.

  blind_candidates:
    # ── توليد عمياء من التعريف المقنّع فقط:
    # "مخترع أمريكي لأول مدفع سريع الطلقات (1818-1903)"
    # المفهوم: اسم علم لمخترع، أمريكي، القرن التاسع عشر، مدفع سريع الطلقات.
    # منهجية: لمّا كان المفهوم اسم علم أجنبي، فالتعريب (الملاذ الأخير) هو الأنسب هنا.
    - lemma: "غَاتْلِينْغ"
      generation_method: taarib
      justification: >
        التعريب الصوتي الأقرب للنطق الإنجليزي "Gatling" باستخدام الغين للـG والطاء للـT
        واللام والياء والنون والغين للطرف، وهو الشكل الأكثر تداولاً في المصادر العربية المعاصرة.
    - lemma: "رِيتْشَارْد جُورْدَان غَاتْلِينْغ"
      generation_method: taarib
      justification: >
        الاسم الكامل للمخترع معرَّباً: "Richard Jordan Gatling"، إذ يقتضي توثيق الأعلام التاريخية
        ذكر الاسم الكامل ضماناً للتمييز والضبط الموسوعي.
    - lemma: "غَاتْلِينْج"
      generation_method: taarib
      justification: >
        بديل تعريبي يُبدل الغين النهائية بالجيم المعجمة (j)، وهو شائع في بعض المصادر العربية
        تبعاً للاتفاقيات الصوتية المختلفة للحرف G في الموقع الأخير.
    - lemma: "رِيتْشَارْد غَاتْلِينْغ"
      generation_method: taarib
      justification: >
        صيغة مختصرة تجمع الاسم الأول والاسم الأخير دون الاسم الأوسط (Jordan)، كثيراً ما
        تُستخدم في المصادر الأكاديمية وكتب تاريخ العلوم والتقنية العربية.


