# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١: الاسم الكامل ──
    - lemma: "ريتشارد جوردان غاتلينغ"
      decision: confirmed
      decision_reason: >
        هذا هو الاسم الكامل الموثَّق تاريخياً للمخترع الأمريكي Richard Jordan Gatling (1818-1903).
        التعريب المعتمد صحيح صوتياً ومقبول في المصادر العربية. تأكيد اللمّة مع إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
        mwe_note: >
          الاسم مركب من ثلاثة مكوّنات: اسم أول (ريتشارد) + اسم أوسط (جوردان) + لقب (غاتلينغ).
          هذه وحدة معجمية ثابتة كاسم العلم للشخص التاريخي؛ اختبار السكّ: لا يمكن إبدال
          أيٍّ من مكوّناته بمرادف ← تعبير اصطلاحي ثابت.
      nuance_differentiation: >
        الاسم الكامل الرسمي للمخترع، يُستخدم في السياقات الموسوعية والتوثيقية والتاريخية حيث
        يُشترط التمييز الكامل عن غيره، ويضم الاسم الأوسط (Jordan) تمييزاً للشخصية التاريخية.
      loan_check:
        type: taarib
        status: "معرَّب مقبول — اسم علم أجنبي، التعريب الصوتي هو الطريقة الوحيدة الممكنة."
        phonological_fidelity: "جيدة — الغين لـG، الشين لـsh، الراء لـr، وهكذا."
      morphological_fit: >
        اسم علم مفرد خاص. لا يخضع للأوزان الصرفية العربية. مقبول قبول التزام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِيتْشَارْد جُورْدَان غَاتْلِينْغ"

    # ── اللمّة الموجودة ٢: اللقب فقط ──
    - lemma: "غاتلينغ"
      decision: confirmed
      decision_reason: >
        اللقب (surname) وحده هو الشكل المختصر الشائع في المصادر العربية للإشارة إلى هذا المخترع.
        يُستخدم أيضاً بوصفه اسماً نسبياً لمدفع غاتلينغ (Gatling gun). التشكيل يحتاج إضافة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صيغة مختصرة للإشارة إلى الشخص بلقبه فقط، شائعة في السياقات غير الرسمية والتقنية
        (كـ"مدفع غاتلينغ") في مقابل الاسم الكامل المخصص للتوثيق الموسوعي.
      loan_check:
        type: taarib
        status: "معرَّب مقبول — تعريب صوتي لـ Gatling."
      morphological_fit: >
        اسم علم مفرد. يقبل لام التعريف في السياقات التركيبية (مدفع غاتلينغ). مقبول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَاتْلِينْغ"

    # ── مرشحات المرحلة ١: جميعها مرفوضة لوجود مرادفات موثَّقة أفضل ──
    - lemma: "غَاتْلِينْج"
      source: stage1
