        التعريب بالجيم (غاتلينج) أقل شيوعاً من الغين (غاتلينغ) في المصادر العربية المعتمدة.
        الغين تُعبّر عن الصوت الإنجليزي G في نهاية الكلمة أدقّ من الجيم. لا داعي لتعدّد
        التعريبات في مجموعة واحدة.

    - lemma: "رِيتْشَارْد غَاتْلِينْغ"
      source: stage1
