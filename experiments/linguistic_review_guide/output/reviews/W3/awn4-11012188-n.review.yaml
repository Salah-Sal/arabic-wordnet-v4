      decision_reason: >
        صيغة الاسم الثنائي (بدون جوردان) غير موثَّقة في المصادر الرئيسية وقد تُلبَّس بأشخاص
        آخرين يحملون الاسم ذاته. الأفضل الاقتصار على الاسم الثلاثي الكامل للتوثيق
        والاسم الأخير المفرد للاستخدام المختصر، دون صيغة وسطى.

