stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة هِبِّي تعريبٌ مباشر، وتفتقر إلى ياء النسبة المشددة (هِبِّيّ) الواردة في المورد الحديث."
      - "المجموعة تعاني من ضعف التمثيل: المقابلات الإنجليزية hippie وhippy وhipster وflower child لا تجد إلا لمّة عربية واحدة."
      - "المصطلح الإنجليزي hipster في المجموعة يُراد به المعنى الستيني (= hippie)، لا المعنى المعاصر (موضة حضرية)؛ وهذا التمييز غائب في التعريف العربي."
      - "التعريف الحالي يستخدم «الليبرالية المتطرفة» وقد يوحي بالتطرف السياسي العنيف بدلاً من الانطلاق الاجتماعي السلمي المقصود."
    observations: >
      المجموعة تصف ظاهرة ثقافية غربية بامتياز (حركة الهيبيين في ستينيات القرن العشرين)، وهي
      غريبة إلى حدٍّ ما عن الوعي الثقافي العربي التقليدي. التعريب المباشر «هِبِّيّ» هو الحل
      المعجمي الأوفق لهذه الفئة من المصطلحات ذات الصيغة العالمية. الجذر العربي ه-ب-ب (هَبَّ
      = هبوب الريح والانتباه والحركة) لا يمتّ بصلة دلالية للمفهوم؛ إذ إن «هِبِّيّ» استعارة
      صوتية لا اشتقاق عربي. يُلاحَظ أيضاً وجود تعارض صوري بين «هِبِّيّ» المعرَّبة وبين
      «الهَبِيُّ» الفصيحة (الصبي الصغير) في قاموس الوسيط، وإن كانا متمايزَين نطقاً ودلالةً.
  blind_candidates:
    - lemma: "الصَّعْلُوكُ"
      generation_method: majaz
      justification: >
        إزاحة دلالية لفظٍ عربي قديم؛ الصعاليك العرب كانوا ينبذون الانتماء القبلي وينفردون
        بنمط حياة متمرد خارج المنظومة الاجتماعية السائدة. المشابهة الوظيفية مع الهيبي في
        رفض الإطار الثقافي/الاجتماعي القائم.
    - lemma: "مُتَحَلِّلٌ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «تحلَّل» على وزن مُتَفَعِّل، من جذر ح-ل-ل؛ يدل على من يتخلى عن القيود
        الاجتماعية والأخلاقية السائدة ويتحرر منها. الوزن مُتَفَعِّل يناسب دلالة التكلف
        والتصنع في الانعتاق من المنظومة القائمة.
    - lemma: "وَلَدُ الزَّهْرَةِ"
      generation_method: tarkib
      justification: >
        مركب إضافي يقابل المصطلح الإنجليزي «flower child» الوارد في المجموعة. الزهرة رمز
        للسلام والحب المُفترَض في أيديولوجية الهيبيين. الأسلوب: الإضافي (idafi).
    - lemma: "هِيبِسْتَر"
      generation_method: taarib
      justification: >
        تعريب للفظ «hipster» الإنجليزي الوارد في المجموعة بمعنى الهيبي الستيني. تحمل
        التاء المربوطة المقترحة حرف ال- وتقبل الجمع السالم (هِيبِسْتَرون) والنسبة
        (هِيبِسْتَرِيّ). تُستخدم ملاذاً أخيراً بعد استنفاد البدائل العربية.


stage2_evidence:

  per_lemma:
    # ────────────────────────────────────────────────────
    # اللمّة الموجودة
    # ────────────────────────────────────────────────────
    - lemma: "هِبِّي"
      confirm:
        - text: "«الهِبِّيّ؛ الخُنفوس.» [ترجمة: hippie]"
          source: "المورد الحديث (2008) — المورد العربي الإنجليزي"
      contradicts:
        - text: "«الهَبِيُّ: الصبيُّ الصغير»"
          source: "المعجم الوسيط"
          conflict: >
            الصورة الصوتية المُنعَّرة «هبي» متطابقة مع مدخل الوسيط الفصيح للطفل الصغير،
            مما يُحدث تعارضاً صُوَرياً رغم التمايز النطقي والمعجمي.
        - text: "«الهَبَيُّ: الصَّبِي الصَّغِير، والأنثى هَبَيَّةٌ، حَكَاهُمَا سِيبَوَيْهٍ»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          conflict: >
            جذر هـ-ب-ي في التراث العربي محصور بمعنى الطفولة والصغر، وهو مغاير تماماً
            للمدلول الحديث المعرَّب.
      expands:
        - text: "«طراز الهيبي» [translation: hippie look] و«عودة نمط الهيبي» [translation: hippie revival]"
          source: "مسرد صناعة النسيج — المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
          addition: >
            الشكل «الهيبي» (بدون شدة على الباء) وارد في السياق المصطلحي العربي الحديث بوصفه
            صفة (hippy look) ضمن معجم النسيج، مما يُثبت استعمال الصورتين في العربية المعاصرة.

    # ────────────────────────────────────────────────────
    # مرشحات المرحلة ١
    # ────────────────────────────────────────────────────
    - lemma: "الصَّعْلُوكُ"
      contradicts:
        - text: "«الصُّعْلُوكُ الفقيرُ الذي لا مال له ولا اعتماد»"
          source: "المعجم الكبير"
          conflict: >
            المعنى الجوهري للصعلوك هو انعدام المال لا رفض الثقافة؛ الاستعمال في الهيبيين
            مجاز بعيد لا يُدعم بدلالة أصلية.
        - text: "«الصُّعْلُوكُ الذي لا مالَ له، وجَمْعُه صَعَالِيْكُ»"
          source: "المحيط في اللغة للصاحب بن عباد"
          conflict: "الدلالة محصورة في الفقر المادي."
        - text: "«الصَّعْلُوك الفقير (ج) صعاليك وصعاليك العرب فتاكها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (الهوراماني)"
          conflict: >
            إضافة «فتاكها» تُحمّل اللفظ دلالة العنف والإفساد، وهو بعيد عن دلالة الهيبي
            الذي يدعو للسلام.

    - lemma: "مُتَحَلِّلٌ"
      evidence_status: "no_material_found"

    - lemma: "وَلَدُ الزَّهْرَةِ"
      evidence_status: "no_material_found"

    - lemma: "هِيبِسْتَر"
      evidence_status: "no_material_found"


stage3_analysis:

  per_lemma:
    # ────────────────────────────────────────────────────
    # اللمّة الموجودة
    # ────────────────────────────────────────────────────
    - lemma: "هِبِّي"
      decision: confirmed
      decision_reason: >
        المورد الحديث يُثبت أن «هِبِّيّ» هو المقابل العربي المعتمد لـ hippie. الشكل الوارد
        في AWN4 «هِبِّي» يحتاج إلى تصحيح التشكيل ليصبح «هِبِّيّ» مع ياء النسبة المشددة
        وفق ما أثبته المورد. كذلك يمكن إضافة الصورة البديلة «هَيبِي» المستعملة في معجم النسيج
        (ARABTERM). لا يؤثر التعارض الصوري مع «الهَبِيُّ» الفصيحة في قبول المعرَّب لتمايزهما
        نطقياً (هِبِّيّ vs. هَبِيّ). اللفظة تجتاز بوابة الجودة المصطلحية بوصفها تعريباً
        وظيفياً لمصطلح ذي صيغة عالمية استنفدت فيه البدائل العربية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تغطي مفهوم الهيبي بمجمله بوصفه شخصاً يرفض
        المنظومة الثقافية السائدة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِبِّيّ"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "هَيبِي"

    # ────────────────────────────────────────────────────
    # مرشحات المرحلة ١
    # ────────────────────────────────────────────────────
    - lemma: "الصَّعْلُوكُ"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الجوهرية للصعلوك في جميع المعاجم هي «الفقير عديم المال» وليس «رافض الثقافة».
        الانتقال الدلالي إلى معنى الهيبي بعيد ولا يُسنده أي نص معجمي. فضلاً عن ذلك،
        دلالة الإفساد والفتك («صعاليك العرب فتاكها») تتعارض مع صورة الهيبي السلمي.

    - lemma: "مُتَحَلِّلٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي دليل معجمي في قاعدة البيانات. اللفظ عام الدلالة ويرتبط في الاستعمال
        الحديث بالانحلال الأخلاقي أو التحلل الكيميائي أكثر من ارتباطه برفض الثقافة. فشل
        اختبار التخصيص: «مُتَحَلِّل» يمكن أن يصف أي شخص منحل لا الهيبي تحديداً.

    - lemma: "وَلَدُ الزَّهْرَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية تُثبت التثبيت المعجمي لهذا المركب في العربية. فشل اختبار السكّ:
        يمكن إبدال «وَلَد» بـ «طِفْل» أو «فَتى» وتبقى العبارة صالحة كوصف، مما يدل على
        أنها عبارة وصفية حرة لا مصطلح ثابت. غياب التوثيق المعجمي يمنع إضافتها.

    - lemma: "هِيبِسْتَر"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على تثبيت معجمي في قاعدة البيانات. «hipster» في الاستعمال العربي الحديث
        ارتبط بالمعنى المعاصر (موضة حضرية بعد ألفين) أكثر من المعنى الستيني (= hippie)،
        مما يُحدث التباساً دلالياً. التعريب الأنسب للمعنى الستيني هو «هِبِّيّ» المتاح أصلاً.


stage4_content:

  definition:
