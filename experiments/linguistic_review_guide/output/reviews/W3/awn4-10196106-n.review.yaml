        text: >
          عضو في حركة ثقافية ظهرت في الولايات المتحدة وأوروبا في ستينيات القرن العشرين،
          تميّزت بنبذ القيم الاجتماعية البورجوازية والأعراف التقليدية، والمناداة بالسلام
          ومقاومة الحرب وحرية الحب، واعتماد أسلوب حياة مغاير يُعبَّر عنه بالزي والموسيقى
          والفن
