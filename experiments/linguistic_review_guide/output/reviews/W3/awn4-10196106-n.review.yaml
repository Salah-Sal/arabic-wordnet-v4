    assessment:
      decision: revise
      reason: >
        «الليبرالية المتطرفة» يوحي بالتطرف السياسي العنيف في الذهنية العربية، في حين أن
        المفهوم يُشير إلى الانطلاق الاجتماعي السلمي ورفض القيود المؤسسية. كما يفتقر
        التعريف الحالي إلى التأطير الزمني والثقافي للحركة (الستينيات الأمريكية). أسلوب
        التعريف بالترجمة الحرفية للإنجليزية يُضعف الصياغة المعجمية.
    authored:
      - type: terminological
        text: >
          شخصٌ ينتسب إلى التيار الثقافي الرافض للمنظومة الاجتماعية السائدة، الداعي إلى
          الحرية الفردية المطلقة في السلوك والسياسة ونمط العيش
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
