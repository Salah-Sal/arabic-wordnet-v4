# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14000354-n
# schemozzle / shemozzle — (Yiddish) a confused situation; a mess
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "علامة «(يديشية)» في التعريف العربي أثر ترجمي لا علاقة له بالعربية؛ إنما تصف أصل الكلمة الإنجليزية schemozzle"
      - "لفظ «فوضى» في التعريف يُحدث دوراناً إذا كان لمّة في المجموعة ذاتها"
      - "اللمّتان الموجودتان (فوضى، ورطة) عامّتان جداً ولا تختصّان بالمعنى الدقيق للمجموعة (موقف مربك مختلط)"
    observations: >
      المجموعة تقابل كلمة إنجليزية عامية من أصل يديشي (schemozzle) تعني موقفاً فوضوياً
      مربكاً. في العربية لا يوجد مقابل دقيق واحد، لكنّ ثمة ألفاظاً تراثية تغطي أبعاد
      المعنى: الاضطراب، والارتباك، والتورّط في أمر لا مخلص منه. اللمّتان الحاليتان
      تغطيان بُعدَيِ الفوضى (disorder) والمأزق (predicament) على التوالي.
  blind_candidates:
    - lemma: "هَرْج"
      generation_method: majaz
      justification: >
        من الجذر (هـ ر ج)، أصله الفتنة والاختلاط والقتل، ثم توسّع في الحديث النبوي
        «يكثر الهرج» ليدلّ على الاضطراب والفوضى العامة. إحياء هذا اللفظ بمعنى
        الموقف المضطرب المختلط يناسب دلالة المجموعة.
    - lemma: "مَأْزِق"
      generation_method: ishtiqaq
      justification: >
        من الجذر (أ ز ق) على وزن مَفْعِل، يدلّ على المضيق الحرج الذي يصعب
        الخروج منه. يغطي بُعد الحرج والضيق في الموقف المربك.
    - lemma: "تَخَبُّط"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفَعُّل من الجذر (خ ب ط)، يدلّ على التصرف بلا هدى
        والسير في الظلام، ثم توسّع ليعني حالة الاضطراب الذهني والتشوّش في الأمور.
    - lemma: "وَرْطَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر (و ر ط)، أصلها أرض منخفضة لا طريق فيها، ثم توسّع المعنى
        ليدلّ على كل أمر تعسر النجاة منه. يغطي بُعد الوقوع في موقف صعب مربك.

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "فَوْضَى"
      confirm:
        - text: "«قومٌ فوضى: ليس لهم رئيسٌ. يقال: مالهم ومتاعُهم فوضى بينهم: إذا كانوا شُركاءَ فيه يتصرَّف كلٌّ منهم في جميعه بلا نكير»"
          source: "المعجم الوسيط"
        - text: "«حالة من سيادة اللاقانون في المجتمع»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«الفاء والواو والضاد أصل صحيح يدل على اتكال في الأمر على آخر وردّه عليه... ومن ذلك قولهم: باتوا فوضى، أي مختلطين، ومعناه أنّ كلّاً فوّض أمره إلى الآخر»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدلّ على التفويض والاختلاط لا على الاضطراب بذاته، والدلالة على الفوضى متولّدة من غياب القيادة"
        - text: "«كلمة فوضى منتهية بألف التأنيث المقصورة؛ ولذا فهي ممنوعة من الصرف»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "ضبط صرفي: ممنوعة من الصرف"

    - lemma: "وَرْطَة"
      confirm:
        - text: "«اسم المرّة. أرضٌ منخفضة لا طريق فيها. الهُوّة الغامضة العميقة في الأرض. الوحل. كل أمرٍ تعسر النجاة منه. الهلكة»"
          source: "المعجم الوسيط"
        - text: "«الورطة: كلّ غامض، والهلكة، وكلّ أمر تعسر النجاة منه، والوحل، والردغة تقع فيها الغنم فلا تتخلّص، وأرض مطمئنّة لا طريق فيها»"
          source: "القاموس المحيط للفيروزآبادي"
      expands:
        - text: "«الواو والراء والطاء: كلمة تدلّ على شيء كالبليّة والوقوع فيما لا مخلص منه. وتورّط في البليّة. وأصله الورطة من الأرض، وهي التي لا طريق فيها»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل حسّي (أرض لا طريق فيها) ثم توسّع إلى كل بليّة لا مخلص منها"
        - text: "«الورطة: بسكون الراء ما ضاق»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف مختصر يركّز على بُعد الضيق"

    - lemma: "هَرْج"
      evidence_status: "no_material_found"

    - lemma: "مَأْزِق"
      confirm:
        - text: "«المَضِيق الحَرِج»"
          source: "المعجم الوسيط"
        - text: "«المضيقُ، ومنه موضع الحرب»"
          source: "المعجم الكبير"
      expands:
        - text: "«الهمزة والزاء والقاف قياس واحد وأصل واحد، وهو الضيق. قال الخليل وغيره: الأزق الضيق في الحرب، وكذلك يدعى مكان الوغى المأزق»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي مرتبط بالضيق في الحرب تحديداً"

    - lemma: "تَخَبُّط"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي ─────────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "فَوْضَى"
      decision: confirmed
      decision_reason: >
        لفظ عربي فصيح أصيل من الجذر (ف و ض)، مثبت في المعاجم الكلاسيكية والحديثة
        بدلالة الاختلاط وغياب النظام. يغطي البُعد الدلالي «الفوضى والتشوّش» في المجموعة.
        وإن كان عاماً فهو أنسب لفظ مفرد متاح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تدلّ على حالة انعدام النظام والاختلاط العام، دون تضمّن معنى
        صعوبة الخلاص أو الوقوع في مأزق. أقرب إلى disorder/chaos.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَوْضَى"

    - lemma: "وَرْطَة"
      decision: confirmed
      decision_reason: >
        لفظ عربي فصيح أصيل من الجذر (و ر ط)، مثبت في أمهات المعاجم بدلالة
        «كل أمر تعسر النجاة منه». يغطي البُعد الدلالي «الموقف المربك» (mess/predicament)
        في المجموعة. أصله الحسّي (أرض منخفضة لا طريق فيها) يعزّز معنى الوقوع في
        وضع مربك يصعب التخلّص منه.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تدلّ على الوقوع في موقف صعب يعسر التخلّص منه، مع تضمّن معنى
        الحرج والبليّة. أقرب إلى predicament/mess. تختلف عن «فوضى» بتركيزها
        على صعوبة المخرج لا على انعدام النظام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَرْطَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "هَرْج"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُعثر على أدلة معجمية كافية تثبت استعمال «هَرْج» بمعنى الموقف المربك
        المحدّد. دلالته الأصلية تتّجه إلى الفتنة والقتل والاضطراب العنيف، وهو أشدّ
        وأعنف من المعنى المطلوب (موقف فوضوي مربك). كما أنّ استعماله المعاصر
        محدود في هذه الدلالة.
      evidence_assessment:
        case: no_material

    - lemma: "مَأْزِق"
      source: stage1
      decision: removed
      decision_reason: >
        دلالة «مأزق» مركّزة على الضيق والحرج (المضيق في الحرب) أكثر من
        الاضطراب والتشوّش. تتداخل دلالياً مع «ورطة» دون أن تضيف بُعد الفوضى
        والاختلاط. إضافتها ستكون تكراراً لدلالة «ورطة» دون إثراء حقيقي.
      evidence_assessment:
        case: mixed

    - lemma: "تَخَبُّط"
      source: stage1
      decision: removed
      decision_reason: >
        مصدر يدلّ على الفعل (التصرّف بلا هدى) لا على الحالة أو الموقف.
        المجموعة تصف حالة/موقفاً (situation/affair) لا فعلاً أو عملية.
        كما أنّه لم تُعثر على أدلة معجمية تثبت استعماله بمعنى «الموقف المربك».
      evidence_assessment:
        case: no_material

    - lemma: "وَرْطَة"
      source: stage1
      decision: removed
      decision_reason: >
        مرشّح مكرّر — اللمّة موجودة أصلاً في المجموعة.

# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "(يديشية) موقف أو شأن مربك؛ فوضى"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يعاني من ثلاث مشكلات: (١) علامة «(يديشية)» أثر ترجمي يصف
        أصل الكلمة الإنجليزية لا العربية، (٢) ترجمة حرفية للتعريف الإنجليزي لا تأليف
        معجمي عربي، (٣) ورود لفظ «فوضى» في التعريف يُحدث دوراناً مع اللمّة.
    authored:
      - type: terminological
        text: "حالٌ من الاضطراب والاختلاط في الأمور يعسر معها التدبير والتصرّف"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "اختلاطٌ في الأمور وتشوّش يصعب معه المخرج"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالٌ من الاضطراب والاختلاط في الأمور يعسر معها التدبير والتصرّف"

  examples:
    per_lemma:
      - lemma: "فَوْضَى"
        examples:
          - text: "عمّت الفوضى أرجاءَ المؤسسة بعد استقالة المدير المفاجئة وغياب أيّ خطة بديلة."
            type: usage
      - lemma: "وَرْطَة"
        examples:
          - text: "وجد الفريق نفسه في ورطة حقيقية حين تعطّلت أنظمة الاتصال قبيل الموعد النهائي."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "عمّت الفوضى أرجاءَ المؤسسة بعد استقالة المدير المفاجئة وغياب أيّ خطة بديلة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وجد الفريق نفسه في ورطة حقيقية حين تعطّلت أنظمة الاتصال قبيل الموعد النهائي."

