# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يحتوي على مصطلح إنجليزي '(Pool)' بين قوسين داخل نص عربي — يجب حذفه أو استبداله بمقابله العربي"
      - "التعريف شبه دائري: 'شخص يلعب البلياردو' يكاد يُعيد صياغة اللمّة 'لاعب بلياردو' بدلاً من أن يُفصّل الفصل النوعي"
      - "اللمّة الوحيدة 'لاعب بلياردو' غير مُشكَّلة — التشكيل الكامل إلزامي"
      - "المجموعة تُمثّل 'pool player' بمعنى لاعب بليارد الجيب تحديداً (pocket billiards)، لا البلياردو العام، لكن التعريف لا يُميّز بين النوعين"
    observations: >
      المجموعة تصف مُمارِس رياضة البِلْيارْدُو؛ وهي لعبةٌ غربية المنشأ دخلت
      الثقافة العربية الحديثة دون أن تُنتج مصطلحاً عربياً أصيلاً مخصَّصاً
      للممارِس. الوزن الصرفي الطبيعي لوصف مُمارِس الرياضة في العربية هو
      فاعل (لاعب) أو اسم النسبة (بلياردي). اللمّة المُدرجة «لاعب بلياردو»
      صحيحة نحوياً وشائعة استعمالاً، غير أن التعريف يحتاج إلى تنقيح وإزالة
      الشوائب الإنجليزية.

  blind_candidates:
    - lemma: "بِلْيَارْدِيٌّ"
      generation_method: taarib
      justification: >
        اسم نسبة مُشتَقّ من «بِلْيَارْد» (التعريب الفرنسي للمصطلح)
        بإضافة ياء النسبة، فيحصل وزن فعلاني دال على الانتساب. يتبع النمط
        العربي الإنتاجي في تسمية مُمارِسي الرياضات: كَرَوِيّ، يَدَوِيّ،
        طائِرِيّ. يقبل التأنيث والتثنية والجمع السالم بلا إشكال صرفي.
    - lemma: "مُدَحْرِجُ الْكُرَاتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: اسم فاعل «مُدَحْرِج» من الجذر د-ح-ر-ج الدال على
        التدحرُج والدَّفع، مضافٌ إلى «الكُرات». يصف الحركة الجوهرية في
        البلياردو (دحرجة الكرات على المائدة بالعصا). يتجنَّب تكرار «لعب»
        و«بلياردو» الواردتين في التعريف.
    - lemma: "مُسَدِّدُ الْكُرَاتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: اسم فاعل «مُسَدِّد» من الجذر س-د-د الدال على
        الإصابة والتوجيه الدقيق، مضافٌ إلى «الكُرات». يُركّز على مهارة
        التصويب التي هي جوهر لعب البلياردو والبول. مُستخدَم في وصف
        اللاعبين الماهرين في الرياضات الدقيقة.
    - lemma: "مُقَارِعُ الْكُرَاتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: اسم فاعل «مُقارِع» من الجذر ق-ر-ع الدال على
        الضرب والنقر، مضافٌ إلى «الكُرات». يعكس الفعل الميكانيكي الأساسي
        في البلياردو: قرع الكُرة بالعصا. إزاحة دلالية من المعنى الحربي
        إلى السياق الرياضي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١) مطابقة دقيقة دفعية: بلياردو، بلياردي، لاعب بلياردو، لاعب البلياردو، بليار، لاعب بليار...
# ٢) إثراء بالمعرّف (definitions + examples) لـ entry_ids: 857103، 673768، 673769، 709100
# ٣) جسر إنجليزي: pool player، billiard player، billiards player، pool، billiards، billiard
# ٤) بحث FTS عربي: بلياردو، بليارد، البلياردو، البليارد، كرة المائدة
# ٥) مقاييس اللغة (dictionary_id=151): جذر لعب
stage2_evidence:
  per_lemma:
    - lemma: "لاعب بلياردو"
      expands:
        - text: >
            «بِلياردو [مفرد]: (رض) لُعبة تُعرف بكُرة المائدة، تُلعَب
            بِكُراتٍ عاجيَّة تُدحرج بعصًا على مائدة مستطيلة الشَّكل ذات
            جيوب، مفروشة بقُماش صوفيّ أخضر ولها إطار لُفَّ عليه مطاط.»
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: >
            يؤكد «بِلياردو» مصطلحاً عربياً معجمياً للعبة، وهو المكوّن
            الثاني في اللمّة المركبة «لاعب بلياردو».
        - text: >
            «بِلْيارْد الجَيْب: ضربٌ من لعِب البليارد تتميَّز مائدته بجيوب
            يسعى اللاعبون إلى إسقاط الكُرات فيها.»
          source: "المورد الحديث (2008)"
          addition: >
            يُثبت أن المقابل العربي لـ «pool» (بما هو لعبة محددة) هو
            «بليارد الجيب»، مما يُوضح الفصل النوعي للمجموعة.

    - lemma: "بِلْيَارْدِيٌّ"
      confirm:
        - text: >
            «(1) بِلْيارْديّ
            (2) إصابة [في البليارد].»
          source: "المورد الحديث (2008) — ترجمة مصطلح billiard"
      expands:
        - text: >
            «البِلْيارد: لعبة البِلْيارد.»
          source: "المورد الحديث (2008) — ترجمة مصطلح billiards"
          addition: >
            يُرسّخ «البليارد» و«البلياردي» كتعريبَيْن مُعتمَدَيْن في
            المعجمية الحديثة، حيث يُستخدم «بِلْيارْديّ» اسماً وصفياً
            يدل على الانتساب لهذه اللعبة.

    - lemma: "مُدَحْرِجُ الْكُرَاتِ"
      evidence_status: "no_material_found"

    - lemma: "مُسَدِّدُ الْكُرَاتِ"
      evidence_status: "no_material_found"

    - lemma: "مُقَارِعُ الْكُرَاتِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "لاعب بلياردو"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي «لاعب + بلياردو» هو النمط الأكثر شيوعاً وقياسيةً
        في العربية المعاصرة لتسمية مُمارِس رياضة محددة (لاعب كرة قدم،
        لاعب شطرنج، لاعب تنس). المعجم اللغوي المعاصر يُثبت «بلياردو»
        مصطلحاً معتمداً، واللمّة مُفهمة في السياقين الإعلامي والرسمي.
        تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تعبير مركب صريح يُسمّي الرياضة المُمارَسة بدقة، الأكثر استخداماً
        في الكتابة الرسمية والإعلامية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبُ بِلْيَارْدُو"

    - lemma: "بِلْيَارْدِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        أثبت «المورد الحديث» وجود «بِلْيارْديّ» بوصفه تعريباً معجمياً
        لمصطلح billiard. اسم النسبة وزنٌ إنتاجي في العربية لتسمية
        مُمارِس الرياضة، ويقبل التصريف الصرفي الكامل (تأنيث، تثنية،
        جمع). يُمثّل بديلاً مُكثَّفاً من كلمة واحدة للتعبير المركب
        «لاعب بلياردو».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اسم نسبة مُكثَّف من مفردة واحدة، أكثر مرونة في التراكيب الوصفية
        والنعتية (اللاعب البِلْيارْدِيّ، البطل البِلْيارْدِيّ)، ويُستخدم
        في السياقات الإعلامية والمحكية أكثر من الرسمية.
      actions:
        - command: create_entry
          params:
            lemma: "بِلْيَارْدِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10472740-n"

    - lemma: "مُدَحْرِجُ الْكُرَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي على تثبيت هذا التعبير مصطلحاً. يفشل اختبار
        السكّ: يمكن إبدال «مُدَحْرِج» بـ«مُحرّك» أو «دافع» ويبقى
        الوصف صالحاً، مما يُثبت أنه عبارة وصفية حرة لا مصطلح ثابت.
        فضلاً عن ذلك، يصف الدحرجةَ فحسب دون الإشارة إلى البلياردو.

    - lemma: "مُسَدِّدُ الْكُرَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي على تثبيت هذا التعبير. يصف مهارةً عامة في
        الرياضات الكروية كافة ولا يختص بالبلياردو. يفشل اختبار
        التثبيت المعجمي.

    - lemma: "مُقَارِعُ الْكُرَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حر بلا تثبيت معجمي. «مُقارِع» دون سياق يحيل إلى
        المنافسة والصراع لا إلى الرياضة، مما يُشوّش الدلالة. يفشل
        اختبار السكّ والتثبيت.


