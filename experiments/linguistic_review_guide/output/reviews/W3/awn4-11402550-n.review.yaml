      - lemma: "جُورْج وِيسْتِنْغهاوس"
        examples:
          - text: "غيَّرَ جُورْج وِيسْتِنْغهاوس وجهَ النقل الحديدي حين ابتكر مكبح الهواء الذي أنقذ آلاف الأرواح."
            type: usage
      - lemma: "وِيسْتِنْغهاوس"
        examples:
          - text: "دخل اسم وِيسْتِنْغهاوس التاريخَ رمزاً للابتكار التقني، بعد انتصاره على إديسون في حرب التيارات الكهربائية."
            type: usage
