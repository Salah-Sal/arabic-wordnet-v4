# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ١ ──
    - lemma: "جورج ويستينغهاوس"
      decision: confirmed
      decision_reason: >
        الاسم الكامل لجورج ويستينغهاوس هو التعريب المعيار والأكثر شيوعاً في المصادر العربية
        العلمية والتاريخية، ويُمثّل الصيغة الرسمية للمجموعة الترادفية. التعريب مطّرد ومستقرّ
        في الكتابة العربية المعاصرة. يحتاج فقط إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: tarkib
      nuance_differentiation: >
        الاسم الكامل (الاسم الأول + اللقب العائلي): يُستخدم للتعريف الأول بالشخصية
        وفي السياقات الأكاديمية والرسمية والتوثيقية، حيث يُراد التحديد الدقيق والتمييز
        عن أفراد آخرين من العائلة أو أشخاص آخرين يحملون اللقب ذاته.
      morphological_check:
        pos_fit: تعريب مركّب (اسم أول + لقب عائلي) — لا يخضع للأوزان الصرفية العربية
        declension: يقبل التنوين والإضافة نحو «اختراعات جورج ويستينغهاوس»
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُورْج وِيسْتِنْغهاوس"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "ويستينغهاوس"
      decision: confirmed
      decision_reason: >
        اللقب العائلي منفرداً — صيغة مختصرة معيارية مستقرّة في التداول العربي،
        خاصة عند ذكر الشركة التي أسّسها أو الإشارة إلى الشخصية في سياقات يُفهم فيها
        السياق التاريخي مسبقاً. الصيغة نفسها موثّقة في المصادر العربية الحديثة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب العائلي المختصر: يُستخدم في الإشارة المتكررة بعد التعريف الأول،
        وفي سياقات يُعدّ فيها السياق كافياً للتعريف، كما يُستخدم للإحالة إلى
        شركة Westinghouse Electric التي أسّسها، مما يجعله أوسع دلالةً من الاسم الكامل.
      morphological_check:
        pos_fit: تعريب مفرد (لقب عائلي) — يقبل لام التعريف والإضافة
        declension: يقبل التنوين نحو «اختراعات ويستينغهاوس»
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيسْتِنْغهاوس"

    # ── مرشحات المرحلة ١ ──
    - lemma: "جُورْج وِيسْتِنْغهاوس"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمة الموجودة «جورج ويستينغهاوس» مع إضافة تشكيل فقط؛
        الإجراء المناسب هو update_lemma على اللمة الموجودة لا إنشاء مدخل جديد.

    - lemma: "وِيسْتِنْغهاوس"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمة الموجودة «ويستينغهاوس» مع إضافة تشكيل فقط؛
        الإجراء المناسب هو update_lemma على اللمة الموجودة لا إنشاء مدخل جديد.

    - lemma: "جُورْج وِيسْتِنْجْهَاوُس"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تعريبية بديلة (نج بدلاً من نغ) غير مستقرّة ولا معيارية في المصادر العربية
        الحديثة التي تستقرّ على «ويستينغهاوس» بالغين. التعريب بـ «نغ» أقرب للصوت الأصلي
        وأكثر شيوعاً في الكتابة العربية المعاصرة.

    - lemma: "وِيسْتِنْجْهَاوُس"
      source: stage1
      decision: removed
      decision_reason: >
        نفس سبب رفض المرشح السابق: الصيغة بـ «نج» غير معيارية، والاسم الصحيح
        المستقرّ في التداول العربي هو «ويستينغهاوس» بالغين.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "مخترع ومصنع أمريكي (1846-1914)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح لكنه مقتضب إلى حدٍّ يجعله غير مُميِّز ولا مُفيد؛
        فهو لا يختلف عمّا يُقال عن أي مخترع أمريكي من تلك الحقبة. تعريف اسم العلم
        يستلزم تحديد الإنجاز المميِّز الذي به عُرف الشخص. كذلك «مصنع» تعريب حرفي
        مضلّل (manufacturer لا يعني هنا صانعاً يدوياً بل رجل صناعة ومؤسس مصانع).
    authored:
      - type: encyclopedic
        text: >
          مُخترِعٌ وصِنَاعيٌّ أمريكيٌّ (1846-1914)، اشتُهِرَ بابتكار مِكبَح الهواء
          للسكك الحديدية عام 1869، وبإسهاماتِه الكُبرى في نشر نظام التيار المتردد
          الكهربائي بالشراكة مع نيكولا تيسلا، أسَّسَ شركة ويستينغهاوس للكهرباء عام 1886.
      - type: terminological
        text: >
          مُخترِعٌ وصِنَاعيٌّ أمريكيٌّ (1846-1914)، أبرز مُنجزاته مكبح الهواء للقطارات
          ونظام التيار المتردد الكهربائي، من رواد الثورة الصناعية الأمريكية في القرن التاسع عشر.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11402550-n"
          definition_index: 0
          text: "مُخترِعٌ وصِنَاعيٌّ أمريكيٌّ (1846-1914)، اشتُهِرَ بابتكار مِكبَح الهواء للسكك الحديدية، وبإسهاماتِه في نشر نظام التيار المتردد الكهربائي، مؤسِّس شركة ويستينغهاوس للكهرباء."
      - command: add_definition
        params:
          synset_id: "awn4-11402550-n"
          text: "مُخترِعٌ وصِنَاعيٌّ أمريكيٌّ (1846-1914)، أبرز مُنجزاته مكبح الهواء للقطارات ونظام التيار المتردد الكهربائي، من رواد الثورة الصناعية الأمريكية في القرن التاسع عشر."

  examples:
