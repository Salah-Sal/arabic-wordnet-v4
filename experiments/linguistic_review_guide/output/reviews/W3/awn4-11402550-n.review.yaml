# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11402550-n | ILI: i97396
# الاسم: جورج ويستينغهاوس | George Westinghouse
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل المطلوب"
      - "التعريف مقتضب جداً ولا يذكر الإسهامات العلمية الجوهرية لهذا المخترع"
      - "المجموعة تمثّل اسم علم (proper noun) لكن pos محدّد بـ n وهو تقليد مقبول وفق مذهب WordNet"
    observations: >
      هذه مجموعة ترادفية خاصة باسم علم لشخصية تاريخية غربية بعيدة عن التراث المعجمي العربي.
      التعريف الحالي «مخترع ومصنع أمريكي (1846-1914)» صحيح لكنه شحيح في المعلومات؛
      إذ لا يُشير إلى أبرز إسهامات ويستينغهاوس: مكبح الهواء للقطارات (1869)،
      ونظام التيار المتردد الكهربائي (بالشراكة مع نيكولا تيسلا) في موجهة توماس إديسون.
      عملية التوليد العمياء لأسماء الأعلام مقيّدة بطبيعتها، إذ تستلزم معرفة الاسم الأجنبي الأصلي
      لضبط التعريب؛ غير أن دلالة التعريف (مخترع أمريكي، 1846-1914) تُمكّن من التعرف
      على الشخصية بالرجوع إلى التاريخ العلمي.
  blind_candidates:
    - lemma: "جُورْج وِيسْتِنْغهاوس"
      generation_method: taarib
      justification: >
        التعريب المعيار لاسم العلم الإنجليزي George Westinghouse، وفق تقاليد التعريب الصوتي
        العربي. جُورْج: تعريب مستقرّ للاسم الأول. وِيسْتِنْغهاوس: نقل صوتي للقب العائلي
        بمراعاة المقاطع الصوتية الإنجليزية (West-ing-house).
    - lemma: "وِيسْتِنْغهاوس"
      generation_method: taarib
      justification: >
        اللقب العائلي منفرداً — الصيغة المختصرة الشائعة في الإشارة إلى الشخصية،
        خاصة في السياقات العلمية والتقنية حيث يُذكر بمفرده للدلالة على الشركة أو الشخص.
    - lemma: "جُورْج وِيسْتِنْجْهَاوُس"
      generation_method: taarib
      justification: >
        صيغة تعريبية بديلة تُعالج حرف الغين/الجيم في «-ing» بوصفه «نج» (nj) لا «نغ» (ng)،
        ومحاولة لمراعاة الشوكة اللسانية الإنجليزية بصورة أدق صوتياً في بعض الأعراف الكتابية العربية.
    - lemma: "وِيسْتِنْجْهَاوُس"
      generation_method: taarib
      justification: >
        اللقب العائلي بالصيغة البديلة (نج بدلاً من نغ) — صيغة مختصرة موازية للمرشح الثالث،
        وقد تظهر في بعض مصادر الترجمة العربية الأقدم التي تميل إلى تعريب ng بـ «نج».


