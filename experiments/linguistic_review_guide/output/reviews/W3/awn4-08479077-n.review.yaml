      entry_id: "{auto}"
      root: "صفف"
      maqayis_quote: "«الصَّادُ وَالْفَاءُ يَدُلُّ عَلَى أَصْلٍ وَاحِدٍ، وَهُوَ اسْتِوَاءٌ فِي الشَّيْءِ وَتَسَاوٍ بَيْنَ شَيْئَيْنِ فِي الْمَقَرِّ... وَالْأَصْلُ فِي ذَلِكَ الصَّفْصَفُ، وَهُوَ الْمُسْتَوِي مِنَ الْأَرْضِ»"
