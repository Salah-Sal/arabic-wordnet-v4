# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13871180-n (thirtieth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «الثلاثون» مخزّنة بصيغة التعريف دون تشكيل"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، يحتاج صياغة معجمية عربية"
      - "المجموعة تحتوي لمّة واحدة فقط؛ العدد «ثلاثون» بدون ال- غير مُدرج"
    observations: >
      المفهوم هو المركز الترتيبي الثلاثون في سلسلة معدودة. في العربية، ألفاظ العقود
      (عشرون، ثلاثون، أربعون...) تُستخدم للدلالة على الترتيب بعد العدد التاسع
      والعشرين، على معنى تمام الثلاثين، فتحذف كلمة التمام ويقوم العدد مقامها.
      أقرّ مجمع اللغة المصري هذا الاستعمال. اللمّة الطبيعية هي «الثَّلَاثُونَ»
      بالتعريف لأنها تُستعمل عادةً معرّفة في سياق الترتيب (الجزء الثلاثون، المادة الثلاثون).
  blind_candidates:
    - lemma: "الثَّلَاثُونَ"
      generation_method: ishtiqaq
      justification: "مشتقّ من الجذر «ث ل ث» على وزن ألفاظ العقود (فاعِلون)، وهو العدد المستعمل للدلالة على المركز الثلاثين في الترتيب"
    - lemma: "ثَلَاثُونَ"
      generation_method: ishtiqaq
      justification: "الصيغة النكرة من العدد ثلاثين، تُستعمل في سياقات مثل «صفحة ثلاثون» دون تعريف"
    - lemma: "الثَّلَاثِينِيّ"
      generation_method: ishtiqaq
      justification: "صفة منسوبة إلى الثلاثين على وزن فَعَالِينِيّ، تدلّ على ما يتصل بالمركز الثلاثين (العيد الثلاثيني)"
    - lemma: "تَمَامُ الثَّلَاثِينَ"
      generation_method: tarkib
      justification: "مركب إضافي يصف المعنى الأصلي لاستعمال لفظ العقد ترتيبياً، أي ما يتمّ به الثلاثون"


stage2_evidence:
  per_lemma:
    - lemma: "الثَّلَاثُونَ"
      confirm:
        - text: "«(الثَّلَاثُونَ) من الْعدَد ثَلَاث عشرات»"
          source: "المعجم الوسيط (هوراماني)"
        - text: "«من العدد: ثلاث عشرات»"
          source: "المعجم الوسيط (OCR)"
        - text: "«ثلاث عشرات على تكرار العشرة التالي للتاسع والعشرين في الترتيب, يقال: الجزء الثلاثون»"
          source: "المعجم الكبير"
      expands:
        - text: "«المادة الثلاثون — الرأي: مرفوضة — السبب: لاستعمال لفظ العقد «ثلاثون» وصفًا للمفرد... الصواب والرتبة: المادة المكملة للثلاثين [فصيحة] - المادة الثلاثون [صحيحة] — التعليق: استخدم هذا الأسلوب جماعة من قدامى العلماء، ومنه قولهم: الجزء العشرون، والورقة العشرون على معنى تمام العشرين، فتحذف كلمة التمام وتقام العشرون مقامها، وقد أقره مجمع اللغة المصري»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "تأكيد صحة استعمال لفظ العقد ترتيبياً بإقرار المجمع"
        - text: "«(1) الثلاثون the thirtieth day (2) مُشَكِّل جزءًا من ثلاثين a thirtieth share of the money (3) الثَّلاثون the thirtieth of the month (4) جزء من ثلاثين»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد الاستعمال الترتيبي (thirtieth) والكسري (a thirtieth share)"
    - lemma: "ثَلَاثُونَ"
      confirm:
        - text: "«(1) ثلاثون (2) pl.: الثَّلاثونات؛ الثَّلاثينات: العقد الرابع من العمر أو القرن»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«ثلاث عشرات على تكرار العشرة التالي للتاسع والعشرين في الترتيب, يقال: الجزء الثلاثون»"
          source: "المعجم الكبير"
          addition: "يُظهر أن الصيغة المعرّفة هي المستعملة ترتيبياً"
    - lemma: "الثَّلَاثِينِيّ"
      contradicts:
        - text: "«ثلاثينيّ — الرأي: مرفوضة — السبب: للنسب إلى لفظ العقد دون رده إلى المفرد. الصواب والرتبة: تستعدّ الدولة للاحتفال بالعيد الثلاثينيّ لنصر أكتوبر [فصيحة] — التعليق: أجاز مجمع اللغة المصري النسب إلى ألفاظ العقود»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "الثلاثينيّ صفة نسبية وليس اسماً ترتيبياً؛ يدلّ على النسبة لا على المركز"
      expands:
        - text: "«الثَّلاثِينِيُّ: ما نسب إلى الثلاثين»"
          source: "المعجم الكبير"
          addition: "تأكيد أنه صفة نسبية لا عدد ترتيبي"
    - lemma: "تَمَامُ الثَّلَاثِينَ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "الثَّلَاثُونَ"
      decision: confirmed
      decision_reason: "لمّة صحيحة مؤكدة بشواهد المعجم الوسيط والمعجم الكبير ومعجم الصواب اللغوي. العدد «الثلاثون» يُستعمل للدلالة على المركز الترتيبي الثلاثين بإقرار مجمع اللغة المصري. تحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الثَّلَاثُونَ"

    - lemma: "ثَلَاثُونَ"
      source: stage1
      decision: removed
      decision_reason: "الصيغة النكرة «ثلاثون» تدلّ على العدد الأصلي (الكمّي) لا على المركز الترتيبي. في سياق الترتيب يُستعمل اللفظ معرّفاً دائماً (الجزء الثلاثون). إضافتها ستُحدث التباساً مع المجموعة الترادفية للعدد الأصلي."
      evidence_assessment:
        case: mixed

    - lemma: "الثَّلَاثِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "صفة نسبية تدلّ على الانتماء إلى الثلاثين (العيد الثلاثيني) لا على المركز الترتيبي نفسه. دلالتها مختلفة عن مفهوم المجموعة. كما أنها صفة (adj) لا اسم (n)."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَمَامُ الثَّلَاثِينَ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ وليس مصطلحاً معجمياً مسكوكاً. لم يُعثر على أي دليل معجمي يسجّله وحدةً معجمية ثابتة. يفشل في اختبار السكّ واختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material


