# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13993147-n (peace: harmonious relations)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «سلام» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط لمفهوم شائع جداً في العربية — ينبغي إثراؤها"
      - "التعريف العربي ترجمة حرفية من الإنجليزية ولا يتّبع أسلوب المعاجم العربية"
    observations: "مفهوم السلام بمعنى العلاقات المتناغمة والخلو من النزاعات مفهوم أصيل في الثقافة العربية والإسلامية، وله جذور عميقة في المعجم العربي. الجذر «سلم» من أغنى الجذور العربية اشتقاقاً، ومنه: السَّلام، والسِّلْم، والسَّلامة، والإسلام، والمُسالَمة. المجموعة الفوقية (انسجام/توافق/وئام) تمثّل التناغم العام، بينما هذه المجموعة تخصّص المفهوم في العلاقات بين الناس أو الجماعات."
  blind_candidates:
    - lemma: "سِلْم"
      generation_method: ishtiqaq
      justification: "من الجذر «سلم» على وزن فِعْل، وهو ضدّ الحرب في أصل الوضع. قال تعالى: {وَإِنْ جَنَحُوا لِلسَّلْمِ فَاجْنَحْ لَهَا}. يدلّ على حالة الخلو من النزاع والعداء بين الأطراف."
    - lemma: "صُلْح"
      generation_method: ishtiqaq
      justification: "من الجذر «صلح» على وزن فُعْل، وهو اسم من المصالحة أي المسالمة بعد المنازعة. يدلّ على إنهاء الخصومة وعودة العلاقات إلى حالتها الطبيعية."
    - lemma: "وِفَاق"
      generation_method: ishtiqaq
      justification: "من الجذر «وفق» على وزن فِعَال، ويدلّ على الملاءمة بين الأطراف والاجتماع على أمر واحد، وهو قريب من مفهوم العلاقات المتناغمة."
    - lemma: "مُسَالَمَة"
      generation_method: ishtiqaq
      justification: "مصدر ميمي من «سالَمَ» على وزن مُفَاعَلَة، ويدلّ على المصالحة والمعايشة السلمية بين الأطراف."


stage2_evidence:
  per_lemma:
    - lemma: "سَلَام"
      confirm:
        - text: "«(السَّلَام) اسْم من أَسْمَائِهِ تَعَالَى وَالتَّسْلِيم والتحية عِنْد الْمُسلمين والسلامة والبراءة من الْعُيُوب والأمان وَالصُّلْح والنشيد الوطني الرسمي (محدثة) وَضرب من الشّجر»"
          source: "المعجم الوسيط"
        - text: "«السلام: تجرد النفس عن المحنة في الدارين»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«سَلَام: من (س ل م) التسليم والتحية عند المسلمين، والسلامة والبراءة من العيوب، والأمان، والصلح»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«السلاَم: من أسمائه تعالى وأيضاً التحيةُ يعني أن يقول: السلام عليكم ودارُ السلام: الجنةُ، ومدينةُ السلام: بغداد»"
          source: "التعريفات الفقهية للبركتي"
          addition: "يضيف دلالات متعددة للّفظ منها الاسم الإلهي والتحية والمكان، مما يؤكد تعدد المعاني"
        - text: "«(1) أَمْنٌ (2) طُمأنينة (3) وئام (4) سَلام؛ سِلْم (5) معاهدة صُلح (6) هدوء؛ سَكِينة»"
          source: "المورد الحديث (2008)"
          addition: "يقرن السلام بالسِّلْم ويفرد له معنى الوئام والأمن والهدوء"

    - lemma: "سِلْم"
      confirm:
        - text: "«والسَّلْمُ: ضِدُّ الحَرْب، ويقال: السَّلْمُ والسِّلْم واحد»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«وَمِنَ الْبَابِ الْأَوَّلِ السِّلْمُ وَهُوَ الصُّلْحُ، وَقَدْ يُؤَنَّثُ وَيُذَكَّرُ. قَالَ اللَّهُ تَعَالَى: {وَإِنْ جَنَحُوا لِلسَّلْمِ فَاجْنَحْ لَهَا}»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«سِلْم، سلام»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«سلم = peace»"
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
      expands:
        - text: "«والسِّلَامُ: الْمُسَالَمَةُ. وَفِعَالٌ تَجِيءُ فِي الْمُفَاعَلَةِ كَثِيرًا نَحْوَ الْقِتَالِ وَالْمُقَاتَلَةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يربط بين السِّلام والمسالمة صرفياً ودلالياً"

    - lemma: "صُلْح"
      confirm:
        - text: "«(الصُّلْح) إنهاء الْخُصُومَة وإنهاء حَالَة الْحَرْب وَالسّلم»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الصّلح: رفع الْخُصُومَة بَين المتداعيين»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الصلح عند السيوطي عقد قانوني لرفع الخصومة وليس حالة عامة من العلاقات المتناغمة"
        - text: "«الصلح: لغة اسم من المصالحة وهي المسالمة بعد المنازعة. وشرعا: عقد يدفع النزاع»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الصلح عقد محدد يُبرم بعد نزاع قائم، وليس حالة دائمة من التناغم"
        - text: "«الصّلح: في الشريعة عقد يرفع النزاع أي يكون المقصود والغرض منه رفع النزاع»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الصلح مفهوم إجرائي عقدي وليس وصفاً لحالة من العلاقات المتناغمة"

    - lemma: "وِفَاق"
      confirm:
        - text: "«وِفَاق: من (و ف ق) الملاءمة بين الشيئين، والاجتماع على أمر واحد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«وِفَاق: من (و ف ق) الملاءمة بين الشيئين»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الوِفاق أقرب إلى التوافق العام (المجموعة الفوقية: توافق/وئام) منه إلى السلام بوصفه خلواً من النزاعات"

    - lemma: "مُسَالَمَة"
      confirm:
        - text: "«(سالمه) مسالمة وسلاماً: صالحه»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(سالمه) مسالمة وسلاماً: صالحه»"
          source: "المعجم الوسيط"
          conflict: "المسالمة مصدر فعل المفاعلة (سالَمَ) وتدلّ على فعل المصالحة لا على حالة السلام ذاتها"


stage3_analysis:
  per_lemma:
    - lemma: "سَلَام"
      decision: confirmed
      decision_reason: "لفظ «السلام» من أشهر الألفاظ العربية الدالة على هذا المفهوم، وقد أكدت المعاجم الكبرى (الوسيط، الجرجاني) دلالته على الصلح والأمان والسلامة. وهو الأكثر تداولاً في الاستعمال المعاصر بمعنى peace."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "السَّلَام أعمّ دلالةً من السِّلْم، إذ يشمل السلامة والأمان والتحية والصلح، ويُستخدم في السياقات العامة والدبلوماسية والدينية على السواء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَلَام"

    - lemma: "سِلْم"
      source: stage1
      decision: confirmed
      decision_reason: "السِّلْم لفظ قرآني فصيح ثابت بمعنى ضدّ الحرب والصلح، أثبته الخليل وابن فارس والمعجم الموحد للقانون. وهو أخصّ من السلام في الدلالة على الخلو من النزاع والحرب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "السِّلْم أخصّ من السلام، إذ يدلّ تحديداً على ضدّ الحرب والنزاع بين الأطراف، ولا يتّسع ليشمل التحية أو اسم الله أو السلامة البدنية"
      actions:
        - command: create_entry
          params: {lemma: "سِلْم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "صُلْح"
      source: stage1
      decision: removed
      decision_reason: "الصُّلح في المعاجم العربية عقدٌ إجرائيّ يرفع النزاع (السيوطي، التهانوي، المناوي)، وليس حالة دائمة من العلاقات المتناغمة. هو أقرب إلى مفهوم المصالحة (reconciliation) منه إلى السلام بوصفه حالة."
      evidence_assessment:
        case: mixed

    - lemma: "وِفَاق"
      source: stage1
      decision: removed
      decision_reason: "الوِفاق يدلّ على الملاءمة والاجتماع على أمر واحد، وهو أقرب إلى المجموعة الفوقية (توافق/وئام/انسجام) التي تمثّل التناغم العام. إدراجه هنا يُحدث تداخلاً مع المجموعة الفوقية."
      evidence_assessment:
        case: mixed

    - lemma: "مُسَالَمَة"
      source: stage1
      decision: removed
      decision_reason: "المسالمة مصدر فعل المفاعلة (سالَمَ = صالَحَ)، فهي تدلّ على فعل المصالحة وعملية التسالم، لا على حالة السلام ذاتها. مفهومها حدثيّ إجرائي لا وصفيّ حاليّ."
      evidence_assessment:
        case: mixed


