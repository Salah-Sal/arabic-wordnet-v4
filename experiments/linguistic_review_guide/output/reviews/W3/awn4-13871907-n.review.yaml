# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13871907-n (hundredth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «المتمم للمائة» عبارة وصفية حرة وليست وحدة معجمية ثابتة، تفشل في اختبار السكّ (يمكن إبدالها بـ«المكمّل للمائة» أو «ما يتمّم المائة»)"
      - "التعريف العربي الحالي «المركز 100 في سلسلة معدودة من الأشياء» ترجمة حرفية عن الإنجليزية، يحتاج إلى صياغة معجمية عربية"
      - "المجموعة تحتوي لمّة واحدة صالحة فقط (المائة) مع عبارة وصفية لا ترقى لمصطلح"
    observations: "المفهوم هو العدد الترتيبي المقابل للعدد مئة، أي المركز المئة في سلسلة عددية. في العربية، الأعداد الترتيبية فوق العشرة تُعبَّر عنها بالعدد الأصلي معرّفاً بأل، فيُقال: الجزء المائة أو اليوم المائة. هذا نمط نحوي ثابت لا يحتاج إلى مصطلح مستقل."
  blind_candidates:
    - lemma: "الْمِئَةُ"
      generation_method: ishtiqaq
      justification: "الرسم الحديث المختصر لـ«المائة»، أقرّ مجمع اللغة العربية حذف الألف فتُكتب «مئة» بدل «مائة»، فيكون العدد الترتيبي: المئة"
    - lemma: "الْمِئَوِيُّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى المئة على وزن فِعَلِيّ، للتعبير عن ما يتعلق بالمركز المئة"
    - lemma: "تَمَامُ الْمِئَةِ"
      generation_method: tarkib
      justification: "مركب إضافي يعني ما يكتمل به العدد مئة في سلسلة ترتيبية"
    - lemma: "الْمُكَمِّلُ لِلْمِئَةِ"
      generation_method: tarkib
      justification: "مركب وصفي يعني الذي يُتمّم المئة في الترتيب"

stage2_evidence:
  per_lemma:
    - lemma: "الْمِائَة"
      confirm:
        - text: "«(الْمِائَة) عشر عشرات وَهُوَ اسْم وَقد يُوصف بِهِ يُقَال مَرَرْت بِرَجُل مائَة إبِله (ج) مئات ومئون وَالنِّسْبَة إِلَى مائَة مئوي»"
          source: "المعجم الوسيط (هَوَرامَاني)"
        - text: "«عَشْرُ عَشَرات ؛ وهو اسم , وقد يوصف به النسبة المِئَوِيَّة: نسبة أَى عددٍ كان إلى المائة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(1) المئة the hundredth day (2) بالغ جزءًا من مئة a hundredth share of the money (3) العضو المئة في سلسلة (4) جزء من مئة.»"
          source: "المورد الحديث"
      expands:
        - text: "«المائة: المرتبة الثالثة من أصول الأعداد لأن أصولها أربعة: آحاد وعشرات ومئات وألوف.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تصنيف المائة كمرتبة عددية أصلية"
        - text: "«المِائَة: الثالثةُ من أصول الأَعداد... ومائة آخِرُها محذوفٌ، يقال: أَمْأَيْتُ الدَّراهِمَ فَأَمَّأَتْ هي، أي: صارتْ ذاتَ مِائَةٍ.»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "أصل الاشتقاق والتصريف: أمأى الدراهم أي جعلها مائة"
    - lemma: "الْمُتَمِّمُ لِلْمِائَةِ"
      evidence_status: "no_material_found"
    - lemma: "الْمِئَةُ"
      confirm:
        - text: "«العدد المعروف, وأصله مئية»"
          source: "كتاب العين"
        - text: "«المئة في العدد, وآخرها حرف محذوف»"
          source: "مجمل اللغة"
      expands:
        - text: "«أقر مجمع اللغة المصري جواز حذف ألف «مائة» مراعيًا في هذا نوعًا من التيسير الإملائي.»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "المئة والمائة رسمان لكلمة واحدة"
    - lemma: "الْمِئَوِيُّ"
      contradicts:
        - text: "«يعتمد على تقسيم الواحدة إلى مائة قسم»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية"
          conflict: "المئوي يعني المنسوب إلى التقسيم المئوي (centesimal) لا المركز الترتيبي المائة"
        - text: "«(1) المِئَويّ: البالغُ من العمر مئةَ سنة (2) مِئَويّ: بالغٌ من العمر مئةَ سنة.»"
          source: "المورد الحديث"
          conflict: "المئوي يدل على بلوغ المئة من العمر (centenarian) لا على الترتيب"
    - lemma: "تَمَامُ الْمِئَةِ"
      evidence_status: "no_material_found"
    - lemma: "الْمُكَمِّلُ لِلْمِئَةِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الْمِائَة"
      decision: confirmed
      decision_reason: "المائة هي الصيغة المعيارية في العربية للعدد الترتيبي المقابل للعدد مئة. ثبت استعمالها الترتيبي في المورد الحديث (العضو المئة في سلسلة = the hundredth) وفي المعاجم الكلاسيكية بوصفها مرتبة عددية. الجذر مأي ثابت في المعجم الوسيط وكتاب العين."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْمِائَة"

    - lemma: "الْمُتَمِّمُ لِلْمِائَةِ"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل في اختبار السكّ: يمكن إبدالها بـ«المكمّل للمائة» أو «ما يبلغ المائة» دون تغيّر في الدلالة. لا شاهد معجمي عليها في أي مصدر، وليست وحدة معجمية ثابتة بل تركيب وصفي حر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الْمِئَةُ"
      source: stage1
      decision: removed
      decision_reason: "المئة ليست لمّة مستقلة عن المائة بل هي رسم إملائي بديل لنفس الكلمة، كما أثبت معجم الصواب اللغوي أن مجمع اللغة المصري أقرّ جواز حذف الألف. إضافتها كلمّة مستقلة يُحدث ازدواجاً لا تمايزاً دلالياً."

    - lemma: "الْمِئَوِيُّ"
      source: stage1
      decision: removed
      decision_reason: "المئوي في المعاجم المعاصرة يعني المنسوب إلى التقسيم المئوي (centesimal) أو البالغ مئة سنة (centenarian)، ولا يدل على المركز الترتيبي المائة. دلالته مختلفة عن دلالة المجموعة."

    - lemma: "تَمَامُ الْمِئَةِ"
      source: stage1
      decision: removed
      decision_reason: "مركب وصفي حر لا شاهد معجمي عليه، يفشل في اختبار التثبيت المعجمي. يمكن استبداله بـ«اكتمال المئة» أو «بلوغ المئة» مما يثبت أنه ليس وحدة معجمية ثابتة."

    - lemma: "الْمُكَمِّلُ لِلْمِئَةِ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة مشابهة لـ«المتمم للمائة» الموجودة أصلاً والمرفوضة. لا شاهد معجمي ولا تثبيت اصطلاحي."

