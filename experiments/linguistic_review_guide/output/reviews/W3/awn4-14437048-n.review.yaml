# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14437048-n
# the state of being out of favor — حالة فقدان الحظوة أو الرضا
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «استهجان» تدلّ على الاستقباح والإنكار (فعل نفسيّ)، لا على حالة فقدان الحظوة (حالة سلبية يتعرّض لها المرء)"
      - "لمّة «عدم رضا» عبارة وصفية شفّافة وليست وحدة معجمية ثابتة؛ تفشل في اختبار السَّكّ"
      - "اللمّات الثلاث بدون تشكيل كامل"
    observations: "المجموعة تمثّل مفهوم فقدان الحظوة أو الاستحسان، وهو مفهوم أصيل في العربية له ألفاظ عديدة. التعريف الحالي مقبول لكنه ترجمة شبه حرفية. الحقل الدلالي يشمل: السُّخْط، الاستياء، النِّقمة، المَقْت، الكُرْه. ينبغي التمييز بين الحالة النفسية (السُّخْط) والفعل الإنكاري (الاستهجان)."

  blind_candidates:
    - lemma: "سُخْط"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر س-خ-ط على وزن فُعْل، يدلّ على ضدّ الرضا والكراهة، وهو أقرب لفظ عربي للمفهوم"
    - lemma: "اسْتِيَاء"
      generation_method: ishtiqaq
      justification: "مصدر على وزن اسْتِفعال من الجذر س-و-أ، يدلّ على عدم الرضا والامتعاض، مستعمل في الفصحى المعاصرة"
    - lemma: "مَقْت"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر م-ق-ت على وزن فَعْل، يدلّ على أشدّ البغض، وهو حالة فقدان الحظوة في أقصى درجاتها"
    - lemma: "نُفُور"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر ن-ف-ر على وزن فُعُول، يدلّ على التباعد والكراهة، ويُستعمل للتعبير عن حالة عدم القبول"


stage2_evidence:
  per_lemma:
    - lemma: "اسْتِهْجَان"
      confirm:
        - text: "«الاستهجان: الاستقباح»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«وَقد يستهجن التَّصْرِيح بِشَيْء فَيتْرك ويختار الْكِنَايَة وَالرَّمْز إِلَيْهِ»"
          source: "دستور العلماء للأحمدنكري"
          addition: "الاستهجان يرتبط بتقبيح الشيء واستنكاره، وهو فعل نفسي موجَّه لا حالة يتعرّض لها المرء"
        - text: "«(1) استنكار؛ استهجان (2) رَفْض»"
          source: "المورد الحديث (2008)"
          addition: "المورد يقرن الاستهجان بالاستنكار والرفض مقابل disapproval"

    - lemma: "سَخَط"
      confirm:
        - text: "«السُّخْط، بالضم وكعُنُقٍ وجبلٍ ومَقْعَدٍ: ضِدُّ الرِّضى، وقد سَخِطَ، كفرحَ، وتَسَخَّطَ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«السخط: الغضب الشديد المقتضي للعقوبة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«السَّخَط: الكراهة والغضب عَدَمُ الرِّضَا»"
          source: "المعجم الكبير"
        - text: "«السُّخْط: الكراهة للشَّىءِ وعَدَمُ الرِّضا به»"
          source: "المعجم الكبير"
      expands:
        - text: "«(1) كُرْه (2) «أ» ازدراء. «ب» نقمة؛ لاحَظْوة»"
          source: "المورد الحديث (2008)"
          addition: "المورد يترجم disfavor بـ: كُرْه، ازدراء، نقمة، لاحَظْوة — ويقرن السخط بالاستياء"
        - text: "«سُخط؛ استياء؛ امتعاض؛ عَدَمُ رضًا»"
          source: "المورد الحديث (2008)"
          addition: "السُّخط يُقرن بالاستياء والامتعاض وعدم الرضا مقابل dissatisfaction"

    - lemma: "عَدَمُ رِضًا"
      confirm:
        - text: "«استياء؛ امتعاض؛ عدم رضًا»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«سُخط؛ استياء؛ امتعاض؛ عَدَمُ رضًا»"
          source: "المورد الحديث (2008)"
          conflict: "عدم رضًا يرد ضمن سلسلة مترادفات وصفية في قاموس ثنائي اللغة، لا بوصفه مدخلاً معجمياً مستقلاً"

    - lemma: "سُخْط"
      confirm:
        - text: "«السُّخْط: الكراهة للشَّىءِ وعَدَمُ الرِّضا به»"
          source: "المعجم الكبير"
        - text: "«السُّخْط، بالضم: ضِدُّ الرِّضى»"
          source: "القاموس المحيط للفيروزآبادي"

    - lemma: "اسْتِيَاء"
      confirm:
        - text: "«استياء؛ امتعاض؛ عدم رضًا»"
          source: "المورد الحديث (2008)"
        - text: "«(1) نُفور؛ كُره (2) استياء؛ سُخط»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) استياء؛ غضب؛ سُخط؛ كبرياءٌ جريح»"
          source: "المورد الحديث (2008)"
          addition: "الاستياء يُقرن بالغضب والسُّخط مقابل pique، مما يدلّ على تقاربه الدلالي مع السُّخط"

    - lemma: "مَقْت"
      evidence_status: "no_material_found"

    - lemma: "نُفُور"
      confirm:
        - text: "«(1) نُفور؛ كُره (2) استياء؛ سُخط»"
          source: "المورد الحديث (2008)"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اسْتِهْجَان"
      decision: confirmed
      decision_reason: "الاستهجان بمعنى الاستقباح والاستنكار مؤكَّد في المعاجم الكلاسيكية والحديثة. وإن كان يميل للدلالة على الفعل الإنكاري أكثر من الحالة السلبية، فإنه يُستعمل مجازاً بمعنى كون المرء في حالة تُستهجَن فيها أفعاله"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على البعد التقييمي: استقباح الفعل أو القول، وهو أقرب إلى الإنكار الأخلاقي منه إلى مجرّد فقدان الحظوة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اسْتِهْجَان"

    - lemma: "سُخْط"
      decision: confirmed
      decision_reason: "السُّخْط هو اللفظ الأدقّ والأوثق توثيقاً لهذا المفهوم. عرّفته المعاجم بأنه ضدّ الرضا والكراهة والغضب. الضبط بالضمّ (سُخْط) هو الأشهر والأفصح وفق القاموس المحيط والمعجم الكبير"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الحالة النفسية العامة المضادّة للرضا، ويشمل الكراهة والغضب معاً، وهو الأعمّ دلالةً في المجموعة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُخْط"

    - lemma: "عَدَمُ رِضًا"
      decision: removed
      decision_reason: "تعبير وصفي شفّاف مركّب من أداة النفي «عدم» واسم المصدر «رضا»، ويفشل في اختبار السَّكّ: يمكن إبدال «رضا» بـ«قبول» أو «موافقة» والعبارة تبقى وصفاً صالحاً. ليس وحدة معجمية ثابتة بل نمط إنتاجي (عدم + مصدر)"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "سُخْط"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمّة الموجودة «سخط» بعد تصحيح تشكيلها إلى «سُخْط»؛ لا حاجة لإضافة مدخل مكرَّر"
      evidence_assessment:
        case: confirm_only

    - lemma: "اسْتِيَاء"
      source: stage1
      decision: confirmed
      decision_reason: "الاستياء مصدر فصيح على وزن استفعال من س-و-أ، يدلّ على الامتعاض وعدم الرضا. يُقرن في المعاجم الحديثة بالسُّخط والامتعاض. يُضيف بُعداً دلالياً يميّزه عن أخواته: فهو أخفّ من السُّخط وأقرب إلى الضيق الداخلي"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أخفّ وطأةً من السُّخط، ويدلّ على ضيق نفسي داخلي وامتعاض هادئ دون بلوغ درجة الغضب الشديد"
      actions:
        - command: create_entry
          params: {lemma: "اسْتِيَاء", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مَقْت"
      source: stage1
      decision: removed
      decision_reason: "المَقْت يدلّ على أشدّ البغض وأقبحه، وهو أقوى دلالةً من مفهوم المجموعة (فقدان الحظوة). لا يتناسب مع تعريف disfavor الذي يقتصر على فقدان القبول"
      evidence_assessment:
        case: no_material

    - lemma: "نُفُور"
      source: stage1
      decision: removed
      decision_reason: "النُّفور يدلّ على التباعد والانصراف عن الشيء، وهو أقرب إلى الردّة الطبيعية (aversion) منه إلى حالة فقدان الحظوة الاجتماعية"
      evidence_assessment:
        case: mixed


