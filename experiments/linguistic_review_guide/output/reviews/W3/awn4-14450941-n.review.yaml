# مراجعة المجموعة الترادفية: awn4-14450941-n
# المفهوم: الشمول التام / including entirely (encompassment)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «شمول» بدون تشكيل، وصيغة الشُّمُول في المعاجم الكلاسيكية تعني الخمرَ أو ريحَ الشمال أولاً"
      - "التعريف العربي «الشمول التام» مقتضب ودائري — يستخدم مادة اللمّة نفسها في التعريف"
      - "المجموعة تفتقر إلى لمّة تعبّر عن الاحتواء الكلّي بوضوح مثل «استيعاب»"
    observations: "المفهوم يدور حول الإدراج الكامل والشمول بلا استثناء، وهو فرع من مفهوم الاشتمال/التضمين في المجموعة الأعلى. الإحاطة لفظ قوي يُفيد الإدراك الكلّي، لكنه يُستعمل أكثر في سياق العلم والمعرفة. شمول مصدر صحيح لشَمِلَ لكنه يتنافس مع دلالات أخرى."
  blind_candidates:
    - lemma: "اسْتِيعَاب"
      generation_method: ishtiqaq
      justification: "مصدر استوعب من الجذر وعب، على وزن استفعال. معناه أخذ الشيء كلّه واستيفاؤه بتمامه، وهو أدقّ تعبير عن الشمول التام"
    - lemma: "اسْتِغْرَاق"
      generation_method: ishtiqaq
      justification: "مصدر استغرق من الجذر غرق، على وزن استفعال. يدلّ في الاصطلاح على الشمول لجميع الأفراد بحيث لا يخرج عنه شيء"
    - lemma: "اِحْتِوَاء"
      generation_method: ishtiqaq
      justification: "مصدر احتوى من الجذر حوي، على وزن افتعال. يُستعمل في الرياضيات والفلسفة بمعنى inclusion"
    - lemma: "إِلْمَام"
      generation_method: ishtiqaq
      justification: "مصدر ألمّ من الجذر لمم، على وزن إفعال. يفيد الإحاطة بالشيء ومعرفته من جوانبه"

stage2_evidence:
  per_lemma:
    - lemma: "إِحَاطَة"
      confirm:
        - text: "«الإحاطة: إدراك الشيء بكماله ظاهرًا وباطنًا.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الإحاطة: إدراك الشيء بكماله ظاهراً وباطناً أو إحداقُ الشيء بجوانبه»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الإحاطة: إدراك الشيء بكماله ظاهرا وباطنا، والاستدارة بالشيء من جميع جوانبه، ذكره الراغب. وقال أبو البقاء احتواء الشيء على ما وراءه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«الإحاطة بالشيء علما أن يعلم وجوده وجنسه وقدره وصفته وكيفيته وغرضه المقصود به وما يكون به ومنه وعليه، وذلك لا يكون إلا لله تعالى.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الإحاطة العلمية الكاملة مخصوصة بالله تعالى، مما يدل على أن اللفظ يحمل بُعداً معرفياً قوياً"

    - lemma: "شُمُول"
      confirm:
        - text: "«الشُّمولُ: العمومُ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«(الشُّمُول) ريح الشمال والخمر»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأولى للشُّمول في المعاجم هي الخمر أو ريح الشمال، لا العموم"
        - text: "«الشمول: بالفتح: الخمر لأنها تشتمل على العقل فتغطيه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المناوي يحصر الشَّمُول في دلالة الخمر"

    - lemma: "اسْتِيعَاب"
      confirm:
        - text: "«الاستيعاب: أخذ الشيء كله، يقال وعبته وعبا وأوعبته إيعابا، واستوعبته، كلها بمعنى. وفي التهذيب: الوعب إيعابك الشيء في الشيء حتى تأتي عليه كله، أو يدخله فيه جميعه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الاستيعاب: هو الاستيفاء والأخذ أجمعَ»"
          source: "التعريفات الفقهيّة للبركتي"

    - lemma: "اسْتِغْرَاق"
      confirm:
        - text: "«الاستغراق: الشمول لجميع الأفراد، بحيث لا يخرج عنه شيء.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الاستغراق: هو الشمول لجميع الأفراد بحيث لا يخرج عنه شيء.»"
          source: "التعريفات الفقهيّة للبركتي"
      contradicts:
        - text: "«الاستغراق: هو عند الصوفية أن لا يلتفت قلب الذاكر إلى الذكر في أثناء الذكر ولا إلى القلب، ويعبّر العارفون عن هذه الحالة عن الفناء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الاستغراق في الاصطلاح الصوفي يعني الفناء والانغماس الروحي، وهو معنى مختلف تماماً"
      expands:
        - text: "«الاستغراق: استيفاء شيء بتمام أجزائه أو إفراده والتوجه في شيء بحيث يكون ما وراءه لا شيئا عنده»"
          source: "دستور العلماء للأحمدنكري"
          addition: "يوسّع الدلالة لتشمل البُعد المنطقي واللغوي للاستغراق"

    - lemma: "اِحْتِوَاء"
      confirm:
        - text: "«احتواء — inclusion»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك"
        - text: "«احتواء — inclusion»"
          source: "مسرد الفلسفة وعلم النفس"
      contradicts:
        - text: "«احتواء — containment — احتواء أو حبس مواد خطرة في بنية لمنع هجرتها»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          conflict: "الاحتواء في أغلب المعاجم التقنية يعني المنع والحبس (containment) لا الإدراج الشامل"

    - lemma: "إِلْمَام"
      contradicts:
        - text: "«الإلمام: مقاربة الشيء والنزول.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الإلمام يعني المقاربة والنزول لا الشمول التام"
        - text: "«الإلمام: الزيارة غباً (أي وقتاً بعد وقت)»"
          source: "كتاب العين"
          conflict: "الإلمام في المعاجم يعني الزيارة العابرة لا الإحاطة الكاملة"

