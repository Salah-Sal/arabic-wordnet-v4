      decision_reason: "رغم ثبوت دلالة الشمول لجميع الأفراد في كتب التعريفات، فإن الاستغراق يحمل اشتراكاً لفظياً قوياً مع المعنى الصوفي (الفناء) والمعنى العرفي (الانغماس)، كما أنه اصطلاح منطقي-لغوي أكثر منه مصطلح عام للشمول التام."

