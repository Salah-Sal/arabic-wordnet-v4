# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "أوتيس"
      decision: confirmed
      decision_reason: >
        اللقب العائلي (Otis) مُعرَّب بالكتابة الصوتية المعيارية، ومُستخدَم وحده
        للإحالة المختصرة في السياقات التقنية والتاريخية. يجب تشكيله: أُوتِيس.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      loanword_check:
        type: taarib
        verdict: "مقبول — تعريب فونولوجي معيار لاسم علم أجنبي"
      morphological_fit: "اسم علم مُعرَّب، لا ينطبق عليه الوزن الصرفي العربي"
      nuance_differentiation: >
        أُوتِيس: اللقب المختصر وحده، يُستخدَم في الإحالة السريعة وفي تسمية الشركة
        (شركة أُوتِيس للمصاعد)؛ يُفيد الاختصار والشيوع في السياقات التجارية
        والصناعية بعيداً عن التمييز بين أفراد الأسرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُوتِيس"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── اللمّة الموجودة ٢ ──
    - lemma: "إليشا أوتيس"
      decision: confirmed
      decision_reason: >
        الاسم الكامل (Elisha Otis) هو الصيغة الأوفر تداولاً في الموسوعات والمراجع
        العربية. يحتاج تشكيلاً كاملاً: إِلِيشَا أُوتِيس.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loanword_check:
        type: taarib
        verdict: "مقبول — اسم + لقب، الصيغة المعيارية في الموسوعات العربية"
      morphological_fit: "تركيب إضافي لاسم علم مُعرَّب، معيار في أسماء الأعلام الغربية"
      nuance_differentiation: >
        إِلِيشَا أُوتِيس: الاسم الكامل الأكثر شيوعاً في المراجع العامة والموسوعات،
        يُميِّز الشخص عن أفراد آخرين في العائلة؛ وهو الصيغة التي تحمل الهوية الفردية
        الكاملة دون الاسم الأوسط الرسمي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِلِيشَا أُوتِيس"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشّح المرحلة ١: إليشا غريفز أوتيس ──
    - lemma: "إِلِيشَا غرِيفْز أُوتِيس"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل (Elisha Graves Otis) مُدرَج في المصادر الإنجليزية
        (OEWN: Elisha Graves Otis) وهو الصيغة الموثِّقة في سجلات براءات
        الاختراع الأمريكية. يجب إضافته كلمّة ثالثة لاستيعاب هذا الاستخدام.
        التعريب بالأسماء الثلاثة معيار راسخ في الموسوعات العربية للأعلام الغربيين.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loanword_check:
        type: taarib
        verdict: "مقبول — الصيغة الرسمية الكاملة للاسم الأجنبي"
      morphological_fit: "سلسلة تعريب لاسم علم ثلاثي، معيار في أدبيات التراجم العربية"
      nuance_differentiation: >
        إِلِيشَا غرِيفْز أُوتِيس: الاسم الرسمي الكامل بالاسم الأوسط، يُستخدَم
        في الوثائق الرسمية والمصادر الأكاديمية ودوائر المعارف التخصصية؛
        يُفيد الدقة التوثيقية القصوى ويُميِّز الشخص تمييزاً قاطعاً.
      actions:
