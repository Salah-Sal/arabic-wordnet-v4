          params:
            lemma: "إِلِيشَا غرِيفْز أُوتِيس"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-11238280-n"

    # ── مرشّح المرحلة ١: مبتكر المصعد الآمن ──
    - lemma: "مُبْتَكِرُ الْمَصْعَدِ الآمِن"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ: يمكن إبدال «مبتكر» بـ«صانع» أو «مخترع» وتظل العبارة وصفاً
        صحيحاً للشخص — إذاً ليست وحدة معجمية ثابتة بل عبارة وصفية حرة.
        أسماء الأعلام الشخصية لا تُمثَّل في الشبكة الدلالية بألقاب وصفية.


