# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أوتيس، إليشا أوتيس) خاليتان من التشكيل الكامل"
      - "الاسم الرسمي الكامل 'إليشا غريفز أوتيس' غائب عن اللمّات، وهو مُثبَّت في المصادر الإنجليزية (Elisha Graves Otis)"
      - "الفعل 'صنع' في التعريف أقل دقة من 'ابتكر' أو 'طوّر'، وجهاز الأمان غير مُوصَف"
      - "POS مُسجَّل كـ n؛ المدخلات في المعجم ينبغي أن تحمل pos: proper_noun وفق مخطط entries"
    observations: >
      هذه المجموعة الترادفية لاسم علم خاص بشخص تاريخي أمريكي (إليشا غريفز أوتيس، 1811-1861)،
      مخترع أول مصعد مزوَّد بآلية تمنع سقوط الكابينة. اللمات المتوقعة لمثل هذه الأعلام
      تعريبٌ صوتي للاسم الأجنبي، ولا ينطبق عليها الاشتقاق العربي. المشكلة الجوهرية
      هي النقص في التشكيل وغياب الصيغة الرسمية الثالثة للاسم.

  blind_candidates:
    - lemma: "إِلِيشَا أُوتِيس"
      generation_method: taarib
      justification: >
        تعريب صوتي للاسم الإنجليزي الكامل Elisha Otis — الصيغة الأكثر تداولاً في المراجع
        العربية والموسوعات لهذا المخترع الأمريكي.
    - lemma: "أُوتِيس"
      generation_method: taarib
      justification: >
        تعريب اللقب العائلي Otis وحده — يُستخدم في الإحالة المختصرة في المصادر العلمية
        والتقنية عند الاستغناء عن الاسم الأول.
    - lemma: "إِلِيشَا غرِيفْز أُوتِيس"
      generation_method: taarib
      justification: >
        تعريب الاسم الرسمي الكامل Elisha Graves Otis بإدراج الاسم الأوسط، وهو
        الصيغة المعتمدة في وثائق براءات الاختراع والمصادر الأكاديمية الرسمية.
    - lemma: "مُبْتَكِرُ الْمَصْعَدِ الآمِن"
      generation_method: tarkib
      justification: >
        تركيب إضافي يصف الشخص بعمله الأبرز (مبتكر + المصعد الآمن) كلقب وصفي بديل.
        مرشّح للاختبار اللاحق بالتحقق من كونه اصطلاحاً مسكوكاً أم مجرد وصف.


