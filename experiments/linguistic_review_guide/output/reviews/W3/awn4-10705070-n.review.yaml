# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التوليد الأعمى للمرشحات (قبل الاطلاع على اللمّات الموجودة)
  # المدخل: التعريف فقط — "شخص ماهر في المنطق الرمزي"
  blind_candidates:
    - lemma: "مَنْطِقِيٌّ صُورِيٌّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي (wasfi) من مَنْطِقِيّ (المشتغل بالمنطق، نسبة إلى المَنْطِق) وصُورِيّ
        (نسبة إلى الصورة المنطقية). المنطق الصوري هو المصطلح الدارج في المصادر العربية
        الفلسفية مرادفاً للمنطق الرمزي، إذ يعنيان الضرب الذي يعتني بصورة الفكر دون مادته.
        الوزن الوصفي صيغة قياسية لتوصيف المتخصص في فرع علمي بعينه (كـ فيزيائيٌّ نوويٌّ).

    - lemma: "عَالِمُ الْمَنْطِقِ الصُّورِيّ"
      generation_method: tarkib
      justification: >
        مركّب إضافي وصفي (idafi-wasfi) من ثلاثة عناصر: عَالِم (الجنس القريب) + المَنْطِق
        (المجال) + الصُّورِيّ (المُخصِّص الدلالي). يُوازي النمط المستخدم في المصطلحية
        العربية الحديثة (كـ عَالِم الأحياء الجزيئي، عَالِم الفيزياء النظري). يبتعد عن
        كلمات التعريف مباشرةً باستخدام الصوري بدل الرمزي.

    - lemma: "مِنْطِيقٌ رَمْزِيٌّ"
      generation_method: tarkib
      justification: >
        إحياء للمصطلح الكلاسيكي مِنْطِيق (وزن مِفْعِيل) الوارد في معاجم اللغة بمعنى
        "البليغ" وأُعيد توظيفه في المصادر المعجمية الحديثة بمعنى "العالِم بالمنطق"
        (مقابل logician)، موصوفاً بـ رَمْزِيّ لتمييز التخصص الدقيق. يُعدّ إحياءً
        للفظ كلاسيكي بديلاً عن توليد جديد.

    - lemma: "مَنْطِقِيٌّ رِيَاضِيٌّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي يستند إلى الترادف المعجمي الموثَّق بين المنطق الرمزي والمنطق
        الرياضي؛ إذ يُعرَّف الأخير في مصادر عربية متعددة بأنه "تطوير حديث للمنطق
        الصوري قِوامُه تمثيل المسائل المنطقية بالرموز"، وهو التعريف ذاته للمنطق
        الرمزي. يُعبِّر رِيَاضِيّ عن البُعد الحسابي-الرمزي للمجال.

  # ب. التقييم الأولي بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة «منطقي رمزي» مكتوبة بلا تشكيل — تحتاج update_lemma بتشكيل كامل."
      - "المجموعة تضمّ لمّة واحدة فحسب؛ لا يُوجد في المعجمية العربية مصطلح أحادي الكلمة راسخ لـ«symbolic logician» مما يُعدّ ثغرةً معجمية."
      - "غياب أي تعريف عربي بأسلوب المعجم؛ التعريف الحالي ترجمة بسيطة للتعريف الإنجليزي."
    observations: >
      المجموعة awn4-10705070-n تُمثِّل مفهوماً أكاديمياً دقيقاً هو الشخص المتخصص في
      المنطق الرمزي (symbolic logic). اللمّة المستخدمة «منطقي رمزي» تتبع نمط التركيب
      الوصفي العربي المعيار (nisba + qualifier)، وهو النمط نفسه المُعتمَد في توصيف
      المتخصصين في حقول فرعية (فيزيائيٌّ نوويٌّ، منطقيٌّ حملِيٌّ). العلاقة بالمتشابه
      الأعلى (منطقي / عالم منطق) علاقة تضمين سليمة. المشكلة الرئيسية تقنية: غياب التشكيل.
      المصطلح صحيح دلالياً وقياسياً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — Batch headword lookup (all lemmas + candidates + components)
#   Q2 — English bridge: "symbolic logician", "logician", "symbolic logic"
#   Q3 — Arabic FTS: "منطقي" + "مناطقة" + "المنطق الرمزي" + "المنطق الصوري"
#   Q4 — Component lookup: "منطيق" + "منطق رمزي" + "صوري"
#   Q5 — Maqayis al-Lugha: roots نطق و رمز
stage2_evidence:
  per_lemma:

    - lemma: "منطقي رمزي"
      expands:
        - text: "«الْمَنْطِقُ الرَّمْزِيُّ أو الرياضى Logique symbolique: ضَربٌ من المَنْطق
            الصُّورىِّ — الذى يبحث في الأحكام والبراهين من حيث صُورتها بصرف النَّظر عن
            مادتها — يبحث في القواعد العامَّة والرُّموز الدَّالَّة عليها. وهو مَنْطِقٌ
            يعتَمِد على طائِفَة من الرُّموز والإشارات لأداء المعانى والأَحكام بدلاً من
            الألفاظ والعبارات اتِّقاءً لغموضها والتباسها، ويخضع لقوانين معيَّنة.»"
          source: "المعجم الكبير (OCR)"
          addition: >
            يُثبِت أن «المنطق الرمزي» حقلٌ معجمياً موثَّق ومُعرَّف في المعجم الكبير؛
            واللمّة «منطقي رمزي» تعني المتخصص في هذا الحقل، وهو التعريف الضمني الذي
            يدعم التركيب الوصفي.
        - text: "«المَنْطِق الرمزيّ أو الرِّياضيّ: تطوير حديث للمنطق الصُّوريّ قِوامُهُ
            تمثيل المسائل المنطقية بالرّموز.»"
          source: "المورد الحديث (2008)"
          addition: >
            يُؤكِّد مساواةَ المنطق الرمزي بالمنطق الرياضي في المصادر العربية المعاصرة،
            مما يُرسّخ المصطلح ويُجيز المرادفة مع «منطقي رياضي».
        - text: "«تمثيلُ قوانينِ التفكير. سُمّيَ هكذا لأن الرموزَ تُستخدَمُ بدلاً من
            تعابير اللغات الطبيعية في التعبير عن الاقتراحات والعلاقات.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: >
            تعريف موسوعي للمنطق الرمزي يُبيِّن طبيعة الفرق الدلالي الذي يُميِّز
            «المنطقي الرمزي» عن المنطقي العام.

    - lemma: "مَنْطِقِيٌّ صُورِيٌّ"
      expands:
        - text: "«المَنْطِق الصُّوْري؛ المنطِق الشَّكليّ.» (مقابل formal logic)"
          source: "المورد الحديث (2008)"
          addition: >
            يُثبِت أن «الصوري» مرادف «الرمزي» لوصف هذا الضرب من المنطق، مما يُجيز
            نظرياً «منطقي صوري» مقابلاً لـ symbolic logician، غير أن «الرمزي» أكثر
            شيوعاً في المصادر العربية لهذا التخصص تحديداً.

    - lemma: "مِنْطِيقٌ رَمْزِيٌّ"
      confirm:
        - text: "«المِنْطيق: العالِم بالمنطق.»"
          source: "المورد الحديث (2008)"
        - text: "«(المنطيق) البليغ والمرأة تعظم عجزها بحشية»"
          source: "المعجم الوسيط"
        - text: "«الْمِنْطِيقُ: البليغ المرأة تعظِّمُ عَجُزَها بِحشِيَّة»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«والمِنْطِيق الذي يقول قولاً فيجيد فيه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: >
            يُثبِت وجود المصطلح الكلاسيكي مِنْطِيق لكنه يُشير إلى دلالة «البليغ» لا
            «العالِم بالمنطق الفلسفي» بالمعنى التقني؛ المورد الحديث وحده يُطوِّر المعنى
            نحو «العالم بالمنطق».

    - lemma: "مَنْطِقِيٌّ رِيَاضِيٌّ"
      expands:
        - text: "«المَنْطِق الرمزيّ أو الرِّياضيّ: تطوير حديث للمنطق الصُّوريّ قِوامُهُ
            تمثيل المسائل المنطقية بالرّموز.»"
          source: "المورد الحديث (2008)"
          addition: >
            يُؤكِّد أن «المنطق الرمزي» و«المنطق الرياضي» مصطلحان متبادلان في العربية،
            مما يُجيز نظرياً «منطقي رياضي» للشخص ذاته، غير أن المصطلح ليس مدخلاً
            معجمياً مستقلاً.

    - lemma: "عَالِمُ الْمَنْطِقِ الصُّورِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "منطقي رمزي"
      decision: confirmed
      decision_reason: >
        المصطلح صحيح دلالياً وقياسياً؛ يتبع نمط التركيب الوصفي (wasfi) المعيار في
        العربية لاشتقاق اسم المتخصص في حقل فرعي (مَنْطِقِيّ نسبةً إلى المَنْطِق +
        رَمْزِيّ مُخصِّصاً للتخصص الدقيق). الحقل «المنطق الرمزي» موثَّق معجمياً في
        المعجم الكبير والمورد وغيرهما. تحتاج اللمّة تشكيلاً كاملاً: مَنْطِقِيٌّ رَمْزِيٌّ.
      evidence_assessment:
        case: mixed
        note: >
          لا يوجد مدخل معجمي مباشر للمركّب «منطقي رمزي» بوصفه شخصاً، لكن الحقل المُشار
          إليه موثَّق توثيقاً جيداً، والتركيب الوصفي قياسي في العربية لاشتقاق المتخصص
          من اسم التخصص.
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      morphological_check: >
        وزن مَنْطِقِيّ: نسبة من مَنْطِق (مَفْعِل) على فَعْلِيّ → صحيح.
        وزن رَمْزِيّ: نسبة من رَمْز (فَعْل) على فَعْلِيّ → صحيح.
        التركيب الوصفي (موصوف + صفة): مَنْطِقِيٌّ رَمْزِيٌّ → طبيعي تماماً في المصطلحية.
      loan_check:
        lexical_borrowing: مصطلح عربي أصيل، لا اقتراض
        blind_translation: لا حرفية عمياء؛ «رمزي» مقابل symbolic صحيح دلالياً
        calque: لا ينطبق
      nuance_differentiation: >
        يتميّز من أخيه الأعلى (منطقي / عالم منطق) بالتخصص في المنطق الرمزي تحديداً،
        أي في الضرب الذي يستعيض عن الألفاظ الطبيعية بأنظمة رمزية رياضية. والمجموعة
        لا تضمّ غيره من اللمّات المؤكَّدة، فالفرق بينه وبين أخواته الداخلية هو التدقيق
        في الوصف لا اختلاف الدلالة الجوهرية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنْطِقِيٌّ رَمْزِيٌّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مَنْطِقِيٌّ صُورِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «الصوري» مرادف «الرمزي» في بعض السياقات، لكن «الرمزي» هو المصطلح المستقر
        معجمياً لهذا الحقل في المصادر العربية الفلسفية والمعلوماتية. إضافة «منطقي صوري»
        ستُنشئ تكراراً دلالياً دون فائدة تمييزية واضحة، ولا وجود لمدخل معجمي مستقل
        لهذا المركّب بمعنى «symbolic logician».
      evidence_assessment:
        case: no_material

    - lemma: "عَالِمُ الْمَنْطِقِ الصُّورِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ المعجمي: يمكن إبدال «الصوري» بـ«الرمزي» أو «الرياضي»
        والتعبير لا يزال وصفاً حرّاً صحيحاً، وهذا يعني أنه ليس وحدةً معجمية ثابتة.
        كما أنه عبارة وصفية مرتجلة لا مصطلح مسكوك. لا أدلة معجمية على تثبيته.
      evidence_assessment:
        case: no_material

    - lemma: "مِنْطِيقٌ رَمْزِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        المِنطيق مصطلح كلاسيكي جميل لكن دلالته الأصلية «البليغ» لا «العالم بالمنطق
        الفلسفي»؛ توظيفه بالمعنى التقني حديث ومحدود (المورد الحديث وحده). يمزج بين
        مستويين سجلّيين: الكلاسيكي (منطيق) والمعاصر (رمزي)، مما يُنتج توتراً أسلوبياً.
        وليس مدخلاً مستقلاً للشخص المتخصص في المنطق الرمزي.
      evidence_assessment:
        case: mixed

    - lemma: "مَنْطِقِيٌّ رِيَاضِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن «المنطق الرياضي» مرادف للمنطق الرمزي في بعض السياقات، إلا أن
        «mathematical logician» و«symbolic logician» مفهومان متمايزان في الفلسفة
        المعاصرة؛ الأول يُركِّز على الأسس الرياضية للمنطق، والثاني أوسع يشمل المنطق
        الرمزي بكل أشكاله. إضافته ستُوقِع في خلط دلالي.
      evidence_assessment:
        case: mixed


