# مراجعة المجموعة الترادفية — awn4-14001480-n
# a public disturbance / اضطراب عام
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان «حادثة» و«واقعة» عامّتان جداً: دلالتهما الأصلية «حدث/نازلة» لا تختصّ بالاضطراب العام بل تشمل أيّ واقعة."
      - "التعريف العربي «اضطراب عام» مقتضب ولا يميّز المفهوم عن أبيه «ثوران أو صخب غير منظم» بوضوح كافٍ."
      - "غياب لمّة مخصّصة لمعنى الشغب أو الاضطراب العام رغم ثراء المعجم العربي في هذا الحقل."
    observations: >
      المجموعة تمثّل مفهوم «الحادثة بوصفها اضطراباً عامّاً» (incident = public disturbance)،
      وهو أضيق من مطلق الحدث أو الواقعة. يحتاج الحقل إلى لمّة أدقّ ترتبط مباشرة بتهييج الشرّ
      والاضطراب الجماعي، مثل «شَغَب» الذي تجمع المعاجم على دلالته في هذا الباب.
  blind_candidates:
    - lemma: "فِتْنَة"
      generation_method: ishtiqaq
      justification: "من جذر ف ت ن، تدلّ على الابتلاء والاضطراب وبلبلة الأفكار، وتُستعمل في سياق الفتن العامة والفوضى."
    - lemma: "هَوْجَة"
      generation_method: ishtiqaq
      justification: "من جذر هـ و ج، تدلّ على الهيجان والفوضى العامة والاندفاع بلا تدبّر."
    - lemma: "شَغَب"
      generation_method: ishtiqaq
      justification: "من جذر ش غ ب، يدلّ على تهييج الشرّ وإثارة الفتن والاضطراب والجلبة، وهو أقرب مصطلح عربي لمفهوم الاضطراب العام."
    - lemma: "بَلْبَلَة"
      generation_method: ishtiqaq
      justification: "من جذر ب ل ب ل، تدلّ على تفريق الآراء وإيقاع القوم في الاضطراب والتشتّت."


stage2_evidence:
  per_lemma:
    - lemma: "حَادِثَة"
      confirm:
        - text: "«(الْحَادِثَة) مؤنث الْحَادِث والنائبة (ج) حوادث»"
          source: "المعجم الوسيط"
        - text: "«الحادثة: هي الواقعة التي احتيج فيها إلى الاستفتاء لدقَّتها»"
          source: "التعريفات الفقهيّة للبركتي"
      expands:
        - text: "«بَاب حوادث الدَّهْر: صروف وحوادث وطوارق ونوب وملمات ونوازل وبوائق وخطوب وعوادي ومصائب»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
          addition: "حوادث الدهر تشمل النوازل والملمّات، وهي أعمّ من الاضطراب العام"

    - lemma: "وَاقِعَة"
      confirm:
        - text: "«(الْوَاقِعَة) الْقِيَامَة والنازلة من صروف الدَّهْر والمصادمة وَهِي اسْم من الْوَقْعَة بِالْحَرْبِ وَهِي الصدمة بعد الصدمة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(فِي الفلسفة) مَا حدث وَوجد (مج)»"
          source: "المعجم الوسيط"
          addition: "في الفلسفة الحديثة توسّعت الدلالة لتشمل كلّ ما حدث ووُجد"

    - lemma: "شَغَب"
      confirm:
        - text: "«(الشغب) تهييج الشَّرّ وإثارة الْفِتَن وَالِاضْطِرَاب والجلبة وَالْخِصَام»"
          source: "المعجم الوسيط"
        - text: "«الشَّغْبُ بِالتَّسْكِينِ تَهْيِيجُ الشَّرِّ»"
          source: "مختار الصحاح للرازي"
        - text: "«الشَّغْبُ: تهييج الشر. ويقال للأتانِ: ذاتُ شَغْبٍ وضِغْنٍ»"
          source: "كتاب العين للخليل"
        - text: "«الشِّينُ وَالْغَيْنُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَهْيِيجِ الشَّرِّ، لَا يَكُونُ فِي خَيْرٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«الشَّغْبُ بِسُكُونِ الغَين: تَهيِيج الشَّرِّ والفِتْنة وَالْخِصَامِ»"
          source: "النهاية في غريب الحديث لابن الأثير"
      expands:
        - text: "«شغَب الرَّجُلُ: أحدث فتنةً وجَلَبةً — مكافحة الشَّغب»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "يُستعمل في السياق المعاصر تحديداً للاضطرابات العامة (مكافحة الشغب)"

    - lemma: "فِتْنَة"
      confirm:
        - text: "«(الْفِتْنَة) الاختبار بالنَّار والابتلاء ... وَالِاضْطِرَاب وبلبلة الأفكار»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الْفَاءُ وَالتَّاءُ وَالنُّونُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاءٍ وَاخْتِبَارٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الدلالي للجذر هو الابتلاء والاختبار لا الاضطراب، والاضطراب معنًى فرعيّ متأخّر"
        - text: "«الفِتْنَة: الخِيرة والابتلاء، ما اشتبه فيه الحقُّ والصواب»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "دلالة الفتنة الأولى هي الامتحان والابتلاء لا الاضطراب العام"

    - lemma: "هَوْجَة"
      evidence_status: "no_material_found"

    - lemma: "بَلْبَلَة"
      contradicts:
        - text: "«البلبلة: حركة القلب من حزن أو حب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الدلالة نفسية داخلية (حركة القلب) لا اضطراب عام خارجي"
        - text: "«شدة الهم, والوسواس في الصدر»"
          source: "المعجم الكبير"
          conflict: "تدلّ على الهمّ والوسوسة الداخلية لا على الاضطراب العام"
      expands:
        - text: "«بَلْبَلَة: من (ب ل ب ل) تفريق وتبديد المتاع، وإيقاع القوم في افتراق الآراء»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "هناك دلالة على تفريق الآراء والاختلاف، لكنها تبقى دون مستوى الاضطراب العام"


stage3_analysis:
  per_lemma:
    - lemma: "حَادِثَة"
      decision: confirmed
      decision_reason: >
        «حادثة» لمّة عربية فصيحة ثابتة في المعاجم بمعنى النائبة والأمر الطارئ.
        وإن كانت عامّة الدلالة، فإنها تُستعمل في العربية المعاصرة بمعنى الواقعة المثيرة للاهتمام
        (incident)، وهو ما يوافق المعنى الإنجليزي. ثبتت في المعجم الوسيط والكبير والبركتي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تدلّ على الحَدَث الطارئ والنائبة عموماً، وتُستعمل في سياق الإبلاغ عن الوقائع
        (حادثة مرورية، حادثة أمنية)، وتركّز على الطابع المستجدّ والمفاجئ للحدث.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَادِثَة"

    - lemma: "وَاقِعَة"
      decision: confirmed
      decision_reason: >
        «واقعة» لمّة فصيحة ثابتة بمعنى النازلة والمصادمة، وهي اسم من الوقعة بالحرب.
        دلالتها على المصادمة والصدمة تجعلها ملائمة للاضطراب العام. ثبتت في المعجم الوسيط.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تدلّ على النازلة الثقيلة والمصادمة، وتحمل إيحاءً بالوقوع الفعلي والتحقّق،
        وترتبط تاريخياً بالحروب والأحداث الكبرى (واقعة بدر، واقعة الطفّ).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَاقِعَة"

    - lemma: "شَغَب"
      source: stage1
      decision: confirmed
      decision_reason: >
        «شَغَب» هو الأقرب دلالياً لمفهوم «الاضطراب العام» (public disturbance).
        تجمع المعاجم العربية قاطبةً — من كتاب العين إلى المعاصر — على أنه «تهييج الشرّ
        وإثارة الفتن والاضطراب والجلبة والخصام». ويُستعمل معاصراً في تعبير «مكافحة الشغب»
        للدلالة تحديداً على الاضطرابات العامة. جذره أصل صحيح لا يكون في خير (ابن فارس).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ تحديداً على تهييج الشرّ والفوضى بين الناس، وهو أخصّ من «حادثة» و«واقعة»
        في الدلالة على الاضطراب الجماعي العلني. يُستعمل معاصراً في سياقات أمنية وسياسية.
      actions:
        - command: create_entry
          params:
            lemma: "شَغَب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "فِتْنَة"
      source: stage1
      decision: removed
      decision_reason: >
        «فتنة» شديدة التعدّد الدلالي: أصلها الابتلاء والاختبار بالنار (ابن فارس)،
        وتتراوح معانيها بين الاختبار والإعجاب والتولّه والعذاب والضلال والاضطراب.
        إدراجها في مجموعة «الاضطراب العام» يُوقع اشتراكاً لفظياً مضلّلاً.
      evidence_assessment:
        case: mixed

    - lemma: "هَوْجَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية في قاعدة البيانات. اللفظة عامّية أو محدودة الاستعمال،
        ولا تثبت في المعاجم الفصيحة المعتمدة.
      evidence_assessment:
        case: no_material

    - lemma: "بَلْبَلَة"
      source: stage1
      decision: removed
      decision_reason: >
        دلالة «بلبلة» الأصلية نفسية داخلية (حركة القلب من حزن أو حبّ، شدة الهمّ والوسواس).
        وإن وُجد معنى تفريق الآراء، فهو لا يرقى إلى مستوى الاضطراب العام الفعلي.
      evidence_assessment:
        case: contradicts_only


