stage1_review:
  assessment:
    concerns:
      - "المجموعة الترادفية تمثل اسم علم أعجمي لشخصية تاريخية، وهو ما يندر وجوده في المعاجم اللغوية العربية الكلاسيكية."
    observations: "اللمّات الحالية هي نقل صوتي (تعريب) دقيق لاسم المعماري النمساوي 'Josef Hoffmann'. جرت العادة في الموسوعات العربية كتابة 'Josef' كـ 'جوزيف' أو 'يوزيف'."
  blind_candidates:
    - lemma: "جُوزِيف هُوفْمَان"
      generation_method: taarib
      justification: "التعريب الشائع للاسم الشخصي والعائلي للمعماري."
    - lemma: "هُوفْمَان"
      generation_method: taarib
      justification: "الاكتفاء باسم العائلة للتعريف به اختصاراً كما هو شائع في الأعلام."
    - lemma: "يُوزِيف هُوفْمَان"
      generation_method: taarib
      justification: "التعريب الأقرب للفظ الألماني (النمساوي) للاسم الأول."
    - lemma: "جُوزِيف هُوفمَان الْمِعْمَارِيّ"
      generation_method: tarkib
      justification: "إضافة صفة معمارية لتمييزه عن شخصيات أخرى تحمل نفس الاسم."

