# مراجعة المجموعة الترادفية: awn4-10490364-n (priest / قس، كاهن)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (قس، كاهن) مسجّلتان بدون تشكيل"
      - "لمّة «كاهن» في التراث العربي الإسلامي تدلّ أساساً على المتنبّئ والعرّاف، لا على رجل الدين المسيحي، وإن كان المعجم الوسيط يقرّ المعنى المسيحي"
      - "غياب لمّة «قِسِّيس» وهي الصيغة القرآنية الواردة في سورة المائدة"
    observations: "المجموعة تمثّل مفهوم الكاهن المسيحي (priest) بوصفه رتبة كهنوتية. اللمّتان الموجودتان صحيحتان جوهرياً لكنهما تحتاجان إلى تشكيل. لفظ «قَسّ» عربيّ أصيل من جذر (قسس) بمعنى تتبّع الشيء، ثم غلب على رئيس النصارى في العلم. أمّا «كاهن» فمن جذر (كهن) وأصله في العربية الكلاسيكية العرّاف والمتنبّئ، ثم استُعمل في العصر الحديث للدلالة على من ارتقى إلى درجة الكهنوت عند أهل الكتاب."
  blind_candidates:
    - lemma: "قِسِّيس"
      generation_method: ishtiqaq
      justification: "صيغة فِعِّيل من جذر (قسس)، وهي الصيغة القرآنية الواردة في قوله تعالى: ﴿ذَلِكَ بِأَنَّ مِنْهُمْ قِسِّيسِينَ وَرُهْبَانًا﴾، وتدلّ على العالِم العابد من النصارى"
    - lemma: "كَاهِن"
      generation_method: ishtiqaq
      justification: "اسم فاعل من (كَهَنَ) على وزن فاعِل، يُستعمل في العربية المعاصرة للدلالة على من ارتقى إلى درجة الكهنوت في الكنائس المسيحية"
    - lemma: "خُورِيّ"
      generation_method: taarib
      justification: "لفظ من اليونانية (χωρεπίσκοπος) عبر السريانية، معناه مدبّر القرية، ويُطلق على كاهن الرعية عند مسيحيّي المشرق"
    - lemma: "حَبْر"
      generation_method: majaz
      justification: "أصله العالِم ذو الأثر الحسن، ثم أُطلق مجازاً على رجال الدين من أهل الكتاب (أحبار اليهود والنصارى)"

stage2_evidence:
  per_lemma:
    - lemma: "قَسّ"
      confirm:
        - text: "«القَسُّ، مثلثةً: تَتَبُّعُ الشيءِ، وطَلَبُه، كالتَّقَسُّسِ، والنَّميمَةُ، وبالفتح: صاحِبُ الإِبِلِ الذي لا يُفارِقُها، ورئيسُ النصارى في العِلْمِ، كالقِسِّيسِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«القس والقسيس: العالم العابد من النصارى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«كاهن؛ قِسِّيس؛ قَسّ»"
          source: "المورد الحديث (ترجمة priest)"
      expands:
        - text: "«(قَسَّ) الْقَافُ وَالسِّينُ مُعْظَمُ بَابِهِ تَتَبُّعُ الشَّيْءِ، وَقَدْ يَشِذُّ عَنْهُ مَا يُقَارِبُهُ فِي اللَّفْظِ. قَالَ عُلَمَاؤُنَا: الْقَسُّ: تَتَبُّعُ الشَّيْءِ وَطَلَبُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي للجذر هو التتبع والطلب، ومنه سُمّي رئيس النصارى لتتبعه أمور الدين"

    - lemma: "كَاهِن"
      confirm:
        - text: "«(الكاهن) كل من يتعاطى علماً دقيقاً ومن العرب من كان يُسمّى المنجم والطبيب كاهناً والذي يقوم بأمر الرجل ويسعى في حاجته وعند اليهود والنصارى من ارتقى إلى درجة الكهنوت وعند أصحاب الديانات الأخرى من غير المسلمين من ساغ له أن يقدم الذبائح والقرابين ويتولى الشعائر الدينية»"
          source: "المعجم الوسيط"
        - text: "«الكاهن؛ القَسّ — رَجُل الدين»"
          source: "المورد الحديث (ترجمة clergyman)"
      contradicts:
        - text: "«الكاهن: هو الذي يخبر عن الكوائن في مستقبل الزمان، ويدعي معرفة الأسرار ومطالعة علم الغيب»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "المعنى الكلاسيكي الأصلي هو العرّاف والمتنبّئ لا رجل الدين المسيحي"
        - text: "«الكاهن: هو المُخبر عن الكوائن في المستقبل والمدعي معرفةَ الأسرار ومعالمَ علم الغيب مستمدَاً من الشياطين والأجنَّة»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "التعريف الفقهي يربط الكهانة بالاستعانة بالجن والشياطين، وهو معنى سلبي مغاير تماماً"
      expands:
        - text: "«(كَهَنَ) الْكَافُ وَالْهَاءُ وَالنُّونُ كَلِمَةٌ وَاحِدَةٌ. وَهِيَ الْكَاهِنُ، وَقَدْ تَكَهَّنَ يَتَكَهَّنُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس لم يفصّل المعنى مما يدلّ على شيوع المفهوم وبداهته"

    - lemma: "قِسِّيس"
      confirm:
        - text: "«(القسيس) القس (ج) قساوسة وقساقسة وقسيسون»"
          source: "المعجم الوسيط"
        - text: "«القِسِّيسُ: القَسُّ»"
          source: "المعجم الوسيط (طبعة OCR)"
        - text: "«قِسِّيس: من (ق س س) القس وهو رئيس من رؤساء النصارى في الدين»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«كاهن؛ قِسِّيس؛ قَسّ»"
          source: "المورد الحديث (ترجمة priest)"

    - lemma: "خُورِيّ"
      confirm:
        - text: "«الخُورِيّ: كاهِنُ النَّصارَى, الذى يَخْدِم القَرْيَة. يونانيّة معناها مُدَبِّرُ القَرْيَة»"
          source: "المعجم الكبير"
      expands:
        - text: "«خُورِيّ: من (خ و ر) ... والخوري عند المسيحيين: راعي الكنيسة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُضيف معنى راعي الكنيسة وينسبه إلى جذر (خور) العربي وإن كان الأصل يونانياً"

    - lemma: "حَبْر"
      contradicts:
        - text: "«(الحبر) الْعَالم (ج) أَحْبَار وحبور وسفر الْأَحْبَار»"
          source: "المعجم الوسيط"
          conflict: "الحَبْر يُستعمل للعالِم عموماً وغلب على علماء اليهود (أحبار اليهود)، ولا يختصّ بالكاهن المسيحي"
      expands:
        - text: "«(حَبَرَ) الْحَاءُ وَالْبَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ مُنْقَاسٌ مُطَّرِدٌ، وَهُوَ الْأَثَرُ فِي حُسْنٍ وَبَهَاءٍ... فَيُقَالُ لِلَّذِي يَكْتُبُ بِالْحِبْرِ حِبْرٌ وَحَبْرٌ، وَهُوَ الْعَالِمُ، وَجَمْعُهُ أَحْبَارٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي هو الأثر في حُسن، ومنه سُمّي العالِم حِبراً لأثره الحسن في الناس"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "قَسّ"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل من جذر (قسس) ثابت في المعاجم الكلاسيكية والحديثة بمعنى رئيس النصارى في العلم. اللمّة الأصلية بدون تشكيل فتحتاج تحديثاً"
