      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ دلالةً من «قَسّ»، يشمل الكهنة في اليهودية والمسيحية وغيرها من الديانات غير الإسلامية، وله ظلال المعنى القديم (العرّاف) في بعض السياقات الإسلامية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَاهِن"

    # ── مرشحات المرحلة ١ ──
    - lemma: "قِسِّيس"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة قرآنية فصيحة وردت في سورة المائدة (الآية ٨٢)، مثبتة في المعجم الوسيط والقاموس المحيط بوصفها مرادفاً للقَسّ. المورد الحديث يوردها ترجمةً لـ priest. جموعها: قساوسة وقساقسة وقسيسون"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الصيغة الفصحى الرفيعة ذات الأصل القرآني، تحمل دلالة التبتّل والعبادة أكثر من «قَسّ»، وتُستعمل في السياقات الأدبية والدينية الرسمية"
      actions:
        - command: create_entry
          params: {lemma: "قِسِّيس", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "كَاهِن"
      source: stage1
      decision: removed
      decision_reason: "مكرّرة مع اللمّة الموجودة «كاهن» — لا حاجة لإضافتها"

    - lemma: "خُورِيّ"
      source: stage1
      decision: removed
      decision_reason: "لفظ معرّب من اليونانية عبر السريانية، مقصور على كاهن الرعية (القرية) في الكنائس الشرقية. دلالته أضيق من المفهوم المطلوب (priest عموماً)، وانتشاره محدود خارج المشرق العربي المسيحي"

    - lemma: "حَبْر"
      source: stage1
      decision: removed
      decision_reason: "الحَبْر في الاستعمال المعجمي يغلب على العالِم عموماً وعلى علماء اليهود خصوصاً (أحبار اليهود)، ولا يختصّ بالكاهن المسيحي. إضافته ستُحدث خلطاً دلالياً مع المجموعات الترادفية الخاصة بالحاخام والعالِم"

