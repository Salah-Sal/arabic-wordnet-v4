stage1_review:
  assessment:
    concerns:
      - "المصطلح يشير إلى مفهوم خاص بكرة القدم الأمريكية (Secondary) وقد يكون غريباً على الثقافة العربية التي تعتمد مصطلحات كرة القدم (Soccer)."
      - "استخدام (الدفاع الثانوي) هو ترجمة حرفية للمصطلح الإنجليزي، في حين أن المصطلحات الشائعة هي (خط الدفاع الخلفي) أو (الظهير)."
    observations: "المفهوم يدل على خط الدفاع الثاني أو اللاعبين المتمركزين خلف خط الدفاع الأول. يمكن التعبير عنه بمركبات إضافية ووصفية."
  blind_candidates:
    - lemma: "خَطُّ الدِّفَاعِ الخَلْفِيّ"
      generation_method: tarkib
      justification: "تعبير وصفي دقيق لموقع اللاعبين خلف خط الدفاع الأول."
    - lemma: "ظَهِيرُ دِفَاعٍ"
      generation_method: ishtiqaq
      justification: "الظهير في اللغة هو المعين والذي يكون في الخلف، ويستخدم رياضياً للاعب الدفاع."
    - lemma: "مُؤَخَّرَةُ الدِّفَاعِ"
      generation_method: tarkib
      justification: "مركب إضافي يشير إلى الجزء الخلفي من تشكيلة الدفاع."
    - lemma: "دِفَاعٌ ثَانَوِيّ"
      generation_method: taarib
      justification: "ترجمة دلالية للمصطلح الأجنبي (Secondary) في السياق الرياضي."

stage2_evidence:
  per_lemma:
    - lemma: "الدفاع الثانوي"
      evidence_status: "no_material_found"
    - lemma: "ظهير دفاع"
      confirm:
        - text: "(1) ثانَويّ (2) شيء ثانوي (3) .أ» ظهير دفاع [في كرة القدم]. .ب» وكيل؛ مندوب؛ مساعد"
          source: "Al-Mawrid Al-Hadeeth"
    - lemma: "خط الدفاع الخلفي"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الدفاع الثانوي"
      decision: confirmed
      decision_reason: "مصطلح مقبول رياضياً لترجمة (Secondary defense) كونه يصف طبيعة الخط الدفاعي الثاني."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الدِّفَاع الثَّانَوِيّ"

    - lemma: "ظَهِيرُ دِفَاعٍ"
      source: stage1
      decision: confirmed
      decision_reason: "مثبت في المعاجم الحديثة كترجمة للمصطلح الإنجليزي (Secondary) في سياق كرة القدم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "ظَهِيرُ دِفَاعٍ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "خَطُّ الدِّفَاعِ الخَلْفِيّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك اصطلاحياً بشكل قاطع، ويكفي الاعتماد على ظهير الدفاع والدفاع الثانوي."

    - lemma: "مُؤَخَّرَةُ الدِّفَاعِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير غير شائع الاستخدام في السياق الرياضي."

    - lemma: "دِفَاعٌ ثَانَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "مكرر مع اللمة الموجودة مسبقاً (الدفاع الثانوي)."

stage4_content:
  definition:
    current: "لاعبو الدفاع في كرة القدم الذين يصطفون خلف لاعبي الخط"
    assessment:
      decision: revise
      reason: "صياغة التعريف ليكون أكثر دقة واحترافية ليصف الخط الخلفي من الدفاع."
    authored:
      - type: terminological
        text: "الخط الخلفي من لاعبي الدفاع في رياضة كرة القدم، ويتمركزون خلف خط الدفاع الأول لحماية المرمى."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "الخط الخلفي من لاعبي الدفاع في رياضة كرة القدم، ويتمركزون خلف خط الدفاع الأول لحماية المرمى."

  examples:
    per_lemma:
      - lemma: "الدِّفَاع الثَّانَوِيّ"
        examples:
          - text: "اخترق المهاجم الدفاع الثانوي للفريق الخصم وسجل هدفاً."
            type: usage
      - lemma: "ظَهِيرُ دِفَاعٍ"
        examples:
          - text: "يلعب ظهير الدفاع دوراً حيوياً في إحباط الهجمات المرتدة."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اخترق المهاجم الدفاع الثانوي للفريق الخصم وسجل هدفاً."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يلعب ظهير الدفاع دوراً حيوياً في إحباط الهجمات المرتدة."

stage5_enrichment:
  per_entry:
    - lemma: "الدِّفَاع الثَّانَوِيّ"
      entry_id: "{auto}"
      roots:
        - word: "الدفاع"
          root: "دفع"
          maqayis_quote: "«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ.»"
        - word: "الثانوي"
          root: "ثني"
          maqayis_quote: "«الثَّاءُ وَالنُّونُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَكْرِيرُ الشَّيْءِ مَرَّتَيْنِ، أَوْ جَعْلُهُ شَيْئَيْنِ مُتَوَالِيَيْنِ أَوْ مُتَبَايِنَيْنِ.»"
    - lemma: "ظَهِيرُ دِفَاعٍ"
      entry_id: "{auto}"
      roots:
        - word: "ظهير"
          root: "ظهر"
          maqayis_quote: "«الظَّاءُ وَالْهَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى قُوَّةٍ وَبُرُوزٍ... وَالظَّهِيرُ: الْمُعِينُ، كَأَنَّهُ أَسْنَدَ ظَهْرَهُ إِلَى ظَهْرِكَ.»"
        - word: "دفاع"
          root: "دفع"
          maqayis_quote: "«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ.»"

  per_sense:
    - lemma: "الدِّفَاع الثَّانَوِيّ"
      sense_id: "{auto}"
      nuance: "تعبير شامل يدل على خط الدفاع الثاني بأكمله، وهو ترجمة حرفية شائعة."
      mwe: true
    - lemma: "ظَهِيرُ دِفَاعٍ"
      sense_id: "{auto}"
      nuance: "يركز على وظيفة اللاعبين في التغطية والإعانة الدفاعية، ومثبت معجمياً."
      mwe: true

  synset:
    cultural_fit: lexical_gap

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"الدفاع","root":"دفع","maqayis":"«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ.»"},{"word":"الثانوي","root":"ثني","maqayis":"«الثَّاءُ وَالنُّونُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَكْرِيرُ الشَّيْءِ مَرَّتَيْنِ، أَوْ جَعْلُهُ شَيْئَيْنِ مُتَوَالِيَيْنِ أَوْ مُتَبَايِنَيْنِ.»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"ظهير","root":"ظهر","maqayis":"«الظَّاءُ وَالْهَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى قُوَّةٍ وَبُرُوزٍ... وَالظَّهِيرُ: الْمُعِينُ، كَأَنَّهُ أَسْنَدَ ظَهْرَهُ إِلَى ظَهْرِكَ.»"},{"word":"دفاع","root":"دفع","maqayis":"«الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبير شامل يدل على خط الدفاع الثاني بأكمله، وهو ترجمة حرفية شائعة.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على وظيفة اللاعبين في التغطية والإعانة الدفاعية، ومثبت معجمياً.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"lexical_gap"}'
    - command: set_confidence
