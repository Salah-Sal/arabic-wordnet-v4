        - text: "«الْعَيْنُ وَالْيَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ، فِيهِ كَلِمَتَانِ: إِحْدَاهُمَا الْعَيْبُ... فَالْعَيْبُ فِي الشَّيْءِ مَعْرُوفٌ. تَقُولُ: عَابَ فُلَانٌ فُلَانًا يَعِيبُهُ. وَرِجْلٌ عَيَّابَةٌ: وَقَّاعٌ فِي النَّاسِ»"
