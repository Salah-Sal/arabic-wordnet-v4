stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (عيب، نقيصة) بلا تشكيل"
      - "لفظ «عيب» عامّ جدًّا يشمل عيوب الأشياء والأجسام والأخلاق، وقد يحتاج إلى تمييز أدقّ"
      - "التعريف العربي يستخدم لفظ «عيب» وهو أحد لمّات المجموعة ذاتها — دوران معجمي"
    observations: >-
      المجموعة تمثّل مفهوم النقص الخُلُقي الراسخ في طبع الإنسان، وهو مفهوم أصيل في الثقافة العربية
      ثريّ بالألفاظ. الأفصل (hypernym) هو «عيب أو نقطة ضعف» بلمّات (زلة، ضعف، نقص).
      المجموعة الحالية تحتاج إلى إثراء بلمّات تخصّ العيب الخُلقيّ تحديدًا.
  blind_candidates:
    - lemma: "مَثْلَبَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ثلب) على وزن مَفْعَلَة، تدلّ على العيب المُخزي الذي يُثلَب به صاحبه. قال ابن فارس: ثَلَبْتُهُ إذا عِبْتَهُ"
    - lemma: "وَصْمَة"
      generation_method: majaz
      justification: "أصل الوَصْم الصَّدْع غير البائن في القناة، ثم استُعمل مجازًا للعيب والعار في الخُلق. فيه إزاحة دلالية من الكسر الحسّيّ إلى النقص المعنويّ"
    - lemma: "مَنْقَصَة"
      generation_method: ishtiqaq
      justification: "من الجذر (نقص) على وزن مَفْعَلَة، تدلّ على ما يُنقِص من قدر الإنسان وكمال خُلُقه"
    - lemma: "شَائِبَة"
      generation_method: majaz
      justification: "أصل الشَّوْب الخلط، والشائبة ما يخالط الشيء من غيره، ثم استُعملت مجازًا للدَّنَس والعيب في الشخص"

