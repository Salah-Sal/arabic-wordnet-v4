stage1_review:
  assessment:
    concerns:
      - "اللمة 'ميسرة أو ميمنة' عبارة تحتوي على حرف عطف ('أو') وليست مصطلحاً معجمياً مفرداً، ويجب فصلها إلى لمّتين مستقلتين."
    observations: "المفهوم يشير إلى جانبي التشكيل العسكري (القلب والجناحين). تستخدم كلمة 'جناح' عموماً للجانبين مجازاً، بينما تخصص 'ميمنة' للجانب الأيمن و'ميسرة' للجانب الأيسر، وهي مصطلحات عسكرية تراثية أصيلة. وهناك أيضاً مصطلح 'مُجنِّبة'."
  blind_candidates:
    - lemma: "جَنَاح"
      generation_method: majaz
      justification: "امتداد دلالي من جناح الطائر ليشمل جانبي التشكيل العسكري."
    - lemma: "مَيْمَنَة"
      generation_method: ishtiqaq
      justification: "مشتقة من اليمين للدلالة على الجانب الأيمن للجيش."
    - lemma: "مَيْسَرَة"
      generation_method: ishtiqaq
      justification: "مشتقة من اليسار للدلالة على الجانب الأيسر للجيش."
    - lemma: "مُجَنِّبَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجنب، وتطلق على جناحي الجيش في التراث العسكري العربي."

stage2_evidence:
  per_lemma:
    - lemma: "جناح"
      confirm:
        - text: "جناحا العسكر: جانباه"
          source: "المعجم الوسيط"
        - text: "جَنَاحا العَسْكَر: جانِباهُ: المَيْمَنَةُ, والمَيْسَرةُ"
          source: "المعجم الكبير"
    - lemma: "ميسرة أو ميمنة"
      evidence_status: no_material_found
    - lemma: "مَيْمَنَة"
      confirm:
        - text: "الميمنة: الْيمن وَخلاف الميسرة"
          source: "المعجم الوسيط"
    - lemma: "مَيْسَرَة"
      confirm:
        - text: "خِلافُ الميمنة , أو الجهةُ اليسرى. ومنه : ميسرةُ الجيش"
          source: "المعجم الوسيط"
    - lemma: "مُجَنِّبَة"
      confirm:
        - text: "المُجَنِّبَة من الجيش: جَناحَه (وهما مجنِّبتان)"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "جناح"
      decision: confirmed
      decision_reason: "مصطلح فصيح ودقيق يطلق على جانبي التشكيل العسكري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَنَاح"
    - lemma: "ميسرة أو ميمنة"
      decision: removed
      decision_reason: "عبارة تحتوي على أداة عطف وليست وحدة معجمية صحيحة، وسيتم إضافة الكلمتين كـلمّتين مستقلتين."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "مَيْمَنَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح متداول يدل على الجناح الأيمن للجيش."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مَيْمَنَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08499124-n"
    - lemma: "مَيْسَرَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح فصيح متداول يدل على الجناح الأيسر للجيش."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مَيْسَرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08499124-n"
    - lemma: "مُجَنِّبَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عسكري تراثي فصيح وموثق معجمياً يطلق على أي من جناحي الجيش."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مُجَنِّبَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08499124-n"

stage4_content:
  definition:
    current: "جانب التشكيل العسكري أو البحري"
    assessment:
      decision: retain
      reason: "التعريف الحالي دقيق وواضح ويغطي المعنى المطلوب."
  examples:
    per_lemma:
      - lemma: "جَنَاح"
        examples:
          - text: "انطلق الفرسان من جَنَاح الجيش لتطويق العدو."
            type: usage
      - lemma: "مَيْمَنَة"
        examples:
          - text: "قاد الجنرال هجوماً كاسحاً من مَيْمَنَة الجيش."
            type: usage
      - lemma: "مَيْسَرَة"
        examples:
          - text: "تمركزت كتيبة المدفعية في مَيْسَرَة التشكيل العسكري."
            type: usage
      - lemma: "مُجَنِّبَة"
        examples:
          - text: "كلف القائد خيرة رجاله بحماية مُجَنِّبَة الجيش من الاختراق."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "انطلق الفرسان من جَنَاح الجيش لتطويق العدو."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "قاد الجنرال هجوماً كاسحاً من مَيْمَنَة الجيش."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تمركزت كتيبة المدفعية في مَيْسَرَة التشكيل العسكري."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كلف القائد خيرة رجاله بحماية مُجَنِّبَة الجيش من الاختراق."

stage5_enrichment:
  per_entry:
    - lemma: "جَنَاح"
      entry_id: "{auto}"
      root: "جنح"
      maqayis_quote: "«الْجِيمُ وَالنُّونُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْمَيْلِ وَالْعُدْوَانِ. وَيُقَالُ جَنَحَ إِلَى كَذَا، أَيْ مَالَ إِلَيْهِ. وَسُمِّيَ الْجَنَاحَانِ جَنَاحَيْنِ لِمَيْلِهِمَا فِي الشِّقَّيْنِ.»"
    - lemma: "مَيْمَنَة"
      entry_id: "{auto}"
      root: "يمن"
      maqayis_quote: "«الْيَاءُ وَالْمِيمُ وَالنُّونُ: كَلِمَاتٌ مِنْ قِيَاسٍ وَاحِدٍ. فَالْيَمِينُ: يَمِينُ الْيَدِ.»"
    - lemma: "مَيْسَرَة"
      entry_id: "{auto}"
      root: "يسر"
      maqayis_quote: "«الْيَاءُ وَالسِّينُ وَالرَّاءُ: أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى انْفِتَاحِ شَيْءٍ وَخِفَّتِهِ، وَالْآخَرُ عَلَى عُضْوٍ مِنَ الْأَعْضَاءِ.»"
    - lemma: "مُجَنِّبَة"
      entry_id: "{auto}"
      root: "جنب"
      maqayis_quote: "«الْجِيمُ وَالنُّونُ وَالْبَاءُ أَصْلَانِ مُتَقَارِبَانِ أَحَدُهُمَا: النَّاحِيَةُ، وَالَآخَرُ الْبُعْدُ. فَأَمَّا النَّاحِيَةُ فَالْجَنَابُ.»"
  per_sense:
    - lemma: "جَنَاح"
      sense_id: "{auto}"
      nuance: "مصطلح عام يطلق على أي من جانبي الجيش (الأيمن أو الأيسر)."
      mwe: false
    - lemma: "مَيْمَنَة"
      sense_id: "{auto}"
      nuance: "تختص بالجانب الأيمن من التشكيل العسكري."
      mwe: false
    - lemma: "مَيْسَرَة"
      sense_id: "{auto}"
      nuance: "تختص بالجانب الأيسر من التشكيل العسكري."
      mwe: false
    - lemma: "مُجَنِّبَة"
      sense_id: "{auto}"
      nuance: "مصطلح عسكري تراثي مرادف للجناح، يطلق على أي من جانبي الجيش."
      mwe: false
