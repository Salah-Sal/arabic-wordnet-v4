        key: note
        value: '{"root":"جنح","maqayis":"«الْجِيمُ وَالنُّونُ وَالْحَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الْمَيْلِ وَالْعُدْوَانِ... وَسُمِّيَ الْجَنَاحَانِ جَنَاحَيْنِ لِمَيْلِهِمَا فِي الشِّقَّيْنِ.»"}'
