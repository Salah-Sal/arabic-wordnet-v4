# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-10091975-n (exorcist)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «طارد الأرواح» تعبير وصفي حرّ وليست مصطلحاً مسكوكاً ثابتاً؛ يمكن إبدال «الأرواح» بـ«الجنّ» أو «الشياطين» والمعنى يبقى صالحاً"
      - "التعريف العربي ترجمة حرفية من الإنجليزية بأسلوب ركيك: «تم قمعها» ليست صياغة معجمية سليمة"
      - "المجموعة تصف رتبة كهنوتية (درجة) لا شخصاً، لكنّ اللمّة الموجودة تسمّي الشخص لا الرتبة — وهذا اشتراك مقبول بالتجوّز كما في الإنجليزية"
      - "المفهوم خاصّ بالكنيسة الغربية غير المُصلَحة وغريب ثقافياً على العربية"
    observations: "المجموعة تنتمي إلى حقل المصطلحات الكنسية المسيحية الغربية. الرُّتَب الصغرى (minor orders) في الكنيسة الكاثوليكية كانت أربعاً: البوّاب، والقارئ، والمُعَزِّم (exorcist)، ومساعد الشمّاس. أُلغيت عام ١٩٧٢م. في العربية، المصطلح الأقرب لمفهوم طرد الأرواح هو «التعزيم» (من جذر ع ز م)، وفاعله «مُعَزِّم». أمّا «طارد الأرواح» فتعبير وصفي شائع في الإعلام المعاصر لكنّه ليس مصطلحاً معجمياً ثابتاً."

  blind_candidates:
    - lemma: "مُعَزِّمٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من عزَّم (الثلاثي المزيد بالتضعيف) على وزن مُفَعِّل، بمعنى مَن يقرأ العزائم لطرد الجنّ والأرواح. الجذر «عزم» مؤصَّل في هذا المعنى عند ابن فارس: «عَزَمْتُ عَلَى الْجِنِّيِّ وَذَلِكَ أَنْ تَقْرَأَ عَلَيْهِ مِنْ عَزَائِمِ الْقُرْآنِ». ومصدره «تعزيم» مُثبت في مصطلحات ALECSO بمعنى exorcism."
    - lemma: "عَازِمٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من عَزَمَ (الثلاثي المجرّد) على وزن فَاعِل، بمعنى مَن يعزم على الجنّ بالرُّقَى والعزائم. واردٌ في الاستعمال العربي القديم: «عَزَمَ على الجنّيّ» أي قرأ عليه العزائم."
    - lemma: "رَاقٍ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من رَقَى على وزن فَاعِل، بمعنى صانع الرُّقية وصاحب الرُّقَى. مُثبت في المعجم الوسيط والمعجم الكبير. الرُّقية أعمّ من التعزيم لكنّها تشمل طرد الأرواح."
    - lemma: "طَارِدُ الجِنِّ"
      generation_method: tarkib
      justification: "مركّب إضافي من «طارد» (اسم فاعل من طَرَدَ) و«الجنّ»، على غرار «طارد الأرواح» لكن بمكوّن أكثر تحديداً. يدلّ على مَن يُبعد الجنّ بالعزائم والرُّقَى."


stage2_evidence:
  per_lemma:
    - lemma: "طَارِدُ الأَرْوَاحِ"
      expands:
        - text: "«مادة طاردة للحشرات»"
          source: "المعجم الموحد لمصطلحات الكيمياء"
          addition: "«طارد» بمعنى repellent في السياق العلمي، ممّا يدلّ على أنّ الكلمة عامّة وليست مخصّصة لطرد الأرواح"
        - text: "«(طَرَدَ) الطَّاءُ وَالرَّاءُ وَالدَّالُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى إِبْعَادٍ. يُقَالُ: طَرَدْتُهُ طَرْدًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «طرد» يدلّ على الإبعاد عموماً، وليس فيه تخصيص بطرد الأرواح"

    - lemma: "مُعَزِّمٌ"
      confirm:
        - text: "«ابعاد الأرواح الشريرة التي يعتقد أنها حلّت بالفرد و تسببت في سلوكه الشرير أو المرض وذلك عن طريق العزائم والتعاويد والزار»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ALECSO)"
        - text: "«العزيمة: الرُّقَى ونحوها يعزم على الجنّ ونحوها من الأرواح، ويجمع: عزائم. وعزائم القرآن: الآيات التي يقرأ بها على ذوي الآفات لما يرجى من البُرْءِ بها»"
          source: "كتاب العين للخليل بن أحمد"
        - text: "«وَمِنَ الْبَابِ قَوْلُهُمْ: عَزَمْتُ عَلَى الْجِنِّيِّ، وَذَلِكَ أَنْ تَقْرَأَ عَلَيْهِ مِنْ عَزَائِمِ الْقُرْآنِ، وَهِيَ الْآيَاتُ الَّتِي يُرْجَى بِهَا قَطْعُ الْآفَةِ عَنِ الْمَؤُوفِ»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "عَازِمٌ"
      expands:
        - text: "«(عَزَمَ) الْعَيْنُ وَالزَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى الصَّرِيمَةِ وَالْقَطْعِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الأوّل للجذر «عزم» هو العزم والقطع والصريمة، ومعنى التعزيم على الجنّ فرعٌ منه. لكنّ «عازم» بالثلاثي المجرّد أقرب إلى معنى العزيمة والإرادة منه إلى الرُّقَى"

    - lemma: "رَاقٍ"
      confirm:
        - text: "«صانعُ الرُّقية صاحب الرقى»"
          source: "المعجم الوسيط"
        - text: "«صاحِبُ الرُّقَى وصانعها»"
          source: "المعجم الكبير"
      expands:
        - text: "«(رَقَى) الرَّاءُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ أُصُولٌ ثَلَاثَةٌ مُتَبَايِنَةٌ: أَحَدُهُمَا الصُّعُودُ، وَالْآخَرُ عُوذَةٌ يُتَعَوَّذُ بِهَا، وَالثَّالِثُ بُقْعَةٌ مِنَ الْأَرْضِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الثاني للجذر «رقى» هو العُوذة والتعويذ، فالراقي هو من يُعَوِّذ بالرُّقَى عموماً وليس بالضرورة في سياق الطقوس الكنسية"

    - lemma: "طَارِدُ الجِنِّ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "طَارِدُ الأَرْوَاحِ"
      decision: confirmed
      decision_reason: "تعبير شائع في الاستعمال العربي المعاصر لترجمة exorcist، وإن كان وصفياً لا مسكوكاً. لا يوجد بديل مُعجمي مفرد مخصَّص لهذا المفهوم الكنسي في العربية، فيُقبل المركّب الإضافي بوصفه أقرب تسمية متداولة. يحتاج إلى تشكيل كامل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على فعل الطرد والإبعاد المادّيّ للأرواح، وهو التعبير الأكثر شيوعاً في الإعلام والأدبيات المترجمة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طَارِدُ الأَرْوَاحِ"

    - lemma: "مُعَزِّمٌ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل مشتقّ من جذر «عزم» على وزن مُفَعِّل، وهو اسم فاعل من عزَّم بمعنى قرأ العزائم على الجنّ. الجذر مؤصَّل في هذا المعنى عند الخليل وابن فارس، ومصدره «تعزيم» مُثبت بمعنى exorcism في مصطلحات ALECSO. يُغني المجموعة بمصطلح عربي أصيل إلى جانب التعبير الوصفي الشائع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الطقس القرائي (قراءة العزائم والرُّقَى) لا على فعل الطرد المادّيّ، وهو اللفظ العربي الأصيل التراثي"
      actions:
        - command: create_entry
          params: {lemma: "مُعَزِّمٌ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عَازِمٌ"
      source: stage1
      decision: removed
      decision_reason: "اسم الفاعل من الثلاثي المجرّد «عَزَمَ» يغلب عليه معنى صاحب العزيمة والإرادة، لا معنى التعزيم على الجنّ. المعاجم تعرّف «العازم» بأنّه ذو العزم والحزم. معنى الرُّقَى مختصّ بالباب الثاني (عزَّم تعزيماً) لا بالمجرّد."

    - lemma: "رَاقٍ"
      source: stage1
      decision: removed
      decision_reason: "الراقي في المعاجم العربية هو صانع الرُّقية وصاحب الرُّقَى عموماً (المعجم الوسيط، المعجم الكبير). المفهوم أعمّ من المجموعة الترادفية التي تخصّ رتبة كنسية كاثوليكية محدّدة. إضافته قد تُوهم أنّ كلّ راقٍ هو صاحب رتبة كنسية، وهذا غير صحيح."

    - lemma: "طَارِدُ الجِنِّ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حرّ لا يختلف بنيوياً عن «طارد الأرواح»، وليس مصطلحاً مسكوكاً. يفشل في اختبار السكّ: يمكن إبدال «الجنّ» بـ«الأرواح» أو «الشياطين» والمعنى يبقى صالحاً. لا حاجة لإضافة تعبير وصفي مرادف."


stage4_content:
  definition:
    current: "واحدة من الرتب الصغرى في الكنيسة الغربية غير المصلحة ولكن تم قمعها الآن في الكنيسة الكاثوليكية الرومانية"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية بصياغة ركيكة: «ولكن تم قمعها» ليست عربية سليمة، و«غير المصلحة» ترجمة آلية لـ unreformed. يحتاج إلى إعادة صياغة بأسلوب معجمي عربي."
    authored:
      - type: terminological
        text: "رُتْبَةٌ مِنَ الرُّتَبِ الكَهَنُوتِيَّةِ الصُّغْرَى في الكَنِيسَةِ الغَرْبِيَّةِ قَبْلَ الإِصْلاحِ، كانَ صاحِبُها يُعْهَدُ إِلَيْهِ بِطَرْدِ الأَرْواحِ الشِّرِّيرَةِ، وَقَدْ أُلْغِيَتْ في الكَنِيسَةِ الكاثُولِيكِيَّةِ سَنَةَ ١٩٧٢م."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "إِحْدَى الرُّتَبِ الأَرْبَعِ الصُّغْرَى في سُلَّمِ الكَهَنُوتِ الكاثُولِيكِيِّ الغَرْبِيِّ قَبْلَ المَجْمَعِ الفاتِيكانِيِّ الثّانِي، وَكانَ المُنْتَسِبُ إِلَيْها يُكَلَّفُ بِتِلاوَةِ صِيَغِ التَّعْزِيمِ (العَزائِم) لِطَرْدِ الأَرْواحِ الخَبِيثَةِ عَنِ المَمْسُوسِينَ. أَلْغاها البابا بُولُسُ السّادِسُ عامَ ١٩٧٢م بِمُوجِبِ الرِّسالَةِ الرَّسُولِيَّةِ «خِدْمَةٌ مُعَيَّنَة» (Ministeria Quaedam)."
    actions:
