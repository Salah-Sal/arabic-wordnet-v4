stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة «شماس مساعد» مركب وصفي بدون تشكيل، وترتيب الكلمات يوحي بأنه شماس يتصف بالمساعدة لا رتبة مستقلة دون الشماس"
      - "المفهوم مختص بالتراتبية الكنسية المسيحية الغربية، وقد أُلغيت الرتبة في الكنيسة الكاثوليكية الرومانية، مما يجعله مصطلحاً تاريخياً"
      - "التعريف العربي الحالي ترجمة حرفية من الإنجليزية ويحتاج إعادة صياغة بأسلوب معجمي عربي"
    observations: "المجموعة تصف رتبة كنسية مسيحية (subdeacon) هي الدرجة الدنيا من الرتب المقدسة الكبرى، وظيفة صاحبها مساعدة الشمَّاس في الخدمة الليتورجية. المصطلح من الحقل الكنسي المسيحي وله مقابلات مستقرة في لغة المسيحيين العرب. ترتيب اللمّة الحالي (شماس مساعد) يُقرأ وصفياً، بينما الصيغة الإضافية (مُسَاعِدُ الشَّمَّاسِ) أدق لأنها تُبقي الشماس مرجعاً والمساعد تابعاً. كما يوجد مصطلح سرياني الأصل «إيبوذياقون» مستعمل في الكنائس الشرقية."

  blind_candidates:
    - lemma: "مُسَاعِدُ الشَّمَّاسِ"
      generation_method: tarkib
      justification: "مركب إضافي يعني مَنْ يُعاوِن الشَّمَّاس في وظيفته الكنسية، يطابق المفهوم (رتبة دون الشماس) ويتسق مع بنية التراتبية الكنسية العربية"
    - lemma: "شَمَّاسٌ أَصْغَرُ"
      generation_method: tarkib
      justification: "مركب وصفي على نمط «كاهن أكبر / كاهن أصغر» في التراتبية الكنسية، يدل على أن صاحبه في المرتبة الدنيا من الشماسية"
    - lemma: "إِيبُوذِيَاقُون"
      generation_method: taarib
      justification: "تعريب للفظ اليوناني ὑποδιάκονος (hypodiakonos)، مستعمل في الكنائس الشرقية الأرثوذكسية والكاثوليكية الشرقية"
    - lemma: "تَحْتَشَمَّاس"
      generation_method: tarkib
      justification: "مركب مزجي على نمط «تحت + شماس» محاكاةً للسابقة sub- في الإنجليزية، لكنه مصنوع غير مأثور"

stage2_evidence:
  per_lemma:
    - lemma: "شَمَّاسٌ مُسَاعِدٌ"
      expands:
        - text: "«مُساعدُ الشَّمّاس (كن).»"
          source: "المورد الحديث (2008)"
          addition: "المورد يوثّق الصيغة الإضافية لا الوصفية للدلالة على subdeacon"
        - text: "«الشَّمّاس؛ الشِّدياق (كن).»"
          source: "المورد الحديث (2008)"
          addition: "الشماس يقابل deacon لا subdeacon، مما يؤكد أن المساعد هو الرتبة الأدنى"
        - text: "«من يقوم بالخِدمة الكَنَسِيَّة, ومرتبتُه دون القِسِّيس, وهو الذى يُساعدُه فى وظيفته. (سريانية)»"
          source: "المعجم الكبير"
          addition: "تعريف الشمّاس بأنه دون القسيس ومساعده، وهو المرجع الذي يكون مساعد الشماس دونه"

    - lemma: "مُسَاعِدُ الشَّمَّاسِ"
      confirm:
        - text: "«مُساعدُ الشَّمّاس (كن).»"
          source: "المورد الحديث (2008)"

    - lemma: "شَمَّاسٌ أَصْغَرُ"
      evidence_status: "no_material_found"

    - lemma: "إِيبُوذِيَاقُون"
      evidence_status: "no_material_found"

    - lemma: "تَحْتَشَمَّاس"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "شَمَّاسٌ مُسَاعِدٌ"
      decision: confirmed
      decision_reason: "اللمّة مركب وصفي مفهوم يدل على الرتبة الكنسية المطلوبة. لا توجد أدلة تناقضها، وإن كانت الصيغة الإضافية أوثق. تُبقى مع تصحيح التشكيل لضمان قراءة «شَمَّاس» بالتشديد تمييزاً عن «شِمَاس» (الإباء)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "صيغة وصفية تُبرز أن صاحب الرتبة شَمَّاسٌ بصفة المعاونة، تُستعمل في السياقات العامة والترجمات الحديثة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَمَّاسٌ مُسَاعِدٌ"

    - lemma: "مُسَاعِدُ الشَّمَّاسِ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب إضافي موثّق في المورد الحديث (2008) مقابل subdeacon بعلامة (كن.) أي مصطلح كنسي. الصيغة الإضافية أدق دلالياً لأنها تُبقي الشمّاس مرجعاً هرمياً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "صيغة إضافية تُبرز العلاقة التبعية للشمّاس، أدق في السياق الكنسي الاصطلاحي وموثّقة معجمياً"
      actions:
        - command: create_entry
          params:
            lemma: "مُسَاعِدُ الشَّمَّاسِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "شَمَّاسٌ أَصْغَرُ"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية على استعماله مصطلحاً كنسياً ثابتاً، وقد يلتبس بوصف حُرّ لشمّاس صغير السن."

    - lemma: "إِيبُوذِيَاقُون"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية في القاعدة، وهو مصطلح طقسي متخصص بالكنائس الشرقية الأرثوذكسية لا يشيع في الاستعمال العربي العام. يمكن إضافته مستقبلاً عند توثيقه."

    - lemma: "تَحْتَشَمَّاس"
      source: stage1
      decision: removed
      decision_reason: "تركيب مزجي مصنوع لا سند معجمي له، ولا يجري على سنن العربية في تسمية الرتب الكنسية."

stage4_content:
  definition:
    current: "رجل دين رتبته أقل من الشماس؛ إحدى الرتب المقدسة في الكنيسة المسيحية الغربية غير المصلحة والكنائس الكاثوليكية الشرقية ولكن تم إلغاؤها الآن في الكنيسة الكاثوليكية الرومانية"
    assessment:
      decision: revise
      reason: "التعريف ترجمة حرفية من الإنجليزية تفتقر إلى الأسلوب المعجمي العربي، وعبارة «رجل دين رتبته أقل» غير دقيقة لأن مساعد الشمّاس ليس رجل دين بالضرورة بل حامل رتبة كنسية"
    authored:
      - type: terminological
        text: "رُتْبَةٌ كَنَسِيَّةٌ دُونَ الشَّمَّاسِيَّةِ، كان صاحبُها يُعاوِنُ الشَّمَّاسَ في الخِدمةِ الطَّقسِيَّة. وهي من الرُّتَبِ المُقَدَّسَةِ الكُبرى في الكَنيسةِ الغَربيَّةِ قبلَ الإصلاحِ وفي الكَنائسِ الكاثوليكيَّةِ الشَّرقيَّةِ، وقد أُلغِيَت في الكَنيسةِ الكاثوليكيَّةِ الرُّومانيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "رُتْبَةٌ كَنَسِيَّةٌ دُونَ الشَّمَّاسِيَّةِ، كان صاحبُها يُعاوِنُ الشَّمَّاسَ في الخِدمةِ الطَّقسِيَّة. وهي من الرُّتَبِ المُقَدَّسَةِ الكُبرى في الكَنيسةِ الغَربيَّةِ قبلَ الإصلاحِ وفي الكَنائسِ الكاثوليكيَّةِ الشَّرقيَّةِ، وقد أُلغِيَت في الكَنيسةِ الكاثوليكيَّةِ الرُّومانيَّةِ."

  examples:
    per_lemma:
      - lemma: "شَمَّاسٌ مُسَاعِدٌ"
        examples:
          - text: "كان الشَّمَّاسُ المُسَاعِدُ يَحمِلُ الكَأسَ والصِّينِيَّةَ إلى المذبَحِ أثناءَ القُدَّاسِ الإلهيِّ."
            type: usage
      - lemma: "مُسَاعِدُ الشَّمَّاسِ"
        examples:
          - text: "أُلغِيَت رُتبةُ مُسَاعِدِ الشَّمَّاسِ في الكَنيسةِ الكاثوليكيَّةِ الرُّومانيَّةِ بموجبِ الإصلاحاتِ اللِّيتورجيَّةِ عامَ ١٩٧٢م."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "كان الشَّمَّاسُ المُسَاعِدُ يَحمِلُ الكَأسَ والصِّينِيَّةَ إلى المذبَحِ أثناءَ القُدَّاسِ الإلهيِّ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أُلغِيَت رُتبةُ مُسَاعِدِ الشَّمَّاسِ في الكَنيسةِ الكاثوليكيَّةِ الرُّومانيَّةِ بموجبِ الإصلاحاتِ اللِّيتورجيَّةِ عامَ ١٩٧٢م."

