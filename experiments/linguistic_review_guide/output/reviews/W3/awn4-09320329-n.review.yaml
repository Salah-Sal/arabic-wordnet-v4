stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر للتشكيل الكامل."
    observations: "اللمة المختارة هي الاسم الجغرافي القياسي المستخدم في الأدبيات الجغرافية العربية لهذا المسطح المائي، وتستخدم معاجم المصطلحات الحديثة (مثل عرب ترم) هذا المصطلح بعينه."
  blind_candidates:
    - lemma: "خَلِيجُ بُوثْنِيَا"
      generation_method: taarib
      justification: "الاسم الجغرافي المعرب القياسي للمصطلح الإنجليزي Gulf of Bothnia."
    - lemma: "الْخَلِيجُ الْبُوثْنِيُّ"
      generation_method: ishtiqaq
      justification: "صيغة نعتية منسوبة إلى اسم المنطقة (بوثنيا)، وهي شائعة في النصوص العلمية."
    - lemma: "بَحْرُ بُوثْنِيَا"
      generation_method: taarib
      justification: "تسمية بديلة تستخدم أحياناً لوصف المسطح المائي كبحر مستقل ضمن حوض البلطيق."
    - lemma: "جَوْنُ بُوثْنِيَا"
      generation_method: majaz
      justification: "استخدام لفظ 'جون' التراثي الذي يعني الخليج أو المسطح المائي، كبديل فصيح لـ 'خليج'."

stage2_evidence:
  per_lemma:
    - lemma: "خليج بوثنيا"
      confirm:
        - text: "خليج بوثنيا (Gulf of Bothnia)"
          source: "المَكنَز الزراعي متعدد اللغات (ArabTerm)"
    - lemma: "الْخَلِيجُ الْبُوثْنِيُّ"
      evidence_status: "no_material_found"
    - lemma: "بَحْرُ بُوثْنِيَا"
      evidence_status: "no_material_found"
    - lemma: "جَوْنُ بُوثْنِيَا"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خليج بوثنيا"
      decision: confirmed
      decision_reason: "الاسم الرسمي والمعتمد في المعاجم المتخصصة مثل عرب ترم، وهو الأكثر شيوعاً في الأطالس الجغرافية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ بُوثْنِيَا"
    - lemma: "الْخَلِيجُ الْبُوثْنِيُّ"
      source: stage1
      decision: confirmed
      decision_reason: "صيغة نعتية صحيحة لغوياً وتستخدم في السياقات الأكاديمية والجيولوجية، وتعتبر إضافة قيمة للمرادفات."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "الْخَلِيجُ الْبُوثْنِيُّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "ذراع شمالية لبحر البلطيق؛ بين السويد وفنلندا"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب، ومن الأفضل صياغته بأسلوب معجمي يحدد طبيعة المسطح المائي وموقعه الجغرافي بدقة."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ يَقَعُ فِي الْقِسْمِ الشَّمَالِيِّ مِنْ بَحْرِ الْبَلْطِيقِ، يَمْتَدُّ بَيْنَ السُّوِيدِ غَرْبًا وَفِنْلَنْدَا شَرْقًا، وَيُعَدُّ أَكْبَرَ أَذْرُعِ هَذَا الْبَحْرِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "خَلِيجٌ يَقَعُ فِي الْقِسْمِ الشَّمَالِيِّ مِنْ بَحْرِ الْبَلْطِيقِ، بَيْنَ السُّوِيدِ غَرْبًا وَفِنْلَنْدَا شَرْقًا."}

  examples:
    per_lemma:
      - lemma: "خَلِيجُ بُوثْنِيَا"
        examples:
          - text: "يَتَمَيَّزُ خَلِيجُ بُوثْنِيَا بِمُلُوحَةٍ مُنْخَفِضَةٍ جِدًّا نَظَرًا لِتَدَفُّقِ كَمِيَّاتٍ كَبِيرَةٍ مِنَ الْمِيَاهِ الْعَذْبَةِ إِلَيْهِ."
            type: usage
      - lemma: "الْخَلِيجُ الْبُوثْنِيُّ"
        examples:
          - text: "تَتَجَمَّدُ مِيَاهُ الْخَلِيجِ الْبُوثْنِيِّ لِمُدَّةٍ تَصِلُ إِلَى خَمْسَةِ أَشْهُرٍ فِي السَّنَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يَتَمَيَّزُ خَلِيجُ بُوثْنِيَا بِمُلُوحَةٍ مُنْخَفِضَةٍ جِدًّا نَظَرًا لِتَدَفُّقِ كَمِيَّاتٍ كَبِيرَةٍ مِنَ الْمِيَاهِ الْعَذْبَةِ إِلَيْهِ."}

