# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14456581-n (princedom)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «رتبة الأمير» عبارة وصفية حرّة تكاد تكرّر التعريف نفسه، وتفشل في اختبار السكّ (يمكن إبدال «رتبة» بـ«منصب» أو «مقام» والعبارة تبقى صالحة)"
      - "اللمّة «إمارة» بدون تشكيل؛ يلزم التفريق بين الإِمَارَة (الولاية) والأَمَارَة (العلامة)"
    observations: "المفهوم أصيل في الثقافة العربية الإسلامية، وله مصطلح راسخ هو «الإمارة» بكسر الهمزة. التعريف الحالي يبدو ترجمة حرفية من الإنجليزية بإدراج «كرامة» مقابل dignity وهو استعمال غير مألوف في السياق العربي."
  blind_candidates:
    - lemma: "إِمَارَة"
      generation_method: ishtiqaq
      justification: "من الجذر أ-م-ر على وزن فِعَالَة الدال على الولايات والمناصب (كوِزَارَة وخِلَافَة)، وهو المصطلح المعجمي المثبت لمنصب الأمير"
    - lemma: "إِمْرَة"
      generation_method: ishtiqaq
      justification: "من الجذر أ-م-ر على وزن فِعْلَة، مرادف تراثي للإمارة ورد في مقاييس اللغة والمعجم الوسيط"
    - lemma: "تَأَمُّر"
      generation_method: ishtiqaq
      justification: "مصدر تَأَمَّرَ على وزن تَفَعُّل، يدل على صيرورة المرء أميرًا وتولّيه شؤون الإمارة"
    - lemma: "أَمِيرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من أمير بإضافة ياء النسب وتاء التأنيث، للدلالة على صفة الأمير أو مقامه"

stage2_evidence:
  per_lemma:
    - lemma: "إِمَارَة"
      confirm:
        - text: "«منصب الأمير جزء من الأرض يحكمه أمير»"
          source: "المعجم الوسيط"
        - text: "«الولاية , يقال : ما لك فى الإمارة خَيْرٌ مَنْطِقَةٌ يَحكُمُها أمير (موَلَّد)»"
          source: "المعجم الكبير"
        - text: "«(الْإِمَارَة) منصب الْأَمِير وجزء من الأَرْض يحكمه أَمِير»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
        - text: "«والإمارة بالكسر: الولايةُ»"
          source: "التعريفات الفقهيّة للبركتي"
        - text: "«الإمارة بالكسر، الولاية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«ومن هذا الباب الإمرة والإمارة، وصاحبها أمير ومؤمَّر»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«إمارة» = princedom"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الإمارة: منصب الأمير أو منطقة سلطته» = emirate"
          source: "المورد الحديث (2008)"
          addition: "يتوسع المصطلح ليشمل المنطقة الجغرافية التي يحكمها الأمير"
        - text: "«إمارة» = principality"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm)"
          addition: "يُستخدم في السياق الجغرافي-السياسي بمعنى الإقليم"

    - lemma: "رُتْبَةُ الْأَمِيرِ"
      evidence_status: "no_material_found"

    - lemma: "إِمْرَة"
      confirm:
        - text: "«الإمارة»"
          source: "المعجم الوسيط (إِمْرَة)"
        - text: "«الولاية»"
          source: "المعجم الكبير (الإِمْرَة)"
        - text: "«(الإمرة) الْإِمَارَة يُقَال تَأمر فلَان علينا فحسنت إمرته»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
        - text: "«ومن هذا الباب الإمرة والإمارة، وصاحبها أمير ومؤمَّر»"
          source: "مقاييس اللغة لابن فارس"

    - lemma: "تَأَمُّر"
      contradicts:
        - text: "«على القوم : تسلَّط عليهم على فلان: تعالى عليه (موَلَّد) القومُ على الأمْر : تشاوروا وأَجْمَعوا آراءهم الأمْرَ : تولاه»"
          source: "المعجم الكبير"
          conflict: "تأمّر فعل يدل على الصيرورة والفعل لا على المنصب ذاته؛ لا يصلح اسمًا للرتبة"
      expands:
        - text: "«تأمَّر عليهم: صار أميرًا وقد شاعت هذه الكلمة في لغة الحياة اليومية»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يؤكد أنه فعل دال على التحوّل لا اسم للمنصب"

    - lemma: "أَمِيرِيَّة"
      contradicts:
        - text: "«الأَمِيرِيَّةُ: منسوبة إلى الأمير: من قرى النيل من أرض بابل»"
          source: "معجم البلدان لياقوت الحموي"
          conflict: "الشاهد الوحيد اسم مكان لا مصطلح دال على منصب"

stage3_analysis:
  per_lemma:
    - lemma: "إِمَارَة"
      decision: confirmed
      decision_reason: "مصطلح معجمي راسخ مثبت في المعجم الوسيط والكبير ومقاييس اللغة والمورد الحديث بمعنى منصب الأمير. يحتاج إضافة التشكيل الكامل للتفريق عن الأَمَارَة (العلامة)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المعياري الشائع في الاستعمال المعاصر والتراثي على حدٍّ سواء للدلالة على منصب الأمير وولايته"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِمَارَة"

    - lemma: "رُتْبَةُ الْأَمِيرِ"
      decision: removed
      decision_reason: "عبارة وصفية حرة تكرّر التعريف ذاته ولا وجود لها كوحدة معجمية مسكوكة في أيٍّ من المعاجم. تفشل في اختبار السكّ لأن إبدال «رتبة» بـ«منصب» أو «مقام» يُنتج عبارة صالحة مماثلة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِمْرَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف تراثي للإمارة مثبت في المعجم الوسيط والكبير ومقاييس اللغة. يُثري المجموعة بلفظ كلاسيكي فصيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ تراثي كلاسيكي يُفضَّل في الأسلوب الأدبي الرفيع والنصوص التاريخية، بخلاف إِمَارَة الأكثر شيوعًا في الاستعمال المعاصر"
      actions:
        - command: create_entry
          params:
            lemma: "إِمْرَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَأَمُّر"
      source: stage1
      decision: removed
      decision_reason: "مصدر فعلي يدل على فعل الصيرورة أميرًا والتسلّط لا على المنصب ذاته. لا يصح اسمًا للرتبة في سياق هذه المجموعة الترادفية."
      evidence_assessment:
        case: contradicts_only

    - lemma: "أَمِيرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على شاهد معجمي يدعم استخدامها بمعنى منصب الأمير؛ الشاهد الوحيد اسم موضع في معجم البلدان."
      evidence_assessment:
        case: contradicts_only

stage4_content:
  definition:
    current: "كرامة أو رتبة أو منصب الأمير"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية تحتوي على «كرامة» مقابل dignity وهو استعمال غير مألوف عربيًّا في هذا السياق. كما أن العطف بـ«أو» يوحي بالترادف بين الكرامة والرتبة والمنصب وهي معانٍ متباينة."
    authored:
      - type: terminological
        text: "مَنْصِبُ الْأَمِيرِ وَمَقَامُهُ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "الْوِلَايَةُ الَّتِي يَتَقَلَّدُهَا الْأَمِيرُ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَنْصِبُ الْأَمِيرِ وَمَقَامُهُ"

  examples:
    per_lemma:
      - lemma: "إِمَارَة"
        examples:
          - text: "تَوَلَّى الإِمَارَةَ بَعْدَ أَبِيهِ فَأَحْسَنَ السِّيرَةَ فِي رَعِيَّتِهِ."
            type: usage
      - lemma: "إِمْرَة"
        examples:
          - text: "تَأَمَّرَ فُلَانٌ عَلَيْنَا فَحَسُنَتْ إِمْرَتُهُ."
            type: usage
            source: "المعجم الوسيط"
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تَوَلَّى الإِمَارَةَ بَعْدَ أَبِيهِ فَأَحْسَنَ السِّيرَةَ فِي رَعِيَّتِهِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَأَمَّرَ فُلَانٌ عَلَيْنَا فَحَسُنَتْ إِمْرَتُهُ."

