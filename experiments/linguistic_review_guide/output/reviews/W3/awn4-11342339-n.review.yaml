# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان خاليتان من التشكيل الكامل"
      - "المجموعة تصف شخصاً تاريخياً بعينه (اسم علم)، وهو وليام ستريكلاند المهندس المعماري الأمريكي (1787-1854)، والأسماء الأعلام لا تخضع لمنهجية التوليد المصطلحي الاشتقاقي بل للتعريب الصوتي فقط"
      - "التعريف الحالي مختصر للغاية ولا يكشف عن إسهامات الشخص المعمارية"
      - "غياب أي إشارة إلى تخصصه في الطراز الكلاسيكي اليوناني أو أبرز أعماله"
    observations: >
      هذه المجموعة اسم علَم لشخص تاريخي بعينه، وهو المهندس المعماري الأمريكي وليام ستريكلاند
      (1787-1854م)، الذي تتلمذ على يد بنيامين هنري لاتروب، وكان من أبرز روّاد أسلوب
      الإحياء الكلاسيكي اليوناني في الولايات المتحدة. اللمّتان الموجودتان (ستريكلاند /
      ويليام ستريكلاند) هما تعريبان صوتيان لا غير، وهذا هو النهج الصحيح الوحيد لأسماء الأعلام
      الأجنبية. لا مجال هنا للاشتقاق أو المجاز أو التركيب.

  blind_candidates:
    - lemma: "وِيلِيَام سْتْرِيكْلَاند"
      generation_method: taarib
      justification: "تعريب صوتي للاسم الكامل William Strickland بصياغة مشكّلة كاملة، باعتباره اسم علم لشخص تاريخي"
    - lemma: "سْتْرِيكْلَاند"
      generation_method: taarib
      justification: "تعريب للقب العائلي وحده Strickland، مناسب للسياقات التي تكتفي باللقب في الإشارة إلى هذا المهندس"
    - lemma: "وِلِيَم سْتِرِيكْلَاند"
      generation_method: taarib
      justification: "تعريب بديل يعكس النطق الإنجليزي لـ William بصورة مختلفة (وِلِيَم بدلاً من وِيلِيَام)، ويُستعمل في بعض المصادر العربية"
    - lemma: "وِيلِيَام سْتِرِيكْلَنْد"
      generation_method: taarib
      justification: "تعريب ثالث يُغاير في التنوين الأخير (سْتِرِيكْلَنْد) ويقترب من الإنجليزية البريطانية المحكية"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  queries_run:
    - pattern: "batch headword lookup"
      terms: ["ستريكلاند", "الستريكلاند", "ويليام ستريكلاند", "ويليام", "الويليام",
              "ستريكلند", "وليم ستريكلاند", "وليم ستريكلند"]
    - pattern: "english bridge"
      terms: ["Strickland", "William Strickland"]
    - pattern: "arabic fts"
      terms: ["ستريكلاند", "لاتروب", "معماري امريكي"]
    - pattern: "maqayis lookup"
      terms: ["عمر", "بنا", "هندس", "معماري"]

  per_lemma:
    - lemma: "ستريكلاند"
      evidence_status: "no_material_found"

    - lemma: "ويليام ستريكلاند"
      expands:
        - text: "«ويليام — عن الألمانية القديمة بمعنى مقدام شجاع مدافع»"
          source: "موسوعة السلطان قابوس لأسماء العرب (جامعة السلطان قابوس، 1985)"
          addition: >
            يؤكد أن ويليام اسم علَم أجنبي معرَّب موثَّق في المراجع العربية المتخصصة
            بأسماء الأعلام، وأصله ألماني قديم. أما المقطع الثاني (ستريكلاند) فلا وجود
            له في الموسوعة.

    - lemma: "وِيلِيَام سْتْرِيكْلَاند"
      expands:
        - text: "«ويليام — عن الألمانية القديمة بمعنى مقدام شجاع مدافع»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "الجزء الأول من الاسم (ويليام) موثَّق كاسم علم معرَّب"

    - lemma: "سْتْرِيكْلَاند"
      evidence_status: "no_material_found"

    - lemma: "وِلِيَم سْتِرِيكْلَاند"
      evidence_status: "no_material_found"

    - lemma: "وِيلِيَام سْتِرِيكْلَنْد"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الأولى الموجودة: ستريكلاند ──
    - lemma: "ستريكلاند"
      decision: confirmed
      decision_reason: >
        اللقب العائلي وحده (Strickland) هو المصطلح المُختصَر الشائع في الكتابات الأكاديمية
        والتاريخية العربية المعاصرة للإحالة إلى هذا المهندس. لا وجود له في المعاجم لأنه
        اسم علَم أجنبي محض، وهذا متوقَّع ومقبول. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      morphological_check:
        pos_fit: "اسم علم أجنبي معرَّب، لا ينطبق عليه فحص الوزن الصرفي"
        loan_type: "معرَّب (تعريب صوتي)"
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستعمل في السياق الإحالي المختصر حيث يكفي ذكر اللقب وحده للتمييز، كما في
        "مباني ستريكلاند" أو "أسلوب ستريكلاند"؛ في حين يُستعمل الاسم الكامل عند
        التقديم الأوّل للشخصية أو في السياقات التوثيقية والأكاديمية الرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سْتْرِيكْلَاند"

    # ── اللمّة الثانية الموجودة: ويليام ستريكلاند ──
    - lemma: "ويليام ستريكلاند"
      decision: confirmed
      decision_reason: >
        الاسم الكامل (William Strickland) هو التعريب المعياري المعتمد لهذا المهندس المعماري
        في المصادر العربية الموسوعية والتاريخية. الجزء الأول (ويليام) موثَّق في موسوعة
        أسماء الأعلام العربية. اللمّة تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      morphological_check:
        pos_fit: "مركب اسمي من اسمي علَم، لا ينطبق عليه فحص الوزن الصرفي"
        loan_type: "معرَّب (تعريب صوتي للاسم الكامل)"
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الاسم الكامل يُستعمل للتعريف الأوّل بالشخص، أو في السياقات التوثيقية الرسمية
        (كالموسوعات والمراجع المتخصصة)، ويوفّر تمييزاً قاطعاً عن أي شخص آخر يحمل
        لقب ستريكلاند.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيلِيَام سْتْرِيكْلَاند"

    # ── مرشّح المرحلة ١ رقم ١ ──
    - lemma: "وِيلِيَام سْتْرِيكْلَاند"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة (ويليام ستريكلاند) بعد إضافة التشكيل، وقد
        عولجت هذه اللمّة بأمر update_lemma على اللمّة الأصلية.

    # ── مرشّح المرحلة ١ رقم ٢ ──
    - lemma: "سْتْرِيكْلَاند"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة (ستريكلاند) بعد إضافة التشكيل، وقد عولجت
        بأمر update_lemma على اللمّة الأصلية.

    # ── مرشّح المرحلة ١ رقم ٣ ──
    - lemma: "وِلِيَم سْتِرِيكْلَاند"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب بديل غير مستقرّ في المصادر العربية. الصيغة المعتمدة في الكتابات العربية
        المتخصصة هي وِيلِيَام (بياءَيْن)، لا وِلِيَم. إضافة هذا الشكل سيُحدث اضطراباً
        بلا مسوّغ.

    # ── مرشّح المرحلة ١ رقم ٤ ──
    - lemma: "وِيلِيَام سْتِرِيكْلَنْد"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب بديل غير موثَّق، يختلف في صوتيّة الجزء الثاني (سْتِرِيكْلَنْد بدلاً من
        سْتْرِيكْلَاند). اللمّة الموجودة بصيغة الألف الممدودة أقرب إلى النطق الإنجليزي
        المعياري وأكثر شيوعاً في المصادر العربية.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-11342339-n"
        pos: n


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "معماري أمريكي وتلميذ لاتروب (1787-1854)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مختصر للغاية: يكتفي بذكر الجنسية (أمريكي) وصلة التتلمذ
        ومدّة الحياة، دون أي إشارة إلى إسهاماته المعمارية، أو الطراز الذي تخصّص
        فيه (الكلاسيكي اليوناني / Greek Revival)، أو أبرز مبانيه. التعريف الموسوعي
        أنسب لأعلام الأشخاص.
    authored:
      - type: encyclopedic
        text: >
          مهندسٌ معماريٌّ أمريكيٌّ (1787-1854م)، تتلمذَ على بنيامين هنري لاتروب،
          وكان من رواد الطراز الكلاسيكي اليونانيّ في الولايات المتحدة الأمريكية،
          تُعدّ أعماله في فيلادلفيا ونَاشفِيل من أبرز نماذج العمارة الأمريكية في
          القرن التاسع عشر.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11342339-n"
          definition_index: 0
          text: >
            مهندسٌ معماريٌّ أمريكيٌّ (1787-1854م)، تتلمذَ على بنيامين هنري لاتروب،
            وكان من رواد الطراز الكلاسيكي اليونانيّ في الولايات المتحدة الأمريكية،
            تُعدّ أعماله في فيلادلفيا ونَاشفِيل من أبرز نماذج العمارة الأمريكية في
            القرن التاسع عشر.

  examples:
