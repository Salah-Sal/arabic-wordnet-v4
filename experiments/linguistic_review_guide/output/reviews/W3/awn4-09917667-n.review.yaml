# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التوليد الأعمى (بعد قراءة synset_info_masked.yaml فقط)
  # التعريف المتاح: "شخص يصنع الخرائط" — المفرط المباشر: "خبير في الجغرافيا"
  blind_candidates:
    - lemma: "خَرَّائِطِيٌّ"
      generation_method: ishtiqaq
      justification: >
        مشتق من جمع التكسير "خَرَائِط" (جمع خَرِيطَة) بإضافة ياء النسبة على
        نمط فَعَّالِيّ، للدلالة على من يحترف صنع الخرائط ويُنسب إليها. القياس
        على نماذج احترافية عربية كـ"جُغرافِيّ" و"فَلَكِيّ".

    - lemma: "مُسَّاحٌ"
      generation_method: majaz
      justification: >
        من الجذر (م س ح): مَسَحَ الأرضَ بمعنى قاسَها ورسمها؛ المجاز يربط
        إمرار أداة القياس على الأرض بالفعل الذي يُنتج الخرائط. استُعمل تاريخياً
        لمن يرسم الأرض ويُحدّد معالمها.

    - lemma: "طُوبُوغرافٌ"
      generation_method: taarib
      justification: >
        تعريب "topographer" للدلالة على من يرسم تضاريس الأرض ومعالمها؛
        يقبل لام التعريف (الطوبوغراف) والنسبة (طوبوغرافي) والجمع (طوبوغرافون).
        الملاذ الأخير بعد استنفاد مرتبتَي الاشتقاق والمجاز.

    - lemma: "رَسَّامٌ جُغرافِيٌّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي: رَسَّام (وزن فَعَّال للمحترف) + جُغرافيّ (نسبة للجغرافيا).
        يُقيّد العموم في "رسام" ويُخصّصه بالمجال الجغرافي، مما يُحيل مباشرةً
        إلى من يرسم الخرائط الجغرافية.

  # ب. التقييم الأولي (بعد قراءة synset_info الكامل)
  assessment:
    concerns:
      - "اللمّة الموجودة 'رسام خرائط' مجرّدة من التشكيل الكامل."
      - >
        'رسام خرائط' مركّب إضافي وصفي؛ اختبار الاستبدال يُثبت إمكانية إبدال
        'رسام' بـ'صانع' مع بقاء المعنى، مما يُضعف تثبيته معجمياً كوحدة مسكوكة.
      - >
        تفتقر المجموعة إلى مصطلح مفرد مسكوك؛ إذ إن المورد الحديث (2008) يُسجّل
        'الخرائطيّ' كمصطلح محدّد بالمعنى المطلوب.
      - "التعريف العربي 'شخص يصنع الخرائط' بسيط جداً ويستخدم 'يصنع' بدلاً من 'يرسم/يُعِدّ' الأدق اصطلاحاً."
    observations: >
      المجموعة تُعبّر عن مفهوم 'رسّام الخرائط' (cartographer) الذي يرتبط
      بالتراث الجغرافي العربي العريق (الإدريسي، ابن حوقل، المسعودي).
      اللمّة الموجودة 'رسام خرائط' صحيحة لغوياً وهي الصيغة التي يستخدمها
      المورد الحديث لتعريف 'الخرائطيّ'، غير أن المعجمية تُرجّح إضافة المصطلح
      المفرد 'خَرَائِطِيٌّ' الوارد في المورد الحديث بوصفه الترجمة الأمينة
      لـ"cartographer". وزن فَعَائِلِيّ (نسبة إلى جمع التكسير) مُنتج في
      العربية المعاصرة: جُغرافيّ، حَيَوانِيّ، مَعْدِنِيّ.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  # ملاحظة الاستعلامات: نُفِّذت ٤ استعلامات:
  # (١) مطابقة دقيقة دفعية  (٢) إثراء بالمعرّف  (٣) جسر إنجليزي  (٤) كلمات مفتاحية عربية

  per_lemma:

    - lemma: "رَسَّامُ خَرَائِطَ"
      confirm:
        - text: >
            «(الرَّسَّامُ) من يَحْتَرِفُ الرَّسْمَ — مَن يَنْقُشُ الألواح —
            مَن يَرْسُم بالقَلَم وغَيْرِه أشكالاً أو صُوَرًا أو خطوطًا»
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«مَن يرسم بالقلم أشكالاً، أو صُوراً، أو خطوطاً»"
          source: "المعجم الوسيط"
        - text: "«رسّام — draughtsman»"
          source: "مسرد الجغرافيا والتاريخ (ARABTERM)"
        - text: >
            «الخرائطيّ: رسّام الخرائط.»
          source: "المورد الحديث (2008) — (يُستخدم 'رسام الخرائط' كتعريف للمصطلح)"
      expands:
        - text: "«رسّام — draftsman»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.٢ بناء-تجارة (ARABTERM)"
          addition: >
            يُثبت أن 'رسام' وحده يُترجَم بـ"draftsman"؛ إضافة 'خرائط' تخصّصه
            وتُحدّده بصنع الخرائط.

    - lemma: "خَرَائِطِيٌّ"
      confirm:
        - text: "«الخرائطيّ: رسّام الخرائط.» — cartographer"
          source: "المورد الحديث (2008)"
        - text: "«الخرائطيّ: رسّام الخرائط.» — mapmaker"
          source: "المورد الحديث (2008)"
        - text: >
            «(1) الخرائطيّ: رسّام الخرائط
            (2) الجداوِليّ: خبير بالأسواق الماليّة يتّكل في تنبُّؤاته على الجداول البيانيّة.»
          source: "المورد الحديث (2008) — مدخل chartist"
        - text: "«خرائطي — cartographic (al)»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.١ طباعة-كهرباء (ARABTERM)"

    - lemma: "مُسَّاحٌ"
      confirm:
        - text: "«من حِرفته المساحة»"
          source: "المعجم الوسيط"
        - text: "«(المساح) من حرفته المساحة»"
          source: "المعجم الوسيط (Hawramani)"
      contradicts:
        - text: "«مسّاح — field surveyor / topomètre — Civil Engineering»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (ARABTERM)"
          conflict: >
            المعاجم التقنية تُرجمه بـ"field surveyor" و"topographer"، لا
            "cartographer"؛ فالمساح يقيس الأرض ويسجّل أبعادها، أما رسّام
            الخرائط فيُعِدّ تمثيلات بيانية للأرض ويُنشئ الخرائط.

    - lemma: "طُوبُوغرافٌ"
      evidence_status: "no_material_found"

    - lemma: "رَسَّامٌ جُغرافِيٌّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "رَسَّامُ خَرَائِطَ"
      decision: confirmed
      decision_reason: >
        المركّب الإضافي 'رسّام خرائط' صحيح لغوياً ومُستعمل في أمّهات المعاجم
        الحديثة بوصفه تعريف 'الخرائطيّ'؛ وهو يوازي الإنجليزية "map maker" التي
        وردت ضمن لمّات المجموعة الإنجليزية. يُبقى في المجموعة مع تصحيح تشكيله
        ليتوافق مع الإعراب الصحيح: رَسَّامُ خَرَائِطَ (خرائط ممنوع من الصرف،
        مجرور بالفتحة).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على البُعد الحِرَفي: 'رسّام' (وزن مبالغة فَعَّال) يُشير إلى
        المحترف الذي يُمارس الرسم بوصفه صنعةً، أي يُبرز مهارة اليد والحرفة
        أكثر من التخصص العلمي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَسَّامُ خَرَائِطَ"

    - lemma: "خَرَائِطِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في المورد الحديث (2008) بصريح العبارة "الخرائطيّ: رسّام الخرائط"
        مع ترجمتَي "cartographer" و"mapmaker"؛ وهو المصطلح المفرد المسكوك
        المقابل للمعنى. مشتق بياء النسبة من الجمع 'خرائط'، على نمط اشتقاقي
        مُنتج (جُغرافيّ من جغرافيا، جِيولوجيّ من جيولوجيا). يجتاز اختبار التثبيت
        المعجمي بوروده مدخلاً مستقلاً في معجم عربي حديث.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الانتساب والهوية التخصصية: 'خَرَائِطِيٌّ' نسبة إلى الخرائط
        تُشير إلى من ينتمي إلى حقل الخرائط علماً واحترافاً، أي تُبرز التخصص
        العلمي والانتماء المعرفي أكثر من مجرد الحرفة اليدوية.
      actions:
        - command: create_entry
          params:
            lemma: "خَرَائِطِيٌّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09917667-n"

    - lemma: "مُسَّاحٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المساح = من يقيس الأرض ويُحدّد مساحاتها (land surveyor)، وهو مفهوم
        مجاور لرسّام الخرائط لكنه ليس مرادفاً له؛ الأدلة التقنية صريحة في
        مقابلته بـ"field surveyor" و"topographer"، لا "cartographer".
        الإدراج سيُلبّس بين مهنتين متمايزتين.

    - lemma: "طُوبُوغرافٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية تُثبت التعريب. علاوةً على ذلك، "topographer" ≠
        "cartographer"؛ الطوبوغرافيا تُعنى برسم التضاريس وتفاصيل السطح، أما
        الكارتوغرافيا فتشمل إعداد الخرائط بجميع أنواعها. الخلط بينهما يُوقع
        في التضييق غير المبرر لمفهوم المجموعة.

    - lemma: "رَسَّامٌ جُغرافِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد المركّب الوصفي 'رسام جغرافي' مدخلاً في أيّ معجم. اختبار
        التثبيت: يمكن إبدال 'رسام' بـ'مصوّر' أو 'مخطّط' مع حفظ المعنى →
        ليس وحدةً معجمية ثابتة. وبما أن 'خَرَائِطِيٌّ' أدقّ وأكثر إيجازاً
        وموثَّق معجمياً، فلا حاجة إلى هذا المركّب.


