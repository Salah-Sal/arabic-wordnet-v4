          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          متخصِّص في علم رسم الخرائط (الخرائطية)؛ يجمع المعلومات الجغرافية
          والطبوغرافية ويُصوِّرها في تمثيلات بيانية مسطّحة أو رقمية، ويشمل
          عمله تحديد الإسقاطات الجغرافية واختيار المقاييس ورسم الحدود والمعالم.
