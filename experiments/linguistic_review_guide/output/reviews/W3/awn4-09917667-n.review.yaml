        من المصطلح الأدق 'يرسم/يُعِدّ'؛ ويفتقر إلى التخصيص الجنسي والفصل
        النوعي المطلوبين في التعريف المعجمي المحكم. لا يُميّز رسّام الخرائط
        من غيره من العاملين في الجغرافيا.
    authored:
      - type: terminological
        text: >
          مَن يحترف رسم الخرائط الجغرافية وإعدادها، جامعاً بين علم الجغرافيا
          ومهارة التمثيل البياني لسطح الأرض.
