    current: "معماري إنجليزي (1746-1813)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مجرد وسم مختصر (جنس + تواريخ) خلا من أي فصل نوعي يميّز هذا المعماري عن سواه.
        يستوجب معجم AWN4 تعريفاً موسوعياً يُضمّن أسلوبه المعماري وأبرز أعماله ومناصبه.
    authored:
      - type: encyclopedic
        text: >
          جيمس وَيَّات (1746-1813م): مهندس معماري إنجليزي بارز، اشتُهر بإتقانه الأسلوبَين القوطيّ المُحيى
          والكلاسيكيّ الجديد، وعُيِّن مفتّشاً عاماً لأعمال الملك. من أشهر أعماله دير فونتهيل في وِلتشير،
          وإعادة بناء قصر ريدسدال، وترميم كثير من الكنائس القوطية في إنجلترا.
