# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'وايت' خاطئة تعريبياً: 'وايت' هي النقحرة العربية الراسخة لـ White لا لـ Wyatt — يُفرّق المعجم الطبي الموحد صراحةً بين الاثنين"
      - "اللمّة 'جيمس وايت' تُعطي انطباعاً بأن الشخص اسمه James White لا James Wyatt، وهو خطأ هوية صريح"
      - "التعريف 'معماري إنجليزي (1746-1813)' مجرد وسم تعريفي مختصر خلا من أي فصل نوعي أو معلومة تمييزية"
      - "المجموعة تفتقر إلى أمثلة استعمالية"
    observations: >
      هذه المجموعة عَلَمٌ شخصي (proper noun) لمعماري إنجليزي بارز من القرن الثامن عشر هو جيمس وَيَّات (James Wyatt، 1746-1813م).
      اللمّتان الحاليتان مبنيتان على خطأ نقحري: 'وايت' صوتياً أقرب إلى White (= الأبيض/وايت)، لا إلى Wyatt.
      يُثبت المعجم الطبي الموحد هذا التمييز إذ يستخدم 'وايت' مقابل White (علامة ماك غين-وايت) و'وايات' مقابل Wyatt (متلازمة بروشفيلد-وايات).
      الصواب: استبدال اللمّتين بـ'جيمس وَيَّات' و'وَيَّات'. لا إمكانية للاشتقاق أو المجاز أو التركيب لأن الوحدة عَلَم شخصي أجنبي بحت.

  blind_candidates:
    - lemma: "جيمس وَيَّات"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل James Wyatt بنقحرة صوتية دقيقة: وَيَّات (Wyatt = /ˈwaɪ.ət/) تميّز صراحةً عن وايت (White = /waɪt/).
        الأسلوب الأعلى (مجاز/اشتقاق/تركيب) متعذَّر لأن الوحدة عَلَم شخصي أجنبي لا مفهوم عام قابل للاشتقاق.
    - lemma: "وَيَّات"
      generation_method: taarib
      justification: >
        اللقب المختصر (Wyatt) مُعرَّباً بصورة مستقلة؛ يُستخدم في السياق التخصصي حيث السياق يُحدد المقصود ويُغني عن الاسم الأول.
        يتوافق مع النقحرة المعتمدة في المعجمية الطبية العربية (وايات/وَيَّات) مقابل Wyatt.
    - lemma: "وايِت"
      generation_method: taarib
      justification: >
        نقحرة بديلة مُلتبسة مدرجة للمقارنة والتقييم — صوت Wyatt في الإنجليزية قريب من White مما قد يدفع بعض المُعرِّبين
        لاستخدام 'وايت'. تُوثَّق هنا مع التوقع بأن المعجمية العربية رصدتها مقابل White لا Wyatt.
    - lemma: "جيمس وايِت"
      generation_method: taarib
      justification: >
        الصيغة الكاملة للنقحرة الملتبسة — تُطابق ما أُدرج في المجموعة حالياً قبل الاطلاع على اللمّات.
        تُدرج للتوثيق والمقارنة مع التوقع بأن فحص الأدلة سيؤكد خطأها.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دقيقة دفعية: وايت، جيمس وايت، وايات، جيمس وايات، ويات (لا نتائج مباشرة)
#   Q2 — جسر إنجليزي: "Wyatt" OR "James Wyatt" ← مدخلان طبيان فقط
#   Q3 — FTS عربي: "وايت" OR "وايات" OR "ويات" ← مدخلات طبية + عشوائية غير ذات صلة
stage2_evidence:
  per_lemma:
    - lemma: "جيمس وايت"
      evidence_status: "no_material_found"

    - lemma: "وايت"
      expands:
        - text: "«عَلاَمَةُ ماك غين-وايت (في تخطيط كهربية القلب في الصمة الرئوية)» — McGinn-White sign"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُثبت هذا المدخل أن 'وايت' هي النقحرة المعتمدة لـ White في المعجمية الطبية العربية،
            لا لـ Wyatt — مما يجعل استخدامها مقابل Wyatt مُلتبساً ومُضلِّلاً.

    - lemma: "جيمس وَيَّات"
      evidence_status: "no_material_found"

    - lemma: "وَيَّات"
      confirm:
        - text: "«مُتَلاَزِمَةُ بروشفيلد-وايات (وحمة مع أعراض عينية و عصبية)» — Brushfield-Wyatt syndrome"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«داءُ بروشفيلد-وايات (مُتلازِمَةُ ستورج ويبر)» — Brushfield-Wyatt disease (Sturge-Weber Syndrome)"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "وايِت"
      contradicts:
        - text: "«عَلاَمَةُ ماك غين-وايت (في تخطيط كهربية القلب في الصمة الرئوية)» — McGinn-White sign"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي يُسنِد 'وايت' حصراً لـ White لا لـ Wyatt، مما يُثبت التعارض بين هذه النقحرة والمقصود"

    - lemma: "جيمس وايِت"
      contradicts:
        - text: "«عَلاَمَةُ ماك غين-وايت (في تخطيط كهربية القلب في الصمة الرئوية)» — McGinn-White sign"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "مكوّن 'وايت' في هذا المركب محجوز لـ White بحسب التوثيق المعجمي، فاستخدامه مقابل Wyatt يُشوّش الهوية"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّات موجودة ──
    - lemma: "جيمس وايت"
      decision: removed
      decision_reason: >
        خطأ نقحري صريح: الشخص المقصود James Wyatt لا James White. المعجم الطبي الموحد يُثبت أن 'وايت'
        محجوزة لـ White (McGinn-White sign)، بينما Wyatt يُنقحر 'وايات/وَيَّات' (Brushfield-Wyatt syndrome).
        استبقاء هذه اللمّة يُحدث خلطاً بين شخصيتين مختلفتين.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وايت"
      decision: removed
      decision_reason: >
        نفس علة اللمّة السابقة: 'وايت' نقحرة راسخة لـ White في المعجمية العربية بشهادة المعجم الطبي الموحد.
        يوجب الدقة المصطلحية واتساق النقحرة حذفها واستبدالها بـ'وَيَّات'.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "جيمس وَيَّات"
      source: stage1
      decision: confirmed
      decision_reason: >
        النقحرة الصحيحة للاسم الكامل James Wyatt؛ مكوّن 'وَيَّات' موثّق في المعجم الطبي الموحد مقابل Wyatt.
        الاسم الكامل ضروري للتمييز من معماريين آخرين يحملون اللقب Wyatt (كجيفري وايات، وماثيو وايت وايات).
        اجتاز اختبار السكّ: 'جيمس وَيَّات' عَلَم شخصي ثابت لا يقبل إبدال أحد مكوّنيه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل — يُستعمل في السياقات الأكاديمية والتاريخية الرسمية التي تستوجب التمييز الدقيق"
      actions:
        - command: create_entry
          params: {lemma: "جيمس وَيَّات", pos: proper_noun}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "وَيَّات"
      source: stage1
      decision: confirmed
      decision_reason: >
        اللقب المختصر المُعرَّب بصورة صحيحة صوتياً؛ موثّق في المعجم الطبي الموحد مقابل Wyatt
        في مصطلحَي Brushfield-Wyatt. النقحرة تُميّز بوضوح عن 'وايت' (White).
        يُستعمل منفرداً في السياقات التخصصية المعمارية والبحثية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب المختصر — يُستعمل في السياقات التخصصية حيث السياق يُعيّن المقصود دون حاجة للاسم الأول"
      actions:
        - command: create_entry
          params: {lemma: "وَيَّات", pos: proper_noun}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "وايِت"
      source: stage1
      decision: removed
      decision_reason: >
        ملتبسة مع نقحرة White الراسخة في المعجمية العربية. إدراجها مقابل Wyatt يُعيد إنتاج الخطأ
        الموجود في اللمّات الحالية تماماً.

    - lemma: "جيمس وايِت"
      source: stage1
      decision: removed
      decision_reason: >
        تُطابق اللمّة الموجودة 'جيمس وايت' مع تشكيل مختلف — العلة واحدة: 'وايت' محجوزة لـ White.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
