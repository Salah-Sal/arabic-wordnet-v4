            والكلاسيكيّ الجديد، وعُيِّن مفتّشاً عاماً لأعمال الملك. من أشهر أعماله دير فونتهيل في وِلتشير،
            وإعادة بناء قصر ريدسدال، وترميم كثير من الكنائس القوطية في إنجلترا.

