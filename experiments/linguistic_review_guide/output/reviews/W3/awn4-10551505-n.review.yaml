# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الأولى (مدير الحلبة) مكتوبة بدون تشكيل؛ الصواب: مُدِيرُ الحَلْبَة"
      - "اللمّة الثانية (مقدم السيرك) مضلِّلة دلالياً: تصف مُقدِّمَ الإعلانات لا مُدِيرَ الحلبة تحديداً، وتقترب من معنى الأشمل الأعلى (مقدم الحفل)"
      - "التعريف العربي الحالي يصف الوظيفة وصفاً إدارياً جافاً ولا يُميِّز الخصائص الفارقة للمصطلح"
    observations: >-
      المجموعة تمثّل مفهوم "مدير حلبة السيرك" (ringmaster)، وهو دخيل ثقافياً في البيئة العربية لكنه مُصطلح
      عليه في معجم المورد الحديث بصيغة "مُدير الحَلْبة". الهيكل الإضافي للمصطلح سليم صرفياً وموافق لقياس
      المصطلحات المهنية في العربية. الإشكال الرئيسي في الضبط وفي وجود لمّة ثانية غير دقيقة.

  blind_candidates:
    - lemma: "سَيِّدُ الحَلَبَة"
      generation_method: tarkib
      justification: >-
        تركيب إضافي مباشر يوازي "ringmaster" (سيد = master/lord، الحلبة = the ring).
        "سيد" يحمل معنى السلطة والهيمنة وهو ما يُميِّز مدير الحلبة عن سائر العاملين في السيرك.
    - lemma: "رَئِيسُ الحَلَقَة"
      generation_method: tarkib
      justification: >-
        تركيب إضافي: "رئيس" (head/chief) + "الحلقة" (ring/circle). يُصوِّر المفهومَ الدائري للحلبة
        ويجعل صاحبها رأساً متصدِّراً لها.
    - lemma: "مُحَرِّكُ الحَلَبَة"
      generation_method: ishtiqaq
      justification: >-
        من الجذر "حرك" على وزن مُفَعِّل (Form II active participle). مُحَرِّك = الذي يُحيي ويُحرِّك؛
        يُعبِّر عن الدور الديناميكي لمدير الحلبة في إدارة تتابع العروض وإبقاء الحركة متصلة.
    - lemma: "مُدَبِّرُ العُرُوض"
      generation_method: ishtiqaq
      justification: >-
        من الجذر "دبر" على وزن مُفَعِّل (Form II active participle). مُدَبِّر = المنظِّم والمدير.
        "مدبّر العروض" يُشير إلى الشخص الذي يُنظِّم تسلسل الفقرات ويوجِّهها.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────
    - lemma: "مدير الحلبة"
      confirm:
        - text: "«مُدير الحَلْبة [في سِيْرك إلخ].»"
          source: "المورد الحديث (2008) — translation_en: ringmaster"
      expands:
        - text: "«مَوْضِعٌ يخَصَّصُ للمُلاكَمَة والمُصارَعَةِ ونحوهما»"
          source: "المعجم الكبير — مادة الحلبة"
          addition: "يُثبت أن «الحلبة» تعني الميدان/الساحة المُخصَّصة للعروض الجسدية، وهو المكان الذي يُدِيره صاحب اللمّة"
        - text: "«مَن يَتَوَلَّى تصرِيفَ أَمْرٍ مِنَ الأُمورِ، وهـو رَأسُ المسؤوليَّة بالنسبة لعمل مـا. كمُديرِ الشَّـرِكَة, ومدير الإدارة»"
          source: "المعجم الكبير — مادة المدير"
          addition: "يُثبت أن «مُدير» يحمل معنى رأس المسؤولية والتصريف، مناسب لمكانة مدير الحلبة"
        - text: "«سِيرك جَوّال- حَلَبة سِيرك»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر — مادة سيرك"
          addition: "يُثبت التركيب «حلبة سيرك» في الاستعمال المعاصر، مما يُسوِّغ «مدير الحلبة» بمعنى مدير حلبة السيرك"
        - text: "«(2) سِيرْك — translation_en: circus»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن «سيرك» هو المقابل العربي المعتمد لـ circus في المعجمية المعاصرة"

    - lemma: "مقدم السيرك"
      evidence_status: "no_material_found"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────
    - lemma: "سَيِّدُ الحَلَبَة"
      evidence_status: "no_material_found"

    - lemma: "رَئِيسُ الحَلَقَة"
      evidence_status: "no_material_found"

    - lemma: "مُحَرِّكُ الحَلَبَة"
      evidence_status: "no_material_found"

    - lemma: "مُدَبِّرُ العُرُوض"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّات موجودة ─────────────────────────────────────────
    - lemma: "مدير الحلبة"
      decision: confirmed
      decision_reason: >-
        اللمّة مؤكَّدة بالمعجمية المعاصرة (المورد الحديث 2008) بوصفها المقابل المعتمد لـ "ringmaster".
        التركيب الإضافي (مدير + الحلبة) سليم صرفياً، وعنصراه موثَّقان في المعاجم بالمعنيَين اللذَين
        يُشكِّلان هذا المصطلح. يحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      substitution_test: >-
        لا يمكن استبدال "مدير" بـ "مشرف" أو "مقدم" دون تغيير جوهري في الدلالة: "مدير" يُشير إلى
        سلطة تنفيذية وتوجيهية، أما "مشرف" فرقابية، و"مقدم" تقديمية إعلانية فحسب.
      nuance_differentiation: >-
        "مُدِيرُ الحَلْبَة" يُركِّز على دور الإدارة والتوجيه التنفيذي في المساحة الدائرية (الحلبة)
        تحديداً، بخلاف الأشمل الأعلى "مقدم الحفل" الذي يصف مضيف المناسبات بعامة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدِيرُ الحَلْبَة"

    - lemma: "مقدم السيرك"
      decision: removed
      decision_reason: >-
        (١) غير موثَّقة في أي معجم بمعنى "ringmaster". (٢) "مُقَدِّم" في المعجمية المعاصرة تعني
        مُقدِّم البرامج الإعلامي (host/presenter/anchorperson)، لا مُديرَ حلبةٍ. (٣) دلالتها قريبة
        جداً من الأشمل الأعلى "مقدم الحفل" مما يُربِك التمييز بين الفئة وأعمّها.
        (٤) "مقدم السيرك" يصف شخصاً يُقدِّم السيرك عموماً لا شخصاً يُدير حلبتَه تحديداً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────
    - lemma: "سَيِّدُ الحَلَبَة"
      source: stage1
      decision: removed
      decision_reason: >-
        غير موثَّق في أي معجم بهذه الصيغة المركَّبة. "سيد" يحمل معنى الهيمنة الاجتماعية لا الإدارة
        المهنية؛ كما أن "الحلبة" عادةً تُضبط بفتح اللام في سياق الميدان (حَلَبة) إلا أن الضبط
        المعياري للمعجم الوسيط والكبير هو الحَلْبة بسكون اللام. المصطلح لم يتثبَّت معجمياً.
      evidence_assessment:
        case: no_material

    - lemma: "رَئِيسُ الحَلَقَة"
      source: stage1
      decision: removed
      decision_reason: >-
        الخطأ المفهومي في المكوِّن الثاني: "الحلقة" (circle/loop) ≠ "الحلبة" (arena/ring). الحلبة
        هي المصطلح المستعمل للساحة الدائرية في السيرك، بينما "الحلقة" تُستخدم في سياقات أخرى
        (حلقة الذِّكر، الحلقة التلفزيونية). المصطلح ليس مسكوكاً معجمياً.
      evidence_assessment:
        case: no_material

    - lemma: "مُحَرِّكُ الحَلَبَة"
      source: stage1
      decision: removed
      decision_reason: >-
        "مُحَرِّك" في العربية المعاصرة انصرف معناه إلى المحرِّك الميكانيكي أو الحافز المعنوي، لا
        إلى من يُدير عروضاً. المصطلح ليس مسكوكاً ولا مُسجَّلاً في أي معجم.
      evidence_assessment:
        case: no_material

    - lemma: "مُدَبِّرُ العُرُوض"
      source: stage1
      decision: removed
      decision_reason: >-
        "مُدَبِّر العروض" وصفٌ مُنتَج لا مصطلح ثابت؛ اجتياز اختبار السكّ يُفضي إلى الفشل:
        يمكن استبدال "عروض" بـ"أعمال" أو "فقرات" ويبقى المعنى الوصفي صالحاً، مما يؤكد
        أنه عبارة وصفية لا وحدة معجمية مسكوكة. غير موثَّق معجمياً.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "الشخص المسؤول عن العروض في حلبة السيرك"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي وصفٌ وظيفي مجرَّد؛ يستخدم "المسؤول" ذات الطابع الإداري البيروقراطي بدلاً
        من التعبير عن الدور الفعلي (الإشراف + التقديم + التوجيه). كما يخلو من الجنس القريب الصريح
        وبعض الفصول النوعية الفارقة.
    authored:
      - type: terminological
        text: >-
          شخصٌ يتولَّى الإشرافَ على عروضِ حلبةِ السِّيرك وإدارَتَها، ويُقدِّمُ فِقراتِها
          المتعاقبةَ أمام الجمهور، ويوجِّهُ المؤدِّينَ والحيواناتِ المدرَّبةَ خلال الأداء
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          المديرُ التنفيذيُّ لحلبةِ السِّيرك، يَقِفُ في مركزِ الساحةِ الدائريَّة ويُعلنُ
          عن بدءِ كلِّ فِقرة بصوتٍ جهوري، مُنسِّقاً بين الألعابِ البهلوانيَّةِ وفِقراتِ
          الحيوانات والعروضِ الموسيقية، ويتميَّز تقليدياً بقبعةٍ عاليةٍ وزيٍّ رسميٍّ وقضيبٍ طويل
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10551505-n"
          definition_index: 0
          text: >-
            شخصٌ يتولَّى الإشرافَ على عروضِ حلبةِ السِّيرك وإدارَتَها، ويُقدِّمُ فِقراتِها
            المتعاقبةَ أمام الجمهور، ويوجِّهُ المؤدِّينَ والحيواناتِ المدرَّبةَ خلال الأداء
      - command: add_definition
        params:
          synset_id: "awn4-10551505-n"
          text: >-
            المديرُ التنفيذيُّ لحلبةِ السِّيرك، يَقِفُ في مركزِ الساحةِ الدائريَّة ويُعلنُ
            عن بدءِ كلِّ فِقرة بصوتٍ جهوري، مُنسِّقاً بين الألعابِ البهلوانيَّةِ وفِقراتِ
            الحيوانات والعروضِ الموسيقية، ويتميَّز تقليدياً بقبعةٍ عاليةٍ وزيٍّ رسميٍّ وقضيبٍ طويل

  examples:
