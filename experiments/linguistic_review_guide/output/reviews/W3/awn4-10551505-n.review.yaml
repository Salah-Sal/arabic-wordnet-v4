      - lemma: "مُدِيرُ الحَلْبَة"
        examples:
          - text: "أدارَ مُدِيرُ الحَلْبَةِ عروضَ السِّيركِ باقتدار، يُنسِّقُ بين الفِقراتِ المتتاليةِ ويُرحِّبُ بالجمهورِ بصوتٍ آسِر وحضورٍ طاغٍ"
            type: usage
    actions:
      - command: add_sense_example
        params:
