# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-11185844-n | ILI: i96169
# Peter Paul Mauser — مصنع الأسلحة الألماني ومخترع البندقية والمسدس
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل مما يُعسِّر الضبط الصوتي"
      - "لا تُضاف لمّة 'فون ماوزر' المقابِلة للمُعادِل الإنجليزي 'von Mauser' الموجود في OEWN"
      - "POS في المدخلَين يجب أن يكون proper_noun لا noun، إذ المقصود شخص بعينه"
      - "التعريف العربي يستعمل 'مصنع أسلحة' وهي كلمة لا تؤدّي معنى 'manufacturer' بدقة؛ الأصحّ 'صانع أسلحة'"
      - "التعريف لا يذكر أن ماوزر أسّس الشركة الصناعية التي تحمل اسمه، وهي معلومة موسوعية جوهرية"
    observations: >
      هذه المجموعة الترادفية تُمثّل عَلَماً شخصياً لشخص تاريخي ألماني هو بيتر بول ماوزر
      (1838–1914)، صانع الأسلحة ومخترع البندقية والمسدس المتكررَي الطلقات. وبما أن المُدخَل
      عَلَمٌ أعجمي، فإن التعريب (الترجمة الصوتية) هو المنهج الوحيد المُتاح لتوليد اللمّات؛
      ولا مجال هنا للاشتقاق أو المجاز. الشكل الأكثر شيوعاً في العربية هو "ماوزر" للكنية
      المفردة، و"بيتر بول ماوزر" للاسم الكامل. وكلتا الصيغتَين تفتقران إلى التشكيل. علاوةً
      على ذلك، لفظ "ماوزر" مشترك لفظياً بين الشخص واسم السلاح المنسوب إليه، مما يستدعي
      تمييزاً دلالياً في التعريف.

  blind_candidates:
    - lemma: "مَاوْزِر"
      generation_method: taarib
      justification: >
        الاسم المختصر للشخص بالكنية العائلية وحدها؛ وهو الشكل الأكثر تداولاً في الأدبيات
        العربية العسكرية والتاريخية عند الإشارة إلى صانع الأسلحة الألماني ومخترع البندقية
        المتكررة الطلقات المنسوبة إليه.
    - lemma: "بِيتِر بُولُ مَاوْزِر"
      generation_method: taarib
      justification: >
        النقل الصوتي الكامل للاسم الثلاثي (بيتر + بول + ماوزر)، يُستخدم في السياقات
        الأكاديمية والتاريخية عند التعريف الأول أو الاستشهاد الرسمي بالمخترع الألماني
        (1838–1914).
    - lemma: "فُون مَاوْزِر"
      generation_method: taarib
      justification: >
        الصيغة مع حرف النبالة الألماني "فون"، تقابل المُعادِل الإنجليزي "von Mauser"؛
        يُستخدم في الكتابات الأكاديمية التي تحرص على الدقة في تمثيل النسب الأسري وألقاب
        النبالة الألمانية.
    - lemma: "بِيتِر بُولُ فُون مَاوْزِر"
      generation_method: taarib
      justification: >
        الاسم الرباعي الكامل مع لاحقة النبالة؛ يقابل المُعادِل الإنجليزي "P. P. von Mauser"
        أو "Peter Paul von Mauser"، وهو الاسم الرسمي الكامل في المصادر التاريخية الأجنبية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — بحث دفعي بالعنوان (batch headword): جميع اللمّات + المرشحات → لا نتائج
#   Q2 — الجسر الإنجليزي (translation_en: "Mauser" OR "Peter Paul Mauser" OR "von Mauser") → لا نتائج
#   Q3 — البحث بالكلمات المفتاحية (FTS: "ماوزر" OR "مسدس ماوزر" OR "بندقية ماوزر") → لا نتائج
#   Q4 — بحث موسَّع (rifle / pistol / repeating / arms manufacturer) → نتائج عامة، لا شيء عن ماوزر
# الخلاصة: المصادر المعجمية العربية في قاعدة البيانات خالية تماماً من مادة عن ماوزر الشخص.
stage2_evidence:
  per_lemma:
    - lemma: "بيتر بول ماوزر"
      evidence_status: "no_material_found"

    - lemma: "ماوزر"
      evidence_status: "no_material_found"

    - lemma: "مَاوْزِر"
      evidence_status: "no_material_found"

    - lemma: "بِيتِر بُولُ مَاوْزِر"
      evidence_status: "no_material_found"

    - lemma: "فُون مَاوْزِر"
      evidence_status: "no_material_found"

    - lemma: "بِيتِر بُولُ فُون مَاوْزِر"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: بيتر بول ماوزر ──
    - lemma: "بيتر بول ماوزر"
      decision: confirmed
      decision_reason: >
        الاسم الثلاثي الكامل للشخص التاريخي المقصود، وهو التقليد المعياري في المراجع العربية
        الموسوعية والتاريخية عند ذكر أعلام الغرب. غياب المادة المعجمية في قاعدة البيانات
        طبيعيٌّ لأن المعاجم العربية لا تُفرد مداخل لأسماء الأشخاص الأجانب عادةً. وثبات الصيغة
        في الاستخدام الموسوعي والإعلامي العربي يكفي لتثبيتها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُستخدم للتعريف الأول أو الإشارة الرسمية إلى الشخص في السياقات الأكاديمية
        والموسوعية، إذ يحمل الاسم الكامل دلالة الدقة التوثيقية والرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِيتِر بُولُ مَاوْزِر"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── لمّة موجودة: ماوزر ──
    - lemma: "ماوزر"
      decision: confirmed
      decision_reason: >
        الكنية المختصرة الأكثر شيوعاً في العربية للإشارة إلى هذا الشخص، وكذلك تُستخدم للسلاح
        المنسوب إليه. ورغم الاشتراك اللفظي المحتمل مع اسم السلاح، فإن السياق يُزيل الإبهام.
        الصيغة ثابتة في الكتابة العسكرية والتاريخية العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الكنية المختصرة؛ يُستخدم في السياقات غير الرسمية وعند تكرار الإشارة بعد التعريف
        الأول بالاسم الكامل، أو في السياقات التقنية المتعلقة بالأسلحة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَاوْزِر"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشح المرحلة ١: مَاوْزِر ──
    # (يطابق اللمّة الموجودة "ماوزر" بعد إضافة التشكيل — مُدمَج مع الموجودة)
    - lemma: "مَاوْزِر"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة "ماوزر" بعد إضافة التشكيل، وقد تمت معالجتها أعلاه
        ضمن اللمّات الموجودة. لا حاجة لمدخل مكرر.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: بِيتِر بُولُ مَاوْزِر ──
    # (يطابق اللمّة الموجودة "بيتر بول ماوزر" بعد التشكيل — مُدمَج)
    - lemma: "بِيتِر بُولُ مَاوْزِر"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة "بيتر بول ماوزر" بعد إضافة التشكيل. تمت معالجتها
        في قسم اللمّات الموجودة أعلاه.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: فُون مَاوْزِر ──
    - lemma: "فُون مَاوْزِر"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل المُعادِل الإنجليزي "von Mauser" الوارد في OEWN كلمّة معترف بها للمجموعة.
        صيغة "فون ماوزر" مستخدمة في المراجع العربية التي تنقل أسماء النبلاء الألمان بأمانة.
        رغم غياب المادة المعجمية في قاعدة البيانات، فإن وجودها في OEWN ومبدأ توازي
        المُعادِلات الإنجليزية-العربية يُسوّغ إضافتها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة مع حرف النبالة الألماني "فون"؛ تُستخدم في السياقات التي تحرص على نقل
        النسب الأرستقراطي بدقة، وتتميز عن "ماوزر" المجردة بتأكيد الانتماء الأسري النبيل.
      actions:
        - command: create_entry
          params:
            lemma: "فُون مَاوْزِر"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: بِيتِر بُولُ فُون مَاوْزِر ──
    - lemma: "بِيتِر بُولُ فُون مَاوْزِر"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة الرباعية مطوّلة ومُركّبة بشكل يجعل تداولها في العربية ثقيلاً. إذ تكفي
        لمّة "بيتر بول ماوزر" (بدون "فون") في السياق الأكاديمي العربي، بينما "فون ماوزر"
        تغطّي الحاجة للصيغة ذات النبالة. الجمع بين الاثنتين زيادة لا مسوّغ لها.
      evidence_assessment:
        case: no_material

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: n


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مصنع أسلحة ومخترع ألماني لبندقية ومسدس متكرر الطلقات (1838-1914)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي فيه ملاحظات ثلاث: (١) "مصنع أسلحة" تعني في العربية المعاصرة المنشأةَ
        الصناعية (factory)، والمقصود هو "صانع أسلحة" (arms maker/manufacturer). (٢) لا يُشير
        التعريف إلى تأسيسه شركة ماوزر الصناعية التي باتت من أبرز الشركات الأسلحة الألمانية.
        (٣) عبارة "بندقية ومسدس متكرر الطلقات" مُبهمة من حيث المطابقة النحوية؛ إذ "متكرر"
        يعود على "مسدس" فقط — يُحسن استخدام المثنى أو إعادة الصياغة.
    authored:
      - type: encyclopedic
        text: >
          صانع أسلحة ومخترع ألماني (1838–1914)، اشتُهر باختراع بندقية متكررة الطلقات
          ومسدس متكرر الطلقات يحملان اسمه، وأسّس شركة ماوزر لتصنيع الأسلحة التي
          أصبحت من أبرز الشركات العسكرية الألمانية.
      - type: terminological
        text: >
          مخترع ألماني وصانع أسلحة (1838–1914)، جنسه صانع أسلحة، وفصله النوعي
          أنه ألماني اخترع بندقيةً ومسدساً متكرري الطلقات أُسِّست على اسمه شركة أسلحة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "صانع أسلحة ومخترع ألماني (1838–1914)، اشتُهر باختراع بندقية متكررة الطلقات ومسدس متكرر الطلقات يحملان اسمه، وأسّس شركة ماوزر لتصنيع الأسلحة التي أصبحت من أبرز الشركات العسكرية الألمانية."
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "مخترع ألماني وصانع أسلحة (1838–1914)، اخترع بندقيةً ومسدساً متكرري الطلقات أُسِّست على اسمه شركة أسلحة ألمانية شهيرة."

  examples:
    per_lemma:
      - lemma: "بِيتِر بُولُ مَاوْزِر"
        examples:
          - text: "صمَّم بيتر بول ماوزر بندقيته الشهيرة التي اعتمدتها الجيوش الأوروبية في أواخر القرن التاسع عشر."
            type: usage
      - lemma: "مَاوْزِر"
        examples:
          - text: "يُعدّ ماوزر من أبرز صانعي الأسلحة الألمان، إذ أحدثت بندقيته وأسلحته ثورةً في تصميم الأسلحة النارية."
            type: usage
      - lemma: "فُون مَاوْزِر"
        examples:
          - text: "احتفظت مجموعة المتحف العسكري بمراسلات تاريخية تكشف تفاصيل اختراعات فون ماوزر ودوره في تطوير الأسلحة الألمانية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "صمَّم بيتر بول ماوزر بندقيته الشهيرة التي اعتمدتها الجيوش الأوروبية في أواخر القرن التاسع عشر."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدّ ماوزر من أبرز صانعي الأسلحة الألمان، إذ أحدثت بندقيته وأسلحته ثورةً في تصميم الأسلحة النارية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "احتفظت مجموعة المتحف العسكري بمراسلات تاريخية تكشف تفاصيل اختراعات فون ماوزر ودوره في تطوير الأسلحة الألمانية."


