# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10684629-n  |  ili: i93379
# Lemmas: رجل قوي          |  EN: strongman
# Definition: a man who performs feats of strength at a fair or circus
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «رجل قوي» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل اختبار التثبيت المعجمي (يمكن إبدال «قوي» بـ«شديد» أو «ضخم» وتبقى الجملة وصفاً صالحاً)"
      - "اللمّة تفتقر إلى التشكيل الكامل"
      - "«رجل قوي» بالمعنى المعجمي المتداول يُحيل إلى معنى سياسي (الزعيم الطاغية) وليس إلى عارض القوة في السيرك — اشتراك دلالي مُضلِّل"
      - "المجموعة ترادفية ذات لمّة واحدة فقط — فقر معجمي واضح يستوجب الإثراء"
    observations: >
      المفهوم المقصود هو المؤدّي الذي يستعرض قوته الجسدية أمام الجمهور في حفلات السيرك
      أو المعارض الشعبية. الإنجليزية تستخدم strongman للمعنيين: المؤدّي الاستعراضي،
      والزعيم السياسي المستبدّ. لا يوجد في العربية المعاصرة مصطلح أحادي الكلمة مسكوك
      وشائع لهذا المؤدّي بالذات؛ وهو ما يُفسّر اعتماد اللمّة الوصفية الراهنة.
      الحلّ الأمثل هو تركيب إضافي يُبرز البُعد الأدائي/الاستعراضي.

  blind_candidates:
    - lemma: "عارِضُ القُوَى"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «عارِض» (اسم فاعل من عَرَضَ بمعنى أظهر وأبان) و«القُوَى»
        (جمع قُوَّة). يُبرز البُعد الأدائي الذي هو جوهر المفهوم: من يعرض قواه البدنية
        أمام جمهور. يقبل الجمع «عارِضو القُوَى» والنسبة «عارضيّ». يجتاز اختبار السكّ:
        لا يمكن إبدال «القُوَى» بلفظ آخر وإبقاء الدلالة التخصصية.
    - lemma: "صِنْدِيد"
      generation_method: majaz
      justification: >
        لفظ عربي أصيل يُطلق على الشجاع الشديد الجسيم من الرجال. يمكن توظيفه مجازاً
        للدلالة على عارض القوة الذي تجمع صورته بين الضخامة والقوة الخارقة.
        غير أنه في الأصل يحمل دلالة الشرف والرئاسة أكثر من الأداء الاستعراضي.
    - lemma: "مُقَاوٍ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من قاوَى (فَاعَلَ من القوة) على وزن مُفَاعِل، بمعنى من يتحدّى غيره
        في القوة. الوزن مُفَاعِل منتج في الأفعال التنافسية. غير أن «قاوَى» غير شائع
        في الاستعمال الحديث وقد لا يكون مسكوكاً بما يكفي.
    - lemma: "لاعِبُ القُوَى"
      generation_method: tarkib
      justification: >
        مركّب إضافي من «لاعِب» و«القُوَى»، على غرار «لاعب الكرة». يوحي بالصلة
        بمجال ألعاب القوى، غير أن «ألعاب القوى» في العربية المعاصرة مصطلح رياضي
        محدد (Athletics) مغاير للمفهوم الاستعراضي في السيرك.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  queries_executed:
    - pattern: "batch_headword_lookup"
      terms: ["رجل قوي", "الرجل القوي", "عارض القوى", "صنديد", "الصنديد", "مقاو", "المقاو", "لاعب القوى", "بهلوان", "البهلوان", "جبار", "الجبار"]
    - pattern: "english_bridge"
      terms: ["strongman", "strong man", "acrobat", "circus performer", "weightlifter"]
    - pattern: "fts_keyword"
      terms: ["قوة", "سيرك", "معرض", "مآثر", "عارض", "لاعب القوى"]
    - pattern: "maqayis_roots"
      roots: ["عرض", "قوي", "رجل"]

  per_lemma:
    - lemma: "رجل قوي"
      confirm:
        - text: "«الرَّجُل القويّ: الزَّعيم؛ القائد؛ الطّاغية.»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >
            المورد الحديث يُقابل strongman بـ«الرجل القوي» لكنه يوجّه الدلالة نحو المعنى
            السياسي (الزعيم/الطاغية) لا نحو المؤدّي في السيرك، مما يكشف الاشتراك الدلالي.
      contradicts:
        - text: "«الرَّجُل القويّ: الزَّعيم؛ القائد؛ الطّاغية.»"
          source: "المورد الحديث (2008) — ARABTERM"
          conflict: >
            التعريف المعجمي لـ«الرجل القوي» في المورد الحديث يُحيل إلى المعنى السياسي
            (strongman = dictator) لا إلى المؤدّي الاستعراضي المقصود في هذا المجمع.
            هذا الاشتراك يُضعف الدقة الدلالية للمّة في سياق السيرك والمعارض.

    - lemma: "عارِضُ القُوَى"
      evidence_status: "no_material_found"

    - lemma: "صِنْدِيد"
      contradicts:
        - text: "«الصِّنْدِيدُ: الشريفُ الشُّجاعُ من الناس: الصنديد الشديد. يقال: بَرْدٌ صِنديد, وريحٌ صِنديد, ومطرٌ صنديد. صناديد القَدَر: دواهيه.»"
          source: "المعجم الوسيط — OCR"
          conflict: >
            الصِّنديد يحمل دلالات الشرف والرئاسة والشجاعة الحربية، لا الأداء الاستعراضي
            في سياق السيرك. الحقل الدلالي مغاير تماماً.
        - text: "«من الرِّجال: الصُّنْدُدُ الملكُ العظيمُ الشريفُ الرئيسُ العظيمُ والى القوم، ومُتَوَلِّى مُهمَّاتِهم، الكبيرُ الجامعُ للولايةِ.»"
          source: "المعجم الكبير — OCR"
          conflict: >
            المعجم الكبير يؤكد أن الصنديد لقبٌ إشرافي سياسي، لا مصطلح للمؤدي الاستعراضي.

    - lemma: "مُقَاوٍ"
      evidence_status: "no_material_found"

    - lemma: "لاعِبُ القُوَى"
      evidence_status: "no_material_found"

  supplementary_findings:
    - lemma: "بُهْلُوان"
      note: >
        وُجد في المعجمين ولكنه لم يكن مرشحاً أصلياً؛ يُشير إلى الأكروبات/المشي على الحبل.
      expands:
        - text: "«البُهْلُوان: البارع في نوع من الألعاب، كالمشي على الحبل.»"
          source: "المعجم الوسيط — OCR"
          addition: >
            البهلوان أعمّ من المقصود (يشمل الأكروبات والمهرّج والمشّاء على الحبل)
            وليس خاصاً بعارض القوة. وهو مُعرَّب من الفارسية (pahlavān).
        - text: "«البُهْلُوان: البَطَل.»"
          source: "المعجم الكبير — OCR"
          addition: >
            المعجم الكبير يُعادل البهلوان بـ«البطل» وهو تقارب دلالي مع المفهوم
            لكنه لا يزال أعمّ من عارض القوة في السيرك تحديداً.
        - text: "«بهلوان — translation_en: jongleur (fr.), acrobat»"
          source: "مسارد ArabTerm (فن وتسلية ورياضة / جغرافيا وتاريخ)"
          addition: >
            ARABTERM يُقابل «بهلوان» بـ acrobat وjongleur، مؤكداً دلالة الأكروبات
            العامة لا الاختصاص بعرض القوة.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "رجل قوي"
      decision: confirmed
      decision_reason: >
        رغم أن «رجل قوي» عبارة وصفية حرة وليست مصطلحاً مسكوكاً، تُبقى هنا بوصفها
        التعبير الأقرب المتداول في السياقات الاستعراضية والإعلامية. تستوجب:
        (أ) تشكيلاً كاملاً، (ب) توثيق طابعها الوصفي في الملاحظات. وتُضاف إليها
        «عارِضُ القُوَى» لسدّ فجوة المصطلح الأدقّ.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      morphological_check: >
        «رَجُل» اسم جنس (فَعُل)، «قَوِيّ» صفة مشبهة على فَعِيل من قَوِيَ.
        التركيب وصفي حر (wasfi)، يقبل التأنيث «امرأة قوية» والجمع «رجال أقوياء».
        ليس مركّباً مُدمَجاً ولا وحدة معجمية ثابتة.
      loan_check:
        lexical_borrowing: "لا — كلتا الكلمتين عربية أصيلة"
        blind_translation: >
          يُقابل strongman (circus performer) بدقة قابولة إذا قُيّد السياق بالأداء
          الاستعراضي، وإن كان strongman يحمل أيضاً المعنى السياسي الذي يُغري بالخلط.
        calque: "لا"
      quality_gate:
        ittiraad: "مقبول — «رجل قوي» تعبير فصيح شائع"
        yusr_tadawul: "عالٍ — سهل النطق والفهم"
        mulaaa'ama: "متوسطة — يصفه ولا يُسمّيه تسمية اصطلاحية"
        iihthar_turathi: "لا ينطبق — لا يوجد لفظ تراثي مخصص"
        iihthar_arabi: "نعم — كلاهما عربي"
        ishtiqaqiyya: "منخفضة — صفة وصفية لا مصطلح مشتق"
      nuance_differentiation: >
        «رَجُلٌ قَوِيٌّ» يُركّز على الصفة الجوهرية للشخص (القوة البدنية)
        بوصفها هويته، وهو الأعمّ والأشيع في الاستعمال اليومي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَجُلٌ قَوِيٌّ"

    # ── مرشح المرحلة ١ — مقبول ──
    - lemma: "عارِضُ القُوَى"
      source: stage1
      decision: confirmed
      decision_reason: >
        مركّب إضافي منتظم يُبرز البُعد الأدائي/الاستعراضي الذي هو جوهر المفهوم.
        «عارِض» اسم فاعل من عَرَضَ (أظهر، استعرض)، و«القُوَى» جمع قُوَّة. يجتاز
        اختبار التثبيت المعجمي: لا يصحّ إبدال «القُوَى» بمرادف وإبقاء الدلالة
        التخصصية ذاتها. يقبل الجمع «عارِضو القُوَى» والنسبة. لم يُعثر له على
        توثيق معجمي لكن التركيب شفّاف ومنتظم وقياسي في العربية المعاصرة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      morphological_check: >
        «عارِض» على وزن فَاعِل اسم فاعل من الثلاثي عَرَضَ. «القُوَى» جمع قُوَّة
        على وزن فُعَل. الإضافة تُخصَّص الجنس (عارِض) بالنوع (القُوَى).
      loan_check:
        lexical_borrowing: "لا — كلا المكوّنَيْن عربيان أصيلان"
        blind_translation: "التركيب يُقابل بدقة the one who displays/performs feats of strength"
        calque: "لا"
      quality_gate:
        ittiraad: "مقبول — التركيب الإضافي اسم الفاعل + المفعول قياسي"
        yusr_tadawul: "جيد — أربعة مقاطع، سلس النطق"
        mulaaa'ama: "عالية — يصف الأداء الاستعراضي تحديداً"
        iihthar_turathi: "استُنفد — لا يوجد لفظ تراثي مخصص لهذا المفهوم"
        iihthar_arabi: "نعم — تركيب عربي صرف"
        ishtiqaqiyya: "جيدة — «عارِض» مشتق قياسي"
      nuance_differentiation: >
        «عارِضُ القُوَى» يُركّز على فعل الاستعراض والأداء أمام الجمهور،
        ويُميّزه عن «رَجُلٌ قَوِيٌّ» الذي يصف الصفة الجسدية دون الإشارة
        إلى السياق الاستعراضي. الأول مصطلح وظيفي، والثاني وصف ذاتي.
      actions:
        - command: create_entry
          params:
            lemma: "عارِضُ القُوَى"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "صِنْدِيد"
      source: stage1
      decision: removed
      decision_reason: >
        «الصِّنديد» في المعاجم يحمل دلالة الشرف والرئاسة والشجاعة الحربية لا الأداء
        الاستعراضي. الحقل الدلالي مغاير تماماً. الأدلة تتعارض مع استخدامه للدلالة
        على مؤدّي السيرك.

    - lemma: "مُقَاوٍ"
      source: stage1
      decision: removed
      decision_reason: >
        «مُقَاوٍ» (اسم فاعل من قاوَى) غير مسكوك في المعاجم ولم يُعثر له على توثيق.
        فعل «قاوَى» نادر في الاستعمال المعاصر، والمصدر لا يحيل بطبيعته إلى الأداء
        الاستعراضي بل إلى المنافسة والتحدي.

    - lemma: "لاعِبُ القُوَى"
      source: stage1
      decision: removed
      decision_reason: >
        «ألعاب القُوَى» مصطلح رياضي عربي راسخ يُحيل إلى Athletics (الجري، القفز،
        الرمي). «لاعب القوى» سيُوهم بالصلة بهذه الرياضة، مما يُفضي إلى لبس مفهومي
        مع المجمع الترادفي الخاص بالرياضيين لا المؤدّين الاستعراضيين.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "رجل يؤدي مآثر القوة في معرض أو سيرك"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه لكنه يفتقر إلى الدقة الاصطلاحية:
        (أ) «مآثر القوة» لفظة غريبة في هذا السياق — «المأثَرة» في الأصل تُطلق على
        الفعل الشريف لا على العرض الجسدي الاستعراضي؛ والأدق «مآثر الشدّة» أو
        «ألعاب القوة» أو «مشاهد القوة».
        (ب) التعريف لا يُحدّد الجنس القريب (مؤدٍّ / فنان استعراضي) بوضوح.
        (ج) يُحسَن استبدال «معرض أو سيرك» بـ«الحفلات الاستعراضية والمعارض الشعبية»
        ليكون أكثر شمولاً.
    authored:
      - type: terminological
        text: "مؤدٍّ فنيٌّ استعراضيٌّ يُظهر أمام الجمهور ألعابَ القوة الجسدية كرفع الأثقال وكسر القيود في حفلات السيرك والمعارض الشعبية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "فنان يرتدي عادةً زيّاً يُبرز بنيته الجسدية، ويستعرض أمام الجمهور قدرات القوة البدنية الخارقة كرفع أثقال ضخمة وتحطيم سلاسل وسحب مركبات، وذلك في الأجواء الاحتفالية للسيرك والمعارض والكرنفالات"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
