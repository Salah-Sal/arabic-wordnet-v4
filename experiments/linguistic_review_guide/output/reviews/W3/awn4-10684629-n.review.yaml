      - lemma: "رَجُلٌ قَوِيٌّ"
        examples:
          - text: "أثار الرجلُ القويُّ في السيرك دهشةَ الحاضرين حين رفع ثلاثةَ أشخاص على كتفيه دون أن يرفّ له جَفْن."
            type: usage
      - lemma: "عارِضُ القُوَى"
        examples:
          - text: "استقطب عارضُ القُوَى في المعرض الشعبي حشوداً غفيرةً تراهن على قدرته في سحب شاحنة كاملة بحبل واحد."
            type: usage
    actions:
