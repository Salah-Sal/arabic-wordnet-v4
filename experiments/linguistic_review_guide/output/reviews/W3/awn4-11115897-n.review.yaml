# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة اسم علم لشخص تاريخي محدد (المهندس المعماري لويس كان)؛ التوليد الأعمى للمرشحات مستحيل انطلاقاً من التعريف وحده لأنه لا يكشف الاسم صراحةً، وجميع المرشحات ستكون عبر التعريب لا غير"
      - "اللمّة 'كان' تتطابق رسمياً مع الفعل الناقص العربي 'كَانَ' وحرف التشبيه 'كَأَنَّ'، وهو تصادم رسمي خطير يُفضي إلى التباس شديد عند انعدام التشكيل"
      - "اللمّتان الموجودتان مفتقرتان للتشكيل الكامل"
      - "غياب لمّة الاسم الثلاثي الرسمي 'لويس إيزادور كان' المقابلة للعَلَم الإنجليزي 'Louis Isadore Kahn'"
      - "POS المداخل في قاعدة البيانات يجب تحديثه إلى proper_noun"
    observations: >
      هذه المجموعة تمثّل اسم علم خاص للمهندس المعماري الأمريكي لويس إيزادور كان (1901–1974م)،
      المولود في جزيرة سارِمَا الإستونية والمتوفى في فيلادلفيا، وأحد أبرز رواد الحداثة المعمارية
      في القرن العشرين. اللقب 'Kahn' أصله ألماني بمعنى "ملاح قارب"، وتعريبه الشائع 'كَان' يصطدم
      رسمياً بالفعل العربي الأكثر تداولاً في اللغة. يُعالَج هذا الإشكال بالتشكيل الكامل وضبط POS.
      عملية التوليد الأعمى محدودة هنا بطبيعة المجموعة العَلَمية؛ كل مرشح سيكون تعريباً لأشكال
      الاسم المختلفة لا اشتقاقاً أو مجازاً.

  blind_candidates:
    - lemma: "لُويس كَان"
      generation_method: taarib
      justification: "تعريب قياسي للاسم الثنائي 'Louis Kahn': 'لويس' النطق المعتمد في العربية لـ'Louis' (الفرنسي/الإنجليزي)، و'كَان' لـ'Kahn' (الألماني: قارب/ملاح); هذه الصيغة هي الأشيع في المصادر المعمارية العربية"
    - lemma: "لُويس إِيزَادُور كَان"
      generation_method: taarib
      justification: "تعريب الاسم الثلاثي الرسمي 'Louis Isadore Kahn' بإدراج الاسم الأوسط 'Isadore' المُعرَّب 'إيزادور'؛ يُستخدم في التوثيق الأكاديمي والبيوغرافي للتمييز الدقيق"
    - lemma: "كَان"
      generation_method: taarib
      justification: "اللقب العائلي المنفرد 'Kahn' مُعرَّباً؛ شائع في الفهارس المعمارية والإحالات المختصرة إلى المعماريين بألقابهم"
    - lemma: "لُوِيس كَاهْن"
      generation_method: taarib
      justification: "تعريب بديل أكثر إخلاصاً للنطق الألماني/الإستوني الأصلي لـ'Kahn' حيث النون النهائية صريحة والهاء مسموعة؛ يميّز اللقب رسمياً عن الفعل العربي 'كان'"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات نُفِّذت:
#   ١. مطابقة دفعية: headword_norm IN ('كان','الكان','لويس كان','اللويس كان','لويس إيزادور كان') → 19 نتيجة، كلها للفعل/الحرف العربي
#   ٢. جسر إنجليزي: translation_en:"Louis Kahn" OR "Kahn" OR "Louis Isadore Kahn" → نتيجتان لـ"اختبار كان الطبي" (كان آخر) لا للمعماري
#   ٣. FTS عربي: "معماري" OR "إستونيا" → مصطلحات معمارية عامة، لا شاهد على المعماري الموصوف
stage2_evidence:
  per_lemma:
    - lemma: "كَان"
      contradicts:
        - text: "«(كَانَ) الشَّيْء كَوْناً وكياناً وكَيْنونة: حدث, فهو كائن... ترفع الاسم وتنصب الخبر نحو: كان زيدٌ قائماً»"
          source: "المعجم الوسيط"
          conflict: "الرسم 'كان' في كل مصادر قاعدة البيانات مخصَّص للفعل الناقص العربي وحرف التشبيه 'كَأَنَّ'؛ لا يوجد مدخل بوصفه لقباً أعجمياً للمعماري كان"
        - text: "«(كَانَ) الْكَافُ وَالْأَلِفُ وَالنُّونُ. يَقُولُونَ: كَأَنَ، أَيِ اشْتَدَّ، وكَأَنْتُ: اشْتَدَدْتُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر العربي الأصيل (كأن / كون) مغاير تماماً في المنشأ والدلالة للقب الأجنبي 'Kahn'"

    - lemma: "لُويس كَان"
      evidence_status: "no_material_found"

    - lemma: "لُويس إِيزَادُور كَان"
      evidence_status: "no_material_found"

    - lemma: "لُوِيس كَاهْن"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "كان"
      decision: confirmed
      decision_reason: >
        اللقب 'Kahn' في صيغة تعريبه 'كَان' مقبول كلمّة لاسم علم في AWN4 رغم التصادم
        الرسمي مع الفعل العربي؛ الإشكال يُعالَج بالتشكيل الكامل (كَان بفتح الكاف وسكون
        النون مقابل كَانَ بالألف والتنوين) وتحديد POS إلى proper_noun لإزالة الغموض
        الصرفي؛ اللمّة ضرورية للاقتصاد الدلالي في الإشارات المختصرة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب العائلي 'Kahn' منفرداً؛ يُستخدم في الإحالات المختصرة والفهارس المعمارية والأكاديمية، ويمتاز عن 'لُويس كَان' بعدم تضمّنه الاسم الشخصي، غير أنه أكثر عرضةً للالتباس بالفعل العربي عند انعدام التشكيل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَان"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── لمّة موجودة ٢ ──
    - lemma: "لويس كان"
      decision: confirmed
      decision_reason: >
        الصيغة المعيارية المعتمدة للاسم الثنائي 'Louis Kahn' في المراجع المعمارية والأكاديمية
        العربية؛ غياب الأدلة المعجمية مُتوقَّع لأسماء الأعلام الأجنبية الحديثة؛ اللمّة صحيحة
        صرفياً وتُقرأ في العربية بلا إشكال عند التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الثنائي الكامل (الاسم الشخصي 'لويس' + اللقب العائلي 'كان')؛ الصيغة الأكثر انتشاراً في المصادر المعمارية والإعلامية العربية، وتمتاز عن 'كَان' المفردة بالوضوح وإزالة شبه تامة لالتباس الرسم بالفعل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُويس كَان"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشح المرحلة ١ (مؤكَّد) ──
    - lemma: "لُويس إِيزَادُور كَان"
      source: stage1
      decision: confirmed
      decision_reason: >
        يقابل العَلَم الإنجليزي الثالث 'Louis Isadore Kahn' الموجود في البيانات الإنجليزية؛
        إضافة ضرورية لاكتمال تمثيل الأشكال الاسمية الثلاثة للشخص في الشبكة الدلالية العربية
        بما يوازي الشبكة الإنجليزية؛ يُستخدم في الوثائق الرسمية والسير الذاتية الأكاديمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الثلاثي الرسمي الكامل (الشخصي + الأوسط 'إيزادور' + العائلي)؛ يُستخدم للتعريف الدقيق في الأبحاث الأكاديمية والتوثيق البيوغرافي؛ الأكثر تخصيصاً بين الصيغ الثلاث"
      actions:
        - command: create_entry
          params:
            lemma: "لُويس إِيزَادُور كَان"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١ (مرفوض) ──
    - lemma: "لُوِيس كَاهْن"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب غير معتمد في المراجع العربية المعمارية؛ الشكل السائد في هذه المصادر هو 'لويس كان'
        لا 'لويس كاهن'؛ وإضافة الهاء تُوحي بالصيغة العبرية-الآرامية 'كوهين' (الكاهن الديني)
        فتُوقع التباساً ثانياً مع مصطلح ديني مغاير؛ فضلاً عن أن 'كاهن' معجمي عربي بمعنى
        العرَّاف/الكاهن، مما يُضاعف الإشكال الدلالي.


