stage1_review:
  assessment:
    concerns:
      - "الترجمة الحرفية من الإنجليزية 'ترتيب الكلمات' شائعة ومقبولة في اللسانيات الحديثة، لكنها تغفل وجود مصطلحات تراثية أدق وأكثر تجذراً مثل 'نظم' ومصطلحات نحوية مثل 'رتبة'."
    observations: "المفهوم يتعلق بالنسق الذي تتوالى فيه الألفاظ في سلسلة الكلام لتأدية المعنى. المصطلح الحديث الشائع هو 'ترتيب الكلمات' أو 'نسق الكلمات'، بينما الموروث البلاغي والنحوي يستعمل 'النظم' و'الرتبة'."
  blind_candidates:
    - lemma: "نَظْم"
      generation_method: ishtiqaq
      justification: "مصطلح بلاغي ونحوي أصيل يعبر عن تأليف الكلمات ووضعها في نسق متصل لتؤدي المعنى، كما في 'نظرية النظم'."
    - lemma: "رُتْبَة"
      generation_method: ishtiqaq
      justification: "مصطلح نحوي قديم وحديث يدل على موضع الكلمة واستحقاقها التقديم والتأخير في الجملة."
    - lemma: "نَسَقُ الكَلِمَاتِ"
      generation_method: tarkib
      justification: "مركب إضافي يعبر عن انتظام الألفاظ وتواليها في سلسلة الكلام."
    - lemma: "رَصْف"
      generation_method: majaz
      justification: "مصطلح مجازي من رصف الحجارة، استعير لضم الكلمات إلى بعضها في بناء متماسك."

stage2_evidence:
  per_lemma:
    - lemma: "ترتيب الكلمات"
      confirm:
        - text: "«ظهور الكلمات، في السلسلة الكلامية وفي تمثيلها الخطي المكتوب، الواحدة بعد الأخرى، بحيث تُظهِر نظاما معينا للجملة.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«تظهر الكلمات، في السلسلة الكلامية وفي تمثيلها الخطي المكتوب، الواحدة بعد الأخرى، بحيث تقدم نظاما معينا للجملة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
    - lemma: "نَظْم"
      confirm:
        - text: "«والثالث ترتيب الألفاظ متناسبة المعاني متناسقة الدلالات على وفق ما يقتضيه العقل أو الألفاظ المترتّبة بهذا الاعتبار. فالنظم بهذا شامل لرعاية ما يقتضيه علم المعاني والبيان»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«المنظوم يُقَال نظم من لُؤْلُؤ ... وَيُقَال نظم الْقُرْآن عِبَارَته الَّتِي تشْتَمل عَلَيْهَا الْمَصَاحِف صِيغَة ولغة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
    - lemma: "رُتْبَة"
      confirm:
        - text: "«الرُّتْبَةُ ... (فى النحو): ما تستحقه الكلمةُ من تقديم أو تأخير على غيرها فى جملتها وَفْقًا لقواعد اللغة؛ كالصَّدارة لأدوات الاستفهام مثلاً»"
          source: "المعجم الكبير"
    - lemma: "نَسَقُ الكَلِمَاتِ"
      confirm:
        - text: "«النَّسَق اللَّفْظِيّ: ترتيب الكلمات في عبارة أو جملة.»"
          source: "المورد الحديث (2008)"
    - lemma: "رَصْف"
      expands:
        - text: "«الرَّصْفُ: السَّدّ المَبْنِيُّ للماءِ مَجْرَى المصْنَعَةِ ... الرَّصاف, وهى الحجارةُ المتراصفة فى مسيل, يَجرى عليها الماءُ فيصفو»"
          source: "المعجم الكبير"

