# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-09869209-n  |  ILI: i88533
# المعنى: صانع الأحزمة (a maker of belts)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (صانع الأحزمة) عبارةٌ وصفية حرة تُعيد صياغة التعريف مباشرةً، مما يُوقع في الدوران المعجمي"
      - "التعريف الحالي (صانع للأحزمة) موجز خالٍ من الجنس القريب والفصل النوعي، ولا يفي بمعيار التعريف المصطلحي"
      - "غياب مصطلح مشتق مسكوك يُعبِّر عن هذه الحرفة رغم وجوده في المعجم العربي"
    observations: >
      المجموعة تمثّل حرفةً تقليدية (صناعة الأحزمة) ورد لها في العربية مصطلح مشتق
      على وزن فَعَّال (قياس الحرف والصناعات) من جذر حزم، وهو حَزَّام. اللمّة
      الموجودة (صانع الأحزمة) تعبير وصفي شائع لكنه ليس مصطلحاً مسكوكاً، إذ يمكن
      إبدال "الأحزمة" بأي منتوج جلدي آخر فيبقى الوصف مقبولاً. قياس فَعَّال
      للحِرَف ثابت في العربية: نَجَّار، حَدَّاد، خَرَّاز، دَبَّاغ، خَيَّاط.

  blind_candidates:
    - lemma: "حَزَّام"
      generation_method: ishtiqaq
      justification: >
        مشتق على وزن فَعَّال من جذر حزم، وهو القياس العربي الأثبت لأسماء أصحاب
        الحِرَف والصناعات. الحِزَام هو المنتوج، فصانعه حَزَّام، كما أن السَّرْج
        منتوج والسَّرَّاجُ صانعه، والخَرْز منتوج والخَرَّازُ صانعه.

    - lemma: "نَطَّاق"
      generation_method: ishtiqaq
      justification: >
        النِّطَاق في العربية ضرب من الأحزمة يُشدّ به الوسط، فمن يصنعه يُسمَّى
        على قياس فَعَّال: نَطَّاق. يُستحيا بهذا الوزن لاستيعاب الحرف الإبداعية
        لمن يصنع النطاق والمنطقة.

    - lemma: "مُحَزِّم"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من حَزَّمَ (باب التفعيل)، أي من يُحَزِّم الأشياء ويصنع لها
        الأحزمة. الوزن مُفَعِّل يدل على من يُكثر من الفعل أو يحترفه.

    - lemma: "خَرَّازُ الأَحْزِمَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من خَرَّاز (صانع الجلود ومن حرفته خياطة الجلد) + الأحزمة،
        للتخصيص ضمن الحرفة الجلدية. صناعة الأحزمة فرع من حرفة الخرازة،
        فهذا التركيب يُقيّد العام بالخاص.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "صانع الأحزمة"
      expands:
        - text: >
            «(1) الحزّام: صانع الأحزمة
            (2) اللِّحائيّة: حشرة تعيش على لحاء الشَّجرة مُحدثةً أخاديدَ حول ساقها وأغصانها.»
          source: "المورد الحديث (2008)، ترجمة: girdler"
          addition: >
            يتّضح من هذا النص أن "صانع الأحزمة" هو التعريف العربي للمصطلح
            المسكوك (الحزّام)، لا مصطلحاً بحد ذاته؛ مما يؤكد أن اللمّة الحالية
            وصف وليس مصطلحاً.

    - lemma: "حَزَّام"
      confirm:
        - text: >
            «(1) الحزّام: صانع الأحزمة»
          source: "المورد الحديث (2008)، المورد الجديد إنجليزي-عربي، ترجمة: girdler"
        - text: >
            «حَزَّام: من (ح ز م) الذي يشد الشيء بالحزام أو يجعله حزمة أو حزما،
            والضابط المتقن لرأيه وأمره.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >
            «(حَزَمَ) الْحَاءُ وَالزَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ شَدُّ
            الشَّيْءِ وَجَمْعُهُ، قِيَاسٌ مُطَّرِدٌ. فَالْحَزْمُ: جَوْدَةُ الرَّأْيِ...
            وَالْحِزَامُ لِلسَّرْجِ مِنْ هَذَا.»
          source: "مقاييس اللغة لابن فارس (جذر حزم)"

    - lemma: "نَطَّاق"
      contradicts:
        - text: >
            «النِّطَاق: حزام يشدّ به الوسط. وذات النِّطَاقَين: أسماء بنت أبي بكر.
            إزارٌ تلبسه المرأةُ تشدُّه على وسطِها للمِهنة.»
          source: "المعجم الوسيط (ocr)"
          conflict: >
            النِّطَاق في المعاجم هو الحزام ذاته (المنتوج)، لا اسمٌ لصانعه؛
            ولم يُثبَت وزن نَطَّاق بمعنى صانع النطاق في أي معجم مراجَع.
        - text: >
            «(نَطَقَ) النُّونُ وَالطَّاءُ وَالْقَافُ أَصْلَانِ صَحِيحَانِ:
            أَحَدُهُمَا كَلَامٌ أَوْ مَا أَشْبَهَهُ، وَالْآخَرُ جِنْسٌ مِنَ
            اللِّبَاسِ. الْأَوَّلُ الْمَنْطِقُ... وَالْآخَرُ النِّطَاقُ:
            إِزَارٌ فِيهِ تِكَّةٌ.»
          source: "مقاييس اللغة لابن فارس (جذر نطق)"
          conflict: >
            ابن فارس يحصر الجذر في معنيَيْن: النطق والإزار المشدود؛
            ولا ذكر لصانع النطاق على وزن فَعَّال.

    - lemma: "مُحَزِّم"
      contradicts:
        - text: >
            «محزم: مكون من حزيمات جمعت بعضها إلى بعض.»
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          conflict: >
            الشواهد المعجمية تُثبت مُحَزَّم/محزم بمعنى الصفة (مكوَّن من حزيمات)
            في السياق الطبي، لا بمعنى الحِرَفي صانع الأحزمة.
        - text: >
            «المِحْزَم: الحزام.»
          source: "المعجم الوسيط (ocr)"
          conflict: >
            المِحْزَم اسم للحزام ذاته (الأداة)، لا لصانعه.

    - lemma: "خَرَّازُ الأَحْزِمَة"
      contradicts:
        - text: >
            «الخَرَّازُ: صانع الخَرَز، مَنْ حرفته خياطة الجلد.»
          source: "المعجم الوسيط (ocr)"
          conflict: >
            الخَرَّاز حرفة خياطة الجلد عموماً (صانع الخُفّ والجلود)، وإضافة
            "الأحزمة" تجعله عبارة وصفية لا مصطلحاً مسكوكاً ثابتاً؛ فضلاً
            عن أن التركيب لم يُثبَت بهذه الصيغة في معجم.
        - text: >
            «خَرَّاز: من (خ ر ز) صانع الخرز، ومن حرفته خياطة الجلد.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            خَرَّاز مصطلح قائم بذاته يدل على حرفة أعمّ؛ وصانع الأحزمة فرع منها
            لا يُثبَّت بالتركيب مع "الأحزمة".


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "صانع الأحزمة"
      decision: removed
      decision_reason: >
        اللمّة عبارة وصفية حرة تُعيد صياغة التعريف بعينه (صانع للأحزمة)، وتخفق
        في اختبار السكّ المعجمي: يمكن إبدال "الأحزمة" بـ"السيور" أو "الجلود"
        ويبقى الوصف مقبولاً، مما يدل على أنها ليست وحدة معجمية ثابتة. كما يُثبت
        المورد الحديث أن هذه العبارة هي تعريفٌ للمصطلح المسكوك (الحزَّام) لا
        مصطلحٌ بذاتها.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حَزَّام"
      source: stage1
      decision: confirmed
      decision_reason: >
        مشتق أصيل على وزن فَعَّال من جذر حزم، وهو قياس الحِرَف والصناعات في
        العربية (نَجَّار، خَرَّاز، دَبَّاغ). ثابت في المورد الحديث (2008) بالمعنى
        الدقيق "صانع الأحزمة" مع مقابله الإنجليزي girdler. مصطلح موجز غير دائر،
        يجتاز جميع اختبارات جودة المصطلح: اطّراد صرفي، يُسر تداول، إيثار للتراثي،
        اشتقاقية واضحة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        حَزَّام صيغة حِرْفية مسكوكة تُحدِّد هوية الشخص بحرفته الثابتة (صانع
        الأحزمة)، بينما صانع الأحزمة وصف وظيفي مؤقت قابل للتوسيع. حَزَّام
        يوازي في الإيجاز والدقة: girdler (إنجليزية)، Gürtler (ألمانية)، ceinturier
        (فرنسية).
      actions:
        - command: create_entry
          params:
            lemma: "حَزَّام"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نَطَّاق"
      source: stage1
      decision: removed
      decision_reason: >
        وزن فَعَّال من نطق بمعنى صانع النطاق غير مُثبَّت في المعاجم المتاحة،
        فضلاً عن أن النِّطَاق في الاستعمال المعاصر باتت له دلالات أخرى غالبة
        (النطاق الجغرافي، النطاق الإلكتروني)، مما يُوقع في الاشتراك اللفظي
        ويُضعف الملاءمة الاصطلاحية.

    - lemma: "مُحَزِّم"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم تُثبت مُحَزَّم/مُحَزِّم في السياق الطبي بمعنى "مكوَّن من حزيمات"
        (وصف وليس اسم حرفة)، كما أن مِحْزَم جاء بمعنى الحزام ذاته لا صانعه.
        الوزن مُفَعِّل لا يأتي قياساً لأسماء الحرف في العربية.

    - lemma: "خَرَّازُ الأَحْزِمَة"
      source: stage1
      decision: removed
      decision_reason: >
        الخَرَّاز مصطلح مسكوك بذاته يعني صانع الجلود عموماً، وإضافة "الأحزمة"
        تنشئ عبارة وصفية لا تجتاز اختبار التثبيت المعجمي. لم يُوثَّق التركيب
        في أي معجم بهذه الصيغة، وهو أقل دقة من حَزَّام الذي يُخصص الحرفة
        مباشرة.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "صانع للأحزمة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي موجز جداً ويكاد يكون مطابقاً للمدخل الإنجليزي (a maker of
        belts)، خالٍ من الجنس القريب والفصل النوعي، ولا يُعطي القارئ معلومة
        إضافية. كما أن مادته (صانع + أحزمة) هي عين اللمّة المحذوفة، مما يجعله
        في حاجة إلى إعادة صياغة بمعيار المعجم الوسيط.
    authored:
      - type: terminological
        text: >
          حِرْفِيٌّ يَحْتَرِفُ صِنَاعَةَ الأَحْزِمَةِ الجِلْدِيَّةِ وَسَائِرِ
          أَنْوَاعِهَا وَبَيْعَهَا.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          صَانِعٌ مُتَخَصِّصٌ فِي إِعْدَادِ الأَحْزِمَةِ وَتَشْكِيلِهَا مِنَ
          الجِلْدِ أَوِ القُمَاشِ أَوْ غَيْرِهَا، وَكَانَتْ هَذِهِ الحِرْفَةُ
          مِنَ الحِرَفِ التَّقْلِيدِيَّةِ المُنْتَشِرَةِ فِي الأَسْوَاقِ
          الشَّعْبِيَّةِ.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حِرْفِيٌّ يَحْتَرِفُ صِنَاعَةَ الأَحْزِمَةِ الجِلْدِيَّةِ وَسَائِرِ أَنْوَاعِهَا وَبَيْعَهَا."
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "صَانِعٌ مُتَخَصِّصٌ فِي إِعْدَادِ الأَحْزِمَةِ وَتَشْكِيلِهَا مِنَ الجِلْدِ أَوِ القُمَاشِ أَوْ غَيْرِهَا، وَكَانَتْ هَذِهِ الحِرْفَةُ مِنَ الحِرَفِ التَّقْلِيدِيَّةِ المُنْتَشِرَةِ فِي الأَسْوَاقِ الشَّعْبِيَّةِ."

  examples:
    per_lemma:
      - lemma: "حَزَّام"
        examples:
          - text: "اشتُهِرَ جَدُّهُ بِأَنَّهُ كَانَ حَزَّاماً بَارِعاً يُقِيمُ دُكَّانَهُ فِي زُقَاقِ الجِلْدِيِّينَ بِالمَدِينَةِ القَدِيمَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اشتُهِرَ جَدُّهُ بِأَنَّهُ كَانَ حَزَّاماً بَارِعاً يُقِيمُ دُكَّانَهُ فِي زُقَاقِ الجِلْدِيِّينَ بِالمَدِينَةِ القَدِيمَةِ."


