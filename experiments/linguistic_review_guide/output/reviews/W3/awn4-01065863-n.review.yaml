      sense_id: "{auto}"
      nuance: "اللفظ الأعم والأكثر تداولاً للتعبير عن البقاء لتوقع حدوث أمر ما أو وصول شخص."
      mwe: false
    - lemma: "تَرَقُّب"
      sense_id: "{auto}"
      nuance: "فيه دلالة على شدة الانتظار ومراقبة الشيء المتوقع بتأهب وانتباه."
      mwe: false
    - lemma: "تَرَبُّص"
      sense_id: "{auto}"
      nuance: "انتظار مشوب بالترصد والمراقبة لانتهاز فرصة مناسبة أو وقوع حدث معين."
      mwe: false

  synset:
    cultural_fit: native

  actions:
