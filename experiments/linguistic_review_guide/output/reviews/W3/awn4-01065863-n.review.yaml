      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"نظر","maqayis":"«النُّونُ وَالظَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَرْجِعُ فُرُوعُهُ إِلَى مَعْنًى وَاحِدٍ وَهُوَ تَأَمُّلُ الشَّيْءِ وَمُعَايَنَتُهُ... وَيَقُولُونَ: نَظَرْتُهُ، أَيِ انْتَظَرْتُهُ. وَهُوَ ذَلِكَ الْقِيَاسُ، كَأَنَّهُ يَنْظُرُ إِلَى الْوَقْتِ الَّذِي يَأْتِي فِيهِ.»"}'
    - command: set_metadata
