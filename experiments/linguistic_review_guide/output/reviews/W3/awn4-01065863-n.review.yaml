stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يستخدم كلمة (الانتظار) لتعريف المفهوم نفسه، وهو ما يمثل دوراناً في التعريف."
      - "يحتوي التعريف على شرح مطوّل بين قوسين، والأفضل صياغة تعريف معجمي متماسك ومباشر."
    observations: "المفهوم يشير إلى فعل التوقف والتمكث لتوقع حدوث شيء أو وصول شخص. اللمات الموجودة (انتظار، ترقب) دقيقة وتمثل المفهوم بشكل ممتاز في اللغة العربية."
  blind_candidates:
    - lemma: "انْتِظَار"
      generation_method: ishtiqaq
      justification: "مصدر من الفعل (انتظر)، وهو اللفظ الأكثر شيوعاً ومباشرة للتعبير عن فعل التوقع والتمكث لحدث."
    - lemma: "تَرَقُّب"
      generation_method: ishtiqaq
      justification: "مصدر من الفعل (ترقب)، ويدل على الانتظار المشوب بالمراقبة والتوقع والتأهب."
    - lemma: "تَرَبُّص"
      generation_method: ishtiqaq
      justification: "مصدر من الفعل (تربص)، ويدل على التمكث والانتظار، غالباً لترصد فرصة أو حدث."
    - lemma: "تَلَبُّث"
      generation_method: ishtiqaq
      justification: "مصدر يدل على التمكث والتوقف والإبطاء في مكان ما."

stage2_evidence:
  per_lemma:
    - lemma: "انتظار"
      confirm:
        - text: "الانتظار: الثبات لتوقع ما يكون من الحال."
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "من (ن ظ ر) الترقب والتأني."
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "تَرَقُّب"
      confirm:
        - text: "فلانٌ فلانًا أو الشيءَ: انْتَظَرَه."
          source: "المعجم الكبير"
    - lemma: "تَرَبُّص"
      confirm:
        - text: "التربص: إمهال وتمكث يتحمل فيه الصبر... وقال الراغب: الانتظار."
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "فلانٌ: انتظر وتَرقَّب"
          source: "المعجم الكبير"
    - lemma: "تَلَبُّث"
      confirm:
        - text: "(تلبث) بِالْمَكَانِ توقف وَأقَام"
          source: "المعجم الوسيط لمجموعة من المؤلفين"

stage3_analysis:
  per_lemma:
    - lemma: "انتظار"
      decision: confirmed
      decision_reason: "الكلمة الأشهر والأكثر دقة للتعبير عن المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انْتِظَار"

    - lemma: "تَرَقُّب"
      decision: confirmed
      decision_reason: "مرادف دقيق يعبر عن الانتظار المقرون بالتوقع والمراقبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَرَقُّب"

    - lemma: "تَرَبُّص"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي فصيح يدل على الانتظار والترصد ومراقبة التطورات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَرَبُّص"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَلَبُّث"
      source: stage1
      decision: removed
      decision_reason: "التلبث أقرب في دلالته إلى مطلق التمكث والإبطاء، ولا يشترط فيه ترقب شيء محدد كما هو الحال في المفهوم المعني."

stage4_content:
  definition:
    current: "فعل الانتظار (البقاء دون نشاط في مكان واحد توقعاً لشيء ما)"
    assessment:
      decision: revise
      reason: "التعريف الحالي غير دقيق اصطلاحياً حيث يستخدم نفس اللفظ (الانتظار) في الشرح، ويحتوي على أقواس تعطي طابعاً تفسيرياً أجنبياً."
    authored:
      - type: linguistic
        text: "التَّمكُّث وتوقُّع حدوثِ أمرٍ ما، أو البقاءُ في حالةِ تأهُّبٍ إلى حينِ مَجيءِ وقتٍ مُعيَّنٍ أو شخصٍ أو حَدَث."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "التَّمكُّث وتوقُّع حدوثِ أمرٍ ما، أو البقاءُ في حالةِ تأهُّبٍ إلى حينِ مَجيءِ وقتٍ مُعيَّنٍ أو شخصٍ أو حَدَث."

  examples:
    per_lemma:
      - lemma: "انتظار"
        examples:
          - text: "جَلَسَ في قاعةِ الانْتِظارِ يَتَرقَّبُ وُصولَ القطارِ."
            type: usage
      - lemma: "تَرَقُّب"
        examples:
          - text: "يُتابعُ المُستثمرونَ الأخبارَ الاقتصاديَّةَ بِتَرَقُّبٍ شَديدٍ."
            type: usage
      - lemma: "تَرَبُّص"
        examples:
          - text: "{قُلْ هَلْ تَرَبَّصُونَ بِنَا إِلَّا إِحْدَى الْحُسْنَيَيْنِ}"
            type: quran
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "جَلَسَ في قاعةِ الانْتِظارِ يَتَرقَّبُ وُصولَ القطارِ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُتابعُ المُستثمرونَ الأخبارَ الاقتصاديَّةَ بِتَرَقُّبٍ شَديدٍ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "{قُلْ هَلْ تَرَبَّصُونَ بِنَا إِلَّا إِحْدَى الْحُسْنَيَيْنِ}"

stage5_enrichment:
  per_entry:
    - lemma: "انْتِظَار"
      entry_id: "{auto}"
      root: "نظر"
      maqayis_quote: "«النُّونُ وَالظَّاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَرْجِعُ فُرُوعُهُ إِلَى مَعْنًى وَاحِدٍ وَهُوَ تَأَمُّلُ الشَّيْءِ وَمُعَايَنَتُهُ... وَيَقُولُونَ: نَظَرْتُهُ، أَيِ انْتَظَرْتُهُ. وَهُوَ ذَلِكَ الْقِيَاسُ، كَأَنَّهُ يَنْظُرُ إِلَى الْوَقْتِ الَّذِي يَأْتِي فِيهِ.»"
    - lemma: "تَرَقُّب"
      entry_id: "{auto}"
      root: "رقب"
      maqayis_quote: "«الرَّاءُ وَالْقَافُ وَالْبَاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى انْتِصَابٍ لِمُرَاعَاةِ شَيْءٍ.»"
    - lemma: "تَرَبُّص"
      entry_id: "{auto}"
      root: "ربص"
      maqayis_quote: "«الرَّاءُ وَالْبَاءُ وَالصَّادُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْتِظَارِ. مِنْ ذَلِكَ التَّرَبُّصُ.»"

  per_sense:
