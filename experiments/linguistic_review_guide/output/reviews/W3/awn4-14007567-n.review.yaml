# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14007567-n
# blackout / brownout / dimout
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «انقطاع الكهرباء» تدلّ على انقطاع التيار الكهربائي (power outage) لا على التعتيم العسكري المقصود (blackout)؛ فالتعريف ينصّ على إطفاء الأنوار عمداً لإخفاء المدينة من طائرات العدو"
      - "المجموعة تحتوي على لمّتين فقط رغم أن المفهوم يشمل مصطلحات عسكرية وتقنية عديدة في العربية"
    observations: >
      المفهوم يتعلّق بالتعتيم العسكري: إطفاء الأنوار في مدينة أو منطقة حتى لا تُرصَد من الجو.
      هذا مفهوم عسكري محدد مختلف عن انقطاع التيار الكهربائي الذي هو عارض غير متعمَّد.
      التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي.
      الجنس القريب (hypernym) «ظلام/عتمة» ملائم.
  blind_candidates:
    - lemma: "تَعْتِيم"
      generation_method: ishtiqaq
      justification: "مصدر عَتَّمَ (فعّل) من جذر ع-ت-م على وزن تَفْعِيل، والعَتَمَة ظلمة أول الليل، فتَعْتِيم يعني إحداث العَتْمَة قصداً وهو المصطلح الدارج في السياق العسكري والإعلامي"
    - lemma: "إِعْتَام"
      generation_method: ishtiqaq
      justification: "مصدر أَعْتَمَ (أفعل) من جذر ع-ت-م، بمعنى الدخول في العَتَمَة أو التسبّب فيها"
    - lemma: "سَتْرُ الأَضْوَاء"
      generation_method: tarkib
      justification: "مركب إضافي من سَتْر (إخفاء) والأضواء، يصلح وصفاً لإجراء إخفاء الأنوار عسكرياً"
    - lemma: "تَخْفِيت"
      generation_method: ishtiqaq
      justification: "مصدر خَفَّتَ (فعّل) من جذر خ-ف-ت بمعنى خَفْض الصوت والنور، على وزن تَفْعِيل"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "انقطاع الكهرباء"
      contradicts:
        - text: "«انقطاع التغذية: حالةٌ يَنخفض فيها الجهدُ الكهرَبائيُّ إلى الصفر، ويَحدث فَقْدٌ كاملٌ للطاقة. تَتسبَّب عدةُ عواملَ في حدوث انقطاعِ التغذية، منها الكوارثُ الطبيعية؛ مثل العواصف والزلازل، ومنها أعطالٌ في معدّات الطاقةِ لشركة الكهرباء»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "المفهوم هنا انقطاع تيار كهربائي غير متعمَّد (power outage) وليس تعتيماً عسكرياً مقصوداً"
        - text: "«انقطاع التيار الكهربائي على نطاق واسع»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "التعريف يشير إلى انقطاع كهربائي عامّ لا إلى إطفاء أنوار عسكري مقصود"
        - text: "«التوقّف التام لعملية الإمداد بالتيار الكهربائي، وهو ما يحدث في محطة توليد الطاقة الكهربائية على وجه الخصوص»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "المفهوم تقني كهربائي بحت لا علاقة له بالتعتيم الدفاعي"

    - lemma: "تعتيم"
      confirm:
        - text: "«التعتيم: إطفاء الأنوار كليًّا على خشبة المسرح. إطفاء الأنوار في مدينة إلخ [خلال غارة جوية]. انطفاء الأنوار بسبب عُطل طارئ. كَبْت للرأي أو الخبر من طريق الرقابة على المطبوعات»"
          source: "المورد الحديث (2008)"
        - text: "«تعتيم، تعتيم الأنوار»"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«تعتيم» [مقابل blackout]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية — طباعة وكهرباء (1996)"
      expands:
        - text: "«تعتيم جزئيّ» [مقابل brownout]"
          source: "المورد الحديث (2008)"
          addition: "يوجد مصطلح مركب للتعتيم الجزئي يقابل brownout"
        - text: "«تعتيم راداريّ» [مقابل radar blackout]"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
          addition: "المصطلح يمتد إلى مجال الحرب الإلكترونية"
        - text: "«دخان تعتيم: دخان يستخدم قرب مواقع القوات المعادية للتقليل من مراقبتها للقوات الصديقة»"
          source: "المعجم الموحد لمصطلحات الحرب الإلكترونية (2004)"
          addition: "استخدام عسكري مباشر لمصطلح التعتيم"

    # ── المرشحات ──
    - lemma: "إِعْتَام"
      contradicts:
        - text: "«(اعتام) الرجل أَخذ العيمة وَالشَّيْء قَصده»"
          source: "المعجم الوسيط"
          conflict: "اعتام في الوسيط بمعنى أخذ العيمة (الاختيار) لا بمعنى الإظلام"

    - lemma: "سَتْرُ الأَضْوَاء"
      evidence_status: "no_material_found"

    - lemma: "تَخْفِيت"
      expands:
        - text: "«تَخْفِيت» [مصطلح طبي]"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المصطلح مستعمل في الطب (خفض شدة الصوت أو الإضاءة) لا في السياق العسكري"


# ── المرحلة ٣: التحليل اللغوي ──────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "انْقِطَاعُ الكَهْرَبَاء"
      decision: removed
      decision_reason: >
        «انقطاع الكهرباء» يدلّ في جميع المعاجم التقنية على التوقّف غير المتعمَّد للتيار الكهربائي (power outage/failure)،
        بينما تعريف المجموعة ينصّ صراحةً على إطفاء الأنوار عمداً لإخفاء المدينة من طائرات العدو (military blackout).
        الفرق جوهري: الأول عارض تقني والثاني إجراء دفاعي مقصود.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَعْتِيم"
      decision: confirmed
      decision_reason: >
        المصطلح مثبت في المورد الحديث بدلالة «إطفاء الأنوار في مدينة خلال غارة جوية» وهو المعنى المطابق تماماً لتعريف المجموعة.
        كما ورد في معاجم الحرب الإلكترونية والإعلام والكهرباء. مصدر على وزن تَفْعِيل من عَتَّمَ (أظلم).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الوحيد المؤكَّد في المجموعة؛ يدلّ على إحداث الظلمة قصداً وخاصّة في السياق العسكري والإعلامي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْتِيم"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِعْتَام"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الوسيط يُثبت أن «اعتام» بمعنى أَخَذَ العيمة (الاختيار والانتقاء) لا بمعنى الإظلام.
        أصل الجذر في مقاييس اللغة يدلّ على الإبطاء والكفّ عن الشيء لا على الظلمة بذاتها.
      evidence_assessment:
        case: contradicts_only

    - lemma: "سَتْرُ الأَضْوَاء"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي دليل معجمي يُثبت هذا التركيب كمصطلح ثابت.
        يمكن استبدال «ستر» بـ«إخفاء» أو «حجب» مع بقاء العبارة وصفية حرّة، مما يعني أنها لم تتجمّد معجمياً (فشلت في اختبار السكّ).
      evidence_assessment:
        case: no_material

    - lemma: "تَخْفِيت"
      source: stage1
      decision: removed
      decision_reason: >
        جذر خ-ف-ت في مقاييس اللغة يدلّ على «إسرار وكتمان» (خاصّة في النطق)، والمصطلح ورد فقط في المعجم الطبي.
        لا يُستعمل في السياق العسكري ولا يحمل دلالة إطفاء الأنوار.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "الظلام الناتج عن إطفاء الأنوار (كما في مدينة غير مرئية لطائرات العدو)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية للتعريف الإنجليزي، ويحتوي على عبارة «غير مرئية لطائرات العدو»
        وهي وصفية لا معجمية. يُحتاج إلى تعريف مصطلحي يوضح الجنس والفصل بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: "إِطْفاءُ الأَنْوارِ كُلِّيًّا في مَدينةٍ أو مِنْطَقَةٍ وِقايةً مِنَ الغاراتِ الجَوِّيَّة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "إِجْراءٌ دِفاعِيٌّ يُطْفَأُ فيه كُلُّ مَصادِرِ الإِنارةِ في مَنْطَقَةٍ مَأْهولةٍ لِمَنْعِ رَصْدِها مِنَ الجَوِّ أَثْناءَ الغاراتِ أَوِ الحُروب"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "إِطْفاءُ الأَنْوارِ كُلِّيًّا في مَدينةٍ أو مِنْطَقَةٍ وِقايةً مِنَ الغاراتِ الجَوِّيَّة"

  examples:
    per_lemma:
      - lemma: "تَعْتِيم"
        examples:
          - text: "فَرَضَتِ القِيادةُ العَسْكَرِيَّةُ تَعْتِيمًا شامِلًا على المَدينةِ بَعْدَ إِنْذارِ الغارَة"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "فَرَضَتِ القِيادةُ العَسْكَرِيَّةُ تَعْتِيمًا شامِلًا على المَدينةِ بَعْدَ إِنْذارِ الغارَة"


# ── المرحلة ٥: الإثراء ──────────────────────────────────
stage5_enrichment:
  per_entry:
    - lemma: "تَعْتِيم"
      entry_id: "{auto}"
      root: "عتم"
      maqayis_quote: "«الْعَيْنُ وَالتَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِبْطَاءٍ فِي الشَّيْءِ أَوْ كَفٍّ عَنْهُ... وَالْعَتَمَةُ هُوَ الثُّلُثُ الْأَوَّلُ مِنَ اللَّيْلِ بَعْدَ غَيْبُوبَةِ الشَّمْسِ وَالشَّفَقِ»"

  per_sense:
    - lemma: "تَعْتِيم"
      sense_id: "{auto}"
      nuance: "المصطلح الوحيد المؤكَّد؛ يدلّ على إحداث الظلمة عمداً في سياق عسكري أو إعلامي، من جذر العَتَمَة (ظلمة أول الليل)"

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"عتم","maqayis":"«الْعَيْنُ وَالتَّاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِبْطَاءٍ فِي الشَّيْءِ أَوْ كَفٍّ عَنْهُ... وَالْعَتَمَةُ هُوَ الثُّلُثُ الْأَوَّلُ مِنَ اللَّيْلِ بَعْدَ غَيْبُوبَةِ الشَّمْسِ وَالشَّفَقِ»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"المصطلح الوحيد المؤكَّد؛ يدلّ على إحداث الظلمة عمداً في سياق عسكري أو إعلامي"}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
