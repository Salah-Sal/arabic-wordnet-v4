# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10767483-n  |  ILI: i93899  |  POS: n
# Lemmas: متكلم من بطنه   |  EN: ventriloquist
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء ثم كاملة) ────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'متكلم من بطنه' مجرّدة من التشكيل الكامل"
      - "اللمّة عبارةٌ وصفية مطوّلة لا مصطلح أحادي أو ثنائي موجز"
      - "الفعل 'يسقط' في التعريف يوحي بالسقوط اللاإرادي لا بالإلقاء الموجَّه؛ والأدق 'يُلقي صوته'"
      - "غياب تعريف موسوعي يشرح آلية الفن (تجميد الشفتين وإصدار الصوت من الحلق)"
    observations: >
      المجموعة تمثّل مفهوماً أدائياً غربي المنشأ (فن التكلم البطني — ventriloquism)،
      تبنّته الثقافة العربية المعاصرة دون أن يُسكّ له مصطلح أحادي راسخ. اللمّة
      'متكلم من بطنه' عبارة وصفية تحليلية تعكس أصل المصطلح اللاتيني
      (venter = بطن + loqui = يتكلم)، وهي تُوثِّق الطريقة الفيزيولوجية لإخفاء
      مصدر الصوت. الفنان يُصدر صوته من الحلق مع إبقاء شفتيه شبه ساكنتين،
      فيبدو الصوت آتياً من الدمية. ينبغي إضافة التشكيل الكامل للمّة، ومراجعة
      التعريف لاستعمال 'يُلقي' أو 'يُصدر' بدلاً من 'يسقط'.

  blind_candidates:
    - lemma: "مُسقِطُ الصَّوتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من 'مُسقِط' (اسم فاعل من الفعل الرباعي أسقط بمعنى حوَّل
        الاتجاه) + 'الصَّوتِ' مضافاً إليه؛ يصف الفعلَ التقني الجوهري لهذا
        الفنان وهو تحويل مسار صوته نحو الدمية.
    - lemma: "حَاكٍ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر ح-ك-ي (حكى يحكي) على وزن فاعل (حاكٍ)؛ المادة تدل
        على المحاكاة والتمثيل الصوتي، وهو ما يُتقنه فنان التكلم البطني من
        محاكاة أصوات شخصيات مختلفة بالدمية.
    - lemma: "رَامِي الصَّوتِ"
      generation_method: majaz
      justification: >
        مجاز إضافي من 'رامٍ' (اسم فاعل من رمى بمعنى أطلق وقذف) + 'الصَّوتِ'؛
        يستحضر الصورة المجازية لإرسال الصوت باتجاه الدمية كما يُطلق الرامي
        سهمه، ويقابل المصطلح الإنجليزي الدارج 'voice throwing'.
    - lemma: "نَاطِقُ الدُّمى"
      generation_method: tarkib
      justification: >
        تركيب إضافي من 'نَاطِق' (اسم فاعل من نطق) + 'الدُّمى' (جمع دُمْية)؛
        يُبرز الوظيفة الجوهرية للفنان في جعل الدمى تبدو ناطقة متكلمة أمام
        الجمهور.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#  Q1: مطابقة دفعية للمّة الموجودة + المرشحات (entries.headword_norm)
#  Q2: جسر إنجليزي (entries_translations_fts — ventriloquist / ventriloquism)
#  Q3: FTS بكلمات مفتاحية: دمية، التكلم البطني، بطن
#  Q4: مقاييس اللغة لجذري كلم وبطن (dictionary_id = 151)
stage2_evidence:
  per_lemma:
    - lemma: "متكلم من بطنه"
      confirm:
        - text: "«المتكلِّم من بطنِهِ.»"
          source: "المورد الحديث (2008) — مقابل مباشر لـ ventriloquist"

    - lemma: "مُسقِطُ الصَّوتِ"
      evidence_status: "no_material_found"

    - lemma: "حَاكٍ"
      contradicts:
        - text: "«حاكٍ» — translation_en: phonograph"
          source: "مسرد الفن والتسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم (ARABTERM)"
          conflict: "في المعجمية الحديثة 'حاكٍ' مصطلح للغراموفون في مجال الفنون، لا صلة له بفنان التكلم البطني"
        - text: "«الحَاكُّ: الملحُّ في الطَّلَبِ صاحبُ الشَّرِّ (مجاز)»"
          source: "المعجم الكبير"
          conflict: "المادة ح-ك-ك (مضاعف) لا ح-ك-ي؛ ومعناها الإلحاح في الطلب والشر، لا المحاكاة الصوتية"

    - lemma: "رَامِي الصَّوتِ"
      evidence_status: "no_material_found"

    - lemma: "نَاطِقُ الدُّمى"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "متكلم من بطنه"
      decision: confirmed
      decision_reason: >
        موثَّق في المورد الحديث (2008) مقابلاً مباشراً للمصطلح الإنجليزي
        ventriloquist، ويُمثِّل الترجمةَ المعتمدة في المعجمية العربية الحديثة.
        اجتاز اختبار التثبيت المعجمي (مسجَّل كوحدة ثابتة). يحتاج إضافة التشكيل
        الكامل فقط.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تتميز عن الأُبُوِّي 'فنان استعراضي' بتخصيصها
        في فن إيهام المشاهد بأن الصوت صادر من الدمية، لا في الأداء الاستعراضي
        العام الدرامي أو الموسيقي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَكَلِّمٌ مِن بَطنِهِ"

    - lemma: "مُسقِطُ الصَّوتِ"
      source: stage1
      decision: removed
      decision_reason: >
        'مَسقَط' في المعاجم اسم مكان (موضع السقوط) أو مصطلح هندسي رياضي
        (projection)، ولا يُوظَّف اسمَ فاعل للإنسان في هذا الباب. 'إسقاط الصوت'
        ليس تعبيراً عربياً راسخاً لمفهوم إلقاء الصوت. غياب أي توثيق معجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "حَاكٍ"
      source: stage1
      decision: removed
      decision_reason: >
        في المعجمية الحديثة (ARABTERM) 'حاكٍ' مصطلح لجهاز الغراموفون، لا لفنان
        التكلم البطني. وفي المعاجم الكلاسيكية 'حَاكَ' يعني نسج النسيج أو التبختر
        في المشي. المادة الجذرية ح-ك-ي (محاكاة) صحيحة دلالياً لكن الاسم 'حاكٍ'
        مشغول بمعانٍ راسخة متعارضة، مما يُوقع في الاشتراك اللفظي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "رَامِي الصَّوتِ"
      source: stage1
      decision: removed
      decision_reason: >
        المجاز وجيه ويقابل المصطلح الإنجليزي الدارج 'voice throwing'، لكنه غير
        مسكوك في أي مرجع معجمي عربي معتمد، فلا يجوز إدراجه دون توثيق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "نَاطِقُ الدُّمى"
      source: stage1
      decision: removed
      decision_reason: >
        غير موثَّق في أي مرجع معجمي. فضلاً عن ذلك، 'ناطق الدمى' قد يوهم بمعنى
        الدمى الذكية أو الروبوتات الناطقة، ولا يُحدِّد الخصيصة الجوهرية التمييزية
        وهي إخفاء المتكلم الحقيقي خلف الوهم الصوتي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "فنان يسقط صوته ليبدو كأنه صادر من دمية"
    assessment:
      decision: revise
      reason: >
        الفعل 'يسقط' يوحي بالوقوع اللاإرادي لا بالإلقاء الموجَّه المتقَن؛
        والأدق لغةً وأشهر استعمالاً 'يُلقي صوته'. كما يُغفل التعريف عنصر
        الإيهام (إخفاء مصدر الصوت الحقيقي وهو جوهر الفن)، ولا يشير إلى
        تحريك الدمية.
    authored:
      - type: terminological
        text: "فَنَّانٌ يُجِيدُ إِلقَاءَ صَوتِهِ بِحَيثُ يُوهِمُ المُشَاهِدَ بِأَنَّهُ صَادِرٌ مِن دُمْيَةٍ يُحَرِّكُهَا"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          فَنَّانٌ أَدَائِيٌّ مُتَخَصِّصٌ فِي فَنِّ التَّكَلُّمِ البَطنِيِّ؛
          وَهُوَ إِصدارُ الأَصوَاتِ مِن الحَلقِ مَعَ إِبقَاءِ الشَّفَتَينِ
          شِبهَ سَاكِنَتَينِ، بِحَيثُ يَبدُو الصَّوتُ لِلمُشَاهِدِ صَادِرًا
          مِن دُمْيَةٍ أَو شَخصِيَّةٍ يُحَرِّكُهَا الفَنَّانُ أَمَامَهُ
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10767483-n"
          definition_index: 0
          text: "فَنَّانٌ يُجِيدُ إِلقَاءَ صَوتِهِ بِحَيثُ يُوهِمُ المُشَاهِدَ بِأَنَّهُ صَادِرٌ مِن دُمْيَةٍ يُحَرِّكُهَا"
      - command: add_definition
        params:
          synset_id: "awn4-10767483-n"
          text: "فَنَّانٌ أَدَائِيٌّ مُتَخَصِّصٌ فِي فَنِّ التَّكَلُّمِ البَطنِيِّ؛ وَهُوَ إِصدارُ الأَصوَاتِ مِن الحَلقِ مَعَ إِبقَاءِ الشَّفَتَينِ شِبهَ سَاكِنَتَينِ، بِحَيثُ يَبدُو الصَّوتُ لِلمُشَاهِدِ صَادِرًا مِن دُمْيَةٍ أَو شَخصِيَّةٍ يُحَرِّكُهَا الفَنَّانُ أَمَامَهُ"

  examples:
    per_lemma:
      - lemma: "مُتَكَلِّمٌ مِن بَطنِهِ"
        examples:
          - text: "بَرَعَ الفَنَّانُ المُتَكَلِّمُ مِن بَطنِهِ فِي إِقنَاعِ الجُمهُورِ بِأَنَّ دُمْيَتَهُ تَتَكَلَّمُ وَتَرُدُّ عَلَى أَسئِلَتِهِ"
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "بَرَعَ الفَنَّانُ المُتَكَلِّمُ مِن بَطنِهِ فِي إِقنَاعِ الجُمهُورِ بِأَنَّ دُمْيَتَهُ تَتَكَلَّمُ وَتَرُدُّ عَلَى أَسئِلَتِهِ"


