stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى الموجودة ────────────────────────────────
    - lemma: "أورفيل رايت"
      decision: confirmed
      decision_reason: >
        الاسم الكامل «أورفيل رايت» هو الصيغة العربية المستقرة لهذا الشخص التاريخي في
        المصادر الموسوعية والإعلامية العربية. يُعيَّن الشخص بدقة دون اشتراك لفظي.
        التعريب وفق قواعد المجمع (أإآ → أ في أول الكلمة) صحيح. غير أنه يحتاج إلى
        تشكيل كامل في المخرجات النهائية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة المؤكَّدة؛ تُمثّل الاسم الكامل (الاسم الشخصي + العائلي) وهو
        الصيغة الأكثر تعييناً وأقلّها قابلية للبس مقارنةً بـ«رايت» منفرداً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُورْفِيل رَايْت"

    # ── اللمّة الثانية الموجودة ────────────────────────────────
    - lemma: "رايت"
      decision: removed
      decision_reason: >
        اللمّة «رايت» منفردةً غير كافية لتعيين أورفيل رايت بالتحديد، إذ تشترك معه في
        هذا اللقب شخصيات أخرى أبرزها: (أ) شقيقه ويلبر رايت (الذي ورد ذكره في تعريف
        المجموعة ذاتها)، (ب) وليم رايت المستشرق الإنجليزي (1830-1889) الذي يمثّل
        المدخل الوحيد لـ«رايت» في قاعدة البيانات المعجمية. الإبقاء على هذه اللمّة
        يُفضي حتماً إلى اشتراك لفظي مضرّ بشبكة AWN4.

    # ── مرشّح ١ من المرحلة ١ ──────────────────────────────────
    - lemma: "أُورْفِيل رَايْت"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق عملياً للمّة الموجودة «أورفيل رايت» بعد إضافة التشكيل، وقد
        اتُّخذ إجراء update_lemma لتحديث التشكيل في اللمّة الأصيلة. لا حاجة إلى إنشاء
        مدخل جديد.

    # ── مرشّح ٢ من المرحلة ١ ──────────────────────────────────
    - lemma: "أُرْفِيل رَايْت"
      source: stage1
      decision: removed
      decision_reason: >
        هذا التعريب البديل أقل استقراراً وأقل شيوعاً من «أُورْفِيل رَايْت»، ولم يُعثَر
        على شواهد له في قاعدة البيانات. الصيغة الرئيسية كافية.

    # ── مرشّح ٣ من المرحلة ١ ──────────────────────────────────
    - lemma: "أُورْفِيل"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الأول منفرداً لا يُعيَّن الشخص بصورة كافية، ولا سند معجمي له، وقابل
        للبس مع أسماء أخرى. يُكتفى بالاسم الكامل.

    # ── مرشّح ٤ من المرحلة ١ ──────────────────────────────────
    - lemma: "رَايْت الطَّيَّار"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير مصنوع لا يرد كاصطلاح مثبّت. «الطيّار» تصف ويلبر أيضاً، فلا تُحقق
        التمييز المطلوب. اجتاز اختبار السكّ فشلاً: «رايت المحلِّق» تؤدي الغرض ذاته،
        إذاً ليس مصطلحاً مسكوكاً.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-11418606-n"
        pos: proper_noun


