stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────
    - lemma: "أورفيل رايت"
      evidence_status: "no_material_found"
      # لا يوجد مدخل خاص بأورفيل رايت في قاعدة البيانات المستعلَمة.
      # الاستعلام الدفعي بـ headword_norm ولا صورة ال- لم يُسفر عن نتيجة.

    - lemma: "رايت"
      contradicts:
        - text: >
            «وليم رايت Wright.W (١٨٣٠-١٨٨٩): مستشرق إنجليزي، ولد في البنغال،
            ودرس اللغات الشرقية في أسكتلندا وفي ليدن على «دوزي»، وعُيِّن أستاذاً للغة العربية
            في جامعتَي لندن ودبلن، وعمل في مكتبة المتحف البريطاني، ثم أستاذاً في كمبردج.»
          source: "المعجم الكبير (مجمع اللغة العربية — القاهرة)"
          conflict: >
            المدخل الوحيد لـ«رايت» في قاعدة البيانات يحيل إلى وليم رايت المستشرق (ت. 1889)،
            لا إلى أورفيل رايت المخترع (ت. 1948). وجود اللمّة منفرداً يُوقع في الاشتراك اللفظي.

    # ── مرشّحات المرحلة ١ ─────────────────────────────────────
    - lemma: "أُورْفِيل رَايْت"
      evidence_status: "no_material_found"
      # لا يوجد مدخل مطابق لهذا التعريب الكامل في قاعدة البيانات.

    - lemma: "أُرْفِيل رَايْت"
      evidence_status: "no_material_found"

    - lemma: "أُورْفِيل"
      evidence_status: "no_material_found"

    - lemma: "رَايْت الطَّيَّار"
      evidence_status: "no_material_found"

