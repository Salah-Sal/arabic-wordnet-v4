# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11418606-n  |  ILI: i97489
# المراجع: مراجع لغوي عربي
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «رايت» مجرّد لقب عائلي مشترك بين أكثر من شخص؛ لا تُعيَّن أورفيل بمفردها، وقد وُجد في قاعدة البيانات مدخل «رايت» يحيل إلى المستشرق وليم رايت (1830-1889)، مما يُفضي إلى الاشتراك اللفظي."
      - "المجموعة تحتاج إلى تمييز أورفيل عن شقيقه ويلبر رايت؛ فكلاهما يشتركان في الاسم «رايت»."
      - "الاسم الأجنبي «Orville» ليس له جذر عربي، فجميع المرشحات ستنتمي حتماً إلى المنهج التعريبي، وهو ما يُضيّق خيارات التوليد المعجمي الخلّاق."
      - "POS مُسجَّل كـ n وليس proper_noun، وهو عدم دقة طفيف لاسم علم بعينه."
    observations: >
      هذه المجموعة تمثّل اسم علم لشخص تاريخي بعينه (أورفيل رايت، رائد الطيران الأمريكي 1871-1948).
      المفهوم غريب عن الموروث المعجمي العربي ولا يقبل الاشتقاق ولا المجاز ولا التركيب التخييلي.
      كل مسالك التوليد المعجمي المعتادة تنتهي بالتعريب (taarib)، لأن الاسم لا أصل عربياً له.
      التحدي الأساسي ليس في صياغة اللمّة بل في اختيار الصيغة التعريبية الأكثر استقراراً وأدناها إلى
      الاستعمال العربي الموثّق.

  blind_candidates:
    - lemma: "أُورْفِيل رَايْت"
      generation_method: taarib
      justification: >
        التعريب الكامل للاسم الأجنبي «Orville Wright»، مع الإبقاء على الاسمين معاً لأن
        التعريف يذكر «ويلبر رايت» شقيقاً، فلا بد من توافر الاسم الأول تمييزاً.
        هذا هو الشكل الأشيع في المصادر العربية الموسوعية والصحفية.
    - lemma: "أُرْفِيل رَايْت"
      generation_method: taarib
      justification: >
        تعريب بديل للاسم «Orville» بصيغة ثلاثية الأحرف الصوتية (أُرْفِيل) تبعاً
        لقاعدة أن الواو الساكنة وسط المقطع تُحذف أحياناً في التعريب.
        أقل شيوعاً من «أُورْفِيل» لكن وردت في بعض المصادر.
    - lemma: "أُورْفِيل"
      generation_method: taarib
      justification: >
        الاسم الأول منفرداً. أقل وضوحاً من المركّب، لكنه مقبول في السياق التوثيقي المتخصص
        حين يكون السياق يكشف هوية الشخص. يُستخدم في الإحالات المتكررة بعد ذكر الاسم كاملاً.
    - lemma: "رَايْت الطَّيَّار"
      generation_method: tarkib
      justification: >
        مركّب وصفي (wasfi) يُضيف «الطيّار» فاصلاً دلالياً يميّز أورفيل عن غيره من حاملي
        اسم «رايت». غير أن هذا التعبير مصنوع ولا يرد كاصطلاح مثبّت في المصادر العربية،
        ويعاني من ضعف التمييز إذ يصف أيضاً شقيقه ويلبر.


