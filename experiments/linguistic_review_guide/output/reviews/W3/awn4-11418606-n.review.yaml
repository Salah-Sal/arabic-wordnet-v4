stage4_content:
  definition:
    current: "رائد طيران أمريكي اخترع الطائرة (مع شقيقه ويلبر رايت) (1871-1948)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي. يفتقر إلى الأسلوب الموسوعي العربي:
        (أ) لا يُحدّد عام الاختراع الشهير (1903م). (ب) التركيب «اخترع الطائرة» مبسَّط
        مقارنةً بالحدث التاريخي (أول رحلة بمحرك ناجحة). (ج) أسلوب المعجم الوسيط يقتضي
        ترتيباً مختلفاً: الاسم + التعريف الموسوعي + التواريخ.
    authored:
      - type: encyclopedic
        text: >
          مخترعٌ أمريكي ورائدٌ في علم الطيران؛ اشترك مع أخيه الأكبر ويلبر رايت في
          تصميم أول طائرة ذات محرك نجحت في الإقلاع عام (1903م) في كيتي هوك بولاية
          كارولاينا الشمالية. وُلد عام (1871م) وتوفي عام (1948م).
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11418606-n"
          definition_index: 0
          text: >
            مخترعٌ أمريكي ورائدٌ في علم الطيران؛ اشترك مع أخيه الأكبر ويلبر رايت في
            تصميم أول طائرة ذات محرك نجحت في الإقلاع عام (1903م) في كيتي هوك بولاية
            كارولاينا الشمالية. وُلد عام (1871م) وتوفي عام (1948م).

