stage5_enrichment:
  per_entry:
    - lemma: "سُرْيَالِيٌّ"
      entry_id: "{auto}"
      root: "سريل"
      # ملاحظة: «سريل» جذر اصطناعي من التعريب الحديث لـsurréalisme،
      # لا وجود له في مقاييس اللغة لابن فارس (المعجم كلاسيكي ما قبل التعريبات الحديثة).

  per_sense:
    - lemma: "سُرْيَالِيٌّ"
      sense_id: "{auto}"
      nuance: "يؤدي دوراً مزدوجاً في العربية: اسماً للدلالة على الشخص المنتسب للحركة السريالية (المراد في هذه المجموعة)، وصفةً لما يتسم بطابع السريالية في الفن والأدب. السياق النحوي والتعريف يُحدّدان الوظيفة."

  synset:
    cultural_fit: lexical_gap
