# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الثانية «فنان سريالي» تعبير حر مركّب (اسم + صفة نسبية) وليست وحدة معجمية مسكوكة؛ يجوز إبدال «فنان» بـ«مبدع» أو «رسام» أو «شاعر» مع بقاء التعبير وصفياً صحيحاً، مما يعني فشل اختبار السكّ ويُثبت أنه عبارة حرة لا مصطلح ثابت."
      - "التعريف الحالي ضعيف البنية: «تسمى» تُقدّم اسم الحركة دون أن تُعرّفها، مما يجعل التعريف دائرياً في حدوده ولا يُضيف معلومة تمييزية."
      - "كلتا اللمّتين مكتوبتان بلا تشكيل في السجل."
    observations: "المجموعة الترادفية تُعبّر عن مفهوم الفنان السريالي بوصفه منتسباً لحركة فنية غربية المنشأ. الاسم العربي «سريالي» نسبة إلى «السريالية» المُعرَّبة من الفرنسية (surréaliste). ثمة تداخل بين الاستخدام الاسمي (السريالي = الفنان المنتسب) والاستخدام الوصفي (عمل سريالي = صفة)؛ والمراد في هذه المجموعة الاستخدام الاسمي. المعاجم المعاصرة تُثبت «سريالي» نسبةً واسماً، غير أن «فنان سريالي» تعبير وصفي تركيبي لا مصطلح مسكوك."

  blind_candidates:
    - lemma: "سُرْيَالِيٌّ"
      generation_method: taarib
      justification: "نسبة إلى «السريالية» المُعرَّبة من الفرنسية surréalisme؛ الياء النسبية الصيغة القياسية لتسمية أتباع الحركات والمذاهب الفكرية والفنية في العربية المعاصرة (رومانسي، كلاسيكي، واقعي...)."
    - lemma: "فَوْقَوَاقِعِيٌّ"
      generation_method: tarkib
      justification: "تركيب مزجي يُترجم حرفياً «sur-réaliste» (فوق + واقعي)، يُبرز البُعد الدلالي المتضمَّن في أصل المصطلح الفرنسي الذي يعني «ما فوق الواقع»؛ ويُعدّ بديلاً توضيحياً للمصطلح المُعرَّب."
    - lemma: "حُلْمانِيٌّ"
      generation_method: ishtiqaq
      justification: "اشتقاق من «حُلُم» على وزن «فُعْلاني» للنسبة الموصوفة؛ إذ تنهل السريالية من عالَم الأحلام والرغبات اللاشعورية، فيكون «الحلماني» من يستلهم فنَّه من الأحلام والمخيّلة اللاواعية."
    - lemma: "لاوَاقِعِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي سالب: «لا» النافية + «واقعي»، يُعبّر عن جوهر الحركة السريالية التي تتجاوز قيود الواقع المادي المرئي إلى عالَم الخيال واللاوعي."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة:
#   ١. مطابقة دفعية: اللمّات الموجودة + المرشحات (headword_norm IN)
#   ٢. جسر إنجليزي: translation_en:"surrealist" OR "surrealism" OR "surrealistic"
#   ٣. بحث FTS عربي: "سريالي" OR "سريالية" OR "فوق الواقع" OR "فوق واقعي"
#   ٤. مقاييس اللغة: جذور سريل، فنن، حلم (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "سريالي"
      confirm:
        - text: "«سُرياليّ [مفرد]: اسم منسوب إلى سُرياليّة: خيالي مُبرز للأحوال اللاشعورية "مشهد سريالي يدعو للدهشة- شعر/ فن/ رسم/ سريالي"»"
          source: "معجم اللغة العربية المعاصرة (أحمد مختار عمر)"
      expands:
        - text: "«(1) فَوْواقعيّ؛ فوق الواقع (2) سُرْياليّ»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت المورد الحديث أن «سرياليّ» مرادف لـ«فوق الواقع» و«فووَاقعي» في سياق ترجمة المصطلح الإنجليزي surreal، مما يُؤكد رسوخ اللفظ في المعجمية العربية المعاصرة."
        - text: "«سُرياليَّة [مفرد]: (دب، فن) اتجاه معاصر في الفن والأدب يذهب إلى ما فوق الواقع، ويعوّل خاصة على إبراز الأحوال اللاشعورية»"
          source: "معجم اللغة العربية المعاصرة (أحمد مختار عمر)"
          addition: "يُضاف لتحديد المرجعية الدلالية للنسبة؛ فـ«سريالي» نسبة إلى «سريالية» المُعرَّفة بهذه الصفات."

    - lemma: "فنان سريالي"
      evidence_status: "no_material_found"

    - lemma: "سُرْيَالِيٌّ"
      confirm:
        - text: "«سُرياليّ [مفرد]: اسم منسوب إلى سُرياليّة: خيالي مُبرز للأحوال اللاشعورية»"
          source: "معجم اللغة العربية المعاصرة (أحمد مختار عمر)"

    - lemma: "فَوْقَوَاقِعِيٌّ"
      expands:
        - text: "«(1) فَوْواقعيّ؛ فوق الواقع (2) سُرْياليّ»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت المورد الحديث صيغة «فوواقعي» (مزجية، بواو مدية لا قاف) وليس «فوقواقعي»، وهي في سياق ترجمة «surreal» الوصفية لا «surrealist» الشخصية. الشاهد يدعم وجود المفهوم لكن في صيغة مختلفة وسياق مغاير."

    - lemma: "حُلْمانِيٌّ"
      contradicts:
        - text: "«حُلْمَانِيّ: من (ح ل م) نسبة إلى حُلْمَان: مثنى حُلْم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "«حلماني» في المعجم نسبة إلى اسم عَلَم (حُلمان) لا صلة له بالسريالية أو الفنون؛ الاستخدام المقترح يصطدم بهذا المعنى الراسخ."
        - text: "«حِلْمَاني: من (ح ل م) نسبة إلى حِلمان: الكثير التأني والكثير الرؤى أثناء النوم»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الصيغة الأخرى «حِلماني» كذلك نسبة إلى علم، وإن حملت وصف «الكثير الرؤى أثناء النوم» فهي مختصّة بالأعلام لا بالمصطلحات الفنية."

    - lemma: "لاوَاقِعِيٌّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "سريالي"
      decision: confirmed
      decision_reason: "اللمّة موثّقة في معجم اللغة العربية المعاصرة والمورد الحديث. النسبة إلى «السريالية» المعرَّبة قياسية صرفياً وجارية على أوزان النسبة في المعاجم المعاصرة. تستخدم اسماً في الخطاب الفني العربي للدلالة على المنتسب للحركة. تحتاج إلى تشكيل كامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللمّة الوحيدة المؤكدة في المجموعة بعد حذف «فنان سريالي». يؤدي دوراً مزدوجاً في العربية: اسماً للدلالة على الفنان المنتسب للحركة (المراد هنا)، وصفةً لما يتسم بطابع السريالية. التمييز السياقي يحدّد الوظيفة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُرْيَالِيٌّ"

    - lemma: "فنان سريالي"
      decision: removed
      decision_reason: "فشل اختبار السكّ والتثبيت المعجمي: يمكن إبدال «فنان» بـ«مبدع» أو «رسام» أو «شاعر» مع بقاء الوصف صحيحاً دلالياً، مما يُثبت أنه تعبير وصفي حر لا وحدة معجمية مسكوكة. لا يوجد في أي معجم كمدخل مستقل (no_material_found). «سُرياليٌّ» وحده يُغطي معنى الشخص المنتسب للحركة بوصفه صيغة اسمية قائمة بذاتها."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سُرْيَالِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "المرشح مطابق تماماً للمّة الموجودة «سريالي» — ذات اللفظ مع التشكيل الكامل. تمّ تأكيد اللمّة الأصلية وإضافة التشكيل عبر update_lemma؛ فلا حاجة لإدخال جديد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "فَوْقَوَاقِعِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "الأدلة تُثبت صيغة «فوواقعي» (مزجية) في المورد الحديث لا «فوقواقعي»، وهي في سياق ترجمة «surreal» الوصفية لا «surrealist» الشخصية. كذلك فإن «سُرياليٌّ» راسخ في المعاجم المعاصرة ويُغني عن البديل المزجي الأقل شيوعاً. اختبار الاشتقاقية: «سريالي» يقبل الجموع والإسناد بيُسر أكثر من «فوقواقعي»."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "حُلْمانِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "تعارض كامل مع الأدلة المعجمية: «حلماني» نسبة إلى اسم عَلَم «حُلمان» لا صلة له بالسريالية. الاستخدام المقترح يُوقع في الاشتراك اللفظي مع معنى مرسوخ في المعجمية العربية. تنبّه: الاشتقاق «على وزن فُعلاني» من حُلم بمعنى الرؤية كان الفكرة، لكن المعجم يُثبت أن الصيغة محجوزة لاسم العَلَم."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "لاوَاقِعِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي. المصطلح غير مسكوك وغير دقيق: نفي الواقعية وصف عام يشمل تيارات فنية عديدة (التجريدية، الدادائية، التعبيرية...) لا السريالية وحدها، مما يُفقده الفصل التمييزي اللازم للمصطلح."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
