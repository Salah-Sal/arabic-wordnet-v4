        key: note
        value: '{"nuance":"يؤدي دوراً مزدوجاً: اسماً للمنتسب للحركة السريالية (المراد هنا) وصفةً لما يتسم بطابعها؛ السياق النحوي يُحدد الوظيفة","mwe":false}'
