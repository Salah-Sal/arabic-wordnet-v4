stage1_review:
  assessment:
    concerns:
      - "لمّة «بروز» معناها الأصلي الظهور الحسّي والنتوء المادي، واستعمالها بمعنى الشهرة والمكانة الاجتماعية يبدو ترجمةً حرفية من الإنجليزية prominence"
      - "اللمّتان بدون تشكيل كامل"
      - "المجموعة تفتقر إلى لمّات تراثية راسخة كالصِّيت"
    observations: "المفهوم — حالة كون المرء معروفاً على نطاق واسع أو مرموقاً — مفهوم عربي أصيل عبّرت عنه العربية بألفاظ عديدة: الشُّهْرَة والصِّيت والنَّبَاهَة والذُّيُوع. اللمّة «شهرة» ممتازة وراسخة معجمياً. أمّا «بروز» فأصلها الظهور الحسّي وقد توسّعت دلالتها حديثاً لتشمل التفوّق والبروز المعنوي."
  blind_candidates:
    - lemma: "صِيت"
      generation_method: majaz
      justification: "مجاز مرسل من الصوت إلى انتشار الذكر بين الناس، لفظ تراثي راسخ يدلّ على الذكر الحسن المنتشر"
    - lemma: "نَبَاهَة"
      generation_method: ishtiqaq
      justification: "من الجذر ن ب ه على وزن فَعَالَة، أصل يدلّ على الارتفاع والسمو عند ابن فارس، ومنه النبيه أي الشريف"
    - lemma: "ذُيُوع"
      generation_method: ishtiqaq
      justification: "من الجذر ذ ي ع على وزن فُعُول، مصدر ذاعَ يذيعُ بمعنى انتشر وشاع، يُستخدم في تركيب ذيوع الصيت"
    - lemma: "صَدَارَة"
      generation_method: ishtiqaq
      justification: "من الجذر ص د ر على وزن فَعَالَة، بمعنى التقدّم والأوّلية في القوم، مُدوَّنة في المعجم الوسيط"

stage2_evidence:
  per_lemma:
    - lemma: "بُرُوز"
      confirm:
        - text: "«البروز: الخروج من كل شيء يواري ... وإما أن يظهر بفضله وهو أن يسبق في فعل محمود»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«عنصر أو صفة تضفي أهميَّة على خبر وتعطيه أولويَّة في النشر»"
          source: "مسرد الإعلام والتواصل (ARABTERM) — prominence"
        - text: "«(2) «أ» بروز. «ب» شُهرة؛ شأن؛ أهميّة»"
          source: "المورد الحديث (2008) — prominence"
      expands:
        - text: "«الْبَاءُ وَالرَّاءُ وَالزَّاءُ أَصْلٌ وَاحِدٌ، وَهُوَ ظُهُورُ الشَّيْءِ وَبُدُوُّهُ ... وَكَذَلِكَ انْفِرَادُ الشَّيْءِ مِنْ أَمْثَالِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي ظهور حسّي، مع امتداد إلى التفوّق والتفرّد"
    - lemma: "شُهْرَة"
      confirm:
        - text: "«ظهور الشيء وانتشاره»"
          source: "المعجم الوسيط (OCR)"
        - text: "«اسْمٌ من الإِشْهار, وهو وضوحُ الأمر. ظُهورُ الشَّيءِ وانتشارُه. ذُيوعُ الصِّيتِ»"
          source: "المعجم الكبير (OCR)"
        - text: "«والشَّهيرُ والمَشْهورُ: المَعْرُوفُ المكانِ، المذكورُ، والنَّبيهُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الشِّينُ وَالْهَاءُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى وُضُوحٍ فِي الْأَمْرِ وَإِضَاءَةٍ ... وَالشُّهْرَةُ: وُضُوحُ الْأَمْرِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«جاء في التاج: الشُّهْرَة: ظهور الشيء في شُنْعة ... وقد ذكر الجوهري أن الشُّهْرَة: وضوح الأمر دون أن يقيِّده بالشُّنْعة»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الشهرة في الأصل ارتبطت بالشنعة ثم توسّعت دلالتها لتشمل مطلق الوضوح والانتشار"
    - lemma: "صِيت"
      confirm:
        - text: "«الذِّكْرُ الحسن»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الذِّكْرُ يكونُ فى الخير أو الشَّرِّ. الذِّكْرُ الحسنُ الجميلُ ينتشرُ بيـن الناس»"
          source: "المعجم الكبير (OCR)"
        - text: "«الصيت: بالكسر، انتشار الذكر وقيل الذكر الجميل»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«مَا مِن عبدٍ إلاَّ وَلَهُ صِيتٌ فِي السَّمَاءِ أَيْ ذِكْر وشُهرةٌ وعِرْفان»"
          source: "النهاية في غريب الحديث لابن الأثير"
        - text: "«وَالصِّيتُ: الذِّكْرُ الْحَسَنُ فِي النَّاسِ. يُقَالُ: ذَهَبَ صِيتُهُ»"
          source: "مقاييس اللغة لابن فارس (مادة صوت)"
    - lemma: "نَبَاهَة"
      confirm:
        - text: "«الشَّرَف. الشُّهْرَة. الفِطنة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«النُّونُ وَالْبَاءُ وَالْهَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ وَسُمُوٍّ ... رَجُلٌ نَبِيهٌ، أَيْ شَرِيفٌ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«النباهة: الشَّرَف. الشُّهْرَة. الفِطنة»"
          source: "المعجم الوسيط (OCR)"
          conflict: "اللفظ مشترك بين ثلاث دلالات: الشرف والشهرة والفطنة، واستعماله المعاصر الغالب بمعنى الفطنة والذكاء مما يُحدث لَبساً"
    - lemma: "ذُيُوع"
      evidence_status: "no_material_found"
    - lemma: "صَدَارَة"
      contradicts:
        - text: "«التَّقَدُّمُ. يقالُ: فلانٌ لهُ الصُّدارةُ فى القوم»"
          source: "المعجم الكبير (OCR)"
          conflict: "الصدارة تدلّ على التقدّم في المرتبة لا على الشهرة والذيوع بين الناس"

