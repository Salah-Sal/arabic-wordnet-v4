          - text: >
              يُعدُّ جيم ثورب أسطورةً رياضيةً خالدة؛ فاز بذهبيتين في أولمبياد 1912
              قبل أن تُسلَب منه الميداليتان بسبب الخلاف حول احترافيته السابقة.
            type: usage

      - lemma: "ثُورْبُ"
