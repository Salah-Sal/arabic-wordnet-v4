# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (ثورب، جيم ثورب) تفتقران إلى التشكيل الكامل"
      - "الصنف مُصنَّف بـ n (اسم) في حين أنه اسم علم لشخص بعينه؛ الأنسب proper_noun وفق نظام قاعدة البيانات"
      - "المرادف الإنجليزي الثالث 'James Francis Thorpe' لا يقابله أي لمّة عربية في الصنف"
      - "تاريخ الميلاد المذكور (1887) يخالف المعلومة التاريخية المعتمدة (1888م)"
      - "التعريف العربي الحالي شديد الإيجاز لمدخل موسوعي — يفتقر إلى ذكر الإنجازات الرياضية"
    observations: >
      هذا الصنف يُجسِّد اسم علم لرياضيٍّ أمريكيٍّ أصلانيٍّ بعينه هو جيم ثورب (1888-1953).
      لا مجال هنا للاشتقاق أو المجاز؛ إذ إن لمّات أسماء الأعلام الأجنبية لا تُولَّد إلا
      بالتعريب الصوتي (النقل الحرفي). الوضع المعجمي لمثل هذه الأصناف هو أن تُدرج
      جميع أشكال الاسم المتداولة (اسم العائلة منفرداً، والاسم الكنوي مع اسم العائلة،
      والاسم الرسمي الكامل). التعريف الحالي وجيز للغاية ومكتفٍ بالفئة العامة (رياضي
      أمريكي)، ويستلزم إثراءً موسوعياً يُبرز التخصص والإنجاز الذي اشتُهر به.

  blind_candidates:
    - lemma: "ثُورْبُ"
      generation_method: taarib
      justification: >
        تعريب اسم العائلة Thorpe صوتياً وفق الأنظمة الصوتية العربية المعيارية:
        Th → ث، or → وْر، p → ب؛ صيغة مختصرة تُستخدم للإحالة الاختزالية.
    - lemma: "جِيمْ ثُورْبُ"
      generation_method: taarib
      justification: >
        تعريب مركب للاسم الكنوي الأول والأخير: Jim → جِيم، Thorpe → ثُورْب.
        هذا الشكل هو الأكثر تداولاً في الصحافة الرياضية العربية.
    - lemma: "جَيمْس فرانسيس ثُورْبُ"
      generation_method: taarib
      justification: >
        تعريب الاسم الرسمي الكامل: James → جَيمْس، Francis → فرانسيس،
        Thorpe → ثُورْب. يُستخدم في المراجع الأكاديمية والتوثيقية الرسمية.
    - lemma: "جَيمْس ثُورْبُ"
      generation_method: taarib
      justification: >
        تعريب الشكل الوسيط: James Thorpe — صيغة تجمع الاسم الرسمي الأول
        والأخير دون الاسم الأوسط، أقل شيوعاً من 'جيم ثورب' في التداول العربي.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  query_log:
    - query_id: Q1
      type: batch_headword
      description: "بحث دفعي عن جميع اللمّات الموجودة والمرشحات في headword_norm"
      terms_searched:
        - ثورب
        - الثورب
        - جيم ثورب
        - الجيم ثورب
        - جيمس فرانسيس ثورب
        - جيمس ثورب
      result_count: 0

    - query_id: Q2
      type: english_bridge
      description: "جسر إنجليزي عبر ARABTERM لجميع المرادفات الإنجليزية"
      terms_searched:
        - Thorpe
        - Jim Thorpe
        - James Francis Thorpe
      result_count: 0

    - query_id: Q3
      type: arabic_fts
      description: "بحث FTS بكلمات مفتاحية من التعريف"
      terms_searched:
        - ثورب
        - جيم
      result_count: 0  # نتائج كلمة جيم تعود إلى حرف الهجاء، لا صلة لها بالموضوع

  per_lemma:
    - lemma: "ثُورْبُ"
      evidence_status: "no_material_found"

    - lemma: "جِيمْ ثُورْبُ"
      evidence_status: "no_material_found"

    - lemma: "جَيمْس فرانسيس ثُورْبُ"
      evidence_status: "no_material_found"

    - lemma: "جَيمْس ثُورْبُ"
      evidence_status: "no_material_found"

  note: >
    غياب الأدلة المعجمية متوقَّع تماماً في حالة أسماء الأعلام الأجنبية؛ فالمعاجم العربية
    الكلاسيكية والمعجمية الحديثة لا تُدرج أسماء أعلام أفراد أجانب بوصفها مداخل معجمية
    مستقلة. يُستند في هذه الحالة إلى معياري التعريب الصوتي والشيوع في الاستخدام.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "ثورب"
      decision: confirmed
      decision_reason: >
        تعريب مستقر لاسم العائلة Thorpe؛ يُستخدم في السياقات الرياضية التي تكتفي
        بالاسم الأخير. غياب الأدلة المعجمية طبيعي لأسماء الأعلام الأجنبية.
        يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يمثل اسم العائلة وحده — الصيغة الاختزالية للإحالة السريعة في قوائم الرياضيين
        والنتائج التنافسية؛ لا يُحدِّد الشخص بصورة كاملة في غياب السياق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثُورْبُ"

    - lemma: "جيم ثورب"
      decision: confirmed
      decision_reason: >
        الصيغة الأكثر شيوعاً وتداولاً في المصادر العربية الرياضية والموسوعية؛
        تجمع الاسم الأول (الكنوي) والأخير وتُحقق التعريف الكافي للشخص. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الأساسية المعيارية في التداول العربي — أكثر تحديداً من مجرد اسم العائلة،
        وأخفّ من الاسم الكامل الثلاثي في الاستخدام الاعتيادي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِيمْ ثُورْبُ"

    - lemma: "جَيمْس فرانسيس ثُورْبُ"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل (James Francis Thorpe) حاضر في المرادفات الإنجليزية لكنه
        يفتقر إلى ما يقابله في اللمّات العربية. إدراجه يكفل الاكتمال المعجمي ويوائم
        قائمة lemmas_en المعطاة. التعريب الصوتي قياسي ومطّرد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم القانوني الرسمي الكامل — مقصور على المراجع الأكاديمية وبطاقات التعريف
        الرسمية والتوثيق القانوني؛ نادراً ما يُستخدم في الصحافة الاعتيادية.
      actions:
        - command: create_entry
          params:
            lemma: "جَيمْس فرانسيس ثُورْبُ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "جَيمْس ثُورْبُ"
      source: stage1
      decision: removed
      decision_reason: >
        لا تُضيف هذه الصيغة قيمة تمييزية؛ فـ"جيم ثورب" أكثر شيوعاً وتداولاً كصيغة
        ثنائية، و"جيمس فرانسيس ثورب" يغطي الحاجة إلى الاسم الرسمي. تكرار غير مُبرَّر
        يُضخّم قائمة اللمّات دون مكسب دلالي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "رياضي أمريكي بارز (1887-1953)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي شديد الإيجاز؛ يقتصر على الفئة العامة (رياضي أمريكي) مع التأريخ
        دون إبراز ما يُميّز جيم ثورب عن سائر الرياضيين الأمريكيين. فضلاً عن ذلك، تاريخ
        الميلاد المذكور (1887) غير دقيق، والصواب 1888م. المقتضى تعريفٌ موسوعيٌّ يُبرز
        تعدُّد مواهبه الرياضية وإنجازه الأولمبي الفارق.
    authored:
      - type: encyclopedic
        text: >
          رياضيٌّ أمريكيٌّ أصلانيٌّ بارز (1888-1953)، اشتُهر بتعدُّد مواهبه الرياضية
          النادرة؛ فاز بميداليتين ذهبيتين في دورة الألعاب الأولمبية بستوكهولم 1912
          في مسابقتي الخماسي الحديث والعشاري، واحترف لاحقاً كرة القدم الأمريكية وكرة
          القاعدة. يُعدُّ في نظر كثير من المؤرخين الرياضيين أبرز رياضيٍّ شاملٍ في
          القرن العشرين.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            رياضيٌّ أمريكيٌّ أصلانيٌّ بارز (1888-1953)، اشتُهر بتعدُّد مواهبه الرياضية
            النادرة؛ فاز بميداليتين ذهبيتين في دورة الألعاب الأولمبية بستوكهولم 1912
            في مسابقتي الخماسي الحديث والعشاري، واحترف لاحقاً كرة القدم الأمريكية وكرة
            القاعدة. يُعدُّ في نظر كثير من المؤرخين الرياضيين أبرز رياضيٍّ شاملٍ في
            القرن العشرين.

  examples:
