# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14040677-n (extreme fatigue)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «إجهاد شديد» تركيب وصفي حر وليس مصطلحاً مسكوكاً؛ يمكن إبدال «شديد» بـ«بالغ» أو «عظيم» دون تغيير المعنى"
      - "«إجهاد» في الاستعمال المصطلحي الحديث يعني stress (الضغط الفيزيائي أو النفسي) لا fatigue (التعب الشديد)"
      - "التعريف العربي «تعب شديد» مقتضب ولا يميّز المجموعة عن المجموعة الرأسية (إرهاق/إعياء/تعب) تمييزاً كافياً"
    observations: "المجموعة تصف حالة فقدان القوة والطاقة البالغة الشدة الناجمة عن مجهود مُفرِط أو مرض. المصطلح العربي الأدق هو «إِنْهَاك» من الجذر ن-ه-ك الذي يدلّ على الإبلاغ في العقوبة والأذى والإنقاص، وقد استعمله العرب في سياق الحمّى والمرض. أمّا «إجهاد شديد» فليس وحدة معجمية ثابتة بل عبارة وصفية قابلة للتبديل."
  blind_candidates:
    - lemma: "إِنْهَاك"
      generation_method: ishtiqaq
      justification: "مصدر أَنْهَكَ على وزن إِفْعَال من الجذر ن-ه-ك، ودلالته التنقّص والإبلاغ في الأذى. يُقال نَهَكَتْهُ الحُمَّى أي جَهَدَتْه وأَضْنَتْه ونَقَصَتْ لَحْمَه. فالإنهاك حالة التعب الشديد الذي يُنقِص القوى."
    - lemma: "كَلَال"
      generation_method: ishtiqaq
      justification: "مصدر كَلَّ يَكِلُّ كَلَالاً من الجذر ك-ل-ل الدالّ على خلاف الحدّة والإعياء. يُقال كَلِلْتُ من المشي أي أَعْيَيْتُ. غير أنّ الكَلَال يدلّ على مطلق الإعياء لا على أقصاه."
    - lemma: "نَصَب"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر ن-ص-ب بمعنى التعب والعناء. قال تعالى: ﴿لَقَدْ لَقِينَا مِنْ سَفَرِنَا هَذَا نَصَبًا﴾. يدلّ على تعب ناتج عن كدّ ومشقة."
    - lemma: "إِضْنَاء"
      generation_method: ishtiqaq
      justification: "مصدر أَضْنَى على وزن إِفْعَال من الجذر ض-ن-ي، بمعنى إيقاع الضَّنَى وهو شدة المرض والهُزال. يدلّ على أقصى درجات الإعياء المصحوب بضعف الجسد."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "إِجْهَاد شَدِيد"
      contradicts:
        - text: "«إجهاد: strain / intensity of strain / stress»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "إجهاد في الاستعمال المصطلحي الحديث يعني stress/strain وليس fatigue"
        - text: "«إجهاد: حاصل تقسيم القوة على المساحة التي تؤثر فيها من عنصر إنشائي»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "التعريف هندسي فيزيائي (stress) لا علاقة له بالتعب البشري"
      expands:
        - text: "«(2) «أ» تَعَب؛ إعياء. «ب» إجهاد عصبيّ»"
          source: "المورد الحديث (2008)"
          addition: "المورد يذكر «إجهاد عصبي» كترجمة لـ fatigue لكنه مركب وصفي مقيّد بـ«عصبي» وليس مطلق التعب"

    - lemma: "إِنْهَاك"
      confirm:
        - text: "«نَهَكْتُ الثوب بالفتح أَنْهَكُهُ نَهْكاً: لبسته حتَّى خَلُقَ... نَهِكَتْهُ الحمَّى بالكسر تَنْهَكُهُ نَهْكاً ونهكة. وقد نهك، أي دنف وضنى، فهو منهوك»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«بدت فيه نهكة المرض. ونهكته الحمّى. وأنهكه السلطان عقوبةً»"
          source: "أساس البلاغة للزمخشري"
        - text: "«نَهَكَتْه الحُمَّى نهكًا من باب نَفَعَ وتَعِبَ: هزلته»"
          source: "المصباح المنير للفيّومي"
        - text: "«نهك: الأمرُ فلاناً: جهَدَه وغلبه... نُهِكَ فلانٌ: ضَنِيَ وبرَاه المرض»"
          source: "المعجم الوسيط"
        - text: "«إِنْهاك — exhaustion»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(1) استنفاد؛ استنزاف؛ إنهاك (2) إعياء — exhaustion»"
          source: "المورد الحديث (2008)"
        - text: "«إنهاك، إعياء — exhaustion»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"

    - lemma: "كَلَال"
      contradicts:
        - text: "«كَلال: ظاهرة قد يؤدي فيها تعّرض مُكوّنٍ ما لزيادة أو تقليل التحميل عليه إلى إضعافه ورُبما تعطّله عن العمل»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          conflict: "كلال في الاستعمال المعاصر تخصّص للدلالة على إجهاد المواد (material fatigue) لا التعب البشري"
      expands:
        - text: "«كَلِلْتُ من المشي أكِلُّ كلالاً وكَلالَةً، أي أعْيَيْتُ. وكذلك البعير إذا أعْيا. وكلَّ السيفُ والريح والطرف واللسان»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "في اللغة القديمة الكلال يشمل إعياء البدن لكنه يدلّ على مطلق الإعياء لا على أقصاه"
        - text: "«(1) كَلال؛ تعَب (2) تراخٍ؛ كسل — languor»"
          source: "المورد الحديث (2008)"
          addition: "المورد يترجم كلال بـ languor وهو أدنى من exhaustion درجةً"

    - lemma: "نَصَب"
      evidence_status: "no_material_found"

    - lemma: "إِضْنَاء"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّة موجودة: إجهاد شديد ──
    - lemma: "إِجْهَاد شَدِيد"
      decision: removed
      decision_reason: "تركيب وصفي حرّ يفشل في اختبار السكّ (يمكن إبدال «شديد» بـ«بالغ/كبير/عظيم»). كما أنّ «إجهاد» في المعاجم المصطلحية الحديثة تخصّص لمعنى stress (الضغط/الإجهاد الميكانيكي) لا fatigue. لا يصلح وحدةً معجمية لهذه المجموعة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة: إنهاك ──
    - lemma: "إِنْهَاك"
      decision: confirmed
      decision_reason: "مصدر إِفْعال من نَهَكَ، ثابت في المعاجم الكلاسيكية والحديثة بمعنى الإعياء الشديد وانتقاص القوى بفعل المرض أو الجهد. يُقابل exhaustion في المعاجم الطبية والبيطرية. جذره يدلّ على الإبلاغ في التنقّص وهو أقصى مراتب التعب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على أقصى درجات التعب المصحوب بانتقاص القوى البدنية، وهو أشدّ من مجرّد التعب أو الإعياء"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِنْهَاك"

    # ── مرشح المرحلة ١: كلال ──
    - lemma: "كَلَال"
      source: stage1
      decision: removed
      decision_reason: "الكَلَال في الأصل يدلّ على مطلق الإعياء والضعف (خلاف الحدّة)، وهو أقلّ شدّة من المطلوب (extreme fatigue). فضلاً عن أنّه تخصّص في الاستعمال المصطلحي المعاصر للدلالة على إجهاد المواد (material fatigue) فاستعماله للتعب البشري الشديد يُوقِع في لبس."
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: نَصَب ──
    - lemma: "نَصَب"
      source: stage1
      decision: removed
      decision_reason: "النَّصَب يدلّ على التعب والعناء الناتج عن كدّ ومشقة، لكنه لا يدلّ تحديداً على أقصى مراتب التعب. كما أنّه يقع في مرتبة المجموعة الرأسية (تعب/إعياء) لا في مرتبة التخصيص (extreme fatigue). لم تُعثَر له على أدلة معجمية تدعم المعنى المطلوب."
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: إضناء ──
    - lemma: "إِضْنَاء"
      source: stage1
      decision: removed
      decision_reason: "الإضناء مصدر أَضْنَى ويدلّ على إيقاع الضَّنَى وهو المرض الشديد والهُزال، فدلالته مقيّدة بسياق المرض لا مطلق التعب الشديد. كما أنّه يُركّز على الفعل المتعدّي (إضناء الغير) لا على الحالة ذاتها."
      evidence_assessment:
        case: no_material

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "تعب شديد"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً وأقرب إلى الترجمة الحرفية. لا يميّز هذا المفهوم عن المجموعة الرأسية (إرهاق/إعياء/تعب) تمييزاً كافياً، ولا يبيّن طبيعة الحالة."
    authored:
      - type: terminological
        text: "حالةٌ من فُقدان القُوَّة والنَّشاط البالغةِ الشِّدَّة، تَعجِزُ معها الأعضاءُ عن أداء وظائفها المعتادة، وتنشأُ عن مجهودٍ بدنيٍّ أو ذهنيٍّ مُفرِط أو عن مرض."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "أقصى مراتبِ التَّعَب التي يَنتقِصُ معها البَدَنُ قُواه ويَعجِزُ عن الحركة والعمل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالةٌ من فُقدان القُوَّة والنَّشاط البالغةِ الشِّدَّة، تَعجِزُ معها الأعضاءُ عن أداء وظائفها المعتادة، وتنشأُ عن مجهودٍ بدنيٍّ أو ذهنيٍّ مُفرِط أو عن مرض."

  examples:
    per_lemma:
      - lemma: "إِنْهَاك"
        examples:
          - text: "أُدخِل الجنديُّ المستشفى الميدانيَّ بعد أن بلغ به الإنهاكُ حدّاً لم يَعُد معه قادراً على الوقوف."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أُدخِل الجنديُّ المستشفى الميدانيَّ بعد أن بلغ به الإنهاكُ حدّاً لم يَعُد معه قادراً على الوقوف."

