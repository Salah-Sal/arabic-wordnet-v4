stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (رجولة) — ينبغي إثراؤها بمرادفات"
      - "اللمّة الموجودة بدون تشكيل كامل"
      - "التعريف العربي ترجمة حرفية عن الإنجليزية (حالة كونه رجلاً) — يحتاج صياغة معجمية أصيلة"
    observations: "المفهوم عربي أصيل وله مادة لغوية غنية في المعاجم القديمة والحديثة. الجذر ر ج ل من أكثر الجذور إنتاجية في العربية. المعجم الوسيط والكبير يعرّفان الرجولة بأنها «كمال الصفات المميزة للرجل» وهو تعريف دقيق. التعريف الحالي في AWN يخلط بين دلالتين: حالة البلوغ (state of being a man) والصفات الرجولية (manly qualities)، وهاتان دلالتان متمايزتان في العربية."
  blind_candidates:
    - lemma: "رُجُولَة"
      generation_method: ishtiqaq
      justification: "مصدر لا فعل له من الجذر ر ج ل على وزن فُعُولة، يدل على كمال الصفات المميزة للرجل. ورد في الصحاح واللسان والوسيط."
    - lemma: "رُجُولِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من رَجُل بإضافة ياء النسبة وتاء التأنيث، يرادف الرجولة. ذكره المعجم الكبير والصحاح. وأثبت معجم الصواب اللغوي فصاحته."
    - lemma: "رُجْلَة"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر ر ج ل على وزن فُعْلة، يدل على كمال صفات الرجل ونجابته. ورد في المعجم الكبير بمعنى كمال الصفات المميزة للرجل."
    - lemma: "مُرُوءَة"
      generation_method: majaz
      justification: "من الجذر م ر أ، والمروءة عند ابن فارس «كمال الرجولية». فيها توسع دلالي من الرجولة إلى الأخلاق الكاملة، لكنها تشترك مع الرجولة في الأصل المفهومي."

