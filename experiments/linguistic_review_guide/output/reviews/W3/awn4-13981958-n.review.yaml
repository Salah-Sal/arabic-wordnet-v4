# مراجعة المجموعة الترادفية — awn4-13981958-n (hereness)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«هنائية» مصطلح مولَّد لا يرد في أيّ معجم عربي كلاسيكي أو حديث، وقد يلتبس بالمصدر الصناعي من «هناء» (السرور) المشتق من جذر هنأ"
      - "«وجود هنا» عبارة وصفية حرة وليست وحدة معجمية ثابتة — يمكن إبدال «وجود» بـ«كينونة» أو «كون» فتبقى صالحة كوصف، ما يعني فشلها في اختبار السكّ"
      - "المفهوم (hereness) شديد التجريد ونادر الاستعمال حتى في الإنجليزية، وهو فجوة معجمية حقيقية في العربية"
    observations: "المجموعة تمثّل حالة الوجود في هذا المكان تحديداً (هنا)، وهي تخصيص لمفهوم الحضور (hypernym: حضور/وجود). في العربية القديمة «هنا» ظرف مكان مبنيّ للتقريب كما في مقاييس اللغة، ولم يُشتقّ منه مصدر صناعي في كلام العرب. الاشتقاق منه ممكن صرفياً على غرار «أنا → أنانيّة» لكنه يبقى توليداً محدثاً."

  blind_candidates:
    - lemma: "هُنَوِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «هنا» عبر النسبة «هُنَوِيّ» بقلب الألف واواً — وهو القياس الصرفي الأوّل لظروف المكان الثلاثية المنتهية بألف"
    - lemma: "هُنَائِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «هنا» بإدخال الهمزة قبل ياء النسبة على نحو: سماء → سمائيّ → سمائيّة. يؤدّي المعنى المطلوب: حالة الكون هنا"
    - lemma: "حُضُورٌ مَكَانِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين الحضور (الجنس القريب) والمكانيّ (الفصل النوعي)، لكنه عبارة وصفية أكثر منه مصطلحاً مسكوكاً"
    - lemma: "مَكَانِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «مكان» يدلّ على حالة الارتباط بالمكان، لكنه أعمّ من المفهوم المطلوب ولا يقيّد الدلالة بـ«هنا» تحديداً"


