    - lemma: "مَكَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "هُنَا (أصل الاشتقاق)"
      confirm:
        - text: "«(هَنَا) الْهَاءُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ، فِيهِ كَلِمَاتٌ مُشْكِلَةٌ، وَأَشْيَاءُ لَيْسَ لَهَا قِيَاسٌ. يَقُولُونَ: هُنَا كَلِمَةُ تَقْرِيبٍ، وَهَاهُنَا تَبْعِيدٌ.»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«فَقَدِ اخْتُلِفَ فِيهِ، فَقِيلَ إِنَّهُ الْيَوْمُ الْمَاضِي، وَهُوَ عَلَى التَّقْرِيبِ، يَقُولُ: عَهْدِي بِهِمْ يَوْمَ هُنَا. وَيُقَالُ بَلْ هُوَ اللَّعِبُ. وَيُقَالُ هُنَا: مَوْضِعٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ذكر ابن فارس أن «هنا» قد يكون اسم موضع أيضاً، مما يوسّع الدلالة المكانية"
        - text: "«كل ما هو كائن هنا في المنظور السيميائي، حيث تتحدد الوحدة وتتحول إلى موضوع معرفة ضد الغياب.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — مدخل «حُضُـور»"
          addition: "الحضور في المنظور السيميائي يُعرَّف بالكينونة هنا — ما يدعم الربط بين الحضور والهنائية"


