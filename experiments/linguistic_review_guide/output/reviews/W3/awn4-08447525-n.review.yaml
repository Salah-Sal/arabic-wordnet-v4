          text: "انتظمَ الطُّلَّابُ في صَفٍّ واحدٍ استعداداً لدخولِ الفصلِ."

stage5_enrichment:
  per_entry:
    - lemma: "خَطّ"
      entry_id: "{auto}"
      root: "خطط"
      maqayis_quote: "«الْخَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ ; وَهُوَ أَثَرٌ يَمْتَدُّ امْتِدَادًا. فَمِنْ ذَلِكَ الْخَطُّ الَّذِي يَخُطُّهُ الْكَاتِبُ.»"
    - lemma: "صَفّ"
      entry_id: "{auto}"
      root: "صفف"
      maqayis_quote: "«الصَّادُ وَالْفَاءُ يَدُلُّ عَلَى أَصْلٍ وَاحِدٌ، وَهُوَ اسْتِوَاءٌ فِي الشَّيْءِ وَتَسَاوٍ بَيْنَ شَيْئَيْنِ فِي الْمَقَرِّ. مِنْ ذَلِكَ الصَّفُّ، يُقَالُ وَقَفَا صَفًّا.»"
    - lemma: "سَطْر"
      entry_id: "{auto}"
      root: "سطر"
      maqayis_quote: "«السِّينُ وَالطَّاءُ وَالرَّاءُ أَصْلٌ مُطَّرِدٌ يَدُلُّ عَلَى اصْطِفَافِ الشَّيْءِ، كَالْكِتَابِ وَالشَّجَرِ، وَكُلِّ شَيْءٍ اصْطَفَّ.»"
    - lemma: "نَسَق"
      entry_id: "{auto}"
      root: "نسق"
      maqayis_quote: "«النُّونُ وَالسِّينُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَتَابُعٍ فِي الشَّيْءِ. وَكَلَامٌ نَسَقٌ: جَاءَ عَلَى نِظَامٍ وَاحِدٍ.»"
  per_sense:
