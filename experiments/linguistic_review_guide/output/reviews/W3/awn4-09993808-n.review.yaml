# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────
stage5_enrichment:

  per_entry:
    - lemma: "مُخْتَرِقٌ"
      entry_id: "{auto}"
      root: "خرق"
      maqayis_quote: "«الْخَاءُ وَالرَّاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ مَزْقُ الشَّيْءِ وَجَوْبُهُ، إِلَى ذَلِكَ يَرْجِعُ فُرُوعُهُ. فَيُقَالُ: خَرَقْتُ الْأَرْضَ، أَيْ جُبْتُهَا. وَاخْتَرَقَتِ الرِّيحُ الْأَرْضَ، إِذَا جَابَتْهَا»"

    - lemma: "قُرْصَانٌ"
      entry_id: "{auto}"
      root: "قرص"
      maqayis_quote: "«الْقَافُ وَالرَّاءُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قَبْضِ شَيْءٍ بِأَطْرَافِ الْأَصَابِعِ مَعَ نَبْرٍ يَكُونُ. مِنْ ذَلِكَ: قَرَصْتُهُ أَقْرُصُهُ قَرْصًا»"

    - lemma: "قِرْضَابٌ"
      entry_id: "{auto}"
      root: "قرضب"
      # الجذر رباعي (ق ر ض ب)؛ لا يرد في مقاييس اللغة لابن فارس الذي يقتصر على الثلاثي.

  per_sense:
    - lemma: "مُخْتَرِقٌ"
      sense_id: "{auto}"
      nuance: >
        الأعمُّ دلالةً بين مصطلحات المجموعة؛ يُركّز على فعل الاختراق التقني في حدّ ذاته دون إيحاء إجرامي صريح بالضرورة — يُستخدم أحياناً في سياق الاختبار الأمني المشروع (penetration tester). يحتاج إلى تقييد سياقي (إلكتروني خبيث) ليحمل دلالة المجموعة الكاملة.

    - lemma: "قُرْصَانٌ"
      sense_id: "{auto}"
      nuance: >
        يُبرز البُعد العدواني الغازي والاستيلاء القسري؛ الأشيع في الخطاب الإعلامي والوثائق الرسمية العربية. يشمل كلاً من hacker وcracker، وهو أوسع دلالةً من قرضاب. يحمل إيحاء الغارة المنظّمة لا مجرد التسلل.

    - lemma: "قِرْضَابٌ"
      sense_id: "{auto}"
      nuance: >
        الأخصّ دلالةً؛ يُقابل cracker تحديداً (كاسر الشفرات والحواجز الأمنية بنية خبيثة). يُركّز على القطع والكسر الداخلي للحواجز الأمنية، مع الإيحاء الإجرامي الصريح (اللص والقطّاع). مناسب للخطاب الأكاديمي التخصصي أكثر من الخطاب الإعلامي العام.

  synset:
    cultural_fit: lexical_gap
    # المفهوم موجودٌ في الثقافة الرقمية العربية المعاصرة وتتنافس على تعريبه مصطلحاتٌ متعددة
    # (قرصان، مخترق، دخيل، قرضاب)، لكنه يفتقر إلى مصطلح واحد مرسَّخ يُميّز المخترق
    # الخبيث (cracker) تمييزاً مستقراً عن المخترق الأخلاقي (hacker).

  actions:
    # مُخْتَرِق — مستوى المدخل
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"خرق","maqayis":"«الْخَاءُ وَالرَّاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ مَزْقُ الشَّيْءِ وَجَوْبُهُ»"}'

    # قُرْصَان — مستوى المدخل
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قرص","maqayis":"«الْقَافُ وَالرَّاءُ وَالصَّادُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قَبْضِ شَيْءٍ بِأَطْرَافِ الْأَصَابِعِ مَعَ نَبْرٍ يَكُونُ»"}'

    # قِرْضَاب — مستوى المدخل (جذر رباعي، لا مقاييس)
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قرضب","maqayis_note":"جذر رباعي، لا يرد في مقاييس اللغة لابن فارس"}'

    # مُخْتَرِق — مستوى المعنى
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الأعمّ دلالةً؛ يشمل المخترق الأخلاقي وغيره، ويحتاج إلى سياق لتخصيص الخبث","mwe":false}'

    # قُرْصَان — مستوى المعنى
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يُبرز العدوانية والاستيلاء القسري؛ الأشيع إعلامياً وأوسعهم دلالةً","mwe":false}'

    # قِرْضَاب — مستوى المعنى
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الأخصّ دلالةً بمقابلة cracker تحديداً؛ يُركّز على كسر الحواجز الأمنية بنية إجرامية","mwe":false}'

    # المجموعة الترادفية
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"lexical_gap"}'

    # درجة الثقة
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.78
