# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كراكر: تعريبٌ خامٌ يُفضي إلى التباس معجمي خطير؛ إذ تشيع كلمة cracker في اللغة العربية بمعنى البسكويت المقرمش (القراقيش)، لا بمعنى المخترق الإلكتروني."
      - "مخترق خبيث: عبارةٌ وصفيةٌ حرّة لا تجتاز اختبار السكّ المعجمي، فـ«خبيث» يمكن إبدالها بـ«ضارّ» أو «إجرامي» مع بقاء الدلالة، مما يدل على أنها ليست مصطلحاً مسكوكاً."
      - "التعريف الحالي يتضمن قوسين تفسيريين وسط نصّه (وصول غير مصرح به)، وهو أسلوب غير لائق بالتعريف المعجمي الاحترافي."
      - "لا يُميَّز التعريف بين الـ cracker (المخترق الخبيث بنيّة إجرامية) والـ hacker (المخترق المحترف الأخلاقي)، وهو فارق جوهري في المعجمية الحاسوبية."
    observations: >
      هذه المجموعة الترادفية تُعبّر عن مفهوم تقني حديث (المخترق الإلكتروني الخبيث)، وهو مفهومٌ ينتمي إلى ثقافة أمن المعلومات. اللمّة الأولى (كراكر) تعريبٌ اعتباطيٌّ دخيلٌ يتصادم مع مقابل عربي راسخ للكلمة الإنجليزية في سياق الأغذية.
      أما اللمّة الثانية (مخترق خبيث) فهي تركيبٌ وصفيٌّ فضفاض يُمكن توسيعه أو اختصاره دون أن تفقد العبارة دلالتها، بدليل وجود «مخترق» وحده في معجم الكهرباء الدولي ومعجم مصطلحات المعلوماتية مقابلاً للـ hacker/cracker. المنهجُ السليم أن يُستبدل المركّبان الضعيفان بمصطلحات عربية راسخة ذات جذور وتاريخ معجمي واضح.

  blind_candidates:
    - lemma: "نَقَّابٌ"
      generation_method: majaz
      justification: >
        إحياءٌ دلاليٌّ للفظ عربيٍّ كلاسيكيٍّ؛ النَّقَّاب في مقاييس اللغة لابن فارس هو «الْعَالِمُ بِالْأُمُورِ كَأَنَّهُ نَقَّبَ عَلَيْهَا فَاسْتَنْبَطَهَا»، أي المنقّب البحّاث المستخرج للأسرار الخفيّة. المجاز من استخراج الأسرار الخفية إلى اختراق الحواسيب واستخراج البيانات مجازٌ وظيفيٌّ واضح. الإحياء مُفضَّل على الاشتقاق الجديد لتجنّب الاشتراك اللفظي.

    - lemma: "مُتَسَلِّلٌ"
      generation_method: ishtiqaq
      justification: >
        مشتقٌّ من الجذر (س ل ل) على وزن مُتَفَعِّل، يدلّ على الدخول الخفي السريع غير المصرّح به. أصل السَّلّ سحبُ الشيء خِلسةً من غمده أو مكانه؛ والمتسلّل من يتسرّب إلى الأماكن المحظورة تسرّبًا خفيًّا. الوزن مُتَفَعِّل يُلائم دلالة الاستمرار والتقصّد، وهو ما يُميّز المخترق الخبيث عن الدخول العرضي.

    - lemma: "قِرْضَابٌ"
      generation_method: majaz
      justification: >
        لفظٌ عربيٌّ كلاسيكيٌّ معناه اللصّ والسيف القطّاع الذي يقطع العظام (المعجم الوسيط). المجاز من اللصّ القاطع إلى مُكسِّر حواجز الأمن الرقمي مجازٌ إزاحيٌّ طبيعي. الإيحاء بالقطع والكسر والتسلّل الإجرامي يتوافق تماماً مع دلالة الـ cracker (كاسر الشفرات والحواجز الأمنية بنية خبيثة).

    - lemma: "قُرْصَانٌ"
      generation_method: majaz
      justification: >
        اللفظ العربي القديم لـ"لصّ البحر" (المعجم الوسيط: لصّ البحر)؛ والمجاز إلى "لصّ الفضاء الإلكتروني" مجازٌ بالمشابهة الوظيفية: كلاهما يُغير على أملاك غيره بالقوة دون إذن ويستولي عليها بنيّة إجرامية. هذا المجاز موصولٌ بالتراث ومأنوسٌ في الذهن العربي.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "كراكر"
      evidence_status: "no_material_found"
      # الاستعلام ١ (المطابقة الدقيقة): لم يُعثر على مدخل عربي لـ"كراكر" أو "الكراكر"
      # بمعنى المخترق الإلكتروني في أيٍّ من معاجم قاعدة البيانات.
      # الجسر الإنجليزي: المورد الحديث ترجم cracker بـ"جهاز التكسير" (للبترول)
      # و"بسكويتة هشّة ناشفة" — لا توجد ترجمة بمعنى المخترق الإلكتروني.

    - lemma: "مخترق خبيث"
      confirm:
        - text: "«مخترق — hacker»"
          source: "موسوعة الكهرباء (IEC 60050) — Electropedia"
        - text: "«مخترِق، قِرْضَاب — cracker»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      contradicts:
        - text: "«المُخْتَرَق: المَمَرُّ المَوْضِعُ الذى تَخْتَرِقُه الرِّياحُ مَهَبُّ الرِّياح»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: >
            المُخْتَرَق (بفتح الراء) في المعاجم الكلاسيكية هو مكان تجوب فيه الرياح، وليس اسم فاعل. الاستخدام المقصود هو المُخْتَرِق (بكسر الراء) كاسم فاعل من اخترق، وهو تحوّل لم يُقنَّن في المعاجم الكلاسيكية.
        - text: "«المخترق مخترق الرِّيَاح مهبها وممرها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          conflict: "الدلالة الكلاسيكية المسجَّلة هي المكان لا الشخص."
      expands:
        - text: "«مخترِق، قِرْضَاب — cracker»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: >
            المعجم يقرن مخترق بقرضاب مقابلاً للـ cracker، مما يدل على أن المصطلحَيْن يتنافسان في هذا الحقل ولم يستقر أحدهما بعينه.

    - lemma: "نَقَّابٌ"
      confirm:
        - text: "«النُّقَابُ: الكثير التَّنْقِيب»"
          source: "المعجم الوسيط"
        - text: "«النِّقَابُ: الْعَلَّامَة البحَّاثة الفطِن»"
          source: "المعجم الوسيط"
        - text: "«وَمِنَ الْبَابِ: النَّقَّابُ: الْعَالِمُ بِالْأُمُورِ، كَأَنَّهُ نَقَّبَ عَلَيْهَا فَاسْتَنْبَطَهَا، أَوِ الْعَالِمُ بِهَا الْمُنَقِّبُ عَنْهَا. قَالَ: مَلِيحٌ نَجِيحٌ أَخُو مَأْقِطٍ ... نِقَابٌ يُحَدِّثُ بِالْغَائِبِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«نِقَاب — veil»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          conflict: >
            المعنى الحديث السائد للنقاب هو غطاء وجه المرأة؛ وهذا التداخل الدلالي يجعل إحياء النقاب/النقاب مصطلحاً للمخترق الإلكتروني مُضلِّلاً جداً في السياق المعاصر.

    - lemma: "مُتَسَلِّلٌ"
      evidence_status: "no_material_found"
      # الاستعلام ١: لم يُعثر على مدخل لـ"متسلل" في سياق أمن المعلومات أو المعلوماتية.

    - lemma: "قِرْضَابٌ"
      confirm:
        - text: "«مخترِق، قِرْضَاب — cracker»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«القِرْضَابُ: اللِّصُّ»"
          source: "المحيط في اللغة للصاحب بن عباد"
        - text: "«القِرْضَابُ: النَّهِم فِي أَكْلِه، وَاللِّصُّ، وَالأَسَدُ، وَمِنَ السُّيُوفِ: القَطَّاع يَقْطَعُ العِظَامَ. (ج) قراضبة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«سَيْفٌ قِرْضَابٌ مُقَرْضِبٌ: قَطَّاعٌ. وَرَجُلٌ قُرْضُوبٌ وَقِرْضَابٌ: فَقِيرٌ، قَرْضَبَهُ الدَّهْرُ»"
          source: "المحيط في اللغة للصاحب بن عباد"
          addition: >
            اللفظ يجمع دلالة اللصّ (التسلل الإجرامي) والقطّاع (كسر الحواجز)، وكلتاهما مُناسبتان مجازياً للمخترق الخبيث كاسر حواجز الأمن المعلوماتي.

    - lemma: "قُرْصَانٌ"
      confirm:
        - text: "«قُرْصَان: شخص يقوم باستنساخ البرمجيات بكيفية غير مشروعة أو اختراق الأنظمة والاطلاع على معلومات دون أن يكون له الحق في ذلك — hacker»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011) — ALECSO"
        - text: "«قُرصان أبيض: قرصان إعلامي يقوم باختراقات وأعمال لفتح البرامج المعلوماتية للعموم — white hat; hacker»"
          source: "مسرد الإعلام والتواصل — ALECSO"
        - text: "«قُرْصَان إعلاميّ: قرصان إعلامي يقوم عن قصد بإلحاق ضرر أو خسارات بنظام معلوماتي — black hat; hacker»"
          source: "مسرد الإعلام والتواصل — ALECSO"
        - text: "«القُرْصَانُ: لِصُّ البحر»"
          source: "المعجم الوسيط"
        - text: "«أَجَازَ مَجْمَعُ اللُّغَةِ الْمِصْرِيِّ اسْتِعْمَالَ هَذِهِ الْكَلِمَةِ، وَقَدْ ذَكَرَهَا الأَسَاسِيُّ، وَالْمُنْجِدُ بِهَذَا الْمَعْنَى»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«مبرمِج مقتحم، قرصان معلوماتية — hacker programmer»"
          source: "مسرد التربية — ALECSO"
          addition: >
            هذا التعبير يُثبت أن «قرصان» يُستخدم مقرونًا بالمعلوماتية في المصادر المعيارية العربية، وأن الحقل الدلالي قد انتقل رسمياً من القرصنة البحرية إلى القرصنة الإلكترونية.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "كراكر"
      decision: removed
      decision_reason: >
        تعريبٌ خامٌ للكلمة الإنجليزية cracker دون اطّراد ولا استيعاب صرفي حقيقي. الأخطر أن «كراكر» مستخدمةٌ في اللغة العربية الدارجة والمعاجم (المورد الحديث، مسرد تقانات الأغذية: قراقيش، بسكويت ناشف) بمعنى نوع من البسكويت، مما يُحدث تصادماً دلالياً صريحاً. لا توجد في قاعدة البيانات أيُّ سجلٍّ للكلمة بمعنى المخترق الإلكتروني. فضلاً عن ذلك، فإن الكلمة لا تُكوّن النسبة والجمع السالم بيُسر في العربية المعيارية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة ٢ ──
    - lemma: "مخترق خبيث"
      decision: removed
      decision_reason: >
        عبارةٌ وصفيةٌ حرّة لا تجتاز اختبار السكّ المعجمي: يمكن إبدال «خبيث» بـ«ضارّ» أو «إجرامي» أو «خطير» مع الإبقاء على المعنى، دليلٌ قاطعٌ على أنها ليست وحدة معجمية مسكوكة. كذلك تجتمع كلمة «مخترق» على الضبط (المُخْتَرَق بالفتح لمكان هبوب الرياح، والمُخْتَرِق بالكسر للفاعل) مما يُوجب التشكيل. يُستعاض عنها بـ«مُخْتَرِق» وحدها (اسم الفاعل من اخترق الثلاثي المزيد بالاستفعال) وهي موثّقة في الموسوعة الكهربائية (Electropedia) ومعجم مصطلحات المعلوماتية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
        # إضافة المصطلح المنقَّح مباشرةً
        - command: create_entry
          params:
            lemma: "مُخْتَرِقٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: أ ──
    - lemma: "نَقَّابٌ"
      source: stage1
      decision: removed
      decision_reason: >
        على الرغم من الأصل الكلاسيكي الراسخ وتناسب المعنى الأصيل (البحّاث الفطن المستخرج للأسرار)، فإن الاستخدام الحديث الطاغي للنقاب بمعنى غطاء وجه المرأة يُفضي إلى التباس دلالي جسيم لا يحتمله المعجم التخصصي. التداخل بين النِّقَاب (وجه المرأة) والنَّقَّاب (الفطن البحّاث) حاجزٌ عملي أمام التوظيف.
      evidence_assessment:
        case: mixed

    # ── مرشح المرحلة ١: ب ──
    - lemma: "مُتَسَلِّلٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المصطلح دلالياً مناسب (التسلل الخفي غير المشروع) لكنه لم يُعثر له على توثيق في معاجم أمن المعلومات بقاعدة البيانات، ولا في المعجمية العربية التقنية المعتمدة. التسلل يُشير إلى الدخول الخفي لكنه لا يتضمن بالضرورة النية الخبيثة التي هي جوهر المفهوم؛ كما يُستخدم في سياقات عسكرية وأمنية مغايرة.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: ج ──
    - lemma: "قِرْضَابٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        اللفظ العربي الكلاسيكي بمعنى اللصّ والسيف القطّاع (المعجم الوسيط، المحيط) يُشكّل منطلقاً مجازياً صريحاً لمن يقطع حواجز الأمن ويسرق البيانات. والأهم أن معجم مصطلحات المعلوماتية (2000) يستخدمه صراحةً مقابلاً لـcracker مقترنًا بـ«مخترق». الجمع قراضبة سليم صرفياً. اختار المصطلح مرتبة المجاز على التعريب، وأحيا لفظاً عربياً ميتاً بدلاً من استحداث جديد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على البُعد الإجرامي والتدميري الصريح (القطع والسرقة)، ويُفرّق ضمنياً عن قرصان بأن القرضاب يدلّ على الكسر الداخلي للحواجز لا الغارة من الخارج. هو مقابل «cracker» تحديداً (كاسر الشفرات والحواجز الأمنية)، لا مقابل «hacker» العام.
      actions:
        - command: create_entry
          params:
            lemma: "قِرْضَابٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: د ──
    - lemma: "قُرْصَانٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُوثَّقٌ بقوة في المعجمية العربية التقنية المعتمدة: المعجم الموحد لمصطلحات تقانة المعلومات (ALECSO 2011) يجعله مقابلاً مباشراً لـ«hacker» في حقل تكنولوجيا المعلومات. مجمع اللغة المصري أجاز استخدامه. المجاز من «لص البحر» إلى «لص الفضاء الإلكتروني» مجازٌ اتصالي موصول. الجمع قراصنة سليم. المصطلح شائع في الصحافة العربية والوثائق الأمنية الرسمية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُبرز البُعد العدواني الغازي والاستيلاء القسري (قياساً على قرصنة السفن)؛ يُستخدم في الخطاب الإعلامي والرسمي مصطلحاً جامعاً يشمل جميع أنواع المخترقين الإلكترونيين (hacker/cracker)، وهو أوسع دلالةً من قرضاب. يُفرَّق في المصادر بين قرصان أبيض (white hat) وقرصان إعلامي بمعنى black hat.
      actions:
        - command: create_entry
          params:
            lemma: "قُرْصَانٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── اللمّة المُنقَّحة من تحليل مخترق خبيث ──
    - lemma: "مُخْتَرِقٌ"
      decision: confirmed
      decision_reason: >
        اسم الفاعل من اخترق (الثلاثي المزيد، باب الافتعال) على وزن مُفْتَعِل؛ يُوثَّق في موسوعة الكهرباء (Electropedia) مقابلاً لـ«hacker» وفي معجم مصطلحات المعلوماتية مقابلاً لـ«cracker». التشكيل بكسر الراء (مُخْتَرِق) يُفرّقه عن المُخْتَرَق (بفتح الراء) بمعنى مهبّ الرياح، وهو تمييزٌ ضروري. المصطلح أكثر حياداً من قرصان وأدق تقنياً من قرضاب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على فعل الاختراق التقني دون إيحاء إجرامي صريح بالضرورة؛ يُستخدم أحياناً في السياق الأمني المشروع (الاختبار الأمني، penetration testing). هو الأعمّ بين الثلاثة دلالةً، ويحتاج إلى تقييد سياقي لتخصيص الخبث.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخْتَرِقٌ"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────
stage4_content:
