      reason: >
        التعريف يحتوي على قوسين تفسيريين وسط نصّه (وصول غير مصرح به)، وهو أسلوب غير لائق بالتعريف المعجمي. كذلك تقييد الفاعل بـ«مبرمج» يُضيّق الدلالة بغير وجه حق — إذ لا يشترط في المخترق أن يكون مبرمجاً محترفاً. وكلمة «عادة» تُضعف التعريف المصطلحي. وأخيراً، غياب الفصل النوعي الذي يُميّز المخترق الخبيث عن المخترق الأخلاقي.
    authored:
