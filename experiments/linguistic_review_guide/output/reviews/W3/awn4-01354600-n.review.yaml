stage1_review:
  assessment:
    concerns:
      - "الكلمة الأصلية (Hypernym) تشير إلى `ترتيب / نظام` كترتيب منطقي، في حين أن المعنى التصنيفي الصحيح يجب أن يشير إلى `رتبة (تصنيف)` كمجموعة تصنيفية في علم الأحياء."
    observations: "المفهوم يشير إلى المرتبة التصنيفية (Order) الخاصة بالبكتيريا. المصطلح `رتبة بكتيرية` دقيق من حيث كونه مركباً وصفياً يعبر بوضوح عن المفهوم."
  blind_candidates:
    - lemma: "رُتْبَة بَكْتِيرِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي يجمع بين `رتبة` (Order) والصفة المنسوبة `بكتيرية`."
    - lemma: "رُتْبَة جُرْثُومِيَّة"
      generation_method: tarkib
      justification: "تركيب وصفي يستخدم المرادف العربي `جرثومية` بدلاً من اللفظ المعرب."
    - lemma: "رُتْبَةُ البَكْتِيرِيَا"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر عن تخصيص الرتبة."
    - lemma: "رُتْبَةُ الجَرَاثِيمِ"
      generation_method: tarkib
      justification: "تركيب إضافي باستخدام الجمع الجراثيم."

