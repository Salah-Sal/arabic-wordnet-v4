stage3_analysis:
  per_lemma:
    - lemma: "رتبة بكتيرية"
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق ومباشر يتوافق مع المصطلحات التصنيفية في علم الأحياء."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "اللفظ الشائع والأكثر تداولاً علمياً مع استخدام كلمة بكتيريا."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُتْبَة بَكْتِيرِيَّة"

    - lemma: "رُتْبَة جُرْثُومِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "بديل وصفي فصيح يستخدم الترجمة العربية `جرثومة` للدلالة على البكتيريا."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يفضل في السياقات التي تميل إلى استخدام التعريب التأثيلي على التعريب اللفظي (جرثومة بدل بكتيريا)."
      actions:
        - command: create_entry
          params: {lemma: "رُتْبَة جُرْثُومِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-01354600-n"}

    - lemma: "رُتْبَةُ البَكْتِيرِيَا"
      source: stage1
      decision: removed
      decision_reason: "التركيب الوصفي `رتبة بكتيرية` أخف وأكثر شيوعاً."

    - lemma: "رُتْبَةُ الجَرَاثِيمِ"
      source: stage1
      decision: removed
      decision_reason: "التركيب الوصفي يفي بالغرض ويسهل استخدامه."

stage4_content:
  definition:
    current: "رتبة من البكتيريا"
    assessment:
      decision: revise
      reason: "التعريف الحالي حرفي وسطحي. يجب تقديم تعريف يوضح الموقع التصنيفي."
    authored:
      - type: terminological
        text: "مرتبة تصنيفية في علم الأحياء الدقيقة، تضم مجموعة من الفصائل البكتيرية المتقاربة، وتقع تحت طائفة البكتيريا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-01354600-n", definition_index: 0, text: "مرتبة تصنيفية في علم الأحياء الدقيقة، تضم مجموعة من الفصائل البكتيرية المتقاربة، وتقع تحت طائفة البكتيريا."}

  examples:
    per_lemma:
      - lemma: "رُتْبَة بَكْتِيرِيَّة"
        examples:
          - text: "تنتمي هذه العائلة إلى رتبة بكتيرية تعيش في البيئات القاسية."
            type: usage
      - lemma: "رُتْبَة جُرْثُومِيَّة"
        examples:
          - text: "اكتشف العلماء رتبة جرثومية جديدة لا تتأثر بالمضادات الحيوية المعروفة."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "تنتمي هذه العائلة إلى رتبة بكتيرية تعيش في البيئات القاسية."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "اكتشف العلماء رتبة جرثومية جديدة لا تتأثر بالمضادات الحيوية المعروفة."}

