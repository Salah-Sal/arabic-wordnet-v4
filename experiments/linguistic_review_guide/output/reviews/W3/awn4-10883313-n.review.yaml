# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10883313-n  |  ili: i94544  |  POS: n
# Marcel Breuer — مارسيل بروير
# تاريخ المراجعة: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (أعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (بروير / مارسيل بروير) خاليتان من التشكيل الكامل."
      - "الاسم الرسمي الكامل (Marcel Lajos Breuer — مارسيل لاجوس بروير) غائب من المجموعة مع أنه مُدرج في OEWN."
      - "POS المجموعة مُسجَّل كـ n (اسم عام) بينما الأدق لغوياً proper_noun (اسم علم). غير أن هذا موروث من تصنيف WordNet القياسي."
      - "الكلمة 'بروير' منفردةً قابلة للالتباس بكلمة 'Brewer' (صانع الجعة) وكذلك بـ Hering-Breuer (مصطلح طبي) — يستلزم التشكيل للتمييز."
    observations: >
      هذه المجموعة تخصّ اسم علم لشخصية تاريخية أجنبية (المعماري المجري-الأمريكي مارسيل بروير).
      بناءً عليه، فإن أساليب التوليد الأربعة لا تنطبق إلا على منهج التعريب (الأخير)، إذ لا
      اشتقاق ولا مجاز ولا تركيب يُفيد في اسم علم أجنبي. التحدي الجوهري هو ضبط التعريب:
      هل يتّبع القارئ العربي صوت الاسم الفرنسي (مارسيل) أم اللاتيني؟ وهل يضبط "Breuer"
      على نحو بْرُويِر أم بْرُوِيِر؟ الاتساق الإملائي مع أدبيات العمارة العربية المعاصرة معيار الفصل.

  blind_candidates:
    # ── التوليد الأعمى انطلاقاً من التعريف فقط قبل الاطلاع على اللمّات ──
    # المجموعة تصف: معماري أمريكي (ولد في المجر)، باوهاوس، 1902-1981 → مارسيل بروير.
    # جميع المرشحات تعريب لأجزاء الاسم الرسمي الكامل.

    - lemma: "مَارْسِيل بْرُويِر"
      generation_method: taarib
      justification: >
        تعريب الاسم الثنائي الأكثر شيوعاً في الكتابات العربية المتخصصة بالعمارة والفنون؛
        Marcel (مَارْسِيل) من الفرنسية/اللاتينية، Breuer (بْرُويِر) نطق ألماني/مجري.
        هذا المركّب هو اللمّة المرجعية الأساسية.

    - lemma: "مَارْسِيل لَاجُوس بْرُويِر"
      generation_method: taarib
      justification: >
        الاسم الرسمي الكامل (Marcel Lajos Breuer)؛ Lajos = لَاجُوس (الصيغة المجرية لـ Louis).
        يُستخدم في الوثائق الأكاديمية والمعاجم الموسوعية عند التعريف الأول للشخصية.

    - lemma: "بْرُويِر"
      generation_method: taarib
      justification: >
        اللقب/الكنية منفردةً، وهو أسلوب شائع في أدبيات العمارة للإحالة السريعة إلى
        معماريين مشهورين (Le Corbusier، Gropius، Breuer). صوت الاسم ألماني الأصل.

    - lemma: "مَارْسِيل بْرُوِيِر"
      generation_method: taarib
      justification: >
        صيغة تعريب بديلة تعكس نطقاً مختلفاً لـ "eu" في لغات أوروبية مختلفة.
        أقل شيوعاً من الصيغة الأولى، مذكورة للإحصاء الشامل للتعريبات الواردة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
# [Q1] مطابقة دقيقة دفعية — بروير، مارسيل، مارسيل بروير، براور
# [Q2] الجسر الإنجليزي — Marcel Breuer / Breuer / Marcel Lajos Breuer
# [Q3] FTS عربي — باوهاوس، بروير، براور
# النتيجة الإجمالية: لا مادة معجمية مباشرة للشخص ذاته؛
#   Q2 أعاد إدخالاً واحداً طبياً (منعكس هيرينغ-بروار) لا صلة له بالمعماري.
stage2_evidence:
  per_lemma:
    - lemma: "بروير"
      contradicts:
        - text: "«مُنْعَكَسُ هيرِينْغ-بروار (يؤدي تنبيه نهايات الأعصاب الحسية في الرئتين إلى تقليص التنفس)»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >
            الإدخال الوحيد الذي يحمل 'بروار/بروير' في القاعدة هو المصطلح الطبي
            Hering-Breuer reflex (نسبةً إلى Karl Ewald Hering وJosef Breuer الطبيب)
            ولا علاقة له بمارسيل بروير المعماري.
      # الخلاصة: غياب تام للمادة المعجمية عن المعماري مارسيل بروير.

    - lemma: "مارسيل بروير"
      evidence_status: "no_material_found"

    - lemma: "مَارْسِيل بْرُويِر"
      evidence_status: "no_material_found"

    - lemma: "مَارْسِيل لَاجُوس بْرُويِر"
      evidence_status: "no_material_found"

    - lemma: "مَارْسِيل بْرُوِيِر"
      evidence_status: "no_material_found"

  query_log:
    - id: Q1
      pattern: "batch_headword"
      terms: ["بروير","البروير","مارسيل","المارسيل","مارسيل بروير","براور","البراور"]
      results_count: 1
      note: "وُجد 'مارسيل' فقط كاسم أنثوي في موسوعة أسماء العرب — لا صلة."
    - id: Q2
      pattern: "english_bridge"
      terms: ["Marcel Breuer","Breuer","Marcel Lajos Breuer"]
      results_count: 1
      note: "Hering-Breuer reflex (طبي) — لا صلة بالمعماري."
    - id: Q3
      pattern: "fts_arabic"
      terms: ["باوهاوس","بروير","براور"]
      results_count: 1
      note: "باوهاوس كمصطلح تربوي فقط — لا ذكر للمعماري."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: بروير ──
    - lemma: "بروير"
      decision: confirmed
      decision_reason: >
        اللقب منفرداً وحدةٌ معجمية ثابتة للإحالة السريعة إلى المعماري في أدبيات العمارة،
        على غرار استخدام Gropius أو Mies منفردَيْن. يستوجب التشكيل الكامل للتمييز عن
        التوافق اللفظي مع المصطلح الطبي (هيرينغ-بروار). غياب الأدلة المعجمية طبيعي
        لأسماء الأعلام الأجنبية في المعاجم العربية.
      evidence_assessment:
        case: no_material
      morphological_check:
        note: "اسم علم معرَّب من الألمانية/المجرية. لا وزن صرفي عربي ينطبق."
      borrowing_check:
        type: taarib
        verdict: مقبول
        note: "تعريب لصوت أجنبي. قابل لتلقي ال- والنسبة (البروير، البروّيري) والجمع السالم."
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستخدم اللقب المجرَّد (بروير) في السياقات المهنية والأكاديمية للإحالة السريعة
        والمختصرة، في حين يُحتجَز الاسم الكامل للتعريف الأول والسياقات الرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بْرُويِر"

    # ── لمّة موجودة: مارسيل بروير ──
    - lemma: "مارسيل بروير"
      decision: confirmed
      decision_reason: >
        الاسم الثنائي (الاسم الأول + اللقب) هو المسمّى المرجعي الأساسي للشخصية في
        الكتابات العربية المتخصصة. يجمع بين تمييز الاسم الشخصي والاسم العائلي. يستوجب
        التشكيل الكامل.
      evidence_assessment:
        case: no_material
      morphological_check:
        note: "تركيب اسمي أجنبي ثنائي — مارسيل (فرنسي/لاتيني) + بروير (ألماني/مجري)."
      borrowing_check:
        type: taarib
        verdict: مقبول
        note: "المركّبان الاثنان معرَّبان بصيغة صوتية متعارف عليها."
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        note: "اسم شهرة ثنائي (first name + surname). الوحدة المعجمية ثابتة ولا يمكن إبدال أي مكوّن."
      nuance_differentiation: >
        الاسم الثنائي الكامل (الأول + اللقب) هو اللمّة الرئيسية التعريفية، يُستخدم
        في أوّل ذكر للشخصية وفي السياقات الرسمية والنصوص الموسوعية، يمتاز بتحديد
        الهوية الكاملة دون لبس.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَارْسِيل بْرُويِر"

    # ── مرشح المرحلة ١: مارسيل لاجوس بروير ──
    - lemma: "مَارْسِيل لَاجُوس بْرُويِر"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل مُدرج في OEWN الإنجليزية (Marcel Lajos Breuer) ومعيار التكافؤ
        مع الشبكة الإنجليزية يقتضي إدراجه. "لاجوس" (Lajos) هو الاسم المجري المعادل
        لـ Ludwig/Louis، وهو جزء من الاسم الرسمي الكامل للمعماري المُسجَّل في الوثائق
        المهنية والأرشيفات الأكاديمية. اجتاز اختبار السكّ: المركّب ثابت ولا يقبل إبدال
        مكوّناته (لا يمكن قول "مارسيل محمد بروير" مع بقاء الدلالة).
      evidence_assessment:
        case: no_material
      morphological_check:
        note: "اسم ثلاثي أجنبي: مارسيل (فرنسي) + لاجوس (مجري) + بروير (ألماني/مجري)."
      borrowing_check:
        type: taarib
        verdict: مقبول
        note: "تعريب صوتي للاسم الرسمي كما ورد في المصادر الغربية."
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        note: "اسم ثلاثي (first + middle + last name). وحدة معجمية ثابتة."
      nuance_differentiation: >
        الاسم الرسمي الكامل الثلاثي (الاسم الأول + الاسم الأوسط + اللقب)، يُستخدم
        في الوثائق الأرشيفية والدراسات الأكاديمية المتخصصة عند الحاجة إلى التوثيق
        الدقيق الكامل. أكثر رسميةً من الاسم الثنائي وأشمل منه معلوماتياً.
      actions:
        - command: create_entry
          params:
            lemma: "مَارْسِيل لَاجُوس بْرُويِر"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: مارسيل بروير (مُشكَّل — نسخة مرشحة) ──
    # تمّ دمجه مع اللمّة الموجودة بعد التشكيل. لا إجراء مستقل.

    # ── مرشح المرحلة ١: مَارْسِيل بْرُوِيِر (تعريب بديل) ──
    - lemma: "مَارْسِيل بْرُوِيِر"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب بديل للصيغة الموجودة (مارسيل بروير)؛ الإبقاء على تعريبَيْن لنفس الاسم
        يُربك القارئ دون مكسب دلالي. الصيغة المعتمدة (بروير) أكثر اتساقاً مع الأدبيات
        العربية المتخصصة.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: n
      note: "POS يبقى n وفق الاصطلاح القياسي لـ WordNet لأسماء الأعلام."


