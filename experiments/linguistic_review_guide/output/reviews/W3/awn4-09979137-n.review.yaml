# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'بنائي' مُسجَّلة بدون تشكيل كامل"
      - "اللمّة 'فنان بنائي' عبارة وصفية حرة تفشل اختبار التثبيت المعجمي: يمكن إبدال 'بنائي' بـ'تجريدي' أو 'تكعيبي' وتبقى الجملة صالحة وصفياً — ليست مصطلحاً مسكوكاً"
      - "التعريف الحالي مختصر ودائري: يستخدم 'البنائية' للتعريف بفنان البنائية دون شرح ماهية المذهب أو الفصل النوعي الكافي"
    observations: >
      المجموعة تمثل مفهوماً فنياً غربياً الأصل (البنائية الروسية — Constructivism).
      الجذر العربي المنتج هو ب-ن-ي الذي يُشتق منه 'بناء' ثم 'بنائي' بصيغة النسبة (فِعَالِيّ).
      يجب التنبه إلى التمييز الدقيق بين: البنائية (Constructivism) — حركة فنية تشكيلية،
      والبنيوية (Structuralism) — مذهب نقدي/لساني؛ فالنسبتان 'بنائي' و'بنيوي' تشتبهان
      صوتياً لكنهما تدلّان على مفهومين مختلفين تماماً. اللمّة الوحيدة المنتجة معجمياً هي
      النسبة 'بنائي' التي تُعبّر عن المنتسب إلى المذهب بصيغة مختزلة طبيعية في العربية.
  blind_candidates:
    - lemma: "بِنَائِيٌّ"
      generation_method: ishtiqaq
      justification: "نسبة من 'البنائية' (الحركة الفنية) على وزن فِعَالِيّ، وهو الوزن الصرفي المستعمل للانتساب إلى المذاهب والمدارس الفكرية؛ كما يقال: اشتراكيّ من الاشتراكية، وديمقراطيّ من الديمقراطية"
    - lemma: "تَرْكِيبِيٌّ"
      generation_method: ishtiqaq
      justification: "نسبة من 'التركيبية' — الترجمة البديلة لـ Constructivism في بعض المراجع — من جذر ر-ك-ب على وزن فَعْلِيّ، يصف المنتسب إلى مدرسة تقوم على التركيب والبناء الهندسي"
    - lemma: "إِنْشَائِيٌّ"
      generation_method: ishtiqaq
      justification: "نسبة من 'الإنشائية' (مقابل محتمل لـ Constructivism)، من جذر ن-ش-أ الدال على الإقامة والبناء، يصف المنتسب لمن يُعلي من شأن الإنشاء والتشييد في الفن"
    - lemma: "بِنْيَوِيٌّ"
      generation_method: ishtiqaq
      justification: "نسبة من 'البنية' على وزن فِعْلَوِيّ، إذ يقوم منهج البنائية الفنية على مفهوم البنية المجردة، وقد يُستعمل في بعض السياقات مرادفاً لبنائي"


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بنائي"
      confirm:
        - text: "«بِنَائيّ — من (ب ن و) نسبة إلى البِنَاء: المبنى»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
        - text: "«بنائية (ال…) — مدرسة فنية سعت إلى فنّ يعتمد على البناء المعماري في الفراغ ويشابه عملهم عمل المهندسين الميكانيكيين وما يقدمه الفراغ من تأثير على الكتلة التي لا تبدو مصمتة» — translation_en: constructivism"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
        - text: "«البِنَائِيَّةُ (ال..)» — translation_en: constructivism"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020) — ARABTERM"
      contradicts:
        - text: "«بنائي — constructive» في سياقات الجيولوجيا وعلوم الزلازل والطب"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)؛ المعجم الموحد لمصطلحات علوم الزلازل (1999)؛ معجم المصطلحات الطبية (1985) — ARABTERM"
          conflict: "الترادف الإنجليزي المسجَّل هو 'constructive' (بنّاء/تكويني — صفة) لا 'constructivist' (المنتسب لمدرسة البنائية الفنية — اسم)؛ مما يدل على ازدواجية الاستعمال ووجوب تحديد السياق"
      expands:
        - text: "«بَنَّائيّ — من (ب ن و) نسبة إلى بَنَّاء»"
          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
          addition: "تُثبت المعاجم وجود صيغتين: بِنَائيّ (نسبة إلى البِناء) وبَنَّائيّ (نسبة إلى بَنَّاء)؛ والصيغة الأولى هي الأنسب للمذهب الفني"

    - lemma: "فنان بنائي"
      evidence_status: "no_material_found"

    - lemma: "بِنَائِيٌّ"
