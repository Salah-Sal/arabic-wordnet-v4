          source: "موسوعة السلطان قابوس لأسماء العرب (hawramani)"
      contradicts:
        - text: "«بنائي — constructive» في سياقات علمية تقنية"
          source: "ARABTERM — متعدد المعاجم"
          conflict: "التعارض ذاته المذكور في لمّة 'بنائي' الموجودة — الترادف الإنجليزي 'constructive' لا 'constructivist'"

    - lemma: "تَرْكِيبِيٌّ"
      contradicts:
        - text: "«تركيبي — Syntactic — خاص بالتركيب أو بنظم الكلام»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          conflict: "المصطلح راسخ في اللسانيات بمعنى نحوي/تركيبي ولا علاقة له بالبنائية الفنية"
        - text: "«تركيبي — Synthetic — اللغات التركيبية هي اللغات الصرفية مثل اللاتينية»"
