# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — قُرئ الملف المُقنَّع أولاً (بدون لمّات)
  # التعريف من الملف المُقنَّع: "شخص يقدم اقتراحاً أو فكرة للنقاش"
  blind_candidates:
    - lemma: "مُقْتَرِح"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر قرح على وزن مُفْتَعِل (Form VIII) — اسم فاعل من اقترح/يقترح.
        الوزن مُفْتَعِل للأسماء الفاعلة من الأفعال الثلاثية المزيدة بالاتخاذ والاستنباط؛
        يدل اقتراح في أصله اللغوي (ابن فارس) على استنباط شيء عن غير سماع، وهو يلائم
        مفهوم "من يطرح فكرة أو رأياً ابتداءً".

    - lemma: "طَارِح"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من طرح/يطرح (Form I) على وزن فاعِل. يُستخدم في العربية تعبيرُ "طرح فكرة"
        أو "طرح اقتراحاً" للدلالة على عرض الرأي للنقاش؛ فطَارِح هو من يطرح الأفكار للمناقشة.
        يُعزَّز هذا بوروده في المعجم الكبير بمعنى المحاور والمبادل.

    - lemma: "مُشِير"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من أشار/يشير (Form IV) على وزن مُفْعِل. في العربية "أشار بكذا" تعني
        اقترح وأوصى به؛ فالمُشِير هو من يُبدي رأياً ويُوصي به. وجاء في المصادر: "الناصح
        غيره بفعل أمر ما". يُفيد معنى الاقتراح المبني على الإشارة والتوجيه.

    - lemma: "بَاذِر"
      generation_method: majaz
      justification: >
        إزاحة دلالية من البذر (زرع البذور) إلى بذر الأفكار. في الأصل اللغوي: بذر الشيء
        يبذره = نثره وفرّقه (ابن فارس). المجاز: من يلقي الأفكار والمقترحات ويذرها للنقاش،
        كما يُذرّ الزارع البذور في الأرض. استحياء للفظ العربي التراثي في دلالة جديدة.

  # ب. التقييم الأولي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة وحيدة (مُقْتَرِح) دون تشكيل كامل — يلزم إضافة الضبط"
      - "التعريف العربي الحالي قريب من الترجمة الحرفية للتعريف الإنجليزي، ويحتاج تحريراً بأسلوب المعجم الوسيط"
      - "غياب أمثلة استعمالية للمجموعة أو المعنى"
      - "الكشف عن مرادفات إضافية ضئيل — الاقتصار على لمّة واحدة يُضعف الشبكة الدلالية"
    observations: >
      المجموعة تمثّل مفهوماً إنسانياً وظيفياً واضحاً: الشخص الذي يُقدِّم اقتراحاً أو فكرة
      للنقاش. اللمّة الموجودة مُقْتَرِح مشتقة من الجذر الثلاثي قرح على وزن Form VIII
      (اسم فاعل مُفْتَعِل)، وهي صياغة شفّافة ومعيارية في العربية المعاصرة. الجذر قرح
      عند ابن فارس له أصل "استنباط الشيء" مما يُعزّز الدلالة. المجموعة الأم
      (awn4-10403515-n) تمثّل "المُبْتَكِر والمُنْشِئ"، وهي أشمل من المُقْتَرِح الذي
      يقتصر على تقديم الاقتراح دون اشتراط التنفيذ. العلاقة المنطقية صحيحة (تضمين).


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  queries_run:
    - "Batch headword lookup: مقترح، المقترح، طارح، الطارح، مشير، المشير، باذر، الباذر"
    - "English bridge: suggester, proposer, proponent, advocate"
    - "Arabic FTS: اقتراح، مقترح، يقترح، طرح فكرة"
    - "Enrichment by entry_id: 53856, 944750, 60353, 710386"
    - "Maqayis (dict_id=151): قرح، شور، طرح، بذر"

  per_lemma:

    - lemma: "مُقْتَرِح"
      confirm:
        - text: "«(1) المقترِح؛ مقدِّم الاقتراح  (2) النصير؛ المؤيد للقضيّة.»"
          source: "المورد الحديث (2008) — ترجمة proponent"
        - text: "«اقترح الشيء: استنبطه عن غير سماع»"
          source: "مقاييس اللغة لابن فارس — مادة قرح (الأصل الثالث: القريحة)"
        - text: "«(1) يقترح  (2) يُوحي بـ  (3) ينمّ عن...  (4) يخطُر بالبال»"
          source: "المورد الحديث (2008) — ترجمة suggest"
        - text: "«(1) الاقتراح: تقديم الاقتراحات  (2) اقتراح؛ مُقْتَرَح؛ عَرْض»"
          source: "المورد الحديث (2008) — ترجمة proposal"
      expands:
        - text: "«اقتراح: عرض فكرة على سبيل مساعدة أحد المتحاورين وجعله يتبع سلوكاً معيناً»"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يُحدد السياق التداولي للاقتراح: ليس مجرد رأي بل توجيه لسلوك المُخاطَب"
        - text: "«اقتراح، مُقترَح: فكرة تُقدَّم على سبيل المساهمة في حل مشكلة أو تطوير عمل أو غير ذلك بأسلوب لا يوحي بفرضها على المُخاطَب بها»"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم"
          addition: "يكشف الطابع الاختياري غير الإلزامي في الاقتراح"

    - lemma: "طَارِح"
      contradicts:
        - text: "«طارَحَ فلانٌ فلاناً الحديثَ ونحوَه، وبه: حاوَرَه وبادَلَه»"
          source: "المعجم الكبير"
          conflict: >
            طارَحَ (Form III = فاعَل) يدل على المحاورة المتبادلة بين طرفين، لا على تقديم
            اقتراح ابتداءً من طرف واحد؛ فهو مشارك في النقاش لا مُبادِر بالاقتراح.
        - text: "«eliminant» / «subtracter»"
          source: "المعجم الطبي الموحد (2009) — ترجمة طارِح"
          conflict: >
            المصطلح الطبي طارِح يعني العامل المُزيل/الطارح في المعادلات، وهو مفهوم رياضي
            مختلف تماماً عن "مُقدِّم الاقتراح".

    - lemma: "مُشِير"
      contradicts:
        - text: "«أعلى رتبةٍ عَسْكَرِيَّةٍ في الجيشِ، وهى فوقَ رتبة الفريق أوَّل»"
          source: "المعجم الكبير"
          conflict: >
            الاستخدام المعاصر الغالب لمُشِير هو اللقب العسكري (Field Marshal)، مما يُحدث
            اشتراكاً لفظياً خطيراً يجعل استخدامه في سياق "مُقدِّم الاقتراح" ملتبساً.
        - text: "«متعلق بما يعطي أية إشارة. عنصر لغوي...» — indicator"
          source: "مسرد الإعلام والتواصل — ترجمة indicator"
          conflict: "المُشِير في علوم الاتصال = المؤشر/المسرّد، لا مُقدِّم الاقتراح."
      expands:
        - text: "«من (ش و ر) من يومئ بيده أو نحوها إلى غيره معبراً عن معنى من المعاني، والناصح غيره بفعل أمرما»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            المعنى التراثي للمُشِير يشمل "الناصح" وهو أقرب إلى المستشار لا المُقترِح؛
            الاقتراح فعل ابتداء، والنصيحة فعل توجيه — دلالتان متمايزتان.

    - lemma: "بَاذِر"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "مُقْتَرِح"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة صرفياً ومعجمياً: اسم فاعل من اقترح (Form VIII) على وزن مُفْتَعِل،
        والجذر قرح له أصل في "الاستنباط والإبداع" عند ابن فارس مما يُعمّق المناسبة الدلالية.
        المورد الحديث يُترجم proponent بـ"المقترِح؛ مقدِّم الاقتراح" تأكيداً صريحاً.
        اللمّة معيارية في العربية المعاصرة ومتداولة في الخطاب الرسمي والإعلامي.
        تحتاج إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      substitution_test: >
        يمكن الاستبدال بـ"صاحب الاقتراح" أو "مُقدِّم الاقتراح" في السياق، غير أن مُقْتَرِح
        هي الكلمة المُفردة المسكوكة والأوجز التي تحمل المعنى بلا إضافة. اختبار السكّ ناجح.
      term_quality_gate:
        ittiraad: "مطّرد — اقترح/مقترح/اقتراح سلسلة اشتقاقية منتظمة"
        yusr: "يسير التداول — مقطعه مألوف ومنسجم"
        mulaama: "ملائم — يحمل دلالة الاقتراح والابتداء"
        turathi: "مُؤثَر — مشتق من جذر عربي عريق (قرح)"
        arabi: "عربي خالص — لا اقتراض فيه"
        ishtiqaaqiyya: "مشتق بانتظام من Form VIII"
      morphological_fit: >
        وزن مُفْتَعِل مناسب لأسماء الفاعل من الأفعال الثلاثية المزيدة بالاتخاذ؛ يُفيد معنى
        السعي والتكلّف في تقديم الاقتراح.
      nuance_differentiation: >
        مُقْتَرِح يختص بمن يُبادر بصياغة اقتراح أو فكرة وتقديمها للنقاش الجماعي، وهو
        أخصّ من مُبَادِر (الذي يبدأ عملاً) ومن مُشِير (الذي يُوصي بعمل ما)؛ إذ يتضمن
        عنصرَي الصياغة المُحدَّدة والعرض على الآخرين.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقْتَرِح"

    - lemma: "طَارِح"
      source: stage1
      decision: removed
      decision_reason: >
        طارَحَ (Form III) يعني المحاورة والمبادلة بين طرفين لا تقديم اقتراح ابتداءً؛ فهو
        يدل على الفعل الثنائي لا الفعل الأحادي. علاوة على ذلك، يحمل طَارِح في المعجم
        الطبي المعاصر دلالة "عامل الطرح/المُزيل" مما يُوقع في اشتراك لفظي. لا يصح
        استخدامه مرادفاً لمُقْتَرِح.

    - lemma: "مُشِير"
      source: stage1
      decision: removed
      decision_reason: >
        يحمل مُشِير في العربية المعاصرة دلالة الرتبة العسكرية (Field Marshal) بصورة غالبة،
        مما يُوقع في اشتراك لفظي. معناه التراثي "الناصح" يُقرّبه من المستشار لا المُقترِح.
        وفي علوم الاتصال يعني "المؤشر/indicator". التعدد الدلالي الحادّ يُخرجه من التنافس.

    - lemma: "بَاذِر"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي لاستخدام بَاذِر بمعنى "مُقدِّم الاقتراح". الجذر بذر
        يدل على النثر والتبذير، والمجاز المقترح (بذر الأفكار) غير مُستقرّ في المعجم
        العربي ولا مُتداوَل في النصوص. يخفق في اختبار التثبيت المعجمي.


