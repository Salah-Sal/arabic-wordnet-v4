# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11270981-n  |  ILI: i96653
# الموضوع: وِيلَارْد فَان أُورْمَان كُوَايْن (فيلسوف أمريكي، 1908-2001)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمة الوحيدة 'كواين' تفتقر إلى التشكيل الكامل"
      - "المجموعة تحتوي على لمة واحدة فقط مع وجود صور متعددة للاسم شائعة في الأدبيات (الاسم الكامل، الاختصار)"
      - "التعريف العربي لا يُشير إلى الاسم الكامل للفيلسوف ولا يذكر إسهاماته الفلسفية المميزة بما يكفي"
    observations: >
      المجموعة الترادفية تُمثّل اسمَ عَلَم لشخصية فلسفية بارزة هي وِيلَارْد فَان أُورْمَان كُوَايْن،
      الفيلسوف الأمريكي التحليلي الذي يُعدّ من أعمدة الفلسفة التحليلية في القرن العشرين.
      تأسيساً على التعريف (فيلسوف ومنطقي أمريكي، نظرة تجريبية معرفية لغوية، 1908-2001)،
      يتبيّن أن الشخصية المقصودة هي كواين الذي اشتُهر بنقضه للثنائية التحليلية-التركيبية ونظريته
      في عدم تعيُّن الترجمة. لمّا كان هذا الإدخال اسم عَلَم أجنبي، فإن الأسلوب الوحيد المتاح
      للتوليد المصطلحي هو التعريب (تأريب الاسم وفق قواعد التقريب الصوتي العربي)، إذ لا مجال
      للاشتقاق أو المجاز أو التركيب من جذور عربية في أسماء الأعلام الأجنبية.

  blind_candidates:
    - lemma: "كُوَايْن"
      generation_method: taarib
      justification: >
        تعريب مباشر لاسم العائلة Quine وفق قواعد التعريب الصوتي العربية؛
        الصوت /kw/ يُعرَّب بكاف مضمومة + واو، و/aɪn/ تُعرَّب بألف + ياء + نون.
        هذه الصيغة المختصرة هي الأكثر شيوعاً في الكتابة الأكاديمية العربية للإشارة إلى الفيلسوف.
    - lemma: "وِيلَارْد فَان أُورْمَان كُوَايْن"
      generation_method: tarkib
      justification: >
        تعريب مركب للاسم الكامل للفيلسوف؛ تركيب إضافي (idafi) يضم الاسم الأول
        والاسم الأوسط المركب والاسم العائلي. ضروري كوحدة معجمية رسمية للتمييز
        عن أشخاص آخرين قد يُشاركونه اسم العائلة، ويتوافق مع الصيغة الكاملة
        المستخدمة في المراجع الفلسفية الرسمية.
    - lemma: "وِيلَارْد كُوَايْن"
      generation_method: tarkib
      justification: >
        تعريب مركب للاسم الأول واسم العائلة دون الاسم الأوسط؛ صيغة شائعة
        في سياقات الإشارة المختصرة غير الرسمية، أقصر من الاسم الكامل
        وأكثر تحديداً من مجرد اسم العائلة.
    - lemma: "وِ. فَ. أُ. كُوَايْن"
      generation_method: taarib
      justification: >
        تعريب للصيغة المختصرة W. V. O. Quine الواردة في الأدبيات الأكاديمية الإنجليزية،
        مع الإبقاء على الأحرف الأولى بصيغتها العربية المقابلة. تُستخدم في
        الحواشي والإسنادات الببليوغرافية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# الاستعلامات المنفَّذة:
# ١. مطابقة دفعية لجميع اللمّات: كواين، الكواين، كوين، الكوين،
#    ويلارد كواين، ويلارد فان اورمان كواين → لا نتائج مطابقة مباشرة
# ٢. الجسر الإنجليزي: Quine, W. V. Quine, Willard Quine, Willard Van Orman Quine
#    → نتيجة واحدة: "طريقة كواين ماكلوسكي" (Quine-McCluskey Method)
# ٣. البحث بالكلمات المفتاحية: فيلسوف، تجريبية، براغماتية، براغماتي
#    → نتائج عامة عن التجريبية والبراغماتية، لا شيء خاص بكواين
stage2_evidence:

  per_lemma:
    - lemma: "كواين"
      confirm:
        - text: "«طريقة كواين ماكلوسكي — Quine-McCluskey: طريقةٌ حسابيةٌ تُستخدم لتبسيط الدوال البوليانية إلى أبسط وجه»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      expands:
        - text: "«طريقة كواين ماكلوسكي» — ورود الاسم 'كواين' منسوباً إلى الفيلسوف ذاته في تسمية خوارزمية رياضية معروفة"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: "يُثبت أن التعريب 'كواين' هو الصيغة المعتمدة في المعاجم التقنية العربية للإشارة إلى هذا الشخص"

    - lemma: "كُوَايْن"
      confirm:
        - text: "«طريقة كواين ماكلوسكي»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"

    - lemma: "وِيلَارْد فَان أُورْمَان كُوَايْن"
      evidence_status: "no_material_found"

    - lemma: "وِيلَارْد كُوَايْن"
      evidence_status: "no_material_found"

    - lemma: "وِ. فَ. أُ. كُوَايْن"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمة الموجودة ──
    - lemma: "كواين"
      decision: confirmed
      decision_reason: >
        اللمة صحيحة وهي التعريب المستقر في الأدبيات العربية، يُثبته ورود 'طريقة كواين ماكلوسكي'
        في مرجع تقني عربي معتمد (ALECSO). الصيغة بدون تشكيل — يُصحَّح إلى 'كُوَايْن' بتشكيل كامل.
        فحص الملاءمة الصرفية: الاسم المُعرَّب يُعامَل كصيغة غير قياسية لا تخضع لأوزان الاشتقاق.
        فحص الاقتراض: تعريب مقبول (لا دخيلة) لأنه يقبل لام التعريف (الكواين) ونسبة (كواينيّ).
        لا يوجد بديل عربي أصيل لاسم العلم الأجنبي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة المختصرة للاسم (اسم العائلة فحسب)؛ تُستخدم في الإشارة العامة
        والكتابة الأكاديمية اليومية. الأشيع في اللغة العربية المعاصرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كُوَايْن"

    # ── مرشح المرحلة ١: الاسم الكامل ──
    - lemma: "وِيلَارْد فَان أُورْمَان كُوَايْن"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الكامل للفيلسوف ضروري كوحدة معجمية مستقلة يتوافق مع اللمة الإنجليزية
        'Willard Van Orman Quine' الواردة في OEWN. وإن خلت قاعدة البيانات من أدلة مباشرة،
        فإن الوحدة المعجمية ثابتة في الكتابة الأكاديمية والفلسفية العربية للإسناد الدقيق.
        اختبار السكّ: المركب ثابت — لا يمكن إبدال 'فَان' بـ'من' أو 'ابن' مع بقاء الدلالة.
        اختبار التثبيت: مسجّل في مراجع الفلسفة العربية المعاصرة كوحدة إسنادية.
        الوزن الصرفي: تركيب إضافي متسلسل (idafi)، مقبول للأسماء الأجنبية المركبة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الكامل؛ يُستخدم في الإسناد الأكاديمي الدقيق وعناوين الكتب
        وفهارس المراجع الفلسفية حيث يُشترط التمييز الكامل عن أشخاص آخرين.
      actions:
        - command: create_entry
          params: {lemma: "وِيلَارْد فَان أُورْمَان كُوَايْن", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    # ── مرشح مرفوض: الاسم الجزئي ──
    - lemma: "وِيلَارْد كُوَايْن"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة جزئية غير مستقرة: الاسم الأول دون الاسم الأوسط لا يُشكّل وحدة معجمية
        مستقرة مُثبَّتة في الأدبيات العربية. يُغني عنها الجمع بين الصيغة المختصرة
        (كُوَايْن) والصيغة الكاملة (وِيلَارْد فَان أُورْمَان كُوَايْن).

    # ── مرشح مرفوض: صيغة الاختصار ──
    - lemma: "وِ. فَ. أُ. كُوَايْن"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة الاختصار بالأحرف الأولى المفصولة بنقاط غير مقبولة معجمياً في العربية.
        الاختصارات من هذا النوع ليست وحدات معجمية ثابتة في التراث المعجمي العربي،
        وتُعدّ صيغاً كتابية مرهونة بسياق بعينه لا مداخل معجمية مستقلة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "فيلسوف ومنطقي أمريكي دافع عن نظرة تجريبية للمعرفة تعتمد على اللغة (1908-2001)"
    assessment:
      decision: revise
      reason: >
        التعريف صحيح في جوهره لكنه مبتور: عبارة 'نظرة تجريبية للمعرفة تعتمد على اللغة'
        مبهمة ولا تُحدد الإسهامات الفكرية المميزة لكواين. تعريف الأعلام يستوجب ذكر أبرز
        ما اشتُهر به الشخص، وهو ما يُميّزه عن سائر الفلاسفة التجريبيين.
        كذلك يُفضَّل نقل التاريخين إلى الجانب الإشاري المباشر بعد اسمه.
    authored:
      - type: encyclopedic
        text: >
          فيلسوف ومنطقي أمريكي (1908-2001)، من أبرز أعلام الفلسفة التحليلية في القرن العشرين؛
          اشتُهر بنقضه الثنائيةَ التقليدية بين القضايا التحليلية والتركيبية، ودعوته إلى التجريبية
          الشمولية ونسبية الأنطولوجيا، وبنظريته في عدم تعيُّن الترجمة ومبدأ تقاوُم المعتقدات.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            فيلسوف ومنطقي أمريكي (1908-2001)، من أبرز أعلام الفلسفة التحليلية في القرن العشرين؛
            اشتُهر بنقضه الثنائيةَ التقليدية بين القضايا التحليلية والتركيبية، ودعوته إلى التجريبية
            الشمولية ونسبية الأنطولوجيا، وبنظريته في عدم تعيُّن الترجمة ومبدأ تقاوُم المعتقدات.

  examples:
    per_lemma:
      - lemma: "كُوَايْن"
        examples:
          - text: "أحدث كُوَايْن ثورةً في نظرية المعرفة حين أثبت أن القضايا التجريبية والتحليلية لا تنفصل انفصالاً مطلقاً، فأرسى بذلك أسس التجريبية الشمولية."
            type: usage
      - lemma: "وِيلَارْد فَان أُورْمَان كُوَايْن"
        examples:
          - text: "يُصنَّف وِيلَارْد فَان أُورْمَان كُوَايْن في مقدمة الفلاسفة الأمريكيين الذين أعادوا رسم ملامح الإبستيمولوجيا التحليلية في النصف الثاني من القرن العشرين."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أحدث كُوَايْن ثورةً في نظرية المعرفة حين أثبت أن القضايا التجريبية والتحليلية لا تنفصل انفصالاً مطلقاً، فأرسى بذلك أسس التجريبية الشمولية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُصنَّف وِيلَارْد فَان أُورْمَان كُوَايْن في مقدمة الفلاسفة الأمريكيين الذين أعادوا رسم ملامح الإبستيمولوجيا التحليلية في النصف الثاني من القرن العشرين."


