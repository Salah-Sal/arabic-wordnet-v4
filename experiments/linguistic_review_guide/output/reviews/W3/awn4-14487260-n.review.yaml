# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14487260-n (fatigue — مواد)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «إجهاد» تعني في الاصطلاح الهندسي stress لا fatigue؛ والتعريف نفسه يميّز بينهما: «حالة ضعف ناتجة عن إجهاد طويل»"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي، يبدأ بـ«يستخدم» وهو أسلوب غير معجمي"
      - "اللمّتان بدون تشكيل"
    observations: >
      المجموعة تصف مفهوم الكَلال في علم المواد (material fatigue)، وهو ضعف تدريجي يصيب
      المعادن والمواد نتيجة تكرار الأحمال. المصطلح العربي الراسخ في المعاجم الموحدة هو «كَلال»
      (من كَلَّ يَكِلُّ كَلالاً). أما «إجهاد» فيقابل stress وليس fatigue، والفرق بينهما جوهري:
      الإجهاد هو السبب (القوة المطبقة) والكلال هو النتيجة (الضعف الناشئ عن تكرارها).
  blind_candidates:
    - lemma: "كَلَال"
      generation_method: ishtiqaq
      justification: "مصدر كَلَّ يَكِلُّ على وزن فَعَال، يدل على ذهاب الحدة والضعف التدريجي، مناسب لوصف ضعف المواد"
    - lemma: "وَهَن"
      generation_method: ishtiqaq
      justification: "مصدر وَهَنَ يَهِنُ، يدل على الضعف العام، قد يصلح لوصف ضعف المواد"
    - lemma: "تَعَب"
      generation_method: ishtiqaq
      justification: "مصدر تَعِبَ، يُستخدم في بعض المعاجم التقنية مرادفاً لـfatigue في سياق المواد"
    - lemma: "إِنْهَاك"
      generation_method: ishtiqaq
      justification: "مصدر أَنْهَكَ (إفعال)، يدل على الإبلاغ في الإضعاف والاستهلاك، قريب من مفهوم إنهاك المواد"


stage2_evidence:
  per_lemma:
    - lemma: "إِجْهَاد"
      contradicts:
        - text: "«إجهاد — stress: حاصل تقسيم القوة على المساحة التي تؤثر فيها من عنصر إنشائي»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "إجهاد يقابل stress لا fatigue، فهو السبب لا النتيجة"
        - text: "«إجهاد — strain / intensity of strain / stress»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          conflict: "جميع الترجمات الإنجليزية تشير إلى stress/strain لا fatigue"
        - text: "«كما يمكن أن يحدث إجهاد تدريجي في المواضع الحزية أو المشقوقة بفعل عمليات الشد المفرطة المستمرة أو المتناوبة باستمرار، ومن ثم يصل الأمر إلى تمزّق ألياف المواد، وهو ما يؤدي إلى حدوث الكسر بالكلال»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
          conflict: "النص يميّز صراحةً بين الإجهاد (stress) والكلال (fatigue): الإجهاد يؤدي إلى الكلال"
      expands:
        - text: "«انحراف كبير عن الظروف المثلى للحياة، الذي ينتج تغييرات وردود فعل على جميع المستويات الوظيفية للكائن الحي»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
          addition: "في السياق البيئي والبيولوجي يُستخدم إجهاد بمعنى stress أيضاً"

    - lemma: "كَلَال"
      confirm:
        - text: "«كلال (المواد) — fatigue (of materials)»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«كَلال — fatigue: ظاهرة قد يؤدي فيها تعّرض مُكوّنٍ ما لزيادة أو تقليل التحميل عليه إلى إضعافه ورُبما تعطّله عن العمل»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«كَلال المعدن — metal fatigue»"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
        - text: "«كَلَل — fatigue: انخفاض قيمة حمل انهيار عنصر إنشائي بسبب تكرار تغير نوع الإجهاد مما يؤدي إلى انهيار العنصر تحت حمل أقل بكثير من الحمل الذي يمكن أن يتحمله تحت شروط تحميل ثابتة. تَعَب (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
      expands:
        - text: "«كلال حراري — thermal fatigue»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "كلال مصطلح منتج يدخل في تركيبات اصطلاحية متعددة في مجال المواد"
        - text: "«كسر بالكلال — fatigue failure: هو كسر بالجسم بدون أية تاثيرات تُذكر تحدث من خارجه...»"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
          addition: "تعريف مفصّل لكسر الكلال يؤكد أن الكلال ظاهرة ضعف تدريجي تنتهي بالكسر"

    - lemma: "وَهَن"
      confirm:
        - text: "«الوَهْنُ: الضَّعْفُ في العَمَلِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الضَّعف وذبول الحيوِيَّة»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الوَاوُ وَالْهَاءُ وَالنُّونُ: كَلِمَتَانِ تَدُلُّ إِحْدَاهُمَا عَلَى ضَعْفٍ، وَالْأُخْرَى عَلَى زَمَانٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "وهن ضعف عام في الخِلقة أو الخُلُق، ليس مصطلحاً مادياً ولا يدل على الضعف الناتج عن تكرار الأحمال"

    - lemma: "تَعَب"
      confirm:
        - text: "«التعب المعدني — metal fatigue»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«تَعَبُ الفِلِزّ [أسنان] — metal fatigue»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«تعب — fatigue»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992)"
          conflict: "تعب يُستخدم أساساً للإعياء البشري والبيولوجي، واستعماله للمواد أقل رسوخاً من كلال"

    - lemma: "إِنْهَاك"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "إِجْهَاد"
      decision: removed
      decision_reason: >
        «إجهاد» يقابل في الاصطلاح الهندسي المعياري مفهوم stress (القوة المؤثرة على وحدة
        المساحة)، لا fatigue (الضعف الناتج عن تكرار الأحمال). والتعريف نفسه يؤكد هذا التمييز:
        «حالة ضعف ناتجة عن إجهاد طويل» — فالإجهاد هو السبب والكلال هو المسبَّب.
        جميع المعاجم الموحدة (هندسة مدنية، مياه، فيزياء، نفط) تترجم إجهاد بـstress وكلال بـfatigue.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كَلَال"
      decision: confirmed
      decision_reason: >
        كلال هو المصطلح العربي المعياري المقابل لـfatigue في علم المواد، مُثبَت في عدة
        معاجم موحدة (كيمياء، طاقة متجددة، نفط، هندسة مدنية، فيزياء). وهو مصدر كَلَّ يَكِلُّ
        (ذهاب الحدة والقوة) على وزن فَعَال، مناسب صرفياً ودلالياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح التقني الدقيق لظاهرة الضعف التدريجي في المواد الناتج عن تكرار الأحمال"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَلَال"

    # ── مرشحات المرحلة ١ ──
    - lemma: "وَهَن"
      source: stage1
      decision: removed
      decision_reason: >
        وَهَن يدل على ضعف عام في الخِلقة أو الحيوية، وليس مصطلحاً تقنياً في علم المواد.
        لا يحمل دلالة التدريجية والتكرار التي يتضمنها مفهوم fatigue.

    - lemma: "تَعَب"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وجود «التعب المعدني» و«تعب الفلز» في بعض المعاجم، فإن «تعب» يُستخدم
        أساساً للإعياء البشري والبيولوجي. المعاجم الموحدة التقنية (كيمياء، نفط، فيزياء،
        طاقة متجددة) تفضّل «كلال» على «تعب» لمفهوم fatigue المادي. إضافته ستُحدث
        تداخلاً مع مجموعات ترادفية أخرى تصف التعب البشري.

    - lemma: "إِنْهَاك"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد أدلة معجمية على استخدام «إنهاك» في سياق المواد. المصطلح مقصور على
        الاستعمال البيولوجي والعسكري (إنهاك الجسم، حرب الإنهاك).


stage4_content:
  definition:
    current: "يستخدم للمواد (خاصة المعادن) في حالة ضعف ناتجة عن إجهاد طويل"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي بأسلوب غير معجمي (يبدأ بـ«يستخدم»)،
        ولا يوضّح طبيعة الظاهرة الفيزيائية. يحتاج إعادة صياغة بأسلوب المعجم الوسيط مع
        بيان الجنس القريب والفصل النوعي.
    authored:
      - type: terminological
        text: "ضَعْفٌ بِنْيَوِيٌّ تَدْريجِيٌّ يُصيبُ المَوادَّ ولا سِيَّما المَعادِنَ نَتيجةَ تَعَرُّضِها لأَحْمالٍ مُتَكرِّرَةٍ أو إِجْهادٍ مُسْتَمِرٍّ، قد يُفْضي إلى تَشَقُّقِها وانْهِيارِها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "ضَعْفٌ بِنْيَوِيٌّ تَدْريجِيٌّ يُصيبُ المَوادَّ ولا سِيَّما المَعادِنَ نَتيجةَ تَعَرُّضِها لأَحْمالٍ مُتَكرِّرَةٍ أو إِجْهادٍ مُسْتَمِرٍّ، قد يُفْضي إلى تَشَقُّقِها وانْهِيارِها"

  examples:
    per_lemma:
      - lemma: "كَلَال"
        examples:
          - text: "أظهرت الفحوصات أنّ كَلال المعدن في جناح الطائرة هو السبب الرئيس للحادثة"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أظهرت الفحوصات أنّ كَلال المعدن في جناح الطائرة هو السبب الرئيس للحادثة"


