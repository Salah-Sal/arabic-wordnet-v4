# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11186050-n  |  ILI: i96170  |  POS: n
# الموضوع: هِيرَام مَكْسِيم — مخترع بريطاني أمريكي المولد (1840-1916)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مكسيم، هيرام مكسيم) مكتوبتان بدون تشكيل"
      - "الاسم الرسمي الكامل 'Sir Hiram Stevens Maxim' الوارد في OEWN غائب عن المجموعة"
      - "التعريف الحالي يستخدم الأقواس والأرقام بأسلوب غير معجمي نظيف"
    observations: >
      المجموعة تمثّل اسم علم لشخص تاريخي بعينه (Hiram Maxim، 1840-1916م)، وهو المخترع
      الأمريكي المولد البريطاني الجنسية الذي اشتُهر بمدفع مكسيم الرشّاش.
      بما أن المفهوم اسم علم أجنبي، فإن جميع اللمّات الممكنة تعريباتٌ لأشكال مختلفة من
      اسمه الرسمي؛ لا سبيل إلى الاشتقاق أو المجاز هنا. اللمّتان الحاليتان مناسبتان لكنهما
      تفتقران إلى التشكيل، كما يُستحسن إضافة الشكل الرسمي الكامل المُلقَّب بـ"Sir".

  blind_candidates:
    - lemma: "مَكْسِيم"
      generation_method: taarib
      justification: >
        تعريب اللقب الأخير Maxim؛ هو الشكل الأكثر تداولاً في العربية للإشارة إلى
        هذا الشخص وإلى مدفعه الرشّاش الشهير. يقبل لام التعريف (المَكْسِيم) والنسبة
        (مَكْسِيمِيّ) والجمع السالم.
    - lemma: "هِيرَام مَكْسِيم"
      generation_method: taarib
      justification: >
        تعريب الاسم الثنائي (الاسم الأول + اللقب)؛ أكثر تحديداً من اللقب المجرد
        ويُزيل الالتباس مع كلمة 'maxim' بمعنى حكمة/قاعدة كما تُثبت المعاجم.
    - lemma: "سِير هِيرَام سْتِيفِنْز مَكْسِيم"
      generation_method: taarib
      justification: >
        تعريب الاسم الرسمي الكامل كما يرد في المصادر الإنجليزية "Sir Hiram Stevens
        Maxim"، مع الاحتفاظ باللقب الفخري البريطاني 'Sir'. هذا الشكل وارد في OEWN
        ومغيَّب عن المجموعة.
    - lemma: "هِيرَام سْتِيفِنْز مَكْسِيم"
      generation_method: taarib
      justification: >
        تعريب الاسم الثلاثي الكامل (الاسم الأول + اسم الوسط + اللقب) دون اللقب
        الفخري 'Sir'. يُحيل على الاسم الكامل في وثائق الميلاد والسجلات المدنية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استُخلصت الأدلة بثلاثة استعلامات:
#   ١. المطابقة الدقيقة الدُّفعية (headword_norm) — لم تُسفر عن نتائج
#   ٢. الجسر الإنجليزي (translation_en: Hiram Maxim / Maxim / Maxim gun) —
#      أعطى نتائج لكلمة maxim بمعنى حكمة/مبدأ (false positives)، لا صلة بالشخص
#   ٣. البحث بالكلمات المفتاحية (مكسيم، مدفع مكسيم، هيرام) — لا نتائج
stage2_evidence:
  per_lemma:
    - lemma: "مَكْسِيم"
      evidence_status: "no_material_found"
    - lemma: "هِيرَام مَكْسِيم"
      evidence_status: "no_material_found"
    - lemma: "سِير هِيرَام سْتِيفِنْز مَكْسِيم"
      evidence_status: "no_material_found"
    - lemma: "هِيرَام سْتِيفِنْز مَكْسِيم"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── مَكْسِيم (موجودة — تحتاج تشكيلاً) ──
    - lemma: "مكسيم"
      decision: confirmed
      decision_reason: >
        اللقب المعرَّب المختصر هو الشكل الأشيع في العربية للإشارة إلى هذا المخترع
        وإلى مدفعه الرشّاش؛ لا تعارض معجمي. يحتاج تشكيلاً كاملاً: مَكْسِيم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المختصر وحده؛ يُستخدم في السياقات العلمية والتاريخية المختصرة
        وفي تسمية مدفعه الشهير (مدفع مَكْسِيم). أقل رسمية من الاسم الثنائي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَكْسِيم"

    # ── هِيرَام مَكْسِيم (موجودة — تحتاج تشكيلاً) ──
    - lemma: "هيرام مكسيم"
      decision: confirmed
      decision_reason: >
        الاسم الثنائي (الاسم الأول + اللقب) يُعيّن الشخص بدقة أكبر من اللقب المجرد،
        ويُزيل الالتباس مع كلمة 'maxim' (قاعدة/حكمة). يحتاج تشكيلاً كاملاً: هِيرَام مَكْسِيم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الثنائي يُعيّن الشخص بوضوح، ويُستخدم في الكتابة الأكاديمية والتاريخية
        عند الحاجة إلى التمييز عن الاستخدامات الأخرى لكلمة مَكْسِيم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِيرَام مَكْسِيم"

    # ── سِير هِيرَام سْتِيفِنْز مَكْسِيم (مرشح المرحلة ١ — مؤكَّد) ──
    - lemma: "سِير هِيرَام سْتِيفِنْز مَكْسِيم"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل موجود في OEWN (Sir Hiram Stevens Maxim) وغائب عن المجموعة؛
        إضافته تُكمّل التغطية الترادفية وتُتيح البحث بالشكل الموسوعي الرسمي. لا تعارض
        لغوي: 'Sir' لقب بريطاني مُعرَّب، و'سْتِيفِنْز' اسم وسط معيَّن.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الكامل مع اللقب الفخري 'Sir' واسم الوسط 'Stevens'؛
        يُستخدم في الموسوعات والمراجع الأكاديمية والنصوص الرسمية.
      actions:
        - command: create_entry
          params: {lemma: "سِير هِيرَام سْتِيفِنْز مَكْسِيم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    # ── هِيرَام سْتِيفِنْز مَكْسِيم (مرشح المرحلة ١ — مرفوض) ──
    - lemma: "هِيرَام سْتِيفِنْز مَكْسِيم"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الثلاثي دون اللقب الفخري 'Sir' لا يُضيف قيمةً ترادفية حقيقية؛
        الشكل الأكثر تداولاً هو الثنائي (هِيرَام مَكْسِيم)، والشكل الرسمي هو
        الاسم مع 'Sir' (سِير هِيرَام سْتِيفِنْز مَكْسِيم) الذي تُثبته OEWN.
        هذا الشكل الوسيط لا يُثبته مصدر ولا يملأ ثغرةً ترادفية.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "مخترع إنجليزي (ولد في الولايات المتحدة) اخترع مدفع مكسيم الذي استخدم في الحرب العالمية الأولى (1840-1916)"
    assessment:
      decision: revise
      reason: >
        التعريف وظيفي لكنه يستخدم الأقواس والتواريخ بأسلوب غير معجمي نظيف؛
        يصف الجنسية بـ"إنجليزي" بينما وُلد في الولايات المتحدة وتجنَّس بريطانياً،
        مما يستلزم الدقة. يفتقر إلى ذكر سنة الاختراع وطبيعة الأثر التاريخي.
    authored:
      - type: encyclopedic
        text: >
          هِيرَام سْتِيفِنْز مَكْسِيم (1840-1916م): مخترعٌ أمريكيُّ المولد، اتَّخذ
          بريطانيا وطناً فتجنَّس بجنسيتها. اشتُهر باختراعه المدفعَ الرشّاش ذاتيَّ
          التلقيم (مدفع مَكْسِيم) عام 1884م، وهو أول مدفع رشّاش يعمل بطاقة الارتداد
          في التاريخ؛ استُخدم على نطاق واسع في الحرب العالمية الأولى وأحدث ثورةً في
          تكتيكات الحرب البرية. خُلِع عليه لقب الفروسية البريطاني 'Sir' تقديراً
          لإسهاماته العلمية.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            هِيرَام سْتِيفِنْز مَكْسِيم (1840-1916م): مخترعٌ أمريكيُّ المولد، اتَّخذ
            بريطانيا وطناً فتجنَّس بجنسيتها. اشتُهر باختراعه المدفعَ الرشّاش ذاتيَّ
            التلقيم (مدفع مَكْسِيم) عام 1884م، وهو أول مدفع رشّاش يعمل بطاقة الارتداد
            في التاريخ؛ استُخدم على نطاق واسع في الحرب العالمية الأولى وأحدث ثورةً في
            تكتيكات الحرب البرية. خُلِع عليه لقب الفروسية البريطاني 'Sir' تقديراً
            لإسهاماته العلمية.

  examples:
    per_lemma:
      - lemma: "مَكْسِيم"
        examples:
          - text: "غيَّر مدفعُ مَكْسِيم وجهَ الحرب البرية حين أتاح لفصيلة صغيرة أن تُطلق من النيران ما كان يستلزم كتيبةً بأسرها."
            type: usage
      - lemma: "هِيرَام مَكْسِيم"
        examples:
          - text: "طوَّر هِيرَام مَكْسِيم مدفعه الرشّاش في لندن عام 1884م مستعيناً بمبدأ الارتداد لتلقيم الذخيرة آلياً."
            type: usage
      - lemma: "سِير هِيرَام سْتِيفِنْز مَكْسِيم"
        examples:
          - text: "حاز سِير هِيرَام سْتِيفِنْز مَكْسِيم الجنسيةَ البريطانية عام 1900م وخُلِع عليه لقبُ الفروسية تقديراً لاختراعاته العسكرية."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "غيَّر مدفعُ مَكْسِيم وجهَ الحرب البرية حين أتاح لفصيلة صغيرة أن تُطلق من النيران ما كان يستلزم كتيبةً بأسرها."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "طوَّر هِيرَام مَكْسِيم مدفعه الرشّاش في لندن عام 1884م مستعيناً بمبدأ الارتداد لتلقيم الذخيرة آلياً."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "حاز سِير هِيرَام سْتِيفِنْز مَكْسِيم الجنسيةَ البريطانية عام 1900م وخُلِع عليه لقبُ الفروسية تقديراً لاختراعاته العسكرية."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
stage5_enrichment:
  per_entry:
    # جميع اللمّات أسماء أعلام أجنبية معرَّبة — لا جذر عربي ولا اقتباس مقاييس
    - lemma: "مَكْسِيم"
      entry_id: "{auto}"
      # root: لا ينطبق — اسم علم أجنبي معرَّب
    - lemma: "هِيرَام مَكْسِيم"
      entry_id: "{auto}"
      # roots: لا تنطبق — مركب من اسمَين أجنبيَّين معرَّبَين
    - lemma: "سِير هِيرَام سْتِيفِنْز مَكْسِيم"
      entry_id: "{auto}"
      # roots: لا تنطبق — مركب من أجزاء أجنبية معرَّبة

  per_sense:
    - lemma: "مَكْسِيم"
      sense_id: "{auto}"
      nuance: "اللقب المختصر وحده؛ الأكثر شيوعاً في النصوص العربية المختصرة وفي تسمية المدفع الرشّاش (مدفع مَكْسِيم)؛ أقل رسمية من الاسمين الآخرين"
    - lemma: "هِيرَام مَكْسِيم"
      sense_id: "{auto}"
      nuance: "الاسم الثنائي يُعيّن الشخص بوضوح ويُزيل الالتباس مع معنى 'maxim' (حكمة/قاعدة)؛ مستخدَم في الكتابة الأكاديمية والتاريخية"
      mwe: true
    - lemma: "سِير هِيرَام سْتِيفِنْز مَكْسِيم"
      sense_id: "{auto}"
      nuance: "الاسم الرسمي الكامل مع اللقب الفخري 'Sir' واسم الوسط 'Stevens'؛ يُستخدم في الموسوعات والمراجع الأكاديمية والوثائق الرسمية"
      mwe: true

  synset:
    cultural_fit: omission

  actions:
    # مدخل مَكْسِيم — تعريب مفرد
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"note":"اسم علم أجنبي معرَّب — لا جذر عربي ولا مقاييس لغة"}'
    # مدخل هِيرَام مَكْسِيم — تعريب مركب
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"note":"اسم علم أجنبي مركب معرَّب — لا جذر عربي ولا مقاييس لغة","mwe":true}'
    # مدخل سِير هِيرَام سْتِيفِنْز مَكْسِيم — تعريب مركب رسمي
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"note":"اسم علم أجنبي مركب رسمي معرَّب — لا جذر عربي ولا مقاييس لغة","mwe":true}'
    # معنى مَكْسِيم
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"اللقب المختصر وحده؛ الأكثر شيوعاً وفي تسمية المدفع الرشّاش","mwe":false}'
    # معنى هِيرَام مَكْسِيم
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الثنائي يُعيّن الشخص ويُزيل الالتباس مع maxim بمعنى حكمة","mwe":true}'
    # معنى سِير هِيرَام سْتِيفِنْز مَكْسِيم
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الرسمي الكامل مع اللقب الفخري Sir واسم الوسط Stevens؛ للموسوعات والمراجع الرسمية","mwe":true}'
    # المجموعة الترادفية
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"omission"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.72
