# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13970825-n
# proper or designated social situation — وضع اجتماعي مناسب أو محدد
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مقام، منزلة) بلا تشكيل — يجب إضافة التشكيل الكامل"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي ولا يتسم بأسلوب المعجم العربي"
      - "المجموعة تفتقر إلى لمّة مَكَانَة وهي من أقرب المرادفات لهذا المفهوم"
    observations: "المجموعة تعبّر عن مفهوم الموضع الاجتماعي اللائق أو المحدد للفرد في المجتمع، وهو مفهوم عربي أصيل غزير التعبير المعجمي. الأصل الهرمي (awn4-13970595-n: الموقع في تسلسل هرمي اجتماعي) يؤكد أن المقصود مرتبة معيّنة ضمن السُّلَّم الاجتماعي لا مجرد وصف عام. اللمّتان الحاليتان صحيحتان دلالياً لكنهما تحتاجان تشكيلاً وإثراءً بمرادفات إضافية."
  blind_candidates:
    - lemma: "مَكَانَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (ك و ن) على وزن مَفْعَلَة، تدل على المنزلة ورفعة الشأن، وهي من أشهر ألفاظ الوضع الاجتماعي في العربية الفصحى المعاصرة"
    - lemma: "حَظْوَة"
      generation_method: ishtiqaq
      justification: "من الجذر (ح ظ و) على وزن فَعْلَة، تدل على المكانة والمنزلة لدى ذي سلطان ونحوه، وهي لفظة تراثية فصيحة"
    - lemma: "جَاه"
      generation_method: majaz
      justification: "لفظة عربية تدل على القَدْر والمنزلة والمقام الرفيع في المجتمع، استُعملت مجازاً للوضع الاجتماعي المحدد"
    - lemma: "مَحَلّ"
      generation_method: majaz
      justification: "من الجذر (ح ل ل) بمعنى الموضع الذي يحلّ فيه المرء، امتدت دلالته مجازياً إلى الوضع الاعتباري والمنزلة"

stage2_evidence:
  per_lemma:
    - lemma: "مَقَام"
      confirm:
        - text: "«(الْمقَام) مَوضِع الْقَدَمَيْنِ والمجلس وَالْجَمَاعَة من النَّاس»"
          source: "المعجم الوسيط"
        - text: "«جاهٌ؛ مقام رفيع؛ مكانة سامية» و«يفوقه مقامًا A colonel ranks a captain»"
          source: "المورد الحديث"
        - text: "«المقام: على صيغة اسم الظرف عند السالكين هو الوصف الذي يثبت على العبد ويقيم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«المقام: ما تحقق العبد بمنازلته من الآداب. وشرطه عند القوم أن لا ينتقل للثاني حتى يستوفي أحكام الأول»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "دلالة صوفية خاصة على المرتبة الروحية المكتسبة"
        - text: "«المَقَامُ: بالفتح، ومقامات الناس، بالفتح، مجالسهم، الواحد مقام ومقامة»"
          source: "معجم البلدان لياقوت الحموي"
          addition: "توسيع إلى المجلس والمنزل"

    - lemma: "مَنْزِلَة"
      confirm:
        - text: "«الدارُ المكانة والمرتبة»"
          source: "المعجم الوسيط"
        - text: "«(الْمنزلَة) الدَّار والمكانة والمرتبة (ج) منَازِل يُقَال لَهُ منزلَة عِنْد الْأَمِير مكانة وَهُوَ رفيع الْمنَازل الْمَرَاتِب»"
          source: "المعجم الوسيط (هوراماني)"
        - text: "«مكانة؛ منزلة؛ مرتبة a lawyer of high standing»"
          source: "المورد الحديث (standing)"

    - lemma: "مَكَانَة"
      confirm:
        - text: "«المنزلة ورفعة الشأن»"
          source: "المعجم الوسيط"
        - text: "«(المكانة) الْمنزلَة ورفعة الشَّأْن والتؤدة»"
          source: "المعجم الوسيط (هوراماني)"
      expands:
        - text: "«﴿قُلْ يَا قَوْمِ اعْمَلُوا عَلَى مَكَانَتِكُمْ﴾»"
          source: "القرآن الكريم (الأنعام ١٣٥)"
          addition: "شاهد قرآني يدل على الحال والمنزلة التي يكون عليها المرء"

    - lemma: "حَظْوَة"
      confirm:
        - text: "«المَكانةُ والمَنْزِلَةُ لَدَى ذِي سُلْطَانٍ ونحوِه»"
          source: "المعجم الكبير"
        - text: "«الحُظْوَةُ، بالضم والكسر، والحِظَةُ، كعِدَةٍ: المكانَةُ، والحَظُّ من الرِّزْق»"
          source: "القاموس المحيط للفيروزآبادي"
      contradicts:
        - text: "«حَظْوة — المعنى: مكانة — الصواب والرتبة: هو ذو حَظْوة [فصيحة] — هو ذو حُظْوة [فصيحة] — هو ذو حِظْوة [فصيحة مهملة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "الدلالة مقيّدة بالمكانة لدى ذي سلطان تحديداً، لا الوضع الاجتماعي العام"

    - lemma: "جَاه"
      evidence_status: "no_material_found"

    - lemma: "مَحَلّ"
      confirm:
        - text: "«مصدر ميمى المكان الذي يحلّ فيه محلّ الإعراب (في النحو): ما يستحقه اللفظ الواقع فيه من الإعراب لو كان معرباً»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«المَحْلُ: الجَدبُ، وانقطاع المطر ويُبْس الأرض من الكلأ»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأساسية للمَحَلّ مكانية حسّية (موضع الحلول/النزول) لا اجتماعية، ولا يُستعمل بمعنى المنزلة الاجتماعية استعمالاً معجمياً ثابتاً"

stage3_analysis:
