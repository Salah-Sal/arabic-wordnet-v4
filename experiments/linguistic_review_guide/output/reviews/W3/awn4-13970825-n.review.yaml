      decision_reason: "ثابتة في المعجم الوسيط بمعنى المكانة والمرتبة صراحةً، ومثال «له منزلة عند الأمير» يطابق مفهوم المجموعة. يحتاج المدخل إلى إضافة التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
