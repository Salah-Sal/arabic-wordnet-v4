      nuance_differentiation: "تدل على الدرجة والمرتبة في سُلَّم الشرف، وتُستعمل كثيراً مقرونةً بمضاف إليه يبيّن صاحب الحكم (منزلة عند الأمير، منزلة في قومه)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنْزِلَة"

    - lemma: "مَكَانَة"
      source: stage1
      decision: confirmed
      decision_reason: "مؤكدة في المعجم الوسيط بمعنى «المنزلة ورفعة الشأن» وبشاهد قرآني. هي من أكثر ألفاظ الوضع الاجتماعي شيوعاً في العربية المعاصرة، وتُكمل المجموعة بلفظة تؤكد رفعة الشأن."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على المنزلة مع إيحاء برفعة الشأن والتقدير، وتُستعمل في السياقات الرسمية والأكاديمية أكثر من أخواتها"
      actions:
        - command: create_entry
          params:
            lemma: "مَكَانَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حَظْوَة"
      source: stage1
      decision: removed
      decision_reason: "دلالتها مقيّدة بالمكانة لدى ذي سلطان ونحوه تحديداً (كما في المعجم الكبير)، وليست وضعاً اجتماعياً عاماً مناسباً أو محدداً. الفرق الدلالي كبير: الحظوة مكانة مكتسبة عند شخص بعينه، لا مرتبة اجتماعية معيّنة."
      evidence_assessment:
        case: mixed

    - lemma: "جَاه"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية كافية في القاعدة، وهي تدل على القَدْر والعظمة والنفوذ أكثر من دلالتها على وضع اجتماعي محدد أو مناسب. الجاه يُكتسب ولا يُعيَّن."
      evidence_assessment:
        case: no_material

    - lemma: "مَحَلّ"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الأساسية مكانية حسّية (موضع الحلول) أو نحوية (محلّ الإعراب)، ولا يُستعمل في المعاجم العربية بمعنى المنزلة الاجتماعية استعمالاً ثابتاً. الاشتراك اللفظي مع المَحْل (الجدب) يزيد الإشكال."
      evidence_assessment:
        case: contradicts_only

