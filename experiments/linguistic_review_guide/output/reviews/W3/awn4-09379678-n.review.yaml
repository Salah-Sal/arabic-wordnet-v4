stage1_review:
  assessment:
    concerns:
      - "اللمّة الحالية تفتقر إلى التشكيل الكامل."
      - "التعريف الحالي مقتضب جداً ويحتاج إلى صياغة معجمية أكثر دقة."
    observations: "المجموعة تتعلق بمَعلم جغرافي محدد (خليج موبيل). المصطلح العربي يتكون من تركيب إضافي يجمع بين كلمة 'خليج' والاسم المعرب 'موبيل'."
  blind_candidates:
    - lemma: "خَلِيجُ مُوبِيل"
      generation_method: tarkib
      justification: "التركيب الإضافي القياسي لتسمية الخلجان في العربية (النوع + الاسم)."
    - lemma: "جَوْنُ مُوبِيل"
      generation_method: tarkib
      justification: "استخدام 'جون' كبديل لـ 'خليج' في حالة المصبات الأصغر أو الأكثر انغلاقاً."
    - lemma: "مُوبِيل"
      generation_method: taarib
      justification: "اسم العلم الذي قد يُستخدم منفرداً للدلالة على الخليج في السياق الجغرافي."
    - lemma: "خَلِيجُ نَهْرِ مُوبِيل"
      generation_method: tarkib
      justification: "تسمية وصفية تشير إلى النهر الذي يغذي الخليج."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيجُ مُوبِيل"
      evidence_status: "no_material_found"
    - lemma: "خَلِيج"
      confirm:
        - text: "«الْخَلِيجُ: وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ.»"
          source: "مقاييس اللغة"
        - text: "«(الخليج): الجانب من البحر أو النهر يمتد في البر.»"
          source: "المعجم الوسيط"
    - lemma: "مُوبِيل"
      confirm:
        - text: "«وقد ابتكرت هذه الطريقة شركة موبيل في بداية سبعينيات القرن العشرين.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
          addition: "يؤكد تعريب الاسم 'موبيل' (Mobile) في السياقات التقنية."

stage3_analysis:
  per_lemma:
    - lemma: "خليج موبيل"
      decision: confirmed
      decision_reason: "هو الاسم الجغرافي القياسي والمعتمد لهذا المعلم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ مُوبِيل"
    - lemma: "جَوْنُ مُوبِيل"
      source: stage1
      decision: removed
      decision_reason: "كلمة 'خليج' هي الأكثر شيوعاً ودقة لوصف هذا المسطح المائي الكبير نسبياً."
    - lemma: "مُوبِيل"
      source: stage1
      decision: removed
      decision_reason: "الكلمة بمفردها تشير غالباً إلى المدينة أو النهر أو الشركة، وليست اسماً معجمياً مستقلاً للخليج."
    - lemma: "خَلِيجُ نَهْرِ مُوبِيل"
      source: stage1
      decision: removed
      decision_reason: "تسمية وصفية مطولة غير مسكوكة."

stage4_content:
  definition:
    current: "خليج من خليج المكسيك؛ يغذيه نهر موبيل"
    assessment:
      decision: revise
      reason: "التعريف الحالي يفتقر إلى السياق الجغرافي المحدد (الولاية) والأسلوب المعجمي المتين."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ بَحْرِيٌّ يَقَعُ فِي الجَنُوبِ الغَرْبِيِّ لِوِلَايَةِ أَلَابَامَا الأَمْرِيكِيَّةِ، يُعَدُّ جُزْءاً مِن خَلِيجِ المَكْسِيكِ، وَتَصُبُّ فِيهِ مِيَاهُ نَهْرِ مُوبِيل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09379678-n"
          definition_index: 0
          text: "خَلِيجٌ بَحْرِيٌّ يَقَعُ فِي الجَنُوبِ الغَرْبِيِّ لِوِلَايَةِ أَلَابَامَا الأَمْرِيكِيَّةِ، يُعَدُّ جُزْءاً مِن خَلِيجِ المَكْسِيكِ، وَتَصُبُّ فِيهِ مِيَاهُ نَهْرِ مُوبِيل."
  examples:
    per_lemma:
      - lemma: "خَلِيجُ مُوبِيل"
        examples:
          - text: "يُعَدُّ خَلِيجُ مُوبِيل رَابِعَ أَكْبَرِ مَصَبَّاتِ الأَنْهَارِ فِي الوِلَايَاتِ المُتَّحِدَةِ مِن حَيْثُ تَدَفُّقُ المِيَاهِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-09379678-n"
          text: "يُعَدُّ خَلِيجُ مُوبِيل رَابِعَ أَكْبَرِ مَصَبَّاتِ الأَنْهَارِ فِي الوِلَايَاتِ المُتَّحِدَةِ مِن حَيْثُ تَدَفُّقُ المِيَاهِ."

