# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'صانع خيام' خالية من التشكيل الكامل"
      - "اللمّة مركب إضافي وصفي، في حين تمتلك العربية لفظًا مفردًا مشتقًا (خَيَّام) أكثر إيجازًا وتثبيتًا معجميًا في كبريات المعاجم الحديثة"
      - "المجموعة تفتقر إلى اللمّة المفردة 'خَيَّام' الموثقة في المعجم الكبير والمعجم الوسيط والمورد الحديث بالدلالة ذاتها"
    observations: "المجموعة تُعرِّف حرفيًا تقليديًا متجذرًا في الثقافة العربية البدوية. الجذر خ-ي-م غني اشتقاقيًا، ووزن فَعَّال قياسي للدلالة على الاحتراف بالحرفة. اللمّة الموجودة 'صانع خيام' صحيحة دلاليًا لكنها تعبير وصفي مركب يُغني عنه اللفظ المشتق الموروث 'خَيَّام'. يُلاحظ أن المعاجم الحديثة تُورد 'الخيميّ' بمعنى مرادف، وأن لقب 'الخيّام' دليل على التثبيت التاريخي لهذا اللفظ."
  blind_candidates:
    - lemma: "خَيَّامٌ"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر خ-ي-م على وزن فَعَّال الدال على الاحتراف المتمكن في حرفة ما (كنجّار وحدّاد وخيّاط)، يدل على من اتخذ صنع الخيام مهنةً راسخة. جرت العادة تسمية هذا الحرفي بـ'الخيّام' في الثقافة العربية كما يشهد لقب عمر الخيام."
    - lemma: "خَيَّاطُ الخِيَامِ"
      generation_method: tarkib
      justification: "مركب إضافي من 'خيّاط' (وزن فعّال من خ-ي-ط للحرفي الخائط) مع تخصيص بـ'الخيام'، يُفصّل نوع الخياطة ويميز المتخصص في الخيام عن خيّاط الملابس."
    - lemma: "مُصْلِحُ الخِيَامِ"
      generation_method: tarkib
      justification: "مركب إضافي من اسم الفاعل 'مُصلِح' مضافًا إلى 'الخيام'، يُبرز الجانب التصليحي الذي يؤديه هذا الحرفي بجانب الصنع."
    - lemma: "نَسَّاجُ الخِيَامِ"
      generation_method: tarkib
      justification: "مركب إضافي من 'نسّاج' (وزن فعّال من ن-س-ج) مع 'الخيام'؛ إذ كانت الخيام البدوية تُنسج من الصوف والشعر والقطن، فيكون النسّاج المتخصص حرفيَّ الخيام الأصيل."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت (5 استعلامات):
# ١. مطابقة دقيقة دفعية — صانع خيام + خيام + خياط + نساج + مرشحات
# ٢. جسر إنجليزي — tentmaker / tent maker / tent / awning maker
# ٣. إثراء بالمعرّف — entry_ids للخيّام (8485,85810,85834,872508,722772)
# ٤. بحث FTS عربي — خيام + خيمة + خيمي + صانع الخيام
# ٥. مقاييس اللغة — جذر خيم + صنع (dictionary_id=151)
stage2_evidence:
  per_lemma:

    - lemma: "صانع خيام"
      expands:
        - text: "«صانِعُ الخِيامِ»"
          source: "المعجم الكبير"
          addition: "العبارة ذاتها تُستخدم في المعجم الكبير تعريفًا لـ'الخيّام'، مما يثبت صحة الدلالة بوصفها وصفًا وظيفيًا لا مصطلحًا مستقلاً"
        - text: "«الخَيّام: صانعُ الخِيام.»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد أن الصورة الاصطلاحية الفصيحة للمفهوم هي 'الخيّام'، وأن 'صانع الخيام' تفسير له وليس مصطلحًا في حد ذاته"

    - lemma: "خَيَّامٌ"
      confirm:
        - text: "«صانِعُ الخِيامِ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«صانِعُ الخيامِ. لقبٌ لأكْثَرَ من واحِدٍ، من أشْهَرِهم: أبو الفَتْح عُمَرُ الخَيَّام»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«الخَيّام: صانعُ الخِيام.» — [translation_en: tentmaker]"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الخيميّ»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: "يُشير إلى أن 'الخيميّ' مرادف أو صيغة بديلة لـ'الخيّام' في بعض المعاجم"
        - text: "«(الْخيام) الخيمي»"
          source: "المعجم الوسيط (الهوراماني)"
          addition: "يؤكد وجود صيغة 'الخيمي' بوصفها مرادفًا، مما يُثري دلالة المجموعة"

    - lemma: "خَيَّاطُ الخِيَامِ"
      expands:
        - text: "«من حرفته الخياطة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: "يُعرِّف 'الخيّاط' بالمعنى العام (خيّاط الملابس والأقمشة) من جذر خ-ي-ط، لا من جذر خ-ي-م"

    - lemma: "مُصْلِحُ الخِيَامِ"
      evidence_status: "no_material_found"

    - lemma: "نَسَّاجُ الخِيَامِ"
      expands:
        - text: "«نَسَّاج: حائك الثياب»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُعرِّف النسّاج بالمعنى العام (حائك الثياب) لا بالتخصص في الخيام؛ المركب 'نساج الخيام' غير مثبت"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "صانع خيام"
      decision: confirmed
      decision_reason: "المركب الإضافي صحيح دلاليًا ومدعوم بأدلة غير مباشرة (استُخدم تعريفًا لـ'الخيّام' في معاجم كبرى). يُحتفظ به لأنه يصف المفهوم بصراحة ويُعين القارئ غير المتخصص، مع إضافة اللمّة المفردة الأكثر إيجازًا. يحتاج إلى تشكيل كامل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُبرز فعل الصنع الوظيفي بصورة صريحة ويشمل الصنع والإصلاح معًا؛ يُستخدم في السياق الوصفي والتعليمي دون أن يُلمح بالضرورة إلى الاحتراف الدائم"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَانِعُ خِيَامٍ"

    - lemma: "خَيَّامٌ"
      source: stage1
      decision: confirmed
      decision_reason: "موثق في المعجم الكبير (مرتين) والمعجم الوسيط والمورد الحديث بمعنى 'صانع الخيام' مع ترجمة إنجليزية tentmaker مطابقة. وزن فَعَّال قياسي للحرفة؛ اللفظ مفرد موجز ومتثبت معجميًا. اجتاز اختبار السكّ: لا يمكن إبدال أحد مكوّناته بمرادف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل بوزن فَعَّال على الاحتراف الدائم والتخصص الراسخ في صنع الخيام؛ يُميَّز به الحرفي المُتقِن الذي اتخذ الخيامة مهنةً عن من يصنع خيمة أو يُصلحها مرةً واحدة"
      actions:
        - command: create_entry
          params:
            lemma: "خَيَّامٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "خَيَّاطُ الخِيَامِ"
      source: stage1
      decision: removed
      decision_reason: "المركب غير مثبت كوحدة معجمية. 'الخيّاط' مشتق من جذر خ-ي-ط (خياطة الملابس) لا من خ-ي-م (الخيام)، مما يولّد لبسًا جذريًا. فضلاً عن ذلك، يفشل اختبار الاستبدال: يمكن إبدال 'خيّاط' بـ'صانع' أو 'ناسج' مع بقاء المعنى صحيحًا → ليس مصطلحًا مسكوكًا."

    - lemma: "مُصْلِحُ الخِيَامِ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على تثبيته كمصطلح. اسم الفاعل الوصفي يركز على الإصلاح وحده ويُغفل الصنع، مما يُخل بالتعريف الجامع للمجموعة. يفشل اختبار الاستبدال أيضًا."

    - lemma: "نَسَّاجُ الخِيَامِ"
      source: stage1
      decision: removed
      decision_reason: "النسّاج حرفي النسيج العام (حائك الثياب)، والمركب ليس وحدة معجمية مثبتة. حتى لو كانت الخيام تُنسج، فإن 'نسّاج الخيام' لا يشمل مراحل التصميم والتجميع والإصلاح التي يقوم بها الخيّام."


