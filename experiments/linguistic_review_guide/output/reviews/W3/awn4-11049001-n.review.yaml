# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11049001-n | ILI: i95417 | POS: n
# المراجع: نظام المراجعة الآلية | التاريخ: 2026-03-21
