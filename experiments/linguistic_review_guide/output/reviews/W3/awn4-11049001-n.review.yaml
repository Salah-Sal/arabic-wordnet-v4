# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التشكيل غائب كليًّا عن اللمّتين الموجودتين (جيمس هارغريفز، هارغريفز)"
      - "التعريف يحتوي على تعريب خام '(سبينينج جيني)' بدل المصطلح العربي المعتمد 'المِغزل الجيني' الموثق في المعاجم التقنية"
      - "صنف الكلمة مسجَّل n (اسم) وهو قبول معيار وردنت للأعلام، لكن يستحق الإشارة إلى طبيعة الاسم العلم"
      - "اللمّتان تفتقران إلى التمييز الدلالي الموثّق في البيانات الوصفية (nuance)"
    observations: >
      المجموعة تخصّ شخصية تاريخية إنجليزية هي جيمس هارغريفز (1720-1778)، مخترع آلة المِغزل الجيني
      التي أسهمت في الثورة الصناعية البريطانية. كلتا اللمّتين تعريبٌ صوتي للاسم الأجنبي:
      الأولى (جيمس هارغريفز) الاسم الكامل، والثانية (هارغريفز) الاسم العائلي المنفرد.
      لم يُعثر على توثيق معجمي عربي لأيٍّ منهما في قاعدة البيانات — وهو أمرٌ متوقع لكون الاسم
      علمًا أعجميًا. أهمّ ما يستدعي التدخّل هو تشكيل اللمّتين وتصويب التعريف باستبدال
      التعريب الخام بالمصطلح التقني المعتمد «المِغزل الجيني».

  blind_candidates:
    - lemma: "هَارْغرِيفْز"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم العائلي Hargreaves وفق الصوتيات الإنجليزية؛ الصيغة الأشيع في
        الكتابة العربية الحديثة للإشارة إلى هذا المخترع في المصادر العلمية والموسوعية.
        الزاي في النهاية تعريب لـ -ves الإنجليزية.

    - lemma: "جِيمْس هَارْغرِيفْز"
      generation_method: taarib
      justification: >
        الاسم الكامل المعرَّب يجمع الاسم الأول (جيمس) والعائلي (هارغريفز)،
        يُستخدم في السياقات الرسمية وعند الإشارة الأولى في النصوص الأكاديمية والموسوعية.

    - lemma: "هَارْغرِيفْس"
      generation_method: taarib
      justification: >
        تعريب بديل للاسم ينهي الصوت الأخير بالسين عوضًا عن الزاي، تقليدٌ كتابي موجود
        في بعض المراجع العربية التي تعتمد النطق البريطاني الشمالي للاسم.

    - lemma: "جِيمْس هَارْغرِيفْس"
      generation_method: taarib
      justification: >
        النسخة الكاملة من المرشح السابق، تجمع الاسم الأول والعائلي بصيغة السين البديلة.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# استعلامات منفّذة: 3
#   ١) مطابقة دقيقة دفعية لجميع اللمّات والمرشحات (نتيجة: لا مطابقة)
#   ٢) جسر إنجليزي لـ Hargreaves / James Hargreaves / spinning jenny
#      → وجد: المغزل الجيني (entry_id=719122) في المورد الحديث — يخصّ الآلة لا الشخص
#   ٣) بحث FTS بمفتاحَي "غزل" و"هارغريفز"
#      → وجد: خلية هارغريفز (entry_id=555244) في المعجم الطبي — تعريب لشخص آخر (Hargraves الطبي)
stage2_evidence:
  per_lemma:

    - lemma: "جيمس هارغريفز"
      evidence_status: "no_material_found"

    - lemma: "هارغريفز"
      contradicts:
        - text: >
            «خَلِيَّةُ هَارْغرِيفْز (خلية الذِّئْبَةِ الحُمَامِيَّة)»
            translation_en: "Hargrave's cell (LE cell)"
          source: "المعجم الطبي الموحد (2009)"
          conflict: >
            هذا المدخل يعريّب «Hargraves» الطبيب الأمريكي (Malcolm Hargraves) واصف خلية
            الذئبة الحمامية، لا «Hargreaves» المخترع الإنجليزي للمغزل الجيني —
            الشخصان مختلفتان رغم تشابه الاسم.

    - lemma: "هَارْغرِيفْز"
      evidence_status: "no_material_found"

    - lemma: "جِيمْس هَارْغرِيفْز"
      evidence_status: "no_material_found"

    - lemma: "هَارْغرِيفْس"
      evidence_status: "no_material_found"

    - lemma: "جِيمْس هَارْغرِيفْس"
      evidence_status: "no_material_found"

  auxiliary_findings:
    - note: >
        وُجد في المورد الحديث (entry_id=719122) مدخل «المِغْزَلة؛ المِغْزَل الجَيْنيّ: ماكينة غَزْلٍ قديمة»
        بترجمة إنجليزية "spinning jenny" — هذا يوثّق المصطلح العربي للآلة التي اخترعها هارغريفز،
        ويُستخدم لتصويب التعريف في المرحلة ٤.


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "جيمس هارغريفز"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المعتمد للمخترع في المصادر العربية؛ يُغطّي الاستخدام الرسمي
        والموسوعي عند الذكر الأول. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل (الاسم الأول + العائلي)؛ يُستخدم عند التعريف الأول بالشخص
        وفي السياقات الأكاديمية الرسمية، ولا يقبل الحذف دون غموض في المقام الأول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِيمْس هَارْغرِيفْز"

    - lemma: "هارغريفز"
      decision: confirmed
      decision_reason: >
        الاسم العائلي المنفرد يمثّل الاستخدام الاختصاري الشائع في الإشارات المتكررة
        والسياقات العلمية المختصرة؛ مبرَّر في المعاجم الموسوعية كصيغة إضافية.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم العائلي وحده؛ يُستخدم بعد التعريف الأول أو في الحواشي والإشارات المختصرة
        حيث يُفهم المقصود من السياق. أقصر وأكثر مرونةً من الاسم الكامل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَارْغرِيفْز"

    - lemma: "هَارْغرِيفْز"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة (هارغريفز) بعد التشكيل — لا يضيف لمّة جديدة مستقلة،
        بل يعكس التصحيح المقترح للمّة الموجودة عبر update_lemma.

    - lemma: "جِيمْس هَارْغرِيفْز"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة (جيمس هارغريفز) بعد التشكيل — تعالجه عملية update_lemma
        على اللمّة الحالية دون الحاجة إلى إنشاء مدخل جديد.

    - lemma: "هَارْغرِيفْس"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بديلة بالسين بدل الزاي — غير معيارية في تعريب الأسماء الإنجليزية المنتهية بـ -ves؛
        الزاي أدقّ صوتيًّا ونظام التعريب العربي يفضّلها. لا أدلة معجمية تدعم صيغة السين.

    - lemma: "جِيمْس هَارْغرِيفْس"
      source: stage1
      decision: removed
      decision_reason: >
        نفس سبب رفض المرشح السابق؛ إضافةً إلى كونه مركّبًا من مكوّنَين مرفوضَين.


