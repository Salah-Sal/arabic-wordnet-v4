# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13952369-n (short account)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «حساب بيع على المكشوف» عبارة وصفية طويلة من خمس كلمات، تقترب من كونها تعريفاً مصغّراً لا مصطلحاً مسكوكاً"
      - "اللمّة خالية من التشكيل"
      - "المجموعة الترادفية تحتوي على لمّة واحدة فقط، ولا بديل أقصر أو أكثر تداولاً"
      - "المفهوم مالي تخصّصي (حساب وساطة لعمليات البيع على المكشوف) وقد لا يكون له مصطلح عربي مفرد ثابت"
    observations: >
      التعريف يصف حساباً مالياً خاصاً بعمليات البيع على المكشوف، وهو مفهوم حديث في الأسواق المالية.
      المصطلح الإنجليزي «short account» مختصر من كلمتين، بينما المقابل العربي يتطلب تركيباً إضافياً أطول.
      «البيع على المكشوف» مصطلح مالي عربي راسخ في المعاجم المتخصصة، فالتحدّي يكمن في إيجاد صيغة مختصرة للحساب المرتبط به.
      يُلاحظ أنّ «حساب مكشوف» مصطلح مستقلّ يعني «الحساب المدين/المسحوب على المكشوف» في الاستعمال المصرفي العام، مما قد يولّد لبساً.
  blind_candidates:
    - lemma: "حِسَابُ الْبَيْعِ عَلَى الْمَكْشُوفِ"
      generation_method: tarkib
      justification: "تركيب إضافي يجمع «حساب» مضافاً إلى المصطلح المالي الراسخ «البيع على المكشوف»، وهو الصيغة الأكثر دقّة ووضوحاً في التعبير عن المفهوم"
    - lemma: "حِسَابٌ مَكْشُوفٌ"
      generation_method: tarkib
      justification: "تركيب وصفي مختصر على نمط «short account»، وقد ورد في بعض المعاجم المتخصصة بمعنى «bear account»، لكنّه يتداخل مع مفهوم «الحساب المدين» في الاستعمال المصرفي العام"
    - lemma: "حِسَابُ الْمُكَاشَفَةِ"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر «كشف» على وزن مُفاعَلة، يوحي بالكشف والمجاهرة في العملية المالية، لكنّه غير مأنوس في الاستعمال المالي"
    - lemma: "حِسَابُ الْكَشْفِ"
      generation_method: tarkib
      justification: "تركيب إضافي مختصر من «حساب» و«الكشف» (المصدر)، أقصر من الصيغة الكاملة لكنّه قد يلتبس بمعنى «كشف الحساب» (account statement)"

stage2_evidence:
  per_lemma:
    - lemma: "حِسَابُ بَيْعٍ عَلَى الْمَكْشُوفِ"
      evidence_status: "no_material_found"

    - lemma: "حِسَابُ الْبَيْعِ عَلَى الْمَكْشُوفِ"
      evidence_status: "no_material_found"

    - lemma: "حِسَابٌ مَكْشُوفٌ"
      confirm:
        - text: "«حساب مكشوف — bear account»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "«حساب مكشوف: حساب مَدين ويكون عندما يَسحب المُودِعُ من المصرف مبلغًا أكبر من المبلغ المتوفّر في حسابه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "في الاستعمال العام يعني الحساب المدين (overdraft) لا حساب البيع على المكشوف"

    - lemma: "حِسَابُ الْمُكَاشَفَةِ"
      evidence_status: "no_material_found"

    - lemma: "حِسَابُ الْكَشْفِ"
      evidence_status: "no_material_found"

    # ── أدلة مساندة للمكوّنات ──
    - lemma: "(مكوّن) بَيْعٌ عَلَى الْمَكْشُوفِ"
      confirm:
        - text: "«بيع على المكشوف — short sale»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«بيع على المكشوف — bear sale»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«بيع على المكشوف: (قص) بيع سندات أو أسهم تكون مُقترَضة من شخص قبل الربح ويُدفع ثمنُها بعد هبوط السعر»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«على المكشوف: جهرًا»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "الأصل اللغوي للتعبير «على المكشوف» يعني الجهر والعلانية، ثمّ نُقل مجازاً إلى المجال المالي"

    - lemma: "(مكوّن) حِسَاب"
      confirm:
        - text: "«حِسَابٌ — علاقة تعاقدية رسمية تم إنشاؤها لتوفير خدمات مصرفية أو وساطة» (من التصنيف الأعلى awn4-13952070-n)"
          source: "الشبكة الدلالية العربية AWN4"

stage3_analysis:
  per_lemma:
    - lemma: "حِسَابُ بَيْعٍ عَلَى الْمَكْشُوفِ"
      decision: confirmed
      decision_reason: >
        اللمّة الموجودة تعبّر عن المفهوم بدقة وتستند إلى المصطلح المالي الراسخ «بيع على المكشوف».
        وإن كانت طويلة (خمس كلمات)، فإنّ طبيعة المفهوم المالي المركّب تبرّر ذلك، ولا يوجد بديل
        مفرد أقصر خالٍ من الالتباس. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الصيغة الوصفية الكاملة التي تحدّد طبيعة الحساب بربطه صراحة بعملية البيع على المكشوف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِسَابُ بَيْعٍ عَلَى الْمَكْشُوفِ"

    - lemma: "حِسَابُ الْبَيْعِ عَلَى الْمَكْشُوفِ"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة معرّفة بالألف واللام من نفس التركيب الموجود. الفرق بين «حساب بيعٍ» (نكرة) و«حساب البيعِ» (معرفة)
        طفيف في الاستعمال المصطلحي، والاحتفاظ بالصيغتين معاً يُثقل المجموعة دون فائدة تمييزية.
        اللمّة الأصلية بصيغة النكرة أنسب للمدخل المعجمي.
      evidence_assessment:
        case: no_material

    - lemma: "حِسَابٌ مَكْشُوفٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود «حساب مكشوف» في المعجم الموحّد بمعنى «bear account»، فإنّ الاستعمال السائد
        في المصرفية العربية يخصّه بمعنى «الحساب المدين/المسحوب على المكشوف» (overdraft)، وهو
        مفهوم مختلف تماماً عن حساب البيع على المكشوف. الالتباس الدلالي يجعله غير صالح لهذه المجموعة.
      evidence_assessment:
        case: mixed

    - lemma: "حِسَابُ الْمُكَاشَفَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية تدعم هذا التركيب في المجال المالي. المُكاشفة تعني الإفضاء والمجاهرة،
        وليس لها علاقة اصطلاحية بالبيع على المكشوف. تركيب مصنوع لا سند له.
      evidence_assessment:
        case: no_material

    - lemma: "حِسَابُ الْكَشْفِ"
      source: stage1
      decision: removed
      decision_reason: >
        يلتبس مباشرة مع «كشف الحساب» (account statement) وهو مفهوم مصرفي شائع جداً.
        لا يوجد دليل على استعماله بمعنى «short account» في أيّ مصدر.
      evidence_assessment:
        case: no_material

