# مراجعة المجموعة الترادفية — awn4-14026652-n (homeostasis)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الثانية «توازن داخلي» تعبير وصفي حرّ وليس مصطلحاً مسكوكاً؛ يمكن إبدال «داخلي» بـ«ذاتي» أو «عضوي» ويبقى المعنى العام صالحاً، مما يفشل اختبار السكّ"
      - "التعريف العربي ترجمة شبه حرفية للتعريف الإنجليزي؛ يحتاج إعادة صياغة بأسلوب المعجم الوسيط"
    observations: "المفهوم (homeostasis) مفهوم فسيولوجي دقيق يُعبَّر عنه بالعربية بمصطلح مشتق من «استتبّ الأمرُ» أي اطَّرد واستقام. الجنس القريب هو «التوازن» (hypernym)، والفصل النوعي هو كونه أيضياً ويُحافَظ عليه بآليات بيولوجية فاعلة عبر الجهاز العصبي اللاإرادي."
  blind_candidates:
    - lemma: "ثَبَاتٌ دَاخِلِيٌّ"
      generation_method: tarkib
      justification: "مركب إضافي وصفي يصف حالة الثبات في البيئة الداخلية للكائن الحي؛ «ثبات» من الجذر ث ب ت بمعنى الدوام والاستقرار"
    - lemma: "اتِّزَانٌ حَيَوِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «اتّزان» (مصدر اتّزن على وزن افتعال من وزن) بمعنى الاعتدال والاستقامة، و«حيوي» للتقييد بالسياق البيولوجي"
    - lemma: "تَجَانُسُ الِاتِّزَانِ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين التجانس (التماثل) والاتزان؛ يحاكي البنية اليونانية homoios+stasis"
    - lemma: "هُومِيُوسْتَاز"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح العالمي homeostasis؛ ملاذ أخير لأن البديل العربي المشتق متوفر"

stage2_evidence:
  per_lemma:
    - lemma: "اسْتِتْبَاب"
      confirm:
        - text: "«الميل للحفاظ على الانتظام أو الاستقرار في البيئة الداخلية للكائن الحي.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ArabTerm)"
        - text: "«اسْتِتْباب — homeostasis»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«الاسْتِتْباب — homeostatic equilibrium (homeostasis)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«استتباب، ثبات داخليّ — homeostasis»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«استتباب التنامي: سلوك التنامي الذي يؤدي إلى نمط ظاهريّ سويّ رغم وجود اختلافات جينية أو بيئية.»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "يُستخدم «استتباب» أساساً في مركبات اصطلاحية (استتباب جيني، استتباب مناعي، استتباب ربطي) مما يدل على رسوخه المعجمي"
        - text: "«استَتَبَّ الطَّرِيقُ: وَضَح واسْتَبان لِمَن يَسْلُكه. الأمرُ: تَهَيَّأ واسْتَوَى. أمرُ فلان: اطَّرد واسْتَقَام وتَبَيَّن»"
          source: "المعجم الكبير"
          addition: "المصدر «استتباب» من استتبّ بمعنى الاطراد والاستقامة، يناسب مفهوم الثبات الفسيولوجي الفاعل"
        - text: "«(استتب) الطَّرِيق وضح واستبان لمن يسلكه وَالْأَمر اطرد واستقام وَاسْتقر يُقَال استتب الْأَمْن واستتب النظام»"
          source: "المعجم الوسيط"
          addition: "الاستعمال المعاصر يؤكد دلالة الاستقرار والاطراد"

    - lemma: "تَوَازُنٌ دَاخِلِيٌّ"
      contradicts:
        - text: "«استتباب، ثبات داخليّ — homeostasis»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
          conflict: "المعجم البيطري يُدرج «ثبات داخلي» وليس «توازن داخلي» كمرادف للاستتباب"
        - text: "«الثبات الداخلي: ميل الجسم السليم إلى اتزان عملياته الأيضية الداخلية ويتم هذا عن طريق التغذية الراجعة.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: "المصطلح المُعجَمي المثبت هو «الثبات الداخلي» وليس «التوازن الداخلي»"

    - lemma: "ثَبَاتٌ دَاخِلِيٌّ"
      confirm:
        - text: "«الثبات الداخلي: ميل الجسم السليم إلى اتزان عملياته الأيضية الداخلية ويتم هذا عن طريق التغذية الراجعة.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«استتباب، ثبات داخليّ — homeostasis»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"

    - lemma: "اتِّزَانٌ حَيَوِيٌّ"
      confirm:
        - text: "«الاتزان الحيوي — homeostasis»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"

    - lemma: "تَجَانُسُ الِاتِّزَانِ"
      confirm:
        - text: "«تجانس الاتِّزان: اتزان [أو نزعة إلى هذا الاتزان] بين عناصر الكائن الحيّ المختلفة.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«المُجَانسة: هي الاتحاد في الجنس.»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "«المجانسة» و«التجانس» في الاصطلاح الكلاسيكي تعني الاتحاد في الجنس لا التوازن البيولوجي"

    - lemma: "هُومِيُوسْتَاز"
      evidence_status: "no_material_found"

