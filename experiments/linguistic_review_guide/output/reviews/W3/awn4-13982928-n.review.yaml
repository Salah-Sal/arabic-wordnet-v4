# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13982928-n (shadow: a dominating and pervasive presence)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«أثر مهيمن» تركيب وصفي حرّ وليس مصطلحاً مسكوكاً؛ يمكن إبدال «مهيمن» بـ«مسيطر» أو «طاغٍ» وتبقى العبارة واصفة."
      - "اللمّتان الموجودتان بلا تشكيل."
      - "«أثر» يدلّ على العلامة والبقيّة لا على الحضور؛ بينما المجموعة تحت فصيلة «حضور»."
    observations: "المفهوم المستهدف هو الاستخدام المجازي لكلمة «ظلّ» بمعنى الحضور المهيمن الطاغي، كما في «في ظلّ الحرب» أو «ظلّ السلطة». هذا الاستعمال المجازي راسخ في العربية الفصحى والمعاصرة. أمّا «أثر مهيمن» فهو وصف تحليلي لا يرقى إلى مرتبة المصطلح المعجمي الثابت."
  blind_candidates:
    - lemma: "ظِلّ"
      generation_method: majaz
      justification: "الظلّ في الاستعمال المجازي يدلّ على الحضور المهيمن والشامل: «في ظلّ الاحتلال»، «ظلّ السلطة». إزاحة دلالية من الستر الحسّي إلى الهيمنة المعنوية."
    - lemma: "سَطْوَة"
      generation_method: ishtiqaq
      justification: "من جذر «سطو» الدالّ على القهر والعلوّ عند ابن فارس. السطوة: شدّة البطش والغلبة، وهي حضور قاهر مهيمن."
    - lemma: "طَيْف"
      generation_method: majaz
      justification: "الطيف: الخيال الطائف، وما يحوم حول المرء دون انفكاك. نقل مجازي من الخيال الحالم إلى الحضور الشبحي المنتشر."
    - lemma: "كَنَف"
      generation_method: majaz
      justification: "الكنف: الجانب والحماية. من ستر الشيء إلى إحاطته. قريب من ظلّ في «هو في كنفه» أي في حمايته وسيطرته."

stage2_evidence:
  per_lemma:
    - lemma: "ظِلّ"
      confirm:
        - text: "«الكَنَفُ والمَنَعَةُ والعِزُّ. فَعَل ذلك في ظِلِّ القانون»"
          source: "المعجم الكبير"
        - text: "«يقال: هو في ظل فلان: فى كَنَفِهِ»"
          source: "المعجم الوسيط"
        - text: "«كُلُّ شَيْءٍ ساتر؛ محمودًا كان أو مذمومًا»"
          source: "المعجم الكبير"
        - text: "«(12) سيطرة»"
          source: "المورد الحديث (2008)"
        - text: "«وأظَلَّكَ فلانٌ، كأنَّه وقاك بظلِّه، وهو عِزُّه ومَنَعَتُه»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الظَّاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى سَتْرِ شَيْءٍ لِشَيْءٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الجذري يدلّ على الستر والإحاطة، وهو أساس الإزاحة المجازية إلى الهيمنة"
        - text: "«يُقال: لا يفارِقُ ظِلِّي ظِلَّكَ... ويقال: فلانٌ ثقيلُ الظِّلِّ: لا يُطاقُ»"
          source: "المعجم الكبير"
          addition: "استعمال مجازي يدلّ على الملازمة والحضور الدائم"

    - lemma: "أَثَر مُهَيْمِن"
      contradicts:
        - text: "«تَقْدِيمُ الشَّيْءِ، وَذِكْرُ الشَّيْءِ، وَرَسْمُ الشَّيْءِ الْبَاقِي»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "جذر «أثر» يدلّ على البقيّة والعلامة، لا على الحضور المهيمن؛ فالأثر ما يتبقّى بعد الشيء لا حضوره الفعلي"
      expands:
        - text: "«علامة أو تشوه بسبب وقوف المركبات الثقيلة لفترات طويلة»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "الأثر في الاستعمال المعاصر: أثر مادّي، بصمة، لا حضور مجرّد"

    - lemma: "سَطْوَة"
      confirm:
        - text: "«شِدَّةُ البَطْشِ»"
          source: "المعجم الكبير"
        - text: "«سَطْوة؛ سَيْطرة؛ هَيْمنة.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«أَميرٌ ذو سَطْوَةٍ, أى: ذو شَتْمٍ وظُلْمٍ وضَرْبٍ»"
          source: "المعجم الكبير"
          conflict: "السطوة فعل القهر والبطش، لا حالة الحضور المنتشر؛ المجموعة تحتاج اسم حالة لا اسم فعل"
        - text: "«السِّينُ وَالطَّاءُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى الْقَهْرِ وَالْعُلُوِّ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الدلالة الجذرية على القهر الفعلي، لا على الحضور الشامل"

    - lemma: "طَيْف"
      contradicts:
        - text: "«الخيال الطائف, وهو ما يراه النائم»"
          source: "المعجم الوسيط"
          conflict: "الطيف خيال عابر في المنام، لا حضور مهيمن دائم"
        - text: "«الطَّيْف: الغَضَبُ، والجُنونُ، والخَيالُ الطائِفُ في المَنامِ، أو مَجيئهُ في المَنامِ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الدلالة على الطيف/الخيال العابر تناقض مفهوم الحضور المنتشر الدائم"

    - lemma: "كَنَف"
      contradicts:
        - text: "«الْكَافُ وَالنُّونُ وَالْفَاءُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى سَتْرٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الكنف يدلّ على الستر والحماية، وهو إيجابي الدلالة؛ بينما المفهوم المستهدف يتضمّن الهيمنة والطغيان"

stage3_analysis:
  per_lemma:
    - lemma: "ظِلّ"
      decision: confirmed
      decision_reason: "مدعوم بأدلة معجمية متعدّدة من المعجم الوسيط والمعجم الكبير والمورد الحديث ومقاييس اللغة. الاستعمال المجازي لـ«ظلّ» بمعنى الحضور المهيمن راسخ في العربية: «في ظلّ القانون»، «ظلّ السلطة». المورد الحديث يسجّل «سيطرة» صراحةً معنًى لـ shadow."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ظِلّ"

    - lemma: "أَثَر مُهَيْمِن"
      decision: removed
      decision_reason: "تركيب وصفي حرّ لا مصطلح مسكوك؛ يفشل في اختبار السكّ (يمكن إبدال «مهيمن» بـ«مسيطر/طاغٍ» والعبارة تبقى واصفة). لا دليل معجمي على هذا المركّب بوصفه وحدة معجمية ثابتة. فضلاً عن أنّ «أثر» يدلّ على البقيّة والعلامة لا على «الحضور» وهو الجنس القريب للمجموعة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سَطْوَة"
      source: stage1
      decision: removed
      decision_reason: "السطوة تدلّ على فعل القهر والبطش (اسم فعل)، لا على حالة الحضور المنتشر (اسم حالة). المجموعة تحت فصيلة «حضور»، والسطوة ليست نوعاً من الحضور بل نوعاً من القوّة."
      evidence_assessment:
        case: mixed

    - lemma: "طَيْف"
      source: stage1
      decision: removed
      decision_reason: "الطيف في المعاجم: خيال عابر في المنام أو شبح زائل. يفتقر إلى دلالة الدوام والهيمنة التي يقتضيها تعريف المجموعة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "كَنَف"
      source: stage1
      decision: removed
      decision_reason: "الكنف يدلّ على الحماية والرعاية (دلالة إيجابية)، بينما المفهوم المستهدف يتضمّن الهيمنة والطغيان. الفارق الدلالي جوهري: الكنف حماية، والظلّ هنا سيطرة."
      evidence_assessment:
        case: contradicts_only

