# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (حارث) مكتوبة بدون تشكيل — يجب إضافة الضبط الكامل: حَارِث"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهي قاصرة؛ إذ تُثبت المعاجم أن حَرَّاث (فَعَّال) مصطلح موازٍ راسخ يدلّ على المحترف الحارث، ويجب ضمّه"
      - "التعريف الحالي يبدو ترجمةً مباشرة من الإنجليزية لا تأليفاً عربياً أصيلاً"
    observations: >
      المجموعة تمثّل مفهوم «من يحرث الأرض لزراعة المحاصيل»، وهو مفهوم عربي أصيل له
      جذر راسخ هو (ح ر ث). اللمّة الموجودة حارث اسم فاعل على وزن فَعَل/يَفْعُل وهي
      صحيحة، غير أنها تفتقر إلى التشكيل. يُلاحَظ غياب لمّة حَرَّاث (فَعَّال) الدالة
      على الاحتراف والمداومة، وهي موثّقة في المعجم الوسيط وغيره. كذلك يرتبط هذا
      المفهوم بالمحيط الزراعي الإسلامي الكلاسيكي ارتباطاً وثيقاً (الحديث: «احرث
      لدنياك كأنك تعيش أبداً»)، مما يجعل التعبير عنه بالعربية «native» بامتياز.

  blind_candidates:
    - lemma: "حَرَّاث"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ح ر ث) على وزن فَعَّال الدال على المهنة والاحتراف والتكثير.
        الوزن فَعَّال منتج في العربية لصنّاع الحرف اليدوية والمهنيين (نجّار، حدّاد،
        بنّاء). فالحَرَّاث هو من جعل حرث الأرض حِرفته الدائمة، في مقابل حارث الذي
        قد يدلّ على الوصف الآني.
    - lemma: "حَارِث"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من حَرَثَ يَحْرُثُ على وزن فَاعِل، وهو أبسط صيغة فاعلية يمكن
        استحضارها انطلاقاً من التعريف. الجذر (ح ر ث) يعني شق الأرض وإعدادها للزراعة،
        فالحَارِث هو الذي يقوم بهذا الفعل.
    - lemma: "مُثِيرُ الأَرْض"
      generation_method: tarkib
      justification: >
        مركب إضافي من مُثِير (اسم فاعل من أَثَارَ) + الأرض. إثارة الأرض تعبير عربي
        فصيح للدلالة على تقليب التربة وحرثها (قال تعالى: «وأثاروا الأرض»). المركب
        دقيق دلالياً لكنه يحتاج إلى تثبيت معجمي.
    - lemma: "شَقَّاق"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ش ق ق) على وزن فَعَّال، ويستند إلى أن الحرث في جوهره شقٌّ
        للأرض وتفتيح لها. غير أن هذا المرشح يحتاج إلى تحقق من المعاجم لضمان خلوّه
        من دلالات منافسة.


