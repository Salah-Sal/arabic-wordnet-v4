# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14479148-n
# nothingness / void / nullity / nihility
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «عدم» مشتركة مع المجموعة الأعلى (hypernym) awn4-13983217-n التي تحمل نفس اللمّة ونفس التعريف العربي «حالة عدم الوجود»، مما يُوجب التمييز بين المجموعتين"
      - "اللمّة «لاشيء» ليست اسم حالة (state noun) بل هي ضمير/اسم بمعنى «nothing»، والمطلوب هنا حالة اللاوجود (nothingness) لا الشيء المعدوم ذاته"
      - "التعريف العربي الحالي مُطابق تماماً لتعريف المجموعة الأعلى؛ يجب تخصيصه ليميّز هذه المجموعة"
    observations: "المجموعة تمثّل مفهوم العَدَم المطلق أو اللاشيئية، وهو مفهوم فلسفي-كلامي عريق في التراث العربي. العرب فرّقوا بين العَدَم (ضد الوجود عامّةً) والعَدَم المطلق (سلب الوجود كلّيّاً). اللمّات الإنجليزية (nothingness, nihility) تشير إلى الحالة المجرّدة للعدم، لا مجرّد عدم الوجود. لذا يُستحسن إضافة مصطلح يعبّر عن هذه الحالة المجرّدة كالمصدر الصناعي «عَدَمِيَّة» أو «لاشَيْئِيَّة»."

  blind_candidates:
    - lemma: "عَدَمِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «عَدَم» على وزن فَعَلِيَّة، يدلّ على حالة العدم المجرّدة وصفته، ويقابل الإنجليزية nothingness/nihility بدقّة أكبر من «عدم» المجرّد"
    - lemma: "لاشَيْئِيَّة"
      generation_method: tarkib
      justification: "مركّب من «لا شيء» مع ياء النسبة وتاء المصدر الصناعي، يعبّر عن حالة انعدام كلّ شيء. ورد في المورد الحديث مقابلاً لـ nihility و nothingness"
    - lemma: "فَنَاء"
      generation_method: majaz
      justification: "أصله الهلاك والزوال، وتوسّع مجازاً في الاصطلاح الصوفي والفلسفي إلى معنى الاضمحلال المطلق وزوال الكينونة"
    - lemma: "خَوَاء"
      generation_method: ishtiqaq
      justification: "من الجذر خ و ي، يدلّ على خلوّ الشيء ممّا شأنه أن يعيه حسّاً أو معنًى، وقد يُمدّ مجازاً إلى الفراغ الوجودي المطلق"


stage2_evidence:
  per_lemma:
    - lemma: "عَدَم"
      confirm:
        - text: "«العَدَمُ: انْتِفَاء الْكَوْن.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«(الْعَدَم) ضد الْوُجُود والفقر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«العدم يقابل الوجود كما أنّ العدمي يقابل الوجودي [...] في اصطلاح المتصوفة: العدم هو الأعيان الثّابتة يعني الصور العلمية، والحكماء يقولون: العدم هو الماهيات الممكنة.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الْعَدَم: يُقَابل الْوُجُود [...] فَإِن اعْتبر مُقَابلَته بالوجود الْمُطلق يكون عبارَة عَن سلب الْوُجُود الْمُطلق وَهُوَ الْعَدَم الْمُطلق.»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«العُدْمُ، بالضم وبضمتين وبالتحريك: الفِقْدَانُ، وغَلَبَ على فِقْدَانِ المالِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الجذر يدور حول الفقدان عموماً وغلب على فقدان المال (الفقر)، والمعنى الفلسفي (ضد الوجود) توسّع اصطلاحي"
        - text: "«العَدَمُ: فقدانُ الشيء وذهابه»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: "أقدم توثيق معجمي للجذر، يؤكد المعنى الأصلي: فقدان الشيء"

    - lemma: "لاشيء"
      contradicts:
        - text: "«لاشَيء: من (ش ي أ) الموجود ما يتصور ويخبر عنه والمعنى هنا أنه لا قيمة له ولا اعتبار.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "المدخل يعامل «لاشيء» بوصفه اسماً بمعنى التافه عديم القيمة، لا بوصفه اسم حالة فلسفية للعدم المطلق"

    - lemma: "عَدَمِيَّة"
      confirm:
        - text: "«(1) اللاشَيْئية (2) العَدَم: صفة اللّاوجود.»"
          source: "المورد الحديث (2008) — مقابل nihility"
      expands:
        - text: "وُجدت في مسرد الفلسفة وعلم النفس (ArabTerm) بلا تعريف"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم"
          addition: "تثبت استعمال المصطلح في السياق الفلسفي الحديث وإن لم يُعرَّف"

    - lemma: "لاشَيْئِيَّة"
      confirm:
        - text: "«(1) اللاشَيْئية (2) العَدَم: صفة اللّاوجود.»"
          source: "المورد الحديث (2008) — مقابل nihility"
        - text: "«(1) «أ» اللّاشيئيّة: العَدَم؛ اللّاوجود. «ب» تفاهة؛ لاأهميّة. «ج» موت أو إغماء (2) شيء تافه أو عديم القيمة (3) فراغ.»"
          source: "المورد الحديث (2008) — مقابل nothingness"

    - lemma: "فَنَاء"
      contradicts:
        - text: "«الفناء: سقوط الأوصاف المذمومة، كما أن البقاء وجود الأوصاف المحمودة [...] عدم الإحساس بعالم الملك والملكوت وهو بالاستغراق في عظمة الباري»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الفناء في الاصطلاح الصوفي حالة روحية (سقوط الأوصاف المذمومة) لا عدم وجودي مطلق"
        - text: "«الفناء: بالفتح خلاف البقاء وبالكسر الوصيدُ: وهي ساحة أمام البيت»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الفَناء (بالفتح) خلاف البقاء أي الهلاك والزوال، والفِناء (بالكسر) ساحة أمام البيت — كلا المعنيين يختلف عن العدم المطلق"

    - lemma: "خَوَاء"
      contradicts:
        - text: "«(الخواء) من الأَرْض براحها والفراغ بَين الأَرْض وَالسَّمَاء والفراغ بَين الشَّيْئَيْنِ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الخواء فراغ مادّي بين شيئين أو خلوّ حسّي، لا عدم وجودي مجرّد"
        - text: "«الخواء: خلو الشيء عما شأنه أن يعيه حسا أو معنى»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "خلوّ الشيء ممّا يعيه يختلف عن انعدام الشيء ذاته؛ الخواء يفترض وجود وعاء فارغ"


stage3_analysis:
  per_lemma:
    - lemma: "عَدَم"
      decision: confirmed
      decision_reason: "مصطلح فلسفي-كلامي راسخ بمعنى ضد الوجود وانتفاء الكون، مؤيَّد بأدلة معجمية كثيفة من المعجم الوسيط والتهانوي والسيوطي والأحمدنكري والخليل وغيرهم. وهو المقابل العربي الأصيل الأوّل لمفهوم nothingness/nonexistence"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على ضدّ الوجود مطلقاً، ويُستعمل في السياق الفلسفي والكلامي بوصفه مصطلحاً تقنيّاً محدّداً. قد يُستعمل أيضاً بمعنى الفقر في السياق اللغوي العام"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَدَم"

    - lemma: "لاشيء"
      decision: removed
      decision_reason: "«لاشيء» اسمٌ مركّب بمعنى nothing (الشيء المعدوم ذاته)، لا بمعنى nothingness (حالة العدم). الدليل المعجمي الوحيد (موسوعة السلطان قابوس) يعامله بمعنى التافه عديم القيمة. ولا يصلح اسمَ حالة مجرّدة كما تقتضيه دلالة المجموعة"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "عَدَمِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي مشتقّ بانتظام من «عدم» يدلّ على حالة العدم وصفته المجرّدة. وُجد في مسرد الفلسفة وعلم النفس (ArabTerm) وفي المورد الحديث مقابلاً لـ nihility. يلبّي الحاجة إلى مصطلح يميّز هذه المجموعة (حالة العدم) عن المجموعة الأعلى (عدم الوجود عامّةً)"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على الحالة المجرّدة للعدم بوصفها صفةً ذاتيّةً ثابتة (المصدر الصناعي يفيد التجريد)، بخلاف «عَدَم» الذي يدلّ على المفهوم ذاته مباشرةً"
      actions:
        - command: create_entry
          params:
            lemma: "عَدَمِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "لاشَيْئِيَّة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح ترجمي حديث ورد في المورد الحديث فقط (معجم ثنائي اللغة)، وهو ترجمة حرفية لـ nothingness لا مصطلح أصيل مستقرّ. بنيته التركيبية (نفي + اسم + مصدر صناعي) ثقيلة صرفيّاً، ولا يتمتّع بثبات معجمي في المعاجم العربية الأحادية"
      evidence_assessment:
        case: mixed

    - lemma: "فَنَاء"
      source: stage1
      decision: removed
      decision_reason: "الفناء في التراث العربي يختصّ بالهلاك والزوال (الانتقال من الوجود إلى العدم) أو بالحالة الصوفية (سقوط الأوصاف). ولا يدلّ على حالة العدم المطلق الثابتة بل على عملية الانتهاء. كما أنّ الفِناء (بالكسر) يعني ساحة البيت، فيقع اشتراك لفظي"
      evidence_assessment:
        case: contradicts_only

    - lemma: "خَوَاء"
      source: stage1
      decision: removed
      decision_reason: "الخواء فراغ مادّي حسّي (بين الأرض والسماء، بين الشيئين) أو خلوّ الجوف من الطعام. لا يدلّ على العدم الوجودي المجرّد بل يفترض وجود حيّز فارغ، وهو مفهوم مختلف جوهريّاً"
      evidence_assessment:
        case: contradicts_only


