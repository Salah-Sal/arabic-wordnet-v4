# مراجعة المجموعة الترادفية — awn4-14488259-n (bug / glitch)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «بق» تعني حشرة البقّ في جميع المعاجم العربية، واستخدامها بمعنى الخطأ البرمجي نقل حرفي (calque) من الإنجليزية bug دون سند معجمي عربي"
      - "اللمّة «عطل فني» تدلّ على توقف الآلة أو انقطاع عملها، وهو أعمّ وأشدّ من مفهوم العيب الكامن في البرنامج (bug)"
      - "اللمّة «خطأ برمجي» مسجّلة في معجم مصطلحات المعلوماتية لكنّ تعريفها هناك أضيق: خطأ يمكن للبرنامج استدراكه"
    observations: >
      المجموعة تمثّل مفهوم العيب أو الخلل الكامن في برنامج حاسوبي أو نظام أو آلة،
      وهو مفهوم تقني حديث نشأ في سياق هندسة البرمجيات. المصطلح الإنجليزي bug
      أصله مجازي (من الحشرة)، والعربية تملك بدائل اشتقاقية أدقّ مثل «عِلّة» و«عَثْرة»
      اللتين وردتا في المعاجم المتخصصة. ينبغي تنقية المجموعة من الألفاظ الحشرية
      والتركيز على المصطلحات ذات السند المعجمي الحاسوبي.
  blind_candidates:
    - lemma: "عِلَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ع-ل-ل على وزن فِعْلَة، أصوله في مقاييس اللغة: عائق يعوق وضعف في الشيء.
        المورد الحديث يترجم bug بـ«عِلّة» وdefect بـ«عِلّة»، فهو مصطلح مسكوك في الترجمة التقنية.
    - lemma: "عَثْرَة"
      generation_method: majaz
      justification: >
        من الجذر ع-ث-ر بمعنى الكبوة والزلّة، مجاز للخطأ الكامن في البرنامج. معجم مصطلحات
        المعلوماتية (2000) يستخدم «عَثْرة» مصطلحاً رئيسياً لـ bug مع تعريف تفصيلي.
    - lemma: "شَائِبَة"
      generation_method: majaz
      justification: >
        من الجذر ش-و-ب بمعنى ما يكدّر الشيء ويشوبه، مجاز للعيب الذي يشوب البرنامج.
        المورد الحديث يذكرها ترجمةً لـ defect.
    - lemma: "بَقَّة"
      generation_method: taarib
      justification: >
        تعريب للفظ bug الإنجليزي على وزن فَعْلَة العربي، لكنّها تتطابق مع اللفظ العربي
        الأصيل «بَقَّة» (الحشرة) مما يُحدث التباساً دلالياً.

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "بَقّ"
      contradicts:
        - text: "«(البق) الواسع العريض والواضح وحشرة من رتبة نصفية الأجنحة أجزاء فمها ثاقبة ماصة على شكل خرطوم ومنه ضروب»"
          source: "المعجم الوسيط"
          conflict: "المعاجم العربية جميعها تحصر دلالة البقّ في الحشرة، ولا يوجد معنى تقني حاسوبي"
        - text: "«حشرة من رتبة نصفية الجناح (hemiptera) ومنها بق الفراش وهو معروف، ويتغذى بدم الإنسان»"
          source: "معجم المصطلحات الطبية"
          conflict: "المصطلح طبّي حشري بحت"
      expands:
        - text: "«(1) بَقّ؛ بَقّة (2) كل حشرة تقريبًا (ع) (3) خَلَل؛ عِلّة»"
          source: "المورد الحديث"
          addition: "المورد يذكر المعنى (3) خلل/علّة كترجمة لـ bug الإنجليزي، لكنّ المدخل الرئيسي حشري"

    - lemma: "خَطَأ بَرْمَجِيّ"
      confirm:
        - text: "«خطأٌ يمكِن لبرنامجٍ أو نظام تشغيل استدراكُه.»"
          source: "معجم مصطلحات المعلوماتية (2000)"

    - lemma: "عُطْل فَنِّيّ"
      contradicts:
        - text: "«(1) إشارة خاطئة (ألك) (2) عُطلٌ (3) عَقَبة خفيَّة.»"
          source: "المورد الحديث — مدخل glitch"
          conflict: "المورد يترجم glitch بـ«عُطل» وهو توقّف عن العمل لا عيب كامن في الشيفرة"
      expands:
        - text: "«(عَطَلَ) العين والطاء واللام أصل صحيح واحد يدلّ على خلوّ وفراغ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على الخلوّ والفراغ والتعطّل، أي توقّف الشيء عن العمل، لا على وجود عيب كامن فيه"

    # ── مرشحات المرحلة ١ ──
    - lemma: "عِلَّة"
      confirm:
        - text: "«(1) خَلَلٌ؛ عِلّة؛ عيبٌ؛ شائبة»"
          source: "المورد الحديث — مدخل defect"
        - text: "«(3) خَلَل؛ عِلّة»"
          source: "المورد الحديث — مدخل bug"
      expands:
        - text: "«(عَلَّ) العين واللام أصول ثلاثة صحيحة: أحدها تكرّر أو تكرير، والآخر عائق يعوق، والثالث ضعف في الشيء»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الثاني (عائق يعوق) والثالث (ضعف) يناسبان دلالة العيب البرمجي"
        - text: "«العِلَّة: لغة معنى يحلّ بالمحلّ فيتغيّر به حال المحلّ بحلوله لا عن اختيار، ومنه سُمّي المرض علّة لأنّه لحلوله يتغيّر الحال من القوّة إلى الضعف»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "التعريف الاصطلاحي يصف بدقة سلوك الخطأ البرمجي: عارض يحلّ بالنظام فيغيّر سلوكه"

    - lemma: "عَثْرَة"
      confirm:
        - text: "«خطأٌ في منطقِ البرنامج أو في تدوينِه بلغةِ البرمجة، ويؤدِّي إلى عملِ البرنامجِ على وجهٍ سيّئ أو إعطائه نتائج غير صحيحة. إن العثراتِ الصغيرةَ، كالمنْزلِق الذي لا يتصرَّف كما هو مخططٌ له، لا تَمَسُّ المعلوماتِ بسوء [...] ويجب التفتيشُ والعثورُ على جميعِ هذه الأخطاء وتصحيحها بإجرائيةٍ لإزالةِ العثرات تسمّى: التنقيح debugging»"
          source: "معجم مصطلحات المعلوماتية (2000)"

    - lemma: "شَائِبَة"
      expands:
        - text: "«(الشائبة) الشيء الغريب يختلط بغيره ويقال ما فيه شائبة ليس فيه شبهة والدنس والقذر ونحوهما (ج) شوائب»"
          source: "المعجم الوسيط"
          addition: "المعنى عامّ جداً (شيء غريب يختلط بغيره)، ليس مخصّصاً للسياق التقني"

    - lemma: "بَقَّة"
      contradicts:
        - text: "«البَقَّةُ: البَعوضَةُ، ودُوَيْبَّةٌ مُفَرْطَحَةٌ حَمْراءُ مُنْتِنَةٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "اللفظ محصور في الدلالة الحشرية في جميع المعاجم الكلاسيكية والحديثة"
        - text: "«مؤنث البَقِّ كثيرة النسل»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يحصرها في مؤنث البقّ (الحشرة) والمرأة كثيرة النسل"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "بَقّ"
      decision: removed
      decision_reason: >
        لفظ «بقّ» في المعاجم العربية جميعها يعني الحشرة (رتبة نصفية الأجنحة).
        استخدامه بمعنى الخطأ البرمجي نقل حرفي أعمى من الإنجليزية bug بلا سند عربي.
        المورد الحديث نفسه يضع المعنى الحشري أوّلاً ويذكر «خلل/علّة» بديلاً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "خَطَأ بَرْمَجِيّ"
      decision: confirmed
      decision_reason: >
        مصطلح مسجّل في معجم مصطلحات المعلوماتية (2000) بتعريف تقني واضح.
        مركب وصفي ثابت معجمياً في السياق الحاسوبي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يركّز على كون العيب في الشيفرة البرمجية تحديداً، ويوحي بأنّ النظام قادر على استدراكه.
        أضيق دلالةً من «عِلّة» التي تشمل عيوب الأنظمة والآلات أيضاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَطَأ بَرْمَجِيّ"

    - lemma: "عُطْل فَنِّيّ"
      decision: removed
      decision_reason: >
        الجذر ع-ط-ل يدلّ على الخلوّ والتوقّف عن العمل (مقاييس اللغة)، فالعُطل
        هو انقطاع الخدمة لا عيب كامن في الشيفرة. المفهوم أقرب إلى «malfunction/outage»
        منه إلى «bug/defect». كما أنّ «فنّي» (تقني) لا تخصّصه في البرمجيات.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "عِلَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح ذو سند معجمي قويّ: المورد الحديث يترجم به bug وdefect،
        والأصل اللغوي (عائق يعوق، ضعف في الشيء) يناسب المفهوم تماماً.
        التعريف الاصطلاحي عند المناوي «معنى يحلّ بالمحلّ فيتغيّر به حال المحلّ»
        يصف سلوك الخطأ البرمجي بدقة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أعمّ مصطلحات المجموعة: تشمل كل عيب كامن في برنامج أو نظام أو آلة،
        سواء أكان في الشيفرة أم في التصميم أم في العتاد. تُستخدم في السياق التقني العام.
      actions:
        - command: create_entry
          params: {lemma: "عِلَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "عَثْرَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصطلح الرئيسي المعتمد في معجم مصطلحات المعلوماتية (2000) لترجمة bug
        مع تعريف تفصيلي يشرح أنواع العثرات البرمجية وآليات تنقيحها.
        الاستعارة المجازية (الكبوة/الزلّة) طبيعية ومفهومة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تركّز على البُعد العرضي غير المقصود للخطأ (زلّة وكبوة)، وتوحي بإمكان
        التصحيح والتنقيح. أدقّ من «عِلّة» في السياق البرمجي.
      actions:
        - command: create_entry
          params: {lemma: "عَثْرَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "شَائِبَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى المعجمي عامّ جداً (الشيء الغريب الذي يختلط بغيره، الدنس، القذر).
        لا يوجد سند في أي معجم تقني متخصص لاستخدامها بمعنى الخطأ البرمجي.
        ذكرها في المورد الحديث تحت defect جاء ضمن سلسلة مرادفات عامة.

    - lemma: "بَقَّة"
      source: stage1
      decision: removed
      decision_reason: >
        تتطابق مع اللفظ العربي الأصيل «بَقَّة» (البعوضة/الحشرة) في جميع المعاجم.
        التعريب يُحدث التباساً تامّاً مع المعنى الحشري الراسخ.

