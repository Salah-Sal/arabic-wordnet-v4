# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
stage5_enrichment:

  per_entry:
    - lemma: "طَبِيبٌ شَرْعِيٌّ"
      entry_id: "627630"
      roots:
        - word: "طبيب"
          root: "طبب"
          maqayis_quote: >
            «الطَّاءُ وَالْبَاءُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ
            عَلَى عِلْمٍ بِالشَّيْءِ وَمَهَارَةٍ فِيهِ»
        - word: "شرعي"
          root: "شرع"
          maqayis_quote: >
            «الشِّينُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، وَهُوَ شَيْءٌ
