# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — قُرئ الملف المُقنَّع أولاً؛
  #    التعريف المرئي: «مسؤول عام يحقق في أي وفاة غير ناتجة عن أسباب طبيعية»
  blind_candidates:
    - lemma: "مُحَقِّقُ الوَفَيَات"
      generation_method: tarkib
      justification: >
        مركّب إضافيّ من «مُحَقِّق» (اسم فاعل من حقَّق: بحث وتثبَّت) +
        «الوَفَيَات» (جمع وفاة). يُعبِّر عن الوظيفة التحقيقية القانونية
        المرتبطة بالوفاة. وحدة معجمية مسكوكة تعكس مباشرةً الجنس القريب
        (مُحَقِّق) والفصل النوعي (الوفيات).

    - lemma: "الطَّبِيبُ الشَّرْعِيُّ"
      generation_method: tarkib
      justification: >
        مركّب وصفيّ من «طَبِيب» (فعيل للمبالغة، حامل علم الطب) +
        «شَرْعِيّ» (نسبة إلى الشَّرع بمعنى القانون). يُشير إلى الطبيب
        المُخوَّل رسمياً بفحص الجثث تحقيقاً جنائياً. تعبير مستخدم فعلاً
        في المعاجم الطبية الحديثة.

    - lemma: "مُفَتِّشُ الوَفَيَات"
      generation_method: tarkib
      justification: >
        مركّب إضافيّ من «مُفَتِّش» (اسم فاعل من فتَّش: بحث وتقصَّى) +
        «الوَفَيَات». التفتيش في العربية يحمل دلالة السلطة الرقابية
        الرسمية مما يلائم طابع المسؤول العام.

    - lemma: "فَاحِصُ الجُثَث"
      generation_method: tarkib
      justification: >
        مركّب إضافيّ مجازيّ: «فَاحِص» (اسم فاعل من فحص: بحث وتمحَّص) +
        «الجُثَث» (جمع جثّة). يستعمل المجاز بالمجاورة إذ يُعبِّر عن
        المهمة الميدانية (فحص الجثة) بوصفها سمة مميِّزة لصاحب الوظيفة.

  # ب. التقييم الأولي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - >
        «مُحَقِّق في الوَفَيَات» ليست وحدة معجمية ثابتة: الحرف الجارّ «في»
        يُحوِّلها إلى عبارة وصفية مفتوحة لا إلى مصطلح مسكوك؛
        والصياغة المعجمية المُثبَّتة في المورد الحديث هي «مُحَقِّق الوَفَيَات»
        (إضافي) لا «مُحَقِّق في الوَفَيَات».
      - >
        كلا اللمّتين خالٍ من التشكيل الكامل الإلزامي.
      - >
        التعريف الحالي ترجمة حرفية للإنجليزية («لا تُنتج عن أسباب طبيعية»)
        بدلاً من أسلوب المعاجم العربية.
      - >
        التمييز الدقيق بين coroner (مُحَقِّق الوَفَيَات — وظيفة قانونية قد
        يشغلها غير طبيب) وmedical examiner (الطبيب الشرعي — يشترط
        التأهيل الطبي) غير موثَّق في البنية الراهنة للمجموعة.
    observations: >
      المجموعة تُغطّي مفهوماً واحداً له وجهان وظيفيَّان مختلفان في التراث
      القانوني الأنجلوسكسوني: coroner (مسؤول قانوني يحقق في الوفيات المشتبه
      فيها) وmedical examiner (طبيب رسمي يُجري الفحص الجنائي للجثة).
      العربية تُفرِّق بينهما: «مُحَقِّق الوَفَيَات» ← coroner،
      «الطَّبِيبُ الشَّرْعِيُّ» ← medical examiner.
      اللمّة الموجودة «طبيب شرعي» صحيحة لـ medical examiner لكنها لا تشمل
      coroner بمفردها. أما «محقق في الوفيات» فصياغة ركيكة لم يُسجِّلها أي
      معجم بهذه الهيئة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ملاحظة المنهج:
  #   استعلام ١ — مطابقة الرؤوس الدفعية (الكل في استعلام واحد)
  #   استعلام ٢ — إثراء بالمعرِّف (entry_id)
  #   استعلام ٣ — الجسر الإنجليزي (coroner | medical examiner)
  #   استعلام ٤ — FTS بالكلمات المفتاحية (تحقيق / وفاة / شرعي)
  #   استعلام ٥ — مقاييس اللغة (الجذور: طب، شرع، حق، وفي، فحص، فتش)

  per_lemma:

    - lemma: "طبيب شرعي"
      confirm:
        - text: "«طَبيبٌ شَرْعِيّ» — translation_en: forensic physician"
          source: "المعجم الطبي الموحد (2009) — entry_id 627630"
        - text: "«الطبيب الشرعي: طبيب رسمي يفحص الجثّة لتحديد أسباب الوفاة
                 [وبخاصة في حوادث الانتحار وجرائم القتل].»
                 translation_en: medical examiner"
          source: "المورد الحديث (2008) — entry_id 700623"

    - lemma: "محقق في الوفيات"
      evidence_status: "no_material_found"
      # ملاحظة: البحث في قاعدة البيانات لم يُسفر عن أيّ مدخل بهذه الصياغة
      # بالضبط. الصيغة المُسجَّلة في المعاجم هي «مُحَقِّق الوَفَيات» (إضافي).

    - lemma: "مُحَقِّقُ الوَفَيَات"
      confirm:
        - text: "«محقِّق الوَفَيات: محقِّق في أسباب الوفيات المشتَبَه بها.»
                 translation_en: coroner"
          source: "المورد الحديث (2008) — entry_id 680369"

    - lemma: "الطَّبِيبُ الشَّرْعِيُّ"
      confirm:
        - text: "«الطبيب الشرعي: طبيب رسمي يفحص الجثّة لتحديد أسباب الوفاة
                 [وبخاصة في حوادث الانتحار وجرائم القتل].»
                 translation_en: medical examiner"
          source: "المورد الحديث (2008) — entry_id 700623"
      # تنبيه: هذا المدخل يُطابق اللمّة الموجودة «طبيب شرعي» بصيغتها
      # المُعرَّفة؛ ليس مصطلحاً مستقلاً يستحق إدراجاً جديداً.

    - lemma: "مُفَتِّشُ الوَفَيَات"
      evidence_status: "no_material_found"

    - lemma: "فَاحِصُ الجُثَث"
      evidence_status: "no_material_found"

  # ملحق: شاهد معجمي ذو صلة — ليس مرشَّحاً لكنه يُثري السياق
  additional_findings:
    - text: "«قاضِي التَّحْقيق» — translation_en: coroner"
      source: "المعجم الطبي الموحد (2009) — entry_id 561491"
      note: >
        يُعطى هذا المصطلح أحياناً كمقابل لـ coroner في السياق الطبي،
        غير أن معجم مصطلحات القانون (2017) يُعرِّفه صراحةً بأنه
        «قاضي من قضاة الحكم يتولى التحقيق في القضايا... ملتمساً من
        النيابة العامة» أي examining magistrate — مفهوم قانوني مختلف
        جذرياً عن coroner. يُستبعد من المجموعة لهذا الغموض.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "طبيب شرعي"
      decision: confirmed
      decision_reason: >
        مصطلح طبي راسخ موثَّق في معجمَين رسميَّين (المعجم الطبي الموحد
        والمورد الحديث) كمقابل لـ medical examiner وforsenic physician.
        المركَّب الوصفيّ (طبيب + شرعي) وحدة معجمية ثابتة يصعب استبدال
        أحد مكوّنَيها دون كسر الدلالة المتخصصة. يحتاج فقط تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على الكفاءة الطبية للمسؤول: يفترض حمله شهادةً طبية
        وإجراءه الفحص الجنائي للجثة؛ يُقابل medical examiner تحديداً.
        يختلف عن «مُحَقِّق الوَفَيَات» الذي يُعبِّر عن الوظيفة القانونية
        دون اشتراط التأهيل الطبي (قد يكون قاضياً أو مسؤولاً قانونياً).
      actions:
        - command: update_lemma
          params:
            entry_id: "627630"
            new_lemma: "طَبِيبٌ شَرْعِيٌّ"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "محقق في الوفيات"
      decision: removed
      decision_reason: >
        لم يُسجِّل أيّ معجم هذه العبارة بصيغتها الحرفية «محقق في الوفيات».
        الحرف الجارّ «في» يُفسد السكّ المصطلحيّ: يمكن استبدال «في الوفيات»
        بـ«في حوادث القتل» أو «في الانتحار» دون تغيير هيكلي، مما يثبت أنها
        عبارة وصفية مفتوحة لا مصطلح مسكوك. الصيغة المُثبَّتة معجمياً هي
        «مُحَقِّق الوَفَيَات» (إضافيّ) وهي ستُضاف عبر مرشَّح المرحلة ١.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشَّح المرحلة ١ — أ ──
    - lemma: "مُحَقِّقُ الوَفَيَات"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق صراحةً في المورد الحديث (2008) بوصفه المقابل العربي لـcoroner
        مع تعريف: «محقِّق في أسباب الوفيات المشتَبَه بها». المركَّب الإضافيّ
        (مُحَقِّق + الوَفَيَات) وحدة معجمية ثابتة تجتاز اختبار السكّ:
        لا يمكن إبدال «الوَفَيَات» بـ«الجرائم» أو «الحوادث» مع الحفاظ
        على الدلالة المتخصصة ذاتها. اشتقاق عربي أصيل من جذر حق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الوظيفة التحقيقية القانونية بصرف النظر عن التأهيل الطبي؛
        يُقابل coroner الذي قد يكون قاضياً أو مسؤولاً قانونياً لا طبيباً.
        يختلف عن «طَبِيبٌ شَرْعِيٌّ» الذي يفترض تأهيلاً طبياً.
      actions:
        - command: create_entry
          params:
            lemma: "مُحَقِّقُ الوَفَيَات"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09985515-n"

    # ── مرشَّح المرحلة ١ — ب ──
    - lemma: "الطَّبِيبُ الشَّرْعِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشَّح يُطابق في جوهره اللمّة الموجودة «طبيب شرعي» بصيغتها
        المُعرَّفة؛ المدخل المعجمي (entry_id 700623) هو مدخل مستقل بسبب
        أداة التعريف لكن المصطلح واحد. إضافته ستُنشئ ازدواجاً غير مبرَّر
        داخل المجموعة.

    # ── مرشَّح المرحلة ١ — ج ──
    - lemma: "مُفَتِّشُ الوَفَيَات"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استخدامه مصطلحاً لهذا المفهوم. «مُفَتِّش» في
        العربية يحمل دلالة الرقابة الإدارية (مفتش التعليم، مفتش الصحة)
        لا التحقيق الجنائي في الوفيات. بوابة الملاءمة: لا يفي بمعيار
        إيثار الشائع الفصيح المُثبَّت في المصادر.

    # ── مرشَّح المرحلة ١ — د ──
    - lemma: "فَاحِصُ الجُثَث"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. المصطلح يُضيِّق الدلالة: «فحص الجثث» هو مهمة
        الطبيب الشرعي في التشريح، لا الوظيفة الإدارية-القانونية الأشمل
        التي تتضمن التحقيق في ملابسات الوفاة واستجواب الشهود وإصدار
        شهادات الوفاة. فضلاً عن ذلك «الجُثَث» تحمل ظلاً قدحياً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "مسؤول عام يحقق في أي وفاة غير ناتجة عن أسباب طبيعية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزية («غير ناتجة عن أسباب طبيعية»
        نسخة عربية شبه حرفية من «not due to natural causes»). لا يُفصح
        عن الأدوات (الفحص الجنائي، التشريح، التحقيق القانوني)، ولا يُميِّز
        هذا المسؤول عن سائر المحققين. يحتاج صياغة بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: >
          مسؤولٌ رسميٌّ مُخوَّلٌ قانوناً بالتحقيق في كل حالة وفاة لم تُصنَّف
          طبيعية، بهدف تحديد سببها ووقتها وملابساتها وفق الإجراءات القانونية
          المعتمدة
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مسؤولٌ حكوميٌّ يتولّى التحقيق في حالات الوفاة المفاجئة أو العنيفة
          أو المشتبه فيها أو مجهولة السبب؛ يُجري الفحص الجنائيّ للجثة أو
          يستعين بالتشريح، ويستجوب الشهود، ويُصدر تقريراً رسمياً بسبب الوفاة.
          وقد يكون في بعض الأنظمة القانونية طبيباً مُتخصِّصاً (الطبيب الشرعي)
          أو قاضياً أو مسؤولاً قانونياً (محقق الوفيات)
