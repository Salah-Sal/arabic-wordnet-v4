stage1_review:
  assessment:
    concerns:
      - الاكتفاء بمسميين فقط بينما يزخر التراث الجغرافي العربي بمسميات أخرى كبحر فارس.
      - الحاجة إلى تعريف جغرافي أكثر دقة يربط الخليج ببحر عمان ومضيق هرمز.
    observations: "المجموعة تغطي المفهوم الجغرافي للخليج الفاصل بين شبه الجزيرة العربية وإيران. اللمات الموجودة تعكس التسميتين المعاصرتين (العربية والفارسية)، وهما صحيحتان ومستعملتان."
  blind_candidates:
    - lemma: "الخَلِيج العَرَبِيّ"
      generation_method: tarkib
      justification: "الاسم الشائع والمعتمد في الدول العربية والمنظمات الإقليمية العربية."
    - lemma: "الخَلِيج الفَارِسِيّ"
      generation_method: tarkib
      justification: "الاسم التاريخي والمعترف به دولياً في العديد من الخرائط والمواثيق."
    - lemma: "الخَلِيج"
      generation_method: majaz
      justification: "يستخدم اللفظ مفرداً في سياق المنطقة للإشارة حصراً إلى هذا الخليج (مثل دول الخليج)."
    - lemma: "بَحْر فَارِس"
      generation_method: tarkib
      justification: "الاسم الجغرافي الكلاسيكي الغالب في كتب الجغرافيا والبلدان القديمة (مثل معجم البلدان)."

stage2_evidence:
  per_lemma:
    - lemma: "الخليج العربي"
      confirm:
        - text: "العباءة أو العباية هي قطعة قماش سوداء تلبسها المرأة المسلمة في بعض مناطق الشرق الأوسط وبالأخص في دول الخليج العربي."
          source: "مسرد صناعة النسيج (ArabTerm)"
        - text: "الخليج العربي (ترجمة Persian Gulf)"
          source: "المكنز الزراعي (ArabTerm)"
    - lemma: "الخليج الفارسي"
      confirm:
        - text: "عبارة عن التقاء بحر فارس والروم."
          source: "كشاف اصطلاحات الفنون للتهانوي (استعمال تاريخي للمصطلح)"
    - lemma: "بحر فارس"
      confirm:
        - text: "هو شعبة من بحر الهند الأعظم، واسمه بالفارسية كما ذكره حمزة: زراه كامسير، وحدّه من التّيز من نواحي مكران على سواحل بحر فارس إلى عبّادان."
          source: "معجم البلدان لياقوت الحموي"
        - text: "لأن بحر فارس وبحر السودان أحاطا بجانبيها (أي جزيرة العرب)."
          source: "مجمع بحار الأنوار"
    - lemma: "الخليج"
      confirm:
        - text: "أهواز: إقليم في إيران على الخليج."
          source: "موسوعة السلطان قابوس"
        - text: "(الخليج) امتداد من الماء متوغل في اليابس (مج)."
          source: "المعجم الوسيط"

