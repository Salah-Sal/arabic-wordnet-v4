stage4_content:
  definition:
    current: "ذراع ضحل من بحر العرب بين إيران وشبه الجزيرة العربية؛ حقول النفط في الخليج العربي من بين الأكثر إنتاجية في العالم"
    assessment:
      decision: revise
      reason: "التعريف الحالي يربطه مباشرة ببحر العرب، بينما الوصل الجغرافي الأدق هو عبر بحر عمان ومضيق هرمز. كما يحتاج لأسلوب معجمي رصين."
    authored:
      - type: encyclopedic
        text: "ذِرَاعٌ بَحْرِيٌّ يَفْصِلُ بَيْنَ شِبْهِ الجَزِيرَةِ العَرَبِيَّةِ وَإِيرَانَ، يَتَّصِلُ بِبَحْرِ عُمَانَ عَبْرَ مَضِيقِ هُرْمُزَ، وَتَشْتَهِرُ سَوَاحِلُهُ بِإِنْتَاجِ النَّفْطِ وَالغَازِ، وَيُعَدُّ مِنْ أَهَمِّ المَمَرَّاتِ المَائِيَّةِ فِي العَالَمِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "ذِرَاعٌ بَحْرِيٌّ يَفْصِلُ بَيْنَ شِبْهِ الجَزِيرَةِ العَرَبِيَّةِ وَإِيرَانَ، يَتَّصِلُ بِبَحْرِ عُمَانَ عَبْرَ مَضِيقِ هُرْمُزَ، وَتَشْتَهِرُ سَوَاحِلُهُ بِإِنْتَاجِ النَّفْطِ وَالغَازِ، وَيُعَدُّ مِنْ أَهَمِّ المَمَرَّاتِ المَائِيَّةِ فِي العَالَمِ."}
  examples:
    per_lemma:
      - lemma: "الخَلِيج العَرَبِيّ"
        examples:
          - text: "تَمْتَلِكُ دُوَلُ الخَلِيجِ العَرَبِيِّ احْتِيَاطِيَّاتٍ ضَخْمَةً مِنَ الطَّاقَةِ."
