            type: usage
      - lemma: "بَحْر فَارِس"
        examples:
          - text: "ذَكَرَ ياقُوتُ الحَمَوِيُّ بَحْرَ فَارِسَ وَصَنَّفَهُ كَشُعْبَةٍ مِنْ بَحْرِ الهِنْدِ."
            type: usage
      - lemma: "الخَلِيج"
