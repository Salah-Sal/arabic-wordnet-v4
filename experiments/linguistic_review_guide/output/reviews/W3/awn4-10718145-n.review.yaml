# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (ويليام تيل) وهي اسم علم أجنبي معرَّب؛ إمكانية إضافة لمّات بديلة عربية أصيلة معدومة بطبيعة الحال"
      - "POS مُصنَّف على أنه (n) في حين أن أسماء الأعلام الأشخاص تستحق تصنيف (proper_noun) للدقة المعجمية"
      - "اللمّة الحالية (ويليام تيل) مكتوبة بلا تشكيل؛ يجب إضافة الضبط الكامل"
      - "التعريف الحالي مقبول لكنه يحتاج تنقيحاً أسلوبياً: 'ضرب تفاحة' غير دقيقة والصواب 'إصابة تفاحة' أو 'رمي تفاحة'"
    observations: >
      هذه المجموعة الترادفية تمثّل شخصاً أسطورياً بعينه هو البطل القومي السويسري
      ويليام تيل (Wilhelm Tell)، الذي تعود أسطورته إلى مطلع القرن الرابع عشر
      الميلادي. الاسم المُعرَّب «ويليام تيل» هو الشكل العربي المتداول في المصادر
      الموسوعية والتاريخية والثقافية العربية. لا يوجد مرادف عربي أصيل لهذا الاسم
      العَلَم إذ إن أسماء الأعلام الأجنبية للأشخاص التاريخيين تُنقل بالتعريب
      الصوتي حصراً. الفئة الدلالية العليا (رامي السهام / نبّال) صحيحة. المجموعة
      واضحة دلالياً ولا تتداخل مع مجموعات أخرى.

  blind_candidates:
    - lemma: "وِيلِيَامُ تِيلْ"
      generation_method: taarib
      justification: >
        صيغة تعريب بديلة للاسم الإنجليزي/الألماني Wilhelm Tell، بضبط صوتي أقرب
        إلى اللفظ الأصلي مع كسر الواو وإضافة ياء مشددة للمقطع الثاني (Wi-li-am)؛
        غير أن الشكل المتداول هو «ويليام» بواو مضمومة ثم ياء ساكنة
    - lemma: "رَامِي التُّفَّاحَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي يستحضر الحادثة الأسطورية الشهيرة التي اشتُهر بها هذا البطل
        (إصابة التفاحة الموضوعة على رأس ابنه بالقوس)؛ لقب وصفي يُحيل إلى هويته
        المحورية في الأسطورة، لكنه ليس اسماً علماً ثابتاً
    - lemma: "الْقَوَّاسُ الأَسْطُورِيُّ السُّوَيْسَرِيّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي إضافي يجمع بين مهارته الأساسية (القوس والسهم) وطابعه الأسطوري
        وانتمائه الجغرافي؛ وصف مُحكَم لكنه عام لا يخصّ شخصاً بعينه ولا يُسكَّك
        كاسم علم
    - lemma: "الْوَطَنِيُّ الرَّامِي"
      generation_method: tarkib
      justification: >
        تركيب وصفي مختصر يجمع بين صفته الوطنية وحرفته المشهورة؛ لكنه وصف مجرد
        لا يُميّزه عن سائر المناضلين الرماة في التاريخ، ولا يصلح لمماثلة اسم العلم


