# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "ويليام تيل"
      decision: confirmed
      decision_reason: >
        اسم العلم «ويليام تيل» هو التعريب الصوتي الرسمي والمتداول للاسم الأجنبي
        «William Tell»، ولا يوجد بديل عربي أصيل لاسم علم شخص تاريخي بعينه.
        الشكل مقبول معجمياً بوصفه تعريباً يقبل لام التعريف ويُستعمَل في المصادر
        العربية الموسوعية والتاريخية. يُحتاج إلى تصحيح التشكيل وإضافته.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: taarib
        # ملاحظة: كلا المكوّنَيْن (ويليام + تيل) تعريب صوتي لمكوّنات الاسم الأجنبي،
        # وليسا وحدتَيْن معجميتَيْن عربيتَيْن مستقلتَيْن. التعريف على أنه «إضافي» أو
        # «وصفي» لا ينطبق هنا — هذا تعريب ثنائي المقطع لاسم علم أجنبي مركّب.
      morphological_check:
        pos_fit: >
          تصنيف POS كـ(n) مقبول وظيفياً، لكن (proper_noun) أدق لاسم الشخص
          الأجنبي المُعرَّب. يُوصى بمراجعة POS.
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُعيِّن بدقة الشخصية الأسطورية السويسرية
        المعروفة، ولا تشترك مع أي لمّة أخرى في المجموعة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيلْيَامُ تِيلْ"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشحات المرحلة ١ (جميعها مرفوضة) ──
    - lemma: "وِيلِيَامُ تِيلْ"
      source: stage1
      decision: removed
      decision_reason: >
        هذا الشكل مرادف صوتي طفيف للمّة الموجودة (ويليام تيل) ولا يُشكّل إضافة
        دلالية حقيقية؛ إنه مجرد اختلاف في نقل المقطع الثاني (يا/يلي). الأولوية
        للشكل الأكثر تداولاً وهو «ويليام» لا «ويليام». لا حاجة لإنشاء مدخل مكرر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: taarib

    - lemma: "رَامِي التُّفَّاحَة"
      source: stage1
      decision: removed
      decision_reason: >
        هذا التركيب الإضافي وصف أسطوري لا اسم علم ثابت؛ يفشل اختبار التثبيت
        المعجمي إذ يمكن استبدال «التفاحة» بـ«الهدف» وبقي وصفاً صالحاً.
        وهو تعبير حر لا مصطلح مُسكَّك. لا يُستخدَم في المصادر العربية للدلالة
        على هذا الشخص بعينه دون الاستعانة باسمه الصريح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "الْقَوَّاسُ الأَسْطُورِيُّ السُّوَيْسَرِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        وصف عام لا يُفيد في تمييز هذا الشخص بعينه عن غيره من رماة السهام
        الأسطوريين في التاريخ (هيمس، إيروس، كيوبيد...). لا يصلح اسماً علماً
        ولا مصطلحاً معجمياً ثابتاً، فضلاً عن طوله الذي يُعيق التداول.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "الْوَطَنِيُّ الرَّامِي"
      source: stage1
      decision: removed
      decision_reason: >
        وصف مبهم عام لا يُعيِّن شخصاً بعينه؛ تنطبق هذه الصفة على كثير من
        المناضلين والرماة في التاريخ. لا يصمد أمام اختبار الاستبدال ولا التثبيت
        المعجمي. مرفوض.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "وطني سويسري عاش في أوائل القرن الرابع عشر واشتهر بمهارته كرامي سهام؛ وفقًا للأسطورة أجبره حاكم نمساوي على ضرب تفاحة من فوق رأس ابنه بقوسه المستعرض (وقد فعل ذلك بنجاح دون أذى)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي جيد في بنيته الأساسية لكنه يحتاج تحسينات:
        (١) «ضرب تفاحة» غير دقيقة — الصواب «إصابة تفاحة» أو «رمي تفاحة» إذ
        الفعل المقصود رمي السهم نحوها لا ضربها بالجسد؛ (٢) الجملة الاعتراضية
        «(وقد فعل ذلك بنجاح دون أذى)» ركيكة أسلوبياً وتفتقر إلى رصانة المعجم؛
        (٣) «أوائل القرن الرابع عشر» لا تُحدد الميلادية. يُقترح تعريف موسوعي
        أكثر رصانة وأسلوباً أقرب إلى المعجم الوسيط.
    authored:
      - type: encyclopedic
        text: >
          بَطَلٌ قَوْمِيٌّ سُوَيْسَرِيٌّ أَسْطُورِيٌّ يُنْسَبُ إِلَى مَطْلَعِ الْقَرْنِ
          الرَّابِعَ عَشَرَ الْمِيلَادِيِّ، اشْتُهِرَ بِبَرَاعَتِهِ فِي الرَّمْيِ بِالْقَوْسِ
          وَالسَّهْمِ. وَتَرْوِي الأُسْطُورَةُ أَنَّ حَاكِمًا نَمْسَاوِيًّا مُتَسَلِّطًا أَرْغَمَهُ
          عَلَى إِصَابَةِ تُفَّاحَةٍ مَوْضُوعَةٍ فَوْقَ رَأْسِ ابْنِهِ بِقَوْسِهِ الْمُسْتَعْرَضِ،
          فَنَجَحَ فِي ذَلِكَ دُونَ أَنْ يُلْحِقَ بِابْنِهِ أَذًى، وَغَدَا رَمْزًا لِلتَّحَرُّرِ
          الْوَطَنِيِّ فِي التُّرَاثِ السُّوَيْسَرِيِّ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10718145-n"
          definition_index: 0
          text: >
            بَطَلٌ قَوْمِيٌّ سُوَيْسَرِيٌّ أَسْطُورِيٌّ يُنْسَبُ إِلَى مَطْلَعِ الْقَرْنِ الرَّابِعَ
            عَشَرَ الْمِيلَادِيِّ، اشْتُهِرَ بِبَرَاعَتِهِ فِي الرَّمْيِ بِالْقَوْسِ وَالسَّهْمِ؛
            وَتَرْوِي الأُسْطُورَةُ أَنَّ حَاكِمًا نَمْسَاوِيًّا أَرْغَمَهُ عَلَى إِصَابَةِ
            تُفَّاحَةٍ مَوْضُوعَةٍ فَوْقَ رَأْسِ ابْنِهِ بِقَوْسِهِ الْمُسْتَعْرَضِ، فَنَجَحَ
            دُونَ أَنْ يُلْحِقَ بِهِ أَذًى، وَغَدَا رَمْزًا خَالِدًا لِلتَّحَرُّرِ الْوَطَنِيِّ
            فِي التُّرَاثِ السُّوَيْسَرِيِّ.

