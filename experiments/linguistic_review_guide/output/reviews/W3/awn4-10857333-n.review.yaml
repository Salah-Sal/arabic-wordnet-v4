# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10857333-n  |  ILI: i94401  |  POS: n
# الموضوع: مِيخَائِيل بَارِيشْنِيكُوف — راقص باليه روسي
# تاريخ المراجعة: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "الاسم باريشنيكوف يحتمل تهجيات بديلة في العربية بسبب غياب مرجعية تعريب رسمية موحَّدة للأسماء الروسية"
      - "المجموعة تمثّل اسم علم لشخصية بعينها؛ مما يحصر خيارات التوليد المصطلحي في التعريب الصوتي دون إمكانية للاشتقاق أو المجاز"
      - "التعريف العربي الحالي يفتقر إلى التخصيص الفني (الباليه لا الرقص عموماً) وإلى المعلومات الموسوعية الجوهرية (مدينة الميلاد، طبيعة الهجرة)"
    observations: >
      هذه المجموعة الترادفية خاصة بشخصية راقص الباليه الروسي الشهير ميخائيل باريشنيكوف.
      طبيعة الأسماء العلمية الأجنبية تستدعي التعريب الصوتي (phonetic arabization) لا الاشتقاق أو المجاز؛
      إذ لا يمكن إحياء لفظ عربي قديم لمفهوم هو اسم علم لشخصية بعينها. ومن ثَمَّ فالمرشحات الممكنة هي
      صيغ بديلة لتعريب الاسم الروسي Baryshnikov وبيان ترتيب مكوّناته فحسب. اللمّات الموجودة
      مقبولة من حيث الجوهر لكنها تحتاج ضبطاً بالشكل الكامل.

  blind_candidates:
    - lemma: "بَارِيشْنِيكُوف"
      generation_method: taarib
      justification: "التعريب الصوتي للّقب الروسي Baryshnikov مجرداً دون الاسم الأول، وهي الصيغة المتداولة في الإعلام العربي للإشارة إلى هذا الراقص اختصاراً"
    - lemma: "مِيخَائِيل بَارِيشْنِيكُوف"
      generation_method: tarkib
      justification: "التركيب الاسمي الكامل: الاسم الأول ميخائيل (معرَّب من العبرية عبر الروسية بمعنى «من مثل الرب») مع اللقب الروسي المعرَّب؛ يُستخدم في السياقات الرسمية والتعريفية والأكاديمية"
    - lemma: "بَارِيشْنِيكُوف مِيخَائِيل"
      generation_method: taarib
      justification: "ترتيب الاسم وفق التقليد الروسي الأصلي (اللقب أولاً ثم الاسم)، قد يرد في مصادر عربية مترجمة مباشرةً من الروسية"
    - lemma: "مِيخَايِيل بَارِيشْنِيكُوف"
      generation_method: taarib
      justification: "صيغة بديلة لتعريب الاسم الأول Mikhail بياء مزدوجة بدلاً من الهمزة، ترد أحياناً في مصادر عربية متأثرة بالنطق الإنجليزي للاسم الروسي"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   ق١: مطابقة دقيقة دفعية لجميع اللمّات + المرشحات → صفر نتائج مباشرة
#   ق٢: جسر إنجليزي (Baryshnikov / Mikhail Baryshnikov) → صفر نتائج
#   ق٣: FTS عربي (باريشنيكوف، ميخائيل) → وجد مداخل عن "ميخائيل" في موسوعة الأسماء فقط
stage2_evidence:
  per_lemma:
    - lemma: "بَارِيشْنِيكُوف"
      evidence_status: "no_material_found"

    - lemma: "مِيخَائِيل بَارِيشْنِيكُوف"
      expands:
        - text: "«ميخائيل: عن العبرية بمعنى من مثل الرب وهو اسم لأحد الملائكة. يستخدم للذكور»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُثبت أصل الاسم الأول ميخائيل ومعناه العبراني، مما يؤكد صحة صيغة التعريب المستخدمة لمكوّن الاسم الأول في هذه اللمّة المركبة"

    - lemma: "بَارِيشْنِيكُوف مِيخَائِيل"
      evidence_status: "no_material_found"

    - lemma: "مِيخَايِيل بَارِيشْنِيكُوف"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: اللقب المجرد ──
    - lemma: "باريشنيكوف"
      decision: confirmed
      decision_reason: >
        اللقب المجرد بَارِيشْنِيكُوف هو الصيغة الأكثر تداولاً في الصحافة العربية والنقد الفني
        للإشارة إلى هذا الراقص. تعريب الـ B بالباء، وتعريب الـ sh بالشين، ووضع ضمة على الكاف
        وفتح الواو مطابق للنطق الروسي الأصلي Baryshnikov [bɐˈrɨʂnʲɪkəf]. اللمّة تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستخدم للإشارة إلى الراقص بلقبه المجرد في السياقات الإعلامية والنقدية المختصرة، حيث يُكتفى باللقب دون الاسم الأول كما هو شائع في الكتابة الصحفية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَارِيشْنِيكُوف"

    # ── لمّة موجودة: الاسم الكامل ──
    - lemma: "ميخائيل باريشنيكوف"
      decision: confirmed
      decision_reason: >
        الاسم الكامل مِيخَائِيل بَارِيشْنِيكُوف ضروري للتعريف الموسوعي وللتمييز الدقيق
        عن شخصيات أخرى تحمل اللقب. صيغة «ميخائيل» بالهمزة هي التعريب الراسخ للاسم الأول
        Mikhail وتوافق الصيغ العبرانية الأصلية (מִיכָאֵל) التي دخلت العربية قديماً.
        اللمّة تعبير مركب إضافي يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُستخدم الاسم الكامل في السياقات الرسمية والأكاديمية والتعريفية حين يُراد تحديد هوية الشخص بشكل تام لا مجرد الإحالة إليه اختصاراً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيخَائِيل بَارِيشْنِيكُوف"

    # ── مرشح المرحلة ١: ترتيب مقلوب ──
    - lemma: "بَارِيشْنِيكُوف مِيخَائِيل"
      source: stage1
      decision: removed
      decision_reason: >
        ترتيب اللقب قبل الاسم الأول غير مألوف في العربية ويخالف طريقتها المعيارية في ترتيب مكوّنات
        الاسم العلم (الاسم الأول يسبق اللقب). هذا الترتيب لا يُستخدم إلا في السياقات الببليوغرافية
        الأكاديمية وليس معجمياً مُعتمَداً.

    # ── مرشح المرحلة ١: تعريب بديل غير معياري ──
    - lemma: "مِيخَايِيل بَارِيشْنِيكُوف"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة «مِيخَايِيل» بالياء المضاعفة بدلاً من الهمزة غير موحَّدة وغير راسخة في المصادر
        العربية المعيارية؛ وتعريب الاسم Mikhail بالهمزة (مِيخَائِيل) هو الأصح لأنه يعكس
        الأصل العبراني للاسم (מִיכָאֵל) الذي دخل العربية قديماً بصيغة مستقرة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "راقص ومصمم رقصات روسي هاجر إلى الولايات المتحدة (ولد عام 1948)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في إطاره العام لكنه يفتقر إلى: (١) التخصيص الفني الدقيق — فالمقصود
        راقص الباليه تحديداً لا الرقص عموماً، (٢) مدينة الميلاد (ريغا، لاتفيا السوفيتية آنذاك)،
        (٣) طبيعة الهجرة — فقد كانت انشقاقاً سياسياً لا مجرد هجرة اعتيادية، مما يُعدّ جزءاً
        جوهرياً من هوية الشخصية الموسوعية. لا ينبغي الاكتفاء بتعريف مقتضب لشخصية بهذه الأهمية.
    authored:
      - type: encyclopedic
        text: "راقصُ باليهٍ روسيٌّ بارزٌ ومصمِّمُ رقصاتٍ، وُلد في ريغا سنة 1948م، وانشقَّ عن الاتحاد السوفيتي سنة 1974م واستوطن الولايات المتحدة الأمريكية، ويُعدّ من أعظم راقصي الباليه في القرن العشرين"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "راقصُ باليهٍ روسيٌّ بارزٌ ومصمِّمُ رقصاتٍ، وُلد في ريغا سنة 1948م، وانشقَّ عن الاتحاد السوفيتي سنة 1974م واستوطن الولايات المتحدة الأمريكية، ويُعدّ من أعظم راقصي الباليه في القرن العشرين"

  examples:
    per_lemma:
      - lemma: "بَارِيشْنِيكُوف"
        examples:
          - text: "أبهر بَارِيشْنِيكُوف جمهورَ الباليه في نيويورك بقفزاته الاستثنائية وسيطرته المتناهية على حركة الجسد"
            type: usage
      - lemma: "مِيخَائِيل بَارِيشْنِيكُوف"
        examples:
          - text: "غادر مِيخَائِيل بَارِيشْنِيكُوف الاتحادَ السوفيتيَّ سنة 1974م وانضمَّ إلى كبرى فرق الباليه الأمريكية، فصار أيقونةً للرقص الكلاسيكي في العالم الغربي"
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أبهر بَارِيشْنِيكُوف جمهورَ الباليه في نيويورك بقفزاته الاستثنائية وسيطرته المتناهية على حركة الجسد"
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "غادر مِيخَائِيل بَارِيشْنِيكُوف الاتحادَ السوفيتيَّ سنة 1974م وانضمَّ إلى كبرى فرق الباليه الأمريكية، فصار أيقونةً للرقص الكلاسيكي في العالم الغربي"


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:
  per_entry:
    # اسم روسي معرَّب — لا جذر عربي، لا اقتباس من مقاييس اللغة
    - lemma: "بَارِيشْنِيكُوف"
      entry_id: "{auto}"
      # root: لا ينطبق — اسم علم أجنبي معرَّب عن الروسية
      # maqayis_quote: لا ينطبق — لا جذر عربي

    # اسم علم مركب — مكوّناه كلاهما أجنبيا الأصل
    - lemma: "مِيخَائِيل بَارِيشْنِيكُوف"
      entry_id: "{auto}"
      # roots: لا تنطبق — مِيخَائِيل من العبرية، بَارِيشْنِيكُوف من الروسية، كلاهما بلا جذر عربي

