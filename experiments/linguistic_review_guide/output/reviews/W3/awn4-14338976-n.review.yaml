        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نُفَاخ"

    - lemma: "حَبَط"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح عربي تراثي أصيل ورد في الحديث النبوي الشريف ومقاييس اللغة والمعجم الوسيط والمعجم الكبير والصحاح والمعجم البيطري الموحد بمعنى انتفاخ بطن الدابة من كثرة الأكل تحديداً، وهو المعنى المطلوب بالضبط. أقوى دليل تراثي متاح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "حَبَط مصطلح تراثي يدل تحديداً على انتفاخ بطن الدابة من كثرة الأكل أو أكل ما لا يوافقها، وهو أخصّ من نُفَاخ وأدقّ في وصف الحالة البيطرية. مرتبط بسياق الرعي والماشية."
      actions:
        - command: create_entry
          params:
            lemma: "حَبَط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حُبَاط"
      source: stage1
      decision: removed
      decision_reason: "لم يُثبت كمدخل مستقل في المعاجم الكلاسيكية. وُجد فقط ضمن مدخل مركب في المعجم البيطري الموحد (2010) مع مرادفات أخرى. لا أدلة كافية على تثبيته المعجمي كوحدة مستقلة."

    - lemma: "تَطَبُّل"
      source: stage1
      decision: removed
      decision_reason: "مصطلح طبي عام يدل على انتفاخ البطن بالغازات عند الإنسان والحيوان (tympany/tympanites)، وليس مقصوراً على الحالة البيطرية. تخصيصه يتطلب تقييداً مثل «تطبل المعدة في الماشية». هو أقرب إلى المفهوم الأعمّ (hypernym) منه إلى هذه المجموعة المحددة."

    - lemma: "نَفْخَة"
      source: stage1
      decision: removed
      decision_reason: "في المصطلحية الطبية والبيطرية الموحدة الحديثة، النفخة تعني النفخة القلبية (murmur) لا الانتفاخ الغازي. رغم ورود المعنى القديم في المعاجم الكلاسيكية والمورد الحديث، فإن التعارض مع المصطلحية المعاصرة يجعلها مربكة في السياق البيطري."

