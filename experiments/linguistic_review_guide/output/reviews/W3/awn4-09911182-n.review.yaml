# المفهوم: canonist (متخصص في القانون الكنسي)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة الموجودة (متخصص في القانون الكنسي) مطابقة للتعريف حرفياً، مما يجعلها تعريفاً مدوَّراً لا مصطلحاً مسكوكاً"
      - "المجموعة تفتقر إلى أي مصطلح عربي موحَّد أو مسكوك للمفهوم"
      - "المفهوم ينتمي إلى الفقه المسيحي ومن ثَمَّ يفتقر إلى رصيد تراثي إسلامي في المعاجم العربية الكلاسيكية"
      - "غياب التشكيل الكامل عن اللمّة الموجودة"
    observations: >
      مفهوم «الكانونيست» يشير إلى عالم متخصص في القانون الكنسي، أي التشريع الذي يُنظِّم
      الكنيسة المسيحية. يقع المفهوم في فراغ معجمي واضح في العربية، إذ لم تُفرز الثقافة
      العربية الإسلامية مصطلحاً أحادياً لهذا المتخصص. يعرَّف «الفقيه» في المعجم الوسيط
      بأنه «العالم بأصول الشريعة وأحكامها»، لكنه مقيَّد بالشريعة الإسلامية دلالةً وممارسةً.
      يبدو أن أقرب المناهج هو التركيب الوصفي أو الإضافي باستخدام «عالم/متخصص» مقرونةً
      بالصفة «الكنسي». كلمة «كنيسة» (ومنها الصفة «كنسي») لفظ معرَّب عن الآرامية «كنيشتا»
      بمعنى الجماعة، وتختلف عن الجذر العربي «كنس» (كنْس البيت) اختلافاً تاماً.
  blind_candidates:
    - lemma: "فَقِيهٌ كَنَسِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «فقيه» بمعنى عالم الشريعة، و«كنسي» نسبةً إلى الكنيسة، قياساً
        على «الفقيه الإسلامي». غير أن (فقيه) تحمل خصوصية إسلامية راسخة، مما قد يوقع
        في التباس حين تُطلق على متخصص في الفقه المسيحي.
    - lemma: "عَالِمُ الشَّرِيعَةِ الْكَنَسِيَّةِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «عالم» الدالة على الرسوخ في العلم، مضافاً إلى «الشريعة الكنسية».
        «عالم» أوسع دلالةً من «فقيه» وأقل تخصيصاً إسلامياً، فهي تصلح للتخصص في أي
        منظومة تشريعية. لكن «الشريعة» نفسها تحمل شيئاً من الإيحاء الإسلامي.
    - lemma: "قَانُونِيٌّ كَنَسِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «قانوني» بمعنى الخبير القانوني الممارس في الاستعمال الحديث،
        و«كنسي» نسبةً إلى الكنيسة. يؤكد الجانب المهني والتطبيقي أكثر من الجانب
        الأكاديمي البحثي.
    - lemma: "كَانُونِيسْتُ"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الإنجليزي «canonist»، يقبل ال- والنسبة والجمع السالم
        (كانونيستون/كانونيستات). ملاذ أخير عند إخفاق التوليد العربي الأصيل.


stage2_evidence:
  per_lemma:
    - lemma: "متخصص في القانون الكنسي"
      expands:
        - text: "«العالِم بالقانون الكنسيّ.»"
          source: "المورد الحديث (2008)"
          addition: >
            يقدم المورد الحديث صياغة بديلة للمفهوم ذاته باستخدام «العالم بـ» عوضاً عن
            «المتخصص في»، مما يؤكد قبول هذه البنية التركيبية لتأدية المعنى في معجم عربي
            حديث معتمد.

    - lemma: "فَقِيهٌ كَنَسِيٌّ"
      confirm:
        - text: "«(الْفَقِيه) الْعَالم الفطن والعالم بأصول الشَّرِيعَة وأحكامها واستعمل فِيمَن يقْرَأ الْقُرْآن ويعلمه (ج) فُقَهَاء»"
          source: "المعجم الوسيط (حوراماني)"
      contradicts:
        - text: "«الفقيهُ هو الزاهد في الدنيا الراغبُ في الآخرة، البصير بذنبه المداوم على عبادة ربه، الورعُ الكافُّ عن أعراض المسلمين»"
          source: "التعريفات الفقهية للبركتي"
          conflict: >
            دلالة «الفقيه» مقيدة بالشريعة الإسلامية والسياق الديني الإسلامي. إطلاقها
            على متخصص في القانون الكنسي المسيحي يُوقع في التباس ثقافي وديني.
      expands:
        - text: "«(فَقَهَ) الْفَاءُ وَالْقَافُ وَالْهَاءُ أَصْلٌ وَاحِدٌ صَحِيحٌ، يَدُلُّ عَلَى إِدْرَاكِ الشَّيْءِ وَالْعِلْمِ بِهِ. تَقُولُ: فَقِهْتُ الْحَدِيثَ أَفْقَهُهُ. وَكُلُّ عِلْمٍ بِشَيْءٍ فَهُوَ فِقْهٌ. يَقُولُونَ: لَا يَفْقَهُ وَلَا يَنْقَهُ. ثُمَّ اخْتُصَّ بِذَلِكَ عِلْمُ الشَّرِيعَةِ، فَقِيلَ لِكُلِّ عَالِمٍ بِالْحَلَالِ وَالْحَرَامِ: فَقِيهٌ»"
          source: "مقاييس اللغة لابن فارس (مادة فقه)"
          addition: >
            يكشف ابن فارس أن «الفقه» أصله الإدراك والعلم المطلق ثم اختُص بعلم الشريعة
            الإسلامية. الأصل العام قد يُجيز التوسيع، لكن الاستعمال الراسخ يأبى ذلك.

    - lemma: "عَالِمُ الشَّرِيعَةِ الْكَنَسِيَّةِ"
      confirm:
        - text: "«العالِم بالقانون الكنسيّ.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(عَلَمَ) الْعَيْنُ وَاللَّامُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ، يَدُلُّ عَلَى أَثَرٍ بِالشَّيْءِ يَتَمَيَّزُ بِهِ عَنْ غَيْرِهِ... وَالْعِلْمُ: نَقِيضُ الْجَهْلِ، وَقِيَاسُهُ قِيَاسُ الْعَلَمِ وَالْعَلَامَةِ»"
          source: "مقاييس اللغة لابن فارس (مادة علم)"
          addition: >
            «عالم» مشتق من جذر عربي أصيل يدل على الأثر والتمييز والمعرفة، وهو أعم
            من «فقيه» ولا يحمل تخصيصاً دينياً، مما يجعله أصلح للتركيب مع «الكنسي».

    - lemma: "قَانُونِيٌّ كَنَسِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "كَانُونِيسْتُ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "متخصص في القانون الكنسي"
      decision: confirmed
      decision_reason: >
        اللمّة وإن كانت مطابقة للتعريف (إشكالية التعريف الدائري)، فإنها تبقى المصطلح
        الوحيد المتاح في المجموعة الأصلية، والمورد الحديث يؤكد هذه البنية التعبيرية
        (عالم/متخصص + القانون الكنسي). يُبقى عليها مع تصحيح التشكيل وتوثيق طابعها
        الوصفي. الفراغ المعجمي الحقيقي يُبرر الإبقاء على الجملة الوصفية كلمّة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يركز على التخصص الأكاديمي والمهني بصورة عامة دون الإشارة الصريحة إلى العلم
        العميق؛ وزنه الدلالي «المتخصص» (specialist) يوازي hypernym المجموعة (أخصائي).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَخَصِّصٌ فِي الْقَانُونِ الْكَنَسِيِّ"

    - lemma: "فَقِيهٌ كَنَسِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «فقيه» تحمل دلالة راسخة في الشريعة الإسلامية، وقد أكدت التعريفات الفقهية
        والمقاييس اختصاصها بالعلم بالحلال والحرام في الإسلام. إطلاقها على متخصص في
        القانون الكنسي المسيحي يُحدث التباساً ثقافياً ودينياً غير مقبول. مرفوضة.
      evidence_assessment:
        case: mixed

    - lemma: "عَالِمُ الشَّرِيعَةِ الْكَنَسِيَّةِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        المورد الحديث يوثّق «العالم بالقانون الكنسي» = canonist، مما يؤكد بنية «عالم +
        القانون الكنسي». غير أن «الشريعة» تحمل شيئاً من الإيحاء الإسلامي، لذا يُصحَّح
        المرشح إلى «عَالِمٌ بِالْقَانُونِ الْكَنَسِيِّ» توافقاً مع المورد واتقاءً للالتباس.
        «عالم» جذره عربي أصيل (علم) دون تخصيص ديني، ويدل على الرسوخ في المعرفة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يؤكد عمق المعرفة والرسوخ العلمي (scholar) أكثر من مجرد التخصص؛ «العالم بـ»
        في العربية تدل على الإحاطة بالموضوع علماً متقناً، موثقة في المورد الحديث.
      actions:
        - command: create_entry
          params:
            lemma: "عَالِمٌ بِالْقَانُونِ الْكَنَسِيِّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "قَانُونِيٌّ كَنَسِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد أي أدلة معجمية تدعم هذا المصطلح. علاوةً على ذلك، «قانوني» في العربية
        المعاصرة يدل على الممارس القانوني (lawyer/jurist) أكثر من العالم الباحث (scholar)،
        مما يُحدث تحولاً دلالياً عن المفهوم الأصلي «canonist» = scholar. والبنية تفشل
        اختبار الاستبدال (قانوني → حقوقي) بلا تغيير في المعنى، فهي وصف لا مصطلح.
      evidence_assessment:
        case: no_material

    - lemma: "كَانُونِيسْتُ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية ولا استعمال موثق في المصادر العربية. ولا ضرورة للتعريب مع وجود
        بدائل عربية مقبولة (عالم بالقانون الكنسي / متخصص في القانون الكنسي).
      evidence_assessment:
        case: no_material


