  # أدلة سياقية — المفهوم المرتبط بالشخصية
  context_evidence:
    - term: "البراغماتية / الذرائعية"
      expands:
        - text: >
            «(1) الاستشراف العمليّ [للأمور والمشكلات]
            (2) الذَّرائعية؛ البراغماتية؛ فلسفة الذرائع: فلسفة أميركية تتّخذ من
            النتائج العملية مقياسًا لتحديد قيمة الفكرات وصدقها.»
          source: "المورد الحديث (2008)"
          addition: >
            يؤكد أن البراغماتية/الذرائعية مذهب فلسفي أمريكي وهو المذهب المرتبط
            بهذه الشخصية؛ كما يُثبت المصطلح العربي المعادل «الذرائعية»
        - text: "«براغماتية، ذرائعية»"
          source: "مسرد الفلسفة وعلم النفس — المنظمة العربية للتربية والثقافة والعلوم"
          addition: >
            يُثبت الاقتران المعياري بين «براغماتية» (دخيل) و«ذرائعية» (عربي)
            في المصادر المرجعية الفلسفية العربية


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
