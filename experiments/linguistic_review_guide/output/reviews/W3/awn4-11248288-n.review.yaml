# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'تشارلز بيرس' تفتقر إلى التشكيل الكامل المطلوب"
      - "الاسم الكامل الرسمي 'تشارلز ساندرز بيرس' غائب كصيغة بديلة مع أنه الأكثر دقةً توثيقياً"
      - "الاسم العائلي 'بيرس' منفرداً غائب مع شيوع استخدامه في المراجع الأكاديمية العربية المختصرة"
      - "صنف الكلمة في المدخل ينبغي أن يكون proper_noun لا noun عادياً"
      - "التعريف يورد مصطلح 'البراغماتية' دون مقابله العربي 'الذرائعية' الذي أقرّه مجمع اللغة"
    observations: >
      هذه المجموعة تُمثّل اسم عَلَم لشخص بعينه، وهو فيلسوف ومنطقي أمريكي اشتُهر بتأسيس
      مذهب البراغماتية (الذرائعية) في الفلسفة. عاش بين عامَي (١٨٣٩-١٩١٤). الأسماء الأعلام
      الأجنبية من هذا القبيل لا سبيل إلى اشتقاقها من جذور عربية فهي تخضع حصراً لاصطلاح
      النقل الصوتي (التعريب الصوتي). الأولى في مثل هذه الحالات: (أ) تثبيت الاسم المختصر
      الأكثر تداولاً كلمّة رئيسية، (ب) إضافة الاسم الكامل والكنية المنفردة كصيغ بديلة،
      (ج) تصحيح التشكيل وضبط صنف الكلمة.
  blind_candidates:
    - lemma: "تَشارلز بِيرس"
      generation_method: taarib
      justification: >
        التعريب الصوتي للاسم المختصر Charles Peirce؛ أشيع صيغة في الأدبيات الفلسفية
        واللغوية العربية المعاصرة عند الإحالة إلى هذا الفيلسوف
    - lemma: "تَشارلز سَانْدِرز بِيرس"
      generation_method: taarib
      justification: >
        التعريب الصوتي للاسم الكامل Charles Sanders Peirce؛ ضروري للدقة التوثيقية ولا
        سيما في المصادر الأكاديمية والمعجمية المتخصصة
    - lemma: "بِيرس"
      generation_method: taarib
      justification: >
        الاسم العائلي منفرداً كما يُحال إليه في الأدبيات الفلسفية والمنطقية العربية
        المختصرة، على غرار استخدام «كانط» و«هيغل» و«ديوي» منفردةً
    - lemma: "شَارلز بِيرس"
      generation_method: taarib
      justification: >
        صيغة بديلة محتملة تحذف حرف التاء في مستهلّ الاسم؛ واردة في بعض الترجمات العربية
        وإن كانت أقل شيوعاً من صيغة «تشارلز»


