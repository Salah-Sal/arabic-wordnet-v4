      decision: confirmed
      decision_reason: >
        اللمّة هي التعريب الصوتي الصحيح للاسم المختصر الشائع، وهي المعادل العربي
        الأكثر تداولاً في الأدبيات الفلسفية والمعجمية. يُؤكَّد إبقاؤها مع تصحيح
        التشكيل وتحديث صنف الكلمة وإضافة الصيغ البديلة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة المختصرة الأكثر شيوعاً في المراجع الأكاديمية العربية (الاسم الأول +
        الكنية)؛ تُمثّل اللمّة الرئيسية للمدخل
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشارلز بِيرس"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "تَشارلز سَانْدِرز بِيرس"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "بِيرس"

    - lemma: "تَشارلز سَانْدِرز بِيرس"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الكامل يُضاف كصيغة بديلة (add_form) ضمن مدخل «تَشارلز بِيرس» لا
        كلمّة مستقلة؛ إذ اللمّات الرئيسية للأسماء الأعلام تُمثَّل بأقصر شكل
        شائع في الاستعمال.

    - lemma: "بِيرس"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم العائلي منفرداً يُضاف كصيغة بديلة (add_form) ضمن مدخل «تَشارلز بِيرس»
        لا كمدخل مستقل، تحاشياً للالتباس مع أسماء أشخاص آخرين تحمل الكنية ذاتها.

    - lemma: "شَارلز بِيرس"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة أقل دقةً صوتية؛ الصيغة المُثبَّتة في الموارد الفلسفية العربية هي
        «تَشارلز» (بالتاء في المستهل) التي تعكس نطق ch الإنجليزية بصورة أقرب.
        لا يُوصى بإضافتها لتجنّب التشتيت المعجمي.


