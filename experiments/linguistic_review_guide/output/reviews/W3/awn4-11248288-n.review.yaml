        التعريف الحالي مقتضب ويعتمد على المصطلح الدخيل «براغماتية» دون ذكر المقابل
        العربي «الذرائعية» المعتمد في المصادر المرجعية. كما يغفل الاسم الكامل
        وإسهاماته البارزة في السيميائية والمنطق الرياضي.
    authored:
      - type: encyclopedic
        text: >
          تَشارلز سَانْدِرز بِيرس (1839-1914): فيلسوف ومنطقي أمريكي، يُعدّ أحد
          مؤسسي الفلسفة البراغماتية (الذرائعية)، ومن رواد علم السيميائية
          (علم الإشارات). اشتُهر بإسهاماته في المنطق الرياضي وفلسفة العلوم،
          وقد أرسى المبادئ الأساسية للذرائعية التي طوّرها من بعده ويليام جيمس
          وجون ديوي.
