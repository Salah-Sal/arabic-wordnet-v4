    concerns:
      - "الاكتفاء بلمّة واحدة لمجموعة ترادفية تمثّل مَعْلماً جغرافياً عالمياً."
    observations: "المجموعة تشير إلى مَعْلم جغرافي محدد (خليج أوساكا)، واللمّة الموجودة صحيحة وشائعة الاستخدام في المراجع الجغرافية العربية. التعريف العربي الحالي هو ترجمة مباشرة للتعريف الإنجليزي."
  blind_candidates:
    - lemma: "خَلِيج أُوسَاكَا"
      generation_method: tarkib
      justification: "الاسم الجغرافي القياسي للخليج المنسوب لمدينة أوساكا اليابانية."
    - lemma: "جَوْن أُوسَاكَا"
      generation_method: tarkib
      justification: "استخدام 'جون' كمرادف لخليج في بعض التقسيمات الجغرافية، وإن كان أقل شيوعاً لهذا المَعْلم."
    - lemma: "بَحْر أُوسَاكَا"
      generation_method: majaz
      justification: "تسمية مجازية تاريخية لبعض الخلجان الكبيرة في اليابان (مثل البحر الداخلي)، لكنها غير دقيقة تقنياً هنا."
    - lemma: "خَلِيج نَانِيوَا"
      generation_method: tarkib
      justification: "استخدام الاسم القديم لمدينة أوساكا (نانيوا) لإحياء التسمية التراثية المرتبطة بالمكان."

