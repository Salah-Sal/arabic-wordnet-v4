stage2_evidence:
  per_lemma:

    - lemma: "مقاتل شوارع"
      evidence_status: "no_material_found"
      # المركّب ككلّ غير مسجَّل في أي مصدر معجمي. الجسر الإنجليزي أعاد
      # «المُعارِك؛ المُشاجِر؛ المُقاتِل» لـ"scrapper" (المورد الحديث 2008)
      # لكن ذلك يُثبت عدم استقرار «مقاتل شوارع» كوحدة معجمية عربية.

    - lemma: "منافس شرس"
      confirm:
        - text: "«مُنَافِس: competitor»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
        - text: "«مُنَافِسٌ: competitor»"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية (2020) — ARABTERM"
        - text: "«شَرِسَ شَرَساً وشَرَاسَةً: ساءَ خُلُقُه واشتدَّ خِلافُه، فهو شَرِسٌ وأشرسُ»"
          source: "المعجم الوسيط"
        - text: "«شرُسَ فلانٌ: ساء خُلُقُه، واشتدّ خلافُه، كان فظًّا غليظ الطّبع — ردّ عليه بشراسة — تاجر شَرِس»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«الشَّرَاسَةُ: شِدَّةُ أكلِ الماشيةِ. وإنه لَشَرِسُ الأكل»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "تأكيد على دلالة النهَم والشراهة في الإتيان على الشيء، مما يعزز مفهوم التنافس الشرس."
        - text: "«تَشَارَسُوا: تَعَادَوْا»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الفعل التشاركي «تشارس» يدل على التعادي المتبادل، وهو ما يغطّي الديناميكية التنافسية."

    - lemma: "شَرِسٌ"
      confirm:
        - text: "«الشَّرِسُ: الجرىءُ فى القِتَال الشَّدِيد»"
          source: "المعجم الكبير (OCR)"
        - text: "«الأشرسُ: الجريءُ في القِتالِ، والأسَدُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«رجلٌ شَرِسٌ وشَريسٌ وأشرسُ: عَسِرُ الخُلُق شديدُ الخلاف»"
          source: "لسان العرب لابن منظور"
        - text: "«الشَّرِيسُ: الشَّكِسُ الْكَثِيرُ الْخِلَافِ. وَالْأَشْرَسُ: الرَّجُلُ الْجَرِيءُ عَلَى الْقِتَالِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«فيه شكاسة وشراسة، وهو عسر شرس. ومارسه فشارسه»"
          source: "أساس البلاغة للزمخشري"
        - text: "«هم أعظمنا خميساً وأشدّنا شريساً، أي شراسةً أي نفوراً وسوء خلق»"
          source: "النهاية في غريب الحديث لابن الأثير"
        - text: "«شَرِسٌ: من (ش ر س) السيئُ الخلق الشديدُ الخلاف»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«المُشَارَسَةُ والشِّراسُ: الشِّدَّةُ في المُعاملَةِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يُثبت استخدام الجذر للدلالة على الشدة في التعامل مع الآخرين، وهو ما يغطّي الجانب الإجرائي للمفهوم."

    - lemma: "مُخَاتِلٌ"
      confirm:
        - text: "«مُخاتِل: insidious»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
        - text: "«ختَله يَخْتُله ويَخْتِله خَتْلاً: خَدَعه عن غَفلةٍ»"
          source: "لسان العرب لابن منظور"
        - text: "«خَتَله وخاتَله: خدَعه. والتخاتل: التخادع»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«الدنيا غرارة غدارة، ختّالة ختارة»"
          source: "أساس البلاغة للزمخشري"
      contradicts:
        - text: "«وفي أشراط الساعة: وأن تُختَل الدُّنيا بالدِّين، أي تُطلَب الدنيا بعمل الآخرة»"
          source: "النهاية في غريب الحديث لابن الأثير"
          conflict: "الجذر ختل يُوظَّف أساساً في سياقات الخداع والتخفّي والتربّص، لا في سياق التنافس العدواني المباشر. «مُخَاتِل» يغطّي البُعد التخفّي/الخداعي فحسب ويخلو من الإطار التنافسي الصريح ومن دلالة الشراسة والعدوانية."

    - lemma: "مُشَاكِسٌ"
      expands:
        - text: "«شَاكَسَ فلانٌ فلانًا: غاضَبَه وعاسَرَه»"
          source: "المعجم الكبير (OCR)"
          addition: "يُثبت دلالة المعاندة وإيقاع الصعوبة، لكنه لا يشمل الأساليب الملتوية أو الإطار التنافسي."


