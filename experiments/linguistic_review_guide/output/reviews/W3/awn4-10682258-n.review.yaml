stage1_review:
  assessment:
    concerns:
      - "لمّة «مقاتل شوارع» ترجمة حرفية (calque) لـ «street fighter» تحيل في العربية أولاً للمعنى الجسدي المباشر (المقاتل في الشوارع) لا للمعنى المجازي المقصود (المنافس الشرس الملتوي)، وهي تفشل اختبار التثبيت المعجمي."
      - "لمّة «منافس شرس» عبارة وصفية حرة لا تعبير اصطلاحي مسكوك؛ تفشل اختبار السكّ (يمكن إبدال «شرس» بـ«عدواني» وتبقى وصفاً صحيحاً)."
      - "كلتا اللمّتين مفتقرتان للتشكيل الكامل."
      - "التعريف «متسابق» أضيق من «contestant/منافس»؛ المفهوم يشمل أي منافسة لا السباقات وحدها."
      - "المجموعة تفتقر إلى لمّة مفردة مسكوكة تغطي البُعد الجوهري للمفهوم."
    observations: >
      المفهوم المستهدف هو «المنافس بالغ الشراسة المستعدّ لاستخدام الحيل الملتوية»،
      وهو مفهوم معروف في ثقافة المنافسة العربية دون مصطلح فردي مخصّص مستقرّ.
      الجذر (ش ر س) موثَّق توثيقاً عميقاً في المعجمية العربية الكلاسيكية والحديثة بدلالة
      سوء الخلق وشدة الخلاف والجرأة على القتال، ويُعدّ المسكن الاشتقاقي الطبيعي للمفهوم.
      اللمّتان الحاليتان تصفان المفهوم وصفاً دقيقاً لكنهما ليستا وحدتَيْن معجميتَيْن ثابتتَيْن.

  blind_candidates:
    - lemma: "شَرِسٌ"
      generation_method: majaz
      justification: >
        الصفة المشبّهة «شَرِسٌ» (من جذر ش ر س) تُستخدم في العربية المعاصرة اسماً وصفةً
        للدلالة على الشديد العدوانية سيئ الخُلُق. إحياءٌ للاستخدام الكلاسيكي الموثَّق
        «الأشرسُ: الجريء على القتال» مع إزاحة دلالية نحو سياق المنافسة. يمتاز بالإيجاز
        والجذرية وغياب الاشتراك اللفظي في هذا السياق.

    - lemma: "مُخَاتِلٌ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من خَاتَلَ (جذر خ ت ل)، بمعنى الخادع المتخفّي المتربّص.
        يغطّي البُعد الثاني للمفهوم: «الاستعداد لاستخدام أساليب ملتوية».
        الوزن مُفَاعِل يناسب الفاعلية الدائمة. محاولة لتغطية الجانب المُدان أخلاقياً.

    - lemma: "مُنَافِسٌ شَرِسٌ"
      generation_method: tarkib
      justification: >
        مركّب وصفي (wasfi) يجمع «مُنَافِس» (الجنس القريب) و«شَرِس» (الفصل النوعي).
        يحقّق الشرطَيْن الدلاليَّيْن: الإطار التنافسي + الشراسة. توليد مستقلّ تحقّق لاحقاً
        أنه يتطابق مع إحدى اللمّات الموجودة، مما يُعزّز صحة اختيار المفرَدَتَيْن.

    - lemma: "مُشَاكِسٌ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من شَاكَسَ (جذر ش ك س)، بمعنى من يغاضب ويعاسر.
        يحمل معنى المعاندة والصعوبة في التعامل لكنه لا يشتمل صريحاً على الأساليب الملتوية.


