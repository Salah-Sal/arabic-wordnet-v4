      reason: >
        «متسابق» أضيق من المراد؛ المفهوم يشمل المنافسة في أي ميدان لا السباقات وحدها.
        «عدواني جداً» وصف دقيق لكنه ركيك أسلوبياً. «أساليب ملتوية» صحيح لكن يمكن
        تعميقه بإضافة «غير نزيهة» للتمييز الأخلاقي الصريح. التعريف الحالي يبدو ترجمةً
        حرفية من الإنجليزية، والمطلوب صياغة بأسلوب المعجم الوسيط.
