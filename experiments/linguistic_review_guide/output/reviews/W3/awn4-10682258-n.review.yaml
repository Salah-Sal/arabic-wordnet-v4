stage3_analysis:
  per_lemma:

    - lemma: "مقاتل شوارع"
      decision: removed
      decision_reason: >
        تفشل اللمّة اختبارَيْ التثبيت المعجمي والسكّ: لا وجود لها في المعاجم كوحدة معجمية
        ثابتة، ويمكن إبدال «شوارع» بـ«أزقّة» أو «مدن» مع بقاء التعبير وصفاً صحيحاً.
        فضلاً عن ذلك فهي ترجمة حرفية (calque) من «street fighter» تُحيل أولاً في الوعي
        اللغوي العربي إلى المعنى الجسدي المباشر (المقاتل الذي يتشاجر في الشوارع)،
        لا إلى المعنى المجازي المقصود (المنافس الشرس الملتوي). يُزيل «remove_sense»
        الربطَ بالمجموعة دون حذف المدخل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "منافس شرس"
      decision: confirmed
      decision_reason: >
        رغم أن المركّب عبارة وصفية لا تعبير اصطلاحي مسكوك (يفشل اختبار السكّ)، إلا أنه
        يُعدّ أدقّ تمثيل عربي متاح للمفهوم: فمكوّن «مُنَافِس» يُحدّد الإطار الدلالي
        (المنافسة) ومكوّن «شَرِس» يُحدّد الفصل النوعي (الشراسة والعدوانية).
        تحقّق توليده المستقل في المرحلة العمياء مما يعزز صحة الاختيار.
        يُحافَظ عليه مع تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُبرز البُعد التنافسي الصريح من خلال مكوّن «مُنَافِس» الذي يُثبّت المفهوم في
        إطار المنافسة والتسابق. الشراسة هنا موصوفة وصفاً مركَّباً ومقيَّداً بالسياق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنَافِسٌ شَرِسٌ"

    - lemma: "شَرِسٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في عشرات المعاجم الكلاسيكية والحديثة بمعنى «الجريء في القتال الشديد» و
        «سيئ الخلق شديد الخلاف»، وهو يغطّي البُعد الجوهري للمفهوم بكلمة فردية مجذَّرة.
        يمرّ جميع معايير بوابة الجودة الستة: الاطّراد (مستعمَل في الفصحى الكلاسيكية
        والحديثة)، يُسر التداول، الملاءمة، إيثار التراثي، إيثار العربي، الاشتقاقية.
        الوزن (فَعِل) للصفة المشبّهة صالح للاستخدام الاسمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الشراسة كسمة ذاتية جوهرية (سوء الخلق، الجرأة، شدة الخلاف) بمعزل عن
        تقييد السياق التنافسي، مما يجعله أوسع وأكثر قِدَماً واستقراراً.
        يختلف عن «مُنَافِس شَرِس» في كونه يُسمّي الصفة مباشرةً دون الإشارة الصريحة
        إلى دور المنافسة.
      actions:
        - command: create_entry
          params:
            lemma: "شَرِسٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10682258-n"

    - lemma: "مُخَاتِلٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر (ختل) يختص بالخداع والتخفّي والتربّص، وهو يُغطّي جانب «الأساليب الملتوية»
        وحده دون أن يحمل دلالة الشراسة والعدوانية الشديدة التي هي لُبّ المفهوم.
        «مُخَاتِل» يصلح وصفاً للجاسوس أو المحتال، لا للمنافس العدواني في ميدان التسابق.
        الأدلة المعجمية (insidious / خادع عن غفلة) تؤكد غياب الإطار التنافسي الصريح.

    - lemma: "مُشَاكِسٌ"
      source: stage1
      decision: removed
      decision_reason: >
        «شاكسه: غاضبه وعاسره» — يحمل دلالة الإزعاج والمعاندة لكنه لا يشتمل على
        الجانبَيْن المطلوبَيْن: (أ) شدة العدوانية الاستثنائية، (ب) الاستعداد للأساليب
        الملتوية وغير الشريفة. يمكن أن يوصف به كل شخص صعب المراس دون أن يكون منافساً
        في المعنى المقصود.


