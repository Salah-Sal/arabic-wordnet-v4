# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14019309-n
# discretion — حرية التصرف أو الحكم بمفردك
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تقدير» معناها الأساسي التثمين والتخمين والقضاء الإلهي، لا حرية التصرف"
      - "لمّة «حرية التصرف» مركب إضافي وصفي يطابق نص التعريف ذاته — احتمال دوران"
    observations: >
      المجموعة تدل على مفهوم «الصلاحية في التصرف والحكم المستقل» وهي دون الحرية العامة.
      التعريف العربي الحالي واضح لكنه يكاد يكون ترجمة حرفية للتعريف الإنجليزي.
      العلاقة بالأب المباشر (حرية الاختيار) سليمة: التقدير/الاستنساب نوع خاص من حرية الاختيار
      يُمارَس فرديًّا في سياق وظيفي أو قضائي.
  blind_candidates:
    - lemma: "اِجْتِهَاد"
      generation_method: ishtiqaq
      justification: "من الجذر (ج هـ د) على وزن اِفْتِعَال، يدل على بذل الوسع في استنباط الحكم بالرأي المستقل، وهو مصطلح فقهي أصولي راسخ"
    - lemma: "اِسْتِنْسَاب"
      generation_method: ishtiqaq
      justification: "من الجذر (ن س ب) على وزن اِسْتِفْعَال، بمعنى اعتبار الشيء مناسبًا والتصرف وفقه، يُستعمل في الأسلوب القانوني والإداري"
    - lemma: "صَلَاحِيَّة التَّقْدِير"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين الصلاحية (السلطة) والتقدير (الحكم الشخصي)، شائع في النصوص القانونية"
    - lemma: "حُرِّيَّة الحُكْم"
      generation_method: tarkib
      justification: "مركب إضافي على نسق حرية التصرف، يركز على جانب الحكم المستقل"


stage2_evidence:
  per_lemma:
    - lemma: "تَقْدِير"
      confirm:
        - text: "«تقدير التأثيرات التي تحدث في الحالات الفردية على الموارد الطبيعية المحمية، مع توضيح الأسباب.» — translation_en: judgment"
          source: "المعجم الموحد لمصطلحات المياه"
      contradicts:
        - text: "«التقدير: هو تحديد كل مخلوق بحده الذي يوجد من حسن وقبح، ونفع وضر، وغيرهما.»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى الكلامي (القضاء والقدر) لا علاقة له بحرية التصرف الشخصي"
        - text: "«التقدير: تبيين كمية الشيء»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
          conflict: "المعنى الأساسي هو التثمين والعدّ لا حرية الفعل"
      expands:
        - text: "«والتقدير من الإنسان وجهان: أحدهما التفكر في الأمر بحسب نظر العقل وبناء الأمر عليه، وذلك محمود»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يؤكد وجه التفكر العقلي المستقل الذي يقترب من مفهوم الاستنساب"

    - lemma: "حُرِّيَّة التَّصَرُّف"
      confirm:
        - text: "«(3) حرية التصرُّف أو الاختيار»"
          source: "المورد الحديث (2008) — مدخل discretion"
        - text: "«حُرِّية التَّصرّف.» — translation_en: free hand"
          source: "المورد الحديث (2008)"

    - lemma: "اِجْتِهَاد"
      confirm:
        - text: "«(4) الاجتهاد؛ الاستنساب (ق)»"
          source: "المورد الحديث (2008) — مدخل discretion"
      contradicts:
        - text: "«الاجتهاد: في اللغة بذل الوسع، وفي الاصطلاح: استفراغ الفقيه الوسع ليحصل له ظنٌّ بحكم شرعي.»"
          source: "كتاب التعريفات للجرجاني"
          conflict: "المعنى الاصطلاحي مقصور على الاستنباط الفقهي لا حرية التصرف العامة"
        - text: "«(الِاجْتِهَاد) (فِي الِاصْطِلَاح الفقهي) استفراغ الْفَقِيه الوسع ليحصل لَهُ ظن بِحكم شَرْعِي»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يحصره في الاصطلاح الفقهي"
      expands:
        - text: "«الاجْتِهادُ: بَذْلُ غايَةِ الوُسْعِ في تَحْقِيقِ أمرٍ من الأُمُورِ, مُسْتَلْزِمٌ لِلْكُلْفَةِ والمَشَقَّةِ.»"
          source: "المعجم الكبير"
          addition: "المعنى اللغوي العام (بذل الوسع) أوسع من المعنى الفقهي"

    - lemma: "اِسْتِنْسَاب"
      confirm:
        - text: "«(4) الاجتهاد؛ الاستنساب (ق)»"
          source: "المورد الحديث (2008) — مدخل discretion"

    - lemma: "صَلَاحِيَّة التَّقْدِير"
      evidence_status: "no_material_found"

    - lemma: "حُرِّيَّة الحُكْم"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "تَقْدِير"
      decision: confirmed
      decision_reason: >
        رغم أن المعنى الأساسي للتقدير هو التثمين والتخمين، فإنه يُستعمل في العربية المعاصرة
        بمعنى الحكم الشخصي المستقل (حسب تقديره = at his discretion)، وهو استعمال حيّ في
        النصوص القانونية والإدارية (السلطة التقديرية). وجه التفكر العقلي المستقل عند المناوي
        يدعم هذا الاستعمال.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على فعل الحكم العقلي والتثمين الذاتي، ويُستعمل في سياق «حسب تقديره» أي وفق حكمه الشخصي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَقْدِير"

    - lemma: "حُرِّيَّة التَّصَرُّف"
      decision: confirmed
      decision_reason: >
        مركب إضافي ثابت مسجّل في المورد الحديث ترجمةً لـ discretion وfree hand.
        هو التعبير الأكثر شيوعًا ومباشرةً عن المفهوم في العربية المعاصرة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يدل على الجانب العملي من الحرية — القدرة على الفعل والتصرف دون قيد — وهو أعم من التقدير الذي يركز على الحكم العقلي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُرِّيَّة التَّصَرُّف"

    - lemma: "اِسْتِنْسَاب"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح قانوني عربي فصيح مسجّل في المورد الحديث مقابلاً لـ discretion مع
        وسم (ق = قانون). مشتق من الجذر (ن س ب) بمعنى اعتبار الشيء مناسبًا
        والتصرف بناءً عليه. يسدّ فراغًا معجميًّا بين التقدير العقلي والتعبير المركب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح قانوني/إداري رسمي يدل على ممارسة الصلاحية التقديرية وفق ما يراه المرء مناسبًا، أخص من حرية التصرف وأعم من الاجتهاد الفقهي"
      actions:
        - command: create_entry
          params:
            lemma: "اِسْتِنْسَاب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "اِجْتِهَاد"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى الاصطلاحي الراسخ للاجتهاد مقصور على الاستنباط الفقهي الشرعي،
        والمعنى اللغوي العام (بذل الوسع) لا يدل على حرية التصرف بل على الجهد والمشقة.
        إدراجه يُحدث لبسًا مع المفهوم الأصولي المستقر.

    - lemma: "صَلَاحِيَّة التَّقْدِير"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد شواهد معجمية تثبته وحدةً معجمية ثابتة. كما أنه يصف السلطة التي
        تمنح التقدير لا التقدير ذاته، فهو أقرب إلى discretionary authority منه إلى discretion.

    - lemma: "حُرِّيَّة الحُكْم"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجد شواهد معجمية تثبته تعبيرًا اصطلاحيًّا ثابتًا. وهو قابل لإبدال
        مكوّناته (حرية الرأي، حرية القرار) فيظل وصفًا حرًّا — يفشل في اختبار السكّ.


