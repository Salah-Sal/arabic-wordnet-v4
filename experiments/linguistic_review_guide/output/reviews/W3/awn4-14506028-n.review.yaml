# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14506028-n
# achievability / attainability / attainableness
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «حالة كونه قابلاً للتحقيق» ترجمة حرفية لـ the state of being achievable، ويستخدم صيغة «كونه» الركيكة"
      - "اللمّة «قابلية التحقيق» مركب إضافي وصفي طويل نسبياً، وقد يُخلط بينها وبين «إمكانية التحقيق» أو «قابلية التحقق»"
      - "اللمّة «منالية» مصدر صناعي مولَّد من «منال»، وهي صيغة حديثة غير مسجلة في المعاجم الكلاسيكية"
    observations: "المفهوم يدور حول صفة مجردة تدلّ على كون الشيء ممكن التحقيق أو البلوغ أو الإحراز. وهو مفهوم مجرد يُعبَّر عنه بالمصدر الصناعي أو بالتركيب الإضافي. المقابل الإنجليزي achievability/attainability يقابله في العربية عدة صيغ اشتقاقية من جذور: حقق، نيل/نول، بلغ. الجنس القريب هو «الإمكانية» (المجموعة الأعلى)."

  blind_candidates:
    - lemma: "تَحَقُّقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تَحَقُّق» (مصدر تَحَقَّقَ)، على وزن تَفَعُّلِيَّة، يدلّ على حالة كون الشيء قابلاً للتحقق. مشتق من جذر «حقق» الدالّ على الإحكام والصحة."
    - lemma: "مَنَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «مَنَال» (مصدر ميمي أو اسم مكان من نال ينال)، يدلّ على صفة كون الشيء في متناول اليد وممكن النيل. الجذر «نول/نيل» يدلّ على الإعطاء والوصول."
    - lemma: "قَابِلِيَّةُ البُلُوغ"
      generation_method: tarkib
      justification: "تركيب إضافي من «قابلية» (مصدر صناعي من قابل) + «البلوغ» (مصدر بلغ). يؤدي معنى كون الشيء ممكن البلوغ والوصول إليه."
    - lemma: "إِحْرَازِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «إحراز» (مصدر أحرز)، يدلّ على صفة كون الشيء ممكن الإحراز. الجذر «حرز» يدلّ على الحيازة والنيل."


stage2_evidence:
  per_lemma:
    - lemma: "قَابِلِيَّة التَّحْقِيق"
      confirm:
        - text: "«القَابِلِيَّةُ: الاستعداد للقبول [مصدر صناعي]»"
          source: "المعجم الوسيط"
        - text: "«(القابلية) الاستعداد للقبول (مصدر صناعي)»"
          source: "المعجم الوسيط (حولي)"
        - text: "«ممكنٌ إحرازُهُ أو تحقيقُهُ أو بلوغُهُ.» (ترجمة attainable)"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«يُنْجَز؛ يُحْرَز: ممكنٌ إنجازُه أو إحرازُهُ.» (ترجمة achievable)"
          source: "المورد الحديث (2008)"
          addition: "يؤكد أن المفهوم يُترجم بـ«ممكن التحقيق/الإنجاز» وليس بمصطلح مفرد واحد شائع"

    - lemma: "مَنَالِيَّة"
      confirm:
        - text: "«مَنَال: من (ن و ل) الوصول إلى الهدف، والعطاء والخير.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«مُنَال: من (ن و ل) المعطي الشيء، أو من (ن ي ل) الممكن من نيل الشيء.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«(نَوَلَ) النُّونُ وَالْوَاوُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِعْطَاءٍ. وَنَوَّلْتُهُ: أَعْطَيْتُهُ. وَالنَّوَالُ: الْعَطَاءُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر «نول» أصله الإعطاء، و«منال» مصدر ميمي يدلّ على الوصول إلى الهدف، فالمصدر الصناعي «منالية» يحمل دلالة القدرة على بلوغ المراد"

    - lemma: "تَحَقُّقِيَّة"
      confirm:
        - text: "«(حَقَّ) الْحَاءُ وَالْقَافُ أَصْلٌ وَاحِدٌ، وَهُوَ يَدُلُّ عَلَى إامِ الشَّيْءِ وَصِحَّتِهِ. فَالْحَقُّ نَقِيضُ الْبَاطِلِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(1) إنجاز (2) تحقيق؛ بلوغ (3) مأثَرة؛ مُنْجَز عظيم.» (ترجمة achievement)"
          source: "المورد الحديث (2008)"
          addition: "يبيّن أن «تحقيق» مقابل شائع لـ achievement، فالمصدر الصناعي «تحققية» مقبول اشتقاقياً"

    - lemma: "قَابِلِيَّةُ البُلُوغ"
      evidence_status: "no_material_found"

    - lemma: "إِحْرَازِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "قَابِلِيَّةُ التَّحْقِيق"
      decision: confirmed
      decision_reason: "تركيب إضافي شائع ومفهوم في الاستعمال المعاصر، يجمع بين «قابلية» المسجلة في الوسيط و«التحقيق» المصدر المعروف. يؤدي المعنى بوضوح ويوافق الترجمات المعجمية لـ achievable/attainable."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير وصفي تحليلي يركّز على البعد الفعلي (التحقيق = الإنجاز الفعلي)، وهو أوضح دلالةً وأقرب إلى الأسلوب الاصطلاحي الرسمي من «منالية»."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَابِلِيَّةُ التَّحْقِيق"

    - lemma: "مَنَالِيَّة"
      decision: confirmed
      decision_reason: "مصدر صناعي مولَّد من «منال» (الوصول إلى الهدف)، وهو مسجّل ضمنياً عبر مادة «منال» في المعاجم. صيغة مختصرة وسلسة تناسب الاستعمال العلمي والفلسفي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح مفرد مجرد يركّز على البعد الإمكاني (كون الشيء في المتناول)، وهو أخصر وأسلس من «قابلية التحقيق» ويناسب السياقات الفلسفية والنظرية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَنَالِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَحَقُّقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم صحة الاشتقاق (مصدر صناعي من تحقّق)، فإنها غير مسجلة في أي معجم، وقد تلتبس بمفهوم «التحققية» الفلسفي (verificationism/positivism). المجموعة مكتفية بلمّتين تغطيان المعنى."

    - lemma: "مَنَالِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "هذه اللمّة تطابق اللمّة الموجودة فعلاً في المجموعة، فلا حاجة لإضافتها مجدداً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false

    - lemma: "قَابِلِيَّةُ البُلُوغ"
      source: stage1
      decision: removed
      decision_reason: "لم تُسجَّل كوحدة معجمية ثابتة، وهي مجرد عبارة وصفية حرة يمكن فيها إبدال «البلوغ» بـ«الوصول» أو «الإدراك» دون تغيير في المعنى. لا تجتاز اختبار السكّ."

    - lemma: "إِحْرَازِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم تُسجَّل في أي معجم، ولفظ «إحراز» أكثر ارتباطاً بالحيازة المادية والتملك منه بقابلية التحقيق المجردة. المجموعة مكتفية."


