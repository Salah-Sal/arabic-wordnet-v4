# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-09799231-n  |  ILI: i88128  |  POS: n
# المفهوم: agriculturist / agriculturalist / cultivator / grower / raiser
# ═══════════════════════════════════════════════════════════════


# ══════════════════════════════════════════════════════════════
# المرحلة ١: المراجعة والتوليد
# ══════════════════════════════════════════════════════════════

stage1_review:

  # أ. التوليد الأعمى — من تعريف الملف المُقنَّع فقط
  # التعريف: شخص يعنى بعلم أو فن أو تجارة زراعة الأرض

  blind_candidates:
    - lemma: "زَرَّاعٌ"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من الجذر ز-ر-ع، يفيد الاحتراف والمداومة على الفعل؛ دلالته الصريحة على
        من حِرفتُه الزراعة تجعله ترجمةً أمينةً لمعنى cultivator/grower في التعريف.

    - lemma: "مُزَارِعٌ"
      generation_method: ishtiqaq
      justification: >
        وزن مُفَاعِل من ز-ر-ع، يفيد المداومة على فعل الزراعة والتعامل المستمر معها؛
        يشمل الجانب الفني والتجاري لزراعة الأرض.

    - lemma: "حَارِثٌ"
      generation_method: ishtiqaq
      justification: >
        وزن فَاعِل من ح-ر-ث بمعنى من يحرث الأرض ويعمل فيها؛ لفظ تراثي إحيائي
        يقابل وجه الصنعة اليدوية في المفهوم (cultivator بمعناها الحرفي).

    - lemma: "أَكَّارٌ"
      generation_method: majaz
      justification: >
        لفظ عربي قديم من الجذر أ-ك-ر (الحفر وشق الأرض) على وزن فَعَّال؛ إحياء لفظ
        ميت يُعبّر عن من يحرث الأرض ويزرعها بدلالة أكثر تخصصاً وأرسخ في التراث.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة 'مزارع' موجودة في هذه المجموعة وفي المجموعة الأمّ (awn4-10098586-n) معاً، مما يُضعف الفرق الدلالي بين المجموعتين."
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل."
      - "'خبير زراعي' (MWE وصفي) يُوحي بالجانب العلمي/الخبراتي فحسب ولا يُغطّي أوجه المفهوم كلها (grower, raiser, cultivator)."
      - "المجموعة تفتقر إلى لمّات تُمثّل المعنى التراثي لمن يحرث الأرض (أكّار، زرّاع)."
    observations: >
      المجموعة تمثّل مفهوم agriculturist بوجهيه: العلمي/الفني (خبير زراعي) والعملي/الحرفي
      (مزارع). غير أن الاقتصار على هاتين اللمّتين يُخلّ بالتوازن؛ إذ تغيب المصطلحات التراثية
      الراسخة كـ'زرّاع' و'أكّار'، فضلاً عن تداخل 'مزارع' مع اللمّات الأمّية في awn4-10098586-n.
      والمفارقة اللغوية اللافتة أن ابن فارس في مقاييس اللغة يذكر صراحةً أن 'الخبير' يعني
      'الأكّار' من باب خبر الأرضَ (أي عمل فيها)، مما يربط جذرَيْ خبير وأكّار تراثياً.


# ══════════════════════════════════════════════════════════════
# المرحلة ٢: جمع الأدلة
# ══════════════════════════════════════════════════════════════

stage2_evidence:

  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "مزارع"
      confirm:
        - text: "«من مهنته زراعة الأرض»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993) — ARABTERM، translation_en: agriculturalist"
        - text: "«فلاّح»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM، translation_en: agriculturist"
        - text: "«(1) المُزارع (2) الخبير الزراعيّ.»"
          source: "المورد الحديث (2008) — ARABTERM، translation_en: agriculturist"
        - text: "«شخص يعمل في الزراعة وتربية الكائنات الحية بهدف إنتاج مواد غذائية للإنسان والحيوان أو أزهار للزينة أو أعشاب عطرية أو توابل أو أعشاب طبية أو مواد أولية لصناعة الملابس أو الورق أو غيرها.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية — ARABTERM، translation_en: farmer"

    - lemma: "خبير زراعي"
      confirm:
        - text: "«(1) المُزارع (2) الخبير الزراعيّ.»"
          source: "المورد الحديث (2008) — ARABTERM، translation_en: agriculturist"
      expands:
        - text: "«الخَبِيرُ: الأَكَّارُ، وَهُوَ مِنْ هَذَا، لِأَنَّهُ يُصْلِحُ الأَرْضَ وَيُدَمِّثُهَا وَيُلَيِّنُهَا... الخَبِيرُ الأَكَّارُ، لِأَنَّهُ يُخَابِرُ الأَرْضَ، أَيْ يُؤَاكِرُهَا.»"
          source: "مقاييس اللغة لابن فارس — باب خبر"
          addition: >
            يكشف ابن فارس أن الجذر خ-ب-ر له صلة قديمة بمعنى 'الأكّار' (من يحرث الأرض)،
            مما يمنح 'خبير زراعي' عمقاً تراثياً يتجاوز دلالة 'الخبرة' الحديثة.

    # ── مرشحات المرحلة ١ ──

    - lemma: "زَرَّاعٌ"
      confirm:
        - text: "«من يزرع الأرض»"
          source: "المعجم الوسيط (OCR)"
        - text: "«مَنْ حِرْفَتُه الزِّراعة — النَّمَّامُ؛ قيل: لِأَنَّهُ يَزْرَعُ الأَحقادَ فى قلوبِ الأَحِبَّاءِ»"
          source: "المعجم الكبير (OCR)"
        - text: "«معالج الزرع، والنمام الذي يزرع الأحقاد في قلوب الأحباء.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani)"
        - text: "«من يزرع الأرض والنمام»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
      expands:
        - text: "«ذَرِينِى - لكِ الوَيْلاتُ - آتِى الغَوَانِيا / متى كُنتُ زَرَّاعًا أَسُوقُ السَّوَانِيا»"
          source: "الأَعشَى — شاهد شعري في المعجم الكبير"
          addition: "يُثبت استعمال اللفظ في الشعر الجاهلي بدلالة الزارع المحترف."
        - text: "«مَشْؤُومَةٌ لِلْخَيْرِ حَصّادَةٌ / لكنَّها للشَّرِّ زَرَّاعَة»"
          source: "ابن الرومي — شاهد شعري في المعجم الكبير"
          addition: "يُبيّن انتقال الدلالة مجازاً، مما يدل على رسوخ اللفظ الأصلي."

    - lemma: "حَارِثٌ"
      confirm:
        - text: "«من يشق الأرض بالمحراث ليزرعها، وأبو الحارث: كنية الأسد.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (Hawramani)"
      contradicts:
        - text: "«الحارِثُ: والحرث جمع المال وكسبه، والحارث الكاسب... ومنه الحديث: أصدق أسمائكم الحارث»"
          source: "معجم البلدان لياقوت الحموي (Hawramani)"
          conflict: >
            'الحارث' بدون ال التعريف يُستعمل في الغالب علماً على شخص (اسم) لا اسم جنس؛
            الاستعمال كاسم جنس شائع في 'الحرّاث' لا في 'حارث'.
        - text: "«أبو الحارث: كنية الأسد»"
          source: "المعجم الوسيط (OCR)"
          conflict: "أقوى استعمالاته المعجمية هي الكنية (أبو الحارث) والعلم، لا الاسم العام."

    - lemma: "أَكَّارٌ"
      confirm:
        - text: "«فلاح الحرّاث والزراع»"
          source: "المعجم الكبير (OCR) — entry_id: 36629"
        - text: "«الحراث (ج) أكرة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani) — entry_id: 867736"
        - text: "«وَبِذَلِكَ سُمِّيَ الأَكَّارُ. قَالَ الأَخْطَلُ: عَبْدًا لِعِلْجٍ مِنَ الْحِصْنَيْنِ أَكَّارِ»"
          source: "مقاييس اللغة لابن فارس — باب أكر"
        - text: "«فلو غيرُ أَكَّارٍ قتلني!»"
          source: "حديث قتل أبي جهل — شاهد في المعجم الكبير"
        - text: "«إنَّ الفوارس يعرفون ظهوركم / أولاد كلِّ مُقَبِّحٍ أكَّارِ»"
          source: "الأخطل — شاهد شعري في المعجم الكبير"
      expands:
        - text: "«وَالْخَبِيرُ: الأَكَّارُ، وَهُوَ مِنْ هَذَا، لِأَنَّهُ يُصْلِحُ الأَرْضَ وَيُدَمِّثُهَا وَيُلَيِّنُهَا»"
          source: "مقاييس اللغة لابن فارس — باب خبر"
          addition: "ربط ابن فارس بين الأكّار والخبير يُعمّق المكانة التراثية للمصطلح."


# ══════════════════════════════════════════════════════════════
# المرحلة ٣: التحليل اللغوي للّمات
# ══════════════════════════════════════════════════════════════

stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "مزارع"
      decision: confirmed
      decision_reason: >
        موثَّقة في معاجم ARABTERM المتعددة مقابل agriculturist وagriculturealist. هي الأكثر
        شيوعاً في العربية المعاصرة للمفهوم، وإن كانت مشتركة مع اللمّات الأمّية؛ غير أن
        ذلك عائد إلى طبيعة التراتب الدلالي لا إلى خطأ معجمي. التشكيل الكامل غائب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أكثر اللمّات شيوعاً وتداولاً في العربية المعاصرة؛ يُشير إلى من يمارس الزراعة
        مهنةً شاملةً دون تحديد الجانب العلمي أو الحرفي، وهو أقرب إلى المعنى العام لـ farmer
        / agriculturalist. يمتاز بالمرونة الاستعمالية والشيوع النثري والإعلامي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُزَارِعٌ"

    - lemma: "خبير زراعي"
      decision: confirmed
      decision_reason: >
        موثَّقة في المورد الحديث (2008) صراحةً كترجمة لـ agriculturist. اختبار التثبيت
        المعجمي: المركب وحدة معجمية مسجّلة، ولا يمكن إبدال 'زراعي' بمرادفه 'فلاحي' وإبقاء
        الدلالة الاصطلاحية ذاتها. التشكيل الكامل غائب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركّز على الجانب العلمي والمعرفي؛ يُلائم بخاصة المعنى التقني لـ agriculturist
        بوصفه من يعنى بعِلم الزراعة ودراستها، ويُقابل ببعض الدقة agronomist. يُستعمل في
        السياقات الرسمية والأكاديمية والتقنية أكثر من الاستعمال الشعبي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَبِيرٌ زِرَاعِيٌّ"

    # ── مرشحات المرحلة ١ ──

    - lemma: "زَرَّاعٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّقة في المعجم الكبير والمعجم الوسيط بمعنى "مَنْ حِرْفَتُه الزِّراعة"، وفي
        شعر الأعشى (جاهلي) وابن الرومي (عباسي). وزن فَعَّال يناسب دلالة الحرفة والصنعة
        مناسبةً صرفية تامة. لا تعارض في أدلتها. تُغطّي وجه cultivator/grower الذي تفتقر
        إليه لمّات المجموعة الحالية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الزراعة كحِرفة متكاملة ومتواصلة (وزن فعّال يفيد الكثرة والاحتراف)؛
        يُقابل بدقة cultivator وgrower من الناحية الاحترافية العملية. أكثر تحديداً من
        'مزارع' في الإيحاء بالصنعة والحِذق، وأعمق تراثاً منه.
      actions:
        - command: create_entry
          params:
            lemma: "زَرَّاعٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حَارِثٌ"
      source: stage1
      decision: removed
      decision_reason: >
        بالرغم من الأصل الاشتقاقي الصحيح (من ح-ر-ث)، فإن 'حارث' بلا تعريف هو في الغالب
        علَمٌ على شخص (اسم) أو كنية (أبو الحارث = الأسد). الاسم العام المعجمي الشائع
        للدلالة على من يحرث الأرض هو 'الحرّاث' (بتشديد وتعريف) لا 'حارث' مجرداً.
        فحص الاستبدال: لا يمكن استبدال 'حارث' بـ'زرّاع' في نفس السياق بيُسر. قرار الحذف.

    - lemma: "أَكَّارٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّقة في المعجم الكبير، والمعجم الوسيط، ومقاييس اللغة لابن فارس، مع شواهد في
        حديث قتل أبي جهل وشعر الأخطل. تُمثّل إحياءً لفظاً تراثياً راسخاً بدلالة صريحة
        وحصرية على من يحرث الأرض ويزرعها. تجتاز بوابة الجودة المصطلحية: اطّراد، تراثية،
        اشتقاقية واضحة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        لفظ كلاسيكي متخصص يُعبّر عن العلاقة العضوية العميقة بين الإنسان والأرض؛ أصله
        الأُكرة (الحفرة في الأرض للزراعة). يُقابل cultivator بمعناها التراثي، وهو
        أخص من 'مزارع' وأقدم من 'زرّاع'. يُناسب السياقات الأدبية والتراثية والشعرية.
      actions:
        - command: create_entry
          params:
            lemma: "أَكَّارٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


