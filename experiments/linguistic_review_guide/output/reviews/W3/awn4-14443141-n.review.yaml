# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14443141-n (concatenation)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تعاقب» تدل على التتابع الزمني (succession) أكثر من الترابط السلسلي (concatenation)، فقد تكون مقحمة في هذه المجموعة"
      - "التعريف العربي الحالي ترجمة شبه حرفية للتعريف الإنجليزي، ويحتاج إلى صياغة معجمية عربية أصيلة"
      - "اللمّتان الموجودتان بلا تشكيل"
    observations: "المجموعة تصف حالة اتصال الأشياء بعضها ببعض على نحو السلسلة، وهو مفهوم عربي أصيل له جذور في وصف الدروع (السَّرْد) واتصال الحلقات (السِّلْسِلَة). التسلسل هو اللفظ الأدق للمفهوم لارتباطه المباشر بالسلسلة. أمّا التعاقب فيركز على البُعد الزمني (خلف أحدهما الآخر) لا على الربط المادي كالحلقات."
  blind_candidates:
    - lemma: "تَسَلْسُل"
      generation_method: ishtiqaq
      justification: "من الجذر س-ل-ل (مضعّف: سلسل) على وزن تَفَعْلُل، مصدر تسلسل بمعنى اتصال الأشياء بعضها ببعض كحلقات السلسلة. أقرب لفظ عربي للمفهوم المطلوب."
    - lemma: "تَعَاقُب"
      generation_method: ishtiqaq
      justification: "من الجذر ع-ق-ب على وزن تَفَاعُل، يدل على تتابع الأشياء وتناوبها. يقترب من المفهوم من جهة التتابع لكنه يفتقر إلى دلالة الربط السلسلي."
    - lemma: "سَرْد"
      generation_method: majaz
      justification: "أصله نسج حلقات الدرع وإدخال بعضها في بعض، ثمّ نُقل إلى متابعة الأشياء باتصال. في مقاييس اللغة: يدل على توالي أشياء كثيرة يتصل بعضها ببعض."
    - lemma: "تَنَاسُق"
      generation_method: ishtiqaq
      justification: "من الجذر ن-س-ق على وزن تَفَاعُل. في مقاييس اللغة: يدل على تتابع في الشيء. يشير إلى انتظام الأشياء في سلسلة متناسقة."

stage2_evidence:
  per_lemma:
    - lemma: "تَسَلْسُل"
      confirm:
        - text: "«التسلسل: ترتيب أمور غير متناهية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«التّسلسل: الاتّصال وأن يجري الماء سائغاً في الحلق»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«التسلسل: هو ترتيب أمور غير متناهية... كالتسلسل في العلل والمعلولات والصفات والموصفات»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«تَسَلْسَلَ الشيءُ: تَتَابَعَ بترابطٍ وتَنَاسُق»"
          source: "المعجم الكبير"
        - text: "«تسلسل: تتابع. يقال تسلسل الماء جرى في حدور واتصال»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(1) سَلْسَلة (2) تَسَلْسُل — concatenation»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد أن تسلسل هو المقابل العربي المعتمد لـ concatenation في المعاجم الثنائية"
        - text: "«سَلْسَلَة — دمج أو جمع بتات أو محارف لتكوين سلسلة واحدة — concatenation»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          addition: "يميّز بين السَّلْسَلَة (الفعل/العملية) والتَّسَلْسُل (الحالة/النتيجة)"

    - lemma: "تَعَاقُب"
      confirm:
        - text: "«تعاقب الشيئان: خلف أحدهما الآخر. والقوم في الشيء أو الأمر: تناوبوه»"
          source: "المعجم الوسيط"
        - text: "«التَّعَاقُب القمي (في علم الأحياء): نمو الأعضاء النباتية متتابعة من القاعدة إلى القمة»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«التعاقب على الراحلة: أن يركب كل واحد عقبة بالضم أي نوبة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الدلالة المركزية هي التناوب والنَّوْبة لا الربط السلسلي؛ التعاقب يعني مجيء شيء بعد شيء لا اتصاله به كحلقات السلسلة"
      expands:
        - text: "«(3) سِياق؛ تعاقب؛ تتابع؛ تسلسل — sequence»"
          source: "المورد الحديث (2008)"
          addition: "المورد يضع تعاقب مقابلاً لـ sequence لا لـ concatenation"
        - text: "«(2) تعاقُب؛ توالٍ؛ تتابع — succession»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد أن تعاقب أقرب إلى succession منه إلى concatenation"

    - lemma: "سَرْد"
      confirm:
        - text: "«السِّينُ وَالرَّاءُ وَالدَّالُ أَصْلٌ مُطَّرِدٌ مُنْقَاسٌ، وَهُوَ يَدُلُّ عَلَى تَوَالِي أَشْيَاءَ كَثِيرَةٍ يَتَّصِلُ بَعْضُهَا بِبَعْضٍ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«السَّرْدُ: نَسْجُ الدِّرْعِ، واسمٌ جامعٌ للدُّروعِ وسائِرِ الحَلَقِ، وجَوْدَةُ سِياقِ الحَديثِ، ومُتابَعَةُ الصَّوْمِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«سَرْدُها: نَسْجُها. وهو تداخُلُ الحَلَقِ بعضِها في بعض»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      contradicts:
        - text: "«السرد: الإتيان بالحديث على الولاء»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الاستعمال المعاصر يغلب عليه معنى السرد القصصي (narration)، مما يسبب التباساً مع المعنى المطلوب (الربط السلسلي)"

    - lemma: "تَنَاسُق"
      confirm:
        - text: "«النُّونُ وَالسِّينُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَتَابُعٍ فِي الشَّيْءِ. وَكَلَامٌ نَسَقٌ: جَاءَ عَلَى نِظَامٍ وَاحِدٍ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«ثَغْرٌ نَسَقٌ، إِذَا كَانَتِ الْأَسْنَانُ مُتَنَاسِقَةً مُتَسَاوِيَةً. وَخَرَزٌ نَسَقٌ: مُنَظَّمٌ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الدلالة المركزية هي الانتظام والتساوي (harmony/regularity) لا الربط في سلسلة؛ التناسق يصف التناظر لا التسلسل"

stage3_analysis:
  per_lemma:
    - lemma: "تَسَلْسُل"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل من الجذر سلسل، مؤسّس على استعارة السِّلْسِلَة (حلقات مترابطة). مؤيّد بعدة معاجم كلاسيكية ومعاصرة، وهو المقابل المعتمد لـ concatenation في المعاجم المصطلحية. دلالته تجمع بين التتابع والترابط البنيوي، وهو ما يميّز المفهوم المطلوب عن مجرد التعاقب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على الترابط البنيوي كحلقات السلسلة، مع دلالة على الاتصال المادي أو المنطقي بين العناصر المتتابعة. أقرب اللمّات إلى المفهوم الأصلي (concatenation)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَسَلْسُل"

    - lemma: "تَعَاقُب"
      decision: removed
      decision_reason: "التعاقب يدل على التتابع الزمني والتناوب (succession)، لا على الربط السلسلي البنيوي (concatenation). المعاجم تعرّفه بـ«خلف أحدهما الآخر» و«التناوب»، وهذا يعني الحلول محل الشيء لا الاتصال به. المورد يضعه مقابلاً لـ sequence/succession لا لـ concatenation. وجوده في هذه المجموعة يُلبس على المستخدم الفرق بين المفهومين."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سَرْد"
      source: stage1
      decision: removed
      decision_reason: "رغم أن الأصل اللغوي (توالي أشياء يتصل بعضها ببعض، ونسج حلقات الدرع) قريب جداً من المفهوم المطلوب، إلا أن الاستعمال المعاصر غلب عليه معنى السرد القصصي (narration)، مما يجعله ملتبساً في السياقات الحديثة. كذلك السَّرْد مصدر يدل على الفعل/العملية لا على الحالة، بينما المجموعة تصف حالة (state of being linked)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَنَاسُق"
      source: stage1
      decision: removed
      decision_reason: "التناسق يدل أساساً على الانتظام والتساوي والتناظر (harmony/regularity)، لا على الربط في سلسلة مترابطة. الاشتراك مع المفهوم المطلوب سطحي فقط من جهة التتابع، لكنه يفتقر إلى دلالة الاتصال الحلقي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "سَلْسَلَة"
      source: stage1
      decision: confirmed
      decision_reason: "سَلْسَلَة مصدر سَلْسَلَ، وتعني اتصال الشيء بالشيء وربط العناصر بعضها ببعض. وردت في المعجم الموحد لمصطلحات تقانة المعلومات مقابلاً صريحاً لـ concatenation بمعنى «دمج أو جمع بتات أو محارف لتكوين سلسلة واحدة». تضيف بُعد الفعل والعملية مقابل التسلسل الذي يصف الحالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على عملية الربط والضمّ (الفعل) أكثر من الحالة الناتجة. تُستعمل خصوصاً في السياقات التقنية (سلسلة المحارف، سلسلة البيانات)."
      actions:
        - command: create_entry
          params:
            lemma: "سَلْسَلَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

