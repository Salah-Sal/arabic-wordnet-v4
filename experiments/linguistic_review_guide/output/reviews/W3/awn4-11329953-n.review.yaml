# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('ألبرت شبير' و'شبير') خاليتان من التشكيل الكامل"
      - "اللمّة 'شبير' منفردةً تلتبس بالاسم العربي الأصيل 'شبير' من جذر (ش ب ر) الدال على الجمال والعطاء، وهو تطابق صدفي مع تعريب اللقب الألماني Speer /ʃpeːɐ/"
      - "التعريف الحالي مقتضب ولا يذكر دوره وزيراً للتسليح، ولا محاكمته في نورنبرغ، وهي سمات فارقة"
    observations: "المجموعة تمثل اسم علَم لشخصية تاريخية أجنبية هي المهندس المعماري النازي الألماني ألبرت شبير (1905–1981). اللمّتان تعريبان للاسم الألماني Albert Speer: الأولى الاسم الكامل (ألبرت شبير)، والثانية اللقب المجرد (شبير). التحدي اللغوي الرئيسي أن 'شبير' تتطابق رسماً مع اسم عربي أصيل مسجّل في موسوعة السلطان قابوس لأسماء العرب، فيما المقصود هنا هو تعريب اللقب الألماني Speer بمعنى الرمح، ولا صلة علمية بين الاثنين. التعريف صحيح في جوهره لكنه مجتزأ."
  blind_candidates:
    - lemma: "أَلْبِرت شبِير"
      generation_method: taarib
      justification: "تعريب الاسم الكامل Albert Speer وفق التقاطع الصوتي المعتاد في العربية: Albert←أَلْبِرت (ألف مفتوحة، لام ساكنة، باء مكسورة، راء ساكنة، تاء مفتوحة)؛ Speer←شبِير (الشين لتمثيل النطق الألماني /ʃp/، والياء للمد /eː/ المميِّز)."
    - lemma: "أَلْبِرت سبِير"
      generation_method: taarib
      justification: "بديل تعريبي يستخدم السين عوض الشين لتمثيل المقطع Sp-، قياساً على بعض المراجع العربية التي تُفضّل السين في تعريب الأسماء الأجنبية ذات البداية Sp- (كسبينوزا وسبنسر)."
    - lemma: "شبِير"
      generation_method: taarib
      justification: "تعريب اللقب المجرد Speer وحده؛ شائع في الكتابة الأكاديمية والصحفية العربية عند الإشارة إلى الشخص بلقبه فحسب، كما هو معهود في التراجم والموسوعات."
    - lemma: "أَلْبِيرت شبِير"
      generation_method: taarib
      justification: "صيغة بديلة تعتمد 'ألبيرت' بالياء لمحاكاة مقطع 'bert' بنبر مختلف، وردت في بعض الموسوعات العربية المترجمة."


