# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92422796-n
# صفة كون الشيء ثانوياً في التأثير أو القوة أو الرتبة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «ضآلة» أصلها الدلالي يتعلّق بالضعف والدقّة في الجِرم (المادي)، فاستخدامها للدلالة على الثانوية في الرتبة توسّع مجازي يحتاج تحقّق"
      - "اللمّة «صغر الشأن» تعبير إضافي يحتاج إلى التحقّق من ثبوته المعجمي كوحدة اصطلاحية"
      - "التعريف العربي الحالي يستخدم كلمة «صفة» وهي مبهمة، والمفهوم أقرب إلى «حالة» أو «كون»"
    observations: "المجموعة تمثّل مفهوماً مجرداً يتعلّق بتدنّي المكانة والأثر، وهو نقيض العظمة والنفوذ. المفهوم متجذّر في العربية ويمكن التعبير عنه بألفاظ متعددة من جذور مختلفة: صغر (قلّة)، ضأل (ضعف)، حقر (خسّة). التعريف الحالي يقول «صفة كون الشيء ثانوياً» وهذا يُشير إلى أنّ المفهوم عن الكون في مرتبة أدنى لا عن الاحتقار الأخلاقي."
  blind_candidates:
    - lemma: "حَقَارَة"
      generation_method: ishtiqaq
      justification: "من الجذر ح‌ق‌ر الدالّ على الصِّغَر والذِّلّة، على وزن فَعَالَة للمصدر الدالّ على الحالة، يُفيد كون الشيء حقيراً في المكانة والأثر"
    - lemma: "صَغَار"
      generation_method: ishtiqaq
      justification: "من الجذر ص‌غ‌ر على وزن فَعَال، وهو مصدر يدلّ على الذلّ والضَّعة، ورد في القرآن {سَيُصِيبُ الَّذِينَ أَجْرَمُوا صَغَارٌ}، فهو يجمع بين تدنّي المكانة والهوان"
    - lemma: "وَضَاعَة"
      generation_method: ishtiqaq
      justification: "من الجذر و‌ض‌ع على وزن فَعَالَة، من «الوضيع» ضدّ الرفيع، يدلّ على تدنّي المنزلة والرتبة، ومنه «ضَعَة» (الموجود في الهايبرنيم)"
    - lemma: "خُمُول"
      generation_method: ishtiqaq
      justification: "من الجذر خ‌م‌ل على وزن فُعُول، يدلّ على خفاء الذِّكْر وعدم النباهة والشهرة، فهو أقرب إلى الثانوية في التأثير والقوة من الذلّ الأخلاقي"

stage2_evidence:
  per_lemma:
    - lemma: "صِغَرُ الشَّأْنِ"
      confirm:
        - text: "«الصِّغَرُ، كعنبٍ، والصَّغارَةُ، بالفتح: خلافُ العِظَمِ، أو الأُولى في الجِرْمِ، والثانيةُ في القَدْرِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الصغر: يقال تارة باعتبار الزمان... وتارة باعتبار القدر والمنزلة... والصاغر: الراضي بالمنزلة الدنية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الشَّأْنُ: الحال والأمر الذي يتفق ويصلح، ولا يقال إلا فيما يعظم من الأحوال والأمور»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«(صَغَرَ) الصَّادُ وَالْغَيْنُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قِلَّةٍ وَحَقَارَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يجمع بين القلّة والحقارة، مما يؤكد صلاحية المركب للدلالة على تدنّي المكانة"
        - text: "«(شَأَنَ) الشِّينُ وَالْهَمْزَةُ وَالنُّونُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى ابْتِغَاءٍ وَطَلَبٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الشأن الطلب والابتغاء، ثم توسّع إلى المنزلة والقدر"

    - lemma: "ضَآلَة"
      confirm:
        - text: "«تفاهة؛ حقارة؛ ضآلة.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(ضَأَلَ) الضَّادُ وَالْهَمْزَةُ وَاللَّامُ أُصَيْلٌ يَدُلُّ عَلَى ضَعْفٍ وَدِقَّةٍ فِي جِسْمٍ. مِنْ ذَلِكَ الضَّئِيلُ، وَهُوَ الضَّعِيفُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الاشتقاقي يدلّ على الضعف الجسمي والدقّة في الجِرم لا على تدنّي المكانة أو الرتبة، والاستخدام المجرّد توسّع حديث"

    - lemma: "حَقَارَة"
      confirm:
        - text: "«تفاهة؛ حقارة؛ ضآلة.»"
          source: "المورد الحديث (2008)"
        - text: "«(1) تفاهة؛ حقارة (2) شيء تافه.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(صَغَرَ) الصَّادُ وَالْغَيْنُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى قِلَّةٍ وَحَقَارَةٍ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الحقارة ملازمة لمفهوم الصِّغَر في الأصل اللغوي"

    - lemma: "صَغَار"
      evidence_status: "no_material_found"

    - lemma: "وَضَاعَة"
      evidence_status: "no_material_found"

    - lemma: "خُمُول"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "صِغَرُ الشَّأْنِ"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت يجمع بين «الصِّغَر» بمعنى تدنّي القَدْر و«الشأن» بمعنى المنزلة، ويدلّ على كون الشيء في مرتبة أدنى من حيث التأثير والقوة. الأدلة المعجمية تؤكد استخدام الصِّغَر بمعنى القلّة في القَدْر (لا الجِرم فقط)، والشأن بمعنى المنزلة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على تدنّي المنزلة والقَدْر في سياق الأمور والشؤون العامة، ويُستخدم في سياقات يُراد فيها التقليل من أهمية شيء أو شخص"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صِغَرُ الشَّأْنِ"

    - lemma: "ضَآلَة"
      decision: confirmed
      decision_reason: "المصدر الصناعي من «ضئيل» استقرّ في الاستعمال المعاصر بمعنى القلّة والتفاهة في الأثر والأهمية، رغم أنّ الأصل الاشتقاقي يتعلّق بالدقّة الجسمية. قاموس المورد يؤكد استخدامها مرادفةً لـ insignificance."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على ضآلة الحجم والأثر المعنوي، وتوحي بأنّ الشيء صغير جداً إلى حدّ لا يستحقّ الاهتمام، وهي أقرب إلى الوصف الكمّي منها إلى الحكم القيمي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ضَآلَة"

    - lemma: "حَقَارَة"
      source: stage1
      decision: confirmed
      decision_reason: "الحقارة من الجذر ح‌ق‌ر تدلّ على الصِّغر والدناءة في المنزلة، وقد وردت في المورد مرادفةً لـ insignificance وpettiness. وهي أكثر شيوعاً في الاستخدام الفصيح المعاصر من «ضآلة» للدلالة على تدنّي الشأن."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تحمل حكماً قيمياً سلبياً أشدّ من «ضآلة»، فتوحي بالازدراء والتحقير لا مجرّد الصِّغَر الكمّي"
      actions:
        - command: create_entry
          params: {lemma: "حَقَارَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "صَغَار"
      source: stage1
      decision: removed
      decision_reason: "الصَّغار في الاستخدام القرآني والمعجمي يدلّ على الذلّ والهوان الأخلاقي أكثر من كونه وصفاً لتدنّي الأثر أو القوة. كما أنّ الهايبرنيم يستخدم «ضعة» وهي أقرب دلالياً، فإضافة الصغار تُشوّش على التمييز."

    - lemma: "وَضَاعَة"
      source: stage1
      decision: removed
      decision_reason: "الوضاعة مشتقة من الجذر نفسه الذي اشتُقّت منه «ضعة» الموجودة في الهايبرنيم، فإضافتها تُحدث تداخلاً مع المستوى الأعلى في الشبكة الدلالية."

    - lemma: "خُمُول"
      source: stage1
      decision: removed
      decision_reason: "الخمول يدلّ على خفاء الذِّكر وعدم الشهرة، وهو أقرب إلى مفهوم «الغمور» (obscurity) منه إلى الثانوية في التأثير والقوة والرتبة. المفهوم مختلف عن المطلوب."

