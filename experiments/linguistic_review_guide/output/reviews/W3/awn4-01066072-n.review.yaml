stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة حرفية لعبارة (freedom from activity) الإنجليزية ولا يبدو طبيعياً كتعريف عربي معجمي."
    observations: "المفهوم يدل على الراحة وزوال التعب وحصول السكون بعد بذل الجهد."
  blind_candidates:
    - lemma: "رَاحَة"
      generation_method: ishtiqaq
      justification: "مصدر يدل على زوال المشقة والتعب والرجوع إلى حالة السكون."
    - lemma: "اِسْتِرْخَاء"
      generation_method: ishtiqaq
      justification: "يدل على زوال التوتر والشد من الأعضاء والبدن."
    - lemma: "اِسْتِجْمَام"
      generation_method: ishtiqaq
      justification: "يدل على طلب الراحة وتجديد النشاط بعد الإرهاق."
    - lemma: "دَعَة"
      generation_method: ishtiqaq
      justification: "تدل على السكون وهدوء الحال وترك ما يتعب."

stage2_evidence:
  per_lemma:
    - lemma: "استجمام"
      confirm:
        - text: "ارتخاء، استجمام"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان"
    - lemma: "استرخاء"
      confirm:
        - text: "ارتياح العضلات وعدم تشنجها أو انقباضها."
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
        - text: "إرخاء، تراخٍ، استرخاء؛ استجمام، تسلية."
          source: "المورد الحديث"
    - lemma: "راحة"
      confirm:
        - text: "الخِفَّةُ. يُقَال: وجَدْتُ لذلِكَ الْأَمْرِ راحَةٌ وِجْدانُ الفَرْجَةِ بعدَ الكُرْبَةِ"
          source: "المعجم الكبير"
        - text: "راحة، طُمأنينة؛ راحة بالٍ"
          source: "المورد الحديث"
    - lemma: "دعة"
      confirm:
        - text: "الخفض في العيش والراحة"
          source: "كتاب العين"
        - text: "السّكُون عِنْد هيجان الشدَّة."
          source: "دستور العلماء"

stage3_analysis:
  per_lemma:
    - lemma: "استجمام"
      decision: confirmed
      decision_reason: "مصطلح دقيق وشائع للتعبير عن طلب الراحة وتجديد النشاط البدني والنفسي بعد فترات العمل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِجْمَام"
    - lemma: "استرخاء"
      decision: confirmed
      decision_reason: "استخدام فصيح ومستقر في اللغة المعاصرة للتعبير عن زوال الشد والتوتر، ويدعمه المعجم الموحد والمورد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِرْخَاء"
    - lemma: "راحة"
      decision: confirmed
      decision_reason: "الكلمة الأساسية والأكثر عموماً في العربية للتعبير عن الخلو من التعب والمشقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَاحَة"
    - lemma: "دَعَة"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ عربي فصيح يدل على السكون والراحة وزوال مسببات التعب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "دَعَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-01066072-n"}

stage4_content:
  definition:
    current: "التحرر من النشاط (العمل أو الجهد أو المسؤولية)"
    assessment:
      decision: revise
      reason: "التعريف الحالي عبارة عن ترجمة حرفية من الإنجليزية (freedom from activity) وصياغته غير طبيعية، ويجب استبداله بصياغة معجمية عربية تعبر عن المفهوم بدقة."
    authored:
      - type: terminological
        text: "انْقِطَاعٌ عَنِ العَمَلِ أَوِ الجُهْدِ أَوِ المَسْؤُولِيَّةِ بَغَرَضِ اسْتِعَادَةِ القُوَّةِ وَالسُّكُونِ البَدَنِيِّ وَالنَّفْسِيِّ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-01066072-n", definition_index: 0, text: "انْقِطَاعٌ عَنِ العَمَلِ أَوِ الجُهْدِ أَوِ المَسْؤُولِيَّةِ بَغَرَضِ اسْتِعَادَةِ القُوَّةِ وَالسُّكُونِ البَدَنِيِّ وَالنَّفْسِيِّ."}
  examples:
    per_lemma:
      - lemma: "اِسْتِجْمَام"
        examples:
          - text: "قَضَتِ الأُسْرَةُ عُطْلَةَ نِهَايَةِ الأُسْبُوعِ فِي مُخَيَّمٍ لِلاِسْتِجْمَامِ."
            type: usage
      - lemma: "اِسْتِرْخَاء"
        examples:
          - text: "نَصَحَهُ الطَّبِيبُ بِمُمَارَسَةِ تَمَارِينِ الاِسْتِرْخَاءِ لِلتَّخْفِيفِ مِنَ التَّوَتُّرِ."
            type: usage
      - lemma: "رَاحَة"
        examples:
          - text: "بَعْدَ يَوْمٍ شَاقٍّ مِنَ العَمَلِ، خَلَدَ إِلَى الرَّاحَةِ فِي بَيْتِهِ."
            type: usage
      - lemma: "دَعَة"
        examples:
          - text: "عَاشَ الفَيْلَسُوفُ بَقِيَّةَ حَيَاتِهِ فِي دَعَةٍ وَسُكُونٍ بَعِيدًا عَنْ صَخَبِ المَدِينَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-01066072-n", text: "بَعْدَ يَوْمٍ شَاقٍّ مِنَ العَمَلِ، خَلَدَ إِلَى الرَّاحَةِ فِي بَيْتِهِ."}

