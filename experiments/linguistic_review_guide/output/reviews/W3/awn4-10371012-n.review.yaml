# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-10371012-n  |  needleworker
# Pipeline v2 — 5 مراحل
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «عامل إبرة» ترجمةٌ حرفية مباشرة للمصطلح الإنجليزي needleworker، وهي عبارة وصفية
        حرة لا وحدة معجمية مسكوكة؛ ولم تُوثَّق في المعاجم كمدخل مستقل."
      - "لمّة «خياط» أضيق دلالةً من المفهوم؛ فهي خاصة في الغالب بالتفصيل والخياطة، لا
        بجميع الأعمال الإبرية كالتطريز وخياطة الجلد. غير أن استخدامها الكلاسيكي يمتد
        ليشمل كل العاملين بالإبرة."
      - "التعريف الحالي «شخص يقوم بعمل...» فضفاض أسلوباً وليس على نمط المعجم الوسيط."
    observations: >
      المجموعة الترادفية تمثّل مفهوم «مَنْ يحترف العمل بالإبرة» بوصفه فئةً جامعة تحتوي
      أنواعاً كالخياط والمطرّز والخرّاز. هذا المفهوم الجامع غير متبلور في لفظٍ عربي واحد
      شائع؛ إذ تستخدم العربية ألفاظاً تخصصية لكل حِرفة. ولمّة «خياط» هي أقرب مرادف عربي
      تقليدي، وإن كانت تميل إلى الخياطة أكثر من التطريز.
  blind_candidates:
    - lemma: "خَرَّاز"
      generation_method: majaz
      justification: >
        أصله من خَرَزَ الجلدَ: خرزه بالإبرة، وهو على وزن فعَّال الدال على الحِرفة.
        بالتجوّز يشمل كل عامل بالإبرة لأن أصل الخرز هو خياطة الجلد بالإبرة.
        يُحيي لفظاً عربياً أصيلاً (جذر خرز موثَّق في المقاييس).
    - lemma: "رَتَّاق"
      generation_method: ishtiqaq
      justification: >
        من رَتَقَ (سدَّ الشقَّ والخرقَ)، وزن فعَّال الصناعي الدال على الحِرفة.
        الرتق يُنجز بالإبرة والخيط عادةً، فيكون رتَّاق من يحترف رتق الثياب بالإبرة.
    - lemma: "مُرَقِّع"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من رَقَّعَ (رمَّم وأصلح بالإبرة والخيط)، وهو اشتقاق من جذر عربي أصيل
        على وزن مُفعِّل. العمل بالإبرة هو الوسيلة الرئيسية للترقيع.
    - lemma: "نَاسِج"
      generation_method: majaz
      justification: >
        اسم فاعل من نسج؛ النسج في أصله يكون بالنول لكنه يُتجوَّز به لكل صانع نسيجي
        يُحكم حِياكة الخيوط، ومنه «حائك» الذي جاء في المعجم الكبير بمعنى الخياط أيضاً.


stage2_evidence:
  per_lemma:
    # ─── اللمّات الموجودة ────────────────────────────────────────
    - lemma: "خياط"
      confirm:
        - text: "«من حرفته الخياطة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«مَنْ حِرْفَتُه الخِيَاطَةُ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«(الخيَّاط) من حرفته الخياطة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
        - text: "«(1) الخيّاط (2) يتعاطى مهنةَ الخياطة»"
          source: "المورد الحديث (2008) — translation_en: tailor"
        - text: "«يا وَهْبُ - وَيْحَكَ - قَدْ عَلِمْتَ بِوَهْيِها / أفَلا دَعَوْتَ لِرَتْقِها خَيَّاطا»"
          source: "المعجم الكبير — شاهد شعري: ابن الرومي"
      expands:
        - text: "«الخيّاطة: امرأة حِرْفتُها الخِياطة»"
          source: "المورد الحديث (2008) — translation_en: seamstress"
          addition: "يُثبت أن الصيغة المؤنثة خيّاطة هي المقابل الأنثوي الموثَّق."
        - text: "«الخِيَاطَةُ مَعْرُوفَةٌ» — في سياق: «الْخَاءُ وَالْيَاءُ وَالطَّاءُ أَصْلٌ وَاحِدٌ
            يَدُلُّ عَلَى امْتِدَادِ الشَّيْءِ فِي دِقَّةٍ»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: "يُثبت الجذر خيط وأصالة الخياطة في العربية القديمة."

    - lemma: "عامل إبرة"
      contradicts:
        - text: "«شُغْل الإبرة. وبخاصة: التطريز.» — translation_en: needlework"
          source: "المورد الحديث (2008)"
          conflict: >
            المدخل يُقابل كلمة «needlework» (النشاط) لا «needleworker» (الشخص).
            التركيب «شُغل الإبرة» يُعبِّر عن الحِرفة لا عن صاحبها، مما يؤكد أن
            «عامل إبرة» تجميعٌ وصفي حرّ لا مصطلح مسكوك.
      expands:
        - text: "«(1) تخريم إبَريّ (2) تطريز إبَريّ» — translation_en: needlepoint"
          source: "المورد الحديث (2008)"
          addition: >
            الصفة «إبَريّ» موجودة في العربية للتعبير عن كل ما يتعلق بالإبرة، لكن
            الشخص الذي يمارس هذا العمل يُسمَّى بمصطلح أكثر تخصصاً (خياط / مطرّز).

    # ─── مرشحات المرحلة ١ ────────────────────────────────────────
    - lemma: "خراز"
      confirm:
        - text: "«صانع الخَرَز مَنْ حرفته خياطة الجلد»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«صانِعُ الخُفِّ وغيرِه أو الخَرْز»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«سَبَّقَ عَبَّادٌ وصَلَّتْ لِحْيَتُهْ / وكان خَرَّازًا تَجُودُ قِرْبَتُهْ»"
          source: "المعجم الكبير — شاهد شعري: يزيد بن مفرّغ الحِميَريّ"
        - text: "«من (خ ر ز) صانع الخرز، ومن حرفته خياطة الجلد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«مَنْ حرفته خياطة الجلد»"
          source: "المعجم الوسيط / المعجم الكبير"
          conflict: >
            التعريفات تُقيّد الخرّاز بخياطة الجلد تحديداً، لا بعموم الأعمال الإبرية.
            استخدامه في هذه المجموعة الجامعة سيكون توسيعاً غير موثَّق.

    - lemma: "رتاق"
      contradicts:
        - text: "«ثَوْبَان يُرْتَقانِ بِحَواشِيهِما»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هوراماني)"
          conflict: >
            الرِّتاق اسم لنوع من الثياب لا اسم لشخص يرتق؛ أي أن المبنى «رتاق»
            ليس على وزن الحِرفة (فعَّال = رتَّاق)، بل هو مفعول أو آلة.
        - text: "«ثوبانِ يُرْتَقانِ بِحَواشِيهِما»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "تؤكد أن الرِّتاق اسم جامد للشيء المرتوق لا للفاعل."

    - lemma: "مرقع"
      confirm:
        - text: "«المِرقَعُ: الراقعُ. خطيبٌ مِرقعٌ: يصِلُ الكلام فيُرَقِّعُ بعضَه ببعض»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
      contradicts:
        - text: "«المَرْقَعُ: مَوْضعُ الرقع. المُرَقَّعُ: الرجل المجرَّبُ»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            أغلب المداخل تحمل معنى «موضع الرقع» أو «الرجل المجرَّب» لا «العامل بالإبرة»؛
            والاستخدام الأساسي للمِرقع في السياق الخطابي المجازي لا الحِرفي.

    - lemma: "ناسج"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ─── اللمّات الموجودة ────────────────────────────────────────
    - lemma: "خياط"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة في أمهات المعاجم الحديثة والكلاسيكية بمعنى «من حرفته الخياطة»،
        وهي الأكثر شيوعاً وأيسر تداولاً للدلالة على محترف أعمال الإبرة في العربية.
        وإن كانت تتمحور حول الخياطة أكثر من التطريز، فإن الاستعمال العربي الأصيل
        يجعلها المصطلح الجامع لهذا الصنف من الحِرفيين. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      borrowing_check:
        lexical_borrowing: "عربي أصيل، جذر خيط"
        calque_risk: "لا يوجد"
      morphological_fit: >
        وزن فيعال (خيَّاط) وزنٌ صرفي معياري للدلالة على الحِرفة في العربية
        (نجَّار، حدَّاد، بنَّاء)، مما يؤكد ملاءمته الصرفية التامة.
      nuance_differentiation: >
        الخيَّاط هو المصطلح الأصيل الأوسع دلالةً في هذه المجموعة؛ يُستخدم للدلالة
        على كل من يحترف العمل بالإبرة في التراث العربي وإن غلب عليه معنى التفصيل،
        وهو يُفارق المُطرِّز والخرَّاز بعموميته واستخدامه الأكثر في الثياب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَيَّاط"

    - lemma: "عامل إبرة"
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: «عامل إبرة» تركيب وصفي حر يمكن إبدال «عامل»
        بـ«صانع» أو «شاغل» ويبقى الوصف صحيحاً، وهو دليل على أنه ليس وحدة اصطلاحية
        ثابتة. المورد الحديث يُقابل «needlework» (النشاط) بـ«شُغل الإبرة» لا بـ«عامل إبرة»
        (الشخص)، مما يدل على غياب هذا المركب كمصطلح موثَّق. يُعدّ اقتراضاً تركيبياً
        أعمى لا يتطابق مع أنماط الوزن المعجمي العربي للحِرَف.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ─── مرشحات المرحلة ١ ────────────────────────────────────────
    - lemma: "خَرَّاز"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن الخرَّاز يعمل بالإبرة فعلاً، فإن المعاجم تُقيِّده صراحةً بخياطة الجلد
        (الأخفاف والقِرَب)، وهو مجال أضيق من دلالة المجموعة الجامعة. استخدامه هنا
        سيستلزم توسيعاً غير موثَّق في المعاجم المعتمدة.
      evidence_assessment:
        case: mixed

    - lemma: "رَتَّاق"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة المسجَّلة في المعاجم هي «الرِّتاق» بكسر الراء، وتعني «ثوبانِ يُرتقان
        بحواشيهما»، أي اسم للشيء المرتوق لا للشخص الراتق. أما «رتَّاق» (بتشديد التاء
        على وزن الحِرفة) فغير موثَّق في المعاجم المتاحة كمدخل مستقل.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُرَقِّع"
      source: stage1
      decision: removed
      decision_reason: >
        المِرقَع (بكسر الميم) موثَّق بمعنى «الراقع» لكن استخدامه الأساسي في المعاجم
        مجازيٌّ خطابيٌّ (خطيب مِرقع يصل الكلام). الراقع بوصفه حِرفياً يرقِّع الثياب
        لم يستقل كمصطلح تقني موثَّق يشمل مجموعة العاملين بالإبرة عامةً.
      evidence_assessment:
        case: mixed

    - lemma: "نَاسِج"
      source: stage1
      decision: removed
      decision_reason: >
        الناسج يعمل أساساً بالنول لا بالإبرة. المعجم الكبير يُسوِّي بين «الحائك» (= الناسج)
        وبين «الخياط» لكن ذلك معنى محدَّث، والمعنى الأصيل هو النسج النوليّ. لا توجد أدلة
        معجمية تربط الناسج بالإبرة تحديداً.
      evidence_assessment:
        case: no_material


stage4_content:
