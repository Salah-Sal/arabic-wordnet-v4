        البعيدة عن أسلوب المعجم الوسيط القائم على «جنس قريب + فصل نوعي». كما أن ذكر
        المثالين بين قوسين (الخياطة، التطريز) يجعله وصفاً لا تعريفاً.
    authored:
      - type: terminological
        text: "مَنْ حِرفتُهُ العَمَلُ بالإبرة كالخياطةِ والتطريزِ وما شابَهَهُما"
