# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13976685-n (citizenship)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «جنسية» في الاستعمال العربي المعاصر يغلب عليه معنى nationality (الانتساب إلى دولة) لا citizenship (المواطنة بحقوقها وواجباتها)، فقد يُحدث لبساً دلالياً"
      - "التعريف العربي الحالي مقبول لكنه يفتقر إلى ذكر الرابطة القانونية بين الفرد والدولة"
    observations: "المجموعة تضمّ لمّتين: «جنسية» و«مواطنة». المفهوم المستهدف هو وضع المواطن المتمتع بالحقوق والواجبات (citizenship)، وهو مفهوم سياسي-قانوني حديث له تعبير عربي راسخ. لفظ «مواطنة» أدقّ مطابقةً لمفهوم citizenship، بينما «جنسية» أقرب إلى nationality لكنه يُستعمل أيضاً بمعنى المواطنة في بعض السياقات."
  blind_candidates:
    - lemma: "مُوَاطَنَة"
      generation_method: ishtiqaq
      justification: "مصدر «واطَنَ» على وزن مُفَاعَلَة من الجذر و-ط-ن، يدلّ على المشاركة في الوطن والانتماء إليه بما يستتبعه من حقوق وواجبات"
    - lemma: "جِنْسِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «جِنْس» بمعنى الانتساب إلى جنس أو أمة، يُستعمل في القانون الدولي بمعنى الرابطة القانونية بين الفرد والدولة"
    - lemma: "تَابِعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «تابع»، يدلّ على كون الشخص تابعاً لدولة بالمعنى القانوني، وردت في المورد الحديث مرادفةً للجنسية"
    - lemma: "رَعَوِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي منسوب إلى «الرعيّة» بمعنى كون الإنسان رعيّةً لدولة، وردت في المعجم الوسيط"


stage2_evidence:
  per_lemma:
    - lemma: "جِنْسِيَّة"
      confirm:
        - text: "«(الجنسية) الصّفة الَّتِي تلْحق بالشخص من جِهَة انتسابه لشعب أَو أمة»"
          source: "المعجم الوسيط"
        - text: "«( فى القانون الدَّولىِّ) Nationalité : رابطة قانونيَّة وسياسيَّة لها طابعُ الدَّوام والاستمرار , تَرْبطُ الفَرْدَ بدَوْلةٍ مَا , وتَعْنِي الخُضوع والولاء من جانِب الفَرْدِ والحماية من جانبِ الدَّوْلَة»"
          source: "المعجم الكبير"
        - text: "«رابطة تجمع بين الفرد والدولة التي يحمل جنسيتها، وتفرض عليه نتيجة لذلك عدة التزامات لفائدتها، كما تتكفل هذه الدولة بضمان عدة حقوق لفائدته.»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«translation_en: citizenship»"
          source: "مسرد الفن والتسلية والرياضة (ARABTERM)"
          addition: "بعض بنوك المصطلحات تترجم جنسية بـ citizenship أيضاً لا nationality فقط"
        - text: "«translation_en: nationality»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
          addition: "الغالب في المعاجم المصطلحية ترجمة «جنسية» بـ nationality"

    - lemma: "مُوَاطَنَة"
      confirm:
        - text: "«translation_en: citizenship»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«translation_en: citizenship»"
          source: "المعجم الموحد لمصطلحات الاستراتيجيات التربوية والتعليمية (2020)"
        - text: "«translation_en: citizenship»"
          source: "مسرد الفلسفة وعلم النفس (ARABTERM)"
        - text: "«translation_en: citizenship»"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية (2020)"
      expands:
        - text: "«(1) «أ», المواطِنيّة: «ب» كون المرء مواطنًا من مواطني الدولة. «ج» واجبات المواطن وحقوقُه»"
          source: "المورد الحديث (2008)"
          addition: "المورد يستعمل صيغة «المواطنيّة» بدل «المواطنة» ويعرّفها بواجبات المواطن وحقوقه"

    - lemma: "تَابِعِيَّة"
      confirm:
        - text: "«(2) الجنسية؛ التابعيّة»"
          source: "المورد الحديث (2008) — مادة nationality"
      contradicts:
        - text: "«لم يُعثر على مدخل مستقل بعنوان تابعية في المعاجم العربية الكلاسيكية»"
          source: "البحث المعجمي"
          conflict: "اللفظ ليس له مدخل معجمي مستقل، وردت فقط كمرادف عابر في المورد الحديث تحت nationality"

    - lemma: "رَعَوِيَّة"
      confirm:
        - text: "«نسبة إلى الرعية كون الإنسان رعيَّةً»"
          source: "المعجم الوسيط"
        - text: "«نسبةٌ إلى الرَّعِيَّةِ.»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«شعر ورواية ومسرح يتناول موضوع الرعوية (ق16) وكانت أعمالها تتميز بالتكلّف والصَّنعة»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "في المصطلحات الأدبية تعني pastoral لا citizenship، فيقع اشتراك لفظي"


stage3_analysis:
  per_lemma:
    - lemma: "جِنْسِيَّة"
      decision: confirmed
      decision_reason: "لفظ «جنسية» مثبت في المعاجم الكبرى وبنوك المصطلحات بمعنى الرابطة القانونية بين الفرد والدولة مع ذكر الحقوق والواجبات. وإن غلب عليه معنى nationality، فإنه يُستعمل أيضاً بمعنى citizenship في بعض المصادر، ولا سيما أن المفهومين متداخلان في الاستعمال العربي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تؤكّد على الرابطة القانونية والسياسية بين الفرد والدولة (جهة الانتساب)، وتُستعمل في السياقات الرسمية والقانونية الدولية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِنْسِيَّة"

    - lemma: "مُوَاطَنَة"
      decision: confirmed
      decision_reason: "لفظ «مواطنة» هو المقابل العربي الأدقّ لـ citizenship، وتتّفق عليه بنوك المصطلحات القانونية والتربوية والفلسفية. يؤكّد على البعد الحقوقي والواجباتي للانتماء إلى الوطن."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تؤكّد على المشاركة الفاعلة في الوطن والتمتع بالحقوق والقيام بالواجبات، وهي أقرب إلى البُعد السياسي-الاجتماعي من البعد القانوني المحض"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُوَاطَنَة"

    - lemma: "تَابِعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على مدخل معجمي مستقل لهذا اللفظ. وردت فقط مرادفةً عابرةً في المورد الحديث تحت nationality. كما أنّ دلالتها تُشعر بالتبعية والخضوع لا بالمواطنة الفاعلة، فلا تصلح مقابلاً لـ citizenship."

    - lemma: "رَعَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: "دلالتها على كون الإنسان رعيّةً تنتمي إلى مفهوم ما قبل الدولة الحديثة (الرعية مقابل الراعي). فضلاً عن الاشتراك اللفظي مع المعنى الأدبي (pastoral). لا تُناسب مفهوم المواطنة الحديثة القائمة على الحقوق والواجبات."


