# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دوراني نسبياً: يستخدم «زجاج تيفاني» لتعريف «تيفاني» نفسه — ينبغي الإعاضة عنه بوصف مستقل عن الاسم."
      - "اللمّة «تيفاني» تتطابق شكلاً مع المفردة العربية «التِّيفانيّ» التي تعني نوعاً من الأقمشة الحريرية أو القطنية — مصدر التباس محتمل."
      - "اللمّتان خاليتان من التشكيل الكامل، وهو إلزامي للأعلام المعرَّبة."
      - "هذه المجموعة علَم شخصي (proper noun)؛ ينبغي أن تحمل مدخلاتها pos: proper_noun لا pos: n العام."
    observations: >
      المجموعة الترادفية تمثّل شخصاً بعينه هو الفنان الأمريكي لويس كومفورت تيفاني (1848–1933)،
      مؤسس أسلوب «زجاج تيفاني» الزجاجي الملوَّن. الاسم علَم أجنبي مُعرَّب لا يقبل اشتقاقاً عربياً؛
      الصياغة المعجمية الوحيدة الممكنة هي نقل الصوت (التعريب). اللمّة القصيرة «تيفاني» شائعة في المصادر
      العربية الموسوعية للإحالة على صاحبها، والاسم الكامل ضروري في السياقات التعريفية الرسمية.
      وجود كلمة «تيفاني» بمعنى القماش في المعاجم العربية الحديثة (المورد الحديث) يستوجب الانتباه
      لكنه لا يُعيق استخدامها علماً، إذ الأعلام لا تندرج ضمن الاشتراك اللفظي المعجمي.

  blind_candidates:
    - lemma: "تِيفَانِي"
      generation_method: taarib
      justification: >
        التعريب الصوتي للاسم الأخير Tiffany بضبط الكسرة على التاء والفتحة على الفاء،
        وهو الشكل المُتداوَل في المراجع العربية الموسوعية والإعلامية للإحالة على هذا الفنان.
    - lemma: "لُويِس كُومْفُرْت تِيفَانِي"
      generation_method: taarib
      justification: >
        الاسم الثلاثي الكامل Louis Comfort Tiffany معرَّباً بنقل الأصوات: Louis→لُويِس،
        Comfort→كُومْفُرْت، Tiffany→تِيفَانِي. الاسم الكامل ضروري لرفع الإبهام عن مشاركين
        آخرين في العائلة اشتُهروا بالتجارة في المجوهرات.
    - lemma: "لُويِس تِيفَانِي"
      generation_method: taarib
      justification: >
        صيغة مقتصرة على الاسم الأول واللقب، شائعة في التعريفات الموجزة؛ تُغني عن الاسم الأوسط
        مع الإبقاء على القدر الكافي من التمييز عن والده تشارلز لويس تيفاني.
    - lemma: "ل. ك. تِيفَانِي"
      generation_method: taarib
      justification: >
        صيغة المبادئ المختصرة L.C. Tiffany المستخدمة أحياناً في المراجع الفنية والأكاديمية
        المختصرة عند الإحالة المتكررة للاسم في نصٍّ واحد.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١) مطابقة دفعية للمّات الموجودة والمرشحات (0 نتيجة مفيدة لاستعلام الاسم الصريح)
# ٢) جسر إنجليزي: translation_en:"Tiffany" → entry_id:723603 (المورد الحديث 2008)
# ٣) FTS عربي: "تيفاني" OR "زجاج تيفاني" → لا نتائج إضافية خارج 723603
# ملاحظة: لم تُسفر الاستعلامات عن أي مدخل معجمي للعَلَم الشخصي.
stage2_evidence:
  per_lemma:
    - lemma: "تيفاني"
      contradicts:
        - text: "«التِّيفانيّ: ضرب من القماش الحريريّ أو القطنيّ.»"
          source: "المورد الحديث (2008) — arabterm"
          conflict: >
            المدخل المعجمي العربي الوحيد الذي يحتوي على «تيفاني» يُعرِّفها
            نوعاً من الأقمشة لا شخصاً؛ مما قد يُولّد لَبساً عند القارئ غير المتخصص.
            الاسم كعَلَم لا يرد في أي معجم عربي كلاسيكي أو حديث مُستَعلَم.
      expands:
        - text: "«لويس — عن الألمانية القديمة بمعنى محارب مشهور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani"
          addition: >
            يؤكد أن «لويس» مدخل معجمي عربي راسخ للاسم الأجنبي Louis،
            مما يدعم صلاحية التعريب الصوتي للمكوّن الأول من الاسم الكامل.

    - lemma: "لويس كومفورت تيفاني"
      expands:
        - text: "«لويس — عن الألمانية القديمة بمعنى محارب مشهور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani"
          addition: >
            المكوّن الأول «لويس» له تأصيل معجمي في المراجع العربية لأسماء الأعلام،
            وهو يعزز سلامة تعريب مقطع الاسم الكامل.

    - lemma: "لُويِس تِيفَانِي"
      evidence_status: "no_material_found"

    - lemma: "ل. ك. تِيفَانِي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "تيفاني"
      decision: confirmed
      decision_reason: >
        الاسم الأخير «تيفاني» هو الصيغة المختصرة الدارجة في المصادر العربية الموسوعية والإعلامية
        للإحالة على هذا الفنان. رغم تطابقه الشكلي مع «التيفاني» (نوع القماش)، فإن العَلَم الشخصي
        لا يُدرَج في باب الاشتراك اللفظي المعجمي؛ السياق يرفع اللَّبس. غياب مدخل معجمي للشخص
        مُتوقَّع لأعلام الأشخاص الأجانب. اللمّة بحاجة إلى تشكيل كامل.
      evidence_assessment:
        case: mixed
      morphology_check:
        weight: "تِيفَانِي — صيغة تعريب صوتي، ثلاثة مقاطع، مقبول في العربية بقبول ال- والنسبة والجمع السالم"
        borrowing_type: "تعريب صوتي (loanword adaptation)"
        naturalization: "مقبول — يقبل: التيفاني، تيفانياً، التيفانيّ (نسبة)"
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة المختصرة (الشهرة)؛ تُستخدم في السياقات الموجزة والإعلامية والإحالات المتكررة
        حين يكفي الاسم الأخير وحده للتعريف، في مقابل الاسم الثلاثي الكامل المُستخدَم في
        السياقات التعريفية والأكاديمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تِيفَانِي"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── لمّة موجودة ٢ ──
    - lemma: "لويس كومفورت تيفاني"
      decision: confirmed
      decision_reason: >
        الاسم الثلاثي الكامل Louis Comfort Tiffany هو المعرِّف الرسمي الفريد للشخص في جميع
        المصادر الموسوعية والفنية. وجود المكوّن «كومفورت» ضروري للتمييز عن والده تشارلز لويس
        تيفاني (مؤسس متجر المجوهرات). اللمّة تعبير مركب إضافي من ثلاثة أجزاء، وهو وحدة
        معجمية ثابتة لعَلَم بعينه. بحاجة إلى تشكيل كامل وتصحيح POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل الرسمي؛ يُستخدم في السياقات التعريفية والأكاديمية والفنية الرسمية،
        ويرفع الالتباس مع غيره من حاملي اللقب «تيفاني» كتشارلز لويس تيفاني (والده).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُويِس كُومْفُرْت تِيفَانِي"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشح المرحلة ١ — لويس تيفاني ──
    - lemma: "لُويِس تِيفَانِي"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة الثنائية (الاسم الأول + اللقب) أضعف تمييزاً من الاسم الثلاثي الكامل؛
        إذ يشترك معه والده تشارلز لويس تيفاني في اللقب ذاته. الاسم الكامل والصيغة المختصرة
        (تيفاني وحده) يغطيان معاً الاحتياجين — الموجز والرسمي — دون حاجة لصيغة وسيطة.

    # ── مرشح المرحلة ١ — ل. ك. تيفاني ──
    - lemma: "ل. ك. تِيفَانِي"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغ المختصرة بالأحرف الأولى غير مقبولة كلمّات معجمية في AWN4؛ فهي أسلوب توثيقي
        لا وحدة معجمية. لا تقبل الإسناد الصرفي الكامل (التعريف، النسبة، الإعراب).


