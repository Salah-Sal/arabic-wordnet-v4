# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'بِيئِيّ' صفة نسبية في أصلها لا اسمَ فاعل صريحاً لشخص؛ استخدامها اسماً تحويلٌ صرفيٌّ (conversion) لا يسنده المعجم التراثي مباشرةً وإن كان مقبولاً في العربية المعاصرة"
      - "اللمّة 'مُدافِع عَن البِيئَة' عبارة وصفية حرة لا يجوز تسجيلها مصطلحاً معجمياً؛ يمكن إحلال 'مناضل عن البيئة' أو 'مناصر الطبيعة' محلّها دون إخلال بالدلالة، وهذا يُثبت فشلها في اختبار السكّ"
      - "التشكيل في 'بِيئِيّ' ناقص — الصواب 'بِيئِيٌّ' بتنوين الضم على الياء المشدّدة"
      - "غياب مصطلح مفرد متعارَف عليه في الفصيحة المعاصرة لمفهوم 'environmentalist' يعكس فراغاً معجمياً حقيقياً"
    observations: >
      المجموعة تعكس إشكالية معجمية حقيقية: مفهوم 'المدافع عن البيئة' لا مقابلَ
      فصيحاً مُفرداً راسخاً في المعاجم العربية التراثية، لأن الوعي البيئي المُنظَّم
      مفهومٌ حديث النشأة لم تعرفه العربية القديمة. اللمّتان القائمتان تعكسان حلّاً
      مدرسياً شائعاً: الأولى (بيئيّ) صفة محوّلة إلى اسم، والثانية (مدافع عن البيئة)
      وصفٌ حرّ مُركَّب. كلاهما يخدم التواصل المعاصر، لكنّهما يفتقران إلى رسوخ
      المصطلح المعجمي الحقيقي.
  blind_candidates:
    - lemma: "مُحَافِظٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر حفظ على وزن مُفَاعِل، يعني من يُمسك بالشيء ويرعاه ويحرسه؛ جذر
        حفظ في مقاييس اللغة يدلّ على «مُرَاعَاةِ الشَّيْءِ»، وهو قريب دلالياً من
        صون البيئة وحمايتها من التدهور
    - lemma: "نَاشِطٌ بِيئِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي من 'ناشط' (من جذر نشط الدال على الحركة والاهتزاز، ويُستخدم
        في العربية المعاصرة بمعنى activist) و'بيئي' (منسوب إلى البيئة)؛ شائع في
        الخطاب الإعلامي العربي للإشارة إلى من يناضل في قضايا البيئة
    - lemma: "أَخْضَرِيٌّ"
      generation_method: majaz
      justification: >
        إزاحة دلالية مجازية: نسبة مُحيِيَة إلى 'الأخضر' رمز الطبيعة والحياة في
        التراث العربي وفي الحركات البيئية المعاصرة (الحركة الخضراء)؛ من اسم
        التفضيل 'أخضر' بالنسبة 'أخضريّ' بمعنى من ينتسب إلى الفكر البيئي الأخضر
    - lemma: "حَامِي البِيئَة"
      generation_method: tarkib
      justification: >
        مركب إضافي من 'حامٍ' اسم الفاعل من حمى (يحمي ويمنع) مضافاً إلى 'البيئة'؛
        فعل حمى يدلّ على الذود والمنع، وهو جوهر دلالة environmentalist الذي يمنع
        الأذى عن البيئة


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استُعلمت قاعدة البيانات في ٣ دفعات:
# (أ) مطابقة دقيقة دفعية لجميع اللمّات (الموجودة + المرشحات)
# (ب) جسر إنجليزي: environmentalist | conservationist | ecologist
# (ج) إثراء بالمعرّفات entry_ids + مقاييس اللغة
stage2_evidence:
  per_lemma:
    - lemma: "بِيئِيّ"
      confirm:
        - text: "«البِيئيّ؛ عالِم البِيئة؛ المحافِظ على البيئة.»"
          source: "المورد الحديث (ARABTERM، 2008) — ترجمة عربية لـ environmentalist"
      expands:
        - text: "«بِيئِيّ — environmental»"
          source: "المعجم الطبي الموحد (ARABTERM، 2009)"
          addition: >
            يُثبت تسجيلَ 'بيئيّ' في المعجمية العلمية الحديثة، وإن كان بمعنى
            الصفة (environmental) لا الاسم (environmentalist)؛ يُشير إلى أن
            اللفظ مرسَّخ اصطلاحياً وإن كان الاستخدام الاسمي تحويلاً صرفياً

    - lemma: "مُدافِع عَن البِيئَة"
      contradicts:
        - text: "«المُدَافِعُ: الأَسَدُ، صِفَةٌ غالِبةٌ.»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            في المعجم التراثي 'المدافع' مفرداً صفةٌ غالبةٌ على الأسد لا على
            الإنسان؛ والتعبير المركّب 'مدافع عن البيئة' غائب كلّياً عن المعجمية
            التاريخية والحديثة بوصفه مصطلحاً مسكوكاً

    - lemma: "مُحَافِظٌ"
      confirm:
        - text: "«محافظ — conservator»"
          source: "مسرد الفلسفة وعلم النفس، ALECSO (ARABTERM)"
      contradicts:
        - text: >
            «المُحافِظُ: الذي يُدير شئون مؤسسة، أو بلد كبير أو مجموعة من البلاد
            وتُسمى المحافظة. ومنه: محافظ العاصمة، ومحافظ المصرف. المتمسك
            بالتقاليد الاجتماعية والسياسية.»
          source: "المعجم الوسيط"
          conflict: >
            يُثبت سيادة معنيَيْن آخرَيْن على اللفظ: الحاكم الإداري (governor)
            والمحافظ السياسي (conservative)، مما يُحدث اشتراكاً لفظياً شديداً
            يُبعد 'محافظ' منفرداً عن الاستخدام الدقيق بمعنى environmentalist
      expands:
        - text: "«البِيئيّ؛ عالِم البِيئة؛ المحافِظ على البيئة.»"
          source: "المورد الحديث (ARABTERM، 2008)"
          addition: >
            يذكر المورد الحديث 'المحافظ على البيئة' كترجمة ثانوية لـ
            environmentalist، لكن بصيغة عبارة مُركَّبة لا مفردٍ مستقل

    - lemma: "نَاشِطٌ بِيئِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "أَخْضَرِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "حَامِي البِيئَة"
      evidence_status: "no_material_found"

  # ── ملاحظة من الجسر الإنجليزي ──
  # وجد الاستعلام (٧) في المورد الحديث مصطلح «الصِّيَانيّ: المنادي بصيانة الموارد
  # الطبيعية» كترجمة لـ conservationist. المصطلح مشتقّ من جذر صون (الصادُ والواوُ
  # والنون أصلٌ واحد وهن كنٌّ وحفظٌ — مقاييس اللغة). لكنه يرد في مصدر واحد فقط
  # ولم يدخل الاستخدام الواسع، لذا لم يُدرَج ضمن المرشحات ويُوصى بمراقبة انتشاره.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "بِيئِيّ"
      decision: confirmed
      decision_reason: >
        مثبت في المورد الحديث (2008) بمعنى environmentalist، ومسجّل في المعجم
        الطبي الموحد. الاستخدام الاسمي للصفة المنسوبة مقبول صرفياً في العربية
        (التحويل الوظيفي) وشائع في الخطاب المعاصر. يحتاج تصحيح التشكيل فقط:
        الصواب 'بِيئِيٌّ' بتنوين الضم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        'بِيئِيٌّ' — حين يُستخدم اسماً — يُشير إلى الشخص المنتسب إلى قضية البيئة
        بشكل عام دون تحديد نوع النشاط؛ يحتمل معنى العالِم والناشط والمدافع في
        آنٍ واحد، مما يجعله أشمل وأقلّ تخصيصاً من 'مدافع' أو 'مناضل'. هو اللمّة
        الوحيدة المؤكّدة في المجموعة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِيئِيٌّ"

    - lemma: "مُدافِع عَن البِيئَة"
      decision: removed
      decision_reason: >
        عبارة وصفية حرة تتبع نمطاً إنتاجياً عاماً (مُفَاعِل + عن + X)؛ يمكن إحلال
        'مناضل عن البيئة' أو 'مناصر الطبيعة' أو 'المحامي عن البيئة' محلّها مع
        بقاء الدلالة سليمة — وهذا يُثبت فشلها في اختبار السكّ. المعجم التراثي لا
        يسجّلها وحدةً معجمية، و'المدافع' مفرداً محمولٌ على الأسد لا الإنسان.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُحَافِظٌ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم الدليل الجزئي (ARABTERM: conservator)، يُعاني 'محافظ' اشتراكاً لفظياً
        شديداً مع معنيَيْن راسخَيْن سابقَيْن في المعاجم: المحافظ الإداري (governor)
        والمحافظ السياسي (conservative). استخدامه منفرداً بمعنى environmentalist
        يُوقع في الالتباس دون سياق مصرَّح به.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "نَاشِطٌ بِيئِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي على تثبيته وحدةً معجمية ثابتة. يتبع نمطاً إنتاجياً مفتوحاً:
        'ناشط سياسي'، 'ناشط حقوقي'، 'ناشط ثقافي'، 'ناشط نقابي' — وهو ما يُثبت
        أنه وصف حرّ لا مصطلح مسكوك. كلمة 'الناشط' في المعاجم تعني 'ناقض الحبل
        ليُضفر ثانيةً'، لا 'المناضل في قضية'.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "أَخْضَرِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي تثبيت معجمي في قاعدة البيانات. المقترح المجازي مبدئيٌّ
        دلالياً لكن بلا رصيد في الاستخدام الموثَّق. يُوصى بمراقبته إذا انتشر
        في الكتابة العربية مستقبلاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "حَامِي البِيئَة"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل في اختبار السكّ: 'حارس البيئة'، 'صائن البيئة'، 'راعي البيئة'،
        'ولِيُّ البيئة' — كلّها تؤدي الدلالة ذاتها، مما يُثبت أنه تعبير وصفي
        حرّ لا مصطلح مُسكَّك. المعاجم تعرف 'الحامي' بمعنى فحل الإبل لا حامي البيئة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يعمل لحماية البيئة من الدمار أو التلوث"
    assessment:
      decision: revise
      reason: >
        التعريف صحيح الدلالة لكنه يفتقر إلى أسلوب المعجم الوسيط؛ فعل 'يعمل'
