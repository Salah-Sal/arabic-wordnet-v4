# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمتان 'إيثيل تاون' و'تاون' خاليتان من التشكيل كلياً"
      - "اللمة 'تاون' منفردةً تتطابق صوتياً وإملائياً مع فعل عربي فصيح (تَاوَنَ / تَأَوَّنَ) موثَّق في المعجم الوسيط، مما يُفضي إلى التباس جذري"
      - "الكنية المنفردة 'تاون' غير كافية لتعيين الشخصية التاريخية المقصودة بلا ضمّها إلى الاسم الشخصي"
      - "المجموعة تمثّل علماً شخصياً بعينه إلا أن pos محدَّد كـ n دون تمييز proper_noun الموجود في عدد من تطبيقات WordNet"
    observations: >
      المجموعة بيانية تخصّ شخصية تاريخية واحدة هي المعماري الأمريكي إيثيل تاون (Ithiel Town،
      1784-1844م)، المعروف بابتكاره نظام الجمالون الشبكي الخشبي (Town Lattice Truss) وتطبيقه
      في بناء الجسور. لا وجود لتسمية عربية ذاتية لهذه الشخصية؛ كلتا اللمتين تعريبٌ صوتي
      للاسم الإنجليزي. التعريف العربي الحالي ترجمة وظيفية مقبولة لكنها تحتاج إلى صياغة
      بأسلوب المعجم الموسوعي وإبراز أهمية الإسهام الهندسي. ينبغي الإبقاء على الاسم الكامل
      وحذف الكنية المنفردة لتجنّب الاشتراك اللفظي مع المادة العربية.

  blind_candidates:
    - lemma: "إِيثِيَل تَاوُن"
      generation_method: taarib
      justification: >
        تعريب صوتي للاسم الكامل Ithiel Town؛ الكسرة + ثاء + ياء مديّة + فتحة + لام تعكس
        النطق الإنجليزي /ˈɪθɪəl/، وتَاوُن تقابل المقطع /taʊn/ بضمّ النون وفق أنماط
        التعريب الرسمي العربي للمقاطع المفتوحة.
    - lemma: "إِيثِيِل تَاوُن"
      generation_method: taarib
      justification: >
        صيغة بديلة بكسر لام الاسم الأول بدلاً من فتحها؛ تعكس نطقاً آخر محتملاً للمقطع
        الأخير من Ithiel إذ يميل بعض القراء إلى كسر اللام.
    - lemma: "إِيثِيَل تَاوْن"
      generation_method: taarib
      justification: >
        صيغة بتسكين النون في الكنية بدلاً من ضمّها؛ يلجأ إليها بعض التعريبات لاختزال
        المقطع الإنجليزي /taʊn/ بسكون لتجنّب مدّ الواو.
    - lemma: "أَيثِيَل تَاوُن"
      generation_method: taarib
      justification: >
        صيغة بفتح الهمزة الابتدائية استناداً إلى بعض تقاليد التعريب التي تفتح صوت /ɪ/
        الإنجليزي بالفتحة لا الكسرة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفَّذة:
#   ١. مطابقة دقيقة دفعية: ايثيل تاون / الايثيل تاون / تاون / التاون / ايثيل / الايثيل
#   ٢. جسر إنجليزي: translation_en:"Town" OR "Ithiel Town" OR "Ithiel" OR "truss bridge" OR "architect"
stage2_evidence:
  per_lemma:
    - lemma: "إيثيل تاون"
      evidence_status: "no_material_found"

    - lemma: "تاون"
      contradicts:
        - text: "«(تَاوَنَ) الصيدُ وله: جاءه مرة عن يمينه ومرة عن يساره احتيالاً وخديعة. (انظر: ت أ ن)»"
          source: "المعجم الوسيط (OCR)"
          conflict: "الشكل الصرفي 'تاون' مسجَّل فعلاً عربياً من مادة (تون)، لا صلة له بالكنية الإنجليزية Town"
        - text: "«(تَأَوَّنَ) في الأمر: تلبَّث»"
          source: "المعجم الوسيط (OCR)"
          conflict: "شكل آخر متطابق صوتياً (تاون ← تأوَّن) يُقرأ فعلاً عربياً أصيلاً، مما يُحدث التباساً مع الكنية الأجنبية"
        - text: "«(تأون) أَوَن وَفِي الْأَمر تلبث»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          conflict: "توكيد إضافي من مصدر آخر على أن 'تاون' في المعاجم العربية فعل لا اسم أجنبي"

    - lemma: "إِيثِيَل تَاوُن"
      evidence_status: "no_material_found"

    - lemma: "إِيثِيِل تَاوُن"
      evidence_status: "no_material_found"

    - lemma: "إِيثِيَل تَاوْن"
      evidence_status: "no_material_found"

    - lemma: "أَيثِيَل تَاوُن"
      evidence_status: "no_material_found"

  # ملاحظة — نتائج الجسر الإنجليزي:
  # • "truss bridge" → الجِسر الجِمالونيّ (المورد الحديث) — يؤكد صحة مصطلح التعريف العربي
  # • "architect"    → معمار / مهندس معماري — يؤكد صحة التوصيف في التعريف
  # • لا نتائج لـ "Ithiel" أو "Ithiel Town" في قواعد البيانات المصطلحية


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إيثيل تاون"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخصية التاريخية، وهو التعريب الصوتي الرسمي المتداول في المصادر
        العربية الحديثة. يُحتفظ به مع إضافة التشكيل الكامل لضمان الدقة الصوتية. لا
        يوجد بديل عربي ذاتي لهذا العَلَم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل (الشخصي + الكنية) هو المعرِّف الوحيد المعتمد للشخصية بعد حذف الكنية المنفردة المبهمة؛ لا شقيق له في المجموعة بعد حذف 'تاون'"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيثِيَل تَاوُن"

    - lemma: "تاون"
      decision: removed
      decision_reason: >
        أولاً: الكنية المنفردة غير كافية لتعيين الشخصية دون الاسم الشخصي. ثانياً: تصطدم
        صوتياً وإملائياً بفعل عربي فصيح موثَّق في المعجم الوسيط وغيره (تَاوَنَ / تَأَوَّن)
        مما يُفضي إلى التباس جذري في النص العربي. ثالثاً: الاسم الكامل 'إيثيل تاون' يُغني
        عنها تماماً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِيثِيَل تَاوُن"
      source: stage1
      decision: removed
      decision_reason: >
        مطابقة للمة الموجودة 'إيثيل تاون' مع إضافة التشكيل فقط؛ تُعالَج بتحديث اللمة
        الموجودة عبر update_lemma لا بإنشاء مدخل جديد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "إِيثِيِل تَاوُن"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تشكيل بديلة بكسر اللام؛ تشكيل الفتحة في 'إِيثِيَل' أدقّ صوتياً للمقطع
        الإنجليزي /ɪəl/ ولذا يُرجَّح عليها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "إِيثِيَل تَاوْن"
      source: stage1
      decision: removed
      decision_reason: >
        لا تتميز عن الصيغة المختارة إلا بتسكين النون؛ الضمة في 'تَاوُن' أكثر انتشاراً
        في التعريب العربي للمقطع الإنجليزي المفتوح /taʊn/.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "أَيثِيَل تَاوُن"
      source: stage1
      decision: removed
      decision_reason: >
        فتح الهمزة الابتدائية غير دقيق صوتياً؛ الإنجليزي /ɪ/ يقابله كسرة في أنماط
        التعريب الفصيح العربي لا فتحة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري أمريكي اشتهر بتصميم وبناء الجسور الجمالونية (1784-1844)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية صحيحة المضمون لكنها تفتقر إلى: (أ) ذكر
        الاسم في صدر التعريف كما هو معهود في المعاجم الموسوعية، (ب) الإشارة إلى الإسهام
        الهندسي المحدد (نظام الجمالون الشبكي Town Lattice Truss)، (ج) استخدام أسلوب المعجم
        الوسيط الموسوعي بدلاً من أسلوب الترجمة.
    authored:
      - type: encyclopedic
        text: >
          إِيثِيَل تَاوُن (1784-1844م): مُهَنْدِسٌ مِعْمَارِيٌّ أَمْرِيكِيٌّ،
          اشتَهَرَ بابتكار نظام الجِمالون الشبكي الخشبي المعروف باسمه (Town Lattice Truss)
          وتطبيقه في تصميم الجسور وتشييدها في الولايات المتحدة الأمريكية.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "إِيثِيَل تَاوُن (1784-1844م): مُهَنْدِسٌ مِعْمَارِيٌّ أَمْرِيكِيٌّ، اشتَهَرَ بابتكار نظام الجِمالون الشبكي الخشبي المعروف باسمه وتطبيقه في تصميم الجسور وتشييدها في الولايات المتحدة الأمريكية."

  examples:
    per_lemma:
      - lemma: "إِيثِيَل تَاوُن"
        examples:
          - text: "يُعدُّ إِيثِيَل تَاوُن من رواد هندسة الجسور في أمريكا القرن التاسع عشر، إذ أسهم نظامه الجمالوني في ربط المناطق الريفية النائية."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدُّ إِيثِيَل تَاوُن من رواد هندسة الجسور في أمريكا القرن التاسع عشر، إذ أسهم نظامه الجمالوني في ربط المناطق الريفية النائية."


