# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14340648-n (hematocele)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «قيلة دموية» مسجّلة بدون تشكيل"
      - "المجموعة تحتوي على لمّة واحدة فقط، ما يُضعف التغطية المعجمية"
      - "التعريف العربي ترجمة شبه حرفية للإنجليزي ويحتاج صياغة معجمية"
    observations: >
      المفهوم طبّي متخصّص يدلّ على تجمّع الدم في تجويف من تجاويف الجسم، وخاصّة
      في الغلالة الغِمْدية للخُصية. المصطلح العربي «قيلة» مأخوذ أصلاً من اليونانية
      (κήλη = kēlē) بمعنى الفتق أو النتوء، وقد تبنّته المعجمية الطبية العربية
      الحديثة بنيةً إضافية مع صفة المادة المتجمّعة (دموية، مائية، صديدية...).
      ويقابله في التراث الطبي العربي مصطلح «الأُدْرَة» لكنّ الأُدْرَة تخصّ
      القيلة المائية (hydrocele) لا الدموية. يحتاج الحقل إلى تشكيل كامل وإثراء بالتعريف.
  blind_candidates:
    - lemma: "أُدْرَةٌ دَمَوِيَّة"
      generation_method: tarkib
      justification: >
        مركّب إضافي وصفي يجمع بين «أُدْرَة» وهو المصطلح العربي التراثي لانتفاخ
        الخُصية (ورد في المعجم الوسيط والمعجم الكبير)، والصفة «دَمَوِيَّة» للتخصيص
        بالتجمّع الدموي تمييزاً عن الأدرة المائية.
    - lemma: "قِيلَةٌ دَمَوِيَّة"
      generation_method: tarkib
      justification: >
        مركّب إضافي وصفي يستخدم «قِيلَة» (من اليونانية kēlē) وهو عنصر
        منتج في المصطلحية الطبية العربية للدلالة على الفتق أو التجمّع في
        تجويف، مع «دَمَوِيَّة» نسبةً إلى الدم.
    - lemma: "تَوَرُّمٌ دَمَوِيّ"
      generation_method: ishtiqaq
      justification: >
        مصدر على وزن تَفَعُّل من «وَرِمَ» يدلّ على حدوث الورم، مع صفة
        «دَمَوِيّ» لتخصيصه بالتجمّع الدموي. لكنّه أعمّ من المفهوم المطلوب
        إذ يشمل أيّ تورّم دمويّ لا القيلة تحديداً.
    - lemma: "هِيمَاتُوسِيل"
      generation_method: taarib
      justification: >
        تعريب مباشر للمصطلح الإنجليزي hematocele على وزن عربي يقبل لام
        التعريف (الهيماتوسيل) والنسبة والجمع السالم. لكنّه ملاذ أخير لوجود
        بديل عربي مسكوك.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "قِيلَة دَمَوِيَّة"
      confirm:
        - text: "«قِيلَةٌ دَمَوِيَّة — hematocele — hématocèle»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«قيلة دموية — تسرب الدم إلى غلالة الخصية.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
        - text: "«قيلة دموية — haematocele — hématocèle»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«قيلَةٌ دَمَوِيَّةٌ مُجَاوِرَةٌ للرَّحِمِ (قيلَةٌ دَمَوِيَّةٌ حَوضِيَّة) — parametric hematocele (pelvic hematocele)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يوجد أنواع فرعية متعدّدة للقيلة الدموية (حوضية، فرجية، صفنية، مهبلية، خلف الرحم) ما يؤكد إنتاجية المصطلح"
        - text: "«قيلَةٌ دَمَوِيَّةٌ صَفَنِيَّة — scrotal hematocele»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "القيلة الدموية الصفنية هي النوع الأكثر صلة بتعريف المجموعة (تورّم غشاء الخصية)"
    - lemma: "أُدْرَةٌ دَمَوِيَّة"
      contradicts:
        - text: "«الأُدْرَة — انتفاخ الخُصْية, لتسرب سائل فيها — الخصية المنتفخة»"
          source: "المعجم الوسيط"
          conflict: "الأُدْرَة في المعجم الوسيط مرتبطة بتسرّب سائل (hydrocele) لا بتجمّع الدم"
        - text: "«الأُدْرَة — الخُصية المنتفخة (في الطب: Hydrocele): تجمع سائل في غلالة الخصية»"
          source: "المعجم الكبير"
          conflict: "المعجم الكبير يحدّد صراحةً أنّ الأُدْرَة هي hydrocele وليست hematocele"
        - text: "«الأدرة — نفخة في الخصية... وأدرة الماء وتسمّى بأدرة الدّوالي هي انصباب رطوبات متوفّرة إلى عروق الخصيتين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "التهانوي يصف الأدرة بأنها انصباب رطوبات (سوائل) لا دم"
    - lemma: "تَوَرُّمٌ دَمَوِيّ"
      contradicts:
        - text: "«وَرَمٌ دَمَوِيّ — hematoma — hématome»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي الموحد يخصّص «ورم دموي» لمفهوم الهيماتوما (hematoma) وهو مختلف عن القيلة الدموية (hematocele)"
    - lemma: "هِيمَاتُوسِيل"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "قِيلَةٌ دَمَوِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح طبّي عربي مسكوك ومثبّت في ثلاثة معاجم طبّية متخصّصة على الأقلّ
        (المعجم الطبي الموحد 2009، معجم المصطلحات الطبية 1997، المكنز الزراعي).
        له تعريف صريح «تسرب الدم إلى غلالة الخصية» يطابق دلالة المجموعة تماماً.
        بنيته الإضافية الوصفية (قيلة + دموية) منتجة ومقيسة في المصطلحية الطبية
        العربية (قيلة مائية، قيلة صديدية، قيلة دماغية...).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِيلَةٌ دَمَوِيَّة"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "أُدْرَةٌ دَمَوِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أنّ «الأُدْرَة» مصطلح تراثي أصيل لانتفاخ الخُصية، إلا أنّ المعاجم
        العربية (الوسيط، الكبير، كشّاف اصطلاحات الفنون) تُقيّده بالقيلة المائية
        (hydrocele) لا الدموية. والمعجم الطبي الموحد لم يُسجّل «أدرة دموية»
        كمصطلح. استخدام هذا المركّب سيُوقع التباساً مع المفهوم الراسخ للأُدْرَة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَوَرُّمٌ دَمَوِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الطبي الموحد يخصّص «وَرَم دموي» لمفهوم الهيماتوما (hematoma) وهو
        تجمّع دموي موضعي خارج الأوعية في الأنسجة، بينما القيلة الدموية (hematocele)
        تجمّع دموي في تجويف مصلي. استخدام «تورّم دموي» سيوقع خلطاً بين المفهومين.
      evidence_assessment:
        case: contradicts_only

    - lemma: "هِيمَاتُوسِيل"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُسجَّل هذا التعريب في أيّ معجم عربي متخصّص. وبما أنّ البديل العربي
        المسكوك «قِيلَة دَمَوِيَّة» موجود ومثبّت ومتداول، فلا مسوّغ للتعريب
        وفق مبدأ إيثار العربي.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "تورم ناتج عن تجمع الدم في تجويف الجسم (وخاصة تورم الغشاء الذي يغطي الخصية)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية من الإنجليزية، وفيه تكرار لكلمة «تورم»،
        ويفتقر إلى الدقّة الطبّية (الغشاء الذي يغطي الخصية → الغلالة الغِمْدية).
        يحتاج إعادة صياغة بأسلوب المعجم الوسيط مع تحديد الجنس القريب والفصل النوعي.
    authored:
      - type: terminological
        text: "تَجَمُّعُ الدَّمِ في تَجْويفٍ مَصْلِيٍّ مِنْ تَجاويفِ الجِسْمِ، ويُطلَقُ خاصَّةً على تَجَمُّعِهِ في الغِلالَةِ الغِمْدِيَّةِ لِلخُصْيَةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "حالَةٌ مَرَضِيَّةٌ يَتَسَرَّبُ فيها الدَّمُ إلى غِلالَةِ الخُصْيَةِ أو إلى تَجْويفٍ مَصْلِيٍّ آخَرَ في الجِسْمِ، فيَنْشَأُ عَنْهُ انْتِفاخٌ مَوْضِعِيٌّ. وقَدْ تَنْتُجُ عن إصابَةٍ رَضِّيَّةٍ أو إجراءٍ جِراحِيٍّ أو اضْطِرابٍ في تَخَثُّرِ الدَّمِ."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "تَجَمُّعُ الدَّمِ في تَجْويفٍ مَصْلِيٍّ مِنْ تَجاويفِ الجِسْمِ، ويُطلَقُ خاصَّةً على تَجَمُّعِهِ في الغِلالَةِ الغِمْدِيَّةِ لِلخُصْيَةِ."

  examples:
    per_lemma:
      - lemma: "قِيلَةٌ دَمَوِيَّة"
        examples:
          - text: "كَشَفَ التَّصْويرُ بالأَمْواجِ فَوْقَ الصَّوْتِيَّةِ عن قِيلَةٍ دَمَوِيَّةٍ في الصَّفَنِ ناجِمَةٍ عن الإصابَةِ الرَّضِّيَّةِ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "كَشَفَ التَّصْويرُ بالأَمْواجِ فَوْقَ الصَّوْتِيَّةِ عن قِيلَةٍ دَمَوِيَّةٍ في الصَّفَنِ ناجِمَةٍ عن الإصابَةِ الرَّضِّيَّةِ."


# ── المرحلة ٥: الإثراء ──────────────────────────────────
