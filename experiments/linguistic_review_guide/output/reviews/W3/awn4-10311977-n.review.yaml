# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «منتج» مكتوبة بلا تشكيل في قاعدة البيانات؛ والصيغة الصحيحة المشكَّلة مُنْتِج"
      - "اللمّة «مُصنِّع» تفتقر إلى الفتحة على الصاد؛ والصيغة الصحيحة مُصَنِّع"
      - "التعريف الحالي «شخص يقوم بتصنيع شيء ما» يقصر المفهوم على الأشخاص الطبيعيين ويُغفل الشركات والمؤسسات الصناعية"
      - "يتداخل المعنى الكلاسيكي للمُنتِج (وقت الإنتاج/الولادة عند الدواب) مع الاستخدام الحديث (producer)"
      - "المصنع (اسم المكان = factory) ومُصنِّع (اسم الفاعل = manufacturer) متشابهان في الرسم غير المشكَّل مما يُفضي إلى لبس"
    observations: >
      المجموعة تضمّ لمّتين من التوظيف الحديث للجذرين العربيين ن-ت-ج وص-ن-ع:
      «مُنْتِج» من أنتج (باب الإفعال)، و«مُصَنِّع» من صنَّع (باب التفعيل).
      كلتاهما موثَّقتان في المعجم الاصطلاحي الحديث (ARABTERM والمورد الحديث)،
      لكنّ المعاجم الكلاسيكية تسجّل للجذرين معاني مختلفة: المُنتِج = وقت ولادة الدواب،
      والمصنع = الموضع الذي تُمارَس فيه الصناعة. المجموعة الأعلى (صانع/مُشكِّل)
      تمثّل الجنس القريب، وهذه المجموعة تخصِّصه بالتصنيع الاحترافي/الصناعي.
      التمييز الدقيق بين اللمّتين: مُنْتِج أعمّ دلالةً ويشمل المنتجَ الزراعي والفني،
      أما مُصَنِّع فأخصّ بالصناعة التحويلية.

  blind_candidates:
    - lemma: "نَتَّاج"
      generation_method: ishtiqaq
      justification: "مشتق من جذر ن-ت-ج على وزن فَعَّال الدال على الاحتراف والكثرة؛ ليدلّ على من ينتج كثيراً ويحترف الإنتاج، على نحو نجَّار وحدَّاد"
    - lemma: "صَنَّاع"
      generation_method: ishtiqaq
      justification: "مشتق من جذر ص-ن-ع على وزن فَعَّال للاحتراف؛ للدلالة على المحترف في الصنع والتصنيع بوصفه حِرفة راسخة"
    - lemma: "مُتَصَنِّع"
      generation_method: ishtiqaq
      justification: "اسم فاعل من تصنَّع (الباب الخامس من ص-ن-ع)؛ للدلالة على من انتهج التصنيع وانخرط فيه مهنةً واحترافاً"
    - lemma: "رَبُّ الصِّنَاعَة"
      generation_method: tarkib
      justification: "تركيب إضافي كلاسيكي يدلّ على سيّد الحرفة ومتقنها؛ استُعمل في المؤلفات الكلاسيكية للدلالة على المحترف الكبير في صنعته"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "مُنْتِج"
      confirm:
        - text: "«مُنْتِج [وضدُّها: المستهلِك]»"
          source: "المورد الحديث (2008)"
        - text: "«منتج — producer»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«منتِج — producer»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«مُنْتِج — producer»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      contradicts:
        - text: "«المُنْتِجُ: وقت الإنتاج (ج) مناتِج»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يُعرِّف المُنتِج بأنه وقت الولادة عند الدواب لا الشخص المنتِج، مما يكشف عن تباين بين الدلالة الكلاسيكية والاستخدام الحديث"
      expands:
        - text: "«(١) المُبْرِز؛ المُورِد (٢) المُحْدِث؛ المُسَبِّب (٣) المُنْتِج [وضدُّها: المستهلِك] (٤) مُوَلِّد الغاز (٥) المُخْرِج أو المُنْتِج لمسرحية»"
          source: "المورد الحديث (2008)"
          addition: "يكشف عن تعدد دلالات مُنتِج في العربية الحديثة: منتج اقتصادي، ومنتج فني (مخرج)، ومنتج تقني (مولّد الغاز)"

    - lemma: "مُصَنِّع"
      confirm:
        - text: "«مُصنِّع — manufacturer»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
        - text: "«مُصنِّع معدّات أصلي: الصانعُ لمعدّةٍ ما. في صناعة الحواسيب والمعدّات المتعلقة بها، تشتري مصانعُ المعدّات الأصلية عادةً مكوِّنات من مصانع معدّات أصلية أخرى، ثم تكاملها في منتجاتها، ثم تبيع هذه المنتجات إلى العموم»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«مصنع, الأجواء المتفجرة — manufacturer, <explosive atmospheres>»"
          source: "موسوعة الكهرباء (IEC 60050)"
        - text: "«الصِّناعيّ: صاحب المصنع أو المعمل»"
          source: "المورد الحديث (2008) — تحت مدخل manufacturer"
      contradicts:
        - text: "«المَصْنَعُ: الموضع تُمارَس فيه صناعةٌ أو صناعات مختلفة / شبه الحوض يجمع فيه ماء المطر / المصانع: المبانى من القصور والحصون والقرى والآبار وغيرها»"
          source: "المعجم الوسيط"
          conflict: "المعاجم الكلاسيكية تُعرِّف (مصنع) بالمكان لا بالشخص، والرسم غير المشكَّل «مصنع» مشترك بين مَصْنَع (مكان) ومُصَنِّع (شخص)"

    - lemma: "نَتَّاج"
      contradicts:
        - text: "«نَتَّاج: من (ن ت ج) كثير الثمر، وكثير الأولاد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "نتّاج يدلّ على الخصب والكثرة في الإنتاج البيولوجي لا على الصانع أو المصنِّع"
      expands:
        - text: "«النُّونُ وَالتَّاءُ وَالْجِيمُ كَلِمَةٌ وَاحِدَةٌ، هِيَ النِّتَاجُ. وَنُتِجَتِ النَّاقَةُ؛ وَنَتَجَهَا أَهْلُهَا. وَفَرَسٌ نَتُوجٌ: اسْتَبَانَ نِتَاجُهَا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ن-ت-ج في أصله يدور على نتاج الحيوان؛ وإن توسّعت دلالته حديثاً إلى الإنتاج بوجه عام"

    - lemma: "صَنَّاع"
      contradicts:
        - text: "«الصَّنَّاعُ: الخَشَبُ يُتَّخَذُ ليُحْبَسَ به الماءُ ويمسكه حينًا»"
          source: "المعجم الكبير"
          conflict: "صَنَّاع تعني أيضاً الخشب المانع للماء، وهي دلالة بعيدة تماماً عن الاستعمال المطلوب"
        - text: "«صَنَاعُ اليدِ: الماهرُ أو الماهرة في العمل باليدين — يقال رجلٌ أو امرأة صَنَاعُ اليد أو اليدين»"
          source: "المعجم الوسيط"
          conflict: "صَنَاع/صَنَّاع صفةٌ تدلّ على المهارة اليدوية لا اسمٌ لمحترف التصنيع؛ وهي أقرب إلى النعت منها إلى اسم المهنة"
      expands:
        - text: "«الصَّادُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ، وَهُوَ عَمَلُ الشَّيْءِ صُنْعًا. وَامْرَأَةٌ صَنَاعٌ وَرَجُلٌ صَنَعٌ، إِذَا كَانَا حَاذِقَيْنِ فِيمَا يَصْنَعَانِهِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "ابن فارس يربط صَنَاع بالحذق والمهارة لا بالاحتراف الصناعي المنظَّم"

    - lemma: "مُتَصَنِّع"
      contradicts:
        - text: "«التَّصَنُّعُ: حُسْنُ السَّمْتِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "تصنَّع في أصله اللغوي يعني التظاهر بحسن السمت؛ وفي الاستخدام المعاصر يدلّ على الاصطناع والتكلّف، لا احتراف التصنيع"

    - lemma: "رَبُّ الصِّنَاعَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُنتِج"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة في مصادر اصطلاحية متعددة بمعنى producer/منتج اقتصادي (تجارة، كيمياء، صيدلة، المورد الحديث)؛
        وإن كانت دلالتها الكلاسيكية (وقت ولادة الدواب) مختلفة، فالاستخدام الحديث راسخ في المعجمية العربية الحديثة.
        تحتاج اللمّة إلى تشكيل كامل: مُنْتِج.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ دلالةً من مُصَنِّع؛ يشمل المنتجَ الزراعي والصناعي والفني والإعلامي، ويُقابَل بالمستهلِك"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنْتِج"

    - lemma: "مُصنِّع"
      decision: confirmed
      decision_reason: >
        اللمّة مؤكَّدة في مصادر اصطلاحية تقنية متعددة (مياه، معلوماتية، كهرباء) بمعنى manufacturer؛
        وهي اسم فاعل قياسي من الباب الثاني (صنَّع) على وزن مُفَعِّل.
        تحتاج إلى ضبط كامل بإضافة فتحة الصاد: مُصَنِّع.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أخصّ من مُنْتِج؛ مقتصرٌ على الصناعة التحويلية التي تحوِّل المواد الأولية إلى منتجات مصنوعة؛ لا يُطلق على المنتج الزراعي أو الفني"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُصَنِّع"

    - lemma: "نَتَّاج"
      source: stage1
      decision: removed
      decision_reason: >
        نتّاج في اللغة الكلاسيكية يعني كثير الأولاد والثمر ولا صلة له بالتصنيع الصناعي؛
        والجذر ن-ت-ج في أصله عند ابن فارس يدور على نتاج الحيوان.
        لا يصلح اصطلاحاً لهذه المجموعة.

    - lemma: "صَنَّاع"
      source: stage1
      decision: removed
      decision_reason: >
        صَنَّاع/صَنَاع صفةٌ كلاسيكية للمهارة اليدوية (حاذق في الصنع) لا اسمٌ لمحترف التصنيع الصناعي؛
        وله دلالة ثانية بعيدة (الخشب الحابس للماء)؛ فلا يصلح مصطلحاً دقيقاً بديلاً.
        فضلاً عن ذلك فإن صانع هو لمّة الأجدى في المجموعة الأعلى.

    - lemma: "مُتَصَنِّع"
      source: stage1
      decision: removed
      decision_reason: >
        مُتَصَنِّع يعني المتظاهر أو المتكلّف حسبما أصَّله ابن فارس في (التصنّع: حسن السمت)؛
        ويوهم في الاستخدام المعاصر الاصطناع والتكلّف السلبي لا الاحتراف الصناعي.

    - lemma: "رَبُّ الصِّنَاعَة"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ لا مصطلح مسكوك؛ يفشل اختبار التثبيت المعجمي إذ يمكن إبدال «رب» بـ«سيد» أو «صاحب»
        مع بقاء المعنى ذاته. وليس له توثيق في المعجمية الحديثة كمصطلح ثابت.


