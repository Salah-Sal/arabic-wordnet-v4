# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92422923-n
# المفهوم: خلل وظيفي (dysfunction / malfunction)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (خلل وظيفي) وهي تعبير مركب إضافي-وصفي، ولا يوجد مرادف مفرد"
      - "التعريف العربي ترجمة حرفية ضعيفة: «حالة العمل بشكل غير صحيح أو غير طبيعي» — أسلوب ركيك وليس معجمياً"
      - "اللمّة الموجودة بدون تشكيل"
    observations: "المفهوم يندرج تحت «حالة كونه معيباً» (العيب/القصور) ويختص بالجانب الوظيفي — أي أن الشيء يعمل لكن بصورة غير سوية. هذا يميّزه عن العُطل (التوقف التام) والعَطَب (التلف المادي). المصطلح «خلل وظيفي» مستقر في الاستعمال الطبي والتقني المعاصر."
  blind_candidates:
    - lemma: "اخْتِلَالٌ"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من الجذر خ-ل-ل، يدل على وقوع الخلل والاضطراب في الشيء. شائع في النصوص العلمية والطبية بمعنى الاختلال الوظيفي."
    - lemma: "عُطْلٌ"
      generation_method: ishtiqaq
      justification: "من الجذر ع-ط-ل الدال على الخلو والفراغ، يُستعمل في السياق التقني بمعنى توقف الآلة عن العمل السوي أو تعطّلها."
    - lemma: "اضْطِرَابٌ وَظِيفِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من اضطراب (افتعال من ض-ر-ب بمعنى عدم الاستقرار) ووظيفي. يُستعمل في الطب والهندسة للدلالة على عدم انتظام الوظيفة."
    - lemma: "سُوءُ الْأَدَاءِ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين سوء (القُبح والرداءة) والأداء (تنفيذ العمل)، يدل على أداء العمل بصورة رديئة أو غير صحيحة."

stage2_evidence:
  per_lemma:
    - lemma: "خَلَلٌ وَظِيفِيٌّ"
      confirm:
        - text: "«اختلال في وظيفة عضو أو جهاز.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«اضطراب في وظيفة عضو ما.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«مصطلح للدلالة على أي خلل يحدث في الحاسوب أو في أجهزته المساعدة.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«الخَلَل الوظيفيّ (ط).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«خَلَلٌ وَظيفِيٌّ سَمْعِيٌّ مَرْكَزِيّ» / «خَلَلٌ وَظيفِيٌّ بِنْيَوِيٌّ كَبِدِيّ» / «خَلَلٌ وَظيفِيٌّ دِماغِيٌّ بَسيط»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المصطلح يدخل في مركبات طبية متعددة مما يدل على رسوخه واطّراده"

    - lemma: "اخْتِلَالٌ"
      confirm:
        - text: "«تغير يصيب بالتلف عضوا ما أو معظم أنسجته مما يؤدي إلى فقدان خصائصه.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
      contradicts:
        - text: "«اختلال = disorder / disequilibrium / disorganization» في أغلب المعاجم الموحدة"
          source: "معاجم ALECSO المتعددة"
          conflict: "الدلالة الغالبة لـ«اختلال» هي عدم التوازن والاضطراب العام، لا الخلل الوظيفي تحديداً"
      expands:
        - text: "«شذوذ أداء الوظيفة أو نقصها في الكائن العضويّ.» (اختلال الوظيفة = dysfunction)"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          addition: "صيغة «اختلال الوظيفة» (بالإضافة للمعرفة) مستعملة للدلالة على dysfunction، لكنها تختلف بنيوياً عن «اختلال» المفرد"

    - lemma: "عُطْلٌ"
      contradicts:
        - text: "«عبارة عن كل المؤثرات التي من شأنها العمل على مد فترة رحلة إحدى المواصلات العامة مقارنة بالوقت المثالي» = malfunction / disturbance / fault"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          conflict: "العُطل يدل على التوقف الكلي أو التأخير الناجم عن عطب، لا على العمل بصورة غير سوية"
        - text: "«عَيبٌ ماديٌّ، مثل التوصيل الرخو الذي يَمنع نظاماً أو تجهيزة من العمل كما يجب.» (عطل ، خلل = fault)"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "العطل هنا عيب مادي يمنع العمل الصحيح — أقرب إلى fault منه إلى dysfunction"
      expands:
        - text: "«خَلَل؛ عُطْل؛ عَطَبٌ.» = fritz"
          source: "المورد الحديث (2008)"
          addition: "يُصنَّف العُطل مع الخلل والعطب في حقل دلالي واحد لكن بدرجات متفاوتة"

    - lemma: "اضْطِرَابٌ وَظِيفِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "سُوءُ الْأَدَاءِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خَلَلٌ وَظِيفِيٌّ"
      decision: confirmed
      decision_reason: "مصطلح مستقر في المعاجم الطبية والتقنية الموحدة (الطب البيطري، التشريح، المعجم الطبي الموحد، مسرد التربية، المورد الحديث). يرد بتشكيل «خَلَلٌ وَظيفِيٌّ» في المعجم الطبي الموحد. يدخل في مركبات اصطلاحية ثابتة متعددة مما يؤكد رسوخه."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح الرئيس والأكثر تخصصاً للدلالة على حالة العمل بصورة غير سوية، دون أن يعني التوقف الكلي أو التلف المادي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلَلٌ وَظِيفِيٌّ"

    - lemma: "اخْتِلَالٌ"
      source: stage1
      decision: removed
      decision_reason: "دلالة «اختلال» الغالبة في المعاجم الموحدة هي disorder / disequilibrium / disorganization — أي عدم الانتظام والاختلال العام، وهو أعم من مفهوم الخلل الوظيفي (dysfunction). صيغة «اختلال الوظيفة» بالإضافة المعرّفة موجودة لكنها بنية مختلفة عن «اختلال» المفرد. إدراجه سيُوسّع المجموعة عن مفهومها المحدد."

    - lemma: "عُطْلٌ"
      source: stage1
      decision: removed
      decision_reason: "العُطل يدل على التوقف الكلي أو الخلل المادي الذي يمنع العمل (fault / breakdown)، لا على العمل بصورة غير سوية. الفرق بين dysfunction (يعمل لكن بشكل خاطئ) وfault/breakdown (لا يعمل أصلاً) جوهري."

    - lemma: "اضْطِرَابٌ وَظِيفِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على شواهد معجمية لهذا المركب بوصفه وحدة اصطلاحية ثابتة. «اضطراب» وحده يُترجم disturbance / disorder وهو أعم من dysfunction. المركب لا يجتاز اختبار التثبيت المعجمي."

    - lemma: "سُوءُ الْأَدَاءِ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة لا ترقى إلى مرتبة المصطلح المسكوك. تجتاز اختبار الاستبدال (يمكن قول «رداءة الأداء» بالمعنى نفسه) مما يدل على أنها ليست وحدة معجمية ثابتة. كما أنها تصف النتيجة (أداء رديء) لا الحالة (خلل في الوظيفة)."

