# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. التوليد الأعمى من synset_info_masked.yaml
  #    التعريف: فنان يرمي ويلتقط عدة أشياء في الهواء ببراعة يدوية
  blind_candidates:
    - lemma: "شَعَّاذ"
      generation_method: ishtiqaq
      justification: >-
        الجذر شعذ ورد في مقاييس اللغة (الخليل): «الشَّعْوَذَةُ خِفَّةٌ فِي الْيَدَيْنِ وَأُخْذَةٌ كَالسِّحْرِ».
        الشعوذة الأصيلة = البراعة اليدوية، وهو بالضبط وصف قاذف الكرات.
        وزن فَعَّال يدل على الاحتراف والإكثار من الفعل، مما يجعل «شَعَّاذ» مرشحاً اشتقاقياً
        لمن يحترف خفة اليد في الهواء. إحياء للفظ التراثي قبل انحراف دلالة «مشعوذ» نحو الاحتيال.

    - lemma: "مُلَاعِبُ الكُرَات"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من «مُلَاعِب» (صيغة مبالغة من لاعب، وزن مُفَاعِل للمواظبة)
        و«الكُرَات» (جمع كرة، وهي الأداة الأساسية لقاذف الكرات).
        يصف بدقة النشاط المتكرر لإلقاء الكرات والتلاعب بها في الهواء.

    - lemma: "خَيَّال"
      generation_method: majaz
      justification: >-
        من خيل — الخيال ما يتشبّه للعين من صورة؛ قاذف الكرات يُحدث «وهماً» بصرياً
        كأن الكرات معلّقة في الهواء. إحياء بالمجاز الوظيفي: من يصنع صورة خيالية بيديه.
        (لم يثبت كاصطلاح — مقترح للاختبار فقط)

    - lemma: "بَهْلَوَان"
      generation_method: taarib
      justification: >-
        لفظ معرَّب من الفارسية «پهلوان» (البطل/الماهر)، دخل العربية واستقرّ فيها.
        يُستخدم في المعاجم الحديثة للمؤدّي البارع في ألعاب السيرك ويقبل التعريف
        والنسبة (بهلوانيات) والجمع (بهاليوان). يشمل القذف والتلقف ضمن مهاراته.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >-
        اللمَّتان الموجودتان (قاذف الكرات، لاعب خفة) غير موثَّقتَيْن في المعاجم المعتمدة
        كوحدات معجمية ثابتة؛ هما تعبيران وصفيان لا مصطلحان مسكوكان.
      - >-
        «قاذف الكرات»: لفظ «قاذف» يحمل دلالات تقنية بحتة في معاجم المصطلحات (قاذف
        إلكتروني، قاذف بخاري، قاذف الزيت) مما يُوجد تشاباً مصطلحياً مع المجال التقني.
      - >-
        «لاعب خفة»: الصيغة وصفية (لاعب + اسم)، مستنبطة من «خفة اليد» التي تُرجم
        المورد الحديث بها legerdemain. الإضافة مفتوحة: يمكن القول لاعب حيل/لاعب أعراب،
        مما يكشف غياب التثبيت المعجمي. غائبة التشكيل.
      - >-
        كلتا اللمَّتَيْن تفتقران إلى التشكيل الكامل في السجل.
      - >-
        المفهوم يعاني فجوة معجمية (lexical gap) في العربية؛ أقرب المصطلحات المعتمدة هو
        «بهلوان» (أعم) و«مشعوذ» (بدلالة سلبية معاصرة) وكلاهما غير مثبَّت في المجموعة.
    observations: >-
      يقع المفهوم (فنان قذف الكرات / juggler) في منطقة معجمية هشّة في العربية المعاصرة.
      الشعوذة في أصلها العربي الكلاسيكي تعني خفة اليدين وسرعة الحركة -وهو وصف دقيق
      للمفهوم- لكن دلالتها انزلقت حديثاً نحو الاحتيال والسحر، مما جعل «مشعوذ» مثيراً
      للإشكال الأخلاقي. أما «بهلوان» فهو المصطلح الأوسع انتشاراً والأقل إشكالاً، وإن
      كان يشمل الأكروبات عموماً. اللمَّتان الموجودتان وصفيتان ولا بأس بإبقائهما مع
      تشكيلهما، لكن يُستحسن إضافة «بهلوان» تعزيزاً للتغطية المعجمية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: نُفِّذت الاستعلامات الآتية:
  #  ١. batch headword lookup: قاذف الكرات، لاعب خفة، خيال، بهلوان، مشعوذ، حاوي، شعاذ
  #  ٢. English bridge: juggler, juggling, prestidigitator, conjurer
  #  ٣. Arabic FTS: بهلوان، حاوي، مشعوذ، شعوذة، قاذف، خفة اليد
  #  ٤. Maqayis: شعذ، قذف، لعب، كور، بهل
  #  المجموع: ٥ استعلامات

  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "قاذف الكرات"
      expands:
        - text: >-
            «يُشَعْوِذُ؛ يقوم بألعاب المشعوذين [قاذفًا الكُرَاتِ والمُدى في الهواء]»
          source: "المورد الحديث (2008) — ترجمة فعل to juggle"
          addition: >-
            يؤكد الدليل أن «قاذفاً الكرات والمدى في الهواء» هو الوصف المعجمي لفعل
            الجغلة (juggling) في العربية المعاصرة، لكن بصيغة وصفية تشريحية لا كمصطلح ثابت.
        - text: >-
            «قَاذِف: وصف للذي يقذف» (المعجم الطبي الموحد) ؛
            «قاذِف: ejector» (معاجم الكهرباء والمياه) ؛
            «قَاذِف، ناثر: jaculatory» (مسرد علم الأحياء)
          source: "معاجم مصطلحية متعددة (arabterm)"
          addition: >-
            يكشف عن تشابه مصطلحي: «قاذف» مشغول في مجالات تقنية متعددة (الكهرباء،
            الطب، المياه) بمعنى ejector/launcher، وهذا يُضعف صلاحيته مصطلحاً فنياً للجغلة.

    - lemma: "لاعب خفة"
      expands:
        - text: >-
            «(1) خفّة اليد؛ شعوذة (2) خداع (3) حيلة» — ترجمة legerdemain
          source: "المورد الحديث (2008)"
          addition: >-
            يربط بين خفة اليد والشعوذة والحيلة، مما يؤكد أن «لاعب خفة» يُحيل إلى
            مفهوم قريب من الجغلة، غير أنه يشمل الشعوذة المسرحية بشكل أعم.
        - text: >-
            «الخِفَّة: ضِدُّ الثِّقَل، الرُّجُوح، يكونُ في الجِسْم وما لَـه ثِقَلٌ ووَزْنٌ،
            وهو في العَقْل والعمل مجازٌ»
          source: "المعجم الكبير — مجمع اللغة العربية"
          addition: >-
            يؤكد أن الخفة حسية في الأصل (ضد الثقل)، وهي صفة اليدين المتحركتين بسرعة.

    # ── مرشحات المرحلة الأولى ────────────────────────────────

    - lemma: "شَعَّاذ"
      expands:
        - text: >-
            «الشِّينُ وَالْعَيْنُ وَالذَّالُ لَيْسَ بِشَيْءٍ. قَالَ الْخَلِيلُ:
            الشَّعْوَذَةُ لَيْسَتْ مِنْ كَلَامِ أَهْلِ الْبَادِيَةِ، وَهِيَ خِفَّةٌ
            فِي الْيَدَيْنِ، وَأُخْذَةٌ كَالسِّحْرِ»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >-
            يثبت أن أصل الجذر شعذ = خفة اليدين (البراعة اليدوية)، وهو بالضبط وصف قاذف الكرات.
            غير أن وزن فَعَّال (شَعَّاذ) غير موثَّق في أي معجم، مما يجعله اشتقاقاً قياسياً
            جديداً غير مسكوك.
        - text: >-
            «(شعوذ) شعوذةً: شَعبذ فهو مشعوذ»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35)"
          addition: "يثبت الجذر شعذ وبناء اسم الفاعل مشعوذ، دون وزن فعّال."
        - text: >-
            «شعوذ: لعبة كؤوس المشعبذ... شعوذة: عند الإشارة إلى الحواة يقال: بنو الشعوذة»
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "يربط الشعوذة بفن الحواة (snake charmers/conjurers) لا بقاذفي الكرات تحديداً."

    - lemma: "مُلَاعِبُ الكُرَات"
      evidence_status: "no_material_found"

    - lemma: "خَيَّال"
      contradicts:
        - text: >-
            «الخَيَالُ: الشَّخْص والطيف وما تشبَّه لك في اليقظة والمنام من صورة؛
            خشبة يُنصب عليها كساء أسود في المزروعات يُفزَع بها الطير؛
            إحدى قوى العقل التي يتخيَّل بها الأشياء»
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: >-
            الخيال يعني الطيف والوهم والخيال المرئي ولا يحمل أي دلالة على القذف
            والتلقف أو البراعة اليدوية. المعنى مختلف جذرياً.
        - text: >-
            «الخَيَّال: صاحِبُ الخُيول وفارِسُها»
          source: "المعجم الوسيط — مجمع اللغة العربية"
          conflict: >-
            الخَيَّال (بتشديد الياء) = صاحب الخيل وفارسها، لا علاقة له بالجغلة.

    - lemma: "بَهْلَوَان"
      confirm:
        - text: >-
            «البارع في نوع من الألعاب كالمشي على الحبل. (مع)»
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
        - text: >-
            «بَهْلَوان: jongleur(fr.)»
          source: "مسرد الفن والتسلية والرياضة — المنظمة العربية للتربية والثقافة والعلوم"
        - text: >-
            «بهلوان: acrobat»
          source: "مسرد الجغرافيا والتاريخ — المنظمة العربية للتربية والثقافة والعلوم"
        - text: >-
            «بَهْلَوان: عن الفارسية والتركية بمعنى الفتى القوي البنيان والشجاع،
            والبطل والبارع في نوع من الألعاب كالمشي على الحبل ولاعب السيرك»
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: >-
            «البهلوان الجوّيّ: بهلوان يقوم بألعاب بارعة في الهواء»
          source: "المورد الحديث (2008) — ترجمة aerialist"
          addition: >-
            يثبت أن «بهلوان» يتوسّع نحو الألعاب الجوية (في الهواء) مما يقرِّبه
            من مفهوم قاذف الكرات الذي يُلقي في الهواء.
        - text: >-
            «بَهْلَوان السِّلك: بهلوان يسير على الأسلاك»
          source: "المورد الحديث (2008) — ترجمة wirewalker"
          addition: >-
            يكشف أن «بهلوان» مصطلح جنسي يُخصَّص بالإضافة، مما يعني إمكانية
            التخصيص ليشمل قاذف الكرات (بهلوان القذف / البهلوان القاذف).


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى: قاذف الكرات ───────────────────────────
    - lemma: "قاذف الكرات"
      decision: confirmed
      decision_reason: >-
        رغم كونه وصفاً إضافياً لا مصطلحاً مسكوكاً تاماً، فإنه يُعبِّر عن الفعل الجوهري
        (القذف) والأداة (الكرات) بدقة، ويُشكِّل مع «لاعب خفة» ثنائية وصفية مقبولة.
        ورد في سياق وصفي في المورد الحديث. لا بديل مسكوك موثَّق يُغنيه حتى الآن.
        غائب التشكيل — يستوجب التحديث.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      loan_check:
        is_calque: true
        calque_note: >-
          ترجمة حرفية لـ ball-thrower؛ الإنجليزي juggler يعني أوسع من رمي الكرات تحديداً.
      morphology_check:
        pattern: "فَاعِل + الفَعَلَات"
        note: >-
          قاذف: اسم فاعل من قذف (ثلاثي). القياس صحيح لكن «قاذف» مُثقَل بالاستخدام
          التقني (قاذف إلكتروني، قاذف بخاري)؛ يُولِّد اشتراكاً مع المجال التقني.
      quality_gate:
        consistency: مقبول (مطّرد قياسياً)
        ease_of_use: متوسط (مركب من كلمتين)
        appropriateness: مقبول (يصف الجوهر)
        classical_preference: ضعيف (لا توثيق في المعاجم الكلاسيكية)
        arabic_preference: جيد (عربي خالص)
        derivability: جيد (قاذف + كرات)
      nuance_differentiation: >-
        يُركِّز على الجانب الحركي التنفيذي (فعل الرمي وأداته) دون التعبير عن
        الجانب الفني أو الجمالي أو شمولية المفهوم؛ هو أضيق دلالةً من «لاعب خفة»
        الذي يُشير إلى البراعة الشاملة، ومن «بهلوان» الذي يُحيل إلى الفنان الكامل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَاذِفُ الكُرَات"

    # ── اللمّة الثانية: لاعب خفة ─────────────────────────────
    - lemma: "لاعب خفة"
      decision: confirmed
      decision_reason: >-
        «خفة اليد» وصف عربي كلاسيكي موثَّق للمهارة اليدوية (لم يغب من الاستخدام
        حتى اليوم)، و«لاعب خفة» استخدام طبيعي في السياق العربي. الأدلة تربط خفة اليد
        بالشعوذة/الجغلة. اللمّة تفتقر للتشكيل — تستوجب التحديث.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      morphology_check:
        pattern: "فَاعِل + اسم مصدر"
        note: >-
          لاعب: اسم فاعل من لَعِب (ثلاثي). الإضافة إلى «خِفَّة» صحيحة صرفياً.
          المقاييس: «اللَّامُ وَالْعَيْنُ وَالْبَاءُ... إِحْدَاهُمَا اللَّعِبُ مَعْرُوفٌ».
      quality_gate:
        consistency: مقبول
        ease_of_use: جيد (كلمتان سهلتان)
        appropriateness: جيد (الخفة = البراعة اليدوية)
        classical_preference: جيد (خفة اليد توثيق كلاسيكي)
        arabic_preference: جيد (عربي خالص)
        derivability: جيد
      nuance_differentiation: >-
        يُركِّز على المهارة اليدوية (الخِفَّة) دون تحديد الأشياء المستخدمة؛
        أشمل من «قاذف الكرات» (يشمل الحلقات والأعصية والسكاكين أيضاً)، لكنه
        أقل تخصصاً من الناحية الفنية. قد يُحيل أيضاً إلى الشعبذة عموماً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاعِبُ خِفَّة"

    # ── مرشح المرحلة الأولى: شعاذ ────────────────────────────
    - lemma: "شَعَّاذ"
      source: stage1
      decision: removed
      decision_reason: >-
        الجذر شعذ موثَّق وصالح (خفة اليدين) لكن وزن فَعَّال غير موثَّق لهذا الجذر
        في أي من المعاجم المستعلَمة. «شعاذ» لفظ غير مسكوك يفشل اختبار التثبيت
        المعجمي. الاشتقاق القياسي وحده غير كافٍ دون سابقة استخدام.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة الأولى: ملاعب الكرات ───────────────────
    - lemma: "مُلَاعِبُ الكُرَات"
      source: stage1
      decision: removed
      decision_reason: >-
        تعبير وصفي غير مسكوك ولا موثَّق في أي مصدر. فضلاً عن ذلك، يتداخل مع
        «قاذف الكرات» الموجودة دلالياً دون إضافة. يفشل اختبار الاستبدال: يمكن
        تبديل «مُلَاعِب» بـ«قاذف» أو «رامي» بلا فقدان. ليس وحدة معجمية مثبَّتة.
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة الأولى: خيال ────────────────────────────
    - lemma: "خَيَّال"
      source: stage1
      decision: removed
      decision_reason: >-
        المعنى المعجمي الثابت للخَيَّال = صاحب الخيل وفارسها. والخيال عموماً = الطيف
        والوهم والقوة التخيّلية. لا صلة دلالية بفعل القذف والتلقف. المجاز المقترح
        بعيد وغير مباشر ويفشل اختبار الملاءمة.
      evidence_assessment:
        case: contradicts_only

    # ── مرشح المرحلة الأولى: بهلوان ──────────────────────────
    - lemma: "بَهْلَوَان"
      source: stage1
      decision: confirmed
      decision_reason: >-
        موثَّق في المعاجم المعتمدة (المعجم الوسيط، المورد الحديث، مسارد المنظمة العربية)
        بمعنى الفنان البارع في ألعاب السيرك. مسرد الفن يُترجم به «jongleur» (قاذف كرات/
        مهرج متجوّل بالفرنسية). يقبل لام التعريف والجمع والنسبة (بهلواني، بهلوانيات).
        وإن كان أعمّ من «juggler» بالمعنى الضيق، فهو أقرب مصطلح عربي مستقرّ.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      loan_check:
