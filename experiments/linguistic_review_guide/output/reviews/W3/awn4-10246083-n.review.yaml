# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
stage5_enrichment:

  per_entry:
    # MWE: قاذف الكرات — مكوِّنان
    - lemma: "قَاذِفُ الكُرَات"
      entry_id: "{auto}"
      roots:
        - word: "قاذف"
          root: "قذف"
          maqayis_quote: >-
            «الْقَافُ وَالذَّالُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى الرَّمْيِ وَالطَّرْحِ.
            يُقَالُ: قَذَفَ الشَّيْءَ يَقْذِفُهُ قَذْفًا، إِذَا رَمَى بِهِ»
        - word: "الكرات"
          root: "كور"
          maqayis_quote: >-
            «الْكَافُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى دَوْرٍ وَتَجَمُّعٍ.
            مِنْ ذَلِكَ الْكَوْرُ: الدَّوْرُ؛ يُقَالُ كَارَ يَكُورُ إِذَا دَارَ»

    # MWE: لاعب خفة — مكوِّنان
    - lemma: "لَاعِبُ خِفَّة"
      entry_id: "{auto}"
      roots:
        - word: "لاعب"
          root: "لعب"
          maqayis_quote: >-
            «اللَّامُ وَالْعَيْنُ وَالْبَاءُ كَلِمَتَانِ مِنْهُمَا يَتَفَرَّعُ كَلِمَاتٌ.
            إِحْدَاهُمَا اللَّعِبُ مَعْرُوفٌ. وَالتِّلْعَابَةُ: الْكَثِيرُ اللَّعِبِ.
            وَالْمَلْعَبُ: مَكَانُ اللَّعِبِ»
        - word: "خفة"
          root: "خفف"
          maqayis_quote: "لم يُعثَر على مدخل لجذر «خفف» في مقاييس اللغة ضمن قاعدة البيانات"

    # مفرد معرَّب: بهلوان
    - lemma: "بَهْلَوَان"
      entry_id: "{auto}"
      root: "بهل"
      maqayis_quote: >-
        «الْبَاءُ وَالْهَاءُ وَاللَّامُ. أُصُولٌ ثَلَاثَةٌ: أَحَدُهَا التَّخْلِيَةُ،
        وَالثَّانِي جِنْسٌ مِنَ الدُّعَاءِ، وَالثَّالِثُ قِلَّةٌ فِي الْمَاءِ» —
        تنبيه: «بهلوان» لفظٌ معرَّب من الفارسية «پهلوان»؛ الجذر العربي بهل
        غير ذي صلة بالمعنى الفارسي الأصلي

  per_sense:
    - lemma: "قَاذِفُ الكُرَات"
      sense_id: "{auto}"
      nuance: >-
        يُركِّز على الجانب الحركي التنفيذي الأساسي (فعل القذف) وعلى الأداة المعتمدة
        (الكرات). هو الأضيق دلالةً بين لمّات المجموعة، ويُلائم السياقات التقنية
        الوصفية حين يُراد الدقة في تحديد نوع العرض.
      mwe: true

    - lemma: "لَاعِبُ خِفَّة"
      sense_id: "{auto}"
      nuance: >-
        يُركِّز على المهارة اليدوية (الخِفَّة = سرعة الحركة وبراعتها) دون تقييد بأداة
        بعينها؛ أشمل دلالةً من «قاذف الكرات» إذ يندرج تحته الألعاب بالكرات والحلقات
        والسكاكين والمناديل وسواها. يستدعي في الذاكرة العربية ربطاً بالشعوذة الفنية.
      mwe: true

    - lemma: "بَهْلَوَان"
      sense_id: "{auto}"
      nuance: >-
        الأعمّ دلالةً بين اللمّات الثلاث؛ يُحيل إلى فنان السيرك الكامل (يشمل القذف
        والأكروبات والتوازن على الحبل وسواها). يُستخدم حين لا يُراد التحديد الدقيق لنوع
        العرض، وهو الأقرب للاستخدام اليومي العربي المعاصر والأوسع في التعاملات.
      mwe: false

  synset:
