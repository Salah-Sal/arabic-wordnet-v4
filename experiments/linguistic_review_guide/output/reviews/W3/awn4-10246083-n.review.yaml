# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "فنان يرمي ويلتقط عدة أشياء في الهواء ببراعة يدوية"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة مباشرة للإنجليزي (a performer who juggles objects and
        performs tricks of manual dexterity) بأسلوب وصفي مسرود لا بأسلوب التعريف
        المعجمي العربي القائم على الجنس والفصل. يفتقر إلى الجنس القريب (فنان استعراضي)
        وتحديد الفصل النوعي (طريقة الأداء والتتابع والمهارة المطلوبة).

    authored:
      - type: terminological
        text: >-
          فَنَّانٌ اسْتِعْرَاضِيٌّ يُلقي عِدَّةَ أجسامٍ كالكُرَات والحَلَقَات والأَعصية
          في الهواءِ ويَتَلَقَّفُها بالتَّتَابُع المُتَوَاصِل، مُعْتَمِداً على خِفَّةِ اليَدَيْن
          وسرعةِ الحَركَة وتوافُق الحواسِّ، دون أن يُسقِطَ شيئاً مما يرمي
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false

      - type: encyclopedic
        text: >-
          فنٌّ أدائيٌّ قديمٌ من فروع البهلوانيات، يقوم فيه الفنان بالتحكم المتزامن
          في ثلاثة أجسام أو أكثر إلقاءً والتقاطاً في سيرورة إيقاعية لا تنقطع،
          وقد يستخدم الكرات أو الحلقات أو الأعصية أو السكاكين. ازدهر هذا الفن في
          أسواق الشرق وميادينه، وبلغ ذروته في فنون السيرك الحديث

