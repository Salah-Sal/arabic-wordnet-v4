      decision_reason: "اليقظة في أصلها اللغوي تعني الانتباه من النوم أو ضد النوم، وهي حالة ذهنية فردية. المفهوم المطلوب حالة تشغيلية عسكرية جماعية تتعلق بجاهزية الطائرات، واليقظة لا تؤدي هذا المعنى التخصصي. كما أن المركب يقظة أرضية غير مسكوك ولا مستعمل."
