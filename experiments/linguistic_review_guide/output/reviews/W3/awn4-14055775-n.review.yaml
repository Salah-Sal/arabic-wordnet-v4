      source: stage1
      decision: confirmed
      decision_reason: "مركب إضافي يربط التأهب بالمدرج مباشرة، وهو أقرب ترجمة دلالية لـ strip alert حيث strip = مَدْرَج. المعاجم تؤكد أن مَدْرَج مصطلح ثابت لممر إقلاع الطائرات. هذا المركب أدق تخصيصاً من تأهب أرضي لأنه يحدد موقع الجاهزية (المدرج) لا مجرد كونها على الأرض."
