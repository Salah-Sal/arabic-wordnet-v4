# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14055775-n (strip alert)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (تأهب أرضي) وهو مركب وصفي لم يُثبت في المعاجم العربية الكلاسيكية كوحدة معجمية مستقلة"
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي مع إضافة توضيحية بين قوسين"
      - "المفهوم عسكري متخصص (strip alert) لا يوجد له مصطلح عربي ثابت في المعاجم التراثية"
    observations: "المجموعة تندرج تحت حالة التأهب (awn4-14055142-n) وهي تخصيص عسكري لحالة الاستعداد مرتبط بالطيران الحربي الدفاعي. المصطلح الإنجليزي strip alert يشير إلى حالة جاهزية الطائرات المقاتلة على المدرج للإقلاع الفوري عند الإنذار. كلمة strip هنا بمعنى مَدْرَج الطائرات (airstrip)، فالتأهب هنا مرتبط بوجود الطائرات على المدرج جاهزة."
  blind_candidates:
    - lemma: "تَأَهُّبٌ أَرْضِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من تَأَهُّب (الاستعداد) + أَرْضِيّ (على الأرض)، يصف حالة جاهزية الطائرات وهي رابضة على الأرض. المركب شفاف دلالياً ويتماشى مع نمط المصطلحات العسكرية العربية مثل: دفاع جوي، هجوم بري."
    - lemma: "تَأَهُّبُ الْمَدْرَجِ"
      generation_method: tarkib
      justification: "مركب إضافي يربط التأهب بالمدرج (runway/strip) مباشرة، وهو أدق ترجمة لـ strip alert حيث strip = مَدْرَج. يوضح أن الجاهزية مرتبطة بالطائرات الرابضة على المدرج."
    - lemma: "إِنْذَارُ الْمَدْرَجِ"
      generation_method: tarkib
      justification: "مركب إضافي من إنذار (alert/alarm) + المدرج. يستخدم إنذار بدل تأهب لأن strip alert يتضمن معنى التنبيه والإعلان بالجاهزية، وإنذار أقرب دلالياً إلى alert في سياقه العسكري."
    - lemma: "يَقَظَةٌ أَرْضِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من يقظة (alertness/vigilance) + أرضية. يقظة لفظ تراثي أصيل يدل على الانتباه والاستعداد، وهو الأقرب معنوياً للفظ alert. لكنه يفتقر للتخصيص العسكري."

stage2_evidence:
  per_lemma:
    - lemma: "تَأَهُّبٌ أَرْضِيٌّ"
      confirm:
        - text: "«(تأهب) لَهُ استعد يُقَال تأهب للسَّفر وللأمر»"
          source: "المعجم الوسيط"
        - text: "«للأمر : أَهَبَ , يقال : تَأَهَّبَ للسَّفر»"
          source: "المعجم الكبير"
        - text: "«الاستعداد لأحداث معينة أو غير متوقعة.» (translation_en: preparedness)"
          source: "مسرد المناخ والبيئة (أليكسو)"
      expands:
        - text: "«حالة تتجند فيها كل طاقات مؤسسة إعلامية عند حلول مناسبة كبيرة أو عند حدوث طوارئ» (تأهب عالٍ = high alert)"
          source: "مسرد الإعلام والتواصل (أليكسو)"
          addition: "يبيّن أن تأهب يُستخدم في مركبات وصفية حديثة للدلالة على درجات الجاهزية"
        - text: "«أرْضي» (translation_en: ground) في مجال النقل والبنية التحتية"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "يؤكد استخدام أرضي بمعنى ground في المصطلحات التقنية"

    - lemma: "تَأَهُّبُ الْمَدْرَجِ"
      confirm:
        - text: "«(تأهب) لَهُ استعد يُقَال تأهب للسَّفر وللأمر»"
          source: "المعجم الوسيط"
        - text: "«مَدْرَجُ الطَّائِراتِ: مَمَرٌّ أرْضِيٌّ مُعَدٌّ لإِقْلاعِ الطَّائرات وهُبُوطِها»"
          source: "المعجم الكبير"
      expands:
        - text: "«طريق مهيأ لإقلاع ونزول الطائرات» (مَدْرَج = taxiway/runway)"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "يؤكد أن مَدْرَج مصطلح ثابت لـ runway في سياق الطيران"

    - lemma: "إِنْذَارُ الْمَدْرَجِ"
      confirm:
        - text: "«الإنذار: الإعلام بما يحذر. قال ابن عطية ولا يكاد يكون إلا في تخويف يسع زمانه الاحتراز»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الإنذارُ: إخبار فيه تخويف كما أن التبشيرَ إخبار فيه سرور»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "الإنذار يتضمن معنى التخويف والتحذير من خطر، بينما strip alert حالة جاهزية وقائية لا تحذيرية"

    - lemma: "يَقَظَةٌ أَرْضِيَّةٌ"
      confirm:
        - text: "«يَقَظَة» (translation_en: alertness, translation_fr: vigilance)"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«اليَقَظَةُ: الانتباهُ من النَّوْم أَو خلاف النَّوم»"
          source: "المعجم الوسيط"
          conflict: "اليقظة في أصلها ضد النوم وتتعلق بالحالة الذهنية، لا بالجاهزية العسكرية التشغيلية"

