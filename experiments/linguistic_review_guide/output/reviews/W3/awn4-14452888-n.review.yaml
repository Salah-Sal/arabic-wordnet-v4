      nuance_differentiation: "يميل إلى التقييم المؤسسي الرسمي (التصنيف الائتماني، تصنيف النجوم)، ويحمل بُعداً تقييمياً أكثر من مجرد الترتيب العددي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصْنِيف"

    - lemma: "مَرْتَبَة"
      source: stage1
      decision: removed
      decision_reason: "لفظ «مرتبة» يدلّ على الرتبة أو المنزلة ذاتها (rank/grade)، لا على الموقع النسبي على مقياس مقارن (ranking). وهو أنسب لمجموعة ترادفية تصف مفهوم الرتبة كمستوى ثابت، لا مفهوم الترتيب النسبي. كما أنّ إضافته ستكرّر معنى اللمّة الموجودة في المجموعة الأعلى (سمعة/مكانة)."

