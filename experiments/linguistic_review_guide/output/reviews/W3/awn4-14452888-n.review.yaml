      decision_reason: "لفظ «تصنيف» يُستعمل في العربية المعاصرة بمعنى rating/ranking، لا سيما في السياقات المؤسسية والعسكرية (التصنيف الائتماني، التصنيف العالمي). وإن كان أصله الكلاسيكي يدلّ على التمييز بين الأصناف، فقد توسّع معناه ليشمل التقييم التراتبي."
      evidence_assessment:
