      decision: confirmed
      decision_reason: "لفظ «ترتيب» هو المقابل العربي المعاصر الأكثر شيوعاً لـranking، ويُستخدم في السياقات الرياضية والأكاديمية والتجارية (ترتيب الجامعات، ترتيب الفيفا). المعاجم الكلاسيكية تؤكد دلالته على نسبة التقدّم والتأخّر بين الأشياء، وهذا جوهر مفهوم الترتيب النسبي."
