# مراجعة المجموعة الترادفية — awn4-14452888-n
# ranking — position on a scale in relation to others
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «ترتيب» في الاستعمال المعجمي الكلاسيكي يدلّ على فعل جعل الأشياء في مراتبها (العملية)، لا على الموقع النسبي ذاته، والمعنى المعاصر توسّع ليشمل الموقع"
      - "لفظ «تصنيف» أقرب دلالةً إلى التمييز بين الأصناف منه إلى الموقع على مقياس تراتبي، لكنه شاع في الاستعمال المعاصر بمعنى ranking"
    observations: "المجموعة تصف مفهوم الموقع النسبي على سُلَّم المكانة أو الإنجاز، وهو مفهوم تعبّر عنه العربية بألفاظ متعددة كالمرتبة والرتبة والدرجة والمنزلة، لكنّ المصطلح المعاصر الشائع لـranking هو «ترتيب» (كما في ترتيب الجامعات وترتيب المنتخبات). وجود لمّتين فقط في المجموعة كافٍ مبدئيًّا، مع إمكان إضافة لفظ يدلّ على النتيجة لا العملية."

  blind_candidates:
    - lemma: "تَرْتِيب"
      generation_method: ishtiqaq
      justification: "مصدر رَتَّبَ (فعّل) من الجذر ر ت ب، شاع في العربية المعاصرة بمعنى ranking أي الموقع النسبي على مقياس، كما في «ترتيب الجامعات» و«ترتيب الفيفا»"
    - lemma: "تَصْنِيف"
      generation_method: ishtiqaq
      justification: "مصدر صَنَّفَ (فعّل) من الجذر ص ن ف، يُستخدم في سياق التقييم النسبي كالتصنيف الائتماني والتصنيف العسكري بمعنى rating/ranking"
    - lemma: "مَرْتَبَة"
      generation_method: ishtiqaq
      justification: "اسم مكان ومنزلة من رَتَّبَ على وزن مَفْعَلَة، يدلّ على الموقع في سلّم تراتبي، كقولهم «مرتبة الآحاد» في الحساب و«مرتبة رفيعة» في الشرف"
    - lemma: "مَنْزِلَة"
      generation_method: ishtiqaq
      justification: "اسم مكان من نَزَلَ على وزن مَفْعِلَة، يدلّ على المكانة والموقع في سلّم الشرف، كقولهم «بمنزلة كذا» و«رفيع المنازل»"


stage2_evidence:
  per_lemma:
    - lemma: "تَرْتِيب"
      confirm:
        - text: "«التَّرتيبُ: جعل الْأَشْيَاء المتعددة بِحَيْثُ يُطلق عَلَيْهَا اسْم الْوَاحِد، وَيكون لبعضها نِسْبَة إِلَى بعض بالتقدم والتأخر.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الترتيب: لغة، جعل كل شيء في مرتبة. وعرفا جعل الأشياء الكثيرة بحيث يطلق عليها اسم الواحد ويكون لبعض أجزائه نسبة إلى بعضها بالتقدم والتأخر.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«التّرتيب: في اللغة جعل كلّ شيء في مرتبته. وبعبارة أخرى وضع كل شيء في مرتبته [...] وفي الاصطلاح جعل الأشياء الكثيرة بحيث يطلق عليها اسم الواحد ويكون لبعضها نسبة إلى بعض بالتقديم والتأخير.»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يفرّق بين المعنى اللغوي (وضع كل شيء في مرتبته) والاصطلاحي (ربط الأشياء بعلاقة تقدّم وتأخّر)"
        - text: "ترتيب = ranking (مصطلح رياضي ومصطلح تجاري)"
          source: "ARABTERM — مسرد الفن والتسلية والرياضة / المعجم الموحد لمصطلحات التجارة والمحاسبة"
          addition: "تأكيد الشيوع المعاصر للفظ بمعنى ranking في مجالات متعددة"

    - lemma: "تَصْنِيف"
      confirm:
        - text: "«(1) التَّصنيف [وبخاصةٍ عسكريًا أو بحريًا] (2) المُصَنَّف (3) تثمين؛ تقدير؛ تخمين (4) منزلة»"
          source: "المورد الحديث (2008) — مقابل rating"

      contradicts:
        - text: "«التصنيف: تمييز الأشياء بعضها عن بعض، ومنه تصنيف الكتب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الكلاسيكي للتصنيف هو التمييز بين الأصناف (classification)، لا تحديد الموقع على مقياس تراتبي (ranking)"
      expands:
        - text: "«الصَّادُ وَالنُّونُ وَالْفَاءُ أَصْلٌ صَحِيحٌ مُطَّرِدٌ فِي مَعْنَيَيْنِ، أَحَدُهُمَا الطَّائِفَةُ مِنَ الشَّيْءِ، وَالْآخَرُ تَمْيِيزُ الْأَشْيَاءِ بَعْضِهَا عَنْ بَعْضٍ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الثاني (التمييز) يتّصل بمفهوم الترتيب النسبي اتصالاً غير مباشر"

    - lemma: "مَرْتَبَة"
      confirm:
        - text: "«المَرْتَبَةُ: الرُّتْبَةُ, وهى المَنْزِلة والمكانة.»"
          source: "المعجم الكبير"
        - text: "«(الْمرتبَة) الرُّتْبَة [...] (فِي علم الْحساب) الْموضع الَّذِي يكون الْعدَد المطلق فِيهَا ذَا قيمَة خَاصَّة بحسبها يُقَال مرتبَة الْآحَاد»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الرُّتْبَة: المنزلة والمكانة أو المنزلة الرفيعة ودرجة من درجات الشرف تمنحها الدولة من ترى تكريمه»"
          source: "المعجم الوسيط"
          addition: "رتبة (أصل مرتبة) تشمل المنزلة والدرجة الشرفية، مما يجعل مرتبة ملائمة للمفهوم"

    - lemma: "مَنْزِلَة"
      confirm:
        - text: "«المَنْزِلَةُ: الدارُ المكانة والمرتبة»"
          source: "المعجم الوسيط"
        - text: "«(الْمنزلَة) الدَّار والمكانة والمرتبة [...] يُقَال لَهُ منزلَة عِنْد الْأَمِير مكانة وَهُوَ رفيع الْمنَازل الْمَرَاتِب»"
          source: "المعجم الوسيط (نسخة هوراماني)"
      contradicts:
        - text: "«(نَزَلَ) النُّونُ وَالزَّاءُ وَاللَّامُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى هُبُوطِ شَيْءٍ وَوُقُوعِهِ.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل اللغوي يدلّ على الهبوط والحلول، والمنزلة هي المكانة العامة لا الموقع النسبي على مقياس تحديداً"


