        وَمُرَامَاةٍ. وَنَضَلَ فُلَانًا: رَامَاهُ بِالنِّضَالِ فَغَلَبَهُ
        فِي ذَلِكَ. وَهُوَ يُنَاضِلُ عَنْ فُلَانٍ: يَتَكَلَّمُ عَنْهُ
        بِعُذْرِهِ، كَأَنَّهُ يُرَامِي دُونَهُ.»

    - lemma: "نَاشِط"
      entry_id: "{auto}"
      root: "نشط"
      maqayis_quote: >
