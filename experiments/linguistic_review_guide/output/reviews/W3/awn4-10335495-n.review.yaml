# ─────────────────────────────────────────────────────
# المرحلة ٤: التعريف والأمثلة
# ─────────────────────────────────────────────────────
stage4_content:

  definition:
    current: "مصلح نضالي"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ليس إلا ترجمة حرفية مختزلة للتعريف الإنجليزي، خالٍ
        من الجنس القريب الواضح ومن الفصل النوعي. لا يُميَّز بينه وبين المجموعة
        الأم «مجادل يدعو إلى الإصلاح» إلا بكلمة «نضالي» التي تظل مبهمة
        دون توضيح ما الذي يُميِّز الإصلاح النضالي عن الإصلاح العادي.
    authored:
      - type: terminological
        text: >
          مَن يدعو إلى الإصلاح الاجتماعي أو السياسي ويعمل على تحقيقه بأساليب
          فاعلة نضالية، متجاوزاً حدود الدعوة الهادئة إلى الكفاح الميداني
          المنظَّم ومواجهة العقبات بحزم.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
