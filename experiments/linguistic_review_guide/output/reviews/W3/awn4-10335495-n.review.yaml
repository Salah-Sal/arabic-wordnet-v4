stage2_evidence:

  per_lemma:

    # ── لمّات موجودة ──────────────────────────────

    - lemma: "مُتَشَدِّد"
      contradicts:
        - text: "«مُتشدِّد؛ متطرِّف؛ متعَصِّب a hard-line communist»"
          source: "المورد الحديث (2008)"
          conflict: >
            النص يُرادف المُتَشَدِّد بالمتطرف والمتعصب، وهي دلالة سلبية لا
            تنسجم مع المصلح النضالي الذي هو مفهوم إيجابي فاعل.
        - text: "«أصوليّ؛ متعصِّب؛ متشدِّد؛ متزمِّت»"
          source: "المورد الحديث (2008)"
          conflict: >
            التقارن مع أصولي ومتزمت يُرسِّخ الدلالة السلبية التي تناقض
            مفهوم «المصلح النضالي».
      expands:
        - text: "«المنادي بحقوق الولايات: من يدعو إلى الأخذ بتفسير متشدِّد
                  للضمانة الدستوريّة الأميركيّة ويقاوم كلّ سيطرة اتحادية»"
          source: "المورد الحديث (2008)"
          addition: >
            يُظهر أن المُتَشَدِّد قد يُستخدم في سياق سياسي ديمقراطي، لكن
            المعنى هنا هو التمسك الصارم بموقف ما وليس النضال الإصلاحي التغييري.

    - lemma: "مُناضِل"
      confirm:
        - text: "«militant: (1) مقاتِل؛ محارب / (2) مناضل؛ مكافح /
                  (3) المقاتل؛ المحارب / (4) المُناضل؛ المُكافح»"
          source: "المورد الحديث (2008)"
        - text: "«موقع مناضل: موقع على الشابكة يشرح قضية ما أو يدافع عنها
                  أو يدعو لجمع تبرعات لصالحها أو للتوقيع على عارضة»"
          source: "مسرد الإعلام والتواصل — أرابتيرم (ALECSO)"
      expands:
        - text: "«(3) مناضل / (4) مُقْتحم؛ جريء؛ مغامر؛ مُبادِر»"
          source: "المورد الحديث (2008) — مدخل aggressive"
          addition: >
            يُظهر أن مناضل يُقابَل في العربية بمفهوم الجرأة والمبادرة
            الفاعلة، وهي مكونات أساسية في مفهوم المصلح النضالي.

    - lemma: "ناشِط"
      confirm:
        - text: "«ناشط في مجال المناخ — Climate activist»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996) — أرابتيرم"
      contradicts:
        - text: "«ناقِض الحَبْل لِيُضفر ثانية»"
          source: "المعجم الوسيط"
          conflict: >
            المعنى الكلاسيكي للناشط هو حُلَّال الحبل ليُعاد ضفره، وهو بعيد
            كل البُعد عن المعنى المعاصر «الناشط الحقوقي». الدلالة الحديثة
            مستحدَثة بالاشتقاق من النشاط.
        - text: "«(الناشط) نَاقض الْحَبل ليضفر ثَانِيَة (ج) نشط»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: >
            الجمع (نُشَط) وارد للمعنى القديم فقط، لا للمعنى الحديث.
      expands:
        - text: "«ناشطٌ في غير كلال»"
          source: "المورد الحديث (2008)"
          addition: "يُبرز دلالة الديمومة والمثابرة في المعنى الحديث للنشاط."

    # ── مرشحو المرحلة ١ ──────────────────────────

    - lemma: "نَضَّال"
      evidence_status: "no_material_found"
      # الجذر نضل موجود في مقاييس اللغة بمعنى الرمي والمرامات، لكن صيغة فَعَّال
      # كاسم فاعل من نضل لم تُعثَر عليها في أي مدخل مستقل.

    - lemma: "مُكَافِح"
      confirm:
        - text: "«militant: (2) مناضل؛ مكافح»"
          source: "المورد الحديث (2008)"
        - text: "«(1) يُكافح؛ يُناضِل؛ يُقاوِم / (4) كِفاح؛ نضال a struggle for liberty»"
          source: "المورد الحديث (2008) — مدخل struggle"
      expands:
        - text: "«كِفَاح: من (ك ف ح) المُضَارَبَة، والجهاد المستمر والمقاومة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            يُثبت أن الجذر كفح يحمل دلالة الكفاح المستمر والمقاومة الدؤوبة،
            وهي صفات مُعرِّفة للمصلح النضالي.

    - lemma: "مُجَاهِد"
      confirm:
        - text: "«مُجَاهِد: من (ج ه د) مقاتل العدو والمناضل في سبيل دعوة أو رسالة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«مُجَاهِد: مقاتل العدو»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            الدلالة الأولى والأصلية عسكرية دينية؛ استخدام مُجَاهِد للمصلح
            السياسي يُحمِّل المصطلح دلالات دينية ليست في المفهوم الإنجليزي.

    - lemma: "مُحَارِب"
      contradicts:
        - text: "«مُحَارِب: من (ح ر ب) المقتال»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            المعنى المحوري هو المقاتل المسلح (المقتال = شديد القتال). الإزاحة
            الدلالية إلى ناشط مدني إصلاحي بعيدة جداً وغير مألوفة في الاستعمال.
        - text: "«بنو مُحارب: قبائل من أشهرها محارب بن خصفة في قيس عيلان»"
          source: "المعجم الكبير"
          conflict: "المحارب بوصفه اسم عَلَم وجذع قبلي يزيد التباساً."


