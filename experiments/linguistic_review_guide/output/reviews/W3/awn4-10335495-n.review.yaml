stage3_analysis:

  per_lemma:

    # ────────────────────────────────
    - lemma: "مُتَشَدِّد"
      decision: removed
      decision_reason: >
        اللمّة مُتَشَدِّد في العربية المعاصرة تحمل بشكل راسخ دلالة التطرف
        والتعصب والتزمت الفكري — وهي دلالة سلبية تناقض مفهوم «المصلح النضالي»
        الذي يستوجب لمّة إيجابية تدل على الكفاح الفاعل من أجل التغيير.
        الأدلة المعجمية تُرادفها بـ(متطرف، متعصب، أصولي) ولا توجد شواهد
        معجمية تُربطها بالإصلاح الإيجابي. فضلاً عن ذلك، يُستخدم المُتَشَدِّد
        أحياناً لوصف المُقاوِم للتغيير لا الساعي إليه.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      # لا إجراء فعلياً مطلوب غير remove_sense
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ────────────────────────────────
    - lemma: "مُناضِل"
      decision: confirmed
      decision_reason: >
        مُناضِل هو اسم فاعل من (ناضَلَ) على وزن مُفَاعِل، ويعني من يناضل
        ويدافع عن قضيته. هو الترجمة الأدق لـmilitant بمعناه الإيجابي الكفاحي.
        موثَّق في المورد الحديث كمقابل صريح للـmilitant. التشكيل الموجود منقوص
        (غياب الفتحة على النون قبل الألف) ويحتاج تصحيحاً. وجوده في المجموعة
        الأم يُعدُّ تداخلاً مقبولاً في AWN4 إذ الاستعمال صريح في هذه الوحدة
        بدلالة المصلح المكافِح تحديداً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُناضِل يُبرز البُعد الكفاحي والمقاوِم — فهو يدل على من يخوض صراعاً
        ضد موانع الإصلاح بروح المدافع عن قضية. يختلف عن ناشِط (الذي يُبرز
        الحضور الفاعل والمستمر) وعن مُكَافِح (الذي يُبرز المثابرة والصمود).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنَاضِل"

    # ────────────────────────────────
    - lemma: "ناشِط"
      decision: confirmed
      decision_reason: >
        ناشِط بمعناه الحديث «الناشط الحقوقي/السياسي» مستقر في الاستعمال
        العربي المعاصر وموثَّق رسمياً في معاجم المصطلحات (الطاقة المتجددة:
        «ناشط في مجال المناخ = Climate activist»). يُقابل الإنجليزية activist
        وهو أحد لمّتَي الإنجليزية في هذا السينسِت. المعنى الكلاسيكي (ناقض
        الحبل) ميت في الاستعمال. التشكيل يحتاج إضافة الفتحة على النون.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        ناشِط يُبرز الجانب التنظيمي والميداني والحضور المستمر — من ينشط
        ويعمل بصورة منتظمة في إطار حركة إصلاحية. وهو أقل حدةً من مُناضِل
        (الذي يحمل طابع الصراع) وأعم من مُكَافِح (الذي يُبرز الجهد المضني).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَاشِط"

    # ────────────────────────────────
    - lemma: "نَضَّال"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة فَعَّال من الجذر نضل غير موثَّقة معجمياً كاسم للشخص الناضل؛
        فالقاموس لم يُسجِّل نَضَّال باعتبارها اسم فاعل مستقل، والشائع هو
        مُنَاضِل (مُفَاعِل). فضلاً عن ذلك، فإن تطبيع الكتابة يُطابق بين
        نَضَّال ونِضَال (المصدر الاسمي) مما يُفضي إلى التباس. لا مسوِّغ
        لإضافتها مع وجود مُنَاضِل في المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ────────────────────────────────
    - lemma: "مُكَافِح"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُكَافِح موثَّق صراحةً في المورد الحديث كمقابل للـmilitant (مناضل؛
        مكافح). الجذر كفح يحمل دلالة المثابرة والمقاومة المستمرة. الصيغة
        (مُفَاعِل من كافَحَ) قياسية وفصيحة. تُضيف نُغمة دلالية مستقلة عن
        مُنَاضِل بتركيزها على الجهد المضني والمثابرة. وهي أقل تشبعاً بالدلالات
        الدينية من مُجَاهِد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُكَافِح يُبرز بُعد المثابرة والجهد المستمر في مواجهة الصعاب؛ فهو من
        يكدح ويكافح بلا كلل لتحقيق الإصلاح. يختلف عن مُنَاضِل (الطابع
        الصراعي) وعن نَاشِط (الطابع التنظيمي الميداني) بتأكيده على الجانب
        الإرادي والصموديّ.
      actions:
        - command: create_entry
          params:
            lemma: "مُكَافِح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10335495-n"

    # ────────────────────────────────
    - lemma: "مُجَاهِد"
      source: stage1
      decision: removed
      decision_reason: >
        رغم أن موسوعة السلطان قابوس تدعم المعنى الموسَّع «المناضل في سبيل
        دعوة أو رسالة»، فإن مُجَاهِد في العربية المعاصرة محمَّل بالدلالة
        الدينية والعسكرية بشكل طاغٍ يجعل استخدامه للمصلح السياسي المدني
        مُلتبساً وغير ملائم. المفهوم الإنجليزي militant reformer علماني
        بامتياز.
      evidence_assessment:
