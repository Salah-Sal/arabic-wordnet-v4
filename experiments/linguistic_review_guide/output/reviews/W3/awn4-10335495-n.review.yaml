# ─────────────────────────────────────────────────────
# المرحلة ١: المراجعة والتوليد (عمياء — بلا لمّات)
# ─────────────────────────────────────────────────────
stage1_review:

  # ══ أ. المرشحون العُمْيُون (قبل الاطلاع على اللمّات الموجودة) ══
  blind_candidates:

    - lemma: "نَضَّال"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ن ض ل) على وزن فَعَّال الذي يفيد المبالغة في الفعل
        وكثرة ممارسته؛ فالنَّضَّال هو من يكثر من النضال ويُثابر عليه. الوزن
        فَعَّال مُنتِج في العربية لأسماء المحترفين والمبالِغين في الفعل، وهو
        أنسب من المصدر (نِضَال) لأنه اسم فاعل يدل على صاحب الصفة.

    - lemma: "مُكَافِح"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ك ف ح) على وزن مُفَاعِل، وهو اسم فاعل من كافَحَ.
        والمُكَافِح هو من يقاوم ويناضل ويجاهد بلا هوادة. كثير الورود في
        السياقات السياسية والاجتماعية المعاصرة للدلالة على الناشط المقاوِم،
        وهو أقل تشبعاً بالدلالات الدينية من مُجَاهِد.

    - lemma: "مُجَاهِد"
      generation_method: majaz
      justification: >
        إزاحة دلالية من معنى المقاتل في الحرب أو في سبيل العقيدة إلى معنى
        من يجاهد ويكافح في سبيل قضية اجتماعية أو سياسية. هذا الانزياح
        موثَّق في الاستعمال المعاصر لدلالة الدفاع عن دعوة ما. وقد ورد في
        المعاجم تعريفه بـ«المناضل في سبيل دعوة أو رسالة».

    - lemma: "مُحَارِب"
      generation_method: majaz
      justification: >
        إزاحة دلالية من المقاتل المسلح إلى المناضل الاجتماعي؛ على غرار
        «محارب الفقر» و«محارب الفساد» في اللغة المعاصرة. يحمل دلالة
        الحدة والمواجهة التي تناسب «المصلح النضالي» بوصفه من لا يكتفي
        بالدعوة الهادئة بل يخوض المعركة الإصلاحية.

  # ══ ب. التقييم الأولي بعد الاطلاع على synset_info الكامل ══
  assessment:
    concerns:
      - "التعريف العربي 'مصلح نضالي' قصير جداً — مجرد ترجمة حرفية للإنجليزية دون بيان
         الجنس القريب ولا الفصل النوعي."
      - "اللمّة مُتَشَدِّد مُشكِلة: تحمل في العربية المعاصرة دلالة سلبية
         (متطرف، متعصب، أصولي) لا تنسجم مع معنى 'مصلح نضالي'
         الذي هو إيجابي في الأصل الإنجليزي."
      - "اللمّة مُناضِل موجودة في هذه المجموعة وفي المجموعة الأم (awn4-10534787-n)
         في آنٍ واحد، مما يُضعف التمييز الدلالي بين الهايبرنيم والهايبونيم."
      - "تشكيل مُناضِل وناشِط منقوص: غياب الفتحة على النون في الكلمتين."
    observations: >
      المجموعة ترادفية تُعبِّر عن مفهوم مركَّب: الإصلاح (إحداث التغيير) مقروناً
      بالنضالية (الأساليب الفاعلة المكافِحة). المجموعة الأم تُعبِّر عن «المصلح»
      بشكل عام، فيما تُضيف هذه المجموعة قيد «النضالية» تمييزاً. من ثَمَّ، يجب أن
      تحمل لمّاتها دلالةَ الكفاح والنشاط لا مجرد الإصلاح. اللمّة ناشِط تقابل
      الإنجليزية activist، والمُناضِل تقابل militant، لكن المُتَشَدِّد يقابل
      hard-liner أو fanatic لا militant بمعناه الإيجابي. يُستحسن استبدال
      المُتَشَدِّد بلمّة تُبرز الكفاح الإيجابي كمُكَافِح.


