stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة (شق القنوات) عبارة مسكوكة وصحيحة الدلالة، ولكن يمكن إضافة مصطلح مفرد يعبر عن المفهوم."
    observations: "المفهوم يشير إلى فعل شق القنوات المائية أو غيرها. الفعل العربي هو 'قَنَّى' (احتفر القناة) ومصدره 'تَقْنِيَة'."
  blind_candidates:
    - lemma: "تَقْنِيَة"
      generation_method: ishtiqaq
      justification: "مصدر للفعل 'قَنَّى' بمعنى حفر القناة، وهو دقيق لغوياً للمفهوم."
    - lemma: "قَنْوَنَة"
      generation_method: ishtiqaq
      justification: "نحت حديث على وزن فعللة من كلمة قناة، شائع في الترجمات المعاصرة."
    - lemma: "شَقُّ تُرْعَةٍ"
      generation_method: tarkib
      justification: "تركيب إضافي يعبر عن المفهوم، ولكنه مخصص بكلمة ترعة."
    - lemma: "إِقْنَاء"
      generation_method: ishtiqaq
      justification: "من الفعل أقنى، وقد يرد مجازاً بمعنى التوجيه في قنوات."

stage2_evidence:
  per_lemma:
    - lemma: "شق القنوات"
      confirm:
        - text: "«(1) التَّقْنِية: شَقّ القَنَوات»"
          source: "المورد الحديث (2008)"
        - text: "«تتبع غالبا المجرى الذى كانت تشقه القنوات القديمة»"
          source: "المعجم الكبير"
    - lemma: "تقنية"
      confirm:
        - text: "«(1) التَّقْنِية: شَقّ القَنَوات»"
          source: "المورد الحديث (2008)"
        - text: "«(قنى) ... والقناة احتفرها ...»"
          source: "المعجم الوسيط"
    - lemma: "قنونة"
      contradicts:
        - text: "«قَنُونَة من (ق ن ن) صورة كتابية صوتية من قَانُونَة: مؤنث قانون...»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "يشير إلى القانون وليس إلى شق القنوات."
    - lemma: "شق ترعة"
      evidence_status: no_material_found
    - lemma: "إقناء"
      expands:
        - text: "«channeling»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "استخدم في المجال الطبي بمعنى قريب (التوجيه في قنوات)."

stage3_analysis:
  per_lemma:
    - lemma: "شق القنوات"
      decision: confirmed
      decision_reason: "تركيب إضافي دقيق وواضح الدلالة، مدعوم بالاستعمال المعجمي لتفسير عملية حفر القنوات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَقُّ القَنَوَاتِ"
    - lemma: "تَقْنِيَة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر قياسي صحيح للفعل 'قنّى' بمعنى حفر القناة، ومثبت في المعاجم الحديثة، رغم اشتراكه اللفظي الشديد مع معنى (التكنولوجيا)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "تَقْنِيَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "قَنْوَنَة"
      source: stage1
      decision: removed
      decision_reason: "نحت غير فصيح ولم يثبت في المعاجم العربية المعتمدة بهذا المعنى."
    - lemma: "شَقُّ تُرْعَةٍ"
      source: stage1
      decision: removed
      decision_reason: "تخصيص بكلمة ترعة يضيق المعنى، ولا حاجة له بوجود التركيب الأعم 'شق القنوات'."
    - lemma: "إِقْنَاء"
      source: stage1
      decision: removed
      decision_reason: "دلالته المباشرة في المعاجم لا تتفق مع شق القناة، بل مع الإرضاء أو اتخاذ القنية."

stage4_content:
  definition:
    current: "إنشاء قناة أو التحويل إلى قنوات"
    assessment:
      decision: revise
      reason: "تحسين الصياغة لتكون أكثر دقة واصطلاحية."
    authored:
      - type: terminological
        text: "عملية حفر قنوات أو شقها في الأرض، أو تحويل مجرى إلى شبكة قنوات."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عملية حفر قنوات أو شقها في الأرض، أو تحويل مجرى إلى شبكة قنوات."
  examples:
    per_lemma:
      - lemma: "شق القنوات"
        examples:
          - text: "تطلّب المشروع الزراعي شَقَّ القَنَوَاتِ لتوفير مياه الريّ بسلاسة."
            type: usage
      - lemma: "تقنية"
        examples:
          - text: "شملت أعمال البنية التحتية تَقْنِيَةَ مسارات الصرف لتجنب الفيضانات."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تطلّب المشروع الزراعي شَقَّ القَنَوَاتِ لتوفير مياه الريّ بسلاسة."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "شملت أعمال البنية التحتية تَقْنِيَةَ مسارات الصرف لتجنب الفيضانات."

stage5_enrichment:
  per_entry:
    - lemma: "شق القنوات"
      entry_id: "{auto}"
      roots:
        - word: "شق"
          root: "شقق"
          maqayis_quote: "«الشِّينُ وَالْقَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى انْصِدَاعٍ فِي الشَّيْءِ...»"
        - word: "قنوات"
          root: "قنو"
          maqayis_quote: "«الْقَافُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى مُلَازَمَةٍ وَمُخَالَطَةٍ، وَالْآخَرُ عَلَى ارْتِفَاعٍ فِي شَيْءٍ...»"
    - lemma: "تَقْنِيَة"
      entry_id: "{auto}"
      root: "قنو"
      maqayis_quote: "«الْقَافُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى مُلَازَمَةٍ وَمُخَالَطَةٍ، وَالْآخَرُ عَلَى ارْتِفَاعٍ فِي شَيْءٍ...»"
  per_sense:
    - lemma: "شق القنوات"
      sense_id: "{auto}"
      nuance: "تعبير تركيبي مباشر وواضح المعنى يخلو من اللبس."
      mwe: true
    - lemma: "تَقْنِيَة"
      sense_id: "{auto}"
      nuance: "مصدر مفرد قياسي دقيق يعبر عن حفر القناة، ولكنه قد يلتبس بالمعنى الحديث الشائع (التكنولوجيا)."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"شق","root":"شقق","maqayis":"«الشِّينُ وَالْقَافُ أَصْلٌ وَاحِدٌ صَحِيحٌ يَدُلُّ عَلَى انْصِدَاعٍ فِي الشَّيْءِ...»"},{"word":"قنوات","root":"قنو","maqayis":"«الْقَافُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى مُلَازَمَةٍ وَمُخَالَطَةٍ، وَالْآخَرُ عَلَى ارْتِفَاعٍ فِي شَيْءٍ...»"}]}'
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"قنو","maqayis":"«الْقَافُ وَالنُّونُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ يَدُلُّ أَحَدُهُمَا عَلَى مُلَازَمَةٍ وَمُخَالَطَةٍ، وَالْآخَرُ عَلَى ارْتِفَاعٍ فِي شَيْءٍ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تعبير تركيبي مباشر وواضح المعنى يخلو من اللبس.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصدر مفرد قياسي دقيق يعبر عن حفر القناة، ولكنه قد يلتبس بالمعنى الحديث الشائع (التكنولوجيا).","mwe":false}'
