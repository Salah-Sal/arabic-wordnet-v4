# skin: a person's skin regarded as their life
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «حياة» مكررة في هذه المجموعة وفي المجموعة الأعلى (awn4-13984978-n) مما يُخلّ بالتمييز الدلالي بين المستويين"
      - "التعريف العربي «حياة الشخص (مجازاً باستخدام الجلد)» ترجمة حرفية للتعريف الإنجليزي ولا يعكس استعمالاً عربياً أصيلاً"
      - "المفهوم الإنجليزي (skin = life) مجاز خاص بالإنجليزية وليس له نظير مجازي مباشر في العربية عبر لفظ «الجلد»"
      - "اللمّة «روح» عامة جداً في دلالتها على النفس والحياة ولا تحمل دلالة المخاطرة أو النجاة الخاصة بهذا المفهوم"
    observations: "هذه المجموعة تمثّل استعمالاً مجازياً إنجليزياً خاصاً حيث يُكنّى بـ skin عن حياة الشخص في سياق المخاطرة والنجاة (مثل save one's skin). في العربية، لا يوجد مجاز مماثل بلفظ «الجلد» بهذه الدلالة، لكن العربية تملك ألفاظاً تؤدي المعنى ذاته وهو الحياة بوصفها شيئاً عزيزاً يُفدى ويُخاطَر به، وأبرزها «مُهْجَة» التي تعني دم القلب والروح. التعبير العربي المكافئ لـ save one's skin هو «نجا بنفسه» أو «فدى بمهجته» لا «نجا بجلده» — وإن كان هذا الأخير قد شاع حديثاً بتأثير الترجمة."

  blind_candidates:
    - lemma: "مُهْجَة"
      generation_method: majaz
      justification: "المُهْجَة في المعاجم دم القلب والروح، تُستعمل مجازاً للدلالة على الحياة بوصفها أعزّ ما يملك المرء، وهي أقرب مقابل عربي لمفهوم skin بمعنى الحياة المُعرَّضة للخطر"
    - lemma: "نَفْس"
      generation_method: majaz
      justification: "النَّفْس تعني الروح والذات، وتُستعمل في سياق النجاة والمخاطرة: «نجا بنفسه»، «جاد بنفسه». المورد الحديث يترجم save one's skin بـ «ينجو بنفسه»"
    - lemma: "جِلْدَة"
      generation_method: majaz
      justification: "الجِلْدَة قطعة من الجلد، تُستعمل مجازاً للقرابة والعزّة (جلدة عيني، من بني جلدتنا)، محاولة لنقل المجاز الإنجليزي بلفظ عربي قريب"
    - lemma: "إِهَاب"
      generation_method: majaz
      justification: "الإهاب الجلد قبل الدباغ، وفي المعجم الوسيط: كاد الفرس يخرج من إهابه من نشاطه — محاولة لإيجاد مقابل عربي أدبي للجلد بمعنى الذات"


