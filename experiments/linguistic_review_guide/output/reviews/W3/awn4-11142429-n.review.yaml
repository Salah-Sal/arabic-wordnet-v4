# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11142429-n  |  ILI: i95917
# Edward Lear — British artist and writer of nonsense verse
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('إدوارد لير' و'لير') تفتقران إلى التشكيل الكامل الإلزامي"
      - "'لير' يلتبس باسم المكان الوارد في تاج العروس (ناحية من جندَيسابور) ويحتاج إلى تمييز"
      - "الشعر الهزلي' في التعريف لا يعكس بدقة 'nonsense verse' بوصفه جنساً أدبياً مستقلاً ابتكره ليَر"
      - "حقل pos='n' لا يميّز بين الاسم المشترك والاسم العلم؛ المجموعة اسم علم لشخص بعينه"
    observations: >
      هذه المجموعة اسم علم خاص لشخصية تاريخية بريطانية محددة: فنان ورسّام وكاتب هزلي عاش
      في القرن التاسع عشر (1812-1888). اللمّتان الموجودتان تعريبان مباشران للاسم الأجنبي
      (Edward Lear)، وهما الصيغة المعتمدة في المصادر الموسوعية العربية الحديثة. لا تُطرح
      هنا إشكالية توليد مصطلح عربي خالص بل إشكالية ضبط التعريب وتوحيد الصيغة المرجعية.
      التعريف الحالي مقبول لكنه يستحق تدقيقاً في "nonsense verse" الذي ترجمه الباحثون
      أحياناً بـ"شعر اللامعنى" أو "الشعر العبثي الهزلي".

  blind_candidates:
    - lemma: "إِدْوَارْد لِيَر"
      generation_method: taarib
      justification: >
        الاسم الكامل للشخص المعني وفق قواعد التعريب القياسية؛ "إدوارد" تعريب لـEdward
        و"لير" تعريب لـLear، وهي الصيغة الأكثر شيوعاً في الموسوعات العربية.
    - lemma: "لِيَر"
      generation_method: taarib
      justification: >
        اللقب منفرداً، المقابل الشائع في المصادر العربية بعد ذكر الاسم كاملاً أو في
        السياقات الأدبية المتخصصة.
    - lemma: "إِدْوَارْد"
      generation_method: taarib
      justification: >
        الاسم الأول وحده؛ يُستخدم نادراً للدلالة على هذا الشخص بعينه إذ لا يُميّزه
        عن أعلام كثيرة تحمل الاسم ذاته.
    - lemma: "لِيَار"
      generation_method: taarib
      justification: >
        صياغة بديلة للقب تقوم على محاكاة النطق الإنجليزي الأصيل (Lear /lɪər/) بإشباع
        الياء؛ غير أنها أقل شيوعاً في المصادر العربية من "لير".


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دقيقة دفعية: ادوارد لير, لير, ادوارد, ليار
#   Q2 — الجسر الإنجليزي: "Edward Lear" OR "Lear" OR "nonsense verse"
#   Q3 — البحث بالكلمات المفتاحية العربية: "شعر هزلي", "كاتب هزلي", "فنان بريطاني"
#   Q4 — التحقق من المرشحات: ادوارد, الادوارد, ليار, الليار
stage2_evidence:
  per_lemma:
    - lemma: "إِدْوَارْد لِيَر"
      evidence_status: "no_material_found"
      # لم يُعثر على مدخل معجمي يطابق هذه اللمّة المركبة في أي من قواعد البيانات الثلاث

    - lemma: "لِيَر"
      contradicts:
        - text: >
            «لير، بالكسر، والياء مُمالة: ناحيةٌ من جُندَيسابور وجبال الأكراد المنتشرين
            بين الرَّيّ وأَصبهان، يُقال لها: لِير شَدّاد»
          source: "تاج العروس لمرتضى الزبيدي"
          conflict: >
            المدخل الوحيد الذي عثرنا عليه لـ'لير' في قاعدة البيانات هو اسم موضع جغرافي
            في المنطقة الفارسية-الكردية، لا علاقة له بالعَلَم الشخصي Edward Lear؛ وهذا
            يؤكد أن اللمّة تحتاج إلى تمييز معجمي واضح في سياق الاسم الأجنبي المعرَّب.

    - lemma: "إِدْوَارْد"
      evidence_status: "no_material_found"
      # لم تُسفر الاستعلامات عن مدخل ذي صلة بالشخص المعني؛ الاسم أجنبي محض

    - lemma: "لِيَار"
      evidence_status: "no_material_found"

    - lemma: "لِيَر (مرشح بديل)"
      evidence_status: "no_material_found"
      # نفس اللمّة الموجودة بتشكيل مختلف — الأدلة موثقة أعلاه تحت "لِيَر"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "إدوارد لير"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المعتمد دولياً للشخص المعني؛ وهو تعريب مستقر في المصادر الموسوعية
        العربية الحديثة (الموسوعة العربية، ويكيبيديا العربية، وغيرها). غياب المدخل من
        قاعدة البيانات المعجمية الكلاسيكية/الحديثة أمر طبيعي لأسماء الأعلام الأجنبية
        ذات الورود المتأخر. يحتاج إلى ضبط التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل الرسمي المستخدم في السياقات الأكاديمية والموسوعية والإحالات
        البيبليوغرافية الأولى؛ يُميّز الشخص تمييزاً قاطعاً عن كل من يحمل أحد شطريه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِدْوَارْد لِيَر"

    - lemma: "لير"
      decision: confirmed
      decision_reason: >
        اللقب المفرد شائع الاستخدام في المصادر العربية المتخصصة بالأدب الإنجليزي بعد
        ذكر الاسم كاملاً مرة واحدة. المدخل الذي وجدناه في قاعدة البيانات (تاج العروس)
        هو اسم مكان مختلف تماماً — لكسيم مستقل لا يتعارض مع الاسم العلم المعرَّب الأجنبي.
        يحتاج إلى ضبط التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صيغة الإحالة المختصرة (الكنية/اللقب) المستخدمة بعد التعريف الأول بالاسم
        الكامل؛ شائعة في النقد الأدبي والمقالات المتخصصة حين يتكرر ذكر الشخص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لِيَر"

    - lemma: "إِدْوَارْد"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الأول وحده لا يُحدِّد هوية صاحبه ويشترك مع عشرات الأعلام الأخرى؛ لا قيمة
        معجمية له منفرداً في هذه المجموعة. رُفض.

    - lemma: "لِيَار"
      source: stage1
      decision: removed
      decision_reason: >
        صياغة بديلة غير موثقة في المصادر العربية المتداولة؛ تُحدث التباساً إضافياً
        مع "ليار" (الكذّاب باللغة الفرنسية المُعرَّبة). الصيغة المعتمدة هي "لير". رُفضت.

    - lemma: "إِدْوَارْد لِيَر (مرشح)"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق تماماً للمّة الموجودة "إدوارد لير" بعد تشكيلها — لا حاجة لإجراء إضافي.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "فنان وكاتب بريطاني للشعر الهزلي (1812-1888)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزية، ويستوجب التحسين من ثلاثة وجوه:
        أولاً، "فنان" مبهمة — ليَر كان رسّاماً ومصمّم رسوم توضيحية بالدرجة الأولى.
        ثانياً، "الشعر الهزلي" لا يعكس مصطلح "nonsense verse" الجنسي الأدبي المحدد الذي
        ابتكره ليَر وأصبح رمزاً له؛ الأدق "شعر اللامعنى" أو "الأدب الهزلي العبثي".
        ثالثاً، الإيضاح الزمني بين قوسين مقبول في التعريفات الموسوعية لكنه يحسن
        صياغته بتعبير عربي سلس.
    authored:
      - type: encyclopedic
        text: >
          رسّامٌ وكاتبٌ بريطانيٌّ (1812-1888)، اشتهر بتأليف "شعر اللامعنى" الهزلي العبثي
          وكتب الأطفال المصوَّرة؛ يُعدّ من مؤسسي هذا الجنس الأدبي في الأدب الإنجليزي.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: terminological
        text: >
          فنانٌ بريطانيٌّ (1812-1888) جمع بين الرسم والكتابة الهزلية؛ اشتُهر بنظم
          "شعر اللامعنى" (nonsense verse) وتصوير كتب الأطفال.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11142429-n"
          definition_index: 0
          text: >
            رسّامٌ وكاتبٌ بريطانيٌّ (1812-1888)، اشتهر بتأليف شعر اللامعنى الهزلي العبثي
            وكتب الأطفال المصوَّرة، ويُعدّ من مؤسسي هذا الجنس الأدبي في الأدب الإنجليزي.

  examples:
    per_lemma:
      - lemma: "إِدْوَارْد لِيَر"
        examples:
          - text: >
              يُصنَّف إِدْوَارْد لِيَر في طليعة شعراء الأدب الهزلي العبثي في إنجلترا
              القرن التاسع عشر، وقصيدته "البومة والقطة" من أبرز نماذج شعر اللامعنى.
            type: usage
      - lemma: "لِيَر"
        examples:
          - text: >
              أعاد المترجمون العرب اكتشاف لِيَر شاعراً ورسّاماً فذّاً حين ترجموا مختارات
              من أشعاره الهزلية العبثية إلى العربية في مطلع الألفية الثالثة.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            يُصنَّف إِدْوَارْد لِيَر في طليعة شعراء الأدب الهزلي العبثي في إنجلترا
            القرن التاسع عشر، وقصيدته "البومة والقطة" من أبرز نماذج شعر اللامعنى.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            أعاد المترجمون العرب اكتشاف لِيَر شاعراً ورسّاماً فذّاً حين ترجموا مختارات
            من أشعاره الهزلية العبثية إلى العربية في مطلع الألفية الثالثة.


