# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-92421133-n
# المفهوم: حالة عدم وجود نجوم مرئية (starlessness)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «غياب النجوم» عبارة وصفية حرّة وليست مصطلحاً مسكوكاً، تفشل في اختبار السكّ (يمكن إبدالها بـ«غياب الكواكب» أو «انعدام النجوم» دون تغيير المعنى)"
      - "التعريف «حالة عدم وجود نجوم مرئية» شبه دائريّ مع اللمّة"
      - "المفهوم شديد التخصيص ولا يقابله مصطلح عربي مفرد معجمي ثابت"
    observations: "المفهوم يندرج تحت «ظلام» ويصف حالة سماء خالية من النجوم المرئية. في الشعر العربي والنثر الكلاسيكي تُوصف هذه الحالة بألفاظ مثل الغَيْهَب والدُّجْنَة والدُّجُنَّة، لكنها جميعاً تدلّ على الظلام العامّ لا على انعدام النجوم تحديداً. الأقرب من حيث السياق الاستعمالي حديث قُسّ بن ساعدة: «أَرقُبُ الكَوكَبَ وأَرمُقُ الغَيْهَبَ» الذي يربط بين مراقبة النجوم والظلام الشديد."
  blind_candidates:
    - lemma: "إِدْجَان"
      generation_method: ishtiqaq
      justification: "مصدر أَدْجَنَ على وزن إِفْعَال من الجذر د ج ن. أَدْجَنَ اللَّيْلُ: اشتدّ ظلامه وأطبق غيمه فلم تُرَ النجوم. يجمع بين الظلام وغياب الأجرام السماوية"
    - lemma: "غَيْهَب"
      generation_method: majaz
      justification: "الغَيْهَب: الظُّلمة الشديدة التي لا يُرى فيها شيء. في مقاييس اللغة: «أصل يدلّ على ظلام وقلّة ضياء». يُجاز من الظلام المطلق إلى حالة انعدام نور النجوم"
    - lemma: "دُجْنَة"
      generation_method: ishtiqaq
      justification: "الدُّجْنَة: السواد والظلمة (المعجم الوسيط). من الجذر د ج ن الذي يفيد إطباق الغيم على السماء وحجب ضوئها. أنسب من الغَيْهَب لارتباطه بحجب السماء"
    - lemma: "خُلُوُّ النُّجُوم"
      generation_method: tarkib
      justification: "تركيب إضافي من خُلُوّ (مصدر خَلَا: انعدم) + النجوم. أدقّ دلالةً من «غياب» لأنّ الخُلُوّ يفيد الانعدام التامّ لا مجرّد البُعد"

stage2_evidence:
  per_lemma:
    - lemma: "غِيَابُ النُّجُوم"
      evidence_status: "no_material_found"

    - lemma: "إِدْجَان"
      confirm:
        - text: "«أدجن: فلانٌ: دَخَلَ فِي الدَّجْنِ. اليَوْمُ: دَجَنَ. السَّحابُ: دَجَنَ. المَطَرُ: دامَ أَيَّامًا فَلَمْ يُقْلِع. السَّماءُ: دامَ مَطَرُها»"
          source: "المعجم الكبير"
        - text: "«أدجَن اللَّيلُ: اشتدّ ظلامه. أدجَن اليومُ: كان فيه غيمٌ كثيف. أدجنتِ السَّماءُ: كثر سحابُها ودام مطرُها»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«الدَّجْنُ: ظِلُّ الْغَيْمِ فِي الْيَوْمِ الْمَطِرِ. وَأَدْجَنَ الْمَطَرُ: دَامَ أَيَّامًا. وَالدُّجُنَّةُ: الظَّلْمَاءُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ أساساً على ظلام الغيم والمطر لا على غياب النجوم تحديداً"

    - lemma: "غَيْهَب"
      confirm:
        - text: "«الغَيْهَبُ: الظُّلْمَة، والجمع الغَياهِبُ»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«الغيهب: الظلمَة. ومن اللَّيْل: الشَّديد الظلمَة»"
          source: "المعجم الوسيط"
        - text: "«أَرقُبُ الكَوكَبَ وأَرمُقُ الغَيْهَبَ»"
          source: "النهاية في غريب الحديث — حديث قسّ بن ساعدة"
      expands:
        - text: "«الْغَيْنُ وَالْهَاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ظَلَامٍ وَقِلَّةِ ضِيَاءٍ، ثُمَّ يُسْتَعَارُ. فَالْغَيْهَبُ: الظُّلْمَةُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل يدلّ على ظلام عامّ وقلّة ضياء لا على غياب النجوم خاصّة"

    - lemma: "دُجْنَة"
      confirm:
        - text: "«الدُّجْنَة: السواد الظُّلمة»"
          source: "المعجم الوسيط"
        - text: "«الدُّجْنَةُ: السَّوادُ, وهى - فى أَلْوانِ الإبِل - أَقْبَحُ السَّوادِ. الظُّلْمَةُ»"
          source: "المعجم الكبير"
        - text: "«والدُّجْنَةُ بالضمّ: الظُّلمة»"
          source: "تاج اللغة وصحاح العربية للجوهري"
      contradicts:
        - text: "«دُجْنَة: سواد وظلمة، عتمة، ظلام. غيم ممطر قاتم يغطّي مساحة واسعة من السماء»"
          source: "معجم اللغة العربية المعاصرة"
          conflict: "الدُّجنة تعني الظلام العامّ أو ظلام الغيم، وليست مخصوصة بغياب النجوم"

    - lemma: "خُلُوُّ النُّجُوم"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "غِيَابُ النُّجُوم"
      decision: confirmed
      decision_reason: "المفهوم (انعدام النجوم المرئية) لا يقابله لفظ عربي مفرد معجمي ثابت. التركيب الإضافي «غياب النجوم» هو الطريقة الطبيعية للتعبير عن هذا المفهوم في العربية، وإن كان عبارة حرّة لا مصطلحاً مسكوكاً. يُبقى عليه لعدم وجود بديل أدقّ"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غِيَابُ النُّجُوم"

    - lemma: "إِدْجَان"
      source: stage1
      decision: removed
      decision_reason: "الإِدْجَان مصدر أَدْجَنَ ويدلّ على إطباق الغيم وظلامه ودوام المطر، وهو أقرب إلى ظلمة الطقس الغائم منه إلى غياب النجوم تحديداً. لا يصلح تخصيصه لهذا المفهوم دون تعسّف"
      evidence_assessment:
        case: mixed

    - lemma: "غَيْهَب"
      source: stage1
      decision: removed
      decision_reason: "الغَيْهَب يدلّ على الظلمة الشديدة عموماً وشدّة السواد، وهو في مرتبة الأعمّ (hypernym) إذ يتداخل مع «ظلام/عتمة» لا مع مفهوم غياب النجوم بعينه. إضافته ستخلط بين طبقتين دلاليتين"
      evidence_assessment:
        case: mixed

    - lemma: "دُجْنَة"
      source: stage1
      decision: removed
      decision_reason: "الدُّجنة تعني السواد والظلمة عموماً أو ظلمة الغيم المُطبق. ارتباطها بالسحاب والمطر يجعلها أخصّ من الظلام العامّ لكنها لا تفيد غياب النجوم تحديداً بل حجب الغيم للسماء"
      evidence_assessment:
        case: mixed

    - lemma: "خُلُوُّ النُّجُوم"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرّة مرادفة لـ«غياب النجوم» دون أيّ ميزة دلالية أو استعمالية. إضافتها ستُكرّر المعنى نفسه بصياغة مختلفة دون إثراء المجموعة"
      evidence_assessment:
        case: no_material

