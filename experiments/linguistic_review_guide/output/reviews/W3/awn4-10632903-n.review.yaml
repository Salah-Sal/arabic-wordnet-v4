stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('مالك حيازة صغيرة' و'مزارع صغير') عبارتان وصفيتان حرّتان لا مصطلحان مسكوكان؛ تُخفِق كلتاهما في اختبار السكّ."
      - "'مالك حيازة صغيرة' (٤ كلمات) غير اقتصادية كمصطلح، وكلمة 'مالك' تغطي جانب التملّك فحسب دون استئجار الأرض المذكور في التعريف."
      - "اللمّتان خاليتان من التشكيل الكامل."
      - "غياب مصطلح عربي مفرد مسكوك يقابل 'smallholder' يكشف عن فجوة معجمية حقيقية."
    observations: >
      المجموعة تُعبّر عن مفهوم المزارع صاحب الحيازة الزراعية الصغيرة (سواء أملكَها أم استأجرها)،
      وهو مفهوم موجود في الثقافة الريفية العربية لكنه يفتقر إلى مصطلح أُحادي ثابت في المعاجم.
      اللمّة الفائزة مبدئياً هي 'مزارع صغير' لكونها أكثر إيجازاً وأقرب إلى التداول. أما 'مالك حيازة صغيرة'
      فطويلة ومُضلِّلة لاقتصارها على التملّك. المفهوم ينتمي إلى فئة 'phraset' دلالياً: لا يُعبَّر عنه
      إلا بعبارة وصفية في العربية.

  blind_candidates:
    - lemma: "حَوَّازٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر حوز (الجمع والتجمّع والضمّ)، على وزن فَعَّال الدالّ على المزاولة المهنية.
        المقصود: من يحوز قطعة أرض زراعية صغيرة ويضمّها إلى نفسه — محاولة اشتقاقية من دلالة
        الحيازة اللغوية للجذر.
    - lemma: "صَغِيرُ الحِيَازَةِ"
      generation_method: tarkib
      justification: >
        مركب إضافي على نمط 'كبير القوم' و'صغير الأمر'، محذوف الموصوف (الشخص/المزارع).
        يُشير إلى من تصغر حيازته الزراعية، ويُركّز على خاصية الصِّغَر مقارنةً بالمزارع الكبير.
    - lemma: "خَمَّاسٌ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من المعنى التاريخي (من يعمل في أرض غيره مقابل خمس المحاصيل) نحو
        المزارع الصغير عموماً، استناداً إلى المشابهة الوظيفية (صغر الحجم، ضعف الموارد).
    - lemma: "فَدَّانِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى الفدّان (وحدة قياس الأرض الزراعية)، على وزن فَعَّالِيّ النسبي. يُوحي
        بمن لا تتعدّى أرضه الفدّانَ أو نحوه، أي صغير الحيازة.


stage2_evidence:
  per_lemma:
    - lemma: "مالك حيازة صغيرة"
      expands:
        - text: "«المالك: هو المتصرف في الأعيان المملوكة كيف شاء»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يُؤكّد أن 'مالك' تعني صاحب السلطة التامة على المملوك؛ لكنه لا يُفيد الاستئجار."
        - text: "«مَالِك: الحائز للشيء المنفرد بالتصريف فيه، ومتزوج المرأة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُفيد أن المالك يستأثر بالتصريف في الشيء — وهو أعمق من مجرد الحيازة الزراعية."
        - text: "«حيازة عقارية — land-holding»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يُثبت أن 'حيازة عقارية' هي المقابل الأقرب لـ 'land-holding' في الاصطلاح العربي الموحّد."

    - lemma: "مزارع صغير"
      confirm:
        - text: "«شخص يعمل في الزراعة وتربية الكائنات الحية بهدف إنتاج مواد غذائية للإنسان والحيوان»"
          source: "ARABTERM — مصدر زراعي"
          addition: "يُثبت أن 'مزارع' = شخص يعمل في الزراعة، وهو الجنس القريب الصحيح."

    - lemma: "حَوَّازٌ"
      contradicts:
        - text: "«الحَوَّازُ: الجُعَلُ الكِبارُ، وكأنَّه جَمْعُ حائزٍ ما يَحُوزُهُ الجُعَلُ من الدُّخْرُوجِ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: "المعنى المسجّل هو كبار الخنافس لا صاحب الحيازة الزراعية — انتفاء تام للدلالة المطلوبة."
        - text: "«الحوازُ: ذَكَرُ الخُنْفَساءِ؛ حَوازُ القُلُوبِ: ما يَحُوزُ القُلُوبَ ويَغْلِبُ عليها»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: "معنيان مسجّلان: الخنفساء الذكر، وما يأسر القلوب — كلاهما يتعارض مع المقصود."

    - lemma: "صَغِيرُ الحِيَازَةِ"
      evidence_status: "no_material_found"

    - lemma: "خَمَّاسٌ"
      contradicts:
        - text: "«خَمَّاس: الذي يعمل في أرض غيره مقابل خمس المحاصيل»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            الخمّاس أجيرٌ مزارع يعمل في أرض مملوكة لغيره مقابل حصة من الإنتاج،
            وهو بخلاف صاحب الحيازة الصغيرة الذي يملك أرضه أو يستأجرها لحسابه الخاص.
      expands:
        - text: "«خَمَسَ القومَ: أخذ خُمُسَ أموالهم»، وأصل الجذر في العدد خمسة"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُبيّن أن الخَمَّاس مشتقّ من العدد خمسة (نظام الخُمُس الزراعي)، وهو غير ذلك المفهوم."

    - lemma: "فَدَّانِيٌّ"
      expands:
        - text: "«فَدَّانِي: من (ف د ن) المنسوب إلى الفَدَّان»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "صفة نسبة لا اسم شخص؛ والفَدَن في مقاييس اللغة يعني 'القصر' لا الأرض."
        - text: "«فَدَنَ: الفاء والدال والنون كلمة واحدة، وهي الفَدَنُ، يقولون: إنه القصر»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر الأصلي فدن يعني القصر؛ فالفدّان (وحدة الأرض) قد يكون معرَّباً، مما يُضعف الاشتقاق."


stage3_analysis:
  per_lemma:
    - lemma: "مالك حيازة صغيرة"
      decision: removed
      decision_reason: >
        أولاً: تُخفق اللمّة في اختبار السكّ — يمكن إحلال 'مستأجر' أو 'صاحب' أو 'حائز'
        محلّ 'مالك' دون أن يتغير المعنى الوصفي. ثانياً: 'مالك' تعني المالكَ القانوني لا
        المستأجر، وهي تُغطّي نصف التعريف فقط ('يملك'، دون 'يستأجر'). ثالثاً: طول المركب
        (٤ كلمات) يجعله غير صالح كلمّة معجمية. لذا تُحذف هذه اللمّة والمعنى المرتبط بها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مزارع صغير"
      decision: confirmed
      decision_reason: >
        أفضل ما تُتيحه العربية لهذا المفهوم. اللمّة مركّبة وصفية (مزارع + صغير)، مُتداولة
        في الكتابة الزراعية والصحفية العربية للدلالة على الفلاح ذي الحيازة الصغيرة. المفهوم
        لا مقابل مفرداً له في العربية (phraset)، وتُعدّ 'مزارع صغير' الصياغة الأقلّ تكلّفاً
        والأكثر تداولاً. تحتاج اللمّة إلى إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُزَارِعٌ صَغِيرٌ"

    - lemma: "حَوَّازٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الكبير يُسجّل 'الحَوَّاز' بمعنى كبار الخنافس (الجُعَل)، ولا علاقة له بالحيازة
        الزراعية. الدلالة المعجمية المُسجَّلة تتناقض تناقضاً تاماً مع المفهوم المطلوب.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "صَغِيرُ الحِيَازَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المركب كوحدة معجمية ثابتة في أي مصدر. هو عبارة وصفية حرّة
        يمكن إحلال 'صاحب' أو 'ذو' أو 'قليل' محلّ 'صغير' فتبقى وصفاً لا مصطلحاً.
        يُخفق في اختبار السكّ واختبار التثبيت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "خَمَّاسٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الخَمَّاس في المعاجم هو من يعمل في أرض مملوكة لغيره مقابل الخمس من المحصول،
        وهو نظام مغاير كلياً: صاحب الحيازة الصغيرة يملك أرضه أو يستأجرها لنفسه، بينما
        الخَمَّاس أجير بالنسبة. الإزاحة الدلالية المقترحة لا تستقيم لأن المعنى الأصلي
        المُسجَّل أقوى ومتداوَل بخلاف المعنى المُراد.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "فَدَّانِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        'فَدَّانِيّ' صفة نسبة لا اسم شخص، وجذر 'فدن' في مقاييس اللغة يعني القصر لا
        الأرض. وحدة الأرض 'الفدّان' ذاتها ربما معرَّبة. المركب لا يُسكّ على هذا الوزن
        للدلالة على الشخص في الاستعمال الفصيح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


stage4_content:
  definition:
    current: "شخص يملك أو يستأجر حيازة زراعية صغيرة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دقيق من حيث المضمون، لكنه يفتقر إلى الإشارة إلى أن الشخص يستثمر
        الحيازة بنفسه (وهو ما يُميّز صاحب الحيازة الصغيرة عن المالك العقاري الغائب).
        كما أن كلمة 'حيازة' وحدها قد تُوحي بالحيازة القانونية المجرّدة لا بالقطعة الأرضية المزروعة.
    authored:
      - type: terminological
        text: "شخصٌ يمتلك أو يستأجر قطعةً أرضيةً زراعيةً صغيرةً، يزرعها بنفسه ويستثمرها لإعالة نفسه وأسرته"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          المُزارع الصغير هو من يحوز رقعةً من الأرض لا تتجاوز في العادة بضعةَ هكتارات،
          سواءٌ أكانت ملكاً له أم مستأجَرةً، ويُديرها بجهده المباشر لإنتاج المحاصيل الغذائية
          أو لرعي الماشية على نطاق محدود. يتميّز عن الفلاح الكبير (المزارع التجاري) بضعف
          رأس المال وصِغَر الرقعة الزراعية وغياب الاستثمار الآليّ الواسع.
