      decision_reason: "المفردة المنفردة موثَّقة في معاجم الصيدلة وتقانات الأغذية بمعنى 'أداة/وعاء التخمير' لا الشخص، مما يُوقع في لبس اصطلاحي حاد. أما المركّب 'مُخَمِّر الجِعَة' فيساوي 'صَانِعُ الجِعَة' المُقرَّر أدناه مع مزيد من الغموض."
