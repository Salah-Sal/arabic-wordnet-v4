# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'خمّار' تُشير في الأصل إلى بائع الخمر (العنبية/النبيذ) أو صانعها لا إلى صانع الجِعَة (البيرة) تحديداً؛ وهذا توسيعٌ دلالي غير محدَّد يُبهم المعنى المقصود."
      - "اللمّة 'صانع البيرة' عبارةٌ وصفية حرة تستخدم 'البيرة' الدخيل (< beer)، وليست تعبيراً اصطلاحياً مسكوكاً؛ تفشل اختبار السكّ لأن 'صانع' تقبل الإبدال بـ'مُنتج' أو 'صانعة' دون أن تفقد دلالتها الوصفية."
      - "غياب التشكيل الكامل عن اللمّتَين الموجودتَين."
      - "التعريف الحالي يستخدم 'الجنجل' لـhops، وهو لفظ لهجي/نادر؛ المعجم الكبير يستخدم 'حشيشة الدينار' وهو الأدق."
    observations: >
      مفهوم صانع الجِعَة (Beer brewer) معروف في التراث العربي إذ وردت الجِعَة
      في المعاجم الكبرى بوصفها مشروباً من الشعير المخمَّر يُسكر. غير أن العربية
      لا تملك لفظاً أُحادياً مسكوكاً خاصاً بصانع البيرة، وكان يُستعمل 'النبّاذ'
      (صانع النبيذ من التمر)، و'الخمّار' (صانع الخمر العنبية)، وهما من دوائر
      دلالية قريبة لكن غير مطابقة. المصطلح الفصيح الأدق هو 'صانع الجِعَة' أو
      'مُخَمِّر الجِعَة' كما أثبته المورد الحديث. البيرة الدخيلة يُستحسن
      إبدالها بـ'الجِعَة' في اللمّات والتعريف على حدٍّ سواء.
  blind_candidates:
    - lemma: "مُخَمِّر"
      generation_method: ishtiqaq
      justification: "وزن مُفَعِّل من جذر 'خمر'، يدلّ على من يُخَمِّر المواد الخام (الشعير والماء) لإنتاج المشروبات المخمَّرة؛ مستند إلى قول ابن فارس 'خمَّرت العجين: تركته يجود'، وقول الخليل 'مُخَمِّرها: مُتَّخِذُها'."
    - lemma: "نَبَّاذ"
      generation_method: majaz
      justification: "إحياء لفظ تراثي (صانع النبيذ المُنبَذ من التمر أو الشعير) وإزاحته دلالياً نحو كل صانع مشروب حبوبي مخمَّر؛ وزن فَعَّال الدال على المهنة من جذر 'نبذ'."
    - lemma: "صَانِعُ الجِعَة"
      generation_method: tarkib
      justification: "مركب إضافي؛ الجِعَة هي اللفظ العربي الفصيح للمشروب المُصنَع من الشعير المُنبَّت المخمَّر — أي البيرة — وصانعها هو brewer بالضبط."
    - lemma: "خَمَّار"
      generation_method: ishtiqaq
      justification: "وزن فَعَّال الدال على المهنة من جذر 'خمر'؛ يُطلق على من يصنع الخمر أو يبيعها، ويشمل بالتوسع كل صانع مسكر مخمَّر من الحبوب."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "خَمَّار"
      confirm:
        - text: "«صانِعُ الخَمْر بائِعُها»"
