          conflict: "الترجمة الإنجليزية الحديثة تُحدِّد الخمّار بـ'wine butler' (ساقي النبيذ) لا 'brewer' (صانع البيرة)، مما يُثبت الانزياح الدلالي نحو الخدمة لا الصناعة في الاستخدام المعاصر."
      expands:
        - text: "«خمّار: [في الانكليزية] Drunkness، guide — بضم الخاء وتشديد الميم، ومعناها بالفارسية: دوران الرأس من السكر، وهو عند الصوفية الشيخ والمرشد»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (entry_id=821353)"
