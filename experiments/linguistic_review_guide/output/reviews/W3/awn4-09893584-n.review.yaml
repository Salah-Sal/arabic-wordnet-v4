          conflict: "تأكيد ثانٍ على أن 'مُخَمِّر' المفرد يُستخدم تقنياً لوعاء/جهاز التخمير، لا للشخص."
      expands:
        - text: "«وَمُخَمِّرُهَا: مُتَّخِذُهَا»"
