          addition: "يُثبت ابن فارس أن 'مُخَمِّر' تُطلق في الكلاسيكية على مُتَّخِذ الخمر (صانعها)، مما يدعم استخدام المركّب 'مُخَمِّر الجِعَة' الذي يَرِد في المورد الحديث."
        - text: "«فا brew. وبخاصة: مُخَمِّر الجِعَة أو صانعُها»"
