stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي يحتوي على ترجمة حرفية ركيكة لعبارة (manipulated according to rules) إلى (يتم التلاعب بها وفقاً لقواعد)، وهو تعبير غير مألوف رياضياً، والأفضل استخدام (تخضع لعمليات حسابية وفق قواعد محددة)."
    observations: "المفهوم الرياضي (matrix) يعبر عنه في العربية بمصطلح (مصفوفة)، وهو مصطلح مستقر وشائع في الرياضيات، مشتق من الجذر (ص ف ف) لأن العناصر تنتظم في صفوف وأعمدة."
  blind_candidates:
    - lemma: "مَصْفُوفَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (ص ف ف) على وزن مفعولة، لأنها تضم عناصر مصفوفة في نظام مستطيل."
    - lemma: "جَدْوَل"
      generation_method: majaz
      justification: "نقل دلالي من الجدول الذي تنظم فيه البيانات في صفوف وأعمدة."
    - lemma: "نَسَق"
      generation_method: majaz
      justification: "لأنها تمثل نسقاً معيناً وترتيباً لعناصر أو مقادير."
    - lemma: "مُرَبَّعَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (ر ب ع) نظراً للشكل المربع أو المستطيل الذي تتخذه العناصر."

stage2_evidence:
  per_lemma:
    - lemma: "مَصْفُوفَة"
      confirm:
        - text: "«(فى الجبر): تنظيمٌ مُستطيلىٌّ لعددٍ من الحدود مُرتَّبةٌ فى أعمدةٍ وصفوفٍ, وتُكتبُ عادةً بين قوسين, ويُرمزُ لأىِّ عُنْصُرٍ»"
          source: "المعجم الكبير"
        - text: "«جدول مُربَّع الشكل يتكوَّن من عناصر تكونُ غالبًا من موضوعاتٍ حسابية، مثل الأعداد. ومن خلال هذه العناصر، يُمكن باتباع طريقةٍ مُحدَّدة إجراء العملية الحسابية، وذلك عن طريق جمع المصفوفات أو ضربها معاً.»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم"
    - lemma: "جَدْوَل"
      contradicts:
        - text: "«شكل يحتوي على مجموعة قضايا أو معلومات بوجه مختصر، تنظيم للبيانات والمعلومات في صورة صفوف وأعمدة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "الجدول هو اصطلاح عام لتنظيم المعلومات، بينما المصفوفة في الرياضيات كيان جبري واحد يخضع لعمليات حسابية."
    - lemma: "نَسَق"
      contradicts:
        - text: "«ما كان على نظام واحد من كل شيء»"
          source: "المعجم الوسيط"
          conflict: "مصطلح عام يشير إلى النظام أو الترتيب، ولا يطلق كاصطلاح على الكيان الرياضي ذي الأبعاد."
    - lemma: "مُرَبَّعَة"
      contradicts:
        - text: "«المربع (ج) مرابع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "لا تستخدم بدلالة المصفوفة الرياضية المستطيلة التكوين."

stage3_analysis:
  per_lemma:
    - lemma: "مَصْفُوفَة"
      decision: confirmed
      decision_reason: "مصطلح رياضي فصيح ومستقر ومثبت في المعاجم العلمية المعتمدة لترجمة (matrix)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الرياضي الدقيق المعتمد للتعبير عن هذا الكيان الجبري."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَصْفُوفَة"

    - lemma: "جَدْوَل"
      source: stage1
      decision: removed
      decision_reason: "معناه عام لترتيب البيانات ولا يعبر عن الكيان الجبري الذي تُجرى عليه العمليات."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "نَسَق"
      source: stage1
      decision: removed
      decision_reason: "تعبير عام عن الترتيب والنظام، وليس مصطلحاً متخصصاً في هذا السياق الرياضي."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُرَبَّعَة"
      source: stage1
      decision: removed
      decision_reason: "مصطلح غير مستعمل ولا يعبر بدقة عن التنظيم المستطيل للعناصر."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "(رياضيات) ترتيب مستطيل لكميات أو تعبيرات موضوعة في صفوف وأعمدة؛ تعامل كعنصر واحد ويتم التلاعب بها وفقاً لقواعد"
    assessment:
      decision: revise
      reason: "تعبير (يتم التلاعب بها) ترجمة حرفية ركيكة لـ (manipulated)، والأفضل (تخضع لعمليات حسابية)."
    authored:
      - type: terminological
        text: "(في الرياضيات) كِيَانٌ جَبْرِيٌّ يَتَكَوَّنُ مِنْ تَنْظِيمٍ مُسْتَطِيلٍ لِكَمِّيَّاتٍ أَوْ تَعْبِيرَاتٍ مُرَتَّبَةٍ فِي صُفُوفٍ وَأَعْمِدَةٍ، وَيُعَامَلُ كَعُنْصُرٍ وَاحِدٍ يَخْضَعُ لِعَمَلِيَّاتٍ حِسَابِيَّةٍ وَفْقَ قَوَاعِدَ مُحَدَّدَةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-08284561-n"
          definition_index: 0
          text: "(في الرياضيات) كِيَانٌ جَبْرِيٌّ يَتَكَوَّنُ مِنْ تَنْظِيمٍ مُسْتَطِيلٍ لِكَمِّيَّاتٍ أَوْ تَعْبِيرَاتٍ مُرَتَّبَةٍ فِي صُفُوفٍ وَأَعْمِدَةٍ، وَيُعَامَلُ كَعُنْصُرٍ وَاحِدٍ يَخْضَعُ لِعَمَلِيَّاتٍ حِسَابِيَّةٍ وَفْقَ قَوَاعِدَ مُحَدَّدَةٍ."
