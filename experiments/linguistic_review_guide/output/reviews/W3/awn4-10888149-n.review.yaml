    - lemma: "فيليبو برونليسكي"
      evidence_status: "no_material_found"

    - lemma: "بِرُونِيلِيسْكِي"
      evidence_status: "no_material_found"

    - lemma: "فِيلِيبُّو بِرُونِيلِيسْكِي"
      evidence_status: "no_material_found"

    - lemma: "بِرُونِيلِّيسْكِي"
      evidence_status: "no_material_found"

    - lemma: "فِيلِيبُّو دي سِير بِرُونِيلِيسْكِي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى الموجودة ──
    - lemma: "برونليسكي"
      decision: confirmed
      decision_reason: >
        اللمّة هي التعريب العربي الرائج للقب 'Brunelleschi'، وهي مُعتمَدة في السياق العلمي
        العربي. غير أنها تحتاج إلى: (أ) تصحيح التهجئة بإثبات الياء بين النون واللام
        (برونيليسكي) وفق المصادر العربية الموثوقة وللتقرّب من النطق الإيطالي الأصلي،
        (ب) إضافة التشكيل الكامل الإلزامي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المجرد (الكنية)؛ يُستخدم في الكتابة الأكاديمية والنصوص التخصصية بعد
        التعريف الأول للشخصية، إذ يكتفي بالكنية حين لا لبس في المراد. يحمل طابع الإيجاز
        والاستحضار السريع للشخصية في السياق المتخصص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِرُونِيلِيسْكِي"

    # ── اللمّة الثانية الموجودة ──
    - lemma: "فيليبو برونليسكي"
      decision: confirmed
      decision_reason: >
        اللمّة هي الاسم العلمي الكامل للمعماري الفلورنسي، وهي المدخل الرئيس في المراجع
        الموسوعية العربية. تحتاج إلى: (أ) تصحيح تهجئة الكنية (برونيليسكي) على النحو المذكور،
        (ب) ضبط النطق الصحيح للاسم الأول (فِيلِيبُّو) بمضاعفة الباء وفق الأصل الإيطالي،
        (ج) إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم العلمي الكامل (الاسم الشخصي + اسم العائلة)؛ يُستخدم في المداخل الموسوعية
        والاستشهاد الرسمي الأول، أو حين يكون الاقتصار على الكنية مُحتمِلاً للبس مع
        شخصيات أخرى من العائلة أو العصر ذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فِيلِيبُّو بِرُونِيلِيسْكِي"

    # ── مرشحات المرحلة ١ ──
    - lemma: "بِرُونِيلِيسْكِي"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق هذا المرشح مع الصيغة المُصحَّحة للمّة 'برونليسكي' الموجودة أصلاً في
        المجموعة؛ الإجراء المُقرَّر هو update_lemma للمّة الموجودة لا إضافة لمّة جديدة.

    - lemma: "فِيلِيبُّو بِرُونِيلِيسْكِي"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق هذا المرشح مع الصيغة المُصحَّحة للمّة 'فيليبو برونليسكي' الموجودة أصلاً؛
        الإجراء المُقرَّر هو update_lemma للمّة الموجودة لا إضافة لمّة مستقلة.

    - lemma: "بِرُونِيلِّيسْكِي"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تهجئة بديلة تُعلِّم مضاعفة اللام الإيطالية، غير أنها أقل شيوعاً وتكسر
        القاعدة الصوتية العربية الأكثر استيعاباً للاسم. إضافتها تُحدث تشويشاً دون قيمة
        مضافة؛ يُكتفى بالصيغة المعتمدة (بِرُونِيلِيسْكِي).

    - lemma: "فِيلِيبُّو دي سِير بِرُونِيلِيسْكِي"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الرسمي الكامل عند الولادة، لا يُستعمل إلا في الدراسات التاريخية الأكاديمية
        المتخصصة. يفوق درجة التفصيل المطلوبة في معجم لغوي عام، ولا يُضيف قيمة دلالية
        مستقلة فوق اللمّتين المُعتمدتين.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري فلورنسي كان أول معماري عظيم في عصر النهضة الإيطالية (1377-1446)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يُكرِّر كلمة 'معماري' في مطلع الجملة (معماري فلورنسي) وفي وصف
        القدر (أول معماري عظيم)، وهو خلل أسلوبي واضح. فضلاً عن ذلك، يقتصر على الوصف
        الوظيفي العام دون تشخيص موسوعي يُبيّن أعمال هذه الشخصية الفارقة في التاريخ
        المعماري. التعريف الأمثل لشخصية تاريخية ينبغي أن يتضمن: الجنس القريب (مهندس
        معماري)، التخصيص الجغرافي (فلورنسي - إيطالي)، الفترة الزمنية، والإنجاز المحوري.
    authored:
