        text: >
          مهندس معماري إيطالي فلورنسي (1377-1446)، يُعدّ رائد عصر النهضة في فن العمارة؛
          اشتُهر بإشرافه على تصميم قبة كاتدرائية سانتا ماريا ديل فيوري في فلورنسا،
          وبإسهاماته العلمية في إرساء قواعد المنظور الخطي الهندسي.
