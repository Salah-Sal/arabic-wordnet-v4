# ════════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10888149-n  |  ILI: i94571  |  POS: n
# الموضوع: فيليبو برونيليسكي — المعماري الإيطالي الفلورنسي (1377-1446)
# ════════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة الترادفية تمثّل عَلَماً شخصياً (اسم إنسان بعينه)، مما يُقيّد التوليد الأعمى بالضرورة على التعريب (نقل الاسم الأجنبي إلى العربية)؛ لا سبيل إلى اشتقاق أو مجاز أو تركيب عربي أصيل لاسم شخص تاريخي غربي."
      - "اللمّتان الحاليتان (برونليسكي وفيليبو برونليسكي) تفتقران إلى التشكيل الكامل الإلزامي."
      - "تهجئة 'برونليسكي' تستوجب المراجعة؛ المصادر العربية الموثوقة (ويكيبيديا العربية وعدد من المعاجم الموسوعية) تعتمد 'برونيليسكي' بإثبات الياء بين النون واللام، وهو ما يُقارب النطق الإيطالي الأصلي Bru-nel-leschi أكثر دقةً."
      - "التعريف الحالي يُعيد كلمة 'معماري' في مطلع الجملة وفي داخل الوصف ('أول معماري عظيم')، وهو تكرار معيب من منظور صياغة التعريفات المعجمية."
    observations: >
      هذه المجموعة تمثّل عَلَماً شخصياً تاريخياً غربياً: المعماري الإيطالي الفلورنسي فيليبو برونيليسكي
      (1377-1446)، الذي يُعدّ أبا العمارة في عصر النهضة الإيطالية. التعريف يُحدِّد الشخصية تحديداً
      وافياً عبر ثلاثة عناصر: النسبة الجغرافية (فلورنسي)، واللقب المميِّز (أول معماري عظيم في عصر
      النهضة الإيطالية)، والفترة الزمنية (1377-1446). جميع اللمّات المُمكنة لهذه المجموعة هي تعريبات
      (تحويل صوتي) للاسم الأجنبي، لا يوجد في المعجمية العربية الأصيلة مفردة عربية تُسمّي هذا الشخص.
      التوليد الأعمى هنا مُقيَّد بالتاريخ: التواريخ 1377-1446 والوصف 'أول معماري عظيم في عصر النهضة
      الإيطالية' يُعرِّفان برونيليسكي تعريفاً فريداً لمن يمتلك معرفة بتاريخ الفنون الأوروبية.

  blind_candidates:
    - lemma: "بِرُونِيلِيسْكِي"
      generation_method: taarib
      justification: >
        تعريب اسم العائلة 'Brunelleschi' بنقل أصواته الإيطالية إلى مقابلاتها العربية مع إثبات
        الياء بين النون واللام (Bru-nel → بِرُونِيلْ) للحصول على نطق أقرب إلى الأصل الإيطالي.
        هذا الشكل يُوافق ما اعتمدته ويكيبيديا العربية والمصادر الأكاديمية العربية الحديثة.

    - lemma: "فِيلِيبُّو بِرُونِيلِيسْكِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل 'Filippo Brunelleschi'؛ الاسم الأول 'Filippo' يُعرَّب بإثبات الياءين
        ومضاعفة الباء (فِيلِيبُّو) لمحاكاة النطق الإيطالي، وكنية العائلة على الوجه المذكور.
        هذه اللمّة هي المدخل الموسوعي الرئيس للشخصية في المراجع العربية.

    - lemma: "بِرُونِيلِّيسْكِي"
      generation_method: taarib
      justification: >
        تعريب بديل يُعلِّم مضاعفة اللام الإيطالية (Brunel-leschi) بالشدّة على اللام (لِّ)،
        وهو خيار صوتي أكثر دقةً من منظور الصواتة التقابلية، وإن كان أقل شيوعاً في المصادر
        العربية مقارنةً بالصيغة المفردة اللام.

    - lemma: "فِيلِيبُّو دي سِير بِرُونِيلِيسْكِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الرسمي الكامل عند الولادة 'Filippo di Ser Brunellescho'، يتضمن اللقب
        الأسري 'دي سير' (di Ser) الدال على المرتبة الاجتماعية لأبيه النوتاريوس. يُستعمل في
        الدراسات التاريخية المتخصصة التي تُعنى بالسياق الاجتماعي لعصر النهضة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دقيقة دفعية: برونليسكي، فيليبو برونليسكي (+ صيغ ال-) → لا نتائج
#   Q2 — جسر إنجليزي: translation_en:"Brunelleschi" OR "Filippo Brunelleschi" → لا نتائج
#   Q3 — FTS عربي: "فلورنسي" OR "النهضة الايطالية" OR "معماري فلورنس" → نتائج غير ذات صلة
#   Q4 — تحقق من المرشحات: برونيليسكي، فيليبو برونيليسكي (+ صيغ بديلة) → لا نتائج
# الخلاصة: لا يوجد في قاعدة البيانات المعجمية أي مدخل يتعلق بهذه الشخصية التاريخية.
