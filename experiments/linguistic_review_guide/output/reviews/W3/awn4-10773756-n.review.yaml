# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
stage5_enrichment:

  per_entry:
    # MWE: صَانِعُ نَبِيذ — جذران
    - lemma: "صَانِعُ نَبِيذ"
      entry_id: "{auto}"
      roots:
