        - word: "نبيذ"
          root: "نبذ"
          maqayis_quote: "«النُّونُ وَالْبَاءُ وَالذَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى طَرْحٍ وَإِلْقَاءٍ. وَالنَّبِيذُ: التَّمْرُ يُلْقَى فِي الْآنِيَةِ وَيُصَبُّ عَلَيْهِ الْمَاءُ»"

