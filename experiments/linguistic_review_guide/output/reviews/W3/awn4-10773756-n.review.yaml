# ══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10773756-n  |  ILI: i93939  |  POS: n
# المفهوم: صانع النبيذ / vintner / winemaker
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (صانع نبيذ) خالية من التشكيل الكامل"
      - "التعريف الحالي (شخص يصنع النبيذ) ترجمة حرفية مباشرة للإنجليزية، ويفتقر إلى الأسلوب المعجمي"
      - "المجموعة تقتصر على لمّة واحدة مركّبة وصفية، في حين تملك العربية مصطلحات مشتقة أصيلة لهذا المفهوم"
      - "اللمّة المركّبة (صانع نبيذ) وصفية حرّة لا مصطلح مسكوك — يستوجب التحقق من تثبيتها المعجمي"
    observations: >
      المفهوم المُعبَّر عنه (الشخص الذي يصنع النبيذ) له جذور عربية راسخة في معجمي النبيذ والخمر.
      الجذر «نبذ» يولّد مباشرةً النبيذَ والنَّبَّاذ، مما يجعل الاشتقاق المنهجي متاحاً وموثَّقاً.
      الجذر «خمر» أيضاً يولّد خَمَّاراً على وزن فَعَّال الدالّ على الحِرفة.
      اللمّة الحالية «صانع نبيذ» صحيحة لغوياً لكنها تعبير وصفي لا مصطلح مسكوك، وقد تفتقر إلى التثبيت المعجمي.

  blind_candidates:
    - lemma: "خَمَّار"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (خ-م-ر) على وزن فَعَّال الدالّ على حِرفة الصُّنع والبيع؛
        فالخَمَّار من يصنع الخمر أو يبيعها. الوزن فَعَّال من أكثر الأوزان إنتاجية
        للحِرَف في العربية (نجّار، بنّاء، خبّاز).

    - lemma: "نَبَّاذ"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر (ن-ب-ذ) على وزن فَعَّال؛ والجذر نفسه هو أصل كلمة «نبيذ»
        (التمر يُلقى في الإناء ويُصَبّ عليه الماء). فالنَّبَّاذ صانع النبيذ بالاشتقاق
        المنهجي المباشر، مع انتفاء الاشتراك اللفظي المُلتبس.

    - lemma: "عَصَّار"
      generation_method: majaz
      justification: >
        مشتق من الجذر (ع-ص-ر) على وزن فَعَّال، دالٌّ على من يعصر؛ وصنع النبيذ
        يبدأ بعصر العنب استخراجاً للعصير. الإزاحة الدلالية من «العصر» إلى «صنع
        النبيذ» مشابهةٌ وظيفية مباشرة.

    - lemma: "صَانِعُ الخَمْر"
      generation_method: tarkib
      justification: >
        مركَّب إضافي من (صانع + الخمر)، يوازي اللمّة الحالية في البنية التركيبية
        لكنه يستعمل «الخمر» بدل «النبيذ»؛ الخمر أشيع في التراث العربي للدلالة
        على المشروب المتخمَّر من العنب.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المنفَّذة:
#   Q1: مطابقة دفعية — الخمار/خمار، النباذ/نباذ، العصار/عصار، صانع الخمر
#   Q2: الجسر الإنجليزي — vintner, winemaker, wine maker, wine producer, winery
#   Q3: إثراء بالمعرّف — entry_ids: 84240, 8054, 923419, 28353, 885477, 727537
#   Q4: مقاييس اللغة — جذور: نبذ، خمر، صنع (dictionary_id=151)
#   Q5: FTS عربي — نبيذ، خمر، نباذ، عصير العنب
stage2_evidence:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "صانع نبيذ"
      confirm:
        - text: "«(1) تاجر الخمر (2) صانع الخمر.» — ترجمة vintner"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«المَخْمَرة: مَصْنع الخَمْر.» — ترجمة winery"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يوجد في العربية مصطلح متخصص للمكان (مَخْمَرة) وللشخص (نَبَّاذ، خَمَّار)"

    # ── مرشح ١: خَمَّار ──
    - lemma: "خَمَّار"
      confirm:
        - text: "«صانِعُ الخَمْر بائِعُها»"
          source: "المعجم الكبير — مجمع اللغة العربية (OCR)"
        - text: "«خَمَّار: من (خ م ر) صانع الخمر وبائعها.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«خمّار» — translation_en: wine butler"
          source: "مسرد الفن والتسلية والرياضة — ALECSO (ARABTERM)"
      contradicts:
        - text: "«بائع الخمر»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
          conflict: >
            المعجم الوسيط يقتصر في تعريف الخَمَّار على «بائع الخمر» دون ذكر الصنع،
            في حين يُثبت المعجم الكبير وموسوعة قابوس أن الخَمَّار صانعُ الخمر وبائعُها.
            التعارض جزئي: المعجم الوسيط اختصر لا نفى.
      expands:
        - text: >
            «الْخَاءُ وَالْمِيمُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى التَّغْطِيَةِ،
            وَالْمُخَالَطَةِ فِي سَتْرٍ. فَالْخَمْرُ: الشَّرَابُ الْمَعْرُوفُ.
            وَاخْتِمَارُهَا: إِدْرَاكُهَا وَغَلَيَانُهَا. وَمُخَمِّرُهَا: مُتَّخِذُهَا.»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            يُثبت ابن فارس لفظ «مُخَمِّرها» بمعنى «مُتَّخِذها»، مما يؤكد اشتقاق
            الخَمَّار من هذا الأصل الدال على الصنع.

    # ── مرشح ٢: نَبَّاذ ──
    - lemma: "نَبَّاذ"
      confirm:
        - text: "«النَّبَّاذُ: صانع النبيذ»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
        - text: "«النباذ: صانع النَّبِيذ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين — مجمع القاهرة (Hawramani)"
      expands:
        - text: >
            «النُّونُ وَالْبَاءُ وَالذَّالُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى طَرْحٍ
            وَإِلْقَاءٍ. وَالنَّبِيذُ: التَّمْرُ يُلْقَى فِي الْآنِيَةِ وَيُصَبُّ
            عَلَيْهِ الْمَاءُ. يُقَالُ: نَبَذْتُ أَنْبِذُ.»
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            ابن فارس يشرح أن أصل النبيذ هو الإلقاء في الإناء؛ والنَّبَّاذ
            بالاشتقاق على وزن فَعَّال هو من يقوم بهذا الفعل حرفةً.

    # ── مرشح ٣: عَصَّار ──
    - lemma: "عَصَّار"
      contradicts:
        - text: "«العِصارُ: الحينُ (يقال: جاء على عِصار من الدَّهر: على حين). الغبارُ الشَّديدُ»"
          source: "المعجم الوسيط — مجمع اللغة العربية (OCR)"
          conflict: >
            عِصَار في المعاجم يعني «الحين» أو «الغبار الشديد» لا صانع النبيذ.
            لا يُعثَر على عَصَّار (بالتشديد) بمعنى عاصر العنب في أي من المراجع
            المستعلَمة. الكلمة في الوزن المطلوب (فَعَّال) غير مثبتة لهذه الدلالة.

    # ── مرشح ٤: صَانِعُ الخَمْر ──
    - lemma: "صَانِعُ الخَمْر"
      expands:
        - text: "«(1) تاجر الخمر (2) صانع الخمر.» — ترجمة vintner"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >
            يرد التعبير «صانع الخمر» في المورد الحديث كتفسير لـ vintner، لكنه
            جاء في صياغة تعريفية (جملة تفسيرية) لا كمصطلح مسكوك مستقل.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة: صانع نبيذ ──
    - lemma: "صانع نبيذ"
      decision: confirmed
      decision_reason: >
        التعبير صحيح لغوياً وله استعمال في المعاجم الحديثة (المورد الحديث يترجم vintner
        بـ«صانع الخمر» في صيغة مشابهة). المركّب الإضافي مفهوم وشائع في العربية المعاصرة.
        يُحتفظ به مع تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        تعبير وصفي مركَّب يُبيَّن فيه الفعل (صنع) والمنتَج (نبيذ) صراحةً؛ محايد
        دلالياً بين الخمر الكحولية والنبيذ غير الكحولي. الأشمل مجالاً والأقل
        خصوصية اصطلاحية مقارنةً بنَبَّاذ وخَمَّار.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَانِعُ نَبِيذ"

    # ── مرشح المرحلة ١: نَبَّاذ ──
    - lemma: "نَبَّاذ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَت بصورة مباشرة في المعجم الوسيط (OCR) وفي نسخته لمجموعة المؤلفين بتعريف
        حرفي «صانع النبيذ»، وهو مطابق تماماً لمفهوم المجموعة. مشتق على وزن فَعَّال
        من الجذر نفسه الذي اشتُقَّ منه النبيذ (نبذ). يجتاز جميع المعايير الستة لجودة
        المصطلح: اطّراد، يُسر تداول، ملاءمة، إيثار التراثي، إيثار العربي، اشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختص بالنبيذ (المشروب المتخمَّر من التمر أو العنب أو غيره) دون حصر في الكحولي؛
        يدلّ على الصانع الحرفي تحديداً دون الجمع مع البيع.
      actions:
        - command: create_entry
          params:
            lemma: "نَبَّاذ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: خَمَّار ──
    - lemma: "خَمَّار"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَت في المعجم الكبير (OCR) بـ«صانع الخمر بائعها» وفي موسوعة قابوس بـ«صانع
        الخمر وبائعها». التعارض مع المعجم الوسيط جزئي (اقتصار لا نفي). الكلمة مُعرَّفة
        معجمياً وتجتاز اختبار الاشتقاق (فَعَّال للحِرَف) والاطّراد. الاشتراك مع معاني
        أخرى (خِمَار، خُمَار) لا يمنع القبول إذ يتمايز بالشكل. ينبّه المستخدم على
        دلالته المزدوجة (صنع+بيع).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يجمع بين الصنع والبيع معاً، وهو أكثر تخصصاً في الخمر العنبية الكحولية.
        يُستعمل في السياق الفقهي والتراثي أكثر من السياق التقني الحديث.
      actions:
        - command: create_entry
          params:
            lemma: "خَمَّار"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: عَصَّار — مرفوض ──
    - lemma: "عَصَّار"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر في المعاجم على عَصَّار (بالتشديد) بمعنى صانع النبيذ؛ والكلمة
        المُثبَتة في المعاجم هي عِصَار بمعنى «الحين» أو «الغبار الشديد». لا أدلة
        تدعم هذا الوزن بهذه الدلالة. مرفوض لعدم التثبيت المعجمي.

    # ── مرشح المرحلة ١: صَانِعُ الخَمْر — مرفوض ──
    - lemma: "صَانِعُ الخَمْر"
      source: stage1
      decision: removed
      decision_reason: >
        يرد التعبير في المورد الحديث كجملة تفسيرية لا كمصطلح مسكوك مستقل.
        يفشل اختبار السكّ المعجمي: يمكن إبدال «الخمر» بـ«النبيذ» وبقي وصفاً
        صحيحاً، مما يكشف أنه تركيب وصفي حر لا وحدة معجمية ثابتة. كذلك تتقاطع
        مع اللمّة الموجودة «صانع نبيذ» بصورة مفرطة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "شخص يصنع النبيذ"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية مباشرة للإنجليزية «someone who makes wine»،
        يفتقر إلى الجنس المنطقي الدقيق والفصل النوعي، ولا يميّز بين صنع النبيذ
        مهنةً واحترافاً وعمله عرَضاً. كذلك لا يشير إلى آلية الصنع (التخمير)
        التي هي القيد المميِّز.
    authored:
      - type: terminological
        text: >
          مَن يتَّخِذُ صُنْعَ النَّبِيذِ أو الخَمْرِ حِرفةً، بتخمير عصير العنب
          أو غيره من الثمار المعصورة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          حِرفيٌّ متخصص في إنتاج النبيذ؛ يقوم بانتقاء العنب أو الثمار، وعصرها،
          وتخمير العصير في أوعية مخصوصة مدةً محددة، ثم تصفية الناتج وتعبئته.
          وقد عُرِفت هذه الصناعة قديماً في الحضارات المحيطة بالجزيرة العربية.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَن يتَّخِذُ صُنْعَ النَّبِيذِ أو الخَمْرِ حِرفةً، بتخمير عصير العنب أو غيره من الثمار المعصورة"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "حِرفيٌّ متخصص في إنتاج النبيذ؛ يقوم بانتقاء العنب أو الثمار وعصرها وتخمير العصير في أوعية مخصوصة، ثم تصفية الناتج وتعبئته"

  examples:
    per_lemma:
      - lemma: "صَانِعُ نَبِيذ"
        examples:
          - text: "اشتُهرت تلك المنطقة بكثرة صُنَّاع النبيذ الذين يتوارثون أساليب التخمير جيلاً بعد جيل."
            type: usage

      - lemma: "نَبَّاذ"
        examples:
          - text: "كان النَّبَّاذُ يحرص على انتقاء أجود أصناف العنب قبل الشروع في تخميره."
            type: usage

      - lemma: "خَمَّار"
        examples:
          - text: "يُفرِّق الفقهاءُ في الأحكام بين الخَمَّارِ الذي يصنع الخمر ويبيعها وبين شاربها."
            type: usage

    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "اشتُهرت تلك المنطقة بكثرة صُنَّاع النبيذ الذين يتوارثون أساليب التخمير جيلاً بعد جيل."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كان النَّبَّاذُ يحرص على انتقاء أجود أصناف العنب قبل الشروع في تخميره."
      - command: add_sense_example
