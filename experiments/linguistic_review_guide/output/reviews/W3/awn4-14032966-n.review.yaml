# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14032966-n
# the state of being in operation — حالة كونه قيد التشغيل
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «دوران» معناها الأصلي الطواف حول الشيء أو الحركة الدائرية، ولا تدل ابتداءً على حالة التشغيل العامة"
      - "التعريف العربي «حالة كونه قيد التشغيل» شبه مطابق لتعريف الأب المباشر «حالة كونه سارياً أو قيد التشغيل» مما يضعف التمييز بينهما"
    observations: >
      المجموعة تمثل مفهوم حالة الاشتغال الفعلي لنظام أو آلة، وهي أخص من مفهوم التشغيل العام (الأب المباشر).
      اللمّة «اشتغال» مصدر افتعال من شغل، يُستعمل في السياق التقني الحديث بمعنى حالة كون النظام عاملاً
      مقابل حالة التوقف، وهو ملائم تماماً. أما «دوران» فمعناه الأصلي الحركة الدائرية وقد يُستعمل مجازاً
      في سياق الآلات الميكانيكية لكنه لا يدل على حالة التشغيل العامة.
  blind_candidates:
    - lemma: "اشْتِغَال"
      generation_method: ishtiqaq
      justification: "مصدر باب الافتعال من الجذر ش غ ل، يدل على حالة كون الشيء عاملاً ومنشغلاً بوظيفته، وهو نقيض التوقف والفراغ"
    - lemma: "دَوَرَان"
      generation_method: majaz
      justification: "أصله الطواف حول الشيء، استُعير في العربية الحديثة للدلالة على حالة عمل الآلات والمحركات"
    - lemma: "سَيْر"
      generation_method: ishtiqaq
      justification: "مصدر من سار يسير، يُستعمل في السياق التقني بمعنى عملية تنفيذ برنامج أو جريان نظام"
    - lemma: "إِعْمَال"
      generation_method: ishtiqaq
      justification: "مصدر إفعال من عمل، يدل على جعل الشيء عاملاً واستخدامه"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "اشْتِغَال"
      confirm:
        - text: "«تقال عن حالة نظام أو برمجية مقابل حالة استراحة أو توقف»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
        - text: "«خاصية برنامج أو عتاد تحرص على أن يكون اشتغال نظام ما مماثلا لاشتغال نظام آخر»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — مدخل: تمثيل"
        - text: "«مصطلح عام يشير إلى كيفية اشتغال واستعمال مختلف الأجهزة والأدوات»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — مدخل: مِنوال"
        - text: "«سرعة تشغيل الوقاتة أحد المعايير التي تشير إلى سرعة اشتغال النظام»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011) — مدخل: وقّاتة"
      expands:
        - text: "«الإشتغال: محاولة أسباب حصول المطلوب وممارسة ذلك ومعالجته»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          addition: "المعنى الكلاسيكي أعم: محاولة تحصيل المطلوب والمعالجة"

    - lemma: "دَوَرَان"
      contradicts:
        - text: "«الدَّوَرَانُ: أَن يحدث الحكم بحدوثه وينعدم بِعَدَمِهِ»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
          conflict: "المعنى الأصولي (ترتب الحكم على العلة) لا يتصل بحالة التشغيل"
        - text: "«الدوران: لغة، الطواف حول الشيء»"
          source: "التوقيف على مهمات التعاريف للمناوي (ت 1622م)"
          conflict: "المعنى اللغوي هو الحركة الدائرية لا حالة التشغيل"
        - text: "«حركة دائرية، حركة نقطة أو الجسم حول محور الدوران»"
          source: "مسرد الطاقة المتجددة — أربتيرم"
          conflict: "المعنى التقني هو الدوران الفيزيائي (rotation) لا حالة التشغيل"
      expands:
        - text: "«دوران سلس» = concentric running"
          source: "مسرد هندسة وتكنولوجيا السيارات — أربتيرم"
          addition: "يُستعمل في سياق السيارات بمعنى سلاسة الدوران الميكانيكي"

    - lemma: "سَيْر"
      confirm:
        - text: "«عملية تنفيذ برنامج أو القيام بوظيفة معينة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
      contradicts:
        - text: "«السَّيْرُ: الذَّهابُ»"
          source: "القاموس المحيط للفيروزآبادي (ت 1414م)"
          conflict: "المعنى الأصلي هو الذهاب والمشي لا حالة التشغيل"
      expands:
        - text: "«سير بلا حمل» = empty running"
          source: "موسوعة الكهرباء (IEC 60050)"
          addition: "يُستعمل في السياق الكهربائي بمعنى تشغيل بدون حمولة"

    - lemma: "إِعْمَال"
      contradicts:
        - text: "«الإعمال: الاضطراب في العمل، وهو أبلغ من العمل»"
          source: "كتاب التعريفات للشريف الجرجاني (ت 1413م)"
          conflict: "المعنى الكلاسيكي هو الاضطراب والمبالغة في العمل لا مجرد حالة التشغيل"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "اشْتِغَال"
      decision: confirmed
      decision_reason: >
        أدلة معجمية حديثة قوية تؤكد استعمال «اشتغال» بمعنى حالة كون النظام عاملاً مقابل التوقف.
        المعجم الموحد لتقانة المعلومات يعرّفه صراحةً بهذا المعنى. المصدر على وزن افتعال
        من الجذر ش غ ل يدل على خلاف الفراغ (كما في مقاييس اللغة)، وهو ملائم دلالياً وصرفياً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على حالة كون النظام أو الآلة في وضع العمل الفعلي مقابل التوقف أو الاستراحة، ويُستعمل في السياقين التقني والعام"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اشْتِغَال"

    - lemma: "دَوَرَان"
      decision: removed
      decision_reason: >
        جميع الأدلة المعجمية الكلاسيكية والحديثة تدل على أن «دوران» يعني الطواف حول الشيء
        (الحركة الدائرية) أو مصطلحاً أصولياً (ترتب الحكم على العلة). في المعاجم التقنية الحديثة
        يُترجم بـ rotation أو circulation أو spin، ولا يُستعمل بمعنى «حالة التشغيل» العامة.
        إبقاؤه في هذه المجموعة يُحدث تشويشاً دلالياً.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "سَيْر"
      source: stage1
      decision: removed
      decision_reason: >
        معناه الأصلي الذهاب والمُضي، وإن وُجد استعمال تقني محدود بمعنى «عملية تنفيذ برنامج»
        إلا أنه يدل على العملية لا على الحالة، فضلاً عن أنه لفظ مشترك كثير المعاني
        (الجلد، السيرة، المشي) مما يُضعف صلاحيته مصطلحاً لهذا المفهوم.
      evidence_assessment:
        case: mixed

    - lemma: "إِعْمَال"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى الكلاسيكي عند الجرجاني هو «الاضطراب في العمل» وهو أبلغ من العمل،
        مما يجعله غير ملائم للدلالة على حالة التشغيل الهادئة المستقرة.
        كما أن استعماله المعاصر الشائع هو في سياق «إعمال العقل/الفكر» لا في سياق الآلات.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "حالة كونه قيد التشغيل"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي شبه مطابق لتعريف الأب المباشر «حالة كونه سارياً أو قيد التشغيل»
        ولا يميّز هذه المجموعة بوصفها أخص. يحتاج إلى تدقيق يبرز الفرق: هذا المفهوم
        يخص الاشتغال الفعلي (النظام يعمل الآن) لا مجرد الصلاحية للعمل.
    authored:
      - type: terminological
        text: "حالةُ النظام أو الآلة حين يكون في وضع العمل الفعلي، مقابل التوقف أو الاستراحة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "كَوْنُ الشيء مُشتغِلاً يؤدّي وظيفته"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالةُ النظام أو الآلة حين يكون في وضع العمل الفعلي، مقابل التوقف أو الاستراحة"

  examples:
    per_lemma:
      - lemma: "اشْتِغَال"
        examples:
          - text: "أكّد المهندسون أنّ اشتغال المحطة بكامل طاقتها يتطلّب صيانة دورية للمعدّات."
            type: usage
          - text: "يُراقَب اشتغال الخوادم على مدار الساعة لضمان استمرارية الخدمة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أكّد المهندسون أنّ اشتغال المحطة بكامل طاقتها يتطلّب صيانة دورية للمعدّات."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُراقَب اشتغال الخوادم على مدار الساعة لضمان استمرارية الخدمة."


