# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id : awn4-10720489-n
# ili        : i93596
# pos        : n
# lemmas_en  : tenant farmer
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "اللمة الوحيدة (مزارع مستأجر) مكتوبة بدون تشكيل كامل"
      - "لا يوجد إلا لمة واحدة؛ المجموعة تفتقر إلى مرادفات كلاسيكية كالأكار والإريس مع الإشارة إلى الفروق الدقيقة"
      - "التعريف الحالي يصف الإيجار عموماً دون تحديد نوعه (نقدي أم حصة من المحصول)"
    observations: >
      المجموعة تصف مفهوماً زراعياً معروفاً يقابله التراث العربي بمصطلح الأكار والإريس والخمّاس، غير أن هذه
      الألفاظ التراثية تتباين في دلالتها: فالأكار فلاح عام، والخمّاس من يعمل بخمس المحصول (مشاركة
      لا إيجاراً)، والإريس شامية المصدر. أما مصطلح «مزارع مستأجر» فهو المصطلح المعتمد في المعاجم
      الحديثة (المورد الحديث، المكنز الزراعي AGROVOC، المسرد الجغرافي ALECSO) لترجمة «tenant farmer».
      المجموعة صحيحة في جوهرها لكنها تستدعي تشكيل اللمة وتدقيق التعريف.

  # أ. اللمات المرشحة (توليد أعمى — قبل الاطلاع على اللمات الموجودة)
  blind_candidates:
    - lemma: "خَمَّاس"
      generation_method: majaz
      justification: >
        من (خ م س)؛ لفظ تراثي أُطلق على من يعمل في أرض غيره مقابل نسبة من المحصول. المشابهة
        الوظيفية مع المزارع المستأجر واضحة (كلاهما يزرع أرضاً لا يملكها)، مع إحياء لفظ قديم
        بدلاً من اقتراض أو تركيب جديد.

    - lemma: "أَكَّار"
      generation_method: majaz
      justification: >
        من (أ ك ر)؛ لفظ فصيح كلاسيكي يعني الفلاح الحراث. وردت في شعر الأخطل وفي المعجم الكبير
        بمعنى المزارع الذي يحرث أرض غيره، مما يجعله مرشحاً طبيعياً بمنهج إحياء اللفظ الميت.

    - lemma: "مُزَارِعٌ مُكْتَرٍ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (wasfi): مزارع (جنس قريب) + مُكتَرٍ (اسم فاعل من اكترى = استأجر بالكراء)؛
        يصف بدقة من يكتري (يستأجر) أرضاً للزراعة، ويتميز عن مُستأجر باستعمال جذر عربي خالص (كرى).

    - lemma: "فَلَّاحٌ مُسْتَأجِرٌ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (wasfi): فلاح (جنس قريب، من فلح الأرض) + مستأجر (اسم فاعل من استأجر)؛
        يستعمل «فلاح» البديل العربي الأكثر تداولاً من «مزارع» في كثير من البيئات اللغوية العربية.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  per_lemma:

    # ─── اللمة الموجودة ───────────────────────────────────────
    - lemma: "مزارع مستأجر"
      confirm:
        - text: "«المُزارِع المستأجِر: مُزارع يعمل على أرض غيره لقاء إعطائه صاحبَ الأرض أجرًا نقديًّا أو حصّة من المحصول.»"
          source: "المورد الحديث (2008) — ترجمة tenant farmer"
        - text: "«المزارعين المستأجرين»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC) — ترجمة tenant farmers"
        - text: "«مُزَارِع مستأجِر» — ترجمة: tenant [Geography and History]"
          source: "مسرد الجغرافيا والتاريخ، الألسكو (ArabTerm)"

    # ─── المرشح ١: خماس ───────────────────────────────────────
    - lemma: "خَمَّاس"
      contradicts:
        - text: "«خَمَّاس: من (خ م س) الذي يعمل في أرض غيره مقابل خمس المحاصيل.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: >
            الخمّاس يعمل مقابل حصة محددة (الخُمس) من المحصول، وهو نمط المشاركة الزراعية
            (sharecropping) لا الاستئجار (tenancy) الذي يقوم على أجر نقدي أو شرط ثابت.
            فالفرق جوهري: المستأجر ملتزم بمبلغ أو حصة متفق عليها مسبقاً، والخمّاس ملتزم
            بنسبة ثابتة (1/5) من الناتج الفعلي. المعنيان مختلفان تصنيفياً في المصطلحية الزراعية.
        - text: "«خُماس: يقال: جاءُوا خُماس: خَمْسة خَمْسة.»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            المدخل الرئيسي في المعجم الوسيط للفظ «خُماس» لا يذكر المعنى الزراعي أصلاً،
            مما يشير إلى أن هذه الدلالة ليست المعنى الأوليّ للكلمة في الفصحى المعيارية.

    # ─── المرشح ٢: أكار ───────────────────────────────────────
    - lemma: "أَكَّار"
      expands:
        - text: "«الأَكَّارُ: فلاح الحرّاث والزراع.»"
          source: "المعجم الكبير (OCR) — مجمع اللغة العربية"
          addition: >
            الأكار لفظ عام للمزارع الحراث، لا يختص بمن يستأجر الأرض؛
            يصلح للمجموعة الأعلى (فلاح/مزارع) أكثر من هذه المجموعة الفرعية.
        - text: "«الأكار: الحراث (ج) أكرة.»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          addition: "جمعه أكرة — معلومة صرفية مفيدة."
        - text: "«الهمزة والكاف والراء أصل واحد وهو الحفر... وبذلك سُمِّيَ الأكَّار. قال الأخطل: عبداً لعِلجٍ من الحصنين أكّار.»"
          source: "مقاييس اللغة (ابن فارس) — dictionary_id=151"
          addition: >
            اشتقاق الأكار من الحفر (أكرة = نقرة في الصفا)، وشاهد الأخطل يثبت استعماله
            للمزارع التابع لسيد أو صاحب أرض، وهو قريب من مفهوم المزارع المستأجر.

    # ─── المرشح ٣: مزارع مكتر ────────────────────────────────
    - lemma: "مُزَارِعٌ مُكْتَرٍ"
      evidence_status: "no_material_found"

    # ─── المرشح ٤: فلاح مستأجر ───────────────────────────────
    - lemma: "فَلَّاحٌ مُسْتَأجِرٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    # ─── اللمة الموجودة ───────────────────────────────────────
    - lemma: "مزارع مستأجر"
      decision: confirmed
      decision_reason: >
        اللمة موثقة في ثلاثة مصادر معجمية حديثة متخصصة (المورد الحديث، AGROVOC، مسرد الألسكو)
        بوصفها الترجمة المعتمدة لـ «tenant farmer». التركيب واضح دلالياً ومطّرد في العربية الحديثة.
        تستدعي إضافة تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      loan_check:
        lexical_borrowing: "كلا المكونين عربيان خالصان (زرع، أجر)"
        literal_translation: "الترجمة الحرفية صحيحة ومطابقة للمدلول العلمي"
        calque: "مقبول — التركيب الوصفي طبيعي في العربية"
      quality_gate:
        consistency: "مطّرد في المعاجم الحديثة"
        ease_of_use: "سهل التداول والاشتقاق منه (المزارعون المستأجرون)"
        fitness: "ملائم للسياقين الزراعي والقانوني"
        classical_preference: "الأكار أعرق، لكنه أعم دلالة"
        arabic_preference: "عربي خالص"
        derivability: "قابل للاشتقاق (مزارعون مستأجرون، استئجار زراعي)"
      morphological_check: >
        مُزَارِعٌ: اسم فاعل على وزن مُفَاعِل من الثلاثي المزيد (زارَعَ)، صيغة مناسبة لصاحب
        المهنة. مُسْتَأجِرٌ: اسم فاعل على وزن مُسْتَفْعِل من استأجر، يحمل معنى طلب الاستئجار
        وهو دقيق في وصف الطرف المستأجِر (لا المُؤجِّر).
      nuance_differentiation: >
        اللمة الوحيدة المؤكدة في هذه المجموعة؛ تتميز عن مصطلحات المجموعة الأم (فلاح، مزارع)
        بتقييد الزارع بشرط الاستئجار، وعن الخمّاس بكون المقابل إيجاراً ثابتاً لا حصةً من المحصول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُزَارِعٌ مُسْتَأجِرٌ"

    # ─── المرشح ١ (المرحلة ١) ────────────────────────────────
    - lemma: "خَمَّاس"
      source: stage1
      decision: removed
      decision_reason: >
        تناقض معجمي حاسم: الخمّاس يعمل بخُمس المحصول (مشاركة زراعية = sharecropping)،
        وليس باستئجار ثابت (tenancy). الفرق ليس نقدياً فحسب بل مفهومي وتصنيفي؛
        ففي شبكة WordNet الإنجليزية يُعدّ sharecropper و tenant farmer مفهومين مستقلين.
        إدراج خمّاس هنا يوجد التباساً دلالياً مضراً.
      evidence_assessment:
        case: contradicts_only

    # ─── المرشح ٢ (المرحلة ١) ────────────────────────────────
    - lemma: "أَكَّار"
      source: stage1
      decision: removed
      decision_reason: >
        الأكار مصطلح تراثي عريق يعني الفلاح الحراث عموماً دون تقييد بالاستئجار.
        الأدلة المعجمية تُثبته بمعنى «فلاح الحراث والزراع» (المعجم الكبير) و«الحراث» (الوسيط)،
        وهو يرادف المجموعة الأم (awn4-10098586-n: فلاح/مزارع) لا هذه المجموعة الفرعية.
        إدراجه هنا يُفضي إلى تضمين خاطئ (مزارع مستأجر تحت مزارع عام).
      evidence_assessment:
        case: mixed

    # ─── المرشح ٣ (المرحلة ١) ────────────────────────────────
    - lemma: "مُزَارِعٌ مُكْتَرٍ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شاهد معجمي. وإن صحّ التركيب اشتقاقياً (اكترى = استأجر بالكراء)، فهو
        مكرر دلالياً للمصطلح الموجود (مزارع مستأجر) دون أن يضيف فرقاً دلالياً قابلاً للتوثيق.
      evidence_assessment:
        case: no_material

    # ─── المرشح ٤ (المرحلة ١) ────────────────────────────────
    - lemma: "فَلَّاحٌ مُسْتَأجِرٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي مباشر. التركيب مكرر للمفهوم ذاته مع استبدال «مزارع» بـ«فلاح»؛
        والمعاجم الحديثة المتخصصة (المورد، AGROVOC) اختارت «مزارع» بدلاً من «فلاح»
        في سياق الترجمة التقنية لـ tenant farmer. إدراجه يُضخّم المجموعة بصورة اصطناعية.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "مزارع يعمل في أرض يملكها شخص آخر مقابل إيجار"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي دقيق في جوهره لكنه مختزل؛ يذكر «إيجاراً» دون تحديد طبيعته.
        المورد الحديث (الأوثق في هذا الباب) يصرّح بأن المقابل قد يكون «أجراً نقديًّا أو حصةً
        من المحصول»، وهذه دقة جوهرية تميّز tenant farmer عن sharecropper الذي يلتزم بحصة
        فقط. كذلك «يملكها شخص آخر» يمكن صياغتها بشكل أوضح صرفياً.
    authored:
      - type: terminological
        text: "مُزَارِعٌ يَعْمَلُ فِي أَرْضٍ يَمْلِكُهَا غَيْرُهُ مُقَابِلَ أَجْرٍ نَقْدِيٍّ أَوْ حِصَّةٍ مُحَدَّدَةٍ مِنَ الْمَحْصُولِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10720489-n"
          definition_index: 0
          text: "مُزَارِعٌ يَعْمَلُ فِي أَرْضٍ يَمْلِكُهَا غَيْرُهُ مُقَابِلَ أَجْرٍ نَقْدِيٍّ أَوْ حِصَّةٍ مُحَدَّدَةٍ مِنَ الْمَحْصُولِ"

  examples:
    per_lemma:
      - lemma: "مُزَارِعٌ مُسْتَأجِرٌ"
        examples:
          - text: "اشتكى الْمُزَارِعُ الْمُسْتَأجِرُ مِنِ ارْتِفَاعِ إِيجَارِ الْأَرْضِ الَّذِي يُثْقِلُ كَاهِلَهُ فِي مَوَاسِمِ الْجَفَافِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اشتكى الْمُزَارِعُ الْمُسْتَأجِرُ مِنِ ارْتِفَاعِ إِيجَارِ الْأَرْضِ الَّذِي يُثْقِلُ كَاهِلَهُ فِي مَوَاسِمِ الْجَفَافِ."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
stage5_enrichment:

  per_entry:
    # مدخل مركب (MWE) — جذران
    - lemma: "مُزَارِعٌ مُسْتَأجِرٌ"
      entry_id: "{auto}"
      roots:
        - word: "مزارع"
          root: "زرع"
          maqayis_quote: "«الزَّاءُ وَالرَّاءُ وَالْعَيْنُ أَصْلٌ يَدُلُّ عَلَى تَنْمِيَةِ الشَّيْءِ. فَالزَّرْعُ مَعْرُوفٌ، وَمَكَانُهُ الْمُزْدَرَعُ. وَقَالَ الْخَلِيلُ: أَصْلُ الزَّرْعِ التَّنْمِيَةُ»"
        - word: "مستأجر"
          root: "أجر"
          maqayis_quote: "«الْهَمْزَةُ وَالْجِيمُ وَالرَّاءُ أَصْلَانِ... فَالْأَوَّلُ الْكِرَاءُ عَلَى الْعَمَلِ، فَالْأَجْرُ وَالْأُجْرَةُ. وَكَانَ الْخَلِيلُ يَقُولُ: الْأَجْرُ جَزَاءُ الْعَمَلِ... وَالْأَجِيرُ: الْمُسْتَأْجَرُ»"

  per_sense:
