      sense_id: "{auto}"
      nuance: >
        اللمة الوحيدة في المجموعة؛ تتميز عن الأعلى منها (فلاح، مزارع) بتقييد العلاقة بعقد
        استئجار، وعن الخمّاس بأن المقابل إيجار ثابت (نقدي أو بحصة محددة) لا حصة من المحصول
        بعد جنيه. كذلك تتميز عن الأجير الزراعي (farmhand) بأن المزارع المستأجر مسؤول عن
        إدارة الأرض بشكل مستقل، لا عامل بأجر يومي.
      mwe: true

  synset:
