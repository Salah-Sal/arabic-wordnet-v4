stage1_review:
  assessment:
    concerns:
      - "اللمّة «شقاوه» مكتوبة بالهاء بدل التاء المربوطة — خطأ إملائي صريح"
      - "«سلوك شقي» عبارة وصفية حرّة وليست وحدة معجمية ثابتة — تفشل في اختبار السكّ (يمكن قول: تصرّف شقي، سلوك مشاكس)"
      - "الشَّقَاوَة في المعاجم الكلاسيكية تعني الشَّقَاء (التعاسة وسوء الحال)، لا شقاوة الأطفال؛ الاستعمال الحديث وسّع الدلالة"
      - "علاقة الاشتمال مع «سذاجة/قلة خبرة» مشكوك فيها — الشقاوة ليست نوعاً من السذاجة بالضرورة"
    observations: "المجموعة تحاول تمثيل مفهوم «شقاوة الأطفال» وهو حالة التصرف بجموح وعدم تهذيب. المفهوم حيّ في الثقافة العربية لكن التعبير عنه اصطلاحياً يتراوح بين الاستعمال العامّي لـ«شقاوة» والفصيح «شيطنة» و«مشاكسة». يحتاج التعريف إلى إعادة صياغة بأسلوب معجمي."

  blind_candidates:
    - lemma: "شَيْطَنَة"
      generation_method: ishtiqaq
      justification: "مصدر شَيْطَنَ (صار كالشيطان وفعل فعله)، يُستعمل في العربية المعاصرة للدلالة على عبث الأطفال ومشاغباتهم، على وزن فَعْلَنَة"
    - lemma: "مُشَاكَسَة"
      generation_method: ishtiqaq
      justification: "مصدر شَاكَسَ على وزن مُفَاعَلَة، يدلّ على المعاندة وصعوبة الانقياد، يناسب وصف حالة الطفل الجامح غير المهذّب"
    - lemma: "شَغَب"
      generation_method: ishtiqaq
      justification: "مصدر من شَغَبَ يدلّ على تهييج الشرّ والإزعاج، مناسب لوصف سلوك الطفل المزعج غير المنضبط"
    - lemma: "عَبَث"
      generation_method: ishtiqaq
      justification: "مصدر عَبَثَ يدلّ على اللعب بما لا يعني والفعل بلا فائدة، يمثّل جانب اللامبالاة في سلوك الطفل الشقي"


