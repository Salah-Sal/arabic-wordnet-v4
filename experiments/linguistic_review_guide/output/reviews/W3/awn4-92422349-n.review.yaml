        - text: "«الشِّينُ وَالْقَافُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ يَدُلُّ عَلَى الْمُعَانَاةِ وَخِلَافِ السُّهُولَةِ وَالسَّعَادَةِ. وَالشِّقْوَةُ: خِلَافُ السَّعَادَةِ. وَرَجُلٌ شَقِيٌّ بَيِّنُ الشَّقَاءِ وَالشِّقْوَةِ وَالشَّقَاوَةِ.»"
          source: "مقاييس اللغة لابن فارس"
