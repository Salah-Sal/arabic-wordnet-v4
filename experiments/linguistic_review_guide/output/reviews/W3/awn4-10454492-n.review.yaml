# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'مبتكر' موجودة في المجموعة الأمّ (awn4-10403515-n) أيضاً بصيغة مُبْتَكِر، مما يُنشئ تداخلاً دلالياً بين المستوى الاشتمالي والمستوى الخاص"
      - "فعل 'يساعد في' في التعريف العربي ضعيف؛ الرائد لا يُساعد فحسب بل هو المبادر الحقيقي الذي يفتح الآفاق"
      - "جميع اللمّات الثلاث خالية من التشكيل الكامل في السجلّ الحالي"
      - "سبّاق أصل دلالته التسابق في الميدان (race)، وليس الريادة الفكرية مباشرةً؛ يحتاج توثيق الإزاحة الدلالية"
    observations: >
      المجموعة تعالج مفهوم الإنسان الرائد في مجالٍ بكر — من يفتح طريقاً لم يسلكه أحد قبله في البحث أو التقنية أو الفن.
      الجذر الأوفى بالمعنى هو رود (رَادَ يَرُودُ) الذي يحمل معنى التقدّم الاستطلاعي وتمهيد الأرض لمن يأتي بعد.
      يُلاحَظ أن لمّة سبّاق انزاحت دلالياً من الغلَبة في السباق إلى الأسبقية في الخير، وهو نقل مقبول موثَّق في معجم قابوس.
      في المقابل، مبتكر مصطلح أحدث غير موثَّق في معاجم التراث كاسم مفرد للشخص.

  blind_candidates:
    - lemma: "رَائِد"
      generation_method: majaz
      justification: >
        من رَادَ يَرُودُ: تقدَّم القوم يستطلع لهم الكلأ والطريق.
        المجاز قائم على المشابهة الوظيفية: المستطلع الذي يتقدّم الجماعة
        يشابه في وظيفته من يسبق إلى مجال فكري أو علمي يمهّد آفاقه للآخرين.
        الإزاحة موثَّقة في المعجم الكبير: "من يقدم غير مسبوق على عمل فيمهد الطريق لمن بعده".

    - lemma: "مُمَهِّد"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من مَهَّدَ (وزن فَعَّل)، يحمل معنى التسوية والتهيئة.
        المقاييس: "كلمة تدلّ على توطئة وتسهيل للشيء".
        المُمَهِّد هو من يُهيّئ الأرض المعرفية لمن يأتي بعده في الميدان الجديد.

    - lemma: "طَلِيعِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى الطليعة (مقدّمة الجيش أو القوم)؛ الطليعيّ هو الكائن في مقدّمة
        الحركة الفكرية أو الفنية أو التقنية، قبل أن تسلك الجماهير ذلك الطريق.
        وُثِّق استعماله في مصطلحيات المورد والاتصالات بمعنى avant-garde / precursory.

    - lemma: "سَبَّاق"
      generation_method: ishtiqaq
      justification: >
        على وزن فَعَّال (مبالغة) من سَبَقَ يَسْبِقُ. المقاييس: "يدلّ على التقديم".
        الوزن يُفيد كثرة الفعل وثبوته: السبّاق من جُبِل على التقدّم والمبادرة.
        موثَّق في موسوعة قابوس: "الكثير التقدم في الخير".


