        المعجم الكبير يُثبّت صراحةً المعنى المطلوب: "من يقدم غير مسبوق على عمل
        فيمهد الطريق لمن بعده". الجذر رود، الوزن فَاعِل (اسم فاعل)، الدلالة مطابقة.
        غير أن اللمّة تفتقر إلى التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        رَائِد يُركِّز على بُعد التقدُّم الاستطلاعي وفتح الطريق لمن يأتي بعده؛
        الرائد يتقدَّم القوم في الأرض المجهولة ويعود بالخبر، مما يجعل دلالته
        أقرب إلى "من يفتح الآفاق" لا "من يسبق فحسب".
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَائِد"

    - lemma: "سبّاق"
      decision: confirmed
      decision_reason: >
        لمّة كلاسيكية موثَّقة في المعجمين الكبير والوسيط بمعنى "الكثير السبق".
        موسوعة قابوس تُسوِّغ الدلالة المطلوبة: "الكثير التقدم في الخير".
        الوزن فَعَّال يحمل معنى المبالغة الثابتة — دلالة ملائمة لمن يتميَّز
        دائماً بأسبقيته. الإزاحة الدلالية من سباق الميدان إلى الريادة الفكرية
        موثَّقة في الشاهد الشعري (سَبَّاقُ غاياتِ مَجْدٍ).
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        سَبَّاق يُبرز صفة المبادرة المتكرِّرة والثابتة (وزن مبالغة) بمعنى:
        "من ديدنه السبق" في الأعمال والمبادرات؛ بينما رَائِد يُركّز على الفتح
        الأوّل لطريق مجهول. السَّبَّاق قد يتقدَّم في مجالٍ موجود أصلاً لكنه أسرع،
        فيما الرائد يخطو في فضاء لم يطأه أحد بعد.
