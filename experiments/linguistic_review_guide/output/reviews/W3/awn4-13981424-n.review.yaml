# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-13981424-n
# inherence / inherency — تأصل، رسوخ
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان (تأصل، رسوخ) تفتقران إلى التشكيل الكامل"
      - "تأصل مصدر الفعل تَأَصَّلَ ويدلّ على صيرورة (صار ذا أصل) أكثر من دلالته على حالة ثابتة ملازمة"
      - "رسوخ يدلّ على الثبات العامّ والتمكّن، وليس خاصًّا بمعنى الملازمة الذاتية (inherence)"
      - "غياب مصطلح مُلَازَمَة المُثبت في معاجم الألكسو مقابل inherence"
    observations: >
      المجموعة تصف مفهومًا فلسفيًّا دقيقًا: حالة كون الشيء سمةً ذاتيّةً ملازمة لا تنفكّ عن موصوفها.
      التعريف الإنجليزي يميّز بين inherence (الحلول في الشيء) والثبوت العامّ.
      اللمّتان الحاليتان تقتربان من المعنى لكنّهما تغطّيان الثبوت والتمكّن دون التخصيص
      في معنى الملازمة الذاتية. ينبغي النظر في إضافة لمّة أدقّ من التراث الفلسفي العربي.

  blind_candidates:
    - lemma: "مُلَازَمَة"
      generation_method: ishtiqaq
      justification: >
        مصدر مِن لَازَمَ على وزن مُفَاعَلَة، يدلّ على امتناع انفكاك الشيء عن الشيء، وهو
        المعنى الأصيل للملازمة في التراث الفلسفي العربي. الجذر ل ز م يدلّ على مصاحبة الشيء
        بالشيء دائمًا كما في مقاييس اللغة.
    - lemma: "لُزُوم"
      generation_method: ishtiqaq
      justification: >
        مصدر لَزِمَ على وزن فُعُول، يدلّ على ثبوت الشيء ولزومه. استُعمل في التراث المنطقي
        العربي بمعنى الملازمة والتلازم. أقلّ تخصيصًا من مُلَازَمَة لكنّه وارد.
    - lemma: "حُلُول"
      generation_method: majaz
      justification: >
        من حَلَّ يَحُلُّ بمعنى نَزَلَ في الشيء واستقرّ فيه. يُستعمل في الفلسفة الإسلامية
        بمعنى حلول الصفة في الموصوف. فيه إزاحة دلالية من النزول المادي إلى الثبوت المعنوي.
    - lemma: "صُلْبِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من صُلْبِيّ (المتضمَّن في صُلب الشيء)، كما ورد في المورد الحديث مقابل
        inherent. يدلّ على كون الشيء من صلب طبيعة الموصوف لا عَرَضًا فيه.


stage2_evidence:
  per_lemma:
    - lemma: "تَأَصُّل"
      confirm:
        - text: "«صار ذا أصْل»"
          source: "المعجم الكبير"
        - text: "«(تأصل) أصل»"
          source: "المعجم الوسيط (هوراماني)"
      expands:
        - text: "«(1) تجذُّر؛ تأصُّل؛ ترسُّخ (2) جذور»"
          source: "المورد الحديث (rootage)"
          addition: "يُصنَّف ضمن سلسلة مترادفات التجذّر والترسّخ، مما يؤكّد أنّه مصدر صيرورة"
        - text: "«متجذِّر؛ متأصّل؛ مترسِّخ»"
          source: "المورد الحديث (rooted)"
          addition: "اسم الفاعل متأصّل يُستعمل صفةً بمعنى inherent/rooted"

    - lemma: "رُسُوخ"
      confirm:
        - text: "«الرسوخ: الثبات والتمكن. والراسخ في العلم المتحقق الذي لا يعترضه شبهة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«(1) «أ» رسوخ؛ ثبات. «ب» سرعة. «ج» ثبات اللون. «د» مقاومة السُّمِّيّة»"
          source: "المورد الحديث (fastness)"
          addition: "رسوخ يتوزّع على معانٍ عدّة: ثبات، صلابة، استقرار — وليس خاصًّا بالملازمة"
        - text: "«(1) استقرار؛ ثبات؛ رسوخ»"
          source: "المورد الحديث (stability)"
          addition: "يُقرَن رسوخ بالثبات والاستقرار لا بالملازمة الذاتية"

    - lemma: "مُلَازَمَة"
      confirm:
        - text: "«ملازمة»"
          source: "مسرد الفلسفة وعلم النفس — ألكسو (مقابل inherence)"
        - text: "«ملازمة؛ تَضَمُّنٌ صُلْبيّ»"
          source: "المورد الحديث (مقابل inherence|inherency)"
        - text: "«الملازمة: لغةً امتناع انفكاك الشيء عن الشيء»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الملازمة: لغة: امتناع انفكاك شيء عن شيء»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«المُلازَمةُ: هِيَ كَون الحكم مقتضيا لآخر. اللُّزومُ والتَّلازُمُ: كَذَلِك»"
          source: "معجم مقاليد العلوم للسيوطي"
      expands:
        - text: "«صفة السمات التي تحدد المميزات النوعية لكل كلمة في استقلال عن السياق»"
          source: "المعجم الموحد لمصطلحات اللسانيات (مقابل Inherent)"
          addition: "ملازم يُستعمل صفةً بمعنى inherent في اللسانيات أيضًا"

    - lemma: "لُزُوم"
      expands:
        - text: "«اللُّزومُ والتَّلازُمُ: كَذَلِك [أي كالملازمة]»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "اللزوم مرادف للملازمة في الاصطلاح المنطقي"
        - text: "«الملازمة: لغةً امتناع انفكاك الشيء عن الشيء، واللزوم والتلازم بمعناه»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "اللزوم والملازمة بمعنى واحد عند الجرجاني"

    - lemma: "حُلُول"
      evidence_status: "no_material_found"

    - lemma: "صُلْبِيَّة"
      expands:
        - text: "«(1) ملازم؛ متأصل؛ صُلْبِيّ: مُتضمَّن في صُلْب الشيء أو طبيعته الأساسيّة»"
          source: "المورد الحديث (مقابل inherent)"
          addition: "صُلْبيّ صفة مُستحدَثة في المورد لكنّ المصدر الصناعي صُلْبيَّة غير مُثبت معجميًّا"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَأَصُّل"
      decision: confirmed
      decision_reason: >
        تَأَصُّل مصدر تَأَصَّلَ (= صار ذا أصل)، يدلّ على حالة التجذّر والرسوخ. وإن كان
        أقرب إلى معنى الصيرورة منه إلى الملازمة الذاتية، فإنّه مُستعمل في السياق العربي
        بمعنى كون الشيء متأصّلًا ثابتًا. يُبقى عليه مع تصحيح التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على البُعد الزمني والتاريخي: شيء صار أصيلًا بالتجذّر والقِدَم، بخلاف
        الملازمة التي تدلّ على عدم الانفكاك البنيوي، والرسوخ الذي يدلّ على الثبات والتمكّن.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَأَصُّل"

    - lemma: "رُسُوخ"
      decision: confirmed
      decision_reason: >
        رُسُوخ مصدر رَسَخَ، يدلّ على الثبات والتمكّن كما في التوقيف للمناوي. معناه عامّ
        يشمل ثبوت الصفات، وهو مناسب ضمن المجموعة بوصفه مرادفًا جزئيًّا. يُصحَّح تشكيله.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يدلّ على الثبات والتمكّن العامّ (firmness) دون تخصيص في الملازمة الذاتية.
        أعمّ من مُلَازَمَة وأقرب إلى stability/firmness.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُسُوخ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُلَازَمَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُلَازَمَة مُثبتة في مسرد ألكسو للفلسفة وعلم النفس مقابل inherence تحديدًا،
        وفي المورد الحديث مقابل inherence|inherency، وفي كتاب التعريفات للجرجاني
        والتوقيف للمناوي ومقاليد العلوم للسيوطي بمعنى امتناع انفكاك الشيء عن الشيء.
        هذا أدقّ مصطلح عربي للمفهوم المقصود.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        أدقّ اللمّات دلالةً على المفهوم: امتناع انفكاك الصفة عن الموصوف. مصطلح فلسفي
        مُثبت يدلّ على العلاقة البنيوية بين الصفة وحاملها، بخلاف تأصّل (صيرورة) ورسوخ (ثبات عامّ).
      actions:
        - command: create_entry
          params:
            lemma: "مُلَازَمَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "لُزُوم"
      source: stage1
      decision: removed
      decision_reason: >
        لُزُوم مرادف للملازمة في الاصطلاح المنطقي لكنّه أشدّ عمومًا ويشترك مع معانٍ أخرى
        (اللزوم بمعنى الوجوب، لزوم البيت). إضافة مُلَازَمَة أدقّ وأكفى، ولا حاجة لتكرار
        مشتقّات الجذر نفسه.

    - lemma: "حُلُول"
      source: stage1
      decision: removed
      decision_reason: >
        لم تُوجَد أدلة معجمية تدعم استعمال حُلُول بمعنى inherence. المصطلح مشحون
        بمعنى كلامي خاصّ (حلول الذات الإلهية) مما يُوقع في اللبس.

    - lemma: "صُلْبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        صُلْبِيّ صفة مستحدثة في المورد الحديث لكنّ المصدر الصناعي صُلْبِيَّة
        غير مُثبت في أيّ معجم. لا يُقبل مصطلح لم يُسكّ معجميًّا.


stage4_content:
