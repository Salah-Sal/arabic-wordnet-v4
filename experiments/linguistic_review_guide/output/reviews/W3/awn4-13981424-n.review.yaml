        التعريف الحالي ترجمة حرفية عن الإنجليزية (حالة كونه...) وليس بأسلوب المعجم العربي.
        يفتقر إلى الجنس القريب والفصل النوعي، ولا يُبيّن الفرق بين الملازمة والثبات العامّ.
    authored:
      - type: terminological
        text: "صفةُ ثبوتِ الشيءِ في ذاتِ غيرِه بحيث لا ينفكّ عنه ولا يُفارقه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "اللُّزُومُ الذّاتيُّ؛ كَوْنُ السِّمَةِ مُلازِمَةً لِمَوْصُوفِها لا تَقْبَلُ الانْفِكاكَ عَنْه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
