# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id : awn4-11027616-n
# ili       : i95303
# pos       : n
# المراجع   : نظام المراجعة الآلي v2
# التاريخ   : 2026-03-21
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل (غوديير، تشارلز غوديير بلا ضبط)"
      - "التعريف الحالي يستخدم حرف الجر (ل) مع المفعول بصورة غير مألوفة: «للمطاط المفلكن» — الأوضح «مخترع عملية الفَلْكَنَة»"
      - "الـsynset علم شخصي (proper noun) ولا يوجد تصنيف pos=proper_noun في البيانات، لكن pos=n صحيح ضمن موروث WordNet"
    observations: >
      المجموعة تمثّل علَمًا شخصيًّا خاصًّا بمخترع أمريكي من القرن التاسع عشر هو تشارلز نيلسون غوديير
      (Charles Nelson Goodyear، 1800-1860)، المعروف باكتشاف عملية فَلْكَنَة المطاط (vulcanization).
      يُلاحَظ أن توليد لمّات بمنهجية الاشتقاق أو المجاز غير مناسب لأعلام الأشخاص؛ فالمنهجية الوحيدة
      المجدية هنا هي التعريب (تاعريب) — أي نقل الاسم الأجنبي صوتيًّا إلى العربية وفق قواعد النقل الصوتي.
      اللمّات المرشحة ستكون تنويعات تعريبية للاسم الإنجليزي Goodyear / Charles Goodyear.

  blind_candidates:
    - lemma: "غُودْيِيَر"
      generation_method: taarib
      justification: >
        التعريب المباشر للقب Goodyear بنقل الأصوات: G→غ، oo→و، d→د، y→ي، ear→يَر.
        هذه الصيغة هي اللقب منفردًا وتُستعمل في الإشارات المختصرة.

    - lemma: "تشارلز غُودْيِيَر"
      generation_method: taarib
      justification: >
        الاسم الكامل: Charles → تشارلز (تعريب شائع للاسم الإنجليزي) + لقب غُودْيِيَر.
        يُستخدم في السياقات الرسمية والمراجع التاريخية حين يُراد التعريف الكامل.

    - lemma: "شارل غُودْيِيَر"
      generation_method: taarib
      justification: >
        بديل تعريبي يستخدم «شارل» — الصيغة الأكثر شيوعًا في المراجع العربية القديمة للاسم
        Charles (من الفرنسية Charles). محتمل الورود في مصادر عربية قديمة.

    - lemma: "جُودْيِيَر"
      generation_method: taarib
      justification: >
        تنويع تعريبي بنقل G→جـ (بدلًا من غ)، وهو تقليد عربي قديم لنقل حرف G الإنجليزي.
        قد يرد هذا الشكل في بعض المعاجم والمراجع العربية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُجراة:
#   [Q1] مطابقة دفعية: headword_norm IN (غودير, الغودير, تشارلز غودير, جودير, ...) → لا نتائج
#   [Q2] جسر إنجليزي: translation_en:"Goodyear" OR "Charles Goodyear" OR "vulcanized rubber" → لا نتائج
#   [Q3] FTS عربي: "مطاط" OR "مفلكن" OR "غوديير" OR "مخترع" → وجدت مداخل عامة لـ(مطاط، مفلكن)
#        لكن لا شيء خاص بالعَلَم غوديير
#   الميزانية المستخدمة: 3 استعلامات (ضمن الحد المسموح)
stage2_evidence:
  per_lemma:
    - lemma: "غوديير"
      evidence_status: "no_material_found"

    - lemma: "تشارلز غوديير"
      evidence_status: "no_material_found"

    - lemma: "غُودْيِيَر"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "تشارلز غُودْيِيَر"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "شارل غُودْيِيَر"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "جُودْيِيَر"
      source: stage1
      evidence_status: "no_material_found"

  # ملاحظة: غياب الأدلة متوقع تمامًا لأن المجموعة علَم شخصي
  # (proper noun) لمخترع غربي. المعاجم العربية التقليدية لا تُدرج
  # أعلام الأشخاص الأجانب عادةً. مصدر الأعلام هو النقل الصوتي
  # والموسوعات لا المعاجم اللغوية.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة: تشارلز غوديير ──
    - lemma: "تشارلز غوديير"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للمخترع الأمريكي — لمّة أساسية لا غنى عنها في الـsynset.
        التعريب المعتمد للاسم Charles في المراجع العربية الحديثة هو «تشارلز»،
        وغوديير تعريب مستقر للقب Goodyear. غياب الأدلة المعجمية طبيعي لكون
        الاسم عَلَمًا أجنبيًّا. يجب تحديث التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الاسم الكامل للمخترع — يُستخدم في السياقات الرسمية والمراجع التاريخية
        الموثقة حين يُراد تعريف الشخص تعريفًا تامًّا لا لبس فيه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشَارْلِز غُودْيِيَر"

    # ── اللمّة الموجودة: غوديير ──
    - lemma: "غوديير"
      decision: confirmed
      decision_reason: >
        اللقب العائلي منفردًا — صيغة شائعة الاستخدام في الإشارات المختصرة
        والنصوص غير الرسمية. يوفّر مدخلًا اختياريًّا مفيدًا عند البحث بالاسم
        الأخير وحده. يجب تحديث التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب العائلي منفردًا — يُستخدم في الإشارات المختصرة والسياقات
        غير الرسمية أو عند الاستشهاد المتكرر حيث يكفي اللقب للتعريف.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غُودْيِيَر"

    # ── مرشح المرحلة ١: غُودْيِيَر ── (مكرر مع الموجود بعد التشكيل)
    - lemma: "غُودْيِيَر"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح يتطابق جوهريًّا مع اللمّة الموجودة «غوديير» بعد تصحيح
        التشكيل. لا حاجة لإنشاء مدخل جديد — التحديث يُعالج المسألة.

    # ── مرشح المرحلة ١: تشارلز غُودْيِيَر ── (مكرر مع الموجود)
    - lemma: "تشارلز غُودْيِيَر"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق مع اللمّة الموجودة «تشارلز غوديير» بعد تصحيح التشكيل.
        لا يستوجب إنشاء مدخل مستقل.

    # ── مرشح المرحلة ١: شارل غُودْيِيَر ──
    - lemma: "شارل غُودْيِيَر"
      source: stage1
      decision: removed
      decision_reason: >
        «شارل» تعريب ذو أصل فرنسي — أقل شيوعًا في المراجع العربية الحديثة
        مقارنةً بـ«تشارلز» التي تعكس النطق الإنجليزي الأصلي. لا دليل على
        استخدامها تحديدًا للإشارة إلى Charles Goodyear في المصادر العربية،
        ووجودها كمدخل مستقل يُربك لا يُوضح.

    # ── مرشح المرحلة ١: جُودْيِيَر ──
    - lemma: "جُودْيِيَر"
      source: stage1
      decision: removed
      decision_reason: >
        استخدام الجيم بدلًا من الغين في تعريب G يُعدّ تقليدًا أقدم وأقل
        دقةً صوتيًّا. الصيغة «غُودْيِيَر» بالغين أقرب إلى الصوت الإنجليزي
        وأكثر توافقًا مع معايير النقل الصوتي العربي الحديث.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "مخترع أمريكي للمطاط المفلكن (1800-1860)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه لكنه يحتاج تحسينين اثنين:
        (١) التركيب «مخترع للمطاط المفلكن» غير دقيق — لم يخترع المطاط بل اخترع
        عملية فَلْكَنَته؛ (٢) الأسلوب المعجمي يستوجب تعريفًا موسوعيًّا يذكر
        طبيعة الاكتشاف وأثره دون ترجمة حرفية للتعريف الإنجليزي.
    authored:
      - type: encyclopedic
        text: >
          مخترع أمريكي (1800-1860)، اشتُهر باكتشافه عملية الفَلْكَنَة
          (تصليب المطاط الطبيعي بمعالجته بالكبريت تحت حرارة عالية)،
          وهو اختراع أحدث ثورة في الصناعات المطاطية وأسّس لصناعة الإطارات
          والمنتجات المطاطية الحديثة.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11027616-n"
          definition_index: 0
          text: >
            مخترع أمريكي (1800-1860)، اشتُهر باكتشافه عملية الفَلْكَنَة
            (تصليب المطاط الطبيعي بمعالجته بالكبريت تحت حرارة عالية)،
            وهو اختراع أحدث ثورة في الصناعات المطاطية وأسّس لصناعة الإطارات
            والمنتجات المطاطية الحديثة.

  examples:
    per_lemma:
      - lemma: "تَشَارْلِز غُودْيِيَر"
        examples:
          - text: >
              أسهم تَشَارْلِز غُودْيِيَر بعملية الفَلْكَنَة التي اكتشفها عام 1839م
              في تحويل المطاط من مادة هشّة إلى مادة متينة صالحة للاستخدام الصناعي.
            type: usage
      - lemma: "غُودْيِيَر"
        examples:
          - text: >
              تُعدّ عملية غُودْيِيَر لفَلْكَنَة المطاط من أبرز الاختراعات الصناعية
              في القرن التاسع عشر، إذ لا تزال مبادئها الأساسية سارية حتى اليوم.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            أسهم تَشَارْلِز غُودْيِيَر بعملية الفَلْكَنَة التي اكتشفها عام 1839م
            في تحويل المطاط من مادة هشّة إلى مادة متينة صالحة للاستخدام الصناعي.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            تُعدّ عملية غُودْيِيَر لفَلْكَنَة المطاط من أبرز الاختراعات الصناعية
            في القرن التاسع عشر، إذ لا تزال مبادئها الأساسية سارية حتى اليوم.


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────────
stage5_enrichment:
  per_entry:
    # كلتا اللمّتين تعريبات لأسماء أعلام أجنبية — لا جذر عربي
    - lemma: "تَشَارْلِز غُودْيِيَر"
      entry_id: "{auto}"
      # roots: N/A — اسم علم أجنبي معرَّب، لا جذر عربي ولا مقاييس

    - lemma: "غُودْيِيَر"
      entry_id: "{auto}"
      # roots: N/A — اسم علم أجنبي معرَّب، لا جذر عربي ولا مقاييس

  per_sense:
    - lemma: "تَشَارْلِز غُودْيِيَر"
      sense_id: "{auto}"
