stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «رتبة الفيكونت» مركب إضافي وصفي وليست مصطلحاً مسكوكاً مكثّفاً؛ النمط العربي المعتاد في ألقاب النبالة يفضّل المصدر الصناعي (بارونيّة، دوقيّة، كونتيّة)"
      - "اللمّة بدون تشكيل"
      - "المفهوم أوروبي إقطاعي لا نظير عربياً أصيلاً له، فالتعريب ضرورة"
    observations: "المجموعة تصف رتبة نبالة أوروبية (الفيكونت) وهي دون الكونت وفوق البارون. النمط المعجمي العربي المستقر لمثل هذه المناصب هو صوغ مصدر صناعي من الاسم المعرَّب: دوقيّة، بارونيّة، كونتيّة، مركيزيّة. لذا يُتوقّع أن يكون المصطلح الأنسب هو «فِيكُونْتِيَّة»."
  blind_candidates:
    - lemma: "فِيكُونْتِيَّة"
      generation_method: taarib
      justification: "مصدر صناعي من «فيكونت» المعرَّب على نمط بارونيّة وكونتيّة ودوقيّة؛ يقبل لام التعريف والنسبة والجمع السالم"
    - lemma: "رُتْبَةُ الفِيكُونْت"
      generation_method: tarkib
      justification: "مركب إضافي شفّاف المعنى يُستعمل تفسيرياً للدلالة على المنصب؛ لكنه أقرب إلى العبارة الوصفية منه إلى المصطلح"
    - lemma: "مَنْصِبُ الفِيكُونْت"
      generation_method: tarkib
      justification: "مركب إضافي بديل باستعمال «منصب» بدل «رتبة»؛ أقل شيوعاً من رتبة في سياق النبالة"
    - lemma: "مَقَامُ الفِيكُونْت"
      generation_method: tarkib
      justification: "مركب إضافي باستعمال «مقام» للدلالة على المكانة؛ لكنه غير مسكوك معجمياً"

stage2_evidence:
  per_lemma:
    - lemma: "رُتْبَةُ الفِيكُونْت"
      confirm:
        - text: "«الفيكونتيّة: رتبة الفيكونت.»"
          source: "المورد الحديث (2008)"
        - text: "«الفيكونتيّة: «أ» رتبة الفيكونت. «ب» مقاطعة خاضعة لفيكونت.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الفيكونت: نبيل دون الكونت وفوق البارون.»"
          source: "المورد الحديث (2008)"
          addition: "تحديد موقع الفيكونت في سلّم النبالة"
        - text: "«الإيرل: لقب إنكليزي أدنى من مركيز وأرفع من فيكونت.»"
          source: "المورد الحديث (2008)"
          addition: "تأكيد إضافي لموقع الفيكونت في ترتيب الألقاب"
        - text: "«(الرُّتْبَة) الْمنزلَة والمكانة أَو الْمنزلَة الرفيعة ودرجة من دجات الشّرف تمنحها الدولة من ترى تكريمه»"
          source: "المعجم الوسيط"
          addition: "تأكيد ملاءمة لفظ «رتبة» لمعنى درجة الشرف"
    - lemma: "فِيكُونْتِيَّة"
      confirm:
        - text: "«الفيكونتيّة: رتبة الفيكونت.»"
          source: "المورد الحديث (2008) — ترجمة viscountcy"
        - text: "«الفيكونتيّة: «أ» رتبة الفيكونت. «ب» مقاطعة خاضعة لفيكونت.»"
          source: "المورد الحديث (2008) — ترجمة viscounty"
      expands:
        - text: "«الدُّوقيّة: «أ» مقاطعة يحكمها دوق. «ب» منصب الدوق.»"
          source: "المورد الحديث (2008)"
          addition: "نمط صوغ مطابق: اسم معرَّب + ياء النسبة + تاء التأنيث = مصدر صناعي للمنصب"
    - lemma: "مَنْصِبُ الفِيكُونْت"
      evidence_status: "no_material_found"
    - lemma: "مَقَامُ الفِيكُونْت"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "رُتْبَةُ الفِيكُونْت"
      decision: confirmed
      decision_reason: "مركب إضافي شائع الاستعمال في النصوص العربية للدلالة على هذه الرتبة، وهو اللمّة الموجودة أصلاً في المجموعة وإن كانت بدون تشكيل. يبقى مفيداً كتعبير تفسيري بجانب المصطلح المسكوك."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير تفسيري وصفي يُستعمل في السياقات التي تحتاج إلى إيضاح المعنى لغير المتخصصين"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُتْبَةُ الفِيكُونْت"
    - lemma: "فِيكُونْتِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح معرَّب مسكوك موثّق في المورد الحديث بترجمة viscountcy وviscounty، مطابق للنمط الصوغي العربي (دوقيّة، بارونيّة، كونتيّة). أولى بأن يكون اللمّة الأساسية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح المسكوك المكثّف للدلالة على الرتبة؛ يحمل أيضاً دلالة المقاطعة الخاضعة للفيكونت"
      actions:
        - command: create_entry
          params:
            lemma: "فِيكُونْتِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "مَنْصِبُ الفِيكُونْت"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على استعماله مصطلحاً ثابتاً، وهو مجرد عبارة وصفية حرة لا تختلف جوهرياً عن «رتبة الفيكونت» ولا تضيف تمييزاً دلالياً"
    - lemma: "مَقَامُ الفِيكُونْت"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي، وعبارة غير مسكوكة؛ «مقام» يُستعمل عادة للمكانة المعنوية لا لرتبة نبالة محددة"

stage4_content:
  definition:
    current: "كرامة أو رتبة أو منصب الفيكونت أو الفيكونتيسة"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية للتعريف الإنجليزي وفيه تكديس عطفي غير ضروري؛ يحتاج إلى صياغة معجمية عربية أوضح مع تحديد موقع الرتبة في سلّم النبالة"
    authored:
      - type: terminological
        text: "رُتْبَةٌ مِن رُتَبِ النَّبالَةِ الأوروبِّيَّةِ تَقَعُ دُونَ الكُونْتِ وَفَوْقَ البارُون"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "رُتْبَةٌ مِن رُتَبِ النَّبالَةِ في النِّظامِ الإقْطاعِيِّ الأوروبِّيِّ، يَحْتَلُّ صاحِبُها مَنْزِلَةً دُونَ الكُونْت (Earl) وَفَوْقَ البارُون، وَيُلَقَّبُ الفِيكُونْت، وَتُلَقَّبُ المَرْأَةُ الحامِلَةُ لِهذِهِ الرُّتْبَةِ أَوْ زَوْجَةُ الفِيكُونْت بِالفِيكُونْتِيسَة"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "رُتْبَةٌ مِن رُتَبِ النَّبالَةِ الأوروبِّيَّةِ تَقَعُ دُونَ الكُونْتِ وَفَوْقَ البارُون"
  examples:
    per_lemma:
      - lemma: "رُتْبَةُ الفِيكُونْت"
        examples:
          - text: "مُنِحَ رُتْبَةَ الفِيكُونْتِ تَقْدِيراً لِخِدْماتِهِ الدِّبلوماسِيَّةِ الطَّوِيلَة"
            type: usage
      - lemma: "فِيكُونْتِيَّة"
        examples:
          - text: "آلَتِ الفِيكُونْتِيَّةُ إِلَيْهِ بَعْدَ وَفاةِ أَبِيهِ وِفْقاً لِنِظامِ الوِراثَةِ في طَبَقَةِ النُّبَلاء"
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "مُنِحَ رُتْبَةَ الفِيكُونْتِ تَقْدِيراً لِخِدْماتِهِ الدِّبلوماسِيَّةِ الطَّوِيلَة"
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "آلَتِ الفِيكُونْتِيَّةُ إِلَيْهِ بَعْدَ وَفاةِ أَبِيهِ وِفْقاً لِنِظامِ الوِراثَةِ في طَبَقَةِ النُّبَلاء"

