# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14038619-n
# "a dormant or quiescent state" — slumber
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «سبات» موجودة في هذه المجموعة وفي المجموعة الأعلى (hypernym) awn4-14035282-n في آن واحد، مما يخلق دوراناً دلالياً"
      - "التعريف العربي «حالة خاملة أو ساكنة» ترجمة حرفية مبتسرة لا تميّز هذه المجموعة عن أمّها"
    observations: "المجموعة تمثّل حالة سكون أو خمول قابلة للزوال، وهي أخصّ من مجرد الخمول الهادئ (المجموعة الأمّ). المفهوم راسخ في العربية وله ألفاظ متعددة تتراوح بين النوم الحسّي والسكون المجازي. الجذور الدالّة على هذا المعنى: سبت (الراحة والسكون)، هجع (النوم ليلاً)، رقد (النوم)، همد (خمود الشيء). المفهوم يتّسع ليشمل السبات البيولوجي والحاسوبي في الاستعمال الحديث."
  blind_candidates:
    - lemma: "سُبَات"
      generation_method: ishtiqaq
      justification: "من الجذر (سبت) على وزن فُعَال الدالّ على الحالات والأمراض، وأصله الراحة والسكون عند ابن فارس، يُطلق على النوم والنومة الخفيفة وحالة فقدان الوعي طبّياً"
    - lemma: "هُجُوع"
      generation_method: ishtiqaq
      justification: "مصدر هَجَعَ من الجذر (هجع) الدالّ على النوم، يُستعمل في المعجم الطبّي الموحّد بمعنى dormancy"
    - lemma: "رُقَاد"
      generation_method: ishtiqaq
      justification: "من الجذر (رقد) على وزن فُعَال، أصله النوم عند ابن فارس، يشمل النوم ليلاً ونهاراً"
    - lemma: "هُمُود"
      generation_method: ishtiqaq
      justification: "مصدر هَمَدَ من الجذر (همد) الدالّ على خمود الشيء وانطفائه، يصلح للسكون التامّ والخمول"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "سُبَات"
      confirm:
        - text: "«(السبات) الرَّاحَة وَفِي التَّنْزِيل الْعَزِيز {وَهُوَ الَّذِي جعل لكم اللَّيْل لباسا وَالنَّوْم سباتا} وَالنَّوْم والنومة الْخَفِيفَة كنوم الْمَرِيض وَالشَّيْخ المسن [...] و (فِي الطِّبّ) حَالَة يفقد فِيهَا الْمَرِيض وعيه فقدانا تَاما وَلَا يفِيق مِنْهَا بأقوى المنبهات وَهُوَ خلاف الْإِغْمَاء (مج)»"
          source: "المعجم الوسيط"
        - text: "«النَّوْمُ الغالبُ الكثيرُ [...] ابتداءُ النَّوم [...] النَّوْمةُ الخفيفةُ كنَوْمِ المريض والـشَّيخ الـمُسِنّ [...] انْقِطاعُ المرءِ عن حركة [...] الرَّاحةُ والسُّكونُ»"
          source: "المعجم الكبير"
        - text: "«السّبات: النوم وأصله الراحة. وعند الأطباء نوم طويل غرق ثقيل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«السبات: نوم طويل، والفرق بينه وبين السكتة أن المسبوت يمكن أن ينبه ويفهم بخلاف المسكوت»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«سُبات = dormancy»"
          source: "المعجم الموحد لمصطلحات المياه"
        - text: "«سُبَات = hibernate — حالة شبه سكون يوضع فيها الحاسوب دون إطفائه في انتظار استعمال لاحق»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
        - text: "«(1) سُكون (2) هُجوع (3) السُّبات (أح). = dormancy»"
          source: "المورد الحديث"
      expands:
        - text: "«كلمة سُبات تأتي بمعنى النومة الخفيفة، كما تأتي بمعنى النوم مطلقاً، ففي التاج: والسُّبات، كغُراب: النَّوم، وذكر المصباح المنير أنه النوم الثقيل»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "اللفظ يتأرجح بين النومة الخفيفة والنوم الثقيل حسب المصادر"
        - text: "«السُّبَاتُ: ورم دماغي عَن بلغم وصفراء»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "دلالة طبّية قديمة مختلفة عن الاستعمال الحديث"

    - lemma: "هُجُوع"
      confirm:
        - text: "«الهُجُوعُ، بالضم، والتَّهْجاعُ: النَّوْمُ لَيْلاً، أو التَّهْجاعُ: النَّوْمَةُ الخَفيفَةُ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الهجوع: النوم ليلاً»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«هُجوع = dormancy»"
          source: "المعجم الطبي الموحد"
        - text: "«(5) هُجوع؛ سُبات = slumber»"
          source: "المورد الحديث"
      expands:
        - text: "«هُجوعٌ صَيفِيّ = estivation (summer dormancy)»"
          source: "المعجم الطبي الموحد"
          addition: "يدلّ على توسّع اللفظ إلى السبات البيولوجي الموسمي"

    - lemma: "رُقَاد"
      confirm:
        - text: "«الرقاد: المستطاب من النوم القليل، وقيل مطلق النوم ليلاً أو نهاراً، وخصه بعضهم بنوم الليل واعترض»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الرُّقَادُ: النَّوْمُ يَكونُ باللَّيْل والنَّهَار عِنْدَ العَرَب»"
          source: "المعجم الكبير"
      contradicts:
        - text: "لم يرد في أيّ معجم مصطلحي حديث (ARABTERM) بمعنى dormancy أو quiescence"
          source: "قاعدة ARABTERM"
          conflict: "اللفظ محصور في النوم الحسّي ولا يمتدّ إلى الحالة المجازية (السكون/الخمول)"

    - lemma: "هُمُود"
      contradicts:
        - text: "«الهُمودُ: الموتُ، وطُفوءُ النارِ، أو ذَهابُ حرارتِها، وتَقَطُّعُ الثَّوْبِ من طُولِ الطَّيِّ [...] وـ في الأرضِ: أن لا يكونَ بها حَياةٌ ولا عُودٌ ولا نَبْتٌ ولا مَطَرٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الهمود يدلّ على الفناء والانقطاع التامّ لا على السكون المؤقت القابل للعودة"
        - text: "«همود = entropy — نقص القدرة على التغير التلقائي»"
          source: "معجم المصطلحات الطبية"
          conflict: "المقابل الاصطلاحي الحديث هو entropy لا dormancy"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "سُبَات"
      decision: confirmed
      decision_reason: "لفظ فصيح قرآني راسخ في المعاجم الكلاسيكية والحديثة، يدلّ على الراحة والسكون والنوم، واستُعمل في المصطلحية الحديثة مقابلاً لـ dormancy وhibernate. تشكيله الكامل: سُبَات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "سُبَات أعمّ من هُجُوع؛ يشمل النوم الخفيف والثقيل والحالة الطبّية، ويمتدّ إلى السكون المجازي (البيولوجي، الحاسوبي). أصله الراحة والسكون."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُبَات"

    - lemma: "هُجُوع"
      decision: confirmed
      decision_reason: "لفظ فصيح مؤيَّد بالقاموس المحيط والمناوي والمعجم الطبي الموحد. يدلّ على النوم ليلاً ثم توسّع إلى dormancy في الاستعمال العلمي الحديث. تشكيله الكامل: هُجُوع."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "هُجُوع أخصّ من سُبَات؛ أصله النوم ليلاً (لا مطلق النوم)، ويحمل ظلالاً من الخفّة والسكينة. في الاستعمال الحديث يُستعمل للسبات البيولوجي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هُجُوع"

    - lemma: "رُقَاد"
      source: stage1
      decision: removed
      decision_reason: "رغم ثبوته معجمياً بمعنى النوم، فهو محصور في الدلالة الحسّية (النوم الفعلي) ولم يرد في أيّ معجم مصطلحي حديث بمعنى dormancy أو quiescence. لا يضيف تمييزاً دلالياً جديداً فوق ما يغطّيه سُبَات وهُجُوع."
      evidence_assessment:
        case: mixed

    - lemma: "هُمُود"
      source: stage1
      decision: removed
      decision_reason: "الهمود يدلّ على الفناء والخمود النهائي (موت، طفوء النار، يباس الأرض) لا على السكون المؤقت القابل للعودة. المقابل الاصطلاحي الحديث هو entropy لا dormancy. دلالته تتعارض مع مفهوم المجموعة."
      evidence_assessment:
        case: contradicts_only

