# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10826297-n  |  ili: i94236
# الموضوع: ألفار آلتو — معماري ومصمم أثاث فنلندي (1898-1976)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "POS المُسجَّل هو 'n' في حين أن المجموعة تمثّل اسم علم لشخصية تاريخية بعينها، والصواب 'proper_noun'."
      - "اللمّتان الموجودتان (آلتو، ألفار آلتو) خاليتان من التشكيل الكامل المطلوب."
      - "اللمّة الإنجليزية الثالثة (Hugo Alvar Henrik Aalto) لا يقابلها لمّة عربية في المجموعة."
      - "التعريف الحالي مختصر جداً: لا يُشير إلى أبرز منجزاته المعمارية ولا إلى مكانته الريادية في تيار الحداثة العضوية."
    observations: >
      هذه المجموعة خاصة باسم علم أجنبي (فنلندي) لشخصية تاريخية، هي المعماري هوغو ألفار هنريك آلتو (1898-1976).
      أسماء الأعلام الأجنبية لا تستوعب المناهج الاشتقاقية ولا التركيبية بالمعنى الدقيق، إذ ليس ثمة جذر عربي يُستند إليه.
      التعريب (taarib) هو المسلك الوحيد المتاح، وتنحصر الخيارات في الصيغ التعريبية المختلفة للاسم ذاته (الأخير وحده، أو الاسم المزدوج الشائع، أو الاسم الرسمي الكامل). قرأتُ الملف المُقنَّع أولاً وولّدتُ المرشحات الأربعة أدناه انطلاقاً من التعريف فقط دون الاطلاع على اللمّات الموجودة.

  blind_candidates:
    - lemma: "آلْتو"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم الأخير الفنلندي Aalto — أقصر صيغة يُعرَّف بها المعماري
        في السياق التخصصي المعماري. تقبل لام التعريف (آلتو → الآلتو) وإن كان ذلك نادراً.
    - lemma: "أَلْفَار آلْتو"
      generation_method: taarib
      justification: >
        تعريب للاسم الثنائي الأكثر تداولاً في المصادر العربية المعمارية والموسوعية
        (الاسم الأول الشائع + الاسم الأخير). مركّب إضافي اسمي من عنصرَيْن.
    - lemma: "هوغو أَلْفَار هِنْريك آلْتو"
      generation_method: taarib
      justification: >
        تعريب للاسم الرسمي الكامل الذي يُرِد في دور الوثائق والموسوعات الأكاديمية:
        Hugo Alvar Henrik Aalto. مقابله الثالث من اللمّات الإنجليزية في OEWN.
    - lemma: "أَلْتو"
      generation_method: taarib
      justification: >
        صيغة تعريبية بديلة قياسية بدون مدّ الألف الأولى (Aalto → Alto)،
        كما هو شائع في بعض المعاجم والمصادر الأجنبية-العربية المُبكّرة.
        مع ذلك، هي أقلّ دقةً صوتيةً من "آلتو".


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  query_log:
    - query_number: 1
      purpose: "مطابقة دقيقة دفعية لجميع اللمّات الموجودة والمرشحات"
      terms_searched:
        - "التو"
        - "الالتو"
        - "آلتو"
        - "الآلتو"
        - "الفار التو"
        - "الفار آلتو"
        - "هوغو الفار هنريك التو"
        - "التو"
      result: "عُثر على مداخل كلمة (التَّوّ) العربية الفصيحة (الفرد، الحبل المفتول طاقاً واحداً) — لا صلة بالمعنى المقصود."
    - query_number: 2
      purpose: "الجسر الإنجليزي — Aalto / Alvar Aalto / Hugo Alvar Henrik Aalto"
      result: "لا نتائج — ARABTERM لا يتضمن إدخالات لهذه الأسماء."
    - query_number: 3
      purpose: "FTS بكلمة مفتاحية 'فنلندي' و'معماري فنلندي'"
      result: "نتائج متعلقة بفنلندا كدولة (حمام فنلندي، قطن فنلندي، فنلندا كجغرافية) — لا صلة بآلتو تحديداً."

  per_lemma:
    - lemma: "آلتو"
      evidence_status: "no_material_found"

    - lemma: "ألفار آلتو"
      evidence_status: "no_material_found"

    - lemma: "آلْتو"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "أَلْفَار آلْتو"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "هوغو أَلْفَار هِنْريك آلْتو"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "أَلْتو"
      source: stage1
      evidence_status: "no_material_found"

  evidence_note: >
    عدم وجود أدلة معجمية متوقَّع تماماً: أسماء الأعلام للشخصيات الأجنبية نادراً ما
    تُدرج كمداخل مستقلة في المعاجم العربية. المصدر الوحيد المحتمل هو المعاجم الموسوعية
    المتخصصة في تراجم المعماريين، وهي غير موجودة في قاعدة البيانات المتاحة.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:
    # ─── اللمّات الموجودة ───────────────────────────────────
    - lemma: "آلتو"
      decision: confirmed
      decision_reason: >
        الاسم الأخير وحده (Aalto) — وهو الشكل الأكثر اختصاراً وكثيراً ما يُستخدم
        منفرداً في السياق المعماري التخصصي والأكاديمي ("تصاميم آلتو"، "أسلوب آلتو").
        التعريب الصوتي صحيح (مدّ الألف يعكس الصوت الطويل في الاسم الفنلندي).
        التشكيل الكامل مطلوب: آلْتو.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُمثّل الاسم الأخير المُفرَد — الأكثر إيجازاً واستخداماً عند الإحالة إلى
        أعماله ("مبنى آلتو" / "كرسي آلتو") دون الحاجة إلى ذكر الاسم الأول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "آلْتو"

    - lemma: "ألفار آلتو"
      decision: confirmed
      decision_reason: >
        الصيغة الثنائية الشائعة (Alvar Aalto) هي الأكثر تداولاً في المصادر العربية
        الموسوعية والمعمارية. تعكس الطريقة التي اشتُهر بها المعماري على الصعيد العالمي.
        تشكيل كامل مطلوب: أَلْفَار آلْتو.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الأشهر والأوسع تداولاً في المراجع العربية المتخصصة وغير المتخصصة؛
        تجمع بين الاسم الأول الشائع (ألفار) والاسم الأخير، مما يُعرَّف به في
        الموسوعات كويكيبيديا عربياً وفي المناهج المعمارية الأكاديمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَلْفَار آلْتو"

    # ─── مرشحات المرحلة ١ ──────────────────────────────────
    - lemma: "آلْتو"
      source: stage1
      decision: removed
      decision_reason: >
        تطابق تام مع اللمّة الموجودة "آلتو" بعد التشكيل. لا حاجة لإنشاء مدخل جديد.

    - lemma: "أَلْفَار آلْتو"
      source: stage1
      decision: removed
      decision_reason: >
        تطابق تام مع اللمّة الموجودة "ألفار آلتو" بعد التشكيل. لا حاجة لإنشاء مدخل جديد.

    - lemma: "هوغو أَلْفَار هِنْريك آلْتو"
      source: stage1
      decision: confirmed
      decision_reason: >
        هذا الاسم الكامل الرسمي (Hugo Alvar Henrik Aalto) موجود ضمن اللمّات الإنجليزية
        لهذه المجموعة في OEWN، مما يعني أن النية هي تضمينه. غير أنه غائب من اللمّات
        العربية. يُستخدم في السياقات الأكاديمية والموثِّقة والموسوعية الرسمية.
        تعريبه صوتياً مقبول وقياسي. اختبار السكّ: هذا اسم علم ثابت لا يقبل الاستبدال.
        اختبار التثبيت: ثابت في موسوعات الشخصيات المعمارية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل الرسمي ذو أربعة عناصر — يُستخدم في الوثائق الرسمية والسيَر
        الموسوعية وبيانات التعريف الببليوغرافي، ويتيح التمييز الدقيق عن أشخاص آخرين
        يحملون اسم "آلتو" أو "ألفار آلتو".
      actions:
        - command: create_entry
          params:
            lemma: "هوغو أَلْفَار هِنْريك آلْتو"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "أَلْتو"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تعريبية أقل دقةً صوتياً من "آلتو" (تُضيع المدّ في الصوت الفنلندي Aa).
        لا مسوِّغ لإضافتها طالما توجد "آلتو" بالمدّ الصحيح.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري ومصمم أثاث فنلندي (1898-1976)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح في جوهره لكنه شديد الإيجاز: لا يذكر مدينة الميلاد ولا
        أبرز ما اشتُهر به آلتو (ريادة الحداثة العضوية، استخدام الخشب والمواد الطبيعية،
        التصاميم الإنسانية). مطلوب تعريف موسوعي أثرى يُعطي السياق المعرفي الكافي.
    authored:
      - type: encyclopedic
        text: >
          هوغو أَلْفَار هِنْريك آلْتو (1898-1976): معماريٌّ ومصمِّمٌ فنلنديٌّ رائد،
          يُعدُّ من أبرز وجوه العمارة الحديثة في القرن العشرين، وأحد مؤسّسي تيار
          الحداثة العضوية الذي يُوازن بين الوظيفية وإنسانية الفضاء. اشتُهر باستخدام
          الخشب والمواد الطبيعية في تصاميمه المعمارية والأثاثية، ومن أبرز أعماله:
          مكتبة فيبوري (1935) ومبنى باكهاوس في نيويورك (1965). مُنح جائزة RIBA الذهبية (1957).
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            هوغو أَلْفَار هِنْريك آلْتو (1898-1976): معماريٌّ ومصمِّمٌ فنلنديٌّ رائد،
            يُعدُّ من أبرز وجوه العمارة الحديثة في القرن العشرين، وأحد مؤسّسي تيار
            الحداثة العضوية الذي يُوازن بين الوظيفية وإنسانية الفضاء. اشتُهر باستخدام
            الخشب والمواد الطبيعية في تصاميمه المعمارية والأثاثية، ومن أبرز أعماله:
            مكتبة فيبوري (1935) ومبنى باكهاوس في نيويورك (1965). مُنح جائزة RIBA الذهبية (1957).

  examples:
    per_lemma:
      - lemma: "آلْتو"
        examples:
          - text: "أحدثت تصاميمُ آلْتو للكراسي الخشبية المنحنية ثورةً في عالم الأثاث الحديث."
            type: usage

      - lemma: "أَلْفَار آلْتو"
        examples:
          - text: "يُصنَّف أَلْفَار آلْتو بوصفه أبرز معماريي الشمال الأوروبي وأكثرهم تأثيراً في حركة الحداثة الإنسانية."
            type: usage

      - lemma: "هوغو أَلْفَار هِنْريك آلْتو"
        examples:
          - text: "وُلد هوغو أَلْفَار هِنْريك آلْتو في مدينة كوورتانه الفنلندية عام 1898، وتوفّي في هلسنكي عام 1976."
            type: usage

    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أحدثت تصاميمُ آلْتو للكراسي الخشبية المنحنية ثورةً في عالم الأثاث الحديث."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُصنَّف أَلْفَار آلْتو بوصفه أبرز معماريي الشمال الأوروبي وأكثرهم تأثيراً في حركة الحداثة الإنسانية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وُلد هوغو أَلْفَار هِنْريك آلْتو في مدينة كوورتانه الفنلندية عام 1898، وتوفّي في هلسنكي عام 1976."


