# مراجعة المجموعة الترادفية — awn4-14341370-n (iridoncus)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ورم القزحية» تفتقر إلى التشكيل الكامل"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو حدٌّ أدنى لا يكفي لتمثيل التنوع المصطلحي"
      - "التعريف العربي «تورم قزحية العين» قصير ومبسّط، يكاد يكون ترجمة حرفية للتعريف الإنجليزي"
    observations: "المجموعة تمثّل مصطلحاً طبّياً متخصّصاً في أمراض العين (طبّ العيون). المفهوم الأصلي (iridoncus) يشير إلى تورّم القزحية كعرض سريري مستقلّ عن الالتهاب (iritis). التسمية العربية الموجودة «ورم القزحية» مركّب إضافي مقبول في المصطلحية الطبّية العربية، لكنّه يحتمل الالتباس مع الورم بالمعنى الأنكولوجي (tumor). يُفضَّل إضافة لمّة بديلة تميّز الدلالة التورّمية عن الدلالة الأنكولوجية."
  blind_candidates:
    - lemma: "وَرَم القُزَحِيَّة"
      generation_method: tarkib
      justification: "مركّب إضافي من «وَرَم» (نُتوء وانتفاخ) و«القُزَحِيَّة» (الغشاء المصطبغ في العين). يطابق النمط المصطلحي الطبّي العربي المعتمد في معاجم المصطلحات الموحّدة."
    - lemma: "تَوَرُّم القُزَحِيَّة"
      generation_method: tarkib
      justification: "مركّب إضافي يستعمل المصدر «تَوَرُّم» (تَفَعُّل) الذي يدلّ على حدوث الورم تدريجياً أو كحالة مرضية، وهو أدقّ من «وَرَم» في السياق الطبّي لأنّه يميّز الحالة (swelling) عن الكتلة (tumor)."
    - lemma: "انْتِفَاخ القُزَحِيَّة"
      generation_method: tarkib
      justification: "مركّب إضافي من «انتفاخ» (مصدر انتفخ)، وهو مرادف لـ«تورّم» في السياق الطبّي. يستعمله بعض الأطباء العرب لوصف تضخّم الأنسجة."
    - lemma: "إِيرِيدُونْكُوس"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح اليوناني-اللاتيني iridoncus. لا يُلجأ إليه إلا عند تعذّر البديل العربي، وهو متعذّر هنا لوجود بدائل عربية وافية."

stage2_evidence:
  per_lemma:
    - lemma: "وَرَم القُزَحِيَّة"
      confirm:
        - text: "«إصابة القزحية بورم أو تورم.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
      expands:
        - text: "«الغشاء الدائري المصطبغ خلف القرنية ويثقبه البؤبؤ.» (تعريف القزحية)"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "يوضّح المقصود بالقزحية تشريحياً"
        - text: "«حِجَاب مستدير ملوَّن خلف القَرْنِيَّة يتوسطه ثقب يسمى: إنسان العين أو البؤبؤ»"
          source: "المعجم الوسيط"
          addition: "تأكيد تعريف القزحية في أكبر معجم عربي معاصر"
        - text: "«الوَرَمُ: واحد الأوْرامِ. يقال منه: وَرِمَ جلده يَرِمُ بالكسر فيهما، وهو شاذ. وتورم مثله»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
          addition: "تأصيل لغوي كلاسيكي للفظ وَرَم"
    - lemma: "تَوَرُّم القُزَحِيَّة"
      confirm:
        - text: "«تَوَرُّمُ القُزَحِيَّة» (مدخل مستقلّ، الترجمة الإنجليزية: iridoncosis)"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«الوَرَمُ، محرَّكةً: نتوءٌ، وانْتِفاخٌ. وَرِمَ، كَوَرِثَ: انْتَفَخَ؛ كَتَوَرَّمَ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "يؤكّد أن تَوَرَّم وورم بمعنى واحد: الانتفاخ"
    - lemma: "انْتِفَاخ القُزَحِيَّة"
      evidence_status: "no_material_found"
    - lemma: "إِيرِيدُونْكُوس"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "وَرَم القُزَحِيَّة"
      decision: confirmed
      decision_reason: "المصطلح مسجّل في معجم المصطلحات الطبية (1997) مقابل iridoncus مع تعريف صريح. مركّب إضافي ثابت مقبول في المصطلحية الطبّية العربية. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يشير إلى وجود كتلة أو نتوء في القزحية، وقد يحتمل الدلالة الأنكولوجية (ورم = tumor) إلى جانب الدلالة التورّمية (ورم = swelling)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَرَم القُزَحِيَّة"
    - lemma: "تَوَرُّم القُزَحِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مسجّل في المعجم الطبي الموحد (2009) مقابل iridoncosis وهو الشكل الأحدث من iridoncus. صيغة المصدر «تَوَرُّم» (تَفَعُّل) أدقّ في الدلالة على الحالة المرضية (swelling) وتميّزه عن الورم بمعنى الكتلة (tumor)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على العملية المرضية (التورّم كحدث) لا على النتيجة (الورم ككتلة)، فهو أوضح في السياق السريري لتمييزه عن الأورام الحقيقية."
      actions:
        - command: create_entry
          params:
            lemma: "تَوَرُّم القُزَحِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"
    - lemma: "انْتِفَاخ القُزَحِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي على هذا المركّب كوحدة مصطلحية ثابتة. كلمة «انتفاخ» مستعملة في سياقات طبّية أخرى لكنّها لم تُسكّ مع «القزحية» في أيّ معجم مصطلحي."
      evidence_assessment:
        case: no_material
    - lemma: "إِيرِيدُونْكُوس"
      source: stage1
      decision: removed
      decision_reason: "لا حاجة لتعريب المصطلح الأجنبي مع وجود بديلين عربيين مسجّلين في معاجم المصطلحات الطبّية الموحّدة. التعريب هنا ملاذ أخير لا مبرّر له."
      evidence_assessment:
        case: no_material

