# الموضوع: إليهو طومسون — مهندس كهربائي أمريكي (1853-1937)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تتعلق باسم علم لشخص تاريخي بعينه، مما يجعل توليد اللمّات مقتصراً على صيغ التعريب الصوتي دون إمكانية الاشتقاق أو المجاز الحقيقي"
      - "التعريف العربي يحتوي على تبسيط مُضلِّل تاريخياً: 'شكل شركة مع توماس إديسون' لا يعكس الحقيقة، إذ إن الصحيح أن شركة طومسون-هيوستون اندمجت مع شركة إديسون الكهربائية العامة عام 1892 لتكوين جنرال إلكتريك، وكان طومسون وإديسون منافِسَيْن قبل الاندماج لا شريكَيْن"
      - "غياب التشكيل الكامل عن اللمّات — إلزامي لأسماء الأعلام المعرَّبة"
      - "اللقب 'طومسون' منفرداً لفظٌ مبهم يحيل إلى شخصيات كثيرة تحمل هذا اللقب"
      - "التعريف العربي لا يذكر أبرز مساهمات الشخص الاختراعية، ويقتصر على حدث تجاري واحد"
    observations: >-
      قراءة الملف المُقنَّع تكشف أن المجموعة تصف شخصاً تاريخياً بعينه: مهندس كهربائي
      أمريكي من أصل إنجليزي (1853-1937) أسهم في تأسيس كيان مع توماس إديسون عام 1892.
      التحديد الزمني (1892، 1853-1937) والسياق الكهربائي والارتباط بإديسون تُعيِّن الشخص
      تعييناً قاطعاً — هو إليهو طومسون Elihu Thomson.
      هذا النوع من المجموعات (أسماء الأعلام التاريخية) يستوجب التعريبَ الصوتي وحده وسيلةً
      لتوليد اللمّات؛ إذ لا يجوز الاشتقاق من جذر عربي لاسم علم أجنبي. تأتي أهمية المراجعة
      هنا في ضبط الصيغة الأمثل للتعريب وتصحيح التعريف التاريخي.

  blind_candidates:
    - lemma: "إِلِيهُو طُومْسُون"
      generation_method: taarib
      justification: >-
        تعريب صوتي للاسم الكامل Elihu Thomson؛ «إِلِيهُو» نقل لـ Elihu، و«طُومْسُون»
        نقل لـ Thomson قياساً على «طُومَاس» (Thomas) الواردة في التعريف ذاته. هذه الصيغة
        أكثر احتمالاً للورود في الأدبيات العربية الأكاديمية عند الإشارة إلى هذا المهندس
        بالاسم الكامل.
    - lemma: "إِيلَايْهُو طُومْسُون"
      generation_method: taarib
      justification: >-
        تعريب بديل يعكس النطق الإنجليزي الفعلي للاسم [ɪˈlaɪhjuː] بصورة أوفى؛ حرف الياء
        المدّية في «إيلايهو» تُعبّر عن ثنائي حركة ai الإنجليزي. صيغة محتملة في بعض ترجمات
        الموسوعات.
    - lemma: "طُومْسُون"
      generation_method: taarib
      justification: >-
        اللقب منفرداً — شائع جداً في الأدبيات العلمية العربية للإشارة إلى العلماء بلقبهم
        دون الاسم الشخصي (كـ «ظاهرة طومسون»، «قنطرة طومسون»). مستعمل في حال وضوح
        السياق الذي يُعرِّف القارئَ بالشخص.
    - lemma: "ثُومْسُون"
      generation_method: taarib
      justification: >-
        صيغة تعريبية بديلة تستخدم حرف الثاء بدلاً من الطاء لنقل صوت th الإنجليزي نقلاً
        أقرب من الناحية الصوتية. هذه الصيغة موثّقة في المعاجم العلمية العربية
        (كـ «داء ثومسون»، «متلازمة روتموند-ثومسون»).


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت:
# ١. مطابقة دفعية: طومسون / اليهو طومسون + صيغ ال- (لم ينتج عن اليهو طومسون شيء)
# ٢. جسر إنجليزي: Thomson / Elihu Thomson / Elihu
# ٣. إثراء بالمعرّف للنتائج الموجودة
# ٤. FTS عربي: مهندس كهربائي / اليهو طومسون (لم ينتج شيئاً)
stage2_evidence:
  per_lemma:
    - lemma: "إليهو طومسون"
      evidence_status: "no_material_found"

    - lemma: "طومسون"
      expands:
        - text: "«طومسون: عن الإنجليزية بمعنى ابن توم أو ابن توماس، وتوماس عن اليونانية بمعنى توأم. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >-
            يوثّق المعجم أن «طومسون» تعريب معتمد للقب الإنجليزي Thomson وأن أصله «ابن
            توم/توماس»؛ هذا يعزّز مشروعية الصيغة بالطاء لا الثاء. الإدخال يخص اللقب
            من حيث هو اسم عائلة، لا شخصاً بعينه.

    - lemma: "إِلِيهُو طُومْسُون"
      evidence_status: "no_material_found"

    - lemma: "إِيلَايْهُو طُومْسُون"
      evidence_status: "no_material_found"

    - lemma: "ثُومْسُون"
      confirm:
        - text: "«داءُ طُومسُون (مرض جلدي وراثي) — Thomson's disease»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مُتَلاَزِمَةُ روتموند-ثومسون (ضمور وتصبغ وتوسع الأوعية) — Rothmund-Thomson syndrome»"
          source: "المعجم الطبي الموحد (2009)"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──
    - lemma: "إليهو طومسون"
      decision: confirmed
      decision_reason: >-
        الاسم الكامل للشخص (الاسم الشخصي + اللقب العائلي) هو المرجع الأدق والأخلى من
        الإبهام. التعريب بالطاء مدعوم بموسوعة الأسماء، وبالتوازي مع «طوماس» في التعريف
        ذاته. يحتاج إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        الصيغة الرسمية الكاملة التي تجمع الاسم الشخصي (إليهو) واللقب العائلي (طومسون)؛
        تُستخدم في السياقات الأكاديمية والموسوعية الرسمية التي تستوجب التحديد غير الملتبس
        للشخص، وتمييزه عن غيره من العلماء الذين يحملون اللقب نفسه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِلِيهُو طُومْسُون"

    - lemma: "طومسون"
      decision: confirmed
      decision_reason: >-
        اللقب منفرداً صيغة مشروعة ومستعملة في أدبيات الكهرباء العربية حين تُنسب إليه
        الظواهر والأدوات (قنطرة طومسون، ظاهرة جول-طومسون). الصيغة بالطاء موثّقة في
        موسوعة الأسماء العربية. الإبهام قائم لكنه مقبول في السياق المُعيِّن. يحتاج تشكيلاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        الصيغة المختصرة شائعة الاستعمال حين يكون السياق كافياً لتعيين الشخص، ولا سيما
        في أسماء الظواهر الفيزيائية والأدوات المنسوبة إليه؛ تختلف عن «إِلِيهُو طُومْسُون»
        في أنها لا تُفيد التحديد التام ويمكن أن تحيل إلى غيره من حاملي اللقب في غياب السياق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "طُومْسُون"

    # ── مرشحات المرحلة ١ ──
    - lemma: "إِلِيهُو طُومْسُون"
      source: stage1
      decision: removed
      decision_reason: >-
        هذا المرشح مطابق للمّة الموجودة «إليهو طومسون» مع التشكيل فقط؛ الإجراء المطلوب
        هو تحديث اللمّة الموجودة لا إنشاء مدخل مستقل.

    - lemma: "إِيلَايْهُو طُومْسُون"
      source: stage1
      decision: removed
      decision_reason: >-
        الصيغة «إيلايهو» غير موثّقة في الأدبيات العربية ولا في المعاجم المستعلَمة؛
        والصيغة المعيارية الأكثر شيوعاً هي «إليهو» بالياء المفردة لا المدّية المركّبة.

    - lemma: "ثُومْسُون"
      source: stage1
      decision: removed
      decision_reason: >-
        الصيغة بالثاء موثّقة في المعاجم الطبية لكنها تحيل إلى مصطلحات طبية
        (داء ثومسون، متلازمة روتموند-ثومسون) لا إلى إليهو طومسون المهندس الكهربائي.
        فضلاً عن ذلك، التناسق الداخلي يقتضي استعمال الطاء قياساً على «طوماس»
        الواردة في تعريف المجموعة ذاته.


