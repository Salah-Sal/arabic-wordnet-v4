          إديسون الكهربائية العامة لتكوين شركة جنرال إلكتريك. يُنسب إليه عدد كبير
          من الاختراعات في مجال الكهرباء والمغناطيسية، من بينها قنطرة قياس المقاومة
          التي تحمل اسمه.
