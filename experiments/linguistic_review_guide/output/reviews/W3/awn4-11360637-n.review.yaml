        الرجلان منافِسَيْن قبل الاندماج لا شريكَيْن. يفتقر التعريف أيضاً إلى ذكر
        مساهمات طومسون الاختراعية (أكثر من 700 براءة اختراع في الكهرباء والمغناطيسية).
