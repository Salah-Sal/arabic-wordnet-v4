stage1_review:
  assessment:
    concerns:
      - "تحتاج اللمّة الموجودة إلى ضبط بالشكل."
      - "يفتقر السجل إلى بدائل شائعة مثل الترجمة الحرفية للاسم (القديس لورانس)."
    observations: "المجموعة تتعلق بعلم من أعلام الجغرافيا، وهو خليج مائي في كندا. التسمية العربية الشائعة تعتمد على التعريب الصوتي للاسم الإنجليزي 'Saint Lawrence'."
  blind_candidates:
    - lemma: "خَلِيجُ سَانْت لُورَانْس"
      generation_method: tarkib
      justification: "الاسم الشائع والأكثر تداولاً في كتب الجغرافيا والإعلام العربي."
    - lemma: "خَلِيجُ القِدِّيسِ لُورَانْس"
      generation_method: tarkib
      justification: "ترجمة دلالية للاسم 'Saint Lawrence' تُستخدم أحياناً في السياقات التاريخية أو الدينية."
    - lemma: "خَلِيجُ سَان لُورَان"
      generation_method: tarkib
      justification: "تعريب صوتي للاسم الفرنسي 'Saint-Laurent' نظراً لوقوع الخليج في مقاطعة كيبيك الكندية."
    - lemma: "خَلِيجُ لُورَانْس"
      generation_method: tarkib
      justification: "صيغة مخففة بحذف كلمة 'سانت'."

