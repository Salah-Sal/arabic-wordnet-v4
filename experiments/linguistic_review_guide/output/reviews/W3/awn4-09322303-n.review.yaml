stage4_content:
  definition:
    current: "ذراع من شمال غرب المحيط الأطلسي قبالة الساحل الجنوبي الشرقي لكندا"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية؛ يفضل صياغته بأسلوب معجمي يبرز كونه مصباً نهرياً كبيراً."
    authored:
      - type: encyclopedic
        text: "جُزْءٌ مِنَ الْمُحِيطِ الأَطْلَسِيِّ يَقَعُ فِي الشَّمَالِ الْغَرْبِيِّ، عِنْدَ السَّاحِلِ الشَّرْقِيِّ لِكَنَدَا، وَتَصُبُّ فِيهِ مِيَاهُ نَهْرِ سَانْت لُورَانْس، وَيُعَدُّ مَصَبًّا مَائِيًّا كَبِيرًا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09322303-n", definition_index: 0, text: "جُزْءٌ مِنَ الْمُحِيطِ الأَطْلَسِيِّ يَقَعُ فِي الشَّمَالِ الْغَرْبِيِّ، عِنْدَ السَّاحِلِ الشَّرْقِيِّ لِكَنَدَا، وَتَصُبُّ فِيهِ مِيَاهُ نَهْرِ سَانْت لُورَانْس."}
  examples:
    per_lemma:
      - lemma: "خَلِيجُ سَانْت لُورَانْس"
        examples:
          - text: "يُعَدُّ خَلِيجُ سَانْت لُورَانْس أَحَدَ أَكْبَرِ مَصَابِّ الأَنْهَارِ فِي الْعَالَمِ."
