# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13976275-n (villeinage / villainage)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان بدون تشكيل كامل"
      - "التعريف الحالي يستخدم لفظ «العبودية» وهو جزء من اللمّة الأولى، ممّا يُحدث شبه دَوَران"
      - "مفهوم الـvilleinage مفهوم إقطاعي أوروبي خاصّ، يختلف عن الرِّقّ العامّ في التراث العربي الإسلامي"
    observations: "المفهوم يشير إلى وضع قانوني محدّد في النظام الإقطاعي الأوروبي حيث يُربَط الفلّاح بالأرض ولا يملك حرية الانتقال، وهو يختلف عن مفهوم العبودية المطلقة (الرِّقّ) في الفقه الإسلامي. لفظ «القِنّ» في العربية يقترب من هذا المفهوم لأنّه يدلّ على العبد الذي مُلِك هو وأبوه، والقَنَانَة مصدره الدالّ على هذه الحالة."
  blind_candidates:
    - lemma: "قَنَانَة"
      generation_method: ishtiqaq
      justification: "مصدر من القِنّ على وزن فَعَالَة للدلالة على حالة العبودية المتوارثة، مذكور في القاموس المحيط: «بَيِّنُ القُنُونَةِ والقَنَانَةِ»"
    - lemma: "قِنِّيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من القِنّ للدلالة على حالة كون المرء قِنًّا، ذكره لين: «The state, or condition, of slavery»"
    - lemma: "رِقُّ الْأَرْضِ"
      generation_method: tarkib
      justification: "مركب إضافي يجمع بين الرِّقّ (العبودية) والأرض (الارتباط بها) للدلالة على العبودية المرتبطة بالأرض"
    - lemma: "مُقْطَعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من المُقْطَع (التابع الإقطاعي) للدلالة على حالة الخضوع الإقطاعي، ورد في المورد الحديث ترجمةً لـ vassalage"

stage2_evidence:
  per_lemma:
    - lemma: "عُبُودِيَّةُ الْأَرْضِ"
      confirm:
        - text: "«القِنانة؛ عُبودية الأرض.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«(1) عُبودية political servitude (2) الأشغال الشاقة penal servitude (3) حقّ الارتفاق (ق).»"
          source: "المورد الحديث (2008)"
          addition: "لفظ عبودية يتعدّد استعماله في سياقات مختلفة: سياسية وجنائية وقانونية"
    - lemma: "قَنَانَة"
      confirm:
        - text: "«بَيِّنُ القُنُونَةِ والقَنانَةِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«القِنُّ: العبدُ المُتعبَّد... وهو الذي في العبودة إلى آباء»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
        - text: "«القِنّ، وَهُوَ الْعَبْدُ الَّذِي مُلِكَ هُوَ وَأَبُوهُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«القن: هو العبد الذي لا يجوز بيعه ولا اشتراؤه.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "الجرجاني يضيف قيد عدم جواز البيع والشراء، وهو يقترب من مفهوم الـvillein المرتبط بالأرض"
        - text: "«القنّ في الفقه العبد الذي لا حرية فيه بوجه»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التعريف الفقهي يؤكد انعدام الحرية الكامل"
    - lemma: "قِنِّيَّة"
      confirm:
        - text: "«قِنِّيَّةٌ The state, or condition, of slavery.»"
          source: "المعجم العربي الإنجليزي لإدوارد وليام لين"
      expands:
        - text: "«خالِصُ العُبودَةِ، بَيِّنُ القُنُونَةِ والقَنانَةِ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "القاموس يذكر القنونة والقنانة لا القنّية، مما يشير إلى أنّ قنّية أقل شيوعاً"
    - lemma: "رِقُّ الْأَرْضِ"
      evidence_status: "no_material_found"
    - lemma: "مُقْطَعِيَّة"
      contradicts:
        - text: "«(1) المُقْطَعيَّة: حالة المُقْطَع أو وضعُهُ أو الخدمات المفروضة عليه (2) إقطاعة (3) جماعة المُقْطَعين (4) خضوع؛ عبوديّة.»"
          source: "المورد الحديث (2008)"
          conflict: "المقطعية تقابل vassalage لا villeinage؛ الـvassal هو التابع النبيل، أمّا الـvillein فهو الفلّاح المرتبط بالأرض"

stage3_analysis:
  per_lemma:
    - lemma: "عُبُودِيَّةُ الْأَرْضِ"
      decision: confirmed
      decision_reason: "مركب إضافي ثابت مسجّل في المورد الحديث ترجمةً لـserfdom، ويعبّر بوضوح عن ارتباط العبودية بالأرض وهو جوهر مفهوم الـvilleinage"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على البعد المكاني والارتباط بالأرض، وهو تعبير وصفي شفّاف المعنى يفهمه القارئ العربي مباشرة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُبُودِيَّةُ الْأَرْضِ"
    - lemma: "قَنَانَة"
      decision: confirmed
      decision_reason: "مصدر عربي أصيل مذكور في القاموس المحيط دالّ على حالة كون المرء قِنًّا، وهو أقرب مقابل عربي تراثي لمفهوم الـvilleinage"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح تراثي مفرد مشتقّ من القِنّ، يركّز على الوضع القانوني للشخص لا على ارتباطه بالأرض تحديداً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَنَانَة"
    - lemma: "قِنِّيَّة"
      source: stage1
      decision: removed
      decision_reason: "وردت عند لين فقط ولم تُسجَّل في المعاجم العربية الأصيلة التي فضّلت القَنَانَة والقُنُونَة، فهي صيغة نادرة لا تضيف جديداً"
    - lemma: "رِقُّ الْأَرْضِ"
      source: stage1
      decision: removed
      decision_reason: "مركب غير مسكوك ولا مسجّل في أيّ معجم، ويمكن استبدال «رقّ» بـ«عبودية» فيبقى صالحاً وصفيّاً، ممّا يعني أنّه ليس مصطلحاً ثابتاً"
    - lemma: "مُقْطَعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المقطعيّة تقابل vassalage وهي حالة التابع النبيل، لا villeinage وهي حالة الفلّاح المسترقّ. الفرق جوهري في النظام الإقطاعي"

