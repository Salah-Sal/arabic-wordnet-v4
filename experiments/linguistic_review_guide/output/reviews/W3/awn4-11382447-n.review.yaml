# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-11382447-n  |  ILI: i97277
# John Venn — English logician who introduced Venn diagrams (1834-1923)
# تاريخ المراجعة: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. التوليد الأعمى (قبل الاطلاع على اللمّات الموجودة)
  # المدخل: synset_info_masked.yaml — التعريف فقط:
  #   "عالم منطق إنجليزي قدم مخططات فن (1834-1923)"
  # الملاحظة: التعريف نفسه يتضمّن "فن" بوصفها جزءاً من الاسم المُعرَّب
  # (مخططات فن = Venn diagrams)، وهذا يشير مباشرةً إلى الشكل المُعرَّب للّقب.
  # توليد المرشحات ينصبّ على ضبط التهجئة وتنويع أشكال الاسم.
  blind_candidates:
    - lemma: "جُونْ فِين"
      generation_method: taarib
      justification: >
        التعريب الكامل للاسم الأجنبي "John Venn" وفق قواعد التعريب الصوتي:
        "جون" لـ John (الجيم+واو+نون)، و"فين" لـ Venn (فاء+ياء+نون)
        بإدراج حرف مدّ (ياء) للتعبير عن صائت الـ"e" في "Venn".
        هذا الشكل أقرب للنطق الأصلي وأقل إيهاماً بكلمة "فَنّ" العربية.

    - lemma: "فِين"
      generation_method: taarib
      justification: >
        اللقب منفرداً بصيغته الصوتية الصحيحة، يُستخدم في السياقات التقنية
        عند الإشارة إلى "مخطط فين"، وهو الشكل الأنسب اختصاراً في المصطلحات
        الرياضية والمنطقية.

    - lemma: "جُونْ هِنرِي فِين"
      generation_method: taarib
      justification: >
        الاسم الكامل لجون هنري فين (John Henry Venn) مُعرَّباً بالصيغة الثلاثية
        (الاسم الأول + الاسم الأوسط + اللقب)، وهو الأوثق تعريفاً في المصادر
        الأكاديمية الرسمية التي تتطلب التمييز عن أقاربه (والده ريفرند جون فين).

    - lemma: "فَنّ"
      generation_method: taarib
      justification: >
        صيغة بديلة مشددة النون تُحاكي صوت الـ"n" المزدوج في "Venn"، إلا أن
        تشابهها مع "فَنّ" العربية (= art, discipline) يُشكّل اشتراكاً لفظياً
        مُضلِّلاً ومعيباً، وهذا الشكل يُدرَج للنظر في مدى مقبوليته.

  # ب. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - >
        اللمّة "فن" تطابق تماماً الكلمة العربية الفصيحة "فَنّ" (= الحرفة، النوع،
        الطريقة) مما يُحدث اشتراكاً لفظياً صارخاً ويُوهم القارئ بأن المقصود
        "عالِمُ الفنون" لا عالِمُ المنطق جون فين.
      - >
        التعريف الحالي "عالم منطق إنجليزي قدم مخططات فن (1834-1923)" يحتوي على
        "مخططات فن" التي تُقرأ مباشرةً بمعنى "مخططات الفنون"، وليس مخططات جون فين
        (Venn diagrams)، مما يجعل التعريف ملتبساً ودالاً على معنى خاطئ.
      - >
        التهجئة "فن" (بدون ياء مدّ) تخالف المعيار الصوتي لاسم "Venn"؛
        إذ تنطوي على مقطع مفرد قصير، بينما صوت "e" في "Venn" يقتضي حرف مدّ
        (ياء) في التعريب وفق قواعد مجامع اللغة العربية.
      - >
        pos المجموعة مضبوط على "n" (اسم عام)، في حين أن الكيان اسم علَم
        لشخص بعينه، والأنسب أن يكون "proper_noun".
      - >
        غياب التشكيل الكامل عن اللمّتين "جون فن" و"فن" في AWN4.
    observations: >
      المجموعة تُمثّل اسم عَلَم لشخصية تاريخية (عالم المنطق البريطاني جون هنري فين،
      1834-1923)، وهي من أكثر الأسماء شيوعاً في الرياضيات عبر نسبة "مخططات فين"
      إليه. الإشكال الجوهري هنا ليس معجمياً اشتقاقياً بل صوتي تعريبي: الشكل
      الصحيح للّقب في اللغة العربية المعيارية هو "فِين" لا "فَن"، كما تُثبت معاجم
      المصطلحات المتخصصة (المعجم الموحد للرياضيات والفلك 1990). ورود "فن" غير
      مُشكَّلة في AWN4 يفتح الباب لتفسيرات متعارضة. كذلك تجدر مراجعة التعريف
      العربي الذي يُعيد استخدام "فن" دون أن يُميّزها من الكلمة العربية المشتركة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: استعلامات قاعدة البيانات نفّذت بالترتيب:
  # [Q1] مطابقة دفعية: فن، الفن، فين، الفين، جون فن، جون فين
  # [Q2] جسر إنجليزي: Venn, John Venn, Venn diagram
  # [Q3] FTS بالكلمات المفتاحية: مخطط، مخططات، منطق، دائري
  # المجموع: ٣ استعلامات

  per_lemma:

    - lemma: "جون فن"
      expands:
        - text: >
            «سمّي مخطط Venn نسبةً إلى العالم John Venn، (1834-1923)
            وهو عالم منطقٍ إنكليزي من جامعة Cambridge.»
          source: "معجم مصطلحات المعلوماتية (2000) — مدخل: مخطط Venn"
          addition: >
            يُثبت الدليل أن الاسم John Venn مقترن بـ"مخطط Venn" في السياق التقني
            العربي، غير أنه لا يُثبت شكل التعريب المعتمد للاسم منفرداً.
      contradicts:
        - text: >
            «الفَنُّ: الحالُ، والضَّرْبُ من الشيءِ... والطَّرْدُ، والغَيْنُ،
            والمَطْلُ، والعَناءُ...»
          source: "القاموس المحيط للفيروزآبادي — مدخل: الفَنّ"
          conflict: >
            "فن" كلمة عربية فصيحة ذات معانٍ راسخة (نوع، حال، فن)؛ استخدامها
            لمّةً لاسم علَم أجنبي يُحدث اشتراكاً لفظياً مُضلِّلاً.
        - text: >
            «(الْفَنّ) هُوَ التطبيق العملي للنظريات العلمية بالوسائل الَّتِي
            تحققها ويكتسب بالدراسة والمرانة...»
          source: "المعجم الوسيط — مدخل: الفنّ"
          conflict: >
            "فن" في العربية المعاصرة راسخة الدلالة على "الفن/الحرفة"، مما يُربك
            القارئ حين تُستخدم بوصفها تعريباً للقب Venn.

    - lemma: "فن"
      contradicts:
        - text: >
            «(فَنَّ) الْفَاءُ وَالنُّونُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا
            عَلَى تَعْنِيَةٍ، وَالْآخَرُ عَلَى ضَرْبٍ مِنَ الضُّرُوبِ فِي
            الْأَشْيَاءِ كُلِّهَا.»
          source: "مقاييس اللغة لابن فارس — مدخل: فَنَّ"
          conflict: >
            "فن" ذات أصل عربي موثّق بمعنى النوع والضرب، فاستخدامها اسمَ علَم
            أجنبي يُفضي إلى تداخل دلالي وخلط معجمي.
        - text: >
            «(الْفَنّ) هُوَ التطبيق العملي للنظريات العلمية...»
          source: "المعجم الوسيط — مدخل: الفنّ"
          conflict: >
            الكلمة حيّة الاستخدام في العربية المعاصرة بمعنى "فن/art"، فلا يصحّ
            أن تُدرج في AWN4 بوصفها تعريباً للقب Venn دون تمييز.

    - lemma: "جُونْ فِين"
      source: stage1
      confirm:
        - text: >
            «مخطط فين — Venn diagram»
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — مدخل: مخطط فين"
          addition: >
            يُثبت المعجم المتخصص الصادر عن منظمة ألكسو أن التعريب المعتمد للّقب
            Venn في السياق العلمي العربي هو "فين" (بالياء)، وهذا يُرسّخ أن
            "جون فين" أدقّ من "جون فن".
        - text: >
            «سمّي مخطط Venn نسبةً إلى العالم John Venn، (1834-1923) وهو عالم
            منطقٍ إنكليزي من جامعة Cambridge.»
          source: "معجم مصطلحات المعلوماتية (2000) — مدخل: مخطط Venn"

    - lemma: "فِين"
      source: stage1
      confirm:
        - text: >
            «مخطط فين — Venn diagram»
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990) — مدخل: مخطط فين"
      expands:
        - text: >
            «فِينُ: بالكسر ثم السكون، ونون: من قرى قاشان من نواحي أصبهان.»
          source: "معجم البلدان لياقوت الحموي — مدخل: فِين"
          addition: >
            "فين" وردت في معجم البلدان اسمَ موضع جغرافي، مما يُثبت أن التسلسل
            الصوتي (ف+ي+ن) مأنوس في العربية ولا يُسبّب إشكالاً معجمياً، خلافاً
            لـ"فن".

    - lemma: "جُونْ هِنرِي فِين"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "فَنّ"
      source: stage1
      contradicts:
        - text: >
            «(فَنَّ) الْفَاءُ وَالنُّونُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا
            عَلَى تَعْنِيَةٍ، وَالْآخَرُ عَلَى ضَرْبٍ مِنَ الضُّرُوبِ فِي
            الْأَشْيَاءِ كُلِّهَا.»
          source: "مقاييس اللغة لابن فارس — مدخل: فَنَّ"
          conflict: >
            "فنّ" (بالتشديد) كلمة عربية صميمة دالّة على النوع والحرفة، فاستخدامها
            تعريباً للّقب Venn يُعمّق الاشتراك اللفظي بدلاً من حلّه.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "جون فن"
      decision: confirmed
      decision_reason: >
        اللمّة هي الصيغة الأكثر شيوعاً للاسم الكامل "John Venn" في AWN4 وتظل
        مرجعاً للمستخدمين الحاليين، غير أن تهجئة اللقب تحتاج تصحيحاً من "فن"
        إلى "فين" وفق المعيار الموحّد لألكسو، مع إضافة التشكيل الكامل.
        تُبقى هذه اللمّة في المجموعة وتُعدَّل إلى "جُونْ فِين".
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        صيغة الاسم الكامل (الاسم الأول + اللقب)؛ تُستخدم في السياقات الرسمية
        والأكاديمية وفي التوثيق التاريخي حين يُراد التعريف الصريح بالشخص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُونْ فِين"

    - lemma: "فن"
      decision: removed
      decision_reason: >
        "فن" كلمة عربية فصيحة راسخة الدلالة (فنّ = art / discipline / type)،
        وإدراجها لمّةً لاسم علَم أجنبي يُحدث اشتراكاً لفظياً خطيراً ويُضلّل
        القارئ. فضلاً عن ذلك، التهجئة غير دقيقة صوتياً (Venn تقتضي ياء مدّ).
        تُستبدل بـ"فِين" التي أثبتت المعاجم المتخصصة معياريّتها.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "جُونْ فِين"
      source: stage1
      decision: confirmed
      decision_reason: >
        الشكل المُصحَّح للمّة "جون فن" وفق المعيار الصوتي لتعريب Venn
        (المعجم الموحد للرياضيات والفلك 1990). الإجراء يُنفَّذ عبر update_lemma
        على المدخل الموجود لـ"جون فن" (انظر أعلاه)، لا بإنشاء مدخل جديد.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل المعيّن، يُستخدم في الاستشهادات الأكاديمية والتوثيق التاريخي.

    - lemma: "فِين"
      source: stage1
      decision: confirmed
      decision_reason: >
        اللقب منفرداً بصيغته المعيارية الموثّقة في المعجم الموحد لمصطلحات
        الرياضيات والفلك (ألكسو، 1990). "فين" لا تطابق كلمة عربية شائعة،
        والتسلسل الصوتي (ف+ي+ن) مأنوس في العربية (فِين في معجم البلدان).
        تُضاف بوصفها اللقب المختصر المستخدم في الأوساط التقنية ("مخطط فين").
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صيغة اللقب المنفرد؛ تُستخدم في السياقات التقنية والرياضية المختصرة
        (كـ"مخططات فين") حين لا يكون ذكر الاسم الأول ضرورياً.
      actions:
        - command: create_entry
          params:
            lemma: "فِين"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "جُونْ هِنرِي فِين"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الكامل الثلاثي (John Henry Venn) لا يرد في المصادر العربية
        ولا في معاجم المصطلحات. الاستخدام المعتاد في العربية هو "جون فين"
        (الاسم الأول + اللقب) دون الاسم الأوسط. إضافة الاسم الأوسط "هنري"
        تُطيل اللمّة دون ضرورة اصطلاحية.

    - lemma: "فَنّ"
      source: stage1
      decision: removed
      decision_reason: >
        "فنّ" (بالتشديد) كلمة عربية صميمة تعني الحرفة والنوع وما يُنسب إلى
        الإبداع الإنساني، فاستخدامها تعريباً للّقب Venn يُعمّق الاشتراك
        اللفظي ويُقحم إيهاماً دلالياً إضافياً.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
