stage1_review:
  assessment:
    concerns:
      - "لمّة 'صاحب المركز الثاني' عبارة وصفية حرة تفشل اختبار السكّ: يمكن إبدال 'صاحب' بـ'حائز' أو 'حامل' ويبقى التعبير وصفاً سليماً، مما يدل على أنه ليس وحدة معجمية ثابتة ولا مصطلحاً مسكوكاً"
      - "لمّة 'وصيف' خالية من التشكيل، ومعناها الكلاسيكي الموثَّق في جميع المعاجم المعتمدة هو 'الخادم/الغلام دون المراهق'، لا المتسابق الثاني"
      - "التعريف الحالي يقيّد المفهوم بـ'السباق' (race) وحده، في حين أن runner-up يشمل كل أنواع المنافسات والبطولات"
    observations: "المجموعة تعالج مفهوماً رياضياً وتنافسياً واضحاً هو 'الحالّ ثانياً في منافسة'. لمّة 'وصيف' حاضرة في الاستخدام المعاصر وشائعة في الإعلام العربي، لكن جذرها الأصيل (و-ص-ف) مرتبط بالوصف والتحلية، وانتقل الاستخدام في المعاجم الحديثة تحديداً نحو مسابقات الجمال. أما 'صاحب المركز الثاني' فمجرد توصيف لا يرقى لمستوى المصطلح. تفتقر المجموعة إلى مصطلح كلاسيكي أصيل يُعبّر تعبيراً دقيقاً عن المفهوم."

  blind_candidates:
    - lemma: "الرَّدِيف"
      generation_method: majaz
      justification: "من جذر ر-د-ف على وزن فَعِيل؛ الرديف هو الراكب خلف الراكب والتابع للمتقدم مباشرة. إحياء لمعنى أصيل يقوم على الاتباع اللصيق، مما يجعله مرشحاً مجازياً للدلالة على الثاني في منافسة."
    - lemma: "المُثَنِّي"
      generation_method: ishtiqaq
      justification: "من جذر ث-ن-ي على وزن مُفَعِّل؛ دلالة الوزن على من يجعل الشيء ثانياً أو يأتي في مرتبة الاثنين. اشتقاق مباشر من دلالة العدد الثاني."
    - lemma: "مُحْرِز الفِضَّة"
      generation_method: tarkib
      justification: "تركيب إضافي يعتمد الرمز الأولمبي للمركز الثاني (الميدالية الفضية). مبني على الاستخدام الإعلامي الرياضي المتداول، ويُحدد المرتبة بدلالة معدنية واضحة."
    - lemma: "اللَّاحِق الأَوَّل"
      generation_method: tarkib
      justification: "تركيب وصفي: اسم فاعل 'لاحق' + وصف 'أول' لتخصيص مرتبته بين اللاحقين بالفائز. يعني 'أول من يلحق بالمتصدر' أي الثاني في ترتيب الوصول."


stage2_evidence:
  per_lemma:
    - lemma: "وصيف"
      contradicts:
        - text: "«الوَصِيفُ: الخادمُ، غلاماً كان أو جارية؛ الغلامُ دون المراهِق»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "المرجع الأكثر موثوقية (OCR) لا يذكر لـ'وصيف' أي دلالة على المتسابق الثاني؛ المعنى محصور بالخادم/الغلام"
        - text: "«الوصيف: الْمَوْصُوف والغلام وَالْجمع وصفاء وَالْجَارِيَة وصيفة»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "مصدر كلاسيكي مستقل يؤكد حصر المعنى في الخادم/الموصوف"
        - text: "«(الوصيف) الْخَادِم غُلَاما كَانَ أَو جَارِيَة والغلام دون الْمُرَاهق (ج) وصفاء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "تأكيد ثالث من مصدر مستقل: الوصيف = الخادم فحسب"
      expands:
        - text: "«(1) المُصَلِّي: المتسابق الذي يتلو السابقَ (2) الوصيفة الأولى [التي تحلّ ثانيةً في مباريات ملكات الجَمال]»"
          source: "المورد الحديث (2008) — ترجمة runner-up"
          addition: "المورد الحديث يقدم 'المصلي' ترجمة أولى لـrunner-up عموماً، ثم يخصص 'الوصيفة الأولى' لسياق مسابقات الجمال تحديداً؛ مما يُقيّد 'وصيف/وصيفة' بهذا السياق الضيق في المعجم المعتمد"

    - lemma: "صاحب المركز الثاني"
      evidence_status: "no_material_found"

    - lemma: "الرَّدِيف"
      expands:
        - text: "«الرَّاكِبُ خَلْفَ الرَّاكِب التالى للمُتَقَدِّمِ المُرَادِفُ من النُّجومِ: الرِّدْفُ الذى يجىءُ بِقِدْحِهِ بعد فَوْزِ أحدِ الأَيْسار»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "يذكر 'التالي للمتقدم' ضمن المعاني مما يوفر منطلقاً دلالياً للمجاز، لكنه ليس مصطلحاً مخصصاً لـrunner-up"
        - text: "«الرَّاءُ وَالدَّالُ وَالْفَاءُ أَصْلٌ وَاحِدٌ مُطَّرِدٌ، يَدُلُّ عَلَى اتِّبَاعِ الشَّيْءِ. فَالتَّرَادُفُ: التَّتَابُعُ. وَالرَّدِيفُ: الَّذِي يُرَادِفُكَ. وَسُمِّيَتِ الْعَجِيزَةُ رِدْفًا مِنْ ذَلِكَ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الاتباع والتتابع وهو الأصل الدلالي لـ'الرديف' — المعنى أعم من مجرد الثاني في منافسة"

    - lemma: "المُثَنِّي"
      contradicts:
        - text: "«مُثَنِّى من (ث ن ي) المعطوف والمردود بعضه على بعض»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الدلالة المعجمية تتعلق بالعطف اللغوي لا بالترتيب التنافسي"
        - text: "«المثْنيُّ: الَّذِي يَلِي المثلث»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "السياق موسيقي (الأوتار)، ولا ارتباط بمفهوم runner-up"
        - text: "«مُثَنَّى: حالة نحوية معبرة عن العدد الثنائي — Dual»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          conflict: "المثنى مصطلح نحوي مستقر راسخ، تخصيصه لمعنى جديد يُفضي إلى اشتراك لفظي"

    - lemma: "مُحْرِز الفِضَّة"
      evidence_status: "no_material_found"

    - lemma: "اللَّاحِق الأَوَّل"
      evidence_status: "no_material_found"

    - lemma: "المُصَلِّي"
      confirm:
        - text: "«من خيْل السِّباق: الذى يتلو السَّابق؛ يستعارُ للإنسان إذا كان تاليًا للأوَّل في أَيِّ عمل كان»"
          source: "المعجم الوسيط (مجمع اللغة العربية — OCR)"
        - text: "«(الْمصلى) من خيل السباق الَّذِي يَتْلُو السَّابِق ويستعار للْإنْسَان إِذَا كَانَ تاليا للْأولِ فِي أَي عمل كَانَ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«(1) المُصَلِّي: المتسابق الذي يتلو السابقَ»"
          source: "المورد الحديث (2008) — الترجمة الأولى لـ runner-up"


stage3_analysis:
  per_lemma:
    - lemma: "وصيف"
      decision: confirmed
      decision_reason: "رغم أن المعنى الكلاسيكي الراسخ لـ'وصيف' هو الخادم/الغلام، فإن الاستخدام المعاصر الموثَّق في المورد الحديث (2008) والممارسة الإعلامية في مسابقات الجمال يُبرر إبقاءه. يُبقى في المجموعة مع تصحيح التشكيل وتوثيق قيد السياق (مسابقات الجمال والرياضة)."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يرتبط تاريخياً بمسابقات الجمال والفروسية؛ يوحي بالقرب الشديد من الأول ومرافقته. مألوف في العربية المعاصرة خاصة في اللهجات المصرية والشامية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَصِيف"

    - lemma: "صاحب المركز الثاني"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل اختبار السكّ: يمكن إبدال 'صاحب' بـ'حائز' أو 'نائل' ويبقى التعبير وصفاً سليماً. لا وجود معجمي لها في أي مصدر. وجودها في المجموعة يحيل إلى التعريف بدلاً من المصطلح، وهو ما يُضعف المجموعة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
