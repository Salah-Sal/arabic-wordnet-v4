    - lemma: "الرَّدِيف"
      source: stage1
      decision: removed
      decision_reason: "الرديف يعني 'الراكب خلف الراكب' والتابع عموماً، ولا دليل معجمي على تخصيصه للثاني في المنافسة. الإشارة إلى 'التالي للمتقدم' في المعجم الكبير ليست كافية لتثبيته مصطلحاً لـrunner-up، إذ يبقى المعنى أعم. يُضاف إلى ذلك أن للرديف معنى البديل اللغوي (الترادف) مما يُوقع في لبس آخر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "المُثَنِّي"
      source: stage1
      decision: removed
      decision_reason: "المثنى/المثني مصطلح نحوي مستقر للدلالة على صيغة الاثنين. استخدامه لمعنى runner-up سيُحدث اشتراكاً لفظياً مع المصطلح النحوي الراسخ في المعاجم، مما يُخل بمبدأ الاطراد ويُضعف التداول."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُحْرِز الفِضَّة"
      source: stage1
      decision: removed
      decision_reason: "لا وجود معجمي لهذا التركيب. فضلاً عن ذلك يفشل اختبار السكّ (يمكن قول 'حائز الفضة'، 'نائل الميدالية الفضية'). كما أن دلالته تقتصر على المنافسات ذات الميداليات الأولمبية ولا تشمل البطولات والمباريات الأخرى."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "اللَّاحِق الأَوَّل"
      source: stage1
      decision: removed
      decision_reason: "لا وجود معجمي لهذا التركيب. وهو عبارة وصفية حرة: يمكن إبدال 'أول' بـ'الأقرب' أو 'المباشر' ويبقى الوصف صحيحاً، مما يدل على أنه ليس وحدة معجمية ثابتة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "مُصَلٍّ"
      source: stage2
      decision: confirmed
      decision_reason: "مصطلح كلاسيكي أصيل موثَّق في المعجم الوسيط بالدلالة الحرفية المطابقة لدلالة المجموعة: 'من خيل السباق الذي يتلو السابق، ويُستعار للإنسان إذا كان تاليًا للأوَّل في أيِّ عمل كان'. وهو الترجمة الأولى لـrunner-up في المورد الحديث (2008). مستوفٍ لمعايير الاطراد والفصاحة والاشتقاقية وعدم الاشتراك اللفظي. اكتُشف في المرحلة الثانية عبر الجسر الإنجليزي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح اشتُق من لغة الخيل ويدل بدقة على التالي للأول مباشرة في أي سباق أو منافسة. أكثر شمولاً من 'وصيف' ويُفضَّل في السياقات الرسمية والأدبية والإعلامية العامة."
      actions:
        - command: create_entry
          params:
            lemma: "مُصَلٍّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


