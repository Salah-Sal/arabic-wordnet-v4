# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-10520527-n  |  ILI: i92402  |  POS: n
# المفهوم: مدير/مقدم برنامج مسابقات إذاعي أو تلفزيوني
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (قراءة عمياء أولاً) ─────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان مُركَّبتان (MWE) وبلا تشكيل — يجب إضافة الضبط الكامل."
      - "مدير الأسئلة ترجمة حرفية (Calque) لـ question master؛ مدير يحمل دلالة إدارية لا تقديمية."
      - "التعريف الحالي يستخدم مضيف ورئيس بصورة متعاقبة دون تمييز دلالي بينهما."
      - "لا يوجد تعريف عربي مؤلَّف بأسلوب المعجم — التعريف ترجمة مباشرة للإنجليزية."
    observations: >
      المجموعة تصف وظيفة إعلامية متخصصة: الشخص الذي يتولى تقديم برامج المسابقات
      وإدارتها في الإذاعة أو التلفاز. المفهوم موجود في الثقافة العربية لكنه لا يزال
      يُعبَّر عنه بتعابير مركبة متعددة. الجذر الأوفى للمفهوم هو التقديم (ق-د-م)
      والإدارة (د-و-ر) والمسابقة (س-ب-ق).

  blind_candidates:
    - lemma: "رَئِيسُ الأَسْئِلَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي مقابل question master؛ رَئِيس (من رأس) بمعنى المُشرِف أو المتحكِّم،
        والأسئلة جمع سؤال — يُبرز دور الهيمنة المعرفية للمقدِّم على مجريات الأسئلة.
    - lemma: "مُسَائِل"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من الجذر سَأَلَ على وزن مُفَاعِل (مُسَاءِل) — اسم فاعل يدل على من يوجِّه
        الأسئلة باستمرار؛ الوزن يُفيد التكثير والاستمرار في الفعل، وهو جوهر مهمة مقدِّم المسابقات.
    - lemma: "مُدِيرُ الْمُسَابَقَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي يجمع مدير (من أدار-يدير من دور) + المسابقة — يُركِّز على الجانب
        الإداري والتنظيمي لسير المنافسة، وهو قريب من role chairman في السياق البريطاني.
    - lemma: "مُحَكِّمُ الْمُسَابَقَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي من حَكَّمَ (Form II من حكم) + المسابقة — يُشير إلى دور التحكيم
        والفصل في إجابات المتسابقين، وهو وجه من وجوه المهمة وإن لم يشملها كليّاً.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "مدير الأسئلة"
      expands:
        - text: "«مُدِير: من يتولى تصريف أمر من الأمور»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry_id: 943631)"
          addition: >
            يؤكد أن مدير يعني المتولي لأمر بعينه — وهو توسيع صالح لتأسيس التركيب
            مدير الأسئلة بمعنى المتولي لإدارة طرح الأسئلة.
        - text: "«مُدِير: director» في مجال الفنون والترفيه والرياضة"
          source: "مسرد الفن، التسلية والرياضة — ALECSO ArabTerm (entry_id: 493575)"
          addition: >
            يُثبت استخدام مدير بمعنى director في سياق الترفيه والرياضة مما يُقرِّب التركيب
            من السياق الإعلامي المطلوب.
      contradicts:
        - text: "«مَضَى فُلَانٌ قُدُمًا، لَمْ يُعَرِّجْ وَلَمْ يَنْثَنِ»"
          source: "مقاييس اللغة لابن فارس — باب دور (entry_id: 986362)"
          conflict: >
            جذر دور في أصله يدل على الإحداق والدوران لا على السيطرة المعرفية
            أو إدارة الأسئلة؛ المعنى الإداري الحديث لمدير تطور بعيداً عن الأصل، مما يجعل
            التركيب مدير الأسئلة اصطلاحاً حديثاً بلا سند كلاسيكي.

    - lemma: "مقدم مسابقات"
      confirm:
        - text: "«مُقدِّم: host» في مجال الإعلام والتواصل"
          source: "مسرد الإعلام والتواصل — ALECSO ArabTerm (entry_id: 484559)"
        - text: "«مُقدِّم: presenter» في مجال الإعلام والتواصل"
          source: "مسرد الإعلام والتواصل — ALECSO ArabTerm (entry_id: 485642)"
        - text: "«مُقَدِّم البرامج: telecaster» في مجال الإعلام والتواصل"
          source: "مسرد الإعلام والتواصل — ALECSO ArabTerm (entry_id: 486672)"
      expands:
        - text: "«المذيع الرئيس الذي يُقدِّم نشرة الأخبار المتلفزة»"
          source: "مسرد الإعلام والتواصل — ALECSO ArabTerm (entry_id: 483261)"
          addition: >
            يُثبت أن مُقَدِّم قد استقرَّ في الاصطلاح الإعلامي العربي ليدل على
            شخص يتولى تقديم برنامج؛ امتداده إلى مقدم مسابقات طبيعي وغير مُكلَّف.
        - text: "«الْقَافُ وَالدَّالُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَبْقٍ وَرَعْفٍ»"
          source: "مقاييس اللغة لابن فارس — باب قدم (entry_id: 988241)"
          addition: >
            الجذر قدم يدل على التقدم والسبق، وهو ما يُعزز صيغة مُقَدِّم (المتقدِّم/
            المُصدِّر) كاسم فاعل يناسب دور الشخص الذي يتصدر البرنامج ويُقدِّم مادته.

    - lemma: "رَئِيسُ الأَسْئِلَة"
      evidence_status: "no_material_found"

    - lemma: "مُسَائِل"
      contradicts:
        - text: "«المَسَائل: هي المطالب التي يُبرهَن عليها في العلم ويكون الغرض من ذلك
            العلم معرفتها»"
          source: "كتاب التعريفات للشريف الجرجاني (entry_id: 795589)"
          conflict: >
            مسائل في التراث العربي جمع مسألة بمعنى قضية علمية أو فقهية — لا صلة
            لها باسم الفاعل مُسَائِل (المُستجوِب). الخلط بين الجمع والمشتق يُضعف
            قبول هذا المرشح.
        - text: "«السِّينُ وَالْهَمْزَةُ وَاللَّامُ كَلِمَةٌ وَاحِدَةٌ. يُقَالُ سَأَلَ يَسْأَلُ
            سُؤَالًا وَمَسْأَلَةً. وَرَجُلٌ سُؤَلَةٌ: كَثِيرُ السُّؤَالِ»"
          source: "مقاييس اللغة لابن فارس — باب سأل (entry_id: 986865)"
          conflict: >
            ابن فارس يُسجِّل سؤلة (صيغة مبالغة) للدلالة على كثير السؤال؛ أما مُسَائِل
            على وزن مُفَاعِل فيشيع في العربية الحديثة بمعنى المُستجوِب ذي الصلاحية
            القانونية أو السياسية، لا مقدم برنامج ترفيهي.

    - lemma: "مُدِيرُ الْمُسَابَقَة"
      evidence_status: "no_material_found"

    - lemma: "مُحَكِّمُ الْمُسَابَقَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مدير الأسئلة"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي مدير الأسئلة مقبول بوصفه مصطلحاً إعلامياً مُقنَّناً يُعادل
        question master؛ مدير موثَّق في سياق الفنون والترفيه بمعنى director/manager،
        وإضافة الأسئلة تُحدِّد النطاق. التعبير يجتاز اختبار السكّ (لا يمكن إبدال
        أسئلة بمرادف كأسئلة←استفسارات وإبقاء المصطلح). يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الجانب الإشرافي والسلطوي — مدير يضمر التحكُّم في مسار الأسئلة
        وتقييم الإجابات؛ يناسب السياق الذي تبرز فيه هيئة المنافسة أكثر من شخصية
        المُقدِّم الإعلامي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدِيرُ الأَسْئِلَة"

    - lemma: "مقدم مسابقات"
      decision: confirmed
      decision_reason: >
        مقدم راسخ في الاصطلاح الإعلامي العربي (host/presenter — ARABTERM مسرد الإعلام)؛
        التركيب مقدم مسابقات شائع في الصحافة والإذاعة العربية، وهو التعبير الأكثر
        طبيعية وتداولاً. يجتاز اختبار السكّ (لا يُعوَّض مسابقات بمنافسات في السياق
        الإعلامي دون تغيير المعنى الضمني). يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الطابع الإعلامي والتقديمي — مقدِّم يضمر الوجه الجماهيري والتواصلي
        مع المشاهدين والمتسابقين؛ يشمل دور المُذيع المضيف الذي يُسيِّر البرنامج
        ويصنع التشويق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقَدِّمُ مُسَابَقَات"

    - lemma: "رَئِيسُ الأَسْئِلَة"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية. رئيس يحمل ثقلاً هرمياً مؤسسياً (رئيس حزب، رئيس دولة)
        لا يناسب وظيفة مقدم برنامج ترفيهي؛ فضلاً عن أنه مكرر دلالياً مع المرشح
        مدير الأسئلة الموجود أصلاً.

    - lemma: "مُسَائِل"
      source: stage1
      decision: removed
      decision_reason: >
        وزن مُفَاعِل يُنتج مُسَائِل بمعنى المُستجوِب ذي الصلاحية (مساءلة الحكومة)،
        لا مقدِّم برنامج ترفيهي. فضلاً عن ذلك، تُوهِم الصورة الكتابية مسائل بالجمع
        (جمع مسألة) مما يُنشئ اشتراكاً لفظياً مُربِكاً. يرفضه مبدأ يُسر التداول.

    - lemma: "مُدِيرُ الْمُسَابَقَة"
      source: stage1
      decision: removed
      decision_reason: >
        مكرر بنيوياً مع مدير الأسئلة الموجود — كلاهما يبدأ بمدير ويختلفان في المضاف
        إليه فقط. الأولوية للمصطلح الموجود. لا أدلة معجمية لهذا التركيب بحد ذاته.

    - lemma: "مُحَكِّمُ الْمُسَابَقَة"
      source: stage1
      decision: removed
      decision_reason: >
        محكِّم يدل في العربية على القاضي/الحكَم الذي يفصل في النزاعات، وهو دور
        مختلف عن دور المقدِّم الإعلامي؛ خلط المفهومين يُفضي إلى الضبابية الدلالية.
        يرفضه فحص الملاءمة (مبدأ الاطراد ودقة الإيحاء).


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مضيف أو رئيس برنامج مسابقات إذاعي أو تلفزيوني"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يُجمِع بين مضيف ورئيس بالعطف كأنهما بديلان متساويان،
        دون أن يُحدِّد المهمة الفعلية. مضيف في العربية الحديثة يُوحي بالضيافة
        الاجتماعية أكثر من الوظيفة الإعلامية. التعريف ترجمة حرفية مباشرة لا يتبنى
        أسلوب المعجم (جنس قريب + فصل نوعي).
    authored:
      - type: terminological
        text: >
          شَخْصٌ يَتَوَلَّى تَقْدِيمَ بَرَامِجِ الْمُسَابَقَاتِ الإِذَاعِيَّةِ أَوِ التِّلِفَازِيَّةِ،
          يُوَجِّهُ الأَسْئِلَةَ إِلَى الْمُتَسَابِقِينَ وَيُدِيرُ مَجْرَيَاتِ الْمُنَافَسَةِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مُقَدِّمُ بَرَامِجِ الْمُسَابَقَاتِ الإِذَاعِيَّةِ وَالتِّلِفَازِيَّةِ: يُسِيِّرُ حَلَقَاتِ
          الْبَرْنَامَجِ، وَيَطْرَحُ الأَسْئِلَةَ الثَّقَافِيَّةَ وَالتَّرْفِيهِيَّةَ عَلَى الْمُتَسَابِقِينَ،
          وَيُعْلِنُ النَّتَائِجَ وَيَمْنَحُ الْجَوَائِزَ وَيَصُونُ إِيقَاعَ الْبَرْنَامَجِ الزَّمَنِيَّ.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10520527-n"
          definition_index: 0
          text: >
            شَخْصٌ يَتَوَلَّى تَقْدِيمَ بَرَامِجِ الْمُسَابَقَاتِ الإِذَاعِيَّةِ أَوِ التِّلِفَازِيَّةِ،
            يُوَجِّهُ الأَسْئِلَةَ إِلَى الْمُتَسَابِقِينَ وَيُدِيرُ مَجْرَيَاتِ الْمُنَافَسَةِ.
      - command: add_definition
        params:
          synset_id: "awn4-10520527-n"
          text: >
            مُقَدِّمُ بَرَامِجِ الْمُسَابَقَاتِ الإِذَاعِيَّةِ وَالتِّلِفَازِيَّةِ: يُسَيِّرُ حَلَقَاتِ
            الْبَرْنَامَجِ، وَيَطْرَحُ الأَسْئِلَةَ الثَّقَافِيَّةَ وَالتَّرْفِيهِيَّةَ عَلَى الْمُتَسَابِقِينَ،
            وَيُعْلِنُ النَّتَائِجَ وَيَمْنَحُ الْجَوَائِزَ.

