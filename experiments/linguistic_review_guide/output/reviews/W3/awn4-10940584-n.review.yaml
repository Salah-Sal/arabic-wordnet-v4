# pos       : n
# الموضوع  : لويس داغير — مخترع الداغيريتيب الفرنسي (١٧٨٩-١٨٥١)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "تكرار كلمة 'عملية' في التعريف العربي ('أول عملية تصوير فوتوغرافي عملية'): الأولى اسمٌ بمعنى «process» والثانية صفةٌ بمعنى «practical»، مما يُربك القارئ ويُضعف الأسلوب"
      - "غياب التشكيل الكامل عن اللمّتين الموجودتين (داغير، لويس داغير)"
      - "الاسم الرسمي الكامل للمخترع (لويس جاك مانيه داغير) غائب كلمّة، رغم وروده في المقابلات الإنجليزية في OEWN"
      - "التعريف يستخدم 'الداغيرية' مقابل Daguerreotype؛ وقد استخدم المورد الحديث (2008) الصيغة 'الدَّغَرية / التصوير الدَّغَريّ' بدلاً منها — يستحسن توحيد المصطلح"
      - "الأعداد في التعريف (1789-1851) بالأرقام اللاتينية، يُستحسن استخدام الأرقام العربية الهندية"
    observations: >
      هذه المجموعة تمثّل اسم علَم شخصيٍّ لمخترع فرنسي بارز، هو لويس داغير (١٧٨٩-١٨٥١)،
      مبتكر أول عملية للتصوير الضوئي القابل للتطبيق العملي والمعروف بالداغيريتيب.
      اللمّتان الموجودتان تعريبان صحيحان للاسم الأجنبي، إلا أنهما تفتقران إلى التشكيل،
      ولا تشملان الاسم الرسمي الكامل الرباعي. ولمّا كان هذا الاسم اسمَ علَم أجنبيٍّ،
      فالتعريب (taarib) هو الأسلوب الاصطلاحي الوحيد الممكن، إذ لا أصل عربي يمكن إحياؤه
      أو جذرٌ يُستقى منه اشتقاقٌ. التعريف يحتاج تنقيحاً أسلوبياً عاجلاً.

  blind_candidates:
    - lemma: "دَاغِير"
      generation_method: taarib
      justification: "تعريب مباشر للقب الفرنسي Daguerre بحذف e الأخير الصامت، وهو أشيع صور التعريب للأسماء الأعجمية المنتهية بحرف صامت؛ يُعدّ أشهر صيغة تداولاً في المراجع العربية"

    - lemma: "لُويس دَاغِير"
      generation_method: taarib
      justification: "تعريب الاسم الثنائي Louis Daguerre (الاسم الشخصي + اللقب)، وهو الصورة الموسوعية الأكثر اعتماداً في المصادر العربية الحديثة للإحالة إلى الشخص"

    - lemma: "لُويس جَاكْ مَانْدِي دَاغِير"
      generation_method: taarib
      justification: "تعريب الاسم الرسمي الكامل Louis Jacques Mandé Daguerre؛ يُستخدم في الوثائق الأكاديمية والببليوغرافيا الرسمية، وقد أدرجه OEWN ضمن اللمّات الإنجليزية للمجموعة"

    - lemma: "دَاغِيرُو"
      generation_method: taarib
      justification: "شكل تعريبي بديل يُضيف واواً لمحاكاة اللفظ الفرنسي /daɡɛʁ/، واردٌ في بعض الترجمات العربية المبكرة التي كانت تضيف واو النسب للأسماء الأعجمية المنتهية بـ r"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت: ٤ استعلامات
#  ١. مطابقة دقيقة دفعية لجميع اللمّات (النتيجة: فارغة)
#  ٢. جسر إنجليزي (Daguerre / daguerreotype) → مدخل واحد ذو صلة
#  ٣. FTS عربي (داغير / دغري / الداغيرية / التصوير الفوتوغرافي)
#  ٤. تحقق من مرشحات المرحلة ١ (النتيجة: فارغة)
stage2_evidence:
  per_lemma:
    - lemma: "دَاغِير"
      expands:
        - text: "«الدَّغَرية؛ التصوير الدَّغَريّ: طريقة قديمة في التصوير الضوئيّ بواسطة ألواح معدنية مفضّضة / صورة دَغَرية / يُدَغِّر: يُصَوِّر بهذه الطريقة»"
          source: "المورد الحديث (2008) — ترجمة عربية لـ daguerreotype"
          addition: "يُثبت أن معجم المورد الحديث اشتقَّ من اسم داغير مصطلحَ 'الدَّغَرية' للدلالة على العملية التصويرية التي ابتكرها، مع تحوّل فونولوجي طفيف (داغير → دَغَر)، مما يُعزز ارتباط الاسم باللغة العربية الحديثة المتخصصة"

    - lemma: "لُويس دَاغِير"
      evidence_status: "no_material_found"

    - lemma: "لُويس جَاكْ مَانْدِي دَاغِير"
      evidence_status: "no_material_found"

    - lemma: "دَاغِيرُو"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١ ──
    - lemma: "داغير"
      decision: confirmed
      decision_reason: "تعريب راسخ ومتداول على نطاق واسع في المراجع العربية المتخصصة والموسوعية؛ يمرّ باختبار التثبيت المعجمي لكونه وحدة معجمية ثابتة في العربية الحديثة. التشكيل الصحيح: دَاغِير."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللقب العائلي المختصر وحده، يُستخدم منفرداً في النصوص العلمية والتاريخية كرمز ضمني للمخترع، ومنه اشتُقَّ مصطلح 'الداغيريتيب / الدَّغَرية'"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دَاغِير"

    # ── لمّة موجودة ٢ ──
    - lemma: "لويس داغير"
      decision: confirmed
      decision_reason: "الاسم الثنائي الأكثر شيوعاً في الموسوعات والمراجع العربية الحديثة للإحالة إلى الشخص؛ مركَّب إضافي ثابت (اسم شخصي + لقب) يمرّ باختبار السكّ لأن مكوّناته أعلامٌ غير قابلة للاستبدال بمرادفات. التشكيل الصحيح: لُويس دَاغِير."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الثنائي (الشخصي + العائلي)، أكثر رسميةً من اللقب المفرد، يُوظَّف حين يُراد ضبط الهوية تاريخياً أو رفع الالتباس بين الأشخاص المتشاركين في اللقب"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُويس دَاغِير"

    # ── مرشح المرحلة ١ (مؤكَّد) ──
    - lemma: "لُويس جَاكْ مَانْدِي دَاغِير"
      source: stage1
      decision: confirmed
      decision_reason: "الاسم الرسمي الكامل الرباعي الوارد في OEWN (Louis Jacques Mande Daguerre)؛ غيابه من اللمّات الحالية ثغرةٌ معجمية واضحة إذ تعتمد المصادر الأكاديمية والببليوغرافيات الرسمية هذه الصورة الكاملة. مركَّب إضافي ثابت يمرّ باختبار التثبيت المعجمي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الرسمي الكامل الرباعي، يُستخدم في الوثائق الأرشيفية والببليوغرافيا الأكاديمية الرسمية وقوائم الأعلام؛ يتميّز بالشمولية ودقة التعريف الهوياتي"
      actions:
        - command: create_entry
          params: {lemma: "لُويس جَاكْ مَانْدِي دَاغِير", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    # ── مرشح المرحلة ١ (مرفوض) ──
    - lemma: "دَاغِيرُو"
      source: stage1
      decision: removed
      decision_reason: "صيغة تعريبية غير موثّقة في المعاجم العربية الحديثة؛ الإضافة الزائدة للواو لا أساس لها في تقاليد تعريب الأسماء الأعجمية المستقرة، ولا مسوِّغ صرفي لها. الصيغة المتداولة هي دَاغِير بلا واو."


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
