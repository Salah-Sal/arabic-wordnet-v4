stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية تفتقر للتشكيل الكامل."
    observations: "المفهوم يشير إلى معلم جرافي محدد (خليج تامبا)، وهو تعبير مركب إضافي (خليج + تامبا). اللمة الحالية صحيحة دلالياً ولكنها تحتاج لضبط صرفي وكتابي."
  blind_candidates:
    - lemma: "خَلِيجُ تَامْبَا"
      generation_method: tarkib
      justification: "الترجمة القياسية للمعالم الجغرافية التي تبدأ بـ Bay، حيث يُترجم 'Bay' إلى 'خليج' ويُضاف إليه الاسم العلم."
    - lemma: "جَوْنُ تَامْبَا"
      generation_method: tarkib
      justification: "استخدام 'جون' كمرادف أدق للخلجان الصغيرة أو المنحنيات الساحلية، وإن كان 'خليج' هو الأكثر شيوعاً."
    - lemma: "شَرْمُ تَامْبَا"
      generation_method: tarkib
      justification: "استخدام 'شرم' وهو لفظ عربي أصيل للخليج الصغير أو الفجوة في الساحل."
    - lemma: "تَامْبَا بَاي"
      generation_method: taarib
      justification: "التعريب الصوتي المباشر للاسم الإنجليزي، وهو مستخدم في بعض السياقات السياحية أو الملاحية الدولية."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيجُ تَامْبَا"
      confirm:
        - text: "«فَمِنْ ذَلِكَ الْخَلِيجُ، وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ»"
          source: "مقاييس اللغة"
      expands:
        - text: "«الخَلِيجُ: جَانِبٌ مِنَ البَحْرِ يَمْتَدُّ فِي البَرِّ»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "خليج تامبا"
      decision: confirmed
      decision_reason: "اللمة صحيحة دلالياً ومطابقة للمفهوم الجغرافي العالمي، ولكنها تحتاج إلى إضافة التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ تَامْبَا"
    - lemma: "جَوْنُ تَامْبَا"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من صحة 'جون' لغوياً، إلا أن 'خليج' هو المصطلح الرسمي والمستقر في الأطالس والخرائط العربية لهذا المعلم الجغرافي."

stage4_content:
  definition:
    current: "ذراع من خليج المكسيك في غرب وسط فلوريدا"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح ولكنه مقتضب جداً، يحتاج إلى صياغة أكثر دقة لغوياً لبيان طبيعة هذا المعلم الجغرافي."
    authored:
      - type: encyclopedic
        text: "مسطح مائي يمثل ذراعاً ممتداً من خليج المكسيك، يقع في المنطقة الوسطى الغربية من ساحل ولاية فلوريدا بالولايات المتحدة الأمريكية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مسطح مائي يمثل ذراعاً ممتداً من خليج المكسيك، يقع في المنطقة الوسطى الغربية من ساحل ولاية فلوريدا بالولايات المتحدة الأمريكية."
  examples:
    per_lemma:
      - lemma: "خَلِيجُ تَامْبَا"
        examples:
          - text: "يعد خَلِيجُ تَامْبَا من أهم المرافق الملاحية والسياحية على الساحل الغربي لفلوريدا."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يعد خَلِيجُ تَامْبَا من أهم المرافق الملاحية والسياحية على الساحل الغربي لفلوريدا."

