    - lemma: "شَرْم"
      sense_id: "{auto}"
      nuance: "يوحي بالضيق والعمق والتشكل الصخري (الشق)، ويستخدم بكثرة في سواحل البحر الأحمر."
      mwe: false
    - lemma: "مَصَبّ خَلِيجِيّ"
      sense_id: "{auto}"
      nuance: "ترجمة اصطلاحية دقيقة للمفهوم الإسكتلندي (Firth) الذي يجمع بين صفات المصب والخليج."
