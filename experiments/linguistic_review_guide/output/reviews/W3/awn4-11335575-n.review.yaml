# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11335575-n  |  ILI: i97005
# تشارلز بروتيوس شتاينمتز / Steinmetz
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تمثل اسم علم لشخص تاريخي بعينه؛ التوليد الأعمى للمّات ينعدم جدواه من التعريف وحده، إذ لا سبيل لاستنتاج الاسم من الوصف الوظيفي والتواريخ فحسب"
      - "اللمّتان الموجودتان خاليتان من التشكيل — وهو أمر مقبول استثنائياً للأعلام الأعجمية المعرَّبة، إذ لا تقاليد تشكيل ثابتة لأسماء من هذا النوع في المعجمية العربية"
      - "الأسماء الأعجمية المعرَّبة لا تخضع لاختبار التثبيت المعجمي العادي، ولا لمعيار اطّراد الاشتقاق"
    observations: >
      هذه المجموعة من نمط الأعلام الشخصية التاريخية (Biographical proper noun synset).
      المقصود بها المهندس الكهربائي والمخترع الأمريكي من أصل ألماني تشارلز بروتيوس شتاينمتز (1865-1923)،
      الذي اشتُهر بإسهاماته في نظرية التيار المتردد ونظرية الهستيريا المغناطيسية في الحديد، وعمل مع شركة
      جنرال إلكتريك. التوليد الأعمى في هذا النمط ينتج بالضرورة تخمينات لصيغ تعريب مختلفة لا اشتقاقات
      دلالية؛ ذلك أن باب الاشتقاق والمجاز والتركيب مغلق أمام الأعلام الأجنبية الخاصة. الجدير بالملاحظة
      أن اللمّتين الموجودتين صحيحتان من حيث التعريب الصوتي، غير أنهما تستحقان مراجعة من حيث التشكيل
      وتوحيد الرسم.

  blind_candidates:
    - lemma: "شتاينمتز"
      generation_method: taarib
      justification: >
        نقل صوتي للقب ألماني المحتمل لمهندس أمريكي من أصل ألماني. الصيغة: ش (St) + تاين (stein) + متز (metz).
        تعريب يتبع القاعدة المعتمدة في نقل الأسماء الألمانية: 'st' → شت، 'ei' → اي، وهو الشكل الأكثر
        تداولاً في المراجع العربية لهذا النمط من الألقاب الألمانية.

    - lemma: "شتاينميتز"
      generation_method: taarib
      justification: >
        صيغة بديلة بإشباع حركة الياء في المقطع الثاني (metz ← ميتز) للتعبير عن نطق الطويلة في الألمانية.
        بعض المعجمات العربية تُفضّل هذه الصيغة الموسّعة لتوضيح النطق الأصلي.

    - lemma: "ستاينمتز"
      generation_method: taarib
      justification: >
        صيغة بديلة تُحوّل المقطع الأول 'St' إلى 'ست' بدلاً من 'شت'، وفق بعض التقاليد التعريبية
        التي تعامل 'st' كمقطع واحد مُبدوء بالسين لا الشين. أقل شيوعاً لكنها مستعملة.

    - lemma: "تشارلز شتاينمتز"
      generation_method: taarib
      justification: >
        تركيب تعريبي مختصر (الاسم الأول + اللقب) دون الاسم الأوسط؛ 'Charles' → 'تشارلز' وفق
        قواعد المجمع العربي للاسم الإنجليزي-الفرنسي المشترك. هذا الشكل المختصر هو الأكثر انتشاراً
        في الكتابة العلمية والموسوعية العربية.


