# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "تشارلز بروتيوس شتاينمتز"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخص التاريخي المقصود؛ التعريب صحيح صوتياً: 'Charles' → 'تشارلز'،
        'Proteus' → 'بروتيوس'، 'Steinmetz' → 'شتاينمتز'. هذا الشكل ضروري للتعريف الموسوعي
        والنسب الدقيق في المراجع الأكاديمية. لا تُطبَّق قاعدة التشكيل الكامل على الأعلام
        الأعجمية المعرَّبة إذ لا يوجد ضبط صوتي عربي معياري لها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل الرسمي الثلاثي؛ يُستخدم في السياقات الأكاديمية والموسوعية حيث يُشترط
        التعريف الدقيق وإزالة الإبهام عن أصحاب الألقاب المتكررة.

    # ── اللمّة الموجودة ٢ ──
    - lemma: "شتاينمتز"
      decision: confirmed
      decision_reason: >
        اللقب المختصر المستقل؛ مقبول لأن اللقب وحده يُعرّف الشخص في سياقات علم الكهرباء
        والتاريخ التقني. التعريب دقيق: St → شت (الشين + التاء للمجموعة الصوتية st)،
        ei → اي، metz → متز. الصيغة المختصرة شائعة في كتب التاريخ العلمي العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المختصر غير الرسمي؛ يُستخدم في السياق التقني والعلمي المتخصص بعد ذكر الاسم
        الكامل أولاً، أو في نصوص تاريخ الكهرباء حيث يكون الشخص معروفاً من السياق.

    # ── مرشح المرحلة ١ — أ ──
    - lemma: "شتاينمتز"
      source: stage1
      decision: removed
      decision_reason: >
        مكرر تماماً مع اللمّة الموجودة 'شتاينمتز' — لا حاجة لإجراء إضافي.

    # ── مرشح المرحلة ١ — ب ──
    - lemma: "شتاينميتز"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بديلة أقل دقةً من 'شتاينمتز' الموجودة؛ إضافة الياء في 'ميتز' تمثّل مبالغة
        في تطويل لا يعكس النطق الألماني الفعلي (metz تُنطق بصوت قصير). الصيغة الموجودة
        أكثر ضبطاً واتساقاً مع قواعد التعريب المعتمدة.

    # ── مرشح المرحلة ١ — ج ──
    - lemma: "ستاينمتز"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب أدنى دقةً؛ السين بدل الشين لـ 'St' تقليدٌ غير موحَّد ويتعارض مع
        الصيغة المستقرة 'شتاينمتز' المتداولة في المراجع العربية المعتمدة. وجود
        'شتاينمتز' في الشبكة يُغني عنها.

    # ── مرشح المرحلة ١ — د ──
    - lemma: "تشارلز شتاينمتز"
      source: stage1
      decision: removed
      decision_reason: >
        شكل مختصر يحذف الاسم الأوسط 'بروتيوس'؛ وهو شكل شائع استعمالاً لكن وجود
        اللمّة الكاملة 'تشارلز بروتيوس شتاينمتز' يغني عنه. إضافته قد تُوهم بأن
        'بروتيوس' مكوّن ثانوي لا يُعتدّ به، وهو في الحقيقة الاسم الأوسط الرسمي
        المعتمد في جميع المصادر الأكاديمية.


