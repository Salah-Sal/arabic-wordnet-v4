# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ───────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (حاوي الثعابين، مروض الثعابين) تفتقران إلى التشكيل الكامل"
      - "\"حاوي الثعابين\" مركب إضافي بينما تثبت المعاجم الحديثة \"الحاوي\" وحده مصطلحاً راسخاً لهذا المفهوم، مما يستدعي التفكير في إضافة الصيغة المفردة"
      - "\"مروض الثعابين\" يُركّز على جانب الترويض/التدريب البدني، في حين \"الحاوي\" يشمل دلالة الرقية والجمع والعرض الفني معاً؛ وهو تمايز دلالي حقيقي يستحق التوثيق"
    observations: "المجموعة تصف فناناً شعبياً ذا حضور قوي في الثقافة العربية والآسيوية؛ فصنعة الحاوي معروفة في الموروث العربي قبل أن تصبح لفظة إنجليزية (snake charmer). يُعدّ «الحاوي» مصطلحاً تراثياً محكماً وردَ في المعجم الوسيط والمعجم الكبير بتعريف مُحدَّد مرتبط بالحيّات وحدها. التعريف الحالي دقيق في جوهره لكنه قابل للتحسين بإبراز الطابع الشعبي والأداء أمام الجمهور."

  blind_candidates:
    - lemma: "رَاقِي الثَّعَابِين"
      generation_method: tarkib
      justification: "من «رَقَى يرقي رُقيةً»، والراقي مَن يستخدم الأصوات والتعاويذ للتأثير في الكائنات. يرتبط الجذر بصنعة الحاوي لأن المعاجم تعرّف الحاوي بأنه «يرقي الحيّات». مركب إضافي (راقي + الثعابين)، وزن فاعل من الجذر رقي."
    - lemma: "حَاوٍ"
      generation_method: majaz
      justification: "من «حَوَى يَحْوِي» بمعنى الجمع والاحتواء والالتفاف؛ مجازٌ وظيفي يصف مَن يجمع الثعابين حوله ويلتف بها. لفظ تراثي واعد، والوزن فاعل من الجذر حوي (الجذر يدل على الجمع بنص ابن فارس)."
    - lemma: "مُرَوِّض الحَيَّات"
      generation_method: tarkib
      justification: "من «رَوَّضَ» (لَيَّن وذلَّل وسهَّل)، مُرَوِّض وزن مُفَعِّل الدالّ على المهنة. مركب إضافي (مُرَوِّض + الحيّات) باستخدام «حيّات» مرادفةً للثعابين. يُعبِّر عن السيطرة البدنية الواردة في التعريف."
    - lemma: "لَاعِبُ الثَّعَابِين"
      generation_method: tarkib
      justification: "من «لَعِبَ»، لاعب فاعل يصف مَن يُلاعب الثعابين ويؤدي بها حركات استعراضية أمام الجمهور. مركب إضافي (لاعب + الثعابين) يُبرز الطابع الترفيهي للعرض."


