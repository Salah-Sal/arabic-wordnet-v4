# مراجعة المجموعة الترادفية — awn4-14019420-n
# unrestricted freedom to use
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان «تصرف مطلق» و«حرية استخدام» تعبيران وصفيان حُرّان وليستا مصطلحَيْن مسكوكَيْن ثابتَيْن"
      - "اللمّتان بدون تشكيل"
      - "التعبير «حرية استخدام» إضافي مفتوح يمكن إبدال مكوّنه بمرادف (حرية تَوْظيف) فيبقى صالحاً — مما يطعن في تثبيته المعجمي"
    observations: "المفهوم يدل على نوع من الحرية غير المقيدة في استعمال شيء ما أو التصرف فيه، وهو مفهوم مجرد قريب من «حرية التصرف» التي هي تعبير اصطلاحي ثابت في المعاجم العربية المعاصرة. الفاعل المعجمي الأقوى هنا هو التركيب الإضافي الثابت لا الوصف الحر."

  blind_candidates:
    - lemma: "حُرِّيَّة التَّصَرُّف"
      generation_method: tarkib
      justification: "تركيب إضافي ثابت مسجَّل في المورد الحديث بمعنى free hand، يجمع بين مفهوم الحرية والتصرف دون قيد"
    - lemma: "يَد مُطْلَقَة"
      generation_method: tarkib
      justification: "تركيب وصفي مجازي مسجَّل في معجم اللغة العربية المعاصرة بمعنى «حُرَّة التصرف»، استعارة لحرية التصرف بلا قيود"
    - lemma: "إِطْلَاق"
      generation_method: ishtiqaq
      justification: "مصدر أَطْلَقَ من الجذر ط-ل-ق الدال على التخلية والإرسال، يحمل معنى رفع القيد في التعريفات الفقهية"
    - lemma: "تَفْوِيض مُطْلَق"
      generation_method: tarkib
      justification: "تركيب وصفي مسجَّل في معاجم التجارة بمعنى carte blanche / free hand"


stage2_evidence:
  per_lemma:
    - lemma: "تَصَرُّف مُطْلَق"
      confirm:
        - text: "«(تصرف) فلَان فِي الْأَمر احتال وتقلب فِيهِ ولعياله اكْتسب وَبِه الْأَحْوَال تقلبت»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«مُطْلَق: ما لا يقيد بقيد أو شرط، وغير المعيَّن»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«تَصرُّف — disposition»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "المصطلح القانوني يشير إلى حق التصرف"
        - text: "«مُطْلَق: صفة لما هو دون حدود ودون شرط»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          addition: "يؤكد دلالة عدم التقييد"

    - lemma: "حُرِّيَّة اسْتِخْدَام"
      confirm:
        - text: "«(1) «أ» حرية... «ز» حق الاستخدام غير المقيّد gave his friend the freedom of the house»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«حق الاستخدام — use rights»"
          source: "المَكنَز الزراعي متعدد اللغات"
          addition: "مفهوم قانوني قريب لكنه يتعلق بالحقوق لا بالحرية المطلقة"

    - lemma: "حُرِّيَّة التَّصَرُّف"
      confirm:
        - text: "«حُرِّية التَّصرّف. — free hand»"
          source: "المورد الحديث (2008)"
        - text: "«فوَّض الأمرَ إليه: وكّله به وجعل له حرية التصرف فيه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«(3) حرية التصرُّف أو الاختيار»"
          source: "المورد الحديث (2008) — مدخل discretion"
      expands:
        - text: "«مُحَدِّد: مانع المرء من حرية التصرف»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يؤكد أن حرية التصرف وحدة معجمية ثابتة بدليل استعمالها في تعريف ضدها"
        - text: "«تفويض مطلق — free hand / carte blanche»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "التفويض المطلق يمنح حرية التصرف الكاملة"

    - lemma: "يَد مُطْلَقَة"
      confirm:
        - text: "«يد مطلقة: حُرَّة التصرف»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      contradicts:
        - text: "«غُلَّت يداه: عجز عن التصرّف»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "التعبير يُستعمل كوصف لحالة الشخص (له يد مطلقة) لا كاسم مجرد للحرية ذاتها"

    - lemma: "إِطْلَاق"
      contradicts:
        - text: "«الإطلاق: رفع القيد في كل شيء والتطليق في النساء خاصة لرفع القيد الحكمي»"
          source: "التعريفات الفقهيّة للبركتي"
          conflict: "الإطلاق يدل على فعل رفع القيد (الحدث) لا على الحالة الناتجة (الحرية في الاستخدام)"
        - text: "«إِطْلاق — launch / actuate / initiation»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (2011)"
          conflict: "المعنى المعاصر الشائع هو الإطلاق بمعنى التشغيل لا الحرية"

    - lemma: "تَفْوِيض مُطْلَق"
      confirm:
        - text: "«تفويض مطلق — free hand / carte blanche»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«تفويض مُطْلَق؛ سلطة تامّة. — carte blanche»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«تفويض مُطلَق: تفويض كامل تام»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          conflict: "التفويض يفترض وجود مُفوِّض يمنح السلطة، بينما المفهوم المطلوب هو حرية قائمة بذاتها دون إذن من سلطة أعلى"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَصَرُّف مُطْلَق"
      decision: confirmed
      decision_reason: "تعبير وصفي يجمع بين «التصرف» (التقلب في الأمر واحتياله) و«المطلق» (غير المقيد بشرط)، فيؤدي معنى الحرية غير المقيدة في الاستعمال. وإن لم يكن تعبيراً اصطلاحياً مُسكوكاً بعينه، فإن بنيته الوصفية (اسم + صفة) واضحة المعنى ومألوفة الاستعمال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على جانب الفعل والتصرف الحر دون قيد، ويُستعمل في السياق القانوني والإداري"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَصَرُّف مُطْلَق"

    - lemma: "حُرِّيَّة اسْتِخْدَام"
      decision: confirmed
      decision_reason: "تعبير إضافي يطابق التعريف مطابقة مباشرة (حرية + استخدام)، ويُؤيَّد بما جاء في المورد الحديث من ترجمة freedom بمعنى «حق الاستخدام غير المقيد». قد يُعاب عليه أنه قريب من الدوران التعريفي، لكنه يبقى مقبولاً كتعبير شفاف المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يركّز على حرية الاستعمال والانتفاع تحديداً، أقرب إلى المعنى اليومي العملي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حُرِّيَّة اسْتِخْدَام"

    # ── مرشحات المرحلة ١ ──
    - lemma: "حُرِّيَّة التَّصَرُّف"
      source: stage1
      decision: confirmed
      decision_reason: "تعبير اصطلاحي ثابت مسجَّل في المورد الحديث بمعنى free hand، وفي معجم اللغة العربية المعاصرة ضمن تعريف فوَّض، وفي موسوعة السلطان قابوس ضمن تعريف مُحَدِّد. أقوى اللمّات توثيقاً لهذا المفهوم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "تعبير اصطلاحي ثابت يدل على الحرية في اتخاذ القرارات والتصرف دون إذن، أعم من حرية الاستخدام وأخص من التصرف المطلق"
      actions:
        - command: create_entry
          params: {lemma: "حُرِّيَّة التَّصَرُّف", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "يَد مُطْلَقَة"
      source: stage1
      decision: removed
      decision_reason: "التعبير مجازي يصف حالة الشخص (له يد مطلقة) لا المفهوم المجرد ذاته. وهو أقرب إلى الوصف منه إلى الاسم المجرد الذي يطابق المعرَّف العلوي «حرية». كما أن نوعه الصرفي يتأرجح بين الاسم والوصف."

    - lemma: "إِطْلَاق"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعاصر الغالب هو التشغيل (launch)، والمعنى الكلاسيكي هو فعل رفع القيد (الحدث) لا الحالة الناتجة (الحرية). لا يتسق مع المعرَّف العلوي «حرية» لأنه ليس نوعاً منها."

    - lemma: "تَفْوِيض مُطْلَق"
      source: stage1
      decision: removed
      decision_reason: "يفترض وجود سلطة مُفوِّضة تمنح الإذن، بينما المفهوم المطلوب حرية قائمة بذاتها لا تستلزم تفويضاً من جهة أعلى. كما أنه أقرب إلى carte blanche (صلاحية ممنوحة) منه إلى freedom to use (حرية ذاتية)."


