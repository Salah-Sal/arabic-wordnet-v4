# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (مربي الماشية / مربي المواشي) متطابقتان دلالياً شبه تطابق تام؛ الفرق الوحيد بينهما استخدام المفرد الجمعي (ماشية) مقابل جمع التكسير (مواشي)، مما يُثير تساؤلاً عن جدوى إبقائهما معاً."
      - "اللمّتان خاليتان من التشكيل الكامل."
      - "التعريف العربي يستخدم الصيغة التحليلية 'يقوم بتربية' بدلاً من الفعل المباشر 'يُرَبِّي'، مما يُثقّل العبارة."
      - "التعريف الإنجليزي يحتوي على خطأ نحوي ('who breed' بدلاً من 'who breeds') — مسألة OEWN لا تتعلق بالمراجعة العربية."
    observations: >
      المجموعة تُعبِّر عن مفهوم واضح ومتجذّر في الثقافة العربية، إذ تربية المواشي مهنةٌ راسخة في التراث العربي.
      اللمّتان الموجودتان تتبعان نمط التركيب الإضافي (مُفَعِّل + مضاف إليه) الشائع في المعجمية العربية الحديثة،
      وقد اعتمد المورد الحديث (2008) الصيغةَ الأولى (مُرَبِّي الماشية) مقابل "stockman".
      الجذر (رب) يحمل دلالة "الإصلاح والقيام على الشيء" وهو متسق مع المعنى المقصود.
      الجذر (مشي) يُشير في مقاييس اللغة إلى "النماء والزيادة"، وهو الوجه الاشتقاقي الذي أُعطيت منه الماشية اسمها.

  blind_candidates:
    - lemma: "مُرَبِّي الْأَنْعَامِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: مُرَبِّي (اسم الفاعل من ربّى على وزن مُفَعِّل) + الأنعام (الاسم القرآني الكلاسيكي للماشية، يشمل الإبل والبقر والغنم).
        الأنعام أعرق أسلوباً من المواشي، وأكثر دقةً اصطلاحيةً في المصادر الفقهية والزراعية الكلاسيكية.
    - lemma: "غَنَّامٌ"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من جذر (غ ن م)، يُصاغ للدلالة على الاحتراف أو الملكية المتكررة.
        المعجم الوسيط يُثبته بمعنى "صاحب الغنم والقائم عليها". يُحتمل توسيع دلالته ليشمل سائر المواشي بالمجاز.
    - lemma: "رَاعٍ"
      generation_method: majaz
      justification: >
        الراعي في الأصل من يَرعى الماشية أي يحفظها ويُراقبها (من الجذر ر ع ي).
        يمكن توسيع دلالته بالمجاز الإزاحي ليشمل مُرَبِّي الماشية المحترف لا مجرد الراعي.
        في الاستخدام العربي القديم كان الراعي هو المسؤول الشامل عن القطيع.
    - lemma: "مُنَمِّي الْمَوَاشِي"
      generation_method: tarkib
      justification: >
        تركيب إضافي: مُنَمِّي (اسم الفاعل من نمَّى على وزن مُفَعِّل) + المواشي.
        يستند إلى كلمة "تنميتها" الواردة في التعريف العربي، مما يُبرز الجانب التنموي والتكثيري في المهنة
        (تكثير قطعان الماشية وتحسين سلالاتها).


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مربي الماشية"
      confirm:
        - text: "«مُرَبِّي الماشية.» — ترجمة الإنجليزية: stockman"
          source: "المورد الحديث (2008) — arabterm، entry_id: 720205"
        - text: "«صاحب مربَى الماشية أو مديرُهُ أو العامل فيه.» — ترجمة الإنجليزية: rancher"
          source: "المورد الحديث (2008) — arabterm، entry_id: 711902"
      expands:
        - text: "«الماشية: الإبل والبقر والغنم والخيل وجمعُها المواشي.»"
          source: "التعريفات الفقهية للبركتي — hawramani، entry_id: 835688"
          addition: "يُحدّد المعجم مدلول 'الماشية' ويُثبت أن 'المواشي' جمعها، مما يدعم صحة كلا اللمّتين."

    - lemma: "مربي المواشي"
      confirm:
        - text: "«تربية المواشي» — مصطلح اقتصادي راسخ يُشير إلى النشاط الكامل"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000) — arabterm، entry_id: 401740"
      expands:
        - text: "«الأنعام: بالفتح: جمع النَّعَم بالتحريك وتُسَكَّنُ عينه: الإبل والشاة وقيل: خاص بالإبل، وقيل: النعم الإبل خاصة والأنعام ذوات الخفّ والظِّلف وهي الإبل والبقر والغنم...»"
          source: "التعريفات الفقهية للبركتي — hawramani، entry_id: 833781"
          addition: "يُوضح أن المواشي (= الأنعام) تشمل الإبل والبقر والغنم، وهو ما يُحدّد نطاق مهنة مُرَبِّي المواشي."
        - text: "«الماشية: الإبل والبقر والغنم والخيل وجمعُها المواشي.»"
          source: "التعريفات الفقهية للبركتي — hawramani، entry_id: 835688"
          addition: "يُثبت أن 'مواشي' جمع 'ماشية' — أي أن اللمّتين ترتكزان على الجذر ذاته بصيغتين (مفرد جمعي وجمع تكسير)."

    - lemma: "مُرَبِّي الْأَنْعَامِ"
      expands:
        - text: "«الأنعامُ: مؤنثة وهي جمع نعم مذكر لم يسمع تذكيرها؛ وهي الإبل والمواشي.»"
          source: "المذكر والمؤنث لابن التستري — hawramani، entry_id: 836752"
          addition: "يُثبت أن الأنعام = المواشي، مما يُظهر أن 'مربي الأنعام' و'مربي المواشي' متكافئان دلالياً."
        - text: "«الأنعام: بهيمة الأنعام؛ يعني به الإبل والبقر والغنم.» — من تفسير ابن عباس"
          source: "غريب القرآن في شعر العرب — hawramani، entry_id: 910793"
          addition: "يُؤكد الاستخدام الكلاسيكي لـ'الأنعام' مرادفاً للمواشي."

    - lemma: "غَنَّامٌ"
      confirm:
        - text: "«الغنام: صاحب الغنم والقائم عليها.»"
          source: "المعجم الوسيط (hawramani_35) — entry_id: 878846"
        - text: "«الغَنَّام: صاحب الغنم القائم عليها.»"
          source: "المعجم الوسيط OCR — entry_id: 20963"
      contradicts:
        - text: "«الغَيْنُ وَالنُّونُ وَالْمِيمُ أَصْلٌ صَحِيحٌ وَاحِدٌ يَدُلُّ عَلَى إِفَادَةِ شَيْءٍ لَمْ يُمْلَكْ مِنْ قَبْلُ... وَلَعَلَّ اشْتِقَاقَ الْغَنَمِ مِنْ هَذَا.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "جذر (غنم) يرتبط أصلاً بالكسب والغنيمة ثم بالغنم (الأغنام) تحديداً، وليس بسائر المواشي. وعليه فـ'الغنام' خاص بصاحب الأغنام لا مُرَبِّي المواشي عامةً."

    - lemma: "رَاعٍ"
      confirm:
        - text: "«راعي القطيع» — ترجمة الإنجليزية: herdsman"
          source: "المورد الحديث (2008) — arabterm، entry_id: 692686"
      contradicts:
        - text: "«الرَّاءُ وَالْعَيْنُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ: أَحَدُهُمَا الْمُرَاقَبَةُ وَالْحِفْظُ، وَالْآخَرُ الرُّجُوعُ. فَالْأَوَّلُ رَعَيْتُ الشَّيْءَ، رَقَبْتُهُ... وَالرَّاعِي: الْوَالِي.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الراعي يعني الحافظ والمراقب (herder/guardian)، وهو مهنة مختلفة عن مُرَبِّي الماشية؛ فالراعي يَسرح بالقطيع ويحفظه، أما مُرَبِّي الماشية فيتولى التربية والتنمية والتكثير — وهي عمليات أشمل وأعمق."

    - lemma: "مُنَمِّي الْمَوَاشِي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مربي الماشية"
      decision: confirmed
      decision_reason: >
        اللمّة مُثبتة في المورد الحديث (2008) مقابل "stockman"، وتتبع نمط التركيب الإضافي الراسخ (مُفَعِّل + مضاف إليه).
        الجذران (رب) و(مشي) عربيان أصيلان، وكلاهما موثَّق في مقاييس اللغة. تجتاز جميع معايير جودة المصطلح الستة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يستخدم 'الماشية' بمعناها الجمعي النوعي (اسم جنس جمعي)، مما يُركّز على المهنة كنشاط موحّد بصرف النظر عن تعدد الأنواع.
        هذه الصيغة مفضّلة في السياقات المعجمية والرسمية، وهي الأكثر شيوعاً في المعاجم الحديثة.
      term_quality_check:
        consistency: "نمط مُفَعِّل+مضاف إليه مطّرد في المعجمية العربية الحديثة (مربي الطيور، مربي الأسماك، مربي المحار)"
        ease_of_use: "سهل النطق والتداول"
        adequacy: "يُعبِّر بدقة عن فاعل مهنة تربية الماشية"
        preference_heritage: "الماشية لفظ قرآني وتراثي أصيل"
        preference_arabic: "عربي خالص"
        derivability: "مشتق اشتقاقاً منتظماً من جذرين عربيين"
      morphological_check: "وزن مُفَعِّل (اسم الفاعل من ربّى) في صيغة الإضافة — صحيح"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرَبِّي الْمَاشِيَة"

    - lemma: "مربي المواشي"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة لغوياً وتتبع النمط ذاته (مُرَبِّي + مضاف إليه). إبقاؤها يُثري المجموعة بصيغة شائعة في الكتابة الصحفية والعلمية المعاصرة.
        الفرق الدقيق بينها وبين اللمّة الأولى مُبرِّر لوجودهما معاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يستخدم 'المواشي' جمع التكسير، مما يُبرز التعدد والتنوع في أنواع الحيوانات المُرَبَّاة (إبل وبقر وغنم ونحوها).
        أكثر شيوعاً في السياق الوصفي والصحفي حين يُراد التأكيد على كثرة القطعان وتنوعها.
      term_quality_check:
        consistency: "مطّرد مع النمط العام"
        ease_of_use: "سهل"
        adequacy: "مناسب"
        preference_heritage: "المواشي لفظ عربي فصيح"
        preference_arabic: "عربي خالص"
        derivability: "مشتق من جذرين أصيلين"
      morphological_check: "وزن مُفَعِّل في صيغة الإضافة مع جمع تكسير — صحيح"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُرَبِّي الْمَوَاشِي"

    - lemma: "مُرَبِّي الْأَنْعَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        على الرغم من أن 'الأنعام' مرادف كلاسيكي لـ'المواشي' (مُثبَت في التعريفات الفقهية)، إلا أن إضافة هذه اللمّة الثالثة تزيد التكرار في المجموعة دون أن تُضيف فرقاً دلالياً حقيقياً.
        المجموعة تضم بالفعل لمّتين تُغطيان المفهوم بصيغة جمعية ونوعية. لا توجد أدلة على تثبيت 'مربي الأنعام' مصطلحاً راسخاً في المعاجم الحديثة.

    - lemma: "غَنَّامٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم (الوسيط، hawramani) تُثبت 'الغنام' بمعنى "صاحب الغنم والقائم عليها" — أي خاص بالأغنام (الشياه والمعز) دون سائر المواشي.
        المجموعة تُعبِّر عن "مُرَبِّي المواشي" بما يشمل الإبل والبقر والأغنام، فـ'الغنام' أضيق دلالةً من المطلوب. كما أن مقاييس اللغة تُؤكد أن جذر (غنم) لا يتعلق أصلاً بالتربية بل بالكسب، مما يُشير إلى أن الكلمة دخيلة على حقل التربية.

    - lemma: "رَاعٍ"
      source: stage1
      decision: removed
      decision_reason: >
        الراعي في الأصل من يحفظ الماشية ويسرح بها (herder)، لا من يُرَبِّيها ويُنَمِّيها (livestock farmer).
        المورد الحديث يُترجم "herdsman" بـ"راعي القطيع"، وهي مهنة مختلفة عن مهنة مُرَبِّي الماشية.
        مقاييس اللغة تُحدّد أن أصل الجذر (رعي) هو "المراقبة والحفظ"، لا الاستثمار والتنمية. التوسع بالمجاز هنا يخرج بالكلمة عن دلالتها الأصيلة.

    - lemma: "مُنَمِّي الْمَوَاشِي"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي توثيق معجمي لهذا التركيب بوصفه مصطلحاً راسخاً. وإن كان المعنى صحيحاً لغوياً (من نمَّى يُنَمِّي)، إلا أنه لم يُسَكَّ بعد مصطلحاً معترفاً به، ويُعدّ عبارةً وصفية حرّة لا وحدةً معجمية ثابتة (يفشل اختبار التثبيت المعجمي).


