# ── المرحلة ١: المراجعة والتوليد (عمياء) ────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'لاعب سهام' مركب إضافي بدون تشكيل كامل"
      - "التعريف يتضمن الكلمة الإنجليزية (Darts) بين قوسين، مما يدل على غياب مصطلح عربي راسخ لهذه اللعبة في المعجمية المعاصرة"
      - "المجموعة تفتقر إلى تعريف وصفي دقيق يُميّزها عن المفهوم الفوقي العام (اللاعب)"
    observations: "المفهوم يُحيل إلى لعبة رياضية غربية محددة (Darts) لا جذر لها في الثقافة الرياضية العربية الكلاسيكية. اللمّة المُولَّدة 'لاعب سهام' مقبولة ومفهومة وتسير على نهج تسمية لاعبي الألعاب بالمركب الإضافي (لاعب كرة القدم، لاعب شطرنج). غير أن لفظ 'السِّهام' مشترك لفظي بين جمع 'سهم' (أداة الرمي) وبين 'السُّهام / السَّهام' (داء الضمور وحر السموم)، مما يستوجب التشكيل الدقيق. الفرق بين هذه اللعبة وسائر رياضات الرماية يتجلى في نوع السهم المستخدم (صغير مريش) والهدف الدائري، وهو ما ينبغي أن يعكسه التعريف."
  blind_candidates:
    - lemma: "سَهَّام"
      generation_method: ishtiqaq
      justification: "وزن فَعَّال من جذر (سهم)، يدل على المبالغة في الفعل وكثرة ممارسته؛ فكما يُقال حمّار ونبّال، يُقال سَهَّام لمن يُكثر رمي السهام ويحترف ذلك. الوزن منتج في العربية للدلالة على الاحتراف."
    - lemma: "رَامِي السِّهَام"
      generation_method: tarkib
      justification: "مركب إضافي من اسم الفاعل 'رَامٍ' (من جذر رمي: نبذ الشيء) مضافاً إلى 'السِّهَام' جمع سهم؛ يُحدِّد نوع الرماية المقصودة بالسهام الصغيرة المريشة التي تُرمى إلى هدف دائري."
    - lemma: "نَابِل"
      generation_method: ishtiqaq
      justification: "اسم فاعل من جذر (نبل)؛ 'النابل: صاحب النبل'، والنبل هو السهام. لما كانت Darts تعتمد رمي أجسام صغيرة كالسهام إلى هدف، أُعيد توظيف 'نابل' بإزاحة دلالية من الرامي الكلاسيكي إلى لاعب الدارتس."
    - lemma: "لاَعِبُ الجُمَّاح"
      generation_method: tarkib
      justification: "مركب إضافي: لاعب + الجمّاح؛ والجمّاح في العربية هو السهم الصغير المريش (النصل المُدوَّر). يُعدّ أدق من 'لاعب سهام' إذ يُحدد نوع السهم الذي تعتمد عليه لعبة Darts تحديداً."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات نُفِّذت:
#  Q1 — Batch headword lookup: لاعب سهام، سهام، سهم، زارق، زراق، نبال، نبل، رامي
#  Q2 — English bridge: dart player, darts, dart, dartist
