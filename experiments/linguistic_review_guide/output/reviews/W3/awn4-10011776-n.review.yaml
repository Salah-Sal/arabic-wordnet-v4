stage2_evidence:
  per_lemma:
    - lemma: "لاَعِبُ سِهَام"
      expands:
        - text: "«(٣) الجُمّاحيّة؛ المَرِيشيّة؛ لعبة السِّهام المَرِيشة: لعبة تُسَدَّدُ فيها السِّهام المَرِيشة إلى رَمِيَّةٍ أو هدف»"
          source: "المورد الحديث (2008)"
          addition: "يُفيد هذا المدخل بأن 'لعبة السهام (المريشة)' هو المقابل العربي الموثَّق للـ Darts، مما يُعزِّز صحة استخدام 'سهام' في بناء مصطلح لاعب هذه اللعبة."

    - lemma: "سَهَّام"
      evidence_status: "no_material_found"

    - lemma: "رَامِي السِّهَام"
      confirm:
        - text: "«الرَّامِي: مَنْ حِرْفَتُهُ الرِّمايَةُ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
      expands:
        - text: "«رَمَى: الرَّاءُ وَالْمِيمُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ وَاحِدٌ، وَهُوَ نَبْذُ الشَّيْءِ... وَالْمِرْمَاةُ: نَصْلُ السَّهْمِ الْمُدَوَّرُ; وَسُمِّيَ بِذَلِكَ لِأَنَّهُ يُرْمَى بِهِ. وَخَرَجْتُ أَتَرَمَّى، إِذَا خَرَجْتَ تَرْمِي فِي الأَغْرَاضِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يُرسِّخ الجذر (رمي) دلالته على نبذ الشيء ورميه نحو هدف، ومنه 'الرامي' بمعنى المحترف بالرماية. 'المِرماة: نصل السهم المدوَّر' يقترب من وصف سهم Darts الصغير المستدير."

    - lemma: "نَابِل"
      contradicts:
        - text: "«النَّبْلُ: السِّهَامُ الْعَرَبِيَّةُ. وَالنَّابِلُ: صَاحِبُ النَّبْلِ، وَالنَّبَّالُ: الَّذِي يَعْمَلُهُ. وَنَبَلْتُهُ: رَمَيْتُهُ بِالنَّبْلِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "النابل في التراث العربي يُشير إلى صاحب سهام القوس الكبيرة (النبل العربي)، لا إلى لاعب Darts الذي يرمي سهاماً صغيرة مريشة بيده إلى هدف دائري على الحائط. المفهومان متباينان نوعاً وآليةً وسياقاً."

    - lemma: "لاَعِبُ الجُمَّاح"
      confirm:
        - text: "«(٢) الجُمّاح؛ السّهم المَرِيش»"
          source: "المورد الحديث (2008)"


