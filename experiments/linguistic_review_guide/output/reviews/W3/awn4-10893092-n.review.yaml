      justification: "الاسم الرسمي الثلاثي الكامل للمعماري المقصود: Daniel Hudson Burnham. الصيغة الكاملة بأسمائه الثلاثة ضرورية في السياقات الموسوعية والأكاديمية ولرفع اللبس عن لمّة الاسم المختصر."
    - lemma: "بُرنهام"
