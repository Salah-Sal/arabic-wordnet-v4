      justification: "صيغة بديلة لتعريب 'Daniel' كـ'دانيَل' (بفتحة الياء دون مدّ) وفق النطق الإنجليزي المعاصر؛ في مقابل الصيغة التراثية 'دانيال' المأخوذة من العبرية عبر اليونانية."


