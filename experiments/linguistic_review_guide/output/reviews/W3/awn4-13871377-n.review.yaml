# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13871377-n (fiftieth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «الخمسون» بدون تشكيل — تحتاج إلى ضبط كامل"
      - "التعريف العربي ترجمة حرفية من الإنجليزية، ويستخدم الرقم 50 بدل كتابته بالحروف"
      - "المجموعة تحوي لمّة واحدة فقط وهي عدد ترتيبي بسيط"
    observations: "المجموعة تمثّل العدد الترتيبي «الخمسون» بمعنى المرتبة الخمسين في سلسلة. في العربية، أعداد العقود (٢٠-٩٠) تستعمل لفظ العدد الأصلي نفسه للترتيب، فيقال: «الفصل الخمسون» أي الفصل الذي رتبته خمسون. اللمّة الموجودة صحيحة لغوياً لكنها تحتاج ضبطاً بالشكل."

  blind_candidates:
    - lemma: "الخَمْسُونَ"
      generation_method: ishtiqaq
      justification: "العدد الأصلي المعرَّف بأل يُستعمل ترتيبيّاً لأعداد العقود في العربية الفصحى، من جذر «خ م س» على وزن فَعْلُون"
    - lemma: "نِصْفُ المِئَوِيّ"
      generation_method: tarkib
      justification: "مركب إضافي يعبّر عن الموقع الذي يقع عند نصف المئة — لكنه ليس مصطلحاً مسكوكاً"
    - lemma: "خَمْسِينِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى خمسين على وزن فَعْلِينِيّ، لكن دلالتها «ما يتعلق بالخمسين» لا «المرتبة الخمسون»"
    - lemma: "المَوْضِعُ الخَمْسُونَ"
      generation_method: tarkib
      justification: "مركب وصفي من «الموضع» و«الخمسون» للدلالة على الرتبة — لكنه عبارة وصفية حرة لا مصطلح ثابت"

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "الخَمْسُونَ"
      confirm:
        - text: "«من ألفاظ العُقُودِ, وهو العَقْدُ الخامسُ»"
          source: "المعجم الكبير"
        - text: "«(1) الخمسون (2) جزء من خمسين.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«أهْلُ خَمْسِينَ : من طَبقاتِ المُوَحِّدين, كما رتَّبها مؤسِّسُ دَولَتِهم محمّد بن تُومَرْت المَهديّ»"
          source: "المعجم الكبير"
          addition: "استعمال تاريخي لـ«أهل خمسين» كطبقة"
        - text: "«فِيمَ قَتَلْتُمْ رَجُلًا تَعَمَّدا؟ / مُذْ سَنَّةً وخَمِسونَ عَدَدا»"
          source: "المعجم الكبير — شاهد شعري (أنشده أبو زيد)"
          addition: "شاهد شعري على استعمال خمسون في العدّ"
    - lemma: "نِصْفُ المِئَوِيّ"
      evidence_status: "no_material_found"
    - lemma: "خَمْسِينِيّ"
      evidence_status: "no_material_found"
    - lemma: "المَوْضِعُ الخَمْسُونَ"
      evidence_status: "no_material_found"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "الخَمْسُونَ"
      decision: confirmed
      decision_reason: "لفظ «الخمسون» هو اللفظ العربي الفصيح الوحيد للعدد الترتيبي خمسين، وهو من ألفاظ العقود المعروفة. وردت شواهد معجمية في المعجم الكبير والمورد الحديث تؤكد هذا الاستعمال."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الخَمْسُونَ"

    - lemma: "نِصْفُ المِئَوِيّ"
      source: stage1
      decision: removed
      decision_reason: "مركب إضافي غير مسكوك، لا يوجد له أي شاهد معجمي، وليس وحدة معجمية ثابتة بل عبارة وصفية حرة."

    - lemma: "خَمْسِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "النسبة «خمسينيّ» تدل على ما يتعلق بالخمسين (كـ«الذكرى الخمسينية») ولا تدل على المرتبة الخمسين في سلسلة معدودة. فرق دلالي جوهري."

    - lemma: "المَوْضِعُ الخَمْسُونَ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة يمكن إبدال «الموضع» بـ«المكان» أو «المركز» — لا تجتاز اختبار السكّ ولا اختبار التثبيت المعجمي."

# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "المركز 50 في سلسلة معدودة من الأشياء"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية، ويستخدم الرقم 50 بدل كتابته بالحروف. يحتاج إعادة صياغة بأسلوب المعجم الوسيط."
    authored:
      - type: linguistic
        text: "العَقْدُ الخامسُ مِن أعدادِ العُقُودِ، وهو ما يدلّ على المرتبةِ الخمسينَ في تسلسلٍ معدودٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "العَقْدُ الخامسُ مِن أعدادِ العُقُودِ، وهو ما يدلّ على المرتبةِ الخمسينَ في تسلسلٍ معدودٍ"

  examples:
    per_lemma:
      - lemma: "الخَمْسُونَ"
        examples:
          - text: "احتلّ الفريقُ المركزَ الخمسينَ في التصنيف العالمي لهذا العام."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "احتلّ الفريقُ المركزَ الخمسينَ في التصنيف العالمي لهذا العام."

# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
