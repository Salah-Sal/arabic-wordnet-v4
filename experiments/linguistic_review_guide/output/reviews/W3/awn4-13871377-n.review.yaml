      maqayis_quote: "«الْخَاءُ وَالْمِيمُ وَالسِّينُ أَصْلٌ وَاحِدٌ، وَهُوَ فِي الْعَدَدِ. فَالْخَمْسَةُ مَعْرُوفَةٌ.»"

  per_sense:
