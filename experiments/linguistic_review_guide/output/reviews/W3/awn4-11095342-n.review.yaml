# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (عمياء) ─────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر إلى التشكيل الكامل الإلزامي: (إيفانوف، ليف إيفانوف)"
      - "POS مسجَّل كـ n على مستوى المدخل المعجمي، والأنسب هو proper_noun إذ المقصود علَم شخصي"
      - "التعريف العربي الحالي شحيح جداً — لا يتجاوز ترجمة حرفية للإنجليزي مع ذكر السنوات؛ غير كافٍ لمعجم علمي"
      - "اللمّة (إيفانوف) وحدها مُبهمة؛ إيفانوف لقبٌ روسي شائع ويحتاج إلى اسم أول للتمييز"
    observations: >
      هذه المجموعة تمثّل علَماً شخصياً (proper noun) لمصمّم رقصات روسي بعينه. البيانات الزمنية (١٨٣٤-١٩٠٥)
      تُحدِّد الشخص تحديداً نهائياً لا لبسَ فيه — وهو ليف إيفانوف (Lev Ivanov)، نائبُ مصمم الرقصات
      الأول في المسرح الإمبراطوري بسان بطرسبرغ، الشهير بتصميم الفصلَيْن الثاني والرابع من باليه
      «بحيرة البجع». التعامل مع الأعلام المُعرَّبة يستلزم: (أ) تثبيت الأشكال الدقيقة بالتشكيل الكامل،
      (ب) توثيق الصيغة المعتمدة في المصادر العربية المرجعية، (ج) إعداد تعريف موسوعي يُبيّن مكانة
      الشخص في تاريخ الفن.

  # ⚠ ملاحظة منهجية — توليد المرشحين لعَلَم شخصي:
  # ليس في وسع المنهج الاشتقاقي أو المجازي أو التركيبي توليدُ علَم شخصي أجنبي، إذ العلَم
  # تعريبٌ بالضرورة (taarib). التوليد العمياء هنا ينحصر في أشكال التعريب المختلفة للاسم.
  blind_candidates:
    - lemma: "لِيف إِيفَانُوف"
      generation_method: taarib
      justification: >
        الشخص الوحيد المعروف تاريخياً بصفة «مصمم رقصات روسي ١٨٣٤-١٩٠٥» هو ليف إيفانوف؛
        هذا هو الشكل المُعرَّب الكامل (الاسم الأول + اللقب) الأكثر شيوعاً في المصادر العربية
        المتخصصة في تاريخ الباليه.
    - lemma: "إِيفَانُوف"
      generation_method: taarib
      justification: >
        صيغة اللقب المُجرَّد، وهي الصيغة الاختصارية المستخدمة في الإشارة السريعة داخل النصوص
        الأكاديمية بعد التقديم الكامل للاسم.
    - lemma: "لِيوف إِيفَانُوف"
      generation_method: taarib
      justification: >
        شكل بديل أقرب إلى النطق الروسي الأصيل (Лев يُنطق Lyov أحياناً)؛ يُستخدم في بعض
        المصادر العربية المتأثرة بالنقحرة المباشرة من الروسية.
    - lemma: "إِيفَانُوف الرُّوسِيّ"
      generation_method: taarib
      justification: >
        مُركَّب اسمي بنعت تمييزي لرفع الاشتراك، إذ اللقب إيفانوف شائع جداً؛ غير أن هذا التركيب
        لا يُشكّل وحدة معجمية ثابتة بذاته ويُعدّ وصفياً حراً — وارد كمرشح للفحص لا للتأكيد.


