      decision: confirmed
      decision_reason: >
        الاسم الكامل (الاسم الأول + اللقب) للشخص المقصود — وهو الصيغة الأكثر توضيحاً
        وتمييزاً ودقةً لغوياً؛ يُستعمل في المصادر الأكاديمية وكتب تاريخ الفنون.
        يحتاج تشكيلاً كاملاً وتصحيح POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
        note: "مُركَّب اسمي وصفي: اسم أول (لِيف) + لقب (إِيفَانُوف) — وحدة معجمية ثابتة للعَلَم الشخصي"
      morphological_check:
        type: taarib
        accepts_al: false
        accepts_nisba: false
        note: "الاسم الكامل لا يقبل التعريف أو النسبة عادةً"
      borrowing_check:
        loan_type: "معرَّب صوتياً (Lev = لِيف، Ivanov = إِيفَانُوف)"
        scientific_match: true
      quality_gate:
        ittiraad: "يطّرد في المصادر المتخصصة بصيغة ثابتة"
        yusr_tadawul: "أطول نسبياً لكن مألوف"
        mulaama: "ملائم تماماً للسياق الأكاديمي والموسوعي"
        turath: "لا ينطبق"
        arabic_preference: "لا ينطبق"
        ishtiqqiyya: "لا ينطبق"
      nuance_differentiation: >
        صيغة الاسم الكامل (أول + لقب)، تُستخدم في التقديم الأوّلي والسياقات الرسمية
        والترجمات الأكاديمية — وتُزيل الغموض الذي يصحب الكُنية المجرَّدة إِيفَانُوف إذ
        اللقب شائع جداً في الروسية.
      actions:
