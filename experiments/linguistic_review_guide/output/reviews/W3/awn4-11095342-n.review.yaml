# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١: إيفانوف ──
    - lemma: "إيفانوف"
      decision: confirmed
      decision_reason: >
        لقبٌ مُعرَّب ثابت للشخص المقصود، مستعمَل في الأدبيات العربية المتخصصة بالباليه؛
        غير أن الشكل الحالي يخلو من التشكيل الكامل الإلزامي وPOS المدخل يستوجب تصحيحاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      morphological_check:
        type: taarib
        accepts_al: true
        accepts_nisba: true
        accepts_plural: false
        note: "يقبل التعريف (الإيفانوف)، لكن الجمع والنسبة غير مستعملَيْن عملياً على الأعلام الشخصية"
      borrowing_check:
        loan_type: "معرَّب (تعريب صوتي من الروسية Ivanov)"
        calque: false
        scientific_match: true
      quality_gate:
        ittiraad: "يطّرد في المصادر المتخصصة"
        yusr_tadawul: "سهل النطق في العربية"
        mulaama: "ملائم — مقبول في سياق الأعلام المُعرَّبة"
        turath: "لا ينطبق (علَم أجنبي)"
        arabic_preference: "لا ينطبق"
        ishtiqqiyya: "لا ينطبق"
      nuance_differentiation: >
        صيغة الكُنية (اللقب) المُجرَّدة، تُستخدم في الإشارة المختصرة بعد التعريف الكامل،
        وفي الفهارس والمراجع الأكاديمية — بخلاف لِيف إِيفَانُوف التي تُستخدم للتقديم
        الكامل والسياقات الرسمية.
      actions:
        - command: update_lemma
          params:
