# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تمثّل علَماً شخصياً (اسم إنسان بعينه) لا مفهوماً معجمياً؛ وبالتالي فإن منهجية التوليد المصطلحي (مجاز / اشتقاق / تركيب) لا تنطبق عليها؛ الوحيد الممكن هو التعريب (نقل الصوت بحروف عربية)."
      - "اللمّتان الحاليتان (تويلا ثارب / ثارب) خاليتان من التشكيل الكامل."
      - "لمّة الاسم الأخير (ثارب) وحده قد تكون مبهمة في غياب السياق."
      - "POS مسجَّل كـ n لكن المرجع الدلالي علَمٌ على شخص؛ يستحق النظر في تعيينه proper_noun."
    observations: >
      هذه مجموعة ترادفية سيرية (biographic synset) تُعرِّف بامرأة بعينها هي راقصة ومصممة رقصات أمريكية وُلدت عام 1941.
      لأعلام الأشخاص في الشبكة الدلالية لا تُولَّد مصطلحات اشتقاقية ولا مركبة؛ اللمّات الممكنة هي صيغ النقل الصوتي (التعريب) للاسم الأجنبي، مع جواز
      وجود صيغة الاسم الكامل (الأولى + اللقب) وصيغة اللقب وحده. جميع المرشحات الأربعة أدناه تمثّل تبايناً في رسم الاسم الأجنبي بالحروف العربية،
      وقد نبّهتُ إلى محدودية هذه المرحلة لهذا النوع من المجموعات.

  blind_candidates:
    - lemma: "تُوَيْلَا ثَارْب"
      generation_method: taarib
      justification: >
        النقل الصوتي المعياري للاسم الأجنبي الأنثوي + اللقب المتوقع لراقصة أمريكية. «تُوَيْلَا» تعريب لاسم أنثوي إنجليزي على وزن ثنائي المقطع،
        و«ثَارْب» نقل صوتي للقب مؤلَّف من ثلاثة أصوات (Th-a-rp). هذه الصيغة هي الأكثر احتمالاً لراقصة أمريكية مشهورة ولدت 1941.
    - lemma: "تُوَايْلَا ثَارْب"
      generation_method: taarib
      justification: >
        بديل صوتي يُصرِّح بثنائية الصائت في المقطع الأول (ou-ay) بدلاً من تبسيطه؛ خيار ينتهجه بعض أصحاب المعاجم الثنائية للتمييز الصوتي.
    - lemma: "ثَارْب"
      generation_method: taarib
      justification: >
        اللقب وحده صيغةٌ مشروعة في المراجع العربية للأعلام الغربية حين يشتهر الشخص بلقبه. لكن يبقى احتمال الالتباس قائماً.
    - lemma: "تُوَيْلَة ثَارْب"
      generation_method: taarib
      justification: >
        محاولة إضافة تاء التأنيث العربية (ة) على الاسم الأجنبي لإظهار الجنس صراحةً؛ لكن هذا مخالف لأعراف تعريب الأسماء الأجنبية التي لا تُلحق
        بها مؤنثات عربية، لأن الجنس يظهر من السياق.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# ميزانية الاستعلامات المُنفَّذة: 3 استعلامات
# ١. مطابقة دفعية لجميع اللمّات (نتيجة: لا مداخل)
# ٢. جسر إنجليزي: Tharp / Twyla Tharp / choreographer / dancer
# ٣. بحث FTS بالكلمات المفتاحية: راقصة / مصممة رقصات / كوريغراف
stage2_evidence:
  per_lemma:
    - lemma: "تويلا ثارب"
      evidence_status: "no_material_found"

    - lemma: "ثارب"
      evidence_status: "no_material_found"

    - lemma: "تُوَيْلَا ثَارْب"
      evidence_status: "no_material_found"

    - lemma: "تُوَايْلَا ثَارْب"
      evidence_status: "no_material_found"

    - lemma: "ثَارْب"
      evidence_status: "no_material_found"

    - lemma: "تُوَيْلَة ثَارْب"
      evidence_status: "no_material_found"

  auxiliary_finds:
    - note: >
        جسر الإنجليزية أسفر عن مدخلَيْن ذوَيْ صلة بالمصطلح الأعم لا بالشخص:
        (أ) «مُصَمِّم الرَّقَصات» (translation_en: choreographer — المورد الحديث 2008، entry_id 677907)،
        (ب) «الرّاقص / الراقصة» (translation_en: dancer — المورد الحديث 2008، entry_id 681941).
        لا يوجد في قاعدة البيانات أي مدخل خاص بـ Twyla Tharp بوصفها شخصاً.
    - note: >
        مقاييس اللغة لابن فارس (dictionary_id 151) يحتوي على جذر (رقص):
        «الرَّاءُ وَالْقَافُ وَالصَّادُ أَصْلٌ يَدُلُّ عَلَى النَّقَزَانِ. يُقَالُ رَقَصَ يَرْقُصُ رَقْصًا.
        وَيُقَالُ أَرْقَصَ الْبَعِيرَ: حَمَلَهُ عَلَى الْخَبَبِ. وَرَقَصَ السَّرَابُ فِي لَمَعَانِهِ; وَرَقَصَ الشَّرَابُ: جَاشَ.
        وَالرَّقَّاصَةُ: لُعْبَةٌ.»
    - note: >
        مقاييس اللغة — جذر (ثرب): «الثَّاءُ وَالرَّاءُ وَالْبَاءُ كَلِمَتَانِ مُتَبَايِنَتَا الْأَصْلِ، لَا فُرُوعَ لَهُمَا.
        فَالتَّثْرِيبُ اللَّوْمُ وَالْأَخْذُ عَلَى الذَّنْبِ. وَالْآخَرُ الثَّرْبُ، وَهُوَ شَحْمٌ قَدْ غَشَّى الْكَرِشَ وَالْأَمْعَاءَ رَقِيقٌ; وَالْجَمْعُ ثُرُوبٌ.»
        (تنبيه: هذا الجذر العربي مصادَف مع نقل صوت «Tharp» الإنجليزي بالحروف العربية — لا صلة دلالية بينهما.)


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: الاسم الكامل ──
    - lemma: "تويلا ثارب"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخصية (الاسم الأول + اللقب) هو اللمّة الأساسية لهذا النوع من المجموعات السيرية.
        النقل الصوتي سليم ويعكس المقاطع الإنجليزية (Twy-la Tharp) بصورة معقولة.
        يحتاج فقط إلى إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل يحدد الشخصية بلا لبس (الأولى + اللقب)؛ يُستخدم في السياقات الرسمية والمراجع الأكاديمية
        والترجمات الأدبية حيث التعريف الكامل بالشخص مطلوب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تُوَيْلَا ثَارْب"

    # ── لمّة موجودة: اللقب وحده ──
    - lemma: "ثارب"
      decision: confirmed
      decision_reason: >
        صيغة اللقب المنفرد شائعة في المراجع النقدية والصحافة الفنية العربية حين تصبح الشخصية معروفة بلقبها؛
        وقد أثبتت المجموعة الإنجليزية الأصل (OEWN) الصيغتين "Tharp" و"Twyla Tharp" معاً.
        تُبقَى الصيغة لتوافق هيكل OEWN وتُيسِّر الإحالة المختصرة. تحتاج إلى تشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب وحده صيغة مختصرة تُستخدم في السياقات النقدية والإشارات المتكررة بعد التعريف الكامل أول مرة؛
        يفتقر إلى الاسم الأول الذي يُميِّز بين أفراد العائلة إن وُجدوا.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثَارْب"

    # ── مرشحات المرحلة ١ (جميعها مرفوضة) ──
    - lemma: "تُوَيْلَا ثَارْب"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق فعلياً للمّة الموجودة «تويلا ثارب» بعد إضافة التشكيل — الإجراء المطلوب هو تحديث
        اللمّة الموجودة لا إنشاء مدخل جديد.

    - lemma: "تُوَايْلَا ثَارْب"
      source: stage1
      decision: removed
      decision_reason: >
        صياغة بديلة أقل دقة صوتياً من الرسم المعتمد؛ الاسم الإنجليزي Twyla يُنطق /ˈtwaɪlə/ فالألف الممدودة
        في «تُوَيْلَا» أصح من إقحام ألف المد في «تُوَايْلَا».

    - lemma: "ثَارْب"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة «ثارب» بعد التشكيل — تحديث اللمّة الموجودة كافٍ.

    - lemma: "تُوَيْلَة ثَارْب"
      source: stage1
      decision: removed
      decision_reason: >
        إضافة تاء التأنيث (ة) على الاسم الأجنبي مخالفة لأعراف تعريب الأسماء الأعجمية؛ الجنس لا يُكتسب
        بالإلصاق الصرفي في الأعلام المنقولة، ويُفهم من السياق. الشكل خاطئ ومُلتبِس.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "راقصة ومصممة رقصات أمريكية مبتكرة (ولدت عام 1941)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية مباشرة من الإنجليزية؛ يفتقر إلى الأسلوب المعجمي العربي، والوصف
        بكلمة «مبتكرة» غامض من غير تحديد مجال الابتكار. والإشارة إلى تاريخ الميلاد بين قوسين مع
        الفعل «ولدت» يعكس أسلوب الترجمة لا التأليف. المناسب هنا تعريف موسوعي يليق بمدخل سيرة ذاتية.
    authored:
      - type: encyclopedic
        text: >
          رائدة الرقص المعاصر الأمريكي ومصممة رقصات، وُلدت عام 1941، اشتُهرت بمزجها الجريء بين
          أساليب الرقص الكلاسيكي والمعاصر والشعبي في أعمال استعراضية ذات طابع تجريبي متميز.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11357624-n"
          definition_index: 0
          text: >
            رائدة الرقص المعاصر الأمريكي ومصممة رقصات، وُلدت عام 1941، اشتُهرت بمزجها الجريء بين
            أساليب الرقص الكلاسيكي والمعاصر والشعبي في أعمال استعراضية ذات طابع تجريبي متميز.

  examples:
