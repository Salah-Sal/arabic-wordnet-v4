        مع التعريف أدق. (٢) 'ممر' عامٌّ؛ أما 'مسرب' فهو المصطلح التقني المستخدم في ArabTerm
        للحارة الرياضية (مسرب البولنغ وغيره). (٣) التعريف ترجمة حرفية تفتقر إلى الجنس القريب
        والفصل النوعي بأسلوب المعجم.
