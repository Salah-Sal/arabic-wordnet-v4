# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-09889367-n  |  ILI: i88666  |  POS: n
# EN: bowler — a player who rolls balls down an alley at pins
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة 'لاعب بولينج' تستخدم تهجئة 'بولينج' في حين أن المعيار في المعاجم العربية الحديثة (المورد الحديث 2008، ArabTerm) هو 'البولنغ' بالنون والغين"
      - "اللمة تفتقر إلى التشكيل الكامل"
      - "غياب حرف التعريف على المصطلح المعرَّب في حين ورد في المعاجم: 'لاعب البولنغ'"
    observations: >
      المجموعة تمثّل مفهوماً رياضياً حديثاً غربياً (لاعب البولينج). اللمة الوحيدة هي تركيب إضافي
      من لاعب + مصطلح معرَّب. التعريف العربي الحالي قريب جداً من الترجمة الحرفية للإنجليزية وفيه
      ضعف في الدقة المصطلحية (كرات بدل الكرة، وممر بدل مسرب). ينبغي مراجعة التهجئة والتشكيل
      والتعريف. المصطلح المعرَّب ضروري لعدم وجود مقابل اشتقاقي عربي خالٍ من الإشكال.

  blind_candidates:
    - lemma: "دَاحٍ"
      generation_method: majaz
      justification: >
        من دَحَا يَدْحُو (الرمي والإزاحة الأرضية)؛ إحياء للفظ القديم بمعنى من يُدَحْرِج شيئاً
        على الأرض نحو هدف، مستنداً إلى قول العرب: دحا المطرُ الحصى عن وجه الأرض (رماه وأزاحه).
        الوزن فَاعِل من دحا يمنح صيغة الفاعلية.
    - lemma: "مُدَحْرِجٌ"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل الرباعي دَحْرَجَ على وزن مُفَعْلِل، أي من يُدَحْرِج. الفعل دحرج
        يعني تحريك الشيء فيندفع منحدراً متتابعاً وهو يصف حركة كرة البولينج بدقة.
    - lemma: "قَارِعُ الدَّبَابِيسِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: قَارِع (اسم فاعل من قَرَعَ = ضرب/أصاب) + الدَّبَابِيس (جمع دَبُّوس = pins).
        يُعيِّن غاية اللاعب الجوهرية وهي إصابة الدبابيس الخشبية وإسقاطها.
    - lemma: "بُوْلِنْجِيٌّ"
      generation_method: taarib
      justification: >
        تعريب كلمة bowler الإنجليزية بإضافة ياء النسب، على غرار كثير من أسماء مزاولي الرياضات
        المستحدثة. يقبل التعريف ولام التعريف والجمع السالم (بولنجيّون).


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "لاعب بولينج"
      confirm:
        - text: "«(entry bowler): (1) فا bowl (2) لاعب البولنغ. البَوْلَر: قبَّعة رجالية مدوَّرة. (3) البَوْلَر: قبَّعة رجالية مدوَّرة»"
          source: "المورد الحديث (2008)"
        - text: "«بولنغ: لعبة يدحرج اللاعب فيها كرة كبيرة في مسرب محاولا قلب عدة نصائب خشبية»"
          source: "مسرد الفن والتسلية والرياضة — المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      expands:
        - text: "«(1) القارورة الخمسعشرية: قارورة خشبية من قوارير لعبة البولنغ يبلغ طولها 15 إنشًا (2) pl.: لعبة البولنغ العَشْرية: لعبة بولنغ تستخدم فيها عشر قوارير من هذا النوع وكُرَة كبيرة يبلغ محيطها 27 إنشًا»"
          source: "المورد الحديث (2008)"
          addition: "يُثبّت استخدام 'البولنغ' (بالنون والغين) تهجئةً معيارية للمصطلح في المعجمية العربية الحديثة، ويُبيِّن أن الدبابيس في لعبة البولنغ تُسمى 'قوارير' في بعض السياقات"

    - lemma: "دَاحٍ"
      contradicts:
        - text: "«الدَّاحُ: نَقْشٌ يُلَوَّحُ للصِّبيانِ يُعَلَّلونَ به، وسِوارٌ ذُو قُوىً مَفْتولَةٍ، والخَلوقُ من الطِّيبِ، ووَشْيٌ، وخُطوطٌ على الثَّوْرِ وغيرِه»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الداح اسمٌ للوشي والنقش والطيب، لا صلة له بالدحرجة ولا بلاعب البولينج"
        - text: "«الداح: الوشى والنقش وَالثَّوْب الْمُوشى المنقوش والوشى والنقش يلوح بِهِ للصبيان يشغلون بِهِ وسوار ذُو قوى مفتولة وَضرب من الطّيب مَائِع فِيهِ صفرَة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "تأكيد من مصدر حديث آخر: الداح = الوشي والنقش، لا الدحرجة"
        - text: "«دَاحَ: بَطْنُه دَيْحًا: عَظُمَ واسْتَرْسَل»"
          source: "المعجم الكبير"
          conflict: "الفعل داح يعني ضخامة البطن واسترخاءه، لا دحرجة الكرة"
      expands:
        - text: "«دَحَوَ: الدَّالُ وَالْحَاءُ وَالْوَاوُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى بَسْطٍ وَتَمْهِيدٍ. يُقَالُ: دَحَا اللَّهُ الْأَرْضَ يَدْحُوهَا دَحْوًا إِذَا بَسَطَهَا. وَيُقَالُ دَحَا الْمَطَرُ الْحَصَى عَنْ وَجْهِ الْأَرْضِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر دحو يدل على البسط والتمهيد والإزاحة الأفقية لا على الدحرجة الاتجاهية نحو هدف؛ مما يُضعف ملاءمة 'داح' للدلالة على من يُدَحْرِج كرة البولينج في مسرب محدد"

    - lemma: "مُدَحْرِجٌ"
      contradicts:
        - text: "«المُدَحْرِج: الجُعَلُ»"
          source: "المعجم الوسيط"
          conflict: "المدحرج (اسم فاعل) اسمٌ للجُعَل وهو خنفساء الروث؛ تعارض دلالي قاطع يمنع استخدامه اسماً للاعب البولينج"
        - text: "«المُدَحْرِجُ: الجُعَلُ»"
          source: "المعجم الكبير"
          conflict: "تأكيد من المعجم الكبير: المدحرج = الجعل"
      expands:
        - text: "«المُدَحْرَج: المُدَوَّر»"
          source: "المعجم الوسيط"
          addition: "صيغة اسم المفعول (المدحرَج بفتح الراء) تعني المدوَّر؛ أما اسم الفاعل (المدحرِج بكسر الراء) فهو الجعل"
        - text: "«دَحْرَجَه: حرَّكه فاندفع منحدراً؛ أداره على نفسه متتابعاً في حدور»"
          source: "المعجم الوسيط"
          addition: "الفعل دحرج يصف حركة الكرة بدقة لكن اسم الفاعل المشتق منه محجوز معجمياً للجعل مما يُسقط هذا المرشح"

    - lemma: "قَارِعُ الدَّبَابِيسِ"
      expands:
        - text: "«قَرَعَ: الْقَافُ وَالرَّاءُ وَالْعَيْنُ مُعْظَمُ الْبَابِ ضَرْبُ الشَّيْءِ. يُقَالُ قَرَعْتُ الشَّيْءَ أَقْرَعُهُ: ضَرَبْتُهُ. وَمُقَارَعَةُ الْأَبْطَالِ: قَرْعُ بَعْضِهِمْ بَعْضًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر قرع = الضرب؛ مما يُبرر دلالياً 'قارع الدبابيس' بمعنى ضارب الدبابيس ومُسقِطها، غير أن الاستخدام يظل غير مثبَّت معجمياً"
        - text: "«قَارَعَ أَبْطالٌ: ضرب بعضُهم بعضاً بالسيوف في الحرب»"
          source: "المعجم الوسيط"
          addition: "قارع بصيغة المفاعلة مرتبط دلالياً بالحرب والقتال؛ أما قارع (اسم الفاعل من الثلاثي) فأوسع دلالةً لكنه غير مستخدم في سياقات الرياضة"
        - text: "«الدبوس: عَمُود على شكل هراوة مدملكة الرَّأْس، وأداة من مَعْدن على هَيْئَة المسمار الصَّغِير (محدثة)، (ج) دبابيس»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "دبابيس مستخدمة مصطلحاً لـ pins في لعبة البولينج كما تُؤكده مصادر ArabTerm المتعددة (ثنائيات الجناح، وجه ذو دبابيس عكسية، لعبة الكرة والدبابيس)"

    - lemma: "بُوْلِنْجِيٌّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "لاعب بولينج"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي 'لاعب البولنغ' موثَّق في المورد الحديث (2008) مقابلاً معيارياً لـ bowler.
        اللمة صحيحة في بنيتها وتُوافق النمط المثبَّت في المعجمية العربية. تحتاج إلى تصحيح التهجئة
        (بولينج → البولنغ) وإضافة حرف التعريف على المصطلح المعرَّب وإضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "اللمة الوحيدة في المجموعة؛ تجمع بين الجنس البشري (لاعب) والفارق الرياضي (البولنغ) في تركيب إضافي واضح يُعيِّن فاعل هذه الرياضة تعييناً دقيقاً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبُ الْبُوْلِنْغِ"

    - lemma: "دَاحٍ"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكلاسيكية والحديثة متفقة على أن 'الداح' يعني الوشي والنقش والطيب، والفعل 'داح'
        يعني ضخامة البطن أو تفريق المال. ومقاييس اللغة تُثبت أن الجذر دحو يدل على البسط والتمهيد
        لا على الدحرجة الاتجاهية. لا رابط معجمي بلاعب البولينج.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُدَحْرِجٌ"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الوسيط والمعجم الكبير يُحددان صراحةً المُدَحْرِج (اسم الفاعل) = الجُعَل (خنفساء الروث).
        هذا تعارض دلالي قاطع يجعل استخدام هذا اللفظ لاعباً للبولينج مستهجناً في العربية الفصيحة.
      evidence_assessment:
        case: contradicts_only

    - lemma: "قَارِعُ الدَّبَابِيسِ"
      source: stage1
      decision: removed
      decision_reason: >
        التعبير غير مثبَّت معجمياً كوحدة اصطلاحية. اختبار السكّ: يمكن إبدال 'قارع' بـ'هادم'
        أو 'ضارب' ويظل الوصف صالحاً → ليس مصطلحاً مسكوكاً. فضلاً عن ذلك فإن 'قارع' مرتبط
        في الاستعمال بسياق الحرب والقتال لا بالرياضة.
      evidence_assessment:
        case: no_material

    - lemma: "بُوْلِنْجِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوثَّق في قاعدة البيانات. المورد الحديث يستخدم 'البَوْلَر' للقبعة الرجالية لا للاعب،
        أما للاعب فيُستخدم 'لاعب البولنغ'. والتعريب المباشر دون التركيب الإضافي يُفقد المصطلح
        وضوحَه المقولي (لا يُبيَّن أنه لاعب من النوع الفاعل لا الأداة).
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:
  definition:
    current: "لاعب يدحرج الكرات في ممر نحو دبابيس"
