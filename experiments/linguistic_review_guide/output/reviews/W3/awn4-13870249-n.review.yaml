# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13870249-n (twelfth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «الثاني عشر» مسجّلة بدون تشكيل، وهي تحتاج تشكيلاً كاملاً"
      - "المجموعة تحتوي على لمّة واحدة فقط وهو أمر طبيعي للأعداد الترتيبية المركبة"
      - "التعريف يستخدم الرقم 12 بدل كتابة العدد بالحروف"
    observations: "المفهوم هو العدد الترتيبي الثاني عشر، أي الموضع الذي يأتي بعد الحادي عشر مباشرة في سلسلة معدودة. الأعداد الترتيبية من أحد عشر إلى تسعة عشر في العربية مركبات عددية ثابتة لا بدائل لها، فالثَّانِي عَشَرَ هو الشكل الوحيد المعياري. لا يُتوقع وجود مرادفات حقيقية لهذا المفهوم."
  blind_candidates:
    - lemma: "الثَّانِي عَشَرَ"
      generation_method: tarkib
      justification: "العدد الترتيبي المركب المعياري في العربية الفصحى للدلالة على الموضع الثاني عشر، وهو تركيب مزجي ثابت من «ثانِي» على وزن فاعِل من الجذر ث ن ي و«عَشَرَ» المبني على الفتح"
    - lemma: "ثَانِيَ عَشَرَ"
      generation_method: tarkib
      justification: "الصيغة النكرة من العدد الترتيبي المركب، تُستخدم حين يكون المعدود نكرة: جاء رجلٌ ثانيَ عشرَ"
    - lemma: "الاثْنَاعَشَرِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى اثنا عشر على وزن فِعْلاعَشَرِيّ، لكنه مستعمل في المصطلحات الطبية بمعنى «المتعلق بالاثني عشر» (duodenal) لا بمعنى الترتيب"
    - lemma: "دُوزِيَام"
      generation_method: taarib
      justification: "تعريب من الفرنسية douzième، لكنه غير مسموع في العربية ولا حاجة إليه مع وجود الصيغة العربية الأصيلة"

stage2_evidence:
  per_lemma:
    - lemma: "الثَّانِي عَشَرَ"
      confirm:
        - text: "«(1) ثاني عَشَر (2) مُؤلِّفٌ جزءًا من اثني عشر (3) الثاني عشر (4) جزء من اثني عشر.»"
          source: "المورد الحديث (2008)"
        - text: "«ما يَجِيءُ بعدَ الأولِ مُباشرةً في تَرْتيب العَدَد»"
          source: "المعجم الكبير"
      expands:
        - text: "«ثَانِي — من (ث ن ي) الذي يلي الأول، ومن يعطف الشيء ويرد بعضه على بعض. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يوضح أن «ثاني» مشتق من جذر ث ن ي ويدل على ما يلي الأول"
    - lemma: "ثَانِيَ عَشَرَ"
      confirm:
        - text: "«(1) ثاني عَشَر (2) مُؤلِّفٌ جزءًا من اثني عشر (3) الثاني عشر (4) جزء من اثني عشر.»"
          source: "المورد الحديث (2008)"
    - lemma: "الاثْنَاعَشَرِيّ"
      contradicts:
        - text: "«إِثْناعَشَرِيّ — duodenal»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المصطلح مستعمل حصرياً في الطب بمعنى «المتعلق بالاثني عشر» (الأمعاء) وليس بمعنى الترتيب"
        - text: "«الإثناعشريّ — يمثّل الجزء الأوّل من المعى الدقيق، وهو ملولب على شكل حلقة حول رأس وعنق البنكرياس»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
          conflict: "المصطلح مخصص للاستعمال التشريحي ولا يدل على الترتيب"
    - lemma: "دُوزِيَام"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "الثَّانِي عَشَرَ"
      decision: confirmed
      decision_reason: "العدد الترتيبي المركب المعياري الوحيد في العربية الفصحى للدلالة على الموضع الثاني عشر، مؤيَّد بشواهد المعجم الكبير والمورد الحديث"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الثَّانِي عَشَرَ"
    - lemma: "ثَانِيَ عَشَرَ"
      source: stage1
      decision: removed
      decision_reason: "صيغة نكرة من نفس التركيب الترتيبي، والمجموعة تمثل المفهوم المعرّف (المركز/الموضع) لا الصفة النكرة، فلا حاجة لإدراجها مستقلّةً"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
    - lemma: "الاثْنَاعَشَرِيّ"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مخصص في الاستعمال الطبي للدلالة على الاثني عشر (جزء من الأمعاء الدقيقة)، ولا يدل على الترتيب العددي مطلقاً"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "دُوزِيَام"
      source: stage1
      decision: removed
      decision_reason: "تعريب لا حاجة إليه البتة مع وجود الصيغة العربية الأصيلة المعيارية، ولم يُعثر عليه في أي معجم"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

