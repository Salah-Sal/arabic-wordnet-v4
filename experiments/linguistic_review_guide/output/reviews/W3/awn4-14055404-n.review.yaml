# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14055404-n (air alert)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تأهب جوي» تركيب وصفي لا إضافي، وهو مصطلح عسكري حديث لا يرد في المعاجم التراثية"
      - "المجموعة تحتوي على لمّة واحدة فقط، ممّا يُضعف التغطية المعجمية"
      - "التعريف العربي واضح لكنه يفتقر إلى التحديد: لا يميّز بين درجات التأهب الجوي"
    observations: "المفهوم عسكري بحت: حالة تكون فيها الطائرات المقاتلة محلّقة في الجوّ ومستعدة لتنفيذ عملية. هذا يختلف عن الإنذار الجوي (air raid warning) الذي يحذّر من غارة قادمة، وعن الاستنفار العام. المصطلح الإنجليزي air alert يشمل حالة التأهب القصوى حيث تكون الطائرات في الجوّ فعلاً لا على الأرض. المفرط الأعلى (hypernym) هو «حالة تأهب» وهو مناسب."
  blind_candidates:
    - lemma: "اسْتِنْفَارٌ جَوِّيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «استنفار» (طلب النفير والتجنيد) و«جوّيّ» (نسبة إلى الجوّ). يدلّ على حالة تعبئة القوات الجوية وإطلاقها"
    - lemma: "إِنْذَارٌ جَوِّيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «إنذار» (الإعلام بما يُحذَر منه) و«جوّيّ». شائع في الخطاب العسكري العربي للدلالة على حالة التأهب الجوي"
    - lemma: "تَحَفُّزٌ جَوِّيٌّ"
      generation_method: tarkib
      justification: "من جذر «حفز» الدالّ على الحثّ والاستعداد للانطلاق. التحفّز هو كون المرء على وشك الفعل، وهو أقرب إلى حالة الطائرات المحلّقة الجاهزة"
    - lemma: "تَرَصُّدٌ جَوِّيٌّ"
      generation_method: tarkib
      justification: "من جذر «رصد» الدالّ على التهيّؤ لرقبة شيء. الترصّد يفيد المراقبة مع الاستعداد للعمل، وهو مناسب لحالة الطائرات المتأهبة في الجوّ"

stage2_evidence:
  per_lemma:
    - lemma: "تَأَهُّبٌ جَوِّيٌّ"
      confirm:
        - text: "«(تأهب) لَهُ استعد يُقَال تأهب للسَّفر وللأمر»"
          source: "المعجم الوسيط"
        - text: "«للأمر : أَهَبَ , يقال : تَأَهَّبَ للسَّفر .»"
          source: "المعجم الكبير"
        - text: "«تأهب: الاستعداد لأحداث معينة أو غير متوقعة.» (preparedness)"
          source: "مسرد المناخ والبيئة (ALECSO)"
        - text: "«تأهب عالٍ: حالة تتجند فيها كل طاقات مؤسسة إعلامية عند حلول مناسبة كبيرة أو عند حدوث طوارئ» (high alert)"
          source: "مسرد الإعلام والتواصل (ALECSO)"
      expands:
        - text: "«(1) استعداد (2) تأهُّب [للحرب].» (preparedness)"
          source: "المورد الحديث (2008)"
          addition: "يؤكد استعمال «تأهب» في السياق العسكري (تأهب للحرب)"
        - text: "«(4) تأهُّب (5) إنذار [بغارة جوّية إلخ]» (alert)"
          source: "المورد الحديث (2008)"
          addition: "المورد يترجم alert بـ«تأهب» و«إنذار» معاً، ممّا يؤكد ملاءمة تأهب للمفهوم"

    - lemma: "اسْتِنْفَارٌ جَوِّيٌّ"
      confirm:
        - text: "«استنفار لكلاب الصيد [بواسطة البوق].» (recheat)"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(نَفَرَ) النُّونُ وَالْفَاءُ وَالرَّاءُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَجَافٍ وَتَبَاعُدٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "جذر «نفر» يدلّ على التباعد والتجافي لا على التأهب والاستعداد؛ الاستنفار هو طلب النفير (الخروج للقتال) لا حالة التأهب في الجوّ"

    - lemma: "إِنْذَارٌ جَوِّيٌّ"
      contradicts:
        - text: "«الإنذار: الإعلام بما يحذر. قال ابن عطية ولا يكاد يكون إلا في تخويف يسع زمانه الاحتراز»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الإنذار إعلامٌ بخطرٍ وتخويف، لا حالة تأهب واستعداد؛ الإنذار الجوي يعني التحذير من غارة جوية لا حالة كون الطائرات محلّقة"
        - text: "«(نَذَرَ) النُّونُ وَالذَّالُ وَالرَّاءُ كَلِمَةٌ تَدُلُّ عَلَى تَخْوِيفٍ أَوْ تَخَوُّفٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدور حول التخويف لا الاستعداد"

    - lemma: "تَحَفُّزٌ جَوِّيٌّ"
      confirm:
        - text: "«(حَفَزَ) الْحَاءُ وَالْفَاءُ وَالزَّاءُ كَلِمَةٌ وَاحِدَةٌ تَدَلُّ عَلَى الْحَثِّ وَمَا قَرُبَ مِنْهُ. فَالْحَفْزُ: حَثُّكَ الشَّيْءَ مِنْ خَلْفِهِ. [وَالرَّجُلُ] يَحْتَفِزُ فِي جُلُوسِهِ إِذَا أَرَادَ الْقِيَامَ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«يَحْتَفِزُ فِي جُلُوسِهِ إِذَا أَرَادَ الْقِيَامَ، كَأَنَّ حَاثًّا حَثَّهُ وَدَافِعًا دَفَعَهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الاحتفاز يفيد الاستعداد على وشك الفعل، وهو قريب من حالة الطائرات المحلّقة الجاهزة"

    - lemma: "تَرَصُّدٌ جَوِّيٌّ"
      contradicts:
        - text: "«(رَصَدَ) الرَّاءُ وَالصَّادُ وَالدَّالُ أَصْلٌ وَاحِدٌ، وَهُوَ التَّهَيُّؤُ لِرِقْبَةِ شَيْءٍ عَلَى مَسْلَكِهِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الترصّد يغلب عليه معنى المراقبة والترقّب لا الاستعداد القتالي؛ المفهوم المطلوب هو جاهزية للعمليات لا رصد ومراقبة"

stage3_analysis:
  per_lemma:
    - lemma: "تَأَهُّبٌ جَوِّيٌّ"
      decision: confirmed
      decision_reason: "اللمّة مؤكدة بأدلة معجمية قوية: «تأهب» ثابت في الوسيط والكبير بمعنى الاستعداد، وفي المصطلحات الحديثة (ALECSO) كمقابل لـ preparedness وhigh alert. التركيب الوصفي «تأهب جوي» واضح الدلالة ومطابق للمفهوم العسكري."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يدلّ على حالة الاستعداد القتالي الجوي حيث تكون الطائرات محلّقة وجاهزة للعمل — المصطلح العسكري المعياري"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَأَهُّبٌ جَوِّيٌّ"

    - lemma: "اسْتِنْفَارٌ جَوِّيٌّ"
      source: stage1
      decision: removed
      decision_reason: "الاستنفار يدلّ على طلب النفير والخروج للقتال، وأصل الجذر «نفر» يدلّ على التباعد والتجافي. المفهوم المطلوب هو حالة الجاهزية في الجوّ لا الدعوة إلى النفير. كما أن «استنفار جوي» لم يُسجَّل مصطلحاً عسكرياً ثابتاً."
      evidence_assessment:
        case: mixed

    - lemma: "إِنْذَارٌ جَوِّيٌّ"
      source: stage1
      decision: removed
      decision_reason: "الإنذار إعلام بخطر وتخويف منه، لا حالة تأهب واستعداد. «الإنذار الجوي» في الاستعمال العسكري العربي يعني التحذير من غارة جوية مرتقبة (air raid warning)، وهو مفهوم مختلف تماماً عن «حالة التأهب الجوي» حيث الطائرات محلّقة فعلاً."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَحَفُّزٌ جَوِّيٌّ"
      source: stage1
      decision: removed
      decision_reason: "رغم أن جذر «حفز» يفيد الحثّ والاستعداد على وشك الفعل، فإن «تحفّز جوي» تركيب غير مسكوك ولم يُسجَّل في أيّ معجم مصطلحي عسكري. كما أن التحفّز يدلّ على اللحظة السابقة للفعل (كالمحتفز في جلوسه)، بينما المفهوم المطلوب حالة مستمرة من الجاهزية."
      evidence_assessment:
        case: confirm_only

    - lemma: "تَرَصُّدٌ جَوِّيٌّ"
      source: stage1
      decision: removed
      decision_reason: "الترصّد يغلب عليه معنى المراقبة والترقّب على مسلك الشيء، لا الجاهزية القتالية. المفهوم المطلوب يركّز على كون الطائرات مستعدة للعمل لا على رصدها للعدوّ."
      evidence_assessment:
        case: contradicts_only

