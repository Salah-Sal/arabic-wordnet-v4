    observations: "المجموعة تمثّل المفهوم الترتيبي للعدد سبعة عشر، أي الموضع الذي يأتي بعد السادس عشر في سلسلة معدودة. العربية تعبّر عنه بالعدد الترتيبي المركب «السَّابِعَ عَشَرَ» المبني على فتح الجزأين. هذا المفهوم أصيل في العربية ولا يحتاج إلى اقتراض أو توليد."
