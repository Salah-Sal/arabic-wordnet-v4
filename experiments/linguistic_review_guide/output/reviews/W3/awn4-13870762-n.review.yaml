        - text: "«ما بين السادس والثامن من العدد هو سابع سبعة : أحد السبعة»"
          source: "المعجم الوسيط (OCR)"
        - text: "«(1) سابعَ عَشَرَ (2) جزء من سبعة عشر (1/17)»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«السَّابِعُ عَشَرَ — الجذر: س ب ع — مثال: جَاء اليومُ السابِعُ عَشَرَ — الرأي: مرفوضة عند الأكثرين — السبب: للخطأ في إعراب الجزء الأول من وصف العدد المركَّب بالرفع، وهو يُبْنَى على فتح الجزأين. الصواب والرتبة: جاء اليومُ السابِعَ عَشَرَ [فصيحة] — جاء اليومُ السابِعُ عَشَرَ [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يوضّح أنّ البناء على فتح الجزأين هو الأفصح، وأنّ إعراب الجزء الأول بحسب الموقع صحيح أيضاً"
        - text: "«السَّابِعِ عَشَرَ — الجذر: س ب ع — مثال: سيسافر في السابِعِ عَشَرَ من هذا الشهر — الرأي: مرفوضة عند الأكثرين — الصواب والرتبة: سيسافر في السَّابِعَ عَشَرَ من هذا الشهر [فصيحة] — سيسافر في السَّابِعِ عَشَرَ من هذا الشهر [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يوضّح أنّ بناء الجزأين على الفتح هو الأفصح حتى في حالة الجرّ، مع جواز إعراب الأول"
    - lemma: "سَابِعَ عَشَرَ"
      confirm:
        - text: "«(1) سابعَ عَشَرَ (2) جزء من سبعة عشر (1/17)»"
          source: "المورد الحديث (2008)"
    - lemma: "السَّابِعَةَ عَشْرَةَ"
      evidence_status: "no_material_found"
    - lemma: "سَابِعَةَ عَشْرَةَ"
      evidence_status: "no_material_found"


