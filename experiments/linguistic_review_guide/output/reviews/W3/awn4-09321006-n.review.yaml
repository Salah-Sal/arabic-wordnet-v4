stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'خليج كورنث' تفتقر إلى التشكيل الكامل."
    observations: "المجموعة تشير إلى معلم جغرافي محدد (خليج في اليونان). التسمية العربية الشائعة هي 'خليج كورنث'. التسمية التاريخية 'خليج ليبانتو' موجودة في المراجع الإنجليزية (Gulf of Lepanto) ولها صيت تاريخي في المصادر العربية."
  blind_candidates:
    - lemma: "خَلِيجُ كُورِنْث"
      generation_method: tarkib
      justification: "الاسم الجغرافي المعاصر والمعياري للخليج في اللغة العربية."
    - lemma: "خَلِيجُ لِيبَانْتُو"
      generation_method: tarkib
      justification: "الاسم التاريخي للخليج (نسبة إلى مدينة ليبانتو)، وهو مرادف مذكور في OEWN."
    - lemma: "خَلِيجُ قُورِنْتُس"
      generation_method: tarkib
      justification: "التعريب الكلاسيكي لاسم المدينة، ويُستخدم أحياناً في السياقات التاريخية."
    - lemma: "جَوْنُ كُورِنْث"
      generation_method: tarkib
      justification: "استخدام لفظ 'جون' كمرادف فصيح لـ'خليج' في السياق الجغرافي."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيجُ كُورِنْث"
      confirm:
        - text: "«(1) الكورَنثيّ: أحد أبناء كورنث باليونان... (3) كورَنْثيّ: منسوب إلى كورنث...»"
          source: "المورد الحديث"
        - text: "«...متعلق ببرزخ كورنث في اليونان...»"
          source: "المورد الحديث"
        - text: "«...ورَحَل فى طَلَبه إلى كورنث والإسكندرية...»"
          source: "المعجم الكبير"
    - lemma: "خَلِيجُ لِيبَانْتُو"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "خليج كورنث"
      decision: confirmed
      decision_reason: "الاسم الحديث الأكثر شيوعاً والمطابق للمسمى الجغرافي واللمة الإنجليزية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ كُورِنْث"
    - lemma: "خَلِيجُ لِيبَانْتُو"
      source: stage1
      decision: confirmed
      decision_reason: "اسم تاريخي مرادف مشهور، يطابق اللمة الإنجليزية Gulf of Lepanto، ويُستخدم في سياق معركة ليبانتو البحرية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "خَلِيجُ لِيبَانْتُو"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

stage4_content:
  definition:
    current: "مدخل للبحر الأيوني بين وسط اليونان وشبه جزيرة بيلوبونيز"
    assessment:
      decision: revise
      reason: "التعريف الحالي ترجمة حرفية؛ يفضل صياغته بأسلوب معجمي عربي مع ضبط الأعلام وتحديد الموقع بدقة."
    authored:
      - type: encyclopedic
        text: "خَلِيجٌ بَحْرِيٌّ عَمِيقٌ فِي الْيُونَانِ، يَفْصِلُ بَيْنَ وَسَطِ الْيُونَانِ وَشِبْهِ جَزِيرَةِ الْبِيلُوبُونِيز، وَيَتَّصِلُ بِالْبَحْرِ الْأَيُونِيِّ عَبْرَ خَلِيجِ بَاتْرَاس."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "خَلِيجٌ بَحْرِيٌّ عَمِيقٌ فِي الْيُونَانِ، يَفْصِلُ بَيْنَ وَسَطِ الْيُونَانِ وَشِبْهِ جَزِيرَةِ الْبِيلُوبُونِيز، وَيَتَّصِلُ بِالْبَحْرِ الْأَيُونِيِّ عَبْرَ خَلِيجِ بَاتْرَاس."
  examples:
    per_lemma:
      - lemma: "خَلِيجُ كُورِنْث"
        examples:
          - text: "تَمَّ شَقُّ قَنَاةِ كُورِنْث لِتَرْبِطَ خَلِيجَ كُورِنْث بِالْبَحْرِ الْإِيِجِيِّ."
            type: usage
      - lemma: "خَلِيجُ لِيبَانْتُو"
        examples:
          - text: "وَقَعَتْ مَعْرَكَةُ لِيبَانْتُو الْبَحْرِيَّةُ فِي مِيَاهِ خَلِيجِ لِيبَانْتُو عَامَ 1571م."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تَمَّ شَقُّ قَنَاةِ كُورِنْث لِتَرْبِطَ خَلِيجَ كُورِنْث بِالْبَحْرِ الْإِيِجِيِّ."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "وَقَعَتْ مَعْرَكَةُ لِيبَانْتُو الْبَحْرِيَّةُ فِي مِيَاهِ خَلِيجِ لِيبَانْتُو عَامَ 1571م."

