# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي «مؤيد للنسوية وحقوق المرأة» دائريٌّ جزئيًا: استخدم «نسوية» في تعريف المنتسب إليها"
      - "اللمّة «مُدافِع عَن حُقُوق المَرْأَة» مطوَّلة (5 مكونات مع حروف الجر)، مما يُثقل الإدخال المعجمي"
      - "التشكيل الكامل غائب عن بعض مكونات اللمّة الثانية (سكون النون في «عَنْ» وكسرة القاف في «حُقُوقِ» وكسرة تاء التأنيث في «الْمَرْأَةِ»)"
      - "غياب التمييز الصريح بين الدلالة الأيديولوجية لـ«نِسْوِيّ» والدلالة الحقوقية لـ«مُدافِع عَن حُقُوق المَرْأَة»"
    observations: >-
      المجموعة تُمثِّل الشخص المؤيِّد لحركة النسوية (feminism) إيديولوجيًا وعمليًا. اللمّة «نِسْوِيّ»
      مصطلح مستقر في الخطاب العربي المعاصر، مشتق من «نِسوة» على وزن النسبة، ويُفيد الانتماء
      الفكري إلى مبدأ المساواة بين الجنسين. أما «مُدافِع عَن حُقُوق المَرْأَة» فأعرض دلالةً
      إذ يشمل الناشط الحقوقي الذي لا يتبنّى تحديدًا منظومة النسوية بمفهومها الأيديولوجي.
      الجذر الوليد للمصطلحات في هذا الحقل هو «نسو» (من نِسوة) الذي أنتج النسبة «نِسْوِيّ»
      والمصدر الصناعي «النِّسْوِيَّة»، وهو جذر غير مُدرَج صراحةً في مقاييس ابن فارس كأصل مستقل.

  blind_candidates:
    - lemma: "نِسَوِيٌّ"
      generation_method: ishtiqaq
      justification: >-
        مشتق من «نِسوة» على وزن النسبة (فِعَلِيّ)، دالٌّ على المنتسب فكريًا وعمليًا إلى قضايا
        النساء وحقوقهن؛ الاشتقاق مطّرد ومبني على أصل عربي واضح.
    - lemma: "مُنَاضِلٌ نِسَوِيٌّ"
      generation_method: tarkib
      justification: >-
        مركّب وصفي (wasfi) من «مُنَاضِل» (اسم فاعل من نَضَلَ يدل على الجهاد والمدافعة)
        و«نِسَوِيّ» (وصف مُخصِّص لنوع النضال)؛ يُحكِم دلالة النضال الموجَّه لقضية المرأة.
    - lemma: "مُنَاصِرُ الْمَرْأَةِ"
      generation_method: tarkib
      justification: >-
        مركّب إضافي (idafi) من «مُنَاصِر» (اسم فاعل من نَصَرَ، يدل على الإتيان بالخير
        والنصرة) مضافٌ إلى «الْمَرْأَة»؛ الجذر نصر له حضور قوي في اللغة ويُعبِّر عن
        التأييد الفاعل.
    - lemma: "تَحَرُّرِيٌّ"
      generation_method: ishtiqaq
      justification: >-
        مشتق من المصدر «تَحَرُّر» على وزن تَفَعُّلِيّ (النسبة إلى التحرر)، يدل على المنتمي
        لتيارات تحرير المرأة من قيود التمييز والإقصاء.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "نِسْوِيّ"
      confirm:
        - text: >-
            «النَّقد النِّسْويّ [فصيحة] — النَّقد النُّسْويّ [فصيحة مهملة]. التعليق: الكلمة
            منسوبة إلى «نِسْوة» التي جاءت في المعاجم بكسر النون وضمها وإن كان الكسر أفصح
            كما يقول المصباح؛ فيكون النسب نِسْوِيّ، ونُسْوِيّ.»
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت 2003)"
      expands:
        - text: >-
            «نِسْوية: حركة ترتبط بالجنس الآخر لسيمون دوبوفوار وتحرّر المرأة (في القرن20)،
            بعد تطوّر الوعي وتنامي الإسهام الأدبي والفلسفي والسّياسي في الحياة العامة.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          addition: >-
            يُثبِت الدخول المعجمي للمصدر الصناعي «نِسوية» في المعاجم المتخصصة، مما يُرسِّخ
            دلالة النسبة «نِسوي» كمصطلح منتمٍ لهذه الحركة.
        - text: >-
            «صِحافة نِسْوِيَّة — women's press»; «قناة نِسْويّة، محطة نِسْويّة — women's channel»;
            «مجلة نِسْويّة، دَوْرِية نِسْويّة — women's magazine»
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
          addition: >-
            توثيق واسع لاستعمال «نِسْوِيّ» صفةً في مركّبات وصفية متعددة المجالات، مما
            يُثبت ثبات المصطلح وإنتاجيته الاشتقاقية.
        - text: >-
            «أدبٌ نِسْويّ: تفريع عن الأدب يسعى إلى تقويم الإسهام الأدبي في الكتابات الحديثة،
            لإبراز الأهمية الخاصة لخطابٍ أبرزَ جَدارته بإسهاماته، بعد أن أصبحت الكتابة مجالًا
            لِتقاسُم المتخيل الفني كما تكونت تراكمات تميزَ فيها الصوت النسوي بجُرأة خاصة.»
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ARABTERM"
          addition: >-
            يُظهر استعمال «نِسْوِيّ» في المركّب الوصفي «أدب نسوي» بوصفه مصطلحًا متخصصًا،
            ما يُثبت ثباته المعجمي واستقلاليته الدلالية عن مجرد التأنيث.

    - lemma: "مُدافِع عَن حُقُوق المَرْأَة"
      confirm:
        - text: >-
            «مُدَافِع: من (د ف ع) مزيل الشيء بقوة، والمزاحم والذائد عن عِرْضه وأرضه وماله.»
          source: "موسوعة السلطان قابوس لأسماء العرب — hawramani"
        - text: >-
            «(دَفَعَ) الدَّالُ وَالْفَاءُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ مَشْهُورٌ، يَدُلُّ عَلَى تَنْحِيَةِ الشَّيْءِ.
            يُقَالُ دَفَعْتُ الشَّيْءَ أَدْفَعُهُ دَفْعًا. وَدَافَعَ اللَّهُ عَنْهُ السُّوءَ دِفَاعًا.»
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: >-
            «القائل بالمساواة بين الجنسين. — feminist»
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >-
            يُقدِّم المعجم الحديث صيغةً وصفية للمفهوم لا مصطلحًا مفردًا، مما يُثبت أن
            دلالة «المدافع عن حقوق المرأة» موثَّقة وإن بشكل عبارة وصفية لا مفردة مسكوكة.
        - text: >-
            «الأحراريّ: نصير مجموعة معيّنة، وبخاصة النساء. — libber»
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >-
            المعجم يقترح «الأحراري» لـ libber (المتحرر المتطرف)، مع إشارة إلى تخصيصه
            بنصرة النساء. يكشف أن المعجم الحديث لجأ إلى وصف دوري لا مصطلح جذري مبتكر.

    - lemma: "نِسَوِيٌّ"
      contradicts:
        - text: >-
            «نَسَوِيّ — مرفوضة عند بعضهم — السبب: للخطأ في الضبط. الصواب والرتبة:
            النَّقد النِّسْويّ [فصيحة] — النَّقد النُّسْويّ [فصيحة مهملة]»
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت 2003)"
          conflict: >-
            الصيغة ذات الفتحة على النون (نَسَوِيّ) مرفوضة. كذلك صيغة المرشح بفتح السين
            (نِسَوِيّ) تخالف الصواب الذي هو نِسْوِيّ (بسكون السين). فضلًا عن تطابق الصورة
            المعيارية مع اللمّة الموجودة نِسْوِيّ.

    - lemma: "مُنَاضِلٌ نِسَوِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "مُنَاصِرُ الْمَرْأَةِ"
      evidence_status: "no_material_found"

    - lemma: "تَحَرُّرِيٌّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "نِسْوِيّ"
      decision: confirmed
      decision_reason: >-
        مصطلح مشتق صحيح على وزن النسبة من «نِسوة»، مُثبَت في معجم الصواب اللغوي بوصفه
        الصيغة الفصيحة. واسع الاستعمال في الخطاب العربي المعاصر اسمًا ووصفًا. يُعبِّر عن
        الانتماء الأيديولوجي إلى حركة النسوية بدقة ووجازة لا تتوافرها اللمّة الثانية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُركِّز على البُعد الفكري والأيديولوجي: المنتسب إلى مبدأ النسوية بوصفه منظومة فكرية؛
        يُستعمل اسمًا (نِسْوِيٌّ دَعَا إلى...) ووصفًا (فكرٌ نِسْوِيٌّ)، وهو أكثر إيجازًا
        وأدق اصطلاحيةً من الصيغة العبارية.
      quality_gates:
        consistency: "مطّرد — النسبة من نِسوة مقيسة"
        ease_of_circulation: "يسير — مفردة ثلاثية الأصل واسعة التداول"
        appropriateness: "ملائم — شائع في الصحافة والأكاديميا العربية"
        heritage_preference: "جذر عربي أصيل"
        arabic_preference: "عربي صرف، لا تعريب"
        derivability: "عالية — أنتج: نِسوية، نِسويًّا، نِسويات"
      morphological_fit: "وزن فِعْلِيّ (النسبة) مناسب لبناء الانتماء الأيديولوجي، مطابق لأنماط: يساري، يميني، ليبرالي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نِسْوِيٌّ"

    - lemma: "مُدافِع عَن حُقُوق المَرْأَة"
      decision: confirmed
      decision_reason: >-
        تعبير إضافي مركّب راسخ في الخطاب الحقوقي العربي، يُثبَت استعماله في المعاجم الحديثة
        وفي التقارير الدولية المترجمة. رغم طوله يُمثِّل وحدة معجمية ثابتة في السياق الحقوقي،
        ويغطي دلالةً مختلفة عن نِسْوِيّ (الناشط الحقوقي لا الأيديولوجي فقط). اجتاز اختبار
        السكّ: لا يمكن إبدال «حقوق» بـ«شؤون» أو «قضايا» دون تغيير الدلالة الاصطلاحية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُبرز البُعد الحقوقي والناشطاتي العملي؛ قد يُوصف بها من يناضل لصالح المرأة
        قانونيًا أو مؤسسيًا دون أن يتبنى ضرورةً المنظومة الفكرية النسوية بمفهومها الأيديولوجي.
        أعرض دلالةً من «نِسْوِيّ» وأكثر التصاقًا بالممارسة الحقوقية.
      quality_gates:
        consistency: "مطّرد — المركب مدافع+عن+حقوق+المرأة نمط منتج في العربية الحقوقية"
        ease_of_circulation: "معقول رغم الطول، معروف في الخطاب المؤسسي الدولي"
        appropriateness: "ملائم — خطاب المنظمات الدولية يستعمله"
        heritage_preference: "مبني على جذور عربية أصيلة: دفع، حقق، مرأ"
        arabic_preference: "عربي صرف"
        derivability: "محدودة كمركب طويل، لكن مكوناته قابلة للاشتقاق"
      morphological_fit: "اسم الفاعل مُفاعِل (مُدَافِع) صيغة منتجة للدلالة على الممارس الفاعل"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُدَافِعٌ عَنْ حُقُوقِ الْمَرْأَةِ"

    - lemma: "نِسَوِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        مرادف مشكّل للمة الموجودة «نِسْوِيّ» (الصورة المعيارية) مع تشكيل مغلوط: الصواب
        سكونُ السين (نِسْوِيّ) لا فتحها (نِسَوِيّ)، وهو ما أكّده معجم الصواب اللغوي صراحةً
        حين رفض نَسَوِيّ. إضافة هذا الشكل ستُوجِد ازدواجًا إملائيًا مضللًا.

    - lemma: "مُنَاضِلٌ نِسَوِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر له على شاهد معجمي في قاعدة البيانات. فضلًا عن ذلك لم يجتز اختبار السكّ:
        يمكن إبدال «مُنَاضِل» بـ«مُناصِر» أو «مُدافِع» مع الإبقاء على الوصف الدلالي
        نفسه، مما يدل على أنه وصف حر لا مصطلح مسكوك.

    - lemma: "مُنَاصِرُ الْمَرْأَةِ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا أدلة معجمية على تثبّته وحدةً اصطلاحية. دلالة «مُنَاصِر» تتداخل مع «مُدَافِع»
        الموجودة، ولا تُضيف فارقًا دلاليًا واضحًا. غياب الشاهد المعجمي يحول دون الإدراج.

    - lemma: "تَحَرُّرِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        اللفظ مفيدٌ للدلالة العامة على التوجه التحرري (liberation movement) لكنه أعرض
        دلالةً من المطلوب وغير مخصص لحقوق المرأة؛ يشمل أي تيار تحرري سياسي أو اجتماعي.
        لا شاهد معجمي على استعماله بدلالة feminist تحديدًا.


