            كَلِمَاتٌ لَا تَنْقَاسُ. يُقَالُ امْرُؤٌ وَامْرَآنِ، وَقَوْمُ امْرِئٍ.
            وَامْرَأَةٌ تَأْنِيثُ امْرِئٍ.»

