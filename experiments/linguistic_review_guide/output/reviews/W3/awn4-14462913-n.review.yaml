# مراجعة المجموعة الترادفية — awn4-14462913-n
# a state of shame or disgrace (dishonor / dishonour)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي «حالة من الخجل أو العار» يستخدم لمّة عار وهي عضو في المجموعة ذاتها — دوران معجمي"
      - "اللمّتان خزي وعار مكتوبتان بدون تشكيل"
      - "الخَجَل يختلف عن الخِزْي والعار؛ الخجل شعور ذاتي داخلي بينما الخزي والعار حالة اجتماعية تتعلق بسقوط المنزلة"
    observations: "المجموعة تعبّر عن مفهوم أخلاقي اجتماعي متجذر في الثقافة العربية، إذ تدور حول سقوط القدر والمكانة بسبب فعل مشين. العلاقة بالمجموعة الأعلى (سمعة/مكانة) صحيحة فهي نوع من أحوال السمعة السلبية. اللمّتان الموجودتان (خزي، عار) أساسيتان في هذا الحقل الدلالي وتغطيان جوهر المفهوم."
  blind_candidates:
    - lemma: "هَوَانٌ"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر هون على وزن فَعَال، يدل على الذل والسقوط من الأعين، وهو من أقرب الألفاظ لمعنى الخزي والعار"
    - lemma: "مَذَلَّةٌ"
      generation_method: ishtiqaq
      justification: "اسم مكان ومصدر ميمي من ذَلَّ على وزن مَفْعَلَة، يدل على حالة الذل والانكسار"
    - lemma: "فَضَاحَةٌ"
      generation_method: ishtiqaq
      justification: "مصدر من فَضَحَ على وزن فَعَالة، يدل على حالة الانكشاف والافتضاح"
    - lemma: "سُبَّةٌ"
      generation_method: ishtiqaq
      justification: "من الجذر سبب على وزن فُعْلَة، ورد في المعاجم بمعنى العار والعيب"


stage2_evidence:
  per_lemma:
    - lemma: "خِزْيٌ"
      confirm:
        - text: "«ذُلٌّ وهَوَانٌ يُسْتَحْيا منه. العذابُ»"
          source: "المعجم الكبير"
        - text: "«الخزي: إظهار القبائح التي يستحى من إظهارها عقوبة، قاله الحرالي، وقال غيره: هو أن يفضح صاحبه وهو وضع من القدر للغم الذي يلحق به، وأصله التغيير. وقال بعضهم: الذل والهوان والانكسار.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«خَزِيَ الرّجل: لحقه انكسار، إمّا من نفسه، وإمّا من غيره. فالذي يلحقه من نفسه هو الحياء المفرط، ومصدره الخَزَايَة ورجل خَزْيَان. والذي يلحقه من غيره يقال: هو ضرب من الاستخفاف، ومصدره الخِزْي»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
        - text: "«خِزْي: فضيحة، عار، ضرر للسُّمعة ناتج عن تصرّف لا أخلاقيّ أو غير مناسب. ذلّ وهوان»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«خَزِيَ فلانٌ يَخْزَى خِزْياً، وهو من السُّوءِ، والله أخْزاه وأَقامَه على خِزْيةٍ، وعلى مخزاة. والخَزايةُ: الاستِحياءُ»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: "يفرّق بين الخِزي (سوء وذل خارجي) والخَزاية (استحياء داخلي)"
        - text: "«وقع في بليّةٍ وشرٍّ وافتضح, فذلّ بذلك وهان»"
          source: "المعجم الوسيط"
          addition: "يبيّن أن الخزي مرتبط بالافتضاح والوقوع في بلية"

    - lemma: "عَارٌ"
      confirm:
        - text: "«كلُّ ما يلزمُ منه سُبَّةٌ أو عيب»"
          source: "المعجم الوسيط"
        - text: "«السبة والعيب»"
          source: "مجمل اللغة"
        - text: "«كل مَا يلْزم مِنْهُ سبة أَو عيب (ج) أعيار»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (حوراماني)"
      expands:
        - text: "«(1) خِزْي؛ عار (2) إهانة... (5) يُخزي: يلبسه ثوبَ الخزي والعار»"
          source: "المورد الحديث (ترجمة dishonor)"
          addition: "يؤكد التلازم بين خزي وعار في الترجمة الثنائية"

    - lemma: "هَوَانٌ"
      confirm:
        - text: "«الخزي: الذل والهوان والانكسار»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الْهَاءُ وَالْوَاوُ وَالنُّونُ أُصَيْلٌ يَدُلُّ عَلَى سُكُونٍ أَوْ سَكِينَةٍ أَوْ ذُلٍّ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الهوان يدل على الذل والسكون لا على العار والفضيحة تحديداً؛ فهو أعم من المفهوم المقصود"

    - lemma: "مَذَلَّةٌ"
      contradicts:
        - text: "«(المذلة) النُّكْتَة فِي الصَّخْرَة ونواة التمرة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (حوراماني)"
          conflict: "المعنى المعجمي الأول للمذلة مادي (نكتة في الصخرة) لا معنوي"
        - text: "«عَيْرُ المَذَلَّةِ: الوَتِدُ؛ لأَنَّهُ يُشَجُّ رأسه»"
          source: "المعجم الكبير"
          conflict: "المذلة في المعجم الكبير وردت في سياق مادي تعبيري لا بمعنى الخزي"

    - lemma: "فَضَاحَةٌ"
      evidence_status: "no_material_found"

    - lemma: "سُبَّةٌ"
      confirm:
        - text: "«العارُ مَنْ يُكثر النَّاسُ سبَّهَ»"
          source: "المعجم الوسيط"
        - text: "«العار أو ما يُسَبُّ به المرء مَنْ يَكْثُرُ الناسُ سَبَّهُ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الزمنُ من الدهر... أصابتنا سَبَّةٌ من بَرْدٍ أو حَرٍّ»"
          source: "المعجم الوسيط"
          conflict: "للسبّة معانٍ أخرى متباعدة (الزمن، الاست) مما يُضعف تخصيصها للعار"
      expands:
        - text: "«مَنْ يُكْثِرُ سَبَّ الناس. يُقال: رَجُلٌ سُبَّة. العارُ.»"
          source: "المعجم الكبير"
          addition: "السبّة تطلق على الشخص الذي يُكثَر سبّه أو على العار ذاته، فهي سبب العار أكثر من كونها حالة العار"


stage3_analysis:
  per_lemma:
    - lemma: "خِزْيٌ"
      decision: confirmed
      decision_reason: "لمّة أصيلة مؤصّلة في المعاجم الكلاسيكية والحديثة بمعنى الذل والهوان والفضيحة. شواهد قرآنية متعددة تؤكد استعمالها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "الخِزْي يتضمن بُعد الافتضاح والوقوع في السوء من جرّاء فعل قبيح، وفيه معنى الإبعاد والمقت من الله أو الناس. يركّز على الحالة الناتجة عن الانكشاف."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خِزْيٌ"

    - lemma: "عَارٌ"
      decision: confirmed
      decision_reason: "لمّة ثابتة في المعاجم بمعنى كل ما يلزم منه سبّة أو عيب. شائعة الاستعمال في الفصحى المعاصرة والتراثية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "العار يركّز على الوَصمة الاجتماعية التي تلحق بالمرء وتلصق به بين الناس. هو ما يُعاب به المرء ويُنسب إليه من نقيصة، أقرب إلى السمعة السيئة الدائمة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَارٌ"

    - lemma: "هَوَانٌ"
      source: stage1
      decision: removed
      decision_reason: "الهوان يدل على الذل والضعة عموماً ولا يتضمن بالضرورة معنى الفضيحة والعار. أصله في مقاييس اللغة يدل على السكون والذل، وهو أعم من المفهوم المستهدف. كما أنه أقرب دلالياً إلى المجموعة الأعلى (سمعة/مكانة) منه إلى هذه المجموعة تحديداً."
      evidence_assessment:
        case: mixed

    - lemma: "مَذَلَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "الشواهد المعجمية لا تدعم استعمال مَذَلَّة بمعنى العار والخزي تحديداً. المعنى المسجّل في المعاجم مادي (نكتة في الصخرة) أو مجازي بعيد. والذِّلَّة أقرب لكنها تدل على الضعف لا الفضيحة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "فَضَاحَةٌ"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثر لها على شاهد معجمي. فَضِيحَة مسجّلة لكنها تدل على الحدث (واقعة الافتضاح) لا على الحالة المستمرة."
      evidence_assessment:
        case: no_material

    - lemma: "سُبَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود السبّة بمعنى العار في المعاجم، فإنها متعددة المعاني (الزمن من الدهر، الاست، مَن يُكثر سبّه) مما يُضعف تخصيصها. كما أنها تدل على سبب العار أو الشخص المعيَّر أكثر من دلالتها على حالة العار ذاتها."
      evidence_assessment:
        case: mixed


