      entry_id: "{auto}"
      root: "وزع"
      maqayis_quote: "«(وزع) الواو والزاء والعين: بناء موضوع على غير قياس. ووزعته عن الأمر: كففته... وبها أوزاع من الناس، أي جماعات.»"
    - lemma: "صَرْف"
      entry_id: "{auto}"
      root: "صرف"
      maqayis_quote: "«(صرف) الصاد والراء والفاء معظم بابه يدل على رجع الشيء. من ذلك صرفت القوم صرفا وانصرفوا، إذا رجعتهم فرجعوا.»"
  per_sense:
