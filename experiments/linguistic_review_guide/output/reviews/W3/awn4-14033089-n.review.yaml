# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14033089-n
# idle (n): the state of an engine or other mechanism that is idling
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«دوران هادئ» تعبير وصفي حرّ وليس مصطلحاً مسكوكاً؛ يمكن استبدال «هادئ» بمرادف مثل «ساكن» فيبقى وصفاً صالحاً"
      - "«خمول» دلالته الأصلية خفاء الذِّكر والقدر، وليس الدوران الميكانيكي بلا حمل"
      - "يغيب عن المجموعة المصطلح الفني القياسي «وضع اللاحمل» المُثبَت في معاجم هندسة السيارات"
    observations: >-
      المجموعة تصف حالة تشغيلية تقنية يدور فيها المحرك أو الآلية دون نقل طاقة
      إلى الحِمل. المصطلح الفني المعياري في العربية هو «اللاحمل» أو «وضع اللاحمل»
      كما ورد في معاجم هندسة السيارات والنفط. أما «خمول» فاستعماله مجازي عام
      بمعنى الركود وقلة النشاط، و«دوران هادئ» عبارة وصفية لا اصطلاحية.
  blind_candidates:
    - lemma: "خُمُول"
      generation_method: ishtiqaq
      justification: >-
        مصدر على فُعُول من خمل يدل على السكون والخفاء والركود، يُطلق مجازاً
        على حالة الآلة التي تعمل دون نشاط فعلي
    - lemma: "عَطَالَة"
      generation_method: ishtiqaq
      justification: >-
        مصدر على فَعَالَة من عطل يدل على الخلوّ والفراغ من العمل،
        يُستعمل في الفيزياء بمعنى القصور الذاتي وقد يمتد إلى حالة الآلة المعطَّلة عن الإنتاج
    - lemma: "وَضْع اللَّاحِمْل"
      generation_method: tarkib
      justification: >-
        مركب إضافي من «وضع» و«اللاحمل» (لا + حِمْل)، يصف حالة التشغيل
        التي لا ينتقل فيها حمل من المحرك إلى المنظومة
    - lemma: "تَسَيُّب"
      generation_method: ishtiqaq
      justification: >-
        مصدر تَفَعُّل من سيّب بمعنى ترك الشيء يذهب حيث شاء دون ضبط،
        قد يمتد مجازاً إلى دوران المحرك بلا توجيه للطاقة

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خمول"
      confirm:
        - text: "«الخمول: خفاء القدر والذكر، وأصله السكون والخفاء، ومنه، خمل البساط لأنه يستر ما خلفه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«(الخامل) الخفيّ الساقط الذي لا نباهة له»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأصلية خفاء الذِّكر والسقوط اجتماعياً، لا حالة ميكانيكية"
      expands:
        - text: "«الخاء والميم واللام أصل واحد يدل على انخفاض واسترسال وسقوط»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الانخفاض والسكون ممّا يسوّغ التوسع المجازي إلى ركود الآلة"
        - text: "«خمول، قصور ذاتي، عطالة» = inertia"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "استُعمل خمول في الكيمياء بمعنى القصور الذاتي لا بمعنى الدوران بلا حمل"

    - lemma: "دوران هادئ"
      evidence_status: "no_material_found"

    # ── مرشحات المرحلة ١ ──
    - lemma: "عَطَالَة"
      contradicts:
        - text: "«خاصية الأشياء بحيث تبقى ساكنة أو بحركة مستقيمة منتظمة ما لم تطبّق عليها قوة خارجية» = inertia"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          conflict: "عطالة مصطلح فيزيائي ثابت بمعنى القصور الذاتي (inertia)، لا حالة التشغيل بلا حمل (idling)"
      expands:
        - text: "«العين والطاء واللام أصل صحيح واحد يدل على خلوّ وفراغ. نقول: عُطِّلت الدار، ودار معطَّلة»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الخلوّ والفراغ، لكن المصطلح استقرّ في الفيزياء على معنى inertia"

    - lemma: "وَضْع اللَّاحِمْل"
      confirm:
        - text: "«هو أحد مراحل تشغيل المحرك التي ينتج فيها المحرك قدرة بالقدر اللازم للتغلب على الاحتكاك الداخلي ولتلبية متطلبات التشغيل الجانبي. ويتم اختيار سرعة دوران عالية للمحرك (سرعة دوران اللاحمل) في المحركات ذات الكبّاسات، بما يكفل حدوث دوران جيد للمحرك. تتراوح سرعة دوران وضع اللاحمل بين 600 لفة/دقيقة و1000 لفة/دقيقة» = idling"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
        - text: "«في منظّمات الضغط الخاصة بمنظومات الفرامل الهوائية، هو وضع الصمام أثناء تشغيل الضغّاط على اللاحمل» = neutral"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
      expands:
        - text: "«دوران دون تعشيق» = idle running; process idle"
          source: "المعجم الموحد لمصطلحات النفط (1999)"
          addition: "المصطلح النفطي يطابق التعريف العربي الحالي للمجموعة حرفياً"
        - text: "«سرعة دوران اللاحمل» = idling speed"
          source: "مسرد هندسة وتكنولوجيا السيارات (ArabTerm)"
          addition: "اللاحمل مكوّن إنتاجي في عشرات المركبات الفنية في مجال السيارات"

    - lemma: "تَسَيُّب"
      contradicts:
        - text: "«الإهمالُ وانعدامُ الضوابط، وضَعْفُ الالتزام بالقوانين.»"
          source: "المعجم الكبير"
          conflict: "الدلالة المعجمية المثبتة هي الإهمال الإداري لا الدوران الميكانيكي"
      expands:
        - text: "«(5) يتسَيَّب: يدور على نحو غير ناقل للطاقة The engine is idling. (7) يُسَيِّب: يجعله يدور على نحو غير ناقل للطاقة» = idle"
          source: "المورد الحديث (2008)"
          addition: "استعمال مقصور على المورد الحديث كترجمة للإنجليزية idle عند الحديث عن المحرك"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "خُمُول"
      decision: confirmed
      decision_reason: >-
        رغم أنّ الدلالة الأصلية للخمول هي خفاء الذِّكر والركود العام، فإنّ الجذر
        يدل على الانخفاض والسكون ممّا يسوّغ الامتداد المجازي إلى حالة الآلة الراكدة.
        يُبقى عليه بوصفه لفظاً عاماً مفهوماً يُكمّل المصطلح التقني «وضع اللاحمل».
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        لفظ عام يدل على الركود وقلة النشاط، يُستعمل في السياق غير التخصصي
        للإشارة إلى تشغيل الآلة دون إنتاج فعلي
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خُمُول"

    - lemma: "دَوَرَان هَادِئ"
      decision: removed
      decision_reason: >-
        تعبير وصفي حرّ لم يُعثر عليه في أيّ معجم. يجتاز اختبار الاستبدال
        (يمكن قول «دوران ساكن» أو «دوران بطيء» بالمعنى ذاته) فهو ليس وحدة
        معجمية ثابتة. المصطلح الفني القياسي هو «وضع اللاحمل» أو «دوران دون تعشيق».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "عَطَالَة"
      source: stage1
      decision: removed
      decision_reason: >-
        المصطلح مُثبت في الفيزياء والهندسة بمعنى القصور الذاتي (inertia)
        حصراً. استعماله بمعنى الدوران بلا حمل (idling) يُحدث اشتراكاً لفظياً
        مُربكاً مع مفهوم فيزيائي مختلف تماماً.
      evidence_assessment:
        case: contradicts_only

    - lemma: "وَضْع اللَّاحِمْل"
      source: stage1
      decision: confirmed
      decision_reason: >-
        مصطلح فني قياسي مُثبت في معاجم هندسة السيارات (ArabTerm) بتعريف
        يطابق دلالة المجموعة تماماً: «أحد مراحل تشغيل المحرك التي ينتج فيها
        المحرك قدرة بالقدر اللازم للتغلب على الاحتكاك الداخلي». يظهر في عشرات
        المركبات الفنية (سرعة اللاحمل، صمام اللاحمل، تجهيزة اللاحمل).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        مصطلح تقني هندسي دقيق يحدّد مرحلة تشغيل المحرك بلا حمل،
        أخصّ من «خمول» العام ويُستعمل في السياق الفني والتخصصي
      actions:
        - command: create_entry
          params:
            lemma: "وَضْع اللَّاحِمْل"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَسَيُّب"
      source: stage1
      decision: removed
      decision_reason: >-
        الدلالة المعجمية المُثبتة في المعجم الكبير ومعجم الصواب اللغوي هي
        الإهمال الإداري وانعدام الضوابط. استعماله بمعنى دوران المحرك بلا حمل
        مقصور على ترجمة المورد الحديث ولم يستقر في الاستعمال الفني العربي.
      evidence_assessment:
        case: mixed

stage4_content:
  definition:
    current: "حالة محرك أو آلية أخرى تدور دون تعشيق"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مقبول من حيث المضمون لكنه يفتقر إلى الدقة المصطلحية؛
        «دون تعشيق» تصف جانباً واحداً (عدم الربط بالتروس) بينما المفهوم أعمّ:
        الدوران بلا نقل طاقة إلى الحمل. كما أنّ صياغته أقرب إلى الترجمة منها
        إلى أسلوب المعجم العربي.
    authored:
      - type: terminological
        text: "حالةُ تشغيلٍ يدورُ فيها المحرِّكُ أو الآليَّةُ بأدنى سُرعةٍ دون نقلِ طاقةٍ مُفيدةٍ إلى الحِمْل."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حالةُ تشغيلٍ يدورُ فيها المحرِّكُ أو الآليَّةُ بأدنى سُرعةٍ دون نقلِ طاقةٍ مُفيدةٍ إلى الحِمْل."

  examples:
    per_lemma:
      - lemma: "خُمُول"
        examples:
          - text: "عند إيقاف السيارة أمام الإشارة الحمراء يدخل المحرك في حالة خمول حتى يضغط السائق على دوّاسة الوقود."
            type: usage
      - lemma: "وَضْع اللَّاحِمْل"
        examples:
          - text: "يجب ألّا تتجاوز سرعة دوران المحرك في وضع اللاحمل ثمانمئة لفّة في الدقيقة لتقليل استهلاك الوقود."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "عند إيقاف السيارة أمام الإشارة الحمراء يدخل المحرك في حالة خمول حتى يضغط السائق على دوّاسة الوقود."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يجب ألّا تتجاوز سرعة دوران المحرك في وضع اللاحمل ثمانمئة لفّة في الدقيقة لتقليل استهلاك الوقود."

