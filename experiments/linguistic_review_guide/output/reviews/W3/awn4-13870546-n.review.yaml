# مراجعة المجموعة الترادفية awn4-13870546-n — fifteenth
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «الخامس عشر» خالية من التشكيل، والأعداد المركبة (11-19) تتطلب ضبطاً دقيقاً لأنها مبنية على فتح الجزأين"
      - "التعريف العربي يستخدم الرقم 15 بدلاً من كتابته بالحروف"
      - "المجموعة تضم لمّة واحدة فقط، وهو أمر طبيعي للأعداد الترتيبية المحددة"
    observations: "هذه المجموعة تمثّل العدد الترتيبي الخامس عشر بوصفه اسماً دالاً على المرتبة. في العربية، الأعداد الترتيبية المركبة من 11 إلى 19 تُبنى على فتح الجزأين في الفصحى، وتُعامَل كصيغة واحدة مركبة (عدد مركب). لا يُتوقع وجود مرادفات حقيقية لأن الأعداد الترتيبية ألفاظ محددة لا تقبل الترادف."

  blind_candidates:
    - lemma: "الخَامِسَ عَشَرَ"
      generation_method: tarkib
      justification: "العدد الترتيبي المركب الفصيح للمرتبة الخامسة عشرة، مبني على فتح الجزأين وفق القاعدة النحوية"
    - lemma: "خَامِسَ عَشَرَ"
      generation_method: tarkib
      justification: "الصيغة النكرة من العدد الترتيبي المركب، تُستعمل في سياق الإضافة أو الحال"
    - lemma: "الخَامِسَةَ عَشْرَةَ"
      generation_method: tarkib
      justification: "صيغة التأنيث من العدد الترتيبي المركب، تُستعمل مع المعدود المؤنث"
    - lemma: "خُمَاسِيَّةٌ عَشْرِيَّةٌ"
      generation_method: ishtiqaq
      justification: "محاولة اشتقاق وصفية من خُماسي + عَشري، لكنها صيغة غير مسكوكة ولا تؤدي معنى الترتيب بل تدل على الوصف الكمي"


stage2_evidence:
  per_lemma:
    - lemma: "الخَامِسَ عَشَرَ"
      confirm:
        - text: "«الخَامِسُ عشرَ — الصواب والرتبة: جاء اليومُ الخامِسَ عَشَرَ [فصيحة] — جاء اليومُ الخامِسُ عَشَرَ [صحيحة]. التعليق: القاعدة السائدة أنَّ الأعداد المركَّبة، من 11 إلى 19، وكذلك الأوصاف منها تُبْنَى على فتح الجزأين»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«الخَامِسِ عَشَرَ — الصواب والرتبة: سيسافر في الخَامِسَ عَشَرَ من هذا الشهر [فصيحة] — سيسافر في الخَامِسِ عَشَرَ من هذا الشهر [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«(1) الخامس عَشَر the fifteenth day (2) بالغ جزءًا من 15 a fifteenth share of the money (3) الخامس عشر the fifteenth of April (4) جزء من 15»"
          source: "المورد الحديث (2008)"
          addition: "يبيّن أن «الخامس عشر» يُستخدم كعدد ترتيبي للأيام والتواريخ وكذلك بمعنى الجزء من خمسة عشر"

    - lemma: "خَامِسَ عَشَرَ"
      confirm:
        - text: "«الصواب والرتبة: جاء اليومُ الخامِسَ عَشَرَ [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"

    - lemma: "الخَامِسَةَ عَشْرَةَ"
      evidence_status: "no_material_found"

    - lemma: "خُمَاسِيَّةٌ عَشْرِيَّةٌ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "الخَامِسَ عَشَرَ"
      decision: confirmed
      decision_reason: "العدد الترتيبي المركب الفصيح للرتبة الخامسة عشرة. مؤكَّد بمعجم الصواب اللغوي والمورد الحديث. الشكل المبني على فتح الجزأين هو الفصيح المعتمد."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الخَامِسَ عَشَرَ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "خَامِسَ عَشَرَ"
      source: stage1
      decision: removed
      decision_reason: "صيغة نكرة من نفس العدد الترتيبي. لا حاجة لإدراجها كلمّة مستقلة لأن اللمّة المعرّفة بأل هي الشكل المعجمي المعتمد للاسم الدال على الرتبة."

    - lemma: "الخَامِسَةَ عَشْرَةَ"
      source: stage1
      decision: removed
      decision_reason: "صيغة التأنيث تُستعمل مع المعدود المؤنث فقط (مثل: الطبعة الخامسةَ عشرةَ). لا تصلح لمّة مستقلة في مجموعة ترادفية للمفهوم المجرد للرتبة."

    - lemma: "خُمَاسِيَّةٌ عَشْرِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "صيغة مولّدة غير مسكوكة، لا يدعمها دليل معجمي. وزن فُعاليّة يدل على الكمية لا الترتيب، ولا تؤدي معنى الرتبة الخامسة عشرة."


