# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14488377-n
# المفهوم: a fault (خطأ أو عيب)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «خطأ أو عيب» مقتضب جداً ولا يميّز المجموعة عن فوقيتها «نقص في جسم أو آلة»"
      - "اللمّة الإنجليزية hole بمعنى fault استعمال مجازي (ثغرة في الحجة/النظام)، والتعريف لا يوضّح هذا البُعد المجازي"
      - "اللمّة الوحيدة «ثغرة» بدون تشكيل"
    observations: "المجموعة تمثّل المعنى المجازي للكلمة الإنجليزية hole أي النقطة الضعيفة أو الخلل في شيء ما، وفوقيتها المباشرة هي «خلل/عيب» بمعنى نقص في جسم أو آلة. التعريف الحالي عامّ ولا يفرّق بين هذه المجموعة وفوقيتها تفريقاً كافياً."
  blind_candidates:
    - lemma: "وَصْمَة"
      generation_method: ishtiqaq
      justification: "من الجذر «وصم» الدالّ على الكسر والضعف والعيب، على وزن فَعْلَة للمرّة، وتُستعمل بمعنى العيب والنقيصة"
    - lemma: "شَائِبَة"
      generation_method: ishtiqaq
      justification: "من الجذر «شوب» بمعنى الخلط، اسم فاعل مؤنث يدلّ على ما يشوب الشيء من عيب أو دنس"
    - lemma: "عَطَب"
      generation_method: ishtiqaq
      justification: "من الجذر «عطب» بمعنى الهلاك والفساد، مصدر يُستعمل في الاستعمال الحديث للدلالة على الخلل والتلف في الأجهزة"
    - lemma: "نَقِيصَة"
      generation_method: ishtiqaq
      justification: "من الجذر «نقص» على وزن فَعِيلَة، وتعني العيب والخصلة الدنيئة، وصرّح ابن فارس بأنّ النقيصة هي العيب"

stage2_evidence:
  per_lemma:
    - lemma: "ثُغْرَة"
      confirm:
        - text: "«الثلمة والفرجة في الجبل ونحوه ونقرة النحر»"
          source: "المعجم الوسيط"
        - text: "«الثُّلْمة كُلُّ فُرْجَةٍ تَكُونُ في جَبَلٍ أو بَطْنِ وادٍ أو طَرِيقٍ مَسْلُوك»"
          source: "المعجم الكبير"
      expands:
        - text: "«الثَّاءُ وَالْغَيْنُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى تَفَتُّحٍ وَانْفِرَاجٍ. فَالثَّغْرُ الْفَرْجُ مِنْ فُرُوجِ الْبُلْدَانِ، وَثُغْرَةُ النَّحْرِ الْهَزْمَةُ الَّتِي فِي اللَّبَّةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على التفتّح والانفراج، ما يؤصّل للمعنى المجازي: موضع الضعف والخلل"
        - text: "«ثَغْرَة — هاجم ثَغْرَةً في خطوط العدو — الرأي: مرفوضة — السبب: لأن الكلمة لم ترد بفتح الثاء في المعاجم. الصواب: ثُغْرَة بضم الثاء»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "التشكيل الصحيح بضمّ الثاء لا بفتحها"

    - lemma: "وَصْمَة"
      confirm:
        - text: "«الفَتْرَةُ في الجسد العيب العار اليمينُ في معصية»"
          source: "المعجم الوسيط"
        - text: "«الْوَاوُ وَالصَّادُ وَالْمِيمُ: أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى كَسْرٍ وَضَعْفٍ... وَالْوَصْمُ: الصَّدْعُ غَيْرُ بَائِنٍ... وَيُقَالُ لِلْعَارِ وَالْعَيْبِ: وَصْمٌ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«(1) يُشَوِّه؛ يُلَطِّخ (2) عيْب؛ شائبة»"
          source: "المورد الحديث (2008)"
          addition: "blemish يُترجم بـ«عيب؛ شائبة» ما يؤكّد القرب الدلالي"

    - lemma: "شَائِبَة"
      confirm:
        - text: "«الشَّيْء الْغَرِيب يخْتَلط بِغَيْرِهِ وَيُقَال مَا فِيهِ شَائِبَة لَيْسَ فِيهِ شُبْهَة والدنس والقذر وَنَحْوهمَا (ج) شوائب وَيُقَال فلَان بَرِيء من الشوائب لَيْسَ فِيهِ مَا يعِيبهُ»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الشِّينُ وَالْوَاوُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْخَلْطُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الدلالي هو الخلط والمزج لا العيب ذاته؛ الشائبة ما يختلط بالشيء فيفسده، لا العيب المستقلّ"

    - lemma: "عَطَب"
      contradicts:
        - text: "«الْعَيْنُ وَالطَّاءُ وَالْبَاءُ كَلِمَتَانِ لَا تَتَقَارَبَانِ فِي الْمَعْنَى. فَالْأُولَى: الْعَطَبُ، وَهُوَ الْهَلَاكُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "العَطَب في أصله هلاك وفساد تامّ، وليس مجرّد خطأ أو عيب"
        - text: "«عَطَباً: هَلَك فسد البعيرُ والفرسُ: انكسَرَ»"
          source: "المعجم الوسيط"
          conflict: "الدلالة على الهلاك والانكسار أشدّ من مجرّد العيب"
      expands:
        - text: "«لفظ عام يطلق على حالة حاسوب أو نظام أو جهاز لا يشتغل — عَطَل (المرادف العربي)»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "في الاستعمال التقني الحديث يُستعمل بمعنى العطل والخلل في الأجهزة"

    - lemma: "نَقِيصَة"
      confirm:
        - text: "«النَّقْص الوقيعَةُ أو الطَّعْن في الناس الخَصْلَة الدَّنِيئَة»"
          source: "المعجم الوسيط"
        - text: "«وَالنَّقِيصَةُ: الْعَيْبُ; يُقَالُ مَا بِهِ نَقِيصَةٌ، أَيْ شَيْءٌ يَنْقُصُ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«النقيصة: الوقيعة أو الطعن في الناس والخصلة الدنيئة»"
          source: "المعجم الوسيط"
          conflict: "الاستعمال المعجمي يخصّص النقيصة بالعيوب الأخلاقية والطباع البشرية لا بالعيوب المادية العامة"

stage3_analysis:
  per_lemma:
    - lemma: "ثُغْرَة"
      decision: confirmed
      decision_reason: "اللمّة ثُغْرَة بمعناها الأساسي (الثُّلمة والفُرجة) تمثّل امتداداً مجازياً طبيعياً لمفهوم العيب والخلل، وتوافق المعنى الإنجليزي hole بمعنى fault تماماً. الجذر «ثغر» يدلّ على التفتّح والانفراج وهو أساس دلالة الخلل. التشكيل المصحَّح بضمّ الثاء وفقاً لمعجم الصواب اللغوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ثُغْرَة"

    - lemma: "وَصْمَة"
      source: stage1
      decision: removed
      decision_reason: "رغم أنّ الوَصْمَة تعني العيب والعار صراحةً في المعاجم، إلا أنّ دلالتها تتّجه نحو العيب المعنوي (العار والنقيصة الأخلاقية) والصدع غير البائن، وهي أقرب إلى مفهوم الوصمة الاجتماعية (stigma) منها إلى مفهوم الخلل أو الثغرة في شيء مادّي أو نظام. المجموعة الترادفية تمثّل hole بمعنى نقطة الضعف والخلل، لا العار."

    - lemma: "شَائِبَة"
      source: stage1
      decision: removed
      decision_reason: "الشائبة في أصلها ما يختلط بالشيء من غير جنسه فيفسده (من الخَلْط)، وهي أقرب إلى مفهوم الشوائب والدَّنَس منها إلى مفهوم العيب الذاتي في الشيء. المفهوم المقصود في المجموعة هو خلل كامن في الشيء ذاته وليس عنصراً غريباً مُقحَماً."

    - lemma: "عَطَب"
      source: stage1
      decision: removed
      decision_reason: "العَطَب في أصله الهلاك والفساد التامّ، وهو أشدّ من مجرّد العيب أو الخطأ. وإن كان يُستعمل حديثاً بمعنى العُطل في الأجهزة، فإنّ هذا الاستعمال يقابل failure/damage لا fault بالمعنى المقصود هنا."

    - lemma: "نَقِيصَة"
      source: stage1
      decision: removed
      decision_reason: "النقيصة مخصَّصة في الاستعمال المعجمي بالعيوب الأخلاقية والطباع البشرية (الوقيعة والطعن والخصلة الدنيئة)، وهي أقرب إلى shortcoming/vice منها إلى fault بمعنى الخلل في شيء مادّي أو نظام."

