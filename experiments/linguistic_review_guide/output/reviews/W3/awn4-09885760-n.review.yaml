# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id: awn4-09885760-n  |  ili: i88641  |  pos: n
# bookmaker (book production sense)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «صانع كتب» تفتقر إلى التشكيل الكامل المطلوب لكل لمّة مؤكدة"
      - "التعريف الحالي مُؤلَّف من شبه جملتين يفصل بينهما فاصلة منقوطة، وهذا أسلوب غير اعتيادي في المعاجم العربية"
      - "التعريف يبدو ترجمةً حرفية للتعريف الإنجليزي ولا يأخذ بأسلوب المعجم الوسيط"
      - "الكلمة الإنجليزية bookmaker لها ثلاثة معانٍ في المعاجم الثنائية (صانع الكتاب / المصنّف / وكيل المراهنات)، وقد يحدث خلط مع المعنيين الآخرين"
      - "خلوّ المجموعة من مصطلح تراثي يُحيي موروث الوراقة في الحضارة الإسلامية"
    observations: >
      هذه المجموعة تُمثّل مفهوم الشخص الذي تتمحور حِرفته حول إنتاج الكتب (تحريراً أو نشراً أو تجليداً)،
      وهو مفهوم ذو جذر عميق في الحضارة العربية الإسلامية تمثّله حِرفة «الوِرَاقة» التي ازدهرت في العصر العباسي.
      اللمّة الحالية «صانع كتب» صحيحة إضافياً لكنها مبتسرة: لا تشكيل، والمفهوم التراثي غائب.
      يُستحسن إضافة «الوَرَّاق» لإثراء المجموعة بالموروث الكلاسيكي.

  blind_candidates:
    - lemma: "وَرَّاق"
      generation_method: majaz
      justification: >
        إحياء للفظ كلاسيكي على صيغة فَعَّال من جذر (و ر ق). كان «الوَرَّاق» في الحضارة الإسلامية
        هو الشخص الذي يُعِدُّ الكتب وينسخها ويكتبها ويتداول بها، ويجمع وظائف المحرر والناشر
        والمجلِّد في آنٍ واحد. صيغة فَعَّال تدل على الاحتراف والمبالغة.
    - lemma: "كُتُبِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى «كُتُب» (جمع كتاب) على النمط الاشتقاقي، تدل على المنتسب إلى عالم الكتب صنعاً
        وتداولاً. أجازها مجمع اللغة العربية المصري وأوردتها بعض المعاجم الحديثة.
    - lemma: "مُجَلِّد"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من «جلَّدَ» على وزن مُفَعِّل، يدل على من يتولى تجليد الكتب وتغليفها.
        اشتقاق شفاف من الجذر (ج ل د) الدال على القوة والغلاف.
    - lemma: "طَبَّاع"
      generation_method: ishtiqaq
      justification: >
        صيغة فَعَّال من الجذر (ط ب ع) الدالة على الاحتراف؛ من حِرفته الطباعة.
        يُغطي وجه النشر والطباعة في تعريف المجموعة.


stage2_evidence:
  per_lemma:
    - lemma: "صانع كتب"
      confirm:
        - text: >
            «(1) صانع الكِتاب: طابع الكُتُب أو مجلِّدها إلخ
            (2) المصنِّف: من يجمع موادّ كتبه من مؤلَّفات الآخرين
            (3) وكيل المراهنات [على جياد السِّباق].»
          source: "المورد الحديث (2008) — ترجمة bookmaker"
      expands:
        - text: >
            «(1) صانع الكتاب: طابع الكتب أو مجلِّدها إلخ
            (2) المصنِّف: من يجمع موادّ كتبه من مؤلَّفات الآخرين»
          source: "المورد الحديث (2008)"
          addition: >
            يكشف أن «bookmaker» في المعجم الثنائي له ثلاثة معانٍ، أولها هو صانع الكتاب
            (المُنتِج والمجلِّد)، وثانيها المُصنِّف، وثالثها وكيل المراهنات — مما يؤكد
            ضرورة الإبقاء على التمييز الواضح لهذا السياق الكتابي.

    - lemma: "وَرَّاق"
      confirm:
        - text: "«مورِّق الكتب الذى يورِّق ويكتب — الكثيرُ الدراهم — رجلٌ وَرَّاق: صاحب ورق»"
          source: "المعجم الوسيط (مجمع اللغة العربية — القاهرة)"
        - text: "«مُورق الكتب الذي يورق ويكتب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35)"
        - text: "«مهيئ ورق الكتاب والكاتب فيه، والكثير الدراهم، محترف الوَرَّاقة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«حِرفة الوراق الذي يورق الكتب ويكتب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين — الوراقة"
      expands:
        - text: "«الوراقة: حِرفة الوراق الذي يورق الكتب ويكتب»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35)"
          addition: >
            يُثبت وجود المصدر الصناعي «الوِرَاقة» كمصطلح للحِرفة، مما يعني أن «الوَرَّاق»
            صاحب حِرفة راسخة ومصطلحها في اللغة العربية الكلاسيكية.

    - lemma: "كُتُبِيّ"
      confirm:
        - text: "«bookseller»"
          source: "مسرد الإعلام والتواصل — المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: >
            «منزله في شارع الكُتُبييّن — مرفوضة للنسب إلى الجمع مباشرة دون ردِّه إلى المفرد؛
            الصواب: كُتُبيين [فصيحة]... وقد وردت هذه الكلمة في بعض المعاجم الحديثة كالأساسي والمنجد»
          source: "معجم الصواب اللغوي لأحمد مختار عمر (hawramani_33)"
      contradicts:
        - text: "«bookseller» — مسرد الإعلام والتواصل"
          source: "مسرد الإعلام والتواصل — ArabTerm"
          conflict: >
            كُتُبِيّ في المعاجم يعني «بائع الكتب» (bookseller) لا «صانع الكتب» (bookmaker)؛
            بائع الكتب ليس بالضرورة صانعها، والمجموعة تُعنى بالإنتاج لا التوزيع.

    - lemma: "مُجَلِّد"
      confirm:
        - text: "«مَنْ يُجَلِّدُ الكُتُبَ»"
          source: "المعجم الكبير (مجمع اللغة العربية — القاهرة)"
        - text: "«من يغطي الشيء بالجلد، ومن ينزع الجلد من الذبيحة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«مجلِّد كتب» — bookbinder"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1: طباعة-كهرباء (ArabTerm)"
      contradicts:
        - text: "«مُجَلَّد: الكتاب ذو الجلدة / مصطلح يستعمل في أنظمة ويندوز مقابل المصنَّفة»"
          source: "المعجم الكبير / مصطلحات تقانة المعلومات (ArabTerm)"
          conflict: >
            المُجَلَّد (بالفتح) = كتاب مُغلَّف أو مجلَّد الحاسوب (folder)، بينما المُجَلِّد (بالكسر)
            = من يُجلِّد الكتب. الاشتراك الصرفي بين المبني للمفعول والمبني للفاعل مصدر التباس.

    - lemma: "طَبَّاع"
      confirm:
        - text: "«فَعَّالٌ للمبالغة من طَبَعَ، من حرفتُه الطباعة»"
          source: "المعجم الوسيط (مجمع اللغة العربية — القاهرة)"
        - text: "«صانِعُ السُّيوفِ ونَحْوها، مَنْ حِرْفَتُهُ الطِّباعَةُ بالآلات»"
          source: "المعجم الكبير (مجمع اللغة العربية — القاهرة)"
        - text: "«printer» / «typographer»"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.1: طباعة-كهرباء (ArabTerm)"
      contradicts:
        - text: "«printer» / «typographer» — الطبّاع = المشغِّل للمطبعة"
          source: "ArabTerm — Printing domain"
          conflict: >
            طَبَّاع في المعاجم المعاصرة = الطابع / المشغِّل للمطبعة، وهو دور جزئي واحد من
            أدوار صانع الكتب (النشر والطباعة فقط)، أما التحرير والتجليد فخارج نطاقه.
            كذلك يحمل في التراث معنى «صانع السيوف» مما يزيد الاشتراك اللفظي.


stage3_analysis:
  per_lemma:
    - lemma: "صانع كتب"
      decision: confirmed
      decision_reason: >
        المركب الإضافي «صانع كتب» صحيح دلالياً ويُغطي المفهوم بشكل شامل (التحرير والنشر والتجليد).
        أيّده المعجم الثنائي المورد الحديث الذي يُترجم bookmaker بـ«صانع الكتاب». يُوثَّق بتشكيل كامل
        ويُبقى في المجموعة بعد تحديث تشكيله.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        مصطلح معاصر شفاف الدلالة يُعبّر بشكل إضافي عن المفهوم الكامل (صانع + كتب)،
        مناسب للسياق الرسمي والموسوعي. يخلو من الدلالة التراثية ويُركّز على البُعد الوظيفي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَانِعُ كُتُبٍ"

    - lemma: "وَرَّاق"
      source: stage1
      decision: confirmed
      decision_reason: >
        لفظ كلاسيكي أثبتته ثلاثة مصادر متعددة (المعجم الوسيط، المعجم الوسيط للمجموعة، موسوعة السلطان قابوس)
        بمعنى: من يُورِّق الكتب ويكتبها ويُعدّها. يجمع بين وجوه التوليد الثلاثة (النسخ والكتابة والإعداد)
        وتتفق دلالته مع المجموعة. وجود المصدر «الوِرَاقة» يُثبت رسوخه المعجمي.
        اجتاز اختبار السكّ (لا يمكن إبدال مكوّناته) واختبار التثبيت المعجمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يحمل دلالة تراثية حضارية راسخة؛ يستحضر صناعة الوراقة في الحضارة الإسلامية حيث كان
        الوراق يجمع النسخ والكتابة والتداول بالكتب. يُفضَّل في السياقات العلمية والتاريخية والأدبية.
      actions:
        - command: create_entry
          params:
            lemma: "وَرَّاق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09885760-n"

    - lemma: "كُتُبِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        تعني «بائع الكتب» (bookseller) لا «صانع الكتب» (bookmaker)؛ بائع الكتب ليس بالضرورة
        مُنتِجها. وكلا المعجمين العربي (الصواب اللغوي) والمصطلحي (ArabTerm) يحصرانها في
        بيع الكتب. فضلاً عن ذلك، اختلف العلماء في مشروعية النسبة إلى الجمع.

    - lemma: "مُجَلِّد"
      source: stage1
      decision: removed
      decision_reason: >
        اللفظ صحيح ومُوثَّق (المعجم الكبير: «مَنْ يُجَلِّدُ الكُتُبَ»)، لكنه أخصّ من المجموعة؛
        يُغطي وجه التجليد فقط، بينما المجموعة تصف من يُجمع فيه تحرير الكتب أو نشرها أو تجليدها.
        المُجَلِّد بمفرده يُعدّ هيبونيماً (أخص) لا مرادفاً. الاشتراك الصرفي مع مُجَلَّد (volume/folder)
        يُضاف إلى الأسباب.

    - lemma: "طَبَّاع"
      source: stage1
      decision: removed
      decision_reason: >
        يُعني في المعجمَيْن الوسيط والكبير «من حِرفته الطباعة»، وفي المعاجم التقنية «printer».
        هو أيضاً أخصّ من المجموعة (يُغطي وجه الطباعة/النشر فقط). يحمل في التراث القديم معنى
        «صانع السيوف»، مما يُثقل دلالته بمعانٍ متباينة.


