    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية مباشرة عن الإنجليزي مفتقرة إلى الأسلوب الموسوعي
        العربي؛ كلمة 'يعتبر' ضعيفة أسلوبياً، و'أكثر طبيعية' تفتقر إلى التشكيل،
        والتعريف لا يذكر إسهاماته الفنية الجوهرية (اللوحات الجدارية، تطوير المنظور).
        يُصاغ من جديد بأسلوب الموسوعة العربية.
    authored:
      - type: encyclopedic
        text: >
          جِيُوتُّو دِي بُوندُونِي (نحو 1267 - 1337م): رسّامٌ إيطاليٌّ من فلورنسا،
          يُعدُّ من كبار رُوّاد الفن التشكيلي الأوروبي؛ أوّل من خرج على الأسلوب
          البيزنطي الجامد الذهبي وأرسى أسلوباً تصويريّاً أكثر طبيعيةً وإنسانيةً قوامُه
          التعبير العاطفي والمنظور المجسَّم، واشتُهر بسلسلة لوحاته الجدارية في كنيسة
          الأرينا ببادوفا. يُلقَّب بأبي الفن الإيطالي وأعظم رسّامٍ قبل عصر النهضة.
