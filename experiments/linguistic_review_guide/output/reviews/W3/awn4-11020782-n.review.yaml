# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "الأسماء الواردة في المجموعة بلا تشكيل، وهو إلزامي لكل لمّة مؤكدة."
      - "المجموعة الفائقة (direct_hypernym: awn4-09824898-n) تُعرَّف بأنها 'شخص يبتكر خططاً لاستخدامها في صنع شيء ما (مثل المباني)' وتحمل لمّات 'مصمم / معماري / مهندس معماري' — أي أنها مجموعة المعماري/المصمم لا الرسام؛ وهذا خطأ تصنيفي واضح إذ المناسب أن يكون الهايبرنيم مجموعة الرسام/الفنان."
      - "التعريف العربي الحالي ترجمة حرفية عن الإنجليزي؛ يحتاج إعادة صياغة بأسلوب المعجم الموسوعي العربي."
    observations: >
      هذه المجموعة تمثّل عَلَماً على شخص بعينه هو الرسام الإيطالي 'جيوتو دي بوندوني'
      (1267-1337م) أحد رواد الفن الأوروبي قبل عصر النهضة. وبما أنه اسم علم أعجمي
      فإن الأسلوب الوحيد الممكن في توليد اللمّات هو التعريب (تحويل النطق الإيطالي إلى
      حروف عربية). اللمّتان الموجودتان (جيوتو، جيوتو دي بوندوني) صحيحتان في جوهرهما
      لكنهما مفتقرتان إلى التشكيل الكامل. الخطأ الأبرز هو المجموعة الفائقة الخاطئة
      (معماري بدلاً من رسام).

  blind_candidates:
    - lemma: "جِيُوتُّو"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم الإيطالي Giotto بإثبات الشدّة على التاء تأدية للتضعيف الإيطالي
        (tt)؛ وهو الشكل المختصر الأكثر تداولاً في المصادر العربية الحديثة.
    - lemma: "جِيُوتُّو دِي بُوندُونِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل Giotto di Bondone بإيثار الضمّة على الباء في 'بوندو' تبعاً
        للنطق الإيطالي /bonˈdoːne/؛ يُستعمل هذا الشكل الموسوعي في الكتابات الأكاديمية
        والمراجع المتخصصة.
    - lemma: "جِيُوتُّو بُوندُونِي"
      generation_method: taarib
      justification: >
        تعريب مختصر يحذف حرف الجر 'دي' (di) الإيطالي ويبقي على اسم العائلة؛ يظهر أحياناً
        في المصادر العربية الشعبية لكنه أقل دقةً من الاسم الكامل.
    - lemma: "جِيُوتُو الفلورنسي"
      generation_method: tarkib
      justification: >
        مركّب وصفي يضمّ الاسم المعرَّب مع نسبة إلى فلورنسا؛ يُوضّح هويته الجغرافية
        ويُفيد في تمييزه عن مشهورين بنفس الاسم، لكنه لا يُعدّ الشكل الأوسع انتشاراً
        في المراجع الموسوعية العربية.


