    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُجرَّد بيان تعريفي بأدنى حدٍّ من المعلومات (الجنسية + البلد + التواريخ)
        دون أي إشارة إلى الإسهامات المعمارية أو المكانة الأكاديمية للشخص. المطلوب تعريف
        موسوعي يُوفّر سياقاً مهنياً وافياً يُميّز هذا المعماري عن غيره.
    authored:
      - type: encyclopedic
        text: >
          مُعمار فرنسي من مواليد لاشو-دو-فون بسويسرا (1887-1965)، يُعدّ أحد أبرز روّاد
          العمارة الحديثة والوظيفية في القرن العشرين؛ ابتكر مبادئ «الخمسة نقاط للعمارة
          الجديدة»، ونادى بالتوحيد القياسي في البناء السكني من خلال «الوحدة السكنية»، وأشرف
          على تصميم مدينة شنديغار الهندية. أثّرت أعماله تأثيراً بالغاً في مسار العمارة
          والتخطيط العمراني العالميَّيْن.
