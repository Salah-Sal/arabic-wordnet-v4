# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# المجموعة: awn4-11143114-n  |  ILI: i95921
# الموضوع: لو كوربوزييه — معماري فرنسي (ولد في سويسرا) (1887-1965)
# تاريخ المراجعة: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "تصنيف المجموعة pos: n غير دقيق؛ الأنسب proper_noun إذ اللمّتان اسما علم خاصّان لشخصية تاريخية"
      - "التعريف الحالي مختزل اختزالاً مُفرطاً ولا يُشير إلى أبرز إسهامات الشخصية في الحقل المعماري"
      - "اللمّتان خاليتان من التشكيل الكامل"
      - "تهجية «جانيريه» تحتمل مراجعة مقارنةً بالنطق الفرنسي الأصلي Jeanneret (جينيريه أقرب صوتياً)"
    observations: >
      تُمثّل هذه المجموعة مُفرداً علَميّاً خاصّاً للمعماري الشهير لو كوربوزييه، واسمه الأصلي
      شارل إيدوار جانيريه-غريس (Charles-Édouard Jeanneret-Gris). وُلد عام 1887 في لاشو-دو-فون
      بسويسرا وحمل الجنسية الفرنسية منذ عام 1930، وتُوفّي عام 1965. يُعدّ من أبرز مؤسّسي
      العمارة الوظيفية الحديثة في القرن العشرين، وصاحب مفهوم «الوحدة السكنية» ومبادئ
      «الخمسة نقاط للعمارة الجديدة». تضمّ المجموعة اسمَيْه: الأصلي (جانيريه) والمستعار
      المهني (لو كوربوزييه). جميع خيارات التوليد المُتاحة تقتصر على التعريب (taarib) كونها
      أسماء أعجمية خاصة لا جذر عربي لها. التحدّي الوحيد المُمكن هو اختيار أمثل صيغة تعريبية
      بين الأشكال المتداولة في الكتابة العربية المعاصرة.

  blind_candidates:
    - lemma: "شارْلُ إِدْوارْ جينيريه"
      generation_method: taarib
      justification: >
        تعريب مقترح للاسم الأصلي Charles-Édouard Jeanneret بصيغة تقترب من النطق الفرنسي
        الأصلي؛ إذ تُنطق Jean بالفرنسية «جين» لا «جان»، فتعريبها «جينيريه» أدق صوتياً من
        «جانيريه»، وإن كانت الأخيرة أشيع في الكتابة العربية.
    - lemma: "لُو كُورْبُوزييه"
      generation_method: taarib
      justification: >
        تعريب الاسم المستعار الفرنسي Le Corbusier الذي اتخذه المعماري منذ عام 1920 تيمّناً
        بلقب أحد أجداده (Lecorbésier)؛ وهو الاسم الأشهر عالمياً وعربياً في الأدبيات
        المعمارية والكتب المتخصصة.
    - lemma: "كُورْبُوزييه"
      generation_method: taarib
      justification: >
        الصيغة المختزلة للاسم المستعار بحذف أداة التعريف الفرنسية Le؛ تُستعمل أحياناً
        في السياقات الاختصارية أو في نهاية الجمل المضافة، غير أنها أقل شيوعاً من الصيغة
        الكاملة.
    - lemma: "شارْلُ إِدْوارْ جانيريه-غريس"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل عند الميلاد Charles-Édouard Jeanneret-Gris بما يشمل اسم الأسرة
        المركّب (جانيريه-غريس)؛ صيغة توثيقية رسمية تُستخدم في المراجع البيوغرافية الأكاديمية
        والموسوعات.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
