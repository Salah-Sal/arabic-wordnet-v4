# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الأولى الموجودة ──
    - lemma: "شارل إدوار جانيريه"
      decision: confirmed
      decision_reason: >
        الاسم الأصلي (اسم الميلاد) للمعماري، وهو الصيغة الموثَّقة في المصادر العربية
        المعتمدة والموسوعات (الموسوعة العربية، موسوعة المعرفة). غياب الأدلة المعجمية مُتوقَّع
        لأسماء الأعلام الأجنبية. صيغة «جانيريه» مستقرّة في الكتابة العربية الأكاديمية
        وإن كانت «جينيريه» أقرب للنطق الفرنسي. يستوجب إضافة تشكيل وتحديث POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يمثّل هذا الاسم الهوية المدنية والرسمية للشخص (اسم الميلاد)؛ يُفضَّل في السياقات
        البيوغرافية والتوثيقية والقانونية، وفي الإشارة إلى مرحلة حياته السويسرية المبكرة
        (1887-1920) قبل اعتماد الاسم المستعار.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شارْلُ إِدْوارْ جانيريه"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── اللمّة الثانية الموجودة ──
    - lemma: "لو كوربوزييه"
      decision: confirmed
      decision_reason: >
        الاسم المستعار المهني الذي اكتسب شهرة عالمية واسعة، وهو الأكثر تداولاً في الأدبيات
        المعمارية والكتب الأكاديمية العربية والمعاجم المتخصصة. تعريبه ثابت في المصادر العربية
        المعاصرة. غياب الأدلة المعجمية متوقَّع. يستوجب إضافة تشكيل وتحديث POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يمثّل الاسم المستعار/الفني الذي اتخذه الشخص عام 1920 بعد انتقاله إلى باريس؛ يُفضَّل
        في السياقات المعمارية والأكاديمية والإعلامية، وهو الاسم المعروف عالمياً والأشيع في
        المراجع والمؤلفات بما فيها العربية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لُو كُورْبُوزييه"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشّح المرحلة ١: كوربوزييه ──
    - lemma: "كُورْبُوزييه"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مُبتورة تحذف أداة التعريف الفرنسية Le التي هي جزء لا يتجزّأ من الاسم المستعار
        الأصلي Le Corbusier؛ لا تُشكّل مدخلاً مستقلاً بل مجرد اختزال سياقي. الصيغة الكاملة
        «لو كوربوزييه» مُقبَّلة بالفعل، فلا داعي لإدراج المُختزَل مدخلاً منفصلاً.

    # ── مرشّح المرحلة ١: شارل إدوار جانيريه-غريس ──
    - lemma: "شارْلُ إِدْوارْ جانيريه-غريس"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الكامل مع اسم الأسرة المركّب (Jeanneret-Gris) نادر الاستخدام في المصادر العربية؛
        المعهود هو «شارل إدوار جانيريه» دون التمديد. إضافة هذا الشكل تزيد تعقيداً غير مبرَّر.
        الصيغة المختصرة الموجودة كافية ومعيارية.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-11143114-n"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
