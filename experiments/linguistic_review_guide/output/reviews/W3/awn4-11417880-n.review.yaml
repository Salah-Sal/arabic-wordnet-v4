            (3) يساوي كذا (4) ذو دخل أو ممتلكات تساوي كذا (5) يستحق؛ يستأهل؛ جدير بِـ
            (7) قيمة مالية (8) ما يساوي كذا (9) قيمة / قيمة أخلاقية (10) استحقاق؛ كفاءة
            (11) ثروة.»
          source: "المورد الحديث (2008)"
          addition: "التشكيل (وُو) يُفرّق صوتياً بين اللقب الأعجمي ومادة المعجم الإنجليزي، لكن الاشتراك الخطي قائم."

    - lemma: "تشارلزُ فريدريكَ وُورث"
