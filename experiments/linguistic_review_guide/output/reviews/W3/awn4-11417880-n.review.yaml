    - lemma: "شارلَ فريدريكَ وُورث"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "تشارلزُ وُورث"
      source: stage1
      evidence_status: "no_material_found"

  # أدلة سياقية لمصطلحات المجال (مفيدة للمرحلة ٤)
