            «worth: (1) ذو قيمة مالية أو مادية (ا.ق) (2) جدير بالاحترام أو الإجلال (ا.ق)
            (3) يساوي كذا (4) ذو دخل أو ممتلكات تساوي كذا (5) يستحق؛ يستأهل؛ جدير بِـ
            (7) قيمة مالية (8) ما يساوي كذا (9) قيمة / قيمة أخلاقية (10) استحقاق؛ كفاءة
            (11) ثروة.»
          source: "المورد الحديث (2008)"
          addition: "«وورث» كلمة إنجليزية شائعة ذات معانٍ متعددة (قيمة، جدارة، ثروة)؛ الاشتراك اللفظي مصدر التباس محتمل عند قراءة اللمّة بمعزل عن السياق."

