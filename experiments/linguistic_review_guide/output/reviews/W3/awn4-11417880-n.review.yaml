# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:

  # أ. توليد اللمّات المرشحة (قُرئ الملف المُقنّع أولاً)
  # -------------------------------------------------------
  # الملف المُقنّع يكشف: علَمٌ شخصي — مصمِّم أزياء فرنسي (إنجليزي المولد)،
  # مؤسّس الأزياء الباريسية الراقية، (1825-1895).
  # المفهوم علَم خاص بشخص بعينه → جميع المرشحات تعريباتٌ للاسم.
  blind_candidates:
    - lemma: "وُورث"
      generation_method: taarib
      justification: "تعريب مباشر للقب «Worth» بإضافة واو المد وفق الصوتيات العربية؛ المقطع الأول طويل /wɜːr/ يُرسم بـ(وُو)."

    - lemma: "تشارلزُ فريدريكَ وُورث"
      generation_method: taarib
      justification: "تعريب الاسم الكامل بصيغته الإنجليزية: Charles → تشارلز، Frederick → فريدريك، Worth → وُورث؛ الصيغة الأكثر رسمية للعلَم."

    - lemma: "شارلَ فريدريكَ وُورث"
      generation_method: taarib
      justification: "تعريب الاسم بصيغته الفرنسية (Charles الفرنسية → شارل) إذ كان وورث يعمل في باريس وعُرف باسمه الفرنسي؛ «شارل» شائعة في التراجم العربية لحامليه."

    - lemma: "تشارلزُ وُورث"
      generation_method: taarib
      justification: "صيغة مختصرة (الاسم الأول واللقب) تُستخدم في السياقات الأقل رسمية وفي خطاب تاريخ الأزياء."

  # ب. التقييم الأولي (بعد قراءة synset_info الكامل)
  # -------------------------------------------------------
  assessment:
    concerns:
      - "اللمّتان الحاليتان «تشارلز فريدريك وورث» و«وورث» خاليتان من التشكيل الكامل الإلزامي."
      - "التعريف الحالي يستخدم «هوت كوتور» كتعريب دخيل، في حين أن المقابل المُعتمد في معجميات ALECSO هو «الخياطة الرفيعة»."
      - "اللمّة «وورث» بمعزل عن السياق تلتبس بالكلمة الإنجليزية «worth» (قيمة/جدارة) الواردة في قواميس ثنائية اللغة بالقاعدة."
      - "التعريف يُهمل تفصيلة وردت في المصدر الإنجليزي: «اشتُهر بإدخال قماش البوسل» — وهي معلومة تاريخية مميِّزة."
    observations: >
      المجموعة تمثّل علَماً شخصياً لمصمِّم أزياء إنجليزي المولد (1825–1895) أسَّس في باريس أولى دور الخياطة الفرنسية الراقية.
      اللمّتان الحاليتان تُغطّيان الاسم الكامل واللقب وحده، وهو توزيع منطقي معتاد في الأعلام الشخصية.
      أهمية الضبط بالشكل هنا صوتية لا صرفية إذ لا جذور عربية، لكنها تبقى إلزامية وفق المواصفة.
      ينبغي إحلال مصطلح «الخياطة الرفيعة» محل «هوت كوتور» في التعريف العربي.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
