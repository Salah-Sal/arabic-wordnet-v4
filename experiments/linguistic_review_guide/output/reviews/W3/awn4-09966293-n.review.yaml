# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id: awn4-09966293-n  |  ili: i89131  |  pos: n
# compere — British term for presenter of TV acts / cabarets
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'مقدم العروض' مركب مكتوب بدون تشكيل مما يُعسِّر التحقق من الوزن الصرفي الدقيق (هل هي مُقَدِّم أم مُقَدَّم؟)"
      - "التعريف العربي ترجمة حرفية للإنجليزية ولا يتبع أسلوب المعجم الوسيط (جنس قريب + فصل نوعي)"
      - "عبارة 'وما إلى ذلك' في التعريف تُضعِف الفصل النوعي وتجعله مفتوحاً بلا حدود"
      - "المجموعة تحتوي لمّة واحدة فقط رغم وجود مرادفات محتملة في المعجمية العربية الحديثة"
    observations: >
      المجموعة تُمثِّل مصطلحاً بريطانياً خاصاً (compere) مستعاراً من الفرنسية 'compère'،
      يختلف عن مقدِّم الحفل العام (emcee/master of ceremonies) في انحصاره بالفقرات
      التلفزيونية وعروض الملاهي الليلية. الجذر 'قدم' ذو دلالة تراثية على السبق والتقدُّم
      (مُقَدِّمَةُ الجَيْشِ، قُدُمًا) وهو ملائم للتعبير عن وظيفة التقديم والعرض. البنية
      الإضافية لـ'مُقَدِّمُ العُرُوضِ' صحيحة صرفاً ودلالةً لكنها تحتاج تشكيلاً كاملاً.
      الجذر 'عرض' يُوظَّف في كلمة 'عُرُوض' جمع عرض بمعنى performance/show، وهو
      توظيف فصيح شائع في الصحافة والإعلام العربي المعاصر.
  blind_candidates:
    - lemma: "مُعَرِّف"
      generation_method: ishtiqaq
      justification: "مشتق من جذر (ع ر ف) على وزن مُفَعِّل الدال على كثرة الفعل أو المهنة؛ المُعَرِّف هو من يُعَرِّف بالآخرين ويُمهِّد لهم ويُقدِّمهم للجمهور، وهو ما يصف وظيفة compere جوهرياً"
    - lemma: "مُقَدِّمُ الفَقَرَات"
      generation_method: tarkib
      justification: "مركب إضافي من 'مُقَدِّم' (الذي يتولى التقديم) و'الفَقَرَات' بمعناها في مجال الفنون (أجزاء العرض/segments)؛ يُعبِّر بدقة عن الشخص الذي يُقدِّم أقسام البرنامج الترفيهي متسلسلةً"
    - lemma: "مُسَيِّرُ الحَفَل"
      generation_method: tarkib
      justification: "مركب إضافي من 'مُسَيِّر' (من سيَّر الأمور وأدارها ونظَّمها، وزن مُفَعِّل من سيَّرَ) و'الحَفَل'؛ يصف من يُدير الحفل الترفيهي ويضبط إيقاعه ويتولى ربط فقراته"
    - lemma: "الحاجِب"
      generation_method: majaz
      justification: "إزاحة دلالية من اللفظ التراثي؛ الحاجب في التاريخ العربي كان يتوسط بين الجمهور والحضرة الملكية ويُدخل الناس إليها، وهو قريب وظيفياً من مقدِّم الفقرات الذي يتوسط بين الجمهور والعروض"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "مقدم العروض"
      confirm:
        - text: "«مقدِّم — translation_en: host»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm) — entry_id 484559"
        - text: "«مقدِّم — translation_en: presenter»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — entry_id 485642"
        - text: "«مُقدِّم برنامج: الشخص الذي يقدم برنامجا ما للجمهور — translation_en: presenter»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — entry_id 488698"
        - text: "«(1) مُقدِّم البرامج (2) يقدِّم البرامج — translation_en: compere»"
          source: "المورد الحديث (2008) — entry_id 679337"
      expands:
        - text: "«مقدِّم — المذيع الرئيس الذي يقدِّم نشرة الأخبار المتلفزة — translation_en: anchorperson (TV)»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — entry_id 483261"
          addition: "يُثبت رسوخ 'مقدِّم' مصطلحاً في الإعلام العربي الحديث، وإن كان السياق هنا أخباراً لا ملهى؛ يدعم أساس المركب الإضافي 'مُقَدِّمُ العُرُوضِ'"

    - lemma: "مُعَرِّف"
      contradicts:
        - text: "«مُعرِّف — هو اسم في لغة برمجة عالية المستوى، كاسم وظيفة مثل 'قراءة' أو 'printf'، أو اسم أمر مُعرَّف مُسبَّقًا مثل 'return' — translation_en: identifier»"
          source: "مسرد الهندسة الكهربائية (ArabTerm) — entry_id 377596"
          conflict: "الدلالة الراسخة لـ'معرِّف' في المعجمية التقنية الحديثة هي 'identifier' في علوم الحاسوب، مما يُفضي إلى التباس لا يمكن قبوله عند توظيفه لمقدِّم العروض"
        - text: "«مُعَرِّف — من (ع ر ف) المرشد الموجه، والمطيب المزين»"
          source: "موسوعة السلطان قابوس لأسماء العرب — entry_id 945201"
          conflict: "التراث المعجمي يُقيِّد 'المُعَرِّف' بمعنى 'المرشد الموجه' لا مقدِّم الفقرات الترفيهية"
        - text: "«مُعَرَّف — translation_en: log in — معطيات تمكن نظاما حاسوبيا من التعرف على المستعمل أو المشترك»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — entry_id 484858"
          conflict: "حتى في مجال الإعلام والاتصال تحديداً، ترسَّخ 'معرِّف/معرَّف' في السياق الحاسوبي لا الفني"

    - lemma: "مُقَدِّمُ الفَقَرَات"
      expands:
        - text: "«فقرة — translation_en: paragraph (Arts, Recreation and Sports)»"
          source: "مسرد الفن، التسلية والرياضة (ArabTerm) — entry_id 491351"
          addition: "يُثبت أن 'فقرة' مصطلح مقبول في مجال الفنون والترفيه بمعنى وحدة العرض (act/segment)، مما يدعم صحة الجزء الثاني من المركب المقترح"

    - lemma: "مُسَيِّرُ الحَفَل"
      evidence_status: "no_material_found"

    - lemma: "الحاجِب"
      contradicts:
        - text: "«الحاجِبُ: البَوَّابُ. وقيل: خاصٌّ ببَوَّابِ المَلِك — العَظْمُ الذى فَوْقَ العَيْنِ بلَحْمِهِ وشَعره»"
          source: "المعجم الكبير — entry_id 75155"
          conflict: "الدلالة الغالبة 'البواب' بعيدة كلياً عن مقدِّم العروض الترفيهي؛ المعنيان الرئيسيان (البواب + حاجب العين) لا يترك مجالاً للمجاز المُقترح"
        - text: "«الحَاجِبُ: البواب (صفة غالبة) (ج) حجبة وحجاب والعظم الذي فوق العين»"
          source: "المعجم الوسيط — entry_id 870787"
          conflict: "المعجم الوسيط الحديث يُثبِّت 'البواب' كدلالة غالبة موصوفة بذلك صراحةً، مما يرفع خطر الالتباس عند توظيف المجاز"
        - text: "«حاجب — translation_en: chamberlain — domain: Geography and History»"
          source: "مسرد الجغرافيا والتاريخ (ArabTerm) — entry_id 502383"
          conflict: "حتى الاستخدام التاريخي يُقيِّده بمعنى 'حاجب الملك/التشريفاتي' لا الدور الترفيهي"

    - lemma: "مُقَدِّم البَرَامِج"
      confirm:
        - text: "«(1) مُقدِّم البرامج (2) يقدِّم البرامج — translation_en: compere»"
          source: "المورد الحديث (2008) — entry_id 679337"
        - text: "«مُقدِّم برنامج: الشخص الذي يقدم برنامجا ما للجمهور — translation_en: presenter»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — entry_id 488698"
      expands:
        - text: "«قُطْب السهرة — وهو في الغالب ممثِّل أو صحفي مشهور — translation_en: emcee; master of ceremonies»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — entry_id 484172"
          addition: "يُبيِّن أن 'مُقَدِّم البَرَامِج' يُقابل compere وهو أعم دلالةً من 'قُطْب السَّهْرَة' المقيَّد بالمناسبات الاحتفالية"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "مقدم العروض"
      decision: confirmed
      decision_reason: >
        المركب الإضافي 'مُقَدِّمُ العُرُوضِ' صحيح صرفاً ودلالةً؛ 'مُقَدِّم' مصطلح إعلامي
        راسخ يُقابل host/presenter/compere في مصادر ArabTerm المتعددة، و'عُرُوض' جمع
        'عَرْض' بمعنى performance/show فصيح شائع في الصحافة. يستلزم تصحيح التشكيل
        للصيغة الكاملة مُقَدِّمُ العُرُوضِ.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُركِّز على الفقرات الترفيهية المباشرة (ملاهٍ، كباريه، عروض حيّة) وهو المصطلح البريطاني الخاص المقابل لـ compere؛ أضيق دلالةً من 'مُقَدِّم البَرَامِج'"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقَدِّمُ العُرُوضِ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُعَرِّف"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُثبِّت 'معرِّف' بمعنى identifier في علوم الحاسوب (مسرد الهندسة
        الكهربائية)، وبمعنى 'المرشد الموجه' في التراث (موسوعة قابوس)؛ لا توجد شواهد
        تدعم توظيفه بمعنى مقدِّم العروض. فضلاً عن ذلك، الاستخدام التقني الراسخ في
        مجال الإعلام والاتصال يحول دون قبوله في هذا الحقل.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُقَدِّمُ الفَقَرَات"
      source: stage1
      decision: removed
      decision_reason: >
        لا مدخل معجمي ثابت لهذا المركب. وجود 'مُقَدِّم البَرَامِج' في المورد الحديث
        كترجمة مباشرة لـ compere يجعله الخيار الأوثق للمجموعة؛ 'الفَقَرَات' أضيق من
        'البَرَامِج' وقد توحي بالفقرات الصحفية. اختبار التثبيت المعجمي: لم يُعثَر
        على هذا المركب مسجَّلاً في أي مصدر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُسَيِّرُ الحَفَل"
      source: stage1
      decision: removed
      decision_reason: >
        لا دليل معجمي على استخدام هذا المركب مصطلحاً ثابتاً في المعجمية العربية.
        'مُسَيِّر' توحي بمعنى إداري تنظيمي أكثر من الدور الترفيهي التقديمي التفاعلي
        الذي يجمع بين التسلية والربط؛ لا يجتاز اختبار السكّ.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "الحاجِب"
      source: stage1
      decision: removed
      decision_reason: >
        المجاز غير مقنع: الدلالة الغالبة في المعاجم الرئيسية (المعجم الكبير، المعجم الوسيط)
        مُقيَّدة بـ'البواب' و'حاجب العين'، ولا توجد شواهد تدعم توظيفه في السياق الترفيهي
        الحديث. الالتباس مع 'البواب' يعني فشل اختبار الاستبدال.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    # ── لمّة مكتشفة من جسر الأدلة ──
    - lemma: "مُقَدِّم البَرَامِج"
      source: evidence_bridge
      decision: confirmed
      decision_reason: >
        مسجَّل في المورد الحديث (2008) كترجمة مباشرة لـ compere، وفي مسرد الإعلام
        والتواصل (ArabTerm) بمعنى presenter. يُعدُّ التقابل مع compere مباشراً ومعتمداً
        في المعجمية العربية الحديثة. المركب شائع في الصحافة والإعلام العربي ويجتاز
        اختبار التثبيت المعجمي. المدخل موجود في قاعدة البيانات (entry_id: 679337)،
        يحتاج فقط ربطاً بالمجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "أوسع دلالةً من 'مُقَدِّمُ العُرُوضِ'؛ يشمل تقديم أي برنامج تلفزيوني أو إذاعي بما فيها البرامج الإخبارية والحوارية والترفيهية، دون تخصيص عروض الملاهي"
      actions:
        - command: add_sense
          params:
            entry_id: "679337"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "مصطلح بريطاني للشخص الذي يقدم الفقرات التلفزيونية أو عروض الملاهي وما إلى ذلك"
    assessment:
      decision: revise
      reason: >
        التعريف ترجمة حرفية تفتقر إلى الجنس القريب الصريح ('شخص يتولى...')؛ عبارة
        'وما إلى ذلك' غامضة تُضعف الفصل النوعي؛ لا يُذكر الدور الوظيفي (الربط بين
        الجمهور والفنانين). لا يتبع أسلوب المعجم الوسيط القائم على الجنس القريب
        والفصل النوعي.
    authored:
      - type: terminological
        text: "شَخْصٌ يَتَوَلَّى تَقْدِيمَ الفَقَرَاتِ التِّلْفِزِيُونِيَّةِ وَعُرُوضِ المَلَاهِي وَالتَّعْرِيفَ بِالفَنَّانِينَ بِوَصْفِهِ حَلْقَةَ وَصْلٍ بَيْنَ الجُمْهُورِ وَالعُرُوضِ (مُصْطَلَحٌ بِرِيطَانِيٌّ)"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شَخْصٌ يَتَوَلَّى تَقْدِيمَ الفَقَرَاتِ التِّلْفِزِيُونِيَّةِ وَعُرُوضِ المَلَاهِي وَالتَّعْرِيفَ بِالفَنَّانِينَ بِوَصْفِهِ حَلْقَةَ وَصْلٍ بَيْنَ الجُمْهُورِ وَالعُرُوضِ (مُصْطَلَحٌ بِرِيطَانِيٌّ)"

  examples:
    per_lemma:
      - lemma: "مُقَدِّمُ العُرُوضِ"
        examples:
          - text: "تَوَلَّى مُقَدِّمُ العُرُوضِ إِدَارَةَ أَمْسِيَةِ الكَابَارِيه بِاقْتِدَارٍ، مُعَرِّفًا بِالفَنَّانِينَ وَمُسَلِّيًا الجُمْهُورَ بِطَرَائِفِهِ بَيْنَ الفَقَرَاتِ"
            type: usage
      - lemma: "مُقَدِّم البَرَامِج"
        examples:
          - text: "اشْتُهِرَ بِدَوْرِهِ مُقَدِّمًا لِلبَرَامِجِ الغِنَائِيَّةِ وَعُرُوضِ المَلَاهِي الَّتِي تَجْمَعُ المُوسِيقَى وَالفُكَاهَةَ وَتَسْتَقْطِبُ الجَمَاهِيرَ"
            type: usage
