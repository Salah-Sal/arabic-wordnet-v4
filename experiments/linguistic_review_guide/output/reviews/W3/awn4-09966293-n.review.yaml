      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اشْتُهِرَ بِدَوْرِهِ مُقَدِّمًا لِلبَرَامِجِ الغِنَائِيَّةِ وَعُرُوضِ المَلَاهِي الَّتِي تَجْمَعُ المُوسِيقَى وَالفُكَاهَةَ وَتَسْتَقْطِبُ الجَمَاهِيرَ"


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────
