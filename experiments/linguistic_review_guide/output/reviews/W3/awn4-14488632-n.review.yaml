# مراجعة المجموعة الترادفية — awn4-14488632-n (birth defect)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تشوه خلقي، عيب خلقي) بدون تشكيل كامل"
      - "المجموعة الإنجليزية تضم خمسة مصطلحات (birth defect, congenital anomaly, congenital defect, congenital disorder, congenital abnormality) بينما العربية لا تغطي إلا اثنين"
      - "التعريف العربي مختصر جداً (عيب موجود عند الولادة) ويحتاج إثراء"
    observations: "المفهوم طبي واضح، وله مصطلحات عربية راسخة في المعاجم الطبية الموحدة. المصطلح الأول (تشوه خلقي) يركز على البعد الشكلي (التغيّر في الهيئة)، والثاني (عيب خلقي) أعمّ ويشمل أي نقص وظيفي أو بنيوي. يمكن إثراء المجموعة بمصطلحات طبية أخرى مثبتة."
  blind_candidates:
    - lemma: "عَيْبٌ وِلادِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من عَيْب + وِلادِيّ (نسبة إلى الولادة)، يطابق التعريف مباشرة: عيب موجود عند الولادة. مصطلح طبي شائع في الاستعمال العربي."
    - lemma: "شُذوذٌ خِلْقِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من شُذوذ (انحراف عن السوي) + خِلْقِيّ (منذ الخِلقة). يقابل congenital anomaly في الاصطلاح الطبي."
    - lemma: "آفَةٌ خِلْقِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من آفة (عرض مفسد) + خِلْقِيَّة. الآفة في المعاجم الكلاسيكية: عرض يفسد ما يصيبه، وهو قريب من مفهوم العيب الخِلقي."
    - lemma: "عَاهَةٌ خِلْقِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من عاهة (ما يصيب الكائن من آفة) + خِلْقِيَّة. العاهة في المعجم الوسيط مرادفة للآفة."

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَشَوُّهٌ خِلْقِيّ"
      confirm:
        - text: "«تَشَوُّهٌ خِلْقِيّ» = congenital malformation"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تَشَوُّه» = malformation (deformity)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«التَّشَوُّهُ (فى علم الأحياء): تغيُّرٌ غيرُ سوىٍّ فى التَّكوين الجسمىِّ للكائن الحىِّ, وقد يكونُ مكتسبًا أو بسبب عَرَضٍ»"
          source: "المعجم الكبير"
        - text: "«تَشَوُّه» = malformation — إفساد الصورة"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
      expands:
        - text: "«الشَّوَه: التَّشَوُّه، وبخاصة في جسم حيّ»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد ارتباط التشوه بالكائن الحي"

    - lemma: "عَيْبٌ خِلْقِيّ"
      confirm:
        - text: "«عَيبٌ خِلْقِيّ» = congenital defect"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«عَيبٌ وِلادِيّ (عَيبٌ خِلْقِيّ)» = birth defect (congenital defect)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«العِلّة الخِلْقيّة: علّة مصاحِبة منذ الولادة» = birth defect"
          source: "المورد الحديث (2008)"
        - text: "«خِلْقيّ: صفة أو عيب موجود عند الولادة أو قبلها إما نتيجة النمط الجينيّ للفرد، وإما نتيجة بيئته قبل الولادة»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"

    # ── مرشحات المرحلة ١ ──
    - lemma: "عَيْبٌ وِلادِيّ"
      confirm:
        - text: "«عَيبٌ وِلادِيّ (عَيبٌ خِلْقِيّ)» = birth defect (congenital defect)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«عَيبٌ وِلاَدِيّ (عَيبٌ خِلْقِيّ)» = birth defect (congenital defect)"
          source: "المعجم الطبي الموحد (2009) — مدخل ثانٍ"

    - lemma: "شُذوذٌ خِلْقِيّ"
      confirm:
        - text: "«شُذوذٌ خِلْقِيّ» = congenital anomaly"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«شُذوذ: انحراف عن الحالة السوية، تشوه خلقي مثلا» = abnormality"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      expands:
        - text: "«المُهْلِكة: تَشَوُّهٌ أو شذوذ خِلْقيّ مُؤَدٍّ إلى موت الكائن المصاب به»"
          source: "المورد الحديث (2008)"
          addition: "يستخدم شذوذ خلقي كمرادف لتشوه في السياق الطبي"

    - lemma: "آفَةٌ خِلْقِيَّة"
      expands:
        - text: "«الآفَةُ: العاهَةُ، أو عَرَضٌ مُفْسِدٌ لما أصابَه»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "آفة بمعنى عام لا تخصيص طبي خِلقي"
        - text: "«كل ما يصيب شيئاً فيفسده, من عاهة أو مرض أو قحط»"
          source: "المعجم الوسيط"
          addition: "آفة عامة تشمل الأمراض والقحط ولا تختص بالعيوب الخِلقية"

    - lemma: "عَاهَةٌ خِلْقِيَّة"
      expands:
        - text: "«العاهة: ما يصيب الزرع والماشية من آفة أو مرض»"
          source: "المعجم الوسيط"
          addition: "العاهة في الاستعمال المعجمي مرتبطة بالزرع والماشية أكثر من الإنسان"
        - text: "«العاهة: الآفة»"
          source: "التعريفات الفقهية للبركتي"
          addition: "مرادفة للآفة بلا تخصيص خِلقي"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَشَوُّهٌ خِلْقِيّ"
      decision: confirmed
      decision_reason: "مصطلح طبي راسخ مثبت في المعجم الطبي الموحد (= congenital malformation)، ومؤيَّد بالمعجم الكبير والمورد الحديث. يركز على البعد الشكلي/البنيوي للعيب."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركز على التغيّر الشكلي والبنيوي غير السوي في التكوين الجسمي، ويُستخدم غالباً للعيوب المرئية أو الهيكلية (= malformation)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشَوُّهٌ خِلْقِيّ"

    - lemma: "عَيْبٌ خِلْقِيّ"
      decision: confirmed
      decision_reason: "مصطلح طبي راسخ مثبت في المعجم الطبي الموحد (= congenital defect)، وهو أعمّ من تشوه خلقي إذ يشمل أي نقص وظيفي أو بنيوي موجود منذ الولادة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "أعمّ دلالياً من (تشوه خلقي)؛ يشمل أي نقص أو خلل — وظيفي أو بنيوي — موجود عند الولادة، سواء كان مرئياً أم لا (= defect)."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَيْبٌ خِلْقِيّ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "عَيْبٌ وِلادِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح طبي مثبت في المعجم الطبي الموحد بمدخلين صريحين (عَيبٌ وِلادِيّ = birth defect). يُفضَّل في السياق الطبي العربي لأنه يربط العيب بالولادة مباشرةً بدلاً من الخِلقة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُبرز الارتباط الزمني بالولادة (وِلادِيّ) بدلاً من الربط بالخِلقة الأصلية (خِلْقِيّ)، ويُستخدم حين يُراد التأكيد على أن العيب يُكتشف عند الولادة."
      actions:
        - command: create_entry
          params: {lemma: "عَيْبٌ وِلادِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "شُذوذٌ خِلْقِيّ"
      source: stage1
      decision: removed
      decision_reason: "رغم ثبوته في المعجم الطبي الموحد (= congenital anomaly)، فإن لفظ (شُذوذ) في الاستعمال العربي المعاصر حمل دلالات سلبية إضافية قد تُثقل المصطلح. كذلك فإن الشذوذ يعني الانحراف عن القاعدة وليس بالضرورة عيباً، فهو أقرب إلى (anomaly) منه إلى (defect). يمكن تركه لمجموعة ترادفية أدق."

    - lemma: "آفَةٌ خِلْقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على هذا المركب كمصطلح مسكوك في أي معجم طبي أو لغوي. الآفة في المعاجم الكلاسيكية عامة جداً (عرض مفسد لما أصابه) ولا تختص بالعيوب الخِلقية. فشل في اختبار التثبيت المعجمي."

    - lemma: "عَاهَةٌ خِلْقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على هذا المركب كمصطلح مسكوك. العاهة في المعجم الوسيط مرتبطة بما يصيب الزرع والماشية أكثر من الإنسان، ولا يوجد شاهد على استعمال (عاهة خلقية) كمصطلح طبي مستقل."

