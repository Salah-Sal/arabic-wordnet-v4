      decision: revise
      reason: >
        التعريف الحالي دقيق في جوهره (الجنسية، التعريق، الحدث، التاريخ) لكنه
        مقتضَب: يُهمل ذكر تخصصه الرياضي (العدو والقفز في الميدان والحلبة) وعدد
        ميدالياته الذهبية الأربع التي جعلت أداءه استثنائياً تاريخياً. كذلك تبقى
        صياغة «غضب هتلر» دون تفسير للسياق الأيديولوجي. المناسب للأعلام الشخصية
        هو التعريف الموسوعي.
