# ── المرحلة ١: المراجعة والتوليد ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة (أوينز، جيسي أوينز) تفتقر إلى التشكيل الكامل الإلزامي"
      - "صنف المدخلَيْن (pos) ينبغي أن يكون (proper_noun) لا (n) إذ هما علَم شخصي أجنبي"
      - "غياب اللمّة المقابلة لاسم الميلاد الرسمي (James Cleveland Owens) المُدرَج في اللمّات الإنجليزية"
      - "التعريف الحالي صحيح لكنه مقتضَب: لا يذكر تخصصه الرياضي الدقيق (العدو والقفز) ولا عدد ميدالياته الأربع"
    observations: >
      هذه المجموعة تمثّل عَلَماً شخصياً لرياضي أمريكي من أصول أفريقية اشتُهر بفوزه
      في دورة أولمبياد برلين 1936؛ وهو جيسي أوينز. الأعلام الشخصية الأجنبية لا تقبل
      الاشتقاقَ العربي ولا المجاز ولا التركيب الاصطلاحي، والتعريبُ (نقل الأصوات) هو
      الأسلوب الوحيد الممكن. ينبغي أن تحمل مداخل هذه المجموعة صنف (proper_noun)
      لتمييزها عن الأسماء العامة. التعريف الحالي مقبول إجمالاً لكن يستحق توسيعاً
      موسوعياً يليق بالعلم التاريخي.

  blind_candidates:
    - lemma: "أُوِينْز"
      generation_method: taarib
      justification: >
        يشير التعريف إلى رياضي أمريكي أسود أحرج هتلر في أولمبياد برلين 1936؛
        والسياق التاريخي لا يحتمل غير جيسي أوينز. اللقب الإنجليزي (Owens) يُعرَّب
        صوتياً: أُوِينْز، بدمّة على الهمزة (o) وكسرة على الواو (w كحرف يشبع) وسكون
        على النون ثم الزاي.
    - lemma: "جِيسِي أُوِينْز"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل المتداول (Jesse Owens)؛ جِيسِي = /dʒɛsi/ بكسرة على الجيم
        وياء ممدودة ثم سين مكسورة وياء، ثم أُوِينْز كما سبق. هذه الصيغة هي الأشهر
        في المصادر العربية المكتوبة والإعلام المتخصص.
    - lemma: "جِيمِسُ كِلِيفْلَانْدُ أُوِينْزُ"
      generation_method: taarib
      justification: >
        تعريب الاسم الرسمي عند الولادة (James Cleveland Owens)؛ ضروري لاكتمال التغطية
        المعجمية لشخصية موسوعية توثّقها المصادر بأسمائها الثلاثة. الاسمان الأولان
        يُعرَّبان: جِيمِس = /dʒeɪmz/، كِلِيفْلَانْد = /ˈkliːvlənd/.
    - lemma: "أُوِينْس"
      generation_method: taarib
      justification: >
        تعريب بديل للقب (Owens) بالسين عوضاً عن الزاي، وهو خيار نظري يرد أحياناً
        في بعض الأنظمة التعريبية التي تنقل صوت /z/ بالسين. أُدرج للمقارنة مع
        أُوِينْز.


