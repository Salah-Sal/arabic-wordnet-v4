          عَدَّاءٌ وقَفَّازٌ أمريكيٌّ أسودُ، يُعدُّ من أبرز رياضيي القرن العشرين؛
          فاز بأربع ميداليات ذهبية في مسابقات ألعاب القوى (سباق ١٠٠م، و٢٠٠م،
          والوثب الطويل، وتتابع ٤×١٠٠م) خلال الألعاب الأولمبية لعام ١٩٣٦ في
          برلين، مُكذِّباً بذلك نظريةَ تفوُّق العرق الآري التي روَّج لها النظام
          النازي؛ وُلد عام ١٩١٣ في ولاية ألاباما، وتوفي عام ١٩٨٠.
