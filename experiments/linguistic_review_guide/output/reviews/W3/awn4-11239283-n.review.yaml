# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة ١: أوينز ──
    - lemma: "أوينز"
      decision: confirmed
      decision_reason: >
        اللقب (أوينز) صيغة مشروعة تُستخدَم في الإعلام والكتابة العربية للإشارة
        إلى جيسي أوينز في سياقات الإيجاز. لا مشكلة في الدلالة؛ لكن التشكيل الكامل
        غائب ويجب إضافته. كذلك ينبغي تحديث POS إلى proper_noun.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المجرد دون الاسم الأول؛ يُستخدَم للإيجاز في نصوص عرّفت الشخصية مسبقاً
        للقارئ. أقل تمييزاً من الاسم الكامل لو وُجد أشخاص آخرون بهذا اللقب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُوِينْز"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── لمّة موجودة ٢: جيسي أوينز ──
    - lemma: "جيسي أوينز"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المتداول هو الصيغة الرئيسية في المصادر العربية والموسوعات
        والإعلام الرياضي. صحيح دلالياً؛ يحتاج تشكيلاً كاملاً وتحديث POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يجمع الاسم الأول واللقب؛ يمنح التمييز الكامل للشخصية دون التباس، وهو
        الصيغة المعيارية في الكتابة العربية الموضوعية عند أول ذكر للشخصية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِيسِي أُوِينْز"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشح المرحلة ١: جيمس كليفلاند أوينز ──
    - lemma: "جِيمِسُ كِلِيفْلَانْدُ أُوِينْزُ"
      source: stage1
      decision: confirmed
      decision_reason: >
        اسم الميلاد الرسمي (James Cleveland Owens) مُدرَج في اللمّات الإنجليزية
        للمجموعة ذاتها ولا يقابله لمّة عربية في AWN4. الإدراج ضروري لاكتمال التغطية
        المعجمية وتوافق AWN4 مع الشبكة الإنجليزية OEWN. وإن كان الاستخدام اليومي
        يفضّل الاسم المختصر (جيسي أوينز).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الكامل الثلاثي؛ يُستخدَم حصراً في السياقات التوثيقية والموسوعية
        والتاريخية التي تستدعي الدقة الببليوغرافية.
      actions:
        - command: create_entry
          params:
            lemma: "جِيمِسُ كِلِيفْلَانْدُ أُوِينْزُ"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: أوينس ──
    - lemma: "أُوِينْس"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب بالسين (أُوِينْس) لا يعكس الصوت الإنجليزي /z/ في (Owens) بصورة
        أدق؛ فالزاي أقرب إلى /z/ من السين /s/. علاوة على ذلك، تعتمد المصادر
        العربية الموثوقة والمعاجم ثنائية اللغة صيغة الزاي (أُوِينْز)، لذا يُرفَض
        هذا البديل تفادياً للتشويش.


