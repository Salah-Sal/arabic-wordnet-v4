# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10306552-n  |  ILI: i91179  |  maltster
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (أعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "الخلط الدلالي الجوهري: «الشعير» = الحبوب الخامة (barley)، بينما «الملت» = شعير مُنبَّت ومُجفَّف (malt)؛ اللمّة والتعريف يصفان صانع الشعير الخام لا صانع الملت."
      - "التعريف دائري: «صانع للشعير» يكاد يطابق اللمّة «صانع الشعير» حرفياً بلا إضافة دلالية."
      - "التعريف قاصر: لا يصف العملية (التنبيت والتجفيف) ولا يميّز هذه المهنة عن المهن المجاورة (بائع الشعير، صانع البيرة)."
      - "غياب المصطلح الأكثر دقةً «الملّات» الوارد في معجم المورد الحديث (2008) بتعريف «صانع المَلْت أو المُتاجر به» مع الترجمة maltster مباشرةً."
    observations: >
      المجموعة تصف «الملّات» (maltster)، وهو حرفيٌّ متخصص في تحويل الشعير الخام إلى
      ملت (شعير مُنبَّت) عبر ثلاث مراحل: النقع والتنبيت، ثم التجفيف في الأفران. اللمّة
      الموجودة «صانع الشعير» تنسب إليه صنعَ الشعير ذاته لا الملت، وهو خطأ مصطلحي لأن
      الشعير مادة زراعية تُنتَج بالزراعة لا بالصناعة. المصطلح العربي الأكثر دقةً ودلالةً
      على هذه المهنة هو «الملّات» (على وزن فَعَّال من «ملت» بوصفه تعريباً لـmalt)، أو
      «مُنبِّت الشعير» تركيباً وصفياً مُحكَماً يُبرز العملية التقنية الجوهرية.

  blind_candidates:
    - lemma: "مُنَبِّتُ الشَّعِيرِ"
      generation_method: tarkib
      justification: >
        التنبيت هو صميم عملية صنع الملت — نقع الشعير وإطلاق جُرثومة نموّه ثم إيقافه
        بالحرارة. صيغة «فاعل + مضاف إليه» على النمط الإضافي من الفعل «نبَّت» المُستعمَل
        في المصطلح التقني «تنبيت الشعير» (malting) تُنتج عاملاً بشرياً ثابتاً لهذه المهنة.

    - lemma: "صَانِعُ الْمَالِت"
      generation_method: tarkib
      justification: >
        تركيب إضافي يضع «مالت» (التعريب الشائع لـmalt في المعاجم الطبية والغذائية)
        مضافاً إليه لصانع، يُقيم الفرق الدلالي بين صانع الحبوب الخام وصانع المادة
        المُعالَجة. يُصرَّح باسم المادة تجنُّباً للخلط مع «صانع الشعير».

    - lemma: "الشَّعِيرِيُّ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق بالنسبة (يَاء النسب) من «الشعير» على وزن فَعِيلِيّ للدلالة على المنتسب
        إلى مهنة الشعير (غرساً أو تصنيعاً أو بيعاً). قياسي الاشتقاق وإن كانت دلالته
        أوسع من المفهوم المقصود.

    - lemma: "مُخَمِّرُ الشَّعِيرِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «خمَّر» (أَخضَعه للتخمير/الإنبات الحيوي) و«الشعير»؛ يُشير إلى
        الجانب البيوكيميائي لعملية الملتنة (تحريض إنزيمات الإنبات). أقل دقةً من
        «مُنبِّت» إذ التخمير مرحلة لاحقة للتنبيت في الصناعة الغذائية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  queries_run:
    - "Q1: batch headword lookup — صانع الشعير + جميع المرشحات"
    - "Q2: English bridge — translation_en:maltster OR malter OR malt maker OR malt OR malting"
    - "Q3: Arabic FTS — شعير OR ملت OR مالت OR تنبيت OR صانع OR منبت"
    - "Q4: candidate validation — ملات OR ملت OR منبت الشعير OR مخمر الشعير OR صانع الملت"
    - "Q5: Maqayis — dictionary_id=151 — headword_norm IN (شعر، صنع، نبت، ملت)"

  per_lemma:
    - lemma: "صَانِعُ الشَّعِيرِ"
      evidence_status: "no_material_found"

    - lemma: "مُنَبِّتُ الشَّعِيرِ"
      confirm:
        - text: "«شعير مُنبَّت: شعير جرى تنبيته وتعريضه إلى حرارة ثم التخلص من سويقاته لاستعماله في إنتاج البيرة.»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM"
        - text: "«تنبيت الشعير: عملية تحويل الشعير إلى نبت.» — translation_en: malting"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM"
      expands:
        - text: "«النُّونُ وَالْبَاءُ وَالتَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى نَمَاءٍ فِي مَزْرُوعٍ، ثُمَّ يُسْتَعَارُ. فَالنَّبْتُ مَعْرُوفٌ، يُقَالُ نَبَتَ. وَأَنْبَتَتِ الْأَرْضُ. وَنَبَّتُّ الشَّجَرَ: غَرَسْتُهُ.»"
          source: "مقاييس اللغة لابن فارس — جذر (نبت)"
          addition: "الجذر نبت يحمل دلالة الإخراج والغرس والتنمية — وهي لبّ عملية التنبيت الصناعي للشعير."
        - text: "«(المنبت) موضع الإنبات (والقياس فتح الباء) والأصل يُقال إنه لفي منبت صدق»"
          source: "المعجم الوسيط"
          addition: "المَنبِت (موضع الإنبات) يُثبت أصالة الصيغة الاسمية من نبت في المعجم العربي."

    - lemma: "صَانِعُ الْمَالِت"
      confirm:
        - text: "«الملّات: صانع المَلْت أو المُتاجر به.» — translation_en: maltster"
          source: "المورد الحديث (2008) — ARABTERM"
        - text: "«مالت (الشَّعيرُ النَّابِت)» — translation_en: malt"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
      expands:
        - text: "«(1) المَلْت: شَعير مُنْبَتٌ بالنقع في الماء — (3) يُمَلِّت: يحوِّل إلى مَلْت — (4) يصنع أو يمزج بالملت — (5) يتملَّت: يتحوَّل إلى مَلْت.» — translation_en: malt"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "وجود الفعل «يُمَلِّت» وصيغة «يصنع...بالملت» يُثبت الاستخدام الفعلي لمادة «ملت» في صياغة الجمل العربية الحديثة."

    - lemma: "الشَّعِيرِيُّ"
      contradicts:
        - text: "«بائعُ الشَّعير»"
          source: "المعجم الكبير — مجمع اللغة العربية (OCR)"
          conflict: "المعجم يُثبت أن الشعيريَّ هو بائع الشعير لا صانع الملت؛ دلالة مغايرة للمعنى المطلوب."

    - lemma: "مُخَمِّرُ الشَّعِيرِ"
      expands:
        - text: "«تخمير» — translation_en: malting"
          source: "المَكنَز الزراعي متعدد اللغات AGROVOC — ARABTERM"
          addition: "ترجمة AGROVOC لـmalting بـ«تخمير» تُثبت التلاقي الجزئي بين التخمير والملتنة في السياق الزراعي، لكنه تطابق غير دقيق."
      contradicts:
        - text: "«شعير مُنبَّت: شعير جرى تنبيته وتعريضه إلى حرارة...»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          conflict: "المصطلح التقني الغذائي يُفرّق بين التنبيت والتخمير؛ فالملت يُنتَج بالتنبيت والتجفيف لا بالتخمير الكيميائي."

    # لمّة مكتشفة في المرحلة ٢ عبر الجسر الإنجليزي
    - lemma: "الْمَلَّاتُ"
      confirm:
        - text: "«الملّات: صانع المَلْت أو المُتاجر به.» — translation_en: maltster"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«(1) المَلْت: شَعير مُنْبَتٌ بالنقع في الماء — (3) يُمَلِّت: يحوِّل إلى مَلْت»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "وجود فعل «مَلَّتَ» ومصدره «ملت» يُعزّز تصنيف «مَلَّات» على وزن فَعَّال بوصفه صيغة مبالغة/احتراف عربية لاسم الفاعل."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "صَانِعُ الشَّعِيرِ"
      decision: removed
      decision_reason: >
        الخطأ الدلالي الجوهري: «الشعير» = barley (الحبوب الخامة)، أما المقصود هو
        «الملت» = malt (الشعير المُنبَّت المُجفَّف). لا توجد أي شواهد معجمية تُثبت
        استخدام «صانع الشعير» بمعنى maltster. التعريف الإنجليزي "a maker of malt"
        يُؤكد أن المُشار إليه هو الملت لا الشعير. فضلاً عن ذلك، أخفق التعبير في
        اختبار التثبيت المعجمي: لا يرد في أيٍّ من المعاجم المُستعلَمة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "مُنَبِّتُ الشَّعِيرِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        «تنبيت الشعير» مصطلح تقني غذائي مُثبَّت في المعجم الموحد لمصطلحات تقانات
        الأغذية (ARABTERM) بترجمة مباشرة malting. منه يُصاغ اسم الفاعل المؤدِّب
        «مُنبِّت الشعير» للشخص الذي يمارس هذه العملية، وهو تركيب إضافي يستوفي
        مبدأ الاطّراد الاشتقاقي. اجتاز فحص الاستبدال: «محوِّل الشعير» تُغيِّر الدلالة
        إذ التنبيت أخص من التحويل. الجذر نبت له وزن قياسي في العربية لأسماء الفاعل
        من التفعيل. لا دلالة لهجية ولا تعارض معجمي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الجانب التقني للمهنة (التنبيت بالنقع والحرارة)، ويستخدم في السياقات
        الغذائية والزراعية أكثر من الاستخدام الاجتماعي؛ مقابل «الملّات» الذي هو
        الاسم التجاري والمهني الأشمل.
      actions:
        - command: create_entry
          params:
            lemma: "مُنَبِّتُ الشَّعِيرِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "الشَّعِيرِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        المعجم الكبير (OCR) يُثبت صراحةً: «الشعيريُّ: بائعُ الشعير» — دلالته البيع
        لا الصنع، والشعير الخام لا الملت. اللمّة تفشل في فحص الاستبدال وفحص
        التثبيت المعجمي في السياق المطلوب.
      evidence_assessment:
        case: contradicts_only

    - lemma: "صَانِعُ الْمَالِت"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود «صانع المَلْت» ضمن تعريف «الملّات» في المورد الحديث، يفشل هذا
        التعبير في اختبار التثبيت المعجمي (لا يرد كمدخل مستقل) وفي اختبار المصطلح
        (يمكن إبدال «صانع» بـ«منتج» أو «محضِّر» بلا تغيير دلالي جوهري). «الملّات»
        أكثر إيجازاً وتلكيكاً ويُؤثَر وفق مبدأ إيثار الأكثر اقتصاداً.
      evidence_assessment:
        case: mixed

    - lemma: "مُخَمِّرُ الشَّعِيرِ"
      source: stage1
      decision: removed
      decision_reason: >
        التخمير (fermentation) عملية مغايرة للملتنة (malting)؛ الملتنة تنبيت وتجفيف
        لا تخمير كيميائي. المصطلح التقني الغذائي يُفرّق بينهما صراحةً. فضلاً عن
        الحمولة الاجتماعية السلبية لمادة «خمر» في الثقافة العربية الإسلامية مما
        يُعيق تداوله في السياق التقني المحايد.
      evidence_assessment:
        case: mixed

    # ── لمّة مكتشفة في المرحلة ٢ ──
    - lemma: "الْمَلَّاتُ"
      source: stage2
      decision: confirmed
      decision_reason: >
        «الملّات» مدخل معجمي مستقل في المورد الحديث (2008) بالتعريف الحرفي: «صانع
        المَلْت أو المُتاجر به» مع الترجمة الإنجليزية maltster مباشرةً — وهو عين
        المفهوم المطلوب. الصيغة على وزن فَعَّال (صيغة المبالغة / الاحتراف) قياسية
        في العربية لأسماء الحِرَف (نجّار، حدّاد، خبّاز). اجتاز فحص اللهجية (فصيح
        مُعجمي). اجتاز فحص الاقتراض: تعريب «malt» على النمط الصرفي العربي مقبول
        إذ يقبل لام التعريف (الملّات) والنسبة (ملّاتي) والجمع (ملّاتون).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم المهني المُسكَّك المختصر للمهنة؛ يشمل صنع الملت والتجارة فيه. يُستخدم
        في السياق التجاري والمهني الأعم؛ مقابل «مُنبِّت الشعير» الذي يُركِّز على
        الجانب التقني الإنتاجي دون التجاري.
      actions:
        - command: create_entry
          params:
            lemma: "مَلَّاتٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
stage4_content:
  definition:
    current: "صانع للشعير"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي غير صحيح دلالياً (الشعير ≠ الملت) ودائري (يشبه اللمّة). يجب
        تعريف المفهوم تعريفاً يُحدّد الجنس القريب (صانع / حِرفي) والفصل النوعي
        (تنبيت حبوب الشعير وتجفيفها لإنتاج الملت).
    authored:
      - type: terminological
        text: "حِرفيٌّ يتخصص في تصنيع الملت بتنبيت حبوب الشعير في الماء وتجفيفها لإنتاج مادة أساسية تُستخدم في صناعة البيرة والمشروبات المُخمَّرة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
