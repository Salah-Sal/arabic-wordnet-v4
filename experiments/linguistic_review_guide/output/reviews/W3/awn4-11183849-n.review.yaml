    - lemma: "ماسين"
      evidence_status: "no_material_found"

    - lemma: "لِيونيد مَاسِين"
      evidence_status: "no_material_found"

    - lemma: "لِيونيد فِيدوروفِيتش مَاسِين"
      evidence_status: "no_material_found"

    - lemma: "لِيونِيد فِيدوروفِيتش مياسِين"
      evidence_status: "no_material_found"

    - lemma: "مياسِين"
      evidence_status: "no_material_found"

  # أدلة ذات صلة بالسياق العام (لا بالاسم العلَم مباشرة):
  contextual_evidence:
    - entry_id: 677907
      headword: "مُصَمِّم الرَّقَصات"
      translation_en: "choreographer"
      source: "المورد الحديث (2008)"
      relevance: >
        يؤكد أن المصطلح المعتمد في المعجمية العربية الحديثة لـ«choreographer» هو «مُصَمِّم الرَّقَصَات»
        وهو ما يتوافق مع التعريف الحالي للمجموعة الترادفية.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
