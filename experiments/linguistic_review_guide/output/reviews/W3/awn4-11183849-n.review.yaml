    - lemma: "ليونيد ماسين"
      decision: confirmed
      decision_reason: >
        الصيغة الأكثر تداولاً في المصادر العربية لتعريب الاسم الكامل «Leonide Massine».
        الاسم مشهور في الكتابات العربية عن فنون الباليه الروسي. يحتاج إضافة تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الأول مقرون بالكنية — الصيغة الأكثر شمولاً وتحديداً، تُستخدم في السياقات
        الرسمية والأكاديمية والموسوعية حيث يُراد الإحالة الدقيقة إلى الشخص.
