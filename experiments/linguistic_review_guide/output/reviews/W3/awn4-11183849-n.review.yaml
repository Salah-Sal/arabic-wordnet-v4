  # (أ) مطابقة دقيقة لجميع اللمّات والمرشحات → لا نتائج (أسماء أعلام أجنبية غير مُدرجة)
  # (ب) جسر إنجليزي: Massine / Leonide / Myasin / choreographer / ballet dancer → entry 677907 فقط
  # (ج) بحث FTS: راقص باليه / مصمم رقصات / باليه / كوريوغراف → نتائج مصطلحية عامة

  per_lemma:
