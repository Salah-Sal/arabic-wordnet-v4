# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان «ليونيد ماسين» و«ماسين» مكتوبتان بدون تشكيل، وهذا يخالف متطلبات AWN4 للتشكيل الكامل."
      - "الاسم «ماسين» وحده قد يكون مُبهماً دون السياق، إذ يشترك مع أسماء أخرى."
      - "لا يوجد في المجموعة ما يقابل الصيغة الإنجليزية الكاملة «Leonide Fedorovitch Massine» بالتعريب العربي."
      - "هذا اسم علَم لشخص بعينه — يجب أن يكون pos في المدخل المعجمي proper_noun لا n مجرّداً."
    observations: >
      المجموعة ترادفية لشخص تاريخي بعينه هو ليونيد ماسين (1895-1979)، مصمم رقصات وراقص باليه فرنسي من أصل روسي.
      هذا النوع من المجموعات (اسم علَم) يختلف جوهرياً عن المجموعات المفهومية؛ فاللمّات هي تعريبات للاسم الأجنبي
      وليست مصطلحات عربية مشتقة. المنهجية الواجبة هي التعريب (تَعْرِيب) بأفضل صورة اصطلاحية متداولة في المصادر
      العربية. التعريف الحالي وظيفي لكنه يحتاج تحسيناً أسلوبياً؛ عبارة «روسي المولد» ركيكة مقارنةً بـ«من أصل روسي».

  blind_candidates:
    - lemma: "لِيونيد مَاسِين"
      generation_method: taarib
      justification: >
        تعريب الصيغة الفرنسية «Leonide Massine» وهي الأكثر شيوعاً في المصادر العربية؛
        «ليونيد» من الاسم الأول الفرنسي، و«ماسين» من اللقب العائلي.
    - lemma: "لِيونيد فِيدوروفِيتش مَاسِين"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل «Leonide Fedorovitch Massine» بما يشمل الاسم الأبوي الروسي «فيدوروفيتش»،
        وهو الصيغة الرسمية المستعملة في المصادر الموسوعية والأكاديمية.
    - lemma: "لِيونِيد فِيدوروفِيتش مياسِين"
      generation_method: taarib
      justification: >
        تعريب الاسم الروسي الأصلي «Leonid Fyodorovich Myasin»؛ «مياسين» من «Myasin»
        بالنطق الروسي الأصلي، تُستعمل في المصادر المتخصصة بالأوبرا والباليه الروسي.
    - lemma: "مياسِين"
      generation_method: taarib
      justification: >
        تعريب اللقب الروسي الأصلي «Myasin» كصيغة مختصرة، على غرار استخدام الكنية المفردة
        في النصوص الأدبية والنقدية الروسية الأصل.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
