        الصيغة الكاملة مع الاسم الأبوي ضرورية في السياقات الموسوعية الرسمية وقواعد البيانات
        المرجعية. اختبار السكّ: تعبير مُثبَّت بالتقابل مع المصدر الإنجليزي الموثوق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الثلاثي الكامل (الاسم الأول + الاسم الأبوي + الكنية) — أعلى مستويات التحديد
        والرسمية، يُستخدم في الموسوعات والمراجع الأكاديمية والمصادر الأولية لتمييز الشخص عن
        غيره من حاملي الاسم الأول أو الكنية ذاتها.
