        الموجودة لا بإنشاء مدخل جديد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١ — مقبول ──
    - lemma: "لِيونيد فِيدوروفِيتش مَاسِين"
