      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الكنية المفردة دون الاسم الأول — تُستخدم في السياقات غير الرسمية والنقدية والصحفية
        حيث يكون الشخص معروفاً مسبقاً ويُكتفى بذكر لقبه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَاسِين"

    # ── مرشح المرحلة ١ — مرفوض ──
    - lemma: "لِيونيد مَاسِين"
      source: stage1
      decision: removed
      decision_reason: >
