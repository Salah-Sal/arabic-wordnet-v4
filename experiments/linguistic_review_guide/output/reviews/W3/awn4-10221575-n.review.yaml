# ── المرحلة ١: المراجعة والتوليد (توليد أعمى من الملف المُقنّع) ──

stage1_review:
  assessment:
    concerns:
      - "اللمّة 'انطباعي' خالية من التشكيل الكامل في القاعدة الحالية"
      - "'فنان انطباعي' مركب وصفي يحتاج اختبار اصطلاحيته: هل هو وحدة معجمية ثابتة أم تعبير وصفي حر؟"
      - "التعريف العربي الحالي مُختصر ويفتقر إلى الفصل النوعي الدقيق الذي يُميّز الانطباعي عن سائر الفنانين"
    observations: >
      المجموعة تُمثّل الفنان الانطباعي (Impressionist)، وهو مصطلح نشأ مع الحركة
      الفنية الفرنسية في أواخر القرن التاسع عشر. الجذر (طبع) راسخٌ في العربية بمعنى
      الختم والأثر والسجية، مما يجعل الاشتقاق منه طبيعياً ومنتجاً. اللمّة الأولى
      'انطباعي' هي نسبة اشتقاقية مباشرة وتُستعمل اسماً وصفةً. اللمّة الثانية
      'فنان انطباعي' مركب وصفي يستوجب تحقيق ثبوته كوحدة اصطلاحية بمعيار السكّ.

  blind_candidates:
    - lemma: "الانطِبَاعِيُّ"
      generation_method: ishtiqaq
      justification: >
        مشتق بالنسب من 'الانطباع' (جذر طبع) على صيغة فِعْلِيّ النسبية، يدل على
        المنتسب إلى مذهب الانطباعية الفني، ويقاس عليه نسب المذاهب الأخرى
        كالرومانسي والواقعي والتجريدي. السكّ واضح: لا يمكن إبدال المكوّنين
        لأنه كلمة واحدة مشتقة.
    - lemma: "فَنَّانٌ انطِبَاعِيٌّ"
      generation_method: tarkib
      justification: >
        مركب وصفي يضم 'فنان' (الجنس القريب) و'انطباعي' (الفصل النوعي). يُصرّح
        بأن المقصود شخص فنان لا مجرد أسلوب. يحتاج التحقق من ثبوته كوحدة
        اصطلاحية أو كونه تعبيراً وصفياً.
    - lemma: "الطَّابِعِيُّ"
      generation_method: majaz
      justification: >
        نسبة إلى 'الطابع' بمعنى الأثر المنطبع في الحواس؛ إحياء لمعنى عربي أصيل
        يُجسّد جوهر الانطباعية (نقل الأثر الحسي اللحظي). يتميز عن 'انطباعي'
        بإحيائه للفظ التراثي وتجنُّب الدخيل المُعرَّب.
    - lemma: "اللَّحْظِيُّ"
      generation_method: majaz
      justification: >
        نسبة إلى 'اللحظة'، إذ تعتمد الانطباعية على التقاط الانطباع البصري اللحظي
        للضوء والحركة قبل أن يتبدّد. استعارة وظيفية من مبدأ العابر المؤقت الذي
        يُميّز الانطباعيين عن أصحاب الأساليب الأكاديمية.


# ── المرحلة ٢: جمع الأدلة (استعلامات قاعدة البيانات) ──
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية: انطباعي، الانطباعي، فنان انطباعي، الفنان الانطباعي، طابعي، لحظي، انطباعية
#   Q2 — إثراء بالمعرّف (entry_ids: 694420, 694421, 59825, 498261, 395601)
#   Q3 — الجسر الإنجليزي: impressionist / impressionism / impressionistic
#   Q4 — FTS عربي: انطباعي، الانطباعيون، انطباعية
#   Q5 — مقاييس اللغة لابن فارس: جذر طبع (dictionary_id=151)

stage2_evidence:
  per_lemma:
    - lemma: "انطباعي"
      confirm:
        - text: "«(1) الانطباعيّ: القائل بالانطباعية (2) انطباعيّ.»"
          source: "المورد الحديث (2008) — ترجمة impressionist"
      expands:
        - text: "«(E) Impressionism: حَرَكَة حديثة في الفنِّ والأدب، نشأت في فرنسا في أواخر القرن التاسع عشر، تعتمد على نقل انطباعات الفنَّان ورؤيته إلى الْمُتَلَقِّي.»"
          source: "المعجم الكبير (ocr، حديث)"
          addition: "يوثّق الانطباعية كحركة فنية راسخة وأن 'انطباعي' هي النسبة المعيارية إليها في المعاجم العربية الكبرى"
        - text: "«نزعة فنّية (ق 19) رد فعل ضد الطبيعية والرمزية، تُعبر عن المدرك الحِسّي (نقداً / إبداعاً).»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — arabterm"
          addition: "يُثبت المصطلح في المعاجم المتخصصة ويُؤكد جذوره الاشتقاقية من طبع/انطباع"

    - lemma: "فنان انطباعي"
      expands:
        - text: "«(1) الانطباعيّ: القائل بالانطباعية (2) انطباعيّ.»"
          source: "المورد الحديث (2008)"
          addition: "يُشير إلى أن 'الانطباعي' وحده يحمل معنى الفنان صاحب المذهب دون الحاجة إلى إضافة 'فنان'، مما يُضعف استقلالية المركب"

    - lemma: "الطَّابِعِيُّ"
      evidence_status: "no_material_found"

    - lemma: "اللَّحْظِيُّ"
      contradicts:
        - text: "«لَحْظِيُّ: instantaneous, adj»"
          source: "موسوعة الكهرباء IEC 60050 — arabterm"
          conflict: "المصطلح 'لحظي' راسخ في المعاجم التقنية والطبية بمعنى آني/فوري Instantaneous وليس نسبةً إلى الانطباعية الفنية؛ استخدامه بالمعنى الفني يُوقع في اشتراك لفظي"
        - text: "«لَحْظِيّ: momentary»"
          source: "المعجم الطبي الموحد (2009) — arabterm"
          conflict: "تأكيد على رسوخ المعنى الزمني لـ'لحظي'، والمعنى الفني الانطباعي المُقترح غير موثّق في أي مصدر معجمي"


# ── المرحلة ٣: التحليل اللغوي للّمات ──

stage3_analysis:
  per_lemma:
    - lemma: "انطباعي"
      decision: confirmed
      decision_reason: >
        اللمّة مدعومة معجمياً: المورد الحديث 2008 يُثبت 'الانطباعيّ: القائل
        بالانطباعية' كترجمة مباشرة لـ'impressionist'. مشتقة من جذر (طبع) العربي
        الأصيل على صيغة النسب، وتجتاز معايير بوابة الجودة الستة: الاطّراد
        (تُقاس على رومانسي/واقعي/تجريدي)، يُسر التداول، الملاءمة الدلالية،
        الأصالة الاشتقاقية. تستخدم اسماً وصفةً مما يزيد مرونتها. تحتاج تشكيلاً
        كاملاً في القاعدة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصيغة الاسمية الأكثر إيجازاً وترسُّخاً في المعاجم العربية المعيارية؛
        تحمل في طيّاتها البُعدَين: الانتساب المذهبي (القائل بالانطباعية) والوصف
        الأسلوبي (عمل انطباعي). اللمّة الوحيدة المُؤكَّدة في المجموعة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "انطِبَاعِيٌّ"

    - lemma: "فنان انطباعي"
      decision: removed
      decision_reason: >
        يفشل اختبار السكّ الاصطلاحي: إبدال 'فنان' بـ'رسام' أو 'موسيقار' أو 'ناقد'
        يُنتج تعبيرات وصفية صحيحة ('رسام انطباعي'، 'موسيقار انطباعي')، مما يكشف
        أنه تعبير وصفي حر لا وحدة اصطلاحية مسكوكة. علاوةً على ذلك، 'الانطباعي'
        وحده يحمل معنى الفاعل الإنساني (القائل بالانطباعية) كما أثبتت المعاجم
        المعيارية، فلا حاجة للتصريح بـ'فنان'.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "الطَّابِعِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على استخدام 'الطابعي' بمعنى الانطباعي الفني. فضلاً
        عن ذلك، النسبة إلى 'الطابع' قد تُحيل ذهنياً إلى 'الطباعة' (printing)
        مُوقِعةً في التباس دلالي. رغم وجاهة الفكرة المجازية، فإن المصطلح غير
        موثّق ولم يرسخ في الاستعمال.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "اللَّحْظِيُّ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة المعجمية تُناقض هذا الاستخدام: 'لحظي' راسخ بمعنى instantaneous/
        momentary في المعاجم التقنية والطبية. استخدامه بالمعنى الفني الانطباعي
        يُوقع في اشتراك لفظي مُربك. المصطلح لم يتضمّن في أي مصدر معجمي
        دلالةً فنية.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


