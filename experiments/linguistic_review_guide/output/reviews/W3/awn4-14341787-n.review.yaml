# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14341787-n
# tumidity / tumidness — تورم طفيف لعضو أو جزء
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان «انتفاخ» و«تضخم» هما نفس لمّات المجموعة الأم (awn4-14338619-n)، مما يُفقد التمييز بين العام والخاص"
      - "«تضخم» يُستعمل غالباً للدلالة على زيادة حجم الخلايا (hypertrophy) أو التضخم الاقتصادي (inflation)، وليس للتورم الطفيف"
      - "التعريف العربي «تورم طفيف لعضو أو جزء» يستخدم كلمة «تورم» وهي أدق من «انتفاخ» و«تضخم» للدلالة الطبية"
      - "اللمّتان بدون تشكيل"
    observations: "المفهوم المستهدف هو حالة طبية تصف تورماً خفيفاً (tumidity) في عضو أو جزء من الجسم. هذا المفهوم يندرج تحت المفهوم الأعم «بروز غير طبيعي أو تضخم موضعي» (swelling). التعريف الإنجليزي slight swelling يقتضي لفظاً يحمل معنى الخفة أو الطفافة في التورم، وهو ما لا تحمله اللمّتان الحاليتان اللتان تدلّان على الانتفاخ والتضخم بإطلاق."
  blind_candidates:
    - lemma: "تَوَرُّم"
      generation_method: ishtiqaq
      justification: "مصدر تَوَرَّمَ على وزن تَفَعُّل، وهو الأقرب دلالةً إلى tumidity إذ يدل على حدوث الورم في العضو. ورد في المعجم الوسيط: تَوَرَّمَ: انتفخ."
    - lemma: "نُفَاخ"
      generation_method: ishtiqaq
      justification: "على وزن فُعَال الدال على الأمراض والعلل، من الجذر ن-ف-خ. ورد في المعاجم بمعنى الورم من داء."
    - lemma: "وَرَم"
      generation_method: ishtiqaq
      justification: "اسم من الجذر و-ر-م يدل على انتفار اللحم وبروزه. مصطلح طبي أصيل، لكنه عام وقد يتداخل مع tumor."
    - lemma: "تَوَذُّم"
      generation_method: ishtiqaq
      justification: "مصدر مُحتمل من وَذَمَ على وزن تَفَعُّل، بمعنى حدوث الوذمة (oedema). مصطلح قليل الاستعمال."

stage2_evidence:
  per_lemma:
    - lemma: "اِنْتِفَاخ"
      confirm:
        - text: "«حالة من التضخم أو التوسع أو الانتفاخ»"
          source: "معجم المصطلحات الطبية (ج.2، 2003) — ترجمة distention"
        - text: "«انتفاخ = swelling»"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989)"
        - text: "«انتفاخ = turgidity»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      expands:
        - text: "«انتفاخ = turgescence»"
          source: "المعجم الموحد لمصطلحات الجيولوجيا (2000)"
          addition: "يُستعمل انتفاخ أيضاً في المجالات غير الطبية كالجيولوجيا والفيزياء"
        - text: "«انْتِفَاخ، تَوَرُّم = swelling»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "يقرن المصطلح بالتورم كمرادف"

    - lemma: "تَضَخُّم"
      contradicts:
        - text: "«(في الطب) زيادةٌ في حجم عضو, أو نسيج؛ بسبب زيادة حجم الخلايا فيه, دون ازدياد ملحوظ في عددها»"
          source: "المعجم الكبير"
          conflict: "التضخم في الطب يعني enlargement/hypertrophy وهو زيادة في حجم الخلايا لا تورم طفيف"
        - text: "«(التضخم) (فِي الاقتصاد) زِيَادَة النُّقُود أَو وَسَائِل الدّفع الْأُخْرَى على حَاجَة الْمُعَامَلَات»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الاقتصادية (inflation) هي الأشيع لتضخم، مما يُسبب التباساً"
      expands:
        - text: "«تَضَخُّم = swelling»"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
          addition: "في مجال النقل يُستعمل تضخم بمعنى swelling لكن المرجع الطبي يميّزه"
        - text: "«تضخُّم: زيادة الحجم نتيجة دخول وامتصاص الماء — انتفاخ (المرادف العربي)»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "في سياق الهندسة المدنية فقط"

    - lemma: "تَوَرُّم"
      confirm:
        - text: "«تَوَرَّمَ: انتفخ»"
          source: "المعجم الوسيط"
        - text: "«تَوَرُّم = swelling»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«(1) تَوَرُّم؛ انتفاخ (2) الطَّنّانيّة: صفةُ الأسلوب الطّنّان — tumidity»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التورُّم الصِّمْغِىّ (فى الطب): تورُّم يظهر فى الدَّور الثالث من أدوار الزُّهرِىّ الوراثىّ»"
          source: "المعجم الوسيط"
          addition: "للتورم استعمالات طبية متخصصة تدل على أنه مصطلح طبي مسكوك"

    - lemma: "نُفَاخ"
      contradicts:
        - text: "«(النفاخ) الورم من دَاء يَأْخُذ حَيْثُ أَخذ»"
          source: "المعجم الوسيط"
          conflict: "النفاخ في المعاجم ورم من داء بإطلاق وليس تورماً طفيفاً، وترجمته الطبية emphysema وهي حالة مختلفة تماماً"
        - text: "«نُفَاخ = emphysema»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "النفاخ مصطلح مسكوك لمرض النفاخ الرئوي (emphysema) لا للتورم الطفيف"

    - lemma: "وَرَم"
      expands:
        - text: "«الْوَاوُ وَالرَّاءُ وَالْمِيمُ: كَلِمَةٌ وَاحِدَةٌ، هِيَ الْوَرَمُ، أَنْ يَنْفِرَ اللَّحْمُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الوَرَم مصطلح عام للانتفار، ويُستعمل حديثاً أيضاً بمعنى tumor"

    - lemma: "تَوَذُّم"
      evidence_status: "no_material_found"

    - lemma: "تُوَيْرِم"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "اِنْتِفَاخ"
      decision: confirmed
      decision_reason: "انتفاخ مصدر انتفخ، يدل على حالة الامتلاء بالهواء أو السائل. مؤيَّد بأدلة معجمية متعددة كترجمة لـ swelling وturgidity. لكنه عام ولا يختص بالتورم الطفيف. يُبقى لأنه الأقرب إلى المعنى العام مع الأم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على الامتلاء والعلو من الداخل بفعل هواء أو سائل، ويُستعمل في السياقات العلمية العامة (فيزياء، جيولوجيا، أحياء) أكثر من السياق الطبي المحض"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْتِفَاخ"

    - lemma: "تَضَخُّم"
      decision: removed
      decision_reason: "«تضخم» دلالته الطبية المسكوكة هي hypertrophy/enlargement (زيادة حجم الخلايا) لا slight swelling. كما أن دلالته الاقتصادية (inflation) هي الأشيع. وجوده في هذه المجموعة ومجموعة الأم معاً يُفقد التمييز. الأدلة المعجمية تناقض استعماله بمعنى التورم الطفيف."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَوَرُّم"
      source: stage1
      decision: confirmed
      decision_reason: "تَوَرُّم هو الترجمة المباشرة لـ tumidity في المورد الحديث. ورد في المعجم الوسيط والمعجم الطبي الموحد كمصطلح طبي مسكوك بمعنى swelling. وهو أدق من «انتفاخ» للسياق الطبي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختص بالسياق الطبي والتشريحي، ويدل على نفور اللحم وبروزه بسبب مرضي، بخلاف «انتفاخ» الذي يشمل الامتلاء بالهواء والسوائل عموماً"
      actions:
        - command: create_entry
          params:
            lemma: "تَوَرُّم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "نُفَاخ"
      source: stage1
      decision: removed
      decision_reason: "النُّفَاخ مصطلح مسكوك لمرض النفاخ الرئوي (emphysema) في المعجم الطبي الموحد، وهو حالة مختلفة تماماً عن التورم الطفيف. استعماله هنا يُحدث التباساً طبياً خطيراً."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "وَرَم"
      source: stage1
      decision: removed
      decision_reason: "الوَرَم في الاستعمال الطبي الحديث يُقابل tumor (الورم الحميد أو الخبيث) لا swelling. استعماله هنا يُحدث تداخلاً مع المفهوم الأورامي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَوَذُّم"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أي شواهد معجمية لهذا اللفظ. «وَذَمة» (oedema) مسكوكة لكن «تَوَذُّم» كمصدر غير مُثبت في المعاجم."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

