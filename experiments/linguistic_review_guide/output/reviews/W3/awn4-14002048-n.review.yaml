# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14002048-n
# storm center / storm centre — مركز العاصفة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «مركز العاصفة» ترجمة حرفية (calque) للتعبير الإنجليزي storm center"
      - "المجموعة تحتوي على لمّة واحدة فقط، وهي مركّب إضافي مترجَم"
      - "المفهوم مجازي (مركز المشاكل) لا حرفي (مركز الإعصار)، والتعبير العربي قد لا يوصل المجاز بوضوح"
    observations: >
      المجموعة تمثّل الاستعمال المجازي لـ«مركز العاصفة» بمعنى البؤرة التي تتركّز فيها المشاكل والاضطرابات،
      لا المعنى الحرفي الجوّي. التعريف العربي واضح ومقتضب. الرابط بالمجموعة الأعلى (اضطراب/قلاقل/هيجان)
      يؤكد أن المفهوم ينتمي إلى حقل الاضطرابات المعنوية لا الجوية. في العربية المعاصرة تُستخدم تعبيرات
      مثل «بؤرة التوتر» و«بؤرة الأزمة» أكثر من «مركز العاصفة» للدلالة على هذا المفهوم.
  blind_candidates:
    - lemma: "بُؤْرَة"
      generation_method: majaz
      justification: >
        البؤرة في أصلها الحفرة التي توقد فيها النار، ثم توسّعت مجازياً إلى نقطة التقاء الأشعة (الفيزياء)،
        ثم إلى مركز الاهتمام أو التوتر. يُقال «بؤرة التوتر» و«بؤرة الصراع» في الإعلام العربي المعاصر.
        المجاز قائم على الإزاحة من مركز الاشتعال الحسّي إلى مركز الاضطراب المعنوي.
    - lemma: "مَعْمَعَة"
      generation_method: majaz
      justification: >
        المعمعة أصلها صوت الحريق في القصب، ثم استُعملت لصوت الشجعان في الحرب ولشدّة القتال.
        فيها دلالة على مركز الاضطراب والفوضى، لكنها تدلّ على الاضطراب نفسه أكثر من مركزه.
    - lemma: "مُسْتَوْقَد"
      generation_method: ishtiqaq
      justification: >
        من الجذر «وقد» (اشتعال النار) على وزن مُسْتَفْعَل (اسم مكان)، أي موضع اشتعال النار.
        يصلح مجازاً لموضع اشتعال الفتن والاضطرابات. لكنه غير مسكوك في هذا المعنى المجازي.
    - lemma: "مَرْتَع"
      generation_method: majaz
      justification: >
        المرتع أصلاً موضع رعي الماشية في الخصب، ثم استُعمل مجازاً للدلالة على الموضع الذي
        ينمو فيه الشرّ ويتطوّر، كما في المورد الحديث: «محيط ملائم لنموّ شيء أو تطوّره بسرعة».
        يقابل الإنجليزية hotbed أكثر من storm center.

stage2_evidence:
  per_lemma:
    - lemma: "مَرْكَزُ العَاصِفَة"
      confirm:
        - text: "«(1) مَرْكز العاصفة (2) مركز الاضطراب.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«المَقَرُّ الثَّابِتُ الذى تَتَشَعَّبُ منه الفروع»"
          source: "المعجم الوسيط"
          addition: "دلالة «المركز» على المَقَرّ الذي تتفرّع منه الأمور تدعم الاستعمال المجازي"
        - text: "«الرَّاءُ وَالْكَافُ وَالزَّاءُ أَصْلَانِ: أَحَدُهُمَا إِثْبَاتُ شَيْءٍ فِي شَيْءٍ يَذْهَبُ سُفْلًا... وَمَرْكَزُ الْجُنْدِ: الْمَوْضِعُ الَّذِي أُلْزِمُوهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل في المركز: موضع الثبات، ومنه مركز الجند"
    - lemma: "بُؤْرَة"
      confirm:
        - text: "«الحفرة توقد فيها النار... (فى علم الطبيعة): نقطة تتلاقى أو تفترق عندها الأشعَّة الضوئِيَّة أو الحرارية أو الصوتية»"
          source: "المعجم الوسيط"
        - text: "«بؤرة الكلام، الجديدُ فيه المُستَرعي للانتباه.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«الحفرة يُطْبَخُ فيها, وقيل: هي موقد النار»"
          source: "المعجم الكبير"
          addition: "الأصل الحسّي (موقد النار) يدعم المجاز إلى مركز الاشتعال المعنوي"
    - lemma: "مَعْمَعَة"
      confirm:
        - text: "«صوتُ الحريق في القصب ونحوه. صوتُ الشُّجعان في الحرب. شدَّةُ الحرّ.»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«صَوت الْحَرِيق فِي الْقصب وَنَحْوه... وَشدَّة الْحَرْب»"
          source: "المعجم الوسيط (هورماني)"
          conflict: "المعمعة تدلّ على الاضطراب والشدّة ذاتها لا على مركزها أو بؤرتها"
    - lemma: "مُسْتَوْقَد"
      confirm:
        - text: "«موضعُ إشعال النار»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«(المستوقد) مَوضِع اشتعال النَّار (ج) مواقد»"
          source: "المعجم الوسيط (هورماني)"
          conflict: "الاستعمال محصور في المعنى الحسّي (موضع النار) ولم يُسجَّل توسّع مجازي إلى مركز الاضطراب"
    - lemma: "مَرْتَع"
      confirm:
        - text: "«المَرْتَع: موضعٌ أو محيط ملائمٌ لنموّ شيء أو تطوّره بسرعة hotbed of crime.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«الموضع ترتع فيه الماشية»"
          source: "المعجم الوسيط"
          conflict: "المرتع يقابل hotbed (حاضنة) لا storm center (بؤرة)؛ فالمرتع يركّز على بيئة النموّ لا على مركز الاضطراب"

stage3_analysis:
  per_lemma:
    - lemma: "مَرْكَزُ العَاصِفَة"
      decision: confirmed
      decision_reason: >
        التعبير مسجَّل في المورد الحديث مقابلاً لـ storm center، وهو مركّب إضافي ثابت في الاستعمال الإعلامي
        العربي المعاصر. رغم كونه ترجمة حرفية (calque) فإن التركيب مفهوم ومتداول.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      borrowing_check:
        type: calque
        assessment: >
          مركّب مترجَم حرفياً عن الإنجليزية storm center. التركيب الإضافي سليم صرفياً
          والمكوّنان عربيان صِرفان، فهو اقتراض مفهومي مقبول.
      nuance_differentiation: >
        يحمل الصورة المجازية للعاصفة بوصفها رمزاً للاضطراب والفوضى، ويركّز على البُعد المكاني
        (المركز) الذي تتولّد منه المشكلات.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَرْكَزُ العَاصِفَة"

    - lemma: "بُؤْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        بؤرة بمفردها تدلّ على «نقطة التركيز» بمعنى عام (فيزيائي ولساني وطبّي)، ولا تختصّ بمركز
        المشاكل أو الاضطرابات. الاستعمال المعاصر «بؤرة التوتر» و«بؤرة الصراع» هو مركّب إضافي
        آخر ينتمي إلى مجموعات ترادفية مختلفة. إضافة بؤرة وحدها سيوسّع المجموعة بلا مسوّغ.

    - lemma: "مَعْمَعَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعمعة تدلّ على شدّة الحرب والاضطراب ذاته، لا على مركزه أو بؤرته. فهي أقرب إلى
        مفهوم «الهرج» أو «المعركة» منها إلى «مركز المشاكل». لا تستوفي شرط الملاءمة الدلالية.

    - lemma: "مُسْتَوْقَد"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُسجَّل في المعاجم أيّ استعمال مجازي لـ«مستوقد» بمعنى مركز الاضطرابات. الاستعمال
        محصور في المعنى الحسّي (موضع إشعال النار). اختلاقُ مجاز غير مسكوك لا يخدم الشبكة.

    - lemma: "مَرْتَع"
      source: stage1
      decision: removed
      decision_reason: >
        المرتع يقابل مفهوم hotbed (حاضنة/بيئة خصبة) لا storm center (مركز الاضطراب).
        دلالته على بيئة نموّ الشرّ تختلف عن دلالة مركز تولُّد المشاكل. ينتمي إلى مجموعة ترادفية أخرى.

