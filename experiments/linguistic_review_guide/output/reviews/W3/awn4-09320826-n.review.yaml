stage1_review:
  assessment:
    concerns:
      - اللمّة الحالية تفتقر إلى التشكيل الكامل.
      - غياب الاسم المجرد للخليج (كاربنتاريا) كمرادف مستقل كما في الإنجليزية.
    observations: "الاسم هو علم جغرافي أجنبي (أسترالي)، لذا فالتعامل معه يتم عبر التعريب اللفظي (Transliteration) مع الالتزام بصيغة التركيب الإضافي (خليج + الاسم)."
  blind_candidates:
    - lemma: "خَلِيجُ كَارْبِنْتَارِيَا"
      generation_method: tarkib
      justification: "الاسم العربي القياسي للخليج المذكور في التعريف، مكوّن من مضاف (خليج) ومضاف إليه أعجمي معرّب."
    - lemma: "خَلِيجُ كَارْبَنْتَارِيَا"
      generation_method: tarkib
      justification: "تنويع صوتي في تعريب حرف العلة الثاني (e) في الاسم الأجنبي."
    - lemma: "كَارْبِنْتَارِيَا"
      generation_method: taarib
      justification: "الاسم العلم المجرد للخليج، يُستخدم أحياناً وحده للدلالة على المنطقة أو الخليج مجازاً."
    - lemma: "خَلِيجُ قَارْبِنْتَارِيَا"
      generation_method: taarib
      justification: "تعريب قديم أو بديل باستخدام القاف بدلاً من الكاف لتمثيل حرف (C/K)."

stage2_evidence:
  per_lemma:
    - lemma: "خليج كاربنتاريا"
      evidence_status: "no_material_found"
    - lemma: "أستراليا"
      confirm:
        - text: "«أصغر القارَّات وهي بين المحيطين الهندي والهادي...»"
          source: "المعجم الوسيط"
    - lemma: "خَلِيج"
      confirm:
        - text: "«وَهُوَ مَاءٌ يَمِيلُ مَيْلَةً عَنْ مُعْظَمِ الْمَاءِ فَيَسْتَقِرُّ. وَخَلِيجَا النَّهْرِ أَوِ الْبَحْرِ: جَنَاحَاهُ.»"
          source: "مقاييس اللغة"

stage3_analysis:
  per_lemma:
    - lemma: "خليج كاربنتاريا"
      decision: confirmed
      decision_reason: "الاسم العربي الشائع والمعتمد جغرافياً لهذا الخليج، وهو تعريب صوتي دقيق لـ (Gulf of Carpentaria)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ كَارْبِنْتَارِيَا"
    - lemma: "كَارْبِنْتَارِيَا"
      source: stage1
      decision: confirmed
      decision_reason: "الاسم العلم المجرد، يُستخدم في السياقات الجغرافية والمراجع كاسم للمنطقة والخليج بحد ذاته."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "كَارْبِنْتَارِيَا"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09320826-n"

stage4_content:
  definition:
    current: "خليج ضحل واسع في بحر آرافورا في شمال أستراليا"
    assessment:
      decision: retain
      reason: "التعريف دقيق علمياً وجغرافياً ويحدد الموقع والخصائص الأساسية (ضحل، واسع)."
  examples:
    per_lemma:
      - lemma: "خَلِيجُ كَارْبِنْتَارِيَا"
        examples:
          - text: "يتميز خَلِيجُ كَارْبِنْتَارِيَا بضحالة مياهه وتنوع بيئته البحرية، ويقع في الجزء الشمالي من القارة الأسترالية."
            type: usage

