          - text: >
              أسَّس تشارلز فُولِن مَكِيم مع شريكَيْه مكتبًا معماريًّا تركَ بصمةً راسخة
              على ملامح المدن الأمريكية الكبرى في نهاية القرن التاسع عشر.
            type: usage
      - lemma: "مَكِيم"
        examples:
          - text: >
              يُعدُّ مَكِيم من أبرز مَن أحيَوا روحَ العمارة الكلاسيكية الجديدة في
              القارة الأمريكية، إذ مزج بين الموروث الروماني والإغريقي ومتطلبات
              العصر الحديث.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أسَّس تشارلز فُولِن مَكِيم مع شريكَيْه مكتبًا معماريًّا تركَ بصمةً راسخة على ملامح المدن الأمريكية الكبرى في نهاية القرن التاسع عشر."
      - command: add_sense_example
        params:
