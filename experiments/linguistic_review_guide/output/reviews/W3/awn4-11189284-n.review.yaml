      evidence_status: "no_material_found"

    - lemma: "مكيم"
      evidence_status: "no_material_found"

    - lemma: "مَكِيم"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "تشارلز مَكِيم"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "تشارلز فُولِن مَكِيم"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "فُولِن مَكِيم"
