# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset: awn4-11189284-n  |  ili: i96187
# pos: n  |  definition_en: United States neoclassical architect (1847-1909)
# reviewed: 2026-03-21
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تشارلز فولين مكيم» تفتقر إلى التشكيل الكامل."
      - "اللمّة «مكيم» تفتقر إلى التشكيل الكامل."
      - "نقحرة «فولين» غير دقيقة؛ الاسم الإنجليزي Follen مقطعان (fol-len)، والأصحّ «فُولِن» بدون ياء مدٍّ."
      - "التعريف «معماري كلاسيكي حديث» ترجمة حرفية مبهمة لـneoclassical؛ الأدق «الطّراز الكلاسيكيّ الجديد» أو «النيوكلاسيكي»."
      - "التعريف لا يُشير إلى أبرز منجزات المعماري ولا إلى شراكته الشهيرة."
    observations: >
      هذه مجموعة ترادفية تمثّل اسم علم شخصي لمعماري أمريكي بارز هو تشارلز فولن مكيم (1847-1909)،
      أحد مؤسِّسي مكتب «مكيم وميد وهوايت» (McKim, Mead & White) الشهير الذي أسَّس طراز الكلاسيكية الجديدة
      في العمارة الأمريكية خلال العصر الذهبي. اللمّتان هما نقحرة الاسم الثلاثي الكامل
      واللقب المنفرد. المجموعة من نوع الأعلام الشخصية (proper_noun)، وتوليد المرشحات عمياءً محدودُ الجدوى
      للأسماء الأعجمية إذ لا يمكن الانطلاق من التعريف وحده لاستنتاج النقحرة الصحيحة.
      مع ذلك تُجرى المحاولة استكمالاً للمنهجية.

  blind_candidates:
    - lemma: "مَكِيم"
      generation_method: taarib
      justification: >
        نقحرة مختصرة لما قد يكون اللقبَ الإنجليزيَّ للمعماري؛ صوت /mə'kɪm/ يُنقحر طبيعيًّا
        إلى «مَكِيم» بوصله مع التشكيل.
    - lemma: "تشارلز مَكِيم"
      generation_method: taarib
      justification: >
        مركّب إضافي نقحرة لأول اسمَيْن (الاسم الأول + اللقب)، وهو شكل شائع للإشارة إلى
        الأعلام الأمريكية في المصادر العربية.
    - lemma: "تشارلز فُولِن مَكِيم"
      generation_method: taarib
      justification: >
        الاسم الثلاثي الكامل Charles Follen McKim بنقحرة كاملة؛ «فُولِن» أدق من «فولين»
        لأن Follen ينتهي بـ/ɪn/ قصيرة لا بمدٍّ.
    - lemma: "فُولِن مَكِيم"
      generation_method: taarib
      justification: >
        مركّب يجمع الاسم الأوسط واللقب، أقلُّ شيوعًا لكن قد يرد في بعض المراجع الأكاديمية
        كنقحرة ثنائية للتمييز عن أشخاص آخرين يحملون اسم تشارلز.


