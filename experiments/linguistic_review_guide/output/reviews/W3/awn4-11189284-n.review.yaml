# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────
    - lemma: "تشارلز فولين مكيم"
      decision: confirmed
      decision_reason: >
        الاسم الثلاثي الكامل للشخصية، موثَّقٌ في المصادر الموسوعية العربية وهو الصيغة
        الرسمية المعتمدة للإحالة إلى هذا المعماري. يحتاج تصحيح نقحرة «فولين» إلى «فُولِن»
        وإضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يورد الاسمَ بكامله (الاسم الأول + الأوسط + اللقب)، ويُستخدم في السياقات
        الأكاديمية والتوثيقية الرسمية حيث يُشترط التمييز الكامل عن أشخاص آخرين.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تشارلز فُولِن مَكِيم"

    - lemma: "مكيم"
      decision: confirmed
      decision_reason: >
        اللقب المنفرد هو الصيغة المختصرة الشائعة في الكتابة غير الرسمية والأدلة المعمارية
        والنقد الفني. يحتاج إضافة التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يورد اللقبَ فحسب، ويُستخدم في سياقات الإشارة الموجزة والنقد المعماري غير الرسمي
        حيث يُفترض أن القارئ يعرف المقصود، أو حين يظهر ضمن قائمة أعمال مصنَّفة بالألقاب.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَكِيم"

    # ── مرشحات المرحلة ١ ─────────────────────────────────────
    - lemma: "مَكِيم"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة «مكيم» بعد تصحيح التشكيل؛ لا حاجة لإنشاء مدخل جديد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تشارلز مَكِيم"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة ثنائية (الاسم الأول + اللقب) غير موثَّقة بوصفها تعبيرًا ثابتًا مفضَّلًا
        في المصادر العربية؛ المجموعة مغطاة بالكامل باللمّتين الموجودتين.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "تشارلز فُولِن مَكِيم"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق جوهريًّا مع اللمّة الموجودة «تشارلز فولين مكيم» بعد تصحيح النقحرة؛
        الإجراء المناسب هو update_lemma على المدخل الموجود لا إنشاء مدخل جديد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "فُولِن مَكِيم"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة ثنائية (الأوسط + اللقب) نادرة الاستعمال في المصادر العربية وغير مسكوكة
        كوحدة معجمية ثابتة؛ لا تضيف قيمة إلى المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري كلاسيكي حديث أمريكي (1847-1909)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقتضَب ومبهم: «كلاسيكي حديث» ترجمة حرفية غير اصطلاحية لـneoclassical،
        والمصطلح الأدق هو «الطّراز الكلاسيكيّ الجديد». فضلاً عن ذلك، التعريف لا يُشير
        إلى أبرز ما عُرف به المعماري (شراكة مكيم وميد وهوايت وتأثيره في العمارة الأمريكية).
    authored:
      - type: encyclopedic
        text: >
          مُعَمَارِيٌّ أمريكيٌّ (1847-1909)، رائدٌ في الطّرَاز الكلاسيكيِّ الجديد،
          أحد مؤسِّسي مكتب «مكيم وميد وهوايت» المعماريِّ الشهير الذي كان من أكثر
          المكاتب المعمارية تأثيرًا في الولايات المتحدة في نهاية القرن التاسع عشر
          ومطلع القرن العشرين.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11189284-n"
          definition_index: 0
          text: "مُعَمَارِيٌّ أمريكيٌّ (1847-1909)، رائدٌ في الطّرَاز الكلاسيكيِّ الجديد، أحد مؤسِّسي مكتب «مكيم وميد وهوايت» المعماريِّ الشهير."

  examples:
