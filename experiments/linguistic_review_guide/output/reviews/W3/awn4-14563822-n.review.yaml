# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-14563822-n (collective security / أمن جماعي)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «أمن جماعي» بدون تشكيل — يجب إضافة التشكيل الكامل"
      - "المجموعة تحتوي لمّة واحدة فقط، والمفهوم مصطلح سياسي حديث راسخ قد لا يتطلب مرادفات كثيرة"
      - "التعريف العربي «نظام للسلام الدولي» مختصر جداً ولا يميّز المفهوم عن غيره من أنظمة السلام"
    observations: >-
      المفهوم ينتمي إلى حقل العلاقات الدولية والقانون الدولي، وهو مبدأ يقوم على أن
      أمن كل دولة مرتبط بأمن الدول الأخرى، بحيث يُعدّ أي عدوان على دولة عدواناً على
      الجميع. الفوقيّ المباشر هو «سلام/سلم» وهو مناسب. المصطلح مستقرّ في الأدبيات
      العربية السياسية منذ إنشاء عصبة الأمم والأمم المتحدة.
  blind_candidates:
    - lemma: "تَآمُنٌ دُوَلِيّ"
      generation_method: tarkib
      justification: >-
        مركب وصفي من «تآمن» (تفاعل من أمن: الأمن المتبادل) و«دولي»، يعبّر عن
        مفهوم الأمن المشترك بين الدول بصيغة تفاعلية تدلّ على التشارك
    - lemma: "تَكَافُلٌ أَمْنِيّ"
      generation_method: tarkib
      justification: >-
        مركب وصفي من «تكافل» (تفاعل من كفل: الكفالة المتبادلة) و«أمني»، يعبّر عن
        مفهوم الضمان الأمني الجماعي حيث تتكافل الدول في حماية بعضها
    - lemma: "حِلْفُ سَلامٍ"
      generation_method: tarkib
      justification: >-
        مركب إضافي من «حلف» (عهد وميثاق) و«سلام»، يصف نظاماً تعاهدياً للسلام
        بين الدول، مستفيداً من الدلالة العربية الأصيلة للحلف
    - lemma: "أَمْنٌ تَضَامُنِيّ"
      generation_method: tarkib
      justification: >-
        مركب وصفي من «أمن» و«تضامني» (نسبة إلى تضامن)، يعبّر عن الأمن القائم
        على التضامن بين الدول

stage2_evidence:
  per_lemma:
    - lemma: "أَمْنٌ جَمَاعِيّ"
      expands:
        - text: "«الأَمْن: طمأنينة النّفس وزوال الخوف عنها»"
          source: "المعجم الكبير"
          addition: "الدلالة الأصلية لـ«أمن»: طمأنينة النفس وانتفاء الخوف"
        - text: "«الأمن: عدم توقع مكروه في الزمن الآتي، وأصله طمأنينة النفس وزوال الخوف»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف اصطلاحي كلاسيكي يؤكد البُعد الاستقبالي للأمن"
        - text: "«(أَمَنَ) الْهَمْزَةُ وَالْمِيمُ وَالنُّونُ أَصْلَانِ مُتَقَارِبَانِ: أَحَدُهُمَا الْأَمَانَةُ الَّتِي هِيَ ضِدُّ الْخِيَانَةِ، وَمَعْنَاهَا سُكُونُ الْقَلْبِ، وَالْآخَرُ التَّصْدِيقُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر أمن يدور حول سكون القلب والأمانة — أساس دلالي صالح للأمن الجماعي"
        - text: "«(جَمَعَ) الْجِيمُ وَالْمِيمُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، يَدُلُّ عَلَى تَضَامِّ الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر جمع يدلّ على التضامّ والاجتماع — أساس «جماعي» في المركب"
    - lemma: "تَآمُنٌ دُوَلِيّ"
      evidence_status: "no_material_found"
    - lemma: "تَكَافُلٌ أَمْنِيّ"
      evidence_status: "no_material_found"
    - lemma: "حِلْفُ سَلامٍ"
      evidence_status: "no_material_found"
    - lemma: "أَمْنٌ تَضَامُنِيّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "أَمْنٌ جَمَاعِيّ"
      decision: confirmed
      decision_reason: >-
        مصطلح سياسي راسخ ومستقرّ في الأدبيات العربية منذ عقود، يُستخدم في وثائق
        الأمم المتحدة وميثاقها (الفصل السابع)، وفي كتابات العلاقات الدولية والقانون
        الدولي العربية. لا يوجد بديل أفصح أو أدقّ منه. المركب الوصفي واضح الدلالة:
        أمنٌ منسوب إلى الجماعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَمْنٌ جَمَاعِيّ"

    - lemma: "تَآمُنٌ دُوَلِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        صيغة مولّدة غير مستعملة ولا مسجّلة في أي معجم. وزن «تفاعُل» من أمن ليس
        مسموعاً في هذا السياق، و«دولي» يضيّق المفهوم أكثر من اللازم مقارنة بـ«جماعي».

    - lemma: "تَكَافُلٌ أَمْنِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        التكافل الأمني مفهوم أوسع وأعمّ من الأمن الجماعي؛ فالتكافل قد يشمل
        ترتيبات ثنائية أو إقليمية غير مؤسسية، بينما الأمن الجماعي نظام مؤسسي
        متعدد الأطراف. لا يصلح مرادفاً دقيقاً.

    - lemma: "حِلْفُ سَلامٍ"
      source: stage1
      decision: removed
      decision_reason: >-
        الحلف يدلّ على اتفاق عسكري بين أطراف محددة (كحلف الناتو)، وهو مفهوم
        مختلف عن الأمن الجماعي الذي يقوم على منظومة شاملة لا تستهدف طرفاً بعينه.
        الخلط بينهما خطأ مفهومي.

    - lemma: "أَمْنٌ تَضَامُنِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        مركب غير مستعمل ولا مسجّل. «تضامني» يركّز على بُعد التضامن الاختياري
        بينما «جماعي» يركّز على الطابع الشامل للمنظومة. المصطلح المستقرّ
        هو «أمن جماعي» ولا حاجة لبديل.

stage4_content:
  definition:
    current: "نظام للسلام الدولي"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مختصر جداً ولا يميّز الأمن الجماعي عن مفاهيم أخرى كحفظ
        السلام أو نزع السلاح. يفتقر إلى الجنس القريب والفصل النوعي.
    authored:
      - type: terminological
        text: >-
          مبدأٌ في القانون الدولي يقوم على التزام مجموعة من الدول بالتصدّي
          جماعيّاً لأيّ عدوان يقع على أيّ دولة منها، بحيث يُعَدّ الاعتداء
          على إحداها اعتداءً على الجميع.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          نظامٌ دوليّ لحفظ السلام يقوم على مبدأ أنّ أمن كلّ دولة جزءٌ لا
          يتجزّأ من أمن المجتمع الدولي بأسره، فإذا وقع عدوان على دولة ما
          تكاتفت سائر الدول لردعه. وقد تجسّد هذا المبدأ في ميثاق عصبة الأمم
          ثم في ميثاق الأمم المتحدة ولا سيّما الفصل السابع منه.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >-
            مبدأٌ في القانون الدولي يقوم على التزام مجموعة من الدول بالتصدّي
            جماعيّاً لأيّ عدوان يقع على أيّ دولة منها، بحيث يُعَدّ الاعتداء
            على إحداها اعتداءً على الجميع.

  examples:
    per_lemma:
      - lemma: "أَمْنٌ جَمَاعِيّ"
        examples:
          - text: "يُعَدّ نظام الأمن الجماعي الذي أرساه ميثاق الأمم المتحدة الركيزة الأساسية لحفظ السلم والأمن الدوليَّيْن."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يُعَدّ نظام الأمن الجماعي الذي أرساه ميثاق الأمم المتحدة الركيزة الأساسية لحفظ السلم والأمن الدوليَّيْن."

