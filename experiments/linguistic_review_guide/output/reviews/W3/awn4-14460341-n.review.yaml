# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14460341-n
# the state of being honored — حالة كونه مكرماً
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «حالة كونه مكرماً» مقتضب جداً وأقرب إلى ترجمة حرفية منه إلى تعريف معجمي"
      - "اللمّتان الموجودتان (تكريم، شرف) بدون تشكيل"
      - "اللمّة «تكريم» مصدر يدلّ على فعل التكريم لا على حالة المُكرَّم، فقد يكون هناك فرق دلالي دقيق"
    observations: "المجموعة تمثّل مفهوم الحالة الاجتماعية المرموقة التي ينالها المرءُ بتقدير الآخرين وإجلالهم. المُسنَد الأعلى (hypernym) هو سمعة/مكانة، ممّا يؤكّد أنّ المقصود حالة ثابتة لا حدث عابر. ينبغي التمييز بين المصدر الحدثيّ (التكريم بوصفه فعلاً) والحالة الناتجة (الشرف بوصفه صفة مستقرّة)."
  blind_candidates:
    - lemma: "كَرَامَة"
      generation_method: ishtiqaq
      justification: "على وزن فَعَالَة من الجذر كرم، وهو اسم يدلّ على حالة الإكرام والتقدير، قريب من معنى حالة كون المرء مُكرَّماً"
    - lemma: "حَظْوَة"
      generation_method: majaz
      justification: "من الجذر حظو، تدلّ في الأصل على المكانة والمنزلة لدى ذي سلطان، وهي إزاحة دلالية من الحظّ إلى المكانة المُنالة بالتقدير"
    - lemma: "وَجَاهَة"
      generation_method: ishtiqaq
      justification: "على وزن فَعَالَة من الجذر وجه، تدلّ على الحُرْمة والمكانة الاجتماعية الرفيعة"
    - lemma: "تَشْرِيف"
      generation_method: ishtiqaq
      justification: "مصدر شَرَّفَ على وزن تَفْعِيل، يدلّ على إضفاء الشرف والتكريم على شخص ما"

stage2_evidence:
  per_lemma:
    - lemma: "تَكْرِيم"
      confirm:
        - text: "«(3) تكريم» ضمن تعريف compliment"
          source: "المورد الحديث (2008)"
        - text: "«مأدبة سنوية يقيمها ربُّ العمل تكريمًا لعمّاله»"
          source: "المورد الحديث (2008)"
        - text: "«حفلة تكريم» ضمن تعريف accolade"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«تكريم المعيشة، في تحريم الحشيشة» — عنوان كتاب للقسطلاني"
          source: "كشف الظنون لحاجي خليفة"
          addition: "يُظهر استعمال لفظ التكريم بمعنى التنزيه والرفعة في التراث"

    - lemma: "شَرَف"
      confirm:
        - text: "«الشَّرَفُ: العُلُوُّ، والمكانُ العالي، والمَجْدُ، أو لا يكونُ إلاَّ بالآباءِ، أو عُلُوُّ الحَسَبِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الشَّرَفُ: الحَسَبُ بالآباء. شَرُفَ يَشْرُفُ شَرَفاً وشُرْفَةً وشَرافةً، فهو شريفٌ»"
          source: "لسان العرب لابن منظور"
        - text: "«الموضع العالي يُشرف على ما حوله العُلُوُّ والمجد؛ وقيل لا يكون إلا بالآباء»"
          source: "المعجم الوسيط"
        - text: "«شرف» = honour"
          source: "مسرد الفلسفة وعلم النفس (ALECSO)"
        - text: "«(1) سمعة حسنة. إجلال؛ احترام (2) فخر؛ مصدر شرف (3) دليل أو رمز على امتياز»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الشِّينُ وَالرَّاءُ وَالْفَاءُ أَصْلٌ يَدُلُّ عَلَى عُلُوٍّ وَارْتِفَاعٍ. فَالشَّرَفُ: الْعُلُوُّ. وَالشَّرِيفُ: الرَّجُلُ الْعَالِي»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر شرف يدور حول معنى العلوّ المادي والمعنوي"

    - lemma: "كَرَامَة"
      confirm:
        - text: "«الكرامة: اسم للإكرام، وهو إيصال الشيء الكريم أي النفيس إلى المُكرَم»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«الكرامة: فعل خارق عن العادة يظهر على شخص من غير دعواه»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المعنى الاصطلاحي الغالب هو الكرامة الصوفية (خارق العادة) لا حالة التكريم"
        - text: "«الكرامة: الأمر الخارق للعادة غير المقرون بالتحدي ودعوى النبوة يظهره الله على أيدي أوليائه»"
          source: "المعجم الوسيط"
          conflict: "المعجم الوسيط يقصر المعنى الأول على الخارق للعادة"
      expands:
        - text: "«ويقال لفلان عليّ كرامة: عزّة»"
          source: "المعجم الوسيط"
          addition: "يوجد معنى ثانوي للكرامة بمعنى العزّة والاحترام"

    - lemma: "حَظْوَة"
      confirm:
        - text: "«المَكانةُ والمَنْزِلَةُ لَدَى ذِي سُلْطَانٍ ونحوِه»"
          source: "المعجم الكبير"
        - text: "«الحُظْوَةُ، بالضم والكسر، والحِظَةُ: المكانَةُ، والحَظُّ من الرِّزْقِ»"
          source: "القاموس المحيط للفيروزآبادي"
      contradicts:
        - text: "«الحُظْوَةُ: المكانة والمنزلة لدى ذي سلطان ونحوه»"
          source: "المعجم الكبير"
          conflict: "الحظوة مقيّدة بالمكانة عند ذي سلطان، لا حالة التكريم العامة"

    - lemma: "وَجَاهَة"
      confirm:
        - text: "«الوَجاهة: الحُرْمة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«هو وجيه بيّن الجاه. والجاه مقلوب»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر وجه يدور حول المقابلة والمواجهة، ومنه الجاه والوجاهة"

    - lemma: "تَشْرِيف"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تَكْرِيم"
      decision: confirmed
      decision_reason: "مصدر كَرَّمَ (باب التفعيل) يدلّ على فعل التكريم وحالته معاً، وهو شائع الاستعمال في العربية المعاصرة بمعنى الإجلال والاحتفاء. الأدلة من المورد الحديث تؤكد استخدامه بهذا المعنى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على فعل التكريم ونتيجته، ويُستعمل في سياق الاحتفاء الرسمي والمؤسسي (حفل تكريم، تكريم الفائزين)، وهو أقرب إلى الحدث المتجدّد منه إلى الحالة المستقرّة"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَكْرِيم"

    - lemma: "شَرَف"
      decision: confirmed
      decision_reason: "لفظ أصيل ثابت في المعاجم الكلاسيكية والمعاصرة بمعنى العلوّ والمجد والحسب. أجمعت المعاجم على دلالته على المكانة الرفيعة، وهو الأنسب لمعنى حالة كون المرء مُكرَّماً مكانةً لا حدثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المكانة العالية المستقرّة والمجد المتوارث، وهو حالة ثابتة أكثر منه حدثاً، ويرتبط بالحسب والنسب في الاستعمال الكلاسيكي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "شَرَف"

    - lemma: "كَرَامَة"
      source: stage1
      decision: removed
      decision_reason: "المعنى الاصطلاحي الغالب في المعاجم هو الخارق للعادة (الكرامة الصوفية)، وإن وُجد معنى ثانوي بمعنى العزّة والإكرام فهو مرجوح وقد يُوقع في لبس اصطلاحي. إدراجها يخلّ بوضوح المجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "حَظْوَة"
      source: stage1
      decision: removed
      decision_reason: "الحظوة مقيّدة دلالياً بالمكانة عند ذي سلطان أو نفوذ، وليست حالة تكريم عامة. الفرق الدلالي جوهري: الحظوة تتضمّن علاقة تبعية بسلطة، بينما المجموعة تصف حالة تكريم مطلقة."
      evidence_assessment:
        case: mixed

    - lemma: "وَجَاهَة"
      source: stage1
      decision: removed
      decision_reason: "الوَجاهة تدلّ على الحُرمة والهيبة الاجتماعية الناشئة عن المال أو الجاه، وهي أقرب إلى المكانة الذاتية منها إلى حالة التكريم من الآخرين. كما أنّ تعريفها في الوسيط مقتضب (الحُرمة) ولا يطابق دلالة المجموعة."
      evidence_assessment:
        case: confirm_only

    - lemma: "تَشْرِيف"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية مباشرة، وهو مصدر شَرَّفَ يدلّ على فعل التشريف لا الحالة، ويتداخل دلالياً مع تكريم دون إضافة فارق نوعي."
      evidence_assessment:
        case: no_material

