stage1_review:
  assessment:
    concerns:
      - "اللمّات الموجودة تفتقر للتشكيل الكامل."
      - "التعريف الحالي مقتضب ويمكن تحسينه بذكر الروافد المكونة للمصب."
    observations: "المجموعة تتعلق بكيان جغرافي محدد (ريو دي لا بلاتا). الاستراتيجية المتبعة في التسمية هي التعريب بالنقحرة (transliteration) أو الوصف بإضافة كلمة 'نهر'. اللمّات الحالية دقيقة من الناحية الاستعمالية."
  blind_candidates:
    - lemma: "رِيُو دِي لَا بِلَاتَا"
      generation_method: taarib
      justification: "النقحرة الحرفية للاسم الإسباني الأصلي (Río de la Plata)، وهي الصيغة الأكثر دقة ورسمية."
    - lemma: "نَهْر لَا بِلَاتَا"
      generation_method: tarkib
      justification: "تعبير وصفي مركب يجمع بين كلمة 'نهر' واسم العلم المنقحر، وهو شائع الاستخدام في الجغرافيا العربية."
    - lemma: "نَهْر اَلْفِضَّةِ"
      generation_method: majaz
      justification: "ترجمة حرفية لمعنى الاسم الإسباني (Plata تعني فضة)، تُستخدم أحياناً في السياقات الأدبية أو التاريخية."
    - lemma: "مَصَبُّ لَا بِلَاتَا"
      generation_method: tarkib
      justification: "تعبير تقني دقيق يصف الظاهرة الجغرافية (مصب estuary) مقترنة بالاسم."

stage2_evidence:
  per_lemma:
    - lemma: "ريو دي لا بلاتا"
      expands:
        - text: "«صوف لا بلاتا: صوف كروسبريد رقيق وخشن أرجنتيني الأصل»"
          source: "ArabTerm"
          addition: "يؤكد استخدام 'لا بلاتا' كاسم علم مرتبط بالأرجنتين في المعاجم التقنية."
    - lemma: "نهر لا بلاتا"
      expands:
        - text: "«مَصَبٌّ: المكان الذي يجري فيه النهر، ففي رحلة ابن جبير: دولاب يلقي الماء إلى بساتين مرتفعة عن مصب النهر.»"
          source: "تكملة المعاجم (دوزي)"
          addition: "يوثق استخدام كلمة 'مصب' لوصف نهاية النهر في البحر."
    - lemma: "مصب"
      confirm:
        - text: "«المَصَبُّ: مصبّ النهر.»"
          source: "المورد الحديث"
        - text: "«الخور: مصب المياه الجارية في البحر إذا اتسع»"
          source: "المعجم الوسيط"

stage3_analysis:
  per_lemma:
    - lemma: "ريو دي لا بلاتا"
      decision: confirmed
      decision_reason: "الاسم العلمي الرسمي المنقحر، وهو الأكثر تداولاً في الأطالس والخرائط."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِيُو دِي لَا بِلَاتَا"
    - lemma: "نهر لا بلاتا"
      decision: confirmed
      decision_reason: "تسمية عربية شائعة وصحيحة دلالياً، تجمع بين جنس الكيان واسمه."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَهْر لَا بِلَاتَا"

stage4_content:
  definition:
    current: "مصب نهر بين الأرجنتين وأوروغواي"
    assessment:
      decision: revise
      reason: "التعريف الحالي يفتقر للتفاصيل الجغرافية التي تميز هذا الكيان عن غيره من المصبات."
    authored:
      - type: terminological
        text: "مَصَبٌّ مَائِيٌّ عَرِيضٌ يَقَعُ بَيْنَ اَلْأَرْجَنْتِينِ وَأُورُوغُوَاي، يَتَكَوَّنُ مِنْ اِلْتِقَاءِ نَهْرَيْ بَارَانَا وَأُورُوغُوَاي، وَيُشَكِّلُ حُدُودًا طَبِيعِيَّةً بَيْنَهُمَا."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَصَبٌّ مَائِيٌّ عَرِيضٌ يَقَعُ بَيْنَ اَلْأَرْجَنْتِينِ وَأُورُوغُوَاي، يَتَكَوَّنُ مِنْ اِلْتِقَاءِ نَهْرَيْ بَارَانَا وَأُورُوغُوَاي، وَيُشَكِّلُ حُدُودًا طَبِيعِيَّةً بَيْنَهُمَا."

  examples:
    per_lemma:
      - lemma: "رِيُو دِي لَا بِلَاتَا"
        examples:
          - text: "يُعد رِيُو دِي لَا بِلَاتَا أوسع مصب نهري في العالم حيث يصل عرضه في بعض المناطق إلى 220 كيلومتراً."
            type: usage
      - lemma: "نَهْر لَا بِلَاتَا"
        examples:
          - text: "تطل مدينة بوينس آيرس، عاصمة الأرجنتين، على الضفة الغربية لنهر لا بلاتا."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "يعتبر ريو دي لا بلاتا شريان حياة اقتصادياً هاماً لكل من الأرجنتين وأوروغواي."

