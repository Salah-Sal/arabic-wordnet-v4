# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10381894-n  |  ili: i91644  |  POS: n
# المفهوم: مُصلِح يتبنَّى مبدأَ اللاعنف — passive resister
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة مُقاوِم سِلْمِيّ تفتقر إلى التشكيل الكامل: القاف في مُقَاوِم (على وزن مُفَاعِل من قاوَمَ) تحتاج فتحةً صريحة → مُقَاوِم"
      - "التعريف يتضمن قوساً تفسيريةً غير رسمية «(اللاعنف)» ينبغي دمجها في النص لا إلحاقها كحاشية"
      - "المجموعة تحتوي على لمّة وحيدة مركّبة، وتفتقر إلى بدائل مفردة قد تُغني الشبكة الدلالية"
    observations: >-
      المجموعة ترادفية ذات مفهوم سياسي-اجتماعي حديث يتمحور حول مبدإ اللاعنف
      (nonviolence / passive resistance) بوصفه أداةً إصلاحيةً. الجذران المؤسِّسان
      للتركيب هما (ق و م) الدال على الانتصاب والعزم، و(س ل م) الدال على الصحة
      والعافية والصلح. التعبير الإنجليزي يتراوح بين «passive resister» الذي يُبرز
      الفاعلية، و«non-resistant» الذي يُبرز الامتناع؛ والفارق بينهما دقيق إذ الأول
      نضالي سلمي والثاني سلبي محض. اللمّة العربية أقرب إلى «passive resister».

  blind_candidates:
    - lemma: "مُسَالِم"
      generation_method: ishtiqaq
      justification: >-
        اشتُقَّ على وزن مُفَاعِل (صيغة المشاركة والمصالحة) من جذر (س ل م)؛ يُفيد
        من يُسالِم ويُصالِح، فهو يتضمن طرَفَيْن: الإصلاح والسلامة؛ وهو أحيى الألفاظ
        الكلاسيكية التي يمكن أن تُحيل إلى الموقف السلمي.
    - lemma: "لاعُنْفِيٌّ"
      generation_method: tarkib
      justification: >-
        تركيب إضافي-نسبي: لا + عنف + ياء النسبة = النسبة إلى اللاعنف؛ يُنتج صيغةً
        تدل على المنتسب إلى مبدإ اللاعنف، وهو تشكيل قياسي مطّرد في العربية المعاصرة
        (كلائكيّ، لادينيّ، لاسلكيّ).
    - lemma: "مُهَادِن"
      generation_method: majaz
      justification: >-
        إحياء للفظ عربي قديم من جذر (ه د ن) الدال على السكون والاستقامة؛ الهُدنة
        هي وقف المواجهة بالتراضي، فمُهَادِن (مُفَاعِل) من طلب الهُدنة وآثرها على
        المواجهة، وهو مجاز وظيفي عن الموقف السلمي من الصراع.
    - lemma: "مُتَسَالِم"
      generation_method: ishtiqaq
      justification: >-
        وزن مُتَفَاعِل من (س ل م)؛ يُفيد من يسعى إلى المسالمة ويتبنّاها سلوكاً،
        بصيغة تدل على الاستمرارية والإرادة، مما يُقارب مفهوم التزام اللاعنف كمنهج.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات أُجريت: ٥ استعلامات
#  [Q1] مطابقة دفعية: مقاوم سلمي + مسالم + لاعنفي + مهادن + متسالم (+ صيغ ال-)
#  [Q2] جسر إنجليزي: passive resistance, non-resistant, pacifist, nonviolent
#  [Q3] بحث FTS عربي: مقاومة سلبية، لاعنف، اللاعنف، مسالمة
#  [Q4] مكوّنات مُفردة: مقاوم، سلمي، لاعنف، مقاومة
#  [Q5] مقاييس اللغة: جذور قوم، سلم، هدن (dictionary_id=151)
stage2_evidence:
  per_lemma:
    - lemma: "مُقاوِم سِلْمِيّ"
      confirm:
        - text: >-
            «المقاومة السلبية: مقاومة الحكومة أو السلطة المحتلة بطرائق وأعمال
            لاتعاونية بدلًا من أعمال العُنف.»
          source: "المورد الحديث (2008)"

    - lemma: "مُسَالِم"
      contradicts:
        - text: "«مُسَالم: من (س ل م) الذي يعيش في سلام.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
          conflict: >-
            المعنى المعجمي يصف الشخصية الهادئة السلمية الطابع دون أي إشارة إلى
            الإصلاح أو المقاومة السياسية الفعّالة؛ كما أن الكلمة شائعة كاسم علَم
            مما يُفضي إلى اشتراك لفظي.

    - lemma: "لاعُنْفِيٌّ"
      expands:
        - text: "«اللّاعنف؛ مبدأ اللّاعنف.»"
          source: "المورد الحديث (2008)"
          addition: >-
            يُثبت توظيف «اللاعنف» اسماً في المعجمية العربية الحديثة بمعنى
            nonviolence، مما يُجيز صياغة «لاعنفيّ» نسبةً إليه وفق القياس الصرفي
            العربي؛ غير أن الإدخال المعجمي يُثبت المبدأ لا الشخص.

    - lemma: "مُهَادِن"
      expands:
        - text: >-
            «هَدَنَ: الْهَاءُ وَالدَّالُ وَالنُّونُ أُصَيْلٌ يَدُلُّ عَلَى سُكُونٍ
            وَاسْتِقَامَةٍ... وَمِنْهُ قِيَاسُ الْهُدْنَةِ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            يؤكد أن أصل (هدن) السكون والاستقامة، ومنه الهُدنة (وقف إطلاق النار/
            اتفاق الهدوء)؛ وهو صالح للإحياء المجازي نحو الموقف السلمي، لكنه يفتقر
            لمؤيد معاصر على استعمال «مُهَادِن» بمعنى passive resister.

    - lemma: "مُتَسَالِم"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُقاوِم سِلْمِيّ"
      decision: confirmed
      decision_reason: >-
        التركيب الوصفي (مُفَاعِل + نسبة) تعبيرٌ اصطلاحيٌّ ثابتٌ رائجٌ في الخطاب
        السياسي والصحفي العربي الحديث للدلالة على passive resister؛ رصد المورد
        الحديث (2008) الاصطلاحَ الأمَّ «المقاومة السلبية» بوصفه مصطلحاً عربياً
        معتمداً. اختبار السكّ: لا يمكن إحلال مرادف مكان «سِلْمِيّ» (كـ«هادئ»)
        مع الحفاظ على الدلالة التقنية، مما يُثبت الوحدة المعجمية. يحتاج تصحيح
        تشكيل القاف: مُقَاوِم (بفتح القاف) وفق وزن مُفَاعِل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        اللمّة الوحيدة في المجموعة؛ تجمع بعدَيْن دلاليَّيْن متلازمَيْن: (١) الفاعلية
        النضالية (مُقَاوِم = من يقاوم فعلياً) و(٢) الالتزام السلمي (سِلْمِيّ = عبر
        أساليب اللاعنف)؛ فلا تعني الاستسلام (non-resistant بمعنى passive) بل
        المقاومة المنضبطة بمبدإ اللاعنف.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقَاوِم سِلْمِيّ"

    - lemma: "مُسَالِم"
      source: stage1
      decision: removed
      decision_reason: >-
        المعنى المعجمي المُثبَت «من يعيش في سلام» يصف طابعاً شخصياً لا موقفاً
        إصلاحياً نضالياً؛ كما أن مُسَالِم شائعٌ اسمَ عَلَمٍ مما يُوقع في اشتراك
        لفظي مع الأعلام. الاختبار التبادلي يُظهر أن إحلاله محل «مُقَاوِم سِلْمِيّ»
        يُحيل إلى معنى التسالم المتبادل لا الفاعلية الإصلاحية.
      evidence_assessment:
        case: contradicts_only

    - lemma: "لاعُنْفِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >-
        الاشتقاق صحيحٌ قياساً (نسبة إلى اللاعنف)، إلا أن التوثيق المعجمي أثبت
        «اللاعنف» مبدأً لا وصفاً لشخص؛ كذلك تغيب دلالة «المصلح» (reformer) وهي
        الجنس القريب في التعريف. بوابة الجودة: يُخفق في معيار «الملاءمة» لأنه يصف
        الموقف الفلسفي لا الشخص الناشط إصلاحياً.
      evidence_assessment:
        case: no_material

    - lemma: "مُهَادِن"
      source: stage1
      decision: removed
      decision_reason: >-
        مُهَادِن يعني «من يُبرم هُدنةً» أو «من يسعى إلى وقف القتال» وهو أقرب إلى
        مُفاوِض أو وسيط منه إلى passive resister؛ الجذر (هدن) يدل على السكون
        العرضي لا على الالتزام المبدئي الدائم بمنهج اللاعنف. لم يُعثر على استعمال
        معاصر مُوثَّق لـ«مُهَادِن» بالمعنى المطلوب.
      evidence_assessment:
        case: no_material

    - lemma: "مُتَسَالِم"
      source: stage1
      decision: removed
      decision_reason: >-
        لا توثيق معجمي؛ وصيغة المتفاعل (Form VI) تُفيد المشاركة والتبادل (= يتسالم
        مع الآخرين) لا الانتساب إلى مبدإ ذاتي ثابت؛ فضلاً عن غياب دلالة الإصلاح.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مصلح يؤمن بالمقاومة السلبية (اللاعنف)"
    assessment:
      decision: revise
      reason: >-
        القوسان التفسيريان «(اللاعنف)» يُخلّان ببنية التعريف المعجمي الرسمي؛
        وينبغي دمجهما في النص لا إلحاقهما حاشيةً. كذلك يمكن تعزيز الفصل النوعي
        بتحديد طبيعة الأسلوب الإصلاحي (اللاعنف + المقاومة السلبية معاً لا أحدهما
        بوصفه تفسيراً للآخر).
    authored:
      - type: terminological
        text: >-
          مُصلِحٌ يتبنَّى مبدأَ اللاعنف ويعتمد المقاومةَ السلبيةَ — القائمةَ على
          العصيان المدني واللاتعاون لا على القوة — أسلوباً للإصلاح الاجتماعي
          والسياسي
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >-
          من يُناضل في سبيل الإصلاح مُؤثِراً أساليبَ السلم واللاعنف على
          المواجهة المسلحة، مُعتمِداً الاحتجاجَ السلمي والمقاومةَ الصامتة
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10381894-n"
          definition_index: 0
          text: >-
            مُصلِحٌ يتبنَّى مبدأَ اللاعنف ويعتمد المقاومةَ السلبيةَ — القائمةَ على
            العصيان المدني واللاتعاون لا على القوة — أسلوباً للإصلاح الاجتماعي
            والسياسي
      - command: add_definition
        params:
          synset_id: "awn4-10381894-n"
          text: >-
            من يُناضل في سبيل الإصلاح مُؤثِراً أساليبَ السلم واللاعنف على
            المواجهة المسلحة، مُعتمِداً الاحتجاجَ السلمي والمقاومةَ الصامتة

  examples:
