      - lemma: "مُقَاوِم سِلْمِيّ"
        examples:
          - text: >-
              كان المهاتما غاندي أشهرَ مُقاوِمٍ سِلْمِيٍّ في التاريخ الحديث؛
              إذ قاد شعبه نحو الاستقلال بالعصيان المدني وتحدّي القوانين الظالمة
              دون اللجوء إلى السلاح
            type: usage
    actions:
