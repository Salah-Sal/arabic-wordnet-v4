# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التقييم الأولي (بعد الاطلاع على الملف الكامل)
  assessment:
    concerns:
      - "صنف الكلام في المجموعة محدَّد بـ n (اسم عام)، في حين أن المدخلَيْن اسمَا علَم لشخص بعينه؛ يجب تحديث pos في المدخلَيْن إلى proper_noun"
      - "كلتا اللمّتَيْن المسجَّلتَيْن (دولبي، راي دولبي) خاليتان من التشكيل الكامل، وهو إلزامي لكل لمّة مؤكَّدة"
      - "التعريف العربي الحالي مترجَم حرفياً من الإنجليزية ويفتقر إلى التأريخ والسياق الموسوعي اللذَيْن يميّزان التعريفات الجيدة لأسماء الأعلام"
      - "راي دولبي تعبير مركّب (MWE) يستحق تصنيفاً صريحاً كمركّب تعريبي"
    observations: >
      تمثّل هذه المجموعة اسم عَلَم لشخص تاريخي هو المهندس الأمريكي رَاي مِيلْتُون دُولْبِي
      (1933–2013)، مؤسّس شركة دولبي للمختبرات الصوتية عام 1965 ومخترع نظام دولبي
      الشهير لتخفيض الضوضاء في التسجيلات الصوتية. اللمّتان المسجّلتان (دولبي، راي دولبي)
      هما تعريبان مباشران للاسمَيْن الأجنبيَّيْن، وهو السبيل الوحيد الملائم لأسماء الأعلام
      الأجنبية في العربية. أبرز ما يستوجب المعالجة: تصحيح صنف الكلام، وإضافة التشكيل،
      وتحسين التعريف بأسلوب موسوعي.

  # ب. المرشحات العمياء (من التعريف وحده — قبل الاطلاع على اللمّات الموجودة)
  blind_candidates:
    - lemma: "دُولْبِي"
      generation_method: taarib
      justification: >
        تعريب اللقب الأجنبي Dolby المستَقىّ من عبارة «نظام دولبي» الواردة في التعريف العربي
        ذاته؛ هو الصيغة الأكثر تداولاً في المصادر التقنية العربية للإشارة إلى هذا المخترع.
    - lemma: "رَاي دُولْبِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الثنائي Ray Dolby (الاسم الأول واللقب)، يُشيع في الموسوعات والمراجع
        العربية لتمييز الشخص عن النظام المسمّى باسمه.
    - lemma: "رَاي مِيلْتُون دُولْبِي"
      generation_method: taarib
      justification: >
        تعريب الاسم الرسمي الثلاثي الكامل Ray Milton Dolby، يُستخدم في السياقات
        الأكاديمية والتوثيقية الرسمية حيثما اقتضى التمييزُ الدقيقُ ذِكرَ الاسم الأوسط.
    - lemma: "رَاي م. دُولْبِي"
      generation_method: taarib
      justification: >
        تعريب الصيغة المختصرة Ray M. Dolby الشائعة في المراجع العلمية والببليوغرافية
        الإنجليزية؛ صيغة وسطى بين الاسم الثنائي والثلاثي الكامل.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: نُفِّذَت الاستعلامات الآتية:
  #   Q1 — المطابقة الدقيقة الدفعية لجميع اللمّات (موجودة + مرشّحات)
  #   Q2 — الجسر الإنجليزي: Ray Dolby / Dolby / Ray M. Dolby / noise reduction / tape recording
  #   Q3 — البحث بالكلمات المفتاحية العربية: ضوضاء، تسجيل، مهندس، ابتكر، نظام
  # النتائج: لم تُسفر الاستعلامات عن أي مدخل معجمي يتعلق باسم العَلَم «دولبي» أو «راي دولبي».
  # قاعدة البيانات المعجمية تحتوي مصطلحات تقنية مجردة (تخفيت الضجيج، التسجيل الشريطي...)
  # لكنها لا تشمل أسماء أعلام الأشخاص الأجانب في المعاجم الكلاسيكية أو الحديثة.

  per_lemma:
    - lemma: "دُولْبِي"
      evidence_status: "no_material_found"

    - lemma: "رَاي دُولْبِي"
      evidence_status: "no_material_found"

    - lemma: "رَاي مِيلْتُون دُولْبِي"
      evidence_status: "no_material_found"

    - lemma: "رَاي م. دُولْبِي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الأولى الموجودة: دولبي ──
    - lemma: "دولبي"
      decision: confirmed
      decision_reason: >
        تعريب راسخ للقب Dolby، متداول على نطاق واسع في المصادر التقنية والموسوعية العربية.
        غياب الأدلة المعجمية متوقَّع تماماً لأسماء الأعلام الأجنبية، ولا يُمثّل حجةً للرفض.
        يستوجب تصحيح التشكيل وتحديث صنف الكلام إلى proper_noun.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      loan_check:
        type: taarib
        verdict: مقبول
        note: >
          تعريب مباشر لاسم علم أجنبي. يقبل لام التعريف (الدولبي)، والنسبة (دولبي)،
          وجمع العَلَم الشخصي في حالات خاصة. الصيغة مستقرّة في المكتبة التقنية العربية.
      quality_gate:
        conformity: مطّرد في المصادر التقنية
        ease: يسير النطق والكتابة
        appropriateness: ملائم لاسم العَلَم
        heritage_preference: لا ينطبق (اسم أجنبي لا مقابل تراثياً له)
        arabic_preference: لا ينطبق
        derivability: غير اشتقاقي (علم)
      morphological_fit:
        verdict: مناسب
        note: بنية صرفية خفيفة من مقطعَيْن (دُولـ + بِي)، تُلاءم الأسماء المعرَّبة من ثلاثة أحرف أصلية مع ياء نسبة
      nuance_differentiation: >
        يُحيل في الغالب إلى الشخصية العلمية في السياق التقني، وكثيراً ما يُستخدم
        مجازاً للإشارة إلى النظام ذاته («تقنية دولبي»)؛ في حين أن «رَاي دُولْبِي»
        أكثر تحديداً للشخص في السياقات التاريخية والسيرية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "دُولْبِي"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── اللمّة الثانية الموجودة: راي دولبي ──
    - lemma: "راي دولبي"
      decision: confirmed
      decision_reason: >
        تعريب الاسم الثنائي الكامل Ray Dolby، وهو التعريب الأكثر شيوعاً في الموسوعات
        العربية والمصادر الأكاديمية للإشارة إلى الشخص تحديداً. الصيغة تُمثّل المرجعية
        الاسمية الكاملة المعتمدة في اللغة العربية لهذا العَلَم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: mazji
        note: >
          مركّب مزجي من اسمَيْن: «رَاي» (الاسم الأول) + «دُولْبِي» (اللقب). ليس تركيباً
          إضافياً ولا وصفياً بل وحدة اسمية ثابتة لعَلَم شخصي. يجتاز اختبار التثبيت
          المعجمي لأنه ليس عبارةً وصفية قابلة للإبدال.
      loan_check:
        type: taarib
        verdict: مقبول
        note: >
          تعريب مزدوج: «رَاي» من Ray و«دُولْبِي» من Dolby. كلٌّ منهما يقبل لام التعريف
          والنسبة بصورة منفردة، والمركّب ككلٍّ وحدةٌ معجمية ثابتة.
      quality_gate:
        conformity: مطّرد في الموسوعات العربية
        ease: يسير مع تقدير القارئ المتخصص
        appropriateness: ملائم — يُعيّن الشخص بدقة
        heritage_preference: لا ينطبق
        arabic_preference: لا ينطبق
        derivability: غير اشتقاقي (علم مركّب)
      morphological_fit:
        verdict: مناسب
        note: بنية ثنائية متعارَف عليها لأسماء الأعلام الأجنبية المعرَّبة في العربية المعاصرة
      nuance_differentiation: >
        الاسم الكامل الثنائي يُعيّن الشخصَ تعييناً قاطعاً في السياقات التاريخية والسيرية
        والأكاديمية؛ أما «دُولْبِي» المجرَّد فقد يُشير إلى الشخص أو النظام أو الشركة
        تبعاً للسياق، مما يُوجب استخدام الاسم الثنائي متى اقتضى المقامُ الدقةَ.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَاي دُولْبِي"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشّحات المرحلة ١ — حكم الرفض ──
    - lemma: "رَاي مِيلْتُون دُولْبِي"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الثلاثي الكامل نادر الورود في المصادر العربية ومقتصر على التوثيق الأرشيفي؛
        لا يُضيف قيمة معجمية على الاسم الثنائي «رَاي دُولْبِي» في سياق الشبكة الدلالية.

    - lemma: "رَاي م. دُولْبِي"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة ببليوغرافية مختصرة غير مناسبة كلمّة معجمية مستقلة؛ هي مجرد اختزال
        للاسم الكامل ولا تمثّل وحدة معجمية متمايزة.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-10958011-n"
        pos: n
      note: >
        يُبقى pos في المجموعة على n وفق اصطلاح WordNet القياسي الذي لا يُفرّق
        على مستوى المجموعة بين الاسم العام والعَلَم؛ التمييز يتمّ على مستوى المدخل
        (proper_noun) كما حُدِّد أعلاه.


