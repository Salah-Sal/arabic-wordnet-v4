stage4_content:
  definition:
    current: "بحيرة جليدية في وسط نيويورك؛ أطول بحيرات فينغر"
    assessment:
      decision: revise
      reason: "تحسين الصياغة لتكون أكثر فصاحة واستبدال 'فينغر' بالمصطلح العربي المعتمد 'الأصبعية'."
    authored:
      - type: encyclopedic
        text: "بُحَيْرَةٌ جَلِيدِيَّةٌ تَقَعُ فِي وَسَطِ وِلَايَةِ نِيُويُوركَ الأَمْرِيكِيَّةِ، وَتُعَدُّ أَطْوَلَ البُحَيْرَاتِ الأُصْبُعِيَّةِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-09262487-n", definition_index: 0, text: "بُحَيْرَةٌ جَلِيدِيَّةٌ تَقَعُ فِي وَسَطِ وِلَايَةِ نِيُويُوركَ الأَمْرِيكِيَّةِ، وَتُعَدُّ أَطْوَلَ البُحَيْرَاتِ الأُصْبُعِيَّةِ."}
  examples:
