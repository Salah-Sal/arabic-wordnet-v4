        examples:
          - text: "تَمْتَازُ بُحَيْرَةُ كَايُوغَا بِمَنَاظِرِهَا الطَّبِيعِيَّةِ الخَلَّابَةِ وَعُمْقِهَا الكَبِيرِ."
