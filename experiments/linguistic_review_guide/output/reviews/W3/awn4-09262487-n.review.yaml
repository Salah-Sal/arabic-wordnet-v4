stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - استخدام اسم "فينغر" في التعريف هو تعريب لفظي، والأفضل استخدام "البحيرات الأصبعية" كما ورد في المعاجم التقنية (ArabTerm).
    observations: "المجموعة تتعلق بمعلم جغرافي محدد (بحيرة كايوغا). التحدي اللغوي يكمن في التعريب الدقيق للاسم الأجنبي ووصف الطبيعة الجيولوجية للبحيرة."
  blind_candidates:
    - lemma: "بُحَيْرَة كَايُوغَا"
      generation_method: tarkib
      justification: "التركيب الإضافي القياسي لتسمية البحيرات في العربية، مع تعريب 'Cayuga' بالعين الغينية المقابلة للجيم غير المعطشة."
    - lemma: "بُحَيْرَة كَايُوجَا"
      generation_method: tarkib
      justification: "بديل تعريبي يستخدم الجيم، وهو أقل شيوعاً في الأسماء العلمية الجغرافية لهذه المنطقة."
    - lemma: "كَايُوغَا"
      generation_method: taarib
      justification: "الاسم العلم بمفرده، يستخدم غالباً في السياقات المختصرة أو الخرائط."
    - lemma: "بُحَيْرَة كَايُوغَا الجَلِيدِيَّة"
      generation_method: tarkib
      justification: "تعبير وصفي يحدد الطبيعة الجيولوجية للبحيرة كما ورد في التعريف."

