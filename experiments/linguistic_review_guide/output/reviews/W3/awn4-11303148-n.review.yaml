# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11303148-n  |  ILI: i96821
# العنوان: أَدُولْف سَاكْس — صانع الآلات الموسيقية البلجيكي
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "الصنف النحوي n يُصنِّف المجموعة اسماً عاماً، في حين أنها تُمثِّل علَماً شخصياً (proper noun)؛ يُفضَّل النظر في تحديثه"
      - "اللمّة «ساكس» بمعزل عن السياق تُوهم بالإحالة إلى الشعب الساكسوني الجرماني لا إلى المخترع البلجيكي أَدُولْف سَاكْس"
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل"
      - "التعريف الحالي ترجمة حرفية للإنجليزية، يحتاج إلى صياغة معجمية عربية أصيلة بأسلوب المعجم الوسيط"
    observations: >-
      المجموعة تُمثِّل علَماً شخصياً للمخترع البلجيكي أَدُولْف سَاكْس (1814-1894م)،
      مُخترِع آلة الساكسفون الشهيرة. الأعلام الشخصية الأجنبية لا تخضع لقياسات
      الاشتقاق أو المجاز، بل تُعرَّب مباشرةً. التعريب المعتمد للاسم موافق للقياس،
      لكنه يحتاج ضبطاً بالشكل. اللمّة المُختصرة «ساكس» تستدعي التحقق من خلوِّها
      من الاشتراك اللفظي مع ما يُشير إلى الشعب الساكسوني، كما أن التعريف الحالي
      بحاجة إلى تطوير أسلوبي يستوعب المعلومات الموسوعية للشخصية.

  blind_candidates:
    - lemma: "أَدُولْف سَاكْس"
      generation_method: taarib
      justification: >-
        تعريب مباشر للاسم الكامل Adolphe Sax بصيغته الفرنسية الأصلية؛
        الصيغة الأوفى دلالةً للتمييز من المشتركات اللفظية، إذ تجمع
        الاسم الأول واللقب العائلي معاً دفعاً للإيهام.
    - lemma: "سَاكْس"
      generation_method: taarib
      justification: >-
        تعريب اللقب العائلي Sax وحده؛ شائع في المصادر الموسيقية العربية
        باعتباره صيغةً مُختصرة للإشارة إلى المخترع في السياقات غير الرسمية،
        ومنه اشتُقَّ اسم الآلة «ساكسفون».
    - lemma: "أَدُولُف سَاكِسُ"
      generation_method: taarib
      justification: >-
        صيغة تعريبية بديلة بضم واو «أَدُولُف» وكسر كاف «سَاكِس»،
        وفق نهج نقل الأسماء الفرنسية المُنتهية بحرف صامت مع إضافة حركة
        إعرابية، وإن كانت أقل شيوعاً من الصيغة المُسكَّنة.
    - lemma: "سَاكِس"
      generation_method: taarib
      justification: >-
        صيغة بديلة للقب بكسر الكاف بدلاً من إسكانها، أقرب نطقاً
        للمقطع الأصلي في الفرنسية؛ تنطبق عليه قواعد التعريب إلا أنها
        أقل تداولاً في المصادر العربية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٤ استعلامات):
# ١. مطابقة دقيقة دفعية: ادولف ساكس، ساكس، سكس + صيغ ال-
# ٢. الجسر الإنجليزي: Sax, Adolphe Sax, saxophone, saxophone inventor
# ٣. بحث FTS عربي: ساكسفون، بلجيكي، آلات موسيقية
# ٤. تحقق المرشحات: ادولف سكس، ادولف، سكسية، ساكسفون، سكسفون
stage2_evidence:
  per_lemma:
    - lemma: "أدولف ساكس"
      evidence_status: "no_material_found"

    - lemma: "ساكس"
      contradicts:
        - text: >-
            «ساكس: الصيغة المختصرة للإسم ساكسون المأخوذ عن الإنجليزية القديمة
            بمعنى ساكسوني، والساكسون: شعب جرماني فتح انجلترا وامتزج بأهلا ليؤلف
            الشعب الأنجلوسكسوني، وكان الرومان قد أطلقوا هذه التسمية على الألمان
            الذين استخدموا سيوفا قصيرة في الحرب. يستخدم للذكور.»
          source: "موسوعة السلطان قابوس لأسماء العرب (Sultan Qaboos University, 1985)"
          conflict: >-
            المعجم يُحيل «ساكس» حصراً إلى الشعب الساكسوني الجرماني لا إلى
            المخترع البلجيكي أَدُولْف سَاكْس؛ يُثبت وجود اشتراك لفظي محتمل.
        - text: >-
            «سَكْس: إحدى صيغ الإسم ساكسون المأخوذ عن الإنجليزية بمعنى رجل
            مسلح بالسيف. يستخدم للذكور.»
          source: "موسوعة السلطان قابوس لأسماء العرب (Sultan Qaboos University, 1985)"
          conflict: >-
            صيغة مقابلة (سكس/ساكس) تؤكد كذلك الإحالة إلى الاسم الجرماني-الساكسوني،
            مما يرسِّخ خطر الاشتراك اللفظي في غياب السياق الموسيقي.

    # الجسر الإنجليزي — sax / saxophone
    - lemma: "ساكس [الجسر الإنجليزي: sax]"
      expands:
        - text: "«= saxophone»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >-
            المورد الحديث يترجم «sax» مباشرةً بـ «ساكسفون»، مُشيراً إلى
            أن «ساكس» في الاستخدام الإنجليزي تُحيل إلى الآلة الموسيقية لا
            إلى شخص بعينه؛ وهذا يؤكد الاستخدام الشائع للّقب كمرجع للآلة
            وإن كان المقصود أصلاً اسم المخترع.

    - lemma: "أَدُولُف سَاكِسُ"
      evidence_status: "no_material_found"

    - lemma: "سَاكِس"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "أدولف ساكس"
      decision: confirmed
      decision_reason: >-
        الاسم الكامل المُعرَّب لأدولف سَاكْس هو الصيغة المرجعية الرسمية
        الأوفى للتمييز من الاشتراك اللفظي. عدم وجوده في المعاجم المتاحة
        أمر طبيعي للأعلام الأجنبية؛ إذ نادراً ما تُدرج المعاجم العربية
        الكلاسيكية والحديثة أعلامَ الأشخاص الأجانب في صورة مداخل مستقلة.
        اللمّة تحتاج ضبطاً بالشكل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الاسم الكامل المُستخدَم في السياقات الرسمية والموسوعية والأكاديمية؛
        يُحيل بلا لبس إلى الشخص بعينه ولا يشترك مع أي معنى آخر في العربية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَدُولْف سَاكْس"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "ساكس"
      decision: confirmed
      decision_reason: >-
        رغم وجود اشتراك لفظي مع «الساكسون» في معاجم الأسماء، فإن «ساكس»
        رُسِّخت في الاستخدام الموسيقي العربي المعاصر كاختصار مألوف للمخترع
        أَدُولْف سَاكْس، وقد انبثق منها مصطلح «الساكسفون». بقاؤها في المجموعة
        مشروط بالسياق الدلالي للمجموعة نفسها الذي يُقيِّد الدلالة بالمخترع
        الموسيقي لا بالشعب. اللمّة تحتاج ضبطاً بالشكل الكامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        الصيغة المُختصَرة (اللقب وحده) الشائعة في سياقات الكلام الموسيقي
        اليومي غير الرسمي؛ أقل دقةً من الاسم الكامل لكنها أوسع تداولاً
        في النصوص الإعلامية والموسيقية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَاكْس"

    # ── مرشح المرحلة ١ — أَدُولْف سَاكْس ──
    - lemma: "أَدُولْف سَاكْس"
      source: stage1
      decision: removed
      decision_reason: >-
        يُطابق اللمّة الموجودة «أدولف ساكس» بعد ضبطها بالشكل؛
        يُغني عنها إجراء update_lemma على اللمّة الموجودة ولا حاجة
        لإنشاء مدخل جديد.

    # ── مرشح المرحلة ١ — سَاكْس ──
    - lemma: "سَاكْس"
      source: stage1
      decision: removed
      decision_reason: >-
        يُطابق اللمّة الموجودة «ساكس» بعد ضبطها بالشكل؛
        يُغني عنها إجراء update_lemma على اللمّة الموجودة.

    # ── مرشح المرحلة ١ — أَدُولُف سَاكِسُ ──
    - lemma: "أَدُولُف سَاكِسُ"
      source: stage1
      decision: removed
      decision_reason: >-
        صيغة صرفية مغايرة تافهة الأثر؛ الحركات البديلة لا تُنشئ وحدةً
        معجمية مستقلة بل هي اجتهاد في الكتابة. اللمّة الأصل «أَدُولْف سَاكْس»
        (بإسكان الكاف) أرسخ في الاستخدام العربي المعاصر.

    # ── مرشح المرحلة ١ — سَاكِس ──
    - lemma: "سَاكِس"
      source: stage1
      decision: removed
      decision_reason: >-
