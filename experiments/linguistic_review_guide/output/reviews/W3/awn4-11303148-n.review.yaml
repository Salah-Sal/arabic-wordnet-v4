      reason: >-
        التعريف الحالي ترجمة حرفية للإنجليزية تفتقر إلى الأسلوب المعجمي
        العربي الأصيل؛ ترتيب المكونات ركيك (بلجيكي متأخر عن صانع آلات
        موسيقية)، وغياب الضبط بالشكل، وإغفال المعلومات الجغرافية والزمنية
        ذات القيمة الموسوعية. يُستبدَل بتعريف موسوعي متكامل.
    authored:
      - type: encyclopedic
        text: >-
          صانِعُ آلاتٍ مُوسِيقِيَّةٍ بَلْجِيكِيُّ الجِنْسِيَّة، وُلِدَ عامَ
          1814م في مدينةِ دِينَان، وتُوُفِّيَ عامَ 1894م في باريس؛ اشْتُهِرَ
          باخْتِراعِه آلةَ السَّاكسُفُون التي سُمِّيَت نِسبةً إليه، وهي آلةٌ
          نَفَخِيَّةٌ خَشَبِيَّةُ جِسْمٍ مَعْدِنِيَّةٌ أَحدَثَت ثَورةً في
          الموسيقى الغربية وموسيقى الجاز.
