# ── المرحلة ١: المراجعة والتوليد ────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «جدلي» مكتوبة بدون تشكيل كامل؛ الشكل المعجمي الصحيح جَدَلِيٌّ."
      - "«جدلي» مشتركة لفظياً مع مصطلح طبي تشريحي (diaphyseal / diaphysary) في معاجم الطب الموحّدة، مما يستدعي الإشارة إلى السياق الفلسفي-المنطقي."
      - "المجموعة تحتوي على لمّة واحدة فقط، وهو فقر إثرائي في شبكة مرادفات هذا المفهوم الفلسفي الثري في التراث العربي."
    observations: >
      المفهوم المعجمي (منطقي ماهر في الجدل) راسخ في التراث العربي الفلسفي والكلامي؛
      فالجدل علم قائم بذاته في المنطق الأرسطي العربي، وله ممارسوه وأساتذته المعروفون
      بأسماء متعددة: الجَدَلِيّ، والمُنَاظِر، والمُحَاجِج. المجموعة الأم (عالم منطق /
      منطقي) تضع هذا المفهوم في سياق منطقي فلسفي، وهو تمييز مناسب. الربط بالمعنى
      الإنجليزي (dialectician) دقيق، غير أن التعريف العربي الحالي «منطقي ماهر في الجدل»
      يعتمد «منطقي» جنساً قريباً وهو من ألفاظ التعريف نفسه في المجموعة الأم؛ ويمكن
      استبداله بجنس أشمل.

  blind_candidates:
    - lemma: "مُنَاظِرٌ"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من الفعل ناظَرَ (باب المفاعلة)، جذر ن-ظ-ر، وزن مُفَاعِل.
        المناظرة في التراث العربي هي الجدل بالحجج المنطقية أمام خصم؛ فالمُنَاظِر
        هو الممارس الفعلي لهذا الفن. الوزن مناسب للمهنة والوظيفة.
    - lemma: "جَدَلِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة إلى الجَدَل على وزن فَعَلِيّ. رغم ورود «الجدل» في التعريف فإن «جَدَلِيّ»
        مصطلح فلسفي مسكوك ثابت في التراث المنطقي يُعبّر عن الانتساب الفعلي إلى
        هذا الفن والبراعة فيه، وليس مجرد وصف حرّ. اجتاز اختبار السكّ: لا يمكن
        إبدال «جدل» بمرادفه دون تغيير المصطلح نفسه.
    - lemma: "مُحَاجِجٌ"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من حَاجَجَ (مفاعلة)، جذر ح-ج-ج، وزن مُفَاعِل. الإحجاج هو
        إيراد الحجج المنطقية القاطعة في المناظرة؛ فالمُحَاجِج من يبرع في بناء
        الحجج الصورية، وهو ملمح أخصّ من المُنَاظِر.
    - lemma: "خَصِيمٌ"
      generation_method: majaz
      justification: >
        وزن فَعِيل للمبالغة من خَصَمَ، جذر خ-ص-م. اللفظ قرآني معروف (وَهُوَ أَلَدُّ الْخِصَامِ)
        ويدل على شدة المراء والجدل. المجاز: إزاحة دلالية من معنى «المنازع» إلى
        «الماهر في الخصومة بالحجج»، وهو قريب من المفهوم المطلوب.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المنفَّذة:
#  ١. بحث دفعي: جدلي، الجدلي، مناظر، المناظر، محاجج، المحاجج، خصيم، الخصيم
#  ٢. جسر إنجليزي: dialectician، dialectic، dialectics
#  ٣. FTS عربي: جدل، مناظرة، مجادل، جدلي
#  ٤. مقاييس اللغة: جدل، نظر، خصم
stage2_evidence:
  per_lemma:

    - lemma: "جَدَلِيٌّ"
      confirm:
        - text: "«الجَدَلِي: المنسوب إلى الجدل (عند المنطقيين): من يَسْتخدِمُ الجَدل»"
          source: "المعجم الوسيط (OCR)"
        - text: "«الجدلي: الْمَنْسُوب إِلَى الجدل وَعند المنطقيين من يستخدم الجدل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: "«جَدَليّ: من (ج د ل) نسبة إلى الجَدَل»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«جَدْلِيّ: diaphysary (diaphyseal)»"
          source: "المعجم الطبي الموحد (2009) — arabterm"
          conflict: "الشكل المنقوص التشكيل (جَدْلِيّ بسكون الدال) يُستخدم في الطب بمعنى تشريحي (diaphyseal) لا صلة له بالجدل المنطقي؛ وهذا اشتراك لفظي مُضلِّل عند غياب التشكيل."
      expands:
        - text: "«الجَدَلِيُّ: المَنْسُوبُ إِلى الجَدَل من الحمام ونحوه: الصَّغيرُ الثَّقيلُ الطيران, لصغره»"
          source: "المعجم الكبير (OCR)"
          addition: "يكشف أن للكلمة معنيَيْن: أحدهما فلسفي (المنطقي الجدلي) والآخر تاريخي لنوع من الحمام. المعنى الفلسفي هو المقصود هنا."

    - lemma: "مُنَاظِرٌ"
      confirm:
        - text: "«الْمَنَاظِرُ: المجادل المحاجّ المِثْل»"
          source: "المعجم الوسيط (OCR)"
        - text: "«المناظر: المجادل المحاج والمثل»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
      contradicts:
        - text: "«المُناظِر: عضو له نفس وظيفة عضو آخر. ولكنه يختلف عنه في المنشأ، مثل جناح الطائر وجناح الخفاش»"
          source: "معجم المصطلحات الطبية (ج.1، 1985) — arabterm"
          conflict: "في الطب يعني «المتناظر» أو «التماثلي» (analogue) لا المُجادِل؛ اشتراك لفظي في السياق التقني."
        - text: "«مُنَاظِر: corresponding»"
          source: "Mathematics and Astronomy — arabterm"
          conflict: "الاستخدام الرياضي بمعنى «المقابل» أو «المتناظر» يختلف عن المعنى الفلسفي المطلوب."

    - lemma: "مُحَاجِجٌ"
      evidence_status: "no_material_found"

    - lemma: "خَصِيمٌ"
      confirm:
        - text: "«الخَصِيمُ: الجَدِلُ الشَّدِيدُ الخُصُومَةِ المُدافِعُ»"
          source: "المعجم الكبير (OCR)"
      expands:
        - text: "«الخَصِيمُ: العالِمُ بالخُصومة, وإِنْ لم يُخاصِمْ»"
          source: "المعجم الكبير (OCR)"
          addition: "التعريف الثاني يُضيف بُعداً معرفياً (العلم بالخصومة) دون اشتراط الممارسة الفعلية؛ لكنه يركز على الجانب العدائي للنزاع لا على المنهج المنطقي."


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "جدلي"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في المعجم الوسيط والمعجم الكبير بالمعنى المطلوب تماماً
        «عند المنطقيين: من يستخدم الجدل». وهي المصطلح المعياري في التراث الفلسفي
        العربي للدلالة على هذا المفهوم. تحتاج إضافة التشكيل الكامل: جَدَلِيٌّ.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        جَدَلِيٌّ يعبّر عن الانتساب العلمي الرسمي إلى فنّ الجدل بوصفه منهجاً
        فلسفياً ومنطقياً أرسطياً محدداً؛ وهو أدق المصطلحات في وصف من درس هذا
        الفن واتخذه تخصصاً أكاديمياً، ويقابل بالضبط اصطلاح (dialectician).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَدَلِيٌّ"

    - lemma: "مُنَاظِرٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        يثبت المعجم الوسيط (OCR وHawramani) صراحةً أن «المناظر: المجادل المحاجّ»،
        وهذا يطابق المفهوم المطلوب مع فارق دلالي وجيه. المُنَاظِر مسكوك معجمياً
        ومستخدم في التراث الفلسفي والكلامي على نطاق واسع (مناظرات المتكلمين).
        الاشتراك اللفظي مع المعنى الطبي والرياضي (analogue, corresponding) محدود
        السياق ولا يعيق الاستخدام الفلسفي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مُنَاظِرٌ يصف الممارس الفعلي للمناظرة بصرف النظر عن تخصصه المنطقي
        الرسمي؛ فهو أعم من «جَدَلِيّ» لأنه قد يُناظر في الكلام أو الفقه أو
        الفلسفة، ويركز على مهارة الحوار والاستدلال الحيّ لا على النسب الأكاديمي
        إلى الجدل كمنهج محدد.
      actions:
        - command: create_entry
          params:
            lemma: "مُنَاظِرٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُحَاجِجٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لا تتوفر له أدلة معجمية مباشرة كمصطلح مسكوك يدل على الشخص الماهر في
        الجدل المنطقي. صحيح اشتقاقياً من جذر ح-ج-ج، لكن المعجم الوسيط يستخدمه
        صفةً تعريفية ضمن تعريف «المناظر» («المجادل المحاجّ»)، وليس كمصطلح قائم
        بذاته. إضافته تزيد الترادف دون سند معجمي كافٍ.

    - lemma: "خَصِيمٌ"
      source: stage1
      decision: removed
      decision_reason: >
        الخَصِيم يحمل دلالة العداء والنزاع («الجَدِلُ الشَّدِيدُ الخُصُومَةِ») أكثر
        من دلالة الكفاءة المنطقية الرسمية في الجدل الفلسفي. يفتقر إلى البُعد
        التقني المنطقي الذي تشترطه المجموعة («منطقي ماهر»)، فضلاً عن أن المجموعة
        الأم هي «عالم منطق» وهو تصنيف يقتضي لمّات تنتمي للفضاء المنطقي-الفلسفي
        لا للفضاء القانوني-الجدلي العام.


