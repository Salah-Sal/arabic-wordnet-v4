# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13994512-n
# agreement / accord — انسجام آراء الناس أو أفعالهم أو طباعهم
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «توافق» مشتركة بين هذه المجموعة والمجموعة الأعلى (awn4-13992690-n) ممّا يُحدث تداخلاً دلالياً"
      - "لمّة «اتفاق» بدون تشكيل في المصدر"
      - "لمّة «توافق» بدون تشكيل في المصدر"
      - "لفظ «اتفاق» غلب عليه في الاستعمال المعاصر المعنى القانوني (المعاهدة) أكثر من معنى الانسجام بين الناس"
    observations: "المجموعة تصف حالة انسجام بين آراء الناس وأفعالهم وطباعهم، وهي تخصيص للمجموعة الأعلى (الانسجام العامّ) بتقييده بالبشر. اللمّتان الحاليتان من جذر واحد (وفق) على وزنَيِ الافتعال والتفاعل، وكلاهما يفيد التشارك والتلاقي. ينبغي إضافة تشكيل كامل للمّتين، والتأكّد من تمايز هذه المجموعة عن المجموعة الأعلى التي تحتوي أيضاً على «توافق»."
  blind_candidates:
    - lemma: "وِفَاق"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر (وفق) على وزن فِعَال، يدلّ على الملاءمة والاجتماع على أمر واحد، مناسب لانسجام الآراء"
    - lemma: "اتِّسَاق"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من الجذر (وسق)، يفيد الانتظام والاتّساق، قريب من معنى الانسجام في الأفعال والطباع"
    - lemma: "تَآلُف"
      generation_method: ishtiqaq
      justification: "مصدر تفاعل من الجذر (ألف) الدالّ على انضمام الشيء إلى الشيء، ويفيد الاجتماع والتحابّ بين القوم"
    - lemma: "مُوَاءَمَة"
      generation_method: ishtiqaq
      justification: "مصدر مفاعلة من الجذر (وأم)، يفيد الملاءمة والمطابقة بين طرفين"


stage2_evidence:
  per_lemma:
    - lemma: "اتِّفَاق"
      confirm:
        - text: "«الاتفاق: موافقة فعل الإنسان القدر ويقال في الخير والشر، يقول اتفق لي خير، واتفق لي شر، والتوفيق نحوه لكنه مختص بالخير، ذكره الراغب.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الاتّفاق: في اللغة: مرادف للموافقة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«تطابق في وجهة النظر»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
      contradicts:
        - text: "«(فى القانون الدولى): اتفاقٌ يتمُّ بين دولتين على إثر نزاعٍ بينهما بإحالة النزاع على التحكيم»"
          source: "المعجم الوسيط"
          conflict: "التعريف الوحيد في الوسيط يقصر المعنى على الاستعمال القانوني الدولي، لا على الانسجام العامّ بين الناس"
      expands:
        - text: "«(4) اتّفاق؛ تطابق؛ انسجام — (5) اتفاق؛ ميثاق؛ معاهدة؛ تفاهم دُوَلي»"
          source: "المورد الحديث (2008)"
          addition: "يبيّن أنّ الاتفاق يحمل معنيين: الانسجام العامّ، والمعاهدة الرسمية"

    - lemma: "تَوَافُق"
      confirm:
        - text: "«(التوافق) (فِي الفلسفة) أَن يسْلك الْمَرْء مَسْلَك الْجَمَاعَة ويتجنب مَا عِنْده من شذوذ فِي الْخلق والسلوك (مج)»"
          source: "المعجم الوسيط"
        - text: "«تطابق في الرأي.»"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
        - text: "«تماثل في العمل أو الفكر أو السلوك.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«(3) تناغُم؛ توافُق؛ تساوُق؛ تناسُق [في الأجزاء] — (4) انسجام [في المشاعر أو المصالح أو الآراء إلخ]»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«التوافق: فِي التباين وَعند عُلَمَاء البديع هُوَ مُرَاعَاة النظير.»"
          source: "دستور العلماء للأحمدنكري"
          addition: "يوسّع الاستعمال إلى البلاغة والبديع"

    - lemma: "وِفَاق"
      confirm:
        - text: "«وِفَاق: من (و ف ق) الملاءمة بين الشيئين، والاجتماع على أمر واحد.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«(الْوِفَاق) (فِي القانون الدولي) اصْطِلَاح يُطلق على مُخْتَلف الاتفاقات الدولية فِي أَي صُورَة كَانَت وَلَو بتبادل الخطابات مثلا (مج)»"
          source: "المعجم الوسيط"
          conflict: "المعاجم الحديثة تقصر الوِفاق على الاصطلاح القانوني الدولي"

    - lemma: "اتِّسَاق"
      contradicts:
        - text: "«consistency» (الرياضيات والفلك)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ARABTERM)"
          conflict: "الاتساق مصطلح تقني بمعنى الاتساق/الاطراد المنطقي لا انسجام الآراء بين الناس"
        - text: "«اتساق (تناغم): حالة تتميز بالأداء الوظيفي المشترك في سلاسة.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: "المعنى الطبي يتعلق بالأعضاء لا بالبشر"

    - lemma: "تَآلُف"
      contradicts:
        - text: "«تألف: مطاوع ألفه، ائتلف. فلانا: استماله»"
          source: "المعجم الوسيط"
          conflict: "التآلف يفيد الاجتماع والاستمالة لا الانسجام في الآراء تحديداً"
        - text: "«chord» (الفيزياء)"
          source: "المعجم الموحد لمصطلحات الفيزياء (ARABTERM)"
          conflict: "شاع استخدامه مصطلحاً تقنياً (الأوتار في الفيزياء)"

    - lemma: "مُوَاءَمَة"
      contradicts:
        - text: "«تكيف تلقائي للعين من أجل رؤية واضحة على مسافات مختلفة. يتحقق ذلك عن طريق تغيير تحدب العدسة.»"
          source: "مسرد المناخ والبيئة (ARABTERM)"
          conflict: "المواءمة في المعاجم التقنية = accommodation/matching، وليس انسجام آراء الناس"


stage3_analysis:
  per_lemma:
    - lemma: "اتِّفَاق"
      decision: confirmed
      decision_reason: "لفظ عربي فصيح من جذر (وفق) على وزن افتعال يفيد المشاركة، ومعناه اللغوي العامّ (الموافقة والتطابق في الرأي) ثابت في المعاجم الكلاسيكية والحديثة وإن غلب عليه المعنى القانوني في بعض المعاجم المعاصرة"
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على حصول نتيجة الاتفاق ذاتها (حالة التطابق في الرأي أو الفعل)، وقد يحمل بُعداً إرادياً واعياً أكثر من التوافق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اتِّفَاق"

    - lemma: "تَوَافُق"
      decision: confirmed
      decision_reason: "لفظ فصيح على وزن تَفَاعُل يفيد المشاركة والتبادل، وتعريف الوسيط الفلسفي (سلوك المرء مسلك الجماعة) يطابق معنى المجموعة تماماً، والشواهد المعجمية وافرة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على عملية التلاقي التدريجي والانسجام الطبيعي بين الأطراف، وفيه بُعد سلوكي اجتماعي (التكيّف مع الجماعة) أكثر من الاتفاق"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَوَافُق"

    - lemma: "وِفَاق"
      source: stage1
      decision: removed
      decision_reason: "غلب على اللفظ في الاستعمال المعاصر المعنى الدبلوماسي القانوني (entente)، والتعريف اللغوي العامّ (الملاءمة بين شيئين) مبهم ولا يخصّ الآراء والأفعال البشرية. كما أنّ إضافته تُكرّر جذر (وفق) الموجود في اللمّتين الأصليتين دون إضافة دلالية واضحة"

    - lemma: "اتِّسَاق"
      source: stage1
      decision: removed
      decision_reason: "المعاجم تقصره على المعنى التقني (consistency/الاطراد) في الرياضيات والطب، ولا يدلّ على انسجام آراء الناس أو طباعهم"

    - lemma: "تَآلُف"
      source: stage1
      decision: removed
      decision_reason: "الدلالة الأصلية (الاجتماع والاستمالة) قريبة لكن شاع اللفظ في السياقات التقنية (chord في الفيزياء، agglomerating)، ومعناه اللغوي أقرب إلى التجمّع والتحابّ منه إلى انسجام الآراء والأفعال"

    - lemma: "مُوَاءَمَة"
      source: stage1
      decision: removed
      decision_reason: "المعاجم التقنية تقصر المواءمة على المطابقة الفنية (accommodation/matching/adjustment)، وليس لها استعمال معجمي موثّق في سياق انسجام آراء الناس وطباعهم"


