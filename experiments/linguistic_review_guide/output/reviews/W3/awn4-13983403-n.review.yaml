# مراجعة المجموعة الترادفية — awn4-13983403-n (unreality / irreality)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «لا واقعية» مكتوبة بدون تشكيل وبمسافة بين «لا» و«واقعية»، والصيغة المعيارية في المعاجم الحديثة هي «اللَّاوَاقِعِيَّة» ككلمة واحدة"
      - "اللمّة «وهمية» بدون تشكيل؛ تحتاج إلى ضبط كامل"
      - "«وهمية» مصدر صناعي من الصفة «وهميّ»، ودلالتها الأصلية «حالة كون الشيء وهمياً» وهي قريبة لكنها تركّز على الإيهام أكثر من انعدام الوجود الموضوعي"
    observations: "المجموعة تمثّل مفهوماً فلسفياً مجرداً (حالة اللاوجود الموضوعي أو الخيالية) وهو من نمط المصادر الصناعية المولَّدة. اللمّتان الموجودتان تغطّيان جانبين مختلفين: «لا واقعية» تركّز على انعدام الواقعية، و«وهمية» على الطابع الوهمي الخيالي. المفهوم تحت جنس أعلى هو «عدم / لا وجود» مما يؤكد البُعد الوجودي للمصطلح."
  blind_candidates:
    - lemma: "لَاوَاقِعِيَّة"
      generation_method: tarkib
      justification: "مركب من «لا» النافية للجنس و«واقعيّة» (المصدر الصناعي من واقع)، يدل على حالة انعدام الواقعية، وهو المقابل العربي المباشر لـ unreality في المعاجم الحديثة كالمورد"
    - lemma: "وَهْمِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «وَهْم» على وزن فَعْلِيَّة، يدل على حالة كون الشيء وهمياً لا حقيقة له، وهو مشتق عربي أصيل من جذر وهم الذي يدور حول خطرات القلب والتخيّل"
    - lemma: "خَيَالِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «خَيَال»، يدل على حالة كون الشيء خيالياً لا وجود له في الواقع، والجذر خيل يدل على التلوّن والتشكّل في الذهن"
    - lemma: "عَدَمِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «عَدَم»، يدل على حالة اللاوجود، لكنه قريب جداً من الجنس الأعلى (عدم / لا وجود) وقد يلتبس بالعدمية الفلسفية (nihilism)"


stage2_evidence:
  per_lemma:
    - lemma: "لا واقعية"
      confirm:
        - text: "«(1) اللاواقعيّة (2) شيء متخيَّل أو ملفَّق.»"
          source: "المورد الحديث (2008) — ترجمة unreality"
        - text: "«(1) غير حقيقيّ (2) مصطَنَع (3) كاذب؛ زائف (4) وهميّ.»"
          source: "المورد الحديث (2008) — ترجمة unreal"
      expands:
        - text: "«لا واقع: كل ما يرتبط بمتخيل طوباوي، لا يعكس واقعا يوميا أو محاكاة برفض الواقع الفيزيائي وتعويضه بالهوس والهذيان.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يوسّع المفهوم ليشمل البُعد الأدبي والنقدي للاواقعية بوصفها رفضاً للواقع الفيزيائي"
        - text: "«لا حقيقة (ال...): يطلق على تمثيل لا يكشف هويته التمثيلية بسبب فارق (فضائي / زمني) من هنا يرتبط اللاتوقع بكل وسائل التعبير (سرد أو شريط أو برنامج).»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002) — ترجمة unreality"
          addition: "مصطلح بديل «لا حقيقة» يُستخدم في سياق اللسانيات والسرديات"

    - lemma: "وهمية"
      confirm:
        - text: "«(1) خياليّ؛ وهميّ (2) واهٍ؛ ضعيف.»"
          source: "المورد الحديث (2008) — ترجمة insubstantial"
      expands:
        - text: "«الوَهْمُ: من خَطَراتِ القلب، والجمع أوْهامٌ. وتَوَهَّمَ الشيءَ: تخيَّله وتمثَّلَه، كان في الوجود أو لم يكن.»"
          source: "المحكم والمحيط الأعظم لابن سيده"
          addition: "يؤكد أن التوهّم يشمل تمثّل ما ليس له وجود، وهو صميم مفهوم اللاواقعية"
        - text: "«الوَهْمُ: من خطرات القلب. وتَوهَّمْتُ الشيءَ وتفرّسْتُه بمعنى واحد.»"
          source: "لسان العرب لابن منظور"
          addition: "يعزّز الصلة بين الوهم والتخيّل الذهني لما لا حقيقة له"

    - lemma: "خَيَالِيَّة"
      contradicts:
        - text: "«الخَيالِيَّةُ: رواية أو قصَّةٌ شِعْرِيَّةٌ أو نَثْرِيَّةٌ ظهرتْ فى القُرونِ الوُسْطَى, موضوعُها المغامراتُ الفروسِيَّةُ, والهَوَى العُذْرِىُّ.»"
          source: "المعجم الكبير"
          conflict: "المصطلح مسجّل في المعجم الكبير بمعنى جنس أدبي (romance) لا بمعنى حالة اللاواقعية المجردة"
      expands:
        - text: "«الخَيَالُ: أصله القوة المجردة كالصورة المتصورة في المنام وفي المرآة وفي القلب، ثم استعمل في صورة كل أمر متصور.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "الجذر خيل يدل على التصوّر الذهني لكن «خيالية» كمصدر صناعي اختُصّ بالجنس الأدبي"

    - lemma: "عَدَمِيَّة"
      confirm:
        - text: "«عدميّة»"
          source: "مسرد الفلسفة وعلم النفس — ArabTerm (بدون تعريف)"
      contradicts:
        - text: "مدخل بدون تعريف في مسرد الفلسفة، والمصطلح يلتبس بالعدمية الفلسفية (nihilism) التي هي مذهب فكري لا حالة وجودية"
          source: "ملاحظة تحليلية"
          conflict: "التباس مع العدمية (nihilism) كمذهب فلسفي، وتداخل مع الجنس الأعلى (عدم / لا وجود)"


stage3_analysis:
  per_lemma:
    - lemma: "لَاوَاقِعِيَّة"
      decision: confirmed
      decision_reason: "مصطلح مسجّل في المورد الحديث مقابلاً لـ unreality، وفي المعجم الموحد لمصطلحات اللسانيات بصيغة «لا واقع». يحتاج تصحيح التشكيل والكتابة ككلمة واحدة وفق الاستعمال المعجمي الحديث."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "تدل على حالة انعدام الصفة الواقعية للشيء، بتركيز على البُعد المعرفي والفلسفي (عدم المطابقة للواقع الموضوعي)، وهي أعمّ من الوهمية التي تركّز على الإدراك الذاتي الخاطئ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَاوَاقِعِيَّة"

    - lemma: "وَهْمِيَّة"
      decision: confirmed
      decision_reason: "مصدر صناعي عربي أصيل من جذر «وهم» المتواتر في المعاجم الكلاسيكية بدلالة التخيّل وإدراك ما لا وجود له. الصفة «وهميّ» مسجّلة في المورد مقابلاً لـ insubstantial وimaginary، والمصدر الصناعي منها يدل على الحالة المجردة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدل على حالة كون الشيء وهمياً، أي ناتجاً عن خطرات القلب والتخيّل الذاتي لا عن واقع موضوعي، مع إيحاء بالغلط والسهو في الإدراك"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَهْمِيَّة"

    - lemma: "خَيَالِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المصطلح مسجّل في المعجم الكبير بمعنى جنس أدبي (رواية فروسية) لا بمعنى حالة اللاواقعية المجردة، مما يولّد اشتراكاً لفظياً غير مرغوب. كما أن الصفة «خيالي» تدل على ما هو من نسج الخيال بينما المطلوب هنا حالة عدم الوجود الموضوعي."

    - lemma: "عَدَمِيَّة"
      source: stage1
      decision: removed
      decision_reason: "يلتبس بالعدمية الفلسفية (nihilism) وهو مذهب فكري مختلف تماماً. كما يتداخل دلالياً مع الجنس الأعلى «عدم / لا وجود» تداخلاً يكاد يكون تطابقاً، فلا يضيف تمييزاً دلالياً واضحاً."


