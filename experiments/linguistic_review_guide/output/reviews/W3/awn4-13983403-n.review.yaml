    authored:
      - type: terminological
        text: "حالةٌ من حالاتِ العَدَمِ يكونُ فيها الشيءُ مُفتقِراً إلى الوجودِ الموضوعيِّ في الواقعِ، فلا يَتحقَّقُ إلّا في الذِّهنِ أو التَّوهُّمِ."
