  per_lemma:
    - lemma: "أودوبون"
      evidence_status: "no_material_found"

    - lemma: "جون جيمس أودوبون"
      evidence_status: "no_material_found"

    - lemma: "أُودُوبُون"
      evidence_status: "no_material_found"

    - lemma: "جُون جيمس أُودُوبُون"
      evidence_status: "no_material_found"

    - lemma: "أُودَابُون"
      evidence_status: "no_material_found"

    - lemma: "جيمس أُودُوبُون"
      evidence_status: "no_material_found"

  contextual_findings:
    note: >
      لم يرد اسم أودوبون ولا أي تعريب له في قاعدة البيانات المعجمية العربية (760,660 مدخل).
      غير أن الاستعلامات كشفت عن مصطلحات ذات صلة بمجال التعريف:
    terms:
      - headword: "الطِّيَارِيّ"
        text: "«الطِّيَاريّ: العالِم بالطّيور.»"
        source: "المورد الحديث (2008)"
        relevance: "يوفّر المصطلح التقني الدقيق لـ«ornithologist» الذي ينبغي اعتماده في التعريف"
      - headword: "طِيَارِيّ"
        text: "«طِيَاريّ: متعلّق بعلم الطيور.»"
        source: "المورد الحديث (2008)"
        relevance: "الوصف النسبي لعلم الطيور"
      - headword: "الطِّيَارَة"
        text: "«الطِّيارة: علم الطّيور أو رسالة فيه.»"
        source: "المورد الحديث (2008)"
        relevance: "المصطلح العربي لـ«ornithology»"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "أودوبون"
      decision: confirmed
      decision_reason: >
        تعريب شائع ومستقرّ للكنية «Audubon»؛ وهو الشكل المختصر الأكثر تداولاً
        في المصادر العربية للإحالة إلى هذا الشخص. لا أدلة معجمية عليه (متوقّع
        لعلَم شخصي أجنبي)، لكنه مقبول بوصفه تعريباً معتاداً. يحتاج إلى تصحيح
        التشكيل ليصبح أُودُوبُون.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الشكل المختصر (الكنية وحدها)؛ يُستخدم في السياقات الصحفية والتعليمية
        والمراجع غير الرسمية، ويُغني عن ذكر الاسم الكامل حين يكون السياق
        واضحاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُودُوبُون"

    - lemma: "جون جيمس أودوبون"
      decision: confirmed
      decision_reason: >
        الاسم الثلاثي الكامل الرسمي للشخص؛ ضروري للتمييز الدقيق في السياقات
        الأكاديمية والموسوعية. يُكمّل الشكل المختصر ولا يُغني عنه. يحتاج إلى
        تصحيح التشكيل ليصبح جُون جيمس أُودُوبُون.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الثلاثي الكامل الرسمي؛ يُفضَّل في الكتابة الأكاديمية والموسوعية
        لضبط الهوية وتمييزها عن غيرها، ويُستحضر عادةً عند الذكر الأول للشخص
        أو في العناوين والفهارس.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُون جيمس أُودُوبُون"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أُودُوبُون"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق شكلاً ودلالةً مع اللمّة الموجودة «أودوبون» بعد تصحيح التشكيل؛
        لا حاجة لإضافته مجدداً.

    - lemma: "جُون جيمس أُودُوبُون"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق شكلاً ودلالةً مع اللمّة الموجودة «جون جيمس أودوبون» بعد
        تصحيح التشكيل؛ لا حاجة لإضافته مجدداً.

    - lemma: "أُودَابُون"
      source: stage1
      decision: removed
      decision_reason: >
        ضبط غير معياري في المصادر العربية المعاصرة؛ يميل العرب إلى ضم الواو
        في «أُودُوبُون» لا فتحها، وهذا الشكل البديل قد يُحدث لبساً مع كنى
        أخرى ولا يضيف قيمة على الشكل المعتمد.

    - lemma: "جيمس أُودُوبُون"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة ناقصة تستبعد الاسم الأول «جون»؛ أقل دقة في التعريف بالشخص مقارنةً
        بالشكل الكامل الموجود، ولا تُضيف تمييزاً دلالياً جديداً.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "عالم طيور وفنان أمريكي (ولد في هايتي) اشتهر بلوحاته لطيور أمريكا (1785-1851)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية قريبة من النص الإنجليزي. مشكلتان رئيسيتان:
        (١) «عالم طيور» عبارة وصفية عامية؛ المصطلح التقني المثبت في المورد الحديث
        هو «طِيَارِيّ» (ornithologist). (٢) الأقواس والشرطات أسلوب مُستورد من
        الكتابة الأجنبية؛ يُفضَّل إعادة الصياغة بأسلوب الموسوعة العربية.
    authored:
      - type: encyclopedic
        text: >
          طِيَارِيٌّ وفنانٌ أمريكيٌّ، وُلِد في هايتي (1785–1851)، اشتُهِر
          بإنجازه الموسوعي «طيور أمريكا»، وهو أطلسٌ ضخمٌ يضمّ رسوماً دقيقةً
          تُصوَّر فيها أكثر من أربعمئة نوع من طيور القارة الأمريكية بأسلوب
          فنيٍّ وعلميٍّ رفيع.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
