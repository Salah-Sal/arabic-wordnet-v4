# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أودوبون، جون جيمس أودوبون) تفتقران إلى التشكيل الكامل"
      - "التعريف الحالي يستخدم «عالم طيور» وهي صياغة عامية؛ المصطلح التقني الدقيق هو «طِيَارِيّ» (ornithologist) كما أثبته المورد الحديث"
      - "التعريف يبدو ترجمةً حرفيةً للنص الإنجليزي بدلاً من صياغة معجمية عربية مستقلة"
      - "المجموعة تصف علَماً شخصياً غربياً بحتاً، مما يُصعّب إيجاد تعريب معجمي كلاسيكي"
    observations: >
      المجموعة الترادفية تمثّل علَماً شخصياً تاريخياً هو جون جيمس أودوبون
      (John James Audubon)، عالِم الطيور والفنان الأمريكي الفرنسي-الهايتي الأصل
      (1785–1851). اللمّتان المتاحتان في المجموعة تعريبان صوتيان للاسم الأجنبي:
      الأولى مختصرة (الكنية وحدها) والثانية الاسم الثلاثي الكامل. نظراً لطبيعة
      العَلَم الشخصي الأجنبي، فإن أدوات الاشتقاق والمجاز والتركيب لا تُسعف هنا،
      ويبقى التعريب الصوتي المنهج الوحيد الممكن. لا يوجد تراث معجمي عربي كلاسيكي
      لهذا الاسم. وجدنا في قاعدة البيانات مصطلح «طِيَارِيّ» (ornithologist) من
      المورد الحديث، وهو مفيد لتحسين التعريف.
  blind_candidates:
    - lemma: "أُودُوبُون"
      generation_method: taarib
      justification: >
        تعريب صوتي مباشر للكنية الأجنبية «Audubon» ذات الأصل الفرنسي؛
        وهي الصيغة المختصرة الأكثر تداولاً للإحالة إلى هذا الشخص في المصادر
        الأجنبية والعربية المعاصرة.
    - lemma: "جُون جيمس أُودُوبُون"
      generation_method: taarib
      justification: >
        تعريب للاسم الثلاثي الكامل «John James Audubon»؛ يُستخدم في السياقات
        الرسمية والأكاديمية للتمييز الدقيق بين هذا الشخص وسواه.
    - lemma: "أُودَابُون"
      generation_method: taarib
      justification: >
        ضبط بديل للكنية «Audubon» وفق نطق أقرب للأصل الفرنسي (حيث يميل صوت الـ«u»
        إلى الفتح)؛ يُحتمل ورودها في بعض المصادر العربية القديمة أو المترجمة.
    - lemma: "جيمس أُودُوبُون"
      generation_method: taarib
      justification: >
        تعريب ثنائي يضم الاسم الأوسط والكنية؛ صيغة أقل شيوعاً تُستخدم أحياناً
        اختصاراً في المراجع التي تتجنب الاسم الأول.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة:
# ١. مطابقة دقيقة دفعية: اودوبون، الاودوبون، جون جيمس اودوبون،
#    اودبون، اوديبون، عالم طيور، عالم الطيور → نتيجة واحدة فقط
#    (عالم الطيور = avifauna من مجال الطاقة المتجددة، غير ذي صلة)
# ٢. الجسر الإنجليزي: Audubon, John James Audubon, ornithologist →
#    وجد: الطياري (ornithologist) من المورد الحديث
# ٣. FTS عربي: طياري، علم الطيور، عالم طيور →
#    وجد: طياري (adj) + الطيارة (علم الطيور) من المورد الحديث
