          text: >
            طِيَارِيٌّ وفنانٌ أمريكيٌّ، وُلِد في هايتي (1785–1851)، اشتُهِر
            بإنجازه الموسوعي «طيور أمريكا»، وهو أطلسٌ ضخمٌ يضمّ رسوماً دقيقةً
            تُصوَّر فيها أكثر من أربعمئة نوع من طيور القارة الأمريكية بأسلوب
            فنيٍّ وعلميٍّ رفيع.

