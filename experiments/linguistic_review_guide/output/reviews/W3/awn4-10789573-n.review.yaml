# watchmaker / horologist / horologer
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "المركب «صانع ساعات» يُثير تساؤلاً: هل هو مصطلح مسكوك أم عبارة وصفية حرة؟ وغياب تاء التعريف في الجزء الثاني يجعله أقل تثبيتاً معجمياً من «صانع الساعات»"
      - "التعريف الحالي يقتصر على الصنع والإصلاح ويُغفل الجانب العلمي-التقني الذي يحمله مصطلح horologist"
    observations: >
      المجموعة تغطي مفهوم الحرفي المتخصص في صناعة الساعات وإصلاحها. الإنجليزية تُفرّق بين watchmaker
      (الحِرفي اليدوي) وhorologist (العالِم بعلم الساعات والتوقيت)، في حين تجمع العربية المفهومَيْن
      في مصطلح واحد في الغالب. اللمّة «ساعاتي» نسبة إلى «ساعات» (جمع ساعة) على نمط أسماء الحِرَف
      العربية الشائعة. المجموعة تحتاج إلى تشكيل اللمّات وتحسين التعريف.
  blind_candidates:
    - lemma: "سَاعَاتِيّ"
      generation_method: ishtiqaq
      justification: >
        مشتق بالنسبة من «ساعات» (جمع ساعة) على نمط أسماء الحِرَف العربية كالعطّار والنجّار
        والحدّاد؛ يُطلق على من يتّخذ الساعات حرفةً: صنعاً أو إصلاحاً أو بيعاً. الوزن «فَعَالِيّ»
        منتج في العربية للنسبة إلى جموع المؤنث المختومة بألف وتاء.
    - lemma: "صَانِعُ الساعَاتِ"
      generation_method: tarkib
      justification: >
        مركب إضافي (إضافة اسم الفاعل إلى معموله المعرَّف) يصف من يختص بصناعة الساعات؛
        الجزء الأول «صانع» اسم فاعل من صَنَعَ يَصْنَعُ، والثاني «الساعات» جمع ساعة معرَّفاً.
        صيغة مستقيمة في العربية الفصيحة.
    - lemma: "مُوَقِّت"
      generation_method: majaz
      justification: >
        اسم فاعل من وقَّتَ (باب التفعيل)، أُطلق تاريخياً على القائم بضبط أوقات الصلاة في
        المساجد بالاستعانة بالأدوات الفلكية والساعات الشمسية والمائية. إزاحة دلالية نحو من
        يتعامل بالساعات وآليات قياس الوقت صنعاً وإصلاحاً؛ استحياء للفظ التراثي.
    - lemma: "مُهَنْدِسُ الساعَاتِ"
      generation_method: tarkib
      justification: >
        مركب إضافي يُفيد المتخصص التقني في هندسة الساعات وميكانيكها الدقيق، مستوحى من
        التمييز الحديث بين الحرفي التقليدي (ساعاتي) والمتخصص التقني المتعلم. يُبرز الجانب
        الهندسي الذي يحمله مصطلح horologist.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# استعلامات نُفِّذت: (١) مطابقة دفعية لجميع اللمّات والمرشحات
# (٢) جسر إنجليزي لجميع مصطلحات OEWN (٣) FTS عربي (٤) مقاييس اللغة لابن فارس
stage2_evidence:
  per_lemma:
    - lemma: "ساعاتي"
      confirm:
        - text: "«سَاعَاتِيّ — [فصيحة] — أجاز مجمع اللغة المصري النسب إلى المختوم بالألف والتاء في الأعلام وما يجري مجراها من أسماء الأجناس والحرف والمصطلحات دون حذف الألف والتاء. مثال: تَرَكَ ساعته عند الساعاتيّ لإصلاحها»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (ت 2003م)"
        - text: "«سَاعَاتي: من (س و ع) نسبة إلى ساعات جمع ساعة، والساعاتي: لقب من يصنع الساعات أو يبيعها أو يصلحها»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985م)"
        - text: "«السّاعاتيّ: صانع الساعات أو مُصلحها» [translation_en: clockmaker]"
          source: "المورد الحديث (2008م)"
        - text: "«الساعاتيّ: صانعُ السّاعات» [translation_en: horologer]"
          source: "المورد الحديث (2008م)"
        - text: "«الساعاتيّ: صانع السّاعات» [translation_en: horologist]"
          source: "المورد الحديث (2008م)"
        - text: "«السّاعاتيّ: صانع السّاعات أو مصلحُها» [translation_en: watchmaker]"
          source: "المورد الحديث (2008م)"
        - text: "«ساعاتي: صانع الساعات وبائعها، نسبة إلى ساعة (بوشر)»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"

    - lemma: "صانع ساعات"
      confirm:
        - text: "«الصَّانِعُ: كُلُّ مُحْتَرِفٍ بيده مُتَكَسِّبٌ من حِرْفَتِه»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«الصَّانِعُ: مَن يصنع بيديه، مَنْ يحترف الصناعة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الصَّانِع: من يصنع بيدَيْهِ ومن يحترف الصِّنَاعَة (ج) صناع»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998م)"
        - text: "«صانع» [translation_en: artisan] في الفلسفة وعلم النفس وعلم الاجتماع"
          source: "مسردات ALECSO (ARABTERM)"
      expands:
        - text: "«الساعاتيّ: صانع الساعات أو مصلحها» — يتّخذ المعجم من «صانع الساعات» تعريفاً للمصطلح الأحادي «ساعاتي»"
          source: "المورد الحديث (2008م)"
          addition: "تكشف الشاهد أن الصياغة المعيارية للمركب هي «صانع الساعات» (بالتعريف) لا «صانع ساعات» (بالتنكير)، وأن المعجم يُقدِّم المركب الإضافي كتعريف للمصطلح الاقتصادي لا مصطلحاً مستقلاً"

    - lemma: "مُوَقِّت"
      contradicts:
        - text: "«المُوَقِّتُ: من يراعي الأوقات والأهلَّة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "المُوَقِّت يعني من يرصد الأوقات الفلكية ويحدِّدها (كمواقيت الصلاة) لا من يصنع الساعات أو يصلحها؛ الدلالة تتعلق بضبط الوقت لا بصناعة الآلات"
        - text: "«الموقت: من يُرَاعِي الْأَوْقَات والأهلة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998م)"
          conflict: "تكرار التعريف المعجمي يُثبت انصراف الدلالة إلى راصد الأوقات الفلكية"
        - text: "«مُوَقِّت» [translation_en: synchronizer] في الكيمياء؛ «مُوَقَّت» [translation_en: timed] في الإعلام والتواصل؛ «مُوَقَّت» [translation_en: interim] في الطب"
          source: "مصطلحيات ARABTERM متعددة"
          conflict: "جميع التقابلات الإنجليزية المعجمية للمُوَقِّت (synchronizer / timed / interim) بعيدة كلياً عن دلالة صانع الساعات"

    - lemma: "مُهَنْدِسُ الساعَاتِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──
    - lemma: "ساعاتي"
      decision: confirmed
      decision_reason: >
        اللمّة موثَّقة في أربعة معاجم حديثة معتمدة وصادرة حكم المجمع المصري بفصاحتها؛
        تجمع في مصطلح اقتصادي مسكوك واسع الانتشار دلالةَ الصنع والإصلاح والتخصص في
        الساعات، وهي الأكثر تداولاً وحضوراً في اللغة المعاصرة. تحتاج إلى تحديث التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُعبِّر عن الحِرفي المتخصص في الساعات تعبيراً جامعاً (صنع + إصلاح + بيع) في
        لفظ واحد مختصر شائع في الحياة اليومية والتداول المهني؛ يحمل طابع الاسم الحرفي
        المتخصص بالمعنى الشامل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَاعَاتِيّ"

    - lemma: "صانع ساعات"
      decision: confirmed
      decision_reason: >
        المركب الإضافي موثَّق كلٌّ من مكوِّنَيه (صانع / ساعات) توثيقاً معجمياً راسخاً،
        والتركيب يُستخدم في المعاجم الثنائية تعريفاً للمفهوم. يُقبل بوصفه مركباً اصطلاحياً
        إضافياً يُبرز الجانب الحِرفي التخصصي. يحتاج إلى تحديث التشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على بُعد الصناعة والتصنيع الحِرفي الدقيق دون أن يستوعب صراحةً الإصلاح
        أو البيع؛ أكثر رسميةً وتخصصاً من «ساعاتي» ويُستخدم في السياقات الوصفية والتقنية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَانِعُ سَاعَاتٍ"

    # ── مرشحات المرحلة ١ ──
    - lemma: "سَاعَاتِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق تماماً للمّة «ساعاتي» القائمة بعد إضافة التشكيل؛ التوليد الأعمى أكَّد صحة
        اللمّة الموجودة واستقلاليتها المعجمية، ولا مسوِّغ لإضافة مدخل جديد مكرِّر.

    - lemma: "صَانِعُ الساعَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        مرادف مباشر للمّة القائمة «صانع ساعات» مع فارق التعريف (ال-) في الجزء الثاني فحسب؛
        إضافته تُفضي إلى تكرار غير مُبرَّر. اللمّة القائمة بعد تشكيلها (صَانِعُ سَاعَاتٍ)
        تغطي المعنى كافياً.

    - lemma: "مُوَقِّت"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة المعجمية المُثبتة بمصادر متعددة تنصرف إلى ضابط الوقت الفلكي ومراقب الأهلة
        لا إلى صانع الساعات؛ الإزاحة الدلالية المقترحة لا تسندها شواهد معجمية موثَّقة على
        الاستخدام في مجال صناعة الساعات. التقابلات الإنجليزية في المعاجم المتخصصة
        (synchronizer / timed / interim) تؤكد ابتعاد المعنى.

    - lemma: "مُهَنْدِسُ الساعَاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على شاهد معجمي على هذا المركب. لا يجتاز اختبار السكّ: يمكن إبدال «الساعات»
        بأي آلة دقيقة أخرى (مُهَنْدِسُ الكاميرات / المجاهر) فيبقى وصفاً صالحاً، مما يكشف
        أنه عبارة وصفية لا مصطلح مسكوك. فضلاً عن أن «مهندس» تحمل بُعداً أكاديمياً لا
        يُطابق الدلالة الحرفية للمفهوم.


