# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. التوليد الأعمى — قبل الاطلاع على اللمّات الموجودة
  # المدخل من synset_info_masked.yaml:
  #   تعريف: معماري اسكتلندي صمم العديد من المباني العامة في إنجلترا واسكتلندا (1728-1792)
  #   لا لمّات
  blind_candidates:
    - lemma: "رُوبَرْت آدَم"
      generation_method: taarib
      justification: >
        تعريب كامل الاسم الإنجليزي: Robert ← رُوبَرْت، Adam ← آدَم.
        السنوات (1728-1792) وصفة «معماري اسكتلندي» تحدّد الشخص تحديداً قاطعاً.
        هذه هي الطريقة المعيارية في العربية لنقل أسماء الأعلام الغربيين،
        وهي الصيغة المعتمدة في الموسوعات العربية الكبرى.

    - lemma: "آدَم الاسْكُتْلَنْدِيّ"
      generation_method: tarkib
      justification: >
        مركّب وصفي (إضافة + نسبة جغرافية) يضمّ اللقب العائلي مع الانتساب لاسكتلندا،
        يُقصد به رفع الإلباس بين هذا المعماري وآدم أبي البشر الراسخ في الثقافة العربية.

    - lemma: "آدَم المُعَمَّار"
      generation_method: tarkib
      justification: >
        مركّب إضافي: اللقب + الحرفة على وزن مُفَعَّال (صيغة مبالغة/احتراف).
        يُعرَّف الشخص بانتمائه المهني ليُفرَّق بينه وبين كلّ من يحمل لقب «آدم».

    - lemma: "رُوبَرْت"
      generation_method: taarib
      justification: >
        تعريب الاسم الأول وحده. أقلّ دقةً من الاسم الكامل لكنه قد يُستعمل
        في السياقات التي يُفترض فيها معرفة مسبقة بالشخص المقصود.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - >
        تعارض دلالي صريح في لمّة «آدم» منفردةً: يُحيل هذا اللفظ في الوعي العربي
        مباشرةً إلى «أبي البشر» (الأنثروبوس الأول في التراث الإبراهيمي)،
        لا إلى معماري اسكتلندي من القرن الثامن عشر. استخدامه وحده لمّةً
        في مجموعة خاصة بروبرت آدم يوقع في إلباس شديد.
      - >
        المجموعة خاصة بشخص تاريخي بعينه؛ يستحق التحقق من ملاءمة POS=n
        مقارنةً بـ proper_noun (وإن كانت الاصطلاحات ربما تتبع OEWN الذي يضع n).
      - >
        التعريف العربي الحالي مقبول غير أنه يغفل الطراز المعماري الكلاسيكي الجديد
        المنسوب إلى آدم (Adamesque style) الذي يُعدّ أبرز أثره في تاريخ العمارة.
    observations: >
      مجموعة ترادفية خاصة بالمعماري البريطاني-الاسكتلندي روبرت آدم (1728-1792)،
      مؤسِّس «الطراز الآدَمِيّ» في العمارة الكلاسيكية الجديدة (Neoclassicism).
      اللمّتان الحاليتان هما «آدم» و«روبرت آدم». أما «روبرت آدم» فهي الصيغة
      الصحيحة والكاملة لهذا العَلَم في المصادر العربية الموسوعية، وتحتاج فقط
      تشكيلاً كاملاً. أما «آدم» منفردةً فتتعارض مع معناها العربي الراسخ
      «أبو البشر»، وحذفها من المجموعة أسلم.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# ميزانية الاستعلامات المُستخدمة: 4 استعلامات
#   ١. مطابقة دفعية: آدم / الادم / روبرت آدم / روبرت (+ صيغ ال-)
#   ٢. إثراء بالمعرّف: definitions للمداخل 9، 71، 404، 100225
#   ٣. جسر إنجليزي: "Adam" OR "Robert Adam" OR "architect"
#   ٤. مقاييس اللغة (dictionary_id=151): headword_norm = 'ادم'
stage2_evidence:
  per_lemma:

    - lemma: "آدم"
      contradicts:
        - text: "«آدَمُ: أَبُو الْبَشَرِ»"
          source: "المعجم الوسيط (entry_id=404)"
          conflict: >
            يُعرَّف «آدم» في المعجم الوسيط تعريفاً حصرياً وحيداً بأنه أبو البشر.
            لا يرد في المعجم أيّ إشارة لاسم عائلي غربي أو معماري أجنبي.
            الاستخدام منفردةً لمّةً تحيل إلى المعماري الاسكتلندي يتناقض مع
            هذا المعنى الراسخ تناقضاً صريحاً.
        - text: >
            «الْهَمْزَةُ وَالدَّالُ وَالْمِيمُ أَصْلٌ وَاحِدٌ، وَهُوَ الْمُوَافَقَةُ
            وَالْمُلَاءَمَةُ ... وَلِذَلِكَ سُمِّيَ آدَمُ عَلَيْهِ السَّلَامُ لِأَنَّهُ
            أَخَذَ مِنْ أَدَمَةِ الْأَرْضِ»
          source: "مقاييس اللغة لابن فارس (entry_id=985006، dictionary_id=151)"
          conflict: >
            يُثبت ابن فارس أن «آدم» عَلَمٌ عربي راسخ للأنثروبوس الأول المأخوذ
            من أَدَمَة الأرض (طبقتها الرابعة)، ويربط الجذر أدم كلَّه بالموافقة
            والملاءمة. لا يُذكر معنى آخر، ولا إحالة إلى أعلام أجنبية.
      expands:
        - text: >
            «(1) آدَم. (2) النزعة البشرية إلى الإثم [وتُدعى أيضًا the old Adam]»
          source: "المورد الحديث (2008) — entry_id=668890"
          addition: >
            يُضيف المورد الحديث معنيين: العَلَم آدم، والتعبير الإنجليزي
            «the old Adam» بمعنى «النزعة البشرية إلى الإثم».
            كلاهما لا صلة له بروبرت آدم المعماري، ما يؤكد أن الدلالة
            الشائعة لـ«آدم» في العربية هي أبو البشر وحده.

    - lemma: "روبرت آدم"
      evidence_status: "no_material_found"

    - lemma: "رُوبَرْت آدَم"
      evidence_status: "no_material_found"

    - lemma: "آدَم الاسْكُتْلَنْدِيّ"
      evidence_status: "no_material_found"

    - lemma: "آدَم المُعَمَّار"
      evidence_status: "no_material_found"

    - lemma: "رُوبَرْت"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: آدم ──
    - lemma: "آدم"
      decision: removed
      decision_reason: >
        تعارض صريح ودائم مع المعنى العربي الراسخ: المعاجم العربية الكلاسيكية
        والحديثة (الوسيط، المقاييس، المورد) تُعرّف «آدم» بأنه أبو البشر وحسب.
        استخدام هذه اللمّة مجرّدةً بلا قرينة تصريفية للإحالة إلى معماري
        اسكتلندي من القرن الثامن عشر يُفضي إلى إلباس دلالي شديد،
        ويُعطي القاريءَ العربي انطباعاً خاطئاً عن المقصود.
        فضلاً عن ذلك: اختبار الاستبدال — لا يمكن استبدال «آدم» بـ«روبرت آدم»
        في عبارة «آدم أبو البشر» مع الحفاظ على الصحة ← يُؤكد ازدواج الدلالة.
        الحلّ: الإبقاء على «روبرت آدم» وحدها لمّةً تُزيل الإلباس.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── لمّة موجودة: روبرت آدم ──
    - lemma: "روبرت آدم"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للمعماري الاسكتلندي؛ يُزيل الإلباس الذي تُثيره «آدم» منفردةً.
        هذه الصيغة هي المعتمدة في المصادر الموسوعية العربية (دائرة المعارف،
        الموسوعة العربية). اللمّة صحيحة وضرورية. تحتاج تشكيلاً كاملاً
        (رُوبَرْت آدَم) وفق الاشتراط الإلزامي للتشكيل في المخرجات.
        فحص الاقتراض: «رُوبَرْت» معرَّب من الإنجليزية (Robert)،
        ويقبل لام التعريف والنسبة (الرُّوبَرْتِيّ) والجمع السالم (نادراً)
        ← معرَّب مقبول. «آدَم» اسمٌ سامي أصيل في العربية كذلك.
        فحص MWE: مركّب إضافي ثابت (اسم علم من شقّين).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل الرسمي للمعماري الاسكتلندي؛ اللمّة الوحيدة المؤكدة بعد
        حذف «آدم» وحدها التي كانت تُلبس بأبي البشر. يُستخدم هذا الشكل
        في السياقات الموسوعية والأكاديمية وهو الأكثر دقةً وتحديداً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُوبَرْت آدَم"

    # ── مرشح المرحلة ١: رُوبَرْت آدَم ──
    - lemma: "رُوبَرْت آدَم"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق تماماً للمّة «روبرت آدم» الموجودة أصلاً في المجموعة
        بعد تطبيق التشكيل عليها. القرار المتخذ هناك (confirmed + update_lemma)
        يُعالج هذه الحالة؛ لا حاجة لإنشاء مدخل مستقل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١: آدَم الاسْكُتْلَنْدِيّ ──
    - lemma: "آدَم الاسْكُتْلَنْدِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي غير مسكوك في أي مصدر معجمي أو موسوعي عربي.
        اختبار السكّ: يمكن إبدال «الاسكتلندي» بـ«البريطاني» أو «المعماري»
        وتبقى العبارة وصفيةً صالحة ← ليست وحدة معجمية ثابتة.
        فضلاً عن ذلك لم يرد في قاعدة البيانات المعجمية أي شاهد عليها.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    # ── مرشح المرحلة ١: آدَم المُعَمَّار ──
    - lemma: "آدَم المُعَمَّار"
      source: stage1
      decision: removed
      decision_reason: >
        مركّب وصفي مؤلَّف غير مسكوك في مصادر معجمية. اختبار السكّ:
        يمكن إبدال «المُعَمَّار» بـ«المصمِّم» أو «المعماري» وتبقى العبارة
        وصفيةً ← ليست مصطلحاً معجمياً مستقلاً. لا شواهد في قاعدة البيانات.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مرشح المرحلة ١: رُوبَرْت ──
    - lemma: "رُوبَرْت"
      source: stage1
      decision: removed
      decision_reason: >
        الاسم الأول وحده لا يُعيَّن شخصاً بذاته في مجموعة ترادفية متخصصة؛
        توجد شخصيات تاريخية لا تُحصى تحمل اسم «روبرت» وقد يُحال إليها
        هذا اللفظ. لا يؤدي وظيفة التحديد المطلوبة هنا.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


