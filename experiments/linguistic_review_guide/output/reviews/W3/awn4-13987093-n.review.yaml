          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يكونُ عليهِ المرءُ مِنْ زَواجٍ أو عَدَمِهِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "وَصْفٌ قانونيٌّ يُبَيِّنُ وَضْعَ الشَّخْصِ مِنْ حَيْثُ الزَّواجُ، كأنْ يكونَ أعزبَ أو متزوِّجاً أو مُطلَّقاً أو أرملاً."

