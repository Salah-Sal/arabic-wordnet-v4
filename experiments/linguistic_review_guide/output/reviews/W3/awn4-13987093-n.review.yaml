      decision: revise
      reason: "التعريف الحالي ترجمة حرفية من الإنجليزية، ويقتصر على ثنائية (متزوج/غير متزوج) بينما الحالة الاجتماعية تشمل أوضاعاً أخرى كالمطلّق والأرمل. كما أنّ أسلوبه لا يتوافق مع أسلوب المعجم الوسيط."
    authored:
      - type: terminological
        text: "وَصْفٌ قانونيٌّ يُبَيِّنُ وَضْعَ الشَّخْصِ مِنْ حَيْثُ الزَّواجُ، كأنْ يكونَ أعزبَ أو متزوِّجاً أو مُطلَّقاً أو أرملاً."
        quality_check:
