            type: usage
      - lemma: "وَضْع عَائِلِيّ"
        examples:
          - text: "تضمَّنَ التقريرُ الإحصائيُّ توزيعَ السكّانِ بحسبِ الوضعِ العائليِّ والفئةِ العمريَّة."
