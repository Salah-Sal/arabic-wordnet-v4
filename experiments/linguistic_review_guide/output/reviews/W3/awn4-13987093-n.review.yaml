# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13987093-n  (marital status / حالة اجتماعية)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «حالة اجتماعية» أوسع دلالياً من المفهوم المقصود؛ فالحالة الاجتماعية تشمل الوضع الاقتصادي والتعليمي والمهني، لا الزواجي فحسب"
      - "المجموعة تحتوي لمّة واحدة فقط، والأفضل إثراؤها بمرادف أدقّ"
      - "التعريف العربي ترجمة حرفية من الإنجليزية ويمكن تحسينه"
    observations: "المفهوم المقصود هو الوضع القانوني للشخص من حيث كونه متزوجاً أو أعزب أو مطلّقاً أو أرملاً. في الاستعمال الإداري العربي، شاع استخدام «الحالة الاجتماعية» تضييقاً دلالياً للإشارة إلى هذا المفهوم تحديداً، رغم أنّ المصطلح في أصله أوسع. يوجد في بعض المعاجم المصطلحية «الوضع العائلي» مقابلاً أدقّ."

  blind_candidates:
    - lemma: "حَالَة مَدَنِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي شائع في الاستعمال الإداري العربي المغاربي والدولي (مقابل état civil الفرنسي)، يدلّ على الوضع القانوني من حيث الزواج والطلاق"
    - lemma: "وَضْع عَائِلِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يربط الوضع بالأسرة مباشرة، ويدلّ على حالة الشخص من حيث ارتباطه العائلي (متزوج، أعزب، مطلق)"
    - lemma: "حَالَة زَوَاجِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي يخصّص الحالة بالزواج تحديداً عبر المصدر الصناعي «زواجية» من «زواج»"
    - lemma: "صِفَة نِكَاحِيَّة"
      generation_method: tarkib
      justification: "مركب إضافي يستخدم لفظ «نكاح» التراثي مع المصدر الصناعي، ويدلّ على الوصف الشرعي لحالة الارتباط"


stage2_evidence:
  per_lemma:
    - lemma: "حَالَة اجْتِمَاعِيَّة"
      confirm:
        - text: "«رَجُلٌ اجتماعىّ : مُزاولٌ للحَياةِ الاجتماعيَّةِ، كثيرُ المخالطة للناس»"
          source: "المعجم الكبير"
      expands:
        - text: "«الحالةُ: الحال»"
          source: "المعجم الوسيط"
          addition: "الحالة مفردة «الحال» وهي الصفة التي يكون عليها الشيء، مما يؤكد صلاحيتها للدلالة على الوضع/الهيئة"
        - text: "«الحَالَةُ: واحِدَةُ أحوالِ الشَّيءِ المُحْتالَةُ»"
          source: "المعجم الكبير"
          addition: "توسيع دلالي: الحالة تدل على كل تحوّل أو وضع يكون عليه الشيء"
      contradicts:
        - text: "«رَجُلٌ اجتماعىّ : مُزاولٌ للحَياةِ الاجتماعيَّةِ، كثيرُ المخالطة للناس»"
          source: "المعجم الكبير"
          conflict: "المعنى المعجمي لـ«اجتماعي» يدلّ على المخالطة والعلاقات العامة، لا على الزواج تحديداً، مما يجعل المركّب أوسع من المفهوم المقصود"

    - lemma: "وَضْع عَائِلِيّ"
      confirm:
        - text: "«الوضع العائلي — marital status — situation de famille»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"

    - lemma: "حَالَة مَدَنِيَّة"
      evidence_status: "no_material_found"

    - lemma: "حَالَة زَوَاجِيَّة"
      expands:
        - text: "«زَوْجيّ: ذو علاقة بالزواج»"
          source: "المورد الحديث (2008)"
          addition: "يؤكد أنّ النسبة إلى الزواج (زواجي/زوجي) مستعملة ومقبولة في العربية المعاصرة"

    - lemma: "صِفَة نِكَاحِيَّة"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "حَالَة اجْتِمَاعِيَّة"
      decision: confirmed
      decision_reason: "رغم أنّ المركّب أوسع دلالياً في أصله، إلا أنّه تثبّت في الاستعمال الإداري والعرفي العربي للدلالة تحديداً على الوضع الزواجي (أعزب/متزوج/مطلق/أرمل). هذا التضييق الدلالي العرفي مقبول معجمياً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "المصطلح الأكثر شيوعاً وتداولاً في الاستمارات والوثائق الرسمية العربية في المشرق والخليج؛ يحمل إيحاءً إدارياً عاماً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَالَة اجْتِمَاعِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "وَضْع عَائِلِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "ورد في المَكنَز الزراعي (AGROVOC) مقابلاً مباشراً لـ marital status وللفرنسية situation de famille. المركّب أدقّ دلالياً من «حالة اجتماعية» لأنّه يربط الوضع بالأسرة لا بالمجتمع عموماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "أدقّ دلالياً من «حالة اجتماعية» لارتباطه بالبُعد الأُسَري مباشرة؛ يُستخدم في المعاجم المصطلحية الدولية"
      actions:
        - command: create_entry
          params:
            lemma: "وَضْع عَائِلِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حَالَة مَدَنِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على شاهد معجمي، والمصطلح شائع في المغرب العربي أكثر من المشرق، وهو ترجمة حرفية للفرنسية état civil ويدلّ على مفهوم أوسع يشمل الجنسية والاسم والنسب فضلاً عن الحالة الزواجية."

    - lemma: "حَالَة زَوَاجِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم دقّته الدلالية، لم يُعثر عليه مركّباً ثابتاً في المعاجم أو المصطلحيات. «زواجي» مستعمل صفةً مفردة لكن المركّب «حالة زواجية» لم يتثبّت بعدُ وحدةً معجمية."

    - lemma: "صِفَة نِكَاحِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا شاهد معجمي، والمركّب لم يتثبّت في الاستعمال. لفظ «نكاحية» نادر الاستخدام مصدراً صناعياً، ولا يُستعمل في السياق الإداري أو القانوني المعاصر."


