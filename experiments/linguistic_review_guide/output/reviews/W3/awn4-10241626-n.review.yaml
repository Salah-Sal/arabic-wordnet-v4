# مراجعة المجموعة الترادفية — awn4-10241626-n
# jeweler / jewelry maker — صائغ / جواهري
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "'صانع مجوهرات' عبارة وصفية حرة تفشل اختبار السك — يمكن إبدال «مجوهرات» بـ«حُلِيّ» أو «ذهب» وتبقى صالحة وصفاً؛ فهي ليست مصطلحاً معجمياً ثابتاً"
      - "جميع اللمّات واردة بلا تشكيل كامل"
      - "'جواهري' نسبة إلى الجمع مباشرة — وإن أجازها مجمع اللغة المصري، فالأفصح صرفياً 'جَوْهَرِيّ' نسبةً إلى المفرد، وهي غائبة عن المجموعة رغم توثيقها في كبار المعاجم"
    observations: "المجموعة تضمّ مصطلحَيْن أصيلَيْن (صائغ وجواهري) وعبارةً وصفية حرة (صانع مجوهرات) لا تصلح لمّةً معجمية. الجذر (صوغ) غنيٌّ في المعجمية العربية ويمتدّ استخدامه إلى الكلام والشعر فضلاً عن الحِلَى. يغيب من المجموعة لمّة 'جوهري' الكلاسيكية الأصيلة الموثّقة في المعجم الكبير والمعجم الوسيط والمورد الحديث."
  blind_candidates:
    - lemma: "صَائِغ"
      generation_method: ishtiqaq
      justification: "اسم فاعل على وزن فَاعِل من الجذر (صوغ): صاغَ الحُلِيَّ يصوغُه، والصائغُ من حرفته تشكيل الذهب والفضة؛ الوزن منتج ومطّرد في أسماء الحِرَف"
    - lemma: "حَلَّاء"
      generation_method: ishtiqaq
      justification: "وزن فَعَّال للحِرَفيّ من الجذر (حلي/حلو): يُحلّي الذهبَ والفضةَ ويُزيّنهما؛ الوزن مطّرد في أسماء الحِرَف والمِهَن (نجّار، حدّاد، بنّاء)"
    - lemma: "صَانِع الحُلِيّ"
      generation_method: tarkib
      justification: "مركب إضافي من (صانع + الحُلِيّ)؛ يصف من يصنع الحُلِيَّ ويشمل كل أنواع الزينة المعدنية الثمينة"
    - lemma: "جَوْهَرِيّ"
      generation_method: majaz
      justification: "نسبة إلى المفرد (جَوْهَر)، مجاز بالتخصص: المنتسب إلى الجوهر هو صانعه ومتعهده؛ جرى العرف العربي على إطلاق 'الجوهري' على صانع الجواهر وبائعها في التراث المعجمي"


stage2_evidence:
  per_lemma:
    - lemma: "جواهري"
      confirm:
        - text: "«جَواهِرِيّ — من (ج و ه ر) نسبة إلى جواهر بمعنى صانع الجواهر وبائعها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«اشترى خاتمًا من الجواهريّ [فصيحة] — اشترى خاتمًا من الجَوْهريّ [فصيحة] — لما كان معنى الاشتراك الجمعي مقصودًا في هذا المثال فإن الأدق النسب إلى الجمع. ومسألة النسب إلى الجمع على لفظه أو بردِّه إلى مفرده مسألة خلافية... وبرأيهم أخذ مجمع اللغة المصري؛ لأن السماع يؤيدهم»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يُثبت المعجم فصاحة كلا الشكلين، مع الإشارة إلى أن مجمع اللغة المصري أجاز النسبة إلى الجمع حين يُراد الاشتراك الجمعي"

    - lemma: "صائغ"
      confirm:
        - text: "«مَنْ حِرفَتُه الصِّياغَةُ»"
          source: "المعجم الوسيط"
        - text: "«مَنْ حِرفَتُه الصِّياغَةُ — فلانٌ من صاغة الكلام: أى مِمَّنْ يُحَبِّرونه ويُنَمِّقُونه»"
          source: "المعجم الكبير"
        - text: "«صَائِغ — من (ص و غ) من حرفته الصياغة وهي عمل الحلى من فضة وذهب ونحوهما»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الصائغ: صانعُ الحلى والمجوهرات»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«لَعَنَ اللهُ ثُمَّ ثَنَّى بِلَعْنٍ / رَبِذَةَ الصائغِ الجبانَ الجَهُولَا»"
          source: "شعر النابغة — المعجم الكبير"
          addition: "شاهد شعري جاهلي يُثبت قِدَم الاستخدام في سياق إنساني وصفي"
        - text: "«لَهُ أَكَالِيلُ بالياقوتِ زَيَّنَها / صُوَّاغُها لا تَرَى عَيْبًَا ولا طَبَعًا»"
          source: "شعر الأعشى — المعجم الكبير"
          addition: "جمع (صُوَّاغ) يُثبت انتاجية الوزن واستخدامه في السياق الأدبي الرفيع"

    - lemma: "صانع مجوهرات"
      evidence_status: "no_material_found"

    - lemma: "حَلَّاء"
      evidence_status: "no_material_found"

    - lemma: "صَانِع الحُلِيّ"
      evidence_status: "no_material_found"

    - lemma: "جَوْهَرِيّ"
      confirm:
        - text: "«الجَوْهَرِيُّ — صانعُ الجَوْهَر بائِعُه نِسبةٌ غيرُ واحدٍ»"
          source: "المعجم الكبير"
        - text: "«الْجَوْهَرِيُّ — صانع الجوهر أو بائعه. منسوب إلى الجوهر»"
          source: "المعجم الكبير"
        - text: "«(الْجَوْهَرِي) صانع الجَوهر وبائعه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الجوهريّ: «أ» صائغ الجواهر والحِلَى. «ب» تاجر الجَواهر والحجارة الكريمة والساعات، وعادةً الآنية الفضية والخزفيّة»"
          source: "المورد الحديث (2008)"


