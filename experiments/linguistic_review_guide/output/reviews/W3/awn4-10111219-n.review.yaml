# مراجعة المجموعة الترادفية — Synset Review
# id: awn4-10111219-n  |  ili: i89958  |  pos: n
# fire-eater / fire-swallower
# ══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'آكل النار' تفتقر إلى التشكيل الكامل"
      - "المقابل الإنجليزي 'fire-swallower' غير ممثَّل باللمّات العربية"
      - "المجموعة تحتوي على لمّة واحدة فقط مما يُقلّل ثراء الشبكة الدلالية"
    observations: >
      المجموعة تُعبّر عن مفهوم فنيّ استعراضي متخصص، إذ يُوهِم الفنانُ الجمهورَ
      بابتلاع النار دون أن يفعل ذلك حقيقةً. المصطلح 'آكل النار' تركيب إضافي مباشر
      يُقابل 'fire-eater' الإنجليزية، وهو مقبول صرفياً ودلالياً. بيد أنه يُغفل
      التعبير المقابل لـ 'fire-swallower'، فضلاً عن افتقاره إلى التشكيل.
      لاحظتُ أن اللمّة الأوحد لا تُغطّي سوى أحد وجهَي المفهوم (الأكل لا البلع).
  blind_candidates:
    - lemma: "بَلَّاعُ النَّارِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من بَلَّاع (صيغة مبالغة فَعَّال من بلع، بمعنى من احترف البلع)
        + النار. يُقابل 'fire-swallower' مباشرةً، وهو أدق دلالياً من 'آكل'
        لأن الأداء الاستعراضي يرتكز على إيهام البلع لا الأكل.
    - lemma: "أَكَّالُ النَّارِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من أَكَّال (صيغة مبالغة فَعَّال من أكل، بمعنى محترف الأكل)
        + النار. يُقابل 'fire-eater'، وصيغة فَعَّال تُفيد الاحتراف والتكرار
        مما يُلائم وصف الفنان المتخصص.
    - lemma: "مُلْتَهِمُ النَّارِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من مُلْتَهِم (اسم فاعل من التهم، الفعل الرباعي المزيد على
        وزن افتعل من الجذر لهم، بمعنى يبتلع ويُلقِم دفعةً واحدة) + النار.
        الجذر لهم يدل على الابتلاع في أقوى صوره، فيُعطي صورةً إيهاميةً أشدَّ
        تعبيراً عن الحيلة الاستعراضية.
    - lemma: "لَاعِقُ النِّيرَانِ"
      generation_method: majaz
      justification: >
        إزاحة دلالية من لَاعِق (اسم فاعل من لعق، بمعنى لمس الشيء بالفم أو اللسان)
        + النيران. المجاز يُعبّر عن التلامس الخطير بين الفنان والنار، إذ يُحيل
        إلى القرب الشديد منها دون ابتلاعها فعلياً، وفيه مفارقة بلاغية مُعبِّرة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٤ استعلامات):
#   ١. دفعي بالرأس: آكل النار + جميع المرشحات (نتيجة: لا مطابقة مباشرة)
#   ٢. جسر إنجليزي: fire-eater / fire-swallower (نتيجة: مُلْتَهِم النار من المورد الحديث)
#   ٣. FTS بكلمات مفتاحية: ابتلاع، بلع، التهام (نتيجة: مصطلحات طبية + شواهد لغوية)
#   ٤. مقاييس اللغة: الجذور أكل، لهم، نور (نتيجة: اقتباسات ابن فارس الثلاثة)
stage2_evidence:
  per_lemma:
    - lemma: "آكل النار"
      evidence_status: "no_material_found"

    - lemma: "مُلْتَهِمُ النَّارِ"
      confirm:
        - text: "«مُلْتَهِم النار: «أ» مشعوِذ يتظاهر بالتهام النار. «ب» مُحِبّ للقتال أو الخصام.»"
          source: "المورد الحديث (2008) — entry_id 688178"

    - lemma: "بَلَّاعُ النَّارِ"
      evidence_status: "no_material_found"

    - lemma: "أَكَّالُ النَّارِ"
      evidence_status: "no_material_found"

    - lemma: "لَاعِقُ النِّيرَانِ"
      evidence_status: "no_material_found"

  supporting_roots:
    - lemma: "بلع"
      expands:
        - text: "«ازدراد الشيء»"
          source: "مقاييس اللغة لابن فارس — entry_id 100457"
          addition: "يُثبت أن جذر بلع يدل على إزدراد الشيء ابتلاعاً، مما يؤكد صحة اشتقاق بَلَّاع"
        - text: "«بَلْع: إزدراد»"
          source: "معجم المصطلحات الطبية (ج.2، 2003) — entry_id 736005"
          addition: "يُثبت استعمال بلع بمعنى الابتلاع في المعاجم العلمية الحديثة"
    - lemma: "أكل"
      expands:
        - text: "«الْهَمْزَةُ وَالْكَافُ وَاللَّامُ بَابٌ تَكْثُرُ فُرُوعُهُ، وَالْأَصْلُ كَلِمَةٌ وَاحِدَةٌ، وَمَعْنَاهَا التَّنَقُّصُ. قَالَ الْخَلِيلُ: الْأَكْلُ مَعْرُوفٌ... وَيُقَالُ: أَكَلَتِ النَّارُ الْحَطَبَ، وَآكَلْتُهَا أَطْعَمْتُهَا إِيَّاهُ»"
          source: "مقاييس اللغة لابن فارس — entry_id 985079"
          addition: "يُثبت استعمال أكل مع النار بتعبير 'أَكَلَتِ النَّارُ الحطب'، مما يُعزز الجذر الدلالي للمّة آكل النار"
    - lemma: "لهم"
      expands:
        - text: "«اللَّامُ وَالْهَاءُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ابْتِلَاعِ شَيْءٍ، ثُمَّ يُقَاسُ عَلَيْهِ. تَقُولُ الْعَرَبُ: الْتَهَمَ الشَّيْءَ: الْتَقَمَهُ»"
          source: "مقاييس اللغة لابن فارس — entry_id 988741"
          addition: "يُثبت أن الجذر لهم يدل أصلاً على الابتلاع، وأن الْتَهَمَ تعني ابتلاع الشيء مرةً واحدة دفعةً"
    - lemma: "نار/نور"
      expands:
        - text: "«النُّونُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى إِضَاءَةٍ وَاضْطِرَابٍ وَقِلَّةِ ثَبَاتٍ. مِنْهُ النُّورُ وَالنَّارُ، سُمِّيَا بِذَلِكَ مِنْ طَرِيقَةِ الْإِضَاءَةِ»"
          source: "مقاييس اللغة لابن فارس — entry_id 989285"
          addition: "يُثبت أن النار مُشتقة من جذر نور الدال على الإضاءة، وأن النار والنور من أصل واحد"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "آكل النار"
      decision: confirmed
      decision_reason: >
        تركيب إضافي قياسي من آكل (اسم فاعل من أكل) + النار، يُقابل 'fire-eater'
        الإنجليزية مباشرةً. عدم وجود مطابقة معجمية مباشرة لا يُسقطه لأن المركبات
        الإضافية القياسية في العربية لا تُشترط في معاجمها كلها.
        ابن فارس يُثبت تعبير 'أكلت النار الحطب'، مما يُعزز الصلة الدلالية.
        لا تناقض مع أي مصدر. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على معنى الأكل (eating/consuming) وهو المقابل المعتاد لـ fire-eater
        في الاستعمال العربي المعاصر. أخف وقعاً من 'الالتهام'، وأبسط في التداول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "آكِلُ النَّارِ"

    - lemma: "مُلْتَهِمُ النَّارِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        أثبتَه المورد الحديث (2008) — أبرز المعاجم العربية-الإنجليزية الحديثة —
        ترجمةً صريحةً لـ 'fire-eater' مع تعريف مطابق: 'مشعوِذ يتظاهر بالتهام النار'.
        الجذر لهم يدل أصلاً على الابتلاع كما أكده ابن فارس.
        يُميّز دلالياً عن 'آكِلُ النَّارِ' بتركيزه على الالتهام الدفعي الشديد،
        ويُقابل 'fire-swallower' من حيث الإيحاء. التمييز الدلالي كافٍ لتبرير
        الإبقاء على كليهما.
        اجتاز بوابة الجودة المصطلحية: اطّراد (وزن افتعل شائع)، يُسر تداول،
        ملاءمة تامة للمفهوم، جذر تراثي، عربي خالص، اشتقاقية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على الالتهام (engulfing/devouring) وهو أشد درجةً من الأكل،
        يُعطي إيحاءً بضراوة الأداء وحدّته. مُثبَت في المورد الحديث ومُطابق
        دلالياً لـ 'fire-swallower'.
      actions:
        - command: create_entry
          params:
            lemma: "مُلْتَهِمُ النَّارِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "بَلَّاعُ النَّارِ"
      source: stage1
      decision: removed
      decision_reason: >
        الصياغة قياسية صحيحة دلالياً (فَعَّال من بلع + النار)، غير أن 'مُلْتَهِمُ النَّارِ'
        المُثبَت بأدلة معجمية أقوى يُغني عنه في تأدية معنى الابتلاع.
        لا شاهد معجمي مستقل يُميّز هذه اللمّة.

    - lemma: "أَكَّالُ النَّارِ"
      source: stage1
      decision: removed
      decision_reason: >
        الصياغة صحيحة لكنها متداخلة دلالياً مع 'آكِلُ النَّارِ' المُؤكَّدة (كلاهما
        من جذر أكل). الفرق في الوزن الصرفي (فَعَّال vs. فَاعِل) لا يُفضي إلى
        تمييز دلالي حقيقي يُبرر لمّةً مستقلة. لا دليل معجمي.

    - lemma: "لَاعِقُ النِّيرَانِ"
      source: stage1
      decision: removed
      decision_reason: >
        الدلالة الأصلية للعق (لمس الشيء بالفم/اللسان) أقل دقةً في وصف هذا
        الفن المتمحور حول إيهام البلع لا اللعق. كذلك لا شاهد معجمي له،
        ولا تمييز دلالي يُبرر إضافته مع وجود 'مُلْتَهِمُ النَّارِ'.


