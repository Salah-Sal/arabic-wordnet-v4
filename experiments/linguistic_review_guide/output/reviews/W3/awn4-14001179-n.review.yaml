# مراجعة المجموعة الترادفية — awn4-14001179-n
# a violent disturbance — اضطراب عنيف
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «تزعزع» مسجّلة في المعاجم فعلاً (تَزَعْزَعَ) لا اسماً، والمجموعة اسمية (pos: n)؛ يلزم تصحيحها إلى المصدر تَزَعْزُع"
      - "اللمّة «هزة» بدون تشكيل ملتبسة: هِزَّة (صفة: مرتاحة للشرّ) ≠ هَزَّة (اسم حدث: رجفة عنيفة)"
      - "التعريف «اضطراب عنيف» دوريّ لأنّ اللمّة الأولى هي «اضطراب» نفسها"
      - "جميع اللمّات تفتقر إلى التشكيل الكامل"
    observations: "المجموعة تمثّل مفهوم الاضطراب العنيف (convulsion/turmoil/upheaval)، وهو أخصّ من أبيها المباشر (اضطراب عامّ = ثوران أو صخب غير منظم) بقيد «العنف». اللمّات الثلاث الموجودة تغطي محوري الاضطراب المعنوي (اضطراب) والاضطراب المادي (تزعزع، هزة)، لكن ينقص مصطلح يربط بين العنف والاضطراب الاجتماعي/الطبيعي كالزَّلْزَلة."

  blind_candidates:
    - lemma: "زَلْزَلَة"
      generation_method: ishtiqaq
      justification: "من الجذر «زلزل» على وزن فَعْلَلَة، ودلالته شدّة الحركة والإزعاج الهائل، وهو أخصّ من مطلق الاضطراب لاقترانه بالعنف والرعب"
    - lemma: "هِيَاج"
      generation_method: ishtiqaq
      justification: "من الجذر «هيج» الدالّ على ثوران الشيء (مقاييس اللغة)، على وزن فِعَال المصدري، ويفيد الاضطراب العنيف والثوران"
    - lemma: "عَصْف"
      generation_method: majaz
      justification: "مجاز من عصف الريح (اشتداد هبوبها)، يُستعار للاضطراب العنيف في غير الريح"
    - lemma: "اهْتِيَاج"
      generation_method: ishtiqaq
      justification: "مصدر اهتاج على وزن افتعال من «هيج»، يفيد الثوران والاضطراب الذاتي الشديد"


stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اضطراب"
      confirm:
        - text: "«الاضطراب: التحرك والاختلاف. واضطربت: الأمور اختلفت.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الاضْطِراب: في الأمور التردُّدُ.»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«اضطراب أو اهتياج عظيم.» (ترجمة turmoil)"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«اضطراب في الجيولوجيا هو العملية التي تسبب تغيرا في الهيكل الأصلي لمجال صخري.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "استعمال تقني جيولوجي يدلّ على تغيير بنيوي عنيف"
        - text: "«حالة جريان سائل تكون فيها السرعة اللحظية غير منتظمة وتتأرجح بشكل عشوائي»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
          addition: "استعمال فيزيائي (turbulence) يوسّع الدلالة إلى عدم الانتظام"

    - lemma: "تزعزع"
      confirm:
        - text: "«تحرك بشدة»"
          source: "المعجم الوسيط"
        - text: "«الشَّىْءُ: تَحَرَّكَ وقَلِقَ فى موضعه, مطاوع زَعْزَعَه اهْتَزَّ واضْطَرَبَ»"
          source: "المعجم الكبير"
      expands:
        - text: "«فلانٌ فى آرائِه: اضْطَرَبَ وتَذَبْذَبَ»"
          source: "المعجم الكبير"
          addition: "امتداد مجازي إلى الاضطراب في الآراء والمواقف"
      contradicts:
        - text: "«تزَعْزَعَ — pos: verb»"
          source: "المعجم الوسيط (OCR) + المعجم الكبير (OCR)"
          conflict: "مسجّل فعلاً لا اسماً؛ المصدر تَزَعْزُعٌ هو الصيغة الاسمية المطلوبة"

    - lemma: "هزة"
      contradicts:
        - text: "«(الهزة) يُقَال امْرَأَة هزة مرتاحة للشر نشيطة لَهُ (ج) هزات»"
          source: "المعجم الوسيط"
          conflict: "المدخل المعجمي الوحيد لـ«الهزة» يصفها صفةً (هِزَّة بكسر الهاء) لا اسم حدث؛ الاسم المراد هو هَزَّة (بفتح الهاء وتشديد الزاي)"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "زَلْزَلَة"
      confirm:
        - text: "«الزلزلة: شدة الحركة على الحال الهائلة. وقال أبو البقاء: تحرك الشيء وتقلقله.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«زَلزَلَة: الحركة العظيمة والإزعاج الشديد، والتخويف والتحذير.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(2) الزِّلزال: اضطراب عنيف في الطبيعة أو المجتمع» (ترجمة convulsion)"
          source: "المورد الحديث (2008)"

    - lemma: "هِيَاج"
      confirm:
        - text: "«الْهِيَاجُ: الهيجاء»"
          source: "المعجم الوسيط"
      expands:
        - text: "«(هَيَجَ) الهاء والياء والجيم أصلان صحيحان: أحدهما يدل على ثوران شيء... هاج الفحل هيجاً وهياجاً. وكذلك الدم. والهيجاء تمدّ وتقصر. وهجت الشرّ وهيّجته.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على ثوران الشيء، والهياج مصدره"

    - lemma: "عَصْف"
      contradicts:
        - text: "«(العصفة) العصافة وريح الخمر»"
          source: "المعجم الوسيط"
          conflict: "العصف/العصفة في المعاجم بمعنى ورق الزرع أو ريح الخمر، لا الاضطراب العنيف"
        - text: "«(ع ص ف): الْعَصْفُ وَرَقُ الزَّرْعِ»"
          source: "المغرب في ترتيب المعرب للمطرّزي"
          conflict: "الدلالة المعجمية الأصلية بعيدة عن مفهوم الاضطراب"

    - lemma: "اهْتِيَاج"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "اِضْطِرَابٌ"
      decision: confirmed
      decision_reason: "لمّة أساسية مؤكّدة بأدلة معجمية وافرة من المعاجم الكلاسيكية والحديثة والمصطلحية. الجذر ض-ر-ب على وزن افتعال، ودلالتها على التحرّك والاختلاف ثابتة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "أعمّ ألفاظ المجموعة دلالةً، يشمل كلّ أنواع الاختلال والتحرّك غير المنتظم، ماديّاً كان أم معنويّاً، ولا يستلزم بذاته معنى العنف إلا بتقييد"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِضْطِرَابٌ"

    - lemma: "تَزَعْزُعٌ"
      decision: confirmed
      decision_reason: "الجذر «زعزع» ثابت في دلالة التحرّك الشديد والاضطراب. المعاجم تسجّل الفعل تَزَعْزَعَ، والمصدر تَزَعْزُعٌ هو الصيغة الاسمية المطلوبة لمجموعة اسمية. يلزم تصحيح التشكيل من صيغة الفعل إلى صيغة المصدر."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بالاضطراب المادّي الحسّي (حركة جسم في موضعه بشدّة)، ويمتدّ مجازاً إلى التذبذب في الآراء، ويتضمّن معنى فقدان الثبات والتماسك"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَزَعْزُعٌ"

    - lemma: "هَزَّةٌ"
      decision: confirmed
      decision_reason: "هَزَّة (بفتح الهاء وتشديد الزاي) اسم مرّة من هَزَّ يَهُزُّ، بمعنى الرجفة العنيفة الواحدة، شائعة في الاستعمال الحديث (هزّة أرضية). المدخل المعجمي الموجود (هِزَّة بالكسر = صفة) مختلف صرفياً، لكنّ هَزَّة كاسم حدث قياسية ومتداولة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على الحدث الواحد المباغت (رجفة أو صدمة مفاجئة)، وتتميّز بالفجائية والمحدوديّة الزمنية مقارنةً باضطراب (حالة ممتدّة) وتزعزع (حركة متكرّرة)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هَزَّةٌ"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "زَلْزَلَة"
      source: stage1
      decision: confirmed
      decision_reason: "أدلة معجمية قوية ومتعدّدة: التوقيف «شدة الحركة على الحال الهائلة»، وموسوعة السلطان قابوس «الحركة العظيمة والإزعاج الشديد»، والمورد الحديث يترجم convulsion بـ«الزلزال: اضطراب عنيف في الطبيعة أو المجتمع» وهو مطابق تماماً لتعريف المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تختصّ بالاضطراب العنيف الشامل الذي يطال البنية كلّها (طبيعيّة أو اجتماعية)، وتحمل ظلال الرعب والهول، وهي أشدّ ألفاظ المجموعة عنفاً"
      actions:
        - command: create_entry
          params: {lemma: "زَلْزَلَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "هِيَاج"
      source: stage1
      decision: removed
      decision_reason: "دلالة الهِياج أقرب إلى معنى الأب المباشر (ثوران أو صخب غير منظم = اضطراب عامّ) منه إلى الاضطراب العنيف تحديداً. المعجم الوسيط يعرّفه بـ«الهيجاء» فقط، ومقاييس اللغة يربط الجذر بالثوران العامّ لا بالعنف المحدّد."

    - lemma: "عَصْف"
      source: stage1
      decision: removed
      decision_reason: "الأدلة المعجمية تناقض الاستعمال المقصود: العَصْف في المعاجم ورق الزرع أو العُصافة أو ريح الخمر، والامتداد المجازي إلى الاضطراب غير مسجّل معجمياً."

    - lemma: "اهْتِيَاج"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر على مادة معجمية تؤكّد استعمال «اهتياج» مصدراً بهذا المعنى. الجذر هيج واعد لكن مصدر الافتعال منه غير مثبت في المظانّ المتاحة."


