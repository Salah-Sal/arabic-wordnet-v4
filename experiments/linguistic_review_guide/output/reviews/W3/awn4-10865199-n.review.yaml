# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10865199-n  |  ILI: i94442
# EN: English philosopher and jurist; founder of utilitarianism (1748-1831)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (أعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة 'جيريمي بنثام' تخلو من التشكيل الكامل"
      - "خطأ تاريخي في التعريف: المذكور (1748-1831) غير صحيح، إذ توفي بنثام في يونيو 1832 لا 1831"
      - "اللمّات العربية تحتوي على لمّة واحدة فيما الجانب الإنجليزي يتضمن لمّتين (Bentham / Jeremy Bentham)؛ لم يُعرَّب اللقب منفردًا"
    observations: >
      هذه المجموعة الترادفية تمثّل علمًا بشريًا غربيًا بعينه (Jeremy Bentham)، وهو فيلسوف إنجليزي
      ورائد الفلسفة النفعية في القرن الثامن عشر. كون الاسم أعجميًا بالكامل، تسقط عنه
      إمكانيات الاشتقاق والمجاز والتركيب العربية، ولا يتبقى إلا التعريب الصوتي.
      الصيغة العربية الشائعة في المصادر الفلسفية الأكاديمية هي «جيريمي بنثام»، وهي تعريب
      مقبول. ويلاحظ أن اللقب «بنثام» وحده يرد كثيرًا في الأدبيات الفلسفية العربية إحالةً
      على الشخص ذاته، مما يستوجب إضافته لمّةً مستقلة موازاةً للجانب الإنجليزي (Bentham).
      كما أن ضبط الحرف الإنجليزي «th» بالثاء (ث) أدق من استخدام التاء (ت).
  blind_candidates:
    - lemma: "جِيرِيمِي بِنْثَام"
      generation_method: taarib
      justification: "التعريب الكامل للاسم الإنجليزي Jeremy Bentham بضبط 'th' بالثاء؛ الصيغة الأشيع في المصادر الأكاديمية العربية"
    - lemma: "بِنْثَام"
      generation_method: taarib
      justification: "اللقب منفردًا، شائع في الإحالات الفلسفية حين يُكتفى بالاسم الأخير لتمييز الشخص، موازاةً للمقابل الإنجليزي Bentham"
    - lemma: "جِيرِيمِي بِنْتَام"
      generation_method: taarib
      justification: "تعريب بديل يضبط 'th' بالتاء وفق بعض المصادر التي لا تميّز بين الحرفين في التعريب"
    - lemma: "بِنْتَام"
      generation_method: taarib
      justification: "اللقب بصيغة التاء البديلة، مستخدَم في بعض المراجع القديمة"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفّذة:
#   Q1 — مطابقة دفعية (جيريمي بنثام / بنثام / جيريمي / بنثم + ال-) → لا نتائج
#   Q2 — الجسر الإنجليزي: "Bentham" OR "Jeremy Bentham" OR "utilitarianism" → نتيجتان (النفعية فقط)
#   Q3 — FTS عربي: "نفعية" OR "بنثام" OR "بنثم" → لا نتائج مباشرة لبنثام
stage2_evidence:
  per_lemma:
    - lemma: "جيريمي بنثام"
      evidence_status: "no_material_found"

    - lemma: "بِنْثَام"
      evidence_status: "no_material_found"

    - lemma: "جِيرِيمِي بِنْثَام"
      evidence_status: "no_material_found"

    - lemma: "جِيرِيمِي بِنْتَام"
      evidence_status: "no_material_found"

    - lemma: "بِنْتَام"
      evidence_status: "no_material_found"

  contextual_findings:
    - note: "الجسر الإنجليزي أسفر عن إدخالين لـ utilitarianism يؤكدان الترجمة العربية المعتمدة: 'النفعية' و'مذهب المنفعة'"
      entries:
        - headword: "نفعانية، مذهب المنفعة"
          translation_en: "utilitarianism"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          relevance: "يؤكد المصطلح العربي المعتمد لـ utilitarianism في السياق العلمي"
        - headword: "مذهب المنفعة"
          translation_en: "utilitarianism"
          source: "المورد الحديث (2008)"
          relevance: "صيغة بديلة معتمدة: 'مذهب المنفعة' موازاةً لـ 'النفعية'"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "جيريمي بنثام"
      decision: confirmed
      decision_reason: >
        الصيغة العربية المعتمدة والشائعة في الأدبيات الفلسفية العربية لاسم Jeremy Bentham.
        لا بديل عربي اشتقاقي أو مجازي لاسم علم أعجمي. تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: tarkib_ism_alam
      loan_check:
        type: taarib
        verdict: مقبول — تعريب صوتي أمين للاسم الأجنبي مع قبول ال- والنسبة والإعراب
      morphological_fit: "اسم علم أعجمي ممنوع من الصرف؛ الوزن لا ينطبق عليه الميزان الصرفي العربي"
      nuance_differentiation: "اللمّة الكاملة (الاسم الأول + اللقب) تُستخدم في السياقات الرسمية والأكاديمية التي تستوجب التعريف التام"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِيرِيمِي بِنْثَام"

    # ── مرشح المرحلة ١ — بِنْثَام ──
    - lemma: "بِنْثَام"
      source: stage1
      decision: confirmed
      decision_reason: >
        اللقب منفردًا يوازي المدخل الإنجليزي 'Bentham' الموجود في lemmas_en.
        يُستخدم وحده في المصادر الفلسفية العربية للإحالة على بنثام دون لبس.
        إضافته تُسوّي التناظر مع الجانب الإنجليزي (Bentham / Jeremy Bentham).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      loan_check:
        type: taarib
        verdict: مقبول — تعريب صوتي وفيّ لـ Bentham بضبط th بالثاء
      morphological_fit: "اسم علم أعجمي ممنوع من الصرف"
      nuance_differentiation: "اللقب وحده يُستخدم في السياق غير الرسمي والإحالات المختصرة، موازيًا للاستخدام الإنجليزي (Bentham)"
      actions:
        - command: create_entry
          params:
            lemma: "بِنْثَام"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10865199-n"

    # ── مرشح المرحلة ١ — جِيرِيمِي بِنْثَام ──
    - lemma: "جِيرِيمِي بِنْثَام"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة 'جيريمي بنثام' بعد إضافة التشكيل؛ تم استيعاب هذا المرشح
        في إجراء update_lemma على المدخل الموجود.

    # ── مرشح المرحلة ١ — جِيرِيمِي بِنْتَام ──
    - lemma: "جِيرِيمِي بِنْتَام"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب بالتاء بدلًا من الثاء غير مفضّل لأن 'th' في الإنجليزية تُقابَل بالثاء وفق
        معايير التعريب المعتمدة. لا دليل على شيوع هذه الصيغة في المصادر العلمية.

    # ── مرشح المرحلة ١ — بِنْتَام ──
    - lemma: "بِنْتَام"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة بالتاء بدلًا من الثاء؛ مردودة لنفس أسباب رفض 'جِيرِيمِي بِنْتَام'.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
