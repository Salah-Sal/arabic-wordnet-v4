# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14005248-n (proxy war)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحوي لمّة واحدة فقط (حرب بالوكالة)، وهو مصطلح سياسي حديث قد يحتاج إلى بدائل"
      - "اللمّة الموجودة بدون تشكيل كامل"
      - "التعريف العربي جيد لكنه يحتاج تدقيقاً طفيفاً في التركيب"
    observations: "المفهوم سياسي-عسكري حديث يُعبَّر عنه في العربية المعاصرة بمركب شبه جملة (حرب + بالوكالة). الوكالة هنا بمعنى التفويض والإنابة، لا بمعنى المؤسسة. المصطلح راسخ في الاستعمال الإعلامي والأكاديمي العربي المعاصر، ولا يكاد يُنافسه بديل."
  blind_candidates:
    - lemma: "حَرْبٌ بِالْوَكَالَةِ"
      generation_method: tarkib
      justification: "مركب شبه جملة (حرب + بالوكالة) على نمط: حرب بالإنابة، تصويت بالوكالة. الوكالة من جذر (وكل) بمعنى التفويض والاعتماد على الغير. المصطلح مسكوك ومتداول في الخطاب السياسي العربي."
    - lemma: "حَرْبٌ نِيَابِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من حرب + نيابية (نسبة إلى النيابة بمعنى القيام مقام الغير). بديل محتمل على وزن المركبات الوصفية السياسية."
    - lemma: "حَرْبٌ بِالإِنَابَةِ"
      generation_method: tarkib
      justification: "مركب شبه جملة بديل يستخدم الإنابة (من ناب ينوب) بمعنى التفويض والاستخلاف، على نمط حرب بالوكالة."
    - lemma: "حَرْبٌ مُوَكَّلَةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من اسم المفعول مُوَكَّلة (من وكّل) بمعنى حرب فُوِّض أمرها إلى غير صاحبها الأصلي."

stage2_evidence:
  per_lemma:
    - lemma: "حَرْبٌ بِالْوَكَالَةِ"
      confirm:
        - text: "«الوَكالَة: نِيَابَة فِيمَا يتَعَيَّن مِنْهُ الْمُبَاشرَة بِإِيجَاب مُكَلّف»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الوكالة: لغة: التفويض إلى الغير، ورد الأمر إليه. وشرعا: استنابة جائز التصرف مثله فيما له عليه تسلط أو ولاية ليتصرف فيها»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«بالتوكيل — by proxy»"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«(الْوكَالَة) أَن يعْهَد إِلَى غَيره أَن يعْمل لَهُ عملا وَعمل الْوَكِيل وَمحله»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الحَرْبُ: م، وقد تُذَكَّرُ، ج: حُروبٌ. ودارُ الحَرْبِ: بِلادُ المُشْرِكينَ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "تأنيث الحرب وجمعها حروب"
        - text: "«(الْحَرْب) الْقِتَال بَين فئتين (مُؤَنّثَة وَقد تذكر على معنى الْقِتَال) وَالْحَرب الْبَارِدَة أَن يكيد كل من الطَّرفَيْنِ المتعاديين لخصمه دون أَن يُؤَدِّي ذَلِك إِلَى حَرْب سافرة (مج)(ج) حروب»"
          source: "المعجم الوسيط"
          addition: "نظير اصطلاحي: الحرب الباردة — يؤكد إنتاجية نمط (حرب + صفة/شبه جملة) في المصطلحات السياسية"

    - lemma: "حَرْبٌ نِيَابِيَّةٌ"
      contradicts:
        - text: "«(النِّيَابَة) هَيْئَة قضائية تقوم بِإِقَامَة الدَّعْوَى على مُتَّهم وَنَحْوه نِيَابَة عَن الْمَجْنِي عَلَيْهِ فَردا كَانَ أَو مجتمعا (محدثة)»"
          source: "المعجم الوسيط"
          conflict: "النيابة في الاستعمال المعاصر ارتبطت بالسياق القضائي (النيابة العامة)، مما يُحدث لبساً دلالياً مع السياق العسكري"
      expands:
        - text: "«النِّيَابَة: بالفتح والكسر اسمٌ من التوكيل وهي شرعاً: تفويض أحدٍ أمرَه لآخَر وإقامتُه مقامَه»"
          source: "التعريفات الفقهيّة للبركتي"
          addition: "الأصل اللغوي يدعم المعنى لكنه لم يسكّ في هذا التركيب"

    - lemma: "حَرْبٌ بِالإِنَابَةِ"
      contradicts:
        - text: "«الإنابة: عند السالكين هي الرجوع من الغفلة إلى الذكر. وقيل التوبة في الظاهر أي في الأفعال الظاهرة من المعاصي»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "الإنابة مصطلح صوفي راسخ بمعنى التوبة والرجوع إلى الله، مما يُحدث اشتراكاً لفظياً مُربكاً في السياق العسكري-السياسي"

    - lemma: "حَرْبٌ مُوَكَّلَةٌ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "حَرْبٌ بِالْوَكَالَةِ"
      decision: confirmed
      decision_reason: "مصطلح مسكوك راسخ في الاستعمال السياسي والإعلامي العربي المعاصر. الوكالة بمعنى التفويض والتمثيل مدعومة بالأدلة المعجمية الكلاسيكية والحديثة. المركب منتج على نمط مألوف (بالتوكيل، بالإنابة) ومعتمد في الترجمة المصطلحية لـ proxy war."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَرْبٌ بِالْوَكَالَةِ"

    - lemma: "حَرْبٌ نِيَابِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "لم يُسكّ هذا التركيب مصطلحاً، والنيابة في الاستعمال المعاصر مرتبطة بالسياق القضائي (النيابة العامة) مما يُحدث لبساً. كما أن المركب الوصفي هنا لا يتمتع بتثبيت معجمي."
      evidence_assessment:
        case: mixed

    - lemma: "حَرْبٌ بِالإِنَابَةِ"
      source: stage1
      decision: removed
      decision_reason: "الإنابة في التراث اللغوي والاصطلاحي مرتبطة أساساً بالتوبة والرجوع إلى الله (مصطلح صوفي راسخ)، مما يُحدث اشتراكاً لفظياً مُربكاً. ولم يُثبت هذا التركيب في أي مصدر معجمي أو مصطلحي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "حَرْبٌ مُوَكَّلَةٌ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية لهذا التركيب. اسم المفعول مُوَكَّلة يوحي بأن الحرب نفسها مُفوَّضة، لا بأن طرفاً يحارب بالنيابة عن آخر، وهو معنى مختلف عن المقصود."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "حرب تحرض عليها قوة كبرى لا تشارك فيها بنفسها"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد المعنى لكنه يحتاج تحسيناً: (١) يفتقر إلى الجنس القريب الدقيق (حالة حرب بدلاً من حرب)، (٢) الفعل «تحرض» يوحي بأن القوة الكبرى تحرّض فحسب بينما هي قد تموّل وتسلّح أيضاً، (٣) ينبغي الإشارة إلى أطراف ثالثة تخوض القتال فعلياً."
    authored:
      - type: terminological
        text: "حَرْبٌ يُدِيرُهَا طَرَفَانِ فَرْعِيَّانِ أَوْ أَكْثَرُ نِيَابَةً عَنْ قُوًى كُبْرَى تُحَرِّضُ عَلَيْهَا وَتَدْعَمُهَا دُونَ أَنْ تَشْتَرِكَ فِيهَا مُبَاشَرَةً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "صِرَاعٌ مُسَلَّحٌ تَدْفَعُ إِلَيْهِ دَوْلَةٌ كُبْرَى أَوْ تَحَالُفٌ دُوَلِيٌّ أَطْرَافاً مَحَلِّيَّةً أَوْ إِقْلِيمِيَّةً لِتَخُوضَهُ بِالنِّيَابَةِ عَنْهَا، فَتُقَدِّمُ لَهَا التَّمْوِيلَ وَالتَّسْلِيحَ وَالتَّدْرِيبَ دُونَ أَنْ تَنْخَرِطَ هِيَ فِي القِتَالِ اِنْخِرَاطاً مُبَاشِراً."
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حَرْبٌ يُدِيرُهَا طَرَفَانِ فَرْعِيَّانِ أَوْ أَكْثَرُ نِيَابَةً عَنْ قُوًى كُبْرَى تُحَرِّضُ عَلَيْهَا وَتَدْعَمُهَا دُونَ أَنْ تَشْتَرِكَ فِيهَا مُبَاشَرَةً."

  examples:
