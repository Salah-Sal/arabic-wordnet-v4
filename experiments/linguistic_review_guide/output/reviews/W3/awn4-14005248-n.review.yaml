      - lemma: "حَرْبٌ بِالْوَكَالَةِ"
        examples:
          - text: "خَاضَتِ الدَّوْلَتَانِ العُظْمَيَانِ حُرُوبَهُمَا بِالْوَكَالَةِ فِي أَرْجَاءِ العَالَمِ الثَّالِثِ طَوَالَ حِقْبَةِ الحَرْبِ البَارِدَةِ."
