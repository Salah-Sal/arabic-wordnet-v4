# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - >
        كلتا اللمّتين الموجودتين («زعيم روحي» و«كاهن أعظم») مركَّبتان (MWE)
        دون لمّة مفردة فصيحة تغطي الدلالة الكاملة.
      - >
        «كاهن أعظم» ترجمة حرفية (calque) للإنجليزية «high priest»؛ وكلمة «كاهن»
        في الموروث العربي الإسلامي تحمل دلالةً سلبية أصيلة (العرَّاف، المتنبئ
        بالغيب)، مما يُكسب اللمّة إيحاءً سلبياً عند القارئ العربي.
      - >
        «زعيم روحي» مقيَّد بالمجال الروحي والديني، في حين يمتد المفهوم إلى
        كل حركة فكرية أو سياسية أو أيديولوجية.
      - >
        التعريف الحالي «سلطة بارزة أو مؤيد رئيسي» يصف الوظيفة لا الشخص،
        والأسلوب المعجمي يقتضي ابتداءه بـ«شخص يُعدُّ…».
    observations: >
      تصف هذه المجموعة شخصاً يجمع بين سِمَتين: (أ) المرجعية العليا في مجاله
      (السلطة المعرفية الكبرى)، و(ب) الدفاع المستميت عن مذهب أو حركة.
      أبلغ مقابل عربي لهذا المعنى هو «القُطب» الذي يتضمن في التراث الصوفي
      والأدبي كلا الوجهين: محوريّة الزعامة والسلطة الروحية/الفكرية.
      اللمّتان القائمتان تُحيلان إلى الحقل الديني ابتداءً، بينما المقابل
      الإنجليزي «high priest» مجازٌ بلاغي يتجاوز الدين إلى كل ميدان.
      يُلاحَظ غياب الأفعال وضعف الاشتقاق في اللمّات الموجودة، مما يُضعف
      قابليتها للتصريف والتوليد.

  blind_candidates:
    - lemma: "قُطْبٌ"
      generation_method: majaz
      justification: >
        القُطب أصله محور الرَّحى ونجم الشمال الذي تدور حوله الأفلاك؛ نُقِل
        مجازاً إلى «سيد القوم الذي عليه مدار أمورهم» (مقاييس اللغة)، ثم
        إلى القطب الصوفي «الواحد الذي هو موضع نظر الله في كل زمان».
        يجمع هذا المجاز المحور الدلالي كله: السلطة العليا، والمرجعية
        التي تلوذ بها الجماعة، والتمركز الفكري لحركة أو مذهب.
        كلمة مفردة فصيحة خالية من إيحاءات سلبية.

    - lemma: "دَاعِيَةٌ"
      generation_method: ishtiqaq
      justification: >
        من الجذر (د ع و) على وزن فَاعِلَة بدلالة الكثرة والمبالغة والثبات؛
        الداعية: من يَحُثُّ على أمر ويدعو إليه دعوةً متواصلة.
        يُغطي وجه «المؤيد الرئيسي» من تعريف المجموعة، لكنه يُهمل وجه
        «السلطة الكبرى». أُدرجه مرشَّحاً لاختبار مدى قبوله بأدلة المعاجم.

    - lemma: "عَمِيدُ الْفِكْرِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: عميد (مِن عمَد، أي العمود والسند) + الفكر.
        «العميد» تعني الزعيم والسيد والرأس الأول؛ المضاف «الفكر» يُحدد
        الحقل الدلالي بالمجال الفكري والمذهبي. الاختبار: هل يُكوّن
        وحدة معجمية ثابتة في المصادر؟

    - lemma: "حَامِلُ اللِّوَاءِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي راسخ في الاستعمال العربي: «حامل لواء الحركة/المذهب»
        يعني أبرز المدافعين عنه وأعلن أصواتهم. يُغطي وجه «المؤيد الرئيسي»
        بصورة اصطلاحية بليغة. أُدرجه مرشَّحاً للتحقق من توثيقه المعجمي.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المُنفَّذة: 5 استعلامات
# 1. مطابقة دفعية: زعيم روحي / كاهن أعظم / قطب / داعية (مع ال- وبدونها)
# 2. الجسر الإنجليزي: "high priest"
# 3. مكونات المركبات: زعيم / كاهن / روحي / داعي
# 4. فحص كلمات مفتاحية FTS: سلطة / مؤيد / زعامة / إمام / مرجعية
# 5. مقاييس اللغة لابن فارس: جذور زعم / كهن / قطب / دعو
stage2_evidence:
  per_lemma:

    - lemma: "زعيم روحي"
      confirm:
        - text: >
            «الزَّعِيمُ: الرَّئِيسُ الكَفِيل»
          source: "المعجم الوسيط"
        - text: >
            «الزَّعِيمُ: سَيِّدُ القَوْمِ وَرَئِيسُهُمُ المُتَكَلِّمُ عَنْهُمْ»
          source: "المعجم الكبير"
        - text: >
            «الرُّوحِيّ: المَنْسُوبُ إِلَى الرُّوحِ. الأَبُ الرُّوحِيّ: شَخْصٌ
            فِي مَقَامِ الأَبِ، يَعُدُّهُ الإِنْسَانُ مَثَلَهُ الأَعْلَى»
          source: "المعجم الكبير"
      expands:
        - text: >
            «(الزَّعِيمُ) الرَّئِيسُ وَالكَفِيلُ (ج) زُعَمَاء»
          source: "المعجم الوسيط (طبعة هوراماني)"
          addition: >
            يدل الجذر «زعم» على التكفّل بأمور الجماعة وحمل مسؤوليتها؛
            وهو ما يُلامس دلالة «السلطة البارزة» في تعريف المجموعة.

    - lemma: "كاهن أعظم"
      confirm:
        - text: >
            «الكَاهِنُ الأَكْبَرُ. / high priest»
          source: "المورد الحديث (2008) — قسم أرابترم"
      contradicts:
        - text: >
            «الكَاهِنُ: مَنْ يُخْبِرُ عَنِ الكَوَائِنِ المُسْتَقْبَلَةِ،
            وَيَدَّعِي مَعْرِفَةَ الأَسْرَارِ، وَمُطَالَعَةَ عِلْمِ الغَيْبِ»
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: >
            الدلالة الأصيلة لـ«كاهن» في المعاجم العربية الكلاسيكية تنصرف
            إلى العرَّاف ومدَّعي علم الغيب (دلالة سلبية في السياق الإسلامي)،
            لا إلى المرجعية الفكرية أو الأيديولوجية.
        - text: >
            «الكَاهِنُ: هُوَ الَّذِي يَخْبُرُ عَنِ الكَوَائِنِ فِي مُسْتَقْبَلِ
            الزَّمَانِ وَيَدَّعِي مَعْرِفَةَ الأَسْرَارِ وَالاطِّلَاعَ عَلَى
            المَغِيبَاتِ سَوَاءٌ كَانَ بِلَا وَاسِطَةٍ أَوْ بِوَاسِطَةِ
            إِلْقَاءِ الجِنِّ»
          source: "دستور العلماء للأحمدنكري"
          conflict: >
            يُؤكد هذا النص أن «كاهن» مرتبط بالتواصل مع الجن والادعاء
            بمعرفة الغيب، بما يُناقض الاستخدام المجازي المُراد في المجموعة.
      expands:
        - text: >
            «(الكَاهِنُ) كُلُّ مَنْ يَتَعَاطَى عِلْمًا دَقِيقًا؛ وَمِنَ
            العَرَبِ مَنْ كَانَ يُسَمَّى المُنَجِّمُ وَالطَّبِيبُ كَاهِنًا.
            عِنْدَ اليَهُودِ وَالنَّصَارَى: مَنِ ارْتَقَى إِلَى دَرَجَةِ
            الكَهَنُوتِ، عِنْدَ أَصْحَابِ الدِّيَانَاتِ الأُخْرَى: مَنْ
            سَاغَ لَهُ أَنْ يُقَدِّمَ الذَّبَائِحَ وَالقَرَابِينَ وَيَتَوَلَّى
            الشَّعَائِرَ الدِّينِيَّةَ»
          source: "المعجم الوسيط (هوراماني)"
          addition: >
            يُثبت هذا النص أن المعاجم الحديثة قبلت دلالةَ «الكاهن» في سياق
            الشعائر الدينية عند غير المسلمين، مما يُتيح توسيعها إلى الاستخدام
            المجازي للسلطة الفكرية والأيديولوجية.

    - lemma: "قُطْب"
      confirm:
        - text: >
            «الْقَافُ وَالطَّاءُ وَالْبَاءُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى
            الْجَمْعِ... وَمِنْهُ الْقُطْبُ: قُطْبُ الرَّحَى، لِأَنَّهُ
            يَجْمَعُ أَمْرَهَا إِذْ كَانَ دَوْرُهُ عَلَيْهَا. وَيُسْتَعَارُ
            هَذَا فَيُقَالُ: فُلَانٌ قُطْبُ بَنِي فُلَانٍ، أَيْ سَيِّدُهُمُ
            الَّذِي يَلُوذُونَ بِهِ»
          source: "مقاييس اللغة لابن فارس"
        - text: >
            «القُطبُ: وَقَدْ يُسَمَّى غَوْثًا بِاعْتِبَارِ الْتِجَاءِ
            الْمَلْهُوفِ إِلَيْهِ، عِبَارَةٌ عَنِ الوَاحِدِ الَّذِي هُوَ
            مَوْضِعُ نَظَرِ اللهِ تَعَالَى فِي كُلِّ زَمَانٍ، أَعْطَاهُ
            الطِّلْسَمَ الأَعْظَمَ مِنْ لَدُنِهِ، وَهُوَ يَسْرِي فِي
            الكَوْنِ وَأَعْيَانِهِ سَرَيَانَ الرُّوحِ فِي الجَسَدِ»
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: >
            «القطبُ بِحَرَكَاتِ القَافِ وَسُكُونِ الطَّاءِ المُهْمَلَةِ:
            حَجَرُ الرَّحَى وَالعَجَلَةِ (الدَّوْلَابِ) وَالكَوْكَبُ السَّاكِنُ
            قُرْبَ الفُرْقَدَيْنِ، وَكَبِيرُ القَوْمِ الَّذِي عَلَيْهِ
            مَدَارُ الأُمُورِ»
          source: "كشف اصطلاحات الفنون"

    - lemma: "دَاعِيَة"
      confirm:
        - text: >
            «دَاعِيَ اللهِ: الحَاثُّ عَلَى عِبَادَتِهِ. يُقَالُ: المُؤَذِّنُ
            دَاعِيَ اللهِ. دَاعِيَ اللَّيْلِ: الدِّيكُ»
          source: "المعجم الكبير"
      expands:
        - text: >
            «(الدَّاعِي) دَاعِي اللَّبَنِ مَا يُتْرَكُ فِي الضَّرْعِ
            لِيَدْعُوَ مَا بَعْدَهُ. وَالسَّبَبُ»
          source: "المعجم الوسيط (هوراماني)"
          addition: >
            الداعي يُشير إلى الباعث والمحرِّك، وهو يلتقي مع وجه «المؤيد
            الرئيسي» في تعريف المجموعة لكنه لا يُغطي «السلطة البارزة».

    - lemma: "عَمِيدُ الْفِكْرِ"
      evidence_status: "no_material_found"

    - lemma: "حَامِلُ اللِّوَاءِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "زعيم روحي"
      decision: confirmed
      decision_reason: >
        «زعيم» موثَّق لغوياً بدلالة الرئيس والسيد المتكفِّل بأمور جماعته
        (جذر زعم: السيادة والتكفل). «روحي» يُضيف البُعد الروحي المجازي
        الذي يُقابل «high priest» في وجهه الديني/الروحاني. المركب مفهوم
        ومتداول في العربية الحديثة ومعبِّر عن جانب من دلالة المجموعة،
        وإن كانت «روحي» تُقيِّد الدلالة بالحقل الروحي دون سائر الحقول.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على السلطة الروحية والإشراف الديني أو الأخلاقي، وهو الأقرب
        إلى القيادة الرمزية ذات المرجعية الروحانية (كالمهاتما غاندي أو
        المرشد الديني الأعلى)، بخلاف «كاهن أعظم» الذي ينحو منحىً طقسياً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "زَعِيمٌ رُوحِيٌّ"

    - lemma: "كاهن أعظم"
      decision: confirmed
      decision_reason: >
        على الرغم من الإشكالية الثقافية لـ«كاهن» (الدلالة السلبية في
        الموروث الإسلامي)، فإن المعاجم الحديثة (المورد الحديث) تُثبت
        استخدامه ترجمةً لـ«high priest» في الدلالة الدينية المؤسسية.
        ويُستعمل في العربية المعاصرة مجازاً للإشارة إلى الزعيم الأيديولوجي
        الأعلى (كـ«كاهن الرأسمالية»). يُؤخَذ به مع ملاحظة الإشكالية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركِّز على الهيمنة الطقسية والمؤسسية والمكانة الكهنوتية المجازية؛
        يناسب السياق الذي تكون فيه الحركة مشابهة لديانة منظَّمة بها
        طبقة كهنوتية (مثل: «كاهن أعظم للرأسمالية الليبرالية»).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَاهِنٌ أَعْظَمُ"

    - lemma: "قُطْب"
      source: stage1
      decision: confirmed
      decision_reason: >
        «قطب» موثَّق في المعاجم الكلاسيكية والمعاصرة بدلالة «سيد القوم
        الذي يلوذون به وعليه مدار أمورهم». ابن فارس يُؤصِّل الجذر
        (ق ط ب) بمعنى الجمع والمحورية. تمر اختبارات الجودة:
        — الاطّراد: فصيح راسخ في التراث (قطب العلم، قطب الفلسفة).
        — يُسر التداول: مفرد ثلاثي خفيف سهل الاشتقاق (أقطاب، قطبي).
        — الملاءمة: يُغطي كلا وجهَي الدلالة (السلطة + المحورية).
        — إيثار التراثي: أصيل عربي لا مُعرَّب ولا مترجَم.
        — الاشتقاقية: قابل للتصريف والاشتقاق بيُسر.
        فحص MWE: كلمة مفردة → لا إشكال.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُجسِّد المحورية الكونية الجامعة: مَن تدور حوله أفكار الحركة
        وتعود إليه القرارات ومنه يصدر الإلهام؛ أقل ارتباطاً بالطقس
        الديني من «كاهن أعظم»، وأشمل من «زعيم روحي» إذ يتجاوز الروحانية
        إلى كل ميدان فكري أو مذهبي.
      actions:
        - command: create_entry
          params:
            lemma: "قُطْبٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10194879-n"

    - lemma: "دَاعِيَة"
      source: stage1
      decision: removed
      decision_reason: >
        «داعية» يُغطي وجه «المؤيد الرئيسي» من الدلالة فحسب، دون أن يُشير
        إلى «السلطة البارزة» أو المرجعية الكبرى. اختبار الاستبدال يكشف
        أن «داعية» أكثر ملاءمةً لـ«advocate / proponent» (awn4-10029534-n)
        لا لـ«high priest». لا إجراء مطلوب.

    - lemma: "عَمِيدُ الْفِكْرِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المركب في قاعدة البيانات المعجمية. اختبار التثبيت
        المعجمي: يمكن إبدال «الفكر» بـ«الفلسفة / الأدب / الاقتصاد» دون
        فقدان صلاحيته وصفاً → ليس وحدة معجمية ثابتة. لا إجراء مطلوب.

    - lemma: "حَامِلُ اللِّوَاءِ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير اصطلاحي مجازي معروف لكنه يُغطي «المدافع الأول / قائد المسيرة»
        لا «المرجعية الكبرى». غياب التوثيق المعجمي كوحدة اصطلاحية ثابتة
        مرتبطة بهذه الدلالة. لا إجراء مطلوب.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "سلطة بارزة أو مؤيد رئيسي لحركة أو مذهب ما"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزي. «سلطة» في العربية تُشير
        إلى السلطة المجردة لا إلى الشخص؛ وأسلوب المعجم الوسيط يقتضي
        الابتداء بـ«شخص» أو «مَن». كذلك «مؤيد رئيسي» قاصر عن الدلالة
