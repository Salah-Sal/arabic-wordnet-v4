# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id : awn4-11376507-n
# ili       : i97241
# pos       : n
# lemmas    : أبجون | ريتشارد أبجون
# definition: معماري أمريكي (ولد في إنجلترا) (1802-1878)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة أبجون تتعارض لفظياً مع كلمة عربية تراثية (الآبجون = ياقوت أبيض فارسي الأصل) مسجّلة في المعجم الكبير، مما يُوجب التنبيه على الاشتراك اللفظي."
      - "كلتا اللمّتين (أبجون، ريتشارد أبجون) خاليتان من التشكيل الكامل في البيانات الأصلية."
      - "المجموعة تصف علماً شخصياً لأجنبي — وهو نوع من المداخل لا تُدرجه المعاجم العربية عادةً في مداخلها التقليدية."
      - "التعريف الحالي (معماري أمريكي (ولد في إنجلترا) (1802-1878)) موجز ووصفي وليس معجمياً."
    observations: >
      المجموعة awn4-11376507-n خاصة بشخصية تاريخية بعينها هي المعماري الأمريكي ريتشارد أبجون
      (1802-1878) المولود في إنجلترا. لمّاتها لا يمكن أن تكون إلا تعريبات (تأريبًا) للاسم
      الأجنبي "Upjohn" و"Richard Upjohn"، إذ لا يوجد جذر عربي يُشتق منه اسم علم أجنبي.
      التعارض اللفظي مع الآبجون (حجر ياقوتي) يستحق التوثيق ولا يؤثر على صحة التعريب لأن
      سياقَي الاستخدام مختلفان تماماً: علم شخصي في مقابل اسم جوهرة. يُلاحَظ أن المجموعة
      تنتمي إلى نوع من المداخل (أعلام الأشخاص) نادر في شبكات الكلمات، وهو ما يجعل الإثراء
      المعجمي التقليدي محدوداً.

  blind_candidates:
    - lemma: "أُبْجُون"
      generation_method: taarib
      justification: >
        تعريب مباشر للمقطع الصوتي لاسم عائلة إنجليزية ذات نمط صوتي (VC + CV) شائع في أسماء
        القرن التاسع عشر. الهمزة في الصدر والواو في النهاية مطابقان للقواعد القياسية للتعريب.
    - lemma: "رِيتْشَارْد أُبْجُون"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل مركّباً من الاسم الشخصي Richard والاسم العائلي Upjohn وفق القياس
        المعتاد في تعريب الأسماء الإنجليزية ذات المقطعين.
    - lemma: "أُبْجَان"
      generation_method: taarib
      justification: >
        تعريب بديل بكسر الواو إلى ألف في النهاية، نمط يُوجد أحياناً في تعريب الأسماء
        الإنجليزية المنتهية بـ -on عندما تُميل بعض لهجات التعريب الصوت نحو الألف.
    - lemma: "أَبِيجُون"
      generation_method: taarib
      justification: >
        تعريب يُضاف فيه مد قصير بين الباء والجيم لمحاكاة نطق بعض المتحدثين العرب للمقطع
        الإنجليزي -bi- في أسماء مشابهة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    # اللمّة الأولى (موجودة)
    - lemma: "أبجون"
      contradicts:
        - text: "«مُعَرَّب (فارسيّ) مركب من آب بمعنى ماء، وكون وبيون بمعنى لون: الياقوتُ الذي لونه أقرب إلى البياض»"
          source: "المعجم الكبير"
          conflict: >
            الآبجون في المعجم الكبير كلمة مستقلة تماماً تشير إلى نوع من الياقوت، ولا صلة لها
            بالمعماري Upjohn. التطابق في الرسم الإملائي مصادفة تُوجد اشتراكاً لفظياً
            محتملاً (homograph). لا يوجد في القاعدة أي دعم للمعنى المقصود (علم شخصي).

    # اللمّة الثانية (موجودة)
    - lemma: "ريتشارد أبجون"
      evidence_status: "no_material_found"

    # مرشح المرحلة ١ — أُبْجَان
    - lemma: "أُبْجَان"
      evidence_status: "no_material_found"

    # مرشح المرحلة ١ — أَبِيجُون
    - lemma: "أَبِيجُون"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الأولى: أبجون (موجودة) ──
    - lemma: "أبجون"
      decision: confirmed
      decision_reason: >
        اللمّة تعريب مباشر لاسم العائلة الإنجليزي "Upjohn" وهي الصيغة المعتمدة دولياً في
        المصادر العربية الموسوعية. رغم التعارض اللفظي مع الآبجون (ياقوت) المسجّل في
        المعجم الكبير، يظل السياق فاصلاً بينهما (علم شخصي/سياق معماري ≠ جوهرة) وهو ما
        يمنع الاشتباه. تُضبط بالتشكيل الكامل للتمييز: أُبْجُون.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يمثّل اسم العائلة (surname) وحده، يُستخدم في السياق الذي يكفي فيه ذكر اللقب
        دون الاسم الشخصي، كالإحالات المرجعية في النصوص المتخصصة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُبْجُون"

    # ── اللمّة الثانية: ريتشارد أبجون (موجودة) ──
    - lemma: "ريتشارد أبجون"
      decision: confirmed
      decision_reason: >
        تعريب الاسم الكامل "Richard Upjohn" وهو الشكل المعياري للتعريف بالشخص في
        السياقات الموسوعية. لا يوجد بديل عربي أصيل لعلم شخصي أجنبي. يُضبط بالتشكيل
        الكامل: رِيتْشَارْد أُبْجُون.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يمثّل الاسم الكامل (اسم + لقب) ويُستخدم عند الحاجة إلى التعريف الدقيق بالشخص
        والتمييز عنه وعن أبنائه المعماريين (مثل ابنه ريتشارد موريس أبجون). هو الشكل
        الأكثر توضيحاً وإزالةً للإبهام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِيتْشَارْد أُبْجُون"

    # ── مرشح المرحلة ١: أُبْجَان — مرفوض ──
    - lemma: "أُبْجَان"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب غير مستعمل ولا موثّق في أي مصدر. يخالف المعيار الصوتي القياسي لتعريب
        -on الإنجليزية التي تُؤدَّى بالواو والنون (ون) لا بالألف والنون (ان).
      evidence_assessment:
        case: no_material

    # ── مرشح المرحلة ١: أَبِيجُون — مرفوض ──
    - lemma: "أَبِيجُون"
      source: stage1
      decision: removed
      decision_reason: >
        إضافة مدّ داخلي (الياء بين الباء والجيم) يخالف مبدأ الأمانة الصوتية في التعريب —
        لا يوجد هذا المقطع في النطق الإنجليزي الأصلي لـ Upjohn.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "معماري أمريكي (ولد في إنجلترا) (1802-1878)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وصفي إخباري (بيانات مختصرة) وليس تعريفاً معجمياً حقيقياً.
        يفتقر إلى الجنس القريب الصريح والفصل النوعي الكافي لتمييز هذا المعماري عن
        غيره من المعماريين الأمريكيين من أصل إنجليزي في الحقبة ذاتها.
    authored:
      - type: encyclopedic
        text: >
          رِيتْشَارْد أُبْجُون (1802-1878) معماريٌّ أمريكيٌّ وُلد في ولاية ديفون
          بإنجلترا، وهاجر إلى الولايات المتحدة عام 1829. اشتُهر بتصميم الكنائس
          على الطراز القوطي الإحيائي (Gothic Revival)، ومن أبرز أعماله كنيسةُ
          ترينيتي بمدينة نيويورك (1846). يُعدّ من مؤسسي المعهد الأمريكي للمعماريين
          (AIA) عام 1857.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11376507-n"
          definition_index: 0
          text: >
            رِيتْشَارْد أُبْجُون (1802-1878) معماريٌّ أمريكيٌّ وُلد في ولاية ديفون
            بإنجلترا، وهاجر إلى الولايات المتحدة عام 1829. اشتُهر بتصميم الكنائس
            على الطراز القوطي الإحيائي (Gothic Revival)، ومن أبرز أعماله كنيسةُ
            ترينيتي بمدينة نيويورك (1846). يُعدّ من مؤسسي المعهد الأمريكي للمعماريين
            (AIA) عام 1857.

  examples:
    per_lemma:
      - lemma: "أُبْجُون"
        examples:
          - text: "صمّم أُبْجُون كنيسةَ ترينيتي في نيويورك بالطراز القوطي الإحيائي لتغدو من أبرز معالم المدينة في القرن التاسع عشر."
            type: usage
      - lemma: "رِيتْشَارْد أُبْجُون"
        examples:
          - text: "يُعدّ رِيتْشَارْد أُبْجُون من رواد العمارة الدينية في أمريكا، وقد أسهم في تأسيس المعهد الأمريكي للمعماريين."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "صمّم أُبْجُون كنيسةَ ترينيتي في نيويورك بالطراز القوطي الإحيائي لتغدو من أبرز معالم المدينة في القرن التاسع عشر."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدّ رِيتْشَارْد أُبْجُون من رواد العمارة الدينية في أمريكا، وقد أسهم في تأسيس المعهد الأمريكي للمعماريين."


