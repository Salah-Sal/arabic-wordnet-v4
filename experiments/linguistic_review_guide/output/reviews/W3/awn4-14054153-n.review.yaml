# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14054153-n (oscitancy)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي دائري: يستخدم لفظة «التثاؤب» لتعريف مجموعة تحوي «تثاؤب» لمّةً"
      - "لمّة «خمول» معناها الأصيل في المعاجم الكلاسيكية «خفاء القَدْر والذِّكْر» لا النعاس أو البلادة"
      - "اللمّتان تفتقران إلى التشكيل الكامل"
      - "لا تمييز واضح بين هذه المجموعة وفوقيّتها المباشرة (نعاس/وسن) سوى عنصر التثاؤب"
    observations: >-
      المجموعة تمثّل مفهوم oscitancy الإنجليزي، وهو حالة من الفتور والبلادة تتجلّى بفتح الفم لا إراديًّا (التثاؤب).
      المعجم الطبي الموحد يعادل بين «تثاؤب» و«oscitancy» مباشرة.
      أمّا «خمول» فمعناه القديم «خفاء الذكر» ومعناه الحديث «الكسل العام»، وكلاهما لا يختصّ بالنعاس المصحوب بالتثاؤب.
      المفهوم عربيّ أصيل؛ فمادة (ث أ ب) غنيّة بالاشتقاقات الدالّة عليه: ثُؤَبَاء، تثاؤب، ثَئِبَ.
  blind_candidates:
    - lemma: "خُمُول"
      generation_method: ishtiqaq
      justification: "مصدر على وزن فُعُول من خَمَلَ، يدلّ في الاستعمال المعاصر على الكسل والفتور، وهو قريب من معنى البلادة الوارد في التعريف"
    - lemma: "فُتُور"
      generation_method: ishtiqaq
      justification: "مصدر على وزن فُعُول من فَتَرَ، يدلّ على ضعف النشاط والتراخي، وابن فارس يقول: أصل يدلّ على ضعف في الشيء"
    - lemma: "كَسَل"
      generation_method: ishtiqaq
      justification: "مصدر من كَسِلَ، يدلّ على التثاقل والفتور، والمعاجم تربطه بالتثاؤب: ثَئِبَ = أصابه كسل وتفتّر"
    - lemma: "وَسَن"
      generation_method: majaz
      justification: "الوَسَن هو النعاس وأوّل النوم، وهو المعنى الأساسي في التعريف، واستُعمل قرآنيًّا في سياق الغفلة"

stage2_evidence:
  per_lemma:
    - lemma: "تَثَاؤُب"
      confirm:
        - text: "«التَّثَاؤُب: من الثؤباء وهي فترة من ثقل النعاس فيسترخي ويفتح فاه واسعاً من غير قصد»"
          source: "التعريفات الفقهية للبركتي"
        - text: "«التثاؤب: فترة تعتري الشخص فيفتح عندها فمه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«تَثاؤُب — translation_en: oscitancy»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«تثاؤب — فعل منعكس يفتح فيه الفم ويصحبه شهيق، ويحدث من كسل أو إجهاد أو ميل للنوم»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      expands:
        - text: "«الثُّأَباء: ما يعتري الإنسانَ عند الكسل ومغالبة النعاس من فتح الفم والتمطّي»"
          source: "المعجم الكبير"
          addition: "يُضيف المعجم الكبير عنصر التمطّي إلى جانب فتح الفم، ويُبيّن أنّ الثؤباء (أصل التثاؤب) تعتري عند الكسل ومغالبة النعاس"
        - text: "«الثُّؤباء: حركة للفم لا إرادية, من هجوم كسل أو نوم»"
          source: "المعجم الوسيط"
          addition: "يؤكّد اللاإرادية ويربط بالكسل أو النوم"
        - text: "«ثُئِبَ الرجلُ: أصابه فتور كفتور النعاس ينفتج عند ذلك فمُه»"
          source: "المعجم الكبير"
          addition: "صيغة المبني للمجهول تُظهر أنّ التثاؤب حالة تُصيب الإنسان لا فعل إرادي"

    - lemma: "خُمُول"
      contradicts:
        - text: "«الخمول: خفاء القدر والذكر، وأصله السكون والخفاء، ومنه، خمل البساط لأنه يستر ما خلفه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى الكلاسيكي هو خفاء الذِّكر والقَدْر، لا النعاس أو البلادة المصحوبة بالتثاؤب"
      expands:
        - text: "«(1) نُعاس (2) كسَل؛ خمول — translation_en: drowsiness»"
          source: "المورد الحديث (2008)"
          addition: "في الاستعمال المعاصر يُقرن خمول بالنعاس والكسل"

    - lemma: "فُتُور"
      confirm:
        - text: "«الفتور: نقص مرضي في النشاط — translation_en: hypoactivity»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
      contradicts:
        - text: "«(فَتَرَ) أصل صحيح يدلّ على ضعف في الشيء. فَتَرَ الشيءُ يَفْتُرُ فُتُوراً»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الفتور ضعف عامّ في أيّ شيء، لا يختصّ بالنعاس المصحوب بالتثاؤب"

    - lemma: "كَسَل"
      contradicts:
        - text: "«الكَسَلُ: التثاقل عن الشيء والفتور فيه»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الكسل تثاقل عامّ عن العمل، لا حالة نعاس تتجلّى بالتثاؤب"
        - text: "«الكسل: التثاقل عما لا ينبغي التثاقل عنه ولذلك كان مذموماً»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الكسل مذموم أخلاقيًّا بينما التثاؤب حالة فسيولوجية لا إرادية"

    - lemma: "وَسَن"
      contradicts:
        - text: "«الوَسَنُ: النعاسُ. والسِّنَةُ مثله»"
          source: "تاج اللغة وصحاح العربية للجوهري"
          conflict: "الوَسَن مرادف للنعاس وهو بالضبط معنى الفوقيّة المباشرة (awn4-14053917-n) التي تحوي وَسَن لمّةً، فلا يصحّ إدراجه هنا"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَثَاؤُب"
      decision: confirmed
      decision_reason: >-
        المعجم الطبي الموحد يعادل صراحةً بين «تثاؤب» و«oscitancy»، والتعريفات الكلاسيكية (المناوي، البركتي)
        تصف التثاؤب بأنه فترة من ثقل النعاس يُفتح فيها الفم، وهذا يطابق دلالة المجموعة. اللمّة الأصلية بلا تشكيل فتُصحَّح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَثَاؤُب"

    - lemma: "خُمُول"
      decision: removed
      decision_reason: >-
        المعنى الأصيل لـ«خمول» في المعاجم الكلاسيكية هو «خفاء القَدْر والذِّكْر» (المناوي)، وأصله السكون والخفاء (خَمْل البساط).
        وفي الاستعمال الحديث يدلّ على كسل عامّ لا يختصّ بالنعاس المتجلّي بالتثاؤب.
        لا يميّز هذه المجموعة عن فوقيّتها (نعاس/وسن)، ولا يحمل عنصر التثاؤب الذي يُفرِّق المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "خُمُول"
      source: stage1
      decision: removed
      decision_reason: "مطابق للمّة الموجودة «خمول» التي حُذفت للأسباب ذاتها: معناه الأصيل خفاء الذكر لا النعاس بالتثاؤب"

    - lemma: "فُتُور"
      source: stage1
      decision: removed
      decision_reason: "الفتور ضعف عامّ في أيّ شيء (ابن فارس)، ومصطلحيًّا يُستعمل بمعنى hypoactivity (نقص النشاط المرضي)، فلا يختصّ بحالة النعاس المتجلّية بالتثاؤب"
      evidence_assessment:
        case: mixed

    - lemma: "كَسَل"
      source: stage1
      decision: removed
      decision_reason: "الكسل تثاقل إرادي مذموم عن العمل (المناوي، الراغب)، بينما التثاؤب حالة فسيولوجية لا إرادية. الفرق الأخلاقي والفسيولوجي يمنع الترادف"
      evidence_assessment:
        case: contradicts_only

    - lemma: "وَسَن"
      source: stage1
      decision: removed
      decision_reason: "الوَسَن مرادف للنعاس وهو لمّة في الفوقيّة المباشرة (awn4-14053917-n)، فإدراجه هنا يخلط بين المجموعتين ويُلغي التمييز الهرمي"
      evidence_assessment:
        case: contradicts_only

