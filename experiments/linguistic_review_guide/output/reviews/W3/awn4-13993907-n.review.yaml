# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13993907-n (amity)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي الحالي دائريّ — يستخدم «الصداقة» وهي إحدى لمّات المجموعة نفسها"
      - "اللمّتان الموجودتان (صداقة، وئام) بدون تشكيل كامل"
    observations: >
      المفهوم هو حالة من الوُدّ والتفاهم المتبادل، وهو نوع فرعي من «السلام» (المجموعة الأعلى).
      التعريف الإنجليزي (a state of friendship and cordiality) يشير إلى بُعد دبلوماسي/اجتماعي
      كما يؤكده المورد الحديث: «صداقة؛ تفاهم [بين الدُّوَل]». اللمّتان الموجودتان
      تغطيان المعنى من زاويتين: صداقة (علاقة المودة) ووئام (الانسجام والوفاق)، لكن
      يمكن إثراء المجموعة بمزيد من المترادفات.
  blind_candidates:
    - lemma: "وِئَام"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (و أ م) على وزن فِعَال، يدلّ على الموافقة والمقاربة كما في مقاييس اللغة"
    - lemma: "أُلْفَة"
      generation_method: ishtiqaq
      justification: "مشتق من (ألف) على وزن فُعْلَة، مصدر الائتلاف والانسجام، يدلّ على المودّة الصادقة"
    - lemma: "وِدَاد"
      generation_method: ishtiqaq
      justification: "مشتق من (ودد) على وزن فِعَال، يدلّ على المحبة والمودّة المتبادلة"
    - lemma: "صَفَاء"
      generation_method: majaz
      justification: "إزاحة دلالية من صفاء الماء إلى صفاء العلاقة ونقائها من الشوائب، فيُكنّى به عن حسن العلاقة"


stage2_evidence:
  per_lemma:
    - lemma: "صَدَاقَة"
      confirm:
        - text: "«الصداقة: علاقَة مَوَدَّة ومحبة بَين الأصدقاء»"
          source: "المعجم الوسيط"
        - text: "«علاقة مودّةٍ ومحبّةٍ بين شخصين أو أكثر»"
          source: "المعجم الكبير"
        - text: "«الصَّدَاقة: محبَّة صَادِقَة لَا يشوبها غَرَض، يُرِيد لَهُ مَا يُريدهُ لنَفسِهِ، ويؤثره على نَفسه فِي الْخيرَات»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الصداقة: صدق الاعتقاد في المودة وذلك يختص بالإنسان دون غيره»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«صَداقة؛ مَوَدّة» (ترجمة friendship)"
          source: "المورد الحديث"
        - text: "«صداقة؛ تفاهم [بين الدُّوَل]» (ترجمة amity)"
          source: "المورد الحديث"
      expands:
        - text: "«الصَّدَاقَةُ مُشْتَقَّةٌ مِنَ الصِّدْقِ فِي الْمَوَدَّةِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "بيان أصل الاشتقاق: من الصدق في المودة"
        - text: "«الصّداقة: عند أهل السلوك هي استواء القلب في الوفاء والجفاء والمنع والعطاء، وهي من مراتب المحبّة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "بُعد صوفي: الصداقة مرتبة من مراتب المحبة عند أهل السلوك"

    - lemma: "وِئَام"
      confirm:
        - text: "«الْوِئَامُ: الْمُوَافَقَةُ؛ وَوَاءَمْتُهُ. وَمَثَلُهُمْ: لَوْلَا الْوِئَامُ هَلَكَ الْأَنَامُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«وئام: من (و أ م) الإنسجام والوفاق»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«اتفاق؛ توافق؛ وئام» (ترجمة meeting of minds)"
          source: "المورد الحديث"
          addition: "وئام يستعمل بمعنى التوافق والاتفاق أيضاً"
        - text: "«صِلة؛ علاقة. وبخاصة: وِئام؛ أُلفة» (ترجمة rapport)"
          source: "المورد الحديث"
          addition: "وئام يدلّ على حسن العلاقة والتقارب"

    - lemma: "أُلْفَة"
      confirm:
        - text: "«أُلفة: مودّة صادقة» (ترجمة camaraderie)"
          source: "المورد الحديث"
        - text: "«أُلفة؛ مودّة؛ صداقة حميمة» (ترجمة intimacy)"
          source: "المورد الحديث"
        - text: "«أُلفة؛ مودَّة؛ صداقة» (ترجمة fellowship)"
          source: "المورد الحديث"
      expands:
        - text: "«الْأُلْفَةُ مَصْدَرُ الِائْتِلَافِ. وَإِلْفُكَ وَأَلِيفُكَ: الَّذِي تَأْلَفُهُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأُلْفة من الائتلاف وهو انضمام الشيء إلى الشيء"

    - lemma: "وِدَاد"
      confirm:
        - text: "«وِدَاد: من (و د د) المحبة، والتمنى»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«وِدَاد: المحبة، والتمنى»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "الوداد يدلّ على المحبة والتمنّي وهو أوسع من مفهوم الصداقة المتبادلة؛ البُعد الاجتماعي/الدبلوماسي مفقود"

    - lemma: "صَفَاء"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "صَدَاقَة"
      decision: confirmed
      decision_reason: "لمّة أصيلة راسخة في المعاجم العربية الكلاسيكية والمعاصرة، مشتقة من الصدق في المودة، وتُترجم amity مباشرةً في المورد الحديث"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على العلاقة الشخصية القائمة على المودة الصادقة والمحبة المتبادلة، وتُستعمل أيضاً في السياق الدبلوماسي (صداقة بين الدول)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَدَاقَة"

    - lemma: "وِئَام"
      decision: confirmed
      decision_reason: "لفظ فصيح ثابت في المعاجم التراثية، الجذر (وأم) يدلّ على الموافقة والمقاربة كما في مقاييس اللغة، ويغطّي بُعد الانسجام والوفاق في المفهوم"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على جانب الانسجام والتوافق بين الأطراف أكثر من العلاقة العاطفية الشخصية، فهو أقرب إلى harmony/concord"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِئَام"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أُلْفَة"
      source: stage1
      decision: confirmed
      decision_reason: "مؤيَّدة بأدلة معجمية متعددة في المورد الحديث كترجمة لـ camaraderie وfellowship وrapport، ومؤصَّلة في مقاييس اللغة (مصدر الائتلاف)، تُثري المجموعة ببُعد الأُنس والتقارب"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تدلّ على حالة الأُنس والتقارب الوجداني والألفة المتبادلة، أقرب إلى البُعد الشخصي الحميم منها إلى البُعد الدبلوماسي"
      actions:
        - command: create_entry
          params: {lemma: "أُلْفَة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "وِدَاد"
      source: stage1
      decision: removed
      decision_reason: "الوِداد يدلّ على المحبة والتمنّي وهو أوسع من مفهوم الصداقة المتبادلة (amity)، ويفتقر إلى البُعد الاجتماعي/الوفاقي الذي يميّز هذه المجموعة"
      evidence_assessment:
        case: mixed

    - lemma: "وِئَام"
      source: stage1
      decision: removed
      decision_reason: "اللمّة موجودة أصلاً في المجموعة، لا حاجة لإضافتها مجدداً"
      evidence_assessment:
        case: confirm_only

    - lemma: "صَفَاء"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية تؤيد استخدام صَفَاء بمعنى الصداقة أو الوئام كمصطلح مستقل؛ هو مجاز بعيد لم يُسكّ في هذا المعنى"
      evidence_assessment:
        case: no_material


