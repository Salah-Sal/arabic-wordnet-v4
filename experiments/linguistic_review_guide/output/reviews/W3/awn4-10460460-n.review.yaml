# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. التوليد العمياء — بُني على التعريف وحده (synset_info_masked.yaml)
  # التعريف: لاعب في رياضة جماعية يقود الهجمات أو المناورات بطريقة تمكن زميله من التسجيل
  blind_candidates:
    - lemma: "صَانِعُ اللَّعِبِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «صانع» (اسم فاعل من صَنَعَ) و«اللعب» (مصدر لَعِبَ).
        صانعُ اللعبِ هو مَن يُبدع الحركاتِ التكتيكية ويُنشئ فرصَ التسجيل؛
        يُقابل مباشرةً المصطلحَ الإنجليزي play-maker، ويَجري استخدامُه في
        التعليق الرياضي العربي على كرة القدم. اجتاز اختبارَ التثبيت المعجمي
        بوصفه تركيباً إضافياً ثابتاً (لا يمكن إبدال «اللعب» بمرادفه «المباراة»
        دون تغيير الدلالة المقصودة).

    - lemma: "مُمَهِّد"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن مُفَعِّل من الجذر مهد. مَهَّدَ الأمرَ: وَطَّأَهُ
        وهيَّأَهُ. المُمَهِّدُ في السياق الرياضي هو مَن يُمهِّد الفرصةَ
        لزميله ليُسجِّل. الاشتقاق صحيح، والوزن مُفَعِّل يدل على الفاعل
        المُكثِّر للفعل.

    - lemma: "مُيَسِّر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن مُفَعِّل من الجذر يسر. يَسَّرَ الشيءَ: جعله
        سهلاً ميسوراً. المُيَسِّر في الفريق هو مَن ييسّر لزملائه إحراز
        الأهداف، ومن هذا الجذر مقاييسُه: «الْيُسْرُ ضِدُّ الْعُسْرِ».

    - lemma: "مُحَرِّك"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن مُفَعِّل من الجذر حرك. مَحور الفريق الذي يُحرِّك
        اللعب ويُديره؛ يُقال: «محرِّك الفريق» في التعليق الرياضي. الحركة
        عند ابن فارس: «ضِدُّ السُّكُونِ»، وهو هنا مجاز عن إدارة الديناميكية
        الهجومية.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - >
        اللمّة الوحيدة «صانع ألعاب» تفتقر إلى التشكيل الكامل، وهو شرط
        إلزامي في AWN4.
      - >
        الخطأ الجوهري: «ألعاب» جمعُ «لعبة» (toy / game)، فيكون «صانع
        ألعاب» بمعنى «مُصنِّع الألعاب» أو «مصمِّم الألعاب»، لا «صانع
        اللعب» بمعنى playmaker. والمصطلح الصحيح يستوجب المفردَ «اللعب»
        لا الجمعَ «الألعاب».
      - >
        دليل الجسر الإنجليزي (المورد الحديث 2008) يُقابل «playmaker» بـ
        «قائد جناح الهجوم [في فريق رياضيّ]»، ولا يُشير إلى «صانع ألعاب»
        بتاتاً، مما يُثبت غياب الإجماع المعجمي على هذا التعبير.
      - >
        المجموعة تحتوي على لمّة واحدة فقط رغم أن مفهوم playmaker يُستعمل
        في مختلف الرياضات الجماعية (كرة القدم، السلة، كرة اليد، الهوكي).
    observations: >
      المفهوم المقصود هو اللاعب الذي يَصنع اللعب (يُنشئ الفرص) لا الذي
      يَلعب فحسب. في التراث العربي الرياضي المعاصر يَشيع تعبير «صانع اللعب»
      بكسر اللام وإسكان العين (اللَّعِب: المصدر). المجموعة تحتاج إلى:
      (أ) حذف اللمّة الخاطئة «صانع ألعاب»، (ب) إضافة «صَانِعُ اللَّعِبِ»
      بتشكيل كامل بوصفها اللمّةَ الصحيحة والوحيدة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# ميزانية الاستعلامات المُنفَّذة: ٤ استعلامات
#   ١. مطابقة دفعية: صانع ألعاب (مكوناته) + المرشحات الأربعة
#   ٢. جسر إنجليزي: playmaker / play-maker / play maker
#   ٣. FTS عربي: هجمات، مناورات، تسجيل، صانع اللعب
#   ٤. مقاييس اللغة: جذور صنع، لعب، مهد، يسر، حرك
stage2_evidence:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "صانع ألعاب"
      contradicts:
        - text: "«ألعاب: games»"
          source: "مسرد الفن، التسلية والرياضة — ALECSO (arabterm)"
          conflict: >
            «ألعاب» في المعجم الرياضي مقابلٌ للـ games (الألعاب/التسليات)
            لا للـ play (فعل اللعب)؛ فيكون «صانع ألعاب» = game maker / toy
            maker لا playmaker.
        - text: "«العاب: الوَصْمة»"
          source: "المعجم الوسيط (OCR)"
          conflict: >
            «العاب» المُسوَّاة (من عيب لا لعب) تحمل معنى الوَصْمة والعيب،
            مما يُبيِّن التشابك المعجمي الناجم عن التطابق الصوري بين
            «ألعاب» (normalized: العاب) و«العاب» (من عيب).
        - text: >
            «قائد جناح الهجوم [في فريق رياضيّ].» — مقابل playmaker
          source: "المورد الحديث (Al-Mawrid Al-Hadeeth 2008) — arabterm"
          conflict: >
            أبرز معجم عربي-إنجليزي حديث يُقابل playmaker بـ «قائد جناح
            الهجوم» لا بـ «صانع ألعاب»، مما يُثبت أن «صانع ألعاب» لم
            يَرسخ مصطلحاً معتمداً لهذا المفهوم.

    # ── مرشحات المرحلة ١ ──
    - lemma: "صَانِعُ اللَّعِبِ"
      source: stage1
      expands:
        - text: >
            «(الصَّانِعُ) مَن يصنع بيديه مَنْ يحترف الصناعة امرأة صانعة
            اليدين: ماهرة حَاذِقَةٌ مُجيدة في عمل اليدين»
          source: "المعجم الوسيط (OCR)"
          addition: >
            يُثبت أن «صانع» اسمُ فاعل راسخ بمعنى «الفاعل المُحترِف
            المُجيد»، وهو ما يُناسب وصف اللاعب المتخصص في صنع الفرص.
        - text: >
            «(لَعِبَ) اللَّامُ وَالْعَيْنُ وَالْبَاءُ كَلِمَتَانِ مِنْهُمَا
            يَتَفَرَّعُ كَلِمَاتٌ. إِحْدَاهُمَا اللَّعِبُ مَعْرُوفٌ.
            وَالتِّلْعَابَةُ: الْكَثِيرُ اللَّعِبِ. وَالْمَلْعَبُ: مَكَانُ
            اللَّعِبِ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            «اللَّعِب» كلمةٌ عربية أصيلة، وإضافة «صانع» إليها معرَّفةً
            بأل تُنتج تركيباً إضافياً واضح الدلالة على «مَن يُبدع حركات
            اللعب».

    - lemma: "مُمَهِّد"
      source: stage1
      expands:
        - text: >
            «(مَهَدَ) الْمِيمُ وَالْهَاءُ وَالدَّالُ كَلِمَةٌ تَدُلُّ
            عَلَى تَوْطِئَةٍ وَتَسْهِيلٍ لِلشَّيْءِ. وَمِنْهُ الْمَهْدُ.
            وَمَهَّدْتُ الْأَمْرَ: وَطَّأْتُهُ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر مهد يحمل معنى التمهيد والتوطئة، وهو قريب من دور
            صانع اللعب. غير أن المعاجم الحديثة لم تُسكّ منه مصطلحاً
            رياضياً محدداً.
      contradicts:
        - text: >
            «(المُمَهَّدُ) المُهَيَّأُ المُسَوَّى. وماءٌ مُمَهَّدٌ:
            لا حارٌّ ولا بارد»
          source: "المعجم الوسيط (OCR)"
          conflict: >
            المعجم يُثبت «المُمَهَّد» (مفعول) لا «المُمَهِّد» (فاعل)؛
            الاستخدام الشائع للوزن في اللغة هو الوصفُ المنفعل
            لا الفاعل الذي يُمهِّد لغيره، مما يُضعف الصرامةَ
            الاصطلاحية للمرشح.

    - lemma: "مُيَسِّر"
      source: stage1
      contradicts:
        - text: >
            «(يَسَرَ) ... وَالْمَيْسِرُ: الْقِمَارُ. وَمِنَ الْبَابِ
            الْأَيْسَارُ: الْقَوْمُ يَجْتَمِعُونَ عَلَى الْمَيْسِرِ»
          source: "مقاييس اللغة لابن فارس"
          conflict: >
            الجذر يسر مثقَّلٌ بمعنى الميسر (القمار) الوارد في القرآن الكريم
            (البقرة: ٢١٩، المائدة: ٩٠). وإن كان «مُيَسِّر» (بتشديد السين)
            يُستعمل حديثاً بمعنى facilitator، إلا أن الارتباط الديني
            والثقافي بالقمار يجعله غير ملائم في السياق الرياضي.
        - text: >
            «المَيسِر: اللعبُ بالقِداح وهو السهامُ قبل أن تُنصل وتُراش،
            وفي الجاهلية كانوا يتقامرون بها»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)"
          conflict: >
            تأكيد الدلالة القمارية للجذر في معاجم اللغة المعاصرة يمنع
            اعتماد «مُيَسِّر» مصطلحاً رياضياً دون إيهام غير مقصود.

    - lemma: "مُحَرِّك"
      source: stage1
      contradicts:
        - text: >
            «(المَحْرك) أصل العنق من أعلاه, وهو منتهى العنق عند
            المَفصِل من الرأس مقطع العنق»
          source: "المعجم الوسيط (OCR)"
          conflict: >
            «المَحْرَك» (بفتح الراء) مُصطلَحٌ تشريحي يدل على أصل العنق،
            لا دلالةَ له على اللاعب المُدير.
        - text: >
            «(المِحَرِّكُ) engine: آلةٌ تُحوِّل الطاقة إلى شغل...
            مُحَرِّك احتراق داخلى... مُوتوراً كهرِبائِيًّا»
          source: "المعجم الكبير — مجمع اللغة العربية (OCR)"
          conflict: >
            «المِحَرِّك» (بكسر الميم وتشديد الراء) قد استقرّ في العربية
            المعاصرة مصطلحاً هندسياً للـ engine/motor. استعمالُه في
            السياق الرياضي يُوقع في التعريف بلبسٍ مع هذا المعنى الراسخ.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "صانع ألعاب"
      decision: removed
      decision_reason: >
        «ألعاب» جمعُ «لعبة» (game / toy)، وليس مصدرَ «لعِب» (play).
        فالتركيبُ «صانع ألعاب» يعني لغةً «مُصنِّع الألعاب / مصمِّم
        الألعاب» لا «صانع اللعب (playmaker)». لا تشكيلَ على اللمّة.
        المعجم الرياضي (arabterm) يُثبت أن «ألعاب = games» لا «اللعب».
        المورد الحديث لا يُورد «صانع ألعاب» مقابلاً لـ playmaker.
        الإجراء: إزالة الربط بالمجموعة والاستعاضة بـ «صَانِعُ اللَّعِبِ».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشح المرحلة ١: مؤكَّد ──
    - lemma: "صَانِعُ اللَّعِبِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        تركيب إضافي ثابت (صانع + اللعب)، يُعادل مباشرةً المصطلحَ
        الإنجليزي playmaker. «اللَّعِب» (بكسر العين) مصدرٌ قياسيٌّ
        من لَعِبَ، يُشير إلى فعل اللعب التكتيكي. الوحدةُ المعجمية
        اجتازت اختبار التثبيت: لا يمكن إبدال «اللعب» بـ «المباراة»
        أو «الرياضة» دون كسر المعنى. يَشيع في التعليق الرياضي العربي
        على كرة القدم، ويُسدّ به فراغٌ معجمي واضح. تشكيلُه الكامل
        «صَانِعُ اللَّعِبِ» يُزيل أيَّ لبس مع «الألعاب».
        بوابة الجودة: (١) اطّراد الجذرَيْن صنع ولعب ✓
        (٢) يُسر التداول (مقطعان) ✓ (٣) ملاءمة رياضية ✓
        (٤) تراثية الجذرَيْن ✓ (٥) عربية صرفة ✓
        (٦) اشتقاقية صانع (صنع) واضحة ✓.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        «صَانِعُ اللَّعِبِ» أخصُّ من المتضمِّن «لاعب/مشارك»:
        يُحدِّد وظيفةً تكتيكيةً بعينها (إنشاء الفرص) لا مجرد
        المشاركة في اللعب. لا يُوجد في هذه المجموعة لمّةٌ أخرى
        مؤكَّدة تحتاج إلى التمييز منها داخلياً.
      actions:
        - command: create_entry
          params:
            lemma: "صَانِعُ اللَّعِبِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشحات مرفوضة ──
    - lemma: "مُمَهِّد"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر مهد يناسب مفهوم التمهيد للفرصة، غير أن المعاجم تُثبت
        «المُمَهَّد» (مفعول/صفة: المهيَّأ) أكثر من «المُمَهِّد» (فاعل).
        ويبقى المصطلحُ مجرَّداً من التخصيص الرياضي؛ إذ يصحّ وصفُ أيِّ
        شخص يُهيِّئ أمراً بـ «مُمَهِّد» دون إيحاء رياضي تحديداً،
        مما يعني عدم اجتياز اختبار السكّ الاصطلاحي.

    - lemma: "مُيَسِّر"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر يسر مثقَّل بدلالة «الميسر» (القمار) الواردة في القرآن
        الكريم ومعاجم اللغة. وإن استُعمل «مُيَسِّر» حديثاً بمعنى
        facilitator في سياقات تربوية وتجارية، فإن توظيفَه مصطلحاً
        رياضياً يُوقع في إيهام ثقافي وديني غير مقبول.

    - lemma: "مُحَرِّك"
      source: stage1
      decision: removed
      decision_reason: >
        «المِحَرِّك» استقرَّ في العربية المعاصرة مصطلحاً هندسياً
        للـ engine/motor (المعجم الكبير، مجمع اللغة العربية). ويدل
        «المَحْرَك» (بفتح الراء) على أصل العنق تشريحياً. كلا
        المعنيَيْن الراسخَيْن يحولان دون توظيف «مُحَرِّك» مصطلحاً
        رياضياً دون لبس مزدوج.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:

  definition:
    current: "لاعب في رياضة جماعية يقود الهجمات أو المناورات بطريقة تمكن زميله من التسجيل"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي قريبٌ من الترجمة الحرفية للتعريف الإنجليزي (a player
        in a team sport who leads attacks or maneuvers in such a way that a
        teammate can score). يَشتمل على فعلَيْ «يقود» و«يُمكِّن» دون تسليط
        الضوء على الجوهر الوظيفي: إنشاء الفرص وتهيئة اللعب. أسلوبه قريب
        من النقل لا من التأليف المعجمي. يُستحسن الصياغة بأسلوب المعجم الوسيط.
    authored:
      - type: terminological
        text: >
          لاعبٌ في رياضةٍ جماعيةٍ يتخصَّص في تنظيم الهجوم وإنشاء الفُرَص
          التسجيلية لزملائه في الفريق من خلال التمريرات الدقيقة والحركات
          التكتيكية المُحكَمة.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          اللاعب المَحوريُّ في الرياضات الجماعية كَكُرَة القَدَم وكُرَة
          السَّلَّة وكُرَة اليَدِ والهُوكَيِ، الذي يضطلع بتنظيم الهجمات
          وتوزيع الكرات في المواضع الخطيرة، مُمَكِّناً زملاءَه من إحراز
          الأهداف. يتسم بالرؤية التكتيكية الواسعة والدقة في توقيت التمريرة.
          يُطلق عليه أيضاً «قائد جناح الهجوم» في بعض المصادر.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
