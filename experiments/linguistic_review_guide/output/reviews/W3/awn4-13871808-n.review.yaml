# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13871808-n (ninetieth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «التسعون» خالية من التشكيل — يجب ضبطها: «التِّسْعُونَ»."
      - "التعريف «المركز 90 في سلسلة معدودة من الأشياء» ترجمة حرفية من الإنجليزية ولا يتّسق مع أسلوب المعاجم العربية."
    observations: "المجموعة تمثّل مفهوم العدد الترتيبي التسعين (ninetieth). في العربية، الأعداد فوق العشرة تُستعمل صيغتها الأصلية (العقود) للدلالة على الترتيب، فيُقال: «الباب التسعون» بمعنى الباب رقم ٩٠. اللمّة الوحيدة الموجودة هي «التسعون» وهي صحيحة لغوياً، لكنّها تحتاج إلى ضبط بالشكل."
  blind_candidates:
    - lemma: "التِّسْعُونَ"
      generation_method: ishtiqaq
      justification: "صيغة العقد المعروفة من الجذر «تسع» على وزن فِعْلُون (تِسْعُون)، وهي الصيغة الفصيحة المعيارية للدلالة على العدد ٩٠ ترتيبياً وعددياً."
    - lemma: "تِسْعِينِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى تسعين على وزن فِعْلِينِيّ، يمكن أن تُستعمل صفةً للمرتبة التسعين، لكنّها ليست اسماً للمرتبة ذاتها."
    - lemma: "المَرْتَبَةُ التِّسْعُونَ"
      generation_method: tarkib
      justification: "مركب وصفي من «المرتبة» + «التسعون»، يصف المفهوم وصفاً حراً وليس مصطلحاً مسكوكاً."
    - lemma: "ذُو التِّسْعِينَ"
      generation_method: tarkib
      justification: "مركب إضافي من «ذو» + «التسعين»، محاولة للتعبير عن صاحب الرتبة التسعين، لكنّه ليس تعبيراً اصطلاحياً ثابتاً."

stage2_evidence:
  per_lemma:
    - lemma: "التِّسْعُونَ"
      confirm:
        - text: "«العَدَدُ التَّاسِعُ بَيْن العُقُود, يَستَوى فيه المُذَكَّر والمُؤَنَّث.»"
          source: "المعجم الكبير"
        - text: "«(1) التسعون (2) بالغٌ جزءًا من تسعين من كذا (3) التسعون من كذا (4) جزء من تسعين.»"
          source: "المورد الحديث (2008) — ترجمة ninetieth"
      expands:
        - text: "«إِنَّ هَذَا أَخِى لَهُ تِسْعٌ وتِسْعُونَ نَعْجَةً وَلِىَ نَعْجَةٌ واحِدَةٌ» (ص: ٢٣)"
          source: "المعجم الكبير — شاهد قرآني"
          addition: "شاهد قرآني يوثّق استعمال صيغة تسعون في سياق العدّ"
    - lemma: "تِسْعِينِيّ"
      evidence_status: "no_material_found"
    - lemma: "المَرْتَبَةُ التِّسْعُونَ"
      evidence_status: "no_material_found"
    - lemma: "ذُو التِّسْعِينَ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "التِّسْعُونَ"
      decision: confirmed
      decision_reason: "اللمّة مطابقة للمفهوم تماماً. العدد «تسعون» من ألفاظ العقود المعروفة، وهو الصيغة الفصيحة الوحيدة للدلالة على المرتبة التسعين ترتيبياً. ورد في المعجم الكبير والمورد الحديث. تحتاج فقط إلى ضبط بالتشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "التِّسْعُونَ"
    - lemma: "تِسْعِينِيّ"
      source: stage1
      decision: removed
      decision_reason: "صيغة النسبة «تسعينيّ» تُستعمل صفةً (عقد تسعينيّ) ولا تدلّ على المرتبة الترتيبية ذاتها. لا أدلة معجمية تدعم استعمالها اسماً للمرتبة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
    - lemma: "المَرْتَبَةُ التِّسْعُونَ"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً مسكوكاً. يمكن إبدال «المرتبة» بـ«الدرجة» أو «المنزلة» مع بقاء المعنى، ممّا يدلّ على أنها ليست وحدة معجمية ثابتة (فشل اختبار السكّ)."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
    - lemma: "ذُو التِّسْعِينَ"
      source: stage1
      decision: removed
      decision_reason: "تركيب إضافي مصطنع لا سند له في الاستعمال المعجمي ولا في النصوص. ليس تعبيراً اصطلاحياً ثابتاً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

