# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل (ألفين إيلي، إيلي)"
      - "اللمّة المختصرة 'إيلي' قد تلتبس بالاسم العربي الشائع 'إيلي' (تصغير إيليا) الوارد في معاجم الأسماء العربية"
      - "التعريف الحالي لا يذكر سنة الوفاة (1989) مع أن الشخص قد توفي"
      - "الصنف النحوي مسجَّل n (اسم عادي)، غير أن هذا علمٌ شخصي ينبغي أن يُصنَّف proper_noun"
    observations: >-
      هذه المجموعة تخصّ عَلَماً شخصياً بعينه — ألفين إيلي (1931–1989)، مصمم الرقصات الأمريكي
      المشهور بتوظيف العناصر الأفريقية والأفرو-أمريكية في الرقص المعاصر، ومؤسس فرقة
      "ألفين إيلي أمريكان دانس ثيتر". الأعلام الشخصية في المعجم الشبكي تُقيَّد عادةً
      بالتعريب الصوتي (taarib)، وليس بالاشتقاق. التحدي الرئيس هو اختيار أدقّ صياغة
      فونولوجية عربية للاسمين "Alvin" و"Ailey". جميع المرشحات الممكنة ستكون ضرباً من
      ضروب التعريب، مما يجعل التنوّع محدوداً بتفاوت الرسم الإملائي.

  blind_candidates:
    - lemma: "أَلْفِين أَيْلِي"
      generation_method: taarib
      justification: >-
        تعريب صوتي مباشر للاسم الكامل "Alvin Ailey": "أَلْفِين" تعريب لـ Alvin
        بإبدال الفاء عن الـ v وإضافة ياء المد للتقريب، و"أَيْلِي" ترسم الثنائي [eɪ]
        بصورة دقيقة عبر الهمزة المفتوحة والياء الساكنة.
    - lemma: "أَلْفِين إِيلِي"
      generation_method: taarib
      justification: >-
        صياغة بديلة للاسم الكامل تستبدل الثنائي [eɪ] بمدّ الكسرة الطويلة [ī]،
        وهو اختيار شائع في الصحافة العربية والمراجع الموسوعية حين يُكتب اللقب "Ailey".
    - lemma: "أَيْلِي"
      generation_method: taarib
      justification: >-
        تعريب اللقب "Ailey" وحده بصياغة تُبرز الثنائي الصوتي [eɪ] عبر همزة مفتوحة
        وياء ساكنة، ويُستخدم اللقب منفرداً في السياقات الأكاديمية والنقدية للإشارة
        إلى المصمم بعد تعريفه أول مرة بالاسم الكامل.
    - lemma: "إِيلِي"
      generation_method: taarib
      justification: >-
        تعريب اللقب "Ailey" بمدّ الكسرة الطويلة بدلاً من الثنائي، موازياً لاللفظ
        الأكثر شيوعاً في النصوص المترجمة العربية حيث تُكتب [eɪ] بالياء الطويلة [ī].


