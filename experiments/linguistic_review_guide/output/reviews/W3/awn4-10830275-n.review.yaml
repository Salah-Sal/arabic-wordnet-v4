# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "ألفين إيلي"
      decision: confirmed
      decision_reason: >-
        هذا هو الشكل الكامل للعَلَم الشخصي "Alvin Ailey" وهو الصياغة الأساسية
        اللازمة لتمييز هذه المجموعة عن غيرها. رغم غياب الأدلة المعجمية في قاعدة
        البيانات، فإن الأعلام الشخصية لا تُدرج عادةً في معاجم اللغة العامة.
        يُبقى الاسم ويُضاف إليه التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الاسم الكامل "أَلْفِين إِيلِي" — يُستخدم في السياق الرسمي والأكاديمي والتعريفي
        حين يُذكر المصمم لأول مرة، وفي العناوين والفهارس الببليوغرافية.
      morphological_check: >-
        "أَلْفِين" تعريب لـ Alvin على وزن أَفْعِيل أو فَعْلِين، و"إِيلِي" تعريب
        لـ Ailey بمدّ الكسرة الطويلة [ī]. كلاهما معرَّب وليس له وزن صرفي عربي أصيل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَلْفِين إِيلِي"

    - lemma: "إيلي"
      decision: confirmed
      decision_reason: >-
        اللقب المختصر "إيلي" مستعمَل في المراجع العربية للإشارة إلى "Ailey" بعد
        تقديمه بالاسم الكامل. رغم التعارض مع الاسم العربي "إيلي" (تصغير إيليا)،
        فإن السياق الموسوعي في المجموعة الترادفية يُزيل الغموض. يُبقى اللقب
        مع إضافة التشكيل. ومع ذلك يُوصى بمراجعة هذا القرار في تحديثات مستقبلية
        نظراً للالتباس المعجمي الموثَّق.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        اللقب المختصر "إِيلِي" — يُستخدم في السياقات المختصرة والإشارة الضمنية
        بعد تعريف الشخص بالاسم الكامل في السياق ذاته.
      morphological_check: >-
        تعريب صوتي للقب "Ailey"، وزنه فِيلِي قياساً على الكلمات المعرَّبة المنتهية
        بالياء الطويلة. لا أصل صرفي عربي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيلِي"

    # ── مرشحات المرحلة ١ ──
    - lemma: "أَلْفِين أَيْلِي"
      source: stage1
      decision: removed
      decision_reason: >-
