  per_sense:
    - lemma: "هَامْبْتُون رُودْز"
      sense_id: "{auto}"
      nuance: "النقل الصوتي المباشر للاسم العلم."
      mwe: true
    - lemma: "مَرَاسِي هَامْبْتُون"
      sense_id: "{auto}"
      nuance: "تسمية وصفية دالة على الوظيفة البحرية للمكان كمراسي للسفن."
      mwe: true
  synset:
    cultural_fit: omission
  actions:
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"النقل الصوتي المباشر للاسم العلم","mwe":true}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"تسمية وصفية دالة على الوظيفة البحرية للمكان كمراسي للسفن","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
