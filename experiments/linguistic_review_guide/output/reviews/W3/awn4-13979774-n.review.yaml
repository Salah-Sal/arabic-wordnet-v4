# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13979774-n (truth / حقيقة)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «صحة» معناها الأصلي الخلوّ من المرض، واستعمالها بمعنى المطابقة للواقع ثانوي ومشروط بالسياق"
      - "التعريف العربي «المطابقة للواقع أو الفعليّة» مقبول لكنه مقتضب ولا يميّز بين الحقيقة الفلسفية والمنطقية"
      - "اللمّات الثلاث بدون تشكيل كامل"
    observations: >
      المفهوم (المطابقة للواقع) من أعمق المفاهيم في الفلسفة العربية الإسلامية،
      وله حضور قوي في التراث اللغوي والكلامي والفلسفي. اللمّات الموجودة (حقيقة، صحة، صدق)
      تغطي أوجهاً مختلفة من المفهوم: الحقيقة = ماهية الشيء الثابت، الصدق = مطابقة الكلام
      للواقع، الصحة = الخلو من الخلل (والبعض يستعملها بمعنى المطابقة). المفرق الأهم
      هو أنّ «صدق» يتعلّق بالقول، و«حقيقة» بالوجود، و«صحة» بالسلامة من الخطأ.
  blind_candidates:
    - lemma: "حَقِيقَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ح-ق-ق على وزن فَعِيلَة بمعنى ما ثبت ووجب. الدلالة على المطابقة
        للواقع مباشرة: حقيقة الشيء = كنهه وخالصه.
    - lemma: "صِدْق"
      generation_method: ishtiqaq
      justification: >
        من الجذر ص-د-ق على وزن فِعْل (مصدر). الصدق في اللغة مطابقة الكلام
        للواقع بحسب اعتقاد المتكلم، وهو نقيض الكذب.
    - lemma: "صِحَّة"
      generation_method: ishtiqaq
      justification: >
        من الجذر ص-ح-ح على وزن فِعْلَة. تُستعمل بمعنى مطابقة الشيء للواقع
        في سياقات مثل «صحة الخبر» و«صحة النظرية».
    - lemma: "صَوَاب"
      generation_method: ishtiqaq
      justification: >
        من الجذر ص-و-ب على وزن فَعَال. الصواب ضد الخطأ، ويُستعمل في الرياضيات
        والمنطق مقابل truth (جدول الصواب، قيمة الصواب).


stage2_evidence:
  per_lemma:
    - lemma: "حَقِيقَة"
      confirm:
        - text: "«الشيء الثابت يقيناً... ما استعمل في معناه الأصلي. حقيقة الشيء: خالصه وكنهه. حقيقة الأمر: يقين شأنه»"
          source: "المعجم الوسيط"
        - text: "«في الفلسفة: مُطابَقَةُ الفِكْرِ للواقع. عند المتكلمين: مُطابَقَةُ ما بالأَذْهانِ للأَعْيانِ»"
          source: "المعجم الكبير"
        - text: "«حقيقة الشيء ما به الشيء هو هو كالحيوان الناطق للإنسان... وقد يقال إن ما به الشيء هو هو باعتبار تحققه حقيقة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«يتموضع الاصطلاح داخل الخطاب كثمرة تحقق شيء، يستبعد كل علاقة مع مرجع خارجي، رغم مقبوليته وإمكانية إثبات واقعه»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "البُعد اللساني للحقيقة بوصفها ثمرة تحقّق داخل الخطاب"
        - text: "«الحقيقة عند أهل الحق: سلب آثار أوصافك عنك بأوصافه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "البُعد الصوفي للحقيقة"

    - lemma: "صِدْق"
      confirm:
        - text: "«مطابقة الكلام للواقع بحسب اعتقاد المتكلم، وهو نقيض الكذب»"
          source: "المعجم الكبير"
        - text: "«مطابقة القول للواقع سواء أكان اعتقادا أم أحداثا»"
          source: "مسرد الإعلام والتواصل (ALECSO)"
        - text: "«الصِّدْق: نقيض الكذب، صَدَقَ يَصْدُقُ صَدْقاً وصِدْقاً»"
          source: "لسان العرب لابن منظور"
      expands:
        - text: "«الصِّدْق والكذب أصلهما في القول، ماضيا كان أو مستقبلا، وعدا كان أو غيره، ولا يكونان بالقصد الأوّل إلا في القول»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
          addition: "تقييد الصدق بالقول أصالةً، وتعديه إلى الفعل بالعرض"
        - text: "«الأمرُ الصَّالحُ لا شِيَةَ فيهِ مِن نقص أو كذبٍ»"
          source: "المعجم الكبير"
          addition: "الصدق بمعنى الأمر السليم من الخلل والنقص"

    - lemma: "صِحَّة"
      confirm:
        - text: "«(3) الصِّحّة: مطابقة الحقيقة أو الواقع»"
          source: "المورد الحديث (2008) — مقابل truth"
      contradicts:
        - text: "«الخُلُوُّ من المرَض»"
          source: "المعجم الكبير"
          conflict: "المعنى الأصلي والأولي لـ«صحة» هو الخلو من المرض، لا المطابقة للواقع"
        - text: "«(صَحَّ) الصَّادُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى الْبَرَاءَةِ مِنَ الْمَرَضِ وَالْعَيْبِ، وَعَلَى الِاسْتِوَاءِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل الاشتقاقي يدل على البراءة من المرض والعيب، لا على مطابقة الواقع"
      expands:
        - text: "«في الفقه: كونُ الفعل مُسْقِطًا للقضاء في العبادات، أو سببًا لتَرَتُّب ثمرته المطلوبة منه عليه شرعًا في المعاملات. ويقابلها: البُطْلان»"
          source: "المعجم الكبير"
          addition: "الصحة الفقهية بمعنى النفاذ الشرعي مقابل البطلان"

    - lemma: "صَوَاب"
      confirm:
        - text: "«صواب — truth»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ALECSO)"
      contradicts:
        - text: "«ضدُّ الخطأ. السَّدادُ فِي القول والفِعْل ونحوهما»"
          source: "المعجم الكبير"
          conflict: "الصواب = ضد الخطأ (correctness)، لا المطابقة للواقع (truth) بالمعنى الفلسفي"
        - text: "«السَّدادُ الحقُّ»"
          source: "المعجم الوسيط"
          conflict: "التعريف يفسّره بالسداد والحق، وهو أقرب إلى الصحة العملية منه إلى الحقيقة الوجودية"


stage3_analysis:
  per_lemma:
    - lemma: "حَقِيقَة"
      decision: confirmed
      decision_reason: >
        لمّة أصيلة ومحورية. المعاجم العربية الكبرى تُعرّف الحقيقة بأنها
        «مطابقة الفكر للواقع» (المعجم الكبير) وهو المعنى المطابق تماماً لتعريف
        المجموعة الترادفية. الحقيقة هي اللفظ الأول والأدق لهذا المفهوم في العربية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الحقيقة تدل على المطابقة للواقع من حيث الوجود والماهية، وتشمل الحقيقة
        الفلسفية والمنطقية واللغوية. هي اللفظ الأعم والأصل في هذا الحقل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَقِيقَة"

    - lemma: "صِدْق"
      decision: confirmed
      decision_reason: >
        لمّة ثابتة معجمياً بمعنى «مطابقة الكلام للواقع». المعاجم الكبرى متفقة
        على هذا التعريف. وإن كان الصدق يتعلق بالقول أصالةً، فإنه يمتد إلى
        مطلق المطابقة عند بعض الاستعمالات.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الصدق مطابقة القول والخبر للواقع خاصةً، ويقابله الكذب.
        بخلاف الحقيقة التي تتعلق بالوجود والماهية، الصدق يتعلق بالإخبار والكلام.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صِدْق"

    - lemma: "صِحَّة"
      decision: removed
      decision_reason: >
        المعنى الأصلي لـ«صحة» هو الخلو من المرض والعيب (المعجم الكبير، مقاييس
        اللغة). استعمالها بمعنى «مطابقة الواقع» ثانوي ومحدود بسياقات مثل «صحة الخبر»
        (= ثبوته)، وهو أقرب إلى الصلاحية (validity) منه إلى الحقيقة (truth).
        الدليل الوحيد المؤيد مصدره معجم ثنائي اللغة (المورد)، بينما المعاجم
        العربية الأحادية لا تذكر هذا المعنى أصلاً. إبقاؤها يُضعف دقة المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "صَوَاب"
      source: stage1
      decision: removed
      decision_reason: >
        الصواب = ضد الخطأ، أي السداد في القول والفعل. هذا أقرب إلى مفهوم
        «الصحة العملية» أو «الدقة» منه إلى «المطابقة للواقع». استعماله مقابل
        truth في الرياضيات (جدول الصواب) استعمال اصطلاحي محدود لا يبرر
        إدراجه في مجموعة ترادفية عامة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


