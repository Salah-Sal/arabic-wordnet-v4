stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط بينما توجد أسماء تاريخية موثقة."
    observations: "هذه المجموعة الترادفية تمثل كياناً جغرافياً محدداً (Proper Noun). التسمية الحالية 'خليج العقبة' هي الأكثر شيوعاً وعصرية، ولكن من الناحية المعجمية والتاريخية، عُرف هذا الخليج بأسماء أخرى في التراث الجغرافي العربي يجب توثيقها لضمان شمولية الشبكة الدلالية."
  blind_candidates:
    - lemma: "خَلِيجُ العَقَبَةِ"
      generation_method: tarkib
      justification: "الاسم الجغرافي القياسي والحديث للذراع الشرقية للبحر الأحمر."
    - lemma: "خَلِيجُ أَيْلَةَ"
      generation_method: majaz
      justification: "الاسم التاريخي القديم للخليج نسبة إلى مدينة أيلة (العقبة حالياً)، وهو مستخدم بكثرة في كتب البلدان والجغرافيا الكلاسيكية."
    - lemma: "بَحْرُ العَقَبَةِ"
      generation_method: tarkib
      justification: "تسمية بديلة ترد أحياناً في السياقات الأدبية أو التاريخية."
    - lemma: "الخَلِيجُ الشَّرْقِيُّ"
      generation_method: tarkib
      justification: "وصف جغرافي يميّزه عن خليج السويس (الخلايج الغربي) في بعض المراجع."

stage2_evidence:
  per_lemma:
    - lemma: "خليج العقبة"
      confirm:
        - text: "«خليج العقبة: Gulf of Aqaba»"
          source: "المكنز الزراعي متعدد اللغات"
        - text: "«سيناء... يحدُّها شرقًّا خليج العقبة وفلسطين»"
          source: "المعجم الكبير"
        - text: "«جزيرة شدوان... تقع بالقرب من مدخل خليج السويس وخليج العقبة بالبحر الأحمر»"
          source: "المعجم الكبير"
    - lemma: "خَلِيج أَيْلَة"
      confirm:
        - text: "«بحر القلزم... مضى إلى جدة... ثم ساحل الطور وساحل التيماء وخليج أيلة وساحل راية حتى بلغ قلزم مصر»"
          source: "معجم البلدان (ياقوت الحموي - مستند في تعريف القلزم في المعجم الكبير)"
        - text: "«جزيرة العرب... ثم ساحل الطور وخليج أيلة وساحل راية حتى بلغ قلزم مصر»"
          source: "المعجم الكبير (تعريف جزيرة العرب)"
      expands:
        - text: "«أيلة: مدينة دارسة، قامت عند نهاية خليج العقبة على البحر الأحمر»"
          source: "المعجم الكبير"

stage3_analysis:
  per_lemma:
    - lemma: "خليج العقبة"
      decision: confirmed
      decision_reason: "الاسم العربي القياسي والمستقر عالمياً وجغرافياً لهذا الكيان."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَلِيجُ العَقَبَةِ"
    - lemma: "خَلِيج أَيْلَة"
      source: stage1
      decision: confirmed
      decision_reason: "مرادف تاريخي موثق في أمهات كتب الجغرافيا العربية (مثل ياقوت الحموي) ويستخدم في النصوص التاريخية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "خَلِيجُ أَيْلَةَ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09320146-n"

stage4_content:
  definition:
    current: "ذراع شمالية شرقية للبحر الأحمر؛ بين شبه جزيرة سيناء (مصر) والمملكة العربية السعودية"
    assessment:
      decision: revise
      reason: "التعريف الحالي دقيق جغرافياً لكنه يحتاج صياغة معجمية أمتن وإضافة البعد الحدودي للأردن وفلسطين لاكتمال الوصف الموسوعي."
    authored:
      - type: encyclopedic
        text: "أحد ذراعي البحر الأحمر الشماليين، يمتد بين شبه جزيرة سيناء غرباً وساحل المملكة العربية السعودية شرقاً، وينتهي شمالاً عند مدينة العقبة، ويشكل الحدود المائية لكل من مصر والأردن والسعودية وفلسطين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09320146-n"
          definition_index: 0
          text: "أحد ذراعي البحر الأحمر الشماليين، يمتد بين شبه جزيرة سيناء غرباً وساحل المملكة العربية السعودية شرقاً، وينتهي شمالاً عند مدينة العقبة، ويشكل الحدود المائية لكل من مصر والأردن والسعودية وفلسطين."
  examples:
    per_lemma:
      - lemma: "خَلِيجُ العَقَبَةِ"
        examples:
          - text: "تُعدّ مدينة شرم الشيخ المصرية نقطة التقاء خليج السويس بخليج العقبة."
            type: usage
      - lemma: "خَلِيجُ أَيْلَةَ"
        examples:
          - text: "كان الحجاج القادمون من مصر يمرون بساحل الطور ثم يلتفون حول خليج أيلة في طريقهم إلى مكة."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-09320146-n"
          text: "يمتاز خليج العقبة بعمق مياهه وتنوع الشعاب المرجانية فيه."

