stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان بلا تشكيل — يجب إضافة التشكيل الكامل"
      - "«فنان رومانسي» مركب توصيفي حر لا يرقى إلى مصطلح مسكوك؛ يجتاز اختبار الاستبدال (يمكن إحلال «شاعر» أو «موسيقار» مكان «فنان»)"
      - "التعريف العربي الحالي مبهم — لفظ «الرومانسية» يحتمل معنيين: المذهب الأدبي التاريخي والمشاعر العاطفية العامة"
      - "غياب المصطلح العربي الأصيل «ابتداعيّ» (موثَّق في المعجم الوسيط وإن كان نادر الاستعمال)"
    observations: >
      المجموعة تغطي مفهومَيْن متلازمَيْن: (أ) الفنان أو الأديب المنتسب تاريخياً إلى الحركة الرومانتيكية
      (أواخر القرن 18 — منتصف القرن 19) بخصائصها المعروفة من إبراز الخيال والتعبير الذاتي والولع بالطبيعة؛
      و(ب) أي شخص تأثّر بروح هذه الحركة. تتداول المعاجم العربية الحديثة صيغتَيْن: «رومانسيّ» (أشيع
      في الاستعمال العام) و«رومانتيكيّ» (أدق في الدلالة التاريخية المصطلحية). معجم الصواب يُجيز
      «رومانسي» لكنه يرجّح «ابتداعيّ» فصاحةً. التمييز بين الصيغتين ضروري لتجنّب الاشتراك اللفظي مع
      الاستخدام العاطفي العام للفظ «رومانسي».
  blind_candidates:
    - lemma: "رُومَانتِيكِيٌّ"
      generation_method: taarib
      justification: >
        تعريب للمصطلح الفرنسي/الإنجليزي "romantique/romantic" بصيغة أدق تربط اللفظ
        بمصطلح "رومانتيكية" الدال على الحركة الأدبية التاريخية بعيداً عن الحمولة العاطفية
        العامة التي اكتسبتها "رومانسي" في الاستعمال المعاصر. يقبل لام التعريف والنسبة
        والجمع السالم: الرومانتيكيون.
    - lemma: "وِجْدَانِيٌّ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر (و ج د) على وزن فِعْلاني — والوجدان هو البُعد المحوري في الحركة
        الرومانسية إذ تقدّم الحسّ والعاطفة على العقل. محاولة إيجاد مقابل اشتقاقي عربي
        بدلاً من الاعتماد على التعريب.
    - lemma: "خَيَالِيٌّ"
      generation_method: majaz
      justification: >
        مجاز من "الخيال" الذي كان ركيزة الحركة الرومانسية — إذاحة دلالية من "صاحب خيال"
        إلى "فنان رومانسي" عبر الوظيفة المحورية. محاولة استثمار مفردة تراثية إحياءً لها.
    - lemma: "فَنَّانٌ وِجْدَانِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي (موصوف + نعت) يجمع بين الجنس (فنان) والفصل (وجداني — ذو طابع عاطفي
        انفعالي). يُعبّر عن المفهوم بصورة مركّبة تميّزه عن الفنان الكلاسيكي.


