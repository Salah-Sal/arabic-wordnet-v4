# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10111766-n | ILI: i89962 | POS: n
# fire walker — الماشي على النار
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة «الماشي على النار» عبارة وصفية حرة لا مصطلح مسكوك؛ تخفق في اختبار السكّ
        لأن «النار» يمكن إبدالها بـ«الجمر» أو «الحريق» وتبقى الجملة صالحة كوصف."
      - "لفظ «النار» أعمّ من المفهوم المطلوب؛ إذ المشي يكون على الجمر المشتعل (الفحم المحترق)
        لا على شعلة مفتوحة، مما يُفضي إلى غموض دلالي."
      - "اللمة خالية من التشكيل الكامل."
      - "المجموعة تحتوي لمّةً واحدة فقط، مما يُضعف التوثيق الترادفي لمفهوم نادر في التراث العربي."
    observations: >
      المفهوم (شخص يمشي حافي القدمين على الجمر المشتعل) ينتمي إلى ميدان الأداء
      الاستعراضي والممارسات الروحانية المقارنة، وهو مفهوم هامشي في التراث العربي الكلاسيكي.
      لا يتوفر له مصطلح مسكوك في المعجمية العربية القديمة أو الحديثة، مما يجعل العبارة
      الوصفية «الماشي على النار» الملاذ الوحيد المتاح. ولما كانت الجذور التي يمكن
      الاشتقاق منها (جمر، وطأ، مشي، سلك) تُفضي إلى مرشحات غير موثقة توثيقاً معجمياً،
      يتعيّن الإبقاء على اللمة الوصفية مع توثيق ثغرتها الدلالية.
  blind_candidates:
    - lemma: "وَاطِئُ الْجَمْرِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «وَاطِئ» (اسم فاعل من وطئ: داس بقدمه، جذر وطأ) و«الْجَمْر»
        (جمع جمرة: الفحم المتّقد). الوَطْء بالقدم هو الفعل التقني المناسب أكثر من
        «المشي» لأنه يُركّز على ملامسة القدم للجمر. والتركيب الإضافي أوثق
        اصطلاحاً من الجملة الوصفية.
    - lemma: "سَالِكُ الْجَمْرِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «سَالِك» (اسم فاعل من سَلَكَ الطريقَ: نفذ فيه ومشى،
        جذر سلك) و«الْجَمْر». يُركّز على فعل السلوك في مسار من الجمر، وهو
        أنسب دلالياً من «الماشي على النار» لأن الجمر مُحدَّد.
    - lemma: "الْمُجَمِّر"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل على وزن مُفَعِّل من جذر جمر، بمعنى المتعامل مع الجمر أو
        المُشعل له. محاولة مجازية تحيل إلى الجمر مباشرة. لكنها تحتاج تثبيتاً
        معجمياً.
    - lemma: "مَاشِي الْجَمْرِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «مَاشِي» (اسم فاعل من مشى) و«الْجَمْر». أقرب إلى
        اللمة الموجودة «الماشي على النار» لكنه يستبدل «النار» بـ«الجمر» الذي
        هو الوصف التقني الصحيح للمفهوم.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# الاستعلامات المنفّذة:
#   ١. مطابقة دفعية لجميع اللمات (الموجودة + المرشحات) بصيغتَيها
#   ٢. جسر إنجليزي: fire walker, fire walking, firewalker, firewalking → صفر نتائج
#   ٣. بحث FTS عربي: جمر، الجمر، حافي، مشي على النار، جمرة → مصطلحات طبية واصطلاحية لا علاقة لها
#   ٤. مقاييس اللغة: جمر، سلك، مشي، وطأ، نور/نار
stage2_evidence:
  per_lemma:
    - lemma: "الماشي على النار"
      evidence_status: "no_material_found"

    - lemma: "وَاطِئُ الْجَمْرِ"
      evidence_status: "no_material_found"

    - lemma: "سَالِكُ الْجَمْرِ"
      evidence_status: "no_material_found"

    - lemma: "الْمُجَمِّر"
      contradicts:
        - text: "«المِجْمَرُ: ما يُوضَعُ فيه الجَمْرُ والبَخُورُ الذي يُدَخَّنُ به الثِّيابُ؛
            العُودُ الذي يُتَبَخَّرُ به»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المِجْمَر في المعاجم هو الإناء الذي يوضع فيه الجمر للتبخير، لا شخص
            يمشي على الجمر. والمُجَمَّر موضع رمي الجمرات بمنى. كلا المعنيَين
            يناقضان الاستخدام المقترح تناقضاً تاماً.
        - text: "«(المجمر) مَا يوضع فِيهِ الْجَمْر مَعَ البخور وَالْعود يتبخر بِهِ»"
          source: "المعجم الوسيط لمجمع اللغة العربية بالقاهرة (1998)"
          conflict: >
            نص المعجم الوسيط يُثبّت المجمر كأداة لا كشخص، مما يُسقط المرشح.
        - text: "«(المُجَمَّرُ): مَوْضِعُ رَمْيِ الجَمَراتِ بمِنًى»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: >
            المُجَمَّر بضم الميم وفتح الجيم والميم المشددة موضع جغرافي في منى،
            لا علاقة له بالمفهوم المطلوب.

    - lemma: "مَاشِي الْجَمْرِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "الماشي على النار"
      decision: confirmed
      decision_reason: >
        اللمة الوحيدة في المجموعة. رغم كونها عبارة وصفية حرة لا مصطلحاً مسكوكاً،
        لا يتوفر بديل موثّق توثيقاً معجمياً في المصادر المتاحة، فتُبقى مع تحديث
        تشكيلها الكامل. تخفق في اختبار السكّ الصارم، لكن غياب المصطلح المسجّل
        يجعل إزالتها دون بديل أضرّ بجودة الشبكة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        اللمة الوحيدة في المجموعة — لا توجد أخوات ترادفية لتمييزها عنها.
        تُشير إلى الشخص المؤدي لهذا الفعل الاستعراضي باستخدام «النار» بمعنى
        الجمر المتّقد في سياق مقيّد.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الْمَاشِي عَلَى النَّارِ"

    - lemma: "وَاطِئُ الْجَمْرِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد في أي مصدر معجمي كمصطلح مسكوك ثابت. يخفق في اختبار التثبيت
        المعجمي: لا وجود له في المعاجم الكلاسيكية ولا الحديثة ولا في مصادر
        المصطلحات التقنية (أرابترم). رغم دقته الدلالية (الوطء = الدهس بالقدم
        وهو الفعل الأنسب)، لا يوجد سند معجمي يُثبّت استعماله الاصطلاحي.

    - lemma: "سَالِكُ الْجَمْرِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد في أي مصدر معجمي. «سلك» يدلّ في مقاييس ابن فارس على «نفوذ
        شيء في شيء» ويُستخدم في سياق الطريق والمسار، لكن التركيب «سالك الجمر»
        لا حضور له معجمياً ولا استعمالياً موثّقاً.

    - lemma: "الْمُجَمِّر"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكلاسيكية والحديثة تُجمع على أن المجمر/المجمّر أداة (المبخرة)
        أو موقع (موضع رمي الجمرات). الأدلة تناقض استخدامه للدلالة على شخص
        يمشي على الجمر تناقضاً تاماً. مرفوض.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَاشِي الْجَمْرِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يرد كمصطلح مسكوك في أي مصدر. وهو مشابه جداً للمة الموجودة
        «الماشي على النار» مع استبدال «النار» بـ«الجمر». اللمة الموجودة أكثر
        شيوعاً في الاستعمال المعاصر وهي المحتفظ بها، فلا حاجة لإضافة مرشح
        غير موثّق يُزاحمها.


