    current: "كون الشيء ثلاثياً؛ تصنيف إلى ثلاثة أجزاء أو فئات فرعية"
    assessment:
      decision: revise
      reason: "التعريف الحالي يتضمن ترجمة ركيكة (كون الشيء ثلاثياً)، ويمكن صياغة تعريف مصطلحي ولغوي أدق وأكثر سلاسة."
    authored:
      - type: terminological
        text: "تَقْسِيمُ الشَّيْءِ وَتَصْنِيفُهُ إِلَى ثَلَاثَةِ أَجْزَاءٍ أَوْ فِئَاتٍ فَرْعِيَّةٍ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-07956361-n", definition_index: 0, text: "تَقْسِيمُ الشَّيْءِ وَتَصْنِيفُهُ إِلَى ثَلَاثَةِ أَجْزَاءٍ أَوْ فِئَاتٍ فَرْعِيَّةٍ."}

