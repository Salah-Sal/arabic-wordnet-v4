stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية (انقسام ثلاثي) عبارة عن تركيب وصفي، ورغم صحتها إلا أن المفهوم يمكن التعبير عنه بكلمة مفردة مثل (تثليث) أو تراكيب أخرى أكثر شيوعاً في التصنيف."
      - "التعريف الحالي يحتوي على ترجمة حرفية (كون الشيء ثلاثياً) ويمكن تحسين صياغته."
    observations: "المفهوم يعبر عن التقسيم أو التصنيف إلى ثلاثة أجزاء (trichotomy) وهو مفهوم شائع في المنطق والرياضيات وعلم التصنيف."
  blind_candidates:
    - lemma: "تَثْلِيث"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن تفعيل للدلالة على جعل الشيء ثلاثة أقسام أو تقسيمه أثلاثاً."
    - lemma: "تَقْسِيمٌ ثُلَاثِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يعبر بدقة عن تصنيف الشيء أو تقسيمه إلى ثلاثة أجزاء."
    - lemma: "تَفَرُّعٌ ثُلَاثِيّ"
      generation_method: tarkib
      justification: "تركيب وصفي يشير إلى انقسام الفروع أو الأقسام إلى ثلاثة."
    - lemma: "ثُلَاثِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي يدل على ما يتركب من ثلاثة عناصر أو أجزاء."

stage2_evidence:
  per_lemma:
    - lemma: "انقسام ثلاثي"
      confirm:
        - text: "انقسام الى ثلاثة (trichotomy)"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "التفرُّع الثلاثيّ: الانقسام إلى ثلاثة عناصر."
          source: "المورد الحديث (2008)"
    - lemma: "تثليث"
      confirm:
        - text: "تثليث: تقسيم ثلاثي"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "التّثليث: [في الانكليزية] Triangulation ،trinity [ في الفرنسية] Triangulation ،trinite ثلاث نقاط أو زوايا القسمة أثلاثا."
          source: "Al-Tahānawī, Kashshāf Iṣṭilāḥāt al-Funūn wa-l-ʿUlūm (d. 1777 CE)"
    - lemma: "تقسيم ثلاثي"
      confirm:
        - text: "تثليث: تقسيم ثلاثي"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
        - text: "تقسيم [أو انقسام] إلى ثلاثة أجزاء إلخ. (tripartition)"
          source: "المورد الحديث (2008)"
    - lemma: "تفرع ثلاثي"
      confirm:
        - text: "التفرُّع الثلاثيّ: الانقسام إلى ثلاثة عناصر. (trichotomy)"
          source: "المورد الحديث (2008)"
    - lemma: "ثلاثية"
      expands:
        - text: "الثلاثيةُ: مَا ذكرت فِيهَا الرابطة."
          source: "Al-Suyūṭī, Muʿjam Maqālīd al-ʿUlūm (d. 1505 CE)"
          addition: "تشير الثلاثية عادة إلى مجموعة من ثلاثة أو عمل أدبي/فني من ثلاثة أجزاء (trilogy أو triad) وليس إلى عملية الانقسام بحد ذاتها."

