stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي ترجمة مقبولة لكنها ركيكة بعض الشيء في استخدام كلمة (إنتاج) مع المطر، الأفضل استخدام (استنزال) أو (إسقاط)."
    observations: "اللمة الموجودة (استمطار) دقيقة، فهي على وزن (استفعال) الذي يفيد الطلب، وفي العصر الحديث أصبحت المصطلح التقني المعتمد لعمليات استنزال المطر الاصطناعي (تلقيح السحب)، مما يجعلها تقابلاً ممتازاً للمفهوم الإنجليزي (rainmaking)."
  blind_candidates:
    - lemma: "اِسْتِمْطَار"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن استفعال الذي يفيد الطلب، وهو المصطلح الشائع لاستنزال المطر صناعياً أو طقوسياً."
    - lemma: "اِسْتِسْقَاء"
      generation_method: ishtiqaq
      justification: "اشتقاق من السقيا، وهو المفهوم الديني والتراثي لطلب المطر."
    - lemma: "إِمْطَار"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن إفعال بمعنى التعدية وإحداث المطر."
    - lemma: "صِنَاعَةُ المَطَرِ"
      generation_method: tarkib
      justification: "مركب إضافي يعكس الترجمة الحرفية للمفهوم (rainmaking)."

stage2_evidence:
  per_lemma:
    - lemma: "استمطار"
      confirm:
        - text: "«الاستمطار: استنزال المطر بوسائل صُنعيّة.»"
          source: "المورد الحديث (2008)"
        - text: "«استمطرَ يستمطر، استمطارًا، فهو مُسْتمطِر• استمطر الشَّخصُ: طلب المطرَ 'خرج الناسُ يستمطرون الله'»"
          source: "معجم اللغة العربية المعاصرة"
    - lemma: "استسقاء"
      expands:
        - text: "«الاستسقاء: هو طلب المطر عند طول انقطاعه.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يبرز الطابع الديني والفقهي للمصطلح."
    - lemma: "إمطار"
      expands:
        - text: "«أمطرتِ السَّماءُ: مطَرت؛ نزل مطرُها ... أمطره: أصابه بالمَطَر»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "يدل على فعل الإنزال لا على النشاط البشري المتعمد."
    - lemma: "صناعة المطر"
      evidence_status: no_material_found

stage3_analysis:
  per_lemma:
    - lemma: "استمطار"
      decision: confirmed
      decision_reason: "مصطلح فصيح ودقيق، ويعبّر تماماً عن المفهوم المطلوب (rainmaking) سواء كان بطرق طقوسية أو بتقنيات حديثة (تلقيح السحب)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِمْطَار"
    - lemma: "اِسْتِسْقَاء"
      source: stage1
      decision: removed
      decision_reason: "دلالة دينية مخصصة لطلب السقيا بالصلاة والدعاء، بينما المفهوم يركز على النشاط لإنتاج المطر عموماً."
      evidence_assessment:
        case: mixed
    - lemma: "إِمْطَار"
      source: stage1
      decision: removed
      decision_reason: "الكلمة تعني فعل إنزال المطر، وهو فعل متعلق بالسماء أو الخالق، أكثر من كونها نشاطاً بشرياً لطلبه."
      evidence_assessment:
        case: mixed
    - lemma: "صِنَاعَةُ المَطَرِ"
      source: stage1
      decision: removed
      decision_reason: "ترجمة حرفية وليست مصطلحاً مسكوكاً مستقراً، وكلمة (الاستمطار) تُغني عنها وتفي بالغرض بامتياز."
      evidence_assessment:
        case: no_material

stage4_content:
  definition:
    current: "نشاط يهدف إلى إنتاج المطر"
    assessment:
      decision: revise
      reason: "استخدام كلمة (إنتاج) مع المطر يبدو غير طبيعي عربياً، الأنسب استخدام (استنزال) أو (إسقاط)."
    authored:
      - type: terminological
        text: "عملية أو نشاط يُقصد به استنزال المطر، سواء بالوسائل التقنية الحديثة كـتلقيح السحب، أو عبر الطقوس التقليدية."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-00923868-n"
          definition_index: 0
          text: "عملية أو نشاط يُقصد به استنزال المطر، سواء بالوسائل التقنية الحديثة كـتلقيح السحب، أو عبر الطقوس التقليدية."

  examples:
    per_lemma:
      - lemma: "استمطار"
        examples:
          - text: "لجأت الدولة إلى تقنية الاستمطار لمواجهة موجات الجفاف المتتالية."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-00923868-n"
          text: "لجأت الدولة إلى تقنية الاستمطار لمواجهة موجات الجفاف المتتالية."

