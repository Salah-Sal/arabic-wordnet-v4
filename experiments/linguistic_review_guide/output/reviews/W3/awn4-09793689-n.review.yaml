# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-09793689-n | ILI: i88101 | POS: n
# التعريف: خبير يقدم المشورة | an expert who gives advice
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان (مستشار، ناصح) خاليتان من التشكيل في AWN4، مما يُفضي إلى غموض قرائي"
      - "التعريف الحالي «خبير يقدم المشورة» مختصر جداً ويفتقر إلى الفصل النوعي الكافي: لا يُحدد مجال التخصص ولا طبيعة العلاقة بين المستشار وطالب المشورة"
      - "لمّة «ناصح» أوسع دلالةً من المفهوم المُستهدَف: الناصح يشمل كل من يُسدي النصيحة إخلاصاً، دون اشتراط الاحتراف أو التخصص الفني الذي ينطوي عليه مفهوم consultant"
    observations: >
      المجموعة تُعبِّر عن مفهوم «الخبير المُستشار» (adviser/advisor/consultant) الذي يتميز بصفتين جوهريتين:
      (١) الخبرة المتخصصة في حقل معين، (٢) تقديم الرأي عند الطلب. الجذر ش-و-ر يمنح مُسْتَشَار قوةً اشتقاقية راسخة
      (إذ يحمل صيغة المفعول من استفعل: من يُستشار رأيه). أما ناصح فجذره ن-ص-ح يُؤكد الإخلاص وخلوص النية،
      وهو وصف أخلاقي في الأصل قبل أن يكون وصفاً مهنياً. الفارق الجوهري: مُسْتَشَار = احتراف وتخصص؛
      ناصح = إخلاص وصدق. يستحق المفهوم استقصاءً للمرشحات الاشتقاقية المحتملة.

  blind_candidates:
    - lemma: "مُشِير"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل الرباعي أشار يُشير على وزن مُفعِل؛ أشار بالرأي = أعطاه وعرضه.
        الجذر ش-و-ر (مشترك مع مُسْتَشَار) يمنحه مناسبةً دلاليةً للمفهوم المطلوب.
        الوزن مُفعِل يدل على الفاعلية (من يُشير ويُسدي)، في مقابل مُستفعَل (من يُستشار).

    - lemma: "مُرشِد"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من أرشد يُرشد على وزن مُفعِل من الجذر ر-ش-د (الاستقامة والهداية).
        يدل على من يُقدّم التوجيه ويُبيّن الطريق الصواب، مما يُقاربه من مفهوم المستشار الموجِّه.

    - lemma: "نَصِيح"
      generation_method: ishtiqaq
      justification: >
        صفة مشبّهة على وزن فَعِيل من نصح يَنصح؛ يدل على الاتصاف المستمر بالنصح والإخلاص.
        يُقال: «نصيح القوم» أي الذي يُسدي لهم النصيحة بصدق ومحبة.

    - lemma: "مُوَجِّه"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من وجَّه يُوجِّه على وزن مُفعِّل من الجذر و-ج-ه؛ يدل على من يُوجِّه الآخرين
        ويُقدّم لهم الإرشاد التخصصي، ويُستعمل في سياقات التعليم والتدريب.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "مستشار"
      confirm:
        - text: "«العليم الذي يؤخذ رأيه في أمر هام علميّ أو فنيّ أو سياسي أو قضائي أو نحوه»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«دَرَجَةٌ وظيفِيَّةٌ عاليةٌ فى بعضِ مؤسساتِ الدولةِ. يقال: مستشارٌ قانونىٌّ، ومستشارٌ ثقافى؛ رتبةٌ قضائيَّةٌ في المحاكم وغيرها»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«مُسْتَشَار: من (ش و ر) من تطلب نصيحته وآراؤه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) المستشير إلخ (2) المستشار؛ الخبير» — translation_en: consultant"
          source: "المورد الحديث (2008)"
        - text: "translation_en: adviser — domain: Commerce and Accounting"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (ARABTERM)"
        - text: "translation_en: consultant — domain: Education"
          source: "مسرد التربية (ARABTERM، ALECSO)"
        - text: "translation_en: adviser; advisor — domain: Information and Communication"
          source: "مسرد الإعلام والتواصل (ARABTERM، ALECSO)"
        - text: "translation_en: counsellor — domain: Law"
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM)"

    - lemma: "ناصح"
      confirm:
        - text: "«نَاصِح: من (ن ص ح) المرشد إلى ما فيه الصلاح»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) الناصح (2) المستشار؛ المُرشِد (تر)» — translation_en: adviser"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«النَّاصِحُ: الخالص من كلِّ شيء... يقال: ناصح الجيب: نقى القلب لا غش فيه؛ الخيَّاط»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "المعنى المعجمي الأصيل للناصح (بصيغة المعرَّفة) = الخالص من كل شيء أو الخياط، لا الناصح الخبير المحترف. المعنى الفاعلي من «نَصَح» حاضر في الاستعمال لكن المعجم يُبرز الدلالة القديمة"
        - text: "«(الناصح) الخالص من كل شيء... والخياط»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35)"
          conflict: "نفس ملاحظة المعجم الوسيط"

    - lemma: "مُشِير"
      contradicts:
        - text: "«أعلى رتبةٍ عَسْكَرِيَّةٍ فى الجيشِ، وهى فوقَ رتبة الفريق أوَّل»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "المعنى المعجمي المُرسَّخ لمُشِير في العربية المعاصرة = الرتبة العسكرية العليا، لا الخبير المستشار؛ الاشتراك اللفظي الراسخ يمنع الاستخدام"
        - text: "«مُشِير: من (ش و ر) من يومئ بيده أو نحوها إلى غيره معبرا عن معنى من المعاني والناصح غيره بفعل أمرما، والمشير: أعلى رتبه عسكرية»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "يُدرج المعجم المعنى العسكري كمعنى محوري إلى جانب معنى «الناصح»، مما يُظهر أن الرتبة العسكرية طغت على المعنى الدلالي الأصيل"
      expands:
        - text: "translation_en: indicator — domain: Information and Communication"
          source: "مسرد الإعلام والتواصل (ARABTERM)"
          addition: "يُستعمل مُشِير في المصطلحية التقنية بمعنى «indicator»، وهو معنى لغوي آخر لا صلة له بالمستشار"

    - lemma: "مُرشِد"
      confirm:
        - text: "«مُرْشِد تربوي: أستاذ متخصص... يقوم بتوجيه وإرشاد المعلمين نحو أفضل السبل في المجال التعليمي» — translation_en: educational counselor"
          source: "المعجم الموحد لمصطلحات الإشراف التربوي (ARABTERM)"
        - text: "«مُرْشِدٌ أَكَادِيمِيٌّ» — translation_en: academic advisor"
          source: "المعجم الموحد لمصطلحات الحكامة التربوية (ARABTERM)"
        - text: "«مُرْشِدُ التَّأْهيل» — translation_en: rehabilitation counselor"
          source: "المعجم الطبي الموحد (ARABTERM)"
      contradicts:
        - text: "«الواعظ، هادى السفن فى المضايق، دليل الشرطة»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "المعنى الأصيل للمُرشِد = الواعظ والهادي (guide) وليس الخبير المحترف الذي يُقدّم المشورة المتخصصة. التداخل المفهومي مع counselor لا يعني التطابق مع consultant"
        - text: "«المرشد: هو الذي يدل على الطريق المستقيم قبل الضلالة»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "التعريف الاصطلاحي الكلاسيكي يُؤكد بُعد الهداية والإرشاد الروحي، لا التخصص المهني"

    - lemma: "نَصِيح"
      confirm:
        - text: "«(النصيح) الناصح (ج) نصحاء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani_35)"
        - text: "«النَّصِيح: النَّاصِح»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
      expands:
        - text: "«النُّونُ وَالصَّادُ وَالْحَاءُ أَصْلٌ يَدُلُّ عَلَى مُلَاءَمَةٍ بَيْنَ شَيْئَيْنِ وَإِصْلَاحٍ لَهُمَا. أَصْلُ ذَلِكَ النَّاصِحُ: الْخَيَّاطُ. وَالنِّصَاحُ: الْخَيْطُ يُخَاطُ بِهِ... وَمِنْهُ النُّصْحُ وَالنَّصِيحَةُ: خِلَافُ الْغِشِّ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر ن-ص-ح يدل على الملاءمة والإصلاح؛ النصيحة ضد الغش، وهو ما يُعطي نَصِيح بُعدَ الإخلاص والأمانة"

    - lemma: "مُوَجِّه"
      contradicts:
        - text: "«ذو الجاه، ومن له حَدَبَتَان في ظهره وفي صدره، مِنَ الأَكسية: ذو الوجهين»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "المُوَجَّه (بفتح الجيم المشددة) في المعجم الكلاسيكي يعني شيئاً مختلفاً كلياً عن المُوَجِّه (بكسر الجيم المشددة)"
      expands:
        - text: "translation_en: counsellor — domain: Arts, Recreation and Sports"
          source: "مسرد الفن والتسلية والرياضة (ARABTERM)"
          addition: "يُستعمل في ARABTERM كمرادف لـcounsellor في مجال الرياضة، لكنه استخدام متخصص محدود لا يعكس الدلالة العامة"
        - text: "«الموجهات أو المساعدات الموجهة هي طبقة الأفعال المساعدة التي تدل على الأحكام الكلامية» — translation_en: modal"
          source: "معجم مصطلحات المعلوماتية (ARABTERM)"
          addition: "الاستخدام السائد في ARABTERM لمُوَجِّه = modal/router/wave، لا صلة له بمعنى المستشار"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مستشار"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة توثيقاً محكماً في المعجم الوسيط والمعجم الكبير وعشرات معاجم ARABTERM؛
        تعريف المعجم الوسيط «العليم الذي يؤخذ رأيه في أمر هام علمي أو فني أو سياسي أو قضائي»
        يطابق مفهوم consultant تطابقاً تاماً. الصيغة الصرفية (اسم مفعول من استشار على وزن مُسْتَفْعَل)
        تُعبِّر بدقة عن «من يُستشار»، وهو المعنى المطلوب. غير أنها بحاجة إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركز مُسْتَشَار على الاحتراف والتخصص الرسمي والمكانة المعترف بها؛ يُلزم عادةً خبرةً فنيةً في مجال
        محدد، ويُستعمل في السياقات المهنية والرسمية (مستشار قانوني، مستشار اقتصادي، مستشار قضائي)
        مع دلالة على الرتبة والمنزلة.
      morphological_check: >
        مُسْتَفْعَل من استشار (الفعل X) — صيغة المفعول التي جرى توظيفها اسماً فاعلياً بمعنى «من يُستشار»،
        وهو توظيف مشروع ومعجمي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُسْتَشَار"

    - lemma: "ناصح"
      decision: confirmed
      decision_reason: >
        بمعنى الفاعلية (اسم الفاعل من نصح)، ناصح = من يُقدّم النصيحة بإخلاص، وهو داخل في مفهوم adviser.
        المورد الحديث يُدرجه صراحةً مرادفاً لـ adviser، وموسوعة السلطان قابوس تُعرِّفه بـ«المرشد إلى ما فيه الصلاح».
        رغم أن المعجمين الوسيط والكبير يُبرزان المعنى القديم (الخالص/الخياط)، فإن الاستعمال القرآني والتراثي
        («وأنا لكم ناصح أمين») يثبت المعنى الفاعلي بقوة. التحفظ الوحيد: ناصح أخف تخصصاً من مستشار، لذا
        يُحتفظ به للدلالة على البُعد الأخلاقي من المفهوم. بحاجة إلى تشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركز نَاصِح على الإخلاص والأمانة وخلوص النية في تقديم النصيحة، دون اشتراط الاحتراف الرسمي أو
        التخصص الفني؛ يُناسب السياقات الشخصية والأخلاقية والدينية، وفيه دلالة على العلاقة الإنسانية قبل
        العلاقة المهنية.
      morphological_check: >
        اسم فاعل من نَصَح يَنصح على وزن فَاعِل؛ وزن صحيح يدل على الحدوث والاتصاف.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَاصِح"

    - lemma: "مُشِير"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى المُرسَّخ في المعجم العربي المعاصر لمُشِير = أعلى رتبة عسكرية في الجيش (Field Marshal)؛
        هذا المعنى طغى على المعنى الاشتقاقي الأصيل «من يُشير بالرأي» ويُؤدي حتماً إلى اشتراك لفظي مُخِل.
        استخدامه في المجموعة يُشوِّش المعنى المقصود.
      evidence_assessment:
        case: contradicts_only

    - lemma: "مُرشِد"
      source: stage1
      decision: removed
      decision_reason: >
        الجذر ر-ش-د يحمل في المعجم الكلاسيكي معنى «الهداية إلى الطريق المستقيم» والوعظ الديني والتوجيه الروحي،
        وهو أكثر تخصصاً وانحيازاً نحو بُعد الإرشاد (guide/mentor) لا الاستشارة المتخصصة (consultant).
        استخداماته في ARABTERM مقيّدة بحقول بعينها (مرشد تربوي، مرشد مهني) ولا يعكس المفهوم العام للمجموعة.
        كما أن تعريفه الكلاسيكي الراسخ (الواعظ، دليل السفن، دليل الشرطة) يُبعده عن مفهوم «الخبير الذي يُقدّم المشورة».
      evidence_assessment:
        case: mixed

    - lemma: "نَصِيح"
      source: stage1
      decision: removed
      decision_reason: >
        نَصِيح مرادف مباشر لنَاصِح (المُدرَج فعلاً)، كما يُؤكد المعجم الوسيط صراحةً. إضافته إلى المجموعة
        يُشكّل تكراراً دلالياً بلا قيمة مضافة؛ ومبدأ عدم الترادف المطلق يُوجب حذف الأضعف أدلةً.
      evidence_assessment:
        case: confirm_only

    - lemma: "مُوَجِّه"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الأساسية لا تُوثِّق مُوَجِّه بمعنى «خبير يُقدّم المشورة»؛ استخداماته في ARABTERM
        موزّعة على معانٍ تقنية متباينة (modal، router، wave، oriented)، واستخدامه الوحيد كـ«counsellor»
        يقتصر على مجال الرياضة (ARABTERM). المعنى المعجمي الكلاسيكي للمُوَجَّه (ذو الجاه، ذو الوجهين)
        لا صلة له بالمفهوم المطلوب، مما يُعطيه طابع الاشتباه اللفظي لا الوضوح الدلالي.
      evidence_assessment:
        case: contradicts_only


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "خبير يقدم المشورة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يُعبِّر عن الجنس القريب (خبير) لكنه يُهمل الفصل النوعي الكافي:
        لا يُحدد أن المشورة متخصصة في مجال معين، ولا أنها تُقدَّم عند الطلب، ولا أنها
        تستند إلى معرفة خاصة. كما يفتقر إلى التمييز عن مجرد «الشخص الذي ينصح».
    authored:
      - type: terminological
        text: >
          شَخْصٌ مُتَخَصِّصٌ تُؤْخَذُ آرَاؤُهُ وَتُطْلَبُ مَشُورَتُهُ فِي شَأْنٍ عِلْمِيٍّ أَوْ فَنِّيٍّ
          أَوْ قَانُونِيٍّ أَوْ سِيَاسِيٍّ أَوْ نَحْوِ ذَلِكَ؛ اسْتِنَاداً إِلَى خِبْرَتِهِ وَمَعْرِفَتِهِ الْمُتَخَصِّصَةِ فِي مَجَالِهِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: >
          مَنْ يُسْدِي النَّصِيحَةَ وَالرَّأْيَ الْخَبِيرَ فِيمَا يُسْتَشَارُ فِيهِ
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09793689-n"
