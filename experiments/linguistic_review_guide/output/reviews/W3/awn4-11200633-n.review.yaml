# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────

stage1_review:
  assessment:
    concerns:
      - "الأسماء الموجودة (روبرت ميلز، ميلز) خالية من التشكيل الكامل؛ وهذا يُخلّ بالمعالجة الآلية ويُقلّل من دقة الضبط الصوتي."
      - "pos المجموعة مسجَّل بوصفه (n) رغم أن المجموعة تمثّل اسم علم لشخص بعينه؛ والأنسب وفق تصنيف AWN4 أن يكون proper_noun أو instance."
      - "التعريف العربي الحالي يفتقر إلى مخرج موسوعي؛ إذ لا يذكر أبرز الأعمال المعمارية لروبرت ميلز التي تُميّزه في سياق الإشارات الأكاديمية والموسوعية."
      - "لمّة (ميلز) وحدها قابلة للإيهام بأسماء أعلام أخرى تحمل اللقب ذاته (كظاهرة ميلز-راينكه في الطب، أو اختبار ميلز في تنس الإفراد)؛ لذا تستوجب توثيق النسبة في التعريف."
    observations: >
      هذه مجموعة ترادفية لاسم علم أجنبي (proper noun instance) يشير إلى شخصية تاريخية بعينها هي المعماري الأمريكي روبرت ميلز (1781-1855).
      مثل هذه المجموعات لا تجد أثراً لها في قواعد المعاجم العربية الكلاسيكية أو حتى المعاصرة، لأن المعاجم لا تُدرج أسماء الأعلام الأجنبية الفردية.
      اللمّتان الموجودتان (روبرت ميلز) و(ميلز) صائبتان مبدئياً؛ فهما التعريبان الصوتيان الشائعان للاسم في المصادر الثقافية والأكاديمية العربية،
      غير أن غياب التشكيل وإشكالية الاشتباه بـ(ميلز) المُجرَّدة يستوجبان المعالجة. لا حاجة لتوليد مرشحات اشتقاقية أو مجازية لمجموعة من هذا النوع؛
      إذ التعريب (تأريب صوتي) هو الوسيلة الوحيدة المشروعة لتمثيل أسماء الأعلام الأجنبية.

  blind_candidates:
    # ملاحظة منهجية: المجموعة ترمز لاسم علم (شخص تاريخي أجنبي)؛ بالتالي لا تنطبق عليها مسالك الاشتقاق أو المجاز أو التركيب الاصطلاحي.
    # التأريب الصوتي هو المسلك الوحيد المُتاح. وبما أن الملف المُقنَّع لا يكشف الاسم، فإن المرشحات الأربعة أدناه هي أكثر التعريبات المحتملة لمعماري أمريكي بارز من تلك الحقبة.
    - lemma: "رُوبِرْت مِيلْز"
      generation_method: taarib
      justification: >
        التعريب الصوتي الأمثل للاسم الإنجليزي Robert Mills وفق قواعد التعريب العربية المعتمدة:
        رُوبِرْت لـ(Robert) بضم الراء وكسر الباء وسكون الراء الثانية وسكون التاء،
        ومِيلْز لـ(Mills) بكسر الميم وسكون الياء وزاي لصوت /z/ في النهاية.
        هذا الشكل هو الأكثر ورودًا في الموسوعات والمصادر الثقافية العربية.
    - lemma: "رُوبَرْت مِيلْز"
      generation_method: taarib
      justification: >
        بديل صوتي شائع يستخدم فتح الباء (رُوبَرْت) بدلاً من الكسر، تبعاً لاختلاف المدارس التعريبية العربية في نقل صائت /ɒ/ في (Rob-).
        يُستخدم هذا الشكل في بعض الترجمات المصرية واللبنانية.
    - lemma: "مِيلْز"
      generation_method: taarib
      justification: >
        تعريب اللقب (Mills) منفرداً وفق العرف المعجمي في الإحالة إلى المشاهير بأسمائهم الأخيرة فقط،
        كما يُقال (داروين) و(نيوتن) و(ديكارت) في المصادر العلمية العربية.
        الضبط: مِيلْز بكسر الميم وسكون الياء والزاي.
    - lemma: "مِيلِز"
      generation_method: taarib
      justification: >
        تعريب بديل بكسرة الزاي بدل السكون عليها، تبعاً للنمط العربي الذي يتجنّب نهاية الكلمة بحرف ساكن في التعريبات الصوتية الشفهية.
        وهو شكل مُستعمل في بعض النصوص الثقافية العربية غير الموحَّدة.


