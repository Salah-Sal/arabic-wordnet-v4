# ── المرحلة ١: المراجعة والتوليد (أعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة (فْرانْسِيس تَاوْنِسِنْد) تحمل تشكيلاً خاطئاً: الفاء مسكورة في المقطع الأول وليس مضمومة ولا ساكنة، وصيغة فْ (بالسكون) في أول الكلمة غير طبيعية في التعريب العربي."
      - "المجموعة تضم لمّةً واحدة فقط (الاسم الكامل)، في حين أن المعادل الإنجليزي في OEWN يضم ثلاث لمّات: Francis Townsend وTownsend وFrancis Everett Townsend، وهي جميعها تحتاج إلى مقابلات عربية."
      - "التصنيف POS=n (اسم) صحيح وفق اصطلاحات AWN4، غير أن المدخل علمٌ شخصي (proper_noun) بالمعنى الصرفي الدقيق."
      - "التعريف العربي الحالي ترجمة شبه حرفية للإنجليزي، ويفتقر إلى التفصيل الموسوعي الملائم لعلم الشخص."
    observations: >
      هذه المجموعة الترادفية تصف شخصاً تاريخياً بعينه هو الطبيب الأمريكي فرانسيس إيفريت تاونسند (1867-1960)،
      اشتُهر باقتراح خطة معاش الشيخوخة عام 1933 التي مهّدت لنظام الضمان الاجتماعي الأمريكي.
      لمّا كان المدخل علمَ شخصٍ أجنبياً، فإن التعريب (التحريف الصوتي) هو المنهج الإلزامي الوحيد؛
      إذ يستحيل اشتقاق الاسم أو صياغته مجازاً أو تركيباً من التعريف وحده.
      التحدي الحقيقي هنا يكمن في: (أ) ضبط الشكل الصحيح للتعريب، و(ب) استيفاء لمّات الاسم المختصر (اللقب وحده)
      والاسم الرسمي الكامل (بالاسم الأوسط).

  blind_candidates:
    - lemma: "فِرَانسِيس تَاوْنسِنْد"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل للشخصية المقصودة وفق ما يُستنتج من التعريف (مصلح اجتماعي أمريكي، 1867-1960)؛
        النطق الإنجليزي Francis Townsend يُعرَّب: فِرَانسِيس (fra-n-sis) + تَاوْنسِنْد (town-zend).
        هذا هو الشكل الأكثر شيوعاً في المراجع العربية.
    - lemma: "تَاوْنسِنْد"
      generation_method: taarib
      justification: >
        اللقب العائلي (Townsend) وحده، يُستخدم في السياقات الاختصارية والإشارات الضمنية حين سبق ذكر الاسم الكامل.
        تعريبه: تَاوْنسِنْد (town-zend) أو تَاوْنزِنْد، والصيغة الأولى أقرب للكتابة العربية المعتمدة.
    - lemma: "فِرَانسِيس إِيفِرِيت تَاوْنسِنْد"
      generation_method: taarib
      justification: >
        الاسم الرسمي الكامل للشخصية بضمّ الاسم الأوسط Everett (إِيفِرِيت)، يُستخدم في الوثائق الرسمية
        والمراجع الأكاديمية والمصادر التاريخية حيث يُشترط التمييز عن أشخاص آخرين بالاسم نفسه.
    - lemma: "فِرَانسِيس تَاوْنزِنْد"
      generation_method: taarib
      justification: >
        نسخة بديلة من التعريب تعكس نطقاً إنجليزياً آخر للكلمة (Townsend بصوت Z بدلاً من S)؛
        بعض المراجع العربية تكتبها هكذا، وإن كانت أقل شيوعاً من الصيغة بالسين.


