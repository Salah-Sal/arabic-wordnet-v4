# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «عازف» مقيَّدة دلالياً بالأداء الآلي (العزف على آلة)، ولا تشمل التأليف والقيادة المذكورَيْن في التعريف صراحةً"
      - "كلتا اللمّتين (عازف، موسيقي) مكتوبتان بدون تشكيل في بيانات المجموعة"
      - "«موسيقي» في المعاجم الكلاسيكية تُوصَف بأنها «المنسوب إلى الموسيقى» (صفة منسوبة)، وليس اسماً للمحترف الموسيقي؛ استعمالها اسماً للمحترف موروث من العربية الوسيطة"
      - "التعريف «يقودها» يحتمل التباساً: يقود الموسيقى أم يقود الفرقة الموسيقية؟ الأصح: «قيادة الفِرَق الموسيقية»"
      - "المجموعة تفتقر إلى لمّة «مُوسِيقَار» الدالة على المحترف الكبير، وهي مُثبَتة في المعاجم بمعنى الموسيقي"
    observations: >
      المجموعة تمثّل مفهوم الموسيقي المحترف (musician) بمعناه العام.
      اللمّتان الحاليتان (عازف، موسيقي) متداولتان في العربية المعاصرة ومثبَّتتان في المعاجم، غير أنهما تمثّلان مستويَيْن دلاليَّيْن مختلفَيْن:
      «عازف» أدائي يخص الأداء الحي على الآلة، و«موسيقي» أشمل يعني كل محترف في الصنعة الموسيقية.
      المعجم الوسيط يُعرِّف «الموسيقي» بأنه «المنسوب إلى الموسيقى»، بينما يُقرِّر المورد الحديث (2008) أن كلمة musician تُترجَم بـ«المؤلِّف الموسيقيّ؛ العازف المحترِف» مجتمعتَيْن، مما يثبت صحة وجود اللمّتَيْن.
      وُجِد في المعاجم لفظ «موسيقار» بمعنى الموسيقي، وهو أجدر بالإضافة كونه يحمل دلالة الاحتراف والمهارة.

  blind_candidates:
    - lemma: "عَازِف"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الجذر (ع-ز-ف) على وزن فَاعِل، يدل على من يعزف (يلعب آلة موسيقية).
        الجوهري يُقرِّر: «العازف: اللاعب بالمعازف والمغنّي»، فالوزن فاعل يناسب صاحب الحرفة الموسيقية.
        قد لا يشمل التأليف والقيادة، لكنه الاستعمال الأكثر شيوعاً للموسيقي الأدائي في العربية المعاصرة.

    - lemma: "مُلَحِّن"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من (لحَّنَ) على وزن مُفَعِّل، يدل على من يضع الألحان الموسيقية.
        التعريف يذكر «يؤلف الموسيقى»، وأقرب ما يُقابل التأليف الموسيقي في العربية هو «التلحين».
        ArabTerm يُقرِّر: ملحِّن = composer، وهو مصطلح رسمي معتمد.

    - lemma: "قَيَّان"
      generation_method: majaz
      justification: >
        إحياء للفظ العربي القديم «قَيْن» (الصانع الماهر) بصيغة المبالغة قَيَّان (كثير الصناعة).
        ارتبط الجذر (ق-ي-ن) تاريخياً بالإصلاح والتزيين والإتقان؛ وسُمِّيت «القَيْنة» (الجارية المغنية) من هذا الجذر.
        محاولة إحياء الدلالة الموسيقية الضمنية في الجذر، وإن كانت الغلبة للمعنى الحِرَفي.

    - lemma: "مُوسِيقِيّ"
      generation_method: ishtiqaq
      justification: >
        نسبة (مصدر صناعي) إلى الموسيقى على وزن فَعَلِيّ بالنسبة، يدل على المنتسب إلى صنعة الموسيقى.
        وإن كان «موسيقى» دخيلاً يونانياً، فإن الاشتقاق بالنسبة (النسب اللفظي) مقبول في العربية للدخيل المستأنَس.
        يجمع على «موسيقيُّون» ويقبل الإضافة والنعت.


