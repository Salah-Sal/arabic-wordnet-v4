        examples:
          - text: "يُعدُّ جَانْ هُوسْ من أبرز المصلحين الدينيين الذين مهّدوا الطريق لحركة مارتن لوثر في القرن السادس عشر."
            type: usage
      - lemma: "يَانْ هُوسْ"
        examples:
          - text: "أشعلَت محاكمةُ يَانْ هُوسْ وإحراقُه شرارةَ الحروب الهوسية التي اجتاحت بوهيميا لعقود."
            type: usage
    actions:
