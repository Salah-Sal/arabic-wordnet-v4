# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "POS مُصنَّف على أنه 'n' (اسم عادي) في حين أن المجموعة علَمٌ شخصي لشخصية تاريخية محددة، ويجب أن يكون 'proper_noun'"
      - "التعريف العربي يستخدم 'تشيكوسلوفاكي' وهو توصيف أناكروني إذ لم تقم دولة تشيكوسلوفاكيا إلا عام 1918م، أي بعد وفاة هذا المصلح بخمسة قرون؛ الصواب 'بوهيمي' أو 'تشيكي'"
      - "التعريف العربي الراهن يخلو من ذكر مهنته كرجل دين ولاهوتي وكونه أستاذاً جامعياً"
      - "التعريف لا يذكر طرده من الكنيسة (الإفراز) عام 1409م كما هو وارد في التعريف الإنجليزي"
      - "اللمّة الوحيدة 'جان هُوس' تعريب مبني على النطق الفرنسي (Jean)، والصيغة التشيكية الأصلية (يَانْ) غائبة"
    observations: >
      هذه المجموعة علَمٌ شخصي (proper noun) يُمثّل مصلحاً دينياً بوهيمياً من القرن الخامس عشر الميلادي،
      هو يان هوس (Jan Hus)، سابقٌ للإصلاح اللوثري. اللمّة العربية الوحيدة 'جان هُوس' نقلٌ صوتي
      مستلٌّ من النطق الفرنسي (Jean Hus) وليس من التشيكية الأصلية. التعريف العربي الراهن مقبول
      في جوهره لكنه يعتريه خطأ تاريخي جغرافي (تشيكوسلوفاكي) ويفتقر إلى الوصف المهني وتفصيل
      قصة طرده من الكنيسة. لا توجد في قاعدة البيانات المعجمية أي مداخل لهذا العَلَم أو
      صيغه البديلة، مما يؤكد طابعه التراثي الأجنبي الذي يعتمد فيه العرب على النقل الصوتي.

  blind_candidates:
    - lemma: "يَانْ هُوسْ"
      generation_method: taarib
      justification: >
        نقل صوتي مباشر من الاسم التشيكي الأصلي Jan Hus؛ الحرف J في التشيكية ينطق (ي)،
        وهذا هو الشكل المعتمد في ويكيبيديا العربية وكثير من المصادر الأكاديمية الحديثة.
    - lemma: "يُوحَنَّا هُوسْ"
      generation_method: taarib
      justification: >
        توظيف الاسم العربي الكلاسيكي 'يوحنا' الذي يعادل الاسم اللاتيني Johannes/John الذي
        يشتق منه الاسم التشيكي Jan؛ هذا الشكل مستخدم في بعض المصادر الكنسية العربية.
    - lemma: "هُوسْ"
      generation_method: taarib
      justification: >
        الاسم العائلي (اللقب) مفرداً؛ يُستخدم أحياناً في السياقات الأكاديمية والموسوعية
        العربية للإحالة المختصرة إلى هذه الشخصية كما في العبارة 'حركة الهوسيين'.
    - lemma: "جُونْ هُوسْ"
      generation_method: taarib
      justification: >
        نقل صوتي من الصيغة الإنجليزية John Hus؛ يرد في بعض المصادر العربية المترجمة من
        الإنجليزية ويتوافق مع أحد اللمّات الإنجليزية في OEWN.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#  ١. مطابقة دفعية: جان هوس، يان هوس، يوحنا هوس، هوس، جون هوس، جان هس، يان هس، هس
#     → لا نتائج ذات صلة بالعَلَم الشخصي
#  ٢. جسر إنجليزي: Huss، John Huss، Hus، Jan Hus، Hussite
#     → لا نتائج
#  ٣. بحث FTS عربي: هرطقة، مصلح ديني، الإصلاح البروتستانتي، هوسي
#     → نتائج عن هرطقة/هرطق فقط (سياق مختلف)
stage2_evidence:
  per_lemma:
    - lemma: "جان هُوسْ"
      evidence_status: "no_material_found"

    - lemma: "يَانْ هُوسْ"
      evidence_status: "no_material_found"

    - lemma: "يُوحَنَّا هُوسْ"
      evidence_status: "no_material_found"

    - lemma: "هُوسْ"
      evidence_status: "no_material_found"

    - lemma: "جُونْ هُوسْ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "جان هُوس"
      decision: confirmed
      decision_reason: >
        الصيغة الأكثر تداولاً في المصادر العربية المطبوعة والإعلامية، وهي نقل صوتي راسخ
        مبني على النطق الفرنسي (Jean Hus). رغم غياب الأدلة المعجمية المباشرة فإن هذا
        الشكل مستقرٌّ في الاستعمال العربي وتدعمه الكتلة الكمية لمصادر الترجمة العربية
        الفرنسية. يحتاج إلى تصحيح التشكيل الكامل وتحديث صنف الكلمة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        صيغة مبنية على النطق الفرنسي (Jean)، سائدة في المصادر العربية المطبوعة
        والمترجمة عن الفرنسية؛ تمثّل التلقّي التاريخي للاسم في العالم العربي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَانْ هُوسْ"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشحات المرحلة ١ ──
    - lemma: "يَانْ هُوسْ"
      source: stage1
      decision: confirmed
      decision_reason: >
        النقل الصوتي الأقرب إلى الأصل التشيكي (Jan تُنطق 'يان' في التشيكية)؛ هذه
        الصيغة هي المعتمدة في ويكيبيديا العربية وكثير من المراجع الأكاديمية الحديثة
        التي تُراعي الأصل اللغوي للأعلام. ضرورة توثيقها جنباً إلى جنب مع الصيغة
        الفرنسية يُيسّر تعدد نقاط الاسترجاع في الفهارس العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        صيغة تُراعي النطق التشيكي الأصلي للاسم، شائعة في المصادر الرقمية
        والأكاديمية العربية الحديثة؛ تُيسّر التعرف على الشخصية انطلاقاً من مصادر
        أوروبية الوسطى وغير الفرنسية.
      actions:
        - command: create_entry
          params:
            lemma: "يَانْ هُوسْ"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "يُوحَنَّا هُوسْ"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة مُستنكَرة في الاستعمال العربي المعاصر؛ اسم 'يوحنا' له حمولة دينية
        مسيحية واضحة تُوحي بأن المقصود شخصية إنجيلية لا مصلحاً دينياً وسيطاً.
        لا شواهد على استخدام هذا الشكل في المصادر العربية الموثوقة المتعلقة بهذه الشخصية.

    - lemma: "هُوسْ"
      source: stage1
      decision: removed
      decision_reason: >
        اللقب المجرد بمعزل عن الاسم الأول لا يُعدّ لمّة مستقلة وافية للتعريف
        بالشخصية في المعجم. 'هوس' في العربية له دلالة أخرى (طرف من الجنون) مما
        يُفضي إلى اشتراك لفظي مُضلِّل. مقبول فقط في السياق الاصطلاحي 'الهوسيون'
        الذي يُحيل إلى أتباعه وليس إليه شخصياً.

    - lemma: "جُونْ هُوسْ"
      source: stage1
      decision: removed
      decision_reason: >
        نقل مبني على النطق الإنجليزي (John) وهو صيغة ثالثة تتنافس مع الصيغتين
        المعتمدتين (الفرنسية والتشيكية) دون أن تُضيف قيمة توثيقية. الصيغ الإنجليزية
        تُفيد في قاعدة البيانات الإنجليزية (OEWN) وليس في المجموعة العربية.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "{synset_id}"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "مصلح ديني تشيكوسلوفاكي استبق الإصلاح البروتستانتي؛ حُرق في النهاية بتهمة الهرطقة (1372-1415)"
    assessment:
      decision: revise
      reason: >
        التعريف الراهن يحتوي على خطأ تاريخي جغرافي جوهري: 'تشيكوسلوفاكي' توصيف
        أناكروني لأن دولة تشيكوسلوفاكيا لم تُستحدث إلا عام 1918م بعد وفاة هذا
        المصلح بأكثر من خمسة قرون؛ الصواب 'بوهيمي' أو 'تشيكي'. فضلاً عن ذلك
        يُغفل التعريفُ الوصفَ المهني (رجل دين ولاهوتي وأستاذ جامعي)، ويُجمل
        قصة الإفراز والطرد من الكنيسة التي تُشكّل محور السيرة.
    authored:
      - type: encyclopedic
        text: >
          رَجُلُ دِينٍ وَلاهُوتِيٌّ بُوهِيمِيٌّ، أُسْتاذٌ في جَامِعَةِ بَرَاغَ،
          مِن رُوَّادِ الإِصلاحِ الدِّينِيِّ الأُورُوبِّيِّ قَبلَ اللُّوثَرِيَّةِ.
          نَاضَلَ ضِدَّ فَسَادِ رِجَالِ الكَنِيسَةِ الكَاثُولِيكِيَّةِ، وَطَعَنَ
          في سُلطَتِهَا المُطلَقَةِ، فَأُفرِزَ مِنهَا عَامَ 1409م، وَأُحرِقَ
          حَيًّا بِتُهمَةِ الهَرطَقَةِ في مَجمَعِ كُونسْتَانسَ عَامَ 1415م
          (1372-1415م).
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            رَجُلُ دِينٍ وَلاهُوتِيٌّ بُوهِيمِيٌّ، أُسْتاذٌ في جَامِعَةِ بَرَاغَ،
            مِن رُوَّادِ الإِصلاحِ الدِّينِيِّ الأُورُوبِّيِّ قَبلَ اللُّوثَرِيَّةِ.
            نَاضَلَ ضِدَّ فَسَادِ رِجَالِ الكَنِيسَةِ الكَاثُولِيكِيَّةِ، وَطَعَنَ
            في سُلطَتِهَا المُطلَقَةِ، فَأُفرِزَ مِنهَا عَامَ 1409م، وَأُحرِقَ
            حَيًّا بِتُهمَةِ الهَرطَقَةِ في مَجمَعِ كُونسْتَانسَ عَامَ 1415م
            (1372-1415م).

  examples:
