# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11020168-n  |  ili: i95262  |  pos: n
# الموضوع: كينغ كامب جيليت — مخترع موسى الحلاقة الآمنة (1855-1932)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان (جيليت / كينغ سي جيليت) خاليتان من التشكيل الكامل المطلوب في AWN4"
      - "الاسم الثلاثي الكامل 'كينغ كامب جيليت' غائب من اللمّات — الموجود نسخة مختصرة بالحرف الأول 'سي' فقط"
      - "كلمة 'موس' في التعريف غير معيارية؛ الصواب 'مُوسَى الحِلاقَة' بالألف المقصورة وفق المعجم الوسيط والمورد"
      - "المجموعة تمثّل اسم علم لشخص بعينه (proper noun) في حين يُصنَّف الـ POS بوصفه (n) — وإن كان ذلك موافقاً لاصطلاح AWN"
    observations: >
      هذه المجموعة الترادفية تمثّل اسم علم أجنبي لشخصية تاريخية أمريكية هي كينغ كامب جيليت
      (1855-1932)، مخترع موسى الحلاقة الآمنة ومؤسّس الشركة الشهيرة التي تحمل اسمه.
      اللمّتان الحاليتان كلتاهما تعريبٌ للاسم الإنجليزي 'King C. Gillette' و'Gillette'.
      يُعدّ هذا النوع من المجموعات استثنائياً في المعجمية العربية إذ يتعلق بأعلام الأشخاص
      الأجانب؛ لذا تنحصر منهجية توليد اللمّات في التعريب الصوتي (taarib) دون إمكانية
      الاشتقاق أو المجاز. الأولوية هي توحيد الضبط الصوتي وإضافة الاسم الكامل غير المختصر.
  blind_candidates:
    - lemma: "جِيلِيتْ"
      generation_method: taarib
      justification: >
        تعريب الجزء الأخير من الاسم الإنجليزي 'Gillette'؛ هو الشكل الأكثر شيوعاً في
        المصادر الموسوعية والإعلامية العربية للإشارة إلى المخترع وإلى الشركة التي أسّسها.
        ينطبق عليه قبول التعريف واللام والنسبة.
    - lemma: "كِينْغ كَامْب جِيلِيتْ"
      generation_method: taarib
      justification: >
        تعريب الاسم الثلاثي الكامل 'King Camp Gillette'؛ يُستخدم في السياقات التاريخية
        والأكاديمية التي تشترط إيراد الاسم كاملاً دون اختصار الاسم الأوسط بحرفه الأول.
        غيابه يُشكّل فجوة في التغطية المعجمية للمجموعة.
    - lemma: "كِينْغ سِي جِيلِيتْ"
      generation_method: taarib
      justification: >
        تعريب 'King C. Gillette' مع الاحتفاظ بالحرف الأول للاسم الأوسط وفق الاصطلاح
        الموسوعي الإنجليزي الشائع. يُستخدم في السياقات الموسوعية والتوثيقية المرجعية.
    - lemma: "كِنْج جِيلِيتْ"
      generation_method: taarib
      justification: >
        بديل صوتي يعتمد 'كنج' تعريباً لـ 'King'، يرد في بعض المصادر العربية القديمة.
        أقل دقةً من 'كينغ' في محاكاة النطق الإنجليزي ويفتقر إلى الشيوع المعياري.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  queries_run:
    - "batch headword lookup: جيليت / الجيليت / كينغ سي جيليت / كينغ كامب جيليت / جليت / الجليت / جيلت / الجيلت"
    - "English bridge FTS: Gillette / King Gillette / safety razor / King Camp Gillette"
    - "Arabic FTS keywords: موس الحلاقة / مخترع / شفرة الحلاقة / حلاقة آمن"
    - "candidate validation: كنج جيليت / مخترع موس / جيلات / كينج جيليت"
  per_lemma:
    - lemma: "جيليت"
      evidence_status: "no_material_found"

    - lemma: "كينغ سي جيليت"
      evidence_status: "no_material_found"

    - lemma: "جِيلِيتْ"
      evidence_status: "no_material_found"

    - lemma: "كِينْغ كَامْب جِيلِيتْ"
      evidence_status: "no_material_found"

    - lemma: "كِينْغ سِي جِيلِيتْ"
      evidence_status: "no_material_found"

    - lemma: "كِنْج جِيلِيتْ"
      evidence_status: "no_material_found"

  related_findings:
    - text: "«شفرة الأمان؛ موسى الأمان.»"
      source: "المورد الحديث (2008)"
      relevance: >
        مدخل ARABTERM بالمعادل العربي لـ 'safety razor' — يؤكد أن المصطلح المعياري
        للاختراع المنسوب لجيليت هو 'مُوسَى الأَمَان' أو 'شَفْرَة الأَمَان'؛
        يدعم تصحيح كلمة 'موس' في التعريف إلى 'مُوسَى'.
    - text: "«(1) موسى [أو شفرة] الحلاقة (2) المِحْلاق: ماكينة الحلاقة.»"
      source: "المورد الحديث (2008)"
      relevance: >
        مدخل ARABTERM لـ 'razor' يثبت أن الصيغة المعيارية هي 'مُوسَى الحِلَاقَة'
        بالألف المقصورة — لا 'موس الحلاقة' كما في التعريف الحالي.


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────
stage3_analysis:
  per_lemma:
    # ── لمّات موجودة ──────────────────────────────────────
    - lemma: "جيليت"
      decision: confirmed
      decision_reason: >
        التعريب الشائع لاسم المخترع 'Gillette'، ثابت في المصادر الموسوعية والإعلامية
        العربية. غياب الأدلة المعجمية متوقَّع لأسماء الأعلام الأجنبية في المعاجم
        التقليدية. يحتاج إضافة التشكيل الكامل المطلوب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم المختصر الشائع للمخترع، يُستخدم في السياق الإعلامي والتجاري اليومي
        وعند الإشارة المختصرة إليه أو إلى الشركة التي أسّسها. يتميّز بإيجازه وشيوعه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جِيلِيتْ"

    - lemma: "كينغ سي جيليت"
      decision: confirmed
      decision_reason: >
        تعريب الاسم الرسمي 'King C. Gillette' مع اختصار الاسم الأوسط بحرفه الأول
        وفق الاصطلاح الموسوعي الإنجليزي. مقبول كلمّة لأنه وحدة معجمية علمية ثابتة
        تمثّل الاسم الرسمي للشخص. يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي المختصر مع الحرف الأول للاسم الأوسط، يُستخدم في السياقات
        الموسوعية والتوثيقية المرجعية التي تعتمد الاختصار الإنجليزي المتعارف عليه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِينْغ سِي جِيلِيتْ"

    # ── مرشحات المرحلة ١ ──────────────────────────────────
    - lemma: "جِيلِيتْ"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة 'جيليت' بعد إضافة التشكيل الذي ستعالجه
        update_lemma أعلاه — لا يُضاف كلمّة منفصلة.

    - lemma: "كِينْغ كَامْب جِيلِيتْ"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الثلاثي الكامل 'King Camp Gillette' غائب من اللمّات الحالية، وهو ضروري
        للسياقات التاريخية الأكاديمية. يختلف اختلافاً حقيقياً عن 'كينغ سي جيليت'
        باستخدام الاسم الأوسط 'كامب' (Camp) كاملاً بدلاً من اختصاره بحرف 'سي' (C.).
        اختبار التثبيت المعجمي: هذا اسم علم ثابت لا عبارة وصفية حرة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الثلاثي الكامل الصريح دون اختصار، يُستخدم في المراجع التاريخية الأكاديمية
        والسياقات التوثيقية الرسمية التي تشترط إيراد الاسم كاملاً.
      actions:
        - command: create_entry
          params:
            lemma: "كِينْغ كَامْب جِيلِيتْ"
            pos: proper_noun
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "كِينْغ سِي جِيلِيتْ"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة 'كينغ سي جيليت' بعد إضافة التشكيل — لا يُضاف مستقلاً.

    - lemma: "كِنْج جِيلِيتْ"
      source: stage1
      decision: removed
      decision_reason: >
        'كنج' تعريبٌ أقل دقةً وشيوعاً من 'كينغ' في محاكاة النطق الإنجليزي لـ 'King'.
        لا تُضيف قيمةً تمييزية وتُقلّل من جودة المعجم. مرفوضة بموجب معيار 'يُسر التداول'
        واشتراط شيوع الفصيح الموحَّد.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "مخترع ومصنع أمريكي طور موس الحلاقة الآمن (1855-1932)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يحتوي على خطأ لغوي: 'موس الحلاقة الآمن' يجب أن تكون
        'مُوسَى الحِلاقَةِ الآمِنَة' بالألف المقصورة والتأنيث الصحيح للصفة (وفق شواهد
        المورد الحديث). فضلاً عن ذلك، التعريف شحيح ويفتقر إلى المعلومة الجوهرية
        المميَّزة: ابتكار الشفرة القابلة للاستبدال وتأسيس الشركة.
    authored:
      - type: encyclopedic
        text: >
          مُخْتَرِعٌ وصِنَاعِيٌّ أَمْرِيكِيٌّ (1855-1932)، طَوَّرَ مُوسَى الحِلاقَةِ
          الآمِنَةَ ذَاتَ الشَّفْرَةِ الفُولاذِيَّةِ القَابِلَةِ لِلاسْتِبْدَالِ،
          وأَسَّسَ الشَّرِكَةَ المَعْرُوفَةَ بِاسْمِهِ التي غَدَتْ إِحْدَى كُبْرَى
          شَرِكَاتِ مُسْتَلْزَمَاتِ العِنَايَةِ الشَّخْصِيَّة.
    actions:
      - command: update_definition
        params:
