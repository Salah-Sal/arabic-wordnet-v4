# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة 'مصفف' تعني في المعاجم الحلاقَ ومصفِّفَ الشعر؛ وهذا يناظر المعنى الثانوي لكلمة stylist الإنجليزية (hair stylist) لا المعنى الأوّل الذي تُمثّله هذه المجموعة (فنان يُتقن أسلوباً فنياً). الخلط سببه أن 'stylist' لفظٌ مشترك بين معنيين مستقلَّين."
      - "لمّة 'فنان أسلوب' مشكوكٌ في صياغتها: القياس يوجب 'فَنَّانُ الأُسلوب' بتعريف المضاف إليه (المركَّب الإضافي المصطلحي الثابت)، أو 'فَنَّانٌ أُسلوبيٌّ' بالنعت؛ أما تنكير المضاف إليه فيعطي دلالةً وصفية حرّة لا مصطلحاً معجمياً ثابتاً."
      - "كلتا اللمّتين الموجودتين تفتقران إلى التشكيل الكامل."
      - "التعريف العربي الحالي مناسب في جوهره لكنه يفتقر إلى الدقة المصطلحية المطلوبة."
    observations: >
      المجموعة تُمثّل مفهوماً ذا جذور في التراث النقدي العربي: البلاغيون القدامى تحدّثوا عن
      «أصحاب الأساليب» و«سادة الأسلوب»، وقد أثبت المورد الحديث (2008) تعبيرَ «صاحب الأسلوب»
      مقابلاً للمعنى الفني من stylist. غير أن المفهوم يظلّ يعاني فجوةً معجمية جزئية: لا يوجد
      مصطلح مفرد راسخ له في المعجمية العربية. اللمّة الثانية «مصفف» تعكس خطأ في ترجمة stylist
      دون التمييز بين معنييها المستقلَّين، وهو خلط شائع في قواعد AWN المترجمة آلياً.

  blind_candidates:
    - lemma: "أُسلوبِيٌّ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن النسبة (فُعْلوليّ) من «أُسلوب»، موظَّفاً توظيفَ الاسم الاحترافي
        كما يُقال: نَحْوِيٌّ (عالم النحو)، وبَلَاغِيٌّ (عالم البلاغة). يدلّ على من يُتقن
        أسلوباً فنياً ويتمحور حوله.
    - lemma: "سَيِّدُ الأُسلوب"
      generation_method: tarkib
      justification: >
        مركَّب إضافي: سيِّد (صاحب السيادة والإحكام) + الأسلوب؛ يُعبِّر بوضوح عن
        «من أتقن أسلوباً فنياً وبلغ فيه درجة السيادة».
    - lemma: "مُتَأَسْلِب"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل المؤوَّل «تَأَسْلَبَ» (قياساً على الاسم الجامد أسلوب)، بمعنى
        من استبطن أسلوباً فنياً وأحكم ملكتَه فيه. الاشتقاق محاولةٌ لتوليد صيغة مفردة.
    - lemma: "صَاحِبُ الأُسلوب"
      generation_method: tarkib
      justification: >
        مركَّب إضافي: صاحب (المالك والملازم) + الأسلوب؛ يُشير إلى من يمتلك أسلوباً فنياً
        خاصاً يُعرَف به ويُميِّزه. التعبير متداول في الكتابة النقدية العربية،
        وأقرب إلى التثبيت المعجمي من سائر المرشَّحات.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
# الاستعلامات المُنفَّذة:
#   [Q1] مطابقة دفعية: فنان اسلوب، مصفف، اسلوبي، سيد الاسلوب، مجيد، صاحب الاسلوب + ال-forms
#   [Q2] الجسر الإنجليزي: translation_en:"stylist" OR "style artist" OR "master of style"
#   [Q3] FTS عربي: "اسلوب" OR "يتقن" OR "فنان" OR "اسلوبي"
#   [Q4] مرشَّحات إضافية: حاذق، متمكن، صفاف، فنان + ال-forms
#   [Q5] مقاييس اللغة (dict 151): جذور فن، صحب، سلب، صف، مجد، جود
stage2_evidence:
  per_lemma:
    - lemma: "فنان أسلوب"
      evidence_status: "no_material_found"

    - lemma: "مصفف"
      contradicts:
        - text: "«الحلاقُ. (فى الكيمياء): مُسْتَحْضَرٌ تجميلىٌّ, يَعْمَلُ على تثبيت التَّسريحة, وإبقاء الشَّعر فى ترتيبه أطولَ وقتٍ مُمْكنٍ»"
          source: "المعجم الكبير — مجمع اللغة العربية"
          conflict: "المعجم يُعرِّف المصفِّف بالحلّاق ومصفِّف الشعر، وهو معنى مستقل تماماً عن 'الفنان المتقن للأسلوب'"
        - text: "«aligner» [domain: Electropedia IEC 60050]"
          source: "موسوعة الكهرباء IEC 60050 — ARABTERM"
          conflict: "ترجمة 'aligner' لا صلة لها بمفهوم المجموعة من أيّ وجه"
      expands:
        - text: "«(1) صاحب الأسلوب: كاتب أو خطيب متميِّز ببراعة الأسلوب. (2) مصمِّم الأزياء أو تسريحات الشَّعر أو الزَّخارف الداخليّة»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: >
            يكشف أن المعنى المناسب لهذه المجموعة هو «صاحب الأسلوب»، وأن المعنى المتعلق
            بتسريحات الشعر يُعبَّر عنه بـ«مصمِّم التسريحات» لا «مصفِّف»، مما يُثبت
            أن «مصفف» لا يُمثِّل أيَّ معنى من معنيَي stylist تمثيلاً صحيحاً.

    - lemma: "أُسلوبِيٌّ"
      evidence_status: "no_material_found"

    - lemma: "سَيِّدُ الأُسلوب"
      evidence_status: "no_material_found"

    - lemma: "مُتَأَسْلِب"
      evidence_status: "no_material_found"

    - lemma: "صَاحِبُ الأُسلوب"
      confirm:
        - text: "«(1) صاحب الأسلوب: كاتب أو خطيب متميِّز ببراعة الأسلوب»"
          source: "المورد الحديث (2008) — ARABTERM"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "فنان أسلوب"
      decision: confirmed
      decision_reason: >
        المفهوم صحيح والمركَّب الإضافي سليم في جوهره، غير أن الصياغة تحتاج إلى تصحيح:
        (أ) المضاف إليه في المصطلحات الإضافية الثابتة يحمل عادةً أل التعريف («فَنَّانُ الأُسلوب»)
        لتمييز المصطلح عن الوصف الحرّ؛ (ب) يفتقر إلى التشكيل الكامل.
        اجتاز اختبار السكّ بعد التصحيح: «فَنَّانُ الأُسلوب» وحدة معجمية مستقلة
        لا يصحّ فيها إبدال «الأسلوب» بمرادف دون تغيير المفهوم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الطابعَ الفنيَّ الإبداعيَّ للشخص: يُشير إلى فنان (رسّام، نحّات، موسيقيّ،
        مصوِّر...) يُعرَّف بأسلوبه الفريد في ميدان الفنون البصرية أو الأدائية تحديداً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَنَّانُ الأُسلوب"

    - lemma: "مصفف"
      decision: removed
      decision_reason: >
        المعجم الكبير يُعرِّفه صراحةً بـ«الحلاق»، وهو المعنى الثاني لـstylist الإنجليزية
        (hair stylist) لا المعنى الذي تُمثّله هذه المجموعة (فنان يُتقن أسلوباً).
        فضلاً عن ذلك، المورد الحديث يُوضِح أن المقابل الصحيح لهذا المعنى الثاني هو
        «مصمِّم التسريحات» لا «مصفِّف». إدراجه في المجموعة خلطٌ بين معنيين مستقلَّين
        للكلمة الإنجليزية، يستوجب حذف الربط.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "أُسلوبِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        الكلمة في العربية المعاصرة والمعاجم وصفٌ نسبي (stylistic لا stylist)، ولا يُثبت
        المعجم استخدامها اسماً احترافياً للدلالة على «من يتقن أسلوباً»؛ فهي لا تجتاز
        اختبار التثبيت المعجمي. علاوةً على ذلك تفشل في اختبار الاستبدال السياقي:
        «هو أُسلوبيٌّ بارع» تعني «هو ذو أسلوب بارع» لا «هو متقن الأسلوب الفلاني».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "سَيِّدُ الأُسلوب"
      source: stage1
      decision: removed
      decision_reason: >
        المركَّب الإضافي سليم البناء لكنه غير مُثبَّت معجمياً؛ و«صاحب الأسلوب» أولى به
        إذ ثبت في المورد الحديث مقابلاً رسمياً وأقدم تداولاً. وجود بديل مُثبَّت يُسقط
        الحاجة إلى إضافة مرادف غير موثَّق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُتَأَسْلِب"
      source: stage1
      decision: removed
      decision_reason: >
        الاشتقاق من الاسم الجامد «أُسلوب» على بناء تفعلل (تَأَسْلَبَ) قياسٌ غير مستقيم
        صرفياً: باب «تَفَعَّلَ» مقصور على الأفعال الثلاثية المضعَّفة أو ذوات العلة،
        لا على الأسماء الجامدة ذات الوزن الخاص (أُفْعُول). المصطلح مُولَّد دون سند
        صرفي أو معجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "صَاحِبُ الأُسلوب"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَّت في المورد الحديث (2008) مقابلاً صريحاً للمعنى الأول من stylist:
        «كاتب أو خطيب متميِّز ببراعة الأسلوب». المركَّب الإضافي سليم ومُكتمل (مضاف +
        مضاف إليه معرَّف). يجتاز اختبار السكّ: «صاحب الأسلوب» وحدة ثابتة لا يصحّ
        إبدال «صاحب» بـ«مالك» أو «حامل» دون تغيير الدلالة الاصطلاحية.
        يجتاز اختبار التثبيت المعجمي: موثَّق في مصدر معجمي حديث موثوق.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        أوسع دلالةً من «فنّان الأسلوب»: يشمل الكتّاب والخطباء والمصمِّمين وسائر المبدعين
        الذين يمتلكون أسلوباً خاصاً يُميِّزهم، دون اشتراط انتمائهم إلى عالَم الفنون
        البصرية أو الأدائية. الأقرب إلى الاستعمال النقدي الأدبي العربي.
      actions:
        - command: create_entry
          params:
            lemma: "صَاحِبُ الأُسلوب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10686916-n"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "فنان يتقن أسلوباً معيناً"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي صحيح المعنى لكنه يقصر معجمياً من وجهين:
        (أ) «يتقن» فعلٌ عام لا يُميِّز بين الإتقان العادي والتميُّز بأسلوب فريد
        يصير مرجعاً فيه؛
        (ب) «أسلوباً معيناً» أقلّ إحكاماً من «أسلوباً بعينه» أو «أسلوباً فنياً خاصاً».
        التعريف أيضاً يعيد لفظ «فنان» الذي هو الجنس القريب للمجموعة دون فصل نوعي
        كافٍ يُميِّز هذه المجموعة عن المُشيرة إليها الأمّ (awn4-09831743-n).
