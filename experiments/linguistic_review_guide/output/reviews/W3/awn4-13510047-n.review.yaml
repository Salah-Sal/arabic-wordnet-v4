stage1_review:
  assessment:
    concerns:
      - "اللمة الحالية صحيحة كمركب إضافي يعبر عن المفهوم."
    observations: "المفهوم يشير إلى عملية إنتاج أو زراعة البلورات في مختبرات الفيزياء والكيمياء، ويستخدم لذلك مصطلح 'تنمية البلورات' أو 'إنماء البلورات'."
  blind_candidates:
    - lemma: "إِنْمَاءُ البَلُّورَاتِ"
      generation_method: ishtiqaq
      justification: "مصدر الفعل 'أنمى'، وهو يعبر بدقة عن عملية التسبب في نمو البلورة وتشكيلها."
    - lemma: "زِرَاعَةُ البَلُّورَاتِ"
      generation_method: majaz
      justification: "استعارة من الزراعة للدلالة على زرع نواة التبلور وتركها لتنمو في المحلول أو المصهور."
    - lemma: "تَكْوِينُ البَلُّورَاتِ"
      generation_method: ishtiqaq
      justification: "لأن العملية في جوهرها هي تكوين وبناء للبلورات بطريقة اصطناعية."
    - lemma: "اسْتِنْبَاتُ البَلُّورَاتِ"
      generation_method: ishtiqaq
      justification: "قياساً على استنبات النبات أو البكتيريا، حيث توفر الظروف الملائمة لنمو البلورات."

stage2_evidence:
  per_lemma:
    - lemma: "تنمية البلورات"
      confirm:
        - text: "تقنية تستخدم في تنمية بلورات شريطية طويلة ورقيقة من السليكون، وكذلك لتنمية أنواع أخرى من أشباه الموصلات. وهي عملية فريدة من نوعها، حيث أنها تتكون من آليتين متميزتين تسهمان في إنماء البلورة الأحادية."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "إِنْمَاءُ البَلُّورَاتِ"
      confirm:
        - text: "وهي عملية فريدة من نوعها، حيث أنها تتكون من آليتين متميزتين تسهمان في إنماء البلورة الأحادية."
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
    - lemma: "زِرَاعَةُ البَلُّورَاتِ"
      evidence_status: "no_material_found"
    - lemma: "تَكْوِينُ البَلُّورَاتِ"
      evidence_status: "no_material_found"
    - lemma: "اسْتِنْبَاتُ البَلُّورَاتِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "تنمية البلورات"
      decision: confirmed
      decision_reason: "مصطلح تقني موثق في المعاجم المتخصصة للدلالة على العملية الاصطناعية لإنتاج البلورات."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَنْمِيَةُ البَلُّورَاتِ"
    - lemma: "إِنْمَاءُ البَلُّورَاتِ"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح صحيح دلالياً ومعجمياً، ويستخدم كمرادف دقيق لعملية الإنتاج والتنمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params: {lemma: "إِنْمَاءُ البَلُّورَاتِ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-13510047-n"}
    - lemma: "زِرَاعَةُ البَلُّورَاتِ"
      source: stage1
      decision: removed
      decision_reason: "بالرغم من استخدامه أحياناً في السياقات غير الرسمية، إلا أن 'تنمية' أو 'إنماء' هما المصطلحان المعتمدان في المعاجم التقنية."
    - lemma: "تَكْوِينُ البَلُّورَاتِ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح عام يشمل أي عملية تكوين ولا يقتصر على الإنماء الاصطناعي."
    - lemma: "اسْتِنْبَاتُ البَلُّورَاتِ"
      source: stage1
      decision: removed
      decision_reason: "الاستنبات يغلب استخدامه للكائنات الحية (نباتات وبكتيريا) وليس للجمادات."

stage4_content:
  definition:
    current: "(إلكترونيات) إنتاج بلورات (شبه موصلة) عن طريق التبلور البطيء من الحالة المنصهرة"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد ولكنه عبارة عن ترجمة، يمكن صياغته بأسلوب عربي أمتن ومناسب للمعجم."
    authored:
      - type: terminological
        text: "عملية اصطناعية لإنتاج البلورات، خاصة أشباه الموصلات، من خلال التبلور البطيء لمادة من حالتها المنصهرة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "awn4-13510047-n", definition_index: 0, text: "عملية اصطناعية لإنتاج البلورات، خاصة أشباه الموصلات، من خلال التبلور البطيء لمادة من حالتها المنصهرة."}

  examples:
    per_lemma:
      - lemma: "تَنْمِيَةُ البَلُّورَاتِ"
        examples:
          - text: "تُعد تقنية تنمية البلورات أساسية في صناعة الرقائق الإلكترونية الدقيقة."
            type: usage
      - lemma: "إِنْمَاءُ البَلُّورَاتِ"
        examples:
          - text: "يعتمد إنتاج الخلايا الشمسية على إنماء البلورات الأحادية للسيليكون."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "awn4-13510047-n", text: "تُعد تقنية تنمية البلورات أساسية في صناعة الرقائق الإلكترونية الدقيقة."}
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "يعتمد إنتاج الخلايا الشمسية على إنماء البلورات الأحادية للسيليكون."}

