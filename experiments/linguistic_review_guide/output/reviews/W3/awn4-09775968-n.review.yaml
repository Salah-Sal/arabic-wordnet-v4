# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «مُحَرِّر» متعددة الدلالات في العربية الحديثة؛ معناها الغالب في المعاجم التقنية والصحفية هو «editor» (المحرر الصحفي/التقني)، مما يُوجد التباساً مع دلالة التحرير من الرق."
      - "لمّة «مُناهِض لِلعُبُودِيَّة» عبارة وصفية بحرف جر (لِ) وليست تركيباً إضافياً ثابتاً، مما يجعلها عبارة حرة لا مصطلحاً سكّاً."
      - "المفهوم المُراد (abolitionist) هو مصطلح سياسي/اجتماعي متخصص يدعو إلى إلغاء نظام الرق كمؤسسة قانونية، وهذا أخص من مجرد «محرر» أو «مناهض للعبودية»."
    observations: >
      المجموعة تعالج مفهوم «الإلغائي» (abolitionist/emancipationist)، وهو الداعي
      إلى إلغاء نظام الرق بوصفه مصلحاً سياسياً أو اجتماعياً. الجذر العربي الأنسب
      لهذا المفهوم هو إما «ح-ر-ر» (التحرير من العبودية) أو «ع-ت-ق» (العتق الخاص
      بفك رقبة العبد في التراث الإسلامي) أو «ل-غ-و» (الإلغاء: جعل الشيء لاغياً
      غير معتد به). التعريف الحالي «مصلح يؤيد إلغاء العبودية» دقيق في مضمونه
      ولكنه يحتاج إثراء بالبُعد السياسي والاجتماعي.

  blind_candidates:
    - lemma: "مُعْتِقٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر «ع-ت-ق» على وزن مُفْعِل (اسم فاعل من أَعْتَق)؛ الإعتاق في
        التراث الإسلامي هو تحرير العبد من الرق تحديداً، والمُعتِق هو الشخص
        الذي يُحرر عبده. الوزن يُعبّر عن الفاعلية المباشرة.
    - lemma: "مُحَرِّرٌ"
      generation_method: ishtiqaq
      justification: >
        من جذر «ح-ر-ر» على وزن مُفَعِّل (اسم فاعل من حَرَّرَ)؛ التحرير يعني
        جعل الشخص حراً، والمُحرِّر هو من يحرر الرقيق. وزن مُفَعِّل يدل على
        التعدية والكثرة مما يلائم المفهوم الحركي للمصلح الاجتماعي.
    - lemma: "مُناهِضُ الرِّقِّ"
      generation_method: tarkib
      justification: >
        تركيب إضافي (مضاف ومضاف إليه) من مُناهِض (اسم فاعل من ناهَضَ) +
        الرِّقّ (العبودية). يُعبّر عن معارضة الرق بصورة مباشرة وثابتة.
        الرِّقّ أخص من «العبودية» في السياق القانوني العربي الكلاسيكي.
    - lemma: "إِحْرارِيٌّ"
      generation_method: ishtiqaq
      justification: >
        نسبة من «إحرار» (مصدر Form IV: أَحَرَّ) على منوال «اشتراكيّ» و«رأسمالي»؛
        يدل على الانتماء إلى حركة تحرير العبيد. الصيغة الاسمية المنسوبة تُلائم
        الدلالة على صاحب الفكر والتوجه السياسي.


