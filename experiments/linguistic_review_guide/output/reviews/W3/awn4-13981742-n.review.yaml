# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13981742-n
# ubiquity / ubiquitousness / omnipresence
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «وجود في كل مكان» عبارة وصفية حرة وليست مصطلحاً معجمياً ثابتاً؛ يمكن استبدال «مكان» بـ«موضع» أو «بقعة» مع بقاء المعنى"
      - "اللمّة «وجود كلي» غامضة الدلالة؛ «كلي» في الاصطلاح الفلسفي العربي تعني universal مقابل جزئي، فقد يُفهم المركب على أنه «وجود كلي» بمعنى الوجود العام لا الحضور في كل مكان"
      - "المجموعة تفتقر إلى مصطلح مسكوك ثابت كـ«كُلِّيَّة الوُجُود» المثبت في المورد الحديث"
    observations: "المفهوم المراد هو حالة الحضور في جميع الأمكنة في آنٍ واحد، وهو مفهوم لاهوتي-فلسفي بالأساس يُنسب إلى الذات الإلهية في التراث الإسلامي. اللمّتان الموجودتان أقرب إلى الشرح التفسيري منهما إلى المصطلح المعجمي، والأولى استبدالهما بمركب إضافي ثابت أو مصدر صناعي."

  blind_candidates:
    - lemma: "كُلِّيَّةُ الوُجُودِ"
      generation_method: tarkib
      justification: "مركب إضافي من «كُلِّيَّة» (المصدر الصناعي من كُلّ بمعنى الشمول والإحاطة) و«الوُجُود» (ضد العدم)، فيكون المعنى: صفة الوجود الشامل لجميع الأمكنة. التركيب طبيعي في العربية ومثبت في المورد الحديث مقابل omnipresence."
    - lemma: "مَعِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من حرف «مَعَ» الدال على المصاحبة والمقارنة، يُستعمل في علم الكلام الإسلامي للدلالة على صفة الحق في كونه مع خلقه أينما كانوا. الوزن (فَعِيلة/فَعِلة من مَعَ) مولّد مقبول."
    - lemma: "إِحَاطَة"
      generation_method: ishtiqaq
      justification: "مصدر من أحاطَ يُحيطُ (جذر حوط)، والإحاطة في اللغة: إدراك الشيء بكماله والاستدارة به من جميع جوانبه. في القرآن: «وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا»، فالإحاطة تدل على الشمول والإطافة."
    - lemma: "عُمُومُ الحُضُورِ"
      generation_method: tarkib
      justification: "مركب إضافي من «عُمُوم» (الشمول) و«الحُضُور» (ضد الغياب). المعنى: شمول الحضور لجميع الأمكنة. تركيب وصفي طبيعي لكنه غير مثبت معجمياً."


stage2_evidence:
  per_lemma:
    - lemma: "وُجُودٌ فِي كُلِّ مَكَانٍ"
      evidence_status: "no_material_found"

    - lemma: "وُجُودٌ كُلِّيٌّ"
      contradicts:
        - text: "«الكلِّيُّ: مَا لَا يمْنَع عَنهُ.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "«كلي» في الاصطلاح المنطقي يعني المفهوم الذي لا يمتنع اشتراك كثيرين فيه، وليس الوجود المكاني الشامل"
        - text: "«الكلي: الحقيقي ما لا يمنع نفس تصوره من وقوع الشركة كالإنسان.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "التعريف يؤكد أن «الكلي» مصطلح منطقي لا مكاني"
      expands:
        - text: "«(الْوُجُود) ضد الْعَدَم وَهُوَ ذهني وخارجي (مج)»"
          source: "المعجم الوسيط"
          addition: "الوجود في المعجم الوسيط يُقسم إلى ذهني وخارجي، ولا يحمل بذاته دلالة مكانية شاملة"

    - lemma: "كُلِّيَّةُ الوُجُودِ"
      confirm:
        - text: "«كُلّية الوجود: كون الشيء موجودًا في كلّ مكان في جميع الأوقات.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«= omnipresence»"
          source: "المورد الحديث (2008) — مدخل ubiquity"
          addition: "المورد يساوي بين ubiquity وomnipresence ويقابلهما بـ«كلية الوجود»"

    - lemma: "مَعِيَّة"
      expands:
        - text: "«المعيّة: أقسامها على قياس أقسام التقدّم والتأخّر وقد سبقت.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "المعية في الاصطلاح تدل على المصاحبة الزمنية (coexistence/concomitance) أكثر من الحضور المكاني الشامل"

    - lemma: "إِحَاطَة"
      contradicts:
        - text: "«الإحاطة: إدراك الشيء بكماله ظاهرًا وباطنًا.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الإحاطة تعني الإدراك الشامل والعلم المحيط، لا الحضور المادي في كل مكان"
      expands:
        - text: "«الإحاطة: إدراك الشيء بكماله ظاهرا وباطنا، والاستدارة بالشيء من جميع جوانبه، ذكره الراغب. وقال أبو البقاء احتواء الشيء على ما وراءه ويعبر بها عن إدراك الشيء على حقيقته.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "فيها معنى الاستدارة بالشيء من جميع الجوانب مما يقرّبها من المعنى المكاني، لكن الغالب فيها الإدراك العلمي"

    - lemma: "عُمُومُ الحُضُورِ"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "وُجُودٌ فِي كُلِّ مَكَانٍ"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل في اختبار السكّ: يمكن استبدال «مكان» بـ«موضع» أو «بقعة» مع بقاء الوصف صالحاً. ليست وحدة معجمية ثابتة ولا مصطلحاً مسكوكاً. لم تُوجد في أي معجم بوصفها مدخلاً مستقلاً."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "وُجُودٌ كُلِّيٌّ"
      decision: removed
      decision_reason: "المركب ملتبس دلالياً: «كلي» في التراث العربي مصطلح منطقي يقابل universal ويضاد «جزئي»، فـ«وجود كلي» يُفهم على أنه «وجود كلي مقابل جزئي» لا «حضور في كل مكان». لم يرد في أي معجم بمعنى omnipresence، في حين أن «كلية الوجود» ثابتة بهذا المعنى في المورد الحديث."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "كُلِّيَّةُ الوُجُودِ"
      source: stage1
      decision: confirmed
      decision_reason: "مركب إضافي ثابت مثبت في المورد الحديث (2008) بتعريف صريح: «كون الشيء موجودًا في كلّ مكان في جميع الأوقات» مقابل omnipresence. كما ورد ubiquity = omnipresence في المصدر نفسه. التركيب طبيعي ومنتج: «كلية» مصدر صناعي من «كل» الدال على الإحاطة والشمول في مقاييس اللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "المصطلح المعياري الوحيد في المجموعة بعد حذف اللمّتين الأصليتين؛ يجمع بين الدلالة المكانية (الوجود في كل مكان) والدلالة الزمنية (في جميع الأوقات)"
      actions:
        - command: create_entry
          params:
            lemma: "كُلِّيَّةُ الوُجُودِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَعِيَّة"
      source: stage1
      decision: removed
      decision_reason: "المعية في الاصطلاح تدل على المصاحبة الزمنية (coexistence/concomitance) لا على الحضور المكاني الشامل. في كشاف التهانوي أقسامها مبنية على التقدم والتأخر الزمنيَّيْن. وفي علم الكلام هي صفة إلهية خاصة لا تعمّم على غير الذات الإلهية."
      evidence_assessment:
        case: mixed

    - lemma: "إِحَاطَة"
      source: stage1
      decision: removed
      decision_reason: "الإحاطة في المعاجم والاصطلاح تدل على الإدراك الشامل والعلم المحيط بالشيء من جميع جوانبه، وهي أقرب إلى comprehension منها إلى omnipresence. المعنى المكاني فيها ثانوي مقارنة بالمعنى المعرفي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "عُمُومُ الحُضُورِ"
      source: stage1
      decision: removed
      decision_reason: "مركب إضافي غير مثبت في أي معجم أو مصدر، ويفشل في اختبار التثبيت المعجمي. يمكن تأليف عشرات المركبات المماثلة (شمول الحضور، سعة الحضور) دون أن يكون أيٌّ منها مصطلحاً."
      evidence_assessment:
        case: no_material


