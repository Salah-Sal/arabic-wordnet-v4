# ── المرحلة ١: المراجعة والتوليد (التوليد الأعمى) ─────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (حفّار وفنان الحفر) تفتقران إلى التشكيل الكامل"
      - "لفظ «حفّار» في المعاجم الكلاسيكية يغلب فيه معنى حافر القبور والجداول لا فنان الحفر الطباعي، مما يستوجب توثيق الدلالة التقنية بعناية"
      - "التعريف الحالي يستخدم التقييد بين قوسين «(الطباعي)» وهو أسلوب غير معجمي، ويفتقر إلى الجنس القريب والفصل النوعي"
      - "غياب لمّة «نقّاش» الأرسخ في التراث والأشمل دلالةً في الإحالة على مُمارِس فن النقش والحفر على المعادن"
    observations: |
      المجموعة تصف فنان الحفر الطباعي (etcher)، وهو متخصص في تقنية الحفر الغائر على صفائح معدنية
      باستخدام الأدوات الحادة أو الأحماض الكيميائية ثم طباعة النقوش على الورق. الجذر حفر مدعوم بقوة
      في المعاجم التقنية الحديثة لهذا الغرض، وإن كان الأصل اللغوي يدور حول الحفر المادي العام.
      أما «فنان الحفر» فمركّب إضافي يُبرز الطابع الفني في الممارس. يستحق المفهوم استيعاب «نقّاش»
      لما له من رسوخ في التراث العربي وتصريح المورد الحديث بأنه «البارع في نقش المعادن أو حفرها».
  blind_candidates:
    - lemma: "نَقَّاش"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر نقش على وزن فعّال الدال على الحِرفي المتخصص؛ النقش هو إحداث زخارف ورسوم غائرة في المادة وهو الفعل الجوهري لفنان الحفر"
    - lemma: "حَاكٌّ"
      generation_method: ishtiqaq
      justification: "من الجذر حكك على وزن فاعل؛ الحكّ يعني الخدش بأداة حادة وهو يوازي ظاهرياً عملية الحفر الطباعي على الصفائح المعدنية"
    - lemma: "حَافِر"
      generation_method: ishtiqaq
      justification: "اسم الفاعل المباشر من حفر على وزن فاعل؛ إذ الحفر هو الفعل الجوهري المذكور في التعريف، ومحاولة الاشتقاق المنتظم منه على صيغة الفاعل"
    - lemma: "مُنَقِّش"
      generation_method: ishtiqaq
      justification: "اسم فاعل من نقّش (الباب الثاني) على وزن مُفَعِّل، يعني من يزيّن شيئاً بنقوش غائرة بارزة، وهو وصف ملائم نظرياً لفنان الحفر"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:

    - lemma: "حفّار"
      confirm:
        - text: "«حفار — etcher» [مجال: طباعة]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.١: طباعة - كهرباء (1996) — ARABTERM"
        - text: "«حفّار — etcher» بماء النار"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
        - text: "«حفَّار — engraver» [مجال: التقنيات التربوية]"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
      expands:
        - text: "«من صناعته الحفارة. وغلب على حافر القبور ومن يحفر الخشب ونحوه ليعده للزينة»"
          source: "المعجم الوسيط"
          addition: "يُثبت وزن فعّال للمتخصص في الحفر بوجه عام بما فيه الحفر للزينة والتجميل، مما يُقرِّبه من فنان الحفر الطباعي"
        - text: "«مَنْ عَمَلُه الحِفَارَةُ، وغَلَب على مَنْ يَحْفِرُ القُبورَ؛ نوعٌ من الخنافسِ له قرونٌ يَحْفِرُ بها الأرْضَ وسُوقَ الأشجار»"
          source: "المعجم الكبير"
          addition: "يؤكد الوزن الصرفي للحِرَفيين المتخصصين بالحفر، مما يدعم قبوله لاحقاً في السياق التقني الطباعي"
        - text: "«حفّار ناسخ: حفار يقوم بطبع نسخ متعددة للعمل الفني الواحد — reproductive engraver»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
          addition: "يُظهر أن مصطلح حفّار يدخل في مركّبات تقنية متعددة داخل مجال الطباعة والفن الغرافيكي"

    - lemma: "فنان الحفر"
      confirm:
        - text: "«فنان حفر — engraver» [مجال: طباعة - كهرباء]"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.١: طباعة - كهرباء (1996) — ARABTERM"
      expands:
        - text: "«مصور حفّار — painter-engraver»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
          addition: "يُثبت أن العربية تُركِّب «صفة الفنان» مع «الحفّار» في وحدة معجمية ثابتة، مما يُعزز شرعية المركّب «فنان الحفر»"

    - lemma: "نَقَّاش"
      confirm:
        - text: "«النَّقَّاشُ: مَن حرفته النَّقْش»"
          source: "المعجم الكبير"
        - text: "«النقاش: من حرفته النقش»"
          source: "المعجم الوسيط"
        - text: "«النَّقّاش: البارع في نقش المعادن أو حَفْرها»"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«حفار خشب: حفّار أو نقاش على الخشب بأسلوب عرضاني أو طولاني — xylograph (wood engraver)»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
          addition: "يُثبت أن «نقّاش» و«حفّار» يُستخدمان متبادلَين في سياقات الحفر الفني على المواد الصلبة"
        - text: "«نقاش أنواط — medal engraver»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
          addition: "يؤكد توظيف نقّاش في مركّبات تقنية متخصصة للحفر على المعادن"

    - lemma: "حَاكٌّ"
      contradicts:
        - text: "«الحَاكُّ: الملحُّ في الطَّلَبِ، صاحبُ الشَّرِّ (مجاز)»"
          source: "المعجم الكبير"
          conflict: "المعنى الثابت هو الإلحاح في الطلب والميل إلى الشر، لا الحفر أو النقش؛ لا شاهد في التراث على استخدامه للدلالة على فنان الحفر"
        - text: "«الحَاكُّ: الملح في الطلب النزاع إلى الشر»"
          source: "المعجم الوسيط"
          conflict: "تؤكد أن المعنى الاصطلاحي الراسخ بعيد كل البعد عن مجال الفنون والحفر الطباعي"

    - lemma: "حَافِر"
      contradicts:
        - text: "«الحافر: من الدواب ما يقابل القدم من الإنسان»"
          source: "المعجم الوسيط"
          conflict: "المعنى الراسخ هو عضو الدابة (hoof) وليس مُمارِس الحفر"
        - text: "«واحدُ حَوافِر الدَّابَّةِ كالخَيْلِ ونَحْوِها»"
          source: "المعجم الكبير"
          conflict: "يُرسِّخ دلالة الحافر على عضو الدابة لا على اسم الفاعل من الحفر بمعنى النقش"
        - text: "«حافر — hoof» [أحياء، طب بيطري، طب]"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)؛ المعجم الطبي الموحد (2009)؛ المعجم الموحد لمصطلحات الطب البيطري (2010) — ARABTERM"
          conflict: "الاستخدام التقني المعاصر يُرسِّخ دلالة الحافر على عضو الدابة في جميع التخصصات العلمية"

    - lemma: "مُنَقِّش"
      evidence_status: "no_material_found"


