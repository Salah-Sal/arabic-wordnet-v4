# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-09788176-n | ILI: i88072 | POS: n
# Lemma_EN: adder | Definition_EN: a person who adds numbers
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الموجودة 'جامع الأعداد' خالية من التشكيل الكامل"
      - "المركّب الإضافي 'جامع الأعداد' غير موثَّق كوحدة معجمية ثابتة مسجَّلة في المعاجم العربية"
      - "التعريف الحالي يستخدم صيغة 'يقوم بـ' الضعيفة أسلوبياً في لغة المعاجم"
      - "كلمة 'الأرقام' في التعريف أقل دقة من 'الأعداد' في السياق الرياضي والحسابي"
      - "خطر الخلط الدلالي بين 'جامع' بمعنى شخص يجمع الأعداد و'جامع' بمعنى الوحدة الإلكترونية للجمع (adder circuit)"
    observations: >
      تصف المجموعة شخصاً بشرياً وظيفتُهُ جمع الأعداد الحسابية — وهي وظيفة ارتبطت تاريخياً
      بالحسّابين والمحاسبين البشريين قبل انتشار الآلات الحاسبة الإلكترونية. يستخدم التراث
      العربي الرياضي "الجمع" لعملية الإضافة، و"الجامع" اسمَ الفاعل الطبيعي منها، غير أن
      اللفظ محمَّل بأعباء دلالية كثيرة (المسجد الجامع، اسم الله الجامع، الوصف الشامل).
      الأب المباشر "خبير في الحساب" مناسب تماماً. اللمّة الحالية "جامع الأعداد" مركّب
      إضافي وصفي يفي بالغرض وإن كان غير مثبَّت كوحدة اصطلاحية صلبة.

  blind_candidates:
    - lemma: "جَمَّاع"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من الجذر (جمع) يدل على الاحتراف والمبالغة في الفعل؛ الجَمَّاعُ: المُكثِر
        من الجمع والضمّ، مناسب لمن حِرفتُهُ الجمع الحسابي للأعداد. الوزن منتج في الدلالة
        على المحترفين (كحاطب/حطّاب، خبز/خبّاز).
    - lemma: "مُجَمِّعُ الأَرْقَامِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي: اسم الفاعل من الثلاثي المزيد (جمَّع — Form II) يدل على التكثير
        والتجميع المنهجي، مضافاً إلى "الأرقام" لتحديد الوظيفة الحسابية بدقة.
    - lemma: "ضَامُّ الأَعْدَادِ"
      generation_method: tarkib
      justification: >
        مركّب إضافي: الضامّ اسم فاعل من (ضمَّ) بمعنى ضمّ الشيء إلى الشيء أي أضافه إليه،
        وقد استُعمل الجذر (ضمم) في سياقات الجمع والإضافة في العربية الكلاسيكية.
    - lemma: "جَامِع"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل من (جمع)، وهو أقصر وأكثر صرامةً اشتقاقياً من المركّب؛ وقد
        استُعمل في المصطلحية الرياضية العربية للدلالة على عملية الجمع ومن يجريها.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#  Q1 — مطابقة دفعية: جامع الاعداد، جماع، الجماع، مجمع الارقام، ضام الاعداد، جامع، الجامع، ضام، الضام
#  Q2 — جسر إنجليزي: translation_en:"adder" OR "adding" OR "summator" OR "arithmetic"
#  Q3 — مقاييس اللغة (dictionary_id=151): جمع، عدد
stage2_evidence:
  per_lemma:
    - lemma: "جامع الأعداد"
      confirm:
        - text: "«الأفعى: أيّ من عدة حيّاتٍ سامة. (1) المُضيف؛ الضامّ؛ الجامع (2) ماكينة جَمْع.»"
          source: "المورد الحديث (2008) — ArabTerm، entry_id 668907"
      expands:
        - text: "«جامِع — وحدة إلكترونية تقوم بجمع الأعداد المدخلة إليها، ومنها ما هو نصف جمّاع وما هو جمّاع تام.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم / ArabTerm، entry_id 398191"
          addition: >
            يؤكد أن 'جامع' هو المصطلح العربي المعتمد في ألكسو لـ adder، غير أن
            التعريف يصف وحدة إلكترونية (adder circuit) لا شخصاً؛ مما يكشف عن تداخل
            دلالي بين استخدام اللفظ للإنسان وللآلة في المعجمية الحاسوبية العربية.
      contradicts:
        - text: "«(الْجَامِع) من أَسمَاء الله الْحسنى وَالْمَسْجِد الْجَامِع الَّذِي تصلى فِيهِ الْجُمُعَة [...] وَأمر جَامع لَهُ خطر يجْتَمع لأَجله النَّاس.»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani)، entry_id 870075"
          conflict: >
            يُظهر اتساع التعدد الدلالي للجذر جامع وضرورة المركّب لتقليص
            الالتباس، إلا أن المركّب "جامع الأعداد" نفسه غير مثبَّت كوحدة معجمية.

    - lemma: "جَمَّاع"
      expands:
        - text: "«جامِع — وحدة إلكترونية تقوم بجمع الأعداد المدخلة إليها، ومنها ما هو نصف جمّاع وما هو جمّاع تام.»"
          source: "مسرد التربية، ألكسو / ArabTerm، entry_id 398191"
          addition: >
            يُثبت شيوع وزن (فَعَّال) من جمع في المصطلحية الحاسوبية العربية:
            نصف جمّاع = half adder، جمّاع تام = full adder. لكن في سياق الدوائر
            الإلكترونية لا الشخص البشري.
      contradicts:
        - text: "«(جَمَعَ) [...] وَالْجُمَّاعُ الْأُشَابَةُ مِنْ قَبَائِلَ شَتَّى.»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          conflict: >
            وزن جُمَّاع (بضم الجيم وتشديد الميم) في التراث المعجمي لأشياب القبائل
            المختلطة، ولا صلة له بمن يجمع الأعداد. الوزن مشغول دلالياً بالإلكترونيات الحاسوبية الحديثة.

    - lemma: "مُجَمِّعُ الأَرْقَامِ"
      evidence_status: "no_material_found"

    - lemma: "ضَامُّ الأَعْدَادِ"
      confirm:
        - text: "«الأفعى: أيّ من عدة حيّاتٍ سامة. (1) المُضيف؛ الضامّ؛ الجامع (2) ماكينة جَمْع.»"
          source: "المورد الحديث (2008) — ArabTerm، entry_id 668907"
      expands:
        - text: "«ضامَّ فلانٌ فلانًا مُضامَّةً وضِمامًا: قام معه في أمرٍ واحدٍ [...] الشيءُ الشيءَ وإليه: تَجمَّع معه.»"
          source: "المعجم الكبير، entry_id 59174"
          addition: "يُثبت أن ضامَّ تحمل معنى الانضمام والتجمّع، وهو أصل دلالي صالح للجمع الحسابي."
      contradicts:
        - text: "«النسيج الضامُّ (في الطب) Connective tissue: نسيجٌ رِخْوٌ يملأ الفراغاتِ بين الأنسجةِ والأعضاء.»"
          source: "المعجم الكبير، entry_id 59183"
          conflict: "لفظ 'الضامّ' محمَّل باستخدام طبي راسخ (النسيج الضامّ) مما يُضعف قابليته لسياق الشخص الحسابي."

    - lemma: "جَامِع"
      confirm:
        - text: "«الأفعى: أيّ من عدة حيّاتٍ سامة. (1) المُضيف؛ الضامّ؛ الجامع (2) ماكينة جَمْع.»"
          source: "المورد الحديث (2008) — ArabTerm، entry_id 668907"
      contradicts:
        - text: "«جامِع — وحدة إلكترونية تقوم بجمع الأعداد المدخلة إليها، ومنها ما هو نصف جمّاع وما هو جمّاع تام.»"
          source: "مسرد التربية، ألكسو / ArabTerm، entry_id 398191"
          conflict: >
            أكبر المعاجم التقنية العربية (ألكسو) تستخدم 'جامع' للوحدة الإلكترونية لا
            للشخص، مما يخلق تنافساً دلالياً مع الاستخدام البشري.
        - text: "«(الْجَامِع) من أَسمَاء الله الْحسنى وَالْمَسْجِد الْجَامِع [...] وكلامٌ جامعٌ قلَّت ألفاظه وكثرت معانيه.»"
          source: "المعجم الوسيط (OCR)، entry_id 4521"
          conflict: "اشتراك لفظي حاد: المسجد، اسم الله، الأمر الجسيم، الكلام الموجز — يستدعي سياقاً مقيِّداً."


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "جامع الأعداد"
      decision: confirmed
      decision_reason: >
        المركّب الإضافي يصف المفهوم بوضوح ويُقيِّد الاشتراك اللفظي لـ'جامع' بإضافة 'الأعداد'.
        المورد الحديث (ألكسو) يُثبت 'الجامع' ضمن مقابلات adder في المعنى البشري.
        اللمّة هي الوحيدة الممثِّلة للمجموعة وتحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تُعبِّر عن الشخص البشري الذي يجمع الأعداد الحسابية
        مهنةً أو وظيفة، في مقابل الوحدة الإلكترونية للجمع (adder circuit) التي تنتمي
        إلى مجموعة أخرى، ومقابل الحاسب والمحاسب الأعمّ (الأب المباشر).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَامِعُ الأَعْدَادِ"

    - lemma: "جَمَّاع"
      source: stage1
      decision: removed
      decision_reason: >
        وزن فَعَّال موثَّق في ألكسو حصراً للدوائر الإلكترونية (نصف جمّاع = half adder،
        جمّاع تام = full adder)؛ إدراجه في هذه المجموعة البشرية سيُلتبس بمصطلح الدارات
        المنطقية. ولا شاهد معجمي واضح على استخدام 'جمّاع' للشخص الحسابي البشري.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُجَمِّعُ الأَرْقَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شواهد معجمية. يفشل اختبار التثبيت المعجمي: يمكن استبدال 'الأرقام' بـ'الأعداد'
        دون فقدان المعنى — دليل على أنه وصف حرّ لا وحدة معجمية. ولا قيمة مضافة على
        اللمّة الموجودة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "ضَامُّ الأَعْدَادِ"
      source: stage1
      decision: removed
      decision_reason: >
        'الضامّ' موثَّق في المورد الحديث كأحد مقابلات adder، غير أن المركّب 'ضامّ
        الأعداد' غير مثبَّت ويفشل اختبار التثبيت. علاوةً على ذلك، يحمل 'الضامّ' استخداماً
        طبياً راسخاً (النسيج الضامّ) يُنافس المعنى الحسابي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "جَامِع"
      source: stage1
      decision: removed
      decision_reason: >
        بالغ الاشتراك اللفظي (المسجد، اسم الله الحسنى، الأمر الجسيم، الوصف الشامل).
        ARABTERM يستخدمه للوحدة الإلكترونية لا للشخص. لا يصلح لمّةً منفردة بهذا
        المعنى البشري دون مقيِّد.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "شخص يقوم بجمع الأرقام"
    assessment:
      decision: revise
      reason: >
        صيغة 'يقوم بـ' ركيكةٌ في أسلوب المعاجم؛ والأفصح استخدام الفعل المباشر أو
        الوصف الاسمي. 'الأرقام' أقل دقة من 'الأعداد' في السياق الرياضي (الأعداد:
        كميات رياضية؛ الأرقام: رموز كتابية). والتعريف يفتقر إلى إشارة صريحة للوظيفة
        أو التخصص الذي يُحدِّد هذا الشخص ضمن مجال الحساب.
    authored:
      - type: terminological
        text: "شخصٌ وظيفتُهُ جمعُ الأعدادِ الحسابيَّةِ وحسابُ مجاميعها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "شخصٌ وظيفتُهُ جمعُ الأعدادِ الحسابيَّةِ وحسابُ مجاميعها"

  examples:
    per_lemma:
      - lemma: "جَامِعُ الأَعْدَادِ"
        examples:
          - text: "كانتِ الشركاتُ الكبرى توظِّف فِرقاً من جامعي الأعدادِ لإنجاز الميزانيَّاتِ السنويَّة قبل انتشار الآلاتِ الحاسبة"
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "كانتِ الشركاتُ الكبرى توظِّف فِرقاً من جامعي الأعدادِ لإنجاز الميزانيَّاتِ السنويَّة قبل انتشار الآلاتِ الحاسبة"


