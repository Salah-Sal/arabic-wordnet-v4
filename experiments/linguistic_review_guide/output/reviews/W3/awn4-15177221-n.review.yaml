# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-15177221-n
# minority / nonage — أي سن قبل السن القانوني
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «قصر» غير مُشكّلة وملتبسة مع معانٍ كثيرة (قَصْر=بناء، قِصَر=خلاف الطول)؛ الصيغة الصحيحة للدلالة على عدم بلوغ الرشد هي «قُصُور»"
      - "اللمّة «صغر» غير مُشكّلة وتحتاج تشكيلاً كاملاً: صِغَر"
      - "التعريف العربي ترجمة حرفية من الإنجليزية ويحتاج تأليفاً معجمياً"
    observations: "المجموعة تعبّر عن مفهوم قانوني واضح في الثقافة العربية الإسلامية، وهو حالة من لم يبلغ سنّ الرشد. المصطلحات العربية المستعملة في هذا الباب: القُصُور، الصِّغَر، الحَداثة. الجذر ق-ص-ر يفيد عدم بلوغ المدى والنهاية، وهو أنسب الجذور لهذا المفهوم القانوني. أمّا صغر فيدلّ على حداثة السنّ عموماً."
  blind_candidates:
    - lemma: "قُصُور"
      generation_method: ishtiqaq
      justification: "مصدر قَصَرَ عن الشيء قُصُوراً أي عجز عنه ولم يبلغه، فالقُصُور هو حالة عدم بلوغ سنّ الرشد القانوني"
    - lemma: "حَدَاثَة"
      generation_method: ishtiqaq
      justification: "مصدر من حَدَثَ بمعنى كون الشيء جديداً طريّاً، والحداثة في المعاجم: سنّ الشباب، وتُستعمل للدلالة على ما قبل الرشد"
    - lemma: "صِغَر"
      generation_method: ishtiqaq
      justification: "مصدر صَغُرَ، والصِّغَر في المعجم الكبير: حداثة السنّ، يُستعمل مرادفاً للقصور في السياق القانوني"
    - lemma: "صِبَا"
      generation_method: ishtiqaq
      justification: "مصدر صَبِيَ/صَبَا، والصِّبا: الصِّغَر والحداثة، يُطلق على مرحلة ما قبل البلوغ"

stage2_evidence:
  per_lemma:
    - lemma: "صِغَر"
      confirm:
        - text: "«حداثةُ السِّنِّ.»"
          source: "المعجم الكبير"
        - text: "«الصِّغَرُ: ضِدُّ الْكِبَرِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«في الجِرْم: خلافُ العِظَم»"
          source: "المعجم الكبير"
          addition: "الصِّغَر يُستعمل أيضاً في الجِرْم لا في السنّ فقط"
        - text: "«الصِّغَرُ، كعنبٍ، والصَّغارَةُ، بالفتح: خلافُ العِظَمِ، أو الأُولى في الجِرْمِ، والثانيةُ في القَدْرِ»"
          source: "القاموس المحيط"
          addition: "تفريق بين الصِّغَر (في الجرم) والصَّغارة (في القدر)"

    - lemma: "قَصْر"
      contradicts:
        - text: "«خِلافُ المدِّ. التقصِيرُ. الغايةُ. بيت فخم واسع. العَشِيُّ. إزالة اللون من ألياف النسيج»"
          source: "المعجم الوسيط"
          conflict: "القَصْر بفتح القاف وسكون الصاد له معانٍ كثيرة ليس منها القصور القانوني؛ المعنى المطلوب هو القُصُور (مصدر قَصَرَ عن = عَجَزَ)"
        - text: "«(1) «أ» الحداثة؛ سنّ القُصور: سنّ ما قبل الرُّشد. «ب» القُصور: كون المرء قاصرًا غيرَ راشد»"
          source: "المورد الحديث"
          conflict: "المورد يستعمل القُصُور لا القَصْر للدلالة على minority"

    - lemma: "قُصُور"
      confirm:
        - text: "«(1) «أ» الحداثة؛ سنّ القُصور: سنّ ما قبل الرُّشد. «ب» القُصور: كون المرء قاصرًا غيرَ راشد»"
          source: "المورد الحديث"
        - text: "«(1) سنّ القصور (2) «أ» حداثة؛ صِبا. «ب» عدم نضج.»"
          source: "المورد الحديث (مدخل nonage)"
        - text: "«قَصَرْتُ عَنْهُ قُصُورًا: عَجَزْتُ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«قاصر: الحدث الذي لم يبلغ بعد سن الرشد.»"
          source: "المعجم الموحد لمصطلحات القانون"
      expands:
        - text: "«القُصور: العجزُ.»"
          source: "التعريفات الفقهية للبركتي"
          addition: "القُصُور في الاصطلاح الفقهي يدلّ على العجز عموماً"

    - lemma: "حَدَاثَة"
      confirm:
        - text: "«سنّ الشَّباب»"
          source: "المعجم الوسيط"
        - text: "«حداثةُ السِّنِّ: كنايةٌ عن الشَّبابِ وأوَّلِ العُمُرِ»"
          source: "المعجم الكبير"
        - text: "«(1) «أ» الحداثة؛ سنّ القُصور: سنّ ما قبل الرُّشد»"
          source: "المورد الحديث (مدخل minority)"
      expands:
        - text: "«من الأمْر: أوَّلُه وابْتداؤه»"
          source: "المعجم الكبير"
          addition: "الحداثة تُستعمل أيضاً بمعنى أوّل الشيء وابتدائه"

    - lemma: "صِبَا"
      confirm:
        - text: "«الصِّبَا: الصغر والحداثة»"
          source: "المعجم الوسيط (هوراماني)"
        - text: "«الصِّبا: الصِّغَرُ والحداثةُ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الصَّبِيُّ: من لم يبلغ الحلم»"
          source: "المفردات في غريب القرآن"
          conflict: "الصِّبا يدلّ على مرحلة الطفولة بيولوجياً لا على الحالة القانونية تحديداً"

stage3_analysis:
  per_lemma:
    - lemma: "صِغَر"
      decision: confirmed
      decision_reason: "الصِّغَر مصدر ثابت في المعاجم بمعنى حداثة السنّ، وهو مستعمل في السياق القانوني للدلالة على ما قبل سنّ الرشد. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على حداثة السنّ من حيث صِغَر العمر عموماً، ويُستعمل في السياقات العامة والأدبية فضلاً عن القانونية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صِغَر"

    - lemma: "قَصْر"
      decision: removed
      decision_reason: "القَصْر بهذا الضبط لا يدلّ على عدم بلوغ سنّ الرشد؛ معانيه في المعاجم: البناء الفخم، خلاف المدّ، الحبس، العَشِيّ. الصيغة الصحيحة هي القُصُور (مصدر قَصَرَ عن الشيء قُصُوراً = عَجَزَ)، وقد أُضيفت مرشّحةً من المرحلة الأولى."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قُصُور"
      source: stage1
      decision: confirmed
      decision_reason: "القُصُور مصدر قَصَرَ عن الشيء بمعنى العجز وعدم بلوغ المدى. ثابت في المورد الحديث مقابلاً لـ minority بمعنى سنّ ما قبل الرشد، وفي المعجم الموحد لمصطلحات القانون (قاصر = من لم يبلغ سنّ الرشد)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يركّز على البُعد القانوني: عدم بلوغ سنّ الرشد، أي العجز عن التصرّف المستقل شرعاً وقانوناً"
      actions:
        - command: create_entry
          params:
            lemma: "قُصُور"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "حَدَاثَة"
      source: stage1
      decision: confirmed
      decision_reason: "الحَداثة ثابتة في المعجم الوسيط والمعجم الكبير بمعنى سنّ الشباب وحداثة السنّ، والمورد الحديث يوردها مقابلاً لـ minority في السياق القانوني."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تؤكّد الجانب الزمني: كون المرء في أوّل عمره وبداية سنّه، وتُستعمل كناية عن الشباب"
      actions:
        - command: create_entry
          params:
            lemma: "حَدَاثَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "صِبَا"
      source: stage1
      decision: removed
      decision_reason: "الصِّبا يدلّ على مرحلة الطفولة البيولوجية (من لم يبلغ الحُلُم) لا على الحالة القانونية. وهو يتداخل دلالياً مع الصِّغَر دون إضافة بُعد قانوني، فضلاً عن اشتراكه اللفظي مع الصَّبا (الريح)."

