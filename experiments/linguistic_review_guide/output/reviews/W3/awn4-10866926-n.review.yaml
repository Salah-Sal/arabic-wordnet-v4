# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان هما تعريبان لاسم علم شخص تاريخي محدد؛ مما يجعل التوليد العمياء ذا طبيعة تعريبية بحتة، لا اشتقاقية ولا مجازية."
      - "التعريف الحالي يستخدم «معماري» مفردًا استعمالًا اسميًا قد يوهم بأنها صفة؛ والمصطلح التقني الثابت في المعاجم العربية هو «مهندس معماري»."
      - "اللمّتان خاليتان من التشكيل الكامل المطلوب."
    observations: "المجموعة تُمثّل شخصًا تاريخيًا بعينه هو المعماري الهولندي هِنْدِرِيك بِيتْرُوس بِيرْلاخِه (1856-1934)، الرائد في العمارة الرشيدة الأوروبية وصاحب بورصة أمستردام الشهيرة. اللمّتان تمثّلان الصيغة المختصرة (اللقب فقط) والصيغة الكاملة (الاسم الأول والأوسط واللقب). الهيكل الدلالي سليم والتسلسل الهرمي وجيه، غير أن التعريف يستحق ضبطًا مصطلحيًا وتشكيلًا."

  blind_candidates:
    - lemma: "بِيرْلاخِه"
      generation_method: taarib
      justification: "تعريب الاسم الهولندي «Berlage» مع مراعاة أن «g» الهولندية تُنطق نطقًا حلقيًا قريبًا من «خ»، فيُكتب «خ» في التعريب العربي المعتمد."
    - lemma: "بِيرْلاج"
      generation_method: taarib
      justification: "تعريب بديل لـ«Berlage» بتحويل «ge» إلى «ج» على النمط الفرنسي-الإنجليزي المعرَّب، وهو احتمال وارد في غياب الاسم."
    - lemma: "هِنْدِرِيك بِيتْرُوس بِيرْلاخِه"
      generation_method: taarib
      justification: "تعريب الاسم الكامل «Hendrik Petrus Berlage» بصيغة مركبة إضافية من ثلاثة مقاطع اسمية: الاسم الأول والأوسط واللقب."
    - lemma: "بِرْلاخِه"
      generation_method: taarib
      justification: "تعريب مختزل بحذف المد الأول «بِي-» إلى «بِ-»، احتمال ضعيف لكنه يُعبّر عن الصوتيات الشائعة في التعريبات المختزلة."


