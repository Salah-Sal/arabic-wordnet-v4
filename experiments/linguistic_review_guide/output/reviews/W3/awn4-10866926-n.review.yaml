# ── المرحلة ٣: التحليل اللغوي للمّات ───────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──────────────────────────────────────
    - lemma: "بيرلاخه"
      decision: confirmed
      decision_reason: "الصيغة المختصرة للاسم (اللقب فقط) هي الأشيع في الكتابات العربية المعاصرة عند الإحالة على هذا المعماري. لا دليل معجمي مباشر (متوقع لاسم علم غربي)، لكن الصيغة الصواتية صحيحة إذ تعكس النطق الهولندي الأصلي. تحتاج تشكيلًا."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "صيغة مختصرة تقتصر على اللقب العائلي؛ تُستخدم في الإحالات الموجزة والسياقات العلمية غير الرسمية."
      morphological_check:
        pos_fit: "اسم علم محدد (proper noun)، مقبول كـ n في AWN4 اتباعًا لتقليد WordNet."
        transliteration_accuracy: "«Ber-» → «بِيرْ» (صحيح)، «-la-» → «لا» (صحيح)، «-ge» → «خِه» يعكس الصوت الهولندي الحلقي الصحيح."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بِيرْلاخِه"

    - lemma: "هندريك بيتروس بيرلاخه"
      decision: confirmed
      decision_reason: "الاسم الكامل الرسمي للمعماري، ضروري في المصادر الأكاديمية والموسوعية لتمييزه عن أفراد آخرين يحملون اللقب ذاته. التعريب الفونولوجي صحيح. يحتاج تشكيلًا كاملًا."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل الرسمي (الاسم الأول + الأوسط + اللقب)؛ يُستخدم عند التعريف الأول بالشخص وفي الفهارس الأكاديمية والمراجع الموسوعية."
      morphological_check:
        components:
          - "هِنْدِرِيك ← «Hendrik» (اسم أول هولندي، نطقه: هِنْ-دِرِيك)"
          - "بِيتْرُوس ← «Petrus» (اسم أوسط لاتيني-هولندي)"
          - "بِيرْلاخِه ← «Berlage» (اللقب)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "هِنْدِرِيك بِيتْرُوس بِيرْلاخِه"

    # ── مرشحات المرحلة ١ ─────────────────────────────────────
    - lemma: "بِيرْلاخِه"
      source: stage1
      decision: removed
      decision_reason: "يُطابق اللمّة الموجودة «بيرلاخه» بعد التشكيل؛ لا حاجة لإدخال مكرر."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "بِيرْلاج"
      source: stage1
      decision: removed
      decision_reason: "الحرف «g» الهولندي في «Berlage» ينطق نطقًا حلقيًا مجهورًا ([ɣ]) لا (ج)؛ تعريبه بـ«خ» (بيرلاخه) أدق صوتيًا وأثبت في المكتبة العربية. «بيرلاج» يوهم بنطق جيمي بعيد عن الأصل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "هِنْدِرِيك بِيتْرُوس بِيرْلاخِه"
      source: stage1
      decision: removed
      decision_reason: "يُطابق اللمّة الموجودة «هندريك بيتروس بيرلاخه» بعد التشكيل؛ تمّت معالجته ضمن اللمّة الأصلية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "بِرْلاخِه"
      source: stage1
      decision: removed
      decision_reason: "إسقاط حركة الإطالة في «Ber-» (بِيرْ) يُنتج صيغة مشوّهة صوتيًا لا تعكس النطق الهولندي الأصلي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


