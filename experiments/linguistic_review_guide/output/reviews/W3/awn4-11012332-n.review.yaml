# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-11012332-n | ILI: i95220
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "صنف الكلمة (POS) مسجَّل كـ n (اسم عام)، غير أن المجموعة خاصة بعلَم على شخص بعينه؛ ينبغي أن تحمل المداخل الصنف proper_noun"
      - "اللمّتان الموجودتان (غاودي / أنطونيو غاودي) تفتقران إلى التشكيل الكامل"
      - "عبارة 'فن العمارة الحديثة' في التعريف قد تُوهم بحركة الحداثة المعمارية (Modernism)، لا بحركة الفن الجديد (Art Nouveau) المقصودة"
      - "غياب النقحرة الكاملة للاسم الكتالاني (أنتوني غاودي كورنيت) رغم وجود مقابلاتها في اللمّات الإنجليزية"
    observations: >
      هذه المجموعة من نوع الأعلام (instance synset)، تخص المهندس المعماري أنطونيو غاودي
      (1852-1926) رائد حركة الفن الجديد في أوروبا. كونُه شخصاً تاريخياً بعينه لا مفهوماً
      عاماً يجعل اللمّات العربية نقحراتٍ من الإسبانية أو الكتالانية، وهو الأسلوب الوحيد
      الممكن لأسماء الأعلام الأجنبية. الاسم الشائع في العربية هو "غاودي" أو "أنطونيو غاودي"،
      وتُثبت مصادر ARABTERM أن المصطلح القياسي لـ Art Nouveau هو "الفن الجديد" لا "فن
      العمارة الحديثة". المجموعة تحتاج إلى تصحيح POS على مستوى المداخل، وتشكيل اللمّات،
      وتحرير التعريف.

  blind_candidates:
    - lemma: "غَاودِي"
      generation_method: taarib
      justification: "نقحرة مباشرة للاسم الأجنبي Gaudí؛ الصيغة المختصرة الشائعة في المصادر العربية للإشارة إلى المهندس المعماري الإسباني المولود عام 1852 والمتوفى عام 1926"
    - lemma: "أَنطُونيُو غَاودِي"
      generation_method: taarib
      justification: "نقحرة الاسم الكامل بصيغته الإسبانية Antonio Gaudí؛ تُستخدم في السياقات الأكاديمية والرسمية عند الحاجة إلى ذكر الاسم كاملاً"
    - lemma: "أَنتُونِي غَاودِي كُورنِيت"
      generation_method: taarib
      justification: "نقحرة الاسم الكتالاني الرسمي الكامل Antoni Gaudí i Cornet؛ غاودي كتالاني الأصل وهذا اسمه الرسمي في ثقافته الأم، وحرف 'i' الكتالاني معناه 'و' (صلة)"
    - lemma: "غَاودِي كُورنِيت"
      generation_method: taarib
      justification: "نقحرة الصيغة المختصرة لاسم العائلة الكتالاني Gaudi i Cornet؛ توافق اللمّة الإنجليزية الثالثة في AWN (Gaudi i Cornet) وتتيح تغطية أوسع في البحث والاسترجاع"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   ١. مطابقة دقيقة دفعية للمّات الموجودة + مرشحات المرحلة ١ → لا نتائج
#   ٢. جسر إنجليزي: Gaudi, Antonio Gaudi, Gaudi i Cornet, art nouveau
#      → نتيجة واحدة: "فن (ال…) الجديد" = art nouveau (ARABTERM 394957)
#   ٣. FTS عربي: معماري، غاودي، فن الجديد → لا مداخل ذات صلة بالشخص
stage2_evidence:
  per_lemma:
    - lemma: "أنطونيو غاودي"
      evidence_status: "no_material_found"
    - lemma: "غاودي"
      evidence_status: "no_material_found"
    - lemma: "أَنتُونِي غَاودِي كُورنِيت"
      evidence_status: "no_material_found"
    - lemma: "غَاودِي كُورنِيت"
      evidence_status: "no_material_found"
  # ملاحظة: ARABTERM يثبت "الفن الجديد" كمقابل قياسي لـ art nouveau
  # (entry_id 394957، المعجم الموحد لمصطلحات التقنيات التربوية 1999)
  # هذا يدعم تصحيح التعريف في المرحلة ٤ لكنه لا يتعلق بأيٍّ من اللمّات مباشرةً.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "أنطونيو غاودي"
      decision: confirmed
      decision_reason: >
        نقحرة صحيحة ومستقرة للاسم الإسباني الكامل Antonio Gaudí؛ شائعة في المصادر
        العربية الأكاديمية والإعلامية، وتوافق اللمّات الإنجليزية "Antonio Gaudi" و"Antonio
        Gaudi i Cornet". لا يوجد تعارض. تحتاج إلى إضافة التشكيل الكامل وتصحيح POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل بالصيغة الإسبانية؛ يُستخدم في السياقات الأكاديمية والرسمية وفي
        أول إشارة إلى الشخص في النص. يوازي في الإنجليزية "Antonio Gaudi".
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَنطُونيُو غَاودِي"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    - lemma: "غاودي"
      decision: confirmed
      decision_reason: >
        الاسم المختصر (الشُّهرة) الشائع استخداماً في العربية؛ يُستخدم منفرداً بعد أول
        تعريف بالشخص. يوافق اللمّة الإنجليزية "Gaudi". لا تعارض. تحتاج إلى تشكيل
        وتصحيح POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم المختصر (الكنية/الشُّهرة) دون الاسم الأول؛ يُستخدم في الاستخدام العام
        والإعلامي وعند تكرار ذكر الشخص في النص. يوازي "Gaudi" في الإنجليزية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَاودِي"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    - lemma: "أَنتُونِي غَاودِي كُورنِيت"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة الاسم الكتالاني الكامل نادرة جداً في المصادر العربية؛ اللمّة الإنجليزية
        المقابلة (Gaudi i Cornet / Antonio Gaudi i Cornet) نادرة الاستخدام خارج
        السياق الأكاديمي المتخصص. الصيغتان الموجودتان (غاودي / أنطونيو غاودي)
        تكفيان للتغطية اللازمة، ولا يوجد دليل معجمي عربي يسند إضافتها.

    - lemma: "غَاودِي كُورنِيت"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة هجينة تجمع الاسم الإسباني مع اللقب الكتالاني؛ غير موثقة في المصادر
        العربية المتاحة ولا تُشكّل وحدة معجمية ثابتة. إضافتها لن تزيد التغطية
        الاسترجاعية بصورة ذات قيمة.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معماري إسباني كان رائداً في فن العمارة الحديثة (الفن الجديد) في أوروبا (1852-1926)"
    assessment:
      decision: revise
      reason: >
        عبارة "فن العمارة الحديثة" مضللة؛ إذ يدل التعبير اصطلاحياً على حركة الحداثة
        المعمارية (Modernism) لا على حركة الفن الجديد (Art Nouveau). تثبت بيانات ARABTERM
        أن الترجمة القياسية لـ art nouveau هي "الفن الجديد" مطلقاً لا "فن العمارة الحديثة".
        يجب إزالة اللبس وتدقيق الحركة المقصودة.
    authored:
      - type: encyclopedic
        text: "مهندس معماري إسباني (1852-1926)، من أبرز رواد حركة الفن الجديد في أوروبا، اشتُهر بأسلوبه المعماري القائم على الأشكال العضوية والزخارف الطبيعية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مهندس معماري إسباني (1852-1926)، من أبرز رواد حركة الفن الجديد في أوروبا، اشتُهر بأسلوبه المعماري القائم على الأشكال العضوية والزخارف الطبيعية"

  examples:
    per_lemma:
      - lemma: "أَنطُونيُو غَاودِي"
        examples:
          - text: "صمَّم أَنطُونيُو غَاودِي كاتدرائية العائلة المقدسة في برشلونة التي باتت أيقونةً للعمارة الأوروبية في مطلع القرن العشرين."
            type: usage
      - lemma: "غَاودِي"
        examples:
          - text: "تُعدّ أعمال غَاودِي المعمارية في برشلونة من أبرز تجليات حركة الفن الجديد وأكثرها حضوراً في الوعي الثقافي العالمي."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "صمَّم أَنطُونيُو غَاودِي كاتدرائية العائلة المقدسة في برشلونة التي باتت أيقونةً للعمارة الأوروبية في مطلع القرن العشرين."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "تُعدّ أعمال غَاودِي المعمارية في برشلونة من أبرز تجليات حركة الفن الجديد وأكثرها حضوراً في الوعي الثقافي العالمي."


