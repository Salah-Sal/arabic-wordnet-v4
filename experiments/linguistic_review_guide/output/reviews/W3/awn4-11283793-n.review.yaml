      - lemma: "جيرُوم رُوبِنْز"
        examples:
          - text: >
              صَمَّمَ جيرُوم رُوبِنْز رَقَصَاتِ مَسرَحِيَّةِ «قِصَّةِ الجَانِبِ الغَربِيِّ»
              الَّتِي غَدَت مِن أَيقُوناتِ المَسرَحِ الغِنَائِيِّ الأَمرِيكِيِّ.
            type: usage
      - lemma: "رُوبِنْز"
        examples:
          - text: >
              يُعَدُّ رُوبِنْز مِن أَبرَزِ مُصَمِّمِي الرَّقَصَاتِ الَّذِينَ جَمَعُوا
              بَينَ عَالَمِ البَالِيهِ الكَلَاسِيكِيِّ وَحَيَوِيَّةِ المَسرَحِ الغِنَائِيِّ
              فِي القَرنِ العِشرِين.
            type: usage
