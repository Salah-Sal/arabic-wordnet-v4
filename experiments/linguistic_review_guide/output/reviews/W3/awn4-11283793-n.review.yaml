# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11283793-n  |  ILI: i96719
# Jerome Robbins — مُصَمِّم رَقَصَات أَمرِيكِيّ (1918-1998)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين الموجودتين (جيروم روبنز / روبنز) تفتقران إلى التشكيل الكامل"
      - "هذه مجموعة ترادفية لعَلَم شخصي (instance synset)؛ جميع لمّاتها تعريبات صوتية لاسم أجنبي، ولا تحتمل الاشتقاق ولا المجاز"
      - "لم يُعثَر على أي مدخل للاسم في قاعدة البيانات المعجمية (760,660 مدخل) مما يعني غياب الإثبات المعجمي"
      - "التعريف العربي الحالي فيه اضطراب في البنية التوازية: (أدخل ... والواقعية المفعمة بالحيوية إلى ...) تركيب قلق"
    observations: >
      المجموعة تُمثِّل شخصاً بعينه هو المُصمِّم الكوريغرافي الأمريكي جيروم روبنز (1918-1998)،
      الذي يُعرَّف من خلال عمله في تصميم رقصات الباليه الكلاسيكي ومسرحيات برودواي الغنائية.
      هذا النوع من المجموعات لا يستلزم توليد مصطلحات مشتقة، بل يقتصر دور المراجعة على:
      (أ) التحقق من دقة التعريب الصوتي للاسم الأجنبي،
      (ب) اختيار الصيغ المعيارية المتداولة في المصادر العربية المرجعية،
      (ج) تشكيل اللمّات توثيقاً وضبطاً للنطق.
      تجدر الإشارة إلى أن مرحلة التوليد العمياء تُطبَّق هنا بصورة اصطلاحية؛ إذ لا يُمكن للتعريف وحده
      أن يُفضي إلى اسم علم—بل يُشير فحسب إلى شخصية بارزة من التاريخ الفني الأمريكي.
  blind_candidates:
    - lemma: "جيرُوم رُوبِنْز"
      generation_method: taarib
      justification: >
        الاسم الكامل للكوريغرافي الأمريكي الموصوف في التعريف (الباليه + برودواي + 1918-1998)،
        وفق التعريب الصوتي الشائع: Jerome → جيروم، Robbins → روبنز (ب مشددة → ب، نهاية nz → نز).
        هذا الشكل المزدوج (الاسم + اللقب) هو الشكل الموسوعي المعياري.
    - lemma: "رُوبِنْز"
      generation_method: taarib
      justification: >
        اللقب العائلي منفرداً، يُستخدم في السياقات التي سبق فيها ذكر الاسم الكامل أو في الفهارس
        والمراجع المختصرة. صياغة أحادية بدون مركّب.
    - lemma: "جيرُوم رُوبِينْز"
      generation_method: taarib
      justification: >
        بديل تعريبي يُدرج ياءً مديّة في "روبينز" تعكس النطق الإنجليزي [rɒbɪnz] بصورة أوضح؛
        تتداوله بعض المصادر العربية والترجمات الأدبية.
    - lemma: "جيرُوم رُوبِنْس"
      generation_method: taarib
      justification: >
        بديل تعريبي يُحوِّل الحرف الأخير z إلى سين (s)، وهو خيار تعريبي مقبول في بعض
        المعاجم الثنائية وقواميس الأعلام العربية عند تعريب الأسماء المنتهية بصوت مهموس.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:
  queries_summary:
    - "استعلام ١ (مطابقة دفعية): headword_norm IN (جيروم روبنز، الجيروم روبنز، روبنز، الروبنز، جيروم، الجيروم) → 0 نتائج"
    - "استعلام ٢ (جسر إنجليزي): translation_en MATCH 'Robbins OR Jerome Robbins OR choreographer OR ballet' → وُجدت مداخل للباليه ولـ choreographer (مُصَمِّم الرَّقَصَات) في المورد الحديث، لا مداخل للاسم الشخصي"
    - "استعلام ٣ (تحقق المرشحات): headword_norm IN (جيروم روبينز، روبينز، روبنس، جيروم روبنس) → 0 نتائج"
    - "استعلام ٤ (FTS عربي): entries_fts MATCH 'مصمم رقصات OR باليه OR برودواي OR كوريغراف' → مداخل تتعلق بالباليه والفنون الأدائية، لا شيء عن الاسم الشخصي"
  per_lemma:
    - lemma: "جيروم روبنز"
      evidence_status: "no_material_found"
    - lemma: "روبنز"
      evidence_status: "no_material_found"
    - lemma: "جيروم روبينز"
      source: stage1
      evidence_status: "no_material_found"
    - lemma: "جيروم روبنس"
      source: stage1
      evidence_status: "no_material_found"
  contextual_evidence:
    - text: "«مُصَمِّم الرَّقَصات.»"
      source: "المورد الحديث (2008)"
      relevance: "يُثبت أن المقابل العربي لـ choreographer هو مُصَمِّم الرَّقَصَات، وهو ما يتوافق مع تعريف المجموعة والمصطلح المستخدم فيها"
    - text: "«باليه: رقص كلاسيكي»"
      source: "مسرد الفن، التسلية والرياضة — ALECSO"
      relevance: "يؤكد أن كلمة 'باليه' (ballet) معرَّبة ومستخدمة في المعاجم العربية المتخصصة"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: الاسم الكامل ──
    - lemma: "جيروم روبنز"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخصية الموصوفة بصيغة تعريبها الأكثر انتشاراً في المصادر العربية؛
        يجمع الاسم الأول (جيروم) واللقب (روبنز) في وحدة مرجعية متكاملة تُعين الشخصية
        من أول وهلة. لا يُوجَد بديل عربي إذ يتعلق الأمر بعَلَم شخصي أجنبي.
      evidence_assessment:
        case: no_material
      morphological_check:
        type: proper_noun_transliteration
        source_language: en
        phonological_fidelity: >
          جيروم ← Jerome [dʒɪˈroʊm]: جيم + ياء + راء + واو + ميم — دقيق.
          روبنز ← Robbins [ˈrɒbɪnz]: راء + واو + باء + نون + زاي — دقيق؛
          الباء الإنجليزية المضاعفة (bb) تُمثَّل بباء عربية مفردة وفق القاعدة المقبولة.
      mwe_check:
        is_mwe: true
        mwe_type: idafi
        fixedness: >
          التعريب ثابت غير قابل للتجزئة في السياق المعجمي؛ لا يمكن إبدال أي مكوّن بمرادف
          دون فقدان الإحالة إلى الشخصية. يجتاز اختبار السكّ.
      nuance_differentiation: >
        صيغة الاسم الكامل (الأول + العائلي) — تُستخدم في المقدمة الأولى لذكر الشخصية،
        وفي المراجع الموسوعية، والمحتوى التعريفي، والفهارس الأكاديمية الرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جيرُوم رُوبِنْز"

    # ── لمّة موجودة: اللقب منفرداً ──
    - lemma: "روبنز"
      decision: confirmed
      decision_reason: >
        اللقب العائلي منفرداً شكلٌ مشروع ومعتاد في الاستخدام المعجمي والموسوعي العربي
        بعد أن تُعرَّف الشخصية بالاسم الكامل. التمييز بين الصيغتين ضروري في المجموعات
        الترادفية للأعلام.
      evidence_assessment:
        case: no_material
      morphological_check:
        type: proper_noun_transliteration
        source_language: en
        phonological_fidelity: >
          روبنز ← Robbins [ˈrɒbɪnz]: تعريب صوتي دقيق بحذف حرف العلة القصير i الداخلي
          وفق المألوف في تعريب الأسماء ذات التجمعات الصوتية (consonant clusters).
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        صيغة اللقب العائلي المختصر — تُستخدم في النصوص الأدبية والأكاديمية بعد ذكر
        الاسم الكامل مرة أولى، وفي قوائم الفهرسة حين يكون التسلسل الهجائي يقتضي
        الترتيب بحسب اللقب، وفي الاقتباسات الموجزة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رُوبِنْز"

    # ── مرشح المرحلة ١: بديل بياء مديّة ──
    - lemma: "جيروم روبينز"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة ثانوية غير معيارية — الشكل "روبنز" (بدون ياء مديّة داخلية) أرسخ استخداماً
        في المصادر العربية المعاصرة. إدراج الياء يُحدث تضخيماً صوتياً لا يُقابله الأصل
        الإنجليزي [ˈrɒbɪnz] الذي يحمل صوت /ɪ/ قصيراً لا مديّاً. إبقاؤها يُفضي إلى
        التباس وتشتيت دون مكسب نطقي.

    # ── مرشح المرحلة ١: بديل بسين نهائية ──
    - lemma: "جيروم روبنس"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب بالسين (s) بدلاً من الزاي (z) — ضعيف صوتياً لأن نهاية Robbins تُنطَق
        [z] مجهورة لا [s] مهموسة في سياق الجمع الصوتي (voiced assimilation). الزاي
        في "روبنز" أدق تمثيلاً صوتياً وأكثر شيوعاً في مصادر التعريب العربي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مصمم رقصات أمريكي أدخل العاطفة الإنسانية إلى الباليه الكلاسيكي والواقعية المفعمة بالحيوية إلى مسرحيات برودواي الموسيقية (1918-1998)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يحمل معلومات صحيحة لكنه يعاني من قلق في البنية التوازية:
        "أدخل X إلى Y والواقعية المفعمة بالحيوية إلى W" — الواو العاطفة هنا تربط
        بين عنصرين غير متوازيين نحوياً (مفعول به واصطلاح وصفي مركب).
        كذلك "المفعمة بالحيوية" صياغة ثقيلة تصلح للنثر التوصيفي لا للتعريف المعجمي.
        يُستحسن إعادة الصياغة لتحقيق الوضوح والتوازي مع الحفاظ على المضمون.
    authored:
      - type: encyclopedic
        text: >
          مُصَمِّمُ رَقَصَاتٍ أَمرِيكِيٌّ (1918-1998)؛ اشتُهِرَ بِإِدخَالِ
          التَّعبِيرِ الوِجدَانِيِّ الإِنسَانِيِّ إِلى فَنِّ البَالِيهِ الكَلَاسِيكِيِّ،
          وَبِإِضفَائِهِ الحَيَوِيَّةَ وَالوَاقِعِيَّةَ عَلى مَسرَحِيَّاتِ بُرودوَاي الغِنَائِيَّة.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11283793-n"
          definition_index: 0
          text: >
            مُصَمِّمُ رَقَصَاتٍ أَمرِيكِيٌّ (1918-1998)؛ اشتُهِرَ بِإِدخَالِ
            التَّعبِيرِ الوِجدَانِيِّ الإِنسَانِيِّ إِلى فَنِّ البَالِيهِ الكَلَاسِيكِيِّ،
            وَبِإِضفَائِهِ الحَيَوِيَّةَ وَالوَاقِعِيَّةَ عَلى مَسرَحِيَّاتِ بُرودوَاي الغِنَائِيَّة.

  examples:
