stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي دائري (يعرف التعقيد بالتعقيد)."
      - "الترجمة قد تتداخل مع المعنى الطبي لمصطلح complication (مضاعفة)، إلا أن العلاقة الاشتمالية (الإعاقة والعرقلة) تؤكد أن المعنى المقصود هو جعل الشيء معقداً."
    observations: "تَعْقِيد هو المصدر القياسي من الفعل عَقَّدَ، ويعبر بدقة عن عملية جعل الشيء مركباً أو صعباً."
  blind_candidates:
    - lemma: "تَعْقِيد"
      generation_method: ishtiqaq
      justification: "مصدر قياسي للفعل المضعف 'عقّد' الدال على المبالغة في إحداث العُقَد والتشابك."
    - lemma: "إِعْضَال"
      generation_method: ishtiqaq
      justification: "مصدر الفعل 'أعضل' بمعنى اشتد وصعب حله."
    - lemma: "تَشْبِيك"
      generation_method: ishtiqaq
      justification: "مصدر الفعل 'شبّك' ويعبر عن التداخل الذي قد يؤدي إلى الصعوبة."
    - lemma: "تَشَعُّب"
      generation_method: ishtiqaq
      justification: "مصدر يدل على التفرع الذي قد يسبب صعوبة في الإحاطة بالشيء."

stage2_evidence:
  per_lemma:
    - lemma: "تَعْقِيد"
      confirm:
        - text: "التعقيدُ: أَلا يكون الْكَلَام ظَاهر الدّلَالَة على المُرَاد لخلل."
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "التعقيد: كون الكلام مغلقا لا يظهر معناه بسهولة."
          source: "كتاب التعريفات للشريف الجرجاني"
      expands:
        - text: "التّعقيد:[في الانكليزية] Complication [ في الفرنسية] Complication كالتصريف عند أهل البيان كون الكلام غير ظاهر الدلالة على المراد لخلل إما في النظم وإما في الانتقال"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
    - lemma: "إِعْضَال"
      evidence_status: "no_material_found"
    - lemma: "تَشْبِيك"
      expands:
        - text: "التشبيك: بين الأصابع أي إدخالُ بعضِها في بعض وخلطها بها."
          source: "التعريفات الفقهيّة للبركتي"
    - lemma: "تَشَعُّب"
      expands:
        - text: "(تشعب) انْتَشَر وتفرق وَالزَّرْع وَنَحْوه صَار ذَا شعب"
          source: "المعجم الوسيط لمجموعة من المؤلفين"

stage3_analysis:
  per_lemma:
    - lemma: "تعقيد"
      decision: confirmed
      decision_reason: "المصطلح القياسي والمطابق تماماً لمفهوم إحداث العرقلة والصعوبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَعْقِيد"

stage4_content:
  definition:
    current: "فعل أو عملية التعقيد"
    assessment:
      decision: revise
      reason: "تجنب التعريف الدائري وإيضاح المعنى المقصود في سياق العرقلة والصعوبة."
    authored:
      - type: terminological
        text: "جعلُ الشيء صعباً ومُتداخلاً بحيث تصعُبُ إدارته أو فهمه."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-01078283-n"
          definition_index: 0
          text: "جعلُ الشيء صعباً ومُتداخلاً بحيث تصعُبُ إدارته أو فهمه."
  examples:
    per_lemma:
      - lemma: "تَعْقِيد"
        examples:
          - text: "أدّى تَعْقِيد الإجراءات الإدارية إلى تذمّر المراجعين."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-01078283-n"
          text: "أدّى تَعْقِيد الإجراءات الإدارية إلى تذمّر المراجعين."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أدّى تَعْقِيد الإجراءات الإدارية إلى تذمّر المراجعين."

