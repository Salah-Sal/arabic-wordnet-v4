      entry_id: "{auto}"
      root: "عقد"
      maqayis_quote: "الْعَيْنُ وَالْقَافُ وَالدَّالُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى شَدٍّ وَشِدَّةِ وُثُوقٍ، وَإِلَيْهِ تَرْجِعُ فَرَوْعُ الْبَابِ كُلُّهَا."
  per_sense:
