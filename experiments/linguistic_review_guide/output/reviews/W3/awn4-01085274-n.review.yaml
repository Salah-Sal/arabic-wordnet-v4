stage1_review:
  assessment:
    concerns:
      - "غياب التشكيل عن اللمة الموجودة."
      - "اللمة عبارة عن تعبير مركب إضافي (مصطلح)، ويجب توثيقه كذلك."
    observations: "مصطلح 'إعادة التوزيع' أو 'إعادة توزيع' هو تركيب إضافي شائع ومستقر في اللغة العربية المعاصرة لترجمة المفهوم الإنجليزي 'redistribution'. يعبر عن تكرار عملية التوزيع."
  blind_candidates:
    - lemma: "إِعَادَةُ تَوْزِيعٍ"
      generation_method: tarkib
      justification: "تركيب إضافي يُعتمد بشكل مباشر في نقل معنى (redistribution) عبر إضافة المصدر 'إعادة' الدال على التكرار إلى المصدر 'توزيع'."
    - lemma: "تَوْزِيعٌ مُجَدَّدٌ"
      generation_method: tarkib
      justification: "تركيب وصفي يصف التوزيع بأنه جديد أو مكرر."
    - lemma: "إِعَادَةُ قِسْمَةٍ"
      generation_method: tarkib
      justification: "تركيب إضافي مرادف، يدل على تكرار تقسيم الشيء."
    - lemma: "تَقْسِيمٌ ثَانٍ"
      generation_method: tarkib
      justification: "تعبير يدل على إحداث تقسيم مرة أخرى."

stage2_evidence:
  per_lemma:
    - lemma: "إعادة توزيع"
      confirm:
        - text: "«redistribution»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"
        - text: "«income redistribution» (إعادة توزيع الدخل)"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
    - lemma: "إِعَادَةُ تَوْزِيعٍ"
      confirm:
        - text: "«redistribution»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم"
    - lemma: "تَوْزِيعٌ مُجَدَّدٌ"
      evidence_status: "no_material_found"
    - lemma: "إِعَادَةُ قِسْمَةٍ"
      evidence_status: "no_material_found"
    - lemma: "تَقْسِيمٌ ثَانٍ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "إعادة توزيع"
      decision: confirmed
      decision_reason: "مصطلح مركب إضافي شائع ومثبت في المعاجم المتخصصة المعاصرة لمقابلة المفهوم الإنجليزي. يحتاج إلى ضبط بالتشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِعَادَة تَوْزِيع"
    - lemma: "إِعَادَةُ تَوْزِيعٍ"
      source: stage1
      decision: removed
      decision_reason: "اللمة معالجة بالفعل ضمن اللمات الحالية للمجموعة."
    - lemma: "تَوْزِيعٌ مُجَدَّدٌ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي غير شائع كمصطلح مسكوك، والأفضل الاكتفاء بـ 'إعادة توزيع'."
    - lemma: "إِعَادَةُ قِسْمَةٍ"
      source: stage1
      decision: removed
      decision_reason: "غير شائع الاستعمال مقابل هذا المفهوم الدقيق، و'إعادة توزيع' أكثر ثباتاً واطراداً."
    - lemma: "تَقْسِيمٌ ثَانٍ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر وليس مصطلحاً معجمياً ثابتاً."

stage4_content:
  definition:
    current: "التوزيع مرة أخرى"
    assessment:
      decision: revise
      reason: "تعديل التعريف ليكون أكثر دقة ووضوحاً وصياغةً بأسلوب معجمي سليم، مع توفير التشكيل اللازم."
    authored:
      - type: terminological
        text: "عَمَلِيَّةُ تَوْزِيعِ الأَشْيَاءِ أَوِ الحِصَصِ مَرَّةً أُخْرَى."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "عَمَلِيَّةُ تَوْزِيعِ الأَشْيَاءِ أَوِ الحِصَصِ مَرَّةً أُخْرَى."
  examples:
    per_lemma:
      - lemma: "إعادة توزيع"
        examples:
          - text: "طَالَبَ العُمَّالُ بِإِعَادَةِ تَوْزِيعِ الثَّرْوَةِ لِتَحْقِيقِ العَدَالَةِ."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "طَالَبَ العُمَّالُ بِإِعَادَةِ تَوْزِيعِ الثَّرْوَةِ لِتَحْقِيقِ العَدَالَةِ."

stage5_enrichment:
  per_entry:
    - lemma: "إِعَادَة تَوْزِيع"
      entry_id: "{auto}"
      roots:
        - word: "إعادة"
          root: "عود"
          maqayis_quote: "«(عَوَدَ) الْعَيْنُ وَالْوَاوُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَثْنِيَةٍ فِي الْأَمْرِ... فَالْأَوَّلُ: الْعَوْدُ، قَالَ الْخَلِيلُ: هُوَ تَثْنِيَةُ الْأَمْرِ عَوْدًا بَعْدَ بَدْءٍ.»"
        - word: "توزيع"
          root: "وزع"
          maqayis_quote: "«(وَزَعَ) الْوَاوُ وَالزَّاءُ وَالْعَيْنُ: بِنَاءٌ مَوْضُوعٌ عَلَى غَيْرِ قِيَاسٍ. وَوَزَعْتُهُ عَنِ الْأَمْرِ: كَفَفْتُهُ... وَبِهَا أَوْزَاعٌ مِنَ النَّاسِ، أَيْ جَمَاعَاتٌ.»"
  per_sense:
    - lemma: "إِعَادَة تَوْزِيع"
      sense_id: "{auto}"
      nuance: "مصطلح يشير إلى تكرار التوزيع للمرة الثانية، ويستعمل بكثرة في السياقات الاقتصادية والإدارية."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"إعادة","root":"عود","maqayis":"«(عَوَدَ) الْعَيْنُ وَالْوَاوُ وَالدَّالُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى تَثْنِيَةٍ فِي الْأَمْرِ... فَالْأَوَّلُ: الْعَوْدُ، قَالَ الْخَلِيلُ: هُوَ تَثْنِيَةُ الْأَمْرِ عَوْدًا بَعْدَ بَدْءٍ.»"},{"word":"توزيع","root":"وزع","maqayis":"«(وَزَعَ) الْوَاوُ وَالزَّاءُ وَالْعَيْنُ: بِنَاءٌ مَوْضُوعٌ عَلَى غَيْرِ قِيَاسٍ. وَوَزَعْتُهُ عَنِ الْأَمْرِ: كَفَفْتُهُ... وَبِهَا أَوْزَاعٌ مِنَ النَّاسِ، أَيْ جَمَاعَاتٌ.»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"مصطلح يشير إلى تكرار التوزيع للمرة الثانية، ويستعمل بكثرة في السياقات الاقتصادية والإدارية.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95
