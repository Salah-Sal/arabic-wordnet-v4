# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11202815-n  |  ILI: i96267
# رِيجِينَالْد جُوزِيف مِيتْشِل — مهندس طيران إنجليزي (1895-1937)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # التقييم الأولي (بعد الاطلاع على الملف الكامل)
  assessment:
    concerns:
      - "اللمّتان الموجودتان (ريجينالد جوزيف ميتشل، ميتشل) خاليتان من التشكيل الكامل"
      - "الصنف النحوي مسجَّل كـ n (اسم) دون الإشارة إلى كون المدخلين اسمَي علَم (proper_noun)"
      - "التعريف العربي مقتضب جداً (مهنة + جنسية + تواريخ) ولا يُبيّن الإنجاز الذي اشتُهر به ميتشل"
      - "الشكل الإنجليزي المختصر R. J. Mitchell لا يقابله شكل عربي في اللمّات الحالية"
    observations: >
      هذه المجموعة تخصّ شخصاً بعينه (اسم علم) — رِيجِينَالْد جُوزِيف مِيتْشِل (1895-1937)،
      مهندس الطيران البريطاني الشهير بتصميم طائرة سوبرمارين سبيتفاير.
      في مجموعات الأسماء الأعلام الشخصية لا يُمكن تطبيق الاشتقاق أو المجاز؛
      إذ يقتصر المنهج المتاح على التعريب (النقل الصوتي). انعدام التشكيل في اللمّتين
      الموجودتين إشكاليةٌ قائمة. وتأريخ الوفاة المبكرة (42 عاماً) وتواريخ الميلاد
      والوفاة الدقيقة (1895-1937) كافيان لتحديد هوية هذا المهندس بدقة لمن يمتلك
      خلفية في تاريخ الطيران العسكري.

  # المرشحون العُميان (استُنبطوا من الملف المُقنَّع دون الاطلاع على اللمّات)
  blind_candidates:
    - lemma: "رِيجِينَالْد جُوزِيف مِيتْشِل"
      generation_method: taarib
      justification: >
        نقل صوتي للاسم الإنجليزي الكامل Reginald Joseph Mitchell؛ يمكن التعرف على
        هذا المهندس من تواريخ ميلاده ووفاته (1895-1937) إذ إنها تنفرد تقريباً بمهندس
        طيران إنجليزي واحد، هو مصمم سبيتفاير. الصيغة الكاملة لازمة في السياقات الموسوعية.

    - lemma: "مِيتْشِل"
      generation_method: taarib
      justification: >
        اللقب المختصر وحده، شائع في الكتابة الأكاديمية والتاريخية العربية للإحالة
        إلى الشخصية في سياق معروف. يقابل الشكل الإنجليزي Mitchell المختصر.

    - lemma: "رِيجِينَالْد مِيتْشِل"
      generation_method: taarib
      justification: >
        نقل صوتي باسم الشُّهرة (الاسم الأول + اللقب) دون الاسم الأوسط، وهو شكل
        متداول في بعض المراجع العربية كبديل للاسم الكامل.

    - lemma: "مِيتْشِيل"
      generation_method: taarib
      justification: >
        نقل صوتي بديل للقب Mitchell مع إضافة ياء مدّية (مِيتْشِيل) كما يرد أحياناً
        في المعاجم الطبية العربية لأسماء مشابهة. مطروح للمقارنة والتمييز.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
stage2_evidence:

  # ملاحظة منهجية: قاعدة البيانات المعجمية تحتوي على مداخل لغوية لا سِيَر أعلام،
  # لذا لم يُتوقَّع وجود مدخل مباشر للاسمين الموجودين أو المرشحات.

  queries_run:
    - "Q1 — Batch headword: headword_norm IN ('ريجينالد جوزيف ميتشل','ميتشل','ريجينالد','ميتشيل')"
    - "Q2 — English bridge: translation_en MATCH 'Mitchell OR R. J. Mitchell OR Reginald Mitchell'"
    - "Q3 — Arabic FTS: MATCH '\"مهندس طيران\" OR \"سبيتفاير\" OR \"طائرة حربية\"'"
    - "Q4 — Candidate validation: headword_norm IN ('ريجينالد ميتشل','جوزيف',...)"

  per_lemma:

    - lemma: "ريجينالد جوزيف ميتشل"
      evidence_status: "no_material_found"

    - lemma: "ميتشل"
      expands:
        - text: "«داءُ ميتشيل (احْمِرارُ الأَطْرافِ المُؤْلِم)» — Mitchell's disease (erythromelalgia)"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            يُشير المعجم إلى استخدام صيغة (ميتشيل) بالياء لنسبة الداء إلى سيلاس وير ميتشل
            (طبيب أمريكي 1829-1914)؛ وهو شخص مختلف كلياً عن مهندس الطيران المعنيّ هنا.
            الأدلة لا تؤيد ولا تنفي استخدام (ميتشل) بدلالة مهندس الطيران.
        - text: "«مُعالَجَةُ ميتشل (بالراحة)» — Mitchell treatment"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            دليل آخر على استخدام اللقب Mitchell في التراكيب الطبية العربية نسبةً إلى
            الطبيب سيلاس ميتشل لا إلى مهندس الطيران. يُثبت تداول اللقب في المعجمية
            العربية لكن في تخصص مختلف وبصيغة مختلفة.

    - lemma: "رِيجِينَالْد مِيتْشِل"
      evidence_status: "no_material_found"

    - lemma: "مِيتْشِيل"
      expands:
        - text: "«داءُ ميتشيل (احْمِرارُ الأَطْرافِ المُؤْلِم)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: >
            الشكل بالياء (ميتشيل) موثَّق في قاموس طبي، لكن يُحيل إلى شخصية مختلفة؛
            مما يجعل اعتماده لمّةً في هذه المجموعة مُوجِباً للَّبس.

    - lemma: "رِيجِينَالْد جُوزِيف مِيتْشِل"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:

  per_lemma:

    # ───── لمّة موجودة ١ ─────
    - lemma: "ريجينالد جوزيف ميتشل"
      decision: confirmed
      decision_reason: >
        هو الاسم الكامل الصحيح لمهندس الطيران البريطاني (1895-1937)؛ لمّة جوهرية
        لا غنى عنها في المجموعة وتمثّل الهوية الرسمية الكاملة للشخص.
        يُصحَّح بإضافة التشكيل الكامل. كما ينبغي تصحيح صنفه النحوي
        من n إلى proper_noun على مستوى المدخل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرسمي الكامل المكوَّن من ثلاثة مقاطع (اسم + اسم أوسط + لقب)؛ يُستخدم
        في الموسوعات والمراجع الأكاديمية وفي السياقات التي تستوجب تمييز الشخص عمَّن
        يشاركونه اللقب أو الاسم الأول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رِيجِينَالْد جُوزِيف مِيتْشِل"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "ر. ج. مِيتْشِل"

    # ───── لمّة موجودة ٢ ─────
    - lemma: "ميتشل"
      decision: confirmed
      decision_reason: >
        اللقب المختصر الشائع في النصوص الأكاديمية والتاريخية العربية؛ مشروع معجمياً
        لكونه الشكل المتداول في سياقات الإحالة المختصرة. يُصحَّح بإضافة التشكيل،
        ويُصنَّف proper_noun على مستوى المدخل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المختصر المستخدم عند الإحالة ضمن سياق معروف للقارئ؛ أقل رسميةً من
        الاسم الكامل ويُلجأ إليه في الكتابة المتخصصة والصحفية لتفادي التكرار.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيتْشِل"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ───── مرشح المرحلة ١ — أ ─────
    - lemma: "رِيجِينَالْد جُوزِيف مِيتْشِل"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق تماماً للمّة الأولى الموجودة (ريجينالد جوزيف ميتشل) بعد
        تشكيلها؛ الإجراء الصحيح هو تشكيل اللمّة القائمة لا إضافة مدخل جديد.

    # ───── مرشح المرحلة ١ — ب ─────
    - lemma: "رِيجِينَالْد مِيتْشِل"
      source: stage1
      decision: removed
      decision_reason: >
        الشكل المختصر (دون الاسم الأوسط جوزيف) لا يُضيف قيمة معجمية مستقلة؛ فهو
        مغطى جزئياً بالاسم الكامل الموجود، ولا يستقل عنه في المراجع العربية.
        إن دعت الحاجة، يُضاف كصيغة بديلة (add_form) لا مدخل مستقل.

    # ───── مرشح المرحلة ١ — ج ─────
    - lemma: "مِيتْشِيل"
      source: stage1
      decision: removed
      decision_reason: >
        الشكل بالياء (مِيتْشِيل) موثَّق في المعجمية العربية لكنه يُحيل إلى سيلاس
        وير ميتشل (طبيب أمريكي مختلف)؛ اعتماده هنا سيُوجب التباساً. يُفضَّل
        الإبقاء على الشكل الخالي من الياء (مِيتْشِل) المتوافق مع التعريب القياسي
        لاسم Reginald Mitchell في المصادر الهندسية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
