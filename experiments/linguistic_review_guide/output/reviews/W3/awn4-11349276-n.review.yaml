# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  # التوليد الأعمى — بُني على التعريف فقط قبل الاطلاع على اللمّات الموجودة
  blind_candidates:
    - lemma: "تالبوت"
      generation_method: taarib
      justification: >-
        الاسم الأجنبي "Talbot" يُعرَّب بالصوت إلى "تالبوت"،
        وهو اللقب العائلي المعتاد في المصادر العربية للإشارة إلى صاحب هذا الاختراع.
        لا مقابل اشتقاقي عربي لاسم عَلَم أجنبي.

    - lemma: "فوكس تالبوت"
      generation_method: taarib
      justification: >-
        الصيغة الثنائية "Fox Talbot" مركبة من لقبَي النسب (اسم الوسط واللقب)
        وهي أشهر صيغ الإسناد إليه في الكتابات العربية المتخصصة،
        وتُزيل الغموضَ الناجم عن انفراد اللقب "تالبوت".

    - lemma: "وِليام هِنري فوكس تالبوت"
      generation_method: taarib
      justification: >-
        الاسم الكامل للشخصية التاريخية (William Henry Fox Talbot)
        يُستخدم في الوثائق الأكاديمية والموسوعية ويُزيل اللبس تمامًا.
        غيابه عن اللمّات العربية في حين وجوده في اللمّات الإنجليزية ثغرةٌ ينبغي سدّها.

    - lemma: "وِليام تالبوت"
      generation_method: taarib
      justification: >-
        صيغة مختصرة تجمع الاسم الأول (William) واللقب (Talbot)؛
        تُستخدم أحيانًا في الأدبيات العربية لكنها أقل دقةً وأندر تداولًا
        من الصيغتَين السابقتَين.

  # التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تالبوت | فوكس تالبوت) تفتقران إلى التشكيل الكامل المنصوص عليه في معايير AWN4."
      - "لمّة 'تالبوت' منفردةً غامضة: تشترك لفظيًا مع 'التَّلبوت' (سلالة كلاب الصيد) و'قانون تالبوت' (ظاهرة بصرية/كهربائية)، وإن كان قانون تالبوت مسمَّى باسم الشخص ذاته."
      - "الاسم الكامل (وليم هنري فوكس تالبوت) غائب عن اللمّات العربية مع وجود مقابله الإنجليزي (William Henry Fox Talbot) في اللمّات الإنجليزية."
      - "التعريف العربي الحالي يبدو ترجمةً حرفية للتعريف الإنجليزي دون صياغة بأسلوب المعجم الوسيط الموسوعي."
      - "استخدام 'فوتوغرافية' في التعريف مقبول إذ استُقر على هذا التعريب، غير أن 'التصوير الضوئي' أكثر فصاحةً."
    observations: >-
      المجموعة تمثّل اسمَ عَلَمٍ لشخصية تاريخية إنجليزية (1800-1877)؛
      هو ويليام هنري فوكس تالبوت، المخترع ورائد التصوير الضوئي.
      إسناد اللمّات إليه صحيح من حيث المبدأ، لكنّ غياب التشكيل وغياب الاسم الكامل
      يُضعفان التوثيق. الأسماء الأعجمية المعرَّبة لا تخضع للاشتقاق أو المجاز
      بل للتعريب الصوتي وحده. "قانون تالبوت" الوارد في موسوعة الكهرباء (IEC 60050)
      يُثبت أن الصيغة العربية "تالبوت" مستعملةٌ في السياق العلمي العربي للإشارة
      إلى هذا المخترع تحديدًا.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٣ استعلامات):
#   ١. مطابقة دفعية: تالبوت، التالبوت، فوكس تالبوت، التلبوت → صفر نتائج لفوكس تالبوت،
#      ونتيجتان لتالبوت/التلبوت
#   ٢. الجسر الإنجليزي: Talbot | Fox Talbot | William Henry Fox Talbot
#      → entry_id 525862 (قانون تالبوت), entry_id 722151 (التلبوت = كلب)
#   ٣. كلمات مفتاحية: تصوير فوتوغرافي | رائد | مخترع → مصطلحات تقنية عامة بلا صلة بالشخص
stage2_evidence:
  per_lemma:
    - lemma: "تالبوت"
      expands:
        - text: "«قانون تالبوت»"
          source: "موسوعة الكهرباء (IEC 60050 — Electropedia)"
          addition: >-
            يُثبت أن الصيغة "تالبوت" مستعملة في المصادر العربية المتخصصة للإشارة
            إلى المخترع ذاته (قانون تالبوت في البصريات مسمَّى باسم فوكس تالبوت).
      contradicts:
        - text: "«التَّلبوت: كلب صيد ضخم متدلّي الأُذنين.»"
          source: "المورد الحديث (2008)"
          conflict: >-
            "التلبوت" بالتعريف دلالة مستقلة (سلالة الكلاب الإنجليزية)
            لا صلة لها باسم العَلَم؛ وهذا اشتراك لفظي شكلي لا حقيقي،
            غير أنه يُبرز ضرورة استخدام الصيغة الأوضح "فوكس تالبوت" أو الاسم الكامل
            تجنبًا للإيهام.

    - lemma: "فوكس تالبوت"
      evidence_status: "no_material_found"

    - lemma: "وِليام هِنري فوكس تالبوت"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "وِليام تالبوت"
      source: stage1
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: تالبوت ──
    - lemma: "تالبوت"
      decision: confirmed
      decision_reason: >-
        الصيغة مستعملة في المصادر العربية المتخصصة (موسوعة الكهرباء IEC 60050)
        للإشارة إلى المخترع. الاشتراك اللفظي مع كلب الصيد "التلبوت" شكلي بصري
        لا يُشكّل تعارضًا دلاليًا حقيقيًا في السياق الموسوعي. اللمّة مؤكَّدة
        مع إضافة تشكيل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        صيغة اللقب المنفرد؛ تُستخدم في السياق المختصر أو حين يكون الشخص مشهورًا
        من السياق، وهي أقل تخصيصًا من الصيغتَين المركّبتَين.
      borrowing_check:
        type: taarib
        verdict: مقبول — تعريب صوتي لاسم عَلَم أجنبي، يقبل لام التعريف ويُضاف إليه.
      morphological_fit: >-
        وزن غير عربي (اسم أعجمي معرَّب)؛ لا وزن صرفي عربي ينطبق عليه.
        التشكيل الصوتي: تَالبوت (فتحة على التاء، سكون على اللام).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تالبوت"

    # ── لمّة موجودة: فوكس تالبوت ──
    - lemma: "فوكس تالبوت"
      decision: confirmed
      decision_reason: >-
        الصيغة الثنائية (Fox Talbot) هي الأشيع في الكتابات العربية العلمية والتاريخية
        للإشارة إلى المخترع؛ تُزيل الغموضَ الناجم عن انفراد اللقب.
        رغم غياب الدليل المعجمي المباشر، فهي تعريب مستقر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        صيغة النسب الثنائية (اسم الوسط + اللقب)؛ أوضح من اللقب المنفرد
        وأخصر من الاسم الكامل، وهي الصيغة الأكثر تداولًا في المراجع العربية الأكاديمية.
      borrowing_check:
        type: taarib
        verdict: مقبول — تعريب مركّب لاسم عَلَم أجنبي ثنائي الجزء.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فوكس تالبوت"

    # ── مرشح المرحلة ١: وليم هنري فوكس تالبوت ──
    - lemma: "وِليام هِنري فوكس تالبوت"
      source: stage1
      decision: confirmed
      decision_reason: >-
        الاسم الكامل (William Henry Fox Talbot) موجود في اللمّات الإنجليزية
        ومغياب عن العربية؛ إضافته ضرورية للتناظر مع المقابل الإنجليزي
        وللاستخدام في السياقات الموسوعية الرسمية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الاسم الرباعي الكامل؛ يُستخدم في الوثائق الأكاديمية والموسوعات
        ولا يقبل الاختصار دون خطر الإيهام.
      borrowing_check:
        type: taarib
        verdict: مقبول — تعريب صوتي للاسم الكامل لشخصية تاريخية موثّقة.
      actions:
        - command: create_entry
          params:
            lemma: "وِليام هِنري فوكس تالبوت"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: وليم تالبوت ──
    - lemma: "وِليام تالبوت"
      source: stage1
      decision: removed
      decision_reason: >-
        هذه الصيغة المختصرة (الاسم الأول + اللقب) أقل استعمالًا وأقل تحديدًا
        من "فوكس تالبوت" التي تُميّز صاحبها عن غيره ممن يحملون لقب "تالبوت".
        لا يُوجد دليل معجمي على تداولها، وإضافتها تُكثّر اللمّات دون قيمة دلالية مضافة.


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────
stage4_content:
  definition:
    current: "مخترع ورائد إنجليزي في التصوير الفوتوغرافي نشر أول كتاب موضح بالصور الفوتوغرافية (1800-1877)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي ترجمة حرفية للتعريف الإنجليزي؛ يفتقر إلى الأسلوب الموسوعي
        ويُغفل مساهمته التقنية الجوهرية (الكالوتايب). كذلك "موضح بالصور الفوتوغرافية"
        صياغة ركيكة يمكن تحسينها. ينبغي تقديم التعريف بصيغة موسوعية تذكر
        التواريخ وأبرز الإنجازات.
    authored:
      - type: encyclopedic
        text: >-
          مُخترِعٌ وعالِمٌ إنجليزيٌّ (1800-1877)، أحدُ رُوَّادِ التصوير الضوئي،
          ابتكرَ طريقةَ الكالوتايب للتصوير بالنيغاتيف على الورق،
          وأصدرَ عام 1844م «قلمَ الطبيعة» أوَّلَ كتابٍ في التاريخ تُزيَّنُ صفحاتُهُ
          بصورٍ فوتوغرافيةٍ حقيقيةٍ.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >-
            مُخترِعٌ وعالِمٌ إنجليزيٌّ (1800-1877)، أحدُ رُوَّادِ التصوير الضوئي،
            ابتكرَ طريقةَ الكالوتايب للتصوير بالنيغاتيف على الورق،
            وأصدرَ عام 1844م «قلمَ الطبيعة» أوَّلَ كتابٍ في التاريخ تُزيَّنُ صفحاتُهُ
            بصورٍ فوتوغرافيةٍ حقيقيةٍ.

  examples:
    per_lemma:
      - lemma: "تالبوت"
        examples:
          - text: "يُعدُّ تالبوت من أبرز مَن أرسَوا أُسسَ التصوير الضوئي في القرن التاسع عشر الميلادي."
            type: usage

      - lemma: "فوكس تالبوت"
        examples:
          - text: "أسهمَ فوكس تالبوت في نشر فنِّ التصوير الفوتوغرافي بإصداره كتابَ «قلمِ الطبيعة» عام 1844م."
            type: usage

      - lemma: "وِليام هِنري فوكس تالبوت"
        examples:
          - text: "حصلَ وِليام هِنري فوكس تالبوت على براءةِ اختراعٍ لعمليةِ الكالوتايب في التصوير الضوئي عامَ 1841م."
            type: usage

    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يُعدُّ تالبوت من أبرز مَن أرسَوا أُسسَ التصوير الضوئي في القرن التاسع عشر الميلادي."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أسهمَ فوكس تالبوت في نشر فنِّ التصوير الفوتوغرافي بإصداره كتابَ «قلمِ الطبيعة» عام 1844م."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "حصلَ وِليام هِنري فوكس تالبوت على براءةِ اختراعٍ لعمليةِ الكالوتايب في التصوير الضوئي عامَ 1841م."


