# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13872216-n
# billionth — المركز 1,000,000,000 في سلسلة معدودة من الأشياء
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة الترادفية تصف مفهوم المَرْتَبَة الترتيبية (billionth = المركز البليوني) لا العدد الأصلي (billion = بليون). اللمّات الموجودة البليون والمليار هي أعداد أصلية لا ترتيبية."
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي، لا يتبع أسلوب المعاجم العربية."
      - "اللمّتان كلتاهما معرَّبتان من لغات أوروبية (بليون من الفرنسية/الإيطالية، مليار من الفرنسية)، ولا يوجد بديل عربي أصيل لهذا المقدار العددي."
      - "المُعْرِب التصنيفي (hypernym) هو «درجة / رتبة» (المكانة النسبية)، مما يؤكد أن المقصود هو المرتبة الترتيبية لا العدد الأصلي."
    observations: "المفهوم المستهدف هو الرتبة الترتيبية رقم واحد بليون في سلسلة عدّ. في العربية لا توجد صيغ ترتيبية خاصة للأعداد الكبيرة فوق العشرة، بل يُستخدم العدد الأصلي في السياق الترتيبي (كقولك: الصفحة ألف، العنصر مليون). لذا فاستخدام البليون والمليار في هذا السياق مقبول عربياً وإن كان الأدقّ صياغة المصدر الصناعي البِلْيُونِيّ / المِلْيَارِيّ للدلالة الترتيبية الصريحة."
  blind_candidates:
    - lemma: "البِلْيُونِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى بِلْيُون على وزن فِعْلِيُونِيّ (مصدر صناعي من المعرَّب)، يُفيد الترتيب كما في: المِلْيُونِيّ والأَلْفِيّ. هو الصيغة الأدقّ للدلالة على المرتبة الترتيبية."
    - lemma: "المِلْيَارِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى مِلْيَار، مرادف البِلْيُونِيّ في الاستعمال. يُشكّل صفة ترتيبية مطّردة."
    - lemma: "وَاحِدٌ مِنْ بِلْيُون"
      generation_method: tarkib
      justification: "مركب وصفي يدل على الجزء أو الرتبة من بين بليون عنصر، لكنه عبارة حرة لا مصطلح ثابت."
    - lemma: "جُزْءُ البِلْيُون"
      generation_method: tarkib
      justification: "مركب إضافي يدل على الكسر أو الرتبة البليونية، شائع في سياقات القياس العلمي (جزء في البليون = ppb)."

# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "البِلْيُون"
      confirm:
        - text: "«بَلْيون [مفرد]: ج بَلايين: 1- ألف مليون (في الولايات المتحدة) أو مليار. 2- مليون مليون في بريطانيا.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«بِلِيُون: (بالأسبانية Pailon مكبر Paila) تجمع على بَلاَين: دلو، سطل [...] وبليون (من الفرنسية أو من الإيطالية billione) بليون، ألف مليون»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
        - text: "«1- في الاستعمال الأمريكي (وفي الحواسيب الصغرية): ألف مليون، أو 10^9. [...] 2- في الاستعمال البريطاني: مليون مليون، أو 10^12»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«(1) البِليون: ألف مليون. مليون مليون (2) عددٌ ضخم جدًا.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«بِلْيون ؛ مِلْيار (10^9)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يُساوي بين البليون والمليار صراحةً عند القيمة 10^9"

    - lemma: "المِلْيَار"
      confirm:
        - text: "«مِلْيَار [مفرد]: ج مليارات: ألف مليون ويُقال له أيضًا: بليون»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«المِليار: ألف مليون.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«مليار: هي مليار السريانية من اليونانية مليار [...] أن الكلمة ذات أصل لاتيني وقد أطلق الرومان عليها اسم milliarium»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "يوضح الأصل اللاتيني للكلمة عبر السريانية واليونانية، وأنها كانت تعني في الأصل إناءً أو عمود أميال"

    - lemma: "البِلْيُونِيّ"
      evidence_status: "no_material_found"

    - lemma: "المِلْيَارِيّ"
      evidence_status: "no_material_found"

    - lemma: "وَاحِدٌ مِنْ بِلْيُون"
      evidence_status: "no_material_found"

    - lemma: "جُزْءُ البِلْيُون"
      confirm:
        - text: "«مختصر جُزْءٌ بِالبِلْيُون — ppb. (parts per billion)»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«أجزاء لكل مليون (جزء في المليون) وأجزاء من البليون (جزء في البليون)»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة"
          conflict: "جزء البليون في سياق القياس يعني الكسر (1/بليون) لا المرتبة الترتيبية البليونية، فالدلالة كسرية لا ترتيبية"

# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "البِلْيُون"
      decision: confirmed
      decision_reason: "لفظ معرَّب مستقر في الاستعمال العربي المعاصر، مثبت في المعاجم الحديثة. وفي العربية يُستخدم العدد الأصلي في المواضع الترتيبية للأعداد الكبيرة، فيصح قولك: العنصر البليون. يحتاج إضافة التشكيل الكامل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستخدم في السياق العلمي والتقني أكثر، وقد يعني 10^9 (الاستعمال الأمريكي الشائع) أو 10^12 (الاستعمال البريطاني القديم). أكثر شيوعاً في المشرق العربي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "البِلْيُون"

    - lemma: "المِلْيَار"
      decision: confirmed
      decision_reason: "لفظ معرَّب شائع ومستقر، دلالته ثابتة على 10^9 (ألف مليون) دون لبس. مثبت في المعاجم المعاصرة والموحدة. يصلح للسياق الترتيبي كأخيه البليون. يحتاج إضافة التشكيل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "دلالته لا لبس فيها: ألف مليون (10^9) حصراً، بخلاف البليون الذي قد يعني 10^12. أكثر شيوعاً في المغرب العربي والإعلام العام."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "المِلْيَار"

    # ── مرشحات المرحلة ١ ──
    - lemma: "البِلْيُونِيّ"
      source: stage1
      decision: removed
      decision_reason: "صيغة نسبة مشتقة منتظمة لكنها لم تُثبت في أي معجم، ولم يُعثر لها على شاهد استعمالي. استعمالها الطبيعي صفةً لا اسماً (الرقم البليونيّ)، ولا تصلح لمّةً اسمية مستقلة في مجموعة ترادفية صنفها اسم."

    - lemma: "المِلْيَارِيّ"
      source: stage1
      decision: removed
      decision_reason: "كسابقتها: صفة نسبية مشتقة بانتظام، لكنها غير مسجّلة معجمياً ولا تصلح لمّةً اسمية."

    - lemma: "وَاحِدٌ مِنْ بِلْيُون"
      source: stage1
      decision: removed
      decision_reason: "عبارة وصفية حرة لا مصطلح مسكوك. تفشل في اختبار السكّ: يمكن إبدال (واحد) بـ(فرد) أو (عنصر) وتبقى عبارة صالحة."

    - lemma: "جُزْءُ البِلْيُون"
      source: stage1
      decision: removed
      decision_reason: "دلالتها الشائعة كسرية (1/بليون) وتُستخدم في سياق القياس (ppb) لا في سياق الترتيب. إدخالها في مجموعة ترتيبية يُحدث خلطاً دلالياً."

