# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-14040334-n (eyestrain / asthenopia)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي ترجمة حرفية عن الإنجليزية، ويحتاج إعادة صياغة بأسلوب معجمي عربي"
      - "اللمّتان الموجودتان بلا تشكيل كامل"
      - "المجموعة تفتقر إلى مصطلح تراثي كلاسيكي للمفهوم رغم وجوده في المعاجم القديمة (حسر البصر)"
    observations: >
      المفهوم المستهدف هو حالة من إعياء العين تنجم عن إدامة النظر القريب مع وجود عيب بصري
      غير مصحَّح. المجموعة تضم لمّتين مركبتين إضافيتين. التعريف مقبول المضمون لكنه يحتاج
      تنقيحاً أسلوبياً ليوافق نهج المعجم الوسيط. المفهوم معروف في الثقافة العربية الطبية
      القديمة والحديثة على حدّ سواء، إذ ورد في القرآن الكريم وصف حسور البصر.
  blind_candidates:
    - lemma: "حُسُور"
      generation_method: ishtiqaq
      justification: >
        من الجذر «حسر» على وزن فُعُول الدالّ على الحالة والبلوغ، وهو مصدر حَسَرَ البَصَرُ
        أي كلّ وتعب. ورد في القرآن: ﴿يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ﴾،
        فالحسور هو كلال العين وإعياؤها.
    - lemma: "كَلَال البَصَر"
      generation_method: tarkib
      justification: >
        مركب إضافي من «كَلَال» (مصدر كلّ = تعب وضعف) و«البصر». يوافق المعنى المطلوب
        وهو ضعف البصر وتعبه من الإدامة، والكلال شائع في النصوص الطبية العربية القديمة.
    - lemma: "وَهَن العَيْن"
      generation_method: tarkib
      justification: >
        مركب إضافي من «وَهَن» (ضعف) و«العين». الوهن أصل صحيح في العربية دالّ
        على الضعف كما في مقاييس اللغة، والتركيب طبيعي في السياق الطبي.
    - lemma: "أَسْثِينُوبِيَا"
      generation_method: taarib
      justification: >
        تعريب للمصطلح اليوناني-اللاتيني asthenopia المكوّن من asthenos (ضعف)
        وopia (بصر). لا يُلجأ إليه إلا عند انعدام البديل العربي.


stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "إِجْهَادُ العَيْن"
      confirm:
        - text: "«تعب يصيب العين من فرط استخدامها، أو لوجود عيب في بؤرتها لم يتم إصلاحه.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«إِجْهَاد العَيْن — eyestrain»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«إِجْهادُ العَين — eyestrain»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«حُسور العين؛ إجهاد العين (ط).»"
          source: "المورد الحديث (2008)"
          addition: "يربط إجهاد العين بمرادفه التراثي حسور العين"

    - lemma: "وَهَنُ البَصَر"
      confirm:
        - text: "«وَهَنُ البَصَر — asthenopia»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مختصر وَهَنُ البَصَر — Asth. (asthenopia)»"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«وَهَنُ البَصَرِ التَّكَيُّفِيّ — accommodative asthenopia»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "المصطلح يُستخدم أساساً لفرعيات أنواع وهن البصر المتعددة (تكيّفي، عضلي، عصبي، شبكي...)"

    # ── مرشحات المرحلة ١ ──
    - lemma: "حُسُور"
      confirm:
        - text: "«إجهاد العين من استعمالها بإفراط، أو عند استخدام عدسات غير مناسبة.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«حُسور العين؛ إجهاد العين (ط).»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«حَسِرَتِ العَيْنُ أيْ: كَلَّتْ، وحَسَرَها بُعْدُ الشيء الذي حَدَّقَتْ نحوه»"
          source: "كتاب العين للخليل بن أحمد"
          addition: "يؤكد الأصل اللغوي الكلاسيكي للمصطلح"
        - text: "«وَحَسَرَ الْبَصَرُ إِذَا كَلَّ، وَهُوَ حَسِيرٌ، وَذَلِكَ انْكِشَافُ حَالِهِ فِي قِلَّةِ بَصَرِهِ وَضَعْفِهِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "تأصيل الجذر حسر لمعنى كلال البصر وضعفه"

    - lemma: "كَلَال البَصَر"
      expands:
        - text: "«كلال العين — eye fatigue»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
          addition: "الصيغة المسجّلة هي كلال العين لا كلال البصر"

    - lemma: "وَهَن العَيْن"
      evidence_status: "no_material_found"

    - lemma: "أَسْثِينُوبِيَا"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "إِجْهَادُ العَيْن"
      decision: confirmed
      decision_reason: >
        مصطلح راسخ في المعاجم الطبية والصيدلانية الحديثة، ورد في ثلاثة معاجم موحّدة على الأقل
        بمعنى eyestrain تحديداً. التركيب الإضافي طبيعي في العربية ومفهوم لعامة المتعلمين.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يركّز على بُعد الجهد والإرهاق الناتج عن فرط الاستعمال، وهو المصطلح الأشيع تداولاً
        في النصوص الطبية المعاصرة والإعلام العربي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِجْهَادُ العَيْن"

    - lemma: "وَهَنُ البَصَر"
      decision: confirmed
      decision_reason: >
        المصطلح المعتمد في المعجم الطبي الموحّد لترجمة asthenopia، وهو الأساس الذي تُبنى
        عليه عائلة كاملة من المصطلحات الفرعية (وهن البصر التكيّفي، العضلي، العصبي، إلخ).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يركّز على بُعد الضعف والوهن البَصَري بوصفه حالة مرضية، وهو المصطلح الطبي
        الرسمي المعتمد من المنظمة العربية للتربية والثقافة والعلوم (ALECSO).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَهَنُ البَصَر"

    # ── مرشحات المرحلة ١ ──
    - lemma: "حُسُور"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح تراثي مؤصَّل في الجذر «حسر» الذي وصفه الخليل بن أحمد بمعنى كلال العين
        تحديداً. ورد في معجم المصطلحات الطبية (1985) بتعريف صريح: «إجهاد العين من
        استعمالها بإفراط». كما ورد في المورد الحديث مرادفاً لإجهاد العين. وقد جاء في
        القرآن الكريم: ﴿يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ﴾.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        مصطلح مفرد ذو جذر كلاسيكي قرآني، يدلّ على كلال البصر وإعيائه، ويتميّز بإيجازه
        وتراثيته عن المركبات الإضافية الأخرى في المجموعة.
      actions:
        - command: create_entry
          params: {lemma: "حُسُور", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14040334-n"}

    - lemma: "كَلَال البَصَر"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على هذا المركب بعينه في أي معجم. الصيغة المسجّلة هي «كلال العين» لا
        «كلال البصر»، وإضافة مركب غير مسجّل يخالف اختبار التثبيت المعجمي.

    - lemma: "وَهَن العَيْن"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على أي شاهد معجمي لهذا المركب. الصيغة المعتمدة هي «وهن البصر» لا
        «وهن العين»، والبصر أدقّ من العين في السياق الطبي لأنه يشير إلى الوظيفة لا العضو.

    - lemma: "أَسْثِينُوبِيَا"
      source: stage1
      decision: removed
      decision_reason: >
        لا حاجة إلى تعريب المصطلح الأجنبي مع توفّر ثلاثة مصطلحات عربية أصيلة مؤكّدة.
        مبدأ إيثار العربي يمنع إدراج التعريب مع وجود البديل.


