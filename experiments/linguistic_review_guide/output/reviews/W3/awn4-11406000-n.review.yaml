# ══════════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11406000-n  |  ILI: i97417  |  POS: n
# الموضوع: سيمون فيزنتال — Simon Wiesenthal
# تاريخ المراجعة: 2026-03-21
# ══════════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة تمثّل اسم علم لشخصية تاريخية محددة؛ لا يمكن توليد مرشحات بالاشتقاق أو المجاز أو التركيب، والتعريب هو الطريقة الوحيدة الممكنة"
      - "التعريف الحالي يستخدم 'مواليد 1908' دون ذكر وفاته عام 2005، مما يُوهم بأنه لا يزال حياً وهو أمر مُضلِّل"
      - "اللمة الحالية 'سيمون فيزنتال' مكتوبة بلا تشكيل"
      - "التعريف يفتقر إلى السياق الجوهري: فيزنتال ناجٍ من الهولوكوست، لا مجرد محقِّق عادي"
    observations: >
      هذه المجموعة خاصة باسم العلم سيمون فيزنتال (Simon Wiesenthal، 1908-2005)،
      الناجي اليهودي-النمساوي من الهولوكوست الذي اشتُهر بتتبُّع مجرمي الحرب النازيين
      وتوثيق جرائمهم وملاحقتهم قضائياً. إن مرشحات اللمّات لمجموعات أسماء الأعلام
      مقيَّدة حصراً بصيغ التعريب المختلفة للاسم الأجنبي، إذ لا يصلح الاشتقاق ولا
      المجاز ولا التركيب هنا. التعريب المعتمد في المصادر العربية هو 'سيمون فيزنتال'
      (بالفاء)، غير أن صيغة 'ويزنتال' (بالواو) أقرب فونولوجياً للنطق الألماني [viːzənˌtaːl].
      التعريف العربي الحالي مقبول في جوهره لكنه يحتاج تحديثاً جوهرياً.

  blind_candidates:
    - lemma: "فِيزِنْتَال"
      generation_method: taarib
      justification: >
        تعريب مختصر للقب وحده، شائع في المصادر الصحفية والأكاديمية العربية حين تكون
        الشخصية معروفة من السياق. يستخدم الفاء لتمثيل حرف W الذي ينطق [v] في الألمانية.

    - lemma: "سِيمُون وِيزِنْتَال"
      generation_method: taarib
      justification: >
        تعريب بديل يستخدم الواو (و) لتمثيل حرف W الألماني بدلاً من الفاء؛ هذا الاختيار
        أكثر دقةً فونولوجيةً إذ يُبقي على الطابع الواوي لبداية الاسم [v] في مقابل [f].

    - lemma: "شِمْعُون فِيزِنْتَال"
      generation_method: taarib
      justification: >
        تعريب يستخدم الصيغة العبرية-السامية للاسم الأول (شمعون / Shimeon) بديلاً عن
        الصيغة اللاتينية (سيمون / Simon)؛ مسوّغه أن الاسم الأصلي عبري وفيزنتال يهودي
        الهوية، وقد تستخدم بعض المصادر الدينية أو الأكاديمية المتخصصة هذه الصيغة.

    - lemma: "سَايْمُون وِيزِنْتَال"
      generation_method: taarib
      justification: >
        تعريب وفق النطق الإنجليزي للاسم (Simon [ˈsaɪmən]) الذي يختلف عن النطق
        الألماني-البولندي [ˈziːmɔn]؛ قد يرد في مصادر عربية مترجمة عن الإنجليزية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────────
# الاستعلامات المُنفَّذة (٣ استعلامات):
#   ١. مطابقة دفعية: سيمون فيزنتال + ويزنتال + شمعون + فيزنتال + سايمون... → لا نتائج
#   ٢. الجسر الإنجليزي: "Wiesenthal" OR "Simon Wiesenthal" → لا نتائج
#   ٣. FTS عربي: "نمساوي" OR "محقق جرائم" OR "النازية" OR "الهولوكوست"
#      → نتائج متصلة بالسياق (ألمانيا النازية، النمسا) لكن لا شيء عن فيزنتال تحديداً
stage2_evidence:
  per_lemma:
    - lemma: "سيمون فيزنتال"
      evidence_status: "no_material_found"

    - lemma: "فِيزِنْتَال"
      evidence_status: "no_material_found"

    - lemma: "سِيمُون وِيزِنْتَال"
      evidence_status: "no_material_found"

    - lemma: "شِمْعُون فِيزِنْتَال"
      evidence_status: "no_material_found"

    - lemma: "سَايْمُون وِيزِنْتَال"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمة الموجودة ──
    - lemma: "سيمون فيزنتال"
      decision: confirmed
      decision_reason: >
        التعريب الأكثر شيوعاً وانتشاراً في المصادر العربية (الصحافة والأعمال الأكاديمية
        والموسوعات) للإشارة إلى هذه الشخصية. غياب الأدلة في قاعدة البيانات طبيعي لأن
        أسماء الأعلام الغربية نادراً ما تُدرَج في المعاجم العربية التقليدية. يحتاج
        إضافة تشكيل كامل، وإضافة الصيغة البديلة بالواو (ويزنتال) كشكل مقبول.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمة الوحيدة في المجموعة؛ تُحيل مباشرةً إلى الشخصية التاريخية بعينها.
        الفرق الدلالي بين صيغتَي 'فيزنتال' (بالفاء) و'ويزنتال' (بالواو) شكلي لا
        مضموني: كلتاهما تدلّان على الشخص ذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سِيمُون فِيزِنْتَال"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "سِيمُون وِيزِنْتَال"

    # ── مرشحات المرحلة ١ ──
    - lemma: "فِيزِنْتَال"
      source: stage1
      decision: removed
      decision_reason: >
        اللقب المجرد غير كافٍ لتحديد الشخص بدقة في السياقات غير المتخصصة؛ قد يُلبَس
        بأشخاص آخرين يحملون هذا اللقب. المجموعة الترادفية تستوجب الاسم الكامل لتفادي
        اللبس. الاستخدام المختصر مقبول في الخطاب ولكن ليس كلمة معجمية مستقلة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "سِيمُون وِيزِنْتَال"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة البديلة (بالواو) صحيحة فونولوجياً وقد تُدرَج كشكل إضافي (add_form)
        للمدخل الموجود، لكنها لا تستحق أن تكون لمةً مستقلة أو مدخلاً منفصلاً في
        المجموعة الترادفية، إذ تُحيل إلى الشخص ذاته ولا تُضيف فارقاً دلالياً.
        هذا الإجراء (add_form) قد رُوعي بالفعل في اللمة الموجودة أعلاه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "شِمْعُون فِيزِنْتَال"
      source: stage1
      decision: removed
      decision_reason: >
        الشكل العبري-السامي للاسم الأول (شمعون) ليس التعريب المعتمد في العربية للاسم
        'Simon' حين يُكتَب بالأبجدية اللاتينية في السياق الأوروبي؛ المصادر العربية
        تستخدم 'سيمون' بلا استثناء تقريباً. 'شمعون' محتجَز في العربية للشخصية
        التوراتية (Simeon بن يعقوب) ولا تتقاطع مع الاستخدام المعاصر لهذا الاسم.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "سَايْمُون وِيزِنْتَال"
      source: stage1
      decision: removed
      decision_reason: >
        التعريب وفق النطق الإنجليزي للاسم غير معتمد في المصادر العربية التي تستخدم
        حصراً 'سيمون' (من الألمانية/البولندية). 'سايمون' يُوحي باسم إنجليزي لا صلة
        له بالجذر التاريخي-الجغرافي للشخصية (ولِدَ في بوتشاتش، النمسا-المجر، اليوم
        أوكرانيا). كذلك يُدخِل تشويشاً مع الاستخدام الإنجليزي في النصوص العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ─────────────────────────────────
stage4_content:
  definition:
    current: "محقّق نمساوي في جرائم الحرب النازية (مواليد 1908)"
    assessment:
      decision: revise
      reason: >
        التعريف يعاني من ثلاثة إشكاليات: (١) يذكر 'مواليد 1908' دون تاريخ الوفاة
        (2005)، مما يُوهم بأنه حيّ. (٢) 'محقِّق' بمفرده مُبهَم — فيزنتال لم يكن
        محققاً رسمياً بل ناجياً يهودياً كرَّس حياته لتتبُّع مجرمي الحرب. (٣) يغفل
        السياق الجوهري (الهولوكوست، الهوية اليهودية) الذي يُحدِّد ماهية الشخصية.
    authored:
      - type: encyclopedic
        text: >
          سِيمُون فِيزِنْتَال (1908-2005): ناجٍ يهودي-نمساوي من الهولوكوست، وُلِدَ
          في بوتشاتش (النمسا-المجر، اليوم أوكرانيا)، وتُوُفِّيَ في فيينا. اشتُهِر
          بتتبُّع مجرمي الحرب النازيين وتوثيق جرائمهم وملاحقتهم أمام القضاء الدولي،
          وأسَّسَ مركزَ التوثيق اليهودي في فيينا لهذا الغرض.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11406000-n"
          definition_index: 0
          text: >
            سِيمُون فِيزِنْتَال (1908-2005): ناجٍ يهودي-نمساوي من الهولوكوست، اشتُهِر
            بتتبُّع مجرمي الحرب النازيين وتوثيق جرائمهم وملاحقتهم أمام القضاء الدولي.

  examples:
    per_lemma:
      - lemma: "سِيمُون فِيزِنْتَال"
        examples:
          - text: >
              كرَّسَ سِيمُون فِيزِنْتَال عقوداً من حياته لتتبُّع مئات مجرمي الحرب
              النازيين الفارِّين من العدالة وتقديم الأدلة إلى السلطات القضائية.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            كرَّسَ سِيمُون فِيزِنْتَال عقوداً من حياته لتتبُّع مئات مجرمي الحرب
            النازيين الفارِّين من العدالة وتقديم الأدلة إلى السلطات القضائية.


