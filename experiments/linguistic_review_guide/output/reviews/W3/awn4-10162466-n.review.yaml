# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "أستاذ كبير"
      decision: confirmed
      decision_reason: >
        اللمّة هي المصطلح المعتمد في الأدبيات العربية المتخصصة في الشطرنج (FIDE) وتتكوّن من
        مكوّنَيْن موثَّقَيْن معجمياً (أستاذ = الماهر بصناعته، كبير = العظيم الرفيع)؛ واجتماعهما
        يُشكّل وحدة اصطلاحية ثابتة لا يمكن إبدال «أستاذ» بـ«معلم» أو «مُدرِّس» مع الإبقاء
        على الدلالة التقنية الرياضية المُرادة — مما يجتاز اختبار السكّ. يجب تحديث التشكيل.
      evidence_assessment:
        case: mixed
      morphological_check: >
        «أستاذ» معرَّبة من الفارسية (أستاد)، جمعها أساتذة وأساتيذ؛ تقبل التعريف والإضافة.
        «كبير» اسم على وزن فَعِيل من (ك ب ر)، صفة مشبَّهة تدلّ على الرفعة والسمو. الوزن
        الصرفي مناسب: أُسْتَاذ + كَبِير = مركَّب وصفي يدلّ على الدرجة العليا.
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      loan_check:
        lexical_borrowing: "أستاذ معرَّبة (مقبولة؛ مستقرة في العربية منذ القرون الوسطى)"
        literal_translation: "ترجمة دلالية لـ grand master: grand=كبير، master=أستاذ"
        calque: "مقبول — هيكله الدلالي واضح ومتداوَل"
      term_quality:
        consistency: "مطَّرد في مصادر الشطرنج العربية"
        ease_of_use: "سهل التداول والنطق"
        appropriateness: "ملائم؛ يُميّز الرتبة العليا عن سائر المراتب"
        heritage_preference: "مقبول: أستاذ موروث معجمي عربي قديم وإن كان معرَّباً"
        arabic_preference: "يُوثَّق على حساب التعريب الصوتي «غراندماستر»"
        derivability: "محدودة — أستاذ غير عربي الجذر؛ لكن كبير مشتق عربي صريح"
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ تختص بالرتبة العليا الرسمية الممنوحة مؤسسياً في الشطرنج
        أو البريدج، وتتمايز بحكم طبيعتها اللقبية (title) عن النعوت الوصفية العامة كـ«بارع»
        أو «نابغة».
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُسْتَاذٌ كَبِيرٌ"

    # ── مرشّحو المرحلة ١ ──
    - lemma: "نَابِغَة"
      source: stage1
      decision: removed
      decision_reason: >
        رغم قوّة جذره اللغوي ودلالته على الإبداع الاستثنائي، فإن «نابغة» مصطلح عام يُطلق على
        المبرِّز في أي علم أو فن ولا يختص بلعبة معيّنة؛ كما لا يحمل المعنى الرسمي المؤسسي
        للقب الدولي الذي يُمنح وفق معايير موضوعية (نقاط إيلو، وبطولات)؛ فاستعماله لهذه
        المجموعة يُخلّ بالدقة الاصطلاحية.

    - lemma: "أُسْتَاذٌ أَوَّل"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر له على شاهد معجمي موثَّق في قواعد البيانات؛ فضلاً عن أن «أستاذ أول» يستحضر
        في الذاكرة الجمعية العربية التسلسل الأكاديمي الجامعي لا الرتب الرياضية. كما يصف المرتبة
        الأولى في أي حقل، وهو أشمل وأعمّ مما تقتضيه هذه المجموعة.

    - lemma: "بَارِعٌ عَالَمِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        تعبير وصفي حرّ وليس مصطلحاً مسكوكاً؛ يفشل اختبار السكّ إذ يمكن إبدال «بارع» بـ«ماهر»
        أو «متميز» مع بقائه صالحاً للوصف. لا شاهد له في قواعد البيانات المعجمية بوصفه وحدة
        اصطلاحية ثابتة.

    - lemma: "غرَانْدمَاسْتَر"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب صوتي خام لا يُفضَّل في المعاجم الرسمية حين تتوفر مقابلات عربية مستقرة؛ ووجود
        «أستاذ كبير» المتداوَل والموثَّق يجعل هذا التعريب ملاذاً غير ضروري. لا وجود له في
        قواعد البيانات الأكاديمية المعجمية.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
stage4_content:

  definition:
    current: "لاعب ذو مهارة استثنائية أو عالمية في الشطرنج أو البريدج"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية مباشرة للتعريف الإنجليزي؛ يفتقر إلى الدقة المصطلحية
        (البُعد المؤسسي للقب)، ولا يُحدّد الجنس القريب بدقة (لقب رياضي/رتبة، لا مجرد لاعب)،
        ويستعمل عطف الصفتين «استثنائية أو عالمية» في صياغة ركيكة. كما لا يستوفي معايير
        تعريف المعجم الوسيط.
    authored:
      - type: terminological
        text: >
          لقبٌ رياضيٌّ دوليٌّ يُمنح لأمهر لاعبي الشطرنج أو البريدج وفق معايير محدَّدة
          تضعها الاتحادات الدولية المختصة، وهو أعلى رتبة رياضية معتمدة في هذين اللعبتين.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          «الأستاذ الكبير» لقبٌ يُمنح في الشطرنج من قِبَل الاتحاد الدولي للشطرنج (FIDE)
          لمن تجاوز عتبةً محدَّدة من نقاط الإيلو وأحرز نتائج نوعية في بطولات دولية معتمدة؛
          وفي البريدج تمنحه الاتحادات المتخصصة بمعايير مماثلة. ويُعدّ هذا اللقب قمة سلّم
          الرتب الرياضية في هذين الفنَّيْن التنافسيَّيْن.
    actions:
