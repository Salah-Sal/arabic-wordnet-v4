# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. المرشحات الأعمى — توليد من التعريف فقط (قبل الاطلاع على اللمّات)
  blind_candidates:
    - lemma: "نَابِغَة"
      generation_method: ishtiqaq
      justification: >
        من جذر (ن ب غ) على صيغة فاعل مع تاء المبالغة؛ دلالته الأصيلة «البروز والظهور المفاجئ
        للتميّز»، ويُستعمل في العربية المعاصرة لمن بلغ ذروة الإتقان في مجاله؛ يصلح للدلالة
        على صاحب المهارة الاستثنائية في لعبة ما.
    - lemma: "أُسْتَاذٌ أَوَّل"
      generation_method: tarkib
      justification: >
        مركَّب وصفي (إضافي دلالياً) من «أستاذ» بمعنى المتمكّن الماهر + «أوّل» بمعنى الأعلى
        رتبةً؛ يوازي «premier master» أو «first-degree master»، ويُفرّق بينه وبين الأستاذ
        العادي، وهو نمط مألوف في التسميات المؤسسية العربية.
    - lemma: "بَارِعٌ عَالَمِيّ"
      generation_method: tarkib
      justification: >
        مركَّب وصفي من «بارع» (من جذر ب ر ع: التبريز والفضل) + «عالمي» للدلالة على مستوى
        الإتقان الكوني؛ يُقابل «world-class expert» ويُبرز بُعدَي التميّز والشمول العالمي.
    - lemma: "غرَانْدمَاسْتَر"
      generation_method: taarib
      justification: >
        تعريب مباشر من الإنجليزية «grandmaster» بالنقل الصوتي؛ ملجأ أخير نظراً لشيوع هذا
        الشكل في الإعلام الرياضي العربي عند غياب المصطلح الموحَّد أو للدقة في السياق الرسمي.

  # ب. التقييم الأوّلي — بعد قراءة synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الموجودة «أستاذ كبير» خالية من التشكيل الكامل، مما يفتح باب اللبس الصرفي."
      - "المجموعة تحتوي على لمّة مفردة واحدة فقط، مما يُقلّل من ثراء الشبكة الدلالية."
      - "التعريف العربي ترجمة حرفية للتعريف الإنجليزي، ولا يستوفي اشتراطات التعريف الاصطلاحي (جنس قريب + فصل نوعي دقيق)."
      - "«أستاذ» كلمة فارسية معرَّبة (Persian loan), مما يُضعف الاشتقاقية العربية الصرف للمصطلح؛ لكنها مستقرة ومقبولة معجمياً."
      - "البُعد المؤسسي للمصطلح (لقب تمنحه الاتحادات الدولية بمعايير محددة) غائب عن التعريف الحالي."
    observations: >
      تمثّل هذه المجموعة مصطلحاً تقنياً متخصصاً مستمدّاً من عالم الشطرنج والبريدج التنافسي؛
      فلقب «الأستاذ الكبير» (Grandmaster/GM) هو أعلى رتبة يمنحها الاتحاد الدولي للشطرنج
      (FIDE) وما يقابله في البريدج. المصطلح العربي «أستاذ كبير» هو الأكثر استعمالاً في
      المراجع الرسمية والصحافة المتخصصة، غير أن «أستاذ» معرَّبة وليست عربية خالصة. تجدر
      الإشارة إلى أن التراث العربي الشطرنجي عريق (الشطرنج نفسه تعريب فارسي)، مما يمنح
      المصطلح قبولاً ثقافياً نسبياً. لمّة المرحلة الأولى «نَابِغَة» واعدة لغوياً لكنها عامة
      تصف أي عبقري في أي مجال، ولا تحمل دلالة اللقب الرسمي المحدَّد المرتبط بمعايير
      مؤسسية قياسية.


