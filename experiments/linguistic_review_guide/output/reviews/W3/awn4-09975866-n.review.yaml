# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «خبير تذوق» مركَّب إضافي لا يجتاز اختبار السكّ: يمكن إبداله بـ«خبير في التذوق» أو «خبير التقدير» دون تغيير المعنى، مما يكشف أنه عبارة وصفية حرة لا مصطلح معجمي ثابت."
      - "اللمّة «ذواقة» غالبة الاستخدام في مجال الغاسترونومية وتذوق الأطعمة، وقد تُوهم القارئ بأن المقصود خبير المطبخ لا الفنون الجميلة."
      - "المجموعة تفتقر إلى لمّات ذات توثيق معجمي كلاسيكي راسخ لمفهوم «الخبير الفني المُميِّز»، إذ يزخر التراث العربي بمصطلحات ملائمة غائبة عنها."
    observations: "مجموعة ترادفية تُحيل إلى مفهوم «connoisseur» الإنجليزي، وهو شخص يملك ذوقًا رفيعًا وخبرةً عميقة تُمكِّنانه من تقدير الأعمال الفنية وتمييز مراتبها، ولا سيَّما في الفنون الجميلة. المفهوم نفسه يُعبِّر عنه التراث العربي بمصطلحات راسخة: «العارف» المستخدَم في معاجم الاصطلاحات الفنية ترجمةً مباشرة للـconnoisseur، و«الجهبذ» بمعنى «النقاد الخبير». اللمّتان الحاليتان لا تنهضان بهذا المعنى توثيقًا وضبطًا."

  blind_candidates:
    - lemma: "مُتَذَوِّق"
      generation_method: ishtiqaq
      justification: "اسم فاعل على وزن تَفَعُّل (مُتَفَعِّل) من جذر ذ-و-ق؛ يدل على من يُمارس التذوق ويُداوم عليه بحثًا وتأمُّلًا، مما يُناسب من يُكرِّس نفسه لتقدير الفنون."
    - lemma: "ذَوَّاق"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من جذر ذ-و-ق؛ تُفيد الاحتراف في الذوق والتمييز، إذ وردت في المعاجم بمعنى «جيد الذوق: الخبير»."
    - lemma: "نَقَّاد"
      generation_method: majaz
      justification: "صيغة مبالغة على وزن فَعَّال من جذر ن-ق-د؛ يُراد بها الإزاحة الدلالية من نقد الدراهم وتمييز جيِّدها إلى نقد الأعمال الفنية وتمييز أرفعها، وهو امتداد دلالي مألوف في الاستخدام العربي المعاصر."
    - lemma: "عَارِف"
      generation_method: majaz
      justification: "اسم فاعل على وزن فَاعِل من جذر ع-ر-ف؛ يدل على صاحب المعرفة الغائرة والإلمام العميق بالشيء. الإزاحة الدلالية من المعرفة العامة إلى الخبرة الجمالية المُتذوِّقة في الفنون إزاحة طبيعية يُعضِّدها الاستخدام في معاجم الاصطلاحات الفنية."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
# ١. مطابقة دفعية: جميع اللمّات الموجودة والمرشحات + صيغ الـ«ال»
# ٢. جسر إنجليزي: connoisseur | cognoscente | aesthete | virtuoso | aficionado
# ٣. بحث FTS: ذواقة | تذوق الفن | ذوق فني | متذوق | محب الفنون
# ٤. مقاييس اللغة: جذور ذوق، عرف، نقد، خبر (dictionary_id = 151)
# ٥. بحث جهبذ + تحقق من ذواقة
stage2_evidence:
  per_lemma:
    - lemma: "خبير تذوق"
      confirm:
        - text: "«خبير: بالآثار والفنون — translation_en: connoisseur»"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) — ARABTERM"
      expands:
        - text: "«الجِهْبِذ؛ العارف؛ الخبير: المتمكِّن من تقنيَّة فنّ من الفنون أو أصوله إلى حدّ يؤهِّله لإطلاق حُكمٍ نقديّ فيه»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يُظهر أن «الخبير» مكوِّن من مكوِّنات مصطلح connoisseur لكنه وحده لا يختص بهذا المعنى، وأن المركَّب «خبير تذوق» بهذه الصيغة ليس الوحدة المعجمية الثابتة في المعاجم."

    - lemma: "ذواقة"
      contradicts:
        - text: "«ذِواقة، علم الطهي — translation_en: gastronomy»"
          source: "مسرد الفن والتسلية والرياضة، المنظمة العربية للتربية والثقافة والعلوم — ARABTERM"
          conflict: "يُرسِّخ «ذواقة» مرادفًا لـ«gastronomy» أي فن الطهي وتذوق الأطعمة الرفيعة، لا للخبير في الفنون الجميلة."
        - text: "«ذَوّاقة الجبنة؛ محِبّ الجبنة — translation_en: turophile»"
          source: "المورد الحديث (2008) — ARABTERM"
          conflict: "يُوظِّف «ذواقة» في سياق تذوق الأطعمة لا الفنون."
        - text: "«سُعالُ ذَوَّاقَةِ الشَّاي — translation_en: tea tasters' cough»"
          source: "المعجم الطبي الموحد (2009) — ARABTERM"
          conflict: "توظيف طبي-غذائي لا علاقة له بالخبير الفني."

    - lemma: "مُتَذَوِّق"
      contradicts:
        - text: "«متذوِّق: الذي يتذوق الأطعمة بهدف مقارنة صفاتها الحسية وتقبل المستهلك لها — translation_en: taster»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004) — ARABTERM"
          conflict: "المصطلح محدَّد في مجال تقنيات الغذاء بمعنى «food taster» لا «connoisseur of fine arts»."
      expands:
        - text: "«مُتَذوِّق الجمال [وبخاصة في الفنّ] — translation_en: aesthete»"
          source: "المورد الحديث (2008) — ARABTERM"
          addition: "يرد المصطلح بصيغة مُقيَّدة «متذوق الجمال» لا مُفردًا، ويُترجَم إلى «aesthete» لا «connoisseur»؛ وهما مفهومان متقاربان لكن غير متطابقَين."

    - lemma: "ذَوَّاق"
      confirm:
        - text: "«الذَّوَّاقُ: جيد الذوق: الخبير»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«الذَّوَّاقُ: الجَيِّد الذَّوْقِ, الخَبِيرُ بأَنْواعِ الطعوم»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      contradicts:
        - text: "«الذَّوَّاقُ: المَلُولُ لِما هو فيه, يُرِيدُ تَذَوُّقَ غيره... السَّريعُ النِّكاحِ, السَّريعُ الطَّلاق»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          conflict: "اللفظ مشترَك بين معنى «جيد الذوق» ومعنى «الملول» و«سريع الطلاق»؛ الاستخدام في السياق الفني يُوقع في لبس."
        - text: "«الذَّوَّاق في الحديث: (إِن الله يبغض الذَّواقين والذواقات)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (الوسيط الحديث)"
          conflict: "الحديث النبوي يستخدم «ذوّاق» في ذمِّ الملول المُقلِّب في الزواج، مما يُشكِّل إيحاءً سلبيًا لا يُناسب مصطلحًا فنيًا."

    - lemma: "نَقَّاد"
      contradicts:
        - text: "«النَّقَّادُ: الذى يَنْقُد الدَّرَاهِم وغيرها راعى النَّقَد: الغنم, أو صاحِبُها»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "المعنى الأصيل محصور في نقد العملة ورعي الغنم، لا في تقدير الفنون."
        - text: "«النقاد: الذي ينقد الدراهم وغيرها وراعي النقد الغنم أو صاحبها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "يُؤكد اقتصار المعنى المعجمي الأصيل على النقد المالي."

    - lemma: "عَارِف"
      confirm:
        - text: "«العارف:[في الانكليزية] Connoisseur ،initiated [في الفرنسية] Connaisseur ،initie انت عارفه بما سبق»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي (ت 1777م)"
        - text: "«الجِهْبِذ؛ العارف؛ الخبير: المتمكِّن من تقنيَّة فنّ من الفنون أو أصوله إلى حدّ يؤهِّله لإطلاق حُكمٍ نقديّ فيه»"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«العَارِفُ: من بدا لَهُ الشَّاهِد، وفنى الشواهد، ووهب الخواص»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505م)"
          addition: "يكشف أن «العارف» حمَل تاريخيًا دلالة من يُدرك ما وراء الظاهر ويُبصر خوافيَ الأمور، مما يُضفي على استخدامه في سياق الفنون إيحاءً بعمق الإدراك الجمالي المتجاوِز للسطح."

    - lemma: "جِهْبِذ"
      confirm:
        - text: "«الجِهْبِذُ، بالكسر: النَّقَّادُ الخَبِيرُ»"
          source: "القاموس المحيط للفيروزآبادي (ت 1414م)"
        - text: "«النَّقَّادُ الخَبِيرُ بغوامض الأمور، البارِعُ العارِفُ بطُرِق النَّقْدِ، وهو مُعَرَّب»"
          source: "تاج العروس لمرتضى الزبيدي (ت 1790م)"
        - text: "«جهـبذ: خبيرٌ بغوامض الأمور، ناقد عارف بتمييز الجيِّد من الرديء ° جهابذةُ الفكر: أعلامُه البارزون»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (ت 2003م)"
        - text: "«الجِهْبِذ؛ العارف؛ الخبير: المتمكِّن من تقنيَّة فنّ من الفنون أو أصوله إلى حدّ يؤهِّله لإطلاق حُكمٍ نقديّ فيه — translation_en: connoisseur»"
          source: "المورد الحديث (2008) — ARABTERM"
      expands:
        - text: "«جهبذ: هو كل من يميز الجيد من الرديء... والرجل الذي يعرف غوامض الأمور وأكثرها دقة وهو ناقد بصير»"
          source: "تكملة المعاجم العربية لرينهارت دوزي (ت 1883م)"
          addition: "يُوسِّع استخدام «جهبذ» ليشمل كل مجال يحتاج إلى تمييز الجيد من الرديء، لا النقد المالي وحده."


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──

    - lemma: "خبير تذوق"
      decision: removed
      decision_reason: "المركَّب الإضافي «خبير تذوق» لا يجتاز اختبار السكّ: يمكن إبداله بـ«خبير في التذوق» أو «خبير بالتقدير» دون أي خسارة دلالية، كاشفًا بذلك أنه عبارة وصفية حرة لا وحدة معجمية ثابتة. لم يرد هذا التركيب في أيٍّ من المعاجم المستعلَمة بوصفه مصطلحًا مسكوكًا. فضلًا عن ذلك، فإن المكوِّن «خبير» وحده يُترجَم إلى connoisseur في المعجم الموحد لمصطلحات التقنيات التربوية بقيد «بالآثار والفنون»، مما يُؤكِّد أن الإضافة «تذوق» لا تُضيف قيدًا معجميًا ثابتًا بل تكرارٌ وصفي."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "ذواقة"
      decision: removed
      decision_reason: "الأدلة المعجمية تُجمع على توظيف «ذواقة» في مجال الغاسترونومية وتذوق الأطعمة: فهي مُرادفة لـ«gastronomy» في مسرد فنون الألعسكو، و«tasters' cough» في المعجم الطبي الموحد، و«turophile» في المورد الحديث. لا يوجد دليل على استخدامها مصطلحًا لخبير الفنون الجميلة. الإبقاء عليها يُفضي إلى خلط دلالي بين تقدير الفنون وتذوق الطعام."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──

    - lemma: "مُتَذَوِّق"
      source: stage1
      decision: removed
      decision_reason: "المعاجم الحديثة تُثبِّت «متذوق» في مجال تقنيات الغذاء (food taster)، وحين يُستخدَم في سياق الجمال يأتي مُقيَّدًا «متذوق الجمال» ليُقابل «aesthete» لا «connoisseur». الفرق دلالي: الـaesthete شخص ذو حساسية جمالية، والـconnoisseur خبير ناقد قادر على التمييز والتقييم. اشتراط القيد يُثبِت أن الكلمة منفردةً لا تحمل الدلالة المطلوبة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "ذَوَّاق"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من ورود «الذواق» بمعنى «جيد الذوق: الخبير» في المعجم الوسيط والكبير، إلا أن المعنى المُهيمِن هو «الملول لما هو فيه» وورد ذمُّه في الحديث النبوي (الله يبغض الذواقين)، كما يُحيل المعجم الكبير إلى معنى «سريع الطلاق». التعدد الدلالي مع هذا البُعد السلبي الراسخ يجعله غير صالح مصطلحًا جماليًا رفيعًا."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "نَقَّاد"
      source: stage1
      decision: removed
      decision_reason: "المعاجم الأصيلة تُقيِّد «النقاد» بنقد العملة وتمييز الدراهم، وبرعي صغار الغنم. لا يوجد دليل معجمي على سكِّه مصطلحًا ثابتًا لخبير الفنون. الاستخدام الحديث لـ«ناقد» (لا «نقاد») في النقد الأدبي والفني وارد لكنه يعني critic لا connoisseur؛ والفرق أن الناقد يُحكِم والـconnoisseur يُقدِّر ويُميِّز."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "عَارِف"
      source: stage1
      decision: confirmed
      decision_reason: "«عارف» موثَّق توثيقًا مباشرًا بمعنى connoisseur في أبرز معجمَيْن: كشَّاف اصطلاحات الفنون للتهانوي (ت 1777م) إذ يُعطي الترجمة الإنجليزية «Connoisseur» صراحةً، والمورد الحديث الذي يُدرجه ضمن المقابلات العربية لـconnoisseur مع الجهبذ والخبير. يجتاز اختبار الاشتقاقية (جذر عرف)، واختبار الملاءمة (معروف ومتداول)، واختبار الفصاحة (فصيح كلاسيكي)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على البُعد الاستيعابي والمعرفة الجمالية المُتشرَّبة من الداخل؛ العارف يُدرك الفنون بحاسة مرهفة ومعرفة ذاتية متراكمة، وقد يحمل إيحاء بالمعرفة الخفية وما وراء الظاهر. يقابل الـconnoisseur بوصفه مَن يعي روح الأثر الفني."
      actions:
        - command: create_entry
          params:
            lemma: "عَارِف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "جِهْبِذ"
      decision: confirmed
      decision_reason: "«جهبذ» من أقوى اللمّات توثيقًا: ورد في القاموس المحيط والتاج ومعجم اللغة المعاصرة بمعنى «النقاد الخبير» و«خبير بغوامض الأمور ناقد عارف بتمييز الجيد من الرديء»، وأورده المورد الحديث مقابلًا مباشرًا لـconnoisseur مُذيلًا بتعريف «المتمكن من تقنية فن من الفنون». صحيح أنه معرَّب عن الفارسية، لكنه مُستعرَب منذ القرن الثامن الهجري على الأقل، يقبل لام التعريف، والجمع (جَهَابِذة)، والنسبة (جِهبِذي). يجتاز معايير التعريب المقبول."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُركِّز على البُعد التقييمي والتمييزي الخارجي؛ الجهبذ كالصيرفي الذي يُميِّز الأصيل من المزيَّف، يُصدِر أحكامًا نقدية موثوقة ويُفرِّق بين المراتب. مشتق من ترادفه مع «نقاد الدراهم» حيث التحقق من الجودة هو الوظيفة الجوهرية. يُقابل الـconnoisseur بوصفه مَن يملك معيار الجودة ويُصدِر الحكم النقدي."
      actions:
        - command: create_entry
          params:
            lemma: "جِهْبِذ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


