# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14442226-n
# the state of being allied or confederated
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (تحالف، كونفدرالية) بلا تشكيل"
      - "كونفدرالية لفظ دخيل لا أصل عربي له، وقد يكون هناك بديل تراثي أنسب"
      - "التعريف العربي الحالي فيه دَور: يُعرّف تحالف بالتحالف"
    observations: "المفهوم — حالة التحالف أو الاتحاد الكونفدرالي — مفهوم سياسي عربي أصيل له جذور في التحالفات القَبَلية العربية (كحلف الفضول وحلف المطيّبين). جذر «حلف» غني بالمشتقات الدالة على المعاهدة والملازمة. اللمّة الثانية (كونفدرالية) تعريب حديث شائع في الخطاب السياسي المعاصر."
  blind_candidates:
    - lemma: "حِلْف"
      generation_method: ishtiqaq
      justification: "من جذر حلف، وزن فِعْل. الحِلْف في المعاجم الكلاسيكية: المعاهدة على التعاضد والتساعد والاتفاق. لفظ تراثي أصيل ورد في الحديث النبوي والشعر الجاهلي."
    - lemma: "مُحَالَفَة"
      generation_method: ishtiqaq
      justification: "من جذر حلف على وزن مُفَاعَلَة، يدل على المشاركة. المحالفة: المعاهدة والملازمة كما في التوقيف على مهمات التعاريف."
    - lemma: "تَعَاهُد"
      generation_method: ishtiqaq
      justification: "من جذر عهد على وزن تَفَاعُل، يدل على المشاركة في العهد. التعاهد حالة التزام متبادل بين أطراف، وهو قريب دلالياً من حالة التحالف."
    - lemma: "حِلَاف"
      generation_method: ishtiqaq
      justification: "من جذر حلف على وزن فِعَال. ورد في المورد الحديث ترجمةً لـ confederacy بمعنى: اتحاد أشخاص أو ولايات أو دول. وزن فِعَال من الأوزان الدالة على المصدر والحالة."

stage2_evidence:
  per_lemma:
    - lemma: "تَحَالُف"
      confirm:
        - text: "«القومُ: تعاهَدُوا وتقاسَمُوا على النُّصْرَةِ»"
          source: "المعجم الكبير (مادة تحالف)"
        - text: "«التَّحالُفُ: أَن يحلف كل من الْمُتَعَاقدين أَو الْوَارِث»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«وتحالفا تعاهدا على أن يكون أمرهما واحدا في النصرة والحماية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«تحالُف، مصاهرة» — ترجمة alliance"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يُستعمل أيضاً في سياق المصاهرة والقرابة بالمعنى الموسّع"

    - lemma: "كُونْفِدِرَالِيَّة"
      confirm:
        - text: "«كونفدرالية» — ترجمة confederation"
          source: "مسرد الفلسفة وعلم النفس، أليكسو (ArabTerm)"
        - text: "«اتحاد تعاهديّ، كونفدرالية» — اتفاق أو معاهدة تبرم بين دول كاملة السيادة من أجل تنظيم شؤونها الاقتصادية والثقافية والعسكرية بعضها مع بعض"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«الحِلاف؛ الاتحاد الكونفدراليّ» — ترجمة confederation"
          source: "المورد الحديث (2008)"
          addition: "يُرادفها في الاستعمال المعاصر: الحِلاف والاتحاد الكونفدرالي"

    - lemma: "حِلْف"
      confirm:
        - text: "«الحِلْف: المعاهدة على التعاضد والتساعد والاتفاق (ج) أحلاف»"
          source: "المعجم الوسيط"
        - text: "«الحلف: العهد بين القوم، والمحالفة المعاهدة والملازمة... وتحالفا تعاهدا على أن يكون أمرهما واحدا في النصرة والحماية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«حلف» — ترجمة alliance في مجالَي الجغرافيا وعلم الاجتماع"
          source: "مسرد الجغرافيا والتاريخ، أليكسو / مسرد علم الاجتماع، أليكسو"
      contradicts:
        - text: "«الحلف: بالفتح وسكون اللام أو كسرها يمين يؤخذ بها العهد ثم سمّي به كلّ يمين»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "المعنى الأول والأشهر للحِلْف هو القَسَم واليمين، مما يخلق اشتراكاً لفظياً"
      expands:
        - text: "«العَهْدُ يكونُ بين القَوْمِ»"
          source: "المعجم الكبير (مادة حلف، المعنى الثالث)"
          addition: "الحلف بمعنى العهد بين القوم مؤيَّد بشاهدَين حديثيَّين: «لا حِلْفَ في الإسلام» و«أيُّما حِلْفٍ كان في الجاهلية...»"

    - lemma: "مُحَالَفَة"
      confirm:
        - text: "«والمحالفة المعاهدة والملازمة»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«المُحَالَفَة: المعاهدة، وجعلت للملازمة التي تكون بمعاهدة»"
          source: "المفردات في غريب القرآن للراغب الأصفهاني"
      expands:
        - text: "«والمحالفة أن يحلف كل للآخر، ثم جعلت عبارة عن الملازمة مجرداً»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "المحالفة انتقلت من القَسَم المتبادل إلى مطلق الملازمة والمعاهدة"

    - lemma: "تَعَاهُد"
      evidence_status: "no_material_found"

    - lemma: "حِلَاف"
      confirm:
        - text: "«حِلاف؛ حِلْف؛ تحالُف — (٣) الحِلاف: اتحاد أشخاص أو ولايات أو دول» ترجمة confederacy"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الحِلاف؛ الاتحاد الكونفدراليّ» ترجمة confederation"
          source: "المورد الحديث (2008)"
          addition: "حِلاف يُستعمل للدلالة على الاتحاد الكونفدرالي تحديداً"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَحَالُف"
      decision: confirmed
      decision_reason: "مصدر تَفَاعُل من حلف، يدل على المشاركة في الحلف والعهد. مؤيَّد بنصوص المعجم الكبير والسيوطي والمناوي. دلالته على حالة التعاهد المتبادل تطابق معنى المجموعة تماماً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على حالة التعاهد المتبادل بين طرفين أو أكثر على النصرة، وهو مصطلح عام يشمل كل صور التحالف السياسي والعسكري"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَحَالُف"

    - lemma: "كُونْفِدِرَالِيَّة"
      decision: confirmed
      decision_reason: "تعريب شائع مستقر في الخطاب السياسي والقانوني المعاصر، مُثبَّت في معاجم أليكسو والمعجم الموحد لمصطلحات القانون. يقبل لام التعريف والنسبة (كونفدرالي) والجمع السالم (كونفدراليات). يسدّ حاجة اصطلاحية لتمييز الاتحاد الكونفدرالي من غيره."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يخصّص نمطاً محدداً من التحالف: الاتحاد بين دول تحتفظ كلٌّ منها بسيادتها الكاملة، وهو أخصّ من تَحَالُف"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كُونْفِدِرَالِيَّة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "حِلْف"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود الحِلْف بمعنى المعاهدة على التعاضد في المعجم الوسيط وغيره، فإنه يدل على العهد والميثاق نفسه (الكيان) لا على حالة التحالف (الهيئة المجردة). كما أن المعنى الأبرز له هو القَسَم واليمين مما يوقع في اشتراك لفظي. والحِلْف أقرب إلى synset آخر يدل على 'treaty/pact' منه إلى هذه المجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "مُحَالَفَة"
      source: stage1
      decision: removed
      decision_reason: "المحالفة تدل على فعل المعاهدة المتبادلة لا على الحالة الناتجة عنها. ووزن مُفَاعَلَة يؤكد دلالة الحدث لا دلالة الحالة. ومصدر تَفَاعُل (تَحَالُف) أنسب للدلالة على الحالة المستمرة."
      evidence_assessment:
        case: confirm_only

    - lemma: "تَعَاهُد"
      source: stage1
      decision: removed
      decision_reason: "لم تُوجد أدلة معجمية تربط تَعَاهُد بمعنى التحالف السياسي تحديداً. المعنى أعم (التزام متبادل بأي شيء) ولا يختص بالتحالف."
      evidence_assessment:
        case: no_material

    - lemma: "حِلَاف"
      source: stage1
      decision: removed
      decision_reason: "ورد فقط في المورد الحديث (ترجمة ثنائية اللغة) ولم يُثبَّت في أي معجم عربي أحادي اللغة أو كلاسيكي. لا يكفي مصدر واحد ثنائي اللغة لإثبات مصطلح."
      evidence_assessment:
        case: confirm_only

