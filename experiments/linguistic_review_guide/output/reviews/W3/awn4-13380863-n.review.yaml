# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13380863-n (bank account)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (حساب بنكي)، والمصطلح البديل الفصيح «حساب مصرفي» غائب"
      - "التعريف العربي ترجمة حرفية للإنجليزي وفيه لفظ «صندوق» وهو ترجمة غير دقيقة لـ fund في السياق المصرفي"
      - "لفظ «بنكي» معرّب، والأولى إضافة المقابل العربي «مصرفي» للتوازن بين الشيوع والفصاحة"
    observations: "المفهوم مركزي في المعاملات المالية الحديثة وله حضور قوي في المعجمات المصطلحية العربية (المعجم الموحد للتجارة والمحاسبة، المعجم الموحد للقانون، المورد الحديث). المصطلح العربي الأصيل هو «حساب مصرفي» من جذر «صرف» الدالّ على تحويل النقد وتبديله، بينما «بنكي» نسبة إلى «بنك» المعرّبة من الإيطالية banco."

  blind_candidates:
    - lemma: "حِسَابٌ مَصْرِفِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «حساب» (العدّ والتسجيل المالي) و«مصرفي» (نسبة إلى المصرف من جذر صرف). هو المصطلح الرسمي في المعجمات الموحدة العربية للدلالة على الحساب الذي يُفتح لدى المصرف."
    - lemma: "وَدِيعَةٌ مَصْرِفِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «وديعة» (ما استُودع للحفظ) و«مصرفية». المفهوم قريب من الائتمان المذكور في التعريف، لكنّ الوديعة تدلّ على المال المُودَع لا على الحساب نفسه."
    - lemma: "رَصِيدٌ"
      generation_method: ishtiqaq
      justification: "من جذر «رصد» على وزن فَعِيل، يدلّ على ما رُصد من مال. يُستعمل عادة بمعنى المبلغ المتبقي في الحساب (balance) لا الحساب ذاته."
    - lemma: "أَمَانَةٌ مَصْرِفِيَّةٌ"
      generation_method: tarkib
      justification: "مركب وصفي من «أمانة» (من أمن/ائتمن) و«مصرفية». يتوافق مع مفهوم الائتمان في التعريف، لكنّه غير مسكوك كمصطلح مالي ثابت."

stage2_evidence:
  per_lemma:
    - lemma: "حِسَابٌ بَنْكِيٌّ"
      confirm:
        - text: "«حساب بنكي، حساب مصرفي»"
          source: "مسرد الفن والتسلية والرياضة — المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«حساب مصرفيّ، حساب بنكيّ» = bank account"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
      expands:
        - text: "«الْحساب: الْعد وَالْكثير الْكَافِي. الحساب الجاري (في الاقتصاد): اتفاق بين شخصين بينهم معاملات متبادلة»"
          source: "المعجم الوسيط"
          addition: "يبيّن أنّ «حساب» يُستعمل في السياق المالي بمعنى العلاقة المالية المتبادلة"

    - lemma: "حِسَابٌ مَصْرِفِيٌّ"
      confirm:
        - text: "«حساب مصرفي» = bank account"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«حساب مَصْرِفيّ.» = bank account"
          source: "المورد الحديث (2008)"
        - text: "«حساب مصرفيّ، حساب بنكيّ» = bank account"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«حساب بنكي، حساب مصرفي» = Bank account"
          source: "مسرد الفن والتسلية والرياضة — ArabTerm"

    - lemma: "وَدِيعَةٌ مَصْرِفِيَّةٌ"
      contradicts:
        - text: "«الوَدِيعة: المالُ المتروكُ عند إنسان يحفظه»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "الوديعة تدلّ على المال المُودَع نفسه لا على الحساب بوصفه علاقة مالية"
        - text: "«الوديعة: لغة: من الإيداع، وهو استنابة في الحفظ»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "المعنى المعجمي هو فعل الإيداع والحفظ، لا الحساب المصرفي"
      expands:
        - text: "«وديعة» = deposit"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "وديعة مصطلح مالي ثابت لكنه يقابل deposit لا bank account"

    - lemma: "رَصِيدٌ"
      contradicts:
        - text: "«رصيد حساب المصرف» = balance of bank account"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "الرصيد هو المبلغ المتبقي في الحساب (balance)، لا الحساب نفسه"

    - lemma: "أَمَانَةٌ مَصْرِفِيَّةٌ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "حِسَابٌ بَنْكِيٌّ"
      decision: confirmed
      decision_reason: "مصطلح شائع مثبت في عدة معجمات مصطلحية (المعجم الموحد للقانون، مسرد ArabTerm). لفظ «بنكي» معرّب مستقرّ في الاستعمال المعاصر وله حظّ من الشيوع يفوق «مصرفي» في بعض السياقات."
