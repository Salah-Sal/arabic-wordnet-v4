        mwe_type: wasfi
      nuance_differentiation: "يُستعمل في اللغة اليومية والإعلامية أكثر من «مصرفي»، وهو الأقرب إلى الاستعمال العامّي والتجاري غير الرسمي."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِسَابٌ بَنْكِيٌّ"

    - lemma: "حِسَابٌ مَصْرِفِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "المصطلح الرسمي المعتمد في المعجمات الموحدة العربية (التجارة والمحاسبة ١٩٩٥، القانون ٢٠١٧، المورد الحديث ٢٠٠٨). «مصرفي» مشتقّ من جذر عربي أصيل «صرف» وهو أفصح من «بنكي» المعرّبة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُستعمل في السياقات الرسمية والقانونية والمؤسسية. وهو المفضّل في المعجمات الموحدة ومجامع اللغة العربية لكونه عربيّ الاشتقاق."
      actions:
        - command: create_entry
          params: {lemma: "حِسَابٌ مَصْرِفِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "وَدِيعَةٌ مَصْرِفِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "الوديعة تدلّ على المال المُودَع نفسه (deposit) لا على الحساب المصرفي بوصفه علاقة مالية. الفرق واضح في المعجمات المصطلحية: deposit ≠ bank account."
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَصِيدٌ"
      source: stage1
      decision: removed
      decision_reason: "الرصيد هو المبلغ المتبقي في الحساب (balance)، لا الحساب نفسه. ورد في المعجم الموحد «رصيد حساب المصرف» = balance of bank account، مما يؤكد التمايز الدلالي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "أَمَانَةٌ مَصْرِفِيَّةٌ"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثَر على أدلة معجمية تؤيّد استعمال هذا التركيب مصطلحاً مالياً ثابتاً. «أمانة» في السياق المالي لها دلالات أخرى (fiduciary/trust)، وهو غير مسكوك."
      evidence_assessment:
        case: no_material

