stage1_review:
  assessment:
    concerns:
      - "لا توجد مشكلات ملحوظة؛ المفهوم واضح ويعبر عن وحدة من تنسيق الزهور."
    observations: "التعريف يعبر بدقة عن الغصن أو الفرع الذي يحمل أزهاراً ويُستخدم في التنسيق الزخرفي (spray)."
  blind_candidates:
    - lemma: "فَنَنٌ مُزْهِرٌ"
      generation_method: tarkib
      justification: "التركيب الوصفي من 'فنن' بمعنى الغصن، و'مزهر' يحمل الزهر."
    - lemma: "غُصَيْنٌ مُزْهِرٌ"
      generation_method: tarkib
      justification: "التركيب الوصفي للتعبير عن فرع صغير مزهر يضاف للتنسيق."
    - lemma: "طَاقَةُ زَهْرٍ"
      generation_method: tarkib
      justification: "تركيب إضافي يُستعمل للكمية القليلة من الزهر أو الحزمة الصغيرة."
    - lemma: "عُنْقُودٌ زَهْرِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي لفرع يحمل مجموعة أزهار في تكوين واحد."

stage2_evidence:
  per_lemma:
    - lemma: "غصن مزهر"
      confirm:
        - text: "(1) «أ» عُسْلُوْج أو غصنٌ [مُزْهِرٌ عادةً]. «ب» زهرات منسّقة للتزيين [على ثوب أو مائدة أو نعش]"
          source: "المورد الحديث (2008)"
    - lemma: "عنقود زهري"
      contradicts:
        - text: "نورة زهرية متفرعة، وتكون عادة سائبة ومتفرعة بطريقة غير منتظمة. (translation: panicle)"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          conflict: "يشير إلى مفهوم نباتي (Panicle) وليس لتنسيق زهور للزينة."
    - lemma: "طاقة زهر"
      evidence_status: "no_material_found"
    - lemma: "فنن مزهر"
      evidence_status: "no_material_found"
    - lemma: "غصين مزهر"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "غصن مزهر"
      decision: confirmed
      decision_reason: "تعبير دقيق وموثق في القواميس المزدوجة (كالمورد) للدلالة على الغصن المستخدم في الزينة (spray)."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غُصْنٌ مُزْهِرٌ"
    - lemma: "فَنَنٌ مُزْهِرٌ"
      source: stage1
      decision: removed
      decision_reason: "تعبير سياقي غير شائع كمسكوك اصطلاحي مقارنة بـ 'غصن مزهر'."
    - lemma: "غُصَيْنٌ مُزْهِرٌ"
      source: stage1
      decision: removed
      decision_reason: "استخدام التصغير غير ضروري؛ واللفظ 'غصن مزهر' يفي بالغرض وهو الأشيع."
    - lemma: "طَاقَةُ زَهْرٍ"
      source: stage1
      decision: removed
      decision_reason: "الطاقة تفيد الحزمة أو الباقة المكتملة، بينما المجموعة الترادفية تخص غصناً منفرداً."
    - lemma: "عُنْقُودٌ زَهْرِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "مصطلح علمي نباتي يشير إلى (panicle) وليس إلى تنسيق للزينة."

stage4_content:
  definition:
    current: "تنسيق زهور يتكون من غصن واحد أو فرع يحمل أزهاراً وأوراقاً"
    assessment:
      decision: retain
      reason: "التعريف دقيق وشامل ويصوّر المفهوم بوضوح بأسلوب معجمي سليم."
  examples:
    per_lemma:
      - lemma: "غصن مزهر"
        examples:
          - text: "زيّنت المائدة بوضع غُصْنٍ مُزْهِرٍ في مِزهَرِيَّةٍ أنيقة."
            type: usage
    actions:
      - command: add_sense_example
        params: {sense_id: "{auto}", text: "زيّنت المائدة بوضع غُصْنٍ مُزْهِرٍ في مِزهَرِيَّةٍ أنيقة."}

stage5_enrichment:
  per_entry:
    - lemma: "غُصْنٌ مُزْهِرٌ"
      entry_id: "{auto}"
      roots:
        - word: "غصن"
          root: "غصن"
          maqayis_quote: "«الْغَيْنُ وَالصَّادُ وَالنُّونُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ غُصْنُ الشَّجَرَةِ، وَالْجَمْعُ غُصُونٌ وَأَغْصَانٌ.»"
        - word: "مزهر"
          root: "زهر"
          maqayis_quote: "«الزَّاءُ وَالْهَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حُسْنٍ وَضِيَاءٍ وَصَفَاءٍ. مِنْ ذَلِكَ الزُّهَرَةُ: النَّجْمُ. وَمِنْهُ الزَّهْرُ، وَهُوَ نَوْرُ كُلِّ نَبَاتٍ»"
  per_sense:
    - lemma: "غُصْنٌ مُزْهِرٌ"
      sense_id: "{auto}"
      nuance: "يعبر عن التنسيق الزخرفي المعتمد على فرع أو غصن واحد يحمل أزهاراً."
      mwe: true
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"غصن","root":"غصن","maqayis":"«الْغَيْنُ وَالصَّادُ وَالنُّونُ كَلِمَةٌ وَاحِدَةٌ، وَهِيَ غُصْنُ الشَّجَرَةِ، وَالْجَمْعُ غُصُونٌ وَأَغْصَانٌ.»"},{"word":"مزهر","root":"زهر","maqayis":"«الزَّاءُ وَالْهَاءُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى حُسْنٍ وَضِيَاءٍ وَصَفَاءٍ. مِنْ ذَلِكَ الزُّهَرَةُ: النَّجْمُ. وَمِنْهُ الزَّهْرُ، وَهُوَ نَوْرُ كُلِّ نَبَاتٍ»"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يعبر عن التنسيق الزخرفي المعتمد على فرع أو غصن واحد يحمل أزهاراً.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.95