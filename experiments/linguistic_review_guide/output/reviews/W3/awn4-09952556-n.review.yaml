# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «إسكافي» تفتقر إلى تشكيل كامل في بيانات المجموعة."
      - "اللمّة «صانع أحذية» عبارة وصفية حرة تُكرّر مفردات التعريف نفسه، وليست وحدة معجمية مثبتة؛ تخفق في اختبار التثبيت المعجمي."
      - "ألفاظ راسخة ومعجمية كـ«خَرَّاز» و«حَذَّاء» و«نَعَّال» و«إِسْكَاف» (الشكل الأصيل) غائبة عن المجموعة."
    observations: >
      المجموعة تتناول مهنة صناعة الأحذية وإصلاحها، وهي مفهوم عربي أصيل ذو حضور ثري في المعجمية العربية
      الكلاسيكية والحديثة. ثمة عدة مصطلحات راسخة في التراث اللغوي كالإسكاف والخراز والحذّاء والنعّال،
      كلها مشتقة من جذور عربية فصيحة أو مُعرَّبة قديمة. اللمّتان الحاليتان غير كافيتين لتمثيل المجموعة،
      وإحداهما (صانع أحذية) غير صالحة معجمياً كلمّة مستقلة.

  blind_candidates:
    - lemma: "خَرَّاز"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (خ ر ز) على وزن فَعَّال الدالّ على الاحتراف، وخَرْزُ الجلد يعني خياطته وثقبه،
        وهو صميم صناعة الأحذية وإصلاحها. الوزن مطّرد للحرف اليدوية (نجّار، حدّاد، بنّاء).
    - lemma: "حَذَّاء"
      generation_method: ishtiqaq
      justification: >
        مشتق من (ح ذ و) على وزن فَعَّال، والحِذاء هو النعل أو الحذاء، فالحَذَّاء هو صانعه وبائعه.
        الاشتقاق مطّرد وموثّق في المعاجم الكلاسيكية والمعاصرة.
    - lemma: "نَعَّال"
      generation_method: ishtiqaq
      justification: >
        مشتق من (ن ع ل) على وزن فَعَّال، والنَّعْل هي القطعة التي تُوطأ، وهي أصل كلمة الحذاء في العربية.
        النَّعَّال: صانع النِّعال. الاشتقاق قياسي، والمصطلح موثّق في المعجم الوسيط.
    - lemma: "إِسْكَافٌ"
      generation_method: majaz
      justification: >
        لفظ قديم ورد في المصادر العربية الكلاسيكية بمعنى صانع الأحذية، وإن كان أصله إِسْكَاف
        يحتمل التعريب القديم؛ إلا أن العرب استعملته واشتقوا منه (إسكافيّ) وأجروه مجرى كلماتهم.
        ابن فارس ذكر أن «كلّ صانع إسكافٌ عند العرب».


