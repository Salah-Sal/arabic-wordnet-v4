        عبارة وصفية حرة تُكرّر مفردات التعريف (صانع + الأحذية)، مُخالِفةً قاعدة عدم الدوران.
        تخفق في اختبار التثبيت المعجمي: يمكن إبدال «أحذية» بـ«نعال» أو «جلود» وتبقى العبارة
        صالحة كوصف، مما يثبت أنها ليست وحدة معجمية. لا وجود لها كمدخل مسكوك في أيٍّ من
        المعاجم المستعملة، كما أن الإحالة إليها في التعريفات تكون دائماً بوصفها شرحاً لمصطلح
        آخر (إسكاف، خراز، حذاء)، لا مصطلحاً قائماً بذاته.
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "إِسْكَافٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        الشكل الأصيل الذي وردت منه إسكافيّ (بالنسبة). موثّق مستقلاً في المعجم الوسيط والمعجم الكبير
        والتوقيف على مهمات التعاريف. ابن فارس ذكره صراحةً وإن أشار إلى أنه معرَّب قديم استعرب العرب
        واشتقوا منه. دلالته على صانع الأحذية ومصلحها مُصرَّح بها في المعجم الوسيط.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الشكل الكلاسيكي الأقدم، يستعمله الكتّاب والأدباء في السياقات الرسمية والأدبية.
        كان يدل في الأصل على كل صانع عند العرب، ثم خُصّص بصانع الأحذية. يُغاير إسكافيّ
        في التجريد (إسكاف: الحرفة، إسكافيّ: الصانع صاحب الحرفة).
