        examples:
          - text: "يشترط فتح حساب وساطة لدى شركة مرخّصة قبل البدء بتداول الأسهم في السوق المالية."
            type: usage
      - lemma: "حِسَابُ سَمْسَرَةٍ"
        examples:
          - text: "أودع المستثمر مبلغاً في حساب السمسرة تمهيداً لشراء أسهم في الطرح العام الأوّلي."
