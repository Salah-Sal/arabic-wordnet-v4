      decision_reason: "المقابل الأدقّ معجمياً لـ brokerage account؛ «سمسرة» هو المصطلح المعتمد في معاجم ALECSO للتجارة والمحاسبة والقانون مقابل brokerage، و«حساب» مقابل account. المركّب الإضافي واضح البنية ومتّسق مع نظائره (حساب الاستثمار، حساب المتاجرة)."
      evidence_assessment:
