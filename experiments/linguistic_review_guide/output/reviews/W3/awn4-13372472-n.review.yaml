      decision: revise
      reason: "الجنس القريب «صندوق» غير دقيق؛ الفائق المباشر هو «حساب» لا «صندوق». كما أنّ التعريف مترجم حرفياً من الإنجليزية (fund → صندوق). ينبغي إعادة صياغته بأسلوب المعجم الوسيط مع استعمال «حساب» جنساً قريباً."
    authored:
      - type: terminological
        text: "حسابٌ يفتحه العميل لدى شركة سمسرة أوراق مالية لإيداع أمواله وتنفيذ أوامر البيع والشراء في الأسواق المالية نيابةً عنه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "حسابٌ ماليٌّ يُودِع فيه المستثمر أمواله لدى وسيط مالي مرخَّص ليتولّى تداول الأوراق المالية بالنيابة عنه"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "حسابٌ يفتحه العميل لدى شركة سمسرة أوراق مالية لإيداع أمواله وتنفيذ أوامر البيع والشراء في الأسواق المالية نيابةً عنه"

