      evidence_assessment:
        case: mixed

    - lemma: "حِسَابٌ اسْتِثْمَارِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "حساب الاستثمار (investment account) أعمّ من حساب الوساطة؛ قد يكون في مصرف أو صندوق استثماري لا بالضرورة لدى شركة سمسرة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "مَحْفَظَةُ أَوْرَاقٍ مَالِيَّةٍ"
      source: stage1
      decision: removed
      decision_reason: "المحفظة (portfolio) تدلّ على مجموعة الأصول المالية المملوكة لا على الحساب نفسه المفتوح لدى الوسيط؛ فرق جوهري بين الوعاء (الحساب) والمحتوى (المحفظة)."
      evidence_assessment:
