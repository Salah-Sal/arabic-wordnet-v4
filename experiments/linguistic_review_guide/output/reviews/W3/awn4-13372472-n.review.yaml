      decision_reason: "مركّب إضافي شائع في الاستعمال المالي المعاصر وإن كان «وساطة» أقلّ دقة معجمية من «سمسرة»؛ يبقى مقبولاً لشيوعه في أدبيات هيئات سوق المال العربية. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُفضَّل في السياقات الرسمية والتنظيمية لهيئات سوق المال، وقد يشمل الوساطة بمعناها الأوسع (شاملاً الاستشارات المالية)"
