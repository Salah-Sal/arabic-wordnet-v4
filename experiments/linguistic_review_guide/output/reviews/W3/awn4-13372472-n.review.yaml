# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13372472-n (brokerage account)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لفظ «وساطة» يدلّ في المعاجم العربية أساساً على التوسّط بين متنازعين (mediation)، لا على السمسرة المالية (brokerage)، فقد يُحدث لبساً دلالياً"
      - "التعريف يستعمل «صندوق» جنساً قريباً بينما الفائق المباشر هو «حساب»؛ ينبغي توحيد المصطلح"
      - "اللمّة الوحيدة «حساب وساطة» مركّب إضافي غير موثّق في المعاجم الاصطلاحية المتاحة"
    observations: "المفهوم ينتمي إلى حقل المال والمصارف وهو نوع من الحساب المالي يُفتح لدى شركة سمسرة أوراق مالية. المصطلح الإنجليزي brokerage account واضح البنية: حساب + وساطة/سمسرة. في العربية المعاصرة يُستعمل «حساب وساطة» و«حساب سمسرة» على السواء في أدبيات السوق المالية، لكنّ «سمسرة» أدقّ معجمياً لأنها المقابل المعتمد لـ brokerage في معاجم ALECSO."

  blind_candidates:
    - lemma: "حِسَابُ سَمْسَرَةٍ"
      generation_method: tarkib
      justification: "مركّب إضافي من «حساب» (الفائق المباشر) و«سمسرة» (المقابل المعجمي المعتمد لـ brokerage في معاجم التجارة والمحاسبة)"
    - lemma: "حِسَابُ تَدَاوُلٍ"
      generation_method: tarkib
      justification: "مركّب إضافي يربط الحساب بوظيفته الرئيسة وهي تداول الأوراق المالية؛ مصطلح شائع في لغة الأسواق المالية العربية"
    - lemma: "حِسَابٌ اسْتِثْمَارِيٌّ"
      generation_method: tarkib
      justification: "مركّب وصفي من «حساب» و«استثماري» (نسبة إلى الاستثمار)؛ مُوثّق في معجم التجارة والمحاسبة بمقابل investment account"
    - lemma: "مَحْفَظَةُ أَوْرَاقٍ مَالِيَّةٍ"
      generation_method: tarkib
      justification: "مركّب إضافي مُوثّق في معجم التجارة والمحاسبة بمقابل portfolio؛ يدلّ على وعاء الأوراق المالية لدى الوسيط"


stage2_evidence:
  per_lemma:
    - lemma: "حِسَابُ وَسَاطَةٍ"
      contradicts:
        - text: "«(الوساطة) (في القانون الدولي العام) محاولة دولة أو أكثر فض نزاع قائم بين دولتين أو أكثر عن طريق التفاوض الذي تشترك هي أيضاً فيه»"
          source: "المعجم الوسيط"
          conflict: "الوساطة في المعاجم تعني التوسّط بين متنازعين (mediation) لا السمسرة المالية (brokerage)"
      expands:
        - text: "«وساطة بحرية، سمسرة بحرية» = maritime brokerage; maritime broking"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "يدلّ على أنّ «وساطة» قد تُستعمل مرادفةً لـ«سمسرة» في بعض السياقات المالية والقانونية"
        - text: "«جاءت الوساطة في المعاجم بمعنى عمل الوسيط، أما الوسيلة أو السبب فيمكن التعبير عنها بحرف الجر الباء»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "الوساطة = عمل الوسيط، ما يسوّغ استعمالها في سياق الوساطة المالية"

    - lemma: "حِسَابُ سَمْسَرَةٍ"
      confirm:
        - text: "«سمسرة» = brokerage; broking"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«سمسرة» = brokerage"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«حساب» = account"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
        - text: "«السَّمْسَرَة: حرفة السمسار. جُعْلُه»"
          source: "المعجم الوسيط"
      expands:
        - text: "«سمسار أوراق مالية» = stock-broker"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          addition: "يؤكّد أنّ حقل السمسرة المالية يستعمل جذر «سمسر» لا «وسط»"
        - text: "«عقد يكلف بموجبه السمسار من طرف شخص بالبحث عن شخص آخر لربط علاقة بينهما قصد إبرام عقد»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
          addition: "تعريف قانوني دقيق للسمسرة يتّسق مع وظيفة حساب الوساطة"

    - lemma: "حِسَابُ تَدَاوُلٍ"
      confirm:
        - text: "«حساب المتاجرة» = trading account"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
      contradicts:
        - text: "«حساب المتاجرة» = trading account"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "حساب التداول/المتاجرة مفهوم محاسبي مختلف عن حساب الوساطة؛ الأول يتعلق بحساب أرباح وخسائر التجارة لا بحساب العميل لدى الوسيط"

    - lemma: "حِسَابٌ اسْتِثْمَارِيٌّ"
      contradicts:
        - text: "«حساب الاستثمار» = investment account"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "حساب الاستثمار مفهوم أعمّ من حساب الوساطة؛ قد يكون في مصرف لا في شركة سمسرة"

    - lemma: "مَحْفَظَةُ أَوْرَاقٍ مَالِيَّةٍ"
      contradicts:
        - text: "«محفظة أوراق مالية، حافظة أوراق مالية» = portfolio"
          source: "المعجم الموحد لمصطلحات التجارة والمحاسبة (1995)"
          conflict: "المحفظة (portfolio) تدلّ على مجموعة الأوراق المالية المملوكة لا على الحساب المفتوح لدى الوسيط"


