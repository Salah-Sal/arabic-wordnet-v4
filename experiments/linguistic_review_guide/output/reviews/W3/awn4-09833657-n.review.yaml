# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:

  # أ. التقييم الأولي (بعد الاطلاع على synset_info الكامل)
  assessment:
    concerns:
      - "الدوران المعجمي: «محلل» واردة في التعريف ولمّةً في الوقت ذاته، مما يُفضي إلى التعريف بالمعرَّف"
      - "اللمّتان «فاحص المعادن» و«محلل المعادن» عبارتان وصفيتان حرتان لا وحدتان معجميتان راسختان ومُثبَّتتان في المعاجم"
      - "اختبار السكّ: يمكن إبدال «فاحص» بـ«مختبِر» و«محلل» بـ«باحث» مع بقاء الوصف صالحاً، مما يدلّ على أنهما عبارتان لا مصطلحان"
      - "صياغة التعريف «يقوم بإجراء اختبارات» مُطوَّلة وتخالف الإيجاز المعجمي المطلوب"
      - "تعريف المجموعة الأمّ (awn4-09809923-n): «شخص ماهر في تحليل البيانات» يبدو خاطئاً أو منقوصاً؛ التحليل هنا ليس تحليل بيانات حسابية"
    observations: >
      يملك التراث العربي الكيميائي مصطلحاً أصيلاً وراسخاً للمفهوم هو «الرَّازِن» المشتق من
      «رَزَنَ المعدنَ» بمعنى اختباره وتقدير نقاوته؛ وهو مُسجَّل في المعجم الوسيط والمعجم الكبير
      مُقابلاً لعملية «assay» الكيميائية، وفي المورد الحديث مُقابلاً صريحاً للفاعل «assayer».
      وبالمثل «المُعايِر» (لا يُخلَط بـ«مُعَيِّر») وارد في المورد الحديث مُقابلاً للمفهوم.
      أما «فاحص المعادن» فتعبير وصفي عام يُفيد لكنه أوسع دلالةً من assayer،
      و«محلل المعادن» أعمّ منه إذ يشمل أنواعاً من التحليل لا تقتصر على تقدير العيار.
      يُستحسن إضافة «الرَّازِن» مصطلحاً أساسياً وتحسين التعريف.

  # ب. التوليد الأعمى (من التعريف المُقنَّع فقط، قبل الاطلاع على اللمّات)
  blind_candidates:
    - lemma: "مُعَيِّر"
      generation_method: ishtiqaq
      justification: >
        مشتق من الجذر عير/عيار على وزن مُفَعِّل؛ العِيار هو معيار نقاوة المعدن ونسبته
        الخالصة، فالمُعَيِّر هو من يُقدِّر عيار المعدن كيميائياً. وهو وزن شائع للمحترف
        الدائم المزاولة (مُدرِّس، مُهندس، مُكيِّف).

    - lemma: "الرَّازِن"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من رَزَنَ على وزن فاعِل؛ أصل الجذر رزن يدلّ على تقدير الثِّقَل والثبات.
        واشتُقَّ منه «الرَّزْن» مصطلحاً كيميائياً بمعنى اختبار الفلزات لتقدير كمية كل
        معدن فيها (مج)، فالرَّازِن هو القائم بعملية الرَّزْن على مزاولي المعادن.

    - lemma: "نَقَّاد"
      generation_method: majaz
      justification: >
        إحياء للمعنى الأصيل قبل تخصُّصه في النقد الأدبي؛ نَقَدَ أصلاً = اختبر الدراهم
        وميّز جيّدها من رديئها. النقَّاد هو فعَّال يدلّ على الاحتراف والمواظبة في
        الاختبار. يُطلق بالمجاز على مُختبِر المعادن لاشتراك المفهوم الوظيفي.

    - lemma: "مُمَحِّص"
      generation_method: ishtiqaq
      justification: >
        مشتق من محَّص يُمحِّص على وزن مُفَعِّل؛ مَحَّصَ الشيءَ: خلَّصه من شوائبه وعيوبه
        وامتحنه. وهو قريب دلالياً من الاختبار الكيميائي للمعادن بقصد تحديد نقاوتها
        وتخليصها مما يشوبها.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — batch headword lookup: فاحص/محلل/معير/ممحص/نقاد (5-8 lemmas + ال forms)
#   Q2 — English bridge: assayer / assay / metallurgist
#   Q3 — validation: معاير/رازن/معايرة/رزن/عيار
#   Q4 — Maqayis al-Lugha: roots فحص/حلل/رزن/عير/محص
# المجموع: 4 استعلامات
stage2_evidence:

  per_lemma:

    - lemma: "فاحص المعادن"
      confirm:
        - text: >
            «فاحِص: (المعجم الطبي الموحد 2009) — translation_en: "tester"»
            [domain: The Unified Medical Dictionary]
          source: "المعجم الطبي الموحد (ARABTERM 2009)"
        - text: >
            «(فَحَصَ) الْفَاءُ وَالْحَاءُ وَالصَّادُ أَصْلٌ صَحِيحٌ، وَهُوَ كَالْبَحْثِ
            عَنِ الشَّيْءِ. يُقَالُ: فَحَصْتُ عَنِ الْأَمْرِ إِذَا بَحَثْتَ عَنْهُ.»
          source: "مقاييس اللغة لابن فارس (entry 988035)"

    - lemma: "محلل المعادن"
      confirm:
        - text: >
            «مُحَلِّل: تقال عن الشخص الذي يقوم بمهمة تحليل المشكل المطروح ووضع
            الخوارزمية المناسبة لحله قبل برمجة الحل على الحاسوب — translation_en: "analyst"»
          source: "المعجم الموحد لمصطلحات تقانة المعلومات 2011 (ARABTERM)"
        - text: >
            «مُحَلِّل — translation_en: "analyser (analyzer)"» [domain: The Unified Medical Dictionary]
          source: "المعجم الطبي الموحد 2009 (ARABTERM)"
        - text: >
            «مُحَلِّل — translation_en: "analyst"»
            [domain: Dictionary of Information Technology Terms]
          source: "معجم مصطلحات المعلوماتية 2000 (ARABTERM)"
        - text: >
            «(٣) يَرْزُن؛ يُعاير؛ يحلِّل to assay an ore؛ (٥) الرَّزْن؛ المُعايرة:
            التحليل الكَمّيّ أو النوعيّ لمادةٍ ما — translation_en: "assay"»
          source: "المورد الحديث 2008 (ARABTERM، entry 671483)"
          addition: "يُثبت أن «يُحلِّل» فعلٌ مُرادف لـ assay، مما يدعم «محلل المعادن» كعنوان للمهنة"

    - lemma: "مُعَيِّر"
      confirm:
        - text: >
            «مُعَيِّر — translation_en: "calibrator"» [domain: The Unified Medical Dictionary]
          source: "المعجم الطبي الموحد 2009 (ARABTERM، entry 552458)"
      contradicts:
        - text: >
            «مُعيِّر: من (ع ي ر) الناسب غيره إلى كل ما يلزم منه سُبَّة
            والمقبِّح عليه فعله.»
          source: "موسوعة السلطان قابوس لأسماء العرب (entry 945393)"
          conflict: >
            وزن مُفَعِّل من عيَّر يعني «العائب» و«الشاتم» في المصادر التراثية،
            لا من عايَر/يُعاير. المصطلح الصحيح للمعنى المقصود هو «مُعايِر» (وزن
            مُفاعِل من عاير) لا «مُعَيِّر» (وزن مُفَعِّل من عيَّر).

    - lemma: "الرَّازِن"
      confirm:
        - text: >
            «الرّازن؛ المُعايِر: كيميائيّ خبير في رَزْن الذهب إلخ.
            — translation_en: "assayer"»
          source: "المورد الحديث 2008 (ARABTERM، entry 671484)"
        - text: >
            «الرَّزْن (في الكيمياء): تقدير النقاوة أو المقدار في مادة موجودة في
            خليط ما. اختبار المعدنيات أو الفلزات لتقدير كمية كل معدن أو فلز على حدة. (مج)»
          source: "المعجم الوسيط (OCR، entry 10595)"
          addition: "يُثبت دلالة الرَّزْن (الفعل) على اختبار الفلزات، مما يُرسّخ الرَّازِن بوصفه القائم بهذه العملية"
        - text: >
            «الرَّزْن: اختبار المعدنيات أو الفلزات لتقدير كمية كل معدنى أو فلز على حدة. (مج)»
          source: "المعجم الكبير (OCR، entry 40288)"
        - text: >
            «(رَزَنَ) الرَّاءُ وَالزَّاءُ وَالنُّونُ أَصْلٌ يَدُلُّ عَلَى تَجَمُّعٍ
            وَثَبَاتٍ. يَقُولُونَ رَزُنَ الشَّيْءُ: ثَقُلَ.»
          source: "مقاييس اللغة لابن فارس (entry 986526)"
          addition: "الأصل الدلالي «الثقل والثبات» ينسجم مع الرَّزْن بمعنى تقدير الوزن الكيميائي للمعادن"

    - lemma: "نَقَّاد"
      expands:
        - text: >
            «النَّقَّادُ: الذى يَنْقُد الدَّرَاهِم وغيرها. راعى النَّقَد: الغنم, أو صاحِبُها.»
          source: "المعجم الوسيط (OCR، entry 29908)"
          addition: "يُثبت أن النقاد أصلاً مختبِر النقود ومميِّز جيّدها من رديئها، وهو مفهوم مجاور لكنه أكثر تخصصاً في النقد المعدني لا الخامات الطبيعية"
        - text: >
            «(النقاد) الَّذِي ينْقد الدَّرَاهِم وَغَيرهَا وراعي النَّقَد الغنم أَو صَاحِبهَا.»
          source: "المعجم الوسيط لمجموعة من المؤلفين (hawramani، entry 886110)"

    - lemma: "مُمَحِّص"
      evidence_status: "no_material_found"
      # ملاحظة: الوارد في المعاجم هو «المُمَحَّص» (اسم مفعول = المخلَّص من عيوبه)
      # لا «المُمَحِّص» (اسم فاعل = المُخلِّص). لا دليل على استعمال الصيغة الفاعلة.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    # ─── لمّة موجودة ١ ───
    - lemma: "فاحص المعادن"
      decision: confirmed
      decision_reason: >
        التعبير وصفي واضح الدلالة ومفهوم في سياقه، وإن كان لا يرقى إلى مستوى
        المصطلح المسكوك. «فاحص» مشتق صحيح على وزن فاعل من فحص، وهو وارد
        في ARABTERM مقابلاً لـ"tester". يُبقى في المجموعة بوصفه تعبيراً إضافياً مألوفاً
        مع إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على جانب «الفحص» بمعنى التدقيق الحسّي والتحليلي المباشر للمعادن؛
        أعمّ من الرَّازِن الذي ينصبّ تحديداً على تقدير العيار والنقاوة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "فَاحِصُ المَعادِن"

    # ─── لمّة موجودة ٢ ───
    - lemma: "محلل المعادن"
      decision: confirmed
      decision_reason: >
        «محلل» موثّق في عشرات مداخل ARABTERM بمعنى "analyst/analyser"، وهو المقابل
        المعياري في المصطلحية العربية الحديثة للعالِم المحترف في التحليل الكيميائي.
        التعبير الإضافي «محلل المعادن» مفهوم وشائع في السياق التقني.
        تحفُّظ: دلالته أوسع من assayer إذ يشمل التحليل الطيفي والكيميائي وغير ذلك.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على «التحليل» بمعنى تفكيك المكوّنات الكيميائية ورصدها بالمنهج العلمي،
        دلالته أشمل من فاحص المعادن، وأعمّ من الرَّازِن المقتصر على تقدير العيار.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُحَلِّلُ المَعادِن"

    # ─── مرشح المرحلة ١ — أ ───
    - lemma: "مُعَيِّر"
      source: stage1
      decision: removed
      decision_reason: >
        الوزن الصرفي مُفَعِّل من «عيَّر» يحمل في التراث دلالة «العائب والشاتم»
        (موسوعة السلطان قابوس)، لا «الكيمياوي المختبِر». أما ARABTERM فيعطيه
        "calibrator" لا "assayer". المصطلح الصحيح للمعنى المنشود هو «مُعايِر»
        (مُفاعِل من عاير يُعاير = كيَّل واختبر)، وهو المُثبَّت في المورد الحديث.
        يُرفض المرشح بسبب الخلط الوزني والدلالي.
      evidence_assessment:
        case: mixed

    # ─── مرشح المرحلة ١ — ب ───
    - lemma: "الرَّازِن"
      source: stage1
      decision: confirmed
      decision_reason: >
        المصطلح موثَّق توثيقاً صريحاً في المورد الحديث (2008) مقابلاً لـ"assayer"،
        والرَّزْن كعملية موثَّق في المعجم الوسيط والمعجم الكبير بمعنى «اختبار الفلزات
        لتقدير كمية كل معدن». الوزن فاعِل على الجذر رزن سليم صرفياً. المصطلح
        مسكوك ومُثبَّت في معجمَيْن موثوقَيْن. هو أدقّ مصطلح في المجموعة لأنه
        يُحيل مباشرةً إلى عملية الرَّزْن الخاصة باختبار المعادن.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الأكثر تخصصاً والأرسخ اصطلاحاً؛ يُحيل مباشرةً إلى عملية الرَّزْن
        الكيميائي لتقدير عيار المعادن ونقاوتها، خلافاً للمرادفَيْن الآخرَيْن اللذَيْن
        يحملان دلالة أشمل وأعمّ.
      actions:
        - command: create_entry
          params:
            lemma: "الرَّازِن"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ─── مرشح المرحلة ١ — ج ───
    - lemma: "نَقَّاد"
      source: stage1
      decision: removed
      decision_reason: >
        «النقاد» في أصله مختبِر الدراهم والنقود المعدنية لا خامات المعادن الطبيعية؛
        وهو مفهوم مجاور لا مُرادف. فضلاً عن ذلك، «نقاد» في الاستعمال المعاصر متخصِّص
        في النقد الأدبي والفني، مما يُربك الدلالة ويُوجد اشتراكاً لفظياً غير مرغوب.
      evidence_assessment:
        case: mixed

    # ─── مرشح المرحلة ١ — د ───
    - lemma: "مُمَحِّص"
      source: stage1
      decision: removed
      decision_reason: >
        لا توجد شواهد معجمية على استعمال «مُمَحِّص» (اسم الفاعل الفاعل المُخلِّص) بمعنى
        مختبِر المعادن. المسجَّل في المعاجم هو «المُمَحَّص» (اسم المفعول = المُنقَّى من
        عيوبه). لا أساس استعمالي كافٍ لإدراجه.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "محلل يقوم بإجراء اختبارات كيميائية على المعادن لتقييمها"
    assessment:
      decision: revise
      reason: >
        عيوب التعريف الحالي: (١) الدوران: «محلل» في التعريف ولمّةٌ في الآن ذاته؛
        (٢) الصياغة «يقوم بإجراء» مُطوَّلة تخالف إيجاز المعجم الوسيط؛
        (٣) «لتقييمها» غامض ولا يُحدِّد جوهر العمل وهو تقدير النقاوة وتحديد العيار؛
        (٤) التعريف ترجمة حرفية للإنجليزية لا تأليف معجمي مستقل.
    authored:
      - type: terminological
        text: "مَن يُجري الرَّزْنَ (الاختبار الكيميائي والفيزيائي) على المعادن والخامات لتقدير نقاوتها ونسب مكوّناتها وتحديد عياراتها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "خبير متخصص في رَزْن المعادن والفلزات؛ يُجري اختبارات كيميائية وفيزيائية دقيقة على عيّنات المعادن لتحديد تركيبها الكيميائي ونسبة العنصر الخالص فيها ودرجة نقاوتها وصلاحيتها للاستخدام الصناعي"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَن يُجري الرَّزْنَ (الاختبار الكيميائي والفيزيائي) على المعادن والخامات لتقدير نقاوتها ونسب مكوّناتها وتحديد عياراتها"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "خبير متخصص في رَزْن المعادن والفلزات؛ يُجري اختبارات كيميائية وفيزيائية دقيقة على عيّنات المعادن لتحديد تركيبها الكيميائي ونسبة العنصر الخالص فيها ودرجة نقاوتها"

  examples:
    per_lemma:
      - lemma: "فَاحِصُ المَعادِن"
        examples:
          - text: "أجرى فَاحِصُ المَعادِن اختباراتٍ دقيقةً على عيّنات الخام المُستخرَج من المنجم للكشف عن نسبة الذهب فيها"
            type: usage
