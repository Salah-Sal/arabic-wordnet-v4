# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-05256902-n (anastomosis)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تشابك» عامّة جداً؛ معناها الأصلي التداخل والاختلاط لا الربط الأنبوبي"
      - "لمّة «تشابك» تُستخدم في المعاجم الطبية الحديثة بدلالات أخرى: interdigitation، synapsis، interlocking"
      - "المجموعة تفتقر إلى مصطلحات طبية بديلة مُثبتة مثل تَفَمُّم وتَفَاغُم"
    observations: >
      التعريف العربي ترجمة مقبولة للتعريف الإنجليزي لكنه يستخدم تعبير «الهياكل الأنبوبية»
      وهو ترجمة حرفية لـ tubular structures. المفهوم طبي تشريحي واضح، ويشير إلى اتصال
      الأوعية أو القنوات بعضها ببعض طبيعياً أو جراحياً. مصطلح «مُفَاغَرَة» هو المصطلح
      المعياري في المعاجم الطبية الموحدة. أمّا «تشابك» فدلالته الأولى التداخل والتعقيد
      لا الربط الأنبوبي.
  blind_candidates:
    - lemma: "مُفَاغَرَة"
      generation_method: ishtiqaq
      justification: >
        من الجذر فغر (فَتْحٌ وانفتاح) على وزن مُفَاعَلَة، يدلّ على الفتح المتبادل بين
        فوّهتَي بنيتين أنبوبيتين لإحداث الاتصال. الوزن يناسب المشاركة بين طرفين.
    - lemma: "تَفَمُّم"
      generation_method: ishtiqaq
      justification: >
        من الجذر فمم (فَم) على وزن تَفَعُّل، يدلّ على إحداث فُوَّهة مشتركة بين عضوين
        أجوفين، وهو ترجمة اشتقاقية دقيقة للأصل اليوناني (ἀνά + στόμα = فم).
    - lemma: "تَفَاغُم"
      generation_method: ishtiqaq
      justification: >
        من الجذر فغم (تفتّح) على وزن تَفَاعُل، يدلّ على التفتّح المتبادل بين وعاءين
        أو قناتين حتى يلتحما. الوزن يناسب الاشتراك في الفعل.
    - lemma: "مُوَاصَلَة أُنْبُوبِيَّة"
      generation_method: tarkib
      justification: >
        تركيب وصفي من مُوَاصَلَة (من وصل: ضمّ شيء إلى شيء) وأُنْبُوبِيَّة (نسبة
        إلى الأنبوب)، يصف عملية وصل البنى الأنبوبية بعضها ببعض.


stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَشَابُك"
      confirm:
        - text: "«تشابك، مفاغرة — anastomosis»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
        - text: "«(2) تلاقٍ؛ تواصُل؛ تشابُك [بين خطين أو نهرين إلخ]»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(تشابك) الشَّيْء شَبكَ يُقَال تشابكت الْأُمُور اخْتَلَط بَعْضهَا بِبَعْض»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الأصلية هي التداخل والاختلاط لا الربط الأنبوبي المتصل"
        - text: "«تَشابُك — interdigitation»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي الأحدث يخصّص تشابك للتداخل الإصبعي لا للمفاغرة"
        - text: "«تَشابُك — synapsis (pairing)»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "يُستخدم تشابك أيضاً للتشابك الصبغي أثناء الانقسام الاختزالي"
        - text: "«تشابك — interlocking: تشابك توأمين أثناء الولادة»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: "في السياق التوليدي يعني التشابك الميكانيكي لا الربط الوعائي"
      expands:
        - text: "«تَشَابُك — knotting / tangling»"
          source: "المعجم الموحد لمصطلحات المياه (2000)"
          addition: "يُستخدم في هندسة المياه بمعنى الانسداد بالنباتات المتشابكة"

    - lemma: "مُفَاغَرَة"
      confirm:
        - text: "«مُفاغَرة — anastomosis: عنصر اتصال بين عضوين بمثل العصبين أو الوعائين»"
          source: "المعجم الموحد لمصطلحات علم التشريح العياني (2015)"
        - text: "«تشابك، مفاغرة — anastomosis»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
      expands:
        - text: "«مُفاغَرَةُ النِّهايَةِ بالنِّهايَة — end-to-end anastomosis»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "مُفاغرة مُنتِجة لعشرات المركبات الطبية في المعجم الموحد"
        - text: "«مِلْقاطُ المُفاغَرَة — anastomosis clamp»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "إنتاجية اشتقاقية عالية: تدخل في تسمية الأدوات الجراحية"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَفَمُّم"
      confirm:
        - text: "«تفمم — anastomosis: اتصال طبيعي أو محدث بين عضوين أجوفين»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«(1) «أ», التَّفَمُّم (مج): «ب» التحامٌ بين الأوعية الدموية (فس). «ج» التحام الأغصان أو العروق (نب)»"
          source: "المورد الحديث (2008)"
        - text: "«تفمم الأوعية — anastomosis of vessels: اتصال طبيعي مباشر أو غير مباشر بين وعاءين دمويين»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
      expands:
        - text: "«تفميم معوي — enteroanastomosis: توصيل جراحي بين جزأين من المعي»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "المشتقات تثبت حيوية الجذر: تفميم (إجراء جراحي) مقابل تفمّم (الحالة)"

    - lemma: "تَفَاغُم"
      confirm:
        - text: "«تفاغم — anastomosis: التحام ما بين الأوعية»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«تفاغم — anastomosis: امتزاج وعائي نباتي بأن يفنى الغشاء الذي يفصل أحدهما عن الثاني وتسكب جبلة الأول في جبلة الثاني فيصير لهما جبلة مشتركة»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
      expands:
        - text: "«مُفاغَمَة — inosculation»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "مُفاغمة (على وزن مُفاعلة) تقابل inosculation تحديداً، وتفاغم (تَفاعُل) يقابل anastomosis"

    - lemma: "مُوَاصَلَة أُنْبُوبِيَّة"
      contradicts:
        - text: "«مُوَاصَلَة — conductance»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "مُواصلة مخصصة في المعاجم العلمية للمواصلة الكهربائية (conductance) لا للربط التشريحي"
        - text: "«مواصلة — conductance»"
          source: "المعجم الموحد لمصطلحات الفيزياء (1989)"
          conflict: "نفس التخصيص في الفيزياء والجيولوجيا وعلوم الزلازل"


stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَشَابُك"
      decision: removed
      decision_reason: >
        الدلالة الأصلية لتَشابُك في المعجم الوسيط هي «اختلاط الأشياء بعضها ببعض»
        وهي تداخل عشوائي لا ربط منظّم بين فوّهات أنبوبية. في المعاجم الطبية الحديثة
        (المعجم الطبي الموحد 2009) يُخصَّص تشابك لـ interdigitation وsynapsis وinterlocking،
        وهي مفاهيم مغايرة للمفاغرة. وجوده في هذه المجموعة يُحدث اشتراكاً لفظياً ضارّاً
        في الشبكة الدلالية. المصدر الوحيد الذي يساويه بالمفاغرة هو معجم الصحة (1992)
        وهو أقدم وأقل تخصصاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُفَاغَرَة"
      decision: confirmed
      decision_reason: >
        المصطلح المعياري للمفاغرة (anastomosis) في المعاجم الطبية الموحدة العربية.
        مُشتقّ من فَغَرَ (فتح الفم) على وزن مُفاعَلة الدالّ على المشاركة، وهو منتج
        اشتقاقياً (عشرات المركبات في المعجم الطبي الموحد). مؤكَّد في معجم التشريح
        العياني (2015) ومعجم الصحة (1992).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        المصطلح الطبي التشريحي المعياري، يُستخدم في السياقات السريرية والجراحية
        والتشريحية. يركّز على البُعد الهيكلي: عنصر اتصال بين عضوين أنبوبيين.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُفَاغَرَة"

    # ── مرشحات المرحلة ١ ──
    - lemma: "تَفَمُّم"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مُثبت معجمياً لـ anastomosis في معجم المصطلحات الطبية (1985) والمورد
        الحديث (2008). مشتقّ من فَم على وزن تَفَعُّل، وهو ترجمة اشتقاقية للأصل اليوناني
        (ἀναστόμωσις من στόμα = فم). تعريفه «اتصال طبيعي أو محدث بين عضوين أجوفين»
        يطابق تعريف المجموعة. مشتقاته (تفميم = إجراء التفمّم الجراحي) تثبت حيويته.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يركّز على البُعد الوظيفي: إحداث فوّهة مشتركة (فم) بين تجويفين. أشمل من
        مفاغرة إذ يشمل أي عضوين أجوفين لا الأوعية والأعصاب فحسب. أقدم تاريخياً
        في المعاجم الطبية العربية.
      actions:
        - command: create_entry
          params:
            lemma: "تَفَمُّم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "تَفَاغُم"
      source: stage1
      decision: confirmed
      decision_reason: >
        مصطلح مُثبت في معجم الأحياء (1993) ومعجم الطب البيطري (2010) لـ anastomosis.
        من الجذر فغم (تفتّح) على وزن تَفَاعُل الدالّ على المشاركة. تعريفه في معجم
        الأحياء يصف الظاهرة بدقة: «امتزاج وعائي نباتي بأن يفنى الغشاء الفاصل».
        يغطي الاستعمال البيولوجي/النباتي الذي لا تغطيه مفاغرة بوضوح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُستخدم أساساً في السياق البيولوجي والنباتي، ويشير إلى الالتحام الطبيعي
        بين الأوعية بفناء الغشاء الفاصل. أقرب إلى المفاغرة الطبيعية منه إلى الجراحية.
      actions:
        - command: create_entry
          params:
            lemma: "تَفَاغُم"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُوَاصَلَة أُنْبُوبِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مُواصلة مخصصة في المعاجم العلمية الحديثة لمفهوم conductance (المواصلة
        الكهربائية) في الفيزياء والطب والجيولوجيا. استخدامها بمعنى الربط الأنبوبي
        يُحدث التباساً. فضلاً عن أنّ التركيب «مواصلة أنبوبية» ليس وحدة معجمية
        مسكوكة مُسجّلة.


stage4_content:
  definition:
    current: "ربط طبيعي أو جراحي لأجزاء أو فروع الهياكل الأنبوبية بحيث تصبح متصلة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية من الإنجليزية؛ تعبير «الهياكل الأنبوبية» غير
        مألوف في العربية الطبية (الأصوب: الأوعية والقنوات). كما ينقصه تحديد الجنس
        القريب بدقة.
    authored:
      - type: terminological
        text: >
          اتِّصالٌ طبيعيٌّ أو جراحيٌّ بين وعاءين أو قناتين أو أكثر من البُنى
          الأُنبوبيّة، بحيث يصير بينها مَمَرٌّ مشترك يسمح بمرور المحتويات.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          اتصالٌ بين وعاءَين دمويَّين أو عصبَيْن أو قناتَين أو نحوها من البُنى
          الأنبوبية في الجسم، يحدث طبيعياً في أثناء النموّ أو يُحدَث جراحياً لاستعادة
          جريان الدم أو السوائل. يشمل المفاغرات الشريانية الوريدية والمِعَوية وغيرها.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            اتِّصالٌ طبيعيٌّ أو جراحيٌّ بين وعاءين أو قناتين أو أكثر من البُنى
            الأُنبوبيّة، بحيث يصير بينها مَمَرٌّ مشترك يسمح بمرور المحتويات.

  examples:
    per_lemma:
      - lemma: "مُفَاغَرَة"
        examples:
          - text: "أجرى الجرّاحُ مُفاغرةً شريانيةً وريديةً لاستعادة التروية الدموية في الطرف المصاب."
            type: usage
      - lemma: "تَفَمُّم"
        examples:
          - text: "يُعدّ التفمّم الطبيعي بين الأوعية التاجية آليةً تعويضيةً مهمّةً عند انسداد أحدها."
            type: usage
      - lemma: "تَفَاغُم"
        examples:
          - text: "يحدث التفاغم في الأوراق النباتية بين العروق الدقيقة لتكوين شبكة متّصلة تنقل النسغ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "أجرى الجرّاحُ مُفاغرةً شريانيةً وريديةً لاستعادة التروية الدموية في الطرف المصاب."
      - command: add_sense_example
