# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14451395-n
# المفهوم: حالة الحرمان / the state of being debarred
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «منع» تدل على فعل المنع لا على حالة الحرمان الناتجة عنه، والمجموعة تصف حالةً (state) لا فعلاً"
      - "اللمّتان الموجودتان بلا تشكيل كامل"
    observations: >
      المجموعة تصف مفهوم الحرمان بوصفه حالةً يكون فيها الشخص مُستبعَداً من التمتع بحقوق أو ممتلكات أو ممارسات.
      المفهوم واضح في العربية وله تعبير طبيعي بلفظ «حِرْمان» (مصدر حَرَمَ على وزن فِعْلان).
      ينبغي التمييز بين الحالة الناتجة (حِرْمان) والفعل المُسبِّب (مَنْع)، إذ المجموعة تخصّ الأولى.
      فوق المجموعة (hypernym) هو «حالة التعرض للاستبعاد» (إقصاء/استبعاد)، مما يؤكد أن المفهوم حالة سلبية يقع فيها المحروم.
  blind_candidates:
    - lemma: "حَظْر"
      generation_method: ishtiqaq
      justification: "مصدر حَظَرَ على وزن فَعْل، يدل على المنع والتحريم، لكنه أقرب إلى فعل الحظر منه إلى حالة المحظور"
    - lemma: "مَنْع"
      generation_method: ishtiqaq
      justification: "مصدر مَنَعَ على وزن فَعْل، يدل على خلاف الإعطاء والحيلولة بين المرء والشيء"
    - lemma: "حَجْب"
      generation_method: ishtiqaq
      justification: "مصدر حَجَبَ على وزن فَعْل، يدل على الستر والمنع، واستُعمل في الفقه في حجب الإرث (حجب حرمان)"
    - lemma: "تَجْرِيد"
      generation_method: ishtiqaq
      justification: "مصدر جَرَّدَ على وزن تَفْعِيل، يدل على نزع الشيء وسلبه، واستُعمل في المورد بمعنى تجريد من الرتبة"

stage2_evidence:
  per_lemma:
    - lemma: "حِرْمَان"
      confirm:
        - text: "«الحِرْمَانُ: المَنْعُ (في القانون): المنع من مُباشرة حقّ أو حقوق مُقرَّرة للشخص بموجب أحكام القانون. مثل الحرمان من مُباشرة الحق فى التَّرْشِيح أو في الانْتِخاب»"
          source: "المعجم الكبير"
        - text: "«حرمان — deprivation»"
          source: "المعجم الموحد لمصطلحات القانون (2017)"
        - text: "«حِرْمان — deprivation»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«حرمان — privation»"
          source: "مسرد الفلسفة وعلم النفس"
      expands:
        - text: "«فقد أو غياب لأجزاء أو أعضاء أو قوى أو أشياء محتاج إليها»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "توسيع الدلالة إلى الفقد المادي/الجسدي لا القانوني فحسب"
        - text: "«غياب شيء وافتقاده في المدونة الحكائية لبروب، يُعارض بالتحصيل»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "استعمال اصطلاحي في السرديات بمعنى الفقدان"
        - text: "«(1) حِرْمان [وبخاصة من رتبة أو منصب] (2) فاقة؛ عَوَز؛ حِرمان (3) العَدَم: الفقدان أو عدم الوجود»"
          source: "المورد الحديث (2008)"
          addition: "يشمل الحرمان من المناصب والفاقة والعدم"
    - lemma: "مَنْع"
      confirm:
        - text: "«مَنْع؛ حَجْب؛ صدٌّ؛ استبعاد إلخ. — exclusion»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«المَنْعُ: أَن تَحُولَ بين الرجل وبين الشيء الذي يريده، وهو خلافُ الإِعْطاءِ»"
          source: "لسان العرب لابن منظور"
          conflict: "المنع فعل الحيلولة وهو سبب الحرمان لا الحرمان ذاته؛ المجموعة تصف الحالة الناتجة لا الفعل المُسبِّب"
        - text: "«(مَنَعَ) الْمِيمُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ هُوَ خِلَافُ الْإِعْطَاءِ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الجذر يدور حول فعل منع الشيء عن غيره، لا حالة المحرومية"
    - lemma: "حَظْر"
      contradicts:
        - text: "«الحَظْر: ما يُثَاب بتركه ويعاقب على فعله»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الحظر مصطلح شرعي يدل على التحريم الفقهي لا على حالة الحرمان من حق"
        - text: "«الْحَظْر: الْمَنْع وَفِي الشَّرْع مَا يُثَاب بِتَرْكِهِ ويعاقب على فعله»"
          source: "دستور العلماء للأحمدنكري"
          conflict: "المعنى الأصلي هو المنع الفعلي والشوك، لا الحالة الناتجة عن الاستبعاد"
    - lemma: "حَجْب"
      confirm:
        - text: "«الحجب: لغة المنع المطلق، واصطلاحاً منع شخص معين عن ميراثه كلاً أو بعضاً بوجود آخر والأول حجب حرمان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
      contradicts:
        - text: "«(حَجَبَ) الْحَاءُ وَالْجِيمُ وَالْبَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ الْمَنْعُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الحجب فعل المنع والستر، لا حالة المحروم، واستعماله الاصطلاحي مقصور على المواريث"
    - lemma: "تَجْرِيد"
      contradicts:
        - text: "«(التَّجْرِيد) عزل صفة أو علاقة عزلاً ذهنياً وقصر الاعتبار عليها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "التجريد يدل على الفعل الذهني للعزل والتجريد الفلسفي، لا على حالة الحرمان من حقوق"
        - text: "«(1) حِرمان (2) فَقْد؛ خَسارة (3) تجريد [من الرّتبة الكَنَسِية] (4) عَزْلٌ [من منصب] — deprivation»"
          source: "المورد الحديث (2008)"
          conflict: "التجريد بمعنى deprivation مقصور على سياق الرتب الكنسية والمناصب فقط، لا عام"

stage3_analysis:
  per_lemma:
    - lemma: "حِرْمَان"
      decision: confirmed
      decision_reason: >
        مصدر حَرَمَ يَحْرِمُ على وزن فِعْلان، يدل على حالة المحرومية والاستبعاد من التمتع بحق أو ممتلكات.
        أدلة المعاجم قوية ومتعددة من المعجم الكبير والمعاجم المصطلحية الحديثة.
        التعريف القانوني في المعجم الكبير يطابق مفهوم المجموعة تماماً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على الحالة الناتجة عن الاستبعاد من حق أو نفع، وهو المصطلح الأدق للمفهوم"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حِرْمَان"

    - lemma: "مَنْع"
      decision: removed
      decision_reason: >
        المَنْع في المعاجم العربية يدل على فعل الحيلولة بين المرء والشيء (خلاف الإعطاء)،
        وهو فعل المانِع لا حالة الممنوع. المجموعة تصف حالةً (state of being debarred)
        لا فعلاً (act of debarring). العلاقة بين المنع والحرمان سببية لا ترادفية:
        المنع سبب والحرمان نتيجة. حتى في الحديث «مَن مَنَعْتَ مَمْنُوعٌ» عُبِّر عن الحالة
        بالمفعول (ممنوع) لا بالمصدر (منع).
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حَظْر"
      source: stage1
      decision: removed
      decision_reason: >
        الحظر مصطلح شرعي يدل على التحريم (ما يُثاب بتركه ويعاقب على فعله)،
        وهو فعل تشريعي لا حالة ناتجة. لا يناسب مفهوم «حالة الحرمان من حقوق».
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "حَجْب"
      source: stage1
      decision: removed
      decision_reason: >
        الحجب يدل على فعل المنع والستر، واستعماله الاصطلاحي مقصور على باب المواريث
        (حجب الحرمان وحجب النقصان). لا يُستعمل للدلالة على حالة الحرمان العامة من حقوق
        أو ممارسات. وهو فعلٌ لا حالة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "تَجْرِيد"
      source: stage1
      decision: removed
      decision_reason: >
        التجريد في المعاجم يدل أساساً على العزل الذهني (الفلسفة) أو الانتزاع البلاغي
        أو التشذيب الحسي. استعماله بمعنى deprivation مقصور على سياق الرتب الكنسية
        والمناصب في المورد الحديث، ولا يُعدّ مصطلحاً عاماً للحرمان من الحقوق.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

stage4_content:
  definition:
    current: "حالة الحرمان (الاستبعاد من التمتع بممتلكات أو حقوق أو ممارسات معينة)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يبدأ بلفظ «حالة الحرمان» مما يجعله دائرياً إذ يُعرِّف الحرمان بالحرمان.
        كما أنه يحتوي على قوسين تفسيريين يعطيان انطباع الترجمة الحرفية.
        يحتاج إلى صياغة معجمية أصيلة بجنس قريب وفصل نوعي.
    authored:
      - type: terminological
        text: "كَوْنُ المرءِ مُستَبعَداً من التمتُّع بحقوقٍ أو ممتلكاتٍ أو ممارساتٍ مُعيَّنة"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
