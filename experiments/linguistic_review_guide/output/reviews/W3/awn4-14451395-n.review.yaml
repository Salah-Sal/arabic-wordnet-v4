        text: "المَنْعُ من مُبَاشَرَةِ حقٍّ أو الانتفاع بمِلكٍ أو القيام بعملٍ مُقَرَّرٍ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
