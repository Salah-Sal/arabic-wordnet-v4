# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13872345-n
# the last or lowest in an ordering or series
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «أخير» دون تشكيل ودون «ال» التعريف — ينبغي أن تكون «الأَخِير» بالتشكيل الكامل"
      - "اللمّة صفة مشبّهة مُستعملة استعمال الاسم (substantivized adjective)؛ وقد يُستساغ ذلك في العربية لكن المجموعة تحتاج إلى مزيد من اللمّات الاسمية الصريحة"
      - "المجموعة تحتوي لمّة واحدة فقط وهو فقر مُعجمي"
    observations: >
      التعريف يدلّ على مفهوم مجرّد يعني المرتبة الأخيرة أو الأدنى في ترتيب أو سلسلة، وهو ضرب من
      المكانة النسبية (درجة، رتبة). الإنجليزية تستعمل «last» اسمياً بمعنى الموضع الأخير في سلسلة.
      في العربية يمكن استعمال «الأخير» اسمياً بمعنى آخر كل شيء كما في المعجم الوسيط.
      المفهوم يحتاج إلى لمّات تؤكد البُعد الترتيبي لا الزمني فحسب.

  blind_candidates:
    - lemma: "حَضِيض"
      generation_method: majaz
      justification: >
        الحضيض في الأصل أخفض موضع في الأرض أو المدار، ويُستعمل مجازياً للدلالة على
        أدنى مرتبة في سلسلة أو ترتيب؛ وهو مثبت معجمياً كمصطلح فلكي ومجاز شائع.
    - lemma: "ذَنَب"
      generation_method: majaz
      justification: >
        الذنب (بالتحريك) هو ذيل الشيء وآخره، ويُستعمل مجازياً بمعنى آخر القوم
        أو تابعهم ومُؤَخَّرهم، فيدلّ على الأخير في سلسلة.
    - lemma: "مُؤَخَّر"
      generation_method: ishtiqaq
      justification: >
        اسم مفعول من أَخَّرَ على وزن مُفَعَّل، يدلّ على ما جُعل في المؤخرة أي
        نهاية الشيء من الخلف؛ يناسب الدلالة على الأخير في ترتيب.
    - lemma: "أَدْنَى"
      generation_method: ishtiqaq
      justification: >
        اسم تفضيل من دنا يدنو بمعنى الأقرب أو الأسفل، يُستعمل اسمياً
        للدلالة على الأسفل في ترتيب أو رتبة؛ وهو واردٌ في التعريف ذاته.


stage2_evidence:
  per_lemma:
    - lemma: "أَخِير"
      confirm:
        - text: "«(الأَخِير) يُقَال لَقيته أخيراً وَجَاء أخيراً آخر كل شَيْء»"
          source: "المعجم الوسيط (hawramani_35)"
        - text: "«لقيته أخيراً, وجاء أخيراً: آخر كل شيء»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«الأخير المتأخر عن الخير المُؤخَّر المطروح»"
          source: "المعجم الوسيط (OCR)"
          addition: "دلالة ثانية للأخير: المُؤَخَّر المطروح، أي من أُبعد عن الخير"

    - lemma: "حَضِيض"
      confirm:
        - text: "«الحَضِيضُ: أَخفض مَوضِع فِي هَذَا الْفلك، وَأقرب من الأَرْض»"
          source: "القاموس المحيط (hawramani)"
      expands:
        - text: "«الحضيض: بالضاد المعجمة... الأرض المنخفضة. وعند أهل الهيئة هو أخفض نقطة في الفلك»"
          source: "كشاف اصطلاحات الفنون (hawramani)"
          addition: "الحضيض مصطلح فلكي ثابت يدلّ على أخفض نقطة، وقد يمتد مجازياً إلى أدنى مرتبة"
      contradicts:
        - text: "«الحَضِيضُ: أَخفض مَوضِع فِي هَذَا الْفلك»"
          source: "القاموس المحيط"
          conflict: "الحضيض يدلّ أصلاً على أخفض نقطة مكانية/فلكية لا على رتبة ترتيبية مجردة"

    - lemma: "ذَنَب"
      contradicts:
        - text: "«الذَّنْبُ: الإِثْمُ، ج: ذُنُوبٌ... وبالتحريك: واحِدُ الأَذْنابِ»"
          source: "القاموس المحيط (hawramani)"
          conflict: "المعنى الأول والأغلب هو الإثم، والذنب بالتحريك هو الذيل الحسّي لا المرتبة المجردة"
      expands:
        - text: "«الذنب: الإثم، أصله الأخذ بذنب الشيء»"
          source: "المفردات في غريب القرآن (hawramani)"
          addition: "الأصل الاشتقاقي يدلّ على طرف الشيء وآخره"

    - lemma: "مُؤَخَّر"
      confirm:
        - text: "«نهاية الشيء من الخلف. يقال: مؤخَّر السفينة, ومؤخَّر البناء»"
          source: "المعجم الوسيط (OCR)"
      expands:
        - text: "«من الدَّين أو الصداق: ما أجِّل منه»"
          source: "المعجم الوسيط (OCR)"
          addition: "استعمال المؤخَّر للدلالة على ما أُرجئ في السداد"
      contradicts:
        - text: "«(الْمُؤخر) من الْعين مَا يَلِي الصدغ»"
          source: "المعجم الوسيط (hawramani_35)"
          conflict: "مؤخر العين معنى تشريحي خاص لا علاقة له بالترتيب"

    - lemma: "أَدْنَى"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    - lemma: "الأَخِير"
      decision: confirmed
      decision_reason: >
        اللمّة ثابتة في المعجم الوسيط بمعنى «آخر كل شيء»، وهي صفة تُستعمل استعمال الاسم
        للدلالة على المتأخر في الترتيب. تحتاج إلى تحديث التشكيل وإضافة «ال».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدلّ على المرتبة الأخيرة زمنياً وترتيبياً مع إمكانية الاستعمال ظرفياً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "الأَخِير"

    - lemma: "حَضِيض"
      source: stage1
      decision: removed
      decision_reason: >
        الحضيض مصطلح فلكي/جغرافي يدلّ على أخفض نقطة مكانية، واستعماله مجازياً للرتبة
        الترتيبية ممكن لكنه ليس مسكوكاً ولا ثابتاً في هذا المعنى المجرد. الدلالة المكانية
        أو الفلكية هي الغالبة، ولا يُستعمل في سياق ترتيب سلسلة.

    - lemma: "ذَنَب"
      source: stage1
      decision: removed
      decision_reason: >
        الذنب بالتحريك يدلّ على الذيل الحسّي، وبالسكون على الإثم، وكلا المعنيين بعيد
        عن المرتبة الترتيبية المجردة. الاستعمال المجازي بمعنى «آخر القوم» غير مسكوك
        معجمياً كمصطلح للرتبة الأخيرة في سلسلة.

    - lemma: "مُؤَخَّر"
      source: stage1
      decision: removed
      decision_reason: >
        المؤخَّر في المعجم الوسيط يدلّ على نهاية الشيء من الخلف (مكانياً) أو على ما أُجّل
        من الدين. الاستعمال الترتيبي بمعنى الأخير في سلسلة غير ثابت، وهناك تداخل مع
        المعنى المكاني والمالي.

    - lemma: "أَدْنَى"
      source: stage1
      decision: removed
      decision_reason: >
        أدنى اسم تفضيل يستعمل صفةً ولم يُعثر له في المعاجم على استعمال اسمي مستقل
        بمعنى «الرتبة الأدنى». وهو يكرر جزءاً من التعريف ذاته مما يُوقع في الدوران.


