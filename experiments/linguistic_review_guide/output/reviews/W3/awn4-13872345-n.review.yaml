      decision: revise
      reason: >
        التعريف الحالي ترجمة حرفية للإنجليزية ولا يتبع أسلوب التعريف المعجمي العربي.
        يفتقر إلى الجنس القريب الواضح ويستعمل «أو» بصورة توحي بترادف لا بتعريف.
