# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:

  definition:
    current: "شخص يصنع آلات الكمان"
    assessment:
      decision: revise
      reason: >
        «آلات الكمان» غير دقيق؛ يُوهم بأن المقصود أدوات استخدام الكمان
        لا الكمانات ذاتها. الأصح «الكمانات» أو «آلة الكمان». كذلك «شخص»
        وصف عام دون تحديد الوظيفة الحرفية. التعريف الحالي يبدو ترجمة حرفية
        من الإنجليزية (someone who makes violins) لا تأليفاً معجمياً عربياً.
    authored:
      - type: terminological
        text: "حِرْفِيٌّ متخصص في صُنع الكَمَانات يدوياً وضبطها وصيانتها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          صانع آلات الكَمَان حِرفةٌ تقوم على تشكيل أجزاء آلة الكمان الوترية
          من الخشب وتجميعها ووضع الأوتار والقوس وضبط الصوت. يُعرَّف في
          المصطلح الحرفي الغربي بـ(luthier) وفي العربية بـ(الوتّار).
    actions:
      - command: update_definition
        params:
