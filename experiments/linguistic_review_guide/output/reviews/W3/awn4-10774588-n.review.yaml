# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # أ. التوليد العمياء — من التعريف المقنّع فقط (قبل الاطلاع على اللمّات)
  # التعريف المقنّع: "شخص يصنع آلات الكمان"
  blind_candidates:
    - lemma: "لُوثِيَر"
      generation_method: taarib
      justification: >
        تعريب المصطلح الفرنسي-الإيطالي luthier المتداول دولياً لصانع آلات الوتر
        ومنها الكمان، يقبل التعريف والجمع (لوثيرون) والنسب (لوثيري).
        يُستخدم في مجلات الموسيقى العربية الحديثة.

    - lemma: "وَتَّار"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر (و-ت-ر) على وزن فَعَّال الدالّ على المحترف المتخصص،
        والوتر هو سلك الآلة الموسيقية. فالوتّار: صانع الآلات الوترية ومنها
        الكمان. الوزن اطّرادي في العربية لصنوف الحرفيين: نجّار، حدّاد، نقّار.

    - lemma: "صانِعُ الكَمَان"
      generation_method: tarkib
      justification: >
        مركب إضافي من (صانع + الكمان)، الكمان آلة طرب وترية ذات أربعة
        أوتار وقوس. الصياغة الإضافية المعرَّفة أكثر ثباتاً معجمياً من النكرة.
        اختبار السكّ: لا يمكن إحلال مرادف لـ"الكمان" دون تغيير المعنى الدقيق.

    - lemma: "صانِعُ الكَمَنْجَة"
      generation_method: tarkib
      justification: >
        مركب إضافي باستخدام الاسم البديل "كمنجة" (من الفارسية كمانجه)،
        وهو مرادف للكمان في عدد من المعاجم العربية الكلاسيكية والحديثة.
        يغطّي التباين الاصطلاحي بين المشرق والمغرب العربي.

  # ب. التقييم الأولي — بعد الاطلاع على الملف الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة (صانع كمان) خالية تماماً من التشكيل."
      - >
        عبارة «آلات الكمان» في التعريف العربي غير دقيقة صرفياً؛
        «آلات الكمان» تعني «أدوات الكمان» لا «الكمانات»،
        والأصح «الكمانات» أو «آلة الكمان» بالمفرد.
      - "المجموعة تحتوي لمّة واحدة فقط وهي شحيحة لمفهوم حرفي متخصص."
      - >
        نسب جذر (كمن) للفظ «كمان» في قاعدة البيانات (مصدر camel) مُضلِّل؛
        «كمان» معرَّب من الفارسية «كمان» (قوس) لا من الجذر العربي (ك-م-ن).
    observations: >
      المجموعة تُمثّل مفهوماً حرفياً متخصصاً هو صناعة الكمان (صانع كمان = violin maker).
      اللمّة الموجودة مركب إضافي وظيفي صحيح غير أنه يفتقر التشكيل.
      الكمان آلة ذات أصل أوروبي دخلت الثقافة العربية مع الموسيقى الكلاسيكية،
      وتوجد في المعاجم الحديثة (الوسيط، المعاصر) بوصفها مصطلحاً موسيقياً معتمداً.
      المرادف المعجمي المدوَّن الأقرب هو «الوتّار» الوارد في المورد الحديث (2008)
      بمعنى «صانع الآلات الموسيقية الوترية» مقابل luthier، وهو مصطلح أشمل دلالةً
      لكنه يُغطّي الكمان بوصفه النموذج الأبرز للآلات الوترية.


