# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:

  # أ. اللمّات المرشحة — توليد أعمى من التعريف وحده
  # المدخل الأعمى: "منتج للأفلام السينمائية"
  # المفهوم: الشخص المسؤول عن إنتاج وتمويل والإشراف على صنع الأفلام
  blind_candidates:
    - lemma: "صانِعُ الأفلام"
      generation_method: tarkib
      justification: >
        مركَّب إضافي طبيعي يوازي المصطلح الإنجليزي "film maker". الجزء الأول "صانع"
        على وزن فاعل من جذر ص-ن-ع (عمل الشيء صُنعاً) وهو أصيل في العربية.
        يُركِّز على الجانب الإبداعي والحرفي في صنع الفيلم.

    - lemma: "قَيِّمُ الأفلام"
      generation_method: majaz
      justification: >
        إحياء للفظ "القيِّم" الكلاسيكي الحي (السيد وسائس الأمر ومن يتولى شؤون
        القوم) وإزاحته دلالياً نحو المنتج السينمائي الذي يتولى شؤون الفيلم
        من التمويل إلى العرض. التشابه وظيفي: كلاهما صاحب إشراف وتوجيه.

    - lemma: "مُنجِزُ الأفلام"
      generation_method: ishtiqaq
      justification: >
        اشتقاق من جذر ن-ج-ز على وزن مُفعِل (أنجز): من يُتمِّم الشيء ويُخرجه
        إلى حيّز الوجود. المنتج السينمائي هو الذي يُنجز الفيلم من فكرة إلى عمل
        مكتمل معروض على الجمهور.

    - lemma: "حِرْفِيٌّ سينمائي"
      generation_method: tarkib
      justification: >
        مركَّب وصفي: "حِرفيّ" (من يكسب رزقه بالعمل في حرفة بصفة مستمرة)
        + "سينمائي" (نسبة إلى السينما). يُبرز الطابع المهني الحِرَفي المتخصص
        لصانع الأفلام، مقابل الهاوي.

  # ب. التقييم الأوّلي — بعد الاطلاع على الملف الكامل
  assessment:
    concerns:
      - >
        "سينمائي" وحده يصف أي متخصص في المجال السينمائي (ممثل، مخرج، مصوِّر،
        مونتير) ولا يُعيِّن المنتج بالتحديد؛ يفتقر إلى الفصل النوعي الكافي.
      - >
        جميع اللمّات الثلاث خالية من التشكيل — يجب إضافة التشكيل الكامل.
      - >
        التعريف "منتج للأفلام السينمائية" مختزل إلى حد الإجمال؛ يكتفي بتكرار
        المفردة الجوهرية "منتج" دون تحديد الجنس القريب بصورة صريحة.
    observations: >
      المجموعة تعالج مفهوماً واضحاً ومستقراً في الثقافة العربية (صناعة السينما
      راسخة منذ أوائل القرن العشرين). "مُنتِجُ أفلام" مؤيَّد بأقوى الأدلة
      الاصطلاحية الحديثة. "صانِعُ أفلام" موازٍ للمصطلح الإنجليزي "film maker"
      وله سند لغوي متين من جذر ص-ن-ع. أما "سينمائي" بدون قيد فمبهم ويتداخل
      مع ألقاب سينمائية أخرى، مما يُضعف دلالته التحديدية داخل هذه المجموعة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   ١. مطابقة دفعية: اللمّات الموجودة + المرشّحات + المكوّنات المفردة
#   ٢. الجسر الإنجليزي: film maker / filmmaker / film producer / movie maker
#   ٣. مقاييس اللغة: جذور صنع ، نتج ، قوم ، حرف (dictionary_id = 151)
stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "سينمائي"
      expands:
        - text: >
            «سينمائيّ هاوٍ» — ترجمته: amateur film-maker
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
          addition: >
            يُثبت أن "سينمائي" تُستخدم في مركَّبات للإحالة إلى صانع الأفلام،
            لكنها تحتاج قيداً ("هاوٍ" / "محترف") ولا تصلح بمفردها دلالةً
            على المنتج تحديداً.
      contradicts:
        - text: >
            الكلمة في المعاجم الحديثة نسبة إلى "سينما": صفة تعني "ما يتعلق
            بالسينما أو يُنسَب إليها"؛ لا تنصرف وحدها إلى دلالة المنتج.
          source: "المعجم الوسيط + المعجم الكبير (المعجم الأكاديمي)"
          conflict: >
            "سينمائي" صفة نسبية تُحيل إلى أي عنصر في الصنعة السينمائية
            (ممثل، مخرج، مصوِّر، إلخ)؛ تستعملها وحيدةً بدلالة "المنتج"
            تجوّزٌ دون فصلٍ نوعي.

    - lemma: "صانع أفلام"
      confirm:
        - text: >
            «الصَّانِعُ: مَن يصنع بيديه، مَن يحترف الصناعة. امرأة صانعة
            اليدين: ماهرة حاذقة مُجيدة في عمل اليدين»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: >
            «(الصَّانِع) من يصنع بيدَيه ومن يحترف الصناعة (ج) صُنَّاع»
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
        - text: >
            «صانع» — translation_en: manufacturer — domain: Information
            and Communication
          source: "المعجم الموحد لمصطلحات تقانة المعلومات (ArabTerm)"
      expands:
        - text: >
            «(صَنَعَ) الصَّادُ وَالنُّونُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ وَاحِدٌ،
            وَهُوَ عَمَلُ الشَّيْءِ صُنْعًا. وَامْرَأَةٌ صَنَاعٌ وَرَجُلٌ صَنَعٌ،
            إِذَا كَانَا حَاذِقَيْنِ فِيمَا يَصْنَعَانِهِ.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            الجذر ص-ن-ع يدل أصالةً على إتقان الصنع والاحتراف؛ يعزز
            دلالة "صانع أفلام" على الاحتراف السينمائي.

    - lemma: "منتج أفلام"
      confirm:
        - text: >
            «منتِج أفلام» — translation_en: film producer — domain:
            Information and Communication
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
        - text: >
            «المُنْتِج السينمائيّ.» — translation_en: filmmaker
          source: "المورد الحديث (2008) — ArabTerm"
      contradicts:
        - text: >
            «المُنْتِجُ: وقت الإنتاج»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: >
            المعجم الوسيط يورد "المُنتِج" بمعنى "وقت الإنتاج" (من نِتاج
            الناقة)، وهو المعنى الأصيل للجذر ن-ت-ج. المعنى الحديث
            "شخص يُنتج" تطوّر مُوَلَّد لم يُدرجه الوسيط صراحةً، غير أن
            ARABTERM والاستعمال الحديث يُثبتانه بقوة.
      expands:
        - text: >
            «مخرِج أفلام» — translation_en: film director; film producer
          source: "مسرد الإعلام والتواصل — ALECSO (ArabTerm)"
          addition: >
            يكشف أن بعض المعاجم العربية تُجمع "film director" و"film
            producer" في مدخل واحد، مما يعكس التداخل الوظيفي أحياناً،
            ويُثبت في الوقت ذاته قبول "منتج أفلام" في السياق المتخصص.
        - text: >
            «(نَتَجَ) النُّونُ وَالتَّاءُ وَالْجِيمُ كَلِمَةٌ وَاحِدَةٌ،
            هِيَ النِّتَاجُ. وَنُتِجَتِ النَّاقَةُ; وَفَرَسٌ نَتُوجٌ: اسْتَبَانَ
            نِتَاجُهَا.»
          source: "مقاييس اللغة لابن فارس"
          addition: >
            أصل الجذر الحيوي (نِتاج الخيل والإبل) اتُّسع في العربية الحديثة
            ليشمل الإنتاج المادي والفني عموماً.

    # ── مرشحات المرحلة ١ ──────────────────────────────────────

    - lemma: "صانع الأفلام"
      source: stage1
      confirm:
        - text: >
            «الصَّانِعُ: كُلُّ مُحْتَرِفٍ بيده مُتَكَسِّبٌ من حِرْفَتِه»
          source: "المعجم الكبير (مجمع اللغة العربية)"
      expands:
        - text: >
            «صانع» — translation_en: artisan — domain: Philosophy and
            Psychology / Sociology and Anthropology
          source: "مسردا الفلسفة وعلم الاجتماع — ALECSO (ArabTerm)"
          addition: >
            دلالة الاحتراف والتخصص راسخة في المصطلح. لكن المركَّب "صانع
            الأفلام" لم يُقيَّد بمدخل مستقل في المعاجم — هو مساوٍ للمدخل
            الموجود "صانع أفلام" مع ال-التعريف على المضاف إليه.

    - lemma: "قيم الأفلام"
      source: stage1
      expands:
        - text: >
            «(الْقيم) السَّيِّد وسائس الأمر وَمن يَتَوَلَّى أَمر الْمَحْجُور
            عَلَيْهِ وقيم الْقَوْم الَّذِي يقوم بشأنهم ويسوس أَمرهم»
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          addition: >
            دلالة الإشراف والتولِّي موثقة لـ"القيِّم". لكن المركَّب
            "قيِّم الأفلام" غير مسجَّل وغير متداول في السياق السينمائي
            العربي.
        - text: >
            «القَيِّمُ: السَّيِّدُ سائس الأمر من يتولَّى أمر المحجور عليه.
            قَيِّم القوم: الذى يقوم بشأنهم ويسوس أمرهم»
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          addition: >
            يؤكد المعنى الإشرافي/الرعائي للقيِّم، لكن التثبيت المعجمي
            للتركيب الإضافي "قيِّم الأفلام" منعدم.

    - lemma: "منجز الأفلام"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "حرفي سينمائي"
      source: stage1
      expands:
        - text: >
            «الحِرْفِيُّ: professional: من يكتسب رزقه بالعمل في حِرْفَةٍ ما
            بصِفَةٍ مُسْتَمِرَّةٍ ومُنْتَظِمة»
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: >
            "حرفي" يؤدي دلالة الاحتراف والمداومة على العمل المتخصص.
            لكن المركَّب الوصفي "حرفي سينمائي" لا يُحدِّد المنتجَ
            بالذات وغير مسجَّل في المعاجم التقنية السينمائية.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────

    - lemma: "سينمائي"
      decision: removed
      decision_reason: >
        "سينمائي" صفة نسبية تُطلق على أي منتسب للمجال السينمائي بأوسع دلالاته
        (ممثل، مخرج، مصوِّر، مونتير، مُلحِّن موسيقى تصويرية). لا يُعيِّن
        المنتجَ بالتحديد دون قيد مُخصِّص. فضلاً عن ذلك: (أ) الأدلة تُثبت
        استعماله صفةً نسبية لا اسماً للمهنة؛ (ب) اختبار الاستبدال: لو أبدلناه
        بـ"مخرج" أو "ممثل" في جملة "هو سينمائي بارع" لصحَّت الجملة في السياقات
        الثلاثة، ما يعني غياب الفصل النوعي. قرار الحذف: إزالة الربط بالمجموعة
        مع إبقاء المدخل في القاموس.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "صانع أفلام"
      decision: confirmed
      decision_reason: >
        "صانع أفلام" مركَّب إضافي راسخ يوازي "film maker" الإنجليزية مباشرةً.
        جذر ص-ن-ع من أصحّ الجذور العربية دلالةً على الحِرفة والإتقان (مقاييس
        اللغة). المعجم الوسيط والكبير يُوثّقان "الصانع" بمعنى "من يحترف
        الصناعة". المُركَّب اجتاز اختبار السكّ: لا يمكن إبدال "أفلام" بمرادف
        آخر (صور/مشاهد) وتتحقق الدلالة المصطلحية ذاتها. يحتاج تشكيلاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الجانب الإبداعي والحرفي في صنع الفيلم؛ يُستخدم لوصف المنتج
        الذي يتولى صنع الفيلم بيديه أو يُشرف على كل مراحل إخراجه بنفسه،
        وأقل رسميةً من "منتج أفلام" في الوثائق التجارية والائتمانات.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صانِعُ أفلام"

    - lemma: "منتج أفلام"
      decision: confirmed
      decision_reason: >
        "منتج أفلام" مُثبَّت معجمياً في مسرد الإعلام والتواصل (ALECSO) بترجمة
        مطابقة "film producer"، وفي المورد الحديث "المُنتِج السينمائيّ = filmmaker".
        هو الاصطلاح الأوسع تداولاً في الأوساط المهنية العربية وائتمانات الأفلام.
        التحفُّظ على المعنى الكلاسيكي لـ"المُنتِج" (= وقت الإنتاج) لا يعيق
        قبوله في الاصطلاح الحديث المستقر. يحتاج تشكيلاً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز الجانب التمويلي والتنفيذي والتنظيمي؛ هو الاصطلاح المهيمن في
        الوثائق الرسمية وائتمانات الأفلام وعقود الإنتاج، ويشمل المسؤولية
        الكاملة عن الفيلم من التمويل إلى التوزيع، مقابل "صانع أفلام" الأقرب
        للدلالة الإبداعية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُنتِجُ أفلام"

    # ── مرشحات المرحلة ١ ──────────────────────────────────────

    - lemma: "صانع الأفلام"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشَّح يُعادل في جوهره اللمّة الموجودة "صانع أفلام" (الفرق
        الوحيد هو إدخال "ال" التعريف على المضاف إليه). لا حاجة إلى لمّة
        مكرَّرة. المحتوى الدلالي مُغطَّى بالكامل بـ"صانِعُ أفلام".

    - lemma: "قيم الأفلام"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ثراء لفظة "القيِّم" في التراث، فإن المركَّب "قيِّم الأفلام" لم
        يُسجَّل في أي مصدر متخصص بالمجال السينمائي، ولا يتداوله أهل الصنعة.
        اختبار التثبيت المعجمي: فاشل. الكلمة في استعمالها المعاصر تنصرف
        إلى "مُقيِّم" (evaluator) أكثر من "مشرف/متولٍّ".

    - lemma: "منجز الأفلام"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود لأي شاهد معجمي في قاعدة البيانات. المركَّب "مُنجِز الأفلام"
        غير متداول في السياق السينمائي العربي، ولا يُمثِّل مصطلحاً مسكوكاً.

    - lemma: "حرفي سينمائي"
      source: stage1
      decision: removed
      decision_reason: >
        "حِرفيّ" يصف أي محترف في أي حرفة، و"سينمائي" نسبة واسعة. المركَّب
        الوصفي لا يُخصِّص المنتج بالذات ولا يُمثِّل مصطلحاً مسكوكاً في
        المعاجم السينمائية. اختبار التثبيت المعجمي: فاشل.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:

  definition:
    current: "منتج للأفلام السينمائية"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُختزَل ودائر: يستخدم "منتج" (المصطلح الجوهري) لتعريف
        "منتج أفلام"، دون ذكر جنس قريب صريح ("شخص") ودون فصل نوعي كافٍ يُميِّزه
        عن المُنتِج العام (hypernym). كذلك يفتقر إلى تحديد الوظائف المميِّزة
        للمنتج السينمائي (التمويل، الإشراف، التوزيع).
    authored:
      - type: terminological
        text: >
          شخصٌ يتولَّى تمويلَ الأفلام السينمائية والإشرافَ على إنتاجها
          من مرحلة التخطيط حتى عرضها على الجمهور
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          المنتج السينمائي هو الشخص المسؤول عن إطلاق مشاريع الأفلام وتمويلها
          وإدارة ميزانياتها وتنسيق العمل بين المخرج وفريق التصوير وشركات
          التوزيع؛ وهو يتحمّل المسؤولية الكاملة عن الفيلم من الناحية
          الإنتاجية والتجارية.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10108159-n"
