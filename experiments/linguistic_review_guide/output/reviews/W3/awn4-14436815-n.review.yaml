# مراجعة المجموعة الترادفية — awn4-14436815-n
# apostasy / renunciation / defection
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «تخلي» عامة جداً ولا تحمل دلالة خاصة على نبذ المعتقدات أو الارتداد عن قضية؛ فهي تشمل ترك أي شيء"
      - "لمّة «انشقاق» تدل أصلاً على الانفصال والتفرق (الشِّقاق) لا على الرجوع عن المعتقد؛ وتُستعمل أكثر في السياق السياسي الحزبي"
      - "غياب لمّة «مُرُوق» المعروفة في التراث الإسلامي للدلالة على الخروج من الدين كخروج السهم من الرمية"
      - "اللمّات الثلاث بدون تشكيل كامل"
    observations: "المجموعة تجمع بين مفهومين متقاربين لكن متمايزين: الردة الدينية (apostasy) والانشقاق السياسي (defection). الرابط بينهما هو حالة نبذ الانتماء السابق والتحول إلى الطرف المقابل. لمّة «ردة» هي الأقوى ارتباطاً بالمفهوم الديني، بينما «انشقاق» أقرب للمفهوم السياسي. لمّة «تخلي» فضفاضة تحتاج تقييداً بالسياق."

  blind_candidates:
    - lemma: "مُرُوق"
      generation_method: ishtiqaq
      justification: "مصدر مَرَقَ يَمْرُقُ على وزن فُعُول، من جذر م-ر-ق الدال على خروج الشيء من الشيء. معروف في الحديث النبوي: «يَمْرُقُونَ مِنَ الدِّينِ كَمَا يَمْرُقُ السَّهْمُ مِنَ الرَّمِيَّةِ». مصطلح تراثي حيّ للخروج من الدين أو المعتقد."
    - lemma: "اِرْتِدَاد"
      generation_method: ishtiqaq
      justification: "مصدر اِرْتَدَّ على وزن افتعال، من جذر ر-د-د. الردة اسم من الارتداد، وهما من أصل واحد يدل على رجع الشيء. يُستعمل في سياق الردة الدينية والرجوع عن المعتقد."
    - lemma: "تَنَصُّل"
      generation_method: ishtiqaq
      justification: "مصدر تَنَصَّلَ على وزن تَفَعُّل، من جذر ن-ص-ل الدال على بروز الشيء من كِنّ وسِتر. يُقال تَنَصَّلَ من ذنبه: تَبَرَّأَ. فيه دلالة التبرؤ والخروج من الالتزام السابق."
    - lemma: "نُكُوص"
      generation_method: ishtiqaq
      justification: "مصدر نَكَصَ على وزن فُعُول، من جذر ن-ك-ص. يُقال نَكَصَ على عَقِبَيْهِ: رجع عمّا كان عليه من خير. قال ابن فارس: لا يُقال ذلك إلا في الرجوع عن الخير."


stage2_evidence:
  per_lemma:
    - lemma: "اِنْشِقَاق"
      confirm:
        - text: "«رِدّة؛ ارتداد؛ مُروق؛ انشقاق.»"
          source: "المورد الحديث (2008) — مدخل defection"
        - text: "«انشقاق عن حزب»"
          source: "المورد الحديث (2008) — مدخل desertion"
      expands:
        - text: "«انشقاق المادة إلى فلقتين أو أكثر كشق الخشب وغيره»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "الدلالة الأصلية مادية فيزيائية: الانفلاق والتشظي، وامتدت مجازاً إلى الانفصال السياسي"

    - lemma: "تَخَلٍّ"
      confirm:
        - text: "«تخلٍّ [عن حقٍّ أو لقبٍ أو مِلْك]»"
          source: "المورد الحديث (2008) — مدخل renunciation"
        - text: "«تخلٍّ عن»"
          source: "المورد الحديث (2008) — مدخل desertion"
      contradicts:
        - text: "«التخلي: اختيار الخلوة والإعراض عن كل ما يشغل عن الحق.»"
          source: "التوقيف على مهمات التعاريف للمناوي / كتاب التعريفات للجرجاني"
          conflict: "المعنى الاصطلاحي الصوفي يعني اختيار الخلوة للعبادة، وهو معنى إيجابي روحي يناقض دلالة النبذ والارتداد"
      expands:
        - text: "«عن الأمر, ومنه: تركه. فلان: تفرَّغَ. خرج إلى الخلاء لقضاء حاجته»"
          source: "المعجم الوسيط"
          addition: "الدلالة اللغوية عامة: الترك والتفرغ، دون تخصيص بنبذ المعتقدات"

    - lemma: "رِدَّة"
      confirm:
        - text: "«هيئة الارتداد. الرُّجوعُ إلى الكُفْرِ بعدَ الإِسلامِ. تعنى — عند الإطلاق — رجوعَ بعضِ قبائلِ العَرَب عن الإِسلام عَقِبَ موتِ النَّبِيِّ»"
          source: "المعجم الكبير"
        - text: "«هيئة الارتداد. الرجوعُ إلى الكفر بعد الإسلام. امتلاءُ الضَّرع من اللبن قبل النِّتاج. صدى الصَّوت. حروب الرِّدَّة: كانت في أوائل عهد أبى بكر (رضى الله عنه) حين ارتدَّ بعض العرب إثر وفاة الرسول (صلى الله عليه وسلم)»"
          source: "المعجم الوسيط"
        - text: "«الردة: لغة، الرجوع عن الشيء إلى غيره. وشرعا: قطع الإسلام بنية أو قول أو فعل مكفر.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الرِّدَّةُ: كفر الْمُسلم الْمُكَلف بقول أَو فعل؛ عنادا أَو اعتقادا، أَو استهزاء صَرِيحًا.»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«الرِّدَّة (مج): ارتدادٌ عن عقيدة أو دين.»"
          source: "المورد الحديث (2008) — مدخل apostasy"
        - text: "«رِدّة، ارتداد»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — مدخل apostasy"

    - lemma: "مُرُوق"
      confirm:
        - text: "«رِدّة؛ ارتداد؛ مُروق؛ انشقاق.»"
          source: "المورد الحديث (2008) — مدخل defection"
        - text: "«زَنْدَقة؛ مُروق؛ لادِين.»"
          source: "المورد الحديث (2008) — مدخل irreligion"
        - text: "«المُرُوقُ: الخُرُوجُ مِنَ الشَّيْءِ. وَمَرَقَ السَّهْمُ مِنَ الرَّمِيَّةِ: نَفَذَ.»"
          source: "مقاييس اللغة لابن فارس — مادة مَرَقَ"
      expands:
        - text: "«سَفَا السُّنْبُل»"
          source: "المعجم الوسيط — مدخل المَرُوق"
          addition: "هذا المدخل بفتح الميم (المَرُوق) بمعنى سفا السنبل، يختلف عن المُرُوق (بضم الميم) بمعنى الخروج من الشيء"

    - lemma: "اِرْتِدَاد"
      confirm:
        - text: "«ارتداد [عن دِين]»"
          source: "المورد الحديث (2008) — مدخل renunciation"
        - text: "«رِدّة، ارتداد»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — مدخل apostasy"
        - text: "«الرِّدَّةُ: الاسم من الارتداد»"
          source: "المعجم الكبير"
      expands:
        - text: "«قانون الارتداد (فى علم النفس): هو القانونُ الذى يدلُّ على تفكُّكِ الذِّكْرَياتِ عندما تَمْرَض الذَّاكرةُ»"
          source: "المعجم الكبير"
          addition: "للارتداد استعمالات اصطلاحية كثيرة في العلوم الطبيعية والنفسية غير الدلالة الدينية"

    - lemma: "تَنَصُّل"
      contradicts:
        - text: "«من ذَنْبه: تَبَرَّأَ. الشيءَ: أخرجه. تخيَّره. فلاناً: أَخَذَ كلَّ شيءٍ معَهُ»"
          source: "المعجم الوسيط"
          conflict: "التنصل يدل على التبرؤ من ذنب أو خطأ وليس على نبذ معتقد أو الخروج من جماعة؛ فالمعنى أقرب إلى الاعتذار والتملص"
        - text: "«تَنَصَّلَ مِنْ ذَنْبِهِ: تَبَرَّأَ، كَأَنَّهُ خَرَجَ مِنْهُ»"
          source: "مقاييس اللغة لابن فارس — مادة نَصَلَ"
          conflict: "الأصل في الباب بروز الشيء من كِنّ وسِتر، والتنصل تبرؤ من ذنب لا ردة عن عقيدة"

    - lemma: "نُكُوص"
      contradicts:
        - text: "«النكوص: الإحجام عن الشيء، والرجوع عنه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "النكوص إحجام عن المضيّ في أمر من خوف وجبن، وليس نبذاً واعياً للمعتقد أو تحولاً إلى الطرف المقابل"
        - text: "«نَكَصَ عَلَى عَقِبَيْهِ: أَحْجَمَ عَنِ الشَّيْءِ خَوْفًا وَجُبْنًا. قَالَ ابْنُ دُرَيْدٍ: لَا يُقَالُ ذَلِكَ إِلَّا فِي الرُّجُوعِ عَنِ الْخَيْرِ»"
          source: "مقاييس اللغة لابن فارس — مادة نَكَصَ"
          conflict: "ابن فارس يقصره على الرجوع عن الخير خوفاً وجبناً، أي هو تراجع لا تحوّل إرادي"


stage3_analysis:
