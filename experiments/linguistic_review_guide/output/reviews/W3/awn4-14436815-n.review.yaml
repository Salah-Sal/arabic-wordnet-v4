      decision_reason: "مُؤصَّلة في التراث الإسلامي بدلالة الخروج من الدين. أصل الجذر عند ابن فارس يدل على خروج الشيء من الشيء. المورد الحديث يوردها مقابل defection وirreligion. معروفة في الحديث النبوي الشريف عن المارقة. تسدّ فجوة بين ردة (ارتداد) وانشقاق (انفصال) بدلالتها على الخروج والنفاذ."
