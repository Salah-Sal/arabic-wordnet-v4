      decision_reason: "لمّة أساسية مؤصَّلة في المعاجم الكلاسيكية والحديثة بدلالة الارتداد عن الدين. أكّدتها ستة مصادر معجمية دون أي تعارض في هذا المعنى. هي اللمّة المركزية في المجموعة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تختص بالردة الدينية بالدرجة الأولى (الرجوع إلى الكفر بعد الإسلام)، وتُستعمل بالتوسع في نبذ أي عقيدة أو مذهب. فيها دلالة الرجوع إلى حالة سابقة."
