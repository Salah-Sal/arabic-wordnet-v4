# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان «فلاح» و«مزارع» واردتان بدون تشكيل، مما يُفضي إلى التباسٍ خطير: فَلَاح (نجاح وفوز) ↔ فَلَّاح (محترف الفلاحة)، ومَزَارِع (جمع مزرعة) ↔ مُزَارِع (من يمتهن الزراعة)"
      - "تكرار اللمّتين ذاتهما في المجموعة الأعم (awn4-10098586-n) دون تمييز دلالي على مستوى اللمّات؛ إذ إن فَلَّاح ومُزَارِع يحملان بنيةً صرفيةً مذكّرة بطبيعتهما، فالتمييز بين المجموعتين قائم على الصرف لا على اختلاف اللمّات"
      - "التعريف الحالي «شخص ذكر يدير مزرعة» مقتضب ومتطابق تقريباً مع تعريف المجموعة الأعم، ولا يُبيّن الفارق الدلالي الجوهري بين من يُدير مزرعة ومن يمارس الزراعة ويُديرها"
      - "المجموعة تفتقر إلى الألفاظ العربية التراثية كـ«الأكار» الموثّقة في المعاجم الكبرى (المعجم الكبير، المعجم الوسيط، مقاييس اللغة)"
    observations: >
      المجموعة تُمثّل مفهوماً أصيلاً في الثقافة العربية، إذ ارتبطت الزراعة والفلاحة بالحضارة العربية ارتباطاً وثيقاً.
      اللمّتان الحاليتان صحيحتان معجمياً لكنهما تفتقران إلى التشكيل الكامل الذي يُفرّق بين المصطلح الزراعي ومعانٍ أخرى. الصيغتان
      مذكّرتان صرفياً بطبيعتهما (مقابل فَلَّاحة ومُزَارِعة للمؤنث)، وهذا يعني أن التمييز بين هذه المجموعة والمجموعة الأعم قائم على
      التخصيص الجنسي لا على تنوع اللمّات. يُوجد في التراث العربي لفظٌ تراثي موثّق هو «الأكار» يستحق الإضافة إثراءً للشبكة الدلالية.
      أما «زارع» فيغلب في التراث الكلاسيكي استعماله اسماً للكلب (أولاد زارع = الكلاب) وهو ما أثبته ابن فارس في المقاييس صراحةً.
  blind_candidates:
    - lemma: "زَارِع"
      generation_method: ishtiqaq
      justification: "اسم فاعل على وزن فَاعِل من الجذر ز-ر-ع، يدل صرفياً على من يمارس الزراعة، مشتق اشتقاقاً قياسياً منتظماً من الفعل زَرَعَ"
    - lemma: "حَرَّاث"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من الجذر ح-ر-ث (الحرث والفلاحة)، تُفيد الاحتراف والمداومة على حرث الأرض وتقليبها للزراعة"
    - lemma: "أَكَّار"
      generation_method: majaz
      justification: "إحياء لفظ عربي قديم من جذر أ-ك-ر (الحفر وشق الأرض)؛ أُزيحت دلالته إلى معنى الفلاح الذي يشق الأرض ويحفرها ويزرعها، وهو أسبق في التراث من كثير من الألفاظ الحديثة المستعملة للمفهوم ذاته"
    - lemma: "زَرَّاع"
      generation_method: ishtiqaq
      justification: "صيغة مبالغة على وزن فَعَّال من الجذر ز-ر-ع، تُفيد الاحتراف الدائم في الزراعة وبذر الحبوب، مع تمييز دلالي عن مُزَارِع بالتركيز على فعل الزرع لا على المشاركة"


