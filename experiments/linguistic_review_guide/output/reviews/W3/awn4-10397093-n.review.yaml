# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10397093-n  |  ILI: i91733  |  POS: n
# Lemma (en): ombudsperson
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة «أمين المظالم» تفتقر إلى التشكيل الكامل في السجل الحالي"
      - "المجموعة تحتوي على لمة عربية واحدة فقط رغم وجود بدائل معجمية موثقة في المعاجم الحديثة"
      - "التعريف العربي الحالي يبدو مترجماً حرفياً من الإنجليزية، ولا يتوافق مع أسلوب المعجم الوسيط"
      - "غياب التمييز بين الدلالة التاريخية الإسلامية للمصطلح (ديوان المظالم) والمؤسسة الحديثة المستقلة"
    observations: >
      المفهوم ينتمي إلى حقل القانون الإداري الحديث، ويصف وظيفة رقابية حكومية مستقلة
      لاستقبال شكاوى المواطنين والتحقيق فيها. للمفهوم جذور في التراث الإسلامي (ديوان المظالم
      وولاية الحسبة)، غير أن المؤسسة الحديثة (Ombudsman) ذات طابع أوروبي نشأ في
      السويد (1809م). التحديّ المعجمي يكمن في إيجاد مصطلح يجمع بين الدقة المفهومية
      والأصالة العربية، وتجنّب الدوران الذي يقع حين يُستخدم التعريف ذاته كاسم.

  blind_candidates:
    - lemma: "الْمُحْتَسِبُ"
      generation_method: majaz
      justification: >
        إحياء لفظ تاريخي بمجاز وظيفي: المحتسب في الحضارة الإسلامية مسؤول حكومي
        يتولى الرقابة على أحوال الرعية ويتلقى شكاواهم. الإزاحة الدلالية من «مراقبة
        الأسواق والآداب» إلى «التحقيق في الشكاوى ضد الحكومة» قريبة وظيفياً.
        الجذر «ح-س-ب» يحمل معنى المساءلة والمحاسبة.

    - lemma: "وَكِيلُ الشَّكَاوَى"
      generation_method: tarkib
      justification: >
        مركب إضافي: وكيل (من التوكيل = التفويض الرسمي) + الشكاوى (جمع شكوى).
        يُصوِّر الوظيفة بوصفها تفويضاً رسمياً للنظر في الشكاوى. الوزن «فَعِيل»
        على معنى المفعول (الموكّل) يُلائم السياق الإداري.

    - lemma: "صَاحِبُ الْمَظَالِمِ"
      generation_method: tarkib
      justification: >
        مركب إضافي: صاحب (من الصحبة = الملازمة والاختصاص) + المظالم (جمع مظلمة
        = ما يطلبه المرء من حقٍّ انتُزع منه). يُعبّر عن اختصاص المنصب بالمظالم
        وملازمتها. التعبير يُحيي «صاحب ديوان المظالم» التاريخي بصيغة مكثّفة.

    - lemma: "نَاظِرُ الْمَظَالِمِ"
      generation_method: tarkib
      justification: >
        مركب إضافي: ناظر (اسم فاعل من نظر = تولّى الأمر وفصل فيه) + المظالم.
        يستحضر مصطلح «ديوان النظر في المظالم» التاريخي. «النظر» في العربية يحمل
        معنى الفحص والتدقيق والفصل في القضايا، مما يُلائم وظيفة التحقيق والتوصية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استُخدم ٦ استعلامات: (١) مطابقة دفعية للمفردات المكوِّنة
# (٢) جسر إنجليزي لـ ombudsman/ombudsperson
# (٣) بحث FTS عربي بكلمات: شكاوى، مظالم، محتسب، وسيط، مفوض
# (٤) تحقق دفعي من المرشحين
# (٥-٦) مقاييس اللغة لجذور: أمن، ظلم، صحب، حسب
stage2_evidence:
  per_lemma:

    - lemma: "أَمِينُ الْمَظَالِمِ"
      expands:
        - text: "«(الأَمِينُ) الحَافِظُ الحَارِسُ وَالمَأمُونُ وَمَن يَتَوَلَّى رَقَابَةَ شَيءٍ أَوِ المُحَافَظَةَ عَلَيهِ (ج) أُمَنَاء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
          addition: >
            تُوثّق أن الأمين هو من يُفوَّض برقابة شيء والمحافظة عليه، مما يُسوِّغ
            الاستخدام في سياق الرقابة على حقوق الأفراد.
        - text: "«مَنْ يتولَّى رعَايَةَ الشَّيءِ وَالمُحَافَظَةَ عَلَيهِ... يُطلَقُ عَلَى مَنْ يَتَوَلَّى وَظِيفَةَ الأَمَانَةِ العَامَّةِ بِهَيئَةٍ أَوْ مُؤَسَّسَةٍ أَوْ نَحوِهِمَا»"
          source: "المعجم الكبير، مجمع اللغة العربية"
          addition: >
            يُثبت أن «الأمين» يُستخدم في العربية الحديثة لوصف المتولي وظيفة رسمية
            في هيئة أو مؤسسة، وهو ما يُسنِد استخدامه في «أمين المظالم».

    - lemma: "الْمُحْتَسِبُ"
      confirm:
        - text: "«(الْمُحْتَسِبُ) مَنْ كَانَ يَتَوَلَّى مَنصِبَ الحِسبَةِ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (1998)"
        - text: "«المُحْتَسِبُ: مَنْ كَانَ يَتَوَلَّى مَنصِبَ الحِسبَةِ. يُقَالُ: فُلَانٌ مُحْتَسِبُ البَلَدِ»"
          source: "المعجم الكبير، مجمع اللغة العربية"
        - text: "«مُحْتَسِب: المُكتَفِي بِالشَّيءِ، وَمُنكِرُ الأَمرِ، وَفَاعِلُ الأَمرِ وَمُبتَغِي الأَجرِ عِندَ اللهِ، وَمَنْ كَانَ يَتَوَلَّى مَنصِبَ الحِسبَةِ»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«(الْمُحْتَسِبُ) مَنْ كَانَ يَتَوَلَّى مَنصِبَ الحِسبَةِ»"
          source: "المعجم الوسيط"
          conflict: >
            وظيفة الحسبة التاريخية تشمل الرقابة على الأسواق والأخلاق العامة والأمر
            بالمعروف والنهي عن المنكر، وهي مختلفة جوهرياً عن وظيفة التحقيق في شكاوى
            الأفراد ضد الحكومة. المحتسب سلطته مستقلة لا تتعلق بتظلّم الأفراد من
            قرارات الحكومة تحديداً.

    - lemma: "وَكِيلُ الشَّكَاوَى"
      evidence_status: "no_material_found"

    - lemma: "صَاحِبُ الْمَظَالِمِ"
      confirm:
        - text: "«صَاحِبُ المَظَالِمِ: مَن يُحَقِّقُ فِي الشَّكَاوَى المَرفُوعَةِ ضِدَّ الدَّولَةِ أَو أَربَابِ العَمَلِ إلخ وَيُقَدِّمُ التَّقَارِيرَ عَنهَا»"
          source: "المورد الحديث (2008)"

    - lemma: "نَاظِرُ الْمَظَالِمِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "أمين المظالم"
      decision: confirmed
      decision_reason: >
        اللمة مستخدمة رسمياً في المؤسسات الحكومية والأدبيات القانونية العربية المعاصرة
        كمقابل لـ Ombudsman. مكوِّناها موثقان في المعاجم الكبرى بالمعاني المناسبة:
        «الأمين» = المتولي رسمياً، «المظالم» = الشكاوى والحقوق المنتهكة. المركب
        الإضافي صحيح بنياناً ومسكوك معجمياً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الجانب الائتماني والرسمي للمنصب: «الأمين» يحمل دلالة التفويض
        الرسمي والمسؤولية الأخلاقية (الأمانة ≠ الخيانة)، مما يُبرز استقلالية
        المنصب وحياده. الأكثر شيوعاً في الأدبيات الحكومية الرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَمِينُ الْمَظَالِمِ"

    - lemma: "الْمُحْتَسِبُ"
      source: stage1
      decision: removed
      decision_reason: >
        رغم توثيق المصطلح في كبار المعاجم العربية، تختلف دلالته التاريخية اختلافاً
        جوهرياً عن المفهوم المستهدف: المحتسب يتولى الحسبة (الرقابة على الأسواق والآداب
        العامة بسلطة استباقية)، أما أمين المظالم فيعمل بناءً على شكاوى مرفوعة ضد
        الحكومة بصلاحيات تحقيقية. الإزاحة الدلالية أوسع مما يُجيزه المجاز المعجمي
        المقبول، وقد تُضلِّل القارئ المتخصص.
      evidence_assessment:
        case: mixed

    - lemma: "وَكِيلُ الشَّكَاوَى"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود للمصطلح في المعاجم، ولا يجتاز اختبار التثبيت المعجمي: يمكن إبدال
        «وكيل» بـ«ممثّل» أو «مندوب» وتبقى الوصفية صالحة، مما يعني أنه تعبير حرّ
        لا مصطلح مسكوك. فضلاً عن ذلك، «الشكاوى» وحدها لا تستوعب معنى «المظالم»
        التي تشمل الحقوق المنتهكة.
      evidence_assessment:
        case: no_material

    - lemma: "صَاحِبُ الْمَظَالِمِ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثق مباشرة في المورد الحديث (2008) بوصفه مقابلاً لـ ombudsman مع تعريف
        دقيق يطابق مفهوم المجموعة. يجتاز اختبار التثبيت المعجمي: التعبير وحدة معجمية
        مسجّلة لا يمكن إبدال «صاحب» بكلمة أخرى دون تغيير الدلالة المصطلحية.
        المركب الإضافي فصيح وموروث من «صاحب ديوان المظالم» التاريخي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركِّز على الارتباط المباشر بالمظالم وملازمتها (صحب = لازم واختصّ).
        يُبرز الجانب الموضوعي للوظيفة (ما يُعالجه) أكثر من الطابع الوظيفي
        الرسمي. أكثر شيوعاً في المعاجم ذات التوجه الترجمي كالمورد.
      actions:
        - command: create_entry
          params:
            lemma: "صَاحِبُ الْمَظَالِمِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10397093-n"

    - lemma: "نَاظِرُ الْمَظَالِمِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوجد في المعاجم الحديثة كمصطلح مسكوك لوظيفة أمين المظالم المعاصر.
        «ناظر المظالم» معروف تاريخياً بوصفه صلاحية قضائية ملكية (من يفصل في المظالم
        بسلطة عليا)، لا وظيفة رقابية مستقلة، مما يُحدث التباساً مفهومياً.
      evidence_assessment:
        case: no_material


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "معين حكومي يحقق في شكاوى الأفراد ضد الحكومة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي نقل حرفي من الإنجليزية يفتقر إلى: (١) الجنس القريب الدقيق
        (مسؤول حكومي مستقل لا مجرد «معيّن»)، (٢) بيان صلاحية الإصدار التوصيات
        وهي سمة جوهرية تُميّز أمين المظالم عن المحقق العادي، (٣) أسلوب المعجم
        الوسيط في التعريف.
    authored:
      - type: terminological
        text: >
          مسؤولٌ حكوميٌّ مستقلٌّ مُعيَّنٌ للنظر في الشكاوى التي يرفعها الأفراد
          والمؤسسات ضد الجهات الحكومية، والتحقيق فيها، وإصدار التوصيات بشأنها.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          مسؤول يتمتع بالاستقلالية عن السلطة التنفيذية، يتلقى شكاوى المواطنين
          ضد الإدارات الحكومية، ويملك صلاحية الاطلاع على الوثائق والسجلات
          الرسمية، واستجواب المسؤولين، وإصدار تقارير وتوصيات غير ملزمة قانوناً.
          نشأت هذه المؤسسة في السويد عام 1809م تحت مسمى «Justitieombudsman».
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10397093-n"
          definition_index: 0
          text: "مسؤولٌ حكوميٌّ مستقلٌّ مُعيَّنٌ للنظر في الشكاوى التي يرفعها الأفراد والمؤسسات ضد الجهات الحكومية، والتحقيق فيها، وإصدار التوصيات بشأنها."
      - command: add_definition
        params:
          synset_id: "awn4-10397093-n"
          text: "مسؤول يتمتع بالاستقلالية عن السلطة التنفيذية، يتلقى شكاوى المواطنين ضد الإدارات الحكومية، ويملك صلاحية الاطلاع على الوثائق والسجلات الرسمية، واستجواب المسؤولين، وإصدار تقارير وتوصيات غير ملزمة قانوناً."

  examples:
    per_lemma:
      - lemma: "أَمِينُ الْمَظَالِمِ"
        examples:
          - text: "طالبَ أَمينُ المظالمِ بفتح تحقيقٍ مستقلٍّ في قرارِ الوزارةِ الذي أضرَّ بحقوق الموظفين المتقاعدين."
            type: usage
      - lemma: "صَاحِبُ الْمَظَالِمِ"
        examples:
          - text: "يَتلقَّى صاحبُ المظالمِ آلافَ الشكاوى سنوياً من المواطنين الساخطين على قراراتِ الأجهزة الحكومية، وقد أحدثت تقاريرُه إصلاحاتٍ تشريعيةً ملموسة."
            type: usage
    actions:
