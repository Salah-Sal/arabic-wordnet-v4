# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14438476-n
# a state of social isolation — حالة من العزلة الاجتماعية
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي دائري: يعرّف «عزلة اجتماعية» بأنها «حالة من العزلة الاجتماعية»"
      - "المجموعة تحتوي على لمّة واحدة فقط (عزلة اجتماعية) وهي مركب إضافي وصفي، وينبغي التحقق من كونها وحدة معجمية ثابتة"
      - "اللمّة الموجودة بلا تشكيل"
    observations: "المفهوم المقصود هو حالة الانقطاع عن التفاعل الاجتماعي والانفراد عن الناس. في التراث العربي يُعبَّر عن هذا المفهوم بألفاظ متعددة كالعُزلة والانزواء والخلوة والاعتكاف، لكنّ كلّاً منها يحمل ظلالاً دلالية خاصة. المقابلات الإنجليزية (solitude, purdah) تشير إلى طيف من العزلة الاختيارية إلى العزلة المفروضة ثقافياً. يلزم تأليف تعريف غير دائري."
  blind_candidates:
    - lemma: "اِنْزِوَاء"
      generation_method: ishtiqaq
      justification: "مصدر على وزن اِنْفِعَال من الجذر (ز و ي) الدال على الانضمام والتقبض. يُستعمل في العربية للدلالة على الانسحاب من الحياة الاجتماعية والتقوقع على النفس."
    - lemma: "خَلْوَة"
      generation_method: ishtiqaq
      justification: "من الجذر (خ ل و) الدال على تعرّي الشيء من الشيء. الخلوة هي الانفراد بالنفس والابتعاد عن الناس، وهي لفظة تراثية راسخة في المعجم العربي."
    - lemma: "تَوَحُّد"
      generation_method: ishtiqaq
      justification: "مصدر على وزن تَفَعُّل من الجذر (و ح د) الدال على الانفراد. يفيد معنى الانفراد بالنفس والابتعاد عن الآخرين."
    - lemma: "اِعْتِزَال"
      generation_method: ishtiqaq
      justification: "مصدر على وزن اِفْتِعَال من الجذر (ع ز ل) نفسه. يدل على ترك المخالطة والتنحّي عن الناس اختياراً."


stage2_evidence:
  per_lemma:
    - lemma: "عُزْلَة اجْتِمَاعِيَّة"
      confirm:
        - text: "«عزلة — تكوين علاقات اجتماعية مع عدد من الأشخاص أقل من المألوف عادة.»"
          source: "مسرد الإعلام والتواصل (ArabTerm) — ترجمة loneliness"
        - text: "«عزلة — solitude»"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
      expands:
        - text: "«العُزْلَة: الِانْفِرَاد عَن الْخلق طلبا للخير.»"
          source: "معجم مقاليد العلوم للسيوطي"
          addition: "يضيف بُعد الاختيار والطلب في العزلة"
        - text: "«العزلة: خروج عن مخالطة الخلق بالانزواء والانقطاع.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "يبيّن أن العزلة تكون بالانزواء والانقطاع عن المخالطة"
        - text: "«العزلة: هي الخروج عن مخاطبة الخلق بالانزواء والانقطاع.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          addition: "يؤكد المعنى ذاته مع إضافة بُعد المخاطبة"
        - text: "«(الْعُزْلَة) الانعزال»"
          source: "المعجم الوسيط"
          addition: "تعريف مختصر بالمرادف"

    - lemma: "اِنْزِوَاء"
      expands:
        - text: "«(زَوِيَ) الزَّاءُ وَالْوَاوُ وَالْيَاءُ أَصْلٌ يَدُلُّ عَلَى انْضِمَامٍ وَتَجَمُّعٍ. يُقَالُ زَوَيْتُ الشَّيْءَ: جَمَعْتُهُ... وَيُقَالُ انْزَوَتِ الْجِلْدَةُ فِي النَّارِ، إِذَا تَقَبَّضَتْ. وَزَاوِيَةُ الْبَيْتِ لِاجْتِمَاعِ الْحَائِطَيْنِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الانضمام والتقبض، والانزواء يفيد الانسحاب إلى زاوية"
      contradicts:
        - text: "«الزَّاءُ وَالْوَاوُ وَالْيَاءُ أَصْلٌ يَدُلُّ عَلَى انْضِمَامٍ وَتَجَمُّعٍ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل اللغوي يدل على الانضمام والتجمع لا على العزلة الاجتماعية تحديداً، والانزواء أعمّ من العزلة الاجتماعية"

    - lemma: "خَلْوَة"
      contradicts:
        - text: "«(الْخلْوَة) مَكَان الِانْفِرَاد بِالنَّفسِ أَو بغَيْرهَا»"
          source: "المعجم الوسيط"
          conflict: "الخلوة مكان لا حالة، والمفهوم المطلوب حالة لا مكان"
        - text: "«الخلوة: محادثة السر مع الحق حيث لا أحد ولا ملك.»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الخلوة عند المتصوفة مفهوم روحاني لا اجتماعي"
      expands:
        - text: "«الخلوة من الأغيار والعزلة من النفس وما تدعو إليه ويشغل عن الله، فالخلوة كثيرة الوجود والعزلة قليلة الوجود. فعلى هذا العزلة أعلى من الخلوة.»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "يفرّق بين الخلوة والعزلة: الخلوة من الأغيار والعزلة من النفس"

    - lemma: "تَوَحُّد"
      expands:
        - text: "«(وَحَدَ) الْوَاوُ وَالْحَاءُ وَالدَّالُ: أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى الِانْفِرَادِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على الانفراد"
      contradicts:
        - text: "«(1) توحّد؛ تنسُّك؛ اعتكاف (2) عُزْلة (3) سَجْن. وبخاصة: سَجْن انفراديّ.»"
          source: "المورد الحديث (2008) — ترجمة reclusion"
          conflict: "التوحّد في الاستعمال المعاصر صار يُطلق غالباً على اضطراب طيف التوحد (autism)، مما يُحدث التباساً دلالياً"

    - lemma: "اِعْتِزَال"
      confirm:
        - text: "«(عَزَلَ) الْعَيْنُ وَالزَّاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى تَنْحِيَةٍ وَإِمَالَةٍ... وَالْعُزْلَةُ: الِاعْتِزَالُ.»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«وَالْعُزْلَةُ: الِاعْتِزَالُ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الاعتزال مرادف تام للعُزلة في المقاييس، لكنه يوجد في المجموعة الأعلى (awn4-14438119-n) بلفظ «انعزال»، فإدراجه هنا يُحدث تداخلاً مع المُشتمِل"


stage3_analysis:
  per_lemma:
    - lemma: "عُزْلَة اجْتِمَاعِيَّة"
      decision: confirmed
      decision_reason: "مركب إضافي-وصفي ثابت يُستعمل مصطلحاً في علم النفس وعلم الاجتماع للدلالة على حالة الانقطاع عن التفاعل الاجتماعي. مسنود بمدخل ArabTerm في مسرد الإعلام والتواصل (عزلة = loneliness) ومسرد الفلسفة وعلم النفس (عزلة = solitude). التقييد بـ«اجتماعية» يميّزه عن العزلة العامة في المجموعة الأعلى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "مصطلح متخصص يدل على العزلة في بُعدها الاجتماعي تحديداً (قلة التفاعل مع الآخرين)، مقابل العزلة العامة التي قد تكون مكانية أو نفسية أو روحية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عُزْلَة اجْتِمَاعِيَّة"

    - lemma: "اِنْزِوَاء"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على مدخل معجمي مباشر للمصدر «انزواء». الجذر (ز و ي) يدل على الانضمام والتقبض لا على العزلة الاجتماعية تحديداً. والانزواء أعمّ من المفهوم المطلوب، إذ يشمل الانسحاب المكاني والنفسي دون تخصيص اجتماعي."
      evidence_assessment:
        case: mixed

    - lemma: "خَلْوَة"
      source: stage1
      decision: removed
      decision_reason: "الخلوة في المعاجم العربية تدل على مكان الانفراد بالنفس (الوسيط) أو على مفهوم صوفي روحاني (الجرجاني والتهانوي). ليست حالة اجتماعية بل مكان أو ممارسة روحية، ولا تتطابق مع المفهوم المطلوب."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَوَحُّد"
      source: stage1
      decision: removed
      decision_reason: "رغم أن الجذر (و ح د) يدل على الانفراد، فإن لفظ «التوحّد» في الاستعمال المعاصر قد اختُصّ بالدلالة على اضطراب طيف التوحد (autism spectrum disorder)، مما يُحدث التباساً دلالياً يُخلّ بالتواصل المصطلحي."
      evidence_assessment:
        case: mixed

    - lemma: "اِعْتِزَال"
      source: stage1
      decision: removed
      decision_reason: "الاعتزال مرادف للعُزلة العامة في مقاييس اللغة، وهو أقرب إلى المفهوم الأعلى (awn4-14438119-n: انعزال/عزلة) منه إلى هذا المفهوم الفرعي المقيّد بالبُعد الاجتماعي. إدراجه هنا يُحدث تداخلاً مع المُشتمِل."
      evidence_assessment:
        case: mixed


