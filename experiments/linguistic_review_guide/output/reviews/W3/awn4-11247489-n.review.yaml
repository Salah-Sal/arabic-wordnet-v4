# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان ('باكستون' و'جوزيف باكستون') تفتقران إلى التشكيل الكامل"
      - "اللمّة الإنجليزية الثالثة 'Sir Joseph Paxton' لا يقابلها مقابل عربي في المجموعة"
      - "التعريف الحالي مختزل جداً: يكتفي بالجنسية والتواريخ دون الإشارة إلى إنجازات الشخص"
      - "المجموعة تمثّل عَلَماً شخصياً (proper noun) مما يجعل التوليد الأعمى محدود الجدوى — الاسم لا يُستنبط من التعريف وحده"
    observations: >
      المجموعة مدخل لعَلَم شخصي هو المعماري الإنجليزي جوزيف باكستون (1801-1865)،
      الشهير بتصميم قصر الكريستال للمعرض الدولي الكبير في لندن عام 1851.
      اللمّتان الموجودتان تعريبٌ صوتي للاسمين الإنجليزيين 'Paxton' و'Joseph Paxton'،
      وكلاهما قياسي معجمياً لأسماء الأعلام المعرَّبة.
      يُلاحظ غياب الصيغة الشرفية 'Sir Joseph Paxton' في الجانب العربي مع وجودها في
      الإنجليزية. التشكيل غائب عن كلتا اللمّتين، ويجب توفيره.
      المنهج الوحيد الممكن لتوليد مرشحات عمياء لهذا النوع هو التعريب (taarib)
      بالاستناد إلى أسماء معماريين إنجليز من نفس الحقبة.

  blind_candidates:
    - lemma: "بَاكْسَتُون"
      generation_method: taarib
      justification: >
        تعريب صوتي قياسي لـ 'Paxton' وفق قواعد التعريب: P→ب، ax→اكْ، t→ت، on→وْن.
        المعماري الأوفر احتمالاً لهذه الحقبة بين من اشتُهروا بتصميم المنشآت الزجاجية
        والحدائق الملكية في إنجلترا أواخر القرن التاسع عشر.
    - lemma: "بَارِي"
      generation_method: taarib
      justification: >
        تعريب 'Barry' (تشارلز باري، 1795-1860)، من أبرز المعماريين الإنجليز
        المعاصرين للحقبة المذكورة، صاحب قصر ويستمنستر. يُشابه حقبة المجموعة.
    - lemma: "سكُوت"
      generation_method: taarib
      justification: >
        تعريب 'Scott' (جورج جيلبرت سكوت، 1811-1878)، معماري إنجليزي بارز
        من نفس الحقبة، عُرف بمشاريع إعادة تأهيل الكنائس القوطية في إنجلترا.
    - lemma: "نَاش"
      generation_method: taarib
      justification: >
        تعريب 'Nash' (جون ناش، 1752-1835)، من أشهر رواد العمارة الإنجليزية
        الكلاسيكية، مصمم ريجنت ستريت ونظام الحدائق الملكية في لندن.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت:
#  Q1 — مطابقة دفعية: باكستون + الباكستون + جوزيف باكستون + باري + الباري
#        + سكوت + السكوت + جوزيف + الجوزيف + باكستن + باكسون [headword_norm]
#  Q2 — الجسر الإنجليزي: translation_en: "Paxton" OR "Joseph Paxton"
#        OR "Sir Joseph Paxton" OR "architect" OR "English architect"
#  Q3 — FTS عربي: "باكستون" OR "باكسون" OR "بكستون"
#
# ملخص النتائج:
#   - لا توجد مدخلات لـ "باكستون" أو أي هجاء بديل في قاعدة البيانات.
#   - "باري" موجودة لكنها تُحيل إلى اسم عربي أصيل ومدينة إيطالية، لا صلة بالاسم الإنجليزي.
#   - Q2 أعاد مصطلحات مثل "معمار" و"المهندس المعماري" (مقابلات 'architect')، لا ما يخص Paxton.
#   - Q3 لم تُسفر عن أي نتائج.
stage2_evidence:
  per_lemma:
    - lemma: "باكستون"
      evidence_status: "no_material_found"

    - lemma: "جوزيف باكستون"
      evidence_status: "no_material_found"

    - lemma: "بَاكْسَتُون"
      evidence_status: "no_material_found"

    - lemma: "بَارِي"
      contradicts:
        - text: "«بَارِي: من (ب ر و) الخالق على غير مثال سابق، وصانع الإسورة؛ أو من (ب ر ي) العارض لغيره والمعارض له»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          conflict: "'باري' اسم علم عربي الأصل بمعنى الخالق/البارئ، لا صلة له بالاسم الإنجليزي 'Barry' المقصود"
        - text: "«بارِي: قرية من أعمال كلواذا من نواحي بغداد، وكان بها بساتين ومتنزهات يقصدها أهل البطالة»"
          source: "معجم البلدان لياقوت الحموي (ت 1229م)"
          conflict: "'باري' اسم موضع عراقي قديم، يؤدي إلى التباس مع الاسم الإنجليزي"

    - lemma: "سكُوت"
      evidence_status: "no_material_found"

    - lemma: "نَاش"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "باكستون"
      decision: confirmed
      decision_reason: >
        تعريب صوتي قياسي لاسم العلم الإنجليزي 'Paxton'، وهو التمثيل العربي
        الصحيح لهذا العَلَم. لا توجد مخاوف صرفية أو دلالية. يحتاج فقط إلى
        إضافة تشكيل كامل لضمان النطق الصحيح.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم الأخير (اللقب) وحده؛ يُستخدم في السياق الاختصاري والإشاري
        والأكاديمي المكثَّف حين يكون المرجع واضحاً من السياق.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَاكْسَتُون"

    - lemma: "جوزيف باكستون"
      decision: confirmed
      decision_reason: >
        تعريب صوتي للاسم الكامل 'Joseph Paxton'، وهو الصيغة الأكثر دقةً
        وإيضاحاً لهذا العَلَم في السياق الموسوعي والمرجعي. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل (الاسم الأول واللقب)؛ يُستخدم في السياق الموسوعي والمرجعي
        والتعليمي للتعريف الأول بالشخص دون لبس.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُوزِيف بَاكْسَتُون"

    - lemma: "سِير جُوزِيف بَاكْسَتُون"
      decision: confirmed
      decision_reason: >
        اللمّة الإنجليزية 'Sir Joseph Paxton' موجودة في المجموعة ولا يقابلها
        مقابل عربي. 'Sir' تُعرَّب اصطلاحياً بـ'سير' للألقاب البريطانية؛ وهو
        لقب فروسية مُنح له عام 1851 تكريماً لإنجازاته. إضافتها تُكمل التوافق
        مع الجانب الإنجليزي وتُثري المجموعة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل مع اللقب الشرفي البريطاني 'Sir'؛ يُستخدم في السياقات
        الرسمية والتاريخية التي تستدعي الإشارة إلى مكانته الاجتماعية والشرفية.
      actions:
        - command: create_entry
          params:
            lemma: "سِير جُوزِيف بَاكْسَتُون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "بَاكْسَتُون"
      source: stage1
      decision: confirmed
      decision_reason: >
        مطابق للمّة الموجودة 'باكستون' بعد التشكيل؛ يُدمج معها ولا يتطلب
        إجراءً مستقلاً — التصحيح مُعالَج بالأمر update_lemma على المدخل الأصلي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "بَارِي"
      source: stage1
      decision: removed
      decision_reason: >
        يُحيل في المعاجم العربية إلى اسم عربي أصيل (من ب ر و = الخالق) وإلى
        اسم موضع عراقي قديم؛ وجوده يُوجد التباساً مع اسم العلم الإنجليزي
        'Barry' (تشارلز باري) الذي يُشير إلى شخص مختلف عن المقصود في هذه المجموعة.

    - lemma: "سكُوت"
      source: stage1
      decision: removed
      decision_reason: >
        اسم علم لشخص آخر (جورج جيلبرت سكوت، 1811-1878) لا ينتمي إلى هذه
        المجموعة الترادفية.

    - lemma: "نَاش"
      source: stage1
      decision: removed
      decision_reason: >
        اسم علم لشخص آخر (جون ناش، 1752-1835) لا ينتمي إلى هذه المجموعة.


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "معماري إنجليزي (1801-1865)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مختزل للغاية: يكتفي بالجنسية والتواريخ دون أي معلومة
        تميّز هذا الشخص عن سائر المعماريين الإنجليز من الحقبة نفسها. لا يُشير
        إلى منجزه الأبرز (قصر الكريستال) ولا إلى تخصصه الأصلي (تصميم الحدائق).
        يجب استبداله بتعريف موسوعي مُختصر يُثبّت هوية الشخص ويُبرز ما اشتُهر به.
    authored:
      - type: encyclopedic
        text: >
          مهندسٌ معماريٌّ إنجليزيٌّ ومصمِّم حدائق (1801-1865)، اشتُهر بتصميم
          قصر الكريستال الهيكلي الزجاجي الحديدي الذي أُقيم في لندن للمعرض الدولي
          الكبير عام 1851، وقد مُنح لقب الفروسية 'Sir' تكريماً لهذا الإنجاز.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            مهندسٌ معماريٌّ إنجليزيٌّ ومصمِّم حدائق (1801-1865)، اشتُهر بتصميم
            قصر الكريستال الهيكلي الزجاجي الحديدي الذي أُقيم في لندن للمعرض الدولي
            الكبير عام 1851، وقد مُنح لقب الفروسية 'Sir' تكريماً لهذا الإنجاز.

  examples:
    per_lemma:
      - lemma: "بَاكْسَتُون"
        examples:
          - text: >
              أسهم بَاكْسَتُون في تغيير مسار تاريخ العمارة الحديثة بابتكاره الهيكل
              الحديدي الزجاجي لقصر الكريستال الذي استضاف المعرض الدولي عام 1851.
            type: usage
      - lemma: "جُوزِيف بَاكْسَتُون"
        examples:
          - text: >
              يُعدّ جُوزِيف بَاكْسَتُون نموذجاً فريداً للمبدع الذاتي التعليم الذي
              انتقل من تصميم الحدائق الملكية إلى إحداث ثورة في عمارة الهياكل الزجاجية.
            type: usage
      - lemma: "سِير جُوزِيف بَاكْسَتُون"
        examples:
          - text: >
              حصل سِير جُوزِيف بَاكْسَتُون على لقب الفروسية من الملكة فيكتوريا
              عام 1851 تقديراً لإنجازه المعماري غير المسبوق في بناء قصر الكريستال.
