# ── المرحلة ٥: الإثراء (البيانات الوصفية) ─────────────────────
stage5_enrichment:

  per_entry:
    # اللمّتان الموجودتان والمضافة: تعريبات، لا جذر عربي → لا maqayis_quote
    - lemma: "بَاكْسَتُون"
      entry_id: "{auto}"
      # root: غير قابل للتطبيق — اسم علم أجنبي مُعرَّب

    - lemma: "جُوزِيف بَاكْسَتُون"
      entry_id: "{auto}"
      # roots: غير قابلة للتطبيق — مركّب من اسمَي عَلَم أجنبيَّين مُعرَّبَين

    - lemma: "سِير جُوزِيف بَاكْسَتُون"
      entry_id: "{auto}"
      # roots: غير قابلة للتطبيق — مركّب من لقب شرفي + اسمَي عَلَم أجنبيَّين

  per_sense:
    - lemma: "بَاكْسَتُون"
      sense_id: "{auto}"
      nuance: >
        الاسم الأخير (اللقب) وحده؛ يُستخدم في السياق الاختصاري حين يكون
        المرجع واضحاً، وشائع في المراجع الأكاديمية والإشارات الضمنية.
      mwe: false

    - lemma: "جُوزِيف بَاكْسَتُون"
      sense_id: "{auto}"
      nuance: >
        الاسم الكامل (الاسم الأول + اللقب) بلا لقب شرفي؛ الصيغة المعيارية
        للتعريف الأول في السياق الموسوعي والتعليمي.
      mwe: true

    - lemma: "سِير جُوزِيف بَاكْسَتُون"
      sense_id: "{auto}"
      nuance: >
        الاسم الكامل مع اللقب الشرفي البريطاني 'Sir'؛ يُستخدم في السياقات
        الرسمية والتاريخية التي تُعنى بإبراز مكانته ومنزلته الاجتماعية
        التي اكتسبها بعد عام 1851.
      mwe: true

  synset:
    cultural_fit: omission
    # المسوِّغ: الشخص مرتبط ارتباطاً كلياً بالتاريخ الثقافي البريطاني؛
    # لا يحمل حضوراً ذاتياً في التراث العربي، ويحتاج إلى مدخل تعريفي كافٍ
    # لقارئ ليس على دراية بعمارة القرن التاسع عشر الإنجليزي.

  actions:
    # ── بيانات المدخل الأول (بَاكْسَتُون) ──
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"transliteration_source":"Paxton","lang_origin":"en","person":true}'

    # ── بيانات المدخل الثاني (جُوزِيف بَاكْسَتُون) ──
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"transliteration_source":"Joseph Paxton","lang_origin":"en","person":true}'

    # ── بيانات المدخل الثالث (سِير جُوزِيف بَاكْسَتُون) ──
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"transliteration_source":"Sir Joseph Paxton","lang_origin":"en","person":true,"honorific":"Sir"}'

    # ── بيانات المعنى الأول ──
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الأخير وحده، يُستخدم في السياق الاختصاري","mwe":false}'

    # ── بيانات المعنى الثاني ──
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الكامل بلا لقب شرفي، الصيغة المعيارية الموسوعية","mwe":true}'

    # ── بيانات المعنى الثالث ──
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الكامل مع اللقب الشرفي السير، للسياقات الرسمية والتاريخية","mwe":true}'

    # ── بيانات المجموعة ──
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"omission"}'

    # ── درجة الثقة ──
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.82
