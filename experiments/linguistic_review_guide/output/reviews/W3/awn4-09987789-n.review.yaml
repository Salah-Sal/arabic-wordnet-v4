# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset: awn4-09987789-n  |  ili: i89248  |  pos: n
# costumier / costumer / costume designer
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ───────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «مسؤول الملابس» مبهمة الدلالة: «مسؤول» تحمل معنى المسؤولية الإدارية الرسمية لا التصميم والتوريد الحرفيَّيْن"
      - "لمّة «مصمم أزياء مسرحية» تُغطّي جانب التصميم فحسب، وتُغفل جانب التوريد والتأجير المنصوص عليهما في التعريف"
      - "التعريف العربي الحالي ترجمة حرفية ركيكة، يفتقر إلى صياغة معجمية وفق أسلوب المعجم الوسيط"
      - "كلتا اللمّتين الموجودتين خاليتان من التشكيل الكامل"
    observations: "المجموعة تصف حرفة مسرحية متخصصة ظهرت مع ازدهار المسرح الحديث في العالم العربي، وتجمع بين الإبداع الفني (التصميم) والحرفة التوريدية (الإعداد والبيع والتأجير). اللمّتان الموجودتان غير متكافئتين: إحداهما غامضة المدلول («مسؤول» لا تُفيد ما يُفيده costumer)، والأخرى دقيقة لكنها ناقصة. يحتاج AWN4 إلى مصطلح يجمع شِقَّي المهنة كما يفعل costumier/costumer في الإنجليزية؛ وكلمة «مَلابِسيّ» الواردة في المورد الحديث تبدو الأنسب لذلك."
  blind_candidates:
    - lemma: "زَيَّاءٌ"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن فَعَّال الدالّ على الاحتراف والامتهان (كخَبَّاز ونَجَّار وخَيَّاط) من الزِّيّ (جمعه أزياء)؛ الزَّيَّاء: المحترف في إعداد الأزياء وتصميمها"
    - lemma: "مُصَمِّمُ الأَزياءِ المَسرحيَّةِ"
      generation_method: tarkib
      justification: "تركيب إضافي وصفي يُقيَّد فيه «مصمم الأزياء» بالنعت «المسرحية» لتمييزه عن مصمم الأزياء العام الوارد في المجموعة الأم؛ يُحدِّد التخصص الدقيق للمهنة"
    - lemma: "خَيَّاطُ المَسرحِ"
      generation_method: tarkib
      justification: "تركيب إضافي يستحضر حرفة الخياطة بوصفها الجوهر التنفيذي لعمل هذا الشخص، مع الإضافة إلى المسرح لتخصيص المجال؛ الخيّاط في الأصل يصمم وينفّذ الملابس ويُعدِّلها"
    - lemma: "مُلَبِّسٌ"
      generation_method: ishtiqaq
      justification: "اشتقاق على وزن مُفَعِّل من جذر «لبس»: الذي يُلبِّس غيره ويُزوِّده بالملابس؛ الصيغة تدل على الفاعل المُعدِّي الذي يُكسي الممثلين ويُجهِّزهم بأزيائهم"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
# الاستعلامات المُنفَّذة (٥ استعلامات):
#   Q1: batch headword lookup — lemmas + candidates (جميع الصور)
#   Q2: English bridge — costumier / costumer / costume designer / costume
#   Q3: Arabic FTS — أزياء | زي | مسرح | تنكري
#   Q4: combined enrichment (definitions + examples) — entry_ids من Q1+Q2
#   Q5: مقاييس اللغة — جذور لبس / زوي / صمم / سرح
stage2_evidence:
  per_lemma:
    - lemma: "مسؤول الملابس"
      evidence_status: "no_material_found"

    - lemma: "مصمم أزياء مسرحية"
      confirm:
        - text: "«مُصَمِّم أزياء» — fashion designer"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«مصمّم أزياء» — dress-designer"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ALECSO، 1999)"

    - lemma: "زَيَّاءٌ"
      evidence_status: "no_material_found"

    - lemma: "مُصَمِّمُ الأَزياءِ المَسرحيَّةِ"
      confirm:
        - text: "«مُصَمِّم أزياء» — fashion designer"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ALECSO)"
        - text: "«مصمّم أزياء» — dress-designer"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (ALECSO، 1999)"

    - lemma: "خَيَّاطُ المَسرحِ"
      expands:
        - text: "«المَلابسيّ: من يخيط الملابس للمسرحيات والكرنفالات إلخ أو يبيعها أو يؤجّرها»"
          source: "المورد الحديث (2008) — مقابل costumer"
          addition: "الدليل يثبت أن «الخياطة للمسرح» مفهوم مستعمل في العربية المعاصرة، غير أن المصطلح المعتمد معجمياً هو «المَلابِسيّ» لا «خياط المسرح»"

    - lemma: "مُلَبِّسٌ"
      contradicts:
        - text: "«مُلَبّس: مشمع الأرضية الملون» — inlaid"
          source: "مسرد صناعة النسيج (ALECSO)"
          conflict: "«مُلَبَّس» بالتشديد يعني شيئاً مغطى بطبقة مادية، لا الشخص الذي يُجهِّز الأزياء"
        - text: "«المُلَبَّسُ: لوزة أو نحوها تُغَشَّى بطبقةٍ يابسة من الحلوى. (محدثة)»"
          source: "المعجم الوسيط"
          conflict: "الصيغة المشهورة «مُلَبَّس» تعني الملفوف بطبقة، وهذا الاستخدام المرسَّخ يتعارض مع استخدامها للدلالة على مصمم الأزياء"
      expands:
        - text: "«المَلابسيّ: من يخيط الملابس للمسرحيات والكرنفالات إلخ أو يبيعها أو يؤجّرها»"
          source: "المورد الحديث (2008) — مقابل costumer"
          addition: "الصيغة المدعومة معجمياً هي «مَلابِسيّ» (نسبة إلى الملابس) لا «مُلَبِّس»؛ وهي أشمل وأدق وأثبت في الاستعمال"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مسؤول الملابس"
      decision: removed
      decision_reason: "«مسؤول» يدل على المسؤولية الإدارية والرقابية لا على التصنيع والتوريد؛ يُقال «مسؤول المستودع» أو «مسؤول الإنتاج»، لكن لا يُقال «مسؤول الملابس» ليُعبَّر عن المحترف الفني الذي يصمم الأزياء أو يوردها. التعبير ركيك صرفياً ودلالياً ولا أساس له في المعاجم"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مصمم أزياء مسرحية"
      decision: confirmed
      decision_reason: "مصطلح تركيبي مدعوم في معاجم ARABTERM، يُعبِّر بدقة عن الجانب الإبداعي للمهنة؛ اجتاز اختبار التثبيت المعجمي (مصمم أزياء وحدة ثابتة موثقة). يحتاج تشكيلاً كاملاً"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "يُركِّز على الجانب الإبداعي الفني (التصوُّر والتصميم) ويُخصِّصه بالوصف «مسرحية»، في مقابل «مَلابِسيّ» الذي يُبرز الجانب الحرفي الشامل للإعداد والتوريد والتأجير"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُصَمِّمُ أَزياءٍ مَسرحيَّة"

    - lemma: "زَيَّاءٌ"
      source: stage1
      decision: removed
      decision_reason: "لا دليل معجمي على ثبوت هذا الوزن من جذر الزِّيّ بمعنى المحترف في الأزياء؛ وإن كان الوزن فَعَّال مطّرداً للحِرَف، فإن «زَيَّاء» لم يُثبَّت في أي معجم كلاسيكي أو حديث"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُصَمِّمُ الأَزياءِ المَسرحيَّةِ"
      source: stage1
      decision: removed
      decision_reason: "مكرِّر للمّة الموجودة «مصمم أزياء مسرحية» بفارق صرفي طفيف (التعريف والإضافة)؛ لا مسوّغ لإدراج اللمّتين معاً في المجموعة"
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "خَيَّاطُ المَسرحِ"
      source: stage1
      decision: removed
      decision_reason: "الخياطة وجه واحد من وجوه المهنة المتعددة (التصميم + الإعداد + التوريد + التأجير)؛ المصطلح لا يستوفي تعريف المجموعة، وأدلة المرحلة الثانية تثبت أن المصطلح المعتمد هو «مَلابِسيّ» الأشمل"
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "مُلَبِّسٌ"
      source: stage1
      decision: removed
      decision_reason: "صيغة «مُلَبِّس» غير موثقة بمعنى مصمم الأزياء المسرحي؛ الأدلة المعجمية تتعارض معها (مُلَبَّس = مطلي/مغطى). غير أن الأدلة كشفت عن المصطلح الصحيح من نفس الجذر: «مَلابِسيّ» في المورد الحديث — يُقترح إدراجه"
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params:
            lemma: "مَلابِسيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
  definition:
    current: "شخص يصمم أو يورد الأزياء (خاصة للمسرحيات أو الحفلات التنكرية)"
    assessment:
      decision: revise
      reason: "التعريف ترجمة حرفية من الإنجليزية: «شخص» جنس قريب مبهم وغير معجمي، و«يصمم أو يورد» صياغة ركيكة، والأقواس مستعارة من بنية الإنجليزية. يجب أن يبدأ التعريف بالجنس القريب الدقيق ويتبعه الفصل النوعي وفق أسلوب المعجم الوسيط"
    authored:
      - type: terminological
        text: "مُتَخَصِّصٌ في تصميم الأزياء المسرحية وإعدادها وتوريدها للممثلين في أعمال التمثيل والحفلات التنكرية"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "محترف فني يضطلع بمهمة تصميم ملابس الممثلين وأزياء العروض المسرحية والاستعراضية، ويشمل عمله أحياناً صنع هذه الأزياء أو توريدها وتأجيرها لفِرَق التمثيل والكرنفالات"
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُتَخَصِّصٌ في تصميم الأزياء المسرحية وإعدادها وتوريدها للممثلين في أعمال التمثيل والحفلات التنكرية"
      - command: add_definition
        params:
          synset_id: "{synset_id}"
          text: "محترف فني يضطلع بمهمة تصميم ملابس الممثلين وأزياء العروض المسرحية والاستعراضية، ويشمل عمله أحياناً صنع هذه الأزياء أو توريدها وتأجيرها لفِرَق التمثيل والكرنفالات"

  examples:
