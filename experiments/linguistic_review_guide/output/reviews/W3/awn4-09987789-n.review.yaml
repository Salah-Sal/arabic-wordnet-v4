      - lemma: "مُصَمِّمُ أَزياءٍ مَسرحيَّة"
        examples:
          - text: "اختارت فرقة المسرح القومي مُصَمِّمَ أزياءٍ مسرحية مخضرماً لإعداد أردية العرض التاريخي الجديد المستوحى من حقبة الدولة الأيوبية."
            type: usage
      - lemma: "مَلابِسيّ"
        examples:
          - text: "يعمل المَلابِسيّ مع المخرج منذ مراحل التحضير الأولى ليوفِّر الأزياء التي تُجسِّد شخصيات العرض المسرحي وتُعبِّر عن بيئاتها الزمنية."
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "اختارت فرقة المسرح القومي مُصَمِّمَ أزياءٍ مسرحية مخضرماً لإعداد أردية العرض التاريخي الجديد المستوحى من حقبة الدولة الأيوبية."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
