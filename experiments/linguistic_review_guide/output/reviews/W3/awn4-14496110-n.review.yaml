# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14496110-n — bugginess
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «كثرة الأخطاء البرمجية» عبارة وصفية حرة وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ (يمكن إبدال «كثرة» بـ«وفرة» أو «تراكم» ويبقى التعبير صالحاً)"
      - "التعريف العربي «حالة احتواء على أخطاء برمجية» شبه مطابق للّمة — دوران معجمي"
      - "المفهوم الإنجليزي bugginess مصطلح تقني حاسوبي يصف حالة/صفة (state) لا كمّية، بينما «كثرة» تشير إلى الكمّ"
      - "المجموعة تحتوي لمّة واحدة فقط — ضعف التغطية المعجمية"
    observations: "المفهوم المقصود هو الحالة التي يكون فيها البرنامج مليئاً بالعلل البرمجية (bugs)، وهي صفة حالية لا كمّية. المصطلح الإنجليزي bugginess مشتق من bug بلاحقة -ness الدالة على الحالة. في العربية، يُعبَّر عن هذا المعنى عادةً بالمصدر الصناعي (-يَّة) أو بصيغة المصدر. الأقرب عربياً هو ربط المفهوم بـ«العلة البرمجية» (bug) ثم اشتقاق حالة منها."

  blind_candidates:
    - lemma: "عِلَلِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «عِلَل» (جمع عِلَّة)، على وزن فِعَلِيَّة، للدلالة على حالة كون الشيء مليئاً بالعلل. العِلَّة في الاصطلاح الحاسوبي تُستخدم بمعنى bug."
    - lemma: "عَثَرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «عَثَر» بمعنى الكبوة والسقوط والخطأ، مستنداً إلى ما ورد في معجم المعلوماتية: «عَثْري = buggy». فالعَثَرِيَّة حالة كون البرنامج ذا عثرات."
    - lemma: "اسْتِعْلَال"
      generation_method: ishtiqaq
      justification: "مصدر استفعال من الجذر «علل»، على وزن اسْتِفْعَال، للدلالة على حالة الإصابة بالعلل المتكررة. الوزن يناسب المعنى الحالي المستمر."
    - lemma: "تَعَلُّل بَرْمَجِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «تَعَلُّل» (مصدر تَعَلَّلَ: أصابته العلل) و«بَرْمَجِيّ» للتخصيص. يدل على حالة الإصابة المتكررة بالعلل البرمجية."

stage2_evidence:
  per_lemma:
    - lemma: "كَثْرَة الأَخْطَاء البَرْمَجِيَّة"
      evidence_status: "no_material_found"

    - lemma: "عِلَلِيَّة"
      expands:
        - text: "«العِلَّة: لغةً: عبارة عن معنى يحل بالمحل فيتغير به حال المحل بلا اختيار، ومنه يسمى المرض علة؛ لأنه بحلوله يتغير حال الشخص من القوة إلى الضعف»"
          source: "التعريفات للجرجاني (عبر حوارماني)"
          addition: "تأصيل دلالة العلة بوصفها ما يغيّر حال الشيء — يتوافق مع المعنى الحاسوبي للعلة البرمجية"
        - text: "«الْعلَّة: بِالْفَتْح الضرة وَمِنْه بَنو العلات. وبالكسر فِي اللُّغَة هِيَ الْعرض الَّذِي إِذا حل فِي معروضه يتَغَيَّر بِهِ حَاله»"
          source: "دستور العلماء للأحمدنكري"
          addition: "تأكيد أن العِلَّة (بالكسر) عَرَض يغيّر حال الشيء"

    - lemma: "عَثَرِيَّة"
      confirm:
        - text: "«عَثْري (ذو عَثْرات) — buggy»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«(العثري) العثر وَالَّذِي لَا يجد فِي طلب دنيا وَلَا آخِرَة»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "الدلالة الأصلية للعثري تتعلق بالخمول وعدم الجدّ — بعيدة عن المعنى التقني"
        - text: "«(تعثر) مُطَاوع عثره وَيُقَال تعثر حَظه وتعثر لِسَانه تلعثم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "التعثر يدل على الكبوة والسقوط — أقرب للخطأ البرمجي"

    - lemma: "اسْتِعْلَال"
      evidence_status: "no_material_found"

    - lemma: "تَعَلُّل بَرْمَجِيّ"
      evidence_status: "no_material_found"

    - lemma: "خَلَل"
      confirm:
        - text: "«الخَلَل: مُنفرَج ما بين كل شيئين الفساد والضَّعف»"
          source: "المعجم الوسيط"
      expands:
        - text: "«الخلل: اضطراب الشيء وعدم انتظامه، وأصله فرجة بين الشيئين. والخلل في الأمر كالوهن فيه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "توسيع دلالة الخلل لتشمل الاضطراب وعدم الانتظام"

    - lemma: "عِلَّة"
      confirm:
        - text: "«العِلَّة: لغةً: عبارة عن معنى يحل بالمحل فيتغير به حال المحل بلا اختيار، ومنه يسمى المرض علة»"
          source: "التعريفات للجرجاني (عبر حوارماني)"
      expands:
        - text: "«العلة التامة: ما يجب وجود المعلول عندها، وقيل: العلة التامة جملة ما يتوقف عليه وجود الشيء»"
          source: "التعريفات للجرجاني (عبر حوارماني)"
          addition: "للعلة استعمالات فلسفية ومنطقية متعددة قد تسبب التباساً"


stage3_analysis:
  per_lemma:
    # ── اللمة الموجودة ──
    - lemma: "كَثْرَة الأَخْطَاء البَرْمَجِيَّة"
      decision: removed
      decision_reason: "عبارة وصفية حرة وليست مصطلحاً مسكوكاً ولا وحدة معجمية ثابتة. تفشل في اختبار السكّ: يمكن استبدال «كثرة» بـ«وفرة» أو «تراكم» دون تغيّر المعنى. كما أن «الكثرة» تدل على الكمّ بينما المفهوم المقصود حالة (state) لا كمّية. لا توجد أدلة معجمية لهذا التركيب."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──
    - lemma: "عِلَلِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: "مصدر صناعي منتظم من «عِلَل» (جمع عِلَّة = bug)، يدل على حالة كون البرنامج مصاباً بالعلل. العِلَّة مصطلح شائع في الحوسبة العربية بمعنى bug. الوزن -يَّة يناسب التعبير عن الحالة (state) كما في الإنجليزية bugginess = bug + -ness."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "تركّز على الحالة المجردة لوجود العلل بدلالة المصدر الصناعي — أقرب المرشحات إلى المفهوم الأصلي"
      actions:
        - command: create_entry
          params:
            lemma: "عِلَلِيَّة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "عَثَرِيَّة"
      source: stage1
      decision: removed
      decision_reason: "رغم ورود «عَثْري = buggy» في معجم المعلوماتية، فإن الدلالة الأصلية للعثري في المعاجم التراثية (الخمول وعدم الجدّ) بعيدة جداً عن المعنى التقني. كما أن «عَثَرِيَّة» غير مسجّلة ولا مستعملة، والمصطلح «عَثْري» نفسه لم يشع في الاستعمال الحاسوبي العربي."
      evidence_assessment:
        case: mixed

    - lemma: "اسْتِعْلَال"
      source: stage1
      decision: removed
      decision_reason: "صيغة استفعال من «علل» غير مسموعة ولا مسجّلة في المعاجم. الوزن اسْتِفْعَال يدل عادة على الطلب (طلب العلة) لا على الحالة. لا أدلة معجمية تدعمه."
      evidence_assessment:
        case: no_material

    - lemma: "تَعَلُّل بَرْمَجِيّ"
      source: stage1
      decision: removed
      decision_reason: "«التَّعَلُّل» في المعاجم بمعنى التسلّي والتلهّي، لا بمعنى الإصابة بالعلل. المركب الوصفي غير مسكوك ولا مسجّل. دلالة الوزن تَفَعُّل لا تناسب المعنى المطلوب."
      evidence_assessment:
        case: no_material


