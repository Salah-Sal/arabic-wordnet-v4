# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14339779-n (bunion / وكعة)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «إبهام أفحج» تُقابل في المعاجم الطبية مصطلح hallux varus (انحراف إبهام القدم نحو خطّ الوسط) لا bunion (الوكعة)"
      - "الخلط بين الانحراف المَفْصَلي (hallux varus/valgus) والتورّم الجِرابي (bunion) يُفضي إلى خطأ تصنيفي"
      - "التعريف العربي دقيق لغوياً لكنه لا يتوافق مع دلالة اللمّة الأولى «إبهام أفحج»"
    observations: "المفهوم المستهدف هو تضخّم مؤلم في الجراب الزلالي لمفصل إبهام القدم الأوّل، أي ما يُعرف بالإنجليزية bunion. الوَكَعُ في العربية ميلان إبهام الرِّجل على السَّبّابة حتى يُرى أصلها خارجاً كالعُقدة، والوَكْعَة اسم للحالة الطبّية المحدَّدة (bunion). أمّا «إبهام أفحج» فيُقابل hallux varus في المعجم الطبّي الموحَّد ومعجم المصطلحات الطبّية، وهو انحراف مرضي مختلف عن الوكعة."

  blind_candidates:
    - lemma: "وَكْعَة"
      generation_method: ishtiqaq
      justification: "اسم المرّة من الجذر «وكع» الدالّ على ميلان إبهام الرِّجل، استقرّ في المعاجم الطبّية الحديثة مقابلاً لـ bunion"
    - lemma: "وَكَع"
      generation_method: ishtiqaq
      justification: "المصدر من «وَكِعَ يَوْكَعُ» يدلّ على الحالة العامّة لميلان صدر القدم وركوب الإبهام على السبّابة"
    - lemma: "تَوَرُّمُ الإبْهَام"
      generation_method: tarkib
      justification: "مركّب إضافيّ يصف المفهوم مباشرةً (تورّم + إبهام)، لكنّه وصفيّ لا مصطلحيّ"
    - lemma: "بُنْيُون"
      generation_method: taarib
      justification: "تعريب للفظ الإنجليزي bunion، ملاذ أخير بوجود المقابل العربي «وَكْعَة»"


stage2_evidence:
  per_lemma:
    # ── اللمّة الموجودة ١: إبهام أفحج ──
    - lemma: "إبهام أفحج"
      contradicts:
        - text: "«انحراف مرضي فى إبهام القدم نحو خط الوسط للجسم.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          conflict: "التعريف يُقابل hallux varus وليس bunion؛ الانحراف نحو خطّ الوسط هو العكس تماماً من الحالة المسبِّبة للوكعة (hallux valgus)"
      expands:
        - text: "«إبهام أفحج — hallux = hallex, varus»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "المصطلح اللاتيني المقابل هو hallux varus لا bunion"
        - text: "«إِبْهامُ القَدَمِ الأَفْحَج — hallux varus»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "الصيغة الكاملة في المعجم الموحّد هي «إبهام القدم الأفحج» وتقابل hallux varus"

    # ── اللمّة الموجودة ٢: وكعة ──
    - lemma: "وَكْعَة"
      confirm:
        - text: "«التهاب الكيس الزلالي في إبهام القدم، ينتج عن انعطاف الإبهام على الأصبع الثانية.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
        - text: "«وَكْعَة (تَوَرُّمٌ ثَفَنِيٌّ في الابهام الأفحج) — bunion»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«الوَكَع: ورمٌ ملتَهِب في المَفْصِل الأول من إبهام القدم. — bunion»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«وَكْعَةُ الخَيَّاطين (وُكَيعَة) — tailors' bunion (bunionette)»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "يوجد مصغَّر «وُكَيْعَة» للدلالة على bunionette عند الخنصر"

    # ── مرشّح المرحلة ١: وَكَع ──
    - lemma: "وَكَع"
      confirm:
        - text: "«(وكع) فلان (يوكع) وكعا أقبلت إبهام رجله على السبابة حتى يرى أصلها خارجاً كالعقدة»"
          source: "المعجم الوسيط"
        - text: "«الوَكَعُ بالتحريك: إقبالُ الإبهام على السبَّابة من الرِّجْل حتَّى يُرى أصلُها خارجاً كالعُقدة»"
          source: "الصحاح للجوهري"
        - text: "«وَكَع: (طب) ركوب إبهام الرِّجل على السَّبَّابة حتَّى يُرى أصلُها خارجًا كالعُقدة.»"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«الوَكَعُ: مَيَلانُ إبْهامِ الرِّجلِ على الأصابعِ.»"
          source: "المحيط في اللغة للصاحب بن عبّاد"
          addition: "الدلالة أعمّ من الوكعة؛ وَكَع = الحالة العامة، وَكْعَة = الحدث الواحد أو التورّم المحدّد"

    # ── مرشّح المرحلة ١: تَوَرُّمُ الإبْهَام ──
    - lemma: "تَوَرُّمُ الإبْهَام"
      evidence_status: "no_material_found"

    # ── مرشّح المرحلة ١: بُنْيُون ──
    - lemma: "بُنْيُون"
      evidence_status: "no_material_found"


stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة: إبهام أفحج ──
    - lemma: "إبهام أفحج"
      decision: removed
      decision_reason: "الأدلّة المعجمية تُثبت أنّ «إبهام أفحج» يُقابل hallux varus (انحراف الإبهام نحو خطّ الوسط) لا bunion (تورّم الجراب الزلالي). الخلط ناتج من كون الوكعة قد تصاحب انحراف الإبهام، لكنّ المصطلحَيْن يدلّان على مفهومَيْن طبّيَّيْن متمايزَيْن."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── اللمّة الموجودة: وكعة ──
    - lemma: "وَكْعَة"
      decision: confirmed
      decision_reason: "مصطلح طبّي عربيّ مُسجَّل في المعجم الطبّي الموحّد ومعجم المصطلحات الطبّية والمورد الحديث بمعنى bunion تحديداً. مشتقّ من جذر عربيّ أصيل (وكع) ومتوافق صرفياً مع وزن فَعْلَة الدالّ على المرّة أو الحالة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الطبّي المحدَّد للتورّم الجِرابي في مفصل إبهام القدم (bunion)، بخلاف «الوَكَع» الذي يدلّ على الحالة العامّة لميلان الإبهام"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَكْعَة"

    # ── مرشّح المرحلة ١: وَكَع ──
    - lemma: "وَكَع"
      source: stage1
      decision: removed
      decision_reason: "الوَكَع يدلّ على الحالة العامّة (ميلان الإبهام) لا على التورّم الجِرابي تحديداً. المجموعة الترادفية تُعرَّف بالتضخّم المؤلم في الجراب الزلالي وهو مفهوم أخصّ ممّا يدلّ عليه «الوَكَع»."
      evidence_assessment:
        case: mixed

    # ── مرشّح المرحلة ١: تَوَرُّمُ الإبْهَام ──
    - lemma: "تَوَرُّمُ الإبْهَام"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حرّ لا مصطلح مسكوك؛ يمكن استبدال «تورّم» بـ«انتفاخ» أو «تضخّم» مع بقاء المعنى، ممّا ينفي صفة المصطلحية. لم يُسجَّل في أيّ معجم طبّي بوصفه وحدة معجمية."
      evidence_assessment:
        case: no_material

    # ── مرشّح المرحلة ١: بُنْيُون ──
    - lemma: "بُنْيُون"
      source: stage1
      decision: removed
      decision_reason: "تعريب غير ضروري بوجود المقابل العربي الأصيل «وَكْعَة» المسجَّل في المعاجم الطبّية. مبدأ إيثار العربي يمنع قبوله."
      evidence_assessment:
        case: no_material


