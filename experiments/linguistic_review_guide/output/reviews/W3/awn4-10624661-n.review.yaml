# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id: awn4-10624661-n  |  ILI: i93034  |  POS: n
# المفهوم: skier — مَن يمارس التزلج على الثلج
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمة الوحيدة (متزلج) لا تحمل تشكيلاً كاملاً في قاعدة البيانات"
      - "التعريف العربي يحتوي على قوس تفسيري '(على الثلج)' يُضعف أسلوبه المعجمي"
      - "المجموعة تقتصر على لمة واحدة رغم وجود مصطلحات عربية أخرى معتمدة للمفهوم"
    observations: "المجموعة تدل على فاعل رياضي متخصص؛ الجذر المحتمل هو (ز-ل-ج) الذي يدل في أصله على السرعة والانزلاق، مما يجعل الوزن مُتَفَعِّل مناسباً للدلالة على مزاول هذا الفعل. التعريف الحالي وظيفي لكنه يحتاج إلى صياغة على نمط معجمي أكثر دقة مع إدراج الجنس القريب (رياضي) والفصل النوعي (الزحلوفتان). المجموعة في حاجة إلى استقصاء أعمق لمعرفة ما إذا كانت ثمة مصطلحات عربية أخرى تنافس اللمة الموجودة."
  blind_candidates:
    - lemma: "زَلَّاج"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ز-ل-ج) على وزن فَعَّال الدال على المزاولة والاحتراف، كما في نجّار وبنّاء وحدّاد. الجذر يدل على الانزلاق والسرعة، فيكون الزَّلَّاج وصفاً لمن يزلج باحتراف وتكرار."
    - lemma: "زَالِج"
      generation_method: ishtiqaq
      justification: "اسم الفاعل من (زَلِجَ) على وزن فاعل؛ تُعلّم المعاجم أن كل سريع الحركة منزلق يُسمى زالجاً، مما يُتيح توظيفه وصفاً لمن ينزلق على الثلج بسرعة."
    - lemma: "مُتَزَحِّل"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ز-ح-ل) على وزن مُتَفَعِّل الدال على الانزياح والتنقل؛ الزَّحَل يدل على الانتقال والانزياح عن المكان، مما يمكن توظيفه لمن ينتقل منزلقاً على الثلج."
    - lemma: "مُنْزَلِق"
      generation_method: ishtiqaq
      justification: "اسم الفاعل من (انزلق) على وزن مُنْفَعِل من الجذر (ز-ل-ق)؛ يدل في أصله على الانتقال الأملس على سطح زلق، وهو وصف دقيق لحركة المتزلج على الثلج."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة (٥ استعلامات):
#   ١. مطابقة دفعية: متزلج + المتزلج + الزلاج + الزالج + متزحل + منزلق
#   ٢. الجسر الإنجليزي: skier, ski, skiing
#   ٣. إثراء بالمعرّف (definitions + examples) للمداخل المعثور عليها
#   ٤. بحث FTS عربي: تزلج، متزلج، تزحلف، متزحلف
#   ٥. مقاييس اللغة: جذور زلج، زلق، زحلف
stage2_evidence:
  per_lemma:
    - lemma: "مُتَزَلِّج"
      confirm:
        - text: "«عَلامَةُ الِاسْتِلْقَاءِ: مُنْخَفَضٌ يُخَلِّفُهُ فِي الثَّلْجِ مُتَزَلِّجٌ سَاقِطٌ عَلَى ظَهْرِهِ»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الزَّاءُ وَاللَّامُ وَالْجِيمُ أُصَيْلٌ يَدُلُّ عَلَى الِانْدِفَاعِ وَالدَّفْعِ... وَالزَّلْجُ: السُّرْعَةُ فِي الْمَشْيِ وَغَيْرِهِ، وَكُلُّ سَرِيعٍ زَالِجٌ. وَسَهْمٌ زَالِجٌ: يَتَزَلَّجُ مِنَ الْقَوْسِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "أصل الجذر (ز-ل-ج) يدل على السرعة والانزلاق والاندفاع، مما يُسوّغ صياغة مُتَزَلِّج على وزن مُتَفَعِّل دالاً على مَن يمارس هذا الانزلاق"

    - lemma: "زَلَّاج"
      contradicts:
        - text: "«الزَّلَّاجُ: ضَرْبٌ مِنَ الزَّوَارِقِ النَّهْرِيَّةِ الْخَفِيفَةِ السَّرِيعَةِ، كَانَ مَعْرُوفاً فِي مِصْرَ إِبَّانَ الْفَتْحِ الْإِسْلَامِيِّ»"
          source: "المعجم الكبير"
          conflict: "اللمة مشغولة بمعنى مستقر هو نوع من الزوارق النهرية، لا شخص يتزلج"
        - text: "«الزَّلَّاجُ: الْمِغْلَاقُ، يُفْتَحُ بِالْيَدِ أَوْ بِالْمِفْتَاحِ»"
          source: "المعجم الكبير"
          conflict: "معنى ثانٍ مرتبط بأداة الإغلاق؛ الاشتراك اللفظي المستقر يجعل الإحياء مُلبِساً"

    - lemma: "زَالِج"
      contradicts:
        - text: "«الزَّالِجُ: النَّاجِي مِنَ الْغَمَرَاتِ وَنَحْوِهَا»"
          source: "المعجم الكبير"
          conflict: "اللمة مشغولة بمعنى 'الناجي من الشدائد'، مغاير تماماً لمن يمارس رياضة التزلج"
        - text: "«مَنْ يَشْرَبُ شُرْباً شَدِيداً»"
          source: "المعجم الوسيط"
          conflict: "المعنى الثاني دالّ على الشارب الثقيل، ولا صلة له بالرياضة"

    - lemma: "مُتَزَحِّل"
      evidence_status: "no_material_found"

    - lemma: "مُنْزَلِق"
      evidence_status: "no_material_found"

    # ── مرشح اكتُشف أثناء جمع الأدلة (الجسر الإنجليزي) ──
    - lemma: "مُتَزَحْلِف"
      confirm:
        - text: "«المُتَزَحْلِف (را. ski)»"
          source: "المورد الحديث (2008) — ترجمة مباشرة لـ skier"
        - text: "«تَزَحْلَفَ الشَّيْءُ: تَدَحْرَجَ. يقال: زَحْلَفه فتَزَحْلَفَ — تَنَحَّى — الشَّمْسُ: زالَتْ عَنْ كَبِدِ السَّمَاءِ وَمَالَتْ لِلْمَغِيبِ»"
          source: "المعجم الكبير"
        - text: "«(تزحلف) تزحلق»"
          source: "المعجم الوسيط"
        - text: "«التَّزَحْلُفُ: مِثْلُ التَّزَحْلُقِ، وَالزُّحْلُوفَةُ: مَوْضِعٌ يَأْتِي الصِّبْيَانُ إِلَيْهِ فَيَتَزَحْلَقُونَ عَلَيْهِ... وَالزُّحْلُوفُ: الصَّفَا الْأَمْلَسُ يُشَبَّهُ الْمَتْنُ السَّمِينُ بِهِ»"
          source: "المحيط في اللغة للصاحب بن عباد"
      expands:
        - text: "«وَشَهْبَاءَ تَنْبُو النَّبْلُ عَنْها كَأَنَّها * صَفَا زَلَّ عَنْ أَرْكَانِهِ الْمُتَزَحْلِفُ» — ابن مُقبِل"
          source: "المعجم الكبير (شاهد شعري)"
          addition: "الشاهد يستخدم المُتَزَحْلِف وصفاً للصفا الأملس الزلق، مما يُثبت الاستخدام الفصيح للجذر بوزن مُتَفَعْلِل في الدلالة على الانزلاق"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مُتَزَلِّج"
      decision: confirmed
      decision_reason: "اللمة موثقة في المورد الحديث في سياق التزلج الثلجي توثيقاً صريحاً. جذرها (ز-ل-ج) يدل على السرعة والانزلاق بشهادة مقاييس اللغة. الوزن مُتَفَعِّل مناسب للدلالة على مزاول الفعل بصورة تكرارية ومستمرة. تحتاج إلى إضافة تشكيل كامل."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الانزلاق السريع والاندفاع من خلال الجذر زلج (السرعة في المشي وغيره)؛ هو الأكثر شيوعاً في الكتابة العربية المعاصرة واستخداماً في وسائل الإعلام العربية لوصف مزاول رياضة التزلج الثلجي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَزَلِّج"

    - lemma: "زَلَّاج"
      source: stage1
      decision: removed
      decision_reason: "اللمة مشغولة في المعاجم الكبرى بمعنيين مستقرين راسخين: نوع من الزوارق النهرية، وأداة الإغلاق؛ الاشتراك اللفظي يُوقع في اللبس ويُفسد التوظيف الجديد."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "زَالِج"
      source: stage1
      decision: removed
      decision_reason: "اللمة مشغولة بمعنى 'الناجي من الغمرات' و'الشارب الثقيل' في المعجمين الوسيط والكبير؛ لا يصلح توظيفها للمتزلج بسبب الاشتراك اللفظي المستقر، ولا يوجد أصل معجمي يدعم هذا التوظيف الجديد دون إلباس."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُتَزَحِّل"
      source: stage1
      decision: removed
      decision_reason: "لا مادة معجمية توافق هذا الوزن من الجذر (ز-ح-ل)؛ والجذر في أصله يدل على الإبطاء والتنحي والانزياح الإرادي البطيء (ومنه كوكب زحل)، لا على الانزلاق الرياضي السريع. يختلف عن الجذر الرباعي (زحلف) الذي يدل على الانزلاق الفعلي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُنْزَلِق"
      source: stage1
      decision: removed
      decision_reason: "لا مادة معجمية تدعم هذا التوظيف بمعنى رياضي؛ وزن مُنْفَعِل يدل على الانزلاق اللاإرادي العَرَضي لا على المزاول المحترف. يفتقر إلى التثبيت المعجمي في سياق الرياضة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    # ── مرشح مكتشف من الأدلة (الجسر الإنجليزي) ──
    - lemma: "مُتَزَحْلِف"
      source: stage1
      decision: confirmed
      decision_reason: "وثّقه المورد الحديث (2008) بصريح اللفظ مقابلاً لـ skier. جذره الرباعي (ز-ح-ل-ف) يدل على الانزلاق والتدحرج بشهادة المعجم الكبير ('تزحلف: تدحرج') والمعجم الوسيط ('تزحلف: تزحلق') والمحيط في اللغة. شاهد ابن مُقبِل الشعري يُثبت استخدام المُتَزَحْلِف في الفصيح للدلالة على ما يَزلق على سطح أملس. الوزن مُتَفَعْلِل مناسب للدلالة على مزاول النشاط. ملاحظة: اكتُشف هذا المرشح أثناء جمع الأدلة (المرحلة ٢) لا أثناء التوليد الأعمى."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الانزلاق التدريجي والحركة على السطح الأملس من خلال الجذر زحلف (تدحرج وانزلق على الصفا)؛ مستخدم في المعاجم الحديثة المتخصصة (المورد الحديث، المحيط)، ويُفيد دلالة الاحتكاك البطيء الأملس ببنية الثلج"
      actions:
        - command: create_entry
          params:
            lemma: "مُتَزَحْلِف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


