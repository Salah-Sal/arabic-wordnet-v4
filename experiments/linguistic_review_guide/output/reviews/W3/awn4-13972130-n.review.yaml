# ═══════════════════════════════════════════════════════════════
# AWN4 Review — awn4-13972130-n  (championship / بطولة)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (بطولة)، بينما المقابل الإنجليزي يشمل championship وtitle"
      - "التعريف العربي الحالي «مكانة كونه بطلاً» ترجمة حرفية ركيكة للتعريف الإنجليزي"
    observations: "المفهوم واضح ومستقرّ في العربية المعاصرة: البُطُولَة مصدر بَطُلَ على وزن فُعُولَة، ويدلّ على مكانة الشجاعة والتفوّق في المنافسة. المفهوم شائع في الخطاب الرياضي والثقافي العربي المعاصر. الرابط فوقي (مكانة عالية) مناسب."
  blind_candidates:
    - lemma: "بُطُولَة"
      generation_method: ishtiqaq
      justification: "مصدر بَطُلَ على وزن فُعُولَة، يدلّ على حالة كون المرء بطلاً متفوّقاً في لعبة أو مسابقة، وهو اللفظ الطبيعي المباشر لهذا المفهوم"
    - lemma: "صَدَارَة"
      generation_method: ishtiqaq
      justification: "مصدر من صَدَرَ على وزن فَعَالَة، يدلّ على التقدّم والمرتبة الأولى، وهو قريب من مفهوم التفوّق والأوّليّة"
    - lemma: "غَلَبَة"
      generation_method: ishtiqaq
      justification: "مصدر غَلَبَ، يدلّ على الاستيلاء والقهر والتفوّق على المنافسين"
    - lemma: "تَفَوُّقِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من تَفَوُّق، يدلّ على حالة التفوّق والعلوّ، مولّد على قياس الاشتقاق الصناعي"

stage2_evidence:
  per_lemma:
    - lemma: "بُطُولَة"
      confirm:
        - text: "«بَطُلَ بُطُولَةً: شَجُع واستبسل»"
          source: "المعجم الوسيط"
        - text: "«فُلانٌ - بُطولةً, وبَطالةً: صار شُجاعًا»"
          source: "المعجم الكبير"
        - text: "«(بَطل) بطولة شجع واستبسل فَهُوَ بَطل (ج) أبطال»"
          source: "المعجم الوسيط (حوراماني)"
        - text: "«(1) بطولة [في لُعْبةٍ إلخ] (2) نُصْرة؛ دفاعٌ عن (3) مباراة البطولة: مباراة تُجرى لإحراز لقب البطولة.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«وَالْبَطَلُ الشُّجَاعُ. قَالَ أَصْحَابُ هَذَا الْقِيَاسِ سُمِّيَ بِذَلِكَ لِأَنَّهُ يُعَرِّضُ نَفْسَهُ لِلْمَتَالِفِ. وَهُوَ صَحِيحٌ، يُقَالُ: بَطَلٌ بَيِّنُ الْبُطُولَةِ وَالْبَطَالَةِ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يربط ابن فارس البُطولة بالشجاعة وتعريض النفس للمتالف، وهو المعنى الأصلي الذي توسّع ليشمل التفوّق في المنافسة"
    - lemma: "صَدَارَة"
      confirm:
        - text: "«(الصدارة) التَّقَدُّم يُقَال فلَان لَهُ الصدارة فِي الْقَوْم»"
          source: "المعجم الوسيط (حوراماني)"
        - text: "«التَّقَدُّمُ. يقالُ: فلانٌ لهُ الصُّدارةُ فى القوم»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«(الصدارة) التَّقَدُّم ... و(عِنْد النُّحَاة) اخْتِصَاص الْكَلِمَة بوقوعها أول الْكَلَام»"
          source: "المعجم الوسيط"
          conflict: "الصدارة تدلّ على التقدّم العام لا على مكانة البطل في مسابقة تحديداً، وهي أعمّ من المطلوب"
    - lemma: "غَلَبَة"
      contradicts:
        - text: "«الغَلَبةُ: حَال تبدو للْعَبد لَا يُمكن مَعهَا مُلَاحظَة السَّبَب، وَلَا مُرَاعَاة الْأَدَب»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "الغلبة في الاصطلاح الصوفي حال وجدانية لا علاقة لها بالبطولة"
        - text: "«إستيلاؤه واحتواؤه وغلبته واشتماله واعتلاؤه»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
          conflict: "الغلبة تدلّ على فعل القهر والاستيلاء وهو حدث مؤقت، لا على مكانة دائمة كالبطولة"
    - lemma: "تَفَوُّقِيَّة"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "بُطُولَة"
      decision: confirmed
      decision_reason: "لمّة صحيحة لغوياً ومعجمياً. بُطُولَة مصدر بَطُلَ على وزن فُعُولَة، موثّقة في المعجم الوسيط والمعجم الكبير ومقاييس اللغة. المعنى المعاصر (مكانة البطل في مسابقة) توسّعٌ طبيعي عن المعنى الأصلي (الشجاعة). اللمّة الموجودة بدون تشكيل وتحتاج تحديثاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح الرئيسي والأكثر تداولاً للدلالة على مكانة البطل في مسابقة أو لعبة رياضية"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُطُولَة"
    - lemma: "صَدَارَة"
      source: stage1
      decision: removed
      decision_reason: "الصدارة تدلّ على التقدّم والمرتبة الأولى بعمومها، وهي أعمّ من مفهوم البطولة الذي يخصّ التفوّق في مسابقة. العلاقة هنا اشتمال لا ترادف."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
    - lemma: "غَلَبَة"
      source: stage1
      decision: removed
      decision_reason: "الغلبة تدلّ على فعل القهر والاستيلاء المؤقت، وهي حدث لا مكانة. البطولة حالة مستمرة (status) بينما الغلبة واقعة عابرة."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
    - lemma: "تَفَوُّقِيَّة"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استخدام هذا اللفظ. مصدر صناعي مولَّد لم يُثبَت في أيّ معجم، ولا يضيف دلالة لا تغطيها بُطُولَة."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

