# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ───────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان 'إيستمان' و'جورج إيستمان' خاليتان من التشكيل الكامل — يجب تشكيلهما"
      - "هذا المُدخَل اسمُ عَلَم (proper noun) لشخص بعينه، وليس مصطلحاً اسمياً عاماً — ينبغي أن يُحدَّد pos في مدخلَي القاموس بـ proper_noun وليس n"
      - "التعريف العربي الحالي ترجمة شبه حرفية للتعريف الإنجليزي، دون مراعاة أسلوب التأليف المعجمي العربي"
      - "التعريف يفتقر إلى ذكر اسم شركة كوداك (Kodak) التي أسسها إيستمان وكانت من أبرز منجزاته"
    observations: >
      هذه المجموعة الترادفية تمثّل اسم علم (اسم شخص) لمخترع أمريكي شهير (1854-1932).
      في هذا النوع من المجموعات لا يُولَّد اصطلاح عربي جديد، بل تُحدَّد أشكال الكتابة العربية المعيارية للاسم الأجنبي.
      التحدي الرئيسي هنا هو صحة التعريب والتشكيل، وملاءمة صيغ الاسم لكلٍّ من الاستخدام المختصَر (اللقب وحده)
      والاستخدام الموسوعي الرسمي (الاسم الكامل). التعريف المقدَّم يصلح للتحديث بأسلوب أكثر عروبةً.

  blind_candidates:
    - lemma: "إِيسْتْمَان"
      generation_method: taarib
      justification: >
        تعريب مباشر للقب "Eastman" وفق قواعد التعريب الصوتي العربي: alef مع مدة للمقطع الأول،
        سكون على الحروف الصامتة المتتابعة. هذه هي الصيغة المتداولة في المصادر العربية للإشارة إلى صاحب
        شركة كوداك وإلى الجوائز التي تحمل اسمه. صالحة للاستخدام المختصر (كالإشارة باللقب وحده).

    - lemma: "جُورْج إِيسْتْمَان"
      generation_method: tarkib
      justification: >
        مركب إضافي (اسم + لقب) يُشكّل الصيغة الكاملة المعيارية لاسم الشخص في المصادر العربية
        الموسوعية والعلمية. اختبار السكّ مجتاز: الاسم الكامل هو وحدة معجمية ثابتة لا تقبل الإبدال.
        الاسم الأول "جُورْج" من اليونانية "جيورجوس" (حارث الأرض) موثَّق في موسوعة السلطان قابوس.

    - lemma: "إِيسْتْمَان الأَمْرِيكِيّ"
      generation_method: tarkib
      justification: >
        مركب وصفي (لقب + نسبة) للتمييز من مشاركين آخرين يحملون اللقب ذاته في سياقات
        بحثية أو تاريخية. غير أن هذه الصيغة ليست مُثبَّتة معجمياً كوحدة ثابتة بل تعبير وصفي
        حرّ، مما قد يخلّ باختبار التثبيت المعجمي.

    - lemma: "جُورْج إِيسْتْمَان الْمُخْتَرِع"
      generation_method: tarkib
      justification: >
        صيغة موسوعية موسَّعة تستخدمها بعض المعاجم الموسوعية عند أول ذكر للشخصية. غير أنها
        لا تصلح لمّةً معجمية مستقلة لأنها تصف ولا تُسمّي — فوصف "المخترع" قابل للإبدال
        بـ"المصوِّر" أو "الرائد" وتظل صالحة كوصف، مما يُخفق في اختبار السكّ.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────────────────
stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ──────────────────────────────────────
    - lemma: "إيستمان"
      evidence_status: "no_material_found"
      # لا يوجد في قاعدة البيانات المعجمية أي مدخل يطابق "ايستمان" أو "الايستمان".
      # هذا متوقَّع: الاسم اسم علم أجنبي حديث النشأة (1854-1932) ولا يرد في المعاجم العربية الكلاسيكية.
      # بحث ARABTERM بالإنجليزية (Eastman) أيضاً لم يُسفر عن نتيجة مباشرة للشخص.

    - lemma: "جورج إيستمان"
      expands:
        - text: "«جورج — عن اليونانية جيورجوس بمعنى حارث الأرض. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
          addition: >
            يُثبِّت الدليلُ أن "جورج" اسم دخيل معرَّب عن اليونانية، مُدرَج في مراجع أسماء العرب،
            وأن المعاجم العربية تعترف به كاسم شخص مستخدَم في السياق العربي.
            أما "إيستمان" فلا يرد في أي مُدخَل معجمي مستقل.

    # ── مرشحات المرحلة ١ ─────────────────────────────────────
    - lemma: "إِيسْتْمَان"
      evidence_status: "no_material_found"
      # مطابق للمّة الموجودة — راجع التقييم أعلاه.

    - lemma: "جُورْج إِيسْتْمَان"
      expands:
        - text: "«جورج — عن اليونانية جيورجوس بمعنى حارث الأرض. يستخدم للذكور.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (1985)"
          addition: "يؤكد أن الشق الأول من الاسم الكامل موثَّق في المراجع العربية لأسماء الأعلام."

    - lemma: "إِيسْتْمَان الأَمْرِيكِيّ"
      evidence_status: "no_material_found"

    - lemma: "جُورْج إِيسْتْمَان الْمُخْتَرِع"
      evidence_status: "no_material_found"

  # ── أدلة مصطلحات ذات صلة من ARABTERM (للسياق) ──────────────
  contextual_arabterm:
    - headword: "الكاميرا الصُّندوقية"
      translation_en: "box camera"
      source: "المورد الحديث (2008)"
      note: "يُثبّت المصطلح العربي لأحد اختراعات إيستمان"
    - headword: "فيلم ملفوف"
      translation_en: "roll film"
      source: "المورد الحديث (2008)"
      note: "يُثبّت المصطلح العربي لمنتج قدَّمته شركة إيستمان"
    - headword: "رق التصوير"
      translation_en: "photographic film"
      source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      note: "مصطلح بديل للفيلم الفوتوغرافي"
    - headword: "الكوداك"
      translation_en: "Kodak"
      definition: "«الكوداك: آلة تصوير فوتوغرافي يدوية.»"
      source: "المورد الحديث (2008)"
      note: "يُثبّت أن الماركة التجارية لإيستمان معرَّبة ومدرجة في المعاجم العربية"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──────────────────────────────────────
    - lemma: "إيستمان"
      decision: confirmed
      decision_reason: >
        "إيستمان" هو اللقب العربي المعيار لـ Eastman، وهو الشكل المتداول في الكتابة العربية المتخصصة
        والموسوعية. لا مشكلة في الصحة اللغوية، لكن اللمّة تفتقر إلى التشكيل الكامل.
        قرار الإبقاء مع تصحيح التشكيل وتعديل POS المدخل إلى proper_noun.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      borrowing_check:
        type: taarib
        verdict: "معرَّبة مقبولة — الصيغة الصوتية تلائم نظام الصوتيات العربية"
      morphological_fit: >
        الاسم الأجنبي يُعامَل معاملة الاسم المنصرف في كثير من الاستخدامات العربية؛ لا ينطبق
        عليه وزن صرفي عربي، وهذا أمر طبيعي في تعريب أسماء الأعلام.
      nuance_differentiation: >
        "إيستمان" هو الاسم اللقبي (الكنية العائلية) وحده، ويُستخدم في السياقات التي سبق فيها
        تعريف الشخصية أو في الإشارات المختصرة — بخلاف "جورج إيستمان" الذي يُستخدم
        في الذكر الأول والسياقات الرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِيسْتْمَان"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── اللمّة الموجودة ٢ ──────────────────────────────────────
    - lemma: "جورج إيستمان"
      decision: confirmed
      decision_reason: >
        "جورج إيستمان" هو الاسم الكامل للشخصية وهو الصيغة الرسمية الموسوعية المعتمدة
        في المراجع العربية. اختبار السكّ مجتاز: المركّب وحدة معجمية ثابتة تُعيّن شخصاً بعينه.
        تصحيح التشكيل والـ POS ضروريان.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      borrowing_check:
        type: taarib
        verdict: "كلا مكوّنَيه معرَّبان: 'جورج' عن اليونانية موثَّق في موسوعة الأسماء العربية؛ 'إيستمان' تعريب مباشر لـ Eastman"
      nuance_differentiation: >
        "جورج إيستمان" هو الاسم الكامل الفارق، يُستخدم في أول ذكر للشخصية وفي السياقات
        الأكاديمية والموسوعية التي تستوجب التعريف الصريح — بخلاف "إيستمان" الذي يُستخدم
        في السياقات التي اكتُفي فيها بذكر اللقب وحده.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُورْج إِيسْتْمَان"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشحات المرحلة ١ ─────────────────────────────────────
    - lemma: "إِيسْتْمَان"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة "إيستمان" بعد تشكيلها. يُكتفى بتصحيح اللمّة الموجودة
        ولا حاجة لإنشاء مدخل جديد.

    - lemma: "جُورْج إِيسْتْمَان"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة "جورج إيستمان" بعد تشكيلها. يُكتفى بتصحيح اللمّة
        الموجودة ولا حاجة لإنشاء مدخل جديد.

    - lemma: "إِيسْتْمَان الأَمْرِيكِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح تعبير وصفي حرّ وليس وحدة معجمية ثابتة. اختبار التثبيت المعجمي فاشل:
        يمكن إبدال "الأمريكي" بـ"الشهير" أو "المصوِّر" ويبقى التعبير صالحاً كوصف. لا تُثبَّت
        أسماء الأعلام بالوصف الجغرافي كلمّات في المعاجم.

    - lemma: "جُورْج إِيسْتْمَان الْمُخْتَرِع"
      source: stage1
      decision: removed
      decision_reason: >
        اختبار السكّ فاشل: "المخترع" وصف قابل للإبدال بـ"الرائد" أو "العالم" دون أن يُفقد
        التعبير دلالته الوصفية، مما يعني أنه ليس مصطلحاً مسكوكاً. لا يصلح لمّةً معجمية.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────────────────────
stage4_content:
  definition:
    current: "مخترع أمريكي لعملية الألواح الجافة لتظهير الفيلم الفوتوغرافي والفيلم المرن (قدمت شركته الفيلم الملفوف) وكاميرا الصندوق وعملية للتصوير الملون (1854-1932)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي ترجمة شبه حرفية من الإنجليزية مع اضطراب في البنية الجملية ("قدمت شركته
        الفيلم الملفوف" معترضة غير سلسة). يفتقر إلى أسلوب المعجم الوسيط الموسوعي الذي يبدأ
        بتحديد الجنس (شخص / مخترع) ثم يسرد الخصائص. كما أن المدة الزمنية (1854-1932) مبعثرة
        في نهاية التعريف دون ترابط.
    authored:
      - type: encyclopedic
        text: >
          مُخْتَرِعٌ أَمْرِيكِيٌّ (1854-1932)، رائدٌ في صناعة التصوير الفوتوغرافي؛ طوَّر طريقة الألواح
          الجافة لتظهير الأفلام، وأسهمت شركته في تقديم الفيلم اللفافي المرن وتسويق كاميرا
          الصندوق، وابتكر كذلك أسلوباً للتصوير بالألوان.
