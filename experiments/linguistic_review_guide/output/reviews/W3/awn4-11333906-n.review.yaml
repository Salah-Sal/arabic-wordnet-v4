  collateral_findings:
    - note: "كلمة 'رَوْث' العربية (مادة ر و ث) حاضرة في ٢٠+ مدخلاً في قاعدة البيانات تشمل: المعجم الوسيط، لسان العرب، تاج العروس، مقاييس اللغة. دلالتها: رجيع ذي الحافر / طرف الأرنبة. مقاييس اللغة: «الرَّاءُ وَالْوَاوُ وَالثَّاءُ كَلِمَتَانِ مُتَبَايِنَتَانِ جِدًّا. فَالرَّوْثَةُ: طَرَفُ الْأَرْنَبَةِ. وَالْوَاحِدَةُ مِنْ رَوْثِ الدَّوَابِّ.» — هذه المادة مستقلة كلياً عن الاسم الأجنبي Ruth."
    - note: "الجسر الإنجليزي أعطى مدخل ARABTERM: مُصَمِّم الرَّقَصات (entry_id: 677907, المورد الحديث 2008) للترجمة الإنجليزية choreographer. هذا مصطلح عام لا علاقة له باسم العلَم."
    - note: "مادة (س ن ت) في مقاييس اللغة: «لَيْسَ أَصْلًا يُتَفَرَّعُ مِنْهُ» — تؤكد أن 'سانت' ليس كلمة عربية أصيلة."


