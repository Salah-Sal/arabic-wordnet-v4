# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان مكتوبتان بلا تشكيل، مما يُحدث التباساً صريحاً بين 'رُوث' (اسم علَم أجنبي) و'رَوْثٌ' (فضلات ذوات الحافر)، وهي كلمة عربية ذات استعمال مرتفع في النصوص الكلاسيكية والفقهية"
      - "لمّة 'سانت دينيس' منفردةً متشابكة الدلالة مع أكثر من حامل: مدينة سان-دوني الفرنسية، والقديس دنيس الشهيد (القرن الثالث الميلادي)، وأشخاص آخرون يحملون هذا اللقب"
      - "المجموعة تمثل اسم علَم أجنبي مُعرَّباً لشخصية تاريخية بعينها؛ لا تغطي المعاجم العربية الكلاسيكية هذا النوع من المداخل، مما يعني غياب الأدلة المعجمية التقليدية"
    observations: >
      المجموعة مخصصة للراقصة الأمريكية رووث سانت دينيس (1877–1968)، رائدة الرقص الحديث في الولايات المتحدة،
      المعروفة بدمجها الروحانيات الشرقية في الفن الحركي، وبشراكتها الفنية مع المصمّم تيد شون.
      اللمّتان الحاليتان هما تعريبان حرفيان للاسم الإنجليزي، وكلاهما تعبير مركب إضافي (اسم + لقب) بلا جذر عربي أصيل،
      إذ إن "Ruth" اسم عبري الأصل، و"Saint" كلمة فرنسية/لاتينية، و"Denis" اسم إغريقي الأصل.
      المشكلة اللغوية الجوهرية: التصادم الصوتي بين "رُوث" (الاسم) و"رَوْث" (فضلات الحافر)،
      وقد تأكد من استعلامات قاعدة البيانات أن مادة (ر و ث) حاضرة بكثافة في المعاجم الكلاسيكية والفقهية.

  blind_candidates:
    - lemma: "رُوث سَانْت دِينِيس"
      generation_method: taarib
      justification: "تعريب حرفي معياري للاسم الإنجليزي Ruth Saint Denis مع تشكيل كامل يرفع اللبس بين 'رُوث' (اسم) و'رَوْث' (فضلات)"
    - lemma: "رُوت سَانْت دِينِيس"
      generation_method: taarib
      justification: "صيغة بديلة تُقرَّب فيها Ruth بالتاء المثناة بدلاً من الثاء، وهو نطق شائع في بعض الأقطار العربية (المغرب، تونس، مصر)"
    - lemma: "رُوث دِينِيس"
      generation_method: taarib
      justification: "صيغة مختصرة تحذف حلقة 'سانت' وتبقي الاسمين الأول والأخير، تناظر الأسلوب المعتمد في معاجم الأعلام العلمية عند الاختصار"
    - lemma: "سَانْت دِينِيس"
      generation_method: taarib
      justification: "تعريب للقب الفني 'Saint Denis' دون الاسم الأول رووث، مطابق للمدخل الإنجليزي St. Denis الذي يُستخدم في الكتابات الأكاديمية لتاريخ الرقص"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# استعلامات منفَّذة:
#  [١] بحث دفعي بالعناوين: روث, سانت, دينيس, روث سانت دينيس, سانت دينيس → أعطى نتائج للكلمة العربية روث فقط
#  [٢] جسر إنجليزي: Ruth St. Denis, Saint Denis, choreographer, dancer → وجد: مصمم الرقصات, راقص (عامّان)
#  [٣] FTS عربي: راقصة, كوريغراف, تصميم رقصات → مصطلحات عامة فقط، لا صلة بالشخصية
#  [٤] مقاييس اللغة لمواد: روث, سنت, دنس → نتائج للكلمات العربية لا الأعلام الأجنبية
