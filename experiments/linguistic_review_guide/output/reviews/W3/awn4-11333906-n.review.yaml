        (١) لا يُشير إلى ريادتها في تأسيس الرقص الحديث الأمريكي وهي مكانتها التاريخية الجوهرية،
        (٢) تركيب الجملة يُقدّم المواطَنة ('أمريكية') قبل المهنة مما يُخلّ بأولوية الفصل النوعي،
        (٣) التعاون مع تيد شون مذكور كمعلومة منفردة دون إضافة سياق فني يوضّح طبيعته.
