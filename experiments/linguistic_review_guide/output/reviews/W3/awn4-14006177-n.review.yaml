# مراجعة المجموعة الترادفية — awn4-14006177-n
# divide: a serious disagreement between two groups of people
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «انقسام» تميل دلالياً إلى الانشطار المادي أو البيولوجي أكثر من الخلاف الاجتماعي الخطير"
      - "المجموعة تفتقر إلى التنوّع المعجمي — لمّة واحدة فقط لمفهوم غني بالمترادفات في العربية"
      - "اللمّة الموجودة بدون تشكيل"
    observations: "المفهوم المقصود هو الخلاف الخطير بين فريقين يُنتج توتّراً أو عداءً، وهو أخصّ من مطلق الخلاف (المفوق). العربية غنيّة بالألفاظ الدالّة على الشقّ والفرقة بين الناس، وكثير منها يحمل بُعداً مجازياً (صَدْع، شَرْخ). ينبغي إثراء المجموعة بلمّات تراثية تحمل دلالة الانقسام الاجتماعي تحديداً."
  blind_candidates:
    - lemma: "صَدْع"
      generation_method: majaz
      justification: "الصَّدْع في الأصل الشَّقّ في الشيء الصلب، ثم استُعمل مجازاً للتفرّق بين القوم في الرأي والهوى. قال الزمخشري: «رأيت منهم صَدَعات: تفرّقاً في الرأي والهوى». الوزن فَعْل مناسب للمصدر الدالّ على الحدث."
    - lemma: "فُرْقَة"
      generation_method: ishtiqaq
      justification: "من الجذر ف-ر-ق على وزن فُعْلَة، بمعنى الافتراق والتباعد بين الناس. جاء في الوسيط: «الفُرْقَة: الافتراق». المقاييس: «أصل يدلّ على تمييز وتزييل بين شيئين»."
    - lemma: "شَرْخ"
      generation_method: majaz
      justification: "الشَّرْخ في الأصل الانشقاق في العظم أو الحائط، ويمكن توظيفه مجازاً للانقسام بين جماعتين. غير أنه لم يُستعمل تراثياً في السياق الاجتماعي."
    - lemma: "هُوَّة"
      generation_method: majaz
      justification: "الهُوَّة في الأصل الحُفرة البعيدة القعر، ثم استُعملت مجازاً للفجوة بين فريقين. يشيع في الاستعمال المعاصر: «الهُوَّة بين الشمال والجنوب». غير أنها أقرب إلى معنى الفجوة منها إلى الخلاف."

stage2_evidence:
  per_lemma:
    - lemma: "اِنْقِسَام"
      confirm:
        - text: "«(3) خِلاف؛ نِزاع»"
          source: "المورد الحديث (2008) — مدخل division"
        - text: "«خِلاف؛ شِقاق؛ انقسام؛ لاوَحْدة»"
          source: "المورد الحديث (2008) — مدخل disunity"
        - text: "«(1) «أ» انقسام؛ انفصال. «ب» شقاق؛ اختلاف»"
          source: "المورد الحديث (2008) — مدخل schism"
      expands:
        - text: "«(1) «أ» تقسيم. «ب» انقسام. «ج» توزيع ... (11) الانقسام: انشطار الخليّة إلى خليّتين (أح)»"
          source: "المورد الحديث (2008) — مدخل division"
          addition: "اللفظ يتوزّع بين معنى الخلاف ومعنى الانشطار البيولوجي والرياضي"
    - lemma: "صَدْع"
      confirm:
        - text: "«يقال رأيت بين القوم صَدَعاتٍ، أي تفرّقاً في الرأي والهوى»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
        - text: "«رأيت منهم صدعات: تفرقا في الرأي والهوى، وأصلحوا ما فيكم من الصدعات، وإنهم على ما فيهم من الصدعات لألباء كرام»"
          source: "أساس البلاغة للزمخشري"
        - text: "«يُقَالُ تَصَدَّعَ الْقَوْمُ، إِذَا تَفَرَّقُوا. وَالصِّدْعَةُ مِنَ الْإِبِلِ: قِطْعَةٌ كَالسِّتِّينَ وَنَحْوِهَا، كَأَنَّهَا انْصَدَعَتْ عَنِ الْعَسْكَرِ الْعَظِيمِ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«الصَّادُ وَالدَّالُ وَالْعَيْنُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى انْفِرَاجٍ فِي الشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل الاشتقاقي يدلّ على الانفراج والتباعد، ممّا يؤيّد الامتداد المجازي إلى التفرّق الاجتماعي"
        - text: "«صدع البين شملهم. وصدع الظعائن يوم بن فؤاده. وتصدع الحي. وتصدعوا عني»"
          source: "أساس البلاغة للزمخشري"
          addition: "الزمخشري يُصنّف هذه الاستعمالات تحت باب المجاز صراحةً"
    - lemma: "فُرْقَة"
      confirm:
        - text: "«(الْفرْقَة) الِافْتِرَاق»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      contradicts:
        - text: "«(الْفرْقَة) الطَّائِفَة من النَّاس يُقَال فرقة التَّمْثِيل وَفرْقَة الألعاب وَفرْقَة المطافئ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "المعنى السائد للفِرقة (بالكسر) هو الطائفة من الناس لا الخلاف، والفُرقة (بالضم) تعني مطلق الافتراق لا الخلاف الخطير تحديداً"
    - lemma: "شَرْخ"
      contradicts:
        - text: "«(الشرخ) الأَصْل والعرق وشَرْخ الشَّبَاب أَوله ونضارته وانشقاق فِي الْعظم أَو الْحَائِط وَنَحْوهمَا لَا يبلغ الْفَصْل (محدثة)»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الشَّرخ في المعاجم مقصور على المعنى المادّي (شقّ في عظم أو حائط)، ولم يُستعمل مجازياً للخلاف الاجتماعي في أيّ مصدر تراثي أو معاصر"
    - lemma: "هُوَّة"
      contradicts:
        - text: "«(الهوة) الحفرة الْبَعِيدَة القعر والوهدة الغامضة من الأَرْض لَا يفْطن إِلَيْهَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "الهُوَّة في المعاجم حُفرة مادّية، واستعمالها المجازي يدلّ على الفجوة أو البَون لا على الخلاف والعداوة تحديداً"

stage3_analysis:
  per_lemma:
    - lemma: "اِنْقِسَام"
      decision: confirmed
      decision_reason: "اللفظ مصدر «انقسم» من الجذر ق-س-م، ويدلّ على تجزّؤ الجماعة إلى فريقين متخاصمين. شائع في الاستعمال السياسي والاجتماعي المعاصر (الانقسام الفلسطيني، الانقسام الطائفي). وثّقه المورد بمعنى «خلاف، نزاع» صراحةً. يحتاج تشكيلاً كاملاً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يشير إلى حالة التجزّؤ الناتجة عن الخلاف أكثر من الخلاف ذاته، مع تركيز على انشطار الكيان الواحد إلى طرفين"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِنْقِسَام"

    - lemma: "صَدْع"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ تراثي فصيح موثّق في الصحاح وأساس البلاغة ومقاييس اللغة بمعنى التفرّق في الرأي والهوى بين القوم. الاستعمال المجازي مُثبت عند الزمخشري صراحةً، والأصل الاشتقاقي (الانفراج) يُؤيّد الدلالة. يُثري المجموعة بلفظ تراثي يحمل صورة بلاغية قويّة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يحمل صورة مجازية من عالم الأشياء الصلبة (الشقّ والكسر)، ويُوحي بأنّ الخلاف أحدث شرخاً في كيان متماسك كان واحداً"
      actions:
        - command: create_entry
          params: {lemma: "صَدْع", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14006177-n"}

    - lemma: "فُرْقَة"
      source: stage1
      decision: removed
      decision_reason: "الفُرْقَة (بالضمّ) تعني مطلق الافتراق والتباعد، وهي أعمّ من المفهوم المقصود (خلاف خطير يُنتج عداءً). أمّا الفِرْقَة (بالكسر) فتعني الطائفة من الناس وهو معنى مختلف تماماً. اللبس بين الضبطين يُضعف المصطلح."

    - lemma: "شَرْخ"
      source: stage1
      decision: removed
      decision_reason: "لم يُوثَّق في أيّ معجم تراثي أو معاصر بمعنى الخلاف الاجتماعي. الوسيط يحصره في الانشقاق المادّي (عظم، حائط) ويُعلّمه بـ(محدثة). لا أساس لغوي لتوسيعه مجازياً."

    - lemma: "هُوَّة"
      source: stage1
      decision: removed
      decision_reason: "المعنى المعجمي الأصلي والمجازي يدلّ على الفجوة والبَون بين طرفين (gap) لا على الخلاف والعداوة (disagreement). المفهوم المقصود في المجموعة أقرب إلى النزاع منه إلى الفجوة."

