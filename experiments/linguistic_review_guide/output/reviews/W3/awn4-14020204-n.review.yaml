# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14020204-n (oppression)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «ظلم» أعمّ بكثير من المفهوم المقصود (oppression)؛ فالظلم يشمل كلّ وضع للشيء في غير موضعه، بينما المجموعة تخصّ حالة القهر المنظّم بالقوة أو السلطة"
      - "اللمّتان الموجودتان بدون تشكيل كامل"
    observations: "المفهوم المقصود هو حالة الخضوع لقهر منظّم تمارسه سلطة ظالمة أو قوّة غاشمة، وهو مفهوم سياسي واجتماعي راسخ في العربية المعاصرة. لفظة «اضطهاد» مصدر افتعالي من الجذر (ض ه د) يدلّ على القهر والاستضعاف، وهو أدقّ تعبير عن المفهوم. أما «ظلم» فمصدر عامّ يدلّ على الجور ومجاوزة الحدّ وليس خاصًّا بالقهر المنظّم."
  blind_candidates:
    - lemma: "اسْتِبْدَاد"
      generation_method: ishtiqaq
      justification: "مصدر الفعل استبدّ على وزن استفعال من الجذر (ب د د)، يدلّ على الانفراد بالسلطة والتحكّم القهري، وهو قريب من معنى الاضطهاد السياسي"
    - lemma: "طُغْيَان"
      generation_method: ishtiqaq
      justification: "مصدر طغى على وزن فُعْلان من الجذر (ط غ ي)، يدلّ على مجاوزة الحدّ في الظلم والعصيان، ويُستعمل في سياق القهر السياسي والاجتماعي"
    - lemma: "جَوْر"
      generation_method: ishtiqaq
      justification: "مصدر جارَ على وزن فَعْل من الجذر (ج و ر)، يدلّ على نقيض العدل والميل عن القصد في الحكم، ورد في المعاجم الكلاسيكية مرادفًا للظلم"
    - lemma: "تَعَسُّف"
      generation_method: ishtiqaq
      justification: "مصدر تعسَّف على وزن تَفَعُّل من الجذر (ع س ف)، يدلّ على المعاملة الجائرة وتجاوز الحقّ بالقوة، وهو وثيق الصلة بمفهوم القهر السلطوي"


stage2_evidence:
  per_lemma:
    - lemma: "اِضْطِهَاد"
      confirm:
        - text: "«(في السياسة): المعاملةُ التَّعَسُّفِيَّةُ الجائرةُ من السُّلْطةِ تجاهَ فِئَةٍ من المجتمع؛ لأسبابٍ عِرْقِيَّةٍ أو مَذْهبيَّةٍ, أو لخلافاتٍ سياسيَّةٍ, ونَحْوِها»"
          source: "المعجم الكبير"
        - text: "«(ضَهَدَ) الضَّادُ وَالْهَاءُ وَالدَّالُ كَلِمَةٌ وَاحِدَةٌ. ضَهَدْتُ فُلَانًا: قَهَرْتُهُ، فَهُوَ مُضْطَهَدٌ وَمَضْهُودٌ.»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«translation_en: oppression — domain: Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
          addition: "يؤكد استعمال المصطلح في الحقل الاجتماعي مقابلًا لـ oppression"
        - text: "«translation_en: oppression — domain: Philosophy and Psychology»"
          source: "مسرد الفلسفة وعلم النفس (ARABTERM)"
          addition: "يؤكد استعمال المصطلح في الحقل الفلسفي والنفسي"
        - text: "«translation_en: persecution — domain: Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ARABTERM)"
          addition: "يُستعمل أيضًا مقابلًا لـ persecution، مما يدلّ على اتساع حقله الدلالي ليشمل الاضطهاد الممنهج"

    - lemma: "ظُلْم"
      confirm:
        - text: "«الجور ومجاوزة الحد»"
          source: "المعجم الكبير"
      expands:
        - text: "«خلاف الضياء والنور، ووضع الشيء في غير موضعه تعديا، والنقص واهتضام الحق، والجور ومجاوزة الحد»"
          source: "المعجم الكبير"
          addition: "للظلم معانٍ متعددة تتجاوز مفهوم القهر السلطوي"
        - text: "«الظُّلْمُ: وضْعُ الشيءِ في غير مَوْضِعِه، والمَصدَرُ الحقيقِيٌّ: الظَّلْمُ، بالفتح»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "المعنى الأصلي عامّ: وضع الشيء في غير موضعه"
        - text: "«الظَّاءُ وَاللَّامُ وَالْمِيمُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا خِلَافُ الضِّيَاءِ وَالنُّورِ، وَالْآخَرُ وَضْعُ الشَّيْءِ غَيْرَ مَوْضِعِهِ تَعَدِّيًا»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدلّ على أصلين: الظلمة، ووضع الشيء في غير موضعه تعديًا"
        - text: "«الظلم: التصرف في ملك الغير، ومجاوزة الحد. وقيل: وضع الشيء بغير محله بنقص أو زيادة أو عدول عن زمنه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "تعريف اصطلاحي يعمّ كل تصرف في حقّ الغير"

    - lemma: "اسْتِبْدَاد"
      expands:
        - text: "«(1) الحكم الاستبداديّ؛ حكم الطُّغيان (2) حكومة استبدادية (3) استبداد؛ طغيان (4) عملٌ استبداديّ — translation_en: tyranny»"
          source: "المورد الحديث (2008)"
          addition: "المصطلح يُقابل tyranny لا oppression، وهو أخصّ بنظام الحكم المطلق"

    - lemma: "طُغْيَان"
      confirm:
        - text: "«تجاوزُ الحدِّ في الظلم أو فى الماء»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«الطغيان: تجاوز الحد في العصيان»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الطغيان يصف فعل المتجاوز (الطاغي) لا حالة المقهور، بينما المجموعة تصف حالة الضحية"
      expands:
        - text: "«الطَّاءُ وَالْغَيْنُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلٌ صَحِيحٌ مُنْقَاسٌ، وَهُوَ مُجَاوَزَةُ الْحَدِّ فِي الْعِصْيَانِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي في مجاوزة الحدّ، وهو من جانب الفاعل لا من جانب المفعول به"
        - text: "«الظُّلْمُ والتَّجَبُّر»"
          source: "المعجم الكبير"
          addition: "يرتبط بالتجبّر وهو وصف للفاعل المتسلّط"

    - lemma: "جَوْر"
      confirm:
        - text: "«نَقِيضُ العَدْل، ضدُّ القَصْدِ أو المَيْل عنه»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«الجَوْرُ: الغَلَبَةُ... وفَخِذٌ قَهِرَةٌ: قليلَةُ اللَّحْم»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "الجور يدلّ على الميل عن العدل في الحكم، وهو وصف لفعل الحاكم لا لحالة المحكوم"
      expands:
        - text: "«(جَوَرَ) أَصْلٌ وَاحِدٌ، وَهُوَ الْمَيْلُ عَنِ الطَّرِيقِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل اللغوي هو الانحراف والميل، وهو أعمّ من القهر المنظّم"

    - lemma: "تَعَسُّف"
      confirm:
        - text: "«فى الكلام: تكلَّف. الطَّريق, وعن الطَّريق: عسف. فلاناً: ظلمَهُ»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«التعسف: حمل الكلام على معنى لا تكون دلالته عليه ظاهرة»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "المعنى الاصطلاحي الرئيس في التراث هو التكلّف في الكلام لا القهر السياسي"


stage3_analysis:
  per_lemma:
    - lemma: "اِضْطِهَاد"
      decision: confirmed
      decision_reason: "مصطلح دقيق يدلّ على القهر المنظّم من السلطة تجاه فئة من المجتمع، وهو المقابل المعتمد لـ oppression في المعاجم المتخصصة والاستعمال المعاصر. أكّدته أدلّة المعجم الكبير ومسارد ARABTERM ومقاييس اللغة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بالقهر المنظّم الممارَس من سلطة أو قوّة تجاه فئة مستضعفة، ويتضمّن بُعد الاستمرارية والمنهجية، بخلاف «ظلم» الذي يعمّ كلّ تعدٍّ على الحقّ"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِضْطِهَاد"

    - lemma: "ظُلْم"
      decision: confirmed
      decision_reason: "لفظ عربي أصيل يدلّ على مجاوزة الحدّ ووضع الشيء في غير موضعه تعديًا، وهو يشمل مفهوم القهر والاضطهاد وإن كان أعمّ منه. شيوعه في الاستعمال القرآني والأدبي والمعاصر يجعله مكمّلًا مقبولًا في المجموعة."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "لفظ عامّ يدلّ على كلّ تعدٍّ على الحقّ ومجاوزة للحدّ، سواء أكان فرديًّا أم جماعيًّا، ولا يشترط فيه ممارسة سلطة منظّمة كما في «اضطهاد»"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "ظُلْم"

    - lemma: "اسْتِبْدَاد"
      source: stage1
      decision: removed
      decision_reason: "الاستبداد يقابل tyranny/despotism ويخصّ نظام الحكم المطلق والانفراد بالسلطة، بينما المجموعة تصف حالة المقهور لا طبيعة نظام الحكم. الفرق بين الاستبداد (وصف نظام) والاضطهاد (وصف حالة) جوهري."
      evidence_assessment:
        case: contradicts_only

    - lemma: "طُغْيَان"
      source: stage1
      decision: removed
      decision_reason: "الطغيان يصف فعل المتجاوز للحدّ من منظور الفاعل (الطاغي)، بينما المجموعة تصف حالة المفعول به (المقهور). كما أنّ الطغيان يقابل في المعاجم المعاصرة tyranny لا oppression."
      evidence_assessment:
        case: mixed

    - lemma: "جَوْر"
      source: stage1
      decision: removed
      decision_reason: "الجور يدلّ على الميل عن العدل والانحراف في الحكم، وهو وصف لفعل الحاكم الجائر لا لحالة المحكوم المقهور. كما أنّ أصله اللغوي (الميل عن الطريق) يجعله أقرب لمفهوم الظلم العامّ منه لمفهوم القهر المنظّم."
      evidence_assessment:
        case: mixed

    - lemma: "تَعَسُّف"
      source: stage1
      decision: removed
      decision_reason: "التعسّف يدلّ على التكلّف والأخذ بغير طريق، ومعناه الاصطلاحي في التراث مرتبط بالكلام والبلاغة. استعماله بمعنى الظلم حديث ومحدود، ولا يختصّ بحالة القهر المنظّم."
      evidence_assessment:
        case: mixed


