# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# synset_id : awn4-10896413-n
# ili       : i94613
# pos       : n
# lemmas    : باترفيلد | ويليام باترفيلد
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الحاليتان (باترفيلد / ويليام باترفيلد) خاليتان من التشكيل الكامل."
      - "مداخل المجموعة مُسجَّلة بـ pos=n العام دون تمييزها بوصفها أعلاماً خاصة (proper_noun) على مستوى المداخل."
      - "المفهوم اسم علم خاص لشخصية تاريخية أجنبية، لا يحتمل اشتقاقاً أو مجازاً ولا يملك تقابلاً عربياً أصيلاً."
    observations: >
      هذه المجموعة الترادفية تمثل اسم علم خاص للمعماري الإنجليزي وليام باترفيلد (1814-1900م)،
      أحد رواد إحياء العمارة القوطية في إنجلترا الفيكتورية، المعروف بتصميمه عدداً كبيراً من
      الكنائس. لا يوجد في التراث المعجمي العربي ما يوازي هذا الاسم أو يُعبِّر عنه بغير
      التعريب الصوتي. وعليه، فإن جميع المرشحات المنطقية تقع تحت طريقة التعريب (taarib)
      حصراً. الاسم العائلي المختصر (باترفيلد) والاسم الكامل (ويليام باترفيلد) كلاهما
      ضروري: الأول للإحالات المختصرة، والثاني للتعريفات الرسمية.

  blind_candidates:
    - lemma: "بَاتِرفِيلد"
      generation_method: taarib
      justification: >
        تعريب صوتي مباشر للاسم العائلي Butterfield: الباء لـ B، والألف الممدودة لـ u الطويلة،
        والتاء لـ tt، والراء لـ r، والفاء لـ f، والياء-اللام-الدال لـ -ield.
        هذه الصيغة هي أكثر المعرَّبات شيوعاً في المراجع العربية المعاصرة.
    - lemma: "وِيليَام بَاتِرفِيلد"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل William Butterfield بمقطعَيه: وِيليَام لـ William
        (واو-ياء-لام-ياء-ألف-ميم) وبَاتِرفِيلد للاسم العائلي. الاسم الكامل ضروري
        في السياقات الموسوعية والتعريفية الأولى.
    - lemma: "بُتِرفِيلد"
      generation_method: taarib
      justification: >
        صيغة تعريبية بديلة تنقل صوت u في Butter كضمة قصيرة (بُ) بدلاً من الألف
        الممدودة، وهي تعكس نطقاً بريطانياً مختلفاً، وقد تردد في بعض النصوص العربية
        الأكاديمية.
    - lemma: "وِيلْيَم بُتِرفِيلد"
      generation_method: taarib
      justification: >
        صيغة تعريبية كاملة بديلة تجمع وِيلْيَم (تعريب مكثف لـ William) مع البديل
        بُتِرفِيلد. تُمثّل نطقاً مغايراً وربما أقرب لبعض اللهجات الإنجليزية الشمالية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#  Q1 — مطابقة دفعية لجميع اللمّات والمرشحين (headword_norm IN ...)
#  Q2 — جسر إنجليزي (translation_en:"Butterfield" OR "William Butterfield")
#  Q3 — FTS عربي بالكلمات المفتاحية: "معماري" OR "كنيسة" OR "كنائس"
# النتيجة: لا توجد مداخل في قاعدة البيانات تطابق أياً من الأعلام.
#          البحث العربي أعاد مصطلحات معمارية عامة لا صلة لها بالشخصية.
stage2_evidence:
  per_lemma:
    - lemma: "باترفيلد"
      evidence_status: "no_material_found"
    - lemma: "ويليام باترفيلد"
      evidence_status: "no_material_found"
    - lemma: "بَاتِرفِيلد"
      evidence_status: "no_material_found"
    - lemma: "وِيليَام بَاتِرفِيلد"
      evidence_status: "no_material_found"
    - lemma: "بُتِرفِيلد"
      evidence_status: "no_material_found"
    - lemma: "وِيلْيَم بُتِرفِيلد"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: باترفيلد ──
    - lemma: "باترفيلد"
      decision: confirmed
      decision_reason: >
        الاسم العائلي المعرَّب (اللقب) هو الشكل الأساسي المختصر المعتمد في الإحالة إلى
        هذا المعماري في المراجع العربية الأكاديمية والموسوعية. لا يوجد بديل اشتقاقي أو
        مجازي لاسم علم خاص، وعدم وجود أدلة معجمية أمر متوقع لاسم أعجمي غير شائع.
        اللمّة مقبولة غير أنها تحتاج تشكيلاً كاملاً وتحديث POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يمثّل الاسم العائلي (اللقب) وحده، ويُستخدم في الاستشهادات المختصرة والإحالات
        الأكاديمية المتكررة حين تكون الشخصية مُعرَّفة سابقاً.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَاتِرفِيلد"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── لمّة موجودة: ويليام باترفيلد ──
    - lemma: "ويليام باترفيلد"
      decision: confirmed
      decision_reason: >
        الاسم الكامل المعرَّب هو الشكل الرسمي المعتمد في المعاجم الموسوعية والتعريفات الأولى
        للشخصية. وجوده إلى جانب الاسم العائلي المختصر ضروري لتغطية السياقين: الرسمي والمختصر.
        يحتاج تشكيلاً كاملاً وتحديث POS.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يمثّل الاسم الكامل (الاسم الشخصي + اللقب)، ويُستخدم في التعريفات الأولى
        والسياقات الرسمية والموسوعية عند ذكر الشخصية لأول مرة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وِيليَام بَاتِرفِيلد"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشح المرحلة ١: بَاتِرفِيلد ──
    - lemma: "بَاتِرفِيلد"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة (باترفيلد) بعد إضافة التشكيل، وقد غُطِّيت
        الحاجة إليه بأمر update_lemma على اللمّة الأصلية. لا داعي لإنشاء مدخل جديد.

    # ── مرشح المرحلة ١: وِيليَام بَاتِرفِيلد ──
    - lemma: "وِيليَام بَاتِرفِيلد"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق للمّة الموجودة (ويليام باترفيلد) بعد إضافة التشكيل، وقد
        غُطِّيت الحاجة إليه بأمر update_lemma على اللمّة الأصلية.

    # ── مرشح المرحلة ١: بُتِرفِيلد ──
    - lemma: "بُتِرفِيلد"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تعريبية غير موثقة في المراجع العربية المعتمدة، والصيغة المعتمدة (بَاتِرفِيلد)
        أكثر شيوعاً وثباتاً في المعاجم الموسوعية العربية. لا تضيف قيمة دلالية مستقلة.

    # ── مرشح المرحلة ١: وِيلْيَم بُتِرفِيلد ──
    - lemma: "وِيلْيَم بُتِرفِيلد"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة تعريبية هامشية غير موثقة، وإضافة متغيرات صوتية متعددة لاسم علم واحد
        يُثقِّل المجموعة دون فائدة دلالية أو استخدامية تُذكر.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
