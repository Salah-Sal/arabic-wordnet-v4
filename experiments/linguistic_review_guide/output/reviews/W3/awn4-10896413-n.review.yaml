    current: "معماري إنجليزي صمم العديد من الكنائس (1814-1900)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مُقتبَس حرفياً من الإنجليزية (ترجمة مباشرة لـ "English architect who
        designed many churches") دون إثراء أسلوبي أو موسوعي. يفتقر إلى ذكر طراز المعماري
        المميز (إحياء القوطي) ومكانته التاريخية، وهو ما يُميِّزه عن سائر المعماريين الإنجليزيين.
