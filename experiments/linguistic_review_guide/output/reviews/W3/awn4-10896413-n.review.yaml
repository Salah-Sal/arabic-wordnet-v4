      - type: encyclopedic
        text: >
          مهندس معماري إنجليزي (1814-1900م)، من أبرز رواد حركة إحياء العمارة القوطية
          في إنجلترا الفيكتورية، اشتُهر بتصميم عدد كبير من الكنائس والمباني الدينية،
          وجمع في أعماله بين الطراز القوطي الوسيط والمواد الملوّنة والزخارف الهندسية.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10896413-n"
          definition_index: 0
          text: >
