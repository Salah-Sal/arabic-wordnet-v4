      decision_reason: "لم يُوثَّق بدلالة المقام الإمبراطوري في أي معجم عربي؛ الاستعمال المعاصر يقصره على الدلالة الطبية (العملية القيصرية). اشتقاقه من «قيصر» واضح لكنه غير مسكوك بالدلالة المطلوبة"
      evidence_assessment:
        case: contradicts_only

    - lemma: "المَقَامُ القَيْصَرِيّ"
      source: stage1
      decision: removed
      decision_reason: "تركيب وصفي حرّ غير مسكوك؛ لا يرد في أيّ معجم بوصفه وحدة معجمية ثابتة. يفشل في اختبار السكّ (يمكن إبداله بـ«المرتبة القيصرية» أو «المقام الملكي» دون خسارة المعنى الاصطلاحي)"
      evidence_assessment:
