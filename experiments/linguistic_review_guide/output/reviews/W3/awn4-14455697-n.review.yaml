      decision: confirmed
      decision_reason: "المورد الحديث يوثّق صراحةً دلالة «سلطة ملكيّة أو أمبراطورية» و«مقام رفيع» للأرجوان، وهي الدلالة الكنائية المطلوبة. رغم أنّ المعاجم الأحادية تقتصر على دلالة الشجر/الصبغ، فإنّ الاستعمال المجازي موثّق ومفهوم"
