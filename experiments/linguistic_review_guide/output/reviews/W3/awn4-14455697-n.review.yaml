    - lemma: "المَنْصِبُ الإِمْبِرَاطُورِيّ"
      decision: removed
      decision_reason: "عبارة وصفية حرّة لا مصطلح مسكوك؛ تفشل في اختبار السكّ إذ يمكن القول «المنصب القيصري» أو «المنصب الملوكي» بالمعنى نفسه. لم تُوجد في أي معجم بوصفها وحدة معجمية ثابتة"
      evidence_assessment:
