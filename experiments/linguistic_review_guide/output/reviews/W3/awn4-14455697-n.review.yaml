# مراجعة المجموعة الترادفية — awn4-14455697-n
# (in ancient Rome) position of imperial status
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «المنصب الإمبراطوري» عبارة وصفية حرة لا مصطلح مسكوك؛ تفشل في اختبار السكّ (يمكن إبدالها بـ«المنصب القيصري» أو «المنصب الملكي» دون تغيير الدلالة الاصطلاحية)"
      - "المفهوم مرتبط بثقافة رومانية بحتة (الأرجوان رمزاً للسلطة الإمبراطورية)؛ التعبير العربي عنه محدود بالمعاجم المزدوجة"
      - "لمّة «الأرجوان» بلا تشكيل كامل في بيانات المجموعة"
    observations: "المجموعة تمثّل مفهوماً كنائياً غربياً: «the purple» أي اللون الأرجواني رمزاً للسلطان الإمبراطوري في روما القديمة. هذا المجاز حيّ في الإنجليزية لكنّه ليس أصيلاً في العربية، إنّما نُقل عبر الترجمة. المعاجم العربية الأحادية تعرّف الأرجوان بالشجر والصبغ الأحمر فحسب، بينما يوثّق المورد الحديث (معجم مزدوج) الدلالة الكنائية: «سلطة ملكيّة أو أمبراطورية» و«مقام رفيع»."
  blind_candidates:
    - lemma: "الأُرْجُوَان"
      generation_method: majaz
      justification: "مجاز كنائي: الأرجوان صبغ أحمر قانٍ كان يُخصَّص للأباطرة الرومان، فأُطلق على السلطة الإمبراطورية من باب إطلاق الرمز على المرموز إليه"
    - lemma: "السُّدَّة"
      generation_method: majaz
      justification: "مجاز مرسل: السُّدَّة أصلها باب الدار والظُّلَّة فوقه، ثم استُعملت كناية عن مقام الحكم في «اعتلى سُدَّةَ الحُكْم»"
    - lemma: "القَيْصَرِيَّة"
      generation_method: ishtiqaq
      justification: "مصدر صناعي من «قيصر» (لقب أباطرة الروم) على وزن فَعْلَلِيَّة، للدلالة على المقام الإمبراطوري أو صفة ما يتعلّق بالقيصر"
    - lemma: "المَقَامُ القَيْصَرِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «مقام» (منزلة) و«قيصري» (نسبة إلى قيصر)؛ يقابل المفهوم الروماني تحديداً"

stage2_evidence:
  per_lemma:
    - lemma: "الأُرْجُوَان"
      confirm:
        - text: "«(5) .أ» الأُرْجُوان: الصِّبغ الأُرْجوانيّ الصُّوري [نسبةً إلى مدينة صور]. .ب» لون الأُرْجُوان. .ج» ثوبٌ أرجوانيّ اللون. وبخاصة حين يُرتدَى رمزًا للسّلطة أو المنزلة الرفيعة. (6) .أ» سلطة ملكيّة أو أمبراطورية. .ب» مقام رفيع. .ج» رتبة الكاردينال. .د» ثروة ضخمة»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«(الأرجوان) شجر من الفصيلة القرنية لَهُ زهر شَدِيد الْحمرَة حسن المنظر وَلَيْسَت لَهُ رَائِحَة والصبغ الْأَحْمَر وَالثَّوْب الْمَصْبُوغ فِيهِ يُقَال أَحْمَر أرجواني قان (مَعَ)»"
          source: "المعجم الوسيط"
          conflict: "الوسيط يقصر الدلالة على الشجر والصبغ والثوب المصبوغ، دون إشارة إلى الكناية عن السلطان الإمبراطوري"
      expands:
        - text: "«(فى الأكدية argamannu أَرْجَمَنُّ = فى العبرية argamān أَرْجَمَان. وبالواو مكان الميم argewānā أَرْجِوانا فى الأرامية, ومنها انتقلت الكلمة إلى العربية): صِبْغ أحمر»"
          source: "المعجم الكبير"
          addition: "الكلمة معرّبة من الأرامية/الأكدية، وأصلها يدلّ على الصبغ الأحمر الفاخر"
        - text: "«(أرجوان) - ومن رُبَاعِيّه في الحَدِيث: لا أركَب الأُرجوان يعنى الأُحمرَ. قيل: أَراد به المَياثِرَ الحُمْرَ»"
          source: "المجموع المغيث في غريبي القرآن والحديث"
          addition: "ورد في الحديث النبوي بدلالة اللون الأحمر والثياب الفاخرة"

    - lemma: "المَنْصِبُ الإِمْبِرَاطُورِيّ"
      evidence_status: "no_material_found"

    - lemma: "السُّدَّة"
      confirm:
        - text: "«ومن المجاز: اعْتَلَى سُدَّةَ الحُكْم, أى: تَوَلَّى السُّلْطَةَ»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«(السدة) بَاب الدَّار والظلة بِبَاب الدَّار والساحة بَين يَدي الْبَاب والسرير والسداد (ج) سدد»"
          source: "المعجم الوسيط"
          conflict: "السُّدَّة مكانية عامة (باب/ظُلَّة) وليست خاصة بالسلطة الإمبراطورية الرومانية"

    - lemma: "القَيْصَرِيَّة"
      contradicts:
        - text: "«القَيصَرِيَّة»"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المصطلح مقيّد بالدلالة الطبية (العملية القيصرية cesarean) ولا يرد بدلالة المقام الإمبراطوري"

    - lemma: "المَقَامُ القَيْصَرِيّ"
      evidence_status: "no_material_found"

