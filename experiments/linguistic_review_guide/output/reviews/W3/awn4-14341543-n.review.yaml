# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14341543-n
# oscheocele / oscheocoele — تورم كيس الصفن
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "«فتاق الصفن» غير موثّق في أيّ معجم طبي عربي موحّد؛ الشكل المعتمد هو «فَتْق صَفَنِيّ» أو «فَتْقُ الصَّفَن»."
      - "«فتاق» صيغة نادرة من «فتق»؛ لم ترد إلا في المورد الحديث كمرادف ثانوي ولم تتبنّها المعاجم الطبية."
      - "مفهوم oscheocele (تورّم الصَّفَن عموماً) يختلف عن الفَتْق الصَّفَنيّ (بروز أحشاء في الصَّفَن)؛ اللمّة «فتاق الصفن» توحي بالفتق تحديداً."
    observations: >
      المجموعة تصف حالة طبية هي تورّم كيس الصَّفَن (oscheocele). اللمّة «قيلة صفنية» موثّقة في المعجم الطبي الموحّد
      كمقابل دقيق لـ oscheocele وscrotocele. أمّا «فتاق الصفن» فلا أثر لها في المعاجم الطبية، والصيغة المعتمدة هي
      «فتق صفني» التي تعني الفتق الصفني (scrotal hernia) وهو مفهوم أضيق. يُنصح بحذف «فتاق الصفن» والنظر في
      إضافة «تَوَرُّم صَفَنِيّ» المسجّل في المعجم الطبي الموحّد بمعنى scrotal swelling.
  blind_candidates:
    - lemma: "أُدْرَة"
      generation_method: ishtiqaq
      justification: "مصطلح طبي عربي تراثي يدلّ على انتفاخ الخصية، ورد في المعجم الوسيط وكشّاف اصطلاحات الفنون"
    - lemma: "تَوَرُّمٌ صَفَنِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من «تَوَرُّم» (مصدر وَرِمَ) و«صَفَنِيّ» (نسبة إلى الصَّفَن)، يطابق التعريف مباشرة"
    - lemma: "قِيلَةٌ صَفَنِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي طبي ثابت من «قِيلَة» (بروز/فتق) و«صَفَنِيَّة»، مسجّل في المعاجم الطبية"
    - lemma: "فَتْقُ الصَّفَن"
      generation_method: tarkib
      justification: "مركب إضافي من «فَتْق» (شقّ/بروز أحشاء) و«الصَّفَن»، قريب من المفهوم وإن كان أخصّ"

stage2_evidence:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "فتاق الصفن"
      contradicts:
        - text: "«(3) فتق؛ فتاق»"
          source: "المورد الحديث (2008)"
          conflict: "فتاق مرادف لفتق (rupture) لكن المركب «فتاق الصفن» غير مسجّل في أيّ معجم"
      expands:
        - text: "«فتق صَفني: فتق أربي ازداد حجماً فنزل في الكيس.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
          addition: "الصيغة المعتمدة هي «فتق صفني» لا «فتاق الصفن»، ودلالتها أخصّ من oscheocele"
    - lemma: "قيلة صفنية"
      confirm:
        - text: "«قِيلَةٌ صَفَنِيَّة»"
          source: "المعجم الطبي الموحد (2009) — oscheocele"
        - text: "«قيلَةٌ صَفَنِيَّة ( فَتْقُ صَفَنِيّ)»"
          source: "المعجم الطبي الموحد (2009) — scrotocele (scrotal hernia)"
        - text: "«قيلة صفنية: تجمع مائي داخل كيس الصفن.»"
          source: "معجم المصطلحات الطبية (ج.3، 1997)"
    # ── المرشحات ──
    - lemma: "أُدْرَة"
      confirm:
        - text: "«الأدرة: نفخة في الخصية ويقول لها الناس القبل»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(الأدرة) انتفاخ الخصية لتسرب سَائل فِيهَا والخصية المنتفخة (ج) أدر»"
          source: "المعجم الوسيط"
        - text: "«انتفاخ الخُصْية, لتسرب سائل فيها الخصية المنتفخة»"
          source: "المعجم الوسيط (OCR)"
      contradicts:
        - text: "«أُدْرَة (قِيلَةٌ مائِيَّة)» = hydrocele"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "الأدرة في الطبّ الحديث تُخصَّص للقيلة المائية (hydrocele) لا لمطلق تورّم الصَّفَن (oscheocele)"
    - lemma: "تَوَرُّمٌ صَفَنِيّ"
      confirm:
        - text: "«تَوَرُّمٌ صَفَنِيّ»"
          source: "المعجم الطبي الموحد (2009) — scrotal swelling"
    - lemma: "فَتْقُ الصَّفَن"
      expands:
        - text: "«فَتْقٌ صَفَنِيّ» = scrotal hernia"
          source: "المعجم الطبي الموحد (2009)"
          addition: "الصيغة الوصفية «فتق صفني» موثّقة، لكنها تعني الفتق تحديداً لا مطلق التورّم"

stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "فتاق الصفن"
      decision: removed
      decision_reason: >
        المركب «فتاق الصفن» غير موثّق في أيّ معجم طبي عربي. كلمة «فتاق» نادرة الاستعمال ولم تتبنّها
        المعاجم الطبية المتخصّصة التي تستخدم «فَتْق» بدلاً منها. فضلاً عن ذلك، دلالة الفتق (hernia)
        أخصّ من دلالة oscheocele (مطلق تورّم الصَّفَن). يُحذف الربط بالمجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قِيلَةٌ صَفَنِيَّة"
      decision: confirmed
      decision_reason: >
        مصطلح طبي موحّد مسجّل في المعجم الطبي الموحّد كمقابل مباشر لـ oscheocele وscrotocele.
        ورد أيضاً في معجم المصطلحات الطبية بمعنى «تجمّع مائي داخل كيس الصفن». التشكيل الكامل مطلوب.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "مصطلح طبي متخصّص يُشير إلى بروز أو انتفاخ في كيس الصَّفَن بمفهومه العام (قيلة = بروز/نتوء)"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قِيلَةٌ صَفَنِيَّة"

    # ── مرشّحات المرحلة ١ ──
    - lemma: "تَوَرُّمٌ صَفَنِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مسجّل في المعجم الطبي الموحّد (2009) بمعنى scrotal swelling، وهو يطابق تعريف المجموعة
        «تورم كيس الصفن» تطابقاً تامّاً. مركب وصفي شفّاف البنية ومقبول اصطلاحاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "وصف طبي عامّ يدلّ على أيّ انتفاخ في الصَّفَن دون تخصيص السبب، أقرب إلى اللغة السريرية الوصفية"
      actions:
        - command: create_entry
          params: {lemma: "تَوَرُّمٌ صَفَنِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "أُدْرَة"
      source: stage1
      decision: removed
      decision_reason: >
        الأُدْرَة في الاصطلاح الطبي الحديث تُخصَّص للقيلة المائية (hydrocele)، وهي نوع محدّد من تورّم الصفن
        وليست مرادفة لمطلق تورّم الصفن (oscheocele). المعجم الطبي الموحّد يميّز بينهما صراحة.
      evidence_assessment:
        case: mixed

    - lemma: "فَتْقُ الصَّفَن"
      source: stage1
      decision: removed
      decision_reason: >
        الفتق الصفني (scrotal hernia) مفهوم أخصّ من oscheocele. الفتق يعني بروز الأحشاء عبر فتحة،
        بينما oscheocele يشمل أيّ تورّم في الصفن. إضافته قد تُوهِم بتضييق الدلالة.
      evidence_assessment:
        case: mixed

