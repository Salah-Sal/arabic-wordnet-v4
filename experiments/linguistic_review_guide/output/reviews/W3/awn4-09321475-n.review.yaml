stage4_content:
  definition:
    current: "ذراع من بحر أندامان قبالة جنوب ميانمار"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب جداً؛ يفضل إضافة تفاصيل جغرافية تميز هذا الخليج مثل مصبات الأنهار."
    authored:
      - type: encyclopedic
        text: "ذراع من بحر أندامان يقع في جنوب ميانمار، يشتهر بظاهرة المِدّ العالي وتصب فيه أنهار سيتانغ وسالوين."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09321475-n"
          definition_index: 0
          text: "ذراع من بحر أندامان يقع في جنوب ميانمار، يشتهر بظاهرة المِدّ العالي وتصب فيه أنهار سيتانغ وسالوين."
  examples:
    per_lemma:
      - lemma: "خَلِيج مَارْتَابَان"
        examples:
          - text: "يُعد خليج مارتابان في ميانمار من أهم المناطق البيئية التي تستقطب الطيور المهاجرة."
            type: usage
      - lemma: "خَلِيج مَرْتَبَان"
        examples:
          - text: "عبرت السفن التجارية قديماً خليج مرتبان محملة بالخزف والمنسوجات من موانئ بورما."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "awn4-09321475-n"
          text: "يصب نهر سالوين في الطرف الشرقي من خليج مارتابان قبالة مدينة مولمين."

