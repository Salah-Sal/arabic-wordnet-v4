stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة تفتقر إلى التشكيل الكامل."
      - "المجموعة تخص علماً جغرافياً أعجمياً، مما يجعله عرضة لتعدد صيغ النسخ الصوتي (Transliteration)."
    observations: "التعريف العربي دقيق جغرافياً، واللمة تمثل النسخ الصوتي الشائع في المصادر المعاصرة."
  blind_candidates:
    - lemma: "خَلِيج مَارْتَابَان"
      generation_method: tarkib
      justification: "التعريب المباشر للاسم الإنجليزي (Gulf of Martaban) المذكور في التعريف."
    - lemma: "خَلِيج مُوطَامَا"
      generation_method: tarkib
      justification: "استخدام الاسم المحلي الحالي للخليج في ميانمار (Mottama) مع لفظ 'خليج'."
    - lemma: "خَلِيج مَرْتَبَان"
      generation_method: tarkib
      justification: "الصيغة العربية التراثية لاسم المنطقة (Martaban) التي اشتهرت بصناعة الأواني الخزفية."
    - lemma: "جَوْن مَارْتَابَان"
      generation_method: tarkib
      justification: "استخدام 'جَوْن' كبديل لـ'خليج' في تسمية التضاريس البحرية العميقة."

stage2_evidence:
  per_lemma:
    - lemma: "خَلِيج مَارْتَابَان"
      evidence_status: "no_material_found"
    - lemma: "مَرْتَبَان"
      confirm:
        - text: "«(البرطمان) إناء من زجاج أو خزف... فارسي الأصل، ولفظه عندهم: (مرتبان)»"
          source: "المعجم الوسيط"
      expands:
        - text: "«مرطبان (هو في المعاجم الفارسية أيضا مرتبان)... وفي م. المحيط (المرطبان عند العامة قارورة من خزف...)»"
          source: "تكملة المعاجم العربية (دوزي)"
          addition: "يوضح العلاقة التاريخية بين اسم المكان (Martaban) والمنتج المشهور منه (البرطمان)."
    - lemma: "مِيَانْمَار"
      confirm:
        - text: "«تحدُّها من الشرق كوريا الشمالية... ومن الجنوب ميانمار وفيتنام ولاوس.»"
          source: "المعجم الكبير"

