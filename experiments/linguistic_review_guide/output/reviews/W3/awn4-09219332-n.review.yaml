      confirm:
        - text: "«جزر أندامان و نيكوبار»"
          source: "المكنز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«خليج البنغال»"
          source: "المكنز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«البَحْرُ: الماءُ الواسِعُ الكَثِيرُ... وأشهر البحار التى عرفها العرب هي... وبحرُ فارس (الخليج العربى)...»"
          source: "المعجم الكبير"
          addition: "يوضح الدليل أن العرب أطلقوا أسماء مركبة على البحار المكتشفة حديثاً أو البعيدة."
    - lemma: "بَحْرُ أَنْدَامَانَ"
      confirm:
        - text: "«حُمَّى أندامان A»"
          source: "المعجم الطبي الموحد"

