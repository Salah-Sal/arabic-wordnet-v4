stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة غير مشكولة."
      - "التعريف الحالي ترجمة حرفية للتعريف الإنجليزي."
    observations: "اللمة هي اسم عَلَم جغرافي لكيان مائي محدد. المصطلح مستقر في الاستعمال العربي المعاصر."
  blind_candidates:
    - lemma: "بَحْرُ أَنْدَامَانَ"
      generation_method: tarkib
      justification: "الاسم القياسي للكيان الجغرافي المذكور في التعريف، وهو مركب إضافي يتكون من 'بحر' واسم العَلَم الأعجمي 'أندامان'."
    - lemma: "بَحْرُ أَنْدَمَانَ"
      generation_method: tarkib
      justification: "تنويع إملائي شائع لاسم العَلَم (أندمان بدل أندامان)."
    - lemma: "الْبَحْرُ الْأَنْدَمَانِيُّ"
      generation_method: ishtiqaq
      justification: "صيغة النسبة إلى 'أندمان'، وتستخدم أحياناً في السياقات العلمية أو الوصفية."
    - lemma: "بَحْرُ مَلَايُو"
      generation_method: tarkib
      justification: "تسمية بديلة محتملة بناءً على الموقع الجغرافي (شبه جزيرة الملايو)، وإن كانت أقل شيوعاً."

stage2_evidence:
