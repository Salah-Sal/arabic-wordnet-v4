# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل"
      - "«بطل لا يقهر» عبارةٌ وصفية حرّة تحتوي على جملة نسبية؛ وهي أقرب إلى الوصف منها إلى المصطلح المسكوك"
      - "«متفوق عالمي» مركب وصفي مقبول لكنه لا يُعبِّر عن الشق التنافسي المباشر الدال على الصدارة"
      - "التعريف الحالي «منافس يحتل مكانة بارزة ومتفوقة جداً» يتضمن «جداً» غير الرسمية، وفيه ازدواج دلالي بين «بارزة» و«متفوقة»"
      - "غياب لمّة مفردة تُمثّل المفهوم؛ كلتا اللمّتين مركّبتان"
    observations: >-
      المجموعة تصف منافساً يحتلُّ مكانةً متقدِّمة على سائر منافسيه بصورة متميزة، وهو ما يقابل
      «world-beater» في الإنجليزية. يوثِّق المورد الحديث هذا المفهوم صراحةً بـ«البطل؛ المتفوِّق
      على غيره»، وهو ما يدعم اللمّتين الموجودتين من حيث الدلالة. لكن يُلاحَظ أن التراث العربي
      يمتلك لفظةً كلاسيكية دقيقة هي «المُجَلِّي» (اسم الفرس الفائز في حلبة السباق) التي باتت
      تُستخدم في المعجمية الحديثة مقابلاً لـ«champion». وفي المقابل، كلا المدخلَين الراهنَين
      مقبول دلالياً ضمن إطار AWN باعتباره تعبيرًا اصطلاحياً.
  blind_candidates:
    - lemma: "مُتَصَدِّر"
      generation_method: ishtiqaq
      justification: >-
        مشتق من الجذر (صدر) على وزن مُتَفَعِّل، يصف من يتصدّر قائمة المنافسين
        ويحتل المرتبة الأولى؛ والجذر يحمل معنى التقدّم والصدارة وإعلاء الشيء.
    - lemma: "فَحْل"
      generation_method: majaz
      justification: >-
        أصله في العربية «الذَّكَرُ الْبَاسِلُ» المختار لقوّته وكرمه، ثم جرى على لسان
        العرب استعاريًا لمن يتميّز على أقرانه في ميدانه؛ كما في «فَحْل الشعراء»، وهو
        إحياء لمجاز عربي أصيل بدلاً من الاستعانة بكلمة جديدة.
    - lemma: "صَاحِبُ الصَّدَارَة"
      generation_method: tarkib
      justification: >-
        مركّب إضافي من «صاحب + الصدارة»؛ والصدارة تعني التقدّم والمكانة الأولى.
        يصف من يملك موضع الصدارة في الميدان التنافسي.
    - lemma: "مُتَسَيِّد"
      generation_method: ishtiqaq
      justification: >-
        مشتق من الجذر (سود) على وزن مُتَفَيْعِل، يصف من يبسط سيادته على منافسيه
        ويستوي في المقدمة؛ والسيادة في المقاييس مرتبطة بالتجمّع حول الشخص وتبعيّة
        الناس له.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "بطل لا يقهر"
      confirm:
        - text: "«البطل؛ المتفوِّق على غيره.»"
          source: "المورد الحديث (2008) — ترجمة world-beater"
        - text: "«الشجاعُ الذى لا يَهاب الموت؛ بَطَلُ الرواية: صـاحـبُ الدَّوْر الرئيس فيها»"
          source: "المعجم الكبير"
        - text: "«بَطَلٌ بَيِّنُ الْبُطُولَةِ وَالْبَطَالَةِ... وَالْبَطَلُ الشُّجَاعُ. قَالَ أَصْحَابُ هَذَا الْقِيَاسِ: سُمِّيَ بِذَلِكَ لِأَنَّهُ يُعَرِّضُ نَفْسَهُ لِلْمَتَالِفِ»"
          source: "مقاييس اللغة لابن فارس"
        - text: "«بَطَلٌ — hero»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
      expands:
        - text: "«(قَهَرَ) الْقَافُ وَالْهَاءُ وَالرَّاءُ كَلِمَةٌ صَحِيحَةٌ تَدُلُّ عَلَى غَلَبَةٍ وَعُلُوٍّ. يُقَالُ: قَهَرَهُ يَقْهَرُهُ قَهْرًا. وَالْقَاهِرُ: الْغَالِبُ»"
          source: "مقاييس اللغة لابن فارس"
          addition: >-
            جذر القهر يدلُّ على الغلبة والعلوّ؛ فـ«لا يُقهَر» نفيٌ للغلبة عليه،
            مما يعزز الدلالة على الاستحالة وخرق القدرات العادية.

    - lemma: "متفوق عالمي"
      confirm:
        - text: "«مُتَفَوِّق؛ مُبَرِّز؛ مُجَلٍّ.»"
          source: "المورد الحديث (2008) — ترجمة preeminent"
        - text: "«البطل؛ المتفوِّق على غيره.»"
          source: "المورد الحديث (2008) — ترجمة world-beater"
      expands:
        - text: "«(فَوَقَ) الْفَاءُ وَالْوَاوُ وَالْقَافُ أَصْلَانِ صَحِيحَانِ، يَدُلُّ أَحَدُهُمَا عَلَى عُلُوٍّ... فُلَانٌ فَاقَ أَصْحَابَهُ يَفُوقُهُمْ، إِذَا عَلَاهُمْ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر فوق يثبت الأصل الدلالي الصحيح للمصطلح من حيث العلوّ والتفوّق"

    - lemma: "مُتَصَدِّر"
      expands:
        - text: "«الصُّدَارَةُ: التَّقَدُّمُ. يقالُ: فلانٌ لهُ الصُّدارةُ فى القوم»"
          source: "المعجم الكبير"
          addition: "يؤكد أن الصدارة تعني التقدّم والمكانة الأولى، مما يدعم الحقل الدلالي لمتصدّر"
        - text: "«(الصدارة) التَّقَدُّم يُقَال فلَان لَهُ الصدارة فِي الْقَوْم»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (Hawramani)"
          addition: "توثيق إضافي للصدارة بمعنى التقدم في المعاجم الحديثة"

    - lemma: "فَحْل"
      expands:
        - text: "«(فَحَلَ) الْفَاءُ وَالْحَاءُ وَاللَّامُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ذَكَارَةٍ وَقُوَّةٍ. مِنْ ذَلِكَ الْفَحْلُ مِنْ كُلِّ شَيْءٍ، وَهُوَ الذَّكَرُ الْبَاسِلُ... فَحْلٌ فَحِيلٌ: كَرِيمٌ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر يدل على القوة والكرم، وصيغة «فحيل» تعني الكريم الممتاز"
        - text: "«الفحل: الذكر الباسل من كل شيء الكريم»"
          source: "مقاييس اللغة (نسخة OCR)"
          addition: "توثيق المعنى المجازي المحتمل لـ«الكريم/الممتاز»"
