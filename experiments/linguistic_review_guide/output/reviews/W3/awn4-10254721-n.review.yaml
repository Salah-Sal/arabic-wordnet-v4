# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "بطل لا يقهر"
      decision: confirmed
      decision_reason: >-
        اللمّة موثّقة بقوة في المعاجم الحديثة؛ إذ يترجم المورد الحديث «world-beater»
        بـ«البطل؛ المتفوق على غيره»، وهو مجاور مباشر للمدخل الراهن. كما أن «بطل»
        موثّق في كل المعاجم الكلاسيكية والحديثة بمعنى الشجاع والمتقدّم. أما صيغة
        «لا يُقهَر» فتضيف بُعد الاستحالة الذي يميّز «world-beater» عن مجرد «champion».
        مع ضرورة إضافة التشكيل الكامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        يركّز على طابع الاستعصاء وامتناع الهزيمة — «لا يُقهَر» تدل على قهر المنافسين
        وعدم قابليتهم إياه للإخضاع؛ مع إيحاء بالبطولة الاستثنائية التي تتخطّى الحدود
        المعتادة. يُناسب السياقات الإعلامية والرياضية ذات الطابع التعجّبي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَطَلٌ لَا يُقْهَرُ"

    - lemma: "متفوق عالمي"
      decision: confirmed
      decision_reason: >-
        المورد الحديث يترجم «preeminent» بـ«متفوِّق؛ مُبَرِّز؛ مُجَلٍّ»، كما يترجم
        «world-beater» بـ«البطل؛ المتفوِّق على غيره»؛ مما يوثّق «متفوق» مباشرةً لهذه
        الدلالة. إضافة «عالمي» تقابل «world» في المصطلح الإنجليزي وتُقيّد التفوق
        بالبُعد العالمي. المركّب وصفي (wasfi) مقبول ومُحكَم. يحتاج فقط إلى التشكيل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        يُبرز بُعد المقارنة على المستوى العالمي لا المحلي — «عالمي» تُضيّق الدلالة
        إلى الصدارة في مضمار الأمم والتنافس الدولي، مما يجعله أنسب في سياقات السجلات
        الرياضية والتصنيفات الدولية الرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُتَفَوِّق عَالَمِيّ"

    - lemma: "مُتَصَدِّر"
      source: stage1
      decision: removed
      decision_reason: >-
        رغم صحّة الاشتقاق من الجذر (صدر) واتساق المعنى مع الحقل الدلالي، إلا أن «متصدّر»
        لا يرد في المعاجم الكلاسيكية كلمّة مستقلة لهذه الدلالة. كما لا يجتاز اختبار
        التثبيت المعجمي لأنه لم يُسجَّل في مصادر ARABTERM بوصفه مصطلحاً تقنياً.
        يبقى صالحاً وصفاً لغوياً حرًّا، لكنه لا يرقى إلى المصطلح المسكوك.

    - lemma: "فَحْل"
      source: stage1
      decision: removed
      decision_reason: >-
        المعنى الأساسي الموثّق في جميع المعاجم هو «الذكر الباسل من الحيوان»؛ والأدلة
        لا تُثبت استعماله في سياق المنافسة التنافسية. فضلاً عن أن ARABTERM يُقنّنه
        بـ«sire» في الطب البيطري، مما يخلق خطر الاشتراك اللفظي إذا أُدرج في سياق
        الرياضة والمنافسة. يُقبل كاستعارة أدبية لكن لا كمصطلح معجمي في AWN.

    - lemma: "صَاحِبُ الصَّدَارَة"
      source: stage1
      decision: removed
      decision_reason: >-
        لا يجتاز اختبار التثبيت المعجمي: يمكن إبدال «الصدارة» بـ«المقدمة» أو «الريادة»
        أو «السبق» دون تغيير المعنى أو فقدان اصطلاحية التعبير، وهو مؤشر على أنه عبارة
        وصفية حرة لا مصطلح مسكوك. كما لا يرد في قواعد البيانات المصطلحية.

    - lemma: "مُتَسَيِّد"
      source: stage1
      decision: removed
      decision_reason: >-
        لم يُعثر له على أي توثيق في المعاجم الكلاسيكية أو الحديثة أو قواعد بيانات
        ArabTerm. رغم صحّة الاشتقاق من (سود)، فإن الصيغة «متسيّد» ليست من الأبنية
        الصرفية العربية الشائعة، ولا توجد في قاموس يُثبتها.


