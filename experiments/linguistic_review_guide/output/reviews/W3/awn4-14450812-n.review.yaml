# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية awn4-14450812-n
# embrace — the state of taking in or encircling
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "لمّة «طوق» اسم جامد يدل على الحَلْي أو ما استدار بشيء (شيء مادي)، وليس على حالة أو مصدر يدل على فعل الاحتواء أو الإحاطة كما يقتضي التعريف"
      - "اللمّتان بدون تشكيل كامل"
      - "عدد اللمّات قليل (٢) لمفهوم له تعبيرات عربية متنوعة"
    observations: "المجموعة تعبّر عن حالة مجردة (state) من الاحتواء والإحاطة، وهي مصدرية بطبيعتها. اللمّة «احتواء» (افتعال من حوى) ملائمة تماماً لأنها مصدر يدل على حالة الجمع والإحراز. أمّا «طوق» فهو اسم ذات يدل على الشيء المستدير حول العنق أو غيره، لا على الحالة المجردة. المفهوم العام (فوقي) هو الإدراج والاشتمال، مما يؤكد الطابع المصدري المجرد للمجموعة."
  blind_candidates:
    - lemma: "اِحْتِضَان"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من الجذر ح ض ن، يدل على ضمّ الشيء إلى الحِضن وإحاطته حفظاً وصيانة، فيه معنى الاحتواء المادي والمعنوي"
    - lemma: "ضَمّ"
      generation_method: ishtiqaq
      justification: "مصدر من الجذر ض م م، يدل على قبض شيء إلى شيء وملاءمة بينهما، وهو قريب من معنى التطويق والاحتواء"
    - lemma: "اِعْتِنَاق"
      generation_method: ishtiqaq
      justification: "مصدر افتعال من الجذر ع ن ق، يدل على المعانقة أي إحاطة اليدين بالعنق، قريب من الدلالة الإنجليزية لـ embrace"
    - lemma: "مُعَانَقَة"
      generation_method: ishtiqaq
      justification: "مصدر مفاعلة من الجذر ع ن ق، يدل على تبادل العناق في المودة، وهو الترجمة المباشرة لـ embrace بالمعنى الحسّي"

stage2_evidence:
  per_lemma:
    - lemma: "اِحْتِوَاء"
      confirm:
        - text: "«حَوَيْتُ الشَّيْءَ أَحْوِيهِ حَوَايَةً وَاحْتَوَيْتُ عَلَيْهِ إذَا ضَمَمْتُهُ وَاسْتَوْلَيْتُ عَلَيْهِ فَهُوَ مَحْوِيٌّ»"
          source: "المصباح المنير للفيّومي"
        - text: "«احتوى على الشيء: استولى عليه»"
          source: "أساس البلاغة للزمخشري"
        - text: "«الْحَاءُ وَالْوَاوُ وَمَا بَعْدَهُ مُعْتَلٌّ أَصْلٌ وَاحِدٌ، وَهُوَ الْجَمْعُ»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«حَوَى فلان مالاً حَيَّاً وحَوَايةً، أي: جمعه وأحرزه، واحتوى عليه، كَحَوِيٍّ الحيَّة. والحَوِيُّ: استدارة كلّ شيء»"
          source: "كتاب العين للخليل بن أحمد الفراهيدي"
          addition: "يربط الجذر بين الجمع والاستدارة، وكلاهما داخل في معنى الاحتواء"
        - text: "«containment»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "الاستخدام الاصطلاحي الحديث بمعنى الاحتواء والحبس"
        - text: "«inclusion»"
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (1990)"
          addition: "يُستعمل بمعنى الإدراج والتضمين في السياق الرياضي"

    - lemma: "طَوْق"
      contradicts:
        - text: "«الطَّوْقُ: حَلْيٌ للعُنُقِ، وكُلُّ ما اسْتدارَ بشيءٍ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "طوق اسم ذات (حَلْي أو ما استدار بشيء) وليس اسم حالة مجردة كما يقتضي التعريف"
        - text: "«الطَّاءُ وَالْوَاوُ وَالْقَافُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى... فَكُلُّ مَا اسْتَدَارَ بِشَيْءٍ فَهُوَ طَوْقٌ»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الأصل يدل على الشيء المادي المستدير، لا على حالة الإحاطة المجردة"
      expands:
        - text: "«يطوِّق / يَشْمَل / يُنجز»"
          source: "المورد الحديث (2008)"
          addition: "الفعل طوَّق يتعدى إلى الشمول والإحاطة، لكن الاسم طوق يبقى دالاً على الشيء المادي"

    - lemma: "اِحْتِضَان"
      confirm:
        - text: "«الْحَاءُ وَالضَّادُ وَالنُّونُ أَصْلٌ وَاحِدٌ يُقَاسُ، وَهُوَ حِفْظُ الشَّيْءِ وَصِيَانَتُهُ. فَالْحِضْنُ مَا دُونُ الْإِبِطِ إِلَى الْكَشْحِ ; يُقَالُ احْتَضَنْتُ الشَّيْءَ جَعَلْتُهُ فِي حِضْنِي»"
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: "«brooding»"
          source: "المَكنَز الزراعي متعدد اللغات"
          addition: "الاستخدام الاصطلاحي يقصره على حضانة الطيور لبيضها"

    - lemma: "ضَمّ"
      confirm:
        - text: "«الضَّمُّ: قَبْضُ شيءٍ إلى شيءٍ، وقد ضَمَّه فانضَم إليه وتَضامَّ وضامَّهُ. واضطَمَّ الشيءَ: جَمَعَهُ إلى نفسِه»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الضَّادُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى مُلَاءَمَةٍ بَيْنَ شَيْئَيْنِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«الضَّم: الجمع بين شيئين فأكثر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "الضمّ يدل على فعل الجمع بين أشياء وليس على حالة الإحاطة أو الاستدارة"
        - text: "«الضَّمُّ (فى علم النحو): حالةٌ من حالات البناء»"
          source: "المعجم الكبير"
          conflict: "الاستخدام النحوي الشائع يطغى على المعنى اللغوي الأصلي"

    - lemma: "اِعْتِنَاق"
      confirm:
        - text: "«الِاعْتِنَاقُ مِنَ الْمُعَانَقَةِ أَيْضًا، غَيْرَ أَنَّ الْمُعَانَقَةَ فِي الْمَوَدَّةِ، وَالِاعْتِنَاقُ فِي الْحَرْبِ وَنَحْوِهَا»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«يعتنق [فكرةً أو دينًا] / يتقبَّل بسرور / يغتنم [فرصةً]»"
          source: "المورد الحديث (2008)"
          conflict: "الاستخدام الحديث يغلّب معنى تبنّي الأفكار والأديان على معنى الإحاطة المادية"

    - lemma: "مُعَانَقَة"
      confirm:
        - text: "«الِاعْتِنَاقُ مِنَ الْمُعَانَقَةِ أَيْضًا، غَيْرَ أَنَّ الْمُعَانَقَةَ فِي الْمَوَدَّةِ»"
          source: "مقاييس اللغة لابن فارس"
      contradicts:
        - text: "«معانقة مميتة — انظر: deadlock»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "الاستخدام الاصطلاحي في الحوسبة (deadly embrace) يبتعد عن المعنى الأصلي"

stage3_analysis:
  per_lemma:
    - lemma: "اِحْتِوَاء"
      decision: confirmed
      decision_reason: "مصدر افتعال من الجذر ح و ي (الجمع والإحراز)، يدل على حالة الاحتواء والإحاطة تماماً كما يقتضي التعريف. أدلة معجمية متعددة تؤكده: المصباح المنير «ضممته واستوليت عليه»، وأساس البلاغة «استولى عليه»، ومقاييس اللغة «أصل واحد وهو الجمع». كما يُستعمل في المعاجم الاصطلاحية الحديثة بمعنى containment وinclusion."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يدل على حالة الضمّ والإحراز والاستيلاء من خلال الإحاطة الشاملة، وهو الأعمّ والأشمل في الدلالة على المفهوم"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِحْتِوَاء"

    - lemma: "طَوْق"
      decision: removed
      decision_reason: "طوق اسم ذات يدل على الحَلْي أو ما استدار بشيء مادياً (القاموس المحيط: «حَلْيٌ للعُنُقِ، وكُلُّ ما اسْتدارَ بشيءٍ»)، ومقاييس اللغة يؤكد دلالته المادية. المجموعة تحتاج مصدراً أو اسم حالة يدل على فعل الإحاطة أو الاحتواء المجرد، لا على الشيء المادي المُحيط. المصدر المناسب من الجذر نفسه هو «تطويق» لا «طوق»."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "اِحْتِضَان"
      source: stage1
      decision: removed
      decision_reason: "مقاييس اللغة يُرجع الجذر ح ض ن إلى «حفظ الشيء وصيانته»، فدلالته الأساسية على الرعاية والحماية لا على الإحاطة المجردة. الاستخدام الحديث يتجه نحو الحضانة (brooding/nurturing) أكثر من الاحتواء الشامل. لا يناسب المفهوم الذي يُعرَّف بأنه «حالة الاحتواء أو الإحاطة»."
      evidence_assessment:
        case: mixed

    - lemma: "ضَمّ"
      source: stage1
      decision: removed
      decision_reason: "رغم أن الجذر ض م م يدل على «ملاءمة بين شيئين» (مقاييس)، فإن الضمّ يُستعمل أساساً بمعنى الجمع والقبض لا الإحاطة. كما أن المعنى النحوي (حركة الضمّ) يطغى على المعنى اللغوي في الاستخدام المعاصر، مما يُضعف ملاءمته للمجموعة."
      evidence_assessment:
        case: mixed

    - lemma: "اِعْتِنَاق"
      source: stage1
      decision: removed
      decision_reason: "ابن فارس يخصّ الاعتناق بالحرب دون المودة، والاستخدام الحديث يُغلّب معنى تبنّي الأفكار والأديان. كلا الاستخدامَيْن يبتعد عن المعنى المطلوب (حالة الاحتواء أو الإحاطة المجردة)."
      evidence_assessment:
        case: mixed

    - lemma: "مُعَانَقَة"
      source: stage1
      decision: removed
      decision_reason: "المعانقة مخصوصة بالمودة الحسية (ابن فارس: «المعانقة في المودة»)، ولا تمتد إلى مفهوم الإحاطة أو الاحتواء المجرد. كما أنها فعل مشاركة (مفاعلة) يقتضي طرفين، والمجموعة تدل على حالة أحادية الطرف."
      evidence_assessment:
        case: mixed

