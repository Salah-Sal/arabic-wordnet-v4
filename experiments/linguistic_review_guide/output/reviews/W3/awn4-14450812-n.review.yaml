      decision: retain
      reason: "التعريف الحالي واضح ومباشر، يستخدم مصطلحين عربيين أصيلين (الاحتواء والإحاطة) يُغطّيان بُعدَي المفهوم: الضمّ والاستيلاء (الاحتواء) والاستدارة والإحداق (الإحاطة). التعريف مطابق لأسلوب المعجم الوسيط ولا يحتاج تعديلاً."
