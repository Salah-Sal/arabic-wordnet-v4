stage1_review:
  assessment:
    concerns:
      - اللمة الحالية تفتقر إلى التشكيل الكامل.
      - المفهوم جغرافي فريد، لذا التنوع في اللمات محدود بالأسماء العلم.
    observations: "بحر آزوف هو التسمية العربية القياسية لهذا المسطح المائي. التعريف الحالي دقيق جغرافياً، وتصنيفه كخليج يتسق مع البنية الهرمية لـ WordNet رغم تسميته 'بحراً'."
  blind_candidates:
    - lemma: "بَحْرُ آزُوفَ"
      generation_method: tarkib
      justification: "التسمية العربية القياسية للمسطح المائي المذكور في التعريف."
    - lemma: "خَلِيجُ آزُوفَ"
      generation_method: tarkib
      justification: "تسمية بديلة تعكس الطبيعة الجغرافية للمكان كخليج تابع للبحر الأسود."
    - lemma: "بَحْرُ مِيُوطِس"
      generation_method: majaz
      justification: "الاسم التاريخي القديم لبحر آزوف في المصادر اليونانية والعربية القديمة."
    - lemma: "بَحْرُ أَزُوفَ"
      generation_method: tarkib
      justification: "تنويع إملائي محتمل باستخدام الهمزة بدلاً من المادة."

stage2_evidence:
  per_lemma:
    - lemma: "بحر آزوف"
      confirm:
        - text: "Sea of Azov"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
        - text: "«والتتار على شواطئ بحر ازوف يبدلون دائماً حرف X قبل حرفي i, e إلى ch»"
          source: "تكملة المعاجم العربية (دوزي)"
    - lemma: "بحر ميوطس"
      evidence_status: "no_material_found"
    - lemma: "خليج آزوف"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "بحر آزوف"
      decision: confirmed
      decision_reason: "الاسم العربي الشائع والوحيد المستخدم حالياً لهذا الموقع الجغرافي، وموثق في المصادر الحديثة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بَحْرُ آزُوفَ"
    - lemma: "بَحْرُ مِيُوطِس"
      source: stage1
      decision: removed
      decision_reason: "اسم تاريخي مهجور لا يستخدم في السياقات الحديثة."
    - lemma: "خَلِيجُ آزُوفَ"
      source: stage1
      decision: removed
      decision_reason: "على الرغم من كونه خليجاً من الناحية الجغرافية، إلا أن 'بحر آزوف' هو الاسم العلم الثابت."

stage4_content:
  definition:
    current: "خليج من البحر الأسود يقع بين روسيا وأوكرانيا"
    assessment:
      decision: revise
      reason: "التعريف الحالي صحيح ولكنه يحتاج إلى تفصيل جغرافي أدق لتمييزه عن مجرد كونه خليجاً عادياً."
    authored:
      - type: encyclopedic
        text: "مُسَطَّحٌ مَائِيٌّ دَاخِلِيٌّ يَتَّصِلُ بِالبَحْرِ الأَسْوَدِ عَنْ طَرِيقِ مَضِيقِ كِيرْتِش، يَقَعُ بَيْنَ رُوسِيَا وَأُوكْرَانِيَا، وَيُعَدُّ مِنْ أَقَلِّ بِحَارِ العَالَمِ عُمْقاً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مُسَطَّحٌ مَائِيٌّ دَاخِلِيٌّ يَتَّصِلُ بِالبَحْرِ الأَسْوَدِ عَنْ طَرِيقِ مَضِيقِ كِيرْتِش، يَقَعُ بَيْنَ رُوسِيَا وَأُوكْرَانِيَا، وَيُعَدُّ مِنْ أَقَلِّ بِحَارِ العَالَمِ عُمْقاً."

  examples:
    per_lemma:
      - lemma: "بحر آزوف"
        examples:
          - text: "تَطُلُّ مَدِينَةُ مَارِيُوبُول الأُوكْرَانِيَّةُ عَلَى سَاحِلِ بَحْرِ آزُوفَ."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "تَطُلُّ مَدِينَةُ مَارِيُوبُول الأُوكْرَانِيَّةُ عَلَى سَاحِلِ بَحْرِ آزُوفَ."

stage5_enrichment:
  per_entry:
    - lemma: "بَحْرُ آزُوفَ"
      entry_id: "{auto}"
      roots:
        - word: "بحر"
          root: "بحر"
          maqayis_quote: "«الْبَاءُ وَالْحَاءُ وَالرَّاءُ. قَالَ الْخَلِيلُ سُمِّيَ الْبَحْرُ بَحْرًا لِاسْتِبْحَارِهِ وَهُوَ انْبِسَاطُهُ وَسَعَتُهُ.»"
        - word: "آزوف"
          root: null
          maqayis_quote: "اسم علم أعجمي لا جذر له في العربية."

  per_sense:
    - lemma: "بَحْرُ آزُوفَ"
      sense_id: "{auto}"
      nuance: "الاسم العلم المخصص لهذا المسطح المائي."
      mwe: true

  synset:
    cultural_fit: native

  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"roots":[{"word":"بحر","root":"بحر","maqayis":"«الْبَاءُ وَالْحَاءُ وَالرَّاءُ. قَالَ الْخَلِيلُ سُمِّيَ الْبَحْرُ بَحْرًا لِاسْتِبْحَارِهِ وَهُوَ انْبِسَاطُهُ وَسَعَتُهُ.»"},{"word":"آزوف","root":null,"maqayis":"اسم علم أعجمي"}]}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم العلم المخصص لهذا المسطح المائي.","mwe":true}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 1.0
