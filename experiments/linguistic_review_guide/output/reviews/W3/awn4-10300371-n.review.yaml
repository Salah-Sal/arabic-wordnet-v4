stage1_review:
  assessment:
    concerns:
      - "لمّة «ساحر» تحمل دلالة دينية تُحيل إلى السحر الحقيقي المحرّم، مما قد يُلبّس بينه وبين فنان الترفيه الذي يؤدي ألعاب الخفة"
      - "غياب لمّة «مشعوذ» وهي الأكثر شيوعاً وتوثيقاً معجمياً في العربية المعاصرة لهذا المفهوم"
      - "لمّة «مخادع بصري» تركيب وصفي حديث غير مُثبَّت في المعاجم الكلاسيكية بصورة مستقلة"
      - "جميع اللمّات خالية من التشكيل"
    observations: >-
      المجموعة تضم ثلاث لمّات تتوزع على مرجعيات متفاوتة: «ساحر» يتكئ على التراث اللغوي
      العام بما يحمله من إيحاء بالسحر الحقيقي، و«لاعب خفة» يُركّز على الأداء الجسدي
      والخفّة الحركية، و«مخادع بصري» يُخصّص في صنع الأوهام البصرية. الفجوة الأبرز هي غياب
      «مشعوذ» الذي تُجمع عليه المعاجم العربية الحديثة مقابلاً لـ conjurer وprestidigitator
      وmagician. يستحق كذلك ملاحظة أن «حاوٍ» وثَّقه المورد الحديث مقابلاً لـ prestidigitator،
      وإن كان أصله في رقية الحيّات.
  blind_candidates:
    - lemma: "مُشَعْوِذ"
      generation_method: ishtiqaq
      justification: >-
        اسم فاعل من الفعل الرباعي شَعْوَذَ على وزن مُفَعْوِل، والشعوذة هي إراءة الشيء
        على خلاف حقيقته بخداع الحواس؛ والمُشَعْوِذ من يمتهن هذا الفن أمام الجمهور
        لإمتاعه، وهو الوزن الصرفي المناسب لصاحب الحرفة
    - lemma: "شَعْوَذِيّ"
      generation_method: ishtiqaq
      justification: >-
        اسم منسوب إلى الشعوذة على وزن فَعْوَلِيّ، يصف من ينتسب إلى هذا الفن ويمارسه
        احترافاً؛ قياسي في الاشتقاق وإن كان الاستعمال يُفضّل مُشَعْوِذ
    - lemma: "خَفِيفُ الْيَدِ"
      generation_method: tarkib
      justification: >-
        مركب إضافي يصف الصفة المميّزة للمؤدي وهي خفة الحركة وسرعة الأصابع التي تُوهم
        العين؛ وخفة اليد معادل مباشر لـ sleight of hand
    - lemma: "مُمَوِّه"
      generation_method: majaz
      justification: >-
        اسم فاعل من موَّه، أي ألبس الحقيقةَ ثوبَ الباطل؛ استُعمل مجازاً لمن يُوهم
        المشاهدين برؤية ما ليس موجوداً أو يُخفي ما هو موجود، وهو وصف دقيق لجوهر
        عمل المؤدّي


stage2_evidence:
  per_lemma:
    - lemma: "ساحر"
      confirm:
        - text: "«مَنْ يُزاوِلُ السِّحْرَ. العالمُ الفَطِنُ»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
        - text: "«(1) الساحر (2) المُشَعْوِذ»"
          source: "المورد الحديث (2008) — مقابل: magician"
        - text: "«(1) المُناشِد (2) السّاحر (3) المُشَعْوِذ»"
          source: "المورد الحديث (2008) — مقابل: conjurer"
      expands:
        - text: "«الخادع والحاوي»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "يُوضح أن الساحر في الاستعمال يُستعمل بمعنى الخادع والحاوي مما يُقرّبه من دلالة المشعوذ الترفيهية"
        - text: "«السِّينُ وَالْحَاءُ وَالرَّاءُ أُصُولٌ ثَلَاثَةٌ مُتَبَايِنَةٌ: أَحَدُهَا عُضْوٌ مِنَ الْأَعْضَاءِ، وَالْآخَرُ خَدْعٌ وَشِبْهُهُ، وَالثَّالِثُ وَقْتٌ مِنَ الْأَوْقَاتِ»"
          source: "مقاييس اللغة لابن فارس — جذر سحر"
          addition: "الأصل الاشتقاقي للسحر هو الخداع والمخاتلة لا الفعل الخارق وحده"

    - lemma: "لاعب خفة"
      expands:
        - text: "«حَواية؛ شَعْوَذة؛ خِفّة يدٍ»"
          source: "المورد الحديث (2008) — مقابل: prestidigitation"
          addition: "يُثبت الترادف المفهومي بين خفة اليد والشعوذة كفنون أداء متقاربة"
        - text: "«(1) خفّة اليد؛ شعوذة (2) خداع (3) حيلة»"
          source: "المورد الحديث (2008) — مقابل: legerdemain"
          addition: "يُؤكد أن خفة اليد مصطلح راسخ في مقابل legerdemain بمعنى الشعوذة اليدوية"
        - text: "«الْخَاءُ وَالْفَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ شَيْءٌ يُخَالِفُ الثِّقَلَ وَالرَّزَانَةَ. يُقَالُ خَفَّ الشَّيْءُ يَخِفُّ خِفَّةً»"
          source: "مقاييس اللغة لابن فارس — جذر خف"
          addition: "الخفّة في أصلها اللغوي ما يخالف الثقل، ومنها خفة اليد في الحركة السريعة"

    - lemma: "مخادع بصري"
      confirm:
        - text: "«المخادع؛ المضلِّل؛ وبخاصة: «أ» فنّان تتميَّز آثاره بالخِداعيَّة. «ب» المشعوذ؛ الساحر»"
          source: "المورد الحديث (2008) — مقابل: illusionist"
      expands:
        - text: "«الْخَاءُ وَالدَّالُ وَالْعَيْنُ أَصْلٌ وَاحِدٌ، ذَكَرَ الْخَلِيلُ قِيَاسَهُ. قَالَ الْخَلِيلُ: الْإِخْدَاعُ إِخْفَاءُ الشَّيْءِ. فَمِنْهُ خَدَعْتُ الرَّجُلَ خَتَلْتُهُ»"
          source: "مقاييس اللغة لابن فارس — جذر خدع"
          addition: "الخداع في أصله إخفاء الشيء وإيهام المشاهد، وهو جوهر فن الإيهام البصري"
        - text: "«الْبَاءُ وَالصَّادُ وَالرَّاءُ أَصْلَانِ: أَحَدُهُمَا الْعِلْمُ بِالشَّيْءِ»"
          source: "مقاييس اللغة لابن فارس — جذر بصر"
          addition: "البصر أصله الإدراك والرؤية، ومنه البصري نسبة إلى البصر أي المتعلق بحاسة الرؤية"

    - lemma: "مُشَعْوِذ"
      confirm:
        - text: "«شعوذَ يُشعوِذ، شعوذةً، فهو مُشعوِذ: شعوذ الرَّجُلُ: مهر في الاحتيال، أرى الشّيءَ على غير حقيقته معتمدًا على خداع الحواسّ»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
        - text: "«المحتال والمعتمد على خداع الحواس»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) المُناشِد (2) السّاحر (3) المُشَعْوِذ»"
          source: "المورد الحديث (2008) — مقابل: conjurer"
        - text: "«الحاوي؛ المُشَعْوِذ»"
          source: "المورد الحديث (2008) — مقابل: prestidigitator"
        - text: "«(1) الساحر (2) المُشَعْوِذ»"
          source: "المورد الحديث (2008) — مقابل: magician"
        - text: "«الشِّينُ وَالْعَيْنُ وَالذَّالُ لَيْسَ بِشَيْءٍ. قَالَ الْخَلِيلُ: الشَّعْوَذَةُ لَيْسَتْ مِنْ كَلَامِ أَهْلِ الْبَادِيَةِ، وَهِيَ خِفَّةٌ فِي الْيَدَيْنِ، وَأُخْذَةٌ كَالسِّحْرِ»"
          source: "مقاييس اللغة لابن فارس — جذر شعذ"

    - lemma: "شَعْوَذِيّ"
      contradicts:
        - text: "«رَسولُ الأُمَرَاءِ فِى مُهمَّاتِهم على البَرِيدِ»"
          source: "المعجم الكبير (مجمع اللغة العربية بالقاهرة)"
          conflict: "شعوذي في المعجم لا يُحيل إلى لاعب الخفة بل إلى البريدي والرسول؛ المصطلح مستعمَل في معنى مغاير كلياً لا صلة له بالمجموعة"

    - lemma: "خَفِيفُ الْيَدِ"
      evidence_status: "no_material_found"

    - lemma: "مُمَوِّه"
      contradicts:
        - text: "«المطلى بِذَهَب أَو فضَّة وَلَيْسَ جوهره مِنْهُمَا، والملبس بِالْبَاطِلِ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          conflict: "مموّه في أصله الراسخ يصف الأشياء المطلية أو المُزيَّنة بما يخفي حقيقتها لا الأشخاص المؤدين، ولا يُستعمل مصطلحاً لفنّان الترفيه"
        - text: "«المموّه: [في الانكليزية] Plated, disguised»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "يُثبت أن المموّه يُترجَم بـ Plated أو disguised لا بـ magician أو performer"


stage3_analysis:
  per_lemma:
    - lemma: "ساحر"
      decision: confirmed
      decision_reason: >-
        مستعمَل في المعاجم العربية الحديثة مقابلاً صريحاً لـ magician وconjurer،
        وإن كان يحمل دلالة دينية أوسع تشمل السحر الحقيقي؛ السياق الترفيهي يُقيّد
        المعنى، وهو معروف عند عموم المتكلمين بهذه الدلالة الترفيهية
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُحيل في الأصل إلى صاحب القدرات الخارقة أو السحرية؛ وفي سياق الترفيه يُشير
        إلى المؤدّي بوصفه العام الجامع مع إيحاء بالتدهيش والإبهار، دون تخصيص في
        تقنية الأداء (لا يُميّز بين خفة اليد والإيهام البصري)
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سَاحِر"

    - lemma: "لاعب خفة"
      decision: confirmed
      decision_reason: >-
        تعبير مُركَّب إضافي راسخ في العربية المعاصرة يصف من يمتهن خفة اليد؛ يُقابل
        prestidigitator بدقة، ومكوّناه موثَّقان معجمياً. يمر اختبار التثبيت لأنه
        وحدة اصطلاحية ثابتة لا يقال «مُسرِع الحركة» بدلاً منه بنفس الوظيفة المصطلحية
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        يُركّز تحديداً على الأداء الجسدي اليدوي وخفة الأصابع (sleight of hand /
        prestidigitation)، بعيداً عن الإيهام البصري الواسع أو القدرات السحرية
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لاعِبُ خِفَّةٍ"

    - lemma: "مخادع بصري"
      decision: confirmed
      decision_reason: >-
        تعبير مُركَّب وصفي يُخصّص دلالة illusionist في العربية؛ المورد الحديث يُثبت
        «المخادع» مقابلاً صريحاً لـ illusionist، وإضافة «بصري» تُميّزه عن الخادع
        العام وتُحدّد مجال التضليل بحاسة الرؤية؛ التعبير شفاف ومنتج قياساً على
        التركيب الوصفي العربي
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >-
        يتخصص في صنع الأوهام البصرية المسرحية مستغلاً قصور الإدراك البشري (illusionist)،
        ويختلف عن لاعب الخفة في أنه لا يعتمد الخفة اليدوية بالضرورة بل يبني على
        الإيهام الكلي للحواس
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُخَادِع بَصَرِيّ"

    - lemma: "مُشَعْوِذ"
      source: stage1
      decision: confirmed
      decision_reason: >-
        الأكثر توثيقاً في المعاجم العربية المعاصرة لهذا المفهوم؛ تُجمع عليه المصادر
        مقابلاً لـ magician وconjurer وprestidigitator، وجذره شعذ يُحيل في مقاييس
        اللغة مباشرةً إلى «خفّة في اليدين وأُخذة كالسحر»؛ غيابه عن المجموعة يُشكّل
        فجوة معجمية واضحة تستوجب الإضافة
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        المصطلح الأشمل والأكثر تخصصاً لهذا المفهوم في العربية؛ يجمع بين إراءة الشيء
        على خلاف حقيقته وخداع الحواس باحتراف، ويُقابل المفهوم الكامل للمجموعة دون
        تقييد بتقنية بعينها
      actions:
        - command: create_entry
          params:
            lemma: "مُشَعْوِذ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "شَعْوَذِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        الاستعمال المعجمي الموثَّق لشعوذي هو «رسول الأمراء في مهماتهم على البريد»
        أي البريدي والرسول، لا لاعب الخفة؛ المصطلح في معنى مغاير كلياً ويُشكّل
        استخدامه هنا تلبيساً خطيراً

    - lemma: "خَفِيفُ الْيَدِ"
      source: stage1
      decision: removed
      decision_reason: >-
        يفشل اختبار التثبيت المعجمي: يمكن إبداله بـ«رشيق اليد» أو «سريع اليد»
        ويبقى وصفاً حراً صحيحاً، فليس مصطلحاً مسكوكاً؛ فضلاً عن أنه يُكرّر دلالة
        «لاعب خفة» الموجودة بالفعل

    - lemma: "مُمَوِّه"
      source: stage1
      decision: removed
      decision_reason: >-
        مموّه في الاستعمال المعجمي يصف الأشياء المطلية أو المُزيَّنة بما يخفي حقيقتها
        لا الأشخاص المؤدين؛ دلالته عن الخداع عامة ومادية ولا تختص بفن الترفيه
        والشعوذة الاحترافية


stage4_content:
  definition:
    current: "شخص يقوم بألعاب سحرية لإمتاع الجمهور"
    assessment:
      decision: revise
      reason: >-
        عبارة «ألعاب سحرية» مُلتبسة بين السحر الحقيقي والأداء الترفيهي؛ التعريف
        لا يُميّز الدلالة الفنية (اعتماد خداع الحواس) عن الدلالة الدينية، ويفتقر
        إلى الجنس القريب الدقيق (فنان مؤدٍّ) والفصل النوعي الكافي
    authored:
      - type: terminological
        text: >-
          فنانٌ مؤدٍّ يُبهِر الجمهورَ بألعاب الشَّعوذة وخِفَّة اليد، مُوهِماً إياهم
          برؤية أشياء على خلاف حقيقتها اعتماداً على سرعة الحركة وخداع الحواس، لا على
          فعلٍ خارق حقيقي
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >-
          فنانٌ استعراضي يُقدِّم أمام الجمهور عروضاً تُوهِم المشاهدين بمشاهدة أحداث
          خارقة كالتلاشي والظهور وتحويل الأشياء، لا يعتمد قدرات حقيقية بل على مهارة
          الأصابع وسرعة الحركة وتقنيات التشتيت الذهني وخداع الحواس؛ وقد عُرفت هذه
          الحرفة قديماً بـ«علم الشعبذة»: «علم مبني على المخيّلة لسرعة فعل صناعها
          برؤية الشيء على خلاف ما هو عليه» (أبجد العلوم)
