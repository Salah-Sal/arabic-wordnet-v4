# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة الترادفية تخص علَماً شخصياً (اسم شخص بعينه) وليس مصطلحاً لغوياً اشتقاقياً، مما يجعل منهجيات الاشتقاق والمجاز غير قابلة للتطبيق؛ جميع اللمّات الممكنة تنتمي حصراً إلى التعريب (taarib)"
      - "التصنيف الصرفي للمجموعة مُثبَّت على (n) بينما الصواب الأدق في قاعدة بيانات المداخل هو (proper_noun) لأن اللمّات أعلام شخصية"
      - "التعريف الحالي صياغة وصفية موازية للإنجليزي ينقصها المصطلح العربي الموحد لآلة اللينوتيب وهو (المنضِّدة السَّطرية) الثابت في المعاجم التقنية العربية"
      - "اللمّتان الموجودتان تفتقران إلى التشكيل الكامل"
    observations: >
      هذه المجموعة الترادفية تمثّل علَم شخص بعينه — المخترع الأمريكي من أصل ألماني أُوتُمَار
      مِيرغِنتَالِر (1854-1899)، صاحب اختراع آلة اللينوتيب (المنضِّدة السَّطرية) للتنضيد
      الطباعي. الأعلام الشخصية في الشبكة الدلالية تأخذ عادةً الاسم الكامل المُعرَّب والاسم
      الأخير وحده. لا تنطبق المنهجية الاشتقاقية المعتادة هنا إذ المطلوب تعريب الاسم الأجنبي
      لا توليد مصطلح. التحديات الرئيسية: اختيار التعريب الأمثل بين مدرسة التاء (ت) ومدرسة
      الثاء (ث) لصوت th الألماني في Mergenthaler، وتقنين شكل الكتابة المُشكَّل. مجريات
      البحث في قاعدة البيانات لم تُسفر عن أي مدخل لاسم ميرغنتالر، لكنها أثبتت توثيق آلة
      اللينوتيب في معجم اللغة العربية المعاصرة والمعجم الموحد للمصطلحات المهنية.

  blind_candidates:
    - lemma: "أُوتُمَار مِيرغِنتَالِر"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل Ottmar Mergenthaler وفق التقليد التعريبي الشائع الذي يستعمل
        التاء (ت) لصوت th الألماني /t/ (لا الإنجليزي /θ/): أُوتُمَار لـ Ottmar،
        ومِيرغِنتَالِر لـ Mergenthaler. الصوت الألماني th نطقه /t/ صريح، فالتاء أدق صوتياً
        من الثاء في هذا السياق.
    - lemma: "مِيرغِنتَالِر"
      generation_method: taarib
      justification: >
        تعريب اسم العائلة Mergenthaler منفرداً؛ الصيغة المختصرة المستعملة في الإحالات
        العلمية والتاريخية التي تأتي بعد ذكر الاسم الكامل. ضروري كلمّة مستقلة لأن كثيراً
        من المصادر تكتفي باسم العائلة في الإحالة.
    - lemma: "أُوتُمَار مِيرغِنثَالِر"
      generation_method: taarib
      justification: >
        صيغة بديلة تستعمل الثاء (ث) لصوت th وفق المدرسة التعريبية المعتمدة في بعض
        الدوريات العربية التي تتابع الأصل الإملائي الإنجليزي بدلاً من الأصل الصوتي الألماني؛
        تُعرِّب Mergenthaler كـ مِيرغِنثَالِر.
    - lemma: "مِيرغِنثَالِر"
      generation_method: taarib
      justification: >
        الصيغة المختصرة المقابلة للمرشح الثالث (اسم العائلة بالثاء)، توفر التوثيق لكلا
        النهجين التعريبيين في صيغتيهما المختصرة.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# ملاحظة منهجية: نُفِّذ ما مجموعه 4 استعلامات:
# (١) مطابقة دفعية لجميع اللمّات + المرشحين (٠ نتيجة — الأعلام غير مُدرجة في القواميس)
# (٢) جسر إنجليزي لـ Mergenthaler + Linotype (نتائج لآلة اللينوتيب فقط)
# (٣) FTS عربي لـ لينوتيب + ميرغنتالر (نتائج لآلة اللينوتيب فقط)
# (٤) مقاييس اللغة لجذر خرع (للإثراء)
stage2_evidence:
  per_lemma:
    - lemma: "أوتمار ميرغنتالر"
      evidence_status: "no_material_found"
    - lemma: "ميرغنتالر"
      evidence_status: "no_material_found"
    - lemma: "أُوتُمَار مِيرغِنتَالِر"
      evidence_status: "no_material_found"
    - lemma: "مِيرغِنتَالِر"
      evidence_status: "no_material_found"
    - lemma: "أُوتُمَار مِيرغِنثَالِر"
      evidence_status: "no_material_found"
    - lemma: "مِيرغِنثَالِر"
      evidence_status: "no_material_found"

  # ── أدلة سياقية على المخترَع (آلة اللينوتيب) — للاستعانة بها في المرحلة ٤ ──
  contextual_findings:
    - text: "«لينوتيب [مفرد]: آلة لِصَفِّ أحرف الطِّباعة بسكبها أسطرًا كاملة، لها ملامس الآلة الكاتبة، تسقط قوالب نحاسيّة حفرت فيها الأحرف فإذا تمّ السطر عَبّأت مضخَّةٌ آليَّة فراغاته معدنًا مصهورًا وصار جاهزًا للطبع»"
      source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      relevance: "يثبت المصطلح العربي (اللينوتيب) ويوفر وصفاً دقيقاً للآلة المخترَعة"
    - text: "«منضدة مطوية: آلة لجمع المحارف الطباعية وصبّها»"
      source: "المعجم الموحد للمصطلحات المهنية والتقنية ج. 1: طباعة - كهرباء (1996)"
      relevance: "يثبت المصطلح العربي الموحد للآلة: (منضدة مطوية) أو (المنضِّدة السَّطرية)"
    - text: "«(1) اللّينوتيب؛ المنضِّدة السَّطرية: ماكينة لسَبْك الأحرف المطبعية وتنضيدها في سطور كاملة (2) السطور المنضَّدة باللّينوتيب»"
      source: "المورد الحديث (2008)"
      relevance: "يؤكد المصطلح المزدوج (اللينوتيب / المنضِّدة السَّطرية)"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "أوتمار ميرغنتالر"
      decision: confirmed
      decision_reason: >
        الاسم الكامل للشخص المقصود هو المدخل الرئيسي الإلزامي للمجموعة؛ وإن لم يرد في
        القواميس العربية إذ الأعلام الأجنبية نادراً ما تُدرَج. الصيغة التعريبية بالتاء
        أدق صوتياً لأن الـ th في الألمانية نطقها /t/ لا /θ/. يحتاج تشكيلاً كاملاً:
        أُوتُمَار مِيرغِنتَالِر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: "الاسم الكامل الرسمي (الاسم الشخصي واسم العائلة معاً)، يُستخدَم عند الذكر الأول وفي السياقات الرسمية والببليوغرافية"
      loan_check:
        type: taarib
        verdict: "تعريب مقبول، الصوت th الألماني = /t/، فالتاء أصحّ من الثاء"
      morphological_fit: "اسم علم أعجمي مُعرَّب، لا يخضع لأوزان الصرف العربي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُوتُمَار مِيرغِنتَالِر"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    - lemma: "ميرغنتالر"
      decision: confirmed
      decision_reason: >
        اسم العائلة وحده لمّةٌ مشروعة في الشبكة الدلالية لأن المصادر العلمية والتاريخية
        كثيراً ما تحيل إلى الشخص باسم عائلته فقط بعد الذكر الأول. يحتاج تشكيلاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اسم العائلة المنفرد للإحالة المختصرة اللاحقة في النصوص العلمية والتاريخية"
      loan_check:
        type: taarib
        verdict: "تعريب مقبول"
      morphological_fit: "اسم علم أعجمي مُعرَّب بالتاء، متسق مع النطق الألماني"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيرغِنتَالِر"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشحات المرحلة ١ ──
    - lemma: "أُوتُمَار مِيرغِنتَالِر"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة (أوتمار ميرغنتالر) بعد إضافة التشكيل؛ لا حاجة لإنشاء
        مدخل مستقل. التشكيل المقترح هو المطلوب في إجراء update_lemma للمّة الأصلية.

    - lemma: "مِيرغِنتَالِر"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة (ميرغنتالر) بعد إضافة التشكيل؛ لا حاجة لإنشاء مدخل مستقل.

    - lemma: "أُوتُمَار مِيرغِنثَالِر"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة بالثاء غير مرجّحة لأن الصوت th في Mergenthaler هو الألماني /t/ لا /θ/؛
        تفضيل التاء أدق صوتياً. لا يُنشأ مدخل بديل حتى لا يُخلط بين تعريبين.

    - lemma: "مِيرغِنثَالِر"
      source: stage1
      decision: removed
      decision_reason: >
        الصيغة المختصرة بالثاء مردودة للسبب نفسه — التاء أصح من الثاء للصوت الألماني.
        الإبقاء على ميرغنتالر (بالتاء) يُجنّب التعدد التعريبي المُلبِّس.


