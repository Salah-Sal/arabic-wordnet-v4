# مراجعة المجموعة الترادفية — Synset Review
# ID: awn4-89248494-n
# المفهوم: الأنثى من المزارعين
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة 'مزارعة' خالية من التشكيل — تلتبس بـ'المُزَارَعَة' (مصدر مفاعلة = عقد المحاصصة الزراعية) في جميع المعاجم الكلاسيكية والحديثة"
      - "المجموعة تحتوي على لمّة واحدة فقط رغم وجود مرادفات موثّقة (فلاحة)"
      - "التعريف 'شخص أنثى تدير مزرعة' صياغته ركيكة — 'شخص أنثى' تعبير غير مألوف في العربية الفصحى"
      - "العلاقة بالأب المباشر (فلاح/مزارع) قائمة على التأنيث فقط، وهو ما يستدعي التحقق من ملاءمة التمييز الجنسي كمجموعة منفردة"
    observations: >
      المجموعة تُمثّل الأنثى من المزارعين — وهو مفهوم له جذور في العربية. الإشكالية الكبرى أن
      الصيغة الصرفية 'مُزَارَعَة' (مصدر باب المفاعلة) راسخة في المعاجم لتعني عقد المزارعة الفقهي،
      في حين أن 'مُزَارِعَة' (اسم فاعل مؤنث من زارَعَ) هي الصيغة المقصودة هنا، وهي موثّقة في
      المورد الحديث (2008) صراحةً بمعنى "female farmer". غياب التشكيل في اللمّة يُخفي هذا الفرق.
      الأنثى من الفلاح تُسمّى أيضاً 'فلاحة' وهي موثّقة في موسوعة أسماء العرب.

  blind_candidates:
    - lemma: "فَلَّاحَة"
      generation_method: ishtiqaq
      justification: "وزن فَعَّالَة من جذر (ف ل ح)، تأنيث فَلَّاح؛ يدل على امرأة تحترف الزراعة وتعمل في الأرض — الوزن يُفيد الاحتراف والمداومة، وهو الأنسب للدلالة على الشخص المحترف."

    - lemma: "زَارِعَة"
      generation_method: ishtiqaq
      justification: "اسم فاعل مؤنث من الفعل زَرَعَ (ثلاثي)، وزن فَاعِلَة؛ تعني من تقوم بالزراعة من النساء. اشتقاق طبيعي من الجذر المحوري (ز ر ع) على وزن المضارع الفاعل."

    - lemma: "حَرَّاثَة"
      generation_method: ishtiqaq
      justification: "وزن فَعَّالَة من جذر (ح ر ث)، تأنيث حَرَّاث؛ تدل على امرأة تحرث الأرض وتزرعها احترافاً. الحرث في العربية يُستعمل مجازاً لعموم العمل الزراعي."

    - lemma: "رَبَّةُ الضَّيْعَة"
      generation_method: tarkib
      justification: "مركب إضافي: رَبَّة (مؤنث رَبّ) + الضَّيْعَة (المزرعة/الأرض الزراعية)؛ يدل على مَن تملك المزرعة وتُديرها. يُركّز على بُعد الإدارة والملكية الوارد في التعريف 'تدير مزرعة'."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "مزارعة"
      confirm:
        - text: "«المُزارِعة أو العاملة في مزرعة.»"
          source: "المورد الحديث (2008) — بالتشكيل المُزَارِعَة بكسر الراء، مقابل farmerette"
      contradicts:
        - text: "«طريقة لاستغلال الأراضي الزراعية باشتراك المالك والزارع في الاستغلال، ويقسم الناتج بينهما بنسبة يعيَّنها العقدُ أو العُرْف»"
          source: "المعجم الوسيط (OCR)"
          conflict: "هذا تعريف مُزَارَعَة (مصدر = عقد المحاصصة) لا اسم فاعل مؤنث؛ والشكل بدون تشكيل يلتبس بالمصدر المانع"
        - text: "«المعامَلَةُ على الأرض ببعض ما يخرُجُ منها، ويكون البَذْرُ من مالِكها، وهى طريقةٌ لاستغلال الأراضى الزراعيةِ»"
          source: "المعجم الكبير (OCR)"
          conflict: "تعريف المصدر (عقد المحاصصة) لا وصف الشخص"
        - text: "«عقد على الزرع ببعض الخارج ببعض يعني معاقدة دفع الأرض إلى من يزرعها على أن الغلَّة بينهما على من شَرَطَا»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "مصطلح فقهي ثابت لعقد المحاصصة — يناقض استعمال اللفظ للشخص"
        - text: "«sharecropping»"
          source: "المعجم الموحد لمصطلحات القانون (2017) — ARABTERM"
          conflict: "المقابل الإنجليزي 'sharecropping' يؤكد دلالة العقد لا الشخص"
      expands:
        - text: "«مزارعة — تسليم الأَرْض إِلَى غير ليعْمَل عَلَيْهَا بِشَرْط جُزْء لم يخرج»"
          source: "معجم مقاليد العلوم للسيوطي (ت 1505)"
          addition: "توثيق أقدم للمصطلح الفقهي بالمعنى نفسه (المحاصصة)، مما يرسّخ هذا المعنى تاريخياً"

    # ── مرشح المرحلة ١: فلاحة ──
    - lemma: "فَلَّاحَة"
      confirm:
        - text: "«فَلَاحة: من (ف ل ح) مؤنث فَلَاح»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«سُمِّيَ الأَكَّارُ فَلَّاحًا»"
          source: "مقاييس اللغة لابن فارس (جذر فلح)"
          addition: "يثبت أن الفلاح هو العامل في الأرض (الأكّار)، فالتأنيث فلاحة يصح قياساً"
      expands:
        - text: "«الفَلَّاح: محترف الفلاحة»"
          source: "المعجم الوسيط"
          addition: "الفلاحة بوزن فعّالة تدل على الاحتراف والمداومة، مما يميزها عن مجرد 'من تزرع'"

    # ── مرشح المرحلة ١: زارعة ──
    - lemma: "زَارِعَة"
      contradicts:
        - text: "«زارعة الألغام: سفينة لزرع الألغام تحت الماء»"
          source: "المورد الحديث (2008)"
          conflict: "الاستعمال الوثيق لـ'زارعة' في العربية المعاصرة يخصّ السفينة الحربية لا المرأة الزارعة"

    # ── مرشح المرحلة ١: حراثة ──
    - lemma: "حَرَّاثَة"
      contradicts:
        - text: "«(الحراثة) حِرْفَة الحراث»"
          source: "المعجم الوسيط (Hawramani)"
          conflict: "حراثة في المعاجم مصدر للحرفة/النشاط لا اسم لشخص؛ الوزن فَعَّالَة هنا مصدر لا اسم فاعل"
        - text: "«الحِرَاثَة: حرفة الحراث»"
          source: "المعجم الوسيط (OCR)"
          conflict: "المعجم الوسيط يثبت الحراثة (المصدر) لا الحراثة (اسم شخص)"

    # ── مرشح المرحلة ١: ربة الضيعة ──
    - lemma: "رَبَّةُ الضَّيْعَة"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّة الموجودة ──
    - lemma: "مزارعة"
      decision: confirmed
      decision_reason: >
        اللمّة صحيحة بشرط تشكيلها الصحيح 'مُزَارِعَة' (بكسر الراء — اسم فاعل مؤنث من زارَعَ)؛
        المورد الحديث يُثبتها صراحةً مقابل "farmerette" بمعنى المزارعة الأنثى. غير أن غياب
        التشكيل يُشكّل خطراً تقنياً إذ يُلبّسها بـ'مُزَارَعَة' (بفتح الراء — المصدر = عقد
        المحاصصة) الراسخ في المعاجم الكلاسيكية والفقهية. يجب تحديث اللمّة بتشكيل كامل.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      morphological_check: >
        وزن مُفَاعِلَة (بكسر عين المضارع) = اسم فاعل مؤنث من الفعل زارَعَ؛ قياسي من بنية
        مُزَارِع (اسم فاعل مذكر الوارد في معاجم متعددة بمعنى farmer). التأنيث بتاء التأنيث
        صحيح صرفياً.
      loan_check:
        lexical_borrowing: "مشتق عربي خالص من جذر (ز ر ع)"
        blind_translation: "لا يوجد — المصطلح عربي أصيل"
        calque: "لا يوجد"
      nuance_differentiation: >
        مُزَارِعَة تُستخدم في السياق الرسمي والإداري المعاصر؛ تحمل دلالة الإشراف على
        المزرعة وإدارتها (موازية لـ مُزَارِع بالمذكر). تتميز عن 'فَلَّاحَة' بأن الأخيرة
        تُحيل إلى العمل الزراعي المباشر والتقليدي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُزَارِعَة"

    # ── مرشح المرحلة ١: فلاحة — مقبول ──
    - lemma: "فَلَّاحَة"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثّقة في موسوعة السلطان قابوس صراحةً كـ"مؤنث فَلَاح"، وابن فارس يُثبت أن
        الفلاح هو العامل المحترف في الأرض (الأكّار). الوزن فَعَّالَة مناسب للشخص
        المحترف. اجتازت اختبار التثبيت المعجمي. تُضيف بُعداً دلالياً مختلفاً
        عن 'مُزَارِعَة' (التراثية/الشعبية في مقابل الرسمية).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      morphological_check: >
        وزن فَعَّالَة من جذر (ف ل ح)؛ التاء للتأنيث الدال على المؤنث من صاحب المهنة.
        مطّرد قياساً: فَلَّاح/فَلَّاحَة — بقّال/بقّالة — نجّار/نجّارة.
      nuance_differentiation: >
        فَلَّاحَة تحمل دلالة العمل الزراعي اليدوي المباشر والمُصاحبة للأرض تقليدياً؛
        تُستخدم في السياق الشعبي والأدبي والتراثي أكثر من السياق الإداري الرسمي.
        تتميز عن 'مُزَارِعَة' بأن الأخيرة تُركّز على الإدارة والإشراف.
      actions:
        - command: create_entry
          params:
            lemma: "فَلَّاحَة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    # ── مرشح المرحلة ١: زارعة — مرفوض ──
    - lemma: "زَارِعَة"
      source: stage1
      decision: removed
      decision_reason: >
        الاستعمال الراسخ لـ'زارعة' في المعاجم المعاصرة (المورد الحديث) يخصّ 'زارعة الألغام'
        (minelayer) — مركب اصطلاحي ثابت. استعمال 'زارعة' منفردةً بمعنى المرأة الزارعة
        غير موثّق معجمياً ويُفضي إلى لبس مع المصطلح العسكري.

    # ── مرشح المرحلة ١: حراثة — مرفوض ──
    - lemma: "حَرَّاثَة"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الوسيط والكبير تُثبت 'الحراثة' مصدراً لحرفة الحرث لا اسماً لشخص؛
        وزن فَعَّالَة هنا محجوب بالمعنى المصدري الراسخ، مما يُضعف قبوله اسماً للمرأة
        الزارعة. فضلاً عن أن الحرث جزء من الزراعة لا مرادف لإدارة المزرعة.

    # ── مرشح المرحلة ١: ربة الضيعة — مرفوض ──
    - lemma: "رَبَّةُ الضَّيْعَة"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي لهذا التركيب كوحدة اصطلاحية ثابتة. فشل اختبار
        التثبيت المعجمي: يمكن إبدال 'الضيعة' بـ'المزرعة' أو 'الحقل' دون أن يتغير
        المعنى، مما يثبت أنه وصف حر لا مصطلح مسكوك.


