    assessment:
      decision: revise
      reason: >
        التعريف الحالي يؤدي المعنى الأساسي لكن يعاني من ثلاث مشكلات: (أ) صيغة الفعل "ولدت"
        أسلوب إخباري غير مناسب لتعريف المعجم الموسوعي، (ب) تعبير "باستخدامها" مصدر مضاف
        يُفضي إلى ثقل الصياغة، (ج) التعريف لا يذكر جنسيتها صراحةً بوصفها وصفاً دقيقاً
        ولا يشير إلى مكانتها الريادية في عالم الأزياء الرفيعة.
