# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id: awn4-11304014-n  |  ili: i96826  |  pos: n
# مصممة الأزياء إلسا سكياباريلي
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان ('إلسا سكياباريلي' و'سكياباريلي') خاليتان من التشكيل الكامل، وهو إلزامي لكل لمّة مؤكدة."
      - "هذه مجموعة لاسم علَم (اسم شخص بعينه)، وطبيعة الأسماء الأعلام المعرَّبة لا تقبل اشتقاقاً ولا مجازاً، مما يجعل التعريب (taarib) الأسلوبَ الوحيد المتاح لتوليد المرشحين."
      - "التعريف الحالي صياغته صحيحة لكنه يفتقر إلى الطابع الموسوعي الكافي لشخصية تاريخية بهذا الحجم."
    observations: >
      المجموعة awn4-11304014-n تمثّل علَماً شخصياً لمصممة أزياء إيطالية من القرن العشرين.
      اللمّتان الموجودتان هما الاسم الثنائي الكامل (إلسا سكياباريلي) والاسم العائلي المختصر (سكياباريلي)،
      وكلتاهما تعريب لاسم أجنبي بأصل إيطالي. لا يوجد في الموروث العربي ما يقابل هذا الاسم، ولا يُتوقع
      وجود جذر عربي أو وزن صرفي ينتج عنه. المراجعة اللغوية هنا تنصبّ على صحة التعريب وسلامة التشكيل
      وجودة التعريف الموسوعي.

  # التوليد الأعمى — قُرئ الملف المُقنَّع قبل الاطلاع على اللمّات
  blind_candidates:
    - lemma: "سْكِيَابَارِيلِّي"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم العائلي الإيطالي "Schiaparelli"، المقطع "Schi-" يُعرَّب بـ"سكي" لأن
        الصوت [sk] يُمثَّل بـ(س+ك) لا بالشين، ثم "-aparelli" تُكتب "آباريللي/ياباريلي".
        هذه الصيغة المختصرة هي الأشهر في المصادر العربية والأجنبية المترجَمة.
    - lemma: "إِلْسَا سْكِيَابَارِيلِّي"
      generation_method: taarib
      justification: >
        تعريب الاسم الثنائي الكامل (الاسم الشخصي Elsa + الاسم العائلي Schiaparelli).
        "Elsa" تُعرَّب قياساً بـ"إِلْسَا" (إ+ل+س+ا) وهو الرسم المستقر في المصادر العربية.
        هذا هو الاسم الرسمي الأكثر توثيقاً في المراجع الأكاديمية.
    - lemma: "شِيَابَارِيلِّي"
      generation_method: taarib
      justification: >
        تعريب بديل للاسم مع اعتبار أن بعض المعرِّبين يستخدمون الشين لتمثيل مقطع "Schi-"
        على وزن "شي". هذا الخيار مطروح للفحص وإن كان أقل دقة صوتياً.
    - lemma: "إِلْسَا شِيَابَارِيلِّي"
      generation_method: taarib
      justification: >
        الاسم الثنائي الكامل بالصيغة البديلة (شياباريلي بدل سكياباريلي). مطروح للمقارنة
        مع الصيغة بالسين، للفصل بين الرسمين في مرحلة التحليل.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
stage2_evidence:
  # ملاحظة منهجية: نُفِّذت ٣ استعلامات:
  # (١) مطابقة دقيقة دفعية لجميع اللمّات والمرشحات (نتيجة: لا توجد إدخالات)
  # (٢) جسر إنجليزي: "Schiaparelli" / "Elsa Schiaparelli" / "fashion designer"
  #     (نتيجة: وُجد "fashion designer" لكن لا ذِكر للاسم الشخصي)
  # (٣) بحث FTS بكلمات مفتاحية: مصمم / أزياء / مواد اصطناعية
  #     (نتيجة: لا صلة بالشخصية المحددة)

  per_lemma:
    - lemma: "إلسا سكياباريلي"
      evidence_status: "no_material_found"

    - lemma: "سكياباريلي"
      evidence_status: "no_material_found"

    - lemma: "سْكِيَابَارِيلِّي"
      evidence_status: "no_material_found"

    - lemma: "إِلْسَا سْكِيَابَارِيلِّي"
      evidence_status: "no_material_found"

    - lemma: "شِيَابَارِيلِّي"
      evidence_status: "no_material_found"

    - lemma: "إِلْسَا شِيَابَارِيلِّي"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "إلسا سكياباريلي"
      decision: confirmed
      decision_reason: >
        الاسم الثنائي الكامل للشخصية التاريخية (Elsa Schiaparelli). لا بديل عنه لأن الأعلام
        الشخصية تتعيَّن بذاتها ولا يُستغنى عن الاسم الكامل في السياقات الموسوعية والأكاديمية.
        التعريب صحيح صوتياً: "Elsa" → إِلْسَا، "Schiaparelli" → سْكِيَابَارِيلِّي.
        الإجراء المطلوب: إضافة التشكيل الكامل الغائب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الرسمية الكاملة (اسم شخصي + اسم عائلة)؛ تُستخدم في السياقات الأكاديمية
        والموسوعية والرسمية عند الإشارة الأولى إلى الشخصية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "إِلْسَا سْكِيَابَارِيلِّي"

    - lemma: "سكياباريلي"
      decision: confirmed
      decision_reason: >
        الاسم العائلي المختصر (Schiaparelli)، وهو الصيغة الأكثر شيوعاً في المصادر الصحفية
        والنقدية بعد التعريف الأول بالاسم الكامل. التعريب صحيح صوتياً.
        الإجراء المطلوب: إضافة التشكيل الكامل الغائب.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم العائلي المختصر؛ يُستخدم في السياق غير الرسمي وبعد ذِكر الاسم الكامل مرةً واحدة،
        ويُشير إلى دار الأزياء التي تحمل الاسم ذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سْكِيَابَارِيلِّي"

    # ── مرشحات المرحلة ١ ──

    - lemma: "سْكِيَابَارِيلِّي"
      source: stage1
      decision: removed
      decision_reason: >
        هذه اللمّة المرشحة مطابقة في جوهرها للمّة الموجودة "سكياباريلي" — الفارق
        تشكيلي فحسب. تمت معالجة التشكيل ضمن إجراء update_lemma على اللمّة الموجودة.
        لا حاجة لإنشاء مدخل جديد.

    - lemma: "إِلْسَا سْكِيَابَارِيلِّي"
      source: stage1
      decision: removed
      decision_reason: >
        مطابقة في جوهرها للمّة الموجودة "إلسا سكياباريلي". تمت معالجة التشكيل
        ضمن إجراء update_lemma على اللمّة الموجودة.

    - lemma: "شِيَابَارِيلِّي"
      source: stage1
      decision: removed
      decision_reason: >
        تعريب غير دقيق: الشين تمثّل الصوت [ʃ] بينما مقطع "Schi-" في الإيطالية يُنطق [ski]،
        وهو ما تمثّله السين+الكاف (سكي) لا الشين. الرسم بالشين يُشير الموضوعياً إلى نطق
        مغاير. لا يعكس الاستخدام العربي المستقر في المصادر الموثوقة.

    - lemma: "إِلْسَا شِيَابَارِيلِّي"
      source: stage1
      decision: removed
      decision_reason: >
        يرث علّة الصيغة السابقة (شِيَابَارِيلِّي): الشين لا تمثّل الصوت الإيطالي [sk]
        بدقة. مرفوض لذات السبب.


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
