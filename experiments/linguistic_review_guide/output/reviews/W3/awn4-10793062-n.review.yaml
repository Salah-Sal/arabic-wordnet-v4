# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  # التوليد الأعمى — قرأت الملف المُقنَّع أولاً (لا لمّات مرئية)
  # التعريف المتاح فقط: "رياضي يرفع الأثقال"
  blind_candidates:
    - lemma: "ثَقَّال"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من الجذر (ث ق ل) يدل على الاحتراف والمداومة، قياساً على
        حَمَّال (من يحمل) ونَجَّار وبَقَّال. يشير إلى من يتعامل مع الأثقال
        بصفة احترافية دائمة.

    - lemma: "مُثَاقِل"
      generation_method: ishtiqaq
      justification: >
        وزن مُفَاعِل من الجذر (ث ق ل)، يدل على المزاولة والاشتغال المستمر
        بالثِّقَل. يحمل معنى مَن يلازم الأثقال ويصارعها، مستلهَماً من
        أنماط الاشتقاق العربي للحِرَف والرياضات.

    - lemma: "لَاعِبُ الأَثْقَال"
      generation_method: tarkib
      justification: >
        مركب إضافي من (لاعب) اسم فاعل عام للرياضي + (الأثقال) المضاف إليه
        المحدِّد للتخصص. يقيس على النمط الشائع: لاعب كرة القدم، لاعب
        التنس، لاعب الجودو. النمط الإضافي منتج ومعروف في المصطلح الرياضي
        العربي.

    - lemma: "رِيَاضِيُّ الأَثْقَال"
      generation_method: tarkib
      justification: >
        مركب إضافي من (رياضي) + (الأثقال)، يصف الشخص بالانتساب إلى رياضة
        الأثقال كتخصص. مبني على النمط ذاته: رياضي الجمباز، رياضي
        الملاكمة. يُبرز صفة الانتساب إلى فئة الرياضة أكثر مما يُبرز
        الفعل.

  # التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّة الوحيدة 'رافع أثقال' مركب إضافي يفتقر إلى التشكيل الكامل"
      - "التعريف الحالي 'رياضي يرفع الأثقال' قريب من الصياغة الوصفية لا المعجمية"
      - "غياب أي لمّة مفردة تختزل المفهوم في كلمة واحدة (نمط فَعَّال أو مِفعَال)"
    observations: >
      المجموعة تصف شخصاً بعينه: الرياضي المتخصص في رياضة رفع الأثقال.
      اللمّة الموجودة 'رافع أثقال' مركبٌ إضافي واضح الدلالة، ويطابق
      الاستخدام الرسمي في المورد الحديث الذي يورده مقابلاً لـ"weight lifter".
      التحدي الرئيس هو ضعف التشكيل وأحادية التغطية بلمّة واحدة فقط، فضلاً
      عن تعريف يميل إلى الشرح الوصفي أكثر منه إلى الحد المعجمي الدقيق.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المنفَّذة: ٥ استعلامات
# ١. دفعة headword للمّات الموجودة + المرشحات (مع صيغ ال-)
# ٢. إثراء definitions+examples بـ entry_ids
# ٣. الجسر الإنجليزي: weightlifter, lifter, weight lifter, weight lifting
# ٤. FTS عربي: "رفع الاثقال" OR "رافع الاثقال" OR "الاثقال"
# ٥. مقاييس اللغة للجذرين رفع وثقل (dictionary_id=151)
stage2_evidence:

  per_lemma:

    - lemma: "رافع أثقال"
      confirm:
        - text: >
            «رافع الأثقال (رب).»  [مقابل weight lifter]
          source: "المورد الحديث (2008) — ARABTERM، entry_id: 728604"
        - text: >
            «رافع الأثقال (رب).» [مقابل weight lifting للرياضة ذاتها]
          source: "المورد الحديث (2008) — ARABTERM، entry_id: 728605"

    - lemma: "ثَقَّال"
      contradicts:
        - text: "«الثَّقَّال: الثقيل»"
          source: "المعجم الوسيط — OCR، entry_id: 3302"
          conflict: >
            اللفظ يدل على صفة الثِّقَل (نعت لمن هو بطيء أو ثقيل) لا على
            ممارسة رياضة رفع الأثقال، فهو صفة مذمومة لا لقب رياضي.
        - text: >
            «الثَّقَالُ من الدَّوابِّ: البطيءُ؛ من النِّساء: الرَّزانُ
            المِكْفَالُ أي عَجزاءُ الكَفَل»
          source: "المعجم الكبير — OCR، entry_id: 69475"
          conflict: >
            المعجم الكبير يصرح بأن الثَّقَالَ صفة تعني البطيء/الرزين، وهو
            معنى مغاير تماماً لمفهوم 'رافع الأثقال' الرياضي.

    - lemma: "مُثَاقِل"
      evidence_status: "no_material_found"

    - lemma: "لَاعِبُ الأَثْقَال"
      evidence_status: "no_material_found"

    - lemma: "رِيَاضِيُّ الأَثْقَال"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:

  per_lemma:

    # ── اللمّة الموجودة ──
    - lemma: "رافع أثقال"
      decision: confirmed
      decision_reason: >
        مركب إضافي موثَّق في المورد الحديث (2008) مقابلاً صريحاً لـ"weight
        lifter". الصيغة تحقق مبدأ الاطراد: رَافِع (اسم فاعل من رفع) +
        أثقال (مفعول به / مضاف إليه محدِّد). يتوافق مع النمط المعجمي
        العربي في تسمية أصحاب المهن والرياضات بصيغة الإضافة. يستوفي
        معايير جودة المصطلح من حيث الملاءمة والاشتقاقية وإيثار العربي.
        يحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        اللمّة الوحيدة في المجموعة؛ 'رافع أثقال' يحمل الدلالة الحرفية
        المباشرة (مَن يرفع + الأثقال)، ويجمع بين الوظيفة الرياضية التنافسية
        والتسمية الاصطلاحية المعيارية في السياق الإعلامي والرسمي العربي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "رَافِعُ أَثْقَال"

    # ── مرشحات المرحلة ١ ──
    - lemma: "ثَقَّال"
      source: stage1
      decision: removed
      decision_reason: >
        المعاجم الكلاسيكية والحديثة تُجمع على أن 'الثَّقَّال' صفة تعني
        الثقيل أو البطيء؛ لا يوجد أي توثيق معجمي لاستخدامه بمعنى رافع
        الأثقال الرياضي. كما أن الصيغة تُوهم بالذم لا بالاحتراف. يُرفض.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُثَاقِل"
      source: stage1
      decision: removed
      decision_reason: >
        لا وجود معجمي للفظ بهذه الصيغة بمعنى رياضي الأثقال. وزن مُفَاعِل
        من (ث ق ل) غير مسكوك، والاستخدام الفعلي للجذر في هذا الوزن لم
        يُعثر له على شاهد. يُرفض لعدم الثبوت المعجمي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "لَاعِبُ الأَثْقَال"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثر على توثيق معجمي لهذا المركب كوحدة ثابتة. فضلاً عن ذلك،
        'لاعب' تحمل دلالة أعم (play) وتنصرف عادةً إلى الألعاب الجماعية
        كالكرة، في حين أن 'رافع أثقال' أدق من الناحية الدلالية إذ يُبرز
        الفعل المميِّز للرياضة (الرفع). الترادف مع اللمّة الموجودة
        لا يبرر الإضافة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "رِيَاضِيُّ الأَثْقَال"
      source: stage1
      decision: removed
      decision_reason: >
        لا توثيق معجمي لهذا التركيب. المصطلح أعم من 'رافع أثقال' (يشمل
        المدرِّبين والحكام والمشجعين المنتسبين للرياضة)، فهو لا يخصص
        المفهوم بدقة. اللمّة الموجودة أفضل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:

  definition:
    current: "رياضي يرفع الأثقال"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي وصفي يكاد يكون مرادفاً حرفياً للمّة (رافع = يرفع /
        أثقال = الأثقال)، مما يُوقعه في شبهة الدوران. يفتقر إلى الجنس
        القريب الدقيق (تخصص المنافسة الأولمبية) والفصل النوعي (نوع الأثقال
        والحركات الفنية المحددة). يُستحسن تعريفٌ يُميِّز الرياضي هذا عن
        مجرد من يرفع أثقالاً في حياته اليومية.
    authored:
      - type: terminological
        text: >
          رياضيٌّ يتخصَّصُ في مسابقاتِ رفعِ الأثقالِ وَفْقَ القواعدِ
          الأولمبيةِ المُقنَّنَةِ، مُنافِساً في فئتِهِ الوزنيةِ.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: >
          لاعبٌ في رياضةِ الأثقالِ، يرفعُ قضباناً حديديةً مُثقَّلةً
          بأقراصٍ معدنيةٍ عبرَ حركتَي الخَطفِ والنَّترِ في فئتِهِ
          الوزنيةِ، ويُقاسُ أداؤُهُ بمجموعِ أفضلِ محاولتَينِ ناجحتَينِ.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10793062-n"
          definition_index: 0
          text: "رياضيٌّ يتخصَّصُ في مسابقاتِ رفعِ الأثقالِ وَفْقَ القواعدِ الأولمبيةِ المُقنَّنَةِ، مُنافِساً في فئتِهِ الوزنيةِ."
