# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# المجموعة الترادفية: awn4-11011299-n
# الموضوع: جان لويس شارل غارنييه — معماري فرنسي (1825-1898)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (الأعمى) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمتان الموجودتان تفتقران إلى التشكيل الكامل"
      - "التعريف مختصر جداً — يقتصر على الجنسية وسنوات الميلاد والوفاة دون ذكر أبرز أعمال المعماري"
      - "هذه مجموعة ترادفية لاسم علم فردي (proper noun)؛ والتوليد الأعمى محدود الجدوى فيها، إذ لا يمكن استنتاج اسم الشخص من تعريف عام كـ«معماري فرنسي (1825-1898)» إلا بمعرفة تاريخية مسبقة"
    observations: >
      المجموعة تمثّل اسم علم لشخص تاريخي بعينه — يُرجَّح بقوة أنه جان لويس شارل غارنييه
      (1825-1898)، المعماري الفرنسي الشهير مصمّم دار الأوبرا الكبرى في باريس («الأوبرا غارنييه»
      1875) وكازينو مونتي كارلو. أسماء الأعلام الأجنبية في المعاجم العربية تخضع للتعريب لا
      للاشتقاق أو المجاز؛ لذا فإن أدوات التوليد المعيارية لا تنطبق هنا إلا أسلوب التعريب.
      تجدر الإشارة إلى وجود اسم عربي «غَارِني» في موسوعة السلطان قابوس لأسماء العرب مشتق من
      (غ-ر-ن) بمعنى نسبة إلى «الغَارِن: اليابس من العجين على الإناء»، وهو اسم عربي أصيل لا
      صلة له بالمعماري الفرنسي، لكنه يستدعي الانتباه للتمييز بين الاسمين.

  blind_candidates:
    - lemma: "غَارْنِييَه"
      generation_method: taarib
      justification: >
        اللقب وحده في صيغته المعرَّبة عن الفرنسية Garnier؛ إذ يُعرَّب المعماريون الفرنسيون
        المشهورون في العربية بألقابهم في الغالب، وهذا هو الشكل الأوسع تداولاً في المصادر
        العربية للإشارة إليه وإلى دار الأوبرا التي تحمل اسمه.
    - lemma: "شَارْل غَارْنِييَه"
      generation_method: tarkib
      justification: >
        الاسم الشخصي الأشهر (Charles) مضافاً إلى اللقب؛ تركيب مزجي لاسم علم مركّب من مكوّنين
        فرنسيين معرَّبين، وهو شائع في المصادر العربية المعمارية والتاريخية.
    - lemma: "جَانْ لُويْس شَارْل غَارْنِييَه"
      generation_method: taarib
      justification: >
        الاسم الرسمي الكامل كما يُعرَّب من الفرنسية Jean Louis Charles Garnier؛ يُستخدم في
        السياقات الأكاديمية والمراجع الموسوعية حين تُطلب الدقة التوثيقية القصوى.
    - lemma: "جَارْنِيَه"
      generation_method: taarib
      justification: >
        نسخة تعريب بديلة تستعمل الجيم بدل الغين لتعريب الصوت الفرنسي [ɡ]، شائعة في بعض
        الأقطار العربية (المشرق العربي) وإن كانت نسخة الغين أوسع انتشاراً عند العرب الغربيين.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# ملاحظة على الاستعلامات المُنفَّذة:
# ١. مطابقة دقيقة دفعية: غارنييه، غارنيه، جان لويس شارل غارنييه + صيغ بالـ → لا نتائج
# ٢. الجسر الإنجليزي: "Garnier" OR "Jean Louis Charles Garnier" → لا نتائج
# ٣. FTS عربي: "غارني" OR "جارني" → وجد اسمَيْن عربيَّيْن غير ذات صلة
# ٤. FTS إنجليزي: "architect" OR "French architect" → مصطلحات عامة للعمارة فقط
stage2_evidence:
  per_lemma:
    - lemma: "جان لويس شارل غارنييه"
      evidence_status: "no_material_found"

    - lemma: "غارنييه"
      expands:
        - text: >
            «غَارِني: من (غ ر ن) نسبة إلى الغَارِن: اليابس من العجين على الإناء،
            والضعيف من الرجال.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            وجود اسم عربي أصيل «غَارِني» (بكسر الراء وبدون ياء مدّية زائدة) مشتق من جذر
            (غ-ر-ن) العربي، يُنبّه إلى ضرورة الحفاظ على الرسم الإملائي «غَارْنِييَه» المميَّز
            (بالياء المزدوجة) للتفريق بين الاسم الأجنبي المعرَّب والاسم العربي الأصيل.

    - lemma: "غَارْنِييَه"
      evidence_status: "no_material_found"

    - lemma: "شَارْل غَارْنِييَه"
      evidence_status: "no_material_found"

    - lemma: "جَانْ لُويْس شَارْل غَارْنِييَه"
      evidence_status: "no_material_found"

    - lemma: "جَارْنِيَه"
      expands:
        - text: >
            «جَارِنِيّ: من (ج ر ن) نسبة إلى جَارِن.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: >
            وجود اسم عربي «جَارِنِيّ» (بالجيم والكسر) يشير إلى أن صيغة التعريب بالجيم
            («جَارْنِيَه») قريبة من اسم عربي موجود، مما يُرجّح تفضيل الغين («غَارْنِييَه»)
            لتفادي الالتباس.


# ── المرحلة ٣: التحليل اللغوي للّمات ──────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمات الموجودة ──

    - lemma: "جان لويس شارل غارنييه"
      decision: confirmed
      decision_reason: >
        الاسم الرسمي الكامل للمعماري الفرنسي (Jean Louis Charles Garnier)، صحيح من حيث التعريب
        ويمثّل اللمة المرجعية الرسمية للمجموعة. غياب الأدلة المعجمية طبيعي لأسماء الأعلام
        الأجنبية في المعاجم العربية. الرسم الإملائي سليم ويُميَّز من الاسم العربي المشابه.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الاسم الكامل الرسمي يُستخدم في السياقات الأكاديمية والتاريخية والمراجع الموسوعية؛
        يجمع الاسمين الأولين (جان لويس) مع الاسم الشخصي (شارل) واللقب (غارنييه)، مما يتيح
        التمييز القاطع من أي شخص آخر يحمل لقب غارنييه.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَانْ لُويْس شَارْل غَارْنِييَه"

    - lemma: "غارنييه"
      decision: confirmed
      decision_reason: >
        اللقب المختصر للمعماري وهو الأكثر تداولاً في الخطاب العام والتاريخ المعماري؛ يرتبط
        ارتباطاً وثيقاً بأعماله الكبرى التي تحمل اسمه (الأوبرا غارنييه، فيلا غارنييه). يختلف
        رسمه («غارنييه» بياء مزدوجة) عن الاسم العربي الأصيل «غَارِني» (بياء مفردة وبكسر الراء).
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب وحده يُستخدم في الخطاب العام وحين يكون السياق كافياً لتحديد الهوية، لا سيما
        عند نسبة الأعمال إليه؛ وهو أقصر وأسهل تداولاً من الاسم الكامل.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَارْنِييَه"

    # ── مرشحات المرحلة ١ ──

    - lemma: "غَارْنِييَه"
      source: stage1
      decision: removed
      decision_reason: >
        مكرر — هذا المرشح يطابق اللمة الموجودة «غارنييه» مع إضافة التشكيل فقط، وقد
        تمت معالجتها بأمر update_lemma على اللمة الأصلية.

    - lemma: "شَارْل غَارْنِييَه"
      source: stage1
      decision: removed
      decision_reason: >
        شكل جزئي (الاسم الشخصي شارل + اللقب) يقع بين اللمتين الموجودتين دون أن يضيف
        تمييزاً دلالياً جديداً؛ الاسم الكامل واللقب المنفرد كلاهما يغطيان السياقات التي
        يُستخدم فيها هذا الشكل.

    - lemma: "جَانْ لُويْس شَارْل غَارْنِييَه"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمة الموجودة «جان لويس شارل غارنييه» مع اختلاف بسيط في التشكيل المقترح
        فقط؛ الأصل قد غُطّي بأمر update_lemma على اللمة الأصلية.

    - lemma: "جَارْنِيَه"
      source: stage1
      decision: removed
      decision_reason: >
        النسخة بالجيم أقل شيوعاً من النسخة بالغين لتعريب الصوت الفرنسي [ɡ] في هذا الاسم.
        علاوة على ذلك، تقترب من الاسم العربي «جَارِنِيّ» الوارد في موسوعة السلطان قابوس
        لأسماء العرب (اسم عربي بجذر ج-ر-ن)، مما يزيد احتمال الالتباس.


