# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "قائِد حُقُوق مَدَنِيَّة"
      decision: confirmed
      decision_reason: >
        التركيب الإضافي «قائد حقوق مدنية» وحدة معجمية ثابتة راسخة الاستعمال في الخطاب
        السياسي والإعلامي والحقوقي العربي، ويُقابل مباشرةً المصطلح الإنجليزي civil rights
        leader. مكوّناته موثّقة في المعاجم المتخصصة: «قائد» = القائم على أمر القوم، و«حقوق
        مدنية» مُسجّل في معاجم القانون والفلسفة بالترجمة الإنجليزية civil rights. التعبير
        يجتاز اختبار التثبيت المعجمي كمركب إضافي ثنائي المستوى (قائد + [حقوق + مدنية]).
        يحتاج تصحيح التشكيل: الضمة على قائد، والكسرة المنونة على حقوق ومدنية.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على دور القيادة التنظيمية والرمزية للحركة الحقوقية؛ فهو رأس الحركة ومُوجِّهها
        ومتحدثها الرسمي، ويمتلك سلطة قيادية لا مجرد انخراط ميداني. يقابل civil rights leader
        بالمعنى الضيق للمصطلح.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "قَائِدُ حُقُوقٍ مَدَنِيَّةٍ"

    - lemma: "ناشِط حُقُوقِيّ"
      decision: confirmed
      decision_reason: >
        المركب الوصفي «ناشط حقوقي» وحدة معجمية مستقرة في العربية المعاصرة، يُقابل civil
        rights activist/worker. صحيح أن «الناشط» في المعجم الكلاسيكي يعني ناقض الحبل،
        لكن التوسع الدلالي إلى «المتحرك الفاعل في ميدان ما» مسنود بالجذر (اهتزاز وحركة
        وتفتّح وفق ابن فارس) ويتوافق مع قياس العربية. «الناشط الحقوقي» و«الناشطة الحقوقية»
        شائعان في الصحافة العربية وتقارير منظمات حقوق الإنسان. «حقوقي» موثّق بالمعجم.
        يجتاز اختبار التثبيت: لا يمكن إبدال «حقوقي» بـ«قانوني» وبقاء المعنى ذاته.
        يحتاج تصحيح التشكيل: تنوين الضم على ناشط وعلى حقوقي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        يُركّز على الانخراط الميداني النشط في العمل الحقوقي دون اشتراط مكانة القيادة؛ فهو
        يشمل العاملين في الحركة الحقوقية عموماً (activist/worker) بما فيهم من ليسوا قادة.
        أقل رسمية من «قائد حقوق مدنية» وأكثر انتشاراً في الاستعمال اليومي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "نَاشِطٌ حُقُوقِيٌّ"

    - lemma: "مُنَاضِلٌ حُقُوقِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «مناضل حقوقي» مرادف وظيفي قريب من «ناشط حقوقي» لكنه يحمل دلالة كفاحية أشد حدةً
        وغالباً ما يُستعمل في سياقات المقاومة والصراع السياسي المكثّف والتحرر الوطني.
        إدراجه في هذه المجموعة سيخلق ازدواجاً ترادفياً مع «ناشط حقوقي» دون تمييز دلالي
        كافٍ في سياق حقوق الأقليات المدنية. فضلاً عن أن ترجمته الإنجليزية الأقرب (militant)
        تحمل ظلالاً سياسية مختلفة. لا إجراء مطلوب.

    - lemma: "نَصِيرُ الأَقَلِّيَّاتِ"
      source: stage1
      decision: removed
      decision_reason: >
        «نصير الأقليات» تعبير وصفي مفيد من الناحية الدلالية، لكنه ليس مصطلحاً اصطلاحياً
        ثابتاً في المعاجم المتخصصة ولا في الأدبيات الحقوقية العربية. فضلاً عن أنه يُضيّق
        نطاق الدلالة بالتركيز على «الأقليات» دون سائر عناصر تعريف المجموعة (الحركة
        السياسية وتكافؤ الفرص). كذلك يفشل اختبار السكّ: يمكن إبدال «نصير» بـ«مؤيد» أو
        «حامي» وتبقى العبارة وصفية مقبولة. لا إجراء مطلوب.

    - lemma: "دَاعِيَةُ الحُقُوقِ"
      source: stage1
      decision: removed
      decision_reason: >
        «داعية» في المعجم الوسيط مرتبط بالدعوة الدينية أو الفكرية مما يُضفي ظلالاً
        دينية-إيديولوجية ليست ملائمة للسياق الحقوقي المدني المحايد. كذلك يُركّز التعبير
        على البُعد الدعوي الخطابي فحسب ويُغفل بُعد القيادة التنظيمية والنضال الميداني.
        اختبار الاستبدال: «داعي الحقوق» يمكن أن يُعبّر عن نفس الفكرة → التركيب ليس ثابتاً
        بما يكفي. لا إجراء مطلوب.

    - lemma: "حُقُوقِيٌّ"
      source: stage1
      decision: removed
      decision_reason: >
        «حقوقي» في المعجم يدل على «من درس بكليات الحقوق» أو «من يعطي الحق»، وهو في الاستعمال
        المعاصر صفة تُضاف إلى «ناشط» أو «قائد» ولا تُستعمل اسماً مستقلاً للدلالة على قائد
        حركة حقوقية. إفراده لمّةً مستقلة يخلط بين الصفة والمصطلح، ويُحدث التباساً مع
        معنى «القانوني» أو «رجل القانون». لا إجراء مطلوب.


