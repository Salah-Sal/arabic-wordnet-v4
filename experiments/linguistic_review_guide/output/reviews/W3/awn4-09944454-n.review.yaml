# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "الكلمة المحورية «قائد» في التعريف الحالي تُعيد مكوّنَ اللمّة الأولى ذاتها مما يُفضي إلى دوران جزئي في التعريف"
      - "اللمّة الأولى مركّبة من ثلاث كلمات (قائد + حقوق + مدنية) وتفتقر في النسخة الموجودة إلى تشكيل كامل، لا سيما ضمة القائد وكسرة حقوق"
      - "اللمّة الثانية «ناشِط» تحمل في المعجم الكلاسيكي دلالة تقنية ضيقة (ناقض الحبل ليضفر ثانية) بعيدة عن المعنى الحديث للناشط الحقوقي؛ التوسع الدلالي حادث في العربية المعاصرة لكنه يستحق التوثيق"
      - "اللمّتان الموجودتان تغطيان «القائد» و«الناشط» لكنهما تهملان «العامل» (civil rights worker) الذي هو الدلالة الثالثة في المجموعة الإنجليزية"
      - "تشكيل اللمّة الثانية منقوص: «ناشِط حُقُوقِيّ» يحتاج تشكيلاً كاملاً بما يشمل التنوين"
    observations: >
      المجموعة الترادفية تنتمي إلى حقل دلالي خاص بالحركة الحقوقية السياسية الحديثة،
      وهو مجال تطور فيه المصطلح العربي حديثاً. اللمّتان المدرجتان سليمتان من حيث الاستعمال
      المعاصر وإن كانت جذورهما الكلاسيكية تدور حول معانٍ مختلفة. التعريف الحالي وظيفي
      لكنه يفتقر إلى الضبط المصطلحي الدقيق ويستحق المراجعة لإزالة الدوران وتحقيق التمييز
      الجنس-الفصل (genus-differentia). الجذر اللغوي لـ«مناضل» (ن-ض-ل) يُسند دلالة الدفاع
      الخطابي عن الآخر وفق ابن فارس («يناضل عن فلان: يتكلم عنه بعذره كأنه يرامي دونه»)
      مما يجعله مرشحاً دلالياً قوياً لكنه يتداخل مع اللمّتين الموجودتين.

  blind_candidates:
    - lemma: "مُنَاضِلٌ حُقُوقِيٌّ"
      generation_method: tarkib
      justification: >
        تركيب وصفي من «مناضل» (اسم فاعل من ن-ض-ل، يدل على المكافح والمدافع) و«حقوقي»
        (نسبة إلى الحقوق). الجذر نضل في مقاييس اللغة يعني «الرمي والمرامة» ثم بالمجاز
        «يناضل عن فلان: يتكلم عنه بعذره». المركب الوصفي «مناضل حقوقي» شائع في الخطاب
        السياسي والإعلامي العربي المعاصر ويُقابل "civil rights activist/worker".
    - lemma: "نَصِيرُ الأَقَلِّيَّاتِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «نصير» (فعيل من ن-ص-ر، بمعنى كثير النصرة والعون) و«الأقليات»
        (جمع أقلية). نصير على وزن فعيل للمبالغة يدل على الناصر الدائم. المركب يُركّز على
        البُعد الداعم والمساند لجماعات الأقليات تحديداً.
    - lemma: "دَاعِيَةُ الحُقُوقِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي من «داعية» (اسم فاعل مبالغ من د-ع-و، «الذي يدعو إلى فكرة»، الهاء
        للمبالغة) و«الحقوق». يُركّز على البُعد الخطابي والتبشيري للناشط الحقوقي الذي يدعو
        إلى مبادئه ويسعى لنشرها.
    - lemma: "حُقُوقِيٌّ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق بالنسبة من جذع «حقوق» (جمع حق، من ح-ق-ق)، موثّق في موسوعة السلطان قابوس
        بمعنى «من يعطي الحق». النسبة المجوهَّرة (اسم منسوب يُستعمل اسماً) أداة اشتقاقية
        منتجة في العربية المعاصرة. كلمة مفردة خفيفة على اللسان، تُختزل بها الدلالة كاملةً.


