stage1_review:
  assessment:
    concerns:
      - "اللمّة 'خليج واسع' هي تعبير وصفي أكثر من كونه مصطلحاً معجمياً مستقلاً، لكنه مقبول كشرح مباشر."
      - "تعريف المجموعة الترادفية للمجموعة الأعلى (الهايبرنيم) يذكر 'جون' كشيء أصغر من الخليج، بينما 'بايت' (bight) قد يكون واسعاً جداً."
    observations: "المفهوم الجغرافي لـ (bight) يشير إلى انحناء عريض في الساحل، وهو ما تعبر عنه كلمة 'جَوْن' في الجغرافيا الحديثة (خاصة في منطقة الخليج العربي)، وكلمة 'شَرْم' و'خَوْر' في سياقات أخرى. الترجمة الدقيقة تجمع بين اتساع الانحناء وعمقه."
  blind_candidates:
    - lemma: "حَنْوَة"
      generation_method: ishtiqaq
      justification: "مشتقة من الجذر (حنو) للدلالة على الانحناء في الخط الساحلي، وهو ما يطابق أصل الكلمة الإنجليزية (bight) التي ترتبط بالانحناء."
    - lemma: "تَقْوِيرَة سَاحِلِيَّة"
      generation_method: tarkib
      justification: "تعبير وصفي دقيق لعملية تقوّر الساحل ودخول البحر فيه بشكل عريض."
    - lemma: "مُنْحَنًى سَاحِلِيّ"
      generation_method: tarkib
      justification: "ترجمة اصطلاحية لـ (coastal curve) التي ترادف (bight) في بعض السياقات الجغرافية."
    - lemma: "خَلِيج مُنْحَنٍ"
      generation_method: tarkib
      justification: "تعبير يجمع بين الجنس القريب (خليج) والفصل النوعي (منحنٍ)."

stage2_evidence:
  per_lemma:
    - lemma: "جَوْن"
      confirm:
        - text: "«جَوْن ويجمع على أجْوان: خور خليج (فوك، بوشر، محيط المحيط وهو فيه جُون بالضم، معجم الادريسي).»"
          source: "تكملة المعاجم العربية (دوزي)"
        - text: "«وتجوَّن البحر: توغل في الأرض وكون جونا أي خليجا.»"
          source: "معجم الإدريسي (نقلاً عن دوزي)"
      expands:
        - text: "«الجون عند أهل اللغة قاطبة اسم يقع على الأسود والأبيض... والجُونة معروفة [وعاء]»"
          source: "مقاييس اللغة"
          addition: "المعنى الجغرافي يبدو متولداً من شكل 'الجُونة' (الوعاء المستدير) أو عبر المجاز."
    - lemma: "شَرْم"
      confirm:
        - text: "«شَرْمٌ من البحر: خليجٌ منه.»"
          source: "تاج اللغة وصِحاح العربية"
        - text: "«الشَّرْم [مفرد]: ج شُروم: خليج في البحر.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«الشَّرْمُ: قَطْعٌ مِنَ الأَرْنَبَةِ... وَالشَّرْمُ يُقَالُ إِنَّهُ لُجَّةٌ فِي الْبَحْرِ. وَسَمِعْتُ مَنْ يَقُولُ إِنَّ الشَّرْمَ كَالْخَرْقِ فِي جَانِبِ الْبَحْرِ، كَالْمَدْخَلِ إِلَى الْبَحْرِ. وَهَذَا أَقْيَسُ.»"
          source: "مقاييس اللغة"
    - lemma: "خَوْر"
      confirm:
        - text: "«الخَوْر: مَصَبُّ المياهِ الجارِيَةِ فى البَحْرِ، إذا اتَّسَعَ وعَرُضَ الخَلِيجُ من البَحْر (فى الجغرافيا)»"
          source: "المعجم الكبير"
        - text: "«(الخور) مصب المَاء فِي الْبَحْر والمنخفض من الأَرْض بَين مرتفعين والخليج»"
          source: "المعجم الوسيط"
    - lemma: "مُنْعَطَف سَاحِلِيّ"
      confirm:
        - text: "«bight: مُنْعَطَف في شاطئ.»"
          source: "المورد الحديث"

stage3_analysis:
  per_lemma:
    - lemma: "جَوْن"
      decision: confirmed
      decision_reason: "مصطلح جغرافي عريق ومستخدم حديثاً للدلالة على الخليج المنحني أو المنعطف البحري العريض."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَوْن"
    - lemma: "خَلِيج واسِع"
      decision: confirmed
      decision_reason: "تعبير وصفي دقيق ومباشر للمفهوم، وهو الترجمة الحرفية المستقرة في القواميس العلمية."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
    - lemma: "شَرْم"
      source: stage1
      decision: confirmed
      decision_reason: "مصطلح أصيل يعني الانشقاق في الساحل، ويستخدم جغرافياً للدلالة على الخلجان الصغيرة أو المتوسطة التي تشبه الشق في اليابسة."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "شَرْم", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "خَوْر"
      source: stage1
      decision: confirmed
      decision_reason: "يستخدم للدلالة على لسان من البحر يمتد في البر، خاصة إذا كان عريضاً عند مدخله."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: create_entry
          params: {lemma: "خَوْر", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}
    - lemma: "مُنْعَطَف سَاحِلِيّ"
      source: stage1
      decision: confirmed
      decision_reason: "ترجمة دقيقة لمصطلح (bight) الذي يركز على عنصر الانحناء أو الانعطاف في خط الساحل."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: create_entry
          params: {lemma: "مُنْعَطَف سَاحِلِيّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

stage4_content:
  definition:
    current: "خليج واسع يتشكل من انحناء في الخط الساحلي"
    assessment:
      decision: revise
      reason: "التعريف الحالي جيد لكن يمكن جعله أكثر دقة معجمية وجغرافية بإضافة عنصرBreadth (الاتساع) و Shallow-depth (الضحالة) الذي يميز الـ (bight)."
    authored:
      - type: terminological
        text: "انْحِناءٌ عَرِيضٌ وضَحْلٌ في الخَطِّ السَّاحِلِيِّ، يُشكِّلُ خَلِيجاً مَفْتُوحاً."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params: {synset_id: "{synset_id}", definition_index: 0, text: "انْحِناءٌ عَرِيضٌ وضَحْلٌ في الخَطِّ السَّاحِلِيِّ، يُشكِّلُ خَلِيجاً مَفْتُوحاً."}
  examples:
    per_lemma:
      - lemma: "جَوْن"
        examples:
          - text: "تُعَدُّ سَفينةُ الصَّيْدِ في جَوْنِ الكُوَيْتِ جُزْءاً مِنَ التُّراثِ البَحْرِيِّ المِنْطَقَةِ."
            type: usage
      - lemma: "شَرْم"
        examples:
          - text: "تَمْتَازُ بَعْضُ السَّواحِلِ بِشُرُومٍ صَخْرِيَّةٍ تُوَفِّرُ مَلَاذًا آمِنًا لِلسُّفُنِ الصَّغِيرَةِ."
            type: usage
    actions:
      - command: add_synset_example
        params: {synset_id: "{synset_id}", text: "يُعَدُّ الجَوْنُ الأُسْتُرالِيُّ الكَبِيرُ أَحَدَ أَبْرَزِ الأَمْثِلَةِ عَلَى الانْحِناءاتِ السَّاحِلِيَّةِ العَرِيضَةِ."}

stage5_enrichment:
  per_entry:
    - lemma: "جَوْن"
      entry_id: "{auto}"
      root: "جون"
      maqayis_quote: "«الْجِيمُ وَالْوَاوُ وَالنُّونُ أَصْلٌ وَاحِدٌ... وَالْجَوْنُ عِنْدَ أَهْلِ اللَّغَةِ قَاطِبَةً اسْمٌ يَقَعُ عَلَى الْأَسْوَدِ وَالْأَبْيَضِ.»"
    - lemma: "شَرْم"
      entry_id: "{auto}"
      root: "شرم"
      maqayis_quote: "«الشِّينُ وَالرَّاءُ وَالْمِيمُ أَصْلٌ وَاحِدٌ... يَدُلُّ عَلَى خَرْقٍ فِي الشَّيْءِ وَمَزْقٍ... وَالشَّرْمُ يُقَالُ إِنَّهُ لُجَّةٌ فِي الْبَحْرِ.»"
    - lemma: "خَوْر"
      entry_id: "{auto}"
      root: "خور"
      maqayis_quote: "«الْخَاءُ وَالْوَاوُ وَالرَّاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى انْفِتَاحٍ فِي شَيْءٍ.»"
    - lemma: "مُنْعَطَف سَاحِلِيّ"
      entry_id: "{auto}"
      roots:
        - word: "منعطف"
          root: "عطف"
          maqayis_quote: "«الْعَيْنُ وَالطَّاءُ وَالْفَاءُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى انْحِنَاءٍ وَشَيْءٍ يُثْنَى.»"
        - word: "ساحلي"
          root: "سحل"
          maqayis_quote: "«السِّينُ وَالْحَاءُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى كَشْطِ شَيْءٍ وَقَشْرِهِ.»"
  per_sense:
    - lemma: "جَوْن"
      sense_id: "{auto}"
      nuance: "يركز على شكل الانحناء الدائري أو التقوس العريض (مأخوذ من شكل الجونة)."
      mwe: false
    - lemma: "خَلِيج واسِع"
      sense_id: "{auto}"
      nuance: "وصف عام ومباشر يركز على المساحة المائية المفتوحة."
      mwe: true
    - lemma: "شَرْم"
      sense_id: "{auto}"
      nuance: "يركز على فكرة الشق أو المدخل الضيق الذي يتسع داخلاً، وغالباً ما يكون في بيئة صخرية."
      mwe: false
    - lemma: "خَوْر"
      sense_id: "{auto}"
      nuance: "يشير إلى لسان مائي منخفض، وغالباً ما يرتبط بمصب وادٍ أو تداخل البر والماء."
      mwe: false
  synset:
    cultural_fit: native
  actions:
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"root":"جون","maqayis":"«الْجِيمُ وَالْوَاوُ وَالنُّونُ أَصْلٌ وَاحِدٌ...»"}'
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"يركز على شكل الانحناء الدائري أو التقوس العريض (مأخوذ من شكل الجونة).","mwe":false}'
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"native"}'
    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.9
