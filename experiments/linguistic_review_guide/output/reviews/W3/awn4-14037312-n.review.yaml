# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14037312-n (stand-down)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي يستخدم لفظ «استرخاء» وهو أحد لمّات المجموعة — دوران معجمي"
      - "اللمّة «تخفيف التأهب» تعبير وصفي حر وليست مصطلحاً مسكوكاً — تفشل في اختبار السكّ (يمكن إبدالها بـ«تقليل التأهب» أو «خفض التأهب»)"
    observations: "المفهوم عسكري/أمني بالأساس: الانتقال من حالة تأهب أو استنفار إلى الوضع الاعتيادي. اللفظ العربي «استرخاء» مستعمل في هذا السياق ومثبت في المعجم الكبير بتعبير «الاسترخاء الأمني أو العسكري». المركب «تخفيف التأهب» وصفي لا اصطلاحي."
  blind_candidates:
    - lemma: "تَرَاخٍ"
      generation_method: ishtiqaq
      justification: "من جذر ر-خ-و على وزن تَفَاعُل، يدل على التباطؤ والتمهل والخروج من حالة الشدة"
    - lemma: "تَسْرِيح"
      generation_method: ishtiqaq
      justification: "من جذر س-ر-ح على وزن تَفْعِيل، يدل على الإطلاق والإرسال — يُستعمل في تسريح الجنود"
    - lemma: "رَفْعُ التَّأَهُّبِ"
      generation_method: tarkib
      justification: "مركب إضافي يدل على إنهاء حالة التأهب — مقابل «إعلان التأهب»"
    - lemma: "إِخْمَاد"
      generation_method: majaz
      justification: "من جذر خ-م-د، أصله إطفاء النار، يُستعار لإسكان حالة الاستنفار والتأهب"

stage2_evidence:
  per_lemma:
    - lemma: "اِسْتِرْخَاء"
      confirm:
        - text: "«والاسترخاء الأمْنِيّ, أو العَسْكرِيّ: عدم جعل جُنود الأمْن أو الجيش في حالة استعداد لأداء الواجب المنوط بهم»"
          source: "المعجم الكبير"
        - text: "«رأى مجمع اللغة المصري تسويغ استخدام لفظ الاسترخاء بمعنى: عدم الدقة أو عدم الانضباط، انتقالاً من الدلالة الحسية إلى الدلالة المعنوية»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«عند الأطباء ترهّل وضعف يظهر في العضو عن عجز القوّة المحرّكة، وهو مرادف للفالج عند القدماء»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "الدلالة الطبية الأصلية: ضعف العضو وترهّله"
        - text: "«ارتياح العضلات وعدم تشنجها أو انقباضها»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية"
          addition: "دلالة فسيولوجية عامة: ارتياح العضلات"

    - lemma: "تَخْفِيفُ التَّأَهُّبِ"
      evidence_status: "no_material_found"

    - lemma: "تَرَاخٍ"
      contradicts:
        - text: "«التراخي: التمهل وامتداد الزمان، وتراخى الأمر تراخياً امتد زمانه»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "التراخي يدل على التباطؤ الزمني لا على رفع حالة التأهب"
        - text: "«بالخاء المعجمة لغة التباعد. وشرعاً جواز تأخير الفعل عن وقته الأول إلى ظنّ الفوت»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          conflict: "اصطلاح فقهي يعني جواز التأخير، لا الخروج من حالة تأهب"

    - lemma: "تَسْرِيح"
      contradicts:
        - text: "«التسريح: إطلاق الشيء على وجه لا يتهيأ للعود: فمن أرسل البازي مثلاً ليسترده فهو مطلق، ومن أرسله لا ليرده فهو مسرّح»"
          source: "التوقيف على مهمات التعاريف للمناوي"
          conflict: "التسريح إطلاق نهائي لا رجعة فيه، والـ stand-down تعليق مؤقت"
      expands:
        - text: "«العمال»"
          source: "المعجم الموحد لمصطلحات الاقتصاد"
          addition: "يُستعمل في سياق تسريح العمال (laying off) وهو إنهاء دائم"

    - lemma: "رَفْعُ التَّأَهُّبِ"
      evidence_status: "no_material_found"

    - lemma: "إِخْمَاد"
      contradicts:
        - text: "«عملية جعل برنامج نشيط غير نشيط»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          conflict: "إخماد في المصطلحية الحديثة يعني deactivate وهو أعم من stand-down"
      expands:
        - text: "«(خَمَدَ) الخاء والميم والدال أصل واحد، يدل على سكون الحركة والسقوط. خمدت النار خموداً، إذا سكن لهبها»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الأصل: سكون الحركة وإطفاء اللهب — مجاز ممكن لكنه غير مثبت في سياق التأهب"

stage3_analysis:
  per_lemma:
    - lemma: "اِسْتِرْخَاء"
      decision: confirmed
      decision_reason: "المعجم الكبير يثبت «الاسترخاء الأمني أو العسكري» بتعريف يطابق المجموعة الترادفية تماماً. مجمع اللغة المصري أقرّ التوسع الدلالي من الحسي إلى المعنوي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "اِسْتِرْخَاء"

    - lemma: "تَخْفِيفُ التَّأَهُّبِ"
      decision: removed
      decision_reason: "تعبير وصفي حر يفشل في اختبار السكّ: يمكن إبداله بـ«تقليل التأهب» أو «خفض التأهب» أو «إنهاء التأهب» دون تغيّر الدلالة. لا شاهد معجمي على تثبيته كمصطلح."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "تَرَاخٍ"
      source: stage1
      decision: removed
      decision_reason: "التراخي في المعاجم يدل على التباعد الزمني والتمهل (postponement)، لا على الخروج من حالة تأهب. الفرق الدلالي جوهري."
      evidence_assessment:
        case: contradicts_only

    - lemma: "تَسْرِيح"
      source: stage1
      decision: removed
      decision_reason: "التسريح يدل على الإطلاق النهائي الذي لا رجعة فيه (كتسريح العمال أو الطلاق)، بينما الـ stand-down تعليق مؤقت قابل للعودة."
      evidence_assessment:
        case: contradicts_only

    - lemma: "رَفْعُ التَّأَهُّبِ"
      source: stage1
      decision: removed
      decision_reason: "تعبير وصفي حر يفشل في اختبار السكّ (يمكن إبداله بـ«إلغاء التأهب» أو «إنهاء التأهب»). لا شاهد معجمي."
      evidence_assessment:
        case: no_material

    - lemma: "إِخْمَاد"
      source: stage1
      decision: removed
      decision_reason: "إخماد يعني deactivation/suppression في المصطلحية الحديثة وهو أعم من المفهوم المطلوب. المجاز من إخماد النار ممكن نظرياً لكنه غير مثبت في سياق التأهب العسكري."
      evidence_assessment:
        case: mixed

