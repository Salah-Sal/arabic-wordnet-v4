# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10886825-n  |  ILI: i94564
# الموضوع: جون موسى براونينغ — مخترع أمريكي للأسلحة النارية
# ══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ─────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (براونينغ، جون براونينغ) خاليتان من التشكيل الكامل"
      - "الاسم الكامل للمخترع (جون موسى براونينغ) غائب من اللمّات العربية رغم وروده في المقابل الإنجليزي John Moses Browning"
      - "التعريف العربي يستخدم كلمة 'أوتوماتيكية' الدخيلة بدلاً من المصطلح العربي المعتمد 'آلية'"
      - "صنف pos مسجّل كـ n، بينما الأسماء الأعلام الأجنبية تستحق التمييز بـ proper_noun"
    observations: >
      هذه المجموعة الترادفية تخص اسم علم لشخصية تاريخية أجنبية هي جون موسى براونينغ
      (1855-1926)، مصمّم أسلحة أمريكي اشتُهر بتصميم المسدسات الآلية والبنادق المتكررة.
      إذ إن المدخل اسم علم أجنبي، فلا مجال لأساليب الاشتقاق أو المجاز أو التركيب؛
      الأسلوب الوحيد المنطبق هو التعريب (النقل الصوتي). اللمّات الموجودة مقبولة لغويًا
      لكنها تفتقر إلى التشكيل وتغفل الاسم الكامل. ينبغي إضافة "جون موسى براونينغ"
      لتغطية التسمية الكاملة الواردة في المرجع الإنجليزي John Moses Browning.

  blind_candidates:
    - lemma: "بْرَاوْنِينْغ"
      generation_method: taarib
      justification: >
        تعريب مباشر للاسم الإنجليزي Browning باستخدام: باء + راء + ألف + واو + نون + ياء
        + نون + غين. الغين المعجمة أصح لتمثيل صوت /ŋ/ في نهاية الكلمة الإنجليزية.
        يقبل لام التعريف والنسبة (البراونينغي / البراونينغيون).
    - lemma: "جُون بْرَاوْنِينْغ"
      generation_method: taarib
      justification: >
        تعريب الاسم الأول والاسم الأخير معًا. John → جون (اسم علم عربي معروف التعريب).
        يُفيد في التمييز عند الإشارة لشخص بعينه مقابل اسم العائلة المجرد.
    - lemma: "جُون مُوسَى بْرَاوْنِينْغ"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل الثلاثي: John Moses Browning. Moses → موسى (مقابله العربي
        الكلاسيكي المتداول). الاسم الكامل يُعدّ الأكثر دقةً في الإحالة التوثيقية.
    - lemma: "بْرَاوْنِينج"
      generation_method: taarib
      justification: >
        تعريب بديل باستخدام الجيم بدلًا من الغين المعجمة لتمثيل نهاية -ing. غير أن
        الغين أقرب صوتيًا إلى /ŋ/ وأشيع في المصادر العربية المتخصصة؛ لذا هذا الشكل
        أدنى رتبةً من السابق.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  query_log:
    - query_id: 1
      pattern: "batch headword lookup"
      terms_searched:
        - براونينغ
        - البراونينغ
        - جون براونينغ
        - براونينج
        - البراونينج
        - جون موسى براونينغ
        - بروننج
      result: "لا نتائج — لم يُوجَد أي مدخل في قاعدة البيانات بهذه الأشكال"
    - query_id: 2
      pattern: "English bridge (Pattern ٧)"
      terms_searched:
        - "John Browning"
        - "Browning"
        - "John M. Browning"
        - "John Moses Browning"
      result: >
        النتائج لا علاقة لها بالمخترع؛ كلمة browning وردت فقط بمعنى التحمير/الاسمرار
        في علم التغذية (اسمرار أنزيمي، browning — مجال Nutrition Technologies)،
        وورد "Browning's vein" (وريد براونينغ) في المعجم الطبي الموحد 2009 إشارةً
        لعالم تشريح مختلف كليًا.
    - query_id: 3
      pattern: "Arabic FTS keyword"
      terms_searched:
        - براونينغ
        - براونينج
        - "مخترع اسلحة"
        - "اسلحة نارية"
      result: >
        وريد براونينغ فقط (entry_id: 664588) — المعجم الطبي الموحد 2009 — لا صلة له
        بالمخترع جون براونينغ.

  per_lemma:
    - lemma: "براونينغ"
      evidence_status: "no_material_found"

    - lemma: "جون براونينغ"
      evidence_status: "no_material_found"

    - lemma: "بْرَاوْنِينْغ"
      evidence_status: "no_material_found"

    - lemma: "جُون بْرَاوْنِينْغ"
      evidence_status: "no_material_found"

    - lemma: "جُون مُوسَى بْرَاوْنِينْغ"
      evidence_status: "no_material_found"

    - lemma: "بْرَاوْنِينج"
      evidence_status: "no_material_found"

  note: >
    انعدام الأدلة المعجمية متوقّع تمامًا؛ هذا اسم علم لشخص تاريخي أجنبي لم يُدرَج
    في المعاجم العربية التقليدية ولا في قواعد المصطلحات التقنية الحديثة. الدليل
    الوحيد الخاطئ التوهم هو "وريد براونينغ" في المعجم الطبي، وهو نسبة لطبيب تشريح
    آخر وليس للمخترع جون براونينغ.


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "براونينغ"
      decision: confirmed
      decision_reason: >
        تعريب مستقر ومتداول في المصادر العربية للاسم العائلي Browning. يُمثّل الشكل
        المختصر المناسب للإحالة اليومية. يقبل التعريف واللصق الاشتقاقي. الغياب عن
        قاعدة البيانات المعجمية لا يُعدّ دليلًا على عدم الصحة لأن الأعلام الأجنبية
        نادرًا ما تُدرَج في المعاجم العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الاسم الأخير (العائلي) وحده؛ يُستخدم عند الاكتفاء بالتعريف السياقي للشخص
        أو في الإحالة المختصرة كـ"مسدس براونينغ" أو "بندقية براونينغ".
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بْرَاوْنِينْغ"

    - lemma: "جون براونينغ"
      decision: confirmed
      decision_reason: >
        الاسم الأول مع الاسم الأخير — صيغة أكثر تحديدًا للشخص. ضروري لتمييزه عن
        أفراد آخرين من عائلة براونينغ. الشكلان معًا (براونينغ + جون براونينغ) يُغطيان
        ما يقابله John Browning و Browning في الإنجليزية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يضيف الاسم الأول (جون) للتمييز الكامل عن بقية أفراد العائلة؛ هو الصيغة
        المفضّلة في السياق الموسوعي والتوثيقي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُون بْرَاوْنِينْغ"

    - lemma: "بْرَاوْنِينْغ"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق مع اللمّة الموجودة (براونينغ) بعد إضافة التشكيل. لا حاجة لإدخال مستقل.

    - lemma: "جُون بْرَاوْنِينْغ"
      source: stage1
      decision: removed
      decision_reason: >
        يتطابق مع اللمّة الموجودة (جون براونينغ) بعد التشكيل. ليس إضافة جديدة.

    - lemma: "جُون مُوسَى بْرَاوْنِينْغ"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم الكامل John Moses Browning وارد في المقابل الإنجليزي للمجموعة
        (John M. Browning / John Moses Browning) لكنه غائب من اللمّات العربية.
        إضافته تُحقق التوازي الكامل مع الإنجليزية وتُفيد في البحث التوثيقي.
        موسى هو المقابل العربي الكلاسيكي المستقر لـMoses.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الثلاثي الكامل؛ يُستخدم في السياقات الرسمية والموسوعية للتعريف
        الكامل لا اللبس فيه. يقابل الصيغة الإنجليزية John Moses Browning.
      actions:
        - command: create_entry
          params:
            lemma: "جُون مُوسَى بْرَاوْنِينْغ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10886825-n"

    - lemma: "بْرَاوْنِينج"
      source: stage1
      decision: removed
      decision_reason: >
        الشكل بالجيم أقل شيوعًا وأبعد صوتيًا عن الأصل الإنجليزي /brɑːnɪŋ/؛
        الغين المعجمة أقرب إلى صوت الـng الإنجليزي في الموارد العربية المتخصصة.
        لا داعي لإدخال بديل يُربك القارئ.


