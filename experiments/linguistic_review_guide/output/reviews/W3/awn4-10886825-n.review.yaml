        لـautomatic pistols هو "مسدسات آلية" أو "مسدسات ذاتية الحشو". ما عدا ذلك
        التعريف وافٍ موسوعيًا ويشمل الجنس القريب (مخترع) والفصل النوعي (الأسلحة النارية
        وأنواعها المحددة والتواريخ).
