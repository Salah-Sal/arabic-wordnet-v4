# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مُتَعَنِّت"
      decision: confirmed
      decision_reason: >
        الجذر عنت يعني المشقة والإحراج المتعمد وإدخال اللبس على الغير؛ ومُتَعَنِّت هو
        من يسأل أسئلة ملتوية قصد الإرهاق والإحباط، وهو بعينه رفض التعاون. الأدلة
        الكلاسيكية تُؤكّد المعنى الصحيح. التعارض في المورد الحديث (hypercritical)
        استعمال مجازي ثانوي لا يُلغي الدلالة الأصلية. التشكيل صحيح.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الطابعَ التعسفي الإحراجي: المتعنت يُوقع الحرج والمشقة بطرح أسئلة ملتوية وفرض شروط تعجيزية، مع طابع العناد والعدوانية في الرفض؛ بخلاف المماطل الذي أسلوبه التأجيل والمداورة لا المواجهة المباشرة"

    - lemma: "مُماطِل"
      decision: confirmed
      decision_reason: >
        الجذر مطل موثق توثيقاً غنياً في جميع طبقات المعجمية العربية بمعنى مد الشيء
        وإطالته ومنه تأجيل الوفاء. معجم اللغة العربية المعاصرة يوثّق صراحةً: «أطال
        المناقشة كسباً للوقت» و«تخلّص من مناقشة كسباً للوقت» — وهما بعينهما معنى
        stonewaller. لا تعارض في الأدلة. التشكيل صحيح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز المداورة والحيلة في التأجيل: المماطل يُطيل النقاش ويؤجل الحسم بالمواربة والوعود المتكررة دون وفاء، مع ميل إلى التهرب السلس لا المواجهة المباشرة؛ بخلاف المتعنت الذي يرفض رفضاً صريحاً"

    - lemma: "مُسَوِّف"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثق في أساس البلاغة للزمخشري بوصفه مرادفاً للمطول في عبارة «هو مسوّف مطول».
        التسويف = المطل والتأخير (التوقيف على مهمات التعاريف)، والمقاييس تُؤكّد أن
        أصل التسويف قول 'سوف أفعل' مرة بعد مرة. الاستعمال الحديث يُقرنه بالمماطلة
        مباشرةً. اختبار السك: مُسَوِّف وحدة معجمية ثابتة بشواهد كلاسيكية لا عبارة
        وصفية. تعارض المعجم الكبير يعكس سياقاً شعرياً نادراً لا يُلغي المعنى الرئيسي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُبرز الوعد الزائف والتسويف المتكرر: المسوّف يعد بالإنجاز ويقول 'سوف' دون وفاء، محوره الوعد الكاذب المُعاد؛ وهو أخص من المماطل في تصوير آلية التأخير (الوعد الزائف لا المداورة العامة)"
      actions:
        - command: create_entry
          params:
            lemma: "مُسَوِّف"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُرَاوِغ"
      source: stage1
      decision: removed
      decision_reason: >
        الأدلة مختلطة: المراوغة توافق «رفض الإجابة» لكنها تتضمن دلالة الخداع والتضليل
        المقصود (المخادع، الكيد، الاحتيال) الغائبة عن تعريف المجموعة. مبدأ عدم الترادف
        المطلق: المراوغ يُضيف معنى الغش والتمويه الذي يجعله أقرب إلى مجموعة المخادعين
        لا مجموعة المعطّلين. الإدراج سيُوسّع المجموعة خارج نطاقها الدلالي.

    - lemma: "مُطَوِّل"
      source: stage1
      decision: removed
      decision_reason: >
        لا يوجد دليل على استعمال مُطَوِّل (اسم فاعل من طوَّل) بمعنى 'شخص يُطيل الخطب'.
        المداخل الموجودة تعكس معنيين مختلفين تماماً: الحبل والأداة التقنية. أما 'مطوّل'
        التي وردت في أساس البلاغة فهي صفة مشبهة لا اسم فاعل فاعل. لا يجتاز اختبار
        التثبيت المعجمي.

    - lemma: "مُلَدِّد"
      source: stage1
      decision: removed
      decision_reason: >
        لا أدلة معجمية على الاستعمال. جذر لدد وإن كان يدل على الخصومة (أَلَدُّ الخصام)
        إلا أن وزن مُفَعِّل منه (مُلَدِّد) غير موثق معجمياً. لا يجتاز اختبار التثبيت
        المعجمي.


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "الشخص الذي يماطل أو يرفض الإجابة أو التعاون؛ شخص يؤخر الأمور بخطب طويلة ونحوها"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يحتوي على ثلاث إشكاليات: (١) دوران: 'يماطل' اشتقاق من لمّة المجموعة،
        (٢) تكرار 'شخص' مرتين دون حاجة، (٣) جملتان منفصلتان يمكن دمجهما في تعريف أتقن
        بجنس واحد وفصل نوعي متكامل.
    authored:
      - type: terminological
        text: "شَخْصٌ يُعِيقُ سَيْرَ الأُمُورِ إِمَّا بِرَفْضِ التَّعَاوُنِ وَالإِجَابَةِ الصَّرِيحَةِ، وَإِمَّا بِإِطَالَةِ الخُطَبِ وَالنِّقَاشَاتِ تَعَمُّداً لِتَعْطِيلِ الإِجْرَاءَاتِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "مَنِ اشْتُهِرَ بِالتَّعَنُّتِ وَالتَّسْوِيفِ؛ يَتَهَرَّبُ مِنَ الإِجَابَةِ الصَّرِيحَةِ وَيَرْفُضُ التَّعَاوُنَ، أَوْ يُطِيلُ النِّقَاشَ إِعَاقَةً لِلسَّيْرِ الطَّبِيعِيِّ لِلْأُمُورِ"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
