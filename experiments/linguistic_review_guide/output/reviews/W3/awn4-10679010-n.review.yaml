# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "التعريف دائري جزئياً: يستخدم لفظ 'يماطل' وهو اشتقاق مباشر من لمّة موجودة في المجموعة (مُماطِل)"
      - "التعريف يكرر كلمة 'شخص' في الجملتين دون ربط منطقي واضح بينهما"
      - "غياب لمّة تُغطي بُعد التسويف المتكرر بالوعود الزائفة (مُسَوِّف) رغم شهرته في الاستعمال الكلاسيكي"
      - "اللمّة مُتَعَنِّت أوسع دلالةً من المطلوب: تشمل إيقاع المشقة بالغير عموماً، لا التعطيل وحده"
    observations: >
      المجموعة تجمع بين مفهومَين متداخلَين: (أ) رفض التعاون والإجابة الصريحة — وهو ما يتضمنه
      جذر «عنت» بمعنى تعمّد اللبس والمشقة، و(ب) تعطيل الإجراءات بإطالة الخطب والنقاشات —
      وهو صميم معنى «مطل». اللمّتان الموجودتان تُغطيان هذين البعدين بنسب متفاوتة. يُلاحظ غياب
      «مُسَوِّف» رغم توثيقه في أساس البلاغة بوصفه مرادفاً للمُمَاطِل والمُطَوِّل.
      الهيكل التصنيفي سليم: الموضع تحت مُعَرْقِل/مُعَوِّق صحيح.
  blind_candidates:
    - lemma: "مُسَوِّف"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (س و ف) على وزن مُفَعِّل؛ يدلّ على من يُكثر من قول 'سوف أفعل' تسويفاً وتأجيلاً بلا وفاء. يناسب 'شخص يؤخر الأمور' في التعريف."
    - lemma: "مُرَاوِغ"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (ر و غ) على وزن مُفَاعِل؛ يدلّ على الميل وعدم الاستقرار والتهرب. يناسب 'يرفض الإجابة' إذ المراوغة هي التهرب من الجواب الصريح."
    - lemma: "مُطَوِّل"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (ط و ل) على وزن مُفَعِّل؛ يدلّ على من يُطيل الخطب والنقاشات عمداً. يناسب 'شخص يؤخر الأمور بخطب طويلة' مباشرةً."
    - lemma: "مُلَدِّد"
      generation_method: ishtiqaq
      justification: "اشتقاق من الجذر (ل د د) على وزن مُفَعِّل؛ اللَّدَد شدة الخصومة والجدل، يُقال رجل أَلَدُّ أي شديد الخصومة رافض للتسليم، ومنه قوله تعالى: {وَهُوَ أَلَدُّ الْخِصَامِ}."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات نُفِّذت: ٥ استعلامات
# ١) مطابقة دفعية للمّات الموجودة + المرشحات
# ٢) إثراء مُدمج بالمعرّفات
# ٣) جسر إنجليزي (stonewaller, filibuster, obstructionist, procrastinator)
# ٤) بحث FTS عربي بكلمات مفتاحية (ماطل، مماطل، متعنت، تسويف، مراوغة)
# ٥) مقاييس اللغة للجذور (عنت، مطل، سوف، روغ)
