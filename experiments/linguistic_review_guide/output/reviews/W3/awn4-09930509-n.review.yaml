# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة تَشارتِيّ تعريبٌ صوتي صرف لا يحمل دلالة عربية شفافة للقارئ غير المُطّلع على أصل الحركة الإنجليزية"
      - "كلا اللمّتين تفتقران إلى تشكيل كامل: تَشارتِيّ تحتاج فتحة على الشين (تَشَارتِيّ)، ومِيثاقِيّ تحتاج فتحة على الثاء (مِيثَاقِيّ)"
      - "المجموعة تمثل مفهوماً تاريخياً محدداً خاصاً بالتاريخ البريطاني، مما يُشحّ معه التوثيق المعجمي العربي الكلاسيكي"
      - "التعريف الحالي لا يذكر اسم الحركة الميثاقية صراحةً، فيُفقد اللمّتَين فصلَهما النوعي عن المصلح الاجتماعي العام"
    observations: >
      المجموعة تُمثّل منتسبَ الحركة الميثاقية (Chartism) البريطانية في القرن التاسع عشر (1838–1857م)، وهي
      حركة عمالية طالبت بإصلاح النظام البرلماني وتوسيع حق الاقتراع عبر وثيقة سُمّيت "الميثاق الشعبي"
      (People's Charter). كلا اللمّتين مستمدّتان من هذه التسمية: تَشَارتِيّ بالتعريب الصوتي لـ Chartist،
      ومِيثَاقِيّ بالاشتقاق العربي من ميثاق (= عهد محكم). الثانية أكثر إيضاحاً للقارئ العربي وأقوى
      سنداً من المعاجم العربية الحديثة التي تعتمد "الميثاقية" اسماً للحركة.
  blind_candidates:
    - lemma: "مِيثَاقِيّ"
      generation_method: ishtiqaq
      justification: "النسبة إلى الميثاق (= عهد محكم مكتوب)؛ يصف بدقة من يؤمن بالإصلاح الاجتماعي عبر وثيقة/ميثاق شعبي، وهو الجوهر الدلالي للـ Chartist"
    - lemma: "تَشَارتِيّ"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الإنجليزي Chartist مع قبول ال- والنسبة والجمع السالم؛ ضروري للتعريف بالحركة في السياقات الأكاديمية والتاريخية التي تستلزم الإحالة إلى الأصل"
    - lemma: "مُصْلِحٌ عُمَّالِيّ"
      generation_method: tarkib
      justification: "مركب وصفي يصف صنف المصلحين المنتسبين لقضية الطبقة العاملة في إنجلترا القرن التاسع عشر — توليد تجريبي لاختبار اختبار السكّ"
    - lemma: "وَثِيقِيّ"
      generation_method: ishtiqaq
      justification: "النسبة إلى الوثيقة (= charter) بديلاً اشتقاقياً من وثيقة بدلاً من ميثاق، إشارةً إلى الطابع الوثائقي لمطالب الحركة"


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات قاعدة البيانات المُنفَّذة:
#   ١. مطابقة دفعية لجميع اللمّات (headword_norm IN ...) → لم تُعِد نتائج
#   ٢. جسر إنجليزي (translation_en: "Chartist" OR "chartism" OR "charter") → entries 677482, 677483, 412025, 384546, ...
#   ٣. بحث FTS بكلمات مفتاحية ("ميثاقي" OR "طبقة عاملة" OR "مصلح اجتماعي") → entry 411482 (طبقة عاملة)
#   ٤. مقاييس اللغة لابن فارس (dictionary_id=151) للجذر وثق → entry 989518
stage2_evidence:
  per_lemma:
    - lemma: "تَشَارتِيّ"
      contradicts:
        - text: "«(1) الخرائطيّ: رسّام الخرائط (2) الجداوِليّ: خبير بالأسواق الماليّة يتّكل في تنبُّؤاته على الجداول البيانية»"
          source: "المورد الحديث (2008)"
          conflict: "المعجم يُترجم 'chartist' (بالأحرف الصغيرة) إلى معنيين غير سياسيين بالكامل (رسّام الخرائط والمحلل البياني المالي)، دون أدنى إشارة إلى المعنى التاريخي السياسي للـ Chartist الإنجليزي"
      expands:
        - text: "«الميثاقيّة: حركة عُمّالية إنكليزية نشطت في القرن التاسع عشر وهَدَفت إلى تحسين أوضاع الطبقة العاملة اجتماعيًا وصناعيًا»"
          source: "المورد الحديث (2008)"
          addition: "يُثبت هذا المدخل أن المصطلح العربي المعتمد للحركة في المعاجم الحديثة هو 'الميثاقية' لا 'التشارتية'، مما يُضعف أولوية التعريب الصوتي ويرجّح الاشتقاق العربي"

    - lemma: "مِيثَاقِيّ"
      confirm:
        - text: "«الميثاقيّة: حركة عُمّالية إنكليزية نشطت في القرن التاسع عشر وهَدَفت إلى تحسين أوضاع الطبقة العاملة اجتماعيًا وصناعيًا»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْوَاوُ وَالثَّاءُ وَالْقَافُ كَلِمَةٌ تَدُلُّ عَلَى عَقْدٍ وَإِحْكَامٍ. وَوَثَّقْتُ الشَّيْءَ: أَحْكَمْتُهُ. وَنَاقَةٌ مُوَثَّقَةُ الْخَلْقِ. وَالْمِيثَاقُ: الْعَهْدُ الْمُحْكَمُ. وَهُوَ ثِقَةٌ. وَقَدْ وَثِقْتُ بِهِ»"
          source: "مقاييس اللغة لابن فارس"
          addition: "يؤكد أن جذر وثق يدل على العقد والإحكام وأن الميثاق = العهد المحكم؛ يُعزز الأساس اللغوي الصرفي لاشتقاق مِيثَاقِيّ نسبةً إلى الميثاق الشعبي"

    - lemma: "مُصْلِحٌ عُمَّالِيّ"
      evidence_status: "no_material_found"

    - lemma: "وَثِيقِيّ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "تَشارتِيّ"
      decision: confirmed
      decision_reason: >
        التعريب الصوتي مقبول للمصطلحات ذات الهوية التاريخية المحددة حين تكون الحركة مُسمَّاةً باسمها
        الأجنبي في المراجع العلمية العربية. الحركة الشارتية/الميثاقية معروفة في الكتابة التاريخية
        العربية بكلا الاسمين، ويحتاج الباحثون إلى اللمّة المعرَّبة للإحالة الدقيقة إلى المصطلح
        الأصلي. غير أن تقديم مِيثَاقِيّ أولى معجمياً لوضوح دلالته العربية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُحيل بالتعريب الصوتي إلى الاسم العلمي للحركة (Chartism) مما يُسهّل التعرف في السياقات الأكاديمية والتاريخية؛ لكنه مبهم الدلالة للقارئ العربي العادي الذي لا يعرف الأصل الإنجليزي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشَارتِيّ"

    - lemma: "مِيثاقِيّ"
      decision: confirmed
      decision_reason: >
        لمّة اشتقاقية عربية أصيلة، مستمدة من 'الميثاق الشعبي' الذي هو نفسُه مصدر تسمية الحركة.
        يؤيدها توثيق المورد الحديث لـ'الميثاقية' بوصفها الاسم العربي المعتمد لحركة Chartism.
        الجذر وثق موثَّق في مقاييس اللغة بمعنى العقد والإحكام، والميثاق = العهد المحكم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يحمل دلالة عربية شفافة مستمدة من الميثاق (العهد المحكم)، يُعرِّف القارئ العربي بطبيعة الحركة الإصلاحية دون حاجة إلى معرفة الأصل الإنجليزي"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مِيثَاقِيّ"

    - lemma: "مُصْلِحٌ عُمَّالِيّ"
      source: stage1
      decision: removed
      decision_reason: "فشل اختبار السكّ: يمكن إبدال 'عمالي' بصفة أخرى (اجتماعي، سياسي، اقتصادي) دون أن يفقد الوصف صلاحيته — عبارة وصفية حرة لا مصطلح مسكوك. كذلك فشل اختبار التثبيت المعجمي: لا يرد في أي معجم بوصفه وحدة معجمية ثابتة."

    - lemma: "وَثِيقِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية. اللفظ محتمل اللبس مع المعنى القانوني/الإداري (وثيقة = document, certificate)، فضلاً عن أن مِيثَاقِيّ أدق دلالةً وأقوى سنداً، إذ الميثاق هو المصطلح المعتمد في المعاجم العربية الحديثة لـ Charter."


