# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset : awn4-10733335-n  |  ILI: i93670  |  POS: n
# OEWN   : toastmaster / symposiarch
# التعريف: الشخص الذي يقترح الأنخاب ويقدم المتحدثين في مأدبة
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (أعمى — بدون اطلاع على اللمّات) ──
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمّتين الحاليتين عبارتان مركبتان (MWE إضافيتان) — لا توجد لمّة مفردة تُغطي الدلالة"
      - "اللمّتان مُسجَّلتان بغير تشكيل كامل في السجل الحالي"
      - "«مُقَدِّم» تعني العارض/المقدِّم وليس المقترح تحديداً — ثمة فارق دقيق بين تقديم الأنخاب واقتراحها"
      - "«الأنخاب» في لمّة «مقدم الأنخاب» تُعيد كلمةً واردةً في التعريف ذاته"
    observations: >
      المجموعة تصف وظيفةً اجتماعيةً خاصة بالمآدب الرسمية: شخص يترأس الوليمة ويقترح رفع الكؤوس
      ويُعرِّف بالمتحدثين. في التراث العربي يقابله «العريف»: القيِّم بأمر القوم وسيدهم المعروف
      بينهم. أما المصطلح الإنجليزي symposiarch فيحيل إلى التقليد اليوناني (رئيس الندوة/الوليمة).
      يكشف الجسر الإنجليزي عن استخدام «رئيس الوليمة» للمصطلح اليوناني، و«مدير المراسم؛
      رئيس التشريفات» للمصطلح المعاصر، مما يُثبت أن العربية المعاصرة تلجأ إلى المركَّبات الإضافية
      لهذا المفهوم. الأسلوب الأكثر توفُّقاً هو المركَّب الإضافي الذي يُحدِّد وظيفة الشخص.
  blind_candidates:
    - lemma: "النَّاخِبُ"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن فاعل من الجذر (ن خ ب)؛ النَّخَب في العربية هو رفع الكأس تكريماً.
        أثبت أبو زيد: «النَّخْبَةُ الشَّرْبَةُ الْعَظِيمَةُ»، وجاء في المورد الحديث: «يشرب
        نخب فلان». فالنَّاخِبُ على هذا: من يرفع الكأس ويقترح الأنخاب في الوليمة.
    - lemma: "الصَّدِيرُ"
      generation_method: majaz
      justification: >
        مجاز من «صَدَرَ» (تصدَّر القوم وترأسهم)؛ الصَّدِيرُ على وزن فَعِيل: من يتصدَّر
        المجلسَ ويتربَّع في مقدِّمته. يُعبِّر بالمجاز عن دور الترأس والقيادة في الوليمة،
        من قبيل الإزاحة الدلالية من معنى الاحتلال الجسماني للصدر إلى الرئاسة الاجتماعية.
    - lemma: "رَبُّ الوَلِيمَةِ"
      generation_method: tarkib
      justification: >
        مركَّب إضافي: رَبّ (صاحب الشيء وسيده) + الوليمة (طعام الدعوة والمأدبة). يُعبِّر
        عن السيادة والمسؤولية في إدارة الوليمة وإقامتها، على نحو ما يُقال «رب الدار».
    - lemma: "سَيِّدُ الضِّيَافَةِ"
      generation_method: tarkib
      justification: >
        مركَّب إضافي: سيِّد (الرئيس والمتقدِّم) + الضيافة (حسن الاستقبال وتقديم الطعام
        للضيوف). يُبرز دور الزعامة والقيادة في مناسبات الضيافة الرسمية.


# ── المرحلة ٢: جمع الأدلة (استعلامات قاعدة البيانات) ──────────
# الاستعلامات المنفَّذة:
#   Q1 — مطابقة دفعية: عريف، مقدم، الناخب، الصدير (+ صيغ ال-)
#   Q2 — جسر إنجليزي: toastmaster، symposiarch، master of ceremonies، compere
#   Q3 — إثراء بالمعرّف (تعريفات + شواهد): IDs 18635، 877936، 55074، 28767، 885336
#   Q4 — FTS كلمات مفتاحية: مأدبة، نخب، وليمة
#   Q5 — مقاييس اللغة (dictionary_id=151): عرف، قدم، نخب، صدر، ولم، أدب
stage2_evidence:
  per_lemma:

    - lemma: "عريف المأدبة"
      confirm:
        - text: "«العارفُ العالم بالشيء القَيّمُ بأمر القوم وسيدهم»"
          source: "المعجم الوسيط (OCR، مجمع اللغة العربية)"
        - text: "«(العريف) الْعَارِف الْعَالم بالشَّيْء والقيم بِأَمْر الْقَوْم وسيدهم (ج) عرفاء»"
          source: "المعجم الوسيط (hawramani)"
        - text: "«فَأَمَّا الْعَرِيفُ فَقَالَ الْخَلِيلُ: هُوَ الْقَيِّمُ بِأَمْرِ قَوْمٍ قَدْ عَرَفَ عَلَيْهِمْ. وَإِنَّمَا سُمِّيَ عَرِيفًا لِأَنَّهُ عُرِفَ بِذَلِكَ»"
          source: "مقاييس اللغة لابن فارس (جذر عرف)"
        - text: "«الْأَدْبُ أَنْ تَجْمَعَ النَّاسَ إِلَى طَعَامِكَ. وَهِيَ الْمَأْدَبَةُ وَالْمَأْدُبَةُ. وَالْآدِبُ الدَّاعِي»"
          source: "مقاييس اللغة لابن فارس (جذر أدب)"
      expands:
        - text: "«عريف» — translation_en: prefect — domain: Education"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "يُثبت المصطلح في سياق التربية والإدارة بمعنى القيِّم والمسؤول — يوسِّع دلالة القيادة"

    - lemma: "مقدم الأنخاب"
      confirm:
        - text: "«مقدِّم» — translation_en: host — domain: Information and Communication"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«مقدِّم» — translation_en: presenter — domain: Information and Communication"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
        - text: "«(1) صِحّة (2) ازدهار؛ رخاء (3) نخب.» — translation_en: health"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن «نخب» في العربية يُقابل health/toast في الإنجليزية — يُعزِّز الأنخاب = الكؤوس المرفوعة تكريماً"
      expands:
        - text: "«مقدِّم: المذيع الرئيس الذي يقدِّم نشرة الأخبار المتلفزة» — translation_en: anchorperson (TV)"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "يُبيِّن أن «مُقدِّم» في الاستعمال المعاصر = من يُدير ويقدِّم برنامجاً أمام جمهور"
        - text: "«(3) يشرب نخب فلان.» — translation_en: imbibe"
          source: "المورد الحديث (2008)"
          addition: "يُثبت أن «نخب» في العربية يعني الشراب الذي يُرفع تكريماً لشخص ما"
        - text: "«الْقَافُ وَالدَّالُ وَالْمِيمُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى سَبْقٍ وَرَعْفٍ... وَمُقَدِّمَةُ الْجَيْشِ: أَوَّلُهُ»"
          source: "مقاييس اللغة لابن فارس (جذر قدم)"
          addition: "يُثبت أن جذر قدم يدل على التقدُّم والأسبقية — يُعزِّز معنى الريادة في المُقَدِّم"

    - lemma: "النَّاخِبُ"
      contradicts:
        - text: "«النَّاخِبُ: المُنتَخِب»"
          source: "المعجم الوسيط (OCR، مجمع اللغة العربية)"
          conflict: "«الناخب» في العربية المعاصرة يعني «المُنتخِب» (الناخب في الانتخابات) لا «من يقترح الأنخاب»؛ الجذر نخب الدالّ على الشراب ليس هو المستوعَب في صيغة فاعل في الاستعمال المعاصر"
        - text: "«(الناخب) الْمُنْتَخب»"
          source: "المعجم الوسيط (hawramani)"
          conflict: "تأكيد صريح: الناخب = المنتخِب (voter/elector) لا المُنخِّب بالكأس"

    - lemma: "الصَّدِيرُ"
      contradicts:
        - text: "«الصَّدِيرُ: أعلى الوادى»"
          source: "المعجم الكبير (OCR، مجمع اللغة العربية)"
          conflict: "الصَّدِير في المعاجم = أعلى الوادي (جُغرافيا) لا المترأِّس أو رئيس المجلس؛ الصيغة فَعِيل من صدر لا تحمل معنى الترأُّس الاجتماعي"
        - text: "«سَقَيْتُ بِدُعْثُورٍ فَعَافَتْ نِطَافَهُ * إِلَى مَنْهَلٍ عَنْ ذِي صَدِيرٍ مُعَانِدِ» (بشار بن برد)"
          source: "المعجم الكبير — شاهد شعري"
          conflict: "يُثبت الشاهد الشعري أن صَدِيراً = موضع مرتفع في الوادي، لا علاقة له بالترأُّس الاجتماعي"

    - lemma: "رَبُّ الوَلِيمَةِ"
      evidence_status: "no_material_found"

    - lemma: "سَيِّدُ الضِّيَافَةِ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "عريف المأدبة"
      decision: confirmed
      decision_reason: >
        العَرِيف لغةً هو القيِّم بأمر القوم وسيدهم المعروف بينهم (المعجم الوسيط والمقاييس)،
        وهو التوصيف الأدق لمن يترأس الوليمة ويعرِّف بالحاضرين ويُحكم مجرياتها.
        المُركَّب الإضافي «عَرِيفُ المَأْدَبَة» مُثبَتٌ بنية وتركيباً، والمأدبة مُثبَتة
        في المقاييس (جذر أدب: أن تجمع الناس إلى طعامك). تحتاج اللمّة إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز هذا المصطلح الجانبَ القياديَّ والاجتماعيَّ: العَرِيف هو «السيد المعروف بين
        قومه القيِّم بأمرهم»، فالتركيز على المكانة والمعرفة بالحضور والإشراف العام على
        مجريات الوليمة أكثر من التركيز على فعل رفع الكؤوس بذاته.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "عَرِيفُ الْمَأْدَبَةِ"

    - lemma: "مقدم الأنخاب"
      decision: confirmed
      decision_reason: >
        مُقَدِّم (اسم فاعل من قدَّم) = من يُقدِّم ويعرض؛ وهو موثَّق بمعنى المُقدِّم
        والمُضيف (host/presenter) في المعاجم المعاصرة. الأنخاب = الكؤوس المرفوعة
        تكريماً (نخب)، وقد ثبت في المورد الحديث: «يشرب نخب فلان» = يرفع كأسه
        تكريماً له. المُركَّب «مُقَدِّمُ الأنخاب» مُحكَمٌ دلالياً وتركيبياً.
        تحتاج اللمّة إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُبرز هذا المصطلح الفعلَ الطقوسيَّ المحدَّد: رفع الأنخاب وتقديمها للحضور.
        التركيز على الوظيفة الاحتفالية (اقتراح الأنخاب ورفع الكؤوس) بدلاً من
        المكانة الاجتماعية، مما يجعله الأدق في السياقات التشريفية الرسمية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُقَدِّمُ الْأَنْخَابِ"

    - lemma: "النَّاخِبُ"
      source: stage1
      decision: removed
      decision_reason: >
        «الناخب» مُستقرٌّ في العربية المعاصرة بمعنى «المُنتخِب» (voter/elector) حصراً،
        وقد أثبته المعجم الوسيط صراحةً. استخدامه بمعنى «من يقترح الأنخاب» سيُنتج
        اشتراكاً لفظياً حاداً مع المصطلح الانتخابي الراسخ. لا يصلح مرشَّحاً.

    - lemma: "الصَّدِيرُ"
      source: stage1
      decision: removed
      decision_reason: >
        الصَّدِير في المعاجم المُثبتة = أعلى الوادي (موضع جغرافي)، ولا يُفيد
        الترأُّس الاجتماعي. الشاهد الشعري لبشّار بن برد يُؤكِّد هذه الدلالة
        الجغرافية. المجاز المقترح ليس مستعملاً في أي نص معجمي.

    - lemma: "رَبُّ الوَلِيمَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُوجَد أي شاهد معجمي للمركَّب. «رَبُّ X» يعني صاحب ومالك X بصفة عامة،
        مما يجعله أقرب إلى «صاحب الوليمة» (المضيف) لا «من يترأسها ويقترح أنخابها».
        والوليمة في الأصل طعام عُرس لا مأدبة رسمية.

    - lemma: "سَيِّدُ الضِّيَافَةِ"
      source: stage1
      decision: removed
      decision_reason: >
        لا شاهد معجمي للمركَّب. «سيِّد الضيافة» دلالتُه عامة جداً (أي مضيف كريم)
        ولا يُميِّز الوظيفتين المحدَّدتين (اقتراح الأنخاب وتقديم المتحدثين).


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
