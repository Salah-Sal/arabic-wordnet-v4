# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:

  assessment:
    concerns:
      - "اللمّة 'غزّال' خالية من التشكيل الكامل في قاعدة البيانات، مما يُفضي إلى اشتراك لفظي مع 'غَزَال' (ولد الظبية) عند غياب الشدّة"
      - "المجموعة تقتصر على لمّة واحدة؛ يُستحسن البحث عن مرادفات مستعملة"
      - "التعريف الحالي يستخدم القوسين لإدراج الفصل النوعي، وهو أسلوب غير متعارف عليه في المعجمية الرسمية"
    observations: >
      تُحيل هذه المجموعة إلى حِرفة يدوية أصيلة في التراث العربي والإسلامي، وهي الغَزْل، أي تحويل
      الألياف الخام (قطن أو صوف أو كتان) إلى خيوط بالمدّ والبَرْم حول المِغْزَل. الجذر (غ-ز-ل) خصيب
      في العربية: غَزَلَ (فعل)، غَزْل (مصدر)، مِغْزَل (آلة)، غَزَّال (صانع)، غَزَّالة (آنثى الصانع /
      العنكبوت). وزن فَعَّال للمهن والحِرَف شائع وقياسي (نجّار، حدّاد، نسّاج)، مما يجعل "غَزَّال"
      الخيار الأمثل لهذا المفهوم. لا لبس في المفهوم، لكن التشكيل ضروري للتمييز من غَزَال (الظبي).

  blind_candidates:
    - lemma: "غَزَّال"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من الجذر (غ-ز-ل) يُفيد الاحتراف والمداومة؛ وهو القياس المتّبع في العربية
        لأسماء الحِرَف (نجّار، حدّاد، خبّاز). غَزَّال = من حِرفته الغَزْل، أي تحويل الألياف
        إلى خيوط بالمغزل.

    - lemma: "غَازِل"
      generation_method: ishtiqaq
      justification: >
        اسم الفاعل (فاعِل) من غَزَلَ يَغْزِلُ؛ يُفيد الحدث الجاري أو الوصف، ويصلح للدلالة على
        من يُمارس الغزل في لحظة بعينها أو بوصفه نشاطاً دون اشتراط الاحتراف.

    - lemma: "فَتَّال"
      generation_method: ishtiqaq
      justification: >
        وزن فَعَّال من الجذر (ف-ت-ل) الدالّ على اللَّيّ والبَرْم؛ والبَرْم (الفَتْل) حركة أساسية
        في عملية الغزل. فَتَّال = من يُكثر الفَتْل والبَرْم، وقد يُستعمل للغزّال بمعنى من يُبرم
        الألياف.

    - lemma: "صَانِع الغَزْل"
      generation_method: tarkib
      justification: >
        مركّب إضافي شفّاف: صَانِع (جنس) + الغَزْل (فصل)؛ يُعرِّف المفهوم تعريفاً صريحاً
        خالياً من اللبس، ويوازي المصطلح الإنجليزي "thread maker" الوارد في OEWN.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:

  per_lemma:

    - lemma: "غَزَّال"
      confirm:
        - text: "«غَزَّال: من يغزل باليد. (بوشر، الكامل ص230) ومن يغزل الصوف (صفة مصر 18، قسم 2 ص380) والأنثى غَزَّالة، وهي التي تتخذ الغزل حرفة لها.»"
          source: "تكملة المعاجم العربية لرينهارت دوزي (hawramani، entry_id=846730)"
        - text: "«غَزَّال: من (غ ز ل) صانع الغزل وبائعه، والكثير التودد بمحادثة النساء.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry_id=936765)"
        - text: "«(1) الغَزّالة: امرأة حِرفتُها الغَزْل (2) العانس.»"
          source: "المورد الحديث — ترجمة spinster (entry_id=719130)"
      contradicts:
        - text: "«الغَزَّالُ: ولد الظبية»، جمعه: غِزْلَة وغِزْلَان"
          source: "المعجم الوسيط — إصدار OCR (entry_id=20536)"
          conflict: >
            هذا المدخل في الوسيط يُعرِّف «الغَزَال» (ولد الظبية، بدون شدّة على الزاي)، وليس
            «الغَزَّال» (صانع الغزل، بالشدّة)؛ والجموع غِزْلَة وغِزْلَان هي جموع الغزال (الظبي)
            لا جموع الغَزَّال (الصانع). الأرجح أن المعالجة الرقمية دمجت المدخلَيْن بسبب التطبيع
            الصوتي (headword_norm = 'الغزال' في الحالتين).
      expands:
        - text: "«غَزَّالة: عنكبوت. (هلو) — غَزَّالة، وجمعها غزازل: قطعة صغيرة مخروطية الشكل في نهاية المغزل. (ألكالا)»"
          source: "تكملة المعاجم العربية لدوزي (entry_id=846730)"
          addition: >
            الصيغة المؤنثة غَزَّالة تحمل معاني تاريخية إضافية: العنكبوت (لأنه يغزل خيطه)،
            والقطعة المخروطية في نهاية المغزل — مما يُثبت أصالة الاشتقاق من غَزْل.
        - text: "«(1) فا spin، مثل: الغازل؛ الناسج إلخ»"
          source: "المورد الحديث — ترجمة spinner (entry_id=719117)"
          addition: >
            يُذكر «الغازل» كمثال على ترجمة spinner، مما يُشير إلى قبول هذه الصيغة في المعجمية
            الحديثة دون أن تكون المصطلح الأوّل.

    - lemma: "غَازِل"
      confirm:
        - text: "«(1) فا spin، مثل: الغازل؛ الناسج إلخ»"
          source: "المورد الحديث — ترجمة spinner (entry_id=719117)"
      contradicts:
        - text: "«غازل المرأة: حادثها وتودد إليها وفلان الأربعين: دنا منها»"
          source: "المعجم الوسيط — نسخة hawramani (entry_id=897233)"
          conflict: >
            المعنى المعجمي الراسخ لـ«غازل» في العربية المعاصرة والكلاسيكية هو التودد والمغازلة،
            لا الغزل النسيجي؛ استعماله للدلالة على غازل الألياف نادر وملتبس.

    - lemma: "فَتَّال"
      expands:
        - text: "«فَتَّال: من (ف ت ل) الكثير اللوى والبرم، والمصروف عن رأيه، والفتِّال: البلبل.»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry_id=937472)"
          addition: >
            المعنى اللغوي «كثير اللوى والبرم» يُلامس عملية الغزل من جهة البرم، لكن المعنى المعجمي
            المستقرّ ليس «غازل الألياف».
        - text: "«الفاء والتاء واللام أصل صحيح يدل على لي شيء. من ذلك: فتلتُ الحبلَ وغيره. والفتيل: ما يكون في شق النواة كأنه قد فُتل.»"
          source: "مقاييس اللغة لابن فارس (dictionary_id=151)"
          addition: >
            الجذر (ف-ت-ل) يدل على اللَّيّ الأصيل، وهو حركة تُشبه البَرْم في الغزل، لكن التوثيق
            المعجمي لا يُثبت استعمال «فتّال» للغازل المهني.

    - lemma: "صَانِع الغَزْل"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:

  per_lemma:

    - lemma: "غزّال"
      decision: confirmed
      decision_reason: >
        اللمّة موثّقة في معجمين متخصصَيْن (دوزي، موسوعة السلطان قابوس) بالمعنى الدقيق لصانع الغزل
        اليدوي. وزن فَعَّال قياسي للحِرَف. لا تعارض حقيقي مع الشاهد الوسيطي لأنه يتعلق بمدخل
        مختلف (الغزال = الظبي). اللمّة تحتاج ضبط تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللمّة الوحيدة المؤكدة في المجموعة؛ تحمل دلالة الاحتراف والمهنية (وزن فَعَّال)، وقد تشمل
        بيع الغزل لا إنتاجه فقط. تُميّزها عن غَازِل (الوصف الظرفي) بإفادتها الحِرفة الدائمة.
      morphology_check:
        pattern: "فَعَّال"
        function_fit: >
          وزن فَعَّال مناسب تمامًا للدلالة على حِرفة صاحبها (مثل: نجّار، خبّاز، حدّاد)؛
          يُفيد الاشتغال المستمر بالغَزْل.
        borrowing_check:
          lexical: native
          calque: false
        quality_gate:
          ittiraad: true
          yusr: true
          mulaama: true
          turaathi: true
          arabi: true
          ishtiqaaqiyya: true
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "غَزَّال"
        - command: add_form
          params:
            entry_id: "{auto}"
            written_form: "غَزَّالة"

    - lemma: "غَازِل"
      source: stage1
      decision: removed
      decision_reason: >
        المعنى المعجمي الراسخ لـ«غازل» في الاستعمال العربي المعاصر والكلاسيكي هو من يُغازل المرأة
        (يتودد إليها ويحادثها)، لا من يُمارس الغَزْل النسيجي. ذكره في المورد الحديث ترجمةً لـspinner
        لا يرقى إلى التثبيت المعجمي ويُسبّب لبساً. وجود غَزَّال يُغني عنه.
      evidence_assessment:
        case: mixed

    - lemma: "فَتَّال"
      source: stage1
      decision: removed
      decision_reason: >
        المعجمية لا تُثبت استعمال «فتّال» للغازل المهني؛ معانيه الراسخة: كثير اللوى والبرم
        (بالمعنى المجازي)، ومن يُصرَف عن رأيه، والبُلبُل. التداخل مع معنى الغزل طرفي
        ولا يُسوِّغ اعتماده مصطلحاً.
      evidence_assessment:
        case: no_material

    - lemma: "صَانِع الغَزْل"
      source: stage1
      decision: removed
      decision_reason: >
        عبارة وصفية حرة لا تجتاز اختبار السكّ المعجمي: يمكن إبدال «الغزل» بـ«الخيوط» أو «الصوف»
        وتظل صالحة وصفاً، مما يعني أنها ليست وحدة معجمية ثابتة. كما أن «صانع الغزل» ورد في
        التعريف وصفاً لغَزَّال لا مصطلحاً مستقلاً.
      evidence_assessment:
        case: no_material


