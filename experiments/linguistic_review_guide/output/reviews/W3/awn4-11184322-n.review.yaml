# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11184322-n  |  ILI: i96161  |  POS: n
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "POS المجموعة مسجَّل كـ n (اسم عام)، غير أن المجموعة تمثّل علَماً شخصياً؛ يجب تعديله إلى proper_noun"
      - "التعريف العربي لا يُشير إلى سنة الوفاة (2006)، في حين تُحيل النسخة الإنجليزية إلى 'born in 1930' فقط دون إكمال الترجمة الزمنية"
      - "صيغة 'ميداليات ذهبية' (جمع) غير دقيقة؛ الصواب 'ميداليتَيْن ذهبيتَيْن' لأن الفوز كان في دورتين أولمبيتين فقط (1948 و1952)"
      - "الاسم القانوني الكامل 'روبرت بروس ماثياس' (Robert Bruce Mathias) مذكور في اللمّات الإنجليزية لكنه غائب عن الجانب العربي"
      - "لمّتا المجموعة لا تحملان تشكيلاً كاملاً"
    observations: >
      تمثّل هذه المجموعة علَماً شخصياً لرياضي أمريكي بارز في رياضة العَشَارِيّ؛ وكل لمّاتها المناسبة
      ستكون تعريبات صوتية للأسماء الأجنبية لا اشتقاقات عربية، إذ لا يمكن ترجمة الأعلام الشخصية ولا
      استبدالها. يجب مراجعة POS على مستوى المجموعة والمدخلات معاً. التعريف بحاجة إلى تدقيق فعلي
      في البيانات التاريخية (عدد الميداليات، سنة الوفاة). ويُلاحظ أن الكنية المنفردة "ماثياس" كافية
      كلمّة مستقلة لأنها تُحيل وحدها إلى الشخص في السياقات التي سبق فيها ذكر الاسم الكامل.

  blind_candidates:
    - lemma: "بُوبْ مَاثْيَاس"
      generation_method: taarib
      justification: >
        تعريب للاسم الأكثر شيوعاً للرياضي في المصادر الإنجليزية والعربية؛ الاسم الأول بوب (Bob)
        والكنية ماثياس (Mathias). هذا هو الاسم الذي يُعرَّف به في الإعلام الرياضي.
    - lemma: "مَاثْيَاس"
      generation_method: taarib
      justification: >
        تعريب الكنية (اللقب) منفردةً، تُستعمل اختصاراً في النصوص التي سبق فيها ذكر الاسم الكامل،
        وهو نمط شائع في التداول الرياضي والصحفي.
    - lemma: "رُوبِرْت مَاثْيَاس"
      generation_method: taarib
      justification: >
        تعريب للاسم الرسمي المكوَّن من الاسم الأول الرسمي (Robert) والكنية، يُستخدم في السياقات
        الرسمية والوثائقية.
    - lemma: "رُوبِرْت بْرُوسْ مَاثْيَاس"
      generation_method: taarib
      justification: >
        تعريب للاسم القانوني الكامل ثلاثي الأجزاء (Robert Bruce Mathias)، يُستخدم في الموسوعات
        والمراجع الأكاديمية عند الإشارة الأولى الرسمية إلى الشخص.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات مُنفَّذة:
#   ١. بحث دفعي بالمطابقة الدقيقة: بوب ماثياس، ماثياس، بوب (+ صيغ ال-)
#   ٢. جسر إنجليزي: Mathias، Bob Mathias، decathlon، Robert Mathias
# الملاحظة: لا توجد مداخل في قاعدة البيانات للأعلام الشخصية الأجنبية المعرَّبة.
#   نتيجة الاستعلام الأول: مداخل غير ذات صلة (بوب = باب/فلاة؛ البوب = قرية مصرية).
#   نتيجة الجسر الإنجليزي: مدخل ARABTERM للفظ "decathlon" → "العَشَارِيّ" — لا صلة بالعلَم الشخصي.
stage2_evidence:
  per_lemma:
    - lemma: "بُوبْ مَاثْيَاس"
      evidence_status: "no_material_found"

    - lemma: "مَاثْيَاس"
      evidence_status: "no_material_found"

    - lemma: "رُوبِرْت مَاثْيَاس"
      evidence_status: "no_material_found"

    - lemma: "رُوبِرْت بْرُوسْ مَاثْيَاس"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── لمّة موجودة: بوب ماثياس ──
    - lemma: "بُوبْ مَاثْيَاس"
      decision: confirmed
      decision_reason: >
        الاسم الأكثر تداولاً للرياضي في المصادر العربية والإنجليزية على حدٍّ سواء؛ يجمع الاسم الأول
        والكنية ويُحدّد الشخص دون لبس. اللمّة صحيحة من حيث التعريب وإن كانت تحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الاسم الكامل المشهور به الرياضي في الإعلام الرياضي؛ يُفضَّل في السياقات الموسوعية والإعلامية
        حيث يُراد تمييز الشخص بوضوح في أول ذكر له.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُوبْ مَاثْيَاس"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── لمّة موجودة: ماثياس ──
    - lemma: "مَاثْيَاس"
      decision: confirmed
      decision_reason: >
        الكنية المنفردة مقبولة كلمّة مستقلة لأنها تُحيل بمفردها إلى الشخص ذاته في السياقات التي
        ذُكر فيها الاسم الكامل من قبل، وهو نمط معجمي مُعتمَد في الأعلام الشخصية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الكنية (اللقب العائلي) منفردةً، تُستعمل اختصاراً بعد الإشارة الأولى إلى الاسم الكامل،
        أو في السياقات غير الرسمية والرياضية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَاثْيَاس"
        - command: update_entry
          params:
            entry_id: "{auto}"
            pos: proper_noun

    # ── مرشح المرحلة ١: روبرت ماثياس — مرفوض ──
    - lemma: "رُوبِرْت مَاثْيَاس"
      source: stage1
      decision: removed
      decision_reason: >
        هذا الشكل الثنائي (دون الاسم الأوسط بروس) أقل دقةً وشيوعاً؛ ولا يُضيف شيئاً على "بوب ماثياس"
        بل يُربك القارئ لأن "روبرت" اسم رسمي غير مألوف في هذا السياق الرياضي. يُغني عنه إضافة
        الاسم القانوني الكامل "رُوبِرْت بْرُوسْ مَاثْيَاس".

    # ── مرشح المرحلة ١: روبرت بروس ماثياس — مقبول ──
    - lemma: "رُوبِرْت بْرُوسْ مَاثْيَاس"
      source: stage1
      decision: confirmed
      decision_reason: >
        الاسم القانوني الكامل للشخص مذكور في اللمّات الإنجليزية (Robert Bruce Mathias)؛ ضروري
        للاكتمال الموسوعي وللتمييز عند التوثيق الرسمي. إضافته تُقابل النظير الإنجليزي الغائب
        من النسخة العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: >
        الاسم الرسمي القانوني الكامل بثلاثة أجزاء؛ يُستخدم في الموسوعات والوثائق الأكاديمية
        وعند الإشارة الرسمية الأولى إلى الشخص في النصوص المتخصصة.
      actions:
        - command: create_entry
          params: {lemma: "رُوبِرْت بْرُوسْ مَاثْيَاس", pos: proper_noun}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

  synset_actions:
    - command: update_synset
      params: {synset_id: "{synset_id}", pos: proper_noun}


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "رياضي أمريكي فاز بميداليات ذهبية أولمبية في العشاري (ولد عام 1930)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي يعاني من أربع إشكاليات: (١) "ميداليات" بصيغة الجمع غير دقيقة، والصواب
        "ميداليتَيْن" لأن الفوز كان في دورتَيْن فقط (1948 لندن، 1952 هلسنكي). (٢) غياب سنة
        الوفاة (2006) اللازمة للتعريف الموسوعي. (٣) مصطلح "العشاري" بدون تعريف فصيح مشكّل.
        (٤) الأسلوب يفتقر إلى الطابع الموسوعي الضروري لمداخل الأعلام الشخصية.
    authored:
      - type: encyclopedic
        text: >
          رياضيٌّ أمريكيٌّ اشتُهر بفوزه بالميداليتين الذهبيتين في رياضة العَشَارِيّ في الألعاب
          الأولمبية عامَي 1948 (لندن) و1952 (هلسنكي)؛ وُلد عام 1930 وتُوفي عام 2006.
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: >
            رياضيٌّ أمريكيٌّ اشتُهر بفوزه بالميداليتين الذهبيتين في رياضة العَشَارِيّ في الألعاب
            الأولمبية عامَي 1948 (لندن) و1952 (هلسنكي)؛ وُلد عام 1930 وتُوفي عام 2006.

  examples:
    per_lemma:
      - lemma: "بُوبْ مَاثْيَاس"
        examples:
          - text: >
              يُعدُّ بُوبْ مَاثْيَاس أصغر رياضي فاز بذهبية العَشَارِيّ في تاريخ الأولمبياد،
              إذ أحرز ميداليته الأولى عام 1948 ولم يتجاوز السابعة عشرة من عمره.
            type: usage

      - lemma: "مَاثْيَاس"
        examples:
          - text: >
              أثبت مَاثْيَاس تميُّزاً استثنائياً حين دافع عن لقبه الأولمبي في العَشَارِيّ عام 1952
              ليصبح من بين القلائل الذين حافظوا على ذهبيتهم في هذه الرياضة الشاقة.
            type: usage

      - lemma: "رُوبِرْت بْرُوسْ مَاثْيَاس"
        examples:
          - text: >
              وُلد رُوبِرْت بْرُوسْ مَاثْيَاس في ولاية كاليفورنيا عام 1930، وخاض أولى مباريات
              العَشَارِيّ قبل أشهر قليلة من فوزه بالميدالية الذهبية الأولمبية.
            type: usage

    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            يُعدُّ بُوبْ مَاثْيَاس أصغر رياضي فاز بذهبية العَشَارِيّ في تاريخ الأولمبياد،
            إذ أحرز ميداليته الأولى عام 1948 ولم يتجاوز السابعة عشرة من عمره.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            أثبت مَاثْيَاس تميُّزاً استثنائياً حين دافع عن لقبه الأولمبي في العَشَارِيّ عام 1952
            ليصبح من بين القلائل الذين حافظوا على ذهبيتهم في هذه الرياضة الشاقة.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            وُلد رُوبِرْت بْرُوسْ مَاثْيَاس في ولاية كاليفورنيا عام 1930، وخاض أولى مباريات
            العَشَارِيّ قبل أشهر قليلة من فوزه بالميدالية الذهبية الأولمبية.


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ──────────────────
# ملاحظة: جميع لمّات هذه المجموعة تعريبات صوتية لأسماء أجنبية؛
# لا تنتمي إلى جذور عربية، لذا تُحذف حقول root وmaqayis_quote (DRY).
stage5_enrichment:
  per_entry:
    - lemma: "بُوبْ مَاثْيَاس"
      entry_id: "{auto}"

    - lemma: "مَاثْيَاس"
      entry_id: "{auto}"

    - lemma: "رُوبِرْت بْرُوسْ مَاثْيَاس"
      entry_id: "{auto}"

  per_sense:
    - lemma: "بُوبْ مَاثْيَاس"
      sense_id: "{auto}"
      nuance: >
        الاسم الكامل المشهور به الرياضي في الإعلام والأدبيات الرياضية؛ يُستخدم في أول ذكر له
        وفي السياقات الموسوعية والإعلامية.
      mwe: true

    - lemma: "مَاثْيَاس"
      sense_id: "{auto}"
      nuance: >
        الكنية (اللقب العائلي) منفردةً؛ تُستعمل اختصاراً بعد الإشارة الأولى إلى الاسم الكامل،
        أو في السياقات الصحفية غير الرسمية.

    - lemma: "رُوبِرْت بْرُوسْ مَاثْيَاس"
      sense_id: "{auto}"
      nuance: >
        الاسم الرسمي القانوني الكامل بثلاثة أجزاء؛ يُستخدم في الموسوعات والوثائق الأكاديمية
        وفي الإشارة الرسمية الأولى إلى الشخص في النصوص المتخصصة.
      mwe: true

  synset:
    cultural_fit: omission

  actions:
    # ── بيانات المدخلات (لا جذر عربي لأسماء التعريب) ──
    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"no_root":true,"transliteration_of":"Bob Mathias","lang_source":"en"}'

    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"no_root":true,"transliteration_of":"Mathias","lang_source":"en"}'

    - command: set_metadata
      params:
        entity_type: entry
        entity_id: "{auto}"
        key: note
        value: '{"no_root":true,"transliteration_of":"Robert Bruce Mathias","lang_source":"en"}'

    # ── بيانات المعاني (nuance + mwe) ──
    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الكامل المشهور به الرياضي في الإعلام والأدبيات الرياضية","mwe":true}'

    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الكنية منفردةً؛ تُستعمل اختصاراً بعد الإشارة الأولى إلى الاسم الكامل","mwe":false}'

    - command: set_metadata
      params:
        entity_type: sense
        entity_id: "{auto}"
        key: note
        value: '{"nuance":"الاسم الرسمي القانوني الكامل؛ يُستخدم في الموسوعات والوثائق الأكاديمية","mwe":true}'

    # ── بيانات المجموعة ──
    - command: set_metadata
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        key: note
        value: '{"cultural_fit":"omission"}'

    - command: set_confidence
      params:
        entity_type: synset
        entity_id: "{synset_id}"
        score: 0.75
