      terms_searched:
        - "Soufflot"
        - "Jacques-Germain Soufflot"
        - "Jacques Germain Soufflot"
      result: "لا نتائج — no_material_found"

    - query_id: 3
      type: arabic_fts
      description: "بحث FTS عربي بأسماء الشخص ومصطلح معماري فرنسي"
      terms_searched:
        - "سوفلو"
        - "سوفلوت"
        - "معماري فرنسي"
        - "مهندس معماري فرنسي"
      result: "لا نتائج — no_material_found"

  per_lemma:
    - lemma: "جاك جيرمان سوفلو"
      evidence_status: "no_material_found"

    - lemma: "سوفلو"
      evidence_status: "no_material_found"

    - lemma: "سُوفْلُو"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "جَاكْ سُوفْلُو"
      source: stage1
      evidence_status: "no_material_found"

    - lemma: "جَاكَ جِيرْمَان سُوفْلُو"
