    وتُغطّي أساساً المفردات اللغوية والمصطلحات التقنية والمعرَّبات. اسم
    جاك جيرمان سوفلو اسمٌ فرنسي خالص لمعماريٍّ من القرن الثامن عشر،
    ولا يُتوقع أن يُسجَّل في المعاجم العربية التراثية أو المصطلحية.


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "جاك جيرمان سوفلو"
      decision: confirmed
      decision_reason: >
        هذه اللمّة هي الاسم الكامل الرسمي للمعماري جاك جيرمان سوفلو
        وهي الصيغة الأكثر شيوعاً في المصادر الأكاديمية والموسوعية العربية.
        يجب إضافة التشكيل الكامل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الكامل الثلاثي المقطعي يُستخدم في السياقات الأكاديمية والموسوعية
        حيث يُشترط الإحالة الدقيقة وتمييز المعماري عن غيره ممن يحملون أسماء
        متقاربة؛ هو الصيغة الرسمية المعتمدة في الفهارس والمراجع.
      loan_check:
        type: taarib
        verdict: "مقبول — نقل صوتي لاسم علم أجنبي، وهو الأسلوب الوحيد الممكن."
      term_quality:
        ittiraad: "يتّسق مع التعريب المعتاد للأسماء الفرنسية"
        yusr: "ثقيل النطق نسبياً بسبب طوله لكنه مقبول لأسماء الأعلام"
        mulaama: "يناسب السياق المعجمي والموسوعي"
      morphological_fit: >
        اسم مركّب إضافي من ثلاثة مقاطع معرَّبة؛ لا وزن صرفي عربي مُحدَّد،
        وهو المعهود في تعريب أسماء الأعلام الأجنبية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جَاكَ جِيرْمَان سُوفْلُو"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "سوفلو"
      decision: confirmed
      decision_reason: >
        الاسم الأخير (الكُنية) وحده هو الصيغة المختصرة الأشيع في خطاب العمارة
        والفنون، وقد جرت العادة في المصادر العربية على الاكتفاء بكنية المعماري
        في السياقات غير الرسمية والتحليلية. يجب إضافة التشكيل.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        الكنية المختصرة تُستخدم في النصوص التحليلية والنقدية والصحفية بعد ذكر
        الاسم الكامل أولاً؛ هي اختزال معتاد في خطاب الفنون والعمارة، مقابل
        الاسم الكامل المُستخدَم في الإحالات الموسوعية والمرجعية.
      loan_check:
        type: taarib
        verdict: "مقبول — تعريب الكنية."
      term_quality:
        ittiraad: "متّسق مع تعريب كُنَى الأعلام الفرنسية (كـ'فولتير'، 'مولير')"
        yusr: "خفيف يُداوَل بسهولة"
        mulaama: "يناسب السياق التحليلي والأدبي"
      morphological_fit: >
        مقطع واحد معرَّب ذو بنية (سُو-فْ-لُو)؛ صالح للتنكير والتعريف
        (السوفلو) وللنسبة (السوفلوي) وللجمع المُدمج مع الجمع السالم.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "سُوفْلُو"

    # ── مرشح المرحلة ١ — أ ──
    - lemma: "سُوفْلُو"
      source: stage1
      decision: removed
      decision_reason: >
        هذا المرشح مطابق تماماً للمّة "سوفلو" الموجودة في المجموعة بعد إضافة
        التشكيل، وهو تكرار لا يضيف جديداً.

    # ── مرشح المرحلة ١ — ب ──
    - lemma: "جَاكْ سُوفْلُو"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة الثنائية (اسم أول + كنية) لا تُضيف قيمةً دلالية على ما هو
        موجود: الاسم الكامل "جَاكَ جِيرْمَان سُوفْلُو" موجود، وكذلك الكنية
        "سُوفْلُو" وحدها. والصيغة الثنائية الناقصة قد تُلتبس بأسماء مشتركة
        أخرى تبدأ بـ«جاك».

    # ── مرشح المرحلة ١ — ج ──
    - lemma: "جَاكَ جِيرْمَان سُوفْلُو"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة "جاك جيرمان سوفلو" بعد التشكيل؛ تكرار مرفوض.

    # ── مرشح المرحلة ١ — د ──
    - lemma: "سُوفِلُّو"
      source: stage1
      decision: removed
      decision_reason: >
        هذه الصيغة مع تشديد اللام لا أساس لها في التعريب المعتمد لاسم Soufflot
        في العربية؛ وتضاعف الفاء في الفرنسية (ff) يُنقل عادةً بفاء واحدة مع
        سكون (سُوفْلُو) لا بتشديد لام الكلمة. الصيغة خاطئة صوتياً.

  synset_actions:
    - command: update_synset
      params:
        synset_id: "awn4-11328872-n"
        pos: proper_noun


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:
  definition:
    current: "معماري فرنسي (1713-1780)"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مختزَل إلى مجرد تصنيف مهني وتأريخ ميلادٍ ووفاة،
        وهو ما لا يُميّز هذا المعماري من غيره من المعماريين الفرنسيين في
        الحقبة ذاتها. يفتقر التعريف إلى الجنس القريب والفصل النوعي المُميِّز
        ولا يشير إلى إسهامه المعماري الأبرز (تصميم بانتيون باريس).
    authored:
      - type: encyclopedic
        text: >
          مُعَمَّارٌ فَرَنْسِيٌّ (1713-1780)، أَحَدُ أَبْرَزِ رُوَّادِ الكلاسيكية
          الجديدة في العمارة الأوروبية؛ اشتُهِرَ بتصميمه كنيسة القديس جَنَفْيِيف
          في باريس التي غَدَتْ فيما بعد مَعْلَمَ «البانتيون» الفرنسي الشهير.
          وُلِدَ في إيرنفيل وتُوفِّيَ في باريس وتُعَدُّ أعماله مثالاً رفيعاً
          لتوظيف القِبَابِ الكبيرة والتعاليم الكلاسيكية اليونانية-الرومانية.
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-11328872-n"
          definition_index: 0
          text: >
            مُعَمَّارٌ فَرَنْسِيٌّ (1713-1780)، أَحَدُ رُوَّادِ الكلاسيكية الجديدة
            في العمارة الأوروبية؛ اشتُهِرَ بتصميمه كنيسة القديس جَنَفْيِيف في باريس
            التي غَدَتْ مَعْلَمَ «البانتيون» الفرنسي، وهو نموذج بارز للعمارة
            الكلاسيكية الجديدة في القرن الثامن عشر.

  examples:
    per_lemma:
      - lemma: "جَاكَ جِيرْمَان سُوفْلُو"
        examples:
          - text: >
              صَمَّمَ جَاكَ جِيرْمَان سُوفْلُو كنيسةَ القديس جَنَفْيِيف في باريس
              بِقُبَّتِهَا الشهيرة التي أَرْسَتْ قواعد الأسلوب الكلاسيكي الجديد
              في الفن المعماري الفرنسي.
            type: usage

      - lemma: "سُوفْلُو"
        examples:
          - text: >
              يُعَدُّ سُوفْلُو من أبرز المعماريين في عهد لويس الخامس عشر،
              وقد أَلهَمَ تصميمُهُ للبانتيون أجيالاً من المعماريين الأوروبيين
              الذين آثروا الخطوط الكلاسيكية في عصر التنوير.
            type: usage

    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            صَمَّمَ جَاكَ جِيرْمَان سُوفْلُو كنيسةَ القديس جَنَفْيِيف في باريس
            بِقُبَّتِهَا الشهيرة التي أَرْسَتْ قواعد الأسلوب الكلاسيكي الجديد
            في الفن المعماري الفرنسي.
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: >
            يُعَدُّ سُوفْلُو من أبرز المعماريين في عهد لويس الخامس عشر،
            وقد أَلهَمَ تصميمُهُ للبانتيون أجيالاً من المعماريين الأوروبيين
            الذين آثروا الخطوط الكلاسيكية في عصر التنوير.


