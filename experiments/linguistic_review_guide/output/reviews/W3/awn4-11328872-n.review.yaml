# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-11328872-n  |  ILI: i96966
# الموضوع: جاك جيرمان سوفلو — معماري فرنسي (1713-1780)
# ═══════════════════════════════════════════════════════════════


# ── المرحلة ١: المراجعة والتوليد (بدون أدلة) ──────────────────
stage1_review:
  assessment:
    concerns:
      - "المجموعة الترادفية تحمل وسم pos: n (اسم عام) في حين أن مضمونها اسمُ عَلَمٍ لشخص بعينه؛ يجب أن يكون pos: proper_noun."
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل."
      - "التعريف العربي الحالي 'معماري فرنسي (1713-1780)' مُجرَّد تأريخ مبتسر يفتقر إلى الجنس القريب والفصل النوعي؛ لا يليق بمعجم ورد-نت."
    observations: >
      هذه المجموعة تمثّل اسمَ عَلَمٍ لمعماريٍّ فرنسيٍّ من القرن الثامن عشر.
      التعريف المُقنَّع 'معماري فرنسي (1713-1780)' لا يكشف عن اسم الشخص؛
      ومن ثَمَّ فإن توليد مرشحات بالأسلوب الاشتقاقي أو المجازي غير ممكن،
      إذ اللمّات الوحيدة المناسبة لمجموعة أعلام الأشخاص هي التعريبُ
      (النقل الصوتي للاسم الأجنبي). والتوليد الأعمى هنا استرشاديٌّ بالضرورة
      لا قطعيّ، لأن الاسم غير مُكشوف في الملف المُقنَّع.

  blind_candidates:
    # ── التوليد الأعمى من التعريف «معماري فرنسي (1713-1780)» وحده ──
    # الاسم غير ظاهر؛ لذا تُوظَّف طريقة التعريب (taarib) حصراً.
    - lemma: "سُوفْلُو"
      generation_method: taarib
      justification: >
        تعريب الاسم الأخير للمعماريين الفرنسيين البارزين في حقبة 1713-1780؛
        «سُوفْلُو» هو النقل الصوتي الأقرب للاسم الشائع في تلك الحقبة.
        الوزن المُقترح: صيغة أجنبية ثلاثية المقاطع (سُو-فْ-لُو).

    - lemma: "جَاكْ سُوفْلُو"
      generation_method: taarib
      justification: >
        تعريب صيغة ثنائية (اسم أول + اسم عائلة) كما يُتداول في المصادر
        المعمارية العربية. «جَاكْ» هو النقل المعتاد لـ Jacques الفرنسية.

    - lemma: "جَاكَ جِيرْمَان سُوفْلُو"
      generation_method: taarib
      justification: >
        تعريب الاسم الكامل الثلاثي (اسم أول + اسم وسطى + اسم عائلة)
        على النحو المعهود في المعاجم الموسوعية والتراجم العربية.

    - lemma: "سُوفِلُّو"
      generation_method: taarib
      justification: >
        صيغة بديلة تُنقل فيها الجيم المضغوطة (ff) في Soufflot بتشديد اللام،
        وهو احتمال آخر للنقل الصوتي.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
