# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14007202-n (darkness / night)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "التعريف العربي «ظلام» مطابق للمّة الموجودة في فوق-المجموعة (awn4-14007000-n: ظلام، عتمة)، مما يُحدث دوراناً تعريفياً ولا يميّز هذه المجموعة عن أمّها"
      - "اللمّة الموجودة «ليل» تدلّ على الفترة الزمنية بين المغرب والفجر، لا على مجرّد الظلام؛ فثمّة بُعد زمني يتجاوز المعنى الصرف للظلام"
    observations: "المجموعة تمثّل مفهوم «night» في ووردنت الإنجليزية بوصفه نوعاً خاصّاً من الظلام — ظلام الليل تحديداً. اللمّة «ليل» ملائمة لأنّ المعاجم العربية تُعرّف الليل بأنّه «ما يعقب النهار من الظلام»، فالعلاقة بين الليل والظلام وثيقة. غير أنّ التعريف الحالي يحتاج تنقيحاً ليميّز هذا النوع من الظلام عن الظلام المطلق."

  blind_candidates:
    - lemma: "دُجًى"
      generation_method: majaz
      justification: "من جذر د ج و/ي، يدلّ على ظلمة الليل خاصّةً. لفظ شائع في الشعر والنثر الفصيح."
    - lemma: "حَلَك"
      generation_method: ishtiqaq
      justification: "من جذر ح ل ك، يدلّ على شدّة السواد، وقد يُستعار للظلام الحالك."
    - lemma: "غَسَق"
      generation_method: ishtiqaq
      justification: "من جذر غ س ق، يدلّ على ظلمة أوّل الليل. ورد في القرآن: ﴿إِلَى غَسَقِ اللَّيْلِ﴾. أصل صحيح يدلّ على ظلمة عند ابن فارس."
    - lemma: "سُدْفَة"
      generation_method: ishtiqaq
      justification: "من جذر س د ف، يدلّ على الظلمة في لغة تميم، وعلى الطائفة من الليل."


stage2_evidence:
  per_lemma:
    - lemma: "لَيْل"
      confirm:
        - text: "«ما يَعقُب النهارَ من الظَّلام, وهو من مَغْرِب الشمس إلى طلوعها»"
          source: "المعجم الوسيط"
        - text: "«اللَّيْلُ: ضدّ النَّهار، والليل: ظلامٌ وسواد»"
          source: "كتاب العين للخليل بن أحمد"
        - text: "«اللّيل: ضد النهار وهو الظلام والسواد»"
          source: "كتاب العين (OCR)"
        - text: "«(اللَّيْل) مَا يعقب النَّهَار من الظلام وَهُوَ من مغرب الشَّمْس إِلَى طُلُوعهَا»"
          source: "المعجم الوسيط (حوراماني)"
        - text: "«اللَّيْلُ واللَّيْلاةُ: من مَغْرِبِ الشمسِ إلى طُلوعِ الفَجْرِ الصادِقِ أو الشمسِ»"
          source: "القاموس المحيط للفيروزآبادي"
      expands:
        - text: "«اللَّيْل: ظلّ الأَرْض عِنْد غرُوب الشَّمْس»"
          source: "دستور العلماء للأحمدنكري"
          addition: "تعريف فيزيائي للّيل بوصفه ظلّ الأرض"
        - text: "«الليل: هي من غروب الشمس إلى طلوع الفجر الصادق، أو إلى طلوع الشمس وهو خلافُ النهار»"
          source: "التعريفات الفقهية للبركتي"
          addition: "الحدّ الشرعي لوقت الليل"

    - lemma: "غَسَق"
      confirm:
        - text: "«ظلمة الليل»"
          source: "المعجم الوسيط"
        - text: "«الغَسَقُ: أول ظلمة الليل»"
          source: "تاج اللغة وصحاح العربية للجوهري"
        - text: "«الغَسَقُ، مُحرَّكةً: ظُلْمةُ أَوَّلِ اللَّيلِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«(غسق) اللَّيْل غسقا وغسوقا وغسقانا أظلم»"
          source: "المعجم الوسيط (حوراماني)"
      expands:
        - text: "«﴿أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ إِلَى غَسَقِ اللَّيْلِ﴾»"
          source: "شاهد قرآني — سورة الإسراء ٧٨"
          addition: "شاهد قرآني يثبت الاستعمال في سياق زمن الصلاة"

    - lemma: "حَلَك"
      contradicts:
        - text: "«شدة السواد»"
          source: "المعجم الوسيط"
          conflict: "الحَلَك يدلّ على شدّة السواد كلون لا على غياب الضوء؛ فهو وصف لوني لا ظلامي"
        - text: "«شِدَّةُ السَّوادِ»"
          source: "المعجم الكبير"
          conflict: "التعريف يخلو من أيّ إشارة إلى الليل أو غياب الضوء"

    - lemma: "دُجًى"
      evidence_status: "no_material_found"

    - lemma: "سُدْفَة"
      confirm:
        - text: "«الظُّلْمة»"
          source: "المعجم الوسيط (تعريف ١)"
      contradicts:
        - text: "«السَّدْفَةُ، ويُضَمُّ: الظُّلْمَة، تَمِيمِيَّةٌ، والضَّوْءُ، قَيْسِيَّةٌ، ضِدٌّ»"
          source: "القاموس المحيط للفيروزآبادي"
          conflict: "لفظة من الأضداد: تعني الظلمة عند تميم والضوء عند قيس، مما يجعلها ملتبسة الدلالة"
      expands:
        - text: "«الطائفة من الليل واختلاط الضَّوْء والظلمة مَعًا كوقت مَا بَين طُلُوع الْفجْر إِلَى الْإِسْفَار»"
          source: "المعجم الوسيط (حوراماني)"
          addition: "معنى ثالث: اختلاط الضوء والظلمة كوقت الشفق"


stage3_analysis:
  per_lemma:
    - lemma: "لَيْل"
      decision: confirmed
      decision_reason: "لمّة أصيلة موثّقة في جميع المعاجم العربية الكلاسيكية والمعاصرة. تعريفات المعاجم تربط الليل بالظلام صراحةً: «ما يعقب النهار من الظلام». يتطابق مع المفهوم الإنجليزي night بوصفه نوعاً من الظلام."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "المصطلح العامّ الشامل لفترة الظلام بعد غروب الشمس حتى طلوعها، يشمل جميع مراحل الليل من أوّله إلى آخره"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "لَيْل"

    - lemma: "غَسَق"
      source: stage1
      decision: confirmed
      decision_reason: "لفظ قرآني فصيح موثّق في جميع المعاجم بمعنى «ظلمة أوّل الليل». يندرج تحت مفهوم المجموعة (darkness/night) بوصفه نوعاً خاصّاً من ظلام الليل. شاهده القرآني يعزّز مكانته المعجمية."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يختصّ بظلمة أوّل الليل عند غياب الشفق، لا يشمل الليل كلّه بل بدايته فحسب"
      actions:
        - command: create_entry
          params: {lemma: "غَسَق", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "awn4-14007202-n"}

    - lemma: "حَلَك"
      source: stage1
      decision: removed
      decision_reason: "الحَلَك يدلّ على شدّة السواد بوصفه صفة لونية لا على غياب الضوء أو ظلمة الليل. جميع المعاجم تُعرّفه بـ«شدّة السواد» دون ربطه بالظلام أو الليل. لا يصلح مرادفاً لـ«ليل» أو «ظلام»."

    - lemma: "دُجًى"
      source: stage1
      decision: removed
      decision_reason: "لم تُعثر على أدلّة معجمية في قاعدة البيانات تدعم هذه اللمّة. على الرغم من شيوعها في الشعر بمعنى ظلمة الليل، لا يمكن تأكيدها دون توثيق معجمي كافٍ."

    - lemma: "سُدْفَة"
      source: stage1
      decision: removed
      decision_reason: "لفظة من الأضداد تعني الظلمة في لغة تميم والضوء في لغة قيس، ولها معنى ثالث هو اختلاط الضوء والظلمة. هذا الالتباس الدلالي يجعلها غير صالحة لمجموعة ترادفية تعني الظلام تحديداً."


