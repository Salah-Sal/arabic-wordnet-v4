# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10145714-n  |  ILI: i90183  |  POS: n
# Definition (EN): someone who originates or causes or initiates something
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «مصدر» ليست اسم فاعل بشري: مصدر في العربية يدلّ على مكان الصدور أو الشيء الذي ينبثق منه غيره، لا على الشخص الفاعل المُنشِئ."
      - "لمّة «مولّد» مُلتبسة: المُوَلِّد = طبيب التوليد، والمُوَلَّد = الهجين أو المُحدَث من الكلام، والمَوْلِد = مكان الولادة وزمانها. لا توجد دلالة على «شخص يُنشئ شيئاً» بصورة عامة."
      - "لمّة «مُنشئ» غير مُشكَّلة تشكيلاً كاملاً في قاعدة البيانات."
      - "التعريف العربي الحالي «شخص ينشئ أو يسبب أو يبدأ شيئاً» مترجَم حرفياً من الإنجليزية ولا يتّسق مع أسلوب المعجم الوسيط."
    observations: >
      المجموعة تمثّل مفهوم «الفاعل المُنشِئ» — من يُوجِد شيئاً لم يكن موجوداً أو يُطلق حدثاً ما.
      تشمل اللمّات الإنجليزية: generator, source, author. والجذر الأعمّ هو «الإنشاء والإيجاد».
      المفهوم عربي أصيل ومرتبط بجذور: نشأ، وجد (أوجد)، بدأ، أسّس.
      الإشكاليّة المركزية: لمّتا «مصدر» و«مولّد» لا تحملان دلالة الفاعل البشري الذي يُنشئ شيئاً.
  blind_candidates:
    - lemma: "بَادِئٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «بَدَأَ» على وزن فَاعِل — من يبدأ الأمر ويفتتحه. الجذر بدأ يدلّ على افتتاح الشيء وإطلاقه أول مرة."
    - lemma: "مُحْدِثٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «أَحْدَثَ» على وزن مُفْعِل — من يُوجِد أمراً لم يكن. الجذر حدث يدلّ على كون الشيء لم يكن موجوداً."
    - lemma: "مُوجِدٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «أَوْجَدَ» على وزن مُفْعِل — من يُخرج الشيء من العدم إلى الوجود. يغطّي بُعد «يُنشئ» في التعريف."
    - lemma: "مُسَبِّبٌ"
      generation_method: ishtiqaq
      justification: "اسم فاعل من «سَبَّبَ» على وزن مُفَعِّل — من يكون سبباً في وقوع أمر ما. يغطّي بُعد «يُسبِّب» في التعريف."


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# الاستعلامات المُنفَّذة: ٥ استعلامات
#   ١. مطابقة دقيقة دفعية (OCR): مصدر، مولد، منشئ + المرشحات
#   ٢. إثراء بـ entry_id من OCR للمدارك الكاملة
#   ٣. الجسر الإنجليزي (generator/source/author/originator/initiator/creator/founder)
#   ٤. استعلام مقاييس اللغة (صدر، ولد، نشأ، بدأ، حدث، وجد)
#   ٥. استعلام تحقق للمرشحات في مصادر OCR
stage2_evidence:
  per_lemma:

    - lemma: "مصدر"
      contradicts:
        - text: "«المَصْدَرُ: ما يَصْدُرُ عنه الشيءُ، ويستمدُّ منه — موضعُ الصُّدور»"
          source: "المعجم الكبير"
          conflict: "مصدر يدلّ على مكان الانبثاق أو الشيء الذي يُستمَدّ منه — لا على شخص فاعل مُنشئ. المعنى غير شخصي."
        - text: "«ما يصدر عنه الشيء (عند علماء اللغة): صيغة اسمية تدلُّ على الحدث فقط»"
          source: "المعجم الوسيط"
          conflict: "المصدر في المعجم الوسيط يُستخدم بالمعنى النحوي ومعنى المنبع غير الشخصي، لا بمعنى الشخص الذي يُنشئ شيئاً."
      expands:
        - text: "«الصَّادُ وَالدَّالُ وَالرَّاءُ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى خِلَافِ الْوِرْدِ، وَالْآخَرُ صَدْرُ الْإِنْسَانِ وَغَيْرُهُ. فَالْأَوَّلُ قَوْلُهُمْ: صَدَرَ عَنِ الْمَاءِ، وَصَدَرَ عَنِ الْبِلَادِ، إِذَا كَانَ وَرَدَهَا ثُمَّ شَخَصَ عَنْهَا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر صدر يدلّ على الانصراف والخروج من مكان، لا على إيجاد الأشياء أو إنشائها."

    - lemma: "مولّد"
      contradicts:
        - text: "«المُوَلِّدُ: طبيبٌ يتولَّى توليدَ المرأة»"
          source: "المعجم الوسيط"
          conflict: "المُوَلِّد الذي هو اسم فاعل من «وَلَّدَ» خُصَّ في الوسيط بمعنى القابلة/طبيب التوليد، لا بمعنى عام «مَن يُنشئ شيئاً»."
        - text: "«المَوْلِدُ: موضعُ الولادة وقتُها»"
          source: "المعجم الوسيط"
          conflict: "المَوْلِد اسم مكان وزمان لا اسم فاعل."
        - text: "«المُوَلَّدُ: المُحْدَثُ من كلِّ شيء — من الرجال: العَربِيُّ غيرُ المحض — من الكلام: كلُّ لفظٍ كان عربيَّ الأصل ثم تغيَّر في الاستعمال»"
          source: "المعجم الوسيط"
          conflict: "المُوَلَّد (اسم مفعول) يدلّ على الهجين أو المُحدَث، لا على الشخص الفاعل."
      expands:
        - text: "«الْوَاوُ وَاللَّامُ وَالدَّالُ: أَصْلٌ صَحِيحٌ، وَهُوَ دَلِيلُ النَّجْلِ وَالنَّسْلِ، ثُمَّ يُقَاسُ عَلَيْهِ غَيْرُهُ... وَتَوَلَّدَ الشَّيْءُ عَنِ الشَّيْءِ: حَصَلَ عَنْهُ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر ولد يدلّ على النسل والنجل والتوالد بالتسلسل، لا على الإنشاء الابتدائي."

    - lemma: "مُنشئ"
      confirm:
        - text: "«المُنْشِئُ: الذى يجيد استنباط المعانى وتأليفها والتعبير عنها بكلام بليغ»"
          source: "المعجم الوسيط"
        - text: "«(المنشئ) الَّذِي يجيد استنباطَ الْمعَاني وتأليفَها وَالتَّعبير عَنْهَا بِكَلَامٍ بليغ»"
          source: "المعجم الوسيط (رواية مجموعة من المؤلفين)"
      expands:
        - text: "«النُّونُ وَالشِّينُ وَالْهَمْزَةُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى ارْتِفَاعٍ فِي شَيْءٍ وَسُمُوٍّ. وَنَشَأَ السَّحَابُ: ارْتَفَعَ. وَأَنْشَأَهُ اللَّهُ: رَفَعَهُ... وَأَنْشَأَ فُلَانٌ حَدِيثًا، وَأَنْشَأَ يُنْشِدُ وَيَقُولُ، كُلُّ هَذَا قِيَاسُهُ وَاحِدٌ.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر نشأ يدعم دلالة الإيجاد والرفع والإطلاق. «أنشأ فلانٌ حديثاً» = أوجده وابتدأه، مما يُعزّز الدلالة الأوسع لمُنشئ."

    - lemma: "بَادِئٌ"
      confirm:
        - text: "«بادئ: جزيءٌ يبدأ التكرُّرَ عند اتحاده مع المكرِّر» (ترجمة: initiator)"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
        - text: "«البادئ: العقدةُ التي تبدأ الوصول إلى الناقل» (ترجمة: initiator)"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم"
      contradicts:
        - text: "«بادئُ الرَّأْى: ما يَبْدأُ منه، وهو الرَّأْى الفطير يبدو قبل إنعام النظر»"
          source: "المعجم الوسيط"
          conflict: "بادئ في المعجم الوسيط مقيّد بالتعبير الاصطلاحي الثابت «بادئ الرأي»، ولا يُستخدم مستقلاً كاسم للشخص المُنشئ."
      expands:
        - text: "«الْبَاءُ وَالدَّالُ وَالْهَمْزَةُ مِنِ افْتِتَاحِ الشَّيْءِ... وَاللَّهُ تَعَالَى الْمُبْدِئُ وَالْبَادِئُ. قَالَ اللَّهُ: {إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ}»"
          source: "مقاييس اللغة لابن فارس"
          addition: "الجذر بدأ يدعم دلالة الافتتاح والإطلاق. البادئ/المُبْدِئ ورد في القرآن الكريم وصفاً لله تعالى — مما يُضعف توظيفه للإنسان."

    - lemma: "مُحْدِثٌ"
      expands:
        - text: "«المُحْدِثُ: (عند الفقهاء) الذى يَبتدعُ ما لم يكن معروفاً في كتابٍ ولا سُنَّةٍ ولا إجماع — (في الأدب والعلم والفن): المُجدِّد فيه»"
          source: "المعجم الكبير"
          addition: "مُحْدِث يحمل في الاستخدام الفقهي دلالةً سلبية (المبتدع)، وإن كان في السياق الأدبي يعني المجدِّد. هذا التضارب يُضعف توظيفه."
      contradicts:
        - text: "«المُحدَّث: ما لم يكن معروفاً في كتاب ولا سُنَّة ولا إجماع»"
          source: "المعجم الوسيط"
          conflict: "الاستخدام الفقهي لمُحْدِث ومُحدَث يرتبط بالابتداع المذموم في الشريعة، مما يُثقّل اللمّة بحمولة سلبية."

    - lemma: "مُوجِدٌ"
      confirm:
        - text: "«author: (1) المؤلِّف (2) المُبْدِع؛ المُوْجِد؛ الخالق (3) الصانع؛ الواضع»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الْوَاوُ وَالْجِيمُ وَالدَّالُ، يَدُلُّ عَلَى أَصْلٍ وَاحِدٍ، وَهُوَ الشَّيُّ يُلْفِيهِ. وَوَجَدْتُ الضَّالَّةَ وِجْدَانًا.»"
          source: "مقاييس اللغة لابن فارس"
          addition: "جذر وجد في الأصل يدلّ على اللُّقيان. أما «أوجد» (الرباعي) فمعناه «أخرج الشيء من العدم إلى الوجود» وهو المسوِّغ لاشتقاق مُوجِد."

    - lemma: "مُسَبِّبٌ"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "مصدر"
      decision: removed
      decision_reason: >
        مصدر في العربية اسمٌ للمكان أو الشيء الذي ينبثق منه غيره (ما يصدر عنه الشيء)، وهو
        في علم الصرف صيغة تدلّ على الحدث دون زمان. كلا الاستخدامَين يفتقران إلى دلالة الفاعل
        البشري. إدراجه هنا ترجمةٌ حرفية للمعنى الإنجليزي «source» في سياق «مَن يكون مصدراً
        لشيء»، وهو استخدام مجازي بعيد لا يُقرّه المعجم. فضلاً عن ذلك فإنّ «مصدر» شائع
        الاستخدام بمعانٍ أخرى (مصدر المعلومات، مصدر التمويل) مما يُشيع الاشتراك اللفظي.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      borrowing_check:
        is_calque: true
        calque_note: "ترجمة حرفية عمياء للإنجليزية «source» بمعنى «مَن يُطلق شيئاً» — لا يتّفق مع المدلول العربي الراسخ."

    - lemma: "مولّد"
      decision: removed
      decision_reason: >
        مولَّد/مُوَلِّد/مَوْلِد — الصيغ الثلاث المتاحة في المعجم لا تؤدّي معنى «الشخص الذي
        يُنشئ شيئاً» بصورة عامة: المَوْلِد = مكان الولادة وزمانها، المُوَلَّد = الهجين،
        المُوَلِّد = طبيب التوليد. إدراجها ترجمةٌ حرفية للمعنى الإنجليزي «generator»،
        وهو في العربية يُقابَل تقنياً بـ«المُوَلِّد الكهربائي»، وهو تخصيص تقني لا صلة له
        بالمفهوم الإنساني العام الوارد في هذه المجموعة.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false
      borrowing_check:
        is_calque: true
        calque_note: "ترجمة حرفية لـ«generator» في معناه الإنجليزي العام — لا يتّفق مع المدلول العربي."

    - lemma: "مُنشئ"
      decision: confirmed
      decision_reason: >
        مُنشِئ اسمُ فاعل من «أنشأ» ويعني في الوسيط «الذي يجيد استنباط المعاني وتأليفها» —
        أي مَن يُوجِد المعاني ويُنتجها. وإن ضاق استخدامه الكلاسيكي في الأدب، فإنّ الجذر
        (نشأ/أنشأ) يدلّ بصورة عامة على الإيجاد والإظهار: «أنشأ فلانٌ حديثاً». كما أنّ
        استخدامه المعاصر واسع (أنشأ شركةً، أنشأ مشروعاً). هو الأقرب من بين الثلاث إلى
        المعنى المقصود. يحتاج إلى تشكيل كامل.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مُنشِئ يُركّز على جانب البناء والإقامة والتأسيس — ينشئ عملاً أو مؤسسةً أو معنىً."
      morphology_check:
        wazn: "مُفْعِل"
        root: "نشأ"
        wazn_fit: "مناسب — مُفْعِل لاسم فاعل الرباعي يدلّ على الفاعل الواعي."
      actions:
        - command: update_lemma
          params:
            entry_id: "29108"
            new_lemma: "مُنْشِئٌ"

    - lemma: "بَادِئٌ"
      source: stage1
      decision: removed
      decision_reason: >
        بادئ في المعجم الكلاسيكي مقيَّد بالتعبير الاصطلاحي «بادئ الرأي» ولا يُستعمل
        مستقلاً للدلالة على الشخص المُنشئ. استخداماته التقنية الحديثة (بادئ في الوراثة
        والهندسة) هي مصطلحات تخصصية ضيّقة لا تُغطّي المعنى العام لهذه المجموعة.
        يُضاف إلى ذلك ورود «البادئ» وصفاً لله تعالى في القرآن الكريم مما يُثقّل التوظيف
        للبشر بعموم.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُحْدِثٌ"
      source: stage1
      decision: removed
      decision_reason: >
        مُحْدِث يحمل حمولةً دلالية سلبية راسخة في الاستخدام الفقهي والعقدي (المبتدع في الدين).
        وإن كان يُستخدم في الأدب والعلم بمعنى «المجدِّد»، إلّا أنّ هذا التضارب الدلالي الحادّ
        يجعله غير صالح كلمّة محايدة في هذه المجموعة الدلالية العامة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false

    - lemma: "مُوجِدٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُوجِد اسمُ فاعل من «أوجَدَ» — أخرج الشيءَ من العدم إلى الوجود. أيَّده معجم
        المورد الحديث صراحةً كترجمة لـ«author/creator». الاشتقاق سليم: أوجد رباعي متعدٍّ،
        مُوجِد اسم فاعله على وزن مُفْعِل. وإن افتقر الجذر الكلاسيكي (وجد) في مقاييس ابن
        فارس إلى هذه الدلالة التوليدية، فإنّ الاستخدام الرباعي «أوجد» راسخٌ في العربية
        الكلاسيكية والمعاصرة على حدٍّ سواء («أوجَدَهُ اللهُ»). اللمّة تكمّل مُنشِئ وتُغطّي
        بُعد الإيجاد من العدم.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مُوجِدٌ يُركّز على جانب الإخراج من العدم إلى الوجود — أعمّ من مُنشِئ وأبعد في الدلالة الوجودية."
      morphology_check:
        wazn: "مُفْعِل"
        root: "وجد (رباعي: أوجد)"
        wazn_fit: "مناسب."
      actions:
        - command: create_entry
          params:
            lemma: "مُوجِدٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-10145714-n"

    - lemma: "مُسَبِّبٌ"
      source: stage1
      decision: removed
      decision_reason: >
        لم يُعثَر على توثيق معجمي لـ«مُسَبِّب» كاسم علَم قائم بذاته للشخص الفاعل. وإن
