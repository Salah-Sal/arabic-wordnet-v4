# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية: awn4-13973020-n
# precedence / priority — أسبقية، أولوية، صدارة
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّات الثلاث (أسبقية، أولوية، صدارة) ليست مترادفات مطلقة؛ لكلٍّ منها ظلال دلالية مختلفة"
      - "التعريف الحالي يركّز على الترتيب والإلحاح، بينما «صدارة» تركّز على التقدّم المكاني أو الاعتباري أكثر من الإلحاح"
      - "اللمّات بدون تشكيل كامل في المدخل الأصلي"
    observations: >
      المجموعة تدور حول مفهوم المكانة المحدَّدة بحسب ترتيب الأهمية أو الاستعجال، وهو مفهوم
      عربي أصيل تعبّر عنه عدة ألفاظ. اللمّات الثلاث مناسبة عموماً لكنها تحتاج إلى تمييز دقيق:
      «أسبقية» تركّز على البُعد الزمني والتقدّم على الغير، و«أولوية» تركّز على الأحقّية
      والأولى بالتقديم، و«صدارة» تركّز على المقام الأول والتقدّم الاعتباري.
  blind_candidates:
    - lemma: "تَقَدُّم"
      generation_method: ishtiqaq
      justification: >
        مصدر تَقَدَّمَ من جذر «قدم» الدالّ على السَّبق والرَّعف، وهو يدلّ على حالة كون الشيء
        في المرتبة الأولى. ورد في كشّاف اصطلاحات الفنون بمعنى precedence/priority.
    - lemma: "تَرْجِيح"
      generation_method: ishtiqaq
      justification: >
        مصدر رَجَّحَ من جذر «رجح» الدالّ على الزيادة والغلبة، ويُستعمل في الاصطلاح بمعنى
        تفضيل أحد الأمرين على الآخر وبيان فضله، وهو قريب من مفهوم الأولوية.
    - lemma: "حُظْوَة"
      generation_method: majaz
      justification: >
        من جذر «حظو» بمعنى المكانة والمنزلة لدى ذي سلطان. يمكن توسيع دلالتها مجازاً
        لتشمل المكانة العالية في ترتيب الأهمية، إذ الحظوة تتضمّن التقديم والتمييز.
    - lemma: "سَبْق"
      generation_method: ishtiqaq
      justification: >
        مصدر سَبَقَ من جذر «سبق» الدالّ على التقديم. ورد في كشّاف الاصطلاحات بمعنى
        priority/primacy، وفي المعجم الكبير بمعنى «القُدمة في الجري وغيره».

stage2_evidence:
  per_lemma:
    - lemma: "أَسْبَقِيَّة"
      confirm:
        - text: "«الأولوِيَّةُ والتقدُّمُ على الآخرين»"
          source: "المعجم الكبير"
        - text: "«في التطبيقات: الترتيبُ الذي تُحسَبُ وفقه القيمُ في تعبير رياضي»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«(1) أسبقيّة [من حيث الزمن] (2) التصدّرية: حقّ التصدُّر والتقدّم على الآخرين (3) أوْلَوِيّة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«أسبقية — translation_en: primacy — domain: Sociology and Anthropology»"
          source: "مسرد علم الاجتماع والأنثروبولوجيا (ArabTerm)"
          addition: "تُستعمل أسبقية أيضاً بمعنى الأسبقية الزمنية (primacy) في علم الاجتماع"

    - lemma: "أَوْلَوِيَّة"
      confirm:
        - text: "«جاء ضمن قرارات مجمع اللغة المصري أنه إذا أريد صنع مصدر من كلمة يزاد عليها ياء النسب والتاء... فيصاغ من اسم التفضيل كما في هذا المثال، حيث اشتق المصدر الصناعيّ من أَوْلى بمعنى أحق»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«(1) الأسبقيّة؛ الأقدميّة (2) الأوَّليّة؛ الأولويّة [من حيث الترتيب أو المنزلة] (3) معاملة تفضيلية أو تمييزية»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«المشكلة الاقتصادية تتمثل في ندرة المواد وتعدد الأولويات في إشباع الحاجات»"
          source: "المعجم الموحد لمصطلحات الاقتصاد (2000)"
          addition: "تُستعمل أولوية في السياق الاقتصادي بمعنى ترتيب الحاجات حسب أهميتها"

    - lemma: "صَدَارَة"
      confirm:
        - text: "«التَّقَدُّمُ. يقالُ: فلانٌ لهُ الصُّدارةُ فى القوم»"
          source: "المعجم الكبير"
        - text: "«(الصدارة) التَّقَدُّم يُقَال فلَان لَهُ الصدارة فِي الْقَوْم»"
          source: "المعجم الوسيط"
        - text: "«وَرَد في القاموس: وصدور الوادي أعاليه ومقادمه.. جمع صَدَارة. وفي التاج: الصَّدَارة بالفتح: التقدم»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«(عِنْد النُّحَاة) اخْتِصَاص الْكَلِمَة بوقوعها أول الْكَلَام كأسماء الِاسْتِفْهَام»"
          source: "المعجم الوسيط"
          addition: "للصدارة معنى نحوي اصطلاحي إضافة إلى معناها العام"

    - lemma: "تَقَدُّم"
      confirm:
        - text: "«التّقدّم: هو عند الحكماء يطلق على خمسة أشياء... [في الإنجليزية] Advance, precedence, priority, development»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«تَقَدُّم: من (ق د م) السبق في الشرف أو الرتبة أو العلم والحضارة»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      contradicts:
        - text: "«التقدم الطبعي: هو كون الشيء الذي لا يمكن أن يوجد آخر إلا وهو موجود...»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "التقدّم في الاصطلاح الفلسفي أوسع بكثير من مفهوم الأولوية؛ يشمل التقدّم بالزمان والعلّة والطبع والرتبة والشرف"

    - lemma: "تَرْجِيح"
      contradicts:
        - text: "«الترجيح: إثبات مرتبة في أحد الدليلين على الآخر»"
          source: "كتاب التعريفات للشريف الجرجاني"
          conflict: "الترجيح اصطلاح أصولي يخصّ المفاضلة بين الأدلة، لا المكانة في ترتيب الأهمية"
        - text: "«التَّرْجِيحُ: تَقْوِيَة إِحْدَى الأمارتين على الْأُخْرَى، ليعْمَل بهَا»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "معنى اصطلاحي محصور في مجال الاستدلال الشرعي، بعيد عن مفهوم المكانة"

    - lemma: "حُظْوَة"
      contradicts:
        - text: "«المَكانةُ والمَنْزِلَةُ لَدَى ذِي سُلْطَانٍ ونحوِه»"
          source: "المعجم الكبير"
          conflict: "الحظوة تدلّ على المكانة الشخصية عند ذي سلطان، لا على ترتيب الأهمية أو الإلحاح"

    - lemma: "سَبْق"
      confirm:
        - text: "«السّبق: هو التقدّم... [في الإنجليزية] Priority, primacy»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      contradicts:
        - text: "«(السَّبق) مَا يتراهن عَلَيْهِ المتسابقون وَمَوْضِع السباق على الْمجَاز»"
          source: "المعجم الوسيط"
          conflict: "السَّبَق (بفتح الباء) هو الخَطَر/الرهان، والسَّبْق (بسكونها) هو التقدّم في الجري، وكلاهما أقرب إلى المسابقة منه إلى المكانة"

stage3_analysis:
  per_lemma:
    - lemma: "أَسْبَقِيَّة"
      decision: confirmed
      decision_reason: >
        لفظ مصدر صناعي من «أسبق» مسكوك ومثبت في المعجم الكبير بمعنى «الأولويّة والتقدّم على الآخرين»،
        وفي المورد الحديث مقابلاً لـ precedence. مؤيَّد بعدة مصادر مصطلحية حديثة (ArabTerm).
        اللفظ فصيح ومتداول ومناسب للمجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تركّز على البُعد الزمني والسبق التاريخي أو الترتيبي؛ أقرب إلى precedence منها إلى priority.
        تتضمّن معنى التقدّم على الآخرين في الزمن أو الرتبة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَسْبَقِيَّة"

    - lemma: "أَوْلَوِيَّة"
      decision: confirmed
      decision_reason: >
        مصدر صناعي من «أَوْلى» أقرّه مجمع اللغة المصري وأثبته معجم الصواب اللغوي بوصفه فصيحاً.
        شائع في الاستعمال الحديث بمعنى priority في عدة ميادين (اقتصاد، معلوماتية، طبّ، كهرباء).
        مناسب تماماً لتعريف المجموعة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تركّز على الأحقّية والأجدرية بالتقديم؛ أقرب إلى priority منها إلى precedence.
        تتضمّن بُعد الأهمية والإلحاح أكثر من البُعد الزمني.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أَوْلَوِيَّة"

    - lemma: "صَدَارَة"
      decision: confirmed
      decision_reason: >
        ثابتة في المعجم الوسيط والمعجم الكبير بمعنى «التقدّم»، وأكّد معجم الصواب اللغوي فصاحتها
        بشواهد من القاموس المحيط وتاج العروس. مناسبة للمجموعة وإن كانت تركّز على المقام الأول
        أكثر من الترتيب بالإلحاح.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تركّز على التقدّم الاعتباري والمقام الأول بين القوم؛ أقرب إلى primacy/preeminence.
        تحمل بُعداً اجتماعياً وتشريفياً أكثر من أَسْبَقِيَّة وأَوْلَوِيَّة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "صَدَارَة"

    - lemma: "تَقَدُّم"
      source: stage1
      decision: removed
      decision_reason: >
        رغم ورود «تقدّم» بمعنى precedence/priority في كشّاف الاصطلاحات، فإنّ اللفظ عامّ جداً
        ومتعدد المعاني (تقدّم بالزمان، بالعلّة، بالطبع، بالرتبة، بالشرف عند الفلاسفة)، فضلاً عن
        معناه الحديث الشائع (progress/development). إدراجه في المجموعة يُحدث اشتراكاً لفظياً واسعاً
        ولا يضيف دقّة تفوق ما توفّره اللمّات الموجودة.

    - lemma: "تَرْجِيح"
      source: stage1
      decision: removed
      decision_reason: >
        الترجيح اصطلاح أصولي محصور في المفاضلة بين الأدلة الشرعية، بعيد عن مفهوم المكانة
        في ترتيب الأهمية. الأدلة المعجمية تناقض استعماله بهذا المعنى.

    - lemma: "حُظْوَة"
      source: stage1
      decision: removed
      decision_reason: >
        الحظوة تدلّ على المكانة الشخصية عند ذي سلطان ونحوه، وهي علاقة شخصية لا ترتيبية.
        لا تتضمّن بُعد الترتيب بحسب الأهمية أو الإلحاح الذي يقتضيه تعريف المجموعة.

    - lemma: "سَبْق"
      source: stage1
      decision: removed
      decision_reason: >
        رغم وروده في كشّاف الاصطلاحات بمعنى priority، فإنّ السَّبْق في المعاجم العربية يدلّ أساساً
        على التقدّم في الجري والمسابقة، والسَّبَق على الرهان. كما أنّ «أسبقيّة» المشتقة من نفس
        الجذر موجودة بالفعل في المجموعة وتؤدّي المعنى بدقّة أعلى.

