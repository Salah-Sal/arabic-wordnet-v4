# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
# قُرئ أولاً: synset_info_masked.yaml (بدون لمّات)
# التعريف الوحيد المتاح: «شخص يصنع السكاكر والحلويات الأخرى»
stage1_review:
  assessment:
    concerns:
      - "اللمّة «حلواني» مكتوبة بدون تشكيل؛ الضبط الصحيح المُثبَت في معجم الصواب: حَلْوَانِيّ بسكون اللام، لا حَلَوانيّ بفتحها"
      - "اللمّة «صانع حلوى» تعبير وصفي حر يفشل اختبار السكّ: يمكن إحلال «مصنِّع حلوى» محلّها بلا اختلاف دلالي، فليست وحدةً معجمية ثابتة"
      - "التعريف الحالي «شخص يصنع السكاكر والحلويات الأخرى» ترجمة حرفية من الإنجليزية؛ يُستحسن صياغته بأسلوب المعجم الوسيط ويُغفل دور البيع الملازم للمهنة"
    observations: "المجموعة تُعبّر عن مهنة صنع الحلوى (confectioner)، وهي مهنة ذات جذور عربية عريقة. اللمّة الأصيلة «حلواني» مُوثَّقة في كبرى المعاجم العربية الحديثة (الوسيط، الكبير، المورد الحديث) بمعنى صانع الحلوى وبائعها. أمّا «صانع حلوى» فعبارة وصفية يمكن استبدال أجزائها دون أن تفقد وصفيّتها، لا تُثبتها المعاجم وحدةً مستقلة. التوليد الأعمى أفضى تلقائياً إلى حَلْوَانِيّ وصانع الحلوى مما يُؤكد طبيعتهما البديهية، مع ملاحظة أن الأول فقط هو المصطلح المعجَّم."
  blind_candidates:
    - lemma: "قَنَّاد"
      generation_method: ishtiqaq
      justification: "مشتق من الجذر (ق ن د) — القَنْد: عسل قصب السكر أو ما صُنع منه وهو معرَّب في مقاييس اللغة — على وزن فَعَّال الدالّ على المتخصص في الصنعة، كنجّار وقصّاب وعطّار."
    - lemma: "حَلْوَانِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى «حَلْوى» بزيادة «ألف ونون» قبل ياء النسب، على نمط أسماء الحِرَف العربية كالجزّاري والزيتوني. الوزن يُشير مباشرةً إلى الانتساب إلى تجارة الحلوى وصنعها."
    - lemma: "صَانِعُ الحَلْوَى"
      generation_method: tarkib
      justification: "تركيب إضافي من «صانع + الحلوى» يُعبّر مباشرةً عن المفهوم ويوافق نمط الأسماء الوظيفية الإضافية العربية. مرتبة ثانية بعد المصطلح المُفرد."
    - lemma: "سُكَّرِيّ"
      generation_method: majaz
      justification: "إزاحة دلالية من «سُكَّر» (المادة الأساسية في صنع الحلوى والسكاكر) إلى الشخص الذي يتعامل بها ويصنع منها، كما يُقال «زيّات» لبائع الزيت و«عطّار» لبائع العطر."


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1 — مطابقة دفعية: حلواني، الحلواني، قناد، القناد، سكري، السكري (+ حلوي، حلاوي)
#   Q2 — جسر إنجليزي: confectioner, candymaker, candy maker, confectionery, pastry maker
#   Q3 — مقاييس اللغة (dictionary_id=151): حلو، قند، سكر، صنع
#   Q4 — تحقق المرشحات: قناد، صانع حلوى، حلاني
stage2_evidence:
  per_lemma:
    - lemma: "حلواني"
      confirm:
        - text: "«بائع الحلوى وصانعها»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
        - text: "«صانِعُ الحَلْوَى بائِعُها — لَقَبٌ لأَكْثَرَ مِنْ واحِدٍ، مِنْهُمْ: أبو مُحَمَّدٍ عَبْدُ العَزِيزِ بنُ أَحْمَدَ البُخارِيُّ الحَلْوانِيُّ»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
        - text: "«(الحلواني) بائع الحلوى وصانعها»"
          source: "المعجم الوسيط لمجموعة من المؤلفين (هورماني)"
        - text: "«حَلَوَانيّ [مرفوضة عند بعضهم] ... الصواب والرتبة: حَلْوانيّ [فصيحة] — كلمة «حَلْوانيّ» نسبة إلى عمل الحلوى وبيعها بزيادة «ألف ونون» قبل «ياء النسب»»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "translation_en: Confectionary and pastry cook — domain: Arts, Recreation and Sports"
          source: "مسرد الفن والتسلية والرياضة، أرابترم (ALECSO)"
        - text: "«الحَلْوانيّ: بائع الحَلْوَيات أو صانعُها»"
          source: "المورد الحديث (2008)، أرابترم"
        - text: "«حَلَوَاني — من (ح ل و) بائع الحلوى وصانعها»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«حلوانة، حلواني — translation_en: Confectioner's / Confectionery»"
          source: "مسرد الفن والتسلية والرياضة، أرابترم"
          addition: "تُثبت أن «حَلْوَانِيّ» يوازي الإنجليزية confectioner's (نسبة إلى المحلّ والصنعة معاً) لا confectioner فحسب"
        - text: "«حَلَوَانيّ [مرفوضة عند بعضهم بسبب فتح اللام]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          addition: "يُثبت أن الضبط الصحيح هو حَلْوَانِيّ بسكون اللام (حَلْ-) لا بفتحها (حَلَ-)، وهذا يستوجب تصحيح تشكيل اللمّة في AWN"

    - lemma: "صانع حلوى"
      contradicts:
        - text: "«الحَلْوانيّ: بائع الحَلْوَيات أو صانعُها» — يُستعمل الاسم المعجمي المفرد ولا يُثبَت التركيب الوصفي وحدةً مستقلة"
          source: "المورد الحديث (2008)"
          conflict: "المعجمات تُلجأ إلى «حلواني» مفرداً ولا تُدرج «صانع حلوى» مدخلاً معجمياً مستقلاً"
        - text: "«(1) الحَلْوَيات أو صناعتها — (2) دكان الحَلْوانيّ» (عن الإنجليزية confectionery)"
          source: "المورد الحديث (2008)"
          conflict: "حتى التعبير عن الصناعة يستخدم «حلوانيّ» لا «صانع حلوى»، مما يُؤكد أن التركيب الأخير غير مُعجَّم"

    - lemma: "قَنَّاد"
      evidence_status: "no_material_found"

    - lemma: "سُكَّرِيّ"
      contradicts:
        - text: "«البول السُّكَّرِيّ: مرض يظهر فيه سُكَّر العنب في البول نتيجة لأسباب متعددة أهمها نقص هرمون الأنسولين»"
          source: "المعجم الوسيط (مجمع اللغة العربية)"
          conflict: "سُكَّرِيّ راسخ في المعجمات بدلالة «البول السكري / داء السكري» لا بمعنى صانع السكاكر"
        - text: "translation_en: diabetes mellitus — domain: The Unified Medical Dictionary"
          source: "المعجم الطبي الموحد (2009)، أرابترم"
          conflict: "المصطلح في قواعد المصطلحات المتخصصة مرتبط ارتباطاً حصرياً بمرض السكري"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "حلواني"
      decision: confirmed
      decision_reason: "مُوثَّق في المعجم الوسيط والمعجم الكبير ومعجم الصواب ومصادر أرابترمية متعددة بمعنى صانع الحلوى وبائعها. الوزن الصرفي سليم (نسبة فَعْلاني). يُعدَّل بالتشكيل الكامل الصحيح."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "اللفظ المعجمي الأصيل لصاحب مهنة الحلوى؛ يجمع في وحدة واحدة بين معنى الصنعة (التصنيع) ومعنى التجارة (البيع)، وهو ما يُميّزه عن التعبير الوصفي «صانع حلوى» القاصر على جانب الصنعة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "حَلْوَانِيّ"

    - lemma: "صانع حلوى"
      decision: removed
      decision_reason: "عبارة وصفية حرة تفشل اختبار السكّ: إبدال «صانع» بـ«مصنِّع» أو «عامل» يُبقي التعبير وصفياً صحيحاً، مما يُثبت غياب التثبيت المعجمي. لا تُدرجها المعاجم وحدةً مستقلة. اللمّة الصحيحة المُعجَّمة هي «حَلْوَانِيّ»."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قَنَّاد"
      source: stage1
      decision: removed
      decision_reason: "الجذر قند موثَّق في مقاييس اللغة والوزن فَعَّال منتج للمهن، غير أن «قنّاد» بمعنى صانع القند/السكاكر لم يُثبَت في أيٍّ من المعاجم المُستعلَمة. الوارد تحت «قناد» اسمٌ جغرافي لموضع قرب واسط (معجم البلدان). في وجود «حَلْوَانِيّ» المُعجَّمة الراسخة، لا حاجة إلى اشتقاق جديد."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "سُكَّرِيّ"
      source: stage1
      decision: removed
      decision_reason: "المصطلح راسخ في المعاجم العامة والمتخصصة بدلالة «داء السكري» (diabetes mellitus)، وتوظيفه بمعنى صانع السكاكر سيُوقع في اشتراك لفظي مُضِرّ. فضلاً عن أن اختبار الاقتراض المفهومي يُظهر انزياحاً دلالياً بعيداً عن المدلول المطلوب."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false


