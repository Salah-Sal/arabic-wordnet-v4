# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# Synset: awn4-10658320-n  |  ILI: i93221  |  POS: n
# Definition (EN): someone who engages in sports
# Definition (AR): شخص يمارس الرياضة
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «ممارس رياضة» تعبير وصفي حر لا مصطلح مسكوك: يفشل اختبار السكّ لأن «ممارس» قابلة للإبدال بـ«مزاول» أو «ممتهن» مع بقاء الوصف قائماً"
      - "اللمّة منقوصة التشكيل في السجل"
      - "العلاقة بالمجموعة الأعلى (awn4-09839665-n) مثيرة للتساؤل: «شخص يمارس الرياضة» (عام) هو hyponym لـ«شخص مُدرَّب على المنافسة» (خاص) — وهذا عكس الترتيب الطبيعي للعلاقة الشمولية"
      - "لا توجد سوى لمّة واحدة في المجموعة؛ المفهوم يستحق تعدداً في التعبير"
    observations: >
      المفهوم واضح دلالياً: يعبّر عن الفاعل الممارس لأي نشاط رياضي بدني، سواء أكان هاوياً
      أم محترفاً. جذر المفهوم المحوري «ر-و-ض» يُنتج شبكة اشتقاقية ثرية في العربية (راض،
      رِياضة، تريَّض، الرَّوْضة). اللمّة القائمة «ممارس رياضة» تستخدم جذراً مختلفاً (م-ر-س)
      وتصوغ تركيباً إضافياً حرّاً يُشبه شرح التعريف أكثر من المصطلح. الأجدر توليد مرشحات
      من جذر «ر-و-ض» مباشرةً.

  blind_candidates:
    - lemma: "مُتَرَيِّض"
      generation_method: ishtiqaq
      justification: >
        اسم فاعل من الفعل «تريَّض» (على وزن تَفَعَّلَ من جذر ر-و-ض)، يعني من يمارس
        التريُّض أي يخرج قاصداً المشي أو النشاط الرياضي. الوزن مُتَفَعِّل مألوف لإفادة
        الاشتغال بالفعل الممتد (مُتَعَلِّم، مُتَدَرِّب، مُتَمَرِّن).
    - lemma: "رَيَّاض"
      generation_method: ishtiqaq
      justification: >
        صيغة مبالغة على وزن فَعَّال من جذر ر-و-ض، قياساً على سبّاح ورمّاح وقنّاص،
        للدلالة على المواظبة على الرياضة. محاولة إحياء صيغة مبالغة من الجذر المحوري.
    - lemma: "مُمَارِسُ الرِّيَاضَة"
      generation_method: tarkib
      justification: >
        تركيب إضافي معرَّف على وزن اسم الفاعل من فاعَلَ + مضاف إليه، يُصرّح بالنشاط
        المقصود. الأكثر إيضاحاً وشمولاً كمصطلح توثيقي رسمي حتى لو كان مركباً.
    - lemma: "رِيَاضِيّ"
      generation_method: ishtiqaq
      justification: >
        اسم منسوب إلى الرياضة على وزن فِعَالِيّ (نسبة). الأكثر شيوعاً في الاستعمال
        العربي المعاصر بمعنى «من يمارس الرياضة» أو «من تعلَّق بها هواية أو احترافاً».


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
stage2_evidence:
  query_log:
    - query_id: 1
      purpose: "مطابقة دفعية لكل اللمّات (الموجودة + المرشحات)"
      terms_searched:
        - "ممارس رياضه / الممارس رياضه"
        - "ممارس / الممارس"
        - "متريض / المتريض"
        - "مزاول / المزاول"
        - "رياضي / الرياضي"
    - query_id: 2
      purpose: "الجسر الإنجليزي: sportsman / sportswoman / sportsperson / athlete"
    - query_id: 3
      purpose: "FTS عربي — كلمات مفتاحية: رياضة، يمارس الرياضة، ممارسة الرياضة"
    - query_id: 4
      purpose: "عائلة الجذر روض / ريض (pos: noun/verb/adj)"
    - query_id: 5
      purpose: "تحقق المرشحات: متريض، تريّض، رياض، مزاول الرياضة"
    - query_id: 6
      purpose: "مقاييس اللغة (dict_id=151) لجذري روض و مرس"
    - query_id: 7
      purpose: "الإثراء بالمعرّف (definitions + examples) للمداخل الرئيسية"

  per_lemma:

    - lemma: "ممارس رياضة"
      confirm:
        - text: "«مُمَارِس: practitioner»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009) — arabterm"
        - text: "«مُمَارِس: practitioner»"
          source: "المعجم الطبي الموحد (2009) — arabterm"
      contradicts:
        - text: "«ممارس» لم يرد بمعنى ممارس الرياضة في أي معجم؛ ورد فقط في السياق الطبي بمعنى practitioner"
          source: "arabterm (pharmacy / medical)"
          conflict: "المعنى المعجمي الموثَّق لـ«ممارس» مختلف عن المفهوم المقصود (الرياضة البدنية)"
      expands:
        - text: "«الاشتقاق: مَرَسَ — الْمِيمُ وَالرَّاءُ وَالسِّينُ أَصْلٌ صَحِيحٌ يَدُلُّ عَلَى مُضَامَّةِ شَيْءٍ لِشَيْءٍ بِشِدَّةٍ وَقُوَّةٍ. مِنْهُ الْمَرَسُ: الْحَبْلُ، سُمِّيَ لِتَمَرُّسِ قُوَاهُ بَعْضِهَا بِبَعْضٍ»"
          source: "مقاييس اللغة لابن فارس (entry 988846)"
          addition: "الجذر مرس يدل على التلاصق والملازمة بشدة، ومنه مَارَسَ بمعنى لازم الشيء وخبره؛ وهذا يوثّق صلاحية المورفيم لكن لا يُثبت المصطلح المركب"

    - lemma: "مُتَرَيِّض"
      confirm:
        - text: "«ذكر الأساسي الفعل تريَّض ومصدره تريُّض بمعنى خرج قاصدًا المشي على سبيل الرياضة، وعليه يمكن تصحيح المثال المرفوض الذي اشتقه المحدثون مباشرة من كلمة رياضة، كما اشتقوا التقييم من كلمة قيمة. الصواب والرتبة: خرجنا للتريُّض [صحيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر (entry 851757)"
      expands:
        - text: "«رَوَضَ — الرَّاءُ وَالْوَاوُ وَالضَّادُ أَصْلَانِ مُتَقَارِبَانِ فِي الْقِيَاسِ، أَحَدُهُمَا يَدُلُّ عَلَى اتِّسَاعٍ، وَالْآخَرُ عَلَى تَلْيِينٍ وَتَسْهِيلٍ... رُضْتُ النَّاقَةَ أَرُوضُهَا رِيَاضَةً»"
          source: "مقاييس اللغة لابن فارس (entry 986689)"
          addition: "الجذر روض يفيد التليين والترويض؛ ومنه «تريَّض» بمعنى مارس ما يُليّن البدن ويُرونقه"
        - text: "«(الرياضة البدنية): القيام بحركات خاصة تكسب البدن قوة ومرونة (مج)»"
          source: "المعجم الوسيط (entry 11849)"
          addition: "يُثبت أن الرياضة البدنية مصطلح حديث مقبول، ومنه اشتُق تريَّض واسم الفاعل مُتَرَيِّض"

    - lemma: "رَيَّاض"
      contradicts:
        - text: "«الرَّيِّضُ: من الدوابِّ: الذى لم يقبل الرياضة ولم يذل لراكبه (للمذكر والمؤنث)»"
          source: "المعجم الوسيط (entry 11850)"
          conflict: "الوصف الصرفي القريب (الرَّيِّض على فَيْعِل) يعني في الأصل الدابة غير المروَّضة، أي عكس المعنى المراد تماماً. وصيغة رَيَّاض (فَعَّال) غير مُثبتة في المعاجم بمعنى ممارس الرياضة"
      expands:
        - text: "«رِيَاض: من (ر و ض) جمع الروضة: الأرض ذات الخضرة والبستان الحسن»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry 926767)"
          addition: "رياض بالكسر جمع روضة لا صيغة مبالغة، مما يرفع احتمال اللبس مع صيغة رَيَّاض"

    - lemma: "مُمَارِسُ الرِّيَاضَة"
      confirm:
        - text: "«مُمَارِس: practitioner»"
          source: "arabterm — المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«ممارس» مُثبَّت في arabterm بمعنى «ممارِس مهنة» (طبية) لا ممارِس رياضة"
          source: "arabterm"
          conflict: "التركيب «ممارس الرياضة» وصفي حر يفشل اختبار التثبيت المعجمي (fixedness test)"

    - lemma: "رِيَاضِيّ"
      confirm:
        - text: "«رياضي: sports man — المجال: Arts, Recreation and Sports»"
          source: "مسرد الفن والتسلية والرياضة، ALECSO — arabterm (entry 495258)"
        - text: "«(1) الرِّياضيّ (2) ذو الروح الرياضية.» بمقابل: sportsman"
          source: "المورد الحديث 2008 — arabterm (entry 719338)"
        - text: "«الرياضيّ: واحد الرياضيين.» بمقابل: athlete"
          source: "المورد الحديث 2008 — arabterm (entry 671716)"
        - text: "«رِيَاضِيّ: من (ر و ض) نسبة إلى الرِيَاضة: القيام بحركات خاصة تكسب البدن قوة ومرونة»"
          source: "موسوعة السلطان قابوس لأسماء العرب (entry 926770)"


# ── المرحلة ٣: التحليل اللغوي للّمات ───────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "ممارس رياضة"
      decision: removed
      decision_reason: >
        تعبير وصفي حر لا مصطلح مسكوك: يُخفق في اختبار السكّ (إبدال «ممارس» بـ«مزاول»
        أو «محترف» يُبقي الوصفية قائمة). لا يوجد أي توثيق معجمي له كمصطلح ثابت بمعنى
        «ممارس الرياضة». علاوة على ذلك، التركيب مفصول (ممارس + رياضة بدون «ال») مما يجعله
        أقرب إلى عبارة حرة منه إلى مدخل معجمي. اللمّة تعيد صياغة التعريف بكلمات مختلفة
        (دوران دلالي شبه تام).
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُتَرَيِّض"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في معجم الصواب اللغوي لأحمد مختار عمر بحكم «صحيحة»: الفعل «تريَّض»
        واسم المصدر «تريُّض» بمعنى خرج قاصداً المشي على سبيل الرياضة. اسم الفاعل
        «مُتَرَيِّض» مقيس صرفياً على هذا الفعل (وزن مُتَفَعِّل). يُميَّز بنيان الكلمة
        بين الهواية والممارسة الخفيفة، مما يُكسبها ظلاً دلالياً خاصاً يُكمّل «رياضي».
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يختلف «مُتَرَيِّض» عن «رِيَاضِيّ» في أنه يُفيد الممارسة الخفيفة والهاوية
        (الشخص يمشي أو يتحرك للحفاظ على اللياقة)، بينما «رياضي» يُشير عادة إلى من
        يُنظَر إليه بوصفه مُختصاً أو محترفاً في مجال الرياضة.
      actions:
        - command: create_entry
          params:
            lemma: "مُتَرَيِّض"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "رَيَّاض"
      source: stage1
      decision: removed
      decision_reason: >
        تعارض دلالي مع أقرب صيغة موثَّقة: «الرَّيِّض» (فَيْعِل من جذر روض) يعني
        الدابة غير المروَّضة التي لم تقبل التدريب — أي عكس المعنى المراد. وصيغة
        «رَيَّاض» (فَعَّال) غير مُثبَّتة في أي معجم بمعنى ممارس الرياضة. يزيد من
        المشكلة أن «رياض» (بالكسر) شائع جداً بمعنى جمع روضة أو اسم علم، مما يُولّد
        التباساً دلالياً.

    - lemma: "مُمَارِسُ الرِّيَاضَة"
      source: stage1
      decision: removed
      decision_reason: >
        تركيب وصفي يُعيد صياغة التعريف ذاته (ممارس + الرياضة). يُخفق في اختبار
        التثبيت المعجمي: يمكن إبدال «الرياضة» بـ«الكرة» أو «السباحة» ويبقى وصفاً
        حراً. وجوهره نفس اللمّة المرفوضة «ممارس رياضة» مع تعريف الجزء الثاني فقط.

    - lemma: "رِيَاضِيّ"
      source: stage1
      decision: confirmed
      decision_reason: >
        مُثبَّت في مصادر معجمية متعددة بمعنى «sportsman / athlete»: arabterm
        (ALECSO) والمورد الحديث (2008). الكلمة اسم منسوب قياسي (رياضة → رياضيّ)
        موثَّق في موسوعة السلطان قابوس بأصله الاشتقاقي. رغم وجوده في لمّات المجموعة
        الأعلى (awn4-09839665-n)، إلا أن هذا لا يمنع وجوده هنا لأن اللفظ متعدد
        المعاني (polysemous) ويُستخدم بالمعنى العام (ممارس الرياضة) والخاص (المحترف).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        «رِيَاضِيّ» المصطلح الأكثر شيوعاً وعمومية، يُطلق على كل من ينتسب للرياضة
        (هاوياً كان أم محترفاً). بينما «مُتَرَيِّض» يُخصَّص لمن يمارس الرياضة الخفيفة
        (المشي، التمارين اليومية) لأغراض صحية أو ترفيهية لا تنافسية.
      actions:
        - command: create_entry
          params:
            lemma: "رِيَاضِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────
stage4_content:
  definition:
    current: "شخص يمارس الرياضة"
    assessment:
      decision: revise
      reason: >
        التعريف الحالي مقبول من حيث القِصَر والوضوح، لكنه يستخدم «يمارس الرياضة» في
        تعريف ممارس الرياضة مما يُوقعه في شبه دوران. كذلك لا يُميّز بين الهاوي
        والمحترف، ولا يُحدد ماهية الرياضة (بدنية). يحتاج إلى جنس قريب أوضح
        وفصل نوعي يضبط النطاق الدلالي للمجموعة الترادفية المتميزة عن الهايبرنيم.
