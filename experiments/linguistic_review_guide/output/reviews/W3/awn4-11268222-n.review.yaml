# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّتان الموجودتان (أوغسطس بوجين، بوجين) تفتقران إلى التشكيل الكامل"
      - "الاسم الرباعي الكامل (Augustus Welby Northmore Pugin) غائب من اللمّات العربية رغم وجوده في اللمّات الإنجليزية"
      - "هذه مجموعة اسم علم لشخص بعينه: لا ينطبق عليها التوليد الاشتقاقي أو المجازي؛ التعريب الصوتي هو المسلك الوحيد"
    observations: >
      مجموعة اسم علم (proper noun) لمعماري إنجليزي شهير من القرن التاسع عشر، عُرِفَ
      بإحياء الطراز القوطي في فن العمارة. اللمّات المتوقعة تعريبات صوتية للاسم
      الأجنبي لا اشتقاقات عربية، مما يحصر منهج التوليد في التعريب وحده. الأولوية
      العملية هي: (أ) ضبط التشكيل على اللمّتين الموجودتين، و(ب) إضافة الصيغة
      الرباعية الكاملة المقابلة لـ Augustus Welby Northmore Pugin.

  blind_candidates:
    - lemma: "أُوغُسطُس بُوجِين"
      generation_method: taarib
      justification: >
        تعريب صوتي لـ Augustus Pugin بصيغته الثنائية (الاسم الأول + اللقب)،
        وهي الصيغة الأكثر شيوعاً في الكتابات الأكاديمية العربية للدلالة على هذا المعماري
        الذي اشتُهِرَ بإحياء العمارة القوطية بين 1812 و1852.
    - lemma: "بُوجِين"
      generation_method: taarib
      justification: >
        تعريب اللقب Pugin وحده، يُستخدم اختصاراً بعد ذكر الاسم كاملاً أو في السياق
        الأكاديمي غير الرسمي.
    - lemma: "أُوغُسطُس وِيلبِي بُوجِين"
      generation_method: taarib
      justification: >
        تعريب ثلاثي يضمّ الاسمَين الأول والوسطى (Welby)، يُستعمل في بعض المصادر
        التخصصية للتمييز بين أفراد عائلة بوجين المعمارية.
    - lemma: "أُوغُسطُس وِيلبِي نُورثمُور بُوجِين"
      generation_method: taarib
      justification: >
        تعريب الاسم الرباعي الكامل Augustus Welby Northmore Pugin، الصيغة الأكاديمية
        الرسمية المطلوبة للتوثيق الببليوغرافي الدقيق والبحث العلمي المتخصص في تاريخ العمارة.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────
stage2_evidence:
  # استراتيجية الاستعلام المُنفَّذة:
  # ١. مطابقة دقيقة دفعية: البحث عن جميع اللمّات وصيغ ال- → لا نتائج
  # ٢. جسر إنجليزي: البحث عن Augustus Pugin / Gothic Revival → لا نتائج
  # ٣. FTS عربي: كلمات مفتاحية (قوطي، معماري، إحياء، عمارة قوطية) → نتائج عامة لا تخصّ بوجين
  # ٤. جسر إنجليزي موسّع: Gothic / architect / revival → مصطلحات عامة لا أعلام
  # الخلاصة: هذه تعريبات لاسم أجنبي لشخص غير عربي، لا حضور لها في المعاجم العربية.

  per_lemma:
    - lemma: "أوغسطس بوجين"
      evidence_status: "no_material_found"

    - lemma: "بوجين"
      evidence_status: "no_material_found"

    - lemma: "أُوغُسطُس بُوجِين"
      evidence_status: "no_material_found"

    - lemma: "بُوجِين"
      evidence_status: "no_material_found"

    - lemma: "أُوغُسطُس وِيلبِي بُوجِين"
      evidence_status: "no_material_found"

    - lemma: "أُوغُسطُس وِيلبِي نُورثمُور بُوجِين"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للّمات ─────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّة الموجودة ١ ──
    - lemma: "أوغسطس بوجين"
      decision: confirmed
      decision_reason: >
        اللمّة الرئيسية للمجموعة؛ تعريب صوتي سليم للاسم Augustus Pugin بصيغته الثنائية
        الأكثر تداولاً في المصادر الأكاديمية العربية. لا توجد مشكلة في المضمون، غير أنها
        تحتاج تشكيلاً كاملاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الصيغة الثنائية (الاسم الأول + اللقب)؛ هي الصيغة المرجعية الأكثر شيوعاً في
        الكتابات الأكاديمية العربية المتعلقة بتاريخ العمارة.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "أُوغُسطُس بُوجِين"

    # ── اللمّة الموجودة ٢ ──
    - lemma: "بوجين"
      decision: confirmed
      decision_reason: >
        صيغة مختصرة مقبولة للقب Pugin وحده؛ شائعة في الكتابات التخصصية بعد الذكر
        الأول للاسم الكامل. تحتاج تشكيلاً.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        اللقب المفرد؛ يُستعمل اختصاراً في السياق الأكاديمي غير الرسمي أو بعد ورود
        الاسم الكامل سابقاً في النص.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "بُوجِين"

    # ── مرشّح المرحلة ١ — الأول ──
    - lemma: "أُوغُسطُس بُوجِين"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة (أوغسطس بوجين) بعد ضبط التشكيل؛ يُعالَج بإجراء update_lemma
        على اللمّة الأصلية لا بإنشاء مدخل جديد.

    # ── مرشّح المرحلة ١ — الثاني ──
    - lemma: "بُوجِين"
      source: stage1
      decision: removed
      decision_reason: >
        مطابق للمّة الموجودة (بوجين) بعد ضبط التشكيل.

    # ── مرشّح المرحلة ١ — الثالث ──
    - lemma: "أُوغُسطُس وِيلبِي بُوجِين"
      source: stage1
      decision: removed
      decision_reason: >
        صيغة ثلاثية غير مكتملة (تغيب Northmore)؛ لا تتطابق مع الاسم الكامل الرسمي
        المسجّل في OEWN، والصيغة الرباعية الكاملة أوثق للتوثيق الأكاديمي.

    # ── مرشّح المرحلة ١ — الرابع ──
    - lemma: "أُوغُسطُس وِيلبِي نُورثمُور بُوجِين"
      source: stage1
      decision: confirmed
      decision_reason: >
        تعريب الاسم الرباعي الكامل Augustus Welby Northmore Pugin، وهو اللمّة الإنجليزية
        الثالثة في OEWN الغائبة تماماً عن اللمّات العربية الحالية. إضافتها تسدّ فجوة
        توثيقية حقيقية في الشبكة الدلالية العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        الاسم الرباعي الكامل بأسمائه الوسطى (Welby Northmore)؛ مطلوب للتوثيق
        الببليوغرافي الدقيق وفهارس الأعلام في المراجع الأكاديمية المتخصصة.
      actions:
        - command: create_entry
          params:
            lemma: "أُوغُسطُس وِيلبِي نُورثمُور بُوجِين"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-11268222-n"


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────
