      decision: revise
      reason: >
        التعريف الحالي صحيح في مضمونه، لكنه يعتمد صياغة عامية (لعب دوراً) لا تناسب
        أسلوب المعجم الوسيط؛ كما أن «الطراز القوطي» أدق من «العمارة القوطية» إذ الأخيرة
        مصطلح أوسع يشمل تقاليد عدة.
