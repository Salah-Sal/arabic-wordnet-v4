stage1_review:
  assessment:
    concerns:
      - "اللمة الموجودة 'مجرى المد' صحيحة وصفياً لكنها قد تفتقر للاصطلاح المعجمي الواحد."
      - "نقص التشكيل في اللمة الحالية."
    observations: "المفهوم يشير إلى القنوات المائية المتأثرة بحركة المد والجزر، وهناك عدة ألفاظ فنية وتراثية تفي بهذا الغرض."
  blind_candidates:
    - lemma: "مَجْرَى المَدّ"
      generation_method: tarkib
      justification: "تعبير إضافي يصف القناة (المجرى) منسوبة إلى ظاهرة المد."
    - lemma: "خَوْر"
      generation_method: majaz
      justification: "لفظ تراثي يطلق على لسان البحر الذي يمتد في البر أو مَصَبّ الماء في البحر، وهو مرادف طبيعي لـ tideway."
    - lemma: "قَنَاة مَدِّيَّة"
      generation_method: tarkib
      justification: "تعبير وصفي حديث (قناة + مدية) يستخدم في علوم البحار والجيولوجيا."
    - lemma: "مَمَرٌّ مَدِّيّ"
      generation_method: tarkib
      justification: "تعبير اصطلاحي يشير إلى الممر المائي الذي تسلكه مياه المد."

stage2_evidence:
  per_lemma:
    - lemma: "مَجْرَى المَدّ"
      confirm:
        - text: "«سبيل [أو مَسْلك] المدّ؛ قناة تجري فيها مياه المدّ.»"
          source: "المورد الحديث"
    - lemma: "خَوْر"
      confirm:
        - text: "«الخَوْرُ: مَصب المَاء فِي الْبَحْر، وَقيل: هُوَ خَليجٌ من الْبَحْر.»"
          source: "لسان العرب"
        - text: "«وهو عند عرب السواحل كالخليج يندّ من البحر.»"
          source: "معجم البلدان"
    - lemma: "قَنَاة مَدِّيَّة"
      confirm:
        - text: "«قناة مدية» في سياق ترجمة tidal channel."
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
    - lemma: "طَرِيق المَدّ"
      confirm:
        - text: "«طريق المد» ترجمة لمصطلح tideway."
          source: "المعجم الموحد لمصطلحات المياه"

stage3_analysis:
