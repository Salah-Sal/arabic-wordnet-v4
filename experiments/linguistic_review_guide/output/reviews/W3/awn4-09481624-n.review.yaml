stage4_content:
  definition:
    current: "قناة يجري فيها تيار المد والجزر"
    assessment:
      decision: revise
      reason: "التعريف الحالي مقتضب؛ يحتاج إلى دقة اصطلاحية توضح طبيعة هذا الممر المائي ومكانه."
    authored:
      - type: terminological
        text: "مَمرٌّ مائِيٌّ أَو قناةٌ تَنْفُذُ فيها مِيَاهُ البَحْرِ بِقُوَّةِ تَيَّارِ المَدِّ، وَغالِبًا ما تَكُونُ عِنْدَ مَصَبَّاتِ الأَنْهَارِ."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-09481624-n"
          definition_index: 0
          text: "مَمرٌّ مائِيٌّ أَو قناةٌ تَنْفُذُ فيها مِيَاهُ البَحْرِ بِقُوَّةِ تَيَّارِ المَدِّ، وَغالِبًا ما تَكُونُ عِنْدَ مَصَبَّاتِ الأَنْهَارِ."
  examples:
    per_lemma:
      - lemma: "مَجْرَى المَدّ"
        examples:
          - text: "تَكُونَ سُرْعَةُ التَّيَّارِ في مَجْرَى المَدِّ قَوِيَّةً مِمَّا يُؤَثِّرُ على حَرَكَةِ السُّفُنِ الصَّغِيرَةِ."
