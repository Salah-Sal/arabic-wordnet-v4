      - lemma: "خَوْر"
        examples:
          - text: "يُعَدُّ خَوْرُ دُبَيٍّ مَجْرًى مَدِيًّا طَبِيعِيًّا يَمْتَدُّ كَمِيًلَاتٍ دَاخِلَ اليَابِسَةِ."
            type: usage
      - lemma: "قَنَاة مَدِّيَّة"
        examples:
          - text: "تَتَشَكَّلُ القَنَاةُ المَدِّيَّةُ بِفِعْلِ النَّحْتِ المُسْتَمِرِّ لِتَيَّاراتِ المَدِّ وَالجَزْرِ في المناطقِ الرَّمْلِيَّةِ."
