        التعريف الحالي صحيح في جوهره لكن 'قادر' يُفيد الاستطاعة المجردة دون الإشارة
        إلى البراعة والاضطلاع الفعلي؛ 'number cruncher' يُفيد الإتقان والكفاءة العالية
        لا مجرد القدرة. كما يُستحسن ذكر الطابع الرياضي/العددي في التعريف.
