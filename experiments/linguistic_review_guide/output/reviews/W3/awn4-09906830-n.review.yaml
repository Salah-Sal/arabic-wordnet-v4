# ═══════════════════════════════════════════════════════════════
# مراجعة AWN4 — Review Pipeline v2 (5-Stage)
# Synset: awn4-09906830-n  |  ILI: i88778
# "number cruncher" — شخص قادر على إجراء حسابات معقدة وطويلة
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "كلتا اللمتين الموجودتين ('خبير أرقام' و'محلل كمي') تفتقران إلى التشكيل الكامل."
      - "'محلل كمي' مصطلح تقني متخصص في التحليل الكمي المالي والإحصائي (quant)، وهو أضيق دلالةً من المفهوم المقصود الذي يشمل كل من يُجيد الحسابات المعقدة بوجهٍ عام."
      - "التعريف الحالي 'شخص قادر على إجراء حسابات معقدة وطويلة' صحيح لكنه مسطَّح؛ فلفظ 'قادر' يُفيد الاستطاعة دون الإشارة إلى البراعة والاضطلاع الفعلي."
      - "المجموعة تفتقر إلى لمة مشتقة من معجم عربي أصيل (جذر حسب/حسابة)."
    observations: >
      المفهوم المعجمي 'number cruncher' يصف شخصاً يتميّز بقدرة استثنائية على إجراء
      الحسابات الرياضية المعقدة والمطوّلة، ويرتبط أصله الإنجليزي بمجاز الطحن
      (crunching). في العربية يُقابله بصدق لفظُ 'حسّاب' (وزن فعّال)، وهو مشهود في
      المعجمية العربية القديمة والحديثة. 'محلل كمي' مصطلح يُستخدم حديثاً لفئة مهنية
      محددة (المحللون الكميون في المال والإحصاء)، مما يُولّد إشكاليةً في التحديد
      الدلالي. أما 'خبير أرقام' فمركّب إضافي وصفي ذو طابع صحفي معاصر، غير مسجَّل
      في المعاجم الكلاسيكية لكنه متداوَل في الاستخدام الحديث.

  blind_candidates:
    - lemma: "حَسَّابٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر 'ح س ب' على وزن فَعَّال الدالّ على الاحتراف والإكثار من الفعل؛
        فالحسّاب هو من يُكثر الحسابَ ويجيده. الوزن ملائم دلالياً: طبّاخ (يكثر
        الطبخ)، بقّال (يكثر البيع)، حسّاب (يكثر الحسابَ ويبرع فيه). ليس في التعريف
        نفسه فيُؤمَن الدوران.
    - lemma: "رَقَّامٌ"
      generation_method: ishtiqaq
      justification: >
        مشتق من جذر 'ر ق م' (الأرقام والكتابة العددية) على وزن فَعَّال؛ فالرقّام
        من يعمل كثيراً بالأرقام والعلامات العددية. محاولة لإيجاد لفظ مرتبط بالأرقام
        تحديداً لا بالحساب عموماً.
    - lemma: "مُطَحِّنُ الْأَرْقَامِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي يستلهم مجاز 'number cruncher' (طاحن الأرقام): المطحن من طحن
        (يطحن) أي يعالج كميات ضخمة ويسحقها. المجاز الوظيفي قريب: كما يطحن الطاحون
        الحبوبَ كثيراً وباقتدار، يُعالج الحسّاب الأرقامَ كثيراً وباقتدار.
    - lemma: "حَاذِقُ الْحِسَابِ"
      generation_method: tarkib
      justification: >
        تركيب إضافي: حاذق (الماهر، القاطع) + الحساب. يدل على من يتقن الحساب
        إتقاناً نافذاً. جذر 'ح ذ ق' يدل على الحدّة والبراعة. المركّب يُفيد
        التخصص الكفئ في الحساب.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  queries_run:
    - id: Q1
      type: batch_headword
      terms: >
        خبير ارقام، محلل كمي، خبير، ارقام، محلل، كمي، حساب، رقام، مطحن الارقام، حاذق
        (+ صيغ ال-)
      results: 86 مدخلاً
    - id: Q2
      type: english_bridge
      terms: "number cruncher, calculator, arithmetician, quant, quantitative analyst"
      results: 19 مدخلاً
    - id: Q3
      type: arabic_fts
      terms: "حسابات، حاسب، حاسبة، رقام، حسّاب"
      results: 30 مدخلاً
    - id: Q4
      type: maqayis
      roots: "حسب، رقم، خبر، حل"
      results: 4 مدخلات

  per_lemma:

    - lemma: "خبير أرقام"
      confirm:
        - text: >
            «خبير: ذو الخبرة الذي يُخبِرُ الشيءَ بعلمه.»
          source: "المعجم الوسيط (OCR)"
        - text: >
            «خبير: الذي يعلم الأشياء ويقف على حقيقتها بعلمه وقدرته.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >
            «خبير: expert»
          source: "المعجم الموحد لمصطلحات القانون (ARABTERM)"
        - text: >
            «أرقام: numerals»
          source: "المعجم الموحد لمصطلحات الرياضيات والفلك (ARABTERM)"
      expands:
        - text: >
            «الخبير: أعلم الناس بالرجل صاحبه ومخالطه الرئيس المخبر.»
          source: "المعجم الكبير (OCR)"
          addition: >
            يُشير إلى أن 'خبير' يحمل دلالة التعمق والمخالطة التامة للشيء، وهو
            ما يتوافق مع براعة الحسّاب في الأرقام وليس مجرد معرفة بها.

    - lemma: "محلل كمي"
      confirm:
        - text: >
            «مُحَلِّل: أحد أعضاء المجتمع التقني (مثل: مهندس النظم أو محلّل
            الأعمال اللذَّيْن يُطوِّران متطلبات النظام)، وهو ماهر ومدرَّب...»
          source: "معجم مصطلحات المعلوماتية — ARABTERM"
        - text: >
            «كمّيّ: ما يتعلق بالكم دون التركيز على الجودة أو النوعية.
            (quantitative)»
          source: "مسرد التربية — ARABTERM"
      contradicts:
        - text: >
            «الكمِيُّ: الشجاع المتكمِّي في سلاحه أي المتغطِّي المتستِّر بالدِّرع
            والبيضة.»
          source: "مختار الصحاح للرازي"
          conflict: >
            'كمي' في التراث العربي الكلاسيكي يعني الشجاع المُدَجَّج بالسلاح،
            لا صلة له بالكمية أو التحليل العددي؛ فالاستخدام الحديث لـ'كمي'
            بمعنى quantitative اصطلاح جديد قد يستدعي التوضيح.
        - text: >
            «المحلِّل: متزوّج المطلقة ثلاثاً لتحلّ للزوج الأول.»
          source: "المعجم الوسيط (OCR)"
          conflict: >
            'المحلّل' في المعجم الكلاسيكي له معنى فقهي محدد (المحلِّل في
            الزواج)، وإعادة استخدامه للدلالة على analyst قد تُوجِد اشتباكاً
            لدى القارئ الكلاسيكي.

    - lemma: "حَسَّابٌ"
      confirm:
        - text: >
            «حَسَّاب: من (ح س ب) الذي يُجيد الحسابَ والمختص بالحسبة.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: >
            «الحَسَّابُ: لقبٌ غَلَبَ على محمد بن إبراهيم بن حَمْدُويِه
            الحَسَّابِ البُخاريِّ (٣٣٩هـ): مُحدِّثٌ فرضيٌّ، قيل له ذلك
            لمعرفته بالفرائض.»
          source: "المعجم الكبير (OCR)"
        - text: >
            «الحَاءُ وَالسِّينُ وَالْبَاءُ أُصُولٌ أَرْبَعَةٌ: فَالْأَوَّلُ:
            الْعَدُّ. تَقُولُ: حَسَبْتُ الشَّيْءَ أَحْسُبُهُ حَسْبًا
            وَحُسْبَانًا.»
          source: "مقاييس اللغة لابن فارس"
      expands:
        - text: >
            «حَسَّابَةٌ: calculator»
          source: "المعجم الطبي الموحد — ARABTERM"
          addition: >
            التأنيث بالتاء (حسّابة) أعطي للآلة، مما يدل على رسوخ 'حسّاب'
            في دلالة الشخص (المُذكَّر) الذي يجيد الحساب، بخلاف الآلة.

    - lemma: "رَقَّامٌ"
      evidence_status: "no_material_found"

    - lemma: "مُطَحِّنُ الْأَرْقَامِ"
      evidence_status: "no_material_found"

    - lemma: "حَاذِقُ الْحِسَابِ"
      confirm:
        - text: >
            «حَاذِق: من (ح ذ ق) الماهر والقاطع.»
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: >
            «الرَّاءُ وَالْقَافُ وَالْمِيمُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى
            خَطٍّ وَكِتَابَةٍ وَمَا أَشْبَهَ ذَلِكَ. فَالرَّقْمُ: الْخَطُّ.
            وَيُقَالُ لِلْحَاذِقِ فِي صِنَاعَتِهِ: هُوَ يَرْقُمُ فِي
            الْمَاءِ.»
          source: "مقاييس اللغة لابن فارس (جذر رقم)"
          addition: >
            'يرقم في الماء' مثَلٌ عربي للحاذق في صناعته، مما يدل على أن
            'حاذق' وحده يحمل دلالة التمييز المهاري بلا حاجة لإضافة؛ غير أن
            التركيب 'حاذق الحساب' يظل وصفياً غير مسكوك.


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "خبير أرقام"
      decision: confirmed
      decision_reason: >
        مركّب إضافي معاصر متداوَل في الصحافة العربية والمعجمية الحديثة للدلالة على
        الخبير بالأرقام؛ مكوّناه ('خبير' و'أرقام') موثَّقان معجمياً بالمعنى الملائم.
        يحتاج إلى تشكيل كامل وتصحيح صيغة الإضافة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >
        يُركّز على الخبرة المهنية والتخصص في التعامل مع الأرقام؛ ذو طابع مهني
        وإعلامي معاصر — يُفيد الوظيفة والتخصص أكثر من الموهبة الذاتية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "خَبِيرُ الْأَرْقَامِ"

    - lemma: "محلل كمي"
      decision: removed
      decision_reason: >
        'محلل كمي' مصطلح ذو دلالة مهنية أضيق من المفهوم المقصود؛ فهو يُحيل إلى
        فئة متخصصة من المهنيين (المحللون الكميون في المال والإحصاء الرياضي)، بينما
        'number cruncher' يعني كل شخص يتميز بالقدرة على الحسابات المعقدة بوجه عام
        دون اشتراط التخصص المالي. علاوة على ذلك، 'الكمي' بالمعنى العصري (quantitative)
        يُصادم دلالته الكلاسيكية (الشجاع المُدَرَّع)، مما يُثير اشتباكاً لفظياً.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "حَسَّابٌ"
      source: stage1
      decision: confirmed
      decision_reason: >
        موثَّق في موسوعة السلطان قابوس وفي المعجم الكبير بمعنى 'من يجيد الحساب'؛
        وزن فعّال قياسي للاحتراف والإكثار. يُكمّل 'خبير الأرقام' بتقديم لفظ مشتق
        أصيل من الجذر العربي 'حسب'. يجتاز اختبار الدوران (لا يُكرر التعريف)
        واختبار التثبيت (لفظ مُعجَم ثابت).
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركّز على الموهبة الحسابية الذاتية والطبيعة الفطرية؛ ذو طابع كلاسيكي
        وتراثي — يُفيد الإتقان والبراعة الشخصية أكثر من الوظيفة المهنية.
      actions:
        - command: create_entry
          params:
            lemma: "حَسَّابٌ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09906830-n"

    - lemma: "رَقَّامٌ"
      source: stage1
      decision: removed
      decision_reason: >
        جذر 'رقم' يدل على الخط والكتابة لا على الحساب العددي (ابن فارس: "يدل على
        خط وكتابة")؛ فـ'رقّام' بمعنى حسّاب انزياح دلالي بعيد غير مؤيَّد بأدلة
        معجمية. لم يُعثَر على هذا الوزن بهذه الدلالة في أي مصدر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مُطَحِّنُ الْأَرْقَامِ"
      source: stage1
      decision: removed
      decision_reason: >
        ترجمة حرفية لـ'number cruncher' دون توثيق معجمي؛ يفشل اختبار التثبيت
        المعجمي (ليس وحدة معجمية مسجَّلة). فضلاً عن ذلك، يُمكن إبدال 'أرقام'
        بـ'بيانات' أو 'حسابات' ويظل الوصف صالحاً، مما يُثبت طابعه الوصفي الحر.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "حَاذِقُ الْحِسَابِ"
      source: stage1
      decision: removed
      decision_reason: >
        يفشل اختبار التثبيت المعجمي: 'حاذق الكيمياء'، 'حاذق الرياضيات' — كلها
        تعمل وصفاً، إذ ليس في 'حاذق الحساب' من الخصوصية ما يجعله مصطلحاً مسكوكاً.
        هو تعبير وصفي حر لا مصطلح معجمي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────
stage4_content:
