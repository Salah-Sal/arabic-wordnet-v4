        text: >
          الحَسَّاب المتمرِّس: مَن أجادَ الحسابَ العدديَّ وأكثرَ منه حتى تَفَرَّدَ
          بالاضطلاع بأعسرِه وأطوَلِه.
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
