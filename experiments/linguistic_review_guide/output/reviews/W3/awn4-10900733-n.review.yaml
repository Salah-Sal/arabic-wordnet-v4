      entry_id: "{auto}"
      # لا root ولا maqayis_quote: الاسم أعجمي لا أصل له في المعجمية العربية.
      # «جوزيف» ← الإنجليزية Joseph ← العبرية Yosef (يوسف)
      # «كامبل» ← الإسكتلندية Campbell (حقل متعرّج)

    - lemma: "كامْبِل"
      entry_id: "{auto}"
