# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2
# Synset: awn4-10900733-n  |  ILI: i94635
# جوزيف كامبل — Joseph Campbell (1904-1987)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:

  # أ. توليد المرشحات — قبل الاطلاع على اللمّات الموجودة
  # التعريف المقنّع: "عالم أساطير أمريكي (1904-1987)"
  # التواريخ 1904–1987 تُشير بوضوح إلى جوزيف كامبل؛
  # جميع المرشحات هي تعريبات صوتية أو توافق اسمي.
  blind_candidates:
    - lemma: "جُوزِيف كامْبِل"
      generation_method: taarib
      justification: >-
        تعريب صوتي مباشر للاسم الإنجليزي Joseph Campbell بصورته المعتمدة في
        المصادر العربية الأكاديمية؛ يُثبَّت الاسم الثنائي (الأول + اللقب).
    - lemma: "يُوسُف كامْبِل"
      generation_method: tarkib
      justification: >-
        تركيب إضافي يستبدل «جوزيف» بالمقابل العربي الأصيل «يوسف»، وهو اللفظ
        العربي المستقر للاسم العبري-الإنجليزي Joseph. يُمثّل اتجاه التعريب
        بالاسم العربي المناظر بدلاً من النقل الصوتي.
    - lemma: "كامْبِل"
      generation_method: taarib
      justification: >-
        الاسم الأخير (اللقب) منفرداً؛ متعارف عليه في الإحالات المختصرة
        في المصادر العربية. يكفي وحده للتعريف في سياق التخصص.
    - lemma: "جُوزِيف كامْبِيل"
      generation_method: taarib
      justification: >-
        تعريب بديل بمدّ ياء اللقب (كامبيل) كما ترد في بعض المصادر العربية؛
        يُمثّل تباين التهجئة الشائع بين الناشرين العرب.

  # ب. التقييم الأولي — بعد الاطلاع على synset_info الكامل
  assessment:
    concerns:
      - "اللمّتان الموجودتان («جوزيف كامبل» و«كامبل») مفتقرتان إلى التشكيل الكامل المطلوب."
      - >-
        لمّة «كامبل» منفردةً ملتبسة: تشترك مع ألقاب أخرى مشهورة في العربية
        (مثل «مسجّل كامبل-ستوكس» في علم الأرصاد، و«بطّ كامبل» في تربية
        الدواجن)، مما يُضعف تفردها دلالياً بوصفها اسماً لهذا الشخص.
      - >-
        لا يوجد في قاعدة البيانات المعجمية أي مدخل للاسمين المركّبين
        «جوزيف كامبل» أو «كامبل» بمعنى هذه الشخصية، وهو أمر متوقع لأسماء
        الأعلام الأجنبية في المعاجم العربية الكلاسيكية والحديثة.
    observations: >-
      المجموعة تمثّل اسم علم أعجمي لشخصية أكاديمية أمريكية بارزة في علم
      الأساطير المقارنة (مؤلف «البطل ذو الألف وجه» وسواه). اللمّات الواردة
      هي تعريبات صوتية مقبولة للاسم الإنجليزي، ولا مجال للاشتقاق العربي في
      هذا النوع من الأسماء. المشكلة الوحيدة التحريرية هي غياب التشكيل
      الكامل عن اللمّتين؛ وهو واجب وفق مواصفات AWN4 لكل لمّة مؤكدة.
      الفرق بين اللمّتين الموجودتين واضح: «جوزيف كامبل» للإحالة الرسمية
      و«كامبل» للإحالة المختصرة، وكلاهما متداول في المصادر العربية.


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# ميزانية الاستعلامات المنفّذة: ٤ استعلامات
#   [1] مطابقة دفعية: جميع اللمّات الموجودة + المرشحات
#   [2] الجسر الإنجليزي: Campbell, Joseph Campbell, mythologist, mythology
#   [3] كلمات مفتاحية FTS: عالم الأساطير، أسطوري، الأساطير
#   [4] تحقق دفعي من المرشحات + مصطلحات ذات صلة
stage2_evidence:
  per_lemma:

    # ── اللمّات الموجودة ──
    - lemma: "جوزيف كامبل"
      evidence_status: "no_material_found"
      # لم يرد هذا الاسم المركّب في أيٍّ من المعاجم الـ107 الموجودة في القاعدة.
      # «جوزيف» منفرداً ورد كاسم علم فقط.

    - lemma: "كامبل"
      expands:
        - text: "«مُسجِّل كامبل-ستوكس: مسجّل درجة سطوع الشمس يتكوَّن من عدسة أو
            من أجسام زجاجية كروية معينة تعكس صورة للشمس على السطح الآخر للعدسة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: >-
            يثبت أن لفظ «كامبل» يُستخدم في العربية التقنية نسبةً إلى أشخاص
            آخرين يحملون هذا اللقب (جون كامبل في علم الأرصاد)، مما يؤكد
            ضعف دلالة اللمّة المنفردة «كامبل» على جوزيف كامبل بالتحديد.
        - text: "«بطّ كامبل: بطّ إنكليزي صغير.»"
          source: "المورد الحديث (2008)"
          addition: >-
            شاهد إضافي على تعدد الإحالات لـ«كامبل» في العربية، مما يزيد
            من التباس اللمّة المنفردة.

    # ── مرشحات المرحلة ١ ──
    - lemma: "جُوزِيف كامْبِل"
      evidence_status: "no_material_found"
      # غياب الأدلة متوقع: أسماء الأعلام الأجنبية نادراً ما تُفرد بمداخل
      # في المعاجم اللغوية العربية؛ وجودها في AWN4 يقوم على الاستخدام
      # الفعلي في المصادر الموسوعية وليس على التوثيق المعجمي.

    - lemma: "يُوسُف كامْبِل"
      evidence_status: "no_material_found"
      # هذه الصيغة المهجّنة (اسم عربي + لقب أعجمي) لم ترد في القاعدة
      # ولا في المصادر المرجعية. المصادر العربية تميل إلى التعريب الصوتي
      # الكامل (جوزيف) لا الاستبدال بالمقابل العربي.

    - lemma: "جُوزِيف كامْبِيل"
      evidence_status: "no_material_found"

    # ── شواهد ذات صلة لمصطلحات دعم التعريف ──
    - lemma: "الميثولوجيّ"
      confirm:
        - text: "«الميثولوجيّ: العالِم بالأساطير.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الأساطيريّ: من يجمع الأساطير أو يكتب عنها.»"
          source: "المورد الحديث (2008)"
          addition: >-
            يكشف أن «الأساطيريّ» مستخدم كمقابل عربي للـ mythologist في
            بعض المعاجم الحديثة، وهو ما يدعم استخدام «عالم أساطير» في
            تعريف المجموعة.


# ── المرحلة ٣: التحليل اللغوي للمّات ─────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──
    - lemma: "جوزيف كامبل"
      decision: confirmed
      decision_reason: >-
        الاسم الرسمي الكامل لجوزيف كامبل بالتعريب الصوتي المعتمد؛ هو
        الشكل الأساسي المستخدم في المصادر الأكاديمية العربية (مثل ترجمات
        كتبه وموسوعة ويكيبيديا العربية). يستوجب تصحيح التشكيل فقط.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      nuance_differentiation: >-
        الصيغة الرسمية الكاملة تجمع الاسم الأول والأخير؛ تُستخدم عند
        الإدخال الأول للشخصية في النص أو في السياقات الأكاديمية الرسمية
        (الهوامش، المراجع، التراجم).
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "جُوزِيف كامْبِل"

    - lemma: "كامبل"
      decision: confirmed
      decision_reason: >-
        الاسم المختصر (اللقب وحده) مستخدم في الإحالات المتكررة بعد ذكر
        الاسم الكامل للمرة الأولى؛ شائع في الكتابة الأكاديمية العربية.
        رغم التباسه المحتمل مع «كامبل» في سياقات أخرى، يظل مقبولاً في
        المجموعة بوصفه لمّة ثانوية لأن المجموعة الترادفية ذاتها توفّر
        السياق المُحدِّد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        الاسم المختصر (اللقب)؛ يُستخدم في الإحالات اللاحقة والتكرارية
        بعد تأسيس الشخصية في النص، على عكس الاسم الكامل المخصص للسياق
        الرسمي الأول.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كامْبِل"

    # ── مرشحات المرحلة ١ ──
    - lemma: "جُوزِيف كامْبِل"
      source: stage1
      decision: removed
      decision_reason: >-
        هذه الصيغة مطابقة تماماً للمّة الموجودة «جوزيف كامبل» بعد
        تصحيح التشكيل؛ لا حاجة لإضافتها مرةً أخرى.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "يُوسُف كامْبِل"
      source: stage1
      decision: removed
      decision_reason: >-
        الصيغة المهجّنة (يوسف + كامبل) ليست مستخدمة في المصادر المرجعية
        العربية. التقليد العربي في تعريب الأسماء الغربية يلتزم إما بالنقل
        الصوتي الكامل (جوزيف كامبل) أو بالاستخدام المقطعي (كامبل)،
        ولا يميل إلى استبدال الاسم الأجنبي بمقابله العربي مع الإبقاء على
        اللقب الأجنبي.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "جُوزِيف كامْبِيل"
      source: stage1
      decision: removed
      decision_reason: >-
        التهجئة «كامبيل» بمدّ الياء شائعة لكنها غير مفضّلة على «كامبل»
        في الضبط المعجمي؛ تبنّي صيغة واحدة كافٍ، والصيغة المختارة
        (كامبل) أوجز وأشيع. لو أُريد إضافة صيغة بديلة يمكن إدراجها
        كـ add_form لا لمّة مستقلة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    - lemma: "كامْبِل"
      source: stage1
      decision: removed
      decision_reason: >-
        مطابق للمّة الموجودة «كامبل» بعد تصحيح التشكيل؛ الإجراء اللازم
        هو update_lemma على المدخل الموجود لا create_entry جديد.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false


# ── المرحلة ٤: التعريف والأمثلة ───────────────────────────────
stage4_content:

  definition:
    current: "عالم أساطير أمريكي (1904-1987)"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي صحيح لكنه مُقتضب جداً لاسم علم؛ فالتعريف الموسوعي
        الملائم لشخصية بهذا الحجم يتطلب ذكر أبرز إسهاماته وتخصصه الدقيق
        (الأساطير المقارنة) ليُميَّز عن علماء أساطير أمريكيين آخرين.
        علاوةً على ذلك، التعريف الحالي يُعدّ ترجمة حرفية للتعريف الإنجليزي،
        في حين يستوجب أسلوب المعجم الوسيط تأليف التعريف عربياً.
    authored:
      - type: encyclopedic
        text: >-
          عالِم أساطير مقارَنة أمريكي (1904-1987)، اشتهر بدراساته في الأساطير
          الإنسانية الكونية وصياغته نظرية «رحلة البطل» النموذجية، وأبرز
          مؤلفاته «البطل ذو الألف وجه» (1949).
    actions:
      - command: update_definition
        params:
          synset_id: "awn4-10900733-n"
          definition_index: 0
          text: "عالِم أساطير مقارَنة أمريكي (1904-1987)، اشتهر بدراساته في الأساطير الإنسانية الكونية وصياغته نظرية «رحلة البطل» النموذجية، وأبرز مؤلفاته «البطل ذو الألف وجه» (1949)."

  examples:
    per_lemma:
      - lemma: "جُوزِيف كامْبِل"
        examples:
          - text: >-
              أثَّرت نظرية جُوزِيف كامْبِل في «رحلة البطل» تأثيراً بالغاً
              في الأدب والسينما الغربيَّيْن خلال النصف الثاني من القرن
              العشرين.
            type: usage
      - lemma: "كامْبِل"
        examples:
          - text: >-
              يرى كامْبِل أن الأساطير الإنسانية، على اختلاف ثقافاتها،
              تتشارك في بنية سردية موحّدة تعكس مسيرة الروح في رحلتها
              نحو النضج.
            type: usage
    actions:
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "أثَّرت نظرية جُوزِيف كامْبِل في «رحلة البطل» تأثيراً بالغاً في الأدب والسينما الغربيَّيْن خلال النصف الثاني من القرن العشرين."
      - command: add_sense_example
        params:
          sense_id: "{auto}"
          text: "يرى كامْبِل أن الأساطير الإنسانية، على اختلاف ثقافاتها، تتشارك في بنية سردية موحّدة تعكس مسيرة الروح في رحلتها نحو النضج."


# ── المرحلة ٥: الإثراء (البيانات الوصفية) ────────────────────
