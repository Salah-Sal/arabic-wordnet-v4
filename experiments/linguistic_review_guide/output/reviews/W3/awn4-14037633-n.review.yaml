# مراجعة المجموعة الترادفية awn4-14037633-n — estivation/aestivation
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة الوحيدة «سبات صيفي» مركب وصفي بلا تشكيل، ولا توجد لمّة مفردة تقابل المفهوم"
      - "التعريف العربي ترجمة شبه حرفية من الإنجليزية، يحتاج صياغة معجمية أصيلة"
      - "غياب مصطلح «بيات صيفي» المستخدم في المعاجم الطبية و«التصيُّف» الوارد في المورد الحديث"
    observations: "المفهوم ينتمي إلى علم الحيوان (فسيولوجيا الحيوان)، وهو مقابل السبات الشتوي (hibernation). التعريف يحتاج تحسين أسلوبي ليتناسب مع الصياغة المعجمية العربية. المجموعة تحتاج إثراء بلمّات إضافية مؤكَّدة في المعاجم المتخصصة."
  blind_candidates:
    - lemma: "تَصَيُّف"
      generation_method: ishtiqaq
      justification: "اشتقاق من جذر «صيف» على وزن تَفَعُّل الدال على الدخول في حالة أو اتخاذها، فيكون المعنى: دخول الحيوان في حالة خمول صيفية. وزن تَفَعُّل منتج في العربية للدلالة على التحوّل إلى حالة (تحجُّر، تجمُّد)."
    - lemma: "بَيَاتٌ صَيْفِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «بيات» (من بات: أقام ليلاً، ثم توسَّع للإقامة والسكون عموماً) و«صيفي». البيات يُشير إلى حالة السكون والركود، وهو أقرب دلالياً من «سبات» الذي يغلب عليه معنى النوم الطبي."
    - lemma: "سُبَاتٌ صَيْفِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «سبات» (الراحة والنوم والسكون) و«صيفي»، على غرار «سبات شتوي» للسبات الشتوي. تركيب بديهي ومتوازٍ مع المصطلح المقابل."
    - lemma: "هُجُوعٌ صَيْفِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي من «هجوع» (النوم ليلاً، ثم توسَّع للسكون) و«صيفي». المورد الحديث يذكر الهجوع بمعنى السكون والخمول."

stage2_evidence:
  per_lemma:
    - lemma: "سُبَاتٌ صَيْفِيٌّ"
      confirm:
        - text: "«سبات صيفي — aestivation»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
        - text: "«سبات صيفي — aestivation»"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
      expands:
        - text: "«(السبات) الرَّاحَة وَفِي التَّنْزِيل الْعَزِيز {وَهُوَ الَّذِي جعل لكم اللَّيْل لباسا وَالنَّوْم سباتا} وَالنَّوْم والنومة الْخَفِيفَة كنوم الْمَرِيض وَالشَّيْخ المسن... و(فِي الطِّبّ) حَالَة يفقد فِيهَا الْمَرِيض وعيه فقدانا تَاما وَلَا يفِيق مِنْهَا بأقوى المنبهات وَهُوَ خلاف الْإِغْمَاء (مج)»"
          source: "المعجم الوسيط"
          addition: "السبات في اللغة: الراحة والنوم، وفي الطب: فقدان الوعي التام. الاستعمال الحيواني (dormancy) توسّع حديث."
        - text: "«سبات شتوي — hibernation: اكتنان الشتاء أي فتور الحياة في بعض النباتات والحيوانات في الشتاء»"
          source: "المعجم الموحد لمصطلحات علم الأحياء (1993)"
          addition: "يؤكد وجود نمط «سبات + فصلي» في المصطلحية العربية"

    - lemma: "تَصَيُّف"
      confirm:
        - text: "«(2) التصيُّف (مج): قضاء الصيف في حالة خَدَرٍ وَفَقْدِ حسٍّ (ح)»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«تَصَيَّفَ — فلانٌ, وغيرُه: دَخَلَ في الصَّيْفِ. الشمسُ للغروبِ: مالتْ ودنت منه. فلانٌ المكانَ, وبه: أقامَ به صَيْفًا»"
          source: "المعجم الكبير"
          addition: "الفعل تَصَيَّفَ أصله الدخول في الصيف والإقامة فيه، والمعنى الحيواني المجمعي (مج) توسُّع دلالي"
        - text: "«(تصيف) بِالْمَكَانِ اصطاف»"
          source: "المعجم الوسيط"
          addition: "المعجم الوسيط يذكر المعنى العام فقط (الإقامة صيفاً)، دون التخصيص الحيواني"

    - lemma: "بَيَاتٌ صَيْفِيٌّ"
      confirm:
        - text: "«بَيَاتٌ صَيْفِيٌّ — aestivation (estivation)»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«البيات الصيفي: حالة فسيولوجية يقل فيها معدل الأيض في بعض الحيوانات، مثل البرمائيات الاستوائية مما يمكنها من اجتياز مرحلة الصيف الحار الجاف.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«بيات صيفي — aestivation: مصطلح يستخدم لوصف الحالة التي يعبر بها كائن حي فترات غير مواتية من ارتفاع في درجة الحرارة في الصيف أو في موسم الجفاف والتي خلالها يقلص إلى حد كبير أو يعلق مؤقتا أنشطته العادية (على العكس من السبات).»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (ALECSO)"

    - lemma: "هُجُوعٌ صَيْفِيٌّ"
      confirm:
        - text: "«هُجوعٌ صَيفِيّ — estivation (summer dormancy)»"
          source: "المعجم الطبي الموحد (2009)"
      contradicts:
        - text: "«هَجَعَ — الْهَاءُ وَالْجِيمُ وَالْعَيْنُ: كَلِمَةٌ تَدُلُّ عَلَى نَوْمٍ. وَهَجَعَ هُجُوعًا: نَامَ لَيْلًا.»"
          source: "مقاييس اللغة لابن فارس"
          conflict: "الهجوع في أصل اللغة مختص بنوم الليل، فاستعماله لحالة صيفية نهارية فيه تجوُّز بعيد"

