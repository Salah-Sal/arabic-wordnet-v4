# ── المرحلة ١: المراجعة والتوليد (عمياء) ──────────────────────
stage1_review:
  assessment:
    concerns:
      - "قيمة ILI فارغة — المجموعة غير مربوطة بالشبكة الدلالية الدولية Princeton Wordnet"
      - "لمّة «مهندس ديكور» تجمع مصطلحًا هندسيًا عربيًا (مهندس = engineer) بكلمة فرنسية الأصل (décor) دون تعريب اشتقاقي كامل، مما يُنتج تركيبًا هجينًا غير معياري"
      - "اللمّتان الموجودتان خاليتان من التشكيل الكامل"
      - "التعريف الحالي يستخدم «الديكور» (كلمة فرنسية الأصل) في صلب التعريف بدل المصطلح العربي الأصيل"
    observations: "المجموعة تصف مهنةً عصريةً هي المتخصص في تصميم الفضاءات الداخلية وتزيينها. لمّة «مزخرف داخلي» أقرب إلى الصواب من «مهندس ديكور» إذ تستند إلى الجذر العربي (زخرف) الدال على الزينة. غير أن المصطلحَيْن ARABTERM المُوثَّقَيْن الأدق هما «مُنَسِّق دَاخِلِيّ» = interior decorator، و«مُصَمِّم دَاخِلِيّ» = interior designer. تحتاج المجموعة إلى تشكيل كامل وتعريف معجمي يستند إلى جذور عربية."
  blind_candidates:
    - lemma: "مُؤَثِّثٌ"
      generation_method: ishtiqaq
      justification: "من الجذر (أثث)، وزن مُفَعِّل (اسم فاعل الثلاثي المزيد بالتضعيف). أَثَّثَ البيتَ: جهَّزه وفرشه بالأثاث. المُؤَثِّث هو من يتخصص في تجهيز الفضاء الداخلي وتأثيثه، وهو مشتق عربي أصيل."
    - lemma: "مُصَمِّمٌ دَاخِلِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي (اسم فاعل + نسبة): مُصَمِّم (اسم فاعل صَمَّمَ = to design، وزن مُفَعِّل) + دَاخِلِيّ (نسبة إلى الداخل = interior). يصف المتخصص في تصميم وتخطيط الفضاءات الداخلية."
    - lemma: "مُنَسِّقٌ دَاخِلِيٌّ"
      generation_method: tarkib
      justification: "مركب وصفي: مُنَسِّق (اسم فاعل نَسَّقَ = to coordinate/arrange، وزن مُفَعِّل) + دَاخِلِيّ. الجذر (نسق) يدل على التتابع والانتظام؛ تنسيق الفضاء الداخلي يعني إيجاد التوازن الجمالي بين عناصره."
    - lemma: "مُجَمِّلُ الفَضَاء"
      generation_method: tarkib
      justification: "مركب إضافي: مُجَمِّل (اسم فاعل جَمَّلَ = to beautify، وزن مُفَعِّل) + الفَضَاء (space). يصف من يتخصص في تجميل الفضاء الداخلي، مستندًا إلى الجذر العربي (جمل) الدال على الحسن والبهاء."


# ── المرحلة ٢: جمع الأدلة ──────────────────────────────────────
# الاستعلامات المُنفَّذة:
#   Q1: مطابقة دفعية لجميع اللمّات (مزخرف داخلي، مهندس ديكور، مؤثث، مصمم داخلي، منسق داخلي + ال-)
#   Q2: جسر إنجليزي (interior decorator / interior designer / decorator)
#   Q3: بحث FTS بمفاتيح ديكور / تزيين / الداخلي / مزخرف / أثث
#   Q4: مقاييس اللغة لابن فارس (جذور: زخرف، نسق، زين، صمم)
stage2_evidence:
  per_lemma:
    - lemma: "مزخرف داخلي"
      confirm:
        - text: "«(1) المُزَخرِف (2) المُزَخْرِف المحترِف [لداخل المنزل أو المكتب] (3) صالحٌ للزخرفة الداخلية decorator fabrics.»"
          source: "المورد الحديث (2008) [ARABTERM، entry_id=682344]"
      expands:
        - text: "«الحرفُ الْمُزَخْرَفُ: الحرفُ الأولُ الْمُحَلَّى فى المخطوطات الأوروبية المحلاَّة فى العُصُورِ الوُسْطَى»"
          source: "المعجم الكبير لمجمع اللغة العربية [entry_id=41393]"
          addition: "يُثبّت أن (مُزَخْرَف) في الأصل صفة تدل على التحلية والزينة، مما يُعزز صلاحية استخدام المصطلح في سياق الزخرفة الداخلية."
        - text: "«زخرفة: ديكور» — translation_en: décor"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) [ARABTERM، entry_id=395261]"
          addition: "يُثبت الاستخدام المصطلحي لـ(زخرفة) كمقابل عربي لكلمة ديكور الفرنسية."

    - lemma: "مهندس ديكور"
      contradicts:
        - text: "«من يُلِمُّ بعلم من العلوم الهندسية من يمارس فنّا من الفنون الهندسية»"
          source: "المعجم الوسيط لمجمع اللغة العربية [entry_id=31948]"
          conflict: "المهندس في المعجم المعياري متخصص في العلوم الهندسية والفنون الهندسية، لا في الزخرفة الداخلية."
        - text: "«(المهندس) من يلم بِعلم من الْعُلُوم الهندسية وَمن يمارس فَنًّا من الْفُنُون الهندسية»"
          source: "المعجم الوسيط لمجموعة من المؤلفين [hawramani، entry_id=884999]"
          conflict: "التعريف المعجمي يحصر المهندس في الهندسة، مما يتعارض مع استخدامه للدلالة على متخصص الديكور."
        - text: "«المهندس الذي يقدر الماء ومجاري القني حيث تحفر، وهي فارسية.»"
          source: "المحيط في اللغة للصاحب بن عباد [hawramani، entry_id=902927]"
          conflict: "يؤكد المصدر الكلاسيكي أن الهندسة مرتبطة بالقياس والبناء، لا بالزخرفة."
      expands:
        - text: "«ديكور [مفرد]: تزيين، أو فن التَّزيين.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر [hawramani، entry_id=858259]"
          addition: "ديكور مُقنَّن في المعجم الحديث بمعنى التزيين، غير أن تركيبه مع «مهندس» لا يولّد مصطلحًا معجميًا مُثبَّتًا في أي مصدر موثوق."

    - lemma: "مُؤَثِّث"
      contradicts:
        - text: "«أثَّثَ البيتَ: فرشه وجهَّزه بالأثاث، أعدَّه للسكن. أَثاث [جمع]: متاع البيت والمكتب ونحوهما من فِراش وغيره.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر [hawramani، entry_id=856394]"
          conflict: "المُؤَثِّث يدل على القائم بتجهيز البيت بالأثاث (الفراش والمتاع)، وهي مهنة تأثيث وتجهيز لا تصميم داخلي أو زخرفة جمالية."

    - lemma: "مُصَمِّمٌ دَاخِلِيٌّ"
      confirm:
        - text: "«مصمم داخلي» — translation_en: interior designer"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) [ARABTERM، entry_id=395632]"
        - text: "«مصمّم داخلي» — translation_en: interior design"
          source: "المعجم الموحد للمصطلحات المهنية والتقنية ج.2 بناء-تجارة (1999) [ARABTERM، entry_id=477496]"
        - text: "«التّصميم الداخلي؛ التخطيط الداخلي.» — translation_en: interior design"
          source: "المورد الحديث (2008) [ARABTERM، entry_id=695699]"

    - lemma: "مُنَسِّقٌ دَاخِلِيٌّ"
      confirm:
        - text: "«مُنسِّق داخلي: كزخرفة داخل المنازل ونحوها» — translation_en: interior decorator"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999) [ARABTERM، entry_id=395630]"

    - lemma: "مُجَمِّلُ الفَضَاء"
      evidence_status: "no_material_found"


# ── المرحلة ٣: التحليل اللغوي للمّات ──────────────────────────
stage3_analysis:
  per_lemma:
    - lemma: "مزخرف داخلي"
      decision: confirmed
      decision_reason: "اللمّة موثّقة في المورد الحديث (ARABTERM) بترجمة «decorator» مع تنصيص صريح على استخدامه لزخرفة داخل المنزل أو المكتب. الجذر (زخرف) عربي أصيل وردت دلالته في مقاييس اللغة بمعنى الزينة. يحتاج إلى تشكيل كامل: مُزَخْرِفٌ دَاخِلِيٌّ. اجتاز اختبار التعبير المركب: «مُزَخْرِف دَاخِلِيّ» وحدة معجمية ثابتة لا تقبل الاستبدال الحر لمكوناتها."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُبرز الجانب الزخرفي التجميلي، مستندًا إلى جذر (زخرف) الدال على الزينة والبهجة البصرية. يُستخدم حين يُراد التشديد على الطابع الفني الزخرفي للمهنة — تزيين الفضاء بالألوان والنقوش والمواد الجمالية."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مُزَخْرِفٌ دَاخِلِيٌّ"

    - lemma: "مهندس ديكور"
      decision: removed
      decision_reason: "تركيب هجين يجمع «مهندس» (مصطلح تقني يدل على متخصص العلوم الهندسية في جميع المعاجم العربية المعيارية) بـ«ديكور» (كلمة فرنسية الأصل لم تتشكّل اشتقاقيًا في العربية). لا يوجد في أي مصدر ARABTERM أو كلاسيكي مدخل «مهندس ديكور» بمعنى «interior decorator»؛ بل تُقدَّم «مُنَسِّق دَاخِلِيّ» و«مُصَمِّم دَاخِلِيّ» كمقابلَيْن معياريَّيْن. يُعرّض الاشتراكُ الدلالي مع «المهندس الهندسي» المستخدمَ للخلط. فشل اختبار الاقتراض: الجزء الثاني (ديكور) لم يقبل لام التعريف بصورة اشتقاقية طبيعية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مُؤَثِّث"
      source: stage1
      decision: removed
      decision_reason: "المُؤَثِّث في المعجم من يجهّز البيت بالأثاث (الفراش والمتاع)، وهي مهنة تأثيث لا تصميم داخلي. الدلالة أضيق من المفهوم المطلوب ولا تشمل التصميم الجمالي والتنسيق البصري للفضاء. يناقض الأدلةُ استخدامَه للمفهوم المستهدف."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: false

    - lemma: "مُصَمِّمٌ دَاخِلِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق في مصدرَيْن مستقلَّيْن من ARABTERM بترجمة «interior designer». المصطلح سليم صرفيًا: مُصَمِّم اسم فاعل صَمَّمَ (وزن مُفَعِّل)، ودَاخِلِيّ نسبة معيارية. اجتاز اختبار التثبيت المعجمي: وحدة ثابتة في معجمَيْ مصطلحات متخصصَيْن. يتميز عن «مُنَسِّق دَاخِلِيّ» بالتركيز على جانب التخطيط والتصميم."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُركز على جانب التصميم والتخطيط (design)، مستعملًا جذر (صمم) الدال على التثبيت والإحكام. يُستخدم حين يُراد إبراز الكفاءة التقنية في رسم المخططات وتحديد المواد وتوزيع الفضاء."
      actions:
        - command: create_entry
          params: {lemma: "مُصَمِّمٌ دَاخِلِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُنَسِّقٌ دَاخِلِيٌّ"
      source: stage1
      decision: confirmed
      decision_reason: "موثّق في ARABTERM بترجمة «interior decorator» بالتحديد (لا «designer») مع تعريف «كزخرفة داخل المنازل ونحوها» — وهو الأقرب تحديدًا للمفهوم المستهدف في هذه المجموعة. الجذر (نسق) يدل على الانتظام والتتابع والتنسيق الجمالي، وهي خصائص جوهرية في مهنة المزخرف الداخلي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يُبرز الجانب التنسيقي والانسجامي، مستندًا إلى جذر (نسق) الدال على الترتيب المتناسق وانتظام العناصر. يُستخدم حين يُراد التشديد على إيجاد التوازن الجمالي بين عناصر الفضاء الداخلي دون الانحياز إلى جانب الزخرفة أو التصميم التقني."
      actions:
        - command: create_entry
          params: {lemma: "مُنَسِّقٌ دَاخِلِيٌّ", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُجَمِّلُ الفَضَاء"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على أي توثيق معجمي أو مصطلحي. يفشل اختبار التثبيت المعجمي: التعبير وصفي حر قابل للتبديل («مُزَيِّن الفضاء»، «مُجَمِّل المكان» تُنتج وصفًا مقبولًا) — وهذا يعني أنه ليس مصطلحًا مسكوكًا. فشل أيضًا اختبار السكّ."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi


# ── المرحلة ٤: التعريف والأمثلة ────────────────────────────────
# اللمّات المؤكدة: مُزَخْرِفٌ دَاخِلِيٌّ | مُنَسِّقٌ دَاخِلِيٌّ | مُصَمِّمٌ دَاخِلِيٌّ
