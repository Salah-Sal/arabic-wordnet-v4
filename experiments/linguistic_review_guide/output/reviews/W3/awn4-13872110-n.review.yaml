# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-13872110-n (millionth)
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "اللمّة «المتمم للمليون» تعني في الرياضيات المُتمِّم (complement)، وليس الترتيب الألفيّ-ألفيّ (الترتيبيّ). هذا خلط بين مفهوم المُتمِّم الحسابي ومفهوم العدد الترتيبي."
      - "اللمّة «المليون» مشتركة لفظيًّا مع العدد الأصلي (ألف ألف)، وقد يُلبِس استعمالها في دلالة ترتيبية دون قرينة."
      - "المفهوم (المركز المليون في سلسلة) يُعبَّر عنه في العربية بالعدد الأصلي مستعملاً استعمال الترتيبي، لا بمصطلح مستقل."
    observations: "المجموعة تمثّل العدد الترتيبيّ لـ 1,000,000. في النحو العربي، الأعداد الكبيرة (فوق العشرة) لا تملك صيغة ترتيبية خاصّة، بل يُستعمل العدد الأصلي نفسه بنيّة الترتيب مع قرائن سياقية (كقولك: الصفحة المليون، البند المليون). المورد الحديث يُورِد «المليون [من حيث الترتيب]» ترجمةً لـ millionth."

  blind_candidates:
    - lemma: "المِلْيُونِيّ"
      generation_method: ishtiqaq
      justification: "نسبة إلى مليون على وزن فِعْليُونِيّ، لكنّها تدلّ في الغالب على ما يتعلّق بالمليون (مليونيّ) لا على الترتيب."
    - lemma: "الجُزْءُ المِلْيُونُ"
      generation_method: tarkib
      justification: "مركب وصفيّ يدلّ على الجزء ذي الرتبة المليون في سلسلة. مُثبت في المورد الحديث: «الجزء المليون من سلسلة»."
    - lemma: "المُتَمِّمُ لِلْمِلْيُونِ"
      generation_method: tarkib
      justification: "مركب إضافي-جرّيّ يعني حرفيًّا ما يُكمِل المليون. قد يُفهم بمعنى الترتيب الأخير في سلسلة من مليون، لكنه أقرب إلى مفهوم المتمِّم الحسابي."
    - lemma: "المِلْيُون"
      generation_method: taarib
      justification: "العدد الأصلي المعرَّب عن الإيطالية (milione) يُستخدم ترتيبيًّا في العربية المعاصرة: «الزائر المليون». هذا الاستعمال قياسيّ في النحو العربي للأعداد الكبيرة."


stage2_evidence:
  per_lemma:
    - lemma: "المُتَمِّمُ لِلْمِلْيُونِ"
      contradicts:
        - text: "«المتَمِّمُ: يُقَال للركن الثَّالِث فِي بَحر الرمل، يكون بِلَا نُقْصَان كَمَا هُوَ فِي الأَصْل.»"
          source: "معجم مقاليد العلوم للسيوطي"
          conflict: "المتمّم في العروض يعني الركن التام، لا الترتيب العددي."
        - text: "«(عند العروضيِّين): كل ما زِدتَ عليه بعد اعتدال البَيْتِ, وكان من الجُزْءِ الذى زِدْتَه عليه»"
          source: "المعجم الكبير"
          conflict: "المتمّم مصطلح عروضي ورياضي (complement)، لا علاقة له بالعدد الترتيبي."
      expands:
        - text: "«المتمّم: Complement — عددٌ يمكِن بالتقريب تخيلُه بأنه الصورة المرآوِيّة لعدد آخر كُتب بنفس الأساس»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          addition: "المتمّم في الحوسبة يعني complement وليس ordinal."

    - lemma: "المِلْيُون"
      confirm:
        - text: "«(1) المليون [من حيث الترتيب] (4) الجزء المليون من سلسلة»"
          source: "المورد الحديث (2008)"
        - text: "«(المليون) (فِي الْعدَد) ألف ألف (ج) ملايين (د)»"
          source: "المعجم الوسيط"
      expands:
        - text: "«مَلْيون/ مِلْيُون [مفرد]: ج ملايينُ: ألف ألف. في العاصمة مليون نسمة»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
          addition: "الاستعمال الأصلي للعدد الأصلي مع إمكان استعماله ترتيبيًّا بالسياق."
        - text: "«مليون (رومانية): في محيط المحيط (المليون عند الإفرنج ألف ألف)»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
          addition: "يؤكّد أنّ الكلمة مقترضة من اللغات الرومانية."

    - lemma: "المِلْيُونِيّ"
      evidence_status: "no_material_found"

    - lemma: "الجُزْءُ المِلْيُونُ"
      confirm:
        - text: "«(4) الجزء المليون من سلسلة»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«الجُزْءُ: البَعْضُ، ويُفْتَحُ، ج: أجْزاءٌ»"
          source: "القاموس المحيط للفيروزآبادي"
          addition: "الجزء بمعنى البعض من الكل، يدعم استعمال التركيب للدلالة على موقع في سلسلة."


stage3_analysis:
  per_lemma:
    - lemma: "المُتَمِّمُ لِلْمِلْيُونِ"
      decision: removed
      decision_reason: "لفظ «المتمّم» يدلّ على المُتمِّم الحسابي (complement) لا على العدد الترتيبي (ordinal). جميع الشواهد المعجمية تؤكّد هذا المعنى الرياضي أو العروضي. لا مسوّغ لغوي لاستخدامه بمعنى الترتيب المليونيّ."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "المِلْيُون"
      decision: confirmed
      decision_reason: "المورد الحديث يُثبت «المليون [من حيث الترتيب]» ترجمةً لـ millionth. في النحو العربي القياسي، الأعداد فوق العشرة تُستخدم أصليّةً بنيّة ترتيبية مع قرينة سياقية. هذا الاستعمال شائع ومعروف."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "يُستعمل استعمال العدد الأصلي بنيّة ترتيبية، وهو الصيغة المعيارية في العربية المعاصرة للتعبير عن الترتيب بالأعداد الكبيرة."
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "المِلْيُون"

    - lemma: "المِلْيُونِيّ"
      source: stage1
      decision: removed
      decision_reason: "لا أدلة معجمية على استعمال «المليونيّ» بمعنى ترتيبي. النسبة إلى مليون تدلّ عادةً على ما يتعلّق بالملايين (كـ«مشروع مليونيّ») لا على الترتيب."
      evidence_assessment:
        case: no_material

    - lemma: "الجُزْءُ المِلْيُونُ"
      source: stage1
      decision: removed
      decision_reason: "رغم وروده في المورد الحديث، فإنّ «الجزء المليون» يدلّ على الكسر (1/1,000,000) لا على المركز الترتيبي في سلسلة. المجموعة الترادفية تخصّ الترتيب (position) لا الكسر (fraction). وهو عبارة وصفية لا مصطلح ثابت."
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "المُتَمِّمُ لِلْمِلْيُونِ"
      source: stage1
      decision: removed
      decision_reason: "تكرار للمّة الموجودة التي رُفضت. المتمّم مصطلح رياضي (complement) لا ترتيبي."
      evidence_assessment:
        case: contradicts_only

    - lemma: "المِلْيُون"
      source: stage1
      decision: confirmed
      decision_reason: "تكرار للمّة الموجودة المؤكَّدة. المورد الحديث يُثبت هذا الاستعمال الترتيبي صراحةً."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false


stage4_content:
  definition:
    current: "المركز 1,000,000 في سلسلة معدودة من الأشياء"
    assessment:
      decision: revise
      reason: "التعريف الحالي يستخدم الأرقام اللاتينية وصياغته ترجميّة حرفيّة. ينبغي صياغته بأسلوب معجمي عربي."
    authored:
      - type: terminological
        text: "المَرْتَبَةُ التي تَلي الرقم تسعمئة وتسعة وتسعين ألفًا وتسعمئة وتسعة وتسعين في ترتيب سلسلة من الأشياء المعدودة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: linguistic
        text: "ما يَقع في الموضع الذي رقمه مليون من تسلسل معدود."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
