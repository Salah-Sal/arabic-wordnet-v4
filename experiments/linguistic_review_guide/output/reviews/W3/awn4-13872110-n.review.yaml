        examples:
          - text: "استقبلت المكتبة الوطنية الزائرَ المليونَ هذا العام وسط احتفال رسمي."
            type: usage
    actions:
      - command: add_synset_example
        params:
          synset_id: "{synset_id}"
          text: "استقبلت المكتبة الوطنية الزائرَ المليونَ هذا العام وسط احتفال رسمي."


