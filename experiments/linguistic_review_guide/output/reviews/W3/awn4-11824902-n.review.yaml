stage1_review:
  assessment:
    concerns:
      - "التعريف الحالي هو وصف ميتا-معجمي (meta-definition) أكثر من كونه تعريفاً علمياً للمجموعة."
      - "اللمتان الحاليتان تستخدمان الإفراد 'مركزية' بينما المجموعات التصنيفية الكبرى (التي تقابل -ae باللاتينية) تُترجم غالباً بجمع المؤنث السالم 'مركزيات'."
      - "عبارة 'مجموعة مركزية البذور' هي تعبير وصفي حر وليست مصطلحاً مسكوكاً."
    observations: "مصطلح Centrospermae هو اسم تصنيفي قديم، يُترجم حرفياً إلى 'مركزيّات البذور' أو 'المركزيات البذور' إشارة إلى طريقة تموضع البذور في المبيض. الرتبة البديلة الحديثة هي Caryophyllales (القرنفليات)."
  blind_candidates:
    - lemma: "مَرْكَزِيَّاتُ البُذُورِ"
      generation_method: tarkib
      justification: "تركيب إضافي يعكس الصيغة الجمعية اللاتينية (-ae) المعتادة في الرتب والمجموعات التصنيفية النباتية."
    - lemma: "الرُّتْبَةُ المَرْكَزِيَّةُ البُذُورِ"
      generation_method: tarkib
      justification: "تركيب وصفي يوضح الرتبة التصنيفية."
    - lemma: "مَجْمُوعَةُ مَرْكَزِيَّاتِ البُذُورِ"
      generation_method: tarkib
      justification: "إضافة كلمة مجموعة للدلالة على المرتبة التصنيفية."
    - lemma: "مَرْكَزِيَّةُ البُذُورِ"
      generation_method: tarkib
      justification: "استخدام الإفراد كصفة للمجموعة أو الطائفة النباتية."

stage2_evidence:
  per_lemma:
    - lemma: "مَرْكَزَاتُ البُذُورِ"
      expands:
        - text: "translation_en: Centrospermae, domain: AGROVOC"
          source: "المَكنَز الزراعي متعدد اللغات (AGROVOC)"
          addition: "يؤكد وجود ترجمة قريبة للمفهوم ضمن المعاجم الزراعية، وإن استخدمت المعاجم صيغة 'مركزات' بدلاً من 'مركزيات'."
    - lemma: "مجموعة مركزية البذور"
      evidence_status: "no_material_found"
    - lemma: "مركزية البذور"
      evidence_status: "no_material_found"
    - lemma: "مَرْكَزِيَّاتُ البُذُورِ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "مجموعة مركزية البذور"
      decision: removed
      decision_reason: "تعبير وصفي حر غير مسكوك (free phrase)، ووجود كلمة 'مجموعة' فيه تزيد من طابعه الوصفي على حساب الاصطلاحية، بخلاف المصطلحات التصنيفية المباشرة."
      evidence_assessment:
        case: no_material
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
            
    - lemma: "مركزية البذور"
      decision: confirmed
      decision_reason: "مصطلح مقبول لتوضيح السمة الأساسية للمجموعة النباتية، وهو مستخدم في الأدبيات العربية ولو بصيغة المفرد للإشارة إلى 'المجموعة' ككل."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَرْكَزِيَّةُ البُذُورِ"
            
    - lemma: "مَرْكَزِيَّاتُ البُذُورِ"
      source: stage1
      decision: confirmed
      decision_reason: "الصيغة الاصطلاحية القياسية للمجموعات النباتية الموازية للرتب (والتي تنتهي بـ -ae في اللاتينية) هي جمع المؤنث السالم، لذا فهذا المصطلح أكثر دقة في السياق التصنيفي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "مَرْكَزِيَّاتُ البُذُورِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مَرْكَزَاتُ البُذُورِ"
      source: stage1
      decision: confirmed
      decision_reason: "وثقها معجم AGROVOC الزراعي كمقابل مباشر لـ Centrospermae."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: create_entry
          params:
            lemma: "مَرْكَزَاتُ البُذُورِ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

