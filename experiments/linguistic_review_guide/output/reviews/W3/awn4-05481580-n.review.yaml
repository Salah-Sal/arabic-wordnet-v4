# مراجعة المجموعة الترادفية: awn4-05481580-n (synapse)
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────
stage1_review:
  assessment:
    concerns:
      - "اللمّة «تشابك عصبي» مركب وصفي غير مسجّل كوحدة معجمية في المعاجم المتاحة، و«تشابك» وحده يُترجم synapsis (اقتران الصبغيات) لا synapse"
      - "اللمّة «مشبك» تفتقر إلى التشكيل الكامل"
      - "التعريف العربي الحالي جيد لكنه يحتوي على مصطلح «تفرع شجري» وهو ترجمة حرفية لـ dendrite، والمصطلح الطبي المعتمد هو «تَغَصُّن»"
    observations: >
      المجموعة تصف المَشْبَك العصبي (synapse)، وهو بنية تشريحية دقيقة يتمّ عبرها نقل السيالة العصبية
      من عصبون إلى آخر أو من عصبون إلى ليف عضلي. المصطلح الطبي الموحد المعتمد من أليكسو هو «مَشْبَك»
      على وزن مَفْعَل من الجذر ش-ب-ك، وهو اشتقاق سليم يدل على موضع التشابك. أما «تشابك عصبي» فهو شائع
      في الاستعمال العلمي العربي المعاصر لكنه لم يُسجَّل كمدخل مركّب في المعاجم الموحدة.
  blind_candidates:
    - lemma: "مَشْبَك"
      generation_method: ishtiqaq
      justification: "من الجذر ش-ب-ك على وزن مَفْعَل (اسم مكان)، يدل على موضع التشابك والاتصال بين العصبونات، وهو وزن منتج لأسماء المكان في العربية"
    - lemma: "وُصْلَة عَصَبِيَّة"
      generation_method: tarkib
      justification: "مركب وصفي من وُصْلَة (من و-ص-ل، موضع الاتصال) مع الوصف عصبية، يطابق التعريف الذي يصف الوصلة بين عصبونين"
    - lemma: "مُلْتَقًى عَصَبِيّ"
      generation_method: tarkib
      justification: "مركب وصفي من مُلْتَقًى (اسم مكان من التقى) مع الوصف عصبي، يدل على نقطة التقاء العصبونات"
    - lemma: "مَمَسّ"
      generation_method: ishtiqaq
      justification: "من الجذر م-س-س على وزن مَفْعَل (اسم مكان)، يدل على موضع التماسّ والتلامس بين العصبونات"


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────
stage2_evidence:
  per_lemma:
    - lemma: "تشابك عصبي"
      expands:
        - text: "«(تشابك) الشَّيْء شَبكَ يُقَال تشابكت الْأُمُور اخْتَلَط بَعْضهَا بِبَعْض»"
          source: "المعجم الوسيط (هورماني)"
          addition: "تشابك كمصدر يدل على التداخل والاختلاط، لا على البنية التشريحية تحديداً"
      contradicts:
        - text: "«تَشابُك — synapsis (pairing) — تشابك الصبغيات المتماثلة أثناء الانقسام الاختزاليّ»"
          source: "المعجم الموحد لمصطلحات علم الوراثة (2009)"
          conflict: "تشابك وحده مصطلح لـ synapsis (اقتران الصبغيات)، وليس synapse (المشبك العصبي)، فاستعماله للمشبك يوقع في اللبس"

    - lemma: "مشبك"
      confirm:
        - text: "«مَشْبَك — synapse — بنية نسيجية يتمفصل عن طريقها محور عصبون ما مع تغصنات عصبون آخر.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مَشْبَك — synapse — نقطة الاشتباك العصبيّ.»"
          source: "المعجم الموحد لمصطلحات الطب البيطري (2010)"
        - text: "«مشبك — synapse — نقطة اتصال بين خلايا عصبية، وعادة ما يوجد بين نهاية محور عصبون والتشعبات أو جسم خلية عصبية أخرى عن طريق الناقلات العصبية. يستخدم أحيانا للتواصل بين خلية عصبية وأخرى عضلية.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة (أليكسو)"
        - text: "«مَشْبَك [ج:مَشابِك] — synapse»"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«مشبك(ال..)، وصلة عصبية — synapse»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
      expands:
        - text: "«(المشبك) أَدَاة من خشب أَو مَعْدن يشبك بهَا الشَّيْء ويمسك وَهِي أَنْوَاع (مج) وَحلية من الذَّهَب أَو الماس تشبك فِي الصَّدْر أَو الرَّأْس للزِّينَة (ج) مشابك (محدثة)»"
          source: "المعجم الوسيط (هورماني)"
          addition: "المشبك في الاستعمال العام أداة تثبيت، والمعنى العصبي امتداد مجازي مبني على فكرة الربط"

    - lemma: "مَشْبَك"
      confirm:
        - text: "«مَشْبَك — synapse — بنية نسيجية يتمفصل عن طريقها محور عصبون ما مع تغصنات عصبون آخر.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مَشْبَك [ج:مَشابِك] — synapse»"
          source: "المعجم الطبي الموحد (2009)"

    - lemma: "وُصْلَة عَصَبِيَّة"
      confirm:
        - text: "«مشبك(ال..)، وصلة عصبية — synapse»"
          source: "المعجم الموحد لمصطلحات علم الصحة وجسم الانسان (1992)"
        - text: "«المَمَسّ: وُصلة لانتقال الدَّفعة العصبية (فس). — synapse»"
          source: "المورد الحديث (2008)"

    - lemma: "مُلْتَقًى عَصَبِيّ"
      expands:
        - text: "«مُلْتقى — commissure — موضع اتصال بين أجزاء تشريحية متناظرة، وبخاصة إذا عبرت هذه الوصلات الخط المتوسط للجسم.»"
          source: "معجم المصطلحات الطبية (ج.1، 1985)"
          addition: "المُلتقى مصطلح طبي لـ commissure وليس لـ synapse، فهو مشغول بدلالة تشريحية أخرى"

    - lemma: "مَمَسّ"
      confirm:
        - text: "«المَمَسّ: وُصلة لانتقال الدَّفعة العصبية (فس). — synapse»"
          source: "المورد الحديث (2008)"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────
stage3_analysis:
  per_lemma:
    # ── اللمّات الموجودة ──
    - lemma: "تَشَابُك عَصَبِيّ"
      decision: confirmed
      decision_reason: >
        رغم أن «تشابك» وحده يُستعمل لـ synapsis (اقتران الصبغيات) في علم الوراثة، فإن المركب «تشابك عصبي»
        شائع في الكتابة العلمية العربية المعاصرة للدلالة على synapse، والتقييد بالوصف «عصبي» يرفع اللبس.
        يُبقى مع التنبيه على أن «مَشْبَك» هو المصطلح الأدق والمعتمد من المعاجم الموحدة.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "مركب وصفي شائع في الاستعمال التعليمي والإعلامي، يصف العملية والبنية معاً"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "تَشَابُك عَصَبِيّ"

    - lemma: "مَشْبَك"
      decision: confirmed
      decision_reason: >
        مصطلح طبي موحد معتمد من أليكسو والمعجم الطبي الموحد، مشتق من ش-ب-ك على وزن مَفْعَل
        (اسم مكان)، مع جمع مَشَابِك. أثبتته خمسة معاجم متخصصة بدلالة synapse تحديداً.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: "مصطلح اشتقاقي موحد دقيق، يدل على البنية التشريحية تحديداً دون لبس"
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "مَشْبَك"

    # ── مرشحات المرحلة ١ ──
    - lemma: "وُصْلَة عَصَبِيَّة"
      source: stage1
      decision: confirmed
      decision_reason: >
        مركب وصفي مسجّل في المعجم الموحد لمصطلحات علم الصحة وجسم الإنسان (1992) كمرادف لـ مشبك/synapse.
        كما ورد في المورد الحديث (2008) ضمن تعريف المَمَسّ. تعبير اصطلاحي ثابت يناسب السياقات التشريحية العامة.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      nuance_differentiation: "يركّز على وظيفة الاتصال والوصل بين العصبونات، أقرب إلى الوصف التشريحي العام"
      actions:
        - command: create_entry
          params: {lemma: "وُصْلَة عَصَبِيَّة", pos: n}
        - command: add_sense
          params: {entry_id: "{auto}", synset_id: "{synset_id}"}

    - lemma: "مُلْتَقًى عَصَبِيّ"
      source: stage1
      decision: removed
      decision_reason: >
        مُلْتَقًى مصطلح طبي مشغول بدلالة commissure (موضع التقاء أجزاء تشريحية متناظرة عبر الخط المتوسط)،
        فاستعماله لـ synapse يوقع في لبس مصطلحي. لا يوجد أي شاهد معجمي يربطه بالمشبك العصبي.

    - lemma: "مَمَسّ"
      source: stage1
      decision: removed
      decision_reason: >
        ورد في المورد الحديث (2008) فقط، وهو معجم ثنائي (إنجليزي-عربي) وليس معجماً موحداً.
        لم تتبنَّه المعاجم الموحدة الصادرة عن أليكسو أو المعجم الطبي الموحد. المصطلح غير شائع
        ولا يحقق معيار إيثار المصطلح المتداول، فيُستغنى عنه لصالح «مَشْبَك».


