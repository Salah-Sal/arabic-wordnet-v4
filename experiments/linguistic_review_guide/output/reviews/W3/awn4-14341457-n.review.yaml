# ═══════════════════════════════════════════════════════════════
# مراجعة المجموعة الترادفية — awn4-14341457-n
# lymphogranuloma — وَرَمٌ حُبَيْبِيٌّ لِمْفِيٌّ
# ═══════════════════════════════════════════════════════════════

stage1_review:
  assessment:
    concerns:
      - "المجموعة تحتوي على لمّة واحدة فقط (ورم حبيبي لمفي)، وهو مصطلح طبي مركب يحتاج تأكيد تشكيله"
      - "التعريف العربي (تورم العقدة الليمفاوية) مبسّط جداً ولا يميّز المفهوم عن التهاب العقد اللمفية"
      - "المفهوم طبي تخصصي: الورم الحبيبي اللمفي يختلف عن مجرد تورّم العقدة اللمفاوية، إذ يتضمن تكوّن نسيج حبيبي"
    observations: "المفهوم يدل على حالة مرضية يتشكّل فيها ورم حبيبي (granuloma) في العقد اللمفية، وليس مجرد انتفاخ بسيط. هذا مصطلح طبي مركب من ثلاث كلمات، والتعريف الحالي لا يعكس الطبيعة الحبيبية (الورمية الالتهابية) للحالة. يندرج تحت فصيلة الانتفاخ/التضخم في التصنيف العلوي."
  blind_candidates:
    - lemma: "وَرَمٌ حُبَيْبِيٌّ لِمْفَاوِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي من «ورم حبيبي» (granuloma) + «لمفاوي» (lymphatic) على نمط المصطلحات الطبية العربية المركبة"
    - lemma: "حُبَيْبُومٌ لِمْفِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يستخدم «حبيبوم» وهو مصطلح طبي مسكوك يقابل granuloma مع صفة لمفي"
    - lemma: "لِمْفُوغْرَانُولُومَا"
      generation_method: taarib
      justification: "تعريب مباشر للمصطلح الطبي اللاتيني lymphogranuloma، يُلجأ إليه عند الحاجة للدقة العلمية"
    - lemma: "تَوَرُّمٌ حُبَيْبِيٌّ لِمْفِيٌّ"
      generation_method: tarkib
      justification: "تركيب وصفي يستخدم المصدر «تورّم» بدل الاسم «ورم» للتأكيد على الحالة المرضية العَرَضية"

stage2_evidence:
  per_lemma:
    - lemma: "وَرَمٌ حُبَيْبِيٌّ لِمْفِيٌّ"
      confirm:
        - text: "«وَرَمٌ حُبَيبِيٌّ لِمْفِيّ» = lymphogranuloma"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«وَرَمٌ حُبَيبِيٌّ لِمْفِيٌّ حَميد» = lymphogranuloma benignum"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«وَرَمٌ حُبَيبِيٌّ لِمْفِيٌّ أُرْبِيّ» = lymphogranuloma inguinale"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«وَرَمٌ حُبَيبِيٌّ لِمْفِيٌّ خَبيث (دَاءُ هودجكين)» = lymphogranuloma malignum (Hodgkin's disease)"
          source: "المعجم الطبي الموحد (2009)"
        - text: "«وَرَمٌ حُبَيبِيٌّ لِمْفِيٌّ مَنْقُوْلٌ جِنْسِيَّاً» = lymphogranuloma venereum"
          source: "المعجم الطبي الموحد (2009)"
      expands:
        - text: "«كتلة أو عقدة من النسيج الحبيبي تشبه الورم وتتكون من خلايا ليفية وبراعم شعيرية وتحتوي على خلايا بشرانية (epithelioid cells) محاطة بخلايا أحادية النواة، وتنشأ من التهاب مزمن ناتج عن مرض معد كالدرن، والزهري والجزام ...الخ.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "تعريف مفصل للورم الحبيبي (granuloma) عموماً يوضح طبيعة النسيج الحبيبي"

    - lemma: "وَرَمٌ حُبَيْبِيٌّ لِمْفَاوِيٌّ"
      contradicts:
        - text: "«وَرَمٌ لِمْفاوِيّ» = lymphocytoma (وليس lymphogranuloma)"
          source: "المعجم الطبي الموحد (2009)"
          conflict: "المعجم الطبي الموحد يستخدم «لِمْفِيّ» وليس «لِمْفَاوِيّ» في مصطلح lymphogranuloma؛ كما أن «ورم لمفاوي» يقابل lymphocytoma وهو مفهوم مختلف"

    - lemma: "حُبَيْبُومٌ لِمْفِيٌّ"
      expands:
        - text: "«حُبَيْبُوم»: كتلة أو عقدة ورمية الشكل تتكون، في سياق سير الأمراض الالتهابية، من نسيج حبيبيّ يحتوي على أرومات الليف التي تنمو بشكل فاعل مع أوعية شعرية وخلايا شبيهة بخلايا النسيج الظهاريّ، تحيط بمركز من الخلايا عديدة النوى واللمفيات."
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "«حبيبوم» مصطلح مسكوك يقابل granuloma لكن لم يُعثر على تركيب «حبيبوم لمفي» كوحدة معجمية ثابتة"

    - lemma: "لِمْفُوغْرَانُولُومَا"
      evidence_status: "no_material_found"

    - lemma: "تَوَرُّمٌ حُبَيْبِيٌّ لِمْفِيٌّ"
      evidence_status: "no_material_found"

stage3_analysis:
  per_lemma:
    - lemma: "وَرَمٌ حُبَيْبِيٌّ لِمْفِيٌّ"
      decision: confirmed
      decision_reason: "مصطلح طبي مسكوك ثابت في المعجم الطبي الموحد (2009) بخمسة مداخل فرعية على الأقل (حميد، أُرْبِيّ، خبيث، مَنْقُول جنسياً، إلخ). يقابل lymphogranuloma تماماً ويتسق مع النمط التسموي الطبي العربي الرسمي."
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "وَرَمٌ حُبَيْبِيٌّ لِمْفِيٌّ"

    - lemma: "وَرَمٌ حُبَيْبِيٌّ لِمْفَاوِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "المعجم الطبي الموحد يستخدم «لِمْفِيّ» وليس «لِمْفَاوِيّ» في هذا المصطلح. كما أن «ورم لمفاوي» مخصص لمفهوم مختلف (lymphocytoma). التفريق بين «لمفي» و«لمفاوي» مقصود في المصطلحية الطبية العربية."
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "حُبَيْبُومٌ لِمْفِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "«حبيبوم» مصطلح مسكوك يقابل granuloma في معجم الصيدلة، لكن التركيب «حبيبوم لمفي» لم يُعثر عليه كوحدة معجمية ثابتة في أيّ معجم. كما أن المعجم الطبي الموحد — وهو المرجع المعياري — يستخدم «ورم حبيبي لمفي» وليس «حبيبوم لمفي»."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

    - lemma: "لِمْفُوغْرَانُولُومَا"
      source: stage1
      decision: removed
      decision_reason: "تعريب مباشر لا يرد في أيّ معجم طبي عربي معتمد. المصطلحية الطبية العربية الرسمية (المعجم الطبي الموحد) اختارت الترجمة التركيبية «ورم حبيبي لمفي» وتجنبت التعريب الحرفي، وهذا يتسق مع مبدأ إيثار العربي."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "تَوَرُّمٌ حُبَيْبِيٌّ لِمْفِيٌّ"
      source: stage1
      decision: removed
      decision_reason: "لم يُعثر على هذا التركيب في أيّ معجم. كما أن «تورّم» (مصدر) يدل على الحدث/الحالة العرضية، بينما lymphogranuloma كيان مرضي يُسمّى «ورم» وليس «تورّماً». المصطلح المعياري يستخدم «ورم» لا «تورّم»."
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: wasfi

stage4_content:
  definition:
    current: "تورم العقدة الليمفاوية"
    assessment:
      decision: revise
      reason: "التعريف الحالي مبسّط جداً: يصف مجرد «تورم العقدة الليمفاوية» وهو أقرب لتعريف lymphadenitis أو lymphadenopathy. الورم الحبيبي اللمفي (lymphogranuloma) حالة نوعية يتشكل فيها نسيج حبيبي التهابي في العقد اللمفية، وهذا الفارق الجوهري غائب."
    authored:
      - type: terminological
        text: "وَرَمٌ حُبَيْبِيٌّ يتشكّل في العُقَد اللمفية، ينشأ من التهاب مزمن يؤدي إلى تكوّن نسيج حبيبي يحتوي على خلايا بشرانية وخلايا أحادية النواة."
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
      - type: encyclopedic
        text: "داءٌ يصيب العقد اللمفية فيُحدث فيها أوراماً حبيبية مزمنة تتكون من تجمعات خلوية ظهارانية محاطة بلمفيات، وقد ينتج عن عدوى جرثومية أو فيروسية، ومن أشهر أنواعه الورم الحبيبي اللمفي المنقول جنسياً (داء نيكولا-فافر)."
