# مراجعة المجموعة الترادفية — AWN4 Review Pipeline v2 (5-Stage)
# synset_id: awn4-10007930-n
# ili: i89373
# pos: n
# definition_en: the owner or manager of a dairy
# ═══════════════════════════════════════════════════════════════

# ── المرحلة ١: المراجعة والتوليد ──────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة «بائع الحليب» تحمل دلالة بائع التجزئة لا مالك المزرعة أو مديرها — خطأ دلالي صريح يستوجب الحذف"
      - "لمّتا «مزارع الألبان» و«منتج الألبان» تعبيران وصفيان حران لا يجتازان اختبار التثبيت المعجمي ولا وجود لهما في المعاجم المعيارية بوصفهما وحدتين مسكوكتين"
      - "غياب المصطلح التراثي الأصيل «لَبَّان» والمصطلح الاصطلاحي الحديث «لِبانيّ» عن قائمة اللمّات رغم توثيقهما في المعاجم المعيارية والتخصصية"
      - "اللمّات الثلاث جميعها مركبات إضافية وصفية، وهو أسلوب ترجمي حرفي لا يعكس الاصطلاح العربي الأصيل"
    observations: >-
      المجموعة تمثّل مفهوم «صاحب مزرعة الألبان أو مديرها» وهو مفهوم له تعبير عربي أصيل
      وراسخ؛ فاللغة العربية تملك على الأقل مصطلحَيْن متخصصَيْن: «اللَّبَّان» (للمشتغل
      ببيع اللبن وصناعته) و«اللِّبانيّ» (لصاحب المزرعة اللبانية تحديداً). وكلا المصطلحَيْن
      مبنيان على الجذر (ل ب ن) بأوزان عربية صحيحة. كذلك يوفر الجذر (ح ل ب) مصطلح
      «الحَلَّاب» للمشتغل بالحلب مهنةً. المنهجية الحالية في AWN اعتمدت على ترجمة حرفية
      إنجليزية-عربية بدلاً من الاستناد إلى المعجمية العربية الأصيلة.
  blind_candidates:
    - lemma: "حَلَّاب"
      generation_method: ishtiqaq
      justification: >-
        مشتق من جذر (ح ل ب) على وزن فَعَّال الدال على الحرفة الدائمة والاحتراف؛ وهو
        الوزن المنتج لأسماء أصحاب المهن: خَبَّاز، نَجَّار، حَدَّاد. المعنى: من يزاول
        حلب الماشية واستخراج الألبان مهنةً، وهو بذلك المنتج الأساسي لمنتجات الألبان.
    - lemma: "مُحْتَلِب"
      generation_method: ishtiqaq
      justification: >-
        اسم فاعل من الفعل (احتلب) على وزن مُفْتَعِل؛ والاحتلاب هو طلب اللبن
        واستخراجه. يُعبِّر عن فاعلية الشخص في عملية الحلب وامتلاكه ناصيتها، مما
        يجعله مناسباً للمالك الذي يمارس نشاط الألبان بنفسه.
    - lemma: "مَحْلَبِيّ"
      generation_method: ishtiqaq
      justification: >-
        نسبة إلى «مَحْلَب» (مكان الحلب ومنشأة استخراج الألبان) على وزن النسبة (-يّ)
        للدلالة على الانتساب لهذه المنشأة وصاحبها. شبيه بـ: مَخبزيّ (صاحب المخبز)،
        مَدبغيّ (صاحب المدبغة).
    - lemma: "رَبُّ الْمَحْلَبَة"
      generation_method: tarkib
      justification: >-
        تركيب إضافي من «رب» (مالك ومتحكم) + «المَحْلَبَة» (منشأة الحلب وإنتاج الألبان).
        يُعبِّر بصراحة عن دلالة المَلكية والإدارة المطلوبتَيْن في التعريف («مالك أو مدير»).
        شبيه بـ: ربّ البيت، ربّ العمل.


# ── المرحلة ٢: جمع الأدلة ─────────────────────────────────────
# استعلامات منفَّذة: ٣ (دفعي + جسر إنجليزي + مقاييس اللغة)
# entry_ids الرئيسية: 6110، 78243، 469923، 25749، 854807، 681895، 985943، 988597
stage2_evidence:
  per_lemma:

    - lemma: "بائع الحليب"
      evidence_status: "no_material_found"

    - lemma: "مزارع الألبان"
      evidence_status: "no_material_found"

    - lemma: "منتج الألبان"
      evidence_status: "no_material_found"

    - lemma: "حَلَّاب"
      confirm:
        - text: "«من صناعته الحلب»"
          source: "المعجم الوسيط (entry_id: 6110)"
        - text: "«مَنْ صِناعَتُه الحَلْب. من الأيَّام: ذو النَّدى.»"
          source: "المعجم الكبير (entry_id: 78243)"
        - text: "«من يحلب البقر أو غيره»"
          source: "المعجم الموحد لمصطلحات الطب البيطري، 2010 (entry_id: 469923)"
      expands:
        - text: "«اللبّان؛ الحلّاب: بائع اللبن أو الحليب»"
          source: "المورد الحديث (2008) — ترجمة milkman (entry_id: 701272)"
          addition: "تساوٍ بين الحَلَّاب واللَّبَّان في الدلالة على المشتغل ببيع اللبن أو إنتاجه"

    - lemma: "مُحْتَلِب"
      evidence_status: "no_material_found"

    - lemma: "مَحْلَبِيّ"
      evidence_status: "no_material_found"

    - lemma: "رَبُّ الْمَحْلَبَة"
      contradicts:
        - text: "«(المحلب) شجر لَهُ حب يَجْعَل فِي الطّيب وَالْعَسَل» و«(المحلب) الْإِنَاء يحلب فِيهِ»"
          source: "المعجم الوسيط (entry_ids: 882203، 6114، 6115)"
          conflict: >-
            المَحْلَب في العربية المعيارية يدل على نوع شجر أو على الإناء المستخدم في الحلب،
            لا على منشأة ألبان أو مزرعة. وعليه فـ«رب المحلبة» مبنيٌّ على أساس معجمي خاطئ.

    # — مكتشَف في المرحلة ٢ (الجسر الإنجليزي) —
    - lemma: "لَبَّان"
      confirm:
        - text: "«بائع اللَّبَن صانع اللَّبِن المضروب من الطِّين بائعه»"
          source: "المعجم الوسيط (entry_id: 25749)"
        - text: "«اللّبّان: صاحب مَلْبنةٍ أو مستخدَمٌ فيها»"
          source: "المورد الحديث (2008) — ترجمة dairyman (entry_id: 681895)"
        - text: "«من يبيع اللَّبَن ويَعْمَلُهُ»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر، نقلاً عن تاج العروس (entry_id: 854807)"
      expands:
        - text: "«اشتريت من اللَّبَّان لترًا من اللَّبن [فصيحة] — التعليق: جاء في التاج: اللَّبَّان: من يبيع اللَّبَنَ ويَعْمَلُهُ»"
          source: "معجم الصواب اللغوي (entry_id: 854807)"
          addition: "تأكيد فصاحة المصطلح وتوثيقه في المعجمية الكلاسيكية (تاج العروس) والمعاصرة"

    # — مكتشَف في المرحلة ٢ (الجسر الإنجليزي) —
    - lemma: "لِبانِيّ"
      confirm:
        - text: "«(1) اللِّبانيّ: صاحب مزرعةٍ لِبانيّة (را. dairy farm) — (2) اللّبّان: صاحب مَلْبنةٍ أو مستخدَمٌ فيها»"
          source: "المورد الحديث (2008) — ترجمة dairyman (entry_id: 681895)"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    # ── اللمّات الموجودة ──

    - lemma: "بائع الحليب"
      decision: removed
      decision_reason: >-
        خطأ دلالي مزدوج: (١) «بائع الحليب» يدل على بائع التجزئة الذي يبيع الحليب
        للمستهلك النهائي، لا على مالك مزرعة الألبان أو مديرها؛ فالمعنيان المطلوبان
        (مالك / مدير) غائبان تماماً. (٢) لا وجود للتعبير في المعاجم بوصفه وحدة معجمية
        ثابتة؛ وشاهد المورد الحديث يُظهر أن «بائع اللبن» مجرد وصف تفسيري لمصطلحَي
        اللبّان والحلّاب لا مصطلحاً بذاته. يفشل اختبار السكّ: «بائع العسل» و«بائع التمر»
        تعبيران بالقدر ذاته.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "مزارع الألبان"
      decision: removed
      decision_reason: >-
        عبارة وصفية حرة لا تجتاز اختبار التثبيت المعجمي: إحلال «الأسماك» أو «الدواجن»
        محل «الألبان» يُنتج عبارةً وصفية صحيحة بالقدر ذاته («مزارع الأسماك»، «مزارع
        الدواجن»)، مما يثبت أنها ليست وحدة اصطلاحية خاصة بهذا المفهوم. يُضاف إلى ذلك
        اشتراك لفظي: «مزارع» جمع «مزرعة» (farm) أيضاً. لا وجود للتعبير في المعاجم
        بوصفه مدخلاً معجمياً. يُستعاض عنه بـ«لِبانيّ» المعجمي الأدق.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "منتج الألبان"
      decision: removed
      decision_reason: >-
        التعبير أعمُّ وأشمل من المطلوب: أي مصنع كبير لمنتجات الألبان «منتج ألبان» حتى
        دون أن يكون مالك مزرعة؛ وهو بذلك يعبِّر عن فئة أوسع (producers) لا عن النوع
        المحدد (dairy farmer/dairyman). لا وجود للتعبير في المعاجم كوحدة مسكوكة. يفشل
        اختبار التثبيت المعجمي بالقياس ذاته المذكور في «مزارع الألبان».
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: true
        mwe_type: idafi
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── مرشحات المرحلة ١ ──

    - lemma: "حَلَّاب"
      source: stage1
      decision: confirmed
      decision_reason: >-
        مصطلح معجمي ثابت موثَّق في المعجم الوسيط والمعجم الكبير (مصادر OCR موثوقة):
        «من صناعته الحلب». وزن فَعَّال من جذر (ح ل ب) على الوزن القياسي للحرف الدائم.
        يُعبِّر عن المشتغل باستخراج الألبان من الماشية مهنةً ودأباً، وهو الأساس الإنتاجي
        لمزرعة الألبان. الفارق عن اللبّان: التركيز على العملية الإنتاجية (الحلب) بينما
        اللبّان يركز على الجانب التجاري والصناعي (بيع اللبن وصناعته). المصطلح صحيح
        الاشتقاق، مجتاز لاختبار السكّ، غير لهجي.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبِّر عن البُعد الإنتاجي المباشر: من يزاول حلب الماشية وجمع الألبان حرفةً
        متخصصة. يختلف عن اللَّبَّان الذي يجمع الجانب التجاري (البيع والصناعة)، وعن
        اللِّبانيّ الذي يخص مالك المزرعة. حَلَّاب يمكن أن يكون صاحب المزرعة أو
        موظَّفاً فيها، مع تأكيد كونه المنتج الفعلي للحليب.
      actions:
        - command: create_entry
          params:
            lemma: "حَلَّاب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "مُحْتَلِب"
      source: stage1
      decision: removed
      decision_reason: >-
        لا شاهد معجمي على المصطلح بمعنى «مالك مزرعة الألبان أو مديرها». صيغة الافتعال
        (احتلب) غير متداولة في المعاجم بوصفها اسم فاعل دالاً على الحرفة؛ إذ المستعمل
        الفصيح هو «حالب» (اسم فاعل من الثلاثي) لا «محتلب». وزن مُفْتَعِل لا يدل على
        المَلكية أو الإدارة في العربية.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "مَحْلَبِيّ"
      source: stage1
      decision: removed
      decision_reason: >-
        لا وجود للمصطلح في المعاجم. المَحْلَب في العربية يدل على: (١) شجر بعينه (الكرز
        البري)، (٢) الإناء الذي يُحلب فيه. كلا المعنيَيْن بعيد من دلالة «صاحب منشأة
        الألبان»، مما يجعل النسبة إليه غير دالة على المفهوم المطلوب. المصطلح الصحيح
        للمنشأة الألبانية هو «مَلْبَنَة» لا «مَحْلَبَة»، وعليه فالنسبة المناسبة كانت
        ستكون «مَلْبَنِيّ» لو كانت مستعملة.
      evidence_assessment:
        case: no_material
      mwe_check:
        is_mwe: false

    - lemma: "رَبُّ الْمَحْلَبَة"
      source: stage1
      decision: removed
      decision_reason: >-
        يقوم على أساس معجمي خاطئ: «المَحْلَبَة» غير واردة في المعاجم بمعنى منشأة
        الألبان. أدلة المرحلة الثانية تؤكد أن المَحْلَب شجر أو إناء لا مُنشأة ألبانية.
        المصطلح الصحيح للمنشأة هو «المَلْبَنَة». فضلاً عن ذلك، حتى لو صُحِّح الاسم
        إلى «رب الملبنة» فإنه لا يرد في المعاجم كتعبير مسكوك.
      evidence_assessment:
        case: contradicts_only
      mwe_check:
        is_mwe: true
        mwe_type: idafi

    # ── مكتشَفات المرحلة ٢ (تُعامَل معاملة المرشحات المؤكَّدة) ──

    - lemma: "لَبَّان"
      decision: confirmed
      decision_reason: >-
        مصطلح عربي أصيل موثَّق في المعجم الوسيط («بائع اللبن وصانعه») وفي تاج العروس
        (نقلاً عن معجم الصواب). وفي المورد الحديث (2008) بمعنى «صاحب مَلبنةٍ أو
        مستخدَم فيها» — وهو المقابل المعتمد للإنجليزية dairyman. أقرّه معجم الصواب
        اللغوي «فصيحاً» بشاهد من تاج العروس. مبني على الجذر (ل ب ن) على وزن فَعَّال
        للحرفة. يجتاز اختباري السكّ والتثبيت المعجمي. هو الأجدر بتمثيل المجموعة ضمن
        لمّاتها.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبِّر عن البُعد التجاري والصناعي: صاحب المَلبنة (منشأة معالجة اللبن وبيعه) أو
        من يعمل فيها. يشمل المعنيَيْن الكلاسيكي (بائع اللبن) والحديث (مدير المنشأة
        الألبانية). يختلف عن اللِّبانيّ المقتصر على مالك المزرعة الزراعية، وعن الحَلَّاب
        المركِّز على ممارسة الحلب الفعلية.
      actions:
        - command: create_entry
          params:
            lemma: "لَبَّان"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"

    - lemma: "لِبانِيّ"
      decision: confirmed
      decision_reason: >-
        نسبة منتظمة إلى «لِبان/لبن» على وزن النسبة الاصطلاحي للتخصصات المهنية والانتساب
        إلى المجالات (كيميائيّ، زراعيّ، طبيّ). ورد في المورد الحديث (2008) بمعنى «صاحب
        مزرعةٍ لِبانيّة» — المقابل الأدق لـ dairy farmer. يمتاز على «مزارع الألبان» بكونه
        وحدة معجمية واحدة متلاحمة تجتاز اختبار السكّ ولا تقبل الإحلال الوصفي. مبني على
        الجذر (ل ب ن) بأسلوب اشتقاقي منتج.
      evidence_assessment:
        case: confirm_only
      mwe_check:
        is_mwe: false
      nuance_differentiation: >-
        يُعبِّر تحديداً عن البُعد الزراعي الرعوي: صاحب المزرعة اللِّبانية الذي يربي
        الماشية الحلوب وينتج الألبان من مصدرها الأول. يختلف عن اللَّبَّان المتصل بالمنشأة
        الحضرية أو التجارية، وعن الحَلَّاب المركِّز على عملية الحلب بذاتها.
      actions:
        - command: create_entry
          params:
            lemma: "لِبانِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "{synset_id}"


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
stage4_content:
  definition:
    current: "مالك أو مدير لمزرعة ألبان أو منشأة لمنتجات الألبان"
    assessment:
      decision: revise
      reason: >-
        التعريف الحالي مقبول دلالياً لكنه ترجمة شبه حرفية للتعريف الإنجليزي. يمكن
        تحسينه بأسلوب المعجم الوسيط: (١) استخدام «مَلْبَنَة» و«مزرعة لِبانيَّة» بدلاً
        من «منشأة لمنتجات الألبان» — وهما المصطلحان المعجميان المعتمدان. (٢) استبدال
        «مدير» بـ«يتولَّى إدارتها» لإيضاح الفعل الوظيفي.
    authored:
      - type: terminological
        text: "مَن يملك مَلْبَنةً أو مزرعةً لِبانيَّةً أو يتولَّى إدارتها"
        quality_check:
          genus_present: true
          differentia_present: true
          circular: false
    actions:
      - command: update_definition
        params:
          synset_id: "{synset_id}"
          definition_index: 0
          text: "مَن يملك مَلْبَنةً أو مزرعةً لِبانيَّةً أو يتولَّى إدارتها"

  examples:
    per_lemma:
      - lemma: "لَبَّان"
        examples:
