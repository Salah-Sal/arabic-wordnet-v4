step0_evidence:
  per_lemma:
    - lemma: "مُلَطِّف"
      confirm:
        - text: "«الملطّف: دواء يجعل قوام المادة أرقّ لما فيه من الحرارة المعتدلة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«مُلَطِّف: جاعل الشيء رقيقا»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
      expands:
        - text: "«مُلَطِّف: دواء يخفف أعراض المرض أو يزيله تماما»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
          addition: "دلالة الدواء الملطف أو المسكن للألم (palliative)"
        - text: "«ملطف: (أ) صفة لما يذهب التهيج أو الالتهاب من الأنسجة المسحوجة»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
          addition: "دلالة الملطف الموضعي (demulcent)"
      contradicts:
        - text: "«مُلَطِّف: شخصٌ يراقبُ ويغربلُ الرسائلَ قبل توزيعها»"
          source: "معجم مصطلحات المعلوماتية (2000)"
          conflict: "دلالة تقنية بعيدة عن المعنى العام (moderator)"

    - lemma: "مُنْعِش"
      confirm:
        - text: "«مُنْعِش: دواء ينبه الجملة العصبية المركزية...»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      evidence_status: "no_material_found"
      peripheral_observations:
        - lemma: "مُنْعِش"
          meaning_observed: "الاسم الفاعل من نَعَشَ، يدل على الإحياء والتقوية."
          source: "لسان العرب (بالقياس على الجذر)"

