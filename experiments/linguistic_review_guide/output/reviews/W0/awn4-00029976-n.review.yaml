step0_evidence:
  per_lemma:
    - lemma: "عَمَلِيَّة"
      confirm:
        - text: "«جملة أعمال تُحدث أثراً خاصّاً مثل عملية جراحية» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«إجراء يمتد على مدى فترة زمنية مُحددة، وأثناء حدوثه ينشأ أو يتطوّر شيءٌ ما (تدريجيًا).» — المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
        - text: "«إجمالي الأحداث المؤثرة بعضها على بعض في نظام ما، والتي تتسبب في تغيير أو نقل أو تخزين المادة أو الطاقة أو المعلومة أيضاً.» — مسرد الهندسة الكهربائية (موقع ArabTerm)"
          source: "مسرد الهندسة الكهربائية"
      expands:
        - text: "«في اللسانيات العامة، تطور تدريجي ومتتابع للغة وفقا لقوانين مطردة. (سَيْرُورَة)» — المعجم الموحد لمصطلحات اللسانيات (2002)"
          source: "المعجم الموحد لمصطلحات اللسانيات"
          addition: "استخدام مصطلح 'سيرورة' كمرادف متخصص للعملية في سياقات التطور اللغوي."
        - text: "«عَمَليّة: المصدر الصناعي يصاغ من معظم أنواع الكلام العربيّ... وقد أثبتت المعاجم الحديثة كالوسيط والأساسي هذه الكلمة، ونص الوسيط على أنها محدثة.» — معجم الصواب اللغوي"
          source: "معجم الصواب اللغوي"
          addition: "توثيق أن الكلمة مصدر صناعي مُحدث تم إقراره من مجمع اللغة العربية."

    - lemma: "عَمَلِيَّة فِيزْيَائِيَّة"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "سَيْرُورَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«سَيْرُورَة: في اللسانيات العامة، تطور تدريجي ومتتابع للغة وفقا لقوانين مطردة.» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "لفظ يعبر بدقة عن 'Gradual changes through a series of states' ويستخدم في السياقات الفلسفية والعلمية."
  knowledge_candidates:
    - lemma: "مَجْرَى"
      justification: "يستخدم في تعبيرات مثل 'مجرى الأحداث' للتعبير عن تتابع العمليات، لكنه قد يكون أقل دقة كمصطلح مستقل. (آلية: مجاز)"
  generation_notes: "التركيز على الطبيعة المستمرة والتدريجية للتغير في المفهوم."

step1_lemma_validation:
  per_lemma:
    - lemma: "عَمَلِيَّة"
      decision: confirmed
      decision_reason: "أدلة معجمية حديثة وتخصصية وفيرة تؤكد المعنى وتطابقه مع تعريف المجموعة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام والأكثر شيوعاً للتعبير عن أي تتابع من الأحداث أو التفاعلات التي تؤدي إلى نتيجة."
      example: "تعد عملية التمثيل الضوئي أساس الحياة على كوكب الأرض."

    - lemma: "عَمَلِيَّة فِيزْيَائِيَّة"
      decision: confirmed
      decision_reason: "مصطلح تقني مركب (MWE) يمثل النظير العربي المباشر لـ 'physical process' ويناسب السياق الفيزيائي للمجموعة."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تخصيص للعملية في الإطار المادي والطبيعي، مما يربطها مباشرة بالمشتمل 'كيان مادي'."
      example: "الانصهار هو عملية فيزيائية تتحول فيها المادة من الحالة الصلبة إلى السائلة."

    - lemma: "سَيْرُورَة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مستقر في المعاجم العلمية الحديثة (لسانيات، فلسفة) ويعبر بدقة عن التغير التدريجي والمستمر."
      step05_citation: "«سَيْرُورَة: تطور تدريجي ومتتابع...» — المعجم الموحد لمصطلحات اللسانيات"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على بُعد 'الصيرورة' والتطور المتتابع عبر الزمن، وغالباً ما يستخدم في السياقات الفكرية والعلمية التجريدية."
      example: "السيرورة التاريخية للمجتمعات تقتضي التحول من البداوة إلى الحضارة."

    - lemma: "مَجْرَى"
      source: step05
      decision: removed
      decision_reason: "غالباً ما يحتاج لإضافة (مجرى الأحداث) ليعطي معنى العملية، ولا يستعمل كمصطلح مستقل في العلوم الطبيعية بهذا المعنى."
      step05_citation: "استنتاج لغوي عام"

