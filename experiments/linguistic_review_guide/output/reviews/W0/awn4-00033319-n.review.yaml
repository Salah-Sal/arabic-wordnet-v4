step0_evidence:
  per_lemma:
    - lemma: "اتِّصَال"
      confirm:
        - text: "«اتصال: تماس بين مُوصِلين يسمح بمرور رسالة ما» — مسرد الإعلام والتواصل، ArabTerm"
          source: "ArabTerm"
        - text: "«الاتصال حسب المنظرين واللسانيين هو نقل معلومة من نقطة إلى أخرى... بواسطة إرساليات لها شكل معين» — مسرد الإعلام والتواصل، ArabTerm"
          source: "ArabTerm"
        - text: "«الاتصال: Junction ،communication [ في الفرنسية] Jonction ،communication في اللغة پيوستن ضد الانفصال وهو أمر إضافي يوصف به الشيء بالقياس إلى غيره.» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«اتصال التربيع: اتصال جدار بجدار بحيث تتداخل لبنات أحدهما في الآخر» — التوقيف على مهمات التعاريف للمناوي"
          source: "التوقيف على مهمات التعاريف للمناوي"
          addition: "معنى هندسي/إنشائي متخصص للكلمة"
        - text: "«الاتصال عند الصوفية الاتحاد هو شهود الحق الواحد المطلق...» — دستور العلماء للأحمدنكري"
          source: "دستور العلماء للأحمدنكري"
          addition: "معنى صوفي/فلسفي مستقل تماماً"

    - lemma: "تَوَاصُل"
      confirm:
        - text: "«التواصل يتضمن في تعريفه إعطاء المعلومة والحصول على رد الفعل... فالتواصل هو حزام نقل بين نشر المعلومات وتخطيط العمل.» — مسرد المناخ والبيئة، ArabTerm"
          source: "ArabTerm"
        - text: "«تواصُل: اتصال متبادل» — مسرد الإعلام والتواصل، ArabTerm"
          source: "ArabTerm"
        - text: "«نقل الأخبار بواسطة العلامات والإشارات بين مرسل إلى متلقٍ عبر قناة ما» — المعجم الموحد لمصطلحات اللسانيات (2002)"
          source: "ArabTerm"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رِسَالَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«رِسَالَة: communication / notification» — المعجم الموحد لمصطلحات المياه (2000)"
      justification: "تدل بدقة على الشيء المنقول أو الوحدة التواصلية، وهو ما يطابق تعريف المجموعة (شيء يُنقل)."
  knowledge_candidates:
    - lemma: "بَلَاغ"
      justification: "استخدام آلية (المجاز) لإحياء لفظ تراثي يدل على الإيصال والإبلاغ، ويُستخدم في الفصحى المعاصرة للدلالة على البلاغات والاتصالات الرسمية."
  generation_notes: "اللمّات الأصلية (اتصال وتواصل) تميل للتعبير عن العملية (Process)، بينما المرشحات (رسالة وبلاغ) تعبر أكثر عن المحتوى المنقول (Something communicated) كما ورد في التعريف."

step1_lemma_validation:
  per_lemma:
    - lemma: "اتِّصَال"
      decision: "confirmed"
      decision_reason: "مصطلح أساسي معتمد في المعاجم العربية والتقنية للتعبير عن الاتصال بمستوياته المختلفة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على مجرد الربط أو الوسيلة المستخدمة في نقل المعلومة، ويركز على الجانب التقني أو الوجودي للصلة."
      example: "يُسهّل الاتصال الرقمي نقل المعلومات بسرعة فائقة."

    - lemma: "تَوَاصُل"
      decision: "confirmed"
      decision_reason: "مصطلح معاصر وشائع يبرز الجانب التفاعلي والتبادلي في التواصل البشري."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يبرز الجانب التفاعلي والاجتماعي وتبادل الأدوار بين المرسل والمتلقي، وهو صيغة (تفاعل) التي تدل على المشاركة."
      example: "الحوار هو أفضل وسيلة للتواصل بين الشعوب."

    - lemma: "رِسَالَة"
      source: "step05"
      decision: "confirmed"
      decision_reason: "تطابق دقيق لتعريف المجموعة كـ 'شيء يُنقل' (Something communicated)، وهي وحدة التواصل الأساسية."
      step05_citation: "«رِسَالَة: communication / notification» — المعجم الموحد لمصطلحات المياه (2000)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على المحتوى المحدّد أو الوحدة الإعلامية التي يتم نقلها فعلياً، لا عملية النقل ذاتها."
      example: "رسالة السلام يجب أن تصل إلى كل مكان."
      actions:
        - command: "create_entry"
          params:
            lemma: "رِسَالَة"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00033319-n"

    - lemma: "بَلَاغ"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مصطلح فصيح يدل على الإبلاغ والإيصال، ويناسب دلالة المحتوى المنقول في السياقات الرسمية والإعلامية."
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على إيصال خبر أو نبأ بصفة رسمية أو معلنة، ويبرز جانب 'الإبلاغ'."
      example: "أصدرت الوزارة بلاغاً توضيحياً بخصوص الإجراءات الجديدة."
      actions:
