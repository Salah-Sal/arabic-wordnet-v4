step0_evidence:
  per_lemma:
    - lemma: "عالم آخر"
      confirm:
        - text: "«يحيل العالم الآخر على عوالم مركزيات أخرى، لكنه يتجه إلى التنبؤ بعالم ميتافيزيقي كما في رسالة الغفران والكوميديا الإلهية والفردوس المفقود بما أنها عوالم بشرية يُحِس بها ولا تدرك.» — المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«الآخِرة: العالَم الآخَر.» — المورد الحديث (2008)"

    - lemma: "عالم الغيب"
      confirm:
        - text: "«عالم الشهادة: عالم الأكوان الظاهرة: مقابل عالم الغيب» — المعجم الوسيط"
        - text: "«المَلَكُوتُ: عالم الغيب المختصُّ بالأرواح والنفوس والعجائب» — المعجم الوسيط"
        - text: "«ما وراء الطبيعة: عالم الغيب (الميتافيزيقا)» — المعجم الكبير"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عالم الملكوت"
      source_section: "step4_fts_keyword"
      evidence_citation: "«المَلَكُوتُ: عالم الغيب المختصُّ بالأرواح والنفوس والعجائب» — المعجم الوسيط"
      justification: "يدل المصطلح على العالم الروحي الغيبي المختص بالأرواح والنفوس، وهو مطابق لتعريف المجموعة دلالياً."
    - lemma: "الآخرة"
      source_section: "step5_english_bridge"
      evidence_citation: "«الآخِرة: العالَم الآخَر.» — المورد الحديث (2008)"
      justification: "مقابل عربي مباشر للمصطلح الإنجليزي otherworld ويشير إلى عالم ما بعد الموت."
  knowledge_candidates:
    - lemma: "عالم الأرواح"
      justification: "مصطلح شائع في الأدبيات الفلسفية والصوفية للإشارة إلى العالم الروحي المجرد."
    - lemma: "العالم العلوي"
      justification: "آلية التوليد: مجاز/تقابل. مصطلح فلسفي يقابل 'العالم السفلي' ويشير إلى العوالم المجردة والروحية."

step1_lemma_validation:
  per_lemma:
    - lemma: "عالم آخر"
      decision: confirmed
      decision_reason: "مصطلح مستقر ومدعوم بأدلة معجمية (المورد، اللسانيات)."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح عام وشامل يشمل أي عالم غير الواقع الدنيوي، سواء كان غيبياً أو متخيلاً."
      example: "يستعرض أدب الرحلات الخيالية تصورات الإنسان القديم عن عالم آخر تسكنه كائنات أسطورية."

    - lemma: "عالم الغيب"
      decision: confirmed
      decision_reason: "مصطلح تراثي وفصيح يمثل المفهوم بدقة عالية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على بُعد 'عدم الإدراك' (الغيب) والاستئثار الإلهي بالعلم."
      example: "الإيمان بعالم الغيب ركن أساسي في العقائد الدينية التي تقر بوجود عوالم وراء الحس."

    - lemma: "عالم الملكوت"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح تراثي دقيق يصف عالم الأرواح والنفوس."
      step05_citation: "«المَلَكُوتُ: عالم الغيب المختصُّ بالأرواح والنفوس والعجائب» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يخص العوالم الروحية العلوية والمختصة بالأرواح والملائكة."
      example: "تأمل المتصوفة في أسرار عالم الملكوت وما يحويه من لطائف روحية مجردة."
      actions:
        - command: create_entry
          params:
            lemma: "عالم الملكوت"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05818169-n"

    - lemma: "عالم الأرواح"
      source: step05
      decision: confirmed
      decision_reason: "تعبير اصطلاحي مستقر في الفلسفة وعلم الكلام."
      step05_citation: "«الملكوت في اصطلاح الصوفية هو عالم الأرواح» — كشاف اصطلاحات الفنون"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الكائنات الروحية (الأرواح) كمكون أساسي لهذا العالم."
      example: "يرى أفلاطون أن النفس البشرية كانت تحيا في عالم الأرواح قبل حلولها في الجسد."
      actions:
        - command: create_entry
          params:
            lemma: "عالم الأرواح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05818169-n"

    - lemma: "العالم العلوي"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فلسفي رصين يقابل العالم المادي السفلي."
      step05_citation: "«تسمّى تلك الصفات... ملكوتا... والملكوت الأعلى وما سواه فهو الملكوت الأدنى» — كشاف اصطلاحات الفنون"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الرفعة والسمو والتراتبية الوجودية عن عالم المادة."
      example: "ارتقى الفيلسوف بتفكيره من عالم المادة إلى العالم العلوي المجرد."
      actions:
        - command: create_entry
          params:
            lemma: "العالم العلوي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-05818169-n"

  added_lemmas:
    - lemma: "عالم الملكوت"
      reason: "مصدر: الخطوة ٠٫٥ (المعجم الوسيط)"
      via_command: create_entry + add_sense
    - lemma: "عالم الأرواح"
