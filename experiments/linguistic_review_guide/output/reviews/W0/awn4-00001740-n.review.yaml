# ── المرحلة ٥: الإثراء ──────────────────────────────────────
# الجذر الفعلي لكلا اللمتين هو (كون) كما يثبته مقاييس اللغة لابن فارس.
# ملاحظة: قاعدة البيانات تُسجِّل الجذر بصيغة "كن" (مصدر أداة camel) وهو اختزال،
