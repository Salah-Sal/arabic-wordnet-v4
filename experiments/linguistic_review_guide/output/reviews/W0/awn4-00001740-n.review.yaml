# ── المرحلة ١: المراجعة والتوليد ────────────────────────────
stage1_review:
  assessment:
    concerns:
      - "لمّة كَيْنُونَة لم ترد مدخلاً مستقلاً في قواعد البيانات المعجمية الحديثة المُستعلَمة، مما يُضعف أثرها الاصطلاحي المُعاصر"
      - "بعض مصادر ARABTERM تضبط كِيَان بالفتح (كَيَان) وهو ضبط مرفوض يُخشى تسرُّبه إلى النص"
      - "المجموعة تضمُّ لمتَيْن من جذر واحد (كون) دون تمييز واضح للفروق الدلالية بينهما في البيانات الوصفية"
    observations: >
      المجموعة awn4-00001740-n تمثِّل رأس الهرمية الاسمية في شبكة WordNet، وهي تُقابل المفهوم الفلسفي الأشمل "entity".
      اللمتان الموجودتان (كينونة وكيان) كلتاهما من الجذر (ك و ن):
      فكَيْنُونَة مصدرٌ صناعي على وزن فَيْعُولَة يُركِّز على حالة الكون (act of being)،
      وكِيَان مصدرٌ قياسي على وزن فِعَال يُركِّز على الكيان بما هو وحدة وجودية متميزة.
      يصحُّ توصيف كيان بالمصطلح الاصطلاحي الحديث وكينونة بالإطار الفلسفي التراثي.
      ويُلاحَظ أن معاجم ARABTERM تُسجِّل كيان مقابلاً نمطياً لـ entity في نحو خمسة عشر مجالاً متنوعاً،
      في حين تُسجِّل كينونة أحياناً مقابلاً لـ existence لا entity؛
      ما يستدعي توثيق الفروق الدلالية الدقيقة بين اللمتين.

  blind_candidates:
    - lemma: "مَوْجُود"
      generation_method: ishtiqaq
      justification: >
        اشتقاق على وزن مَفْعُول من الجذر (و ج د). يُطلَق في الفلسفة العربية الكلاسيكية
        على كل ما ثبت له وجود مستقل سواء أكان حيًّا أم غير حي. يُصاغ الجمع على
        موجودات ومنه "الموجود الواجب والموجود الممكن" عند ابن سينا. يفي بوظيفة
        الجنس القريب للتعريف (ما يُدرَك أو يُستدَلُّ على وجوده).
    - lemma: "ذَات"
      generation_method: majaz
      justification: >
        إزاحة دلالية من معنى "النفس والجوهر" إلى الكيان المستقل. يُوظَّف في بعض
        مصادر اللسانيات والمعلوماتية مقابلاً لـ entity، وهو لفظ فصيح قديم يمكن
        إحياؤه لهذا الغرض تجنُّباً للتعريب.
    - lemma: "جَوْهَر"
      generation_method: majaz
      justification: >
        إزاحة دلالية من مصطلح الفلسفة الأرسطية "ما قام بنفسه مقابل العَرَض"
        إلى مفهوم الكيان المستقل. الجوهر في تراث الفلاسفة المسلمين يُعرَّف بأنه
        "الموجود لا في موضوع" وهو تعريف يتقاطع مع entity.
    - lemma: "مَاهِيَّة"
      generation_method: ishtiqaq
      justification: >
        مصدر صناعي من الاستفهام "ما هو؟" + ياء النسبة + تاء التأنيث. يُعبِّر عن
        حقيقة الشيء وجوهره، ويُستعمل في الفلسفة لمقابلة quiddity/essence/being.
        يُصلح مرشحاً لأعلى مستوى تجريدي في الهرمية الاسمية.


# ── المرحلة ٢: جمع الأدلة ────────────────────────────────────
