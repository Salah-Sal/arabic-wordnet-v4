stage2_evidence:
  per_lemma:

    - lemma: "كَيْنُونَة"
      confirm:
        - text: "«يقال: كان الشيء كوْنًا، وكِيانًا، وكينونةً — وذكرت المعاجم كِيانًا بالكسر»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
        - text: "«(1) كينونة؛ وجود (2) الكائنات مجتمعةً (3) كائن (4) حياة؛ بقاء struggle for existence»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«كَينونَةٌ مَرَضِيَّة»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "تُوظَّف في السياق الطبي ضمن المركب الاصطلاحي (ens morbi) دليلاً على استعمالها في سياقات تقنية"
        - text: "«(1) غير ذي جوهر أو كينونة (2) غير جوهري (3) شيء غير جوهري»"
          source: "المورد الحديث (2008)"
          addition: "ورودها في السياق السلبي 'غير ذي جوهر أو كينونة' يُثبت أنها تُستعمل دلالياً في موضع entity"

    - lemma: "كِيَان"
      confirm:
        - text: "«حقيقة الشيء أو وجوده المستقل.»"
          source: "معجم المصطلحات الطبية (ج.2، 2003)"
        - text: "«شيء مادي أو غير مادي يمكن التعرُّف عليه وتمييزه بوضوح.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«في التصميم بمعونة الحاسوب والتصميم الغرضي التوجه: بندٌ يمكِن أن يُعامَلَ كوحدة مستقلة، وغالباً كعضو من نوع أو صنف معيَّن.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
        - text: "«شيء أو حدث يُخزَن عنه بيان في قاعدة البيانات.»"
          source: "مسرد التربية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«(1) وجود (2) كيان؛ كينونة.»"
          source: "المورد الحديث (2008)"
      contradicts:
        - text: "«كَيَانالجذر: ك و ن — الرأي: مرفوضة عند بعضهم — السبب: لأنها لم ترد بهذا الضبط في المعاجم. الصواب والرتبة: -الكِيان الصهيونيّ [فصيحة]»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
          conflict: "يُثبت أن ضبط الكلمة بالفتح (كَيَان) خطأ شائع، والصواب كِيَان بكسر الكاف"
      expands:
        - text: "«مكوّن من مكونات اللغة كالوحدة النحوية أو الوحدة المعجمية.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          addition: "يُشير إلى استعمال كيان في اللسانيات بمعنى الوحدة المعجمية أو النحوية"

    - lemma: "مَوْجُود"
      confirm:
        - text: "«مجموع أحداث حياة ملموسة، وحركية وجود الإنسان في العالم تتخذ موضوع مذهبية أدبية في ثلاثية 'دروب الحرية' لسارتر.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      contradicts:
        - text: "«(1) موجودٌ بذاتِهِ: موجود من غير مُوجِد [كالله سبحانه] (2) ذو وجود مستقلّ.»"
          source: "المورد الحديث (2008)"
          conflict: "الترجمة المقابلة في المورد الحديث هي self-existent لا entity، مما يُثبت أن موجود يدل على الوصف (صفة الوجود) لا على الكيان (ذات الشيء)"

    - lemma: "ذَات"
      confirm:
        - text: "«مكوّن من مكونات اللغة كالوحدة النحوية أو الوحدة المعجمية.» (مقابل: Entity)"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«مكوّن من مكونات اللغة نحو: الوحدة النحوية أو الوحدة المعجمية.» (مقابل: Entity)"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
      contradicts:
        - text: "«ماهية، جوهر» (مقابل: essence)"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "في معجم الفلسفة وعلم النفس تُقابل ذات كلمة essence وليس entity، مما يكشف عن اضطراب في توظيفها"

    - lemma: "جَوْهَر"
      contradicts:
        - text: "«جوهر» (مقابل: essence)"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          conflict: "جوهر = essence لا entity في المعاجم التربوية"
        - text: "«جوهر» (مقابل: substance)"
          source: "المعجم الموحد لمصطلحات التقنيات التربوية (1999)"
          conflict: "جوهر = substance بالمعنى الأرسطي، وهو مفهوم مغاير لـ entity"
        - text: "«(1) غير ذي جوهر أو كينونة (2) غير جوهري (3) شيء غير جوهري.» (مقابل: inessential)"
          source: "المورد الحديث (2008)"
          conflict: "السياق يُثبت أن جوهر في الاستعمال العربي يعني الجوهرية/الأساسية لا الكيان المستقل"

    - lemma: "مَاهِيَّة"
      contradicts:
        - text: "«ماهية، جوهر» (مقابل: essence)"
          source: "مسرد الفلسفة وعلم النفس، المنظمة العربية للتربية والثقافة والعلوم (ArabTerm)"
          conflict: "ماهية = essence/quiddity لا entity؛ تدل على حقيقة الشيء من حيث ماهيته، لا على وجوده كيانًا مستقلًّا"
        - text: "«(1) نقطة تافهة؛ فارق دقيق [في النقاش أو المجادلة] (2) غَريبة؛ ظاهرة غريبة (3) جوهر؛ ماهيّة.» (مقابل: quiddity)"
          source: "المورد الحديث (2008)"
          conflict: "المقابل الإنجليزي لماهية في المعجم الحديث هو quiddity لا entity"


# ── المرحلة ٣: التحليل اللغوي للّمات ────────────────────────
stage3_analysis:
  per_lemma:

    - lemma: "كَيْنُونَة"
      decision: confirmed
      decision_reason: >
        مصدر عربي فصيح أصيل من الجذر (كون) على وزن فَيْعُولَة، موثَّق في معاجم اللغة
        والمعجم الطبي ومعجم الصواب. يحمل دلالة وجودية فلسفية تُعبِّر عن مفهوم entity
        بوصفه "حالة الكون والوجود". التعريف المُعطى يشمل "ما يُستدَلُّ على وجوده
        المستقل" وهذا ينطبق على المعنى الأشمل للكينونة الفلسفية. إبقاؤه مناسب
        لتغطية الاستعمال الفلسفي والوجودي.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        تُركِّز كَيْنُونَة على حالة الوجود ذاتها ومصدريتها (act/state of being)،
        وتُستعمل في السياقات الفلسفية والوجودية للتعبير عن الوجود المجرد (being qua being)،
        بينما كِيَان يُعبِّر عن الكيان بما هو وحدة وجودية متميزة محددة الهوية.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كَيْنُونَة"

    - lemma: "كِيَان"
      decision: confirmed
      decision_reason: >
        اللمّة الأوسع انتشاراً وأكثرها توثيقاً في المعاجم التقنية والعلمية الحديثة
        كمقابل لـ entity عبر خمسة عشر مجالاً متنوعاً (طب، تقنية، قانون، تربية، بيئة).
        معجم الصواب اللغوي يُؤكِّد صحة كِيَان بكسر الكاف. الجذر كون، الوزن فِعَال.
        يجتاز جميع اختبارات بوابة جودة المصطلح: اطِّراد، يُسر تداول، ملاءمة، اشتقاقية.
      evidence_assessment:
        case: mixed
      mwe_check:
        is_mwe: false
      nuance_differentiation: >
        يُركِّز كِيَان على الكيان بما هو وحدة وجودية متميزة ومستقلة قابلة للتعريف
        والتصنيف، ويُستعمل في السياقات التقنية والعلمية والقانونية والأدبية للإشارة
        إلى أي شيء محدَّد الهوية سواء أكان حيًّا أم غير حي. هو المصطلح العملي التداولي،
        في حين تبقى كَيْنُونَة للاستخدام الفلسفي التجريدي.
      actions:
        - command: update_lemma
          params:
            entry_id: "{auto}"
            new_lemma: "كِيَان"

    - lemma: "مَوْجُود"
      source: stage1
      decision: removed
      decision_reason: >
        مَوْجُود اسمُ مفعول/صفة يدلُّ على "الذي ثبت له الوجود" (self-existent / the existent one)،
        وهو يُعبِّر عن الوصف لا عن الجوهر. المعجم الحديث يُترجمه بـexistent لا entity.
        تفشل اختبار الاستبدال في السياقات التقنية: "الكيانات في قاعدة البيانات" أدق من
        "الموجودات في قاعدة البيانات". كذلك يحمل موجود في الاستعمال المعاصر دلالة
        أحياناً بالمعنى الوجودي-الأدبي (Sartre) مما يُوجد اشتراكاً لفظياً.

    - lemma: "ذَات"
      source: stage1
      decision: removed
      decision_reason: >
        ذَات في الأصل تعني "النفس" و"الجوهر" وتنحو نحو الكيانات الذاتية الواعية.
        المعجم يُسجِّلها في اللسانيات والمعلوماتية كمقابل جزئي لـ entity، لكنها
        تفتقر إلى الشمول الدلالي المطلوب لأعلى مستوى في الهرمية الاسمية التي تضمُّ
        الحي وغير الحي على السواء. تفشل اختبار الملاءمة: "ذوات الجماد" تعبير مستغرب
        في حين "كيانات الجماد" مقبول. أيضاً يُعطي معجم الفلسفة ذات=essence لا entity.

    - lemma: "جَوْهَر"
      source: stage1
      decision: removed
      decision_reason: >
        جَوْهَر في الموروث العربي يُقابل substance/essence في الفلسفة الأرسطية لا entity.
        هو "ما قام بنفسه مقابل العَرَض" — وهذا مفهوم مختلف عن الكيان المُدرَك بأي
        وسيلة. المعاجم الحديثة تُسجِّله مقابلاً لـessence وsubstance حصراً.
        إدراجه في هذه المجموعة سيُفضي إلى تضارب مع مجموعات دلالية أخرى (substance, essence).

    - lemma: "مَاهِيَّة"
      source: stage1
      decision: removed
      decision_reason: >
        مَاهِيَّة = quiddity/essence تُجيب عن السؤال "ما هو الشيء في حقيقته؟"
        وهي مفهوم معرفي أنطولوجي مختلف عن entity. المعجم يُقابلها بـessence وquiddity.
        استعمالها كمرادف لكيان سيُخلط بين مستويين: وجود الشيء (entity) وحقيقته (essence).


# ── المرحلة ٤: التعريف والأمثلة ──────────────────────────────
