      decision: confirmed
      decision_reason: "اسم ذات يدل على الحدث الشنيع، شائع الاستعمال في صيغة الجمع"
      step05_citation: "«فظائع: أحداث أو أمور شديدة الشناعة» — معجم اللغة العربية المعاصرة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُستخدم غالباً للدلالة على الحوادث المادية والجرائم (فظائع الحرب)، وتميل للتشخيص أكثر من المصدر المجرد (فظاعة)."
      example: "وثّقت المنظمات الحقوقية فظيعةً جديدةً ارتكبتها قوات الاحتلال."
      actions:
