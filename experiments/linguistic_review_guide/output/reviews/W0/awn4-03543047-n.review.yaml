    - lemma: "هول"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الهول: الأمر الفظيع يهول أي يفزع» — التوقيف على مهمات التعاريف"
      justification: "لفظ تراثي مستقر يدل على الأمر الفظيع الذي يثير الفزع، وهو مطابق تماماً لتعريف المجموعة."
    - lemma: "فظيعة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«فظائع: أحداث أو أمور شديدة الشناعة» — معجم اللغة العربية المعاصرة"
      justification: "الاسم المؤنث من الصفة (فظيع) يُستخدم كاسم ذات للدلالة على الحدث أو الشيء الشنيع."
  knowledge_candidates:
    - lemma: "شناعة"
      justification: "مصدر يدل على القبح الشديد والفظاعة، ويُستخدم لوصف الأمور التي تثير الاشمئزاز (آلية: اشتقاق من الجذر ش-ن-ع)."
    - lemma: "مفزعة"
      justification: "اسم فاعل مؤنث استُخدم اسماً للدلالة على الحادثة أو الشيء الذي يوقع الفزع (آلية: اشتقاق من الجذر ف-ز-ع)."

step1_lemma_validation:
