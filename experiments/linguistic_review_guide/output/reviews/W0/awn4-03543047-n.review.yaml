      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير وصفي عام يركز على الأثر النفسي (الرعب) الذي يسببه الشيء."
      example: "كانت الغابة في الليل شيئاً مرعباً يوحي بالخطر."

    - lemma: "هول"
      source: step05
      decision: confirmed
      decision_reason: "لفظ أصيل وقوي الدلالة على الأمر الشديد الفظيع"
      step05_citation: "«الهول: الأمر الفظيع يهول أي يفزع» — التوقيف على مهمات التعاريف"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يوحي بعظمة الأمر وجلاله وما يرافقه من هيبة وفزع شديد، ويُستخدم كثيراً في وصف الكوارث."
      example: "لم يستطع أحدٌ تحمل هول الصدمة عند سماع الخبر."
