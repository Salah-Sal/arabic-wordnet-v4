      nuance_differentiation: "تدل على القبح الشديد والشناعة في الشيء أو الفعل، وغالباً ما تُستخدم في سياق أخلاقي أو وصفي للجرائم."
      example: "هالني فظاعة المشهد الذي خلّفه الإعصار في المدينة."

    - lemma: "شيء مرعب"
      decision: confirmed
      decision_reason: "تعبير وصفي مستقر في المعاجم الثنائية لوصف الكيان المثير للرعب"
