step0_evidence:
  per_lemma:
    - lemma: "مثير للإعجاب الفوري"
      evidence_status: "no_material_found"
      peripheral_observations:
        - lemma: "إعجاب"
          text: "«دهشة لما هو غاية في الجمال ويثير انفعالا روحيا» — المعجم الموحد لمصطلحات اللسانيات"
        - lemma: "فوري"
          text: "«حدث يحدث أو يتم تحقيقه دون إبطاء، بشكل فوري» — مسرد التربية"

    - lemma: "يستحق الإعجاب"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رائع"
      source_section: "step4_fts_keyword"
      evidence_citation: "«وصف لما جاوز المألوف في الفن والأخلاق والفكر» — المعجم الكبير"
      justification: "يدل على الشيء الذي يثير الإعجاب (يروع لحسنه) ويتجاوز المألوف، وهو أدق تعبير عن 'الجيد جداً'."
    - lemma: "بديع"
      source_section: "step4_fts_keyword"
      evidence_citation: "«ما بلغ الغاية في بابه» — المعجم الوسيط"
      justification: "يدل على بلوغ الغاية في الجودة والإتقان، مما يستدعي الإعجاب الفوري."
  knowledge_candidates:
    - lemma: "مبهر"
      justification: "اشتقاق: اسم فاعل من بَهَرَ، يدل على الشيء الذي يخطف الأبصار ويدهشها، وهو سياق ملازم للإعجاب الفوري."
    - lemma: "خاطف للأنظار"
      justification: "تركيب: تعبير اصطلاحي يدل على الشيء الذي يجذب الانتباه فوراً لجماله أو جودته، وهو مكافئ لمصطلحات التواصل الاجتماعي (Eye-catching)."

step1_lemma_validation:
  per_lemma:
    - lemma: "مثير للإعجاب الفوري"
      decision: "removed"
      decision_reason: "تعبير وصفي حر طويل وليس وحدة معجمية (phrase/definition rather than lemma)."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "تعبير وصفي مطول يشرح المفهوم بدلاً من تسميته."
      actions:
        - command: "remove_sense"
          params:
            sense_id: "{auto}"

    - lemma: "يستحق الإعجاب"
      decision: "confirmed"
      decision_reason: "تعبير اصطلاحي شائع ومستقر لغوياً لوصف ما يثير التقدير."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الاستحقاق والمكانة (merit) أكثر من مجرد الانطباع البصري."
      example: "هذا المحتوى الهادف يستحق الإعجاب والدعم من الجميع."

    - lemma: "رائع"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مصطلح معجمي فصيح وشائع يدل على بلوغ الغاية في الحسن."
      step05_citation: "«الرائع: المعجب» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز بدلالة الدهشة والروعة (يروع) التي تسبق الإعجاب."
      example: "نشر الفنان لوحة رائعة حصدت آلاف الإعجابات في دقائق."
      actions:
        - command: "create_entry"
          params:
            lemma: "رائع"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-90009142-n"

    - lemma: "بديع"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مصطلح فصيح يدل على الابتكار وبلوغ القمة في الجودة."
      step05_citation: "«ما بلغ الغاية في بابه» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يؤكد على جانب الابتكار والإبداع (المبدع والمبتدع)."
      example: "قدم المهندس تصميماً بديعاً نال إعجاب الحاضرين فور رؤيته."
      actions:
        - command: "create_entry"
          params:
            lemma: "بديع"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-90009142-n"

    - lemma: "مبهر"
      source: "step05"
      decision: "confirmed"
      decision_reason: "اسم فاعل يدل على شدة التأثير والإدهاش."
      step05_citation: "«ضوء مبهر: ساطع» — معجم الصواب اللغوي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الأثر البصري أو الحسي الصادم (البهر)."
      example: "حقق الفيديو القصير انتشاراً مبهراً على منصات التواصل."
      actions:
        - command: "create_entry"
          params:
            lemma: "مبهر"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-90009142-n"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "رائع"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "بديع"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "مبهر"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

step3_definition:
  definition_review_flag: true
  current_definition: "شيء جيد جداً لدرجة أنه يستحق التصويت عليه بالإعجاب فوراً على وسائل التواصل الاجتماعي"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي يستخدم لغة غير معجمية (لغة شبكات اجتماعية)؛ يجب صياغته بأسلوب معجمي رصين يعبر عن المفهوم الجوهري."
  authored_definitions:
    - type: "terminological"
      text: "شيء فائق الجودة أو الجمال، يثير دهشة المتلقي ويستحق التقدير الفوري."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: "update_definition"
      params:
        synset_id: "awn4-90009142-n"
        definition_index: 0
        text: "شيء فائق الجودة أو الجمال، يثير دهشة المتلقي ويستحق التقدير الفوري."

