step0_evidence:
  per_lemma:
    - lemma: "مُنْتِن"
      confirm:
        - text: "«(المنتن) مَوضِع النتانة» — المعجم الوسيط"
        - text: "«مُنْتِن: foetid (fetid)» — المعجم الطبي الموحد (2009)"
        - text: "«أنتن الشيء: نتن؛ عَفِن، خَبُثت رائحتُه وفسد» — معجم اللغة العربية المعاصرة"
      expands:
        - text: "«في الحديث: دعوها فإنها منتنة؛ أي مذمومة في الشرع مجتنبة مكروهة كما يجتنب الشيء المنتن» — لسان العرب"
          addition: "استعمال مجازي للدلالة على القبح المعنوي (دعوى الجاهلية)"

    - lemma: "شيء كريه الرائحة"
      confirm:
        - text: "«stinker: شيء نَتِن» — المورد الحديث (2008)"
      peripheral_observations:
        - lemma: "شيء كريه الرائحة"
          observation: "اللفظ عبارة عن تركيب وصفي حر وليس وحدة معجمية مسكوكة في المعاجم القديمة، لكنه مستعمل كترجمة دقيقة للمفهوم"
          source: "تحليل لغوي"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نَتِن"
      source_section: "step5_english_bridge"
      evidence_citation: "«واحدُهم: نَتِنٌ، كَزَمِنٍ وزَمْنَى، سَمَّاهُم نَتْنَى لِكُفْرِهم» — لسان العرب"
      justification: "صفة مشبهة تدل على الثبوت للشيء الذي خبثت رائحته، وورد في الأثر بصيغة الجمع 'النتنى' لوصف الأسرى المذمومين"
  knowledge_candidates:
    - lemma: "خَبِيث الرَّائِحَة"
      justification: "تركيب إضافي مستقر دلالياً لوصف ما تنبعث منه رائحة منفرة، وهو المقابل الفصيح الشائع في النصوص العلمية والأدبية"
  generation_notes: "المفهوم يدور حول الجذر (ن-ت-ن)، والمرشحات تركز على الصيغ الصرفية التي تحول الفعل إلى اسم/صفة للشيء"

step1_lemma_validation:
  per_lemma:
    - lemma: "مُنْتِن"
      decision: "confirmed"
      decision_reason: "مصطلح أصيل مدعوم بالمعاجم القديمة والحديثة، ويمثل اسم الفاعل من 'أنتن'"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على الشيء في حالة صدور الرائحة منه فعلياً (اسم فاعل)"
      example: "ابتعد الناس عن ذلك المكان بسبب وجود جيفة منتنة."

    - lemma: "شيء كريه الرائحة"
      decision: "confirmed"
      decision_reason: "رغم كونه تركيباً وصفياً، إلا أنه يمثل الترجمة المباشرة والأكثر شيوعاً للمفهوم الكلي"
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير عام يشمل أي مادة أو كيان دون تخصيص طبيعته"
      example: "تجنب وضع أي شيء كريه الرائحة داخل خزانة الملابس."

    - lemma: "نَتِن"
      source: "step05"
      decision: "confirmed"
      decision_reason: "لفظ فصيح تراثي (صفة مشبهة) يدل على المفهوم بدقة وأوجز من التركيب الوصفي"
      step05_citation: "«واحدهم نَتِنٌ كزَمِنٍ وزَمْنَى» — لسان العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "صفة مشبهة تدل على ثبوت صفة النتن في الشيء، وتستخدم أيضاً في سياق الذم المعنوي"
      example: "لا تقترب من ذلك الماء النتن الراكد في الحفرة."
      actions:
        - command: "create_entry"
          params:
            lemma: "نَتِن"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04327869-n"

