step0_evidence:
  per_lemma:
    - lemma: "مَادَّة"
      confirm:
        - text: "«(المادة) كل جسم ذي امتداد ووزن ويشغل حيزا من الفراغ (مو)» — المعجم الوسيط"
          source: "المعجم الوسيط"
        - text: "«مُصطلح يشمل كافة الأجسام المرئية التي لها كُتلة. أمّا الحيّز المكاني الذي يخلو من أية مادة فيُسمّى الفراغ.» — المعجم الموحد لمصطلحات الطاقة المتجددة"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
      expands:
        - text: "«عند الحكماء هي المحل وتسمّى بالهيولى أيضا» — كشاف اصطلاحات الفنون للتهانوي"
          source: "كشاف اصطلاحات الفنون"
          addition: "ربط المادة بمصطلح الهيولى الفلسفي"
        - text: "«مادة الشيء: هي التي يحصل الشيء معها بالقوة، وقيل: المادة: الزيادة المتصلة.» — كتاب التعريفات للجرجاني"
          source: "كتاب التعريفات"
          addition: "تعريف فلسفي يركز على الوجود بالقوة والزيادة"

