step0_evidence:
  per_lemma:
    - lemma: "مُسَكِّن"
      confirm:
        - text: "«(في علم الطب) Analgesic: دواءٌ يُخَفِّفُ الْإحساسَ بالألم أو يُفْقِدُ الْإحساسَ به» — المعجم الكبير"
          source: "المعجم الكبير"
      contradicts:
        - text: "«Analgesic: دواء يخفف الألم» — المعجم الكبير"
          source: "المعجم الكبير"
          conflict: "المصطلح طبي يشير للأدوية المسكنة للألم (Analgesics)، بينما المجموعة تشير لأدوات التهدئة (Pacifiers) للأطفال."
      expands:
        - text: "«acesodyne (analgesic)» — المعجم الطبي الموحد"
          source: "المعجم الطبي الموحد"
          addition: "دلالة طبية محددة بالألم."

    - lemma: "مُهَدِّئ"
      confirm:
        - text: "«tranquilizer» — المعجم الموحد لمصطلحات علم الصحة"
          source: "المعجم الموحد لمصطلحات علم الصحة"
      contradicts:
        - text: "«tranquilizer» — المعجم الموحد لمصطلحات علم الصحة"
          source: "المعجم الموحد لمصطلحات علم الصحة"
          conflict: "اللفظ يشير للمهدئات النفسية (Tranquilizers)، وليس لأدوات تهدئة الأطفال."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مُسَكِّتَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«المُسَكِّتة: أداة على شكل حَلْمة يُلَهَّى الطفل بمصّها أو العضّ عليها» — المورد الحديث"
      justification: "مقابل مباشر للمصطلح الإنجليزي pacifier في المعاجم ثنائية اللغة المتخصصة."
    - lemma: "سَكَّاتَة"
      source_section: "step0_headword"
      evidence_citation: "«السّكاتَةُ: ما يُسْكِتُ» — المعجم الكبير"
      justification: "اسم آلة من الجذر س-ك-ت يدل على ما يُسكت الطفل، وهو مصطلح معاصر مستخدم."
  knowledge_candidates:
    - lemma: "مُصَّاصَة"
      justification: "تسمية شائعة للجهاز نظراً لآلية عمله (المص)، وموثقة في المعاجم الحديثة (المورد) كمرادف للهاية."
    - lemma: "لَهَّايَة"
      justification: "آلية: اشتقاق. من الفعل (لهّى) أي سلى وشغل، وهي التسمية الأكثر شيوعاً في الاستعمال المعاصر لهذا المفهوم."

