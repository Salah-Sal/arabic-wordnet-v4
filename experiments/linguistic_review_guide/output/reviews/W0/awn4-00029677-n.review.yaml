step0_evidence:
  per_lemma:
    - lemma: "حَدَث"
      confirm:
        - text: "«الحَدَث: ... الأمر الحادث المنكر غير المعتاد»"
          source: "المعجم الوسيط"
        - text: "«سمّى سيبويه المصدر حَدَثاً، لأن المصادر كلّها أعراض حادثة»"
          source: "المحكم والمحيط الأعظم"
        - text: "«والحَدَثانُ: نُوَبُ الدَّهْرِ، وما يُحْدِثُهُ. واحدها حَدَثٌ.»"
          source: "لسان العرب"
      contradicts:
        - text: "«الحَدَث: دنس حكمي موجب للوضوء أو الغُسل»"
          source: "التعريفات الفقهية للبركتي"
          conflict: "معنى اصطلاحي فقهي يخرج عن الدلالة العامة للحدث كوقوع أمر ما."
        - text: "«الحَدَث: الصغير السن»"
          source: "المعجم الوسيط"
          conflict: "يدل على صفة للإنسان (الحداثة في السن) وليس على مفهوم الواقعة."

