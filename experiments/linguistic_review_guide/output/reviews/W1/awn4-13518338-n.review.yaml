step0_evidence:
  per_lemma:
    - lemma: "تصاعد"
      confirm:
        - text: "«يتصاعد ويصاعد صعد»"
          source: "المعجم الوسيط"
      contradicts:
        - text: "«تصاعده الأمر: شقَّ عليه»"
          source: "المعجم الوسيط"
          conflict: "الدلالة الكلاسيكية تشير إلى المشقة والصعوبة لا مجرد الزيادة"
      expands:
        - text: "«تَصَاعَدَ المادةُ (في الكيمياء): تحوَّلت من الحالة الصُّلْبةِ إلى الحالة الغازية»"
          source: "المعجم الكبير"
          addition: "دلالة فيزيائية تقنية (التسامي)"

    - lemma: "زيادة"
      confirm:
        - text: "«الزيادة: أن ينضم إلى ما عليه الشيء في نفسه شيء آخر»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الزِّيَادَة) مَا زَاد على الشَّيْء»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«زيادة الكبد: زائدتها»"
          source: "المعجم الكبير"

    - lemma: "نمو"
      confirm:
        - text: "«النمو: ازدياد حجم الجسم بما ينضم إليه ويداخله في جميع الأقطار بنسبة طبيعية»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«نَمَا الشَّيْءُ: زَادَ»"
          source: "القاموس المحيط"
        - text: "«نماء المال في التجارة»"
          source: "كتاب العين"
      expands:
        - text: "«النُّمُوُّ الاقتصاديّ: الزِّيادة النَّوعيَّة في دخل الفرد أو في النَّاتج القوميّ»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "دلالة اقتصادية تخصصية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "ازدياد"
      source_section: "step4_fts_keyword"
      evidence_citation: "«النمو: ازدياد جسم باتصال جسم آخر به» — معجم مقاليد العلوم للسيوطي"
      justification: "المصدر الصريح المستخدم لتعريف النمو والزيادة في المعاجم، ويدل على سيرورة الزيادة."
    - lemma: "تزايد"
      source_section: "step4_fts_keyword"
      evidence_citation: "«تزايد الشيء: زاد» — المعجم الكبير"
      justification: "يدل على التدرج في الزيادة وهو ما يناسب كون المفهوم 'عملية' (process)."
  knowledge_candidates:
    - lemma: "تنامي"
      justification: "مصدر يدل على الصيرورة والنمو التدريجي (اشتقاق من ن-م-ي)، شائع جداً في السياقات الفكرية والاقتصادية."
    - lemma: "تعاظم"
      justification: "يدل على التحول إلى 'أكبر' أو 'أهم' (كما ورد في التعريف)، خاصة في السياقات المعنوية والمادية الضخمة."

step1_lemma_validation:
  per_lemma:
    - lemma: "زيادة"
      decision: confirmed
      decision_reason: "اللفظ الجوهري المعبر عن المفهوم، مدعوم بأدلة معجمية قطعية"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام والشامل لكل أنواع الإضافة والمجاوزة، مادية كانت أو معنوية."
      example: "شهدت الصادرات زيادة ملحوظة في الربع الأخير من العام."
    
    - lemma: "نمو"
      decision: confirmed
      decision_reason: "مدعوم بأدلة قوية، ويخص الزيادة في الحجم أو الكثرة بنسبة طبيعية أو مطردة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يرتبط غالباً بالزيادة العضوية أو الاقتصادية المطردة التي تتجه نحو النضج."
      example: "تعد معدلات النمو السكاني تحدياً كبيراً للتنمية المستدامة."

    - lemma: "تصاعد"
      decision: confirmed
      decision_reason: "مقبول في الاستعمال المعاصر للدلالة على الزيادة المتواترة (كأسعار أو توتر)، وإن غلب عليه في التراث معنى الصعود والمشقة."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يوحي باتجاه رأسي أو بزيادة في الوتيرة والحدة (escalation)."
      example: "هناك تخوف دولي من تصاعد التوتر في المنطقة."

    - lemma: "ازدياد"
      source: step05
      decision: confirmed
      decision_reason: "مرادف جوهري مستخدم في تعريف اللمّات الأخرى، ويدل على الحدث المستمر."
      step05_citation: "«النمو: ازدياد حجم الجسم» — المناوي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على صيرورة الزيادة (process aspect) أكثر من النتيجة."
      example: "يؤدي ازدياد الوعي البيئي إلى تغيير سلوك المستهلكين."
      actions:
        - command: create_entry
          params:
            lemma: "ازدياد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13518338-n"

    - lemma: "تزايد"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مستقر يدل على التدرج والمطالبة بالزيادة، وهو ملائم جداً لتعريف 'العملية'."
      step05_citation: "«تزايد الشيء: زاد» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على التدرج والمفاعلة في الزيادة (incremental)."
      example: "يلاحظ تزايد الإقبال على استخدام الطاقة الشمسية في المنازل."
      actions:
        - command: create_entry
          params:
            lemma: "تزايد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13518338-n"

  synset_flags:
    definition_review_needed: false

step3_definition:
  definition_review_flag: false
  current_definition: "عملية التحول إلى أكبر أو أطول أو أكثر عدداً أو أهمية"
  assessment:
    decision: retain
    reason: "التعريف دقيق وشامل، ويتفق مع ما ورد في المعاجم الحديثة والقديمة لوصف النمو والزيادة."

step4_relations:
  hypernymy:
    current_hypernym: "عَمَلِيَّة"
