        - text: "«الظاهرة الاجتماعية: النزوع إلى سلوك محمود أو مذموم، ينتشر بين الناس حتى يعم، وقد يختفي»"
          source: "المعجم الكبير"
          addition: "توسيع المفهوم ليشمل الظواهر الاجتماعية والسلوكية بالإضافة إلى المادية"
        - text: "«مجموعة الصفات الظاهرة للحيوان»"
          source: "المعجم الموحد لمصطلحات علم الأحياء"
          addition: "تخصيص المعنى في سياق علم الأحياء (Phenotype)"

