        - text: "«كل واقعة يمكن إدراكها بالحواس والتجربة»"
          source: "المعجم الكبير"
        - text: "«حادثة يمكن رصدها ووصفها على أساس علمي»"
          source: "المعجم الكبير"
        - text: "«شيء أو مظهر مدرك بالحواس لا بالفكر أو الحدس»"
          source: "المورد الحديث"
