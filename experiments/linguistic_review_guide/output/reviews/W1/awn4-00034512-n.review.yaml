step1_lemma_validation:
  per_lemma:
    - lemma: "ظاهرة"
      decision: confirmed
      decision_reason: "مصطلح مركزي مستقر معجمياً وعلمياً، مدعوم بأدلة صريحة تربطها بالحواس والرصد العلمي."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تختص 'ظاهرة' بوصف الحالة أو العملية في تجليها الخارجي القابل للرصد الإمبيريقي (بالحواس)، مما يميزها عن 'الواقعة' (التي تركز على مجرد الحدوث) و'الحادثة' (التي قد توحي بالعرضية أو المفاجأة)."
      example: "تُعد ظاهرة الكسوف الكلي من أهم الظواهر الطبيعية التي يمكن رصدها وتفسيرها علمياً."

  # المرشحون من الخطوة 0.5
    - lemma: "واقعة"
      source: step05
      decision: removed
      decision_reason: "الواقعة (Occurrence/Fact) تركز على تحقق الحدث ووجوده التاريخي أو الوجودي، بينما يركز المفهوم الحالي (Phenomenon) على الإدراك الحسي والظهور."
      step05_citation: "«في الفلسفة: ما حدث ووجد» — المعجم الوسيط"
    - lemma: "حادثة"
      source: step05
      decision: removed
      decision_reason: "تميل 'حادثة' (Incident/Event) للدلالة على حدث زماني محدد له بداية ونهاية، بينما 'ظاهرة' تشمل الحالات المستمرة والعمليات المنتظمة."
      step05_citation: "«مؤنث الحادث والنائبة» — المعجم الوسيط"

