step0_evidence:
  per_lemma:
    - lemma: "إشهار"
      confirm:
        - text: "«إشهار الخبر»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      contradicts:
        - text: "«إعلان معلومات عن منتوج ما بهدف ترويجه.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          conflict: "يختص بترويج المنتجات التجارية وليس مطلق العرض علانية"
      expands:
        - text: "«الإعلان عن منتوج ما والترويج له.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: "يضيف بعد الدعاية والإعلان الجماهيري"
    - lemma: "عرض"
      confirm:
        - text: "«تقديم عمل ما أمام الجمهور.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«العرض بالسكون: إظهار الشيء بحيث يرى للتوقيف على حاله.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«عرَض الموضوعَ: بَسَطه وطرحه ليُطْلِعَه عليه، أراه إيّاه.»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      expands:
        - text: "«المتاع للبيع: أظهره لذوي الرغبة ليشتروه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "تخصيص العرض لغرض البيع التجاري"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "إظهار"
      source_section: "step4_fts_keyword"
      evidence_citation: "«عَرْض، إظهار» — المعجم الموحد لمصطلحات القانون"
      justification: "ورد كمرادف للعرض في المعاجم، وهو يؤدي معنى الكشف والإبانة للجمهور (اشتقاق من ظهر)."
  knowledge_candidates:
    - lemma: "استعراض"
      justification: "اشتقاق (استفعال) من الجذر 'عرض' للدلالة على العرض المنظم أو المبالغة في العرض للجمهور (كأن يقال استعراض عسكري أو فني)، وهو يطابق معنى exhibiting openly."
  generation_notes: "تم توليد مرادفات تغطي جوانب مختلفة من العرض العلني، مثل الإبانة المطلقة (إظهار) والعرض الاحتفالي المنسق (استعراض)."

