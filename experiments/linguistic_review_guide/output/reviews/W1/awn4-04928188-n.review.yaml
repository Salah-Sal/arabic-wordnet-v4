step0_evidence:
  per_lemma:
    - lemma: "إرث"
      confirm:
        - text: "«أمر قديم متوارث؛ ما يتوارثه الناس عن آبائهم من تراث»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«الأَمْرُ القديم يَتَوَارَثُهُ الآخر عن الأوَّل»"
          source: "المعجم الكبير"
      expands:
        - text: "«ميراث، ما خلَّفه الميِّت لورثته من مال أو ممتلكات ومتاع، تَرِكة»"
          source: "معجم اللغة العربية المعاصرة"
          addition: "يدل على الإرث المادي (التركة) بالإضافة إلى المعنوي."
    - lemma: "ميراث"
      confirm:
        - text: "«الإراث»"
          source: "المعجم الوسيط"
      expands:
        - text: "«مجموع ما يتركه الميت من مال أو حقوق مالية.»"
          source: "المعجم الموحد لمصطلحات القانون"
          addition: "غلبة الاستعمال في الجانب المادي (التركة)."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تراث"
      source_section: "step5_english_bridge"
      evidence_citation: "«مَوْروث مُشترك (فني، ثقافي، أدبي) يحيل على الجذور والمكونات» — المعجم الموحد لمصطلحات اللسانيات"
      justification: "ترجمة دقيقة لمفهوم 'heritage' الإنجليزي وتدل على الممتلكات المعنوية الموروثة (اشتقاق)."
  knowledge_candidates:
    - lemma: "موروث"
      justification: "اشتقاق (اسم مفعول) استُعمل للدلالة على ما يُورث من سمات ثقافية أو جينية، وهو يشمل الممتلكات المعنوية."

step1_lemma_validation:
  per_lemma:
    - lemma: "إرث"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستعمل بكثرة في الدلالة على التركة المادية والمعنوية على حد سواء."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يميل إلى التعبير عن الحالة (المصدرية) والشيء الموروث معاً، ويُستخدم كثيراً في السياقات الثقافية والجينية."
      example: "نعتز بما تركه الأجداد من إرث حضاري عريق."
    - lemma: "ميراث"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومشهور، ورغم غلبته في الإرث المادي (الأموال)، إلا أنه يُستعمل مجازاً للإرث المعنوي."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يغلب استعماله للدلالة على التركة المادية من الأموال والأعيان، بخلاف الإرث والتراث."
      example: "تلقى التلميذ من أستاذه ميراثاً علمياً نفيساً."
    - lemma: "تراث"
      source: step05
      decision: confirmed
      decision_reason: "الكلمة الأنسب والأدق للدلالة على التركة المعنوية (الثقافية، الفنية، الفكرية)."
      step05_citation: "«مَوْروث مُشترك (فني، ثقافي، أدبي) يحيل على الجذور والمكونات» — المعجم الموحد لمصطلحات اللسانيات"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُخصص في الاستعمال المعاصر للإرث الثقافي والمعنوي والحضاري للأمم، ولا يُستعمل للإرث المادي الشخصي."
      example: "تسعى المؤسسات لحفظ التراث الشعبي من الاندثار."
      actions:
        - command: create_entry
          params:
            lemma: "تراث"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04928188-n"
    - lemma: "موروث"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح سليم يعبر عن المعنى، ومستعمل بكثرة كاسم يدل على ما تم توارثه من الأجيال السابقة."
      step05_citation: "اسم مفعول مستعمل"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يُركز على صفة 'وقوع فعل الإرث' على الشيء، ويُستعمل كصفة واسم للإرث الاجتماعي والجيني."
      example: "يتأثر سلوك الفرد بالموروث الثقافي لبيئته."
      actions:
        - command: create_entry
          params:
            lemma: "موروث"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04928188-n"
  added_lemmas:
