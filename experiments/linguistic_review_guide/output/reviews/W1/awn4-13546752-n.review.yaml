step0_evidence:
  per_lemma:
    - lemma: "أداء"
      confirm:
        - text: "«أداء: سلوك الأفراد وفق معايير محدَّدة بغرض تحقيق الأهداف.» — مسرد التربية (ArabTerm)"
          source: "ArabTerm"
        - text: "«أداء: مقياس كمي أو نوعي لمدى كفاءة أو صحة النموذج.» — معجم البيانات والذكاء الاصطناعي (ArabTerm)"
        - text: "«أداء: هو تسليم العين الثابت في الذمة بالسبب الموجب.» — كتاب التعريفات للشريف الجرجاني"
    - lemma: "تشغيل"
      confirm:
        - text: "«تشغيل مُنعزل: مولد يعمل بشكل منعزل في حالة غياب الربط مع شبكة التزويد.» — المعجم الموحد لمصطلحات الطاقة المتجددة"
          source: "ArabTerm"
        - text: "«موازنة التشغيل: functioning budget.» — المعجم الموحد لمصطلحات التجارة والمحاسبة"
          source: "ArabTerm"
    - lemma: "عمل"
      confirm:
        - text: "«العمل: المهنة والفعل... وهو عام في كل فعل يفعل.» — لسان العرب"
          source: "لسان العرب"
        - text: "«العمل: أصل واحد صحيح وهو عام في كل فعل يفعل.» — مقاييس اللغة"
          source: "مقاييس اللغة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "إنجاز"
      source_section: "step5_english_bridge"
      evidence_citation: "«إِنْجاز: مجموع الخاصيات التي تميز نظاما ما... أَدَاء (المرادف العربي).» — المعجم الموحد لتقانة المعلومات"
      justification: "مصطلح تقني مرادف للأداء في سياق تشغيل الأنظمة."
    - lemma: "تأدية"
      source_section: "step5_english_bridge"
      evidence_citation: "«تأدية العمل: functioning.» — المعجم الموحد لمصطلحات علم الأحياء"
      justification: "مقابل مباشر لمصطلح functioning في المعاجم العلمية."
  knowledge_candidates:
    - lemma: "سير"
      justification: "تعبير تراثي ومعاصر مستخدم لوصف آلية وعملية العمل (سير العمل/الآلة) — آلية التوليد: مجاز."
    - lemma: "اشتغال"
      justification: "مصدر يدل على حالة الدخول في العمل أو الاستمرار فيه (اشتغال المحرك) — آلية التوليد: اشتقاق."

step1_lemma_validation:
