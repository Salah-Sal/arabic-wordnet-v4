      example: "تطلب تشغيل المصنع الجديد طاقماً هندسياً متخصصاً."
    - lemma: "عمل"
      decision: "confirmed"
      decision_reason: "اللفظ العام والشامل لكافة أوجه النشاط والتشغيل."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "هو اللفظ الأعم والأشمل للنشاط والقيام بالفعل (functioning/working)."
      example: "يراقب الفنيون عمل التوربينات لضمان استقرار الشبكة الكهربائية."
    - lemma: "إنجاز"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مرادف تقني قوي للأداء والقيام بالعمل."
