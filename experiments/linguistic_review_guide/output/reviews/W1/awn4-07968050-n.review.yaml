step0_evidence:
  per_lemma:
    - lemma: "تجميع"
      confirm:
        - text: "«(2) تجميع (3) تَجَمُّع.» — المورد الحديث"
          source: "المورد الحديث"
        - text: "«تجميع: assemblage» — المعجم الموحد لمصطلحات الجيولوجيا"
          source: "المعجم الموحد لمصطلحات الجيولوجيا"
      expands:
        - text: "«في هندسة الإنشاءات مُصطلح يُقصد به تجميع وتركيب وتثبيت وتوصيل ماكينة، أو تركيب أجزاء مفردة سابقة الصنع بحيث تصبح وحدة تقنية أو آلة جاهزة للعمل» — المعجم الموحد لمصطلحات المياه"
          source: "المعجم الموحد لمصطلحات المياه"
          addition: "يشير إلى الجانب الإجرائي (العملية) بالإضافة إلى النتيجة"

    - lemma: "مجموعة"
      confirm:
        - text: "«لفظ عام يطلق على مجموع عناصر منسجمة تكون وحدة مثل مجموعة المحارف ومجموعة التعليمات وغيرهما» — معجم مصطلحات المعلوماتية"
          source: "معجم مصطلحات المعلوماتية"
        - text: "«مجموعة من الأشياء المتشابهة في خصائصها، والمنظَّمة حسب أوجه التشابه بينها» — معجم البيانات والذكاء الاصطناعي"
          source: "معجم البيانات والذكاء الاصطناعي"
      peripheral_observations:
        - "«عدد من الأشخاص الذين حصل بينهم تفاعل في الأفكار مدة من الزمن...» — مسرد الإعلام والتواصل (بمعنى جماعة اجتماعية)"

    - lemma: "تشكيلة"
      confirm:
        - text: "«الكلمة «تَشْكيلة» اسم مرة مأخوذ من الفعل «شَكَّلَ» بمعنى صوَّر أشكالاً، وقد جاء في الأساسي أن التشكيلة هي عدد متنوع من شيء ما» — معجم الأخطاء الشائعة"
          source: "معجم الأخطاء الشائعة"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تراكم"
      source_section: "step5_english_bridge"
      evidence_citation: "«تراكُم: accumulation» — المعجم الموحد لمصطلحات الجيولوجيا"
      justification: "يرتبط المصطلح مباشرة بأحد المفاهيم المذكورة في التعريف الإنجليزي (accumulation) ويشير إلى تجمع الأشياء فوق بعضها."
    - lemma: "تكدس"
      source_section: "step5_english_bridge"
      evidence_citation: "«تَكَدُّس: aggregation» — المعجم الموحد لمصطلحات الطب البيطري"
      justification: "يستخدم لوصف تجمع العناصر في كتلة واحدة، خاصة في السياقات العلمية."
  knowledge_candidates:
    - lemma: "حشد"
      justification: "آلية: مجاز. يستخدم الحشد أصلاً للناس، ولكنه يستعمل مصطلحاً في العلوم الاجتماعية والفيزيائية لوصف التجمع (aggregation) الكثيف للعناصر."

