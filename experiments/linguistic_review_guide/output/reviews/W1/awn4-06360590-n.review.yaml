step0_evidence:
  per_lemma:
    - lemma: "تَوَاصُل كِتَابِيّ"
      confirm:
        - text: "«تبادل المعلومات أو العواطف بين شخصين أو أكثر بواسطة رسائل مكتوبة.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
    - lemma: "لُغَة مَكْتُوبَة"
      expands:
        - text: "«مجموع عناصر اللغة التي تمر عبر عملية تسجيل خطي مرئي.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يعرّفها من منظور لساني كنظام من العناصر المُسجّلة."
        - text: "«صفة اللغة الأدبية الرسمية التي تقابل اللغة الشعبية الشفهية.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: "يضيف بُعداً تقابلياً مع اللغة الشفهية/العامية، مشيراً إلى دلالة الفصحى."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "اتِّصَال كِتَابِيّ"
      source_section: "step5_english_bridge"
      evidence_citation: "«اتصال كتابي، تواصُل كتابي» — مسرد الإعلام والتواصل"
      justification: "تركيب وصفي مسجّل معجمياً كمرادف مباشر لـ (تواصل كتابي)، ويؤدي نفس الغرض الدلالي في نقل الرسائل."
  knowledge_candidates:
    - lemma: "مُخَاطَبَة كِتَابِيَّة"
      justification: "تركيب وصفي يعبّر عن نقل المعاني والأفكار كتابةً بين طرفين، مألوف في السياقات الإدارية والعملية."
  generation_notes: "تركز معظم المصطلحات في هذا المجال على الجمع بين لفظة (تواصل / اتصال / لغة) ووصف (مكتوب / كتابي)."

