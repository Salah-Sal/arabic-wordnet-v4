      nuance_differentiation: "يركز على بنية النظام الرمزي (Language) المسجّل خطياً، وقد يحمل دلالة فرعية تشير إلى لغة الأدب والتدوين."
      example: "تتميز اللغة المكتوبة بقواعد أكثر صرامة وتماسكاً من لغة الحديث اليومي."
      actions: []

    - lemma: "اتِّصَال كِتَابِيّ"
      source: step05
      decision: confirmed
      decision_reason: "مرادف شائع ومسجل لمعنى (تواصل كتابي) ومستعمل بكثرة في الأدبيات الإعلامية."
      step05_citation: "«اتصال كتابي، تواصُل كتابي» — مسرد الإعلام والتواصل"
      mwe_check:
        is_mwe: true
        accepted: true
        type: "وصفي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مرادف لـ (تواصل كتابي)، ولكن قد يميل (اتصال) إلى الإرسال من طرف واحد، بينما (تواصل) يوحي بتفاعل متبادل."
      example: "طوّرت المؤسسة قنوات الاتصال الكتابيّ بين مختلف أقسامها الإدارية."
      actions:
        - command: create_entry
          params:
            lemma: "اتِّصَال كِتَابِيّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06360590-n"

    - lemma: "مُخَاطَبَة كِتَابِيَّة"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر يغلب عليه الطابع السياقي الإداري، وليس مصطلحاً مسكوكاً ثابتاً في المعاجم قياساً باللمّات الأخرى."
