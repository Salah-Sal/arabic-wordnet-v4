step0_evidence:
  per_lemma:
    - lemma: "عشيرة"
      confirm:
        - text: "«مجموعة من الأفراد تنتمي إلى نوع معين أو فئة ما لها القدرة على التزاوج فيما بينها.» — المعجم الموحد لمصطلحات علم الوراثة (2009)"
      expands:
        - text: "«مجموعة من البشر ينتمي كل منهم، وراثيا أو عن طريق التزاوج، إلى كل عضو آخر في المجموعة.» — المعجم الموحد لمصطلحات علم الوراثة (2009)"
      contradicts:
        - text: "«عشيرةُ الرَّجُلِ: بنو أبيه الأقربون وقبيلتُه» — المعجم الوسيط"
          conflict: "المعنى اللغوي مقصور على القرابة البشرية، بينما تعريف المجموعة يخص الكائنات الحية عموماً"
    - lemma: "مجموعة سكانية"
      confirm:
        - text: "«وفرة: عدد الكائنات الحية في مجموعة سكانية، تجمع بين 'الكثافة' (عدد الأفراد داخل المناطق المأهولة) و 'الانتشار'» — مسرد المناخ والبيئة، المنظمة العربية للتربية والثقافة والعلوم"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جماعة"
      source_section: "step5_english_bridge"
      evidence_citation: "«علم بيئة الجماعة — population ecology» — المَكنَز الزراعي متعدد اللغات"
      justification: "استعمال معجمي موثق كمرادف لـ population في علم البيئة."
  knowledge_candidates:
    - lemma: "جماعة أحيائية"
      justification: "تركيب وصفي: تخصيص لكلمة 'جماعة' بالصفة 'أحيائية' لتجنب اللبس مع الجماعات البشرية والسياسية، وهو المصطلح الأكثر استقراراً في المناهج الأكاديمية للدلالة على biological population."
  generation_notes: "في علم البيئة والبيولوجيا، يُعد مصطلح 'جماعة أحيائية' المعيار الأكاديمي الأكثر دقة واستقراراً، في حين يُستعمل 'عشيرة' بكثرة في علم الوراثة."

step1_lemma_validation:
  per_lemma:
    - lemma: "عشيرة"
      decision: confirmed
      decision_reason: "مصطلح معتمد علمياً ومستقر في مجالات علم الوراثة والبيولوجيا كإزاحة دلالية مجازية من معناها اللغوي الأصلي."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُستخدم بكثرة في سياق علم الوراثة (مثل: وراثة العشائر Population Genetics) وتشير غالباً لمجموعة تتزاوج فيما بينها."
      example: "أدت التغيرات البيئية إلى تناقص أعداد هذه العشيرة الحيوانية."
    
    - lemma: "مجموعة سكانية"
      decision: confirmed
      decision_reason: "استعمال شائع لترجمة population، ورغم أنه يغلب على التجمعات البشرية إلا أنه يُستعمل علمياً لبقية الكائنات."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "أكثر ارتباطاً بالدراسات الديموغرافية والإحصائية، ويغلب تخصيصه للبشر رغم اتساع دلالته."
      example: "يدرس علماء البيئة تأثير التلوث على المجموعة السكانية لأسماك السلمون."

    - lemma: "جماعة أحيائية"
      source: step05
      decision: confirmed
      decision_reason: "المصطلح المعياري والدقيق في علم البيئة لتمثيل التجمع البيولوجي لأفراد النوع الواحد."
      step05_citation: "المعرفة الأكاديمية اللغوية (تخصيص لمصطلح 'الجماعة' الوارد في المعاجم)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "الخيار الفصيح والأدق دلالياً في السياق الأكاديمي والبيئي للإشارة الشاملة لمجموعات الكائنات الحية غير البشرية."
      example: "تُعد الجماعة الأحيائية الوحدة الأساسية لدراسة التفاعلات البيئية."
      actions:
        - command: create_entry
          params:
            lemma: "جماعة أحيائية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08195659-n"

    - lemma: "جماعة"
      source: step05
      decision: removed
      decision_reason: "كلمة عامة جداً وتحمل دلالات واسعة (سياسية واجتماعية)، استخدامها منفردة قد يسبب لبساً رغم ورودها في مركبات (علم بيئة الجماعة)."
      step05_citation: "«علم بيئة الجماعة — population ecology» — المَكنَز الزراعي متعدد اللغات"

  synset_flags:
    definition_review_needed: false
    split_needed: false
  added_lemmas:
    - lemma: "جماعة أحيائية"
      reason: "مصدر: الخطوة ٠٫٥ — المصطلح البيئي المعياري"
      via_command: create_entry + add_sense

