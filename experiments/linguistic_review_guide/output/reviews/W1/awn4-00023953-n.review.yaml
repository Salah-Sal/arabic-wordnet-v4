step0_evidence:
  per_lemma:
    - lemma: "حافز"
      confirm:
        - text: "«(في علم النفس) drive: نشاط داخليّ في الكائن الحيّ، أو فى عُضْوِ من أعضائِهِ، يجعله مُهَيَّئًا للاستِجابَةِ لِمُثِيرٍ مُعَيَّنٍ» — المعجم الكبير"
        - text: "«الحاث على الشيء» — موسوعة السلطان قابوس"
      expands:
        - text: "«مقابِل ماليّ يُمنَحُ للعامل تشجيعًا لإتْقانِهِ العَمَلَ أو لزيادة الإنتاج» — المعجم الكبير"
          addition: "دلالة مادية (حافز مالي) تتجاوز المعنى النفسي المحض"

    - lemma: "دافع"
      confirm:
        - text: "«(في الفلسفة) mobile: الداعي، وماله يختار القادرُ الفعلَ. وهو العاملُ الخاصُّ بالإنسانِ والمَوْقِفِ» — المعجم الكبير"
        - text: "«حالة داخلية جسمية أو نفسية تدفع الفرد نحو سلوك في ظروف معينة وتوجهه نحو إشباع حاجة أو هدف محدد» — مسرد التربية (ArabTerm)"
        - text: "«القوة الداخلية التي تنشط النزوع عند الإنسان» — معجم الحكامة التربوية"

    - lemma: "دافعية"
      confirm:
        - text: "«دافعية: motivation» — المعجم الموحد لمصطلحات الحكامة التربوية"
        - text: "«تحفيز ذاتي دافعية ذاتية: self-motivation» — مسرد التربية (ArabTerm)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تحفيز"
      source_section: "step5_english_bridge"
      evidence_citation: "«تحفيز: motivation» — المعجم الموحد لمصطلحات اللسانيات / AGROVOC"
      justification: "مصطلح تقني شائع في علم النفس والإدارة للإشارة إلى عملية التنشيط والتحريك النفسي."
    - lemma: "باعث"
      source_section: "step5_english_bridge"
      evidence_citation: "«باعث: motive» — المورد الحديث / المعجم الموحد لمصطلحات القانون"
      justification: "يُستخدم للإشارة إلى الغاية أو السبب الذي يدعو الشخص للقيام بفعل معين."
  knowledge_candidates:
    - lemma: "محرّك"
      justification: "يُستخدم استعارياً (آلية التوليد: مجاز) للإشارة إلى القوة الدافعة للسلوك (المحرّك النفسي)."

step1_lemma_validation:
  per_lemma:
    - lemma: "حافز"
      decision: confirmed
      decision_reason: "مدعوم بأدلة معجمية نفسية وتراثية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز غالباً على المثير الخارجي أو المكافأة التي تحث على العمل (Incentive)."
      example: "تعتمد الشركات نظام الحوافز المادية لرفع دافعية الموظفين."

    - lemma: "دافع"
      decision: confirmed
      decision_reason: "مصطلح مركزي في الحقل الدلالي ومدعوم بقوة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى الحالة الداخلية والجسمية التي تسبق السلوك (Drive/Motive)."
      example: "يُعد دافع الجوع من أقوى الدوافع الفسيولوجية التي تثير سلوك الكائن الحي."

    - lemma: "دافعية"
      decision: confirmed
      decision_reason: "مصطلح حديث مستقر في علم النفس التربوي."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبر عن الاستعداد النفسي العام والمستمر للفرد نحو تحقيق الأهداف (Motivation)."
      example: "تهدف الاستراتيجيات التعليمية الحديثة إلى تعزيز الدافعية الذاتية لدى الطلاب."

    - lemma: "تحفيز"
      source: step05
      decision: confirmed
      decision_reason: "مرادف تقني مستقر وعالمي لمفهوم Motivation."
      step05_citation: "«تحفيز: motivation» — المعجم الموحد لمصطلحات اللسانيات"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير غالباً إلى الفعل أو العملية (Process) التي تؤدي إلى إثارة الدوافع."
      example: "يلعب القائد دوراً محورياً في تحفيز أعضاء الفريق لبلوغ الأهداف المشتركة."
      actions:
        - command: create_entry
          params:
            lemma: "تحفيز"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00023953-n"

    - lemma: "باعث"
      source: step05
      decision: confirmed
      decision_reason: "مرادف فلسفي وقانوني دقيق لمفهوم Motive."
      step05_citation: "«باعث: motive» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على السبب الذهني أو الغاية الأخلاقية وراء الفعل."
      example: "حققت الشرطة في الباعث وراء الجريمة لتحديد العقوبة المناسبة."
      actions:
        - command: create_entry
          params:
            lemma: "باعث"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00023953-n"

    - lemma: "محرّك"
      source: step05
      decision: removed
      decision_reason: "استعمال مجازي غير متمحور دلالياً حول المفهوم النفسي المجرد بمفرده (يحتاج تقييداً)."
      step05_citation: "استنتاج لغوي"

