      source_section: "step5_english_bridge"
      evidence_citation: "«قشرة الكترونية» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      justification: "مصطلح تقني معتمد في معاجم الفيزياء ترجمةً لـ electron shell."
    - lemma: "طبقة إلكترونية"
      source_section: "step5_english_bridge"
