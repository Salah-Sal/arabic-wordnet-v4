      justification: "مصطلح معتمد في المعاجم الكيميائية."
  knowledge_candidates:
    - lemma: "غلاف إلكتروني"
      justification: "تركيب وصفي يجمع بين (غلاف) للإحاطة والنسبة (إلكتروني)، وهو الأكثر شيوعاً في المقررات التعليمية (توليد بالتركيب)."
  generation_notes: "المصطلحات (غلاف، قشرة، طبقة) تتناوب في التعبير عن المفهوم العلمي."

step1_lemma_validation:
  per_lemma:
    - lemma: "غلاف إلكتروني"
      decision: confirmed
      decision_reason: "مصطلح تقني مستقر وشائع في المقررات العلمية كترجمة لـ electron shell."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "الغلاف (shell) يشير إلى مستويات الطاقة الرئيسية التي تحتوي على مدارات فرعية."
      example: "تتوزع الإلكترونات حول نواة الذرة في أغلفة إلكترونية تمثل مستويات طاقة مختلفة."

    - lemma: "مدار إلكتروني"
      decision: removed
      decision_reason: "عدم الدقة العلمية؛ المدار (orbit/orbital) يمثل حيزاً محدداً أو مساراً ضمن الغلاف، بينما الغلاف (shell) هو المجموعة الأشمل."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
      nuance_differentiation: "المدار يعبر عن حيز وجود الإلكترون وليس مستوى الطاقة الرئيسي للغلاف."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "قشرة إلكترونية"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح معتمد في المعاجم الفيزيائية كمرادف للغلاف الإلكتروني."
      step05_citation: "«قشرة الكترونية» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مرادف تام لـ 'غلاف إلكتروني'، ويُفضل استخدامه في بعض السياقات الفيزيائية لترجمة (shell)."
      example: "تتسع القشرة الإلكترونية الأولى لإلكترونين كحد أقصى."
      actions:
        - command: create_entry
          params:
            lemma: "قشرة إلكترونية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07976273-n"

    - lemma: "طبقة إلكترونية"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح معتمد في المعجم الكيميائي."
      step05_citation: "«طبقة الكترونية» — المعجم الموحد لمصطلحات الكيمياء (1992)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مرادف يستخدم بكثرة في الأدبيات الكيميائية لترجمة (shell)."
      example: "تملأ الإلكترونات الطبقة الإلكترونية الأقرب للنواة أولاً."
      actions:
        - command: create_entry
          params:
            lemma: "طبقة إلكترونية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07976273-n"

  added_lemmas:
