step0_evidence:
  per_lemma:
    - lemma: "تقاطع"
      confirm:
        - text: "«تقاطع منظومتين يتمثل في مجموع العناصر المشتركة بين المنظومتين.» — مسرد المناخ والبيئة (ArabTerm)"
          source: "ArabTerm"
        - text: "«تجسيد نقطة من مستوٍ بتقاطع اتجاهين» — المعجم الموحد لمصطلحات الهندسة المدنية"
          source: "ArabTerm"
        - text: "«(ر): intersection.» — المعجم الموحد لمصطلحات الرياضيات والفلك"
          source: "ArabTerm"
      contradicts:
        - text: "«الشَّيْء بَان بعضه من بعض وَالْقَوْم هجر بَعضهم بَعْضًا» — المعجم الوسيط"
          source: "المعجم الوسيط"
          conflict: "المعنى اللغوي الأصلي (الهجر والبين) يختلف عن المفهوم الرياضي المعاصر"
      expands:
        - text: "«التقاء مستو بين تيارين للسّير يُكوّنان بينهما زاوية محسوسة» — المعجم الموحد لمصطلحات النقل"
          source: "ArabTerm"
          addition: "تخصيص المفهوم لمجال النقل وهندسة الطرق"

