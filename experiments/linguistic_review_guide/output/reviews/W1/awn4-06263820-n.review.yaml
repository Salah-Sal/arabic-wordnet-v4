step0_evidence:
  per_lemma:
    - lemma: "رسالة"
      confirm:
        - text: "«ما يُرْسَلُ, أَوْ: ما يَحْمِلُه الرَّسُولُ»"
          source: "المعجم الكبير"
        - text: "«الوِسَاطَةُ بَيْنَ المُرْسِلِ والمُرْسَلِ إِلَيْهِ في إِيصالِ الأَخْبَارِ»"
          source: "المعجم الكبير"
        - text: "«معلومات مكتوبة أو منطوقة يريد المتكلم أن يتقاسمها مع مخاطب معين.»"
          source: "مسرد الإعلام والتواصل"
      expands:
        - text: "«بَحْثٌ مُبْتَكَرٌ يُقَدِّمُه طالِبُ الدِّراساتِ العُلْيَا لِنَيْلِ دَرَجَةٍ جامِعِيَّةٍ عالِيةٍ»"
          source: "المعجم الكبير"
          addition: "استخدام المصطلح للدلالة على الأطروحة الأكاديمية"
        - text: "«ديوان الرسائل: الديوانُ الذى كانت تَصْدُرُ عنه مُكاتباتُ السلطان الرسميَّة»"
          source: "المعجم الكبير"
          addition: "الارتباط الإداري والتاريخي بالمكاتبات السلطانية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "خِطَاب"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الكلام الرِّسالَةُ (فى مجالاتِ الدِّراساتِ اللُّغَوِيّة والفَلْسَفِيّة): الكلامُ ــــ أو اللغَة ــــ فـى استخدامٍ فِعْلِىّ لا باعتِبارها نِظامًا مُجَرَّدًا» — المعجم الكبير"
      justification: "الخطاب يتقاطع دلالياً مع الرسالة المنطوقة أو المكتوبة، ويدل على التوجيه المقصود للمعلومات نحو الآخرين."
  knowledge_candidates:
    - lemma: "بَلَاغ"
      justification: "اشتقاق من الجذر (ب-ل-غ)، ويدل على ما يُبلَّغ ويُوصل من أخبار أو معلومات إلى الآخرين، سواء كان مكتوباً أو منطوقاً."
  generation_notes: "تم توليد مرادفات تتناسب مع التعريف الذي يغطي أشكال التواصل الموجز المنطوق أو المكتوب."

step1_lemma_validation:
  per_lemma:
    - lemma: "رسالة"
      decision: confirmed
      decision_reason: "مصطلح فصيح وأساسي ومطرد للاستخدام في التعبير عن التواصل المكتوب أو المنطوق الموجه."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الرسالة تدل غالباً على محتوى التواصل بحد ذاته وتتميز بكونها مسجلة وموجهة بشكل شخصي أو رسمي."
      example: "تلقيت رسالة نصية من زميلي يخبرني فيها بموعد الاجتماع القادم."
    
    - lemma: "خِطَاب"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مستقر وفصيح يغطي الجانب المنطوق أو المكتوب الرسمي من التواصل الموجه."
      step05_citation: "«الكلام الرِّسالَةُ» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الخطاب يميل ليكون أطول وأكثر رسمية من الرسالة، وقد يغلب عليه الطابع الشفهي أو التوجيهي العام، ولكنه يُطلق على المكتوب أيضاً."
      example: "ألقى المدير خطاباً شاملاً وضح فيه رؤية الشركة المستقبلية للموظفين."
      actions:
        - command: create_entry
          params:
            lemma: "خِطَاب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06263820-n"

    - lemma: "بَلَاغ"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح يدل على الرسالة الرسمية أو الإخبارية الموجهة للعموم."
      step05_citation: "«ما بلَغَك من خبرٍ ونحوه» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "البلاغ يتميز بطابعه الإخباري أو التوجيهي الرسمي، وغالباً ما يكون موجهاً من جهة عليا لعامة الناس لإعلامهم بأمر ما."
      example: "أصدرت وزارة الداخلية بلاغاً رسمياً يوضح الإجراءات الأمنية الجديدة."
      actions:
        - command: create_entry
          params:
            lemma: "بَلَاغ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06263820-n"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "خِطَاب"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "بَلَاغ"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

