  assessment:
    decision: revise
    reason: "التعريف الأصلي يمثل ترجمة شبه حرفية (تواصل مكتوب أو منطوق)، ويمكن تحسينه ليصاغ بأسلوب المعجم العربي ليعبر عن نقل المعلومة."
