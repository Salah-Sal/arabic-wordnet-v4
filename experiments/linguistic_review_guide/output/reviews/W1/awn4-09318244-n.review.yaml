step0_evidence:
  per_lemma:
    - lemma: "نبتة"
      confirm:
        - text: "«النَّبْتَةُ: الواحدة من النبات.» — تاج العروس"
          source: "تاج العروس"
        - text: "«نبتة: (نت) ما ينبت من الأرض.» — معجم اللغة العربية المعاصرة"
          source: "معجم اللغة العربية المعاصرة"
      expands:
        - text: "«النبتة: حالة النبات التي ينبت عليها.» — المعجم الوسيط"
          source: "المعجم الوسيط"
          addition: "تشير إلى الهيئة أو الحالة لا الذات فقط."

    - lemma: "نمو"
      confirm:
        - text: "«(1) أ- نماء؛ نموّ... (2) أ- نامية؛ شيء نامٍ.» — المورد الحديث"
          source: "المورد الحديث"
        - text: "«نمو: عملية نمو أو تطور، مع زيادة في الحجم أو في عدد.» — ArabTerm"
          source: "ArabTerm"
      contradicts:
        - text: "«النمو: ازدياد حجم الجسم بما ينضم إليه...» — كتاب التعريفات"
          source: "كتاب التعريفات"
          conflict: "يركز على العملية (الازدياد) وليس على الشيء الناتج (النامية)."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نامية"
      source_section: "step5_english_bridge"
      evidence_citation: "«(2) أ- نامية؛ شيء نامٍ.» — المورد الحديث"
      justification: "ترجمة دقيقة لمفهوم 'something grown or growing' وتستخدم كاسم للشيء الناتج عن النمو."
    - lemma: "نابتة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«نابتة: غلام أو فتاة جاوزا حد الصغر... ناشئة؛ نبتت لهم نابتة أي نشأ فيهم نشء صغار.» — معجم اللغة العربية المعاصرة"
      justification: "تدل على النشء الجديد أو الشيء الذي بدأ في الظهور والنمو."
  knowledge_candidates:
    - lemma: "نبت"
      justification: "اسم جنس جمعي لما يخرج من الأرض من النوامي، وهو الوصف العربي الأصيل للشيء الذي ينمو (المنتج)."
  generation_notes: "التعريف يركز على الكيان الناتج عن النمو (product) لا العملية (process). تم اختيار مرشحات تغطي الجانب المادي للنمو."

step1_lemma_validation:
  per_lemma:
    - lemma: "نبتة"
      decision: "confirmed"
      decision_reason: "مصطلح أصيل ومستقر للشيء الناتج عن النمو النباتي."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تخص الشيء النامي من عالم النبات أو ما يشبهه في الهيئة."
      example: "غرس البستاني نبتة صغيرة في وسط الحديقة."

    - lemma: "نمو"
      decision: "confirmed"
      decision_reason: "مقبولة لدلالتها على الكتلة الناتجة عن النمو في السياقات العلمية (كالنمو الفطري)."
      evidence_assessment:
        case: "mixed"
        notes:
          - "تستخدم غالباً للعملية، لكنها مستقرة في العربية الحديثة للدلالة على النتاج المادي أيضاً."
      substitution_test:
        result: "pass"
      nuance_differentiation: "تستخدم كاسم جنس يدل على الحالة الناتجة أو الكتلة المتكونة (مثل نمو الشعر أو الطحالب)."
      example: "لوحظ نمو كثيف للطحالب على سطح مياه البحيرة."

    - lemma: "نامية"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مقابل دقيق وشامل لتعريف المجموعة (شيء نامٍ)."
      step05_citation: "«نامية؛ شيء نامٍ.» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تؤكد على صفة النمو والنشوء المستمر في الكيان."
      example: "يعمل العلماء على دراسة كل نامية تظهر في هذه البيئة القاسية."
      actions:
        - command: "create_entry"
          params:
            lemma: "نامية"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09318244-n"

    - lemma: "نابتة"
      source: "step05"
      decision: "confirmed"
      decision_reason: "تدل على الشيء الذي بدأ بالظهور والنمو (sprout/growth)."
      step05_citation: "«الحال التي ينبت عليها الشيء... نبتت لهم نابتة.» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تستخدم للدلالة على النشء الجديد أو البروز الأول للشيء النامي."
      example: "كانت تلك النابتة الخضراء أول علامة على عودة الحياة إلى الأرض المحروقة."
      actions:
        - command: "create_entry"
          params:
            lemma: "نابتة"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09318244-n"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "نامية"
      reason: "مرشح من الخطوة 0.5 - تعبير دقيق عن مفهوم الشيء النامي."
      via_command: "create_entry + add_sense"
    - lemma: "نابتة"
      reason: "مرشح من الخطوة 0.5 - تدل على النتاج الأولي للنمو."
      via_command: "create_entry + add_sense"

