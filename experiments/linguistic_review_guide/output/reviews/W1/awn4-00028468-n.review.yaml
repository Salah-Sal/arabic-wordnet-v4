      justification: "وردت في الجسر الإنجليزي والمعاجم كمرادف مباشر لمصطلح (Time)، وهي أداة التعبير عن المدة الزمنية المطلقة (الاشتقاق من نفس الجذر ز-م-ن)."
  knowledge_candidates:
    - lemma: "دهر"
      justification: "من المجاز والتوسع الدلالي: يطلق على الزمان الممتد والمدة الطويلة التي تحوي الأحداث المتعاقبة."
  generation_notes: "تم استبعاد (أمد) و(مدة) كمرشحات أساسية لأنهما غالبا ما يدلان على أجزاء أو فترات من الزمن وليس على الزمن كمفهوم مطلق ومتواصل كما ورد في التعريف."

