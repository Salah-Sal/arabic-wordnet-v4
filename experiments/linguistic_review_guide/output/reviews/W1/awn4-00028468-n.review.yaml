step0_evidence:
  per_lemma:
    - lemma: "زمن"
      confirm:
        - text: "«(الزَّمن) الزَّمَان (ج) أزمان وأزمن»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الزَّمَانُ. يُقَال: خَلَا زَمْنٌ فَزَمْنٌ»"
          source: "المعجم الكبير"
        - text: "«الزَمَنُ والزَمانُ: اسمٌ لقليل الوقت وكثيره، ويجمع على أَزمانِ وأَزْمِنَةٍ وأَزْمُنٍ.»"
          source: "تاج اللغة وصِحاح العربية للجوهري"
      expands:
        - text: "«مقولة نحوية ترتبط عموما بالفعل وتعبر عن مختلف تصنيفات الزمن الحقيقي أو الطبيعي.و التصنيف الشائع هو الذي يقابل الحاضر (الآن) مع غير الحاضر الذي يمكن أن يكون الماضي قبل الآن أو المستقبل بعد الآن.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يضيف البعد اللساني وتقسيم الزمان إلى ماض وحاضر ومستقبل، وهو ما يعكس جوهر تعريف المجموعة الترادفية."
        - text: "«بعد فيزيائي بحسب نظرية النسبية الخاصة، ويروم ترتيب الأحداث سواء أكان نفسيا أو فيزيائيا أو تحليليا.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
          addition: "يضيف البعد الفيزيائي لتسلسل وترتيب الأحداث."
    - lemma: "وقت"
      confirm:
        - text: "«الوَقْتُ: المِقْدارُ من الدَّهْرِ»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«الوقت: المقدار المحدود من الزمن.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«(الْوَقْت) مِقْدَار من الزَّمَان قدر لأمر مَا»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"

step05_lemma_generation:
