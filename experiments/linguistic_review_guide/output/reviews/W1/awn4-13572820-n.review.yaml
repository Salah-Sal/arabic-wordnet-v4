step0_evidence:
  per_lemma:
    - lemma: "عملية عكوسة"
      confirm:
        - text: "«عملية قابلة للإرجاع إلى البداية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
      expands:
        - text: "«تُعتبر عملية ما قابلة للانعكاس عندما يطرأ على أجزاء من النظام تغيّرات مُتناهية الصغر، لا تتسبب في إحداث إنتروبيا أو تبديد للطاقة.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "يربط المفهوم بالديناميكا الحرارية (الإنتروبيا وتبديد الطاقة)."

step05_lemma_generation:
  knowledge_candidates:
    - lemma: "عملية عكسية"
      justification: "تُستخدم أحياناً كمرادف لـ 'reversible process' في السياقات العلمية العامة، وإن كانت تشير بدقة أكبر إلى 'inverse process'. آلية التوليد: اشتقاق (نعت)."
    - lemma: "عملية قابلة للانعكاس"
      justification: "تعبير اصطلاحي شائع جداً في الفيزياء والكيمياء لوصف المفهوم، وورد كجزء من التعريف في المعاجم المتخصصة. آلية التوليد: تركيب وصفي."
  generation_notes: "المصطلح 'عكوس' هو الأوزن لغوياً في الفيزياء العربية الحديثة للتعبير عن القابلية للانعكاس (reversibility)."

step1_lemma_validation:
  per_lemma:
    - lemma: "عملية عكوسة"
      decision: confirmed
      decision_reason: "مصطلح تقني مستقر في الفيزياء والطاقة المتجددة كما ثبت في المعاجم الموحدة."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح الأكثر دقة وتخصصاً لوصف العملية التي تعود لحالتها الابتدائية دون فقد في الطاقة."
      example: "تُعد دورة كارنو الحرارية نموذجاً نظرياً لعملية عكوسة مثالية."
    - lemma: "عملية عكسية"
      source: step05
      decision: removed
      decision_reason: "تُستخدم غالباً بمعنى 'inverse process' (مثل العمليات الحسابية) مما قد يسبب خلطاً دلالياً في السياق الفيزيائي الدقيق."
      substitution_test:
        result: "fail"
      nuance_differentiation: "تمثل العلاقة التقابلية بين عمليتين (مثل الذوبان والترسيب) وليس بالضرورة استرداد الحالات الفيزيائية للنظام."
    - lemma: "عملية قابلة للانعكاس"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي حر (compositional) يعمل كشرح للمصطلح أكثر من كونه وحدة معجمية مسكوكة."
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير تفسيري للمصطلح 'عكوسة'."

