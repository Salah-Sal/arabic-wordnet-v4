step0_evidence:
  per_lemma:
    - lemma: "نظام"
      confirm:
        - text: "«يُمثّل النظام مجالاً فيزيائياً مُحدّداً، تُتاح فيه دراسة الخواص الدينامية الحرارية. وهناك أنواع مُختلفة من الأنظمة (مفتوح، ومغلق، ومعزول، ...إلخ)»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«نظام: system (Chemistry)»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
        - text: "«نظام (ن): system (Physics)»"
          source: "المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      expands:
        - text: "«شروط تغيير: (فز) عدد من الشروط التي تحدِّد نظامًا فيزيائيًّا أو كيميائيًّا يمكن تغييره اعتباطيًّا بدون إفساد حالة توازن النّظام.»"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«نقطة ثلاثية: النقطة التي يوجد عندها ثلاثة أطوار في حالة توازن»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يؤكد ارتباط المفهوم (أطوار في حالة توازن) بمصطلح النظام عبر سياق النقطة الثلاثية"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جُمْلَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«جُمْلَة، جِهَاز: system» — المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      justification: "تُستخدم 'جملة' كمرادف تقني لـ 'نظام' (system) في الفيزياء والكيمياء، خاصة في المدارس العلمية المتأثرة بالفرنسية (système)، وهي شائعة في المراجع العلمية العربية."
  knowledge_candidates:
    - lemma: "مَنْظُومَة"
      justification: "آلية التوليد: اشتقاق. تُستخدم 'منظومة' في العلم المعاصر للدلالة على مجموعة العناصر المترابطة التي تشكل وحدة واحدة، وهي مرادف شائع للنظام."

step1_lemma_validation:
  per_lemma:
    - lemma: "نظام"
      decision: confirmed
      decision_reason: "مصطلح تقني موحد ومعتمد في مجالات الكيمياء والفيزياء والطاقة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ الأكثر شيوعاً واطّراداً في المعاجم التقنية العربية الموحدة (أليكسو) لتمثيل المفهوم الفيزيائي والكيميائي."
      example: "تعتبر الأسطوانة والمكبس في محرك السيارة نظاماً دينامياً حرارياً مغلقاً."

    - lemma: "جُمْلَة"
      source: step05
      decision: confirmed
      decision_reason: "مرادف تقني مستعمل بكثرة في المراجع الفيزيائية والكيميائية (خاصة في الشام والمغرب العربي)."
      step05_citation: "«جُمْلَة، جِهَاز: system» — المعجم الموحد لمصطلحات علم الصيدلة (2009)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُستخدم غالباً في سياقات 'الجملة الكيميائية' أو 'الجملة الفيزيائية' للدلالة على الوسط المدروس، وتكافئ 'نظام' تماماً في هذا السياق."
      example: "تصل الجملة الكيميائية إلى حالة التوازن عندما تثبت تراكيز المواد المتفاعلة والناتجة."
      actions:
        - command: create_entry
          params:
            lemma: "جملة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-15005742-n"

    - lemma: "مَنْظُومَة"
      source: step05
      decision: removed
      decision_reason: "على الرغم من صحتها اللغوية، إلا أنها تُستخدم عادة للأنظمة الأكثر تعقيداً (شبكات، أنظمة إدارية) بدلاً من عينة مادة بسيطة في مختبر الكيمياء الفيزيائية."
      step05_citation: "«منظومة؛ شبكة: system» — المورد الحديث (2008)"

