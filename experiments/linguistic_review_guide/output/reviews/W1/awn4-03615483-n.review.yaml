step0_evidence:
  per_lemma:
    - lemma: "تذكار"
      confirm:
        - text: "«التَّذكار: شيء يُحتفظ به [أو هديّة تقدَّم] للذكرى.» — المورد الحديث"
          source: "المورد الحديث"
        - text: "«قَدَّمَ له هدية على سبيل التَّذْكار» — معجم الصواب اللغوي"
          source: "معجم الصواب اللغوي"
      expands:
        - text: "«تذكار صيد [كجلد الأسد أو رأسه]» — المورد الحديث"
          source: "المورد الحديث"
          addition: "تخصيص المعنى ليشمل تذكارات الصيد (Trophy)"

    - lemma: "هدية تذكارية"
      confirm:
        - text: "«قَدَّمَ له هدية على سبيل التَّذْكار» — معجم الصواب اللغوي"
          source: "معجم الصواب اللغوي"
          # النص يذكر هدية مرتبطة بالتذكار مما يؤيد شيوع التركيب كبنية اصطلاحية.

step05_lemma_generation:
  evidence_candidates:
    - lemma: "أثر"
      source_section: "step5_english_bridge"
      evidence_citation: "«أثر من عادة قديمة أو مُعْتَقَدٍ بالٍ» — المورد الحديث"
      justification: "يرد كمقابل لـ relic، ويشمل الأشياء المادية المتبقية ذات القيمة التاريخية أو العاطفية."
    - lemma: "ذخيرة"
      source_section: "step5_english_bridge"
      evidence_citation: "«الذخيرة: أثر مقدس [لصلته بقديس أو شهيد]» — المورد الحديث"
      justification: "يرد كمقابل لـ relic في السياق الديني/العاطفي."
  knowledge_candidates:
    - lemma: "تحفة"
      justification: "تُطلق أحياناً على الأشياء الثمينة أو النادرة التي تُقتنى لقيمتها الفنية أو الذكرى المرتبطة بها (آلية التوليد: مجاز)."
    - lemma: "مقتنى"
      justification: "اسم مفعول من اقتنى، يُستخدم للأشياء التي يمتلكها الشخص ويحتفظ بها (آلية التوليد: اشتقاق)."

step1_lemma_validation:
  per_lemma:
    - lemma: "تذكار"
      decision: confirmed
      decision_reason: "مصطلح مركزي ومستقر في المعاجم الحديثة والاستعمال الفصيح."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ الأصيل والأكثر شمولاً لكل ما يُحتفظ به للذكرى."
      example: "احتفظت بصورة قديمة كأجمل تذكار من أيام الدراسة."

    - lemma: "هدية تذكارية"
      decision: confirmed
      decision_reason: "تعبير مركزي (MWE) مستقر وشائع الاستعمال لوصف الغرض المادي المُهدى."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تخصيص المفهوم في إطار 'الهبة' أو 'الهدية' المقدمة من الغير."
      example: "اشترى السياح هدايا تذكارية يدوية الصنع من السوق الشعبي."

    - lemma: "أثر"
      source: step05
      decision: removed
      decision_reason: "على الرغم من دلالته على البقاء، إلا أنه يميل للقدم (Relic) أو الأثر التاريخي أكثر من الشيء ذي القيمة العاطفية الشخصية (Keepsake)."
      step05_citation: "«أثر من عادة قديمة» — المورد الحديث"

    - lemma: "تحفة"
      source: step05
      decision: removed
      decision_reason: "تركيز اللفظ على القيمة الفنية أو الندرة (Masterpiece/Curio) وليس بالضرورة القيمة العاطفية."

  synset_flags:
    definition_review_needed: true

