          source: "المعجم الوسيط"
          conflict: "المعنى الوارد في المعجم لا يتعلق بالمفهوم العرقي أو الإثني (قد يكون خطأً طباعياً من القراءة الآلية أو يقصد الدلالة على التثنية)."
      expands: []
      evidence_status: "contradicts_only"
    - lemma: "مجموعة عرقية"
      confirm:
        - text: "«مجموعة يتكون أعضاؤها من عِرق واحد يجعلونه الرابط الأساس بينهم.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      contradicts: []
      expands:
        - text: "«ethnic group»"
          source: "مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: "توثيق للمصطلح بوصفه مقابلاً لـ ethnic group في مجالات علمية."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "فئة إثنية"
      source_section: "step5_english_bridge"
      evidence_citation: "«فِئَةٌ أَثْنِيَّة» — المعجم الطبي الموحد (2009)"
      justification: "تركيب وصفي متداول في المعاجم العلمية للدلالة على ethnic group، ويناسب الاستعمال في التصنيفات الإحصائية أو الطبية."
    - lemma: "مجموعة سلالية"
      source_section: "step5_english_bridge"
      evidence_citation: "«مجموعة سلالية — مقابل لـ ethnic group» — مسرد الجغرافيا والتاريخ، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
      justification: "تركيب وصفي يستخدم (سلالة) بدلاً من (عرق)، وهو شائع في سياقات معينة، ولكنه قد يميل إلى المعنى البيولوجي أكثر من الثقافي."
  knowledge_candidates:
    - lemma: "جماعة عرقية"
      justification: "تركيب وصفي: استخدام لفظة 'جماعة' أكثر دقة ومناسبة للبشر من 'مجموعة' التي تميل دلالتها إلى الأشياء أو التجميع غير العضوي، بينما 'جماعة' توحي بالرابطة بين أفرادها، وهو شائع في علم الاجتماع."
  generation_notes: "تم استبعاد (مجموعة سلالية) من القبول لاحقاً لأن (سلالة) تشير غالباً إلى الأصل البيولوجي فقط، بينما المفهوم يشمل الجانب الثقافي بشكل أساسي."

step1_lemma_validation:
  per_lemma:
    - lemma: "إثنية"
      decision: confirmed
      decision_reason: "مصطلح مُعرَّب واسع الانتشار كمرادف لـ 'عرقية' (ethnicity)، ويُستخدم أيضاً مجازاً (أو اقتراضاً لغوياً) للدلالة على الجماعة (ethnos) ذاتها في الخطاب المعاصر."
      evidence_assessment:
        case: "contradicts_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مُعرّبة وتُستخدم غالباً للدلالة على السمة المُجردة (ethnicity)، وقد تُطلق مجازاً على الجماعة (ethnos) نفسها استعارةً، وتُستخدم بكثرة في الكتابات الحديثة."
      example: "يتميز هذا البلد بتنوع الإثنيات وتعدد اللغات فيه."

    - lemma: "مجموعة عرقية"
      decision: confirmed
      decision_reason: "تركيب وصفي شائع ومُوثّق علمياً."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح عام ومتداول يشير إلى تصنيف بشري مبني على أساس العرق؛ يميل للاستعمال في السياقات العامة."
      example: "تتكون الدولة من عدة مجموعات عرقية تتعايش بسلام وتشارك في بناء المجتمع."

    - lemma: "جماعة عرقية"
      source: step05
      decision: confirmed
      decision_reason: "تركيب وصفي: استخدام (جماعة) أدق علمياً واجتماعياً من (مجموعة) عند الإشارة إلى تكتل من البشر لهم روابط مشتركة."
      step05_citation: "اقتراح لغوي مبني على الاستعمال السوسيولوجي."
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "أدق من (مجموعة) في الدلالة على التجمع البشري المنظم أو المترابط اجتماعياً وثقافياً؛ تُفضّل في الدراسات الأنثروبولوجية والاجتماعية."
      example: "درس الأنثروبولوجي عادات وتقاليد هذه الجماعة العرقية ومناشطها اليومية."
      actions:
        - command: create_entry
