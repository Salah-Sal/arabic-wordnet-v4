      decision_reason: "تركيب وصفي: وارد في المعاجم العلمية كالمعجم الطبي ويصلح للتقسيمات والتصنيفات."
      step05_citation: "«فِئَةٌ أَثْنِيَّة» — المعجم الطبي الموحد (2009)"
