step0_evidence:
  per_lemma:
    - lemma: "جُزْء"
      confirm:
        - text: "«الجُزْءُ: البَعْضُ» — القاموس المحيط"
        - text: "«الجزء: ما يتركب الشيء عنه وعن غيره. وقال الحرالي: الجزء بعض من كل يشابهه» — التوقيف على مهمات التعاريف"
        - text: "«الجُزْءُ، والجَزْءُ: الْبَعْض» — المحكم والمحيط الأعظم"
      expands:
        - text: "«الجزء: ما يتركب منه ومن غيره شيء سواء كان موجودا في الخارج أو في العقل كالأجناس والفصول» — كشاف اصطلاحات الفنون"
          addition: "يشمل الأجزاء العقلية والمنطقية لا المادية فقط."
      peripheral_observations:
        - "يُطلق الجزء في القرآن على الإناث (وجعلوا له من عباده جزءاً)."
        - "يُطلق عند المحدثين على الكتب التي جمع فيها أحاديث شخص واحد."
        - "يُطلق في الفلسفة على الجزء الذي لا يتجزأ (الجوهر الفرد)."

    - lemma: "قِطْعَة"
      confirm:
        - text: "«قطعة؛ جزء» — المورد الحديث"
        - text: "«قطعة، جزء» — المعجم الموحد لمصطلحات الكيمياء"
        - text: "«قِطْعَةُ (ال...) الانتهائية: الجزءُ الانتهائي للذيلِ أو للسوط أو للنطفة» — المعجم الموحد لمصطلحات علم التشريح العياني"
      expands:
        - text: "«القِطْعة: الطائفة من الشيء» — لسان العرب"
          addition: "توحي بالانفصال والاستقلال عن الأصل."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عُضْو"
      source_section: "step5_english_bridge"
      evidence_citation: "«part (1) «ب» عضو» — المورد الحديث"
      justification: "المصطلح يختص بالأجزاء الوظيفية للأجسام الطبيعية الحية (إنسان، حيوان، نبات)، وهو ما يطابق دلالة 'جسم طبيعي' في تعريف المجموعة."
    - lemma: "قِسْم"
      source_section: "step5_english_bridge"
      evidence_citation: "«part (1) «أ» جزء؛ قِسْم» — المورد الحديث"
      justification: "مرادف شائع للفظ 'جزء' و 'portion'، ويُستخدم للتعبير عن الحصة أو الجانب من الشيء المادي."
  knowledge_candidates:
    - lemma: "فِلْذَة"
      justification: "لفظ تراثي فصيح يدل على القطعة المقتطعة من الشيء المادي (قطعة من اللحم، قطعة من الأرض). الآلية المستخدمة: مجاز (إزاحة دلالية من قطعة اللحم إلى القطعة من أي جسم مادي طبيعي)."
    - lemma: "شِقّ"
      justification: "يدل على النصف أو الجزء المنفصل أو الجانب من الشيء. الآلية المستخدمة: اشتقاق (من الجذر ش-ق-ق للدلالة على الجزء الناتج عن الانفصال)."

step1_lemma_validation:
  per_lemma:
    - lemma: "جُزْء"
      decision: "confirmed"
      decision_reason: "الأدلة المعجمية صريحة في كونه مرادفاً للبعض والقطعة، وهو اللفظ الأعم."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام الشامل لكل ما يكوّن الشيء، سواء كان متميزاً بشكله أو لا، وسواء كان انفصاله حسياً أو عقلباً."
      example: "تمثل القمة جزءاً صغيراً من الجبل الشاهق."

    - lemma: "قِطْعَة"
      decision: "confirmed"
      decision_reason: "مدعومة معجمياً وتدل بدقة على الجزء المنفصل مادياً."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على ما انفصل أو قُطع من الكل، وغالباً ما توحي بشكل ملموس وانفصال مادي واضح."
      example: "انفصلت قطعة كبيرة من الجليد عن الكتلة الرئيسية."

    - lemma: "عُضْو"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مناسب جداً لتخصيص 'الجسم الطبيعي' عند الإشارة للكائنات الحية."
      step05_citation: "«part (1) «ب» عضو» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بالأجزاء الوظيفية المتميزة للأجسام الطبيعية الحية (كبد، ساق نبات، إلخ)."
      example: "القلب هو العضو الرئيسي في الدورة الدموية للجسم البشري."
      actions:
        - command: "create_entry"
          params:
            lemma: "عُضْو"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09408804-n"

    - lemma: "قِسْم"
      source: "step05"
      decision: "confirmed"
      decision_reason: "مرادف مستقر وشائع في الاستعمال الفصيح للتقسيم المكاني والمادي."
      step05_citation: "«part (1) «أ» جزء؛ قِسْم» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يوحي بالتجزئة المنطقية أو المكانية للشيء لغرض التصنيف أو الدراسة أو التوزيع."
      example: "شمل المسح قسماً كبيراً من التلال المحيطة."
      actions:
        - command: "create_entry"
          params:
            lemma: "قِسْم"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09408804-n"

    - lemma: "فِلْذَة"
      source: "step05"
      decision: "confirmed"
      decision_reason: "لفظ تراثي دقيق يثري الشبكة الدلالية، ومناسب للقطع المادية من الطبيعة."
      step05_citation: "«الثُّبُوتُ: ضِدُّ الزَّوالِ» — لسان العرب (بالإشارة إلى القطعة المقطوعة)"
      substitution_test:
        result: "pass"
      nuance_differentiation: "توحي بالاقتطاع من مادة رطبة أو جسم مادي (مثل قطعة من الكبد أو الجبل)، ولها حمولة تراثية فصيحة."
      example: "خرجت الأرض بفلذات كبدها (كناية عن كنوزها من المعادن والقطع الثمينة)."
      actions:
        - command: "create_entry"
          params:
            lemma: "فِلْذَة"
            pos: "n"
        - command: "add_sense"
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09408804-n"

    - lemma: "شِقّ"
      source: "step05"
      decision: "removed"
      decision_reason: "اللفظ غالباً ما يختص بالنصف أو الجانب المحدد، وهو أضيق من دلالة 'جزء' العامة المطلوبة هنا."
      step05_citation: "الاستدلال بالاشتقاق من الشق."
      substitution_test:
        result: "fail"

