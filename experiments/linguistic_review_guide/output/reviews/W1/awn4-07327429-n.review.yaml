step0_evidence:
  per_lemma:
    - lemma: "هجرة"
      confirm:
        - text: "«migration»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
    - lemma: "انتقال"
      expands:
        - text: "«transition»"
          source: "المعجم الموحد لمصطلحات الكيمياء (1992)"
          addition: "يدل على الانتقال أو التحول الكيميائي بشكل عام، ويشمل حركة المجموعات"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نزوح"
      source_section: "step5_english_bridge"
      evidence_citation: "«نزوح» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      justification: "ترجمة معجمية لمصطلح migration في مجالات علمية أخرى"
  knowledge_candidates:
    - lemma: "ارتحال"
      justification: "اشتقاق: من الفعل ارتحل، يستخدم أحياناً في الفيزياء لوصف حركة الجسيمات المشحونة (ارتحال أيوني)"
  generation_notes: "المصطلحات الكيميائية تعتمد بشكل رئيسي على 'هجرة' و'انتقال' لوصف إعادة الترتيب الجزيئي"

step1_lemma_validation:
  per_lemma:
    - lemma: "هجرة"
      decision: confirmed
      decision_reason: "مصطلح تقني مستقر في الكيمياء يقابل migration."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الانتقال المنظم لمجموعة داخل الجزيء، وهي الترجمة القياسية المعتمدة."
      example: "تحدث هجرة لمجموعة الألكيل أثناء التفاعل الكيميائي."
    - lemma: "انتقال"
      decision: confirmed
      decision_reason: "مصطلح عام وشائع يعبر عن حركة الذرات أو المجموعات الكيميائية داخل الجزيء."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح أعم من هجرة، قد يشير إلى أي حركة أو تحول مكاني أو تبادل للإلكترونات."
      example: "يؤدي انتقال البروتون إلى استقرار الجزيء الوسيط."
    - lemma: "نزوح"
      source: step05
      decision: removed
      decision_reason: "مستعمل في الجيولوجيا والفيزياء، لكنه غير معتاد في التفاعلات الكيميائية الجزيئية."
      step05_citation: "«نزوح» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية (1989)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "لا يستخدم عادة في الكيمياء العضوية لوصف حركة الذرات داخل الجزيء."
    - lemma: "ارتحال"
      source: step05
      decision: removed
      decision_reason: "يُستخدم أكثر في سياق الفيزياء (ارتحال إلكتروني) أو التقانات، بينما في الكيمياء 'هجرة' هي الأنسب."
      step05_citation: "لا يوجد دليل مباشر في الكيمياء العضوية"
      substitution_test:
        result: "fail"
      nuance_differentiation: "يرتبط غالباً بتأثير مجال كهربائي خارجي وليس بإعادة الترتيب الداخلي."

  synset_flags:
    definition_review_needed: false

step3_definition:
  definition_review_flag: false
  current_definition: "(في الكيمياء) الحركة غير العشوائية لذرة أو جذور كيميائية من مكان إلى آخر داخل الجزيء"
  assessment:
    decision: retain
    reason: "التعريف دقيق وواضح ومطابق للمفهوم الكيميائي للتفاعلات الجزيئية كإعادة الترتيب."

step4_relations:
  hypernymy:
    current_hypernym: "حَدَث"
    test_result: "correct"
  verb_checks:
    applicable: false
  selectional_restrictions:
    - lemma: "هجرة"
      constraint: "يستلزم فاعلاً يمثل كياناً كيميائياً (ذرة، جذر، مجموعة)"

step5_enrichment:
  per_lemma:
    - lemma: "هجرة"
      enrichment:
        root: "ه-ج-ر"
      examples:
        - text: "تلعب هجرة الذرات دوراً هاماً في تفاعلات إعادة الترتيب."
          type: usage
          source: "مؤلَّف"
      pos_check:
        pos: noun
    - lemma: "انتقال"
      enrichment:
        root: "ن-ق-ل"
      examples:
        - text: "يؤدي انتقال مجموعة الميثيل إلى تشكيل متصاوغ جديد."
          type: usage
          source: "مؤلَّف"
      pos_check:
        pos: noun
  cultural_fit:
