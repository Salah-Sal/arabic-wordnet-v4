            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13261412-n"

    - lemma: "امْتِلاك"
      source: step05
      decision: confirmed
      decision_reason: "مصدر فصيح دال على الحيازة والاستحواذ، ومستعمل بانتظام للتعبير عن المفهوم."
      step05_citation: "«مِلْكيّة؛ امتلاك؛ حقُّ التملُّك.» — المورد الحديث"
      substitution_test:
