    - lemma: "حَقُّ المِلْكِيَّة"
      source_section: "step5_english_bridge"
      evidence_citation: "«حق يخول لمالك العقار أو المنقول دون غيره سلطة استعماله واستغلاله والتصرف فيه» — المعجم الموحد لمصطلحات القانون"
      justification: "مصطلح قانوني مسكوك يعبر عن سلطة الاستعمال والتصرف المرتبطة بالمِلْك، ويطابق المفهوم."
    - lemma: "امْتِلاك"
      source_section: "step5_english_bridge"
      evidence_citation: "«مِلْكيّة؛ امتلاك؛ حقُّ التملُّك.» — المورد الحديث"
      justification: "مصدر يدل على حدث ومفهوم الحيازة والتملّك الذي هو جوهر المجموعة الترادفية."
  knowledge_candidates:
    - lemma: "تَمَلُّك"
      justification: "اشتقاق (مصدر) من الفعل 'تملّكَ' يدل على حصول المِلْك واكتسابه."

step1_lemma_validation:
