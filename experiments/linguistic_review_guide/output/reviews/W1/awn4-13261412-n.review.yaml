            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13261412-n"

    - lemma: "تَمَلُّك"
      source: step05
      decision: confirmed
      decision_reason: "مصدر صحيح لغوياً ومستعمل كمرادف للامتلاك والمِلْكيّة."
      step05_citation: "«الشيءَ: امتلكه, أو مَلَكه قهراً» — المعجم الوسيط"
