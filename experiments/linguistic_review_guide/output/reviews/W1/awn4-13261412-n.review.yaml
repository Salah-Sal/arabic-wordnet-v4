      nuance_differentiation: "مصدر صناعي يدل على الحالة والصفة المجرّدة للمِلْك والحق فيه."
      example: "انتقلت مِلْكِيَّةُ الأرض إلى الورثة بعد وفاة أبيهم."

    - lemma: "حَقُّ المِلْكِيَّة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح مركّب مستقر ومستعمل بكثرة للتعبير عن الجانب القانوني للمفهوم."
      step05_citation: "«حق يخول لمالك العقار أو المنقول دون غيره سلطة استعماله» — المعجم الموحد لمصطلحات القانون"
