step0_evidence:
  per_lemma:
    - lemma: "صوت"
      confirm:
        - text: "«إرادة؛ خِيار voice of the nation» — المورد الحديث"
        - text: "«تعبير They gave voice to their joy» — المورد الحديث"
      expands:
        - text: "«الأثر السمعىُّ الذى تُحْدِثُه تموُّجات ناشئة من اهتزاز جسم ما. (مج) اللَّحن.» — المعجم الوسيط"
          addition: "المعنى الفيزيائي والموسيقي للصوت"
        - text: "«الرأى تبديه كتابة أو مشافهة فى موضوع يقرر أو شخص ينتخب. (محدثة)» — المعجم الوسيط"
          addition: "معنى الإدلاء بالصوت في الانتخابات (Vote)"
      peripheral_observations:
        - "المعاجم القديمة تركز على الجانب الفيزيائي (ما وقر في أذن السامع)، والمعنى المراد هنا هو المجازي المعاصر (أداة تعبير أو إرادة)."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "تَعْبِير"
      source_section: "step4_fts_keyword"
      evidence_citation: "«إظهار الوقع الذي خلفه كلام المتكلم في المُخاطَب.» — مسرد الإعلام والتواصل"
      justification: "اشتقاق (مصدر) يشير إلى إظهار الفكرة أو الإرادة، ويتقاطع مع معنى (وسيلة للتعبير)."
  knowledge_candidates:
    - lemma: "لِسَان حَال"
      justification: "تركيب (إضافي): تعبير مجازي يطلق على ما/من يعبر عن حالة جماعة أو موقفها، كقولنا (كان لسان حالهم)، وهو مرادف دقيق لمعنى (صوت) المجازي كوسيلة تعبير."
    - lemma: "نَاطِق"
      justification: "اشتقاق (اسم فاعل): الشخص أو الجهة التي تتحدث وتعبر عن رأي جهة أخرى، مثل (الناطق الرسمي)."

step1_lemma_validation:
  per_lemma:
    - lemma: "صوت"
      decision: confirmed
      decision_reason: "مصطلح فصيح وأساسي يستخدم مجازاً للدلالة على وسيلة التعبير أو الإرادة والموقف، كما في (صوت العقل) و(صوت الشعب)."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللمة الأساسية؛ تمثل الاستعارة الأشهر والأكثر تجريداً للتعبير عن الرأي والإرادة، وترتبط ذهنياً وقاموسياً بالمطالبة والإعلان."
      example: "كانت الصحيفة المستقلة هي الصَّوْت الوحيد الذي يعبّر عن معاناة المواطنين."

    - lemma: "لِسَان حَال"
      source: step05
      decision: confirmed
      decision_reason: "تركيب إضافي ثابت وشائع في الاستعمال العربي للتعبير عن الواسطة التي تفصح عن موقف أو حالة، وهو مرادف وثيق للبعد المجازي للصوت."
      step05_citation: "تركيب إضافي مجازي ثابت الاستعمال."
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تتميز بكونها صريحة في الدلالة على النيابة في التعبير أو كشف الموقف الضمني أو الصريح للجهة التي تعبر عنها."
      example: "كانت القصيدة لسان حال الجيل في طموحاته وتطلعاته."
      actions:
        - command: create_entry
          params:
            lemma: "لِسَان حَال"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07292402-n"

    - lemma: "نَاطِق"
      source: step05
      decision: removed
      decision_reason: "تستخدم غالباً للدلالة على الشخص (spokesperson) المعين رسمياً للتعبير، ولا تنطبق تماماً على (الوسيلة المجردة) التي يوحي بها المفهوم."
      step05_citation: "اشتقاق (اسم فاعل)"
      substitution_test:
        result: "fail"

    - lemma: "تَعْبِير"
      source: step05
      decision: removed
      decision_reason: "مفهوم واسع يشير إلى عملية الإظهار ذاتها (expression) وليس بالضرورة للوسيلة أو المجاز المرتبط بالصوت (voice)."
      step05_citation: "«إظهار الوقع الذي خلفه كلام المتكلم في المُخاطَب.» — مسرد الإعلام والتواصل"
      substitution_test:
        result: "fail"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "لِسَان حَال"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

