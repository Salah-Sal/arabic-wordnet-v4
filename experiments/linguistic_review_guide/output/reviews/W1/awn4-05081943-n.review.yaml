      justification: "مفهوم عام يعبر عن الحيز الذي يشغله الشيء (آلية: مجاز مرسل، إطلاق عام مراد به الخاص)."
  generation_notes: "تم التركيز على المصطلحات الدالة على شغل الحيز المكاني وطريقة تواجد الأشياء."

