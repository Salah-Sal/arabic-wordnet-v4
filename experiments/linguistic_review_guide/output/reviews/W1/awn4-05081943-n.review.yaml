      justification: "مقابل مباشر لـ position، ويعبّر عن الحالة المكانية التي يوجد عليها الشيء (اشتقاق)."
    - lemma: "وَضْعِيَّة"
      source_section: "step5_english_bridge"
      evidence_citation: "«وَضْعِيَّة» — المعجم الطبي الموحد كترجمة لـ position"
      justification: "مصدر صناعي من وضع، يستخدم بكثرة للدلالة على الهيئة المكانية أو وضعية الأشياء (اشتقاق)."
