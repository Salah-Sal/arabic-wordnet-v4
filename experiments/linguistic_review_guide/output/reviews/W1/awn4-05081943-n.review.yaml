step0_evidence:
  per_lemma:
    - lemma: "عَلاقَة مَكَانِيَّة"
      evidence_status: "no_material_found"

    - lemma: "مَوْضِع"
      confirm:
        - text: "«(الْموضع) اسْم الْمَكَان»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«الموضع:[في الانكليزية] Place ،spot ،space ... مرادف للمكان»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«موضع الشَّيءَ: مركزه، عيَّن موضعَه، دلّ عليه»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر"
      contradicts:
        - text: "«المُكَسَّرُ المُقطَّع مَن كان غير مستحكِم الخَلْق كالمخنَّث»"
          source: "المعجم الوسيط"
          conflict: "هذا المعنى للفظ (المُوَضَّع) بالتشديد وليس لاسم المكان"

    - lemma: "مَوْقِع"
      confirm:
        - text: "«(الْموقع) مَكَان الْوُقُوع يُقَال وَقع الشَّيْء موقعه»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«مَوْقِع: بمعنى موضع أو المكان الذي توجد فيه بعض الأشياء»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
      expands:
        - text: "«عبر إنترنيت، نسمي 'الموقع' المزوّد أو المضيف الذي توجد فيه المعلومات التي نبحث عنها»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
          addition: "المعنى التقني المعاصر (Website)"

step05_lemma_generation:
