      confirm:
        - text: "«الأشياء: جمع شَيْء أو اسم جمع» — دستور العلماء للأحمدنكري"
        - text: "«استخدم العرب كلمة «أَشْياء» ممنوعة من الصرف... جاء قوله تعالى: {يَاأَيُّهَا الَّذِينَ آمَنُوا لا تَسْأَلُوا عَنْ أَشْيَاءَ إِنْ تُبْدَ لَكُمْ تَسُؤْكُمْ}» — معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«الأشياء: جمع شيء... منصرف عند بعضهم وغير منصرف عند سيبويه» — دستور العلماء للأحمدنكري"
          addition: "نقاش صرفي حول تصريف الكلمة ومنعها من الصرف."
    - lemma: "أغراض"
      confirm:
        - text: "«الأغراض: أمتعة؛ ممتلكات شخصيّة» — المورد الحديث (تحت مادة stuff)"
        - text: "«الغرض: الهدف الذي يرمى إليه والبغية والحاجة والقصد (ج) أغراض» — المعجم الوسيط"
      expands:
        - text: "«فهمت غرضك قصدك (ج) أغراض» — المعجم الوسيط"
          addition: "استعمال الجمع للدلالة على الحاجة والقصد المرتبط بالشيء."

