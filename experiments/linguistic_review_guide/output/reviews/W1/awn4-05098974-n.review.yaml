step0_evidence:
  per_lemma:
    - lemma: "احتمال"
      confirm:
        - text: "«رقم يمثل فرصة حدوث حدث معين.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«عدد حقيقي بين 0 و 1 يدل على احتمال حدوث حدث معين من بين حالات أحداث ذات الصلة.»"
          source: "مسرد المناخ والبيئة وإدارة النفايات الصلبة، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«أرجحيةُ وقوعِ حادثة، يمكِن تقديرُها رياضياً غالباً.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
    - lemma: "فرصة"
      contradicts:
        - text: "«الوقت المناسب للقيام بعمل ما»"
          source: "المعجم الوسيط"
          conflict: "المعنى المعجمي الأصلي يشير إلى النوبة أو الوقت المناسب وليس إلى المقياس الرياضي للاحتمال."
      expands:
        - text: "«فرصة a chance to escape»"
          source: "المورد الحديث (2008)"
          addition: "استعمال حديث بمعنى الاحتمال وإمكانية الحدوث."

