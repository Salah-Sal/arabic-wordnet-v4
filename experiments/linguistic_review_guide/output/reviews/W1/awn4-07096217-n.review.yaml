            entry_id: "{auto}"
            synset_id: "awn4-07096217-n"
    - lemma: "جنائب الكلام"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح معتمد طبياً ومصاغ بتركيب إضافي عربي متين، يضفي تنوعاً تراثياً وفصاحة على المجموعة الترادفية."
      step05_citation: "«جَنائِبُ الكَلاَم (مَثَلاً: نَبْرَةُ الصَّوتِ....)» — المعجم الطبي الموحد (2009)"
