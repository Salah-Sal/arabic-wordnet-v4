step05_lemma_generation:
  evidence_candidates:
    - lemma: "لغة ملحقة"
      source_section: "step5_english_bridge"
      evidence_citation: "«اِمتزاج أو عدمه لِلُغة فعلٍ بالخطاب العادي ، لهذا تعتبر بعض أنظمة التواصل لغة لاحقة تتميز عن الكلام، كما أن جُلّ الخطوط غير الدقيقة لسانيا تعود إلى اللغة الملحقة عبر أصواتها.» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "مصطلح لساني معتمد في المعاجم المتخصصة يعبر عن الظواهر المرافقة للغة."
    - lemma: "جنائب الكلام"
      source_section: "step5_english_bridge"
      evidence_citation: "«جَنائِبُ الكَلاَم (مَثَلاً: نَبْرَةُ الصَّوتِ....)» — المعجم الطبي الموحد (2009)"
      justification: "توليد بالتركيب الإضافي (جنائب + الكلام) يحمل طابعاً فصيحاً ويصور المفهوم بوضوح."
  knowledge_candidates:
    - lemma: "نظائر اللغة"
      justification: "توليد بالتركيب الإضافي؛ 'نظائر' تعكس معنى para (الموازي أو المشابه)، مما يشير إلى الأنظمة التواصلية الموازية للغة الطبيعية."

step1_lemma_validation:
  per_lemma:
    - lemma: "تواصل شبه لغوي"
      decision: confirmed
      decision_reason: "مصطلح تقني مركب شائع في الدراسات التواصلية، يتطابق مع المفهوم (paralinguistic communication)."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على 'العملية التواصلية' ذاتها كفعل تفاعلي، وليس على النظام كنظام مجرد."
      example: "يُعد التواصل شبه اللغوي، كالإيماءات ونبرة الصوت، عنصراً حاسماً في إيصال الرسالة بدقة."
    - lemma: "لغة مصاحبة"
      decision: confirmed
      decision_reason: "مصطلح معتمد في مسارد الإعلام، يؤدي المعنى المطلوب بدقة، ويمتاز بشيوعه ووضوح دلالته (para = مصاحب)."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على 'النظام' أو الأداة المرافقة للغة المعجمية."
      example: "تؤدي اللغة المصاحبة دوراً بارزاً في التعبير عن الانفعالات التي قد تعجز الكلمات عن وصفها."
    - lemma: "لغة ملحقة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح معتمد في معجم اللسانيات، وهو تركيب وصفي صحيح."
      step05_citation: "«اِمتزاج أو عدمه لِلُغة فعلٍ بالخطاب العادي...» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير إلى الجانب 'التبعي' لهذه الظواهر واعتبارها ملحقاً بالخطاب اللفظي."
      example: "تدرس اللسانيات الحديثة دور اللغة الملحقة في تحليل الخطاب الشفهي."
