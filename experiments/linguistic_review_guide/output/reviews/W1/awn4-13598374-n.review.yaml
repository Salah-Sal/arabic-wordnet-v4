step0_evidence:
  per_lemma:
    - lemma: "نظام قياس"
      confirm:
        - text: "«منظومةُ كاملة ومُتداخلة من أجهزة قياس وتجهيزاتٍ أخرى، لإجراء قياسات مُحدَّدة سلفًا.»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "نظام مقاييس"
      source_section: "step4_fts_keyword"
      evidence_citation: "«نظام مقاييس.» — المورد الحديث (2008)"
      justification: "تركيب إضافي ورد في المعاجم ثنائية اللغة لترجمة مصطلح measurement system أو metric."
    - lemma: "نظام متري"
      source_section: "step5_english_bridge"
      evidence_citation: "«نظام عشري للمقاييس والاوزان مبني علي المتر والكيلوغرام.» — المورد الحديث (2008)"
      justification: "ورد مقابلاً لمصطلح metric system."
  knowledge_candidates:
    - lemma: "منظومة قياس"
      justification: "تركيب إضافي: دمج كلمة (منظومة) التي تفيد الترابط والشمول مع كلمة (قياس)، للتعبير عن النظام المترابط للمقاييس."
    - lemma: "نظام قياسي"
      justification: "تركيب وصفي: وصف النظام بأنه يختص بالقياس، وهو مستعمل في السياقات التقنية."
  generation_notes: "تم استبعاد (نظام متري) لأنه أخص من المفهوم العام، واستبعاد (نظام قياسي) لعدم دقته كمصطلح يعبر عن نظام من الوحدات."

step1_lemma_validation:
  per_lemma:
    - lemma: "نظام قياس"
      decision: confirmed
      decision_reason: "مصطلح تقني مستقر وواضح الدلالة ومطابق للمفهوم."
