      decision_reason: "أخص من المفهوم؛ يشير تحديداً إلى النظام العشري المبني على المتر، بينما مفهوم المجموعة يشمل أي نظام قياس."
      step05_citation: "«نظام عشري للمقاييس والاوزان مبني علي المتر والكيلوغرام.» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        accepted: false
    - lemma: "منظومة قياس"
      source: step05
      decision: confirmed
      decision_reason: "تركيب إضافي دقيق يشير إلى الترابط بين عناصر القياس."
      step05_citation: "من المعرفة اللغوية (آلية التوليد: تركيب إضافي)."
      mwe_check:
        is_mwe: true
        accepted: true
