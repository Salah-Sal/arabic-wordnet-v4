        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح عام وشائع يشير إلى أي نظام متكامل من المقاييس والوحدات."
      example: "تعتمد الدولة نظام قياس موحد لضمان دقة المعاملات التجارية."
    - lemma: "نظام مقاييس"
      source: step05
      decision: confirmed
      decision_reason: "تركيب إضافي صحيح يعبر عن المفهوم بدقة."
      step05_citation: "«نظام مقاييس.» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على تعدد المقاييس وتنوعها ضمن النظام الواحد."
      example: "تختلف أنظمة المقاييس بين دولة وأخرى كالنظام الإمبراطوري والنظام الدولي."
      actions:
        - command: create_entry
          params:
            lemma: "نظام مقاييس"
            pos: n
