      nuance_differentiation: "تستخدم كلمة (منظومة) لإبراز الجانب الهيكلي المتداخل لأدوات ووسائل القياس."
      example: "تستخدم المحطة منظومة قياس متطورة لدرجات الحرارة والضغط."
      actions:
        - command: create_entry
          params:
            lemma: "منظومة قياس"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-13598374-n"
