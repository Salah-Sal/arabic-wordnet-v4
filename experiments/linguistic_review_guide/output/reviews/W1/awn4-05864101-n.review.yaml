step0_evidence:
  per_lemma:
    - lemma: "كم"
      confirm:
        - text: "«في علم الفيزياء، يُشيرُ هذا المُصطلح إلى مادة تتوَّلد من خلال تبدّل الحالة داخل نظام مُعيَّن من قيم مُتقّطعة لكمّية فيزيائية، هي الطاقة غالباً. ولا يُمكن أن تظهر الكمّات إلا في نسبٍ مُحدَّدة لتلك الكمّية الفيزيائية» — مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«الكَمّ: أصغر مقدار من الطاقة يمكن أن يوجد مستقلا. هذا المقدار من الطاقة باعتباره وحدةً (فز)» — المورد الحديث (2008)"
    - lemma: "كموم"
      expands:
        - text: "«كَمّ [ج:كُموم] (quantum [pl.quanta])» — المعجم الطبي الموحد (2009)"
          addition: "يثبت أن هذه الكلمة هي صيغة الجمع للفظة (كَمّ) وليست لفظاً مفرداً مستقلاً."

step05_lemma_generation:
  knowledge_candidates:
    - lemma: "كوانتوم"
      justification: "التعريب: نقل حرفي للكلمة اللاتينية/الإنجليزية (Quantum) وهو مستخدم في بعض السياقات العلمية."
  generation_notes: "المصطلح الأصلي (كَمّ) هو التعبير القياسي المستقر، والمولدات لا ترقى لمرتبته في الفصاحة."

step1_lemma_validation:
  per_lemma:
    - lemma: "كم"
      decision: confirmed
      decision_reason: "مصطلح علمي فصيح ومستقر في المعاجم العلمية المتخصصة للدلالة على المفهوم الفيزيائي."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المصطلح العربي القياسي والمفرد للتعبير عن وحدة المقدار الفيزيائي المنفصل."
      example: "بينت ميكانيكا الكم أن الضوء ينبعث في شكل كَمّ محدد من الطاقة وليس كتيار متصل."
      
    - lemma: "كموم"
      decision: removed
      decision_reason: "الكلمة جمع لـ (كَمّ) وليست مفرداً. شروط اللمات في الشبكة الدلالية تقتضي إدراج المفرد إلا في حالات نادرة."
      evidence_assessment:
        case: "expands_only"
      substitution_test:
        result: "fail"
      nuance_differentiation: "تدل على الجمع (quanta) ولا تقوم مقام المفرد (quantum) في السياق المعجمي الأساسي."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "كوانتوم"
      source: step05
      decision: removed
      decision_reason: "لفظ دخيل (معرّب)، ويُستغنى عنه بوجود اللفظ العربي الفصيح والقياسي (كَمّ)."
      step05_citation: "معرفة لغوية عامة واستعمال متداول"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير دخيل، في حين أن (كم) مصطلح عربي أصيل."

