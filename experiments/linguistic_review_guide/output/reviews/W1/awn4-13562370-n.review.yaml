step0_evidence:
  per_lemma:
    - lemma: "تجهيز"
      confirm:
        - text: "«تركيب أجهزة إلكترونية وجيروسكوبية وغيرها في طائرة أو صاروخ أو مركبة فضائية» — المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد"
        - text: "«processing» — المَكنَز الزراعي متعدد اللغات"
          source: "المَكنَز الزراعي متعدد اللغات"
      expands:
        - text: "«instrumentation» — المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد"
          addition: "يشير إلى التركيب الفني للأجهزة، وهو بُعد تخصصي لمفهوم التجهيز"

    - lemma: "معالجة"
      confirm:
        - text: "«الحصول على صور سالبة أو موجبة أو مطبوعة من فلم أو لوحة تصوير/ معالجة المعطيات بواسطة الحاسوب أو أية وسيلة أخرى» — المعجم الموحد لمصطلحات الاستشعار عن بعد (2000)"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد"
        - text: "«لفظ عام يعبر عن مجموع العمليات الحسابية والمنطقية التي يقوم بها الحاسوب على معطيات محددة للحصول على نتائج محددة» — المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
        - text: "«تداولُ المعطياتِ في نظامٍ حاسوبي. وهي مرحلةٌ أساسيةٌ بين استقبالِ المعطيات (دخل) وتوليدِ النتائج (خرج)» — معجم مصطلحات المعلوماتية (2000)"
          source: "معجم مصطلحات المعلوماتية"
      expands:
        - text: "«iatreusis (treatment)» — المعجم الطبي الموحد (2009)"
          source: "المعجم الطبي الموحد"
          addition: "يوسّع المعنى ليشمل الرعاية الطبية (التداوي)"

