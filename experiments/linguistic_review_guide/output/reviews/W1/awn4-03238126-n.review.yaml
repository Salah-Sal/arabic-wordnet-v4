step0_evidence:
  per_lemma:
    - lemma: "قُرعة"
      confirm:
        - text: "«طينة مدورة أو عجينة مدورة مثلا يدرج فيها رقعة يكتب فيها اسم المتنازعين في قسمة شيء ثم سلّم إلى صبي، يعطي كلّ واحد من المتنازعين واحدة منهما» — كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«السهمُ والنصيبُ وإلقاءُ القرعة حيلةٌ يتعيَّن بها سهمُ الإنسان أي نصيبُه» — التعريفات الفقهيّة للبركتي"
        - text: "«النصيبُ. ويقال: كانت له القُرْعَةُ على أصحابه: غلبَهم بها» — المعجم الوسيط"
    - lemma: "سَهْم"
      confirm:
        - text: "«قِدْح يُقارع به أو يُلعب به في الميسر» — معجم اللغة العربية المعاصرة"
        - text: "«الحظ والنصيب، والقدح يضرب به في الميسر والمقارعة وواحد النبل» — موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "قِدْح"
      confirm:
        - text: "«قطعة من الخشب تُعرَّض قليلاً وتُسوَّى وتكون في طول الفِتْر أو دونه، تستعمل في الميسر أو الاستقسام» — المعجم الوسيط"
        - text: "«السهمُ قبل أن يُراشَ ويُنصل» — القاموس المحيط"

