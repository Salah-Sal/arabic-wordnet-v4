step0_evidence:
  per_lemma:
    - lemma: "جليد"
      confirm:
        - text: "«الكُتَلُ المُتَجَمِّدَة من الماءِ بِفِعْل البُرودَةِ»"
          source: "المعجم الكبير"
        - text: "«(جليد) مَا جمد من المَاء»"
          source: "المعجم الوسيط"
        - text: "«ice: جليد؛ جَمَد؛ ثلج»"
          source: "المورد الحديث"
      contradicts:
        - text: "«ما يَسْقُطُ على الأَرْضِ من النَّدىَ فَيَجْمُد»"
          source: "المعجم الكبير"
          conflict: "هذا التعريف يخص 'الصقيع' أو 'الضريب' (frost) وليس الجزء المتجمد من المسطحات المائية."
      expands:
        - text: "«والقوي الصابر، والمبالغة في الجلد»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "استعمال مجازي لوصف الإنسان الصبور."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جمد"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الجَمْدُ: الكُتَلُ المُتَجَمِّدَةُ من الماءِ بفعْلِ البُرودةِ الشَّديدة» — المعجم الكبير"
      justification: "لفظ تراثي يدل بدقة على كتل الماء المتجمدة، وهو مطابق لدلالة المجموعة."
  knowledge_candidates:
    - lemma: "ثلج"
      justification: "يُستخدم في اللغة المعاصرة وفي المعاجم التقنية (مثل المعجم الموحد لمصطلحات الطاقة) للدلالة على الماء المتجمد بشكل عام (ice) وليس فقط الثلج المتساقط (snow)."
  generation_notes: "المجموعة تركز على الحالة الفيزيائية للماء المتجمد في المسطحات المائية؛ 'جليد' هو المصطلح التقني الأدق، بينما 'جمد' هو البديل التراثي."

step1_lemma_validation:
  per_lemma:
    - lemma: "جليد"
      decision: confirmed
      decision_reason: "مصطلح مستقر ومدعوم بأدلة معجمية قوية تطابق تعريف المجموعة."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ الأساسي والأكثر دقة لوصف المسطحات المائية المتجمدة والكتل الصلبة الكبيرة."
      example: "تغطي طبقة سميكة من الجليد سطح البحيرة في فصل الشتاء."
    
    - lemma: "جمد"
      source: step05
      decision: confirmed
      decision_reason: "لفظ عربي أصيل ومهجور نسبياً لكنه دقيق دلالياً ومثبت في المعاجم الكلاسيكية."
      step05_citation: "«الجَمْدُ: الكُتَلُ المُتَجَمِّدَةُ من الماءِ بفعْلِ البُرودةِ الشَّديدة» — المعجم الكبير"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يتميز بكونه لفظاً تراثياً يركز على عملية الانجماد والصلابة (الجامد)، وغالباً ما يُستخدم كاسم جنس."
      example: "رأينا الجمد يطفو فوق مياه القطب الشمالي."
      actions:
        - command: create_entry
          params:
            lemma: "جمد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09331304-n"

    - lemma: "ثلج"
      source: step05
      decision: confirmed
      decision_reason: "رغم أن دلالته الأصلية هي الثلج المتساقط (snow)، إلا أنه يُستخدم عالمياً وتقنياً كمرادف للماء المتجمد (ice)."
      step05_citation: "«الثلج: ما جمد من الماء» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أكثر شيوعاً في الاستعمال العام، ويُطلق غالباً على الماء المتجمد في سياقات الحياة اليومية."
      example: "تحول ماء النهر إلى ثلج صلب بسبب الصقيع."
      actions:
        - command: create_entry
          params:
            lemma: "ثلج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09331304-n"

