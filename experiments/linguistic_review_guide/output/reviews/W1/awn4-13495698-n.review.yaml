step0_evidence:
  per_lemma:
    - lemma: "تغليف"
      confirm:
        - text: "«حصر تام لفضلات معينة بواسطة مادة أخرى لعزلها من التأثير الخارجي للهواء والماء وَضْع في كبسولة»"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (2012)"
        - text: "«وضع المادة الغذائية في عبوات أو أغلفة لوقايتها من الظروف الجوية وإطالة مدة حفظها»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
      expands:
        - text: "«إخفاء بيانات أو معلومات عن إمكانية الوصول إليها، حيث يتم الحيلولة دون الوصول المباشر إلى البنية الداخلية للبيانات»"
          source: "مسرد الهندسة الكهربائية، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
          addition: "التوسيع إلى المجال البرمجي والتقني (Data Encapsulation)."
    - lemma: "كبسلة"
      confirm:
        - text: "«تغليف المادة أو حصرها في كبسولة»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
        - text: "«تقنية تطوير برمجية، تتضمن عزل وظيفة نظام، أو مجموعة معطيات وعمليات على هذه المعطيات ضمن نسيقة module واحدة»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«التغطية بمادة رقيقة أو غشائية»"
          source: "المعجم الموحد لمصطلحات تقانات الأغذية (2004)"
          addition: "تشير إلى الكبسلة الدقيقة (Microencapsulation)."

