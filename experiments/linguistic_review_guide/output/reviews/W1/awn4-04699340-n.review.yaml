step0_evidence:
  per_lemma:
    - lemma: "ثبات"
      confirm:
        - text: "«الثبات: ضد الزوال، والثبات والثبوت ضد التزلزل... وثبت الجنان أي ثابت القلب»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«Stability, permanence... هو عدم احتمال الزوال بتشكيك المشكك»"
          source: "كشاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«الثَّبَات: ضد الزوال»"
          source: "التعريفات الفقهية للبركتي"
      expands:
        - text: "«انسجام بين الإدراك والتوقعات»"
          source: "مسرد الإعلام والتواصل (ArabTerm)"
          addition: "بُعد نفسي إدراكي يتفق مع 'تثبيت العقل والمشاعر'"
      peripheral_observations:
        - text: "«ما يشد به الشيء ليثبت»"
          source: "المعجم الوسيط"
          observation: "معنى مادي (أداة الربط) لا ينتمي للمفهوم التجريدي"

    - lemma: "رزانة"
      confirm:
        - text: "«يُقال فيه رزانة: وقار»"
          source: "المعجم الوسيط"
        - text: "«الحلم والوقار وأصالة الرأي، وسكون الشيء وثبوته، والثقل في الوزن ونحوه»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«الوَقارُ»"
          source: "المعجم الكبير"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "رصانة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(1) سكون؛ هدوء (2) رصانة؛ رزانة؛ رباطة جأش» — المورد الحديث"
      justification: "ترادف دقيق لرزانة وتعبر عن الاستقرار والوقار"
    - lemma: "وقار"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الوقار: الرزانة والحلم» — المعجم الوسيط"
      justification: "مرادف مباشر لرزانة وجزء من تعريفها في المعاجم"
  knowledge_candidates:
    - lemma: "اتزان"
      justification: "آلية: اشتقاق (افتعال من وزن). يدل على التوازن النفسي والعقلي (Equilibrium/Stability) وهو ما يثبت العقل."
  generation_notes: "التعريف يغطي جانبين: الحالة (سمة الاستقرار) والوسيلة (شيء يثبت). اللمات المقترحة تغطي الظلال الدلالية للوقار والاتزان."

