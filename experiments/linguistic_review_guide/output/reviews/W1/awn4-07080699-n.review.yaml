step0_evidence:
  per_lemma:
    - lemma: "أسلوب"
      confirm:
        - text: "«طريقة عمل، وسيلة تعبير الفكر عبر الكلمات والتراكيب؛ وهو لغة استكفائية تغوص في الميثولوجيا الشخصية والسردية لكاتبها.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«علامة الفردانية أو التفرد في الخطاب»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«فى الأدب style: مجموعةٌ من الملامح التعبيرية التى يختارُها المتكلِّمُ أو الكاتبُ من العناصر اللغوية القابلة للتبادل لنقل مقاصده إلى المتلقى»"
          source: "المعجم الكبير"
      expands:
        - text: "«الطَّرِيق وَيُقَال سلكت أسلوب فلَان فِي كَذَا طَرِيقَته ومذهبه وَطَرِيقَة الْكَاتِب فِي كِتَابَته والفن»"
          source: "المعجم الوسيط"
    - lemma: "نمط تعبيري"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "طراز"
      source_section: "step5_english_bridge"
      evidence_citation: "«طراز» — المعجم الموحد للمصطلحات المهنية والتقنية"
      justification: "كلمة معربة فصيحة ومستعملة بمعنى النمط أو الشكل المميز في الفنون."
    - lemma: "ديباجة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«أُسْلوب، طريقة تعبير: كاتِبٌ صحيح الدِّيباجة» — معجم اللغة العربية المعاصرة"
      justification: "مجاز من النسيج، وتستعمل اصطلاحاً للدلالة على حسن السبك وأسلوب التعبير الأدبي."
    - lemma: "نمط"
      source_section: "step5_english_bridge"
      evidence_citation: "«طراز؛ نَمط» — المورد الحديث"
      justification: "كلمة أصيلة شائعة تفيد الطريقة التي يطرد عليها الشيء."
  knowledge_candidates:
    - lemma: "مذهب"
      justification: "مجاز من الذهاب، يستعمل في النقد والفن للدلالة على طريقة التعبير المميزة لجماعة (مثل المذهب الرومانسي)."

step1_lemma_validation:
  per_lemma:
    - lemma: "أسلوب"
      decision: confirmed
      decision_reason: "الكلمة الأساسية والأكثر شيوعاً للتعبير عن الطريقة المميزة في القول والفن."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام الشامل لطريقة التعبير في مختلف الفنون والآداب، ويركز على الجانب الفردي."
      example: "يمتاز العقاد بأسلوب أدبي رفيع لا يضاهى."

    - lemma: "نمط تعبيري"
      decision: removed
      decision_reason: "تركيب وصفي حر ومترجم حرفياً عن الإنجليزية، يغني عنه اللفظ المفرد 'أسلوب'."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب التعبيري الصريح، وهو ترجمة حرفية لـ expressive style."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    - lemma: "طراز"
      source: step05
      decision: confirmed
      decision_reason: "لفظ شائع فصيح يستعمل بكثرة للتعبير عن النمط المميز، خاصة في الفنون المادية."
      step05_citation: "«طراز» — المعجم الموحد للمصطلحات المهنية والتقنية"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يغلب إطلاقه على الأساليب الفنية المادية كالعمارة واللباس."
      example: "بُني المسجد على طراز أندلسي فريد."
      actions:
        - command: create_entry
          params:
            lemma: "طراز"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07080699-n"

    - lemma: "ديباجة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح مجازي مستقر للدلالة على أسلوب الصياغة والتعبير الأدبي."
      step05_citation: "«أُسْلوب، طريقة تعبير» — معجم اللغة العربية المعاصرة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بأسلوب الكتابة وحسن السبك اللفظي في الأدب والمقالات."
      example: "هذا النص منسوج بديباجة لغوية رصينة."
      actions:
        - command: create_entry
          params:
            lemma: "ديباجة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07080699-n"

    - lemma: "نمط"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح واسع الاستعمال لبيان الطريقة والأسلوب."
      step05_citation: "«طراز؛ نَمط» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يفيد التكرار والاطراد على هيئة واحدة، وهو قريب من 'أسلوب'."
      example: "صاغ قصيدته على نمط شعراء الجاهلية."
      actions:
        - command: create_entry
          params:
            lemma: "نمط"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07080699-n"

    - lemma: "مذهب"
      source: step05
      decision: confirmed
      decision_reason: "مستعمل بكثرة في سياق المدارس الأدبية والفنية."
      step05_citation: "استعمال لغوي مجازي مستقر"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يطلق غالباً على الأسلوب الجماعي الذي يميز فترة زمنية أو مدرسة (كالمذهب الكلاسيكي)."
      example: "اتبع الشاعر المذهب الرومانسي في قصائده."
      actions:
        - command: create_entry
          params:
            lemma: "مذهب"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-07080699-n"

  synset_flags:
    definition_review_needed: false
  added_lemmas:
    - lemma: "طراز"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "ديباجة"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "نمط"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "مذهب"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

step3_definition:
  definition_review_flag: false
  current_definition: "طريقة للتعبير عن شيء ما (في اللغة أو الفن أو الموسيقى وما إلى ذلك) تكون مميزة لشخص معين أو مجموعة من الناس أو فترة زمنية"
  assessment:
    decision: retain
    reason: "التعريف دقيق وشامل ويغطي المفهوم بشكل واضح وبلغة معجمية سليمة."

