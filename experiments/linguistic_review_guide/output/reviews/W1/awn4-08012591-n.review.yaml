step0_evidence:
  per_lemma:
    - lemma: "حشد"
      confirm:
        - text: "«من الناس: الجماعة»"
          source: "المعجم الوسيط"
        - text: "«الجَماعةُ يَحْتَشِدون. يقال: عند فُلَانٍ حَشْدٌ من النَّاسِ العَشِيرَة»"
          source: "المعجم الكبير"
      expands:
        - text: "«الزَّرْع حشدا نبت كُله والناقة وَنَحْوهَا غزر اللَّبن فِي ضرْعهَا»"
          source: "المعجم الوسيط"
          addition: "يطلق مجازاً على كثرة الزرع أو اللبن"
    - lemma: "سرب"
      confirm:
        - text: "«الفَريقُ من الطَّير والحيوان»"
          source: "المعجم الوسيط"
        - text: "«القَطِيعُ منَ الظِّباءِ والنِّساءِ وغَيْرِها»"
          source: "القاموس المحيط"
      expands:
        - text: "«الماشِيَةُ كُلُّها، والطَّريقُ، والوِجْهَةُ، والصَّدْرُ، والخَرْزُ.»"
          source: "القاموس المحيط"
          addition: "يطلق أيضاً على الطريق والماشية الراعية والنفس"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "سحابة"
      source_section: "step5_english_bridge"
      evidence_citation: "«سحابة: cloud» — المعاجم ثنائية اللغة"
      justification: "تستخدم مجازاً للتعبير عن التجمع الكثيف في الهواء الذي يحجب الرؤية كالسحاب (مثل: سحابة من الدخان أو الجراد)."
  knowledge_candidates:
    - lemma: "غيمة"
      justification: "مولدة بالمجاز (الإزاحة الدلالية)؛ حيث تطلق الغيمة على التجمع الكثيف للأشياء في الهواء على التشبيه بالغيوم (غيمة من الحشرات)."

step1_lemma_validation:
  per_lemma:
    - lemma: "حشد"
      decision: confirmed
      decision_reason: "مصطلح فصيح شائع يعبر عن التجمع الكثيف، وإن كان يغلب إطلاقه على البشر إلا أنه يصح إطلاقه على الأشياء المتكاثرة على الأرض."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على التجمع الكثيف والتراكم في مكان واحد، ويغلب استعماله للبشر على الأرض."
      example: "زحف حشدٌ من الجراد على المحاصيل الزراعية."
    - lemma: "سرب"
      decision: confirmed
      decision_reason: "مصطلح فصيح ودقيق للتعبير عن الجماعة من الطير أو الحشرات في الهواء أو الحيوانات على الأرض."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يختص بالجماعة التي تتحرك أو تطير في اتجاه واحد معاً (خاصة الطيور والحشرات)."
      example: "غطى سِربٌ من الطيور المهاجرة كبد السماء."
    - lemma: "سحابة"
      source: step05
      decision: confirmed
      decision_reason: "تعبير مجازي فصيح ومستقر في الاستعمال لوصف التجمعات الكثيفة في الهواء (سحابة جراد/دخان)."
      step05_citation: "«سحابة: cloud» — المعاجم ثنائية اللغة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تستخدم استعارة للتجمع الكثيف جداً في الهواء الذي يشبه السحاب في كثرته وحجبه للرؤية."
      example: "أظلمت السماء حين مرّت سحابةٌ من الجراد الجائع."
      actions:
        - command: create_entry
          params:
            lemma: "سحابة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08012591-n"
    - lemma: "غيمة"
      source: step05
      decision: removed
      decision_reason: "«سحابة» تفي بالغرض وهي أشيَع في هذا الاستعمال المجازي، فلا داعي لتكرار اللفظ المرادف."
      step05_citation: "اقتراح من المعرفة اللغوية"

  synset_flags:
    definition_review_needed: true
  added_lemmas:
    - lemma: "سحابة"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

