          source: "المعجم الطبي الموحد (UMD)"
    - lemma: "ناقل للمرض"
      confirm:
        - text: "«الحمل (vehicle): سائلٌ تُذوَّب فيه الأدوية (صي).»"
          source: "المورد الحديث"
        - text: "«سِوَاغٌ، حامِل، ناقِل (vehicle): بلازميدة ذاتية التكرر... تستعمل في نقل المورثات الأجنبية»"
          source: "المعجم الموحد لمصطلحات علم الوراثة"
      contradicts:
        - text: "«النّاقل (vector): حشرة إلخ ناقلة للجراثيم (أح)»"
          source: "المورد الحديث"
          conflict: "المصطلح يشير إلى كائنات حية (ناقل حيوي) بينما المجموعة مخصصة للأجسام غير الحية."
        - text: "«ناقل العدوى: حشرة أو حيوان ينقل العامل الممرض من مضيف لآخر.»"
          source: "المعجم الموحد لمصطلحات علم الصيدلة"
          conflict: "تقييد اللفظ بالحيوانات والحشرات."

