    reason: "التعريف الحالي يستخدم كلمة 'رسالة' (دوران) وصياغته ركيكة ('ما يتعلق به الشيء من معنى'). يجب صياغة تعريف دقيق يجمع بين المحتوى والمضمون المستفاد."
  authored_definitions:
