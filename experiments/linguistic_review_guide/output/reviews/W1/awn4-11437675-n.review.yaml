step0_evidence:
  per_lemma:
    - lemma: "أداة"
      confirm:
        - text: "«آلة الحرفة التي يقيم بها صاحبها حرفته»"
          source: "كتاب العين"
        - text: "«وسيلةٌ يُستعان بها لتأْدية عَمَلٍ ما كالمطرقة والمِبْرد والمِخرطة»"
          source: "المعجم الكبير"
      contradicts:
        - text: "«اللفظة تستعمل للربط بين الكلام أو للدلالة على معنى في غيرها كأل في تعريف الاسم»"
          source: "المعجم الوسيط"
          conflict: "هذا المعنى يخص النحو (particle) وليس المفهوم العام للآلة/الأداة"
      expands:
        - text: "«برنامج أو جزء من برنامج يمكن من القيام بوظيفة محدودة»"
          source: "المعجم الموحد لمصطلحات تقانة المعلومات"
          addition: "توسيع المفهوم ليشمل الأدوات البرمجية"

    - lemma: "محرك"
      confirm:
        - text: "«آلةٌ تُحوِّل الطاقة إلى شغل»"
          source: "المعجم الكبير"
        - text: "«جهاز يُحوِّل الطاقة إلى عمل ميكانيكي»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة"
      contradicts:
        - text: "«أصل العنق من أعلاه»"
          source: "المعجم الوسيط"
          conflict: "معنى تشريحي (مَحْرِك) لا علاقة له بالمفهوم"
      expands:
        - text: "«أي عامل طبيعي أو من صنع الإنسان، يسبب بشكل مباشر أو غير مباشر تغير في النظام البيئي»"
          source: "مسرد المناخ والبيئة (ArabTerm)"
          addition: "استعمال 'محرك' بمعنى 'عامل مسبب' أو 'دافع' (driver)"

