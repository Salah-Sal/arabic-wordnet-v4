step0_evidence:
  per_lemma:
    - lemma: "دلالة"
      confirm:
        - text: "«شىءٌ أو مَعْنًى يُفيدُه لفظٌ أو رَمْزٌ ما»"
          source: "المعجم الكبير"
        - text: "«الإرشاد ما يقتضيه اللفظ عند إطلاقه»"
          source: "المعجم الوسيط"
        - text: "«تعتبر الدلالة إيماءة رموز إلى الأشياء وموضوعات العالم»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      expands:
        - text: "«ما يُجْعَل لِلدَّلِيلِ أو الدَّلَّالِ مـن الأُجْرَةِ»"
          source: "المعجم الكبير"
          addition: "معنى الأجرة"
        - text: "«فرع من اللسانيات معني بالمبادئ والقواعد»"
          source: "مسرد الإعلام والتواصل"
          addition: "علم الدلالة"
    - lemma: "علامة"
      confirm:
        - text: "«الأمارة وعلامة الشَّيْء مَا يعرف بِهِ»"
          source: "دستور العلماء للأحمدنكري"
        - text: "«ما يُسْتَدَلُّ به على الطريق من أثر»"
          source: "المعجم الوسيط"
        - text: "«حدث مُدرك، وبديل أشياء طبيعية أو عرفية أو اعتباطية بقيمة جملة»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
      peripheral_observations:
        - "السائل الأمنيوسي الذي يتدفق من عنق الرحم عند بدء الولادة"
    - lemma: "مؤشر"
      confirm:
        - text: "«ما يُشار به»"
          source: "المعجم الكبير"
        - text: "«علامة أو دليل على معنى مُضمر أو مدى أو درجة»"
          source: "مسرد الإعلام والتواصل"
        - text: "«خاصية كمية أو نوعية أو وصفية ، التي عند قياسها أو مراقبتها بشكل دوري، فإن النتائج تشير إلى اتجاه التغيير في معيار»"
          source: "مسرد المناخ والبيئة"
      peripheral_observations:
        - "في البرمجة ومعالجة المعلومات: متغيِّرٌ يتضمَّن موضعَ الذاكرةِ"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "إشارة"
      source_section: "step5_english_bridge"
      evidence_citation: "«أية علامة مصاحبة لكلام المتكلم تساعد على بيان المراد من كلامه» — مسرد الإعلام والتواصل"
      justification: "مصطلح يقابل (indication) ويدل على فعل لفت الانتباه أو الدلالة على شيء. (آلية التوليد: اشتقاق من الجذر)"
    - lemma: "أمارة"
      source_section: "step4_fts_keyword"
      evidence_citation: "«علامة تدل على هوية شيء ما» — مسرد الإعلام والتواصل"
      justification: "تستخدم للدلالة على الأشياء أو العلامات التي يسترشد بها. (آلية التوليد: اشتقاق)"
  knowledge_candidates:
    - lemma: "دليل"
      justification: "اشتقاق من الجذر (دلل)، ويدل على ما يُرشد أو يبين الشيء (indicator / sign)."

step1_lemma_validation:
  per_lemma:
    - lemma: "دلالة"
      decision: confirmed
      decision_reason: "مصطلح أساسي وفصيح يعبر بدقة عن معنى الإيحاء أو الإرشاد إلى المعنى."
      evidence_assessment:
        case: "expands"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تميل إلى البعد المعنوي والذهني، وما يقتضيه اللفظ أو الرمز من معانٍ."
      example: "لِهَذَا الرَّمْزِ دَلَالَةٌ وَاضِحَةٌ فِي النَّصِّ."
    - lemma: "علامة"
      decision: confirmed
      decision_reason: "لفظ شائع وفصيح يدل على الأثر الذي يُستدل به."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تميل إلى البعد المادي أو المحسوس الذي يوضع للاستدلال به على شيء ما."
      example: "ظَهَرَتْ عَلَيْهِ عَلَامَاتُ التَّعَبِ بَعْدَ الْعَمَلِ."
    - lemma: "مؤشر"
      decision: confirmed
      decision_reason: "مصطلح معاصر يستخدم بكثرة للدلالة على المعيار أو القياس."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تُستخدم غالباً في السياقات الكمية أو الإحصائية أو الفيزيائية للإشارة إلى تغير ما."
      example: "يُعَدُّ ارْتِفَاعُ الْأَسْعَارِ مُؤَشِّراً عَلَى التَّضَخُّمِ."
    - lemma: "إشارة"
      source: step05
      decision: confirmed
      decision_reason: "مرادف قوي لمفهوم الدلالة والإيحاء المستفاد من حركة أو فعل."
      step05_citation: "«أية علامة مصاحبة لكلام المتكلم تساعد على بيان المراد من كلامه» — مسرد الإعلام والتواصل"
      substitution_test:
        result: "pass"
      nuance_differentiation: "ترتبط بفعل مقصود أو غير مقصود لإيصال معنى معين، سواء حركياً أو حسياً."
      example: "أَعْطَاهُ إِشَارَةً سِرِّيَّةً لِلْبَدْءِ بِالتَّنْفِيذِ."
      actions:
        - command: create_entry
          params:
            lemma: "إشارة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06810027-n"
    - lemma: "أمارة"
      source: step05
      decision: confirmed
      decision_reason: "لفظ عربي فصيح يدل على العلامة أو الدليل الذي يستنبط منه شيء."
      step05_citation: "«علامة تدل على هوية شيء ما» — مسرد الإعلام والتواصل"
      substitution_test:
        result: "pass"
      nuance_differentiation: "علامة تظهر وتدل على شيء خفي أو مكنون قد لا يكون ظاهراً بوضوح."
      example: "تِلْكَ أَمَارَةٌ وَاضِحَةٌ عَلَى صِدْقِ نَوَايَاهُ."
      actions:
        - command: create_entry
          params:
            lemma: "أمارة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-06810027-n"
    - lemma: "دليل"
      source: step05
      decision: removed
      decision_reason: "بالرغم من صحته لغوياً، إلا أنه يميل أكثر لمعنى الحجة والبرهان الثابت وليس مجرد إشارة أو دلالة خفيفة كما يقتضي المفهوم."
      step05_citation: "اقتراح مبني على المعرفة اللغوية"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "إشارة"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense
    - lemma: "أمارة"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

