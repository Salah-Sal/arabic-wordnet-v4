step0_evidence:
  per_lemma:
    - lemma: "قدر"
      confirm:
        - text: "«القَدَرُ، محرَّكةً: القَضاءُ، والحُكْمُ، ومَبْلَغُ الشيءِ»"
          source: "القاموس المحيط"
        - text: "«القدر: بالسكون والحركة مرادف التقدير. قال في شرح العقائد النسفية أفعال العباد عند أهل السّنة كلها بإرادته تعالى وقضيته أي قضائه وتقديره.»"
          source: "كشّاف اصطلاحات الفنون والعلوم"
        - text: "«وَالْقَدْرُ: قَضَاءُ اللَّهِ تَعَالَى الْأَشْيَاءَ عَلَى مَبَالِغِهَا وَنِهَايَاتِهَا الَّتِي أَرَادَهَا لَهَا، وَهُوَ الْقَدَرُ أَيْضًا.»"
          source: "مقاييس اللغة"
      expands:
        - text: "«القدر: محركةً ما يقدره اللهُ من القضاء وعرفوه: بأنه تعلق الإرادة بالأشياء في أوقاتها»"
          source: "التعريفات الفقهيّة"
          addition: "ربط المفهوم بتوقيت الإرادة الإلهية"

    - lemma: "قضاء"
      confirm:
        - text: "«القضاء: لغةً الحكم، وفي الاصطلاح عبارة عن الحكم الكلي الإلهي في أعيان الموجودات على ما هي عليه»"
          source: "كتاب التعريفات للجرجاني"
        - text: "«الْقَضَاءُ عِبَارَةٌ عَنْ حُكْمٍ كُلِّيٍّ عَلَى أَعْيَانِ الْمَوْجُودَاتِ بِأَحْوَالٍ جَارِيَةٍ وَأَحْكَامٍ طَارِيَةٍ عَلَيْهَا مِنَ الْأَزَلِ إِلَى الْأَبَدِ»"
          source: "دستور العلماء"

    - lemma: "مصير"
      confirm:
        - text: "«(1) المصير (2) القضاء والقَدَر.»"
          source: "المورد الحديث (2008)"
        - text: "«مصير: قُوة خفية تدير دفة الشخصيات بطريقة أو بأخرى، تتحكم في حركة العالم بغض النظر عن فِعلنا في هذا العالم.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
      expands:
        - text: "«من (ص ي ر) بمعنى ما ينتهى إليه الأمر.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
          addition: "دلالة مآل الأمر وعاقبته"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "القسمة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) القِسْمة؛ النصيب: قَدَرُ المرء المقدورُ له أو عليه (2) المصير» — المورد الحديث"
      justification: "مصطلح عربي مستقر للتعبير عن الحظ أو النصيب المقدور للإنسان"
    - lemma: "النصيب"
      source_section: "step5_english_bridge"
      evidence_citation: "«fate: قسمة؛ نصيب؛ قَدَر» — المورد الحديث"
      justification: "يُستخدم للتعبير عن القدر المخصص لكل فرد"
  knowledge_candidates:
    - lemma: "المكتوب"
      justification: "مصطلح شاع في الثقافة واللغة العربية للتعبير عن القدر بوصفه أمراً كُتب سلفاً في اللوح المحفوظ ولا مفر منه."
  generation_notes: "المصطلحات العربية تتراوح بين المفاهيم العقائدية (قضاء وقدر) والمفاهيم الوجودية (مصير، مكتوب)"

