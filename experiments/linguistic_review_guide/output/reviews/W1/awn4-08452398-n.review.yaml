step0_evidence:
  per_lemma:
    - lemma: "منظومة"
      confirm:
        - text: "«المؤلفة المرتبة المضموم بعضها إلى بعض»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "نظام"
      confirm:
        - text: "«مجموعة من العناصر التي تتفاعل مع بعضها لتحقيق أهداف محددة.»"
          source: "معجم البيانات والذكاء الاصطناعي (2024)"
        - text: "«أيُّ جَمْعَةٍ من عناصرِ مكوِّناتٍ تَعملُ مجتمعةً لإنجاز مهمة ما.»"
          source: "معجم مصطلحات المعلوماتية (2000)"
      expands:
        - text: "«الخيط ينظم فيه اللؤلؤ وغيره والترتيب والاتساق»"
          source: "المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جهاز"
      source_section: "step4_fts_keyword"
      evidence_citation: "«جهاز أو مجموع» — المعاجم الموحدة (مكتب تنسيق التعريب)"
      justification: "وردت في المعاجم الموحدة كمرادف لتجمع من العناصر أو الأجزاء (System)."
  knowledge_candidates:
    - lemma: "نَسَق"
      justification: "مجاز (توسيع دلالي): استعير النسق (وهو انتظام الأشياء وتتابعها) للدلالة على مجموعة العناصر المترابطة التي تشكل كلاً موحداً (System)."
  generation_notes: "تم التركيز على المفردات التي تدل على الترابط الوظيفي والترتيب المنهجي."

step1_lemma_validation:
  per_lemma:
    - lemma: "منظومة"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع الاستخدام للدلالة على مجموعة متكاملة ومترابطة من العناصر، وهو ملائم دلالياً وصرفياً للمفهوم."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على النظام الذي تتآلف عناصره وتترابط بشكل متناسق كالخيط المنظوم، وتغلب في السياقات التقنية والأدبية المعاصرة."
      example: "تعمل منظومة الدفاع الجوي بكفاءة عالية للتصدي لأي اختراق."

    - lemma: "نظام"
      decision: confirmed
      decision_reason: "هو المصطلح الأساسي والأكثر شيوعاً للتعبير عن كيان مكون من أجزاء مترابطة تتفاعل معاً."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مصطلح أكثر عمومية وتجريداً، يعبر عن الترتيب والاتساق بين عناصر متعددة لتشكل كلاً موحداً (مثل النظام الشمسي، النظام الاقتصادي)."
      example: "يتكون النظام الشمسي من الشمس والكواكب التي تدور حولها."

    - lemma: "جهاز"
      source: step05
      decision: removed
      decision_reason: "مصطلح 'جهاز' يرتبط عادة بالآلات المادية أو الأعضاء البيولوجية (كالجهاز الهضمي أو الجهاز الحكومي) ولا يعبر بتجرد عن 'مجموعة عناصر مترابطة' مثلما يعبر مصطلح 'نظام'."
      step05_citation: "«جهاز أو مجموع» — المعاجم الموحدة (مكتب تنسيق التعريب)"
      substitution_test:
        result: "fail"

    - lemma: "نَسَق"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح يطلق على ما كان على نظام واحد، ويستخدم في السياقات الأكاديمية والعلمية للدلالة على 'system' (كأنساق المعرفة أو الأنساق اللغوية)."
      step05_citation: "اقتراح مبني على المعرفة اللغوية"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير بشكل خاص إلى انتظام الأشياء وتتابعها المنهجي، ويغلب استخدامه في السياقات الفلسفية واللسانية والرمزية."
      example: "يتطلب البحث العلمي المنهجي اتباع نسق واضح في عرض الأفكار."
      actions:
        - command: create_entry
          params:
            lemma: "نَسَق"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-08452398-n"

  added_lemmas:
    - lemma: "نَسَق"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

