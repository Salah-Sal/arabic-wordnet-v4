step0_evidence:
  per_lemma:
    - lemma: "وحدة"
      confirm:
        - text: "«الوحدة: الانفراد، والواحد الذي لا ينقسم بوجه لا فرضا ولا وهما ولا فعلا، ولا بينه وبين غيره نسبة بوجه. والواحد في الحقيقة الذي لا جزء له البتة البتة ثم يطلق على كل شيء موجود»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«عرّفوا الوحدة بكون الشيء بحيث لا ينقسم إلى أمور متشاركة في الماهية، سواء لم ينقسم أصلا كالواجب والنقطة وتسمّى وحدة حقيقية»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
      expands:
        - text: "«الوحدة اللغوية عنصر قابل للعزل ومحدد في مستوى معين من خلال العلاقات التي يربطها مع غيره من العناصر»"
          source: "المعجم الموحد لمصطلحات اللسانيات"
        - text: "«تتكوّن الوحدة في تكنولوجيا السيارات من جزء مُغلق، يتكوّن من مكونات ميكانيكية و/أو مكونات كهربائية وإلكترونية»"
          source: "مسرد هندسة وتكنولوجيا السيارات — ArabTerm"
    - lemma: "لبنة أساسية"
      evidence_status: "no_material_found"
      peripheral_observations:
        - text: "«اللَّبِنَة: واحدةُ اللبِن وهي المضروبة من الطين مربعاً للبناء» — التعريفات الفقهيّة للبركتي"
          source: "التعريفات الفقهيّة للبركتي"
          observation: "اللمّة هي تعبير مجازي مستمد من اللبنة (واحدة البناء الفيزيائي) ليُطلق على المفهوم المجرد"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "عنصر"
      source_section: "step4_fts_keyword"
      evidence_citation: "«كل شيء أو كل مفهوم يدخل في تكوين مجموعة ما» — المعجم الموحد لمصطلحات اللسانيات"
      justification: "كلمة عنصر تعبر بدقة عن الجزء المفرد الذي يدخل في تكوين الكل، وتطابق دلالة building block/unit"
    - lemma: "وحدة بنائية"
      source_section: "step9_specialized"
      evidence_citation: "«وحدة بنائية تتألف من مُكوّن واحد أو مجموعة من المُكوّنات الخاصة في شبكة» — المعجم الموحد لمصطلحات المياه"
      justification: "مصطلح تقني مستقر يعبر عن مفهوم اللبنة أو الوحدة في سياق تركيبي"
  knowledge_candidates:
    - lemma: "مكون"
      justification: "آلية الاشتقاق (اسم فاعل من الفعل كوّن). يدل على ما يدخل في تكوين الشيء وأجزائه الأساسية."
    - lemma: "كتلة بناء"
      justification: "آلية التركيب (إضافي). ترجمة مصطلحية شائعة في العلوم للمصطلح الإنجليزي Building block."

step1_lemma_validation:
  per_lemma:
    - lemma: "وحدة"
      decision: confirmed
      decision_reason: "أدلة معجمية قوية تؤكد المعنى الدلالي للانفراد وعدم التجزؤ والدخول في تركيب الكل."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أعم اللمّات وأكثرها تجريداً، تدل على الواحد المستقل الذي لا يتجزأ."
      example: "تعتبر الخلية هي وحدة البناء والوظيفة الأساسية في أجسام الكائنات الحية."

    - lemma: "لبنة أساسية"
      decision: confirmed
      decision_reason: "تعبير اصطلاحي مستقر (MWE) شائع في العربية المعاصرة كاستعارة لمفهوم building block."
      evidence_assessment:
        case: "no_material"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تعبير مجازي يؤكد على الدور التأسيسي والحيوي للعنصر في البناء الكلي."
      example: "يشكل هذا الاتفاق لبنة أساسية في جهود إحلال السلام في المنطقة."

    - lemma: "عنصر"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر في المعاجم التقنية واللسانية يعبر عن الجزء المكون للمجموعة."
      step05_citation: "«المادة التي تدخل في تكون جسم ما» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الجانب التركيبي والأولي (الأصل) الذي تتألف منه الأشياء."
      example: "يعتبر الصدق عنصراً جوهرياً في تكوين الشخصية النزيهة."
      actions:
        - command: create_entry
          params:
            lemma: "عنصر"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09488589-n"

    - lemma: "مكون"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل مشتق يدل على المشاركة الفعالة في التكوين، شائع تقنياً."
      step05_citation: "«عنصر مسؤول عن بعض الوظائف الداخلية... يترابط مع عناصر أخرى للقيام ككل» — المعجم الموحد لمصطلحات تقانة المعلومات"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الوظيفة والترابط البنيوي داخل النظام."
      example: "المعالج هو المكون الأهم في اللوحة الأم للحاسوب."
      actions:
        - command: create_entry
          params:
            lemma: "مكون"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09488589-n"

    - lemma: "وحدة بنائية"
      source: step05
      decision: confirmed
      decision_reason: "تركيب وصفي مستقر في الأدبيات العلمية العربية المعاصرة."
      step05_citation: "«وحدة بنائية تتألف من مُكوّن واحد أو مجموعة من المُكوّنات» — المعجم الموحد لمصطلحات المياه"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "تخصيص لوحدة في سياق البناء أو الهندسة أو النظم."
      example: "تعمل كل وحدة بنائية في النظام بشكل مستقل لضمان كفاءة الأداء."
      actions:
        - command: create_entry
          params:
            lemma: "وحدة بنائية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09488589-n"

    - lemma: "كتلة بناء"
      source: step05
      decision: removed
      decision_reason: "تركيب وصفي أقرب للترجمة الحرفية (Building block)، وتوجد بدائل عربية أكثر أصالة مثل «لبنة أساسية» أو «عنصر»."
      step05_citation: "«وحدة فردية واحدة... تستخدمها برامج أو نسيقات أعلى مستوى» — معجم مصطلحات المعلوماتية"

