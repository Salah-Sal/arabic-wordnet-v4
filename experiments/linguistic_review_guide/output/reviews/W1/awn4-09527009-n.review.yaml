      nuance_differentiation: "تشير إلى الحيز أو النطاق الكلي الذي تقع فيه هذه الظواهر، وتجمع بين البعد الفلسفي والخيالي."
      example: "أصبح اهتمام الناس بظواهر ما وراء الطبيعة يتزايد مع انتشار القصص الغامضة."

    - lemma: "خوارق"
      source: "step05"
      decision: "confirmed"
      decision_reason: "جمع 'خارقة' وهو اللفظ التراثي والمعاصر الأدق لوصف 'الأحداث' و'الظواهر' الخارقة للطبيعة."
      step05_citation: "«الخارق: كلُّ ما خرج عن العادة، ما يخرق نظامَ الطبيعة كالمعجزات» — معجم اللغة العربية المعاصرة"
