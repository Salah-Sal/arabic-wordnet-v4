      example: "تتناول الرواية صراعاً بين البشر والغيبيات في عالم موازٍ."

    - lemma: "قوى خارقة"
      decision: "confirmed"
      decision_reason: "تعبير مستقر لوصف الجانب الفاعل (Forces) في المفهوم الخارق للطبيعة."
