step0_evidence:
  per_lemma:
    - lemma: "غيبيات"
      confirm:
        - text: "«الغيبُ: خلاف الشهادة، وكل ما غاب عن الإنسان.» — موسوعة السلطان قابوس"
          source: "موسوعة السلطان قابوس لأسماء العرب"
        - text: "«(1) ميتافيزيقيّ؛ ما ورائيّ؛ غيبيّ.» — المورد الحديث"
          source: "المورد الحديث"
      expands:
        - text: "«الملكوت في اصطلاح الصوفية هو عالم الأرواح وعالم الغيب وعالم المعنى.» — كشاف اصطلاحات الفنون"
          source: "كشاف اصطلاحات الفنون"
          addition: "ربط الغيب بالعوالم الروحانية المجردة (الملكوت)."

    - lemma: "قوى خارقة"
      confirm:
        - text: "«خارِق للطبيعة: supernatural powers» — المورد الحديث"
          source: "المورد الحديث"
        - text: "«الخارق: ما خالف العادة.» — المعجم الوسيط"
          source: "المعجم الوسيط"
      expands:
        - text: "«خارق للطبيعة: مُتَعَذِّرٌ تعليلُهُ علميًّا.» — المورد الحديث"
          source: "المورد الحديث"
          addition: "تحديد معيار الخوارق بتعذر التعليل العلمي."

    - lemma: "ما وراء الطبيعة"
      confirm:
        - text: "«ما وراء الطبيعة: عالم الغيب، الميتافيزيقا.» — معجم اللغة العربية المعاصرة"
          source: "معجم اللغة العربية المعاصرة"
        - text: "«الميتافيزيقا: ما وراء الطبيعة.» — المورد الحديث"
          source: "المورد الحديث"
      expands:
        - text: "«ما وراء الطبيعة: شعبة من الفلسفة تشمل علم الوجود وعلم أصل الكون وتكوينه.» — المورد الحديث"
          source: "المورد الحديث"
          addition: "البعد الفلسفي الأكاديمي للمصطلح."

step05_lemma_generation:
