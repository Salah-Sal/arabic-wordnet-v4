      evidence_citation: "«خوارق العادات: ما خالف العادة وهو معجز» — المعجم الوسيط"
      justification: "اللفظ يدل على الأحداث والظواهر التي تتجاوز القوانين الطبيعية، وهو جمع يمثل المفهوم الكلي المقصود في التعريف."
