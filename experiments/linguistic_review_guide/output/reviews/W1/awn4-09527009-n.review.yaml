      example: "يعتقد البعض بامتثال الأهرامات لقوى خارقة لم تُكتشف أسرارها بعد."

    - lemma: "ما وراء الطبيعة"
      decision: "confirmed"
      decision_reason: "المصطلح الأكثر شمولاً وتداولاً في السياقات الفلسفية والأدبية للمفهوم."
