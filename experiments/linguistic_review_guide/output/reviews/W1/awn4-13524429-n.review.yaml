step0_evidence:
  per_lemma:
    - lemma: "عملية غير عكوسة"
      confirm:
        - text: "«عمليات غير عكوسة: تغيّرات تطرأ على الطاقة الكامنة للمادة الكيميائية، ولا يمكن عكسها خلال العملية الكهركميائية.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
        - text: "«غير عكوس: لا يُقْلب أو يُعكَس irreversible cushions.»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«عكوس: الأقمشة التي تبدو غير متساوية، وخصوصًا النسيج ذي الوجهين...»"
          source: "مسرد صناعة النسيج (ArabTerm)"
          addition: "استعمال المصطلح في سياقات صناعية متخصصة تدل على قابلية القلب (reversibility)"

