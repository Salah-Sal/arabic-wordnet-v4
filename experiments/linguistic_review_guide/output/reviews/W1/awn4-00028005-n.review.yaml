step0_evidence:
  per_lemma:
    - lemma: "شكل"
      confirm:
        - text: "«الشَّكْلُ: [...] صُورَةُ الشيءِ المَحْسوسَةُ والمُتَوَهَّمَةُ» — القاموس المحيط للفيروزآبادي"
        - text: "«هيئة حاصلة للجسم بسبب إحاطة حد واحد بالمقدار كما في الكرة، أو حدود كما في المضلعات» — التوقيف على مهمات التعاريف للمناوي"
      expands:
        - text: "«مَا يُحِيط بِهِ حد أَو حُدُود» — معجم مقاليد العلوم للسيوطي"
        - text: "«ما يوافقك ويصلح لك. يقال: هذا من شكلي» — المعجم الوسيط"
    - lemma: "هيئة"
      confirm:
        - text: "«الهَيْئَةُ [...] حالُ الشَّيءِ، وكَيْفِيَّتُه» — القاموس المحيط للفيروزآبادي"
        - text: "«الحال التى يكون عليها الشىءُ محسوسةً كانت أو معقولة» — المعجم الوسيط"
      expands:
        - text: "«الجماعة من الناس يعهد إليها بعمل خاص» — المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "صورة"
      source_section: "knowledge_candidates"
      evidence_citation: "«الشكل والهيئة والصورة والند في الجنسية» — التوقيف على مهمات التعاريف للمناوي"
      justification: "وردت في المعاجم مقترنة بالشكل والهيئة، وهي تقابل المادة (substance) في الاصطلاح الفلسفي مما يطابق التعريف بدقة."
  knowledge_candidates:
    - lemma: "تكوين"
      justification: "اشتقاق (مصدر) من الفعل كوّن، يدل على طريقة تركيب أجزاء الشيء وترتيبها المكاني."

step1_lemma_validation:
  per_lemma:
    - lemma: "شكل"
      decision: confirmed
      decision_reason: "مصطلح أساسي وفصيح يطابق التعريف تماماً."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الإحاطة الخارجية والمكانية للشيء وحدوده."
      example: "اتخذت السحب في السماء شكلاً هندسياً عجيباً."
    - lemma: "هيئة"
      decision: confirmed
      decision_reason: "مصطلح فصيح يطلق على الحالة التي يكون عليها الشيء."
      evidence_assessment:
        case: "mixed"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تدل على الحالة العامة للشيء ووضعيته الكلية، وقد تشمل الهيئة المعقولة والمحسوسة بخلاف الشكل الذي يميل للمحسوس."
      example: "بدا المبنى الجديد بهيئة معمارية فريدة."
    - lemma: "صورة"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح يطابق التعريف العلمي والفلسفي (الصورة مقابل المادة)."
      step05_citation: "«الشكل والهيئة والصورة والند في الجنسية» — التوقيف على مهمات التعاريف للمناوي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تستخدم في السياق الفلسفي للدلالة على الماهية أو التشكيل المجرّد للشيء المتميز عن مادته الجوهرية."
      example: "يتكون كل جسم مادي في الفلسفة القديمة من مادة وصورة."
      actions:
        - command: create_entry
          params:
            lemma: "صورة"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00028005-n"
    - lemma: "تكوين"
      source: step05
      decision: removed
      decision_reason: "يفيد العملية نفسها (الفعل) أو البنية الداخلية أكثر من الترتيب المكاني المجرد المتميز عن المادة."
      step05_citation: "اشتقاق (مصدر) من الفعل كوّن، يدل على طريقة تركيب أجزاء الشيء وترتيبها المكاني."
  added_lemmas:
    - lemma: "صورة"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense

