step0_evidence:
  per_lemma:
    - lemma: سَبَبِيَّة
      confirm:
        - text: "العلاقة بين السبب والمسبب"
          source: المعجم الوسيط
        - text: "العلاقة بين السَّبَب والـمسبَّب اتجاه فلسفيٌّ يُراد به أَنَّ لكلِّ ظاهرة سببًا يُحدِثها أو يؤثِّر فيها"
          source: المعجم الكبير

step05_lemma_generation:
  evidence_candidates:
    - lemma: عِلِّيَّة
      source_section: step5_english_bridge
      evidence_citation: "«السَّبَبيّة؛ العِلِّيّة.» — المورد الحديث (2008)"
      justification: "مقابل عربي مباشر للمصطلح الإنجليزي causality، وهو مرادف دقيق يُستخدم في الفلسفة والعلوم لوصف العلاقة بين العلة والمعلول (المجاز: نقل من العلة)."
  knowledge_candidates:
    - lemma: تَسْبِيب
      justification: "مصدر مشتق (تفعيل) يدل على إحداث السبب أو بيان الأسباب، يُستخدم أحياناً كمرادف في السياقات القانونية والطبية (causation)."

step1_lemma_validation:
  per_lemma:
    - lemma: سَبَبِيَّة
      decision: confirmed
      decision_reason: أدلة مؤكدة من المعاجم المعاصرة والمختصة
      evidence_assessment:
        case: confirm_only
      substitution_test:
        result: pass
      nuance_differentiation: اللفظ الأشهر والأكثر تداولاً للدلالة على العلاقة بين الأسباب والنتائج في مختلف العلوم
      example: "يقوم المنهج العلمي على مبدأ السَّبَبِيَّةِ في تفسير الظواهر الطبيعية."
      actions: []

    - lemma: عِلِّيَّة
      source: step05
      decision: confirmed
      decision_reason: مرادف معجمي معتمد في المعاجم ثنائية اللغة ومسارد الفلسفة
      step05_citation: "«السَّبَبيّة؛ العِلِّيّة.» — المورد الحديث (2008)"
      substitution_test:
        result: pass
      nuance_differentiation: يتميز عن السببية بكونه اصطلاحاً فلسفياً وتراثياً أعمق (العلاقة بين العلة والمعلول) وهو أخص في الاستعمال الفلسفي
      example: "يناقش الفلاسفة مبدأ العِلِّيَّةِ في ارتباط النتائج بمقدماتها الحتمية."
      actions:
        - command: create_entry
          params:
            lemma: عِلِّيَّة
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: awn4-13802818-n

    - lemma: تَسْبِيب
      source: step05
      decision: removed
      decision_reason: "التسبيب يدل على فعل الفاعل (إبداء الأسباب أو إحداث السبب) وليس العلاقة المجردة بحد ذاتها، فلا يطابق تعريف المجموعة تماماً"
      step05_citation: المعرفة اللغوية

  added_lemmas:
    - lemma: عِلِّيَّة
      reason: مرادف مصطلحي دقيق مكمل لـ (سببية)
      via_command: create_entry + add_sense

