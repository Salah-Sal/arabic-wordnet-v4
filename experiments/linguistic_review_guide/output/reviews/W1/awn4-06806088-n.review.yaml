    reason: "التعريف الحالي ترجمة حرفية للأصل الإنجليزي (a public display)، ومن الأفضل صياغة تعريف يعكس الوسيط المادي أو المرئي الذي يحمل الرسالة كما ورد في المعاجم العربية."
  authored_definitions:
    - type: terminological
      text: "ما يُعرض للعموم من لوحات ونحوها لنقل رسالة أو معلومة أو إشهار."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
