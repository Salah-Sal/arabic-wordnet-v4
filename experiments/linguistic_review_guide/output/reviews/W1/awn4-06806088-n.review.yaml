step0_evidence:
  per_lemma:
    - lemma: "إعلان"
      confirm:
        - text: "«إظهار الشيء بالنشر عنه فى الصحف ونحوها. (محدثة)»"
          source: "المعجم الوسيط"
        - text: "«إخبار العموم أو فئة مخصوصة بنشاط أو حدث.»"
          source: "مسرد الإعلام والتواصل"
      expands:
        - text: "«يكون الإعلان في صفحات ويب على شكل مساحة مستطيلة الشكل، ذات عدد محدد من البيكسلات، أو صورة، محدودة الحجم. وغالباً ما يكون متحركاً»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"
    - lemma: "لافتة"
      confirm:
        - text: "«لوحة من خشب ونحوه يكتب عليها اسم أو شِعَارٌ لتوجيه النظر إليه (محدثة)»"
          source: "المعجم الوسيط"
      expands:
        - text: "«منطقة من صفحة موقع على الشبكة الدولية تستعمل عادة للإعلانات الإشهارية»"
          source: "المعجم الموحد لمصطلحات تقانة (تكنولوجيا) المعلومات (2011)"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "علامة"
      source_section: "step5_english_bridge"
      evidence_citation: "«حدث مُدرك، وبديل أشياء طبيعية أو عرفية أو اعتباطية بقيمة جملة مثل علامة الصيدلية.» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      justification: "وردت في المعاجم المتخصصة كترجمة لمصطلح (sign) بالمعنى الدال على الإشارة أو الدليل."
  knowledge_candidates:
    - lemma: "يافطة"
      justification: "تعريب شائع (من التركية) استخدمت في العصر الحديث للدلالة على اللوحة التي تُعلّق وتُعرض للعامة وتحمل اسماً أو إعلاناً."
  generation_notes: "المفهوم يدل على الوسيط المادي (أو الرقمي) الذي يحمل الرسالة الموجهة للعامة."

step1_lemma_validation:
  per_lemma:
    - lemma: "إعلان"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر يدل على إظهار رسالة للعموم، ويتناسب مع المفهوم."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على المحتوى الإخباري أو الإشهاري للرسالة الموجهة للعموم."
      example: "عُلِّق إعلان على لوحة الإعلانات في الجامعة يوضح شروط التسجيل."
    - lemma: "لافتة"
      decision: confirmed
      decision_reason: "مصطلح فصيح ومستقر، ويُعبّر بدقة عن اللوحة أو الوسيط المادي الذي يحمل رسالة لافتة للانتباه."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الوسيط المادي أو المرئي (اللوحة) المستخدم لعرض الرسالة ولفت الأنظار إليها."
      example: "رفع المتظاهرون لافتة كبيرة تطالب بحقوقهم المهنية."
    - lemma: "علامة"
      source: step05
      decision: removed
      decision_reason: "المصطلح أعم من المطلوب، إذ يشير إلى أي رمز أو إشارة دالة، وليس بالضرورة عرضاً عاماً لرسالة."
      step05_citation: "«حدث مُدرك، وبديل أشياء طبيعية أو عرفية أو اعتباطية بقيمة جملة مثل علامة الصيدلية.» — المعجم الموحد لمصطلحات اللسانيات (2002)"
      substitution_test:
        result: "fail"
      nuance_differentiation: "تدل على الرمز أو الإشارة بشكل عام."
    - lemma: "يافطة"
      source: step05
      decision: removed
      decision_reason: "لفظة أجنبية الأصل، واللفظة الفصيحة 'لافتة' تغني عنها وتؤدي المعنى نفسه بدقة."
      step05_citation: "المعرفة اللغوية العامة"
      substitution_test:
        result: "pass"
      nuance_differentiation: "مرادفة للافتة ولكنها غير فصيحة."
  synset_flags:
    definition_review_needed: true

