step0_evidence:
  per_lemma:
    - lemma: "سلالة"
      confirm:
        - text: "«جماعةٌ من الكائنات الحية تتفق في صفاتها العرفية الموروثة» — المعجم الوسيط"
        - text: "«جماعة من الكائنات الحيَّة تَتَّفق فى صفاتها العِرْقِيَّة الموروثة» — المعجم الكبير"
      expands:
        - text: "«مجموعة متميزة ضمن الأنواع أو الأنواع المتفرعة» — مسرد المناخ والبيئة (ArabTerm)"
          addition: "تحديد النطاق الحيوي ضمن الأنواع."

    - lemma: "عرق"
      confirm:
        - text: "«مجموعة متميزة مظهريا ونوعيا ومكونة من أفراد استوطنوا منطقة جغرافية أو بيئية معينة ولهم خصائص ظاهرية وتردد جينيّ يميزهم عن المجموعات الأخرى» — المعجم الموحد لمصطلحات علم الوراثة"
        - text: "«مجموعة بشرية تتميز بخصائص تاريخية أو جغرافية أو سُلالية معينة» — مسرد الإعلام والتواصل (ArabTerm)"
      peripheral_observations:
        - lemma: "عرق"
          meaning: "رَشْحُ جِلْدِ الحَيَوانِ (العَرَق)"
          source: "القاموس المحيط"
        - lemma: "عرق"
          meaning: "عرق الشجر (العِرْق)"
          source: "معجم البلدان"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "جنس"
      source_section: "step5_english_bridge"
      evidence_citation: "«عِرق؛ جنس؛ عُنْصر» — المورد الحديث (في ترجمة race)"
      justification: "الجنس يُستخدم في المعاجم العربية للدلالة على النوع أو الطبقة التصنيفية للبشر."
  knowledge_candidates:
    - lemma: "عنصر"
      justification: "توليد بالاشتقاق (أو استخدام دلالي شائع)؛ يُستخدم مصطلح 'العناصر البشرية' أو 'العناصر العرقية' للدلالة على المكونات السلالية للمجتمع."
  generation_notes: "التعريف يركز على الأصل الجيني الموحد، وهو ما تغطيه اللمات الحالية مع الحاجة لإضافة 'جنس' و'عنصر' لشيوعهما."

