step3_definition:
  definition_review_flag: false
  current_definition: "مجموعة من العناصر يكون فيها الجمع والضرب تبادليين وتجميعيين، ويكون الضرب توزيعياً على الجمع، ويوجد فيها عنصران 0 و 1"
  assessment:
    decision: revise
    reason: "التعريف الحالي ناقص من الناحية الرياضية؛ فالحقل يشترط وجود معكوس ضربي لكل عنصر غير صفري، وهو ما يميزه عن الحلقة (Ring)."
  authored_definitions:
    - type: terminological
      text: "بنية جبرية تتكون من مجموعة مزودة بعمليتي الجمع والضرب، تكون كل منهما تجميعية وتبادلية، والضرب توزيعي على الجمع، وتحوي عنصراً محايداً جمعياً (0) وعنصراً محايداً ضربياً (1)، ولكل عنصر غير صفري فيها معكوس ضربي."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        passed: true
  actions:
    - command: update_definition
      params:
        synset_id: "awn4-08021702-n"
        definition_index: 0
        text: "بنية جبرية تتكون من مجموعة مزودة بعمليتي الجمع والضرب، تكون كل منهما تجميعية وتبادلية، والضرب توزيعي على الجمع، وتحوي عنصراً محايداً جمعياً (0) وعنصراً محايداً ضربياً (1)، ولكل عنصر غير صفري فيها معكوس ضربي."

