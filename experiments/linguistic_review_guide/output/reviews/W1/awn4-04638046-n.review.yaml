step0_evidence:
  per_lemma:
    - lemma: "انشراح"
      confirm:
        - text: "«انشِرَاح من (ش ر ح) سرور الصدر بالشيء والإقبال عليه.»"
          source: "موسوعة السلطان قابوس لأسماء العرب"
    - lemma: "بشاشة"
      confirm:
        - text: "«البشاشة والطلاقة والدحاثة واللباقة والظرافة والهشاشة واللطافة والبشر ولين الجانب والتهلل وخفة الروح والحلاوة»"
          source: "الألفاظ المختلفة في المعاني المؤتلفة لابن مالك"
    - lemma: "بهجة"
      confirm:
        - text: "«البَهْجَةُ: الحُسْنُ ... وكخَجِلَ: فَرِحَ ... والابْتِهاجُ: السُّرورُ.»"
          source: "القاموس المحيط للفيروزآبادي"
        - text: "«البهجة: حسن اللون وظهور السرور، ومنه {حَدَائِقَ ذَاتَ بَهْجَةٍ} . وابتهج بالشيء سر سرورا بان أثره على وجهه.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«في الإنسان : ضَحِكُ أساريرِ الوَجْه , أو ظُهورُ الفَرَح»"
          source: "المعجم الكبير"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مَرَح"
      source_section: "step4_fts_keyword"
      evidence_citation: "«الْمَرَحُ: شِدَّةُ الفرح أو النَّشاط» — المعجم الوسيط"
      justification: "كلمة معبرة عن شدة السرور والنشاط الدال على البهجة (استخراج من الأدلة المعجمية)."
    - lemma: "ابْتِهَاج"
      source_section: "step5_english_bridge"
      evidence_citation: "«ابْتِهَاج من (ب ه ج) الفرح والسرور.» — موسوعة السلطان قابوس لأسماء العرب"
      justification: "تتقاطع مع جذر (بهج) وتعبر عن حالة السرور (استخراج من الجسر الإنجليزي)."
  knowledge_candidates:
    - lemma: "سُرُور"
      justification: "السرور هو اللفظ العام الشامل لانشراح الصدر والارتياح الداخلي (اشتقاق من جذر سرر)."
  generation_notes: "المفاهيم تتراوح بين الحالة الداخلية (سرور، انشراح) وما يظهر على الملامح والسلوك (بشاشة، مرح، بهجة)."

step1_lemma_validation:
  per_lemma:
    - lemma: "انشراح"
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر بدقة عن حالة اتساع الصدر للسرور."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الانشراح يركز على اتساع الصدر والشعور الداخلي بالارتياح وتقبل السرور."
      example: "غمر الانشراحُ صدره عندما سمع الأخبار السارة."

    - lemma: "بشاشة"
      decision: confirmed
      decision_reason: "مصطلح عربي أصيل ومستعمل بكثرة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "البشاشة ترتبط بطلاقة الوجه وتهلله عند اللقاء والتبسم، أكثر من مجرد الإحساس الداخلي."
      example: "استقبل الضيوف ببشاشة وابتسامة عريضة."

    - lemma: "بهجة"
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع، له جذور قرآنية ومعجمية قوية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "البهجة تتضمن معنى الحسن والنضارة بجانب السرور الذي يظهر أثره بوضوح."
      example: "أضفت الزينة بهجةً على قاعة الاحتفال."

    - lemma: "مَرَح"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح يعبر عن البهجة المصحوبة بالنشاط وخفة الروح."
      step05_citation: "«الْمَرَحُ: شِدَّةُ الفرح أو النَّشاط» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "المرح يغلب عليه شدة النشاط وخفة الروح المصاحبة للسرور."
      example: "امتلأ قلب الطفل بالمرح وهو يلهو في الحديقة."
      actions:
        - command: create_entry
          params:
            lemma: "مَرَح"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04638046-n"

    - lemma: "ابْتِهَاج"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح ومناسب لكونه يعبر عن الشعور بالبهجة والتلبس بها."
      step05_citation: "«ابْتِهَاج من (ب ه ج) الفرح والسرور.» — موسوعة السلطان قابوس لأسماء العرب"
      substitution_test:
        result: "pass"
      nuance_differentiation: "الابتهاج يدل على الدخول في حالة البهجة والشعور العارم بها."
      example: "عمت حالة من الابتهاج بين الحضور بعد إعلان النتائج."
      actions:
        - command: create_entry
          params:
            lemma: "ابْتِهَاج"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04638046-n"

    - lemma: "سُرُور"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح وشائع جداً للتعبير عن الفرح الداخلي."
      step05_citation: "«السُّرُورُ: ارتياح في القلب عند حصول نفع أو توقعه أو اندفاع ضرر» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "السرور هو الإحساس الداخلي الخالص بالارتياح، وقد لا يصاحبه بالضرورة نشاط ظاهري كالمرح."
      example: "أدخلت الهدية السرور إلى قلبه."
      actions:
        - command: create_entry
          params:
            lemma: "سُرُور"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04638046-n"

  synset_flags:
    definition_review_needed: true

  added_lemmas:
    - lemma: "مَرَح"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "ابْتِهَاج"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "سُرُور"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

