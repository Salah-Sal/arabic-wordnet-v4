    - lemma: "حَادِثَة"
      source_section: "step5_english_bridge"
      evidence_citation: "«الحادثة: مؤنث الحادث النائبة» — المعجم الوسيط"
      justification: "اشتقاق: تدل على الحدث الذي يقع (اسم فاعل)، وهي قريبة جداً من كلمة واقعة."
  knowledge_candidates:
    - lemma: "ظَاهِرَة طَبِيعِيَّة"
      justification: "تركيب وصفي يطلق على كل حدث يقع في الطبيعة ويدرك بالحواس (مثل المطر أو الكسوف)."
  generation_notes: "المصطلحات تدور حول المظاهر والأحداث التي لا إرادة للإنسان في وقوعها، بل تجري وفق قوانين الطبيعة."

