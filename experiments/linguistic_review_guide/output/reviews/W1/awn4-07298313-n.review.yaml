step0_evidence:
  per_lemma:
    - lemma: "حَدَث طَبِيعِيّ"
      evidence_status: "no_material_found"
    - lemma: "حُدُوث"
      confirm:
        - text: "«الحُدُوث: عبارة عن وجود الشيء بعد عدمه.»"
          source: "كتاب التعريفات للشريف الجرجاني"
        - text: "«الحُدُوثُ: كَون الْوُجُود مَسْبُوقا بِالْعدمِ، وَقيل: هُوَ الْخُرُوج من الْعَدَم.»"
          source: "معجم مقاليد العلوم للسيوطي"
    - lemma: "وَاقِعَة"
      confirm:
        - text: "«(فِي الفلسفة) مَا حدث وَوجد»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
      expands:
        - text: "«الْقِيَامَة والنازلة من صروف الدَّهْر والمصادمة وَهِي اسْم من الْوَقْعَة بِالْحَرْبِ»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
          addition: "استعمالها في النوازل والحروب والقيامة"

step05_lemma_generation:
