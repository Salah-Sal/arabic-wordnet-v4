step0_evidence:
  per_lemma:
    - lemma: "هيولي"
      confirm:
        - text: "«الهيولى: لفظ يوناني بمعنى الأصل والمادة. واصطلاحا: جوهر في الجسم قابل لما يعرض لذلك الجسم من الاتصال والانفصال محل للصورتين الجسمية والنوعية.»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«و (عِنْد القدماء) مَادَّة لَيْسَ لَهَا شكل وَلَا صُورَة مُعينَة قَابِلَة للتشكيل والتصوير فِي شَتَّى الصُّور وَهِي الَّتِي صنع الله تَعَالَى مِنْهَا أَجزَاء الْعَالم المادية»"
          source: "المعجم الوسيط"
        - text: "«وشبه الأوائل طينة العالم به .. موصوف بما يصف به أهل التوحيد الله تعالى أنه موجود بلا كمية وكيفية .. والهيولى عند الحكماء شيء قابل للصور مطلقاً من غير تخصيص بصورة معينة ويسمى بالمادة.»"
          source: "تكملة المعاجم العربية لرينهارت دوزي"
      expands:
        - text: "«الهيولى: cytoplasm»"
          source: "المعجم الطبي الموحد (2009)"
          addition: "استعمال حديث في علم الأحياء (الخلوية)"

    - lemma: "مادة أولية"
      confirm:
        - text: "«مادة أولية — first matter»"
          source: "مسرد الفلسفة وعلم النفس (ArabTerm)"
      expands:
        - text: "«المواد الخام الأولية وهي موارد طبيعية لم تخضع لأية معالجة غير الاستخراج من موقعها الطبيعي.»"
          source: "المعجم الموحد لمصطلحات الطاقة المتجددة (1996)"
          addition: "المعنى الاقتصادي/الصناعي (raw material)"

