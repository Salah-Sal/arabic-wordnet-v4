step0_evidence:
  per_lemma:
    - lemma: "مادة نباتية"
      confirm:
        - text: "«شكل صيدلاني يحصل عليه من معالجة مادة نباتية أو حيوانية بسائل ثم تبخيره» — المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«مادة نباتية المصدر متطايرة، قد تضم كحولات وألدهيدات وتربينات ذات روائح عطرية مميزة» — المعجم الموحد لمصطلحات علم الصيدلة (2009)"
        - text: "«صبغ معد من مادة حيوانية أو نباتية ملونة متحدة مع بعض المركبات الفلزية» — المورد الحديث (2008)"
      expands:
        - text: "«كوتين (مادة نباتية)» — المعجم الطبي الموحد (2009)"
          addition: "يؤكد استخدام المصطلح كواصف فئوي للمواد الكيميائية ذات المنشأ النباتي."

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مادة عضوية"
      source_section: "step4_fts_keyword"
      evidence_citation: "«تنتجها النباتات والحيوانات، كما تنتج عن تحلل الأجسام الميتة، نباتية أو حيوانية» — مسرد المناخ والبيئة (ArabTerm)"
      justification: "ترد في سياق المواد التي تنتجها النباتات، وإن كانت أعم من المفهوم المطلوب لاشتمالها على المواد الحيوانية."
  knowledge_candidates:
    - lemma: "نسيج نباتي"
      justification: "آلية التوليد: التركيب (الوصفي). يعبر عن المادة البنيوية للنبات، ويستخدم بكثرة في السياقات العلمية."
    - lemma: "خامة نباتية"
      justification: "آلية التوليد: التركيب (الوصفي). يستخدم للإشارة للمادة النباتية كمورد خام."
  generation_notes: "المصطلح الأصلي 'مادة نباتية' هو الترجمة الأدق والأكثر شيوعاً في المعاجم العلمية الحديثة."

