step0_evidence:
  per_lemma:
    - lemma: "فاصل زمني"
      confirm:
        - text: "«هو الفاصل الزمني بين تحرك القطار ووصول القطار القادم المضاد على نفس القضيب»"
          source: "المعجم الموحد لمصطلحات النقل"
      expands:
        - text: "«الزمن الفاصل بين التقاط صورتين متتاليتين»"
          source: "المعجم الموحد لمصطلحات الاستشعار عن بعد"
    - lemma: "فترة"
      confirm:
        - text: "«المدة تقع بين زمنيْن أو نبيين»"
          source: "المعجم الوسيط"
        - text: "«كما أوردتها المعاجم الحديثة بمعنى القطعة من الزمن طالت أو قصرت»"
          source: "معجم الصواب اللغوي لأحمد مختار عمر"
      expands:
        - text: "«فترةُ الحُمَّى: زمن سكونها بين نوبتين»"
          source: "المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مدة زمنية"
      source_section: "step5_english_bridge"
      evidence_citation: "«مدة زمنية ( لمقياس زمنى مستمر)» — موسوعة الكهرباء (IEC 60050)"
      justification: "مصطلح شائع لتمثيل الامتداد الزمني ويقابل interval في بعض المعاجم."
  knowledge_candidates:
    - lemma: "مُدَّة"
      justification: "مجاز مرسل (علاقة كلية/جزئية): تطلق المدة على مطلق الزمان، وتخصص بالتقييد أو السياق لتدل على فاصل بين لحظتين."
  generation_notes: "المفهوم يعبر عن المسافة الزمنية بين نقطتين (زمنين)، والألفاظ الدالة عليه تدور حول القطع (فاصل) أو السكون بين حركتين (فترة)."

step1_lemma_validation:
  per_lemma:
    - lemma: "فاصل زمني"
      decision: confirmed
      decision_reason: "مصطلح تقني ووظيفي دقيق يعبر عن المسافة الزمنية بين حدثين أو لحظتين، وهو شائع الاستعمال."
      evidence_assessment:
        case: "confirm_only"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على البعد الانفصالي والمسافة البينية بين حدثين، ويكثر استعماله في السياقات العلمية والتقنية للإشارة إلى ما يفصل بين وحدتين."
      example: "انطلق المتسابقون بفاصل زمني قدره دقيقة واحدة."
    - lemma: "فترة"
      decision: confirmed
      decision_reason: "لفظ فصيح من أصل اللغة يدل على ما يقع بين نبيين أو زمنين، واستقر حديثاً للدلالة على أي امتداد زمني محدد."
      evidence_assessment:
        case: "confirm"
      substitution_test:
        result: "pass"
      nuance_differentiation: "أوسع دلالة؛ إذ تستعمل بكثرة للدلالة على الحقبة أو المدة التي يستغرقها حدث ما في ذاته، فضلاً عن المسافة الفارغة بين حدثين (كالفترة بين نبيين)."
      example: "عاش الكاتب فترة من الزمن في قرية نائية."
    - lemma: "مدة زمنية"
      source: step05
      decision: confirmed
      decision_reason: "تركيب وصفي شائع ومستقر في الاستعمال التخصصي والعام للدلالة على الامتداد الزمني."
      step05_citation: "«مدة زمنية ( لمقياس زمنى مستمر)» — موسوعة الكهرباء (IEC 60050)"
      mwe_check:
        is_mwe: true
        accepted: true
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على مقدار امتداد الزمن نفسه أكثر من تركيزه على معنى الانقطاع أو الانفصال المفهوم من (فاصل) أو (فترة)."
      example: "يستلزم إنجاز المشروع مدة زمنية لا تقل عن سنة."
      actions:
        - command: create_entry
          params:
            lemma: "مدة زمنية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-15294470-n"
    - lemma: "مُدَّة"
      source: step05
      decision: removed
      decision_reason: "المدة في أصلها هي مطلق الامتداد الزمني (duration)، بينما المجموعة الترادفية مخصصة للقطعة المحددة بين لحظتين (interval). إضافتها قد يسبب تداخلاً مع مجموعة duration."
      step05_citation: "مؤلف"

  synset_flags:
    definition_review_needed: false
    split_needed: false
  added_lemmas:
    - lemma: "مدة زمنية"
      reason: "مصدر: الخطوة ٠٫٥"
