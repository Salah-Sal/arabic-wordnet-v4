step0_evidence:
  per_lemma:
    - lemma: "فراغ"
      confirm:
        - text: "«(الْفَرَاغ) الْخُلُو وَالْمَكَان الْخَالِي»"
          source: "المعجم الوسيط"
    - lemma: "فضاء"
      confirm:
        - text: "«ما بين الكواكب والنجوم من مسافات لا يعلمها إلا الله»"
          source: "المعجم الوسيط"
        - text: "«ما اتسع من الأرض والخالي من الأرض»"
          source: "المعجم الوسيط"
        - text: "«المكان الواسع»"
          source: "كتاب العين"
    - lemma: "لا نهائي"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "خلاء"
      source_section: "step4_fts_keyword"
      evidence_citation: "«(الْخَلَاء) الفضاء الْوَاسِع الْخَالِي من الأَرْض» — المعجم الوسيط"
      justification: "المجاز: استخدام مصطلح تراثي يدل على الخلو المكاني للتعبير عن الامتداد الكوني المفتوح."
  knowledge_candidates:
    - lemma: "لانهاية"
      justification: "التركيب: تركيب مزجي من نافية واسم (لا + نهاية) يعبر عن المفهوم المجرد للمدى الذي لا حدود له، وهو أدق اسمياً من الصفة 'لا نهائي'."

step1_lemma_validation:
  per_lemma:
    - lemma: "فراغ"
      decision: confirmed
      decision_reason: "مصطلح أساسي يعبر عن الحيز الخالي والمدى الواسع، ومستخدم علمياً وفي الاستعمال العام للدلالة على الفضاء."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على خلو الحيز من المادة."
      example: "تسبح الكواكب في فراغ الكون الواسع."
    - lemma: "فضاء"
      decision: confirmed
      decision_reason: "أكثر المصطلحات دقة وشيوعاً للتعبير عن المدى اللامحدود الذي يحتوي الأجرام السماوية وكل شيء."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على السعة والامتداد اللامحدود الذي يحتوي الأشياء."
      example: "أطلقت وكالة ناسا مركبة جديدة لاستكشاف الفضاء الخارجي."
    - lemma: "لا نهائي"
      decision: removed
      decision_reason: "الكلمة 'لا نهائي' صفة وليست اسماً. المفهوم الاسمي الدال على المدى الذي لا يحد هو 'اللانهاية' أو 'المطلق'. إبقاء الصفة كمترادف للاسم يخالف القواعد المعجمية."
      evidence_assessment:
        case: "no_material"
      substitution_test:
        result: "fail"
      nuance_differentiation: "صفة تصف المدى بأنه ليس له حدود، ولا تستعمل كاسم يدل على الفضاء نفسه."
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"
    - lemma: "خلاء"
      source: step05
      decision: confirmed
      decision_reason: "مصطلح فصيح متداول يدل على الفضاء الخالي الواسع."
      step05_citation: "«الفضاء الْوَاسِع الْخَالِي من الأَرْض» — المعجم الوسيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على الخلو من العوائق والمادة كفضاء مفتوح."
      example: "يشغل هذا الكون خلاءً لا يعلم حدوده إلا الله."
      actions:
        - command: create_entry
          params:
            lemma: "خلاء"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00028950-n"
    - lemma: "لانهاية"
      source: step05
      decision: confirmed
      decision_reason: "مركب يعبر بدقة عن مفهوم 'the infinite' كاسم بدلاً من الصفة المزالة 'لا نهائي'."
      step05_citation: "تركيب لغوي مستقر كاسم يعبر عن غياب الحدود."
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على المفهوم المجرد لغياب أي حدود مكانية أو زمانية."
      example: "يتأمل الفلاسفة في مفهوم اللانهاية لفهم طبيعة الكون."
      actions:
        - command: create_entry
          params:
            lemma: "لانهاية"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00028950-n"
  added_lemmas:
    - lemma: "خلاء"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"
    - lemma: "لانهاية"
      reason: "مصدر: الخطوة ٠٫٥"
      via_command: "create_entry + add_sense"

