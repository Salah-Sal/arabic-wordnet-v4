step0_evidence:
  per_lemma:
    - lemma: "مَكَان"
      confirm:
        - text: "«المكانُ: هُوَ السَّطْح الْبَاطِن من الجرم الْحَاوِي المماس للسطح أَسْفَل الظَّاهِر من المحوى»"
          source: "معجم مقاليد العلوم للسيوطي"
        - text: "«(المكان) المنزلة... والموضع (ج) أمكنة»"
          source: "المعجم الوسيط"
      expands:
        - text: "«المكان: هو في العرف العام ما يمنع الشيء من النزول... وأما أهل العلم والتحقيق فقد اختلفوا فيه فذهب أرسطاطاليس... إلى أن المكان هو السطح الباطن من الجسم الحاوي»"
          source: "كشاف اصطلاحات الفنون للتهانوي"
          addition: "يوضح التعريف الاصطلاحي الفلسفي للمكان بوصفه السطح الحاوي للجسم."

    - lemma: "مَوْقِع"
      confirm:
        - text: "«(الموقع) مَكَان الْوُقُوع يُقَال وَقع الشَّيْء موقعه»"
          source: "المعجم الوسيط"
        - text: "«مَوْقِع: بمعنى موضع أو المكان الذي توجد فيه بعض الأشياء»"
          source: "تكملة المعاجم العربية لدوزي"
        - text: "«موقع: محل situation»"
          source: "معجم الجغرافيا"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مَوْضِع"
      source_section: "step5_english_bridge"
      evidence_citation: "«موضع: location» — المعجم الطبي الموحد / معجم المعلوماتية"
      justification: "لفظ عام يطلق على مكان وجود الشيء أو الموقع الذي يشغله."
    - lemma: "مَحَلّ"
      source_section: "step4_fts_keyword"
      evidence_citation: "«المحلّ: [في الانكليزية] Spot، Place» — كشاف اصطلاحات الفنون"
      justification: "يستخدم للدلالة على المكان الذي يحل فيه الشيء أو الشخص."
  knowledge_candidates:
    - lemma: "بُقْعَة"
      justification: "تستخدم للدلالة على بقعة من الأرض أو نقطة محددة، وهي من مرادفات المكان في السياق الجغرافي."
  generation_notes: "تم التركيز على الألفاظ الأكثر شيوعاً في الاستعمال المعجمي والتقني للدلالة على الموقع المكاني."

step1_lemma_validation:
  per_lemma:
    - lemma: "مَكَان"
      decision: confirmed
      decision_reason: "اللفظ الأساسي والأكثر شمولاً للمفهوم، مدعوم بأدلة معجمية قوية."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام الذي يدل على الفضاء أو جزء منه، ويصلح للمكان الهندسي والمادي."
      example: "يُعَدُّ هَذَا المَكَانُ مِثَالِيًّا لِبِنَاءِ مَدْرَسَةٍ جَدِيدَةٍ."

    - lemma: "مَوْقِع"
      decision: confirmed
      decision_reason: "مصطلح مستقر يدل على نقطة محددة أو مكان وقوع حدث، وشائع في الاستعمال التقني والجغرافي."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على نقطة الارتكاز أو الإحداثيات المكانية، وغالباً ما يرتبط بمكان وقوع حدث أو وجود منشأة."
      example: "تَمَّ تَحْدِيدُ مَوْقِعِ الطَّائِرَةِ المَفْقُودَةِ عَبْرَ الأَقْمَارِ الصِّنَاعِيَّةِ."

    - lemma: "مَوْضِع"
      source: step05
      decision: confirmed
      decision_reason: "مرادف أصيل للمكان والموقع، ومستعمل بكثرة في المعاجم لوصف مواضع الأشياء."
      step05_citation: "«موضع: location» — المعجم الطبي الموحد"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يشير غالباً إلى الحيز المحدد الذي يشغله جسم ما، ويميل للاستعمال المادي المباشر (موضعه من الكتاب)."
      example: "ضَعِ الكِتَابَ فِي مَوْضِعِهِ الصَّحِيحِ عَلَى الرَّفِّ."
      actions:
        - command: create_entry
          params:
            lemma: "مَوْضِع"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00027365-n"

    - lemma: "مَحَلّ"
      source: step05
      decision: confirmed
      decision_reason: "مرادف صحيح لغوياً وتقنياً (محل الإقامة، محل الإعراب) ويدل على الحيز المكاني."
      step05_citation: "«المحلّ: Place» — كشاف اصطلاحات الفنون"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يدل على المكان من حيث كونه ظرفاً للحلول (أي حلول الشيء فيه)، ويستخدم في السياقات المجردة والقانونية."
      example: "لَمْ يَكُنْ هُنَاكَ مَحَلٌّ لِلشَّكِّ فِي نَزَاهَةِ القَاضِي."
      actions:
        - command: create_entry
          params:
            lemma: "مَحَلّ"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-00027365-n"

