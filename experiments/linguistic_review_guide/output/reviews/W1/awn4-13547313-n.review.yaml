      nuance_differentiation: "تشير إلى العملية من منظورها الظاهري الملاحظ والمتكرر."
      example: "تُعنى علوم الأحياء بدراسة كل ظاهرة حيوية تُميز الكائنات الحية عن الجمادات."
      actions:
