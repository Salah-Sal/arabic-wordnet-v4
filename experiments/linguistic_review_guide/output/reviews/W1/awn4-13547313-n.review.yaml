step0_evidence:
  per_lemma:
    - lemma: "عملية بيولوجية"
      confirm:
        - text: "«عملية بيولوجية للحصول على مركبات أبسط أو استخلاص مكونات معدنية، تحدث في التربة مثلا وتقوم بها كائنات حية دقيقة وأخرى أكبر» — مسرد المناخ والبيئة (ARABTERM)"
          source: "مسرد المناخ والبيئة (ARABTERM)"
        - text: "«انحلال المادة العضوية: عملية بيولوجية تحدث بشكل طبيعي. تتحول خلالها الجزيئات العضوية المعقدة المكونة للأجسام الميتة... إلى جزيئات عضوية وغير عضوية أبسط» — مسرد المناخ والبيئة (ARABTERM)"
          source: "مسرد المناخ والبيئة (ARABTERM)"
        - text: "«إضافة الكائنات الحيّة الدقيقة (العضويات الدقيقة) المُناسبة إلى نظام بيولوجي، بغرض البدء في عملية بيولوجية مُعينة أو تعجيلها» — المعجم الموحد لمصطلحات المياه (ARABTERM)"
          source: "المعجم الموحد لمصطلحات المياه (ARABTERM)"

    - lemma: "عملية حيوية"
      confirm:
        - text: "«نَتْرَجَة: عملية حيوية يحول فيها النشادر أولا إلى نتريت ومن ثم إلى نترات» — المعجم الموحد لمصطلحات الهندسة المدنية (ARABTERM)"
          source: "المعجم الموحد لمصطلحات الهندسة المدنية (ARABTERM)"
        - text: "«تَمَثُّل: عملية حيوية يتمكن الكائن الحيّ بموجبها من تحويل المواد الغذائية المتناولة إلى مواد مماثلة» — المعجم الموحد لمصطلحات علم الصيدلة (ARABTERM)"
          source: "المعجم الموحد لمصطلحات علم الصيدلة (ARABTERM)"
        - text: "«(التمثيل) (فِي علم النَّبَات) عملية حيوية يجريها النَّبَات الْأَخْضَر مكونا غذاءه العضوي من عناصر بسيطة فِي وجود اليخضور والضوء وَثَانِي أكسيد الكربون وَالْمَاء» — المعجم الوسيط"
          source: "المعجم الوسيط"

    - lemma: "عملية عضوية"
      evidence_status: "no_material_found"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "ظاهرة حيوية"
      source_section: "step4_fts_keyword"
      evidence_citation: "«تكرار ظاهرة حيوية أو مرضية مثل كثرة التبول أو تتابع نوبات الصرع وما أشبه» — معجم المصطلحات الطبية (2003)"
      justification: "الظاهرة الحيوية (Vital phenomenon) تُستخدم لوصف العمليات والظواهر التي تتميز بها الكائنات الحية، وهي مرادف دلالي قوي لـ 'عملية حيوية'."
  knowledge_candidates:
    - lemma: "عملية أحيائية"
      justification: "تُستخدم صفة 'أحيائي' (من أحياء) كبديل عربي فصيح لـ 'بيولوجي'، ومصطلح 'عملية أحيائية' شائع في السياقات العلمية والتقنية الحديثة لوصف السيرورات الحيوية."
  generation_notes: "التعريف يغطي مفهوم العمليات والظواهر التي تميز الحياة؛ المصطلحات العربية المستعملة تدور حول 'حيوية'، 'بيولوجية'، و'أحيائية'."

