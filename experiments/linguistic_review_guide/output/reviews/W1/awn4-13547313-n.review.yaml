      example: "يعد التمثيل الضوئي في النبات أهم عملية حيوية تمد الأرض بالأكسجين والغذاء."

    - lemma: "عملية عضوية"
      decision: "removed"
      decision_reason: "ترجمة حرفية (Calque) من الإنجليزية 'organic process' غير مستقرة معجمياً بهذا المعنى؛ حيث تشير 'عضوية' في هذا السياق غالباً إلى الكيمياء العضوية أو أعضاء البدن."
