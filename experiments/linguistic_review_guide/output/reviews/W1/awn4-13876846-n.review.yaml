step0_evidence:
  per_lemma:
    - lemma: "تَضَادّ"
      confirm:
        - text: "«علاقة الضدين من حيث الدلالة.»"
          source: "المعجم الموحد لمصطلحات اللسانيات (2002)"
        - text: "«علاقة بين مفردتين تتسم باختلافهما المطلق في المعنى.»"
          source: "مسرد الإعلام والتواصل، المنظمة العربية للتربية والثقافة والعلوم (موقع ArabTerm)"
        - text: "«(تضَاد) الْأَمْرَانِ كَانَ أَحدهمَا ضد الآخر»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«كَون الشَّيْئَيْنِ الوجوديين مُتَقَابلين بِحَيْثُ لَا يكون تعقل كل مِنْهُمَا بِالْقِيَاسِ إِلَى الآخر»"
          source: "دستور العلماء للأحمدنكري"
      expands:
        - text: "«(في المنطق): التَّقابلُ بين مَعْنَيَيْن يندرجان تحت جنسٍ واحدٍ, وبينهما بعضُ الخلافِ»"
          source: "المعجم الكبير"
          addition: "التخصيص في الاستعمال المنطقي"
    - lemma: "تَعَارُض"
      confirm:
        - text: "«(4) تعارُض؛ تضادّ»"
          source: "المورد الحديث (2008)"
      expands:
        - text: "«كون الدليلين بحيث يقتضي أحدهما ثبوت أمر والآخر انتفاءه في محلّ واحد في زمان واحد بشرط تساويهما في القوة»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
          addition: "التخصيص الأصولي لتعارض الأدلة"

