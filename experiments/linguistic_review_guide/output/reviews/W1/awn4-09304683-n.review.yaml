        result: "pass"
      nuance_differentiation: "أكثر عمومية من 'جسم طافٍ'؛ قد تصف الشخص أو الشيء، وتستخدم أيضاً في سياقات مجردة (مثل سعر صرف عائم)."
      example: "شوهد حطام عائم على سطح المحيط بعد تحطم الطائرة."

    - lemma: "عوامة"
      source: step05
      decision: confirmed
      decision_reason: "تستخدم للدلالة على الأجسام الطافية المصممة لغرض معين (كالكرات في الخزانات أو العلامات الملاحية)."
      step05_citation: "«شيء عائم أو طافٍ» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "تلمح غالباً إلى جسم طافٍ صناعي أو ميكانيكي وليس مجرد أي جسم طافٍ طبيعي."
      example: "تعمل العوامة في خزان الماء على إغلاق الصمام عند امتلاء الخزان."
