    - lemma: "عوامة"
      source_section: "step5_english_bridge"
      evidence_citation: "«(2) «أ», شيء عائم أو طافٍ؛ مثل: «ب» فلّينة؛ قصبة الصيد.» — المورد الحديث (2008)"
      justification: "تستخدم كاسم آلة أو اسم مادة لما يطفو فوق الماء."
    - lemma: "طافية"
      source_section: "step5_english_bridge"
      evidence_citation: "«(1) الطّافية: عوّامة لإرشاد السُّفن» — المورد الحديث (2008)"
      justification: "تخصيص للجسم الطافي المستخدم في الملاحة."
  knowledge_candidates:
    - lemma: "طافٍ"
      justification: "اسم فاعل من طفا يطفو، وهو المرادف المباشر لـ 'عائم' في السياق الفيزيائي."

