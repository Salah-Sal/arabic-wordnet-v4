            synset_id: "awn4-09304683-n"

    - lemma: "طافٍ"
      source: step05
      decision: confirmed
      decision_reason: "اسم فاعل فصيح يطابق 'عائم' وهو أصل الاشتقاق للجسم الطافي."
      step05_citation: "«شيء عائم أو طافٍ» — المورد الحديث"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يركز على فعل 'الطفو' بحد ذاته، وهو المرادف الدقيق لـ floater."
      example: "كل جسم طافٍ على سطح الماء يتأثر بضغط السائل من أسفل."
