step0_evidence:
  per_lemma:
    - lemma: "صيد"
      confirm:
        - text: "«الصيد: ما امتنع بجناحه أو بقوائمه مأكولا أو غيره، ولا يؤخذ إلا بحيلة... وقد يسمى المصيد صيدا»"
          source: "التوقيف على مهمات التعاريف للمناوي"
        - text: "«الصّيد... يطلق أيضا على ما يصطاد كما في شرح أبي المكارم»"
          source: "كشّاف اصطلاحات الفنون والعلوم للتهانوي"
        - text: "«(الصَّيْد) مَا يصاد وَفِي التَّنْزِيل الْعَزِيز {أحل لكم صيد الْبَحْر}»"
          source: "المعجم الوسيط لمجموعة من المؤلفين"
        - text: "«كُلُّ ما يَصيدُه الإنسانُ من السَّمكِ والطير والوحش كُلُّ وَحْش صَيْدٌ، صِيدَ أو لم يُصَدْ»"
          source: "المعجم الكبير"
        - text: "«والصَّيْدُ ما تُصَيِّدَ... يجوز أن يُعْنَى به عَيْنُ المُتَصَيَّدِ»"
          source: "لسان العرب"
      expands:
        - text: "«الصَّيْد: ما يُصادُ السَّمَكُ. (يمانية)»"
          source: "المعجم الكبير"
          addition: "تخصيص اللفظ في بعض اللهجات (اليمانية) لصيد السمك تحديداً"
      peripheral_observations:
        - lemma: "صيد"
          meaning: "داء في العنق يمنع الالتفات"
          source: "المعجم الوسيط"

step05_lemma_generation:
  evidence_candidates:
    - lemma: "مَصِيد"
      source_section: "step0_evidence"
      evidence_citation: "«وقد يسمى المصيد صيدا» — التوقيف على مهمات التعاريف للمناوي"
      justification: "اسم مفعول صريح من الفعل 'صاد'، وورد في المعاجم كمرادف مباشر للمصيد (الذات المفعول بها الصيد)."
  knowledge_candidates:
    - lemma: "قَنِيص"
      justification: "آلية التوليد: اشتقاق (فعيل بمعنى مفعول). لفظ تراثي فصيح ومستقر في المعاجم مرادف للصيد."
    - lemma: "طَرِيدَة"
      justification: "آلية التوليد: اشتقاق (فعيلة بمعنى مفعولة). يُطلق على المصيد الذي يُطارد، ويحمل ظلاً دلالياً يناسب المجهود المبذول في الصيد (worth catching)."

step1_lemma_validation:
  per_lemma:
    - lemma: "صيد"
      decision: confirmed
      decision_reason: "أدلة معجمية قوية ومتعددة تؤكد استخدام المصدر للدلالة على الذات المصيدة."
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللفظ العام الشامل والمجرد للمصيد في البر والبحر."
      example: "عاد البحارة بصيد وفير من سمك التونة."

    - lemma: "مَصِيد"
      source: "step05"
      decision: confirmed
      decision_reason: "مصطلح معجمي صريح يدل على المفعول، وهو أدق صرفياً للتعبير عن 'الشيء الذي يتم اصطياده'."
      step05_citation: "«وقد يسمى المصيد صيدا» — التوقيف على مهمات التعاريف للمناوي"
      substitution_test:
        result: "pass"
      nuance_differentiation: "يبرز كونه مفعولاً به لفعل الصيد، ويُستخدم في السياقات الفقهية والتقنية بدقة."
      example: "يُشترط في المصيد أن يكون ممتنعاً بطبعه."
      actions:
        - command: create_entry
          params:
            lemma: "مَصِيد"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09261049-n"

    - lemma: "قَنِيص"
      source: "step05"
      decision: confirmed
      decision_reason: "مرادف فصيح مستقر في المعاجم الكلاسيكية."
      step05_citation: "«والقَنِيصُ: الصَّيْدُ» — القاموس المحيط"
      substitution_test:
        result: "pass"
      nuance_differentiation: "لفظ تراثي يغلب في السياقات الأدبية والشعرية، ويختص غالباً بصيد البر."
      example: "انطلق الفرسان في إثر القنيص."
      actions:
        - command: create_entry
          params:
            lemma: "قَنِيص"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-09261049-n"

    - lemma: "طَرِيدَة"
      source: "step05"
      decision: removed
      decision_reason: "أخص من المفهوم العام؛ حيث تقيد المعنى بالمطاردة واللحاق (Chasing) ولا تشمل صيد الفخاخ أو الأسماك."
      step05_citation: "«الطَّرِيدَةُ: ما طَرَدْتَ من صَيْدٍ» — المعجم الوسيط"

