step3_definition:
  definition_review_flag: true
  current_definition: "شيء تم إثباته بوضوح"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي ضيّق ولا يعكس المعاني النفسية (اليقين) أو المعنوية (الثبات/الرسوخ) بشكل دقيق، كما أنه يخلط بين الحالة والنتيجة."
  
  authored_definitions:
    - type: "terminological"
      text: "حالة ذهنية أو واقعية تتسم بالرسوخ والجزم، وتنافي الشك والتردد."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

    - type: "linguistic"
      text: "اعتقاد جازم لا يخالطه شك، أو صفة الثبوت والرسوخ في الأمر."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true

  reasoning:
    revision_justification: "التعريف الحالي يعرّف 'المُثبَت' (مفعول) وليس 'الثبات' (مصدر/حالة)، مما يستوجب إعادة صياغته ليعبر عن الحالة."
    dictionary_comparison: "المعاجم العربية تربط اليقين بالجزم والقطع، والثبات بالرسوخ والاستقرار، وهذا التعريف الموحد يجمع بينهما."
    terminological_strategy: "الجنس القريب = 'حالة ذهنية أو واقعية' + الفصل المميّز = 'تتسم بالرسوخ والجزم، وتنافي الشك والتردد'."
    linguistic_strategy: "تبسيط التعريف ليركز على نفي الشك (لليقين) ورسوخ الأمر (للثبات)."

  actions:
    - command: "عدّل نص التعريف"
      params:
        definition_index: 0
        new_text: "حالة ذهنية أو واقعية تتسم بالرسوخ والجزم، وتنافي الشك والتردد."