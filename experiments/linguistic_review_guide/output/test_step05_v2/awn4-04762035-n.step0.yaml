        - «ثبات انعكاسي» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية
    يَقِين:
      confirm:
        - «اليقين: في اللغة: العلم الذي لا شك معه، وفي الاصطلاح: اعتقاد الشيء بأنه كذا مع اعتقاد أنه لا يمكن إلا كذا، مطابقًا للواقع غير ممكن الزوال» — كتاب التعريفات للشريف الجرجاني
        - «اليَقِينُ: علم يحصل بعد اسْتِدْلَال وروية.» — معجم مقاليد العلوم للسيوطي
        - «اليقين: لغة: العلم الذي لا شك معه. واصطلاحا: العلم الشيء بعد أن كان صاحبه شاكا فيه» — التوقيف على مهمات التعاريف للمناوي
        - «اليقين: هو في عرف علماء الرسوم الاعتقاد الجازم المطابق الثابت أي الذي لا يزول بتشكيك المشكّك.» — كشّاف اصطلاحات الفنون والعلوم للتهانوي
        - «العِلْمُ الذى لا شكَّ معه» — المعجم الوسيط
        - «اليَقِينُ: العلم وزوالُ الشك.» — تاج اللغة وصِحاح العربية للجوهري
        - «اليَقِينُ: إزاحَةُ الشَّكِّ والعِلْم وتَحْقِيقُ الأمْرِ» — تاج العروس لمرتضى الزبيدي
        - «اليقين: إزاحة الشك وتحقيق الأمر» — كتاب العين للخليل بن أحمد الفراهيدي
        - «اليَقِينُ: زَوَالُ الشَّكِّ.» — مقاييس اللغة لابن فارس
        - «اليقين: العلم وزوال الشك» — مختار الصحاح للرازي
        - «اليقين: إزاحة الشك وتحقيق الأمر» — المحكم والمحيط الأعظم لابن سيده الأندلسي
        - «يقن الأمر يقناً، وهو يقين.» — أساس البلاغة للزمخشري
        - «اليقين: إزاحة الشك وتحقيق الأمر» — المصباح المنير للفيّومي
        - «اليقين: إزاحة الشك وتحقيق الأمر» — القاموس المحيط للفيروزآبادي
        - «اليقين: إزاحة الشك وتحقيق الأمر» — مجمع بحار الأنوار للفَتِّنيّ
        - «اليقين: إزاحة الشك وتحقيق الأمر» — المعجم الوسيط
        - «يقن الأمر: ثبت وتحقق ووضح» — معجم اللغة العربية المعاصرة لأحمد مختار عمر
        - «اليقين: إزاحة الشك وتحقيق الأمر» — المحيط في اللغة للصاحب بن عباد
        - «اليقين: زوال الشك» — مجمل اللغة
      expands:
        - «الموت» — المعجم الوسيط
        - «عند أهل السلوك: ظهور نور الحقيقة في الموقن حال كشف الأستار البشرية بشاهد الوجد والذوق لا بدلالة العقل والنقل» — دستور العلماء للأحمدنكري
        - «(في الفلسفة): اطمئنان النَّفْس إلى حكمٍ مع الاعتقاد بصحَّته» — المعجم الوسيط
        - «حقُّ اليَقين: (سف) ما يُعبَّر به عن عُليا مراتب المعرفة عند الصوفيَّة وفيها تتوحَّد ذات العارف مع موضوع المعرفة» — المعجم الوسيط
