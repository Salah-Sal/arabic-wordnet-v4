step0_evidence:
  synset_id: awn4-04762035-n
  per_lemma:
    ثَبَات:
      confirm:
        - «الثبات: ضد الزوال، والثبات والثبوت ضد التزلزل، وثبت الأمر صح» — التوقيف على مهمات التعاريف للمناوي
        - «الثّبات: هو عدم احتمال الزّوال بتشكيك المشكّك. وقيل هو الجزم المطابق الذي ليس بثابت» — كشّاف اصطلاحات الفنون والعلوم للتهانوي
        - «الثَّبات: ضد الزوال» — التعريفات الفقهيّة للبركتي
        - «الثَّبَاتُ: مصدر ثَبَتَ» — المعجم الكبير
        - «ثبات: firmness» — المَكنَز الزراعي متعدد اللغات
        - «ثبات: persistence» — مسرد المناخ والبيئة وإدارة النفايات الصلبة
        - «ثبات: stability» — مسرد الإعلام والتواصل
        - «ثبات: consistency» — مسرد الإعلام والتواصل
        - «ثبات: fixity» — المعجم الموحد لمصطلحات القانون
        - «ثَبَات: stability» — المعجم الموحد لمصطلحات علم الصيدلة
        - «ثبات: subsistence» — مسرد الفلسفة وعلم النفس
        - «ثَبات: constancy» — المعجم الطبي الموحد
        - «ثبات؛ استقرار؛ رسوخ» — المورد الحديث
        - «ثبات؛ بقاء» — المورد الحديث
        - «ثبات؛ جَلَدٌ؛ صَبْر» — المورد الحديث
        - «ثبات؛ استقرار» — المورد الحديث
        - «ثبات؛ رسوخ» — المورد الحديث
        - «ثبات؛ جمود؛ لاتحرّكية» — المورد الحديث
        - «ثبات؛ عزم» — المورد الحديث
        - «ثبات؛ صمود [في وجه المصاعب]» — المورد الحديث
        - «ثبات؛ عناد» — المورد الحديث
        - «ثبات، استقرار» — المعجم الموحد لمصطلحات الكيمياء
        - «استقرار ؛ ثَبات ؛ رُسوخ» — المعجم الطبي الموحد
      contradicts:
        - «المجذع: مَالا أصل لَهُ وَلَا ثبات» — المعجم الوسيط
        - «المُجَدَّع: ما لا أصل له ولا ثبات» — المعجم الوسيط
        - «الأُبْطُولَة: ما لا ثبات له عند الفحص عنه» — المعجم الوسيط
        - «الدَّاحِض: فلان داحض: لا ثبات له ولا عزيمة في الأمور» — المعجم الوسيط
        - «سَيْرٌ يُشَدُّ به الرَّحْل» — المعجم الكبير
        - «ما يشد به الشيء ليثبت» — المعجم الوسيط
        - «داءٌ ثُباتٌ: معجز عن الحركة» — المعجم الوسيط
        - «ثُبَات: نَوْم (مرفوضة عند بعضهم)» — معجم الصواب اللغوي
      expands:
        - «خاصية بيانات لها توزيع ثابت على بُعد واحد أو أكثر» — معجم البيانات والذكاء الاصطناعي
        - «ثبات لون» — المَكنَز الزراعي متعدد اللغات
        - «ثبات الرياح» — المَكنَز الزراعي متعدد اللغات
        - «ثبات العائد بتغير الحجم» — المعجم الموحد لمصطلحات التجارة والمحاسبة
        - «ثبات الصرف» — المعجم الموحد لمصطلحات التجارة والمحاسبة
        - «ثبات الاثمان، استقرار الاثمان» — المعجم الموحد لمصطلحات التجارة والمحاسبة
        - «ثبات المبادلات، استقرار المبادلات» — المعجم الموحد لمصطلحات التجارة والمحاسبة
        - «ثبات الاختبار» — مسرد التربية
        - «ثبات وراثيّ» — المعجم الموحد لمصطلحات علم الوراثة
        - «ثبات الأبعاد» — مسرد صناعة النسيج
        - «ثبات حراري» — مسرد صناعة النسيج
