step3_definition:
  definition_review_flag: true
  current_definition: "شيء تم إثباته بوضوح"
  assessment:
    decision: "revise"
    reason: "التعريف الحالي ضيّق، يصف «المُثبَت» (اسم مفعول) بدلاً من المصدر «الثبات» أو الحالة «اليقين»، ويغفل دلالة الرسوخ والاستقرار التي تتضمنها اللمّات."
  authored_definitions:
    - type: "terminological"
      text: "حالة من الاستقرار والرسوخ تقتضي عدم التزلزل أو زوال الشك في أمر ما."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
    - type: "linguistic"
      text: "رسوخ الأمر في النفس أو الواقع، وانتفاء الشك والاضطراب عنه."
      quality_check:
        genus_present: true
        differentia_present: true
        circular: false
        too_broad: false
        too_narrow: false
        passed: true
  reasoning:
    revision_justification: "التعريف الحالي يركز على جانب الإثبات فقط، بينما «الثبات» و«اليقين» يعبران عن حالة استقرار ورسوخ تتجاوز مجرد الإثبات."
    dictionary_comparison: "المعاجم (مثل كشاف اصطلاحات الفنون والوسيط) تشير إلى أن الثبات هو ضد الزوال، واليقين هو العلم الذي لا شك معه، لذا يجب أن يجمع التعريف بين دلالة الرسوخ ودلالة نفي الشك."
    terminological_strategy: "الجنس القريب = «حالة من الاستقرار والرسوخ» + الفصل المميّز = «عدم التزلزل أو زوال الشك»."
    linguistic_strategy: "التركيز على «الرسوخ» كفعل معنوي ومادي يربط المفهومين."
