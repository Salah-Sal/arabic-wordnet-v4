step0_raw: "step0_evidence:\n  synset_id: awn4-04762035-n\n  per_lemma:\n    ثَبَات:\n      confirm:\n        - «الثبات: ضد الزوال، والثبات والثبوت ضد التزلزل، وثبت الأمر صح» — التوقيف على مهمات التعاريف\
  \ للمناوي\n        - «الثّبات: هو عدم احتمال الزّوال بتشكيك المشكّك. وقيل هو الجزم المطابق الذي ليس بثابت» — كشّاف اصطلاحات الفنون والعلوم للتهانوي\n        - «الثَّبات: ضد الزوال» — التعريفات الفقهيّة\
  \ للبركتي\n        - «الثَّبَاتُ: مصدر ثَبَتَ» — المعجم الكبير\n        - «ثبات: firmness» — المَكنَز الزراعي متعدد اللغات\n        - «ثبات: persistence» — مسرد المناخ والبيئة وإدارة النفايات الصلبة\n\
  \        - «ثبات: stability» — مسرد الإعلام والتواصل\n        - «ثبات: consistency» — مسرد الإعلام والتواصل\n        - «ثبات: fixity» — المعجم الموحد لمصطلحات القانون\n        - «ثَبَات: stability» —\
  \ المعجم الموحد لمصطلحات علم الصيدلة\n        - «ثبات: subsistence» — مسرد الفلسفة وعلم النفس\n        - «ثَبات: constancy» — المعجم الطبي الموحد\n        - «ثبات؛ استقرار؛ رسوخ» — المورد الحديث\n   \
  \     - «ثبات؛ بقاء» — المورد الحديث\n        - «ثبات؛ جَلَدٌ؛ صَبْر» — المورد الحديث\n        - «ثبات؛ استقرار» — المورد الحديث\n        - «ثبات؛ رسوخ» — المورد الحديث\n        - «ثبات؛ جمود؛ لاتحرّكية»\
  \ — المورد الحديث\n        - «ثبات؛ عزم» — المورد الحديث\n        - «ثبات؛ صمود [في وجه المصاعب]» — المورد الحديث\n        - «ثبات؛ عناد» — المورد الحديث\n        - «ثبات، استقرار» — المعجم الموحد لمصطلحات\
  \ الكيمياء\n        - «استقرار ؛ ثَبات ؛ رُسوخ» — المعجم الطبي الموحد\n      contradicts:\n        - «المجذع: مَالا أصل لَهُ وَلَا ثبات» — المعجم الوسيط\n        - «المُجَدَّع: ما لا أصل له ولا ثبات»\
  \ — المعجم الوسيط\n        - «الأُبْطُولَة: ما لا ثبات له عند الفحص عنه» — المعجم الوسيط\n        - «الدَّاحِض: فلان داحض: لا ثبات له ولا عزيمة في الأمور» — المعجم الوسيط\n        - «سَيْرٌ يُشَدُّ به\
  \ الرَّحْل» — المعجم الكبير\n        - «ما يشد به الشيء ليثبت» — المعجم الوسيط\n        - «داءٌ ثُباتٌ: معجز عن الحركة» — المعجم الوسيط\n        - «ثُبَات: نَوْم (مرفوضة عند بعضهم)» — معجم الصواب اللغوي\n\
  \      expands:\n        - «خاصية بيانات لها توزيع ثابت على بُعد واحد أو أكثر» — معجم البيانات والذكاء الاصطناعي\n        - «ثبات لون» — المَكنَز الزراعي متعدد اللغات\n        - «ثبات الرياح» — المَكنَز\
  \ الزراعي متعدد اللغات\n        - «ثبات العائد بتغير الحجم» — المعجم الموحد لمصطلحات التجارة والمحاسبة\n        - «ثبات الصرف» — المعجم الموحد لمصطلحات التجارة والمحاسبة\n        - «ثبات الاثمان، استقرار\
  \ الاثمان» — المعجم الموحد لمصطلحات التجارة والمحاسبة\n        - «ثبات المبادلات، استقرار المبادلات» — المعجم الموحد لمصطلحات التجارة والمحاسبة\n        - «ثبات الاختبار» — مسرد التربية\n        - «ثبات\
  \ وراثيّ» — المعجم الموحد لمصطلحات علم الوراثة\n        - «ثبات الأبعاد» — مسرد صناعة النسيج\n        - «ثبات حراري» — مسرد صناعة النسيج\n        - «ثبات الأُوزُون» — المعجم الموحد لمصطلحات المياه\n \
  \       - «ثبات انعكاسي» — المعجم الموحد لمصطلحات الفيزياء العامة والنووية\n    يَقِين:\n      confirm:\n        - «اليقين: في اللغة: العلم الذي لا شك معه، وفي الاصطلاح: اعتقاد الشيء بأنه كذا مع اعتقاد\
  \ أنه لا يمكن إلا كذا، مطابقًا للواقع غير ممكن الزوال» — كتاب التعريفات للشريف الجرجاني\n        - «اليَقِينُ: علم يحصل بعد اسْتِدْلَال وروية.» — معجم مقاليد العلوم للسيوطي\n        - «اليقين: لغة: العلم\
  \ الذي لا شك معه. واصطلاحا: العلم الشيء بعد أن كان صاحبه شاكا فيه» — التوقيف على مهمات التعاريف للمناوي\n        - «اليقين: هو في عرف علماء الرسوم الاعتقاد الجازم المطابق الثابت أي الذي لا يزول بتشكيك\
  \ المشكّك.» — كشّاف اصطلاحات الفنون والعلوم للتهانوي\n        - «العِلْمُ الذى لا شكَّ معه» — المعجم الوسيط\n        - «اليَقِينُ: العلم وزوالُ الشك.» — تاج اللغة وصِحاح العربية للجوهري\n        - «اليَقِينُ:\
  \ إزاحَةُ الشَّكِّ والعِلْم وتَحْقِيقُ الأمْرِ» — تاج العروس لمرتضى الزبيدي\n        - «اليقين: إزاحة الشك وتحقيق الأمر» — كتاب العين للخليل بن أحمد الفراهيدي\n        - «اليَقِينُ: زَوَالُ الشَّكِّ.»\
  \ — مقاييس اللغة لابن فارس\n        - «اليقين: العلم وزوال الشك» — مختار الصحاح للرازي\n        - «اليقين: إزاحة الشك وتحقيق الأمر» — المحكم والمحيط الأعظم لابن سيده الأندلسي\n        - «يقن الأمر يقناً،\
  \ وهو يقين.» — أساس البلاغة للزمخشري\n        - «اليقين: إزاحة الشك وتحقيق الأمر» — المصباح المنير للفيّومي\n        - «اليقين: إزاحة الشك وتحقيق الأمر» — القاموس المحيط للفيروزآبادي\n        - «اليقين:\
  \ إزاحة الشك وتحقيق الأمر» — مجمع بحار الأنوار للفَتِّنيّ\n        - «اليقين: إزاحة الشك وتحقيق الأمر» — المعجم الوسيط\n        - «يقن الأمر: ثبت وتحقق ووضح» — معجم اللغة العربية المعاصرة لأحمد مختار\
  \ عمر\n        - «اليقين: إزاحة الشك وتحقيق الأمر» — المحيط في اللغة للصاحب بن عباد\n        - «اليقين: زوال الشك» — مجمل اللغة\n      expands:\n        - «الموت» — المعجم الوسيط\n        - «عند أهل السلوك:\
  \ ظهور نور الحقيقة في الموقن حال كشف الأستار البشرية بشاهد الوجد والذوق لا بدلالة العقل والنقل» — دستور العلماء للأحمدنكري\n        - «(في الفلسفة): اطمئنان النَّفْس إلى حكمٍ مع الاعتقاد بصحَّته» — المعجم\
  \ الوسيط\n        - «حقُّ اليَقين: (سف) ما يُعبَّر به عن عُليا مراتب المعرفة عند الصوفيَّة وفيها تتوحَّد ذات العارف مع موضوع المعرفة» — المعجم الوسيط\n"
