# ══════════════════════════════════════════════════════════════════════════════
#
# step05_lemma_generation
#   .evidence_candidates[]         — لمّات من الأدلة (≥1)
#     .lemma                       (str)              — اللمّة المرشحة
#     .source_section              (str)              — القسم المصدري
#     .evidence_citation           (str)              — اقتباس «نص» — معجم
