      - entry_id: 372092
        dictionary_id: 52
        headword: لولب آيزو متري
        headword_bare: لولب آيزو متري
        headword_norm: لولب ايزو متري
        root: للب
        root_source: lane
        pos: null
        form: null
        is_partial: 0
        definitions_text: هو سن لولب مُثلث يُصنع وفقاً لمواصفات[مُنظمة الأيزو (ISO)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91766)،
          وتبلغ زاوية السن به 60º. وتتمثل وظيفته في إنشاء وصلة قابلة للفك، كما أنه يتحدد وفقاً لكل من [بروفيل سن اللولب](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87794)،
          و[القطر الإسمي لسن اللولب](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87792)، و[خطوة اللولب](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87793).
          وفي مجال هندسة السيارات، تُستخدم بصفة أساسية أسنان لوالب مترية واسعة الخطوة، وأسنان لوالب مترية دقيقة الخطوة للمسامير
          والصواميل. وهي جميعاً يُمكن تصنيعها وتشطيبها عن طريق قطع أسنان اللوالب. وينبغي فحص المسامير والصواميل من حيث تعرّضها
          لأضرار قبل تركيبها في مواضعها،حيث يجب مُعالجة اللوالب المُتضررة أو استبدالها بمسامير وصواميل جديدة. وفي كل عملية
          تركيب أو عند تجديد المسامير، يُرجى مُراعاة ما إذا كانت فئة خاصية المتانة المدونة على رأس المسمار مُصرح بها للاستخدام
          المعني. وتفادياً لحدوث زرجنة جراء [التآكل](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87848)،
          فإنه يُمكن دهان اللولب بشحم جرافيتي قبل تركيبه.
        translation_en: ISO metric fine thread
        translation_fr: filetage fin ISO [m.]
        domain: Automotive Engineering
        external_id: arabterm:87786
