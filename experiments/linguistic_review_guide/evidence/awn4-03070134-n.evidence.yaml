              و[القطر الإسمي لسن اللولب](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87792)، و[خطوة
              اللولب](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87793). وفي مجال هندسة السيارات، تُستخدم
              بصفة أساسية أسنان لوالب مترية واسعة الخطوة، وأسنان لوالب مترية دقيقة الخطوة للمسامير والصواميل. وهي جميعاً يُمكن
              تصنيعها وتشطيبها عن طريق قطع أسنان اللوالب. وينبغي فحص المسامير والصواميل من حيث تعرّضها لأضرار قبل تركيبها
              في مواضعها،حيث يجب مُعالجة اللوالب المُتضررة أو استبدالها بمسامير وصواميل جديدة. وفي كل عملية تركيب أو عند تجديد
              المسامير، يُرجى مُراعاة ما إذا كانت فئة خاصية المتانة المدونة على رأس المسمار مُصرح بها للاستخدام المعني. وتفادياً
              لحدوث زرجنة جراء [التآكل](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87848)، فإنه يُمكن
              دهان اللولب بشحم جرافيتي قبل تركيبه.
