        definitions_text: "لولب: التهذيب في الثنائي في آخر ترجمة لبب: ويقال للماءِ الكثير يَحْمِلُ منه الـمِفْتَحُ ما يَسَعُه،\
          \ فيَضِـيقُ صُنْبُورُه عنه من كثرته، فيستدير الماءُ عند فمه، ويصير كأَنه بُلْبُلُ آنِـيةٍ: لَولَبٌ؛ قال أَبو منصور:\
          \ ولا أَدري أَعربي، أَم مُعَرَّب، غير أَن أَهل العراقِ وَلِعُوا باستعمال اللَّوْلَبِ. وقال الجوهري في ترجمة لوب:\
          \ وأَما الـمِروَدُ ونحوُه فهو الـمُلَولَبُ، على مُفَوْعَل، وقال في ترجمة فولف: ومما جاءَ على بناءِ \nفَوْلَفٍ: لَوْلَبُ\
          \ الماءِ."
        translation_en: null
        translation_fr: null
        domain: null
