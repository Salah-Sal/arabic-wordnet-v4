    - entry_id: 374872
      dictionary_id: 52
      headword: ملف
      headword_bare: ملف
      headword_norm: ملف
      root: لفف
      root_source: camel
      pos: null
      form: null
      is_partial: 0
      definitions_text: ملف وظيفته في توليد مجال مغناطيسي بناءً على التأثير الكهرومغناطيسي للتيار الكهربائي. وفي المركبات
        تُستخدم الملفات في عملية تحويل الطاقة الكهربائية إلى طاقة ميكانيكية (مثلاً مُبدىء الحركة، والمُرحّل، وصمامات الحقن)،
        كما تستخدم لتوليد ذروات للفلطية (مثلاً [ملف الإشعال](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90669))،
        وهي تستطيع كذلك تخزين طاقة كهرومغناطيسية، وتحسس المجالات المغناطيسية (مثلاً حسّاس عدد اللفات)، وإخماد فلطيات التشويش
        (مثلاً استخدام صمامات مانعة للتشويش).
      translation_en: coil
      translation_fr: bobine [f.]
      domain: Automotive Engineering
      external_id: arabterm:90566
