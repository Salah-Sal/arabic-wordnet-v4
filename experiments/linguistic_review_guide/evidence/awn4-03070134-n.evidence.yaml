            تمييز اللولب فإنه يتم إلى جانب الحرف 'M' الخاص باللولب المتري وبيان القطر الإسمي، ذكر بيان خطوة اللولب، مثل M
            8x0,25, M 8x0,5, M8x1.
          is_raw: 1
