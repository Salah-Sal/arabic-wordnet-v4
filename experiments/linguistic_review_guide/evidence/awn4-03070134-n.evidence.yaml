      - entry_id: 372094
        dictionary_id: 52
        headword: لولب متري دقيق الخطوة
        headword_bare: لولب متري دقيق الخطوة
        headword_norm: لولب متري دقيق الخطوة
        root: للب
        root_source: lane
        pos: null
        form: null
        is_partial: 0
        definitions_text: هو لولب معياري يُصنع وفقاً لمواصفات [مُنظمة الأيزو (ISO)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91766).
          وتتمثل وظيفته في إنشاء وصلة قابلة للفك. وعندما يتماثل [القطر الإسمي لسن اللولب](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87792)
          في اللوالب المترية دقيقة الخطوة تكون [خطى اللولب](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87793)
          صغيرة نسبياً. كما توفر هذه اللوالب درجة أعلى من التأمين ضد حدوث الفك الذاتي للمسامير والوصلات. وفيما يتعلق برموز
          تمييز اللولب فإنه يتم إلى جانب الحرف 'M' الخاص باللولب المتري وبيان القطر الإسمي، ذكر بيان خطوة اللولب، مثل M 8x0,25,
          M 8x0,5, M8x1.
        translation_en: metric fine thread
        translation_fr: filetage fin métrique [m.]
        domain: Automotive Engineering
