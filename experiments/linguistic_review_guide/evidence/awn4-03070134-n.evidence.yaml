        is_partial: 0
        definitions_text: 'لولب: ( {المُلَوْلَبُ، بِفَتْح لامَيْهِ، عَلى) وزنِ (مُفَوْعَلٍ) ، أَوّلُهُ مِيمٌ مَضْمُومَة، كأَنّه
          اسْمُ مفعولٍ من} لَوْلَبَ: (المِرْوَدُ) ، وَفِي بَعْضهَا: على فَعَوْعَلٍ، بالفاءِ الْمَفْتُوحَة فِي أَوله، وَقد
          صحّحه جمَاعَة.وَذكر الجوْهَرِيّ، فِي آخِرِ مادّةِ لوب، مَا نَصُّه: وأَمّا المِرْوَدُ ونحوُه، فَهُوَ المُلَوْلَبُ،
          على مُفوْعَلٍ. ووجدتُ فِي هامشه مَا نصُّهُ: وبخَطِّ أَبي زَكَرِيّا: مفعوعل، وَهُوَ سَهْوٌ.قلت: وذِكرُهُ هُنَا تَرْجَمَة
          مستقِلَّة، فيهِ مَا فِيهِ، أَوَّلاً: فإِنّه ذَكَرَهُ الجَوْهَرِيّ، فَلَا يكونُ زِيَادَة عَلَيْهِ، وَثَانِيا: إِن
          كانتِ الميمُ زَائِدَة، فَمَحَلُّ ذِكرِهِ فِي لَوْلَب، وَقد صحَّحه جماعةٌ. والظَّاهرُ أَنّه غَيْرُ عَرَبِيَ، كَمَا
          قيلَ.(! واللَّوْلَبُ) : مرَّ ذكرُهُ (فِي لبب) وهُنَا ذَكَرَهُابْنُ منظورٍ، وجماعةٌ.'
