        pos: null
        form: null
        is_partial: 0
        definitions_text: هو إلكترود مُتصل بكتلة المحرك وكتلة هيكل السيارة عن طريق أسنان لولب شمعة الشرر. يتم إغلاق الدائرة
          الكهربائية في نظام الإشعال وإتاحة تخطي شرارات الإشعال عن طريق الفجوة الهوائية بين الإلكترود الأرضي والإلكترود المركزي،
          وذلك بشرط وصول [فلطية الإشعال](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90649) إلى درجة
          كافية. يتكوّن الإلكترود الأرضي غالباً من سبيكة نيكلية.
