      dict_death_year: null
      definitions:
      - sense_index: 0
        text: البَعِيرُ عليه الهَوْدَجُ, كان فيه نساءٌ أو لم يَكُنْ
        is_raw: 0
      - sense_index: 1
        text: الشيءُ المحمولُ سواء كان حِسِّيًّا أو مَعْنَوِيًّا
        is_raw: 0
      - sense_index: 2
        text: ثَمَرُ الشَّجَر, تشبيها له بما يُحْمَلُ على الظَّهْرِ أو الرأس
        is_raw: 0
      - sense_index: 3
        text: الإثْمُ والوِزْرُ
        is_raw: 0
      - sense_index: 4
        text: '(في الرِّياضيّات) load: هو الثِّقَلُ أو الجسمُ الذى يُرْفَعُ أو يُجَرُّ بواسطة الآلات'
        is_raw: 0
      - sense_index: 5
        text: '(في الهَنْدسة الكهْربائيّة) load: القُدْرَة المُسْتَمَدَّة من آلَةٍ كهربائية أو جهاز كهربائي, ويُستَفادُ بها
          في الأغراض المُختَلِفَة'
        is_raw: 0
      examples:
      - idx: 0
        type: quran
        text: وإن تَدْعُ مُثْقَلَةٌ إِلى حِمْلِها لا يُحْمَلْ مِنْه شيءٌ ولو كَانَ ذَا قُرْبَى
        attribution: null
      - idx: 1
        type: quran
        text: مَنْ أَعْرَضَ عَنْهُ فَإِنَّهُ يَحْمِلُ يَوْمَ القِيامَةِ وِزْرًا خَالِدِينَ فِيهِ وَسَاءَ لَهم يَوْمَ القِيامَةِ
          حِمْلا
