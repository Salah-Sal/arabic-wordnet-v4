      - entry_id: 372097
        dictionary_id: 52
        headword: مُحدد خطوة أسنان اللوالب
        headword_bare: محدد خطوة أسنان اللوالب
        headword_norm: محدد خطوة اسنان اللوالب
        root: حدد
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: عبارة عن مجموعة من مُحددات مُفردة لأسنان لوالب المسامير، وتتمثل وظيفتها في تعيين خطوة اللولب، الأمر
          الذي يحدث من خلال وضع مُحدد الخطوة المُختارة على لولب أحد المسامير، والمُحافظة على وضعه في اتجاه مصدر ضوئي. فإذا
          كانت ثغرة نفاذ الضوء مُتساوية في جميع المواضع، فستتطابق عندئذ خطوة المُحدد مع خطوة المسمار. وتتوافر مُحددات خُطوات
          أسنان اللوالب لجميع أنواع وخطوات اللوالب.
        translation_en: thread gauge
        translation_fr: jauge de filetage [f.]
