      root: حمل
      root_source: ocr
      pos: noun
      form: null
      is_partial: 1
      definitions_text: 'البَعِيرُ عليه الهَوْدَجُ, كان فيه نساءٌ أو لم يَكُنْ الشيءُ المحمولُ سواء كان حِسِّيًّا أو مَعْنَوِيًّا
        ثَمَرُ الشَّجَر, تشبيها له بما يُحْمَلُ على الظَّهْرِ أو الرأس الإثْمُ والوِزْرُ (في الرِّياضيّات) load: هو الثِّقَلُ
        أو الجسمُ الذى يُرْفَعُ أو يُجَرُّ بواسطة الآلات (في الهَنْدسة الكهْربائيّة) load: القُدْرَة المُسْتَمَدَّة من آلَةٍ
        كهربائية أو جهاز كهربائي, ويُستَفادُ بها في الأغراض المُختَلِفَة'
      translation_en: null
      translation_fr: null
      domain: null
