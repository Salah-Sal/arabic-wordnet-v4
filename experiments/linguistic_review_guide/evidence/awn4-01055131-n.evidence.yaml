      - entry_id: 38872
        dictionary_id: 2
        headword: المِرْقَمُ
        headword_bare: المرقم
        headword_norm: المرقم
        root: رقم
        root_source: ocr
        pos: noun
        form: null
        is_partial: 0
        definitions_text: 'القَلَمُ؛ لأنه آلة للرَّقْمِ (الكتابة) يقال: طاحَ مِرْقَمُك, أَيْ: أَخْطَأَ وزَلَّ يقال لِلرَّجُل
          - إِذَا أَسرفَ فى غضَبِه ولم يَقْتصِدْ -: طَمَا مِرْقَمُك. ويقال أيضًا: جاش, وعلا, وطفح, وفاض, وارتَفَع, وقَذَفَ
          مِرْقَمُك ما يُنْقَشُ به الخُبْزُ ونحوه المِكْواةُ إِصْبعٌ مصنوعةٌ من أصباغٍ تُرابيَّة أو شَمْعِيَّة لتلوين المصَوَّرات
          والرُّسُوم فى الورَقِ الخشِن'
        translation_en: null
        translation_fr: null
        domain: null
        external_id: Al_Mujam_Al_Kabeer:Vol_10:page_0160:4
