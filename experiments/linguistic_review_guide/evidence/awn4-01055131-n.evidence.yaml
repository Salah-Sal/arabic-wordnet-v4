      - entry_id: 38851
        dictionary_id: 2
        headword: الرَّقْم
        headword_bare: الرقم
        headword_norm: الرقم
        root: رقم
        root_source: ocr
        pos: noun
        form: null
        is_partial: 1
        definitions_text: 'الصُّوفةُ الحمراءُ فى رأس الهودج الدَّارات فى الرَّملِ (فى عِلْمِ الحِساب): الرمزُ المستعمَلُ للتعبير
          عن أحَد الأعدادِ البسيطةِ, وهى الأعدادُ التسعةُ الأُولَى والصِّفر العدد الذى يَدُلُّ على ترتيب الشىءِ أو الفرد فى
          مجموعة ما (فى الموسيقى): قطعةٌ من الباغَةِ أو الجِلْدِ أو الصُّوفِ تُلْصَقُ بوَجْه العُودِ تحت مَضْرِبِ الرِّيشَةِ
          الرَّقْم القومِيّ: هو تخصيصُ رَقْمٍ مُعيَّن لكلّ مواطن, بوصفه رمزًا يشير إلى بعض ما يتعلَّق بهذا المواطن من بيانات
