          type: hadith
          text: كَانَ يُسَوِّى بين الصُّفُوفِ حَتَّى يَدَعَها مثل القِدْح أو الرَّقيم
          attribution: null
        - idx: 1
          type: poetry
          text: وأتَيْتَنا بِمُفَصَّلِ ... بِالتِّبْرِ عُلْوِيِّ الرَّقِيمِ
          attribution: أحمد شوقي
        - idx: 2
          type: quran
          text: أَمْ حَسِبْتَ أَنَّ أَصْحَابَ الْكَهْفِ وَالرَّقِيمِ كَانُوا مِنْ ءَايَتِنَا عَجَبًا
          attribution: null
        - idx: 3
          type: poetry
          text: هُزُّوا القُرى من كهفِها ورقيمِها ... أنتم لعمرُ اللهِ أعصابُ القُرى
