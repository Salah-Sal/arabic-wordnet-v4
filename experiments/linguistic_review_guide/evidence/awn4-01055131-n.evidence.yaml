      - entry_id: 38867
        dictionary_id: 2
        headword: الرَّقِيمُ
        headword_bare: الرقيم
        headword_norm: الرقيم
        root: رقم
        root_source: ocr
        pos: noun
        form: null
        is_partial: 0
        definitions_text: 'الكِتابُ. فَعيلٌ بمعنى مَفْعُول في قوله تعالى: (أَمْ حَسِبْتَ أَنَّ أَصْحَابَ الْكَهْفِ وَالرَّقِيمِ):
          اللوح الذى كُتب فيه أسماء أصحاب الكهف وقصَّتهم اسم قريتهم: هى القريةُ التى خرجوا منها كهفُهم اسمُ الجبل أو الوادى
          الذى كان فيه الكهف المذكور الصَّخْرَة الفَلَكُ؛ لرَقْمِه بالكواكب من خيل غَطَفان, وهو فرسُ حِزام بن وابصة'
        translation_en: null
        translation_fr: null
        domain: null
        external_id: Al_Mujam_Al_Kabeer:Vol_10:page_0159:3
