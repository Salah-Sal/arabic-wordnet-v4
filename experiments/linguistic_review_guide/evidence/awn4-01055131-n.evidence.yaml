            headword: رَقْمُ المَنْفَذ
            headword_bare: رقم المنفذ
            headword_norm: رقم المنفذ
            root: رقم
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: رَقْمٌ يمكِّن رزمَ ميفاقِ IP من الوصول إلى إجرائيةٍ معيّنة في حاسوبٍ متصلٍ بإنترنت. وبعضُ أرقامِ
              المنافذ (وتسمّى أرقام المنافذ الشهيرة "well-known") معيّنةٌ دائماً؛ فمثلاً، معطياتُ البريد الإلكتروني المستخدِم
              لميفاق SMTP تُرسَلُ دائماً إلى المنفذ رقم 25. تَستقبلُ إجرائيةٌ (مثل جلسة telnet) رقْمَ مَنفَذٍ "عابراً" عند
              إقلاعها، وتُرسَلُ المعلوماتُ أثناء تلك الجلسة إلى ذلك الرقم، ويُلغَى الرقمُ عند انتهاء الجلسة. إن العددَ الكليَّ
              لأرقام المنافذِ المتاحةِ للاستخدام مع الميفاقَين TCP وUDP يبلغ 65535 لكلٍّ منهما.
