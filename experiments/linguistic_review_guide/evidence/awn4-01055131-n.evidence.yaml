            headword: ترقيم الأسطوانات
            headword_bare: ترقيم الأسطوانات
            headword_norm: ترقيم الاسطوانات
            root: رقم
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: تنص المواصفة القياسية الألمانية DIN 73 021 على طريقة ترقيم الأسطوانات. يبدأ عدّ الأسطوانات من
              الجانب المُضاد لجانب خرج القدرة. في المحركات على شكل V، وكذلك في محركات الأسطوانات المتقابلة والمحركات النجمية
              يبدأ الترقيم أيضاً من الجانب المواجه لجانب مخرج القوة، وبالتحديد من الصف الأيسر للأسطوانات. تحصل أبعد أسطوانة
              عن جانب مخرج القوة على الرقم 1، ثم يتتابع الترقيم مع الاقتراب من هذا الجانب.
            translation_en: cylinder numbering
