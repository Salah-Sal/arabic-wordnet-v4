      - entry_id: 38848
        dictionary_id: 2
        headword: التَّرْقِيمُ
        headword_bare: الترقيم
        headword_norm: الترقيم
        root: رقم
        root_source: ocr
        pos: noun
        form: null
        is_partial: 0
        definitions_text: '(من مصطلحات أهل ديوان الخَراج): التَّرقين, وهو علامةٌ لهم, كانت تُجْعَل على الرِّقاع والتَّوقيعات
          والحسابات. وعلامات التَّرْقيم: علاماتٌ اصطلاحيَّةٌ مُحْدَثَةٌ, تُوضَع في أثناء الجُمَل, أو فى آخرِها؛ للمساعدة على
          الفهم, وهي: النقطة (.), والفاصلة (,), والفاصلة المنقوطة (؛), والنقطتان (:), وعلامة الاستفهام (؟), وعلامة التعجب
          (!), وعلامتا التنصيص (" "), والقوسان ( ), والشرطتان (- -), والنقاط الثَّلاث (...), وقوسا التعظيم ﴿ ﴾.'
