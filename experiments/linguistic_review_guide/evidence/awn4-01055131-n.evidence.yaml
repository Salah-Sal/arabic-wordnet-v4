            definitions_text: 'في مجال مُعالجة البيانات يُقصد بهذا المصطلح أن عمليات تسجيل ومُعالجة وعرض البيانات تتم من خلال
              قيم مُفردة، يُطلق عليها أيضاً اسم ''القيم السرية''. ويتم عادةً عرض هذه القيم في النظام الثنائي، على عكس طريقة
              العرض الرقمية التي تعرض القيم والأبعاد في خطوات مستقلة من خلال الرمزين الثنائيين التقليديين (0 و 1)، فإنه يتم
              في طريقة المُعالجة التناظرية للبيانات التعامل مع القيم والأبعاد التي تتسم بالاستمرارية وعدم الانقطاع، (انظر:
