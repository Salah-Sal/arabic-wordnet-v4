            definitions_text: عددٌ يعطيه مطوِّرٌ برمجيّ لتعيين هُويّة برنامجٍ خاصٍّ في مرحلة خاصة، وكلاهما قد يَكون قبل الإصدار
              العمومي أو بعده. تُعطى الإصداراتُ العموميةُ المتتابعةُ لبرنامجٍ ما أرقاماً متزايدة (تصاعدية). تتضمّن أرقامُ
              الإصدارات عادةً أجزاءً عشرية؛ فعند إجراء تغييرات أساسية على البرنامج يُغيَّرعادةً الرقْم الصحيح، أما عند إجراء
              تغييرات طفيفة فيُكتفى بزيادة الرقْم إلى يمين الفاصلة.
