        definitions_text: 'العَلامَةُ الخَتْمُ ما يُكْتَبُ على الثِّيَابِ وغَيْرِها مِنْ أثمانِها ضَرْبٌ مُخَطَّطٌ أَو مُدَوَّرٌ
          مِنَ الوَشْي والنَّقْش كُلُّ ثَوْبٍ مُوشًّى بِرَقْم معلوم, حَتَّى صارَ عَلَمًا ضَرْبٌ مُخَطَّطٌ مِن الخَزِّ . يُقال:
          خَزٌّ رَقْمٌ ضَرْبٌ من بُرودِ اليَمَنِ تُلْبِسُهُ الهوادِجُ'
