      - entry_id: 38843
        dictionary_id: 2
        headword: الأَرْقَمُ
        headword_bare: الأرقم
        headword_norm: الارقم
        root: رقم
        root_source: ocr
        pos: noun
        form: null
        is_partial: 0
        definitions_text: 'ذَكَرُ الحَيَّاتِ, أو أَخْبَثُها, وأطلبُها للناس؛ سُمِّيَ بذلك لما فى ظَهْره من ألوان, أو من سوادٍ
          وبياض. قيل: هو الذى يُشْبِهُ الجانَّ فى اتِّقاءِ النَّاس من قَتْلِه, وهو مع ذلك من أضْعَفِ الحيَّاتِ. اسمٌ للحيَّات,
          فإذا نُعت قيلَ: أَرْقش.'
        translation_en: null
        translation_fr: null
        domain: null
        external_id: Al_Mujam_Al_Kabeer:Vol_10:page_0152:0
