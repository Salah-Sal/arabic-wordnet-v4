      - entry_id: 38861
        dictionary_id: 2
        headword: الرَّقْمَة
        headword_bare: الرقمة
        headword_norm: الرقمة
        root: رقم
        root_source: ocr
        pos: noun
        form: null
        is_partial: 0
        definitions_text: 'الرَّوْضَةُ, سُمِّيَتْ بذلك لأنَّها كالرَّقْمِ على الأَرْض. نبات يقال إنه الخُبَّازى. من أحرار
          البَقْل. (عن أبى حنيفة) عِظَام العُشْب تنبت متسطِّحة غَضَّة, وهى أوَّل العُشْب خروجًا تنبت فى السَّهْل, وأوَّل ما
          يخرج منها ترى فيه حمرة كالعهن النافض, وهى قليلة, ولا يكاد المال (الإبل) يأكلها إلا من حاجة. النُّبْذَةُ من الكلأ.
          الجانب من الشىء؛ يقال: رَقْمَةُ الوادِي, ورَقْمَةُ الجبَلِ. مجتمعُ ماءِ الوادى. (عن الفرَّاء) الهَنَةُ النَّاتِئَةُ
          فى ذراع الدَّابَّةِ من الدَّاخل, وهما رَقْمَتان.'
        translation_en: null
        translation_fr: null
        domain: null
