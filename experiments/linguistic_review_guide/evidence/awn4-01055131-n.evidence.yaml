            definitions_text: 'أحدُ المحارف المستخدَمة للدلالة على عددٍ كامل (وَحْدة unit) في نظام العدّ. إذ إنّ عددَ الأرقام
              الممكنة، في أيِّ نظام عدّ، يساوي الأساسَ المستعملَ فيه. فالنظامُ العشري مثلاً، (أساسه 10) وفيه عشرة أرقام من
              0 إلى 9، والنظامُ الاثناني (أساسه 2) وفيه رقمان هما: 0 و1، أما النظامُ الست عشري (أساسه 16) ففيه ستة عشر رقماً
              من 0 إلى 9 ومن A إلى F.'
