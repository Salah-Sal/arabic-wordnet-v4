            أَقْعَدَ اللهُ الجَبَرْتَى لَها ... قَلَمًا عن غائبِ الأقلام نابــا
            خَبَّأَ الشَّيْخُ لها في رُدْنِهِ ... مِرْقَمًا أَدْهَى مِنَ الصِّلِّ انسيابـا
