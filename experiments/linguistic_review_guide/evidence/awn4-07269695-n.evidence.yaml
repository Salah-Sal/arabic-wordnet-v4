        - idx: 1
          type: hadith
          text: 'كُنَّا فى مَسيرٍ لنا, فنَزَلْنا, فَجاءَت جاريَةٌ فقالت: إن سَيِّدَ الحَيِّ سَلِيمٌ, وإِنَّ نَفَرَنا غُيَّبٌ,
