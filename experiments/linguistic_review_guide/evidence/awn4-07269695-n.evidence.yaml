          - entry_id: 358294
            dictionary_id: 60
            headword: سلم ريختر
            headword_bare: سلم ريختر
            headword_norm: سلم ريختر
            root: سلم
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: تم تطوير مقياس ريختر في عام 1935 من قبل تشارلز ريختر في معهد كاليفورنيا للتكنولوجيا كمنظومة
              رياضية لمقارنة حجم الزلازل. يتم تحديد شدة الزلزال من لوغاريتم اتساع الموجات التي سجلتها أجهزة رصد الزلازل. وشملت
              التعديلات الاختلاف في المسافة بين مختلف أجهزة رصد الزلازل ومركز الزلزال. على مقياس ريختر، يتم التعبير عن ضخامة
              الزلزال بأعداد صحيحة وكسور عشرية. على سبيل المثال، زلزال بلغت قوته 5.3 قد يحتسب كزلزال معتدل، ويمكن تصنيف زلزال
              كقوي إذا بلغت قوته 6.3. بسبب الأساس أللوغاريتمي للجدول، فإن زيادة وحدة في  مقياس ريختر تمثل زيادة عشرة أضعاف
              في قياس السعة؛ وكتقدير للطاقة التي يتم الإفراج عنها، فإن  زيادة وحدة في  مقياس ريختر يقابلها الإفراج عن حوالي
              31 مرة أكثر من الطاقة بالمقارنة مع كمية المرتبطة بالقيمة السابقة.مقياس ريختر (المرادف العربي)
