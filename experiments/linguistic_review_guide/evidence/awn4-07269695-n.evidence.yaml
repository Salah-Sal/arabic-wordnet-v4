        definitions:
        - sense_index: 0
          text: 'الْإِيمَان: بِالْفَتْح جمع الْيَمين. وبالكسر فِي اللُّغَة التَّصْدِيق مُطلقًا وَهُوَ مصدر من بَاب الْأَفْعَال
            من الْأَمْن والهمزة للصيرورة أَو للتعدية بِحَسب الأَصْل. كَأَن الْمُصدق صَار ذَا أَمن من أَن يكون مكذوبا أَو جعل
            الْغَيْر آمنا من التَّكْذِيب والمخالفة فَهُوَ مُتَعَدٍّ بِنَفسِهِ. وَقد يعدى بِالْبَاء بِاعْتِبَار معنى الِاعْتِرَاف
            وَالْإِقْرَار كَقَوْلِه تَعَالَى {آمن الرَّسُول بِمَا أنزل إِلَيْهِ من ربه والمؤمنون} . وباللام بِاعْتِبَار معنى
            الاذعان وَالْقَبُول كَقَوْلِه تَعَالَى: {مَا أَنْت بِمُؤْمِن لنا وَلَو كُنَّا صَادِقين} وَلَيْسَ المُرَاد بالتصديق
            إِيقَاع نِسْبَة الصدْق إِلَى الْخَبَر والمخبر فِي الْقلب بِدُونِ الإذعان وَالْقَبُول بِأَن تَقول هَذَا الْخَبَر
            صَادِق أَو أَنْت صَادِق من غير إذعان وَقبُول بل المُرَاد بِهِ التَّصْدِيق المنطقي الْمُقَابل للتصور أَي إذعان
            النِّسْبَة الْمعبر عَنهُ بِالْفَارِسِيَّةِ (بكرويدن) فالإيمان فِي اللُّغَة هُوَ اذعان النِّسْبَة مُطلقًا. وَفِي
            الشَّرْع فِي مُسَمَّاهُ اخْتِلَاف. ذهب بَعضهم إِلَى أَنه بسيط. وَالْآخر إِلَى أَنه مركب. وَفِي القائمين فِي بساطته
            اخْتِلَاف. قَالَ بَعضهم إِنَّه تَصْدِيق النَّبِي - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - بِالْقَلْبِ فِي جَمِيع
            مَا علم بِالضَّرُورَةِ مَجِيئه - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - بِهِ من عِنْد الله إِجْمَالا فِيمَا علم
            إِجْمَالا وتفصيلا فِيمَا علم تَفْصِيلًا أَي تَصْدِيقه وإذعانه فِيمَا اشْتهر كَونه من الَّذين بِحَيْثُ يُعلمهُ
            الْعَامَّة من غير افتقار إِلَى نظر واستدلال كوحدة الصَّانِع - وَوُجُوب الصَّلَاة - وَحُرْمَة الْخمر - وَنَحْو
            ذَلِك وَيَكْفِي الْإِجْمَال فِيمَا يُلَاحظ إِجْمَالا وَيشْتَرط التَّفْصِيل فِيمَا يُلَاحظ تَفْصِيلًا حَتَّى لَو
            لم يصدق بِوُجُوب الصَّلَاة عِنْد السُّؤَال عَنهُ وبحرمة الْخمر عِنْد السُّؤَال عَنْهَا كَانَ كَافِرًا. وَهَذَا
            هُوَ الْمَشْهُور وَعَلِيهِ جُمْهُور الْمُحَقِّقين وَهُوَ مُخْتَار الشَّيْخ أبي الْمَنْصُور الماتريدي رَحمَه الله
            فالإيمان عِنْدهم بسيط لِأَنَّهُ عبارَة عَن التَّصْدِيق الْمَذْكُور فَقَط وَالْإِقْرَار لَيْسَ بِشَرْط لأصل الْإِيمَان
            بل لإجراء الاحكام فِي الدُّنْيَا من ترك الْجِزْيَة وَالصَّلَاة عَلَيْهِ والدفن فِي مَقَابِر الْمُسلمين والمطالبة
            بالعشر وَالزَّكَاة فَمن صدق بِقَلْبِه وَلم يقر بِلِسَانِهِ فَهُوَ مُؤمن عِنْد الله تَعَالَى وَإِن لم يكن مُؤمنا
            فِي أَحْكَام الدُّنْيَا. وَمن أقرّ بِلِسَانِهِ وَلم يقر بِقَلْبِه كالمنافق فبالعكس. وَإِنَّمَا جعلُوا الْإِقْرَار
            شرطا لإجراء الْأَحْكَام الْمَذْكُورَة لِأَن الْإِيمَان الَّذِي هُوَ التَّصْدِيق القلبي أَمر مبطن لَا بُد لَهُ
            من عَلامَة تدل عَلَيْهِ لإجراء أَحْكَامه.وَلَا يذهب عَلَيْك أَن التَّصْدِيق الإيماني هُوَ التَّصْدِيق المنطقي
            بِعَيْنِه بل بَينهمَا فرق بِالْعُمُومِ وَالْخُصُوص من وَجْهَيْن. أَحدهمَا: أَن التَّصْدِيق المنطقي هُوَ الإذعان
            وَالْقَبُول بِالنِّسْبَةِ بَين الشَّيْئَيْنِ مُطلقًا والتصديق الإيماني هُوَ أخص بِاعْتِبَار الْمُتَعَلّق أَي التَّصْدِيق
            بِجَمِيعِ مَا جَاءَ بِهِ النَّبِي - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - وَلِهَذَا قَالُوا إِن الْإِيمَان فِي
            الشَّرْع مَنْقُول إِلَى التَّصْدِيق الْخَاص بِاعْتِبَار الْمُتَعَلّق. وَثَانِيهمَا: إِن التَّصْدِيق المنطقي هُوَ
            الإذعان وَالْقَبُول بِالنِّسْبَةِ مُطلقًا أَي سَوَاء كَانَ حَاصِلا بِالْكَسْبِ وَالِاخْتِيَار أَو لَا. بِخِلَاف
            التَّصْدِيق الإيماني فَإِنَّهُ الإذعان وَالْقَبُول بِالنِّسْبَةِ بَين الْأُمُور الْمَخْصُوصَة بِالْكَسْبِ وَالِاخْتِيَار
            حَتَّى لَو وَقع ذَلِك فِي الْقلب من غير اخْتِيَار لم يكن إِيمَانًا. فَمن شَاهد المعجزة فَوَقع فِي قلبه صدق النَّبِي
            عَلَيْهِ السَّلَام بَغْتَة فَإِنَّهُ لَا يُقَال فِي اللُّغَة أَنه صدق وَأَيْضًا لَا يكون مُؤمنا شرعا بل يكون مُكَلّفا
            بتحصيل ذَلِك الإذعان بِالِاخْتِيَارِ فالتصديق الإيماني أخص مُطلقًا من التَّصْدِيق المنطقي الْمُقَابل للتصور بِاعْتِبَار
            مُتَعَلّقه ولكونه مُقَيّدا بِالْكَسْبِ وَالِاخْتِيَار دون التَّصْدِيق المنطقي. وَكَيف لَا يكون مُقَيّدا بِالْكَسْبِ
            وَالِاخْتِيَار فَإِن الْإِيمَان مَأْمُور ومكلف بِهِ فَلَو لم يكن اخْتِيَارا لما صَحَّ التَّكْلِيف بِهِ.فَإِن قلت
            إِن الْإِيمَان تَصْدِيق والتصديق من قسمي الْعلم الَّذِي من الكيفيات النفسانية دون الْأَفْعَال الاختيارية فَلَا
            يَصح التَّكْلِيف بِهِ لِأَن الْمُكَلف بِهِ لَا بُد أَن يكون فعلا اختياريا قُلْنَا لَا نسلم أَن الْمُكَلف بِهِ
            لَا يكون إِلَّا فعلا اختياريا فَإِن التَّكْلِيف بالشَّيْء على نَوْعَيْنِ: أَحدهمَا: التَّكْلِيف بِحَسب نفس ذَلِك
            الشَّيْء وَهُوَ يَقْتَضِي أَن يكون نَفسه مِمَّا تتَعَلَّق بِهِ الْقُدْرَة الْحَادِثَة كالضرب بِالْمَعْنَى المصدري
            وَهَذَا الشَّيْء لَا يكون إِلَّا فعلا اختياريا. وَالثَّانِي: التَّكْلِيف بالشَّيْء بِحَسب التَّحْصِيل وَهُوَ يَقْتَضِي
            أَن يكون تَحْصِيله مِمَّا تتَعَلَّق بِهِ الْقُدْرَة. وَذَلِكَ بِأَن يكون الْأَسْبَاب المفضية إِلَيْهِ مقدورة سَوَاء
            كَانَ نَفسه مَقْدُورًا أَو لَا إِذْ قد يكون الشَّيْء بِحَسب ذَاته غير مَقْدُور وَبِاعْتِبَار تَحْصِيله مَقْدُورًا
            كالتسخن والتبرد وَالْإِيمَان كَذَلِك فَإِن نَفسه وَإِن كَانَ لَيْسَ مَقْدُورًا اختياريا لَكِن تَحْصِيله فعل اخْتِيَاري
            فالتكليف بِهِ لَيْسَ إِلَّا بِحَسب تَحْصِيله بِالِاخْتِيَارِ فِي مُبَاشرَة الْأَسْبَاب وَصرف النّظر وَرفع الْمَوَانِع
            وَنَحْو ذَلِك وَالْعَمَل بالأركان لَيْسَ جُزْء الْإِيمَان على هَذَا الْمَذْهَب أَيْضا كَمَا أَن الْإِقْرَار لَيْسَ
            بِجُزْء مِنْهُ.وَمذهب الرقاشِي وَالْقطَّان أَن الْإِيمَان بسيط لِأَنَّهُ الْإِقْرَار بِاللِّسَانِ فَقَط بِتَصْدِيق
            النَّبِي - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - فِي جَمِيع مَا جَاءَ بِهِ من عِنْد الله تَعَالَى لَكِن لَيْسَ
            الْإِيمَان هُوَ الْإِقْرَار الْمَذْكُور مُطلقًا عِنْدهمَا بل بِشَرْط مواطأة الْقلب.ثمَّ إِن الرقاشِي يشْتَرط مَعَ
            الْإِقْرَار الْمَذْكُور الْمعرفَة القلبية حَتَّى لَا يكون الْإِقْرَار بِدُونِهَا إِيمَانًا عِنْده. وَالْقطَّان
            يشْتَرط مَعَه التَّصْدِيق المكتسب بِالِاخْتِيَارِ وَصرح بِأَن الْإِقْرَار الْخَالِي عَن التَّصْدِيق المكتسب لَا
            يكون إِيمَانًا وَعند اقترانه بِهِ يكون الْإِيمَان عِنْده هُوَ الْإِقْرَار فَقَط. وَذهب الكرامية أَيْضا إِلَى بساطة
            الْإِيمَان لِأَنَّهُ عِنْدهم أَيْضا الْإِقْرَار بِاللِّسَانِ فَقَط لَكِن بِدُونِ اشْتِرَاط الْمعرفَة أَو التَّصْدِيق
            المكتسب حَتَّى أَن من أضمر الْكفْر وَأظْهر الْإِيمَان يكون مُؤمنا إِلَّا أَنه يسْتَحق الخلود فِي النَّار. وَمن
            أضمر الْإِيمَان وَلم يتَحَقَّق مِنْهُ الْإِقْرَار لَا يسْتَحق الْجنَّة.وَفِي الْقَائِلين بتركيب الْإِيمَان أَيْضا
            اخْتِلَاف. قَالَ بَعضهم أَنه مركب من التَّصْدِيق الْمَذْكُور وَالْإِقْرَار بِهِ فَهُوَ حِينَئِذٍ مركب من أَمريْن
            لَكِن الْأَمر الأول: أَعنِي الإذعان الْمَذْكُور ركن لَازم لَا يحْتَمل السُّقُوط أصلا. وَالْأَمر الثَّانِي: أَعنِي
            الْإِقْرَار المسطور ركن غير لَازم يحْتَمل السُّقُوط كَمَا فِي حَالَة الْإِكْرَاه وَهُوَ الْمَنْقُول عَن أبي حنيفَة
            رَحمَه الله تَعَالَى ومشهور من أَصْحَابه وَكثير من الأشاعرة.وَفِي شرح الْمَقَاصِد فعلى هَذَا من صدق بِقَلْبِه
            وَلم يتَّفق لَهُ الْإِقْرَار بِاللِّسَانِ فِي عمره مرّة لَا يكون مُؤمنا عِنْد الله تَعَالَى وَلَا يسْتَحق دُخُول
            الْجنَّة وَلَا النجَاة من الخلود فِي النَّار. ثمَّ الْخلاف فِيمَا إِذا كَانَ قَادِرًا وَترك التَّكَلُّم لَا على
            وَجه الأباء إِذْ الْعَاجِز كالأخرس مُؤمن اتِّفَاقًا. والمصر على عدم الْإِقْرَار مَعَ الْمُطَالبَة بِهِ كَافِر
            وفَاقا لكَون ذَلِك من إمارات عدم التَّصْدِيق. وَلِهَذَا أطبقوا على كفر أبي طَالب. وَإِن كابرت الروافض غير متأملين
            فِي أَنه كَانَ أشهر أعمام النَّبِي - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - وَأَكْثَرهم اهتماما بِشَأْنِهِ وأوفرهم
            حرصا من النَّبِي - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - على إيمَانه فَكيف اشْتهر حَمْزَة وَالْعَبَّاس وشاع على
            رُؤُوس المنابر فِيمَا بَين النَّاس وَورد فِي بابهما الْأَحَادِيث الْمَشْهُورَة وَكثر مِنْهُمَا المساعي المشكورة
            دون أبي طَالب انْتهى. وَقَالَ بَعضهم إِن مُسَمّى الْإِيمَان هُوَ مَجْمُوع التَّصْدِيق الْمَذْكُور وَالْإِقْرَار
            بِاللِّسَانِ وَالْعَمَل بالأركان فَهُوَ حِينَئِذٍ مركب من ثَلَاثَة أُمُور. وَهَذَا مَذْهَب جُمْهُور الْمُتَكَلِّمين
            والمحدثين وَالْفُقَهَاء والمعتزلة والخوارج إِلَّا أَن جُمْهُور الْمُتَكَلِّمين والمحدثين وَالْفُقَهَاء لم يجْعَلُوا
            الْعَمَل بالأركان ركنا لأصل الْإِيمَان بل للْإيمَان الْكَامِل فتارك الْعَمَل عِنْدهم مُؤمن وَلَيْسَ بِمُؤْمِن
            كَامِل. فَإِنَّهُم ذَهَبُوا إِلَى أَن تَارِك الْعَمَل لَيْسَ بِخَارِج عَن الْإِيمَان ودخوله فِي الْجنَّة وَعدم
            خلوده فِي النَّار مقطوعان. وَعند الْخَوَارِج والمعتزلة الْعَمَل ركن لأصل الْإِيمَان فتارك الْعَمَل خَارج عَن الْإِيمَان
            وداخل فِي الْكفْر عِنْد الْخَوَارِج وَغير دَاخل فِي الْكفْر عِنْد الْمُعْتَزلَة لأَنهم قَائِلُونَ بالمنزلة بَين
            المنزلتين. ثمَّ الْمُعْتَزلَة اخْتلفُوا فِيمَا بَينهم فِي الْأَعْمَال فَعِنْدَ أبي عَليّ وَابْنه أبي هَاشم الْأَعْمَال
            فعل الْوَاجِبَات وَترك الممنوعات. وَعند أبي الْهُذيْل وَعبد الْجَبَّار فعل الطَّاعَات وَاجِبَة كَانَت أَو مَنْدُوبَة
            فعلى أَي حَال لَا يخرج مُسَمّى الْإِيمَان الشَّرْعِيّ عَن فعل الْقلب وَفعل الْجَوَارِح سَوَاء كَانَ فعل اللِّسَان
            وَهُوَ الْإِقْرَار أَو غير فعل اللِّسَان وَهُوَ الْعَمَل بالطاعات.وَوجه الضَّبْط أَن مُسَمّى الْإِيمَان الشَّرْعِيّ
            إِمَّا بسيط أَو مركب. وعَلى الأول إِمَّا تَصْدِيق فَقَط بِجَمِيعِ مَا جَاءَ بِهِ النَّبِي وَهُوَ الْمُخْتَار.
            أَو إِقْرَار بِاللِّسَانِ بِجَمِيعِ مَا جَاءَ بِهِ النَّبِي - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - فَقَط بِشَرْط
            مواطأة الْقلب وَهُوَ مَذْهَب الرقاشِي وَالْقطَّان. أَو بِدُونِ اشْتِرَاط تِلْكَ المواطأة وَهُوَ مَذْهَب الكرامية.
            وعَلى الثَّانِي إِمَّا مركب من أَمريْن أَي التَّصْدِيق الْمَذْكُور وَالْإِقْرَار وَهُوَ مَذْهَب أبي حنيفَة رَحمَه
            الله وَكثير من الأشاعرة. أَو مركب من ثَلَاثَة أُمُور الْأَمريْنِ الْمَذْكُورين وَالْعَمَل بالأركان. ثمَّ الْعَمَل
            بالأركان إِمَّا جُزْء للْإيمَان الْكَامِل وَهُوَ مَذْهَب جُمْهُور الْمُتَكَلِّمين والمحدثين وَالْفُقَهَاء الشَّافِعِي
            رَحِمهم الله فالنزاع بَيْننَا وَبينهمْ لَفْظِي. وَإِمَّا جُزْء لأصل الْإِيمَان وَهُوَ مَذْهَب الْخَوَارِج والمعتزلة.
            وَالْفرق بَينهمَا لَيْسَ إِلَّا فِي الْأَحْكَام الأخروية كَمَا مر فَافْهَم واحفظ وَكن من الشَّاكِرِينَ.'
