      - entry_id: 769405
        dictionary_id: 103
        headword: دغر
        headword_bare: دغر
        headword_norm: دغر
        root: دغر
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: "دغر: دَغَرَ عليه يَدْغَرُ دَغَراً ودَغْرَى كَدَعْوَى: اقتحم من غير\nتثبت، والاسم الدَّغَرَى. وزعموا\
          \ أَن امرأَة قالت لولدها: إِذا رأَت العينُ\nالعينَ فَدَغْرَى ولا صَفَّى، ودَغْرَ لا صَفَّ، ودَغْراً لا صَفّاً مثل\n\
          عَقْرى وحَلْقَى وعَقْراً وحَلْقاً؛ تقول: إِذا رأَيتم عدوّكم\nفادْغَرُوا عليهم أَي اقتحموا واحملوا ولا تُصَافُّوهُمْ؛\
          \ وصَفَّى من المصادر التي\nفي آخرها أَلف التأْنيث نحو دَعْوَى من قول بُشَيْرِ بن النِّكْثِ:\nوَلَّتْ ودَعْوَى ما\
          \ شَدِيدٌ صَخَبُهْ\nودَغَرَ عليه: حمل. والدَّغْرُ أَيضاً: الخلط؛ عن كراع. وروي هذا المثل:\nدَغْراً ولا صَفاً أَي\
          \ خالطوهم ولا تَصافُوهم من الصَّفَاء.\nابن الأَعرابي: المَدْغَرَةُ الحرب العَضُوضُ التي شِعارها دَغْرَى،\nويقال:\
          \ دَغْراً.\nوالدَّغْرُ: غَمْزُ الحَلقِ من الوجع الذي يُدْعَى العُذْرَةَ. ودَغَرَ\nالصَّبِيَّ يَدْغَرُه دَغْراً:\
          \ وهو رَفْعُ ورم في الحلق. وفي الحديث أَن\nالنبي، صلى الله عليه وسلم، قال للنساء: لا تعذبن أَولادكن بالدَّغْرِ؛\n\
          وهو أَن تَرْفَعَ لَهَاةَ المعذور. قال أَبو عبيد: الدَّغْرُ غَمْزُ\nالحَلْقِ بالأُصبع، وذلك أَن الصبي تأْخذه العُذْرَةُ،\
          \ وهو وجع يهيج في الحلق\nمن الدم، فتدخل المرأَة أُصبعها فترفع بها ذلك الموضع وتَكْبِسُه، فإِذا\nرفعت ذلك الموضع\
          \ بأُصبعها قيل: دَغَرَتْ تَدْغَرُ دَغْراً؛ ومنه الحديث:\nقال لأُم قَيْسٍ بنتِ مِحْصَنٍ: عَلامَ تَدْغَرْنَ أَولادكن\
          \ بهذه\nالعُلُقِ؟ والدَّغْرُ: تَوَثُّبُ المُخْتَلِس ودَفْعُه نَفْسَه على المتاع\nليختلسه؛ ومنه حديث علي، كرم الله\
          \ وجهه: لا قطع في الدَّغْرَةِ، وهي\nالخَلْسَةُ؛ قال أَبو عبيد: وهو عندي من الدفع أَيضاً لأَن المختلس يدفع نفسه على\n\
          الشيء ليختلسه، وقيل في قوله لا قطع في الدغرة: هو أَن يملأَ يده من\nالشيء يستلبه. والدَّغْرَةُ: أَخذ الشيء اختلاساً،\
          \ وأَصل الدَّغْرِ الدفْعُ.\nوفي خُلُقِهِ دَغَرٌ أَي تَخَلَّفٌ؛ وفي التهذيب: كأَنه استسلام؛ \n(*\nقوله: «كأنه استسلام»\
          \ في القاموس وشرحه: الدغر، بالتحريك، التخلف والاستلام\nبالهمز، هكذا في النسخ ومثله في التكملة وفي التهذيب الاستسلام\
          \ وهو\nتحريف). قال:\nوما تَخَلَّفَ من أَخْلاقِهِ دَغَرُ\nوالدَّغْرُ: سوء غذاء الولد وأَن ترضعه أُمُّه فلا ترويه\
          \ فيبقى مستجيعاً\nيعترض كل من لقي فيأْكل ويَمَصُّ، ويُلْقَى على الشاة فَيَرْضَعُها، وهو\nعذاب الصبي. وقال أَبو سعيد\
          \ فيما رَدَّ على أَبي عبيد: الدَّغْرُ في\nالفصيل أَن لا ترويه أُمُّه فَيَدْغَرَ في ضرع غيرها، فقال، عليه الصلاة\n\
          والسلام: لا تُعَذِّبْنَ أَولادكُنَّ بالدَّغْرِ ولكن أَرْوينَهُمْ لئلا\nيَدْغَروا في كل ساعة ويستجيعوا؛ وإِنما أَمر\
          \ بإِرواءِ الصبيان من اللبن.\nقال الأَزهري: والقول ما قال أَبو عبيد وقد جاءَ في الحديث ما دل على صحة\nقوله. والدَّغْرُ:\
          \ الوُجور. ودَغَرَهُ أَي ضَغَطَهُ حتى مات، ولونٌ\nمُدَغَّرٌ: قبيح؛ قال:\nكَسا عامِراً ثَوْبَ الدَّمامَةِ رَبُّهُ،\n\
          كما كُسِيَ الخِنْزيرُ ثَوْباً مُدَغَّرا\nدغمر: الدَّغْمَرَةُ: الخَلْطُ. يقال: خُلُقٌ دُغْمُريٌّ ودَغْمَريٌّ.\nوالدَّغْمَرَةُ:\
          \ تخليط اللَّونِ والخُلْقِ؛ قال رؤْبة:\nإِذا امْرُؤٌ دَغْمَرَ لَوْنَ الأَدْرَنِ،\nسَلَّمْتُ عِرْضاً لَوْنُه لم يَدْكَنِ\n\
          الأَدْرَنُ: الوَسِخُ. ودَغْمَرَ: خَلَطَ. لم يدكن: لم ينشخ؛ قاله ابن\nالأَعرابي. ورجل دُغْمورٌ: سيء الثناء. ورجل\
          \ مُدغْمَرُ الخُلُقِ أَي ليس\nبصافي الخُلُقِ. وخُلُقٌ دَغْمَرِيُّ وفي خُلُقه دَغْمَرَةٌ أَي شَراسَةٌ\nولُؤْمٌ؛ قال\
          \ العجاج:\nلا يَزْدهيني العَمَلُ المَقْزِيُّ،\nولا مِنَ الأَخْلاقِ دَغْمَرِيُّ\nوالدَّغْمَرِيُّ: السَّيِّءُ الخُلُق،\
          \ وكذلك الذُّغْمُورُ، بالذال،\nالحَقُودُ الذي لا ينحلُّ حقده. ودَغْمَرَ عليه الخَبَرَ: خلطه.\nوالمُدَغْمَرُ: الخَفِيُّ."
        translation_en: null
        translation_fr: null
        domain: null
        external_id: haw:1:2646
