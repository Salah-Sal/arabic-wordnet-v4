        definitions_text: 'أمنأصل الأَمْن: طمأنينة النفس وزوال الخوف، والأَمْنُ والأَمَانَةُ والأَمَانُ في الأصل مصادر، ويجعل
          الأمان تارة اسما للحالة التي يكون عليها الإنسان في الأمن، وتارة اسما لما يؤمن عليه الإنسان، نحو قوله تعالى: وَتَخُونُوا
          أَماناتِكُمْ [الأنفال/ 27] ، أي: ما ائتمنتم عليه، وقوله: إِنَّا عَرَضْنَا الْأَمانَةَ عَلَى السَّماواتِ وَالْأَرْضِ
          [الأحزاب/ 72] قيل: هي كلمة التوحيد، وقيل: العدالة ، وقيل: حروف التهجي، وقيل: العقل، وهو صحيح فإنّ العقل هو الذي
          بحصوله يتحصل معرفة التوحيد، وتجري العدالة وتعلم حروف التهجي، بل بحصوله تعلّم كل ما في طوق البشر تعلّمه، وفعل ما
          في طوقهم من الجميل فعله، وبه فضّل على كثير ممّن خلقه.وقوله: وَمَنْ دَخَلَهُ كانَ آمِناً[آل عمران/ 97] أي: آمنا من
          النار، وقيل: من بلايا الدنيا التي تصيب من قال فيهم: إِنَّما يُرِيدُ اللَّهُ لِيُعَذِّبَهُمْ بِها فِي الْحَياةِ الدُّنْيا
          [التوبة/ 55] .ومنهم من قال: لفظه خبر ومعناه أمر، وقيل:يأمن الاصطلام ، وقيل: آمن في حكم الله، وذلك كقولك: هذا حلال
          وهذا حرام، أي: في حكم الله.والمعنى: لا يجب أن يقتصّ منه ولا يقتل فيه إلا أن يخرج، وعلى هذه الوجوه: أَوَلَمْ يَرَوْا
          أَنَّا جَعَلْنا حَرَماً آمِناً [العنكبوت/ 67] . وقال تعالى: وَإِذْ جَعَلْنَا الْبَيْتَ مَثابَةً لِلنَّاسِ وَأَمْناً
          [البقرة/ 125] . وقوله: أَمَنَةً نُعاساً[آل عمران/ 154] أي: أمنا، وقيل: هي جمع كالكتبة. وفي حديث نزول المسيح: «وتقع
          الأمنة في الأرض» .وقوله تعالى: ثُمَّ أَبْلِغْهُ مَأْمَنَهُ[التوبة/ 6] أي: منزله الذي فيه أمنه.وآمَنَ: إنما يقال
          على وجهين:- أحدهما متعديا بنفسه، يقال: آمنته، أي:جعلت له الأمن، ومنه قيل لله: مؤمن.- والثاني: غير متعدّ، ومعناه:
          صار ذا أمن.والإِيمان يستعمل تارة اسما للشريعة التي جاء بها محمّد عليه الصلاة والسلام، وعلى ذلك:الَّذِينَ آمَنُوا
          وَالَّذِينَ هادُوا وَالصَّابِئُونَ [المائدة/ 69] ، ويوصف به كلّ من دخل في شريعته مقرّا بالله وبنبوته. قيل: وعلى
          هذا قال تعالى: وَما يُؤْمِنُ أَكْثَرُهُمْ بِاللَّهِ إِلَّا وَهُمْ مُشْرِكُونَ [يوسف/ 106] .وتارة يستعمل على سبيل
          المدح، ويراد به إذعان النفس للحق على سبيل التصديق، وذلك باجتماع ثلاثة أشياء: تحقيق بالقلب، وإقرار باللسان، وعمل
          بحسب ذلك بالجوارح، وعلى هذا قوله تعالى: وَالَّذِينَ آمَنُوا بِاللَّهِ وَرُسُلِهِ أُولئِكَ هُمُ الصِّدِّيقُونَ [الحديد/
          19] .ويقال لكلّ واحد من الاعتقاد والقول الصدق والعمل الصالح: إيمان. قال تعالى: وَما كانَ اللَّهُ لِيُضِيعَ إِيمانَكُمْ
          [البقرة/ 143] أي:صلاتكم، وجعل الحياء وإماطة الأذى من الإيمان .قال تعالى: وَما أَنْتَ بِمُؤْمِنٍ لَنا وَلَوْ كُنَّا
          صادِقِينَ [يوسف/ 17] قيل: معناه: بمصدق لنا، إلا أنّ الإيمان هو التصديق الذي معه أمن، وقوله تعالى: أَلَمْ تَرَ إِلَى
          الَّذِينَ أُوتُوا نَصِيباً مِنَ الْكِتابِ يُؤْمِنُونَ بِالْجِبْتِ وَالطَّاغُوتِ [النساء/ 51] فذلك مذكور على سبيل
          الذم لهم، وأنه قد حصل لهم الأمن بما لا يقع به الأمن، إذ ليس من شأن القلب- ما لم يكن مطبوعا عليه- أن يطمئن إلى الباطل،
          وإنما ذلك كقوله: مَنْ شَرَحَ بِالْكُفْرِ صَدْراً فَعَلَيْهِمْ غَضَبٌ مِنَ اللَّهِ وَلَهُمْ عَذابٌ عَظِيمٌ [النحل/
          106] ، وهذا كما يقال:إيمانه الكفر، وتحيته الضرب، ونحو ذلك.وجعل النبيّ صلّى الله عليه وسلم أصل الإيمان ستة أشياء
          في خبر جبريل حيث سأله فقال: ما الإيمان؟ والخبر معروف .ويقال: رجل أَمْنَةٌ وأَمَنَةٌ: يثق بكل أحد، وأَمِينٌ وأَمَانٌ
          يؤمن به. والأَمُون: الناقة يؤمن فتورها وعثورها.آمين يقال بالمدّ والقصر، وهو اسم للفعل نحو:صه ومه. قال الحسن: معناه:
          استجب، وأَمَّنَ فلان: إذا قال: آمين. وقيل: آمين اسم من أسماء الله تعالى . وقال أبو علي الفسوي :أراد هذا القائل أنّ
          في آمين ضميرا لله تعالى، لأنّ معناه: استجب.وقوله تعالى: أَمَّنْ هُوَ قانِتٌ آناءَ اللَّيْلِ [الزمر/ 9] تقديره: أم
          من، وقرئ: (أمن) وليسا من هذا الباب.'
