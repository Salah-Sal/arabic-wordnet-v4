    - entry_id: 821586
      dictionary_id: 119
      headword: لوازم لفظي
      headword_bare: لوازم لفظي
      headword_norm: لوازم لفظي
      root: لزم
      root_source: camel
      pos: null
      form: null
      is_partial: 0
      definitions_text: "لوازم لفظي:\n[في الانكليزية] Rhetorical requirements \n[ في الفرنسية] Exigences rhetoriques \nاللوازم\
        \ اللفظية عند البلغاء هو إيراد ألفاظ خاصة غير مشتركة لمجرّد الصّنعة ومثاله في المصراع التالي وترجمته: المجنون مثل\
        \ رباب والكفّ على الرّأس.\nومثال آخر وترجمته: لا تحوّل رأسك فأنا تراب قدمك.\nففي المصراع الثاني كلمة (سر) رأس أوردها\
        \ بتكلّف من أجل (پا) ومعناها قدم.\nفمقصوده من (سر مگردان) لا تحول رأسك آي لا تعرض عني. وفي الاصطلاح يقال في هذا المقام\
        \ (رو مگردان) أي لا تلتفت عني. (لا تعرض عني). ولكنه من أجل اللوازم اللفظية فحين قال: تراب قدمك قال: لا تحول رأسك والاصطلاح\
        \ قد حوّله (غيّره).\nوأمّا في المصراع الأول كلمة (چنگ) بمعنى راحة اليد أوردها لمناسبة الرباب فمراده من (چنگ) هو اليد\
        \ فحوّل الاصطلاح لأنه في الاصطلاح يقال: اليد على الرّأس ولا يقولون (الكف) على الرّأس. وهذا كلّه من جامع الصنائع."
      translation_en: null
      translation_fr: null
      domain: null
