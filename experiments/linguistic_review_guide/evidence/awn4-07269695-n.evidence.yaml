          - entry_id: 825523
            dictionary_id: 120
            headword: ذعن
            headword_bare: ذعن
            headword_norm: ذعن
            root: ذعن
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'ذعن: (أَذْعَنَ لَهُ) إذْعاناً: (خَضَعَ وَذَلَّ) ، كَمَا فِي الصِّحاحِ.(و) أَذْعَنَ لي بحقِّي:
              (أَقَرَّ) ؛ وكذلِكَ أَمْعَنَ بِهِ، أَي أَقَرَّ طائِعاً غَيْر مُسْتَكْرِهٍ.وقوْلُه تعالَى: {وَإِن يَكُن لَهُم
              الحقُّ يأْتُوا إِلَيْهِ مُذْعِنِيْن} أَي مُقِرِّين خاضِعِين.(و) قالَ أَبو إسْحق: أَذْعَنَ فِي اللّغَةِ: (أَسْرَعَ
              فِي الطَّاعَةِ) ؛ تقولُ: أَذْعَنَ لي بحقِّي، معْناهُ طاوَعَنِي لما كنتُ أَلْتِمسُهُ مِنْهُ، وصارَ يُسْرعُ إِلَيْهِ؛
              وَبِه فُسِّرَتِ الآيةُ أَيْضاً.وقالَ الفرَّاءُ: مُذْعِنِينُ: مُطِيعِيْن غَيْر مُسْتكْرِهِين.(و) أَذْعَنَ الرَّجُلُ:
              (انْقَادَ) وسَلِسَ؛ وَبِه فُسِّرَتِ الآيةُ أَيْضاً؛ (كَذَعِنَ، كفَرِحَ) ، ذَعَناً.(وناقَةٌ مِذْعانٌ: مُنْقادَةٌ)
              لقائِدِها (سَلِسَةُ الَّرأْسِ.(و) قوْلُهم: (رَأَيْتُهم مِذْعانِينَ، صَوابُه بالياءِ المُوَحَّدَةِ: أَي مُتَتابِعِينَ)
              .وممَّا يُسْتدركُ عَلَيْهِ:رجلٌ مِذْعانٌ: أَي مُنْقادٌ؛ كَمَا فِي الأساسِ.والإِذْعانُ: الإدْرَاكُ والفَهْمُ،
              هَكَذَا اسْتَعْمَلَهُ بعضٌ.قالَ شيْخُنا، رَحِمَه الّلهُ تَعَالَى: وَلَا أَصْلَ لَهُ فِي كَلامِ العَرَبِ، ومَجازُهُ
              بَعِيدٌ وَإِن تكلَّفَ لَهُ بعضُ الشّيُوخِ.'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:25:3836
