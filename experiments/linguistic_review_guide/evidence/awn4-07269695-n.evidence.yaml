      - entry_id: 47539
        dictionary_id: 2
        headword: السَّلَام
        headword_bare: السلام
        headword_norm: السلام
        root: سلم
        root_source: ocr
        pos: noun
        form: null
        is_partial: 1
        definitions_text: 'اسم من أسماء الله تعالى: ومعناه أنَّه ذُو السَّلامِ الَّذى يَمْلِكُ السَّلَامَ؛ أى: يُخَلِّصُ من
          المكروه. تَسَمَّى – جلَّ جلاله – بالسَّلام لِما شَمَلَ جَميع الخَلِيقة وعمَّهُمْ بالسَّلامةِ مِنَ الاخْتِلال والتفاوُتِ
          والحيْفِ. التَّحِيَّةُ (عند المسلمين). ويُقال: السَّلامُ عَلَيْكُمْ, وسَلامٌ عَلَيْكُمْ, وسَلَامًا بحذفِ عليكم.
          ما يقال عند الفراق والمتَارَكَةِ. السَّلام خِتامٌ: يعنى هـذه نهـاية الحديث.'
        translation_en: null
        translation_fr: null
        domain: null
