          type: poetry
          text: فَلَوْ أَنَّنِى كُنْتُ السَّلِيمَ لَعُدْتَنِى / سَريعًا ولَمْ تَحْبِسْكَ عَنِّى الكوادِسُ
          attribution: أبو ذُؤَيْبٍ الهُذَليُّ
        - idx: 4
          type: poetry
          text: يَشْكُو إِذا شُدَّ له حِزَامُهُ / شَكْوَى سَلِيمٍ ذَرَبَتْ كِلامُهُ
          attribution: ابن الأعرابِيِّ
