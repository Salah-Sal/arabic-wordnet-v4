          text: |-
            الحكم:[في الانكليزية] Verdict ،judgement ،gouvernment ،power [ في الفرنسية] Verdict ،jugement ،gouvernement ،pouvoir بالضم وسكون الكاف يطلق بالاشتراك أو الحقيقة والمجاز على معان. منها إسناد أمر إلى آخر إيجابا أو سلبا. وهذا المعنى عرفي، وحاصله أنّ الحكم نفس النسبة الخبرية التي إدراكها تصديق إيجابية كانت أو سلبية، وقد يعبّر عن هذا المعنى بوقوع النسبة ولا وقوعها، وقد يعبّر عنه بقولنا إنّ النسبة واقعة أو ليست بواقعة، وهذا المعنى من المعلومات فليس بتصوّر ولا تصديق لأنهما نوعان مندرجان تحت العلم. فالإسناد بمعنى مطلق النسبة والإيجاب الوقوع. والسلب اللاوقوع. واحترز بهما عمّا سوى النسبة الخبرية. وتوضيحه أنّه قد حقّق أنّ الواقع بين زيد والقائم هو الوقوع نفسه أو اللاوقوع كذلك، وليس هناك نسبة أخرى مورد الإيجاب والسلب، وأنّه قد يتصوّر هذه النسبة في نفسها من غير اعتبار حصولها أو لا حصولها في نفس الأمر، بل باعتبار أنّها تعلّق بين الطرفين تعلّق الثبوت أو الانتفاء، وتسمّى نسبة حكمية، ومورد الإيجاب والسلب ونسبة ثبوتية أيضا نسبة العام إلى الخاص أعني الثبوت لأنّه المتصوّر أولا، وقد تسمّى سلبية أيضا إذا اعتبر انتفاء الثبوت. وقد يتصوّر باعتبار حصولها أو لا حصولها في نفس الأمر، فإن تردّد فهو الشك وإن أذعن بحصولها أو لا حصولها فهو التصديق. فالنسبة الثبوتية تتعلّق بها علوم ثلاثة اثنان تصوّريان أحدهما لا يحتمل النقيض وهو تصوّرها في نفسها من غير اعتبار حصولها ولا حصولها. وثانيهما يحتمله. والثالث تصديقي فقد ظهر أنّ المعنى المذكور للحكم ليس أمرا مغايرا للوقوع واللاوقوع. وأنّ معنى قولنا نسبة أمر بأمر وإسناد أمر إلى أمر تعلّق أمر بأمر وقوعا كان أو لا وقوعا إن كان الإيجاب والسلب بمعنى الوقوع واللاوقوع، وإن أريد بالإيجاب والسّلب إدراك أنّ النسبة واقعة أو ليست بواقعة. فمعناه تعلّق أمر بأمر سواء كان موردا للإيجاب أو موردا للسلب، فإنّ الإيجاب والسّلب يطلق على كلا هذين المعنيين، كما صرّح بذلك المحقق التفتازاني في حاشية العضدي. وأنّ معنى قولنا إدراك أنّ النسبة واقعة أو ليست بواقعة ادراك أنّ النسبة الثبوتية واقعة في نفس الأمر أو ليست بواقعة فيها. ثم هذا التقرير على مذهب من يقول إنّ الحكم ليس من مقولة الفعل. وأما من يقول بأنّ الحكم من مقولة الفعل كالإمام الرازي والمتأخرين من المنطقيين فالمناسب عندهم في تفسير الحكم بإسناد أمر إلى آخر إيجابا أو سلبا أن يقال إنّ الإسناد لغة بمعنى تكيه دادن چيزي به چيزى،- إضافة شيء إلى شيء- وفي العرف ضم أمر إلى آخر، بحيث يفيد فائدة تامّة. وقد يطلق بمعنى مطلق النسبة. فعلى الأول قولنا إيجابا أو سلبا بيان لنوعه، وعلى الثاني يفيد لإخراج ما سوى النسبة الخبرية، والإيجاب لازم كردن والسلب ربودن كما في الصراح. وبالجملة فالمناسب على هذا أن يفسّر الإسناد والإيجاب والسلب بمعان منبئة عن كون الحكم فعلا. ولا يراد بالضم وبالنسبة التعلّق بين الطرفين وبالإيجاب والسلب الوقوع [فعلا] واللاوقوع، إذ لو أريد ذلك لم يبق الحكم فعلا، وعلى هذا القياس قولنا الحكم هو الإيجاب والسّلب أو الإيقاع والانتزاع أو النفي والإثبات فإنها مفسّرة بالمعاني اللغوية المنبئة عن كون الحكم فعلا.فالحكم على هذا إمّا جزء من التصديق كما ذهب إليه الإمام أو شرط له كما هو مذهب المتأخرين من المنطقيين، ويجيء في لفظ التصديق زيادة تحقيق لهذا.ومنها نفس النسبة الحكمية على ما صرّح به الچلپي في حاشية الخيالي بعد التصريح بالمعنى الأول. وهذا المعنى إنّما يكون مغايرا للأول عند المتأخرين الذاهبين إلى أنّ أجزاء القضية أربعة: المحكوم عليه وبه ونسبة تقييدية مسمّاة بالنسبة الحكمية ووقوع تلك النسبة أولا وقوعها الذي إدراكه هو المسمّى بالتصديق.وأما عند المتقدمين الذاهبين إلى أنّ أجزاء القضية ثلاثة: المحكوم عليه وبه والنسبة التامة الخبرية التي إدراكها تصديق فلا يكون مغايرا للمعنى الأول، لما عرفت من أنّ النسبة الحكمية ليست أمرا مغايرا للنسبة الخبرية.ومنها إدراك تلك النسبة الحكميةومنها إدراك وقوع النسبة أولا وقوعها المسمّى بالتصديق، وهذا مصطلح المنطقيين والحكماء وقد صرّح بكلا هذين المعنيين الچلپي أيضا في حاشية الخيالي. والتغاير بين هذين المعنيين أيضا إنما يتصوّر على مذهب المتأخرين. قالوا الفرق بين إدراك النسبة الحكمية وإدراك وقوعها أولا وقوعها المسمّى بالحكم هو أنّه ربّما يحصل إدراك النسبة الحكمية بدون الحكم، فإنّ المتشكّك في النسبة الحكمية متردّد بين وقوعها ولا وقوعها، فقد حصل له إدراك النسبة قطعا ولم يحصل له إدراك الوقوع واللاوقوع المسمّى بالحكم فهما متغايران قطعا. وأجيب بأنّ التردّد لا يتقوم حقيقة ما لم يتعلّق بالوقوع أو اللاوقوع فالمدرك في الصورتين واحد والتفاوت في الإدراك بأنّه إذعاني أو تردّدي. وبالجملة فيتعلّق بهذا المدرك علمان علم تصوّري من حيث إنّه نسبة بينهما وعلم تصديقي باعتبار مطابقته للنسبة التي بينهما في نفس الأمر، وعدم مطابقته إياها على ما مرّت الإشارة إليه في المعنى الأول. وأما على مذهب القدماء فلا فرق بين العبارتين إلّا بالتعبير. فمعنى قولنا إدراك النسبة وإدراك الوقوع واللاوقوع على مذهبهم واحد إذ ليس نسبة سوى الوقوع واللاوقوع، وهي النسبة التامة الخبرية. وأمّا النسبة التقييدية الحكمية المغايرة لها فممّا لا ثبوت له كما عرفت. فعلى هذا إضافة الوقوع واللاوقوع إلى النسبة بيانية. لكنّ هذا الإدراك نوعان: إذعاني وهو المسمّى عندهم بالحكم المرادف للتصديق وغير إذعاني وتسميته بالحكم عندهم محتمل غير معلوم، ويؤيد هذا ما ذكر السيّد السّند والمولوي عبد الحكيم في حواشي شرح الشمسية. وحاصله أنّ معنى قولنا إدراك وقوع النسبة أولا وقوعها ليس أن يدرك معنى الوقوع أو اللاوقوع مضافا إلى النسبة، فإنّ إدراكهما بهذا المعنى ليس حكما بل هو إدراك مركّب تقييدي من قبيل الإضافة، بل معناه أن يدرك أنّ النسبة واقعة ويسمّى هذا الإدراك حكما إيجابيا، أو أن يدرك أنّ النسبة ليست بواقعة ويسمّى هذا الإدراك حكما سلبيا، أعني معناه أن يدرك أنّ النسبة المدركة بين الطرفين أي المحكوم عليه والمحكوم به واقعة بينهما في حدّ ذاتها مع قطع النظر عن إدراكنا إيّاها أو ليست بواقعة كذلك، وهو الإذعان بمطابقة النسبة الذهنية لما في نفس الأمر أو في الخارج، أعني للنسبة مع قطع النظر عن إدراك المدرك بل من حيث إنها مستفادة من البداهة أو الحسّ أو النظر. فمآل قولنا إنّ النسبة واقعة أو ليست بواقعة.وقولنا إنّها مطابقة واحدة والمراد به الحالة الإجمالية التي يقال لها الإذعان والتسليم المعبّر عنه بالفارسية بگرويدن لا إدراك هذه القضية، فإنّه تصوّر تعلّق بما يتعلّق به التصديق يوجد في صورة التخييل والوهم ضرورة أنّ المدرك في جانب الوهم هو الوقوع واللاوقوع، إلّا أنّها ليست على وجه الإذعان والتسليم فظهر فساد ما توهّمه البعض من أنّ الشكّ والوهم من أنواع التصديق، ولا التفصيل المستفاد من ظاهر اللفظ لأنّه خلاف الوجدان، ولاستلزامه ترتّب تصديقات غير متناهية. فقد ظهر أنّ الحكم إدراك متعلّق بالنسبة التامة الخبرية فإنّها لمّا كانت مشعرة بنسبة خارجية كان إدراكها على وجهين من حيث إنّها متعلّقة بالطرفين رابطة بينهما كما في صورة الشكّ مثلا. ومن حيث إنّها كذلك في نفس الأمر كما في صورة الإذعان. وهذا هو الحكم والتصديق.وإنما قيل كون الحكم بمعنى إدراك وقوع النسبة أولا وقوعها يشعر بأنّ المراد بالنسبة النسبة الحكمية لا النسبة التامة الخبرية لأنّ الحكم على تقدير كونها تامة هو إدراك نفسها ليس بشيء عند التحقيق، وإنّ أجزاء القضية ثلاثة المحكوم عليه وبه والنسبة التامة الخبرية وهي نسبة واحدة هي اتحاد المحمول بالموضوع، أو عدم اتحاده به، وهو الحقّ عند المحققين، لا كما ذهب إليه المتأخرون من أنّ أجزاءها أربعة: المحكوم عليه وبه والنسبة الحكمية ووقوعها أولا وقوعها وأنّ الاختلاف بين التصوّر والتصديق بحسب الذات والمتعلّق، فإنّ التصوّر لا يتعلّق عندهم به التصديق، فالتصديق عندهم إدراك متعلّق بوقوع النسبة أولا وقوعها والتصوّر إدراك متعلّق بغير ذلك. والحق عند المحققين أنّ التصوّر يتعلّق بما يتعلّق به التصديق أيضا، فلا امتياز بين التصور والتصديق إلّا بحسب الذات واللوازم كاحتمال الصدق والكذب دون المتعلق.واعلم أنّه ذكر السّيد الشريف أنّه يجوز أن يفسّر الحكم بالتصديق فقط وأن يفسّر بالتصديق والتكذيب، وهذا بناء على أنّ إذعان أنّ النسبة ليست بواقعة إذعان بأنّ النسبة السلبية واقعة.فعلى هذا يجوز أن يعرف الحكم بإدراك الوقوع فقط وأن يعرف بإدراك الوقوع واللاوقوع معا.التقسيمالحكم سواء أخذ بمعنى التصديق أو بمعنى النسبة الخبرية ينقسم إلى شرعي وغير شرعي. فالشرعي ما يؤخذ من الشرع بشرط أن لا يخالف القطعيات بالنسبة إلى فهم الآخذ سواء كان مما يتوقف على الشرع بأن لا يدرك لولا خطاب الشارع كوجوب الصلاة، أو لم يكن كوجوده تعالى وتوحيده، وهو ينقسم إلى ما لا يتعلّق بكيفية عمل ويسمّى أصليا واعتقاديا وإلى ما يتعلّق بها ويسمّى عمليا وفرعيا، وغير الشرعي ما لا يؤخذ من الشرع كالأحكام العقلية المأخوذة من مجرّد العقل، والاصطلاحية المأخوذة من الاصطلاح. وأكثر ما ذكرنا هو خلاصة ما ذكره المولوي عبد الحكيم في حاشية الخيالي في الخطبة وحاشية شرح الشمسية.ومنها المحكوم عليه.ومنها المحكوم به. قال الچلپي في حاشية المطول في بحث التأكيد: إطلاق الحكم على المحكوم به متعارف عند النحاة كإطلاقه على المحكوم عليه انتهى. وهكذا ذكر السيّد الشريف في حاشية المطول.ومنها نفس القضية على ما ذكر الچلپي أيضا في حاشية الخيالي، وهذا كما يطلق التصديق على القضية.ومنها القضاء كما يجيء في لفظ الديانة.
            وما ذكره الغزالي حيث قال: الحكم والقضاء والقدر: هو توجّه الأسباب لجانب المسبّبات هو الحكم المطلق. وهو سبحانه وتعالى مسبب لجميع الأسباب المجمل منه والمفصّل، وعن الحكم يتفرع القضاء والقدر. فإذن: التدبير الإلهي هو أصل لوضع الأسباب لكي تتوجه نحو مسبّبات وهو الحكم الإلهي. وقيام الأسباب الكلية وظهورها مثل الأرض والسّماء والكواكب والحركات المتناسبة لها وغير ذلك مما لا يتغيّر ولا يتبدّل حتى يحين وقتها فذلك هو القضاء. ثم توجّه الأسباب هذه للأحوال والحركات المتناسبة والمحدودة والمقدّرة لجانب الأسباب، وحددت ذلك لحظة بلحظة فهو القدر.
            إذن فالحكم: هو التدبير الأزلي كله وأمره كلمح البصر. والقضاء: وضع كلّ الأسباب الكلية الدائمة.
            والقدر: هو توجيه هذه الأسباب الكلية لمسبباتها المعدودة بعدد معين فلا تزيد ولا تنقص. وكذا ذكر المولوي عبد الحق المحدّث في ترجمة المشكاة في باب الإيمان بالقدر.ومنها خطاب الله تعالى المتعلّق بأفعال المكلّفين. هكذا نقل عن الأشعري. وهذا المعنى مصطلحات الأصوليين.والخطاب في اللغة توجيه الكلام نحو الغير ثم نقل إلى الكلام الذي يقع به التخاطب، وبإضافته إلى الله تعالى خرج خطاب من سواه إذ لا حكم إلّا حكمه ووجوب طاعة النبي عليه السلام وأولي الأمر والسيّد إنّما هو بإيجاب الله تعالى إياها. والمراد بالخطاب هاهنا ليس المعنى اللغوي، اللهم إلّا أن يراد بالحكم المعنى المصدري، بل المراد به المعنى المنقول من الكلام المذكور لكن لا مطلقا بل الكلام النفسي، لأنّ اللفظي ليس بحكم بل دال عليه سواء أريد بالكلام الذي يقع به التخاطب الكلام الذي من شأنه التخاطب فيكون الكلام خطابا به أزليا كما هو رأي الأشعري من قدم الحكم والخطاب بناء على أزلية تعلّقات الكلام وتنوعه في الأزل أمرا أو نهيا أو غيرهما، أو أريد به معناه الظاهر المتبادر أي الكلام الذي يقع به التخاطب بالفعل، وهو الكلام الذي قصد منه إفهام من هو متهيئ لفهمه كما ذهب إليه ابن القطّان من أنّ الحكم والخطاب حادثان بناء على حدوث تعلّقات الكلام وعدم تنوّعه في الأزل، وهذا معنى ما قال إنّ الحكم والخطاب حادثان بل جميع أقسام الكلام مع قدمه فهو لا يسمّى الكلام في الأزل خطابا. ومعنى تعلقه بأفعال المكلّفين تعلّقه بفعل من أفعالهم لا بجميع أفعالهم على ما يوهم إضافة الجمع من الاستغراق، وإلّا لم يوجد حكم أصلا إذ لا خطاب يتعلّق بجميع الأفعال فيشمل خواص النبي صلى الله عليه وآله وسلم أيضا كإباحة ما فوق الأربع من النساء.لا يقال إذا كان المراد بالخطاب الكلام النفسي ولا شكّ أنّه صفة واحدة فيتحقّق خطاب واحد متعلّق بجميع الأفعال لأنّا نقول الكلام وإن كانت صفة واحدة لكن ليس خطابا إلّا باعتبار تعلّقه، وهو متعدّد بحسب المتعلّقات، فلا يكون خطاب واحد متعلقا بالجميع، وخرج بقوله المتعلّق بأفعال المكلّفين الخطابات المتعلّقة بأحوال ذاته وصفاته وتنزيهاته وغير ذلك ممّا ليس بفعل المكلّف كالقصص. واعترض على الحدّ بأنه غير مانع إذ يدخل فيه القصص المبينة لأفعال المكلّفين وأحوالهم والأخبار المتعلّقة بأعمالهم كقوله تعالى: وَاللَّهُ خَلَقَكُمْ وَما تَعْمَلُونَ مع أنّها ليست أحكاما.وأجيب بأنّ الحيثية معتبرة في الحدود، فالمعنى الحكم خطاب الله متعلّق بفعل المكلّفين من حيث هو فعل المكلّف وليس تعلّق الخطاب بالأفعال في صور النقض من حيث إنّها أفعال المكلّفين هذا لكن اعتبار حيثية التكليف فيما يتعلّق به خطاب الإباحة بل الندب والكراهة موضع تأمّل. ولذا أراد البعض في الحدّ قولنا بالاقتضاء أو التخيير للاحتراز عن الأمور المذكورة وكلمة أو لتقسيم المحدود دون الحدّ.ومعنى الاقتضاء الطلب. وهو إمّا طلب الفعل مع المنع عن الترك وهو الإيجاب، أو طلب الترك مع المنع عن الفعل وهو التحريم، أو طلب الفعل بدون المنع عن الترك وهو الندب، أو طلب الترك بدون المنع عن الفعل وهو الكراهة. ومعنى التخيير عدم طلب الفعل والترك وهو الإباحة.إن قيل إذا كان الخطاب متعلّقا بأفعال المكلّفين في الأزل كما هو رأي الأشعري يلزم طلب الفعل والترك من المعدوم وهو سفه. قلت السفه إنّما هو طلب الفعل أو الترك عن المعدوم حال عدمه. وأمّا طلبه منه على تقدير وجوده فلا، كما إذا قدّر الرجل ابنا فأمره بطلب العلم حين الوجود لكن بقي أنّه يلزم خروج الخطاب الوضعي من الحدّ، مع أنّه حكم فإنّ الخطاب نوعان: تكليفي وهو المتعلّق بأفعال المكلفين بالاقتضاء، والتخيير، ووضعي وهو الخطاب باختصاص شيء بشيء وذلك على ثلاثة أقسام:سببي كالخطاب بأنّ هذا سبب لذلك كالدلوك للصلاة، وشرطي كالخطاب بأنّ هذا شرط لذلك كالطهارة للصلاة، ومانعي أي هذا مانع لذلك كالنجاسة للصلاة. فأجاب البعض عنه بأنّ خطاب الوضع ليس بحكم، وإن جعلها غيرنا حكما إذ لا مشاحة في الاصطلاح ولو سلّم أنّه حكم فلا نسلّم خروجه عن الحدّ إذ المراد من الاقتضاء والتخيير أعمّ من التصريحي والضمني، والخطاب الوضعي من قبيل الضمني إذ معنى سببية الدلوك وجوب الصلاة عند الدلوك.ومعنى شرطية الطهارة وجوبها في الصلاة أو حرمة الصلاة بدونها. ومعنى مانعية النجاسة حرمة الصلاة معها أو وجوب إزالتها حالة الصلاة، وكذا في جميع الأسباب والشروط والموانع. وبعضهم زاد قيدا في التعريف ليشتمله، فقال بالاقتضاء أو التخيير أو الوضع، أي وضع الشارع وجعله. فإن قلت الحكم يتناول القياس المحتمل للخطأ فكيف ينسب إلى الله تعالى؟ قلت الحاكم في المسألة الاجتهادية هو الله تعالى إلّا أنه لم يحكم إلّا بالصواب.فالحكم المنسوب إليه هو الحق الذي لا يحوم حوله الباطل، وما وقع من الخطأ للمجتهد فليس بحكم حقيقة بل ظاهرا وهو معذور في ذلك.قال صدر الشريعة بعضهم عرّف الحكم الشرعي بهذا التعريف المذكور، فإذا كان هذا التعريف للحكم فمعنى الشرعي ما يتوقّف على الشرع فيكون قيدا مخرجا لوجوب الإيمان ونحوه. وإذا كان تعريفا للحكم الشرعي فمعنى الشرعي ما ورد به خطاب الشارع لا ما يتوقّف على الشرع، وإلّا لكان الحدّ أعمّ من المحدود لتناوله مثل وجوب الإيمان. ومعنى الحكم في قولنا الحكم الشرعي على هذا إسناد أمر إلى آخر، وإلّا لزم تكرار قيد الشرعي. وقال الآمدي الحكم خطاب الشارع لفائدة شرعية. قيل إن فسّر الآمدي الفائدة الشرعية بمتعلّق الحكم فدور، ولو سلّم أن لا دور فلا دليل عليه في اللفظ. وإن فسّرها بما لا تكون حسّية ولا عقلية على ما يشعر به كلامه حيث قال: هذا القيد احتراز عن خطابه بما لا يفيد فائدة شرعية كالإخبار عن المحسوسات والمعقولات، وردّ على طرد الحدّ إخبار الشارع بالمغيبات كقوله تعالى: وَهُمْ مِنْ بَعْدِ غَلَبِهِمْ سَيَغْلِبُونَ فزيد قيد يختصّ به ليخرج ما أورد عليه إذ لا تحصل تلك الفائدة إلّا بالاطلاع على الخطاب لأنّ فائدة الإخبار عن المغيّبات قد يطّلع عليها لا من خطاب الشرع، إذ لكل خبر مدلول خارجي قد يعلم وقوعه بطريق آخر كالإحساس في المحسوسات والضرورة، والاستدلال في المعقولات والإلهام، مثلا في المغيبات فإن للخبر لفظا ومعنى ثابتا في نفس المتكلم يدلّ عليه اللفظ فيرتسم في نفس السامع، هو مفهوم الطرفين والحكم، ومتعلقا لذلك المعنى هو النسبة المتحققة في نفس الأمر بين الطرفين يشعر اللفظ بوقوعه في الخارج. لكن الإشعار بوقوعه لا يستلزم وقوعه بل قد يكون واقعا فيكون الخبر صادقا وقد لا يكون فيكون كاذبا، بخلاف الحكم بالمعنى المذكور فإنّه إنشاء والإنشاء له لفظ ومعنى يدلّ عليه لكن ليس لمعناه متعلّق يقصد الإشعار والإعلام به، بل إنّما يقصد به الإشعار بنفس ذلك المعنى الثابت في النفس كالطّلب مثلا في الإنشاءات الطلبية.ومثل هذا المعنى لا يعلم إلّا باللفظ توقيفا، أي بطريق جعل السامع واقفا على ثبوته في النفس، فيختصّ بالخطاب الدال عليه. فمثل قوله تعالى كُتِبَ عَلَيْكُمُ الصِّيامُ إن قصد به الإعلام بنسبة واقعة سابقة كان خبرا فلا يكون حكما بالمعنى المذكور، وإن قصد به الإعلام بالطلب القائم بالنفس كان إنشاء فيكون حكما. قيل هاهنا دور إذ معرفة الخطاب المفيدة فائدة مختصّة به موقوفة على تصوّر الفائدة المختصّة ضرورة توقّف الكلام على تصوّر أجزائه، وهي متوقّفة على الخطاب فيلزم الدور. قيل جوابه أنّ المتوقّف على الخطاب حصول الفائدة، وما توقّف عليه الخطاب تصوّرها وحصول الشيء غير تصوّره فلا دور. قيل لا حاجة إلى زيادة القيد بل الحدّ مطّرد ومنعكس لا غبار عليه وذلك بأن تفسّر الفائدة الشرعية بتحصيل ما هو حصولها بخطاب الشارع دون ما هو حاصل في نفسه ولو في المستقبل، ورد به خطاب الشرع أم لا، لكنه يعلم بخطابه كالمغيّبات، فإنّ الإخبار عنها لا يحصلها بل يفيد العلم بها.لكن بقي بعد شيء وهو أنّ مثل قوله تعالى فَنِعْمَ الْماهِدُونَ ونِعْمَ الْعَبْدُ يدخل في الحدّ وليس بحكم.ومنها الأثر الثابت بالشيء كما وقع في الهادية حاشية الكافية في بحث المعرب. وفي العارفية حاشية شرح الوقاية في بيان الوضوء كون الحكم بمعنى الأثر الثابت بالشيء إنما هو من أوضاع الفقهاء واصطلاحات المتأخرين انتهى. وفي التوضيح يطلقون الحكم على ما ثبت بالخطاب كالوجوب والحرمة مجازا بطريق إطلاق اسم المصدر على المفعول كالخلق على المخلوق. لكن لما شاع فيه صار منقولا اصطلاحيا وهو حقيقة اصطلاحية انتهى.وحاصل هذا أنّ الحكم عند الفقهاء هو أثر خطاب الشارع.ومنها الأثر المترتّب على العقود والفسوخ كملك الرقبة أو المتعة أو المنفعة المترتّب على فعل المكلّف وهو الشراء. وفي التلويح في باب الحكم إطلاق الحكم في الشرع على خطاب الشارع وعلى الأثر المترتّب على العقود والفسوخ إنّما هو بطريق الاشتراك انتهى. فعلم من هذا أنّ إطلاق الحكم على الأثر الثابت بالشيء ليس من أوضاع الفقهاء كما ذكره صاحب العارفية، اللهم إلّا أن يراد بالشيء خطاب الشارع أو العقود والفسوخ. نعم إطلاقه بهذا المعنى شائع في عرفهم وعرف غيرهم.قال المولوي عصام الدين في حاشية الفوائد الضيائية: تفسير الحكم بالأثر المترتّب على الشيء مما أتى به أقوام بعد أقوام وإن لم أعثر على مأخذه في أفانين الكلام انتهى.ومنها الخاصة كما وقع في الحاشية الهندية في بحث المعرب. قال في الهادية هذا من قبيل ذكر اللازم وإرادة الملزوم لأنّ حكم الشيء أي أثره لا يكون إلّا مختصا به ضرورة استحالة توارد المؤثّرين على أثر واحد.تقسيمما يطلق عليه لفظ الحكم شرعا على ما اختاره صدر الشريعة في التوضيح هو ما حاصله أنّ الحكم إمّا حكم بتعلّق شيء بشيء أو لا. فإن لم يكن فالحكم إمّا صفة لفعل المكلّف أو أثر له. فإن كان أثرا كالملك فلا بحث هاهنا عنه، وإن كان صفة فالمعتبر فيه اعتبارا أوليا إمّا المقاصد الدنيوية أو الأخروية.فالأول ينقسم الفعل بالنظر إليه تارة إلى صحيح وباطل وفاسد وتارة إلى منعقد وغير منعقد، وتارة إلى نافذ وغير نافذ، وتارة إلى لازم وغير لازم، والثاني إمّا أصلي أو غير أصلي.فالأصلي إمّا أن يكون الفعل أولى من الترك أو الترك أولى من الفعل، أو لا يكون أحدهما أولى. فالأوّل إن كان مع منع الترك بدليل قطعي ففرض أو بظني فواجب، وإلّا فإن كان الفعل طريقة مسلوكة في الدين فسنة، وإلّا فندب. والثاني إن كان مع منع الفعل فحرام وإلّا فمكروه. والثالث مباح وغير الأصلي رخصة. وإن كان حكما بتعلّق شيء بشيء فالمتعلّق إن كان داخلا فركن، وإلّا فإن كان مؤثّرا فيه فعلّة، وإلّا فإن كان موصلا إليه في الجملة فسبب، وإلّا فإن توقّف الشيء عليه فشرط، وإلّا فعلامة. وإنّما قلنا هذا تقسيم ما يطلق عليه لفظ الحكم شرعا إذ لو أريد بالحكم خطاب الشارع أو أثره لا يشمل الحكم نحو الملك لأنّ الملك إنّما ثبت بفعل المكلّف لا الخطاب. فالمقصود هاهنا بيان أقسام ما يطلق عليه لفظ الحكم في الشرع. فإنّ التحقيق أنّ إطلاق الحكم على خطاب الشرع وعلى أثره وعلى الأثر المترتّب على العقود والفسوخ إنّما هو بطريق الاشتراك، هكذا ذكر في التلويح في باب الحكم. ومثل هذا تقسيمهم العلّة إلى سبعة أقسام كما يجيء في محله.اعلم أنّ أفعال المكلّف اثنا عشر قسما لأنّ ما يأتي به المكلّف إن تساوى فعله وتركه فمباح، وإلّا فإن كان فعله أولى فمع المنع عن الترك واجب وبدونه مندوب. وإن كان تركه أولى فمع المنع عن الفعل بدليل قطعي حرام وبدليل ظنّي مكروه كراهة التحريم، وبدون المنع عن الفعل مكروه كراهة التنزيه، هذا على رأي محمد. وأمّا على رأيهما فهو أنّ ما يكون تركه أولى من فعله فهو مع المنع عن الفعل حرام، وبدونه مكروه كراهة التنزيه إن كان إلى الحلّ أقرب، بمعنى أنّه لا يعاقب فاعله لكن يثاب تاركه أدنى ثواب، ومكروه كراهة التحريم إن كان إلى الحرام أقرب، بمعنى أنّ فاعله يستحق محذورا دون العقوبة بالنار. ثم المراد بالواجب ما يشمل الفرض أيضا لأنّ استعماله بهذا المعنى شائع عندهم كقولهم الزكاة واجبة والحج واجب، بخلاف إطلاق الحرام على المكروه تحريما فإنه ليس بشائع. والمراد بالمندوب ما يشمل السّنة الغير المؤكّدة والنفل.وأمّا السّنة المؤكّدة فهي داخلة في الواجب على الأصح، فصارت الأقسام ستة، ولكلّ منها طرفان، فعل أي الإيقاع، وترك أي عدم الفعل، فيصير اثنا عشر قسما، هكذا في التلويح وحواشيه.خاتمةقد عرفت أنّ الحكم عند الأصوليين هو نفس خطاب الله تعالى. فالإيجاب هو نفس معنى قوله افعل وهو قائم بذاته سبحانه، وليس للفعل من الإيجاب المتعلّق به صفة حقيقية قائمة به تسمّى وجوبا. فإنّ القول لفظيا كان أو نفسيا ليس لمتعلّقه منه صفة حقيقية، أي لا يحصل لما يتعلّق به القول بسبب تعلّقه به صفة موجودة لأنّ القول يتعلّق بالمعدوم كما يتعلّق بالموجود. فلو اقتضى تعلّقه تلك الصفة لكان المعدوم متصفا بصفة حقيقية، وهو أي معنى قوله افعل إذ أنسب إلى الحاكم تعالى لقيامه به يسمّى إيجابا، وإذا نسب إلى ما فيه الحكم وهو الفعل لتعلّقه به يسمّى وجوبا، فالإيجاب والوجوب متّحدان بالذات لأنّهما ذلك المعنى القائم بذاته تعالى المتعلّق بالفعل مختلفان بالاعتبار لأنّه باعتبار القيام إيجاب وباعتبار التعلّق وجوب، وكذا الحال في التحريم والحرمة وترتّب الوجوب على الإيجاب بأن يقال أوجب الفعل، فوجب مبني على التغاير الاعتباري، فلا ينافي الاتّحاد الذاتي. وهذا كما قيل التعليم والتعلّم واحد بالذات واثنان بالاعتبار لأنّ شيئا واحدا وهو إسباق ما إلى اكتساب مجهول بمعلوم يسمّى بالقياس إلى الذي يحصل فيه تعلّما، وبالقياس إلى الذي يحصل منه تعليما، كالتّحرّك والتّحريك. فلذلك الاتحاد ترى الأصوليين يجعلون أقسام الحكم الوجوب والحرمة تارة والإيجاب والتحريم أخرى ومرة الوجوب والتحريم. قيل ما ذكرتم إنما يدلّ على أنّ الفعل من حيث تعلّق به القول لم يتصف بصفة حقيقية يسمّى وجوبا، لكن لم لا يجوز أن يكون صفة اعتبارية هي المسمّاة بالوجوب، أعني كونه حيث تعلّق به الإيجاب، بل هذا هو الظاهر، فيكون كلّ من الموجب والواجب متصفا بما هو قائم به. ولا شكّ أنّ القائم بالفعل ما ذكرناه لا نفس القول، وإن كانت هناك نسبة قيام باعتبار التعلّق. ولو ثبت أنّ الوجوب صفة حقيقية لتمّ المراد إذ ليس هناك صفة حقيقية سوى ما ذكر إلّا أنّ الكلام في ذلك.واعلم أنّ النزاع لفظي إذ لا شكّ في خطاب نفساني قائم بذاته تعالى متعلّق بالفعل يسمّى إيجابا مثلا، وفي أنّ الفعل بحيث يتعلّق به ذلك الخطاب الإيجابي يسمّى وجوبا. فلفظ الوجوب إن أطلق على ذلك الخطاب من حيث تعلقه بالفعل كان الأمر على ما سبق، ولا يلزم المسامحة في وصف الفعل حينئذ بالوجوب، وإن أطلق على كون الفعل تعلّق به ذلك الخطاب لم يتحدا بالذات، وتلزم المسامحة في عباراتهم حيث أطلق أحدهما على الآخر. هذا كله خلاصة ما في العضدي وحواشيه.
