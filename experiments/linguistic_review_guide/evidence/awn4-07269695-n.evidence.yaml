          ذعنذعِنَ/ ذعِنَ لـ يَذعَن، ذَعَنًا، فهو ذاعِن، والمفعول مذعون له• ذعِن الشَّخصُ/ ذعِن للشَّخص: خضع، انقاد، ذَلَّ "ذعِن لسيِّده/ لأوامر الآخرين- هو يذعن للإهانة". 
          أذعنَ إلى/ أذعنَ بـ/ أذعنَ لـ يُذعن، إذعانًا، فهو مُذعِن، والمفعول مُذعَن إليه• أذعن إليه/ أذعن له: انقاد له وخضع وذلَّ وأسرع في الطاعة "أذعن لرأيه/ لرئيسه/ لأوامر أبيه- أذعنتِ الحكومةُ للمعارضة- {وَإِنْ يَكُنْ لَهُمُ الْحَقُّ يَأْتُوا إِلَيْهِ مُذْعِنِينَ} ".• أذعن المدينُ بالحقِّ: أقرّ به طائعًا غير مُكرَه، واعترف به "أذعن لرئيسه بالطاعة". 
          ذعَن [مفرد]: مصدر ذعِنَ/ ذعِنَ لـ. 
          مِذْعان [مفرد]: مؤ مِذْعان ومِذْعانة: صيغة مبالغة من ذعِنَ/ ذعِنَ لـ: مِطْواع، سَلِسُ القِياد، كثير الخضوع (للمذكّر والمؤنّث) "فرسٌ مِذْعان- مِذْعان لنصائح والدِه- امرأة مذعان/ مذعانة".
