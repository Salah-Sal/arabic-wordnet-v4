      - entry_id: 860460
        dictionary_id: 130
        headword: قنع
        headword_bare: قنع
        headword_norm: قنع
        root: قنع
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: |-
          قنعقنَعَ/ قنَعَ إلى يَقْنَع، قُنُوعًا، فهو قانِع، والمفعول مقنوع إليه• قنَع فلانٌ: رَضِيَ بالقَسْم واليسير وقبله "العبدُ حُرٌّ إذا قنَع، والحرُّ عبدٌ إذا طمِع- خير الغنى القنوع وشرُّ الفقر الخضوع [مثل]- {وَأَطْعِمُوا الْقَانِعَ وَالْمُعْتَرَّ} ".• قنع إلى الشّخص: خضع وانقطع إليه. 
          قنِعَ/ قنِعَ بـ يقْنَع، قَناعةً، فهو قانِع وقَنوع وقَنِع، والمفعول مقنوع به• قَنِع الشَّخْصُ/ قنِع الشَّخْصُ بالشَّيء: رَضِيَ بما أُعْطِي وقَبِلَه، عكس حرص "من لزم القناعةَ نال عِزًّا- من لم يقنع باليسير لم يكتفِ بالكثير- القناعة كنزٌ لا يَفْنَى [مثل]- {وَأَطْعِمُوا الْقَنِعَ وَالْمُعْتَرِيَ} [ق] ". 
          أقنعَ يُقْنِع، إقناعًا، فهو مُقْنِع، والمفعول مُقْنَع• أقنعه بالحُجَّة والدَّليل: جعله يطمئنُّ ويسلِّم بما أراده له "أقْنَعَه بصدْق نيَّاته/ برأيه- يكسب أو يضمّ شخصًا إلى صفِّه بالإقناع".• أقنعَ رأسَه: رفعه، وشخص ببصره نحو الشّيء في ذلّ وخشوع " {مُهْطِعِينَ مُقْنِعِي رُءُوسِهِمْ}: رافعين رءوسهم من شدّة الفزع". 
          اقتنعَ بـ يقتنع، اقْتِناعًا، فهو مُقْتَنِع، والمفعول مُقْتَنَعٌ به• اقتنع بصحَّةِ رأي خصمِهِ: رَضِيَ به بعد نقاش، واطمأنَّ إليه، وافق "اقتنع بخطئه/ بوجهة نظرنا". 
          تقنَّعَ يتَقَنَّع، تَقَنُّعًا، فهو مُتَقَنِّع• تقنَّع الشَّخصُ:1 - تكلَّف القناعةَ، أي الرِّضا بما أُعْطِيَ "تقنّع بما حصل عليه من أجر".2 - لبس قِناعًا، وهو ما يُستر به الوجهُ "تَقَنَّع اللِّصُّ قبْلَ السطو على البنك- تَقَنَّع في حفلة تنكُّريَّة- تقنعتِ المرأةُ". 
          قنَّعَ يقنِّع، تقنِيعًا، فهو مُقَنِّع، والمفعول مُقَنَّع• قنَّع المرأةَ: أَلْبَسَها القِناعَ "كلام مقنَّع".• قنَّعَه برأيه: جعله يقتنع، أرضاه به. 
          اقتِناع [مفرد]:1 - مصدر اقتنعَ بـ.2 - (سف) إذعان نفسيّ لما نجده من أدلَّة. 
          قانِع [مفرد]: ج قانعون وقُنَّع، مؤ قانعة، ج مؤ قانعات وقَنائعُ:1 - اسم فاعل من قنَعَ/ قنَعَ إلى وقنِعَ/ قنِعَ بـ.2 - سائل لا يلحف في السؤال، يرضى بما عنده أو بما يُعطى من الصدقة " {وَأَطْعِمُوا الْقَانِعَ وَالْمُعْتَرَّ} ". 
          قِناع [مفرد]: ج أَقْنِعَة: ما يُستر به الوَجهُ "قِنَاع المرأة- قاطع طريق يلبس قِنَاعًا- أغدقتِ المرأةُ قِنَاعَها: أرسلته وأرخته حتى غطَّى وجهَها" ° ألقى عن وجهه قِنَاع الحياء: لم يَسْتَحِ- قِنَاع واقٍ: يَحمي من الغازات السَّامَّة- كشَف القِناعَ عن الأمر: أبرزه وأظهر خفاياه- ليس من قناع يطول لبسه: خداع المظهر/ الزيف.• قِنَاع الأكسجين: أداة تُشبه القِنَاعَ توضع على الفم والأنف وتتّصل بأنبوب يُستنشق منه الأكسجين. 
          قَناعة [مفرد]:1 - مصدر قنِعَ/ قنِعَ بـ.2 - اقتناع "عندي قناعة بصحّة أقوالك- عن قناعة وجدانيّة". 
          قَنِع [مفرد]: صفة مشبَّهة تدلّ على الثبوت من قنِعَ/ قنِعَ بـ. 
          قَنوع [مفرد]: ج قُنُع:1 - صفة مشبَّهة تدلّ على الثبوت من قنِعَ/ قنِعَ بـ.2 - مُعْتَدل في لذَّات الحواسِّ ومُبْتَعِد عن كلِّ إفراط. 
          قُنوع [مفرد]: مصدر قنَعَ/ قنَعَ إلى. 
          مُقَنَّع [مفرد]: اسم مفعول من قنَّعَ: مُغَطِّي رأسَه ° بَطالة مقنَّعة: عدد الموظّفين الزّائد عن الحاجة في الهيئات والمصالح الحكوميَّة.
