        definitions_text: 'الأسيرُ. قيل: لأنه استسلم وانقاد شَجَرٌ من العضاه, شجرتُه سَلَمَةٌ العيدان طولًا شِبهُ القُضْبان,
          ليس لها خشبٌ وإن عظمت, ولَها شَوْكٌ دقيقٌ طويلٌ حادٌّ, وزهرةٌ صفراءُ فيها حبَّةٌ خضراءُ طيِّبةُ الرِّيح, تُؤكلُ
          فى الشتاء, وهى فى الصيف تَخْضَرُّ, وفيها شىءٌ من مرارة. وتحبُّها الظِّبَاءُ حبًّا شديدًا, يُدبَغُ بورقها وقشرها,
          ويُسَمَّى وَرَقُها القَرَظ (فى الزراعة) Acacia ehrenbergiana: نوعٌ من النباتات يتبع جنس السَّنْط من الفصيلة البقولية.
          وهى شجرة صحراوية شوكيَّة طويلة, توجد فى شرق وشمال أفريقيا فى المناطق الصحراوية قليلة الأمطار, كما تنتشر فى كل أنحاء
          الجزيرة العربية. تعتبر مصدرًا غذائيًّا لكثير من الحيوانات الصحراوية. وتسمى أيضًا السَّنُط الأرنبرغى'
