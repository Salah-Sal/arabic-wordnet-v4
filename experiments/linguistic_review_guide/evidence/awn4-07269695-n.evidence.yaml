        definitions_text: 'السُّلَّمُ الموسيقيُّ: تَسَلْسُلٌ نَغَمِيٌّ يحتوى على النَّغَمات الموسيقيَّةِ التى تُشَكِّلُ النِّظَامَ
          الموسيقىَّ لِشَعْبٍ ما, أو لأسلوب مؤلفٍ مُوسِيقِىٍّ. السُّلَّمُ الوظيفيُّ: مجموعةُ الوظائف التى يَشغَلُها الفردُ
