      - entry_id: 860475
        dictionary_id: 130
        headword: قود
        headword_bare: قود
        headword_norm: قود
        root: قد
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: |-
          قودقادَ1 يَقُود، قُدْ، قَوْدًا وقيادًا وقِيادَةً، فهو قائِد، والمفعول مَقُود• قاد الدَّابَّةَ أو الشّخصَ: مشى أمامها آخذًا بمِقْوَدِها "قاد أعمى".• قاده إلى مكتبِه: أوصله، أدَّى به إليه، حمله إليه "قاده إلى الخراب- قاد فلان القاتلَ إلى موضع القتل- قاد الدربُ إلى الطريق الرئيسيّ". 
          قادَ2 يَقُود، قُدْ، قيادةً، فهو قائد، والمفعول مقود• قاد السيّارةَ ونحوَها: ساقها، تولَّى توجيهها "يُحسن قيادة الطائرة".• قاد الجيشَ ونحوَه: ترأَّسه وتدبَّر أمرَه "قائد الفرقة الموسيقيّة- أَسْوَسُ الناس من قاد أبدان الرعيّة إلى طاعته بقلوبها". 
          أقادَ يُقيد، أَقِدْ، إقادةً، فهو مُقِيد، والمفعول مُقاد• أقاد المجرمَ إلى السِّجن: سيَّره، ساقه إليه. 
          اقتادَ يقتاد، اقْتَدْ، اقْتِيادًا، فهو مُقْتاد، والمفعول مُقْتاد• اقتاد الدَّابَّةَ: قادها؛ مشى أمامها آخذًا بِمِقْوَدِها.• اقتاده إلى السِّجن: حمله إليه "اقتادهم الشرطيُّ إلى الخارج- السياسة اقتياد قلوب العامّة بالإنصاف لها". 
          انقادَ/ انقادَ لـ ينقاد، انْقَدْ، انقيادًا، فهو مُنْقَاد، والمفعول مُنْقَاد له• انقاد الطَّريقُ: سهُل واستقام ° سَهْل الانقياد: متبعٌ للتعليمات ومطيعٌ للأوامر.• انقاد للهَوى: مُطاوع قادَ: لان وضَعُفَ أمامه، أو أذعن واستسلم له، خضع وذلَّ "هو ينقاد بسهولة- انقاد لميوله/ لأوامر الآخرين- انقاد السجينُ لأوامر الحارس"? الرَّأي العامّ المُنقاد: الرَّأي الذي تمثّله الأكثريّة السّاحقة من جمهور الأمِّيِّين وغيرهم من الذين نالوا قدرًا ضئيلاً من الثقافة، وهؤلاء يُؤمنون بكلّ ما يُشاع أو يُنشر ولا يحاولون التفكير فيما يحتويه من صواب أو خطأ أو حقّ أو باطل. 
          إقادة [مفرد]: مصدر أقادَ. 
          انقياد [مفرد]: مصدر انقادَ/ انقادَ لـ. 
          انقياديَّة [مفرد]:1 - اسم مؤنَّث منسوب إلى انقياد: "معظم الشعوب العربية شعوب انقياديّة لا قياديّة".2 - مصدر صناعيّ من انقياد: حالة من الخضوع التامّ والاستسلام "تجلَّت مظاهر الضعف لدى بعض الدول في الانصياع والانقياديّة التامَّة لأمريكا". 
          قائِد [مفرد]: ج قائدون وقادة وقُوَّاد:1 - اسم فاعل من قادَ2: "القائِدُ الأعْلَى للجيش: رئيس الجمهوريّة- القائد العامّ للقوّات المسلحة: وزير الدفاع- قادة الفكر".2 - زعيم أو شخص يقود مَنْ دونه "قادة الأحزاب السِّياسيّة- القادة السياسيُّون". 
          قاد [مفرد]: قدْر، مقدار " {فَكَانَ قَادَ قَوْسَيْنِ أَوْ أَدْنَى} [ق] ". 
          قِوادة [مفرد]: وساطة الفحشاء "أورثته القِوادة خسَّة وهوانًا". 
          قَوْد [مفرد]: مصدر قادَ1. 
          قَوَد [مفرد]: قِصاصٌ وقتل القاتل بدل القتيل "طلب القَوَدَ من القاتل- لم يعد القَوَد من مهمَّات أقارب القتيل بل هو أمرٌ يحكم به القضاء". 
          قوَّاد [مفرد]: سِمْسار الفاحِشة أو البِغاء "عرفوه قوَّادًا فتحاشوا عِشْرته". 
          قِياد [مفرد]: ج أَقْوِدة (لغير المصدر):1 - مصدر قادَ1.2 - ما تُقادُ به الدابَّة من حبل ونحوه "أعطى له القِياد: أذعن له- فلانٌ سهل القِياد: يتابعك على هواك- شباب صعب القِياد".3 - إذعانٌ، طاعة "سلس/ ليِّن القِياد" ° سلَّم قيادَه لشريكه: سلَّمه توجيهه وإدارة أموره وأذعن له. 
          قِيادة [مفرد]:1 - مصدر قادَ1 وقادَ2.2 - زعامَة "نجح الحزب بقيادة فلان- القيادات الشابّة في الحزب- تدريب القيادات الحزبيّة- السفينة المعقود لها لواء القيادة".3 - مركز القائد "مجلس قيادة الثورة- غرفة/ مقرّ القيادة- القيادة العليا- حجرة القيادة في الطائرة- عجلة/ رخصة/ منصَّة القيادة".4 - (نف) قدرة على معاملة الطبيعة البشريّة أو على التَّأثير في السُّلوك البشريّ لتوجيه جماعة من النّاس نحو هدف مشترك بطريقة تضمن بها طاعتهم وثقتهم واحترامهم وتعاونهم. 
          مُقاد [مفرد]: اسم مفعول من أقادَ. 
          مُقْتاد [مفرد]:1 - اسم فاعل من اقتادَ.2 - اسم مفعول من اقتادَ. 
          مِقْوَد [مفرد]: ج مقاوِدُ: اسم آلة من قادَ1 وقادَ2: ما تُقاد به الدابَّة أو الآلات المتحركة "مِقْوَد الجمل- مِقْوَد السيارة: جهاز مستدير يوجِّه به السائقُ السيارة- مِقْوَد الطائرة: قاعدة أو جهاز متحرِّك يستعمل في توجيه الطائرة إلى اليمين أو الشمال". 
          مُقِيد [مفرد]: اسم فاعل من أقادَ. 
          مُنْقاد [مفرد]:1 - اسم فاعل من انقادَ/ انقادَ لـ.2 - اسم مفعول من انقادَ/ انقادَ لـ.
