        dict_key: hawramani_34
        dict_name_ar: معجم اللغة العربية المعاصرة لأحمد مختار عمر
        dict_name_en: Ahmad Mukhtar Umar, Muʿjam al-Lugha al-ʿArabīya al-Muʿāṣira (d. 2003 CE)
        dict_source_type: hawramani
        dict_period: modern
        dict_author: null
        dict_death_year: 2003
        definitions:
        - sense_index: 0
          text: |-
            سلمسلِمَ/ سلِمَ لـ/ سلِمَ من يَسلَم، سلامةً وسلامًا، فهو سَالم وسَليم، والمفعول مَسْلومٌ له• سلِمَ فلانٌ: أمِن على نفسه وماله.• سلِم له الحكمُ: خلَص " {وَرَجُلٌ سَالِمٌ لِرَجُلٍ} [ق]: خالصٌ لمالك واحد".• سلِم من العيوب والآفات: بَرِئَ، ولم يُصَب بأذًى "سلِم من كارثة- لم يسلم من لسانه أحدٌ- في التَّأنّي السَّلامة وفي العجلة النَّدامة- العقل السليم في الجسم السليم [مثل] ". 
            أسلمَ يُسلم، إسلامًا، فهو مُسلِم، والمفعول مُسلَم (للمتعدِّي)• أسلم الشَّخصُ:1 - دخل في دين الإسلام وأصبح مسلمًا "طلب منه صديقه أن يُسلِم فأسلم- {فَإِنْ أَسْلَمُوا فَقَدِ اهْتَدَوْا} ".2 - أخلص الدِّين لله وانقاد وخضع له " {وَأُمِرْتُ أَنْ أُسْلِمَ لِرَبِّ الْعَالَمِينَ} ".• أسلم فلانًا: خذله، وتركه لعدوِّه.• أسلم الشَّيءَ إليه: دفعه إليه، وأعطاه له "أسلِمْ هذه الرِّسالة إلى أخيك" ° أسلَم الرُّوحَ: مات.• أسلم قيادَه إليه/ أسلم قيادَه له: فوّضه، وانقاد إليه وتبعه "أسلم أمَره إلى الله- {مَنْ أَسْلَمَ وَجْهَهُ لِلَّهِ وَهُوَ مُحْسِنٌ فَلَهُ أَجْرُهُ عِنْدَ رَبِّهِ} "? أسلم له القياد: تَبِعَهُ. 
            استسلمَ/ استسلمَ لـ يَستسلِم، استسلامًا، فهو مُستسلِم، والمفعول مستسلَمٌ له• استسلم الشَّخصُ/ استسلم الشَّخصُ للشَّيء: انقادَ وخضع وتوقّف عن المقاومة "استسلم للتَّهديدات/ للضُّغوط/ لشهواته وملذَّاته- استسلمت المدينةُ بعد حصار طويل" ° استسلامٌ مُخْزٍ: انقياد بلا مقاومة- استسلم له: أقرّ له بالغلبة.• استسلم لله: خضع خضوعًا مُطلقًا لإرادته " {بَلْ هُمُ الْيَوْمَ مُسْتَسْلِمُونَ} ". 
            استلمَ يستلم، استلامًا، فهو مُستلِم، والمفعول مُستلَم• استلم الحاجُّ الحجرَ الأسود في الكعبة: لمسَه بالقُبلة أو اليد، أو مسحه بكَفِّه "استلم يدَ والدِه: مسحَها وقبَّلها".• استلم الرِّسالَة: تسلَّمها وتلقَّاها ° إشعار بالاستلام: بطاقة ذات لون ممّيز ترسل إلى المرسل إليه للتوقيع على الاستلام. 
            تأسلمَ يتأسلم، تأسلُمًا، فهو مُتأسلِم• تأسلمَ فلانٌ: دخلَ في الإسلام. 
            تسالمَ يتسالم، تسالُمًا، فهو مُتسالِم• تسالمَ القومُ: تصالحوا، تعاهدوا على العَيْش في سلام. 
            تسلَّمَ يتسلَّم، تسلُّمًا، فهو مُتسلِّم، والمفعول مُتسلَّم• تسلَّم الشَّيءَ: مُطاوع سلَّمَ/ سلَّمَ بـ/ سلَّمَ على: أخذه وتناوَله، قبضه وتلقَّاه "تسلَّم رِسالةً/ عُهْدةً/ الطَّلبيّة- تسلَّم المبلغَ المرسل إليه" ° تسلَّم مقاليد الحكم: أصبح الحاكم. 
            تمسلَمَ يتمسلَم، تَمَسْلُمًا، فهو مُتمسلِم (انظر: م س ل م - تمسلَمَ). 
            سالمَ يسالم، مُسالَمةً وسِلاَمًا، فهو مُسالِم، والمفعول مُسالَم• سالَم زميلَه: صالحه "سالَم خصمَه بعد عداء دام سنوات- شخص مُسالم- من حقوق جارك عليك أن تُسالِمه". 
            سلَّمَ/ سلَّمَ بـ/ سلَّمَ على يُسلِّم، تسليمًا، فهو مُسلِّم، والمفعول مُسلَّم (للمتعدِّي)• سلَّمَ الشَّخصُ: استسلم، انقاد بدون مقاومة "سلّم
            نفسَه للشّرطة- {فَلاَ وَرَبِّكَ لاَ يُؤْمِنُونَ حَتَّى يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لاَ يَجِدُوا فِي أَنْفُسِهِمْ حَرَجًا مِمَّا قَضَيْتَ وَيُسَلِّمُوا تَسْلِيمًا} " ° سلَّم أمرَه إلى الله: فوّضه إليه- سلِّمْ نفسك: استسْلِمْ ولا تقاوم.• سلَّم المصلِّي: خرج من الصلاة بقوله: السّلام عليكم.• سلَّم الشَّيءَ / سلَّم الشَّيءَ إليه/ سلَّم الشَّيءَ له: أعطاه، ناوله إليه، أوصله إليه "سلّم الرِّسالة إلى صاحبها- {وَدِيَةٌ مُسَلَّمَةٌ إِلَى أَهْلِهِ}: مؤدَّاة، مدفوعة".• سلَّم نفسه للشرطة: ذهب إليها من تلقاء نفسه.• سلَّمه اللهُ من الأذى: نجَّاه وخلَّصه، كتب له السَّلامة والنجاة "سلَّمه اللهُ من الغرق- {وَلَكِنَّ اللهَ سَلَّمَ} ".• سلَّم بالأمرِ: رضي به، اعترف بصحته وصدَّق به، أقرّ "أسلِّم بصحّة ما قلتَ- سلَّم بصحّة الدَّعوى"? سلَّم بالأمر الواقع: أقرَّ به، ولم يسعَ لتغييره.• سلَّم على القوم:1 - حيّاهم بالسّلام "سلّمت عليهم فقالوا: وعليك السّلام- {حَتَّى تَسْتَأْنِسُوا وَتُسَلِّمُوا عَلَى أَهْلِهَا} " ° صلَّى الله عليه وسلَّم: دعاء للنبيّ محمد بالخير.2 - صافحهم "سلّمتُ عليهم واحدًا واحدًا". 
            مسلَمَ يمسلِم، مَسْلَمةً، فهو مُمسلِم، والمفعول مُمسلَم (انظر: م س ل م - مسلَمَ). 
            إسلام [مفرد]: مصدر أسلمَ.• الإسلام:1 - الدِّين السَّماويّ الذي بعث اللهُ به محمدًا صلَّى الله عليه وسلّم "الإسلام باللِّسان والإيمان بالقلب- {وَرَضِيتُ لَكُمُ الإِسْلاَمَ دِينًا} " ° الشَّريعة الإسلاميَّة: التعاليم القرآنيّة ومصادر التشريع الأخرى كالسُّنَّة والإجماع- دار الإسلام: بلاد المسلمين- مذاهب الإسلام: الحنفيّ والشافعيّ والمالكيّ والحنبليّ.2 - الشَّرع المبعوث به الرُّسل المبنيّ على التَّوحيد " {إِنَّ الدِّينَ عِنْدَ اللهِ الإِسْلاَمُ} ". 
            استسلاميَّة [مفرد]:1 - اسم مؤنَّث منسوب إلى استسلام: "لم يقبل الحلول الاستسلاميّة- صيغة/ شروط استسلاميّة".2 - مصدر صناعيّ من استسلام: نزعة لدى البعض تجعلهم خاضعين للأحداث خضوعًا تامًّا من غير أن يكون لديهم أيّ ردّ فعل "لم يستطع بعض الحكام التخلّص من الاستسلاميّة التي ظهرت في معظم قراراتهم". 
            تَسْليم [مفرد]:1 - مصدر سلَّمَ/ سلَّمَ بـ/ سلَّمَ على ° التَّسليم بالأمر الواقع: الإذعان لما حدث.2 - (جر) عمليّة إعطاء سلعة لمشتريها "ميعاد التَّسليم".3 - ترك الحرب مع الانقياد إلى إرادة المُسَلّم إليه. 
            تسليمة [مفرد]:1 - اسم مرَّة من سلَّمَ/ سلَّمَ بـ/ سلَّمَ على.2 - (فق) التفات المصلِّي في نهاية صلاته يمنة أو يسرة مع قوله: السَّلام عليكم ورحمة الله، بنيّة الخروج منها. 
            سالِم [مفرد]: اسم فاعل من سلِمَ/ سلِمَ لـ/ سلِمَ من.• جمعٌ سالمٌ: (نح) جمع يصاغ من المفرد بإضافة لاحقة، ويكون جمعًا مذكّرًا سالمًا بإضافة واو ونون أو ياء ونون على مفرده، مثل: مسلمون ومسلمين، وجمعًا مؤنّثًا سالمًا بإضافة ألف وتاء على مفرده، مثل: مسلمات.• الفعل السَّالم: (نح) ما خلت حروفه الأصليّة من العلّة والهمز والتَّضعيف. 
            سَلام [مفرد]:1 - مصدر سلِمَ/ سلِمَ لـ/ سلِمَ من.2 - أمان، سِلْم، صُلْح "السَّلام أمان الله في الأرض- معاهدة/ مؤتمر سلام- {سَلاَمٌ هِيَ حَتَّى مَطْلَعِ الْفَجْرِ} - {يَانُوحُ اهْبِطْ بِسَلاَمٍ مِنَّا} " ° السَّلام الملائكيّ/ السَّلام المريميّ: تحية جبريل لمريم العذراء- السَّلام ختام: عبارة تذكر في نهاية الحديث- حمامةُ السَّلام: حمامَة بيضاء تُمسِك بفيها غصنَ زيتون، تُتَّخذ رمزًا للسّلام- دار السَّلام: الجنَّة- سُبُل السَّلام: مساعيه، طُرق النَّجاة والأمن- عليه السَّلام: عبارة دُعائيّة تُذْكر قبل أسماء الأنبياء والملائكة، انتهى أجلُه، لم يعد أمل لإنقاذه- يا سلام!!: أسلوب تعجب واستغراب.3 - ثناء حسن " {سَلاَمٌ عَلَى إِبْرَاهِيمَ} ".• السَّلام:1 - اسم من أسماء الله الحُسنى، ومعناه: صاحب السَّلامة لكماله عن النّقائص والآفات في ذاته وصفاته وأفعاله، والذي يعطي السّلامة في الدّنيا والآخرة، والذي يُسلّم على أوليائه يوم القيامة " {الْمَلِكُ الْقُدُّوسُ السَّلاَمُ الْمُؤْمِنُ الْمُهَيْمِنُ} ".2 - التَّحية عند المسلمين " {وَإِذَا جَاءَكَ الَّذِينَ يُؤْمِنُونَ بِآيَاتِنَا فَقُلْ سَلاَمٌ عَلَيْكُمْ} " ° السَّلام عليكم ورحمة الله وبركاته: عبارة تقال عند ختام الصَّلاة، وعند لقاء شخص أو عند وداعه.• السَّلام الوطنيّ: نشيد البلاد الرّسميّ. 
            سَلامة [مفرد]: مصدر سلِمَ/ سلِمَ لـ/ سلِمَ من ° الحمد لله على السَّلامة: عبارة تقال للعائد من السّفر أو النَّاجي من حادث أو مرض أو نحوهما- سلامة أرض الوطن: صيانة حدوده وحفظها- سلامة النِّيّة: حسنُها- سلامتك: دعاء للمريض بالسّلامة والصحّة- مع السّلامة: عبارة تقال للمغادر- رواق السَّلامة: التَّدابير العسكريَّة الفعّالة المتّخذة للدِّفاع عن قوافل الجيش وحمايتها- سلامة الطَّريق: أمنها- السَّلامة العامَّة: أمن المواطنين العام- نسأل اللهَ السَّلامة والغنامة: البراءة والعافية والرزق. 
            سُلامَى [مفرد]: ج سُلامَيَات:1 - (شر) عظام الأصابع في اليد والقدم "عَلَى كُلِّ سُلاَمَى مِنْ أَحَدِكُمْ صَدَقَةٌ [حديث] ".2 - (نت) قصبة تقع في عقدتين. 
            سُلَّم [مفرد]: ج سَلالِمُ:1 - مِرْقاة، ما يُصعد عليه إلى الأماكن العالية "سُلّم مكتبة- هذه سلَّمٌ قويَّة- سُلّم متحرِّك- {أَمْ لَهُمْ سُلَّمٌ يَسْتَمِعُونَ فِيهِ} " ° السُّلّم الكهربائيّ: سلّم ميكانيكيّ متحرِّك صعودًا أو هبوطًا على نحو متواصل- دَرَجُ السُّلَّم: ما يُتخطّى عليه من الأدنى إلى الأعلى في الصُّعود أو العكس.2 - وسيلة يتوصّل بها إلى شيءٍ ما "يتّخذ منصبَه سُلّمًا إلى أهداف أخرى- التَّواضع سُلّم الشَّرف" ° السُّلَّم الاجتماعيّ: المراتب الاجتماعيّة- سُلّم المرتَّبات: جدولها.• السُّلَّم الموسيقيّ: (سق) جملة نغم مفصّلة الحدود بالحساب درجة فوق الأخرى، في جمع أقلّه خمس وأكثره ثمان. 
            سُلَّمة [مفرد]: ج سُلَّمات: مسند للقدم في الصّعود أو الهبوط. 
            سَلْم/ سِلْم [مفرد]:1 - سلام، أمان، وصلح، خلاف الحرب "يُدرك السِّلْم بالحرب- إذا أردت السِّلْم فتأهّب للحرب- {ادْخُلُوا فِي السِّلْمِ كَافَّةً} - {وَإِنْ جَنَحُوا لِلسَّلْمِ فَاجْنَحْ لَهَا} " ° ثورة سِلْميَّة: ثورة تحقِّق أغراضها دون سلاح، أو إراقة دماء.2 - مُسالِم "أنا سِلْم لمن سالمني". 
            سَلَم [مفرد]: استسلام وخضوع " {وَأَلْقَوْا إِلَى اللهِ يَوْمَئِذٍ السَّلَمَ} ".• رجلٌ سَلَم: سالم خالصٌ لمالك واحد " {وَرَجُلاً سَلَمًا لِرَجُلٍ} ". 
            سَلِيم [مفرد]: ج سُلَماءُ وسَلْمى: صفة مشبَّهة تدلّ على الثبوت من سلِمَ/ سلِمَ لـ/ سلِمَ من ° ذوق سليم: حسَن- سلوك سليم: صحيح، خالٍ من الغشّ والخداع- سليم البنية/ سليم الجسم: خالٍ من الأمراض- سليم العاقبة: غير خطر- سليم العقل: عاقل، ليس مجنونًا- سليم النِّيّة: ذو نيّة حسنة- قَلْبٌ سليم: نقيّ بريء.• السَّليم: الملدوغ (تيمُّنًا). 
            مُسالِم [مفرد]:1 - اسم فاعل من سالمَ.2 - غير مؤذٍ، يميل إلى السّلام وعدم الاعتداء "رجل مُسالم لا يؤذي أحدًا- شعب مسالِم". 
            مُسَلَّمة [مفرد]: ج مُسَلَّمات:1 - صيغة المؤنَّث لمفعول سلَّمَ/ سلَّمَ بـ/ سلَّمَ على.2 - خالية من العيوب " {مُسَلَّمَةٌ لاَ شِيَةَ فِيهَا} ".3 - (سف) بديهيّة لا تقبل الجدل، قضيّة مُسلَّم بها بدون بُرهان عليها "أمور مُسَلَّمة".4 - (سف) مقولة تُقبل بدون برهان، وتُستنبط منها مقولات أخرى. 
            مُسلِم [مفرد]: اسم فاعل من أسلمَ.• المسلم: من صدّق برسالة محمد صلّى الله عليه وسلَّم وأظهر الخضوع والقبول لها، مَن اعتنق الإسلامَ "الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ [حديث]- الْمُسْلِمُ أَخُو الْمُسْلِمِ لاَ يَظْلِمُهُ [حديث] ".
