          is_raw: 0
        examples:
        - idx: 0
          type: poetry
          text: هاجوا لقومهم السلام كأنهم / لما أصيبوا أهل دين محتر
          attribution: أبو كبير الهذلي
        - idx: 1
          type: poetry
          text: إذا ما دار سيار أبيحت / تناهى الغل واقترب السلام
          attribution: ابن نجدة الفهمي
        - idx: 2
          type: poetry
          text: تعرض جابة المدرى خذول / بصاحة في أسرتها السلام
          attribution: بشر بن أبي خازم
        - idx: 3
          type: poetry
          text: حور يعللن العبير روادعا / كمها الشقائق أو ظباء سلام
          attribution: امرؤ القيس
        - idx: 4
          type: usage
          text: 'وقيل لأعرابي: السلام عليك. قال: الجثجاث عليك. قيل: ما هذا الجواب؟ قال: هما شجران مران, وأنت جعلت علي واحدا,
            فجعلت عليك الآخر.'
          attribution: null
