            \ أُمُّه فلا ترويه فيبقى مستجيعاً\nيعترض كل من لقي فيأْكل ويَمَصُّ، ويُلْقَى على الشاة فَيَرْضَعُها، وهو\nعذاب\
            \ الصبي. وقال أَبو سعيد فيما رَدَّ على أَبي عبيد: الدَّغْرُ في\nالفصيل أَن لا ترويه أُمُّه فَيَدْغَرَ في ضرع غيرها،\
            \ فقال، عليه الصلاة\nوالسلام: لا تُعَذِّبْنَ أَولادكُنَّ بالدَّغْرِ ولكن أَرْوينَهُمْ لئلا\nيَدْغَروا في كل ساعة\
            \ ويستجيعوا؛ وإِنما أَمر بإِرواءِ الصبيان من اللبن.\nقال الأَزهري: والقول ما قال أَبو عبيد وقد جاءَ في الحديث\
            \ ما دل على صحة\nقوله. والدَّغْرُ: الوُجور. ودَغَرَهُ أَي ضَغَطَهُ حتى مات، ولونٌ\nمُدَغَّرٌ: قبيح؛ قال:\nكَسا\
            \ عامِراً ثَوْبَ الدَّمامَةِ رَبُّهُ،\nكما كُسِيَ الخِنْزيرُ ثَوْباً مُدَغَّرا\nدغمر: الدَّغْمَرَةُ: الخَلْطُ.\
            \ يقال: خُلُقٌ دُغْمُريٌّ ودَغْمَريٌّ.\nوالدَّغْمَرَةُ: تخليط اللَّونِ والخُلْقِ؛ قال رؤْبة:\nإِذا امْرُؤٌ دَغْمَرَ\
            \ لَوْنَ الأَدْرَنِ،\nسَلَّمْتُ عِرْضاً لَوْنُه لم يَدْكَنِ\nالأَدْرَنُ: الوَسِخُ. ودَغْمَرَ: خَلَطَ. لم يدكن:\
            \ لم ينشخ؛ قاله ابن\nالأَعرابي. ورجل دُغْمورٌ: سيء الثناء. ورجل مُدغْمَرُ الخُلُقِ أَي ليس\nبصافي الخُلُقِ. وخُلُقٌ\
            \ دَغْمَرِيُّ وفي خُلُقه دَغْمَرَةٌ أَي شَراسَةٌ\nولُؤْمٌ؛ قال العجاج:\nلا يَزْدهيني العَمَلُ المَقْزِيُّ،\nولا\
            \ مِنَ الأَخْلاقِ دَغْمَرِيُّ\nوالدَّغْمَرِيُّ: السَّيِّءُ الخُلُق، وكذلك الذُّغْمُورُ، بالذال،\nالحَقُودُ الذي\
            \ لا ينحلُّ حقده. ودَغْمَرَ عليه الخَبَرَ: خلطه.\nوالمُدَغْمَرُ: الخَفِيُّ."
