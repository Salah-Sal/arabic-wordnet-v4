        examples:
        - idx: 0
          type: quran
          text: هُوَ اللَّهُ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ
          attribution: الحشر/ ٢٣
        - idx: 1
          type: poetry
          text: إلى الحوَلِ ثُمَّ اسْمُ السَّلامِ عَلَيْكما / ومن يَبْكِ حَوْلاً كـامِلًا فَقَدِ اعْتَذَرْ
          attribution: لبيد
        - idx: 2
          type: hadith
          text: ثلاثةٌ كلُّهُمْ ضامِنٌ على الله, أَحَدُهُمْ مَنْ يَدْخُلُ بيْتَه بِسَلَامٍ
          attribution: null
        - idx: 3
          type: hadith
          text: 'كان إذا دخَلَ القُبور, قال: سلامٌ عليكمْ دَارَ قَوْمٍ مُؤِمنين'
          attribution: null
        - idx: 4
          type: hadith
          text: قُل السَّلامُ عَلَيْكَ, فإِنَّ عَلَيْكَ السَّلامَ تَحيَّةُ المُوتَى
          attribution: null
        - idx: 5
          type: poetry
          text: عَلَيْكَ سَلَامُ الله قَيْسَ بْنَ عَاصِمٍ / ورَحْمَتُهُ ما شَاءَ آن يَتَرَحَّما
          attribution: عَبْدَةُ بْنُ الطَّبيبِ
        - idx: 6
          type: poetry
          text: عَلَيْكَ سَلَامٌ مِن أَمِيرٍ وبَارِكَتْ / يَدُ اللهِ في ذاك الأَدِيمِ الْمُمَزَّقِ
          attribution: حَسَّانُ بْنُ ثَابِت
        - idx: 7
          type: quran
          text: وَإِذَا جَاءَكَ الَّذِينَ يُؤْمِنُونَ بِآيَاتِنَا فَقُلْ سَلَامٌ عَلَيْكُمْ
          attribution: الأنعام / ٥٤
        - idx: 8
          type: quran
          text: سَلَامٌ عَلَيْكُم بِمَا صَبَرْتُمْ فَنِعْمَ عُقْبَى الدَّارِ
          attribution: الرعد/ ٢٤
        - idx: 9
          type: quran
          text: قَالَ سَلَامٌ عَلَيْكَ سَأَسْتَغْفِرُ لَكَ رَبِّي
          attribution: مريم /٤٧
