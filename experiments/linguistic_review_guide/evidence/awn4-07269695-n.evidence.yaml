              ذ ع ن
              أذعن له إذا سلس وانقاد، وهوله مذعن. وتقول: هو في الإساءة إليك ممعن، وأنت منقاد له مذعن. وأذعن فلان بحقي: أقر به. وناقة مذعان: سلسة القياد. قال زهير:
