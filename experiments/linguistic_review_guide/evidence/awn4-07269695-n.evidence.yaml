            ضَيّق: النفس: مربو، مصاب بالربو (بوشر).
            ضَيّق: من الخيل المصاب بربو الخيل (بوشر).
            خلقه ضَيّق: انقياد، إذعان، قهر، إخضاع استعباد (بوشر).
            مُضَيّق - رجل مضيق اللثام: رجل ملثم (بوشر).
