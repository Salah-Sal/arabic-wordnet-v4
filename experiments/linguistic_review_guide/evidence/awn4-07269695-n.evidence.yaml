        form: null
        is_partial: 0
        definitions_text: '(فى الطب) (Phalanges E): العظامُ الصغيرةُ التى تكوِّن أصابع الكفِّ والقدم. ويتكون كلُّ إصبع من
          أصابع اليد من ثلاث سُلاميات, ما عدا الإبهام, فهو مكوَّن من سُلامَيَيْن. ويوجد نفسُ العدد في سُلاميات القَدم, ولكن
          تختلف في الحَجْم.'
