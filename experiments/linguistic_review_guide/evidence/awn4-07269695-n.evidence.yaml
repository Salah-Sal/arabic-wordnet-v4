        definitions_text: '[كنز] نه: فيه: كل مال أديت زكاته فليس "بكنز"، هو لغة: المال المدفون تحت الأرض فإذا أخرج منه الواجب
          لم يبق كنزًا شرعًا وإن كان مكنوزًا لغة. ن: هو كل شيء جمع بعضه على بعض كان في بطن الأرض أو ظهرها والمراد بالآية ما
          لم يؤد زكاته، وقيل: منسوخة، وقيل: خاص بأهل الكتاب. نه ومنه: بشر "الكنازين" برضف من جهنم، هم جمع كناز وهو المبالغ
          في كنز الذهب والفضة وادخارهما وترك إنفاقهما في أبواب البر. ن: ظاهره أنه استدل به لمذهبه في أن الكنز كل ما فضل عن
          الحاجة، والصحيح أنه ما لم يؤد زكاته. وقيل: إنه إنكار على سلاطين يأخذون من بيت المال لأنفسهم، ورد بأن سلاطين زمانه
          الخلفاء الثلاثة وهم معصومون عنه. نه: ومنه: لا حول ولا قوة إلا بالله كنز من كنوز الجنة، أي أجرها مدخر لقائلها والمتصف
          بها كما يدخر الكنز. ن: وجه الشبه النفع والنفاسة لأنه استسلام وتفويض إلى الله وانه لا يملك شيئًا من أمره. وح: أعطيت
          "الكنزين": الذهب والفضة، أي كنز كسرى وقيصر، وروى: كنز آل كسرى الذي في الأبيض، أي في قصره الأبيض، أو قصوره ودوره
          البيض. وح إخراج "كنز" الكعبة بذي السويقتين في س. نه: وفي ش: فحمل الهم "كنازًا" جلعدا، هو المجتمع اللحم القوية، وكل
          مجتمع مكتنز، ويروى بلام- ومر.'
