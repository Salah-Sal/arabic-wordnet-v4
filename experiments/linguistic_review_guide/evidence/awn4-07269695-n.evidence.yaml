          attribution: جرير
        - idx: 5
          type: poetry
          text: حُبُّ السَّلامَةِ يُثْنِى هَمَّ صاحِبِه / عَنِ المَعالي ويُغْرِى الْمَرْءَ بالكَسَل / فَإِنْ جَنَحْتَ إِليه
            فاتَّخِذْ نَفَقًا / في الأَرْضِ أَوْ سُلَّمًا في الجَوِّ فاعْتَزِل
          attribution: الطغرائي
        - idx: 6
          type: poetry
          text: لا تَمْنَعُ المرْءَ أحْجاءُ البلادِ ولا / تُبْنى له فى السَّماواتِ السَّلاليمُ
          attribution: ابن مقبل
        - idx: 7
          type: poetry
          text: فَأَلْقَتْ لَهُ الْأَيَّامُ كُلَّ حَبِيبَةٍ / على ذِروةٍ لا تُرْتَقَى بالسَّلالمِ
          attribution: الفرزدق
        - idx: 8
          type: poetry
          text: مُطَارَةُ قَلْبٍ إِنْ ثَنَى الرِّجْلَ رَبُّها / بِسُلَّمِ غَرْزٍ في مُناخٍ تُعاجِلُهْ
          attribution: أبو الربيس التغلبي
        - idx: 9
          type: poetry
          text: مَنَنْتُ فلا تَكْفُرْ بلائي ونِعْمتى / وأَدِّ كما أَدَّاكَ – يازَيْدُ – سُلَّما
          attribution: زبان بن سيار
