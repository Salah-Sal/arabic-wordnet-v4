        definitions_text: |-
          الحكم: بِضَم الْحَاء وَسُكُون الْكَاف أثر الشَّيْء الْمُتَرَتب عَلَيْهِ. وَفِي الْعرف إِسْنَاد أَمر إِلَى أَمر آخر إِيجَابا أَو سلبا. فَخرج بِهَذَا مَا لَيْسَ بِحكم كالنسبة التقييدية. وَفِي اللُّغَة تَوْجِيه الْكَلَام نَحْو الْغَيْر للإفهام ثمَّ نقل إِلَى مَا يَقع بِهِ الْخطاب. وَلِهَذَا قَالُوا إِن مُرَاد الْأُصُولِيِّينَ بخطاب الله تَعَالَى هُوَ الْكَلَام اللدني.
          وَالْحكم المصطلح عِنْد الْأُصُولِيِّينَ: هُوَ أثر حكم الله الْقَدِيم فَإِن إِيجَاب الله تَعَالَى قديم وَالْوُجُوب حكمه وأثره. وَالتَّفْصِيل فِي كتب الْأُصُول وَفِي التَّلْوِيح أَن إِطْلَاق الحكم على خطاب الشَّارِع وعَلى أَثَره وعَلى الْأَثر الْمُتَرَتب على الْعُقُود والفسوخ بالاشتراك اللَّفْظِيّ. ومرادهم بالمحكوم عَلَيْهِ من وَقع الْخطاب لَهُ وبالمحكوم بِهِ مَا تعلق بِهِ الْخطاب كَمَا يُقَال حكم الْأَمِير على زيد بِكَذَا.
          وَيعلم من التَّوْضِيح فِي بَاب الحكم أَن مورد الْقِسْمَة الحكم بِمَعْنى الْإِسْنَاد أَي إِسْنَاد الشَّارِع أمرا إِلَى أَمر فِيمَا لَهُ تعلق بِفعل الْمُكَلف من حَيْثُ هُوَ مُكَلّف صَرِيحًا كالنص أَو دلَالَة كالإجماع وَالْقِيَاس. فَفِي جعل الْوُجُوب وَالْملك وَنَحْو ذَلِك أقساما للْحكم بِهَذَا الْمَعْنى تسَامح ظَاهر.
          وَفِي اصْطِلَاح الْمَعْقُول: يُطلق على أَرْبَعَة معَان: الأول: الْمَحْكُوم بِهِ. وَالثَّانِي: النِّسْبَة الإيجابية أَو السلبية. وَالثَّالِث: التَّصْدِيق أَي إذعان أَن النِّسْبَة وَاقعَة أَو لَيست بواقعة. وَالرَّابِع: الْقَضِيَّة من حَيْثُ إِنَّهَا مُشْتَمِلَة على الرابط بَين الْمَعْنيين. وَتَحْقِيق أَن الحكم فِي الْقَضِيَّة الشّرطِيَّة إِمَّا فِي الْجَزَاء أَو بَين الشَّرْط وَالْجَزَاء فِي الْقَضِيَّة الشّرطِيَّة بِمَا لَا مزِيد عَلَيْهِ فَإِن أردْت الِاطِّلَاع عَلَيْهِ فَارْجِع إِلَيْهَا.
          وَاعْلَم أَن الحكم بِمَعْنى التَّصْدِيق هُوَ الإذعان كَمَا مر. ثمَّ مُتَعَلق الإذعان عِنْد الْمُتَقَدِّمين من الْحُكَمَاء هُوَ النِّسْبَة الَّتِي هِيَ جُزْء أخير من الْقَضِيَّة الَّتِي هِيَ من قبيل الْمَعْلُوم عِنْدهم - وَعند الْمُتَأَخِّرين مِنْهُم مُتَعَلق الإذعان هُوَ وُقُوع النِّسْبَة أَو لَا وُقُوعهَا الَّذِي هُوَ جُزْء أخير من الْقَضِيَّة فللقضية عِنْد الْمُتَقَدِّمين ثَلَاثَة أَجزَاء. وَعند الْمُتَأَخِّرين أَرْبَعَة كَمَا سَيَجِيءُ مفصلا فِي النِّسْبَة الْحكمِيَّة إِن شَاءَ الله تَعَالَى - وَالْحكم هُوَ إِدْرَاك أَن النِّسْبَة وَاقعَة أَو لَيست بواقعة. والإدراك إِمَّا من مقولة الانفعال أَو الكيف فَالْحكم كَذَلِك وَانْظُر فِي الْإِدْرَاك حَتَّى يزِيد لَك الْإِدْرَاك.
          وَاعْلَم أَن الإِمَام الرَّازِيّ مُتَرَدّد فِي كَون الحكم إدراكا أَو فعلا وَلم يذهب إِلَى تركيب التَّصْدِيق مَعَ فعلية الحكم كَمَا هُوَ الْمَشْهُور. نعم أَنه ذهب إِلَى تركيب التَّصْدِيق وَلِهَذَا قَالَ أفضل الْمُتَأَخِّرين مَوْلَانَا عبد الْحَكِيم رَحمَه الله فِي حَوَاشِيه على حَوَاشِي السَّيِّد السَّنَد الشريف الشريف قدس سره على شرح الشمسية قَوْله إِذا أردْت تقسيمه على مَذْهَب الإِمَام أَي على القَوْل بالتركيب فَلَا يرد أَن الإِمَام لَا يَقُول بِكَوْن الحكم إدراكا مَعَ أَنه قد نقل الْبَعْض أَن الإِمَام مُتَرَدّد فِي كَون الحكم إدراكا أَو فعلا. وَفِي حصر التَّقْسِيم على هذَيْن الْوَجْهَيْنِ إِشَارَة إِلَى بطلَان القَوْل بتركيب التَّصْدِيق مَعَ فعلية الحكم كَمَا هُوَ الْمَشْهُور من الإِمَام انْتهى.
