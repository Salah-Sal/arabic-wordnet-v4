            الحكم: بِضَم الْحَاء وَسُكُون الْكَاف أثر الشَّيْء الْمُتَرَتب عَلَيْهِ. وَفِي الْعرف إِسْنَاد أَمر إِلَى أَمر آخر إِيجَابا أَو سلبا. فَخرج بِهَذَا مَا لَيْسَ بِحكم كالنسبة التقييدية. وَفِي اللُّغَة تَوْجِيه الْكَلَام نَحْو الْغَيْر للإفهام ثمَّ نقل إِلَى مَا يَقع بِهِ الْخطاب. وَلِهَذَا قَالُوا إِن مُرَاد الْأُصُولِيِّينَ بخطاب الله تَعَالَى هُوَ الْكَلَام اللدني.
            وَالْحكم المصطلح عِنْد الْأُصُولِيِّينَ: هُوَ أثر حكم الله الْقَدِيم فَإِن إِيجَاب الله تَعَالَى قديم وَالْوُجُوب حكمه وأثره. وَالتَّفْصِيل فِي كتب الْأُصُول وَفِي التَّلْوِيح أَن إِطْلَاق الحكم على خطاب الشَّارِع وعَلى أَثَره وعَلى الْأَثر الْمُتَرَتب على الْعُقُود والفسوخ بالاشتراك اللَّفْظِيّ. ومرادهم بالمحكوم عَلَيْهِ من وَقع الْخطاب لَهُ وبالمحكوم بِهِ مَا تعلق بِهِ الْخطاب كَمَا يُقَال حكم الْأَمِير على زيد بِكَذَا.
