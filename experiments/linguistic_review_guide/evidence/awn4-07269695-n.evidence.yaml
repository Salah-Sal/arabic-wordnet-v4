      definitions_text: الأداءات التعليمية التي تحدث في الصف بين المعلم وتلاميذه بهدف إثارة دافعيتهم نحو الدرس ورفع كفاءة
        العملية التعليمية التي يمكن ملاحظتها وتسجيلها وتحليلها. ويشير التفاعل اللفظي الصفي إلى مجمل الكلام والأقوال التي يتناولها
        المدرس والطلاب فيما بينهم، وإلى ما يرافق هذا الكلام من أفعال واستجابات ترتبط بالعملية التعليمية التعلمية. كما يقوم
        المفهوم على فكرة التبادل الفعال للكلام في إطار عمليتي التعليم والتعلم اللتين تستهدفان إحداث تغييرات دائمة مرغوب فيها
        في سلوك المتعلمين وتتصلان بالأهداف التربوية والتعليمية المخططة لموضوعات المنهاج.
