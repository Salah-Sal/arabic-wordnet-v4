        definitions_text: 'الحِجَارَةُ اللَّدِيغُ. قيل: هو من السلامة على التفَاؤل له بها خِلافًا لما يُحذَر عليه منه. وقيل:
          بل لأنّه مُسْلَمٌ لِما به, أو أُسْلِمَ لما به تَرَقُّبًا لِمَا ينتهى إليه أمره بات بَلَيْلَةِ السَّلِيمِ (مجاز)
          الجريحُ المَشْفَى على الهَلَكة من الفَرَس: ما بين الأشعر وبين الصَّحْنِ من حافره'
