            definitions_text: "وهر: تَوَهَّرَ الليل والشتاء كَتَهَوَّرَ، وتَوَهَّرَ الرملُ كتهوّر\nأَيضاً.\nوالوَهَرُ: تَوَهُّجُ\
              \ وَقْعِ الشمس على الأَرض حتى ترى له اضطراباً\nكالبُخارِ؛ يمانية. ولَهَبٌ واهِرٌ: ساطِعٌ.\nوتَوَهَّرْتُ الرجلَ\
              \ في الكلام وتَوَعَّرْتُه إِذا اضْطَرَرْتَه إِلى ما\nبقي به متحيراً. ويقال: وَهَّرَ فلانٌ \n(* قوله« ويقال وهر\
              \ فلان إلخ«\nويقال أيضاً وهره كوعده كما في القاموس ) فلاناً إِذا أَوقعه فيما لا مخرج\nله منه.\nووَهْرانُ: اسم\
              \ رجل وهو أَبو بطن."
