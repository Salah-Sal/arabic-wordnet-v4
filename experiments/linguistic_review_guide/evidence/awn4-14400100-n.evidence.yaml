            definitions_text: 'الوَهَرُ، محرَّكةً: تَوَهُّجُ وَقْعِ الشمسِ على الأرضِ، حتى تَرَى له اضطِراباً كالبُخارِ.وتَوَهَّرَ
              الليلُ والشِتاءُ والرَّمْلُ: تَهَوَّرَ.ووَهْرانُ: أبو قَوْمٍ،ود بالأَنْدَلُسِ، منها عبدُ الرحمنِ بنُ عبدِ اللهِ
              شيخُ أبي عُمَرَ بنِ عبدِ البَرِّ،وع بفارسَ.ووَهَرَهُ، كوَعَدَه،ووَهَّرَهُ: أوقَعَهُ فيما لا مَخْرَجَ منه.وتَوَهَّرَ
              زَيدٌ فلاناً في الكلامِ: اضْطَرَّهُ إلى ما بَقِي فيه مُتَحَيِّراً.وأنا مُسْتَوْهِرٌ به ومُسْتَيْهِرٌ: مُسْتَيْقِنٌ.
              ويوسفُ ابنُ أيوبَ بنِ وهْرَةَ: محدِّثٌ.'
