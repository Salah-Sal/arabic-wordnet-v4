          - entry_id: 775384
            dictionary_id: 103
            headword: هرن
            headword_bare: هرن
            headword_norm: هرن
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              هرن: الأَزهري: أَما هرن فإِني لا أَحفظ فيه شيئاً، وإسم هَرُون
              مُعَرَّب لا اشتقاق له في العربية. وقال القتيبي: الهَيْرُون ضرب من التمر جيد
              لعمل السِّلِّ. ابن سيده: الهَرْنَوَى نبت، قال: لا أَعرف هذه الكلمة ولم
              أَرها في النبات، وأَنكرها جماعة من أَهل اللغة، قال: ولستُ أَدري
              الهَرْنَوَى مقصور أَم الهَرْنَوِيُّ، على لفظ النسب.
