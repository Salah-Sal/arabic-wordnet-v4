                اللَّهُمَّ أَن تغْفر لنا ذنوبنا، وتكفر عَنَّا سيىتنا، وَتب علينا وَعَافنَا واعف عَنَّا، وَأصْلح فَسَاد قُلُوبنَا،
                إِنَّك على كل شئ قدير.وَكَانَ الْفَرَاغ من ذَلِك فِي سحر لَيْلَة الِاثْنَيْنِ، لخمس بقيت من شهر رَمَضَان المكرم،
                من شهور سنة 1183 بمنزلى فِي عطفة الغسال، فِي مصر، حرست. وَكتبه مُحَمَّد مرتضى الحسينى، عَفا الله عَنهُ، آمين. بِسم
                الله الرَّحْمَن الرَّحِيم الْحَمد لله وَالصَّلَاة وَالسَّلَام على رَسُول الله؛ مُحَمَّد وعَلى آله وَصَحبه
                وَمِنْه تَبِعَهُمْ بِإِحْسَان. اللَّهُمَّ يسر يَا كريم.'
