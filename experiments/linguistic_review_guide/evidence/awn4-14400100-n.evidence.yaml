          - entry_id: 802117
            dictionary_id: 113
            headword: الهَيْرَةُ
            headword_bare: الهيرة
            headword_norm: الهيرة
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'الهَيْرَةُ: الأرضُ السَّهْلَةُ.والهِيرُ من الليلِ بالكسر والفتح وكسَيِّدٍ: الهِتْرُ، وريحُ
              الشَّمالِ.والهَيْرُونُ: تَمْرٌ م.واليَهْيَرُّ: الحَجَرُ الصُّلْبُ، أو حِجارَةٌ أمْثالُ الأَكفِّ، والصَّمْغَةُ
              الكبيرةُ، والسَّرابُ.ومنه: "أكْذِبُ من اليَهْيَرِّ"، واللَّجاجَةُ، والكَذِبُ، ودُوَيبَّةٌ أعْظَمُ من الجُرَذِ،
              والحَنْظَلُ، والسَّمُّ، وصَمْغُ الطَّلْحِ، وبهاءٍ من النُّوقِ: التي يَسيلُ لَبَنُها كثْرَةً.واليَهْيَرَّى، مَقْصوراً
              مشدَّداً: الماءُ الكثيرُ، والباطلُ، ونَباتٌ، أو شَجَرٌ، زِنَتُهُ يَفْعَلَّى أو فَعْيَلَّى أو فَعْلَلَّى.وهِيرٌ،
              بالكسر: ع بالبادِيَةِ.والهَيارُ، كسَحابٍ: الذي يَنْهارُ ويَسْقُطُ.'
