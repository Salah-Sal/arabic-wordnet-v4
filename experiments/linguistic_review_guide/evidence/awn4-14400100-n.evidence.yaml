          - entry_id: 955499
            dictionary_id: 145
            headword: هر
            headword_bare: هر
            headword_norm: هر
            root: هرر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              هر
              1 هَرَّ, (S, A, Msb, K,) aor. ـِ (S, Msb, K,) inf. n. هَرِيرٌ, (S, A, &c.,) said of a dog, [He snarled, or howled, or whined;] he uttered a cry less vehement than barking (S, A, Msb, K.) by reason of his little patience of cold; (S, K) إِلَيْهِ at him. (K.) or barked and grinned, displaying his fangs. (L, TA.) It is said in a trad, إِنَّ الكَلْبَ يَهِرُّ مِنْ وَرَآءِ أَهْلِهِ Verily the dog [snarls, or] harks and grins, displaying his fangs, behind his master: meaning, that courage is a quality implanted by nature in a man, so that he engages in wars naturally, and from care to defend what should be inviolable, not reckoning upon a reward, like as the dog naturally barks and grins, displaying his tangs, to defend his masters. (L, TA.) b2:  هَرِيرٌ is also applied to other sounds than the cry of the dog; as in the instance of هَرِيرُ الرّحَى (assumed tropical:)  The sound of the turning of the mill-stone. (TA.) You say also هَرَّتِ القَوْسُ (assumed tropical:)  The bow made a sound. (AHn, K.) And the looking of courageous men, one at another, is likened to هَرِير. (ISd, Msb.) b3:  هَرَّ فِى وَجْهِ السَّائِلِ (tropical:)  He grinned in the face of the beggar, showing his teeth, and looking sternly, austerely, or morosely (A, TA.) b4:  [Hence, perhaps,] هَرَّهُ. (S, K,) ???
              يَهُرُّ and يَهِرَّ, (K,) [the latter irreg., like ?? as aor.  of the trans. v. رَمَّ,] inf. n. هَرٌّ (S, K) and هَرِيرٌ. (K,) (tropical:)  He disliked, disapproved of or hated, him or it. (S, K.) You say, هَرَّهُ النَّاسُ (tropical:)  The people disliked, &c., his vicinity. (A.) And هَرَّ الكَاسَ. and الحَرْبَ, (S, A,) inf. n. هَرِيرٌ. (S.) (tropical:)  He disliked.
              &c., the cup of wine, and war. (S, A.) A2: هَرَّهُ البَرْدَ, (K,) aor. ـُ inf. n. هَرٌّ, (TA,) The cold made him (a dog) [to snarl, or hand, or whine; or] to cry [in the manner described above]; as also ↓ أَهَرَّهُ, (K,) inf. n. إِهْرَارٌ. (TA.) It is said in a proverb, (TA,) ذَا نَابٍ ↓ شَرٌّ أَهرَّ [It is, or was, an evil thing that made the fanged animal to snarl, &c.]: alluding to the appearance of the signs and symptoms of evil: the sayer thereof, hearing the cry (هَرِير) of a dog, feared the assault of evil, and therefore said this to denote the magnitude of the case in his mind: meaning, nought but an evil thing made the fanged animal to cry: and for this reason, the use of an indeterminate word as an inchoative is well. (K.) 3 هَارَّه i. q. هَرَّ فى وَجْهه, (S, K,) i. e., (tropical:)  He grinned in his face, showing his teeth, and looking sternly, austerely, or morosely. (A) like a dog. (TA.) 4 أَهْرَ3َ see 1, last signification, in two places.
              هِرٌّ A male cat; syn. سِنَّوْرٌ; (S, A, K:) which  latter is uncommon in the language of the Arabs (IAmb, in Msb, art. ??;) fem. هِرَّةٌ: (S, A. Msb, K:) or هِرٌّ is applied to the male and the female; and the latter is sometimes called هرَةٌ (IAmb, Msb:) the pl. of هرٌّ is هِررةٌ: and that of هِرَّةٌ is هِرَرٌ: and the dim. of هِرَّةٌ is هُرَيْرَةٌ. ((???)) A2:  Also, a subst. from هَرَّهُ meaning ((?)) disapproved of, or hated, him or it. ((?)) said in a proverb, (S,) يَعْرِفُ هِرًّا مِنْ برٍّ ((?)) K,) meaning He knows ((?)) him who dislikes or hates him from him who ((?)) towards him with goodness and affection and gentleness, and regard for his circumstances. (S, TA.) this is the best explanation of it: (TA:) or the action of him who grins in his face, showing his teeth, and looking steraly, austerely, or morosely, from the action of him who holds loving communion with him. (A:) or the calling of sheep or goats, (S,) or the calling of them to water. (K.) from the driving of them: (S:) or the calling of sheep or goats to provender from the calling of them to water: (IAar) or the driving of sheep or goats (Yoo, K) from the calling of them. (Yoo, TA.) It has been explained [more fully] in art. بر. (K.) هَرَّارٌ: see هَارٌّ.
              هَارٌّ A dog [that snarls, or howls, or whines, by reason of his little patience of cold: or] that barks and grins, displaying his fangs: and ↓ هَرَّارٌ signifies the same [but in an intensive manner; that snarls, &c., much:] or the latter signifies a dog that grins [much], displaying his fangs: or that barks much: or that barks [much] and grins, displaying his fangs. It is said in a trad., لَا أَعْقِلُ الكَلْبَ
              ↓ الهَرَّارَ [properly signifying, I will not pay a fine for killing the dog that barks much, is expl. as] meaning, I will not impose anything [as a fine] for the killing of a dog that barks much; because such a dog annoys by his barking. (TA, [see art. عقل.]) b2:  عَادَ لَهَا المَطِىُّ هَارًّا The ridingcamels returned to her, or it, one grinning (يَهِرُّ) in the face of another, showing its teeth, in consequence of fatigue. (TA.)
