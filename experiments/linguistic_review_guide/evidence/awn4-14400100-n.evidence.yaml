            definitions_text: 'وهر} الوَهَرُ مُحَرَّكةً، أَهملَه الجَوْهَرِيّ، واستدركه الصَّاغانِيّ وابنُ مَنظور، فَقَالَ
              الصَّاغانِيّ: هُوَ شِدَّة الحَرِّ، وَفِي اللِّسَان، أَنَّه تَوَهُّجُ وَقْعِ الشَّمْس على الأَرض حتّى تَرى لَهُ
              اضطِراباً كالبُخار، يَمَانِية. {وتَوَهَّر الليلُ والشِّتاءُ، كتَهَوَّرَ، كَذَلِك الرَّمْلُ إِذا تَهَوَّرَ.}
              ووَهْرانُ، كسُحْبان: اسْم رجُلٍ، وَهُوَ أَبو قَوْمٍ. {ووَهْران: د، بالأَندلس، على ضِفَّة الْبَحْر، بَينه وَبَين
              تِلِمْسان سُرى ليلةٍ. وأَكثرُ أَهلِها تُجّار، مِنْهَا، هَكَذَا فِي النُّسخ، وصوابُه: مِنْهُ أَبو الْقَاسِم عبدُ
              الرّحمن بن عبد الله بن خَالِد الهَمْدانيّ} - الوَهْرانيّ شيخُ الحافظين أَبي عُمَرَ بن عبد البرِّ النَّمَريّ
              وابنِ حَزْمٍ، يَرْوِي عَن أَبي بَكْرٍ أَحمدَ بن جَعْفَر القَطيعيّ. وفاتَهُ: سَعيدُ بنُ خلَفٍ الوَهْرانيّ، عَن
              أَبي بكر الأَبْهَرِيّ الْفَقِيه، وَعنهُ مَنْصُور بن تُمْصُلْت. وعليّ بن عبد الله بن المُبارك الوَهْرانيّ، سمع
              مِنْهُ يوسُفُ بن خَلِيل. والرُّكْنُ {- الوَهْرانيّ صاحبُ الخَلاعة. وَمن المُتأَخِّرين: الإمامُ أَبو العَبّاس
              أَحمدُ بنُ حجيّ الوَهْرانيّ، حدَّث عَن أَبي سَالم إِبْرَاهِيم بن مُحَمَّد بن عليّ التّازيّ نَزيل} وَهْران،،
              وَعنهُ أَبو عُثمان سَعيدُ بنُ أَحمدَ بن محمّد بن يَحيى التِّلِمْسانيّ المقرِي. وَهْرانُ: ع بِفَارِس، نقلَه ياقوت.
              {ووَهَرَه، كوَعَدَه،} يَهِرُه {وَهْراً،} ووَهَّرَهُ {تَوْهِيراً، َذا أَوْقَعَه فِيمَا لَا مَخْرَجَ لَهُ مِنْهُ.
              قَالَ خَليفَة:} تَوَهَّرَ زَيْدٌ فُلاناً فِي الْكَلَام وتَوَعَّرَه، إِذا اضْطَرَّه إِلَى مَا بَقِيَ فِيهِ، هَذَا
              نَص الصَّاغانِيّ، وَفِي اللِّسَان: بقيَ بِهِ مُتَحَيِّراً. قَالَ أَبو تُراب: يُقال: أَنا {مُسْتَوْهِرٌ بِهِ،
              أَي بالأَمْر،} ومَسْتَيْهِرٌ بِهِ، أَي مُسْتَيْقِنٌ بِهِ، نَقله الصَّاغانِيّ. ويوسُفُ بنُ أَيُّوب بن وَهْرَة،
              بِالْفَتْح، محَدِّثٌ.وَمِمَّا يُسْتدرك عَلَيْهِ: لَهَبٌ {وَاهِرٌ: ساطِعٌ.} والمُسْتَوْهِرُ: السَّادِرُ من وَهَجِ
              الشَّمس. {والوَهْرانُ: الخائفُ. وَمِمَّا يُسْتدرك عَلَيْهِ فِي هَذَا الْبَاب:) ('
