                عَن أبي حنيفَة، وَالَّذِي نَقله الأَئمة عَن أَبي حنيفَة:} هيرُونُ بالكسْر وضَمِّ النّون من غير ألف وَلَام،
                فَإِن كَانَ ذَلِك فَهُوَ يحْتَمل أَن يكون فِعْلُوناً وفِعْلُولاً. واليَهْيَرُّ، بالتَّشديد: الحَجَرُ الأَحمرُ
                الصُّلْبُ، أَو اليَهْيَرُّ: حجارةٌ أَمثالُ الأَكُفِّ، أَو حَجَرٌ صغيرٌ، قَالَ أَبو حنيفَة: {واليَهْيَرُّ،
                مُشَدّداً: الصَّمْغَةُ الكَبيرةُ، وأَنشد: قد مَلَؤُوا بُطُونَهُم} يَهْيَرَّا اليَهْيَرُّ: السَّرابُ، وَمِنْه
                المثَلُ: فلانٌ أَكْذَبُ من {اليَهْيَرِّ. قَالَ اللَّيْث: اليَهْيَرُّ: اللَّجاجَةُ والتَّمادي فِي الأَمر، تَقول:
                اسْتَيْهَرَ وأَنشد: وقلبُكَ فِي اللَّهوِ} مُسْتَيْهِرُ اليَهْيَرُّ: الكَذِبُ. اليَهْيَرُّ: دُوَيْبةٌ تكون
                فِي الصحارى، أَعظَمُ من الجُرَذِ، واحدته {يَهْيَرَّةٌ، أَنشد ابْن شُمَيْل:(فَلاةٌ بهَا} اليَهْيَرُّ شُقْراً
                كأَنَّها ... خُصى الخَيْلِ قد شُدَّتْ عَلَيْهَا المَسامِرُ)اليَهْيَرُّ: الحَنْظَلُ، وَهُوَ أَيضاً: السُّمُّ،
                وَقد نُقِلَ فيهمَا التَّخْفِيف. اليَهْيَرُّ: صَمْغُ الطَّلْح، عَن أَبي عَمْرو، وأَنشد:(أَطْعَمْتُ راعِيَّ
                من اليَهْيَرِّ ... فظلَّ يَعْوي حَبَطاً بشرِّ)خَلْفَ اسْتِه مثلَ نَقيقِ! الهِرّ ِ قيل: سُمِّيَ بِهِ على التَّشبيه
                بِالْحِجَارَةِ الحُمْر الصُّلْبة. {اليَهْيَرَّةُ، بهاءٍ، من النُّوقِ، قَالَ ابنُ شُمَيْل: قيل لأبي أَسْلَم:
                مَا الثَّرَّةُ اليَهْيَرَّةُ الأخلافِ فَقَالَ: الثَّرَّة: الساهِرَةُ العِرْقِ، تَسْمَع زَميرَ شُخْبِها وَأَنت
