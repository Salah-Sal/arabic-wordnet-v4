            definitions_text: 'طبقاً للمواصفة القياسية الألمانية DIN 1940 هي نقطة انعكاس حركة الكبّاس عند كل طرف ينتهي عنده
              شوط الكبّاس. وتتم التفرقة بين: 1) النقطة الميتة العليا (ن.م.ع): وهي نقطة انعكاس الكبّاس البعيدة عن [العمود المرفقي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88102)
              (تُسمى أيضاً بالنقطة الميتة الخارجية)، و 2) النقطة الميتة السفلى (ن.م.س): وهي نقطة انعكاس الكبّاس القريبة من
              العمود المرفقي (تسمى أيضاً بالنقطة الميتة الداخلية).'
