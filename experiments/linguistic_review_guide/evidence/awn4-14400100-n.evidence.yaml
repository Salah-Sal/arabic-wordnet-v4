          - entry_id: 832973
            dictionary_id: 120
            headword: هور
            headword_bare: هور
            headword_norm: هور
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'هور{هارَه بالأَمْرِ} هَوْراً: أَزَنَّه واتَّهمَه، {وهُرْتُ الرّجُلَ بِمَا لَيْسَ عِنْده من
              خَيْرٍ، إِذا أَزْنَنْته،} أَهْوره {هَوْراً. قَالَ أَبو سعيد: لَا يُقَال ذَلِك فِي غير الْخَيْر. هارَه بِكَذَا:
              ظنَّه بِهِ، قَالَ أَبو مَالك بن نُوَيرَة يصف فرَسَه:(رَأَى أَنَّني لَا بالكثير} أَهُورُهُ ... وَلَا هوَ عَنِّي
              فِي المُواساة ظاهِرُ)أَهوره أَي أَظُنُّ القليلَ يَكْفِيهِ، يُقَال: هُوَ {يُهارُ بِكَذَا، أَي يُظَنُّ بِكَذَا.
              وَقَالَ آخرُ يصفُ إبِلا:(قد عَلِمَتْ جِلَّتُها وخُورُها ... أَنِّي بشِرْبِ السُّوءِ لَا} أَهُورُها) أَي لَا
              أَظُنُّ أَنَّ القليلَ يكفيها، وَلَكِن لَهَا الْكثير. وَالِاسْم مِنْهُمَا {الهُورَةُ بالضَّمّ. هارَهُ عَن الشَّيءِ:
              صَرَفَه، نَقله الصَّاغانِيّ. هارَه على الشَّيْءِ: حملَه عَلَيْهِ وأَراده بِهِ. منَ المَجاز:} هَارَ القَومَ {يَهُورهم}
              هَوْراً، إِذا قتلَهم وكَبَّ بعضَهم على بعض كَمَا يَنهار الجُرُفُ. قَالَ ساعِدة بن جُؤَيَّة الهذليّ:(فاسْتَدْبَروهُم
              {فَهارُوهُم كأَنَّهُمُ ... أَفْنادُ كَبْكَبَ ذاتِ الشَّثِّ والخَزَمِ)هَكَذَا يُروَى، وَفِي أُخرى: كِيدُوا جَميعاً
              بآناسٍ كأَنَّهم وكَبْكَب يُذَكَّر ويُؤَنَّث.} هارَ الرَّجُلَ {يَهُوره} هَوْراً: غَشَّه، هارَ الشَّيْءَ يَهُورُه
              هَوْراً: حَزَرَه. وَقيل: للفَزاريّ: مَا القِطْعة من اللَّيْل فَقَالَ: حُزْمَةٌ {يَهُورُها، أَي قِطعةٌ يَحْزُرهَا.
              يُقَال: ضَرَبَ فلَانا} فَهَارَه، أَي صَرَعَه، {كهَوَّرَه، وهارَ البِناءَ} هَوْراً: هدمَه، وَكَذَا الجُرُفَ هَوْراً
              {وهُؤُوراً،} فهَارَ، وَهُوَ {هائرٌ} وهَارٍ، على الْقلب، {وتَهَوَّرَ} وتَهَيَّرَ، الأَخيرة على المُعاقَبة، وَقد
              يكون تَفَيْعَل، أَي تَهَدَّم، قيل:: انْصَدَع من خلْفه وَهُوَ ثابتٌ بعدُ فِي مَكَانَهُ، فَإِذا سقطَ فقد {انْهارَ}
              وتَهَوَّرَ، وَفِي حَدِيث ابْن الضَّبْعاءِ: {فتَهَوَّرَ القَليبُ بمَنْ عَلَيْهِ. يُقَال:} هارَ البِناءُ {وتَهَوَّرَ،
              إِذا سقَط، وكُلُّ مَا سقطَ من أَعلى جُرُفٍ أَو شَفيرِ رَكِّيَّةٍ فِي أَسفلها فقد} تهَوَّرَ وتَدَهْوَرَ. {وهَوَّرْتُه
              فتَهَوَّرَ} وانْهارَ، أَي انْهدم. وَقَالَ ابْن الأَعْرابِيّ: {الهَائِر السَّاقط، والرَّاهي: المُستقيمُ.} وتَهَوَّر
              الرَّجلُ، إِذا وقعَ فِي الأَمر بقِلَّةِ مُبالاةٍ. وَفِي الأَساس: بِغَيْر فِكْرٍ، وَهُوَ مَجاز.! تَهَوَّرَ الوَعَكُ
              الناسَ، إِذا أَخذَهم وعَمَّهم. منَ المَجاز: {تَهَوَّرَ اللَّيْلُ، إِذا ذهبَ وأَدْبَرَ. تَهَوَّرَ اللَّيْل، إِذا
              وَلَّى أَكْثَرُه، وَيُقَال فِي هَذَا الْمَعْنى بعينِه: تَوَهَّرَ الليلُ، وَقد تقدّم، وَفِي بعض النُّسخ: واللَّيْل:
              ولَّى أَوْ ذَهَبَ أَكْثَرُه. ورَجلٌ} هارٌ {وهارٍ،)الأَخيرة على القَلْب،} وهَيَّارٌ، ككَتَّان، هَكَذَا فِي سَائِر
              النُّسخ، وَالَّذِي فِي أُمَّهات اللُّغَة كلّها: {هَائرٌ، وَفِي بَعْضهَا: هَيَارٌ، كسَحاب، وسيأْتي لَهُ فِي هير
              ضَعيفٌ، وَقَالَ الأَزْهَرِيّ: رَجلٌ} هارٌ، إِذا كَانَ ضَعِيفا فِي أَمره، وأَنشد: مَاضي العَزِيمَةِ لَا هَارٌ
              وَلَا خَزِلُ وَقَالَ ابْن الأَثير: يُقَال هُوَ هَارٌ {وهَارٍ} وهَائرٌ، فَأَما {هائرٌ فَهُوَ الأَصل من هَارَ}
              يَهُور، وأَمّا هَارٌ، بالرَّفع، فعلى حذف الْهمزَة، وأَمّا هارٍ، بالجَرِّ، فعلى نقل الْهمزَة إِلَى بعد الرَّاءِ،
              كَمَا قَالُوا فِي شائك السِّلاح شاكِي السِّلاح، ثمَّ عُمِلَ بِهِ مَا عُمِلَ بالمَنْقوص، نَحْو قاضٍ وداعٍ. قَالَ
              ابْن دُرَيْد: {الهَوْرُ، بِالْفَتْح: البُحَيْرَةُ تَغِيضُ بهَا، وَفِي بعض الأُصول فِيهَا، مِياهُ غِياضٍ وآجامٍ
              فَتَتَّسِع وَيكثر ماؤُها. ج} أَهْوارٌ. الهَوْرُ: القطيع من الغَنَم، نَقله الصَّاغانِيّ، سُمِّيَ بِهِ لأَنَّه
              من كثرته يتَساقَطُ بعضُه على بعض. {الهَوْرَةُ، بهاءٍ المَهْلَكَةُ، وجَمْعُها الهَوْراتُ وَبِه فُسِّرَ الحَدِيث
              الْآتِي ذكرُه. عَن أَبي عَمْرو:} الهَوَرْوَرَةُ: المَرأَة الهالِكَةُ. يُقَال: {اهْتَوَرَ، إِذا هلَكَ. قَالَ
              الأَصْمَعِيّ:} التَّيْهُور: مَا انْهارَ من الرَّمْل، وَقيل: مَا اطْمَأَنَّ من الأَرْضِ، هَكَذَا فِي سَائِر النُّسخ،
              وَقد ضَرَب عَلَيْهِ الصَّاغانِيّ بقلَمِه، وذَكرَ الرَّمْلَ عِوضاً عَنهُ، وَفِي اللِّسَان ذكر الأَرض. التَّيْهُورُ
              الشَّديدةُ من السَّباسبِ، يُقَال: تِيهٌ تَبْهُورٌ، أَي شَديدٌ، ياؤُه على هَذَا مُعاقِبَةٌ بعد القلْب، وَفِي
              حَوَاشِي ابْن برّيّ. مَا نصّه: أَسْقَطَ الجَوْهَرِيّ ذِكْرَ تَيْهُورِ الرَّمْلِ الَّذِي ينهار، لأَنَّه يحْتَاج
              فِيهِ إِلَى فضلِ صنعةٍ من جِهَة العربيَّة. وَشَاهد {تَيْهور الرَّملِ المُنْهارِ قَول العجّاج: إِلَى أَراطِ ونَقاً
              تَيْهُورِ وزْنه تَفْعُول، والأَصل فِيهِ تَهْيُور، فقدِّمت الياءُ الَّتِي هِيَ عين إِلَى مَوضع الفاءِ، فَصَارَ}
              تَيْهُوراً، فَهَذَا إِن جعلتَه من تَهَيَّرَ الجُرف، وَإِن جعلتَه من تَهَوَّرَ كَانَ وَزنه فَيْعُولاً لَا تَفْعُولاً،
              وَيكون مقلوبَ العينِ أَيضاً إِلَى موضِع الفاءِ، والتَّقدير فِيهِ بعدَ الْقلب: {وَيْهُور، ثمَّ قُلِبت الْوَاو
              تَاء كَمَا قُلبَت فِي تَيْقُور، وأَصله وَيْقُور، من الوَقار.} والهَارُ: الضَّعيفُ السَّاقطُ من شِدَّة الزَّمان،
              وَبِه فُسِّرَ حَدِيث خُزَيْمَة: تَرَكَتِ المُخَّ رَاراً والمَطِيَّ {هاراً، ويروى بالتَّشديد.} الهَوَارَةُ: كسحابة:
              الهَلَكَةُ، وَمِنْه الحَدِيث الَّذِي لَا طَرِيق لَهُ، كَمَا قَالَه الصَّاغانِيّ: مَنْ أَطاعَ اللهَ ونصّ الحَدِيث
              رَبَّه فَلَا {هَوَارَةَ علَيْه أَي لَا هُلْكَ. قلْت: وَقد رُويَ عَن أَنَسٍ رَضِي الله عَنهُ أَنَّه خطبَ فَقَالَ:
              مَنْ يَتَّقِي اللهَ لَا هَوارَةَ عَلَيْهِ فَلم يَدْروا مَا قَالَ، فَقَالَ يحْيى بن يَعْمُر: أَي لَا ضيعةَ عَلَيْهِ.
              وَفِي الحَدِيث أَيضاً: مَن اتَّقى اللهَ وُقِيَ} الهَوْراتِ أَي الهَلَكات، وَقَالَ الصَّاغانِيّ: أَي المَهالِك،
              واحدتُها هَوْرَة، وَقد تقدّم قَرِيبا، وَهَذَا من المصنّف غَرِيب جدّاً، فإنَّه ذكر الْمُفْرد أَوّلاً ثمَّ ذكرَ
              بعدَه الحديثَ الَّذِي جاءَ فِيهِ ذِكْرُ جَمْعِه، ففرَّقَهما فِي محَلَّيْن. منَ المَجاز: رجلٌ {هَيِّرٌ، ككَيِّسٌ
              إِذا كَانَ} يتَهَوَّر فِي الأَشياءِ، وَنَصّ التكملة: يتَهَيَّر فِي الأَشياءِ. {ومَهْوَرٌ كمَقْعَدٍ: ع بالحجاز،
              نَقله الصَّاغانِيّ، وَقَالَ ياقوت: ويُرْوَى مَهْوىً. وَمِمَّا يُستدرك عَلَيْهِ: يُقَال: خَرْقٌ} هَوْرٌ، أَي
              واسعٌ بعيدٌ. قَالَ ذُو الرُّمَّة:)(هَيْماءُ يَهْماءُ وخَرْقٌ أَهْيَمُ ... هَوْرٌ عَلَيْهِ هَبَواتٌ جُثَّمُ)للرِّيحِ
              وَشْيٌ فوقَه مُنَمْنَمُ وَيُقَال: {هَوَّرْنا عنَّا القَيْظَ وجَرَمْناهُ وجَرَّمْناه وكَبَبْناه، بِمَعْنى.} وهَوَّارة،
              مشدّداً، ابْن قيْسِ بن زُرْعَة بن زُهَيْر بن أَيْمن بن هَميسع بن حمْيَر الأَكبر: قبيلةٌ كبيرةٌ بالمغرب، وَفِيه
              اختلافٌ كَبِير، وَقد أَلَّفت فِي ذَلِك رِسَالَة سمَّيْتها رَفْع السِّتارَة عَن نسب {الهَوَّارة، وَيُقَال: إنَّ
              المُثَنَّى بن المِسْوَرِ بن المُثَنَّى بن خلاع بن أَيمَن بن رُعَيْن بن سعد بن حِمْيَر الأَصغر خرج من مصر فِي
              طلب إبلٍ لَهُ فقَدَها فَذهب فِي أَثرِها إِلَى المَغْرِب، فَلَمَّا دخل إفريقية قَالَ لغلامه: أَيْنَ نحْنُ قَالَ:}
              تَهَوَّرْنا. فنزَلَ على قَوْمٍ من زَنَاتَة فتَزَوَّجَ أُمَّ صِنهاج، فكثُرَ مِنْهَا نسلُه، فهم {الهَوَّارِيُّون.
              وَهَذَا نَقله المَقريزيّ فِي: الْبَيَان وَالْإِعْرَاب عمَّن فِي مصر من قبائل الأَعراب. ثمَّ ذكر مِنْهُم قبائل
              كَثِيرَة بالمغرب. قلْت: وَمِنْهُم أَبُو مُوسَى عبد الرَّحْمَن بن مُوسَى} - الهَوَّاري، لقِيَ مَالِكًا، وصنَّف
              فِي القراآت والتَّفسير، ذكره الرُّشاطِيّ وَآخَرُونَ. قَالَ المَقريزيّ، وأَمّا! هوّارةُ الصَّعيدِ فَإِنَّهُ أَنزلهم
              الظاهرُ برقوق بعد وَاقعَة بدر بن سَلام، هُنَا، فِي سنة فأَقطَع لإسماعيل بن مازِن مِنْهُم ناحيةَ دجِرْجا، وَكَانَت
              خراباً فعَمَرَها وَهُوَ جَدُّ المَوازِنِ، وأَقام بهَا حتّى قَتله عليّ بن عريب مِنْهُم، وَهُوَ جَدُّ العرابيّ،
              فوُلِيَ بعده الأَمير عمر بن عبد الْعَزِيز الهَوَّاري. قلْتُ: وَبَنُو عُمَرَ بطنٌ كَبِير بالصَّعيد، وَهُوَ جَدُّ
              الأُمراءِ كلهم إلاّ من شَذَّ، وَمن وَلَده محمّد أَبُو السّنون، ويوسف بن عمر بن عبد الْعَزِيز، فأَمّا محمّد فوَلِيَ
              بعد أَبيه وفَخُمَ أَمرُه وعَمَرَ الصَّعيدَ، ووَلِيَ يُوسُف بعد أَخيه، وولَدُه إسماعيلُ بن يُوسُف كَانَ محمودَ
              السِّيرة، توفِّي بِمصْر سنة وحفيده الأَمير شرف الدِّين عِيسَى بن يُوسُف بن إِسْمَاعِيل، كَانَ من أَجِلاّءِ بني
              عُمَر، يُذاكِرُ الفُقَهاءَ مَعَ كَثْرَة البِرِّ وَالْإِحْسَان لَهُم، وكانَ مليح الشَّكل كثير التَّهجُّدِ توفِّي
              سنة، كَذَا فِي مُعْجم الشَّيْخ عبد الباسط. وَمن وَلَده الأَمير ريَّان بن أَحمد بن عِيسَى، جَدّ الرَّيايِنَة،
              توفِّيَ سنة، وداوُد بن سُلَيْمَان بن عِيسَى وُلِدَ بعدَ التسعين والثَّمانمائة، وَعبد الْعَزِيز وعليّ ابْنا عِيسَى
              بن يُونُس، وَغير هَؤُلَاءِ، وَمن أَراد الزِّيادةَ فَعَلَيهِ برسالتنا الْمَذْكُورَة، فإنَّنا قد اسْتَوْفَيْنَا
              فِيهَا أَنسابَهم وأَخبارَهم. وَلَيْسَ هَذَا محلّ التَّطويل، وَلَكِن نَفْثَة مَصْدور. {وهُور، بالضَّمّ: قريةٌ
              بِمصْر من أَعمال الأَشمُونين.} وهُورينُ: قَرْيَتَانِ بِمصْر، إِحْدَاهمَا من أَعمال قُوَيْسنا، وتُعرَف بنَطابةَ،
              وَالثَّانيَِة بالغربية وتعرَف {بهُورِين بهرْمَن، وَقد نسب إِلَى هَذِه الأَخيرةِ جماعةٌ من المحدِّثين.} والهوَّارين:
              قريةٌ، نَقله الحسَن بن رَشِيق القَيروانِيّ.'
