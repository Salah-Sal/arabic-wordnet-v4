            definitions_text: 'هرن: (الهَيْرُونُ) :) أَهْمَلَهُ الجوْهرِيُّ.وقالَ الأزْهرِيُّ: أَمَّا هَرَنَ فإنِّي لَا أَحْفَظُ
              فِيهِ شَيْئا.وقالَ القُتَيْبيُّ: الهَيْرُونُ، (كزَيْتُونٍ: ضَرْبٌ من التَّمْرِ) جَيِّدٌ.(وهَارونُ: اسمُ) النبيِّ
              صلى الله عَلَيْهِ وسلموهو ابنُ عِمْران بنِ قاهث أَخِي موسَى، عَلَيْهِمَا السّلامُ.قالَ الأزْهرِيُّ: هارونُ مُعَرَّبٌ
              لَا اشْتِقاق لَهُ فِي العَربيَّةِ؛ وكانَ من ولدِهِ يَحْيَى وإلياس وإلْيسع والعَزيرِ، عَلَيْهِم السّلامُ.(وهارانُ
              بنُ تارَحَ) بنِ ناحُورَ بنِ سارُوغَ، (أَخُو إبراهيمَ وأَبو لوطٍ، عليهمُ) وعَلى نبيِّنا (السّلامُ) ، آمَنَ لُوطُ
              بإبراهيمَ وهاجَرَ مَعَه إِلَى الشَّامِ فنَزَل إبرهيمُ فِلَسْطِين ونَزَلَ لُوطُ بالأرْدُنّ، وأَرْسَلَ إِلَى أَهْلِ
              سَدُوم.(والهَرْنَوَى) ، مَقْصوراً، (أَو الهَرْنُوَةُ) ، بضمِّ النونِ؛ وقالَ ابنُ سِيدَه: ولسْتُ أَدْرِي الهَرْنَوَى
              مَقْصور (أَو) هُوَ (الهَرْنَوِيُّ) على لَفْظِ النَّسَبِ، (نَبْتٌ) .(قالَ: وَلم أَرَ هَذِه الكَلِمَةَ وَلَا أَعْرِفُها
              فِي النَّباتِ، وأَنْكَرَها جماعَةٌ مِن أَهْلِ اللّغَةِ.(أَو هُوَ القَرْنُوَةُ، أَو) هُوَ (الفُلَيْفِلَةُ، جَيِّدٌ
              لوَجَعِ الحَلْقِ ويُلَيِّنُ البَطْنَ) .(وممَّا يُسْتدركُ عَلَيْهِ:كسَحابٍ: مِن حُصُونِ ذمارَ باليَمَنِ.والهارُونيُّ:
              قَصْرٌ قُرْبَ سامُرَّا يُنْسَبُ إِلَى هَارُون الوَاثِق، وَهُوَ على دجْلَة بَيْنه وبينَ سامرَّا مِيلٌ وبإزائِهِ
              مِن الجانِبِ الغَرْبي المَعْشوقُ.والهَارُونيَّةُ: مدِينَةٌ صَغيرَةٌ قُرْبَ مَرْعش فِي طَرَفِ جَبَلِ اللّكَامِ،
              اسْتَحْدَثَها هارونُ الرَّشيد.وأَيْضاً: قَرْيةٌ مِن قُرَى بَغْدادَ قُرْبَ شهرابان فِي طَريقِ خُرَاسانَ، بهَا
              القَنْطرَةُ العَجِيبَةُ البِناءِ.وأَبو إسْحاق إبراهيمُ بنُ أَحمدَ بنِ محمدِ بنِ أَحمدَ بنِ بسَّامٍ الهَارُونيُّ
              إِلَى جَدِّه هَارون الرَّشيد، عَن بكْرِ بنِ سَهْلٍ.وأَبو نَصْر عبدُ اللَّهِ بنُ الحُسَيْنِ بنِ هَارُون بنِ عزْرَةَ
              الهَارُونيُّ الوَرَّاقُ إِلَى جَدِّه المَذْكُور، رَوَى عَنهُ أَبو سعِيدٍ الخَلِيليُّ الحافِظُ.وهارونُ بنُ الحُسَيْنِ
              بنِ محمدِ بنِ هَارُون بنِ محمدٍ البطحانيّ الحسنيُّ المُلَقَّبُ بالأقْطَعِ، بالرَّيِّ، ومِن ولدِهِ أَحْمدُ المُؤَيِّد
              باللَّهِ ويَحْيَى الناطِقُ بالحَقِّ بنُ الحُسَيْن بنِ هارونِ ويُعْرفانِ بابْنَيْ الهَارُونيّ، وهُما مِن أَئِمَّةِ
              الزَّيْدِيَّةِ.'
