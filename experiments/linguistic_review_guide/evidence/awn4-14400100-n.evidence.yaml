          - entry_id: 832673
            dictionary_id: 120
            headword: هرت
            headword_bare: هرت
            headword_norm: هرت
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'هرت: (الهَرْتُ: الطَّعْنُ) فِي العِرْضِ.هَرَتَ عِرْضَهُ وهَرَدَهُ وهَرَطَهُ، كُلّها لُغَاتٌ.(و)
              الهَرْتُ (: الطَّبْخُ البَالِغُ) يُقَال: هَرَتَ اللَّحْمَ: أَنْضَجَهُ وطَبَخَهُ حَتَّى تَهَرَّأَ، وَفِي الحَديثِ
              (أَنّه أَكَلَ كَتِفاً مُهَرَّتَةً ومَسَحَ يَدَه فَصَلَّى) لَحْمٌ مُهَرَّتٌ ومُهَرَّدٌ إِذا نَضِجَ، أَراد: قَد
              تَقَطَّعَتْ من نُضْجِهَا، وَقيل: إِنّهَا مُهَرَّدَةٌ، بالدَّال.(و) الهَرْتُ (: التَّمْزِيقُ) فِي الثّيابِ قَالَ
              ابْن سَيّده: هَرَتَ عِرْضَهُ وثَوْبَهِ (يَهْرِتُ ويَهْرُتُ) هَرْتاً: مَزَّقَه وطَعَنَ فِيهِ، فَهُوَ هَرِيتٌ.وَقَالَ
              الأَزْهَرِيّ: هَرَتَ ثَوْبَهُ هَرْتاً إِذا شَقَّهُ.(و) الهَرَتُ محرَّكَة: سَعَةُ الشِّدْقِ.(الهَرِيتُ: الواسعُ)
              الشِّدْقَيْنِ.(وَقد هَرِتَ كَفَرِحَ) ، وَهُوَ أَهْرَتُ الشِّدْقِ، وهَرِيتُهُ.قَالَ الأَزْهَرِيّ: ويُقَالُ للخَطِيبِ
              من الرِّجَالِ: أَهْرَتْ الشِّقْشِقَةِ، وَمِنْه قولُ ابْن مُقْبِل:عادَ الأَذِلَّةُ فِي دَارٍ وكانَ بِهَاهُرْتُ
              الشَّقاشِقِ ظَلاّمُونَ للجُزُرِوَفِي حديثِ رَجَاءِ بنِ حَيْوَةَ: (لَا تُحَدِّثْنا عَن مُتَهَارِتٍ) أَي مُتَشَدِّقٍ
              مُكاثِر، مِن هَرَتِ الشِّدْقِ وَهُوَ سَعَتُهُ.ورَجُلٌ أَهْرَتُ، وفَرَسٌ هَرِيتٌ وأَهْرَتُ: مُتَّسِعُ مَشَقِّ
              الفَمِ، وجَمَلٌ هَرِيتٌ، كَذَلِك، وحَيَّةٌ هَرِيتُ الشِّدْقِ، ومَهْرُوتَتُه، أَنشدَ يَعْقُوب فِي صِفَةِ حَيَّة:مَهْرُوتَةُ
              الشِّدْقَيْنِ حَوْلاءُ النَّظَرْ(و) امْرَأَةٌ هَرِيتٌ، وَهِي (المُفْضَاةُ) .(و) الهَرِيتُ (: الأَسَدُ) ، والهَرَتُ:
              مصدَرُ الأَهْرَتِ الشِّدْقِ، وأَسَدٌ أَهْرَتُ بَيِّنُ الهَرَتِ، (كالهَرِتِ) ككَتِفٍ، (والهَرُوتِ) كصَبُورٍ (والهَرَّاتِ)
              ككَتّانٍ، والمُهَرَّتِ، كمُعَظَّم، زَاده فِي اللسانِ، قَالَ الأَزْهَرِيّ: أَسَدٌ هَرِيتُ الشِّدْقِ، أَي مَهْرُوتٌ
              ومُنْهَرِتٌ، وَهُوَ مَهْرُوتُ الفَمِ، وكلابٌ مُهَرَّتَةُ الأَشْداقِ.والهَرْتُ: شَقُّكَ الشيْءَ لتُوَسِّعَه.
              وَهُوَ أَيضاً: جَذْبُكَ الشِّدْقَ نحوَ الأُذُنِ، وَفِي التّهذيب: الهَرْتُ: هَرْتُكَ الشِّدْقَ نحوَ الأُذُنِ.(ورَجُلٌ)
              هَرِيتٌ: (: لَا يَكْتُمُ سِرًّا، وَيَتَكَلَّم) مَعَ ذَلِك (بالقَبِيح) .وَمِمَّا بَقِي عَلَيْهِ:هَارُوتُ: وَهُوَ
              اسْم مَلَكٍ أَو مَلِكٍ، والأَعْرَف الأَوّل، قَالَ شيخُنا: والمشهورُ أَنه اسْم أَعجميّ، وَهُوَ الأَصْوبُ، زَاد
              الصّاغانيّ: ودليلُ عُجْمَتِه مَنْعُ الصَّرف، وَلَو كَانَ من الهَرْتِ كَمَا زَعَمَ بعضُ النَّاس لانْصَرَفَ.'
