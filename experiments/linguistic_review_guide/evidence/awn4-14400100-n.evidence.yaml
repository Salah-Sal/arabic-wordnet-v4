          - entry_id: 818015
            dictionary_id: 118
            headword: النقطة
            headword_bare: النقطة
            headword_norm: النقطة
            root: نقط
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'النقطة: شَيْء ذُو وضع لَا يقبل الْقِسْمَة لَا عقلا وَلَا وهما وَلَا قطعا وَلَا كسرا فَإِن كَانَ
              جوهرا فالنقطة الجوهرية والجزء الَّذِي لَا يتجزئ والجوهر الْفَرد وَإِن كَانَ عرضا فالنطقة الغرضية والجزء الَّذِي
              لَا يتجزئ بَاطِل عِنْد الْحُكَمَاء فالجسم عِنْدهم مركب من الهيولى وَالصُّورَة لَا من الْأَجْزَاء الَّتِي لَا
              تتجزئ. ووجوه بُطْلَانه مَذْكُورَة فِي كتب الْحِكْمَة - وَذَلِكَ الْجُزْء ثَابت مَوْجُود عِنْد الْمُتَكَلِّمين
              والجسم مركب من تِلْكَ الْأَجْزَاء عِنْدهم.وَدَلَائِل إثْبَاته مسطورة فِي كتبهمْ. قيل إِن دَلَائِل إبِْطَال الْجُزْء
              الَّذِي لَا يتجزئ تجْرِي فِي النقطة العرضية بل فِي الْخط العرضي والسطح العرضي مَعَ إِنَّهَا ثَابِتَة مَوْجُودَة
              عِنْد الْحُكَمَاء أَقُول إِبْطَاله مَبْنِيّ على امْتنَاع التَّدَاخُل - والتداخل مُمْتَنع فِي الْجَوَاهِر دون
              الْأَعْرَاض - فَإِن قلت لَا بُد وَأَن تكون النقطة العرضية وأخويها مَعْدُومَة لِأَنَّهَا لَو كَانَت مَوْجُودَة
              لكَانَتْ محاطة بالجهات السِّت لِأَن كل مَوْجُود محاط بهَا وكل مَا كَانَ كَذَا يكون منقسما فِي جَمِيع الْجِهَات.
              قلت إِنَّهَا مَوْجُودَة فِي ضمن الْجِسْم التعليمي لَا بِنَفسِهَا. وَمَا قَالُوا إِن النقطة طرف الْخط قَضِيَّة
              مُهْملَة فِي قُوَّة الْجُزْئِيَّة لَا كُلية فَإِن نِهَايَة أحد سطح المخروط المستدير أَعنِي السَّطْح الْمُبْتَدِئ
              من الْقَاعِدَة المنتهي إِلَى النقطة فِي جَانب الرَّأْس فِي كلا امتداديه أَعنِي الطول وَالْعرض نقطة بِلَا خطّ
              بِالْفِعْلِ وَكَذَا مَرْكَز الكرة والدائرة نقطة بِلَا خطّ.وَاعْلَم أَنه لَا نقطة بِالْفِعْلِ فِي سطح الكرة الْحَقِيقِيَّة
              وَيجوز أَن تحصل فِي سطحها نقطة بعد تماسها بالسطح الْحَقِيقِيّ كَمَا تحصل بعد حركتها على نَفسهَا من غير أَن تخرج
              من مَكَانهَا نقطتان غير متحركتين هما قطبا الكرة. فَافْهَم واحفظ فَإِنَّهُ ينفعك فِي دَلَائِل إِثْبَات النقطة
              الجوهرية. وَهَاهُنَا تحقيقات. وَعَلَيْك أَن تنظر فِي كتب الْمُتَقَدِّمين الْمُحَقِّقين حَتَّى يكون سَمعك مقروعة
              وأصول شبهاتك مقلوعة.'
