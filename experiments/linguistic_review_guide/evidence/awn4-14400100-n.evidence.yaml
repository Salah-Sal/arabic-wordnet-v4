          - entry_id: 782666
            dictionary_id: 105
            headword: هَوَرَ
            headword_bare: هور
            headword_norm: هور
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '(هَوَرَ)(هـ) فِيهِ «مَنْ أطاعَ رَبَّه فَلا هَوَارَةَ عَلَيْه» أَيْ لَا هَلاكَ. يُقَالُ: اهْتَوَرَ
              الرجُلُ، إِذَا هَلَك.(هـ) وَمِنْهُ الْحَدِيثُ «مَنِ اتَّقَى اللَّهَ وُقيَ الْهَوْرَاتِ» يَعْني المَهالِكَ، واحِدَتُها:
              هَوْرَةٌ.(س) وَفِي حَدِيثِ أَنَسٍ «أَنَّهُ خَطَبَ بالبَصْرة فقال: مَنْ يَتَّقِي اللَّهَ لَا هَوَارَةَ عَلَيْهِ.
              فلَم يَدْرُوا مَا قَالَ، فَقَالَ يَحْيى بْنُ يَعْمَر: أَيْ لَا ضَيْعَةَ عَلَيْهِ» .(هـ) وَفِيهِ «حَتَّى تَهَوَّرَ
              اللَّيلُ» أَيْ ذَهَب أكْثَرُه، كَمَا يَتَهَوَّرُ البِنَاءُ إِذَا تَهَدَّم.وَمِنْهُ حَدِيثُ ابْنِ الصَّبْغاء
              «فَتَهَوَّرَ القليبُ بِمَنْ عَلَيْه» يُقَالُ: هَارَ البِنَاءُ يَهُورُ، وتَهَوَّرَ، إِذَا سقَطَ.(هـ) وَمِنْهُ
              حَدِيثُ خُزَيمة «تَرَكَتِ الْمُخَّ رَارًا وَالْمَطِيَّ هَارًا» الْهَارُ: السَّاقِطُ الضَّعِيف.يُقَالُ: هُو هَارٍ،
              وهَارٌ، وهَائِرٌ، فأمَّا هَائر فَهُوَ الأصْلُ، مِنْ هَارَ يَهُورُ. وأمَّا هَارٌ بِالرَّفْعِ فَعلى حَذْفِ الهَمْزَة.
              وأمَّا هَارٍ بالجَرِّ، فَعَلى نَقْل الهَمْزة إِلَى [مَا ] بَعْدَ الرَّاء، كَمَا قَالُوا فِي شَائِكُ السِّلاح:شَاكِي
              السِّلاح، ثُمَّ عُمِل بِهِ مَا عُمِلَ بالمَنْقُوصِ، نَحْوُ قاضٍ ودَاعٍ. ويُرْوَى «هَارّاً» بِالتَّشْدِيدِ، وَقَدْ
              تَقَدَّمَ .'
