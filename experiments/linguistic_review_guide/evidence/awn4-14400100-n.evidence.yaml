    - entry_id: 375323
      dictionary_id: 52
      headword: الوضع المائل للقرص المتراوح
      headword_bare: الوضع المائل للقرص المتراوح
      headword_norm: الوضع المائل للقرص المتراوح
      root: وضع
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: يُقصد به زاوية ميل القرص المتراوح بالنسبة للمحور الطولي لعمود الإدارة الخاص به، ويقوم [ضغّاط القرص
        المُتراوح (مكيف الهواء) ذاتي التحكم](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91027) بتحديدها
        من واقع الظروف الضغطية المؤثرة على الجانب العلوي للكبّاس، وجانبه السُفلي. ويُحدد [ضغط الغرفة (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90919)
        الظروف الضغطية المؤثرة على أسفل الكبّاس، أمّا الظروف الضغطية المؤثرة على أعلى الكباس فيتم تحديدها من واقع الضغط المسلط
        على جانب الضغط العالي. وتؤثر كمية وسيط التبريد، التي يسمح [صمام التمدّد (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90947)
        بتدفقها إلى المبخر، على الظروف الضغطية الخاصة [بجانب الضغط العالي (مكيف الهواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90964))،
        و[جانب الضغط المنخفض (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=94618)، وبالتالي
        فإنها تؤثر أيضاً على الوضع المائل للقرص المُتراوح..
      translation_en: tilt angle of the wobble plate
      translation_fr: position inclinée du plateau oscillant [f.]
