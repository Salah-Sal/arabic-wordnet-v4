                أَي فِي الْبَاطِل. اليَهْيَرَّى: نباتٌ أَو شجرٌ، الأخيرُ عَن ابْن هَانِئ، زِنتُه يَفْعَلَّى أَو فَعْيَلَّى
                أَو فَعْلَلَّى. قَالَ سِيبَوَيْهٍ فِي الْكتاب: أما يَهْيَرّ مشدَّدةً فالزيادةُ فِيهِ أَوْلَى، لأنّه لَيْسَ
                فِي الكلامِ فَعْيَلٌّ، وَقد ثُقِّلَ آخِرُ مَا أوّله زيادةٌ كمكورّ، دون الثلاثيّ الَّذِي أوسطُه زِيَادَة كَفَوْعل
                وفَعْيَل، وَلَو كَانَت يَهْيَرّ مخفَّفةَ الياءِ كَانَت الأُولى هِيَ الزائدةَ)أَيْضا، لأنّ الياءَ إِذا كَانَت
                أوّلاً بِمَنْزِلَة الْهمزَة. وَقَالَ الصَّاغانِيّ: وَاخْتلفُوا فِي تَقْدِيره، قيل: إنّه يَفْعَلٌّ وَقد حَكَاهُ
                الجَوْهَرِيّ، وَقيل: إنّه فَعْيَلٌّ والياءُ الثانيةُ زائدةٌ. وَقيل: إنّه فَعْلَلٌّ.} وهِيرٌ، بِالْكَسْرِ:
                ع، بالبادية، عَن اللَّيْث. {والهَيَار، كَسَحَابٍ: الَّذِي يَنْهَارُ كَمَا يَنْهَارُ الرّملُ ويَسقُط. قَالَ
                كُثَيّر:(فَمَا وجَدوا مِنكَ الضَّريبَةَ هَدَّةً ... } هَيَاراً وَلَا سَقْطَ الأَلِيَّةِ أَخْرَما)ومِمّا يُسْتَدْرَك
                عَلَيْهِ: {تَهَيَّرَ الجُرْفُ والبِناءُ: انْهَدَم.} وهَيَّرْتُ الجُرفَ! فَتَهَيَّرَ، لُغَة فِي هَوَّرْتُه
                فَتَهَوَّر. {والهائِر: السَّاقِط، وَقد تقدّم أَيْضا فِي الْوَاو. وَيُقَال:} اسْتَيْهِرْ بإبلِك واقْتَيِلْ
