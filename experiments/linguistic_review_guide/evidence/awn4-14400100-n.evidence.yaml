                الواوُ تَاء، وأَصلُه وَيْهُورٌ، مثلُ التَّيْقُورِ، وأَصلُه وَيْقُورٌ. قَالَ العَجّاج:إِلى أَراطَى ونَقاً تَيْهُورِقَالَ:
