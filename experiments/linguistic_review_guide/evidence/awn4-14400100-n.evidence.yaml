              text: 'هير{الهَيْرَةُ: الأَرْضُ السَّهْلَةُ المطمئنة.} والهِيرُ من اللَّيْل، بالكسْر وَالْفَتْح وكسَيِّد: الهِتْرُ،
                هَكَذَا فِي سَائِر النُّسخ. ومُقتضاه أَن يكون فِي {هير الليلِ لغاتٌ ثَلَاثَة، وَلَيْسَ كَذَلِك، فالمنقول عَن
                ابْن الأَعرابيّ وَغَيره يُقَال: مضى هيرٌ من اللَّيْل، بالكسْر فَقَط أَي أَقلّ من نصفه، قَالَ: وحُكِيَ فِيهِ
                هِتْرٌ، وَقد ذُكِر فِي مَوْضِعه. أَمّا اللُّغَات الْمَذْكُورَة فإنَّها جاءتْ فِي معنى رِيح الشَّمال فَقَالُوا:}
                هِيرٌ {وهَيْرٌ} وهَيِّرٌ، وَكَذَلِكَ إيْرٌ وأَيْرٌ وأَيِّرٌ، فَفِي كَلَام المصنّف نظَرٌ، وَلَو قَالَ: وبالفتح
