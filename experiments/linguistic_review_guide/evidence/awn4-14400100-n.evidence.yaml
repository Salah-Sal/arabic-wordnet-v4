          - entry_id: 849432
            dictionary_id: 128
            headword: هرّ
            headword_bare: هر
            headword_norm: هر
            root: هرر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              هرّ:
              هرّ: اسم المصدر هرّ. هرّ على: ماء بوجه القط وهدده (فوك). هرّ واسم المصدر هرير: يقال في الحديث عن دردبة الطبل (قرطاس 11:218): فلما سمع الروم هدير طبوله؛ وهذه الكلمة كثيراً ما تتحرف في مخالف الطبعات، فعلى سبيل المثال ما ورد عند (عبد الواحد 18:165): وهُزّت بالزاي أكثر من مائتي طبل. وفي المخطوطة عدد1 وهّرت حيث وردت في مخطوطة (ابن جبير 6:181 بالحركات الآتية) والطبول تهزّ بالزاي وراءه (في مخطوطة رقم عدد 1): تهزّ (إن هدر واسم المصدر هدير يستعمل للمعنى نفسه).
              هَرّ: في (محيط المحيط): (والعامة تقول هرّ الثمر والورق أي تناثر وتساقط).
              هِرّ: تستعمل للأنثى من القطط أيضاً (أماري 7:217 ومما بعده وفي عدد 4)، وفي (محيط المحيط): (والهر السنوّر والجمع هررة والأنثى هرّة جمع هرر وقيل الهرّ يقع على الذكر والأنثى ويدخلون الهاء على المؤنث).
