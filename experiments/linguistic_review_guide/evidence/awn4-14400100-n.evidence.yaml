          - entry_id: 812371
            dictionary_id: 116
            headword: هور
            headword_bare: هور
            headword_norm: هور
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '[هور] نه: من أطاع ربه فلا "هوارة" عليه، أي لا هلاك، من اهتور - إذا هلك. ومنه ح: من اتقى الله
              وقى "الهورات"، أي المهالكن جمع هورة. وفي خطبة أنس: من يتقي الله لا "هوارة" عليه، قال يحيى: لا ضيعة عليه. وفيه:
              حتى "تهور" الليل، أي ذهب أكثره كما يتهور البناء - إذا انهدم. ومنه ح: "فتهور" القليب بمن عليه، هار البناء يهور
              وتهور - إذا سقط. وح: تركت المطر "هارا"، أي ساقطًا ضعيفًا، يقال: هو هائر، من هار يهور، وهار بالرفع بحذف همزته،
              وهار- بالجر بتأخير العين على اللام ثم إعلال قاضن وروي: هارا بالتشديد - ومر. ك: وقيل: أصله هور. شم: و"تهور" في
              كلامه، هو الوقوع في الشيء بقلة مبالاة.'
