            definitions:
            - sense_index: 0
              text: "هير: هارَ الجُرْفُ والبِناءُ وتَهَيَّرَ: انهدم، وقيل: إِذا انصدع\nالجرف من خلفه وهو ثابت بعد في مكانه\
                \ فقد هارَ، فإِذا سقط فقد انْهارَ\nوتَهَيَّر. وهَيَّرْتُ الجُرْفَ فَتَهَيَّر: لغة في هَوَّرْتُه. ورجل هَيارٌ:\n\
                يَنْهار كما يَنْهار الرمل؛ قال كثيِّر:\nفما وَجَدُوا منكَ الضَّريبَةَ هَدَّةً\nهَيَاراً، ولا سَقْطَ الأَلِيَّةِ\
                \ أَخْرَما\nوالهَيْرَةُ: الأَرضُ السهلة. وهِيرٌ وهَيْرٌ وهَيِّرٌ: من أَسماء\nالصَّبا، وكذلك إِيْرٌ وأَيْرٌ\
                \ وأَيِّرٌ، وقيل: هِيْرٌ وإِيْرٌ من أَسماء\nالشَّمال. والهائر: الساقط، والراهي المستقيم، والهَوْرَةُ الهَلَكَةُ.\
                \ يقال:\nاسْتَيْهِرْ بإِبلك واقْتَيِلْ وارْتَجِعْ أَي استبدل بها إِبلاً غيرها،\nواقتيل هو افْتَعِلْ من المُقايَلَةِ\
                \ في البيع المبادلة. ومضى هِيْرٌ من\nالليل أَي أَقل من نصفه؛ عن ابن الأَعرابي، وحكي فيه هِتْرٌ وقد ذكر.\n\
                وهِيْرُورٌ: ضرب \n(* قوله« وهيرور ضرب إلخ» بكسر الهاء بضبط الأصل وضبط\nفي القاموس بفتحها وتكلم الشارح عليهما\
                \ وعزا الأول لأئمة اللغة) من التمر،\nوالذي حكاه أَبو حنيفة هِيْرُونُ، بضم النون، فإِن كان ذلك فهو يحتمل\n\
                أَن يكون فِعْلُوناً وفِعْلُولاً.\nواليَهْيَرُّ: الحجر الصُّلْبُ الأَحمر. الحجرُ اليَهْيَرُّ: الصُّلْبُ،\n\
                ومنه سمي صمغ الطلْح يَهْيَرّاً، وقيل: هي حجارة أَمثال الأَكف، وقيل:\nهو حجر صغير، قال: وربما زادوا فيه الأَلف\
                \ فقالوا: يَهْيَرَّى، قالوا: وهو\nمن أَسماءِ الباطل. ابن شميل: قيل لأَبي أَسلم: ما الثَّرَّةُ\nاليَهْيَرَّةُ\
                \ الأَخلاف؟؟ فقال: الثَّرَّةُ السَّاهِرَة العِرْقِ تسمع زَمِيرَ\nشَخْبِها وأَنت من ساعة، قال: واليَهْيَرَّةُ\
                \ التي يسيل لبنها من كثرته، وناقة\nساهرة العروق، كثيرة اللبن: وقال أَبو حنيفة: اليَهْيَرُّ، مشدد:\nالصَّمْغة\
                \ الكبيرة؛ وأَنشد:\nقد مَلَؤُوا بُطونَهُمْ يَهْيَرَّا\nواليَهْيَرُّ واليَهْيَرَّى: الماءُ الكثير. وذهب ماله\
                \ في اليَهْيَرَّى\nأَي الباطل. أَبو الهيثم: ذهب صاحبك في اليَهْيَرَّى أَي في الباطل. شمر:\nذهب في اليَهْيَرِّ\
                \ أَي في الريح. ويقال للرجل إِذا سأَلته عن شيء\nفأَخطأَ: ذهبتَ في اليَهْيَرَّى، وأَين تذهبْ تذهبْ في اليَهْيَرَّى؛\n\
                وأَنشد:لما رأَتْ شيخاً لها دَوْدَرَّى،\nفي مثلِ خَيْطِ العِهِنِ المُعَرَّى\nطَلَّتْ كأَنَّ وجْهَها يَحْمَرَّا،\n\
                تَرْبُدُ في الباطلِ واليَهْيَرَّى\nوالدَّوْدَرَّى من وقولك فرس دَرِيرٌ أَي جواد، والدليل عليه قوله: في\nمثل\
                \ خيط العهن المعرى؛ يريد الخُدْرُوفَ. وزعم أَبو عبيدة أَن\nاليَهْيَرَّى الحجارة. واليَهْيَرُّ: الكذب. وقولهم\
                \ أَكذبُ من اليَهْيَرِّ، هو\nالسراب. الليث: اليَهْيَرُّ اللَّجَاجَةُ والتَّمادِي في الأَمر، تقول استيهر،\n\
                وأَنشد:\nوقَلْبُكَ في اللَّهْو مُستَيْهِرُ\n(* قوله« وقلبك إلخ» صدره كما في شرح القاموس عن الصاغاني« صحا العاشقون\n\
                وما تقصر».)\nالفراء: يقال قد اسْتَيْهَرْتُ أَنكم قد اصطلحتم، مثل استيقنت. قال أَبو\nتراب: سمعت الجعفريين أَنا\
                \ مُسْتَوْهِرٌ بالأَمر مستيقن؛ السلميّ:\nمُسْتَيهِرٌ. واليَهْيَرُّ: دُوَيْبَّة أَعظم من الجُرَذِ تكون في الصحاري،\n\
                واحدته يَهْيَرَّة؛ وأَنشد:\nفَلاةٌ بها اليَهْيَرُّ شُقْراً كأَنها\nخُصَى الخَيْلِ، قد شُدَّتْ عليها المَسامِرُ\n\
                واختلفوا في تقديرها فقالوا: يَفْعَلّةٌ، وقالوا: فَيْعَلَّةٌ، وقالوا:\nفَعْلَلَّةٌ. ابن هانئ: اليَهْيَرُّ شجرة،\
                \ واليَهْيَرُ، بالتخفيف،\nالحنظل، وهو أَيضاً السَّمُّ. واليَهْيَرُ: صَمْغُ الطَّلْحِ؛ عن أَبي عمرو.\nقال سيبويه:\
                \ أَما يَهْيَرُّ، مشدد، فالزيادة فيه أَولى لأَنه ليس في\nالكلام فَعْيَلُّ، وقد نقل ما أَوَّله زيادة، ولو كانت\
                \ يَهْيَرُّ مخففة الياء\nكانت الأُولى هي الزائدة أَيضاً، لأَن الياء إِذا كانت أَوَّلاً بمنزلة\nالهمزة؛ وأَنشد\
                \ أَبو عمرو في اليَهْيَرِّ صَمْغِ الطَّلْحِ:\nأَطْعَمْتُ رَاعِيَّ من اليَهْيَرِّ،\nفَظَلَّ يَعْوِي حَبَطاً\
                \ بِشَرِّ\nخَلْفَ اسْتِهِ، مثلَ نَقِيق الهِرِّ\nوهو يَفْعَلُّ لأَنه ليس في الكلام فَعْيَلُّ. قال ابن بري:\
                \ أَسقط\nالجوهري ذكر تَيْهُور للرمل الذي يَنْهار لأَنه يحتاج فيه إِلى فضل صنعة من\nجهة العربية؛ وساهدُ تَيْهورٍ\
                \ للرمل المُنْهارِ قول العجاج:\nإِلى أَراطٍ ونَقاً تَيْهُورِ\nوزنه تَفْعُول، والأَصل فيه تَهْيُور، فقدِّمت\
                \ الياء التي هي عين إِلى\nموضع الفاء، فصار تَيْهُوراً، فهذا إِن جعلت تَيهُوراً من تَيَهَّرَ\nالجُرُفُ، وإِن\
                \ جعلته\nمن تَهَوَّر كان وزنه فَيْعُولاً لا تَفْعُولاً، ويكون مقلوب العين\nأَيضاً إِلى موضع الفاء، والتقدير\
                \ فيه بعد القلب وَيْهُور، ثم قلبت الواو تاء\nكما قلبت في تَيْقُور، وأَصله وَيْقُور من الوَقار كقول العجاج:\n\
                فإِن يكن أَمْسى البِلَى تَيْقورِي\nأَي وَقاري. قال: وكثيراً ما تبدل التاء من الواو في نحو تُراثٍ وتُجاهٍ\n\
                وتُخَمَة وتُقًى وتُقاةٍ، وقد ذكرنا نحن التَّيْهُورَ في فصل التاء كما\nذكره ابن سيده وغيره."
