      headword_bare: |-
        (1) «أ» قطرة. «ب» pl.: جرعة دواء تقاس بالقطرات؛ وبخاصة: قطرة للعين. «ج» جرعة شراب
        (2) «أ» المدلاة: حلية مدلاة من إحدى المجوهرات. «ب» قرط ذو مدلاة. «ج» حبة بنبون
