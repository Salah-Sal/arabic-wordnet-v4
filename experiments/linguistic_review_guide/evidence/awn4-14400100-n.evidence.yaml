            definitions_text: 'هير{الهَيْرَةُ: الأَرْضُ السَّهْلَةُ المطمئنة.} والهِيرُ من اللَّيْل، بالكسْر وَالْفَتْح وكسَيِّد:
              الهِتْرُ، هَكَذَا فِي سَائِر النُّسخ. ومُقتضاه أَن يكون فِي {هير الليلِ لغاتٌ ثَلَاثَة، وَلَيْسَ كَذَلِك، فالمنقول
              عَن ابْن الأَعرابيّ وَغَيره يُقَال: مضى هيرٌ من اللَّيْل، بالكسْر فَقَط أَي أَقلّ من نصفه، قَالَ: وحُكِيَ فِيهِ
              هِتْرٌ، وَقد ذُكِر فِي مَوْضِعه. أَمّا اللُّغَات الْمَذْكُورَة فإنَّها جاءتْ فِي معنى رِيح الشَّمال فَقَالُوا:}
              هِيرٌ {وهَيْرٌ} وهَيِّرٌ، وَكَذَلِكَ إيْرٌ وأَيْرٌ وأَيِّرٌ، فَفِي كَلَام المصنّف نظَرٌ، وَلَو قَالَ: وبالفتح
              وكسَيِّد، لأَصابَ، وَقيل: هيرٌ من أَسماءِ الصَّبا. {والهَيْرُونُ: تَمْرٌ، م، مَعْرُوف، هَكَذَا نَقله الصَّاغانِيّ
              عَن أبي حنيفَة، وَالَّذِي نَقله الأَئمة عَن أَبي حنيفَة:} هيرُونُ بالكسْر وضَمِّ النّون من غير ألف وَلَام، فَإِن
              كَانَ ذَلِك فَهُوَ يحْتَمل أَن يكون فِعْلُوناً وفِعْلُولاً. واليَهْيَرُّ، بالتَّشديد: الحَجَرُ الأَحمرُ الصُّلْبُ،
              أَو اليَهْيَرُّ: حجارةٌ أَمثالُ الأَكُفِّ، أَو حَجَرٌ صغيرٌ، قَالَ أَبو حنيفَة: {واليَهْيَرُّ، مُشَدّداً: الصَّمْغَةُ
              الكَبيرةُ، وأَنشد: قد مَلَؤُوا بُطُونَهُم} يَهْيَرَّا اليَهْيَرُّ: السَّرابُ، وَمِنْه المثَلُ: فلانٌ أَكْذَبُ
              من {اليَهْيَرِّ. قَالَ اللَّيْث: اليَهْيَرُّ: اللَّجاجَةُ والتَّمادي فِي الأَمر، تَقول: اسْتَيْهَرَ وأَنشد:
              وقلبُكَ فِي اللَّهوِ} مُسْتَيْهِرُ اليَهْيَرُّ: الكَذِبُ. اليَهْيَرُّ: دُوَيْبةٌ تكون فِي الصحارى، أَعظَمُ من
              الجُرَذِ، واحدته {يَهْيَرَّةٌ، أَنشد ابْن شُمَيْل:(فَلاةٌ بهَا} اليَهْيَرُّ شُقْراً كأَنَّها ... خُصى الخَيْلِ
              قد شُدَّتْ عَلَيْهَا المَسامِرُ)اليَهْيَرُّ: الحَنْظَلُ، وَهُوَ أَيضاً: السُّمُّ، وَقد نُقِلَ فيهمَا التَّخْفِيف.
              اليَهْيَرُّ: صَمْغُ الطَّلْح، عَن أَبي عَمْرو، وأَنشد:(أَطْعَمْتُ راعِيَّ من اليَهْيَرِّ ... فظلَّ يَعْوي حَبَطاً
              بشرِّ)خَلْفَ اسْتِه مثلَ نَقيقِ! الهِرّ ِ قيل: سُمِّيَ بِهِ على التَّشبيه بِالْحِجَارَةِ الحُمْر الصُّلْبة.
              {اليَهْيَرَّةُ، بهاءٍ، من النُّوقِ، قَالَ ابنُ شُمَيْل: قيل لأبي أَسْلَم: مَا الثَّرَّةُ اليَهْيَرَّةُ الأخلافِ
              فَقَالَ: الثَّرَّة: الساهِرَةُ العِرْقِ، تَسْمَع زَميرَ شُخْبِها وَأَنت من ساعةٍ. قَالَ:} واليَهْيَرَّة: الَّتِي
              يسيلُ لبَنُها كَثْرَةً. وناقةٌ ساهِرَةُ العِرق: كثيرةُ اللبَن. ربّما زادوا فِيهِ الْألف فَقَالُوا: {اليهيرَّى
              مَقْصُورا مشدداً وَهُوَ المَاء الْكثير كاليهير اليَهْيَرَّى من أسماءِ الْبَاطِل، يُقَال مِنْهُ: ذهبَ مالُه فِي
              اليَهْيَرَّى، وَقَالَ أَبُو الْهَيْثَم: ذهبَ صاحبُك فِي اليَهْيَرَّى، أَي فِي الْبَاطِل. اليَهْيَرَّى: نباتٌ
              أَو شجرٌ، الأخيرُ عَن ابْن هَانِئ، زِنتُه يَفْعَلَّى أَو فَعْيَلَّى أَو فَعْلَلَّى. قَالَ سِيبَوَيْهٍ فِي الْكتاب:
              أما يَهْيَرّ مشدَّدةً فالزيادةُ فِيهِ أَوْلَى، لأنّه لَيْسَ فِي الكلامِ فَعْيَلٌّ، وَقد ثُقِّلَ آخِرُ مَا أوّله
              زيادةٌ كمكورّ، دون الثلاثيّ الَّذِي أوسطُه زِيَادَة كَفَوْعل وفَعْيَل، وَلَو كَانَت يَهْيَرّ مخفَّفةَ الياءِ
              كَانَت الأُولى هِيَ الزائدةَ)أَيْضا، لأنّ الياءَ إِذا كَانَت أوّلاً بِمَنْزِلَة الْهمزَة. وَقَالَ الصَّاغانِيّ:
              وَاخْتلفُوا فِي تَقْدِيره، قيل: إنّه يَفْعَلٌّ وَقد حَكَاهُ الجَوْهَرِيّ، وَقيل: إنّه فَعْيَلٌّ والياءُ الثانيةُ
              زائدةٌ. وَقيل: إنّه فَعْلَلٌّ.} وهِيرٌ، بِالْكَسْرِ: ع، بالبادية، عَن اللَّيْث. {والهَيَار، كَسَحَابٍ: الَّذِي
              يَنْهَارُ كَمَا يَنْهَارُ الرّملُ ويَسقُط. قَالَ كُثَيّر:(فَمَا وجَدوا مِنكَ الضَّريبَةَ هَدَّةً ... } هَيَاراً
              وَلَا سَقْطَ الأَلِيَّةِ أَخْرَما)ومِمّا يُسْتَدْرَك عَلَيْهِ: {تَهَيَّرَ الجُرْفُ والبِناءُ: انْهَدَم.} وهَيَّرْتُ
              الجُرفَ! فَتَهَيَّرَ، لُغَة فِي هَوَّرْتُه فَتَهَوَّر. {والهائِر: السَّاقِط، وَقد تقدّم أَيْضا فِي الْوَاو.
              وَيُقَال:} اسْتَيْهِرْ بإبلِك واقْتَيِلْ وارْتَجِعْ، أَي استَبدِلْ بهَا إبِلا غيرَها، وَسَيَأْتِي فِي يهر.واقْتَيِلْ
              هُوَ افْتَعِلْ من المقايَلَة فِي البيع والمبادلة. وَيُقَال: ذَهَبَ فِي {اليَهْيَرّ، أَي الرّيح، عَن شَمِر. وَيُقَال
              للرجل إِذا سَأَلْتَه عَن شيءٍ فَأَخْطَأَ: ذَهَبْتَ فِي} اليَهْيَرّى. وأينَ تذهبْ تذهبْ فِي اليَهْيَرَّى. وزعمَ
              أَبُو عُبَيْدة أنّ اليَهْيَرَّى الحِجارة.{والمسْتَيْهِر: المتمادي فِي اللَّجاجة. وَقَالَ الفَرّاء: يُقَال: قد}
              اسْتَيْهَرْتُ أنّكم قد اصطلَحتُم مثل: اسْتَيْقَنْت. وَذكره المصنّف فِي وهر اسْتِطْرَادًا، وَيَأْتِي لَهُ فِي
              يهر أَيْضا. وَإِذا كَانَ {التَّيْهور من} تَهَيَّرَ الجُرفُ فموضِع ذِكرِه هُنَا، وَقد تقدّم. {واليَهْيَرُّ، مشدَّد
              الآخرِ: الصُّلْب، عَن الْأَحْمَر، كأنّ هاءَه عَن همزَة.'
