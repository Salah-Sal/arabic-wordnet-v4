          - entry_id: 376909
            dictionary_id: 55
            headword: نقطة ثابتة
            headword_bare: نقطة ثابتة
            headword_norm: نقطة ثابتة
            root: نقط
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: سلم الحرارة التجريبي هو تقييم إصطلاحي للحرارة، يسمح بتعيين درجة الحرارة بالمقارنة مع درجات حرارة
              مرجعية. تسمى درجات الحرارة المرجعية هذه بالنقاط الثابتة، ويتم اختيارها بالنظر إلى اعتبارات عملية، حيث ترتبط
              بظواهر طبيعية يسهل إعادة إنتاجها تجريبيا في كل مكان. السلم العالمي للحرارة الصادر سنة 1990، يعتمد،على سبيل المثال،
              على النقطة الثلاثية للماء (درجة الحرارة التي تتزامن فيها الحالات الثلاث الطبيعية للماء) وعلى درجات حرارة تصلب
              معادن الزنك والذهب. ويتم تقسيم الفاصل بين النقاط الثابتة إلى درجات حرارة متساوية بالاعتماد على خصائص المواد
              أو العمليات الفيزيائية. ويعتمد مقياس سلم درجات الحرارة المئوي (سلسيوس) يعتمد، على سبيل المثال، على تمدد وتقلص
              الزئبق بفعل الحرارة، حيث تُسند لدرجة حرارة غليان الماء قيمة 100 بينما تُسند لدرجة تجمد الماء قيمة 0، في حين
              تُقسم المسافة التي تفصل بين هاتين القيمتين على المحرار، إلى مائة من الأجزاء المتساوية. وفي المقابل يعتمد مقياس
              سلم درجات الحرارة الفهرنهيتية على تغير حجم الكحول والذي يتم بشكل مختلف عن الماء. ولذلك فمن الضروري، استعمال
              أجهزة قياس معيارية ذات منحنيات خصائصية محددة بكل دقة. في نطاق درجات الحرارة الذي يمتد من 200 درجة مئوية تحت
              الصفر إلى 960 درجة مئوية فوق الصفر والذي يشمل أغلب التطبيقات التقنية، حيث يُكمن استعمال مقاييس حرارية مصنوعة
              من البلاتين ومصممة خصيصا للغرض. أما بالنسبة لدرجات الحرارة التي تفوق 960 درجة مئوية فإنه يقع اللجوء للقيس اللاتلامسي
              للإشعاع الطيفي بواسطة البيرومتر.
            translation_en: fixed point
            translation_fr: point(m.) fixe
            domain: Electrical Engineering
            external_id: arabterm:92603
