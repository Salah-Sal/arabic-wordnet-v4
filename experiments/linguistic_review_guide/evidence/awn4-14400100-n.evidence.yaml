            definitions_text: "باب الهاء مع الراء هـ ر، ر هـ مستعملان\nهر: الهِرّةُ: السِّنَّوْرة، والهِرُّ: الذَّكَرُ. ويُجْمَعُ\
              \ الهِرُّ: هرِرَةً، وتجمعُ الهرّة: هِرَراً. والهَرير: دونَ النُّباح. تقول: هرّ الكلاب إليه. وبه يُشبَّه نظرُ\
              \ الكُماةِ بعضِهم إلى بعضٍ، يقال: هر الكماة. وفلانٌ هرّه الناسُ، إذا كَرِهوا ناحيتَه. قال: \nأرى النّاسَ هرّوني\
              \ وشُهِّرَ مَدْخَلي ... وفي كلِّ مَمْشىً أرْصَدَ النّاس عَقْرَبا\nوهَرَّ الشَّوْكُ هرّاً إذا اشتدّ يُبْسُه.\
              \ قال: \nإذا ما هرَّ وآمْتَنَع المَذاقُ\nأي: صار كأنّه أظفار هرّ. والهُرْهورُ: الكثير من الماء واللبن، إذا حَلَبْتَ\
              \ سمعتَ له هَرْهَرَةً. قال: \nسَلْمٌ ترَى الدّالحَ منه أَزْوَرا ... إذا يَعُبُّ في الطَّوِيِّ هَرْهَرا\nوالهَرْهَرَة\
              \ والغرغرة يُحكَى بها بعض أصوات الهند والميذ  عند الحرب.\nره: الرّهرهةُ: حسنُ بصيصِ لونِ البَشَرة، وأشباه ذلك."
