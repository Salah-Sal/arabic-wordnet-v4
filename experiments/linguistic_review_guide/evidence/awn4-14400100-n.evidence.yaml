            definitions_text: '[هير] هَيَّرْتُ الجُرْفَ فَتَهَيَّرَ: لغة في هوَّرتُهُ فَتَهَوَّرَ. ويقال للشَمالِ : هيرٌ وهَيْرٌ
              عن الفراء، لغة في إير وأير، مثل أراق وهراق. واليهير بتشديد الراء: صمغ الطلح، عن ابي عمرو. وأنشد: أطعمت راعى
              من اليهير * فظل يعوى حبطا بشر * خلف استه مثل نقيق الهر * وهو يفعل، لانه ليس في الكلام فعيل. وقال الاحمر: الحجر
              اليَهْيَرُّ: الصُلبُ. ومنه سمِّي صمغ الطلح يَهْيَرًّا. قال أبو بكر بن السراج: وربما زادوا فيه الألف فقالوا:
              يَهْيَرَّى. قال: وهو من أسماء الباطل. وقولهم: " أكذب من اليهير "، هو السراب.'
