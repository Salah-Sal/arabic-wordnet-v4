          - entry_id: 766996
            dictionary_id: 103
            headword: أهر
            headword_bare: أهر
            headword_norm: اهر
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              أهر: الأَهَرَةُ، بالتحريك: متاع البيت. الليث: أَهَرَةُ البيت ثيابه
              وفرشه ومتاعه؛ وقال ثعلب: بيتٌ حَسَنُ الظَّهَرة والأَهَرَة والعَقار، وهو
              متاعه؛ والظَّهَرَةُ: ما ظهر منه، والأَهَرَة: ما بطن، والجمع أَهَرٌ
              وأَهَراتٌ؛ قال الراجز:
              عَهْدِي بجَنَّاحٍ إِذا ما ارْتَزَّا،
              وأَذْرَتِ الرِّيحُ تُراباً نَزَّا
              أَحْسَنَ بَيْتٍ أَهَراً وبَزاً،
              كأَنما لُزَّ بصَخْرٍ لَزَّا
              وأَحسن في موضع نصب على الحال سادّ مسدّ خبر عهدي، كما تقول عهدي بزيد
              قائماً. وارْتَزَّ بمعنى ثبت. والترابُ النَّزُّ: هو النَّديُّ. رأَيت في
              حاشية كتاب ابن بري ما صورته: في المحكم جَنَّاحٌ اسم رجل وجَنَّاحٌ اسم
              خباءٍ من أَخبيتهم؛ وأَنشد:
              عَهْدي بجَنَّاحٍ إِذا ما اهْتَزَّا،
              وأَذْرَت الرِّيحُ تراباً نَزَّا،
              أَن سَوْفَ تَمْضِيه وما ارْمأَزَّا
              قال: وتمضيه تمضي عليه. ابن سيده: والأَهَرَة الهيئة.
