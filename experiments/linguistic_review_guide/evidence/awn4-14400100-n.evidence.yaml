            is_partial: 0
            definitions_text: تحدث هذه النقطة عند تعادل نسبة نقل عزم الدوران بين عجلة الضخ والعجلة التوربينية لمُحول عزم الدوران
              الهيدرولي. أي أنه بدءاً من هذه النقطة، يتساوى عزم الدوران للمحرك وللتوربينة. تبلغ نسبة سرعة الدوران بين عجلة
              الضخ والعجلة التوربينية حوالي 1:0.85. ويُعطي مُحول عزم الدوران أعلى قيمة لعزم الدوران - التي تساوي مقدار مرتين
              ونصف مرة عزم دوران المحرك - عندما تكون السيارة وبالتالي العجلة التوربينية متوقفتين، بينما يقوم المحرك بإدارة
              عجلة الضخ بأقصى طاقة.
