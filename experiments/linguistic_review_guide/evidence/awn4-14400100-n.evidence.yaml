            root: نقط
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: النّقطة:[في الانكليزية] Point [ في الفرنسية] Point بالضم وسكون القاف عند المهندسين هي شيء ذو
              وضع يمكن أن يشار إليه بالإشارة الحسّية غير منقسم أصلا لا طولا ولا عرضا ولا عمقا، لا بالفعل ولا بالتوهّم، ولا
              يرد الجوهر الفرد لأنّهم غير قائلين به. وأمّا من يقول به فيقول هو عرض ذو وضع الخ كذا في شرح أشكال التأسيس في
              المقدمة. ونقطة المحاذاة عند أهل الهيئة قد سبقت في لفظ معدّل المسير. ونقطة المشرق عندهم وتسمّى بنقطة الاعتدال
              الربيعي وبالاعتدال الربيعي وبمطلع الاعتدال أيضا، ونقطة المغرب وتسمّى بمغرب الاعتدال ومغيب الاعتدال، ونقطة الاعتدال
              الخريفي وتسمّى بالاعتدال الخريفي ونقطة الانقلاب الصيفي والشتوي سبقت في بيان دائرة البروج ونقطة الشمال ونقطة
              الجنوب سبقتا في دائرة نصف النهار، ونقطة الطالع ونقطة الغارب قد سبقتا في لفظ السّمت.
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:24:2517
