            definitions_text: 'علامة توضع فوق الحروف أو تحتها لتمييزها أو لبيان حركاتها؛ وفي الرياضيات علامة ( . ) تدل على
              انتهاء الجملة أو تفصل بين الأعداد العشرية. من الشيء: جزء صغير. يقال: أعطاه نُقْطَةً من عسل: قَدْراً صغيراً منه.
              له نقطة من نخل: قطعة منه. ما يقدَّم إلى العروسين أو أحدهما من مال أو هدية. (مو). الأمر والقضية. ويقال: لم يختلف
              الخطيبان في نُقْطَة: بينهما تمام الاتفاق. (في الهندسة): ما ليس له طول ولا عرض .(مج).'
