            definitions_text: |-
              هرتم: الهَرْتَمةُ: العَرْتَمةُ، ويه الدائرة التي وسَطَ الشفةِ العليا.
              الأَزهري عن ابن الأَعرابي: هي الخُنْعُبةُ والنُّونةُ والثُّومةُ
              والهَزْمةُ والوَهْدةُ والقَلْدةُ والهَرْتَمةُ والعَرْتَمَةُ والحِثْرِمة.
              وقال الليث: الخُنْعُبةُ مَشَقُّ ما بين الشارِبَين بحِيالِ الوَتَرةِ.
