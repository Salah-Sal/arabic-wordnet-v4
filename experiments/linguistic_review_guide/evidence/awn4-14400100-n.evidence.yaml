          - entry_id: 358365
            dictionary_id: 60
            headword: نقاط ساخنة للتنوع البيولوجي
            headword_bare: نقاط ساخنة للتنوع البيولوجي
            headword_norm: نقاط ساخنة للتنوع البيولوجي
            root: نقط
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'النقاط الساخنة للتنوع البيولوجي هي المناطق البرية التي تتواجد بها أعداد كبيرة، خصوصا من الأنواع
              المتوطنة، وتعتبر مجالات تركيز هامة للتنوع البيولوجي، حيث هناك حاجة إلى إجراءات الحفظ. ليتم اعتبار موقع نقطة
              ساخنة، يجب أن يستوفي معيارين صارمين: أن تحتوي على ما لا يقل عن 1500 نوع من النباتات الوعائية (أكثر من 0،5 %
              من المجموع العالمي) كنباتات متوطنة وتكون قد فقدت حوالي 70 % من بيئتها الأصيلة الأصلية. وقد أجري تقييم عالمي
              للنقاط الساخنة للتنوع البيولوجي في أواخر التسعينيات وأدى إلى تحديد 25 منطقة، وتحتوي هذه المناطق مجتمعة على 44
              % من أنواع النباتات الوعائية المتوطنة في العالم و 35 % من الفقاريات الأرضية في منطقة تغطي فقط 11،8 % من سطح
              الأرض.'
            translation_en: biodiversity hotspots
            translation_fr: points chauds de la biodiversité
            domain: Climate, Environment and Solid Waste management
            external_id: arabterm:69356
            dict_key: arabterm_arabterm_climate_environment
