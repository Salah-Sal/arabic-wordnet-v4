          واقع الظروف الضغطية المؤثرة على الجانب العلوي للكبّاس، وجانبه السُفلي. ويُحدد [ضغط الغرفة (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90919)
          الظروف الضغطية المؤثرة على أسفل الكبّاس، أمّا الظروف الضغطية المؤثرة على أعلى الكباس فيتم تحديدها من واقع الضغط
          المسلط على جانب الضغط العالي. وتؤثر كمية وسيط التبريد، التي يسمح [صمام التمدّد (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90947)
          بتدفقها إلى المبخر، على الظروف الضغطية الخاصة [بجانب الضغط العالي (مكيف الهواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90964))،
          و[جانب الضغط المنخفض (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=94618)، وبالتالي
          فإنها تؤثر أيضاً على الوضع المائل للقرص المُتراوح..
