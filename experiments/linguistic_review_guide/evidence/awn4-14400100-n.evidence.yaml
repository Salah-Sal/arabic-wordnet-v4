          - entry_id: 775344
            dictionary_id: 103
            headword: هرت
            headword_bare: هرت
            headword_norm: هرت
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              هرت: هَرَتَ عِرْضَه، وهَرَطَه، وهَرَدَه؛ ابن سيده: هَرَتَ عِرضَه
              وثَوْبه يَهْرُته ويَهْرِتُه هَرْتاً، فهو هريتٌ. مَزَّقه وطَعَنَ فيه، لغاتٌ
              كلها؛ الأَزهري: هَرَتَ ثوبَه هَرْتاً إِذا شَقَّه. ويقال للخطيب من
              الرجال: أَهْرَتُ الشِّقْشِقةِ؛ ومنه قول ابن مُقْبل:
              هُرْت الشَّقَاشِق، ظَلاَّمُونَ للجُزُرِ
              والهَرَتُ: سَعَةُ الشِّدْقِ. والهَرِيتُ: الواسعُ الشِّدْقَيْن؛ وقد
              هَرِتَ، بالكسر، وهو أَهْرَتُ الشِّدْقِ وهَرِيتُه.
              وفي حديث رَجاء بن حَيْوة: لا تُحَدِّثْنا عن مُتهارِتٍ أَي مُتَشَدِّقٍ
              مُتَكاثِر، مِن هَرَتِ الشِّدْقِ، وهو سَعَتُه.
              ورجل أَهْرَتُ، وفرس هَرِيتٌ وأَهْرَتُ: متَّسِعُ مَشَقِّ الفَمِ.
              وجَمَلٌ هَريتٌ، كذلك؛ وحيَّة هَرِيتُ الشِّدْقِ، ومَهْرُوتَتُه؛ أَنشد يعقوب
              في صفة حية:
              مَهْرُوتَةُ الشِّدْقَيْن، حَولاءُ النَّظَرْ
              والهَرَتُ: مصدرُ الأَهْرَتِ الشِّدْق.
              وأَسَدٌ أَهْرَتُ: بَيِّنُ الهَرَتِ، وهَريتٌ ومُنْهَرِتٌ؛ الأَزهري:
              أَسَدٌ هَرِيتُ الشِّدْقِ أَي مَهْرُوتٌ ومُنْهَرِتٌ، وهو مَهرُوتُ الفم،
              وكلابٌ مُهَرَّتةُ الأَشْداقِ.
              والهَرْتُ: شَقُّك الشيءَ لتُوَسِّعَه، وهو أَيضا جَذْبُك الشِّدْقَ
              نحوَ الأُذن؛ وفي التهذيب: الهَرْتُ هَرْتُكَ الشِّدْقَ نحوَ الأُذن.
              وامرأَة هَرِيتٌ وأَتُومٌ: مُفْضاةٌ؛ ورجل هَريتٌ: لا يَكْتُم سِرًّا؛
              وقيل: لا يَكتُم سِرًّا، ويتكلم مع ذلك بالقبيح.
              وهَرَتَ اللحمَ: أَنْضَجَه وطَبَخَه حتى تَهرَّى.
              وفي الحديث: أَنه أَكلَ كَتِفاً مُهَرَّتةً ومَسَح يَدَه فَصَلَّى؛
              لَحْمٌ مُهَرَّتٌ ومُهَرَّدٌ إِذا نَضِجَ؛ أَراد قد تَقَطَّعَتْ من نُضْجِها؛
              وقيل: إِنها مُهَرَّدَة بالدال.
              وهاروتُ: اسم مَلَك أَو مَلِك، والأَعْرَف أَنه اسم مَلَك.
