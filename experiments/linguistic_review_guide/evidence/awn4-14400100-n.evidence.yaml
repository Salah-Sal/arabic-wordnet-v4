          - entry_id: 823019
            dictionary_id: 120
            headword: تهر
            headword_bare: تهر
            headword_norm: تهر
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'تهر: (التَّيْهُور) : مَا اطْمَأَنَّ من الأَرض) . قَالَ الأَزهريُّ: هُوَ فَيْعُولٌ مِن الوَهْر،
              قُلِبَت الواوُ تَاء، وأَصلُه وَيْهُورٌ، مثلُ التَّيْقُورِ، وأَصلُه وَيْقُورٌ. قَالَ العَجّاج:إِلى أَراطَى ونَقاً
              تَيْهُورِقَالَ: أَراد بِهِ فَيْعُول من التَّوَهُّر.(و) قيل: هُوَ (مَا بَيْنَ أَعْلَى) شَفِيرِ (الوادِي والجَبَلِ،
              وأَسْفَلِهما) نَجْدِيّةٌ هُذَلِيْةٌ، قَالَ بعضُ الهُذَلِيِّين:وطَلَعْتُ مِن شِمْرَاخَةٍ تَيْهُورةٍشَمّاءَ مُشْرِفة
              كَرَأْسِ الأَصْلَعِ(و) التَّيهُورُ: (الرَّجلُ التّائِهُ المُتَكَبِّرُ) ، قَالَ الأَزْهَرِيُّ: وَيُقَال للرجل
              إِذا كَانَ ذَاهِبًا بنفْسِه بِهِ تِيهٌ: تَيْهٌ: تَيْهُورٌ، أَي تائِهٌ.(و) التَّيْهُورُ: (مَوْجُ البَحْر المُرْتَفِعُ)
              ، قَالَ الشَّاعِر:كالبَحْرِ يَقْذِفُ بالتَّيْهُور تَيْهُورَا(و) فِي التَّهْذِيب فِي الرُّباعِيّ: التَّيْهُور:
              مَا اطْمأَنَّ من الرَّمْلِ. وَفِي الصّحاح: التَّيّهُورُ (من الرَّمْلِ: مالَه جُرُفٌ. ج تَيَاهِيرُ وتَيَاهِرُ)
              ، قَالَ الشَّاعِر:كيفَ اهْتَدَتْ ودُونَهَا الجَزَائِرُوعَقِصٌ مِن عالجٍ تَيَاهِرُوَقيل: هُوَ الرَّمْلُ المُشْرِفُ.
              وَفِي الأَساس: هُوَ مَا يَنْهَارُ وَلَا يَتَمَاسَكُ مِن الرَّمْله.(والتَّوْهَرِيُّ: السَّنَامُ الطَّوِيلُ) ،
              قَالَ عَمْرُو بنُ قَمِيئَةَ:فأَرْسَلتُ الغُلامَ وَلم أُلَبِّثْإِلى خَيْرِ البَوَارِكِ تَوْهرِيَّاقَالَ ابْن
              سِيدَه: وأَثبتُّ هاذه اللَّفْظَة فِي هاذا الْبَاب لأَن التَّاءَ لَا نَحْكُمُ عَلَيْهَا بالزِّيادة أَوَّلاً إِلّا
              بِثَبتٍ.(و) من المَجاز: (التّاهُور: السَّحَابُ) .'
