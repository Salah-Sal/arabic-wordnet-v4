          - entry_id: 767684
            dictionary_id: 103
            headword: تهر
            headword_bare: تهر
            headword_norm: تهر
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              تهر: التَّيْهُورُ: موج البحر إِذا ارتفع؛ قال الشاعر:
              كالبَحْرِ يَقْذِفُ بالتَّيْهُورِ تَيهورا
              والتيهور: ما بين قُلَّةِ الجبل وأَسفله؛ قال بعض الهذليين:
              وطَلَعْتُ مِنْ شِمْراخِهِ تَهُورَةً،
              شَمَّاءَ مُشْرِفَةً كرأْس الأَصْلَعِ
              والتَّيْهُورُ: ما اطمأَنَّ من الأَرض، وقيل: هو ما بين أَعلى شفير
              الوادي وأَسفله العميق، نجدية، وقيل: هو ما بين أَعلى الجبل وأَسفله، هذلية؛
              وهي التَّيْهُورةُ، وضعت هذه الكلمة على ما وضعها عليه أَهل التجنيس.
              التهذيب في الرباعي: التَّيْهُورُ ما اطمأَن من الرَّمْل. الجوهري:
              التَّيْهُورُ من الرمل ما له جُرُفٌ، والجمع تَيَاهِيرُ وتَياهِرُ؛ قال
              الشاعر:كيف اهْتَدَتْ ودُونَها الجَزائِرُ،
              وعَقِصٌ مِنْ عالِجٍ تَياهِرُ؟
              وقيل: التَّيْهورُ من الرمل المُشْرفُ، وأَنشد الرجز أَيضاً.
              والتَّوْهَرِيُّ: السِّنام الطويل؛ قال عمرو بن قَميئَة:
              فَأَرْسَلْتُ الغُلامَ، ولم أُلبِّثْ،
              إِلى خَيْرِ البوارِك تَوْهَرِيّا
              قال ابن سيده: وأثبت هذه اللفظة في هذا الباب لأَن التاء لا يحكم عليها
              بالزيادة أَوّلاً إِلاَّ بِثَبَتٍ. قال الأَزهري: التَّيْهُورُ فَيْعُول
              من الوَهْرِ قلبت الواو تاء وأَصله وَيْهُورٌ مثل التَّيْقُور وأَصله
              وَيْقُور؛ قال العجاج:
              إِلى أَرَاطَى ونَقاً تَيْهُورِ
              قال: أَراد به فَيْعُول من الوهر. ويقال للرجل إِذا كان ذاهباً بنفسه:
              به تِيهٌ تَيْهُورٌ أَي تائه.
