            definitions_text: (النقطة) عَلامَة مستديرة صَغِيرَة جدا على سطح مستو وَفِي الْخط الْعَرَبِيّ عَلامَة مستديرة غير
              مطموسة صَغِيرَة تجْعَل فَوق الْحَرْف المعجم أَو تَحْتَهُ لتميزه وَكَانَت تسْتَعْمل فِي الْكِتَابَة الْقَدِيمَة
              للشكل أَيْضا وتستعمل النقط فِي بعض اللُّغَات السامية الْأُخْرَى لشكل الْحُرُوف وَيُقَال وضع النقط على الْحُرُوف
              بَين الْأَمر وأوضحه وَمن الشَّيْء جُزْء صَغِير يُقَال أعطَاهُ نقطة من عسل قدرا صَغِيرا مِنْهُ وَله نقطة من نخل
              قِطْعَة مِنْهُ وَمَا يقدم إِلَى العروسين أَو أَحدهمَا من مَال أَو هَدِيَّة (مو) وَالْأَمر والقضية وَيُقَال لم
              يخْتَلف الخطيبان فِي نقطة بَينهمَا تَمام الِاتِّفَاق و (فِي الهندسة) مَا لَيْسَ لَهُ طول وَلَا عرض (مج)(ج) نقط
              ونقاط
