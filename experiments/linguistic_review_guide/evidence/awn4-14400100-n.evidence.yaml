            definitions_text: 'يهر} اليَهْرُ، بِالْفَتْح ويُحرَّكُ، أَهمله الجَوْهَرِيّ. وَقَالَ الصَّاغانِيّ: هُوَ المَوضِع
              الواسعُ، قَالَ أَبو تُراب: اليَهْرُ: اللَّجَاجُ والتَّمادي فِي الأَمْر، وَقد {اسْتَيْهَرَ الرَّجُلُ، إِذا لَجَّ
              وتَمادَى فِي الأَمر. وَوَقع فِي التكملة وَاللِّسَان وَغَيرهمَا من الأُصول أنَّ الَّذِي بِمَعْنى اللَّجاجِ هُوَ}
              اليَهْيَرُ كجَعْفَر وَهُوَ الْمَنْقُول عَن أَبي تُرَاب. يُقال: {اسْتَيْهَرَت الحُمُرُ، إِذا فَزِعَتْ، حَكَاهُ
              ثعلَب، عَنهُ أَيضاً: اسْتَيْهَرَ الرَّجلُ، إِذا ذهَبَ عقلُه، فَهُوَ} مُسْتَيْهِرٌ وأَنشد:(يَسْعى ويَجْمَعُ دائباً
              {مُسْتَيْهِراً ... جِدّاً وَلَيْسَ بآكلٍ مَا يَجْمَعُ)عَن أبي تُراب:} استَيْهَرَ الرجلُ: استيْقَنَ بالأَمر،
              وأَنشد اللَّيْث:(صَحا العاشِقُونَ وَمَا تُقْصِرُ ... وقلبُكَ فِي اللَّهْوِ! مُسْتَيْهِرُ)هَكَذَا أَنشده الصَّاغانِيّ
              وَغَيره هُنَا، {كاسْتَوْهَرَ، وَهَذِه عَن السَّلَميّ، وَقد تقدّم فِي وهر للمصنّف ذكر اللّغتين، وَسبق لنا فِي
              هى ر كَذَلِك. وَذُو} يَهَر مُحَرَّكَةً وَقد يُسَكَّنُ، وَاقْتصر الصَّاغانِيّ على التَّحريك: مَلِكٌ من مُلوك
              حِمْيَرَ من الأَذواء. {واليَهْيَرُّ، مُشدَّدَ الآخِرِ، فِي هى ر، وَعَن ابْن الأَعرابيّ: يُقَال:} اسْتَيْهِرْ
              بإبِلِك واقْتَيِل وارْتَجِعْ، أَي اسْتَبْدِل بهَا إبِلا غيرَها، واقْتَيِلْ هُوَ افْتَعِلْ من المُقايَلَة فِي
              البيع، وَهِي المُبادلَة، نَقله الصَّاغانِيّ وابنُ مَنْظُور، وَقد تقدّم لذَلِك ذِكْرٌ فِي " هـ ى ر ".وَبِه تمّ
              حرف الرَّاء بِفضل الله تَعَالَى وَحسن عونه وتوفيقه، وَالْحَمْد لله الذى بنعمته تتمّ الصَّالِحَات، وَصلى الله
              على سيدنَا ومولانا مُحَمَّد خير البريات، وعَلى آله وَصَحبه أولى الكرامات، وَمن تَبِعَهُمْ بِإِحْسَان إِلَى مَا
              بعد يَوْم يجزى العَبْد بِالْحَسَنَاتِ.اللَّهُمَّ إنى أَسأَلك بحبيبك الْمُصْطَفى، صلى الله تَعَالَى عَلَيْهِ
              وَسلم، وبأوليائك وأحبابك، توفقنى لإتمام مَا بقى من الْكتاب، على أحسن أَحْوَال، ولأتم منوال، من غير سَابِقَة
              عائق، وَلَا عائقة سَابق، إِنَّك على كل شَيْء قدير، وبالإجابة جدير على كل شئ قدير، بوالإجابة جدير.وأسلك اللَّهُمَّ
              أَن تغْفر لنا ذنوبنا، وتكفر عَنَّا سيىتنا، وَتب علينا وَعَافنَا واعف عَنَّا، وَأصْلح فَسَاد قُلُوبنَا، إِنَّك
              على كل شئ قدير.وَكَانَ الْفَرَاغ من ذَلِك فِي سحر لَيْلَة الِاثْنَيْنِ، لخمس بقيت من شهر رَمَضَان المكرم، من
              شهور سنة 1183 بمنزلى فِي عطفة الغسال، فِي مصر، حرست. وَكتبه مُحَمَّد مرتضى الحسينى، عَفا الله عَنهُ، آمين. بِسم
              الله الرَّحْمَن الرَّحِيم الْحَمد لله وَالصَّلَاة وَالسَّلَام على رَسُول الله؛ مُحَمَّد وعَلى آله وَصَحبه وَمِنْه
              تَبِعَهُمْ بِإِحْسَان. اللَّهُمَّ يسر يَا كريم.'
