            definitions_text: هي درجة الحرارة التي تشتعل عندها مُكوّنات الوقود المُتبخرة لوقت قصير عند اقتراب لهب الإشعال
              منها. فإذا ظل الوقود المُشتعل مُحترقاً، تتحقق ما يُسمى بنقطة الاحتراق. وترتبط كل من نقطة الإشعال ونقطة الاحتراق
