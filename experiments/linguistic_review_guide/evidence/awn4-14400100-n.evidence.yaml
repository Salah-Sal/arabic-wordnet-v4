          - entry_id: 775580
            dictionary_id: 103
            headword: هور
            headword_bare: هور
            headword_norm: هور
            root: هر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              هور: هارَه بالأَمرِ هَوْراً: أَزَنَّه. وهُرْتُ الرجلَ بما ليس عنده من
              خير إِذا أَزْنَنْتَه، أَهُورُه هَوْراً؛ قال أَبو سعيد: لا يقال ذلك في
              غير الخبر. وهارَه بكذا أَي ظنه به؛ قال أَبو مالك بن نُوَيْرَة يصف
              فرسه:
              رَأَى أَنَّني لا بالكثير أَهُورُه،
              ولا هُوَ عَنِّي في المُواساةِ ظاهرُ
              أَهُورُه أَي أَظن القليلَ يكفيه. يقال: هو يُهارُ بكذا أَي يُظَنُّ
              بكذا؛ وقال آخر يصف إِبلاً:
              قد عَلِمَتْ جِلَّتُها وخُورُها
              أَني، بِشِرْبِ السُّوءِ، لا أَهُورُها
              أَي لا أَظن أَن القليل يكفيها ولكن لها الكثير.
              ويقل: هُرْتُ الرجلَ هَوْراً إِذا غَشَتشْتَه. وهُرْتُه بالشيء:
              اتَّهَمْتُه به، والاسم الهُورَةُ. وهارَ الشيءَ: حَزَرَه. وقيل للفَزارِيِّ: ما
              القطعة من الليل؟ فقال: حُزْمَةٌ يَهُورُها أَي قطعة يَحْزُرها.
              وهُرْتُه: حملته على الشيء وأَردته به. وضَرَبَه فَهارَه وهَوَّره إِذا صرعه.
              وهارَ النباءَ هَوْراً: هَدَمَه. وهار البناءُ والجُرْفُ يَهُورُ هَوْراً
              وهُؤُوراً، فهو هائِرٌ وهارٍ، على القلب.
