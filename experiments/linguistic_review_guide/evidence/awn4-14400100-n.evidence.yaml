            definitions_text: 'سنهر(سَنْهُورُ، بالفَتْحِ) ، أَهمله الجَمَاعَة ث، قَالَ شيخُنَا: ذِكْرُ الفَتْح مستدرَك، وكأَنَّه
              لدَفْعِ توَهُّمِ دَعْوَى القِيَاسِ فِيهِ، بِنَاء على أَنه فُعْلُول، وَلَا يكونُ مَفْتُوحاً.قلت: وَالَّذِي فِي
              التَّكْمِلَة سَنْهُور، مِثَال زَنْبُور: (بَلَدَتانِ بِمِصْرَ: إِحْدَاهُمَا بالبُحَيْرَةِ) وتُضَافُ إِلَى طلوس
              وَهِي بالقُرْبِ من الإِسْكَنْدَرِيّة (والأُخْرَى بالغَرْبِيَّة) وَهِي المَشْهُورة بسَنْهُورِ المَدينَة، وَمِنْهَا
              الفقيهُ أَبو إِسحاقَ إِبْرَاهِيمُ بنُ خَلَفِ بنِ مَنْصُور الغَسَّانِيّ السَّنْهُورِيّ، دَخَلَ خُرَاسَانَ، وسمعَ
              بهَا من المُؤَيّد بنِ مُحَمَّد الطُّوسِيّ، ودَخَلَ المَغْرِبَ، وكانَ يَنْتَحِل مَذهبَ ابنِ حَزْمٍ الظَّاهِرِيّ،
              وحدَّثَ بشْيءٍ يسيرٍ، ذكرهَ الصّابُونيّ.قلت: وسَنْهُورُ أَيضاً: قَرْيتان بالشَّرْقِيَّة، إِحداهُما: من حُقُوقِ
              مُنْيَةِ صَيْفيّ، والأُخْرَى تُضَافُ إِلى السِّباخ، وَمن إِحداهُنّ الإِمامُ المُحَدِّثُ زينُ الدّينِ أَبُو النَّجاءِ
              سالِمُ ابنُ محمَّدِ بنِ مُحَمَّدٍ السَّنْهُورِيُّ المالكيّ، رَوَى عَن النَّجْمِ محمَّدِ بنِ أَحمَدَ) السَّكَنْدَرِيّ،
              والشَّمْسِ محمَّدِ بنِ عبدِ الرَّحمانِ العَلْقَمِيّ، كِلَاهُمَا عَن السّيُوطِيّ، وَشَيخ الإِسلام، تُوُفِّي فِي
              خَمْسٍ من جُمَادَى الآخِرَة سنة 1015.(وأَمّا الَّتِي بالصَّعِيدِ فبالشِّينِ المُعْجَمَةِ) ، شَنْهُور.وَمِمَّا
              يسْتَدرك عَلَيْهِ:سِنَّهْرِي، بِكَسْر السِّين وَتَشْديد النُّون الْمَفْتُوحَة وَكسر الراءِ: قَرْيَة بِمصْر من
              أَعمال الشرقيّة.'
