    - entry_id: 728949
      dictionary_id: 94
      headword: |
        (1) «أ» أبيض. «ب» أشيب. «ج» شاحب. «د» فضّيّ
        (2) طاهر؛ بريء
        (3) أبيض: غير مؤذٍ white magic
        (4) «أ» مُتّشح بالبياض white knights. «ب» مُثْلَج؛ مصحوب بالثلج a white winter. «ج» مكسوّ بالثلج white hills
        (5) «أ» مُحَمًّى حتى الابيضاض. «ب» متّقد؛ هائج white fury
        (6) محافظ أو رجعيّ
