          عنابي: اسم نوع من القثاء. (ابن العوام 2: 213). وانظر: عَتَّابي.
          عَنابي أو كورنتو: هو في الأندلس مزيج من الذهب والفضة والنحاس. (براكس مجلة الشرق والجزائر 4: 137).
