      - entry_id: 811530
        dictionary_id: 116
        headword: كيف
        headword_bare: كيف
        headword_norm: كيف
        root: كف
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: '[كيف] ك: فيه: "كيف" وقد قيل! أي كيف تباشرها وقد قيل: إنك أخوها، وهو بعيد عن الورع، ففارقها أي طلقها
          ورعًا لا حكمًا، وأخذ بظاهره أحمد فأثبت الرضاع بشهادة المرضعة. وفيه: "كيف" صلاة الرجل؟ قال: مثنى مثنى، أي كيف صلاته
          عددًا، وتكرار مثنى تأكيد لأن الأول تكرر معنى، وهو مرفوع خبر محذوف أي صلاته مثنى. ط: "كيف" بكم إذا غدا أحدكم في حلة،
          أي كيف يكون حالكم إذا كثرت أموالكم ويلبس كل واحد ثوبًا في أول النهار وثوبًا في آخره لغاية التنعم، وذلك حين رأى مصعب
          بن عمير في ثوب مرقع ساكنًا في مسجد قباء، كان في مكة من أغنياء قريش، فقال: لأنتم اليوم خير، لأن الفقير ذا الكفاف
          خير من الغني المشتغل عن العبادة. ن: فكيف أنتم، هو سؤال من حسن الحال لا من شدتها لاستفاضة البركة. وح: "فكيف" نصلي
          عليك؟ إما سؤال عن كيفية الصلاة في غير الصلاة، أو فيها وهو الأظهر، قوله: حتى تمنينا أنه لم يسأله، أي كرهنا سؤاله
          مخافة أن يكون صلى الله عليه وسلم كره سؤاله فشق عليه. وح: أما ما ذكرت من رجب "فكيف" بمن يصوم الأبد؟ هذا إنكار لتحريمه
          يعني أنه يصوم الأبد فكيف ينكر صوم رجب، وأجاب عن العلم أنه لا يحرمه وإنما هو يتورع خوفًا من دخوله في عموم النهي عن
          الحرير، وأجاب عن الميثرة أيضًا بإنكار التحريم منه وقال أنا أستعمله، وأخرجت أسماء جبة النبي صلى الله عليه وسلم المكفوفة
          بالحرير بيانًا لعدم حرمته.'
