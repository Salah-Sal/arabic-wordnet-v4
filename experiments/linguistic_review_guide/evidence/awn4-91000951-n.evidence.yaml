      - entry_id: 808673
        dictionary_id: 116
        headword: جحح
        headword_bare: جحح
        headword_norm: جحح
        root: null
        root_source: null
        pos: null
        form: null
        is_partial: 0
        definitions_text: '[جحح] ج: اجحت المرأة إذا حملت ودنا وقت ولادتها. ومنه ح: مر بامرأة مجح. ن: بضم ميم فكسر جيم فحاء
          مهملة. ط: فقال: أيلم بها؟ أي يطأها، وهم بلعنه لترك الاستبراء، وبين موجب اللعن بقوله: كيف يستخدمه، وضمير مفعوله للولد،
          وكذا ضمير يورثه يعني إن ألم بها وأتت بالولد فيمكن كونه منه وكونه ممن ألم بها قبله، وعلى الأول كيف يستخدمه استخدام
          العبيد، فيكون قاطعاً لنسبته عن نفسه، وعلى الثاني أن استلحقه بنفسه فيورثه وتوريث ولد الغير حرام، وهو لا يحل أي استخدامه
          وتوريثه، وأم في "أم كيف" منقطعة. نه ومنه ح: إن كلبة كانت في بني إسرائيل "مجحا" فعوى جراؤها في بطنها.'
        translation_en: null
