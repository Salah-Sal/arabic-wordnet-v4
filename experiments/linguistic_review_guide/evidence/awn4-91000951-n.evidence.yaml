          - entry_id: 359646
            dictionary_id: 60
            headword: تكيف
            headword_bare: تكيف
            headword_norm: تكيف
            root: كيف
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'تعديل في النظم الطبيعية أو البشرية للتلاؤم مع بيئة جديدة أو متغيرة. التكيف هو العملية التي
              يسعى الأفراد والمجتمعات والدول من خلالها للتعامل مع أو للتغلب على عواقب تغير المناخ. ''التكيف ليس هو التأقلم
              أو المواجهة''، فهو يقع في مجال القدرة على تحويل الاستراتيجيات مع تغير الظروف وتطوير النظم التي هي صامدة ومرنة
              بما فيه الكفاية للرد على التغيير. التكيف قد يكون مخططا له أو مستقلا. توجد أنواع مختلفة من التكيف ويمكن تمييز:
              الاستباقي والتفاعلي، وتكيف القطاع الخاص والعام، والتكيف الذاتي والتكيف المخطط له.'
            translation_en: adaptation
            translation_fr: adaptation
            domain: Climate, Environment and Solid Waste management
            external_id: arabterm:70637
