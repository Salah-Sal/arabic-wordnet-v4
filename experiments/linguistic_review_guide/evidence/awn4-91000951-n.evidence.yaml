        pos: verb
        form: I
        is_partial: 1
        definitions_text: 'بالشىءِ: لزمه فلم يبرحه, أو جهل كيف يعمل دهشَ مِنْ حياءٍ, أو خَوْفٍ'
        translation_en: null
        translation_fr: null
        domain: null
        external_id: Al_Mujam_Al_Kabeer:Vol_6:page_0263:0
        dict_key: Al_Mujam_Al_Kabeer
        dict_name_ar: المعجم الكبير
        dict_name_en: Al-Mu'jam Al-Kabir
        dict_source_type: ocr
        dict_period: modern
        dict_author: مجمع اللغة العربية
        dict_death_year: null
        definitions:
        - sense_index: 0
          text: 'بالشىءِ: لزمه فلم يبرحه, أو جهل كيف يعمل'
          is_raw: 0
        - sense_index: 1
          text: دهشَ مِنْ حياءٍ, أو خَوْفٍ
          is_raw: 0
        examples:
        - idx: 0
          type: hadith
          text: 'أَىُّ الرِّقابِ أفْضَلُ؟ قال: أَنْفَسُها عند أهْلِها, وأَكْثَرُها ثَمَنًا قال : قلتُ: فإن لم أَفْعَل؟ قال:
            تُعِين صانِعًا, أو تَصْنَع لأَخْرَقَ'
          attribution: أبو ذر
        - idx: 1
          type: hadith
          text: إِنَّ أبى قُتِلَ يَوْمَ أُحُدٍ, وَتَركَ تِسْعَ بَنَاتٍ كُنَّ لى تِسْعَ أخَواتٍ, فَكَرِهْتُ أن أجْمَعَ إليهنّ
            جارِيةً خَرْقاءَ مِثْلَهُنَّ ...
          attribution: جابر بن عبد الله
        - idx: 2
          type: usage
          text: '... قُولا الحقَّ, وارْحَما اليتيمَ, وأَعِينا الصانعَ, واصْنَعَا للأَخْرَق ...'
          attribution: علي بن أبي طالب
        - idx: 3
          type: proverb
          text: تَحْسَبُها خَرْقاء, وهى صَناعٌ
          attribution: null
        - idx: 4
          type: proverb
          text: خَرْقاءُ وجدَتْ صُوفًا
          attribution: يُضْرَبُ لِلذى يُفْسِدُ مالَه
        - idx: 5
          type: proverb
          text: خَرْقاءُ ذاتُ نِيقَةٍ
          attribution: يُضْرَبُ للجاهل بالأمرِ, ومع ذلك يَدَّعِى المَعْرِفَةَ
        - idx: 6
          type: poetry
          text: صَعْلٌ كَأَنَّ جَنَاحَيْهِ وجَوْجُؤَهُ / بَيْتٌ أَطافَتْ به خَرْقاءُ , مَهْجُومُ
          attribution: علقمة بن عبدة
        - idx: 7
          type: poetry
          text: هُمُ صَنَعُ لجارِهِمُ ولَيْست / يَدُ الخَرْقَاءِ مِثْلَ يَدِ الصَّنَاعِ
          attribution: الحطيئة
        - idx: 8
          type: poetry
          text: خَرْقَاءُ بالخَيْر لا تَهْدِى لِوِجْهَتِه / وهْيَ صَناعُ الأَذَى فى الأَهْلِ والجارِ
          attribution: null
        - idx: 9
          type: poetry
          text: قَطُوفُ المَشْي إِذ تَمْشِى / تَرَى فى مَشْيِها خَرَقَا
          attribution: الأحوص
