      - entry_id: 817472
        dictionary_id: 118
        headword: الكيف
        headword_bare: الكيف
        headword_norm: الكيف
        root: كف
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: 'الكيف: عرض لَا يَقْتَضِي لذاته قسْمَة وَلَا نِسْبَة والقيد الأول احْتِرَاز عَن الْكمّ لاقْتِضَائه
          الْقِسْمَة بِالذَّاتِ وَالثَّانِي عَن الْبَوَاقِي فَإِن الْإِضَافَة كالأبوة تَقْتَضِي النِّسْبَة إِلَى الْأَب وَمَتى
          يَقْتَضِي نِسْبَة حُصُول الشَّيْء فِي الزَّمَان وعَلى هَذَا قِيَاس الْبَوَاقِي. وَإِنَّمَا قُلْنَا لذاته ليدْخل
          فِي الكيف الكيفيات الْمُقْتَضِيَة للْقِسْمَة أَو للنسبة بِوَاسِطَة اقْتِضَاء محلهَا ذَلِك.اعْلَم أَن القدماء رسموا
          الكيف بِأَنَّهُ هَيْئَة قارة لَا تَقْتَضِي قسْمَة وَلَا نِسْبَة لذاتها وَالْمرَاد بالقارة الثَّابِتَة. والمتأخرون
          بِأَنَّهُ عرض لَا يتَوَقَّف تصَوره على تصور غَيره وَلَا يَقْتَضِي الْقِسْمَة واللاقسمة فِي مَحَله اقْتِضَاء أوليا.
          وَلَا يخفى أَن هَذَا التَّعْرِيف أحسن من تَعْرِيف القدماء لِأَن فِي تعريفهم خللا من وُجُوه ثَلَاثَة: الأول: إِن
          فِي لفظ الْهَيْئَة والقارة خَفَاء. وَالثَّانِي: أَنه يخرج الْأَصْوَات لِأَنَّهَا إِمَّا آنِية أَو زمانية فَلَيْسَتْ
          بقارة أَي ثَابِتَة فِي محلهَا مَعَ أَنَّهَا من الكيفيات. وَالثَّالِث: أَنه يرد على تعريفهم أَنه لَيْسَ بمانع لصدقه
          على النقطة والوحدة على قَول من قَالَ إِن كل وَاحِد مِنْهُمَا لَيْسَ من مقولة الكيف. وَقَوْلهمْ لَا يَقْتَضِي قسْمَة
          أَي قبُول الْقِسْمَة الوهمية ليخرج الْكمّ فَإِنَّهُ يَقْتَضِي قبُولهَا. وَقَوْلهمْ اللاقسمة ليخرج الْوحدَة والنقطة
          على الْأَصَح فَإِنَّهُمَا تقتضيان اللاقسمة. وَقَوْلهمْ فِي مَحَله ظرف مُسْتَقر حَال عَن فَاعل لَا يَقْتَضِي وَالْمعْنَى
          لَا يَقْتَضِي الْقِسْمَة واللاقسمة حَال كَونه فِي مَحَله. وَفَائِدَة التَّقْيِيد الْإِشَارَة إِلَى أَن عدم اقْتِضَاء
          الْقِسْمَة واللاقسمة لَيْسَ بِاعْتِبَار التَّصَوُّر بِأَن يكون تصَوره مستلزما لتصور الْقِسْمَة واللاقسمة بل بِاعْتِبَار
          الْوُجُود والألم يخرج الْكمّ لعدم اقتضائه الْقِسْمَة فِي الذِّهْن ضَرُورَة أَن تصَوره لَا يسْتَلْزم تصور الْقِسْمَة
          واللاقسمة وَالْمرَاد بالاقتضاء الأول الِاقْتِضَاء الذاتي وَإِنَّمَا قيد بِهِ ليدْخل الكيف الَّذِي يَقْتَضِي اللاقسمة
          لَكِن لَا لذاته الْعلم الْبَسِيط الْحَقِيقِيّ فَإِنَّهُ يَقْتَضِي اللاانقسام لَكِن لَا لذاته وَلِئَلَّا تخرج الكيفيات
          الْمُقْتَضِيَة للْقِسْمَة بِسَبَب عروضها للكميات كالبياض الْقَائِم بالسطح وَأَنت تعلم أَنه لَا اقْتِضَاء هَا هُنَا
          وَإِنَّمَا هُوَ قبُول الْقِسْمَة بالتبع.والكيفيات أَنْوَاع أَرْبَعَة: الأول: الكيفيات المحسوسة بالحواس الظَّاهِرَة
          وَهِي انفعاليات وانفعالات. وَالثَّانِي: الكيفيات النفسانية وَهِي ملكات وحالات. وَالثَّالِث: الكيفيات المختصة بالكميات
          الْمُتَّصِلَة كالتثليث والتربيع وَغير ذَلِك أَو الْمُنْفَصِلَة كالزوجية والفردية والتساوي وَالزِّيَادَة وَغير ذَلِك.
          وَالرَّابِع: الكيفيات الاستعدادية وَهِي الضعْف وَالْقُوَّة.'
