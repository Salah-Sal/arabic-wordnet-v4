            definitions_text: هو [مكيف هواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=194228) مُزوّد
              بصمام تمدد (مكيف الهواء) ثانٍ موصل معه على التوازي، و[مبخر (مكيف الهواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91018))،
              و[مروحة تدوير الهواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90997). ويقوم بتغطية
