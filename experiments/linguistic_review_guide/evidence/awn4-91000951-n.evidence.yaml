        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: '[بسق] نه فيه: "الباسق" المرتفع في علوه. ومنه: والنخل "بسقت". وح: كيف ترون "بواسقها" أي ما استطال
          من فروعها أي فروع السحاب. وح: من "بواسق" أقحوان. وح: وارجحن بعد "تبسق" أي ثقل ومال بعد ما ارتفع وطال. وح: كيف "بسق"
          أي أبو بكر أصحاب النبي صلى الله عليه وسلم أي كيف ارتفع ذكره دونهم، والبسق علو ذكر الرجل في الفضل. وفي ح الحديبية:
          فأما دعا وإما "بسق" لغة في بزق.'
