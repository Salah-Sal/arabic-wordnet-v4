            بهَا ذَيْلَ القَمِيصِ من قُدّامُ:} كِيفةٌ وَمَا كانَ مِنْ خَلْفُ فحِيفَةٌ عَن أَبي عَمْرٍ و، وَقد ذُكِرَ فِي مَوْضِعهِ.
            وَقَالَ الفَرّاءُ: يقالُ: كَيْفَ لِي بفلانٍ: فَتَقول: كُلُّ {الكَيْفِ،} والكَيْفَ، بالجَرِّ والنَّصبْ. وحِصْنُ
            {كِيفى، كضِيزَى: قَلْعَةٌ حَصِينَةٌ شاهِقَةٌ بينَ آمِدَ وجَزِيرَةِ ابنِ عُمَرَ وَفِي تَارِيخ ابْن خِلِّكان: بَيْنَ
            مَيّافارِقِينَ وجَزِيرةِ ابنِ عُمَرَ. قلتُ: والنِّسْبَةُ إِلَيْهِ: الحَصْكَفِيُّ. وَقَالَ اللِّحْيانِيّ: كَوَّفَ
            الأَدِيمَ} وكَيَّفَهُ: إِذا قَطَعَه من الكَيْفِ، {والكَوْفِ. وقولُ المُتَكَلِّمِينَ فِي اشْتِقاقِ الفِعْلِ من
            كَيْفَ:} كَيَّفْتُه، {فتَكَيَّفَ فإِنَّه قِياسٌ لَا سَماعَ فِيه، من العَرب، ونَصُّ اللِّحْيانِيّ: فأَمّا قَوْلَهم:
            كَيَّفَ الشيءَ)فكلامٌ مُوَلَّدٌ. قلتُ: فَعَتى بالقِياسِ هُنَا التَّوْلِيدَ، قَالَ شيخُنا: أَو أَنَّها مَوَلَّدَةٌ،
            وَلَكِن أَجْرَوْهَا على قِياسِ كلامِ العَرَب. قلتُ: وَفِيه تَأَمُّلٌ. قَالَ ابنُ عَبّادٍ:} وانْكافَ: انْقَطَعَ
            فَهُوَ مُطاوعُ {كافَه} كَيفاً. قَالَ: {وتَكَيَّفَه أَي الشيءَ: إِذا تَنَقَّصَه، كتَحَيَّفَه. وأَمّا قولُ شَيْخِنا:
            ويَنْبَغِي أَن يَزِيدَ قوَلَهم:} الكَيْفِيَّةُ أيْضاً، فإِنَّها لَا تكادُ تُوجَدُ فِي الكلامِ العَربِيِّ. قلتُ:
            نَعَمْ قد ذكَرَه الزَّجّاجُ، فقالَ: {والكَيْفِيَّةُ: مصدَرُ كَيْفَ، فتأَمَّل.'
          is_raw: 1
