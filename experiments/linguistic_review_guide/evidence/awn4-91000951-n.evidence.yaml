            headword_norm: كفاءات اساسية
            root: كف
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: المهارات الأساسية والقدرات والمعرفة المستخدمة للتفوق في مسعى معين. الشركات تميل إلى التركيز
              على كفاءاتها الأساسية في محاولة للاستفادة من 'ما هو جيد فيها.' في كثير من الأحيان، تكون الكفاءات الأساسية غير
              معترف بها أو قد لا تظهر داخل المنظمة التي تركز كثيرا على الأسواق والمنتجات والخدمات وليس على المهارات، المعرفة
              والخبرة المتوفرة. على سبيل المثال، يمكن أن تشمل الكفاءات الأساسية لمتاجر التجزئة الكبيرة خدمات الشحن والنقل،
              وإدارة العقارات، والتدريبات وكذلك تجربة البيع بالتجزئة الخاصة بهم.
