      dictionary_id: 94
      headword: |
        (1) «أ» ينسخ. «ب» ينقل؛ يحوِّل: ينقل من شكل من أشكال التدوين إلى آخر [كأن ينقل مادَّةً مختزلة أو مسجَّلة إلى الكتابة العاديّة]. «ج» يدوِّن؛ يُسجِّل
        (2) «أ» يكتب صوتيًّا؛ يمثِّل برموز صوتية (ل). «ب» يترجم. «ج» ينسخ: يغيّر نظامَ حفظِ المعلومات وتخزينِها (كم). «د» يسجِّل برنامجًا لإعادة بثِّه لاحقًا
        (3) «أ» يكتب قطعةً موسيقية. «ب» يكيِّف لحنًا [بحيث يلائم آلةً لم يُجْعَل لها في الأصل].
      headword_bare: |-
