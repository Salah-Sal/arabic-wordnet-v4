            السُّؤَالُ عَنْ صِحَّتِهِ وَسُقْمِهِ وَعُسْرِهِ وَيُسْرِهِ وَغَيْرِ ذَلِكَ وَتَأْتِي لِلتَّعَجُّبِ وَالتَّوْبِيخِ
            وَالْإِنْكَارِ وَلِلْحَالِ لَيْسَ مَعَهُ سُؤَالٌ وَقَدْ تَتَضَمَّنُ مَعْنَى النَّفْيِ وَكَيْفِيَّةُ الشَّيْءِ
            حَالُهُ وَصِفَتُهُ.'
          is_raw: 1
      - entry_id: 795453
        headword: كيف
        dict_key: hawramani_18
        dict_name_en: Al-Sharīf al-Jurjānī, Kitāb al-Taʿrīfāt (d. 1413 CE)
        dict_name_ar: كتاب التعريفات للشريف الجرجاني
        dict_source_type: hawramani
        dict_period: classical
        dict_death_year: 1413
        dict_author: null
        senses:
        - sense_index: 0
          text: |-
            الكيف: هيئة قارة في الشيء لا يقتضي قسمة ولا نسبة لذاته، فقوله: "هيئة" يشمل الأعراض كلها. وقوله: "قارة في الشيء" احتراز عن الهيئة الغير القارة، كالحركة والزمان والفعل والانفعال، وقوله: "لا يقتضي قسمة" يُخرِج الكم، وقوله: "ولا نسبة" يخرج باقي الأعراض النسبية، وقوله: "لذاته" ليدخل فيه الكيفيات المقتضية أو النسبة بواسطة اقتضاء محلها بذاك، وهي أربعة أنواع: الأول الكيفيات المحسوسة، فهي إما راسخة، كحلاوة العسل، وملوحة ماء البحر، وتسمى: انفعاليات، وإما غير راسخة، كحمرة الخجل، وصفرة الوجَل، وتسمى: انفعالات؛ لكونها أسبابًا لانفعالات النفس، وتسمى الحركة فيه: استحالة، كما يتسود العنب، ويتسخن الماء. والثانية: الكيفيات النفسانية، وهي أيضًا إما راسخة، كصناعة الكتابة للمتدرب فيها، وتسمى: ملكات، أو غير راسخة، كالكتابة لغير المتدرب، وتسمى حالات. والثالثة: الكيفيات المختصة بالكميات، وهي إما أن تكون مختصة بالكميات المتصلة، كالتثليث، والتربيع، والاستقامة، والانحناء، أو المنفصلة، كالزوجية والفردية.
            والرابعة: الكيفيات الاستعدادية، وهي إما أن تكون استعدادًا، نحو القبول، كاللين والمراضية، ويسمى ضعفًا ولا قوة، أو نحو اللاقبول كالصلابة، والصحابية، ويسمى: قوة.
          is_raw: 1
      - entry_id: 801199
        headword: الكَيْفُ
        dict_key: hawramani_19
        dict_name_en: Firuzabadi, al-Qāmūs al-Muḥīṭ (d. 1414 CE)
        dict_name_ar: القاموس المحيط للفيروزآبادي
        dict_source_type: hawramani
        dict_period: classical
        dict_death_year: 1414
        dict_author: null
        senses:
        - sense_index: 0
          text: 'الكَيْفُ: القَطْعُ.وكَيْفَ ويقالُ: كَيْ: اسمٌ مُبْهَمٌ، غيرُ مُتَمَكِّنٍ، حُرِّكَ آخِرهُ للساكنَيْنِ، وبالفتح
            لمَكانِ الياءِ، والغالبُ فيه أن يكونَ اسْتِفْهاماً إمّا حَقيقياً:ككيْفَ زيدٌ، أو غيرَه:{كيفَ تَكْفُرونَ باللهِ}
            ، فإنه أُخْرِجَ مَخْرَجَ التَّعَجُّبِ، و:كيفَ يَرْجُونَ سِقاطِي بعدَما ... جَلَّلَ الرأسَ مَشيبٌ وصَلَعْفإنه أُخْرِجَ
            مُخْرَجَ النَّفْيِ، ويَقَعُ خَبَراً قَبْلَ ما لا يَسْتَغْني عنه:ككَيْفَ أنتَ، وكيفَ كنتَ،وحالاً: قَبْلَ ما يَسْتَغْنِي
            عنه: ككَيْفَ جاءَ زيدٌ، ومَفعولاً مُطْلَقاً:{كيفَ فَعَلَ رَبُّكَ}{فكيفَ إذا جِئْنا من كلِّ أُمَّةٍ بشَهيدٍ} ،
            ويُسْتَعْمَلُ شَرْطاً، فَيَقْتضِي فِعْلَيْنِ مُتَّفِقَيِ اللفظِ والمعنَى، غيرَ مَجْزومَيْنِ:ككيْفَ تَصْنَعُ أصْنَعُ،
            لا كيفَ تَجْلِسُ أذْهَبُ.سِيبَوَيْهِ: كيفَ: ظَرْفٌ.الأخْفَشُ: لا يَجوزُ ذلك.ابنُ مالكٍ: صَدَقَ، إذ ليسَ زَماناً
            ولا مكَاناً، نعم لمَّا كان يُفَسَّرُ بقَوْلِكَ على أيِّ حالٍ، لكونِه سُؤالاً عن الأحوال، سُمِّيَ ظَرْفاً مَجازاً،
            ولا تكونُ عاطِفَةً كما زَعَمَ بعضُهم مُحْتَجّاً بقوله:إذا قَلَّ مالُ المَرْءِ لانَتْ قَناتُه ... وهانَ على الأَدْنَى
            فكيفَ الأَباعِدِلاقْترانِهِ بالفاءِ، ولأَنَّهُ هُنا اسمٌ مَرْفوعُ المَحَلِّ على الخَبَرِيَّة.والكِيفَةُ، بالكسرِ:
            الكِسْفَةُ من الثوبِ، والخِرْقَةُ تَرْقَعُ ذَيْلَ القَميصِ من قُدَّامُ، وما كان من خَلْفُ: فَحِيفَةٌ، ويقالُ:
            كيفَ لِي بِفُلانٍ؟ فتقولُ: كلُّ الكَيْفِ، والكَيْفَ، بالجَرِّ والنَّصْبِ.وحِصْنُ كِيفَى، كضِيزَى: بين آمِدَ وجَزيرَةِ
            ابنِ عُمَرَ.وكَيَّفَه: قَطَعَه. وقولُ المُتَكَلِّمِينَ:كَيَّفْتُهُ فَتَكَيَّفَ: قياسٌ لا سَماعَ فيه.وانْكافَ:
            انْقَطَعَ.وتكَيَّفَهُ: تَنَقَّصَه.'
