      - entry_id: 801199
        dictionary_id: 113
        headword: الكَيْفُ
        headword_bare: الكيف
        headword_norm: الكيف
        root: كف
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: 'الكَيْفُ: القَطْعُ.وكَيْفَ ويقالُ: كَيْ: اسمٌ مُبْهَمٌ، غيرُ مُتَمَكِّنٍ، حُرِّكَ آخِرهُ للساكنَيْنِ،
          وبالفتح لمَكانِ الياءِ، والغالبُ فيه أن يكونَ اسْتِفْهاماً إمّا حَقيقياً:ككيْفَ زيدٌ، أو غيرَه:{كيفَ تَكْفُرونَ
          باللهِ} ، فإنه أُخْرِجَ مَخْرَجَ التَّعَجُّبِ، و:كيفَ يَرْجُونَ سِقاطِي بعدَما ... جَلَّلَ الرأسَ مَشيبٌ وصَلَعْفإنه
          أُخْرِجَ مُخْرَجَ النَّفْيِ، ويَقَعُ خَبَراً قَبْلَ ما لا يَسْتَغْني عنه:ككَيْفَ أنتَ، وكيفَ كنتَ،وحالاً: قَبْلَ
          ما يَسْتَغْنِي عنه: ككَيْفَ جاءَ زيدٌ، ومَفعولاً مُطْلَقاً:{كيفَ فَعَلَ رَبُّكَ}{فكيفَ إذا جِئْنا من كلِّ أُمَّةٍ
          بشَهيدٍ} ، ويُسْتَعْمَلُ شَرْطاً، فَيَقْتضِي فِعْلَيْنِ مُتَّفِقَيِ اللفظِ والمعنَى، غيرَ مَجْزومَيْنِ:ككيْفَ تَصْنَعُ
          أصْنَعُ، لا كيفَ تَجْلِسُ أذْهَبُ.سِيبَوَيْهِ: كيفَ: ظَرْفٌ.الأخْفَشُ: لا يَجوزُ ذلك.ابنُ مالكٍ: صَدَقَ، إذ ليسَ
          زَماناً ولا مكَاناً، نعم لمَّا كان يُفَسَّرُ بقَوْلِكَ على أيِّ حالٍ، لكونِه سُؤالاً عن الأحوال، سُمِّيَ ظَرْفاً
          مَجازاً، ولا تكونُ عاطِفَةً كما زَعَمَ بعضُهم مُحْتَجّاً بقوله:إذا قَلَّ مالُ المَرْءِ لانَتْ قَناتُه ... وهانَ
          على الأَدْنَى فكيفَ الأَباعِدِلاقْترانِهِ بالفاءِ، ولأَنَّهُ هُنا اسمٌ مَرْفوعُ المَحَلِّ على الخَبَرِيَّة.والكِيفَةُ،
          بالكسرِ: الكِسْفَةُ من الثوبِ، والخِرْقَةُ تَرْقَعُ ذَيْلَ القَميصِ من قُدَّامُ، وما كان من خَلْفُ: فَحِيفَةٌ، ويقالُ:
          كيفَ لِي بِفُلانٍ؟ فتقولُ: كلُّ الكَيْفِ، والكَيْفَ، بالجَرِّ والنَّصْبِ.وحِصْنُ كِيفَى، كضِيزَى: بين آمِدَ وجَزيرَةِ
          ابنِ عُمَرَ.وكَيَّفَه: قَطَعَه. وقولُ المُتَكَلِّمِينَ:كَيَّفْتُهُ فَتَكَيَّفَ: قياسٌ لا سَماعَ فيه.وانْكافَ: انْقَطَعَ.وتكَيَّفَهُ:
          تَنَقَّصَه.'
