        (2) «أ» يكتب صوتيا؛ يمثل برموز صوتية (ل). «ب» يترجم. «ج» ينسخ: يغير نظام حفظ المعلومات وتخزينها (كم). «د» يسجل برنامجا لإعادة بثه لاحقا
        (3) «أ» يكتب قطعة موسيقية. «ب» يكيف لحنا [بحيث يلائم آلة لم يجعل لها في الأصل].
      headword_norm: |-
