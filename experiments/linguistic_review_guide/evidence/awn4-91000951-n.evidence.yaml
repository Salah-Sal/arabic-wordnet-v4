          - entry_id: 375199
            dictionary_id: 52
            headword: مكيف الهواء المزود بخانق
            headword_bare: مكيف الهواء المزود بخانق
            headword_norm: مكيف الهواء المزود بخانق
            root: كف
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'مكيف هواء تعمل فيه دورة التبريد بنفس الكيفية التي تعمل بها في مُكيّفات الهواء الأخرى، إلا أنه
              يختلف عن [مكيف الهواء المزود بصمام تمدد](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90894)
              من حيث الآتي: -تتم تذرية وسيط التبريد بواسطة [الخانق (مكيف الهواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90920))
              بدلاً من [صمام التمدّد (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90947)
              - يبلغ ضغط الجهاز أثناء التشغيل حوالي 20 بار (حوالي 14 بار في مكيفات الهواء الأخرى) على جانب الضغط العالي، وحوالي
              1.5 بار (حوالي 1.2 بار في مكيفات الهواء الأخرى) على جانب الضغط المنخفض، وترتفع درجة الحرارة بفعل الانضغّاط لتصل
              إلى حوالي 70 º س (حوالي 55 º س في مكيفات الهواء الأخرى) - يحلّ [خزان لاقف (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90922)
              موجود على جانب الضغط المنخفض محلّ خزان وسيط التبريد الموجود على جانب الضغط العالي - ولمُراقبة ظروف الضغط يمكن
              تجهيز مُكيّف الهواء المُزود بخانق [بمفتاح للضغط العالي (مكيف الهواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90966))،
              و[مفتاح للضغط المنخفض (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90970).
              أمّا بالنسبة لكافة المكوّنات الأخرى فهي تكاد تكون مُتطابقة في نوعي مُكيّف الهواء المزود بصمام تمدد والمزود بخانق.'
            translation_en: air conditioner with choke
            translation_fr: climatiseur avec étrangleur [m.]
            domain: Automotive Engineering
            external_id: arabterm:90893
