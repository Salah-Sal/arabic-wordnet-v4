      - entry_id: 812322
        dictionary_id: 116
        headword: هزل
        headword_bare: هزل
        headword_norm: هزل
        root: هزل
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: '[هزل] نه: فيه: كان تحت "الهيزلة"، قيل: هي الراية لأن الريح تلعب بها كأنها تهزل معها، والهزل واللعب
          من واد واحد، وياؤه زائدة. وفي ح أهل خيبر: إنما كانت "هزيلة" من أبي القاسم، مصغر هزلة مرة الهزل ضد الجد. ط: أي كانت
          هذه الكلمة منه كلمة "هزل" ومزاح، قوله: وعاملنا، أي جعلنا عاملين على أرض خيبر بالمساقاة، كيف بك- أي كيف يكون حالك،
          أو كيف تراك، والباء زائدة في المفعول به. وفيه: ليس"بهزل"، أي جد كله ليس فيه ما يخلو عن تحقيق. نه: وفيه: فأذهبنا
          الأموال و"أهزلنا" الذراري والعيال، أي أضعفنا، وهي لغة في هزل وليست بعالية، يقال: هزلت الدابة هزالا، وهزلتها هزلا،
          وأهزل القوم - إذا أصابت مواشيهم سنة فهُزلتن والهزال ضد السمن. ن: لا يستطيعون أن يطوفوا بالبيت من "الهزل" - بضم هاء
          وسون زاي، وصوابه: هزال - بزيادة ألف.'
        translation_en: null
        translation_fr: null
        domain: null
        external_id: haw:21:4320
