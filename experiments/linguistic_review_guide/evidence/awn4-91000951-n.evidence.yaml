          - entry_id: 375208
            dictionary_id: 52
            headword: مكيف الهواء غير المحكوم يدوياً
            headword_bare: مكيف الهواء غير المحكوم يدويا
            headword_norm: مكيف الهواء غير المحكوم يدويا
            root: كف
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'هو جهاز تبريد بالضغط مُخصص لمقصورة الركاب في السيارة، وفيه يدور وسيط التبريد في [دورة تبريد](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=98448)
              مُغلقة. وأثناء دورانه تتبدل حالته ما بين السائلة والغازية بشكل مُستمر. ويتعرّض وسيط التبريد: - للضغط وصولاً
              إلى الحالة الغازية (انظر: [الضغّاط (مكيف الهواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90924)))،
              - التكثيف بفعل فقدان الحرارة (انظر: المكثف (مكيف الهواء)، خزان وسيط التبريد المُزوّد بمُجفّف (مكيف الهواء))،
              - التبخير بفعل انخفاض الضغط عند الامتصاص الحراري (انظر: صمام التمدّد، [المبخر (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91018)).
              ويقوم كل من [صمام تصريف الضغط الزائد (مكيف الهواء)](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90976)،
              ومفتاح الضغط العالي (مكيف الهواء) بتأمين المُكيّف من التعرّض لضغط مُفرط. كما تُتيح وصلات الخدمة الموجودة على
              جانبي الضغط العالي والضغط المنخفض إمكانية تفريغ المُكيف وإعادة شحنه. ويُعتبر مكيف الهواء غير المحكوم يدوياً
              بنية تصميمية أساسية. ويتم تشغيله وإيقاف عمله يدوياً، ولا يعمل مُطلقاً إلا عندما تكون [مروحة الهواء الجديد](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90952)
              مُشغّلة. وفيه يكون الضغّاط غير محكوم و يعمل دائماً مع المُكيّف. ويقوم السائق بالتحكم في درجة الحرارة من خلال
              التشغيل والإيقاف اليدوي للمُكيّف، (انظر: نظام التحكم اليدوي في درجة الحرارة (مكيف الهواء))'
            translation_en: air conditioning, not manually adjusted
            translation_fr: climatiseur sans régulation manuelle [m.]
            domain: Automotive Engineering
            external_id: arabterm:90902
