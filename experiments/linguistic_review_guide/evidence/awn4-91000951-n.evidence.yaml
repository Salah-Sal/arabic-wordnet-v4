        definitions_text: 'ك ي ف: (كَيْفَ) اسْمٌ مُبْهَمٌ غَيْرُ مُتَمَكِّنٍ وَإِنَّمَا حُرِّكَ آخِرُهُ لِالْتِقَاءِ السَّاكِنَيْنِ
          وَبُنِيَ عَلَى الْفَتْحِ دُونَ الْكَسْرِ لِمَكَانِ الْيَاءِ. وَهُوَ لِلِاسْتِفْهَامِ عَنِ الْأَحْوَالِ. وَقَدْ يَقَعُ
          بِمَعْنَى التَّعَجُّبِ كَقَوْلِهِ تَعَالَى: {كَيْفَ تَكْفُرُونَ بِاللَّهِ} [البقرة: 28] . وَإِذَا ضُمَّ إِلَيْهِ
          (مَا) صَحَّ أَنْ يُجَازَى بِهِ تَقُولُ: كَيْفَمَا تَفْعَلْ أَفْعَلْ.'
