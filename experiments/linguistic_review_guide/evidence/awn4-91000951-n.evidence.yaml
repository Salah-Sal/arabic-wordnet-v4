        dict_author: null
        dict_death_year: 1578
        definitions:
        - sense_index: 0
          text: '[هزل] نه: فيه: كان تحت "الهيزلة"، قيل: هي الراية لأن الريح تلعب بها كأنها تهزل معها، والهزل واللعب من واد
            واحد، وياؤه زائدة. وفي ح أهل خيبر: إنما كانت "هزيلة" من أبي القاسم، مصغر هزلة مرة الهزل ضد الجد. ط: أي كانت هذه
            الكلمة منه كلمة "هزل" ومزاح، قوله: وعاملنا، أي جعلنا عاملين على أرض خيبر بالمساقاة، كيف بك- أي كيف يكون حالك،
            أو كيف تراك، والباء زائدة في المفعول به. وفيه: ليس"بهزل"، أي جد كله ليس فيه ما يخلو عن تحقيق. نه: وفيه: فأذهبنا
            الأموال و"أهزلنا" الذراري والعيال، أي أضعفنا، وهي لغة في هزل وليست بعالية، يقال: هزلت الدابة هزالا، وهزلتها هزلا،
            وأهزل القوم - إذا أصابت مواشيهم سنة فهُزلتن والهزال ضد السمن. ن: لا يستطيعون أن يطوفوا بالبيت من "الهزل" - بضم
            هاء وسون زاي، وصوابه: هزال - بزيادة ألف.'
