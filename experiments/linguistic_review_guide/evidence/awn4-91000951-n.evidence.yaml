          text: 'كيف{الكَيْفُ: القطْعُ وَقد} كافَه {يَكِيفُه، وَمِنْه:} كَيَّفَ الأَدِيمَ {تَكْيِيفاً: إِذا قَطَعه.} وكَيْفَ،
            ويُقال: كَيْ بحَذْفِ فإئه، كَمَا قالُوا فِي سَوْفَ: سَوْ، وَمِنْه قولُ الشاعرِ:(كَيْ تَجْنَحُونَ إِلَى سَلْمِ
            ومأثُئِرَتْ ... قَتْلاكُمُ، ولَظَى الهَيْجاءِ تَضْطَرِمُ)كَمَا فِي البَصائِرِ، قَالَ الجَوهرِيُّ: اسمٌ مُبْهَمٌ
            غيرُ مُتَمَكِّنٍ وإِنّما حُرِّكَ آخِرُه للسّاكِنَيْنِ، وبُنِي بالفَتْحِ دونَ الكُسْرِ لمَكانِ الياءِ كمَا فِي
            الصِّحاحِ، وَقَالَ الأَزْهرِيُّ: {كَيْفَ: حرفُ أَداةٍ، ونُصِبَ الفاءُ فِراراً بِهِ من الياءِ الساكنةِ فهيا، لئلاّ
            يَلْتَقِي ساكنانِ. والغالبُ فِيهِ أَنْ يَكُونَ اسْتِفهاماً عَن الأَحْوالِ إِما حَقِيقِيّاً،} ككَيْفَ زَيْدٌ أَو
            غَيْرَهُ مثل: كَيْفَ تَكْفُرُونَ باللهِ فإنَّهُ أُخْرِج مُخْرَجَ التَّعَجُّبِ والتّوْبِيخِ، وقالَ الزَّجاجُ: كيفَ
            هُنا: اسْتِفْهامٌ فِي معنَى التَّعَجُّبِ، وَهَذَا التَّعَجُّبُ إِنّما هُوَ للخَلْق وللمُؤْمِنِينَ، أَي اعْجَبُوا
            من هؤُلاءِ كيفَ يَكْفُرُونَ بالهِ وَقد ثَبَتَتْ حُجَّةُ اللهِ عَلَيْهِم وكذلِكَ قولُ سُوَيْدِ بنِ أَبي كاهِلٍ
            اليَشْكُرِيِّ:(كيفَ يَرْجُونَ سِقاطِي بَعْدَما ... جَلَّلَ الرّأْسَ مَشِيبٌ وصَلَعْ) فإِنّه أُخْرِجَ مُخْرَجَ
            النَّفْيِ أَي: لَا تَرْجُوا مِنِّي ذلِك. ويَقَعُ خَبَراً قَبْلَ مَا لَا يَسْتَغْنِي عَنْه، كَكَيْفَ أَنْتَ وكَيْفَ
            كُنْتَ. ويَكُونُ حَالا لَا سُؤالَ مَعَه، كقَوْلِكَ: لأُكْرِمَنَّكَ كَيْفَ كُنْتَ، أَي: عَلى أَيِّ حالٍ كُنْتَ،
            وَحَالا قَبْلَ مَا يَسْتَغْنِي عَنْهُ، ككَيْفَ جاءَ زَيْدٌ. ويَقَعُ مَفْعولاً مُطْلَقاً مثل: كَيْفَ فَعَل رَبُّكَ.
            وأَما قَوْلُه تَعَالَى: {فكَيْفَ إِذا جِئْنَا مِنْ كُلّش أُمَّةٍ بشَهِيدٍ فَهُوَ تَوْكِيدٌ لِما تَقَدَّمَ من خَبَرٍ،
            وتَحْقِيقٌ لما بعَده، على تَأْوِيلِ إِنَّ الله لَا يَظْرِمُ مِثْقالَ ذَرَّةٍ فِي الدُّنْيا، فكَيْفَ فِي الآخِرَةِ
            وقِيلَ: كيفَ يُسْتَعْمَلُ على وَجْهَيْنِ: أَحَدُهما: أَن يكونَ شَرْطاً، فيَقْتَضِي فعْلَيْنِ مُتَّفِقَي اللَّفْظِ
            والمَعْنَى، غيرَ مَجْزُومَيْنِ، ككَيْفَ تَصْنَعُ أَصْنَعُ وَلَا يَجوزُ كَيْفَ تَجْلِسُ أَذْهَبُ باتِّفاقٍ. وَالثَّانِي:
            وَهُوَ الغالِبُ أَنْ يكونَ اسْتِفْهاماً، وَقد ذَكَرَه المُصَنِّفُ قَرِيباً. وَفِي الارْتِشاف: كَيْفَ: يكونُ اسْتِفْهاماً،
            وَهِي لتَعْمِيم الأَحْوالِ، وإِذا تَعَلَّقَت بجُمْلَتَيْنِ، فقالُوا: يكونُ للمُجازاةِ من حَيْثُ المَعْنَى لَا
            مِنْ حَيْثُ العَمَل، وقَصُرت عَن أَدوات الشَّرْطِ بكَوْنِها لَا يَكُونُ الفِعلانِ مَعَها إِلَّا مُتَّفِقَيْنِ
            نَحْو: كيفَ تَجْلِسُ أَجلِسُ. وقالَ شَيْخُنا: كَيْفَ: إِنما تُسْتَعْمَلُ شَرْطاً عِنْد الكُوفِيِّينَ، وَلم يَذْكُرُوا
            لَهَا مِثالاً، واشْتَرَطُوا لَهَا مَعَ مَا ذَكَر المُصنِّفُ أَن يَقْتَرِنَ بهَا مَا فيُقالُ:} كَيْفَما، وأَمّا
            مُجَرَّدةً فَلم يَقُل أَحَدٌ بشَرْطِيَّتها، وَمن قَالَ بشَرْطِيَّتِها وهم الكُوفِيُّون يَجْزِمُونَ بهَا، كَمَا
            فِي مبادِئ العَرَبِيَّة، فَفِي كلامِ)المُصَنِّفِ نَظَرٌ من وَجُوهٍ. قلتُ: وَهَذَا الَّذِي أَشارَ لَهُ شيْخُنا
            فقد ذَكَره الجوهريُّ حيثُ قَالَ: وإِذا ضَممْتَ إِلَيْهِ مَا صَحَّ أَن يُجازَى بِهِ تَقُولُ: كَيْفَما تَفْعَلُ
            أَفْعَلْ. وَقَالَ ابنُ بَرِّيّ: لَا يُجازَى {بكَيْفَ، وَلَا} بَكَيْفما عندَ البَصْرِيِّينَ، ومِنَ الكُوفِيِّينَ
            من يُجازِي بكَيْفَما، فتَأَمَّلْ هَذَا مَعَ كلامِ شَيْخِنا. وَقَالَ سِيبَوَيْهِ: إِنَّ كَيْفَ: ظَرْفٌ. وَعَن السِّيرافِيّ،
            والأَخْفَش: لَا يَجُوزُ ذلِك أَي، أَنَّها اسمٌ غيرُ ظَرْفٍ.ورَتَّبُوا على هَذَا الخِلافِ أُموراً: أَحْدُها: أَنَّ
            موضِعَها عندَ سِيبَوَيْهِ نَصْبٌ، وعندَهُما رَفْعٌ من المُبْتَدإِ، نَصْبٌ مَعَ غيرِه. الثَّانِي: أَنَّ تَقْدِيرَها
            عندَ سِيَبَويْهِ فِي أَيِّ حالٍ، أَو عَلى أَيِّ حالٍ، وعِنْدَهُما تَقْدِيرُها فِي نَحْو: كَيْفَ زَيْدٌ أَصَحِيحٌ،
            ونحوُه، وَفِي نَحْو: كَيْفَ جاءَ زَيْدٌ راكِباً جاءَ زَيْدٌ، ونَحْوه. الثَّالِث: أَنَّ الجَوابَ المُطابِقَ عندَ
            سِيبَوَيْه: على خَيْرٍ، ونَحْوه، وعندَهُما: صَحِيحٌ، أَو سَقِيمٌ، وَنَحْوه. وَقَالَ ابنُ مالِكٍ: صَدَقَ الأَخْفَشُ
            والسِّيرافِيُّ، لم يَقُلْ أَحَدٌ إِنَّ كَيْفَ ظَرْفٌ، إِذ لَيْسَ زَماناً وَلَا مَكاناً، ونَعَم لمّا كانَ يُفَسَّرُ
            بقَوْلِكَ: على أَيِّ حالٍ لكَوْنِه سُؤالاً الأَحْوالِ العَامَّةِ سُمِّيَ ظَرْفاً لأَنَّها فِي تَأْوِيلِ الجارَّ
            والمَجْرُورِ، واسمُ الظَّرْفِ يُطْلَقُ عَلَيْهما مَجازاً. وَفِي الارتِشافِ: سِيبَوَيْهِ يَقُول: يُجازَى بكَيْفَ،
            والخَلِيلُ يَقُول: الجَزاءُ بهِ مُسْتَكْرَةٌ، وَقَالَ الزَّجاجُ: وكُلُّ مَا أَخْبر الله تَعَالَى عَن نَفْسِه بلَفْظِ
            كيفَ، فَهُوَ اسْتِخبارٌ على طَرِيقِ التَّنْبِيهِ للمُخاطَبِ، أَو تَوْبِيخٌ، كَمَا تَقَدَّمَ فِي الآيةِ. قالَ ابنُ
            مالِكٍ: وَلَا تَكُونُ عاطِفَةً كَمَا زَعَمَ بعضُهم مُحْتَجّاً بقَوْلِه أَي الشَّاعِر:(إِذا قَلَّ مالُ المَرْءِ
            لانَتْ قَناتُه ... وهانَ على الأَدْنَى فكَيْفَ الأَباعِدِ)لاقْتِرانِه بالفاءِ وَصُّ ابنِ مالكٍ: ودُخُولُ الفاءِ
            عَلَيْهَا يَزِيدُ خَطَأَه وُضُوحاً ولأَنَّه هُنا اسمٌ مَرْفُوعُ المَحَلِّ عَلى الخَبَرِيَّةِ. ثمَّ إِنَّ المصنِّفَ
