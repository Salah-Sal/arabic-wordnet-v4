              أو المتوقعة لهذا التغير. فهم كيف يمكن للأفراد والجماعات والنظم الطبيعية أن تستعد للتغيرات المناخية وكيفية استجابتها
              عامل حاسم في الحد من الهشاشة إزاء تغير المناخ وهذا ما يعرف بالتكيف. يطبق أيضا مفهوم أوسع للتكيف أيضا في حالتي
