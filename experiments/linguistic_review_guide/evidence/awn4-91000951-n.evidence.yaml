      - entry_id: 767046
        dictionary_id: 103
        headword: اندرم
        headword_bare: اندرم
        headword_norm: اندرم
        root: null
        root_source: null
        pos: null
        form: null
        is_partial: 0
        definitions_text: "اندرم: النهاية لابن الأثير في حديث عبد الرحمن بن يزيد وسُئل كيف\nنُسَلِّم \n(* قوله «كيف نسلم»\
          \ هكذا في الأصل بالنون مبنياً للفاعل، وفي نسخ\nالنهاية: كيف يسلم، بالياء وبناء الفعل للمفعول). على أهل الذِّمَّة؟\
          \ فقال:\nقُلْ أَنْدَرَايَمْ؛ قال أَبو عبيد: هي كلمة فارسية مَعْناها أَأَدْخُل،\nولم يُرِدْ أَن يَخُصَّهم بالاسْتِئذان\
          \ بالفارِسِيَّة، ولكنهم كانوا\nمَجوساً فأَمَره أَن يُخاطِبَهم بِلِسانِهم، قال: والذي يُراد منه أَنه لم\nيَذْكُر\
          \ السَّلامَ قَبْل الاسْتِئذان، ألا تَرَى أَنه لم يَقُلْ عليكم \"أَنْدَرَايَمْ\"؟"
