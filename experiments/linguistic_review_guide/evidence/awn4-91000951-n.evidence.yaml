          - entry_id: 714916
            dictionary_id: 94
            headword: "(1) كِفّة الميزان\n(2) قوس الميزان [الذي تتدلّى من جانبَيْه كِفّتا الميزان]\n(3) ميزان\n(4) يَزِن [شيئًا\
              \ بميزان]\n(5) يَزِنُ: يبلغ وزنُهُ كذا (تتبعها in عادةً).\nto hold the scales even : يحكم بالعدل والقسطاس.to\
              \ turn the scale(s) : يَحْسُم الأمرَ أو الموقفَ.to turn the scale(s) at : يَزِن [الشيءُ] كذا رِطلًا؛ يبلغ وزنُهُ\
              \ كذا... (ع).to remove the scales from her eyes : يزيل الغشاوة عن عينيها، بوصفها امرأة مخدوعةً، بحيث ترى الأشياء\
              \ على حقيقتها.to scale down : يَخفض [الأسعارَ إلخ] بنسبة معَيّنة.to scale up : يرفع [الأسعارَ إلخ] بنسبة معيّنة.(1)\
              \ السَّفَطة؛ الحَرْشفة: إحدى القشور على جلد السّمك (2) الرقيقة: صفيحة صغيرة رقيقة كالحرشفة scales of mica (3)\
              \ «أ» قشرة. «ب» قشرة جافّة [كالتي يطرحها الجلد المصاب بمرض ما] (4) «أ» الصفيحة: إحدى صفائح الدرع. «ب» دِرْع\
              \ مصفَّحة (5) «أ» القِرْمِزيّة (را. scale insect). «ب» التّقَرْمُز: مرضٌ تسبّبه الحشرة القِرمزِيّة (6) يَسْفُط:\
              \ .أ» يَنزع حراشفَ السمك. .ب» يَقْشُر على صورة رقائق (7) يُحَرْشِف: يكسو بقشور أو حراشف (8) «أ», يتقشّر: «ب»\
              \ ينفصل إلى رقائق. «ج» يَطْرح [الجلدُ] قشورًا (9) يتحرشف: يكتسي بقشور. (1) سُلَّم (ا.م) (2) السُّلَّم الموسيقيّ\
              \ (3) «أ» مقياس مُدرّج. «ب» مقياس الرسم [في خريطة]. «ج» مِسْطرة مدرَّجة. «د» نظام دَرَجيّ (4) النسبة المِقياسيّة\
              \ [بين أبعاد الرسم وأبعاد أصله] (5) الروائز المدرَّجة: سلسلة من اختبارات الذكاء إلخ المدرَّجة (6) يتسلّق to\
              \ scale a wall (7) يُدَرِّج: يُنَظِّم في سلسلةٍ مُدَرَّجة to scale a test (8) يقيس؛ يُعاير (9) يتدرَّج: يرتفع\
              \ في سلسلة مُدَرَّجة. "
