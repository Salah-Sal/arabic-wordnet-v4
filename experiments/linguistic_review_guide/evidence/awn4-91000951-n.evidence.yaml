      - entry_id: 910285
        headword: كيف
        dict_key: hawramani_37
        dict_name_en: Al-Ṣaghānī, al-ʿUbāb al-Dhākhir wa-l-Lubāb al-Fākhir (d. 1252 CE)
        dict_name_ar: العباب الزاخر للصغاني
        dict_source_type: hawramani
        dict_period: classical
        dict_death_year: 1252
        dict_author: null
        senses:
        - sense_index: 0
          text: 'كيفكَيْفَ: اسم مُبهو غير متمكن، وغنما حُرِّك آخره لالتقاء الساكنين؛ وبُني على الفتح دون الكسر لمكان الياء.
            وهو للاستفهام عن الأحوال. وقد يقع بمعنى التعجُّب والتوبيخ كقوله تعالى:) كَيْفَ تَكْفُرونَ باللهِ (. ويكون حالا
            لا سُؤال معه كقولك: لأُكْرِمَنَّكَ كيْفَ كُنت؛ أي على أي حال كُنْتَ. ويكون بمعنى النفي كقول سُويد بن ابي كاهِل
            اليشكري:كَيْفَ يَرْجُوْنَ سِقَاطي بَعْدَما ... جَلَّلَ الرَّأْسَ مَشِيْبٌ وصَلَعْوأما وقله تعالى:) فَكَيْفَ إذا
            جِئْنا من كلِّ أُمَّةٍ بِشَهِيدٍ (فهو توكيد لما تقدّم من خبر وتحقيق لما بعده، على تأويل إنّ الله لا يَظِلم مثقال
            ذرَّة في الدنيا فكيف في الاخرة.وإذا ضمَمْت إليه " ما " صحَّ أن يُجازى به تقول: كيف ما تَفْعَلْ أفْعَلْ.وقال الفَرّاءُ:
            تقول: كيف لي بفلانٍ؟ فيقول: كل الكَيْفَ والكَيْفَ - بالجر والنصب -.وكِفْتُ الشيء كَيْفاً: قَطَعْتُه. والكِيْفَةُ
            - بالكسر -: القِطعة من الشيء.وقال أبو عمرو: يقال للخِرقَة التي يُرْقَع بها ذيل القميص القُدّامُ: كِيْفَةٌ، ولِلَّتي
            يُرْقَعُ بها الخَلْفُ: حِيْفَةٌ.وحِصْن كِيْفى - مثال ضِيْزى -: حِصن بين آمد وجزيرة ابن عمر.وقال اللِّحياني: كيَّفْتُ
            الأديم وكوَّفْتُه: إذا قطَّعتَه.وأما اشتقاق الفعل من كَيْفَ؛ كقولهم؛ كَيَّفْتُه فَتَكَيَّفَ؛ فقياس، واستعمال المتكلمين
            دون السماع من العرب.وقال ابن عبّاد: انْكافَ: أي انقَطع.وتَكَيَّفْتُ الشيء: تَنَقَّصْتُه.'
          is_raw: 1
      - entry_id: 789189
