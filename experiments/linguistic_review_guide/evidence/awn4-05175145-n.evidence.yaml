      definitions_text: 'هي المقاومة التي تتعرّض لها السيارة عند اجتياز إحدى الطرق الصاعدة. تتميز مقاومة الصعود بقوة الوزن،
        أي [القوة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91801) التي قد تجعل السيارة غير المفرملة
        تتدحرج لأسفل من الطريق الصاعد بسبب كتلتها (انظر: [الكتلة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91791)).
        وتزداد مقاومة الصعود بنسبة مُماثلة لكتلة السيارة ولمقدار زاوية الصعود α.'
