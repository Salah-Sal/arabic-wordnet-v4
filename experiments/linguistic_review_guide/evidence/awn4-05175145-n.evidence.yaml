          - entry_id: 818578
            dictionary_id: 119
            headword: أسلوب الحكيم
            headword_bare: أسلوب الحكيم
            headword_norm: اسلوب الحكيم
            root: سلب
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'أسلوب الحكيم:[في الانكليزية] The method of the wise (pun)[ في الفرنسية] La methode du sage
              (calembour)عند أهل المعاني هو تلقّي المخاطب بغير ما يترقّب بحمل كلامه على خلاف مراده تنبيها له على أنه هو الأولى
              بالقصد، وهو من خلاف مقتضى الظاهر، كقول القبعثرى للحجاج حين قال الحجاج له مخوّفا إيّاه: لأحملنّك على الأدهم،
              يعني به القيد، مثل الأمير يحمل على الأدهم والاشهب. فأبرز القبعثرى وعيد الحجاج في معرض الوعد وتلقاه بغير ما يترقب
              بأن حمل لفظ الادهم الذي في كلام الحجاج على الفرس الأدهم، أي الذي غلب سواده حتى ذهب البياض الذي فيه، وضم إليه
              الأشهب أي الذي غلب بياضه حتى ذهب ما فيه من السواد قرينة على تعيين مراد القبعثرى ودفعا لمراد الحجاج، فإن مراد
              الحجاج إنما هو القيد، فنبّه على أنّ الحمل على الفرس الأدهم هو الأولى بأن يقصده الأمير؛ اي من كان مثل الأمير
              في السلطنة وبسط اليد فجدير بأن يقصد بأن يعطى المال لا أن يقصد بأن يقيد ويعذب بالنكال. ثم قال الحجاج له ثانيا:
              أردت به الحديد، فقال القبعثرى: الحديد خير من البليد، فحمل الحديد أيضا على خلاف مراد الحجاج أي الجلد الماضي في
              الأمور.وأصل القصة أن القبعثرى الشاعر كان جالسا في بستان مع جملة الأدباء، وكان الزمان زمان الحصرم فجرى ذكر الحجاج
              في ذلك المجلس فقال القبعثرى تعريضا على الحجاج:اللهم سوّد وجهه واقطع عنقه واسقني من دمه، فأخبر الحجاج بذلك فأحضر
              القبعثرى وهدّده، فقال القبعثرى أردت بذلك الحصرم. فقال له الحجاج لأحملنك إلى آخر القصة. فانظر إلى ذكاوة القبعثرى
              فقد سخر الحجاج بهذا الأسلوب حتى تجاوز عن جريمته وأحسن إليه وأنعم عليه، هكذا في المطول وحاشية الجلبي في آخر الباب
              الثاني.ولفظ الأسلوب بضم الهمزة وسكون السين بمعني روشن وراه،- المنير والطريق- ووجه التسمية ظاهر. وفي اصطلاحات
              الجرجاني أسلوب الحكيم هو عبارة عن ذكر الأهمّ تعريضا للمتكلم على تركه الأهم كما قال الخضر عليه السلام حين سلّم
              عليه موسى عليه السلام إنكارا لسلامه لأن السلام لم يكن معهودا في تلك الأرض بقوله: إنّى بأرضك السلام. فقال موسى
              عليه السلام: في جوابه أنا موسى، كأنه قال أجبت عن اللائق بك وهو أن تستفهم عني لا عن سلامي بأرضي، فقول موسى هو
              أسلوب الحكيم انتهى.وفي المطول ويلقى السائل بغير ما يترقب تنزيل سؤاله منزلة غيره تنبيها على أنّ ذلك الغير هو
              الأولى بحال السائل أو المهم له كقوله تعالى يَسْئَلُونَكَ عَنِ الْأَهِلَّةِ قُلْ هِيَ مَواقِيتُ لِلنَّاسِ وَالْحَجِ
              فقد سألوا عن السبب في إختلاف القمر في زيادة النور ونقصانه حيث قالوا: ما بال الهلال يبدأ دقيقا مثل الخيط، ثم
              يتزايد قليلا قليلا حتى يمتلأ ويستوي، ثم لا يزال ينقص حتى يعود كما بدأ، ولا يكون على حالة واحدة فأجيبوا ببيان
              الغرض من هذا الاختلاف، وهو أنّ الأهلة بحسب ذلك الاختلاف معالم يؤقّت بها الناس أمورهم من المزارع والمتاجر وآجال
              الديون والصوم [وغير ذلك] ومعالم الحج [يعرف بها وقته] وذلك للتنبيه على أنّ الأولى بحال السائلين أن يسألوا عن
              الغرض لا عن السبب، فإنهم ليسوا ممن يطلعون بسهولة على ما هو من دقائق علم الهيئة، وأيضا لا يتعلّق لهم به غرض،
              وأيضا لم يعط الإنسان عقلا بحيث يدرك به ما يريد من حقائق الأشياء وماهياتها، ولهذا لم يجب في الشريعة البحث عن
              حقائقها، انتهى.'
            translation_en: null
            translation_fr: null
            domain: null
