          - entry_id: 770675
            dictionary_id: 103
            headword: سلب
            headword_bare: سلب
            headword_norm: سلب
            root: سلب
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: "سلب: سَلَبَه الشيءَ يَسْلُبُه سَلْباً وسَلَباً، واسْتَلَبَه إِياه.\nوسَلَبُوتٌ، فَعَلوتٌ: مِنه.\
              \ وقال اللحياني: رجل سَلَبوتٌ، وامرأَةٌ\nسَلَبوتٌ كالرجل؛ وكذلك رجلٌ سَـلاَّبةٌ، بالهاءِ، والأُنثى سَـلاَّبة\n\
              أَيضاً. والاسْتِلابُ: الاختِلاس. والسَّلَب: ما يُسْلَبُ؛ وفي التهذيب: ما يُسْلَبُ به، والجمع أَسلابٌ.\nوكل شيءٍ\
              \ على الإِنسانِ من اللباسِ فهو سَلَبٌ، والفعل سَلَبْتُه\nأَسْلُبُه سَلْباً إِذا أَخَذْتَ سَلَبَه، وسُلِبَ الرجلُ\
              \ ثيابه؛ قال رؤْبة:\nيراع سير كاليراع للأَسلاب(1)\n(1 قوله «يراع سير إلخ» هو هكذا في الأصل.)\nاليَراعُ: القَصَب.\
              \ والأَسْلابُ: التي قد قُشِرَتْ، وواحدُ الأَسْلابِ\nسَلَبٌ. وفي الحديث: مَن قَتَل قَتيلاً، فله سَلَبُه. وقد\
              \ تكرر ذكر\nالسَّلَب، وهو ما يأْخُذُه أَحدُ القِرْنَيْن في الحربِ من قِرْنِه، مما يكونُ عليه ومعه من ثِـيابٍ\
              \ وسلاحٍ ودابَّةٍ، وهو فَعَلٌ بمعنى مفعولٍ أَي مَسْلُوب. والسَّلَبُ، بالتحريك: الـمَسْلُوب، وكذلك السَّلِـيبُ.\
              \ \nورجلٌ سَلِـيبٌ : مُسْتَلَب العقل، والجمع سَلْبـى.\nوناقة سالِبٌ وسَلُوبٌ: ماتَ وَلَدُها، أَو أَلْقَتْهُ\
              \ لغير تَمامٍ؛ وكذلك المرأَة، والجمع سُلُبٌ وسَلائبُ، وربما قالوا :امرأَة سُلُب؛ قال الراجز:\nما بالُ أَصْحابِكَ\
              \ يُنْذِرُونَكا؟  أَأَنْ رَأَوْكَ سُلُباً، يَرْمُونَكا؟\nوهذا كقولهم: ناقةٌ عُلُطٌ بلا خِطامٍ، وفَرس فُرُطٌ\
              \ متَقَدِّمة. وقد\nعَمِلَ أَبو عبيد في هذا باباً، فأَكْثَرَ فيه من فُعُلٍ، بغير هاءٍ\nللـمُؤَنَّث.\nوالسَّلُوب،\
              \ من النُّوق: التي أَلْقَتْ ولدها لغير تَمامٍ. والسَّلُوب،\nمن النُّوق: التي تَرْمي وَلَدها.\nوأَسْلَبت النَّاقَةُ\
              \ فهي مُسْلِبٌ: أَلْقَتْ وَلَدَها من غيرِ أَن يَتِـمَّ، والجمع السَّلائِبُ؛ وقيل أَسْلَبَت: سُلِبَتْ وَلَدَها\
              \ بِمَوتٍ أَو غير ذلك.\nوظَبيةٌ سَلُوبٌ وسالِبٌ: سُلِـبَتْ وَلَدَها؛ قال صخر الغيِّ: \nفَصادَتْ غَزالاً جاثماً،\
              \ بَصُرَتْ بِهِ  *  لدى سَلَماتٍ، عِنْدَ أَدْماءَ، سالِبِ\nوشَجَرةٌ سَلِـيبٌ: سُلِـبَتْ وَرَقَها وأَغصانَها.\
              \ وفي حديث صِلَةَ:\nخَرَجْتُ إِلى جَشَرٍ لَنا، والنخلُ سُلُبٌ أَي لا حَمْلَ عليها، وهو جمعُ سَلِـيبٍ. الأَزهري:\
              \ شَجَرَةٌ سُلُبٌ إِذا تَناثَرَ ورقُها؛ وقال ذو\nالرمة: \nأَو هَيْشَرٌ سُلُبُ \nقال شمر: هَيْشَرٌ سُلُبٌ، لا\
              \ قِشْرَ عليه.\nويقال: اسْلُبْ هذه القصبة أَي قَشِّرْها.\nوسَلَبَ القَصَبَةَ والشَّجَرَة: قشرها. وفي حديث صفة\
              \ مكة، شرَّفها اللّه تعالى: وأَسْلَب ثُمامُها أَي أَخْرَجَ خُوصَه.\nوسَلَبُ الذَّبيحَةِ: إِهابُها، وأَكراعُها،\
              \ وبطْنُهَا. وفَرَسٌ سَلْبُ القَوائم(1)\n(1 قوله «سلب القوائم» هو بسكون اللام في القاموس، وفي المحكم بفتحها.):\
              \ خَفيفُها في النَّقل؛ وقيل: فَرَسٌ سَلِب القَوائم أَي\nطَويلُها؛ قال الأَزهري: وهذا صحيحٌ. والسَّلْبُ: السيرُ\
              \ الخفيفُ السريعُ؛ قال رؤْبة:\nقَدْ قَدَحَتْ، مِنْ سَلْبِهِنَّ سَلْبا، *  قارُورَةُ العينِ، فصارت وَقْبَا\n\
              وانْسَلَبَتِ الناقَة إِذا أَسْرَعَت في سيرها حتى كأَنها تَخْرُج من\nجِلْدِها.\nوثَوْرٌ سَلِبُ الطَّعْنِ بِالقَرْنِ،\
              \ ورجُلٌ سَلِبُ اليَدَيْنِ بالضَّرْبِ والطَّعْنِ: خَفيفُهما. ورُمْحٌ سَلِبٌ: طَويلٌ؛ وكذلك الرجلُ،\nوالجمعُ\
              \ سُلُب؛ قال:\nومَنْ رَبَطَ الجِحاشَ، فإِنَّ فِـينا *  قَـناً سُلُباً، وأَفْراساً حِسانا\nوقال ابن الأَعرابي:\
              \ السُّلْبَةُ الجُرْدَةُ، يقال: ما أَحْسَنَ سُلْبَتَها وجُرْدَتَها.\nوالسَّلِبُ، بكسر اللام: الطويل؛ قال ذو\
              \ الرمة يصف فراخ النعامة:\nكأَنَّ أَعناقَها كُرّاتُ سائِفَةٍ،  *  طارَتْ لفائِفُه، أَو هَيْشَرٌ سَلِبُ\nويروى\
              \ سُلُب، بالضم، من قولهم نَخْلٌ سُلُب: لا حَمْلَ عليه. وشَجَرٌ سُلُبٌ: لا وَرَق عليه، وهو جمع سَلِـيبٍ، فعيلٌ\
              \ بمعنى مفعول.\nوالسِّلابُ والسُّلُب: ثِـيابٌ سودٌ تَلْبَسُها النساءُ في \n المأْتَمِ، واحدَتُها سَلَبة.\nوسَلَّبَتِ\
              \ المرأَةُ، وهي مُسَلِّبٌ إِذا كانت مُحِدًّا، تَلْبَس الثِّيابَ السُّودَ للـحِدادِ.\nوتَسَلَّبت: لَبِسَتِ السِّلابَ،\
              \ وهي ثِـيابُ الـمأْتَمِ السُّودُ؛ قال لبيد:\nيَخْمِشْنَ حُرَّ أَوجُهٍ صِحاحِ، *  في السُّلُبِ السودِ، وفي الأَمساحِ\n\
              وفي الحديث عن أَسْماءَ بِنْتِ عُمَيْس: أَنها قالت لـمَّا أُصيبَ\nجعفرٌ: أَمَرَني رسول اللّه، صلى اللّه عليه\
              \ وسلم، فقال: تَسَلَّبـي ثلاثاً، ثم اصْنَعِـي بعدُ ما شِئْتِ؛ تَسَلَّبـي أَي الْبَسِـي ثِـيابَ الـحِدادِ \n\
              السُّودَ، وهي السِّلاب. وتَسَلَّبَتِ المرأَةُ إِذا لَبِسَتْهُ، وهو ثَوْبٌ أَسودُ، تُغَطِّي به الـمُحِدُّ رَأْسَها.\
              \ وفي حديث أُمِّ سلمة:\nأَنها بَكَتْ على حَمْزَةَ ثلاثة أَيامٍ، وتَسَلَّبَتْ.\nوقال اللحياني: الـمُسَلِّب، والسَّلِـيبُ،\
              \ والسَّلُوبُ: التي يموتُ\nزَوجُها أَو حَمِـيمُها، فتَسَلَّبُ عليه. وتَسَلَّبَتِ المرأَة إِذا أَحدّتْ.\nوقيل:\
              \ الإِحدادُ على الزَّوْجِ، والتَّسَلُّبُ قد يكون على غيرِ زَوجٍ.\nأَبو زيدٍ: يقال للرجل ما لي أَراكَ مُسْلَباً؟\
              \ وذلك إِذا لم يَـأْلَفْ\nأَحداً، ولا يَسْكُن إِليه أَحد، وإِنما شبِّه بالوَحْش؛ ويقال: إِنه\nلوَحْشِـيٌّ مُسْلَبٌ\
              \ أَي لا يأْلفُ، ولا تَسْكُنُ نفسُه.\nوالسلبة: خَيْطٌ يُشَدُّ على خَطْمِ البعيرِ دونَ الخِطامِ. والسلبة:\nعَقَبَةٌ\
              \ تُشَدُّ على السهم.\nوالسِّلْبُ: خَشَبَةٌ تُجْمَع إِلى أَصلِ اللُّؤَمةِ، طَرَفُها في ثَقْبِ\nاللُّؤَمةِ. قال\
              \ أَبو حنيفة: السِّلْبُ أَطْوَلُ أَداةِ الفَدَّانِ؛ وأَنشد:\nيا لَيْتَ شعْري، هلْ أَتى الحسانا،\nأَنـَّى اتَّخَذْتُ\
              \ اليَفَنَيْنِ شانـــــــــــــا؟\nالسِّلْبَ، واللُّؤْمةَ، والعيانـــــــــــــــا\nويقال للسَّطْر من النخيل:\
              \ أُسْلوبٌ. وكلُّ طريقٍ ممتدٍّ، فهو أُسلوبٌ.\nقال: والأُسْلوبُ الطريق، والوجهُ، والـمَذْهَبُ؛ يقال: أَنتم في\n\
              أُسْلُوبِ سُوءٍ، ويُجمَعُ أَسالِـيبَ. والأُسْلُوبُ: الطريقُ تأْخذ فيه.\nوالأُسْلوبُ، بالضم: الفَنُّ؛ يقال: أَخَذ\
              \ فلانٌ في أَسالِـيبَ من القول أَي أَفانِـينَ منه؛ وإِنَّ أَنْفَه لفي أُسْلُوبٍ إِذا كان مُتكبِّراً؛ قال:\n\
              أُنوفُهُمْ، بالفَخْرِ، في أُسْلُوبِ،  *  وشَعَرُ الأَسْتاهِ بالجَبوبِ\nيقول: يتكبَّرون وهم أَخِسَّاء، كما يقال:\
              \ أَنْفٌ في السماءِ واسْتٌ في الماءِ. والجَبوبُ: وجهُ الأَرضِ، ويروى:\nأُنوفُهُمْ، مِلفَخْرِ، في أُسْلُوبِ \n\
              أَراد مِنَ الفَخْرِ، فحَذف النونَ.  والسَّلَبُ: ضَرْبٌ من الشجر ينبُتُ مُتَناسقاً، ويَطولُ فيُؤخَذُ\nويُمَلُّ،\
              \ ثم يُشَقَّقُ، فتخرجُ منه مُشاقةٌ بيضاءُ كالليفِ، واحدتُه سَلَبةٌ، وهو منْ أَجودِ ما يُتخذ منه الحبال. وقيل:\
              \ السَّلَبُ لِـيفُ الـمُقْلِ، وهو يُؤْتى به من مكة. الليث: السَّلَبُ ليفُ الـمُقْل، وهو أَبيض؛ قال الأَزهري:\
              \ غَلِطَ الليث فيه؛ وقال أَبو حنيفة: السَّلَبُ نباتٌ ينبتُ أَمثالَ الشَّمَع الذي يُسْتَصْبَحُ به في خِلْقَتِه،\
              \ إِلاَّ أَنه أَعظمُ وأَطولُ، يُتَّخَذ منه الحبالُ على كلّ ضَرب. والسَّلَبُ: لِحاءُ شجرٍ معروف باليمن، \n تعمل\
              \ منه الحبالُ، وهو أَجفَى من ليفِ الـمُقْلِ وأَصْلَبُ.\nوفي حديث ابن عمر: أن سعيد بن جبير دخل عليه، وهو مُتوسِّدٌ\
              \ مِرْفَقَةَ أَدَم، حَشْوُها لِـيفٌ أَو سَلَبٌ، بالتحريك. قال أَبو عبيد: سأَلتُ عن السَّلَبِ، فقيل: ليس بلِـيفِ\
              \ الـمُقْلِ، ولكنه شجر معروفٌ باليمن، تُعْمَلُ منه الحبالُ، وهو أَجفى من لِـيفِ الـمُقْلِ وأَصْلَبُ؛ وقيل هو\
              \ ليفُ الـمُقْل؛ وقيل: هو خُوصُ الثُّمام.\nوبالـمَدينة سُوقٌ يقال له: سوقُ السَّلاَّبِـين؛ قال مُرَّة بن مَحْكان\
              \ \nالتَّميمي:\nفنَشْنَشَ الجِلدَ عَنْها، وهْيَ بارِكةٌ، *  كما تُنَشْنِشُ كفَّا فاتِلٍ سَلَبا\nتُنَشْنِشُ:\
              \ تحرِّكُ. قال شمر: والسَّلَب قِشْرٌ من قُشورِ الشَّجَر،\nتُعْمَلُ منهُ السِّلالُ، يقال لسُوقِهِ سُوقُ السَّلاَّبِـينَ،\
              \ وهي بمكَّة \nمعروفَةٌ. ورواه الأَصْمعي: فَاتِل، بالفاءِ؛ وابن الأَعرابي: قَاتِل،\nبالقافِ. قال ثعلب: والصحيح\
              \ ما رواه الأَصمعي، ومنه قَولُهم أَسْلَبَ الثُّمامُ. قال: ومن رواه بالفاءِ، فإِنه يريدُ السَّلَب الذي تُعْمَلُ\
              \ منه الـحِبال لا غير؛ ومن رواه بالقاف، فإِنه يريد سَلَبَ القَتِـيل؛ شَبَّه نَزْع الجازِرِ جِلْدَها عنها بأَخْذِ\
              \ القاتِل سَلَبَ الـمَقْتُول، وإِنما\nقال: بارِكَة، ولم يَقُلْ: مُضْطَجِعَة، كما يُسْلَخُ الـحَيوانُ مُضْطَجِعاً،\
              \ لأَن العرب إِذا نَحَرَتْ جَزُوراً، تركُوها باركة على حالها،\nويُرْدِفُها الرجالُ من جانِـبَيْها، خوفاً أَن\
              \ تَضْطَجِعَ حين تموت؛ كلُّ ذلك حرصاً على أَن يَسْلُخوا سَنامَها وهي باركة، فيأْتي رجلٌ من جانِبٍ، وآخَرُ من\
              \ الجانب الآخر؛ وكذلك يفعلون في الكَتِفَين والفَخِذَين، ولهذا كان سَلْخُها باركةً خيراً عندهم من سَلْخِها مضطجعةً.\n\
              والأُسْلُوبةُ: لُعْبَةٌ للأَعراب، أَو فَعْلَةٌ يفعلونها بينهم، حكاها\nاللحياني، وقال: بينهم أُسْلُوبة."
