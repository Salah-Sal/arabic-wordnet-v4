                دون السالبة، يعني أنّ صدق الموجبة يستلزم وجود الموضوع حال ثبوت المحمول له واتحاده معه في ظرف ذلك الموضوع،
                إن ذهنا فذهنا وإن خارجا فخارجا وإن ساعة فساعة وإن دائما فدائما، بخلاف صدق السالبة فإنّه لا يستلزم وجود الموضوع
                بل قد يصدق بانتفائه ضرورة أنّ ما لا ثبوت له في نفسه فكيف يثبت له غيره؟ لكن تحقّق مفهوم السالبة في الذهن يستلزم
                وجود موضوعه في الذهن حال الحكم فقط. قال شارح إشراق الحكمة قولنا لا بد للإثبات من أن يكون على ثابت بخلاف النفي
                فإنّه يجوز على المنفي ليس معناه ما يسبق إلى الفهم وهو أنّ موضوع السالبة يجوز أن يكون معدوما في الخارج دون
                موضوع الموجبة على ما ظنّ، وعلّل به كون السالبة أعمّ من الموجبة لأنّ موضوع الموجبة أيضا قد يكون معدوما في الخارج،
                كقولنا اجتماع الضدين محال، ولا أنّ موضوع الموجبة يجب أن يتمثّل في خارج أو ذهن دون موضوع السالبة، لأنّ موضوع
                السالبة لا بد أن يكون كذلك، بل معناه أنّ السّلب يصحّ عن الموضوع الغير الثابت أي إذا أخذ من حيث هو غير ثابت
                على معنى أنّ للعقل أن يعتبر هذا في السلب بخلاف الإثبات فإنّه وإن صحّ على الموضوع الغير الثابت لكن لا يصحّ
                عليه من حيث هو غير ثابت بل من حيث إنّ له ثبوتا ما لأنّ الإثبات يقتضي ثبوت شيء حتى يثبت له شيء. ولذا صحّ أن
                يقال المعدوم من حيث هو معدوم ليس بزيد ولا يصحّ أن يقال بأنّه من حيث هو معدوم زيد بل من حيث له ثبوت في الذهن.
                ولغفلة الجمهور عن هذه الحيثية لدقتها وغموضها ظن أنّ العموم إنّما هو لجواز كون موضوع السالبة معدوما في الخارج
                دون الموجبة ولا يصحّ ذلك إلّا بأن يؤول بما ذكرنا. ويقال مرادهم منه أنّ السّلب يصحّ عن المعدوم من حيث هو معدوم
                دون الإيجاب فيستقيم ولا يرد الإشكال، فتمحّض بما ذكرنا أنّ المراد بوجود الموضوع في الموجبة والسالبة شيء واحد،
                وهو تمثّله في وجود أو وهم ليحكم عليه بحسب تمثله، وأنّ السالبة البسيطة إنّما تكون أعمّ من الموجبة المعدولة
                المحمول إذا كان موضوعها غير ثابت، وأخذ من حيث هو غير ثابت لاستحالة إثبات عدم محمول السالبة لموضوعها من حيث
                هو غير ثابت أو منتف لتوقّف إثبات الشيء للشيء على ثبوته في نفسه. وأمّا إن لم يؤخذ من حيث هو غير ثابت بل أخذ
                من حيث إنّ له ثبوتا ما في الذهن فيمكن إثبات عدم محمول السالبة لموضوعها من حيث له ثبوت، وتتلازمان حينئذ. لكن
                نحن لا نأخذ موضوع السالبة من حيث هو غير ثابت بل من حيث هو ثابت أي متمثّل في وجود أو وهم على ما هو المصطلح
                والمتعارف. وعلى هذا تتلازمان في جميع القضايا، انتهى ما في شرح إشراق الحكمة.ثم اعلم أنّ متأخري المنطقيين اعتبروا
                قضية سالبة المحمول وحكموا بأنّ موجبتها مساوية للسالبة البسيطة، فكما أنّ السالبة لا تقتضي وجود الموضوع فكذلك
                الموجبة السالبة المحمول. وفرّقوا بينهما بأنّ في السالبة المحمول زيادة اعتبار إذ في السالبة نتصوّر الطرفين
                والنسبة بينهما ونرفع تلك النسبة، وفي سالبة المحمول نتصوّر الطرفين والنسبة ونرفعها، ثم نعود ونحمل ذلك السّلب
                على الموضوع، فإنّه إذا لم يصدق إيجاب المحمول على الموضوع يصدق سلبه عليه فتكرر اعتبار السّلب فيها بخلاف السالبة
                فإنّ فيها أربعة أمور:تصوّر الموضوع وتصوّر المحمول وتصوّر النسبة الإيجابية وسلبها. وفي السالبة المحمول خمسة
                أشياء وهي تلك الأمور الأربعة مع حمل السّلب على الموضوع، وهكذا الحال في السالبة الموضوع فإنّه قد حمل فيها سلب
                العنوان على الموضوع. ومن هاهنا تسمعهم يقولون معنى السالبة المحمول أنّ الموضوع شيء سلب عنه المحمول، ومعنى السالبة
                الطرفين أنّ شيئا سلب عنه الموضوع هو شيء سلب عنه المحمول.ومعنى السالبة أنّ الموضوع سلب عنه المحمول. فالسالبة
                وسالبة المحمول تشتركان في أنّ السّلب خارج عن المحمول فيهما جميعا، وإنّما الفرق بينهما بزيادة اعتبار كما عرفت.
                فلذا لا تستدعيان وجود الموضوع. وأمّا الفرق بين السالبة وسالبة الطرف سواء كانت سالبة الموضوع أو سالبة المحمول
                أو سالبة الطرفين وبين المعدولة الموضوع ومعدولة المحمول ومعدولة الطرفين فبخروج السّلب وعدم خروجه، هذا ما قالوا.
                وفيه نظر لأنّ قولهم نعود ونحمل ذلك السلب على الموضوع يقتضي أن يكون السّلب جزءا من المحمول وهو يناقض قولهم
                إنّ السّلب خارج عن المحمول فيهما معا. وكذا الحال في سالبة الموضوع إلّا أن يتكلّف ويقيّد الموضوع والمحمول بالأولين
                اللذين ورد عليهما السلب. وعلى هذا يدخل أقسام سالبة الطرف في المحصّلة، فلا بدّ من تخصيص قولهم إنّ الموجبة المحصّلة
                تقتضي وجود الموضوع بما عدا سالبة المحمول، أو تخصيص تقسيم المعدولة والمحصّلة بما بقي على موضوعه ومحموله الأولين
                بأن لم يرجع في موضوعه من وضع إلى وضع آخر، ولا في محموله من حمل إلى حمل آخر حتى تخرج أقسام سالبة الطرف من القسمين
                معا. وأيضا المقدّمة القائلة بأنّ ثبوت الشيء للشيء يستلزم ثبوت المثبت له لا يستثني العقل منها الأمر السلبي.
                وأيضا المفهوم من كلام الشيخ وغيره أنّ الإيجاب مطلقا يقتضي وجود الموضوع وأنّه لا فرق بين ما سموه سالبة المحمول
                والمعدولة. فالموجبة مطلقا تقتضي وجود الموضوع لأجل معنى الرابطة لا لاقتضاء المحمول ذلك. والحق أنّ السالبة المحمول
                على ما اعتبره المتأخرون قضية ذهنية لأنّ اتّصاف الموضوع بسلب المحمول عنه إنّما هو في الذهن فتقتضي وجود الموضوع
                في الذهن لا في الخارج فيكون بينها وبين السالبة الخارجية تلازم. ويرد عليه أنّ نفس السّلب وإن كان أمرا اعتباريا
                ذهنيا لكن يجوز أن يكون الاتّصاف به في الخارج لما تقرّر أنّ الاتّصاف الخارجي لا يستدعي وجود الصفة في الخارج،
                بل إنّما يقتضي وجود الموصوف فيه كما في الاتصاف بالعمى. ويمكن أن يجاب بأنّ الموجبة السالبة المحمول يصدق عند
                عدم موضوعها في الخارج مطلقا كما في قولك العمى ليس بموجود. وقد تقرّر أنّ الإيجاب مطلقا يستدعي وجود الموضوع
                فلا بد أن تكون هذه القضية ذهنية لوجود الموضوع في الذهن، فكذا سائر الموجبات السالبة المحمول لعدم الفرق. ولا
                يخفى أنّ للمناقشة فيه مجالا. وقد بقيت هاهنا أبحاث تركناها حذرا من الإطناب فإن شئت فارجع إلى كتب المنطق.
