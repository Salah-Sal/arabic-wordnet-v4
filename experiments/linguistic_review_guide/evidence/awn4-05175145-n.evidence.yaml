            pos: null
            form: null
            is_partial: 0
            definitions_text: التسلسل الهرمي لإدارة النفايات هو رمز للخيارات الاستراتيجية المتاحة للتعامل مع النفايات الصلبة
              والاستفادة منها. نسخة مناسبة من التسلسل الهرمي يقدم أفضل الممارسات المطلوبة لإدارة النفايات في قمة الهرم (تجنب
              ثم تقليل و / أو استعادة المواد)، ثم تأتي الممارسات المطلوبة بالمستوى الأقل (معالجة و / أو التخلص منها في مطارح
              النفايات) وفي الأخير التخلص في مطارح عشوائية غير مرخصة من طرف الجهات المختصة.
