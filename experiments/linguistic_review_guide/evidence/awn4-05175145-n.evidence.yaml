                المجلس فقال القبعثرى تعريضا على الحجاج:اللهم سوّد وجهه واقطع عنقه واسقني من دمه، فأخبر الحجاج بذلك فأحضر القبعثرى
                وهدّده، فقال القبعثرى أردت بذلك الحصرم. فقال له الحجاج لأحملنك إلى آخر القصة. فانظر إلى ذكاوة القبعثرى فقد
                سخر الحجاج بهذا الأسلوب حتى تجاوز عن جريمته وأحسن إليه وأنعم عليه، هكذا في المطول وحاشية الجلبي في آخر الباب
                الثاني.ولفظ الأسلوب بضم الهمزة وسكون السين بمعني روشن وراه،- المنير والطريق- ووجه التسمية ظاهر. وفي اصطلاحات
                الجرجاني أسلوب الحكيم هو عبارة عن ذكر الأهمّ تعريضا للمتكلم على تركه الأهم كما قال الخضر عليه السلام حين سلّم
                عليه موسى عليه السلام إنكارا لسلامه لأن السلام لم يكن معهودا في تلك الأرض بقوله: إنّى بأرضك السلام. فقال موسى
                عليه السلام: في جوابه أنا موسى، كأنه قال أجبت عن اللائق بك وهو أن تستفهم عني لا عن سلامي بأرضي، فقول موسى
                هو أسلوب الحكيم انتهى.وفي المطول ويلقى السائل بغير ما يترقب تنزيل سؤاله منزلة غيره تنبيها على أنّ ذلك الغير
                هو الأولى بحال السائل أو المهم له كقوله تعالى يَسْئَلُونَكَ عَنِ الْأَهِلَّةِ قُلْ هِيَ مَواقِيتُ لِلنَّاسِ
                وَالْحَجِ فقد سألوا عن السبب في إختلاف القمر في زيادة النور ونقصانه حيث قالوا: ما بال الهلال يبدأ دقيقا مثل
                الخيط، ثم يتزايد قليلا قليلا حتى يمتلأ ويستوي، ثم لا يزال ينقص حتى يعود كما بدأ، ولا يكون على حالة واحدة فأجيبوا
                ببيان الغرض من هذا الاختلاف، وهو أنّ الأهلة بحسب ذلك الاختلاف معالم يؤقّت بها الناس أمورهم من المزارع والمتاجر
                وآجال الديون والصوم [وغير ذلك] ومعالم الحج [يعرف بها وقته] وذلك للتنبيه على أنّ الأولى بحال السائلين أن يسألوا
                عن الغرض لا عن السبب، فإنهم ليسوا ممن يطلعون بسهولة على ما هو من دقائق علم الهيئة، وأيضا لا يتعلّق لهم به
                غرض، وأيضا لم يعط الإنسان عقلا بحيث يدرك به ما يريد من حقائق الأشياء وماهياتها، ولهذا لم يجب في الشريعة البحث
                عن حقائقها، انتهى.'
