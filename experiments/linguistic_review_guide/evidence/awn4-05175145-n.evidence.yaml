      headword: مُقاومة الخبط
      headword_bare: مقاومة الخبط
      headword_norm: مقاومة الخبط
      root: قم
      root_source: camel
      pos: null
      form: null
      is_partial: 0
      definitions_text: 'هي خاصية تتميز بها أنواع وقود محركات أوتّو التي لا تشتعل ذاتياً عند درجات الحرارة وقيم الضغط المرتفعة.
        وتتمثل وظيفتها في تحديد ما إذا كان سير عملية احتراق [خليط الهواء والوقود](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88248)
        سيتم بشكل متساو ودون حدوث اضطرابات لها بسبب [الاشتعال الذاتي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87910)،
        (انظر: الخبط)، قرب نهايتها. مقياس درجة مُقاومة الخبط في الوقود هو رقم الأوكتان.'
      translation_en: knock resistance
      translation_fr: résistance à la détonation [f.]
