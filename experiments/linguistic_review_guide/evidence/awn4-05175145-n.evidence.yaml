          - entry_id: 780416
            dictionary_id: 105
            headword: سَلَبَ
            headword_bare: سلب
            headword_norm: سلب
            root: سلب
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '(سَلَبَ)(هـ) فِيهِ «إِنَّهُ قَالَ لِأَسْمَاءَ بِنْتِ عُمَيسٍ بَعْدَ مقتَل جَعفر: تَسَلَّبِي
              ثَلَاثًا، ثُمَّ اصْنعَي مَا شِئتِ» أَيِ الْبَسى ثوبَ الحِدَاد وَهُوَ السِّلَابُ، وَالْجَمْعُ سُلُبٌ. وتَسَلَّبَتِ
              المرأةُ إِذَا لبسَتْه وَقِيلَ هُوَ ثَوبٌ أسودُ تُغَطى بِهِ المُحِدُّ رأْسَها.وَمِنْهُ حَدِيثُ بِنْتِ أُمِّ سَلَمَةَ
              «أَنَّهَا بكَت عَلَى حَمزةَ ثلاثةَ أَيَّامٍ وتَسَلَّبَتْ» .(س) وَفِيهِ «مَنْ قَتل قَتِيلًا فَلَهُ سَلَبُهُ»
              وَقَدْ تَكَرَّرَ ذِكْرُ السَّلَبِ فِي الْحَدِيثِ، وَهُوَ مَا يَأْخُذُهُ أحدُ القِرْنَين فِي الْحَرْبِ مِنْ قِرْنِه
              مِمَّا يَكُونُ عَلَيْهِ وَمَعَهُ مِنْ سِلاح وثِياب ودَابَّة وَغَيْرِهَا، وَهُوَ فَعلٌ بِمَعْنَى مَفْعُول: أَيْ
              مَسْلُوب.(هـ) وَفِي حَدِيثِ صِلَة «خرجتُ إِلَى جَشَرٍ لَنَا والنخْلُ سُلُبٌ» أَيْ لَا حَمْل عَلَيْهَا، وَهُوَ
              جمعُ سَلِيبٍ، فَعِيلٍ بِمَعْنَى مَفْعُول.(هـ) وَفِي حَدِيثِ ابْنِ عُمَرَ «دخَل عَلَيْهِ ابْنُ جُبَيْرٍ وَهُوَ
              مُتَوَسِّد مِرْفَقَة حَشْوُها لِيف أَوْ سَلَب» السَّلَبُ بِالتَّحْرِيكِ: قِشْر شَجَر مَعْرُوفٍ باليَمَن يُعْمل
              مِنْهُ الحبالُ. وَقِيلَ هُوَ لِيف المُقْل، وَقِيلَ خُوص الثُّمام. وَقَدْ جَاءَ فِي حَدِيثٍ «أَنَّ النَّبِيَّ
              صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ لَهُ وِسَادة حشوُها سَلَبٌ» .(هـ) وَمِنْهُ حَدِيثُ صِفَةِ مَكَّةَ «وأَسْلَبَ
              ثُمامُها» أَيْ أخْرَج خُوصَه.'
