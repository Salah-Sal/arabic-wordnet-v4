          - entry_id: 838008
            dictionary_id: 125
            headword: سلب
            headword_bare: سلب
            headword_norm: سلب
            root: سلب
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: "باب السين واللام والباء معهما س ل ب، ل س ب، ب ل س، ل ب س، ب س ل مستعملات\nسلب: كلُّ لِباسٍ\
              \ على الإنسانِ سَلَبٌ، وسَلَبَ يَسُلُبُ: أخَذَ سَلَبَه، [والسَّلَبُ: ما يُسْلَبُ به، والجميع الأسلاب]  . والسَّلوب\
              \ من النّوق: التي يؤخَذُ ولدها، وجمعه سَلائب. وقيل: هي الناقة إذا أَلْقَت ولَدَها لغير تَمامٍ وجمعه سُلُبٌ،\
              \ وأَسْلَبَتْ: فَعَلَت ذلك ويقال للشّاء أَسْلَبَتْ. ويقال: السُّلُبُ: الطِّوال، وفَرَسٌ سَلِبُ القَوائِم وبعير\
              \ مثلُه والسَّليبُ: الشجرةُ أُخِذَتُ أغصانُها ووَرَقُها. وامرأة مُسَلِّبٌ: سَلَّبَت على زوجها أو غيره أي مُحِدٌّ.\
              \ وفَرَسٌ سَلبُ القوائِمِ: خَفيفُ نقلِها. ورجل سَلْبُ اليَدَيُنِ بالطعْنِ: خفيفُهما. وثَورٌ سَلْبُ القَرْن بالطعْن\
              \ أي خفيفُه. وشَجَر السَّلَب يكون فيه اللِّيف الأبيض، الواحدة سَلَبَةٌ، هُذَليّة. والسَّلَبُ: ليف المُقل وهو\
              \ المَسَدُ.\nلسب: لَسَبَته الحَيّةُ تلسِبُه لَسْباً. وجَوْزٌ لَسِبٌ لَصِبٌ نقيض الفَرِك. ولَسِبتُ السَّمْنَ\
              \ ألْسَبُهُ لَسْباً لَعِقتُه.\nبلس: المُبْلِسُ: الكئيبُ الحزين المُتَنَدِّم. وسُمِّي إِبليسَ لأنَّه أُبِلسَ\
              \ من الخَيْر أي أُوِيسَ، وقيل: لُعِن. والمُبلِسُ: البائِسُ. والبَلَسانُ: شَجَرٌ حَبُّه يجعَل في الدَّواءِ، ولحَبِّه\
              \ دُهْنٌ [يُتنافَس فيه]  .\nلبس: اللِّباسُ: ما وارَيْتَ به جَسَدَك، ولباسُ التَّقّوى: الحَياءُ، ولَبِسَ يَلْبَس.\
              \ واللَّبْسُ: خَلط الأمور بعضِها ببعضٍ إذا التَبَسَتْ. واللَّبُوسُ: الدِّرْع، وكلُّ ما تَحَصَّنْتَ به، قال:\n\
              البَسْ لكلِّ حالةٍ لَبُوسَها \nوثوبٌ ومُلاءةٌ لبيس، وجمعه لُبُسٌ لأنه مفعول  . واللِّبسةُ: ضَرَبٌ من الثياب،\
              \ ولَبِسَ لُبْساً ولُبسَةً واحدةً. واللبسة: بقلة. سبل: المُسْبِلُ: اسم خامِس سِهامِ القِداح. والسبيل: يذكَّر\
              \ ويؤنَّث، وجمعه سُبُل. والسابلةُ: المختلفةُ في الطُّرُقات للحوائج، وجمعه سوابِلُ. وسبيلٌ سابلٌ كقولهم: شِعْرٌ\
              \ شاعِرٌ. والسَّبَلةُ: ما على الشَّفةِ العُليا من الشَّعر تَجمَعُ الشاربَيْنِ وما بينَهما، وامرأة سَبْلاء: لها\
              \ هناك شَعْرٌ. وسَبَلَتِ المرأة: نَبَتَتْ سَبَلَتُها. والسَّبَلُ: المَطَرُ. والسَبُّولة: سُنْبلةُ الذُّرَةِ\
              \ والأَرُزّ. وأَسْبَلَ الزَّرعُ أي سَنبَلَ. والفَرَسُ أَسبَلَ ذَنَبَه، والمرأةُ (اسبَلَتْ) ذَيلَها. ورجل مِسبال:\
              \ عادتُه إِسبالُ ثِيابه أي إرساله. وطريق مَسْبُول أي مَسْلوكٌ. وسَبَّلْتُ مالاً في سبيل اللهِ أي وَقَفْتُه.\
              \ والسِّبال جمع السابِل. وسبلل بَلدةٌ.\nبسل: بَسَلَ يبسُلُ بُسُولاً فهو باسِلٌ، وهو عُبُوسة الشجاعة والغَضَب،\
              \ وأسد باسلٌ. واستَبسَلَ الرّجُلُ إذا وطَّنَ نفسَه عليه واسْتَيْقن به.وأَبْسَلَ نفسَه للموتِ: وَطَّنَها عليه\
              \ واستَيقَنَ به. والانسانُ يُبسِلُ بعملِه إِبسالاً أي يخذُل ويُوكَل إليه، ويُبسِلُ: يُسلِمُ. والبَسْلُ: المُحَرَّم\
              \ الذي لا تُتَأوَّلُ حُرْمتُه، قال:\nسوادٌ دَجُوجيٌّ وبَسلُ مُحَرَّم \nوالبَسْلُ: الحَلالُ، قال:\nدمي إنْ أُسيغَتْ\
              \ هذه، لكُمُ بَسْلُ \nوبَسَلْتُ الراقي: أعطيتُه بُسْلَتَه، وهو ما يُعْطَى على رُقْيتِه، وابتَسَلَ الراقي: أخَذَ\
              \ على رُقيَتِه. [وإذا دَعَا الرجلُ على صاحبه يقول: قَطَعَ اللهُ مَطاكَ، فيقول الآخرُ: بَسْلاً أي آمين، وانشد:\n\
              لا خابَ من نَفْعِكَ من رَجاكا ... بَسلا وعادَى اللهُ من عاداكا]"
