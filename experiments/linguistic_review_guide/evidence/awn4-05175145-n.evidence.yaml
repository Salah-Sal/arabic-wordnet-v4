          - entry_id: 809977
            dictionary_id: 116
            headword: سلب
            headword_bare: سلب
            headword_norm: سلب
            root: سلب
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '[سلب] فيه: قال لأسماء بعد قتل جعفر: "تسلبى" ثلاثا ثم اصنعى ما شئت، أي البسى ثوب الحداد وهو
              السلاب والجمع سلب، وتسلبت المرأة إذا لبسته، وقيل: هو ثوب أسود تغطى به المحل رأسها. ومنه ح بنت أم سلمة: إنها
              بكت على حمزة ثلاثة أيام و"تسلبت". ج: وفيه: يحمى له وادى "سلبة" هي اسم واد - ومعنى حمايته مر في ذباب من ذ. نه:
              وفيه: من قتل قتيلا فان "سلبه" وهو ما يأخذ في الحرب من قرنه من سلاح وثياب ودابة وغيرها، وهو بمعنى مسلوب. ك: بفتح
              لام وجمعه أسلاب. ومنه: من لم يخمس: الأسلاب" وفيه: والنخل "سلب" أي لا حمل عليها، وهو جمع سليب بمعنى مسلوب. وفيه:
              وهو متوسد مرفقة حشوها ليف أو "سلب" هو بالحركة قشر شجر معروف يعمل منها الحبال، وقيل: هو ليف المقل وقيل: خوض الثمام.
              ومنه ح مكة: و"أسلب" ثمامها، أي أخرج خوصه.'
