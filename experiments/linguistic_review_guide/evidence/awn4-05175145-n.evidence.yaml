            definitions_text: وظائف موجهة لسلوك الفرد باعتبارها قدرات عقلية أو ضوابط عقلية معرفية أو كلاهما معا، كما أنها
              ترتبط بعمليات الذاكرة والتفكير وحل المشكلات ومعالجة المعلومات. وتظهر هذه الوظائف في قدرات الفرد الإدراكية وتعبر
              عن طريقته الخاصة في التعامل مع المعلومات من حيث استقبالها وترميزها والاحتفاظ بها واستخدامها بغض النظر عما إذا
              كان مصدر هذه المعلومات العالم المحيط بالفرد أو الفرد ذاته.
