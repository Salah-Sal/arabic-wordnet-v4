per_synset:
  step4_fts_keyword:
    keywords_extracted:
    - صفة
    - تتميز
    - بالشك
    - المعتاد
    - والميل
    - لانكار
    - معارضة
    - مقاومة
    - الاقتراحات
    - الاوامر
    sql_template: "SELECT \n    e.id              AS entry_id,\n    e.dictionary_id,\n    e.headword,\n    e.headword_bare,\n\
      \    e.headword_norm,\n    e.root,\n    e.root_source,\n    e.pos,\n    e.form,\n    e.is_partial,\n    e.definitions_text,\n\
      \    e.translation_en,\n    e.translation_fr,\n    e.domain,\n    e.external_id,\n    d.key             AS dict_key,\n\
      \    d.name_ar         AS dict_name_ar,\n    d.name_en         AS dict_name_en,\n    d.source_type     AS dict_source_type,\n\
      \    d.period          AS dict_period,\n    d.author          AS dict_author,\n    d.death_year      AS dict_death_year\n\
      FROM entries e\nJOIN dictionaries d ON e.dictionary_id = d.id\nWHERE e.id IN (\n    SELECT rowid FROM entries_fts\n\
      \    WHERE entries_fts MATCH ?1\n    ORDER BY bm25(entries_fts, 10.0, 5.0, 5.0, 3.0, 1.0)\n    LIMIT 50\n)\nAND e.id\
      \ NOT IN (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)\n\
      ORDER BY d.source_type, d.name_en;"
    query_params:
    - '"صفة" OR "تتميز" OR "بالشك" OR "المعتاد" OR "والميل" OR "لانكار" OR "معارضة" OR "مقاومة" OR "الاقتراحات" OR "الاوامر"'
