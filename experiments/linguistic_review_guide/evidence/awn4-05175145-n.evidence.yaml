        dict_name_en: Al-Mu'jam Al-Kabir
        dict_source_type: ocr
        dict_period: modern
        dict_author: مجمع اللغة العربية
        dict_death_year: null
        definitions:
        - sense_index: 0
          text: ما يُسْلَبُ به
          is_raw: 0
        - sense_index: 1
          text: 'ضربٌ من الشجر تُسْتخْرَجُ منه مُشاقة بيضاءُ كالليف, وهو من أَجْود ما يُتَّخذ منه الحبالُ. واحدتُه: سَلَبَةٌ'
          is_raw: 0
        - sense_index: 2
          text: نباتٌ يَنبُتُ أمثالَ الشَّمع الذى يُستصبح به فى خِلْقتهِ إلا أنه أعظمُ وأطولُ, يتخذُ منه الحبالُ على كل ضَرْب
          is_raw: 0
        - sense_index: 3
          text: لحاءُ شَجَرٍ معروفٍ باليمن, تُعمل منه الحبالُ, وعلى هذا يُخَرَّجُ قولُ العامة للحبل المعروف سَلَبة
          is_raw: 0
        - sense_index: 4
          text: ليفُ المُقَل والنَّخْل
          is_raw: 0
        - sense_index: 5
          text: قِشْرٌ من قُشور الشجر تُعمل منه السِّلال
          is_raw: 0
        - sense_index: 6
          text: الماءُ الذى يسيلُ من القِرْبة
          is_raw: 0
        - sense_index: 7
          text: 'من القَصَبة والشجرة: قِشرُها'
          is_raw: 0
        - sense_index: 8
          text: 'من الذبيحة: إهابُها وأكراعُها وبطْنُها ورأسُها'
          is_raw: 0
        examples:
        - idx: 0
          type: poetry
          text: حتى نَجوْتُ ولمَّا يَنْزِعوا سَلَبى / بِوَالِهٍ من قبيض الشَّدِّ غَيَدَاقِ
          attribution: تأبط شرًّا
        - idx: 1
          type: poetry
          text: إنَّ الأُسود أُسودَ الغيل همَّتُها / يومَ الكريهة فى الْمَسْلُوب لا السَّلَب
          attribution: أبو تَمَّام
        - idx: 2
          type: hadith
          text: أن النبى – صلَّى الله عَليه وسلَّم – كانَ لـه وسادَةٌ حشوُها سَلَبٌ
          attribution: null
        - idx: 3
          type: poetry
          text: يُنَشْنِش اللحمَ عَنْهَا وَهْىَ بَارِكَةٌ / كَمَا تُنَشْنِشُ كَفًّا فَاتِلٍ سَلَبَا
          attribution: مُرَّة بن مَحْكَان التَّميمىّ
        - idx: 4
          type: poetry
          text: يراعَ سَيْلٍ كالْيَرَاعِ الْأَسلابْ
          attribution: رُؤْبة
        - idx: 5
          type: poetry
          text: ما شَقَّ جَيْبٌ ولا ناحتْكَ نائحةٌ / ولا بَكَتْكَ جيادٌ عندَ أسلابِ
          attribution: null
