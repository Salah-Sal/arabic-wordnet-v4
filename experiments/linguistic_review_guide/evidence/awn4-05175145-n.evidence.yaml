          - entry_id: 730718
            dictionary_id: 95
            headword: أسلوب المشروع
            headword_bare: أسلوب المشروع
            headword_norm: اسلوب المشروع
            root: سلب
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'تقديم مشروعات للتلاميذ في صيغة وضعيات تعليمية تتعلق بمشكلة اجتماعية واضحة، تجعل التلاميذ يشعرون
              بميل حقيقي لبحثها وحلها بحسب قدرات كل منهم، وذلك بتوجيه وإشراف المدرس وبالاعتماد على ممارسة أنشطة ذاتية متعددة
              في مجالات شتى. وتنطلق هذه الطريقة من تجاوز الحدود الفاصلة بين المواد الدراسية، فتتداخل هذه المواد لكي تتمحور
              حول مجموعة من الأنشطة الهادفة، وبهذا تصبح المعلومات والمعارف مجرد وسيلة لا غاية. وتتحدد خطوات طريقة المشروع
              في: اختيار المشروع وتحديد أهدافه بإشراك التلاميذ، تخطيط المشروع وتنظيمه، تنفيذ المشروع، وتقويم المشروع.'
            translation_en: project method
            translation_fr: méthode du projet
