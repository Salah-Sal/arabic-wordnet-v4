                يُعْمل مِنْهُ الحبالُ. وَقِيلَ هُوَ لِيف المُقْل، وَقِيلَ خُوص الثُّمام. وَقَدْ جَاءَ فِي حَدِيثٍ «أَنَّ النَّبِيَّ
                صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ لَهُ وِسَادة حشوُها سَلَبٌ» .(هـ) وَمِنْهُ حَدِيثُ صِفَةِ مَكَّةَ
                «وأَسْلَبَ ثُمامُها» أَيْ أخْرَج خُوصَه.'
