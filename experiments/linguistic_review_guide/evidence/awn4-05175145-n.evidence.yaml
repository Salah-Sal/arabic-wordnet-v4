          - entry_id: 804061
            dictionary_id: 113
            headword: سَلَبَهُ
            headword_bare: سلبه
            headword_norm: سلبه
            root: سلب
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'سَلَبَهُ سَلْباً وسَلَباً: اخْتَلَسَهُ،كاسْتَلَبَهُ. ورجُلٌ وامرأةٌ سَلَبوتٌ وسَلاَّبَةٌ.والسَّلِيبُ:
              المُسْتَلَبُ العَقْلِ، ج: سَلْبَى.وناقَةٌ وامْرَأةٌ سَالِبٌ وسَلوبٌ وسَليبٌ ومُسَلِّبٌ وسُلُبٌ: ماتَ وَلَدُها،
              أو ألْقَتْهُ لِغَيْرِ تَمامٍ، ج: سُلُبٌ وسَلائِبُ. وقد أَسْلَبَتْ، فهي مُسْلِبٌ.وشَجَرَةٌ سَليبٌ: سُلِبَتْ ورَقَها
              وأغْصانَها.وفَرَسٌ سَلْبُ القَوائِمِ: خَفيفُها.والسَّلْبُ: السَّيْرُ الخَفيفُ السَّريعُ، وبالكسرِ: أطْوَلُ أداةِ
              الفَدَّانِ، أو خَشَبَةٌ تُجْمَعُ إلى أَصْلِ اللُّؤَمَةِ، طَرَفُها في ثَقْبِ اللَّؤَمَةِ. وكَكَتِفٍ: الطَّويلُ،
              والخَفيفُ، وبالتَّحْرِيكِ: ما يُسْلَبُ، ج: أسْلابٌ، وشَجَرٌ طَويلٌ، ونَباتٌ،وـ منَ الذَّبيحَةِ: إهابُها وأكْرُعُها
              وبَطْنُها،وـ من القَصَبَةِ: قِشْرُها، وليفُ المُقْلِ، ولِحاءُ شَجَرٍ باليَمَنِ يُعْمَلُ منهُ الحِبالُ.وسُوقُ
              السَّلاَّبينَ: بالمَدينةِ الشَّرِيفةِ، م.وأسْلَبَ الشَّجَرُ: ذَهَبَ حَمْلُها، وسَقَطَ ورَقُها.والأُسْلُوبُ:
              الطَّريقُ، وعُنُقُ الأَسَدِ، والشُّمُوخُ في الأَنْفِ.وانْسَلَبَ: أسْرَعَ في السَّيْرِ جِدّاً.وتَسَلَّبَتْ: أحَدَّتْ
              على زَوْجِها.والسُّلْبَةُ، بالضم: الجُرْدَةُ، تَقولُ: ما أحْسَنَ سُلْبَتَها. وكمُعَظَّمٍ: ع قُرْبَ زَبيدَ.وسَلِبَ،
              كَفَرِحَ: لَبِسَ السِّلابَ، وهي الثِّيابُ السُّودُ، ج: ككُتُبٍ.والمُسْتَلِبُ: سَيْفُ عَمْرو بنِ كُلْثومٍ، وآخَرُ
              لأبي دَهْبَلٍ.'
