      - entry_id: 47064
        dictionary_id: 2
        headword: سَلَب
        headword_bare: سلب
        headword_norm: سلب
        root: سلب
        root_source: ocr
        pos: noun
        form: null
        is_partial: 1
        definitions_text: 'ما يُسْلَبُ به ضربٌ من الشجر تُسْتخْرَجُ منه مُشاقة بيضاءُ كالليف, وهو من أَجْود ما يُتَّخذ منه
          الحبالُ. واحدتُه: سَلَبَةٌ نباتٌ يَنبُتُ أمثالَ الشَّمع الذى يُستصبح به فى خِلْقتهِ إلا أنه أعظمُ وأطولُ, يتخذُ
          منه الحبالُ على كل ضَرْب لحاءُ شَجَرٍ معروفٍ باليمن, تُعمل منه الحبالُ, وعلى هذا يُخَرَّجُ قولُ العامة للحبل المعروف
          سَلَبة ليفُ المُقَل والنَّخْل قِشْرٌ من قُشور الشجر تُعمل منه السِّلال الماءُ الذى يسيلُ من القِرْبة من القَصَبة
          والشجرة: قِشرُها من الذبيحة: إهابُها وأكراعُها وبطْنُها ورأسُها'
        translation_en: null
        translation_fr: null
        domain: null
        external_id: Al_Mujam_Al_Kabeer:Vol_13:page_0067:0
        dict_key: Al_Mujam_Al_Kabeer
