          - entry_id: 794349
            dictionary_id: 112
            headword: أسلوب الحكيم
            headword_bare: أسلوب الحكيم
            headword_norm: اسلوب الحكيم
            root: سلب
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'أسلوب الحكيم: هو عبارة عن ذكر الأهم تعريضا للمتكلم على تركه الأهم، كما قال الخضر صلى الله عليه
              وسلم حين سلم عليه موسى إنكار السلامة؛ لأن السلام لم يكن معهودًا في تلك الأرض. بأني بأرضك السلام، وقال موسى صلى
              الله عليه وسلم في جوابه: أنا موسى، كأنه قال لموسى: أجبت عن اللائق بك وهو أن تستفهم عني لا عن سلامي بأرضي.'
