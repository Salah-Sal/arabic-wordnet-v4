            definitions_text: تسلسل من الكائنات حيث يتم في أول حلقة استقبال الطاقة من أشعة الشمس وتحويلها عن طريق التمثيل
              الضوئي وتخزينها في مركبات عضوية، يستعملها المستهلك من مستوى الحلقة التالية والذي يتغذى على الحلقة الأولى، وهكذا
              يستمر التسلسل الغذائي. كل كائن في سلسلة يأكل الذي يسبقه في السلسلة ويُؤْكَل من قبل عضو الحلقة التالية من التسلسل.
              نادرا ما تحتوي السلسلة على أكثر من ستة حلقات، في بداية السلسلة يوجد الكائن الذاتي التغذية وفي النهاية توجد أكبر
