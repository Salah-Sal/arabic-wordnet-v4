          - entry_id: 377881
            dictionary_id: 55
            headword: أسلوب الحماية
            headword_bare: أسلوب الحماية
            headword_norm: اسلوب الحماية
            root: سلب
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'يُوضّح مُلائمة عناصر التشغيل الكهربائية (الأجهزة والمصابيح وموادّ التركيبات الكهربائية مثلاً)
              للظروف البيئية المُختلفة. وتُقسَّم أساليبُ الحماية تبعاً للمُواصفة الألمانية القياسية (DIN) رقم 40050، ويتمُ
              تمييزها بحروفٍ مُختصرةٍ معروفةٍ عالمياً (IP = International Protection = حماية دولية)، إذ يتبع الإختصار IP دوماً
              رقمان: يُشيرُ الأول منهما إلى الحماية ضد دخول الأجسام الصلبة، أما الثاني فيعطي درجة الحماية ضد دخول الماء. وتعودُ
              تلك المُعطيات على المبايت الخام دون مُراعاة عوامل مثل التقادُم، وتبدّل درجات الحرارة، وعوامل أخرى مشابهة.'
            translation_en: protection class; protection grade; protection rating; degree of protection; sealing grade
