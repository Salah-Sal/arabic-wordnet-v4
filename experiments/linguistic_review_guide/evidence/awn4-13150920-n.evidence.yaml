          - entry_id: 832050
            dictionary_id: 120
            headword: نتخ
            headword_bare: نتخ
            headword_norm: نتخ
            root: تخخ
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'نتخ: (نَتَخَه يَنْتخُ نَزَعَه) ونُتِخَ فُلانٌ من أَصحابه: نُزِعَ. ونَتَخَتْه المَنيَّةُ من
              بَين قَومه، وَهُوَ مَجاز. (و) نَتَهٍ هـ: (قَلَعَهُ. والبازِي) يَنْتِخ نَتْخاً: نَسَرَ (اللَّحْمَ) بمِنْسَرِه
              و (خَطِفَه) وكذالك النَّسْرُ، وكذِّلك الغُرَابُ يَنتِخ الدَّبَرَة عَن ظَهْرِ البعيرِ. قَالَ الشَّاعِر:يَنْتِخُ
              أَعْينَها الغِرْبَانُ والرَّخَمُ(و) نَتَخَ (الثَّوْبَ: نَسَجَهُ) ، وَمِنْه حَدِيث ابْن عبّاس رَضِي الله عَنْهُمَا
              (إِنَّ فِي الجَنَّة بِسَاطاً مَنْتُوخاً بالذَّهَب) أَي منسوجاً. والناتِخ: الناسِجُ.(و) نَتَخَ (إِليه ببَصَرِهِ:
              نَظَرَ) .(و) النَّتْخ: النَّقْب.و (المِنْتَاخُ: المِنْقَاشُ) . والنَّتْخُ: إِخراجُك الشَّوْكَ بالمِنتاخَين وهما
              المِنقاش ذُو الطَّرعفين.(والمُتَنَتِّخُ: المُتَفَلِّي) .وَمِمَّا يسْتَدرك عَلَيْهِ:النَّتْخ: إِزالةُ الشَّيْءِ
              عَن موضِعه. ونَتَخَ الضِّرْسَ والشَّوْكَة يَنتِخُهما: استخْرجَهما. وَقيل: النَّتْخُ: الاستخراجُ عامّةً. ونَتَخْته:
              نَقَشْته. ونَتَخْته: أَهَنْته. ونَتَّخَ بِالْمَكَانِ تَنْتِيخاً: أَقامَ. ونَتَّخَ على الإِسلام: ثبَتَ ورسخَ،
              وَقد وردَ ذالك فِي حَدِيث عبد الله بن سَلاَم، فِي رِوَايَة.'
