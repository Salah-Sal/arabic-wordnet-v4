            تخَتّموا بالعَقيق فَقَالَ: هَذَا تصْحيفٌ، إِنَّمَا هُوَ لَا تُخَيِّموا بالعَقيق أَي: لَا تُقيموا بِهِ لِأَنَّهُ
            كَانَ خَراباً الواحِدةُ بهاءٍ، ج: عَقائِق. والعَقيقُ: الْوَادي، ج: أعِقّة وعَقائِقُ. (و) } العَقيقُ: كُلُّ مَسيلٍ
