            definitions:
            - sense_index: 0
              text: |-
                لتخ: اللتْخُ: لغة في اللطخ. وتلتخ: كتلطخ.
                ورجل لَتِخَة: داهية منكر، هكذا حكاه كراع، وقد نفى سيبويه هذا المثال
                في الصفات. واللَّتْخان: الجائع؛ عن كراع، والمعروف عند أَبي عبيد الحاء،
                وقد تقدم. الليث: اللتْخ الشق؛ يقال: لَتَخه بالسوط أَي سحله وقشر جلده.
