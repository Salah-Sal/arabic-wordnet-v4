        - sense_index: 0
          text: 'عقق! العَقيقُ، كأمِير: خَرَزٌ أحْمَر تُتّخذُ مِنْهُ الفُصوصُ، يكون باليَمَن بالقُرْبِ من الشِّحْر. يتكوّن
            ليَكُون مَرْجاناً، فيمنَعُه اليُبْس والبَرْد. قَالَ التّيفاشِيّ: يُؤْتَى بِهِ من اليَمَن من مَعادِن لَهُ بصَنْعاءَ،
            ثمَّ يؤتَى بِهِ الى عَدَن، وَمِنْهَا يُجْلَب الى سائِرِ البلادِ. قلتُ: وَقد تقدّم للمصنِّفِ فِي ق ر أأن معدِن
            العَقيق فِي موضِع قُرب صَنعاءَ يُقال لَهُ: مُقرأ. وبسَواحِل بحْرِ روميّة مِنْهُ جنْسٌ كدِرٌ، كماءٍ يجْري من اللّحْمِ
            المُمَلَّح، وَفِيه خُطوطٌ بيضٌ خفيّةٌ. قلت: وَهُوَ المَعْروف بالرُّطَبيّ، قالَه التّيفاشيُّ. وأجودُ أنواعِه الْأَحْمَر،
            فالأصْفر، فالأبيضُ، وغيرُها رَديء. وَقيل: المُشَطَّبُ مِنْهُ أجْوَد، وَهِي أصْليّةٌ لَا مُنقَلِبَة بالطّبْخ، كَمَا
            ظُنّ. حقّقه داودُ فِي التّذْكِرة. وَمن خَواصّ الْأَحْمَر مِنْهُ أنّ: مَنْ تخَتّم بِهِ سكَنَت روعتُه عِنْد الخِصام
            وَزَالَ عَنهُ الهمُّ والخَفَقان، وانْقَطَع عَنهُ الدّم من أَي موضِع كَانَ ولاسيّما النِّساء اللّواتي يَدُوم طمْثُهن،
            وشُربُه يُذهِب الطِّحال ويفْتَحُ السُّدَد. ونُحاتَةُ جَمِيع أصنافِه تُذهِب حفَر الأسْنان. ومحْروقُه يثبِّت متحَرِّكَها
            ويشُدُّ اللِّثَة. وَقد وردَ فِي بعْض الْأَخْبَار: تختّموا {بالعَقيقِ فإنّه برَكَة. وَقَالَ صاحبُ اللِّسان: ورأيتُ
