              تخ
              1 تَخَّ, (JK, S, L, K,) aor. ـِ (JK, L,) inf. n. تُخُوخٌ, (JK, L, and so in a copy of the S,) or تُخُوخَةٌ, (K, and so in a copy of the S,) or both, (TA,) It (dough) became sour: (JK, S, L, K:) it became soft by reason of too much water: and in like manner, clay, or mud, so that one could not plaster with it. (L.) Also, said of dough, It became leavened; or mature. (JK.) 4 اتخّهُ He made it sour; namely, dough: (JK, S, L, K:) he made it soft by putting into it too much water; namely, dough: and in like manner, clay, or mud, so that he could not plaster with it. (L.) تَخٌّ Sour dough: (JK, S, A, L, K:) such as is soft by reason of too much water. (L.) b2: Also Dregs of sesame-grain from which the oil has been expressed; (JK, L, K;) also called كُسْبٌ. (TA.) تَاخٌّ Having no desire for food [app. by reason of acidity in the stomach]. (JK, K.)
