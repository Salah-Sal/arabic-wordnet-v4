        headword: خد
        headword_bare: خد
        headword_norm: خد
        root: خدد
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: |-
          الْخَاء وَالدَّال
          الدَّخْدار: ثوب أَبيض، وَهُوَ بِالْفَارِسِيَّةِ: تخت دَار، أَي: يمسِكهُ التخت، أَي: ذُو تَخت.
          وَجَارِيَة دِخْدِبَةٌ: مكتنزة.
          والخُرْدولة: العُضو الوافر من اللَّحْم. وخَرْدل اللحمَ: قطع أعضاءه وافرة.
          وَقيل خَردل اللحمَ: قطّعه وفرّقه، والذال فِيهِ لُغَة.
          وَلحم خَراديل.
          والمُخَرْدَلُ: المَصروع.
          والخَرْدل: ضَرْبٌ من الحُرْف.
          وخَرْدلت النّخلة، وَهِي مُخَردلة: كثر نَفَضُها وعَظُم مَا بَقِي من بُسْرها.
          وخَردل الطعامَ: أكَل خِيَاره.
          وخَرْدب: اسْم.
          ودَرْبَخت الحمامةُ لذكرها: طاوعته للسِّفاد، قَالَ:
          وَلَو نقُول دَربِخُوا لدَرْبَخُوا لفَحْلنا إِذْ سَرّه التنُّوخُ
          والدَّرْبخة: الإصغاء إِلَى الشَّيْء والتذلّلُ، قَالَ ابْن دُرَيْد: احسبها سريانية.
          ودَرْبخ: ذَلّ، عَن ابْن الأعرابيّ وَلم يعْتَذر مِنْهُ، وَكَذَلِكَ حَكَاهُ يَعْقُوب، والحاء لُغَة. وَقد تقدم.
          ودَرْبَخَ الرجلُ: حَتىَ ظَهره، عَن اللحياني.
          وَأرى اللحيان حكى: امْرَأَة بَرَخْداةٌ، فِي " بَخَنْداة ".
          والمُخَرْمِدُ: الْمُقِيم فِي منزله، عَن كرَاع.
          وأمرْخدَّ الشَّيْء: استرخى.
          والخدلبة: مِشْيةٌ فِيهَا ضَعف.
          وناقة خِدْلِبٌ: مُسنة مسترخية فِيهَا ضعف.
          ونَوْمٌ دِلَّخْمٌ: خَفِيف.
          وَقيل: طَوِيل.
          والدِّلَّخْمُ: الدَّاء الشَّديد.
          وكل ثَقيل: دِلَّخْمٌ. وخَندف الرجلُ: أسْرع.
          وَأما ابْن الْأَعرَابِي فَقَالَ: هُوَ مُشْتَقّ من " الخدف " وَهُوَ الاختلاس، فَإِن صَحَّ ذَلِك فالخَندفة ثلاثية، وَالْمَعْرُوف انه رباعي.
          والخنْدفة: أَن يمشي مفاجاً ويَقْلب قَدَمَيْهِ كَأَنَّهُ يغْرف بهما، وَهُوَ من التَّبختر.
          وَقد خَندف، وَخص بَعضهم بِهِ الْمَرْأَة.
          وخِنْدف: اسْم امراة، مُشْتَقّ من ذَلِك، وَبِه سُميت القَبيلة.
          وَرجل خندب: سيئ الْخلق.
          وخُنْدبانٌ: كثير اللَّحْم.
          وَامْرَأَة بَخْدنٌ: رَخْصةٌ ناعمة تارّة.
          وبَخْدَنُ، وبِخْدِنُ. والبِخْدِنُ، كل ذَلِك: اسْم امْرَأَة، قَالَ: يَا دارَ عَفراءَ وَدَار البِخْدِنِ والخِنْدِمانُ: اسْمُ قَبيلَة.
