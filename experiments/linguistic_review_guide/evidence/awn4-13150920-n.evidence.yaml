        - sense_index: 1
          text: 'من الزَّهرة : ما يحمل أوراقها .'
          is_raw: 0
        - sense_index: 2
          text: 'تَخْت الآلاتِ : اصطلاح فى الموسيقى العربية , ويُقصَد به الجماعةُ المصاحبةُ للمغنِّى بعدَدٍ من الآلات الموسيقية
            مع المُنشدين المساعدين المردِّدين لِمَذْهبِ الدَّور أو جُزء منه . وتتألَّف هذه الجماعة من رَئيسٍ وثلاثةٍ ممن يضربون
            على الآلات الوترية وهى القانون والعُودُ والكَمان , ومن ضَابِطٍ يزمُرُ بالنَّاى وآخر يَنْقُرُ بالدُّفِّ لضَبْطِ
            الإيقاع , ويُساعد المغنى إلى جانب هؤلاء اثنان أو أكثر لترديد بعض أجزاء الدَّور .'
