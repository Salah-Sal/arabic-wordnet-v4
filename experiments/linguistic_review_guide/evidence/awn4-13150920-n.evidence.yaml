        definitions_text: |-
          ختر
          1 خَتَرَتْ نَفْسُهُ His soul [or stomach] became  heavy; or heaved, or became agitated by a tendency to vomit; syn. خَبُثَتْ: (IAar, K:) and became in a corrupt, or disordered, state. (K.) A2:  خَتَرَهُ, (S, K, *) aor. ـِ and خَتُرَ, (K,) inf. n. خَتْرٌ (S, A, K) and خُتُورٌ, (K,) He acted, or behaved, towards him with perfidy, treachery, or unfaithfulness: (S, K: *) or with the foulest perfidy or treachery or unfaithfulness: (A, K:) or with deceit, guile, or circumvention: (K:) or in a bad, or corrupt, manner. (Ibn-'Arafeh.) and خَتَرَ بِالعَهْدِ [He was unfaithful, &c., to the compact, or covenant]. (TA, from a trad.) 2 ختّرهُ, inf. n. تَخْتِيرٌ, said of wine, or beverage, It corrupted, or disordered, his soul [or stomach], (Ibn-'Arafeh, K,) and rendered him relaxed. (Ibn-'Arafeh.) 5 تختّر He (a man, TA) was, or became, languid, (تَفَتَّرَ,) and relaxed, and heavy, or sluggish, and fevered: (K:) he was, or became, languid in body, in consequence of disease &c.: (TA:) and his intellect became confused, from drinking milk and the like. (K.) And تختّرت نَفْسُهُ His  soul [or stomach] was, or became, languid. (TA.) b2:  He walked with the gait of him who is heavy, or sluggish. (K.) خَتَرٌ Languor (خَدَرٌ), (K,) or the like thereof, (TA,) that betides on the occasion of drinking medicine or poison, (K, TA,) such as weakens and intoxicates. (TA.) خَتُورٌ: see what follows.
          خَتِيرٌ: see what follows.
          خَتَّارٌ: see what follows.
          خِتِّيرٌ: see what follows.
          خَاتِرٌ (K) and [in an intensive sense] ↓ خَتَّارٌ (S, A, K) and ↓ خَتِيرٌ and ↓ خَتُورٌ and ↓ خِتِّيرٌ (K) One who acts, or behaves, with perfidy, treachery, or unfaithfulness: (S, K:) or with the foulest perfidy or treachery or unfaithfulness: (A, K:) or with deceit, guile, or circumvention: (K:) [or in a bad, or corrupt, manner: (see 1:) the second and following epithets signifying one who does so much, or frequently, or habitually.]
