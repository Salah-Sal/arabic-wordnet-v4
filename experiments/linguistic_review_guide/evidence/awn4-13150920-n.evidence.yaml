          أدْري شِمْتَ عَقيقَة أم شِمتُ} عقيقة أَي: سَللتَ سَيفاً أم نظَرتُ الى برْقٍ. وَهِي البَرقَة الَّتِي تستَطيل فِي
          عُرْضِ السّحابِ، وَقد أكثَروا استِعارَتَها للسّيف، حَتَّى جعَلوها من أسمائِه، فَقَالُوا: سَلّوا {عَقائِقَ} كالعَقائِق.
          وَقَالَ ابنُ الأعرابيّ: العَقيقَة: المَزادَة. والعَقيقَة: النّهْر.والعَقيقَة: العِصابةُ سَاعَة تُشَقُّ من الثّوْب.
          وَقَالَ أَبُو عُبَيْدة، وابنُ الأعرابيّ أَيْضا: العَقيقَة: غُرْلَة الصّبيّ إِذا خُتِن. وَالْأَصْل فِي كلِّ ذَلِك
          {عَقّ} يعُقّ {عقّاً: إِذا شقّ وقطَع، فَهُوَ} معْقوقٌ {وعَقيقٌ. وَمِنْه تسمِيَةُ شَعَر الموْلودِ عَقيقَة، لِأَنَّهُ
          إِن كَانَ على رأسِ الإنسيّ حُلِقَ وقُطِع، وَإِن كَانَ على البَهيمة فإنّها تُنْسِلُه. والذّبيحَة تُسمّى عَقيقة لِأَنَّهَا
          تُذبَح، فيُشَقّ حُلْقومها ومَريئُها وودَجاها قطْعاً، كَمَا سُمّيَت ذَبيحةً بالذّبْح، وَهُوَ الشّقُّ. (و) } عقّ عَن
          الْمَوْلُود {يعِقُّ} ويَعُقّ: حلَق {عَقيقَتَه، أَو ذبَح عَنهُ شَاة.وَفِي التّهذيب والصِّحاح: يومَ أسبوعِه، فقيّدَه
          بالسّابع. قَالَ اللّيثُ: تُفصَل أعضاؤُها، وتُطْبَخُ بماءٍ ومِلْح، فيَطْعَمُها الْمَسَاكِين. وَفِي الحَدِيث: أنّ
          النّبي صلّى الله عَلَيْهِ وسلّم عقّ عَن الْحسن والحُسين رَضِي الله عَنْهُمَا. وعقّ بالسّهْم: إِذا رمَى بِهِ نحْوَ
          السّماءِ، وذلِك السّهمُ يُسَمّى} عَقيقةً وَهُوَ سهم الاعْتِذار، وَكَانُوا يفعَلونه فِي الجاهليّة، فَإِن رجَع السّهم
          مُلطَّخاً بالدّم لم يرْضوا إِلَّا بالقَوْد، وَإِن رجعَ نقيّاً مسَحوا لِحاهُم، وصالَحوا على الدِّيّة. وَكَانَ مسْحُ
          اللِّحَى عَلامَة للصُّلْح، كَمَا فِي العُباب. وَفِي اللّسان: أصلُه أَن يُقتَل رجلٌ من القَبيلة، فيُطالَب القاتِلُ
          بدَمِه، فتجْتَمع جَماعة من الرّؤساءِ الى أولياءِ القَتيل، ويعْرِضون عَلَيْهِم الدِّيَة، ويسألون العَفْوَ عَن الدّم،
          فإنْ كَانَ وليُّه قَوِيا حَميّاً أَبى أخعذَ الدِّيَة، وَإِن كانَ ضَعيفاً شاورَ أهلَ قبيلَتِه، فَيَقُول للطّالِبين:
          إنّ)بينَنا وَبَين خالِقنا عَلامَة للأمْر والنّهْي، فيقولُ لَهُم الآخَرون: مَا عَلامَتُكم فَيَقُولُونَ: نأخذُ سهْماً
          فنُركِّبُه على قوْس، ثمَّ نرْمي بِهِ نَحْو السّماء، فَإِن رجعَ إِلَيْنَا مُلَطَّخاً بالدّم فقد نُهينا عَن أخذِ الدِّية،
          وَلم يرْضَوا إِلَّا بالقَوَد، وَإِن رجَعَ نقِياً كَمَا صعَد فقد أُمِرْنا بأخذِ الدِّية، وصالَحوا، فَمَا رجَع هَذَا
          السّهمُ قطُّ إِلَّا نقِيّاً، وَلَكِن لَهُم بِهَذَا عُذْر عِنْد جُهّالِهم. وَقَالَ شاعِرٌ من أهل الْقَتِيل وَقيل:
          من هُذَيْل. وَقَالَ ابنُ بَرّي: هُوَ للأشْعَر الجُعْفِيّ وَكَانَ غائِباً عَن هَذَا الصُلْح:( {عَقّوا بسَهْمٍ ثمّ
          قَالُوا صالِحوا ... يَا ليتَني فِي القَوْم إذْ مسَحوا اللِّحَى)قَالَ الأزهَريُّ: وَأنْشد الشافِعي للمُتَنَخِّل الهُذَلي:(عقّوا
          بسَهْمٍ وَلم يشْعُر بِهِ أحدٌ ... ثمَّ استفاءُوا وَقَالُوا حبّذا الوضَحُ)أخْبَرَ أنّهم آثَروا إبِلَ الدِّيَة وألبانَها
          على دمِ قاتِل صاحِبهم. والوَضَح هَاهُنَا: اللّبَن. ويُروى عقّوا بسَهم بِفَتْح الْقَاف، وَهُوَ من بابِ المُعْتَلّ.}
          وعقَّ والِدَه {يعُق} عقًّا، و {عُقوقاً بالضّمِّ} ومَعَقّة: شَقّ عَصا طاعَتِه، وَهُوَ ضِدُّ بَرَّه وَقد يُعَمّ بلَفْظ
          العُقوق جميعُ الرّحِم. وَفِي الحَدِيث: أكبَرُ الكَبائِر الإشراكُ بِاللَّه، وعُقوق الوالِدَين، وقَتْلُ النّفْس، واليَمين
          الغَموس. وَأنْشد لسَلَمة المخْزوميّ:(إنّ الْبَنِينَ شِرارُهم أمثالُه ... مَنْ عقّ والدَه وبَرَّ الأبعدا)وَقَالَ
          زُهَير: (فأصْبحْتُما فِيهَا على خيْرِ موْطِن ... بعيدَيْنِ فِيهَا من عُقوق ومأثَمِ)وَقَالَ آخر، وَهُوَ النَّابِغَة:(أحْلامُ
          عادٍ وأجْسامٌ مطهَّرَةٌ ... من {المَعَقّةِ والآفاتِ والأثَمِ)فَهُوَ} عاقٌّ {وعَقٌّ. وَمِنْه قولُ الزَّفَيان واسمُه
