            is_partial: 0
            definitions_text: '(وتخ) - في حَديث عبد الرحمن بن أزْهَرَ - رضي الله عنه -: "في السَّكْرَانِ منهم مَن ضَربَه بالمِيْتَخَة"قال
              ابنُ وَهْب: يعنى الجريدَةَ الرَّطبَةَ، وقال الخطابىُّ: هي اسمٌ للعَصَا الخَفِيفَةِ.وقال أَبُو زيدٍ: يُقالُ:
              للعَصَا المِتْيَخَة والمِيتَخَة والمِتّيخَة؛ فمَن قال: مِيتَخَةٌ فهى مِفْعَلةٌ من وتَخَ يَتِخُ، ومنِ قال: مِتْيَخَة
              فهو من تَاخَ يتيخُ أوْ يَتُوخُ، ومَن قال: مِتِّيخَةٌ فهى من مَتَخَ الجرادُ؛ إذا أرَزَّ أذنَابَه في الأرض ليَبيضَ.'
