                (اللِّسَان) : تُعطِي أَنّه فِي المرأَة مَدْحٌ أَيضاً، فليُنظَر.(و) فِتَاخٌ، (كَكتَابٍ) ، اسْم (ع) .(وفُتُوخُ
                الأَسَد) ، بالضّمّ: (مَفَاصلُ مَخَالِبِه) ، هاكذا فِي النُّسخ، والّذي فِي اللِّسَان الفَتخْ عرَضُ مَخالبِ
                الأَسدِ ولِينُ مَفاصِلها (وأَفْتَخَ) الرَّجُلُ: ارْتَخَى، و (أَعْيَا وانْبَهَرَ) .(والأَفاتِيخُ من الفُقُوعِ
                هَنَوَاتٌ) ، وَفِي بعض الأُصول. هَنَات (تَخْرُجُ أَوّلاً) ، وَفِي بعض الأُصول. فِي أَوّله، (فتُظَنّ كَمْأَةً)
                ، وَفِي بعض الأُصول: فيَحبسها النّاسُ كَمْأَةً (حَتَّى تُستَخْرَجَ فتُعْرَفَ) حَكَاهُ أَبو حنيفةَ، وَلم يَذكر
                للأَفَاتِيخ وَاحِدًا.(ورَجُلٌ) ، وَفِي (الأَساس) : وظَبْيٌ (أَفْتَخْ الطَّرْفِ: فاتِرُه) .(و) فُتَيْخٌ (كَزُبَيْرٍ:
                ع) . وَفِي (اللِّسَان) : فُتَيْخٌ وفَتَّاخٌ دَحْلاَنِ بأَطْرَاف الدّهْنَاءِ مِمَّا يَلِي اليمامةَ، عَن الهَجريّ.وَمِمَّا
                يسْتَدرك عَلَيْهِ:الفَتْخُ والفَتْخَة: باطِنُ مَا بينَ العَضُدِ والذّراعِ. والفَتَخُ فِي الرِّجّلَيْن طُولُ
                العَظْمِ وقِلْةُ اللَّحْمِ (قَالَ الشَّاعِر:على فَتْحَاءَ تَعْلَمُ حِين تَنْجُووَمَا إِنْ حَيْثُ تَنْجُو من
                طَرِيقِقَالَ: عَنَى بالفَتخاءِ رِجْلَه، قَالَ: وهاذا صفةُ مُشتار العسلَ) .وَقَالَ الأَصمعي: فَتْخاءُ قَدَمٌ
                ليِّنةٌ. وَقَالَ أَبو عَمرو: فِيهَا عَوَجٌ، وَفِي (الأَساس) : وتَفتَّختِ المرأَةُ، وخَرَجَتْ مُتفَتِّخةً.
                والضَّفادِهُ فُتْخ الأَرْجُلِ.'
