          السّيوفُ فتُسمّى عَقائِقَ. قَالَ عنْتَرَةُ:(وسَيْفي! كالعَقيقَةِ فَهُوَ كِمْعِي ... سِلاحي لَا أفَلَّ وَلَا فُطارا) وَأنْشد
