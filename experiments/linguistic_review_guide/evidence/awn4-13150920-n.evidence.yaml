        is_partial: 0
        definitions_text: 'عقق! العَقيقُ، كأمِير: خَرَزٌ أحْمَر تُتّخذُ مِنْهُ الفُصوصُ، يكون باليَمَن بالقُرْبِ من الشِّحْر.
          يتكوّن ليَكُون مَرْجاناً، فيمنَعُه اليُبْس والبَرْد. قَالَ التّيفاشِيّ: يُؤْتَى بِهِ من اليَمَن من مَعادِن لَهُ
          بصَنْعاءَ، ثمَّ يؤتَى بِهِ الى عَدَن، وَمِنْهَا يُجْلَب الى سائِرِ البلادِ. قلتُ: وَقد تقدّم للمصنِّفِ فِي ق ر أأن
          معدِن العَقيق فِي موضِع قُرب صَنعاءَ يُقال لَهُ: مُقرأ. وبسَواحِل بحْرِ روميّة مِنْهُ جنْسٌ كدِرٌ، كماءٍ يجْري من
          اللّحْمِ المُمَلَّح، وَفِيه خُطوطٌ بيضٌ خفيّةٌ. قلت: وَهُوَ المَعْروف بالرُّطَبيّ، قالَه التّيفاشيُّ. وأجودُ أنواعِه
          الْأَحْمَر، فالأصْفر، فالأبيضُ، وغيرُها رَديء. وَقيل: المُشَطَّبُ مِنْهُ أجْوَد، وَهِي أصْليّةٌ لَا مُنقَلِبَة بالطّبْخ،
          كَمَا ظُنّ. حقّقه داودُ فِي التّذْكِرة. وَمن خَواصّ الْأَحْمَر مِنْهُ أنّ: مَنْ تخَتّم بِهِ سكَنَت روعتُه عِنْد
          الخِصام وَزَالَ عَنهُ الهمُّ والخَفَقان، وانْقَطَع عَنهُ الدّم من أَي موضِع كَانَ ولاسيّما النِّساء اللّواتي يَدُوم
          طمْثُهن، وشُربُه يُذهِب الطِّحال ويفْتَحُ السُّدَد. ونُحاتَةُ جَمِيع أصنافِه تُذهِب حفَر الأسْنان. ومحْروقُه يثبِّت
          متحَرِّكَها ويشُدُّ اللِّثَة. وَقد وردَ فِي بعْض الْأَخْبَار: تختّموا {بالعَقيقِ فإنّه برَكَة. وَقَالَ صاحبُ اللِّسان:
          ورأيتُ فِي حاشيةِ بعْضِ نُسَخ التّْذيب الموْثوق بهَا.قَالَ أَبُو الْقَاسِم: سُئل إبْراهيمُ الحَرْبيُّ عَن الحَدِيث:
          لَا تخَتّموا بالعَقيق فَقَالَ: هَذَا تصْحيفٌ، إِنَّمَا هُوَ لَا تُخَيِّموا بالعَقيق أَي: لَا تُقيموا بِهِ لِأَنَّهُ
          كَانَ خَراباً الواحِدةُ بهاءٍ، ج: عَقائِق. والعَقيقُ: الْوَادي، ج: أعِقّة وعَقائِقُ. (و) } العَقيقُ: كُلُّ مَسيلٍ
          شَقّه ماءُ السّيْل فأنْهَرَه ووسّعه، والجَمْع كالجَمْع.والعَقيقُ: ع بالمَدينة على ساكنِها أفضَلُ الصّلاةِ والسّلام،
          فِيهِ عُيونٌ ونَخيلٌ، وَهُوَ الَّذِي وردَ ذِكرُه فِي الحَدِيث: أَنه وادٍ مُباركٌ كأنّه عُقَّ، أَي: شُقَّ، غلَبت
          الصِّفةُ عَلَيْهِ غلَبةَ الاسْم، ولزِمَتْه الألِف واللاّم لِأَنَّهُ جُعِلَ الشّيء بعَيْنه، على مَا ذهَب إِلَيْهِ
          الخَليلُ فِي أسْماءِ الأعْلامِ الَّتِي أصلُها الصّفة كالحارِث والعبّاس. وَأَيْضًا: موضِع باليَمامَة وَهُوَ وادٍ
          واسعٌ ممّا يَلي العرَمة، تتدفّق فِيهِ شِعابُ العارِض، وَفِيه عُيون عذْبة الماءِ. وَأَيْضًا: مَوضِع بتِهامَة وَمِنْه
          الحَدِيث: وقّتَ لأهْل العِراقِ بطْنَ العَقيق. قَالَ الأزهريُّ: أرادَ العَقيقَ الَّذِي بالقُرْبِ من ذاتِ عِرْق قبلَها
          بمَرْحَلة أَو مرْحلَتَيْن. وَهُوَ الَّذِي ذكَره الشافِعيُّ رحِمه الله فِي المَناسِك، وَهُوَ قَوْله: وَلَو أهَلّوا
          من العَقيق كَانَ أحبَّ إليّ. وَأَيْضًا: موضِع بنَجْد يُقال لَهُ: عَقيقُ القَنان، تجْرِي إِلَيْهِ مياهُ قُلَل نجْدٍ
          وجِبالِه.والعَقيق: ستّة مواضِع أُخَر وَهِي أودِيَة شقّتْها السَّيْلُ عاديّةٌ، مِنْهَا العَقيقان: بلدان فِي بِلَاد
          بني عامِر من ناحيةِ الْيمن، فَإِذا رأيتَ هَذِه اللفظَة مُثنّاةً فإنّما يفعْنى بهَا ذانِكَ البَلَدان، وَإِذا رأيتَها)مُفْردَة
          فقد يجوزُ أَن يُعْنَى بهَا العَقيق الَّذِي هُوَ وادٍ بالحجاز، وَأَن يُعْنى بهَا أحد هذَيْن البلَدين لأنّ مثْل هَذَا
          قد يُفْرد، كأبانَيْن. والعَقيقُ: شعَر كُلِّ موْلود يخرجُ على رأسِه فِي بطْنِ أمّه من النّاس. قَالَ أَبُو عُبَيد:
          وَكَذَلِكَ من البَهائِم، {كالعِقّة بِالْكَسْرِ، والعَقيقَة كسَفينة. وَأنْشد الأزهريُّ للشَّمّاخ:(أطار} عَقيقَه عَنهُ
          نُسالاً ... وأُدمِج دَمْجَ ذِي شَطَنٍ بَديعِ)أَرَادَ شَعْره الَّذِي يولَد عَلَيْهِ أنّه أنْسَله عَنهُ. وَأنْشد أَبُو
          عُبَيد لِابْنِ الرِّقاع يصف العَيْر:(تحسّرَتْ {عِقّةٌ عَنهُ فأنْسَلَها ... واجْتابَ أخْرى جَديداً بَعْدَمَا ابْتَقَلا)يَقُول:
          لمّا تربّع وأكَلَ بُقولَ الرّبيع أنْسَلَ الشّعرَ المولودَ مَعَه، وأنْبَتَ الآخر، فاجْتابَه، أَي: اكْتَساه. وَفِي
          الحَدِيث: كُلّ موْلودٍ مُرْتَهَنٌ} بعَقيقَتِه أَي: العَقيقةُ لازِمةٌ لَهُ، لابُدّ لَهُ مِنْهَا. قَالَ الليثُ: وَإِذا
          سقَطَ عَنهُ الشّعْر مرّةً ذهبَ ذَلِك الاسْم مِنْهُ. قَالَ امْرُؤ القَيس:(يَا هِنْدُ لَا تنْكِحي بوهَةً ... عليهِ
          {عَقيقَته أحْسَبا)وَقد مرّ تمامُ الأبيات فِي ر س ع يصِفُه باللّؤْم والشُحِّ، أَي: لم يحْلِق عَقيقَتَه فِي صغَرِه
          حتّى شاخ. وَقَالَ زُهير:(أذلِك أمْ أقَبُّ البَطْنِ جأْبٌ ... عَلَيْهِ من} عَقيقَتِه عِفاءُ)وَفِي الحَدِيث: إِن انفَرَقَتْ
          عَقيقتُه فرَق أَي شعره، سُمّي! عَقيقةً تشْبيهاً بشَعْر الْمَوْلُود. أَو {العِقّة بالكَسْر فِي الحُمُر والنّاس خاصّة
          وَلم تُقَلْ فِي غيْرهما، قَالَ أَبُو عُبَيد. قَالَ عديُّ بنُ زيْد العِباديّ يصِف حِماراً:(صَيِّتُ التّعْشير رَزّامُ
          الضُحى ... ناسِلٌ} عِقّته مثلُ المَسَدْ)ج: {عِقَق كعِنب. قَالَ رؤبةُ: كالهَرَويّ انْجابَ عَن لَيْلِ البَرَقْ طيّر
          عَنْهَا النّسْرُ حوْلِيَّ} العِقَقْ النَّسْر: السِّمَن. {والعَقيقةُ أَيْضا: صوفُ الجذَع كَمَا أنّ الجَنيبة: صوف
          الثّنِيّ. وسُمّيَت الشّاةُ الَّتِي تُذْبَحُ عِنْد حلْقِ شعَر الموْلودِ} عَقيقة لأنّه يُحْلَقَ عَنهُ ذلِك عندَ الذّبْح،
          وَلذَا جَاءَ فِي الحَدِيث: فأهرِيقوا عَنهُ دَمًا، وأميطُوا عَنهُ الأذَى يَعْنِي بالأذَى ذلِك الشَّعَر الَّذِي يُحْلَق
          عَنهُ، وَهَذَا من الأشياءِ الَّتِي ربّما سُمّيتْ باسْم غيْرِها إِذا كَانَت معَها، أَو من سَبَبِها. وَفِي الحَدِيث:
          أَنه سُئلَ عَن)العَقيقَة فَقَالَ: لَا أحِب {العُقوقَ لَيْسَ فِيهِ توْهينٌ لأمر} العَقيقة، وَلَا إسْقاطٌ لَهَا، وَإِنَّمَا
          كرِه الاسمَ، وأحَبَّ أَن تُسَمّى بأحْسَن مِنْهُ، كالنّسيكَةِ، والذّبيحَة، جرْياً على عادَتِه فِي تغْيير الاسْم القَبيح.وجعَل
          الزّمَخْشَريُّ الشَّعر أصْلاً، والشّاة المذبوحةَ مُشتَقّة مِنْهُ. والعَقيقَةُ من البَرْقِ: مَا يبْقَى فِي السَّحابِ
