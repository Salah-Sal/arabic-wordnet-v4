          - entry_id: 833049
            dictionary_id: 120
            headword: وتخ
            headword_bare: وتخ
            headword_norm: وتخ
            root: تخخ
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'وتخ: ( {وَتَخَه بالعَصَا: ضَرَبَه بهَا) .(} والوَتَخَة، محرّكةً: الوَحَلُ) .(و) عَن ابْن الأَعرابيّ:
              يُقَال: (مَا أَغْنَى) عنّى ( {وَتَخَةً: شَيئاً) : رَوَاهُ بالحاءِ وبالخاءِ.(} والمِيتَخَة) ، بِالْكَسْرِ! كالمِتْيَخَة.
              قَالَ شيخُنَا: هاذا اللّفظُ قد وردَ فِي الحَدِيث، وذَكرَ أَهلُ الْغَرِيب فِيهِ لُغاتٍ استوعبَها الزّمخشريُّ
              فِي الْفَائِق، وأَوردها ابْن الأَثير فِي النِّهاية فَقَالَ: هاذه اللّفظَةُ قد اختُلِف فِي ضَبْطِها، فَقيل بِكَسْر
              الْمِيم وَتَشْديد التاءِ، وبفتح الْمِيم مَعَ التَّشْدِيد، وبكسر الْمِيم وَسُكُون التاءِ قبل الياءِ، وبكسر الْمِيم
              وَتَقْدِيم الياءِ الساكنة على التاءِ. قَالَ الأَزهريّ وَهَذِه كلُّهَا أَسْمَاءٌ لجريد النّخْل وأَصلِ العُرْجون،
              وَقيل: هِيَ اسْم (العَصَا) ، وَقيل: القَضِيب الليِّن الدَّقِيق. وَقيل: كلُّ مَا ضُرِبَ بِهِ من جَريدٍ أَو عَصا
              أَو دِرَّةٍ.( {وأَوْتَخْتَ مِنِّي: بلَغْتَ منِّي) الجهْدَ قَالَ ثَعْلَب: استجاز ابْن الأَعرابيّ الْجمع بَين
              الحاءِ والخاءِ هُنَا لتقارُب المخرجين. قَالَ: وَالصَّوَاب: أَوتحا أَي قَلَّلَ أَو أَقلَّ.'
