          وَفِي الحَدِيث: أَتَاهُ رجُلٌ مَعَه فرَسٌ عَقوقٌ، أَي: حائِل أَو هُوَ على التّفاؤل كَمَا ظنّه أَبُو حَاتِم قَالَ:
          كأنّهم أَرَادوا أنّها ستحْمِل إِن شاءَ الله تَعَالَى. قَالَ الأزهريّ: وَهَذَا يفرْوى عَن أبي زيْد ج:} عُقُقٌ، بضمّتين
