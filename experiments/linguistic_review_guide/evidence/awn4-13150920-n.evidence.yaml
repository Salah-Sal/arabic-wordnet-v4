          لحَمْزَة رَضِي الله عَنهُ حِين رَآهُ مقْتولاً: ذُقْ عُقَقُ أَي: ذُق جَزاءَ فِعلِك يَا {عاَقّ، كَمَا فِي الصِّحاح.
          ويُروى أَيْضا: رجُلٌ عُقُق بضمّتين أَي: عاقٌّ، كَمَا فِي اللّسان جمْع الأولى:} عقَقَة، مُحرَّكَة ككافر وكفَرة، كَمَا
