            definitions:
            - sense_index: 0
              text: |-
                (وت خَ)
                الوتخة، بِفَتْح التَّاء: الوحل.
                وأوتخه: جهده وَبلغ مِنْهُ، عَن ابْن الاعرابي، وَأنْشد:
                دَرادقا وهْي السُّبوخ قُرَّحَا قَرْقَمهم عيشٌ خبيثٌ أوتَخَا
                قَالَ ثَعْلَب: استجاز ابنُ الْأَعرَابِي الْجمع بَين الْخَاء والحاء هُنَا لتقارب المَخرجَين، قَالَ: وَالصَّوَاب " أوتحا "، بِالْحَاء، أَي: قلّل، أَو أقل.
