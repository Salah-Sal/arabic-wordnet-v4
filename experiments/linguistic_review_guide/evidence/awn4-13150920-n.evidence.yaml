            شيوخِنا أنّ الفرَس الحامِل يُقال لَهَا: عَقوق، وَيُقَال أَيْضا للحائِل: عَقوقٌ. وَفِي الحَدِيث: أَتَاهُ رجُلٌ
            مَعَه فرَسٌ عَقوقٌ، أَي: حائِل أَو هُوَ على التّفاؤل كَمَا ظنّه أَبُو حَاتِم قَالَ: كأنّهم أَرَادوا أنّها ستحْمِل
