      - entry_id: 67720
        dictionary_id: 2
        headword: التَّخْت
        headword_bare: التخت
        headword_norm: التخت
        root: تخت
        root_source: ocr
        pos: noun
        form: null
        is_partial: 1
        definitions_text: 'وعاءٌ تُصان فيه الثِّياب . من الزَّهرة : ما يحمل أوراقها . تَخْت الآلاتِ : اصطلاح فى الموسيقى العربية
          , ويُقصَد به الجماعةُ المصاحبةُ للمغنِّى بعدَدٍ من الآلات الموسيقية مع المُنشدين المساعدين المردِّدين لِمَذْهبِ
          الدَّور أو جُزء منه . وتتألَّف هذه الجماعة من رَئيسٍ وثلاثةٍ ممن يضربون على الآلات الوترية وهى القانون والعُودُ
          والكَمان , ومن ضَابِطٍ يزمُرُ بالنَّاى وآخر يَنْقُرُ بالدُّفِّ لضَبْطِ الإيقاع , ويُساعد المغنى إلى جانب هؤلاء اثنان
          أو أكثر لترديد بعض أجزاء الدَّور .'
