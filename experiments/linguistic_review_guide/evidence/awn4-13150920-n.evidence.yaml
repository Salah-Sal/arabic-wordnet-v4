                بإِنكار شَيخنَا على اللُّغة الأُولى (: خاتَمٌ كبِيرٌ يكونُ فِي اليَدِ والرِّجْلِ) بفَصَ وَغير فَصّ، وَقيل:
                هِيَ الخاتَمُ أَيًّا كانَ. (أَو حَلْقَةٌ مِن فِضَّةِ) تُلْبَس فِي الإِصبع (كالخَاتَمِ) وَقيل: الفَتخَة حَلْقَة
                من فِضّة لَا فَصَّ فِيهَا، فإِذا كَانَ فِيهَا فَصٌّ فَهِيَ الخاتَم. وَكَانَت نِسَاءُ الجاهليّة يَتّخذْنها
                فِي عَشْرهِنَّ. (ج فَتَخٌ) ، بِالتَّحْرِيكِ، (وفُتُوخٌ) ، بالضّمّ، (وفَتَخَاتٌ) ، محرّكَةً وذُكِرَ فِي جَمْعهِ
