            definitions_text: |-
              لتخ
              : (لَتَخَهُ، كمَعَهُ: لطَخَه) ، الطاءُ لُغَة فِي التاءِ، (و) عَن اللَّيث: اللَّتْخ الشَّقّ. وَقد لَتَهَه إِذا (شَقَّه. و) لَتَخَه (بالسَّوْط: سَحَلَه وشَقَّ جِلْدَه وقَشَرَه) .
              و (تَلتَّخَ) مثْل (تَلَطَّخَ) .
              (و) يُقَال: (رَجُلٌ لَتِخَةٌ، كفَرِحَة: داهيَةٌ) مُنكَرٌ، هاكذا حَكَاهُ كُراع. وَقد نَفَى سِيبَوَيْهٍ هاذا المِثالَ فِي الصّفات.
              (واللَّتْخَانُ) ، بِفَتْح فَسُكُون: (الجائعُ) ، عَن كُراع، وَالْمَعْرُوف عِنْد أَبي عبيدٍ الحاءُ، وَقد تقدّم.
