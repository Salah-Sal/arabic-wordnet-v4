        definitions_text: |-
          خبيخبَّى يخبِّي، خَبِّ، تخْبِيةً، فهو مُخَبٍّ، والمفعول مُخَبًّى• خبَّى الشَّيءَ: خبَّأه، أخفاه، ستره "عظم ما تخبِّيه الأيامُ للظالم". 
          تخبية [مفرد]: مصدر خبَّى. خ ت ر1555 - خ ت رتختَّر في/ تختَّر من يتختّر، تختُّرًا، فهو متختِّر، والمفعول مُتَخَتَّر فيه• تختَّر في مِشْيَتِه: مشى مِشْية الكسلان "لا أحتمل رؤية الرّجل يتختَّر ويتبختر".• تختَّر من شرب دواءٍ أو غيره: استرخى وكَسِل وفتَر بدنُه "أصابته الحُمَّى فتختَّر".
