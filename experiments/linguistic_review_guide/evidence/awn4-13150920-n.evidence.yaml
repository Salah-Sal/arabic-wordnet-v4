        definitions_text: '(خلف) - قوله تعالى: {وَهُوَ الَّذِي جَعَلَ اللَّيْلَ وَالنَّهَارَ خِلْفَةً} .قال مُجاهِد: أي أَبيض
          وأسْودَ، كأنَّه ذَهَبَ به إلى اختِلافهما، من قولهم: نِتاجُ بَنِي فلان خِلْفَة: أي ذَكَرٌ عَامًا، وأُنثَى عَامًا،
          وعَبْدَانِ خِلْفَان: أَحدُهما طَوِيل، والآخر قَصِير.وقال الضَّحَّاك: أي مَنْ لم يَستطِع أن يعمَلَ باللَّيل فَلْيَعْمل
          بالنّهار، فَفِي كُلِّ واحدٍ خَلَفٌ من الآخَر. - قوله تعالى: {أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُمْ مِنْ خِلَافٍ}
          .: أي يَده اليُمْنَى ورجلَه اليُسْرى يُخالَف بينهما في القَطْع.- وقَولُه تعالى: {جَعَلَكُمْ مُسْتَخْلَفِينَ فِيهِ}
          .: أي على إنفاقه في الصَّدَقَات ووجوه البِرِّ، ويقال: مُمَلَّكِين فيه: أي جَعَلَه في أَيدِيكم، وجَعلَكم خُلفاءَ
          له في مِلكِه.- في الحديث: "دَعْ دَاعِيَ اللَّبَنِ، قال: فتركْتُ أَخلافَها قائِمَةً".الأَخلافُ: جمع خِلْف. وهو مَقبِض
          يَدِ الحالِب من الضَّرع، وقيل: هو الضَّرع نَفسُه لِذِي الخُفِّ والظِّلفِ، كالظَّبْي لِذِي الحافِرِ والسِّباع.- في
          حَديثِ الدِّيَة: "كذا وكذا خَلِفَة".وهي الحَامِل من الِإبل، والجَمعُ الخَلِفات، يقال: خَلِفَت إذا حَمَلَت وأَخْلَفَت
          إذا حَالَت فلم تَحمِل، وهُنَّ المَواخِضُ  أَيضًا، ولا واحدَ له من لَفْظِه، إنما واحدته خَلِفة كالنِّساء جَمْعٌ،
          واحدَتُها امرأَة. - في حديث الدُّعاءِ: "أَخلِفْ لِي خَيرًا منه" .- وفي حَدِيثٍ آخَر: "تكفَّل اللهُ تَعالَى للغَازِي
          أن يُخلِفَ نفقتَه".- وفي حديث أَبِي الدَّردَاء: "أَنَّه كان يقول في الدُّعاءِ للمَيِّت : اخلُفْه في عَقِبه".قال
          الأصمعيّ: يقال: خَلَف اللهُ تعالى لك بخَيْر، وأَخلَف عليك خَيرًا.إذا أَسقطتَ الباء أَثبتَّ الأَلِف، قال: ويقال:
          أَخْلف الله تعالى لك: أي أَبدلَك ما ذَهب منك. وقال أبو زيد: أَخلفَ الله تعالى مَالَك، وأخلفَ عليك بخَيْر، وخَلَف
          عليك مَالَك.وقال الفَرَّاء: إذا ذَهَب للرجل ما يُخلَف مِثْل ابنِ صَغِيرِ أو مالٍ.قيل: أَخلَف الله تَعالى لَكَ، وإذا
          مات أَبُوه أو أُمُّه أو ما لا يُخلَف قيل: خَلَف الله عليك، بغير ألف.وقال غَيرهُم: أَخلَف اللهُ عليك: أي أَبَدَلَك،
          وخَلَف اللهُ عليك، إذا ماتَ له مَيِّت: أي كان اللهُ عزَّ وجَلَّ خليفَتَه عليك. - في الحديث: "سَوُّوا صُفوفَكم ولا
          تختَلِفوا فتخْتلِفَ قلوبُكم".قيل: إذا اخْتلَفوا فتقَدَّم بعضُهم على بَعضِ تَغيَّر قَلبُ بعضِهم على بعض ووَقَع بينَهم
          الاخْتِلافُ.- وفي حديث آخر: "لَتُسَوُّنَّ صُفوفَكم أو ليُخالِفَنَّ اللهُ بيْنَ وجُوهِكم".ذَكَر لي بَعضُهم أَنَّه
          أَرادَ ليُحوِّلَنَّ الله وجوهَكم إلى أقفائِكم، والله تعالى أعلم.- في حديث سَعْد: "أتخَلَّف عن هِجْرتي".معناه: خَوْف
          المَوتِ بمَكَّة، وهي دار تركوها لله، عزَّ وجلَّ، وهاجروا إلى المدينة، فلم يُحِبُّوا أن تكون مَنَاياهم بها .- وفي
          الحديث: "فكان يَخْتَلِفُ بالماء".: أي يَجِيءُ ويَذْهَب.- وفي الحديث: "خِلْفَة فَم الصَّائِم" .قال أبو عمر: أَصلُها
          في النَّبات أن يَنبُتَ الشّيءُ بعد الشَّيءِ، فاستُعِير ها هُنا، لأنها رَائِحةٌ بعد الرَّائِحةِ الأولى.'
