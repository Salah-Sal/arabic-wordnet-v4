            definitions_text: |-
              فتخ وَقَالَ أَبُو عبيد: فِي حَدِيث عَائِشَة فِي قَول الله تبَارك وتقدس وَتَعَالَى {وَلاَ يُبْدْيِنَ زِيْنَتَهُنَّ إلاَّ مَا ظَهَرَ مِنْهَا} قَالَت: القُلْب والفَتَخَةُ قَالَ: حدّثنَاهُ عبد الرَّحْمَن بْن مهْدي عَن حَمَّاد بن سَلمَة عَن أم شبيب عَن عَائِشَة. قَوْلهَا: الفَتَخَةُ تَعْنِي الْخَاتم وَجَمعهَا: فَتَخات وفَتَخٌ قَالَت امْرَأَة فِي عمل ذكرت أَنَّهَا عملته: (الرجز)
              تسْقط مني فَتَخِي فِي كُمِّي
              تَعْنِي الخواتيم. وَالَّذِي يُرَاد من هَذَا الحَدِيث أَنه لَا بَأْس أَن تبدي كفها لِأَن الْخَاتم لَا يرى إِلَّا بإبدائها وَقد رُوِيَ عَن ابْن عَبَّاس فِي هَذِه الْآيَة أَنَّهَا الْكحل والخاتم قَالَ: حدّثنَاهُ مَرْوَان بن شُجَاع عَن خُصَيْف عَن عِكْرِمَة أَو غَيره الشَّك من أبي عبيد عَن ابْن عَبَّاس فالتأويل هَهُنَا أَنه رخص فِي الْعَينَيْنِ وَالْكَفَّيْنِ وَالَّذِي عَلَيْهِ الْعَمَل عندنَا فِي هَذَا قَول عبد الله بن مَسْعُود قَالَ: حدّثنَاهُ عبد الرَّحْمَن عَن سُفْيَان عَن أبي إِسْحَاق عَن أبي الْأَحْوَص عَن عبد الله قَالَ: هِيَ الثِّيَاب. قَالَ أَبُو عبيد: يَعْنِي أَن لَا يبدين من زينتهن إِلَّا الثِّيَاب.
