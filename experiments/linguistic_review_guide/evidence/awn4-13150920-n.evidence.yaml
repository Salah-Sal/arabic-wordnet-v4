              text: '(نَتَخَ)[هـ] فِي حَدِيثِ ابْنِ عَبَّاسٍ «إنَّ فِي الجنَّة بِساطاً مَنْتُوخاً بِالذَّهب» أَيْ مَنْسوجا.والنَّتْخُ
                بِالْخَاءِ المُعجَمة: النَّسجُ.(س) وَفِي حَدِيثِ الْأَحْنَفِ «إِذَا لَمْ أصِلْ مُجْتَديَّ حَتَّى يَنْتِخَ
                جَبينُه» أَيْ يَعْرق.والنَّتْخ: مِثل الرَّشح. والمُجْتَدى: الطَّالب، أَيْ إِذَا لَمْ أصِلْ طَالبَ مَعْرُوفي.'
