              (ت خَ خَ)
              التَّخُّ: الْعَجِين الحامض، تَخَّ يَتُخُّ تُخُوخاً، وأتَخَّه.
              وتَخَّ الْعَجِين تَخاًّ: إِذا أَكثر مَاؤُهُ حَتَّى يلين، وَكَذَلِكَ الطين إِذا أفرط فِي كَثْرَة مَائه حَتَّى لَا يُمكن أَن يطين بِهِ، وأَتَّخهما هُوَ: فعل بهما ذَلِك.
              والتَّخْتَخَةُ: حِكَايَة أصوات الْجِنّ.
              والتَّخْتَخَة: اللَّكنة.
              وَرجل تَخْتاخٌ وتَخْتَخانِيٌّ: ألكن.
