            عقَقاً، أَي: حمْلاً. وأنشَدوا لعَديّ بنِ زَيْدٍ العِباديّ:(وترَكْتُ العَيْر يدْمَى نحْرُه ... ونَحوصاً سَمْحَجاً
            فِيهَا {عَقَقْ)وَأما} العَقَق، محركةً، بمعْنى الانشِقاق فخطأٌ ينْبَغي التّنَبُّه لذَلِك، وَالله أعلم. وَفِي الْمثل:
            أعزّ من الأبلَق {العَقوق:(طلَب الأبْلَقَ} العَقوقَ فلمّا ... لم ينَلْه أرادَ بيْضَ الأنوقِ)وَمن أمثالِهم أَيْضا
            فِي الرّجُل يسألُ مَا لَا يكون، وَمَا لَا يُقْدَرُ عَلَيْهِ: كلّفتَني الأبْلَق العَقوقَ.ومثلُه: كلّفْتَني بَيْضَ
            الأنوقِ. وَقيل: الأبْلَقُ العَقوق: الصُّبح لِأَنَّهُ ينْشَقّ. وَقد مرّ مَا يتعلّق بِهِ فِي: ب ل ق وأ ن ق فراجعْه.
            ويُقال: أهشُّ من نَوَى العَقوق وَهُوَ نَوًى هشٌّ أيّ رِخْو لَيِّنُ المَمْضَغَةِ تأكُله العَجوز أَو تَلوكُه، تُعْلَفُه
            النّاقةُ العَقوق إلْطافاً لَهَا، فلِذلك أُضيف إِلَيْهَا. قَالَ اللّيثُ: وَهُوَ من كَلَام أهْل البَصْرة، وَلَا
            تعرِفُه الأعرابُ فِي بادِيَتها.! وعَقّةُ: بطْنٌ من النَّمِر بنِ قاسِط بنِ هِنْب بنِ أفْصَى بن بُعْمِيّ بن جَديلَة
            قَالَ الأخْطَل:(ومُوَقَّع أثَرُ السِّفارِ بخَطْمِه ... من سودِ عَقّةَ أَو بَني الجوّالِ)الموقَّع: الَّذِي أثّر
            القَتَبُ على ظهْرِه. وَبَنُو الجوّال فِي بَني تغْلِب. وَقَالَ ابنُ الكَلبيّ فِي الجَمْهَرة: فمِنْ بَني هِلال {عقّةُ
            بنُ البِشْرِ بنِ هِلالِ بنِ البِشْر بن قيْس بنِ زُهَيْر بنِ عقّة بن جُشَم بن هِلال بنِ رَبيعةَ بنِ زَيد مَناةَ
            الَّذِي كَانَ على بني النَّمِر يومَ عيْنِ التّمر، لَقيَهُم خالِدُ بنُ الوَليد، فقتَله خالدُ بنُ الوَليد رَضِي
            الله تَعَالَى عَنهُ، وصلَبه. قلت: وَالَّذِي فِي أنْسابِ أبي عُبَيد القاسِم بنِ سَلاّم مَا نصُّه: وَكَانَت أوسُ
            مَناة من النّمِر بن قاسِط أُبيدُوا يَوْم لَقِيَهم خالدُ بنُ الوَليد فِي زَمَن أبي بكْر رَضِي الله عَنْهُمَا، ورَئِيسهم
            يَوْمئِذٍ لَبيدُ بنُ عُتْبة، يُقَال: هُوَ رَئيسُ أوْس خاصّة، ثمَّ قَالَ:)وَمن بَني تَيْم الله من النَّمِر الضّحْيان،
            واسمُه عامرُ بن سَعْد بنِ الخَزْرج بنِ تيْم الله، وَأَخُوهُ عَوفُ بنُ سعْد، من ولَده عَقّةُ بنُ قيْس بنِ بِشر:
            كَانَ على بَني النَّمِر يَوْم لَقيَهم خالدُ بن الوَليد بعَيْن التّمر، فقتلَه وصلَبَه. وَقَالَ ابنُ دُريد: العَقّةُ:
            البَرْقَةُ المُستَطيلة فِي السّماءِ. وَفِي الأساس: فِي عُرْضِ السّحاب. زَاد غيرُه: كأنّه سيفٌ مسْلول. والعَقّة:
            حُفْرةٌ عَميقةٌ فِي الأرضِ والجمعُ} عَقّات {كالعِقّ، بالكَسْر. هَكَذَا فِي النُّسَخ، وَالصَّوَاب بالفَتْح، وَهُوَ
            حفْر فِي الأَرْض مُستطَيلٌ، سُمِّيَ بالمَصْدر، كَمَا فِي اللّسان.} والعُقّة، بالضّمِّ: الَّتِي يلعَبُ بهَا الصِّبْيان
            كَمَا فِي اللِّسَان. وَفِي الصِّحاح: {عِقّانُ النّخيل والكُرومِ، بِالْكَسْرِ: مَا يخرُج من أصولِهما. وَفِي الصِّحاح
            والعُباب: من أصولِها، وَإِذا لم تُقْطَع} العِقّانُ فسدَت الْأُصُول. وَقد {أعقّت} إعقاقاً: أخرَجَتا {عِقّانَهما.}
            وعَواقُّ النّخْل: رَوادِفُه، وَهِي فُسْلانٌ تنبُت مَعَه كَمَا فِي العُباب. {والعَقْعَقُ كجَعْفَر: طائِرٌ معْروف
            فِي حجْم الحَمامِ أبْلَقُ بسَواد وبَياض أذْنَب، وَهُوَ نوْع من الغِرْبان، والعَرَبُ تتشاءَمُ بِهِ، كَمَا فِي المِصْباح،}
            يُعَقْعِق بصَوْتِه {عقْعَقَةً: يُشْبِه صوتُه العيْنَ والقافَ إِذا صات، وَبِه سُمّي، وَقد} عقْعَق الطائِرُ بصوْتِه:
            إِذا جاءَ وذهَب، قَالَ رؤبة: ومَنْ بَغَى فِي الدّين أَو تعمّقا وفرّ مخْذولاً فَكَانَ {عَقْعَقا قَالَ ابنُ بَرّيّ:
            ورَوى ثعْلَبٌ عَن إسحاقَ المَوْصليّ أَن} العَقْعَق يُقال لَهُ الشّجَجَى. وَفِي حَدِيث النّخَعيّ: يقتُلُ المُحرِمُ
            العَقْعَقَ. قَالَ ابنُ الْأَثِير: وَإِنَّمَا أجازَ قتْلَه لأنّه نوعٌ من الغِرْبان. وَهَذَا ماءٌ {أعقّه الله، أَي:
            أمرّه وَكَذَلِكَ: أقعّه الله.} وأعقّت الأرضُ الماءَ: أمرّتْه. وَقَالَ الجعدِيُّ: بحرُك بحرُ الجودِ مَا {أعقّهُ
            ربّكَ والمَحْرومُ مَنْ لم يُسْقَهُ أَي: مَا أمرّه. (و) } أعقّت الفرَسُ والأتانُ: إِذا حملَت وانْفَتَق بطنُها.
