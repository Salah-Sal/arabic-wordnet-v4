                كُمِّيقَالَ: وحقيقةُ الفَتْخَة أَن تكون فِي أَصابِع الرَّجلَين. ومعنَى شِعر الدَّهناءِ أَنَّ النِّساءَ كُنَّ
                يَتَخَتَّمنَ فِي أَصابع أَرْجُلهن، فتَصِفُ هاذه أَنّه إِذا شالَ بِرِجْلَيْهَا سَقطَتْ خَواتِيمها فِي كُمِّها؛
                وإِنّما تَمنَّت شِدَّةَ الجِماعِ.(والفَتَخُ، مُحَرَّكةً: استِرْخَاءِ المفَاصِل ولِينُهَا) وعِرَضُهَا، وَقيل:
                هُوَ اللِّينُ فِي المَفاصل وغيرِها، فَتِخَ فَتَخاً، وَهُوَ أَفتَخُ (أَو) الفَتَخُ: (عَرِضُ الكَفِّ والقَدَمِ
                وطُولُهما. وَمِنْه: أَسَدٌ أَفْتَخُ) : عريضُ الكَفِّ. ورَجلٌ أَفتخُ بيِّنُ الفَتخِ، إِذا كَانَ عَرِيض أَفتخُ
