              نتخ
              1 نَتَخَ, (S, L, K,) aor. ـِ (K, JK,) or ـَ (L, JK,) inf. n. نَتْخٌ, (S, L,) He pulled a thing out, or up, or off; removed it from its place; displaced it. (S, L, K.) He extracted, or pulled out, a tooth: (S, L:) and, a thorn from his foot (S, L) with an instrument called مِنْتَاخٌ, or مِنْتَاخَانِ: (L:) or he extracted in a general sense. (L.) It (a hawk, or falcon, L, K, and a vulture, L,) pulled off, or tore off, or snatched away, flesh (S, L, K) with its bill: (S, L:) and a raven, or crow, in like manner, a sore upon the back of a camel. (L.) b2:  نُتِخَ مِنْ أَصْحَابهِ (tropical:)  He was removed, or taken away, from his companions. (A.) نَتَخَتْهُ المَنِيَّةُ مِنْ بَيْنَ قَوْمِهِ (tropical:)  Death removed him from among his people. (A.) b3:  See also نَخَتَ.
              مِنْتَاخٌ An instrument with which thorns are extracted from the foot; syn. مِنْقَاشٌ: (S, L, K:) مِنْتَاخَانِ the same, having two extremities. (Az, L.) See مِنَتْاشٌ.
