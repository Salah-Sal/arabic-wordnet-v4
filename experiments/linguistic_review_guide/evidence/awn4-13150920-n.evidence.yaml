          - entry_id: 994031
            dictionary_id: 152
            headword: فتخَ
            headword_bare: فتخ
            headword_norm: فتخ
            root: تخخ
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              (ف ت خَ)
              الفَتْخةُ، والفَتَخَة: خاتَمٌ يكون فِي اليَد والرَّجْل، بفَصٍّ وَغير فَص.
              وَقيل: هِيَ الخاتمَ أياً كَانَ.
              وَقيل: هِيَ حَلْقةٌ تلبس فِي الإصْبع كالخاتَم، وَكَانَت نسَاء الجاهلّية يَتَّخذنها فِي عَشْرِهنْ. وَالْجمع: فَتَخ، وفُتُوخ، وفَتَخَات.
              والفَتَخُ: كُلُّ جُلْجُل لَا يَجْرِس.
              والفَتَخ، والفَتَخة: باطِن مَا بَين العَضُد والذِّراع.
              والفَتَخُ اسْترخاء المَفاصل ولينُها وعَرْضها.
              وَقيل: هُوَ اللين فِي المَفاصل وَغَيرهَا، فَتِخ فَتَخَاً، وَهُوَ أفْتَخ.
              وعُقابٌ فَتخاءُ: ليِّنَةُ الْجنَاح.
              والفَتَخُ: عَرض الكَفّ والقَدم وطُوُلهما.
              وأسَدٌ أفْتَخ: عريضُ الْكَفّ.
              وفَتَخَ الرجلُ أصابِعَه فَتْخَا، وفَتَّخها: عَرَّضها وأرْخاها.
              والفَتَخُ فِي الْإِبِل، كالطَّرق.
              وناقة فَتْخاء: ارتْفعت أخلافُها قِبَل بَطنها، وَكَذَلِكَ الْمَرْأَة، وَهُوَ مدح، وَفِي الرَّاحِلَة ذمٌّ.
              والفَتْخاء: شَيْء مُرَبع من خَشَب يَجْلِسُ عَلَيْهِ الرجل، وَيكون لِمُشْتار العَسل.
              والافَاتيخ من الفُقُوع: هَنَواتٌ تَخرج فِي أوّله فيَحسبها النَّاس كَمْأةً حَتَّى يَستخرجوها فيعرفوها. حَكَاهُ أَبُو حنيفَة وَلم يحك للافاتيخ وَاحِدًا.
              وفُتَيخْ وفَتَّاخ: دَحْلان بأطْراف الدَّهْناء مِمَّا يَلِي اليَمامة، عَن الهَجريّ.
