          فلِذلك أُضيف إِلَيْهَا. قَالَ اللّيثُ: وَهُوَ من كَلَام أهْل البَصْرة، وَلَا تعرِفُه الأعرابُ فِي بادِيَتها.! وعَقّةُ:
          بطْنٌ من النَّمِر بنِ قاسِط بنِ هِنْب بنِ أفْصَى بن بُعْمِيّ بن جَديلَة قَالَ الأخْطَل:(ومُوَقَّع أثَرُ السِّفارِ
          بخَطْمِه ... من سودِ عَقّةَ أَو بَني الجوّالِ)الموقَّع: الَّذِي أثّر القَتَبُ على ظهْرِه. وَبَنُو الجوّال فِي بَني
          تغْلِب. وَقَالَ ابنُ الكَلبيّ فِي الجَمْهَرة: فمِنْ بَني هِلال {عقّةُ بنُ البِشْرِ بنِ هِلالِ بنِ البِشْر بن قيْس
          بنِ زُهَيْر بنِ عقّة بن جُشَم بن هِلال بنِ رَبيعةَ بنِ زَيد مَناةَ الَّذِي كَانَ على بني النَّمِر يومَ عيْنِ التّمر،
          لَقيَهُم خالِدُ بنُ الوَليد، فقتَله خالدُ بنُ الوَليد رَضِي الله تَعَالَى عَنهُ، وصلَبه. قلت: وَالَّذِي فِي أنْسابِ
          أبي عُبَيد القاسِم بنِ سَلاّم مَا نصُّه: وَكَانَت أوسُ مَناة من النّمِر بن قاسِط أُبيدُوا يَوْم لَقِيَهم خالدُ بنُ
          الوَليد فِي زَمَن أبي بكْر رَضِي الله عَنْهُمَا، ورَئِيسهم يَوْمئِذٍ لَبيدُ بنُ عُتْبة، يُقَال: هُوَ رَئيسُ أوْس
          خاصّة، ثمَّ قَالَ:)وَمن بَني تَيْم الله من النَّمِر الضّحْيان، واسمُه عامرُ بن سَعْد بنِ الخَزْرج بنِ تيْم الله،
          وَأَخُوهُ عَوفُ بنُ سعْد، من ولَده عَقّةُ بنُ قيْس بنِ بِشر: كَانَ على بَني النَّمِر يَوْم لَقيَهم خالدُ بن الوَليد
          بعَيْن التّمر، فقتلَه وصلَبَه. وَقَالَ ابنُ دُريد: العَقّةُ: البَرْقَةُ المُستَطيلة فِي السّماءِ. وَفِي الأساس:
          فِي عُرْضِ السّحاب. زَاد غيرُه: كأنّه سيفٌ مسْلول. والعَقّة: حُفْرةٌ عَميقةٌ فِي الأرضِ والجمعُ} عَقّات {كالعِقّ،
          بالكَسْر. هَكَذَا فِي النُّسَخ، وَالصَّوَاب بالفَتْح، وَهُوَ حفْر فِي الأَرْض مُستطَيلٌ، سُمِّيَ بالمَصْدر، كَمَا
          فِي اللّسان.} والعُقّة، بالضّمِّ: الَّتِي يلعَبُ بهَا الصِّبْيان كَمَا فِي اللِّسَان. وَفِي الصِّحاح: {عِقّانُ النّخيل
          والكُرومِ، بِالْكَسْرِ: مَا يخرُج من أصولِهما. وَفِي الصِّحاح والعُباب: من أصولِها، وَإِذا لم تُقْطَع} العِقّانُ
          فسدَت الْأُصُول. وَقد {أعقّت} إعقاقاً: أخرَجَتا {عِقّانَهما.} وعَواقُّ النّخْل: رَوادِفُه، وَهِي فُسْلانٌ تنبُت
          مَعَه كَمَا فِي العُباب. {والعَقْعَقُ كجَعْفَر: طائِرٌ معْروف فِي حجْم الحَمامِ أبْلَقُ بسَواد وبَياض أذْنَب، وَهُوَ
          نوْع من الغِرْبان، والعَرَبُ تتشاءَمُ بِهِ، كَمَا فِي المِصْباح،} يُعَقْعِق بصَوْتِه {عقْعَقَةً: يُشْبِه صوتُه العيْنَ
          والقافَ إِذا صات، وَبِه سُمّي، وَقد} عقْعَق الطائِرُ بصوْتِه: إِذا جاءَ وذهَب، قَالَ رؤبة: ومَنْ بَغَى فِي الدّين
          أَو تعمّقا وفرّ مخْذولاً فَكَانَ {عَقْعَقا قَالَ ابنُ بَرّيّ: ورَوى ثعْلَبٌ عَن إسحاقَ المَوْصليّ أَن} العَقْعَق
          يُقال لَهُ الشّجَجَى. وَفِي حَدِيث النّخَعيّ: يقتُلُ المُحرِمُ العَقْعَقَ. قَالَ ابنُ الْأَثِير: وَإِنَّمَا أجازَ
          قتْلَه لأنّه نوعٌ من الغِرْبان. وَهَذَا ماءٌ {أعقّه الله، أَي: أمرّه وَكَذَلِكَ: أقعّه الله.} وأعقّت الأرضُ الماءَ:
          أمرّتْه. وَقَالَ الجعدِيُّ: بحرُك بحرُ الجودِ مَا {أعقّهُ ربّكَ والمَحْرومُ مَنْ لم يُسْقَهُ أَي: مَا أمرّه. (و)
          } أعقّت الفرَسُ والأتانُ: إِذا حملَت وانْفَتَق بطنُها. {والإعْقاقُ فِي الخَيْل والحُمُر بعدَ الإقْصاص. وَقيل:} عقّت:
          إِذا حمَلت، {وأعقّت إِذا نبتَت} العَقيقةُ فِي بطنِها على الولَد الَّذِي حملَتْه.وَهِي {عَقوقٌ على غيْر القِياس،
          وَلَا يُقال:} مُعِقٌّ، وَهَذَا نادِر، أَو يُقال ذلِك فِي لُغَيّة رَديئَة وَمِنْه قولُ رُؤبَة: قد عتَق الأجْدَعُ
          بعد رِقِّ بقارحٍ أَو زَوْلَة! مُعِقِّ) وَكَانَ أَبُو عَمْرو يَقُول: {عقّت، فَهِيَ} عَقوق، {وأعَقّتْ فهيَ} مُعِقّ.
          واللُغَة الفَصيحةُ {أعقّت فَهِيَ} عَقوق. وَفِي نَوادِر الْأَعْرَاب: {اعتَقّ السّيْفَ من غِمدِه، واهْتَلَبه، وامْتَرقَه،
          واختلَطَه: إِذا استلّه.قَالَ الجُرْجانيّ: الأصلُ اخترَطه، وكأنّ اللاّم مُبدَلة مِنْهُ، وَفِيه نظَر. (و) } اعتقّ
          السّحابُ: انْشَقّ واندَفَع مَاؤُهُ. قَالَ أَبُو وَجْزَة:(حتّى إِذا أنْجَدَتْ أرواقُه انهزَمَتْ ... {واعتَقّ مُنْبعِجٌ
          بالوَبْلِ مبْقورُ)} وانعَقّ الغُبارُ: انشقّ وسَطَع عَن ابنِ فارِس، قَالَ رؤبةُ: إِذا العَجاجُ المُستَطارُ {انْعَقّا
          (و) } انعقّت العُقْدَة: انْشَدّت واستَحْكَمَت. وانعقّت السّحابَة: تبعّجَتْ بالماءِ وانشَقّت. وكُلُّ انشِقاقٍ فَهُوَ
          {انعِقاقٌ. يُقال:} انعَقّ الثّوبُ، أَي: انشَقّ، عَن ثَعْلب. {وانعَقّ البَرْقُ: تشقّق. والتّركيبُ يدلُّ على الشَّقِّ،
          وَإِلَيْهِ ترجع فُروعُ البابِ بلُطْفِ نظَر. وَمِمَّا يُستَدرك عَلَيْهِ:} العَقيقُ، كأمير: البَرقُ، وَبِه فَسّر بعضُهم
          قولَ الفَرزْدَق:(قِفي ودِّعينا يَا هُنَيْدُ فإنّني ... أرى الحَيَّ قد شامُوا العَقيقَ اليَمانِيا)أَي: شامُوا البَرْقَ
          من ناحِيَة اليَمَن. {وعَقّ البرقُ: انشقّ. ويُقال:} الانعِقاقُ: تشقُّقه. والتّبوّجُ: تكَشُّفه، {وعَقيقَتُه: شُعاعُه.}
          وانعَقّ الوادِي: عَمُق. {والعَقائِقُ: النِّهاءُ والغُدْران فِي الأخاديدِ} المُنْعَقّة، حَكَاهُ أَبُو حَنيفة. وأنْشَدَ
          لكُثيِّر بنِ عبدِ الرّحمنِ الخُزاعي يصفُ امْرَأَة:(إِذا خرَجَت من بيْتِها راقَ عينَها ... مُعوَّذُه وأعجَبَتْها
          {العَقائِقُ)أَرَادَ معوَّذَ النّبت حوْل بيتِها. وقيلَ: العَقائِق: الرِّمال الحُمْر. وعقّت الريحُ المُزْنَ} تعُقُّه
          {عَقّاً: إِذا استدرّتْه كأنّها تشُقُّه شقّاً. قَالَ الهُذَليُّ يصِف غيْثاً:(حارَ} وعقّتْ مُزْنَهُ الرّيحُ وانْ ... قارَ
          بهِ العَرْضُ وَلم يُشْمَلِ)حَار: تحيّر وتردّد، واستدَرّته ريحُ الجَنوب، وَلم تهُبّ بِهِ الشّمالُ فتَقْشَعَه. وانْقارَ
          بِهِ العرْضُ، أَي: عرْض السّحابِ وقَعَت مِنْهُ قِطْعة. وسَحابة {مَعْقوقَة: إِذا} عُقَّت {فانْعَقّتْ. وسَحابة} عَقّاقة:
          إِذا دَفَعت ماءَها وَقد {عقَّت. قَالَ عبدُ بَني الحَسْحاس يصِف غيْثاً:(فمرّ على الأنْهاءِ فانْثَجَّ مُزنُه ... }
          فعَقّ طَويلاً يسكُبُ الماءَ ساجِيا)ومنهُ قولُ ابنةِ المُعَقِّر البارِقيّة: أرى سَحابةً سَحماءَ {عَقّاقَة، كأنّها
          حُوَلاءُ نَاقَة، ذَات هَيْدب دانٍ، وسَيْرٍ وانٍ. رَوَاهُ شَمِر. وَمَا} أعقّه لوالِدِه. {وأعقّ فلانٌ: إِذا جاءَ}
          بالعُقوقِ. كَمَا يُقال: أحْوَب: إِذا)جاءَ بالحُوبِ. وَمِنْه قولُ الْأَعْشَى أنشَده ابنُ السِّكيت:(فإنّي وَمَا كلّفتُموني
          بجَهْلِكمْ ... ويعْلَمُ رَبّي مَنْ {أعقَّ وأحْوَبا)وَفِي المثَل:} أعقُّ من ضَبٍّ. قَالَ ابنُ الأعرابيّ: إِنَّمَا
          يُريدُ بِهِ الأُنثَى. {وعُقوقُها: أنّها تأكُلُ أولادَها.} والعُقُق، بضمّتين: البُعَداء من الأعْداءِ. وَأَيْضًا:
          قاطِعو الأرْحام. ويُقال: {عاقَقْتُ فُلاناً} أُعاقُّه {عِقاقاً: إِذا خالَفْتَه. وَفِي الحَدِيث: مثَلكم ومثَلُ عائِشَة
          مثَلُ العَيْن فِي الرّأسِ تؤذي صاحِبَها وَلَا يَسْتَطيع أَن} يعُقَّها إِلَّا بالّذي هُوَ خيْر لَهَا. هُوَ مُسْتَعار
          من عُقوق الوالِدَين. ويُقال للصّبيّ إِذا نشأَ مَعَ حيٍّ حَتَّى شَبّ وقَوِيَ فيهم: {عقّت تَميمَتُه فِي بني فُلان.
          وَمِنْه قولُ الشّاعر:(بلادٌ بهَا عَقَّ الشّبابُ تَميمَتي ... وأوّلُ أرضٍ مسَّ جِلدِي تُرابُها)والأصلُ فِي ذَلِك
          أنّ الصّبيَّ مادام طِفلاً تُعَلِّق أمُّه عَلَيْهِ التّمائم تُعَوِّذُه من العَيْن، فَإِذا كبِر قُطِعَت عَنهُ. قلت:
          ووقَع فِي خُطْبةِ المُطَوَّل للسّعد: بِلادٌ بهَا نِيطَتْ عليَّ تَمائِمي وَمَا ذَكَرنا هُوَ الأصحُّ. وكُلّ شقّ وخَرْق
          فِي الرّمل وغيْره فَهُوَ} عَقٌّ. {والعَقوق، كصَبور: موضِع، وَبِه فُسِّر قولُ الشّاعر، أنشدَه ابنُ السِّكّيت:(وَلَو
          طلبُوني} بالعَقوقِ أتيتُهم ... بألفٍ أؤدِّيه الى القومِ أقْرَعا)ويُقال: المُرادُ بِهِ الأبْلق، والوَجْهان ذكَرَهما
          الجوهَريُّ. ويُقال للمُعْتَذِر إِذا أفرطَ فِي اعتِذاره: قد {اعْتَقّ} اعْتِقاقاً. ويُقال للدّلو إِذا طلَعت من البِئْر
          مَلأى: قد {عقّت} عَقّاً. وَمن العَرِب مَن يَقُول: {عَقّت} تعْقِيَة. وأصلُها عقّقَت فَلَمَّا اجتَمَعت ثُلاثُ قافات
          قلَبوا إحْداها يَاء، كَمَا قَالُوا: تظَنّيْت من الظَّنِّ، وَأنْشد ابنُ الْأَعرَابِي: عقّتْ كَمَا عقّتْ دَلوفُ العِقْبان
          شبّه الدّلْوَ وَهِي تَشُقُّ هَواءَ البِئْر طالِعةً بسرعَةٍ بالعُقاب تدْلِف فِي طيَرانِها نحوَ الصَّيد. {والعَقْعَقَة:
          حركةُ القِرْطاسِ والثّوبِ الجَديد، كالقَعْقَعَة.} والعَقيقِيّون: جماعةٌ من الأشرافِ. مِنْهُم أَبُو مُحَمَّد الحسَن
          بنُ محمدِ بنِ يَحْيى العدَويّ، صَاحب كتاب النَّسَب. روى عَن جدّه يَحْيى بنِ الحسَن. وَأَبُو الْقَاسِم أحمدُ بنُ
          الحُسَيْن بنِ أحمدَ بنِ عليّ بنِ محمدِ بنِ جعْفرٍ العَقيقيُّ، من كبار الدِّمَشْقِيّين فِي أثناءِ المائةِ الرابعةِ،
          وَهُوَ صَاحب الدّار الَّتِي صَارَت المدرسةَ الظاهريّةَ بِدِمَشْق، مَاتَ سنة. ومُنية {عَقيق: قَرْيَة بِمصْر.} والأعِقّة:
          رمل. وَبِه فسّر السّكريُّ قولَ أبي) خِراشٍ: وَمن دونِهم أرضُ! الأعِقّة والرّملُ'
