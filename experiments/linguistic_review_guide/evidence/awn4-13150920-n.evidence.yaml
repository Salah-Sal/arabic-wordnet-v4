          - entry_id: 781353
            dictionary_id: 105
            headword: فَتَخَ
            headword_bare: فتخ
            headword_norm: فتخ
            root: تخخ
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '(فَتَخَ)(هـ) وَفِيهِ «كان إذا سجد جا في عَضُدَيْه عَنْ جَنْبَيْه وفَتَخَ أَصَابِعَ رجْلَيه»
              أَيْ نَصَبَها وغَمَز مَوْضع المفاصِل مِنْهَا، وَثَنَاهَا إِلَى بَاطِنِ الرِّجل. وَأَصْلُ الفَتْخ: اللِّين. وَمِنْهُ
              قِيلَ للعُقاب:فَتْخَاء، لأنَّها إِذَا انْحَطَّت كَسَرَتْ جَناحَيْها.(هـ) فِيهِ «أَنَّ امْرَأة أتَتْه وَفِي يَدها
              فُتُخٌ كَثِيرَةٌ» وَفِي رِوَايَةٍ «فُتُوخٌ» هَكَذَا رُوي، وَإِنَّمَا هُوَ «فَتَخ» بِفُتْحَتَيْنِ، جَمْعُ فَتْخَة،
              وَهِيَ خَواتِيُم كِبارٌ تُلْبس فِي الأيْدِي، ورُبما وُضِعَت فِي أَصَابِعِ الأرْجُل. وَقِيلَ: هِيَ خَواتيمُ لَا
              فُصُوص لَهَا، وتُجْمع أَيْضًا عَلَى: فَتَخَات وفِتَاخ.وَمِنْهُ حَدِيثُ عَائِشَةَ «فِي قَوْلِهِ تَعَالَى وَلا
              يُبْدِينَ زِينَتَهُنَّ إِلَّا ما ظَهَرَ مِنْها قَالَتْ: القُلْب والفَتَخَة» وَقَدْ تَكَرَّرَ ذكرُها فِي الْحَدِيثِ
              مُفرداً وَمَجْمُوعًا.'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:11:2751
