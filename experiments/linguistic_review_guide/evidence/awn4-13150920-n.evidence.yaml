        definitions_text: "نقب\n1 نَقَبَ, aor. ـُ inf. n. نَقْبٌ, He perforated, pierced, bored, or made a hole through, or\
          \ in, or into, anything: like ثَقَبَ. (TA.) He made a hole through a wall. (S.) b2:  نَقَبَ سُرَّةَ الدَّابَّةِ,\
          \ aor. ـُ He (a farrier) perforated the navel of the beast in order that a yellow fluid might issue forth. (S.)\
          \ See مَنْقَبٌ. b3:  نَقَبَ العَيْنَ, aor. ـُ inf. n. نَقْبٌ, He performed, upon the eye, what is called القَدْحُ\
          \ in the language of the physicians; i. e., a remedial operation for the black fluid that arises in the eye: from\
          \ the phrase next following: (IAth:) [but this is not a good explanation: the meaning is he performed upon the eye\
          \ the operation of couching, for the cataract: so in many Arabic works, ancient and modern: (IbrD:) the couching-needle\
          \ is called مِقْدَحٌ, and إِبْرَةُ القَدْحِ, in the present day]. b4:  نَقَبَ حَافِرَ الدَّابَّةِ He (a farrier)\
          \ pierced a hole in the hoof of the beast, in order to extract what had entered into it. (IAth.) b5:  نَقَبَتْهُ\
          \ نَكْبَةٌ, (aor.\nنَقُبَ, inf. n. نَقْبٌ, TA,) A misfortune, an evil accident, or a calamity befell him, (K,) and\
          \ overcame him, or afflicted him; like نَكَبَتْهُ. (TA.) [In the CK, for أَصَابَتْهُ, is put اثابته.] b6:  نَقَبَ\
          \ فِى الأَرْضِ, aor. ـُ and ↓ انقب and ↓ نَقّب, He went, or went away, through the land, or country: (K:) [in the\
          \ CK and some MS. copies of the K, we afterwards find نَقِبَ فِى البِلَادِ with kesr to the ق, explained as signifying\
          \ he proceeded, or journeyed, through the lands:] ↓ انقب he proceeded, or journeyed, through the country: (IAar:)\
          \ نقّبوا فِى البِلَادِ [Kur, l. 35,] they proceeded, or journeyed, through the lands, seeking for a place of refuge:\
          \ (S:) or they traversed the lands, and journeyed through them, much, &c.: (Fr.:) or they went about and about,\
          \ and searched, &c. (Zj.) فِى الآفَاقِ ↓ نَقَّبْتُ, in a verse of Imra-el-Keys, I journeyed through the tracts of\
          \ the earth, and came and went. (TA.) b7: نَقِبَ البَعِيرُ, aor. ـَ or نَقِبَ حُفُّ البعيرِ, (L, TA,) and ↓ انقب,\
          \ (L,) The camel walked barefooted, syn. حَفِىَ, (L, K,) until his feet became worn in holes: (TA:) or نَقِبَ البعير,\
          \ (S, K,) and ↓ انقب, (K,) the camel's feet became thin, [or were worn thin; which is also a signification of حَفِىَ].\
          \ (S, K.) b8:  نَقِبَتْ أَقْدَامُنَا Our feet became thin in the skin, and blistered, by reason of walking. (L.)\
          \ b9:  نَقَبَ الخُفَّ, aor. ـُ He patched the boot; repaired it by patching. (K.) Also, He made the boot thin: he\
          \ made [or wore] holes in it. (Msb.) b10:  نَقِبَ الخُفُّ, aor. ـَ (inf. n. نَقَبٌ, TA,) The boot became lacerated,\
          \ or worn through, in holes. (S, K, TA.) [And in like manner The sole of the foot of a camel or of a man: see below:\
          \ and see an ex. voce أَظَلُّ.] b11: نَقَبَ, aor. ـُ inf. n. نَقْبٌ, He (a horse) put his feet together in his running\
          \ (فِى حُضْرِهِ, [ for which Golius and Freytag appear to have read فى خَصْرِهِ,] K,) not spreading his fore feet,\
          \ his running being [a kind of] leaping. (TA.) A2: نَقَبَ عَنِ الأَخْبْارِ, aor. ـُ He scrutinized, investigated,\
          \ searched into, examined into, or inquired into, the news; (K;) and, in like manner, anything else: (MF:) [as also\
          \ ↓ نقّب: see the phrase نقّبوا فى البلاد, explained above:] or he told, announced, or related, the news. (K.) b2:\
          \  إِنِّى لَمْ أُؤْمَرْ أَنْ أَنْقُبَ عَنْ قُلُوبِ النَّاسِ Verily  I have not been commanded to scrutinize and\
          \ reveal what is in the hearts of men. (TA, from a trad.) b3:  نَقَبَ عَلَى قَوْمِهِ, aor. ـُ inf. n. نِقَابَةٌ,\
          \ He acted as the نَقِيب over his people; was their نقيب: (S, K:) but of a man who was not نقيب, and has become\
          \ so, you say نَقُبَ, with damm, aor. ـُ inf. n. نَقَابَةٌ, with fet-h, He became نقيب; (Fr., S, K;) as also نَقِبَ,\
          \ aor. ـَ (IKtt, K:) or ـب with kesr is a subst.; and with fet-h, an inf. n.; (S, K;) like وِلَايَةٌ and وَلَايَةٌ:\
          \ so says Sb. (S.) A3:  نَقَبَ الثَّوْبَ, aor. ـُ inf. n. نَقْبٌ, He made the piece of cloth into a نُقْبَة. (S.)\
          \ 2 نَقَّبَ see 1.3 نَاقَبْتُهُ, inf. n. نِقَابٌ; as also لَقِيتُهُ; I met him face to face: or without appointment,\
          \ (K,) and unintentionally: (TA:) or unexpectedly. (S.) نقابًا is in the accus. case as an inf. n.; or as a word\
          \ descriptive of state. (TA.) b2:  وَرَدْتُ المَاءَ نِقَابًا, (S,) or لَقِيتُ الماء\nنقابا, (K,) I came upon the\
          \ water unexpectedly, without seeking for it. (S, K.) 4 أَنْقَبَ see 1. b2:  انقب His camel's feet became thin;\
          \ [or were worn thin;] (S, K;) or were worn in holes by walking. (TA.) A2: He became a door-keeper, or chamberlain;\
          \ Arab.\nحَاجِب: (K:) or he became a نَقِيب. (L, K, &c.) 5 تَنَقَّبَ see 8.8 انتقبت (S, K, Msb) and ↓ تنقّبت (Msb)\
          \ She (a woman) veiled her face with a نِقَاب (S, K, Msb.) b2:  بعمَامَته ↓ تنقب: see تختّم.\nنَقْبٌ (S, K) and\
          \ ↓ نُقْبَةٌ (S) A hole, perforation, or bore, (K,) in, or through, a wall, (S,) or anything whatever: (TA:) or\
          \ a large hole, perforation, or bore, passing through a thing; such as is small being termed ثَقْبٌ, with ث: (Mgh,\
          \ in art. ثقب:) pl. of the former نُقُوبٌ (Msb) and أَنْقَابٌ and نِقَابٌ. (TA, and some copies of the K.) b2: \
          \ نَقْبٌ (K) and ↓ نَاقِبَةٌ (S) An ulcer that arises in the side, (S, ISd, K,) attacking the inside of the body,\
          \ (S, ISd,) and having its head inwards; (ISd;) [as also ↓ نَقَّابَةٌ, for] نَقَّابَاتٌ signifies ulcers that come\
          \ forth in the side and penetrate into the inside. (TA voce ذُبَالٌ.) See نُقْبٌ. b3:  نَقْبٌ (S, K) and ↓ نُقْبٌ\
          \ (K) and ↓ مَنْقَبٌ and ↓ مَنْقَبَةٌ (S, K) A road (or narrow road, TA,) in a mountain: (ISk, S, K:) a road between\
          \ two mountains: (IAth:) pl. (of the first and second, TA,) أَنْقَابٌ (a pl. of pauc., TA,) and نِقَابٌ; (K;) and\
          \ of the third and fourth, مَنَاقِبُ. (TA.) See also مَنْقَبَةٌ.\nنُقْبٌ (S, K,) and ↓ نَقْبٌ (K: but the former\
          \ is the more common: TA) and ↓ نُقَبٌ (K) [the first is a coll. gen. n., of which the n. un. is نُقْبَةٌ [q. v.],\
          \ of which it is called in the S the pl.: but نُقَبٌ is the pl. of نُقْبَةٌ:] Scab, [or scabs,] (K,) absolutely:\
          \ (TA:) or scattered scabs (S, K,) when they first appear: (S:) النُّقْبَةُ is the first that appears of the scab;\
          \ and is so called because the scabs perforate the skin: you say, of a camel, بِهِ نُقْبَةٌ: (As:) the first that\
          \ appears of the scab, in a patch like the palm of the hand, in the side of a camel, or on his haunch, or his lip:\
          \ then it spreads over him until it covers him entirely. (ISh.) Mohammad, denying that any disease was transmitted\
          \ from one thing to another, and being asked how it was that a نُقْبَة spread in camels, asked what transmitted\
          \ the disease to the first camel. (TA.) b2: فُلَانٌ يَضَعُ الهِنَآءَ مَوَاضِعَ النُّقْبِ (tropical:)  [Such a one\
          \ puts the tar upon the places of the scabs]: said of one who is clever, or skilful, and who does or says what is\
          \ right. (A.) [See also قَالَبٌ]\nنَقِبٌ, and, as a fem. epithet, ↓ نَقْبَاءُ, A camel whose feet have become worn\
          \ in holes, [or worn thin,] by walking. (TA.) See the verb. b2: The former may also signify Having the scab, or\
          \ what first appears thereof. (TA.) See نُقْبٌ.\nنُقَبٌ: see نُقْبٌ.\nنُقْبَةٌ A mark, trace, or vestige: ex. عَلَيْه\
          \ نُقْبَةٌ Upon him, or it, is a mark, &c. (T.) b2: See نَقْبٌ. b3:  نُقْبَةٌ (assumed tropical:)  Rust, (K.) upon\
          \ a sword or the head of an arrow or a spear: (M:) or نَقب [i. e.\n↓ نُقْبٌ, q. v., a coll. gen. n., of which نُقْبَةٌ\
          \ is the n. un.; or نُقَبٌ, pl. of نُقْبَةٌ;] signifies (tropical:)  traces of rust upon a sword or an arrow head\
          \ or a spear-head, likened to the first appearances of the scab. (A.) A2: نُقْبَةٌ The face: (S, K:) or the parts\
          \ surrounding the face. (L:) pl. نُقَبٌ. (TA.) b2:  نُقْبَةٌ A garment resembling an إِزار, having a sewed waistband\
          \ or string, (حُجْزَةٌ مَخِيطَةٌ: so in the S, M, L: whence it appears that the reading in the K, حجزة مُطيفَةٌ,\
          \ is erroneous: TA: [F having, it seems, found مُحِيطَةٌ written in the place of مُحِيطَةٌ:]) without a نَيْفَق\
          \ which is the part turned down at the top, and sewed, through which the waistband passes], (S, K,) tied as trousers,\
          \ or drawers, are tied: (S:) or a pair of trousers, or drawers, having a waistband, but without a part turned down\
          \ at the top, and sewed, for the waistband to pass through: if it have this, (i. e, a. نيفق,) it is called سَراوِيلُ:\
          \ (TA;) or a piece of rag of which the upper part is made like drawers, or trousers: (L;) or a pair of drawers,\
          \ or trousers, without legs. (M, voce إِنْبٌ, TA,) A3:  نُقْبَةٌ The state, or condition; quality, mode, or manner;\
          \ state with regard to apparel &c.; external form, figure, feature, or appearance; of any thing: syn. هَيْئَةٌ.\
          \ (T.) A4:  نُقْبَةٌ Colour. (S, K.) b2: فَرَسٌ حَسَنُ النَّقْبَةِ A horse of beautiful colour. (TA.) b3:  See also\
          \ نَقِيبَةٌ.\nنِقْبَةٌ A mode of veiling the face with the نِقَاب: (K:) pl. نِقَبٌ. (TA.) b2:  إِنَّهَا لَحَسَنَةُ\
          \ النِّقْبَةِ (S) Verily she has a comely mode of veiling her face with the نقاب. (TA.) نِقَابٌ [A woman's face-veil;]\
          \ (S, K;) a veil that is upon [or covers] the soft, or pliable, part of the nose; (Az;) [not extending higher:]\
          \ a woman's veil that extends as high as the circuit of the eye: (Msb:) it is of different modes: Fr  says, When\
          \ a woman lowers her نقاب to her eye, it [the action] is termed وَصْوَصَةٌ; and when she lowers it further, to [the\
          \ lower part of] the circuit of the eye, it [the veil] is called نقاب; and if it is on the extremity of the nose,\
          \ it is [properly] called لِفَامٌ: (T:) the نقاب, with the Arabs, is that [kind of veil] from out of which appears\
          \ the circuit of the eye: and the meaning of the saying in a trad. النِّقَابُ مُحْدَثٌ is, that women's shewing\
          \ the circuits of the eyes is an innovation; not that they used not to veil their faces: the [kind of]\nنقاب which\
          \ they used reached close to the eye, and they showed one eye while the other was concealed; whereas the [kind of]\
          \ نقاب, which only shows both the eyes [without their circuits] was called by them وَصْوَصَةٌ [a mistake for وَصْوَاصٌ]\
          \ and تُرْقُعٌ: [in the original, والنقاب لا يبدومنه الّا العينان وكان اسمه الخ: but the و before كان is erroneously\
          \ introduced, and perverts the sense, which is otherwise plain, and agreeable with what is said before:] then they\
          \ innovated the [veil] properly called] نقاب: (A'Obeyd:) pl. نَقُبٌ. (Msb.) A2:  نِقَابٌ and ↓ مِنَقَبٌ A road through\
          \ a rugged tract of ground: (K:) the former word used both as a sing and a pl. (TA.) A3:  نِقَابٌ (a strange form\
          \ of epithet, MF,) (tropical:)  A man of great knowledge; very knowing: (S, K:) or possessing a knowledge of things,\
          \ or affairs: or, as also ↓ مِنعقَبٌ, mentioned by I Ath and Z, a man possessing a knowledge of things, who scrutinizes\
          \ or investigates them much; who is intelligent, and enters deeply into things. (TA.) A4:  نقَابٌ The bello, Hence\
          \ the proverb, فَرْخَانِ فِى نِقَابٍ [Two young birds in one belly]: applied to two things that resemble one another,\
          \ (K.) In like manner one says كَانَا فِى نقاب وَاحد [They were in one belly]; meaning they were like each other,\
          \ (A.) نَقِيبٌ i. q. مَنْقُوبٌ, A thing perforated, pierced, bored. or having a hole made through, or in. or into\
          \ it. (TA.) b2:  نَقِيبٌ A musical reed, or pipe. (K.) b3:  The tongue of a pair of scales, or balance (K.) b4:\
          \  A dog having the upper part of his mindpipe (غَلْصَمَتُهُ: so in the S, K or having his windpipe, حَنْجَرَتُهُ:\
          \ so in the A) perforated, (S, K,) in order that his cry may be weak: a base man performs this operation on his\
          \ dog, in order that guests may not hear its cry. (S: and the like is said in the L.) A2:  نَقِيبُ قُوْمٍ The intendant,\
          \ superintendent, overseer, or inspector, of a people; he who takes notice, or cognisance, of their actions, and\
          \ is responsible for them; i. q. عَرِيفُهُمْ and شَاهِدُهُمْ and ضَمِيُهُمْ: (S, K:) like أَمِينٌ and كَفِيلٌ: (Zj:)\
          \ their head, or chief: (TA:) like  عَرِيفٌ [q. v.]; i. e., one who is set over a people, and investigates their\
          \ affairs: (L:) or, as some say, the greatest, or supreme, chief of a people: so called [from نَقَبَ “ he scrutinized,\
          \ or investigated,”] because he is acquainted with the secret affairs of the people, and knows their virtues, or\
          \ generous actions, and is the way by which one obtains knowledge of their affairs: (TA:) pl. نُقَبَاءُ. (S.) نِقَابَةٌ\
          \ The office of نَقِيب. (Sb: see 1.) نَقِيبَةٌ Mind: syn. نَفْسٌ. (S, K,) You say فُلَانٌ مَيْمُونُ النقيبةِ Such\
          \ a one is of a fortunate mind, (A'Obeyd, S,) when the person referred to is fortunate in his affairs, succeeding\
          \ in what he seeks after, or strives to accomplish: (ISk, S:) or when he is fortunate in his counsel, or advice:\
          \ (Th, S:) or the phrase signifies such a one is fortunate in his actions, and in gaining what he seeks. (TA.) See\
          \ also what follows. نَقِيبَةٌ is also said, in the K, to signify the same as عَقْلٌ (understanding, intellect,\
          \ or intelligence); but, says SM, I have not found this in any other lexicon: only  I have found the word explained\
          \ in the L as signifying يُمْنُ الفِعْلِ (good fortune attending, or resulting from, an action): so probably عَقْلٌ\
          \ is a mistake for فِعْلٌ. (TA.) b2:  Also, Counsel, or advice. (K.) See above. b3:  Also, Penetration of judgment;\
          \ acuteness; sagacity. (Ibn-Buzurj, K.) b4:  Also, Nature; or natural, or native, disposition, temper, or other\
          \ quality: (K:) i. q.  نَقِيمَةٌ and عَرِيكَةٌ and طَبِيعَةٌ. (T, art. عرك.) Agreeably with this explanation, the\
          \ phrase above mentioned is rendered in the T, in art. عرك, Such a one is of a fortunate nature, or natural disposition:\
          \ (TA:) or it signifies, in this phrase, as also نقيمة, i. q. لَوْنٌ, Colour, complexion, species, &c. (IAar.) Also\
          \ هُوَ حَسَنُ النَّقِيبَةِ He is of a good nature, or natural disposition: and in like manner, جَمِيلَةٍ ↓ فُلَانٌ\
          \ فِى مَنَاقِبَ Such a one is a person of good dispositions, or natural qualities. (L.) A2:  نَقِيبَةٌ A she-camel\
          \ having a large udder: (ISd, K:) having her udder bound up with a cloth or the like, on account of its greatness\
          \ and excellence: but AM says this is a corruption, and that the correct word is ثقيبة, with ث, meaning a she-camel\
          \ “ abounding with milk. ” (TA.) نَقَّابَةٌ: see نَقْبٌ.\nنَاقِب and نَاقِبَةٌ [the former omitted in some copies\
          \ of the K] A disease that befalls a man in consequence of long sluggishness, or indolence: (K:) or, as some say,\
          \ the ulcer that arises in the side. (TA.) See نَقْبٌ.\nأَنْقَابٌ, a pl. without a sing., The ears: (M, K,) or,\
          \ accord. to some, its sing. is نُقْبٌ. (TA.) El-Katámee says, كَانَتْ خُدُودُ هِجَانِهِنَّ مُمَالَةً\nأَنْقَابُهُنَّ\
          \ إِلَى حُدَآءِ السُّوَّقِ [The cheeks of their white camels were with their ears inclined to the singing of the\
          \ drivers]. But \nأَنَقًا بِهِنَّ, “by reason of their pleasure,” is also read, for أَنْقَابُهُنَّ: (TA:) [so that\
          \ the meaning is The cheeks of their white camels were inclined, by reason of their pleasure. to the singing of\
          \ the drivers].\nمَنْقَبٌ The navel: or [a place] before it: (K:) where the farrier makes a perforation in order\
          \ that a yellow fluid may issue forth: (S:) so in a horse. (TA.) b2:  See نَقْبٌ.\nمِنْقَبٌ An iron instrument with\
          \ which a farrier perforates the navel of a beast of carriage (S, K) in order that a yellow fluid may issue forth.\
          \ (S.) See مَنْقَبٌ, and نِقَابٌ.\nمَنْقَبَةٌ: see نَقْبٌ. b2:  A narrow way between two houses, (L, K,) along which\
          \ one cannot pass. (L.) It is said in a trad., that one does not possess the right of pre-emption (الشُّفْعَة) with\
          \  respect to a منقبة; and this word is explained as signifying a wall: syn. حَائِطٌ: [and so in the K:] or a way\
          \ between two houses, as though it were perforated from one to the other: or a road, or way, over an elevated piece\
          \ of ground. (L.) A2: مَنْقَبَةٌ A virtue; an excellence; contr. of مَثْلَبَةٌ: (S:) a cause of glorying: (K:) generosity\
          \ of action, or conduct: (L:) a [good disposition, or natural quality: [see نَقِيبَةٌ:] (TA:) a memorable, or generous\
          \ action, and [good] internal quality: (A:) pl. مَنَاقِبُ: (TA:) رجُلٌ ذُو مَنَاقِبَ A man of memorable, or generous,\
          \ actions, and [good] internal qualities. (A.)"
