          - entry_id: 774845
            dictionary_id: 103
            headword: نتخ
            headword_bare: نتخ
            headword_norm: نتخ
            root: تخخ
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              نتخ: النَّتْخ: النَّزْع والقلْع؛ نَتَخَ البازيُّ ينتِخُ نَتْخاً: نسرَ
              اللَّحمَ بمنْسَره، وكذلك النسر، وكذلك الغراب ينتِخُ الدَّبَرة على ظهر
              البعير؛ قال الشاعر:
              يَنْتِخُ أَعيُنها الغربانُ والرَّخَمُ
              والنَّتْخُ: ازالةُ الشيء عن موضعه. ونَتَخ الضرسَ والشوكَة ينتِخُها:
              استخرجها؛ وقيل: النتْخُ الاستخراج عامَّة.
              والمِنْتَاخ: المنقاش؛ الأَزهري: والنتْخُ إِخراجُكَ الشَّوكَ
              بالمنْتَاخَيْن، وهما المنقاش ذو الطرفين.
              والنتْخ: النسْج؛ ومنه حديث ابن عباس، رضي الله عنهما: إِن في الجنة
              بساطاً مَنْتُوخاً بالذهب أَي منسوجاً. والناتخ: الناسج.
              ونَتَخْته: نتفته. ونتَخْته: نقشته. ونتَخْته: أَهنته. ونتَّخَ بالمكان
              تَنْتيخاً: كتَنَّخَ؛ وفي حديث عبدالله بن سلام: أَنه آمن ومن معه من
              يهود فتَنَّخُوا على الإِسلام أَي ثبتوا وأَقاموا؛ قال ابن الأَثير: ويروى
              بتقديم النون على التاء، أَي رسخوا.
