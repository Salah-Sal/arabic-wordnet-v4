          - entry_id: 810960
            dictionary_id: 116
            headword: فتخ
            headword_bare: فتخ
            headword_norm: فتخ
            root: تخخ
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '[فتخ] فيه: كان إذا سجد جافى عضديه عن جنبيه و"فتخ" أصابع رجليه، أي نصبها وغمز موضع المفاصل منها
              وثناها إلى باطن الرجل، وأصل الفتخ الكسر، ومنه قيل للعقاب: فتخباء، لأنها إذا انحطت كسرت جناحيها. ج: "فتخ" أصابعها،
              هو بمعجمها، أي أرخاها وثناها معطوفة، وقيل: أن ينصب أصابعه ويغمز موضع المفاصل منها وثناها إلى باطن الراحة من
              اليد وفي الرجل إلى ما يلي وجه القدم. نه: وفيه: وفي يدها "فتخ" كثيرة، وروي: فتوخ، وإنما هو فتخ- بفتحتين جمع فتخة
              وهي خواتيم كبار تلبس في الأيدي وربما وضعت في أصابع الأرجل، وقيل: هي خواتيم لا فصوص لها، وتجمع أيضًا على فتخات
              وفتاخ. ك: ومنه: ويلقين "الفتخ" ويلقين، أي كل نوع من حليهن.'
            translation_en: null
            translation_fr: null
            domain: null
