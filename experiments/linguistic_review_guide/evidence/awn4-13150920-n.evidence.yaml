            definitions_text: |-
              فتخ وَقَالَ أَبُو عبيد: فِي حَدِيث النَّبِي عَلَيْهِ السَّلَام أَنه كَانَ إِذا سجد جافى عضديه عَن جَنْبَيْهِ وفتخ أَصَابِع رجلَيْهِ. قَالَ يحيى: الفتخ أَن يصنع هَكَذَا وَنصب أَصَابِعه ثُمَّ غمز مَوضِع المفاصل مِنْهَا إِلَى بَاطِن الرَّاحَة يَعْنِي أَنه كَانَ يفعل ذَلِك بأصابع رجلَيْهِ فِي السُّجُود قَالَ الْأَصْمَعِي: [أصل -] الفتخ اللين قَالَ أَبُو عُبَيْدٍ: وَيُقَال للبراجم إِذا كَانَ فِيهَا لين وَعرض: إِنَّهَا لفُتخ وَمِنْه قيل للعُقاب: فَتخاء لِأَنَّهَا إِذا انحطت كسرت جناحيها وغمزتهما وَهَذَا لَا يكون إِلَّا من اللين قَالَ امْرُؤ الْقَيْس يذكر الْفرس ويشبهها بالعُقاب: [الطَّوِيل]
              كَأَنِّي بِفَتْخَاء الْجَنَاحَيْنِ لَقْوَةٍ
              دَفوف من العقبان ظأطأت شِملالِي
              وَقَالَ الآخر: [الْبَسِيط]
              كَأَنَّهَا كاسر فِي الجوَّ فَتْخَاءُ
              وَإِنَّمَا سميت كاسرًا لكسرها جناحيها إِذا انحطت. وَفِي هَذَا الحَدِيث من الْفِقْه أَنه كَانَ ينصب قَدَمَيْهِ فِي السُّجُود نصبا وَلَوْلَا نَصبه إيَّاهُمَا لم يكن هُنَاكَ فتخ فَكَانَت الْأَصَابِع منحنية فَهَذَا الَّذِي يُرَاد من الحَدِيث وَهُوَ مثل حَدِيثه الآخر أَنه أَمر بِوَضْع الْكَفَّيْنِ وَنصب الْقَدَمَيْنِ فِي الصَّلَاة.
              قَصم فَصم وصم وتر وَقَالَ أَبُو عبيد: فِي حَدِيث النَّبِي عَلَيْهِ السَّلَام فِي حَدِيث ذكر فِيهِ نعت أهل الْجنَّة قَالَ: وَيرْفَع أهل الغُرَف إِلَى غرفهم فِي درة بَيْضَاء لَيْسَ فِيهَا قَصم وَلَا فَصم. قَوْله: القَصْم بِالْقَافِ هُوَ أَن ينكسر الشَّيْء فيَبين يُقَال مِنْهُ:
