          text: |-
            تخت
            تَخْتٌ A repository in which clothes are kept; (K;) [a chest for clothes; a wardrobe: pl. تُخُوتٌ:] a Persian word sometimes used by the Arabs. (IDrd.) b2:  [The following significations of the word seem to be post-classical. b3:  A throne: a seat: a seat of government: a moveable wooden bench, or sofa: all which are Persian. Hence, تَخْتَرَوَانٌ, from the Persian, A kind of covered litter, like a palanquin, borne by two camels or horses, one before and the other behind, or by two or four mules. b4:  So too تَخْتَةٌ A board, or plank: likewise of Persian origin. Hence the verb تَخَّتَ He boarded, or planked.]
          is_raw: 1
      - entry_id: 842709
        headword: تخت
        dict_key: hawramani_32
        dict_name_en: Supplément aux dictionnaires arabes by Reinhart Dozy (d. 1883 CE)
        dict_name_ar: تكملة المعاجم العربية لرينهارت دوزي
        dict_source_type: hawramani
        dict_period: classical
        dict_death_year: 1883
        dict_author: null
        senses:
        - sense_index: 0
          text: |-
            تخت: تَخَّتَ: ذكرها شياباريلي في معجمه في مادة tornum بمعنى خشب - وتخَّت: غطى أرض المكان بالخشب (بوشر).
            تَخْت: خشب السرير، وهو ما يبسط على السرير من خشب لينام عليه، وسرير صغير من خشب (بوشر، همبرت 203).
            ومنصة لجلوس المشاهدين (بوشر).
            ومحور المعصرة (معصرة العنب) والمعصرة (فوك، ألكالا، دومب - 9).
            وضخم، جسيم، يقال مثلا رجل تخت، أي ضخم جسيم (بوشر).
            وتخت الرمل: لوح ضارب الرمل لكشف الغيب (ألف ليلة 1: 866، 2: 237)، ويقال: التخت رمل، والتخت فقط (ألف ليلة 2: 46). ويقال: ضرب لفلان تخت رمل أي عمله في لوح الرمل الكشف عما يخبئه له القدر. (ألف ليلة 2: 122، 237، 3: 222) متخوت: حزين (فوك).
          is_raw: 1
