            خثر
            1 خَثَرَ, (S, Msb, K,) aor. ـُ (S, Msb;) and خَثُرَ, aor. ـُ (S, A, Msb, K,) a rare dial. var.; (Fr, S;) and خَثِرَ, (S, A, Msb, K,) aor. ـَ (Msb,) a form heard by Ks; (S;) inf. n. (of the first, TA) خَثْرٌ and خُثُورٌ and خَثَرَانٌ, (K, TA,) which  last is irregular, because this word does not imply motion, (TA,) [but this assertion requires consideration,] and (of the second [accord. to rule], TA, or of the first, Msb, [or used as inf. n. of the first because it is the most common form,]) خُثُورَةٌ (S, A, Mgh, Msb, K) and [of the second accord. to rule] خَثَارَةٌ (K) and of the third خَثَرٌ; (Msb, TA;) [and probably ↓ تخثّر, (mentioned by Freytag, though without any indication of his authority,) as quasi-pass. of خَثَّرَهُ; but I have more than once found it erroneously written for تختّر, which has a different signification;] it (milk, S, A, Mgh, Msb, K, and honey, and the like, TA, and a liniment or the like, A, or some other thing, Msb) was, or became, thick, (S, A, Mgh, Msb, K,) and strong. (Msb.) b2:  [Hence,] خَثَرَتْ نَفْسُهُ, (S, K,) or خَثِرَتْ, (A,) or خَثُرَتٌ, (Mgh,) inf. n. خُثُورٌ and خَثَارَةٌ, but not, as some write it, خُثَارَةٌ, (TA,) (tropical:)  His soul [or stomach] heaved, became agitated by a tendency to vomit, or became heavy; (A, Mgh, K, TA;) as also خَثَرَ alone; (IAar, TA;) became disordered; syn. اِخْتَلَطَتْ. (S, K.) b3:  And خَثَرَ; (S;) or خَثِرَ, aor. ـَ (K;) or ـِ فِى الحَىِّ; (A;) (tropical:)  He remained among the tribe, (S, A, K,) not going forth with people to procure wheat or corn or other provisions, (S, K,) by reason of shame, or of heaviness of the soul [or stomach]. (TA.) b4: And خَثِرَ (assumed tropical:)  He felt, or had a sense of, or he was, or became, moved or affected with, shame, shyness, bashfulness, or honest shame. (K.) 2 خَثَّرَ see 4.4 اخثرهُ; (Msb, K;) and ↓ خثّرهُ, (A, Msb, K,) inf. n. تَخْثِيرٌ; (TA;) He thickened it; made it thick, (Msb, A, K,) and strong; (Msb;) namely, milk, (A, Msb, K,) and honey, and the like, (TA,) and a liniment or the like, (A,) or some other thing. (Msb.) b2:  And the former signifies also He left it in a thick state; namely, fresh butter; (As, S, K;) not melting it. (As, S.) It is said in a prov., مَا يَدْرِى أَيُخْثِرُ أَمْ يُذِيبُ [He knows not whether to leave in a thick state or to melt]: (S K; in one copy of the former of which, the fem. forms of the verbs are used:) applied to him who is confounded, or perplexed, and unable to see his right course, and who wavers, or vacillates: its origin being this: a woman melts fresh butter, and what is thick thereof becomes mixed with what is thin, and she is vexed and wearied by her case, and knows not whether to raise the fire with fuel, in order that it may become clear; fearing that, if she do so, it will burn: thus she is perplexed. (K.) 5 تَخَثَّرَ see 1.
            خَثْرَى الأَنْفُسِ and خَثْرَآءُ الانفس: see خَاثِرٌ.
            خُثَارٌ What remains upon a table of food. (S.) خُثَارَةٌ What remains (S, K) of a thing, (S,) or of milk: (K:) the dregs; lees; or thick, or turbid, portion that sinks to the bottom of a thing, beneath the clear portion. (TA in art. ثفل.) You say, ذَهَبَ صَفْوُهُ وَ بَقِيَتْ خُثَارَتُهُ [The clear part of it went away, and the thick part of it remained]. (A.) خَاثِرٌ, applied to milk, (Mgh, Msb,) and to a liniment or the like, (A,) &c., (Msb,) Thick, or thickening, (A, Mgh, Msb,) and strong. (Msb.) b2:  [Hence,] خَاثِرُ النَّفْسِ (tropical:)  Having the soul [or stomach] in a heaving state, agitated by a tendency to vomit, or heavy: (TA:) or not in a good state: (A, Mgh:) and languid: (A:) and ↓ قَوْمٌ خَثْرَآءُ الأَنْفُسِ (S, K) and الأَنْفُسِ ↓ خَثْرَى (K) a party disordered [in souls or stomachs]. (S, K.) and خَاثِرَةٌ (assumed tropical:)  A woman feeling a little pain (K) and languor; as also ↓ مُخْثِّرَةٌ [or, more probably مُخْثَّرَةٌ]. (TA.) خَاثِرَةٌ [fem. of خَاثِرٌ, q. v.
            A2:  And also, as a subst.,] (tropical:)  A party of men: (K, TA:) or (tropical:)  a dense body of men. (A, TA.) مُخَثَّرَةٌ: see خَاثِرٌ.
