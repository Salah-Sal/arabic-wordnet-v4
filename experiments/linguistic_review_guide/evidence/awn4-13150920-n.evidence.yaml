            على الولَد الَّذِي حملَتْه.وَهِي {عَقوقٌ على غيْر القِياس، وَلَا يُقال:} مُعِقٌّ، وَهَذَا نادِر، أَو يُقال ذلِك
            فِي لُغَيّة رَديئَة وَمِنْه قولُ رُؤبَة: قد عتَق الأجْدَعُ بعد رِقِّ بقارحٍ أَو زَوْلَة! مُعِقِّ) وَكَانَ أَبُو
            عَمْرو يَقُول: {عقّت، فَهِيَ} عَقوق، {وأعَقّتْ فهيَ} مُعِقّ. واللُغَة الفَصيحةُ {أعقّت فَهِيَ} عَقوق. وَفِي نَوادِر
            الْأَعْرَاب: {اعتَقّ السّيْفَ من غِمدِه، واهْتَلَبه، وامْتَرقَه، واختلَطَه: إِذا استلّه.قَالَ الجُرْجانيّ: الأصلُ
            اخترَطه، وكأنّ اللاّم مُبدَلة مِنْهُ، وَفِيه نظَر. (و) } اعتقّ السّحابُ: انْشَقّ واندَفَع مَاؤُهُ. قَالَ أَبُو
            وَجْزَة:(حتّى إِذا أنْجَدَتْ أرواقُه انهزَمَتْ ... {واعتَقّ مُنْبعِجٌ بالوَبْلِ مبْقورُ)} وانعَقّ الغُبارُ: انشقّ
            وسَطَع عَن ابنِ فارِس، قَالَ رؤبةُ: إِذا العَجاجُ المُستَطارُ {انْعَقّا (و) } انعقّت العُقْدَة: انْشَدّت واستَحْكَمَت.
            وانعقّت السّحابَة: تبعّجَتْ بالماءِ وانشَقّت. وكُلُّ انشِقاقٍ فَهُوَ {انعِقاقٌ. يُقال:} انعَقّ الثّوبُ، أَي: انشَقّ،
            عَن ثَعْلب. {وانعَقّ البَرْقُ: تشقّق. والتّركيبُ يدلُّ على الشَّقِّ، وَإِلَيْهِ ترجع فُروعُ البابِ بلُطْفِ نظَر.
            وَمِمَّا يُستَدرك عَلَيْهِ:} العَقيقُ، كأمير: البَرقُ، وَبِه فَسّر بعضُهم قولَ الفَرزْدَق:(قِفي ودِّعينا يَا هُنَيْدُ
            فإنّني ... أرى الحَيَّ قد شامُوا العَقيقَ اليَمانِيا)أَي: شامُوا البَرْقَ من ناحِيَة اليَمَن. {وعَقّ البرقُ: انشقّ.
            ويُقال:} الانعِقاقُ: تشقُّقه. والتّبوّجُ: تكَشُّفه، {وعَقيقَتُه: شُعاعُه.} وانعَقّ الوادِي: عَمُق. {والعَقائِقُ:
            النِّهاءُ والغُدْران فِي الأخاديدِ} المُنْعَقّة، حَكَاهُ أَبُو حَنيفة. وأنْشَدَ لكُثيِّر بنِ عبدِ الرّحمنِ الخُزاعي
            يصفُ امْرَأَة:(إِذا خرَجَت من بيْتِها راقَ عينَها ... مُعوَّذُه وأعجَبَتْها {العَقائِقُ)أَرَادَ معوَّذَ النّبت
            حوْل بيتِها. وقيلَ: العَقائِق: الرِّمال الحُمْر. وعقّت الريحُ المُزْنَ} تعُقُّه {عَقّاً: إِذا استدرّتْه كأنّها
            تشُقُّه شقّاً. قَالَ الهُذَليُّ يصِف غيْثاً:(حارَ} وعقّتْ مُزْنَهُ الرّيحُ وانْ ... قارَ بهِ العَرْضُ وَلم يُشْمَلِ)حَار:
            تحيّر وتردّد، واستدَرّته ريحُ الجَنوب، وَلم تهُبّ بِهِ الشّمالُ فتَقْشَعَه. وانْقارَ بِهِ العرْضُ، أَي: عرْض السّحابِ
            وقَعَت مِنْهُ قِطْعة. وسَحابة {مَعْقوقَة: إِذا} عُقَّت {فانْعَقّتْ. وسَحابة} عَقّاقة: إِذا دَفَعت ماءَها وَقد
            {عقَّت. قَالَ عبدُ بَني الحَسْحاس يصِف غيْثاً:(فمرّ على الأنْهاءِ فانْثَجَّ مُزنُه ... } فعَقّ طَويلاً يسكُبُ
            الماءَ ساجِيا)ومنهُ قولُ ابنةِ المُعَقِّر البارِقيّة: أرى سَحابةً سَحماءَ {عَقّاقَة، كأنّها حُوَلاءُ نَاقَة، ذَات
            هَيْدب دانٍ، وسَيْرٍ وانٍ. رَوَاهُ شَمِر. وَمَا} أعقّه لوالِدِه. {وأعقّ فلانٌ: إِذا جاءَ} بالعُقوقِ. كَمَا يُقال:
            أحْوَب: إِذا)جاءَ بالحُوبِ. وَمِنْه قولُ الْأَعْشَى أنشَده ابنُ السِّكيت:(فإنّي وَمَا كلّفتُموني بجَهْلِكمْ ... ويعْلَمُ
            رَبّي مَنْ {أعقَّ وأحْوَبا)وَفِي المثَل:} أعقُّ من ضَبٍّ. قَالَ ابنُ الأعرابيّ: إِنَّمَا يُريدُ بِهِ الأُنثَى.
            {وعُقوقُها: أنّها تأكُلُ أولادَها.} والعُقُق، بضمّتين: البُعَداء من الأعْداءِ. وَأَيْضًا: قاطِعو الأرْحام. ويُقال:
            {عاقَقْتُ فُلاناً} أُعاقُّه {عِقاقاً: إِذا خالَفْتَه. وَفِي الحَدِيث: مثَلكم ومثَلُ عائِشَة مثَلُ العَيْن فِي
            الرّأسِ تؤذي صاحِبَها وَلَا يَسْتَطيع أَن} يعُقَّها إِلَّا بالّذي هُوَ خيْر لَهَا. هُوَ مُسْتَعار من عُقوق الوالِدَين.
            ويُقال للصّبيّ إِذا نشأَ مَعَ حيٍّ حَتَّى شَبّ وقَوِيَ فيهم: {عقّت تَميمَتُه فِي بني فُلان. وَمِنْه قولُ الشّاعر:(بلادٌ
            بهَا عَقَّ الشّبابُ تَميمَتي ... وأوّلُ أرضٍ مسَّ جِلدِي تُرابُها)والأصلُ فِي ذَلِك أنّ الصّبيَّ مادام طِفلاً
            تُعَلِّق أمُّه عَلَيْهِ التّمائم تُعَوِّذُه من العَيْن، فَإِذا كبِر قُطِعَت عَنهُ. قلت: ووقَع فِي خُطْبةِ المُطَوَّل
            للسّعد: بِلادٌ بهَا نِيطَتْ عليَّ تَمائِمي وَمَا ذَكَرنا هُوَ الأصحُّ. وكُلّ شقّ وخَرْق فِي الرّمل وغيْره فَهُوَ}
            عَقٌّ. {والعَقوق، كصَبور: موضِع، وَبِه فُسِّر قولُ الشّاعر، أنشدَه ابنُ السِّكّيت:(وَلَو طلبُوني} بالعَقوقِ أتيتُهم ... بألفٍ
            أؤدِّيه الى القومِ أقْرَعا)ويُقال: المُرادُ بِهِ الأبْلق، والوَجْهان ذكَرَهما الجوهَريُّ. ويُقال للمُعْتَذِر إِذا
            أفرطَ فِي اعتِذاره: قد {اعْتَقّ} اعْتِقاقاً. ويُقال للدّلو إِذا طلَعت من البِئْر مَلأى: قد {عقّت} عَقّاً. وَمن
            العَرِب مَن يَقُول: {عَقّت} تعْقِيَة. وأصلُها عقّقَت فَلَمَّا اجتَمَعت ثُلاثُ قافات قلَبوا إحْداها يَاء، كَمَا
            قَالُوا: تظَنّيْت من الظَّنِّ، وَأنْشد ابنُ الْأَعرَابِي: عقّتْ كَمَا عقّتْ دَلوفُ العِقْبان شبّه الدّلْوَ وَهِي
            تَشُقُّ هَواءَ البِئْر طالِعةً بسرعَةٍ بالعُقاب تدْلِف فِي طيَرانِها نحوَ الصَّيد. {والعَقْعَقَة: حركةُ القِرْطاسِ
            والثّوبِ الجَديد، كالقَعْقَعَة.} والعَقيقِيّون: جماعةٌ من الأشرافِ. مِنْهُم أَبُو مُحَمَّد الحسَن بنُ محمدِ بنِ
            يَحْيى العدَويّ، صَاحب كتاب النَّسَب. روى عَن جدّه يَحْيى بنِ الحسَن. وَأَبُو الْقَاسِم أحمدُ بنُ الحُسَيْن بنِ
            أحمدَ بنِ عليّ بنِ محمدِ بنِ جعْفرٍ العَقيقيُّ، من كبار الدِّمَشْقِيّين فِي أثناءِ المائةِ الرابعةِ، وَهُوَ صَاحب
            الدّار الَّتِي صَارَت المدرسةَ الظاهريّةَ بِدِمَشْق، مَاتَ سنة. ومُنية {عَقيق: قَرْيَة بِمصْر.} والأعِقّة: رمل.
            وَبِه فسّر السّكريُّ قولَ أبي) خِراشٍ: وَمن دونِهم أرضُ! الأعِقّة والرّملُ'
