          العَقاق مصْدر العَقوق. قَوْله:} والعَقَقُ، مُحرَّكة: الانْشِقاقُ هَكَذَا فِي سَائِر النُسَخ، والصّوابُ {كالعَقَق
          محرّكةً، أَي: بِمَعْنى الحَمْلِ، كَمَا فِي اللّسان والصِّحاح والعُباب. يُقال: أظْهَرت الأتانُ} عقَقاً، أَي: حمْلاً.
