            is_partial: 0
            definitions_text: |-
              فتخ
              الفَتْخُ، فُتُوْخُ الأسَدِ: مَفاصِلُ مَخالِبِه. وإذا عَرُضَ كَفه فهو أفْتَخُ. وسُميت العقَابُ فَتْخَاء لعرض جَنَاحَيْها.
              والفَتَخُ: لِيْن وطولٌ في الجَنَاحَيْن، وفي الرجْلَيْن: طُولُ العَظْم وقلةُ اللحم.
              والفُتُوْخُ: خَواتِيْمُ لا فُصُوصَ لها، الواحدة فَتَخَةٌ.
              والفَتْخَاءُ: شَيْءٌ مُرَبعٌ يجلس عليه الرجلُ فَيُجَر ويُمَد.
              وعَدا حتى أفْتَخَ: أي أعْيَا وانْبَهَرَ. وكذلك إذا اسْتَرْخى من عَمَله.
              وفي الحديث: " وفَتَخَ أصابعَ رِجْلَيْه " وهو أنْ يَنْصِبَها ثمَ يَغْمِزَ المفاصلَ منها إلى باطِن الراحة.
