          - entry_id: 829546
            dictionary_id: 120
            headword: فتخ
            headword_bare: فتخ
            headword_norm: فتخ
            root: تخخ
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'فتخ: (الفَتْخَة) ، بِفَتْح فَسُكُون (ويُحَرَّكُ) . ذكرهمَا غيرُ واحدِ من أَئمّة الغريبِ، فَلَا
              اعتدادَ بإِنكار شَيخنَا على اللُّغة الأُولى (: خاتَمٌ كبِيرٌ يكونُ فِي اليَدِ والرِّجْلِ) بفَصَ وَغير فَصّ،
              وَقيل: هِيَ الخاتَمُ أَيًّا كانَ. (أَو حَلْقَةٌ مِن فِضَّةِ) تُلْبَس فِي الإِصبع (كالخَاتَمِ) وَقيل: الفَتخَة
              حَلْقَة من فِضّة لَا فَصَّ فِيهَا، فإِذا كَانَ فِيهَا فَصٌّ فَهِيَ الخاتَم. وَكَانَت نِسَاءُ الجاهليّة يَتّخذْنها
              فِي عَشْرهِنَّ. (ج فَتَخٌ) ، بِالتَّحْرِيكِ، (وفُتُوخٌ) ، بالضّمّ، (وفَتَخَاتٌ) ، محرّكَةً وذُكِرَ فِي جَمْعهِ
              فِتَاخٌ. قَالَ الشَّاعِر:تَسقُطُ مِنْهُ فَتَخِي فِي كُمِّيقَالَ ابنَ بَرّيّ: هاذا الشِّعرُ للدَّهناءِ بنت مِسْحَل
              زَوج العَجّاج، وَكَانَت رَفْعَتْه إِلى المُغَيرة بن شُعبةَ فَقَالَت لَهُ: أَصلَحَك الله، إِنّي مِنْهُ بجُمْع،
              أَي لم يَفتضَّني، فَقَالَ العجَّاج:اللَّهْ يَعلم يَا مُغيرةُ أَنّنِيقد دُسْتُهَا دَوْسَ الحِصَانِ المُرْسَلِوأَخذْتُها
              أَخذَ المُقصِّبِ شاتَهعَجْلاَنَ يَذَحُهَا لقَوْمٍ نُزَّلِفَقَالَت الدَّهناءُ:واللَّهِ لَا تَخْدعُني بشَمِّوَلَا
              بتَقْبِيلٍ وَلَا بِضَمِّإِلاّ بِزَعْزَاعٍ يُسلِّي هَمِّيتَسقطُ مِنْهُ فَتَخِي فِي كُمِّيقَالَ: وحقيقةُ الفَتْخَة
              أَن تكون فِي أَصابِع الرَّجلَين. ومعنَى شِعر الدَّهناءِ أَنَّ النِّساءَ كُنَّ يَتَخَتَّمنَ فِي أَصابع أَرْجُلهن،
              فتَصِفُ هاذه أَنّه إِذا شالَ بِرِجْلَيْهَا سَقطَتْ خَواتِيمها فِي كُمِّها؛ وإِنّما تَمنَّت شِدَّةَ الجِماعِ.(والفَتَخُ،
              مُحَرَّكةً: استِرْخَاءِ المفَاصِل ولِينُهَا) وعِرَضُهَا، وَقيل: هُوَ اللِّينُ فِي المَفاصل وغيرِها، فَتِخَ فَتَخاً،
              وَهُوَ أَفتَخُ (أَو) الفَتَخُ: (عَرِضُ الكَفِّ والقَدَمِ وطُولُهما. وَمِنْه: أَسَدٌ أَفْتَخُ) : عريضُ الكَفِّ.
              ورَجلٌ أَفتخُ بيِّنُ الفَتخِ، إِذا كَانَ عَرِيض أَفتخُ بيِّنُ الفَتخِ، إِذا كَانَ عَرِيِّ الكَفِّ والقَدَمِ
              مَعَ اللِّين. قَالَ الشَّاعر:فُتْخُ الشَّمَائلِ فِي أَيْمَانِهمْ رَوَحُ(و) الفَتَخُ (شِبْهُ الطَّرَقِ) ، محرَّكَةً
              (فِي الإِبلِ. و) الفَتَخِ (: كُلُّ جُلْجُلٍ) ، كهُدْهُد، هاكذَا ضُبطَ فِي سَائِر النُّسخ الْمَوْجُودَة عندنَا،
              والّذي فِي (اللِّسَان) : (كلّ خَلْخَالٍ) (لَا يَجْرُسُ) ، أَي لَا يُصَوِّت. (وفَتَخَ) الرَّجلُ (أَصابعَهُ) فَتْخاً
              (وفَتَّخَهَا) تَفتيخاً: (عَرّضَهَا وأَرخَاهَا) ، وَقيل، فَتَخَ أَصابِعَ رُجْلَيْه فِي جُلُوسه، ثَنَاهَا ولَيَّنها.
              قالَ أَبو مَنْصُور: يَثنِيهما إِلى ظاهرِ القَدَم لَا إِلى باطِنها. وَفِي الحَدِيث (أَنّه كَانَ إِذا سَجَدَ جَافَى
              عَضُدَيْه عَن جَنْبَيْه وفَتَخَ أَصَابِعَ رِجْلَيْه) . قَالَ يحيَى بن سعيد: الفَتْخ أَن يَصْنَع هاكذا، ونَصَبَ
              أَصابعَه ثمَ غَمزَ مَوْضِعَ المَفَاصِلِ مِنْهَا إِلى باطِن الرَّاحَةِ وثَنَاهَا إِلى بَاطِنِ الرِّجْلِ، يَعْنِي
              أَنّه كَانَ يَفْعَل ذالك بأَصَابع رِجْلَيْهِ فِي السجودِ. قَالَ الأَصمعيّ. وأَصلُ الفَتَخِ اللِّينُ.(والفَتْخَاءُ)
              شيْءٌ مُربَّعٌ (شِبْهُ مِلْبَنٍ من خَشَبٍ يَقعُدُ عَلَيْهِ مُشْتَارُ) اسْم فاعلٍ من اشتارَ (العَسَلِ) ثمَّ يَمُدُّ
              من فَوق حتّى يَبلُغَ مَوضعَ العَسَلِ.(و) الفَتْخَاءُ (مِنَ العقْبَانِ) ، بِالْكَسْرِ، جمع عُقَابٍ (: اللَّيِّنَةُ
              الجنَاحِ) لأَنّهَا إِذا انحَطَّت كسَرتْ جَنَاحَيها وغَمَزتْهما، وهاذا لَا يكون إِلاّ مِن اللِّين. وَقَالَ شيخُنَا.
              وَقد أَكثَر المصنّفات اللُّغَويّة أَنّ الفَتْخَاءَ المُسترخِيَةُ الجَنَاحَينِ مُطْلَقاً من الطُّيورِ، ثمَّ أُطلِقَت
              على العقْبَانِ، كأَنَّهَا صِفةٌ لازمةٌ لَهَا، فصارَتْ من أَسمائها. ولذلكَ زعمَ قَومٌ أَن طَلاقهَا عَلَيْهَا
              مَجاز. وأَنشد:كأَنِّي بفتخاءِ الجَنَاحَينِ لِقْوَةِدَفُوف من العِقْبَانِ طَأْطأْتُ شِمْلالي(و) يُقَال: (نَاقَةٌ
              فَتْخَاءُ الأَخْلافِ) ، إِذا (ارْتَفَعَتْ أَخْلاَفُهَا قِبَلَ بَطْنِهَا) ، وَهُوَ (ذَمٌّ، وَفِي المَرْأَة والضَّرْعِ
              مَدْحٌ) وَعبارَة (اللِّسَان) : تُعطِي أَنّه فِي المرأَة مَدْحٌ أَيضاً، فليُنظَر.(و) فِتَاخٌ، (كَكتَابٍ) ، اسْم
              (ع) .(وفُتُوخُ الأَسَد) ، بالضّمّ: (مَفَاصلُ مَخَالِبِه) ، هاكذا فِي النُّسخ، والّذي فِي اللِّسَان الفَتخْ عرَضُ
              مَخالبِ الأَسدِ ولِينُ مَفاصِلها (وأَفْتَخَ) الرَّجُلُ: ارْتَخَى، و (أَعْيَا وانْبَهَرَ) .(والأَفاتِيخُ من الفُقُوعِ
              هَنَوَاتٌ) ، وَفِي بعض الأُصول. هَنَات (تَخْرُجُ أَوّلاً) ، وَفِي بعض الأُصول. فِي أَوّله، (فتُظَنّ كَمْأَةً)
              ، وَفِي بعض الأُصول: فيَحبسها النّاسُ كَمْأَةً (حَتَّى تُستَخْرَجَ فتُعْرَفَ) حَكَاهُ أَبو حنيفةَ، وَلم يَذكر
              للأَفَاتِيخ وَاحِدًا.(ورَجُلٌ) ، وَفِي (الأَساس) : وظَبْيٌ (أَفْتَخْ الطَّرْفِ: فاتِرُه) .(و) فُتَيْخٌ (كَزُبَيْرٍ:
              ع) . وَفِي (اللِّسَان) : فُتَيْخٌ وفَتَّاخٌ دَحْلاَنِ بأَطْرَاف الدّهْنَاءِ مِمَّا يَلِي اليمامةَ، عَن الهَجريّ.وَمِمَّا
              يسْتَدرك عَلَيْهِ:الفَتْخُ والفَتْخَة: باطِنُ مَا بينَ العَضُدِ والذّراعِ. والفَتَخُ فِي الرِّجّلَيْن طُولُ
              العَظْمِ وقِلْةُ اللَّحْمِ (قَالَ الشَّاعِر:على فَتْحَاءَ تَعْلَمُ حِين تَنْجُووَمَا إِنْ حَيْثُ تَنْجُو من
              طَرِيقِقَالَ: عَنَى بالفَتخاءِ رِجْلَه، قَالَ: وهاذا صفةُ مُشتار العسلَ) .وَقَالَ الأَصمعي: فَتْخاءُ قَدَمٌ
              ليِّنةٌ. وَقَالَ أَبو عَمرو: فِيهَا عَوَجٌ، وَفِي (الأَساس) : وتَفتَّختِ المرأَةُ، وخَرَجَتْ مُتفَتِّخةً. والضَّفادِهُ
              فُتْخ الأَرْجُلِ.'
