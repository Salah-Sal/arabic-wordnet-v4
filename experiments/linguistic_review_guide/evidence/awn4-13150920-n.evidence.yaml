        definitions_text: '(حيس) - في الحديث: "أَنَّه أولَمَ بِحَيْسٍ  ".أصلُ الحَيْس الخَلْط، وهو في الحَدِيث الأَقِط والتَّمر
          يُخْلَطان بالسَّمن، وحِسْنَا الحَيْسَ: عَمِلْناه. ومنه قَولُ الحَارِث:* وإذا يُحاسُ الحَيْس يُدعَى جُنْدَب * .وحَيَّستُه
          تَحْيِيساً  أيضا، وحِستُ الحبلَ: فَتلْته، لأن قُواه تختَلِط بَعضُها ببعض.'
