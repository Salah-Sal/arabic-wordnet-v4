            is_partial: 0
            definitions_text: 'تخخ: (التَّخُّ عُصَارَةُ السِّمْسِمِ) ، وَهُوَ الكُسْب. (و) } التَّخُّ: (العَجِينُ الحامِضُ)
              المُستَرْخِي. (وَقد {تَخَّ) العَجينُ} يَتُخُّ {تُخُوخاً و (} تُخُوخةً) ، إِذا كثُرَ ماؤُه حتَّى يَلِين، وكذالك
              الطِّين إِذا أُفْرِطَ فِي كثْرةِ مائِه حتّى لَا يُمْكِن أَن يُطيَّن بِهِ. ( {وأَتَخَّهُ) صاحبُه إِذا فعل بِهِ
              ذالك.(} والتَّخْتَخَة: اللُّكْنَةُ) وَهُوَ فِي بعْض حِكَايَة الأَصوات كأَصواتِ الجِنّ. (وَهُوَ) أَي الرَّجلُ
              ( {تَخْتَاخٌ} - وتَخْتَخَانيٌّ) ، بفتحهما، أَي (أَلكَنُ) ، سُمِّيَ من ذالك.(وأَصبحَ) الرَّجُلُ ( {تَاخًّا، أَي)
              مُؤْتَثِئاً، وَهُوَ الّذي (لاَ يَشْتَهِي الطَّعَامَ) .(} وتِخ تِخْ، بِالْكَسْرِ: زَجْرٌ للدَّجَاجِ) .'
