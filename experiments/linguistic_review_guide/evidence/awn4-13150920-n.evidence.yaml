              [فتخ] فَتَخَ أصابع رجله في جلوسه فَتْخاً: ثناها وليَّنها. قال الأصمعيّ: أصل الفَتَخِ اللِين، تقول: رجلٌ أفْتَخُ بيِّن الفَتَخِ، إذا كان عريض الكفِّ والقدم مع اللِين. قال المتنخِّل الهذَلي:
              فُتْخُ الشمائل في أيمانهم روح  وعقاب فَتْخاءُ لأنها إذا انحطَّت كسرت جناحيها وغمزتهما. وهذا لا يكون إلا من اللين. والفتخة بالتحريك: حلقة من فضة لافص فيها، فإذا كان فيها فَصٌّ فهو الخاتم، والجمع فَتَخٌ وفَتَخاتٌ. وربما جعلتها المرأة في أصابع رجليها. وقال :
              يسقط منها فتخى في كمى
