        form: null
        is_partial: 0
        definitions_text: 'يتم في هذا التركيب - بحسب النموذج والنقشة - وضع ثقوب صغيرة (فراغات، تخريم)، أو يوجد به عدد من الفتحات
          الكبيرة في مادة القماش نفسها. 1. أنواع أنسجة القماش: الشبيكة، الشبيكة اللامعة، التركيب النسجي (عايده)، نسيج الكانافاه.
          2. أنواع قماش التريكو: تراكيب نسجية تكون فيها كل شبكة من الخيوط، أو بعضها، مُتدلية (المواصفة القياسية الألمانية
          DIN: يمين/ يسار تطريز مفرغ).'
