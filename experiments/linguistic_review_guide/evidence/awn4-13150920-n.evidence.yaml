              فتخ
              1 فَتِخَ, [aor. ـَ inf. n. فَتَخٌ, He, or it, had one, or another, of the qualities denoted by the following explanations of فَتَخٌ: (L:) the primary signification is softness, or suppleness: (As, S, L:) in a man, it is width, or breadth, and softness, or suppleness, of the hand and foot: (S:) or it signifies laxness, and softness, or suppleness, (L, K,) and width, or breadth, (L,) in the joints: (L, K:) or softness, or suppleness, in the joints &c.: (L:) or width, or breadth, and length, of the hand and foot: (L, K:) and in a lion, it is width, or breadth, of the claws, and softness, or suppleness, of the joints: (L:) in camels, i. q. طَرَقٌ [i. e. weakness in the knees; &c.; as inf. n. of طَرِقَ, q. v., the having weakness in the knees; &c.]; (L;) or in camels it is the like of طَرَقٌ: (K, TA: [in the CK, erroneously, طَرْق:]) and in the legs, or hind legs, (فِى الرِّجْلَيْنِ,) it is length of the bone, and paucity of the flesh. (L.) A2:  فَتَخَ, (T, S, A, Mgh, K,) aor. ـَ (TK,) inf. n. فَتْخٌ; (S, TA;) and ↓ فتّخ, (K,) inf. n. تَفْتِيخٌ; (TA;) He made [or spread] wide his أَصَابِع [here meaning toes], and made them lax: (K:) or he bent, and made supple, his toes in his sitting [in prayer]: (S:) or he bent his toes towards the sole of the foot in prostration; so accord. to Yahyà Ibn-Sa'eed: (TA:) or he (a person [sitting] in the act of التَّشَهُّد [q. v.]) made his toes supple, and pressed the joints thereof towards the sole of the foot: (A:) or he bent his toes towards the upper side of the foot, (T, Mgh, TA,) not towards the sole thereof. (T, TA.) [See also فَتَحَ.]2 فَتَّخَ see the preceding paragraph, latter half.4 افتخ He (a man, TA) was, or became, fatigued, (K,) or relaxed and fatigued, (TA,) and out of breath. (K, TA.) 5 تَفَتَّخَتْ is said of a woman [as meaning She put on, or wore, a ring of the kind termed فَتَخَة, or rings such as are termed فَتَخ]. (A: in which it is added, وَكَانَتْ نِسَاؤُهُمْ يَتَفَتَّخْنَ فِى أَصَابِعِهِنَّ العَشْرِ [And their women used to wear فَتَخ upon  their ten fingers or toes; i. e. upon all their fingers and the thumbs or upon all their toes].) فَتَخٌ: see فَتَخَةٌ. b2:  Also Any [little bell such as is termed] جُلْجُل, (K,) thus in all the copies of the K that we have, but in the L any خَلْخَال [i. e. anklet], (TA,) that does not make a sound. (K, TA.) A2:  And The inner side of the part between the upper arm and the fore arm; as also ↓ فَتَخَةٌ. (TA.) فَتْخَةٌ: see what next follows.
              فَتَخَةٌ (S, L, K, &c.) and ↓ فَتْخَةٌ, (K,) the latter disapproved by MF, but mentioned by more than one of the leading authorities respecting strange words, (TA,) A خَاتَم [here improperly used as meaning simply ring] without a stone, or gem: (A:) or a ring (حَلْقَة) of silver without a stone, or gem; if having in it a stone, or gem, it is called خَاتَمٌ: or a خَاتَم [meaning ring] (L, K) of large size, (K,) upon [a finger of] the hand and [upon a toe of] the foot, (L, K,) with, and without, a stone, or gem: (L:) or a ring (حَلْقَة), (L, K,) of silver, (K,) worn on the إِصْبَع [i. e. finger], (L,) like a خَاتَم: (L, K:) pl. ↓ فَتَخٌ [or rather this is a coll. gen. n. of which فَتَخَةٌ is the n. un.] (S, A, L, K) and فَتَخَاتٌ (S, L, K) and فُتُوخٌ (L, K) and فِتَاخٌ: (L:) the women sometimes put them upon their toes: (S:) or they are properly upon the toes: (IB:) the women of the Time of Ignorance used to put them upon their عَشْر [i. e. ten fingers or toes]. (L.) A2:  See also فَتَخٌ.
              فُتُوخٌ The joints of the claws of the lion. (K.) b2:  And a pl. of فَتَخَةٌ [q. v.]. (L, K.) أَفْتَخُ Having the quality termed فَتَخٌ [expl. in the first sentence of this art.]: as an epithet applied to a man, wide, or broad, in the hand and foot, with softness, or suppleness: (S:) or it signifies lax, or relaxed, and soft, or supple, and wide, or broad, in the joints: or soft, or supple, in the joints &c.: (L:) and, applied to a lion, wide, or broad, in the fore and hind feet, with softness, or suppleness: (L, K: *) fem. فَتْخَآءُ: and pl. فُتْخٌ. (S, L.) [See an ex. in a verse cited voce رَوَحٌ.]
              b2:  The fem., applied to a she-camel, means Having what is termed طَرَقٌ [expl. above: see 1]. (L.) And فَتْخَآءُ الأَخْلَافِ, so applied, Whose teats rise towards her belly; denoting a quality discommended; but the like in the woman and in the cloven-hoofed animal is commended. (K) b3:  Also (i. e. the fem.) Any female bird having lax, or relaxed, wings: afterwards used as a name for the eagle: (MF:) or it is an epithet applied to an eagle; you say عُقَابٌ فَتْخَآءُ, (S, L, K,) meaning an eagle having soft, or supple, wings; (L, K;) because, when it descends, it contracts its wings, and this is only from softness, or suppleness. (S, L.) b4:  And, applied to a foot, accord. to As, Soft, or supple: and accord. to AA, having in it a crookedness, or curvature. (TA.) Frogs are فُتْخُ الأَرْجَلِ [app. meaning Soft, or supple, in the hind legs]. (A, TA.) b5:  أَفْتَخُ الطَّرْفِ, applied to a gazelle, (A,) or to a man, (K,) means Languid in respect of the eye. (A, K.) A2:  And فَتْخَآءُ signifies also A thing, (K, TA,) four-sided, (TA,) resembling a مِلْبَن [app. here meaning the thing thus called upon which bricks are carried from place to place], of wood, upon which the gatherer of [wild] honey sits: (K, TA:) then he is drawn, or pulled, [up] from  above, until he reaches the place of the honey [which is generally in a cliff]. (TA.) أَفَاتِيخُ Certain things, or little things, (هَنَوَاتٌ,) of the [fungi termed] فُقُوع, which, when they first come forth, are thought to be truffles, until they are extracted, whereupon they are known: (K, TA:) so says AHn, without mentioning a sing. thereof. (TA.)
