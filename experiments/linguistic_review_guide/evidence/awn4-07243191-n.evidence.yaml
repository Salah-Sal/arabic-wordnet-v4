            definitions:
            - sense_index: 0
              text: 'ختام السَّادة: وَقد أورد بعض السَّادة الأخيار عَلَيْهِم الرَّحْمَة والغفران أَن تحقق بعض المواضيع الدِّينِيَّة
                والدنيوية وَحُصُول البركات الصورية والمعنوية لجَمِيع الأصدقاء والاخلاء وخذلان الْأَعْدَاء لَهُ أثر عَظِيم
                وَذَلِكَ بِوَاسِطَة الختمة وَهُوَ مَوْجُود فِي هَذِه القصيدة:(من حرز السَّادة أورد لكم حِكَايَة ... عَن بعض
                الْمَشَايِخ هَذِه الرِّوَايَة)(وعندما يعترضك مشكلة لَيْسَ لَك ... الْقُدْرَة على حلهَا أَو دَفعهَا لَا تقلها
                لأحد)(اختم الْقُرْآن وَلَا تَتَكَلَّم مَعَ أحد ... وَأَنت تقْرَأ هَذِه الختمة)(وَمهما كَانَت نِيَّة هَذِه
                الختمة ... فَإِنَّهُ وَمن لطفه سيجيبك على أَي سُؤال) (اقرأه يَوْم الْجُمُعَة من الِاثْنَيْنِ فِي ... اللَّيَالِي
                الْأُخْرَى فَلَيْسَ لَهَا أثر بَين)(تطهر أَولا أَيهَا الصّديق ... واغسل بدنك من الْجَنَابَة)(وَحَتَّى يكون
                التَّوْفِيق محالفا ... لَك اقْرَأ الْفَاتِحَة سبع مَرَّات)(وَبعد الْفَرَاغ من قِرَاءَة الْفَاتِحَة ... ارسل
                السَّلَام على الرَّسُول مائَة مرّة)(وعندما تفرغ من هَذِه الْقِرَاءَة والسلامات ... تصبح يقضا فاقرأ (ألم نشرح)
                تسع وَسبعين مرّة)(وعندما تصل إِلَى هُنَا فَقل بِسم الله ... واقرأ (قل هُوَ الله أحد) ألفا وَمرَّة وَاحِدَة)(وَفِي
                الآخر عِنْدَمَا تَنْتَهِي أَيهَا الرجل الصَّالح ... اعد قِرَاءَة الْفَاتِحَة سبع مَرَّات)(وكما فِي الأول أعد
