            headword: قدمة قياس
            headword_bare: قدمة قياس
            headword_norm: قدمة قياس
            root: قدم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: هي جهاز لقياس الأطوال، حيث يمكن بواسطة فكي قياس القيام بعمليات قياس للقطر الخارجي والداخلي،
              وأيضاً قياس الأعماق باستخدام مسبار الأعماق. وتحتوي القدمات الكلاسيكية على تدريج ورنية، وذلك لرفع مستوى دقة القراءات.
              أمّا في قدمات القياس الحديثة فتتم قراءة قيم القياس من خلال بيان رقمي. ويمكن في بعض الموديلات نقل البيانات إلى
              جهاز كمبيوتر شخصي للقيام بمزيد من عمليات المُعالجة الأخرى.
