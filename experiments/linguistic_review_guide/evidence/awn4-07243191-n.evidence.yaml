              text: '(خَتَمَ اللَّهُ عَلَى قُلُوبِهِمْ)وسأل ابن الأزرق عن قوله تعالى: (خَتَمَ اللَّهُ عَلَى قُلُوبِهِمْ) .فقال
                ابن عباس: طبع عليها، واستشهد بقول الأعشى:وصهباء طاف يهود بها. . . فابرزها وعليها ختم(تق، ك، ط)= الكلمة من
                آية البقرة 7، فى الذين كفروا: (خَتَمَ اللَّهُ عَلَى قُلُوبِهِمْ وَعَلَى سَمْعِهِمْ وَعَلَى أَبْصَارِهِمْ غِشَاوَةٌ
                وَلَهُمْ عَذَابٌ عَظِيمٌ (7) .ومعها آيتا:الآنعام 46: (قُلْ أَرَأَيْتُمْ إِنْ أَخَذَ اللَّهُ سَمْعَكُمْ وَأَبْصَارَكُمْ
                وَخَتَمَ عَلَى قُلُوبِكُمْ مَنْ إِلَهٌ غَيْرُ اللَّهِ يَأْتِيكُمْ بِهِ) .والجاثية 23: (أَفَرَأَيْتَ مَنِ اتَّخَذَ
                إِلَهَهُ هَوَاهُ وَأَضَلَّهُ اللَّهُ عَلَى عِلْمٍ وَخَتَمَ عَلَى سَمْعِهِ وَقَلْبِهِ وَجَعَلَ عَلَى بَصَرِهِ
                غِشَاوَةً فَمَنْ يَهْدِيهِ مِنْ بَعْدِ اللَّهِ أَفَلَا تَذَكَّرُونَ (23) .ومن المادة جاء الفعل الثلاثى مضارعا
                فى آيتى: يس 6 (نختم على أفواههم)والشورى 24: (يختم على قلبك) .و (رَسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ) فى
                الأحزاب 40.ومختوم وختام فى آيتى المطففين فى نعيم أصحاب الجنة(يُسْقَوْنَ مِنْ رَحِيقٍ مَخْتُومٍ (25) خِتَامُهُ
                مِسْكٌ وَفِي ذَلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُونَ (26) . وتأويلها فى المسألة: طبع على قلوبهم، نحو ما قاله
                الطبرى فى تأويله. وعلىما يبدو من وضوحه وقربه، فيه أن البيان القرآني استعمل الطبع على القلبوالقلوب، فى إحدى
                عشرة آية، سياقها جميعا فيما يطبع الله على قلوب الكفار والمنافقين والمعتدين، وكل متكبر جبار.ولا يبعد عنه سياق
                آيات الختم على القلب والقلوب، لكن الكلمة جاءت على أصل معناها القريب في (رحيق مختوم. ختامه مسك) وفى (خاتم النبيين)
                فلعل فى الختم على القلوب دلالة الإغلاق وغاية الإقفال، منقولا إليها من قولهم: ختمَ الكتاب أنهاه، والأمور بخواتيمها،
                والله أعلم.وواضح أن الختم على القلوب، لا يراد به أصل معناه، وإنَّما هو كناية عنرسوخ الغفلة والضلال، وراء معناه
                القريب فى الختم. وكذلك الطبع على القلوب كناية عن الدمغ.ونقل الراغب، قول من ذهبوا فيه إلى أن المعنى القريب
                من الختم هو المرادأى: جعل الله ختما على قلوب الكفار، ليكون دلالة للملائكة على كفرهم.ثم رده، بقوله: وليس ذلك
                بشيء، فإن هذه الكناية إن كانت محسوسة، فمن حقها أن يدركها أصحابُ التشريح، وإن كانت معقولة غير محسوسة، فالملائكة
                باطلاعها على اعتقاداتهم مستغنية عن الاستدلال (المفردات) .يعني: الاستدلال على كفر الكافرين بعلامة حسية، ختما
                على قلوبهم.'
