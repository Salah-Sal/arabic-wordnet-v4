                خاتَم1/ خاتِم1 [مفرد]: ج خَواتِمُ:1 - حَلْقة ذات فَصٍّ تُلبس في الإصبع "كالخاتم في إصبع زوجته- خاتم الخطوبة/ الزواج- فَالْتَمِسْ وَلَوْ خَاتَمًا مِنْ حَدِيدٍ [حديث] " ° خاتم المُلك: يضرب مثلا في النفاسة والشرف- خاتم سليمان: يضرب به المثل في الشَّرف والعلوّ ونفاذ الأمر- فصّ الخاتم: الحجر المركّب فيه.2 - ما يُختم به "بصمه بخاتمه- ختم الوثيقةَ بخاتم شعار الجمهوريّة- {خَاتَمُهُ مِسْكٌ} [ق] ".3 - بصمة أو طبعة خاتم، أثر نقش الخاتم "وثيقة تحمل خاتم وزير الماليّة".4 - بَكارة "زُفَّت إليه بخاتمها" ° ما زالت بخاتم ربِّها: ما زالت بكرًا.5 - نقرة القفا "احتجم في خاتم قفاه". 
                خاتَم2/ خاتِم2 [مفرد]: ج خَواتِمُ وخَواتِيمُ:1 - آخِر "اللَّهم اجعل خير أعمالنا خواتيمها- {وَلَكِنْ رَسُولَ اللهِ وَخَاتِمَ النَّبِيِّينَ} [ق] ".2 - من أسماء نبيّ المسلمين محمد صلَّى الله عليه وسلَّم أي: آخر النبيين "محمَّد صلَّى الله عليه وسلَّم خاتم النَّبيّين". 
                خاتِمة [مفرد]: ج خاتمات وخَواتِمُ وخَواتِيمُ:1 - عاقبة كلّ شيء وآخِرته ونهايته، عكسه: بدايته "خواتيم الأعمال- العبرة بالخواتم" ° الأعمال بخواتيمها/ الأمور بخواتيمها: الأمور مرهونة بنتائجها وعواقبها- خاتمة الحكاية: مثل أو حكمة يُختم بها السرد القصصيّ- خاتمة السورة: نهايتها، آخرها- خاتمة المطاف: النهاية، وما ينجلي عنه الأمر.2 - إمضاء، توقيع.• خاتمة حِكْمِيَّة: (بغ) جملة محتوية على حكمة ينتهي بها شرح أو خطاب. 
                خِتام [مفرد]:1 - مصدر ختَمَ/ ختَمَ على/ ختَمَ لـ.2 - طين أو شمع يُختم به على الشَّيء "ختامٌ على وصيَّة- {خِتَامُهُ مِسْكٌ} ".3 - خاتمة، آخر، نهاية، عاقبة "حضر خِتام المؤتمر- {خِتَامُهُ مِسْكٌ وَفِي ذَلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُونَ}: آخر شُرْبه ونهايته" ° جَلْسَة الختام: الجلسة الأخيرة- ختامًا: لفظ تُنْهى به الرسائلُ والخطبُ والمحاضرات ونحوها، أخيرًا، في النهاية- في الختام/ وفي الختام: ختامًا، في آخر الأمر- مِسْك الخِتام: خاتمة حسنة، خلاصةُ الكلام وخاتمته وأجمل ما فيه.4 - خاتم1، بكارة "فضَّ خِتامها في الحلال". 
                خِتاميّ [مفرد]: اسم منسوب إلى خِتام: نهائيّ، أخير "حضر الجلسة الختاميّة لأعمال المؤتمر". 
                خَتْم [مفرد]: ج أختام (لغير المصدر) وختوم (لغير المصدر)، جج ختومات (لغير المصدر):1 - مصدر ختَمَ/ ختَمَ على/ ختَمَ لـ.2 - خاتم1، ما يُختم به على الأوراق، يصنع عادة من المعدن أو المطاط، وله مِقْبَض "خَتْم الشهادةِ بخَتْم شعار الدولة" ° خَتْمُ البريد.3 - خاتم1، أثر نقش الخاتم، علامته المميّزة، بصمة أو طبعة خاتم "وثيقة تحمل خَتْمًا جمهوريًّا" ° نَزْعُ الأختام: إنهاء وضعها بأمر من المحكمة، إزالة الأختام الرسميّة الموضوعة على باب أو أثاث- وضعُ الأختام: وَضْع بصمة أو طبعة خاتم رسميّ على باب أو على شيء منقول بحيث لا يمكن أخذ شيء دون كسر الأختام.4 - حفلة يختم فيها القرآن الكريم. 
                خَتْمة [مفرد]: ج خَتَمات وخَتْمات:1 - اسم مرَّة من ختَمَ/ ختَمَ على/ ختَمَ لـ.2 - قراءة القرآن الكريم ثوابًا للمتوفّي "قرأ الخَتْمةَ ووهب ثوابها لوالده".3 - رسمٌ يأخذه المعلِّم من التلميذ إذا ختم القرآن الكريم.4 - مصحف، نسخة من القرآن الكريم ° والخَتْمة الشريفة/ وحياة الخَتْمة: قَسَمٌ بالقرآن الكريم.5 - جلسة يقرأ فيها التلميذُ على معلِّمه كلَّ القرآن أو جزءًا منه.
