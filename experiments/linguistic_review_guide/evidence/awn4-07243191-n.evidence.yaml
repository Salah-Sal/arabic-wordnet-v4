            definitions:
            - sense_index: 0
              text: 'خَتم(خَتَمه يَخْتِمه خَتْماً وخِتاماً) بالكَسْر، وَهَذِه عَن اللِّحياني، أَي: (طَبَعَه) ، فَهُوَ مَخْتوم
                ومُخَتَّم، شُدّد للمُبالَغة، قَالَه الجَوْهَرِيّ. وَقيل الْخَتْم: إخفاءُ خَبَرِ الشَّيْء يُجْمَع أطرافِه عَلَيْهِ
                على وَجْه يَتَحَفَّظ بِهِ.(و) من الْمجَاز: خَتَم (عَلَى قَلْبِه) إِذا جَعَله لَا يَفْهَم شَيْئاً، وَلَا يَخْرُج
                مِنْهُ شَيْء) ، كَأَنَّهُ طُبع. وَمِنْه قَوْله تَعَالَى: {ختم الله على قُلُوبهم} ، وَهُوَ كَقَوْلِه: طَبَع
                الله على قُلوبِهم فَلَا تَعْقِل وَلَا تِعِي شَيْئا. وَقَالَ الزجّاج: مَعْنى خَتَم وطَبَع وَاحِد فِي اللّغة،
                وَهُوَ التَّغْطِية على الشّيء والاستِيثاق من أَن لَا يَدْخُلَه شَيْء، كَمَا قَالَ جلّ وَعلا: {أم على قُلُوب
                أقفالها} . (و) خَتَم (الشيءَ خَتْماً: بَلَغ آخِرَه) ، كَمَا فِي المُحْكم. وَقَالَ الرّاغب: " الخَتْم والطَّبْع
                يُقَال على وَجْهين: الأولُ تأثِيرُ الشيءِ بِنَقْش الخَاتَم والطَابع، وَالثَّانِي الأثرُ الْحَاصِل عَن النَّقْش،
                ويُتَجَوَّز بِهِ تَارَة فِي الاستِيثاق من الشَّيء والمَنْع مِنْهُ اعْتِبَارا لِمَا يَحْصُل من المَنْع بالخَتْم
                على الكُتُب والأبواب، وتَارةً فِي تَحْصِيل أثر شَيْء عَن شَيْء اعْتِبَارا بالنَّقْش الْحَاصِل، وَتارَة يُعْتَبر
                فِيهِ بُلُوغ الآخِر، وَمِنْه: خَتَمتُ الْقُرْآن أَي: انْتَهَيتُ إِلَى آخِره، فقاله تَعَالَى: {ختم الله على
                قُلُوبهم} إِشَارَة إِلَى مَا أَجْرَى اللهُ بِهِ الْعَادة أنَّ الْإِنْسَان إِذا تَناهَى فِي اعْتِقَاد باطلٍ،
                وارتكاب مَحْظور فَلَا يَكُون مِنْهُ تَلَفُّت بِوَجْهٍ إِلَى الحَقّ، يُورِثُه ذلِك هَيْئةً تُمَرِّنُه على اسْتِحْسَان
                المَعاصي، فَكَأَنما يُخْتَم بِذلِك على قَلْبه، وعَلى هَذَا النَّحْو استعاره لِلإِغْفالِ والكِنّ والقَساوة.وَقَالَ
                الجُبَّائي: جَعَل اللهُ خَتْمًا على قُلوبِ الكُفَّارِ ليكونَ دَلالةً للملائِكة على كُفْرِهِم، فَلَا يَدْعُون
                لَهُم. قَالَ الرّاغبُ: ولَيْس ذَلِك بِشَيْء؛ فَإِن هَذِه الكِتابَةَ إِن كَانَت مَحْسُوسةً فَمن حَقِّها أَن
                يُدرِكَها أصحابُ التشريح، وَإِن كَانَت مَعْقُولَة فالمَلائِكة باطِّلاعهم على اعتِقاداتهم مُسْتَغْنِيةٌ عَن
                الاسْتِدلال.(و) من المَجاز: خَتَم (الزَّرعَ) يَخْتِمه خَتْماً، (و) خَتَم (عَلَيْهِ) : إِذا (سَقَاهُ أَوَّلَ
                سَقْيَهُ) وَهُوَ الخَتْم. والخِتامُ اسمٌ لَهُ؛ لأنّه إِذا سُقِي خُتِم بالرَّجاء، وَقد خَتَموا على زُرُوعِهم
                أَي: سَقَوْها، وَهِي كِرابٌ بعد. قَالَ الطَّائِفي: " الخِتامُ: أَن تُثارَ الأرضُ بالبَذْر حَتَّى يَصِير البَذرُ
                تحتَها، ثمَّ يَسْقُونَها، يَقُولُونَ: خَتَموا عَلَيْهِ. قَالَ الأزهريّ: وأصل الخَتْم: التَّغْطِية، وخَتْمُ
                البّذْر تَغْطِيَتُه " ز(و) الخِتامُ، (كَكِتاب: الطِّينُ يُختَم بِهِ على الشَّيْء) . يُقَال: مَا خِتامُك؟ طينٌ
                أم شْمعٌ؟(والخَاتَم) بِفَتْح التَّاء: (مَا يُوضَع على الطِّينة) ، وَهُوَ اسمٌ مِثْلُ العالَم.(و) من الْمجَاز:
                لَبِس الخاتَم، وَهُوَ (حَلْي للإِصْبَع كالخَاتِم) ، بِكَسْر التَّاءِ، لُغَتان.وَفِي الحَدِيث: " آمين خاتَمُ
                رَبّ العَالمين على عِبادِه الْمُؤمنِينَ ". أَي: طابعه وعَلامَتُه الَّتِي ترفَع عَنْهُم الأَعراضَ والعَاهَات؛
                لأنّ خاتَم الكتابِ يَصُونه ويَمْنَع النَّاظرين عَمَّا فِي بَاطِنه.(والخَاتامِ والخَيْتَامِ والخِيتَامِ) بالكَسْر
                (والخَتَم مُحَرَّكة والخَاتِيام) ، فَهِيَ لغاتٌ سَبْعَة نقلَها ابنُ سِيدَه مَا عَدَا الْأَخِيرَة، وَاقْتصر
                الجوهريُّ على الخَمْسَة الأُولى، وَزَاد ابنُ مَالك: الخًيْتَمَ كَحَيْدَر، وَجَمَعَها خَمْسَ لُغاتٍ فِي قَوْلِه:(فِي
                الخَاتَم الخَيْتَمَ والخَيْتَامَا ... )(يَرْوُون والخَاتِمَ والخَاتَامَا ... )وقولُ شَيْخِنا: " وَفِي كَلَام
                المُصَنّف سِتٌّ فِيهِ نَظَر "، بل سَبْع، ونَظَمَها الزّينُ العِراقِيّ الْحَافِظ مُسْتَوفَاة اللُّغات، فَقَالَ:(خُذ
                عدّ نَظْم لُغاتِ الْخَاتم انْتَظَمت ... ثمانِيًا مَا حَواها قَبْلُ نَظّامُ)(خَاتَامُ خَاتَمُ خَتْمٌ خَاتِمٌ
                وخَتامٌ ... خاتِيامٌ وخَيْتومٌ وخَيْتامُ) وَهَمْز مَفْتوح تَاء تَاسِع وإِذا ... ساغَ القِياس أَتمَّ العشرَ
                خَأْتامُ)وَلم يذكر النَّاظِم خَتَمًا مُحَرَّكة، وَقد ذَكَره المصنِّف وابنُ سِيده وابنُ هِشام فِي شَرْح الكَعْبِيَّة.
                قَالَ ابنُ سِيْدَه: هُوَ من الحَلْي كَأَنّه أَوَّلَ وهلةٍ خُتِم بِهِ فدَخَل بذلِك فِي بَاب الطّابع، ثمَّ كَثُر
                اسْتِعْمالُه لِذلك وَإِن أُعِدَّ الخاتِمُ لغَيْر الطَّبْعِ، وَأنْشد الجوهريُّ للأعشى:(وَصَهْباءَ طَافَ يَهُودِيُّها ... وَأَبْرَزَها
                وَعَلَيْهَا خَتَم)أَي: عَلَيْهَا طِينَة مَخْتُومة مثل: نَفَضَ بمَعْنى مَنْفُوض.وَأنْشد ابنُ بَرِّيّ فِي الخَيْتام:(يَا
                هِنْدُ ذاتَ الجَوْرب المُنْشَقّ ... )(أَخَذْتِ خَيْتامِي بِغَيْر حَقّ ... )ويروى: خَاتَامى.قَالَ: وَقَالَ
                آخر:(أَتُوعِدُنا بخَيْتَامِ الأَمير ... )قَالَ: وشاهِدُ الخَاتَام مَا أَنْشَدَه الفَرَاء لبَعْض بني عُقَيْل:(لئِن
                كانَ مَا حُدِّثْتُه الْيَوْم صادِقاً ... أَصُمْ فِي نَهارِ القَيْظ للشَّمس بادِيا)(وأركبْ حمارا بَين سَرْجٍ
                وفَرْوَة ... وَأعْرِ من الخَاتَام صُغْرى شِمَالِيا)وأنشدَ الجَوْهَرِيّ فِي (د ر هـ م) :(لجَاز فِي آفاقِها
                خَاتَامي ... )(ج: خَوَاتِمُ وخَواتِيمُ) . قَالَ سِيبَوَيه: " الَّذين قَالُوا: خَوَاتيم إِنَّمَا جَعَلوه تَكْسير
                فَاعَال، وَإِن لم يكن فِي كَلامهم ". وَهَذَا دَلِيل على أنَّ سِيبَوَيه لم يَعْرِف خاتاما، (وَقد تَخَتَّمَ
                بِهِ) ، وَمِنْه الحَدِيث: " إنّ التَّخَتُّم باليَاقُوت يَنْفِي الفَقْر "، يُرِيد أَنه إِذا ذَهب مالُه بَاعَ
                خاتَمه فوَجَد فِيهِ غِنًى، قَالَ ابنُ الأثيرُ: والأشبَهُ - إِن صَحّ الحَدِيث - أَن يكون لَخَاصَّة فِيهِ.(و)
                الخاتَم (من كُلِّ شَيْء: عاقِبَتُه، وآخِرتُه خاتِمته) .(و) الخَاتَم: (آخِرُ القَوْم كالخاتِم) ، وَمِنْه قَولُه
                تَعَالَى: {وَخَاتم النَّبِيين} أَي: آخِرهم.وَقد قُرِئ بِضَم التّاء، وقَولُ العجّاج:(مُبارَكٍ للأنبياءِ خَاتِمِ ... )إِنما
                حَمَله على القِراءة المَشْهُورة فَكَسَر، وَقَالَ الفَرَّاء: قَرَأَ عليٌّ رَضِي الله تَعالى عَنهُ {خَاتَمُه
                مِسْك} ، يُرِيد آخِره.(و) الخَاتَم (من القَفَا: نُقرتُه) .يُقَال: احْتَجَم فِي خاتَم القَفا، وَهُوَ مجَاز.(و)
                الخَاتَم: (أَقلُّ وَضَح القَوائِم، وَهُو) أَي: الفَرَس (مُخَتَّم كَمُعَظَّم) بأشاعِره بَياضٌ خَفِيّ كاللُّمَعِ
                دون التَّخْدِيم.(و) الخَاتَم (من الفَرَس الأُنْثَى: الحَلْقة الدَّنْيَا من ظَبْيتها) على التَّشْبيه.(و) من
                الْمجَاز: (تَخَتَّم عَنهُ) أَي: (تَغافَل وسَكَت) .(و) تَخَتَّم (بأَمْره: كَتَمه) ، نَقله الزمخشَرِيّ.(و) من
                الْمجَاز أَيْضا: تَخَتَّم الرجلُ أَي: (تَعَمَّم) ، يُقَال: جَاءَ مُتَخَتِّمًا، أَي: مُتَعَمِّمًا. وَقَالَ
                الزَّمَخْشَرِيُّ: تَخَتَّم بِعِمامَتِه، أَي: تَنَقَّب بهَا. (والاسمُ التَّخْتِمَة) ، يقالُ: مَا أَحْسَنَ تَخْتِمَتَه،
                عَن الزّجَّاجّي.(و) المِخْتَم (كَمِنْبَر: الجَوْزَةُ) الَّتي (تُدْلَك لتَمْلاسَّ، وَيُنْقَدَ بهَا، فارِسِيَّتُه
                تِيْر) بِكَسْر التَّاء الفَوْقِيّة وَسُكُون التَّحْتِيَّة.(و) من الْمجَاز: (الخَتْمُ: العَسَلُ) .(و) أَيْضا:
                (أَفْواهُ خَلايَا النَّحْل) .(و) أَيْضا: (أَنْ تَجْمَعَ النَّحْلُ شَيْئاً من الشَّمْع رَقيقًا أرقَّ من شَمْع
                القُرْص، فَتَطْلِيَه بِهِ) . كَذَا فِي المُحْكَم، وَفِي الأساس: يُقال للنَّحْل إِذا مَلأَ شُوَرَته عَسَلاً:
                خَتَم.(والمَخْتومُ: الصَّاعُ) .(و) قَالَ ابنُ الأعرابيّ: (الخُتُم بِضَمَّتَيْن: فُصوصُ مَفاصِل الخَيْل، الواحِدُ
                كَكِتاب وعالَم) ، هَكَذَا فِي النُّسَخ. وَالَّذِي فِي نَصّ ابنِ الأَعْرابيّ: كَكِتاب وسَحاب.[] وَمِمّا يُسْتَدْرَكُ
                عَلَيْهِ:خَتَّم الشيءَ تَخْتِيماً، شُدِّد للمُبالغة، نَقله الجَوْهَرِيّ.والخَتْمُ: المنعُ.والخَتْمُ: حِفْظُ
                مَا فِي الكِتابِ بِتَعْلِيم الطّينَةِ.وَمن لُغاتِ الخاتَم: الخَتْم بالفَتْح، والجَمْع خُتومٌ، وخَيْتومٌ وخَأْتَم
                بِالْهَمْز مَعَ فَتْح التَّاء. الثلاثَةُ ذكرَهُنّ الوَلِيّ العِراقيّ كَمَا تَقَدّم. وَيُقَال: " فلانٌ خَتَمَ
                عليكَ بابَه: إِذا أَعْرَضَ عَنْكَ، وخَتَم فلانٌ لَكَ بابَه: إِذا آثَرَك على غَيْرِك. وَهُوَ مجَاز ". واخْتَتَمْتُ
                الشيءَ: نقيضُ افْتَتَحْتُه، نقلَه الجوهَرِيّ.وَفِي الأساس: " التَّحْمِيد: مُفْتَتَح القُرآن، والاستِعاذة مُخْتَتَمة
                "، وَبِهَذَا ظَهَر سُقوطُ قَولِ شَيْخِنا: إنّه لَا تَكاد تُوجَد المُخْتَتَم عِنْد لُغَوِيٍّ ثَبَت، وادَّعى
                آخرُون أَنَّهَا غَيْرُ فَصِيحة، بخِلاف المُفْتَتَح، فَإِنَّهُ فَصِيحٌ وَارِد كَثِيرٌ.ويُقالُ: الأَعْمالُ بخَواتِيمِها،
                إِنَّمَا هُوَ جَمْع خَاتم على الشّذوذ، وأنشَدَ الزَّجاجّ:(إنّ الخَلِيفة إِنَّ الله سَرْبَلَهُ ... سِرْبالَ
                مُلْك بِهِ تُرجَى الخَواتِيم)وَهُوَ ضَرُورة.وخِتام كل مشروب: آخِرُه، وقَولُه تَعالى: {ختامه مسك} ، أَي: آخر
                مَا يَجِدُونه رائحةُ المِسْك. وَقَالَ عَلْقَمَة: أَي: خِلطه مِسْك. وقَريبٌ من ذَلِك قَولُ مُجاهِد فِي مَعْناه:
                مِزاجُه مِسْك. وَقَالَ ابنُ مَسْعود: عاقِبَتُه طَعْمُ المِسْك. قَالَ الفَرّاء: والخَاتِم والخِتام مُتَقاربان
                فِي المَعْنى، وَمِنْه قِراءةُ عَلِيٍّ رَضِي الله تَعَالَى عَنهُ " خاتِمُه مِسْك "، قَالَ: ومثلُه قَوْلُك للرَّجل:
                هُوَ كَرِيم الطَّابِع والطِّباع. قالَ: وتَفْسِيرُه: أَنَّ أَحَدَهم إِذا شَرِبَ وَجَد آخر كَأْسَه رِيحَ المِسْك.
                وَقَالَ الرَّاغِب: " مَعْناهُ مُنْقَطَعُه وخاتِمَةُ شُرْبه، أَي: سُؤْرُه فِي الطِّيب مِسْك. قالَ: وقولُ مَنْ
                قَالَ: يُخْتَم بالمِسْك أَي: يُطْبَع، فَلَيْسَ بشَيْءٍ؛ لأنَّ الشَّراب يَجِب أَن يَطِيبَ فِي نَفْسِه، فأَمّا
                خَتْمُهُ بالطِّيب فَلَيْسَ مِمّا يُفِيدُه، وَلَا يَنْفَعُه طِيبُ خاتِمه مَا لم يَطِبْ فِي نَفْسِه " انْتهى.
                وخِتامُ الوَادِي: أقْصاه. وخِتامُ القَوْم: آخِرُهم. عَن اللّحياني.وَمن أسمائِه [] : الخاتَم والخاتِم، وَهُوَ
                الَّذِي خَتَم النُّبُوَّةَ بمَجِيئه. وَأَعْطانِي خَتْمِي أَي حَسْبِي، وَهُوَ مجَاز، قَالَ دُرَيْد بنُ الصِّمَّة:(وَإِنِّي
                دَعَوتُ اللهَ لَمَّا كَفَرْتَني ... دُعاءً فأَعطانِي على ماقِطٍ خَتْمِي)وَهُوَ من ذَلِك؛ لأّن حَسْب الرَّجُل
                آخِرُ طلبه.وَيُقَال: زُفَّت إِلَيْك بخاتَم رَبّها وبخِتامها، وسِيقَت هَدِيَّتُهم إِلَيْهِ بخِتامها. وَهُوَ
                مجَاز.والخَتْم: قريةٌ من قُرى خاكان من إِقليم فَرْغانَة، قَالَ الحافِظ: قَالَ أَبُو العَلاء الفَرَضِيُّ: أفادَنِي
                أَبُو عَبْدِ الله الأُوشِيُّ [الخَتْمِيُّ، نِسْبَة إِلَى خَتْم] .والخَتْمةُ، بالفَتْح ويُكْسر: المُصْحَفُ،
                عامِّيَّة.وَأَبُو العَبَّاس محمدُ بنُ جعفرٍ الخَوَاتِيمي: مُحَدِّث، عَن الحَسَن ابنِ عَرَفة، وَعنهُ الدَّارقُطْنِيُّ.والخَتْمُ
                عِنْد أهل الحَقِيقة: مَنْ يُخْتَم بِهِ الوِلايةُ المُحَمَّديةُ، وثُمّ خَتْمٌ آخرُ: من يُخْتَمُ بِهِ الوِلايَةُ
                العامَّة.'
