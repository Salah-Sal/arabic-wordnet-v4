              text: "ختم: خَتَمَه يَخْتِمُه خَتْماً وخِتاماً؛ الأَخيرة عن اللحياني:\nطَبَعَه، فهو مَختوم ومُخَتَّمٌ، شُدِّد\
                \ للمبالغة، والخاتِمُ الفاعِلُ،\nوالخَتْم على القَلْب: أَن لا يَفهَم شيئاً ولا يَخرُج منه شيء كأَنه طبع. وفي\n\
                التنزيل العزيز: خَتَم اللهُ على قلوبهم؛ هو كقوله: طَبَعَ الله على\nقلوبهم، فلا تَعْقِلُ ولا تَعِي شيئاً؛ قال\
                \ أَبو إِسحق: معنى خَتَمَ وطَبَعَ\nفي اللغة واحدٌ، وهو التغطية على الشيء والاستِيثاقُ من أَن لا يَدخله شيء\n\
                كما قال جلّ وعلا: أَم على قلوب أَقفالُها؛ وفيه: كلا بلْ رَانَ على\nقلوبهم؛ معناه غَلَبَ وغَطَّى على قلوبهم\
                \ ما كانوا يكسبون، وقوله عز وجلّ:\nفإِن يشإِ الله يَخْتِمْ على قلبك؛ قال قتادة: المعنى إِن يشإِ\nالله يُنْسِكَ\
                \ ما آتاكَ، وقال الزجاج: معناه إِن يشإِ الله يَرْبِطْ على\nقلبك بالصبر على أَذاهم وعلى قولهم أَفْتَرَى على\
                \ الله كَذِباً.\nوالخاتَمُ: ما يُوضَع على الطيِّنة، وهو اسم مثل العالَمِ. والخِتامُ:\nالطِّينُ الذي يُخْتَم\
                \ به على الكتاب؛ وقول الأَعشى:\nوصَهْباء طاف يَهُودِيُّها،\nوأَبْرَزَها وعليها خَتَمْ\nأَي عليها طينة مختومة،\
                \ مِثلُ نَفَضٍ بمعنى مَنْفُوضٍ وقَبَضٍ بمعنى\nمَقبوضٍ. والخَتْمُ: المنع. والخَتْم أَيضاً: حفْظُ ما في الكتاب\
                \ بتَعْلِيم\nالطِّينَة. وفي الحديث: آمين خاتَمُ رب العالمين على عباده المؤمنين؛\nقيل: معناه طَابَعُه، وعلامتُه\
                \ التي تدفَعُ عنهم الأَعراضَ والعاهات، لأَن\nخاتَمَ الكتاب يَصُونهُ ويمنَعُ الناظرين عما في باطنه، وتفتح تاؤه\n\
                وتُكْسَرُ، لُغَتان.\nوالخَتَمُ والخاتِمُ والخاتَمُ والخاتامُ\nوالخَيْتامُ: من الحَلْي كأَنه أَوّل وَهْلة خُتِمَ\
                \ به، فدخل بذلك في\nباب الطابَع ثم كثر استعماله لذلك وإِن أُعِدَّ الخاتَمُ لغير الطَّبْع؛\nوأَنشد ابن بري\
                \ في الخَيْتام:\nيا هِنْدُ ذاتَ الجَوْرَبِ المُنْشَقّ،\nأَخَذْتِ خَيْتامي بغير حقّ\nويروى: خاتامِي؛ قال: وقال\
                \ آخر:\nأَتُوعِدُنا بِخَيْتام الأَمِير\nقال: وشاهد الخاتام ما أَنشده الفراء لبعض بني عقيل:\nلئِن كان ما حُدِّثْته\
                \ اليومَ صادقاً،\nأَصُمْ في نهارِ القَيْظ للشمس باديا\nوأَرْكبْ حِماراً بين سَرْجٍ وفَرْوة،\nوأُعْرِ من الخاتامِ\
                \ صُغْرَى شِمالِيَا\nوالجمع خَواتِم وخَواتِيم. وقال سيبويه: الذين قالوا خَواتِيم إِنما\nجعلوه تكسير فاعالٍ،\
                \ وإِن لم يكن في كلامهم، وهذا دليل على أَن سيبويه لم\nيعرف خاتاماً، وقد تَخَتَّم به: لَبِسَهُ؛ ونَهى النبيُّ،\
                \ صلى الله عليه\nوسلم، عن التختُّم بالذهب. وفي الحديث: التَّخَتُّم بالياقوت يَنْفي الفقر؛\nيُريد أَنه إِذا\
