          - entry_id: 910733
            dictionary_id: 134
            headword: ختَمَ 
            headword_bare: ختم 
            headword_norm: ختم
            root: ختم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'ختَمَ خَتَمَ: طَبَعَ، أي أثّر في الشمع أو الطين أو نحوِه للسدّ أو العلامة أو لكليهما. فخَتَمَ
              على الكتاب: طَبَعَ عليه بالخاتم، وعلى فم الوِعاء: طبع عليه بعد ما سدّه لكيلا يدخل فيه شيء ولا يخرج منه شيء.
              وبالتجريد خَتَمَ على الشىء: أحكم سدّه. فالختم على القلب والسمع يراد به أن لا يدخل فيهما ما كان ليدخل فيهما لولا
              هذا الختم. والختم على فم الإنسان يراد به أن لا يخرج منه كلام، كما قال تعالى:{الْيَوْمَ نَخْتِمُ عَلَى أَفْوَاهِهِمْ}
              .وجاء الطبع على البصر أيضاً، كما في قوله تعالى:{أُولَئِكَ الَّذِينَ طَبَعَ اللَّهُ عَلَى قُلُوبِهِمْ وَسَمْعِهِمْ
              وَأَبْصَارِهِمْ} .وهذا من التجريد أو التغليب.'
