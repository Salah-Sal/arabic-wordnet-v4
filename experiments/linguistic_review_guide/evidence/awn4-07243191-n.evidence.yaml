          - entry_id: 816545
            dictionary_id: 118
            headword: الْخَاتم
            headword_bare: الخاتم
            headword_norm: الخاتم
            root: ختم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'الْخَاتم: بِفَتْح التَّاء الفوقانية بنقطتين وَكسرهَا الَّذِي يخْتم بِهِ بِالْفَارِسِيَّةِ انكشتري.
              وَرُوِيَ عَن الأنيس السالك أنس بن مَالك رَضِي الله عَنهُ أَنه قَالَ كَانَ خَاتم النَّبِي - صَلَّى اللَّهُ عَلَيْهِ
              وَسَلَّم َ - من ورق وَكَانَ فصه حَبَشِيًّا. وَرُوِيَ عَنهُ أَيْضا كَانَ نقش خَاتم النَّبِي - صَلَّى اللَّهُ
              عَلَيْهِ وَسَلَّم َ - مُحَمَّد - سطر - وَرَسُول - سطر - وَالله - سطر وَرُوِيَ عَنهُ أَيْضا أَن النَّبِي - صَلَّى
              اللَّهُ عَلَيْهِ وَسَلَّم َ - كَانَ إِذا دخل الْخَلَاء نزع خَاتمه وَرُوِيَ عَن ابْن عمر رَضِي الله عَنهُ قَالَ
              اتخذ رَسُول الله - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - خَاتمًا من ورق وَكَانَ فِي يَد أبي بكر وَعمر رَضِي الله
              تَعَالَى عَنْهُمَا ثمَّ كَانَ فِي يَد عُثْمَان رَضِي الله عَنهُ حَتَّى وَقع فِي بِئْر أريس نقشه مُحَمَّد رَسُول
              الله.وَاعْلَم أَنهم ميزوا خَاتم النُّبُوَّة عَن خَاتم يخْتم بِهِ بِإِضَافَة الأول إِلَى النُّبُوَّة وَالثَّانِي
              إِلَى النَّبِي - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ -. وَالظَّاهِر أَن المُرَاد بالخاتم فِي قَوْلهم خَاتم النُّبُوَّة
              هُوَ الْأَثر الْحَاصِل بِهِ لَا الطابع وإضافته إِلَى النُّبُوَّة إِمَّا بِمَعْنى أَنه ختم على النُّبُوَّة بحفظها
              وَحفظ مَا فِيهَا أَي بصيانتها عَن تطرق التَّكْذِيب والقدح إِلَيْهَا صِيَانة الشَّيْء المستوثق بالختم وَإِمَّا
              الْمَعْنى عَلامَة لنبوته - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - وَيحْتَمل أَن يكون من قبيل خَاتم فضَّة وَكَانَ
              ذَلِك الْخَاتم أَيْضا عَن نبوته.وَأَبُو عِيسَى التِّرْمِذِيّ رَحمَه الله حدث من طَرِيق أبي رَجَاء عتيبة فَإِذا
              هُوَ مثل زر الحجلة. وَأَيْضًا حدث عَن طَرِيق سعيد بن يَعْقُوب أَن الْخَاتم بَين كَتِفي رَسُول الله - صَلَّى
              اللَّهُ عَلَيْهِ وَسَلَّم َ - غُدَّة حَمْرَاء مثل بَيْضَة الْحَمَامَة. وَأَيْضًا حدث عَن طَرِيق مُحَمَّد بن
              بشار أَن الْخَاتم شَعرَات مجتمعات. وَأَيْضًا حدث عَن طَرِيق مُحَمَّد بن بشار حدث عَن بشر بن الوضاح أَنه كَانَ
              خَاتم النُّبُوَّة فِي ظَهره بضعَة نَاشِرَة أَي قِطْعَة من اللَّحْم مُرْتَفعَة. وَأَيْضًا حدث عَن أبي الْأَشْعَث
              أَحْمد بن الْمِقْدَام الْعجلِيّ الْبَصْرِيّ قَالَ أَنبأَنَا حَمَّاد بن زيد عَن عَاصِم الْأَحول عَن عبد الله
              بن سرجس قَالَ أتيت رَسُول الله - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - وَهُوَ فِي أنَاس من أَصْحَابه فَدرت هَكَذَا
              من خَلفه فَعرف الَّذِي أُرِيد فألقي الرِّدَاء عَن ظَهره فَرَأَيْت مَوضِع الْخَاتم على كَتفيهِ مثل الْجمع حولهَا
              خيلان كَأَنَّهَا الثآليل فَرَجَعت حَتَّى استقبلته فَقلت غفر الله لَك يَا رَسُول الله فَقَالَ وَلَك فَقَالَ الْقَوْم
              اسْتغْفر لَك رَسُول الله - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - فَقَالَ نعم وَلكم ثمَّ تَلا هَذِه الْآيَة {واستغفر
              لذنبك وَلِلْمُؤْمنِينَ وَالْمُؤْمِنَات} انْتهى.'
