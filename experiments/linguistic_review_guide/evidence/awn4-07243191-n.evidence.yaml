          - entry_id: 768815
            dictionary_id: 103
            headword: ختم
            headword_bare: ختم
            headword_norm: ختم
            root: ختم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: "ختم: خَتَمَه يَخْتِمُه خَتْماً وخِتاماً؛ الأَخيرة عن اللحياني:\nطَبَعَه، فهو مَختوم ومُخَتَّمٌ،\
              \ شُدِّد للمبالغة، والخاتِمُ الفاعِلُ،\nوالخَتْم على القَلْب: أَن لا يَفهَم شيئاً ولا يَخرُج منه شيء كأَنه طبع.\
              \ وفي\nالتنزيل العزيز: خَتَم اللهُ على قلوبهم؛ هو كقوله: طَبَعَ الله على\nقلوبهم، فلا تَعْقِلُ ولا تَعِي شيئاً؛\
              \ قال أَبو إِسحق: معنى خَتَمَ وطَبَعَ\nفي اللغة واحدٌ، وهو التغطية على الشيء والاستِيثاقُ من أَن لا يَدخله شيء\n\
              كما قال جلّ وعلا: أَم على قلوب أَقفالُها؛ وفيه: كلا بلْ رَانَ على\nقلوبهم؛ معناه غَلَبَ وغَطَّى على قلوبهم ما\
              \ كانوا يكسبون، وقوله عز وجلّ:\nفإِن يشإِ الله يَخْتِمْ على قلبك؛ قال قتادة: المعنى إِن يشإِ\nالله يُنْسِكَ\
              \ ما آتاكَ، وقال الزجاج: معناه إِن يشإِ الله يَرْبِطْ على\nقلبك بالصبر على أَذاهم وعلى قولهم أَفْتَرَى على الله\
              \ كَذِباً.\nوالخاتَمُ: ما يُوضَع على الطيِّنة، وهو اسم مثل العالَمِ. والخِتامُ:\nالطِّينُ الذي يُخْتَم به على\
              \ الكتاب؛ وقول الأَعشى:\nوصَهْباء طاف يَهُودِيُّها،\nوأَبْرَزَها وعليها خَتَمْ\nأَي عليها طينة مختومة، مِثلُ\
              \ نَفَضٍ بمعنى مَنْفُوضٍ وقَبَضٍ بمعنى\nمَقبوضٍ. والخَتْمُ: المنع. والخَتْم أَيضاً: حفْظُ ما في الكتاب بتَعْلِيم\n\
              الطِّينَة. وفي الحديث: آمين خاتَمُ رب العالمين على عباده المؤمنين؛\nقيل: معناه طَابَعُه، وعلامتُه التي تدفَعُ\
              \ عنهم الأَعراضَ والعاهات، لأَن\nخاتَمَ الكتاب يَصُونهُ ويمنَعُ الناظرين عما في باطنه، وتفتح تاؤه\nوتُكْسَرُ،\
              \ لُغَتان.\nوالخَتَمُ والخاتِمُ والخاتَمُ والخاتامُ\nوالخَيْتامُ: من الحَلْي كأَنه أَوّل وَهْلة خُتِمَ به، فدخل\
              \ بذلك في\nباب الطابَع ثم كثر استعماله لذلك وإِن أُعِدَّ الخاتَمُ لغير الطَّبْع؛\nوأَنشد ابن بري في الخَيْتام:\n\
              يا هِنْدُ ذاتَ الجَوْرَبِ المُنْشَقّ،\nأَخَذْتِ خَيْتامي بغير حقّ\nويروى: خاتامِي؛ قال: وقال آخر:\nأَتُوعِدُنا\
              \ بِخَيْتام الأَمِير\nقال: وشاهد الخاتام ما أَنشده الفراء لبعض بني عقيل:\nلئِن كان ما حُدِّثْته اليومَ صادقاً،\n\
              أَصُمْ في نهارِ القَيْظ للشمس باديا\nوأَرْكبْ حِماراً بين سَرْجٍ وفَرْوة،\nوأُعْرِ من الخاتامِ صُغْرَى شِمالِيَا\n\
              والجمع خَواتِم وخَواتِيم. وقال سيبويه: الذين قالوا خَواتِيم إِنما\nجعلوه تكسير فاعالٍ، وإِن لم يكن في كلامهم،\
              \ وهذا دليل على أَن سيبويه لم\nيعرف خاتاماً، وقد تَخَتَّم به: لَبِسَهُ؛ ونَهى النبيُّ، صلى الله عليه\nوسلم،\
              \ عن التختُّم بالذهب. وفي الحديث: التَّخَتُّم بالياقوت يَنْفي الفقر؛\nيُريد أَنه إِذا ذهَبَ مالُه باع خاتَمَه\
              \ فوجدَ فيه غِنىً؛ قال ابن\nالأَثير: والأَشبه، إِن صح الحديث، أَن يكون لخاصَّة فيه. وفي الحديث: أَنه\nنهى عن\
              \ لُبْس الخاتَم إِلاَّ لذي سلطان أَي إِذا لَبسه لغير حاجة وكان\nللزِّينة المَحْضَةِ، فكره له ذلك ورخَّصها للسلطان\
              \ لحاجته إِليها في خَتْم\nالكُتُب. وفي الحديث: أَنه جاءه رجل عليه خاتَمُ شَبَهٍ فقال: ما لي\nأَجدُ مِنك رَيحَ\
              \ الأَصنام؟ لأَنها كانت تُتّخذُ من الشَّبَه، وقال في خاتَم\nالحديد: ما لي أَرى عليكَ حِلْيَةَ أَهلِ النار؟ لأَنه\
              \ كان من زِيِّ\nالكفار الذين هم أَصحاب النار. ويقال: فلان خَتَمَ عليك بابَهُ أَعرَض عنك.\nوخَتَم فلان لكَ بابَه\
              \ إِذا آثرك على غيرك. وخَتَم فلان القرآن إِذا قرأَه\nإِلى آخره. ابن سيده. خَتَم الشيء يَخْتِمُه خَتْماً بلغ\
              \ آخرَه، وخَتَمَ\nالله له بخَير. وخماتِمُ\nكل شيء وخاتِمَته: عاقبته وآخِرُه. واخْتَتَمْتُ الشيء: نَقيض\nافتَتَحْتُه.\
              \ وخاتِمَةُ السورة: آخرُها؛ وقوله أَنشده الزجاج:\nإِن الخليفَة، إِن الله سَرْبَلَه\nسِرْبالَ مُلْك، به تُرْجى\
              \ الخَواتِيمُ\nإِنما جَمَع خاتِماً على خواتيم اضطراراً. وخِتامُ كل مَشروب: آخرُه.\nوفي التنزيل العزيز: خِتامُه\
              \ مسك، أَي آخرُه لأَن آخر ما يَجدونه رائحة\nالمسك، وقال عَلْقَمَةُ: أَي خِلْطُه مِسك، أَلم ترَ إِلى المرأَة\
              \ تقول\nللطِّيب خِلْطُه مِسكٌ خِلْطُه كذا؟ وقال مجاهد: معناه مِزاجُه مسك، قال: وهو\nقريب من قول عَلْقَمَة؛ وقال\
              \ ابن مسعود: عاقِبتُه طَعْم المِسك، وقال\nالفراء: قرأَ عليّ، عليه السلام، خاتِمُه مِسك؛ وقال: أَما رأَيتَ\n\
              المرأَةَ تقول للعطَّار اجعل لي خاتِمَه مِسكاً، تريد آخرَه؟ قال\nالفراء: والخاتِمُ والخِتام متقاربان في المعنى،\
              \ إِلاَّ أَن الخاتِمَ الاسمُ،\nوالخِتام المصدر؛ قال الفرزدق:\nفبِتْنَ جَنَابَتَيَّ مُصَرَّعاتٍ،\nوبِتُّ أَفُضُّ\
              \ أَغلاقَ الخِتامِ\nوقال: ومثلُ الخاتِم والخِتام قولك للرجل: هو كريم الطَّابِع\nوالطِّباع، قال: وتفسيره أَن\
              \ أَحدهم إِذا شرب وَجَدَ آخر كأْسِه ريحَ المِسك.\nوخِتامُ الوادي: أَقصاه. وخِتامُ القَوْم وخاتِمُهُم وخاتَمُهُم:\
              \ آخرُهم؛ عن\nاللحياني؛ ومحمد، صلى الله عليه وسلم، خاتِمُ\nالأَنبياء، عليه وعليهم الصلاة والسلام. التهذيب: والخاتِم\
              \ والخاتَم من\nأَسماء النبي، صلى الله عليه وسلم. وفي التنزيل العزيز: ما كان محمد أَبا\nأَحد من رجالكم ولكن رسول\
              \ الله وخاتِمَ النبيّين؛ أَي آخرهم، قال: وقد\nقرئ وخاتَمَ؛ وقول العَجَّاج:\nمُبارَكٍ للأَنبياء خاتِمِ\nإِنما\
              \ حمله على القراءة المشهورة فكسر، ومن أَسمائه العاقب أَيضاً\nومعناه آخر الأَنبياء. وأَعطاني خَتْمي أَي حَسْبي،\
              \ قال دُرَيْدُ بن\nالصِّمّة:وإِني دَعَوْتُ الله، لما كَفَرْتَني،\nدُعاءً فأَعطاني على ماقِطٍ خَتْمِي\nوهو من\
              \ ذلك لأَن حَسْبَ الرجل آخرُ طلبه. وخَتَم زَرْعَهُ يَخْتِمُه\nخَتْماً وخَتَم عليه: سقاه أَولَ سَقْيَةٍ، وهو\
              \ الخَتْم، والخِتام اسم له\nلأَنه إِذا سقي خُتِم بالرَّجاء، وقد خَتَمُوا على زُروعِهم أَي سَقَوْها\nوهي كِرابٌ\
              \ بَعْدٌ؛ قال الطائفي: الخِتام أَن تُثار الأَرض بالبَذْر حتى\nيَصير البَذْر تحتَها ثم يَسقونها، يقولون خَتَمُوا\
              \ عليه؛ قال أَبو منصور:\nوأَصل الخَتْم التغطية، وخَتْم البذر تغطيتُه، ولذلك قيل للزَّرَّاع\nكافر لأَنه يُغطّي\
              \ البذر بالتراب. والخَتْم: أَفواه خَلايا النَّحْل.\nوالخَتْم: أَن تَجمع النحلُ من الشَّمَع شيئاً رقيقاً أَرقّ\
              \ من شَمَع القُرْص\nفَتَطْلَيَه به، والخاتَمُ أَقلُّ وضَحِ القوائم. وفرس مُخَتَّم:\nبأَشاعِرِه بَياضٌ خفيٌّ\
              \ كاللُّمَع دون التخديم. وخاتَمُ الفَرَسِ\nالأُنثى: الحلْقَة الدُّنْيا من ظَبْيَتها \n(* قوله «الحلقة الدنيا\
              \ من\nظبيتها» هكذا هو بالأصل، وهو نص المحكم، وفي نسخة القاموس تحريف له فليتنبه\nله). ابن الأَعرابي: الخُتُمُ\
              \ فُصُوص مَفاصِل الخَيل، واحدها خِتام\nوخَتام.\nوتَختَّم عن الشيء: تَغافَل وسَكَتَ.\nوالمِخْتَم: الجَوْزَةُ\
              \ التي تُدْلَكُ لِتَمْلاسَّ\nفَيُنْقَدَ بها، تُسمّى التِّير بالفرسية. وجاء مُتَخَتِّماً أَي\nمُتَعمِّماً وما\
              \ أَحسن تَخَتُّمَهُ؛ عن الزجاجي، والله أَعلم."
