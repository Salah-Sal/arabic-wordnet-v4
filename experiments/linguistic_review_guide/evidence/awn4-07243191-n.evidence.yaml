            definitions_text: 'خ ت م : خَتَمْتُ الْكِتَابَ وَنَحْوَهُ خَتْمًا وَخَتَمْتُ عَلَيْهِ مِنْ بَابِ ضَرَبَ طَبَعْتُ
              وَمِنْهُ الْخَاتَمُ بِفَتْحِ التَّاءِ وَكَسْرِهَا وَالْكَسْرُ أَشْهَرُ قَالُوا الْخَاتَمُ حَلْقَةٌ ذَاتُ فَصٍّ
              مِنْ غَيْرِهَا فَإِنْ لَمْ يَكُنْ لَهَا فَهِيَ فَتَخَةٌ بِفَاءٍ وَتَاءٍ مُثَنَّاةٍ مِنْ فَوْقُ وَخَاءٍ مُعْجَمَةٍ
              وِزَانُ قَصَبَةٍ وَقَالَ الْأَزْهَرِيُّ الْخَاتِمُ بِالْكَسْرِ الْفَاعِلُ وَبِالْفَتْحِ مَا يُوضَعُ عَلَى الطِّينَةِ
              وَالْخِتَامُ الَّذِي يُخْتَمُ عَلَى الْكِتَابِ.وَفِي الْحَدِيثِ «الْتَمِسْ وَلَوْ خَاتَمًا مِنْ حَدِيدٍ» قِيلَ
              لَوْ هُنَا بِمَعْنَى عَسَى وَالتَّقْدِيرُ الْتَمِسْ صَدَاقًا فَإِنْ لَمْ تَجِدْ مَا يَكُونُ كَذَلِكَ فَعَسَاك
              تَجِدُ خَاتَمًا مِنْ حَدِيدٍ فَهُوَ لِبَيَانِ أَدْنَى مَا يُلْتَمَسُ مِمَّا يُنْتَفَعُ بِهِ وَخَتَمْتُ الْقُرْآنَ
              حَفِظْتُ خَاتِمَتَهُ وَهِيَآخِرُهُ وَالْمَعْنَى حَفِظْتُهُ جَمِيعَهُ عَنْ ظَهْرِ غَيْبٍ.'
