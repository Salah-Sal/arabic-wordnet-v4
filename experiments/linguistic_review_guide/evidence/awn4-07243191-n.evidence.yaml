              type: quran
              text: ﴿مَّا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِّن رِّجَالِكُمْ وَلَكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾
              attribution: (الأحزاب/ ٤٠)
            - idx: 1
              type: poetry
              text: مُباركٌ للأنبياءِ خاتَمٌ
              attribution: العَجَّاج
            - idx: 2
              type: hadith
              text: آمينُ, خاتَمُ رَبِّ العالمِينَ على عبادِهِ المؤمنين
              attribution: null
            - idx: 3
              type: poetry
              text: |-
                خَتَمْتُ الفؤادَ على حُبِّها
                كذاك الصَّحِيفةُ بالخاتَمِ
              attribution: null
            - idx: 4
              type: hadith
              text: 'اتَّخذ رسولُ اللهِ - صلّى اللهُ عليه وسلّم - خاتَمًا من وَرِقٍ (فضَّةٍ) ثُمَّ نَقش فيه : محمدٌ رسولُ
                الله , فقال : لا يَنْقُشْ أحدٌ على نَقْش خاتمى هذا'
              attribution: عن ابن عُمَر
