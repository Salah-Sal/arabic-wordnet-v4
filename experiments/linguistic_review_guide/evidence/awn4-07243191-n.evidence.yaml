          - entry_id: 910732
            dictionary_id: 134
            headword: خاتمَ النبيين
            headword_bare: خاتم النبيين
            headword_norm: خاتم النبيين
            root: ختم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'خاتمَ النبييناعلم أن النبوّة قد خُتمت بمحمد - صلى الله عليه وسلم -. وقال المسيح عليه السلام:
              "كان الناموس والأنبياء إلى يوحنّا، ومن ذلك الوقت يبشّر بملكوت الله". لوقا 16:16.فلم يجيء المسيح إلا للبشارة
              بملكوت الله الذي يأتي بعد. وضرب له أمثالاً تطابق نبوة  محمد - صلى الله عليه وسلم -. ولذلك جاء في وصف المسيح
              عليه السلام في القرآن:{وَمُبَشِّرًا بِرَسُولٍ يَأْتِي مِنْ بَعْدِي اسْمُهُ أَحْمَدُ} .فالنبوة قد ختمت بالمسيح
              في بني إسرائيل، ولكن بقيت لبني إسماعيل، ثم ختمت بمحمد - صلى الله عليه وسلم - للأبد. ولذلك قال النبي - صلى الله
              عليه وسلم -:"لا يكون بعدي إلاّ الرؤيا الصالحة" .'
