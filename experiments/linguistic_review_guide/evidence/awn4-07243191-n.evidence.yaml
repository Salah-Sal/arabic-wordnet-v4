          - entry_id: 80776
            dictionary_id: 2
            headword: خَتَمَ
            headword_bare: ختم
            headword_norm: ختم
            root: ختم
            root_source: ocr
            pos: verb
            form: I
            is_partial: 1
            definitions_text: 'النَّحْلُ - خَتْمًا, وخِتَامًا: ملأ خلِيَّتَه عَسَلاً فلانٌ على الطَّعام والشراب وغيرهما: غَطَّى
              فُوَّهَةَ وعائه بطين أو شَمْع أو غيرهما, حتى لا يَدْخُلَه شيءٌ ولا يَخْرُجَ منه شيءٌ على الشيءِ: طَبَعه وأثر
              فيه بنَقْشِ الخاتم على زَرْعِه: سقاهُ أوَّل سقيةٍ, قيل: هو أن تُثَارَ الأرضُ بالبَذْر حتى يصيرَ البَذْرُ تحتها
              ثم تُسْقى على فَمِ فلانٍ: مَنَعَهُ الكلام على يَدِ فلان: مَنَعَه من العطاء على القلوب والأسماع: أقْفَلها فلم
              تَع خيراً على قَلْبه: جعَله لا يَفْهَمُ شيئاً, كأنّه غطّاه'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: Al_Mujam_Al_Kabeer:Vol_6:page_0080:1
