                \ وفي نسخة القاموس تحريف له فليتنبه\nله). ابن الأَعرابي: الخُتُمُ فُصُوص مَفاصِل الخَيل، واحدها خِتام\nوخَتام.\n\
                وتَختَّم عن الشيء: تَغافَل وسَكَتَ.\nوالمِخْتَم: الجَوْزَةُ التي تُدْلَكُ لِتَمْلاسَّ\nفَيُنْقَدَ بها، تُسمّى\
                \ التِّير بالفرسية. وجاء مُتَخَتِّماً أَي\nمُتَعمِّماً وما أَحسن تَخَتُّمَهُ؛ عن الزجاجي، والله أَعلم."
