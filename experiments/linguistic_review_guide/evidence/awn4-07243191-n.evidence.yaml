            root: ختم
            root_source: ocr
            pos: verb
            form: I
            is_partial: 0
            definitions_text: 'النَّحْلُ: ملأ حَلِيـتَه عَسَلاً على الطَّعام والشَّراب وغيرهما: غطَّى فُوَّهة وعائه بطين أو
              شَمْع أو غيرهما, حتى لا يدخله شيء ولا يخرج منه شيء على فمه: منعه الكلام ختَم على قلبه: جعله لا يفهم شيئاً, كأنه
              غطَّاه الشيءَ وعليه: طبَعَهُ وأثَّر فيه بنقش الخاتم بابَه على فلان: أعرض عنه بابَه له: آثره على غيره الزرعَ
              وعليه: سقاهُ أولَ سقية بعد الحرث والبذر الشيءَ: أتَمَّهُ وبلغ آخره وفَرَغَ منه'
            translation_en: null
