          - entry_id: 80790
            dictionary_id: 2
            headword: ابن خاتمة
            headword_bare: ابن خاتمة
            headword_norm: ابن خاتمة
            root: ختم
            root_source: ocr
            pos: proper_noun
            form: null
            is_partial: 0
            definitions_text: 'أبو جَعْفر أحمد بن عَلِيّ بن محمد المعروف بابن خاتِمَة الأَنْصَارى (ت بعد ٧٧٠هـ = ١٣٦٩م): شاعر
              مُؤرِّخ طَبيبٌ من أهْل المريَّة, تَرْجَم له الوزيرُ الكاتبُ لسانُ الدِّين ابن الخطيب وأثْنَى عليه, تصدَّر للإقراء
              فى بَلَده, وزار غرناطة مرارًا. له ديوان شِعْرٍ مَطْبوع, وألف كُتبًا منها ''رائق التحلية فى فائق التورية'', و
              ''إيراد اللآل من إنشاد الضَّوال'' و''تحصيل غرض القاصد فى تفصيل المرض الوافد'' فى ذكر الطاعون الذى عَمَّ وباؤه
              أوربا وعَالَم الإسلام سنة (٧٤٨ -٧٤٩هـ = ١٣٤٨- ١٣٤٩ م) ومن كتبه المَفْقُودة: ''مزيَّة المريّة على غيرها من البلاد
              الأندلسيّة'''
            translation_en: null
            translation_fr: null
            domain: null
            external_id: Al_Mujam_Al_Kabeer:Vol_6:page_0083:4
