            definitions_text: 'خ ت م: (خَتَمَ) الشَّيْءَ مِنْ بَابِ ضَرَبَ فَهُوَ (مَخْتُومٌ) وَ (مُخَتَّمٌ) شُدِّدَ لِلْمُبَالَغَةِ.
              وَ (خَتَمَ) اللَّهُ لَهُ بِخَيْرٍ. وَخَتَمَ الْقُرْآنَ بَلَغَ آخِرَهُ. وَ (اخْتَتَمَ) الشَّيْءَ ضِدُّ افْتَتَحَهُ.
              وَ (الْخَاتَمُ) بِفَتْحِ التَّاءِ وَكَسْرِهَا وَ (الْخَيْتَامُ) وَ (الْخَاتَامُ) كُلُّهُ بِمَعْنًى وَالْجَمْعُ
              (الْخَوَاتِيمُ) ، وَ (تَخَتَّمَ) لَبِسَ الْخَاتَمَ. وَ (خَاتِمَةُ) الشَّيْءِ آخِرُهُ. وَمُحَمَّدٌ صَلَّى اللَّهُ
              عَلَيْهِ وَسَلَّمَ خَاتَمُ الْأَنْبِيَاءِ عَلَيْهِمُ الصَّلَاةُ وَالسَّلَامُ. وَ (الْخِتَامُ) الطِّينُ الَّذِي
              يُخْتَمُ بِهِ. وَقَوْلُهُ تَعَالَى: {خِتَامُهُ مِسْكٌ} [المطففين: 26] أَيْ آخِرُهُ لِأَنَّ آخِرَ مَا يَجِدُونَهُ
              رَائِحَةُ الْمِسْكِ.'
