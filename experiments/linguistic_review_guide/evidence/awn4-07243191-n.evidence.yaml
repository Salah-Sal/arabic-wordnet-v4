            definitions_text: '(خَتَمَ)(هـ) فِيهِ «آمِينَ خَاتَمُ ربِّ الْعَالَمِينَ عَلَى عِبَادِهِ الْمُؤْمِنِينَ» قِيلَ
              مَعْنَاهُ طابَعُه وعلامتُه الَّتِي تَدْفع عَنْهُمُ الْأَعْرَاضَ وَالْعَاهَاتِ؛ لِأَنَّ خَاتَمَ الْكِتَابِ يَصُونه
              وَيَمْنَعُ النَّاظِرِينَ عَمَّا فِي باطنه.وتُفْتح تاؤه وتُكسر، لُغَتان.(س) وَفِيهِ «أَنَّهُ نَهَى عَنْ لُبْس
              الْخَاتَمِ إِلَّا لِذِي سُلطان» أَيْ إِذَا لبِسَه لِغَيْرِ حَاجَةٍ، وَكَانَ لِلزِّينَةِ المحْضَة، فكَره لَهُ
              ذَلِكَ، ورَخَّصها للسلطان لحاجته إليها في خَتْمِ الكُتُب.(س) وَفِيهِ «أَنَّهُ جَاءَ رَجُلٌ عَلَيْهِ خَاتَمُ
              شَبَه فقال: مالى أجِدُ مِنْكَ ريحَ الْأَصْنَامِ» لِأَنَّهَا كَانَتْ تُتَّخَذ من الشَّبَه. وقال في خَاتَمِ الحديد
              «مالي أَرَى عَلَيْكَ حلْية أَهْلِ النَّارِ» لِأَنَّهُ كَانَ مِنْ زِيّ الكُفار الَّذِينَ هُمْ أَهْلُ النَّارِ.وَفِيهِ
              «التَّخَتُّمُ بِالْيَاقُوتِ يَنْفي الفَقْر» يُريد أَنَّهُ إِذَا ذَهب مالُه بَاعَ خَاتَمَهُ فَوَجَدَ فِيهِ غِنًى،
              وَالْأَشْبَهُ- إِنْ صَحّ الْحَدِيثُ- أَنْ يَكُونَ لِخَاصِّيَّةٍ فِيهِ.'
