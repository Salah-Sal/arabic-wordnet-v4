                عَن عَاصِم الْأَحول عَن عبد الله بن سرجس قَالَ أتيت رَسُول الله - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم َ - وَهُوَ
                فِي أنَاس من أَصْحَابه فَدرت هَكَذَا من خَلفه فَعرف الَّذِي أُرِيد فألقي الرِّدَاء عَن ظَهره فَرَأَيْت مَوضِع
                الْخَاتم على كَتفيهِ مثل الْجمع حولهَا خيلان كَأَنَّهَا الثآليل فَرَجَعت حَتَّى استقبلته فَقلت غفر الله لَك
                يَا رَسُول الله فَقَالَ وَلَك فَقَالَ الْقَوْم اسْتغْفر لَك رَسُول الله - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم
                َ - فَقَالَ نعم وَلكم ثمَّ تَلا هَذِه الْآيَة {واستغفر لذنبك وَلِلْمُؤْمنِينَ وَالْمُؤْمِنَات} انْتهى.'
