          - entry_id: 893660
            dictionary_id: 131
            headword: ختم
            headword_bare: ختم
            headword_norm: ختم
            root: ختم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: (ختم)النَّحْل ختما وختاما مَلأ خليته عسلا وعَلى الطَّعَام وَالشرَاب وَغَيرهمَا غطى فوهة وعائه
              بطين أَو شمع أَو غَيرهمَا حَتَّى لَا يدْخلهُ شَيْء وَلَا يخرج مِنْهُ شَيْء فَهُوَ مختوم وَفِي التَّنْزِيل الْعَزِيز
              {يسقون من رحيق مختوم} وعَلى فَمه مَنعه الْكَلَام وَفِي التَّنْزِيل الْعَزِيز {الْيَوْم نختم على أَفْوَاههم وتكلمنا
              أَيْديهم} وَيُقَال ختم على قلبه جعله لَا يفهم شَيْئا كَأَنَّهُ غطاه وَفِي التَّنْزِيل الْعَزِيز {ختم الله على
              قُلُوبهم وعَلى سمعهم وعَلى أَبْصَارهم غشاوة} وَالشَّيْء وَعَلِيهِ طبعه وَأثر فِيهِ بنقش الْخَاتم يُقَال ختم
              الْكتاب وَنَحْوه وَختم عَلَيْهِ وبابه على فلَان أعرض عَنهُ وبابه لَهُ آثره على غَيره وَالزَّرْع وَعَلِيهِ سقَاهُ
              أول سقية بعد الْحَرْث وَالْبذْر وَالشَّيْء أتمه وَبلغ آخِره وَفرغ مِنْهُ يُقَال ختم الْقُرْآن وَنَحْوه
            translation_en: null
