            definitions_text: '(ختم) - في الحديث: "أَنَّه جَاءه رجل عليه خَاتَم شَبَه. فقال: مَا لِي أَجِدُ منكَ رِيحَ الأصنام".:
              أي لأَن الأَصنامَ كانت تُتَّخذ من الشَّبَه، فَطرَحَه، ثم جاء وعليه خَاتَم من حَدِيدٍ فقال: "مَا لِي أَرَى عليك
              حِلْيةَ أَهل النَّار"قيل: إنما كَرِهَه من أَجل سُهوكة  رِيحهِ. وقوله: "حِليةَ أهلِ النَّار": أي أَنَّه من زِيَّ
              الكُفَّار الذين هم أهلُ النَّار.- وفي حديث آخر: "أَنَّه نَهَى عن لُبسِ الخَاتَم إلاّ لِذِي سُلْطان" .: أي إذا
              لَبِسه لغَيْر حاجَةٍ، وكان للزِّينَةِ المَحْضَة فكَرِه له ذَلِك.'
