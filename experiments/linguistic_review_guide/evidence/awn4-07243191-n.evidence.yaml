          - entry_id: 783464
            dictionary_id: 106
            headword: ختم
            headword_bare: ختم
            headword_norm: ختم
            root: ختم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '(خ ت م) : (خَتَمَ) الشَّيْءَ وَضَعَ عَلَيْهِ الْخَاتِمَ وَمِنْهُ خَتْمُ الشَّهَادَةِ وَذَلِكَ
              عَلَى مَا ذَكَرَ الْحَلْوَائِيُّ - رَحِمَهُ اللَّهُ - أَنَّ الشَّاهِدَ كَانَ إذَا كَتَبَ اسْمَهُ فِي الصَّكِّ
              جَعَلَ اسْمَهُ تَحْتَ رَصَاصٍ مَكْتُوبًا وَوَضَعَ عَلَيْهِ نَقْشَ خَاتَمِهِ حَتَّى لَا يَجْرِيَ فِيهِ التَّزْوِيرُ
              وَالتَّبْدِيلُ (وَعَنْ) الشَّعْبِيِّ أَنَّ رَجُلًا قَالَ أَرَى نَقْشَ خَاتَمِي فِي الصَّكِّ وَلَا أَذْكُرُ الشَّهَادَةَ
              قَالَ لَا تَشْهَدْ إلَّا بِمَا تَعْرِفُ فَإِنَّ النَّاسَ يَنْقُشُونَ فِي الْخَوَاتِيمِ (وَأَمَّا خَتْمُ) الْأَعْنَاقِ
              فَقَدْ ذُكِرَ فِي الرِّسَالَةِ الْيُوسُفِيَّةِ أَنَّ عُمَرَ - رَضِيَ اللَّهُ عَنْهُ - بَعَثَ ابْنَ حُنَيْفٍ
              عَلَى خَتْمِ عُلُوجِ السَّوَادِ فَخَتَمَ خَمْسَمِائَةِ أَلْفِ عِلْجٍ بِالرَّصَاصِ عَلَى الطَّبَقَاتِ أَيْ أَعْلَمَهَا
              اثْنَيْ عَشَرَ دِرْهَمًا وَأَرْبَعَةً وَعِشْرِينَ وَثَمَانِيَةً وَأَرْبَعِينَ وَصُورَتُهُ أَنْ يُشَدَّ فِي عُنُقِهِ
              سَيْرٌ وَيُوضَعَ عَلَى الْعُقْدَةِ خَاتَمُ الرَّصَاصِ (وَالْمَخْتُومُ) الصَّاعُ بِعَيْنِهِ عَنْ أَبِي عُبَيْدٍ
              وَيَشْهَدُ لَهُ حَدِيثُ الْخُدْرِيِّ الْوَسْقُ سِتُّونَ مَخْتُومًا (وَخَتَمَ الْقُرْآنَ) أَتَمَّهُ (وَقَوْلُهُ)
              كَانَ سُلَيْمَانُ الْأَعْمَشُ يَقْرَأُ خَتَمًا أَيْ يَخْتِمُ خَتْمًا مَرَّةً بِحَرْفِ ابْنِ مَسْعُودٍ وَمَرَّةً
              مِنْ مُصْحَفِ عُثْمَانَ - رَضِيَ اللَّهُ عَنْهُ -.'
