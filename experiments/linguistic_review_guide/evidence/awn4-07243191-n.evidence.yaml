          - entry_id: 803239
            dictionary_id: 113
            headword: خَتَمَهُ
            headword_bare: ختمه
            headword_norm: ختمه
            root: ختم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'خَتَمَهُ يَخْتِمُهُ خَتْمَاً وخِتاماً، طَبَعَهُ،وـ على قَلْبهِ: جَعَلَهُ لا يَفْهَمُ شيئاً،
              ولا يَخْرُجُ منه شيء،وـ الشيءَ خَتْماً: بَلَغَ آخِرَهُ،وـ الزَّرْعَ،وـ عليه: سَقاهُ أول سَقْيَةٍ.وككِتابٍ: الطينُ
              يُخْتَمُ به على الشيء،والخاتَمُ: ما يوضَعُ على الطينَةِ،وحَلْيٌ للإِصْبَعِ كالخاتِمِ والخاتامِ والخَيْتَامِ
              (والخِيتامِ) والخَتَمِ، محرَّكةً،والخاتِيامِج: خَواتِمُ وخواتِيمُ،وقد تَخَتَّمَ به،وـ من كلِّ شيء: عاقِبتُهُ،
              وآخرَتُهُ،كخاتِمَتِهِ، وآخِرُ القَوْمِ،كالخاتِمِ،وـ من القَفا: نُقْرَتُهُ، وأقَلُّ وضَحِ القَوائِمِ،وهو مُخَتَّمٌ،
              كمُعَظَّمٍ،وـ من الفرس الأُنْثَى: الخِلْفَةُ الدُّنْيا من طُبْيَيْها.وتَخَتَّم عنه: تَغافَلَ، وَسَكَتَ،وـ بأمْرِه:
              كَتَمَه، وتَعَمَّم،والاسمُ: التَّخْتِمَةُ. وكمِنْبَرٍ: الجَوْزَةُ تُدْلَكُ لِتَمْلاسَّ ويُنْقَدَ بها، فارِسِيَّتُهُ،
              تير،والخَتْمُ: العَسَلُ، وأفْواهُ خَلايا النَّحْلِ، وأن تَجْمَعَ النَّحْلُ شيئاً من الشَّمَعِ رقيقاً أرَقَّ
              من شَمَعِ القُرْصِ، فَتَطْلِيَهُ به.والمَخْتُومُ: الصاعُ.والخُتُمُ، بضمتين: فُصوصُ مَفاصِلِ الخَيْلِ، الواحِدُ:
              ككِتابٍ وعالَمٍ.'
            translation_en: null
            translation_fr: null
