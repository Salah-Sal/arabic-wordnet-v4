              وأثر فيه بنَقْشِ الخاتم الخَتْمُ : إخْفاءُ الشيءِ بجَمْعِ أطرافه عليه على وجه يتحفظ به أتمَّهُ وبلغ آخره وفرَغَ
              منه الزَّرْعَ : سقاهُ آخر سقية عند إدراكه الزَّرْعَ : سقاهُ أوَّل سقيةٍ (ضد) فلانٌ بابَه على فلان : أعْرَضَ
              عنه بابَهُ لفلان: آثرهُ على غيره'
