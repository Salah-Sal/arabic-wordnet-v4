            is_partial: 0
            definitions_text: 'الختم: إخفاء خبر الشيء بجمع أطرافه عليه على وجه ينحفظ به. وقال الراغب: الختم يقال على وجهين،
              الأول تأثير الشيء بنقش الخاتم. الثاني الأثر الحاصل عن الشيء، ويتجوز به تارة في الاستيثاق من الشيء والمنع منه
              اعتبارا بما يحصل من المنع بالختم على الكتب والأبواب، وتارة في تحصيل أثر عن شيء اعتبارا بالنقش الحاصل، وتارة
              يعتبر فيه بلوغ الآخر ومنه ختمت القرآن أي انتهيت إلى آخره. الختم عند أهل الحقيقة: علامة المحق على قلوب العارفين.
              الختم عندهم رجل واحد لا في كل زمن بل واحد في العالم يختم الله به الولاية العامة المحمدية. وثم ختم آخر يختم الله
              به الولاية العامة من آدم إلى آخر ولي وهو عيسى هو ختم الأولياء فله يوم القيامة حشران: يحشر في أمة محمد ويحشر
              رسولا مع الرسل.'
