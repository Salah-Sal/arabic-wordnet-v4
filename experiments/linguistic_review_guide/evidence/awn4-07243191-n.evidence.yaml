            definitions_text: 'ختمالخَتْمُ والطّبع يقال على وجهين: مصدر خَتَمْتُ وطبعت، وهو تأثير الشيء كنقش الخاتم والطّابع.
              والثاني: الأثر الحاصل عن النّقش، ويتجوّز بذلك تارة في الاستيثاق من الشيء، والمنع منه اعتبارا بما يحصل من المنع
              بالختم على الكتب والأبواب، نحو: خَتَمَ اللَّهُ عَلى قُلُوبِهِمْ [البقرة/ 7] ، وَخَتَمَ عَلى سَمْعِهِ وَقَلْبِهِ
              [الجاثية/ 23] ، وتارة في تحصيل أثر عن شيء اعتبارا بالنقش الحاصل، وتارة يعتبر منه بلوغ الآخر، ومنه قيل: ختمت
              القرآن، أي:انتهيت إلى آخره، فقوله: خَتَمَ اللَّهُ عَلى قُلُوبِهِمْ [البقرة/ 7] ، وقوله تعالى: قُلْ أَرَأَيْتُمْ
              إِنْ أَخَذَ اللَّهُ سَمْعَكُمْ وَأَبْصارَكُمْ وَخَتَمَ عَلى قُلُوبِكُمْ [الأنعام/ 46] ، إشارة إلى ما أجرى الله
              به العادة أنّ الإنسان إذا تناهى في اعتقاد باطل، أو ارتكاب محظور- ولا يكون منه تلفّت بوجه إلى الحقّ- يورثه ذلك
              هيئة تمرّنه على استحسان المعاصي، وكأنما يختم بذلك على قلبه، وعلى ذلك: أُولئِكَ الَّذِينَ طَبَعَ اللَّهُ عَلى
              قُلُوبِهِمْ وَسَمْعِهِمْ وَأَبْصارِهِمْ [النحل/ 108] ، وعلى هذا النّحو استعارة الإغفال في قوله عزّ وجلّ: وَلا
              تُطِعْ مَنْ أَغْفَلْنا قَلْبَهُ عَنْ ذِكْرِنا [الكهف/ 28] ، واستعارة الكنّ في قوله تعالى: وَجَعَلْنا عَلى قُلُوبِهِمْ
              أَكِنَّةً أَنْ يَفْقَهُوهُ [الأنعام/ 25] ، واستعارة القساوة في قوله تعالى: وَجَعَلْنا قُلُوبَهُمْ قاسِيَةً [المائدة/
              13] ، قال الجبّائيّ : يجعل الله ختما على قلوب الكفّار، ليكون دلالة للملائكة على كفرهم فلا يدعون لهم ، وليس ذلك
              بشيء فإنّ هذه الكتابة إن كانت محسوسة فمن حقّها أن يدركها أصحاب التّشريح، وإن كانت معقولة غير محسوسة فالملائكة
              باطّلاعهم على اعتقاداتهم مستغنية عن الاستدلال. وقال بعضهم: ختمه شهادته تعالى عليه أنه لا يؤمن، وقوله تعالى:الْيَوْمَ
              نَخْتِمُ عَلى أَفْواهِهِمْ [يس/ 65] ، أي: نمنعهم من الكلام، وَخاتَمَ النَّبِيِّينَ[الأحزاب/ 40] ، لأنه خَتَمَ
              النّبوّة، أي: تمّمها بمجيئه. وقوله عزّ وجلّ: خِتامُهُ مِسْكٌ[المطففين/ 26] ، قيل: ما يختم به، أي:يطبع، وإنما
              معناه: منقطعه وخاتمة شربه، أي:سؤره في الطيّب مسك، وقول من قال يختم بالمسك أي: يطبع، فليس بشيء، لأنّ الشّراب
              يجب أن يطيّب في نفسه، فأمّا ختمه بالطّيب فليس ممّا يفيده، ولا ينفعه طيب خاتمه ما لم يطب في نفسه.'
