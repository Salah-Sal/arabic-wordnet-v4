          - entry_id: 818248
            dictionary_id: 118
            headword: ختام السَّادة
            headword_bare: ختام السادة
            headword_norm: ختام السادة
            root: ختم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'ختام السَّادة: وَقد أورد بعض السَّادة الأخيار عَلَيْهِم الرَّحْمَة والغفران أَن تحقق بعض المواضيع
              الدِّينِيَّة والدنيوية وَحُصُول البركات الصورية والمعنوية لجَمِيع الأصدقاء والاخلاء وخذلان الْأَعْدَاء لَهُ
              أثر عَظِيم وَذَلِكَ بِوَاسِطَة الختمة وَهُوَ مَوْجُود فِي هَذِه القصيدة:(من حرز السَّادة أورد لكم حِكَايَة ... عَن
              بعض الْمَشَايِخ هَذِه الرِّوَايَة)(وعندما يعترضك مشكلة لَيْسَ لَك ... الْقُدْرَة على حلهَا أَو دَفعهَا لَا تقلها
              لأحد)(اختم الْقُرْآن وَلَا تَتَكَلَّم مَعَ أحد ... وَأَنت تقْرَأ هَذِه الختمة)(وَمهما كَانَت نِيَّة هَذِه الختمة ... فَإِنَّهُ
              وَمن لطفه سيجيبك على أَي سُؤال) (اقرأه يَوْم الْجُمُعَة من الِاثْنَيْنِ فِي ... اللَّيَالِي الْأُخْرَى فَلَيْسَ
              لَهَا أثر بَين)(تطهر أَولا أَيهَا الصّديق ... واغسل بدنك من الْجَنَابَة)(وَحَتَّى يكون التَّوْفِيق محالفا ... لَك
              اقْرَأ الْفَاتِحَة سبع مَرَّات)(وَبعد الْفَرَاغ من قِرَاءَة الْفَاتِحَة ... ارسل السَّلَام على الرَّسُول مائَة
              مرّة)(وعندما تفرغ من هَذِه الْقِرَاءَة والسلامات ... تصبح يقضا فاقرأ (ألم نشرح) تسع وَسبعين مرّة)(وعندما تصل
              إِلَى هُنَا فَقل بِسم الله ... واقرأ (قل هُوَ الله أحد) ألفا وَمرَّة وَاحِدَة)(وَفِي الآخر عِنْدَمَا تَنْتَهِي
              أَيهَا الرجل الصَّالح ... اعد قِرَاءَة الْفَاتِحَة سبع مَرَّات)(وكما فِي الأول أعد إرْسَال التَّحِيَّات ... على
              الرَّسُول مائَة مرّة)وقراء الختمة لَا يجب أَن يَكُونُوا أقل من سَبْعَة وَإِذا كَانُوا أَكثر من ذَلِك فَلَا إِشْكَال
              وَلَكِن يجب أَن يَكُونُوا من الصوفيين والورعين. وعندما تفرغ من الختمة اقْرَأ هَذَا الدُّعَاء عشر مَرَّات ((بِسم
              الله الرَّحْمَن الرَّحِيم، يَا مفتح الْأَبْوَاب، يَا مسبب الْأَسْبَاب، يَا مُقَلِّب الْقُلُوب والأبصار، وَيَا
              دَلِيل المتحيرين، وَيَا غياث المستغيثين، توكلت عَلَيْك يَا رب وأفوض أَمْرِي إِلَيْك، لَا حول وَلَا قُوَّة إِلَّا
              بِاللَّه الْعَلِيم الْعَظِيم)) . وَقبل البدء اقْرَأ آيَة الْكُرْسِيّ وانذر شَيْئا من الحلو أَو أَي شَيْء معادل
              لَهُ.أما أسامي هَؤُلَاءِ السَّادة قدس الله تَعَالَى أسرارهم هُوَ، سلمَان الْفَارِسِي، وَالقَاسِم ابْن مُحَمَّد
              بن أبي بكر الصّديق، بايزيد البسطامي، أَبُو الْحسن الخرقاني، أَبُو عَليّ الفارمدي، يُوسُف الْهَمدَانِي، عبد الْخَالِق
              الغجدواني، عَارِف الريوكري، مُحَمَّد الْخَيْر الفغنوي، عَليّ الراميتني، بَابا مُحَمَّد السماسي، السَّيِّد أَمِير
              الكلال، بهاء الدّين النقشبند، قدس الله تَعَالَى أَرْوَاحهم. وَقَالَ إِن هَذَا الْخَتْم الْعَظِيم جَائِز مَا
              بَين صَلَاة الْعَصْر وَصَلَاة الْمغرب وَهُوَ مستحسن بعد صَلَاة الْعشَاء.'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:23:2602
