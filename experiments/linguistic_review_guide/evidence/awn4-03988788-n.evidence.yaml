              الرِّجْلَيْنِ.وكثُمامةٍ: ع أو بِئْرٌ، وفَرَسٌ لبَنِي ضُبَيْعَةَ بنِ نزارٍ، وأبو طُوالَةَ: عبدُ الله بنُ عبدِ
              الرحمنِ تابِعِيٌّ. وكغُرابٍ: اسمٌ.وأطالَتِ المرأةُ: ولَدَتْ أولاداً طِوالاً، أو ولداً طويلاً.وفي المَثَلِ: "إنَّ
              القَصيرَةَ قد تُطيلُ". وليس بحديثٍ، كما وَهِمَ الجوهرِيُّ.وبَنو الأَطْوَلِ: بَطْنٌ.والطالَةُ: الأتانُ.والمِطْوَلُ،
              كمِنبرٍ: الذَّكَرُ، والرَّسَنُ.ومَطاولُ الخَيْلِ: أرْسانُها.وطَيّلَةُ الريحِ، ككَيِّسَةٍ: نَيِّحَتُها.وطاوَلَه:
