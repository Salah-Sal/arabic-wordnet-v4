            is_partial: 0
            definitions_text: 'طول البلد:[في الانكليزية] Longitude and latitude [ في الفرنسية] Longitude et latitude هو عند
              أهل الهيئة قوس من معدل النهار محصورة بين دائرتي نصف نهار ذلك البلد ونصف نهار أحد طرفي العمارة شرقا أو غربا.وتوضيحه
              أنّ دائرة نصف النهار في مبدأ العمارة تمرّ بسمت رأس أهله وتقطع معدّل النهار على نقطة، وأنّ دائرة نصف النهار في
              البلد المفروض تمرّ بسمت رأس أهله فتقطع المعدّل على نقطة أخرى. فالقوس المحصورة من المعدل بين نصفي النهار هي المسمّاة
              بطول ذلك البلد. فالمراد بقولهم أحد طرفي العمارة الطرف الذي هو مبدأ العمارة. وقولهم شرقا أو غربا إشارة إلى الاختلاف
              في مبدأ العمارة، فإنّ حكماء الهند اعتبروا مبدأ العمارة آخر العمارة في جهة الشرق لقربه منهم، واليونانيون اعتبروه
              آخر العمارة في جهة المغرب لقربه منهم. فعلى الأول طول البلاد عن المبدأ إلى جهة الشرق، وعلى الثاني إلى جهة الغرب.
              قال عبد العلي البرجندي في شرح التذكرة: التعريف المذكور غير مانع فإنّ كلّ دائرة نصف النهار تقاطع الأول على موضعين
              متقابلين، فبين هاتين الدائرتين أربع قسيّ من المعدّل وليس طول البلد إلّا إحداها، وغير جامع لخروج طول نهاية العمارة
              لاتّحاد نصف نهارها مع نصف نهار المبدأ، إلّا أن يعتبر التغاير الاعتباري.والصواب أن يقال هو قوس من معدّل النهار
              تبتدئ من تقاطعه مع النصف الظاهر من نصف نهار مبدأ العمارة وينتهي إلى تقاطعه مع النصف الظاهر من نصف نهار ذلك البلد،
              بشرط أن يؤخذ من الابتداء على التوالي إن كان المبدأ جانب الغرب وعلى خلاف التوالي إن كان المبدأ جانب الشرق. ثم
              إنّه لا يكون للبلد الواقع تحت نصف نهار المبدأ طول، وكذا لا يمكن اعتباره لما عرضه تسعون لعدم تعيّن نصف النهار
              هناك انتهى.'
