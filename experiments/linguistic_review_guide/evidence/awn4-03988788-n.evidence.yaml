                \ يلصقُ بقلبي، وهو يَفْتَعِل من لاطَ لَوْطاً. ولُوطٌ: اسم نَبيّ، كان ذا قَرابةٍ لإبراهيم عليه السّلام، بعثه\
                \ الله إلى قَوْمِه فكذَّبُوهُ [وأَحْدَثُوا ما أَحْدَثوا] فاشتقَّ النّاسُ منِ اسمه فِعلاً لمن فَعَلَ فِعْلَ\
                \ قَوْمِهِ.\nطلي: الطَّلاَ: الوَلَدُ الصَّغيرُ من كلِّ شيءٍ، حَتَّى لقد شُبِّه رمادُ المَوْقد بين الأَثافيّ\
                \ بالطّلا، والطّلايين أمّهاته، قال العجاج: \nطَلاَ الرَّمادِ اسْتُرْئِمَ الطَّليُّ\n. والأَطْلاءُ  : جماعةُ\
                \ الطلا وكذلك: الطُّليان [والطِّليان]  جِماعُه. قال زهير: \nبها العِينُ والآرام يَمْشِينَ خِلْفهَ ... وأَطْلاؤُها\
                \ يَنْهضْنَ من كُلِّ مَجْثَمِ\nوالطُّلَى: جماعةُ الطُّلْية، وهي صَفْحة العُنُق، وبعضٌ يقول: طلوة وطلى. والطِّلاءُ\
                \ من القَطِران، ممدود: ضَرْبٌ منه، شُبِّهَ به خاثِر المُنَصَّف  . والطِّلاءُ: اسمٌ من أسماء الشّراب. وكلُّ\
                \ شيء طُلِي به شيءٌ فهو طِلاءٌ. والطُّلاوةُ: الرِّيق الذي يَجِفُّ على الأسنان من الجوع. والطُّلاوة: الحُسْن،\
                \ يقال: سَمِعْتُ كَلاما عليه طُلاوة.\nليط: اللِّيطُ: قِشْر القَصَب اللاّزق به، وقشرُ كلّ شيء كانت له صلابة\
                \ ومتانة كالقناة، والقطعة منه: لِيطةٌ. وكذلك القوس العربية، تُمسح وتمرنُ كي تَصْفُوَ ويَصيرَ لها لِيطٌ، تقول:\
                \ عاتكةُ اللِّيط واللِّياط، أي: لازقة اللِّيط، صُلْبتُهُ. وتَلَيَّطْت لِيطةً، أي: تَشَظَّيْتُها، أي: اشْتَقَقْتُها،\
                \ وأخذت شقّة منها. واللِّيط: اللَّوْنُ، هُذَليّة.\nلطأ: اللَّطْءُ: لُزُوقُ الشَّيْء بالشَّيء. ورأيت فلاناً\
                \ لاطئاً بالأرْض. ورأيت الذِّئْبَ لاطئا للسّرقة، وهذه أكَمَةٌ لاطئة. والّلاطِئةُ: خُراجٌ يَخْرج بالإنسان فلا\
                \ يكادُ يَبْرَأُ منه، ويَزْعُمون أَنّها من لسْعة الثُّطْأَة. والّلاطئةُ: ضَرْبٌ من القلانس. أطل: الإِطْلُ:\
                \ لغةٌ في الأَيْطل، وهو الشّاكلة، والقُرُبُ تحت الشّاكلة. تقول إنه لَلاحقُ الأَيْطَلَيْن، وجمعه: أياطل، وألآطال:\
                \ جماعة الإطْل، والأَيْطَلُ: أَحْسَنُ وأَعْرَفُ.. ونظيرُهُ قَوْلُهم للمجنون: به أَوْلَق، وقد أُلِقَ يُؤْلَقُ\
                \ أَلْقاً."
