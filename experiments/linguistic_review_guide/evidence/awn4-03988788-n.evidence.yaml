                تأنيث الأطْوَلِ، والجمع الطُوَلُ، مثل الكبرى والكبر. والطَويلُ: جنسٌ من العَروضِ. وهي كلمة مولَّدة. وجمل أطوَلُ،
                إذا طالَتْ شفتُه العليا . وطاوَلَني فطُلْتُه، يقال ذلك من الطولِ والطَوْلِ جميعاً. ويقال: هذا أمرٌ لا طائِلَ
                فيه، إذا لم يكن فيه غَناءٌ ومزّية. يقال ذلك في التذكير والتأنيث. ولم يَحْلَ منه بطائلٍ،، لا يتكلم به إلا في
                الجحد. وبينهم طائِلَةٌ، أي عداوة وَتِرَةٌ. والطَوْلُ بالفتح: المَنُّ. يقال منه: طالَ عليه وتَطَوَّلَ عليه،
                إذا امْتَنَّ عليه. وطاوَلْتُهُ في الأمر، أي ماطَلْتُهُ. وأطلت الشئ وأطولت، على النقصان والتمام، بمعنًى. وأنشد
                سيبويه : صَدَدْتِ فأطْوَلْتِ الصُدودَ وقلَّما وِصالٌ على طول الصُدود يَدومُ وأطالَتِ المرأة، إذا ولدت ولدا
                طوالا. وفي الحديث: " إن القصيرة قد تطيل ". وطول له تَطْويلاً، أي أمهله. واسْتطالَ عليه أي تطاوَلَ. يقال: اسْتطالوا
                عليهم، أي قَتَلوا منهم أكثر مما كانوا قَتَلوا. وقد يكون اسْتَطالَ بمعنى طالَ. وتَطَاوَلْتُ مثل تطالَلْتُ.
                والطُوَّلُ بالتشديد: طائرٌ. وطَيِّلَةُ الريح: نيحتها.'
