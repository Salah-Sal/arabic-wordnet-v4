            definitions_text: 'التّطويل:[في الانكليزية] Prolixity [ في الفرنسية] Prolixite عند أهل المعاني هو أن يكون اللفظ
              زائدا على أصل المراد لا لفائدة. ولا يكون اللفظ الزائد متعينا كقول عدي: وألفى قولها كذبا ومينا. ألفى أي وجد والكذب
              والمين بمعنى واحد، ولا فائدة في الجمع بينهما فأحدهما زائد، كذا في المطول. فبقوله لا لفائدة خرج الإطناب، وبقوله
              ولا يكون إلخ خرج الحشو لأن الزائد فيه متعيّن وهو غير مقبول. وفي جامع الصنائع سمّى الوطواط الطويل بالحشو القبيح.'
