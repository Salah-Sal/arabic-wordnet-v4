            definitions_text: "باب الطاء واللام\nطل: الطَّلُّ: المَطَرُ الضَّعيفُ القَطْرِ الدّائمُ، وهو أَرْسَخُ المَطَرِ\
              \ ندىً. [تقول] : طَلَّتِ الأرضُ. وتقول: رَحُبَتِ الأَرْضُ وطلّتْ. ومن قال: طَلَّتِ ذهب إلى معنى: طلّت عليك السّماء،\
              \ ورَحُبَتْ عليك الأرض، أي: أتّسعَتْ. والطَّلُّ: المَطْلُ للدِّياتِ وإبطالُها. والإطلالُ: الإِشرافُ على الشّيء.\
              \ وطَلَلُ السَّفينة: جِلالُها، والجميع: الأَطْلال. وطَلَلُ الدّار: يُقال: [إنّه] مَوْضِعٌ في صَحْنِها يُهَيَّأُ\
              \ لمجلس أهلها، قال أبو الدُّقَيْش: كأنْ يكون بفِناءِ كُلِّ حيٍّ دُكّانٌ عليه المأْكَلُ والمَشْرَب، فذلك الطَّلَل،\
              \ قال جميل: \nرسمُ دارٍ وقفت في طَلَلِهْ ... كِدْتُ أَقْضي الغَداةَ من جلله\nلط: اللَّطُّ: إلزاقُ الشّيء، والنّاقة\
              \ تَلِطّ بذَنَبها، أي: تُلْزِقُهُ بفَرْجها وتدخله بين فخذيها. واللَّطُّ: [السّتر والإخفاء] كما [يقال] : لطّ\
              \ فلانٌ الحقّ بالباطل. والمِلْطاطُ: حرفٌ من الجَبَل في أعلاه. ومِلْطاطُ البَعير: حَرْفٌ في وَسَط رأسه. والإلطاط:\
              \ الإلحاح.. أَلَطّ عليه: أَلَحَّ. واللِّطْلِطُ: الغَليظ من الأَسْنان، قال جرير:\nتَفْتَرُّ عن قَردِ المَنابِتِ\
              \ لِطْلِطٍ ... مِثلِ العِجانِ وضِرْسُها كالحافر\nواللِّطْلِطُ واللّطاء: [العجوز] الدّرداء التّي سقطت أسنانُها\
              \ [وتأكّلت] وبَقِيَتْ أُصُولُها، وهي: الجَعْماءُ واللَّطْعاءُ [أيضاً] ."
