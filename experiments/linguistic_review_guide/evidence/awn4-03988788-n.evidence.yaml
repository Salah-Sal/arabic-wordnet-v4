            definitions_text: طول الكوكب:[في الانكليزية] Astronomic statement ،almanac [ في الفرنسية] Releve astronomique
              ،almanach هو عند أهل الهيئة قوس من فلك البروج مبتدئة من أول الحمل إلى مكان الكوكب وتسمّى تقويم الكوكب أيضا،
              فإن كان مكان الكوكب حقيقيا كان الطول حقيقيا، وإن كان مرئيا كان الطول مرئيا، وإن كان مكان الكوكب على نفس أول
              الحمل فلا تقويم للكوكب حينئذ، والحركة التي بها يقطع الكوكب تلك القوس المسمّاة بالطول تسمّى حركة تقويمية وحركة
              طولية. وقد يطلق الطول على تلك الحركة أيضا. ومعنى مكان الكوكب يجيء في محلّه. هكذا يستفاد من تصانيف الفاضل عبد
              العلي البرجندي. وفي توضيح التقويم مسطور أنّ طول الكواكب كما يسمّى أيضا بتقويم الكوكب ويسمّى أيضا بهيئة الكوكب.
