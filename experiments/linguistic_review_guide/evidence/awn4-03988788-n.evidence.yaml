            headword_bare: النطول
            headword_norm: النطول
            root: طل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: النطول:[في الانكليزية] Fomentation [ في الفرنسية] Fomentation medicale بالفتح وضمّ الطاء عند
              الأطباء هو أن تغلى الأدوية ويصبّ ماؤها على العضو فاترا وليس بينه وبين السكوب كثير فرق، فإنّ السكوب أن تصبّ قليلا
              قليلا كذا قال محمد الأقسرائي. والنطول بالفتح واحد النطولات وهي المياه الفاترة التي طبخت فيها الحشائش يستعملها
              المرضى بالصبّ على أبدانهم أو بالجلوس فيها أو بالانكباب على بخارها كذا قال العلّامة. قال الجوهري نطّلت رأس العليل
              بالنطول وهو أن يجعل الماء المطبوخ بالأدوية في كوز ثم يصبّ على رأسه قليلا قليلا. وقد يطلق على الصوفة المغموسة
              في الأدوية التى أغليت إذا وضعت على العضو. وقد يطلق على ماء يسخّن ويصبّ على العضو من غير أن يطبخ فيه شيء من الأدوية
              كذا في بحر الجواهر.
