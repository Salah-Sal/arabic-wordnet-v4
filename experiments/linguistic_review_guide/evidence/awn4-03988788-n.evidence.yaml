            definitions_text: 'طَلَى البعيرَ الهِناءَ يَطْلِيه،وـ به: لَطَخَهُ به،كَطَلاَّهُ، وقد اطَّلَى به وتَطَلَّى.وناقةٌ
              طَلياءُ: مَطْلِيَّةٌ.والطِّلاءُ، ككِساءٍ: القَطِرانُ، وكلُّ ما يُطْلَى به، والخمرُ، وخاثِرُ المُنَصَّفِ، والشَّتْمُ،
              والحَبْلُ الذي يُشَدُّ به رِجْلُ الطَّلا، وبالضم: قِشْرَةُ الدَّمِ. وكمُكاءٍ: الدَّم، وبالفتح والقَصْرِ: الشَّخْصُ،
              والمَطْلِيُّ بالقَطِرانِ، والرَّجُلُ الشديدُ المَرَضِج: أطلاءٌ، وهُما طَلَيانِ.والهَوَى قَضَى طَلاهُ، أي: هَواهُ،
              وبالكسر: اللَّذَّةُ، وبالضم: الأعْناقُ، أو أُصُولُها، جمعُ طُلْيَةٍ أو طُلاةٍ.والطَّلْياءُ: الناقةُ الجَرْباءُ،
              وخِرْقَةُ العارِكِ.والتَّطْلِيَةُ: التَّمْرِيضُ، والشَّتْمُ، والغِناءُ.والمِطْلَى، بكسر الميم: ع. وكالمُهَنَّى:
              المريضُ الدَّنِفُ، والمَحْبُوسُ لا يُرْجَى خَلاصُه.والطُّلَّى، كرُبَّى: الشَّرْبَةُ من اللَّبَنِ.وما أطْلَى
              نَبِيٌّ قَطُّ: ما مالَ إلى هواهُ.والطَّلْيا: الجَرَبُ، وقَرْحَةٌ شبيهةٌ بالقُوباءِ.وتَطَلَّى: لَزِمَ اللَّهْوَ
              والطَّرَبَ.ومَنْهَلٌ طالٍ: مُطَحْلَبٌ.ولَيْلٌ طالٍ: مُظْلِمٌ.والمِطْلَى، ويُمَدُّ: مَسِيلٌ ضَيِّقٌ من الأرضِ،
              أو الأرضُ السَّهْلَةُ تُنْبِتُ الغَضَى.والمَطالِي: المَواضِع تَغْذُو فيها الوحشُ أطْلاءَها.وطَلَيْتُه: رَبَطْتُه،
              وحَبَسْتُه.والطَّلِيُّ، كَغَنِيٍّ: الصغيرُ من أولاد الغَنَمِج: طُلْيانٌ، (كرُغْفانٍ) .وأطْلَى: مالَتْ عُنُقُه
              للمَوْتِ.'
