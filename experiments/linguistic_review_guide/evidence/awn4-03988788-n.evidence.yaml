          - entry_id: 804468
            dictionary_id: 113
            headword: طالَ
            headword_bare: طال
            headword_norm: طال
            root: طل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'طالَ طُولاً، بالضم: امْتَدَّ،كاسْتَطالَ، فهو طَويلٌ وطُوالٌ، كغُرابٍ، وهي بهاءٍج: طِوالٌ وطِيالٌ،
              بكسرِهما. وكرُمَّانٍ: المُفْرِطُ الطُّولِ.وطاوَلَني فطُلْتُه: كنتُ أطْوَلَ منه في الطُّولِ والطَّوْلِ جميعاً.وأطالَه
              وأطْوَلَه: طوَّلَهُ، والطَّوَلُ، مُحركةً: طولٌ في مِشْفَرِ البَعيرِ الأعْلَى. وقولُ الجَوْهَرِيّ: في شَفَةِ
              البَعيرِ وَهَمٌ. بَعيرٌ أطْوَلُ.وتَطاوَلَ: تَطالَلَ.واسْتَطالَ: امْتَدَّ، وارْتَفَع، وتَفَضَّلَ،وتَطاوَلَ.والطِّيلَةُ،
              بالكسر: العُمُرُ.والتِّطْوَلُ، كدِرْهَمٍ،والطَّويلَةُ والطِّوَلُ والطِّيَلُ، كعِنبٍ فيهما، وتُشَدَّدُ لامُهُمَا
              في الشِّعْرِ: حَبْلٌ يُشَدُّ به قائِمَةُ الدَّابَّةِ، أو تُشَدُّ وتُمْسِكُ طَرَفَه، وتُرْسِلُهَا تَرْعَى.وطَوَّلَ
              لها: أرْخَى طَويلَتَها في المَرْعى،وـ له: أمْهَلَهُ.(والطَّوالُ، كَسحابٍ: مَدَى الدَّهر) .وطالَ طِوَلُكَ وطِيَلُكَ،
              كعِنَبٍ فيهما،وطولُكَ، بالضم،وطَوْلُكَ، بالفتح،وطيلُكَ، بالكسر،وطُوَلُكَ، كصُرَدٍ،وطَوالُكَ، كسَحابٍ،وطِيالُكَ،
              ككِتابٍ: مُكْثُكَ، أو عُمُرُكَ، أو غَيْبَتُكَ.والطَّوْلُ والطائلُ والطائلَةُ: الفَضْلُ، والقُدْرَةُ، والغِنَى
