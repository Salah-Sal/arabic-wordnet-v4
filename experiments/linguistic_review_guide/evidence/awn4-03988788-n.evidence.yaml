            definitions_text: الطّول:[في الانكليزية] Length ،longitude ،extension [ في الفرنسية] Longueur ،longitude extension
              بالضم وسكون الواو يطلق على معان.الأول الامتداد الواحد مطلقا أي من غير أن يعتبر معه قيد، وبهذا المعنى يقال كلّ
              خط فهو في نفسه طويل أي هو في نفسه بعد واحد وامتداد واحد. والثاني الامتداد المفروض أولا وهو أحد الأبعاد الثلاثة
              الجسمية، ويقابله العرض وهو الامتداد المفروض ثانيا، والعمق وهو الامتداد المفروض ثالثا كما في الجسم المربع. والثالث
              أطول الامتدادين المتقاطعين في السطح وهذا هو المشهور فيما بين الجمهور، وبهذا المعنى يقال السطح ماله طول وعرض.والرابع
              الامتداد الآخذ من رأس الإنسان إلى قدمه والامتداد الآخذ من رأس ذوات الأربع إلى مؤخرها كما يقال العرض للامتداد
              الآخذ من يمين الإنسان أو ذوات الأربع إلى شماله، والعمق للامتداد الآخذ من صدر الإنسان إلى ظهره ومن ظهر ذوات الأربع
              إلى الأرض، كذا في شرح المواقف في مباحث الكم. لكن في شرح الطوالع البعد الآخذ من رأس الإنسان إلى قدمه طول الإنسان،
              والبعد الآخذ من ظهر ذوات الأربع إلى أسفله طوله، والبعد الآخذ من يمين الإنسان إلى يساره عرض الإنسان، والبعد الآخذ
              من رأس الحيوان إلى ذنبه عرض الحيوان.
