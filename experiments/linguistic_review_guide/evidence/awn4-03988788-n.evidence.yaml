              وبَرَاءَةُ جَميعاً، لأنهما سورَةٌ واحِدَةٌ عندَه.وفي المَثَلِ: "قَصيرةٌ من طَويلَةٍ"، أي: تَمْرَةٌ من نَخْلَةٍ،
