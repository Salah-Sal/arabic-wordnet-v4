                وأقل من الثلثين لم يسمّ باسم خاص. ويدخل في الطّلاء الطبيخ وهو عصير العنب يصبّ الماء فيه ثم يطبخ قبل الغليان
                حتى يذهب ثلثاه ويبقى ثلثه، فيكون الذاهب من العصير أقل من الثلثين، وكذا يدخل فيه الجمهوري وهو الذي من ماء العنب
                يصبّ عليه الماء ويطبخ أدنى طبخة.واعلم أنّ الطلاء اسم لكلّ ما غلظ من الأشربة شبّه بالطّلاء الذي يطلى به من
                قطران ونحوه ذكره في المغرب. ولا شك أنّ الأشربة المذكورة يحصل لها غلظ بالطبخ وإن كان بعضها أغلظ من بعض، وهو
                بهذا المعنى شامل للمثلّث أيضا. بل صرّح في الصحاح أنّ الطلّاء اسم للمثلّث لكن الفقهاء أرادوا به ما سوى المثلّث
                من الأشربة المسكرة المأخوذة، كذا في البرجندي. وفي جامع الرموز الطلّاء ماء عنب خالص طبخ قبل الغليان بالشمس
                أو بالنار فذهب أقلّ من ثلثيه. فبقيد الخالص خرج الفختج والجمهوري. وقيل إذا ذهب بالطبخ ثلثه فطلاء أو نصفه فمنصّف
                انتهى.
