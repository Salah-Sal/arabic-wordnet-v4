            definitions_text: |-
              (طول) - في الحَديث في ذِكْر الخَيْل: "ورجلٌ طَوَّل لها في مَرْج، فقَطَعَت طِوَلَها، فاستَنَّت شرَفًا أو شَرَفَينْ"وفي رواية: فأَطَالَ لها، فقَطَعَت طِيَلَها. بمعنى طَوَّلَ وأَطَال: أي شَدَّها في طِوَلها، وطِيَلها: وهو حَبْل طَوِيل يُشَدُّ أَحدُ طرفَيْه في آخِيَةٍ أو وَتَدٍ، والطَّرَفُ الآخر في يَدِ الفَرَس لِيَدُورَ فيه ولا يَعِير على وَجْهِه. والطِّوَل أيضا: حَبْل يُقَيَّد به البَعِير فيُرخَى.والطَّوِيلَة أيضًا: حَبْل يُشَدُّ بقَائِمةِ الدَّابَّة.
              - في الحديث : "كان يَقرأ في المَغْرِب بطُولَى الطُّولَيَيْن"
              الطُّولَى: تأنِيثُ الأَطْول على فُعْلى كالكُبْرى في تَأنِيثِ الأَكْبر والطُّولَيَيْن: تَثْنِيَتُه،: أي بأَطْول السُّورَتَين الطَّوِيلَتَيْن، يعَنىِ الأَنعامَ والأَعرافَ.
              - وفي الحديث: "أُوتِيتُ السَّبْعَ الطُّوَلَ" 
              : أي الطُّوَال. - في الحديث: "أَرْبَى الرِّبَا الاسْتِطَالَة في عِرْض الناسِ" 
              الاستِطالَةُ والتَّطاوُلُ: اسْتِحقَار النَّاسِ والتَّرفُّع عليهم.
              - في حديث ابنِ مَسْعُود، - رضي الله عنه -، في قَتْلِ أَبي جَهْل:
              "وسَيْفِى غَيرُ طَائلٍ" 
              : أي غَير ماضٍ. وأَصلُ الطَّائِل: النَّفْع والفَائِدَة.
              - في الحديث: " بكَ أُصاوِلُ وأُطاوِلُ"
              من الطَّوْل، وهو الفَضْلُ والعُلُوُّ على الأَعداء.
              - وفي الحديث : "فَطَال العَبَّاسُ عُمَرَ"
              : أي غَلَبه في الطُّولِ. يقال: طاولْتُه فَطُلْتُه.
              ورُوِىَ أَنّ امرأةً قالت: رأيت عبَّاسًا يَطُوفُ بالبيت كأَنَّه فُسطاطٌ أَبيضُ.
              يُقالُ: إنَّ عَلِىَّ بن عبد الله بن عَبَّاس كان إلى مَنكِب عبدِ الله، وعبد الله إلى مَنكِب العَبَّاس، والعَبَّاسِ إلى مَنكِب عَبد المُطَّلب، فرأَت المَرأةُ علىَّ بن عبد الله وقد فَرَع النَّاسَ كأنّه راكِبٌ مع مُشَاةٍ فقالت: مَنْ هذا؟ فأُعْلِمَت. فَقَالَت: إن الناسَ لَيَرْذُلُون
