            definitions_text: 'ط و ل: الطُّولُ ضِدُّ الْعَرْضِ. وَ (طَالَ) الشَّيْءُ يَطُولُ (طُولًا) امْتَدَّ وَ (طَوَّلَهُ)
              غَيْرُهُ وَ (أَطَالَهُ) أَيْضًا. وَ (طَاوَلَنِي) فُلَانٌ (فَطُلْتُهُ) أَيْ كُنْتُ أَطْوَلَ مِنْهُ مِنَ (الطُّولِ)
              وَ (الطَّوْلِ) جَمِيعًا، وَبَابُهُ قَالَ. وَ (الطِّوَلُ) بِوَزْنِ الْعِنَبِ الْحَبْلُ الَّذِي يُطَوَّلُ لِلدَّابَّةِ
              فَتَرْعَى فِيهِ وَهُوَ (الطَّوِيلَةُ) أَيْضًا. وَ (الطُّوَالُ) بِالضَّمِّ (الطَّوِيلُ) فَإِنْ أَفْرَطَ فِي الطُّولِ
              فَهُوَ (طُوَّالٌ) بِالتَّشْدِيدِ. وَ (الطِّوَالُ) بِالْكَسْرِ جَمْعُ طَوِيلٍ. وَ (الْأَطَاوِلُ) جَمْعُ (الْأَطْوَلِ)
              . وَ (الطُّولَى) تَأْنِيثُ (الْأَطْوَلِ) وَالْجَمْعُ (الطُّوَلُ) مِثْلُ الْكُبْرَى وَالْكُبَرُ. وَيُقَالُ: هَذَا
              أَمْرٌ لَا (طَائِلَ) فِيهِ إِذَا لَمْ يَكُنْ فِيهِ غَنَاءٌ وَمَزِيَّةٌ. يُقَالُ ذَلِكَ فِي التَّذْكِيرِ وَالتَّأْنِيثِ
              وَلَا يُتَكَلَّمُ بِهِ إِلَّا فِي الْجَحْدِ. وَ (الطَّوْلُ) بِالْفَتْحِ الْمَنُّ يُقَالُ: (طَالَ) عَلَيْهِ مِنْ
              بَابِ قَالَ وَ (تَطَوَّلَ) عَلَيْهِ أَيِ امْتَنَّ عَلَيْهِ. وَ (طَاوَلَهُ) فِي الْأَمْرِ أَيْ مَاطَلَهُ. وَ
              (أَطَالَتِ) الْمَرْأَةُ وَلَدَتْ وَلَدًا طُوَالًا. وَفِي الْحَدِيثِ: «إِنَّ الْقَصِيرَةَ قَدْ تُطِيلُ» . وَ
              (طَوَّلَ) لَهُ (تَطْوِيلًا) أَمْهَلَهُ. وَ (اسْتَطَالَ) عَلَيْهِ (تَطَاوَلَ) وَقَدْ يَكُونُ (اسْتَطَالَ) بِمَعْنَى
              طَالَ.'
