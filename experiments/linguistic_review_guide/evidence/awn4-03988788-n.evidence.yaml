              ط و ل : طَالَ الشَّيْءُ طُولًا بِالضَّمِّ امْتَدَّ وَالطُّولُ خِلَافُ الْعَرْضِ وَجَمْعُهُ أَطْوَالٌ مِثْلُ قُفْلٍ وَأَقْفَالٍ وَطَالَتْ النَّخْلَةُ ارْتَفَعَتْ قِيلَ هُوَ مِنْ بَابِ قَرُبَ حَمْلًا عَلَى نَقِيضِهِ وَهُوَ قَصُرَ وَقِيلَ مِنْ بَابِ قَالَ وَالْفِعْلُ لَازِمٌ وَالْفَاعِلُ طَوِيلٌ وَالْجَمْعُ طِوَالٌ مِثْلُ كَرِيمٍ وَكِرَامٍ وَالْأُنْثَى طَوِيلَةٌ وَالْجَمْعُ طَوِيلَاتٌ وَهَذَا أَطْوَلُ مِنْ ذَاكَ لِلْمُذَكَّرِ.وَفِي الْمُؤَنَّثَةِ طُولَى مِنْ ذَاكَ وَجَمْعُ الْمُؤَنَّثَةِ الطُّوَلُ مِثْلُ فُضْلَى وَفُضَلٍ وَكُبْرَى وَكُبَرٍ وَقَرَأْتُ السَّبْعَ الطُّوَلَ وَأَطَالَ اللَّهُ بَقَاءَهُ مَدَّهُ وَوَسَّعَهُ وَكَذَلِكَ كُلُّ شَيْءٍ يَمْتَدُّ يُعَدَّى بِالْهَمْزَةِ وَمِنْهُ طَالَ الْمَجْلِسُ إذَا امْتَدَّ زَمَانُهُ وَأَطَالَهُ صَاحِبُهُ وَطَوَّلْتُ لَهُ بِالتَّثْقِيلِ أَمْهَلْتُ.
              وَالْمُطَاوَلَةُ فِي الْأَمْرِ بِمَعْنَى التَّطْوِيلِ فِيهِ وَطَوَّلْتُ الْحَدِيدَةَ مَدَدْتُهَا وَطَوَّلْتُ لِلدَّابَّةِ أَرْخَيْتُ لَهَا حَبْلَهَا لِتَرْعَى وَهُوَ غَيْرُ طَائِلٍ إذَا كَانَ حَقِيرًا.
              وَالْفَجْرُ الْمُسْتَطِيلُ هُوَ الْأَوَّلُ وَيُسَمَّى الْكَاذِبَ وَذَنَبَ السِّرْحَانِ شُبِّهَ بِهِ لِأَنَّهُ مُسْتَدِقٌّ صَاعِدٌ فِي غَيْرِ اعْتِرَاضٍ وَطَالَ عَلَى الْقَوْمِ يَطُولُ طَوْلًا مِنْ بَابِ قَالَ إذَا أَفْضَلَ فَهُوَ طَائِلٌ وَأَطَالَ بِالْأَلِفِ وَتَطَوَّلَ كَذَلِكَ وَطَوْلُ الْحُرَّةِ مَصْدَرٌ فِي الْأَصْلِ مِنْ هَذَا لِأَنَّهُ إذَا قَدَرَ عَلَى صَدَاقِهَا وَكُلْفَتِهَا فَقَدْ طَالَ عَلَيْهَا وَقَالَ بَعْضُ الْفُقَهَاءِ طَوْلُ الْحُرَّةِ مَا فَضَلَ عَنْ كِفَايَتِهِ وَكَفَى صَرْفُهُ إلَى مُؤَنِ نِكَاحِهِ وَهَذَا مُوَافِقٌ لِمَا قَالَهُ الْأَزْهَرِيُّ نَزَلَ قَوْله تَعَالَى {ذَلِكَ لِمَنْ خَشِيَ الْعَنَتَ مِنْكُمْ} [النساء: 25]فِيمَنْ لَا يَسْتَطِيعُ طَوْلًا وَقِيلَ الطَّوْلُ الْغِنَى وَالْأَصْلُ أَنْ يُعَدَّى بِإِلَى فَيُقَالُ وَجَدْتُ طَوْلًا إلَى الْحُرَّةِ أَيْ سَعَةً مِنْ الْمَالِ لِأَنَّهُ بِمَعْنَى الْوُصْلَةِ ثُمَّ كَثُرَ الِاسْتِعْمَالُ فَقَالُوا طَوْلًا إلَى الْحُرَّةِ ثُمَّ زَادَ الْفُقَهَاءُ تَخْفِيفَهُ فَقَالُوا طَوْلُ الْحُرَّةِ وَقِيلَ الْأَصْلُ طَوْلًا عَلَيْهَا.
              وَاسْتَطَالَ عَلَيْهِ قَهَرَهُ وَغَلَبَهُ وَتَطَاوَلَ عَلَيْهِ كَذَلِكَ وَمَدَارُ الْبَابِ عَلَى الزِّيَادَةِ.
