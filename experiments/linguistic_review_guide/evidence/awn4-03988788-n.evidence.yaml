            form: null
            is_partial: 0
            definitions_text: الطّلاء:[في الانكليزية] Pomade [ في الفرنسية] Pommade بالكسر والمدّ لغة ما يطلى على العضو من
              الدواء، والفرق بينه وبين الضماد أنّ الطّلاء يخصّ بالأشياء السّيّالة التي يحتاج فيها إلى الشّدّ، ويطلق أيضا على
              ما طبخ من عصير العنب حتى ذهب ثلثاه أو أكثر، ويسمّيه العجم بالفختج وبعض العرب يسمّيه الخمر. وفي الملتقى هو العصير
              إذا طبخ حتى كان الذاهب منه أكثر من النصف وأقل من الثلثين، كذا في بحر الجواهر. وعند الفقهاء هو ماء عنب طبخ فذهب
              أقل من ثلثيه، فإن كان الذاهب النصف اختصّ باسم المنصّف، وإن كان أقل من النصف سمّي بالباذق وإن كان أكثر من النصف
              وأقل من الثلثين لم يسمّ باسم خاص. ويدخل في الطّلاء الطبيخ وهو عصير العنب يصبّ الماء فيه ثم يطبخ قبل الغليان
              حتى يذهب ثلثاه ويبقى ثلثه، فيكون الذاهب من العصير أقل من الثلثين، وكذا يدخل فيه الجمهوري وهو الذي من ماء العنب
              يصبّ عليه الماء ويطبخ أدنى طبخة.واعلم أنّ الطلاء اسم لكلّ ما غلظ من الأشربة شبّه بالطّلاء الذي يطلى به من قطران
              ونحوه ذكره في المغرب. ولا شك أنّ الأشربة المذكورة يحصل لها غلظ بالطبخ وإن كان بعضها أغلظ من بعض، وهو بهذا المعنى
              شامل للمثلّث أيضا. بل صرّح في الصحاح أنّ الطلّاء اسم للمثلّث لكن الفقهاء أرادوا به ما سوى المثلّث من الأشربة
              المسكرة المأخوذة، كذا في البرجندي. وفي جامع الرموز الطلّاء ماء عنب خالص طبخ قبل الغليان بالشمس أو بالنار فذهب
              أقلّ من ثلثيه. فبقيد الخالص خرج الفختج والجمهوري. وقيل إذا ذهب بالطبخ ثلثه فطلاء أو نصفه فمنصّف انتهى.
