                إِنَّ الْفَرَزْدَقَ صَخْرَةٌ مَلْمُومَةٌ ... طَالَتْ فَلَيْسَ تَنَالُهَا الْأَوْعَالَا
                وَهَذَا قِيَاسٌ مُطَّرِدٌ فِي كُلِّ مَا أَشْبَهَ ذَلِكَ، فَيُقَالُ لِلْحَبْلِ: الطِّوَلُ ; لِطُولِهِ وَامْتِدَادِهِ. قَالَ طَرَفَةُ:
                لَعَمْرُكَ إِنَّ الْمَوْتَ مَا أَخْطَأَ الْفَتَى ... لَكَالطِّوَلِ الْمُرْخَى وَثِنْيَاهُ فِي الْيَدِ
                وَيَقُولُونَ: لَا أُكَلِّمُهُ طَوَالَ الدَّهْرِ. وَيُقَالُ: جَمَلٌ أَطْوَلُ، إِذَا طَالَتْ شَفَتُهُ الْعُلْيَا. وَطَاوَلَنِي فُلَانٌ فَطُلْتُهُ، أَيْ كُنْتُ أَطْوَلَ مِنْهُ. وَالطُّوَالُ: الطَّوِيلُ. وَالطِّوَالُ: جَمْعُ الطَّوِيلِ. وَحَكَى بَعْضُهُمْ: قَلَانِسُ طِيَالٌ، بِالْيَاءِ. وَأَمْرٌ غَيْرُ طَائِلٍ، إِذَا لَمْ يَكُنْ فِيهِ غَنَاءٌ. يُقَالُ ذَلِكَ فِي الْمُذَكَّرِ وَالْمُؤَنَّثِ. قَالَ:
                وَقَدْ كَلَّفُونِي خُطَّةً غَيْرَ طَائِلِ
                وَتَطَاوَلْتُ فِي قِيَامِي، إِذَا مَدَدْتَ رِجْلَيْكَ لِتَنْظُرَ. وَطَوِّلْ فَرَسَكَ، أَيْ أَرْخِ طَوِيلَتَهُ فِي مَرْعَاهُ. وَاسْتَطَالُوا عَلَيْهِمْ، إِذَا قَتَلُوا مِنْهُمْ أَكْثَرَ مِمَّا قَتَلُوا.
