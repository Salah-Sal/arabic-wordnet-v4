          - entry_id: 975561
            dictionary_id: 149
            headword: طُوَالَةُ
            headword_bare: طوالة
            headword_norm: طوالة
            root: طل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              طُوَالَةُ:
              بالضم: موضع ببرقان فيه بئر، قاله ثعلب في قول الحطيئة:
              وفي كل ممسى ليلة ومعرّس ... خيال يوافي الركب من أمّ معبد
              فحيّاك ودّ ما هداك لفتية ... وخوص بأعلى ذي طوالة هجّد
              وقال نصر: طوالة بئر في ديار فزارة لبني مرة وغطفان، قال الشّمّاخ:
              كلا يومي طوالة وصل أروى ... ظنون آن مطّرح الظنون
              ويقال: امرأة طوالة وطوّالة كما يقال رجل طوال وطوّال إذا كان أهوج الطول، ويوم طوالة: من أيام العرب.
