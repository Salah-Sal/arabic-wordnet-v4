          - entry_id: 846232
            dictionary_id: 128
            headword: طلّ
            headword_bare: طل
            headword_norm: طل
            root: طلل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              طلّ: طَلَّ: عامية أطلَّ، والمصدر طُلُول.
              (فوك) ويقال: طَلَّ من وطَلَّ على: اشرف (فوك، هلو، محيط المحيط، المقدمة 3: 412، 431، معجم الطرائف).
              طل برأسه على: مدّ عنقه لينظر شيئاً وقدّم رأسه لينظر (بوشر، زيشر 22: 149، ألف ليلة 2: 24) ومنه طل وحدها بمعنى نظر وتطلع إلى (بوشر، ألف ليلة 2: 34، 4: 714) وراقب، ترصد (هلو) وطلّ على فلان: زاره، وذهب إلى داره ليراه (بوشر، زيشر 22: 143).
              طلّ في الكتاب: تصفحه بسرعة (بوشر).
              طلّ على: أشرف على، تطلع على (بوشر).
              طَلَّل: أظهر، أبدى، أشار (الكالا).
              طَلَّل: نظر إلى اسفل (الكالا).
              أطَلَّ: ما ذكره فريتاج نقلاً من ديوان الهذليين وهو أطِلَّ بمعنى أصابه الطل والمطر يؤيده ما جاء في ديوان مسلم بن الوليد ص145 البيت 28:
              أطلَت على أعدائه وعفاته ... مخايل ودق صوبها الماء والدم
              وقد فسر شرح الديوان كلمة أطلت بكلمة مطرت.
              أطلَّ: دنا وقرب وتقدم (معجم مسلم) أطلَّ شعر خده ولحينه بدأ يظهر (عبد الواحد ص78 المقري 2: 401).
              تطلَّل: أطلّ، بدا أظهر نفسه (البيان 2: 188).
              طَلّة: نظرة خاطفة، لمحة، يقال مثلاً: من أول طلة أي من أول نظرة، ويقال: كل طلة تلاقيها كبرت أي تكبر بعد كل نظرة.
              في طلة: ما يرى من أول نظرة، يقال مثلاً: لوح يُنظر في طلّة: لوحة أو صورة ترى من اول نظرة (بوشر).
              طَلَّة: نظري، بصري، منظر، مشرف، مظهر، الأشياء البعيدة (بوشر) طلَّة: معرض الأشياء (بوشر).
              طَلَّة: هدف النظر، اتجاه النظر إلى نقطة معينة للتصويب عليها (بوشر).
              طَلَّة: زيارة (بوشر).
              طَلَّة: فرخ، شطء، ساق طارئة تنشأ في أوائل الربيع في ساق الزرع. (براكس مجلة الشرق والجزائر ط: 196).
              مَطَلّ: منظر، مرأى مظهر (بوشر).
              مَطَلّ وجمعها مطلات: ذكرت في معجم فوك في مادة لاتينية معناها رفش ومجرفة. غير أني أجرأ على القول أنها تعني مسحاة.
              مُطَلُّ: مكان يشرف منه (بوشر، محيط المحيط).
              مُطِلّ: قزم، نجتر، قصير القد (فوك).
