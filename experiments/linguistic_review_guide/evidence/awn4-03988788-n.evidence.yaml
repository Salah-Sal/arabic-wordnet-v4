            definitions_text: |-
              (طَلَى) الطَّاءُ وَاللَّامُ وَالْحَرْفُ الْمُعْتَلُّ أَصْلَانِ صَحِيحَانِ، أَحَدُهُمَا يَدُلُّ عَلَى لَطْخِ شَيْءٍ بِشَيْءٍ، وَالْآخَرُ عَلَى شَيْءٍ صَغِيرٍ كَالْوَلَدِ لِلشَّيْءِ.
              فَالْأَوَّلُ: طَلَيْتُ الشَّيْءَ بِالشَّيْءِ، أَطْلِيهِ. [ (وَاطَّلَيْتُ) ] بِالشَّيْءِ أَطَّلِي بِهِ. وَالطِّلَاءُ: جِنْسٌ مِنَ الشَّرَابِ، كَأَنَّهُ ثَخُنَ حَتَّى صَارَ كَالْقَطِرَانِ الَّذِي يُطْلَى بِهِ. وَالْمِطْلَاءُ: أَرْضٌ مِئْنَاثٌ، وَالْجَمْعُ: الْمَطَالِي، وَهُوَ مِنَ الْقِيَاسِ ; وَذَلِكَ أَنَّهَا قَدْ طُلِيَتْ بِشَيْءٍ حَتَّى لَانَتْ.
              وَمِنَ الْبَابِ: كَلَامٌ لَا طَلَاوَةَ لَهُ، إِذَا كَانَ غَثًّا، كَأَنَّهُ إِذَا كَانَ خِلَافَ ذَلِكَ فَقَدْ طُلِيَ بِشَيْءٍ يُحَلِّيهِ. وَبِأَسْنَانِهِ طَلِيٌّ وَطِلْيَانٌ. وَقَدْ طَلِيَ فُوهُ يَطْلَى طَلًا، وَهِيَ الصُّفْرَةُ، كَأَنَّهَا طُلِيَتْ بِهِ. وَالْأَصْلُ الْآخَرُ: الطِّلْوَةُ: وَلَدُ الْوَحْشِيَّةِ الْأُنْثَى، وَالذَّكَرُ طِلًّا. وَيَقُولُونَ: الطِّلْوُ: الذِّئْبُ، وَلَعَلَّهُ أَنْ يَكُونَ وَلَدَهُ ; لِمَا ذَكَرْنَاهُ.
              ثُمَّ يُشْتَقُّ مِنْ هَذَا فَيُقَالُ لِلْحَبْلِ الَّذِي يُشَدُّ بِهِ الطِّلَا: طِلْوَةٌ. كَذَا قَالَ ابْنُ دُرَيْدٍ. فَأَمَّا أَحْمَدُ بْنُ يَحْيَى ثَعْلَبٌ فَأَنْشَدَنِي عَنْهُ الْقَطَّانُ:
              مَا زَالَ مُذْ قُرِّفَ عَنْهُ جُلَبُهُ ... لَهُ مِنَ اللُّؤْمِ طَلِيٌّ يَجْذِبُهُ
              قَالَ الْفَرَّاءُ: طَلَيْتُ الطِّلَا وَطَلَوْتُهُ، إِذَا رَبَطْتَهُ بِرِجْلِهِ. وَقَدْ بَقِيَ فِي الْبَابِ مَا يَبْعُدُ عَنْ هَذَا الْقِيَاسِ، إِلَّا أَنَّهُ فِي بَابٍ آخَرَ. قَالَ الشَّيْبَانِيُّ: الطَّلَا: الشَّخْصُ، يُقَالُ: إِنَّهُ لَجَمِيلُ الطَّلَا. وَأَنْشَدَ:
              وَخَدٍّ كَمَتْنِ الصُّلَّبِيِّ جَلَوْتُهُ ... جَمِيلِ الطَّلَا مُسْتَشْرِبِ الْوَرْسِ أَكْحَلِ
              فَهَذَا إِنْ صَحَّ فَهُوَ عِنْدِي مِنَ الْإِبْدَالِ، كَأَنَّهُ أَرَادَ الطَّلَلَ ثُمَّ أَبْدَلَ إِحْدَى اللَّامَيْنِ حَرْفًا مُعْتَلًّا. وَهُوَ مِنْ بَابِ: " تَقَضِّي الْبَازِي " وَلَيْسَ بِبَعِيدٍ. وَمِنْهُ أَيْضًا: الطُّلْيَةُ، وَالْجَمْعُ: الطُّلَى: الْأَعْنَاقُ. وَإِنَّمَا سُمِّيَتْ كَذَا لِأَنَّهَا شَاخِصَةٌ، مَحْمُولَةٌ عَلَى الطَّلَا الَّذِي هُوَ الشَّخْصُ.
