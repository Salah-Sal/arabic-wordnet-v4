            definitions_text: 'طول{طَالَ،} يَطُولُ،! طُولاً، بِالضَّمِّ: أَي امْتَدَّ، وكُلُّ مَا امْتَدَّ مِنْ زَمَنٍ أَو
              لَزِمَ مِنْ هَمٍّ ونحوِهِ فقد {طالَ، كقولِكَ: طالَ الهَمُّ واللَّيْلُ،} والطُّولُ: خِلافُ العَرْضِ، كَما فِي
              الصِّحاحِ، وَفِي المُحْكَمِ: نَقِيضُ القِصَرِ، يَكونُ فِي النَّاسِ، وغَيرِهِم مِنَ الحَيوانِ والمَوَاتِ، وقالَ
              الرَّاغِبُ: الطُّولُ والقِصَرُ مِنَ الأَسْماءِ المَتَضايِفَةِ، ويُسْتَعْمَلُ فِي الأَعْيانِ، والأَعْراضِ، كالزَّمانِ
              ونحوِهِ. قالَ شيخُنا عندَ قَوْلِهِ: امْتَدَّ: أَي فَهُوَ لازِمٌ، وَلَا يَتَعَدَّى إِلاَّ لِلْمُبالَغَةِ، {كاسْتَطَالَ،
              قالَ شيخُنا: كَلامُ المُصِنِّفِ صَرِيحٌ فِي أنَّ طالَ} واسْتَطَالَ بِمَعْنىً واحِدٍ، فهما لازِمانِ عندَهُ، والسِّينُ
              والطَّاءُ للتَّأْكِيدِ، واسْتَعْمَلَ البَيْضاوِيُّ كالزَّمَخْشَرِيِّ {اسْتَطَالَ مُتَعَدِّياً، وبَنَوْا منهُ
              مُسْتَطَالاً، ووَقَعَ فِي المُفْصَّلِ أَيْضا، وقالَ شُرَّاحُهُ:} اسْتَطالَهُ: عَدَّهُ طَوِيلاً، إِلاَّ أَنَّهُم
              لَمْ يَسْتَنِدُوا فيهِ لِنَقَلٍ عَن أَئِمَّةِ اللُّغَةِ، وَلَا مُصَنَّفاتِها، كَما أَشارَ إليهِ فِي العِنَايَةِ.
              قلتُ: وَقد اسْتَعْمَلَهُ السَّعْدُ أَيْضا فِي {المُطَوَّلِ، فقالَ: وكما إِذا اسْتَطَلْتَ لَيْلَتَكَ، فَفَسَّرَهُ
              المُلاَّ عبدُ الْحَكِيم، بقولِهِ: أَي عَدَدْتَها طَوِيلَةً، بِناءٌ قِياسِيٌّ، فَإنَّ الاسْتِفْعَالَ يَجِيءُ
              للحُسْبَانِ والعَدِّ، والاسْتِعَمَالُ اللُّغَوِيُّ} لِلاسْتِطَالَةِ هُوَ الَّلازِمُ انْتَهى، فهوَ {طَوِيلٌ،}
              ومُسْتَطِيلٌ، وقالَوا: إِنَّ اللَّيلَ {طَوِيلٌ، وَلَا} يَطُلْ إِلاَّ بِخَيْرٍ، عَن اللِّحْيانِيِّ، قالَ: ومَعْنَاهُ
              الدُّعاءُ، {وطُوَالٌ، كَغُرَابٍ، وأَنْشَدَ ابنُ بَرِّيٍّ لِطُفَيْلٍ:)(} طُوَالُ السَّاعِدَيْنِ يَهُزُّ لَدْناً ... يَلُوحُ
              سِنانُهُ مِثْلَ الشِّهابِ)وهِيَ بِهَاءٍ، {طَوِيلَةٌ،} وطُوَالَةٌ، وقالَ النَّحْوِيُّونُ: أَصْلُ طالَ طَوُلَ،
              ككَرُمَ، اسْتِدْلاَلاً بالاِسْمِ منهُ إِذْ جاءَ على فَعِيلٍ، نَحْوَ طَويلٍ، حَمْلاً على شَرُفَ فَهُوَ شَرِيفٌ،
              وكَرُمَ فَهُوَ كَرِيمٌ، وَج، أَي جمعُ {طَوِيلٍ} وطُوالٍ: {طِوَالٌ، قالَ ابنُ جِنِّيٍّ فِي المُنْصِف: هَذَا مِنَ}
              الطُّولِ ضِدُّ القِصَرِ، إِذا كَانَ لازِماً غَيْرَ مُتَعَدٍّ، وأَمَّا {طالَهُ مُتَعَدِّياً فَهُوَ فَعَل، وَلَا
              يَكونُ فَعُلَ، لأنَّ فَعُلَ لَا يَتَعَدَّى، وإِنَّما صَحَّتِ الواوُ فِي طَوِيلٍ لأنَّهُ لَمْ يَجِيء على الفِعْلِ،
              لأنَّكَ لَو بَنَيْتَهُ على الفِعْلِ قُلْتَ: طَائِل، وإِنَّما هُوَ كفَعِيل يُعْنَى بِهِ مَفْعُولٌ، وَقد جاءَ
              على الأَصْلِ مَا اعْتَلَّ فِعْلُهُ، نحوَ مَخْيُوط، فَهَذَا أَجْدَرُ، انْتهى. وَقَالَ سِيبَوَيْهِ: صَحَّتِ الواوُ
              فِي} طِوَالٍ، لِصِحَّتها فِي طَوِيلٍ، فصارَ طَوالٌ مِنْ {طَوِيلٍ، كجِوَارٍ مِنْ جَاوَرْت، قالَ: ووافَقَ الذينَ
              قالَوا فَعِيل الَّذين قالَوا فُعال، لأَنَّهما أُخْتانِ، فجَمَعُوهُ جَمْعَهُ، وَحَكَى اللُّغَوِيُّونَ:} طِيَالٌ،
              وَلَا يُوجِبُهُ القِياسُ، لأنَّ الواوَ قد صَحَّتْ فِي الواحِدِ، فحُكْمُها أَنْ تَصِحَّ فِي الجَمْعِ. قَالَ ابنُ
              جِنِّيٍّ: لَمْ تُقْلَبْ إِلاَّ فِي بيتٍ شاذٍّ، وَهُوَ قَوْلُهُ:(تَبَيَّنَ لي أَنَّ القَماءَةَ ذِلَّةٌ ... وأَنَّ
              أَعِزَّاءَ الرِّجالِ {طِيالُها)وقَوْلُهُ: بِكَسْرِهِمَا، أَي بكسرِ طاءِ} طِوَالٍ {وطِيَالٍ. (و) } الطُّوَّالُ،
              كَرُمَّانٍ: الْمُفْرِطُ {الطُّولِ، وَلَا يُكَسَّرُ، إِنَّما يُجْمَعُ جَمْعَ السَّلامَةِ، يُقالُ للرَّجُلِ إِذا
              كَانَ أَهْوَجَ} الطُّولِ: {طُوَالٌ} وطُوَّالٌ، وامْرَأَةٌ {طُوَالَةٌ} وطُوَّالَةٌ، وأَنْشَدَ ابنُ جِنِّي فِي
              المُحْتَسَبِ: جاءُوا بِصَيْدٍ عَجَبٍ مِنَ العَجَبْ أُزَيْرِقِ العَيْنَيْنِ {طُوَّالِ الذَّنَبْ وقالَ الكِسَائِيُّ
              فِي بابِ المُغَالَبَةِ:} طَاوَلَنِي {فَطُلْتُهُ: كُنْتُ} أَطْوَلَ مِنْهُ، فِي {الطُّولِ} والطَّوْلِ جَمِيعاً،
              كَذَا فِي النُّسَخِ، وصَوابُهُ: مِنَ {الطُّولِ} والطَّوْلِ جَمِيعًا، ومثلُه فِي الصِّحاحِ، والمُخَصَّصِ، وَفِي
              المُحْكَمِ: كُنْتُ أَشَدُّ طُولاً مِنْهُ، وقالَ:(إِنَّ الفَرَزْدَقَ صَخْرَةٌ عادِيَّةٌ ... ! طالَتْ فليْسَ تَنالُها
              الأَوْعَالاَ) أَي {طالَتِ الأَوْعَالَ. ومِنَ} الطُّولِ، بالضَّمِّ الحديثُ: مَا مَشَى مَعَ {طِوَالٍ إِلاَّ} طَالَهُم،
              وحديثُ الاِسْتِسْقَاءِ: {فطالَ العَبَّاسُ عُمَرَ، أَي غَلَبَهُ فِي طُولِ القامَةِ. وَفِي الصِّحاحِ:} وطُلْتُ،
              أصْلُهُ طَوُلْتُ، بِضَمِّ الواوِ، لأنَّكَ تَقولُ {طَوِيلٌ، فنُقِلَت الضَّمَّةُ إِلى الطَّاءِ، وسَقَطَتْ الوَاوُ
              لاِجْتِماع السَّاكِنَيْنِ، وَلَا يَجُوزُ أَنْ تَقُولَ مِنْهُ:} طُلْتُه، لأَنَّ فَعُلْتُ لَا يَتَعَدَّى، فَإِنْ
              أَرَدْتَ أَن تُعَدِّيَه قُلْتَ {طَوَّلْتُه، أَو} أَطَلْتُهُ،)وأَمَّا قَوْلُك: {طَاوَلَنِي} فطُلْتُه، فَإِنَّما
              تَعْنِي بذلكَ: كُنْتَ {أَطْوَلَ مِنْهُ، منَ الطُّولِ والطَّوْلِ جَميعاً، انْتهى. وقالَ سِيبَوَيْه: يُقالُ: طُلْتُ،
              على فَعُلْتُ، لأَنَّكَ تَقُولُ:} طَوِيلٌ {وطُوَالٌ، كَما قُلْتَ: قَبُحَ وَهُوَ قَبِيحٌ، قالَ: وَلَا يَكُونُ
              طُلْتُهُ، كَما لَا يَكونُ فَعُلْتُه فِي شَيْءٍ. قالَ المازِنِيُّ: طُلْتُ فَعُلْتُ أَصْلٌ، واعْتَلًّت مِنْ فَعُلْت
              غيرَ مُحَوَّلَةٍ، الدَّلِيلُ على ذلكَ طَوِيلٌ وطُوالٌ، قالَ: وأمَّا} طَاوَلْتُهُ {فطُلْتُه، فهيَ مُحَوَّلَةٌ،
              كَما حُوِّلَتْ قُلْتُ، وفَاعِلُها} طائِلٌ، لَا يُقال فِيهِ: طَوِيلٌ، كَما لَا يُقالُ فِي قائِلٍ قَوِيلٌ، قالَ:
              ولَمْ يُؤْخَذْ هَذَا إِلاَّ عَن الثَّقاتِ، قالَ: وقُلْتُ، مُحَوَّلَةٌ مِنْ فَعَلْت إِلَى فَعُلْت، كَما أَنَّ
              بِعْتُ مُحَوَّلَةٌ مِنْ فَعَلْت إِلَى فَعِلْت، وكانتْ فَعِلْتُ أَوْلَى بهَا، لأنَّ الكَسْرَةَ مِنَ اليَاءِ،
              كَما كانَ فَعُلْت أَوْلَى بِقُلْت، لأنَّ الضَّمَّةَ مِنَ الواوِ. {وأَطَالَهُ،} إطَالَةً، {وأَطْوَلَهُ،} إِطْوَالاً:
              {طَوَّلَهُ، أَي جَعَلَهُ} طَوِيلاً، قالَ ابنُ سِيدَه: وكأَنَّ الذينَ قالُوا ذلكَ إِنَّما أَرادُوا أَنْ يُنَبِّهُوا
              على أَصْلِ الْبَابِ، وَلَا يُقاسُ هَذَا إِنَّما أَتَى للتَّنْبِيهِ على الأَصْلِ، أَنْشَدَ سِيبَوَيْه:(صَدَدْتِ
              {فَأَطْوَلْتِ الصُّدُودَ وقَلَّمَا ... وِصالٌ عَلى} طُولِ الصُّدُودِ يَدُومُ){والطَّوَلُ، مُحَرَّكَةً:} طُولٌ
              فِي مِشْفَرِ الْبَعِيرِ الأَعْلَى على الأَسْفَلِ، كَما فِي المُحْكَمِ، وقَوْلُ الْحَوْهَرِيِّ: فِي شَفَةِ الْبَعِيرِ،
              ونَصُّهُ: وجَمَلٌ {أَطْوَلُ، إِذا} طَالَتْ شَفَتُهُ العُلْيَا، وَهُوَ وَهَمٌ، لأَنَّ الشَّفَةَ خاصَّةٌ بالإِنْسانِ،
              والبَعِيرُ إِنَّما يُقالُ فيهَ مِشْفَرٌ. قالَ شيخُنا: ومِثْلُهُ لَا يَكونُ وَهَماً، وإِنَّما هُوَ مَجازٌ، وقَصْدُ
              الجُوْهَرِيِّ الإِيضاحُ والبيَانُ، لأنَّ المِشْفَرَ لَا يَعْلَمُهُ إِلاَّ فُقَهاءُ اللُّغَةِ، فَأَطْلَقَها الجَوْهَرِيُّ
              لذلكَ، كَما قيلَ فِي الإِنْسانِ مَجازاً: عَظِيمُ المَشافِرِ، واللهُ تَعالَى أَعْلَمُ، انْتهى. يُقالُ: بَعِيرٌ
              {أَطْوَلُ، وبهِ} طَوَلٌ. {وتَطَاوَلَ الرَّجُلُ: مِثْلُ تَطَالَلَ، إِذا قامَ عَلى أَصابِعِ رِجْلَيْهِ، ومَدَّ
              قَوامَهُ، لِيَنْظُرَ إِلَى الشَّيْءِ، قالَ:(} تَطاوَلْتُ كَي يَبْدُو الْحَصِيرُ فَما بَدَا ... لِعَيْنِي وَيَا
              ليتَ الحَصِيرَ بَدَالِيَا){واسْتَطَالَ الشَّقُّ: امْتَدَّ، وارْتَفَعَ، حَكَاهُ ثَعْلَبٌ، وَهُوَ كاسْتَطَارَ.
              (و) } اسْتَطَالَ عليْهِ: تَفَضَّلَ، ورَفَعَ نَفْسَهُ، وَأَيْضًا: {تَطَاوَلَ، قالَ الأَزْهَرِيُّ:} الاِسْتِطَالَةُ،
              {والتَّطَاوُلُ: هوَ أَنْ يَرْفَعَ رَأْسَهُ، ويَرَى أَنَّ لهُ عليْهِ فَضْلاً فِي القَدْرِ، وَهُوَ مَذْمُومٌ،
              يُوضَعُ مَوْضِعَ التَّكَبُّرِ، وَفِي الحديثِ: أَرْبَى الرِّبَا الاِسْتِطَالَةُ فِي عِرْضِ النَّاسِ، أَي اسْتِحْقارُهُم،
              والتَّرَفُّعُ عليْهم، والوَقِيعَةُ فيهم.} والطِّيلَةُ، بالكَسْرِ: الْعُمُرُ، يُقالُ: {أطَالَ اللهُ} طِيلَتَهُ.
              {والتِّطْوَلُ، كِدرْهَمٍ، وَزْنُهُ بهِ يَدُلُّ عَلى أَصالَةِ التَّاءِ، وَهِي زَائِدَةٌ، فَلِذَا لَو قالَ: بالكَسْرِ،
              كانَ أَحْسَنَ،} والطَّوِيلَةُ، كسَفِينَةٍ، عَن اللَّيْثِ، وأَنْكَرَهُ الأَزْهَرِيُّ، وقالَ: لَمْ نَسْمَعْهُ)
              مِنَ العَرَبِ بِهَذَا المَعْنَى، ورَأيتُهم يَسَمُّونَهُ: {الطِّوَل} والطِّيَل، كَعِنَبٍ فيهِما، وَقد تُشَدَّدُ
              لاَمُهُما فِي الشِّعْرِ ضَرُورَةً، قالَ مَنْظُورُ بنُ مَرْثَدٍ الأَسَدِيُّ: تَعَرَّضَتْ لي بِمَكانٍ حِلِّ تَعَرُّضاً
              لَمْ يَأْلُ عَن قَتْلٍ لِي تَعَرُّضَ المُهْرَةِ فِي {الطِّوَلِّ قالَ الجَوْهَرِيُّ: وَقد يَفْعَلُونَ مِثْلَ
              ذلكَ فِي الشِّعْرِ كَثيراً، ويَزِيدُونَ فِي الحَرْفِ مِنْ بَعْضِ حُرُوفِهِ، قالَ الرَّاجِزُ: قُطُنَّةٌ مِنْ
              أَجْوَدِ القُطْنِّ قالَ ابنُ بَرِّيٍّ: وأَنْشَدَ غَيْرُهُ: قُطْنُنَّةٌ مِنْ أَجْوَدِ القُطْنُنِّ وأَوَّلُهُ:
              كأَنَّ مَجْرَى دَمْعِها المُسْتَنَّ قالَهُ ذُهْلُ بنُ قُرَيْع، ويُقالُ: قارِبُ بنُ سَالِمٍ المُرِّيُّ، كُلُّ
              ذلكَ: حَبْلٌ} طَوِيلٌ، يُشَدّث بهِ قَائِمَةُ الدَّابَّةِ، أَو هُوَ الحَبْلُ تُشَدُّ بِهِ، وتُمْسِكُ أنتَ طَرَفَهُ،
              وتُرْسِلُها تَرْعَى، أَو يُشَدُّ أَحَدُ طَرَفَيْهِ فِي وَتِدٍ والآخَرُ فِي يَدِ الفَرَسِ، لِيَدُورَ فِيهِ ويَرْعَى،
              وَلَا يَذْهَبُ لَوَجْهِهِ، قالَ مُزاحِمٌ:(وسَلْهَبَةٍ قَوْدَاءَ قُلِّصَ لَحْمُها ... كسِعْلاَةِ بِيدٍ فِي خِلاَلٍ
              {وتِطْوَلِ)وقالَ طَرَفَةُ:(لَعَمْرُكَ إِنَّ المَوْتَ مَا أَخْطَأَ الفَتَى ... } لَكَالطِّوَلِ المُرْخَى وثِنْياهُ
              بالْيَدِ)وَفِي الحديثِ: لاَ حِمىً إِلاَّ فِي ثَلاثٍ، {طِوَلُ الْفَرَسِ، وثَلَّةِ البِئْرِ، وحَلْقَةِ القَوْمِ،
              يَعْنِي إِذا نَزَلَ رَجُلٌ فِي عَسْكَرٍ عَلى مَوْضِع، لَهُ أنْ يَمْنَعَ غيرَهُ طِوَلَ فَرَسِهِ، وَكَذَلِكَ إِذا
              حَفَرَ بِئْراً لَهُ أنْ يَمْنَعَ غَيْرَهُ مِقْدارَ مَا يَكونُ حَرِيماً لَهُ.} وطَوَّلَ لَهَا، {تَطْوِيلاً: أَرْخَى}
              طَوِيلَتَها فِي الْمَرْعَى، ويُقالُ: {طَوِّلْ لِفَرَسِكَ يَا فُلانُ، أَي أَرْخِ حَبْلَهُ فِي مَرْعَاهُ، وَفِي
              الحديثِ: ورَجُلٌ} طَوَّلَ لَهَا فِي مَرْجٍ فَقَطَعَتْ! طِوَلَهَا، وَفِي آخَر: {فَأطَالَ لَها} الطِّوَلَ {والطِّيَلَ.
              (و) } طَوَّلَ لَهُ، {تَطْوِيلاً: أَمْهَلَهُ، وَلم يُعْجِلْهُ.} والطَّوَالُ، كسَحَابٍ: مَدَى الدَّهْرِ، قالَ
              الجَوْهَرِيُّ: هُوَ مِنْ قَوْلِكِ: لَا أُكَلِّمُهُ {طَوَالَ الدَّهْرِ،} وطُولَ الدَّهْرِ، بِمَعْنىً، وذكَرَهُ
              أَيضاً ابنُ مالِكٍ فِي المُثَلَّثاتِ. ويُقالُ: {طالَ} طِوَلُكَ، {وطِيَلُكَ، كَعِنَبٍ فيهِما،)} وطُوْلُكَ، بالضَّمِّ،
              وَهَذِه عَن كُرَاعٍ، {وطَوْلُكَ، بالفَتْحِ،} وطِيْلُكَ، بالكَسْرِ، وهذهِ عَن كُرَاعٍ أَيْضا، {وطُوَلُكَ، كَصُرَدٍ،}
              وطَوَالُكَ، كَسَحَابٍ، {وطِيَالُكَ، كَكِتَابٍ، قالَ الجَوْهَرِيُّ: كُلُّ ذلكَ ذَكَرَهُ ابنُ السِّكِّيت، قالَ:
              فَأَمَّا الحَبْلُ فَلَمْ نَسْمَعْهُ إِلاَّ بِكَسْرِ الأَوَّلِ وفَتْحِ الثَّانِي: أَي طالَ مُكْثُكَ وتَمادِيكَ
              فِي أَمْرٍ، أَو تَراخِيكَ عنهُ، كَما فِي الأَسَاسِ، وَهُوَ مَجازٌ، وقالَ الزَّجَّاجُ:} طالَ {طِيَلُكَ،} وطِوَلُكَ:
              أَي {طالَتْ مُدَّتُكَ، أَو عُمُرُكَ، نَقَلَهُ الجَوْهَرِيُّ، وَهُوَ مَجازٌ أَيْضا، أَو غَيْبَتُكَ، نَقَلَهُ
              الجَوْهَرِيُّ أَيضاً، قالَ القَطامِيُّ:(إِنَّا مُحَيُّوكَ فاسْلَمْ أَيُّها الطَّلَلُ ... وإِنْ بَلِيتَ وإِنْ}
              طالَتْ بِكَ {الطِّوَلُ)ويُرْوَى:} الطِّيَلُ، جَمْعُ {طِيلَةٍ،} والطِّوَلُ: جَمْعُ {طِوَلَة، فاعْتَلَّ} الطِّيَلُ،
              وانْقَلَبَتْ يَاؤُهُ واواً لاِعْتِلالِها فِي الواحِدِ، فَأَمَّا {طِوَلَةٌ} وطِوَلٌ، فمِنْ بابِ عِنَبَةٍ وعِنَبٍ،
              وقالَ طُفَيْلٌ:(أَتَانَا فَلَمْ نَدْفَعْهُ إِذْ جَاءَ طَارِقاً ... وقُلْنا لَهُ قد طَالَ {طُوْلُكَ فانْزِلِ)أَي
              أَمْرُكَ الَّذِي أَنْتَ فِيهِ، مِنْ طُولِ السَّفَرِ، ومُكَابَدَةِ السَّيْرِ، ويُرْوَى:} طِيلُكَ. وأَنْشَدَ ابنُ
              بَرِّيٍّ: أما تَعْرِفُ الأَطْلاَلَ قد طَالَ {طِيلُها} والطَّوْلُ، {والطَّائِلُ،} والطَّائِلَةُ: الْفَضْلُ، والْقُدْرَةُ،
              والْغِنَى، والسَّعَةُ، والعُلُوُّ، قالَ أَبُو ذُؤَيْبٍ:(ويَأْشِبُنِي فِيهَا الذينَ يَلُونَها ... وَلَو عَلِمُوا
              لم يَأْشِبُونِي {بِطَائِلِ)وأَنْشَدَ ثَعْلَب، فِي صِفَةِ ذِئْبٍ:(وإِنْ أَغَارَ فَلَمْ يَحْلُلْ} بِطَائِلَةٍ ... فِي
              لَيْلَةٍ مِنْ جَمِيْرٍ ساوَرَ الْفُطُمَا)وَقد {تَطَوَّلَ عَلَيْهِم، أَي امْتَنَّ،} كطَالَ عَلَيْهِم، وأَصْلُ
              الطَّوْلِ المَنُّ والفَضْلُ، قالَ الأَزْهَرِيُّ: {والتَّطَوُّلُ عِنْدَ العَرَبِ مَحْمُودٌ، يُوضَعُ مَوْضِعَ
              المَحاسِنِ،} والتَّطَاوُلُ مُذْمُومٌ، يُوْضَعُ مَوْضِعَ التَّكّبُّرِ، كالاِسْتِطَالَةِ، وَقد تقدَّم. وقولُهُ
              تَعالَى: ومَنْ لَمْ يَسْتَطِعْ مِنْكُمْ {طَوْلاً، قالَ الزَّجَّاجُ: مَعْنَاهُ مَنْ لَمْ يَقْدِرْ مِنْكُمْ عَلى
              مَهْرِ الحُرَّةِ، قَالَ:} والطَّوْلُ: القُدْرَةُ عَلى المَهْرِ. وَقَالَ الرَّاغِبُ: هوَ كِنَايَةٌ عَمَّا يُصْرَفُ
              إِلَى المَهْرِ والنَّفَقَةِ. وقَولهُ تَعالَى: ذِي الطَّوْلِ لاَ إِلَهَ إلاَّ هُوَ، أَي ذِي القُدْرَةِ، وقيلَ:
              ذِي الفَضْلِ والمَنِّ. ويُقالُ: مَا هوَ {بِطَائِلٍ: لِلدُّونِ الْخَسِيسِ، الذَّكَرُ والأُنْثَى فِي ذلكَ سَواءٌ،
              قَالَ: لقدْ كَلَّفُونِي خُطَّةً غيرَ طَائِلِ ومنهُ حَديثُ ابنِ مَسْعُودٍ، فِي قَتْلِ أبي جَهْلٍ: ضَرَبْتُهُ
              بِسَيْفٍ غَيْرِ طائِلٍ، أَي: غيرِ مَاضٍ وَلَا قَاطِعٍ كأَنَّهُ كانَ سَيْفاً دُوناً بَيْنَ السُّيُوفِ، وَفِي
              حديثٍ آخَرَ: أَنَّهُ ذَكَرَ رَجُلاً مِنْ أَصْحابِهِ قُبِضَ) فُكُفِّنَ فِي كَفَنٍ غيرِ} طَائِلٍ، أَي غيرِ رَفِيع
              وَلَا نَفِيسٍ. وأَصْلُ {الطَّائِلِ: النَّفْعُ والفائِدَةُ. (و) } الطُّوَّلُ، كَسُكَّرٍ: طَائِرٌ، وعليهِ اقْتَصَرَ
              الجَوْهَرِيُّ، وَزَاد الصَّاغانِيُّ: مائِيٌّ، {طَوِيلُ الرِّجْلَيْنِ. (و) } طُوَالَةُ، كَثُمَامَةٍ: ع، أَو بِئْرٌ
              فِي دِيَارِ فَزارَةَ، لِبَنِي مُرَّةَ، قالَهُ نَصْرٌ، وأَنْشَدَ الصَّاغانِيُّ لِلشَّمَّاخِ: (كِلاَ يَوْمَيْ
              {طُوالَةَ وَصْلُ أَرْوَى ... ظَنُونٌ آنَ مُطَّرَحُ الظَّنُونِ)وطُوَالَةُ: فَرَسٌ لِبَنِي ضُبَيْعَةَ بْنِ نِزَارٍ،
              نَقَلَهُ الصَّاغَانِيُّ. وَأَبُو طُوَالَةَ: عبدُ اللهِ بنُ عبدِ الرحمنِ بنِ مَعْمَرٍ النَّجَّارِيُّ، قاضِي المَدِينَةِ،
              تابِعِيٌّ، عَن أَنَسٍ، وابنِ المُسَيَّبِ، وعنهُ مالِكٌ ووَرْقَاءُ، والدَّرَاوَرْدِيُّ، وكانَ يَسْرُدُ الصَّوْمَ،
              كَذَا فِي الكَاشِفِ. (و) } طُوَالٌ، كَغُرَابٍ: اسْمُ رَجُلٍ. {وأَطَالَتِ الْمَرْأَةُ: وَلَدَتْ أَوْلاَداً} طِوَالاً،
              أَو وَلَداً {طَوِيلاً، وَفِي الأَسَاسِ، والصِّحاح: وَلَداً} طِوَالاً، وَفِي الْمَثَلِ: إِنَّ الْقَصِيرَةَ قد
              {تُطِيلُ، وإِنَّ} الطَّوِيلَةَ قد تُقْصِرُ، ولَيْسَ بِحَدِيثٍ، كَما وَهِمَ الْجَوْهَرِيُّ، قالَ شيخُنا: لَا
              وَهَم، إِذْ كَوْنُهُ مَثَلاً لَا يُنافِي أَنَّهُ حَدِيثٌ، فَفِي الأحادِيثِ النَّبَوِيَّةِ كَثِيرٌ مِنَ الأَمْثالِ
              المَشْهُورَةِ، وَقد صرَّحَ ابنُ الأَثِيرِ أَنَّهُ حديثُ. انْتهى، قلتُ: والمُصَنِّفُ قَلَّدَ الصَّاغانِيَّ فِي
              جَعْلِهِ مَثَلاً. وبَنُو {الأَطْوَلِ: بَطْنٌ مِنَ العَرَبِ، عَن ابنِ دُرَيْدٍ.} والطَّالَةُ: الأَتَانُ، قالَ
              ذُو الرُّمَّةِ، يَصِفُ ناقَتَهُ:(مَوَّارَةُ الضَّبْعِ مِثْلُ الحَيْدِ حارِكُها ... كَأَنَّها طَالَةٌ فِي دَفِّها
              بَلَقُ)قَالَ الأَزْهَرِيُّ: وَلَا أَعْرِفُهُ، فَلْيُنْظَرْ فِي شِعْرِ ذِي الرُّمَّةِ. {والْمِطْوَلُ، كَمِنْبَرٍ:
              الذَّكَرُ، كَما فِي العُبابِ. وَأَيْضًا: الرَّسَنُ، والجمعُ} المَطَاوِلُ، {ومَطاوِلُ الخَيْلِ: أَرْسَانُهَا،
              نَقَلَهُ الأَزْهَرِيُّ.} وطَيِّلَةُ الرِّيحِ، كَكَيِّسَةٍ: نَيِّحَتُهَا، نَقَلَهُ الجَوْهَرِيُّ. {وطَاوَلَهُ،}
              مُطاوَلَةً: ماطَلَهُ فِي الدَّيْنِ، والعِدَةِ. والسَّبْعُ {الطُّوَلُ، كَصُرَدٍ، فِي القُرْآنِ: مِن سُورَة الْبَقَرَةِ
              إِلَى سُورَةِ الأَعْرَافِ، هِيَ البَقَرَةُ وآلُ عِمْرانَ، والنِّساءُ، والمائِدَةُ، والأَنْعَامُ، والأَعْرافُ،
              فهذهِ سِتُّ سُوَرٍ مُتَوالِيَاتٌ، واخْتَلَفُوا فِي السَّابِعَةِ، فقيلَ: هِيَ سُورَةُ يُونُسَ، عليهِ السَّلاَمُ،
              أَو الأَنْفَالُ وَبَراءَةُ جَمِيعاً، لأنَّهُما سُورَةٌ واحِدَةٌ عِنْدَهُ، أَي عندَ مَنْ قَالَ بِهَذَا القَوْلِ،
              وقالَ بعضُهُم: هيَ الكَهْفُ، وقيلَ: التَّوْبَةُ، وقيلَ: الحَوَامِيمُ، والصَّحِيحُ مَا ذَكَرَهُ المُصَنِّفُ أَوَّلاً،}
              والطُّوَلُ: جَمْعُ {الطُّولَى، يُقالُ: هِيَ السُّورَةُ الطُّولَى، وهُنَّ} الطُّوَلُ، وقالَ الشاعرُ:(سَكَّنْتُهُ
              بعدَ مَا طارَتْ نَعامَتُهُ ... بِسُورَةِ الطُّورِ لَمَّا فاتَنِي الطُّوَلُ)وَفِي الحديثِ: أُوتِيتُ السَّبْعَ
              والطُّوَلَ، وَهَذَا البِنَاءُ يَلْزَمُهُ الأَلِفُ والَّلاَمُ أَو الإِضافَةُ. وَفِي الْمَثَلِ: قَصِيرَةٌ مِنْ
              {طَويلَةٍ، أَي تَمْرَةٌ مِنْ نَخْلَةٍ، يُضْرَبُ فِي اخْتِصَارِ الْكَلاَمِ، وجَوْدَتِهِ.} والطَّوِيلَةُ:) رَوْضَةٌ
              بِالصَّمَّانِ، واسِعَةٌ، عَرْضُها قَدْرُ مِيلٍ فِي طُولِ ثَلاثَةِ أَمْيالٍ، قالَهُ الأَزْهَرِيُّ، وَقَالَ مَرَّةً:
              تكونُ ثَلاثَةَ أَميالٍ فِي مِثْلِها، وفيهَا مَسَاكٌ لِلْمَطَرِ، إِذا امْتَلأَ شَرِبُوا الشَّهْرَ والشَّهْرَيْنِ،
              وأَنْشَدَ: عادَ قَلْبِي مِنَ الطَّوِيلَةِ عِيدُ {والطُّولَى، كَطُوبَى: تَأْنِيثُ} الأَطْوَلِ، ومنهُ حَديثُ أُمِّ
              سَلَمَةَ: أَنَّهُ كانَ يَقْرَأُ فِي المَغْرِبِ {بِطُولَى} الطُّولَيَيْنِ، أَي {بأَطْوَلِ السُّورَتَيْنِ} الطَّوِيلَتَيْنِ،
              يَعْنِي الأَنْعَامَ والأَعْرافَ. (و) {الطُّولَى أَيضاً: الْحَالَةُ الرَّفِيعَةُ، ج:} طُوَلٌ، كَصُرَدٍ. {والطَّوِيلُ
              مِنْ بُحُورِ الشِّعْرِ: مَعروفٌ، وقالَ الجَوْهَرِيُّ: مِن جِنْسِ العَرُوض، وَهِي كَلِمَةٌ مُوَلَّدَةٌ، سُمِّيَ
              بذلكَ لأَنَّهُ} أَطْوَلُ الشِّعْرِ كُلِّه، وذلكَ أَنَّ أَصْلَه ثَمانِيَةٌ وأَربعونَ حَرْفاً، وأكثرُ حُروفِ الشِّعْرِ
              مِنْ غِيرِ دَائِرَتِهِ اثْنانِ وأربعونَ حَرْفاً، ولأَنَّ أَوْتَادَهُ مُبْتَدَأٌ بهَا، {فالطُّولُ لِمُتَقَدِّمِ
              أَجْزائِهِ لازِمٌ أَبَداً، لأنَّ أَوَّلَ أَجْزائِهِ أَوْتادٌ، والزَّوائِدُ أَبَداً تَتَقَدَّمُ أَسْبابَها مَا
              أَوَّلُهُ وَتِدٌ، كَذَا فِي المُحْكَمِ، وَوَزْنُهُ فعولن مفاعلين، ثَمَانِي مَرَّاتٍ، مثلُ قَوْلِ امْرِئِ القَيْسِ:(أَلا
              انْعَمْ صَباحاً أَيُّها الطَّلَلُ البالِي ... وَهل يَنْعَمَنْ مَنْ كَانَ فِي العُصُرِ الخَالي)وبَيْنَهُم} طَائِلَةٌ:
              أَي عَدَاوَةٌ، وَتِرَةٌ، نَقَلَهُ الجَوْهَرِيُّ، والجمعُ: {الطَّوائِلُ، وَهِي الذُّحُولُ والأَوْتَارُ، وفُلانٌ
              يطلُبُ بَنِي فُلانٍ} بِطَائِلَةٍ: أَي بِوَتْرٍ، كَأَنَّ لَهُ فيهم ثَأْراً يَطْلُبُهُ بِدَمِ قَتِيلِهِ. وَفِي
              الصِّحاحِ: يُقالُ: هَذَا أَمْرٌ لَا {طَائِلَ فِيهِ، إِذا لَمْ يَكُنْ فيهِ غَناءٌ ومَزِيَّةٌ، يُقالُ ذلكَ فِي
              التِّذْكِيرِ والتِّأْنِيثِ. ولَمْ يَحْلُ مِنْهُ} بِطَائِلٍ: خَاصٌّ بالجَحْدِ، أَي لَا يُتَكَلَّمُ بِهِ إِلاَّ
              فِيهِ. ويُقالُ: {اسْتَطَالُوا عَلَيْهِم: أَي قَتَلُوا مِنْهُمْ أَكْثَرَ مِمَّا كَانُوا قَتَلُوا، نَقَلَهُ الجَوْهَرِيُّ.
              ومِمَّا يُسْتَدْرَكُ عَلَيْهِ. الرِّجالُ} الأَطَاوِلُ، جمعُ {الأَطْوَلِ، كَمَا فِي الصِّحاحِ.} وتَطاوَلاَ: تَبَارَيَا.
              {وتَطَاوَلَ عليْهِم الرَّبُّ بِفَضْلِهِ:} تَطَوَّلَ، أَو أَشْرَفَ، وَهُوَ مِنْ بابِ طَارَقْتُ النَّعْلَ، فِي
              إِطْلاقِها على الواحِدِ. وَفِي الحديثِ: {أطْوَلُكُنَّ يَداً أَسْرَعُ بِي لُحُوقاً، أَي أَمَدُّكُنَّ يَداً بالْعَطَاءِ،
              مِنَ} الطَّوْلِ. {وأَطالَ لِفَرَسِهِ: شَدَّهُ فِي الحَبْلِ.} وتَطاوَلَ فُلانٌ: أَظْهَرَ {الطُّوْلَ، أَو} الطَّوْلَ،
              قالَ اللهُ تَعالَى: {فَتَطاوَلَ عَلَيْهِمُ الْعُمُرُ، أَي طالَ، ومِثْلُهُ قَوْلُ الشاعِرِ:} تَطَاوَلَ لَيْلُكَ
              بالإِثْمِدِ {والطَّوِيلُ: لَقَبُ حُمَيْدِ بنِ أبي حُمَيْدٍ تِيْرَوَيْهِ، مَوْلَى طَلْحَةِ الطَّلَحَاتِ، مِنْ
              ثِقَاتِ التَّابِعِينَ، كانَ قَصِيراً، طَوِيلَ اليَدَيْنِ، فَسُمِّيَ بالضِّدِّ، أَو} لِطُولِ يَدَيْهِ، ماتَ سَنَةَ.
              وقَوْلُ الفَرَزْدَقِ: بَيْتاً دَعائِمُهُ أَعَزُّ {وأَطْوَلُ أَي عَزِيزَةٌ طَوِيلَةٌ. وَفِي حديثِ الدُّعاءِ:
              وبِكَ} أُطَاوِلُ، مِنَ الطَّوْلِ، وَهُوَ الفَضْلُ، والعُلُوُّ عَلى)الأَعْداءِ. والفَحْلُ {يَتَطَاوَلُ على إِبِلِهِ:
              أَي يَسُوقُها كيفَ يَشاءُ، ويَذُبُّ عَنْهَا الفُحُولَ. ورَجُلٌ} - طُولاَنِيٌّ، بالضَّمِّ، ومُطَاوِلٌ: كَثِيرُ
              الطُّوْلِ، عامِّيَّةٌ. {والطَّوِيلَةُ: قَرْيَةٌ بِمِصْرَ، قُرْبَ البرمون، وَقد دَخَلْتُها. وأحمدُ بن} طُولُونَ،
              بالضَّمِّ: أميرُ مِصْرَ، وابْنُهُ أَبُو مَعَدٍّ عَدْنانُ بنُ أحمدَ، وُلِدَ بِمِصْرَ، ورَوى عَن الرَّبِيعِ بنِ
              سليمانَ المُرادِيِّ، وماتَ سنة.'
