              طل
              1 طَلَّتِ السَّمَآءُ الأَرْضَ, [aor. ـُ inf. n. طَلٌّ, The sky rained small rain upon the earth, or land. (MA.) And طُلَّتِ الأَرْضُ, (S, O, K,) inf. n. as above, (TA,) [meaning, as is implied in the S and O, The earth, or land, was rained upon by the weakest of rain; or was rained upon, or bedewed, by the طَلّ, q. v.; or] the طَلّ descended upon the earth, or land: (K:) and طَلَّهَا النَّدَى [The rain, or dew, moistened it]: (S, O, TA:) and طَلَّت, with fet-h, signifies [accord. to some] It became moist, or moistened: one says, طُلَّتْ بِلَادُكَ, and طَلَّتْ; the former meaning May thy countries, or tracts of country, be rained upon; and the latter, become moist, or moistened: or, accord. to Aboo-Is-hák, [i. e. Zj,] طُلَّتْ only, with damm; [and he adds,] one says, رَحُبَتْ بِلَادُكَ وَطُلَّتْ, with damm, [i. e. May thy tracts of country be spacious to thee, and be moistened by the طَلّ, (or, as in art. رحب in the TA, أَرْحَبَتْ عَلَيْكَ وَطُلَّتْ)], not طَلَّتْ; because the طَلّ is not from them, [i. e. it is not from the tracts of country,] but they are the objects thereof. (TA.) [Golius mentions, among the significations of طَلَّ, as on the authority of Z, i. q. رحب, said of land, or the earth, and followed by على relating to a person: but I think it most probable that he inferred this signification from his finding, in a copy of the A, the phrase رَحُبَتْ عَلَيْكَ الأَرْصُ وَطَلَّتْ (for وَطُلَّتْ), without any explanation. And Freytag mentions ↓ أُطِلَّ as meaning It was watered by fine rain; from the Deewán of the Hudhalees.] And [it is said that] طَلَّتِ السَّمَآءُ signifies اِشْتَدَّ وَقْعُهَا [i. e. The rain fell vehemently]. (TA.) A2:  طَلَّ دَمَهُ, (Az, S, O, Msb,) said of God, (S,) or of the ruling power, (Msb,) first Pers\. طَلَلْتُهُ, (K,) aor. ـُ (Msb,) inf. n. طَلٌّ (Msb, K) and طُلُولٌ, (K,) He made his blood to go for nought, unretaliated, and uncompensated by a mulct; made it to be of no account: (Az, S, O, Msb, K, TA:) or held it to be of little account, as though it were but [the rain, or dew, termed] طَلّ, in its result; this, accord. to Er-Rághib, being the proper meaning: (TA:) and ↓ اطلّهُ signifies the same. (Az, S, O, Msb, K.) And طُلَّ دَمُهُ His blood was made to go for nought, &c.; (Az, S, Mgh, O, Msb, K;) as also دَمُهُ ↓ أُطِلَّ: (Az, S, O, Msb, K:) and طَلَّ دَمُهُ, (S, O, Msb, K,) with  fet-h, accord. to Ks and AO, (S, O, Msb,) aor. ـُ [contr. to analogy], (Msb,) or طَلِّ [agreeably with analogy]; (K;) and طَلَّ, originally طَلِلَ, (Msb, K, *) aor. ـَ (Msb, K;) [his blood went for nought, &c.;] but this is disallowed by Az; (S, O, Msb;) and it is more commonly with damm. (K.) b2:  And طَلَّهُ حَقَّهُ, aor. ـُ He diminished, or impaired, to him his right, or due; or deprived, or defrauded him of it, partly, or wholly: (K, TA:) or, accord. to Khálid Ibn-Jembeh, (TA,) he denied him, or refused him, his right, or due; (K, TA;) and withheld it [from him]: (TA:) and he annulled it; or made it to go for nought, as a thing of no account, or as a thing that had perished or become lost. (K, TA.) You say, طَلُّوا فُلَانًا حَقَّهُ, aor. ـُ inf. n. طَلٌّ, They denied, or refused, such a one his right, or due: so says Khálid Ibn-Jembeh. (O.) b3:  And طَلَّ غَرِيمَهُ, (K,) aor. ـُ (TA,) inf. n. طَلٌّ, (O, K,) He delayed, or deferred, with his creditor, or put him off, by promising time after time to pay him. (O, * K.) b4:  and طَلٌّ signifies also The driving of camels roughly, or rigorously. (K.) You say, طَلَّ الإِبِلَ, inf. n. طَلٌّ, He drove the camels roughly, or rigorously! (TK.) A3:  طَلَّ, [sec. Pers\. طَلِلْتَ, aor. ـَ inf. n. طَلَالَةٌ; like مَلَّ, [sec. Pers\. مَلِلْتَ, aor. ـَ (K, TA,) inf. n. مَلَالَةٌ; (TA;) [accord. to Freytag, followed by لَهُ, and in the Deewán of the Hudhalees by إِلَيْهِ; and so, accord. to him, ↓ استطلّ, followed by لَهُ;] He, or it, was, or became, pleasing, (K, TA,) and goodly. (TA.) A4:  And طَلَّهُ, (K,) inf. n. طَلٌّ, (TA,) is also syn. with طَلَاهُ: (K:) so in the phrase طَلَّهُ بِالوَرْسِ [He smeared it, or rubbed it over, with ورس, q. v.]; namely, a thing. (Ibn-'Abbád, O.) 4 أَطْلَ3َ see 1, former half: A2:  and the same, latter half, in two places.
              A3:  اطلّ عَلَيْهِ He (a man, Msb) looked upon it, looked upon it from above, looked down upon it, got a view of it, or saw it; syn. أَشْرَفَ, (S, O, K,) [i. e.] أَشْرَفَ عَلَيْهِ, (Msb,) or أَوْفَى عليه; (Ham p. 208;) properly أَوْفَى
              عَلَيْهِ بِطَلَلِهِ, i. e. بِشَخْصِهِ [meaning he looked upon it, &c., with his body; not in imagination]; (Er-Rághib, TA;) and ↓ استطلّ signifies the same: (K:) and so أَطَفَّ عليه. (O in art. طف.) [See also 6.] Hence, in a trad., the saying of Safeeyeh the daughter of 'Abd-El-Muttalib, فَأَطَلَّ عَلَيْنَا يَهُودِىٌّ فَقُمْتُ فَضَرَبْتُ رَأْسَهُ بِالسَّيْفِ ثُمَّ رَمَيْتُ بِهِ عَلَيْهِمْ [And a Jew looked upon us, and I arose, and smote off his head with the sword, then cast it upon them]. (O.) b2:  [Hence, perhaps,] اطلّ الزَّمَانُ (assumed tropical:)  The time drew near. (Msb.) b3:  and اطلّ عَلَى حَقِّى فَذَهَبَ بِهِ (assumed tropical:)  He got possession of my right, or due, and took it away, or went away with it. (Ibn-'Abbád, O.) [See also أَطَفَّ.] b4: And اطلّ عَلَيْهِ (tropical:)  He importuned him, (Ibn-'Abbád, O, TA,) حَتَّى غَلَبَهُ [so that, or until, he overcame him]. (TA.) And اطلّ فُلَانٌ عَلَى
              فُلَانٍ بِالأَذَى (assumed tropical:)  Such a one kept continually, or constantly, to the annoying, or molesting, or hurting, of such a one. (TA.) A4:  An Arab woman of the desert is related to have said, مَا أَطَلَّ شِعْرَ جَمِيلٍ
              وَأَحْلَاهُ [How pleasing is the poetry of Jemeel, and how sweet is it!]. (TA.) 5 هٰذِهِ الأَرْضُ قَدْ تَطَلَّلَتْ This land has produced herbage, and become replete, [for تَخَيَّرَتْ (to which I cannot assign any apposite meaning), in my original, I read تَحَيَّرَتْ,] and has not been trodden by any one: so says AA. (O.) 6 تَطَالَّ (S, O, in the K in art. طول written تَطَالَلَ,) إِلَى الشَّىْءِ (O) He stretched out his neck, looking at the thing, it being far from him: (S, O:) or he stretched out his neck to look: (TA in art. دمخ:) or تَطَالَلْتُ signifies I stood upon my toes, and stretched my stature, to look at a thing, (تَطَاوَلْتُ, K, TA, both of these verbs meaning thus, TA in art. طول,) and looked: (K, TA:) or, accord. to AA, التَّطَالُّ signifies the looking from above a place, or from a curtain or the like. (TA.) [See an ex. in a verse cited in art. شرف, conj. 10: and see also 4 in the present art.]10 إِسْتَطْلَ3َ see 4. b2:  استطلّ الفَرَسُ بِذَنَبِهِ is expl. by Ibn-'Abbád as signifying مَرَّمُطِلًّا بِهِ إِذَا نَاصَبَهُ فِى
              السَّمَآءِ [app. meaning The horse went along raising his tail toward the sky: for I think that إِذَا نَاصَبَهُ should be إِذَا كَانَ نَاصِبَهُ or أَىْ نَاصِبَهُ]. (O.) A2:  See also 1, last sentence but one. R. Q. 1 طَلْطَلَهُ He moved him, agitated him, shook him, or put him into a state of motion or commotion; (K, TA;) like تَلْتَلَهُ: (TA:) [or,] accord. to Ibn-'Abbád, الطَّلْطَلَةُ signifies the moving about the arms in walking. (O.) طَلٌّ Light, (Msb,) or weak, (K,) [i. e. drizzling,] rain: (Msb, K:) or the lightest, (K,) or weakest, of rain: (S, O, Msb, K:) or dew (نَدًى, K, TA) that descends from the sky in cloudless weather: (TA:) or above نَدًى and less than مَطَرٌ: (K:) or, accord. to Er-Rághib, rain that has little effect; and so in the Kur ii. 267: (TA:) pl. طِلَالٌ (S, O, K) and طِلَلٌ, (O, K,) the latter mentioned by Fr, and said by him to be the only instance of the kind that has been heard except حِرَفٌ pl. of حَرْفٌ as meaning the حَرْف of a mountain; (O;) [or] طَلَلٌ is a contraction of طِلَالٌ: in a saying of a poet, cited by IAar, (TA,) ↓ الطَّلَل occurs for الطَّلّ [in the CK الطُّلّ]: or in this instance, as some relate it, the word is الطِّلَل. (K, TA.) b2:  And Milk: (K:) or so ↓ طُلٌّ, with damm, in the saying مَا بِالنَّاقَةِ طُلٌّ [There is not in the she-camel any milk], as Yaakoob says, and as is related on the authority of AA, (S,) and thus in the saying مَا بِالدَّارِ طُلٌّ [There is not in the house any milk]: (O:) or طُلٌّ signifies thus: or blood. (K. [But see this word below.]) b3:  And Paucity of milk of a camel; as also ↓ طُلٌّ. (K.) b4:  And Fat, or fatness; syn. طِرْقٌ [in the CK طَرَقٌ, and in my MS. copy of the K طُرْقٌ]: thus in the saying مَا بِالنَّاقَةِ طَلٌّ [There is not in the she-camel any fat, or fatness]. (M, K, TA: in the CK طُلٌّ.) A2:  [It is also used as an epithet.] You say يَوْمٌ طَلٌّ, meaning ذُو طَلٍّ, i. e. [A day having drizzling rain, or dew; or] moist, or humid. (TA.) And أَرْضٌ طَلَّةٌ Land  moistened by dew [or by drizzling rain]; (TA;) as also ↓ مَطْلُولَةٌ: (S, TA:) and [in like manner]
              طَلَّةٌ signifies a meadow (رَوْضَةٌ) moistened by طَلّ. (K.) And طَلٌّ signifies Anything moist. (TA.) b2:  [Hence, app.,] Goodly, or good, or beautiful, and pleasing: thus applied to a night, and to poetry (شِعْر [in the CK شَعَر]), and to water, &c.: (K, TA:) applied to these as meaning good, or beautiful; and so to discourse; (TA;) and thus ↓ طَلِيلَةٌ applied to a خُطْبَة. (Ibn-'Abbád, O, TA.) And اِمْرَأَةٌ طَلَّةٌ means A beautiful, elegant, or graceful, woman. (TA,) And خَمْرٌ طَلَّةٌ Pleasant, or delicious, wine: (S, O, K: *) or, as some say, such as descends easily [or pleasantly down the throat]. (TA.) And طَلَّةٌ applied to an odour (رَائِحَةٌ, K, TA, or رَيَّا, TA) likewise signifies Pleasant, or delicious. (K, TA.) A3: Also An aged man: (Kr, K:) and طَلَّةٌ signifies an old woman: (K, TA:) and a woman foul, unseemly, or obscene, in tongue; (K, * TA;) annoying, or molesting. (TA.) b2:  And A serpent; (K;) thus accord. to IAar: (O:) and so ↓ طِلٌّ; (K;) thus accord. to AA; (O;) like طِلْعٌ. (TA in art. طلع.) طُلٌّ: see طَلٌّ, in two places. [But the signification of “ blood ” there mentioned requires consideration; for Sgh adds immediately after explaining the saying مَا بِالدَّارِ طُلٌّ what here follows.] b2:  ذَهَبَ دَمُهُ طُلًّا and ↓ طِلًّا means هَدَرًا [i. e. His blood went for nought, unretaliated, and uncompensated by a mulct]. (Ibn-'Abbád, O. [Then follows immediately in the O الطُّلَّآءُ, expl. as below.]) طِلٌّ: see طَلٌّ, last sentence: A2:  and see also طُلٌّ.
              طَلَّةٌ [fem. of طَلٌّ, q. v. b2:  And also used as a subst.: signifying] A wife. (S, O, K.) A2:  and Daintiness, or delicacy, in food and clothing. (K, TA. [In the CK, النِّعْمَةُ is erroneously put for النَّعْمَةُ.]) طُلَّةٌ The neck. (K.) A2:  And A draught of milk; (Az, K, TA;) as also ↓ طُلَّى: (Az, TA:) pl. of the former طُلَلٌ. (K.) طَلَلٌ A portion still standing of the remains of a dwelling or house; (S, O, Msb, * K;) as also ↓ طَلَالَةٌ: (K:) pl. أَطْلَالٌ and طُلُولٌ, (S, O, Msb, K,) the latter pl. sometimes used: (Msb:) what  cleaves to the ground is termed رَسْمٌ: (TA:) the people of the towns or villages apply the term أَطْلَالٌ to the remains of walls and of places of worship; and the people of the tents to [the remains of] places of eating and of drinking and of sleeping: (Ham p. 541:) [and] as pl. of طَلَلٌ it signifies elevated places: one says, رَأَيْتُ طَلَلَ القَرْيَةِ, meaning I saw what was elevated of the land of the town, or village. (Har p. 139.) b2: And The شَخْص [or body, or bodily or corporeal form or figure or substance, such as one sees from a distance,] of a thing, (Msb, K,) whatever it be; as also ↓ طَلَالَةٌ: pl. of the former as above: (K:) the شَخْص [as meaning body, or person,] of a man; as also ↓ طَلَالَةٌ: (S, O:) or, of a man, the erect شَخْص. (Msb voce جُثَّةٌ.) And ظَلَالَةٌ, with ظ, signifies the same. (O and K in art. ظل.) One says, حَيَّا اللّٰهُ طَلَلَكَ and ↓ طَلَالَتَكَ, meaning [May God preserve, or save,] thy شَخْص [i. e. body, or person]. (S, O.) And حَيَّا اللّٰهُ طَلَلَكَ and أَطْلَالَكَ, meaning مَا شَخَصَ مِنْ جَسَدِكَ [i. e. May God preserve, or save, what has risen into view of thy body, or person]. (TA.) b3: Also A place in the صَحْن [or court] of a house, prepared for the household to sit upon: ADk says that there was a place on which to eat and drink in the فِنَآء [or yard] of every house, called the طَلَل: (Az, TA:) accord. to ISd, (TA,) the طَلَل of a house is, or was, like the [kind of wide bench, of stone or brick &c., generally built against a wall, called] دُكَّانَة [or دُكَّان], upon which to sit. (K, TA.) b4:  And The جِلَال [or deck] of a ship or boat; (M, Mgh, O, K;) i. e. (Mgh) the covering thereof, which is like the roof (Mgh, Msb) of a house or chamber: (Mgh:) pl. أَطْلَالٌ. (Mgh, Msb, TA.) [In the TA it is said to mean the شِرَاع of a ship or boat; which is a mistake, as is sufficiently shown by its being there immediately added, “hence the trad. of Aboo-Bekr, that he used to pray upon the اطلال of the ship or boat. ”] b5:  [Hence, app.,] one says, (of a man, Ibn-'Abbád, O,) مَشَى عَلَى طَلَلِ المَآءِ i. e. على
              ظَهْرِهِ, (Ibn-'Abbád, O, K,) which, Z says, means على وَجْهِهِ [i. e. (tropical:)  He walked, or went along, upon the surface of the water: but whether this relates to a pretended miracle or to sliding upon ice, I know not]: and he adds that it is a tropical phrase. (TA.) A2:  Also Anything fresh, or juicy, or [like طَلٌّ] moist; syn. طَرِىٌّ. (K.) b2: See also طَلٌّ, first sentence.
              طَلِيلٌ: see مَطْلُولٌ.
              A2:  Also Sweet; syn. حُلْوٌ: (so accord. to the O and some copies of the K: accord. to other copies of the K, i. q. خِلق; i. e., accord. to some of these copies, خَلْقٌ; accord. to some, خَلَقٌ; and accord. to some, خَلِقٌ:) thus expl. by Ibn-'Abbád; and said by him to be of the dial. of Hudheyl. (O.) [The explanation in the O is, I doubt not, the right: and hence] b2:  طَلِيلَةٌ applied to a خُطْبَة: see طَلٌّ, latter part.
              A3:  Also A mat; syn. حَصِيرٌ: (IAar, O, K:) or such as is woven of [the leaves of the]
              دَوْم [or Theban palm-tree]; or of the leaves of the date-palm; or of the قُشُور [app. meaning the peels of the branches] thereof: (K, TA:) so in the M: in the T it is said that ↓ طَلِيلَةٌ means, accord. to AA, a [mat of the kind called] بُورِيَآء; and accord. to As, a بَارِىّ [which signifies the same as بوريآ]: (TA:) pl. أَطِلَّةٌ and طِلَّةٌ and طُلُلٌ. (K.) طَلَالَةٌ [an inf. n.: see 1, last sentence but one. And, as a simple subst.,] A good, or goodly, state or condition; and a beautiful aspect, appearance, mien, or guise. (IAar, O, K.) and Beauty, or beauty of colour, or brightness: (O, K:) so in the saying, عَلَى مَنْطِقِهِ طَلَالَةُ الحُسْنِ [Upon his diction is the glow of beauty]. (O.) Accord. to As, i. q. حُسْنٌ and مَآءٌ [i. e. Goodliness, or beauty, and, app., lustre]. (TA.) b2: Also, (AA, O, K,) and some say ↓ طُلَالَةٌ, (AA, O,) Joy, gladness, or happiness. (AA, O, K.) A2:  See also طَلَلٌ, in four places. b2:  [Hence,] one says فَرَسٌ حَسَنُ الطَّلَالَةِ, meaning [A horse goodly, or beautiful,] in what is high, or elevated, of his frame, or make. (TA.) طُلَالَةٌ: see the next preceding paragraph.
              طَلِيلَةٌ: see طَلِيلٌ.
              طُلَّى: see طُلَّةٌ.
              طُلَّآءٌ, (Ibn-'Abbád, O, K,) like سُلَّآءٌ, (K, TA,) [in the CK, طَلّاء, like سَلّاء, and] in some copies of the K, erroneously, طِلَّآء, (TA,) Blood, itself: and some say, a pellicle upon the surface thereof: (O:) [and in like manner طُلَّآء is expl. in the K in art. طلأ:] or blood that has been made to go for nought, unretaliated, and uncompensated by a mulct: (K: [and from the context in the O, it seems that this is probably meant by Ibn-'Abbád: see طُلٌّ:]) accord. to AAF, (TA,) the ء in this word is originally ل. (K, TA.) طُلْطُلٌ A chronic, or permanent, disease. (IAar, Az, K.) طُلَطِلٌ: see طُلَاطِلَةٌ.
              طُلَطِلَةٌ: see طُلَاطِلَةٌ: each in two places.
              طَلَاطِلُ: see طُلَاطِلَةٌ: each in two places.
              طُلَاطِلٌ: see the next paragraph, in three places.
              طُلَاطِلَةٌ A calamity, or misfortune; (S, O, K;) as also ↓ طُلَطِلَةٌ [in the CK طَلْطَلَة] and ↓ طُلَطِلٌ [in the CK طَلْطَل]. (K, TA.) b2:  Also, (S, O,) or ↓ طُلَاطِلٌ, (M, K,) A disease that wearies the physicians, (S, M, O, K,) for which there is no remedy: (S, O:) and said in the M to be a pain in the back. (TA.) And the former, A disease that attacks a man in his belly; as also ↓ طُلَطِلَةٌ. (O.) And A disease in the backs of asses, that breaks their backs; (K, * TA;) so in the M; (TA;) as also طِلاطل with damm and fet-h [i. e.
              ↓ طُلَاطِلٌ and ↓ طَلَاطِلُ]. (K.) b3:  And Death; as also ↓ طُلَاطِلٌ; (K, TA;) so in the M, with damm; and with fet-h [i. e. ↓ طَلَاطِلُ]. (TA.) b4:  And A certain piece of flesh in the fauces: (ISd, K, TA:) or the piece of flesh extending downwards upon [the upper extremity of] the مُسْتَرَط [or مَسْرَط, i. e. the gullet]; (As, Az, O, K, * TA;) [meaning] the لَهَاة [or uvula]: (TA:) or, (O, K,) accord. to AHeyth, (O,) the falling of the لَهَاة [or uvula], so that neither food nor beverage passes the fauces easily by reason of it. (O, K.) أَطْلَالُ is the name of a certain mare, (O, K,) or of a she-camel, (K,) which, in reply to her rider's commanding her to leap a river, on the day of El-Kádiseeyeh, is asserted to have spoken, saying, وَثْبٌ وَسُورَةِ البَقَرَةِ [A leap, by the Chapter of the Cow!]. (O, K.) [Freytag has erroneously said, as on the authority of the K, that it is a name of the chapter of the Kur-án otherwise  called بقرة.]
              مُطَلٌّ: see مَطْلُولٌ.
              أَمْرٌ مُطِلٌّ An affair not settled, or not established. (So accord. to some copies of the S and K, expl. by the words لَيْسَ بِمُسْتَقِرٍّ: in other copies of both, and in the O, ليس بِمُسْفِرٍ [to which I am unable to assign any probable meaning].) مُطَلِّلٌ i. q. ضَبَابٌ [Mist; or moisture like clouds, or like dust, covering the earth in the early mornings; or thin clouds, like smoke; &c.: see art. ضب]. (TA.) مَطْلُولٌ: see its fem., with ة, voce طَلٌّ. b2: Also Blood made to go for nought, unretaliated, and uncompensated by a mulct; (S, O, K;) and so ↓ طَلِيلٌ and ↓ مُطَلٌّ. (K.) b3:  Also [or لَبَنٌ مَطْلُولٌ] Pure milk with froth upon it, upon which water has been poured, and which one imagines to be good, or pleasant, whereas there is no goodness in it; and so ↓ مَطْلُولَةٌ: or this latter, some say, signifies a piece of skin soaked and softened [ for مَوْزُونَةٌ in my original, which I think a mistranscription, I read مَوْدُونَةٌ,] with pure milk, which they eat [app. in a time of scarcity].
              مَطْلُولَةٌ: see the next preceding paragraph.
