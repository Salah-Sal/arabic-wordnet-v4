            definitions_text: "طول: الطُّولُ: نقيض القِصَر في الناس وغيرهِم من الحيوان والمَوات.\nويقال للشيء الطَّويلِ: طالَ\
              \ يَطُولُ طُولاً، فهو طَويلٌ وطُوالٌ. قال\nالنحويون: أَصْلُ طالَ فَعُلَ استدلالاً بالاسم منه إِذا جاء على فَعِيل\
              \ نحو\nطَويل، حَمْلاً على شَرُفَ فهو شَرِيف وكَرُمَ فهو كَريم، وجَمْعُهُما\nطِوال؛ قال سيبويه: صَحَّت الواو\
              \ في طِوال لصِحَّتها في طَويل، فصار طِوال\nمن طَويل كجِوار من جاوَرْت، قال: ووافَقَ الذين قالوا فَعِيل الذين\
              \ قالوا\nفُعال لأَنهما أُخْتان فجَمَعوه جَمْعه، وحكى اللُّغويون طِيال، ولا\nيوجبه القياس لأَن الواو قد صَحَّت\
              \ في الواحد فحكمها أَن تصح في الجمع؛ قال\nابن جني لم تقلب إِلا في بيت شاذ وهو قوله:\nتَبَيَّنَ لي أَنَّ القَماءةَ\
              \ ذِلَّةٌ،\nوأَنَّ أَعِزَّاء الرجالِ طِيالُها\nوالأُنثى طَويلةٌ وطُوالةٌ، والجمع كالجمع، ولا يمتنع شيء من ذلك\
              \ من\nالتسليم. ويقال للرجل إِذا كان أَهْوَج الطُّول طُوَال وطُوَّال، وامرأَة\nطُوالة وطُوَّالة. الكسائي في باب\
              \ المُغالَبة: طاوَلَني فَطُلْتُه من\nالطُّول والطَّوْل جميعاً. وقال سيبويه: يقال طُلْتُ على فَعُلْتُ لأَنك تقول\n\
              طَويل وطُوال كما قُلْتَ قَبُحَ وقَبيح، قال: ولا يكون طُلْته كما لا\nيكون فَعُلْتُه في شيء؛ قال المازني: طُلْتُ\
              \ فعُلْتُ أَصْلٌ واعْتَلَّت من\nفعُلْت غيرَ مُحَوَّلة، الدليلُ على ذلك طَوِيلٌ وطُوال؛ قال: وأَما\nطاوَلْته\
              \ فطُلْتُه فهي مُحَوَّلة كما حُوِّلَت قُلْتُ، وفاعلها طائلٌ، لا يقال\nفيه طَويلٌ كما لا يقال في قائل قَويل،\
              \ قال: ولم يؤْخذ هذا إِلا عن\nالثِّقات؛ قال: وقُلْتُ مُحَوَّلةٌ من فَعَلْت إِلى فَعُلْت كما أَن بِعْتُ\nمُحَوَّلة\
              \ من فَعَلْت إِلى فَعِلْت وكانت فعِلْتُ أَولى بها لأَن الكسرة\nمن الياء، كما كان فَعُلْت أَولى بقُلْت لأَن الضمة\
              \ من الواو؛ وطالَ\nالشيءُ طُولاً وأَطَلْته إِطالةً. والسَّبْع الطُّوَلُ من سُور القرآن: سَبْعُ\nسُوَر وهي سورة\
              \ البقرة وسورة آل عمران والنساء والمائدة والأَنعام\nوالأَعراف، فهذه ست سور متوالياتٌ واختلفوا في السابعة، فمنهم\
              \ من قال السابعة\nالأَنفال وبراءَة وعدّهما سورة واحدة، ومنهم من جعل السابعة سورة يونس؛\nوالطُّوَل: جمع طُولى،\
              \ يقال هي السّورة الطُّولى وهُنَّ الطُّوَل؛ قال ابن\nبري: ومنه قرأْت السَّبْع الطُّوَل؛ وقال الشاعر:\nسَكَّنْته،\
              \ بعدَما طارَتْ نَعامتُه،\nبسورة الطُّورِ، لمَّا فاتَني الطُّوَلُ\nوفي الحديث: أُوتِيتُ السَّبْعَ الطُّوَل؛\
              \ هي بالضم جمع الطُّولى، وهذا\nالبناء يلزمه الأَلف واللام أَو الإِضافة. وفي حديث أُمِّ سَلَمَة: أَنه\nكان يقرأَ\
              \ في المغرب بطُولى الطُّولَيَيْن، هي تثنية الطُّولى\nومُذَكَّرُها الأَطْوَل، أَي أَنه كان يقرأُ فيها بأَطْول\
              \ السورتين الطويلتين،\nتَعْني الأَنعام والأَعراف. والطويل من الشِّعْر: جنس من العَرُوض، وهي كلمة\nمُوَلَّدة،\
              \ سمي بذلك لأَنه أَطْوَلُ الشِّعْر كُلِّه، وذلك أَن أَصله\nثمانية وأَربعون حرفاً، وأَكثر حروف الشعر من غير دائرته\
              \ اثنان وأَربعون\nحرفاً، ولأَن أَوتاده مبتدأ بها، فالطُّول لمتقدم أَجزائه لازم أَبداً، لأَن\nأَول أَجزائه أَوتاد\
              \ والزوائد أَبداً يتقدم أَسبابَها ما أَوَّلُه\nوَتِدٌ. والطُّوال، بالضم: المُفْرِط الطُّول؛ وأَنشد ابن بري قول\n\
              طُفَيل:طُوال السَّاعِدَيْن يَهُزُّ لَدْناً،\nيَلُوحُ سِنانُه مِثْلَ الشِّهاب\nقال: ولا يُكَسَّر \n(* قوله «قال\
              \ ولا يكسر إلخ» هكذا في الأصل، وعبارة\nالقاموس وشرحه: والطوال، كرمان، المفرط الطول، ولا يكسر، انما يجمع جمع\n\
              السلامة اهـ. وبهذا يعلم ما لعله سقط هنا، فقد تقدم في صدر المادة أَن\nطوالاً كغراب يجمع على طوال بالكسر).\nإِنما\
              \ يُجْمع جمع السلامة. وطاوَلَني فَطُلْتُه أَي كنت أَشَدَّ طُولاً\nمنه؛ قال:\nإِنَّ الفَرَزْدَقَ صَخْرَةٌ عادِيَّةٌ\n\
              طالَتْ، فَلَيْسَ تَنالُها الأَوْعال\nوطالَ فلان فلاناً أَي فاقه في الطُّول؛ وأَنشد:\nتَخُطُّ بِقَرْنَيْها بَرِيرَ\
              \ أَراكةٍ،\nوتَعْطُو بِظِلْفَيْها، إِذا الغُصْنُ طالها\nأَي طاوَلَها فلم تَنَلْه. والأَطْوَل: نقيضُ الأَقْصر،\
              \ وتأْنيث\nالأَطْوَل الطُّولى، وجمعها الطُّوَل.\nالجوهري: الطُّوَال، بالضم، الطَّوِيلُ. يقال طَوِيلٌ وطُوَالٌ،\
              \ فإِذا\nأَفرَط في الطُّول قيل طُوّال، بالتشديد. والطِّوال، بالكسر: جمع طَويل،\nوالطَّوَالُ، بالفتح: من قولك\
              \ لا أُكَلِّمه طَوَالَ الدَّهْر وطُولَ\nالدَّهْر بمعنى. ويقال: قَلانِسُ طِيَالٌ وطِوَالٌ بمعنى. والرِّجال\n\
              الأَطاوِل: جمع الأَطْوَل، والطُّولىَ تأْنيث الأَطْوَل، والجمع الطُّوَل مثل\nالكُبْرَى والكُبَر.\nوأَطَالَتِ\
              \ المرأَةُ إِذا وَلَدَتْ طِوَالاً. وفي الحديث: إِن القَصِيرة\nقد تُطِيل. الجوهري: والطُّولُ خِلاف العَرْض. وطالَ\
              \ الشيءُ أَي امتدَّ،\nقال: وطُلْتُ أَصله طَوُلْتُ بضم الواو لأَنك تقول طَويل، فنقلت الضمة\nإِلى الطاء وسقطت\
              \ الواو لاجتماع الساكنين، قال: ولا يجوز أَن تقول منه\nطُلْتُه، وأَما قولك طَاولَني فطُلْتُه فإِنما تَعْني بذلك\
              \ كنت أَطْولَ منه\nمن الطُّول والطَّوْل جميعاً. وفي الحديث: أَن النبي، صلى الله عليه\nوسلم، ما مَشَى مع طِوَالٍ\
              \ إِلا طالَهُم، فهذ من الطُّول؛ قال ابن بري: وعلى\nذلك قول سُبَيح بن رِياح الزِّنْجي، ويقال رياح بن سبيح، حين\
              \ غَضِبَ لما\nقال جَرِيرٌ في الفَرَزْدَق:\nلا تَطْلُبَنَّ خُؤُولةً في تَغْلِبٍ،\nفالزِّنْجُ أَكْرَمُ منهمُ أَخْوَالا\n\
              فقال سبيح أَو رياح لما سَمِع هذا البيت:\nالزِّنْجُ لو لاقَيْتَهم في صَفِّهِمْ،\nلاقَيْتَ، ثمَّ، جَحَاجِحاً أَبْطَالاً\n\
              ما بالُ كَلْبِ بَني كُلَيْبٍ سَبَّنا،\nأَنْ لم يُوازِنْ حاجِباً وعِقَالا؟\nإِنَّ الفَرَزْدَق صَخْرَةٌ عادِيَّةٌ\n\
              طالَتْ، فليس تَنالُها الأَوْعالا\n(* قوله «الاوعالا» تقدم إيراده قريباً الأوعال بالرفع).\nوقالت الخنساء:\nوما\
              \ بَلَغَتْ كَفُّ امرئٍ مُتَناوِلٍ،\nمن المَجْدِ، إِلاَّ والذي نِلْتَ أَطْوَلُ\nوفي حديث استسقاء عمر، رضي الله\
              \ عنه: فطالَ العَباسُ عمرَ أَي غَلَبَه\nفي طُولِ القامة، وكان عمر طَويلاً من الرجال، وكان العباس أَشدَّ طُولاً\n\
              منه. وروي أَن امرأَة قالت: رأَيت عَبّاساً يطوف بالبيت كأَنه فُسْطاطٌ\nأَبيض، وكانت رأَت عَلِيَّ بن عبد الله\
              \ بن العباس وقد فَرَعَ الناسَ كأَنه\nراكب مع مُشَاةٍ فقالت: مَنْ هذا؟ فأُعْلِمَتْ فقالت: إِنّ الناسَ\nليَرْذُلون،\
              \ وكان رأْس علي بن عبد الله إِلى مَنْكِب أَبيه عبد الله، ورأْسُ\nعبد الله إِلى مَنْكِب العباس، ورأْسُ العباس\
              \ إِلى مَنْكِب عبد\nالمُطَّلِب. وأَطَلْتُ الشيءَ وأَطْوَلْت على النقصان والتمام بمعنى. المحكم:\nوأَطال الشيءَ\
              \ وطَوَّلَه وأَطْوَلَه جعله طَويلاً، وكأَن الذين قالوا ذلك\nإِنما أَرادوا أَن ينبهوا على أَصل الباب، قال فلا\
              \ يقاس هذا إِنما يأْتي\nللتنبيه على الأَصل؛ وأَنشد سيبويه:\nصَدَدْتِ فأَطْوَلْتِ الصُّدودَ، وقَلَّما\nوِصالٌ،\
              \ على طُولِ الصُّدود، يَدُومُ\nوكلُّ ما امتدَّ من زَمَن أَو لَزِمَ من هِمٍّ ونحوِه فقد طالَ، كقولك\nطالَ الهَمُّ\
              \ وطال الليلُ. وقالوا: إِنَّ الليل طَويلٌ فلا يَطُلْ إِلاَّ\nبخير؛ عن اللحياني. قال: ومعناه الدُّعاء. وأَطال\
              \ الله طِيلَتَه أَي\nعُمْرَه. وطالَ طِوَلُك وطِيَلُك أَي عُمْرك، ويقال غَيْبتك؛ قال\nالقطامي:إِنّا مُحَيُّوكَ\
              \ فاسْلَمْ أَيُّها الطَّلَلُ،\nوإِن بَلِيتَ، وإِن طالَتْ بك الطِّوَلُ\nيروى الطِّيَل جمع طِيلة، والطِّوَل جمع\
              \ طِوَلة، فاعْتَلَّ الطِّيَل\nوانقلبت ياؤه واواً لاعتلالها في الواحد، فأَما طِوَلة وطِوَل فمن باب\nعِنَبة وعِنَب.\n\
              وطالَ طُوَلُك، بضم الطاء وفتح الواو، وطالَ طَوَالُك، بالفتح،\nوطِيَالُك، بالكسر؛ كل ذلك حكاه الجوهري عن ابن\
              \ السكيت. وجملٌ أَطْوَلُ إِذا\nطالتْ شَفَتُه العُليا. قال ابن سيده: والطَّوَل طُولٌ في مِشْفَر البعير\nالأَعلى\
              \ على الأَسفل، بعير أَطْوَل وبه طَوَلٌ. والمُطاوَلة في الأَمر: هو\nالتطويل والتَّطاوُلُ في مَعْنًى هو الاسْتِطالة\
              \ على الناس إِذا هو رَفَع\nرأْسَه ورأَى أَنّ له عليهم فَضْلاً في القَدْر؛ قال: وهو في معنى آخر\nأَن يقوم قائماً\
              \ ثم يَتَطاوَل في قيامه ثم يَرْفَع رأْسَه ويَمُدّ قوامَه\nللنظر إِلى الشيء. وطاوَلْته في الأَمر أَي ماطَلْته.\
              \ وطَوَّل له\nتَطْويلاً أَي أَمْهَله. واسْتَطالَ عليه أَي تَطَاوَلَ، يقال: اسْتَطالوا عليهم\nأَي قَتَلوا منهم\
              \ أَكثرَ مما كانوا قَتَلوا، قال: وقد يكون اسْتَطالَ\nبمعنى طالَ، وتَطاوَلْت بمعنى تَطالَلْت. وفي الحديث: إِن\
              \ هذين الحَيَّين من\nالأَوس والخَزْرَج كانا يتَطاوَلانِ على رسول الله،صلى الله عليه وسلم،\nتَطاوُلَ الفَحْلَين\
              \ أَي يَسْتَطِيلانِ على عَدُوِّه ويتباريانِ في ذلك\nليكون كل واحد منهما أَبلغ في نصرته من صاحبه، فشُبِّه ذلك\
              \ التَّباري\nوالتغالُب بتَطاوُلِ الفحلين على الإِبل، يَذُبُّ كلُّ واحد منهما الفُحولَ\nعن إِبله ليظهر أَيُّهما\
              \ أَكثرُ ذَبًّا. وفي حديث عثمان: فتَفَرَّق الناسُ\nفِرَقاً ثلاثاً، فصامِتٌ صَمْتُه أَنْفَذُ من طَوْلِ غيره،\
              \ ويروى من\nصَوْل غيره، أَي إِمْساكُه أَشدُّ من تَطاوُل غيره. ويقال: طالَ عليه\nواستطالَ وتَطاوَلَ إِذا علاه\
              \ وتَرَفَّع عليه. وفي الحديث: أَرْبى الرِّبا\nالاستطالةُ في عِرْضِ الناس أَي اسْتِحْقارُهم والتَّرَفُّعُ عليهم\n\
              والوَقِيعةُ فيهم.\nوتَطاوَلَ: تمدَّدَ إِلى الشيء ينظر نحوه؛ قال:\nتَطاوَلْتُ كي يَبدو الحَصِيرُ فما بَدَا\n\
              لِعَيْني، ويا لَيْتَ الحَصِيرَ بَدا لِيا\nواسْتَطالَ الشَّقُّ في الحائط: امتدَّ وارتفع؛ حكاه ثعلب، وهو\nكاسْتَطار.\n\
              والطِّوَلُ: الحَبْلُ الطويلُ جدًّا؛ قال طرفة:\nلَعَمْرُكَ إِنَّ الموتَ، ما أَخْطَأَ الفَتَى،\nلَكَالطِّوَلِ\
              \ المُرْخَى، وثِنْياهُ باليَدِ\nوالطِّوَلُ والطِّيَلُ والطَّويلة والتِّطْوَلُ، كُلُّه: حَبْلٌ طويل\nتُشَدُّ\
              \ به قائمةُ الدابة، وقيل: هو الحبل تُشَدُّ به ويُمْسِك صاحبُه\nبطَرَفه ويُرْسِلها تَرْعى؛ قال مُزاحِم:\nوسَلْهَبةٍ\
              \ قَوْداءَ قُلِّصَ لَحْمُها،\nكسِعْلاةِ بِيدٍ في خِلالٍ وتِطْوَل\nوقد طَوَّلَ لها. والطِّوَل: الحبل الذي يُطَوَّل\
              \ للدابة فترعى فيه،\nوكانت العرب تتكلم به \n(* قوله «وكانت العرب تتكلم به» كذا في الأصل، وعبارة\nالتهذيب: وقال\
              \ الليث الطويلة اسم حبل يشد به قائمة الدابة ثم ترسل في\nالمرعى، وكانت العرب تتكلم به اهـ) ؛ يقال: طَوِّل لفرسك\
              \ يا فلان أَي أَرْخِ\nله حَبْلَه في مَرْعاه. الجوهري: طَوِّلْ فرَسك أَي أَرْخِ طَويلتَه في\nالمَرْعى؛ قال أَبو\
              \ منصور: لم أَسمع الطَّويلةَ بهذا المعنى من العرب\nورأيتهم يُسَمُّونه الطِّوَل فلم نسمعه إِلاَّ بكسر الأَول\
              \ وفتح الثاني.\nغيره: يقال أَرْخ للفَرَس من طِوَلِه، وهو الحَبْل الذي يُطَوَّل للدابة\nفترعى فيه، وأَنشد بيت\
              \ طرفة: لَكَالطِّوَل المُرْخَى؛ قال: وهي الطَّويلة\nأَيضاً، وقوله: ما أَخْطَأَ الفَتَى أَي في إِخطائه الفَتى؛\
              \ وقد شَدَّد\nالراجزُ الطِّوَلَّ للضرورة فقال مَنْظور بن مَرْثَد الأَسَدي:\nتَعَرَّضَتْ لي بمَكَانٍ حِلِّ،\n\
              تَعَرُّضاً لم تَأْلُ عن قَتْلِلِّي،\nتَعَرُّضَ المُهْرَة في الطِّوَلِّ\nويروى: عن قَتْلاً لي، على الحكاية، أَي\
              \ عن قَوْلِها قَتْلاً له؛ قال\nالجوهري: وقد يفعلون مثل ذلك في الشِّعر كثيراً ويزيدون في الحرف من بعض\nحروفه؛\
              \ قال ذُهْل بن قريع، ويقال قارب بن سالم المُرِّي:\nكأَنَّ مَجْرَى دَمْعِها المُسْتَنِّ\nقُطْنُنَّةً من أَجْوَدِ\
              \ القُطْنُنِّ\nوأَنشده غيره:\nقُطُنَّةٌ من أَجْوَدِ القُطُنِّ\nقال ابن بري: وهذا هو صواب إِنشاده. وفي الحديث:\
              \ ورجُلٌ طَوَّل لها في\nمَرْجٍ فقَطَعَتْ طِوَلها، وفي آخر: فأَطالَ لها فقَطَعَتْ طِيَلَها؛\nالطِّوَلُ والطِّيَلُ،\
              \ بالكسر: هو الحبل الطويل يُشَدُّ أَحد طَرَفيه في\nوَتِدٍ أَو غيره والآخر في يد الفرس ليَدُور فيه ويرعى ولا\
              \ يذهب لوجهه.\nوطَوَّلَ وأَطالَ بمعنىً أَي شَدَّها في الحبل؛ ومنه الحديث: لِطِوَل الفَرَس\nحمًى أَي لصاحب الفرس\
              \ أَن يَحْمِي الموضع الذي يَدُور فيه فرسُه المشدودُ\nفي الطِّوَل إِذا كان مُباحاً لا مالك له. وفي الحديث: لا\
              \ حِمى إِلاَّ\nفي ثلاث: طِوَلِ الفرس، وثَلَّةِ البئرِ، وحَلْقةِ القوم؛ قوله لا حِمى\nيعني إِذا نزل رجل في عسكر\
              \ على موضع له أَن يمنع غيرَه طَوِلَ فرسه، وكذلك\nإِذا حَفَر بئراً له أَن يمنع غيرَه مقدارَ ما يكون حَرِيماً\
              \ له.\nومَطَاوِلُ الخيل: أَرسانُها، واحدها مِطْوَلٌ. والطِّوَلُ: التمادي في الأَمر\nوالتراخي. يقال: طالَ طِوَلُك\
              \ وطِيَلُك وطِيلُك وطُولُك، ساكنة الياء\nوالواو؛ عن كراع، إِذا طال مُكْثُه وتمادِيه في أَمر أَو تَرَاخِيه عنه؛\
              \ قال\nطفيل:\nأَتانا فلم نَدْفَعْه، إِذ جاء طارِقاً،\nوقلنا له: قد طالَ طُولُك فانْزِلِ\nأَي أَمرُك الذي أَنت\
              \ فيه من طُول السفر ومُكابدة السير، ويروى: قد طال\nطِيلُك؛ وأَنشد ابن بري:\nأَما تَعْرِف الأَطلالَ قد طالَ طِيلُها\n\
              والطَّوَالُ: مَدَى الدهرِ؛ يقال: لا آتِيك طَوَال الدَّهْر.\nوالطَّوْل والطائل والطائلة: الفَضْل والقُدْرة والغى\
              \ والسَّعَة\nوالعُلُوُّ؛ قال أَبو ذؤَيب:\nويَأْشِبُني فيها الذينَ يَلُونَها،\nولو عَلِموا لم يَأْشِبُوني بطائل\n\
              وأَنشد ثعلب في صفة ذئب:\nوإِن أَغارَ فلم يَحْلُلْ بطائلةٍ،\nفي لَيْلةٍ من جُمَيْر ساوَرَ الفُطُما\n(* قوله «وإن\
              \ أغار إلخ» سبق إنشاده في ترجمة جمر:\nوإن أطاف ولم يظفر بطائلة * في ظلمة ابن جمير ساوَر\nالفطما)\nكذا أَنشده\
              \ جُمَيْر على لفظ التصغير، وقد تَطَوَّل عليهم. وفي التنزيل\nالعزيز: ومَنْ لم يَسْتَطِعْ منكم طَوْلاً (الآية)؛\
              \ قال الزجاج: معناه من\nلم يقدر منكم على مَهْرِ الحُرَّة، قال: والطَّوْلُ القدرة على المَهْر.\nوقوله عز وجل:\
              \ ذي الطَّوْل لا إِله إِلا هو؛ أَي ذي القُدْرة، وقيل:\nالطَّوْل الغِنى، والطَّوْلُ الفَضْل، يقال: لفلان على\
              \ فلان طَوْلٌ أَي\nفَضْلٌ. ويقال: إِنه لَيَتَطَوَّل على الناس بفضله وخيره. والطَّوْل، بالفتح:\nالمَنُّ، يقال\
              \ منه: طالَ عليه وتَطوَّلَ عليه إِذا امْتَنَّ عليه. وفي\nالحديث: اللهمَّ بك أُحاوِل وبك أُطاوِل، مُفاعَلة من\
              \ الطَّوْل، بالفتح،\nوهو الفَضْلُ والعُلُوُّ على الأَعداء؛ ومنه الحديث: تَطَاوَلَ عليهم\nالرَّبُّ بفضله أَي\
              \ تَطَوَّل، وهو من باب طارَقْتَ النَّعْلَ في إِطلاقها على\nالواحد؛ ومنه الحديث: قال لأَزواجه أَوَّلُكُنَّ لحُوقاً\
              \ بي\nأَطْوَلُكُنَّ يداً، فاجْتَمَعْن يتَطاوَلْنَ فطالَتْهُنَّ سَوْدةُ فماتت زينبُ\nأَوَّلَهنَّ؛ أَراد أَمَدُّكُنَّ\
              \ يداً بالعطاء من الطَّوْل فظَنَنَّه من\nالطُّول، وكانت زينب تَعْمَل بيدها وتتصدق؛ قال أَبو منصور: والتَّطَوُّل\
              \ عند\nالعرب محمود يوضع موضع المَحاسِن، والتطاوُلُ مذموم، وكذلك الاستطالة\nيوضَعانِ موضع التكبر. ابن سيده: التَّطاوُلُ\
              \ والاسْتِطالة التَّفَضُّل\nورَفْعُ النفس، واشتقاق الطائل من الطُّول. ويقال للشيء الخَسِيس الدُّون: هو\nبطائل\
              \ الذَّكَرُ والأُنثى في ذلك سواءٌ؛ وأَنشد:\nلقد كَلَّفوني خُطَّة غيرَ طائل\nالجوهري: هذا أَمر لا طائلَ فيه إِذا\
              \ لم يكن فيه غَنَاءٌ ومَزِيّة، يقال\nذلك في التذكير والتأْنيث. ولم يَحْلَ منه بِطائلٍ: لا يُتَكَلَّم به\nإِلاَّ\
              \ في الجَحْد. وفي الحديث: أَنه ذكر رجلاً من أَصحابه قُبِضَ فكُفِّن\nفي كَفَنٍ غير طائلٍ أَي غير رَفيعٍ ولا نفيس،\
              \ وأَصل الطائل النفع\nوالفائدة. وفي حديث ابن مسعود في قتل أَبي جهل: ضَرَبْته بسيف غير طائل أَي غير\nماضٍ ولا\
              \ قاطع كأَنه كان سيفاً دُوناً بين السيوف. والطَّوائل: الأَوتار\nوالذُّحُول، واحدتها طائلة؛ يقال: فلان يَطْلُب\
              \ بني فلان بطائلةٍ أَي\nبوَتْرٍ كأَن له فيهم ثأْراً فهو يطلبه بِدَمِ قتيله. وبيْنَهم طائلةٌ أَي\nعداوة وتِرَةٌ؛\
              \ وقول ذي الرمة يصف ناقته:\nمَوَّارة الضَّبعِ مِثلُ الحَيْدِ حارِكُها،\nكأَنَّها طالةٌ في دَفِّها بَلَق\nقال:\
              \ الطَّالة الأَتان؛ قال أَبو منصور: ولا أَعرفه فلينظر في شعر ذي\nالرمة.\nوالطُّوَّل، بالتشديد: طائر. وطَيِّلَةُ\
              \ الرِّيح: نَيِّحتُها.\nوطُوالة: موضع، وقيل بئر؛ قال الشَّمَّاخ:\nكِلا يَوْمَيْ طُوالةَ وَصْلُ أَرْوى\nظَنُونٌ\
              \ آنَ مُطَّرَحُ الظَّنُون\nقال أَبو منصور: ورأَيت بالصَّمَّان روضة واسعة يقال لها الطَّوِيلة،\nوكان عَرْضُها\
              \ قدرَ مِيلٍ في طُول ثلاثة أَميال، وفيها مَساكٌ لماء السماء\nإِذا امتلأَ شَرِبوا منه الشهرَ والشهرين؛ وقال في\
              \ موضع آخر: تكون ثلاثة\nأَميال في مثلها؛ وأَنشد:\nعادَ قَلْبي من الطَّوِيلة عِيدُ\nوبَنُو الأَطْوَل: بطن."
