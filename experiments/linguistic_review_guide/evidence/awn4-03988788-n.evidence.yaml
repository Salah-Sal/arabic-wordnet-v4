            definitions_text: 'طلن:) طُولُون، بالضمِّ: عَلَمٌ؛ وأَحمدُ بنُ طُولُون، أَميرُ مِصْر صاحِبُ الجامِعِ المَشْهور
              بِهِ، وولدُه أَبو معد عَدْنانُ بنُ أَحمدَ بنِ طُولُون، وُلِدَ بمِصْرَ رَوَى عَن الرَّبيعِ بنِ سُلَيْمان وغيرِهِ،
              ماتَ سَنَة 325، رحِمَه اللهاُ تَعَالَى.'
