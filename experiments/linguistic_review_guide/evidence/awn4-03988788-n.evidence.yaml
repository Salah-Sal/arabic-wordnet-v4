            dict_name_ar: المحكم والمحيط الأعظم لابن سيده الأندلسي
            dict_name_en: Ibn Sīda al-Mursī, Al-Muḥkam wa-l-Muḥīṭ al-Aʿẓam (d. 1066 CE)
            dict_source_type: hawramani
