          - entry_id: 835104
            dictionary_id: 122
            headword: الطِّوال من القرآن
            headword_bare: الطوال من القرآن
            headword_norm: الطوال من القران
            root: طل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'الطِّوال من القرآن: قَسَّموا سُوَر القرآن على أقسام السبع الطوال: أولها البقرة وآخرها براءة،
              والمئونُ: وهي التي تلي الأولى، والمثًاني: وهي التي تلي الثانية، ويليها المفصَّل: سُمّي به لكثرة الفصل فيه بين
              السور بالبسملة، ثم قسَّموا المفصّل إلى طِوال: وهي من الحجرات إلى البروج، وأوساطٍ: وهي من البروج إلى "لَمْ يَكُن"،
              وقِصارٍ: هي من سورة "لم يكن" إلى آخر القرآن راجع الإتقان للسيوطي.'
            translation_en: null
            translation_fr: null
            domain: null
