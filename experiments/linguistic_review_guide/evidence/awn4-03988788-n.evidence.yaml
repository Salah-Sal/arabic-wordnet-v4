            definitions_text: |-
              (طَلَّ) الطَّاءُ وَاللَّامُ يَدُلُّ عَلَى أُصُولٍ ثَلَاثَةٍ: أَحَدُهَا: غَضَاضَةُ الشَّيْءِ وَغَضَارَتُهُ، وَالْآخَرُ: الْإِشْرَافُ، وَالثَّالِثُ: إِبْطَالُ الشَّيْءِ. فَالْأَوَّلُ الطَّلُّ: وَهُوَ أَضْعَفُ الْمَطَرِ، إِنَّمَا سُمِّيَ بِهِ لِأَنَّهُ يُحَسِّنُ الْأَرْضَ. وَلِذَلِكَ تُسَمَّى امْرَأَةُ الرَّجُلِ طَلَّتَهُ.
              قَالَ بَعْضُهُمْ: إِنَّمَا سُمِّيَتْ بِذَلِكَ لِأَنَّهَا غَضَّةٌ فِي عَيْنِهِ [كَأَنَّهَا] طَلُّ. وَمِنَ الْبَابِ فِي مَعْنَى الْقِلَّةِ، وَهُوَ مَحْمُولٌ عَلَى الطَّلِّ، قَوْلُهُمْ: مَا بِالنَّاقَةِ طَلٌّ، أَيْ مَا بِهَا لَبَنٌ، يُرَادُ وَلَا قَلِيلٌ مِنْهُ. وَضُمَّتِ الطَّاءُ فَرْقًا بَيْنَهُ وَبَيْنَ الْمَطَرِ.
              وَالْبَابُ الْآخَرُ: الطَّلَلُ، وَهُوَ مَا شَخَصَ مِنْ آثَارِ الدِّيَارِ. يُقَالُ لِشَخْصِ الرَّجُلِ: طَلَلُهُ. وَمِنْ ذَلِكَ: أَطَلَّ عَلَى الشَّيْءِ، إِذَا أَشْرَفَ. وَطَلَلُ السَّفِينَةِ: جِلَالُهَا، وَالْجَمْعُ أَطْلَالٌ. وَيُقَالُ: تَطَالَلْتُ، إِذَا مَدَدْتَ عُنُقَكَ تَنْظُرُ إِلَى الشَّيْءِ يَبْعُدُ عَنْكَ. قَالَ:
              كَفَى حَزْنًا أَنِّي تَطَالَلْتُ كَيْ أَرَى ... ذُرَى عَلَمَيْ دَمْخٍ فَمَا يُرِيَانِ
              وَأَمَّا إِبْطَالُ الشَّيْءِ فَهُوَ إِطْلَالُ الدِّمَاءِ، وَهُوَ إِبْطَالُهَا، وَذَلِكَ إِذَا لَمْ يَطْلُبْ لَهَا. يُقَالُ: طُلٌّ دَمُهُ فَهُوَ مَطْلُولٌ، وَأُطِلَّ فَهُوَ مُطَلٌّ، إِذَا أُهْدِرَ.
              وَمِمَّا شَذَّ عَنْ هَذِهِ الْأُصُولِ، وَمَا أَدْرِي كَيْفَ صِحَّتُهُ قَوْلُهُمْ: إِنَّ الطِّلَّ الْحَيَّةُ. وَالطَّلَاطِلَةُ: دَاءٌ يَأْخُذُ فِي الصُّلْبِ.
