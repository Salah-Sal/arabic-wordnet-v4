            form: null
            is_partial: 0
            definitions_text: '[طول] الطولُ: خِلاف العرض. وطال الشئ، أي امتد. وطلت، أصله طَوُلْتُ بضم الواو، لأنك تقول طويل،
              فنقلت الضمة إلى الطاء وسقطت الواو لاجتماع الساكنين. ولا يجوز أن تقول منه طلته، لان فعلت لا يتعدى فإن أردت أن
              تعديه قلت طَوَّلتُهُ أو أَطَلْتُهُ. وأمَّا قولك طاوَلَني فلان فطُلْتُهُ، فإنما تعني بذلك كنت أطْوَلَ منه، من
              الطولِ والطَوْلِ جميعاً. وطالَ طِوالُكَ وطِيَلُكَ، أي عُمرك، ويقال غيبتك. قال القطامي: إنَّا محيُّوكَ فاسْلَمْ
              أيُّها الطَلَلُ وإنْ بَليتَ وإنْ طالَتْ بك الطِوَلُ ويروى " الطِيَلُ ". ويقال أيضاً طالَ طَيْلُكَ وطولك، ساكنة الياء
              والواو، وطال طُوَلُكَ بضم الطاء وفتح الواو، وطالَ طَوالُكَ بالفتح، وطِيالُكَ بالكسر. كل ذلك حكاه ابن السكيت.
              قال: فأما الحبل فلم فلم نسمعه إلا بكسر الأول وفتح الثاني. يقال: أَرْخِ للفرس من طِوَلِهِ، وهو الحبل الذي يُطَوَّلُ
              للدابة فتَرعى فيه. قال طرفة: لَعَمْرُكَ إنَّ الموتَ ما أخْطَأَ الفَتى لَكالطِوَلِ المُرْخى وثِنْياه باليَدِ
              وهي الطويلة أيضا. وقوله " ما أخطأ الفتى " أي في إخطائِه الفتى. وقد شدده الراجز للضرورة، فقال: تعرضت لى بمكان
              حل تعرض المهرة في الطول وقد يفعلون مثل ذلك في الشعر كثيرا، ويزيدون في الحرف من بعض حروفه. قال الراجز  قطنة من
              أجود القطن * ويقال أيضاً: طَوِّلْ فرسك، أي أَرْخِ طويلته في المَرعى. والطُوالُ بالضم: الطَويلُ. يقال: طَويلٌ
              وطُوالٌ. فإذا أفرط في الطولِ قيل طوال بالتشديد. والطوال بالكسر: جمع طويل. والطوال بالفتح، من قولك: لا أكلِّمه
              طَوالَ الدهر وطولَ الدهر، بمعنًى. ويقال قلانسُ طيالٌ وطِوالٌ، بمعنًى. والرجالُ الأطاولُ: جمع الأطْوَلِ. والطولى:
              تأنيث الأطْوَلِ، والجمع الطُوَلُ، مثل الكبرى والكبر. والطَويلُ: جنسٌ من العَروضِ. وهي كلمة مولَّدة. وجمل أطوَلُ،
              إذا طالَتْ شفتُه العليا . وطاوَلَني فطُلْتُه، يقال ذلك من الطولِ والطَوْلِ جميعاً. ويقال: هذا أمرٌ لا طائِلَ
              فيه، إذا لم يكن فيه غَناءٌ ومزّية. يقال ذلك في التذكير والتأنيث. ولم يَحْلَ منه بطائلٍ،، لا يتكلم به إلا في
              الجحد. وبينهم طائِلَةٌ، أي عداوة وَتِرَةٌ. والطَوْلُ بالفتح: المَنُّ. يقال منه: طالَ عليه وتَطَوَّلَ عليه، إذا
              امْتَنَّ عليه. وطاوَلْتُهُ في الأمر، أي ماطَلْتُهُ. وأطلت الشئ وأطولت، على النقصان والتمام، بمعنًى. وأنشد سيبويه
              : صَدَدْتِ فأطْوَلْتِ الصُدودَ وقلَّما وِصالٌ على طول الصُدود يَدومُ وأطالَتِ المرأة، إذا ولدت ولدا طوالا. وفي
              الحديث: " إن القصيرة قد تطيل ". وطول له تَطْويلاً، أي أمهله. واسْتطالَ عليه أي تطاوَلَ. يقال: اسْتطالوا عليهم،
              أي قَتَلوا منهم أكثر مما كانوا قَتَلوا. وقد يكون اسْتَطالَ بمعنى طالَ. وتَطَاوَلْتُ مثل تطالَلْتُ. والطُوَّلُ
              بالتشديد: طائرٌ. وطَيِّلَةُ الريح: نيحتها.'
