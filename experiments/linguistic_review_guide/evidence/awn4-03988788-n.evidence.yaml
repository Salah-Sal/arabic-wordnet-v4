          - entry_id: 771893
            dictionary_id: 103
            headword: طلي
            headword_bare: طلي
            headword_norm: طلي
            root: طل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: "طلي: طَلى الشيءَ بالهِنَاءِ وغَيرِهِ طَلْياً: لَطَخَه، وقد جاء في\nالشِّعْرِ طَلَيْته إِيَّاه؛\
              \ قال مِسْكينٌ الدَّارِ مي:\nكأَنّ المُوقِدِينَ بها جِمالٌ،\nطَلاهَا الزَّيْتَ والقَطِرانَ طالِ\nوطَلاَّهُ:\
              \ كطَلاه؛ قال أَبو ذؤيب:\nوسِرْبٍ يُطَلَّى بالعَبِيرِ، كأَنَّه\nدِماءُ ظِباءٍ بالنُّحورِ ذَبِيح\nوقد اطَّلى\
              \ به وتَطَلَّى؛ وروي بيت أَبي ذؤيب:\nوسِرْبٍ تَطَلَّى بالعَبيرِ\nوالطِّلاءُ: الهِناءُ. والطِّلاءُ: القَطِرانُ\
              \ وكلُّ ما طَلَيت به.\nوطَلَيْتُه بالدُّهْنِ وغيرِه طَلْياً، وتَطَلَّيْت به واطَّليتُ به على\nافْتَعَلْت. والطِّلاءُ:\
              \ الشَّرابُ، شُبِّهَ بطِلاءِ الإِبل وهو الهِناءُ.\nوالطّلاءُ: ما طُبخَ من عَصير العِنَبِ حتى ذهَبَ ثُلُثاه،\
              \ وتُسَمِّيه\nالعَجَمُ المَيْبَخْتَج، وبعضُ العرب يسَمِّي الخَمْرَ الطِّلاء؛ يريدُ بذلك\nتحسين اسْمِها إِلا\
              \ أَنها الطِّلاءُ بعَيْنها؛ قال عبيد بنُ الأَبْرصْ\nللمُنْذِرِ حين أَراد قتلَه:\nهي الخَمْرُ يكنُونَها بالطِّلا،\n\
              كما الذِّئبُ يُكْنَى أَبا جَعْدَهْ\nواستشهد به ابن سيده على الطلاءِ خاثِرِ المنَصَّف يُشبه به، وضربه عبيد\n\
              مَثَلاً أَي تُظهِرُ لي الإِكْرامَ وأَنتَ تُرِيدُ قَتْلي، كما أَنَّ\nالذئبَ وإِن كانت كُنْيَتُه حَسَنَةً فإِنَّ\
              \ عملَه ليس بحَسَنٍ، وكذلك\nالخمرُ وإِن سميت طِلاءً وحسُنَ اسمُها فإِن عَمَلَها قبيح؛ وروى ابن\nقُتَيْبة بيتَ\
              \ عبيد:\nهي الخَمْر تُكْنَى الطِّلا،\nوعَرُوضُه، على هذا، تنقص جزءاً، فإِذاً هذه الرواية خطأٌ؛ وقال ابن\nبري:\
              \ وقالوا هي الخَمْرُ؛ وقال أَبو حنيفة أَحمد بن داود الدِّينَوَرِي:\nهكذا يُنْشد هذا البيت على مَرِّ الزمان ونصفُه\
              \ الأَول ينقص جزءاً. وفي حديث\nعليّ، رضي الله عنه: أَنه كان يرزُقُهمُ الطِّلاءَ؛ قال ابن الأَثير:\nهو، بالكسر\
              \ والمدّ، الشرابُ المطبوخُ من عَصير العنَبِ، قال: وهو الرُّبُّ،\nوأَصله القَطِرانُ الخاثِرُ الذي تُطْلى به الإِبل؛\
              \ ومنه الحديث: إِنّ\nأَوَّلَ ما يُكْفَأُ الإِسلامُ كما يُكفَأُ الإِناءُ في شرابٍ يقالُ له\nالطِّلاءُ؛ قال هذا\
              \ نحو الحديث الآخر: سيَشْرَبُ ناسٌ من أُمَّتي الخَمْرَ\nيُسَمُّونها بغير اسمها؛ يريدُ أَنهم يَشْرَبون النَّبيذَ\
              \ المُسكرَ\nالمطبوخَ ويسمونه طِلاءً تَحرُّجاً من أَن يسموه خمراً، فأَما الذي في حديث\nعليٍّ، رضي الله عنه، فليس\
              \ من الخمر في شيء وإنما هو الرُّبُّ الحلالُ؛\nوقال اللحياني: الطَّلاءُ مُذكَّرٌ لا غَيرُ.\nوناقة طَليْاءُ، ممدودٌ:\
              \ مَطْلِيَّة. والطُّلْية: صوفة تُطْلى بها\nالإبل. ويقال: فلان ما يُساوي طُلْية، وهي الصوفة التي تُطْلى بها الجَرْبى،\n\
              وهي الرِّبْذةُ أَيضاً؛ قاله ابن الأعرابي، وقال أَبو طالب: ما يُساوي\nطُلْيَةً أَي الخَيطَ الذي يُشَدُّ في رِجلِ\
              \ الجَدْي ما دام صغيراً، وقيل:\nالطُّلْيةُ خِرْقة العارك، وقيل: هي الثَّملَةُ التي يُهنَأُ بها الجَربُ.\nقال\
              \ ابن بري: وقول العامة لا يُساوي طُليَةً غَلَط إِنما هو طِلْوة،\nوالطِّلوةُ قطعَة حَبْلٍ.\nوالطَّلى: المَطْلِيُّ\
              \ بالقَطِران. وطَلَيْتُ البَعيرَ أَطْلِيه\nطَلْياَ، والطِّلاءُ الاسم.\nوالطَّلِيُّ: الصغير من أَولادِ الغَنم،\
              \ وإنما سمي طَلِيّاً لأنه\nيُْطلَى أَي تُشَدّ رجله بخيطٍ إلى وَتَدٍ أَياماً، واسمُ ما يُشَّدُ به\nالطَّلِي.\
              \ والطِّلاءُ: الحبلُ الذي يُشَدَّ به رِجْلُ الطَّلى إلى وتد.\nوطَلَوْتُ الطَّلَى: حَبَسْته. والطِّلْوُ والطِّلوة:\
              \ الخَيْط الذي يُشَدُّ به\nرجل الطَّلى إلى الوتِدِ. والطَّلْيُ والطُّليَة والطِّليَة؛ قال\nاللحياني: هو الخَيْطُ\
              \ الذي يُشَدّ في رِجْل الجَدْي ما دام صغيراً، فإذا كَبِرَ\nرُبِقَ والزَّبْقُ في العُنْقِ. وقد طَلَيْت الطَّلى\
              \ أَي شَدَدْتُه.وحكى\nابن بري عن ابن دُرَيْد قال: الطَّلْوُ والطَّلَى بمعنىً. والطِّلْوَة:\nقِطعة خَيْطٍ. وقال\
              \ ابن حَمْزة: الطِّلِيُّ المَرْبوطُ في طُلْيَتِه لا\nفي رِجْلَيْه. والطُّلْيَة: صَفْحَة العُنُقِ، ويقال الطُّلاةُ\
              \ أَيضاً؛\nقال: ويُقَوِّي أَن الطَّلِيَّ المربوطُ في عُنُقه قول ابن السكيت: رَبَقَ\nالبَهْمَ يَرْبُقُها إذا\
              \ جَعَلَ رُؤوسَها في عُرَى حَبْلٍ. ويقال: اطْلِ\nسَخْلَتَك أَي ارْبُقها. وقال الأَصمعي: الطَّلِيُّ والطَّلَى\
              \ والطَّلوُ\nبمعنىً. والطُّلْيَة أَيضاً: خِرْقة العرِك، وقد طَلَيْته. قال الفارسي:\nالطَّلِيُّ صفةٌ غالبةٌ كسَّروه\
              \ تكسير الأَسماء فقالوا طُلْيانٌ، كقولهم\nللجَدْولَ سَريٌّ وسُرْيانٌ. ويقال: طَلوتُ الطَّلَى وطَلَيْته إذا\n\
              رَبَطْته برِجْله وحَبَسْته. وطَلَيْتُ الشيءَ: حَبَسْته، فهو طَلِيٌّ\nومَطْلِيٌّ. وطَلَيْت الرجُلَ طَلْياً فهو\
              \ طَلِيٌّ ومَطلِيٌّ: حَبَسْته.\nوالطَّلَى والطَّلَيانُ والطَّلَوانُ: بياضٌ يعلُو اللِّسانَ من مَرَض أَو عطش؛\n\
              قال:\nلقَدْ تَرَكَتْني ناقَتي بتَنُوفَةٍ،\nلِسانيَ مَعْقُولٌ من الطَّلَيانِ\nوالطَّلِيُّ والطِّلْيانُ: القَلَح\
              \ في الأَسْنانِ، وقد طَليَ فُوه فهو\nيَطْلَى طَلىً، والكلمة واوية ويائيّة. وبأَسْنانِه طَلِيٌّ وطِلْيانٌ،\n\
              مثلُ صبيٍّ وصِبْيانٍ،أَي قَلَحٌ. وقد طَلِيَ فَمه، بالكسر، يَطْلَى طَلىً\nإذا يَبِسَ رِيقُه من العَطَشِ.\nوالطُّلاوَةُ:\
              \ الرِّيقُ الذي يَجِفُّ على الأَسْنانِ من الجُوع، وهو\nالطَّلَوانُ. الكلابي: الطِّلْيانُ ليس بالفَتْح، يقال:\
              \ طَلِيَ فَمُ\nالإِنسانِ إِذا عَطِشَ وبقِيَتْ رِيقة ثَقِيلَةٌ في فَمِه، وربما قيل كان\nالطَّلَى من جَهْدٍ يُصيبُ\
              \ الإِنسانَ من غير عَطَشٍ، وطَلِيَ لسانُه إِذا\nثقُلَ، مأْخوذٌ من طَلَى البَهْمَ إِذا أَوْثقَه. والطَّلاَ والطُّلاوَةُ\n\
              والطِّلاوة والطَّلَوان والطُّلْوانُ: الرِّيقُ يَتَخَثَّر ويَعْصِبُ بالفَمِ\nمن عطشٍ أَو مَرَضٍ، وقيل: الطُّلْوانُ،\
              \ بضم الطاء، الرِّيقُ يَجِفُّ\nعلى الأَسنان، لا جَمْع له؛ وقال اللحياني: في فَمِه طُلاوَةٌ أَي\nبَقِيَّةٌ من\
              \ طَعامٍ. وطَلاوة الكلإِ: القليل منه. والطُّلايَة والطُّلاوة:\nدُواية اللَّبَن. والطُّلاوة: الجِلْدَة الرَّقِيقَة\
              \ فَوْقَ اللبنِ أَو الدمِ.\nوالطُّلاوَة: ما يُطْلى به الشيءُ، وقياسُه طُلايَة لأَنه من طَلَيْت،\nفدَخَلَت الواو\
              \ هنا على الياء كما حكاه الأَحْمَر عن العَرَب من قولهم\nإنَّ عندك لأَشاوِيَّ.\nوالطَّلَى: الصغيرُ من كلِّ شيءٍ،\
              \ وقيل: الطَّلى هو الولد الصغيرُ من\nكلِّ شيءٍ؛ وشبه العجَّاج رَمادَ المَوْقِد بَينَ الأَثافي بالطَّلَى بين\n\
              أُمَّهاتِه فقال:\nطَلَى الرّمادِ اسْتُرْئِمَ الطَّلِيُّ\nأَرادَ: اسْتُرْئِمَهُ؛ قال أَبو الهيثم: هذا مَثَل جعلَ\
              \ الرَّمادُ\nكالولد لثلاثةِ أَيْنُقٍ، وهي الأَثافي عَطَفْنَ عليه؛ يقول: كأَنَّما\nالرَّمادُ ولدٌ صغيرٌ عَطَفَتْ\
              \ عليه ثلاثة أَيْنُقٍ. الجوهري: الطَّلا الولد من\nذواتِ الظِّلْفِ والخُفِّ، والجمعُ أَطلاءٌ؛ وأَنشد الأَصمعي\
              \ لزهير:\nبها العِينُ والآرامُ يَمْشِينَ خِلْفَةَ،\nوأَطْلاؤُها يَنْهَضْنَ من كلِّ مَجْثَمِ\nابن سيده: والطَّلْوُ\
              \ والطَّلا الصغيرُ من كلِّ شيءٍ، وقيل: الطَّلا\nولَدُ الظَّبْية ساعة تَضَعهُ، وجمعه طِلْوانٌ، وهو طَلاَئم خِشْفٌ،\
              \ وقيل:\nالطَّلا من أَولادِ الناسِ والبَهائمِ والوَحْشِ من حينِ يولدُ إِلى أَن\nيَتَشدّدَ. وامرأَة مُطْلِيَةٌ:\
              \ ذاتُ طَلىً. وفي حديثه، صلى الله عليه\nوسلم: لولا ما يَأْتِينَ لأَزواجِهِنَّ دَخلَ مُطْلِياتُهُنّ الجنة، والجمع\n\
              أَطلاءٌ وطُلِيٌّ وطُلْيانٌ وطِلْيانٌ؛ واستعار بعض الرُّجَّاز الأَطْلاء\nلفَسيلِ النخل فقال:\nدُهْما كأَنَّ الليلَ\
              \ في زُهائِها،\nلا تَرْهَبُ الذِّئبُ على أَطْلائِها\nيقول: إِن أَولادَها إنما هي فَسِيلٌ، فهي لا تَرْهَب الذئب،\
              \ لذلك فإن\nالذَّئاب لا تأكلُ الفَسيلَ. الفراء: اطْلُ طَلِيَّكَ، والجمع\nالطُّلْيانُ، وطَلَوْته، وهو الطَّلا،\
              \ مقصورٌ، يعني ارْبطْه برِجلِه.\nوالطِّلى: اللَّذَّةُ؛ قال أَبو صَخْر الهذلي:\nكما تُثَنِّي حُمَيّا الكأْسِ\
              \ شارِبَها،\nلم يَقْضِ منها طِلاهُ بعد إِنْفادِ\nوقضى ابن سيده على الطِّلى اللذَّة بالياءِ، وإِنْ لم يُشْتَقَّ\
              \ كما قال\nلكثرة ط ل ي وقلة ط ل و.\nوتَطَلَّى فلانٌ إِذا لَزِمَ اللَّهْوَ والطَّرَبَ. ويقال: قَضَى فلانٌ\nطَلاهُ\
              \ من حاجتِه أَي هواه.\nوالطُّلاةُ: هي العُنُق، والجمع طُلىً مِثلُ تُقاةٍ وتُقىً، وبعضهم يقول\nطُلْوةٌ وطُلىً.\
              \ والطُّلى: الأَعْناق، وقيل: هي أُصُولُ الأَعناقِ،\nوقيل: هي ما عَرُضَ من أَسفل الخُشَشاءِ، واحدتُها طُلْية.\
              \ غيره: الطُّلى جمع\nطُلْيَةٍ، وهي صَفْحة العُنُق. وقال سيبويه: قال أَبو الخطاب طُلاةٌ وهو\nمن باب رُطَبَة ورُطَبٍ\
              \ لا من باب تَمْرَةٍ وتَمْرٍ، فافهم؛وأنشد غيرُه\nقولَ الأَعْشى:\nمتى تُسْقَ من أَنْيابِها بعد هَجْعةٍ\nمن الليلِ\
              \ شِرْباً، حين مالت طُلاتُها\nقال سيبويه: ولا نَظيرَ له إلا حَرْفان: حُكاةٌ وحُكىً، وهو ضَرْبٌ من\nالعَظاء،\
              \ وقيل: هي دابة تُشْبه العظاء، ،ومُهاةٌ ومُهىً، وهو ماءُ الفحل\nفي رَحِم الناقةِ، واحتج الأصمعي على قوله واحدتُها\
              \ طُلْية بقول ذي\nالرمة:أَضَلَّه راعِيا كَلْبِيَّةٍ صَدَرا\nعن مُطْلِبِ، وطُلى الأعْناقِ تضْطَرِبُ\nقال ابن\
              \ بري: وهذا ليس فيه حجة لأنه يجوز أن يكون جمعَ طَلاةٍ كمَهاةٍ\nومَهىً.\nوأَطْلى الرجلُ والبعيرُ إطلاءً، فهو\
              \ مُطْلٍ: وذلك إذا مالت عُنُقُه\nللموت أَو لغيره؛ قال:\nوسائلةٍ تُسائلُ عن أَبيها،\nفقلت لها: وَقَعْتِ على الخَبيرِ\n\
              تَرَكْتُ أَباكِ قد أَطْلى، ومالت\nعليه القَشْعَمان مِن النُّسورِ\nويروى: مثالَ الثُّعْلُبان. وفي الحديث: ما\
              \ أَطْلى نَبيٌّ قَطُّ أَي ما\nمالَ إلى هواهُ، وأَصله من مَيل الطُّلا، وهي الأَعْناقُ، إلى أَحدِ\nالشِّقَّيْنِ،\n\
              والطُّلْوة: لغةٌ في الطُّلْية التي هي عَرْضُ العُنُق. والطُّلْية:\nبياضُ الصُّبْحِ والنُّوَّار. ورجل طَلىً،\
              \ مقصورٌ إذا كان شديد المَرَضِ مثل\nعَمىً، لا يُثَنىَّى ولا يُجْمَع، وربما قيل رَجُلانِ طَلَيان وعَمَيان\nورِجالٌ\
              \ أَطْلاءٌ وأَعْماءٌ؛ قال الشاعر:\nأفاطِمَ، فاسْتَحْيي طَليً وتَحَرَّجِي\nمُصاباً، متى يَلْجَجْ به الشَّرُّ\
              \ يَلْجَجِ\nابن السكيت: طَلَّيْتُ فلاناً تَطلِيَةً إذا مَرَّضتْه وقمت في مَرَضِه\nعليه.\nوالطُّلاءُ مثال المُكَّاء:\
              \ الدَّمُ؛ يقال: تَرَكْته يَتَشَحَّط في\nطُلاَّئِه أَي يضطرِب في دَمِه مقتولاً، وقال أَبو سعيد: الطُّلاَّءُ\
              \ شيءٌ\nيَخْرُجُ بعد سُؤبُوبِ الدَّمِ يُخالِفُ لَونَ الدَّمِ، وذلك عند خروج\nالنَّفْسِ من الذَّبيحِ وهو الدَّم\
              \ الذي يُطْلى به. وقال ابن بزرج: يقال هو\nأَبغضُ إِليَّ من الطَّلِيّا والمُهْلِ، وزَعم أَن الطَّلِيَّا قُرْحة\n\
              تَخْرُج في جَنْبِ الإنسان شَبِيهَة بالقُوبَاء، فيقال للرجل إنما هي\nقُوبَاء وليستْ بطَلِيَّا، يُهَوّنُ بذلك\
              \ عليه، وقيل: الطَّلِيَّا\nالجَرَب.قال أَبو منصور: وأَما الطَّلْياءُ فهي الثَّمَلة، ممدودة. وقال ابن\nالسكيت\
              \ في قولهم هو أَهْون عليه من طَلْية: هي الرِّبذَة وهي الثَّمَلة؛\nقاله بفتح الطاء. أبو سعيد: أَمْرٌ مَطْليٌّ\
              \ أَي مُشْكِل مُظْلِمٌ كأَنه قد\nطُليَ بما لبَّسَه؛ وأَنشد ابن السكيت:\nشامِذاً، تَتَّقِي المُبِسَّ على المُرْ\n\
              يَةِ، كَرْهاً، بالصِّرْفِ ذي الطُّلاَّءِ\nقال: الطُّلاَّءُ الدَّمُ في هذا البيت، قال: وهؤلاء قوم يريدون تسكِين\n\
              حَرْبٍ \n(* قوله «يريدون تسكين حرب إلخ» تقدم لنا في مادة شمذ: قال أبو\nزبيد يصف حرباء، والصواب يصف حرباً.) وهي\
              \ تَسْتَعْصِي عليهم وتَزْبِنُهُم\nلما هُريقَ فيها منَ الدِّماءِ، وأَراد بالصِّرْفِ الدمَ الخالِص.\nوالطَّلى:\
              \ الشَّخْصُ، يقال: إِنه لَجَمِيلُ الطَّلى؛ وأَنشد أَبو عمرو:\nوخَدٍّ كَمَتْنِ الصُّلَّبيِّ جَلَوْتُه،\nجَمِيلِ\
              \ الطَّلى، مُسْتَشْرِبِ اللَّوْنِ أَكْحَلِ\nابن سيده: الطَّلاوة والطُّلاوة الحُسْنُ والبَهْجَةُ والقَبولُ في\n\
              النَّامي وغير النامي، وحديثٌ عليه طُلاوةٌ \n(* قوله « طلاوة» هي مثلثة كما في\nالقاموس.) وعلى كلامِهِ طُلاوةٌ\
              \ على المَثَل، ويجوز طَلاوةٌ. ويقال: ما\nعلى وجْهه حَلاوةٌ ولا طَلاوةٌ، وما عليه طُلاوةٌ، والضم اللغةُ\nالجيِّدة،\
              \ وهو الأَفْصَح.\nوقال ابن الأَعرابي: ما على كلامه طَلاوةٌ وحَلاوة، بالفتح، قال: ولا\nأَقول طُلاوة بالضم إِلا\
              \ للشيءِ يُطْلى به، وقال أَبو عمرو: طَلاوة وطُلاوة\nوطِلاوة. وفي قِصَّة الوَلِيد بن المُغِيرة: إِنَّ له لحَلاوةً\
              \ وإِنَّ\nعليه لَطُلاوةً أَي رَوْنَقاً وحُسْناً، قال: وقد تفتح الطَّاءُ.\nوالطُّلاوة: السِّحْر \n(* قوله« والطلاوة\
              \ السحر» في القاموس أنه مثلث.)\nابن الأَعرابي: طلّى إِذا شتَم شَتْماً قَبيحاً والطِّلاءُ: الشَّتْمُ.\nوطَلَّيْتُه\
              \ أَي شَتَمْته. أَبو عمرو: وليلٌ طالٍ أَي مُظْلِمٌ كأَنه\nطَلى الشُّخُوصَ فَغَطَّاها؛ قال ابن مقبل:\nأَلا طَرَقَتْنا\
              \ بالمَدِينَة، بَعْدَما\nطَلى اللَّيْلُ أَذْنابَ النِّجادِ، فأَظْلَمَا\nأَي غَشَّاها كما يُطْلى البَعِيرُ بالقَطِرانِ.\n\
              والمِطلاءُ: مَسِيلٌ ضَيِّقٌ من الأَرض، يُمَدُّ ويُقْصَر، وقيل: هي\nأَرضٌ سَهْلةٌ ليِّنةٌ تُنْبِتُ العِضَاهَ؛\
              \ وقد وَهِمَ أَبو حنيفة حين أَنشد\nبيت هِمْيان:\nورُغُلَ المِطْلى به لَواهِجا\nوذلك أَنه قال: المطلاءِ ممدود\
              \ لا غير، وإِنما قَصَرَه الراجزُ ضَرورة،\nوليس هِمْيانُ وحْدَه قَصَرَها. قال الفارسيُّ: إِن أَبا زياد الكِلابيَّ\n\
              ذكر دَارَ أَبي بَكْرِ بن كلاب فقال تَصُبُّ في مَذانِبَ ونَواصِرَ، وهي\nمِطْلىً؛ كذلك قالها بالقَصْر. أَبو عبيد:\
              \ المَطالي الأَرض السَّهْلة\nاللَّيِّنَة تُنْبِتُ العِضاهَ، واحدَتُها مِطْلاء على وزن مِفْعال. ويقال:\nالمَطالي\
              \ المَواضِعُ التي تَغْذُو فيها الوَحْش أَطلاءَها. وحكى ابن بري\nعن عليّ بن حَمْزَة: المَطالي رَوْضاتٌ، واحدها\
              \ مِطْلى، بالقَصْر لا\nغيرُ، وأَما المِطْلاءُ لِمَا انْخَفَض من الأَرض واتَّسَعَ فَيُمَدُّ\nويُقْصَرُ، والقًصْرُ\
              \ فيه أَكثر، وجمعهُ مَطالٍ؛ قال زَبَّانُ بنُ سَيّارٍ\nالفزاري:\nرَحَلْتُ إِليكَ من جَنَفاءِ، حَتَّى\nأَنَخْتُ\
              \ فِناءَ بَيْتِك بالمَطالي\nوقال ابن السيرافي: الواحدة مِطْلاءٌ، بالمدّ، وهي أَرضٌ سَهْلة.\nوالمُطَلِّي: هو\
              \ المُغَنِّي.\nوالطِّلْوُ: الذِّئْب. والطِّلْوُ: القانصُ اللطيفُ الجِسْمِ، شُبِّه\nبالذِّئبِ؛ قال الطرِمَّاح:\n\
              صادَفَتْ طِلْواً طَويلَ القَرَا،\nحافِظَ العَينِ قَلِيلَ السَّأَمْ\n(* قوله« طويل القرا» في التكملة: طويل الطوى.)"
