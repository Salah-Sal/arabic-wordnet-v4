              text: |-
                [ط ل ي] طَلَي الشَّيْءَ بالهِناءِ ونَحوِه طَلْياً: لَطَخَه، وقد جاء في الشِّعر طَلَيْتُه إيّاه، قَالَ مِسْكِينٌ الدّارِمِيُّ: ... كأَنَّ المُوِقِدينَ بها جِمالٌ ... طَلاها الزَّيتَ والقِطرِانَ طَالِي) وطَلاّه كطلاَه، قَالَ أبو ذُؤَيْبٍ:
                (وسِرْبٍ يُطَلَّي بالعَبِيرِ كأَنَّه ... دِماءً طِباءِ بالنُحورِ ذَبِيحُ)
                وقَدِ أطَّلَي به وتَطَلَّي، ويُرْوَى بَيتُ أَبي ذُؤَيب: ((وسِرْبِ تَطَلَّي بالعَبِيرِ. .)) والطِّلاءُ: الهِناءُ. والطِّلاءُ: خَائِرُ المُنًصَّفِ، به شُبِّه، قَالَ عَبِيدُ بنُ الأَبرصِ:
                (هي الخَمرُ يَكنْوُنَها بالطِّلاءِ ... كما الذِّئبُ يَكْنَي أَبا جَعْدَه)
                ورَواه ابنُ قُتَيْبَةَ: ((تُكْنَي الطِّلاءَ)) وعَرُوضُه على هذا تَنْقُصُ جُزْءاً، فإِذَن هذه الرِّوايةُ خَطَأُ. وقَالَ اللِّحيانِيُّ: الطِّلاْءُ مُذَكَّرٌ لا غَيرُ. وناقَةٌ طَلْياءُ، مَمْدودٌ: مَطْلِيَّةٌ. والطيلة صوفه [تطلى] بها الابل والطَّلاَ والطَّلَيان: بَياضٌ يَعلُو اللِّسانَ من مَرَضٍ أَو عَطِشٍ، قال:
                (لقد تَرَكتْنِي ناقَتِي بتَنُوفَةٍ ... لِساني مَعْقُولٌ من الطَّلَيانِ)
                والطَّلِيُّ والطَّلَيانُ: القَلَحُ في الأَسْنانِ، وقد طَلِي فُوه طَلِي، وهذه الكَلِمةً مُشْتَرِكَةٌ بين الياءِ والوَاوِ. والطٌّ لايَةُ: دُوايَةُ اللَّبَنِ، عن كُراعِ. والطَّلَي: الصَّغِيرُ من وَلَدِ كُلِّ شَيءٍ، حتَّى شَبَّه العَجَّاجُ رَمَادَ المَوْقِدِ بينَ الأَثافِيّ بالطَّلَي بين أُمَّهاتِه، فَقَالَ:
                (طَلَي الرَّمادِ اسْتُرئِمَ الطَّلِيُّ ... )
                أَرادَ اسْتُرِئمَه. وقِيلَ: الطَّلَي من أَولادِ النّاسِ والبَهائمِ والوَحْشِ: من حِينُ يُولَدُ إلى أَنْ يَشْتَدَّ، والجَمْعُ: أَطلاءٌ، وطُلِيٌّ وطِلْيانٌ. واسْتَِعارَِ بَعْضُ الرُّجَّازِ الأَطلاءَ لفَسِيلِ النَّخْلِ، فَقالَ:
                (دُهُماً كَأنَّ اللَّيلَ في زُهائِها ... )
                (لا تَرْهَبُ الذِّئبَ على أَطْلائِها ... )
                يَقُولُ: إنَّ أَولادَها إنَّما هي فَسِيلٌ، فهي لا تَرْهَبٌ الذِّئابَ عليها لذلك، لأَنَّ الذِّئابَ لا تَأْكُلُ الفَسِيلَ. والطَّلِيُّ: الصَّغِيرُ من أَولادِ الغَنَم تُشَدُّ رِجْلُه بخَيْطٍ إلى وَتِدٍ أَياماً، واسْمُ ما يُشَدُّ به: الطِّلاءُ، والطَّلْيُ، والطُّلْيةُ والطِّلْيةُ، قَالَ اللِّحْيانِيُّ: هو الخِيطُ الذي يُشَدُّ في رِجلِ الجَدْي ما دَامَ صَغِيراً، فإذا كَبِرَ رُبِقُ، والرِّبْقُ في العُنُقِ. قال: والطُّلْيةُ أيضاً: خِرْقَةُ العارِكِ، وقد طَلَيْتُه. قَالَ الفارِسيُّ: الطَّلِيُّ: صِفَةٌ غالِبةٌ، كَسَّرُوه تكْسِيرَ الأَسماءِ، فَقالُوا: طُلْيانٌ، كَقَوْلِهم: للجَدْول: سَرِيٌّ وسُرْيانٌ. وطَلَيْتُ الرَّجُلَ طَلْياً، فهو طَلِيٌّ، ومَطْلِيٌّ: حَبَسْتُه. والطَّلي: اللَّذَّة، وقال [أبو صَخْرٍ] الهُذَلِيُّ:
                (كما تَمنَّي حُمَيَّا الكَأسِ شارِبُها ... لم يُقْضِ منها طَلاَهُ بعدَ إِنْفادِ)
                وإنَّما قَضَيْنا على الطَّلَي الذي هو اللَّذَّةُ بالياءِ وإنْ لم يُشْتَقَّ لكَثْرَةِ (ط ل ي) وقِلَّةِ (ط ل و) . والطُّلَي: الأَعناقُ، وقِيلَ: هي أُصولُ الأَعناقِ، وقِيلَ: هي ما عَرُضَ من أَسْفَلِ الخُشَشاءِ، واحِدتُها: طُلْيَةٌ، وقَالَ شِيبَويِه: قَال أَبو الخَطَّابِ: واحِدتُها طُلاةٌ، وقَالَ: هو من بابِ رُطَبةٍ ورُطِبٍ، لا من بابِ تَمْرٍ ة وتَمْرٍ، فافْهَمْ، وأَنْشَدَ غيرُه قُوْلَ الأَعشَي:
                (مَتي تُسْقَ من أنيابِها بعد هَجْعَةٍ ... من اللَّيلِ شِرْباً حين مالَتْ طُلاتُها)
                قَالَ سِيبَويِه: ولا نَظيرَ لها إلاّ حرفانِ: حُكاةٌ وحُكًي، وهو ضَرْبٌ من العَظاءِ، وقِيلَ: دابَّةٌ تُشْبِه العَظاءَ، ومُهاةٌ ومُهًي، وهو ماءُ الفَحلِ في رَحِمِ الناقِةِ. وأَطْلَي الرَّجُلُ والبَعيرُ: مالَتْ عُنُقهِ للمِوْتِ، أَو غَيرِه، قالَ:
                (تَركْتُ أَباكَ قد أَطْلَي ومالِتْ ... عليه القَشْعمانِ من النُّسُورِ)
                والمِطْلاءُ: مُسيلٌ ضَيِّقٌ من الأَرضِ، يُمَدُّ ويُقْصَرٌ، وقِيلَ: هي أَرْضٌ سَهْلَةٌ لَيِّنةٌ تُنْبِتُ العِضاهَ، وقد وهَمِ أَبو حَنِيفَة حينَ أَنْشَدَ بَيْتَ هِميانَ:
                (ورُغُلَ المِطْلَي به الَواهِجَا ... )
                وذلك أَنَّه قَالَ: المِطْلاءُ مُمدودٌ لا غَيرُ، وإنَّما قَصَرَه الرّاجِزُ ضَرورةً، وليس هِميانُ وَحْدَه قَصَرَها، حَكَي الفارِسِيُّ أنَّ أبا زيادٍ الكِلابِيَّ ذَكَرَ دارَ بني أَبي بكرِ بنِ كِلابٍ فَقالَ: تَصُبُّ [في] مَذانِبَ ونَواصِرَ، وهي مِطْلًي، كذا قَالَها بالقصْرِ ,
