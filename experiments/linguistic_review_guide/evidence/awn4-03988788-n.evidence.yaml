                أَيْ يَسْتَطِيلَان عَلَى عَدوّه ويتَبارَيان فِي ذَلِكَ ليكونَ كُلُّ واحدٍ منهُمَا أبْلَغ فِي نُصْرَته مِنْ
                صَاحِبه، فشُبّه ذَلِكَ التَّبَارِي والتَّغَالب بتَطَاوُلِ الفَحْلَين عَلَى الْإِبِلِ، يَذُبُّ كلُّ وَاحِدٍ
                منهُما الفُحُولَ عَنْ إِبِلِهِ ليَظْهر أيُّهما أكثرُ ذَبًّا.(هـ) وَمِنْهُ حَدِيثُ عُثْمَانَ «فتَفرَّق الناسُ
                فِرَقاً ثَلَاثًا: فصامِتٌ صَمْتُهُ أنفذُ مِنْ طَوْلِ غَيره» ويُروى «مِنْ صَوْل غَيْرِهِ» أَيْ إمْسَاكه أشدُّ
                مِنْ تَطَاوُلِ غَيره. يُقَالُ: طَالَ عليه، واسْتَطَالَ، وتَطَاوَلَ، إذا علاوه وتَرْفَّعَ عَلَيْهِ.(س) وَمِنْهُ
                الْحَدِيثُ «أرْبَى الرِّبا الاسْتِطَالَة فِي عِرْضِ النَّاسِ» أَيِ اسْتِحْقَارُهُمْ، وَالتَّرَفُّعُ عَلَيْهِمْ،
                والوَقيعةُ فِيهِمْ.(س) وَفِي حَدِيثِ الْخَيْلِ «ورجلٌ طَوَّلَ لَهَا فِي مَرْج فقَطَعَتْ طِوَلَها» .(هـ) وَفِي
                حَدِيثٍ آخَرَ «فأَطَالَ لَهَا فقَطعت طِيَلَها» الطِّوَل والطِّيَل بِالْكَسْرِ: الحبْل الطَّوِيل يُشَدُّ أَحَدُ
                طَرَفَيه فِي وتِد أَوْ غَيره والطَّرَف الْآخَرُ فِي يَد الفَرس ليَدُورَ فِيهِ ويَرْعَى وَلَا يَذْهَب لوجْهِه.
                وطَوَّلَ وأَطَالَ بِمَعْنًى: أَيْ شدّها في الحبل. وَمِنْهُ الْحَدِيثُ «لِطِوَلِ الفَرسِ حِمًى» أَيْ لصَاحِب
                الفَرَس أَنْ يَحْمِيَ الموضعَ الَّذِي يَدُورُ فِيهِ فَرَسُه المشدُودُ فِي الطِّوَل إِذَا كانَ مبُاحا لاَ مالِكَ
                لَهُ.وَفِيهِ «أَنَّهُ ذَكَرَ رجُلا مِنْ أصْحابه قُبِض فكُفِّن فِي كَفَنٍ غيِر طَائِل» أَيْ غَيرِ رَفِيع وَلَا
                نَفِيس. وأصلُ الطَّائِل: النَّفْع والفائِدة.(س) وَمِنْهُ حَدِيثُ ابْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ فِي
                قَتْل أَبِي جَهْلٍ «ضَرْبْتُه بسَيفٍ غَيرِ طَائِل» أَيْ غَيْرِ ماضٍ وَلَا قَاطِع، كَأَنَّهُ كَانَ سَيفاً دُوناً
                بينَ السُّيوف.'
