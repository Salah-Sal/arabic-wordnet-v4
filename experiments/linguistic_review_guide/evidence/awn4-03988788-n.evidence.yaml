          - entry_id: 373935
            dictionary_id: 52
            headword: مستطيل مرئي
            headword_bare: مستطيل مرئي
            headword_norm: مستطيل مرئي
            root: طول
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: هو المُستطيل الذي ينتج عن عملية [قياس المحاور وزوايا العجل](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=89626)،
              حيث يجب وضع عاكس المسار في الزاوية القائمة بالنسبة للخط الأوسط للسيارة. ويحدث ذلك عندما يتم توجيه شعاع الضوء
              لكلا مسقاطي الضوء الهالوجينيين إلى مرآة عاكس المسار، بحيث ينعكس على مُدرّج مسقاط الضوء. عندئذ يجب تحريك عواكس
              المسار إلى أن تظهر قيم مُتساوية على مُدرّجات مساقط الضوء. بذلك يكون قد تم ضبط المُستطيل المرئي. والقيمة المُضافة
              من اليسار إلى اليمين تُعبّر في الوقت نفسه عن المسار الإجمالي بدرجات الزاوية.
            translation_en: optical rectangle
            translation_fr: rectangle optique [m.]
