            definitions_text: |-
              [ط ول] الطُّولُ: نَقِيضُ القِصَرِ في النّاسِ وغَيرِهم من الحَيَوانِ والمَواتِ. طالَ يَطُولُ طُولاً، فهو طَوِيلٌ، وطُوالٌ، قال النَّحْوِيّونَ: أًصلُ طَالَ فَعُلَ، اسْتِدْلالاً بالاسمِ منه؛ إِذْ جاءَ على فَعِيلٍ، نَحْوَ طَوِيلٍ، حَمْلاً على شَرُفَ فهو شرِيفٌ، وكَرْمَ فهو كَرِيمٌ، وجَمْعُهما طِوِالٌ، قَالَ سِيبَويه: صَحَّّتِ الواوَ في طِوالِ لصحتَّها في طَوِيلٍ، فصارَ طِوالٌ من طَوِيلٍ، كجِوارٍ من جاوَرْتُ، قَالَ: ووافَقَ الذين قالُوا: فَعِيلٌ الّذِينَ قالوا: فَعالٌ؛ لأَنَّهما أُخْتانِ، فجمَعُوه جَمْعَه. وحكَي اللُّغَويَّون طيالٌ، ولا يُوجِبُه القِياسُ؛ لأَنَّ الواوَ قد صَحَّتْ في الواحِد، فحَكْمُها أَن تَصحَِّ في الجَمعِ، قَالَ ابنُ جِنِّي: لم تُقْلَبْ إِلاّ في بَيْتَ شاذٍّ، وهو قَوْلُه - فيما أَنْشَدنَاه أبو عَليٍّ، وذَكَرَ أَنَّ أبا عُثْمانَ أَنْشَدَه _:
              (تَبيَّنَ لي أَنَّ القَماءَةَ ذِلَّةُ ... وأَنَّ أَشِدَّاءَ الرِّجالِ طِيالُها)
              والأُنْثَى طَوِيلَةُ، وطُوالَةٌ، والجُمعِ كالجمع، ولا يَمتَنِعُ شيءٌ من ذلك من التَّسليمِ. والطَّوِيلُ من الشِّعرِ سُمِّيَ بذلك لأَنَّه أَطْولُ الشِّعْر كُلِّه، وذلك أَنَّ أًضلَه ثَمانِيةٌ وأَرْبَعُونَ حَرْفاً، وأكثُر حُروفِ الشِّعْرِ من غِيرِ دائرِته اثْنانِ وأَرْبَعونَ حَرْفاً، وقالَ أَبو إسحاقَ: سُمِّيَ، طَوِيلاً لأَنَّه أَطولُ الأَعارِيضِ الثّلاُِثة، الطَّوِيلِ والمَدِيدِ والبَسِيطِ، وأكثُرها حُرُوفاً، ولأنَّ أَوتادَة مُبتَداُ بها، فالطولُ لمُتٌ قَدِّمِ أَجْزائِه لازِمٌ أَبداً؛ لأنَّ أَوائلَ أَجْزائِه أَوتادٌ، والدّوائِرُ أَبداً يتقدَّمُ أَبْنيائها ما أَوَّلُه وَتَد. والطُّوَالُ: المُفْرِطُ الطُّولِ، ولا يُكَسَّرُ، إنَّما يجَمَعُ جَمْعَ السَّلامِة. وطاوَلَني فطُلْتُه، أي: كنتُ أَشَدَّ طُولاً منه، قَالَ:
              (إِنَّ الفَرَزْدَقَ صَخرةٌ عادِيَّةٌ ... طالَتْ فليس تَنالُها الأَوعالاً)
              وأَطالَ الشّيْءَ، وطوَّلَه، وأَطْوَلَه: جَعَلَه طَوِيلاً، وكأَنَّ الّذين قالوا ذلك إنَّما أَرادُوا أَن يُنَبِّهوا على أَصل البابِ، ولا يُقاسُ هذا، إنَّما أَتَي للتَّنبيه على الأَصْلِ، وأَنْشَدَ سِيبَويِهِ:
              (صدَدْتِ فأَطْوَلْتٍ الصُّدُودَ وقَلَّما ... وِصالٌ على طُولِ الصُّدُودِ يَدُومُ)
              وكُلُّ ما امتَدَّ من زَمَنٍ، أو لَزِمَ من همٍّ ونَحوِه فقد طَالَ، كَقَوِلِكَ: طال الهَمُّ، وطالَ اللَّيلُ. وقالُوا: إنَّ اللَّيلَ طَويلٌ، ولا يَطْلْ إلاّ بخَيْرٍ، عن اللِّحيانيِّ، قَالَ: ومعناه الدُّعاءُ. وأطالَ الله طِيلَتَه، أي: عُمْرَه. والطَّوَلُ: طُولٌ في مِشْفَرٍ البَعيرِ الأَعْلَي، بَعيرٌ أَطْوَلُ. وتَطاوَلَ: تمدَّدَ إلى الشَّيْءِ يَنْظُرُ نَحوَه، قَالَ:
              (تَطاوَلْتُ كي يَبْدو الحَصِيرُ فما بدا ... لعَيْنِي، ويالَيْتَ الحَصيرَ بَدَا لِيا)
              واسْتَطالَ الشَّقُّ في الحائِطِ: امْتَدَّ وارتَفَعَ، حكاه ثَعلَبٌ، وهو كاسْتَطارَ. والطِّوَلُ والطَّيَلُ والطَّوِيلُه والتِّطْوَلُ، كُلُّه: جَبْلٌ طَوِيلٌ تُشَدُّ به قائِمةُ الدّابَّةِ، وقِيلَ: هو الحَبْلُ تَشَدُّ به، ويُمْسكَ صاحَبِه يَطَرَفِه، ويُرْسْلُها تَرْعَي، قَالَ مُزاحِمٌ:
              (وسلْهَبٍ ةٍ قَوْداءَ قَلَّصَ لَحمُها ... كِسعلاةٍ بِيدٍ في جِلالٍ وتِطْوَل)
              وقد طَوَّلَ لها. والطِّوَلُ: التّمادِي في الأَمِر، والتَّراخِي، يُقالُ: طَالَ طِولَك، وطِيَلُكَ، وطِيلُكَ، وطُولُك، عن كُراع، معني هذا كُلِّه: طَالَ مُكْثُكَ، وأَنْشَدَ غَيرُه قَوْلَ طُفَيْلٍ:
              (أَتانا فلم تَدْفَعُه إِذ جاء طارِقاً ... وقُلنا لَه: قدْ طالَ طُولُكَ فانْزِلِ)
              ويُروَي: ((قد طَالَ طِيلُكَ)) . وقولُ القُطِاميّ:
              (وإن بَلِيتَ وإن طالَتْ بكَ الطِّيَلُ ... )
              و [يُروي] الطِّوَلُ، قيلَ في تَفْسيِرِه: الطِّيَلُ: جَمْعُ طِيلَةٍ، والطِّوَلُ: جَمْعُ طِوَلَةٍ، فاعْتَلَّ الطِّبَلُ، وانْقَلَبْتْ واوُه ياءً، لاعْتِلالِها في الواحِدِ، فأمَّا طِوَلَةُ وطَوَلٌ فمِنْ بابِ عِنَبَةٍ وعِنَبٍ. والطَّالُ مَدَى الدَّهْرِ، يُقالُ: لا آتٍ يكًَ طَوَالَ الدَّهْرِ. والطَّوْلُ والطّائِلُ والطّائِلَةُ: الفَضْلُ، والقَدْرَةُ، والغِنَي، والسَّعَةُ، والعُلُوُّ، قَالَ أَبُو ذُؤَيْبٍ:
              (ويَأْشِبنُي فيها الذَّيِن يَلْونَها ... ولو عَلَِمُوا لم يَأْشِبُونِي بطائِلِ)
              وأَنْشَدَ ثَعْلَبٌ في وَصْفِ ذِئْبٍ:
              (وإن أَغارَ فلم يَحلُلْ بطائِلَةٍ ... في لَيْلَةٍ من جُمَيْرٍ ساوَرَا الفُطُما)
              كذا أَنْشَدَه ((جُمَيْرٍ)) على التَّصْغِيرِ. وقَدْ تَطَوَّلَ عَلَيهم. والتَّطاوُلُ، والاسْتِطالَةُ: التَّفَضُّلُ، ورَِفْعُ النَّفْسِ. ويُقالُ للشَّيْءِ الخَسِيسِ الدُّوِن: ما هُو بطائِلٍ: الذَّكَرُ والأُنْثَى في ذِلكَ سَواءٌ. والطُّوَّلُ: طاِئرٌ. وطُوَالَة: مَوضِعٌ، وقِيلَ: بِئرٌ، قَالَ الشَّمَّاخُ:
              (كِلاَ يَوْمَيْ طُوالَةَ وَصْلُ أَرْوَى ... ظَنُونٌ آنَ مُطَّرَحُ الظَّنُونِ)
              وبَنُو الأَطْوَلِ: بَطْنٌ.
