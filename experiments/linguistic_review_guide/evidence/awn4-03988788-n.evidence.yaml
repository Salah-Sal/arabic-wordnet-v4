            definitions_text: "باب الطاء واللام و (وا يء) معهما ط ول، ل وط، ط ل ي، ل ي ط، ل طء، ء ط ل مستعملات\nطول: طال فلانٌ\
              \ فلاناً، أي: فاته في الطّول، قال: تَخُطّ بقَرْنيها بَرِيرَ أَراكه ... وتعطوا بظلفيها إذا الغصن طالها \nأي:\
              \ طاولها فلم تَنَله. وطال الشّيء يَطُولُ طُولاً فهو طويل.. والأَطْوَلُ: نَقِيضُ الأَقصر. والطُّوال: إذا كان\
              \ أهوج الطُّول، امرأةٌ طُوالة، قال:\nألم تر إنّني وأبا يزيدٍ ... لفي حربٍ مماطلة طُوالَه \nوالطِّوَلُ: الحَبْل\
              \ الطّويل، ويقال: لقد طال طِوَلُك يا فلان، إذا طال تماديه في أمرٍ وتراخيه عنه. وقد يُقال: طال طيله. والطول:\
              \ القدرة. وإن فُلاناً لَذو طَوْلٍ، أي: ذو قدرة. ويُقالُ: إنّه ليتطوّل على النّاس بفَضله وخَيْره. واشتقاق الطائل\
              \ من الطُّول.. ويُقال: للخسيس الدُّون: هذا غيرُ طائل، والتَّذْكيرُ والتّأنيثُ فيه سواء، قال:\nلقد كلّفوني خُطَّةً\
              \ غَيْرَ طائلِ \nوالطِّيال: لغةٌ في الطِّوال. والطَّوال: مدى الدَّهر، يقال: لا آتيك طَوال الدَّهْر. والطَّوَلُ:\
              \ طُولٌ في المِشْفَرِ الأَعْلَى على الأَسْفل. يقال جَمَل أَطْوَلُ وبه طول. والمُطاولةُ في الأَمْر هي التَّطْويل.\
              \ والتَّطاوُلُ في معنىً: هو الاستطالة على النّاس إذ هو رفع رأسه ورأى أنّ له عليهم فَضْلاً في القَدْر. وهو في\
              \ معنىً آخر، أَنْ يَقُومَ قائماً، ثمّ يَتَطاوَل في قيامه، ثمّ يرفَعُ رأسَهُ ويَمُدُّ قَوامَهُ للنَّظَر إلى الشَّيء.\
              \ والطِّولُ: اسم حَبْل تُشَدُّ به قوائم الدّابّة، ثم تُرْسَل في المَرْعَى، وكانتِ العَرَبُ تتكلّم به، يُقال:\
              \ طَوِّلْ لِفَرَسِك الطِّوَلَ، أي: أَرْخِ له حَبْلَه في مرعاه، قال طرفة:\nلَعَمْرُكَ إنّ المَوْتَ ما أَخْطأ\
              \ الفَتَى ... لَكالطِّوَلِ المُرْخَى وثِنْياه باليَدِ\nلوط: لاط فلان في هذا الأمر لَوْطاً شديداً، أي: أَلَحَّ.\
              \ واللَّوْط: مدر الحَوْض، يَعْمَدون إلى الطِّين الحرّ، فيَحْفِرون له مَمْدرةً إلى جنب الحوض، فإذا أراد أن يَمْلأَ\
              \ الحَوْضَ، وهو جاف، تقول: مَدَرْتُهُ ولُطْتُهُ لئلا ينشف الماء. والتاط حوضاً، أي: لاطه لنفسه. والالتياطُ: أن\
              \ يلتاط الإنسان ولداً يَدَّعيه ليس له، تقولُ: التْاطَهُ واستلاطه، قال:\nفهل كنتَ إلاّ بُهْثَةً واستلاطَها ... شَقيٌّ\
              \ من الأقوام وَغْدٌ ملحق  وقولُ أبي بَكْرٍ: الولدُ أَلْوَطُ، أي: أَلْصَقُ بالقلب. لاط به يلوطُ لَوْطاً.. ويُقالُ\
              \ للشَّيء إذا لم يُوافِقْك: ما يلتاطُ هذا بصَفَري، أي: لا يلصقُ بقلبي، وهو يَفْتَعِل من لاطَ لَوْطاً. ولُوطٌ:\
              \ اسم نَبيّ، كان ذا قَرابةٍ لإبراهيم عليه السّلام، بعثه الله إلى قَوْمِه فكذَّبُوهُ [وأَحْدَثُوا ما أَحْدَثوا]\
              \ فاشتقَّ النّاسُ منِ اسمه فِعلاً لمن فَعَلَ فِعْلَ قَوْمِهِ.\nطلي: الطَّلاَ: الوَلَدُ الصَّغيرُ من كلِّ شيءٍ،\
              \ حَتَّى لقد شُبِّه رمادُ المَوْقد بين الأَثافيّ بالطّلا، والطّلايين أمّهاته، قال العجاج: \nطَلاَ الرَّمادِ\
              \ اسْتُرْئِمَ الطَّليُّ\n. والأَطْلاءُ  : جماعةُ الطلا وكذلك: الطُّليان [والطِّليان]  جِماعُه. قال زهير: \n\
              بها العِينُ والآرام يَمْشِينَ خِلْفهَ ... وأَطْلاؤُها يَنْهضْنَ من كُلِّ مَجْثَمِ\nوالطُّلَى: جماعةُ الطُّلْية،\
              \ وهي صَفْحة العُنُق، وبعضٌ يقول: طلوة وطلى. والطِّلاءُ من القَطِران، ممدود: ضَرْبٌ منه، شُبِّهَ به خاثِر المُنَصَّف\
              \  . والطِّلاءُ: اسمٌ من أسماء الشّراب. وكلُّ شيء طُلِي به شيءٌ فهو طِلاءٌ. والطُّلاوةُ: الرِّيق الذي يَجِفُّ\
              \ على الأسنان من الجوع. والطُّلاوة: الحُسْن، يقال: سَمِعْتُ كَلاما عليه طُلاوة.\nليط: اللِّيطُ: قِشْر القَصَب\
              \ اللاّزق به، وقشرُ كلّ شيء كانت له صلابة ومتانة كالقناة، والقطعة منه: لِيطةٌ. وكذلك القوس العربية، تُمسح وتمرنُ\
              \ كي تَصْفُوَ ويَصيرَ لها لِيطٌ، تقول: عاتكةُ اللِّيط واللِّياط، أي: لازقة اللِّيط، صُلْبتُهُ. وتَلَيَّطْت لِيطةً،\
              \ أي: تَشَظَّيْتُها، أي: اشْتَقَقْتُها، وأخذت شقّة منها. واللِّيط: اللَّوْنُ، هُذَليّة.\nلطأ: اللَّطْءُ: لُزُوقُ\
              \ الشَّيْء بالشَّيء. ورأيت فلاناً لاطئاً بالأرْض. ورأيت الذِّئْبَ لاطئا للسّرقة، وهذه أكَمَةٌ لاطئة. والّلاطِئةُ:\
              \ خُراجٌ يَخْرج بالإنسان فلا يكادُ يَبْرَأُ منه، ويَزْعُمون أَنّها من لسْعة الثُّطْأَة. والّلاطئةُ: ضَرْبٌ من\
              \ القلانس. أطل: الإِطْلُ: لغةٌ في الأَيْطل، وهو الشّاكلة، والقُرُبُ تحت الشّاكلة. تقول إنه لَلاحقُ الأَيْطَلَيْن،\
              \ وجمعه: أياطل، وألآطال: جماعة الإطْل، والأَيْطَلُ: أَحْسَنُ وأَعْرَفُ.. ونظيرُهُ قَوْلُهم للمجنون: به أَوْلَق،\
              \ وقد أُلِقَ يُؤْلَقُ أَلْقاً."
            translation_en: null
            translation_fr: null
            domain: null
