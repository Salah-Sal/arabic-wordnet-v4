            definitions_text: '(ط ل ي) : (وَطَلَيْتُهُ) بِالنُّورَةِ أَوْ غَيْرِهَا لَطَّخْتُهُ (وَاطَّلَيْتُ) عَلَى افْتَعَلْتُ
              بِتَرْكِ الْمَفْعُولِ إذَا فَعَلْتَ ذَلِكَ بِنَفْسِكَ وَعَلَى ذَا قَوْلُهُ أَطَّلَى شُقَاقُ رِجْلِهِ خَطَأٌ
              وَإِنَّمَا الصَّوَابُ طَلَى (وَالطَّلْيَةُ) الْمَرَّةُ وَمِنْهَا أَسْتَأْجَرَهُ عَلَى أَنْ يُنَوِّرَهُ فِي الْحَمَّامِ
              عَشْرَ طَلَيَاتٍ (وَالطِّلَاءُ) كُلُّ مَا يُطْلَى بِهِ مِنْ قَطِرَانٍ أَوْ نَحْوِهِ (وَمِنْهُ) حَدِيثُ عُمَرَ
              - رَضِيَ اللَّهُ عَنْهُ - مَا أَشْبَهَ هَذَا بِطِلَاءِ الْإِبِلِ وَيُقَالُ لِكُلِّ مَا خَثُرَ مِنْ الْأَشْرِبَةِ
              طِلَاءٌ عَلَى التَّشْبِيهِ حَتَّى سُمِّيَ بِهِ الْمُثَلَّثُ.'
