          - entry_id: 365322
            dictionary_id: 56
            headword: طلاءات محفوظة
            headword_bare: طلاءات محفوظة
            headword_norm: طلاءات محفوظة
            root: طل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: هذه الطلاءات يتم أستخدامها كمادة تشحيم لتقليل الأستهلاك والتآكل الناجم عن الأحتكاك وللحماية
              من تآكل الجزاء المعدنية الموجودة في حركة متماسة مع بعصها.عل حسب المادة الانزلاقية واللفافة يمكن استخدام هذه
              الطلاءات الانزلاقية في درجة حرارة حتى 300 من إثلين الفلور الرباعي المعدد و 400  من الأكسد المعدني 500 درجة من
              الرصاص. من خلا رشاشات الحقن يتم رش هذه الطلاءات على الأجزاء الموجودة بواسطة الصلب ومن خلال التحول الكيميائي
              أو الموجب واشعاله بعد التهوية. سمك طبقة الطلاء يكون غالبا أقل من 20  ملم.
            translation_en: bonded coatings
            translation_fr: vernis antifriction
            domain: Transport and Infrastructure
            external_id: arabterm:76313
