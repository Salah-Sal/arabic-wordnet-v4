            is_partial: 0
            definitions_text: 'الطُِّلاوَةُ، مثلثةً: الحُسْنُ، والبَهْجَةُ، والقَبُولُ، والسِّحْرُ، وجِلْدَةٌ رَقيقَةٌ فَوْقَ
              اللَّبَنِ أو الدَّمِ، وبَقِيَّةُ الطَّعامِ في الفَمِ، والرِّيقُ يَعْصَبُ بالفَمِ لِعارِضٍ أو مَرَضٍ،كالطَّلا.والطُّلْوانُ،
              بالضم ويُحَرَّكُ،والطُّلَواءُ، كغُلَواء: الانْتِظارُ، والإِبْطاءُ،كالطَّلاوةِ.والطِّلْوُ، بالكسر: القانِصُ اللطيفُ
              الجِسْمِ، والذِّئْبُ.والطَّلا، بالفتح: ولَدُ الظَّبْيِ ساعَةَ يُولَدُ، والصَّغيرُ من كلِّ شيءٍ،كالطَّلْوِج:
              أطْلاءٌ وطِلاءٌ وطُلِيٌّ وطُلْيانٌ، ويُكْسَرُ.والطُّلْوَةُ، بالضم: بياضُ الصُّبْحِ، وبالكسر: الصَّغيرةُ من الوحشِ.'
