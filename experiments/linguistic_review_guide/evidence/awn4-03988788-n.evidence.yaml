            is_partial: 0
            definitions_text: 'طلت: (طَالُوتُ) أَهمله الجوهَرِيُّ، وَقَالَ ابنُ دُرَيْد: هُوَ اسْم (مَلِك أَعْجَمِيّ) وَهُوَ
              عَلَمٌ عِبْرِيٌّ، كَذَا وردَ، وَقد جاءَ ذكْرُه فِي القُرْآنِ، وَقد تقدَّم فِي جلت، وَجعله بعضُهُمْ مَقْلُوباً
              من الطُّولِ، وَهُوَ تَعَسُّفٌ يَرُدُّهُ منعُ صَرْفِه قَالَه شيخُنا، أَي للعَلَمِيّةِ، وشِبْهِ العُجْمَةِ.'
