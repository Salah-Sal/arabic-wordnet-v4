            definitions_text: '(طَوُلَ)(س) فِيهِ «أُوتيتُ السَّبْعَ الطُّوَلَ» الطُّوَل، بِالضَّمِّ: جمعُ الطُّولَى، مِثْلَ
              الكُبَر فِي الكُبْرى.وَهَذَا البنَاءُ يلزمُه الْأَلِفُ واللامُ والإضافةُ. والسَّبع الطُّوَل هِيَ البَقَرة، وَآلُ
              عِمران، والنِّساء، والمَائِدة، والأنْعَام، والأعْراف، والتَّوبة.وَمِنْهُ حَدِيثُ أُمِّ سَلَمة «أَنَّهُ كَانَ
              يقرأُ فِي المَغْرب بِطُولَى الطُّولَيَيْن» الطُّولَيَيْن: تَثْنِية الطُّولَى، ومُذكَّرُها الأَطْوَل: أَيْ أَنَّهُ
              كَانَ يقْرأ فِيهَا بأَطْوَل السُّوَرَتين الطَّوِيلَتَيْن. تَعْني الأنْعَام والأعْرَافَ.(س) وَفِي حَدِيثِ اسْتِسْقَاءِ
              عُمَرَ «فطَالَ العبَّاسُ عَمَر» أَيْ غَلَبه فِي طُول القَامة، وَكَانَ عُمَرُ طَوِيلا مِنَ الرِّجال، وَكَانَ
              العبَّاس أشدَّ طُولًا مِنْهُ.ورُوَي أَنَّ امْرأًة قالَت: رأيتُ عبَّاساً يَطُوف بالبيتِ كأَنَّه فُسْطَاط أبْيَضُ،
              وكانَت رَأتْ علىّ ابن عَبْدِ اللَّهِ بْنِ عَبَّاسٍ، وَقَدْ فَرَعَ الناسَ طُولا، كَأَنَّهُ رَاكبٌ مَعَ مُشَاة،
              فَقَالَتْ: مَنْ هَذَا فأُعْلِمْتَ، فَقَالَتْ: إنَّ النَّاسَ ليَرْذُلُونَ. وَكَانَ رَأْسُ عَلِيِّ بْنِ عَبْدِ
              اللَّهِ إِلَى مَنْكِب أَبِيهِ عَبْدِ اللَّهِ، ورَأسُ عَبْدِ اللَّهِ إِلَى مَنْكِب العبَّاس، ورأسُ العبَّاس إِلَى
              مَنكب عَبْدِ المطلب. (س) وَفِيهِ «اللَّهُمَّ بِكَ أُحاول وَبِكَ أُطَاوِل» أُطَاوِلُ: مُفاعَلة مِنَ الطَّوْل
              بِالْفَتْحِ، وَهُوَ الفَضْل والعُلُوّ عَلَى الأعْداء.(هـ) وَمِنْهُ الْحَدِيثُ «تَطَاوَلَ عَلَيْهِمُ الرَّبُّ
              بفَضْله» أَيْ تَطَوَّلَ ، وَهُوَ مِنْ بَابِ: طارَقْتُ النَّعْل، فِي إطْلاقها عَلَى الوَاحد.وَمِنْهُ الْحَدِيثُ
              «أَنَّهُ قَالَ لأزْواجه: أوَّلُكُنَّ لُحوقاً بِي أَطْوَلُكُنَّ يَداً، فاجْتَمَعْن يَتَطَاوَلْنَ، فَطَالَتْهُنَّ
              سودةُ، فماتَت زينَبُ أوَّلَهُنّ» أرادَ أمَدَّكُنَّ يَدًا بالعَطاء، مِنَ الطَّوْل، فظَنَنَّه مِنَ الطَّوْل. وكانَت
              زينَبُ تَعْمَلُ بيدِها وتَتَصدقَّ بِهِ.(هـ) وَمِنْهُ الْحَدِيثُ «إِنَّ هَذَيْنِ الْحَيَّيْنِ مِنَ الْأَوْسِ
              وَالْخَزْرَجِ كَانَا يَتَطَاوَلَانِ عَلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ تَطَاوُلَ الفَحْلَين»
              أَيْ يَسْتَطِيلَان عَلَى عَدوّه ويتَبارَيان فِي ذَلِكَ ليكونَ كُلُّ واحدٍ منهُمَا أبْلَغ فِي نُصْرَته مِنْ صَاحِبه،
              فشُبّه ذَلِكَ التَّبَارِي والتَّغَالب بتَطَاوُلِ الفَحْلَين عَلَى الْإِبِلِ، يَذُبُّ كلُّ وَاحِدٍ منهُما الفُحُولَ
              عَنْ إِبِلِهِ ليَظْهر أيُّهما أكثرُ ذَبًّا.(هـ) وَمِنْهُ حَدِيثُ عُثْمَانَ «فتَفرَّق الناسُ فِرَقاً ثَلَاثًا:
              فصامِتٌ صَمْتُهُ أنفذُ مِنْ طَوْلِ غَيره» ويُروى «مِنْ صَوْل غَيْرِهِ» أَيْ إمْسَاكه أشدُّ مِنْ تَطَاوُلِ غَيره.
              يُقَالُ: طَالَ عليه، واسْتَطَالَ، وتَطَاوَلَ، إذا علاوه وتَرْفَّعَ عَلَيْهِ.(س) وَمِنْهُ الْحَدِيثُ «أرْبَى
              الرِّبا الاسْتِطَالَة فِي عِرْضِ النَّاسِ» أَيِ اسْتِحْقَارُهُمْ، وَالتَّرَفُّعُ عَلَيْهِمْ، والوَقيعةُ فِيهِمْ.(س)
              وَفِي حَدِيثِ الْخَيْلِ «ورجلٌ طَوَّلَ لَهَا فِي مَرْج فقَطَعَتْ طِوَلَها» .(هـ) وَفِي حَدِيثٍ آخَرَ «فأَطَالَ
              لَهَا فقَطعت طِيَلَها» الطِّوَل والطِّيَل بِالْكَسْرِ: الحبْل الطَّوِيل يُشَدُّ أَحَدُ طَرَفَيه فِي وتِد أَوْ
              غَيره والطَّرَف الْآخَرُ فِي يَد الفَرس ليَدُورَ فِيهِ ويَرْعَى وَلَا يَذْهَب لوجْهِه. وطَوَّلَ وأَطَالَ بِمَعْنًى:
              أَيْ شدّها في الحبل. وَمِنْهُ الْحَدِيثُ «لِطِوَلِ الفَرسِ حِمًى» أَيْ لصَاحِب الفَرَس أَنْ يَحْمِيَ الموضعَ
              الَّذِي يَدُورُ فِيهِ فَرَسُه المشدُودُ فِي الطِّوَل إِذَا كانَ مبُاحا لاَ مالِكَ لَهُ.وَفِيهِ «أَنَّهُ ذَكَرَ
              رجُلا مِنْ أصْحابه قُبِض فكُفِّن فِي كَفَنٍ غيِر طَائِل» أَيْ غَيرِ رَفِيع وَلَا نَفِيس. وأصلُ الطَّائِل: النَّفْع
              والفائِدة.(س) وَمِنْهُ حَدِيثُ ابْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ فِي قَتْل أَبِي جَهْلٍ «ضَرْبْتُه بسَيفٍ
              غَيرِ طَائِل» أَيْ غَيْرِ ماضٍ وَلَا قَاطِع، كَأَنَّهُ كَانَ سَيفاً دُوناً بينَ السُّيوف.'
