            definitions_text: '[طلى] فيه: ما "أطلى" نبي قط، أي ما مال إلى هواه، وأصله من ميل الطلا وهي الأعناق جمع طلاة، من
              أطلى إذا مالت عنقه إلى أحد الشقين. وفي ح على: كان يرزقهم "الطلاء"، هو بالكسر والمد الشراب المطبوخ من عصير العنب
              وهو الرب، وأصله القطران الخاثر الذي تطلي به الإبل. ج: هو أن يطبخ حتى يذهب ثلثاه، ويسمى البعض الخمر طلاء. نه:
              ومنه ح: إن أول ما يكفأ الإسلام كما يكفأ الإناء في شراب يقال له "الطلاء"، وهو كحديث: سيشرب ناس من أمتي الخمر
              يسمونها بغير اسمها، يريد أنهم يشربون النبيذ المسكر المطبوخ ويسمونه طلاء تحرجا من أن يسموه خمرًا، وما في ح على
              فرب حلال لا خمر. وفيه: وإن له لحلاوة وإن عليه "لطلاوة"، أي رونقًا وحسنًا، وقد تفتح طاؤه. ط: من "أطلى" أو احتجم،
              من طليته بنورة أو غيره لطخته، واطليت افتعلت منه إذا فعلته بنفسك. ن: "فاطلى" فيه أناس، أي أزالوا شعرًا لعانة
              بالنورة، قوله: إن سعيدًا يكره هذا، أي إزالة الشعر في ذي الحجة لمريد التضحية.'
