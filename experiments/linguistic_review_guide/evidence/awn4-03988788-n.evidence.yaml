          - entry_id: 828414
            dictionary_id: 120
            headword: طلي
            headword_bare: طلي
            headword_norm: طلي
            root: طل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'طلي: (ى ( {طَلَى البَعيرُ الهِناءَ} يَطْليه، و) {يطْلَى (بِهِ) } طَلْياً: (لَطَخَهُ بِهِ) ؛
              وشاهِدُ {طَلاهُ إيَّاه مِن غَيْر حَرْف قوْلُ مِسْكين الدَّارِمي:كأَنَّ المُوقِدِينَ بهَا جِمالٌ} طَلاهَا الزَّيْتَ
              والقَطِرانَ طالي ( {كطَلاَّهُ) } تَطْلِيةً؛ قالَ أَبُو ذُؤَيْب:وسِرْبٍ {يُطَلَّى بالعَبِيرِ كأَنَّهدِماءُ ظِباءٍ
              بالنَّحورِ ذَبيحُ (وَقد} اطَّلَى بِهِ {وتَطَلَّى) ، ويُرْوَى بَيْتُ أَبي ذُؤَيْبٍ: وسِرْبٍ} تَطَلَّى.(وناقَةٌ
              {طَلْياءُ) : أَي (} مَطْلِيَّةٌ.( {والطِّلاءُ، ككِساءٍ: القَطِرانُ، وكلُّ مَا} يُطْلَى بِهِ.(و) بعضُ العَرَبِ
              يُسَمِّي (الخَمْرَ) {الطِّلاءَ، يُريدُ بذلكَ تَحْسينَ اسْمها لَا أنَّها} الطِّلاءَ بعَيْنِه؛ قَالَ عبيدُ بنُ
              الأَبْرصِ للمُنْذِرِ حينَ أَرادَ قَتْلَه:هِيَ الخَمْرُ تُكْنَى! الطِّلاءَكَمَا الذِّئْبُ يُكْنَى أَبا جَعْدَةْهكذا
              هُوَ مَعْروفٌ فِي الإنْشادِ، وَهَكَذَا أَنْشَدَه ابنُ قُتَيْبة، وَهُوَ لَا يَسْتَقِيم فِي الوَزْن. ووَقَعَ فِي
              نسخِ الصِّحاحِ: وَقَالُوا هِيَ الخَمْر، وليسَ بمَشْهورٍ: ووَقَعَ فِي المُحْكم: هِيَ الخَمْرُ يكنُونَها {بالطِّلاءِ.قالَ
              الجوهريُّ: ضَرَبَه مَثَلاً، أَي تُظْهِرُ لي الإكْرامَ وأنْتَ تُريدُ قَتْلي، كَمَا أنَّ الذئبَ وَإِن كانتْ كُنْيَتُه
              حَسَنَةً فإنَّ عَمَلَه ليسَ بحَسَنٍ، وكَذلكَ الخَمْرُ وَإِن سُمِّيت} طِلاءً وحسُنَ اسْمُها فإنَّ عَمَلَها قبيحٌ.(و)
              {الطِّلاءُ أَيْضاً: (خاثِرُ المُنَصَّفِ) ، وَهُوَ مَا طُبِخَ مِن عصيرِ العِنَبِ حَتَّى ذَهَبَ ثُلُثاه، ويُسَمِّيه
              العَجَمُ المَيْجَنْتَج؛ كَمَا فِي الصِّحاحِ.وَفِي الأساسِ: شَرِبَ} الطِّلأَ المُثَلثَ: شُبِّه فِي خُثُورَتِه
              بالقَطِرانِ.(و) {الطِّلاءُ: (الشَّتْمُ) القَبيحُ.(و) الطَّلاءُ: (الحَبْلُ الَّذِي يُشَدُّ بِهِ رِجْلُ} الطَّلَى)
              ، وَهُوَ الصَّغيرُ من ذَواتِ الظَّلْفِ والخفِّ.وقالَ اللَّحْياني: هُوَ الخَيْطُ الَّذِي يُشَدُّ فِي رِجْلِ الجَدْي
              مَا دامَ صَغيراً، فَإِذا كَبرَ رُبقَ، والرّبْقُ فِي العُنُقِ.(و) {الطُّلاءُ، (بالضَّمِّ: قِشْرَةُ الدَّم.(و)
              } الطُّلاءُ، (كمُكاءٍ: الدَّمُ) نَفْسُه. يقالُ: تَرَكْتُه يَتَشَحَّطُ فِي {طُلائِهِ، أَي يَضْطرِبُ فِي دَمِه
              مَقْتولاً.وقالَ أَبُو سعيدٍ: هُوَ شيءٌ يَخْرُجُ بَعْدَ شُؤْبُوبِ الدَّمِ يُخالِفُ لَوْنَ الدَّمِ، وذلكَ عنْدَ
              خروجِ النَّفْسِ من الذَّبيحِ، وَهُوَ الدَّمُ الَّذِي} يُطْلَى بِهِ.(و) {الطَّلَى، (بالفَتْح والقَصْرِ: الشَّخْصُ)
              . يقالُ: إنَّه لجميلُ} الطَّلَى؛ وأَنْشَدَ أَبو عمروٍ:وخَذَ كمَتْنِ الصُّلَّبيِّ جَلَوْتُهجَمِيلِ {الطَّلى مُسْتَشْرِبِ
              اللَّوْنِ أَكْحَلِكذا فِي الصِّحَاح.(و) } الطَّلَى أَيْضاً: (! المَطْلِيُّ بالقَطِرانِ) ؛ نقلَهُ الجوهريُّ أَيْضاً.(و)
              أَيْضاً: (الَّرجُلُ الشَّديدُ المَرَضِ) ، لَا يُثَنَّى وَلَا يُجْمَعُ؛ قالَ: أَفاطِمَ فاسْتَحيي {طَلىً وتحرَّجيمُصاباً
              مَتى يَلْجَجْ بِهِ الشرُّ يَلْجَجِورُبَّما قيلَ: إِن (ج:} أطْلاء وهُما {طَلَيانِ) ، بالتَّحْرِيكِ.(و) } الطَّلَى:
              (الهَوَى) :) . يقالُ: (قَضَى {طَلاهُ) مِن حاجَتِه، أَي (هَواهُ.(و) } الطِّلَى (بالكسْرِ: اللذَّةُ) ؛ وَمِنْه
              قولُ الهُذَلي:كَمَا تُمَني حُمَيَّا الكأسِ شارِبَهالم يَقْضِ مِنْهَا {طِلاهُ بعد إنْفادِيُرْوى بالكسْرِ بمعْنَى
              اللذَّةِ، وبالفَتْح بمعْنَى الهَوَى.(و) } الطُّلَى، (بالضَّمِّ: الأعْناقُ) ؛ كَمَا فِي الصِّحاحِ؛ (أَو أُصُولُها)
              ؛ كَمَا فِي المُحْكَم؛ أَو مَا عَرُضَ مِن أَسْفَل الخُشَشاءِ.وقالَ ابنُ السِّكيت: صَفحَاتُ الأعْناقِ؛ وقالَ
              الأعْشى:مَتى تُسْقَ من أَنْيابِها بعد هَجْعَةٍمن الليلِ شِرْباً حِين مَالَتْ {طُلاتُها (جَمْعُ} طُلْيَةٍ) ،
              بالضَّمِّ، كَمَا قالَهُ الأصْمعي.(أَو) جَمْعُ ( {طُلاَةٍ) ، بالضَّمِّ أَيْضاً، كَمَا هُوَ مَضْبوطٌ فِي نسخِ
              التَّهْذيبِ.ووَقَعَ فِي نسخِ الصِّحاح بالفَتْح وَهُوَ غَلَطٌ، وَهُوَ قولُ أَبي عَمْروٍ والفرَّاء، ونَقَلَهُ
              سيْبَوَيه عَن أَبي الخطَّاب، وقالَ: هُوَ من بابِ رُطَبَةٍ ورُطَبٍ لَا من بابِ تَمْرَةٍ وتمْرٍ، وَلَا نَظِيرَ
              لَهَا إلاَّ حَرْفانِ حُكاةُ وحُكىً ومُهاةٌ ومُهىً.(} والطَّلْياءُ النَّاقَةُ الجَرْباءُ) ؛ وتقدَّم أَنَّ {الطَّلْياءَ
              هِيَ} المطْلِيَّةُ بالقَطِرانِ فكأَنَّها سُمِّيَت كذلكَ لأنَّها لَا تُطْلَى إلاَّ وفيهَا الجَرَبُ.(و) {الطَّلْياءُ:
              (خِرْقَةُ العارِكِ) ؛ وَمِنْه المَثَلُ: أَهْوَنُ مِن الطَّلْياءِ.وَالَّذِي عَن ابنِ الأَعْرابي: أَنَّ خِرْقَةَ
              العارِكِ هِيَ} الطُّلْيَةُ.( {والتَّطْليَةُ: التَّمْرِيضُ) . يقالُ:} طَلَّى فلَانا إِذا مَرَّضَه وقامَ عَلَيْهِ
              فِي مَرَضِه؛ نقلَهُ الأَزْهري.(و) {التَّطْليَةُ: (الشَّتْمُ) القَبِيحُ؛ عَن ابنِ الأعرابيِّ وَقد} طُلِي.(و)
              أَيْضاً: (الغِناءُ) ؛ وَهُوَ المُطَلِّي: أَي المُغَنِّي؛ عَن أَبي عَمْروٍ.( {والمِطْلَى، بكسْر الميمِ) مَقْصورٌ:
              (ع) فِي ديارِ بَني أَبي بكْرِ بنِ كلابٍ، قالَ السِّكْبُ المازنيّ:إنِّي أرقْتُ على} المِطْلَى وأشْأَزَنيبَرْقٌ
              يضِيءُ أمامَ البَيْتِ أَسْكُوبُ (و) {المُطَلَّى: (كالمُهَنَّى: المَرِيضُ الدَّنِفُ) الَّذِي أَمالَهُ المَرَضُ.(و)
              أَيْضاً: (المَحْبُوسُ) الَّذِي (لَا يُرْجَى خَلاصُه(} والطُّلَّى، كرُبَّى: الشَّرْبَةُ من اللَّبَنِ) ، فُعْلَى
              مِن الطّلاءِ.(و) فِي الحَدِيث: ((مَا {أَطْلَى نَبيٌّ قَطُّ) أَي: (مَا مالَ إِلَى هَواهُ) ، هَكَذَا فَسَّرَه
              أَبو زيْدٍ فِي نوادِرِه.قالَ ابنُ الأثيرِ: وأَصْلُه مِن مَيْلِ} الطُّلَى، وَهِي الأعْناقُ.قُلْت: ورَواهُ بعضٌ
              بتَشْديدِ الطَّاء، وحَمَلَه على {الاطلاء بالنَّوْرةِ وَهُوَ غَلَطٌ.(} والطَّلْيا) ، مَقْصورٌ، هَكَذَا فِي النُّسخِ
              وَهُوَ مُقْتَضى سِيَاقه والصَّوابُ {الطَّلِيَّا بفَتْحٍ فكسْرٍ فتَشْديدِ ياءٍ كَمَا ضَبَطَه الصَّاغاني فِي التّكْملةِ؛
              (الجَرَبْ(و) أيْضاً: (قَرْحَةٌ شبيهةٌ بالقُوباءِ) تخْرُجُ فِي جنْبِ الإنْسانِ فيُقالُ للرَّجُلِ إنَّما هِيَ
              قُوَباءُ وليسَتْ} بطَلِيَّا يُهَوِّنُ بذلكَ عَلَيْهِ.(و) قَالَ ابنُ الأعْرابي: ( {تَطَلَّى) فلانٌ إِذا (لَزِمَ
              اللَّهْوَ والطَّرَبَ(ومَنْهَلٌ} طَالٍ) : أَي (مُطَحْلَبٌ) قد ركبَ عَلَيْهِ الطّحْلبُ كالطّلاءِ.(و) قَالَ أَبُو
              عمروٍ: (لَيْلٌ طالٍ) ، أَي (مُظْلِمٌ) كأنَّه طَلَى الشُّخُوصَ فغَطَّاها، وَقد! طَلَى اللَّيْلُ الآفاقَ؛ وَهُوَ مجازٌ.(
              {والمِطْلَى) ، بالكسْرِ (ويُمَدُّ: مَسِيلٌ ضَيِّقٌ من الأرضِ؛ أَو) هِيَ (الأَرضُ السَّهْلةُ) اللَّيِّنَةُ (تُنْبِتُ
              الغَضَى) ؛ كَذَا فِي نسخِ التهذيبِ؛ وَفِي المُحْكم والصِّحاحِ: تُنْبِتُ العِضَاهَ؛ وَقد وَهِمَ أَبُو حنيفَةَ
              حينَ أنْشَدَ بيتَ هِمْيان.وزغل} المِطْلاَ بِهِ لَواهِجافقالَ: {المِطْلاءُ ممْدُودٌ لَا غَيْر، وإنَّما قَصَرَه
              الراجزُ ضَرُورَةً، وليسَ هِمْيانُ وحْدَه قَصَرَها، بل حَكَى الفارِسِيُّ عَن أَبي زيادٍ الكِلابي قَصْرَها أيْضاً،
              والجَمْعُ المَطالِي.(} والمَطالِي: المواضِعُ) السَّهْلةُ اللينة؛ وقيلَ: هِيَ الَّتِي (تَغْذُو فِيهَا الوحشُ
              {أَطْلاءَها) واحِدَتُها مِطْلاءُ، عَن أبي عمْروٍ.(} وطَلَيْتُه) ، أَي {الطَّلِيّ؛} طَلْياً {وطَلَوْتُه لُغَةٌ
              فِيهِ وَقد تقدَّمَ؛ (رَبَطْتُه) برِجْلِه إِلَى الوَتِدِ.يقالُ:} اطْلُ {طَلِيَّك: أَي ارْبطْه برِجْلِه؛ حَكَاه
              الفرَّاءُ عَن أَبي الجرَّاح.قالَ: وغيرُه يقولُ اطل بالضمِّ.(و) } طَلَيْتُ الشيءَ: (حَبَسْتُه) ، فَهُوَ طَلِيٌّ
              ومَطْلِيٌّ.( {والطَّلِيٌّ، كغَنِيَ: الصَّغيرُ مِن أوْلادِ الغَنَمِ) ؛ عَن ابنِ السِّكِّيت؛ قالَ: وإنَّما سُمِّي}
              طَلِيّاً لأنَّه {يُطْلى أَي تُشَدُّ رجْله بخَيْطٍ إِلَى وَتِدٍ أَيَّامًا؛ (ج} طُلْيانٌ، كرُغْفانٍ) ؛ كَذَا فِي
              الصِّحاح.وقالَ الفارِسِيُّ: {الطَّلِيُّ: صفَةٌ غالبَةٌ كسَّرُوه تكْسِيرَ الأسْماءِ فَقَالُوا} طُلْيانٌ، كقوْلِهم
              للجَدْوَلِ سَرِيٌّ وسُرْيانٌ.( {وأَطْلَى) الرَّجُلُ والبَعيرُ فَهُوَ} مُطْلٍ: (مالَتْ عُنُقُه للمَوْتِ) أَو
              غيرِهِ؛ قالَ الشاعرُ:تَرَكْتُ أَباكِ قد! أَطْلى ومالَتْعَلَيْهِ القَشْعَمان مِن النُّسُورِ نقلَهُ الجوهريُّ.وممَّا
              يُسْتدركُ عَلَيْهِ:{الطُّلْيةُ، بالضَّمِّ: صُوفَةٌ تُطْلَى بهَا الإبِلُ الجَرْبَى، وَهِي الرِّبْذةُ أَيْضاً؛
              عَن ابنِ الأعْرابي.وَمِنْه قوْلُهم: مَا يُساوِي} طُلْيَةً، وَهِي أَيْضاً خِرْقَةُ العارِكِ؛ وأَيْضاً الخَيْطُ
              الَّذِي تُشَدُّ بِهِ رِجْل الجَدْي مَا دامَ صَغِيراً، ويُفْتَحُ فِي هَذِه كالطَّلْيِ بالفَتْح.{والطَّلا} والطَّلَيانُ،
              بالتّحْريكِ. بَياضٌ يَعْلو الأسْنانَ مِن مَرَضٍ أَو عَطَشٍ؛ قالَ الشاعرُ:لقَدْ تَرَكَتْني ناقَتي بتَنُوفةٍلِسانيَ
              مَعْقُولٌ من {الطَّلَيانِ ويقالُ: بأسْنانِه} طَلِيٌّ {وطِلْيانٌ، مِثالُ صَبيَ وصِبْيانٍ، أَي قلَحٌ؛ تقولُ مِنْهُ:}
              طَلِيَ فُوه، كرَضِيَ، {يَطْلَى} طَلىً؛ نقلَهُ الجَوْهرِي، وَهُوَ قولُ الأَحْمَر.والمصنِّفُ ذكَرَ {الطَّلا فِي
              الواوِيِّ وأَغْفَلَه هُنَا، والحرْفُ مُشْتَرك بَيْنهما.} والطُّلايَةُ، بالضمِّ: دُوايَةُ اللّبَن؛ عَن كُراعٍ.وأيْضاً:
              مَا {يُطْلَى بِهِ.} والطَّلَى: الرَّمادُ بينَ الأَثافي، على التَّشْبيهِ.{وطَلَّى} يُطْلَى: إِذا شَتَم؛ عَن ابنِ
              الأعْرابي.{وطَلَى اللَّيْلُ الآفاقَ: أَي غَشَّاها؛ قالَ ابنُ مُقْبل:أَلا طَرَقَتْنا بالمَدِينَة بَعْدَما} طَلَى
              اللَّيْلُ أَذْنابَ البجادِ فأَظْلَماأَي غَشَّاها كَمَا {يُطْلى البَعِيرُ بالقَطِرانِ.وقالَ أَبو سعيدٍ: أَمْرٌ}
              مَطْليٌّ أَي مُشْكِل مُظْلِمٌ كأنَّه قد {طُليَ بِمَا لبَّسَه.} وطليا: قرْيةٌ بمِصْرَ مِن المنوفية.{والطلاء:
              الفضَّةُ الخالِصَةُ.وعودٌ} مَطْلِيٌّ: أَي غَيْر مَقشورٍ.{وطَلَى البَقْلُ: ظَهَرَ على وجْهه الأرضِ.} وأَطْلى
              الرَّجُلُ: مالَ عُنُقه إِلَى أَحَدِ الشِّقَّيْنِ.'
