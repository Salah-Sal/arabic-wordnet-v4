        headword_bare: مسامية
        headword_norm: مسامية
        root: سمم
        root_source: ocr
        pos: noun
        form: null
        is_partial: 0
        definitions_text: '(في الجيولوجيا) Porosity: خاصية وجود الفراغات بين حبيبات الصخور, وتقاس المسامية بقسمة الحجم الكلى
          للفراغات على حجم الصخر نفسه مضروبة في مئة (في الفيزياء) Porosity (E: خاصية الجسم الجامد الذى يحوى مسامَّ (قنوات
          دقيقة). ويطلق المصطلح كذلك على نسبة حجم هذه القنوات إلى حجم الجسم المسامِّىِّ كله مسامِيَّة (هشاشة) العظام (في الطب)
          Bone fragility (E: داءٌ يصيبُ العظام, ويجعلها عرضةً للكسر مما يصعبُ معه جَبْرُهًا, وهو يصيبُ النساء غالبًا, خاصة
          بعد سن اليأس, ويؤدى إلى تقوُّس العمود الفِقَرى'
        translation_en: null
