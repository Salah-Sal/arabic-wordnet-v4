        definitions_text: 'إدراك الشيء بحقيقته اليقين نورٌ يقذفه الله فى قلب من يحبُّ المعرفة يقال لإدراك الكُلِّيِّ والمُركَّب,
          والمعرفة تقال لإدراك الجزئيِّ أو البسيط, ومن هنا يقال: عرفت الله, دون علمته يطلق العلم على مجموع مسائل وأصول كلية
          تجمعها جهة واحدة؛ كعلم الكلام, وعلم النحو, وعلم الأرض, وعلم الكونيات, وعلم الآثار علوم العربية: العلوم المتعلقة
          باللغة العربية؛ كالنحو, والصرف, والمعانى والبيان والبديع, والشعر والخطابة, وتسمى بعلم الأدب يطلق العلم حديثاً على
          العلوم الطبيعية التى تحتاج إلى تجربة ومشاهدة واختبار, سواء أكانت أساسية: كالكيمياء والطبيعة والفلك والرياضيات والنبات
          والحيوان والحيولوجيا, أو تطبيقية: كالطب والهندسة والزراعة والبيطرة وما إليها'
        translation_en: null
