                ويسمّى أيضا بعالم الخلق وعالم الملك وعالم الشهادة انتهى. ويؤيّده ما قيل عالم الأمر ما لا يدخل تحت المساحة
                والمقدار. وفي شرح المثنوي: عالم الملك كناية عن أجسام وأعراض. ويسمّى أيضا عالم الشهادة، وعالم الأجسام. وأمّا
