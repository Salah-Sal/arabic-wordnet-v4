        definitions_text: 'والسُّمُّ: كُلُّ ثَقْبٍ ضَيِّقٍ, كثَقْبِ الإِبْرَةِ والأنْفِ والأُذُن, وغيرها وقيل: خَرْقُ الدُّبر
          ما يُسْتَخْرَجُ مِنَ البَحْرِ كالودَعِ وَأَشْبَاهِهِ ويُنْظَمُ لِلزِّينَةِ القَصْدُ. يُقَالُ: سَمَمْتُ سَمَّكَ,
          أَىْ: قَصَدْتُ قَصْدَكَ سَمُّ الحاجةِ: مَطْلَبُها. وقيل: مَقْصدُها. وقيل: وجهُهَا سُمُّ الحِمَارِ: الدِّفْلَى (شَجَرةٌ)
          سُمُّ السَّمَكِ: شجرةُ الماهِيزَهْرَة (فارسية) تعرف بالبوصيِر سُمُّ الفأْرِ: الرَّهَجُ, أى: الغُبَارُ سَمُّ الوَضِينَ:
          عُرْوةُ الحزامُ سِمامُ الإِنْسانِ وسُمومُه: فَمُهُ وَمَنْخِراهُ وأُذُناهُ سُمومُ الْإِنْسانِ وَالدَّابَّةِ: مَشَقُّ
          جِلْدِه سُمومُ السَّيْفِ: حُزُوزٌ فِيهِ يُعَلَّمُ بهَا. وقيل: آثارٌ فيه تدلُّ على جودته'
