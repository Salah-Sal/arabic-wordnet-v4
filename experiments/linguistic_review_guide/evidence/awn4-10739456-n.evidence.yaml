          وأَذًى وحِقدًا ويقال: يضعُ السُّمَّ فى الدَّسَم: يقدم شيئًا ضارًّا فى شكل جذَّابٍ وقيل: كُلُّ عَظْم فِيهِ مُخٌّ'
        translation_en: null
        translation_fr: null
        domain: null
