        definitions_text: 'طَيْرٌ يَكُونُ بالفَلاةِ, وهُوَ طَيْرٌ دِقاقٌ صِغَارٌ طُوالٌ, وقَلَّ مَا تُرَى إِلَّا فِى الرَّبيع
          ضَرْبٌ من الطِّير نحو السُّمَانى دُوَيْبَةٌ. وقيل: النَّمْلَةُ الحَمْرَاءُ دَائِرَةٌ مُسْتَحَبَّةٌ فى وسَطِ عُنُقِ
          الفَرسِ مَا شخَصَ مِنَ الدِّيارِ الخَرَاب الرَّآيةُ أو اللُواء (عَلَى التَّشْبِيه) الطَّلْعَةُ. يُقَالُ: فلانٌ بهِيُّ
          السَّمَامَة, ظِاهرُ الوَسامة الْوَجْهُ الْمُرادِ. يُقَالُ: أَيْنَ سَمَامَتُكَ اليَوْمَ؟ الْمَرْأَةُ الخَفِيفْةُ
          اللطِيفَةُ سَمَامَةُ كُلِّ شَيْءٍ: شَخْصُهُ'
