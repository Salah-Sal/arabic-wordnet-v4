          - entry_id: 820159
            dictionary_id: 119
            headword: العالم
            headword_bare: العالم
            headword_norm: العالم
            root: علم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'العالم:[في الانكليزية] worle ،universe ،cosmos [ في الفرنسية] monde ،unirers ،cosmos بفتح اللام
              في اللغة اسم لما يعلم به شيء مشتقّ من العلم والعلامة على الأظهر، كخاتم لما يختم به وطابع لما يطبع به، ثم غلب
              في الاستعمال فيما يعلم به الصانع وهو ما سوى الله تعالى من الموجودات أي المخلوقات، جوهرا كان أو عرضا لأنّها لإمكانها
              وافتقارها إلى مؤثّر واجب لذاته تدلّ على وجوده، فخرجت صفات الله تعالى لأنّها قديمة غير مخلوقة. فعلى هذا كلّ موجود
              عالم لأنّه مما يعلم به الصانع ولذا جمع على عوالم وجمعه على عالمين وعالمون باعتبار أنّه غلب على العقلاء منها.
              وقيل العالم اسم وضع لذوي العلوم من الملائكة والثّقلين أي الجنّ والإنس، وتناوله الغير على سبيل الاستتباع. وقد
              يطلق على مجموع أجزاء الكون أي على مجموع المخلوقات من باب تغليب الاسم في معظم أفراد المسمّى كتغليب اسم القرآن
              في مجموع أبعاض التنزيل، فإنّه وإن وقع عليه وعلى كلّ بعض من أبعاضه من جهة الوضع بالسّوية، لكنه مستعمل فيه غالبا
              والتغليب في بعض الأفراد لا يمنع الاستعمال في غيره، هكذا يستفاد من أسرار الفاتحة وشرح القصيدة الفارضية والبرجندي
              حاشية الچغميني. ثم في البرجندي:وأما العالم في عرف الحكماء فقال العلّامة في نهاية الإدراك: إنّ العالم اسم لكلّ
              ما وجوده ليس من ذاته من حيث هو كلّ وينقسم إلى روحاني وجسماني. وقد يقال العالم اسم لجملة الموجودات الجسمانية
              من حيث هي جملة هي ما حواه السّطح الظاهر من الفلك الأعلى انتهى. وفي شرح المواقف: قال الحكماء: لا عالم غير هذا
              العالم أعني ما يحيط به سطح محدّد الجهات وهو إمّا أعيان أو أعراض انتهى. ويسمّون العناصر وما فيها بالعالم السفلي
              وعالم الكون والفساد والأفلاك وما فيها عالما علويا وأجراما أثيرية. وأفلاطون يسمّي عالم العقل بعالم الربوبية كما
              في شرح إشراق الحكمة. ويقول في لطائف اللغات: العالم بفتح اللام في اصطلاح الصوفية عبارة عن الظلّ الثاني للحقّ
              الذي هو الأعيان الخارجية والصّور العلمية التي هي عبارة عن الأعيان الثابتة. اعلم أنّ العوالم وإن لم تنحصر ضرورياتها
              لامتناع حصر الجزئيات أمكن حصر كلياتها وأصولها الحاصرة كانحصارها في الغيب والشهادة لانقسامها إلى الغائب عن الحسّ
              والشاهد له. في الإنسان الكامل كلّ عالم ينظر الحقّ سبحانه إليه بالإنسان يسمّى شهادة وجودية، وكلّ عالم ينظر إليه
              من غير واسطة الإنسان يسمّى غيبا. والغيب على نوعين: غيب جعله الحقّ تعالى مفصلا في علم الإنسان، وغيب جعله مجملا
              في قابلية علم الإنسان. فالغيب المفصّل في العلم يسمّى غيبا وجوديا، وهو كعالم الملكوت، والغيب المجمل في القابلية
              يسمّى غيبا عدميا وهي كالعوالم التي يعلمها الله تعالى ولا نعلم نحن إيّاها، فهي عندنا بمثابة العدم، فذلك معنى
              الغيب العدمي. ثم إنّ هذا العالم الدنياوي الذي ينظر إليه بواسطة الإنسان لا يزال شهادة وجودية ما دام الإنسان واسطة
              نظر الحقّ فيها، فإذا انتقل الإنسان منها نظر الله تعالى إلى العالم الذي انتقل إليه الإنسان بواسطة الإنسان فصار
              ذلك العالم شهادة وجودية، وصار العالم الدنياوي غيبا عدميا، ويكون وجود العالم الدنياوي حينئذ في العلم الإلهي كوجود
              الجنّة والنّار اليوم في علمه سبحانه، فهذا هو عين فناء العالم الدنياوي وعين القيمة الكبرى والساعة العامة انتهى.وقسم
              صاحب القصيدة الفارضية الغيب على ثلاثة أقسام وعبّر عنها بالغيب والملكوت والجبروت، فترك المحدثات الغائبة عن الحسّ
              على اسم الغيب، وعبّر عن الذات القديمة بالجبروت، وعن صفاتها الجسمية بالملكوت فرقا بين المحدث والقديم والذات والصفات.وفي
              شرح المثنوي لمولانا جلال الدين الرومي:يقال لمرتبة الأحدية عالم الغيب أيضا. ويقول في أسرار الفاتحة: العالم في
              النظرة الأولى مجموع من جزءين هما: الخلق والأمر أَلا لَهُ الْخَلْقُ وَالْأَمْرُ إذا، صار العالم بمقتضى هذا الاعتبار
              عالمين: عالم الخلق وعالم الأمر. ثم في درجة ثانية من التجلي بدا الملك والملكوت، فالملك هو تجلّي عالم الخلق والملكوت
              هو تجلّي عالم الأمر. فالملك كلّ الخلق خلقه لَهُ مُلْكُ السَّماواتِ وَالْأَرْضِ والملكوت جملة الأمر بيده. بِيَدِهِ
              مَلَكُوتُ كُلِّ شَيْءٍ فالعالم إذن بمقتضى هذا الحساب أربعة عوالم. ثم العالم الخامس المشتمل على هذه الأربعة،
              وهو سبب اتصال هذه العوالم، وذلك هو عالم الجبروت. انتهى. وفي كشف اللغات عالم الأمر ويقال له عالم الملكوت وعالم
              الغيب أيضا. عند المتصوفة يطلق على عالم وجد بلا مدّة وبلا مادّة مثل العقول والنفوس، كما أنّ الخلق يطلق على عالم
              وجد بمادّة كالأفلاك والعناصر والمواليد الثلاثة ويسمّى أيضا بعالم الخلق وعالم الملك وعالم الشهادة انتهى. ويؤيّده
              ما قيل عالم الأمر ما لا يدخل تحت المساحة والمقدار. وفي شرح المثنوي: عالم الملك كناية عن أجسام وأعراض. ويسمّى
              أيضا عالم الشهادة، وعالم الأجسام. وأمّا عالم الملكوت فهو حاو للنفوس البشرية والسماوية، ويقال له أيضا عالم المثال،
              انتهى. ويقول في مجمع السلوك: إنّ عالم الملكوت هو عالم الباطن، وعالم الملك هو عالم الظاهر. ويقول في مكان آخر:
              الملكوت هو ما فوق العرش إلى ما تحت الثرى، وما عدا ذلك فهو عالم الجبروت. وعالم الإحسان هو عالم الإيقان بواسطة
              المشاهدات وتجلّي الذات والصفات. انتهى. وفي الإنسان الكامل عالم القدس عبارة عن المعاني الإلهية المقدّسة عن الأحكام
              الخلقية والنقائص الكونية. وفي موضع آخر منه عالم القدس هو عالم أسماء الحقّ وصفاته انتهى. وفي كشف اللغات يقول:
              العالم المعنوي عند الصوفية عبارة عن الذات والصفات والأسماء، والعالم العلوي هو العالم الأخروي.وكذلك عالم الأرواح
              والعالم القدسي، وعالم النسيم هو كرة البخار كما سيأتي. وفي أسرار الفاتحة قد يقسم العالم إلى الكبير والصغير. واختلف
              في تفسيرهما فقال بعضهم:العالم الكبير هو ما فوق السموات والصغير هو ما تحتها. وقيل الكبير ملكوت السموات والصغير
              ملكوت الأرض. وقيل الكبير هو القلب والصغير النفس. والجمهور على أنّ العالم الكبير عبارة عن السموات والأرض وما
              بينهما والعالم الصغير هو الإنسان. لماذا؟ لأنّ كلّ ما في دنيا الخلق هو في عالم الخلق، وكلّ ما هو مجتمع في عالم
              الخلق والأمر قد اجتمع في ذات الإنسان الذي هو العالم الصغير، لأنّ قالبه من عالم الخلق وروحه من عالم الأمر.وتفصيل
              هذا يقتضي الإطناب، فليطلب في أسرار الفاتحة.'
