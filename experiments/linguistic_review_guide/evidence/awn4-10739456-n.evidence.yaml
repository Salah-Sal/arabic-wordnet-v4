            is_partial: 0
            definitions_text: 'تسمية المنشأ تعني التسمية الجغرافية لبلد أو إقليم أو مكان معين والتي تستخدم للدلالة على منشأ
              المنتجات والصفات المميزة الناتجة حصرا أو أساسا عن البيئة الجغرافية، بما في ذلك العوامل الطبيعية والبشرية. تسميات
              المنشأ هي نوع خاص من البيانات عن المصدر: جميع تسميات المنشأ هي بيانات عن المصدر، ولكن ليست كل بيانات المصدر
