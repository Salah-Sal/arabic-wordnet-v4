            definitions_text: سِمةٌ لمعظمِ أنظمةِ تشغيل الحواسيب الشخصية PC، وخاصةً أنظمة Windows 95، وWindows NT، وOS/2.
              تَسمح هذه السمةُ بإسنادِ اسمٍ مؤلَّفٍ من نصٍّ إلى ملفٍّ، وذلك بدلاً من أن يَكونَ الاسمُ محدَّداً بعددٍ قليل
              من المحارف. يمكِن أن يَصلَ طولُ الأسماء إلى أكثر من 200 محرف تتضمّن الحروفَ الكبيرةَ والصغيرةَ وفراغاتٍ بين
