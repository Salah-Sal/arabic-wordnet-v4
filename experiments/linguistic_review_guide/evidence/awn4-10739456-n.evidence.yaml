                انتهى. وفي الإنسان الكامل عالم القدس عبارة عن المعاني الإلهية المقدّسة عن الأحكام الخلقية والنقائص الكونية.
                وفي موضع آخر منه عالم القدس هو عالم أسماء الحقّ وصفاته انتهى. وفي كشف اللغات يقول: العالم المعنوي عند الصوفية
