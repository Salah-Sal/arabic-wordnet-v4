              ثنى وَقَالَ [أَبُو عبيد -] : فِي حَدِيث عبد الله [بن عَمْرو -] من أَشْرَاط السَّاعَة أَن تُوضَع الأخيار وترفع الأشرار وَأَن تقْرَأ المَثْناة على رُؤْس النَّاس لَا تُغَيّر قيل: وَمَا المَثناة قَالَ: مَا استُكْتِبَ من غير كتاب الله عزّ وجلّ. [قَالَ أَبُو عبيد: فَسَأَلت رجلا من أهل الْعلم بالكتب الأُوَل قد عرفهَا وَقرأَهَا عَن المَثْناة فَقَالَ: إِن الْأَحْبَار والرهبان من بني إِسْرَائِيل بعد مُوسَى وضعُوا كتابا فيهمَا بَينهم على مَا أَرَادوا من غير كتاب الله تبَارك وَتَعَالَى فسَمَّوه الْمُثَنَّاة كَأَنَّهُ يَعْنِي أَنهم أحلّوا فِيهِ مَا شاؤا وحرموا فِيهِ مَا شاؤا على خلاف كتاب الله تبَارك وَتَعَالَى فَبِهَذَا عرفت تَأْوِيل حَدِيث عَبْد اللَّه بْن عَمْرو أَنه إِنَّمَا كره الْأَخْذ عَن أهل الْكتب لذَلِك الْمَعْنى وَقد كَانَت عِنْده كتب وَقعت إِلَيْهِ يَوْم اليرموك فأظنّه قَالَ هَذَا لمعرفته بِمَا فِيهَا وَلم يُرد النَّهْي عَن حَدِيث رَسُول اللَّه صلي اللَّه عَلَيْهِ وَسلم وسنّته وَكَيف ينْهَى عَن ذَلِك وَهُوَ من أَكثر الصَّحَابَة حَدِيثا عَنْهُ. وَقَالَ أَبُو عُبَيْد فِي حَدِيث عَبْد اللَّه بْن عَمْرو حِين سُئِلَ عَن الصَّدَقَة فَقَالَ: إِنَّهَا شرّ مَال إنّما هِيَ مالَ الكسحان والعُوْران قَالَ حدّثنَاهُ عَليّ ابْن عَاصِم عَن الْأَخْضَر بن عجلَان عَن فلَان عَن عبد الله بن عَمْرو. قَوْله: الكُسْحان واحدهم أكْسَح وَهُوَ المُقْعَد وَيُقَال مِنْهُ: كسح كَسِحَ يَكْسَحُ كَسَحاً قَالَ الْأَعْشَى يذكر قوما سَكِرُوا: (الرمل)
              بَين مَخْذول كَرِيم جَدُّه ... وخَذولِ الرِجْل من غير كَسَحْ
              يَقُول: إِنَّمَا خذله السكر لَيْسَ من كسح بِهِ. وَمعنى الحَدِيث أَنه كره الصَّدَقَة إِلَّا لأهل الزمانة كالحديث الآخر: لَا تحل الصَّدَقَة لغنيٍّ وَلَا لذِي مرَّة سَوِيٍ -] .
