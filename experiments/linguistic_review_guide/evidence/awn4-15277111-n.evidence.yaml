                (ثَنَيَ) الثَّاءُ وَالنُّونُ وَالْيَاءُ أَصْلٌ وَاحِدٌ، وَهُوَ تَكْرِيرُ الشَّيْءِ مَرَّتَيْنِ، أَوْ جَعْلُهُ شَيْئَيْنِ مُتَوَالِيَيْنِ أَوْ مُتَبَايِنَيْنِ، وَذَلِكَ قَوْلُكَ ثَنَيْتُ الشَّيْءَ ثَنْيًا. وَالِاثْنَانِ فِي الْعَدَدِ مَعْرُوفَانِ. وَالثِّنَى وَالثُّنْيَانُ الَّذِي يَكُونُ بَعْدَ السَّيِّدِ، كَأَنَّهُ ثَانِيهِ. قَالَ:
                تَرَى ثِنَانًا إِذَا مَا جَاءَ بَدْأَهُمُ ... وَبَدْؤُهُمْ إِنْ أَتَانَا كَانَ ثُنْيَانًا
                يُرْوَى: " ثُنْيَانُنَا إِنْ أَتَاهُمْ كَانَ بَدْأَهُمْ ". وَالثِّنَى: الْأَمْرُ يُعَادُ مَرَّتَيْنِ. قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ: «لَا ثِنَى فِي الصَّدَقَةِ» يَعْنِي لَا تُؤْخَذُ فِي السَّنَةِ مَرَّتَيْنِ. وَقَالَ مَعْنٌ:
                أَفِي جَنْبِ بَكْرٍ قَطَّعَتْنِي مَلَامَةً ... لَعَمْرِي لَقَدْ كَانَتْ مَلَامَتُهَا ثِنَى
                وَقَالَ النَّمِرُ بْنُ تَوْلَبٍ:
                فَإِذَا مَا لَمْ تُصِبْ رُشْدًا ... كَانَ بَعْضُ اللَّوْمِ ثُنْيَانَا
                وَيُقَالُ امْرَأَةٌ ثِنْيٌ وَلَدَتِ اثْنَيْنِ، وَلَا يُقَالُ ثِلْثٌ وَلَا فَوْقَ ذَلِكَ. وَالثِّنَايَةُ: حَبْلٌ مِنْ شَعَرٍ أَوْ صُوفٍ. وَيُحْتَمَلُ أَنَّهُ سُمِّيَ بِذَلِكَ لِأَنَّهُ يُثْنَى أَوْ يُمْكِنُ أَنْ يُثْنَى. قَالَ:
