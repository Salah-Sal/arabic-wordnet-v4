              عَن حاجَتِهِ: صَرَفَه.} وثَناهُ: أَخَذَ نِصْفَ مالِهِ أَو ضمَّ إِلَيْهِ مَا صارَ بِهِ اثْنَيْنِ.{وثِنْيُ الوُشاحِ:
