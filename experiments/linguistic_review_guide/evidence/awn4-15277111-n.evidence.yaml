          type: usage
          text: 'فُلانٌ طَلَّاعُ الثَّنايا : ساعٍ لِمَعالى الأُمورِ . وقيلَ : هو الجَلْدُ الَّذِي يَتَحَمَّلُ المَشاقَّ'
