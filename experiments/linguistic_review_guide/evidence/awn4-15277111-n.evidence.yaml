              text: |-
                ثنيثنَى يَثنِي، اثْنِ، ثَنْيًا، فهو ثانٍ، والمفعول مَثْنيّ• ثنَى الشَّيءَ: عطفه وردَّ بعضَه على بعض ° ثنى طَرْفه إليه: التفت- ثنى عِطْفَه: تكبَّر وأعرض.• ثنَى الثَّوبَ: طواه "ثنى ركبته- {أَلاَ إِنَّهُمْ يَثْنُونَ صُدُورَهُمْ لِيَسْتَخْفُوا مِنْهُ}: يطوونها على الكفر والعداوة"? لا يثني وجهه: يتمتع بالعزة والمنفعة.• ثنَى عِنانَ فرسِه: لوى وجهه ليخفِّف من سرعته.• ثنَى الشَّخصَ: صار له ثانيا "دخل الأول مستبشرًا وثناه الآخرُ".• ثنَاه عن الأمر: صرفه عنه، ردَّه وأبعده "مآسي الفلسطينييِّن الرهيبة لاتَثنيهم عن الدِّفاع عن وطنهم". 
                أثنى على يُثني، أثْنِ، إثناءً وثَناءً، فهو مُثْنٍ، والمفعول مُثْنًى عليه• أثنى على تلميذه: أطراه، مدحه ووصفه بخير "سعِدتُ كثيرًا عندما سمعت أستاذي يُثني على بحثي- بدأ الخطبة فحمد الله وأثنى عليه". 
                استثنى يستثني، استثنِ، استثناءً، فهو مستثنٍ،
                والمفعول مستثنًى• استثنى الشَّيءَ: أخرجه من قاعدة عامة أو حكم عامّ " {إِذْ أَقْسَمُوا لَيَصْرِمُنَّهَا مُصْبِحِينَ. وَلاَ يَسْتَثْنُونَ}: لم يقولوا: إن شاء الله".• استثنى فلانًا: أخرجه من حكم غيره "استثنى فلانًا من الدعوة". 
                انثنى/ انثنى على/ انثنى عن/ انثنى في ينثني، انْثَنِ، انثناءً، فهو مُنْثنٍ، والمفعول مُنْثَنًى عليه• انثنى الشَّيءُ: مُطاوع ثنَى: تقوَّس، انعطف وارتدَّ بعضُه على بعض "انثنى ظهرُه من الكِبَر- انثنى قضيبُ الحديد" ° إرادةٌ لا تنثني/ عزيمة لا تنثني: لا تضعف.• انثنى صدرُه على الحبِّ: انطوى.• انثنى عن خصمه: انصرف عنه، ابتعد، ارتدّ "انثنى عن عزمه".• انثنت في مِشْيتها: تمايلت وتبخترت. 
                تثنَّى/ تثنَّى في يتثنَّى، تَثَنَّ، تثنّيًا، فهو مُتثنٍّ، والمفعول مُتَثَنًّى فيه• تثنَّى الشَّجرُ ونحوُه: انثنى، تمايل، انعطف بعضُه على بعض "تثنَّت الأغصانُ" ° تثنّى عليه: توثَّب.• تثنَّت الفتاةُ في مشيتها: تمايلت وتبخترت "من أدب الطريق ألا تتثنَّى الفتاة في مشيتها". 
                ثنَّى/ ثنَّى بـ يثنِّي، ثَنِّ، تثنيةً، فهو مُثَنٍّ، والمفعول مُثنًّى• ثنَّى الشَّيءَ: جعله اثنين "ثنَّى مبلغًا".• ثنَّى العددَ: ضعَّفه.• ثنَّى الكلمةَ: (نح) ألحق بها علامة التثنية.• ثنَّى بالأمر: جاء به بعد شيء قبله "بدأ بحمد الله تعالى ثم ثنَّى بالصلاة على الرسول صلّى الله عليه وسلّم". 
                أَثْناء [جمع]: مف ثِنْي: ظرف زمان بمعنى خلال، يدل على تداخل حدثين أو أكثر، يُستعمل جمعًا غالبًا، ويَردُ مسبوقًا بـ (في) أحيانًا "تابع المسلسل الإذاعي في أثناء قيادته للسيارة" ° أثناء الكلام: أوساطه، خلاله- في هذه الأثناء: خلالها، في غضون ذلك، بين هذا الوقت ووقت آخر لاحق، في المدة الواقعة بين تاريخين أو زمنين أو حدثين. 
                إثناء [مفرد]: مصدر أثنى على. 
                إثنيَّة [مفرد]: (سة) عرقيَّة، مذهب يرمي إلى تصنيف الجماعات الإنسانية على أساس انتمائها إلى عرق أو أصل معيَّن، وتعرَف بالتمييز العنصري. 
                اثنا عشَريَّة [جمع]• الاثنا عشَريَّة: (سف) فرقة من الشِّيعة الإماميَّة يقولون باثني عشر إمامًا أولهم عليّ بن أبي طالب وآخرهم الإمام المنتظر. 
                اثناعَشَرَ [مفرد]: عدد مركب من اثنين وعشر يلي أحد عَشَر ويسبق ثلاثة عَشَر، يطابق المعدود تذكيرًا وتأنيثًا بجزأيه، والجزء الأول منه يعامل معاملة المثنَّى في الإعراب والثاني يظل مبنيًّا على الفتح لا محل له من الإعراب "عمر الطفلة اثنتا عشرة سنةً- اشتريت اثني عشر قلمًا- {وَبَعَثْنَا مِنْهُمُ اثْنَيْ عَشَرَ نَقِيبًا} ". 
                اثناعَشَريّ [مفرد]: اسم منسوب إلى اثنا عَشَرَ.• الاثنا عَشَريّ: (شر) أول جزء من الأمعاء الدَّقيقة مما يلي المعدة؛ سُمِّي بذلك لأن طوله نحو اثنتي عشرة إصبعًا. 
                اثنان [مثنى]: مؤ اثْنَتانِ وثِنْتان: اسم عدد أصلي فوق الواحد ودون الثلاثة،، لا مفردَ له من لفظه، يوافق المعدود في التذكير والتأنيث تركيبًا وعطفًا "حضر الندوة اثنان من الطلاب- اقتصرت زيارة المحافظ على مدينتين اثنتين- {شَهَادَةُ بَيْنِكُمْ إِذَا حَضَرَ أَحَدَكُمُ الْمَوْتُ حِينَ الْوَصِيَّةِ اثْنَانِ} " ° فلانٌ ثاني اثنين: أي هو أحدهما.• الإثنين: ثالث أيّام الأسبوع، يأتي بعد الأحد، ويليه الثُّلاثاء "ولد الرسول صلى الله عليه وسلم يوم الإثنين". 
                اثنينيَّة [مفرد]: اسم مؤنَّث منسوب إلى اثنين.• الاثنينيَّة:1 - (سف) النَّزعة القائلة بوجود جوهرين مختلفين هما المادَّة والروح.2 - كون الشَّيء الواحد مشتملاً على حدَّين متقابلين كتقابل الفكر والعمل، وتقابل الخيال والحقيقة. 
                استثناء [مفرد]:1 - مصدر استثنى ° بلا استثناء/ بدون استثناء: لايُستثنى أحد أو شيء.2 - إخراج من نطاق الحكم أو القاعدة، ميزة أو حصانة تمنح أو يتمتع بها فرد أو طبقة أو نظام "طالبت الهيئات الشعبيّة بإلغاء الاستثناءات في جميع الدوائر الحكوميّة".3 - (نح) ما دلّ على مخالفة بلفظ إلاّ أو إحدى أخواتها "حضر الطلاب إلا محمدًا- ألا كلُّ شيءٍ ما خلا اللهَ باطلٌ ... وكُلُّ نعيم لا محالة زائلُ". 
                استثنائيّ [مفرد]: اسم منسوب إلى استثناء: غير معتاد، شاذ، طارئ "قام المجلس بعقد جلسة استثنائيَّة لمناقشة المشكلات- لا يصح اتِّخاذ الحالات الاستثنائيّة مقياسًا للحكم العام". 
                استثنائيَّة [مفرد]:1 - اسم مؤنَّث منسوب إلى استثناء: "حصلت الشركة على امتيازات استثنائيّة- جَلْسة/ دورة استثنائيَّة".2 - مصدر صناعيّ من استثناء: حالة نادرة تخرج عن الإطار العام المتعارف عليه لشيءٍ ما، غير عاديّة.• استثنائيَّة الحدث: أهمِّيَّته وعدم توقُّعه.• المحكمة الاستثنائيَّة: (قن) محكمة عسكريّة، غايتها الحفاظ على أمن الدولة في حالات استثنائيّة، وهي تفرض أحكامًا عسكريّة على المدنيِّين "دعت الصحف لإلغاء المحاكم الاستثنائيّة". 
                انثناء [مفرد]: مصدر انثنى/ انثنى على/ انثنى عن/ انثنى في. 
                تَثْنية [مفرد]: مصدر ثنَّى/ ثنَّى بـ. 
                ثانٍ [مفرد]:1 - اسم فاعل من ثنَى.2 - عدد ترتيبيّ يوصف به يدل على فرد واحد جاء ثانيًا، ما بعد الواحد وقبل الثالث "نُقل إلى الصفِّ الثاني- الطابق الثاني" ° ثانيًا: الواقع بعد الأوَّل، ويستعمل في العدّ، فيقال: أولاً، ثانيًا، ... - حَرْق من الدَّرجة الثَّانية: حرق يقرّح الجلد، أخطر من حرق الدرجة الأولى- ملازم ثان: رتبة عسكرية بين ملازم أوّل ونقيب.• الثَّاني عَشَر: عدد ترتيبيّ يوصف به، يلي الحادي عَشَر ويسبق الثَّالث عَشَر مبني على فتح الجزأين "القرن الثاني عشر الهجري".• ثاني أكسيد الكربون: (كم) غاز عديم اللون والرائحة يتشكل نتيجة التنفس والاحتراق والتحلّل العضويّ، يدخل في صناعة المشروبات الغازيّة، كما يستخدم لإخماد الحرائق.• ثاني اثنين: أحدُهما، ما أو من يضاف إلى واحد فيصيّره اثنين " {ثَانِيَ اثْنَيْنِ إِذْ هُمَا فِي الْغَارِ} ". 
                ثانويّ [مفرد]: مؤ ثانويَّة: اسم منسوب إلى ثانٍ: ما يلي الأول في الدرجة والمرتبة، ليس له الأهمية الأولى "قمت بدور ثانويّ- مسائل ثانويّة" ° لَوْنٌ ثانويّ: لون يُشَكَّل بمزج لونين أساسيَّين بنسب متساوية تقريبًا.• تعليم ثانويّ: مرحلة تعليميَّة بعد الإعداديَّة في بعض البلاد العربية، أو المتوسطة في بعض آخر وتُعِدّ للتعليم الجامعي? شهادة ثانوية: شهادة إتمام التعليم الثانويّ- مَدْرسَة ثانويَّة: مَدْرسَة تُعِدُّ للتعليم الجامعي.• عمًى ثانويّ: (طب) شكل من عمَى الألوان يتَّسم بعدم تمييز اللون الأخضر. 
                ثانية1 [مفرد]: ج ثوانٍ:1 - وحدة زمنية تساوي جزءًا من ستين جزءًا من الدقيقة "ماهي إلا ثوانٍ حتى بدأ يتنفس من جديد- انتظر ثانية واحدة".2 - وقت بالغ القصر "ثانية واحدة من فضلك- دَقَّاتُ قلب المرء قائلة له ... إن الحياة دَقائِقٌ وثواني". 
                ثانية2 [مفرد]:1 - صيغة المؤنَّث لفاعل ثنَى.2 - أخرى، وأكثر ما تستعمل فيما له ثالث "مرة/ عضلة ثانية- الصفحة الثانية- العادة طبيعة ثانية [مثل أجنبيّ]: يقابله المثل العربيّ: مَنْ شَبَّ على خُلُقٍ شابَ عليه". 
                ثَناء [مفرد]: ج ثناءات وأثنية:1 - مصدر أثنى على.2 - مَدْح، تقريظ "حُبّ الثناء طبيعة الإنسان- ليس الكريم الذي يعطي عطيَّته ... عن الثناء وإن أغلى به الثمنا- إِذَا صَلَّى أَحَدُكُمْ فَلْيَبْدَأْ بِتَحْمِيدِ اللهِ وَالثَّنَاءِ عَلَيْهِ [حديث] " ° أثنى عليه ثناءً عَطِرًا/ أثنى عليه عاطِرَ الثَّناء: بالغ في مدحه وإطرائه- أحسن الثَّناءَ.3 - صيت، شُهْرة، سمعة حسنة "فلان طيّب الثناء". 
                ثُناءَ [مفرد]: اثنين اثنين، معدول عن اثنين اثنين بالتكرار، يستوي فيها المذكر والمؤنث، وهي ممنوعة من الصرف "جاءوا ثُناءَ". 
                ثُنائيّ [مفرد]: مؤ ثُنائيَّة: اسم منسوب إلى ثُناءَ: ما كان له ركنان أو جزءان أو شقّان "مؤتمر ثنائيّ: يضمّ ممثلين عن دولتين فقط" ° اتِّفاق ثُنائيّ: ما كان بين فريقين- ثُنائيّ الاتّجاه: طريق باتّجاهين- ثُنائيّ البعد: كلّ ما تتحدّد نُقَطُه ببعدين كالسطح، ذو بعدين- ثُنائيّ الجنس: خُنثى- ثُنائيّ الوجه: ذو وجهين أو سطحين- حِلْف ثنائيّ: بين طرفين أو دولتين- عَقْد ثنائيّ: عقد يتمّ بين شخصين ويلزمهما- معاهدة ثنائيّة: معاهدة بين دولتين أو طرفين.• حديث ثنائيّ الإسناد: (حد) حديث نقل عن الرسول صلى الله عليه وسلم بواسطة سلسلتين من رُواة الحديث أو عن طريقين من طرق الإسناد.• النَّجم الثُّنائيّ: (فك) نظام نجميّ يحتوي على نجمتين تدوران حول المركز نفسه وتظهران كنجم واحد.• مركَّب ثنائيّ: (كم) مصطلح يطلق على اتِّحاد كيميائي يحتوي على عنصرين.• عنصر ثنائيّ الذَّرّة: (كم) عنصر يتركب جزءاه من ذرَّتيْن.• ثنائيّ المعدن: (كم) متكوِّن من معدنين مرتبطين مع بعضهما عادة، ولهما نسب مختلفة في التمدُّد الحراريّ.• ثُنائيّ اللُّغة:1 - (لغ) من يتكلّم لغتين على مستوًى واحد.2 - صفة للنصوص أو المعاجم التي تُستخدم فيها لغتان، كالقواميس الإنجليزيَّة العربيَّة أو العكس "اشتريت معجمًا ثنائيّ اللغة: إنجليزيّ- عربيّ".• لفظ ثُنائيّ: (لغ) ذو حرفين. 
                ثُنائيَّة [مفرد]:1 - اسم مؤنَّث منسوب إلى ثُناء.2 - مصدر صناعيّ من ثُناءَ.• الثُّنائيَّة: (سف) فكرة تذهب في تفسير العالم إلى القول بمبدأين متقابلين كالخير والشرّ عند الثَّنوية والنَّفس والجسم عند ديكارت، تقابلها الأحاديَّة "ثنائية المادة والروح".• الثُّنائيَّة اللُّغويَّة:1 - تعبير يقصد به الكتابة بلغة والتّكلم بلغة أخرى.2 - (لغ) مصطلح يُطلق على استعمال لغتين أو تعايشهما جنبًا إلى جنب في مجتمع معيَّن مثل بعض دول إفريقية التي تتكلم السَّواحيليَّة والإنكليزيَّة، أو السَّواحيليَّة والفرنسيَّة.3 - (لغ) مصطلح يُطلق على ظاهرة الازدواج اللُّغويّ أي الفصحى والعاميّة.• ثنائيَّة اللَّون: كون الشيء ذا لونين.• قمة ثنائيَّة: اجتماع يعقد بين رئيسيّ دولتين. 
                ثَنَويّة [مفرد]• الثَّنَويَّة:1 - (سف) المانوية، وهي فرقة ترى أن العالم يُحكم بواسطة قوتين متضادتين، هما الخير والشرّ مع اعتقاد بوجود إلهين للكون.2 - مفهوم يرى أن الإنسان مؤلَّف من طبيعتين أساسيتين هما الجسديَّة والروحيّة. 
                ثَنْي [مفرد]: مصدر ثنَى. 
                ثِنْي [مفرد]: ج أثناء• الثِّني من اللَّيل: جزء منه، ساعة منه.• الثِّني من النِّساء: من ولدت مرتين.• الثِّني من الحبل:1 - ما تعوَّج منه.2 - أحد طرفيه.• الثِّني من الوادي: منعطفه.• الثِّني من الثَّوب: ما ثني من أطرافه "وضعت الطلب ثني كتابي: داخله". 
                ثَنْية [مفرد]: ج ثَنَيات وثَنْيات:1 - اسم مرَّة من ثنَى.2 - خطّ ناتج عن الكيّ أو الطيّ أو التجعُّد. 
                ثَنِيَّة [مفرد]: ج ثَنِيّات وثَنَايا:1 - إحدى الأسنان الأربع في مقدَّم الفمّ، ثِنتان من فوق وثِنتان من تحت "تظهر ثنيَّتا الطفل في الشهر الخامس" ° طلاّع الثّنايا: مجرّب للأمور يُحسن تدبيرها بمعرفته وجودة رأيه، جَلْد يتحمل المشاقّ أو ساعٍ لمعالي الأمور.2 - طريق في الجبل "طلع البدر علينا ... من ثَنِيّاتِ الودَاع".• ثنايا الشَّيء: داخله، طيّاته "في ثنايا صدره/ فكره/ الكتاب". 
                مَثانٍ [جمع]: مف مثنى: آيات تُتلى وتُكرَّر، آيات
                القرآن " {كِتَابًا مُتَشَابِهًا مَثَانِيَ} ".• المثاني: من أسماء القرآن الكريم لما فيه من قصص الماضين، ولتكرار القصص والمواعظ فيه.• مثاني الشيء: قواه وطاقاته.• السَّبع المثاني:1 - فاتحةُ الكتاب " {وَلَقَدْ ءَاتَيْنَاكَ سَبْعًا مِنَ الْمَثَانِي} ".2 - طوال السُّور " {وَلَقَدْ ءَاتَيْنَاكَ سَبْعًا مِنَ الْمَثَانِي} ". 
                مُثَنًّى [مفرد]: اسم مفعول من ثنَّى/ ثنَّى بـ.• المثنَّى: (نح) صيغة دالَّة على اثنين أو اثنتين، تغنى عن المتعاطفين، بإضافة ألف ونون أو ياء ونون إلى المفرد "حضَر الرجلان- سلّمتُ على الرجلين". 
                مَثْنَويّ [مفرد]: ج مثنويّات: اسم منسوب إلى مَثْنَى: على غير قياس.• المثنويّ من الشِّعْر: ما كان كل شطرين بقافية واحدة "قرأت مثنويات جلال الدين الروميّ في التصوف". 
                مَثْنَى [مفرد]: ج مثانٍ: ثُناءَ، اثنين اثنين، معدول عن اثنين اثنين بالتكرار، يستوي فيها المذكر والمؤنث، وهي ممنوعة من الصرف " {أَنْ تَقُومُوا لِلَّهِ مَثْنَى وَفُرَادَى} - {جَاعِلِ الْمَلاَئِكَةِ رُسُلاً أُولِي أَجْنِحَةٍ مَثْنَى وَثُلاَثَ وَرُبَاعَ} ". 
                مُستثنًى [مفرد]: ج مستثنيات: اسم مفعول من استثنى.• المستثنى: (نح) اسم يُذكر بعد إلاّ أو إحدى أخواتها مخالفًا في الحكم لما قبلها.
