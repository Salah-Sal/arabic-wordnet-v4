            definitions_text: |-
              [ثني] الثِنايَةُ: حبلٌ من شعر أو صوف. قال الراجز:
              والحجر الاخشن والثناية * وأما الثناء ممدود فعِقالُ البعير ونحوِ ذلك من حبل مثنى. وكل واحد من تثييه فهو ثناء لو أفرد. تقول: عقلت البعير بثنا يين، إذا عقلْتَ يديه جميعاً بحبلٍ أو بطرفي حبل. وإنما لم يهمز لانه لفظ جاء مثنى لا يفرد واحده فيقال ثناء، فتركت الياء على الاصل، كما فعلوا في مذروين لان أصل الهمزة في ثناء لو أفرد ياء، لانه من ثنيت، ولو أفرد واحده لقيل ثناءان كما تقول: كساءان ورداءان. والثنى: واحد أثناء الشئ، أي تضاعيفه. تقول: أنفذت كذا في ثنى كتابي، أي في طيِّه. قال أبو عبيد: والثنْيُ من الوادي والجبل: منعطفه. وثِنْيُ الحبلِ: ما ثَنَيْتَ. قال طَرَفة: لَعَمْرِكَ إنَّ الموتَ ما أَخْطأَ الفَتى * لَكا لِطَولِ المُرْخى وثِنْياهُ باليَدِ والثِنْيُ أيضاً من النوق: التي وضعتْ بطْنَيْنِ. وثِنْيُها: ولدها، وكذلك المرأة. ولا يقال ثِلْثُ ولا فوقَ ذلك. والثِني مقصورٌ: الأمر يعاد مرَّتينِ. وفي الحديث: " لا ثني في الصدَقة " أي لا تؤخذ في السنة مرتين. قال الشاعر : أفى جنب بكر قطعتني ملامة * لعمري لقد كانت ملامتها ثنى (*) والثنيا بالضم: الاسم من الاسْتِثناءِ، وكذلك الثَنْوي بالفتح. ويقال: جاءوا مَثْنى مَثْنى، أي اثنين اثنين، ومثنى وثناء غير مصروفين، لما قلناه في ثلاث من باب الثاء. وقال أبو عبيدة: مثنى الأيادي، هي الأنصباء التي كانت تَفْضُلُ من الجَزورِ في الميسر، فكان الرجلُ الجواد يشتريها فيعطيها الأَبْرامَ. وقال أبو عمرو: مَثْنى الأَيادي: أن يأخذ القِسْمَ مرّةً بعد مرّةٍ. قال النابغة: أَنِّي أُتَمِّمُ أَيْساري وأَمْنَحُهُمْ * مَثْنَى الأَيادي وأكسو الجفنة الادما وفى الحديث: " من أشراط الساعة أن توضع الاخيار وترفع الاشرار، وأن تقرأ المثناة على رءوس الناس فلا تغير "، يقال هي التى تسمى بالفارسية دوبيتى، وهو الغناء. وكان أبو عبيد يذهب في تأويله إلى غير هذا. وثنيت الشئ ثنيا: عطفته. وثناه، أي كفه. يقال: جاء ثانياً من عنانه. وثَنَيْتُهُ أيضاً: صرفته عن حاجته، وكذلك إذا صرتَ له ثانياً. وثَنَّيْتُهُ تَثْنيَةً، أي جَعلتُه اثنين. والثُنْيانُ بالضم: الذي يكون دون السَيِّدِ في المرتبة، والجمع ثِنْيَةٌ. قال الأعشى: طويلُ اليدين رَهْطُهُ غيرُ ثِنْيَةٍ * أَشَمُّ كريمٌ جارُهُ لا يُرَهَّقُ وفلان ثِنْيَةُ أهلِ بيته، أي أرذلُهم. والثُنْيُ والثنْيُ، بضم الثاء وكسرها، مثل الثُنْيانِ. قال أوس بن مغراء: ترى ثنانا إذا ما جاء بدءهم * وبدؤهم إن أتانا كان ثنيانا ورواه اليزدى: " ثنياننا إن أتاهم ". والثنية: واحدة والثنايا من السن. والثَنيَّةُ: طريق العقبة، ومنه قولهم: فلانٌ طَلاَّع الثَنايا، إذا كان سامياً لمعالي الأمور، كما يقال طَلاَّعُ أَنْجُدٍ. والثَنيُّ: الذي يلقى ثنيته، ويكون ذلك في الظلف والحافر في السنة الثالثة، وفى الخف (*) في السنة السادسة. والجمع ثنيان وثناء، والانثى ثَنِيَّةٌ، والجمع ثَنِيَّاتٌ. واثنان من عدد المذكر واثنتان للمؤنّث، وفي المؤنث لغة أخرى: ثنتان بحذف الالف. ولو جاز أن يفرد لكان واحده اثن واثنة، مثل ابن وابنة. وألفه ألف وصل. وقد قطعها الشاعر على التوهم فقال: ألا لا أرى إثنين أحسن شيمة * على حدثان الدهر منى ومن جمل وقال قيس بن الخطيم: إذا جاوزَ الاثنين سِرٌّ فإنّه * بِنَثٍّ وتكثير الوشاة قمين ويوم الاثْنَينِ لا يُثَنَّى ولا يجمع، لانه مثنى ; فإن أحببت أن تجمعه كأنه صفة للواحد قلت أثا نين. وقولهم: هذا ثانى اثْنَيْنِ، أي هو أحد الاثنين. وكذلك ثالث ثلاثة مضاف، إلى العشرة، ولا ينون. فإن اختلفا فأنت بالخيار: إن شئت أضفت، وإن شئت نونت وقلت هذا ثانى واحد وثان واحدا. المعنى: هذا ثنى واحدا. وكذلك ثالث اثنين على ما فسرناه في باب الثاء. والعدد منصوب ما بين أحد عشر إلى تسعة عشر، في الرفع والنصب والخفض، إلا اثنى عشر فإنك تعربه على هجاءين. وتقول للمؤنث: اثْنَتانِ وإن شئت ثنتان ; لان الالف إنما اجتلبت لسكون الثاء، فلما تحركتْ سقطتْ. ولو سًمِّيَ رجلٌ باثْنَيْنِ أو باثْنَي عَشَرَ لقلت في النسبة إليه ثنوى، في قول من قال في ابن بنوى، واثنى في قول من قال ابني. وأما قول الراجز: كأن خصييه من التدلدل * ظرف عجوز فيه ثنتا حنظل فأراد أن يقول: فيه حنظلتان فلم يمكنه، فأخرج الاثنين مخرج سائر الاعداد للضرورة، وأضافه إلى ما بعده، وأراد ثنتان من حنظل، كما يقال ثلاثة دراهم وأربعة دراهم. وكان حقه في الاصل أن يقال اثنا دراهم واثنتا نسوة، إلا أنهم اقتصروا بقولهم درهمان وامرأتان عن إضافتهما إلى ما بعدهما. وانثنى، أي انعطف. وكذلك اثنونى، على افعوعل. وأثنى عليه خيرا، والاسم الثَناءُ. وأثْنَى، أي ألقَى ثَنيَّتَهُ. وتَثَنَّى في مشيته: تأوَّد. والمَثاني من القرآن: ما كان أقلَّ من المائتين. وتسمى فاتحة الكتاب مَثَانِيَ لأنّها تُثَنّى في كلِّ ركعة. ويسمّى جميعُ القرآن مَثانيَ أيضاً لاقترانِ آية الرحمة بآية العذاب.
