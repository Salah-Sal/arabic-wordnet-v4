              text: 'ث ن ي: (الثِّنَى) مَقْصُورًا الْأَمْرُ يُعَادُ مَرَّتَيْنِ. وَفِي الْحَدِيثِ: «لَا ثِنَى فِي الصَّدَقَةِ»
                أَيْ لَا تُؤْخَذُ فِي السَّنَةِ مَرَّتَيْنِ. وَ (الثُّنْيَا) بِالضَّمِّ اسْمٌ مِنَ (الِاسْتِثْنَاءِ) وَكَذَلِكَ
                (الثَّنْوَى) بِالْفَتْحِ. وَجَاءُوا (مَثْنَى مَثْنَى) أَيِ اثْنَيْنِ اثْنَيْنِ وَ (مَثْنَى وَثُنَاءَ) غَيْرُ
                مَصْرُوفَيْنِ كَمَثْلَثَ وَثُلَاثَ وَقَدْسَبَقَ تَعْلِيلُهُ فِي [ث ل ث] . وَفِي الْحَدِيثِ: «مِنْ أَشْرَاطِ
                السَّاعَةِ أَنْ تُوضَعَ الْأَخْيَارُ وَتُرْفَعَ الْأَشْرَارُ وَأَنْ تُقْرَأَ (الْمَثْنَاةُ) عَلَى رُءُوسِ
                النَّاسِ فَلَا تُغَيَّرُ» قِيلَ: هِيَ الَّتِي تُسَمَّى بِالْفَارِسِيَّةِ دُو بَيْتِي وَهُوَ الْغِنَاءُ. وَكَانَ
                أَبُو عُبَيْدٍ يَذْهَبُ فِي تَأْوِيلِهِ إِلَى غَيْرِ هَذَا. قُلْتُ: ذَكَرَ فِي التَّهْذِيبِ أَنَّ الْحَدِيثَ
                عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ رَضِيَ اللَّهُ تَعَالَى عَنْهُمَا، وَفَسَّرَهُ لِمَا سُئِلَ عَنْهُ بِمَا اسْتُكْتِبَ
                مِنْ غَيْرِ كِتَابِ اللَّهِ تَعَالَى. وَقَالَ أَبُو عُبَيْدَةَ: قِيلَ إِنَّ الْأَحْبَارَ وَالرُّهْبَانَ بَعْدَ
                مُوسَى عَلَيْهِ السَّلَامُ وَضَعُوا كِتَابًا فِيمَا بَيْنَهُمْ عَلَى مَا أَرَادُوا مِنْ غَيْرِ كِتَابِ اللَّهِ
                تَعَالَى فَهُوَ الْمَثْنَاةُ. فَكَأَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا كَرِهَ الْأَخْذَ
                عَنْ أَهْلِ الْكِتَابِ وَلَمْ يُرِدْ بِهِ النَّهْيَ عَنْ حَدِيثِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ
                وَسَنَّتِهِ. وَكَيْفَ يَنْهَى عَنْ ذَلِكَ وَهُوَ مِنْ أَكْثَرِ أَصْحَابِهِ حَدِيثًا عَنْهُ؟. وَ (ثَنَى) الشَّيْءَ
                عَطَفَهُ وَبَابُهُ رَمَى وَ (ثَنَاهُ) أَيْضًا كَفَّهُ، وَثَنَاهُ صَرَفَهُ عَنْ حَاجَتِهِ، وَثَنَاهُ صَارَ
                لَهُ ثَانِيًا وَ (ثَنَّاهُ تَثْنِيَةً) جَعَلَهُ اثْنَيْنِ. وَ (الثَّنِيَّةُ) وَاحِدَةُ (الثَّنَايَا) مِنَ
                السِّنِّ، وَهِيَ أَيْضًا طَرِيقُ الْعَقَبَةِ. وَ (الثَّنِيُّ) الَّذِي يُلْقِي ثَنِيَّتَهُ وَيَكُونُ ذَلِكَ
                فِي الظِّلْفِ وَالْحَافِرِ فِي السَّنَةِ الثَّالِثَةِ وَفِي الْخُفِّ فِي السَّنَةِ السَّادِسَةِ وَالْجَمْعُ
                (ثُنْيَانٌ) وَ (ثِنَاءٌ) وَالْأُنْثَى (ثَنِيَّةٌ) وَالْجَمْعُ (ثَنِيَّاتٌ) . وَ (اثْنَانِ) مِنْ عَدَدِ الْمُذَكَّرِ
                وَ (اثْنَتَانِ) لِلْمُؤَنَّثِ وَ (ثِنْتَانِ) أَيْضًا بِحَذْفِ الْأَلِفِ. وَأَلِفُهُمَا أَلِفُ وَصْلٍ وَقَدْ
                تُقْطَعُ فِي الشِّعْرِ. وَ (يَوْمَ الِاثْنَيْنِ) لَا يُثَنَّى وَلَا يُجْمَعُ لِأَنَّهُ مُثَنَّى فَإِنْ جَمَعْتَهُ
                قُلْتَ: (أَثَانِينَ) وَقَوْلُهُمْ: هُوَ (ثَانِي اثْنَيْنِ) أَيْ أَحَدُ الِاثْنَيْنِ، وَكَذَا ثَالِثُ ثَلَاثَةٍ
                بِالْإِضَافَةِ إِلَى الْعَشَرَةِ وَلَا يُنَوَّنُ فَإِنِ اخْتَلَفَا فَإِنْ شِئْتَ أَضَفْتَ وَإِنْ شِئْتَ نَوَّنْتَ،
                فَقُلْتَ: هَذَا ثَانِي وَاحِدٍ وَثَانٍ وَاحِدًا وَكَذَا الْبَاقِي. وَ (انْثَنَى) انْعَطَفَ وَ (أَثْنَى) عَلَيْهِ
                خَيْرًا وَالِاسْمُ (الثَّنَاءُ) وَ (أَثْنَى) أَلْقَى ثَنِيَّتَهُ وَ (تَثَنَّى) فِي مَشْيِهِ. وَ (الْمَثَانِي)
                مِنَ الْقُرْآنِ مَا كَانَ أَقَلَّ مِنَ الْمِئِينَ وَتُسَمَّى فَاتِحَةُ الْكِتَابِ (مَثَانِيَ) لِأَنَّهَا تُثَنَّى
                فِي كُلِّ رَكْعَةٍ وَيُسَمَّى جَمِيعُ الْقُرْآنِ (مَثَانِيَ) أَيْضًا لِاقْتِرَانِ آيَةِ الرَّحْمَةِ بِآيَةِ
                الْعَذَابِ.'
