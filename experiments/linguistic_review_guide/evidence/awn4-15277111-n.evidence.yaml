      - entry_id: 69842
        dictionary_id: 2
        headword: المُثَنَّى
        headword_bare: المثنى
        headword_norm: المثني
        root: ثني
        root_source: ocr
        pos: noun
        form: null
        is_partial: 1
        definitions_text: '( فى علم الصَّرْف ) : مادَلَّ على اثْنَيْنِ مُطْلَقاً بزيادة ألف ونون , أو ياء ونون علم لغير واحد
          , منهم : المُثنى بن حارِثَة بن سَلَمَة الشَّيْبانِي : صحابى , أَمَّره أبو بَكْرٍ على قَوْمِهِ وبَعَثَه إلى العراق
          في صَدْر خِلافَتِهِ , وأَمَدَّه بخالِدِ بن الوليد , فأبْلَى في حُرُوبِ العراق بلاءً حَسَناً لَقَبُ الحَسَن بن الحَسَن
          بن علىّ بن أبى طالب نحو ( ٩٠ هـ = ٧٠٨ م ) : وُلِدَ وتُوُفِّى بالمدينة , وكان كَبِيرَ الطالِبِيِّينَ فى عهده , اتُّهِمَ
          بمُكاتَبَة أهْلِ العِراق , وَأَنَّهُم'
