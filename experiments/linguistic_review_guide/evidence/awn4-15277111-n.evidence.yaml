          - entry_id: 371887
            dictionary_id: 52
            headword: ثنائي
            headword_bare: ثنائي
            headword_norm: ثنائي
            root: ثن
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'يعني الوصف ''ثنائي'': تكوّن الشيء من جزئين. ويُقصد بالنظام الثنائي في مجال تكنولوجيا الكمبيوتر
              عرض الرمز الواحد من خلال حالتين متجاورتين. وبوجه عام تُعرف الأنظمة، التي تستخدم حالتين فقط في عرض الرموز والعلامات،
              بالأنظمة ثنائية القيمة أو الأنظمة الثنائية. ويمكن أن تتم طريقة العرض هذه على هيئة ''ثقوب - لاثقوب'' على شريط
              المعلومات المُثقب، أو ''تيار - لاتيار'' في الدائرة الكهربائية، أو ''فلطية - لافلطية'' في الرقاقة، أو على هيئة
              أشكال أخرى عديدة.'
            translation_en: binary
            translation_fr: binaire
            domain: Automotive Engineering
            external_id: arabterm:87581
