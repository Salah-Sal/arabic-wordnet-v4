            definitions_text: |-
              ثنى وَقَالَ [أَبُو عبيد -] : فِي حَدِيثه عَلَيْهِ السَّلَام: لَا ثِنَى فِي الصَّدَقَة. قَالَ الْأَصْمَعِي: هُوَ مَقْصُور بِكَسْر الثَّاء - يَعْنِي لَا تُؤْخَذ فِي السّنة مرَّتَيْنِ وقَالَ الْكسَائي فِي الثِنَى مثله. قَالَ أَبُو عبيد: وقَالَ فِي ذَلِك كَعْب بْن زُهَيْر أَو معن بن أَوْس يذكر امْرَأَته وَكَانَت لامَتْه فِي بكر نَحره فَقَالَ: [الطَّوِيل]
              أَفِي جَنْبِ بَكْرِ قَطَّعَتْنِي مَلامةً ... لَعَمْرِي لقد كَانَت ملامتها ثنى
              يَقُول: لَيْسَ هَذَا بِأول لومها قد فعلته قبل هَذَا وَهَذَا ثنى بعده.
