              text: "ثني: ثَنَى الشيءَ ثَنْياً: ردَّ بعضه على بعض، وقد تَثَنَّى وانْثَنَى.\nوأَثْناؤُه ومَثانِيه: قُواه وطاقاته،\
                \ واحدها ثِنْي ومَثْناة ومِثْناة؛\nعن ثعلب. وأَثْناء الحَيَّة: مَطاوِيها إِذا تَحَوَّتْ. وثِنْي الحيّة:\n\
                انْثناؤُها، وهو أَيضاً ما تَعَوَّج منها إِذا تثنت، والجمع أَثْناء؛\nواستعارة غيلان الرَّبَعِي لليل فقال:\n\
                حتى إِذا شَقَّ بَهِيمَ الظَّلْماءْ،\nوساقَ لَيْلاً مُرْجَحِنَّ الأَثْناءْ\nوهو على القول الآخر اسم. وفي صفة\
                \ سيدنا رسول الله، صلى الله عليه وسلم:\nليسَ بالطويل المُتَثَنّي؛ هو الذاهب طولاً، وأَكثر ما يستعمل في طويل\n\
                لا عَرْض له. وأَثْناء الوادِي: مَعاطِفُه وأَجْراعُه. والثِّنْي من\nالوادي والجبل: مُنْقَطَعُه. ومَثاني الوادي\
                \ ومَحانِيهِ: مَعاطِفُه. وتَثَنَّى\nفي مِشيته. والثِّنْي: واحد أَثْناء الشيء أَي تضاعيفه؛ تقول: أَنفذت\nكذا\
                \ ثِنْيَ كتابي أَي في طَيّه. وفي حديث عائشة تصف أَباها، رضي الله\nعنهما: فأَخذ بطَرَفَيْه ورَبَّقَ لكُمْ أَثْناءَه\
                \ أَي ما انْثَنَى منه،\nواحدها ثِنْيٌ، وهي معاطف الثوب وتضاعيفه. وفي حديث أَبي هريرة: كان يَثْنِيه\nعليه أَثْناءً\
                \ من سَعَتِه، يعني ثوبه. وثَنَيْت الشيء ثَنْياً: عطفته.\nوثَناه أَي كَفَّه. ويقال: جاء ثانياً من عِنانه. وثَنَيْته\
                \ أَيضاً:\nصَرَفته عن حاجته، وكذلك إِذا صرت له ثانياً. وثَنَّيْته تَثْنِية أَي جعلته\nاثنين. وأَثْناءُ الوِشاح:\
                \ ما انْثنَى منه؛ ومنه قوله:\nتَعَرُّض أَثْناء الوِشاح المُفَصَّل\n(* البيت لامرئ القيس من معلقته).\nوقوله:\n\
                فإِن عُدَّ من مَجْدٍ قديمٍ لِمَعْشَر،\nفَقَوْمي بهم تُثْنَى هُناك الأَصابع\nيعني أَنهم الخيار المعدودون؛ عن\
                \ ابن الأَعرابي، لأَن الخيار لا يكثرون.\nوشاة ثانِيَةٌ بَيِّنة الثِّنْي: تَثْني عنقها لغير علة. وثَنَى رجله\
                \ عن\nدابته: ضمها إِلى فخذه فنزل، ويقال للرجل إِذا نزل عن دابته. الليث:\nإِذا أَراد الرجل وجهاً فصرفته عن\
                \ وجهه قلت ثَنَيْته ثَنْياً. ويقال: فلان\nلا يُثْنى عن قِرْنِه ولا عن وجْهه، قال: وإِذا فعل الرجل أَمراً ثم\
                \ ضم\nإِليه أَمراً آخر قيل ثَنَّى بالأَمر الثاني يُثَنِّي تَثْنِية. وفي حديث\nالدعاء: من قال عقيب الصلاة وهو\
                \ ثانٍ رِجْلَه أَي عاطفٌ رجله في التشهد\nقبل أَن ينهَض. وفي حديث آخر: من قال قبل أَن يَثْنيَ رِجْلَه؛ قال\
                \ ابن\nالأَثير: وهذا ضد الأَول في اللفظ ومثله في المعنى، لأَنه أَراد قبل أَن\nيصرف رجله عن حالتها التي هي\
                \ عليها في التشهد. وفي التنزيل العزيز: أَلا\nإِنهم يَثْنُون صُدورَهم؛ قال الفراء: نزلت في بعض من كان يلقى\
                \ النبي، صلى\nالله عليه وسلم، بما يحب ويَنْطَوِي له على العداوة والبُغْض، فذلك\nالثَّنْيُ الإِخْفاءُ؛ وقال\
                \ الزجاج: يَثْنُون صدورهم أَي يسرّون عداوة النبي،\nصلى الله عليه وسلم؛ وقال غيره: يَثْنُون صدورهم يُجِنُّون\
                \ ويَطْوُون ما\nفيها ويسترونه استخفاء من الله بذلك. وروي عن ابن عباس أَنه قرأَ: أَلا\nإِنَّهم تَثْنَوْني صدورهم،\
                \ قال: وهو في العربية تَنْثَني، وهو من الفِعل\nافعَوْعَلْت. قال أَبو منصور: وأَصله من ثَنَيت الشيء إِذا حَنَيْته\n\
                وعَطَفته وطويته. وانْثَنى أَي انْعطف، وكذلك اثْنَوْنَى على افْعَوْعَل.\nواثْنَوْنَى صدره على البغضاء أَي انحنى\
                \ وانطوى. وكل شيء عطفته فقد ثنيته.\nقال: وسمعت أَعرابيّاً يقول لراعي إِبل أَوردها الماءَ جملة فناداه: أَلا\n\
                واثْنِ وُجوهَها عن الماء ثم أَرْسِل مِنْها رِسْلاً رِسْلاً أَي قطيعاً،\nوأَراد بقوله اثْنِ وُجوهها أَي اصرف\
                \ وجوهها عن الماء كيلا تزدحم على\nالحوض فتهدمه. ويقال للفارس إِذا ثَنَى عنق دابته عند شدَّة حُضْرِه: جاء\n\
                ثانيَ العِنان. ويقال للفرس نفسه: جاء سابقاً ثانياً إِذا جاء وقد ثَنَى\nعنقه نَشاطاً لأَنه إِذا أَعيا مدّ عنقه،\
                \ وإِذا لم يجئ ولم يَجْهَد وجاء\nسيرُه عَفْواً غير مجهود ثَنى عنقه؛ ومنه قوله:\nومَن يَفْخَرْ بمثل أَبي وجَدِّي،\n\
                يَجِئْ قبل السوابق، وهْو ثاني\nأَي يجئ كالفرس السابق الذي قد ثَنى عنقه، ويجوز أَن يجعله كالفارس\nالذي سبق\
                \ فرسُه الخيل وهو مع ذلك قد ثَنى من عنقه.\nوالاثْنان: ضعف الواحد. فأَما قوله تعالى: وقال الله لا تتخذوا إِلَهين\n\
                اثنَين، فمن التطوّع المُشامِ للتوكيد، وذلك أَنه قد غَنِيَ بقوله\nإِلَهَيْن عن اثنين، وإِنما فائدته التوكيد\
                \ والتشديد؛ ونظيره قوله تعالى:\nومَنَاة الثالثةَ الأُخرى؛ أَكد بقولة الأُخرى، وقوله تعالى: فإِذا نُفخ في\n\
                الصور نفخةٌ واحدةٌ، فقد علم بقوله نفخة أَنها واحدة فأَكد بقوله واحدة،\nوالمؤنث الثِّنْتان، تاؤه مبدلة من ياء،\
                \ ويدل على أَنه من الياء أَنه من\nثنيت لأَن الاثنين قد ثني أَحدهما إِلى صاحبه، وأَصله ثَنَيٌ، يدلّك على\n\
                ذلك جمعهم إِياه على أَثْناء بمنزلة أَبناء وآخاءٍ، فنقلوه من فَعَلٍ إِلى\nفِعْلٍ كما فعلوا ذلك في بنت، وليس\
                \ في الكلام تاء مبدلة من الياء في غير\nافتعل إِلا ما حكاه سيبويه من قولهم أَسْنَتُوا، وما حكاه أَبو علي من\n\
                قولهم ثِنْتان، وقوله تعالى: فإِن كانتا اثْنَتين فلهما الثلثان؛ إِنما\nالفائدة في قوله اثنتين بعد قوله كانتا\
                \ تجردهما من معنى الصغر والكبر، وإِلا\nفقد علم أَن الأَلف في كانتا وغيرها من الأَفعال علامة التثنية. ويقال:\n\
                فلان ثاني اثْنَين أَي هو أَحدهما، مضاف، ولا يقال هو ثانٍ اثْنَين،\nبالتنوين، وقد تقدم مشبعاً في ترجمة ثلث.\
                \ وقولهم: هذا ثاني اثْنَين أَي هو\nأَحد اثنين، وكذلك ثالثُ ثلاثةٍ مضاف إِلى العشرة، ولا يُنَوَّن، فإِن\nاختلفا\
                \ فأَنت بالخيار، إِن شئت أَضفت، وإِن شئت نوّنت وقلت هذا ثاني واحد\nوثانٍ واحداً، المعنى هذا ثَنَّى واحداً،\
                \ وكذلك ثالثُ اثنين وثالثٌ اثنين،\nوالعدد منصوب ما بين أَحد عشر إِلى تسعة عشر في الرفع والنصب والخفض إِلا\n\
                اثني عشر فإِنك تعربه على هجاءين. قال ابن بري عند قول الجوهري والعدد\nمنصوب ما بين أَحد عشر إِلى تسعة عشر،\
                \ قال: صوابه أَن يقول والعدد مفتوح،\nقال: وتقول للمؤنث اثنتان، وإِن شئت ثنتان لأَن الأَلف إِنما اجتلبت لسكون\n\
                الثاء فلما تحركت سقطت. ولو سمي رجل باثْنين أَو باثْنَي عشر لقلت في\nالنسبة إِليه ثَنَوِيٌّ في قول من قال في\
                \ ابْنٍ بَنَوِيٌّ، واثْنِيٌّ في\nقول من قال ابْنِيٌّ؛ وأَما قول الشاعر:\nكأَنَّ خُصْيَيْه مِنَ التَّدَلْدُلِ\n\
                ظَرْفُ عجوزٍ فيه ثِنْتا حَنْظَلِ\nأَراد أَن يقول: فيه حنظلتان، فأَخرج الاثنين مخرج سائر الأَعداد\nللضرورة\
                \ وأَضافه إِلى ما بعده، وأَراد ثنتان من حنظل كما يقال ثلاثة دراهم\nوأَربعة دراهم، وكان حقه في الأَصل أَن يقول\
                \ اثنا دراهم واثنتا نسوة، إِلاَّ\nأَنهم اقتصروا بقولهم درهمان وامرأَتان عن إِضافتهما إِلى ما بعدهما.\nوروى\
                \ شمر بإِسناد له يبلغ عوف بن مالك أَنه سأَل النبي، صلى الله عليه وسلم،\nعن الإِمارة فقال: أَوَّلها مَلامة\
                \ وثِناؤُها نَدامة وثِلاثُها عذابٌ\nيومَ القيامة إِلاَّ مَنْ عَدَل؛ قال شمر: ثِناؤها أَي ثانيها، وثِلاثها\n\
                أَي ثالثها. قال: وأَما ثُناءُ وثُلاثُ فمصروفان عن ثلاثة ثلاثة واثنين\nاثنين، وكذلك رُباعُ ومَثْنَى؛ وأَنشد:\n\
                ولقد قَتَلْتُكُمُ ثُناءَ ومَوْحَداً،\nوتركتُ مُرَّةَ مثلَ أَمْسِ الدَّابِرِ\nوقال آخر:\nأُحاد ومَثْنَى أَضْعَفَتْها\
                \ صَواهِلُه\nالليث: اثنان اسمان لا يفردان قرينان، لا يقال لأَحدهما اثْنٌ كما أَن\nالثلاثة أَسماء مقترنة لا\
                \ تفرق، ويقال في التأْنيث اثْنَتان ولا يفردان،\nوالأَلف في اثنين أَلف وصل، وربما قالوا اثْنتان كما قالوا هي\
                \ ابنة فلان\nوهي بنته، والأَلف في الابنة أَلف وصل لا تظهر في اللفظ، والأَصل فيهما\nثَنَيٌ، والأَلف في اثنتين\
                \ أَلف وصل أَيضاً، فإِذا كانت هذه الأَلف مقطوعة\nفي الشعر فهو شاذ كما قال قيس بن الخَطِيم:\nإِذا جاوَزَ الإِثْنَيْن\
                \ سِرٌّ، فإِنه\nبِنثٍّ وتَكْثيرِ الوُشاةِ قَمِينُ\nغيره: واثنان من عدد المذكر، واثنتان للمؤنث، وفي المؤَنث\
                \ لغة أُخرى\nثنتان بحذف الأَلف، ولو جاز أَن يفرد لكان واحده اثن مثل ابن وابنة وأَلفه\nأَلف وصل، وقد قطعها\
                \ الشاعر على التوهم فقال:\nأَلا لا أَرى إِثْنَيْنِ أَحْسنَ شِيمةً،\nعلى حدثانِ الدهرِ، مني ومنْ جُمْل\nوالثَّنْي:\
                \ ضَمُّ واحد إِلى واحد، والثِّنْيُ الاسم، ويقال: ثِنْيُ\nالثوب لما كُفَّ من أَطرافه، وأَصل الثَّنْي الكَفّ.\
                \ وثَنَّى الشيءَ: جعله\nاثنين، واثَّنَى افتعل منه، أَصله اثْتنَى فقلبت الثاء تاء لأَن التاء آخت\nالثاء في\
                \ الهمس ثم أُدغمت فيها؛ قال:\nبَدا بِأَبي ثم اتَّنى بأَبي أَبي،\nوثَلَّثَ بالأَدْنَيْنَ ثَقْف المَحالب\n(*\
                \ قوله «ثقف المحالب» هو هكذا بالأصل).\nهذا هو المشهور في الاستعمال والقويّ في القياس، ومنهم من يقلب تاء\n\
                افتعل ثاء فيجعلها من لفظ الفاء قبلها فيقول اثَّنى واثَّرَدَ واثَّأَرَ، كما\nقال بعضهم في ادَّكر اذَّكر وفي\
                \ اصْطَلحوا اصَّلحوا. وهذا ثاني هذا أَي\nالذي شفعه. ولا يقال ثَنَيْته إِلاَّ أَن أَبا زيد قال: هو واحد فاثْنِه\n\
                أَي كن له ثانياً. وحكى ابن الأَعرابي أَيضاً: فلان لا يَثْني ولا\nيَثْلِثُ أَي هو رجل كبير فإِذا أَراد النُّهوض\
                \ لم يقدر في مرة ولا مرتين ولا\nفي الثالثة. وشَرِبْتُ اثْنَا القَدَح وشرِبت اثْنَيْ هذا القَدَح أَي\nاثنين\
                \ مِثلَه، وكذلك شربت اثْنَيْ مُدِّ البصرة، واثنين بِمدّه البصرة.\nوثَنَّيتُ الشيء: جعلته اثنين. وجاء القوم\
                \ مَثْنى مَثْنى أَي اثنين اثنين.\nوجاء القوم مَثْنى وثُلاثَ غير مصروفات لما تقدم في ث ل ث، وكذلك النسوة\n\
                وسائر الأَنواع، أَي اثنين اثنين وثنتين ثنتين. وفي حديث الصلاة صلاة\nالليل: مَثْنى مَثْنى أَي ركعتان ركعتان\
                \ بتشهد وتسليم، فهي ثُنائِِية لا\nرُباعية. ومَثْنَى: معدول من اثنين اثنين؛ وقوله أَنشده ابن الأَعرابي:\nفما\
                \ حَلَبَتْ إِلاَّ الثَّلاثة والثُّنَى،\nولا قَيَّلَتْ إِلاَّ قريباً مَقالُها\nقال: أَراد بالثلاثة الثلاثة\
                \ من الآنية، وبالثُّنَى الاثنين؛ وقول كثير\nعزة:\nذكرتَ عَطاياه، وليْستْ بحُجَّة\nعليكَ، ولكن حُجَّةٌ لك فَاثْنِني\n\
                قيل في تفسيره: أَعطني مرة ثانية ولم أَره في غير هذا الشعر.\nوالاثْنانِ: من أَيام الأُسبوع لأَن الأَول عندهم\
                \ الأَحد، والجمع\nأَثْناء، وحكى مطرز عن ثعلب أَثانين، ويومُ الاثْنين لا يُثَنى ولا يجمع لأَنه\nمثنّىً، فإِن\
                \ أَحببت أَن تجمعه كأَنه صفة الواحد، وفي نسخة كأَن لَفْظَه\nمبنيٌّ للواحد، قلت أَثانِين، قال ابن بري: أَثانين\
                \ ليس بمسموع وإِنما هو\nمن قول الفراء وقِياسِه، قال: وهو بعيد في القياس؛ قال: والمسموع في جمع\nالاثنين أَثناء\
                \ على ما حكاه سيبويه، قال: وحكى السيرافي وغيره عن العرب\nأن فلاناً ليصوم الأَثْناء وبعضهم يقول ليصوم الثُّنِيَّ\
                \ على فُعول مثل\nثُدِيٍّ، وحكى سيبويه عن بعض العرب اليوم الثِّنَى، قال: وأَما قولهم\nاليومُ الاثْنانِ، فإِنما\
                \ هو اسم اليوم، وإِنما أَوقعته العرب على قولك\nاليومُ يومان واليومُ خمسةَ عشرَ من الشهر، ولا يُثَنَّى، والذين\
                \ قالوا\nاثْنَيْ جعلوا به على الاثْن، وإِن لم يُتَكلم به، وهو بمنزلة الثلاثاء\nوالأربعاء يعني أَنه صار اسماً\
                \ غالباً؛ قال اللحياني: وقد قالوا في الشعر يوم\nاثنين بغير لام؛ وأَنشد لأَبي صخر الهذلي:\nأَرائحٌ أَنت يومَ\
                \ اثنينِ أَمْ غادي،\nولمْ تُسَلِّمْ على رَيْحانَةِ الوادي؟\nقال: وكان أَبو زياد يقول مَضى الاثْنانِ بما فيه،\
                \ فيوحِّد ويذكِّر،\nوكذا يَفْعل في سائر أَيام الأُسبوع كلها، وكان يؤنِّث الجمعة، وكان أَبو\nالجَرَّاح يقول:\
                \ مضى السبت بما فيه، ومضى الأَحد بما فيه، ومضى الاثْنانِ\nبما فيهما، ومضى الثلاثاء بما فيهن، ومضى الأربعاء\
                \ بما فيهن، ومضى الخميس\nبما فيهن، ومضت الجمعة بما فيها، كان يخرجها مُخْرج العدد؛ قال ابن جني:\nاللام في الاثنين\
                \ غير زائدة وإِن لم تكن الاثنان صفة؛ قال أَبو العباس:\nإِنما أَجازوا دخول اللام عليه لأَن فيه تقدير الوصف،\
                \ أَلا ترى أَن معناه\nاليوم الثاني؟ وكذلك أَيضاً اللام في الأَحد والثلاثاء والأَربعاء ونحوها\nلأَن تقديرها\
                \ الواحد والثاني والثالث والرابع والخامس والجامع والسابت،\nوالسبت القطع، وقيل: إِنما سمي بذلك لأَن الله عز\
                \ وجل خلق السموات\nوالأَرض في ستة أَيام أَولها الأَحد وآخرها الجمعة، فأَصبحت يوم السبت منسبتة\nأَي قد تمت\
                \ وانقطع العمل فيها، وقيل: سمي بذلك لأَن اليهود كانوا ينقطعون\nفيه عن تصرفهم، ففي كلا القولين معنى الصفة موجود.\
                \ وحكى ثعلب عن ابن\nالأَعرابي: لا تكن اثْنَويّاً أَي ممن يصوم الاثنين وحده.\nوقوله عز وجل: ولقد آتيناك سبعاً\
                \ من المثاني والقرآن العظيم؛ المثاني من\nالقرآن: ما ثُنِّيَ مرة بعد مرة، وقيل: فاتحة الكتاب، وهي سبع آيات،\
                \ قيل\nلها مَثَانٍ لأَنها يُثْنى بها في كل ركعة من ركعات الصلاة وتعاد في كل\nركعة؛ قال أَبو الهيثم: سميت آيات\
                \ الحمد مثاني، واحدتها مَثْناة، وهي سبع\nآيات؛ وقال ثعلب: لأَنها تثنى مع كل سورة؛ قال الشاعر:\nالحمد لله الذي\
                \ عافاني،\nوكلَّ خيرٍ صالحٍ أَعطاني،\nرَبِّ مَثاني الآيِ والقرآن\nوورد في الحديث في ذكر الفاتحة: هي السبع\
                \ المثاني، وقيل: المثاني سُوَر\nأَوَّلها البقرة وآخرها براءة، وقيل: ما كان دون المِئِين؛ قال ابن بري:\nكأَن\
                \ المِئِين جعلت مبادِيَ والتي تليها مَثاني، وقيل: هي القرآن كله؛\nويدل على ذلك قول حسان بن ثابت:\nمَنْ للقَوافي\
                \ بعدَ حَسَّانَ وابْنِه؟\nومَنْ للمثاني بعدَ زَيْدِ بنِ ثابتِ؟\nقال: ويجوز أَن يكون، والله أَعلم، من المثاني\
                \ مما أُثْني به على الله\nتبارك وتقدَّس لأَن فيها حمد الله وتوحيدَه وذكر مُلْكه يومَ الدين،\nالمعنى؛ ولقد\
                \ آتَيناك سبع آيات من جملة الآيات التي يُثْنَى بها على الله عز\nوجل وآتيناك القرآن العظيم؛ وقال الفراء في\
                \ قوله عز وجل: اللهُ نَزَّلَ\nأَحسَن الحديث كتاباً مُتشابهاً مَثانيَ؛ أَي مكرراً أَي كُرِّرَ فيه\nالثوابُ\
                \ والعقابُ؛ وقال أَبو عبيد: المَثاني من كتاب الله ثلاثة أَشياء،\nسَمَّى اللهُ عز وجل القرآن كله مثانيَ في\
                \ قوله عز وجل: الله نزل أَحسن الحديث\nكتاباً متشابهاً مَثاني؛ وسَمَّى فاتحةَ الكتاب مثاني في قوله عز وجل:\n\
                ولقد آتيناك سبعاً من المثاني والقرآن العظيم؛ قال: وسمي القرآن مَثاني\nلأَن الأَنْباء والقِصَصَ ثُنِّيَتْ فيه،\
                \ ويسمى جميع القرآن مَثانيَ أَيضاً\nلاقتران آية الرحمة بآية العذاب. قال الأَزهري: قرأْت بخط شَمِرٍ قال\nروى\
                \ محمد بن طلحة بن مُصَرِّف عن أَصحاب عبد الله أَن المثاني ست وعشرون\nسورة وهي: سورة الحج، والقصص، والنمل،\
                \ والنور، والأَنفال، ومريم،\nوالعنكبوت، والروم، ويس، والفرقان، والحجر، والرعد، وسبأ، والملائكة، وإِبراهيم،\n\
                وص، ومحمد، ولقمان، والغُرَف، والمؤمن، والزُّخرف، والسجدة، والأَحقاف،\nوالجاثِيَة، والدخان، فهذه هي المثاني\
                \ عند أَصحاب عبد الله، وهكذا وجدتها\nفي النسخ التي نقلت منها خمساً وعشرين، والظاهر أَن السادسة والعشرين هي\n\
                سورة الفاتحة، فإِما أَن أَسقطها النساخ وإِمّا أَن يكون غَنيَ عن ذكرها\nبما قدَّمه من ذلك وإِما أَن يكون غير\
                \ ذلك؛ وقال أَبو الهيثم: المَثاني\nمن سور القرآن كل سورة دون الطُّوَلِ ودون المِئِين وفوق المُفَصَّلِ؛\nرُوِيَ\
                \ ذلك عن رسول الله، صلى الله عليه وسلم، ثم عن ابن مسعود وعثمان وابن\nعباس، قال: والمفصل يلي المثاني، والمثاني\
                \ ما دُونَ المِئِين، وإِنما قيل\nلِمَا ولِيَ المِئِينَ من السُّوَر مثانٍ لأَن المئين كأَنها مَبادٍ\nوهذه مثانٍ،\
                \ وأَما قول عبد الله بن عمرو: من أَشراط الساعة أَن توضَعَ\nالأَخْيار وتُرْفَعَ الأَشْرارُ وأَن يُقْرَأَ فيهم\
                \ بالمَثناةِ على رؤوس\nالناسِ ليس أَحَدٌ يُغَيّرُها، قيل: وما المَثْناة؟ قال: ما اسْتُكْتِبَ من\nغير كتاب\
                \ الله كأَنه جعل ما اسْتُكتب من كتاب الله مَبْدَأً وهذا مَثْنىً؛\nقال أَبو عبيدة: سأَلتُ رجلاً من أَهل العِلم\
                \ بالكُتُبِ الأُوَلِ قد\nعرَفها وقرأَها عن المَثْناة فقال إِن الأَحْبار والرُّهْبان من بني إِسرائيل\nمن بعد\
                \ موسى وضعوا كتاباً فيما بينهم على ما أَرادوا من غير كتاب الله\nفهو المَثْناة؛ قال أَبو عبيد: وإِنما كره عبد\
                \ الله الأَخْذَ عن أَهل\nالكتاب، وقد كانت عنده كتب وقعت إِليه يوم اليَرْمُوكِ منهم، فأَظنه قال هذا\nلمعرفته\
                \ بما فيها، ولم يُرِدِ النَّهْيَ عن حديث رسول الله، صلى الله\nعليه وسلم، وسُنَّتِه وكيف يَنْهَى عن ذلك وهو\
                \ من أَكثر الصحابة حديثاً عنه؟\nوفي الصحاح في تفسير المَثْناةِ قال: هي التي تُسَمَّى بالفارسية\nدُوبَيْني،\
                \ وهو الغِناءُ؛ قال: وأَبو عبيدة يذهب في تأْويله إِلى غير هذا.\nوالمَثاني من أَوْتارِ العُود: الذي بعد الأَوّل،\
                \ واحدها مَثْنىً.\nاللحياني: التَّثْنِيَةُ أَن يَفُوزَ قِدْحُ رجل منهم فيَنجُو ويَغْنَم\nفيَطْلُبَ إِليهم\
                \ أَن يُعِيدُوه على خِطارٍ، والأَول أَقْيَسُ \n(* قوله\n«والأول أقيس إلخ» أي من معاني المثناة في الحديث).\
                \ وأَقْرَبُ إِلى\nالاشتقاق، وقيل: هو ما اسْتُكْتِبَ من غير كتاب الله.\nومَثْنى الأَيادِي: أَن يُعِيدَ معروفَه\
                \ مرتين أَو ثلاثاً، وقيل: هو أَن\nيأْخذَ القِسْمَ مرةً بعد مرة، وقيل: هو الأَنْصِباءُ التي كانت\nتُفْصَلُ\
                \ من الجَزُور، وفي التهذيب: من جزور المَيْسِر، فكان الرجلُ الجَوادُ\nيَشْرِيها فَيُطْعِمُها الأَبْرامَ، وهم\
                \ الذين لا يَيْسِرون؛ هذا قول أَبي\nعبيد: وقال أَبو عمرو: مَثْنَى الأَيادِي أَن يَأْخُذَ القِسْمَ مرة بعد\n\
                مرة؛ قال النابغة:\nيُنْبِيك ذُو عِرْضِهمْ عَنِّي وعالِمُهُمْ،\nوليس جاهلُ أَمْر مِثْلَ مَنْ عَلِمَا\nإِني\
                \ أُتَمِّمُ أَيْسارِي وأَمْنَحُهُمْ\nمَثْنَى الأَيادِي، وأَكْسُو الجَفْنَة الأُدُما\nوالمَثْنَى: زِمامُ الناقة؛\
                \ قال الشاعر:\nتُلاعِبُ مَثْنَى حَضْرَمِيٍّ، كأَنَّهُ\nتَعَمُّجُ شَيْطانٍ بذِي خِرْوَعٍ قَفْرِ\nوالثِّنْيُ\
                \ من النوق: التي وضعت بطنين، وثِنْيُها ولدها، وكذلك المرأَة،\nولا يقال ثِلْثٌ ولا فوقَ ذلك. وناقة ثِنْيٌ إِذا\
                \ ولدت اثنين، وفي\nالتهذيب: إِذا ولدت بطنين، وقيل: إِذا ولدت بطناً واحداً، والأَول أَقيس،\nوجمعها ثُناءٌ؛\
                \ عن سيبويه، جعله كظِئْرٍ وظُؤارٍ؛ واستعاره لبيد للمرأَة\nفقال:لياليَ تحتَ الخِدْرِ ثِنْي مُصِيفَة\nمن الأُدْم،\
                \ تَرْتادُ الشُّرُوج القَوابِلا\nوالجمع أَثْناء؛ قال:\nقامَ إِلى حَمْراءَ مِنْ أَثْنائِها\nقال أَبو رِياش:\
                \ ولا يقال بعد هذا شيء مشتقّاً؛ التهذيب: وولدها الثاني\nثِنْيُها؛ قال أَبو منصور: والذي سمعته من العرب يقولون\
                \ للناقة إِذا ولدت\nأَول ولد تلده فهي بِكْر، وَوَلَدها أَيضاً بِكْرُها، فإِذا ولدت الولد\nالثاني فهي ثِنْيٌ،\
                \ وولدها الثاني ثِنْيها، قال: وهذا هو الصحيح. وقال في\nشرح بيت لبيد: قال أَبو الهيثم المُصِيفة التي تلد ولداً\
                \ وقد أَسنَّت،\nوالرجل كذلك مُصِيف وولده صَيْفِيّ، وأَرْبَعَ الرجلُ وولده رِبْعِيُّون.\nوالثَّواني: القُرون\
                \ التي بعد الأَوائل.\nوالثِّنَى، بالكسر والقصر: الأَمر يعاد مرتين وأَن يفعل الشيءَ مرتين.\nقال ابن بري: ويقال\
                \ ثِنىً وثُنىً وطِوىً وطُوىً وقوم عِداً وعُداً ومكان\nسِوىً وسُوىً. والثِّنَى في الصّدَقة: أَن تؤخذ في العام\
                \ مرتين. ويروى عن\nالنبي، صلى الله عليه وسلم، أَنه قال: لا ثِنَى في الصدقة، مقصور، يعني\nلا تؤخذ الصدقة في\
                \ السنة مرتين؛ وقال الأَصمعي والكسائي، وأَنشد أَحدهما\nلكعب بن زهير وكانت امرأَته لامته في بَكْرٍ نحره:\n\
                أَفي جَنْبِ بَكْرٍ قَطَّعَتْني مَلامَةً؟\nلَعَمْري لَقَدْ كانَتْ مَلامَتُها ثِنَى\nأَي ليس بأَوّل لومِها فقد\
                \ فعلته قبل هذا، وهذا ثِنىً بعده، قال ابن\nبري: ومثله قول عديّ بن زيد:\nأَعاذِلُ، إِنَّ اللَّوْمَ، في غير\
                \ كُنْهِهِ،\nعَليَّ ثِنىً من غَيِّكِ المُتَرَدِّد\nقال أَبو سعيد: لسنا ننكر أَن الثِّنَى إِعادة الشيء مرة\
                \ بعد مرة ولكنه\nليس وجهَ الكلام ولا معنى الحديث، ومعناه أَن يتصدق الرجل على آخر بصدقة\nثم يبدو له فيريد أَن\
                \ يستردَّها، فيقال لا ثِنَى في الصدقة أَي لا رجوع\nفيها، فيقول المُتَصَدِّقُ بها عليه ليس لك عليَّ عُصْرَةُ\
                \ الوالد أَي ليس\nلك رجوع كرجوع الوالد فيما يُعطي وَلَده؛ قال ابن الأَثير: وقوله في\nالصدقة أَي في أَخذ الصدقة،\
                \ فحذف المضاف، قال: ويجوز أَن تكون الصدقة بمعنى\nالتصديق، وهو أَخذ الصدقة كالزكاة والذكاة بمعنى التزكية والتذكية،\
                \ فلا\nيحتاج إِلى حذف مضاف. والثِّنَى: هو أَن تؤخذ ناقتان في الصدقة مكان\nواحدة.والمَثْناة والمِثْناة: حبل\
                \ من صوف أَو شعر، وقيل: هو الحبل من أَيّ شيء\nكان. وقال ابن الأَعرابي: المَثْناة، بالفتح، الحبل.\nالجوهري:\
                \ الثِّنَاية حبل من شعر أَو صوف؛ قال الراجز:\nأَنا سُحَيْمٌ، ومَعِي مِدرايَهْ\nأَعْدَدْتُها لِفَتْكِ ذِي الدوايَهْ،\n\
                والحَجَرَ الأَخْشَنَ والثِّنايَهْ\nقال: وأَما الثِّناءُ، ممدود، فعقال البعير ونحو ذلك من حبل مَثْنيٍّ،\nوكل\
                \ واحد من ثِنْيَيْه فهو ثِناءٌ لو أُفرد؛ قال ابن بري: إِنما لم يفرد\nله واحد لأَنه حبل واحد تشدّ بأَحد طرفيه\
                \ اليد وبالطرف الآخر الأُخرى،\nفهما كالواحد. وعقلت البعير بِثنايَيْن، غير مهموز، لأَنه لا واحد له إِذا\nعقلت\
                \ يديه جميعاً بحبل أَو بطرفي حبل، وإِنما لم يهمز لأَنه لفظ جاء\nمُثَنّىً لا يفرد واحده فيقال ثِناء، فتركت\
                \ الياء على الأَصل كما قالوا في\nمِذْرَوَيْن، لأَن أَصل الهمزة في ثِنَاءٍ لو أُفْرد ياءٌ، لأَنه من ثنيت،\n\
                ولو أُفرد واحده لقيل ثناءان كما تقول كساءان ورداءان. وفي حديث عمرو بن\nدينار قال: رأَيت ابن عمر ينحر بدنته\
                \ وهي باركة مَثْنِيَّة بِثِنايَيْن،\nيعني معقولة بِعِقالين، ويسمى ذلك الحبل الثِّنايَة؛ قال ابن الأَثير:\n\
                وإِنما لم يقولوا ثناءَيْن، بالهمز، حملاً على نظائره لأَنه حبل واحد يشد\nبأَحد طرفيه يد، وبطرفه الثاني أُخرى،\
                \ فهما كالواحد، وإِن جاء بلفظ اثنين\nفلا يفرد له واحد؛ قال سيبويه: سأَلت الخليل عن الثِّنايَيْن فقال: هو\n\
                بمنزلة النهاية لأَن الزيادة في آخره لا تفارقه فأَشبهت الهاء، ومن ثم قالوا\nمذروان، فجاؤوا به على الأَصل لأَن\
                \ الزيادة فيه لا تفارقه. قال سيبويه:\nوسأَلت الخليل، رحمه الله، عن قولهم عَقَلْته بِثِنايَيْن وهِنايَيْن\n\
                لِمَ لم يهمزوا؟ فقال: تركوا ذلك حيث لم يُفْرد الواحدُ. وقال ابن جني: لو\nكانت ياء التثنية إِعراباً أَو دليل\
                \ إِعراب لوجب أَن تقلب الياء التي بعد\nالأَلف همزة فيقال عقلته بِثِناءَيْن، وذلك لأَنها ياء وقعت طرفاً بعد\n\
                أَلف زائدة فجرى مجرى ياء رِداءٍ ورِماءٍ وظِباءٍ. وعَقَلْتُه بِثِنْيَيْنِ\nإِذا عَقَلْت يداً واحدة بعُقْدتين.\
                \ الأَصمعي: يقال عَقَلْتُ البعيرَ\nبثِنَايَيْنِ، يُظهرون الياء بعد الأَلف وهي المدة التي كانت فيها، ولو مدّ\n\
                مادٌّ لكان صواباً كقولك كساء وكساوان وكساءان. قال: وواحد\nالثِّنَايَيْنِ ثِناءٌ مثل كساء ممدود. قال أَبو منصور:\
                \ أَغفل الليث العلة في\nالثِّنايَين وأَجاز ما لم يجزه النحويون؛ قال أَبو منصور عند قول الخليل تركوا\nالهمزة\
                \ في الثِّنَايَيْن حيث لم يفردوا الواحد، قال: هذا خلاف ما ذكره\nالليث في كتابه لأَنه أَجاز أَن يقال لواحد\
                \ الثِّنَايَيْن ثِناء، والخليل\nيقول لم يهمزوا الثِّنايَيْنِ لأَنهم لا يفردون الواحد منهما، وروى هذا شمر\n\
                لسيبويه. وقال شمر: قال أَبو زيد يقال عقلت البعير بثِنايَيْن إِذا عقلت\nيديه بطرفي حبل، قال: وعقلته بثِنْيَيْنِ\
                \ إِذا عقله يداً واحدة بعقدتين.\nقال شمر: وقال الفراء لم يهمزوا ثِنَايَيْن لأَن واحده لا يفرد؛ قال\nأَبو منصور:\
                \ والبصريون والكوفيون اتفقوا على ترك الهمز في الثنايين وعلى أَن\nلا يفردوا الواحد. قال أَبو منصور: والحبل\
                \ يقال له الثِّنَايةُ، قال:\nوإِنما قالوا ثِنايَيْن ولم يقولوا ثِنايتَيْنِ لأَنه حبل واحد يُشَدُّ\nبأَحد طرفيه\
                \ يَدُ البعير وبالطرف الآخر اليدُ الأُخْرى، فيقال ثَنَيْتُ\nالبعير بثِنايَيْنِ كأَنَّ الثِّنايَيْن كالواحد\
                \ وإِن جاء بلفظ اثنين ولا\nيفرد له واحد، ومثله المِذْرَوانِ طرفا الأَلْيَتَيْنِ، جعل واحداً، ولو\nكانا اثنين\
                \ لقيل مِذْرَيان، وأَما العِقَالُ الواحدُ فإِنه لا يقال له\nثِنايَةٌ، وإِنما الثِّناية الحبل الطويل؛ ومنه\
                \ قول زهير يصف السَّانيةَ\nوشدَّ قِتْبِها عليها:\nتَمْطُو الرِّشاءَ، فَتُجْرِي في ثِنايَتها،\nمن المَحالَةِ،\
                \ ثَقْباً رائداً قَلِقاً\nوالثِّنَاية ههنا: حبل يشد طرفاه في قِتْب السانية ويشد طرف الرِّشاء في\nمَثْناته،\
                \ وكذلك الحبل إِذا عقل بطرفيه يد البعير ثِنايةٌ أَيضاً. وقال\nابن السكيت: في ثِنَايتها أَي في حبلها، معناه\
                \ وعليها ثنايتها. وقال أَبو\nسعيد: الثِّنَاية عود يجمع به طرفا المِيلين من فوق المَحَالة ومن تحتها\nأُخرى\
                \ مثلها، قال: والمَحَالة والبَكَرَة تدور بين الثّنَايتين. وثِنْيا\nالحبل: طرفاه، واحدهما ثِنْيٌ. وثِنْيُ الحبل\
                \ ما ثَنَيْتَ؛ وقال طرفة:\nلَعَمْرُك، إِنَّ الموتَ ما أَخْطَأَ الفَتَى\nلَكالطِّوَلِ المُرْخى، وثِنْياه في\
                \ اليد\nيعني الفتى لا بُدَّ له من الموت وإِن أُنْسِئ في أَجله، كما أَن\nالدابة وإِن طُوّل له طِوَلُه وأُرْخِي\
                \ له فيه حتى يَرُود في مَرتَعه ويجيء\nويذهب فإِنه غير منفلت لإِحراز طرف الطِّوَل إِياه، وأَراد بِثِنْييه الطرف\n\
                المَثْنِيَّ في رُسْغه، فلما انثنى جعله ثِنْيين لأَنه عقد بعقدتين،\nوقيل في تفسير قول طرفة: يقول إِن الموت،\
                \ وإِن أَخطأَ الفتى، فإِن مصيره\nإِليه كما أَن الفرس، وإِن أُرْخِي له طِوَلُه، فإِن مصيره إِلى أَن يَثْنيه\n\
                صاحبه إِذ طرفه بيده. ويقال: رَبَّق فلان أَثناء الحبل إِذا جعل وسطه\nأَرْباقاً أَي نُشَقاً للشاء يُنْشَق في\
                \ أَعناق البَهْمِ.\nوالثِّنَى من الرجال: بعد السَّيِّد، وهو الثُّنْيان؛ قال أَوس بن\nمَغْراء:\nتَرَى ثِنانا\
                \ إِذا ما جاء بَدْأَهُمُ،\nوبَدْؤُهُمْ إِن أَتانا كان ثُنْيانا\nورواه الترمذي: ثُنْيانُنا إِن أَتاهم؛ يقول:\
                \ الثاني منَّا في الرياسة\nيكون في غيرنا سابقاً في السُّودد، والكامل في السُّودد من غيرنا ثِنىً في\nالسودد\
                \ عندنا لفضلنا على غيرنا. والثُّنْيان، بالضم: الذي يكون دون\nالسيد في المرتبة، والجمع ثِنْيةٌ؛ قال الأَعشى:\n\
                طَوِيلُ اليدَيْنِ رَهْطُه غيرُ ثِنْيةٍ،\nأَشَمُّ كَرِيمٌ جارُه لا يُرَهَّقُ\nوفلان ثِنْية أَهل بيته أَي أَرذلهم.\
                \ أَبو عبيد: يقال للذي يجيء ثانياً\nفي السُّودد ولا يجيء أَولاً ثُنىً، مقصور، وثُنْيانٌ وثِنْيٌ، كل ذلك\n\
                يقال. وفي حديث الحديبية: يكون لهم بَدْءُ الفُجور وثِناه أَي أَوَّله\nوآخره.\nوالثَّنِيّة: واحدة الثَّنايا\
                \ من السِّن. المحكم: الثَّنِيّة من\nالأَضراس أولُ ما في الفم. غيره: وثَنايا الإنسان في فمه الأربعُ التي في\
                \ مقدم\nفيه: ثِنْتانِ من فوق، وثِنْتانِ من أَسفل. ابن سيده: وللإنسان والخُفِّ\nوالسَّبُع ثَنِيّتان من فوقُ\
                \ وثَنِيّتان من أَسفلَ. والثَّنِيُّ من الإبل:\nالذي يُلْقي ثَنِيَّته، وذلك في السادسة، ومن الغنم الداخل في\
                \ السنة\nالثالثة، تَيْساً كان أَو كَبْشاً. التهذيب: البعير إذا استكمل الخامسة وطعن\nالسادسة فهو ثَنِيّ، وهو\
                \ أَدنى ما يجوز من سنِّ الإبل في الأَضاحي،\nوكذلك من البقر والمِعْزى \n(* قوله «وكذلك من البقر والمعزى» كذا\
                \ بالأصل، وكتب\nعليه بالهامش: كذا وجدت أ هـ. وهو مخالف لما في القاموس والمصباح\nوالصحاح ولما سيأتي له عن النهاية)،\
                \ فأما الضأن فيجوز منها الجَذَعُ في\nالأَضاحي، وإنما سمي البعير ثَنِيّاً لأَنه أَلقى ثَنيَّته. الجوهري: الثَّنِيّ\n\
                الذي يُلْقِي ثَنِيَّته، ويكون ذلك في الظِّلْف والحافر في السنة\nالثالثة، وفي الخُفّ في السنة السادسة. وقيل\
                \ لابْنةِ الخُسِّ: هل يُلْقِحُ\nالثَّنِيُّ؟ فقالت: وإلْقاحُه أَنِيٌّ أَي بَطِيءٌ، والأُنْثى ثَنِيَّةٌ،\nوالجمع\
                \ ثَنِيّاتٌ، والجمع من ذلك كله ثِناء وثُناء وثُنْيانٌ. وحكى سيبويه\nثُن. قال ابن الأَعرابي: ليس قبل الثَّنيّ\
                \ اسم يسمى ولا بعد البازل اسم\nيسمى. وأَثْنَى البعيرُ: صار ثَنِيّاً، وقيل: كل ما سقطت ثَنِيّته من غير\nالإنسان\
                \ ثَنيٌّ، والظبي ثَنِيٌّ بعد الإجذاع ولا يزال كذلك حتى يموت.\nوأَثْنى أَي أَلْقى ثَنِيّته. وفي حديث الأضحية:\
                \ أَنه أمر بالثَّنِيَّة من\nالمَعَز؛ قال ابن الأَثير: الثَّنِيّة من الغنم ما دخل في السنة الثالثة،\nومن البقر\
                \ كذلك، ومن الإبل في السادسة، والذكر ثَنِيٌّ، وعلى مذهب أَحمد بن\nحنبل ما دخل من المَعَز في الثانية، ومن البقر\
                \ في الثالثة. ابن\nالأَعرابي: في الفرس إذا استَتمَّ الثالثة ودخل في الرابعة ثَنِيٌّ، فإذا أَثْنَى\nأَلقى رواضعه،\
                \ فيقال أَثْنَى وأدْرَم للإثناء، قال: وإذا أَثْنَى سقطت\nرواضعه ونبت مكانها سِنٌّ، فنبات تلك السن هو الإثناء،\
                \ ثم يسقط الذي يليه\nعند إرباعه. والثَّنِيُّ من الغنم: الذي استكمل الثانية ودخل في الثالثة،\nثم ثَنِيٌّ\n\
                في السنة الثالثة مثل الشاة سواءً. والثَّنِيّة: طريق العقبة؛ ومنه\nقولهم: فلان طَلاَّع الثَّنايا إذا كان سامياً\
                \ لمعالمي الأُمور كما يقال\nطَلاَّ أَنْجُدٍ، والثَّنِيّة: الطريقة في الجبل كالنَّقْب، وقيل: هي\nالعَقَبة،\
                \ وقيل: هي الجبل نفسه. ومَثاني الدابة: ركبتاه ومَرْفقاه؛ قال امرؤ\nالقيس:\nويَخْدِي على صُمٍّ صِلابٍ مَلاطِسٍ،\n\
                شَديداتِ عَقْدٍ لَيِّناتِ مَثاني\nأَي ليست بجاسِيَة. أَبو عمرو: الثَّنايا العِقاب. قال أَبو منصور:\nوالعِقاب\
                \ جبال طِوالٌ بعَرْضِ الطريق، فالطريق تأخذ فيها، وكل عَقَبة مسلوكة\nثَنِيَّةٌ، وجمعها ثَنايا، وهي المَدارِج\
                \ أَيضاً؛ ومنه قول عبد الله ذي\nالبِجادَيْن المُزَني:\nتَعَرَّضِي مَدارِجاً، وَسُومِي،\nتعَرُّضَ الجَوْزاء\
                \ للنُّجوم\nيخاطب ناقة سيدنا رسول الله، صلى الله عليه وسلم، وكان دليله بركوبه،\nوالتعرّض فيها: أن يَتَيامَن\
                \ الساندُ فيها مرَّة ويَتَياسَر أخرى ليكون\nأَيسر عليه. وفي الحديث: مَنْ يَصْعَدْ ثَنِيّة المُرارِ حُطَّ عنه\
                \ ما حُطَّ\nعن بني إسرائيل؛ الثَّنِيّة في الجبل: كالعقبة فيه، وقيل: هي الطريق\nالعالي فيه، وقيل: أَعلى المَسِيل\
                \ في رأْسه، والمُرار، بالضم: موضع بين مكة\nوالمدينة من طريق الحُدَيْبية، وبعضهم يقوله بالفتح، وإنما حَثَّهم\
                \ على\nصعودها لأَنها عَقَبة شاقَّة، وصلوا إليها ليلاً حين أَرادوا مكة سنة\nالحديبية فرغَّبهم في صعودها، والذي\
                \ حُطَّ عن بني إسرائيل هو ذنوبهم من قوله\nتعالى: وقولوا حِطَّةٌ نغفر لكم خطاياكم؛ وفي خطبة الحجَّاج:\nأَنا\
                \ ابنُ جَلا وطَلاَّع الثَّنايا\nهي جمع ثَنِيّة، أَراد أَنه جَلْدٌ يرتكب الأُمور العظام.\nوالثَّناءُ: ما تصف\
                \ به الإنسانَ من مَدْح أَو ذم، وخص بعضهم به المدح،\nوقد أثْنَيْتُ عليه؛ وقول أبي المُثلَّم الهذلي:\nيا صَخْرُ،\
                \ أَو كنت تُثْني أَنَّ سَيْفَكَ مَشْـ\nقُوقُ الخُشَيْبةِ، لا نابٍ ولا عَصِلُ\nمعناه تمتدح وتفتخر، فحذف وأَوصل.\
                \ ويقال للرجل الذي يُبْدَأُ بذكره في\nمَسْعاةٍ أو مَحْمَدة أَو عِلْمٍ: فلان به تُثْنَى الخناصر أَي تُحْنَى\
                \ في\nأَوَّل من يُعَدّ ويُذْكر، وأَثْنَى عليه خيراً، والاسم الثَّناء.\nالمظفر: الثَّناءُ، ممدود، تَعَمُّدُك\
                \ لتُثْنيَ على إنسان بحسَن أَو قبيح. وقد\nطار ثَناءُ فلان أَي ذهب في الناس، والفعل أَثْنَى فلان \n(* قوله\
                \ «والفعل\nأثنى فلان» كذا بالأصل ولعل هنا سقطاً من الناسخ وأصل الكلام: والفعل\nأثنى فلان إلخ). على الله تعالى\
                \ ثم على المخلوق يثني إثناء أَو ثناء يستعمل\nفي القبيح من الذكر في المخلوقين وضده. ابن الأَعرابي: يقال أَثْنَى\
                \ إذا\nقال خيراً أَو شرّاً، وأَنْثَنَى إذا اغتاب.\nوثِناء الدار: فِناؤها. قال ابن جني: ثِناء الدار وفِناؤها\
                \ أَصْلانِ\nلأَن الثِّناء مِن ثَنَى يَثْني، لأَن هناك تَنْثَني عن الانبساط لمجيء\nآخرها واستقصاء حدودها، وفِناؤها\
                \ مِنْ فَنِيَ يَفْنَى لأَنك إذا تناهيت إلى\nأَقصى حدودها فَنِيَتْ. قال ابن سيده: فإن قلت هلا جعلت إجماعهم\
                \ على\nأَفْنِيَة، بالفاء، دلالة على أَن الثاء في ثِناء بدل من فاء فناء، كما زعمت\nأَن فاء جَدَف بدل من ثاء\
                \ جَدَث لإجماعهم على أَجْداث بالثاء، فالفرق\nبينهما وجودنا لِثِناء من الاشتقاق ما وجدناه لِفِناء، أَلا ترى\
                \ أَن الفعل\nيتصرف منهما جميعاً؟ ولَسْنا نعلم لِجَدَفٍ بالفاء تَصَرُّفَ جَدَثٍ، فلذلك\nقضينا بأَن الفاء بدل\
                \ من الثاء، وجعله أَبو عبيد في المبدل.\nواسْتَثْنَيْتُ الشيءَ من الشيء: حاشَيْتُه. والثَّنِيَّة: ما اسْتُثْني.\
                \ وروي عن\nكعب أَنه قال: الشُّهداء ثَنِيَّةُ الله في الأَرض، يعني مَن اسْتَثْناه من\nالصَّعْقة الأُولى، تأوَّل\
                \ قول الله تعالى: ونفخ في الصور فصَعِق من في\nالسموات ومن في الأَرض إلا من شاء الله؛ فالذين استَثْناهم الله\
                \ عند كعب\nمن الصَّعْق الشهداء لأَنهم أَحياء عند ربهم يُرْزَقون فَرِحِين بما\nآتاهم الله من فضله، فإذا نُفِخ\
                \ في الصور وصَعِقَ الخَلْقُ عند النفخة\nالأُولى لم يُصْعَقوا، فكأَنهم مُسْتَثْنَوْنَ من الصَّعِقين، وهذا معنى\
                \ كلام\nكعب، وهذا الحديث يرويه إبراهيم النخعي أَيضاً. والثَّنِيَّة: النخلة\nالمستثناة من المُساوَمَة.\nوحَلْفةٌ\
                \ غير ذات مَثْنَوِيَّة أَي غير مُحَلَّلة. يقال: حَلَف فلان\nيميناً ليس فيها ثُنْيا ولا ثَنْوَى \n(* قوله «ليس\
                \ فيها ثنيا ولا ثنوى» أي\nبالضم مع الياء والفتح مع الواو كما في الصحاح والمصباح وضبط في القاموس\nبالضم، وقال\
                \ شارحه: كالرجعى). ولا ثَنِيَّة ولا مَثْنَوِيَّةٌ\nولا استثناء، كله واحد، وأصل هذا كله من الثَّنْي والكَفِّ\
                \ والرَّدّ\nلأَن الحالف إذا قال والله لا أَفعل كذا وكذا إلا أَن يشاء الله غَيْرَه فقد\nرَدَّ ما قاله بمشيئة\
                \ الله غيره. والثَّنْوة: الاستثناء. والثُّنْيانُ،\nبالضم: الإسم من الاستثناء، وكذلك الثَّنْوَى، بالفتح. والثُّنيا\n\
                والثُّنْوى: ما استثنيته، قلبت ياؤه واواً للتصريف وتعويض الواو من كثرة دخول\nالياء عليها، والفرقِ أَيضاً بين\
                \ الإسم والصفة. والثُّنْيا المنهي عنها في\nالبيع: أَن يستثنى منه شيء مجهول فيفسد البيع، وذلك إذا باع جزوراً\
                \ بثمن\nمعلوم واستثنى رأْسه وأَطرافه، فإن البيع فاسد. وفي الحديث: نهى عن\nالثُّنْيا إلا أَن تُعْلَمَ؛ قال\
                \ ابن الأَثير: هي أَن يستثنى في عقد البيع شيء\nمجهول فيفسده، وقيل: هو أَن يباع شيء جزافاً فلا يجوز أَن يستثنى\
                \ منه\nشيء قلَّ أَو كثر، قال: وتكون الثُّنْيا في المزارعة أَن يُسْتثنى بعد\nالنصف أَو الثلث كيل معلوم. وفي\
                \ الحديث: من أَعتق أو طلَّق ثم استثنى فله\nثُنْياءُ أَي من شرط في ذلك شرطاً أَو علقه على شيء فله ما شرط أَو\
                \ استثنى\nمنه، مثل أَن يقول طلقتها ثلاثاً إلا واحدة أَو أَعتقتهم إلا فلاناً،\nوالثُّنْيا من الجَزور: الرأْس\
                \ والقوائم، سميت ثُنْيا لأَن البائع في\nالجاهلية كان يستثنيها إذا باع الجزور فسميت للاستثناء الثُّنْيا. وفي\
                \ الحديث:\nكان لرجل ناقة نجيبة فمرضت فباعها من رجل واشترط ثُنْياها؛ أَراد قوائمها\nورأْسها؛ وناقة مذكَّرة\
                \ الثُّنْيا؛ وقوله أَنشده ثعلب:\nمذَكَّرة الثُّنْيا مُسانَدة القَرَى،\nجُمالِيَّة تَخْتبُّ ثم تُنِيبُ\nفسره\
                \ فقال: يصف الناقة أَنها غليظة القوائم كأَنها قوائم الجمل لغلظها.\nمذكَّرة الثُّنْيا: يعني أَن رأْسها وقوائمها\
                \ تشبه خَلْق الذِّكارة، لم\nيزد على هذا شيئاً. والثَّنِيَّة: كالثُّنْيا. ومضى ثِنْيٌ من الليل أَي\nساعة؛ حكى\
                \ عن ثعلب: والثُنون \n(* قوله «والثنون إلخ» هكذا في الأصل): الجمع\nالعظيم."
