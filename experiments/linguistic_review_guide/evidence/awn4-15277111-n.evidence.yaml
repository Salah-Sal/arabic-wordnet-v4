              text: 'من الشِّعر : المُرْدَوِجُ , ومَنْظُوماته تَخْتَلِفُ فيها القافِيَةُ من بيتٍ إلى بيتٍ , وتَنْجِدُ فى شَطْرَى
                كُلِّ بيتٍ , كمُزْدَوَجات أبان بن عَبْد الحميد , والشِّعر التَّعْلِيمِي كَأَلْفِيَّةِ ابن مالك .'
              is_raw: 0
            - sense_index: 1
              text: كِتَابٌ كبيرٌ في ستَّة وعشرين أَلْفِ بَيْت , في التَّصَوُّفِ والمَلَامَةِ ووحْدَةِ الوُجُودِ والقِصَص
                التَّعْلِيمِيَّةِ والتَّرْبويَّة من شعر جلال الدين القونوى المعروف بالرومي .
              is_raw: 0
