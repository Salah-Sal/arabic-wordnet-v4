              أَيْضاً: معطفُ الثَّوْبِ؛ وَمِنْه حدِيثُ أَبي هُرَيْرَةَ: (كانَ} يَثْنِيه عَلَيْهِ أَثْناءً مِن سَعَتِه) ، يعْنِي
