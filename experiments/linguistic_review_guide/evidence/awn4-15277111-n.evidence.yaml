            definitions_text: 'ثَنَى الشَّيْءَ، كَسَعَى: رَدَّ بَعْضَهُ على بَعْضٍ،فَتَثَنَّى وانْثَنَى واثْنَوْنَى: انْعَطَفَ.وأثْناءُ
              الشَّيْءِ ومَثَانِيهِ: قُواهُ، وطاقاتُهُ، واحِدُها: ثِنْيٌ، بالكسر: ومَثْناةٌ، ويُكْسَرُ.وثِنْيُ الحَيَّةِ،
              بالكسر: انْثناؤُها، أَو ما تَعَوَّجَ منها إذا تَثَنَّتْ،وـ من الوادِي: مُنْعَطَفُهُج: أثْناءٌ.وشاةٌ ثانِيَةٌ،
              بَيِّنَةُ الثِّنْيِ، بالكسر: تَثْنِي عُنُقَها لغَيْرِ عِلَّةٍ.والاِثْنانِ: ضِعْفُ الواحِدِ، والمُؤَنَّثُ: ثِنْتانِ،
              وأصْلُهُ: ثِنْيٌ، لجَمْعِهِم إيَّاهُ على ثْناءٍ.وَثَنَّاهُ تَثْنِيَةً: جَعَلَهُ اثْنَيْنِ.وهذا واحِدٌ فاثْنِه:
              كُنْ ثانِيَهُ.وهو لا يَثْنِي ولا يَثْلِثُ، أي: كَبيرٌ لا يَقْدِرُ أنْ يَنْهَضَ، لا في مَرَّةٍ، ولا في مَرَّتَيْنِ،
              ولا في الثَّالِثَةِ. وثَناءُ بنُ أحمدَ: مُحَدِّثٌ.وجاؤُوا مَثْنَى وثُناءَ، كغُرابٍ، أي: اثْنَيْنِ اثْنَيْنِ،
              وثِنْتَيْنِ ثِنْتَينِ.والاثْنانِ والثِّنَى، كإلَى: يَوْمٌ في الأُسْبُوعِج: أثْناءٌ وأثانِينُ. وجاءَ في الشِّعْرِ
              يَوْمُ اثْنَيْنِ، بلا لامٍ.والإِثْنَوِيُّ: من يَصُومُهُ دائِماً وحْدَهُ.والمَثانِي: القُرْآنُ، أو ما ثُنِّيَ
              منه مَرَّةً بَعْدَ مَرَّةٍ، أو الحَمْدُ، أو البَقَرَةُ إلى بَراءَة، أو كُلُّ سورَةٍ دُونَ الطُّوَلِ، ودُونَ
              المِئَتَيْنِ، وفَوْقَ المُفَصَّلِ، أو سُورَةُ الحَجِّ والنَّمْلِ والقَصَصِ والعَنْكَبُوتِ والنُّورِ والأنْفالِ
              ومَرْيَمَ والرُّومِ ويس والفُرْقانِ والحِجْرِ والرَّعْدِ وسَبَأَ والملآئكَةِ وإبراهيمَ وص~، ومُحَمدٍ صلى الله
              عليه وسلم، ولُقْمَانَ والغُرَفِ والزُّخْرُفِ والمُؤْمِنِ والسَّجْدَةِ والأحْقافِ والجاثِيَةِ والدُّخانِ والأحْزابِ،وـ
              من أوتارِ العُودِ: الذي بعدَ الأولِ، واحِدُها: مَثْنَى،وـ من الوادِي: مَعَاطِفُهُ،وـ من الدَّابَّةِ: رُكْبَتَاها
              ومِرفَقاها.ولا ثِنَى في الصَّدَقةِ، كإلَى، أي: لا تُؤْخَذُ مَرَّتَيْنِ في عامٍ، أو لا تُؤْخَذُ ناقَتانِ مكانَ
              واحِدَةٍ، أو لا رُجوعَ فيها، وإذا وَلَدَتْ ناقةٌ مرةً ثانِيَةً،فهي ثِنْيٌ، ووَلَدُها ذلك: ثِنْيُها.ومَثْنَى
              الأَيادِي: إعادةُ المَعْروفِ مَرَّتَيْنِ فأَكْثَرَ، والأنْصِباءُ الفاضِلَةُ من جَزُورِ المَيْسِرِ، كان الرجُلُ
              الجَوادُ يَشْتَرِيها، ويُطْعِمُها الأَبْرامَ،والمَثْناةُ: حَبْلٌ من صُوفٍ أَو شَعَرٍ أو غيرِهِ، ويُكْسَرُ،كالثِّنايةِ
              والثِّناءِ، بكسرهما، وما اسْتُكْتِبَ من غيرِ كتابِ الله، أَو كِتابٌ فيه أخْبار بني إِسْرائيلَ بعدَ مُوسى، أحَلُّوا
              فيه وحَرَّموا ما شاؤُوا، أَو هي الغِناءُ، أَو التي تُسَمَّى بالفارِسِيَّةِ دُوبَيْتِي.والثُّنْيانُ، بالضم: الذي
              بعدَ السَّيِّدِ،كالثِّنْيِ، بالكسر وكهُدًى وإلىج: ثِنْيَة، ومَنْ لا رَأْيَ له ولا عَقْلَ، والفاسِدُ من الرأْيِ.وثِنْيٌ
              من الليل، بالكسر: ساعَةٌ، أَو وَقْتٌ.والثَّنِيَّةُ: العَقَبَةُ، أَو طَرِيقُها، أَو الجَبَلُ، أَو الطَّريقَةُ
              فيه أَو إليه، والشُّهَداءُ الذِينَ اسْتَثْناهُمُ الله عن الصَّعْقَةِ، وبمعنى الاستِثْناءِ،وـ من الأضْراسِ: الأربَعُ
              التي في مُقَدَّمِ الفَمِ: ثِنْتانِ من فَوْقُ، وثِنْتانِ من أسْفَلَ، والناقةُ الطاعِنَةُ في السادِسَةِ، والبَعيرُ:
              ثَنِيٌّ، والفَرَسُ الداخِلَةُ في الرَّابِعَةِ، والشَّاةُ في الثَّالِثَةِ، كالبَقَرَةِ، والنَّخْلَةُ المُسْتَثْناةُ
              من المُساوَمَةِ.والثُّنْيَا، بالضم، من الجَزُورِ: الرأسُ، والقوائِمُ، وكُلُّ ما اسْتَثْنَيْتَه،كالثُّنْوَى والثُّنْيَةِ.والمُثَنَّاةُ:
              ع. ومُثَنَّى: اسمٌ.واثَّنَى، كافْتَعَلَ: تَثَنَّى.وأَثْنَى البعيرُ: صارَ ثَنِيًّا.والثَّناءُ، بالفتح،والتَّثْنِيَةُ:
              وصْفٌ بمَدْحٍ أو ذَمٍّ، أو خاصٌّ بالمَدْحِ، وقد أثْنَى عليه وثَنَّى. وككِتابٍ: الفِناءُ، وعِقالُ البعيرِ، عن
              ابنِ السَّيِّدِ.'
