              دابَّتِه: ضمَّها إِلَى فخذِهِ فنَزلَ.وَإِذا فَعَلَ الرَّجُلُ أَمْراً ثمَّ ضمَّ إِلَيْهِ أمرا آخَرَ قيلَ {ثَنَّى
              بالأَمْرِ الثَّانِي} تَثْنِية.وَفِي الحدِيثِ: (وَهُوَ {ثانٍ رِجْلَه أَي عاطِفٌ قَبْل أنْ يَنْهَض.وَفِي حدِيثٍ
              آخَرَ: (قَبْلَ أنْ} يَثْنيَ رِجْلَه) ، قالَ ابنُ الأثيرِ: هَذَا ضِدّ الأوّل فِي اللفْظِ ومِثْله فِي المعْنَى،
              لأنَّه أَرادَ قَبْل أَن يصرفَ رِجْلَه عَن حالَتِه الَّتِي هِيَ عَلَيْهَا فِي التَّشهّدِ. {وثَنَى صَدْرَه} يَثْنِيه
              ثنيّاً: أَسَرَّ فِيهِ العَداوَةَ، أَو طَوَى مَا فِيهِ اسْتِخْفاء.ويقالُ للفارِسِ إِذا {ثَنَى عُنُقَ دابَّتِه
              عنْدَ شدَّة حُضْرِه: جاءَ} ثانيَ العِنانِ.ويقالُ للفَرَسِ نَفْسَه: جاءَ سابِقاً {ثانِياً إِذا جاءَ وَقد ثَنَى
              عُنُقَه نشاطاً لأنّه إِذا أَعْيى مدَّ عُنُقَه؛ وَمِنْه قولُ الشاعِرِ:ومَنْ يَفْخَرْ بمثلِ أَبي وجَدِّييَجِىءْ
              قبل السَّوابق وهْو ثانِيأَي كالفَرَسِ السَّابِقِ، أَو كالفارِسِ الَّذِي سبقَ فَرسُه الخَيْلَ.} وَثَانِي عطْفه:
              كِنايَةٌ عَن التّكبرِ والإعْراضِ. كَمَا يقالُ: لَوَى شدْقَه ونَأَى بجانِبهِ.ويقالُ: فلانٌ ثانِي اثْنَيْن، أَي
              هُوَ أَحَدُهما، مُضافٌ، وَلَا يقالُ هُوَ ثانٍ اثْنَيْن، بالتَّنْوِين.وَلَو سُمِّي رَجُل {باثْنَيْن أَو} باثْنَي
              عشر لقُلْت فِي النِّسْبةِ إِلَيْهِ {ثَنَويٌّ فِي قوْلِ مَنْ قالَ فِي ابْنٍ بَنَوِيٌّ، واثْنِيٌّ فِي قوْلِ مَنْ
              قالَ ابْنِيٌّ.} والثَّنَوِيَّةُ، بالتحْرِيكِ: طائِفَةٌ تقولُ {بالاثْنَيْنِيَّة، قبَّحَهم اللَّهُ تَعَالَى؛}
              وثِنى، بالكسْرِ: مَوْضِعٌ بالجَزيرَةِ مِن دِيارِ تَغْلِب، كانتْ فِيهِ وقائِعُ. ويقالُ: هُوَ كغَنِيَ؛ وأَيْضاً:
              مَوْضِعٌ بناحِيَةِ المذارِ، عَن نَصْر.وشَرِبتُ أثنا القَدَح، واثْنَيْ هَذَا القَدَح، أَي اثْنَيْن مِثْلَه. وكَذلِكَ
              شَرِبْتُ اثْنَيْ مُدِّ البَصْرةِ، {واثْنَيْن بمدِّ البَصْرَةِ.والكَلِمَةُ} الثنائِيَّةُ: المُشْتَملَةُ على حَرْفَيْن
              كيَدٍ ودمٍ؛ وقَوْله أَنْشَدَه ابنُ الأعْرابيِّ:فَمَا حَلَبَتْ إلاَّ الثَّلاثة! والثُّنَىوَلَا قَيَّلَتْ إلاَّ
              قَرِيبا مَقالُها قالَ: أَرادَ الثَّلاثَةَ من الآنِيَةِ، {وبالثُّنَى الاثْنَيْن: وقَوْلُ كثيِّر عزَّةَ:ذكرتَ
              عَطاياهُ وليْسَتْ بحُجَّةعليكَ وَلَكِن حُجَّةٌ لكَ} فَاثْنِن قيلَ فِي تَفْسيرِهِ: أَعْطِني مرَّةً {ثانِيَةً،
              وَهُوَ غَريبٌ.وحَكَى بعضُهم: أَنَّه ليَصومُ} الثُّنِيَّ على فُعولٍ نَحْو ثُدِيَ، أَي يَوْمَ الاثْنَيْن.{والمَثاني:
              أَرضٌ بينَ الكُوفَةِ والشامِ؛ عَن نَصْر.وقالَ اللّحْيانيُّ:} التَّثْنِيَةُ أنْ يَفُوزَ قِدْحُ رجُلٍ مِنْهُم
              فيَنْجُو ويَغْنَم فيَطْلُبَ إِلَيْهِم أَن يُعِيدُوه على خِطارٍ.{والمَثْنَى: زِمامُ الناقَةِ؛ قالَ الشاعِرُ:تُلاعِبُ}
              مَثْنَى حَضْرَمِيِّ كأَنَّهُتَعَمُّجُ شَيْطانٍ بذِي خِرْوَعٍ قَفْرِوقالَ الرَّاغبُ: {المَثْناةُ مَا ثُنِي من
              طَرَفِ الزِّمامِ.وجَمْعُ} الثِّنْي مِن النّوقِ {ثُناءٌ، بالضمِّ، عَن سِيْبَوَيْه، جَعَلَه كظِئْرٍ وظُؤَارٍ.وقالَ
              غيرُهُ: أَثْناءُ، وأَنْشَدَ:قامَ إِلَى حَمْراءَ مِنْ} أَثْنائِها {والثُّنَى، كهُدَى: الأمْرُ يُعادُ مَرَّتَيْن؛
              لُغَةٌ فِي} الثِّنَى، كمَكانٍ سِوىً وسُوىً؛ عَن ابنِ بَرِّي.وعَقَلْتُ البَعيرَ {بثِنْيَتَيْن، بالكسْرِ: إِذا
              عَقَلْت يدا واحِدَةً بعُقْدَتَيْن؛ عَن أَبي زيْدٍ.وقالَ أَبو سعيدٍ:} الثِّنايَةُ، بالكسْرِ: عُودٌ يُجْمَع بِهِ
              طَرَفا الحَبْلَيْن من فَوْق المَحَالةِ وَمن تَحْتَها الأُخرى مِثْلها؛ قالَ: والمَحَالَةُ والبَكَرَةُ تَدُورُ
              بينَ {الثِّنَايَتَيْنِ؛} وثِنْيا الحَبْل، بالكسْرِ: طَرَفاهُ، واحِدُهما {ثِنْيٌ؛ قالَ طرفَهُ:لَعَمْرُكَ إنَّ
              الموتَ مَا أَخْطَأَ الفَتَىلَكالطِّوَلِ المُرْخى} وثِنْياه فِي اليَد ِأَرادَ {بِثِنْيَيْهِ الطَّرَفَ} المَثْنِيَّ
              فِي رُسْغِه، فلمَّا {انْثَنَى جَعَلَه} ثِنْيَيْن لأنَّه عقدَ بعُقْدَتَيْن.وجَمْعُ {الثَّنِيِّ مِن الإِبِلِ،
              كغَنِيَ،} ثِناءٌ {وثُناءٌ، ككِتابٍ وغُرابٍ،} وثُنْيانٌ. وحَكَى سِيْبَوَيْه ثُن.ويقالُ: فلانٌ طَلاَّعُ {الثَّنَايا
              إِذا كانَ سامِياً لمعالي الأُمورِ، كَمَا يقالُ طَلاَّع أَنْجُدٍ، أَو جَلْداً يَرْتَكِبُ الأُمُورَ العِظامَ،
              وَمِنْه قَوْلُ الحجَّاجِ فِي خطْبتِه:أَنا ابنُ جَلاَ وطَلاَّع الثَّنايا ويقالُ للرَّجُل الَّذِي يُبْدَأُ بذِكْرِه
              فِي مَسْعاةٍ أَو مَحْمَدةٍ أَو عِلْمٍ: فلانٌ بِهِ} تُثْنَى الخَناصِرُ، أَي تُحْنَى فِي أَوَّلِ من يُعَدّ ويُذْكر،
              وقالَ الشاعِرُ:فَقَوْمي بهم تُثْنَى هُناك الأَصابعقالَ ابنُ الأعْرابيُّ: يَعْنِي أنَّهم الخيارُ المَعْدُودُونَ،
              لأنَّ الخيارَ لَا يكثرونَ.{واسْتَثْنَيْتُ الشَّيءَ مِن الشَّيءِ: حاشَيْتُه.وقالَ الرَّاغبُ:} الاسْتِثْناءُ إيرادُ
              لَفْظٍ يَقْتَضِي رَفْع بعض مَا يُوجِبه عُمومُ اللّفْظِ كقَوْلِه تَعَالَى: {إلاَّ أنْ يكونَ ميتَةً أَو دَماً
              مَسْفوحاً} ، وَمَا يَقْتَضِيه رَفْع مَا يُوجِبه اللّفْظ كقَوْلِ الرَّجُلِ: لأفْعَلَنَّ كَذَا إنْ شاءَ اللَّهُ
              تَعَالَى، وعَلى هَذَا قَوْله تَعَالَى: {إِذا أَقْسَموا لَيَصْرِمُنَّها مُصْبحين وَلَا {يَسْتَثْنُون} .وحَلْفةٌ
              غَيْر ذَات} مَثْنَوِيَّة: أَي غَيْر مُحَلَّلة.{والثُّنْيانُ، بالضَّمِّ: الاسمُ مِن الاسْتِثْناءِ} كالثَّنْوَى،
              بالفتْحِ، نَقَلَه الجَوْهرِيُّ،{والمُثنَى، كمُعَظَّم: اسمٌ. وأَيْضاً لَقَبُ الحَسَنِ بنِ الحَسَنِ بنِ عليَ،
              رضِيَ اللَّهُ تَعَالَى عَنهُ.} والمثْنَوي مِن الشّعرِ: وَهُوَ المَعْروفُ بالدو بَيت، وَبِه سَمَّى الشَّيخُ جلالُ
              الدِّيْنُ القَوْنويّ كتابَهُ {بالمَثْنوي.وأُثْنان، بالضَّمِّ: مَوْضِعٌ بالشَّأمِ؛ عَن ياقوت، وَقد ذُكِرَ فِي
              أثن.'
