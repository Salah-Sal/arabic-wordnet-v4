                \ \n ثَنَّيَa. Made two; counted two; put in the dual.\n b.  ['Ala],  Eulogized, praised; complimented.\n\
                \ أَثْنَيَ\n a.  ['Ala]\nsee II (b)\n تَثَنَّيَa. Was doubled, folded, over, bent back; was repeated \n reiterated.\n\
                \ b. Swaggered.\n إِنْثَنَيَa. Was doubled back, bent, folded over.\n b.  ['An], Turned away from; desisted,\
                \ left off. \n إِسْتَثْنَيَ\n a.  [acc.\n or \n 'Ala], Excepted, excluded; made an exception of.\n ثِنْي (pl.\n\
                \ أَثْنَآء []  )\na. Fold, bend.\n b. Repetition, reiteration.\n c.  A two-year-old (animal). \n مَثْنًى []\n\
                a. By twos, two by two.\n ثَانٍ (ثَاني ) []  \na. Second, the second.\n b. Folded over, bent back, doubled\
                \ up.\n ثَانِيًا\n a. Secondly, in the second place.\n ثَانِيَة []  (pl.\n ثَوَانٍ\n a.  [ ثَوَاني] [ثَوَاْنِيُ]),\
                \ second ( of time ). \nb. Joist, small beam.\n ثَنَآء []  (pl.\n أَثْنِيَة []  )\na. Praise, eulogy.\n ثِنَآء\
                \ []\na.  Strands ( of a rope ). \n ثُنَآءً []\na. By twos, two by two.\n ثَنِيَّة []  (pl.\n ثَنَايَا)\n\
                a. Praise, eulogy; compliment.\n b. Mountain, mountain-road.\n c. Front; front-teeth: mouth.\n أَثْنآء []\n\
                a. Intervals, pauses: entr'acte.\n في الأَثْنَآء\n a. In the intervals of.\n في أَتْنَآء ذَلِك\n a. Meanwhile,\
                \ in the mean time.\n المُثَنَّى\n a. The dual.\n مَثْنِيّ\n a. Doubled, folded.\n تَثْنِيَة [ n.\n ac.\n\
                \ ثَنَّيَ\n (ثِنْي)]\na. Praise, eulogy.\n b.  Dualizing (gram.). \nc. Repetition.\n تَثْنِيَة الإِشْتِرَاع\n\
                \ a. Deuteronomy.\n إِثْنَان — إِثْنَيْن [ mas. ]\na. Two.\n الإِثْنَيْن\n a. Monday.\n إِثْنَتَان [ fem.]\n\
                a. Two."
