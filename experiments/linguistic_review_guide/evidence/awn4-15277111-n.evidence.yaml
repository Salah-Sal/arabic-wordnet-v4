        (1) طبعة فوقيّة. وبخاصّة: رقم أو كلمة أو علامة تُطبَع على الطابع البريدي لتغيير قيمته أو ابتغاء الاحتفال بذكرى معيّنة
        (2) الطابع الموسوم: طابع بريدي يحمل مثل هذا الرقم إلخ.
