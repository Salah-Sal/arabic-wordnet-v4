            form: null
            is_partial: 1
            definitions_text: 'من النُّوقِ : التي وَضَعَتْ بَطْنَيْن امْرَأَةٌ ثِنْيٌ : وَلَدَتْ اثنين الوَلَدُ الثانى للنَّاقَةِ
              أو المَرْأةِ من الرِّجالِ : الثانِي في المَرْتَبَةِ بعدَ السَّيِّدِ من الثَّوْبِ ونَحْوِه : ما ثُنِيَ منه وكُفَّ
              من أطْرافِه من الحَبْلِ : قُوَّتُه وطاقَتُه طَرَفُه المَثْنِيُّ , يُقالُ : قَبَضَ بِثِنْي الحَبْل من الحيَّةِ
              : ما تَعَوَّجَ منها وتَطَوَّى أَنْفَذْتُ كَذا ثِنْيَ كِتابِي , أى : عَلَيْه من الوادى , أو الجَبَلِ : مُنْعَطَفُه
              من اللَّيْلِ : ساعةٌ منه , أو وَقْتٌ , يُقالُ : مَضَى ثِنْيٌ من اللَّيْل جاءَ في أثناءِ الأمرِ , وعَرَفْتُ ذَلِكَ
              في أثناءِ كَلامِه : خِلالَه يَوْمُ الثِّنْيِ : يومٌ مَشْهُورٌ لخالِدِ بنِ الوَلِيدِ على الفُرْسِ قُرْبَ البَصْرَة'
