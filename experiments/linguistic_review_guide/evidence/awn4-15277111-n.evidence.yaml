            form: null
            is_partial: 0
            definitions_text: 'مائَتَيْنِ من طَرَفِ الزِّمَامِ الحَبْلُ من صُوفٍ أو شَعَر , وقيل : الحَبْلُ من أَيِّ شَيْءٍ
              كان ( فى العِبْرية Misna مشنا : تكرار , من الفعل Sana شانا : كرر ) : كتابٌ وَضَعَهُ أَحْبارُ اليَهُود , فيه
              أخبارُ بنى إسرائيل بعد مُوسَى . به أَحْكام فقهيّة مُسْتَنْبطة من التَّوراة , ويَتَضَمَّن عاداتٍ يعتقدُ اليَهُودُ
              أَنَّهُم كَانُوا يَسِيرُونَ عليها فى عَهْدِ مُوسَى عليه السلام , ويَتَضَمَّنُ كذلك ما أَدْخَلَهُ عُلماؤُهُم
              فى مَسائِل الوعظ والإرشاد'
