            root_source: ocr
            pos: noun
            form: null
            is_partial: 0
            definitions_text: 'القُرْآنُ كُلُّه, لأنَّ القَصَصَ والأمْثالَ تُثَنَّي فيه فاتِحَةُ الكتابِ, لأنَّها يُثَنَّى
              بها, وتُعادُ في كُلِّ ركعة من رَكَعَاتِ الصَّلاة السُّوَرُ التي تَقْصُرُ عن المِائِين من الآياتِ, وتزِيدُ على
              المُفَصَّلِ, كأنَّ المِائِينَ جُعِلَتْ مبادئِء, والتي تليها المثاني ما أُثْنِيَ به من آياتِ القُرْآن على اللهِ
              تبارَكَ وتَقَدَّسَ, لأنَّ فيها حَمْدَ اللهِ وتَوْحِيدَه وذِكْرَ مُلْكِه يومَ الدِّين من الوادى: مَعاطِفُه ومَحانيه
              من الدَّابَّةِ: رُكْبَتاها ومِرْفَقَاها'
