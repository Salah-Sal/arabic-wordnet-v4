            definitions:
            - sense_index: 0
              text: القُرْآنُ كُلُّه, لأنَّ القَصَصَ والأمْثالَ تُثَنَّي فيه
              is_raw: 0
            - sense_index: 1
              text: فاتِحَةُ الكتابِ, لأنَّها يُثَنَّى بها, وتُعادُ في كُلِّ ركعة من رَكَعَاتِ الصَّلاة
              is_raw: 0
            - sense_index: 2
              text: السُّوَرُ التي تَقْصُرُ عن المِائِين من الآياتِ, وتزِيدُ على المُفَصَّلِ, كأنَّ المِائِينَ جُعِلَتْ مبادئِء,
                والتي تليها المثاني
              is_raw: 0
            - sense_index: 3
              text: ما أُثْنِيَ به من آياتِ القُرْآن على اللهِ تبارَكَ وتَقَدَّسَ, لأنَّ فيها حَمْدَ اللهِ وتَوْحِيدَه وذِكْرَ
                مُلْكِه يومَ الدِّين
              is_raw: 0
            - sense_index: 4
              text: 'من الوادى: مَعاطِفُه ومَحانيه'
              is_raw: 0
            - sense_index: 5
              text: 'من الدَّابَّةِ: رُكْبَتاها ومِرْفَقَاها'
              is_raw: 0
            examples:
            - idx: 0
              type: poetry
              text: فَمَنْ لِلـقـوافـي بـعـدَ حَـسَّـانَ وابْـنِـه ومن للمَثانِي بَعْدَ زَيْدِ بنِ ثابِتِ
              attribution: حَسَّانُ بنُ ثابِتٍ
            - idx: 1
              type: poetry
              text: ويَخْدِى عَلَى صُمٍّ صِلابٍ مَلاطِسٍ شَــدِيـاتِ عَقْـدٍ لَـيِّـنـاتِ مَـثـانِي
