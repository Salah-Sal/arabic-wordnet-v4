            definitions_text: |-
              ث ن ي : الثَّنِيَّةُ مِنْ الْأَسْنَانِ جَمْعُهَا ثَنَايَا وَثَنِيَّاتٌ وَفِي الْفَمِ أَرْبَعٌ وَالثَّنِيُّ الْجَمَلُ يَدْخُلُ فِي السَّنَةِ السَّادِسَةِ وَالنَّاقَةُ ثَنِيَّةٌ وَالثَّنِيُّ أَيْضًا الَّذِي يُلْقِي ثَنِيَّتَهُ يَكُونُ مِنْ ذَوَاتِ الظِّلْفِ وَالْحَافِرِ فِي السَّنَةِ الثَّالِثَةِ وَمِنْ ذَوَاتِ الْخُفِّ فِي السَّنَةِ السَّادِسَةِ وَهُوَ بَعْدَ الْجَذَعِ وَالْجَمْعُ ثِنَاءٌ بِالْكَسْرِ وَالْمَدِّ وَثُنْيَانٌ مِثْلُ: رَغِيفٍ وَرُغْفَانٌ وَأَثْنَى إذَا أَلْقَى ثَنِيَّتَهُ فَهُوَ ثَنِيٌّ فَعِيلٌ بِمَعْنَى الْفَاعِلِ وَالثُّنْيَا بِضَمِّ الثَّاءِ مَعَ الْيَاءِ وَالثَّنْوَى بِالْفَتْحِ مَعَ الْوَاوِ اسْمٌ مِنْ الِاسْتِثْنَاءِ.وَفِي الْحَدِيثِ «مَنْ اسْتَثْنَى فَلَهُ ثُنْيَاهُ» أَيْ مَا اسْتَثْنَاهُ وَالِاسْتِثْنَاءُ اسْتِفْعَالٌ مِنْ ثَنَيْثُ الشَّيْءَ أَثْنِيهِ ثَنْيًا مِنْ بَابِ رَمَى إذَا عَطَفْته وَرَدَدْتُهُ وَثَنَيْتُهُ عَنْ مُرَادِهِ إذَا صَرَفْتُهُ عَنْهُ وَعَلَى هَذَا فَالِاسْتِثْنَاءُ صَرْفُ الْعَامِلِ عَنْ تَنَاوُلِ الْمُسْتَثْنَى وَيَكُونُ حَقِيقَةً فِي الْمُتَّصِلِ.وَفِي الْمُنْفَصِلِ أَيْضًا لِأَنَّ إلَّا هِيَ الَّتِي عَدَّتْ الْفِعْلَ إلَى الِاسْمِ حَتَّى نَصَبَهُ فَكَانَتْ بِمَنْزِلَةِ الْهَمْزَةِ فِي التَّعْدِيَةِ وَالْهَمْزَةُ تُعَدِّي الْفِعْلَ إلَى الْجِنْسِ وَغَيْرِ الْجِنْسِ حَقِيقَةً وِفَاقًا فَكَذَلِكَ مَا هُوَ بِمَنْزِلَتِهَا.
              وَثَنَيْتُهُ ثَنْيًا مِنْ بَابِ رَمَى أَيْضًا صِرْتُ مَعَهُ ثَانِيًا وَثَنَّيْتُ الشَّيْءَ بِالتَّثْقِيلِ جَعَلْتُهُ اثْنَيْنِ وَأَثْنَيْتُ عَلَى زَيْدٍ بِالْأَلِفِ وَالِاسْمُ الثَّنَاءُ بِالْفَتْحِ وَالْمَدِّ يُقَالُ أَثْنَيْتُ عَلَيْهِ خَيْرًا وَبِخَيْرٍ وَأَثْنَيْتُ عَلَيْهِ شَرًّا وَبِشَرٍّ لِأَنَّهُ بِمَعْنَى وَصَفْتُهُ هَكَذَا نَصَّ عَلَيْهِ جَمَاعَةٌ مِنْهُمْ صَاحِبُ الْمُحْكَمِ وَكَذَلِكَ صَاحِبُ الْبَارِعِ وَعَزَاهُ إلَى الْخَلِيلِ وَمِنْهُمْ مُحَمَّدُ بْنُ الْقُوطِيَّةِ وَهُوَ الْحَبْرُ الَّذِي لَيْسَ فِي مَنْقُولِهِ غَمْزٌ وَالْبَحْرُ الَّذِي لَيْسَ فِي مَنْقُودِهِ لَمْزٌ وَكَأَنَّ الشَّاعِرَ عَنَاهُ بِقَوْلِهِإذَا قَالَتْ حَذَامِ فَصَدِّقُوهَا ... فَإِنَّ الْقَوْلَ مَا قَالَتْ حَذَامِوَقَدْ قِيلَ فِيهِ هُوَ الْعَالِمُ التَّحْرِيرُ ذُو الْإِتْقَانِ وَالتَّحْرِيرِ وَالْحُجَّةُ لِمَنْ بَعْدَهُ وَالْبُرْهَانُ الَّذِي يُوقَفُ عِنْدَهُ وَتَبِعَهُ عَلَى ذَلِكَ مِنْ عُرِفَ بِالْعَدَالَةِ وَاشْتَهَرَ بِالضَّبْطِ وَصِحَّةِ الْمَقَالَةِ وَهُوَ السَّرَقُسْطِيّ وَابْنُ الْقَطَّاعِ وَاقْتَصَرَ جَمَاعَةٌ عَلَى قَوْلِهِمْ أَثْنَيْتُ عَلَيْهِ بِخَيْرٍ وَلَمْ يَنْفُوا غَيْرَهُ وَمِنْ هَذَا اجْتَرَأَ بَعْضُهُمْ فَقَالَ لَا يُسْتَعْمَلُ إلَّا فِي الْحَسَنِ وَفِيهِ نَظَرٌ لِأَنَّ تَخْصِيصَ الشَّيْءِ بِالذِّكْرِ لَا يَدُلُّ عَلَى نَفْيِهِ عَمَّا عَدَاهُ وَالزِّيَادَةُ مِنْ الثِّقَةِ مَقْبُولَةٌ وَلَوْ كَانَ الثَّنَاءُ لَا يُسْتَعْمَلُ إلَّا فِي الْخَيْرِ كَانَ قَوْلُ الْقَائِلِ أَثْنَيْتُ عَلَى زَيْدٍ كَافِيًا فِي الْمَدْحِ وَكَانَ قَوْلُهُ وَلَهُ الثَّنَاءُ الْحَسَنُ لَا يُفِيدُ إلَّا التَّأْكِيدَ وَالتَّأْسِيسُ أَوْلَى فَكَانَ فِي قَوْلِهِ الْحَسَنُ احْتِرَازٌ عَنْ غَيْرِ الْحَسَنِ فَإِنَّهُ يُسْتَعْمَلُ فِي النَّوْعَيْنِ كَمَا قَالَ وَالْخَيْرُ فِي يَدَيْكَ وَالشَّرُّ لَيْسَ إلَيْكَ.وَفِي الصَّحِيحَيْنِ «مَرُّوا بِجِنَازَةٍ فَأَثْنَوْا عَلَيْهَا خَيْرًا فَقَالَ - عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ - وَجَبَتْ ثُمَّ مَرُّوا بِأُخْرَى فَأَثْنَوْا عَلَيْهَا شَرًّا فَقَالَ - عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ - وَجَبَتْ وَسُئِلَ عَنْ قَوْلِهِ وَجَبَتْ فَقَالَ هَذَا أَثْنَيْتُمْ عَلَيْهِ خَيْرًا فَوَجَبَتْ لَهُ الْجَنَّةُ وَهَذَا أَثْنَيْتُمْ عَلَيْهِ شَرًّا فَوَجَبَتْ لَهُ النَّارُ» الْحَدِيثَ وَقَدْ نُقِلَ النَّوْعَانِ فِي وَاقِعَتَيْنِ تَرَاخَتْ إحْدَاهُمَا عَنْ الْأُخْرَى مِنْ الْعَدْلِ الضَّابِطِ عَنْ الْعَدْلِ الضَّابِطِ عَنْ الْعَرَبِ الْفُصَحَاءِ عَنْ أَفْصَحِ الْعَرَبِ فَكَانَ أَوْثَقَ مِنْ نَقْلِ أَهْلِ اللُّغَةِ فَإِنَّهُمْ قَدْ يَكْتَفُونَ بِالنَّقْلِ عَنْ وَاحِدٍ وَلَا يُعْرَفُ حَالُهُ فَإِنَّهُ قَدْ يَعْرِضُ لَهُ مَا يُخْرِجُهُ عَنْ حَيِّزِ الِاعْتِدَالِ مِنْ دَهَشٍ وَسُكْرٍ وَغَيْرِ ذَلِكَ فَإِذَا عُرِفَ حَالُهُ لَمْ يُحْتَجَّ بِقَوْلِهِ وَيَرْجِعُ قَوْلُ مَنْ زَعَمَ أَنَّهُ لَا يُسْتَعْمَلُ فِي الشَّرِّ إلَى النَّفْيِ وَكَأَنَّهُ قَالَ لَمْ يُسْمَعْ فَلَا يُقَالُ وَالْإِثْبَاتُ أَوْلَى وَلِلَّهِ دَرُّ مَنْ قَالَوَإِنَّ الْحَقَّ سُلْطَانٌ مُطَاعٌ ... وَمَا لِخِلَافِهِ أَبَدًا سَبِيلٌوَقَالَ بَعْضُ الْمُتَأَخِّرِينَ إنَّمَا اُسْتُعْمِلَ فِي الشَّرِّ فِي الْحَدِيثِ لِلِازْدِوَاجِ وَهَذَا كَلَامُ مِنْ لَا يَعْرِفُ اصْطِلَاحَ أَهْلِ الْعِلْمِ بِهَذِهِ اللَّفْظَةِ وَالثِّنَاءُ لِلدَّارِ كَالْفِنَاءِ وَزْنًا وَمَعْنًى وَالثِّنَى بِالْكَسْرِ وَالْقَصْرِ الْأَمْرُ يُعَادُ مَرَّتَيْنِ وَالِاثْنَانِ مِنْ أَسْمَاءِ الْعَدَدِ اسْمٌ لِلتَّثْنِيَةِ حُذِفَتْ لَامُهُ وَهِيَ يَاءٌ وَتَقْدِيرُ الْوَاحِدِ ثَنْيٌ وِزَانُ سَبَبٍ ثُمَّ عُوِّضَ هَمْزَةَ وَصْلٍ فَقِيلَ اثْنَانِ وَلِلْمُؤَنَّثَةِ اثْنَتَانِ كَمَا قِيلَ ابْنَانِ وَابْنَتَانِ.وَفِي لُغَةِ تَمِيمٍ ثِنْتَانِ بِغَيْرِ هَمْزَةِ وَصْلٍ وَلَا وَاحِدَ لَهُ مِنْ لَفْظِهِ وَالتَّاءُ فِيهِ لِلتَّأْنِيثِ ثُمَّ سُمِّيَ الْيَوْمُ بِهِ فَقِيلَ يَوْمُ الِاثْنَيْنِ وَلَا يُثَنَّى وَلَا يُجْمَعُ فَإِنْ أَرَدْتَ جَمْعَهُقَدَّرْتَ أَنَّهُ مُفْرَدٌ وَجَمَعْتَهُ عَلَى أَثَانِينَ وَقَالَ أَبُو عَلِيٍّ الْفَارِسِيُّ وَقَالُوا فِي جَمْعِ الِاثْنَيْنِ أَثْنَاءٌ وَكَأَنَّهُ جَمْعُ الْمُفْرَدِ تَقْدِيرًا مِثْلُ: سَبَبٍ وَأَسْبَابٍ وَقِيلَ أَصْلُهُ ثِنْيٌ وِزَانُ حِمْلٍ وَلِهَذَا يُقَالُ ثِنْتَانِ وَالْوَجْهُ أَنْ يَكُونَ اخْتِلَافَ لُغَةٍ لَا اخْتِلَافَ اصْطِلَاحٍ وَإِذَا عَادَ عَلَيْهِ ضَمِيرٌ جَازَ فِيهِ وَجْهَانِ أَوْضَحُهُمَا الْإِفْرَادُ عَلَى مَعْنَى الْيَوْمِ يُقَالُ مَضَى يَوْمُ الِاثْنَيْنِ بِمَا فِيهِ وَالثَّانِي اعْتِبَارُ اللَّفْظِ فَيُقَالُ بِمَا فِيهِمَا وَأَثْنَاءُ الشَّيْءِ تَضَاعِيفُهُ وَجَاءُوا فِي أَثْنَاءِ الْأَمْرِ أَيْ: فِي خِلَالِهِ تَقْدِيرُ الْوَاحِدِ ثَنًى أَوْ ثِنْيٌ كَمَا تَقَدَّمَ.
