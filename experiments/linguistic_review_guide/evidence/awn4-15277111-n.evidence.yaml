              text: 'ثنىالثَّنْي والاثنان أصل لمتصرفات هذه الكلمة، ويقال ذلك باعتبار العدد، أو باعتبار التكرير الموجود فيه
                أو باعتبارهما معا، قال الله تعالى:ثانِيَ اثْنَيْنِ [التوبة/ 40] ، اثْنَتا عَشْرَةَ عَيْناً [البقرة/ 60] ،
                وقال: مَثْنى وَثُلاثَ وَرُباعَ[النساء/ 3] فيقال: ثَنَّيْتُهُ تَثْنِيَة: كنت له ثانيا، أو أخذت نصف ماله، أو
                ضممت إليه ما صار به اثنين.والثِّنَى: ما يعاد مرتين، قال عليه السلام:«لا ثِنى في الصّدقة» أي: لا تؤخذ في السنة
                مرتين. قال الشاعر:لقد كانت ملامتها ثنىوامرأة ثِنْيٌ: ولدت اثنين، والولد يقال له:ثِنْيٌ، وحلف يمينا فيها ثُنْيَا
                وثَنْوَى وثَنِيَّة ومَثْنَوِيَّة ، ويقال للاوي الشيء: قد ثَناه، نحو قوله تعالى: أَلا إِنَّهُمْ يَثْنُونَ صُدُورَهُمْ[هود/
                5] ، وقراءة ابن عباس: (يَثْنَوْنَى صدورهم) من: اثْنَوْنَيْتُ، وقوله عزّ وجلّ:ثانِيَ عِطْفِهِ[الحج/ 9] ، وذلك
                عبارة عن التّنكّر والإعراض، نحو: لوى شدقه، وَنَأى بِجانِبِهِ [الإسراء/ 83] .والثَّنِيُّ من الشاة: ما دخل في
                السنة الثانية وما سقطت ثنيته من البعير، وقد أَثْنَى، وثَنَيْتُ الشيء أَثْنِيهِ: عقدته بثنايين غير مهموز، قيل
                : وإنما لم يهمز لأنه بنى الكلمة على التثنية، ولم يبن عليه لفظ الواحد. والمُثَنَّاة: ما ثني من طرف الزمام،
                والثُّنْيَان الذي يثنّى به إذا عدّ السادات. وفلان ثَنِيَّة أهل بيته كناية عن قصور منزلته فيهم، والثَّنِيَّة
                من الجبل: ما يحتاج في قطعه وسلوكه إلى صعود وحدود، فكأنه يثني السير، والثّنية من السنّ تشبيها بالثّنية من الجبل
                في الهيئة والصلابة. والثُّنْيَا من الجزور: ما يثنيه جازره إلى ثنيه من الرأس والصلب، وقيل: الثُّنْوَى والثَّنَاء:
                ما يذكر في محامد الناس، فيثنى حالا فحالا ذكره، يقال: أثني عليه.وتَثَنَّى في مشيته نحو: تبختر، وسميت سور القرآن
                مثاني في قوله عزّ وجلّ: وَلَقَدْ آتَيْناكَ سَبْعاً مِنَ الْمَثانِي [الحجر/ 87] لأنها تثنى على مرور الأوقات
                وتكرّر فلا تدرس ولا تنقطع دروس سائر الأشياء التي تضمحل وتبطل على مرور الأيام، وعلى ذلك قوله تعالى: اللَّهُ
                نَزَّلَ أَحْسَنَ الْحَدِيثِ كِتاباً مُتَشابِهاً مَثانِيَ [الزمر/ 23] ، ويصح أنه قيل للقرآن: مثاني، لما يثنى
                ويتجدّد حالا فحالا من فوائده، كما روي في الخبر في صفته: «لا يعوجّ فيقوّم ولا يزيغ فيستعتب، ولا تنقضي عجائبه»
                .ويصح أن يكون ذلك من الثناء، تنبيها على أنه أبدا يظهر منه ما يدعو إلى الثناء عليه وعلى من يتلوه، ويعلمه ويعمل
                به، وعلى هذا الوجه وصفه بالكرم في قوله تعالى: إِنَّهُ لَقُرْآنٌ كَرِيمٌ [الواقعة/ 77] ، وبالمجد في قوله:بَلْ
                هُوَ قُرْآنٌ مَجِيدٌ [البروج/ 21] .والاستثناء: إيراد لفظ يقتضي رفع بعض ما يوجبه عموم لفظ متقدم، أو يقتضي رفع
                حكم اللفظ عما هو. فممّا يقتضي رفع بعض ما يوجبه عموم اللفظ قوله تعالى: قُلْ لا أَجِدُ فِي ما أُوحِيَ إِلَيَّ
                مُحَرَّماً عَلى طاعِمٍ يَطْعَمُهُ إِلَّا أَنْ يَكُونَ مَيْتَةً الآية: [الأنعام/ 145] .وما يقتضي رفع ما يوجبه
                اللفظ فنحو قوله:والله لأفعلنّ كذا إن شاء الله، وامرأته طالق إن شاء الله، وعبده عتيق إن شاء الله، وعلى هذا
                قوله تعالى: إِذْ أَقْسَمُوا لَيَصْرِمُنَّها مُصْبِحِينَ وَلا يَسْتَثْنُونَ [القلم/ 17- 18] .'
