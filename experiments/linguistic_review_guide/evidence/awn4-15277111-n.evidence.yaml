            definitions:
            - sense_index: 0
              text: |-
                [ث ن ي] ثَنَى الشَّيْءَ ثَنْيًا رَدَّ بعضَه على بَعْضٍ وقد تَثَنَّى وانْثَنَى وأَثْناءُه ومَثانِيه قُواهُ وطاقاتُه واحِدُها ثِنْيٌ ومَثْناةٌ ومِثْناةٌ عن ثَعْلِبٍ وثِنْيُ الحَيَّةِ انْثِناؤُها وهُو أَيْضًا ما تَعَوَّجَ مِنها إِذا تَثَنَّتْ والجَمْعُ أَثْناءٌ واسْتَعارَه غَيْلانُ الرَّبَعِيُّ لِلَّيْلِ فقالَ
                (حَتّى إِذا شَقَّ بَهِيمَ الظَّلْماءْ ... )
                (وساقَ لَيْلاً مُرْجَحِنَّ الأثْناءْ ... )
                وهُوَ عَلَى القَوْلِ الآخَرِ اسْمٌ وأَثْناءُ الوادِي مَعاطِفُه وأَجْزاعُه وقولُه
                (فإِنْ عُدَّ مَجْدٌ أَو قَدِيمٌ لمَعْشَر ... فقَوْمِي بهم تُثْنَى هُناكَ الأَصابِعُ)
                يعنِي أَنَّهُم الخِيارُ المَعْدُودُونَ عن ابنِ الأَعْرابِيِّ لأَنَّ الخيارَ لا يَكْثُرُونَ وشاةٌ ثانِيَةٌ بَيِّنَةُ الثِّنْي تَثْنِي عُنُقَها لِغيرِ عِلَّةٍ وثَنَى رِجْلَه عن دابَّتِه ضَمَّها إِلى فَخِذِه فنَزَل والاثْنانِ ضِعْفُ الواحِدِ فأَمّا قَوْلُه عَزَّ وجَلّ {لا تتخذوا إلهين} اثْنَيْنِ النحل 51 فمن التَّطَوُّع المُشامِ للتَّوكِيدِ وذلك لأَنَّه قد غَنِيَ بقَوْلِه {إلهين} عن {اثنين} فدَلَّنا أَنَّ فائدَتَه التوكيدُ والتَّشْدِيدُ ونظيرُه قولُه تَعالَى {ومناة الثالثة الأخرى} النجم 20 أكَّدَ بقَوْلِه {الأخرى} وقولُه تعالَى {فإذا نفخ في الصور نفخة واحدة} الحاقة 13 فأكَّدَ بقولِه واحِدَةٌ والمُؤَنِّث الثَّنْتانِ تاؤُه مُبْدَلَةٌ من ياء ويَدُلُّ على أَنَّه من الياءِ أَنَّه من ثَنَيْتُ لأنَّ الاثْنَيْن قد ثُنِيَ أَحَدُهُما إلى صاحِبِه وأَصْلُه ثَنَيٌ يَدُلُّكَ على ذلك جَمْعُهم إِيّاه على أَثْناءٍ بمَنْزِلَة أَبْناءٍ وآخاءٍ فنَقَلُوه من فَعَلٍ إلى فِعْلٍ كما فَعَلُوا ذلك في بِنْتٍ وليسَ في الكَلامِ تاءٌ مُبْدَلَةٌ من الياءِ في غير افْتَعَلَ إِلاَّ فِيما حكاهُ سِيبَوَيْهِ من قَوْلِهم أَسْنَتُوا وما حَكاهُ أَبُو عَليٍّ من قَوْلِهم ثِنْتانِ وقولُه تعالى {فإن كانتا اثنتين فلهما الثلثان} النساء 176 إِنَّما الفائِدةُ في قَوْلِه {اثنتين} بعد قولِه {كانتا} تَجَرُّدُهما من مَعْنَى الصِّغَرِ والكِبَرِ وإِلاَّ فقَدْ عُلِمَ أَنَّ الألِفَ في {كانتا} وغيرِها من الأَفْعالِ علامَةٌ للتَّثْنِيَةِ وثَنَّى الشَّيْءَ جَعَلَه اثْنَيْن واتَّنَى افَتَعَلَ منه أصلُه اثْتَنَى فقُلِبَت الثّاءُ تاءً لأنَّ الثاءَ أُخْتُ التاءِ في الهَمْسِ ثم أُدْغِمَتْ فِيها قال
                (بَدَا بأَبِي ثُمّ اثَّنَى ببَنِي أَبِي ... وثَلَّثَ بالأَدْنَيْنَ ثَقْف المَحالِبِ)
                هذا هو المَشْهُورُ في الاسْتِعمالِ والقَوِيُّ في القِياسِ ومِنْهُم من يَقْلِب تاءَ افْتَعَل ثاءً فيَجْعَلُها من لَفْظِ الثاء قَبْلَها فيَقُول اثَّنَى واثَّرَدَ واثَّأَرَ كما قالَ بعضُهم في اذْدَكَر {ادكر} وفي اصْطَلَحُوا اصَّلَحُوا وهذا ثانِي هذا أَي الَّذِي شَفَعَه ولا يُقالُ ثَنَيْتُه إِلاّ أَنَّ أَبا زَيْدٍ قال هو واحِدٌ فاثْنِه أَي كُنْ له ثانِيًا وحكَى ابنُ الأَعْرابِيّ أَيضًا فلانٌ لا يَثْنِي ولا يَثْلِثُ أَي هو رَجُلٌ كَبِيرٌ فإِذا أَرادَ النُّهُوضَ لم يَقْدِرْ في مَرَّةٍ ولا فِي مَرَّتَيْن ولا في الثّالِثَة وشَرِبْتُ أَثْناءَ القَدَحِ وشَرِبْتُ اثْنَيْ هذا القَدَح أَي اثْنَيْن مِثْلَه وكذلك شَرِبْتُ اثْنَيْ مُدِّ البَصْرَةِ واثْنَيْنِ بمُدِّ البَصْرَةِ وثَنَّيْتُ الشيءَ جَعَلْتُه اثْنَيْن وجاءَ القَوْمُ مَثَنَى وثُناءَ وكَذلك النِّسْوَةُ وسائرُ الأَنْواعِ أَي اثْنَيْنِ اثْنَيْن وثِنْتَيْن ثِنْتَيْن وقولُه أَنْشَدَه ابنُ الأَعْرابِيِّ
                (فما حَلَبَتْ إِلا الثُّلاثَةَ والثُّنَى ... ولا قُيِّلَتْ إِلاّ قَرِيبًا مَقَالُها)
                قالَ أَرادَ بالثُّلاثَة الثَّلاثَةَ من الآنِيَةِ وبالثُّنَى الاثْنَيْنِ وقَوْلُ كُثَيِّرِ عَزَّةَ
                (ذكَرْتَ عَطاياهُ ولَيْسَتْ بحُجَّةٍ ... عليكَ ولكن حُجَّةٌ لكَ فاثْنِنِ)
                قِيلَ في تَفْسِيرِه أَعْطِني مَرَّةً ثانِيَةً ولم أَرَهُ في غيرِ هذا الشِّعرِ والاثْنانِ من أَيَّامِ الأُسْبُوع لأنَّ الأوَّلَ عندهم الأحَدُ والجمع أثناء وحكى المُطَرِّزُ عن ثَعْلَبٍ أَثانِين وحَكَى سِيبَوَيْهِ عن بعضِ العَرَبِ اليوم الثَّنَى وقال أَمّا قَوْلُهم الاثْنانِ فإِنَّما هُو اسمُ اليَوْمِ وإِنَّما أوقَعَتُه العَرَبُ على قَوْلِكَ اليومُ يَوْمان واليَوْمُ خَمْسَة عَشَرَ من الشَّهْرِ ولا يُثَنَّى والَّذِين قالُوا أَثْناء جاءُوا به عَلَى الإثْنِ وإن لم يُتكَلَّمْ به وهو بمَنْزِلَةِ الثُّلاثاءِ والأَرْبعاءِ يَعْنِي أَنه صارَ اسْمًا غالبًا قالَ اللِّحْيانِيُّ وقد قالوُا في الشِّعِر يومُ اثْنَيْنِ بغير لامٍ وأَنْشَدَ لأَبِي صَخْرٍ الهُذَلِيِّ
                (أَرائِحٌ أَنْتَ يَوْمَ اثْنَيْنِ أَم غادِي ... ولَمْ تُسَلِّم عَلَى رَيْحانَةِ الوادِي)
                قالَ وكانَ أُبو زِيادٍ يَقُول مَضَى الاثْنانِ بما فِيه فيُوَحِّدُ ويُذَكِّرُ وكَذا يَفْعَلُ في سائِرِ أَيّامِ الأُسْبُوع كُلِّها وكان يُؤَنِّثُ الجُمُعَةَ وكانَ أَبُو الجَرّاحِ يَقُولُ مَضَى السَّبْتُ بما فِيه ومَضَى الأَحَدُ بِما فِيه ومَضَى الاثْنانِ بما فِيهِما ومَضَى الثُّلاثاءُ بما فِيهِنَّ ومَضَى الأرْبعاءُ بما فِيهِنَّ ومَضَى الخَمِيسُ بما فِيهِنَّ ومَضَت الجُمُعَةُ بما فِيها كانَ يُخْرِجُها مُخْرَجَ العَدَدِ قال ابنُ جِنِّي اللاّمُ في الاثْنَيْن غير زائدةٍ وإِنْ لم يَكُنْ الاثْنانِ صِفَةً قال أَبُو العَبّاسِ إِنّما جازَ دُخُول اللاّمِ عليهِ لأَنَّ فيه تَقْدِيرَ الوَصْفِ أَلا تَرَى أَنَّ مَعْناهُ اليَوْمُ الثّانِي وكذلك أَيضًا اللامُ في الأَحَدِ والثُّلاثاءِ والأَرْبعاءِ ونحوِها لأنَّ تَقْدِيرَها الواحدُ والثانِي والثالِثُ والرابعُ والخامِسُ والجامعُ والسّابِتُ والسَّبْتُ القَطْعُ وقيل إِنّما سُمِّيَ بذلك لأَنَّ اللهَ عَزَّ وجَلَّ خَلَق السَّمواتِ والأَرْضِ في سِتَّةِ أَيّامٍ أَوَّلُها الأحدُ وآخِرُها الجُمُعَةُ فأَصْبَحَتْ يومَ السَّبتِ مُنْسَبِتَةً أَي قد تَمَّتْ وانْقَطَعَ العَمَلُ فيها وقِيلَ سُمِّيَ بذلِك لأَنَّ اليَهُودَ كانُوا يَنْقَطِعُون فيه عن تَصَرُّفِهِم ففِي كلا القَوْلَيْنِ مَعْنَى الصِّفَةِ مَوْجُودٌ وحَكى ثَعْلَبٌ عن ابنِ الأَعْرابيِّ لا تَكُنْ اثْنَوِيّا أَي مِمَّنْ يَصُومُ الاثْنَيْن وَحْدَه والمَثانِي من أَوْتَارِ العُودِ الذي بعد الأوّل واحدها مَثْنًى والمثانِي من القُرْآن ما ثُنِّي مَرَّةً بعدَ مَرَّةٍ وقِيل فاتِحةُ الكِتَابِ قالَ ثَعْلِبٌ لأَنَّها تُثَنَّى مع كُلِّ سُورةٍ وقِيلَ المَثانِي سُوَرٌ أوَّلُها البَقَرَةُ وآخِرُها بَراءَةٌ وقِيلَ ما كانَ دُونَ المِئينَ وقِيلَ القرآنُ كُلُّهُ وقول حَسّانَ أنشده ثَعْلَبٌ
                (مَنْ للقَوافِي بعدَ حَسّانَ وابْنِه ... ومَنْ للمَثانِي بعدَ زَيْدِ بنِ ثابتِ)
                يَدُلُّ عَلَيْهِ وقالَ اللِّحْيانِيُّ التَّثْنِيةُ أَنْ يفوزَ قِدْحُ رَجُلٍ منهم فيَنْجُوَ ويَغْنَمَ فيُطْلَبَ إليهم أَنْ يُعِيدُوه عَلَى خطارٍ والأَوَّلُ أَقْيَسُ وأَقْرَبُ إِلى الاشْتِقاقِ وقِيلَ هو ما اسْتُكْتِبَ من غيرِ كِتابِ اللهِ ومَثْنَى الأَيادِي أَنْ يَأْخُذَ القِسْمَ مَرَّةً بعدَ مَرَّةٍ وقِيلَ هي الأنْصِباءُ التي كانتْ تَفْضُلُ من الجَزُورِ فكانَ الرَّجُلُ الجَوادُ يَشْتَرِيها فيُطْعِمُها الأَبْرامَ وهم الَّذِينَ لا يَيْسِرُونَ هذا قولُ أَبي عُبَيْدٍ وناقَةٌ ثِنْيٌ إِذا وَلَدَتِ اثْنَينِ وقِيلَ إِذا وَلَدَتْ بَطْنًا واحِدًا والأَوَّلُ أَقْيَسُ وجَمْعُها ثِناءٌ كظِئْرٌ وظُؤارٍ وثِنْيُها وَلَدُها واسْتَعارَهُ لَبِيدٌ للمَرْأَةِ فقالَ
                (لَيَالِيَ تحتَ الخِدْرِ ثِنْيُ مُصِيفَة ... من الأُدْمِ تَرْتادُ الشُّرُوجَ القَوابِلاَ)
                والجمعُ أَثْناءٌ قال
                (قامَ إِلى حَمْراءَ من أَثْنائِها ... )
                قالَ أَبُو رِياشٍ ولا يُقالُ بعدَ هذا شَيْءٌ مشتقًا والثَّوانِي القُرونُ الَّتِي بعد الأَوائل والثَّنَى في الصَّدَقَةِ أَن تُؤْخَذَ في العامِ مَرَّتَيْنِ ويُرْوَى عن النَّبيِّ صلى الله عليه وسلم أَنَّه قالَ
                لا ثَنِي في الصَّدَقَةِ والثَّنَى هو أَنْ تُؤْخَذَ ناقَتانِ في الصَّدَقةِ مكانَ واحِدَةٍ والمَثْناةُ والمِثْناةُ حَبْلٌ من صُوفٍ أَو شَعَرٍ وقِيلَ هو الحَبْلُ من أَيِّ شيءٍ كانَ وقالَ ابنُ الأَعْرابِيِّ المَثناةُ بالفَتْحِ الحَبلُ وعقَلْتُ البَعِيرَ بَثنايَيْن غَيْرَ مَهموزٍ لأَنَّه لا واحِدَ لَه إِذا عَقَلْتَ يَدَيْهِ جَمِيعًا بحَبْلٍ أو بطَرَفَيْ حَبْلٍ قالَ سِيبَوَيْهِ سأَلْتُ الخَلِيلَ عن الثِّنايَيْنِ فقالَ هو بمَنْزِلَةِ النِّهايَةِ لأنَّ الزِّيادَةَ في آخِرِه لا تُفارِقُه فأَشْبَهَت الهاءَ قالَ ومن ثَمَّ قالُوا مِذْرَوانِ فجاءُوا بهِ على الأَصْلِ لأنَّ الزِّيادَةَ لا تُفارِقُه قالَ سٍ يبَوَيْهِ وسأَلْتُ الخَلِيلَ رحمه الله عن قَوْلِهم عَقَلْتُه بِثنايَيْنِ وهِنايَيْنِ لِمَ لَمْ يَهْمِزُوا فقالَ تَركُوا ذلِكَ حيثُ لم يُفْرَد الواحِدُ وقالَ ابنُ جِنِّي لو كانَتْ ياءُ التثَّنِيَةِ إِعْرابًا أَو دَليلَ إِعرابٍ لوَجَبَ أَن تُقْلَبَ الياءُ التي بعدَ الأَلِفِ هَمْزَةً فيُقالُ عَقَلْتُه بِثناءَيْنِ وذلِكَ لأَنَّها ياءٌ وَقَعَتْ طَرَفًا بعدَ أَلِفٍ زائِدة فجَرَتْ مَجْرَى ياءِ رِداءٍ ورِماء وظِباء وعَقَلْتُه بِثنْيَيْنِ إِذا عَقَلْت يَدًا واحِدَةً بعُقْدَتَيْن والثَّنَى من الرِّجالِ بعدَ السَّيِّدِ وهو الثُّنْيانُ قالَ
                (تَرَى ثِنانًا إِذا ما جاءَ بَدْأَهُم ... وبَدْؤُهُمْ إِن أَتانَا كان ثُنْيانَا)
                ورَجُلٌ ثُنْيان لا رَأْىَ لَهُ ولا عَقْل ورأى ثُنْيانٌ غَيْرُ سَدِيدٍ ومَضَى ثِنْيٌ من اللَّيْلِ أَي وَقْتٌ عن اللِّحْيانِي والثَّنِيَّةُ من الأَضْراسِ أَوَّلُ ما في الفَمِ وللإنسان والخُفِّ والسَّبُعِ ثَنِيَّتانَ من فَوْقُ وثَنِيَّتانِ من أَسْفَلَ والثَّنِيُّ من الإِبِلِ الَّذِي يُلْقِي ثَنِيَّته وذلِكَ في السّادِسَةِ ومن الغَنَمِ الدّاخِلُ في السَّنَةِ الثانية تَيْسُا كانَ أو كَبْشُا وقِيلَ لابْنَةِ الخُسِّ هل يُلْقِحُ الثَّنِيُّ قالَتْ وإِلْقاحُه أَنِيُّ أَي بَطِيءٌ والأُنْثَى ثَنِيَّةٌ والجَمْعُ من ذلك كُلِّه ثِناءٌ وثُناءٌ وثُنْيانٌ وحكى سِيبَوَيْهِ ثُن قال ابنُ الأَعْرابِيِّ ليسَ قَبْلَ الثَّنِيِّ اسمٌ يُسَمَّى ولا بَعْدَ البازِلِ اسمٌ يُسَمَّى وأَثْنَى البَعِيرُ صارَ ثَنِيّا وقيلَ كُلُّ ما سَقَطَتْ ثَنِيَّتُه من غَيْرِ الإنسانِ ثَنِيٌّ والظَّبْيُ ثَنِيٌّ بعدَ الإجْذاع ولا يزالُ كذلِكَ حَتَّى يَمُوتَ والثَّنِيَّةُ الطَّريقَةُ في الجَبَلِ كالنَقْبِ وقِيلَ الطَّريقَةُ إلى الجَبَل وقِيلَ هي العَقَبَةُ وقِيلَ هي الجَبَلُ نَفْسُه والثَّناءُ ما تَصِفُ به الإنْسانَ من مَدْحٍ أو ذَمٍّ وخَصَّ بَعْضُهم به المَدْحَ وقد أَثْنَيْتَ عليه وقَوْلُ أَبِي المُثَلَّمِ الهُذَلِيِّ
                (يا صَخْرُ إِن كُنْتَ تُثْنِي أَنَّ سَيْفَكَ مَشْقُوقُ ... الخَشِيبَةِ لا نابٍ ولا عَصِلُ)
                مَعْناهُ تَمْتَدِحُ وتَفْتِخِرُ فحَذَف وأَوْصَلَ وثِناءُ الدّارِ فِناؤُها قالَ ابنُ جِنِّي ثِناءُ الدارِ وفِناؤُها أَصْلانِ لأنَّ الثِّناءَ من ثَنَى يَثْنِي لأنَّ هُناكَ تَنْثَنِي عن الانْبِساطِ لمجيءِ آخِرِها واسْتِقْصاءٍ حُدُودِها وفِناؤُها من فَنِيَ يَفْنَى لأنَّكَ إِذا تَناهَيْتَ إِلى أَقْصَى حُدُودِها فَنِيَتْ فإِن قُلْتَ هَلاَّ جَعَلْتَ إِجْماعَهُم على أَفْنِيَةٍ بالفاءِ دَلالةً علَى أَنَّ الثاءَ في ثِناءٍ بَدَلٌ من فاءِ فِناء كما زَعَمْتَ أَنَّ فاءَ جَدَفٍ بدلٌ من ثاءِ جَدَثٍ لإجْماعِهم عَلَى أَجْداثٍ فالفَرْقُ بَيْنَهُما وجُودُنا لِثناءٍ من الاشْتِقاقِ ما وَجَدناهُ لِفناءٍ أَلا تَرَى أَنَّ الفِعْلَ يَتَصَرَّفُ منهما جَمِيعًا ولَسْنا نَعْلَمُ لجَدَفٍ بالفاءِ تَصَرُّفَ جَدَثٍ فلذلِك قَضَيْنا بأَنَّ الفاءَ بدَلٌ من الثّاءِ وجَعَلَهُ أَبو عُبَيدَةَ في المُبْدَلِ واسْتَثْنَيْتُ الشيءَ من الشَّيءِ حاشَيْتُه والثَّنِيَّةُ النَّخْلَةُ المُسْتَثْناةُ من المُساوَمَةِ وحِلْفَةٌ غَيْرُ ذاتِ مَثْنَوِيَّةٍ أَي غَيْرُ مُحَلَّلَةٍ والثُّنْيا والثُّنْوَى ما اسْتَثْنَيْتَه قُلِبَتْ ياؤُه واوًا للتَّصْرِيف وتَعْوِيضِ الواوِ من كَثْرَةِ دُخُولِ الياءِ عليها وللفَرْقِ أَيضًا بين الاسْمِ والصِّفَةِ وقولُه أَنْشَدَه ثَعْلَبٌ
                (مُذَكَّرَة الثُّنْيا مُسانَدَة القَرَى ... جُمالِيَّة تَخْتَبُّ ثُمّ تُنِيبُ)
                فَسَّرَه فقالَ مُذَكَّرَةُ الثُّنْيَا يَعْنِي أن رَأْسَها وقوائمَها تُشْبِهُ خَلْق الذِّكارَةِ لم يَزِدْ عَلَى هذا شَيْئًا والثَّنِيَّةُ كالثُّنْيَا وفي حَدِيثِ كَعْبٍ الشُّهَداءُ ثَنِيَّةُ اللهِ في الأَرْضِ إِذا نُفِخَ في الصُّورِ فصَعِقَ الناسُ لم يَصْعَقُوا فكأَنَّهم مُسْتَثْنَوْنَ من الصَّعْقَيْن التَّفْسِيرُ للهَرَوِيِّ في الغَرِيبَيْن ومَضَى ثِنْيٌ من اللَّيْلِ أَي ساعَةٌ حُكِيَ ذَلك عن ثَعْلبٍ
