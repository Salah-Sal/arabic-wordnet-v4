            definitions_text: '(ثنى) - في الحديث: "مَنْ يَصْعَد  ثَنِيَّةَ المُرارِ، حُطَّ عنه ما حُطَّ عن بَنِي إسْرائِيل".يعنى
              حين ائْتَمروا قَولَه: {ادْخُلُوا الْبَابَ سُجَّدًا} .قال الأَصْمَعِيُّ: الثَّنِيَّة في الجَبَل: عُلُوٌّ فيه،
              والجَمعُ الثَّنَايَا، وقال غَيرُه: هي أَعلَى المَسِيل في رَأْس الجَبَل، والثَّنِيَّة: العَقَبَة، والجَبَلُ،
              والطرَّيقُ في الجَبَل عُلُوٌّ فيه، والجَمْع الثَّنايَا. وقال غَيرُه: والمرتَفِعُ من الأَرضِوثَنِيَّة مُرار،
              بضَمِّ المِيم، ما بين مَكَّة والمَدِينَة من طَرِيق الحُدَيْبِيَة، وإنَّما قال ذلك، لأنها عَقَبةٌ شاقَّة وصلوا
              إليها لَيلًا حين أرادوا مكة سنة الحُدَيْبِيَة فرغَّبهم في صُعودِها، والله عز وجل أعلم.- في حَدِيثِ الحَجَّاج
              أنَّه قَالَ:  "طَلَّاع الثَّنَايَا".: أي هو جَلْدٌ يَطلُع الثَّنَايَا في ارْتفاعِها وصُعوبَتِها، ومَعْناه: أَنَّه
              يرتَكِبُ الأُمورَ العِظامَ. - في حديث الأَضْحِيَة: "أنَّه أَمَر بالجَذَعة من الضَّأْنِ والثَّنِيَّةِ مِنَ المَعِز".الثَّنِيَّة
              من الغَنَم: ما لها سَنَتَان ودَخَلَت في الثَّالِثَة وقيل: ما لَهَا سَنَة تَامَّةٌ ودَخَلَت في الثَّانِية والذَّكَر
              ثَنِيٌّ. والثَّنِيُّ من البَقَر: ما تَمَّ له ثَلاثُ سِنِين ودَخَل في الرَّابِعَة.وقِيل على مَذْهَب الِإمام أَحْمد:
              ما تَمَّ له سَنَة من المَعِز، ودخل في الثَّانِيَة، ومن البَقَر: ما تَمَّ له سَنَتَان ودَخَل في الثَّالِثَة،
              وأَمَّا من الِإبِل فما تَمَّ له خَمسُ سِنين ودخل في السَّادِسَة.وقيل: بل لا يَكُون مِنَ الإِبِل ثَنِيًّا حتَّى
              يُلقِي ثَنِيَّتَيه الرَّاضِعَتَين، وهما المُقدَّمتان ونَبتَت أُخْريَان وذلك في الثَّالِثَة.قلت: ويَجوزُ أن يَكُونَ
              اختِلافُهم هذا، إنما حَصَل من حَيث الوُجوُد، لأنه إذا كان إنَّما يُسَمَّى ثَنِيًّا بإسقاط ثَنِيَّتَيه، فقد يَختَلِف
              ذلك، عَسَى في الِإبِل والبَقَر والغَنَم وغَيرِها كالآدمِي. وقد يَختَلِف سُقوطُ السِّنَّيْنِ  ونَباتُهما في أَخَوَيْن
              فكيف في أَجْنَبِيَّين، والله تعالى أعلم والفِعلُ من ذلك أَثنَى يُثنِي إذا نَبَتَت له ثَنِيَّة، والجَذَع من الضَّأن
              ينَزُو فَيُلقِح، فلِهذا أُجِيز في الأُضْحِيَّة، ومن المِعْزَى لا يُلقِح حتَّى يَصِيَر ثَنِيًّا. ويقال له عن
              ذلك مُسِنٌّ ومُسِنَّة. وقيل: الجَذَع من الضَّأن يَجْذَع لثَمانِيَة أَشْهُر. - قَولُه تَبارَك وتَعالَى: {مَثْنَى
              وَثُلَاثَ وَرُبَاعَ} .: أي ثِنْتَينْ ثِنْتَيْن، وثَلاثًا ثلاثًا، وأَربعًا أربعًا، ولَفظُ هَذَا القَبِيل في المُذَكَّر
              والمُؤَنَّت سَواءٌ.- في الحَدِيثِ: "من أَعْتَقَ أو طَلَّقَ ثم استَثْنَى فله ثُنْيَاه".: أي مَنْ شَرَطَ في ذَلِك
              شَرطًا أو عَلَّقَه على شَيْءٍ فله ما شَرَط، أو استَثْنَى منه شَيئًا فلَه ذَلِك، مثل أن يَقولَ: طَلَّقْتُها ثَلاثًا
              إلَّا واحِدةً، أو طَلَّقْتُهن إلَّا فُلَانَةَ، أو أَعتَقْتُهم إلَّا فُلانًا، والله تَعالَى أَعلَم.وقيل: الاسِتثْناء
              مُشتَقٌّ من الاثْنَيْن، لأَنه إذا تكلَّم بشيء فقد أَفادَ به فائِدةً، فإذا استَثْنى منه أَفادَ فائدةً ثانِيةً.-
              في الحَدِيث: "مَنْ قَالَ كَذَا عَقِيبَ الصَّلاةِ وهُو ثَانٍ رِجْلَه".: أَيْ كَما هُوَ قَاعِد في التَّشَهُّد
              لأَن السُّنَّة في التَّشَهُّدِ أن يُثنِي رِجلَه اليُمْنى.- وفي حَدِيث آخَرَ: "مَنْ قَالَ عَقِيبَ الصَّلاةِ كَذَا
              قبل أن يَثْنِي رِجلَه".وهَذا  ضِدُّ الأَوَّل في الَّلفْظِ، وفي المَعْنَى مُوافِقٌ له، لأَنَّ مَعْنَاه قَالَه
              قبل أن يَصرِفَ رِجلَه عن حالتِها التي هي عليها في التَّشَهُّد، فتَوافَق مَعنَى الحَدِيثَين. - في حَدِيثِ أَبِي
              هُرَيْرة: "كان يَثْنِيه عليه أَثناءً من سَعَته".الأَثْناء: جمع ثِنْى وهو ما ثُنِي.وفي حَدِيث الصَّلاةِ: "صَلاةُ
              اللَّيلِ مَثْنَى مَثْنَى".: أي رَكْعَتان رَكْعَتان، بتَشَهُّد وتَسْلِيم، فهي ثُنائِيَّة لا رُبَاعِيّة. ومَثْنَى
              مَعْدُول عن اثْنَيْن اثْنَيْن.- ومنه حَدِيثُ الحُدَيْبِيَة: "دعوهم يَكُنْ  لهم بَدْءُ الفُجور وثِنَاه".: أي
              أَولُه وآخِرُه.'
