              text: فإن عُد من مَجد قديم لمعشر / فقومى بهم تُثنى هناك الأصابع
              attribution: null
            - idx: 3
              type: usage
              text: 'فلان لا تُثنى به الخناصر: لا يؤبه به'
              attribution: null
            - idx: 4
              type: quran
              text: ثانى عطفه ليضل عن سبيل الله
              attribution: 'سورة الحج : ٩'
            - idx: 5
              type: usage
              text: 'فلان لا يثنى ولا يثلث, أى: هو كبير لا يقدر أن ينهض لا فى مرة, ولا فى مرتين'
              attribution: null
            - idx: 6
              type: hadith
              text: رأيت ابن عمر ينحر بدنته وهى باركة مثنية بثنايين
              attribution: عمرو بن دينار
            - idx: 7
              type: usage
              text: 'جاء ثانياً من عنانه, أى: ظافراً ببغيته'
              attribution: null
            - idx: 8
              type: quran
              text: ألا إنهم يثنون صدورهم ليستخفوا منه
              attribution: 'سورة هود : ٥'
