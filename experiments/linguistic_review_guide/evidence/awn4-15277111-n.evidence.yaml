            definitions_text: |-
              (ث ن ي) : (الثَّنْيُ) ضَمُّ وَاحِدٍ إلَى وَاحِدٍ وَكَذَا التَّثْنِيَةُ وَيُقَالُ هُوَ ثَانِي وَاحِدٍ وَثَانٍ وَاحِدًا أَيْ مُصَيِّرُهُ بِنَفْسِهِ اثْنَيْنِ وَثَنَّيْتُ الْأَرْضَ ثَنْيًا كَرَيْتُهَا مَرَّتَيْنِ وَثَلَّثْتُهَا كَرَيْتُهَا ثَلَاثًا فَهِيَ مَثْنِيَّةٌ وَمَثْلُوثَةٌ وَقَدْ جَاءَ فِي كَلَامِ مُحَمَّدٍ - رَحِمَهُ اللَّهُ - التَّثْنِيَةُ وَالثُّنْيَا بِمَعْنَى الثَّنْيِ كَثِيرًا وَمَنْ فَسَّرَ الثَّنِيَّةَ بِالْكِرَابِ بَعْدَ الْحَصَادِ أَوْ بِرَدِّ الْأَرْضِ إلَى صَاحِبِهَا مَكْرُوبَةً فَقَدْ سَهَا (وَمَثْنَى) مَعْدُولٌ عَنْ اثْنَيْنِ اثْنَيْنِ وَمَعْنَاهُ مَعْنَى هَذَا الْمُكَرَّرِ فَلَا يَجُوزُ تَكْرِيرُهُ وَقَوْلُهُ الْإِقَامَةُ مَثْنَى مَثْنَى تَكْرِيرٌ لِلَّفْظِ لَا لِلْمَعْنَى (وَقَوْلُهُمْ الْمَثْنَى) أَحْوَطُ أَيْ الِاثْنَانِ خَطَأٌ وَتَقْرِيرُهُ فِي الْمُعْرِبِ (وَالْمَثَانِي) عَنْ أَبِي عُبَيْدٍ يَقَعُ عَلَى أَشْيَاءَ ثَلَاثَةٍ عَلَى الْقُرْآنِ كُلِّهِ فِي قَوْله تَعَالَى {كِتَابًا مُتَشَابِهًا مَثَانِيَ} [الزمر: 23] وَعَلَى الْفَاتِحَةِ فِي قَوْلِهِ عَزَّ وَجَلَّ وَعَلَا {وَلَقَدْ آتَيْنَاكَ سَبْعًا مِنَ الْمَثَانِي} [الحجر: 87] وَعَلَى سُوَرٍ مِنْ الْقُرْآنِ دُونَ الْمِئِينَ وَفَوْقَ الْمُفَصَّلِ وَهِيَ جَمْعُ مَثْنَى أَوْ مَثْنَاةٍ مِنْ التَّثْنِيَةِ بِمَعْنَى التَّكْرَارِ أَمَّا الْقُرْآنُ فَلِأَنَّهُ يُكَرَّرُ فِيهِ الْقَصَصُ وَالْأَنْبَاءُ وَالْوَعْدُ وَالْوَعِيدُ وَقِيلَ لِأَنَّهُ يُثَنَّى فِي التِّلَاوَةِ فَلَا يُمَلُّ وَأَمَّا الْفَاتِحَةُ فَلِأَنَّهَا تُثَنَّى فِي كُلِّ صَلَاةٍ وَقِيلَ لِمَا فِيهَا مِنْ الثَّنَاءِ عَلَى اللَّهِ سُبْحَانَهُ وَأَمَّا السُّوَرُ فَلِأَنَّ الْمِئِينَ مَبَادِئُ وَهَذِهِ مَثَانِي وَمِنْ هَذَا الْأَصْلِ الثَّنِيَّةُ لِوَاحِدَةِ الثَّنَايَا وَهِيَ الْأَسْنَانُ الْمُتَقَدِّمَةُ اثْنَتَانِ فَوْقُ وَاِثْنَتَانِ أَسْفَلُ لِأَنَّ كُلًّا مِنْهُمَا مَضْمُومَةٌ إلَى صَاحِبَتِهَا (وَمِنْهَا) الثَّنِيُّ مِنْ الْإِبِلِ الَّذِي أَثْنَى أَيْ أَلْقَى ثَنِيَّتَهُ وَهُوَ مَا اسْتَكْمَلَ السَّنَةَ الْخَامِسَةَ وَدَخَلَ فِي السَّادِسَةِ وَمِنْ الظِّلْفِ مَا اسْتَكْمَلَ الثَّانِيَةَ وَدَخَلَ فِي الثَّالِثَةِ وَمِنْ الْحَافِرِ مَا اسْتَكْمَلَ الثَّالِثَةَ وَدَخَلَ فِي الرَّابِعَةِ وَهُوَ فِي كُلِّهَا بَعْدَ الْجَذَعِ وَقَبْلَ الرُّبَاعِيّ وَالْجَمْع ثُنْيَانٌ وَثِنَاءٌ وَأَمَّا (الثَّنِيَّةُ) لِلْعَقَبَةِ فَلِأَنَّهَا تَتَقَدَّمُ الطَّرِيقَ وَتَعْرِضُ لَهُ أَوْ لِأَنَّهَا تَثْنِي سَالِكَهَا وَتَصْرِفُهُ وَهِيَ الْمُرَادَةُ فِي حَدِيثِ أُمِّ هَانِئٍ بِأَسْفَلِ الثَّنِيَّةِ وَالْبَاءُ تَصْحِيفٌ وَفِي أَدَبِ الْقَاضِي فَأَمَرَ - عَلَيْهِ السَّلَامُ - مُنَادِيًا فَنَادَى حَتَّى بَلَغَ الثَّنِيَّةَ قِيلَ هِيَ اسْمُ مَوْضِعٍ بَعِيدٍ مِنْ الْمَدِينَةِ وَكَانَتْ ثَمَّةَ عَقَبَةٌ وَقَوْلُهُ
              أَنَا ابْنُ جَلَا وَطَلَّاعُ الثَّنَايَا ... مَتَى أَضَعْ الْعِمَامَةَ تَعْرِفُونِي
              مَعْنَاهُ رَكَّابٌ لِمَعَالِي الْأُمُورِ وَمَشَاقِّهَا كَقَوْلِهِمْ طَلَّاعُ الْجِدِّ وَيُقَال ثَنَى الْعُودَ إذَا حَنَاهُ وَعَطَفَهُ لِأَنَّهُ ضَمَّ أَحَدَ طَرَفَيْهِ إلَى الْآخَرِ ثُمَّ قِيلَ ثَنَاهُ عَنْ وَجْهِهِ إذَا كَفَّهُ وَصَرَفَهُ لِأَنَّهُ مُسَبَّبٌ عَنْهُ (وَمِنْهُ) اسْتَثْنَيْتُ الشَّيْءَ زَوَيْتُهُ لِنَفْسِي وَالِاسْمُ الثُّنْيَا بِوَزْنِ الدُّنْيَا (وَمِنْهُ) قَوْلُهُ - عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ - «مَنْ اسْتَثْنَى فَلَهُ ثُنْيَاهُ» أَيْ مَا اسْتَثْنَاهُ وَالِاسْتِثْنَاءُ (فِي) اصْطِلَاحِ النَّحْوِيِّينَ إخْرَاجُ الشَّيْءِ مِمَّا أُدْخِلَ فِيهِ غَيْرُهُ لِأَنَّ فِيهِ كَفًّا وَرَدًّا عَنْ الدُّخُولِ وَالِاسْتِثْنَاءُ فِي الْيَمِينِ أَنْ يَقُولَ الْحَالِفُ إنْ شَاءَ اللَّهُ لِأَنَّ فِيهِ رَدَّ مَا قَالَهُ لِمَشِيئَةِ اللَّهِ وَقَوْلُهُ - عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ - (لَا ثِنَى) فِي الصَّدَقَةِ مَكْسُورٌ مَقْصُورٌ أَيْ لَا تُؤْخَذُ فِي السَّنَةِ مَرَّتَيْنِ وَعَنْ أَبِي سَعِيدٍ الضَّرِيرِ مَعْنَاهُ لَا رُجُوعَ فِيهَا وَلَا اسْتِرْدَادَ لَهَا وَأَنْكَرَ الْأَوَّلَ.
