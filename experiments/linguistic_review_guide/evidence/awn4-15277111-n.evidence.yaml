            definitions_text: 'ثني: (ي (} ثَنَى الشَّيْءَ، كسَعَى) {ثَنْياً: (رَدَّ بَعْضَهُ على بَعْضٍ) .قالَ شيْخُنَا: قَوْله،
              كسَعَى وهمٌ لَا يُعْرَفُ مَنْ يقولُ بِهِ، إِذْ لَا مُوجِب لفتْحِ المُضارعِ لأنَّه لَا حَرْف حلق فِيهِ، فالصَّوابُ
              كرَمَى، وَهُوَ المُوافِقُ لمَا فِي كُتُبِ اللُّغَة وأُصولها انْتهى.قُلْتُ: ولعلَّه سَبقُ قَلَمِ مِن النّسّاخِ.(}
              فَتَثَنَّى {وانْثَنَى.(} واثْنَوْنَى) ، على افْعَوْعَل: أَي (انْعَطَفَ) ؛ وَمِنْه قِراءَةُ مَنْ قَرَأَ: {أَلا
              إنَّهم {تَثْنَوْن صُدُورهم} ، رُوِي ذلِكَ عَن ابنِ عباسٍ؛ أَي تَنْحَنِي وتَنْطَوي.ويقالُ:} اثْنَوْنَى صَدْره
              على البَغْضاءِ.( {وأَثْناءُ الشَّيْءِ} ومَثانِيهِ: قُواهُ وطاقاتُهُ، واحِدُها ثِنْيٌ، بالكسْرِ، {ومَثْناةٌ)
              ، بالفَتْحِ (ويُكْسَرُ) ؛ عَن ثَعْلَب، وَفِيه لَفٌّ ونَشْرٌ مُرتَّبٌ.(} وثِنْيُ الحَيَّةِ، بالكَسْرِ: {انْثنَاؤُها
              أَو مَا تَعَوَّجَ مِنْهَا إِذا} تَثَنَّتْ) ؛ واسْتَعارَه غَيْلان الرَّبعِي للّيلِ، فقالَ:حَتَّى إِذا انْشَقَّ
              بَهِيم الظَّلْماءْوساقَ لَيْلاً مُرْحَجِنَّ {الأَثْناءْ وقيلَ:} أَثْناءُ الحَيَّةِ مَطاوِيها إِذا تَحَوَّتْ.(و)
              {الثِّنْيُ (من الوادِي مُنْعَطَفُهُ) ؛ ومِن الوادِي الجَبَلِ: مُنْقَطَعُهُ، (ج أَثْناءٌ) ومَثانِي.(وشاةٌ} ثانِيَةٌ:
              بَيِّنَةُ {الثِّنْيِ، بالكسْرِ) ، إِذا كَانَت (} تَثْنِي عُنُقَها لغَيْرِ عِلَّةٍ.( {والأَثْنانِ) ، بالكسْرِ:
              (ضِعْفُ الواحِدِ) ؛ وأَمَّا قَوْلُه تَعَالَى: {لَا تَتَّخِذُوا إلهَيْن} اثْنَيْن} ، فذَكَّر {الاثْنَيْن هُنَا
              للتَّأْكِيدِ كقَوْلِه: {ومَنَاة الثالِثَة الأُخْرى} ؛ (والمُؤَنَّثُ) } اثْنَتانِ، وَإِن شِئْتَ قُلْتَ: ( {ثِنتانِ)
              ولأنَّ الألِفَ إنَّما اجْتُلِبَتْ لسكونِ التاءِ فلمَّا تَحَرَّكتْ سَقَطَتْ، (و) تاؤُهُ مُبْدلَةٌ من ياءٍ، ويدلُّ
              على أنَّه مِن الياءِ أنَّه مِن} ثَنَيْتُ، لأنَّ الاثْنَيْن قد ثُنِي أَحَدُهما إِلَى صاحِبِه، (أَصْلُهُ ثِنْيٌ
              لجَمْعِهِم إيَّاهُ على أَثْناءٍ) بمنْزِلَة أَبْناءٍ وآخَاءٍ، فنَقَلُوه مِن فَعَلٍ إِلَى فِعْلٍ كَمَا فَعَلوا
              ذلِكَ فِي بنت، وليسَ فِي الكَلامِ تَاء مُبْدلَة مِن الياءِ فِي غيرِ افْتَعل إلاَّ مَا حَكَاهُ سِيْبَوَيْهِ مِن
              قوْلِهم اسْتِوَاء؛ وَمَا حَكَاه أَبو عليَ مِن قوْلِهم {ثِنْيانِ.قالَ الجَوهرِيُّ: وأَمَّا قَوْلُ الشاعِرِ:كأَنَّ
              خُصِيَيْه مِنَ التَّدَلْدُلِظَرْفُ عجوزٍ فِيهِ} ثِنْتا حَنْظَلِ فأَرادَ أَنْ يقولَ: فِيهِ حَنْظَلتانِ، فَلم
              يُمْكنه فأَخْرَجَ الاثْنَتيْن مَخْرجَ سائِرِ الأعْدادِ للضَّرُورَةِ، وأضافَهُ إِلَى مَا بَعدَه، وأَرادَ {ثِنْتانِ
              مِن حَنْظَل كَمَا يُقالُ ثلاثةُ دَرَاهِم وأَرْبَعَةُ دَرَاهِم، وكانَ حَقّه فِي الأصْلِ أَنْ يقالَ} اثْنَا دَرَاهِم
              {واثْنَتَا نِسْوَةٍ إلاَّ أَنَّهم اقْتَصَرُوا بقوْلِهم درْهَمانِ وامْرَأَتانِ عَن إضَافَتِهما إِلَى مَا بَعْدَهما.وقالَ
              اللّيْثُ:} اثْنانِ اسْمَانِ لَا يُفْرَدانِ قَرِينانِ، لَا يُقالُ لأَحدِهما اثْنٌ كَمَا أنَّ الثلاثَةَ أَسْماءٌ
              مُقْترنَةً لَا تُفْرَق، ويقالُ فِي التأْنِيثِ {اثْنَتانِ، ورُبَّما قَالُوا ثِنْتان كَمَا قَالُوا هِيَ ابْنَةُ
              فلانٍ وَهِي بنْتُه، والألِفُ فِي الاثْنَيْن أَلِفُ وَصْلٍ أَيْضاً، فَإِذا كانتْ هَذِه الألِفُ مَقْطوعَةً فِي
              الشِّعْر فَهُوَ شاذُّ كَمَا قالَ قَيْسُ بنُ الخطيمِ:إِذا جاوَزَ الإِثْنَيْن سِرُّ فإنَّهبنثَ وتكْثيرِ الوُشاةِ
              قَمِين ُوفي الصِّحاحِ،} واثْنانِ من عَدَدِ المُذَكَّر،! واثْنَتانِ للمُؤْنَّثِ، وَفِي المُؤَنَّثِ لُغَةٌ أُخْرى
              ثِنْتانِ بحذْفِ الألِفِ، وَلَو جازَ أَن يُفْرَدَ لكانَ واحِدُه اثْنٌ مِثْل ابْنِ وابْنَةٍ وأَلِفُه أَلِفُ وَصْل،
              وَقد قَطَعَها الشاعِرُ على التَّوَهّمِ فقالَ:أَلا لَا أَرى {إثْنَيْنِ أَحْسنَ شِيمةًعلى حدثانِ الدهرِ منِّي
              ومنْ جُمْل (} وثَنَّاهُ {تَثْنِيَةً: جَعَلَهُ} اثْنَيْنِ.(و) يقالُ: هَذَا ثانِي هَذَا، أَي: الَّذِي شفعَهُ.وَلَا
              يقالُ: {ثَنَيْتُهُ إلاَّ أَنَّ أَبا زيْدٍ قالَ: (هَذَا واحِدٌ} فاثْنِه) أَي (كُنْ {ثانِيَهُ) .قالَ الرَّاغبُ:
              يقالُ} ثَنَيْت كَذَا {ثنياً كنتُ لَهُ} ثانِياً.(و) حَكَى ابنُ الأَعْرابيِّ: (هُوَ لَا {يَثْنِي وَلَا يَثْلِثُ
              أَي) هُوَ رجُلٌ (كَبيرٌ) ، فَإِذا أَرادَ النُّهوضَ (لَا يَقْدِرُ أَنْ يَنْهَضَ لَا فِي مَرَّةٍ وَلَا فِي مَرَّتَيْنِ
              وَلَا فِي الثَّالِثَةِ.(} وثَناءُ بنُ أَحمدَ: مُحدِّثٌ) عَن عبْدِ الرحمانِ بنِ الأَشْقَر، ماتَ سَنَة 605.وَمن
              يكنى أَبا {الثَّناءِ كَثِيرُونَ.(وجاؤوا} مَثْنَى) مَثْنَى ( {وثُناءَ، كغُرابٍ) ، وثُلاثَ غَيْر مَصْرُوفَات لمَا
              تقدَّمَ فِي ثَلَاث، وكَذِلكَ النِّسْوَة وسائِر الأنْواعِ: (أَي اثْنَيْنِ اثْنَيْنِ} وثِنْتَيْنِ {ثِنْتَيْنِ)
              . وَفِي الحدِيثِ: (صلاةُ الليلِ} مَثْنَى مَثْنَى) ، أَي ركْعَتانِ ركْعَتانِ. {ومَثْنَى مَعْدولٌ عَن اثْنَيْنِ.وَفِي
              حدِيثِ الإمارَةِ: (أَوَّلها مَلامَة} وثِناؤُها نَدامَة وثِلاثُها عَذَابٌ يومَ القِيامَةِ إلاَّ مَنْ عَدَلَ)
              .قالَ شَمِرٌ: {ثِناؤُها أَي} ثانِيها، وثِلاثُها أَي ثالِثُها؛ قالَ: وأمَّا ثُناءُ وثُلاثُ فمَصْرُوفانِ عَن اثْنَيْن
              اثْنَيْن وثَلاثَة ثَلاثَة، وكَذلِكَ رُباعُ ومَثْنَى؛ وأَنْشَدَ:وَلَقَد قَتَلْتُكُمُ {ثُناءَ ومَوْحَداًوتركتُ
              مُرَّةَ مثلَ أَمْسِ الدَّابِرِوقالَ آخَرُ:أُحاد ومَثْنَى أَضْعَفَتْها صَواهِلُه وقالَ الرَّاغبُ:} الثِّنْي {والاثْنانِ
              أَصْلٌ لمُتَصَرِّفات هَذِه الكَلِمَة وذلِكَ يقالُ باعْتِبارِ العَدَدِ أَو باعْتِبار التّكْرير المَوْجُودِ فِيهِ
              أَو باعْتِبارِهِما مَعًا.(والاثْنانِ} والثِّنَى، كإلَى) ، كَذَا فِي النسخِ وحَكَاهُ سِيْبَوَيْه عَن بعضِ العَرَبِ:
              (يَوْمٌ فِي الأُسْبُوعِ) ، لأَنَّ الأَوَّل عنْدَهُم يَوْم الأَحَدِ، (ج أَثْناءٌ.(و) حَكَى الْمُطَرز عَن ثَعْلَب:
              ( {أَثانِينُ) .وَفِي الصِّحاحِ: يَوْمُ الاثْنَيْن لَا} يُثَنَّى وَلَا يُجْمَع لأَنَّه {مثنَّىً، فَإِن أَحْبَبْت
              أَن تَجْمَعَه كأَنَّه صفَةٌ للواحِدِ، وَفِي نسخةٍ كأَنَّه لَفْظٌ مَبْنيٌّ للواحَدِ، قُلْتَ} أَثانِينُ.قالَ ابنُ
              بَرِّي: أَثانِينُ ليسَ بمَسْموعٍ وإنَّما هُوَ مِن قَوْلِ الفرَّاء وقِياسِه، قالَ: وَهُوَ بَعيدٌ فِي القِياسِ؛
              والمَسْموعُ فِي جَمْعِ الاثْنَيْنِ أَثْناء على مَا حَكَاهُ سِيْبَوَيْه.وحَكَى السِّيرافي وغيرُهُ عَن العَرَبِ
              أنَّه ليصومَ {الأَثْناء؛ قالَ: وأَمَّا قوْلُهم اليومُ} الاثْنانِ، فإنَّما هُوَ اسمُ اليَوْم، وإنَّما أَوْقَعَتْه
              العَرَبُ على قوْلِكَ اليومُ يَوْمانِ واليومُ خَمْسةَ عشرَ مِنَ الشَّهْرِ، وَلَا يُثَنَّى، وَالَّذين قَالُوا:
              {اثْنَينِ جاؤُوا بِهِ على} الاثْن، وَإِن لم يُتَكلَّم بِهِ، وَهُوَ بمنْزِلَةِ الثّلاثاء والأَرْبعاء يعنِي أَنَّه
              صارَ اسْماً غَالِبا.قالَ اللَّحْيانيُّ: (وجاءَ فِي الشِّعْرِ يَوْمُ اثْنَيْنِ، بِلا لامٍ) ، وأَنْشَدَ لأبي صَخْرٍ
              الهُذَليّ:أَرائحٌ أَنتَ يومَ اثنينِ أَمْ غادِيولمْ تُسَلِّمْ على رَيْحانَة الوادِي؟ قالَ: وكانَ أَبو زيادٍ يقولُ
              مَضَى الاثْنانِ بِمَا فِيهِ، فيوحِّدُ ويُذَكِّرُ، وَكَذَا يَفْعل فِي سائِرِ أيامِ الأُسْبوعِ كُلِّها، وَكَانَ
              يُؤنِّثُ الجُمْعَة، وَكَانَ أَبُو الجَرَّاح يقولُ: مَضَى السَّبْت بمَا فِيهِ، ومَضَى الأَحَد بِمَا فِيهِ، ومَضَى
              الاثْنانِ بِمَا فيهمَا، ومَضَى الثِّلاثاءِ بِمَا فيهنَّ ومَضَى الأَرْبعاء بِمَا فيهنَّ، ومَضَى الخَمِيسُ بِمَا
              فيهنَّ، ومَضَى الجُمُعَة بِمَا فِيهَا، وكانَ يخرجُها مُخْرِج العَدَدِ.قالَ ابنُ جنِّي: الَّلامُ فِي الاثْنَيْن
              غيرُ زائِدَةٍ وَإِن لم يَكُن الاثْنانِ صفَة.قالَ أَبُو العبَّاس: إنَّما أَجازُوا دُخُولَ اللامِ عَلَيْهِ لأنَّ
              فِيهِ تَقْدير الوَصْف، أَلا تَرَى أَنَّ مَعْناه اليَوْم الثَّاني؟ ( {والإِثْنَوِيُّ: من يَصُومُهُ دائِماً وحْدَهُ)
              ؛ وَمِنْه قَوْلُهم: لَا تكُ} إَثْنَويّاً؛ حَكَاهُ ثَعْلَب عَن ابنِ الأعْرابيِّ.( {والمَثانِي: القُرآنُ) كُلُّه
              لاقْترانِ آيَة الرَّحْمة بآيَةِ العَذَابِ؛ كَمَا فِي الصِّحاحِ.أَو لأَنَّ الأَنْباءَ والقِصَصَ ثُنِّيَتْ فِيهِ؛
              عَن أَبي عبيدٍ.أَو لما} يُثْنَى وتَجَدَّدَ حَالا فحالاً فَوائِده، كَمَا رُوِي فِي الخبرِ فِي صفَتِه: (لَا يَعْوَجّ
              فيُقَوَّم وَلَا يَزيغُ فيُسْتَعْتَب وَلَا تَنقَضِي عجائِبُه) .؛ قالَهُ الرَّاغبُ؛ قالَ: ويصحُّ أَنْ يكونَ ذلِكَ
              مِن الثَناءِ تَنْبيهاً على أنَّه أَبَداً يَظْهَر مِنْهُ مَا يَدْعو وعَلى الثَناءِ عَلَيْهِ وعَلى مَنْ يَتْلُوه
              ويُعَلِّمه ويَعْمَل بِهِ، وعَلى هَذَا الوَجْه قَوْله وَوَصْفُهُ بالكَرَم {إنَّه لقُرْآنٌ كريمٌ} ؛ وبالمجْدِ:
              {بل هُوَ قُرآنٌ مَجيدٌ} .قُلْتُ: والدَّلِيلُ على أَنَّ {المَثاني القُرْآن كُلّه قَوْله تَعَالَى: {اللَّهُ نَزَّلَ
              أَحْسَن الحدِيثِ كتابا مُتَشابهاً} - مَثاني تَقْشَعرّ مِنْهُ} ؛ وقَوْلُ حَسَّان بن ثابتٍ:مَنْ للقوافِي بعدَ
              حَسَّانَ وابْنِهِومَنْ {للمَثانِي بعدَ زَيْدِ بنِ ثابتِ؟ (أَو) المَثاني مِن القُرآنِ: (مَا} ثُنِيَّ مِنْهُ مَرَّةً
              بَعْدَ مَرَّةٍ) ؛ وَبِه فُسِّر قَوْلُه تَعَالَى: {وَلَقَد آتَيْناكَ سَبْعاً مِن المَثاني} .(أَو الحَمْدُ) ،
              وَهِي فاتِحَةُ الكِتابِ، وَهِي سَبْعُ آياتٍ قيلَ لَهَا مَثانِي لأنَّها يُثَنى بهَا فِي كُلِّ ركْعَةٍ مِن ركعاتِ
              الصَّلاةِ وتُعادُ فِي كلِّ ركْعةٍ.قالَ أَبو الهَيْثم: سُمِّيت آياتُ الحَمْد مَثاني، واحِدَتُها {مَثْناةٌ، وَهِي
              سَبْعُ آياتٍ.وقالَ ثَعْلب: لأنَّها} تُثَنى مَعَ كلِّ سُورَةٍ؛ قالَ الشاعِرُ:الحمدُ للَّهِ الَّذِي عافَانيوكلّ
              خيرٍ صالحٍ أَعْطاني رَبِّ! مَثاني الآيِ والقُرْآنِ ووَرَدَ فِي الحدِيثِ فِي ذِكْر الفاتِحَةِ، هِيَ السَّبْع
              المَثاني. (أَو) المَثاني سُوَرٌ أَوَّلها (البَقَرةُ إِلَى بَراءَة، أَو كُلُّ سُورَةٍ دُونَ الطُّوَلِ ودُونَ
              المَائَتَيْنِ) ، كَذَا فِي النسخِ والصَّوابُ دُوْنَ المِئِين؛ (وفَوْقَ المُفَصَّلِ) ؛ هَذَا قَوْلُ أَبي الهَيْثم.قالَ:
              رُوِي ذلِكَ عَن رَسُولِ اللَّهِ صلى الله عَلَيْهِ وَسلم ثمَّ عَن ابنِ مَسْعودٍ وعُثْمان وابنِ عبَّاس؛ قالَ:
              والمُفَصَّل يَلِي المَثانِي، {والمَثانِي مَا دُونَ المِئِين.وقالَ ابنُ بَرِّي عنْدَ قَوْل الجَوْهرِيّ والمَثانِي
              مِن القُرآنِ مَا كانَ أَقَلَّ مِن المِئِين، قالَ: كأَنَّ المِئِين جُعِلَت مبادِيَ وَالَّتِي تلِيها مَثانِي.(أَو)
              المَثانِي مِن القُرآنِ: سِتٌّ وعِشْرُونَ سُورَة، كَمَا رَوَاهُ محمدُ بنُ طَلْحَةَ بنِ مُصَرِّف عَن أَصْحابِ
              عبدِ اللَّهِ؛ قالَ الأَزْهرِيُّ: قَرَأْته بخطِّ شَمِرٍ؛ وَهِي: (سُورَةُ الحَجِّ، والنَّملِ، والقَصَصِ، والعَنْكَبُوتِ،
              والنُّورِ، والأَنْفالِ، ومَرْيَمَ، والرُّومِ، ويسلله، والفُرْقانِ، والحجْرِ، والرَّعْدِ، وسَبَأَ، والملائِكَةِ،
              وإبراهيمَ، وصلله، ومحمدٍ صلى الله عَلَيْهِ وَسلم ولُقْمانَ، والغُرَفِ، والزُّخْرُفِ، والمُؤْمِنِ، والسَّجْدَةِ،
              والأَحْقافِ، والجاثِيَةِ، والدُّخانِ، والأَحْزابِ) .قالَ الرَّاغبُ: سُمِّيت مَثانِي لأنَّها} تُثْنَى على مُرورِ
              الأَوْقاتِ وتُكَرّرُ فَلَا تُدرسُ وَلَا تَنْقَطِعُ دُرُوسَ سائِرِ الأَشْياءِ الَّتِي تَضْمَحِلُّ وتَبْطل على
              مُرورِ الأيامِ.وَقد سَقَطَ مِن نسخةِ التَّهْذِيبِ ذِكْرُ الأَحْزابِ وَهُوَ مِن النسَّاخِ، وَلذَا تَردَّدَ صاحِبُ
              اللّسانِ لمَّا نَقَلَ هَذِه العِبارَة فقالَ: يُحْتَمل أَنْ تكونَ السَّادِسَة والعِشْرين هِيَ الفاتِحَةِ وإنَّما
              أَسْقَطها لكَوْنِهِ اسْتَغْنَى عَن ذكْرِها بمَا قدَّمَه، وإمَّا أَنْ تكونَ غَيْر ذلِكَ. قُلْتُ: والصَّوابُ أَنَّها
              الأَحْزابُ كَمَا ذَكَرَه المصنِّفُ؛ والغُرَف المَذْكُورَة الظاهِرُ أنَّها الزّمر، وَمِنْهُم مَنْ جَعَل عِوَضها
              الشَّوْرى. وَقد مرَّ للمصنِّفِ كَلامٌ فِي السَّبْع الطّولِ فِي حَرْف اللامِ فرَاجِعْه.(و) المَثانِي. (من أَوْتارِ
              العُودِ: الَّذِي بعدَ الأولِ، واحِدُها مَثْنى) ؛ وَمِنْه قوْلُهم: رَناتُ المثالِثِ والمَثانِي.(و) المَثانِي
              (من الوادِي: مَعاطِفُهُ) ومَجانِيهِ، واحِدُها {ثِنْيٌ، بالكسْرُ، وَقد تقدَّمَ.(و) المَثانِي (من الدَّابَّةِ:
              رُكْبَتاها ومِرْفَقاها) ؛ قالَ امْرؤُ القَيْسِ:وتخْدِي على حُمرٍ صِلابٍ مَلاطِسٍشَديداتِ عَقْدٍ لَيِّناتِ مَثانِي
              (و) فِي الحدِيثِ: ((لَا} ثِنَى فِي الصَّدَقةِ) ، كإلَى) ، أَي بالكسْرِ مَقْصوراً، (أَي لَا تُؤْخَذُ مَرَّتَيْنِ
              فِي عامٍ) ؛ كَمَا فَسَّرَه الجَوْهرِيُّ.قالَ ابنُ الأَثيرِ: وقَوْله فِي الصَّدَقةِ أَي فِي أَخْذِ الصَّدقَةِ،
              فحذفَ المُضافَ، قالَ: ويَجوزُ أَنْ تكونَ الصَّدَقَةُ بمعْنَى التَّصْدِيقِ، وَهُوَ أَخْذ الصَّدَقَة كالزَّكاةِ
              والذَّكَاةُ بمعْنَى التَّزْكِيَة والتَّذْكِيَة، فَلَا يحتاجُ إِلَى حذْفِ مُضافٍ.وأَصْلُ! الثِّنَى: الأَمْرُ
              يُعادُ مَرَّتَيْن؛ كَمَا قالَهُ الجَوْهرِيُّ والرَّاغبُ. وأَنْشَدَا للشاعِرِ، وَهُوَ كَعْبُ بنُ زهيرٍ، وكانتِ
              امْرأَتُه لامَتْه فِي بكرٍ نَحَرَه:أَفِي جَنْبِ بَكْرٍ قَطَّعَتْني مَلامَةًلَعَمْرِي لَقَدْ كانَتْ مَلامَتُها
              ثِنَى أَي ليسَ بأوَّلِ لَوْمِها فقد فَعَلَتْه قبْلَ هَذَا، وَهَذَا ثِنىً بعْدَه.قالَ ابنُ بَرِّي: ومِثْله قَوْل
              عِديِّ بنِ زيْدٍ:أَعاذِلُ إنَّ اللَّوْمَ فِي غيرِ كُنْهِهعليَّ ثِنىً من غَيِّكِ المُتَرَدِّد (أَو) معْنَى الحدِيثِ:
              (لَا تُؤخَذُ ناقَتانِ مَكانَ واحِدَةٍ) ؛ نَقَلَهُ ابنُ الأثيرِ.(أَو) المعْنَى: (لَا رُجوعَ فِيهَا) ؛ قالَ أَبو
              سعيدٍ: لَسْنا نُنْكِر أنَّ الثِّنَى إعادَةُ الشَّيءِ بعد مَرَّةٍ، ولكنَّه ليسَ وجهَ الكَلامِ وَلَا مَعْنى الحدِيثِ،
              ومَعْناهُ أَنْ يَتَصَدَّقَ الرَّجُلُ على الآخِرِ بِصَدَقَةٍ ثمَّ يَبْدو لَهُ فيُريدُ أَنْ يَسْتردَّهُ، فيُقالُ
              لَا ثِنَى فِي الصَّدَقَةِ أَي لَا رُجوعَ فِيهَا، فيقولُ المُتَصَدِّقُ بِهِ عَلَيْهِ ليسَ لكَ عليَّ عُصْرَةُ
              الوالِدِ، أَي ليسَ لَك رُجوع كرُجوعِ الوالِدِ فيمَا يُعْطِي ولدَهُ.(وَإِذا وَلَدَتْ ناقةٌ مَرَّةً {ثانِيةً فَهِيَ}
              ثِنيٌ) ، بالكسْرِ، (ووَلَدُها ذَلِك {ثِنْيُها) .وَفِي الصِّحاحِ:} الثِّنْيُ من النُّوقِ الَّتِي وَضَعَتْ بَطْنَيْن،
              {وثِنْيُها وَلَدُها، وكَذِلكَ المَرْأَةُ، وَلَا يقالُ ثِلثٌ وَلَا فَوْق ذلِكَ، انتَهَى.وقالَ أَبو رِياش: وَلَا
              يقالُ بعْدَ هَذَا شيءٌ مُشْتقّاً وَفِي التَّهذِيبِ: ناقَةٌ ثِنيٌ وَلَدَتْ بَطْنَيْن؛ وقيلَ: إِذا وَلَدَتْ بَطْناً
              واحِداً، والأَوَّل أَقْيَس.وقالَ غيرُهُ: وَلَدَتْ اثْنَيْن.قالَ الأزْهرِيُّ: وَالَّذِي سَمِعْته مِن العَرَبِ
              يقُولونَ للناقَةِ إِذا وَلَدَتْ أَوَّل وَلدٍ تَلِدُه فَهِيَ بكرٌ، ووَلَدُها أَيْضاً بِكْرُها، فَإِذا وَلَدَت
              الوَلَدَ} الثَّانِي فَهِيَ ثِنْيٌ، ووَلَدُها الثَّانِي ثنْيُها. قالَ: وَهَذَا هُوَ الصَّحيحُ؛ قالَ: واسْتَعارَه
              لبيدٌ للمَرْأَةِ فقالَ: لياليَ تحتَ الخِدْرِ ثِنْي مُصِيفَةمن الأُدْم تَرْدادُ الشُّرُوحَ القَوائِلا ( {ومَثْنَى
              الأَيادِي:: إعادَةُ المَعْروفِ مَرَّتَيْنِ فأَكْثَرَ.(و) قالَ أَبو عبيدَةَ: مَثْنَى الأيادِي هِيَ: (الأنْصِباءُ
              الفاضِلَةُ من جَزُورِ المَيْسِرِ، كانَ الَّرجلُ الجَوادُ يَشْتَرِيها ويُطْعِمُها الأَبْرامَ) ، وهُم الَّذين
              لَا يَيْسِرُونَ.وقالَ أَبو عَمْرو: مَثْنَى الأيادِي أَن يَأْخُذَ القِسْمَ مَرَّةً بعدَ مَرَّةٍ؛ قالَ النابِغَةُ:إِنِّي
              أُتَمِّمُ أَيْسارِي وأَمْنَحُهُمْمَثْنَى الأيادِي وأَكْسُو الجَفْنَة الأُدُما (} والمَثْناةُ: حَبْلٌ من صُوفٍ
              أَو شَعَرٍ أَو غيرِهِ) ؛ وقيلَ: هُوَ الحَبْلُ مِن أَيِّ شيءٍ كانَ، وَإِلَيْهِ أَشارَ بقَولِه: أَو غيرِهِ؛ (ويُكْسَرُ)
              ، الفتْحُ عَن ابنِ الأعْرابيّ.( {كالثِّنايَةِ} والثِّناءِ، بكَسْرِهما) ؛ وأَنْشَدَ الجَوْهرِيُّ للراجِزِ:أَنا
              سجيح ومَعِي مِدْرايَهْأَعْدَدْتُها لفَتْكِ ذِي الدوايَهْ والحَجَرَ الأَخْشَنَ {والثِّنايَهْ وقيلَ:} الثِّنايَةُ
              الحَبْلُ الطَّويلُ؛ وَمِنْه قَوْلُ زهيرٍ يَصِفُ السَّانيةَ وشدَّ قِتْبها عَلَيْهَا:تَمْطُو الرِّشاءَ وتَجْرِي
              فِي {ثِنايَتِهامن المَحالَةِ قبا زائِداً قَلِقَاً} فالثِّنايَةُ هُنَا: حَبْلٌ يُشَدُّ طَرَفاه فِي قِتْبِ السَّانيةِ،
              ويُشَدُّ طَرَفُ الرِّشاءِ فِي {مَثْناتِه؛ وأَمَّا} الثِّناءُ بالكسْرِ فسَيَأْتي قرِيباً.(و) فِي حدِيثِ عبْدِ
              اللَّهِ بنِ عَمْرو: (مِن أَشْراطِ الساعَةِ أَنْ توضَعَ الأَخْيارُ وتُرْفَعَ الأَشْرارُ وأَنْ يُقْرَأَ فيهم {بالمَثناةِ
              على رُؤُوسِ الناسِ ليسَ أَحَدٌ يُغَيِّرُها) ، قيلَ: وَمَا} المَثْناةُ؟ قالَ: (مَا اسْتُكْتِبَ من غيرِ كتابِ
              اللَّهِ) ، كأنَّه جعلَ مَا اسْتُكْتِبَ مِن كتابِ اللَّهِ مَبْدَأً وَهَذَا مَثْنىً.(أَو) المَثْناةُ: (كتابٌ)
              وَضَعَه الأَحْبارُ والرُّهْبان فيمَا بَيْنهم، (فِيهِ أَخْبارُ بَني إسْرائيلَ بعدَ مُوسى أَحَلُّوا فِيهِ وحَرَّمُوا
              مَا شاؤُوا) على خِلافِ الكِتابِ؛ نَقَلَهُ أَبو عبيدٍ عَن رجُلٍ مِن أَهْلِ العِلْم بالكُتُبِ الأُوَلِ قد عَرَفَها
              وقَرَأَها، قالَ: وإنَّما كَرِهَ عبدُ اللَّهِ الأَخْذَ عَن أَهْلِ الكِتابِ، وَقد كانتْ عنْدَه كُتُبٌ وَقَعَتْ
              إِلَيْهِ يَوْمَ اليَرْمُوكِ مِنْهُم، فأَظنه قالَ هَذَا لمعْرِفَتِه بمَا فِيهَا، وَلم يُرِدِ النَّهْيَ عَن حدِيثِ
              رَسُولَ اللَّهِ صلى الله عَلَيْهِ وَسلم وسُنَّتِه وكيفَ يَنْهَى عَن ذلِكَ وَهُوَ مِن أَكْثَرِ الصَّحابَةِ حدِيثاً
              عَنهُ؟(أَو هِيَ الغِناءُ، أَو الَّتِي تُسَمَّى بالفارِسِيَّةِ دُو بَيْتِي) ؛ ونَصُّ الصِّحاحِ: يقالُ هِيَ الَّتِي
              تُسَمَّى بالفارِسِيَّة دُو بَيْتِي وَهُوَ الغِناءُ، انتَهَى.وقوْلُه: دُو بَيتِي دُو بالفارِسِيَّة تَرْجَمة الاثْنَيْن،
              وَالْيَاء فِي بيتِي للوحدَةِ أَو للنِّسْبةِ، وَهُوَ الَّذِي يُعْرَفُ فِي الْعَجم! بالمثنوي كأنَّه نِسْبَةٌ إِلَى
              المَثْناةِ هَذِه، والعامَّةُ تقولُ ذُو بَيت بالذالِ المعْجمةِ.ويَدْخُل فِي هَذَا النَّهْي مَا أَحْدَثه المُولّدُون
              مِن أَنْواعِ الشِّعْر كالمواليا وَكَانَ الموشَّح والمُسَمَّط، فيُنْشدُونَها فِي المجالِسِ ويَتَمَشْدَقون بهَا
              كأَنَّ فِي ذلِكَ هجراً عَن مُذاكَرَةِ القُرآنِ ومُدارَسَةِ العِلْم وتَطاولاً فيمَا لَا يَنْبغي وَلَا يُفيدُ،
              فتأَمَّل ذلِكَ، ونَسْأَلُ اللَّهَ العَفْو من الآفاتِ.( {والثُّنْيانُ، بالضَّمِّ: الَّذِي بعدَ السَّيلِ) ؛ كَذَا
              فِي النَّسخِ والصَّوابُ: بعدَ السَّيِّدِ؛ قالَ أَوْسُ بنُ مَغْراء:} ثُنْيانُنا إِن أَتاهُم كَانَ بَدْأَهُمُوبَدْؤُهُمْ
              إِن أَتَانا كانَ {ثُنْيانا هَكَذَا رَواهُ اليَزِيديُّ. (} كالثِّنْيِ، بالكسْرِ، وكهُدىً وإلَى) ، بالضَّمِّ والكسْرِ
              مَقْصورتانِ.قالَ أَبو عبيدٍ: يقالُ للَّذي يَجيءُ {ثانِياً فِي السُّوددَ وَلَا يَجِيءُ أَولاً ثُنىً، مَقْصورٌ،}
              وثُنْيانٌ {وثِنْيٌ، كلُّ ذلِكَ يقالُ؛ ويُرْوَى قَوْل أَوْس.تَرَى} ثِنانا إِذا مَا جَاءَ بَدْأَهُمُ يَقولُ: الثَّانِي
              مِنَّا فِي الرِّياسَة يكونُ فِي غيرِنا سَابِقًا فِي السُّوددِ، والكَامِل فِي السُّوددِ مِن غيرِنا ثِنىً فِي
              السُّوددِ عندنَا لفَضْلِنا على غيرِنا، (ج) {ثُنْيان (} ثِنْيَة) ، بالكسْرِ. يقالُ: فلانٌ ثِنْيَة أَهْل بَيْتِه
              أَي أَرْذَلهم؛ وقالَ الأَعْشى:طَوِيلُ اليدَيْنِ رَهْطُه غيرُ ثِنْيةٍأَشَمُّ كَرِيمٌ لَا يُرَهَّقُ (و) {الثُّنْيانُ:
              (مَنْ لَا رَأْيَ لَهُ وَلَا عَقْلَ.(و) } الثّنْيانُ: (الفاسِدُ مِن الرَّأْيِ) وَهُوَ مجازٌ.(و) مَضَى (ثِنْيٌ
              من اللَّيلِ، بالكسْرِ) ، أَي (ساعَةٌ) مِنْهُ؛ حُكِي عَن ثَعْلَب.(أَو وَقْتٌ) مِنْهُ.( {والثَّنِيَّةُ) ، كغَنِيَّة:
              (العَقَبَةُ) ، جَمْعُه} الثَّنايا؛ قالَهُ أَبو عَمْرو.(أَو طَريقُها) العالِي؛ وَمِنْه الحدِيثُ: (مَنْ يَصْعَدُ
              {ثَنِيَّة المُرارِ حُطَّ عَنهُ مَا حُطَّ عَن بَني إسْرائيلَ) ، وقيلَ: أَرادَ بِهِ أَعْلَى المَسِيلِ فِي رأْسِه،
              والمُرارُ: مَوْضِعٌ بينَ الحَرَمَيْن،} وثَنِيّتُه عَقَبَةٌ شاقَّةٌ.(أَو) هِيَ (الجَبَلُ) نَفْسُه، (أَو الطَّريقَةُ
              فِيهِ) ، كالنّقبِ، (أَو إِلَيْهِ) .وقالَ الأزْهرِيُّ: العِقابُ جِبالٌ طِوالٌ تعرض الطَّريق، والطَّريقُ يأْخُذُ
              فِيهَا، وكلُّ عَقَبةٍ مَسْلوكَةٍ ثَنِيَّةٌ، وجَمْعُها {ثَنايَا، وَهِي المَدارجُ أَيْضاً.وقالَ الرَّاغِبُ:} الثَّنِيَّةُ
              مِن الجَبَلِ مَا يُحْتاجُ فِي قطْعِه وسُلوكِه إِلَى صُعُودٍ وحُدُورٍ فكأنَّه يثني السَّيْر.(و) الثَّنِيَّةُ:
              (الشُّهَداءُ الَّذين اسْتَثْناهُمُ اللَّهُ عَن الصَّعْقَةِ) ، رُوِي عَن كَعْب أَنه قالَ: الشُّهَداءُ {ثَنِيَّةُ
              اللَّهِ فِي الأرْضِ، يعْنِي مَنِ، اسْتَثْناهُ فِي الصَّعْقَةِ الأُولى، تَأَوَّل قَوْلَ اللَّهِ تَعَالَى: {ونُفِخَ
              فِي الصّورِ فصَعِقَ مَنْ فِي السَّماواتِ ومَنْ فِي الأرْضِ إلاَّ من شاءَ اللَّهُ} ؛ فَالَّذِينَ} اسْتَثْنَاهُمُ
              اللَّهُ عنْدَ كَعْب هُمُ الشُّهداءُ لأنَّهم عنْدَ رَبِّهم أَحْياءٌ يُرْزَقونَ فَرِحِين بمَا آتاهُمُ اللَّهُ
              من فضْلِه، فكأنَّهم {مُسْتَثْنَونَ من الصعقتين وَهَذَا معنى كَلَام كَعْب وَهَذَا الحَدِيث يرويهِ إِبْرَاهِيم
              أَيْضا (و) الثَّنيَّةُ: (بِمَعْنى} الاسْتِثْناءِ) يقالُ حَلَفَ يَمِينا ليسَ فِيهَا ثَنِيَّة، أَي {اسْتِثْناء.(و)
              الثَّنِيَّةُ (مِنَ الأَضْراسِ) تَشْبيهاً} بالثَّنِيَّةِ مِن الجَبَلِ فِي الهَيْئةِ والصَّلابَةِ، وَهِي (الأَرْبَعُ
              الَّتِي فِي مُقَدَّمِ الفَمِ {ثِنْتانِ من فَوْقُ} وثِنْتانِ مِن أَسْفَلَ) للإنْسانِ والخُفِّ والسَّبُعِ؛ كَذَا
              فِي المُحْكَم.وقالَ غيرُهُ: الثَّنِيَّةُ أَوَّل مَا فِي الفَمِ.(و) الثَّنِيَّةُ: (النَّاقَةُ الطَّاعِنَةُ فِي
              السَّادِسَةِ.(والبَعيرُ ثَنِيٌّ) . قيلَ لابْنةِ الخُسِّ: هَل يُلْقِحُ {الثَّنِيُّ؟ قَالَت: لقاحُه أَنِيٌّ أَي
              بَطِيءٌ.(و) الثَّنِيَّةُ: (الفَرَسُ الَّداخلَةُ فِي الرَّابِعَةِ، والشَّاةُ فِي الثَّالِثَةِ، كالبَقَرَةِ) .وَفِي
              الصِّحاحِ: الثَّنِيُّ الَّذِي يُلْقِي} ثَنِيَّته، ويكونُ ذلِكَ فِي الظِّلْفِ والحافِرِ فِي السَّنَةِ الثالثَةِ،
              وَفِي الخُفِّ فِي السَّنَةِ السادِسَةِ.وَفِي المُحْكَم: الثَّنِيُّ مِن الإِبِلِ الَّذِي يُلْقِي ثَنِيَّته وذلِكَ
              فِي السادِسَةِ، ومِن الغَنَمِ الداخِلُ فِي السَّنَة الثَّانِيَة تَيْساً كانَ أَو كَبْشًا.وَفِي التَّهْذِيبِ:
              البَعيرُ إِذا اسْتَكْمَلَ الخامِسَةَ وطَعَنَ فِي السادِسَةِ فَهُوَ {ثنِيٌّ، وَهُوَ أَدْنى مَا يجوزُ مِن سنِّ
              الإبِلِ فِي الأضاحِي، وَكَذَلِكَ من البَقَرِ والمِعْزى، فأمَّا الضَّأْنُ فيجوزُ مِنْهَا الجَذَعُ فِي الأَضاحِي،
              وإنَّما سُمِّي البَعيرُ} ثَنِيّاً لأنَّه أَلْقَى! ثَنِيَّته.قالَ ابنُ الأعْرابيِّ: ليسَ قَبْل الثَّنِيِّ اسمٌ
              يُسَمَّى وَلَا بَعْدَ البازِلِ اسمٌ يُسَمَّى.وقيلَ: كلُّ مَا سَقَطَتْ ثَنِيَّته مِن غيرِ الإنْسانِ ثَنِيٌّ،
              والظَّبيُ ثَنِيٌّ بعدَ الإجْذاعِ.وقالَ ابنُ الأثيرِ: الثَّنِيَّةُ مِنَ الغَنَمِ مَا دَخَلَ فِي الثالِثَةِ، ومِن
              البَقرِ كَذلِكَ، ومِنَ الإبِلِ فِي السادِسَةِ، والذَّكَر ثَنِيٌّ، وعَلى مَذْهبِ أَحْمدَ مَا دَخَلَ مِنَ المَعْزِفي
              الثانِيةِ، ومَن البَقَرِ فِي الثالثَةِ. "وقالَ ابنُ الأعْرابيِّ: فِي الفَرَسِ إِذا اسْتَتَمَّ الثالثَةَ ودخَلَ
              فِي الرابِعَةِ ثَنِيٌّ. (و) الثَّنِيَّةُ: (النَّخْلَةُ {المُسْتَثْناةُ مِن المُساوَمَةِ.(} والثُّنيَا، بالضمِّ،
              من الجَزُورِ) : مَا {يَثْنِيهِ الجازِرُ إِلَى نَفْسِه مِن (الرّأْسِ) والصُّلبِ (والقَوائِمِ) ؛ وَمِنْه الحدِيثُ:
              (كانَ لرجلٍ نَجِيبَةٌ فمرِضَتْ فباعَها مِن رجُلٍ واشْتَرَطَ} ثُنْياها؛ أَرادَ قَوائِمَها ورأْسَها؛ وأَنْشَدَ
              ثَعْلَب:مُذَكَّرة {الثُّنْيا مُسانَدة القَرَىجُمالِيَّة تَخْتبُّ ثمَّ تُنِيبُأَي أنَّها غَليظَةُ القَوائِم،
              أَي رأْسها وقَوائِمها تُشْبِهُ خَلْق الذِّكارَةِ.وقالَ الصَّاغانيُّ: ذِكْرُ الصّلبِ فِي الثُّنْيا وَقَعَ فِي
              كتابِ ابنِ فارسَ، والصَّوابُ الرأْسُ والقَوائِمُ.(و) الثُّنْيا: (كُلُّ مَا} اسْتَثْنَيْتَه) ؛ وَمِنْه الحدِيثُ:
              (نَهَى عَن الثُّنْيا إلاَّ أنْ يُعْلَمَ) ؛ وَهُوَ أَن {يُسْتَثْنَى مِنْهُ شيءٌ مَجْهولٌ فيفْسدَ البَيْعُ وذِلِكَ
              إِذا باعَ جَزُوراً بثمنٍ مَعْلومٍ} واسْتَثْنَى رأْسَه وأَطْرافَه، فإنَّ البَيْعَ فاسِدٌ.وقالَ ابنُ الأثيرِ:
              هِيَ أَن {يُسْتَثْنى فِي عقْدِ البَيْعِ شيءٌ مَجْهولٌ فيفْسدَه؛ وقيلَ: هُوَ أَن يُباعَ شيءٌ جزَافا، فَلَا يَجوزُ
              أَن يُسْتَثْنى مِنْهُ شيءٌ قَلّ أَو كَثُر؛ قالَ: وتكونُ الثُّنْيا فِي المزارعَةِ أَن يُسْتَثْنى بَعْدَ النِّصفِ
              أَو الثّلثِ كَيْلٌ مَعْلومٌ.وَفِي الحدِيثِ: (مَنْ أَعْتَقَ أَو طَلَّق ثمَّ اسْتَثْنى فَلهُ} ثُنْياه) ، أَي مَنْ
              شَرَطَ فِي ذلِكَ شَرْطاً أَو عَلَّقَه على شيءٍ فلَه مَا شَرَطَ أَو اسْتَثْنى مِنْهُ، مثْل أَنْ يقولَ طلَّقْتها
              ثَلَاثًا إلاَّ واحِدَةً أَو أَعْتَقَهم إلاَّ فلَانا) ؛(! كالثُّنْوَى) ، كالرُّجْعَى. يقالُ: حَلَفَ يَمِيناً
              ليسَ فِيهَا ثُنْيا وَلَا ثُنْوَى، قُلِبَتْ ياؤُه واواً للتَّصْريفِ، وتَعْويضِ الواوِ مِن كَثْرةِ دُخولِ الياءِ
              عَلَيْهَا وللفَرقِ أَيْضاً بينَ الاسمِ والصِّفَةِ.( {والثُّنْيَةُ) بضمٍ فسكونٍ.(} والمُثَنَّاةُ: ع) بالطائِفِ.(
              {ومُثَنَّى: اسمٌ.(} واثَّنَى، كافْتَعَلَ: {تَثَنَّى) ، أَصْلُه} اثْتَنَى فقُلِبَتِ الثَّاءُ ثاةً لأنَّ التاءَ
              أُخْتُ التاءِ فِي الهَمْسِ ثمَّ أُدْغِمَتْ فِيهَا؛ قالَ الشَّاعِرُ:بَدا بِأبي ثمَّ {اثَّنَى بأَبي أَبيوثَلَّثَ
              بالأَذنينِ ثَقْف المَحالِبِهذا هُوَ المَشْهورُ فِي الاسْتِعمالِ والقَويُّ فِي القِياسِ. وَمِنْهُم مَنْ يقلبُ
              تاءَ افْتَعَلَ ثاء فيَجْعلُها مِن لَفْظِ الفاءِ قَبْلها فيقولُ اثَّنَى واثَّرَدَ واثَّأَدَ، كَمَا قالَ بعضُهم
              فِي اذْدَكَر اذَّكَرَ وَفِي اصْطَلَحَ اصَّلَح.(} وأَثْنَى البَعيرُ) {ثِناءً: أَلْقى ثَنِيَّته و (صارَ ثَنِيَّاً)
              .وقالَ ابنُ الأعْرابيِّ فِي الفَرَسِ إِذا} أَثْنَى: ألْقَى رَواضِعَه، فيُقالُ أَثْنَى وأَدْرَم {الإثناءَ، قالَ:
              وَإِذا سَقَطَتْ رَواضِعُه ونَبَتَ مكانَها سِنٌّ، فنَباتُ تلْكَ السنِّ هُوَ الإِثناءُ، ثمَّ يَسْقطُ الَّذِي يَلِيه
              عنْدَ إِرْباعِه.(} والثَّناءُ، بالفتْحِ،! والتَّثْنِيَةُ: وَصْفٌ بمَدْحٍ أَو بذَمِّ، أَو خاصٌّ بالمَدْحِ؛ وَقد
              {أَثْنَى عَلَيْهِ} وثَنَّى.(قُلْتُ: أَمَّا أَثْنَى فمَنْصوصٌ عَلَيْهِ فِي كُتُبِ اللُّغَةِ كُلِّها.(قالَ الجَوْهرِيُّ:
              أَثْنى عَلَيْهِ خَيْراً، والاسمُ {الثَّناءُ.(وقالَ اللَّيْثُ: الثَّناءُ، مَمْدودٌ، تَعَمُّدك} لتُثْنيَ على إنْسانٍ
              بحسَن أَو قَبيحٍ.(وَقد طارَ {ثَناءُ فلانٍ أَي ذَهَبَ فِي النَّاسِ، والفْعلُ أَثْنَى؛ وأَمَّا} التثنيةُ وفِعْله
              ثنى فَلم يَقُلْ بِهِ أَحَدٌ والصَّوابُ فِيهِ التثبية، وثبى بالموحَّدَةِ بِهَذَا المعْنَى؛ وَقد تقدَّمَ ذلِكَ
              للمصنِّفِ، ثمَّ إنَّ تَقْييدَ الثَّناء مَعَ شُهْرتِه بالفتْحِ غَيْرُ مَقْبولٍ بل هُوَ مُسْتدركٌ، وأَشارَ للفَرْقِ
              بَيْنه وبينَ النَّثا بقَوْلِه: أَو خاصٌّ بالمدْحِ، أَي والنَّثا خاصٌّ بالذمِ.(قالَ ابنُ الأَعْرابيِّ: يقالُ
              أَثْنَى إِذا قالَ خَيْراً أَو شرّاً، وأَنْثى إِذا اغْتابَ.(وعُمومُ الثَّناءِ فِي الخَيْرِ والشرِّ هُوَ الَّذِي
              جَزَمَ بِهِ كَثِيرُونَ؛ واسْتَدَلّوا بالحدِيثِ: (مَنْ {أَثْنَيْتُم عَلَيْهِ خَيْراً وجَبَتْ لَهُ الجنَّةُ ومَنْ
              أَثْنَيْتُم عَلَيْهِ شرّاً وَجَبَتْ لَهُ النَّارُ) .(و) ثِناءُ الدَّارِ، (ككِتابٍ: الفِناءُ) .قالَ ابنُ جنِّيِ:
              ثِناءُ الدَّارِ وفِناؤُها أَصْلانِ لأنَّ} الثِّنَاءَ مِن {ثَنَى} يَثْنِي، لأنَّ هناكَ تَنْثَني عَن الإنْبِساطِ
              لمجيءِ آخِرها واسْتَقْصاءِ حُدودِها، وفِناؤُها مِنْ فَنِيَ يَفْنَى لأنَّك إِذا تَناهَيْتَ إِلَى أَقْصَى حُدودِها
              فَنِيَتْ.قالَ ابنُ سيِدَه: وجَعَلَه أَبو عبيدٍ فِي المُبْدلِ.(و) الثِّناءُ: (عِقالُ البَعِيرِ؛ عَن ابْن السَّيِّدِ)
              فِي الفرقِ. قُلْتُ: لَا حاجَةَ فِي نَقْلِه عَن ابنِ السَّيِّد وَقد ذَكَرَه الجَوْهرِيُّ حيثُ قالَ:وأَمَّا الثِّناءُ،
              مَمْدوداً، فعِقالُ البَعير ونَحْو ذلِكَ مِن حَبْل {مَثْنيَ، وكلّ واحدٍ مِن} ثِنْيَيْه فَهُوَ ثِناءٌ لَو أُفْرِد،
              تقولُ عَقَلْتُ البَعيرَ {بثِنايَيْن إِذا عَقَلْتُ يَدَيْه جَمِيعاً بحَبْل أَو بِطَرَفي حَبْل، وإِنَّما لم يُهْمَز
              لأنَّه لَفْظٌ جاءَ مُثَنىَّ لَا يُفْرَد واحِدُه فيُقالُ ثِناءٌ، فتُرِكتِ الياءُ على الأصْلِ كَمَا فَعَلوا فِي
              مِذْرَوَيْن، لأنَّ أَصْلَ الهَمْزةِ فِي ثِناءٍ لَو أُفْرِد ياءٌ، لأنَّه مِن} ثَنَيْتُ، وَلَو أُفْرِد واحِدُه
              لقيلَ {ثِنَاءان كَمَا تقولُ كساآنِ ورَدَاآنِ؛ هَذَا نَصّه.وقالَ ابنُ بَرِّي: إنَّما لم يُفْرد لَهُ واحِدٌ لأنّه
              حَبْلٌ واحدٌ يُشدُّ بأَحدِ طَرَفَيْه اليَد وبالطَّرَفِ الآخَرِ الأُخْرى، فهما كالواحِدِ.ومِثْله قَوْل ابنِ الأثيرِ
              فِي شرْحِ حدِيثِ عَمْرو بنِ دِينارٍ: رأَيْت ابنَ عُمَر يَنْحَرُ بدنته وَهِي بارِكَةٌ} مَثْنِيَّة {بثِنايَيْن.وقالَ
              الأصْمعيُّ: يقالُ عَقَلْتُ البَعيرَ بثِنَايَيْنِ، يُظْهِرُونَ الياءَ بعْدَ الألفِ، وَهِي المدَّة الَّتِي كانتْ
              فِيهَا، وَإِن مدّمادٌّ لكأنَ صَواباً كقَوْلِكَ كِسَاءٌ وكِسَاوَانِ وكِسَاآنِ. قالَ: وواحِدُ} الثِّنَايَيْنِ
              ثِناءٌ ككِسَاء.قُلْتُ: وَهَذَا خِلافُ مَا عَلَيْهِ النّحويُّونَ فإنّهم اتَّفَقُوا على تَرْكِ الهَمْز فِي الثّنَايَيْن
              وعَلى أَن لَا يُفْردُوا الوَاحِدَ.وكَلامُ اللّيْثِ مثْل مَا نَقَلَه الأصْمعيّ، وَقد رَدَّ عَلَيْهِ الأزْهريُّ
              بِمَا هُوَ مَبْسوطٌ فِي تَهْذِيبِه. ورُبَّما نَقَل المصنِّفُ عَن ابنِ السَّيِّد لكَوْنِه أَجازَ إفْرادَ الواحِدِ،
