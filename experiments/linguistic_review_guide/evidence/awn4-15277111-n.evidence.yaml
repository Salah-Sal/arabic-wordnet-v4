        definitions_text: 'الطَّريقَةُ في الجَبَلِ , كالنَّقْبِ ما يُحْتاجُ في قَطْعِه وسُلُوكِه في الجَبَلِ إلى صُعُودٍ وحُدُور
          الجَبَلُ نَفْسُه إِحْدَى أرْبَعٍ من الأسْنانِ في مُقَدَّم الفَمِ , ثِنْتانِ من فَوْق , وثِنْتانِ من أسْفَل من النُّوقِ:
          الطاعِنَةُ في السادِسَة من الخَيْلِ: الداخِلَةُ في الرَّابِعة من الغَنَمِ والبَقَرِ: الداخِلَةُ في الثالثَةِ من
          المَعْز: الدَّاخِلَةُ في الثانِيَة'
