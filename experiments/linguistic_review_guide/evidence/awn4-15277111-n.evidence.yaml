          text: 'ثَنِيَّةُ العُقابِ : ثَنِيَّةٌ في جَبَلٍ مُشْرِفٍ على غُوطَةِ دِمَشْقَ من ناحِيَةِ الشِّمالِ'
          attribution: null
        - idx: 4
          type: hadith
          text: أَنَّ دَلِيلَهُما سَلَكَ بهما آمِجَ , ثُمَّ الخَرَّار , ثم ثَنِيَّةَ المَرَّةِ , ثم لَقْفاً
