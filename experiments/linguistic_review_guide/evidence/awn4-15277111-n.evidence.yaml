          - entry_id: 911161
            dictionary_id: 136
            headword: ثنى
            headword_bare: ثنى
            headword_norm: ثني
            root: ثن
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              ثنى قَالَ أَبُو عبيد: وجدت المثاني على مَا جَاءَ فِي الْآثَار وَتَأْويل الْقُرْآن فِي ثَلَاثَة أوجه: فَهِيَ فِي أَحدهَا الْقُرْآن كُله مِنْهَا قَول اللَّه عز وَجل {اَللهُ نَزَّلَ أَحْسَنَ الْحَدِيثِ كِتَابًا مُّتَشَابِهاً مَّثَانِيَ تَقْشَعِرُّ مِنْهُ} فَوَقع الْمَعْنى علىالقرآن كُله
              فَإِنَّهَا قَالَ أَبُو عُبَيْدٍ: وَيُقَال: إِنَّمَا سمي المثاني لِأَن الْقَصَص والأنباء ثُنّيت فِيهِ وَمِنْه [هَذَا -] الحَدِيث أَيْضا. أَلا تسمع إِلَى قَوْله: إِنَّهَا السَّبع من المثاني يُرِيد تَأْوِيل قَوْله تَعَالَى: {وَلَقَدْ آتَيْنَاكَ سَبْعَا مَّنَ المَثَانِي وَالْقَرَآنَ العَظِيْمَ} وَالْمعْنَى وَالله أعلم أَنَّهَا السَّبع الْآيَات من الْقُرْآن وَهِي فِي الْعدَد سِتّ وَقَالَ النَّبِي عَلَيْهِ السَّلَام: سبع ويروى أَن السَّابِعَة بِسْمِ الله الرَّحْمَن الرَّحِيم تعد آيَة فِي فَاتِحَة الْكتاب خَاصَّة لَا غير يُحَقّق ذَلِك حَدِيث ابْن عَبَّاس فِي قَوْله: {وَلَقَدْ آتَيْنَاكَ سَبْعَا مَّنَ المَثَانِي} قَالَ: هِيَ فَاتِحَة الْكتاب. وَقرأَهَا عليّ ابْن عَبَّاس وعَدّ فِيهَا بِسم الله الرَّحْمَن الرَّحِيم. قَالَ أَبُو عبيد: فَهَذَا أَجود الْوُجُوه من المثاني أَنه الْقُرْآن كُله وَقَالَ بعض النَّاس: بل فَاتِحَة الْكتاب هِيَ السَّبع المثاني وَاحْتج بِأَنَّهَا تثنى فِي الصَّلَاة فِي كل رَكْعَة وفِي وَجه آخر أَن 85 / ب المثاني مَا كَانَ دون المئين وَفَوق / المُفَصَّل من السُّور وَمِنْه حَدِيث عَلْقَمَة حِين قدم مَكَّة فَطَافَ بِالْبَيْتِ أسبوعا ثمَّ صلى عِنْد الْمقَام رَكْعَتَيْنِ فَقَرَأَ فيهمَا بالسبع الطُّول ثمَّ طَاف أسبوعا ثمَّ صلى رَكْعَتَيْنِ قَرَأَ فيهمَا [بالمئين ثمَّ طَاف أسبوعا ثمَّ صلى رَكْعَتَيْنِ قَرَأَ فيهمَا -] بالمثاني ثمَّ طَاف أسبوعًا ثمَّ صلى رَكْعَتَيْنِ قَرَأَ فيهمَا بالمفصل. وَمن ذَلِك حَدِيث ابْن عَبَّاس رَضِي اللَّه عَنْهُمَا حِين قَالَ لعُثْمَان: مَا حملكم على أَن عمدتم إِلَى سُورَة بَرَاءَة وَهِي من المئين وَإِلَى الْأَنْفَال وَهِي من المثاني فقرنتم بَينهمَا وَلم تجْعَلُوا بَينهمَا سطر بِسم اللَّه الرَّحْمَن الرَّحِيم فجعلتموها فِي السَّبع الطوَال فَقَالَ عُثْمَان: إِن رَسُول الله عَلَيْهِ السَّلَام كَانَ إِذا أنزلت عَلَيْهِ السُّورَة أَو الْآيَة يَقُول: اجْعَلُوهَا فِي الْموضع الَّذِي يذكر فِيهِ كَذَا وَكَذَا وَتُوفِّي رَسُول اللَّه صلي اللَّه عَلَيْهِ وَسلم وَلم يبين لنا أَحْسبهُ قَالَ: أَيْن نضعها وَكَانَت قصَّتهَا شَبيهَة بِقِصَّتِهَا فَلذَلِك قرنتُ بَينهمَا. قَالَ أَبُو عبيد: فالمثاني فِي هذَيْن الْحَدِيثين تأويلهما فِيمَا نقص عَن المئين. وَقَالَ [أَبُو عُبَيْد -] : فِي حَدِيثه عَلَيْهِ السَّلَام أَنه قَالَ: بئْسَمَا لأحدكم أَن يَقُول: نسيت آيَة كَيْت وَكَيْت لَيْسَ هُوَ نَسِي وَلكنه نُسِّي واستذكروا الْقُرْآن فَلَهو أَشد تَفَضيا من صُدُور الرِّجَال من النَّعم من عقلهَا.
