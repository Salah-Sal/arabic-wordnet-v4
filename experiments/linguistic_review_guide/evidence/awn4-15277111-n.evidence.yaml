                والثِّنَايَةُ في العِكْمِ: خَشَبَةٌ تُشَدُّ بالحَبْلِ إليه.
                والمِثْنَاةُ: حَبْلُ الفَرَسِ؛ وكذلك الثِّنَايَةُ، والمَثَانِي: الحِبَالُ. وطَرَفُ الزِّمَامِ الدَّقِيْقُ. وتُفْتَحُ المِيْمُ أيضاً.
                والثِّنْيُ من كُلِّ شَيْءٍ: يُثْنى بَعْضُه على بعضٍ أطْوَاءً؛ فكُلُّ واحِدَةٍ: ثِنْيٌ، حَتّى يُقال: أثْنَاءُ الحَيَّةِ: مَطَاوِيْها.
                ويُقَالُ: ثَنَيْتُ الشَّيْءَ أثْنِيْه. وثَنَيْتُه عن وَجْهِه: إذا رَدَدْتَ عَوْدَه على بَدْئه. واثْتَنَيْتُه: مِثْلُه.
                والتَّثَنّي: التَّلَوّي في المَشْيِ.
                وثَنّى فلانٌ: فَعَلَ فِعْلاً ثانِياً.
                والثَّنْيُ: ضَمُّ واحِدٍ إلى آخَرَ، والثِّنْيُ: الاسْمُ.
                وثَنَى عِنَانَه عَنّي: أعْرَضَ. و " جاءَ ثانِياً من عِنَانِه ": أي جاءَ وادِعاً.
                وفلانٌ لا تُثْنى به الخَنَاصِرُ: أي لا يُعَدُّ ثانِياً.
                وثَنّى تَثْنِيَةً: إذا فَعَلَ أمْراً ثُمَّ ضَمَّ إليه آخَرَ. وثَنَيْتُ الرَّجْلَيْنِ أثْنِيْهما، وأنَا ثانيهما. واثْنَتَانِ: على تَقْدِيْرِ ضَمِّ إثْنَةٍ إلى إثْنَةٍ؛ لا تُفْرَدَانِ. وجاءَ القَوْمُ مَثْنى مَثْنى وثُنَاءَ ثُنَاءَ.
                والمَثْنى: من أوْتَارِ العُوْدِ. وقيل: ما دُوْنَ المِئيْنَ من السُّوَرِ. وما فَوْقَ المُفَصَّلِ.
                والمَثَاني: آياتُ سُورَةِ فاتِحَةِ الكِتَابِ. وقيل: من سُوْرَةِ البَقَرَةِ إلى بَرَاءَةَ. وقيل: القُرْآنُ كلُّه؛ لقَوْلِه تعالى: " كِتَاباً مُتَشَابِهاً مَثَانِيَ "، وسُمِّيَ بذلك لأنَّ القَصَصَ والأنْبَاءَ ثُنِّيَتْ فيه.
                وقَوْلُه: غَيْرُ ما ثِنْيٍ ولا بِكْرٍ: أي لَيْسَ بأوَّلِ مَرَّةٍ ولا ثِنْيِ ثانِيَةٍ.
                والثِّنَاوَةُ: بمَعْنى أنْ يكُوْنَ الرَّجُلُ ثانِياً.
                وفلانٌ يَثْني ولا يَثْلِثُ: أي يَعُدُّ من الخُلَفَاءِ اثْنَيْنِ ويُنْكِرُ غَيْرَهما.
                وناقَةٌ ثِنْيٌ: وَلَدَتْ بَطْنَيْنِ. وأثْنَتِ الحامِلُ: وَضَعَتِ الثاني، وكذلكَ إذ حُلِبَتْ قَعْبَيْنِ.
                والثَّنِيَّةُ: أعْلى مَسِيْلٍ في رَأْسِ جَبَلٍ يُرى من بَعِيْدٍ فيُعْرَف. وهي العَقَبَةُ أيضاً، وجَمْعُها ثَنَايَا.
                وأثْنَاءُ الوادي: أحْنَاؤه. ومَثَانِيْه: مَحَانِيْه.
                والثَّنِيَّةُ: أحَبُّ الأوْلاَدِ إلى الأُمِّ.
                والثَّنِيَّةُ: سِنٌّ واحِدٌ من الثَّنَايَا. والثَّنِيُّ من غَيْرِ النَّاسِ: ما سَقَطَتْ ثَنِيَّتَاه الرّاضِعَتَانِ ونَبَتَتْ له ثَنِيَّتَانِ أُخْرَيَانِ، يُقَال: أثْنى الفَرَسُ.
                وفلانٌ ثَنِيَّتي: أي خاصَّتي، وهُمْ ثَنَايَايَ. والثُّنْيُ بوَزْنِ العُمْيِ: جَمْعُ الثَّنِيِّ من الإِبِلِ. والثُّنْيَانُ جَمْعٌ.
                وهو يَرْكَبُ النَّاسَ بثَنْيَيْهِ: أي بنَاحِيَتَيْه.
                والثِّنَاءُ: الفِنَاءُ، وجَمْعُه أَثْنِيَةٌ.
                والثِّنَى مَقْصُوْرٌ: الذي بَعْدَ السَّيِّدِ، والثُّنْيَانُ مِثْلُه؛ فلانٌ ثُنْيَانُ بَني فلانٍ: أي يَلي سَيِّدَهم. وجَمْعُ الثِّنى ثِنْيَةٌ.
                وأمْرٌ ثِنىً: أي ثانٍ. وحَلَبْتُ النّاقَةَ ثِنىً. ويوَمُ الثِّنى: يَوْمُ الاثْنَيْنِ. وفي الحَدِيثِ: " لا ثِنى في الصَّدَقَةِ " أي لا يُؤْخَذُ مَرَّتَيْنِ في السَّنَةِ.
                وجَمْعُ الاثْنَيْنِ من الأيّامِ: أثَانٍ وأَثَانِيْنُ.
                والثِّنَايَةُ: النِّخَاسُ الذي يُجْعَلُ في البَكْرَةِ إذا اتَّسَعَتْ.
                والثُّنْيَا من الجَزُوْرِ: الرَّأْسُ والقَوَائِمُ؛ لأنَّ الجَزّارَ يَسْتَثْنِيْها لنَفْسِه.
                وقيل في قَوْلِه:
                مُذَكَّرَةُ الثُّنْيَا
                قَوَائِمُها ورَأْسُها. وقيل: هي النَّظْرَةُ الثَّانِيَةُ؛ أي إنَّ النَّظْرَةُ الأُوْلى تُخِيْلُ والثَّانِيَة تُحَقِّقُ.
                وفي الحَدِيْثِ: " نَهَى النَّبِيُّ صلى الله عليه وسلم عن الثُّنْيَا " وذلك أنْ يَبِيْعَ الرَّجُلُ الشَّيْءَ جِزَافاً فلا يَجُوْزُ له أنْ يَسْتَثْنِيَ منها شَيْئاً قَلَّ أو كَثُرَ؛ لأنَّهُ لا يَدْرِي كَمْ يَبْقى منه. وهي في المُزَارَعَةِ: أنْ يَسْتَثْنِيَ بعد النِّصْفِ أو الرُّبْعِ أو الثُّلثِ كَيْلاً مَعْلُوماً، وهي الثَّنْوى.
                والاسْتِثْنَاءُ في اليَمِيْنِ أصْلُه من ثَنَيْتُ الشَّيْءَ: أي زَوَيْته.
                ومَثْنى الأَيَادِي: الأنْصِبَاءُ التي كانَتْ تَفْضُلُ من الجَزُوْرِ في المَيْسِرِ عن السِّهِامِ؛ فكانَ الجَوَادُ يَشْتَرِيْها فيُطْعِمُها الأبْرَامُ. وهو أنْ يُعِيْدَ مَعْرُوْفَه مَرَّتَيْنِ.
                ومَثَاني الدّابَّةِ: مِرْفَقَاه ورُكْبَتَاه.
