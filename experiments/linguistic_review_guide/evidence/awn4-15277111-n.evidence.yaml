    - entry_id: 696708
      dictionary_id: 94
      headword: |
        (1) اليوبيل: الاحتفال بانقضاء 25 سنة على حدثٍ بعينِهِ silver jubilee ، أو بانقضاء 50 سنة على الحدث golden jubilee ، أو بانقضاء 60 أو 75 سنة عليه diamond jubilee
        (2) اليوبيل؛ فترة الغفران: سنة يعلنها البابا كلَّ 25 عامًا، عادةً، يُمْنَحُ فيها الغفرانَ كلُّ من يتوب عن المعاصي أو يحج إلى رومة
        (3) «أ» تهلُّل؛ ابتهاج. «ب» موسم [أو مناسبة] ابتهاج عام
        (4) التهلّلية: أغنية زنجيّة شعبية [تشتمل على إشارات إلى أيام سعيدة قادمة].
