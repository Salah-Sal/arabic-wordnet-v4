            is_partial: 0
            definitions_text: '(انظر: [سائل حماية من التجمد](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91543)).
              هو [إثيلين - جليكول](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87532)، ويُسمى أيضاً
              [كحول الجليكول](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87488). يُستخدم ثنائي الإيثانول
              كمادة أساسية في إنتاج سائل الحماية من التجمد، الموجودة في منظومات تبريد المحرك، وذلك نظراً لارتفاع درجة حرارة
              غليانه التي تبلغ 198° س، وقابليته غير المحدودة للذوبان في الماء.'
