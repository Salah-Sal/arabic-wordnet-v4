            headword_bare: المثنوي
            headword_norm: المثنوي
            root: ثني
            root_source: ocr
            pos: noun
            form: null
            is_partial: 0
            definitions_text: 'من الشِّعر : المُرْدَوِجُ , ومَنْظُوماته تَخْتَلِفُ فيها القافِيَةُ من بيتٍ إلى بيتٍ , وتَنْجِدُ
              فى شَطْرَى كُلِّ بيتٍ , كمُزْدَوَجات أبان بن عَبْد الحميد , والشِّعر التَّعْلِيمِي كَأَلْفِيَّةِ ابن مالك .
              كِتَابٌ كبيرٌ في ستَّة وعشرين أَلْفِ بَيْت , في التَّصَوُّفِ والمَلَامَةِ ووحْدَةِ الوُجُودِ والقِصَص التَّعْلِيمِيَّةِ
              والتَّرْبويَّة من شعر جلال الدين القونوى المعروف بالرومي .'
