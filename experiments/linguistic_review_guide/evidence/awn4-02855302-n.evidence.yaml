          - entry_id: 794892
            dictionary_id: 112
            headword: جوهر
            headword_bare: جوهر
            headword_norm: جوهر
            root: جهر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'الجوهر: ماهية إذا وجدت في الأعيان كانت لا في موضوع، وهو مختصر في خمسة: هيولي، وصورة، وجسم،
              ونفس، وعقل؛ لأنه إما أن يكون مجردًا أو غير مجرد، فالأول أي المجرد: إما أن يتعلق بالبدن تعلق التدبير والتصرف،
              أو لا يتعلق، والأول أي ما يتعلق: العقل، والثاني أي ما لا يتعلق: النفس. والثاني: هو أن يكون غير مجرد، إما أن
              يكون مركبًا، أو لا. والأول -أي المركب: الجسم. والثاني -أي غير المركب: إما حال، أو محل؛ فالأول -أي الحال: الصورة،
              والثاني -أي المحل: الهيولي. وتسمى هذه الحقيقة الجوهرية في اصطلاح أهل الله: بالنفس الرحمانية والهيولي الكلية،
              وما يتعين منها وصار موجودًا من الموجودات: بالكلمات الإلهية، قال الله تعالى: {قُلْ لَوْ كَانَ الْبَحْرُ مِدَادًا
              لِكَلِمَاتِ رَبِّي لَنَفِدَ الْبَحْرُ قَبْلَ أَنْ تَنْفَدَ كَلِمَاتُ رَبِّي وَلَوْ جِئْنَا بِمِثْلِهِ مَدَدًا}
              . واعلم أن الجوهر ينقسم إلى: بسيط روحاني، كالعناصر، وإلى مركب في العقل دون الخارج، كالماهيات الجوهرية المركبة
              من الجنس والفصل، وإلى مركب منهما، كالمولدات الثلاث.'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:18:587
