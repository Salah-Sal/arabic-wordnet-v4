            external_id: haw:19:1384
            dict_key: hawramani_19
            dict_name_ar: القاموس المحيط للفيروزآبادي
            dict_name_en: Firuzabadi, al-Qāmūs al-Muḥīṭ (d. 1414 CE)
            dict_source_type: hawramani
            dict_period: classical
            dict_author: null
            dict_death_year: 1414
            definitions:
            - sense_index: 0
              text: 'الجَهْرَةُ: مَا ظَهَرَ،و {أرنا اللَّهَ جَهْرَةً} ، أي: عِياناً غيرَ مُسْتَتِرٍ.وجَهَرَ، كَمَنَعَ: عَلَنَ،وـ
                الكلامَ، وبه: أَعْلَنَ به،كأجْهَرَ،وهو مِجْهَرٌ ومِجْهارٌ: عادَتُهُ ذلك،وـ الصَّوْتَ: أعْلاَهُ،وـ الجَيْشَ:
                اسْتَكْثَرَهُم،كاجْتَهَرَهُم،وـ الأرضَ: سَلَكَها،وـ الرَّجُلَ: رآه بِلاَ حِجابٍ، أو نَظَرَ إليه، وعَظُمَ في
                عَيْنِهِ، وراعَهُ جمالُهُ وَهَيْئَتُهُ،كاجْتَهَرَهُ،وـ السِّقاءَ: مَخَضَهُ،وـ القومُ القومَ: صَبَّحَتْهُمْ
                على غِرَّةٍ،وـ البِئْرَ: نَقَّاها، أو نَزَحَها،كاجْتَهَرَها، أو بَلَغَ الماءَ،وـ الشيءَ: كَشَفَهُ،وـ الشَّمْسُ
                المُسَافِرَ: أَسْدَرَتْ عَيْنَهُ،وـ فلاناً: عَظَّمَهُ،وـ الشيءَ: حَزَرَهُ.وجَهِرَتِ العَيْنُ، كَفَرِحَ: لم
                تُبْصِرْ في الشَّمْسِ. وكَكَرُمَ: فَخُمَ،وـ الصَّوْتُ: ارْتَفَعَ.وَكَلاَمٌ جَهِرٌ ومُجْهَرٌ وجَهْوَرِيٌّ:
                عالٍ.والمَجْهورَةُ من الآبارِ: المَغْمُورَةُ،وـ من الحُروفِ: ما جُمِعَ في: "ظِلُّ قَوٍّ رَبَضٌ إِذْ غزا جُنْدٌ
                مُطيعٌ".وجَهِرٌ وجَهيرٌ، بَيِّنُ الجُهورَةِ والجَهارَةِ: ذو مَنْظَرٍ.والجُهْرُ، بالضم: هَيْئَةُ الرَّجُلِ،
                وحُسْنُ مَنْظَرِهِ.والجَهْرُ: الرَّابِيَةُ الغليظَةُ، والسَّنَةُ، والقِطْعَةُ من الدَّهْرِ.والجَهيرُ: الجميلُ،
                والخَلِيقُ للمَعْرُوفِ، ج: جُهَراءُ،وـ من اللَّبَنِ: ما لم يُمْذَقْ بماء.والأَجْهَرُ: الحَسَنُ المَنْظَرِ
                والجِسْمِ، التَّامُّهُ، والأَحْوَلُ المَلِيحُ الحَوَلَةِ، ومن لا يُبْصِرُ في الشمسِ، وفَرَسٌ غَشِيَتْ غُرَّتُهُ
                وَجْهَه.والجَهْرَاءُ: أُنْثَى الكُلِّ، وما اسْتَوَى من الأرضِ، لا شجرٌ ولا آكامٌ، والجَماعَةُ، والعينُ الجاحِظَةُ،وـ
                من الحَيِّ: أفاضِلُهُم.والجَوْهَرُ: كُلُّ حَجَرٍ يُسْتَخْرَجُ منه شيءٌ يُنْتَفَعُ بِهِ،وـ من الشيءِ: ما وُضِعَتْ
                عليه جِبِلَّتُه، والجَريءُ المُقْدِمُ.وأجْهَرَ: جاءَ بابْنٍ أَحْوَلَ، أَو بِبَنِينَ ذَوِي جَهَارَةٍ، وهُمُ
                الحَسَنُو القُدودِ والخُدُودِ.والجِهَارُ والمُجَاهَرَةُ: المُغالَبَةُ. ولَقِيَهُ نهاراً جِهاراً، ويفتحُ.وجَهْوَرٌ،
                كجعفرٍ: ع، واسمٌ.والجَيْهَرُ والجَيْهُورُ: الذُّبابُ الذي يُفْسِدُ اللَّحْمَ.وفَرَسٌ جَهُورُ الصَّوْتِ، كصَبورٍ:
                ليس بأجَشٌّ ولا أغَنَّ، ثم يَشْتَدُّ صَوْتُهُ حتى يَتباعَدَ.واجْتَهَرْتُهُ: رَأَيْتُه عظيمَ المَرآةِ، ورأيْتُهُ
                بِلاَ حجابٍ بينَنا.وجِهارٌ، ككِتابٍ: صَنَمٌ كان لِهوزِانَ.'
