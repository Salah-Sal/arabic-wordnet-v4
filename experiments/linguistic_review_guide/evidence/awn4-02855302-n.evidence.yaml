          - entry_id: 74355
            dictionary_id: 2
            headword: جَوْهر
            headword_bare: جوهر
            headword_norm: جوهر
            root: جوهر
            root_source: ocr
            pos: proper_noun
            form: null
            is_partial: 0
            definitions_text: 'عَلَمٌ على غير واحدٍ , من أشهرهم : جَوْهر الصِّقِلِّىُّ (٣٨١هـ = ٩٩٢م ): جَوْهر بن عبد الله
              الرُّومىّ, كان من موالى المُعِزِّ لدين الله الفاطمىّ, سَيَّره على رَأس جَيْشه , من القيروان إلى مِصْر, بعد موت
              كافُور الإخْشِيدِيّ فدخلَها سنة ٣٥٨هـ , وأرسل له الجيوش ففتَح بلادَ الشَّام وضمَّها إليه , وبقى حاكمًا مُطْلَقًا
              إلى أن قدِم مولاه المُعِزُّ سنة ٣٦٢ هـ فتَولَّى أمْرَ الدَّوْلة وصارَ جَوْهرٌ أعْظَمَ قوَّاده , وهو الذى بنَى
              مدينةَ القاهرة , والجامع الأَزْهر, وكان شُجاعًا كثير الإحسان'
