          - entry_id: 813593
            dictionary_id: 117
            headword: الجوهر
            headword_bare: الجوهر
            headword_norm: الجوهر
            root: جهر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'الجوهر: ماهية إذا وجدت في الأعيان كانت لا في موضع وهو منحصر في خمسة: هيولى وصورة وجسم ونفس
              وعقل، لأنه إما أن يكون مجردا أو لا، والأول إما أن لا يتعلق بالبدن تعلق تدبير وتصرف أو يتعلق. والأول العقل والثاني
              النفس، وغير المجرد إما مركب أولا، والأول الجسم والثاني إما حال أو محل، الأول الصورة والثاني الهيولى وتسمى الحقيقة.فالجوهر
              ينقسم إلى بسيط روحاني كالعقول، والنفوس المجردة، وإلى بسيط جسماني كالعناصر، وإلى مركب في العقل دون الخارج كالماهيات
              الجوهرية المركبة من الجنس والفصل، وإلى مركب منهما كالمولدات الثلاثة.'
