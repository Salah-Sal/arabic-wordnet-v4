            definitions_text: "جهر\n1 جَهَرَ, (A, Msb, K,) aor. ـَ (Msb, K,) inf. n. جَهْرٌ and جِهَارٌ, (Er-Rághib, TA,)\
              \ It (a thing, A, Msb) was, or became, plain, apparent, conspicuous, open, or public; syn. ظَهَرَ, (A, Msb,)\
              \ and بَدَا, (TA,) and عَلَنَ: (K:) or the radical signification is, it (a thing) was, or became, exceedingly\
              \ plain to be perceived, either by the sense of sight or by that of hearing. (Er-Rághib, TA.) [Accord. to some,\
              \ when relating to what is visible, it is tropical; and when relating to what is audible, proper: but if so,\
              \ it seems to be so much used in the former sense as to be, in that sense, conventionally regarded as proper.\
              \ See also جَهْرَةٌ.]\nA2:  جَهُرَ, aor. ـُ [inf. n., app., جَهَارَةٌ and جُهُورَةٌ,] He (a man, TA) was, or\
              \ became, great, or bulky, (K, TA,) [and therefore a conspicuous object,] before the eyes of the beholder. (TA.)\
              \ [And He was, or became, pleasing, or goodly, in aspect: see جَهَارَةٌ, below.] b2:  Also, (A, Msb, K,) inf.\
              \ n. جَهَارَةٌ, (A, Msb,) It (the voice) rose [so as to be plainly heard]; was, or became, high, or loud. (A,\
              \ Msb, * K.) b3:  Also, (S,) inf. n. جَهَارَةٌ, (TA,) He, (a man) was, or became, high, or loud, of voice. (S,\
              \ TA.) A3:  جِبِر aor. ـَ (Msb,) inf. n. جَهَرٌ, (S, Msb,) He (a man) was unable to see in the sun. (S, Msb,\
              \ TA.) And in like manner said of the eye. (K.) A4: جَهَرَهُ, (Msb, TA,) inf. n. جَهْرٌ; (TA;) and جَهَرَ بِهِ;\
              \ (A, Msb;) and ↓ اجهرهُ, (A, Msb, TA,) [and بِهِ ↓ اجهر;] and ↓ جَهْوَرَهُ; (TA;) He made it plain, apparent,\
              \ conspicuous, open, or public. (A, Msb, TA.) b2:  جَهَرَ الكَلَامَ, and جَهَرَبِهِ; (K;) and ↓ اجهرهُ, inf.\
              \ n. إِجْهَارٌ; (S;) and بِهِ ↓ اجهر; (K;) and ↓ جَهْوَرَ; (TA;) and جَهَرَ بِالقَوْلِ, and بِدُعَائِهِ, and\
              \ بِصَلَاتِهِ, (TA,) and بِقِرَآءَتِهِ, (Sgh, Msb, TA,) aor. ـَ inf. n. جَهْرٌ and جِهَارٌ; (TA;) and بقرءآته\
              \ ↓ اجهر; (Sgh, Msb, TA;) He uttered the speech, and the saying, and his supplication, and his prayer, and his\
              \ recitation, with a plain, or an open, voice; openly; publicly: (S, Msb, K, TA:) or جَهَرَ بِكَلَامِهِ, (A,)\
              \ and بِالقَوْلِ, and ↓ جَهْوَرَ; (S;) and بِقِرَآءَتِهِ; (A;) he uttered his speech, and the saying, and his\
              \ recitation, with a raised, or loud, voice; aloud: (S, A:) and جَهَرَ الصَّوْتَ he raised the voice [so as\
              \ to make it plainly heard]. (K.) b3:  جَهَرَ بِالمَعَاصِى, and ↓ اجهر, and ↓ جاهر, he made known the acts of\
              \ disobedience that he had committed, by talking of them: he who does so is termed بِالمُعَاصِى ↓ مُجَاهِرٌ,\
              \ and simply مُجَاهِرٌ. (TA.) And مَا فِى صَدْرِهِ ↓ اجهر He revealed what was in his bosom. (A.) and الحَدِيثَ\
              \ بَعْدَ مَا هَيْنَمَهُ ↓ جَهْوَرَ He revealed the story after he had concealed it. (A.) And ↓ اجهر الأَمْرَ\
              \ He made the case, or affair, notorious. (TA.) b4:  Also جَهَرَهُ He discovered it (K, TA) ocularly. (TA.)\
              \ b5:  He saw him (a man) without  any veil (K, TA) intervening; (TA;) as also ↓ اجتهرهُ: (K:) or he looked\
              \ towards him, or regarded him. (K.) You say, مَا فِى الحَىِّ أَحَدٌ تَجْهَرَهُ عَيْنِى There is not in the\
              \ tribe any one whom my eye regards as worthy of notice or respect by reason of his greatness therein; syn.\
              \ تَأْخُذُهُ. (TA.) And القَوْمُ فُلَانًا ↓ اجتهر The people looked towards such a one without any veil intervening\
              \ between them and him. (TA.) b6: He treated him, or regarded him, with reverence, veneration, respect, or honour:\
              \ (K:) or (TA) he regarded him as great in his eyes: (K, TA:) he saw him to be great in aspect, or appearance;\
              \ (S;) as also ↓ اجتهرهُ (S, K) and ↓ استجرهُ: (A:) he was pleased with his beauty, and his form, or appearance,\
              \ or state of apparel or the like; as also ↓ اجتهرهُ: (Lh, * K:) or he pleased him by his beauty and form or\
              \ appearance &c.: (A:) or it pleased him by its beauty; as also ↓ اجتهرهُ. (TA.) b7:  He saw it (an army, S,\
              \ A, K, and a people, TA) to be numerous in his eyes; as also ↓ اجتهرهُ. (S A, K.) A5:  جَهَرَ البِئْرَ, (S,\
              \ K,) aor. ـَ inf. n. جَهْرٌ, (TA,) He cleared out the well, (S, K,) and took forth from it the black fetid\
              \ mud that it contained; as also ↓ اجترها: (S:) or both signify he entirely, or nearly, exhausted the well of\
              \ its water: (K:) or the former, he reached the water of the well, (K, TA,) in digging: or so جَهَرَ alone:\
              \ (TA:) and accord. to Akh, جَهَرْتُ الرَّكِيَّةَ signifies I cleared out the mud that the water covered in\
              \ the well, so that the water appeared and became clear. (S.) 'Áïsheh said, describing her father, دُفُنَ الرَّوَآءِ\
              \ ↓ اجتهر, lit., He cleared out the filled-up wells of abundant water so as to make the water well forth; alluding\
              \ to his rectifying affairs that had become disordered. (TA from a trad.) A6:  جَهَرْنَاهُمْ We came to them\
              \ in the morning, at the time called الصَّبَاح, (S, A, K, TA,) when they were inadvertent. (S, K, TA.) b2: \
              \ جَهَرَ الأَرْضَ He traversed the land (S, K) without knowledge. (S.) A7:  جَهَرَ السِّقَآءَ He shook the milk-skin\
              \ to make butter, (Fr, S, K,) and took forth its butter. (Fr, TA.) A8:  جَهَرَتِ الشَّمْسُ المُسَافِرَ The sun\
              \ dazzled the eye, and confused the sight, of the traveller; syn. أَسْدَرَتْ عَيْنَهُ. (K.) 3 جاهر: see 1. b2:\
              \  [Its inf. n.] مُجَاهَرَةٌ signifies The fighting [with any one] face to face: and the showing open enmity,\
              \ or hostility, with any one: and the reading, or reciting, a thing aloud: and the speaking loudly. (KL.) You\
              \ say, جاهر بِالعَدَاوَةِ, (Msb,) inf. n. مُجَاهَرَةٌ (S, Msb) and جِهَارٌ, (Msb,) He showed open enmity or\
              \ hostility, with another. (S, * Msb.) And جَاهَرْتُهُمْ بِالأَمْرِ I acted openly with them in the affair,\
              \ or case; syn. عَالَنْتُهُمْ بِهِ. (JK.) [And جاهرهُ He treated him openly with enmity &c.] b3:  جَاهَرَهُمْ\
              \ بِالأَمْرِ, (TA,) inf. n. مُجَاهَرَةٌ and جِهَارٌ, (K,) [is explained as signifying] He vied with them, or\
              \ strove to overcome or surpass them, in the affair, or case. (K, * TA.) [But غالبهم, in the TA, and المُغَالَبَةُ,\
              \ in the K, are here evidently mistranscriptions for عَالَنَهُمْ and المُعَالَنَةُ.]4 أَجْهَرَ see 1, in eight\
              \ places. b2:  اجهر also signifies He begat sons goodly in stature (IAar, K) and in aspect, (IAar, TA,) or in\
              \ cheeks: (K:) or, a squint-eyed son. (IAar, K.) 6 تَجَاْهَرَ [تَجَاهُرٌ signifies The showing oneself openly:\
              \ and acting openly, or being open in one's conduct or converse, with others. You say,] تَجَاهَرُوا بِالعَدَاوَةِ\
              \ They showed open enmity, or hostility, one with another; syn. تَبَادَوْابِهَا. (S in art. بدو.) A2:  [and\
              \ تجاهر He feigned himself unable to see in the sun: see the part. n., below.]8 إِجْتَهَرَ see 1, in eight places.10\
              \ استجهرهُ: see 1. b2:  Also He took it forth. (TA from a trad.) Q. Q. 1 جَهْوَرَ: see 1, in four places.\n\
              جَهْرًا: see جَهْرَةٌ, in two places.\nجُهْرٌ: see جَهَارَةٌ, in six places.\nجَهِرٌ: see جَهِيرٌ, in two places.\n\
              جَهْرَةٌ A thing that is plain, apparent, conspicuous, open, or public. (K.) You say, رَآهُ جَهْرَةً (S, A,\
              \ &c.) He saw him, or it, [plainly,] without the intervention of any veil: (TA:) and ↓ رآه جِهَارًا [signifies\
              \ the same: or] he saw him, or it, with exceeding plainness: (Er-Rághib, TA:) or the former signifies he saw\
              \ him, or it, with his eyes, ocularly, or before his eyes, (S, A, Bd in ii. 52, Msb,) without anything intervening:\
              \ (S:) so in the Kur. [ii. 52], حَتَّى نَرَى اللّٰهَ جَهْرَةً: (S, Bd:) and [some say that] جَهْرَةً is here\
              \ originally an inf. n. of جَهَرْتُ in جَهَرْتُ بِالقِرَآءَةِ, [like ↓ جَهْرًا,] and metaphorically used in\
              \ the sense of مُعَايَنَةً: it is in the accus. case as an inf. n.: or it is thus used as a denotative of state\
              \ relating to the agent or the object: and some read ↓ جَهَرَةً, as an inf. n. like  غَلَبَة, or as pl. of جَاهِرٌ,\
              \ and as such it is a denotative of state: (Bd:) or جَهْرَةً is here from جَهَرْتُ الرَّكِيَّةَ: (Akh, S:) accord.\
              \ to Ibn-' Arafeh, it here signifies unconcealed from us: (TA:) and in the Kur. iv. 152, ocularly; not concealed\
              \ from us by anything. (K, * TA.) b2:  You say also, كَلَّمَهُ جَهْرَةً\n[and ↓ جَهْرًا He spoke to him plainly,\
              \ with an open voice, aloud, or publicly]. (S, TA.) b3:  and ↓ لَقِيَهُ نَهَارًا جِهَارًا and ↓ جَهَارًا [He\
              \ met him in the daytime, openly, or publicly]. (K.) جُهْرَةٌ [A blaze covering the face of a horse: or the\
              \ quality of having such a blaze:] a subst. from \nأَجْهَرُ applied to a horse. (TA.) b2:  A cast in the eye.\
              \ (AA, TA. [See also أَجْهَرُ.]) جَهَرَةً: see جَهْرَةٌ.\nجَهَارًا and جِهَارًا: see جَهْرَةٌ, in three places.\n\
              جَهْوَرٌ: see جَهِيرٌ. b2:  Also, and ↓ مُجْتَهَرٌ, An army seen to be numerous. (A.) b3:  And the former, Bold;\
              \ daring: in the K, erroneously, ↓ جَوْهَرٌ. (TA.) جَهِيرٌ (in the TA, here, ↓ جَهِرٌ, but in another place,\
              \ جَهِيرٌ,) High, loud, or vehement, speech; (Msb, K, TA;) as also ↓ مُجْهَرٌ and ↓ جَهْوَرِىٌّ: (K:) and so\
              \ applied to the voice; (Msb, TA;) as also ↓ جَهْوَرِىٌّ. (A, TA.) Also, and ↓ مُجْهَرٌ (TA) and ↓ جَهْوَرِىٌّ\
              \ (A, TA) and ↓ جَهْوَرٌ (A) and جَهِيرُ الصَّوْتِ (S, A) and الصَّوْتِ ↓ جَهْوَرِىُّ, (S,) A man having a high,\
              \ loud, or strong voice. (S, A, TA.) b2:  A man (S, A) of pleasing, or goodly, aspect; (S, A, K;) as also ↓\
              \ جَهِرٌ: (K:) fem. of the former with ة: (S:) beautiful: (K:) of goodly aspect, who pleases the beholder by\
              \ his beauty: and a face of goodly, or beautiful, fairness: (TA:) and ↓ أَجْهَرُ a man (TA) of goodly aspect,\
              \ (K, TA,) and of goodly and perfect body. (AA, K, TA.) b3:  Also, (K,) or جَهِيرٌ لِلْخَيْرِ and لِلْمَعْرُوفِ,\
              \ (A,) Adapted  to, or constituted for, goodness: (A, K:) because he who beholds him desires his beneficence:\
              \ (TA:) pl. جُهَرَآءُ. (A, K.) A2:  Also Milk not mixed with water: (Fr, S, K:) or from which the butter has\
              \ been taken forth. (TA.) جُهَارَةٌ [an inf. n. (see جَهُرَ)] Pleasingness, or goodliness, of aspect; (S, A,\
              \ K;) as also ↓ جُهُورَةٌ (K) and ↓ جُهْرٌ: (TA:) [and a quality pleasing to behold: for] Abu-n-Nejm says, وَأَرَى\
              \ البَيَاضَ عَلَى النِّسَآءِ جَهَارَةً\n[And I regard fairness in women as a quality pleasing to behold]: (S:)\
              \ and ↓ جُهْرٌ signifies the form, or appearance, or the like, and goodliness of aspect, of a man: (K:) or what\
              \ pleases by its beauty, of the form or appearance or the like, of a man, and and goodliness of aspect: (S:)\
              \ [and simply aspect, or outward appearance.] You say, بَنُونَ ذَوُو جَهَارةٍ\nSons goodly in stature and in\
              \ aspect: (IAar, TA:) or in stature and in cheeks: (K:) but the former is the more agreeable with authority.\
              \ (TA.) And فُلَانٍ ↓ مَا أَحْسَنَ جُهْرَ How goodly is the form, or appearance, or the like, and the beauty\
              \ of aspect, of such a one! (S, A: *) [or simply, the aspect; for] you say also, ↓ مَا أَسْوَأَ جُهْرَهُ [How\
              \ evil is his aspect!]. (A.) And رَجُلٌ حَسَنُ الجَهَارَةِ and ↓ الجُهْرِ A man goodly in aspect. (TA.) and\
              \ فَعَرَفْتُ سِرَّهُ ↓ رَأَيْتُ جُهْرَهُ [I saw his aspect, and so knew his mind]. (A.) جُهُورَةٌ: see the next\
              \ preceding paragraph.\nفُلَانٌ عَفِيفُ السَّرِيرَةِ وَ الجَهِيرَةِ [Such a one is chaste in secret conduct\
              \ and in public behaviour]. (A.) جَهْوَرِىٌّ: see جَهِيرٌ, in four places.\nجَوْهَرٌ a word of well-known meaning,\
              \ (Msb,) [a coll. gen. n., Jewels; precious stones; gems; pearls: any kind of jewel, precious stone, or gem:\
              \ and also applied (as in the T, M, Mgh, Msb, and K, voce تِبْرٌ, q. v.,) to native ore:] any stone from which\
              \ is extracted, or elicited, anything by which one may profit: (K:) n. un. with ة: (S:) [pl. جَوَاهِرُ:] it\
              \ is of the measure فَوْعَلُ, (Msb,) and is from الجَهْرُ signifying a thing's “ becoming exceedingly plain\
              \ to be perceived by the sense of sight: ” (Er-Rághib, TA:) or it is of Persian origin, (TA,) arabicized, (S,\
              \ TA,) [from گَوْهَرْ,] accord. to most persons. (TA.) b2:  جَوْهَرُ سَيْفٍ\nThe diversified wavy marks, streaks,\
              \ or grain, of a sword; syn. فِرِنْدٌ. (T and K voce فِرِنْدٌ.] b3: جَوْهَرُ شَىْءٍ [The essence of a thing;\
              \ or that whereby a thing is what it is; the substance of a thing: the constituent of a thing; the material\
              \ part thereof;] that upon which the natural con-stitution of a thing is as it were based; or of which its natural\
              \ constitution is made to be; [or, as IbrD thinks to be meant in the K, the collective parts and materials of\
              \ a thing, of which its natural constitution is moulded;] expl. by مَاوُضِعَتْ عَلَيْهِ جِبِلَّتُهُ, (K,) or,\
              \ as in some Lexicons, [as the JK and the Msb,] مَا خُلِقَتْ عَلَيْهِ جِبِلَّتُهُ [which is virtually the same]:\
              \ (TA:) الجَوْهَرُ and الذَّاتُ and المَاهِيَّةُ and الحَقِيقَةُ are all syn. terms; and the first has other\
              \ significations; but in the classical language it signifies الأَصْلُ, i. e., أَصْلُ المُرَكَّبَاتِ [the original\
              \ of compound things]; and not what subsists by itself. (Kull.) b4:  [Hence, الجَوْهَرُ الفَرْدُ (assumed tropical:)\
              \  The indivisible atom.] b5:  In the conventional language of scholastic theology, جَوْهَرٌ signifies (tropical:)\
              \  Substance, as opposed to accident; in which sense, some assert the word to be so much used as to be, in this\
              \ sense, conventionally regarded as proper. (TA.) A2:  See also جَهْوَرٌ.\nجَوْهَرِىٌّ A jeweller; a seller\
              \ of جَوْهَر [or جَوَاهِر]. (TA.) b2:  [In scholastic theology, (assumed tropical:)  Of, or relating to, substance,\
              \ as opposed to accident.]\nأَجْهَرُ: see جَهِيرٌ. b2:  Also A man having the eyeball, or globe of the eye,\
              \ prominent and apparent, or large and prominent; syn. جَاحِظٌ: or resembling such as is termed جاحظ: fem. جَهْرَآءُ.\
              \ (TA.) And this latter, An eye having the ball, or globe, prominent and apparent, or large and prominent; syn.\
              \ جَاحِظَةٌ: (K:) or resembling what is thus termed. (TA.) b3:  Having a pretty cast in the eye: (AA, K:) fem.\
              \ as above. (K.) b4: That cannot see in the sun; (S, A, Msb, K;) applied to a man, (A, Msb,) and to a ram: (S:)\
              \ fem. as above: (S, A, Msb, K:) or weak-sighted in the sun: (Lh, TA:) or that cannot see in the daytime; أَعْشَى\
              \ signifying “ that cannot see in the night: ” (TA:) and the fem., a woman who closes her eyes in the sun. (A.)\
              \ b5:  A horse having a blaze that covers his face: fem. as above. (K.) b6:  Also the fem., Open, bare, land,\
              \ not concealed by anything: (A:) or plain land, in which are no trees nor hills (K, TA) nor sands: (TA:) pl.\
              \ جَهْرَاوَاتٌ. (A, TA.) b7:  And A company (S, K) consisting of the distinguished part (TA) of a people: (S:)\
              \ the more, or most, excellent persons of a tribe. (K.) You say, [with reference to distinguished persons,]\
              \ كَيْفَ جَهْرَاؤُكُمْ How is your company? (S.) مُجْهَرٌ. see مَجْهُورٌ: and see also جَهِيرٌ, in two places.\n\
              مِجْهَرٌ (S, K) and ↓ مِجْهَارٌ (K) A man accustomed to speak with a plain, or an open, voice; openly; or publicly.\
              \ (S, K.) مِجْهَارٌ: see what next precedes.\nمَجْهُورٌ بِهِ Notorious; applied to a thing: (TA:) and so ↓ مُجْتَهَرٌ\
              \ applied to a man: (A, TA:) and ↓ مُجْهَرٌ plain, apparent, or conspicuous; applied  to a thing. (TA.) b2:\
              \  الحُرُوفُ المَجْهُورَةُ [The letters that are pronounced with the voice, and not with the breath only; the\
              \ vocal letters;] the letters (nineteen in number, S) that are comprised in the saying ظِلُّ قَوٍّ رَبَضٌ إِذْ\
              \ غَزَا جُنْدُ مُطِيعٌ: (S, K:) opposed to المَهْمُوسَةُ: (TA:) so called [accord. to some] because there is\
              \ a full stress in the place where any one of them occurs, and the breath is prevented from passing with it\
              \ until the stress is ended with the passage of the voice. (Sb, S.) A2:  مَآءٌ مَجْهُورٌ Water which, having\
              \ been buried in the earth, has been drawn until it has become sweet. (TA.) b2:  مَجْهُورَةٌ A well (بِئْرٌ)\
              \ cleared out, and cleansed from the black fetid mud which it had contained. (S.) b3:  And Wells frequented\
              \ [and in use], (K,) whether their water be sweet or salt. (TA.) مُجَاهِرٌ: see, above, جَهَرَ بِالمَعَاصِى.\n\
              مُجْتَهَرٌ: see مَجْهُورٌ: and see also جَهْوَرٌ.\nمُتَجَاهِرٌ Feigning himself أَجْهَر; as in the saying, cited\
              \ by Th, كَالنَّاظِرِ المُتَجَاهِرِ [Like the looker that feigns himself unable to see in the sun]. (TA.)"
