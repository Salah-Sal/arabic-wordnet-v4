                منها وصار موجودًا من الموجودات: بالكلمات الإلهية، قال الله تعالى: {قُلْ لَوْ كَانَ الْبَحْرُ مِدَادًا لِكَلِمَاتِ
                رَبِّي لَنَفِدَ الْبَحْرُ قَبْلَ أَنْ تَنْفَدَ كَلِمَاتُ رَبِّي وَلَوْ جِئْنَا بِمِثْلِهِ مَدَدًا} . واعلم
                أن الجوهر ينقسم إلى: بسيط روحاني، كالعناصر، وإلى مركب في العقل دون الخارج، كالماهيات الجوهرية المركبة من الجنس
                والفصل، وإلى مركب منهما، كالمولدات الثلاث.'
