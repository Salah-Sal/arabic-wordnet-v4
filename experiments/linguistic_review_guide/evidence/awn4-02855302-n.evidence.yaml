            - sense_index: 0
              text: 'جهر: (الجَهْرَة: مَا ظَهَرَ) ، وَرَآهُ جَهْرَةً، لم يكن بيهما سِتْرٌ. ورأَيته جَهْرَةً، وكَلَّمْته جَهْرَةٌ.
                (و) فِي الْكتاب الْعَزِيز ( {أَرِنَا اللَّهِ جَهْرَةً} (النِّسَاء: 153) قَالَ ابْن عَرَفَةَ: أَي غيرَ محتجب
                عنَّا، وَقيل: أَي عِيَاناً يكْشف مَا بَيْننَا وَبَينه.(وجَه، كمَنَعَ: عَلَنَ) وَبَدَا. وَفِي المفْردات للرّاغب:
                أَصْل الجَهْرِ ظُهورُ الشيْءِ بإِفراطٍ، إِمّا بحاسَّةِ البَصَرِ، كرأَيته جِهَاراً، وإِمّا بحاسّةِ السَّمْعِ، نَحْو:
                {وَإِن تَجْهَرْ بِالْقَوْلِ} (طه: 7) الْآيَة.(و) جَهَرَ (الكلامَ، و) جَهَرَ (بِهِ) يتعدَّى بحرفٍ وبغيرِه:
                (أَعْلَنَ بِهِ) ، اقتصرَ الجوهَرِيُّ على الثَّانِي، وذكَرَ الصغانيُّ المعَدَّى بنفسِه وفسَّره بقوله: أَعْلَنَه
                (كأَجْهَرَ) وجَهْوَرَ، فَهُوَ جَهِيرٌ ومُجْهِرٌ، وَكَذَا بدُعَائه وصَلاتِه وقِراءَتِه، يَجْهَر جَهْراً وجِهَاراً،
                وأَجْهَر بقراءَته لغةٌ. وجَهَرْت بالْقَوْل أَجْهَرُ بِهِ، إِذا أَعلنتَه.(وَهُوَ مِجْهَرٌ ومِجْهَارٌ) كمِنْبَرٍ
                ومِيزانٍ إِذا كَانَ مِن (عادَتِه ذالك) ، أَي أَن يَجْهَرَ بكلامِه.(و) قَالَ بَعضهم: جَهَرَ (الصَّوْتَ: أَعلاهُ)
                وأَجْهَرَ: أَعْلَنَ. وكلُّ إِعلانٍ جَهْرٌ.(و) جَهَرَ (الجيشَ) والقَوْمَ يَجْهَرهم جَهْراً (اسْتَكْثَرَهم:
                كاجْتَهَرَهم) . قَالَ يصف عَسْكَراً:كأَنَّمَا زُهَاؤُه لِمَنْ جِرْليلٌ ورِزُّ وَغْرِه إِذا وَغَرْ(و) جَهَرَ
                (الأَرْضَ: سَلَكَهَا) مِن غير مَعْرِفَةٍ.(و) جَهَرَ (الرَّجلَ: رَآهُ بِلَا حِجابٍ) بَينه وَبَينه، (أَو) جَهَرَه
                (نَظَرَ إِليه) . وَمَا فِي الحَيِّ أَحدٌ تَجْهَره عَيْنِي، أَي تَأْخُذه.(و) فِي حَدِيث عليَ رضيَ الله عَنهُ
                أَنّه وَصَف النبيَّ صلَّى الله عليْه وسلَّم فَقَالَ: (لم يكن قَصِيراً وسلَّم فَقَالَ: (لم يكن قَصِيراً وَلَا
                طَوِيلاً، وَهُوَ إِلى الطول أَقرَبُ، من رَآهُ جَهَرَه) ؛ أَي (عَظُمَ فِي عَيْنَيْه) .(و) جَهَرَه الشيْءُ:
                (راعَه جَمَالُه وهَيْئَتُه، كاجْتَهَرَه) ، فيهمَا. قَالَ اللِّحْيَانيّ: وَكنت إِذا رأَيتُ رَجلاً جَهَرْتُه
                واجْتَهَرْتُه؛ أَي راعَنِي. وَقَالَ غَيره: واجْتَهَرَنِي الشيْءُ: رَاعَنِي جَمالُه، كجَهَرَنِي.(و) جَهَرَ
                (السِّقاءَ: مَخَضَه) واستخرجَ زُبْدَه. حَكَاهُ الفَرّاءُ.(و) جَهَرَ (القَومُ القُومَ: صَبَّحَتْهم على غِرَّةٍ)
                ، أَي غَفْلَةٍ.(و) جَهَرَ) البِئْرَ) يَجْهَرُهَا جَهْراً: (نَقّاها) وأَخرجَ مَا فِيهَا مِن الحَمْأَة. وَكَذَا
                فِي الصّحاح، ونقلَه عَن الأَخفش. (أَو) جَهَرَها: (نَزَحها) وأَنشد الجوهريُّ للراجز:إِذ وَرَدْنَا آجِناً جَهَرْنَاهْأَو
                خالِياً مِن أَهْلهِ عَمَرْناهْقَالَ الصغانيّ: هُوَ إِنشادٌ مخْتَلٌّ وَقَعَ فِي كتب المتقدِّمين، وَالرِّوَايَة:إِذا
                وَرَدْنَ آجِناً جَهَرْنَهُأَو خالِياً مِن أَهلِه عَمَرْنَهُلَا يَلْبَث الخُفُّ الَّذِي قَلَبْنَهُبالبَلَدِ
                النّازِح أَنْ يَجْتَبْنَهُ(كاجْتَهَرَهَا، أَو) حَفَرَ البِئْرَ حَتَّى جَهَرَ، أَي (بَلَغَ الماءَ) . وَفِي
                حَدِيث عائشةَ: ووصَفَتْ أَباهَا رَضِيَ الله عَنْهُمَا فَقَالَت؛ (اجْتَهَرَ دُفُنَ الرَّواءِ) ؛ تُرِيدُ أَنه
                كَسَحَها، يُقَال: جَهَرْتُ البِئْرَ واجتَهَرتُها، إِذَا كَسَحْتَها إِذا كانَت مُنْدَفِنَةً، يُقَال: رَكايَا
                دُفُنٌ، والرَّواءُ: الماءُ الكثيرُ، وهاذا مَثَلٌ ضَرَبَتْ عائشةُ رضيَ الله عَنْهَا لإِحكامِه الأَمْر بعد انتشارِه؛
                شَبَّهَتْه برجلٍ أَتَى على آبارٍ مُنْدَفِنَةٍ، وَقد اندفنَ ماؤُهَا فَنَزَحَهَا وكَسَحَهَا، وأَخْرَجَ مَا فِيهَا
                من الدُّفُنِ حَتَّى نَبَعَ الماءُ.(و) جَهَرَ (الشيءَ: كَشَفَه) عِيَانً.(و) جَهَرَتِ (الشَّمْسُ المُسافِرَ:
                أَسْدَرَتْ عَيْنَه) وَمِنْه: الأَجْهَرُ مِن الرِّجال: الَّذِي لَا يُبْصِرُ فِي الشَّمس.(و) جَهَرَ (فِلاناً:
                عَظَّمَه) ، أَو رَآه عَظِيما فِي عَيْنه. وَفِي حَدِيث عُمَرَ رَضِي الله عَنهُ: (إِذا رَأَيْنَاكم جَهَرْناكم)
                .(و) جَهَرَ (الشيْءَ: حَزَرَه) وخَمَّنَه. (وجَهِرَتِ العَيْنُ: كفَرِحَ: لم تُبْصِر فِي الشَّمْس) ، وَكَذَا
                جَهِرَ الرجلُ جَهَراً.(و) جَهُرَ الرجلُ، (ككَرُمَ: فَخُمَ) بَين عَيْنَي الرّائِي.(و) جَهُرَ (الصَّوْتُ: ارتفعَ)
                وَعلَا وَكَذَا الرجلُ، جَهَارةً.(وكلامٌ جَهرٌ) ، كَتِف، (ومُجْهَرُ) ، كمُكْرَمٍ، (وجهْوَرِيٌّ) : شديدٌ (عالٍ)
                ، وكذالك الرجلُ يُوصَفُ بِهِ يُقَال: رجلٌ جَهِيرٌ ومُجْهَرٌ، أَي كمُكْرَمٍ، إِذا عُرِفَ بشدَّة الصوتِ.وأَجْهَرَ
                وجَهْوَرَ: أَعْلَنَ بِهِ.ورجلٌ جَهْوَرِيُّ الصَّوْتِ: رَفِيعُه. الجَهْوَرِيُّ: هُوَ الصوتُ العالي.وَفِي الحَدِيث:
                (فإِذا امرأَةٌ جَهِيرَةٌ) أَي عاليةُ الصوتِ.وَفِي حَدِيث العَبّاس: (أَنّه نادَى بصَوتٍ لَهُ جَهْوَرِيَ) ؛
                أَي شديدٍ عالٍ، وَالْوَاو زائدةٌ.وصوتُ جَهِيرٌ، وكلامٌ جَهِيرٌ: كِلَاهُمَا عالِنٌ عالٍ، قَالَ:فَيَقْصُرُ دُونَه
                الصَّوتُ الجَهِيرُفاقتصارُ المصنِّف على الْكَلَام دُون الرَّجُلِ قُصُورٌ.(والمَجْهُورَةُ مِن الْآبَار: المَعْمُورَةُ)
                عَذْبَةٌ كَانَت أَو مِلْحَةً.(و) المَجْهُورَةُ (مِن الحُرُوف) عِنْد النَحْوِيِّين، (مَا جُمِعَ فِي) قَوْلهم:
                (ظِلُّ قَوَ رَبَضٌ إِذْ غَزَا جُنْدٌ مُطِيعٌ) ، وَهِي تسعةَ عشرَ حرفا، وبضدِّها المهموسةُ، ويجمعُها قولُك:
                (سَكَتَ فحَثَّه شَخْصٌ) ، قَالَ سِيبَوَيْهِ: معنى الجَهْرِ فِي الحُرُوف أَنها حروفٌ أُشْبِعَ الاعتمادُ فِي
                موضِعِها، حَتَّى مَنَعَ النَّفَسَ أَن يَجْرِيَ مَعَه، حَتَّى ينقصَ الاعتمادُ ويَجْرِيَ الصوتُ، غير أَن المِيمَ
                والنُّون مِن جُمْلة المَجْهُورة، وَقد يعْتَمد لَهَا فِي الفَم والخَياشِيم فيصيرُ فِيهَا غُنَّةٌ، فَهَذِهِ
                صفةُ المَجْهُورة، ونقَلَه الجوهَرِيُّ وشرحُ التَّسْهِيل.(و) يُقَال: رجلٌ (جَهِرٌ) ، ككَتِفٍ، (وجَهِيرٌ) ،
                كأَمِيرٍ، (بَيِّنُ الجُهُورَةِ) ، بِالضَّمِّ، (والجَهَارةِ) ، بِالْفَتْح: (ذُو مَنْظَرٍ) . قَالَ أَبو النَّجْم:وأَرى
                البَياضَ على النِّسَاءِ جَهَارةًوالعِتْقُ أَعْرِفُه على الأَدْمَاءِ(والجُهرُ، بالضمّ: هَيئةُ الرجُلِ وحُسْنُ
                مَنْظَرِه) . قَالَ ابْن الأَعرابيِّ: رجلٌ حَسَنُ الجَهَارةِ والجُهْرِ، إِذا كَانَ ذَا مَنْظَرٍ، وَقَالَ القُطَامِيُّ:شَنِئْتُكَ
                إِذ أَبْصَرْتُ جُهْرَكع سَيِّئاًوَمَا غَيَّبَ الأَقْوَامُ تابِعَةُ الجُهْرِقَالَ: (مَا) بِمَعْنى الَّذِي،
                يَقُول: مَا غابَ عنكَ مِن خُبْرِ الرجلِ فإِنه تابِعٌ لمنظره، وأَنَّثَ (تابِعَة) فِي الْبَيْت، للْمُبَالَغَة.(والجَهْرُ)
                بِفَتْح فسكونٍ: (الرّابِيَةُ) السَّهْلَةُ (الغَيظَةُ) ، هاكذا فِي سَائِر النُّسَخ، وَفِي التَّكْمِلة: (العريضَة)
                بدل (الغليظة) .(و) الجَهْرُ: (السَّنَةُ) التامَّةُ.(و) عَن ابْن الأَعرابيِّ: الجَهْرُ (قِطْعَةٌ مِن الدَّهْر)
                ، قَالَ: وحَاكَمَ أَعرابيٌّ رجلا إِلى القاضِي، فَقَالَ: بِعْتُ مِنْهُ عُنْجُداً مُذْ جَهْرٌ فغابَ عَنِّي.
                قَالَ: أَي مُذْ قطعةٌ مِن الدَّهْر.(والجَهِيرُ: الجَمِيلُ) ، ذُو مَنظر حَسَنٍ يجْهَرُ مَن رَآهُ.(و) الجَهِيرُ
                (الخَلِيقُ للمَعْرُوفِ، ج جُهَراءُ) ، يُقَال: هم جُهَراءُ للمعروفِ، أَي خُلَقاءُ لَهُ؛ وَقيل ذالك لأَن مَن
                اجْتَهَرَه طَمِعَ فِي مَعْرُوفه. قَالَ الأَخطلُ:جُهَراءَ للمَعْرُوفِ حِين تَراهُمُخُلَقاءَ غيرِ تَنَابِلٍ
                أَشرارِ(و) الجَهِيرُ (مِن اللَّبَن: مَا لم يُمْذَقْ بماءٍ) ، حَكَاهُ الفَراءُ. وَقَالَ غيرُه: الجَهِيرُ: الَّذِي
                أُخْرِجَ زُبْدُه، والثَّمِيرُ: الَّذِي لم يُخْرَج زُبْدُه.(والأَجْهَرُ) مِن الرِّجال: (الحَسَنُ المَنْظَرِ،
                و) الحَسَنُ) (الجِسْمِ التَّامُّةُ) ، قَالَه أَبو عَمْرو.(و) الأَجهَرُ: (الأَحْوَلُ المَلِيحُ) الجُهْرَةِ،
                أَي (الحَوَلَةِ) ، عَنهُ أَيضاً.(و) الأَجْهَرُ: (مَن لَا يُبْصِرُ فِي الشمسِ) . قَالَ اللِّحيانيّ: كلُّ ضعيفِ
                البصرِ فِي الشَّمس أَجْهَرُ. وَقيل: الأَجْهَرُ بالنَّهَارِ، والأَعْشَى باللَّيْل.(و) الأَجْهَرُ: (فَرَسٌ غَشِيَتْ
                غُرَّتُه وَجُهَه) .والاسمُ الجُهْرَةُ.(والجَهْرَاءُ: أُنْثَى الكُلِّ) ، يُقَال: رَجُلٌ أَجُهَرُ وامرأَةٌ جَهْرَاءُ،
                فِي الْمعَانِي الَّتِي تَقَدَّمَتْ وكذالك حِصانٌ أَجْهَرُ وَفَرَسٌ جَهْرَاءُ.(و) الجَهْرَاءُ: (مَا اسْتَوَى
                مِن) ظَهْرِ (الأَرضِ لَا شَجَرٌ) بهَا (وَلَا آكامٌ) وَلَا رمالٌ، إِنما هِيَ فَضاءٌ وكذالك العَرَاءُ وجَمْعُهَا
                أَعْرِيَةٌ وَجَهْراواتٌ، يُقَال: وَطِئْنَا أَعْرِيَةً وجَهْرَاواتِ. قَالَ الأَزهريُّ: وهاذا من كَلَام ابْن
                شُمَيل. وَقَالَ أَبو حنيفةَ: الجَهْراءُ: الرّابِيَةُ الْمِحْلَالُ، لَيست بشديدةِ الإِشراف وَلَيْسَت بِرَمْلَةٍ
                وَلَا قُفَ.(و) جَهْرَاءُ القَومِ: (الجَمَاعَةُ) الخاصّةُ.(و) الجَهْرَاءُ العَيْنُ الجاحِظَةُ) ، أَو كالجَاحظَةِ،
                رجلٌ أَجْهَرُ وامرأَةٌ جَهْرَاءُ.(و) الجَهْراءُ (مِن الحيِّ أَفاضلُهم) وقِيل لأَعرابيَ: أَبَنُو جَعْفَرٍ أَشرفُ
                أَم بَنُو أَبِي بَكْرِ بنِ كِلَابٍ؟ فَقَالَ: أَمَّا خَوَاصَّ رجالٍ فبنو أَبي بكرٍ، وأَما جَهْرَاءَ الحَيِّ
                فبنو جعفرٍ. قَالَ الأَزهريُّ: نَصَبَ خواصّ على حذف الوَسِيط، أَي فِي خَواصّ رجالٍ.(والجَوْهَرُ: كلُّ حَجَرٍ
                يُسْتَخْرَج مِنْهُ شيْءٌ يُنْتَفَعُ بِهِ) . وَهُوَ فارسيٌّ مُعَرَّبٌ، كَمَا صَرَّح بِهِ الأَكْثَرُون. وَقَالَ
                الرّاغبُ فِي المُفْرَدات: الجَهْرُ: ظُهُورُ لشيّءِ بإِفراطِ حاسَّةِ البَصَرِ (أَو حَاسَّةِ السّمع. .) قَالَ:
                وَمِنْه الجَوْهَرُ فَوْعَلٌ لظُهُورِه للحاسَّة.(و) الجَوْهَرُ (من الشيْءِ: مَا وُضِعَتْ) وَفِي بعض الأُصُول:
                خُلِقَتْ (عَلَيْهِ جِبِلَّتُهُ) . قَالَ ابْن سِيدَه: وَله تحديدٌ لَا يَليق بهاذا الْكتاب. قلْت: ولعلّه يَعْنِي
                الجَوْهَرَ المُقَابِلَ للعَرَضِ الَّذِي اصطلحَ عَلَيْهِ المتكلِّمون حَتَّى جَزَمَ جماعةٌ أَنه حقيقةٌ عُرْفِيَّةٌ.(و)
                الجَوْهَرُ: (المُقْدِم الجَرِيءُ) ، هاكذا فِي سَائِر النُّسَخ، والصَّوابُ أَنه الجَهْوَرُ، بِتَقْدِيم الهاءِ
                على الْوَاو. يُقَال: رجلٌ جَهْوَرٌ، إِذا كَانَ جَرِيئاً مُقْدِماً مَاضِيا.(و) عَن ابْن الأَعرابيّ: يُقَال:
                (أَجْهَرَ) الرجل، إِذا (جاءَ بابْنٍ أَحْوَلَ، أَو) جاءَ (ببَنِينَ ذَوِي جَهَارةٍ) ، بِالْفَتْح، (وهم الحَسَنُو
                القُدُودِ والخُدُوِ) . ونَصُّ النَّوَادِر بعد القُدُود (الحَسَنُو المَنْظَرِ) ، وَهُوَ الأَوْفَقُ بكلامهم.
                وَلَا أَدرِي من أَيْن من أَين أَخَذَ المصنِّف الخُدُودَ.(والجِهَارُ) بِالْكَسْرِ (والمُجَاهَرَةُ: المُغَالَبَةُ)
                ، وَقد جاهَرَهم بالأَمر مُجاهَرَةً وجِهَاراً: غالَبَهُم. (وَلقِيَه نَهَاراً جِهَاراً) ، بِكَسْر الْجِيم، (ويُفْتَحُ)
                وأَبَى ابنُ الأَعرابيِّ فَتْحَهَا.(وجَهْوَرٌ، كجَعْفَرٍ: ع) ، قَالَ سَلْمَى بنُ المُقْعَدِ الهُذَلِيُّ، والبيتُ
                مَخْرُومٌ:لَوْلَا اتِّقَاءُ اللهِ حِين أدَّخَلْتُمُلَكُمْ ضَرِطٌ بَين الكُحَيْلِ وجَهْوَره(و) جَهْوَرٌ: (إسمُ)
                جماعةٍ، وَمِنْهُم: بَنو جَهْوَرٍ مُلُوكُ الطَّوائفِ فِي قُرْطُبَةَ ووُزَراؤُهَا، يَنْتَسِبُون إِلى كَلْبِ
                بنِ وَبَرَةَ بنِ ثَعْلَبِ بنِ حُلْوانَ، وَقد تَرْجَمَهم الفتحُ بنُ خاقانَ فِي القَلائِد والمَطْمَح.وآلُ جَهْوَرٍ:
                قبيلةٌ من بني يافِعٍ بِالْيمن.كتاب م كتاب (والجَيْهَرُ، والجَيْهُورُ: الذُّبابُ الَّذِي يُفْسِدُ اللَّحْمَ)
                ، نقلَه الصغانيُّ.(وَفَرَسٌ جَهُورُ الصَّوْتِ، كصَبُورٍ. وَهُوَ الَّذِي لَيْسَ بأَجَشَّ وَلَا أَغَنَّ، ثمَّ
                يَشتدُّ صوتُه حتَّى يتَباعَدَ) . والجمعُ جُهُرٌ.(واجْتَهَرْتُه: رأَيتُه عَظِيمَ المَرْآةِ) كجَهَرْته.(و) اجْتَهَرْتُه:
                (رأَيتُه بِلَا حِجابٍ بَيْننَا) . وَهُوَ فِي الصّحاح: جَهَرْتُ الرجلَ واجْتَهَرْتُه، إِذا رأَيتَه عَظِيمَ
                المَرْآةِ. والمصنِّفُ فرقَ فِي الْكَلَام، فذَكَرَ أَولاً جَهَرَ الرجلَ: رَآهُ بِلَا حِجَابٍ، وذَكَرَ هُنَا
                الرُّباعِيَّ، فَلَو قَالَ عِنْد ذِكْر الثُّلاثيِّ: كاجْتَهَرَه لَكَانَ أَخْصَرَ.(وجِهَارٌ، ككِتَابٍ: صَنَمٌ
                كَانَ لهَوازِنَ) ، القبيلةِ المشهورةِ.ويُوجَد هُنَا فِي بعض النُّسَخ زيادةٌ، وَهِي قولُه: (وجَهْرَاوَاتُ الصَّحراءِ)
                ، وَفِي بَعْضهَا: جَهْرَاوَاتُ صحراءُ: (بظاهِر شِيرَازَ، وغيرهُ لحنٌ) ، وَقد ذَكَرَ الزَّمَخْشَرِيُّ جَهْرَاوَاتِ
                الصَّحراءِ وصاحبُ اللِّسَان، وتَقَدَّمَت الإِشارةُ إِليه، فَلَا أَدْرِي مَا سَبَبُ اللَّحْنِ فِيهِ، فلْيُتَأَمَّلْ.وممّا
                يُستدرَك عَلَيْهِ:المُجَاهِرُ بالمَاصِي: المُظْهِرُ لَهَا بالتَّحَدُّثِ بهَا، وَمِنْه الحديثُ: (كُلُّ أُمَّتِي
                مُعافًى إِلا المُجاهِرِين) . يُقَال جَهَرَ، وأَجْهَرَ، وجاهَرَ. وَفِي حَدِيث آخَرَ: (لَا غَيْبَةَ لفاسِقٍ
                وَلَا مُجَاهِرٍ) .واجْتَهَرَ القَومُ فلَانا: نَظَرُوا إِليه جِهَاراً.ووَجْهٌ جَهِيرٌ: حَسَنُ الوَضاءَةِ.وأَمْرٌ
                مُجْهَر: واضِحٌ بَيِّنٌ.وَقد أَجْهَرْتُه أَنا إِجهاراً، أَي شَهَّرتُه، فَهُوَ مَجْهُورٌ بِهِ: مَشْهُورٌ.وَفِي
                حَدِيث خَيْبَرَ: (وَجَدَ الناسُ بهَا بَصَلاً وثُوماً فَجَهَرُوه) ؛ أَي اسْتَخْرَجُوه وأَكَلُوه.والمَجْهُورُ:
                الماءُ الَّذِي كَانَ سُدْماً فاسْتُقِيَ مِنْهُ حَتَّى طابَ.وَحَفَرُوا بِئْراً فأَجْهَرُوا: لم يُصِيبُوا خَيْراً.وكَبْشٌ
                أَجْهَرُ، ونَعْجَةٌ جَهْرَاءُ، وَهِي الَّتِي لَا تُبْصِرُ فِي الشَّمس. قَالَ أَبو العِيَالِ الهُذَلِيُّ يَصفُ
                مَنِيحَةً مَنَحَه إِيّاهَا بَدْرُ بنُ عَمّارٍ الهُذَلِيُّ:جَهْرَاءُ لَا تَأْلُوا إِذا هِيَ أَظْهَرَتبَصَراً
                وَلَا مِن عَيْلَةٍ تُغْنِينِيهاذا نَصُّ ابنِ سيدَه، وأَوْرَدَه الأَزهريُّ عَن الأَصمعيِّ، وَمَا عَزَاه لأَحدٍ،
                وَقَالَ: قَالَ يَصِفُ فَرَساً؛ يَعْنِي الجَهْرَاءَ. وَقَالَ أَبو مَنْصُور: أُرَى هاذا الْبَيْت لبعضِ الهُذَلِيِّين
                يصفُ نَعْجَةً قَالَ ابْن سِيدَه: وعَمّ بِهِ بعضُهم.والجُهْرَةُ: الحَوَلَةُ، أَنشدَ ثعلبٌ للطِّرمّاح:على جُهْرَةٍ
                فِي العَيْنِ وَهُوَ خَدُوجوالمُتجاهِرُ: الَّذِي يُرِيكَ أَنه أَجْهَرُ، وأَنشدَ ثعلبٌ:كالنّاظِرِ المُتجاهِرِوالمُجَاهَرَةُ
                بالعَدَاوةِ: المُبَادَأَةُ بهَا.وأَجهرَ بقراءَته: جَهَرَ بهَا.وجَهْوَرَ الحديثَ بعد مَا هَيْنَمَه، أَي أَظْهَرَه
                بعد مَا أَسَرَّه.وفلانٌ مُشْتَهِرٌ مُجْتَهِرٌ.وَهُوَ عَفِيفُ السَّرِيرَةِ والجُهِيرَةِ.وَقد سَمَّوْا أَجْهَرَ،
                وجَهْرانَ، وجَهِيراً، وجَهْوَراً. وفَخْرُ الدَّولةِ أَبو نَصْرٍ محمّدُ بنُ محمّدِ بن جَهِير كأَمِير وبَنُوه
                وزراءُ الدولةِ العباسيَّة.وأَبو سعيدٍ طغتدى بن خطلج الجَهِيرِيُّ، نُسِبَ إِليهم بالوَلاءِ، حَدَّثَ، رَوَى
                عَنهُ السَّمْعَانيُّ ببغدادَ.وأَبو حَفْصٍ جَهِيرُ بنُ يَزِيدَ العَبْدِيُّ، بَصْرِيٌّ، رَوَى عَن ابْن سِيرِينَ.
                وجَهْوَرُ بنُ سُفْيَانَ بنِ الحارثِ الأَزْدِيُّ أَبو الحارثِ الأَزْدِيُّ أَبو الحارثِ الجُرْمُوزِيُّ، بَصْرِيٌّ،
                عَن أَبيه، تابِعِيّانِ.وأُجْهُورُ، بالضمّ: قَرْيَتَانِ بمصرَ، يُنْسَبُ إِليهما الوَرْدُ الأَحْمَرُ، وَمن إِحداهما
                خاتِمَةُ المُحدِّثين: النُّورُ عليُّ بنُ محمّدِ بنِ الزَّيْنِ المالِكِيُّ، وَقد رَوَى لنا عَنهُ شُيوخُ مشايِخِ
                مَشَايِخَنَا. وَفِي قوانِين الدِّيوان لِابْنِ الجيعَان: جُجْهور بالجِيمَيْن، وَالْمَشْهُور الأَولُ.وممّن نُسبَ
                إِلى بَيْع الجَوْهَر أَبو محمّدٍ الحَسَنُ بنُ عليِّ بنِ محمّدِ بنِ عليّ بنِ الحَسَنِ الشِّيرازِيُّ البَغْدَادِيُّ،
                الحافِظُ المكْثِر، رَوَى عَنهُ أَبو بكْرِ الخَطِيب، وأَبو بكْرٍ الأَنصاريُّ، وَمِنْهُم: شيخُنَا المُفِيد المعَمَّر
                أَبو العَبّاسِ أَحمد بنُ الحَسَنِ (بن) محمّد بن عبد الْكَرِيم الجَوْهَرِيُّ الخالِدِيُّ، حضَرتُ فِي دروسِه
                وأَجَازَنِي، وُلِدَ سنة 1096 م، وتوَفِّيَ سنة 1182 م.'
