          - entry_id: 808816
            dictionary_id: 116
            headword: جهر
            headword_bare: جهر
            headword_norm: جهر
            root: جهر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '[جهر] نه في صفته صلى الله عليه وسلم: من رآه "جهره" أي عظم في عينه من جهرت الرجل واجتهرته إذا
              رأيته عظيم المنظر، ورجل جهير أي ذو منظر. ومنه: إذا رأيناكم "جهرناكم" أي أعجبتنا أجسامكم. غ: جهرت الجيش واجتهرتهم
              كثروا في عينك، والجهر حسن المنظر. و"جهرة" ظاهراً. نه وفي ح خيبر: وجد الناس بها بصلاً وثوماً "فجهروه" أي استخرجوه
              وأكلوه، يقال: جهرت البئر إذا كانت مندفنة فأخرجت ما فيها من الدفن حتى نبع الماء. ومنه ح عائشة تصف أباها: "اجتهر"
              دفن الرواء. الاجتهار الاستخراج، وهذا مثل ضربته لإحكامه الأمر بعد انتشاره، شبهته برجل أتى على آبار قد اندفن ماؤها
              فأخرج ما فيها من الدفن حتى نبع. وفيه: كل أمتي معافى إلا "المجاهرين" هم الذين جاهروا بمعاصيهم وأظهروها وكشفوا
              ما ستر الله عليهم فيتحدثون به، يقال: جهر وأجهر وجاهر. ك: وروى: إلا المجاهرون، أي كل أمتي يعفى عن ذنبه، ولا يؤخذ
              به إلا الفاسق المعلن، والمجانة يشرح في ميم. نه ومنه: وإن من "الإجهار" كذا، وروى من الجهار، وهما بمعنى المجاهرة.
              ومنه: لا غيبة لفاسق ولا "مجاهر". ج: وهو من يجهر بالمعاصي ولا يتحاشى أطراحاً لأمر الله. نه وفي ح عمر: إنه كان
              "مجهراً" أي صاحب جهر ورفع لصوته، جهر بالقول إذا رفع به صوته فهو جهير، وأجهر فهو مجهر إذا عرف بشدة الصوت. الجوهري:
              رجل مجهر بكسر ميم إذا كان من عادته أن يجهر بكلامه. ومنه: فإذا امرأة "جهيرة" أي عالية الصوت، ويجوز كونه من حسن
              المنظر. وفيه: نادى بصوت له "جهوري" أي شديد عال منسوب إلى جهور بصوته. ك: "لا تجهر" بصلاتك" حتى يسمع المشركون،
              حتى غاية للمنهي لا للنهي،'
            translation_en: null
            translation_fr: null
            domain: null
