            definitions_text: "الجوهر:[في الانكليزية] Substance ،essence [ في الفرنسية] Substance ،essence \nيطلق على معان:\
              \ منها الموجود القائم بنفسه حادثا كان أو قديما ويقابله العرض بمعنى ما ليس كذلك. ومنها الحقيقة والذات، وبهذا\
              \ المعنى يقال أي شيء هو في جوهره أي ذاته وحقيقته، ويقابله العرض بمعنى الخارج من الحقيقة. والجوهر بهذين المعنيين\
              \ لا شكّ في جوازه في حقّ الله تعالى وإن لم يرد الإذن بالإطلاق. ومنها ما هو من أقسام الموجود الممكن، فهو عند\
              \ المتكلمين لا يكون إلّا حادثا إذ كل ممكن حادث عندهم. وأما عند الحكماء فقد يكون قديما كالجوهر المجرّد وقد يكون\
              \ حادثا كالجوهر المادي. وعند كلا الفريقين لا يجوز إطلاقه بهذا المعنى على الله تعالى بناء على أنّه قسم من الممكن.\
              \ فتعريفه عند المتكلّمين الحادث المتحيز بالذات، والمتحيز بالذات هو القابل للإشارة الحسّية بالذات بأنه هنا أو\
              \ هناك، ويقابله العرض. فقال الأشاعرة:العرض هو الحادث القائم بالمتحيّز بالذات فخرج الإعدام والسّلوب لعدم حدوثها\
              \ لأنّ الحادث من أقسام الموجود. وخرج أيضا ذات الربّ وصفاته لعدم كونها حادثة ولا قائمة بالمتحيّز بالذات، فإنّ\
              \ الربّ تعالى ليس بمتحيّز أصلا. وبالجملة فذات الربّ تعالى وصفاته ليست بأعراض ولا جواهر. وقال بعض الأشاعرة العرض\
              \ ما كان صفة لغيره وينبغي أن يراد بما الحادث بناء على أنّ العرض من أقسام الحادث وألّا ينتقض بالصفات السلبية\
              \ وبصفات الله تعالى إذا قيل بالتغاير بين الذات والصفات كما هو مذهب بعض المتكلمين، وإن لم يكن بالتغاير بينهما\
              \ فصفات الله تعالى تخرج بقيد الغيرية. وقال المعتزلة العرض هو ما لو وجد لقام بالمتحيّز. وإنما اختاروا هذا لأنّ\
              \ العرض ثابت عندهم في العدم منفكا عن الوجود الذي هو زائد على الماهية ولا يقوم بالمتحيّز حال العدم، بل إذا وجد\
              \ العرض قام به. وهذا بناء على قولهم بأنّ الثابت في العدم ذوات المعدومات من غير قيام بعضها ببعض، فإنّ القيام\
              \ من خواص الوجود إلّا عند بعضهم، فإنّهم قالوا باتصاف المعدومات بالصفات المعدومة الثابتة. ويردّ عليهم فناء الجواهر\
              \ فإنه عرض عندهم وليس على تقدير وجوده قائما بالمتحيّز الذي هو الجوهر عندهم لكونه منافيا للجواهر، ولا ينعكس أيضا\
              \ على من أثبت منهم عرضا لا في محل كأبي هذيل العلّاف، فإنه قال: إنّ بعض أنواع كلام الله لا في محل، وكبعض البصريين\
              \ القائلين بإرادة قائمة لا في محل. وأما ما قيل من أنّ خروجها لا يضرّ لأنه لا يطلق العرض على كلام وإرادة حادثين\
              \ فمما لا يلتفت إليه، إذ عدم الإطلاق تأدّبا لا يوجب عدم دخولهما فيه. ومعنى القيام بالمتحيّز إمّا الطبيعة في\
              \ المتحيّز أو اختصاص الناعت كما يجئ في لفظ الوصف، ويجئ أيضا في لفظ القيام ولفظ الحلول.واعلم أنه ذكر صاحب العقائد\
              \ النسفية أنّ العالم إمّا عين أو عرض لأنّه إن قام بذاته فعين وإلّا فعرض، والعين إمّا جوهر أو جسم لأنه إمّا متركّب\
              \ من جزءين فصاعدا وهو الجسم أو غير متركّب وهو الجوهر، ويسمّى الجزء الذي لا يتجزأ أيضا. قال أحمد جند في حاشيته\
              \ هذا مبني على ما ذهب إليه المشايخ من أنّ معنى العرض بحسب اللغة ما يمتنع بقاؤه ومعنى الجوهر ما يتركّب منه غيره،\
              \ ومعنى الجسم ما يتركّب من غيره انتهى. فالجوهر على هذا مرادف للجزء الذي لا يتجزأ وقسم من العين وقسم للجسم. وقيل\
              \ هذا على اصطلاح القدماء. والمتأخرون يجعلون الجوهر مرادفا للعين ويسمّون الجزء الذي لا يتجزأ بالجوهر الفرد، ويؤيده\
              \ ما وقع في شرح المواقف من أنه قال المتكلمون لا جوهر إلّا المتحيّز بالذات، فهو إمّا يقبل القسمة في جهة واحدة\
              \ أو أكثر وهو الجسم عند الأشاعرة، أو لا يقبلها أصلا وهو الجوهر الفرد وقد سبق تحقيق تعريف الجوهر الفرد في لفظ\
              \ الجزء. ثم لا يخفى أنّ هذا التقسيم إنّما يصح حاصرا عند من قال بامتناع وجود المجرّد أو بعدم ثبوت وجوده وعدمه.\
              \ وأمّا عند من ثبت وجود المجرّد عنده كالإمام الغزالي والراغب القائلين. بأنّ الإنسان موجود ليس بجسم ولا جسماني\
              \ كما عرفت فلا يكون حاصرا. وأعمّ من هذا ما وقع في المواقف من أنّه قال المتكلمون الموجود في الخارج إمّا أن لا\
              \ يكون له أول وهو القديم أو يكون له أول وهو الحادث. والحادث إمّا متحيّز بالذات وهو الجوهر أو حال في المتحيّز\
              \ بالذات وهو العرض أو لا يكون متحيّزا ولا حالا فيه وهو المجرد انتهى. وهذا التقسيم أيضا ليس حاصرا بالنسبة إلى\
              \ من ثبت عنده وجود المجرّد فإنّ صفات المجرّد خارجة عن التقسيم. ثم الظاهر أنّ القائل بوجود المجرّد يعرّف العرض\
              \ بما كان صفة لغيره فإنّ الغير أعمّ من المتحيّز وغيره، ويقسّم الحادث إلى ما كان قائما بنفسه وهو الجوهر، فإن\
              \ لم يكن متحيّزا فهو المجرّد.والمتحيّز إمّا جسم أو جوهر فرد، وإلى ما لا يكون قائما بنفسه بل يكون صفة لغيره وهو\
              \ العرض. ويؤيده ما في الچلپي حاشية شرح المواقف من أنّ الراغب والغزالي قالا النفس الناطقة جوهر مجرد عن المادة\
              \ انتهى. فإنهما وصفا الجوهر بالمجرّد. فالمجرّد يكون قسما من الجوهر بلا واسطة لا من الحادث والله أعلم بحقيقة\
              \ الحال.فائدة: الجوهر الفرد لا شكل له باتفاق المتكلّمين لأنّ الشكل هيئة أحاطها حدّ أو حدود، والحدّ أي النهاية\
              \ لا يعقل إلّا بالنسبة إلى ذي النهاية فيكون هناك لا محالة جزءان. ثم قال القاضي ولا يشبه الجوهر الفرد شيئا من\
              \ الأشكال لأنّ المشاكلة الاتحاد في الشكل، فما لا شكل له كيف يشاكل غيره. وأمّا غير القاضي فلهم فيه اختلاف. فقيل\
              \ يشبه الكرة في عدم اختلاف الجوانب ولو كان مشابها للمضلع لاختلف جوانبه فكان منقسما. وقيل يشبه المربّع إذ يتركب\
              \ الجسم بلا انفراج إذ الشكل الكروي وسائر المضلعات وما يشبهها لا يتأتى فيها ذلك الانفراج. وقيل يشبه المثلّث لأنه\
              \ أبسط الأشكال.فائدة: الجواهر يمتنع عليها التداخل وإلّا يكون هذا الجسم المعيّن أجساما كثيرة وهذا خلف. وقال النّظّام\
              \ بجوازه. والظاهر أنه لزمه ذلك فيما قال من أنّ الجسم المتناهي المقدار مركّب من أجزاء غير متناهية العدد إذ لا\
              \ بدّ حينئذ من وقوع التداخل فيما بينها. وأمّا أنه التزمه وقال به صريحا فلم يعلم كيف وهو جحد للضرورة وإن شئت\
              \ الزيادة على هذا فارجع إلى شرح المواقف في موقف الجوهر.وتعريف الجوهر عند الحكماء الممكن الموجود لا في موضوع\
              \ ويقابله العرض بمعنى الممكن الموجود في موضوع أي محل مقوّم لما حلّ فيه. ومعنى وجود العرض في الموضوع أنّ وجوده\
              \ هو وجوده في الموضوع بحيث لا يتمايزان في الإشارة الحسّية كما في تفسير الحلول. وقال المحقق التفتازاني إنّ معناه\
              \ أنّ وجوده في نفسه هو وجوده في الموضوع، ولذا يمتنع الانتقال عنه. فوجود السّواد مثلا هو وجوده في الجسم وقيامه\
              \ به بخلاف وجود الجسم في الحيّز فإنّ وجوده في نفسه أمر ووجوده في الحيّز أمر آخر ولهذا ينتقل عنه.وردّ بأنّه يصح\
              \ أن يقال وجد في نفسه فقام بالجسم فالقيام متأخّر بالذات من وجوده في نفسه. وأجيب بأنّا لا نسلّم صحة هذا القول.كيف\
              \ وقد قالوا إنّ الموضوع شرط لوجود العرض ولو سلّم فيكفي للترتيب بالفاء التغاير الاعتباري كما في قولهم رماه فقتله.\
              \ إن قيل على هذا يلزم أن لا تكون الجواهر الحاصلة في الذهن جواهر لكونها موجودة في موضوع مع أنّ الجوهر جوهر سواء\
              \ نسب إلى الإدراك العقلي أو إلى الوجود الخارجي. قلت المراد بقولهم الموجود لا في موضوع ماهية إذا وجدت كانت لا\
              \ في موضوع، فلا نعني به الشيء المحصّل في الخارج الذي ليس في موضوع، بل لو وجد لم يكن في موضوع، سواء وجد في الخارج\
              \ أو لا، فالتعريف شامل لهما. ثم إنها أعراض أيضا لكونها موجودة بالفعل في موضوع ولا منافاة بين كون الشيء جوهرا\
              \ وعرضا، بناء على أنّ العرض هو الموجود في موضوع لا ما يكون في موضوع إذا وجدت فلا يشترط الوجود بالفعل في الجوهر\
              \ ويشترط في العرض. فالمركّب الخيالي كجبل من ياقوت وبحر من زيبق لا شكّ في جوهريته، إنّما الشكّ في وجوده. وفيه\
              \ بحث لأنّ هذا مخالف لتصريحهم بأنّ الجوهر والعرض قسما الممكن الموجود، وأنّ الممكن الموجود منحصر فيهما، فإذا\
              \ اشترط في العرض الوجود بالفعل ولم يشترط في الجوهر يبطل الحصر إذ تصير القسمة هكذا الموجود الممكن إمّا أن يكون\
              \ بحيث إذا وجد في الخارج كان لا في موضوع، أو يكون موجودا في الخارج في موضوع فيخرج ما لا يكون بالفعل في موضوع،\
              \ ويكون فيه إذا وجد كالسواد المعدوم. والحقّ أنّ الوجود بالفعل معتبر في الجوهر أيضا كما هو المتبادر من قولهم\
              \ الموجود لا في موضوع.وتفسيره بماهية إذا وجدت الخ ليس لأجل أنّ الوجود بالفعل ليس بمعتبر فيه بل الإشارة إلى أنّ\
              \ الوجود الذي به موجوديته في الخارج زائد على ماهية الجوهر والعرض كما هو المتبادر إلى الفهم. ولذا لم يصدق حدّ\
              \ الجوهر على ذات الباري تعالى لأنّ موجوديته تعالى بوجود هو نفس ماهيته، وإن كان الوجود المطلق زائدا عليها. وإلى\
              \ أنّ المعتبر في الجوهرية كونه بهذه الصفة في الوجود الخارجي، لا في العقل، أي أنه ماهية إذا قيست إلى وجودها الخارجي\
              \ ولوحظت بالنسبة إليه كانت لا في موضوع. ولا شكّ أن تلك الجواهر حال قيامها بالذهن يصدق عليها أنها موجودة في الخارج\
              \ لا في موضوع وإن كانت باعتبار قيامها بالذهن في موضوع فهي جواهر وأعراض باعتبار القيام بالذهن وعدمه وكذا الحال\
              \ في العرض.وبالجملة فالممتنع أن يكون ماهية شيء توجد في الأعيان مرة عرضا ومرة جوهرا حتى تكون في الأعيان تحتاج\
              \ إلى موضوع ما وفيها لا تحتاج إلى موضوع، ولا يمتنع أن يكون معقول تلك الماهية عرضا. وظهر بما ذكرنا أنّ معنى الموجود\
              \ لا في موضوع وماهية إذا وجدت كانت لا في موضوع واحد، كما أنّ معنى الموجود في موضوع وماهية إذا وجدت كانت في موضوع\
              \ واحد لا فرق بينهما إلّا بالإجمال والتفصيل. وهذا على مذهب من يقول إنّ الحاصل في الذهن هو ماهيات الأشياء. وأما\
              \ عند من يقول إن الحاصل في الذهن هو صور الأشياء وأشباهها المخالفة لها في الماهية، فلا تكون صور الجواهر عنده\
              \ إلّا أعراضا موجودة بوجود خارجي قائمة بالنفس كسائر الأعراض القائمة بها، هكذا حقّق المولوي عبد الحكيم في حاشية\
              \ شرح المواقف.التقسيم\nقال الحكماء: الجوهر إن كان حالّا في جوهر آخر فصورة إمّا جسمية أو نوعية. وإن كان محلا\
              \ لجوهر آخر فهيولى، وإن كان مركّبا منهما فجسم، وإن لم يكن كذلك أي لا حالا ولا محلا ولا مركّبا منهما، فإن كان\
              \ متعلقا بالجسم تعلّق التدبير والتصرّف والتحريك فنفس وإلّا فعقل. وإنما قيد التعلّق بالتدبير والتصرّف والتحريك\
              \ لأنّ للعقل عندهم تعلّقا بالجسم على سبيل التأثير، وهذا كلّه بناء على نفي الجوهر الفرد إذ على تقدير ثبوته لا\
              \ صورة ولا هيولى ولا المركّب منهما بل هناك جسم مركّب من جواهر فردة كذا في شرح المواقف."
