    step6_examples:
      sql_template: |-
        SELECT
            ex.entry_id,
            e.headword,
            d.key             AS dict_key,
            d.name_en         AS dict_name_en,
            d.name_ar         AS dict_name_ar,
            ex.idx,
            ex.type,
            ex.text           AS example_text,
            ex.attribution
        FROM examples ex
        JOIN entries e ON ex.entry_id = e.id
        JOIN dictionaries d ON e.dictionary_id = d.id
        WHERE e.headword_norm IN (?1, ?2)
        ORDER BY
            CASE ex.type
                WHEN 'quran'   THEN 1
                WHEN 'hadith'  THEN 2
                WHEN 'poetry'  THEN 3
                WHEN 'prose'   THEN 4
                WHEN 'usage'   THEN 5
                ELSE 6
            END,
            ex.idx;
      query_params: *id001
      result_count: 0
      examples: []
    step7_chronological:
      sql_template: "SELECT \n    e.id              AS entry_id,\n    e.dictionary_id,\n    e.headword,\n    e.headword_bare,\n\
        \    e.headword_norm,\n    e.root,\n    e.root_source,\n    e.pos,\n    e.form,\n    e.is_partial,\n    e.definitions_text,\n\
        \    e.translation_en,\n    e.translation_fr,\n    e.domain,\n    e.external_id,\n    d.key             AS dict_key,\n\
        \    d.name_ar         AS dict_name_ar,\n    d.name_en         AS dict_name_en,\n    d.source_type     AS dict_source_type,\n\
        \    d.period          AS dict_period,\n    d.author          AS dict_author,\n    d.death_year      AS dict_death_year\n\
        FROM entries e\nJOIN dictionaries d ON e.dictionary_id = d.id\nWHERE e.headword_norm IN (?1, ?2)\nORDER BY d.death_year\
        \ ASC NULLS LAST;"
      query_params: *id001
