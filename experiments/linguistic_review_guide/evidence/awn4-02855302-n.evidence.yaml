              text: 'الدَّرّ : كُلُّ حَجَرٍ يُسْتَخْرج منه شيءٌ يُنْتَفَع به. وقيل : النَّفِيس الذى تُتَّخذ منه الفُصوص ونحوُها'
              is_raw: 0
            - sense_index: 1
              text: 'substance (فى المنطق): ما قام بنَفْسِه , فهو مُتَقَوِّمٌ بذاتِه ومُتَعَيِّنٌ بماهيَّتِه , وهو المَقُولَةُ
                الأولى من مَقُولات أرسطو , وبه تقومُ الأعراضُ والكَيْفِيَّات, ويقابله العَرَضُ'
              is_raw: 0
            - sense_index: 2
              text: 'من الشيء: ما كانت عليه جِبلَّتُه'
              is_raw: 0
            examples:
            - idx: 0
              type: poetry
              text: ليْسَ من جَوْهَرِ الحديد مَصُوغًا / بَلْ من المَجْدِ نَصْلُه وجُفُونُه
              attribution: ابن الرُّومىّ
            - idx: 1
              type: poetry
              text: يا مَنْ تَوَهَّمْتُ أنَّ البَحْرَ راحتُهُ / جُودًا وأنَّ عَطايَاه جَواهِرُه
