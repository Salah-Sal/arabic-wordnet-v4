          - entry_id: 779313
            dictionary_id: 105
            headword: جَهَرَ
            headword_bare: جهر
            headword_norm: جهر
            root: جهر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '(جَهَرَ)(هـ) فِي صِفَتِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ «مَنْ رَآهُ جَهَرَه» أَيْ عَظُم
              في عَيْنه. يقال جَهَرت الرجُل واجْتَهَرتَه: إِذَا رأيتَه عَظِيم المَنْظر. ورجُل جَهِير: أَيْ ذُو مَنْظر. (هـ)
              وَمِنْهُ حَدِيثُ عُمَرَ رَضِيَ اللَّهُ عَنْهُ «إِذَا رأيْناكُم جَهَرْنَاكم» أَيْ أعْجَبَتْنا أجْسَامُكم .وَفِي
              حَدِيثِ خَيْبَرَ «وجدَ الناسُ بِهَا بَصَلا وثُوماً فَجَهَرُوه» أَيِ اسْتَخْرجوه وأكَلُوه. يُقَالُ جَهَرْت الْبِئْرَ
              إِذَا كَانَتْ مُنْدَفِنَة فأخْرجْتَ مَا فِيهَا.[هـ] وَمِنْهُ حَدِيثُ عَائِشَةَ تَصِفُ أَبَاهَا رَضِيَ اللَّهُ
              عَنْهُمَا «اجْتَهَر دُفُن الرَّوَاء» الاجْتِهَار:الاسْتِخْراج. وَهَذَا مَثَل ضَرَبَتْه لإِحْكامِه الأمْرَ بَعْد
              انْتِشَارِه، شَبَّهَتْه بِرَجُلٍ أتَى عَلَى آبَارٍ قَد انْدَفَنَ مَاؤُهَا فأخْرج مَا فِيهَا مِنَ الدَّفَن حَتَّى
              نَبَع الْمَاءُ.(س) وَفِيهِ «كلُّ أمَّتي مُعَافًى إِلَّا المُجَاهِرِين» هُم الَّذِينَ جَاهَرُوا بمَعَاصِيهم،
              وأظْهَرُوها، وكَشَفُوا مَا سَتَر اللَّهُ عَلَيْهِمْ مِنْها فَيَتَحدَّثون بِهِ. يُقال جَهَرَ، وأَجْهَر، وجَاهَرَ.وَمِنْهُ
              الْحَدِيثُ «وَإِنَّ مِنَ الإِجْهَار كَذا وَكَذَا» وَفِي رِوَايَةٍ «الجِهَار» وهُما بمعْنى المُجَاهِرة.وَمِنْهُ
              الْحَدِيثُ «لَا غِيبَةَ لِفَاسِق وَلَا مُجَاهِر» .وَفِي حَدِيثِ عُمَرَ رَضِيَ اللَّهُ عَنْهُ «أَنَّهُ كَانَ
              رجُلا مُجْهِرا» أَيْ صَاحِبَ جَهْر ورفْعٍ لصَوْته.يُقَالُ: جَهَرَ بِالْقَوْلِ: إِذَا رَفَعَ بِهِ صَوْتَه فَهُوَ
              جَهِير. وأَجْهَر فَهُوَ مُجْهِر: إِذَا عُرفَ بشِدّة الصَّوت. وَقَالَ الْجَوْهَرِيُّ: «رجُل مِجْهَر بِكَسْرِ
              الْمِيمِ: إِذَا كَانَ مِنْ عَادَتِه أَنْ يَجْهَرَ بِكَلَامِهِ» .(س) وَمِنْهُ الْحَدِيثُ «فَإِذَا امْرَأَةٌ جَهِيرَة»
              أَيْ عَالِيَةُ الصَّوت. وَيَجُوزُ أَنْ يَكُونَ مِنْ حُسْن المنْظر.(س) وَفِي حَدِيثِ الْعَبَّاسِ رَضِيَ اللَّهُ
              عَنْهُ «أَنَّهُ نادَى بصَوت لَهُ جَهُورِىٌّ» أَيْ شَدِيدٍ عَالٍ.وَالْوَاوُ زَائِدَةٌ. وَهُوَ مَنْسُوبٌ إِلَى
              جَهُور بصَوته.'
