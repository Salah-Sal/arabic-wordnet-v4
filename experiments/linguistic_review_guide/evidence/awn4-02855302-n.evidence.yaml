          - entry_id: 892995
            dictionary_id: 131
            headword: جهر
            headword_bare: جهر
            headword_norm: جهر
            root: جهر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              (جهر)الشَّيْء جَهرا علن وَظهر وبالكلام وَنَحْوه جَهرا وجهارا أعلنه وَفِي التَّنْزِيل الْعَزِيز {وَإِن تجْهر بالْقَوْل فَإِنَّهُ يعلم السِّرّ وأخفى} وَيُقَال جهر الْكَلَام فَالْكَلَام وَنَحْوه جهير وَهُوَ جهير الصَّوْت وَالشَّيْء رَآهُ بِلَا حجاب وحزره وَقدره وَالشَّمْس فلَانا حيرت بَصَره مِنْهَا فَلم يبصر وَالْأَرْض سلكها من غير معرفَة والجيش وَالْقَوْم كَثُرُوا فِي عينه وَالشَّيْء فلَانا عظم فِي عينه وراعه جماله وهيئته وَفِي حَدِيث عَليّ فِي صفته صلى الله عَلَيْهِ وَسلم (لم يكن قَصِيرا وَلَا طَويلا وَهُوَ إِلَى الطول أقرب من رَآهُ جهره) وَفُلَان الْبِئْر نقاها من الحمأة ونزحها وحفرها حَتَّى بلغ المَاء والسقاء مخضه واستخرج زبده وَالْقَوْم صبحهمْ على غرَّة
              (جهر) الْإِنْسَان وَغَيره جَهرا تحير بَصَره من الشَّمْس فَلم يبصر وَيُقَال جهرت الْعين وَفُلَان جحظت عينه وحول حولا مليحا وَالْفرس غشت غرته وَجهه وَالْإِنْسَان جهورة وجهارة تمّ جِسْمه وَحسن منظره فَهُوَ أَجْهَر وَهِي جهراء (ج) جهر
              (جهر) الصَّوْت جهورة وجهارة ارْتَفع وَفُلَان تمّ جِسْمه وَحسن منظره فَهُوَ جهير
            translation_en: null
            translation_fr: null
            domain: null
