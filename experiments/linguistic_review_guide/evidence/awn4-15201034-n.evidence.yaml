    - entry_id: 810223
      dictionary_id: 116
      headword: شهر
      headword_bare: شهر
      headword_norm: شهر
      root: شهر
      root_source: camel
      pos: null
      form: null
      is_partial: 0
      definitions_text: '[شهر] نه: فيه: صوموا "الشهر" وسره، الشهر الهلال لشهرته وظهوره أي صوموا أول الشهر وأخره، وقيل: سره
        وسطه. ومنه: "الشهر" تسع وعشرون، أي أن فائدة ارتقاب الهلال ليلة تسع وعشرين ليعرف نقص الشهر قبله، وإن أريد به الشهر
        نفسه يكون اللام للعهد. ن: أي هذا الشهر كذلك أو قد يكون كذلك، وقد يتواتر في شهرين وثلاثة وأربعة لا أكثر. ك: أي الشهر
        المعهود المحلوف عليه. نه: أي الصوم أفضل بعد شهر رمضان؟ فقال: "شهر" الله المحرم، أضيف إليه تفخيمًا له. وفيه: "شهرًا"
        عيد لا ينقصان، أي شهر رمضان وذو الحجة، أي إن نقص عددهما في الحساب فحكمهما على التمام لئلا تخرج أمته إذا صاموا تسعة
        وعشرين، أو وقع حجهم خطأ عن التاسع أو العاشر لم يكن عليهم قضاء ولم يقع في نسكهم نقص وهو أشبه ما ذكر فيه - ويتم في ن.
        غ: فإذا انسلخ "الأشهر" الحرم كانت عشرًا من ذي الحجة إلى عشر من ربيع الأخر لأن البراءة وقعت في يوم عرفة. نه: من لبس
        ثوب "شهرة" ألبسه الله تعالى ثوب مذلة، الشهرة ظهور الشيء في شنعة حتى يشهره الناس. ط: أراد ما يحل لبسه، أو ما يقصد به
        التفاخر والتكبر أو ما يتخذه المساخر ليجعل ضحكة أو ما يرا أي به كناية بالثوب عن العمل، والثاني أظهر لترتب إلباس ثوب
        مذله عليه. ج: هو الذي إذا لبسه أحد افتضح به واشتهر، والمراد ما لا يحل وليس من لباس الرجل. ش: نهى عن "الشهرتين" وهما
        الفاخر من اللباس المرتفع في غاية والرذل الدنئ في غاية. نه: ومنه ح عائشة رضي الله عنها: خرج أبي "شاهرًا" راكبًا راحلته،
        أي يوم الردة أي مبرزًا له من غمده. وح: من "شهر" سيفه ثم وضعه فدمه هدر، أي من أخرجه من غمده، ووضعه أي ضرب به. وفيه:
        وما تتلو السفاسرة "الشهور"؛ أي العلماء، جمع شهر. غ: و"الشهرة" الفضيحة.'
      translation_en: null
      translation_fr: null
      domain: null
      external_id: haw:21:2221
