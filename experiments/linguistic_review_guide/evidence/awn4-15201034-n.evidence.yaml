      dictionary_id: 117
      headword: الشهر
      headword_bare: الشهر
      headword_norm: الشهر
      root: شهر
      root_source: camel
      pos: null
      form: null
      is_partial: 0
      definitions_text: 'الشهر: الهلال الذي شأنه أن يدور دورة من حين يهل إلى أن يهل ثانيا، سواء كان ناقصا أم كاملا، فهو شائع
        في فردين متفاوتي العدد، ذكره الحرالي. وقال أبو البقاء: الشهر المشتهر أو المشهور، وأصله الإظهار والكشف، فهذا الزمان
        لاشتهاره سمي شهرا، أو هو ما بين الهلالين.'
