    - entry_id: 841824
      dictionary_id: 128
      headword: اسطريون
      headword_bare: اسطريون
      headword_norm: اسطريون
      root: null
      root_source: null
      pos: null
      form: null
      is_partial: 0
      definitions_text: 'اسطريون: وفي نسخة اسطرنيون: اسم شهر يقول الإدريسي (باب 6 فصل 1) في كلامه عن المحيط: وأيام سفرهم فيه
        أيام قلائل وهي مدة شهر اسطريون وشهر اوسو. وعند جريجوريو (48) أن اسم الشهر الذي ترك الناشر مكانه بياضا هو اسطزيون.
        وكتب إلى أماري يقول: إنه يرى أن هذه اللفظة تحريف ((سبتمبر)) أو لعلها تحريف الكلمة اليونانية اوتبزيون ( otbesion) وفي
        هذه الحالة نجد من الغريب أن الادريسي قد كتب سبتمبر بدل تموز (جولاى) إذ أن شهر اوسر هو أوت (آب).'
      translation_en: null
