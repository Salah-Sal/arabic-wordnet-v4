            headword: قاعدةُ السجلاّت
            headword_bare: قاعدة السجلات
            headword_norm: قاعدة السجلات
            root: قعد
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: قاعدةُ معطياتٍ تراتبيةٍ مركزيةٍ في Windows 95 وWindows NT، تُستخدَمُ لتخزين المعلومات اللازمةِ
              لتشكيلِ configure النظامِ لمستخدِمٍ (أو أكثر) وتطبيقات وتجهيزات عتادية. تحتوي قاعدةُ السجلات على معلومات (مثل
              لاحات profiles المستخدِمين)، وعلى التطبيقات المرساة في الحاسوب، وأنواع الوثائق التي تستطيع إنشاءها، وإعدادات
              صفحة خاصيات المصنّفاتِ folders وقُوَنِ icons التطبيقات، والعتاديات المتوفرة في النظام، والمنافذ المستخدمة، التي
              يعود إليها كلٌّ من Windows 95 وWindows NT خلال العمل. حلّتْ قاعدةُ السجلات محلَّ ملفاتِ (ini.) النصيّة المستخدمة
              في Windows 3.X، ومحلَّ ملفاتِ التشكيل في MS-DOS، مثل AUTOEXEC.BAT وCONFIG.SYS. ومع أن قاعدةَ السجلات في Windows
              95 مماثلةٌ لتلك المستخدَمةِ في Windows NT، فإن هناك بعض الفروق، مثل كيفية تخزينهما على القرص.
