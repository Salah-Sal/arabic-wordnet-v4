          - entry_id: 377505
            dictionary_id: 55
            headword: قاعدة العكس
            headword_bare: قاعدة العكس
            headword_norm: قاعدة العكس
            root: قعد
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: تُستخدم قواعد العكس في تحويل تعبيرٍ ما من مُعاملات العلاقة المنطقية (و) AND والعلاقة المنطقية
              (لا) NO، إلى تعبير من مُعاملات العلاقة المنطقية (أو) OR والعلاقة المنطقية (لا) NO، وبالمثل يُمكنُ استخدامها
              أيضاً في تحويل تعبير من العلاقة المنطقية OR والعلاقة المنطقية NO إلى تعبير من العلاقة المنطقية And والعلاقة
              المنطقية NO. وتُتيحُ هذه القواعد عكس الدوائر الكهربية، بحيث يُمكن على سبيل المثال استخدام مُلامسات الغلق بدلاً
              من [أزرار المبادل المفتوحة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=93324)، أو بحيثُ
              يُمكن تركيبُ دوائر منطقية باستخدام مُكوّنات بوابة العلاقة المنطقية NAND والعلاقة المنطقية NOR فقط. كما يُمكن
              لإجراء عملية العكس، إجراء عملية نفي مُزدوج.
            translation_en: Formel
            translation_fr: règle (f.) d’inversion
            domain: Electrical Engineering
            external_id: arabterm:93199
