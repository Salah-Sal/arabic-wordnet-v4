            headword_norm: قاعدة الهرم
            root: قعد
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'مصطلح وضعاه ( Stuart HartوC. K. Prahalad) من مركز المشروعات المستدامة وتم نشره وشاع عبر كتاب
              براهالاد: الثروة في أسفل الهرم. وهو كتاب يهم أشد الناس فقرا في العالم. هؤلاء الناس يميلون إلى دفع المزيد من
              أجل نفس الطعام، والمنتجات، والاقتراض من الأغنياء، وعادة ما يعانون من نقص في العرض والخدمات. وخلافا لمعظم التوقعات،
              فإنهم نظرا لأعدادهم، يمثلون سوقا ضخمة إذا توفرت المنتجات والخدمات بأسعار معقولة بالنسبة لهم.'
