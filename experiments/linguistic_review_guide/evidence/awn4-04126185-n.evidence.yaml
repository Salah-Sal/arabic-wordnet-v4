          - entry_id: 358329
            dictionary_id: 60
            headword: قاعدة بيانات مشتركة للمناطق المعينة أو قاعدة البيانات الأوروبية المشتركة للمناطق المعينة (CDDA أو ECCDA)
            headword_bare: قاعدة بيانات مشتركة للمناطق المعينة أو قاعدة البيانات الأوروبية المشتركة للمناطق المعينة (CDDA
              أو ECCDA)
            headword_norm: قاعدة بيانات مشتركة للمناطق المعينة او قاعدة البيانات الاوروبية المشتركة للمناطق المعينة (CDDA
              او ECCDA)
            root: قعد
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'لقد قام كل من وكالة البيئة الأوروبية، والمركز العالمي لرصد الحفظ التابع لبرنامج الأمم المتحد
              للبيئة ومجلس أوروبا بضم جهودهم في إجراءات لتقاسم المعلومات الواردة في قاعدة البيانات الأوروبية المشتركة للمجالات
              المعينة والتي يرمز لها ECDDA. قاعدة البيانات الأوروبية المشتركة للمجالات المعينة (ECDDA): تضم المعلومات التي
              أبلغت عنها البلدان والتي تنشر من قبل الوكالة الأوروبية للبيئة، وسوف تكون جزءا من (نظام المعلومات حول الطبيعة
              الأوروبية EUNIS). وتغطي هذه المعلومات كامل المنطقة الجغرافية لأوروبا وكامل المنطقة الجغرافية التي تحت مسؤولية
              الدول الأوروبية، وكذلك الدول الأخرى والأراضي المرتبطة بالمبادرات الرئيسية في المنطقة الأوروبية. تغذي ECDDA قاعدة
              البيانات العالمية للمناطق المحمية التي يديرها المركز العالمي لرصد حفظ الطبيعة التابع لبرنامج الأمم المتحدة للبيئة
              (UNEP / WCMC)، وذلك عبر تقارير الدول الأوروبية والمساهمة في مجموعات البيانات على المستويين الأوروبي والعالمي
              على حد سواء.'
            translation_en: common database on designated areas or european common database on designated areas (cdda or eccda)
            translation_fr: base de données commune sur les zones désignées ou base de données européenne commune sur les
              zones désignées (cdda ou eccda)
            domain: Climate, Environment and Solid Waste management
            external_id: arabterm:69320
            dict_key: arabterm_arabterm_climate_environment
