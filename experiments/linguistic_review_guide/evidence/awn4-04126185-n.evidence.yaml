      headword: 'البَقْس؛ الشَّمشاد: شُجيرة دائمة الخضرة.in a box : في مأزق أو ورطة.to box in : يَحْجُز [في رقعة ضيّقة].to
        box off : يَقْسِم إلى مقصورات أو حُجيرات ضيّقة.to boxup : (1) يحجز: يمنع من الخروج (2) يَلْزَم الهدوء. (1) «أ» صُندوق؛
        عُلبة. «ب» مَقْعَد الحُوْذيّ: مَقْعد سائق العربة في عَرَبته (2) قيثارة؛ غيتار (ع) (3) record player (ع) (4) هدية في
        علبة (بر) (5) مقصورة [في مسرح أو حافلة من حافلات السكة الحديدية] (6) حَظيرة؛ قَفَص [للشهود أو المحلَّفين في محكمة]
        (7) زريبة [لفرسٍ في إصطبل أو عربة] (8) «أ» كوخ. «ب» كُشْك (9) الصُّندوق: تجويف واقٍ (مك) (10) «أ» جهاز إشارة. «ب»
        جهاز تلفزيون (11) الإطار: نبذة منضَّدة ضمن إطار (صح) (12) مأزق (13) المَهْبِل (ع) (14) يُصَنْدِق: .أ» يصون بصُنْدوق
        (مك). .ب» يُعبِّئ في صندوق (15) يُؤَطِّر: يضع ضمن إطار. (1) لَكْمة. وبخاصة: على الأذن (2) .أ» يَلْكُم. .ب» يُلاكم
        (3) يتلاكم. '
