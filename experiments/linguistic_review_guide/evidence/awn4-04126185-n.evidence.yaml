          - entry_id: 532175
            dictionary_id: 92
            headword: قاعدة معطيات علاقاتية
            headword_bare: قاعدة معطيات علاقاتية
            headword_norm: قاعدة معطيات علاقاتية
            root: قعد
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'قاعدةُ معطيات أو نظامُ إدارةِ قاعدة معطيات يخزِّنُ المعلومات في جداول (أسطر وأعمدة معطيات)،
              ويُجري بحوثاً باستخدام المعطيات الموجودة في أعمدة معيّنة في جدول، للعثور على معطيات إضافية موجودة في جدول آخر.
              في قاعدة معطيات علاقاتية، تمثِّلُ أسطرُ الجدول التسجيلات records (وهي جَمْعَاتُ معلوماتٍ عن بنودٍ منفصلة) وتمثِّلُ
              الأعمدةُ الحقولَ (صفات محددة من التسجيلة). وفي إجراء البحوث، تُطابقُ قاعدةُ معطياتٍ علاقاتيةٍ المعلوماتِ من
              أحدِ حقول جدولٍ ما مع المعلومات المقابلة في جدول آخر، فيَنتجُ جدولٌ ثالثٌ يَجمعُ المعطياتِ المطلوبةَ من الجدولين.
              فمثلاً، إذا كان أحدُ الجدولين يحوي الحقولَ: EMPLOYEE-ID، وLAST-NAME، وFIRST-NAME، وHIRE-DATE، ويحوي جدولٌ آخر
              الحقولَ: DEPT، وEMPLOYEE-ID، وSALARY، أمكن لقاعدة المعطيات العلاقاتية مطابقة الحقلين EMPLOYEE-ID في الجدولين
              للعثور على أسماء الموظفين الذين يتقاضون معاشاً محدداً، أو الأقسام التي يعمل فيها الموظفون المعيَّنون بعد تاريخ
              معيّن. وبعبارة أخرى، تَستخدِمُ قاعدةُ معطيات علاقاتية القيمَ المتطابقةَ بين جدولَين لربطِ المعلومات المتوافقة
              فيهما. إن قواعدَ المعطيات المطوّرة للحواسيب الصغرية هي عادةً من النوع العلاقاتي.'
            translation_en: relational database
            translation_fr: null
