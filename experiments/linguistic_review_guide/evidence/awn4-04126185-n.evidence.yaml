      - entry_id: 371764
        dictionary_id: 52
        headword: مركبة ذات محرك
        headword_bare: مركبة ذات محرك
        headword_norm: مركبة ذات محرك
        root: ركب
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: 'المركبات ذات المحركات هي مركبات مُعدة للسير على الطرق، وقد تكون أحادية أو ثنائية المسار، وهي تتحرك
          بفعل [القوة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91801) الذاتية. كما أنها ليست مُقيدة
          بالسير على قضبان، وتُستخدم لنقل الركاب والبضائع. وتُفرّق المواصفة القياسية الألمانية DIN 700 10 بين كل من الدراجات
          الآلية (الموتوسيكلات) و[السيارات](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=78130) والجرارات
          والقطارات. وتشمل المركبات ذات المحركات على سبيل المثال: سيارات الركوب مثل سيارات الليموزين والكومبي والكوبيه والسيارات
          الرياضية الخ، وكذلك المركبات التجارية مثل الحافلات والشاحنات والمركبات الخاصة. وتخدم هذه المركبات الخاصة تبعاً لتصميماتها
          وطرازاتها وتجهيزاتها نقل الرُكاب أو حمولات معينة أو أداء أعمال معينة، فمنها على سبيل المثال سيارات الإسعاف والأوناش
          وسيارات المطافئ.'
        translation_en: motor vehicle / car / automobile
        translation_fr: véhicule [m.], automobile [f.]
        domain: Automotive Engineering
        external_id: arabterm:87458
        dict_key: arabterm_arabterm_automotive_engineering
