      - entry_id: 371776
        dictionary_id: 52
        headword: مصفاة الفلتر
        headword_bare: مصفاة الفلتر
        headword_norm: مصفاة الفلتر
        root: صفو
        root_source: lane
        pos: null
        form: null
        is_partial: 0
        definitions_text: 'هي فلتر خشن دقيق الترشيح، يُستخدم لفلترة جسيمات الاتساخ والحتات الناتج من الوحدات من دوائر السوائل
          والغازات، وتحدث الفلترة من خلال شبيكة سلكية معدنية ملفوفة على شكل أسطواني ومحاطة بإطار من شرائح صفائحية. ويمكن تصنيع
          مصفاة الفلتر من البلاستيك أيضاً، كما يمكن تنظيفها وإعادة استخدامها. وحتى تلتصق جسيمات الاتساخ بالشبكة المعدنية على
          نحو أفضل يُمكن تبليلها بالزيت، (انظر: فلتر الهواء المُبلل).'
        translation_en: filter screen
        translation_fr: tamis [m.]
        domain: Automotive Engineering
