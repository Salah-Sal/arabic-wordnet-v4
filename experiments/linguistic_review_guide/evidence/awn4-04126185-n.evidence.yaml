            pos: null
            form: null
            is_partial: 0
            definitions_text: 'مختصره: OODB. قاعدةُ معطياتٍ مرنة تدعم استخدام أنواع معطيات وأغراض وصفوف مجردة، يمكِنها أن
              تخزِّنَ طيفاً واسعاً من المعطيات، تتضمّن غالباً الصوتَ والفيديو والبيانيات إضافةً إلى النصوص والأعداد. وتتيح
              بعضُ قواعد المعطيات الغرضية التوجّه إجراءات وقواعد لاستحضار المعطيات المراد خزْنها على التوازي مع المعطيات الأصلية
              أو بدلاً عنها، وهذا ما يسمح بتخزين المعطيات في مناطق أخرى غير قاعدة المعطيات، وهذا مرغوب فيه غالباً عندما تكون
              ملفات المعطيات كبيرة، كما هي الحال في ملفات الفيديو.'
