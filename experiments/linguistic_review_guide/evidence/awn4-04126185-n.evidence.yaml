          - entry_id: 533534
            dictionary_id: 92
            headword: خلفيّ
            headword_bare: خلفي
            headword_norm: خلفي
            root: خلف
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'في سياق الإجرائياتِ أو المهماتِ التي هي جزءٌ من نظام التشغيل أو برنامج: تشغيلٌ دون تفاعلٍ مع
              المستخدِم أثناء عملِه في مهمةٍ أخرى. تُسند إلى الإجرائيات والمهمات الخلفيةِ أفضلياتٌ دنيا مقارنةً بالمهمات الوجهيةِ
              عند توزيعِ الحصص الزمنيةِ للمعالِجِ الصغري، وتَبقى المهماتُ الخلفيةُ، عموماً، غيرَ مرئيةٍ للمستخدم إلا إذا حَدَّثَها
              أو جَلَبها إلى الأمام. إنّ أنظمةَ التشغيل المتعددةِ المهمات، عموماً، هي وحدها القادرةُ على تَقبِّل المعالجةِ
              الخلفية. ومع ذلك، فإنّ بعضَ أنظمةِ التشغيل غيرِ المتعددةِ المهمات يمكِنها إنجازُ نوعٍ أو أكثرَ من المهمات الخلفية.
              فمثلاً، في نظامِ تشغيلِ Apple Macintosh يَعملُ مع توقُّفِ تعدديةِ المهمات، يمكِن استخدامُ خيارِ الطباعةِ الخلفية
              لطباعةِ وثائقَ أثناءَ قيامِ المستخدِمِ بعملٍ آخر.'
