          - entry_id: 359555
            dictionary_id: 60
            headword: قاعدة 90
            headword_bare: قاعدة 90
            headword_norm: قاعدة 90
            root: قعد
            root_source: lane
            pos: null
            form: null
            is_partial: 0
            definitions_text: نظام ترقيم منهجي أنشأته في الأصل شركة دو بونت للكيماويات في أوائل الثلاثينيات من القرن العشرين،
              والذي يمثل حاليا الطريقة المعيارية لتسمية مركبات الكربون الكلورية فلورية (CFCs). أعطيت لمركبات كربون كلورية
              فلورية، مثلا (الميثان التنائي الكلور التنائي الفلور (dichlorodifluoromethane (CCl2F2)، والكربون الثلاثي الكلور
              الأحادي الفلور(trichlorofluorocarbon (CCl3F)، الأسماء المستعارة CFC-12 و CFC-11. من أجل استخلاص التركيب الكيميائي
              للمركبات من الاسم الشائع (المستعار) لها، يتم تطبيق قاعدة 90 عبر إضافة 90 إلى الرقم في نهاية الاسم المستعار.
              في حالة CFC-12، إضافة (90 + 12) تؤدي إلى الحصول على 102. رقم المئات، وهو واحد في هذا المثال، يمثل عدد ذرات الكربون
              في الجزيء. مكان العشرات، 0، يمثل عدد ذرات الهيدروجين في الجزيء، ويمثل مكان الوحدات عدد ذرات الفلور في الجزيء.
              وفقا لقاعدة 90، فإن CFC-12 لديها 1 ذرة كربون، 0 ذرات الهيدروجين، و2 ذرات الفلور. الجانب الأخير من قاعدة 90 يتعلق
              بكون الكربون يشكل بالضرورة أربعة روابط.
            translation_en: rule of 90
            translation_fr: règle de 90
            domain: Climate, Environment and Solid Waste management
            external_id: arabterm:70546
            dict_key: arabterm_arabterm_climate_environment
