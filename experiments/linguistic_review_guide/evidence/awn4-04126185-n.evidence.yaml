      - entry_id: 371781
        dictionary_id: 52
        headword: فلتر هواء بحمام زيتي
        headword_bare: فلتر هواء بحمام زيتي
        headword_norm: فلتر هواء بحمام زيتي
        root: null
        root_source: null
        pos: null
        form: null
        is_partial: 0
        definitions_text: في منظومات الفرامل الهوائية هو فلتر خاص بالضاغط. وتتمثل وظيفته في منع تسرّب الاتساخات التي يحتوي
          عليها الهواء المسحوب إلى داخل ضاغط الهواء. كما يمكن أن يعمل هذا الفلتر باعتباره [فلتر تصريف هواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91538)
          في الوحدات الخاصة بدوائر هواء الضغط، وباعتباره مُخمّداً للأصوات. ويُستخدم هذا الفلتر كذلك لأغراض الحماية من الهواء
          المُحمّل بأتربة، حيث يُمرر الهواء المسحوب على السطح الخارجي لحمام الزيت، ومن ثم يُحوّل اتجاهه ويُمرّر عبر فلتر المصفاة
          السلكية. وتلتصق جُسيمات الأتربة الكبيرة بحمام الزيت، أمّا الجُسيمات الأخرى فيحتويها فلتر المصفاة السلكية المُبلل
          بالزيت. ولذلك يجب تنظيف فلتر الهواء ذي الحمام الزيتي بانتظام، وإعادة ملئه بزيت جديد.
        translation_en: oil bath air cleaner
        translation_fr: filtre à air à bain d'huile [m.]
        domain: Automotive Engineering
        external_id: arabterm:87475
        dict_key: arabterm_arabterm_automotive_engineering
