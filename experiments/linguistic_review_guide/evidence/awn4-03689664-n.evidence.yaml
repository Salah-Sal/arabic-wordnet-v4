            form: null
            is_partial: 0
            definitions_text: 'اسم لأكثر من واحدة , أشهرهن : آمنة أمّ النبىّ صلى الله عليه وسلم (نحو ٤٥ ق . هـ = ٥٧٥ م) وهى
              آمنة بنتُ وَهْب ابن عبد مناف بن زُهْرة بن كلاب , وأمّها بَرّة بنت عبد العُزّى بن عثمان بن عبد الدار بن قُصىّ
              ابن كلاب , مات عنها زوجُها قبل ولادته عليه الصلاة والسلام , وتوفيت بالأبواء ( موضع بين مكة والمدينة ) وكان عُمر
