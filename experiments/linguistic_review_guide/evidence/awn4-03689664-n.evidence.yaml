    - entry_id: 372009
      dictionary_id: 52
      headword: حلقة القطع
      headword_bare: حلقة القطع
      headword_norm: حلقة القطع
      root: حلق
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: هي حلقة معدنية مُصلدة توجد في الوصلات الطرفية والوصلات الملولبة. وتتمثل وظيفتها في إحكام قارنات الخطوط
        الأنبوبية بالأنظمة البنيوماتية والهيدرولية ضد الضغط، وذلك من خلال انزلاقها مع الحد القاطع على امتداد المخروط الداخلي
        للخانق الملولب عند إحكام ربط صامولة 'اليونيون'. ونتيجةً لشكل المخروط الداخلي، فإن حلقة القطع تتخذ الشكل المُستدق إلى
        أن تستقر على السطح الخارجي للوصلة الأنبوبية. وفي مرحلة [الربط النهائي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91737)
        يقوم الحد القاطع بقطع شفة واضحة وصولاً إلى السطح الخارجي للوصلة الأنبوبية.
      translation_en: cutting ring
      translation_fr: bague-taraud [f.]
      domain: Automotive Engineering
      external_id: arabterm:87703
