            definitions_text: '(زنق) - في حديث أبي هريرة: "أنّه ذكر المَزْنُوق فقَال: هو المائِلُ شِقُّه لا يَذكُر الله تعَالَى"من
              الزَّنَقَة؛ وهي مَيْل في جِدارٍ في سِكَّة أو عُرقوب وادٍ.- ومنه حديث أبي ثَوْر عن عُثْمان : "أَنَّه عليه الصّلاة
              والسّلام قال: "مَن يَشتَري هذِه الزَّنَقَة فَيزِيدُهَا في المَسْجِد؟ " أورده أبو عَرُوبة، وزِناقُ الفَرسِ: حَلْقَة
              في الجُلَيْدة تحت حَنَكه الأسفَل يُجعَل فيها خَيطٌ يُشَدُّ برأسِه يُمِيله ليَنْقَادَ. كأنه معرب زنه.'
