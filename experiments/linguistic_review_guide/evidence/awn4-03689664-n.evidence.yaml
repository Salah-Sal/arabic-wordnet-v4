            definitions_text: 'صملصَمَلَ بالعَصَا، صَمْلاً: ضَرَبَ، عَن أبي عَمْرٍ و، وأَنْشَدَ: هِراوَةٌ فِيهَا شِفَاءُ الْعَرِّ
              صَمَلْتُ عُقْفَانَ بهَا فِي الْجَرِّ فَبُجْتُهُ وأَهْلَهُ بِشَرِّ الْجَرُّ: سَفْحُ الجَبَلِ، وبُجْتُهُ: أَصَبْتُهُ
              بِهِ. وقالَ اسُّلَمِيُّ: صَقَلَهُ بالْعَصَا، وصَمَلَهُ: إِذا ضَرَبَه بهَا.وصَمَلَ الشّيْءَ، يَصْمُلُ، صَمْلاً،
              وصُمُولاً: صَلُبَ، واشْتَدَّ، وأَكْثَرَ مَا يُوصَفُ بِهِ الجَمَلُ والْجَبَلُ والرَّجُلُ، قَالَ رُؤْبَةُ: عَن
              صامِلٍ عاسٍ إِذا مَا اصْلَخْمَما يصِفُ الجَبَلَ. وصَمَلَ السِّقَاءُ، والشَّجَرُ، صَمْلاً فهوَ صَمِيلٌ، وصَامِلٌ:
              يَبِسَ، وقيلَ: إِذا لمْ يَجِدْ رِيّاً فَخَشُنَ، قالتْ زَيْنَبَ تَرْثِي أَخَاها يَزِيدَ بنَ الطَّثَرِيَّةِ:(تَرَى
              جازِرَيْهِ يُرْعَدَانِ ونَارُهُ ... عَلَيْهَا عَدامِيلُ الْهَشِيمِ وصَامِلُهْ) والعُدْمُولُ: القَدِيمُ، تقولُ:
              على النَّارِ حَطَبٌ يابِسٌ. وأَنْشَدَ ابنُ بَرِّيٍّ، لأبي السَّوْداءِ العِجْلِيِّ:(ويَظَلُّ ضَيفُكَ يَا ابْنَ
              رَمْلَةَ صَامِلاً ... مَا إِنْ يَذُوقُ سِوَى الشَّرابِ عَلُوسَا)وصَمَلَ عَنِ الطَّعامِ: كَفَّ عَنْهُ، كَما فِي
              العُبابِ. والصَّامِلُ، والصَّمِيلُ: الْيابِسُ، عَن ابنِ دُرَيْدٍ، وَقد تقدَّمَ شاهِدُهُ قَرِيباً، وقالَ اللَّيْثُ:
              الصَّمِيلُ: السّقاءُ اليابِسُ، وأَنْشَدَ:(إِذَا ذادَ عَن ماءِ الْفُراتِ فَلَنْ تَرَى ... أَخا قِرْبَةٍ يَسْقِي
              أَخاً بِصًمِيلِ)والصِّمْلِيلُ، بالكَسْرِ: نَبْتٌ، قالَ ابنُ دُرَيْدٍ: لَا أَقِفُ عَلى حَدِّهِ، وَلم أَسْمَعْهُ
              إِلاَّ مِنْ رَجُلٍ من جَرْمٍ قَدِيما، قالَ: وأَمَّا الرَّجُلُ الضَّعِيفُ البِنْيَةِ، فيُقالُ لهُ: صِمْلِيلٌ،
              عَرَبِيٌّ فَصِيحٌ. واصْمَأَلَّ الشَّيْءُ، بالهَمْزِ، اصْمِئْلاَلاً: اشْتَدَّ. واصْمَأَلَّ النَّبْتُ: الْتَفَّ.
              والْمُصْمَئِلَّةُ: الدَّاهِيَةُ، عَن أبي زَيْدٍ، وأنْشَدَ لِلْكُمَيْتِ:(وَلم تَتَكأَّدْهُمُ المُعْضِلاتُ ... وَلَا
              مُصْمَئِلَّتُها الضِّئْبَلُ)وصَوْمَلَ الرَّجُلُ: جَفَّ جِلْدُهُ جُوعاً وضُرّاً، عَن اللَّيْثِ. قَالَ: والصَّوْمَلُ:
              شَجَرٌ بالْعالِيَةِ.والصُّمُلُّ، كعُتُلٍّ: الرَّجُلُ الشَّدِيدُ الْخَلْقِ، العَظِيمُ، وَكَذَلِكَ مِنَ الإِبِلِ
              والجِبالَ، والأُنْثَى صُمُلَّةٌ، وَفِي الحَدِيثِ: أَنْتَ رَجُلٌ صُمُلٌّ. وممّا يُسْتَدْرَكُ عَلَيْهِ: الصَّامِلُ:
              السِّقاءُ الْخَلَقُ، عَن اللَّيْثِ. ويُقالُ:) صَمَلَ بَدَنُهُ وبَطْنُهُ، وأَصْمَلَهُ الصِّيامُ: أيبَسَهُ، وَفِي
              حديثِ مُعاوِيَةَ: إِنَّها صَمِيلَةٌ، أَي فِي سَاقِها يُبْسٌ وخُشُونَةٌ. والصَّمِيلُ، كأَمِيرٍ: الْعَصا، يَمانيَّةٌ.
              والصُّمُلَّةُ، كعُتُلَّةٍ: الْعَصَا، قالَ المُنَخَّلُ اليَشْكُرِيُّ:(يُطوّفُ بِي عِكَبٌّ فِي مَعَدٍّ ... ويَضْرِبُ
              بالصُّمُلَّةِ فِي قَفَيَّا)والمُصْمَئِلُّ: المُنْتَفِخُ مِنَ الْغَضَبِ، وقالَ أَبُو زَيْدٍ: هُوَ الشَّدِيدُ
              من الأُمورِ. ورَجُلُ صُمُلٌّ، كعُتُلٍّ: شَدِيدُ البَضْعَةِ، مُجْتَمِعِ السِّنِّ، عَن الزَّمَخْشَرِيِّ. وق سَمَّوْا
              صَمِيلاً، كَأَمِيرٍ، مِنْهُم الصَّمِيلُ بنُ حاتِمِ بنِ شَمِرٍ بنِ ذِي الجَوْشَنِ الضَّبابِيُّ، وقيلَ: بل حاتِمِ
              بنِ عَمْرِو بنِ جُنْدُعِ بنِ شَمِرٍ، كانَ أَمِيراً بالأَنْدَلُسِ، وابنُهُ هُذَيْلُ بنُ الصَّمِيلِ، قَتَلَهُ
              الدَّاخِلُ. وممّا يُسْتَدْرَكُ عَلَيْهِ:'
