      - entry_id: 371760
        dictionary_id: 52
        headword: سلوك الغليان
        headword_bare: سلوك الغليان
        headword_norm: سلوك الغليان
        root: سلك
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: يتكوّن [وقود محركات أوتّو](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87494)
          من مخاليط من حوالي 200 مادة مختلفة من المواد الهيدروكربونية، ولهذا لا تكون له نقطة غليان معينة، وإنما نطاق لنقاط
          الغليان يعبر عنه بمُنحنى نقاط الغليان فقط. ويقع هذا المنحنى بين 30 °س و210 °س، وهو مقياس 'لتذرّر' الوقود، حيث يعرض
          النسبة الحجمية لناتج بخر الوقود، عند درجة حرارة مُعينة. وتنص المواصفات على درجة حرارة غليان أعلى في فصل الصيف منها
          في فصل الشتاء، وذلك لتقليل الفواقد الناتجة عن البخر. ويمكن استنتاج سمات السلوك التشغيلي للوقود من مُنحنى نقاط الغليان.
        translation_en: distillation characteristics
        translation_fr: rétention d'ébullition [f.]
