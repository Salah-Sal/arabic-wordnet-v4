    - entry_id: 373962
      dictionary_id: 52
      headword: وحدة تروس التوجيه الحلزونية (التوجيه بالصامولة الكروية)
      headword_bare: وحدة تروس التوجيه الحلزونية (التوجيه بالصامولة الكروية)
      headword_norm: وحدة تروس التوجيه الحلزونية (التوجيه بالصامولة الكروية)
      root: وحد
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: 'يؤدي دوران عمود التوجيه إلى تحرّك صامولة التوجيه على الكريات الدوارة في اتجاه محوري على نحو قليل
        الاحتكاك وخالٍ من البلى، وعندئذ يدور العمود القطاعي. ويقوم عمود التوجيه المتصل بالعمود القطاعي بإحداث حركة تأرّجُح
        لذراع التوجيه الهابطة. وتتمثل مزايا مجموعة تروس التوجيه الحلزونية فيما يلي: - خلوها من الفوت بين عمود التوجيه وصامولة
        التوجيه. - العمل بكيفية خالية تقريباً من البلى. - قابلية ضبط الخلوص المحوري لعمود التوجيه السفلي وللعمود الحلزوني.
        - نسبة التخفيض خطية.'
