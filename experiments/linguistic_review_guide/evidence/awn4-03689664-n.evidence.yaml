        definitions_text: فلتر يُستخدم في الوحدات الخاصة بمنظومة الفرامل البنيوماتية، حيث يقوم بالحفاظ على وظيفة وحدات الفرامل
          وحمايتها من البلى المبكر، ويتحقق ذلك من خلال فصل جُسَيّمات الغبار عن الهواء المسحوب. ويُستبدل الفلتر في إطار عمليات
          الفحص والصيانة.وهذا النوع من الفلاتر يُستخدم أساسا في [مُجففات الهواء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91294)
          الحسّاسة ضد الغبار والأتربة بصفة خاصة، وذلك لكونها فلاتر ورقية صُمّمت خصيصاً أيضاً لترشيح جُسَيّمات الغبار متناهية
          الصغر.
