    - entry_id: 374857
      dictionary_id: 52
      headword: ترس مُبدئ الحركة
      headword_bare: ترس مبدئ الحركة
      headword_norm: ترس مبدئ الحركة
      root: ترس
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: يكون مُركباً على عمود عضو الإنتاج الخاص بمبدئ الحركة في اتجاه محورى بحيث يكون متحركاً، وهو يتكوّن
        من سبيكة نحاس وقصدير أو من الصلب، كما أنه مزود بتروس خاصة. ويُعشق عند الضغط على زر بدء الحركة في الحلقة المسننة ل[حدّافة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=96101).
        ويُمكن في حالة النسبة الكبيرة لنقل التروس (من 9:1 إلى 15:1) أن يدور [عضو الإنتاج الكهربائي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=90531)
        الخاص بمبدئ الحركة بعد بدء حركة المحرك على سرعة دوران عالية تتجاوز الحد المسموح. ولمنع حدوث تلف بمبدئ الحركة وذلك
        نتيجة لدوران عمود عضو الإنتاج عندما يكون المحرك دائراً، فإنه يتم حلّ تدفق القوة بين الترس الصغير وعضو الإنتاج عن طريق
        المحرك بواسطة قابض دوّار أحادي الاتجاه أو قابض متعدد الأقراص.حيث يقوم القابض الدوّار أحادي الاتجاه بتعشيق الترس الصغير
        مع عضو التوجيه بحيث يتم إدارة الترس الصغير عند إدارة عمود عضو الإنتاج، إلا أنه يتم حلّ الوصل الاحتكاكي عندما يدور
        الترس الصغير بسرعة. وفي حالة مبدئ الحركة الكبير نسبياً يتولى القابض متعدد الأقراص عملية فك الوصلات الاحتكاكية بين
        الترس الصغير وعمود عضو الإنتاج. تُركب أقراص القابض المفردة، بحيث تكون قابل للتحرك محورياً، ولكن غير قابلة للدوران،
        في فلانشة عضو التوجيه أو على صامولة الضغط، وهي تتداخل بالتناوب في بعضها البعض.حيث تزيد صامولة الضغط من ضغط الأقراص،
        أي عزم الدوران القابل للنقل، وعند الوصول إلى الحمل الأقصى المسموح به تضغط شفة الضغط الأقراص النابضية لتُبعدها عن حلقة
        الضغط. ونتيجة لذلك ينزلق القابض متعددالأقراص.
      translation_en: starter pinion
      translation_fr: pignon de démarreur [m.]
      domain: Automotive Engineering
      external_id: arabterm:90551
      dict_key: arabterm_arabterm_automotive_engineering
