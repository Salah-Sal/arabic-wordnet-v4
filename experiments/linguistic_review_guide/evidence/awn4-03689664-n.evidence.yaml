            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: هي صامولة مُزوّدة بلولب متري. يوجد بأحد جانبيها غمد باتجاه الداخل، الذي يكون مُتوائماً مع قطر
              الأنبوب المعني، وهو يقوم بتثبيت الوصلات الأنبوبية تثبيتاً مُحكماً ضد الضغط في تثبيتات المواسير والأنابيب، وهو
              ما يحدث عند إحكام ربط صواميل الوصل، حيث يقوم غمد الصامولة بضغط حلقة القطع إلى داخل [المخروط الداخلي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87708)
              أو باتجاه [حلقة الضغط](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87711). وفي مرحلة [الربط
              النهائي](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91737) تنشأ شفة.
