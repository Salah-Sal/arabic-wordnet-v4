      is_partial: 0
      definitions_text: عبارة عن جزء توصيل لخطوط الأنابيب الخاصة [بالوصلات الأنبوبية](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91746)
        في الأنظمة البنيوماتية أو الهيدرولية. وهو يقوم بربط الوصلات الأنبوبية بعضها مع بعض أو مع الوحدات. وتحقيقاً لهذا الغرض
        فقد تم تجهيزه من كلا جانبيه بلولب متري. وهو مصُمم ليتلاءم مع الوصلات الطرفية والوصلات الملولبة. ولولب الخانق الملولب
        يُستخدم في إحكام ربط الوصلات الأنبوبية مع صواميل 'اليونيون'، كما يمكن تثبيته على الوحدات المُزوّدة بوصلات ضغط. وتعمل
        الصامولة السُداسية المُستقرة في المُنتصف على تثبيت الخانق الملولب مُقابل مفتاح شوكي عند حل صامولة 'اليونيون' أو تثبيتها.
