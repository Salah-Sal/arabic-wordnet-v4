            على توفير قدر بسيط من الضغط الزائد داخل خزان الوقود، ممّا يُحدث تأثيراً مُضاداً لميل الوقود للبخر. ولا تستطيع
            أبخرة الوقود الخروج إلا عند قيمة ضغط تبلغ حوالي 50 مللي بار. وعند تبريد خزان الوقود أو استهلاك الوقود تحدث مُعادلة
            للضغط مع الهواء الخارجي. وحتى يمكن أن تبدأ عملية تفريغ خزان الفحم النباتي النشط أثناء تشغيل السيارة، يجب أن تتجاوز
            درجة حرارة سائل التبريد 50 ° س. وبذلك يكون قد تم التحقق من أن أبخرة الوقود الإضافية لن تُعيق مرحلة تسخين المحرك.
            عند تحرّك الصمام الخانق، تتحول فوهة وصلة التحكم في البداية إلى نطاق الضغط الخوائي ، كما ينفتح صمام الكسح. وبعد
            ذلك يتم شفط أبخرة الوقود المُمتصة من خزان الفحم النباتي النشط عبر فتحة أخرى. تجدر الإشارة إلى أن هذا النظام لا
            يحتاج إلى صيانة، حيث أن خزان الفحم النباتي النشط يتمتع بعُمر افتراضي طويل للغاية.'
