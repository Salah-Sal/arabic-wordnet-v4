          - entry_id: 987356
            dictionary_id: 151
            headword: صَمَلَ 
            headword_bare: صمل 
            headword_norm: صمل
            root: صمل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '(صَمَلَ) الصَّادُ وَالْمِيمُ وَاللَّامُ أَصْلٌ وَاحِدٌ يَدُلُّ عَلَى شِدَّةٍ وَصَلَابَةٍ. يُقَالُ:
              صَمَلَ الشَّيْءُ صُمُولًا، إِذَا صَلَبَ وَاشْتَدَّ. وَرَجُلٌ صُمُلٌّ: شَدِيدُ الْبَضْعَةِ. وَكَانَ الْخَلِيلُ
              يَقُولُ: لَا يُقَالُ ذَلِكَ إِلَّا لِلْمُجْتَمِعِ السِّنِّ. وَاصْمَأَلَّ النَّبَاتُ، إِذَا قَوِيَ وَالْتَفَّ.
              وَالصَّامِلُ مِنْ كُلِّ شَيْءٍ: الْيَابِسُ. وَصَمَلَ الشَّجَرُ، إِذَا لَمْ يَجِدْ رِيًّا فَخَشُنَ. وَيُقَالُ:
              صَمَلَهُ بِالْعَصَا، إِذَا ضَرَبَهُ. وَاللَّهُ أَعْلَمُ بِالصَّوَابِ.'
            translation_en: null
            translation_fr: null
            domain: null
