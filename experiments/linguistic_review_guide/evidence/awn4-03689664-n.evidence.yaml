            definitions_text: 'صملصَمَلَ الشَّيْءُ صُمُوْلاً: صَلُبَ واشْتَدَّ، وُيوْصَفُ به الخَيْل والجِمَالُ والرِّجَالُ.
              ورَجُل صُمُلُّ وامْرَأةٌ صُمُلةٌ: شَدِيدةُ البَضةِ مُجْتَمِعُ السِّنَ.والصمْلُ: الضَرْبُ بالعَصا. وصَمَلْتُ
              عن الطَعَام: كَفَفْت عنه. والصمِيْلُ: السِّقَاءُ اليابِسُ. والصِّمْلِيْلُ: الرَّجُلُ الضئيلُ - على وَزْنِ شِمْلِيْلٍ
              -. وهو أيضاً: ضَرْبٌ من النَبات.واصْمَأل الأمْرُ اصْمِئْلالاً: إذا اشْتَدَّ.والمُصْمَئلةُ: الدّاهِيَةُ.'
