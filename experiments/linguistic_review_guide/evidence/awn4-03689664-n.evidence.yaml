              text: '[صمل] فيه: أنت رجل "صمل"، هو بالضم والتشديد الشديد الخل، وصمل الشيء صمولًا صلب واشتد، وصمل الشجر إذا
                عطش فخشن ويبس. ومنه ح: إنها "صميلة"، أي في ساقها يبس وخشونة.'
