          - entry_id: 37410
            dictionary_id: 2
            headword: مجلس الأمن
            headword_bare: مجلس الأمن
            headword_norm: مجلس الامن
            root: أمن
            root_source: ocr
            pos: phrase
            form: null
            is_partial: 0
            definitions_text: 'هو المجلس الذى نص ميثاق الأمم المتحدة على تأليفه إلى جانب الجمعية العامة لهيئة الأمم . وهو
              يتكوّن من خمسة عشر عضواً , منهم خمسة دائمون يمثلون الدول العظمى , وعشر تختارهم الجمعية العامة كل سنتين من ممثلى
              الدول الأخرى على حسب مناطقها الإقليمية . وأهم اختصاصات مجلس الأمن : الفصل فى المنازعات السياسية بين الدول وبخاصة
              ما يهدد منها السلام العالميّ , واتخاذ الخطوات التى يراها ضرورية لحفظ السلم والأمن الدولىّ . فله أن يحيل الدولتين
              المتنازعتين على التحكيم أو على محكمة العدل الدولية , وأن يأمرهما بالكف عن استخدام القوة فى النزاع . وللمجلس
              أن يلجأ إلى وسائل القمع وإيقاع العقوبات على الدول المعتدية كقطع العلاقات الاقتصادية والسياسية والحَصْر البحرىّ
              , وإنزال القوات التى ترسلها الدول الأعضاء إلى ساحة النزاع لِفَضِّه أو لتنفيذ قرارات المجلس الخاصة به . ويُصدر
              المجلس قراراته بأغلبية تسعة أصوات على الأقل من بينهم أصوات جميع الأعضاء الدائمين , أى أن لكل دولة ذات مقعد دائم
              بالمجلس حق رفض مشروع كل قرار مهما كانت الأغلبية التى تؤيده , وهذا ما يسمى بحق الاعتراض (Veto) .'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: Al_Mujam_Al_Kabeer:Vol_1:page_0533:2
