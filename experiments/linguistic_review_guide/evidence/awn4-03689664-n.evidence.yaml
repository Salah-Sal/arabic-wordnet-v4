    - entry_id: 376317
      dictionary_id: 52
      headword: وصلة عامة
      headword_bare: وصلة عامة
      headword_norm: وصلة عامة
      root: وصل
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: 'عبارة عن شكل خاص من لقمة المفتاح الصندوقي، وتستخدم مع طقم المفاتيح الصندوقية بمثابة قطعة مباعدة.
        وهي تُتيح إمكانية الوصول إلى المواضع التى يصعب الوصول إليها، أو إمكانية فك أو تثبيت مسمار أو صامولة، إذا تعذّر الوصول
        إلى أيهما في خط مُستقيم. وتُصّنع هذه الوصلة من صلب العدد، وتحتوي على وصلة صليبة (كردان) بين بروفيليها رُباعيي المقطع.
        كما تُصنع بروفيلات الموائم المربع المعيارية التالية بالمقاسات التالية: ¼''، 3/8''، ½''، ¾''، 1'' (بوصة).'
      translation_en: universal joint
      translation_fr: joint universel [m.]
