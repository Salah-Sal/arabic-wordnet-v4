          - entry_id: 372435
            dictionary_id: 52
            headword: تأمين حلقات الكبّاس
            headword_bare: تأمين حلقات الكباس
            headword_norm: تامين حلقات الكباس
            root: من
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: إذا لم تُتخذ إجراءات خاصة لتأمين حلقات الكبّاسات، فإن نهايات فجوات [حلقات الكبّاس](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88130)
              المُركّبة في المحركات ثنائية الشوط تنضغط مثل الياي في قنوات التبدل الغازي وقد تنكسر. لذلك تُكبس بنوز أو جلب
              صغيرة في داخل أو على جوانب حزوز الكبّاس لتثبيت حلقاته في وضع معين يكفل - أثناء التشغيل - انزلاق نهايات فجوات
              الحلقات عند مرورها على القنوات المختلفة. هناك ثلاث إمكانيات مختلفة لوضعية البنوز في الحزوز، إلا أن التأمين الجانبي
              (أي تثبيت بنز التأمين في جانب الحز العلوي) يحل على نحو متزايد محل التأمين الداخلي والتأمين الأوسط، فمن خلال
              هذه الوضعية يمكن تجنب خطر انكسار نهايات الفجوات (a) أو حدوث خلوص كبير للفجوة (b).
            translation_en: piston ring stop
            translation_fr: arrêtoir de segment de piston [m.]
