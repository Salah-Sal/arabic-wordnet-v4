            definitions_text: 'زنقالزَّنَق، مُحَرَّكَةً: أَسلَةُ نَصْلِ السَّهْم، ج: زُنُوقٌ عَن ابْنِ عَبّادٍ. وَفِي الصِّحاح:
              الزَّنَق: موضِع الزِّناقِ وأَنْشَد لرُؤْبَةَ:(كأَنَّه مُستَنْشق من الشَّرَقْ ... أَو مُقْرَعٌ مِنْ رَكْضِها
              دامِي الزَّنَقْ)والزُّنُق بضَمَّتَيْنِ: العُقولُ التّامَّةُ عَن ابنِ الأَعرابِيِّ.قالَ: وزَنَقَ على عِيالِه
              يَزْنِقُ من حَدِّ ضَرَبَ: إِذا ضَيَّقَ على عِيالِه بُخلاً أَو فَقْرًا، كأَزْنَقَ وزَنَّقَ وَكَذَلِكَ زهَدَ وأَزْهَدَ،
              وزَهَّدَ، وقاتَ وقَوَّتَ، وأَقاتَ، وأَقْوَتَ.وزَنَقَ فَرَسَه يَزنِقُه زَنْقاً: جَعَلَ تَحتَ حَنَكِه الأَسفَلِ
              حَلْقَةً فِي الجُلَيْدَةِ، ثُمَّ جَعَلَ فِيهَا خيطاً يُجْعَلُ فِي رُؤُوسِ البَغْلِ الجَموحِ، وَاسم تِلْكَ الحَلْقَةِ:
              زِناقَة، قَالَه الليْثُ.وزَنَقَ البَغْلَ وَكَذَا الفَرَسَ يَزْنِقُه، ويَزْنُقُه: إِذا شَكَّلَه فِي قَوائِمِه
              الأرْبَعَ، قَالَه ابنُ دُرَيْدٍ.وكُلُّ رِباطٍ كنى الجِلْدِ تَحْتَ الحَنَكِ فَهُوَ زُناقٌ، كغُراب هكَذا فِي سائِرِ
              النُّسَخ، والصوابُ ككِتابٍ، كَمَا هُوَ مَضْبُوطٌ هكَذا فِي كِتابِ اللّيثِ، زادَ: وَكَانَ فِي الأَنْفِ مَثْقُوباً
              فَهُوَ عِرانٌ، وَمِنْه قَوْلُ الشاعِر:(فإِنْ يَظْهَرْ حَدِيثُكَ يُؤْتَ عَدْوًا ... برَأسِك فِي زِناقٍ أَو عِرانِ)والمَزْنُوقُ:
              فَرَسُ عامِرِ بنِ الطُّفَيْلِ وَهُوَ القائِلُ فِيهِ:(وَقد عَلِمَ المَزْنوقُ أَنِّى أَكُرُّه ... عَلَى جَمْعِهم
              كَرَّ المَنِيح المُشَهَّرِ)كَمَا فِي الصِّحاح.والمَزْنوق أَيْضاً: فَرَسُ عَتّابُ ابنِ ورْقاءَ الرِّياحيَ، قالَ
              سرُاقَةُ مِرْداسٍ الباتل:(سَبَقَ مَكْحُولٌ وصَلّى نادِرُ ... وخُلِّفَ المَزْنُوق والمُساوِرُ)مَكحُول: فرَسُ
              عَليّ بنِ شَبِيبِ بن عامِرٍ الأَزْديِّ، والمُساوِر لعَتّابٍ أَيْضا. والزَناقُ ككِتاب:)المِخْنَقَة مِنَ الحُليِّ
              نَقَلَه الْجَوْهَرِي، وقالَ ابنُ عَبّادٍ: هُوَ من فِضة للنساءَ.والزَّنِيقُ كأمِيرٍ: المُحْكَم الرصِينُ يُقال:
              رأْىٌ زنَيقٌ، وأَمر زَنيقٌ، أَي: وَثِيقٌ، وَكَذَا تَدْبِيرٌ زَنِيقٌ، وَهُوَ مَجازٌ.وَمِمَّا يُسْتَدركُ عَلَيْهِ:
              الزنْاقُ، بالكسرِ: الشِّكالُ.والزَّنَقَةُ، مُحَرَّكَةً: السِّكَّةُ الضَّيِّقَةُ، وقالَ اللَّيْثُ: هُوَ مَيْل
              فِي جِدارٍ أَو سِكَّةٍ أَو ناحِيَةِ دارٍ، أَو عرْقُوب وادٍ يكونُ فِيهِ الْتِواء كالمَدْخَلِ، والالْتِواءُ، اسمٌ
              لذلِكَ يلا فِعْلٍ، وَقَالَ ابنُ عَبّادٍ: الزَّنَقَةُ فِي الأَودِيَةِ: المضيقُ، وَفِي حَدِيثِ عُثْمان رضِيَ اللهُ
              عَنهُ: مَن يَشتَري هذِه الزَّنَقَةَ، فيَزِيدَها فِي المَسْجِدِ.قلت: والعامَّةُ تُسَمِّيه الْآن الزّنقُورَ. والمَزْنُوقُ:
              المَربُوطُ بالزِّناقِ. والمَزْنُوق أَيضاً: المأسورُ بالبَوْلِ. وزَنِيقٌ، كأمِيرٍ: اسمُ رَجُلٍ، قالَ الأَخْطَلُ:(ومِنْ
              دونهِ يَحْتاطُ أَوْسُ بنُ مُدْلِج ... وإِيّاهُ يَخَشًى طارِقٌ وزَنِيق)وإِزْنِيقُ، بالكسرِ: بَلَدٌ بالروم ويُقالُ
              بالكافٍ، وسَيَأْتِي.'
