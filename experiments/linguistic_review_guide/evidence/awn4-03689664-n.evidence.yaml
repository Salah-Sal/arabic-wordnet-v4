        definitions_text: لكي يمكن توفير أكبر مساحة مُمكنة لسطح الفلتر في خرطوشة الفلتر، يُشكل [ورق الفلترة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87469)
