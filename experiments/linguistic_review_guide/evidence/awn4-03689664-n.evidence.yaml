          أعلى نسبياً في أحد حيّزيّ الأسطوانة. وهذا يعني أن الحركة الدورانية الآتية من عجلة القيادة تتلقى تعزيزاً هيدرولياً.
          أمّا إذا سبق الترس الدودي عمود التوجيه - وهذا ما يحدث عند انتقال عزم الدوران من ذراع التوجيه الهابطة - فإنه ينشأ
          ضغط أعلى للزيت في الأسطوانة التي تتولّد منها قوة في الاتجاه المُضاد تقوم بإيقاف عملية التوجيه غير المقصودة. ولحماية
          المحور ووصلات التوجيه ومضخة زيت الضغط يتم في معظم الأحوال تجهيز النظام بآلية تحديد هيدرولي للتوجيه، وهذا يعني أنه
          قبل الوصول للمصدّ الطرفي لعجلة القيادة يحدث تصريف للزيت من جانب الأسطوانة الواقع تحت ضغط عالٍ إلى خط الراجع. وتكون
          جميع محامل الترس الدودي والعمود القطاعي - لنظام التوجيه الهيدرولي ذي الكريات المُعززة - من النوع الدحروجي المقاوم
          للاحتكاك. وبذلك لا تحدث سوى فواقد ميكانيكية ضئيلة.'
