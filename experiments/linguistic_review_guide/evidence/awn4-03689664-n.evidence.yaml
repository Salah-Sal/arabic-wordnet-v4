                وَفِي حَدِيثِ أَبِي هُرَيْرَةَ الْآخَرَ «أَنَّهُ ذَكَرَ الْمَزْنُوق فَقَالَ: المَائلُ شِقّةُ لَا يَذْكر اللَّهَ»
                قِيلَ أصلهُ مِنَ الزَّنَقَةِ، وَهِيَ مَيْل فِي جِدَار فِي سِكة أَوْ عُرْقُوب وَادْ. هَكَذَا فَسَّرَهُ الزَّمخشري.وَمِنْهُ
                حَدِيثُ عُثْمَانَ «قَالَ: مَنْ يَشْتَرى هَذِهِ الَزَّنَقَةَ فيَزيدُها فِي الْمَسْجِدِ؟» .'
