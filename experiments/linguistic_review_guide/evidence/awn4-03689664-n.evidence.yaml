      - entry_id: 371779
        dictionary_id: 52
        headword: فلتر الهواء
        headword_bare: فلتر الهواء
        headword_norm: فلتر الهواء
        root: null
        root_source: null
        pos: null
        form: null
        is_partial: 0
        definitions_text: 'تتمثل وظيفته في تنقية الهواء الجديد المسحوب من أجل إجراء عملية الاحتراق وفي تخميد أصوات السحب.
          ولذلك يتم دمجها غالباً بمبيت للفلتر ذي سعة كبيرة. يتم دائماً تركيب فلاتر الهواء أمام الكاربوراتير أو أمام [ماسورة
          السحب](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88007). ومن السمات الضرورية لفلتر الهواء
          أن تكون له مُقاومة سريان ضئيلة. أكثر أنواع الفلاتر انتشاراً هي: 1) فلاتر الهواء المُبلّلة: حيث يتم ترطيب الصوف المعدني
          أو عناصر الشبكة بالزيت، وتتعلق جزيئات الأتربة بهذا النسيج الرطب. 2) فلاتر الهواء العاملة بحمام الزيت: حيث يقوم كل
          من حمام الزيت والنسيج المعدني باحتجاز الأتربة الموجودة في الهواء المار عبر الفلتر. 3) الفلاتر الورقية (فلاتر جافة):
          حيث يسمح قلب الفلتر (القابل للاستبدال) المصنوع من ورق الفلاتر المطبق بمرور الجسيمات غير الضارة فقط. 4) الفلاتر الحلزونية
          (فلاتر دوّامية): حيث يتم تحريك الهواء بداخلها في حركة دوّامية، ممّا يؤدي إلى طرد جزئيات الأتربة الثقيلة. ويمكن أيضاً
          إلحاق حمام زيت بهذا النوع الأخير.'
        translation_en: air filter
        translation_fr: filtre à air [m.]
        domain: Automotive Engineering
        external_id: arabterm:87473
        dict_key: arabterm_arabterm_automotive_engineering
