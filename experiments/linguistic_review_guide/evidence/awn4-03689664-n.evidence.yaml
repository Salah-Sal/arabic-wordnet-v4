    - entry_id: 372104
      dictionary_id: 52
      headword: جلبة دعم
      headword_bare: جلبة دعم
      headword_norm: جلبة دعم
      root: جلب
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: عبارة عن جلبة أسطوانية توجد في المواسير النحاسية طرية التلدين الخاصة بتثبيتات المواسير والأنابيب.
        وهي تعمل على تعزيز طرف الأنبوب، وتمنع انسحاق الأنبوب عند إحكام ربط صامولة 'اليونيون'، الأمر الذي يحدث من خلال دفع
        جلبة التدعيم داخل طرف الأنبوب للماسورة النحاسية طرية التلدين، إلى أن تلتصق تماماً بطرف الأنبوب. ويتم تجهيز جلبة الدعم
        عند الطرف السُفلي بمُسننة، وذلك حتى لا تنزلق أو تتعرّض للسقوط أثناء التركيب. وتستقر مُسننة الجلبة على الطرف المستوي
        للأنبوب.
      translation_en: reinforcing sleeve
      translation_fr: douille de renfort [f.]
      domain: Automotive Engineering
