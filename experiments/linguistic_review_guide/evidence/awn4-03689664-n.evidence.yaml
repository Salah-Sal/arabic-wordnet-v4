      - entry_id: 371784
        dictionary_id: 52
        headword: فحم نباتي نشط
        headword_bare: فحم نباتي نشط
        headword_norm: فحم نباتي نشط
        root: فحم
        root_source: lane
        pos: null
        form: null
        is_partial: 0
        definitions_text: 'يتمتع هذا الفحم بميزة خاصة، تتمثل في قدرته على امتصاص الغازات وحجب مرورها خارجه. وهو لذلك يُستخدم
          في الغالب كمادة مُرشّحة. ويمكن الحصول على هذا النوع من الفحم من خلال تسخين الخشب، أو الفحم البني، أو الفحم الحجري،
          أو حتى من قشر جوز الهند، وذلك في مُحيط خال من الأكسجين. جدير بالذكر أن سطح الجرام الواحد من الفحم النباتي النشط
          يتراوح من 400 إلى 1600 متر مربع. وحتى يتيسر خفض نسبة تلوث الهواء من جراء تصاعد أبخرة الوقود تم تجهيز السيارات الحديثة
          بمنظومات بخر وقود مُزودة بخزان للفحم النباتي النشط، يتم فيه توصيل المُركّبات الهيدروكربونية الغازية بالفحم النباتي
          النشط. ويعمل الضغط الخوائي أثناء تشغيل السيارة على شفط المُركّبات الهيدروكربونية مرة أخرى لتحترق داخل المحرك. يتضمن
          الشكل التالي (انظر الصورة) شرحاً لهذه الوظيفة: تؤدي ثلاث وصلات إلى خزان الفحم النباتي النشط، حيث تمر أبخرة الوقود
          القادمة من الخزان عبر إحداها، بينما تصل الثانية إلى صمام الكسح عبر قطعة مُوصّلة، وتوفر الثالثة شحنات جديدة من الهواء.
          ويوجد صمام تفريغ هواء بين خزان الفحم النباتي النشط وخزان الوقود، وفي حالة توقف المحرك يعمل هذا الصمام على توفير
          قدر بسيط من الضغط الزائد داخل خزان الوقود، ممّا يُحدث تأثيراً مُضاداً لميل الوقود للبخر. ولا تستطيع أبخرة الوقود
          الخروج إلا عند قيمة ضغط تبلغ حوالي 50 مللي بار. وعند تبريد خزان الوقود أو استهلاك الوقود تحدث مُعادلة للضغط مع الهواء
          الخارجي. وحتى يمكن أن تبدأ عملية تفريغ خزان الفحم النباتي النشط أثناء تشغيل السيارة، يجب أن تتجاوز درجة حرارة سائل
          التبريد 50 ° س. وبذلك يكون قد تم التحقق من أن أبخرة الوقود الإضافية لن تُعيق مرحلة تسخين المحرك. عند تحرّك الصمام
          الخانق، تتحول فوهة وصلة التحكم في البداية إلى نطاق الضغط الخوائي ، كما ينفتح صمام الكسح. وبعد ذلك يتم شفط أبخرة
          الوقود المُمتصة من خزان الفحم النباتي النشط عبر فتحة أخرى. تجدر الإشارة إلى أن هذا النظام لا يحتاج إلى صيانة، حيث
          أن خزان الفحم النباتي النشط يتمتع بعُمر افتراضي طويل للغاية.'
        translation_en: activated carbon
        translation_fr: charbon actif [m.]
        domain: Automotive Engineering
        external_id: arabterm:87478
