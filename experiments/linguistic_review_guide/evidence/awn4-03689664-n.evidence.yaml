          - entry_id: 1018
            dictionary_id: 1
            headword: أَمِنَ
            headword_bare: أمن
            headword_norm: امن
            root: أمن
            root_source: ocr
            pos: verb
            form: I
            is_partial: 0
            definitions_text: 'أَمْناً, وأَمَاناً, وأَمانَةً, وأَمَنَةً, وإِمْناً, وأَمَنَةً: اطمأنَّ ولَم يخفْ, فهو آمِنٌ,
              وأَمينٌ, وأَمِينٌ. يقال: لك الأمان: أى قد آمنتك البلد: اطمأنَّ فيه أهله الشرَّ, ومنه: سلم فلاناً على كذا: وثق
              به واطمأنَّ إليه, أو جعله أميناً عليه'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: Al_Waseet:page_0060:1
            dict_key: Al_Waseet
            dict_name_ar: المعجم الوسيط
            dict_name_en: Al-Mu'jam Al-Wasit
            dict_source_type: ocr
            dict_period: modern
            dict_author: مجمع اللغة العربية
            dict_death_year: null
            definitions:
            - sense_index: 0
              text: 'أَمْناً, وأَمَاناً, وأَمانَةً, وأَمَنَةً, وإِمْناً, وأَمَنَةً: اطمأنَّ ولَم يخفْ, فهو آمِنٌ, وأَمينٌ,
                وأَمِينٌ. يقال: لك الأمان: أى قد آمنتك'
              is_raw: 0
            - sense_index: 1
              text: 'البلد: اطمأنَّ فيه أهله'
              is_raw: 0
            - sense_index: 2
              text: 'الشرَّ, ومنه: سلم'
              is_raw: 0
            - sense_index: 3
              text: 'فلاناً على كذا: وثق به واطمأنَّ إليه, أو جعله أميناً عليه'
              is_raw: 0
            examples:
            - idx: 0
              type: quran
              text: ﴿هَلْ آمَنُكُمْ عَلَيْهِ إِلَّا كَمَا أَمِنْتُكُمْ عَلَى أَخِيهِ مِنْ قَبْلُ﴾
              attribution: null
            - idx: 1
              type: quran
              text: ﴿وَمَا أَنْتَ بِمُؤْمِنٍ لَنَا﴾
              attribution: null
            plurals: []
            derived_forms:
            - idx: 0
              text: 'أَمُنَ: أمانَةً: كان أميناً'
            - idx: 1
              text: 'آمَنَ: إيماناً: صار ذا أَمْن'
            - idx: 2
              text: 'آمَنَ به: وثق به, وصدَّقَهُ'
            - idx: 3
              text: 'آمَنَ فلاناً: جعله يَأْمَنُ'
            - idx: 4
              text: 'أَمَّنَ على دعائه: قال: آمين'
            - idx: 5
              text: 'أَمَّنَ على الشيء: دفع مالاً مُنَجَّماً لينال هو أو ورثته قَدْراً من المال متفقاً عليه, أو تعويضاً عما
                فَقَد. يُقال: أَمَّن على حياته, أو على داره, أو سيارته (مج)'
            - idx: 6
              text: 'أَمَّنَ فلاناً: جعله في أَمْن'
            - idx: 7
              text: 'أَمَّنَ فلاناً على كذا: أمنه'
            - idx: 8
              text: 'ائتمَنَ فلاناً: أمنه'
            - idx: 9
              text: 'ائتمَنَهُ: أَمَّنَهُ'
            - idx: 10
              text: 'ائتمَنَ فلاناً على الشيء: جعله أميناً عليه'
            - idx: 11
              text: 'استأمن إليه: استجاره وطلب حمايته؛ ويقال: استأمن الحربىّ: استجار ودخل دار الإسلام مستأمناً'
            - idx: 12
              text: 'استأمن فلاناً: طلب منه الأمان'
            - idx: 13
              text: 'استأمنَهُ: ائتمَنَهُ'
            - idx: 14
              text: 'الأمانة: الوفاء'
            - idx: 15
              text: 'الأمانة: الوديعة'
            - idx: 16
              text: 'الأمَنَة والأمَنَة: مَنْ يؤمِن بكل ما يسمع, ويطمئن إلى كل أحد'
            - idx: 17
              text: 'الأمنة: الذى يأمنه كل أحد في كل شيء'
            - idx: 18
              text: 'الأمون: المطية المأمُونة لا تعثر ولا تفتر (ج) أُمُن'
            - idx: 19
              text: 'آمين: آمين'
            - idx: 20
              text: 'الأمين: الحافظ الحارس'
            - idx: 21
              text: 'الأمين: المأمون'
            - idx: 22
              text: 'الأمين: مَنْ يتولى رقابة شيء أو المحافظة عليه (ج) أمناء'
            - idx: 23
              text: 'الإيمان: التصديق'
            - idx: 24
              text: 'الإيمان شرعاً: التصديق بالقلب, والإقرار باللسان'
            - idx: 25
              text: 'التأمين: عقد يلتزم أحد طرفيه, وهو المؤمِّن, قِبَل الطرف الآخر, وهو المستأمن, أداء ما يتفق عليه عند تحقق
                شرط أو حلول أجل في نظير مقابل نقدى معلوم (مج)'
            cross_refs: []
            provenance:
              page_number: ٣١
              page_file: page_0060
              entry_index: 1
              volume: null
              hawramani_post_id: null
              hawramani_slug: null
