    - entry_id: 376043
      dictionary_id: 52
      headword: الربط النهائي
      headword_bare: الربط النهائي
      headword_norm: الربط النهائي
      root: ربط
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: في صواميل 'اليونيون' يقصد به اللفة الأخيرة في الصامولة عند تثبيت الوصلة الأنبوبية على الخانق الملولب
        ذي المخروط الداخلي. ومن خلاله تخترق [حلقة القطع](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87703)
        في السطح الخارجي للأنبوب، وبالتالي فإنها تُكوّن شفة ملحوظة. وعلى ذلك فإن تثبيتات المواسير والأنابيب تكون محكمة ضد
        ضغط يصل إلى 100 بار، ويحدث ذلك بعد ضغط الوصلة الأنبوبية إلى داخل الخانق الملولب حتى المصد، وبعد ربط صواميل 'اليونيون'
        بمقدار 3/4 لفة تقريباً بعد ربطها يدوياً بإحكام، وبذلك يكون الحد القاطع لحلقة القطع قد وصل إلى السطح الخارجي للوصلة
        الأنبوبية. الآن يتم الربط النهائي من خلال إحكام ربط صامولة 'اليونيون' مرة أخرى بمقدار لفة واحدة. ويجب تكرار هذه العملية
        في حالة عدم ظهور شفة واضحة. وهو ما يعني إعادة فك الوصلة مرة أخرى.
      translation_en: final torquing
      translation_fr: serrage final [m.]
      domain: Automotive Engineering
      external_id: arabterm:91737
