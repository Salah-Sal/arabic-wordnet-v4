      - entry_id: 371775
        dictionary_id: 52
        headword: ورق الفلترة
        headword_bare: ورق الفلترة
        headword_norm: ورق الفلترة
        root: ورق
        root_source: lane
        pos: null
        form: null
        is_partial: 0
        definitions_text: من بين جميع وسائط الفلترة المُستخدمة في مجال هندسة السيارات فإن ورق الفلترة يُمثل الجزء الأكبر من
          بين هذه الوسائط. وتُستخدم لتصنيع ورق الفلترة أنواع مُتباينة من الخشب المرن والصلد. ويجب أن يتوفر في وسيط الفلترة
          خاصية الاتزان العالي ضد الاهتزازات، في حالة تعرّضه لتحميل دينامي، وألا يتأثر بالماء، وزيت المحرك، وانبعاثات مبيت
          العمود المرفقي، وأبخرة الوقود. وعلاوة على ذلك، يجب أن يكون ورق الفلترة مُستقراً حرارياً. وللإيفاء بهذه المُتطلبات
          يتم تشريبه بالراتينج الاصطناعي ومُعالجته حرارياً. وعندئذ يجب أن تظل المادة الأصلية مُحتفظة بمقاسات مسامها، وكذلك
          ببنيتها النسيجية.
        translation_en: filter paper
        translation_fr: papier filtrant [m.]
        domain: Automotive Engineering
        external_id: arabterm:87469
        dict_key: arabterm_arabterm_automotive_engineering
