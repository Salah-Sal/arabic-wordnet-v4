    - entry_id: 373949
      dictionary_id: 52
      headword: مجموعة تروس التوجيه ذات الكريات الدوّارة
      headword_bare: مجموعة تروس التوجيه ذات الكريات الدوارة
      headword_norm: مجموعة تروس التوجيه ذات الكريات الدوارة
      root: جمع
      root_source: camel
      pos: null
      form: null
      is_partial: 0
      definitions_text: هي في الواقع مجموعة تروس توجيه حلزونية توجد فيها كريات من الصلب تتدحرج بين عمود التوجيه وصامولة التوجيه،
        حيث تقوم هذه الكريات بنقل حركة التوجيه بين العمود والصامولة. وفي هذه الأثناء تقوم الكريات بتحريك صامولة التوجيه معها،
        وبفضل الاحتكاك الدحروجي لا تكون هناك حاجة إلا لقدر ضئيل من القوة لأداء عملية التوجيه. كما تعمل [منظومة التوجيه](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=89604)
        إلى حد كبير دون أن تتعرّض للبلى، كما لا تتطلب سوى قدر قليل من الصيانة. ولدواعي الأمان فإن كريات الصُلب تدور بين قلاووظ
        عمود التوجيه وصامولة التوجيه في مسارين مغلقين، يمكن تمييزهما في صامولة التوجيه على هيئة أنبوبَيْن صغيرين. وتُنقل حركة
        التوجيه إلى الذراع الهابطة عن طريق العمود القطاعي. ولا يلزم إجراء ضبط لاحق للخلوص بين عمود التوجيه وصامولة التوجيه،
        حيث إن الاحتكاك يتم بشكل دحروجي وبدون حدوث بلى، إلا إنه يمكن إجراء ضبط لاحق بين صامولة التوجيه والمقطع المُسنن من
        خلال تغيير المسافة بين كلا الجزأين باستخدام مسمار ضغط وسحب مشقوق.
      translation_en: ball-and-nut-type steering gear
      translation_fr: boîtier de direction à recirculation de billes [m.]
      domain: Automotive Engineering
      external_id: arabterm:89643
