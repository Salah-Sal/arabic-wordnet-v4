            is_partial: 0
            definitions_text: '(زَنَقَ)(هـ) فِي حَدِيثِ أَبِي هُرَيْرَةَ «وَإِنَّ جَهَنَّمَ يُقَادُ بِهَا مَزْنُوقَة» الْمَزْنُوقُ:
              الْمَرْبُوقُ بِالزِّنَاقِ، وَهُوَ حَلْقَةٌ تُوضَعُ تحتَ حَنك الدَّابَّةِ، ثُمَّ يُجْعل فِيهَا خَيط يُشَدّ بِرَأْسِهِ
              تَمْنَعُ جماَحَه. والزِّنَاقُ:الشِّكال أَيْضًا. وزَنَقْتُ الْفَرَسَ إِذَا شكَّلت قَوَائِمَهُ الأربَع.وَمِنْهُ
              حَدِيثُ مُجَاهِدٍ فِي قَوْلِهِ تعالى لَأَحْتَنِكَنَّ ذُرِّيَّتَهُ إِلَّا قَلِيلًا قَالَ: شِبْه الزِّناق، (س)
              وَفِي حَدِيثِ أَبِي هُرَيْرَةَ الْآخَرَ «أَنَّهُ ذَكَرَ الْمَزْنُوق فَقَالَ: المَائلُ شِقّةُ لَا يَذْكر اللَّهَ»
              قِيلَ أصلهُ مِنَ الزَّنَقَةِ، وَهِيَ مَيْل فِي جِدَار فِي سِكة أَوْ عُرْقُوب وَادْ. هَكَذَا فَسَّرَهُ الزَّمخشري.وَمِنْهُ
              حَدِيثُ عُثْمَانَ «قَالَ: مَنْ يَشْتَرى هَذِهِ الَزَّنَقَةَ فيَزيدُها فِي الْمَسْجِدِ؟» .'
