      - entry_id: 371767
        dictionary_id: 52
        headword: الأنظمة الجزئية في المركبة ذات المحرك
        headword_bare: الأنظمة الجزئية في المركبة ذات المحرك
        headword_norm: الانظمة الجزئية في المركبة ذات المحرك
        root: نظم
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: 'تختلف الأنظمة التقنية تبعاً لمتغيرات الدخل والخرج. وتغيّر هذه المتغيرات الحادث فيها يُسمى ''تحويلاً''.
          وتنقسم هذه الأنظمة إلى: - أنظمة تحويل طاقة التي تقوم بتوليد الطاقة المطلوبة عن طريق تحويل الطاقة المُعطاة إلى شكل
          آخر للطاقة (على سبيل المثال [محرك أوتّو](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=87904)،
          الموتور الكهربائي). - أنظمة تحويل المواد التي تقوم بنقل المواد أو تحويلها تقنياً (على سبيل المثال [مضخة الماء](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88096)،
          المروحة). - أنظمة تحويل المعلومات التي تقوم بتحويل المتغيرات المعلوماتية بتمريرها إلى مكان آخر (على سبيل المثال
          [وحدة التحكم](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=182949)، [عدّاد سرعة الدوران](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=91680)).'
        translation_en: partial system in the vehicle
        translation_fr: systèmes partiels du véhicule [m.]
