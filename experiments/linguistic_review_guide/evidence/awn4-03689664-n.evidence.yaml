      - entry_id: 371774
        dictionary_id: 52
        headword: كمبيوتر السيارة
        headword_bare: كمبيوتر السيارة
        headword_norm: كمبيوتر السيارة
        root: null
        root_source: null
        pos: null
        form: null
        is_partial: 0
        definitions_text: 'يدخل كمبيوتر السيارة ضمن الأجهزة الإلكترونية التي توفر للسائق أثناء القيادة معلومات هامة ومفيدة
          عن السيارة وعن سير الرحلة. تم تطوير أول كمبيوتر سيارة بالتعاون بين شركتي بي أم دبليو (BMW) وسيمنز (Siemens). كما
          طورت شركة بوش (Bosch) كمبيوتر سيارة تحت مُسمّى ''حاسوب بيانات الرحلة''. ويمكن لقائد السيارة استدعاء الوظائف المختلفة
          لكمبيوتر السيارة باستخدام اثني عشر زر ذات وظائف مزدوجة. توجد في كمبيوتر السيارة الخاص بشركة بي أم دبليو (BMW) إحدى
          عشرة وظيفة أساسية وخمس وظائف فرعية مشتقة منها، وهم كالتالي: 1) الساعة (بنظام 24 ساعة)، 2) درجة الحرارة الخارجية
          (عندما تكون درجات الحرارة أقل من + 3° س تصدر إشارة تحذير)، 3) المسافة المتبقية حتى الوصول لنهاية هدف الرحلة (شريطة
          أن يكون قد تم تسجيل إجمالي المسافة قبل ذلك)، 4) وقت الوصول المتوقع إلى هدف الرحلة، 5) متوسط السرعة والحد الأقصى
          للسرعة (عند تخطي سرعة معينة تم تحديدها مسبقاً تصدر إشارة تحذير)، 6) استهلاك الوقود اللحظي والمتوسط، 7) مدى كفاية
          الوقود مع بيان الاستهلاك اللحظي، 8) التنبيه بانقضاء مسافة معينة - حيث يصدر صوت جرس وتضيء لمبة دايود للتذكير بمدخل
          تم إدخاله مسبقا يحدد هدف الرحلة، 9) التذكير بتوقيت معين تم تحديده مسبقاً، 10) تأمين السيارة من الاستخدام غير المُصرح
          به من خلال إدخال كود معين، 11) يمكن تصحيح المدخلات الخاطئة. ويكون كمبيوتر السيارة المُكوّن من الوحدة المركزية وواجهة
          الاستعمال على اتصال دائم ببقية الأجزاء الإلكترونية للسيارة. تتلقى الوحدة المركزية الإشارات التي ترسلها الحسّاسات،
          مثل نبضات الحقن الإلكتروني للبنزين، والقيم الفلطية لحسّاس درجة الحرارة وحسّاس محتوى خزان الوقود ...إلخ. كما تقوم
          الوحدة الرئيسية بالتحكم في جرس التحذير وإغلاق الإشعال ونفير الإنذار وكذلك التدفئة الإضافية إن وجدت.'
        translation_en: vehicle computer
        translation_fr: ordinateur de bord [m.]
        domain: Automotive Engineering
        external_id: arabterm:87468
        dict_key: arabterm_arabterm_automotive_engineering
