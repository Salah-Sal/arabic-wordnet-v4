    - entry_id: 373948
      dictionary_id: 52
      headword: نظام التوجيه الهيدرولي ذو صامولة كروية
      headword_bare: نظام التوجيه الهيدرولي ذو صامولة كروية
      headword_norm: نظام التوجيه الهيدرولي ذو صامولة كروية
      root: نظم
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: 'يندرج هذا النظام تحت مجموعة أنظمة تعزيز التوجيه، وهو يُستخدم في سيارات الركوب والسيارات الرياضية
        والشاحنات والحافلات. ويوجد في مبيت هذا النظام كل من صمام تحكم، وأسطوانة تشغيل، ومجموعة تروس توجيه ميكانيكية كاملة
        معاً. يتخذ المبيت شكل الأسطوانة بالنسبة للمكبس الذي يؤدي حركة محورية عند دوران عمود التوجيه. وتتداخل أسنان الكبّاس
        مع أسنان العمود القطاعي، فتتحوّل الحركة المحورية بفعل ذلك إلى حركة دورانية. كما يتداخل الجزء السفلي الملولب من الترس
        الدودي مع اللولب الموجود في داخل تجويف الكبّاس، وتقوم سلسلة من الكريات بوصل الترس الدودي بالكبّاس. يمكن وصف وظيفة
        نظام التوجيه الهيدرولي ذي الصامولة الكروية كالتالي: عندما تكون الصمامات في وضع مُحايد، يسري الزيت المُتدفق من المضخة
        عبر جهاز التوجيه، حيث يتدفق بحرية عبر حواف التحكم في الدخول و الرجوع - المفتوحة جميعاً - إلى حيّزيّ الأسطوانة ومنها
        يتدفق عائداً مرة أخرى. يُستخدم تيار الزيت في تعزيز حركة تدوير عجلة القيادة التي يقوم بها السائق. ويُنفّذ هذا التعزيز
        الهيدرولي عندما يتحرك مكبس الصمام  من وضعهما المُحايد، حيث يحدث ذلك دائماً عند دوران عجلة القيادة أو عند حدوث حركة
        دورانية مُعاكسة بفعل القوى التي تنتقل من ذراع التوجيه الهابطة عبر العمود القطاعي ومن ثم إلى المكبس ومنه إلى الترس
        الدودي. أي أن الصمام يغير وضعه المُحايد عند حدوث أي حركة نسبية بين الترس الدودي والجزء السُفلي من عمود التوجيه، ويكون
        الرابط بينهما هو قضيب اللي، الذي يتشكل تشكّلاً مرناً. وتكون النتيجة دوران الجزء السفلي من عمود التوجيه مع كبّاس الصمام
        في مقابل الترس الدودي، أو العكس، أي دوران الترس الدودي مع كبّاس الصمام في مقابل عمود التوجيه. وبالتالي يحدث خنق لتدفق
        الزيت عند حواف التحكم في الدخول من جانب واحد على نحو أقوى من الجانب الآخر، ممّا يتسبب في نشوء ضغط أعلى نسبياً في أحد
        حيّزيّ الأسطوانة. وهذا يعني أن الحركة الدورانية الآتية من عجلة القيادة تتلقى تعزيزاً هيدرولياً. أمّا إذا سبق الترس
        الدودي عمود التوجيه - وهذا ما يحدث عند انتقال عزم الدوران من ذراع التوجيه الهابطة - فإنه ينشأ ضغط أعلى للزيت في الأسطوانة
        التي تتولّد منها قوة في الاتجاه المُضاد تقوم بإيقاف عملية التوجيه غير المقصودة. ولحماية المحور ووصلات التوجيه ومضخة
        زيت الضغط يتم في معظم الأحوال تجهيز النظام بآلية تحديد هيدرولي للتوجيه، وهذا يعني أنه قبل الوصول للمصدّ الطرفي لعجلة
        القيادة يحدث تصريف للزيت من جانب الأسطوانة الواقع تحت ضغط عالٍ إلى خط الراجع. وتكون جميع محامل الترس الدودي والعمود
        القطاعي - لنظام التوجيه الهيدرولي ذي الكريات المُعززة - من النوع الدحروجي المقاوم للاحتكاك. وبذلك لا تحدث سوى فواقد
        ميكانيكية ضئيلة.'
      translation_en: ball-and-nut-type power steering gear
      translation_fr: direction assistée à écrou à billes [f.]
