              \ seven times, (S, TA,) or seven circuitings; (Mgh;) and ثَلَاثَةَ أَسَابِيعَ [thrice seven times, or thrice\
              \ seven circuitings]. (S.) مُسْبَعٌ Given, or delivered, to the ظُؤُورَة [which means both nurse and nurses]:\
              \ (Skr, S, TA:) this is the primary signification: (Skr:) or whose mother dies, and who is therefore suckled\
              \ by another; (K; in which the next following signification may be regarded as implied, TA;) left  to himself;\
