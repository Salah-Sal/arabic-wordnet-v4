            - sense_index: 0
              text: "سبع\n1 سَبَعَهُمْ, aor. ـَ (S, Msb, K) and سَبِعَ (Yoo, Msb, K) and سَبُعَ, (Yoo, Msb,) inf. n. سَبْعٌ,\
                \ (Msb,) He was, or became, the seventh of them: (S, Msb, K:) or he made them, with himself, seven: (S in\
                \ art. ثلث:) or it signifies, (S, and so in some copies of the K,) or signifies also, (Msb, and so in some\
                \ copies of the K,) he took the seventh part of their property, or possessions. (S, Msb, K.) And He made them,\
                \ they being sixty-nine, to be seventy with himself. (A 'Obeyd, S in art. ثلث.) And سَبَعَ also signifies\
                \ He made sixteen to be seventeen. (T in art. ثلث.) b2: سَبَعْتُ لَهُ الأَيَّامَ, aor. ـَ inf. n. as above,\
                \ I completed to him the days by making them seven: and ↓ سَبَّعْتُهَا signifies the same in an emphatic manner.\
                \ (Msb.) [See also 2.] b3:  سَبَعَ الحَبْلَ, (K,) aor. ـَ inf. n. as above, (TA,) He made the rope, or cord,\
                \ of seven strands. (K, TA.) b4: سُبِعَ المَوْلُودُ The infant had its head shaven, and an animal [generally\
                \ a goat] sacrificed by way of expiation for it, on the seventh day [after its birth, (commonly called يَوْمُ\
                \ السُّبُوعِ,) agreeably with an ordinance of Mohammad; the sacrifice being for the expiation of original\
                \ sin]. (IDrd.) A2:  سَبَعَ الغَنَمَ He (a wolf) seized the sheep, or goats, and broke their necks, or killed\
                \ them, or made them his prey, (S, K, TA,) and ate them. (TA.) b2:  سُبِعَتِ الوَحْشِيَّةٌ The female wild\
                \ animal had her young, or young one, eaten by the سَبُع [or beast, or bird, of prey]. (TA.) b3:  سَبَعَهُ\
                \ He stole it; [as though, like a سَبُع, he made it his prey;] as also ↓ استبعهُ. (AA, K.) b4:  He shot him\
                \ [with an arrow or the like], or hurled at him and struck him [with a lance, or a missile of any kind]; namely,\
                \ a wolf: or he frightened him; namely, a wolf; (K;) and also, a man. (TA.) b5:  (assumed tropical:)  He reviled,\
                \ vilified, or vituperated, him; charged him with a vice or fault or the like; (S, K, TA;) assailed him with\
                \ foul language, such as displeased him: (TA:) or he bit him (K, TA) with his teeth, like as does the سَبُع.\
                \ (TA.) 2 سبّعهُ, inf. n. تَسْبِيعٌ, He made it seven; or called it seven; (S, K;) as also ↓ اسبعهُ. (TA.)\
                \ See also 1. b2:  He made it to have seven angles, or corners; to be heptagonal. (K.) b3:  He (God) gave\
                \ him his reward, or recompense, seven times, or seven fold. (K.) An Arab of the desert said to a man who\
                \ had done a good act to him, (TA,) سَبَّعَ اللّٰهُ لَكَ May God give thee thy reward, or recompense, seven\
                \ times, or seven fold. (K, TA.) The Arabs also said, سَبَّعَ اللّٰهُ لَكَ أَجْرَهَا May God multiply to thee\
                \ the reward, or recompense, for it; meaning, for this good act: (Aboo-Sa'eed:) [for] تَسْبِيعٌ is used by\
                \ them to signify the act of multiplying, though it be more than seven fold. (TA.) And سَبَّعَ اللّٰهُ لِفُلَانٍ\
                \ is used as meaning May God make a thing to be followed by another thing to such a one; in relation to good\
                \ and to evil; as also تَبَّعَ لَهُ. (TA.) and سَبَّعَ اللّٰهُ لَكَ meaning May God bless thee with seven\
                \ children. (TA.) b4:  He washed it (namely, a vessel,) seven times. (K.) Hence the saying of Aboo-Dhu-eyb,\
                \ كَنَعْتِ الَّتِى قَامَتْ تُسَبِّعُ سُؤْرَهَا [Like her who has arisen to wash out seven times her remains\
                \ of beverage in the bottom of a vessel, left by a drinker; that drinker, as is said in a marginal note in\
                \ my copy of the TA, being her dog]: or, accord. to Es-Sukkaree, the meaning is, to give as alms her سُؤْر\
                \ [remains of beverage in the bottom of a vessel after one had drunk, or remains of food &c.,], thereby seeking\
                \ to have her reward, or recompense, multiplied; سُؤْرَهَا being used by the poet for بِسُؤْرِهَا. (TA.) b5:\
                \  سبّع القُرْآنَ [app. followed by لَهُ or عَلَيْهِ] He appointed him the reading, or recitation, of the\
                \ Kur-án [in seven portions so that he should complete the whole] in every seven nights. (O, L, K.) b6:  سبّع\
                \ لِامْرَأَتِهِ, (K, TA,) or عِنْدَهَا and لَهَا ↓ أَسْبَعَ, (TA,) He remained with his wife seven nights.\
                \ (K, TA.) In like manner one says ثَلَّثَ; and thus of every number from one to ten; in relation to any saying\
                \ or action. (TA.) b7:  سبّعت She (a woman) brought forth at seven months. (TA.) b8:  سبّع دَرَاهِمَهُ He\
                \ made his dirhems to be seventy complete; but this is post-classical; (K;) and in like manner, دراهمه ↓ سَبْعَنَ,\
                \ meaning the same, and also post-classical, and not allowable; the proper phrase to express the meaning “\
                \ I made it to be seventy ” being كَمَّلْتُهُ سَبْعِينَ. (TA.) b9: سَبَّعَتِ القَوْمُ The people, or company\
                \ of men, completed the number of seven hundred men: (K, TA:) occurring in a trad, (TA.) 3 سِبَاعٌ (K,) inf.\
                \ n. of سابع, (TK,) The performing of the act of coïtus, (IAar, Th, K,) with a woman. (TK.) b2:  The vying\
                \ with another in the endeavour to surpass him in obscene, or lewd, language, and in frequency of coïtus,\
                \ and in speaking plainly of such subjects as should only be alluded to, in relation to women: (IAar, K: *)\
                \ such seems to be its meaning in a trad. in which the doing this is forbidden. (IAar.) b3:  (assumed tropical:)\
                \  Mutual reviling, vilifying, or vituperating; (K, TA;) when each of two men assails the other with foul\
                \ language, such as displeases him: (TA:) this is said by some to be its meaning in the trad. in which it\
                \ is forbidden. (TA.) 4 اسبع, said of a party of men, It became seven: (S, K:) also, it became seventy. (M\
                \ and L in art. ثلث.) b2:  Said of a man, it signifies He was, or became, one whose camels came to the water\
                \ on the seventh day [counting the day of the next preceding watering as the first]. (S, K.) b3: اسبع لِامْرَأَتِهِ:\
                \ see 2. b4:  أَسْبَعَتْ She brought forth her seventh offspring. (TA in art. بكر.) b5: اسبعهُ: see 2, first\
                \ signification.\nA2:  It (a road) abounded with سِبَاع [or animals of prey]. (TA.) b2:  اسبع الرُّعْيَانُ\
                \ The pastors had their beasts fallen upon by the سَبُع [or animal of prey]. (Yaakoob, S, K.) A3:  اسبعهُ\
                \ i. q. أَطْعَمَهُ السَّبُعَ [which may be rendered He gave him as food the animal of prey, or he gave him\
                \ as food to the animal of prey; but it seems from what here follows that the former is meant]: (S, K:) in\
                \ the “ Mufradát,” [he gave him as food] the flesh of the سَبُع. (TA.) A4:  He gave him, or delivered him,\
                \ (namely, his son,) to the ظُؤُورَة [which means both nurse and nurses]. (S, K.) b2: He left him to himself;\
                \ or left him without work, or occupation; namely, his slave; syn. أَهْمَلَهُ. (S, K.) [See مُسْبَعٌ.]8 إِسْتَبَعَ\
                \ see 1.\nQ. Q. 1 سَبْعَنَ: see 2. last sentence but one.\nسَبْعٌ fem. of سَبْعَةٌ, q. v.\nA2:  See also سَبُعٌ\
                \ in two places.\nA3:  السَّبْعُ The place to which mankind shall be congregated (K, TA) on the day of resurrection.\
                \ (TA.) Hence the trad., (K, TA,) which relates that while a pastor was among his sheep, or goats, the wolf\
                \ rushed upon him, and took from them a sheep, or goat, and the pastor pursued him until he rescued it from\
                \ him; whereupon the wolf looked aside towards him, and said to him, (TA,) مَنْ لَهَا يَوْمَ السَّبْعِ, meaning\
                \ Who will be for it [namely, the sheep, or goat, as aider, or defender,] on the day of resurrection? (K,\
                \ TA:) thus expl. by I Aar, and mentioned by Sgh and the author of the L: (TA:) but to this is contradictory,\
                \ or repugnant, يَعْكُرُ, [in the CK erroneously written يَعْكَرُ,]) the saying of the wolf, (K, TA,) after\
                \ the words mentioned above, (TA,) “ the day when it shall have no pastor but me; ” for the wolf will not\
                \ be a pastor on the day of resurrection: or the meaning is, who shall be for it on the occasion of trials,\
                \ when it shall be left to itself, without pastor, a spoil to the animals of prey: the animal of prey being\
                \ thus made to be a pastor to it: (K, TA:) this is in the way of a trope: and accord. to this explanation,\
                \ it may be [↓ يَوْمَ السَّبُعِ] with damm to the ب: (TA:) or يَوْمُ السَّبْعِ was a festival of their's in\
                \ the Time of Ignorance, on which they were diverted from everything by their sport: (AO, K, TA:) and accord.\
                \ to one relation [of the trad.] it is with damm to the ب. (L, K.) سُبْعٌ (S, Msb, K) and ↓ سُبُعٌ, (Mgh,\
                \ Msb,) of which the former is a contraction, (Msb,) A seventh part; one of seven parts; (S, Mgh, Msb, K;)\
                \ as also ↓ سَبِيعٌ; (S, Msb, K;) the last not heard by Sh on any authority beside that of Az: (TA:) pl. of\
                \ the first (Msb) and second (Mgh, Msb) أَسْبَاعٌ. (Mgh, Msb, TA.) Hence, أَسْبَاعٌ القُرْآنِ [The seven sections,\
                \ or volumes, of the Kur-an,] in which one reads: said to be postclassical. (Mgh.) A2:  See also أُسْبُوعٌ,\
                \ in three places.\nسِبْعٌ A certain ظِمْء of the أَظْمَآء of camels; (T, S, K;) i. e. their coming to the\
                \ water on the seventh day [counting the day of the next preceding watering as the first]; (K;) or [in other\
                \ words, which have virtually the same meaning,] their remaining in their places of pasturing five complete\
                \ days, and coming to the water on the sixth day, not reckoning the day of the [next preceding] return from\
                \ the water. (Az, TA.) You say, وَرَدَتْ إِبْلُهُ سِبْعًا His camels came to the water &c. (S, K.) b2:  Also\
                \ The seventh young one, or offspring. (A in art. ثلث.) سَبَعٌ: see what next follows.\nسَبُعٌ (S, Sgh, Msb,\
                \ K) and ↓ سَبْعٌ, (Sgh, Msb, K,) a dial. var., (Sgh, Msb,) and the form in common use with the vulgar, (Msb,)\
                \ adopted also by several readers of the Kur in v. 4, (Msb, TA,) and often occurring in the poems of the Arabs,\
                \ (TA,) and ↓ سَبَعٌ, (Sgh, K,) a form adopted by two readers of the Kur in the place above mentioned, and\
                \ perhaps a dial. var., (Sgh, TA,) The animal of prey; the rapacious animal; (K;) [whether beast or bird;\
                \ being sometimes applied to the latter, as, for instance, in the K, voce مِخْلَبٌ; but generally to the former:]\
                \ or whatsoever has a fang, or canine tooth, with which it makes hostile attacks, and seizes its prey; (Msb;)\
                \ such as the lion, [to which it is particularly applied by most of the Arabs in the present day,] and also\
                \ (TA) such as the wolf and the lynx and the leopard, (Msb, TA,) and the like of these, that has a fang, and\
                \ attacks men and beasts and makes them its prey: (TA:) the fox, however, is not thus called, though having\
                \ a fang, (Msb, TA,) because he does not attack with it nor take prey, (Msb,) or because he does not attack\
                \ small beasts, nor seize with his fang any animal; (TA;) and in like manner the hyena (Msb, TA) is not reckoned\
                \ among the hostile animals thus called, wherefore the Sunneh allows that its flesh may be eaten, and requires\
                \ that a compensation be made for it [by the sacrifice of a ram] if it be smitten [and killed] in the sacred\
                \ territory or by a person in the state of ihrám: but as to the jackal, it is a noxious سبع, and its flesh\
                \ is unlawful, because it is of the same kind as wolves, except that it is smaller in size and weaker in body:\
                \ thus says Az: but some others say that the سبع is any hostile beast having a مِخْلَب [or tearing claw]:\
                \ and it is said in the Mufradát to be thus called because of the perfectness of its strength; for السَّبْعُ\
                \ [seven] is one of the perfect numbers: (TA:) the pl. is سِبَاعٌ, (Sb, S, Msb, K,) i. e., of سَبُعٌ, which\
                \ has no other pl.; (Sb, Msb;) أَسْبُعٌ is also a pl., (Sgh, Msb, K,) but this is pl. of pauc. of ↓ سَبْعٌ,\
                \ (Sgh, Msb,) which, not being a contraction [of سَبُعٌ, but a dial. var. thereof], has also for its pls.\
                \ [of mult.]\nسُبُوعٌ and سُبُوعَةٌ, like صُقُورٌ and صُقُورَةٌ, pls. of صَقْرٌ. (TA.) See also سَبْعٌ: [and\
                \ see سَبُعَةٌ.] You say of him who is very injurious, or mischievous, مَا هُوَ إِلَّا سَبُعٌ مِنَ السِّبَاعِ\
                \ (tropical:)  [He is none other than one of the animals of prey]. (TA.) b2: السَّبُعُ is also the name of\
                \ (assumed tropical:)  The constellation [Lupus] behind [i. e. on the east of] Centaurus, containing nineteen\
                \ stars in the figure. (Kzw.) سُبُعٌ: see سُبْعٌ.\nسَبْعَةٌ, (S, K,) sometimes pronounced ↓ سَبَعَةٌ but some\
                \ disallow this latter, and say that it is pl. of سَابِعٌ, (K,) [Seven;] a well-known number; and called one\
                \ of the perfect numbers: (TA:) fem. سَبْعٌ. (S, K.) You say, سَبْعَةُ رِجَالٍ [Seven men]: and سَبْعُ نِسْوَةٍ\
                \ [seven women]. (S, K.) b2: أَخَذَهُ أَخْذَ سَبْعَةٍ: see سَبُعَةٌ. b3:  وَزْنَ سَبْعَةٍ means Of the weight\
                \ of seven مَثَاقِيل: (S, K:) one says, أَخَذْتُ مِنْهُ مِائَةَ دِرْهَمٍ وَزْنَ سَبْعَةٍ, meaning [I took,\
                \ or received, from him a hundred dirhems] every ten whereof were of the weight of seven mithkáls. (TA.) [But\
                \ see دِرْهَمٌ.] b4:  إِحْدَى مِنْ سبْعٍ [lit. One of seven;] means (assumed tropical:)  a great, momentous,\
                \ or difficult, thing, or affair: (Sh, K: *) an affair difficult to decide: perhaps as being likened to one\
                \ of the seven nights in which God sent the punishment upon [the tribe of]\n'Ád: or, as some say, the seven\
                \ years [of famine in the days] of Joseph. (Sh, TA.) b5:  السَّبْعُ المَثَانِى The Fátihah; [or first chapter\
                \ of the Kur-án;] because it consists of seven verses: or the long chapters from البَقَرَة to الأَعْراف [a\
                \ mistake for الأَنْفَال]; as in the Mufradát: or, as in the L, to التَّوْبَة, reckoning التوبة and الانفال\
                \ as one chapter, for which reason they are not separated by the بَسْمَلَة. (TA.) [See also مَثْنًى.]\nb6:\
                \  El-Farezdak says, وَكَيْفَ أَخَافُ النَّاسَ وَاللّٰهُ قَابِضٌ عَلَى النَّاسِ وَالسَّبْعَيْنِ فِى رَاحَةِ\
                \ اليَدِ meaning [And how should I fear men when God is comprehending mankind and] the seven heavens and seven\
                \ earths [in the palm of the hand?]. (K.) b7:  See also أُسْبُوعٌ; last sentence. b8:  [سَبْعَةٌ is also used\
                \ in a vague manner, as meaning Seven or more; or several; or many; as Bd says, in ix. 81, and as is indicated,\
                \ though not plainly declared, in the TA. See 2: and see also سَبْعُونَ. b9:  Respecting a peculiar pronunciation\
                \ of the people of El-Hijáz, and a case in which سَبْعَة is imperfectly decl., see ثَلَاثَةٌ. See also سِتَّةٌ.]\
                \ b10:  سَبْعَةَ عَشَرَ [indecl. in every case, meaning Seventeen,] is pronounced by some of the Arabs سَبْعَةَ\
                \ عْشَرَ: and [the fem.] سَبْعَ عَشْرَةَ, thus in the dial. of El-Hijáz [and of most of the Arabs], is pronounced\
                \ سَبْعَ عَشِرَةَ in the dial. of Nejd. (S in art. عشر.) A2:  See also سَبُعَةٌ, in two places.\nسَبَعَةٌ:\
                \ see سَبْعَةٌ.\nسَبُعَةٌ and ↓ سَبْعَةٌ, the latter a contraction of the former, The lioness. (ISk, S, Msb,\
                \ K.) Hence the saying, ↓ أَخَذَهُ أَخَذَ سَبْعَةٍ, (ISk, S, K,) or السَّبْعَةِ, (Msb,) He seized him with\
                \ the seizing of a lioness, (ISk, S, K,) or of the lioness, (Msb,) which is more impetuous (أَنْزَقُ) than\
                \ the lion, (ISk, S,) or more bold than the lion: (Msb:) or the saying is, أَخَذَهُ أَخْذَ سَبْعَةَ (S, K)\
                \ he seized him with the seizing of Seb'ah, who was a certain strong man, (Ibn-El-Kelbee, S,) or a certain\
                \ insolent and audacious rebel, (Ibn-El-Kelbee, Lth, K,) of the Arabs, (TA,) whom one of the kings of El-Yemen\
                \ seized, and, after having cut off his hands and feet, or arms and legs, crucified; [so that the meaning\
                \ is, he punished him with the punishment of Seb'ah;] and hence it was said, لَأُعَذِّبَنَّكَ عَذَابَ سَبْعَةَ\
                \ [I will assuredly punish thee with the punishment of Seb'ah]; (El-Kelbee, Lth, K; *) and لَأَعْمَلَنَّ بِكَ\
                \ عَمَلَ سَبْعَةَ I will assuredly do with thee as was done with Seb'ah: (O:) or the man's name was سَبُعٌ,\
                \ and it was contracted, and made fem. by way of contempt: or the meaning of the first saying is, he seized\
                \ him with the seizing of seven men: (K:) and in like manner the last saying is expl. by some [who say سَبْعَةٍ\
                \ instead of سَبْعَةَ]. (TA.) The dim. is ↓ سُبَيْعَةٌ. (Msb.) [See also سَبُعٌ.]\nسَبُعِىٌّ Of, or relating\
                \ to, an animal of prey.]\nسَبْعُونَ [Seventy;] a well-known number; (K;) the round number that is between\
                \ سِتُّونَ and ثَمَانُونَ. (TA.) \nb2:  The Arabs also use it as meaning [Seventy or more; or] many. (TA.)\
                \ Thus it is used in the Kur [ix. 81], where it is said, إِنْ تَسْتَغْفِرْ لَهُمْ سَبْعِينَ مَرَّةً فَلَنْ\
                \ يَغْفِرَ اللّٰهُ لَهُمْ, meaning If thou beg forgiveness for them many times, even then God will not forgive\
                \ them; not that God would forgive them if forgiveness were begged more than seventy times: (Bd, * TA:) and\
                \ سَبْعَةٌ and سَبْعُمِائَةٍ and the like are used in the same manner. (Bd.) b3:  [Also Seventieth.]\nسُبَاعَ\
                \ as meaning Seven and seven, or seven and seven together, or seven at a time and seven at a time, seems not\
                \ to have been used; for] A'Obeyd  says that more than أُحَادَ and ثُنَآءَ and ثُلَاثَ and رُبَاعَ has not\
                \ been heard, excepting عُشَارَ. (TA in art. عشر.) سَبُوعٌ [app. Wont to frighten]: (TA: [in which the meaning\
                \ here given seems to be indicated.]) سُبُوعٌ: see أُسْبُوعٌ, in four places.\nسَبِيعٌ: see سُبْعٌ: b2:  and\
                \ سَابعٌ.\nسُبَيْعَةٌ dim. of سَبُعَةٌ, q. v.\nسُبَاعِىٌّ A garment, or piece of cloth, seven cubits, or seven\
                \ spans, in length. (TA.) b2:  A great and tall camel; (En-Nadr, K;) [as though seven cubits in height:] fem.\
                \ with ة. (K.). and سُبَاعِىُّ البَدَنِ, (S, K,) applied to a man, has the like meaning; (K;) complete, or\
                \ full-grown, in body; (S, TA;) [or seven spans in height; for] when a boy has attained seven spans, he is\
                \ a man. (S, voce خُمَاسِىٌّ, q. v.) سَابِعٌ [act. part. n. of 1: generally meaning Seventh]: pl. سَبَعَةٌ.\
                \ (K.) You say, كُنْتُ سَابِعَهُمْ [I was the seventh of them]. (S, K.) And هٰذَا هٰذَا ↓ سَبِيعُ, meaning\
                \ سَابِعُهُ [This is the seventh of this: not the seventh part; though the former has also this latter meaning].\
                \ (TA.) And هُوَ سَابِعُ سَبْعَةٍ [He is the seventh of seven]. (TA.) And هُوَ سَابِعٌ سِتَّةً [He is making\
                \ six to become seven]. (TA.) b2:  إِبِلٌ سَوَابِعُ [pl. of سَابِعَةٌ] Camels  coming to the water on the\
                \ seventh day [counting the day of the next preceding watering as the first]. (TA.) [See سِبْعٌ.] b3:  [سَابِعَ\
                \ عَشَرَ and سَابِعَةَ عَشْرَةَ, the former masc. and the latter fem., meaning Seventeenth, are subject to\
                \ the same rules as ثَالِثَ عَشَرَ and its fem., expl. in art. ثلث, q. v.]\nأُسْبُوعٌ A certain number of\
                \ days; (S, * Msb, K; *) i. e. seven days; a week; (Msb;) also  termed ↓ سُبُوعٌ, (Lth, Msb, K,) by some of\
                \ the Arabs; (Lth, Msb;) [and ↓ سُبْعٌ, as shown by what follows:] pl. of the first أَسَابِيعُ. (Msb, TA.)\
                \ One says, ↓ أَقَمْتُ عِنْدَهُ سُبْعَيْنِ [in the sense of أُسْبُوعَيْنِ, which is more common,] i. e. I\
                \ remained at his abode two weeks. (TA.) b2: Also The seventh day; and so ↓ سُبُوعٌ; as in a trad., where\
                \ it is said, إِذَا كَانَ يَوْمَ سُبُوعِهِ, meaning When his seventh day after the celebration of his marriage\
                \ is come. (TA.) [↓ يَوْمُ السُّبُوعِ is used in this sense in the present day: and also as meaning The seventh\
                \ day after childbirth; in which sense it is generally to be understood when used unrestrictedly; as this\
                \ day is celebrated with more rejoicing than the former: also as meaning the seventh day after the return\
                \ from pilgrimage.] b3: And Seven circuitings [round the House of God, meaning the Kaabeh]: (Lth, Mgh, Msb:)\
                \ pl. أَسَابِيعُ (S, Mgh, Msb) and أُسْبُوعَاتٌ. (Lth, Mgh, Msb.) You say, طَافَ بِالبَيْتِ أُسْبُوعًا, (S,\
                \ Mgh, * K,) and ↓ سُبُوعًا, (Lth, IDrd, K,) but A boo Sa'eed  says, I know not any one who has said this\
                \ except IDrd, and the former is the word commonly known, (TA,) and ↓ سَبْعًا, (K,) and ↓ سُبْعًا, (TA,) He\
                \ circuited round the House [of God] seven times, (S, TA,) or seven circuitings; (Mgh;) and ثَلَاثَةَ أَسَابِيعَ\
                \ [thrice seven times, or thrice seven circuitings]. (S.) مُسْبَعٌ Given, or delivered, to the ظُؤُورَة [which\
                \ means both nurse and nurses]: (Skr, S, TA:) this is the primary signification: (Skr:) or whose mother dies,\
                \ and who is therefore suckled by another; (K; in which the next following signification may be regarded as\
                \ implied, TA;) left  to himself; or left without work, or occupation; applied to a slave; syn. مُهْمَلٌ:\
                \ (Skr, S:) or مُتْرَفٌ, (Sgh, K,) [which has the same and other significations; or] which is [here] nearly\
                \ the same as مُهْمَلٌ, for he who is مُهْمَل is usually مُتْرَف: (TA:) or one who is left to himself with\
                \ the سِبَاع [or animals of prey] so that he becomes like one of them in mischievousness, or noxiousness,\
                \ or evilness: (AO, K:) or who is left to himself and not restrained from his daringness, so that he remains\
                \ daring: and a slave left to himself, and daring; left until he has become like the سَبُع: (TA:) or one whose\
                \ origin is suspected; (K;) whose father is not known: (Er-Rághib, Sgh:) or a bastard: (K:) or one whose lineage\
                \ is of slaves, (K, TA,) or ignoble, (TA,) up to seven male ancestors, (K, TA,) or, to seven female ancestors;\
                \ (TA;) or, to four male ancestors; (En-Nadr, K;) or whose lineage is traced up to four female ancestors all\
                \ of them slaves: (TA:) or born at seven months; (K, TA;) not matured by the womb, his months not being completed.\
                \ (Az, IF, TA.) مُسْبِعٌ One whose camels come to the water on the seventh day [counting the day of the next\
                \ preceding watering as the first]. (TA.) A2:  A slave finding a سَبُع [or rapacious animal] among  his sheep,\
                \ or goats. (Aboo-Sa'eed Ed-Dareer, S.) أَرْضٌ مَسْبَعَةٌ, (S, Mgh, Msb, K,) with fet-h (S, Msb) to the first\
                \ and third letters, (Msb,) like  مَرْحَلَةٌ, (K) and مَذْأَبَةٌ, with an inseparable ة, (Sb,) A land containing,\
                \ (S,) or abounding with, (Mgh, Msb, K,) سِبَاع [or animals of prey]. (S, Mgh, Msb, K.) مُسَبَّعٌ A verse\
                \ consisting of seven feet. (TA.) b2:  A camel having, in the middle part of his back, between the withers\
                \ and the rump, seven vertebrae redundant [app. meaning in size]. (TA.) b3:  [See also مُثَلَّثٌ.]\nمَسْبُوعٌ\
                \ A rope consisting of seven strands. (M, voce مَثْلُوثٌ.) A2:  With ة, A cow, (S, TA,) [app. meaning a wild\
                \ cow,] or [other] female wild animal, (TA,) whose offspring has been eaten by the سَبُع [or beast, or bird,\
                \ of prey]. (S, TA.) مُتَسَبَّعٌ The place of a سَبُع [or beast, or bird, of prey]. (TA.)"
