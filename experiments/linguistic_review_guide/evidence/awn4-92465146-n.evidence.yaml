            definitions_text: 'سَبْعَةُ رِجالٍ، وقد يُحَرَّكُ، وأنْكَرَهُ بعضُهم، وقال: المُحَرَّكُ: جَمْعُ سابعٍ. وسَبْعُ
              نِسْوَةٍ، وأخَذَه أخْذَ سَبْعَةٍ، ويُمْنَعُ،إمّا أصْلُها: سَبُعَةٌ بضم البَاءِ فَخُفِّفَ، أيْ: لَبُؤَةٌ، وإمّا
              اسمُ رجُلٍ مارِدٍ، أخَذَهُ بَعْضُ المُلوكِ، فَقَطَعَ يَدَيْهِ ورِجْلَيْهِ وصَلَبَهُ، فَقيلَ: لأَعَذِّبَنَّكَ
              عَذابَ سَبْعَةٍ، أو كانَ اسْمُهُ سَبْعاً، فَصُغِّرَ وحُقِّرَ بالتَّأْنيثِ، أو مَعْناهُ: أخَذَهُ أخْذَ سَبْعَةِ
              رِجالٍ، ووَزْنُ سَبْعَةٍ يَعْنونَ: سَبْعَةَ مَثَاقيلَ. وجَوْذانُ بنُ سَبْعَةَ: تابعيٌّ.والسَّبْعُ: ة بَيْنَ
              الرَّقَّةِ ورَأْسِ عَيْنٍ،وع بَيْنَ القُدْسِ والكَرَكِ، لأنَّ به سَبْعَ آبارٍ، والمَوْضِعُ الذي يكونُ إليه المَحْشَرُ،
              ومنه الحديثُ: "مَن لها يومَ السَّبْعِ"، أي مَن لها يومَ القيامةِ، أو يَعْكُرُ على هذا قولُ الذئب: يومَ لا يكونُ
              لها راعٍ غيرِي، والذئبُ لا يكونَ راعياً يومَ القيامةِ، أو أرادَ: مَن لها عندَ الفِتَنِ حينَ تُتْرَكُ بِلا راعٍ
              نُهْبَةً لِلسِّباعِ؟ فَجَعَلَ السَّبْعَ لها راعياً إذْ هو مُنْفَرِدٌ بها،أو يومُ السَّبْعِ: عيدٌ لهم في الجاهِلِيَّةِ،
              كانوا يَشْتَغِلونَ فيه بِلَهْوِهِم عن كلِّ شيءٍ، ورُوِيَ بضم الباءِ، ويقالُ للأمرِ المُتَفاقِمِ: إحْدَى من سَبْعٍ،
              وقولُ الفَرَزْدَقِ:وكيفَ أخافُ الناسَ والله قابِضٌ ... على الناسِ والسَّبْعَيْنِ في راحَةِ اليَدِأي: سَبْعِ
              سَماواتٍ وسَبْعِ أرَضينَ. والحَسَنُ بنُ علِيِّ بنِ وهبٍ، وبكرُ بنُ مُحمدِ بنِ سَهْلٍ، وسهلُ بنُ إبراهيمَ، وابنُهُ
              أحمدُ، وحَفيدُهُ مُحمدٌ السَّبْعِيُّونَ: محدِّثونَ.والسَّبُعُ، بضم الباءِ وفتحها وسُكونِها: المُفْتَرِسُ من
              الحَيَوانِ، ج: أسْبُعٌ وسِباعٌ،وأرضٌ مَسْبَعَةٌ، كَمَرْحَلَةٍ: كثيرَتُهُ.وذاتُ السِّباعِ، ككِتابٍ: ع.ووادِي
              السِّباعِ: بطَرِيقِ الرَّقَّةِ، مَرَّ به وائلُ بنُ قاسِطٍ على أسْماءَ بنتِ دُرَيْمٍ، فَهَمَّ بها حين رآها مُنْفَرِدَةً
              في الخباءِ، فقالتْ له: والله لئن هَمَمْتَ بِي لَدَعَوْتُ أسْبُعِي، فقال: ما أَرَى في الوادي غيرَكِ، فَصاحَتْ
              بِبَنِيها: يا كَلْبُ يا ذئبُ يا فَهْدُ يا دُبُّ يا سِرْحانُ يا سِيدُ يا ضَبُعُ يا نَمِرُ، فجاؤوُا يَتَعادَوْنَ
              بالسُّيوف، فقال: ما أرَى هذا إلا وادِيَ السِّباعِ،والسَّبْعِيَّةُ: ماءَةٌ لبني نُمَيْرٍ.والسَّبْعونَ: عَدَدٌ
              م، ومحمدُ بنُ سَبْعونَ المُقْرِئُ المَكّيُّ، وعبدُ الله بنُ سَبْعونَ: محدّثٌ.وسَبْعينُ: ة بحَلَبَ، كانت إقْطاعاً
              للمُتَنَبِّئ من سَيْفِ الدَّوْلَةِ.والسَّبُعانُ، بضم الباءِ: ع ببلادِ قَيْسٍ.والسَّبْعَةُ، وتُضَمُّ الباءُ:
              اللبُؤَةُ. وككتابٍ: ابنُ ثَابِتٍ، وابنُ زَيْدٍ، وابنُ عُرْفُطَةَ. وكزبيرٍ: ابنُ حاطِبٍ، وابنُ قَيْسٍ: صحابيُّونَ.
              وكجُهَيْنَةَ: بنتُ الحارِثِ، وبنتُ حَبيبٍ: صحابيَّتانِ.والسِّبْعُ، بالكسر: ظِمْءٌ من أظْماءِ الإِبِلِ، وهو أن
              تَرِدَ في اليومِ السابعِ، وبالضم، وكأَميرٍ: جُزْءٌ من سَبْعَةٍ.وسَبَعَهُم، كضَرَبَ ومَنَعَ: كان سابِعَهُم، أو
              أخَذَ سُبْعَ أموالِهِموـ الذِّئبَ: رَماهُ، أو ذَعَرَهُ،وـ فلاناً: شَتَمَهُ، وَوَقَعَ فيه أو عضَّه،وـ الشيءَ:
              سَرَقَه،كاسْتَبَعَه،وـ الذئبُ الغَنَمَ: فَرَسَهَا،وـ الحَبْلَ: جَعَلَهُ على سَبْعِ طاقاتٍ،والسُّباعِيُّ، بالضم:
              الجَمَلُ العظيمُ الطويلُ، وهي بهاءٍ.ورجُلٌ سُباعِيُّ البَدَنِ: كذلك.والأسْبوعُ من الأيَّامِ،والسُّبُوعُ، بضمهما:
              م. وطافَ بالبَيْتِ سَبْعاً وأُسْبوعاً وسُبوعاً. وكأَميرٍ: السَّبيعُ بنُ سَبْعٍ، أبو بَطْنٍ من هَمْدانَ، منهم:
              الإِمامُ أبو إسحاقَ عَمْرُو بنُ عبدِ الله، ومَحَلَّةٌ بالكوفة مَنْسوبَةٌ إليهم أيضاً. وأسْبَعَ: وَرَدَتْ إبِلُهُ
              سبْعاً،وـ القومُ: صاروا سَبْعَةً،وـ الرُّعْيانُ: وَقَعَ السَّبُعُ في مَواشِيهم،وـ ابْنَهُ: دَفَعَه إلى الظُّؤرةِ،وـ
              فلاناً: أطْعَمَه السَّبُعَ،وـ عَبْدَهُ: أَهْمَلَه.والمُسْبَعُ، كمُكْرَمٍ: المُتْرَفُ، أو الدَّعِيُّ، أو وَلَدُ
              الزِّنا، أو من تموت أمُّهُ فَيُرْضِعُهُ غيرُها، أو مَنْ في العُبودِيَّةِ إلى سَبْعَةِ آباءٍ، أو إلى أربَعَةٍ،
              أو من أُهْمِلَ مع السِّباعِ فَصارَ كَسَبُعٍ خُبْثاً، أو المَوْلودُ لسَبْعَةِ أشهرٍ.وسَبَّعَهُ تَسْبيعاً: جَعَلَهُ
              سَبْعَةً، وجَعَلَه ذا سَبْعَةِ أرْكانٍ،وـ الإِناءَ: غَسَلَهُ سَبْعَ مَرَّاتٍ،وـ اللهُ لَكَ: أعْطاكَ أجْرَكَ
              سَبْعَ مَرَّاتٍ أو سَبْعَةَ أضْعافٍ،وـ القرآنَ: وظَّفَ عليه قِراءَتَهُ في كلِّ سَبْعِ لَيالٍ،وـ لامْرَأتِهِ:
              أقامَ عندَها سَبْعَ لَيالٍ،وـ دَراهمَهُ: كَمَّلَها سَبْعينَ، وهذه مُوَلَّدَةٌ،وـ القومُ: تمَّتْ سَبْعَ مِئَةِ
              رجُلٍ.والسِّباعُ، ككتابٍ: الجِماعُ، والفَخَارُ بكَثْرَتِهِ، والرَّفَثُ، والتَّشاتُمُ.'
