            definitions_text: 'الإبِلُ: وردت الماءَ سَبْعًا. فهى سابعةٌ فلانٌ القومَ: صار سابعَهم. يقال: هو سابعُ ستةٍ فلانٌ
              القومَ: أَخَذَ سُبْعَ أموالهم الحبلَ: جعله على سَبْعِ قُوًى (طاقات) الوحْشُ الغَنَمَ, وَنَحْوَها: افترسَها فلانٌ
              فلانًا: عَضَّهُ بأَسْنانه فلانٌ فلانًا: ذَعَرَه فلانٌ فلانًا: عابه وشَتَمَه. وقيل: انْتَقصه ووَقَع فيه ورماه
              بما يَسوء فلانًا عند السلطان: طَعَن فيه فلانًا: قَتَلَهُ الشَّىْءَ: سَرَقَه الذِّئْبَ, ونحوه: رماه بسَهْم وذَعَره'
