              text: "سبع: السَّبْعُ والسبْعةُ من العدد: معروف، سَبْع نِسوة وسبْعة رجال،\nوالسبعون معروف، وهو العِقْد الذي\
                \ بين الستين والثمانين. وفي الحديث:\nأُوتِيتُ السبع المَثاني، وفي رواية: سبعاً من المثاني، قيل: هي الفاتحة\n\
                لأَنها سبع آيات، وقيل: السُّوَرُ الطِّوالُ من البقرة إِلى التوبة على أَن\nتُحْسَبَ التوبةُ والأَنفالُ سورةً\
                \ واحدة، ولهذا لم يفصل بينهما في المصحف\nبالبسملة، ومن في قوله «من المثاني» لتبيين الجنس، ويجوز أَن تكون\n\
                للتبعيض أَي سبع آيات أَو سبع سور من جملة ما يثنى به على الله من الآيات.\nوفي الحديث: إِنه لَيُغانُ على قلبي\
                \ حتى أَستغفر الله في اليوم سبعين مرة،\nوقد تكرر ذكر السبعة والسبع والسبعين والسبعمائة في القرآن وفي الحديث\n\
                والعرب تضعها موضع التضعيف والتكثير كقوله تعالى: كمثل حبة أَنبتت سبع\nسنابل، وكقوله تعالى: إِن تستغفر لهم سبعين\
                \ مرة فلن يغفر الله لهم، وكقوله:\nالحسنة بعشر أَمثالها إِلى سبعمائة.\nوالسُّبُوعُ والأُسْبُوعُ من الأَيام:\
                \ تمام سبعة أَيام. قال الليث:\nالأَيام التي يدور عليها الزمان في كل سبعة منها جمعة تسمى الأُسْبُوع ويجمع\n\
                أَسابِيعَ، ومن العرب من يقول سُبُوعٌ في الأَيام والطواف، بلا أَلف،\nمأْخوذة من عدد السَّبْع، والكلام الفصيح\
                \ الأُسْبُوعُ. وفي الحديث: أَنه،\nصلى الله عليه وسلم، قال: للبِكر سَبْع وللثَّيِّب ثلاث يجب على الزوج أَن\n\
                يَعْدِلَ بين نسائِه في القَسْمِ فيقيم عند كل واحدة مثل ما يقيم عند\nالأُخرى، فإِن تزوج عليهن بكراً أَقام عندها\
                \ سبعة أَيام ولا يحسبها عليه\nنساؤه في القسم، وإِن تزوج ثيِّباً أَقام عندها ثلاثاً غير محسوبة في\nالقسم.وقد\
                \ سَبَّعَ الرجل عند امرأَته إِذا أَقام عندها سبع ليال. ومنه الحديث:\nأَن النبي، صلى الله عليه وسلم، قال لأُم\
                \ سلمة حين تزوجها، وكانت\nثيِّباً: إِن شِئْتِ سَبَّعْتُ عِنْدَكِ ثم سَبَّعْتُ عند سائر نسائي، وإِن\nشِئْتِ\
                \ ثَلَّثْتُ ثم درت لا أَحتسب بالثلاث عليك؛ اشتقوا فَعَّلَ من الواحد\nإِلى العشرة، فمعنى سَبَّعَ أَقام عندها\
                \ سبعاً، وثَلَّثَ أَقام عندها\nثلاثاً، وكذلك من الواحد إِلى العشرة في كل قول وفعل.\nوفي حديث سلمة بن جُنادة:\
                \ إِذا كان يوم سُبُوعه، يريد يوم أُسْبوعه من\nالعُرْس أَي بعد سبعة أَيام. وطُفْتُ بالبيت أُسْبُوعاً أَي سبع\
                \ مرات\nوثلاثة أَسابيعَ. وفي الحديث: أَنه طاف بالبيت أُسبوعاً أَي سبع مرات؛ قال\nالليث: الأُسْبوعُ من الطواف\
                \ ونحوه سبعة أَطواف، ويجمع على أُسْبوعاتٍ،\nويقال: أَقمت عنده سُبْعَيْنِ أَي جُمْعَتَينِ وأُسْبوعَين. وسَبَعَ\
                \ القومَ\nيَسْبَعُهم، بالفتح، سَبْعاً: صار سابعهم. واسْتَبَعُوا: صاروا سَبْعةً.\nوهذا سَبِيعُ هذا أَي سابِعُه.\
                \ وأَسْبَعَ الشيءَ وسَبَّعَه: صَيَّره\nسبعة. وقوله في الحديث: سَبَّعَتْ سُلَيم يوم الفتح أَي كمَلَت سبعمائة\
                \ رجل؛\nوقول أَبي ذؤيب:\nلَنَعْتُ التي قامَتْ تُسَبِّعُ سُؤْرَها،\nوقالَتْ: حَرامٌ أَنْ يُرَحَّلَ جارها\n\
                يقول: إِنَّكَ واعتذارَك بأَنك لا تحبها بمنزلة امرأَة قَتَلَتْ قتيلاً\nوضَمَّتْ سِلاحَه وتحَرَّجَت من ترحيل\
                \ جارها، وظلت تَغْسِلُ إِناءَها من\nسُؤر كلبها سَبْعَ مرّات. وقولهم: أَخذت منه مائة درهم وزناً وزن سبعة؛\n\
                المعنى فيه أَن كل عشرة منها تَزِنُ سبعة مَثاقِيلَ لأَنهم جعلوها عشرة\nدراهم، ولذلك نصب وزناً. وسُبعَ المولود:\
                \ حُلِقَ رأْسُه وذُبِحَ عنه لسبعة\nأَيام. وأَسْبَعَتِ المرأَةُ، وهي مُسْبِعٌ، وسَبَّعَتْ: ولَدَتْ لسبعة\n\
                أَشهر، والوَلدُ مُسْبَعٌ. وسَبَّعَ الله لك رزَقَك سبعة أَولاد، وهو على\nالدعاء. وسَبَّعَ الله لك أَيضاً: ضَعَّفَ\
                \ لك ما صنعت سبعة أَضعاف؛ ومنه\nقول الأَعرابي لرجل أَعطاه درهماً: سَبَّعَ الله لك الأَجر؛ أَراد\nالتضعيف.\
                \ وفي نوادر الأَعراب: سَبَّعَ الله لفلان تَسْبِيعاً وتَبَّع له\nتَتْبيعاً أَي تابع له الشيء بعد الشيء، وهو\
                \ دعوة تكون في الخير والشر، والعرب\nتضع التسبيع موضع التضعيف وإِن جاوز السبع، والأَصل قول الله عز وجل:\nكمثل\
                \ حبة أَنبتت سبع سنابل في كل سنبلة مائة حبة. ثم قال النبي، صلى الله\nعليه وسلم: الحسنة بعشر إِلى سبعمائة.\
                \ قال الأَزهري: وأَرى قول الله عز وجل\nلنبيه، صلى الله عليه وسلم: إِن تستغفر لهم سبعين مرة فلن يغفر الله\n\
                لهم، من باب التكثير والتضعيف لا من باب حصر العدد، ولم يرد الله عز وجل\nأَنه، عليه السلام، إِن زاد على السبعين\
                \ غفر لهم، ولكن المعنى إِن استكثرت\nمن الدعاء والاستغفار للمنافقين لم يغفر الله لهم. وسَبَّعَ فلان القرآن\n\
                إِذا وَظَّفَ عليه قراءته في سبع ليال. وسَبَّعَ الإِناءَ: غسله سبع مرات.\nوسَبَّعَ الشيءَ تسْبيعاً: جعله سبعة،\
                \ فإِذا أَردت أَن صيرته سبعين قلت:\nكملته سبعين. قال: ولا يجوز ما قاله بعض المولدين سَبَّعْتُه، ولا قولهم\n\
                سَبْعَنْتُ دَراهِمي أَي كَمَّلْتُها سَبْعِين.\nوقولهم: هو سُباعِيُّ البَدَن أَي تامُّ البدن. والسُّباعيُّ\
                \ من الجمال:\nالعظيم الطويل، قال: والرباعي مثله على طوله، وناقة سُباعِيَّةٌ\nورُباعِيَّةٌ. وثوب سُباعيّ إِذا\
                \ كان طوله سبعَ أَذْرُع أَو سَبْعةَ أَشبار لأَن\nالشبر مذكر والذراع مؤنثة.\nوالمُسْبَعُ: الذي له سبعة آباءٍ\
                \ في العُبُودة أَو في اللؤم، وقيل:\nالمسبع الذي ينسب إِلى أَربع أُمهات كلهن أَمَة، وقال بعضهم: إِلى سبع\n\
                أُمهات. وسَبَع الحبلَ يَسْبَعُه سَبْعاً: جعله على سبع قُوًى. وبَعِيرٌ\nمُسْبَعٌ إِذا زادت في مُلَيْحائِه سَبْع\
                \ مَحالات. والمُسَبَّعُ من العَرُوض:\nما بنى على سبعة أَجزاء. والسِّبْعُ: الوِرْدُ لسِتِّ ليال وسبعة أَيام،\n\
                وهو ظِمْءٌ من أَظْماء الإِبل، والإِبل سَوابِعُ والقوم مُسْبِعُون، وكذلك\nفي سائر الأَظْماءِ؛ قال الأَزهري:\
                \ وفي أَظْماء الإِبل السِّبْعُ، وذلك\nإِذا أَقامت في مَراعِيها خمسة أَيام كَوامِلَ ووردت اليوم السادس ولا\n\
                يحسَب يوم الصّدَر. وأَسْبَعَ الرجل: وَرَدَت إِبله سبْعاً.\nوالسَّبِيعُ: بمعنى السُّبُع كالثَّمين بمعنى الثُّمُن؛\
                \ وقال شمر: لم\nأَسمع سَبِيعاً لغير أَبي زيد. والسبع، بالضم: جزء من سبعة، والجمع\nأَسْباع. وسَبَعَ القومَ\
                \ يَسْبَعُهم سَبْعاً: أَخذ سُبُعَ أَموالِهم؛ وأَما قول\nالفرزدق:\nوكيفَ أَخافُ الناسَ، واللهُ قابِضٌ\nعلى\
                \ الناسِ والسَّبْعَيْنِ في راحةِ اليَدِ؟\nفإِنه أَراد بالسَّبْعَينِ سبْعَ سمواتٍ وسبعَ أَرَضِين. والسَّبُعُ:\n\
                يقع على ما له ناب من السِّباعِ ويَعْدُو على الناس والدوابّ فيفترسها مثل\nالأَسد والذِّئْب والنَّمِر والفَهْد\
                \ وما أَشبهها؛ والثعلبُ، وإِن كان له\nناب، فإِنه ليس بسبع لأَنه لا يعدو على صِغار المواشي ولا يُنَيِّبُ في\n\
                شيء من الحيوان، وكذلك الضَّبُع لا تُعَدُّ من السباع العادِيةِ، ولذلك\nوردت السُّنة بإِباحة لحمها، وبأَنها\
                \ تُجْزَى إِذا أُصِيبت في الحرم أَو\nأَصابها المحرم، وأَما الوَعْوَعُ وهو ابن آوى فهو سبع خبيث ولحمه حرام\n\
                لأَنه من جنس الذِّئابِ إِلاَّ أَنه أَصغر جِرْماً وأَضْعَفُ بدَناً؛ هذا\nقول الأَزهري، وقال غيره: السبع من\
                \ البهائم العادية ما كان ذا مِخلب،\nوالجمع أَسْبُعٌ وسِباعٌ. قال سيبويه: لم يكسَّر على غير سِباعٍ؛ وأَما قولهم\n\
                في جمعه سُبُوعٌ فمشعر أَن السَّبْعَ لغة في السَّبُع، ليس بتخفيف كما\nذهب إِليه أَهل اللغة لأَن التخفيف لا\
                \ يوجب حكماً عند النحويين، على أَن\nتخفيفه لا يمتنع؛ وقد جاء كثيراً في أَشعارهم مثل قوله:\nأَمِ السَّبْع فاسْتَنْجُوا،\
                \ وأَينَ نَجاؤُكم؟\nفهذا ورَبِّ الرّاقِصاتِ المُزَعْفَرُ\nوأَنشد ثعلب:\nلِسانُ الفَتى سَبْعٌ، عليه شَذاتُه،\n\
                فإِنْ لم يَزَعْ مِن غَرْبِه، فهو آكِلُهْ\nوفي الحديث: أَنه نهى عن أَكل كل ذي ناب من السباع؛ قال: هو ما يفترس\n\
                الحيوان ويأْكله قهراً وقَسْراً كالأَسد والنَّمِر والذِّئب ونحوها. وفي\nترجمة عقب: وسِباعُ الطير التي تَصِيدُ.\
                \ والسَّبْعةُ: اللَّبُوءَةُ. ومن\nأَمثال العرب السائرة: أَخَذه أَخْذ سَبْعةٍ، إِنما أَصله سَبُعةٌ فخفف.\n\
                واللَّبُوءَةُ أَنْزَقُ من الأَسد، فلذلك لم يقولوا أَخْذَ سَبُعٍ، وقيل:\nهو رجل اسمه سبْعة بن عوف بن ثعلبة\
                \ بن سلامانَ بن ثُعَل بن عمرو بن\nالغَوْث بن طيء بن أُدَد، وكان رجلاً شديداً، فعلى هذا لا يُجْرَى للمعرفة\n\
                والتأْنيث، فأَخذه بعض ملوك العرب فَنَكَّلَ به وجاء المثل بالتخفيف لما\nيؤثرونه من الخفة. وأَسْبَعَ الرجلَ:\
                \ أَطْعَمه السَّبُعَ، والمُسْبِعُ: الذي\nأَغارت السِّباعُ على غنمه فهو يَصِيحُ بالسِّباعِ والكِلابِ؛ قال:\n\
                قد أَسْبَعَ الرّاعي وضَوْضَا أَكْلُبُه\nوأَسْبَعَ القومُ: وقَع السَّبُع في غنمهم. وسَبَعت الذّئابُ الغنَم:\n\
                فَرَسَتْها فأَكلتها. وأَرض مَسْبَعةٌ: ذات سِباع؛ قال لبيد:\nإِليك جاوَزْنا بلاداً مَسْبَعَهْ\nومَسْبَعةٌ:\
                \ كثيرة السباع؛ قال سيبويه: باب مَسْبَعةٍ ومَذْأَبةٍ\nونظيرِهما مما جاء على مَفْعَلةٍ لازماً له الهاء وليس\
                \ في كل شيء يقال إِلا أَن\nتقيس شيئاً وتعلم مع ذلك أَن العرب لم تَكَلَّمْ به، وليس له نظير من\nبنات الأَربعة\
                \ عندهم، وإِنما خصوا به بناتِ الثلاثة لخفتها مع أَنهم\nيستغنون بقولهم كثيرة الذئاب ونحوها. وقال ابن المظفر\
                \ في قولهم لأَعْمَلَنّ\nبفلان عملَ سَبْعَةٍ: أَرادوا المبالغة وبلوغَ الغاية، وقال بعضهم: أَرادوا\nعمل سبعة\
                \ رجال.\nوسُبِعَتِ الوَحْشِيَّةُ، فهي مَسْبُوعةٌ إِذا أَكَل السبُعُ ولدها،\nوالمَسْبُوعةُ: البقرة التي أَكَل\
                \ السبعُ ولدَها. وفي الحديث: أَن ذئباً\nاختطف شاة من الغنم أَيام مَبْعَثِ رسولِ الله، صلى الله عليه وسلم،\n\
                فانتزعها الراعي منه، فقال الذئب: من لها يوم السبْع؟ قال ابن الأَعرابي: السبع،\nبسكون الباء، الموضعُ الذي يكونُ\
                \ إِليه المَحْشَرُ يومَ القيامة، أَراد\nمن لها يوم القيامة؛ وقيل: السبْعُ الذَّعْرُ، سَبَعْتُ فلاناً إِذا\n\
                ذَعَرْتَه، وسَبَعَ الذِّئْبُ الغنم إِذا فرسها، أَي من لها يومَ الفَزَع؛\nوقيل: هذا التأْويل يَفْسُد بقول الذئب\
                \ في تمام الحديث: يومَ لا راعِيَ لها\nغيري، والذئب لا يكون لها راعياً يوم القيامة، وقيل: إِنه أَراد من لها\n\
                عند الفتن حين يتركها الناس هملاً لا راعي لها نُهْبَة للذِّئاب\nوالسِّباع، فجعل السبُع لها راعياً إِذ هو منفرد\
                \ بها، ويكون حينئذ بضم الباء،\nوهذا إِنذار بما يكون من الشدائد والفتن التي يُهْمِلُ الناس فيها مواشيهم\nفتستمكن\
                \ منها السباع بلا مانع. وروي عن أَبي عبيدة: يومُ السبْعِ عِيدٌ\nكان لهم في الجاهلية يشتغلون بعيدهم ولَهْوِهِم،\
                \ وليس بالسبُع الذي يفترس\nالناس، وهذا الحرف أَملاه أَبو عامر العبدري الحافظ بضم الباء، وكان من\nالعلم والإِتقان\
                \ بمكان، وفي الحديث نهَى عن جُلودِ السِّباعِ؛ السباعُ:\nتَقَعُ على الأَسد والذئاب والنُّمُور، وكان مالك يكره\
                \ الصلاة في جُلودِ\nالسِّباعِ، وإِن دُبِغَتْ، ويمنع من بيعها، واحتج بالحديث جماعة وقالوا: إِن\nالدِّباغَ لا\
                \ يؤثِّر فيما لا يؤكل لحمه، وذهب جماعة إِلى أَن النهي\nتناولها قبل الدباغ، فأَما إِذا دُبِغَتْ فقد طهُرت؛\
                \ وأَما مذهب الشافعي فإِن\nالذَّبْحَ يطهر جُلود \n(* قوله «فان الذبح يطهر إلخ» هكذا في الأصل\nوالنهاية، والصحيح\
                \ المشهور من مذهب الشافعي: ان الذبح لا يطهر جلد غير\nالمأكول.) الحيوان المأْكول وغير المأْكول إِلا الكلب والخنزير\
                \ وما تَوَلَّدَ\nمنهما، والدِّباغُ يُطَهِّرُ كل جلد ميتة غيرهما؛ وفي الشعور والأَوبار\nخلاف هل تَطْهُر بالدباغ\
                \ أَم لا، إِنما نهى عن جلود السباع مطلقاً أَو عن\nجلد النَّمِر خاصّاً لأَنه ورد في أَحاديث أَنه من شِعار أَهل\
                \ السَّرَفِ\nوالخُيَلاءِ.\nوأَسبع عبده أَي أَهمله. والمُسْبَعُ: المُهْمَلُ الذي لم يُكَفَّ عن\nجُرْأَتِه فبقي\
                \ عليها. وعبدٌ مُسْبَعٌ: مُهْمَلٌ جَريءٌ ترك حتى صار\nكالسبُع؛ قال أَبو ذؤيب يصف حمار الوحش:\nصَخِبُ الشَّوارِبِ\
                \ لا يَزالُ كأَنَّه\nعَبدٌ، لآلِ أَبي رَبِيعةَ، مُسْبَعُ\nالشَّوارِبُ: مجارِي الحَلْق، والأَصل فيه مَجاري\
                \ الماء، وأَراد أَنه\nكثير النُّهاقِ، هذه رواية الأَصمعي، وقال أَبو سعيد الضرير: مُسْبِع، بكسر\nالباء، وزعم\
                \ أَن معناه أَنه وقع السباع في ماشيته، قال: فشبه الحمار وهو\nيَنْهَقُ بعبد قد صادفَ في غنمه سَبُعاً فهو يُهَجْهِجُ\
                \ به ليزجره عنها،\nقال: وأَبو ربيعة في بني سعد بن بكر وفي غيرهم ولكن جيران أَبي ذؤيب بنو\nسعد بن بكر وهم أَصحاب\
                \ غنم، وخص آل ربيعة لأَنهم أَسوأُ الناسِ مَلَكةً.\nوفي حديث ابن عباس وسئل عن مسأَلة فقال: إِحْدى من سَبْع\
                \ أَي اشتدّت\nفيها الفتيا وعَظُم أَمرها، يجوز أَن يكون شِبهها بإِحدى الليالي السبع التي\nأَرسل الله فيها العذاب\
                \ على عاد فَضَرَبَها لها مثلاً في الشدة\nلإِشكالها، وقيل: أَراد سبع سِنِي يوسف الصدِّيق، عليه السلام، في الشدة.\
                \ قال\nشمر: وخلق الله سبحانه وتعالى السموات سبعاً والأَرضين سبعاً والأَيام\nسبعاً. وأَسْبَعَ ابنه أَي دفعه\
                \ إِلى الظُّؤُورةِ. المُسْبَع: الدَّعِيُّ.\nوالمُسْبَعُ: المَدْفُوعُ إِلى الظُّؤُورةِ؛ قال العجاج:\nإِنَّ\
                \ تَمِيماً لم يُراضَعْ مُسْبَعا،\nولم تَلِدْه أُمُّهُ مُقَنَّعا\nوقال الأَزهري: ويقال أَيضاً المُسْبَعُ التابِعةُ\
                \ \n(* قوله «المسبع\nالتابعة» كذا بالأصل ولعله ذو التابعة اي الجنية.)، ويقال: الذي يُولَدُ\nلسبعة أَشهر فلم\
                \ يُنْضِجْه الرَّحِمُ ولم تَتِمّ شُهورُه، وأَنشد بيت العجاج.\nقال النضر: ويقال رُبَّ غلام رأَيتُه يُراضَعُ،\
                \ قال: والمُراضَعةُ أَنْ\nيَرْضَعَ أُمَّه وفي بطنها ولد.\nوسَبَعَه يَِْبَعُه سَبْعاً: طعن عليه وعابه وشتَمه\
                \ ووقع فيه بالقول\nالقبيح. وسَبَعَه أَيضاً: عَضَّه بسنه.\nوالسِّباعُ: الفَخْرُ بكثرة الجِماع. وفي الحديث:\
                \ أَنه نهَى عن\nالسِّباعِ؛ قال ابن الأَعرابي: السِّباعُ الفَخار كأَنه نهى عن المُفاخَرة\nبالرَّفَثِ وكثرة\
                \ الجماع والإِعْرابِ بما يُكَنّى به عنه من أَمر النساء، وقيل:\nهو أَن يَتَسابَّ الرجلان فيرمي كل واحد صاحبه\
                \ بما يسوؤه من سَبَعَه أَي\nانتقصه وعابه، وقيل: السِّباعُ الجماع نفسُه. وفي الحديث: أَنه صَبَّ\nعلى رأْسه\
                \ الماء من سِباعٍ كان منه في رمضان؛ هذه عن ثعلب عن ابن\nالأَعرابي.وبنو سَبِيعٍ: قبيلة. والسِّباعُ ووادي السِّباعِ:\
                \ موضعان؛ أَنشد\nالأَخفش:\nأَطْلال دارٍ بالسِّباعِ فَحَمَّةِ\nسأَلْتُ، فلمَّا اسْتَعْجَمَتْ ثم صَمَّتِ\nوقال\
                \ سُحَيْم بن وَثِيلٍ الرِّياحِي:\nمَرَرْتُ على وادِي السِّباعِ، ولا أَرَى،\nكَوادِي السِّباعِ حينَ يُظْلِمُ،\
                \ وادِيا\nوالسَّبُعانُ: موضع معروف في ديار قيس؛ قال ابن مقبل:\nأَلا يا دِيارَ الحَيِّ بالسَّبُعانِ،\nأَمَلَّ\
                \ عليها بالبِلى المَلَوانِ\nولا يعرف في كلامهم اسم على فَعُلان غيره، والسُّبَيْعان: جبلان؛ قال\nالراعي:\n\
                كأَني بِصَحْراءِ السُّبَيْعَينِ لم أَكُنْ،\nبأَمْثالِ هِنْدٍ، قَبْلَ هِنْدٍ، مُفَجَّعا\nوسُبَيْعٌ وسِباعٌ:\
                \ اسمان؛ وقول الراجز:\nيا لَيْتَ أَنِّي وسُبَيْعاً في الغَنَمْ،\nوالجرْحُ مِني فَوْقَ حَرّار أَحَمّْ\nهو اسم\
                \ رجل مصغر. والسَّبِيعُ: بطن من هَمْدانَ رَهْطُ أَبي إِسحق\nالسَّبِيعي. وفي الحديث ذكر السَّبِيعِ، هو بفتح\
                \ السين وكسر الباء مَحِلّة من\nمَحالِّ الكوفة منسوبة إِلى القبيلة، وهم بني سَبِيعٍ من هَمْدانَ.\nوأُمُّ الأَسْبُعِ:\
                \ امرأَة. وسُبَيْعةُ بن غَزالٍ: رجل من العرب له حديث.\nووزْن سَبْعةٍ: لقب."
