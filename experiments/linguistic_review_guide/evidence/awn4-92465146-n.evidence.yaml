                دُبِغَت ويمنع من بيعها. ويرى الانتفاع بها، واحَتجَّ بالحديث جماعةٌ وقالوا: إنّ الدِّباغَ لا يُؤثِّر فيما لا
                يُؤكَل لَحمُه.وذَهَب جماعة إلى أنّ النَّهى تناوَلَها قبل الدِّباغ، فأَمّا إذا دُبِغَت طَهُرت بدليل الأحاديث
                الأخرى.وتأوَّلَه أصحابُ الشافعي انَّ الدِّباغ يُطَهِّر جلودَ السِّباع دُون شعورها، وأنَّه إنما نُهِى عنها
                من أجل شَعَرها، لأنّ جُلودَ النُّمورِ ونَحوها إنّما تُستَعْمل مع بقاء الشَّعَر عليها، وشَعَر المَيْتَة نَجِسٌ،
                فإذا دُبغ ونُتِف شَعَره فإنه طاهرٌ، وقد يكون النَّهى عنها أيضاً مِن أَجل أنّها مَراكِبُ أهل السَّرَفِ والخُيَلاء،
                وقد جاء النَّهى عن ركوب جلد النَّمِر أَيْضاً .'
