            definitions_text: '(سبع) - قوله تبارك وتعالى: {سَبْعًا مِنَ الْمَثَانِي} يجوز أن يكون "من" للتَّبعيض؛ أي سَبْع
              آيات من جملة ما يُثْنَى به  على الله عزَّ وجلّ من الآيات.ويجوز أن يكون السَّبعُ هي "المَثَاني"، ويكون "من" للصِّفةِ
              كما قَالَ تَعالى: {فَاجْتَنِبُوا الرِّجْسَ مِنَ الَأوْثَانِ} ، لَا أنّ بَعضَها رِجسٌ دون بَعضويَجوزُ على هذا
              أن يكون المَعنَى سَبْعاً مَثاني. وقيل: السَّبع من المثاني: هي السبع الطُّوَال مِن البقرة إَلى الأعراف ستّ، واختلفوا
              في السّابعة، فقيل: يونس، وقيل: الأنفال والتوبة.- في حديث سَلَمَة بنِ جُنادةَ: "إذَا كان يوم سُبُوعِه" هو لُغةٌ
              في الأُسبوع للأيام والطواف، والفصيح بالألف .- في الحديث:  "مَنْ لها يومَ السَّبْع  يوم لا راعِىَ لها غَيْرى"
              أَمْلَى أبو عامر العَبْدرِىُّ الحافظ، عن ثابت بن بُنْدَار، وأحمدَ بن الحسين البَاقِلاَّني، قالا: أنا أبو القَاسِم
              عُبَيدُ الله بن عبد العزيز البَردَعِىّ، ثنا أبو الحسين محمد بن المُظَفَّر الحافظ، ثنا أبو بكر أحمد بن عمرو بن
              جابر الرَّملى قال: سمعت إسماعيل بن إسحاق القاضي يقول: سمعت علىَّ بنَ المدِيني يقول: سمعت أَبَا عُبَيدَة معمر
              بن المثنى يقول: وذكر حَديثَ النبى - صلى الله عليه وسلم -: "مَنْ لَهَا يَومَ السَّبُع غيرى"قال: يوم السَّبُع:
              عِيدٌ كان لهم في الجاهلية يشتغلون بعيدهم ولَهْوهم، وليس بالسَّبُع الذي يَأكُلُ الناسَ.أملاه أبو عَامِر بضمِّ
              البَاءِ، وكان من العِلْم والإتقان بمكان، وبخَطِّ بعَضهِم بفَتْح البَاءِ وليس بشيء.وفي رواية: "يوم تشغل عني"وقال
              محمدُ بنُ عَمْرو بنِ عَلْقمة راوى الحديث: يَعنى يَومَ القيامة، وقيل: يوم السَّبْع - بسكون الباء -: أي يوم الفَزَع. يقال:
              سبَعَ الأَسدَ: أي ذَعَرَه، قال الطِّرِمَّاح: فلماّ عَوَى لِفْتَ الشِّمال سَبَعْتُهكما أَنّ أحياناً لهنَّ سَبُوعُ
              يَصِفُ الذِّئبَ.- في حديث أبي المَلِيح  عن أبيه - رضي الله عنه -: "نَهَى عن جُلُود السِّباعِ".السِّباع: تَقَع
              على الأسد، والذِّئب، والضَّبُع وغيرها، واحدها سَبُعٌ. وكان مالك يَكرَهُ الصَّلاةَ في جلود السِّباع وإن دُبِغَت
              ويمنع من بيعها. ويرى الانتفاع بها، واحَتجَّ بالحديث جماعةٌ وقالوا: إنّ الدِّباغَ لا يُؤثِّر فيما لا يُؤكَل لَحمُه.وذَهَب
              جماعة إلى أنّ النَّهى تناوَلَها قبل الدِّباغ، فأَمّا إذا دُبِغَت طَهُرت بدليل الأحاديث الأخرى.وتأوَّلَه أصحابُ
              الشافعي انَّ الدِّباغ يُطَهِّر جلودَ السِّباع دُون شعورها، وأنَّه إنما نُهِى عنها من أجل شَعَرها، لأنّ جُلودَ
              النُّمورِ ونَحوها إنّما تُستَعْمل مع بقاء الشَّعَر عليها، وشَعَر المَيْتَة نَجِسٌ، فإذا دُبغ ونُتِف شَعَره فإنه
              طاهرٌ، وقد يكون النَّهى عنها أيضاً مِن أَجل أنّها مَراكِبُ أهل السَّرَفِ والخُيَلاء، وقد جاء النَّهى عن ركوب
              جلد النَّمِر أَيْضاً .'
