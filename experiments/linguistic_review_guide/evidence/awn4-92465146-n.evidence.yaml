            definitions_text: '(س ب ع) : (السَّبْعَةُ) فِي عَدَدِ الْمُذَكَّرِ وَبِتَصْغِيرِهَا سُمِّيَتْ (سُبَيْعَةُ) بِنْتُ
              الْحَارِثِ الْأَسْلَمِيَّةُ وَضَعَتْ بَعْدَ وَفَاةِ زَوْجِهَا بِسَبْعَةِ أَيَّامٍ وَقِيلَ بِأَرْبَعِينَ لَيْلَةً
              وَقِيلَ بِبِضْعٍ وَعِشْرِينَ وَوَزْنُ (سَبْعَةٍ) فِي (د ر) (وَالسُّبُعُ) جُزْءٌ مِنْ سَبْعَةِ أَجْزَاءٍ وَمِنْهُ
              (أَسْبَاعُ) الْقُرْآنِ وَفِي الْوَاقِعَاتِ الْأَسْبَاعُ مُحْدَثَةٌ وَالْقِرَاءَةُ فِي الْأَسْبَاعِ جَائِزَةٌ
              (وَالْأُسْبُوعُ) مِنْ الطَّوَافِ سَبْعَةُ أَطْوَافٍ (وَمِنْهُ) طَافَ أُسْبُوعًا وَأُسْبُوعَاتٍ وَأَسَابِيعَ
              (وَأَرْضٌ مَسْبَعَةٌ) كَثِيرَةُ السِّبَاعِ.'
