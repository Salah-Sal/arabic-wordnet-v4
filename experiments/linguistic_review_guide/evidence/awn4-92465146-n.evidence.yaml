              \ is usually مُتْرَف: (TA:) or one who is left to himself with the سِبَاع [or animals of prey] so that he becomes\
              \ like one of them in mischievousness, or noxiousness, or evilness: (AO, K:) or who is left to himself and not\
              \ restrained from his daringness, so that he remains daring: and a slave left to himself, and daring; left until\
              \ he has become like the سَبُع: (TA:) or one whose origin is suspected; (K;) whose father is not known: (Er-Rághib,\
              \ Sgh:) or a bastard: (K:) or one whose lineage is of slaves, (K, TA,) or ignoble, (TA,) up to seven male ancestors,\
              \ (K, TA,) or, to seven female ancestors; (TA;) or, to four male ancestors; (En-Nadr, K;) or whose lineage is\
              \ traced up to four female ancestors all of them slaves: (TA:) or born at seven months; (K, TA;) not matured\
              \ by the womb, his months not being completed. (Az, IF, TA.) مُسْبِعٌ One whose camels come to the water on\
              \ the seventh day [counting the day of the next preceding watering as the first]. (TA.) A2:  A slave finding\
              \ a سَبُع [or rapacious animal] among  his sheep, or goats. (Aboo-Sa'eed Ed-Dareer, S.) أَرْضٌ مَسْبَعَةٌ, (S,\
              \ Mgh, Msb, K,) with fet-h (S, Msb) to the first and third letters, (Msb,) like  مَرْحَلَةٌ, (K) and مَذْأَبَةٌ,\
              \ with an inseparable ة, (Sb,) A land containing, (S,) or abounding with, (Mgh, Msb, K,) سِبَاع [or animals\
              \ of prey]. (S, Mgh, Msb, K.) مُسَبَّعٌ A verse consisting of seven feet. (TA.) b2:  A camel having, in the\
              \ middle part of his back, between the withers and the rump, seven vertebrae redundant [app. meaning in size].\
              \ (TA.) b3:  [See also مُثَلَّثٌ.]\nمَسْبُوعٌ A rope consisting of seven strands. (M, voce مَثْلُوثٌ.) A2: \
              \ With ة, A cow, (S, TA,) [app. meaning a wild cow,] or [other] female wild animal, (TA,) whose offspring has\
              \ been eaten by the سَبُع [or beast, or bird, of prey]. (S, TA.) مُتَسَبَّعٌ The place of a سَبُع [or beast,\
              \ or bird, of prey]. (TA.)"
