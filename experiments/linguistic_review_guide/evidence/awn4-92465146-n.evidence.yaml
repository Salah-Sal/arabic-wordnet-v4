              \ day after childbirth; in which sense it is generally to be understood when used unrestrictedly; as this day\
              \ is celebrated with more rejoicing than the former: also as meaning the seventh day after the return from pilgrimage.]\
              \ b3: And Seven circuitings [round the House of God, meaning the Kaabeh]: (Lth, Mgh, Msb:) pl. أَسَابِيعُ (S,\
