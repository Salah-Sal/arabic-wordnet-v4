              سبعسَبْعَةُ رجالٍ، بسُكونِ الباءِ وَقد يُحرّك، وأَنْكَرَه بعضُهم، وَقَالَ: إنَّ المُحرَّكَ جَمْعُ سابِعٍ، ككاتِبٍ وكَتَبَةٍ، وسَبْعُ نِسوَةٍ فالسَّبْعُ والسَّبْعَةُ من العدَدِ مَعْرُوفٌ. وَقد تكرَّرَ ذِكرُهما فِي القُرآنِ، كقولِه تَعَالَى: سَبْعَ لَيالٍ وثَمانِيَةَ أيّامٍ حُسوماً، وبَنَيْنا فَوْقَكُم سَبْعَاً شِداداً وسَبْعَ سُنبُلاتٍ وسَبْعَةٌ وثامِنُهم كَلْبُهم. قولُهم: أَخَذَه أَخْذَ سَبْعَةٍ، ويُمنَع، إِذا كَانَ اسمَ رجُلٍ للمَعرِفَةِ والتأنيث، اختَلَفوا فِيهِ: إمّاأَصْلُها سَبُعَةٌ، بضمِّ الْبَاء، فخُفِّفَ، وَفِي الصِّحَاح: فخُفِّفَتْ أَي لبُؤَةٍ واللَّبُؤَةُ أَنْزَقُ من الأسَد. نَقَلَه الجَوْهَرِيّ والصَّاغانِيّ عَن ابْن السِّكِّيت، وإمّا اسمُ رجُلٍ مارِدٍ من العربِ أَخَذَه بعضُ المُلوكِ فنَكَّل بِهِ، كَمَا نَقَلَه ابْن دُرَيْدٍ عَن ابنِ الكَلبيّ، وَقَالَ الليثُ: قَالَ ابنُ الكَلبيِّ، وَقَالَ أَذْنَبَ ذَنْبَاً عَظِيما، فَأَخَذه بعضُ ملوكُ اليمنِ فَقَطَعَ يَدَيْهِ ورِجلَيْهِ وصَلَبَه، فَقيل: لأُعَذِّبَنَّكَ عَذابَ سَبْعَةَ، حكى هَذَا عَن الشَّرقيُّ، وزعمَ هُوَ أنّه كَانَ عاتياً يُبالِغُ فِي الإساءَة. ونقلَ الجَوْهَرِيّ عَن ابنِ الكَلبيِّ: هُوَ سَبْعَةُ بنُ عَوْفِ بنِ ثَعْلَبةَ بنِ سَلامانَ بنِ ثُعَلَ بنِ عَمْرِو بنِ الغَوثِ بنِ طَيِّئِ بنِ أُدَد، وَكَانَ رَجُلاً شَدِيدا، قَالَ: فعلى هَذَا لَا يُجرى للمَعرفةِ والتأنيثِ، زادَ فِي العُباب: قَالَ: وَفِيه المثَلُ المَقول: لأَعمَلَنَّ بكَ عَمَلَ سَبْعَةَ. وَهُوَ سَبْعَةُ هَذَا، وَلم يَزِدْه، أَو كَانَ اسمُه سَبْعَاً فصُغرَ وحُقِّرَ بالتأنيثِ سَبْعَةَ، كَمَا قَالُوا: ثَعْلَبةَ ونَحوه أَو مَعْنَاهُ: أَخَذَه أَخْذَ سَبْعَةِ رِجالٍ. وَقَالَ الليثُ فِي قولِهم: لأَعملَنَّ بفلانٍ عَمَلَ سَبْعَةٍ. أَرَادوا المُبالَغةَ وبُلوغَ الغايةِ. وَقَالَ بَعْضُهم: أَرَادوا عَمَلَ) سَبْعَةِ رِجالٍ. قولُهم: أخذتُ مِنْهُ مائةَ دِرهَمٍ وَزْنَ سَبْعَةِ، يَعْنُونَ بِهِ أنّ كلَّ عَشَرَةٍ مِنْهَا بزِنَةِ سَبْعَةِ مَثاقيلَ نَقله الجَوْهَرِيّ والصَّاغانِيّ. وجَوْذانُ بنُ سَبْعَةَ الطائيّ من بني خَطامة: تابعيٌّ، أَدْرَكَ عثمانَ، رَضِيَ اللهُ عَنهُ. والسَّبْعُ: ة، بَين الرَّقَّةِ ورأسِ عَيْنٍ، على الخابور. السَّبْع: ع، بل ناحيةٌ بأرضِ فِلَسْطينَ بَين القُدسِ والكَرَك، سُمِّي بذلك لأنّ بِهِ سَبْعَ آبارٍ، نَقَلَه الصَّاغانِيّ.
              قَالَ ابْن الأَعْرابِيّ: السَّبْع: المَوضِعُ الَّذِي يكونُ إِلَيْهِ المَحشَر يومَ الْقِيَامَة، وَمِنْه الحديثُ: بَيْنَا راعٍ فِي غنَمِه عدا عَلَيْهِ الذِّئبُ، فَأَخَذ مِنْهَا شَاة، فَطَلَبه الرَّاعِي حَتَّى اسْتَنقَذَها مِنْهُ، فالْتَفتَ إِلَيْهِ الذِّئبُ فَقَالَ لَهُ: مَن لَهَا يومَ السَّبْعِ أَي من لَهَا يومَ الْقِيَامَة. هَكَذَا فَسَّرَه ابْن الأَعْرابِيّ، وَنَقَله الصَّاغانِيّ وصاحبُ اللِّسان، ويُعَكِّرُ على هَذَا وَفِي بعضِ النّسخ، أَو يُعَكِّرُ على هَذَا، أَي التَّأْوِيل، بقِيَّةُ قَول الذِّئب وَهُوَ بقيَّةُ الحديثِ بعدَ قولِه: مَن لَهَا يَوْمَ السَّبْعِ يَوْمَ لَا يكونُ لَهَا ونَصُّ الحَدِيث: يَوْمَ لَيْسَ لَهَا راعٍ غَيْرِي فَقَالَ النَّاس: سُبحانَ الله ذِئبٌ يَتَكَلَّم والذئبُ لَا يكونُ راعِياً يَوْمَ القيامةِ وَهُوَ اعتِراضٌ قوِيٌّ على ابْن الأَعْرابِيّ. أَو أرادَ: مَن لَهَا عندَ الفِتَنِ حِين تُترَكُ سُدىً بِلَا راعٍ، نُهبَةً للسِّباع، فَجَعَلَ السَّبُعَ لَهَا راعِياً بطريقِ التَّجَوُّز إِذْ هُوَ مُنفرِدٌ بهَا، يكونُ حينَئِذٍ بضمِّ الْبَاء، وَهَذَا إنذارٌ بِمَا يكونُ من الشدائدِ والفِتَنِ الَّتِي يُهمِلُ الناسُ مِنْهَا مَواشِيَهُم، فَتَسْتَمْكِنُ مِنْهَا السِّباعُ بِلَا مانِعٍ. أَو يومُ السَّبْعِ: عيدٌ كانَ لَهُم فِي الجاهليّةِ، كَانُوا يَشْتَغِلون فِيهِ بلَهْوِهِم وعيدِهم عَن كلِّ شيءٍ، وَلَيْسَ بالسَّبُعِ الَّذِي يَفْتَرِسُ الناسَ، وَهَكَذَا قالَه أَبُو عُبَيْدةَ ورُوي، بضمِّ الباءِ، قَالَ صاحبُ اللِّسان: وَهَكَذَا أمْلاهُ أَبُو عامرٍ العَبْدَرِيُّ الحافظُ، وَكَانَ من العِلمِ والإتقانِ بمكانٍ. وَيُقَال للأمرِ المُتَفاقِم: إِحْدَى الإحَد، وَإِحْدَى من سَبْعٍ، وَمِنْه حديثُ ابنِ عَبّاسٍ، وَقد سُئِلَ عَن رجلٍ تَتابَعَ عَلَيْهِ رَمَضَانان، فَسَكَتَ. ثمّ سَأَلَه آخَرُ، فَقَالَ: إحْدى مِن سَبْع، يصومُ شَهْرَيْن ويُطعِمُ مِسْكيناً. وَقَالَ شَمِرٌ: يَقُول: اشْتدَّتْ فِيهَا الفُتْيا
              وعَظُمَ أَمْرُها. قَالَ: ويجوزُ أَن يكونَ شبَّهَها بِإِحْدَى اللَّيالي السَّبْعِ الَّتِي أَرْسَلَ اللهُ فِيهَا العذابَ على عادٍ، فَضَرَبها لَهَا مَثَلاً فِي الشِّدَّةِ إشكالِها، وَقيل: أرادَ سَبْعَ سِني يوسُفَ الصِّدِّيق عَلَيْهِ السَّلام فِي الشِّدَّة. خَلَقَ اللهُ السَّبْعَيْنِ وَمَا بَيْنَهُما فِي سِتَّةِ أيّامٍ، وَمِنْه قَوْلُ الفرَزْدَقِ الشاعرِ:(وَكَيْفَ أخافُ الناسَ واللهُ قابِضٌ ... على الناسِ والسَّبْعَيْنِ فِي راحَةِ اليَدِ)أَي: سَبْعِ سَماواتٍ وسَبْعِ أرَضِين. والحسَنُ بنُ عليِّ بنِ وَهْبٍ الدِّمَشقيُّ عَن أبي بَكْرٍ مُحَمَّد بن عَبْدِ الرحمنِ القَطَّان. أَبُو عليٍّ بَكْرُ بنُ أبي بكرٍ مُحَمَّد بنِ أبي سَهْلٍ النَّيْسابوريُّ، مَاتَ سنة)أربعمائةٍ وخَمسٍ وسَبْعين، وابْنُه عمرُ بنُ بَكْرٍ: سَمِعَ مِنْهُ ابنُ ناصِرٍ، أَبُو القاسِم سَهْلُ بنُ إبراهيمَ، عَن أبي عُثْمَان الصابونيّ، وابنُه أَبُو بكر أحمدُ بن سَهْل عَن أبي بَكْرِ بن خَلَف.وحَفيدُه أَبُو المَفاخِر مُحَمَّد بنُ أحمدَ بنِ سَهْلٍ عَن جَدِّهِ المَذكور، سَمِعَ مِنْهُ مَعْتُوقُ بنُ مُحَمَّد الطِّيبيّ بمَكَّة. وإبراهيمُ بنُ سَهْلِ بنِ إبراهيمَ، أَخُو أحمدَ، سَمِعَ مِنْهُ الفُرَاويُّ، وزاهِرُ بنُ طاهِرٍ السَّبْعِيُّون: مُحدِّثون، ظاهِرُ صَنيعُه أنّه بفَتحِ السِّين، وَهُوَ خطأٌ، قَالَ الحافظُ فِي التبصير تَبَعَاً لابنِ السَّمْعانيِّ والذَّهَبيّ: إنّه بضمِّ السِّين، وأمّا بفَتحِ السينِ فنِسبَةُ طائفَةٍ يُقَال لَهَا: السَّبْعِيَّة، من غُلاةِ الشِّيعَة. ذَكَرَه ابنُ السَّمْعانيّ، فاعْرِفْ ذَلِك. والسَّبُع، بضمِّ الْبَاء، وَعَلِيهِ اقْتَصرَ الجَوْهَرِيّ، وفَتحِها، وَبِه قَرَأَ الحسَنُ البَصْريُّ ويَحْيَى وإبراهيمُ وَمَا أَكَلَ السَّبعُ قَالَ الصَّاغانِيّ: فَلَعَلَّها لغةٌ وسُكونِها، وَبِه قَرَأَ عاصِمٌ، وَأَبُو عمروٍ، وطَلْحَةُ بنُ سُلَيْمان، وَأَبُو حَيْوَةَ، وابنُ قُطَيْبٍ: المُفتَرِسُ من الحَيَوانِ، مثلُ الأسَدِ والذِّئبِ والنَّمِر والفَهد، وَمَا أَشْبَهها ممّا لَهُ نابٌ، ويَعْدُو على الناسِ والدّوابِّ فَيَفْتَرِسُها، وأمّا الثعلبُ وَإِن كَانَ لَهُ نابٌ فإنّه لَيْسَ بسَبُعٍ لأنّه لَا يَعْدُو إلاّ على صِغارِ المَواشي، وَلَا يُنَيِّبُ فِي شيءٍ من الحَيَوان، وَكَذَلِكَ الضَّبُع لَا يُعَدُّ من السِّباعِ العادِيَة، وَلذَلِك وَرَدَت السُّنَّةُ بإباحةِ لَحْمِها، وبأنَّها تُجْزَى إِذا أُصيبَت فِي الحرَم، أَو أصابَها المُحرِم، وأمّا ابنُ آوى فإنّه سَبُعٌ خَبيثٌ، ولحمُه حَرامٌ لأنّه من جِنسِ الذِّئابِ، إلاّ أنّه أَصْغَرُ جِرْماً، وأَضْعَفُ بَدَنَاً، هَذَا قولُ الأَزْهَرِيّ. وَقَالَ غيرُه: السَّبُعُ من البهائمِ العادِيَةِ: مَا كَانَ ذَا مَخْلَبٍ. وَفِي المُفرَدات: سُمِّي بذلك لتَمامِ قُوَّتِه، وَذَلِكَ أنَّ السَّبْعَ من الأَعْدادِ التّامَّةِ. ج: أَسْبُعُ فِي أدنى العدَد، وسِباع، قَالَ سِيبَوَيْهٍ: لم يُكَسَّرْ على غيرِ سِباعٍ، وأمّا قَوْلُهم فِي جَمْعِه: سُبوعٌ، فمُشعِرٌ أنَّ السَّبْعَ لَيْسَ بتَخفيفٍ كَمَا ذهبَ إِلَيْهِ أَهْلُ اللُّغَة لأنّ التَّخفيفَ لَا يُوجِبُ حُكماً عِنْد النَّحْوِيِّين، على أنّ تَخفيفَه لَا يَمْتَنِع، وَقد جاءَ كثيرا فِي أشعارِهم، مِثلَ قَوْلِه:(أمِ السَّبْع فاسْتَنْجوا وأينَ نَجَاؤُكُم ... فَهَذَا ورَبِّ الرَّاقِصاتِ المُزَعْفَرُ)وأنشدَ ثَعْلَبٌ:(لِسانُ الفَتى سَبْعٌ عَلَيْهِ شَذَاتُه ... فإنْ لم يَزَعْ من غَرْبِه فَهُوَ آكِلُهْ)وأرضٌ مَسْبَعَةٌ، كَمَرْحَلَةٍ: كَثيرَتُه، وَفِي الصِّحَاح: ذاتُ سِباعٍ، قَالَ لَبيدٌ: إليكَ جاوَزْنا بِلاداً مَسْبَعَه ْ قَالَ سِيبَوَيْهٍ: بابُ مَسْبَعةٍ ومَذْأَبةٍ ونَظيرَهما ممّا جاءَ على مَفْعَلةٍ لازِمَةً لَهَا الْهَاء، وَلَيْسَ فِي كلِّ)شيءٍ يُقَال، إلاّ أنْ تَقيسَ شَيْئا وتَعْلَم مَعَ ذَلِك أنَّ العربَ لم تَتَكَلَّمْ بِهِ، وَلَيْسَ لَهُ نَظيرٌ من بناتِ الأرْبَعةِ عندَهم، وإنّما خَصُّوا بِهِ بَناتِ الثلاثةِ لخِفَّتِها، مَعَ أنَّهم يَسْتَغنون بقَولِهم: كَثيرةُ الذِّئابِ، وَنَحْوهَا. وذاتُ السِّباع، ككِتابٍ: ع، نَقَلَه الصَّاغانِيّ. ووادي السِّباع: مَوْضِعٌ بطريقِ الرَّقَّةِ على ثلاثةِ أَمْيَالٍ من الزُّبَيْدِيَّة، يُقَال: إنّه مرَّ بِهِ وائِلُ بنُ قاسِطٍ على أَسْمَاءَ بِنتِ دُرَيْمِ بنِ القَيْنِ بنِ أَهْوَدَ بنِ بَهْرَاءَ بنِ عَمْرِو بنِ الحافي بنِ قُضاعة، فهَمَّ بهَا حينَ رَآهَا مُنفَرِدَةً فِي الخِباء فَقَالَ لَهُ: واللهِ لَئِنْ هَمَمْتَ بِي لَدَعَوْتُ أَسْبُعي، فَقَالَ: مَا أرى فِي الْوَادي غَيْرَك، فصاحَتْ ببَنيها: يَا كَلْبُ، يَا ذِئْب، يَا فَهْدُ، يَا دُبُّ، يَا سِرْحانُ، يَا سِيدُ، يَا ضَبُعُ، يَا نَمِرُ، فجاؤوا يَتَعَادَوْنَ بالسُّيوفِ، فَقَالَ: مَا أرى هَذَا إلاّ وَادي السِّباع، وَقد ذَكَرَه سُحَيْمُ بنُ وَثيلٍ الرِّياحيُّ، فَقَالَ:(مَرَرْتُ على وَادي السِّباعِ وَلَا أرى ... كَوادي السِّباعِ حينَ يُظلِمُ وادِيا)والسَّبْعِيَّةُ، هَكَذَا فِي النّسخ، كأنّه نِسبةٌ إِلَى السَّبْعةِ. وَفِي العُباب: السُّبَيْعَةُ، مُصغّراً: ماءَةٌ لبَني نُمَيْرٍ. والسَّبْعونَ: عدَدٌ، م، وَهُوَ العِقدُ الَّذِي بَين السِّتِّين والثَّمانين، وَقد تكرَّرَ ذِكرُه فِي القُرآنِ والْحَدِيث. والعربُ تضَعُها مَوْضِعَ التَّضعيفِ والتكثير، كقولِه تَعَالَى: إنْ تَسْتَغْفِرْ لَهُم سَبْعِينَ مَرَّةً فَلَنْ يَغْفِرَ اللهُ لَهُم فَهُوَ لَيْسَ من بابِ حَصْرِ العدَد، فإنّه لم يُرِدْ اللهُ عزَّ وجلَّ أنّه إنْ زادَ على السَّبْعين غُفِرَ لَهُم، ولكنّ المَعنى إِن استَكثرْتَ من الدُّعاءِ والاستِغفارِ للمُنافقين لم يَغْفِرِ الله لَهُم. وَكَذَلِكَ الحَدِيث: إنّه ليُغانُ على قَلْبِي حَتَّى أَسْتَغْفِرَ اللهَ فِي اليَومِ سَبْعِين مَرّةً. وَمُحَمّد بنُ سَبْعُون المُقرِئُ المَكّيُّ قرأَ على إسماعيلَ بنِ عَبْد الله بنِ قُسْطَنطين، المعروفِ بالقُسْط. أَبُو محمدٍ، كَمَا فِي العُباب، ابْن يحيى السُّلَمِيّ وَفِي التبصير: أَبُو بكرٍ عَبْد الله بنُ سَبْعُون القَيْروانيُّ مُحدِّث، عَن أبي نَصْرٍ عُبَيْدُ اللهِ بنِ سعيدٍ الوائليّ السِّجْزِيّ بمَكَّة، وَأبي الحسَنِ بنِ صَخْرٍ، وَعنهُ أَبُو القاسمِ إسماعيلُ بنُ أحمدَ السَّمَرْقَنْديّ، وَأَبُو الحسَنِ بنُ عبدِ السَّلَام، سَكَنَ بَغْدَاد، وتُوفِّي سنةَ أربعمائةٍ وتِسعٍ وعِشرين، وَقد اشْتَبهَ على الحافظِ حِين كناه أَبَا بكرٍ بولَدِه أبي بكرٍ أحمدَ بنِ عَبْد الله بنِ سَبْعُون القَيْروانيّ، ثمّ البغداديّ، وَهَذَا قد سَمِعَ أَبَا الطَّيِّبِ الطَّبَريَّ، وَعنهُ ابنُه عَبْد الله وتُوفِّيَ سنةَ خَمْسِمائةٍ، وعَشْرٍ. كَذَا فِي تاريخِ الذَّهَبيِّ، فَتَأَمَّلْ ذَلِك. وسَبْعِينُ: ة، بحَلب ببابِها كَانَت إقْطاعاً للمُتَنَبِّئِ الشَّاعِر، من سَيْفِ الدولةِ مَمْدُوحِه، وإيّاها عَنى بقَولِه: أَسيرُ إِلَى إقْطاعِهِ فِي ثِيابِهعلى طِرْفِهِ من دارِه بحُسامِه والسَّبُعان، بضمِّ الْبَاء: ع، هَكَذَا نَقله الجَوْهَرِيّ، قَالَ: وَلم يَأْتِ على فَعُلانَ شيءٌ غيرُه، وَفِي)العُبابِ أنّه ببِلادِ قَيْسٍ، وَفِي مُعجَمِ البَكْريِّ أنّه جبَلٌ قِبَلَ فَلْج، وَقيل: وادٍ شَمالِيِّ سَلَم، وَأنْشد الجَوْهَرِيّ لابنِ مُقبِلٍ:(أَلا يَا دِيارَ الحَيِّ بالسَّبُعانِ ... أَمَلَّ عَلَيْهَا بالبِلى المَلَوانِ)والسَّبْعَةُ وتُضَمُّ الباءُ: اللَّبُؤَة، وَمِنْه المثَل: أَخَذَه أَخْذَ سَبُعَة على مَا ذَهَبَ إِلَيْهِ ابْن السِّكِّيت، كَمَا تقدّم. وككِتابٍ: سِباعُ بنُ ثابِت، روى عَنهُ عُبَيْدُ اللهِ بن أبي يَزيدَ أنّه أَدْرَكَ الجاهليّة. سِباعُ بنُ زَيْدٍ أَو يَزيد، العَبْسِيُّ، لَهُ وِفادَةٌ رُواتُها مَجْهُولون. سِباعُ بنُ عُرْفُطَةَ الغِفارِيُّ مَشْهُورٌ، اسْتَعملَه النبيُّ صلّى الله عَلَيْهِ وسلَّم على الْمَدِينَة. وكزُبَيْرٍ، سُبَيْعُ بنُ حاطِبٍ الأنْصاريُّ الأَوْسيُّ، حَليفُهم، وَفِي العُباب، وَهُوَ من بني مُعاوِيَةَ بنِ عَوْفٍ، استُشهِدَ يومَ أُحُدٍ. سُبَيْعُ بنُ قَيْس بن عَيْشَةَ الخَزْرَجيُّ الحارِثيُّ، بَدْرِيٌّ أُحُدِيٌّ، صَحابِيُّون، رَضِيَ الله عَنْهُم. وكجُهَيْنَة: سُبَيْعةُ بنتُ الحارثِ الأَسْلَميّة، توفِّيَ عَنْهَا سَعْدُ بنُ خَوْلَةَ بمكّة، فَوَلَدتْ بَعْدَه بنِصفِ شهرٍ، وَقد تقدّمَ حديثُها. سُبَيْعةُ بنتُ حَبيبٍ الضُّبَيْعِيَّة، روى عَنْهَا ثابِتٌ البُنانِيُّ: صَحابِيَّتان، رَضِيَ الله عَنْهُمَا، وَقَالَ العُقَيْليّ فِي الأَفْراد: سُبَيْعةُ الأَسْلَميّة، وَقَالَ: هِيَ غيرُ بنتِ الحارثِ. والسِّبْع، بالكَسْر: الوِرْد، وَهُوَ ظِمْءٌ من أَظْمَاءِ الْإِبِل، وإبلٌ سَوابِعٌ، وَهُوَ أَن تَرِدَ فِي اليَومِ السابِعِ. وَقَالَ الأَزْهَرِيّ: وَفِي أَظْمَاءِ الإبلِ السِّبْعُ، وَذَلِكَ إِذا أقامَتْ فِي مَراعيها خَمْسَةَ أيّامٍ كَوامِلَ. وَوَرَدتْ اليومَ السادسَ، وَلَا يُحسَبُ يومُ الصَّدَر. السُّبْع، بالضَّمّ، وكأميرٍ: جُزءٌ من سَبْعَةٍ، والجَمعُ: أَسْبَاعٌ، وَقَالَ شَمِرٌ: لم أَسْمَعْ سَبيعاً لغيرِ أبي زَيْدٍ. وسَبَعَهُم، كَضَرَبَ ومَنَعَ: كَانَ سابِعَهُم، الأخيرُ نَقَلَه الجَوْهَرِيّ، وزادَ يونُسَ بنُ حبيب فِي كتابِ اللُّغَات: من حدِّ ضَرَبَ ونَصَرَ، فَهُوَ مُثَلَّثٌ، مُستدرَكٌ على المُصَنِّف. أَو سَبَعَهُم يَسْبعهم بالتَّثْليثِ: أَخَذَ سُبْعَ أموالِهم. سَبَعَ الذِّئبَ: رَماهُ أَو ذَعَرَه، قَالَ الطِّرْماحُ يصفُ ذِئْباً:(فلمّا عَوى لَفْتَ الشِّمالِ سَبَعْتُه ... كَمَا أَنا أَحْيَاناً لهُنَّ سَبُوعُ)وَيُقَال أَيْضا: سَبَعَ فلَانا: إِذا ذَعَرَه. سَبَعَ فلَانا: شَتَمَه وعابَه وانْتَقَصه وَوَقَع فِيهِ بالقَولِ القَبيحِ، ورماه بِمَا يَسوءُ من القَذَع. أَو سَبَعَه: عَضَّه بأَسْنانِه، كفِعلِ السَّبُعِ. سَبَعَ الشيءَ: سَرَقَه، كاسْتَبَعَه، كِلاهما عَن أبي عمروٍ. سَبَعَ الذئبُ الغنَمَ، أَي فَرَسَها فَأَكَلها. سَبَعَ الحَبلَ يَسْبَعُه سَبْعَاً: جَعَلَه على سَبْعِ قُوىً، أَي طاقاتٍ. والسُّباعيُّ، بالضَّمّ: الجمَلُ العظيمُ الطَّوِيل، قَالَه النَّضْر، والرُّباعيُّ مثلُه على طولِه، وَهِي بهاءٍ، يُقَال: ناقةٌ سُباعِيّةٌ ورجلٌ سُباعِيُّ البدَنِ كَذَلِك، أَي تامُّه.)والأُسْبوع، من الأيّام، قَالَ الليثُ: من الناسِ من يَقُول: السُّبُوع فِي الأيّامِ والطَّوافِ بضَمِّهما، الأخيرُ بِلَا ألِف، م، وَهُوَ مَأْخُوذٌ من عدَدِ السَّبْعِ، والجَمع: الأسابيع. يُقَال: طافَ بالبيتِ سَبْعَاً، بفتحِ السِّين وضمِّها وأُسْبوعاً، وَقَالَ أَبُو سعيد: قَالَ ابْن دُرَيْدٍ: سُبوعاً وَلَا أعرفُ أَحَدَاً قَالَه غيرُه، والمعروفُ أُسْبوعاً، أَي سَبْعَ مرّاتٍ. وَقَالَ الليثُ: الأُسْبوعُ من الطَّوافِ ونَحوِه: سَبْعَةُ أَطْوَافٍ، والجَمعُ أُسْبوعات، وَيُقَال: أَقَمْتُ عندَه سُبْعَيْن، أَي جُمعتَيْن. قلتُ: وَهَذَا الَّذِي أَنْكَره أَبُو سعيدٍ على ابْن دُرَيْدٍ قد جاءَ فِي حديثِ سَلَمَةَ بنِ جُنادَة: إِذا كانَ يومُ سُبوعِه. يريدُ يومَ أُسْبوعِه من العُرْس، أَي بعدَ سَبْعَةِ أيّامٍ. وكأميرٍ: السَّبيعُ بنُ سَبْع بنِ صَعْبِ بنِ مُعاوِيَةَ بنِ كُرْزِ بنِ مالكِ بنِ جُشَمَ بنِ حاشِدِ بنِ جُشَمَ بنِ خَيْرَانَ بن نَوْفِ بنِ هَمْدَان، أَبُو بَطْنٍ من هَمْدَان، نَقَلَه ابنُ الكَلبيِّ، مِنْهُم: الإمامُ أَبُو إسحاقَ عُمر، هَكَذَا فِي النّسخ، وصوابُه: عَمْرُو بنُ عَبْد الله بن عليِّ بن هانِئٍ التابعيُّ المُحدِّث، روى عَن البَراءِ بنِ عازِبٍ، وَعنهُ شُعبَةُ. قلتُ: وَمِنْهُم أَيْضا: أَبُو مُحَمَّد الحسَنُ بنُ أحمدَ السَّبيعيّ الحافظُ، كَانَ فِي حُدودِ السَّبْعين وثلاثِمائةٍ، بحَلَب. السَّبيع: محَلَّةٌ بالكُوفَة مَنْسُوبةٌ إِلَيْهِم أَيْضا. وأَسْبَعَ الرجلُ: وَرَدَتْ إبلُه سَبْعَاً، وهم مُسْبِعون، وَكَذَلِكَ فِي سائرِ الأَظْماءِ، كَمَا تقدّم. أَسْبَعَ القَومُ: صَارُوا سَبْعَةً. أَسْبَعَ الرُّعْيانُ، إِذا وَقَعَ السَّبُعُ فِي مَواشيهم، عَن يَعْقُوب، قَالَ الراجز: قد أَسْبَعَ الرَّاعِي وضَوْضا أَكْلُبُه أَسْبَعَ ابْنَه: دَفَعَه إِلَى الظُّؤُورَةِ وَمِنْه قولُ العَجَّاجِ، كَمَا فِي التَّهْذِيب:(إنَّ تَميماً لم يُراضِعْ مُسْبَعا ... وَلَمْ تَلِدْه أمُّه مُقَنَّعا) وَنَبَسه الجَوْهَرِيّ إِلَى رُؤْبَة، وَقد تقدّم فِي رضع وَيَأْتِي تفسيرُه قَرِيبا. أَسْبَعَ فلَانا: أَطْعَمَه السَّبُعَ، كَذَا نصُّ الصِّحَاح، وَفِي المُفردَات لَحْمَ السَّبُع. أَسْبَعَ عَبْدَه، أَي أَهْمَله، قَالَ أَبُو ذُؤَيْبٍ الهُذَلِيُّ، يصفُ حِماراً:(صَخْبُ الشَّوارِبِ لَا يزالُ كأنَّهُ ... عَبْدٌ لآلِ رَبيعةَ مُسْبَعُ)والمُسْبَع، كمُكْرَم، قَالَ الجَوْهَرِيّ: هَكَذَا رَوَاهُ الأَصْمَعِيّ مُسْبَعٌ بفتحِ الْبَاء، واختُلِفَ فِيهِ فَقيل: هُوَ المُترَف، نَقَلَه الصَّاغانِيّ، وَهُوَ قريبٌ من معنى المُهمَل لأنّه إِذا أُهْمِل فقد أُترِفَ عَادَة، أَو كنى بالمُسْبَع عَن الدَّعِيّ الَّذِي لَا يُعرَفُ أَبوهُ، قَالَه الراغبُ والصَّاغانِيّ، أَو ولَدُ الزِّنا، وَهُوَ قريبٌ من الدَّعِيِّ أَو مَن تَموتُ أمُّه فيُرضِعُه غيرُها، قَالَ النَّضْر: وَيُقَال: رُبَّ غُلامٍ رَأَيْتُه يُراضَع،)قَالَ: والمُراضَعة: أَن يَرْضَعَ أمَّه وَفِي بَطْنِها ولَدٌ، وَقد تقدّم، ويُراعى فِيهِ معنى الإهمال لأنّه إِذا ماتَتْ أمُّه فقد أُهمِل، أَو مَن هُوَ فِي العُبودِيَّةِ إِلَى سَبْعَةِ آباءٍ، أَو فِي اللُّؤْمِ، وَقَالَ بَعْضُهم: إِلَى سَبْعِ أمَّهاتٍ، أَو إِلَى أَرْبَعةٍ، هَكَذَا قَالَه النَّضْر، وَلم يَأْخُذهُ من اللَّفظِ، وَقَالَ غَيْرُه: مَن نُسِبَ إِلَى أَرْبَعِ أمَّهاتٍ كلُّهَنَّ أَمَةٌ، أَو مَن أُهمِلَ مَعَ السِّباع، فصارَ كسَبُع خُبْثاً، نَقله أَبُو عُبَيْدةَ. وَقَالَ غيرُه: المُسْبَع: المُهمَلُ الَّذِي لم يُكَفَّ عَن جَراءَتِه، فبَقِيَ عَلَيْهَا. وعَبدٌ مُسْبَعُ، أَي مُهمَلٌ جَريءٌ، تُرِكَ حَتَّى صارَ كالسَّبُع، وَبِه فَسَّرَ الجَوْهَرِيّ قولَ أبي ذُؤَيْبٍ. وَقَالَ السُّكَّريُّ فِي شَرْحِ الدِّيوان: عَبدٌ مُسْبَعٌ، أَي مُهمَلٌ، وأصلُ المُسْبَع: المُسلَمُ إِلَى الظُّؤورَة، قَالَ رُؤْبَة: إنَّ تَميماً لم يُراضَعْ مُسْبَعا أَي لم يُقطَعْ عَن أمِّه فيُدفَعْ إِلَى الظُّؤورَةِ، فَيكون مُهمَلاً، والصبيُّ فِي أسابيعِه سَبْعَةُ أسابيع، وَهِي أَرْبَعون يَوْمًا لَا يُسقَى، فالمُسْبَعُ مِن هَذَا، وسُمِّي تَميماً لأنّه تَمَّ فِي بَطْنِ أمِّه، وُلِدَ لسَنتَيْن، فحينَ وُلِدَ لم يَشْرَبْ اللبَنَ، أَكَلَ وَقد نَبَتَتْ أَسْنَانُه. أَو المَولودُ لسَبعَةِ أَشْهُرٍ فَلم يُنضِجْه الرَّحِمُ وَلم يُتِمَّ شُهورَه، نَقله الأَزْهَرِيّ وابنُ فارِسٍ، وَبِه فسَّرَ الأَزْهَرِيّ قَوْلَ رُؤْبَةَ. وَقَالَ الجَوْهَرِيّ: قَالَ أَبُو سعيدٍ الضَّرير: مُسْبعٌ بكسرِ الْبَاء، قَالَ: فشَبَّهَ الحِمارَ وَهُوَ يَنْهَقُ بعَبْدٍ قد صادَفَ فِي غنَمِهِ سَبُعاً، فَهُوَ يُهَجْهِجُ بِهِ ليَزْجُرَه عَنْهَا. قَالَ: وَأَبُو رَبيعةَ فِي بني سَعْدِ بنِ بكرٍ، وَفِي غيرِهم، ولكنّ جيرانَ أبي ذُؤَيْبٍ بَنو سَعْدِ بنِ بكرٍ، وهم أَصْحَابُ غَنَم. قلتُ: وَفِي شَرْحِ الدِّيوان: أَبُو رَبيعةَ هَذَا ابنُ ذُهْلِ بنِ شَيْبَان، وَيُقَال: أَبُو رَبيعةَ من بَني شِجْعِ بنِ عامرِ بنِ لَيْثِ بنِ بَكْرِ بنِ عَبْدِ مَناةَ. قلتُ: وَفِيه وَجْهٌ آخَرَ، تقدَّمَ فِي ربع فراجِعْه. وسَبَّعَه تَسْبِيعاً: جَعَلَه سَبْعَةً، وَكَذَا سَبَّعَه: إِذا جَعَلَه ذَا سَبْعَةِ أَرْكَانٍ. سَبَّعَ الإناءَ: غَسَلَه سَبْعَ مَرّاتٍ، وَمِنْه قولُ أبي ذُؤَيْبٍ:(فإنَّكَ مِنها والتَّعَذُّرُ بَعْدَما ... لَجَجْتَ وشَطَّتْ من فُطَيْمَةَ دارُها)(لَنَعْتُ الَّتِي قامَتْ تُسَبِّعُ سُؤْرَها ... وقالتْ حَرامٌ أَن يُرَجَّلَ جارُها)قَالَ أَعرابيٌّ لرَجُلٍ أَحسَنَ إِلَيْهِ: سَبَّعَ الله لَكَ، أَي أَعطاكَ أَجرَكَ سبْعَ مَرَّاتٍ، أَو ضَعَّفَ لَك مَا صنعْتَ سبعةَ أَضْعافٍ. وَفِي نوادِرِ الأَعرابِ: سَبَّعَ الله لفُلانٍ تَسْبيعاً، وتّبَّع لَهُ تَتْبِيعا، أَي تابعَ لَهُ الشيءَ بعدَ الشَّيءِ، وَهُوَ دعوةٌ تكونُ فِي الخَيْرِ والشَّرِّ، قَالَ أَبو سعيدٍ: وحُكِيَ عَن العَرَبِ وسمعتُ من دعامةَ بنِ ثامِلٍ: سَبَّع الله لكَ أَجْرَها، أَي ضاعَفَ اللهُ لكَ أَجرَ هَذِه الحَسَنة.وَقَالَ السُّكَّريّ فِي شرحِ قولِ أَبي ذُؤَيْبٍ: تُسَبِّعُ سُؤْرَها، أَي تتَصَدَّقُ بِهِ، تلتَمِسُ تَسبيعَ الأَجرِ،)والعَرَبُ تضَعُ التَّسْبيعَ مَوضِع التَّضْعِيفِ وَإِن جاوَزَ السَّبْعَ، والأَصلُ فِي ذلكَ قَوْله عَزَّ وجَلَّ: مَثَلُ الَّذينَ يُنْفِقونَ أَموالَهُم فِي سَبِيل الله كمَثَلِ حَبَّةٍ أَنبتت سبعَ سنابِلَ فِي كُلِّ سُنبُلَةٍ مائةُ حَبَّةٍ وَالله يُضاعِفُ لِمَنْ يَشاءُ، ثمَّ قَالَ النَّبيُّ صلّى الله عَلَيْهِ وسلَّم: الحَسَنَةُ بعَشْرٍ إِلَى سبعمائةٍ والمَعنى تَلتَمِسُ تَسبيعَ الثَّوابِ بِسُؤْرِها، فأَلقى الباءَ ونصَب. سَبَّعَ الْقُرْآن: وَظَّفَ عَلَيْهِ قراءَتَه فِي كلِّ سَبْع ليالٍ، كَمَا فِي اللِّسَان والعبابِ. سَبَّع لامرأَتِهِ: أَقامَ عِنْدهَا سَبْعَ ليالٍ، وَمِنْه قولُ النَّبيِّ صلّى الله عَلَيْهِ وسلَّم لأُمِّ سلَمَةَ حينَ تَزَوَّجَها وَكَانَت ثَيِّباً: إنْ شِئْتِ سَبَّعْتُ لَكِ، وَإِن سَبَّعْتُ لكِ سَبَّعْتُ لِنِسائي، وَفِي روايةٍ: إِن شئتِ سبَّعْتُ عندَكِ، ثمَّ سَبَّعْتُ عندَ سَائِر نِسائي، وَإِن شئتِ ثَلَّثْتُ ودُرْتُ، فَقَالَت: ثَلِّثْ ودُرْ، اشتَقُّوا فَعَّلَ من الواحِدِ إِلَى العَشْرَة، فَمَعْنَى سَبَّعَ: أَقامَ عندَها سبعا، وثَلَّثَ: أَقام عندَها ثَلَاثًا، وَكَذَلِكَ من الْوَاحِد إِلَى العَشَرة فِي كلِّ قولٍ وفِعلٍ. سبَّعَ دراهِمَهُ، أَي كمَّلَها سبعينَ. وَهَذِه مُوَلّدة، وَكَذَلِكَ سَبْعَنَ دَراهِمَه: إِذا كمَّلَها سبعين، مولّدة أَيضاً، لَا يَجوزُ أَنْ يُقالَ ذَلِك، وَلَكِن إِذا أَرَدْتَ أَنَّكَ صَيَّرْتَه سبعين قلتَ: كَمَّلْتُه سَبعينَ من غير اشتِقاق فِعْلٍ مِنْهُ. سَبَّعَت القَومُ: تَمَّتْ سَبْعَمائةِ رَجُلٍ، وَمِنْه الحَدِيث: سَبَّعَتْ سُلَيْمُ يومَ الفَتْحِ أَي كَمُلَتْ سَبْعَمائةِ رَجُل، وَهُوَ نَظيرُ ثَيَّبَتِ المَرأَةُ، ونَيَّبَتِ النّاقةُ. والسِّباعُ، ككِتابٍ: الجِماعُ نَفْسُه، وَمِنْه الحَدِيث: أَنَّه صَبَّ على رأْسِه الماءَ من سِباعٍ كانَ مِنْهُ فِي رمَضانَ هَذِه عَن ثعلَبٍ عَن ابنِ الأَعرابيِّ.قيلَ: هُوَ الفخَارُ بكَثرَتِه، وإظْهارُ الرَّفَثِ، وَبِه فُسِّرَ الحَدِيث: نُهِيَ عَن السِّباعِ قَالَ ابنُ الأَعرابيِّ: كأَنَّه نُهِيَ عَن المُفاخَرَةِ بالرَّفَثِ وكَثرَة الجِماعِ، والإعرابِ بِمَا يُكْنَى عَنهُ من أَمْرِ النِّساءِ. قيل: السِّباعُ المَنهيُّ عَنهُ: التَّشاتُمُ بأَن يَتسابَّ الرَّجُلانِ، فيَرْمِيَ كلُّ واحِدٍ مِنْهُمَا صاحِبَه بِمَا يسوءُهُ من القَذْعِ. وَمِمَّا يستدرَكُ عَلَيْهِ: السَّبْعُ المَثاني: الفاتِحَةُ، لأَنَّها سَبْعُ آياتٍ، وَقيل: السُّوَرُ الطِّوالُ من الْبَقَرَة إِلَى الأَعرافِ، كَمَا فِي المُفرَداتِ، وَفِي اللِّسَان إِلَى التَّوبَةِ، على أَن تُحسَبَ التَّوْبَةُ والأَنفالُ بسورَةٍ واحِدَةٍ، وَلِهَذَا لم يُفصَل بينَهما بالبَسْمَلَةِ فِي المُصْحَف. وَهَذَا سَبيعُ هَذَا، أَي سابِعُه. وَهُوَ سابِعُ سَبْعَةٍ، وسابِعُ سِتَّةٍ. وأَسْبَعَ الشيءَ: صيَّرَهُ سَبْعَةً. وسَبَّعَتِ المَرأَةُ: ولَدَتْ لِسَبْعَةِ أَشْهُرٍ. وسُبِعَ المَولودُ: حُلِقَ رأْسُه، وذُبِحَ عَنهُ لسَبْعَة أَيّامٍ، قَالَه ابْن دُرَيدٍ. وسَبَّعَ اللهُ لكَ: رَزَقَكَ سَبعةَ أَولادٍ، وَهُوَ على الدُّعاءِ. وثَوبٌ سُباعِيٌّ، إِذا كانَ طولُه سَبعَ أَذْرُعٍ، أَو سبعَةَ أَشْبارٍ، لأَنَّ الشِّبْرَ مُذَكَّر، والذِّراعَ مُؤَنَّثةٌ. وبَعيرٌ مُسَبَّعٌ، كمُعَظَّمٍ، إِذا زادَت فِي مُلَيْحائِه سَبْعُ مَحالاتٍ. والمُسَبَّعُ من العروضِ: مَا بُنِيَ على سَبعَةِ أَجزاءٍ. وجَمْعُ السَّبْعِ: سُبوعٌ وسُبوعَةٌ،)كصُقورٍ وصُقورَةٍ. وسُبِعَت الوَحْشِيَّةُ، فَهِيَ مَسْبوعَةٌ: أَكَلَ السَّبُعُ ولَدَها. والسِّباعُ، ككِتابٍ: موضعٌ، أَنشدَ الأَخفَشُ:(أَطلال دارٍ بالسِّباعِ فَحَمَّةٍ ... سأَلْتُ فلَمّا اسْتَعْجَمَت ثمَّ صَمَّتِ)والسُّبَيعانِ: جَبلانِ، قَالَ الرَّاعي:(كأَنّي بصَحراءِ السُّبَيْعَيْنِ لَمْ أَكُنْ ... بأَمثال هِندٍ قبلَ هِنْدٍ مُفَجَّعا)وأَسْبَعَت الطَّريقُ: كَثُرَ فِيهَا السِّباعُ. والمُتَسَبَّعُ: مَوضِعُ السَّبُعِ. وأَبو السِّباع: كُنيَةُ إسماعيلَ عَلَيْهِ السَّلام، لأَنَّه أَوَّل مَن ذُلِّلَتْ لَهُ الوُحوشُ. ويُقال: مَا هُوَ إلاّ سَبُعٌ من السِّباعِ، للضَّرارِ. وَهُوَ مَجاز. وأَسْبَعَ لامرأَتِهِ: لُغَةٌ فِي سَبَّعَ. وأُمُّ الأَسْبُعِ بنتُ الحافي بنِ قُضاعَةَ، بضَمِّ الباءِ، هِيَ أُمُّ أَكْلُبٍ وكِلابٍ ومَكْلَبَة، بني رَبيعَة بنِ نِزارٍ. وسُبَيْعَةُ بنُ غَزالٍ: رَجُلٌ من العرَب لَهُ حديثٌ.ووَزْنُ سَبْعَةَ: لَقَبٌ. وأَبو الرَّبيعِ سُليمانُ بنُ سَبعٍ السَّبْتِيّ، وَقد تُضَمُّ الباءُ: صاحِبُ شِفاءِ الصُّدور. والسَّبْعِيَّةُ: طائفَةٌ من غلاةِ الشِّيعَة. وكُزُبَيْرٍ: سُبَيْعُ بنُ الحارِثِ بنِ أُهْبانَ السُّلَمِيُّ، من ولَده أَحمرُ الرَّأْسِ بن قرَّةَ بنِ دُعموصِ بن سُبَيع السُّبَيْعِيُّ: شاعرٌ، روَت عَنهُ ابنَتُه أُمُّ سُرَيْرَةَ كثيرا من شعرِه، أَنشدَه عَنْهَا الهَجَرِيُّ فِي نوادرِه. وكجُهَيْنَةَ: سُبَيْعَةُ بنُ رَبيع بنِ سُبَيْعٍ القُضاعِيّ، من ولَده: أَوْسُ بنُ مالِكِ بنِ زينةَ بنِ مالِك بن سُبيعَةَ، كَانَ شريفاً، ذكَرَه الرُّشاطِيُّ.وبِرْكَةُ السَّبْعِ: قَريَةٌ بمِصْر. وسُوَيْقَةُ السَّبَّاعِينَ: خُطَّةٌ بهَا. وأَبو محمّدٍ عبدُ الحَقِّ بنُ إبراهيمَ بنِ نَصْرٍ، الشهيرُ بِابْن سَبعين المَكّيُّ المُرسِيُّ الأَندلسيُّ المُلَقَّبُ بقُطْبِ الدِّينِ، وُلدَ سنةَ خَمسمائةٍ وأَرْبَعَةَ عَشَرَ، وتُفِّيَ بمَكَّةَ سنةَ ستِّمائةٍ وتِسْعٍ وعشرينَ. ودَرْبُ السَّبيعيّ بحَلَب، وَإِلَيْهِ نُسِبَ أَبو عَبْد الله الحُسَيْنُ بنُ صالِح بنِ إسماعيلَ بنِ عُمَرَ بنِ حَمّادِ بنِ حَمزةَ الحلبيُّ السَّبيعيّ، مُحَدِّث ابْن مُحَدِّثٍ، وابنُ عَمِّ أَبيه الحَسَنُ بنُ أَحمدَ بنِ صَالح: حافِظٌ ثِقَةٌ.
