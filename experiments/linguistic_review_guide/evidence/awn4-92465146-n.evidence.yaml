            definitions_text: 'س ب ع: السُّبْعُ جُزْءٌ مِنْ سَبْعَةٍ وَ (سَبَعَ) الْقَوْمَ صَارَ (سَابِعَهُمْ) أَوْ أَخَذَ
              سُبْعَ أَمْوَالِهِمْ وَبَابُهُ قَطَعَ. وَ (السَّبْعُ) بِضَمِّ الْبَاءِ وَاحِدُ (السِّبَاعِ) وَ (السَّبُعَةُ)
              اللَّبُؤَةُ. وَأَرْضٌ (مَسْبَعَةٌ) بِوَزْنِ مَتْرَبَةٍ ذَاتُ سِبَاعٍ. وَ (السَّبِيعُ) السُّبْعُ. وَالْأُسْبُوعُ
              مِنَ الْأَيَّامِ. وَطَافَ بِالْبَيْتِ أُسْبُوعًا أَيْ سَبْعَ مَرَّاتٍ. وَثَلَاثَةُ (أَسَابِيعَ) . وَ (سَبَّعَ)
              الشَّيْءَ (تَسْبِيعًا) جَعَلَهُ سَبْعَةً. وَقَوْلُهُمْ وَزْنُ (سَبْعَةٍ) يَعْنُونَ بِهِ سَبْعَةَ مَثَاقِيلَ.'
