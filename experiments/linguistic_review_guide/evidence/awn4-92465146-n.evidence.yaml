            definitions_text: "سبع\n سَبَعَ(n. ac.\n سَبْع)\na.  Was the seventh of; took a seventh of; made sevenfold \n\
              \ of seven strands (rope). \nb. Shot at; frightened.\n c. Reviled.\n d. Stole, seized, carried off.\n سَبَّعَa.\
              \ Made seven, divided into seven parts; did seven times;\n made a heptagon.\n b.  [La], Gave back sevenfold\
              \ to. \n سَاْبَعَa. Used foul language to.\n أَسْبَعَa. Was seven.\n b. Had his flocks attacked by wild beasts;\
              \ gave to eat of \n the flesh of wild beasts.\n c.  Put out to nurse (child). \n إِسْتَبَعَa.  see I (d)\n سَبْع\n\
              \ [ fem. ]\na. Seven.\n b. Place of the last judgment.\n c.  Grave (affair). \nd.  see 6 \n سَبْعَة\n [ mas.\
              \ ]\na. Seven.\n b. Female wild beast.\n سُبْع\n (pl.\n أَسْبَاْع)\na. Seventh part.\n سَبَع\n سَبُع (pl.\n\
              \ أَسْبُع سِبَاْع)\na. Wild beast, beast of prey.\n b.  [ coll. ], Lion. \n سَبُعَةa. Female wild beast.\n سَاْبِع\n\
              \ (pl.\n سَبَعَة)\na. Seventh.\n سُبَاْعِيّa. Sevenfold, consisting of seven parts.\n b. Tall; big, bulky; fullgrown.\n\
              \ سَبِيْعa.  see 3 \n N. P.\n سَبَّعَa. Heptagon.\n سَبْعِيْن سَبْعُوْن\n a. Seventy.\n أُسْبُوْع (pl.\n أَسَاْبِيْعُ)\n\
              a. Week.\n b. Seven times."
