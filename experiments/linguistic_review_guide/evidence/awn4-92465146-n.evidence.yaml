                بنُ إبراهيمَ، وابنُهُ أحمدُ، وحَفيدُهُ مُحمدٌ السَّبْعِيُّونَ: محدِّثونَ.والسَّبُعُ، بضم الباءِ وفتحها وسُكونِها:
                المُفْتَرِسُ من الحَيَوانِ، ج: أسْبُعٌ وسِباعٌ،وأرضٌ مَسْبَعَةٌ، كَمَرْحَلَةٍ: كثيرَتُهُ.وذاتُ السِّباعِ،
                ككِتابٍ: ع.ووادِي السِّباعِ: بطَرِيقِ الرَّقَّةِ، مَرَّ به وائلُ بنُ قاسِطٍ على أسْماءَ بنتِ دُرَيْمٍ، فَهَمَّ
                بها حين رآها مُنْفَرِدَةً في الخباءِ، فقالتْ له: والله لئن هَمَمْتَ بِي لَدَعَوْتُ أسْبُعِي، فقال: ما أَرَى
                في الوادي غيرَكِ، فَصاحَتْ بِبَنِيها: يا كَلْبُ يا ذئبُ يا فَهْدُ يا دُبُّ يا سِرْحانُ يا سِيدُ يا ضَبُعُ
                يا نَمِرُ، فجاؤوُا يَتَعادَوْنَ بالسُّيوف، فقال: ما أرَى هذا إلا وادِيَ السِّباعِ،والسَّبْعِيَّةُ: ماءَةٌ
                لبني نُمَيْرٍ.والسَّبْعونَ: عَدَدٌ م، ومحمدُ بنُ سَبْعونَ المُقْرِئُ المَكّيُّ، وعبدُ الله بنُ سَبْعونَ: محدّثٌ.وسَبْعينُ:
                ة بحَلَبَ، كانت إقْطاعاً للمُتَنَبِّئ من سَيْفِ الدَّوْلَةِ.والسَّبُعانُ، بضم الباءِ: ع ببلادِ قَيْسٍ.والسَّبْعَةُ،
                وتُضَمُّ الباءُ: اللبُؤَةُ. وككتابٍ: ابنُ ثَابِتٍ، وابنُ زَيْدٍ، وابنُ عُرْفُطَةَ. وكزبيرٍ: ابنُ حاطِبٍ، وابنُ
                قَيْسٍ: صحابيُّونَ. وكجُهَيْنَةَ: بنتُ الحارِثِ، وبنتُ حَبيبٍ: صحابيَّتانِ.والسِّبْعُ، بالكسر: ظِمْءٌ من أظْماءِ
                الإِبِلِ، وهو أن تَرِدَ في اليومِ السابعِ، وبالضم، وكأَميرٍ: جُزْءٌ من سَبْعَةٍ.وسَبَعَهُم، كضَرَبَ ومَنَعَ:
                كان سابِعَهُم، أو أخَذَ سُبْعَ أموالِهِموـ الذِّئبَ: رَماهُ، أو ذَعَرَهُ،وـ فلاناً: شَتَمَهُ، وَوَقَعَ فيه
                أو عضَّه،وـ الشيءَ: سَرَقَه،كاسْتَبَعَه،وـ الذئبُ الغَنَمَ: فَرَسَهَا،وـ الحَبْلَ: جَعَلَهُ على سَبْعِ طاقاتٍ،والسُّباعِيُّ،
                بالضم: الجَمَلُ العظيمُ الطويلُ، وهي بهاءٍ.ورجُلٌ سُباعِيُّ البَدَنِ: كذلك.والأسْبوعُ من الأيَّامِ،والسُّبُوعُ،
                بضمهما: م. وطافَ بالبَيْتِ سَبْعاً وأُسْبوعاً وسُبوعاً. وكأَميرٍ: السَّبيعُ بنُ سَبْعٍ، أبو بَطْنٍ من هَمْدانَ،
                منهم: الإِمامُ أبو إسحاقَ عَمْرُو بنُ عبدِ الله، ومَحَلَّةٌ بالكوفة مَنْسوبَةٌ إليهم أيضاً. وأسْبَعَ: وَرَدَتْ
                إبِلُهُ سبْعاً،وـ القومُ: صاروا سَبْعَةً،وـ الرُّعْيانُ: وَقَعَ السَّبُعُ في مَواشِيهم،وـ ابْنَهُ: دَفَعَه
                إلى الظُّؤرةِ،وـ فلاناً: أطْعَمَه السَّبُعَ،وـ عَبْدَهُ: أَهْمَلَه.والمُسْبَعُ، كمُكْرَمٍ: المُتْرَفُ، أو
                الدَّعِيُّ، أو وَلَدُ الزِّنا، أو من تموت أمُّهُ فَيُرْضِعُهُ غيرُها، أو مَنْ في العُبودِيَّةِ إلى سَبْعَةِ
                آباءٍ، أو إلى أربَعَةٍ، أو من أُهْمِلَ مع السِّباعِ فَصارَ كَسَبُعٍ خُبْثاً، أو المَوْلودُ لسَبْعَةِ أشهرٍ.وسَبَّعَهُ
                تَسْبيعاً: جَعَلَهُ سَبْعَةً، وجَعَلَه ذا سَبْعَةِ أرْكانٍ،وـ الإِناءَ: غَسَلَهُ سَبْعَ مَرَّاتٍ،وـ اللهُ
                لَكَ: أعْطاكَ أجْرَكَ سَبْعَ مَرَّاتٍ أو سَبْعَةَ أضْعافٍ،وـ القرآنَ: وظَّفَ عليه قِراءَتَهُ في كلِّ سَبْعِ
                لَيالٍ،وـ لامْرَأتِهِ: أقامَ عندَها سَبْعَ لَيالٍ،وـ دَراهمَهُ: كَمَّلَها سَبْعينَ، وهذه مُوَلَّدَةٌ،وـ القومُ:
                تمَّتْ سَبْعَ مِئَةِ رجُلٍ.والسِّباعُ، ككتابٍ: الجِماعُ، والفَخَارُ بكَثْرَتِهِ، والرَّفَثُ، والتَّشاتُمُ.'
