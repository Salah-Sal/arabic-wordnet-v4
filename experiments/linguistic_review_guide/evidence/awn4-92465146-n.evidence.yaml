        examples:
        - idx: 0
          type: quran
          text: '{ ثُمَّ فِي سِلْسِلَةٍ ذَرْعُهَا سَبْعُونَ ذِرَاعًا فَاسْلُكُوهُ }'
          attribution: الحاقة/ 32
        - idx: 1
          type: quran
          text: '{ إِن تَسْتَغْفِرْ لَهُمْ سَبْعِينَ مَرَّةً فَلَن يَغْفِرَ اللّهُ لَهُمْ }'
          attribution: التوبة/ 80
        - idx: 2
          type: quran
          text: '{ وَاخْتَارَ مُوسَى قَوْمَهُ سَبْعِينَ رَجُلاً لِّمِيقَاتِنَا }'
          attribution: الأعراف/ 155
        - idx: 3
          type: quran
          text: '{ كَمَثَلِ حَبَّةٍ أَنبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنبُلَةٍ مِّئَةُ حَبَّةٍ }'
          attribution: البقرة/ 261
        - idx: 4
          type: hadith
          text: إنى لأستَغفِر الله فى اليوم وأتوب إليه أكثر من سَبْعين مرةً
          attribution: null
        - idx: 5
          type: poetry
          text: |-
            يُضْرَب السَّبْعون فى خَلْخَالِها
