            definitions_text: '(سَبَعَ)فِيهِ «أُوتيتُ السَّبْعَ المَثاني» وَفِي رِوَايَةٍ «سَبْعاً مِنَ الْمَثانِي»قِيلَ هِيَ
              الْفَاتِحَةُ لِأَنَّهَا سبعُ آيَاتٍ. وَقِيلَ السُّورُ الطِوالُ مِنَ البَقَرة إِلَى التَّوبة، عَلَى أَنْ تُحْسَبَ
              التوبةُ وَالْأَنْفَالُ بِسُورَةٍ وَاحِدَةٍ، وَلِهَذَا لَمْ يُفْصَلْ بَيْنَهُمَا فِي المُصْحف بِالْبَسْمَلَةِ.
              وَمِنْ فِي قَوْلِهِ: مِنَ الْمَثَانِي، لتَبْيين الجنْس، ويجوزُ أَنْ تَكُونَ للتْبعيض: أَيْ سَبْعُ آيَاتٍ أَوْ
              سَبْعَ سُور مِنْ جُمْلَةِ مَا يُثْنَى بِهِ عَلَى اللَّهِ مِنَ الْآيَاتِ.وَفِيهِ «إِنَّهُ ليُغانُ عَلَى قَلْبي
              حَتَّى أسْتَغْفر اللَّهَ فِي الْيَوْمِ سَبْعِينَ مَرَّةً» قَدْ تَكَرَّرَ ذِكْرُ السَّبْعِينَ والسَّبْعَة والسَّبْعمائة
              فِي الْقُرْآنِ وَالْحَدِيثِ. والعربُ تضعُها موضعَ التَّضْعِيفِ وَالتَّكْثِيرِ، كَقَوْلِهِ تعالى كَمَثَلِ حَبَّةٍ
              أَنْبَتَتْ سَبْعَ سَنابِلَوَكَقَوْلِهِ «إِنْ تَسْتَغْفِرْ لَهُمْ سَبْعِينَ مَرَّةً فَلَنْ يَغْفِرَ اللَّهُ لَهُمْ»وَكَقَوْلِهِ
              [عَلَيْهِ السَّلَامُ] «الحَسنة بعشْر أمثالِها إِلَى سَبْعِمِائَةٍ» وأعْطَى رَجُلٌ أعْرابيا دِرهما فَقَالَ: سَبَّعَ
              اللَّه لَكَ الْأَجْرَ، أَرَادَ التَّضْعِيفَ.(هـ) وَفِيهِ «لِلْبِكْرِ سَبْعٌ وللثَّيِّب ثلاثٌ» يجبُ عَلَى الزَّوج
              أَنْ يَعْدِل بَيْنَ نِسائه فِي القَسْم فيُقيم عِنْدَ كُلِّ وَاحِدَةٍ مِثْلَ مَا يُقِيمُ عِنْدَ الْأُخْرَى، فَإِنْ
              تزوَّج عَلَيْهِنَّ بِكْرًا أقامَ عِنْدَهَا سَبْعَةَ أَيَّامٍ لَا تَحْسِبها عَلَيْهِ نِساؤه فِي القَسْم، وَإِنْ
              تَزوّج ثَيّبا أَقَامَ عِنْدَهَا ثلاثةَ أَيَّامٍ لَا تُحْسب عَلَيْهِ.وَمِنْهُ الْحَدِيثُ «قَالَ لِأُمِّ سَلَمَةَ
              حِينَ تَزَوجها- وَكَانَتْ ثَيِّبًا- إِنْ شئتِ سَبَّعْتُ عندِك ثُمَّ سَبَّعْتُ عِنْدَ سَائِرِ نسائِي، وَإِنْ
              شئِت ثلَّثْتُ ثُمَّ دُرْت» أَيْ لَا أحتَسِب بِالثَّلَاثِ عَلَيْكِ. اشتقُّوا فَعَّل مِنَ الْوَاحِدِ إِلَى العَشَرة،
              فَمَعْنَى سَبَّعَ: أَقَامَ عِنْدَهَا سْبعاً، وثلَّث أَقَامَ عِنْدَهَا ثَلَاثًا. وسَبَّعَ الإناءَ إِذَا غَسَله
              سْبع مرَّات، وَكَذَلِكَ مِنَ الوَاحِد إِلَى العَشَرة فِي كُلّ قَول أَوْ فِعْل.(هـ) وَفِيهِ «سَبَّعَتْ سُليم
              يَوْمَ الْفَتْحِ» أَيْ كَمَلت سبعمائةَ رَجُلٍ.(هـ) وَفِي حَدِيثِ ابْنِ عَبَّاسٍ وسُئل عَنِ مَسئلة فَقَالَ «إِحْدَى
              مِنْ سَبْعٍ» أَيِ اشتدَّتْ فِيهَا الفُتْيا وعظُم أمرُها. ويجوزُ أَنْ يَكُونَ شبَّهَها بإحْدَى اللَّيالي السَّبْع
              الَّتِي أرسَل اللَّهُ فِيهَا الرِّيح عَلَى عَاد، فضَرَبها لَهَا مَثَلًا فِي الشدَّة لإشْكالها. وَقِيلَ أرادَ
              سْبعَ سِنِى يُوسُف الصِّديق عَلَيْهِ السَّلَامُ فِي الشِّدة.وَمِنْهُ الْحَدِيثُ «إِنَّهُ طافَ بِالْبَيْتِ أُسْبُوعاً»
              أَيْ سَبْع مرَّات.وَمِنْهُ «الْأُسْبُوعُ للأيَّام السَّبْعة» . وَيُقَالُ لَهُ سُبُوعٌ بِلَا ألِفٍ لُغَة فِيهِ
              قليلةٌ. وَقِيلَ هُوَ جَمْعُ سُبْعٍ أَوْ سَبْعٍ، كَبُرْدٍ وَبُرُودٍ، وَضَرْبٍ وَضُرُوبٍ.وَمِنْهُ حَدِيثُ سَلَمَةَ
              بْنِ جُنَادة «إِذَا كَانَ يَوْمُ سُبُوعِه» يُريد يَوْمَ أُسْبُوعِهِ مِنَ العُرْس: أَيْ بَعْد سَبْعة أَيَّامٍ.(هـ
              س) وَفِيهِ «إِنَّ ذِئْبًا اختطفَ شَاةً مِنَ الغَنم أيامَ مبعَثِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ،
              فانتزَعها الرَّاعِي مِنْهُ، فَقَالَ الذئبُ: مَنْ لهَا يَوْمَ السَّبْعِ؟» قَالَ ابْنُ الْأَعْرَابِيِّ: السَّبْعُ
              بِسُكُونِ الْبَاءِ:الموضعُ الَّذِي إِلَيْهِ يكونُ المحْشَر يَوْمَ الْقِيَامَةِ، أَرَادَ مَنْ لَها يَوْمَ القيامةِ.
              والسَّبْعُ أَيْضًا: الذُّعْرُ، سَبَعْتُ فَلَانَا إِذَا ذَعّرْته. وسَبَعَ الذّئبُ الغنمَ إِذَا فرَسَها: أَيْ
              مَن لَهَا يومَ الفَزَع. وَقِيلَ هَذَا التأويلُ يفْسُدُ بِقَوْلِ الذِّئب فِي تَمام الحَديث: يومَ لَا رَاعِي لَهَا،
              غَيْري. وَالذِّئْبُ لَا يكونُ لَهَا رَاعياً يَوْمَ الْقِيَامَةِ.وَقِيلَ أرادَ مَنْ لَهَا عِنْدَ الفِتَن حينَ
              يتركُها الناسُ همَلا لاَ رَاعِي لَهاَ، نُهْبُةً لِلذِّئَابِ والسِّبَاعِ، فَجُعِلَ السَّبُع لَهَا رَاعِيًا إِذْ
              هُو مُنْفَردٌ بِهَا، ويكونُ حِينَئِذٍ بضَمّ البَاء. وَهَذَا إنْذارٌ بِمَا يكونُ مِنَ الشَّدائِد والفِتَن الَّتِي
              يُهْملُ الناسُ فِيهَا مواشِيهَم فَتَسْتَمْكِنُ مِنْهَا السّباع بلامانع. وَقَالَ أبُو مُوسَى بِإِسْنَادِهِ عَنْ
              أَبِي عُبَيْدَة: يومُ السَّبْع عيدٌ كَانَ لهُم فِي الجَاهِليَّة يشتَغِلُون بِعيدِهم ولَهْوهِم، وَلَيْسَ بالسَّبُع
              الَّذِي يَفْتَرِسُ الناسَ. قَالَ: وأملاهُ أَبُو عامِر العبْدَرى الْحَافِظُ بِضَمِّ الباَءِ، وَكَانَ مِنَ العِلمُ
              والإتْقاَن بمكانْ.وَفِيهِ «نَهَى عَنْ جُلود السِّبَاعِ» السِّبَاعُ تَقَعُ عَلَى الأُسْد والذِّئاب والنُّمُور
              وغَيرها. وَكَانَ مَالِكٌ يكرَه الصلاةَ فِي جُلُود السِّباع وَإِنْ دُبِغَت، ويمنعُ مِنْ بَيْعِهَا. واحتْجَّ بِالْحَدِيثِ
              جماعةٌ، وَقَالُوا إنَّ الدِّبَاغَ لَا يُؤثْر فِيمَا لَا يُؤْكل لحمُه. وذَهب جماعةٌ إِلَى أَنَّ النَّهي تناوَلَها
              قَبْلَ الدِّباغ، فَأَمَّا إِذَا دُبِغَت فَقَدْ طهُرَت. وَأَمَّا مذَهب الشَّافِعِي فَإِنَّ الدِّباغ يطَهِّر جُلود
              الحَيَوان المأكُول وَغَيْرِ المأكُول إِلَّا الكَلْب والخِنْزِير وَمَا تَوَلَّدَ مِنْهُمَا، وَالدِّبَاغُ يُطَهِّرُ
              كُلَّ جِلْدِ ميتَةِ غَيرهما. وَفِي الشُّعُور والأوْبارِ خلافٌ هَلْ تطهُر بالدِّباغ أَمْ لَا. وَقِيلَ إِنَّمَا
              نَهى عَنْ جُلود السِّبَاعِ مُطْلَقاً، وَعَنْ جِلْد النَّمِر خَاصًّا، ورَدَ فِيهِ أحاديثُ لِأَنَّهُ مِنْ شِعاَر
              أهْل السَّرَف والخُيَلاَء.وَمِنْهُ الْحَدِيثُ «أَنَّهُ نَهى عَنْ أكْل كُلِّ ذِي نَابِ مِنَ السِّبَاع» هُوَ مَا
              يفتَرس الْحَيَوَانَ ويأكُله قهْراً وقَسْرا، كالأسَد وَالنَّمِرِ والذِّئب ونحْوها.(هـ) وَفِيهِ «أَنَّهُ صُبَّ
              عَلَى رَأْسِهِ الماءَ مِنْ سِبَاعٍ كَانَ مِنْه فِي رَمَضان» السِّبَاعُ: الجماعُ.وَقِيلَ كثرَتُه.(هـ) وَمِنْهُ
              الْحَدِيثُ «أَنَّهُ نَهَى عَنْ السِّبَاعِ» هُوَ الفَخَار بكثْرةِ الْجِمَاعِ. وَقِيلَ هُوَ أَنْ يتساَبَّ الرَّجُلان
              فيَرمِي كُلُّ وَاحِدٍ صَاحِبَهُ بِمَا يَسُوءُهُ. يُقَالُ سَبَعَ فُلَانٌ فَلَانَا إِذَا انتْقَصَه وعابَه .وَفِيهِ
              ذِكْرُ «السَّبِيع» هُوَ بِفَتْحِ السِّينِ وَكَسْرِ الْبَاءِ: مَحلَّة مِنْ مَحالّ الْكُوفَةِ مَنْسُوبَةٌ إِلَى
              القَبيلَة، وَهُمْ بَنُو سَبِيعٍ مِنْ هَمْدَان.'
