            definitions_text: |-
              السَّابِعُ عَشَرَالجذر: س ب ع
              مثال: جَاء اليومُ السابِعُ عَشَرَالرأي: مرفوضة عند الأكثرينالسبب: للخطأ في إعراب الجزء الأول من وصف العدد المركَّب بالرفع، وهو يُبْنَى على فتح الجزأين.
              الصواب والرتبة: -جاء اليومُ السابِعَ عَشَرَ [فصيحة]-جاء اليومُ السابِعُ عَشَرَ [صحيحة] التعليق: القاعدة السائدة أنَّ الأعداد المركَّبة، من «11» إلى «19»، وكذلك الأوصاف منها تُبْنَى على فتح الجزأين، مهما كان موقعها الإعرابي في الجملة، ويمكن تصحيح الاستعمال المرفوض باعتباره جاء على أحد الوجوه التي ذكرها النحاة في الوصف من العدد المركَّب عندما يضاف إلى لفظ العدد، وقد أضيف فيه صَدر الوصف المركَّب إلى عجز العدد المركَّب، ثم ضُبِط الطرف الأول حسب موقعه في الجملة، وأُبقي الثاني على حاله من البناء على الفتح، ويكون التقدير في المثال المرفوض: «السابعُ سَبْعةَ عَشرَ» أي: «البالغ سَبعَةَ عَشرَ» أو «المتمم سبعةَ عَشَرَ»، أو «تمام السبعةَ عَشَرَ، أو كمالها».
