          - entry_id: 840413
            dictionary_id: 127
            headword: سبع
            headword_bare: سبع
            headword_norm: سبع
            root: سبع
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'سبعأصل السَّبْع العدد، قال: سَبْعَ سَماواتٍ [البقرة/ 29] ، سَبْعاً شِداداً [النبأ/ 16] ، يعني:
              السموات السّبع وسَبْعَ سُنْبُلاتٍ [يوسف/ 46] ، سَبْعَ لَيالٍ [الحاقة/ 7] ، سَبْعَةٌ وَثامِنُهُمْ كَلْبُهُمْ
              [الكهف/ 22] ، سَبْعُونَ ذِراعاً [الحاقة/ 32] ، سَبْعِينَ مَرَّةً [التوبة/ 80] ، سَبْعاً مِنَ الْمَثانِي[الحجر/
              87] . قيل: سورة الحمد لكونها سبع آيات، السَّبْعُ الطّوال: من البقرة إلى الأعراف، وسمّي سور القرآن المثاني، لأنه
              يثنى فيها القصص، ومنه: السَّبْعُ، والسَّبِيعُ والسِّبْعُ، في الورود. والْأُسْبُوعُ جمعه: أَسَابِيعُ، ويقال:
              طفت بالبيت أسبوعا، وأسابيع، وسَبَعْتُ القومَ: كنت سابعهم، وأخذت سبع أموالهم، والسَّبُعُ:معروف. وقيل: سمّي بذلك
              لتمام قوّته، وذلك أنّ السَّبْعَ من الأعداد التامّة، وقول الهذليّ:كأنّه عبد لآل أبي ربيعة مسبعأي: قد وقع السّبع
              في غنمه، وقيل: معناه المهمل مع السّباع، ويروى (مُسْبَع) بفتح الباء، وكنّي بالمسبع عن الدّعيّ الذي لا يعرف أبوه،
              وسَبَعَ فلان فلانا: اغتابه، وأكل لحمه أكل السّباع، والْمَسْبَع: موضع السَّبُع.'
            translation_en: null
            translation_fr: null
            domain: null
