          - entry_id: 905257
            dictionary_id: 132
            headword: سبع
            headword_bare: سبع
            headword_norm: سبع
            root: سبع
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              سبع
              سَبَعْتُه: أي وَقَعْتَ فيه. وقَتَلْتَه. وذَعَرْته؛ جميعاً. وسَبَعَ الذئب الشاهَ: افْتَرَسَها. وراعِيها: مُسْبَع وسَبعْتُه: غَسَلْتَه سَبْع مرات.
              والسبَاعِي من الجِمال: العَظيمُ الطَّويل. والمُسْبَع: المُسْلَم إلى الظؤورة. وفي لغَة تميمٍ: الدعِي. وفي لغة هُذَيل: المُهْمَلُ في الرُّعْي حتى صار كالسبُع. وهو وَلَدُ الزنا أيضاً.
              والذي وُلدَ يسَبْعة أشْهُر فلم تُنْضِجْه الشُّهور، وامه: مُسْبعٌ. والذي يُنْسَب إلى سَبْعة آباء في العُبُودة أو اللؤم. والأسْبُوع: تَمامُ سَبْعة أيّام، ويُسَمى ذلك كلُّه اسْبوعاً واحداً، وكذلك الأسْبُوع من الطواف ونَحوه، وجَمْعُه أسابِيْعُ وأسْبُوْعات.
              وسَبَعْتُهم: صِرْت سابِعَهم، وأنا سابع، والجمع سبَعَة. وأسْبَعْتُهم وسبعْتُهم: تممْتهم سَبْعَةً.
              وسَقَيْنا الإبلسِبْعاً: أي السابعَ من يَوْم الشرْب. والسُّبْعُ والسَّبِيْعُ واحِدٌ.
              وقَوْلُهم: " لأعْمَلَنً به عَمَلَ سَبْعَةٍ "، أرِيْدَ به المُبَالَغَةُ في الشر، وقيل: عَمَلَ سَبْعة رِجال، وقيل: أريْدَ سَبُعَة: وهي اللبُوءة. وأرْض مَسْبعةٌ: ذاتُ سِبَاع.
              والسبُعُ من الطير: ما أكَلَ اللحمَ خالصاً. ورَجُلٌ سَبِيْعِي: من قَبيلةٍ من قَبائل اليَمَن.
              وسَبُعَانُ: اسْمُ مَوضِع، ولم يَجِيء على هذا البِناءِ غَيْرُه.
            translation_en: null
            translation_fr: null
