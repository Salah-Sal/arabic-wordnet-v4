            is_partial: 0
            definitions_text: 'الشَّىْءَ: جَعَلَهُ سَبْعَةً وقع السبعُ في غَنَمهم فلانٌ: وَرَدَتْ إِبلُهُ سِبْعًا المرأةُ:
              وَلَدَتْ لسَبْعَة أَشْهُر. فهى مُسْبِعٌ, والولدُ مُسْبَعٌ المكانُ, أو الطريقُ: كَثُرَتْ به السِّباعُ فلانٌ عند
              امرأته, ولها: أقام عندها سَبْعُ ليالٍ (لغة فى سَبَّع لها) فلانًا: أَطْعمه السَّبُعَ وقيل: أطعمه لَحْمَ السَّبُع
              الشَّىْءَ: صَيَّره سَبْعةً. يقال: أَسْبَعَ العَدَدَ ابْنَهُ: دفعه إلى الظِّئْرِ (المُرْضِع) الوَلَدَ, أو العَبْدَ:
              أَهْمَلَهُ أسْبَعَ فلانٌ غُلامَه على الناس: إذا تركهُ يَصْنَع ما يشاء'
