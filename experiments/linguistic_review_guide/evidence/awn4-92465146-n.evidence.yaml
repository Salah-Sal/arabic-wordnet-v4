        is_partial: 1
        definitions_text: 'الذى له سَبْعَةُ آباءٍ فى العبودية أو فى اللُّؤْم الذى يُنْسَبُ إلى أربعة أو سبعة أمهاتٍ, كلٌّ
          منهنَّ أَمَةٌ المُتْرَفُ الدَّعِىُّ وَلَدُ الزِّنَا التَّابِعَةُ المُهمَلُ الذى لم يُكَفَّ عن جُرْأَتِه فَبَقَى
          عليها. يقال: عَبْدٌ مُسْبَعٌ : مُهْمَلٌ جَرِىءٌ تُرِكَ حتى صار كالسَّبُع بَعِيرٌ مُسْبَعٌ: إذا زادت فى مَلْيَحائِه
          سَبْعُ مـ حالاتٍ'
