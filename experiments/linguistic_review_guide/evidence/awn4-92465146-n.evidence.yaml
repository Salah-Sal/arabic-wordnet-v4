            root: قطع
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: هو أداة تُستخدم للفصل التام للوصلات الأنبوبية البلاستيكية في زاوية قائمة بالنسبة للمحور الطولي
              دون رايش، الأمر الذي يحدث بفعل استمرار الضبط اللاحق للعجلة القاطعة مع الدوران المُتزامن حول الماسورة. ولا يجوز
              استخدام قواطع المواسير مع المواسير المعدنية، وإلا فسيتكوّن رايش صلب داخل المواسير، الذي من شأنه أن يتسبب في
              تضييق القطر الداخلي للماسورة. ونتيجةً لذلك يُمكن أن تصبح الوصلات الطرفية غير مُحكمة ضد التسريب.
