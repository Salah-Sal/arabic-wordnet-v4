          - entry_id: 853369
            dictionary_id: 129
            headword: سبع عُيُون
            headword_bare: سبع عيون
            headword_norm: سبع عيون
            root: سبع
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              سبع عُيُونالجذر: ع ي ن
              مثال: في تلك المنطقة سبع عيون للماءالرأي: مرفوضةالسبب: لاستعمال جمع الكثرة تمييزًا لأدنى العدد.
              الصواب والرتبة: -في تلك المنطقة سبع عُيُون للماء [فصيحة] التعليق: أوجب كثير من النحويين أن يكون مميز الثلاثة إلى العشرة جمعًا مُكسَّرًا من أبنية القلَّة، ولايكون من أبنية الكثرة إلاَّ فيما أُهمل بناء القلة فيه، كـ «رِجال»، ولكن مجمع اللغة المصري لم يشترط ذلك، حيث أقر التعاقب (التبادل) بين جمعي القلة والكثرة، معتمدًا في ذلك على عدة نصوص واردة عن بعض كبار اللغويين القدماء كسيبويه والزمخشري وابن يعيش وابن مالك وصاحب المصباح، ومنها قول سيبويه: «اعلم أن لأدنى العدد أبنية هي مختصة به وهي له في الأصل وربما شرَكه فيها الأكثر، كما أنَّ الأدنى ربما شارك الأكثر»، وقول الزمخشري: «قد يستعار جمع الكثرة لموضع جمع القلة» .. إلى غير ذلك من النصوص. والملاحظ أنَّ النحاة لم يتفقوا على مفهوم جمع الكثرة، فقد رأى بعضهم أنه يدلّ على ما فوق العشرة، ورأى بعضٌ آخر أنه يكون من الثلاثة إلى ما لانهاية، ومن ثم يكون الخلاف بينه وبين جمع القلة من جهة النهاية فقط؛ ولذا يتضح فصاحة الاستعمال المرفوض، وهو ما أقره الاستعمال القرآني في: {ثَلاثَةَ قُرُوءٍ} البقرة/228، مع وجود الجمعين «أقراء»، و «أقرؤ» في اللغة.
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:33:3429
