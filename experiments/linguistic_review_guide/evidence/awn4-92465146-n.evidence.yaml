            definitions_text: |-
              سبعسبَعَ يَسبَع ويسبُع ويَسبِع، سَبْعًا، فهو سابِع، والمفعول مَسْبوع• سبَع الشَّيءَ: أخذ سُبْعه، أي جزءًا من سَبْعة أجزاء متساوية.• سبَع فلانًا: أخذ سُبْع ماله.• سبَع القومَ: صار سابِعهم، كمّلهم بنفسه سبعة.• سبَع الذِّئبُ الغنمَ: افترسَها. 
              أسبعَ يُسبع، إسباعًا، فهو مُسبِع، والمفعول مُسبَع (للمتعدِّي)• أسبع القومُ: صاروا سَبْعَة.• أسبعتِ الحامِلُ: ولدت في الشّهر السابع من حَمْلها.• أسبع الطَّريقُ أو المكانُ: كثُرت به السِّباعُ.• أسبع الشَّيءَ: صيَّره سَبْعَة "أسبع الشكلَ: صيَّره ذا سبعة أركان". 
              سبَّعَ يُسبِّع، تسبيعًا، فهو مُسبِّع، والمفعول مُسبَّع (للمتعدِّي)• سبَّع الشَّخصُ: مضى عليه أسبوع "سبَّعتِ العروسُ: مضى على دخولها أسبوع- سبَّعتِ الوالدةُ: مضى على ولادتها أسبوع- سبَّع المولود: مضى على ولادته أسبوع".• سبَّعتِ الحاملُ: أسبعت، ولدت لسبعة أشهر.• سبَّعَ السِّتَّةَ: سبعَهم، جعلهم سَبْعة بانضمامه إليهم.• سبَّع الإناءَ: غسله سبعَ مرّات.• سبَّع الشَّيءَ:1 - جعله ذا سَبْعة أركان أو أجزاء "سبَّع البناءَ".2 - صيّره سَبْعَة "سبَّع دخلَه/ ربحه: ضاعفه سبع مرّات" ° سبَّع اللهُ لك الأجرَ: ضاعفه سبعًا أو أكثر- سبَّع عند امرأته: أقام عندها سبع ليالٍ. 
              أُسْبوع [مفرد]: ج أسابيعُ: سبعة أيّام متتالية "قضينا أسبوعًا خارج البلاد" ° أُسْبوع الآلام: الأسبوع الذي يبدأ بيوم الأحد السابق لعيد الفِصْح عند المسيحيّين- ابن أسبوعين: البدر لأربع عشرة ليلة- جريدة أسبوعيَّة/ صحيفة أسبوعيَّة/ مجلة أسبوعيَّة: تصدر كلّ أسبوع- في بحر أسبوع: في خلاله- نصف أسبوعيّ: حدث يقع مرَّتين في الأسبوع. 
              سابِع [مفرد]:1 - اسم فاعل من سبَعَ.2 - عدد ترتيبيّ يوصف به يدلّ على فرد واحد جاء سابعًا، ما بعد السادس وقبل الثامن "الطابق السّابع- في اليوم السابع عشر من الشهر الجاري" ° سابعًا: الواقع بعد السادس ويستعمل في العَدّ فيقال: سادسًا، سابعًا، ....• سابع سِتَّة: مَنْ أو ما يضاف إلى السِّتّة فيجعلها سَبْعة.• سابع سَبْعة: أحدهم.• سابع عَشَر: عدد ترتيبيّ يوصف به يلي السَّادس عشر ويسبق الثامن عشر. 
              سُباعَ [مفرد]: سَبْعةً سَبْعةً، معدول عن سَبْعة سَبْعة بالتّكرار، يستوي فيها المذكّر والمؤنّث، وهي ممنوعة من الصّرف "اجتمع بالعمّال سُباعَ". 
              سُباعِيّ [مفرد]:1 - اسم منسوب إلى سُباعَ: ما له سَبْعة أركان أو أجزاء "مؤتمر سُباعِيّ: يضمّ ممثِّلين عن سبع دول- سُباعيّ التفاعيل: وحدة عروضيّة مكوّنة من سبع تفاعيل- لفظ سُباعيّ: مؤلّف من سبعة حروف".2 - مولود في الشَّهر السَّابع "مولودٌ سُباعيّ".• سُباعيّ الأضلاع: (هس) شكل هندسيّ محدود بسبعة أضلاع مستقيمة يتلاقى كلّ ضلعين متجاورين في نقطة تسمَّى بالرأس. 
              سُباعيّة [مفرد]:1 - اسم مؤنَّث منسوب إلى سُباعَ.2 - (سق) تأليف موسيقيّ يتألّف من سبعة أصوات أو آلات. 
              سَبْع1 [مفرد]: مصدر سبَعَ. 
              سَبْع2/ سَبُع [مفرد]: ج أسْبُع وسِباع وسُبُوع وسُبوعة: كل ما له نابٌ كالأسد والنمر والذِّئب، أو ما له مخْلَب كالصقر والحدأة، ويعدو على الناس والدوابّ ويفترسها، المفترس من الحيوان، الأنثى سَبْعة وسبُعة " {وَمَا أَكَلَ السَّبْعُ إلاَّ مَا ذَكَّيْتُمْ} [ق]- {وَمَا أَكَلَ السَّبُعُ إلاَّ مَا ذَكَّيْتُمْ} " ° أخَذه أخذ سبُعة: أخذه بشدّة. 
              سُبْع/ سُبُع [مفرد]: ج أَسْباع: جزء واحد من سبعة أجزاء متساوية من الشّيء "سُبُعُ السَّبعين عشرةٌ- حصل على سُبع المبلغ". 
              سَبْعة [مفرد]: ج سبْعات:1 - مؤنَّث سَبْع: لَبُؤة، أنثى الأسد.2 - اسم عدد أصليّ فوق السِّتة ودون الثَّمانية، يخالف المعدود في التّذكير والتّأنيث إفرادًا وتركيبًا وعطفًا "الدول الصناعيّة السبع- اجتمع بالعمال سَبْعة سَبْعة- {الَّذِي خَلَقَ سَبْعَ سَمَوَاتٍ طِبَاقًا} " ° السَّبع المثاني: سورة الفاتحة أو السُّور السَّبع الأولى من القرآن الكريم.• سَبْعة عَشَر: عدد مركّب من سَبْعة وعَشَر يلي سِتّة عَشَر ويسبق ثمانية عَشَر، مبنيّ على فتح الجزأين. 
              سَبُعَة [مفرد]: ج سَبُعات، مذ سَبُع: لَبُؤة، أنثى الأسد. 
              سَبْعمائة/ سَبْع مائة [مفرد]: عدد يساوي سبع مئات، وهو مركب من سبع ومائة ويجوز فصلهما فيقال سبع مائة "زار المعرض سبعمائة/ سبع مائة زائر". 
              سبعون [مفرد]:1 - عدد بين تسعة وستِّين وواحد وسبعين، يساوي سبع عشرات، وهو من ألفاظ العقود يستوي فيه المذكّر والمؤنّث ويعامل معاملة جمع المذكّر السالم "سبعون طالبًا/ طالبةً".2 - وصف من العدد سبعين، متمّم للسّبعين "الصفحة السبعون". 
              سَبْعِينيّات [جمع]• السَّبعينيَّات: السَّنتان السَّبعون والتَّاسعة والسَّبعون وما بينهما، العقد الثَّامن من قرنٍ ما "ارتفعت أسعارُ النِّفْط في السّبعينيّات- نشبت بعض الحروب في السّبعينيّات". 
              سُبوع [مفرد]: أُسْبوع، سبعة أيّام متتالية ° حَفْل السُّبُوع: حفل يقام بمناسبة مرور أسبوع على ولادة مولود. 
              مُسَبَّع [مفرد]: ج مُسَبّعات:1 - اسم مفعول من سبَّعَ.2 - (هس) شكل هندسِيّ يتكوَّن من سبعة أضلاع وسبع زوايا داخليّة.3 - ما بني على سبعة أجزاء. 
              مَسْبَعة [مفرد]: ج مَسابِعُ: اسم مكان من أسبعَ: على غير قياس: مكان كثير السّباع "ومن رعى غنمًا في أرض مَسْبَعة ... ونامَ عنها تولّى رعيها الأسدُ".
