          - entry_id: 44115
            dictionary_id: 2
            headword: سَبَّعَ
            headword_bare: سبع
            headword_norm: سبع
            root: سبع
            root_source: ocr
            pos: verb
            form: II
            is_partial: 1
            definitions_text: 'الرَّجُلُ عند امرأته, ولها: أَسْبَع (أقام عندها سبع ليال) اللهُ لفلان: تابَعَ له الشَّىْءَ
              بعد الشىءِ, وهو دعوةٌ تكون فى الخير والشر, والعرب تَضَع التَّسبيعَ موضع التَّضعيف, وإن جاوَزَ السَّبْعَ اللهُ
              لك الأجرَ: ضاعَفَه سَبْعًا أو أكثر سَبَّع اللهُ لك (في الدعاء): رَزَقَكَ سَبْعَةَ أولادٍ فلانٌ الشَّىْءَ: جعله
              ذا سبعة أركانٍ أَسْبَعَهُ (صيره سبعة) كَمَّله سَبْعين (يقال: سَبَّع دراهمَه) العملَ: عمله سَبْعًا, أو ضاعفه
              مطلقا فلانٌ القرآنَ: أَلْزَم نَفْسه قراءَتَه فى سبع ليالٍ الإناءَ: غَسَلَه سبعَ مراتٍ'
