              text: السّبعية:[في الانكليزية] AL -Sabiyya (sect)[ في الفرنسية] AL -Sabiyya (secte)فرقة من غلاة الشيعة لقّبوا
                بذلك لأنهم زعموا أنّ النّطقاء بالشريعة أي الرّسل سبع:آدم ونوح وإبراهيم وموسى وعيسى ومحمد ومحمد المهدي سابع
                النّطقاء، وبين كلّ اثنين من النطقاء سبعة أئمة يتمّمون شريعة، ولا بد في كل شريعة من سبعة بهم يقتدى إمام يؤدّي
                عن الله، حجة يؤدّي عن ذلك الإمام ويحمل عليه ويحتج به له، وذو مصّة يمصّ أي يأخذ العلم من الحجة، وأبواب وهم
                الدّعاة، فداع أكبرهم وهو لرفع درجات المؤمنين، وداع مأذون يأخذ العهود على الطالبين من أهل الظاهر فيدخلهم في
                ذمّة الإمام ويفتح لهم باب العلم والمعرفة، ومكلّب قد ارتفعت درجته في الدين، لكن لم يؤذّن له في الدعوة بل في
                الاحتجاج على الناس فهو يحتج ويرغب إلى الداعي، ومؤمن يتبعه أي يتبع الداعي وهو الذي أخذ عليه العهد وآمن وأيقن
                بالعهد ودخل في ذمته وحزبه. قالوا ذلك الذي ذكرنا كالسماوات والأرضين والبحار وأيام الأسبوع والكواكب السّيّارة
                وهي المدبّرات أمرا، كلّ منها سبعة كما هو المشهور. وأصل دعوتهم على إبطال الشرائع لأنّ الغبارية وهم طائفة من
                المجوس راموا عند شوكة الإسلام تأويل الشرائع على وجه يعود إلى قواعد أسلافهم ليوجب ذلك اختلافا في الإسلام. ورئيسهم
                في ذلك حمدان قرمط وقيل عبد الله ابن ميمون القداح، ولهم في الدعوة واستدراج الضّعفاء مراتب الذّوق وهو تفرّس
                حال المدعو هل هو قابل للدعوة أم لا. ولذا منعوا دعوة من ليس قابلا لها، ومنعوا التكلّم في بيت فيه سراج أي موضع
                فيه فقيه أو متكلّم، ثم التأنيس باستمالة كلّ واحد من المدعوّين بما يميل إليه هواه وطبعه من زهد وخلاعة، فإن
                كان يميل إلى الزهد زيّنه في عينه وقبّح نقيضه، وإن كان يميل إلى الخلاعة زيّنها وقبّح نقيضها حتى يحصل له الأنس
                [به،] ثم التّشكيك في أركان الشريعة، ثم التدليس وهو دعوى موافقة أكابر الدين والدنيا لهم حتى يزداد ميله، ثم
                التأسيس وهو تمهيد مقدمات يسلّمها المدعو وتكون سائقة له إلى ما يدعوه إليه من الباطل، ثم الخلع وهو الطمأنينة
                إلى إسقاط الأعمال البدنية، ثم السلخ من الاعتقادات الدينية وحينئذ يأخذون في الإباحة والحثّ على استعمال اللّذات
                وتأويل الشرائع، كقولهم الوضوء عبارة عن موالاة الإمام والتيمم هو الأخذ من المأذون عند غيبة الإمام الذي هو الحجة،
                والصلاة عبارة عن الناطق أي الرسول، والاحتلام عبارة عن إفشاء شيء من أسرارهم إلى من ليس هو أهله بغير قصد منه،
                والغسل تجديد العهد، والزكاة تزكية النفس بمعرفة ما هم عليه من الدين، والكعبة النبي، والباب عليّ، والصفا هو
                النبي، والمروة علي، والميقات الإيناس، والتلبية إجابة المدعو، والطواف بالبيت سبعا موالاة الأئمة السبعة، والجنة
                راحة الأبدان عن التكاليف، والنار مشقتها بمزاولة التكاليف إلى غير ذلك من خرافاتهم.اعلم أنّهم كما يلقبون بالسّبعية
                كذلك بالإسماعيلية لانتسابهم إلى محمد بن إسماعيل. وقيل لإثباتهم الإمامة لإسماعيل بن جعفر الصادق، وبالقرامطة
                لأنّ أولهم رجل يقال له حمدان قرمط، وقرمط إحدى قرى واسط. وبالخرّمية لإباحتهم المحرّمات والمحارم. وبالبابكية
                إذا تبعت طائفة منهم بابك الخرّمي في الخروج بآذربيجان، وبالمحمّرة للبسهم الحمرة في أيام بابك، أو لتسميتهم المخالفين
                [لهم] من المسلمين حميرا، وبالباطنية لقولهم بباطن القرآن دون ظاهره، قالوا للقرآن ظاهر وباطن، والمراد باطنه
                لا ظاهره المعلوم من اللغة، والمتمسّك بظاهره معذّب بالمشقة في الاكتساب، وباطنه مؤدّ إلى ترك العمل بظاهره، كذا
                في شرح المواقف.
