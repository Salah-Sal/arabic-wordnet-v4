            is_partial: 0
            definitions_text: 'كُلُّ ما له نابٌ وَيَعْدُو على الناس والدوابِّ فيفترسُها, مثل: الأسد والذِّئب والنَّمر والفَهْد
              وما أَشْبَهها كُلُّ ما له مِخْلَبٌ'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: Al_Mujam_Al_Kabeer:Vol_12:page_0115:2
            dict_key: Al_Mujam_Al_Kabeer
