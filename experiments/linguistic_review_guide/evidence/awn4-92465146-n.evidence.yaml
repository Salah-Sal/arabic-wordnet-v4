            dict_death_year: null
            definitions:
            - sense_index: 0
              text: 'كُلُّ ما له نابٌ وَيَعْدُو على الناس والدوابِّ فيفترسُها, مثل: الأسد والذِّئب والنَّمر والفَهْد وما أَشْبَهها'
              is_raw: 0
            - sense_index: 1
              text: كُلُّ ما له مِخْلَبٌ
              is_raw: 0
            examples:
            - idx: 0
              type: quran
              text: حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ وَالدَّمُ وَلَحْمُ الْخِنزِيرِ وَمَا أُهِلَّ لِغَيْرِ اللّهِ بِهِ وَالْمُنْخَنِقَةُ
                وَالْمَوْقُوذَةُ وَالْمُتَرَدِّيَةُ وَالنَّطِيحَةُ وَمَا أَكَلَ السَّبُعُ إِلاَّ مَا ذَكَّيْتُمْ
              attribution: المائدة/ 3
            - idx: 1
              type: poetry
              text: |-
                أَكْرِمُ الجارَ وَأَرْعَى حَقَّه *** إِنَّ عِرْفانَ الفَتَى الحَقَّ كَرَمْ
                لا تَرَانى راتِعًا فى مَجْلِس *** فى لُحَوم النَّاس كالسَّبْع الضَّرِمْ
              attribution: المثقَّب العَبْدىّ
            - idx: 2
              type: poetry
              text: أم السَّبْعُ فاسْتَنْجُوا وَأَيْنَ نَجَاؤُكُم؟ *** فهذا ورَبِّ الرَّاقِصاتِ المُزَعْفَرُ
              attribution: يُنسب لأبى زُبيد الطائى
            - idx: 3
              type: poetry
              text: لِسانُ الفَتَى سَبُعٌ عَلَيْهِ شَذَاتُهُ *** فإن لم يزعه بالمقالة يأكُلُهْ
              attribution: أنشد ثعلب
            - idx: 4
              type: hadith
              text: نهى عن أَكْل كلِّ ذى نابٍ من السِّباع
              attribution: الخبر
            - idx: 5
              type: usage
              text: ما هو إلا سَبُعٌ من السِّباع
              attribution: يقال للضَّرار (مجاز)
