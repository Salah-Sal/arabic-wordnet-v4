              \ [See سِبْعٌ.] b3:  [سَابِعَ عَشَرَ and سَابِعَةَ عَشْرَةَ, the former masc. and the latter fem., meaning Seventeenth,\
              \ are subject to the same rules as ثَالِثَ عَشَرَ and its fem., expl. in art. ثلث, q. v.]\nأُسْبُوعٌ A certain\
              \ number of days; (S, * Msb, K; *) i. e. seven days; a week; (Msb;) also  termed ↓ سُبُوعٌ, (Lth, Msb, K,) by\
              \ some of the Arabs; (Lth, Msb;) [and ↓ سُبْعٌ, as shown by what follows:] pl. of the first أَسَابِيعُ. (Msb,\
              \ TA.) One says, ↓ أَقَمْتُ عِنْدَهُ سُبْعَيْنِ [in the sense of أُسْبُوعَيْنِ, which is more common,] i. e.\
