          - entry_id: 45855
            dictionary_id: 2
            headword: السِّرْو
            headword_bare: السرو
            headword_norm: السرو
            root: سرو
            root_source: ocr
            pos: noun
            form: null
            is_partial: 1
            definitions_text: 'بَيْضُ الجراد وما أَشْبَهَه (فى علم النبات): Cupressus: جنسُ شَجرٍ حَرَجِيٍّ للتزيين, ينتمى
              إلى الفصيلة السَّرْويَّة, من رتبة الصَّنَوْبرِيَّات, الواحدةُ سَرْوَةٌ. وتُسمّيه العربُ شجرةَ الحيَة سَرْوُ
              الجَرَادِ: صَوْتُهُ سَرْوُ المساقِى: تَنْقِيتُها وإزالَةُ ما فيها مَحَلَّةُ حِمْيَر ومنازِلُها بأَرْضِ اليمن,
              وهي عِدّةُ مواضع (فى الموسيقا): فَتْحةٌ غيرُ مستديرة فى سطح الصُّنْدوق الْمُصَوِّت (من آلة القانون) الجرادُ
              أوَّل ما يَنْقَفِسُ بَيْضُهُ'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: Al_Mujam_Al_Kabeer:Vol_12:page_0486:0
            dict_key: Al_Mujam_Al_Kabeer
            dict_name_ar: المعجم الكبير
            dict_name_en: Al-Mu'jam Al-Kabir
            dict_source_type: ocr
            dict_period: modern
            dict_author: مجمع اللغة العربية
            dict_death_year: null
            definitions:
            - sense_index: 0
              text: بَيْضُ الجراد وما أَشْبَهَه
              is_raw: 0
            - sense_index: 1
              text: '(فى علم النبات): Cupressus: جنسُ شَجرٍ حَرَجِيٍّ للتزيين, ينتمى إلى الفصيلة السَّرْويَّة, من رتبة الصَّنَوْبرِيَّات,
                الواحدةُ سَرْوَةٌ. وتُسمّيه العربُ شجرةَ الحيَة'
              is_raw: 0
            - sense_index: 2
              text: 'سَرْوُ الجَرَادِ: صَوْتُهُ'
              is_raw: 0
            - sense_index: 3
              text: 'سَرْوُ المساقِى: تَنْقِيتُها وإزالَةُ ما فيها'
              is_raw: 0
            - sense_index: 4
              text: مَحَلَّةُ حِمْيَر ومنازِلُها بأَرْضِ اليمن, وهي عِدّةُ مواضع
              is_raw: 0
            - sense_index: 5
              text: '(فى الموسيقا): فَتْحةٌ غيرُ مستديرة فى سطح الصُّنْدوق الْمُصَوِّت (من آلة القانون)'
              is_raw: 0
            - sense_index: 6
              text: الجرادُ أوَّل ما يَنْقَفِسُ بَيْضُهُ
              is_raw: 0
            examples:
            - idx: 0
              type: hadith
              text: يُشْتَرط صاحبُ الأرض ع لَى الْمُ ساقِى خَمَّ العَ ين, و سَرْوَ الشَّرْبِ
              attribution: مالك بن أنس
            - idx: 1
              type: usage
              text: لَئِنْ بَقيتُ إلى قابِل لَيأتيَنَّ كُلَّ مُؤْمِن حَقُّه أو حَظُّه, ح تى يأتى الراعىَ بسَرْوِ حمِير لم
                يَعْرَق جبينُه فيه
              attribution: عمر بن الخطاب
            - idx: 2
              type: poetry
              text: تَــرَحَّــلَ عـــن أَرض الــعـــراق مِــرَقِّــشُ ... عَلَى طَرِبٍ تَهْوِى سِراعًا رواحلُهُ. إلَى السِّرْوِ
                أرضٍ قادَهُ نَحْوَها الهَوَى ... ولم يَدْرِ أَنَّ الموتَ بالسِّرْوِ غائلُهُ
              attribution: طرفة بن العبد
            - idx: 3
              type: poetry
              text: وقد طُفْتُ للمالِ آفاقَهُ ... عُمانَ فَحِمْصَ فَأُورِيشَلِمْ. فَنَجرانَ فالسِّرْوِ مِنْ حِمْيرٍ ... فأَىَّ
                مَرامٍ لَه لم أَرُمْ
              attribution: الأعشى
            - idx: 4
              type: poetry
              text: وما رَحَلَتْ من سِرْوِ حِمْيرَ ناقتِى ... لِيَحْجِبَها من دُونِ بَيْتِك حاجِبُ
              attribution: عبد الله بن الحارث الهمداني
