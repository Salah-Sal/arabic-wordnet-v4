          text: '(فى الموسيقا): فَتْحةٌ غيرُ مستديرة فى سطح الصُّنْدوق الْمُصَوِّت (من آلة القانون)'
          is_raw: 0
        - sense_index: 6
          text: الجرادُ أوَّل ما يَنْقَفِسُ بَيْضُهُ
          is_raw: 0
        examples:
        - idx: 0
          type: hadith
          text: يُشْتَرط صاحبُ الأرض ع لَى الْمُ ساقِى خَمَّ العَ ين, و سَرْوَ الشَّرْبِ
          attribution: مالك بن أنس
        - idx: 1
          type: usage
          text: لَئِنْ بَقيتُ إلى قابِل لَيأتيَنَّ كُلَّ مُؤْمِن حَقُّه أو حَظُّه, ح تى يأتى الراعىَ بسَرْوِ حمِير لم يَعْرَق
            جبينُه فيه
          attribution: عمر بن الخطاب
        - idx: 2
          type: poetry
          text: تَــرَحَّــلَ عـــن أَرض الــعـــراق مِــرَقِّــشُ ... عَلَى طَرِبٍ تَهْوِى سِراعًا رواحلُهُ. إلَى السِّرْوِ
            أرضٍ قادَهُ نَحْوَها الهَوَى ... ولم يَدْرِ أَنَّ الموتَ بالسِّرْوِ غائلُهُ
          attribution: طرفة بن العبد
        - idx: 3
          type: poetry
          text: وقد طُفْتُ للمالِ آفاقَهُ ... عُمانَ فَحِمْصَ فَأُورِيشَلِمْ. فَنَجرانَ فالسِّرْوِ مِنْ حِمْيرٍ ... فأَىَّ
            مَرامٍ لَه لم أَرُمْ
          attribution: الأعشى
        - idx: 4
          type: poetry
          text: وما رَحَلَتْ من سِرْوِ حِمْيرَ ناقتِى ... لِيَحْجِبَها من دُونِ بَيْتِك حاجِبُ
          attribution: عبد الله بن الحارث الهمداني
