            headword_norm: سيارة كهربائية (EV)
            root: سر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'هي سيارة تُدار كهربائياً، والإدارة الكهربائية تتفوق على الإدارة بمحرك الاحتراق الداخلي بكثير
              من المزايا، منها على سبيل المثال: الكفاءة العالية، والتصميم البسيط نسبياً لمجموعة نقل القدرة، والانخفاض النسبي
              لمستوى الضجيج. إلا أن السيارات الكهربائية لا يمكنها مع خازنات الطاقة الحالية حمل كمية طاقة كالتي تحملها السيارات
              التقليدية، ولذلك يكون مدى سيرها أقل. ويرجع ذلك بالأساس إلى الانخفاض النسبي في كثافة طاقة المُراكمات مُقارنةً
              بأنواع الوقود السائل. وتُعتبر السيارة ''تيسلا رودستر'' (Tesla Roadster) من سيارات الإنتاج الكمي الكهربائية المُتقدمة
              جداً.'
            translation_en: electric vehicle (EV)
