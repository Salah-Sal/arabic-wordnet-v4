            definitions_text: 'السَّرْوُ: شَجَرٌ م، واحِدَتُه: بهاءٍ، وما ارْتَفَعَ عن الوادِي، وانْحَدَرَ عن غِلَظِ الجَبَلِ،
              ودُودٌ يَقَعُ في النَّباتِ، ومَحَلَّةُ حِمْيَرَ، ومَواضِعُ ذُكِرَتْ قُبَيْلُ، وإلقاءُ الشيءِ عَنْكَ،كالإِسْراءِ
              والتَّسْرِيَةِ، والمُرُوءَةُ في شَرَفٍ. سَرُوَ، كَكَرُمَ ودَعا ورَضِيَ، سَرَاوَةً وسَرْواً وسَراً وسَرَاءً،
              فهو سَرِيٌّج: أسْرِياءُ وسُرَواءُ وسُرًى.والسَّرَاةُ: اسمُ جَمْعٍج: سَرَواتٌ، وهي سَرِيَّةٌ من سَرِيَّاتٍ وسَرَايا.وتَسَرَّى:
              تَكَلَّفَه، أو أخَذَ سُرِّيَّةً.والسَّرْوَةُ، مُثَلَّثَةً: السَّهْمُ الصَّغيرُ القَصيرُ، أو عَريضُ النَّصْلِ
              طَوِيلُه.والسَّرَاةُ: الظَّهْرُج: سَرَواتٌ،وـ من النَّهارِ: ارْتِفاعُه،وـ من الطَّريقِ: مَتْنُه.ومحمدُ بنُ سَرْوٍ:
              وَضَّاعٌ لِلحَديثِ.وانْسَرَى الهَمُّ عَنِّي،وسُرِّيَ: انْكَشَفَ.والسِرْوُ، بالكسر: د قُرْبَ دِمْياطَ،وة بِبَلْخَ.وسَرْوانُ:
              ة بِسِجِسْتانَ.واسْتَرَيْتُهُم: اخْتَرْتُهم،وـ المَوْتُ الحَيَّ: اخْتارَ سَراتَهُم.وسَرَتِ الجَرادَةُ: باضَتْ.
              وإسرايِيِلُ، ويُهْمَزُ، واسْرايِينُ، ويُهْمَزُ: اسمٌ.'
