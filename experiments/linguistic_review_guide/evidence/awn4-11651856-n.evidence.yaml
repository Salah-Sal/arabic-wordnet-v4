            is_partial: 1
            definitions_text: 'بَيْضُ الجراد وما أَشْبَهَه (فى علم النبات): Cupressus: جنسُ شَجرٍ حَرَجِيٍّ للتزيين, ينتمى
              إلى الفصيلة السَّرْويَّة, من رتبة الصَّنَوْبرِيَّات, الواحدةُ سَرْوَةٌ. وتُسمّيه العربُ شجرةَ الحيَة سَرْوُ
              الجَرَادِ: صَوْتُهُ سَرْوُ المساقِى: تَنْقِيتُها وإزالَةُ ما فيها مَحَلَّةُ حِمْيَر ومنازِلُها بأَرْضِ اليمن,
              وهي عِدّةُ مواضع (فى الموسيقا): فَتْحةٌ غيرُ مستديرة فى سطح الصُّنْدوق الْمُصَوِّت (من آلة القانون) الجرادُ
              أوَّل ما يَنْقَفِسُ بَيْضُهُ'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: Al_Mujam_Al_Kabeer:Vol_12:page_0486:0
