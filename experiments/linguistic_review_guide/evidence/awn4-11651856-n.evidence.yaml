              text: تَسَرَّى فلمَّا حاسَبَ المرْءُ نَفْسَه ... رَأَى أَنَّه لا يَسْتَقِيمُ له السَّرْوُ
              attribution: شاعر في الأساس
            - idx: 1
              type: hadith
              text: 'أنه  صلى الله عله وسلم – قال لأ صحابه يومَ أ ُحُدٍ : اليومَ تُ سَرَّوْنَ'
              attribution: null
            - idx: 2
              type: poetry
              text: لَقَدْ تَسَرَّيْت إِذا الهَمُّ وَلَجْ ... واجتَمَع الهَمُّ هُمومًا واعْتَلَجْ
              attribution: حُمَيْدُ بنُ ثَوْر
