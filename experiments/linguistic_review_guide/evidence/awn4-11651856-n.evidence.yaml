          - entry_id: 531134
            dictionary_id: 92
            headword: كُسُوريةٌ
            headword_bare: كسورية
            headword_norm: كسورية
            root: سر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'كلمةٌ وضَعها الرياضي Benoit Mandelbrot في عام 1975 ليصِفَ صنفاً من الأشكال المميَّزة بعدم الانتظام،
              لكن بطريقةٍ تتطلّب شكلاً نمطياً. يَستخدِمُ الخبراءُ التقنيون الكسوريات في البيانيات الحاسوبية لتكوين صور طبيعية،
              مثل المناظر الطبيعية الأرضية، والغيوم، والغابات. إن السمةَ المميِّزةَ للكسوريات هي أنها "مشابهة لنفسها"، أي
              إن أيَّ جزءٍ من كسورية عندما يُضخَّم، يكون له نفس هيئة الكسورية الكلية. من الصعب غالباً قياسُ طول محيط شكلٍ
              ما بدقة، لأن المسافة الإجمالية المقيسة تعتمد على حجم أصغر عنصر مقيس. فمثلاً، يمكن لفرد ما أن يقيس على شريط ساحلي
              معطى محيطَ كلِّ شبه جزيرة صغيرة أو خليج صغير، أو (بتضخيم أكبر) محيطَ كلِّ نتوء بحري صغير وكل رصيف ميناء، وهكذا
              دواليك. يمكن لكسورية ما أن تأخذ مساحة محدودة ومحيطاً غير منتهٍ، وتعدّ مثل هذه الأشكال ذات بُعدٍ كسري: كما هو
              الحال بين 1(خط) و2 (مستوٍ)؛ ومن هنا أتى اسمها الأجنبي fractal.'
            translation_en: fractal
            translation_fr: null
            domain: Dictionary of Information Technology Terms
