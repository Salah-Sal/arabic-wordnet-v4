                الَّذِي قَالَ فِيهِ رَسولُ اللهِ صَلَّى الله تَعالَى عَلَيه وسَلَّم: " إِنَّ الله لَيُؤَيِّدَ هَذَا الدِّينَ
                بِالرَّجُلِ الفَاجِر "، قُتِلَ يَوْمَ أُحُدٍ، فَقَالَ: مَا أُقَاتِلُ عَلَى دِينٍ، وذَكَرَهُ بعضٌ فِي الصَّحَابَةِ،
                وَهُوَ غَلَطٌ، والمُصَرَّحُ بِهِ فِي شَرْحِ المَوَاهِبِ أَنَّهُ أنْصَارِيُّ من بَنِي ظَفَرٍ. [] ومِمَّا يُسْتَدْرَك
                عَلَيْهِ:شاةٌ قَزَمَةٌ - بِالتَّحْرِيكِ -: رَدِيئَةٌ صَغِيرَةٌ.وغَنَمٌ أَقْزَامٌ: لَا خَيْرَ فِيهَا، وكذَلِك
                رُذَالُ الإِبِلِ.وسُودَدٌ أَقزَمُ: لَيْسَ بقَدِيم، قَالَ العَجَّاجُ:(والسُّودَدُ العَادِيُّ غَيرُ الأقْزَمِ ... )والتَّقَزُّم:
                اقْتِحَامُ الأمُورِ بِشِدَّةٍ.وقُزْمَانُ، بِالضَّمِّ: مَوْضِعٌ.'
