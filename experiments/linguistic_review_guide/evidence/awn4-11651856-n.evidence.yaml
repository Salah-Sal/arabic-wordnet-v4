            definitions_text: 'سرو: (} السَّرْوُ) : لم يَشِر هُنَا بحَرْفٍ، وَهُوَ واوِيٌّ:(شَجَرٌ م) مَعْروفٌ، (واحِدَتُه
              بهاءٍ.(و) السَّرْوُ: (مَا ارْتَفَعَ عَن الوادِي وانْحَدَرَ عَن غِلَظِ الجَبَلِ) ؛ وَمِنْه قَوْل ابنِ مُقْبل:{بسَرْوِ
              حِمْيَرَ أَبْوالُ البِغالِ بِهِأنَّى تَسَدَّيتِ وهْناً ذَلِك البِيناومنه الحدِيثُ: (فصَعَدُوا} سَرْواً مِن الجَبَلِ)
              .(و) السَّرْوُ: (دُودٌ يَقَعُ فِي الثِّيابِ) ؛ كَذَا فِي النَّسخِ، وصَوابُه فِي النَّباتِ فتَأْكُلُه؛ كَمَا
              هُوَ نَصُّ المُحْكَم؛ واحِدَتُهُ سَرْوَةٌ.(و) السَّرْوُ: (مَحَلَّةُ حِمْيَرَ) ؛ وَبِه فُسِّر قَوْلُ ابنِ مُقْبل
              أَيْضاً.(و) السَّرْوُ: (مَواضِعُ ذُكِرَتْ قُبَيْلُ) ذلكَ.قُلْتُ: لم يَذْكُرِ المصنِّفُ فِي الَّذِي قَبْله إلاَّ
              {سَرَاة بَني فلانٍ وفلانٍ، وَهِي يائيَّةٌ، وَهِي مَعْروفةٌ} بالسَّراةِ كَمَا ذَكَرَ.وَالَّذِي يُعْرَفُ {بالسّرْوِ،
              فَهُوَ} سَرْوُ حِمْيَرَ الَّذِي ذكَرَه، {وسَرْوُ الْعَلَاء،} وسَروُ سخيمٍ، {وسَرْوُ مَنْد،} وسَرْوُ الملا، {وسَرْوُ
              لُبن، وسَرْوُ صَنْعاء، ذَكَرَه ابنُ السِّكِّيت، وسَرْوُ السَّوادِ بالشامِ، وسَرْوُ الرَّمْلِ بينَ أَرْضِ طيِّءٍ
              وكلْبٍ.فقَوْلُه: ذُكِرَتْ قُبَيْلُ، محلُّ تَأَمَّلٍ فاعْرِفْه.(و) السَّرْوُ: (إلْقاءُ الشَّيءِ عَنْكَ) ونَزْعُه،
              (} كالإسْراءِ {والتَّسْرِيَةِ) . يقالُ: سَرَوْتُ الجلَّ عَن الفَرَسِ} وأَسْرَيْتُه {وسَرَّيْتُه: إِذا أَلْقَيْته
              عَنهُ.وَمِنْه سُرِّيَ عَنهُ الخَوْفُ: أَي أُزِيلَ، والتَّشْديدُ للمبالَغَةِ.وَفِي الصِّحاحِ عَن ابنِ السِّكِّيت:}
              سَرَوْتُ الثوبَ عَنِّي {سَرْواً إِذا أَلْقَيْتَه عَنْكَ؛ قالَ ابنُ هرمة:} سرى ثوْبَه عَنْك الصِّبا المُتَخايلُوآذنَ
              بالبَيْنِ الخَلِيطُ المُزايِلُوقالَ الَّراغبُ: {السَّرِيُّ} السَّريُّ مِن الرِّجالِ مَأْخُوذٌ مِن {سَرَوْتُ
              الثوبَ عنِّي نَزَعْتَه، وَهُوَ بِخلافِ المُتَدَثِّر والمُتَزَمِّل والزّميل.قُلْتُ: وَهُوَ وَجْهٌ حَسَنٌ.وشاهِدُ}
              التَّسْرِيَةِ قَوْلُ بعضِ الأغْفال:حَتَّى إِذا أَنْفُ العُجَيْرِ جَلاَّبُرْقُعَه وَلم! يُسَرِّ الجُلاَّ (و)
              {السَّرْوُ: (المُرُوءَةُ فِي شَرَفٍ) .وَفِي الصِّحاحِ: سَخاءٌ فِي مُرُوءَةٍ؛ وَمِنْه حدِيثُ عُمَرَ: أنَّه مَرَّ
              بالنَّخْعِ فقالَ: أَرَى} السَّرْوَ فِيكُم مُتَربّعاً، أَي أَرَى الشَّرَفَ فِيكُم مُتَمَكِّناً.وَقد ( {سَرُوَ)
              الرَّجُلُ، (ككَرُمَ ودَعا ورَضِيَ) ، ثلاثُ لُغاتٍ، (} سَراوَةً {وسَرْواً} وسَراً) ، مَقْصور، ( {وسَرَاءً) ،
              بالمدِّ على اللَّفِّ والنَّشر المُرتَّبِ؛} وسَرْواً عَن سِيْبَوَيْه.وَلم يَحْكِ اللَّحْيانيّ مَصْدَر {سَراً
              إلاَّ مَمْدوداً.(فَهُوَ} سَرِيٌّ) ، كغَنِيَ؛ وَمِنْه قَوْلُ الشَّاعِرِ:وتَرى {السَّرِيَّ مِن الرِّجالِ بنَفْسِهوابنُ
              السَّرِيِّ إِذا سَرَا} أسْراهُما أَي إِذا أَشْرَفَ فَهُوَ أَشْرَفُهما؛ (ج {أسْرِياءُ} وسُرَواءُ) ، كِلاهُما
              عَن اللَّحْيانيّ، ( {وسُرًى) ، كهُدىً؛ نقَلَهُ الأزهريُّ وَهُوَ على خِلافِ القِياسِ.(} والسَّرَاةُ: اسمُ جَمْعٍ)
              ، هَذَا مَذْهَبُ سِيْبَوَيْه لأنَّه ليسَ لواحِدِه ضابِطٌ.وقالَ الجوهرِيُّ: هُوَ جَمْعُ {السَّرِيِّ؛ قالَ: وَهُوَ
              جَمْعٌ عَزِيزٌ أَن يُجْمَع فَعِيلٌ على فَعَلَةٍ، وَلَا يُعْرَف غيرُه.وَفِي المِصْباح: السَّرِيُّ الرَّئيسُ،
              والجمْعُ} سَراةٌ، وَهُوَ جمْعٌ عزيزٌ لَا يكادُ يُوجَد لَهُ نظِيرٌ لأنَّه لَا يُجْمَع فَعِيل على فَعَلَة.وَفِي
              التهْذيبِ: قوْمٌ سَراةٌ جمْع {سَرِيَ، جاءَ على غيرِ قياسٍ؛ ومثْلُه فِي النهايَةِ؛ (ج} سَرَواتٌ) ، بالتحْريكِ؛
              وَمِنْه حدِيثُ الأنْصار: (قُتِلَت {سَرَواتُهم) ، أَي أَشْرافُهُم؛ وَهَذَا يُؤَيِّد مَذْهب سِيبَوَيْهٍ مِن كَوْنِ}
              السَّراةِ اسْمُ جَمْع لَا جَمْع.(وَهِي {سَرِيَّةٌ من} سَريَّاتٍ! وسَرَايا) ؛ كَذَا فِي المُحْكم.( {وتَسَرَّى:
              تَكَلَّفَه) ، أَي} السَّرْوَ وَهُوَ الشَّرَفُ والمُرُوءَةُ.(أَو) {تَسَرَّى: (أَخَذَ} سُرِّيَّةً) ، أَي جارِيَةً؛
              نَقلَهُ الجوهريُّ.قالَ: وقالَ يَعْقوب: أَصْلُه تَسَرَّرْت مِن السَّرور، فأَبْدلوا مِن إحْدى الرَّاآت يَاء كَمَا
              قَالُوا تقضَّى من تَقَضَّضَ؛ وَقد مَرَّ ذلكَ فِي حرْف الراءِ.( {والسَّرْوَةُ، مُثَلَّثَةً) ؛ اقْتَصَر الجوهريُّ
              على الكسْرِ؛ وزادَ ابنُ الأثيرِ الضمَّ ونقلَ ابنُ سِيدَه الفَتْح عَن كُراعٍ؛ (السَّهْمُ الصَّغيرُ) المُدَمْلك
              لَا عَرْض لَهُ؛(أَو عَريضُ النَّصْلِ طَويلُه) وَهُوَ مَعَ ذلكَ دَقيقٌ قَصيرٌ يُرْمى بِهِ الهَدَف.وقيلَ: العَريضُ
              الطَّويلُ يُسمَّى المِعْبَلَة؛ وَمِنْه حدِيثُ أَبي ذرَ: (كَانَ إِذا الْتاثَتْ راحِلَةُ أَحدِنا طَعَنَ} بالسِّرْوَةِ
              فِي ضَبْعِها) ، والجَمْعُ {السِّراءُ؛ كَمَا فِي الصِّحاحِ.وَفِي التَّهْذيب:} السِّرْوَةُ تُدْعى الدِّرْعِيَّة،
              لأنَّها تدْخُل فِي الدُّرْوعِ ونِصالُها مُتسلَكَةٌ كالمِخْيَطِ، والجَمْعُ {السُّرى؛ قَالَ ابنُ أَبي الحُقَيقِ
              يَصِفُ الدروعَ:نَنْفى السُّرى وجِيادَ النَّبْل تَتْرُكُهُمِنْ بَيْن مُنْقَصِفٍ كَسْراً ومَفْلُولِ (} والسَّرَاةُ:
              الظَّهْرُ) ؛ قَالَ الشَّاعِرُ:شَوْقَبٌ شَرْحَبٌ كأَنَّ قَناةًحَمَلَتْه وَفِي {السَّراةِ دُمُوج ُومنه الحدِيثُ:
              (فمَسَحَ سَراةَ البَعيرِ وذِفْرَاهُ) ؛ (ج} سَرَواتٌ) ، بالتَّحْريك وَلَا يُكَسَّرُ. (و) {السَّراةُ (مِن النَّهارِ:
              ارْتِفاعُه) وأَعْلاهُ.ووَقَعَ فِي الصِّحاح: وَسَطُه؛ وَهُوَ خَطَأٌ نَبَّهوا عَلَيْهِ؛ قَالَ البُرَيق الْهُذلِيّ:مُقِيم
              عِنْدَ قَبْرِ أَبي سِباعٍ} سَراةَ الليلِ عندَكَ والنَّهارِفجعَلَ للَّيْل {سَراةً، والجَمْعُ} سَرَوات وَلَا يُكَسَّرُ.(و)
              السَّراةُ (من الطَّريقِ: مَتنُهُ) ومُعْظَمُه؛ والجمْع {سَرَواتٌ؛ وَمِنْه الحديثُ: (ليسَ للنِّساء سَرَواتُ الطّرق،
              أَي لَا يَتَوسَّطْنَها ولكنْ يَمْشِينَ فِي الجوانِبِ.(ومحمدُ بنُ} سَرْوٍ) البلخيُّ (وَضَّاعٌ للحَديثِ.(و) مِن
              المجازِ: ( {انْسَرَى الهَمُّ عنِّي} وسُرِّيَ) {تَسْريَةً: (انْكَشَفَ) وأُزِيلَ؛ وَقد جاءَ ذِكْرُ} سُرِّي فِي
              حديثِ نُزولِ الوَحْي، والتَّشْديدُ للمُبالَغَةِ.( {والسِّرْوُ، بِالْكَسْرِ: د قُرْبَ دِمْياطَ) تُّجاه رأْسِ
              الخلِيجِ بَيْنهما بَحْرُ النِّيل، وَقد دَخَلْته؛ مِنْهُ الشيخُ العارِفُ أَبو عبدِ اللَّهِ محمدُ بنُ أَبي الحائِلِ}
              السّروِيُّ الصُّوفيُّ أَحدُ المشايخِ المُتَأَخِّرين، وَقد زُرْتْ قَبْرَه الشَّريف هُنَاكَ.(و) {السِّرْوُ: (ة
              ببَلْخَ.(} وسَرْوانُ) ، بالفَتْح: (ة بسِجِسْتَانَ.( {واسْتَريْتُهُم: اخْتَرتُهم) .وعبارَةُ الصِّحاحِ:} اسْتَريْت
              الإبِلَ والغَنَمَ والناسَ: أَي اخْتَرْتهم؛ قَالَ الْأَعْشَى:وَقد أُخْرِجُ الكاعِبَ {المُسْتَراةُمِنْ خِدْرِها
              وأُشِيعُ القِمارَاوفي التَّهذيب:} اسْتَرَيتُه اخْتَرْتُه.وأَخَذْتُ {سَراتَه: أَي خِيارَه، واسْتَارَ بمعْنَاهُ
              مَقْلوبٌ مِنْهُ.(و) } اسْتَرَى (المَوْتُ الحَيَّ) ، وَفِي الصِّحاحِ: بَني فلانٍ؛ أَي (اخْتَارَ {سَراتَهُم) ،
              أَي خيارَهُم.(} وسَرَتِ الجَرادَةُ) {سَرْواً: (باضَتْ) ، لُغَةٌ فِي الهمْز.(وإسْرايِلُ) ، بالكسْر والياءِ التَّحتيَّة
              (ويُهْمَز، وإسْرايِينُ) ، بياءَيْن (ويُهْمَز) ، وإسْرايِيلُ بقَلْبِ الهَمْز يَاء، وإسْرال، كلُّ ذلكَ لُغاتٌ
              وارِدَةٌ فِي القُرْآن؛ (اسْمُ) نَبيَ، قَالُوا: هُوَ لَقَبُ يَعْقوب، عَلَيْهِ السَّلَام، لإشْعاره بالمدْحِ بالمَعْنى
              المَنْقول مِنْهُ، إِذْ مَعْناهُ صَفْوَة اللَّهِ أَو عبدُ اللَّهِ بالعِبْرانيَّة؛ وأَنْشَد أَبو عليَ القالِي
              فِي أَمالِيه:قَالَت وَكنت رجلا فَطِيناًهَذَا ورَبّ البيتِ إسْرائِيناهو قَوْلُ أَعْرابيِّ أَدْخَل قِرْواً إِلَى
              سُوقِ الحيْرةِ ليَبِيعَه فنَظَرَتْ إِلَيْهِ امْرأَةٌ فَقَالَت: مسخ، أَي مِن بَني إسْرائِيل؛ وأَنْشَدَ ابنُ الجوالِيقي
              لأُميّة:لَا أَرى من يُعِيننِي فِي حَياتِيغَيْر نَفْسِي إلاّ بَنِي إسْرالقالَ: تَجِدُ العَرَب إِذا وَقَعَ إِلَيْهِم
              مَا لم يكُنْ مِن كَلامِهم تكلَّموا فِيهِ بأَلْفاظٍ مُخْتَلِفةٍ.وممَّا يُسْتدركُ عَلَيْهِ:} السِّرْوةُ، بالكسْرِ:
              الجَرادَةُ أَوَّل مَا تكونُ، وَهِي دُودَةٌ، وأَصْلُه الهَمْز.وأَرْضٌ {مَسْرُوَّةٌ: أَي ذاتُ} سِرْوةٍ؛ كَمَا
              فِي الصِّحاح.ووَقَعَ فِي التَّهْذيب: أَرْضٌ {مَسْروة على مَفْعلة} والسّرْوُ: قَرْيةٌ بأَرْدَبيل، مِنْهَا: نافِعُ
              بنُ عليَ الفَقِيهُ {السّرْوِيُّ الأذَرْبِيجانيُّ سَمِعَ مِنْهُ العتيقيُّ.ومُوسَى بنُ} سَرْوان، ويقالُ ثَرْوان بالمُثَلَّثة،
              شيخٌ لشعْبَةَ.وأَنْجبُ بنُ أَحمدَ بنِ مكارمِ بنِ {سَرْوَان الجاميّ عَن أَبي الحَسَن بنِ حرما.وَفِي غَزْوَةِ
              أُحُد قالَ: (اليومَ} تُسَرَّوْنَ) ، أَي يُقْتل {سَريُّكُم فقُتِلَ حَمْزةُ.} والسُّراةُ، بالضمِّ: جَمْعُ {سَرِيَ،
              لُغَةٌ فِي السَّراةِ بالفَتْحِ؛ عَن ابنِ الأثيرِ.} وسرو المَساقِي: تَنْقِيتُها وإزالَةُ مَا فِيهَا.{وأَسْرَى:
              صارَ فِي سَراةٍ مِن الأرضِ وأَوَى؛ عَن الرَّاغبِ.} وسَرِيُّ المالِ: خيرُه؛ {وسَراتُه: خِيارُه.ورَجُلٌ} مَسْرَوانٌ؛
              وامْرأَةٌ {مَسْرَوانَةٌ: أَي} سَرِيَّان.{وتَسرَّاهُ: أَخَذَ} أَسْراه؛ قالَ حُمَيْد بنُ ثوْرٍ:لقد {تَسَرَّيْت
              إِذا الهَمُّ وَلَجْواجْتَمَعَ الهَمُّ هُموماً واعْتَلَج} وسارَاهُ {مُسارَاةً: فاخَرَهُ.} والسَّرَوانُ، محرَّكة:
              مَحلَّتانِ مِن محَاضِر سُلْمى أَحَدُ جَبَلَيْ طيِّىء.'
