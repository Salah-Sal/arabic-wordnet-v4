              text: "باب السين والراء و (وأ يء) معهما س ر و، س ور، ر س و، ور س، س ر ي، س ي ر، ي س ر، س رء، سء ر، ء س ر، رء\
                \ س، ء ر س مستعملات\nسرو: السَّرْوُ: سَخاء في مروءة. سَرُوَ يسرو، وسرا يسرو، وسَرِيَ يَسْرَى، فهو: سَرِيٌّ\
                \ من قومٍ سَراة، ولم يجىء على فَعَلةٍ غيرها. والسَّرِيُّ: النّهرُ فوقَ الجدول، ودونَ الجَعفر. والسّريّة: خيل\
                \ تبلغ أربع مائة أو نحوه. والسُّرْوَةُ: سَهْمٌ صغير قصير، وجمعه: سِراء قال أبو الدُّقَيْش: بل هو السّهم ذو\
                \ القُطْبة والقُطْبةُ: حديدةٌ في رأسِ السَّهم يُرْمى به الهَدَف، قال:\nوقد رمى بسُراهُ اليومَ معتمداً ... في\
                \ المَنكِبَيْنِ وفي السّاقين والرَّقَبه \nوقيل: السُّروةُ: النَّصْل الدّقيق الأَجْرد المدمج مثل المِسَلَّة،\
                \ وجمعه: سَرَوات. وسَرْوُ حِميَر: محلّة حِمْيَر. وسَراةُ كلّ شيء: ظهره، والجميعُ: سَرَوات. وسَراةُ النّهار:\
                \ ارتفاعُه. وسَرْو الأرض: ما انحدرَ من حُزُونة الجبل. وسَروْتُ عنه الثَّوبَ: أي: كَشَفْت، وسَرَّى عنه همَّه،\
                \ بالتّشديد: أي: ألقاه.\nسور: السَّوْرة في الرّأس: تناول الشّراب، والرأسُ يَسُور سَوْراً وسُؤوراً وسُؤراً.\
                \ وساورتُ فُلانا: تناولتُ رأسه. والمِسوَرةُ: مُتَّكأٌ من أَدَم، وجمعُها: المَساوِر. وفلانٌ ذو سَوْرةٍ في الحرب،\
                \ أي: ذو بَطْشٍ شديد. والسُّورُ: حائطُ المدينة، ونحوه. وتسوّرتُ الحائط، وسُرْتُه سَوْراً، قال العجّاج: \n\
                سُرْتُ إليه في أعالي السُّورِ\nوالسَّوّار من الكلاب: الذّي يأخُذُ بالرّأس. والسَّوّار: الرّجُلُ الذي يَسُورُ\
                \ في رأسه الشّراب، قال الأخطل: \nوشاربٍ مُرْبحٍ، بالكأس نادمَني ... لا بالحصور ولا فيها بسوار\nأي: بذي عَرْبَدة\
                \ وخِفّة. والسُّوَرُ: جَمْعُ السُّورة. والسِوُّار القلب: سوار المرأة والجميع: أَسوِرة وأساور، والكثير: سُور. والأُسْوار:\
                \ من أَساورة كِسْرَى، أي: قُوّاده.\nرسو: رَسَوْتُ لفلانٍ من هذا الأمر أو الحديث، أي: ذكرت له طَرَفاً منه.\
                \ ورسوت الحديثَ: أحكمته فيما بينَك وبينَ نفسك. ورسا الجبلُ يرسو، إذا ثبت أصله في الأرض. ورست السفينة: انتهت\
                \ إلى قرار الماء، فبقيت لا تسير. والمِرْساةُ: أَنْجَرٌ يُشَدُّ بالحِبال فيُرْسَلُ في البحر فيُمسِك بالسَّفينةَ\
                \ ويُرسيها فلا تَسِيرُ. وألقتِ السَّحابةُ مَراسيَها: ثَبَتَتْ في مَوْضعٍ وجادتْ بالمَطَر، قال سليمان:\nإذا\
                \ قلت أَكْدَى البرقُ أَلْقَى المَراسيا \nوالفَحْلُ من الإبل إذا تفرّق عنه شُوَّله فهَدَرَ بها وراغت إليه وسَكَنَتْ،\
                \ قيل: رسا بها. قال رؤبة: \nإذا اشمَعَلَّتْ سننا رسا بها\nوالمُرْسَى: مصدر من أَرْسَيْت السّفينة. ورَسَتْ\
                \ قدماه في الموقف والحرب، أي: ثبتت. وقِدْرٌ راسيةٌ: لا تَبْرحُ مكانَها، ولا يُستْطاعُ تحويلُها. ورس: الوَرْسَ:\
                \ صِبغٌ، وفِعلُهُ: التَّوْريس. والوارسُ: نَبْتٌ أَصفَرُ كأنّه لَطْخٌ يَخْرج على الرِّمْث بين آخِرِ الشِّتاء،\
                \ إذ أصاب الثَّوْبَ لَوَّنَهُ، وقد أَوْرَسَ الرِّمْثُ فهو مُورسٌ. والوَرْسيُّ من الأَقْداحِ النُّضار: من أجودها.\n\
