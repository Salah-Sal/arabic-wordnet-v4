            definitions_text: |-
              سرو عَن فؤاد السقيم. قَالَ الْأَصْمَعِي: يَعْنِي بقوله: يرتوا 6 فؤاد الحزين يشده ويقويه.
              سرو قَالَ أَبُو عبيد: وَمِنْه قَول لبيد يذكر كَتِيبَة أَو درعًا: [الرمل]
              فَخْمَةً ذَفراءَ تُرتى بِالعُرَى ... قردمانيا وتركًا كالبصل
              قَوْله: ترتى بالعرى يَعْنِي الدروع أَن لَهَا عُرىً فِي أوساطها / فيضم / ب ذيلها إِلَى تِلْكَ العرى وتشد لتنشمر عَن لَابسهَا فَذَلِك الشد هُوَ الرَّتْوُ وَهُوَ معنى قَول زُهَيْر: [الْكَامِل]
              ومُفَاضَةٍ كالّنَّهْىِ تَنْسِجُه (تَنْسِجُه) الصَّبَا ... بَيضاءَ كَفّتَ فَضْلَهَا بِمُهَنَّدِ
              المفاضة: الدرْع الواسعة وَالنَّهْي: الغدير يَعْنِي أَنه علق الدرْع بمعلاق فِي السَّيْف. وَقَوله: يسرو يكْشف عَن فُؤَاده وَلِهَذَا قيل: سريت الثَّوْب عَن الرجل إِذا كشفته عَنْهُ وسروت قَالَ ابْن هرمة:
              [الطَّوِيل]
              سرى ثوبَه عَنْك الصِّبا المتخايل
              وَيُقَال: سرى وسرى.
