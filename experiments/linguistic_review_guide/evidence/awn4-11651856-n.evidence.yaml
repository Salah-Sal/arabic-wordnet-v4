              attribution: أ حمد شوقى
            - idx: 4
              type: poetry
              text: لا يَصْلُحُ الناسُ فَوْضَى لا سَرَاةَ لَهُمْ ... ولا سَرَاةَ إِذا جُهَّالُهُمْ سادُوا
              attribution: الأَفْوه الأَوْدِيّ
            - idx: 5
              type: poetry
              text: إِذا تَوَلَّى سَرَاةُ الْقَوْمِ أَمْرَهُمُ ... نَمَا عَلَى ذاك أَمْرُ القَوْمِ فازْدادوا
              attribution: الأَفْوه الأَوْدِيّ
            - idx: 6
