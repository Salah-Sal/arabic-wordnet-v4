                \ أنّ الأَفْعَى تأتي جُحْر الضّبِّ فتَحرِشُه فيَخْرُجُ أحياناً مُسْتَقَبلَها براسه، فيقال: خَرَجَ مُرَئِّساً،\
                \ ورُبّما احترشه الرّجل، فيجعل عُوداً في فم جُحْره فيحسَبُه أفعَى، فيخرج مُرَئِّسا أو مُذَنِّبا. وفلانٌ يَرْأَسُ\
                \ الضِّبابَ، أي: يأخذ رُؤوُسَها. ورَأَس فلانٌ فلاناً: أصابه بضربةٍ على رأسه. ويقال للقوم، إذا كثروا وعزوا:\
                \ هم رأس، قال عمرو بن كلثوم: \nبرأسٍ من بني جُشَم بن بَكْرٍ ... نَدُقُّ به السُّهُولة والحُزُونا\nأرس:  أَرَسةُ\
                \ بن مرّ: اسم جبل.\nيسر: يُقالُ: إنّه لَيَسْرٌ، خفيف، ويَسَرٌ: أي: ليِّنُ الانقياد، سريع المُتابعة، يُوصَفُ\
