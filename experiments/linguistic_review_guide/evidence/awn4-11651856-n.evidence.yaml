          - entry_id: 359553
            dictionary_id: 60
            headword: مسارات تركيزات تمثيلية
            headword_bare: مسارات تركيزات تمثيلية
            headword_norm: مسارات تركيزات تمثيلية
            root: سر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: سيناريوهات تشمل سلاسل زمنية لانبعاثات وتركيزات مجموعة كاملة من الغازات المسببة للاحتباس الحراري
              (غازات دفيئة) والهباء الجوي والغازات النشطة كيميائيا، وكذلك استخدام الأراضي / تغير الغطاء النباتي. كلمة تمثيلية
              تدل هنا على أن كل مسار تركيزات تمثيلية يوفر واحدا فقط من العديد من السيناريوهات الممكنة التي من شأنها أن تؤدي
              إلى التأثير الإشعاعي بالخصائص المحددة. ويؤكد المصطلح مسار على أهمية المسار الذي يأخذه تطور التركيز وليس فقط
              مستويات التركيز على المدى الطويل، للوصول إلى هذه النتيجة. تدل مسارات تركيزات تمثيلية عادة على مسار تركيز يمتد
              حتى عام 2100، والذي تقابله سيناريوهات الانبعاثات تنتجها نماذج التقييم المتكامل.
            translation_en: representative concentration pathways (rcps)
            translation_fr: chemins de concentrations représentatives
            domain: Climate, Environment and Solid Waste management
            external_id: arabterm:70544
            dict_key: arabterm_arabterm_climate_environment
