            form: null
            is_partial: 1
            definitions_text: 'من الجبل: أعلاه, يقالُ: صَعِدْتُ حتى استويتُ على سَرَاةِ الجبلِ وسَطُهُ ومُعْظَمُهُ مَتْنُه
              ومُعْظَمُهُ ظَهْرُه, يقالُ: عَلَوْتُ سَراةَ الفرسِ, وعَلَوْا سَرَواتِ الخيل: ظُهورهَا من المال (الإبل): خِيارُه'
            translation_en: null
            translation_fr: null
            domain: null
