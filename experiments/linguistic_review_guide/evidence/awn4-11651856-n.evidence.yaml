                عَنَى بِبَنِي لُؤَيٍّ قُرَيْشًا وَالْبُوَيْرَةُ مَوْضِعٌ وَحَرِيقٌ مُسْتَطِيرٌ مُرْتَفِعٌ أَوْ مُنْتَشِرٌ (وَسَرَاةُ) الطَّرِيقِ مُعْظَمُهُ وَوَسَطُهُ (وَمِنْهَا) الْحَدِيثُ «لَيْسَ لِلنِّسَاءِ سَرَوَاتُ الطَّرِيقِ» (وَسَرَوْتُ) عَنْهُ الثَّوْبَ كَشَفْتُهُ مِنْ بَابِ طَلَبَ (وَمِنْهُ الْحَدِيثُ) «فَلَمَّا سُرِّيَ عَنْهُ - عَلَيْهِ السَّلَامُ - بُرَحَاءُ الْوَحْيِ وَثِقَلُهُ» (وَسَرَى بِاللَّيْلِ) سُرًى مِنْ بَابِ ضَرَبَ بِمَعْنَى سَارَ لَيْلًا وَأَسْرَى مِثْلُهُ (وَمِنْهُ) السَّرِيَّةُ لِوَاحِدَةِ السَّرَايَا لِأَنَّهَا تَسْرِي فِي خُفْيَةٍ وَيَجُوزُ أَنْ تَكُونُ مِنْ الِاسْتِرَاءِ الِاخْتِيَارِ لِأَنَّهَا جَمَاعَةٌ (مُسْتَرَاةٌ) مِنْ الْجَيْشِ أَيْ مُخْتَارَةٌ يُقَال اسْتَرَاهُ إذَا اخْتَارَهُ وَلَمْ يَرِدْ فِي تَحْدِيدِهَا نَصٌّ (وَمَحْصُولُ) مَا ذَكَر مُحَمَّدٌ - رَحِمَهُ اللَّهُ - فِي السِّيَرِ أَنَّ التِّسْعَةَ فَمَا فَوْقَهَا سَرِيَّةٌ وَالثَّلَاثَةَ وَالْأَرْبَعَةَ وَنَحْوَ ذَلِكَ طَلِيعَةٌ لَا سَرِيَّةٌ وَمَا رُوِيَ «أَنَّ رَسُولَ اللَّهِ - صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ - بَعَثَ أُنَيْسًا وَحْدَهُ سَرِيَّةً» يُخَالِفُ ذَلِكَ (وَقَوْله) إذَا تَسَرَّتْ السَّرِيَّةُ تَفَعُّلٌ مِنْ السُّرَى وَرُوِيَ سُرِّبَ مِنْ التَّسْرِيبِ الْإِرْسَالُ وَلَهُ وَجْهٌ وَالْأَوَّلُ أَشْبَهُ وَإِنْ لَمْ يُذْكَرُ فِي اللُّغَةِ (وَقَوْلُهُمْ) الْعَفْوُ عَنْ الْقَطْعِ لَا يَكُونُ عَفْوًا عَنْ السِّرَايَةِ (وَسَرَى) الْجُرْحُ إلَى النَّفْسِ أَيْ أَثَّرَ فِيهَا حَتَّى هَلَكَتْ لَفْظَةٌ جَارِيَةٌ عَلَى أَلْسِنَةِ الْفُقَهَاءِ إلَّا أَنَّ كُتُبَ اللُّغَةِ لَمْ تَنْطِقْ بِهَا.
