              text: |-
                سروسرا يَسرُو، اسْرُ، سَرْوًا وسَراوَةً، فهو سَريّ، والمفعول مَسْرُوّ (للمتعدِّي)• سَرا الشَّخصُ:1 - شرُف " {قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيًّا}: سيِّدًا كريمًا".2 - سخا في مروءة ورجولة "شابٌّ سَرِيّ".• سرا الهمَّ عن فؤاده: كشفَه. 
                أسرى يُسْري، أسْرِ، إسراءً، فهو مُسْرٍ، والمفعول مُسْرًى• أسرى الشَّيءَ عنه: أزاله، نزعه وألقاه "أسرى فزعَه بذكر الله". 
                انسرى عن ينسري، انسَرِ، انسراءً، فهو مُنْسَرٍ، والمفعول مُنْسَرًى عنه• انسرى الهمُّ عنه: مُطاوع سرا: انكشَف وزال "ما زلت أُواسيه حتّى انسرى عنه بعضُ الحزن". 
                تسرَّى يتسرَّى، تَسَرَّ، تَسَرّيًا، فهو مُتسَرٍّ• تَسرَّى الشَّخصُ: تكلّف السّخاءَ في مروءة "تسرّى أمام ضيوفه". 
                سرَّى/ سرَّى عن يُسرِّي، سرِّ، تسريةً، فهو مُسَرٍّ، والمفعول مُسَرًّى• سرَّى الهمَّ عن فؤاده: سَراه؛ كشفه، نفّس.• سرَّى عن أخيه: أزال ما به من هَمّ "سرَّى عن رفيقه- لا تملّ تسريةَ صديقك في محنته" ° سُرِّيَ عنه: زال ما به من همٍّ. 
                إسْراء [مفرد]: مصدر أسرى. 
                انْسِراء [مفرد]: مصدر انسرى عن. 
                تَسْرِيَة [مفرد]: مصدر سرَّى/ سرَّى عن. 
                سَراوَة [مفرد]: مصدر سرا. 
                سَرْو1 [مفرد]:1 - مصدر سرا.2 - (سق) فتحة غير مستديرة في سطح الصندوق المصوِّت لآلة القانون. 
                سَرْو2 [جمع]: (نت) جنس شجر حَرَجيّ من فصيلة السّرويّات، يزرع للتزيين وسياجا للمزروعات لحمايتها من الرِّياح، وواحدته سَرْوة.• سَرْو الصيَّف: (نت) جنس نبات آسيوي أوربيّ بأوراق غزيرة ينقلب لونها إلى الأحمر الزاهي خلال الصيف. 
                سَرِيّ [مفرد]: ج أسْرياءُ وسَراة، جج سَرَوات، مؤ سَرِيّة، ج مؤ سَرايا: صفة مشبَّهة تدلّ على الثبوت من سرا: شريف، كريم الحسب، صاحب مروءة وسخاء ° إنَّه لسريٌّ مريّ: السخاء في الشرف وكمال الرجوليّة. 
                مُسْرًى [مفرد]: اسم مفعول من أسرى.
