          - entry_id: 983279
            dictionary_id: 150
            headword: قزم
            headword_bare: قزم
            headword_norm: قزم
            root: قزم
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '[قزم] القَزَمُ بالتحريك: الدناءةُ والقماءةُ. والقَزَمُ: رُذالُ الناس وسَفَلتهم. قال زياد بن
              منفذ: وهم إذا الخيلُ جالوا في كَواثِبِها فوارسُ الخيل لاميل ولا قزم يقال رجلٌ قَزَمٌ، والذكر والأنثى والواحد
              والجمع فيه سواءٌ، لأنه في الأصل مصدر. والقَزَمُ: أردأ المال. وشاة قزمة. والقزام: اللئام. وقال: أحصنوا أمهم من
              عَبْدِهِم تلك أفعالُ القِزامِ الوكعه أي زوجوا.'
            translation_en: null
            translation_fr: null
            domain: null
