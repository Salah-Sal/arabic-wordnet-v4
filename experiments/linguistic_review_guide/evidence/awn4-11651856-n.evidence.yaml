            headword: ماسورة السحب
            headword_bare: ماسورة السحب
            headword_norm: ماسورة السحب
            root: سر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: يُطلق عليها أيضاً اسم 'ماسورة الشفط'، وهي ماسورة تربط بين الكاربوراتير والمحرك. وتكمن وظيفتها
              في توصيل [خليط الهواء والوقود](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=88248) من الكاربوراتير
              إلى الأسطوانات، حيث يتم توزيع الخليط بشكل متساو بين جميع الأسطوانات. علاوة على ذلك يجب أن تتسم الماسورة بمُقاومة
              منخفضة للسريان حتى تمتلئ الأسطوانات بالكامل، وبالتالي يتم الوصول إلى قدرة عالية للمحرك . وكثيراً ما توضع وحدات
              في ماسورة السحب تخدم عملية التسخين التحضيري للخليط.
            translation_en: intake manifold
