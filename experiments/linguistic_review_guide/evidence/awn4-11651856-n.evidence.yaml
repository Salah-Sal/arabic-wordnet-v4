              text: 'فلانًا: أَخَذَ أسْراه'
              is_raw: 0
            - sense_index: 4
              text: 'وقيل: قَتَل أَسراه'
              is_raw: 0
            - sense_index: 5
              text: 'أى: يُقتَل سَرِيُّكُمُ (من حديث: اليومَ تُ سَرَّوْنَ)'
