                سرو
                1 سَرُوَ, (S, M, Mgh, K,) aor. ـْ (S, K;) and سَرَا, (S, M, K,) aor.  as above; (S, K;) and سَرِىَ, (S, M, K,) aor. ـْ (S, K;) inf. n. سَرَاوَةٌ, (S, M, K,) of the first verb, (S, M,) and سَرْوٌ, (Sb, Lh, S, M, Mgh, K,) of the same verb, (M, Mgh,) and of the second, (S, M,) and of the third, (S,) and سَرًا and سَرَآءٌ, (M, K,) both of the third, but سَرَآءٌ, and this only, is mentioned by Lh as inf. n. of the second verb; (M;) He was, or became, possessed of liberality, bountifulness, munificence, or generosity, combined with manliness, or manly virtue: (S, Mgh:) or manliness, or manly virtue, (M, K,) and (M,) or combined with, (K,) high or elevated rank or condition, nobility, dignity, honour, or glory. (M, K.) A2: سَرْوُ المَسَاقِى means The cleaning out of what are termed مَسَاقٍ [pl. of مَسْقَاةٌ or مِسْقَاةٌ, which see in art. سقى]. (TA.) A3:  سَرْوٌ also signifies, like تَسْرِيَةٌ [inf. n. of ↓ سرّى], and إِسْرَآءٌ [inf. n. of ↓ اسرى], The throwing off a thing from oneself [or from another]; (K, TA;) and the pulling off a thing. (TA.) You say, سَرَوْتُ الثَّوْبَ عَنِّى, (ISk, S,) or عَنْهُ, aor. ـْ (Mgh,) inf. n. سَرْوٌ, I threw off the garment from me, (ISk, S,) or I removed the garment from over him; (Mgh;) and سَرَيْتُ is a dial. var. thereof; (S;) or سَرَا ثَوْبَهُ عَنْهُ, inf. n. سَرْوٌ; and ↓ سرّاهُ; he pulled off his garment from him: (M:) and سَرَوْتُ الجُلَّ عَنِ الفَرَسِ, (TA,) or عَنْ ظَهْرِ الفَرَسِ, (M,) and ↓ سَرَّيْتُهُ, and ↓ أَسْرَيْتُهُ, I threw off [the horse-cloth from the horse, or from the back of the horse]. (TA.) And سَرَوْتُ عَنِّى دِرْعِى [I threw off from me my coat of mail]: in this case the verb is only with و. (S.) [Hence,] عَنْهُ ↓ سُرِّىَ, (M,) or سُرِّىَ عَنْهُ الهَمُّ, (S, K, *) inf. n. تَسْرِيَةٌ, (TA,) (tropical:)  Anxiety  became removed from him; as also عَنْهُ ↓ انسرى
                الهَمُّ: (S, K, * TA:) or his anxiety became removed, or cleared away. (M, in explanation of the first of these phrases.) And عَنْهُ الخَوْفُ ↓ سُرِّىَ (assumed tropical:)  Fear was made to quit him: the teshdeed denotes intensiveness. (TA.) And hence the phrase in a trad., عَنْهُ بُرَحَآءُ الوَحْىِ ↓ فَلَمَّا سُرِّىَ (assumed tropical:)  [and when the vehement distress of mind arising from the oppression caused by inspiration was made to quit him]; referring to the Prophet. (Mgh.) A4: سَرَتْ, (K,) inf. n. سَرْوٌ, (TA,) said of the female locust, She laid eggs: (K:) a dial. var. of سَرَأَتْ. (TA.) 2 اليَوْمَ تَسَرَّوْنَ, said by the Prophet on the occasion of the expedition of Ohod, means Today ye shall have your سَرِىّ [or that person, among you, who is distinguished by liberality and manliness, &c.,] slain: and [accordingly] Hamzeh was then slain. (TA.) A2:  See also 1, in six places.3 ساراهُ, inf. n. مُسَارَاةٌ, i. q. فَاخَرَهُ [i. e. He vied with him, or contended with him for superiority, in glory, or rather in liberality and manliness, &c.: see 1, first sentence]. (TA.) 4 اسرى He became in, or upon, land, or ground, such as is termed سَرَاة: belonging to the present art., accord. to Er-Rághib: (TA:) or he betook himself to the سَرَاة [app. meaning the mountainous tract so called]: (K and TA in art. سرى:) it is like أَنْجَدَ and أَتْهَمَ. (TA in that art.) A2:  See also 1, in two places.5 تسرّى signifies تَكَلَّفَ السَّرْوَ, (S, K, * TA,) i. e. [He affected, or constrained himself, to possess liberality and manliness, &c., (see 1, first sentence,) or] high or elevated rank or condition, nobility, dignity, honour, or glory, and manliness, or manly virtue: (TA:) or it signifies أَخَذَ سُرِّيَّةً [he took a concubine-slave]: (K:) or A2:  one says also, تسرّى الجَارِيَةَ [He took the girl, or young woman, as a concubine-slave], from السُّرِّيَّةُ; said by Yaakoob to be originally تَسَرَّرَ, [which see in art. سر,] from السُّرُورُ. (S.) b2:  and تسرّاهُ signifies ↓ أَخَذَ أَسْرَاهُ [i. e. He took the best thereof]. (M, TA. [See also 8.]) 7 إِنْسَرَوَ see 1, in the latter part of the paragraph.8 استرى He chose, or selected, as being the best, (S, M, K,) a thing, (M,) or men, (S, K,) and camels, and sheep or goats. (S.) and اِسْتَرَيْتُهُ I took the best of it. (T, TA. [See also 5, last sentence.]) And اِسْتَارَ signifies the same as استرى, being formed from the latter by transposition. (TA.) One says, استرى المَوْتُ بَنِى فُلَانٍ, (S,) or الحَىَّ, (K,) i. e. Death chose [or took] the best of the sons of such a one, or of the tribe. (S, * K, * TA.) سَرْوٌ an inf. n. of 1 [q. v.]. (S, M, K, &c.) [Used as a simple subst., Liberality, bountifulness, munificence, or generosity, combined with manliness, or manly virtue; &c.] b2:  Hence, أَبُو السَّرْوِ (assumed tropical:)  Aloes-wood, or the like, that is used for fumigation; syn. البَخُورُ. (Har p. 228.) A2: Also A part that rises from [the bottom of] a valley, and slopes down from the rugged portion of a mountain: (M, K:) or that rises from the channel in which the water flows, and slopes down from the rugged portion of a mountain: (M:) it is like a خَيْف. (S.) السَّرْوُ, (S, K,) or سَرْوُ حِمْيَرَ, occurring in a trad., is said to mean مَحَلَّةُ حِمْيَرَ [The settlement of Himyer]. (S, M, K.) A3:  and A certain kind of tree, (S, M, K,) well-known; (K;) [the common, or evergreen, cypress; cupressus sempervirens of Linn.: applied thereto in the present day: (Delile's Floræ Aegypt. Illustr., no. 900:)] n. un. with ة. (S, M, K.) A4:  and Certain worms that light upon plants, (M, K, TA,) and eat them: (M:) الثِّيَاب, in [some of] the copies of the K, is a mistranscription for النَّبَات: (TA:) sing. [or rather n. un.] with ة. (M.) سَرَاةٌ The back (S, M, K) of anything: (S:) pl. سَرَوَاتٌ: (S, M, K:) it has no broken pl. (M.) And The higher, or highest, part of anything: (M in the present art., and K in art. سرى:) so [for instance] of a mountain. (TA in art. سرى.) [Hence,] سَرَاةُ اليَمَنِ, (M,) or السَّرَاةُ [by way of preeminence, for سَرَاة is prefixed to the names of a number of places and of tribes, as is said in the TA in art. سرى], A certain mountain [or mountainous tract] commencing near 'Arafát and extending to Nejrán of El-Yemen: (Msb:) pl. as above. (M.) b2:  The highest [or most advanced state] of the day: (TA:) [or] the state of advancement, when the sun has become somewhat high, (syn. اِرْتِفَاع,) of the day, (M, K, TA,) and so of other things; by some said to mean the middle thereof; (M;) so in the S, in relation to the day; but this is [said to be] a mistake: (TA:) in a verse of El-Bureyk El-Hudhalee, of the night: pl. as above: and the sing. also occurs used as a pl. (M.) b3:  The middle of anything: pl. as above. (S.) The middle anسرىd main part of a road; (Mgh, Msb;) the hard and elevated part thereof. (K.) It is said in a trad., لَيْسَ لِلْنِّسَآءِ سَرَوَاتُ الطَّرِيقِ (S, Mgh) The back and middle of the road, (S,) or the middle and main parts thereof, (Mgh,) are not for the women; meaning that they should walk upon the side parts. (S.) b4:  Accord. to Er-Rághib, A wide tract of land. (TA in art. سرى.) A2:  It is also a pl., of a rare form, (S, Msb,) or a quasi-pl. n., (M, K,) of سَرِىٌّ [which see in several places]. (S, M, Msb, K.) سَرْوَةٌ n. un. of سَرْوٌ [q. v.] in two senses.
                A2: See also سِرْوَةٌ.
                سُرْوَةٌ: see what next follows.
                سِرْوَةٌ (Th, AHn, T, S, M, K) and ↓ سُرْوَةٌ (Th, M, IAth, K) and ↓ سَرْوَةٌ (Kr, M, K) A small arrow: (S:) or a small and short arrow: or an arrow broad and long in the head; (M, K, TA;) but therewithal slender and short; with which one shoots at the butt: (TA:) or such as is round and smooth, not broad; the broad and long being termed مِعْبَلَةٌ: (M:) or the very slenderest of arrow-heads, that penetrates into the coats of mail: (Th, M:) or it [is an arrow that] penetrates into the coats of mail, for which reason it is called الدِّرْعِيَّةُ, its head entering like the needle: (T, TA:) or an arrow-head resembling an ordinary needle or a large needle: it is mentioned also in art. سرى, [as being a small, short, round and smooth arrow-head, having no breadth, and as being called سِرْوَةٌ and سِرْيَةً,] because the word belongs to that art. and to this: (M:) [see also مِرْمَاةٌ; and see سِرْوَةٌ in art. سرأ:] the pl. is سُرًى [or سِرًى?] accord. to the T, or سِرَآءٌ accord. to the S. (TA.) A2:  The first (سِرْوَةٌ) also signifies The locust in its first state, when it is a larva; (S;) or in its first state of growth, when it comes forth from its egg: (M:) originally with hemz: (S:) [see سَرْءٌ, in two places:] and سِرْيَةٌ is a dial. var. thereof. (S.) [See also جَرَادٌ.]
                سَرِىٌّ, as an epithet applied to a man, (S, M, K, &c.,) may be from اِسْتَرَيْتُ الشَّىْءَ “ I chose, or selected, the thing,” or from السَّرَاةُ “ the higher, or highest, part ” of a thing, (Ham p. 337,) or, accord. to Er-Rághib, from سَرَوْتُ الثَّوْبَ عَنِّى “ I  pulled off the garment from me,” (TA, [in which this derivation is said to be good, but I think it far-fetched,]) Possessing liberality, bountifulness, munificence, or generosity, combined with manliness, or manly virtue: (S, Mgh:) or possessing manliness, or manly virtue, (M, K,) and, (M,) or combined with, (K,) high or elevated rank or condition, nobility, dignity, honour, or glory: (M, K:) or i. q. رَئِيسٌ [meaning a chief, or person high in rank or condition]: (Msb:) [or a generous and manly or noble person:] fem. with ة: (M, K:) and ↓ مَسْرَوَانٌ signifies the same, applied to a man; and ↓ مَسْرَوَانَةٌ applied to a woman: (M:) the pl. of سَرِىٌّ is أَسْرِيَآءُ and سُرَوَآءُ (Lh, M, K) and سُرًى, (Az, K,) which is anomalous, (TA,) and سَرَاةٌ, (T, S, Mgh, * Msb,) [originally سَرَوَةٌ,] which is [also] anomalous, (T, TA,) the only instance of فَعَلَةٌ as the measure of a pl. of a word of the measure فَعِيلٌ, (S, Msb,) or it is a quasi-pl. n., (Sb, M, K,) and its pl. is سَرَوَاتٌ; (S, M, Mgh, * K;) meaning سَادَاتٌ [or chiefs, &c.]; (Mgh); and سُرَاةٌ, with damm, [originally سُرَوَةٌ,] is a dial. var. of سَرَاةٌ, as pl. [or quasi-pl. n.] of سَرِىٌّ: (IAth, TA:) the pl. of سَرِيَّةٌ is سَرِيَّاتٌ and سَرَايَا. (M, K.) Also Chosen, or choice, or select: (M:) what is good of anything; pl. [or quasi-pl. n.] سَرَاةٌ: (Ham p. 337:) the best, (Msb, TA, and Har p. 56,) and in like manner سَرَاةٌ [as a pl.]; (M, Msb, TA, and Ham p. 57, and Har ubi suprà;) the former, of men, (Har ubi suprà,) and of camels; (S;) and the latter, of men, (S, TA, and Ham ubi suprà, and Har,) and of cattle or camels and the like, (S, M, TA,) as also the former. (TA.) A2:  See also art. سرى.
                سُرِّيَّةٌ, said by some to be originally of the measure فُعُّولَةٌ, from سَرْوٌ: see art. سر.
                أَسْرَى is of the measure أَفْعَلُ [denoting the comparative and superlative degrees] from السَّرْوُ signifying “ liberality, bountifulness, munificence, or generosity, combined with manliness, or manly virtue: ” [&c.:] whence the phrase أَسْرَاهُمْ سُودَدًا, meaning The best of them in respect of chiefdom or the like: or it may be from السُّرَى; meaning in this instance that the fame of the chiefdom, or the like, of him to whom it relates has pervaded the countries and spread among mankind; and this is more worthy of regard in respect of the method of grammatical analysis; from Mtr: (Har p. 363: [see art. سرى:]) [ISd, however, assigns the word to the present art.:] see 5, last sentence.
                أَرْضٌ مَسْرُوَّةٌ A land containing the سِرْوَة, or locust in its first state, when it is a larva. (S.) [In a copy of the M, it is said to be from السَّرْوَةُ; and the context there indicates the meaning to be A land infested by a worm of the kind termed سَرْوٌ, of which سَرْوَةٌ is the n. un.: but probably السَّرْوَةُ, in this instance, is a mistranscription for السِّرْوَةُ, which is mentioned immediately after as meaning “ the locust in its first state of growth, when it comes forth from its egg. ”]
                مَسْرَوَانٌ; and its fem., with ة: see سَرِىٌّ.
