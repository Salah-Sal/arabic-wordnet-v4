          - entry_id: 528478
            dictionary_id: 92
            headword: 1 مسار ؛ 2 مسار ؛ 3 مسار ؛ 4 مسار ؛ 5 مسار ؛ 6 مسار
            headword_bare: 1 مسار ؛ 2 مسار ؛ 3 مسار ؛ 4 مسار ؛ 5 مسار ؛ 6 مسار
            headword_norm: 1 مسار ؛ 2 مسار ؛ 3 مسار ؛ 4 مسار ؛ 5 مسار ؛ 6 مسار
            root: سر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: "1- في الاتصالات: وصلةٌ بين عقدتَين في شبكة.\n2- طريقٌ خلال جَمْعَةٍ مهيكَلةٍ من المعلومات،\
              \ كما في قاعدة معطيات أو برنامج أو ملفات مخزّنة على قرص. \n3- في البرمجة: تتالي تعليمات يتابع الحاسوبُ إجراءَها\
              \ لدى تنفيذ مَسَاقٍ ruotine ما. \n4- في معالجة المعلومات (كما في النظرية الأساسية للنظم الخبيرة الاستنتاجية):\
              \ طريقٌ منطقي خلال فروع شجرةِ الاستدلال يوصل إلى النتيجة.\n5- في تخزين الملفات: الطريقُ الذي يَسلكه نظامُ التشغيل\
              \ للاهتداء إلى الملفات على القرص وفرزِها واستحضارِها.\n6- في البيانيات: تراكمُ مقتطَعاتٍ مستقيمة أو منحنيات\
              \ يجب ملْؤُها أو كتابةُ نصوصٍ فوقَها."
