                \ الله أَسْرَ فلان، أي: قوّة خلقه، قال الله عز وجل: وَشَدَدْنا أَسْرَهُمْ  ، وكلُّ شيئين مما يَبينُ طرفاهما\
                \ فشددت أَحَدَهما بالآخر بربِاطٍ واحد فقد أَسَرْتَهما كما يُؤْسَرُ طَرَفا عُرْقُوتَي القَتَب ونحوه، قال الأعشَى:\
                \ \nوقيّدني الشِّعْرُ في بيته ... كما قيّد الآسِراتُ الحِمارا\nوأسرتُ السَّرْج والرَّحلَ: ضَمَمْتَ بعضَه إلى\
                \ بعضٍ بسُيُور، والسُّيُور تسمى: تآسير.\nرأس: رأسُ كلِّ شيء: أعلاه، ثلاثة أرؤس، والجميع: الرؤوس. وفحلٌ أرأس:\
                \ وهو الضّخم الرأس، وأنا رأسُهم ورئيسُهم، وتَرَأَّسْت عليهم ورَأَّسوني على أَنْفُسهم. والرُّؤاس: عِظَم الرأس\
                \ فوق قدره، وصاحِبُه: رؤاسيٌّ. وكلبٌ رَؤوسٌ: يُساوِرُ رأسَ الصَّيد. ورجلٌ رئيسٌ مَرْؤوُس، رأَسه السِّرسام\
                \ فأخذ برأسه. وسَحابةٌ رائسة: [التي] تتقدّم السَّحاب. وبعضٌ يقول: إنّ السَّيْل يَرْأَسُ الغُثاء والقمام رأساً،\
                \ وهو جمعه إيّاه ثمّ يحتمله، ويُقال: أَعطني رأساً من ثُوم. والضَّب ربّما رأس الأَفعَى، وربّما ذَنَبَها، وذلك\
                \ أنّ الأَفْعَى تأتي جُحْر الضّبِّ فتَحرِشُه فيَخْرُجُ أحياناً مُسْتَقَبلَها براسه، فيقال: خَرَجَ مُرَئِّساً،\
                \ ورُبّما احترشه الرّجل، فيجعل عُوداً في فم جُحْره فيحسَبُه أفعَى، فيخرج مُرَئِّسا أو مُذَنِّبا. وفلانٌ يَرْأَسُ\
                \ الضِّبابَ، أي: يأخذ رُؤوُسَها. ورَأَس فلانٌ فلاناً: أصابه بضربةٍ على رأسه. ويقال للقوم، إذا كثروا وعزوا:\
                \ هم رأس، قال عمرو بن كلثوم: \nبرأسٍ من بني جُشَم بن بَكْرٍ ... نَدُقُّ به السُّهُولة والحُزُونا\nأرس:  أَرَسةُ\
                \ بن مرّ: اسم جبل.\nيسر: يُقالُ: إنّه لَيَسْرٌ، خفيف، ويَسَرٌ: أي: ليِّنُ الانقياد، سريع المُتابعة، يُوصَفُ\
                \ به الإنسانُ والفرس، قال:\nإنّي على تَحَفُّظي ونزري ... أعسرُ إن مارستني بعُسْرِ\nويَسَرٌ لمن أراد يسري \n\
                ويُقال: إنّ قوائم هذا الفرس ليَسَراتٌ خِفاف، إذا كُنَّ طَوْعَه. الواحدةُ: يَسَرة. ورجلٌ أعسرُ يَسَرٌ، وامرأة\
                \ عَسْراءُ يَسَرةٌ، أي: تعملُ بيديها معاً. واليَسَرةُ: فُرجةُ ما بين الأَسِرَّة من أَسرار الرّاحة، يُتَيَمَّنُ\
                \ بها، وهي من علامات السَّخاء. واليَسارُ: اليَدُ اليُسْرَى. والياسِرُ كاليامِنِ، والمَيْسَرةُ كالميمنة، مجراها\
                \ في التَّصريف واحد. والأَيسارُ: الذّين يجتمعون على الجَزُور في المَيْسِر، الواحدُ: يَسَرٌ. واليَسَرُ أيضاً:\
                \ ضَريبُ القِداح. واليُسْرُ: اليَسار، أي: الغِنَى والسَّعة. وقد يَسَّر فَرَسَه فهو مُيَسَّر، أي: مصنوعٌ سَمينٌ.\
                \ وفرسٌ حَسَنُ التَّيْسُور، أي: حَسَنُ السِّمَن، قال المرّار: \nقد بلوناه على عِلاّته ... وعلى التَّيسُور\
                \ منه والضُّمُرْ\nويقال: خذ ما تَيَسَّر واستَيْسر. وإذا سَهُلت ولادة المرأة قيل: أَيْسرت، وأذكرت."
