            definitions_text: مسار يتم إتباعه عبر فترة زمنية لتحقيق أهداف مختلفة تهم انبعاث غازات الاحتباس الحراري، التركيزات
              في الغلاف الجوي، أو التغير العالمي لمتوسط درجات الحرارة السطحية والتي تنطوي على مجموعة من المتغيرات الاقتصادية
              والتكنولوجية والسلوكية. وهذا يمكن أن يشمل تغييرات في طريقة إنتاج وإنشاء واستخدام الطاقة والبنية التحتية، وفي
              إدارة الموارد الطبيعية، وكذلك في تحويل أو إنشاء مؤسسات، وفي سرعة واتجاه التغير التكنولوجي.
