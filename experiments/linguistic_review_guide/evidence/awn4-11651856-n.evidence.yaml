            is_partial: 0
            definitions_text: ماسورة تعمل في منظومةالعادم على توجيه تيار غاز العادم، حيث تقوم بربط الأجزاء المفردة من منظومة
              العادم بعضها مع بعض، وتعمل في الوقت نفسه على تبريد تيار العادم. يجب أن تكون مواضع الربط هذه مُحكمة تماماً ضد
              التسريب، للحيلولة دون تسرب غازات العادم إلى المقصورة الداخلية للسيارة. وتُستخدم ألواح الصُلب الكربوني أو الصلب
              غير قابل للصدأ في تصنيع ماسورة العادم. وتتداخل أطراف مواسير العادم بعضها في بعض مع تأمينها بواسطة قامطات، أو
              تُربط معاً بواسطة وصلات ذات فلانشات أو باستخدام اللحام.
