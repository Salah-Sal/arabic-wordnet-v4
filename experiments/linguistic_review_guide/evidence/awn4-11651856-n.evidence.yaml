                بِبَلْخَ.وسَرْوانُ: ة بِسِجِسْتانَ.واسْتَرَيْتُهُم: اخْتَرْتُهم،وـ المَوْتُ الحَيَّ: اخْتارَ سَراتَهُم.وسَرَتِ
                الجَرادَةُ: باضَتْ. وإسرايِيِلُ، ويُهْمَزُ، واسْرايِينُ، ويُهْمَزُ: اسمٌ.'
