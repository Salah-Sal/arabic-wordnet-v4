            form: null
            is_partial: 1
            definitions_text: 'يقالُ: أخَذتُ سَراتَه. ويقال: هى سَراةُ مالهِ. منَ النَّهار: وَقتُ ارْتِفاعِ الشَّمسِ فى السَّماء.
              وقيل: وسَطُه. سَرَاةَ اللَّيْلِ: وسَطُهُ. وقيلَ: عامَّتُهُ. وقيل: أوَّلُهُ. جَبَلٌ بناحيةِ الطَّائْف. وقيل:
              جَبَلٌ أوَّلُه قَريْبٌ من عَرَفات ويمتَدُّ إلى حَدِّ نَجْرانَ اليمَن.'
            translation_en: null
            translation_fr: null
            domain: null
