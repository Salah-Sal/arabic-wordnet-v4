            definitions_text: 'القَزَمُ، محرَّكةً: الدَّناءَةُ، والقَماءَةُ، أو صِغَرُ الجِسْمِ في المالِ، وصِغَرُ الأخْلاقِ
              في الناسِ، ورُذالُ الناسِ، للواحِدِ والجَمْعِ، والذَّكَرِ والأنْثَى، وقد يُثَنَّى ويُجْمَعُ ويُؤَنَّثُ،يقالُ:
              رجلٌ قَزَمٌ،ورجُلانِ قَزَمَانِ،وامرأةٌ قَزَمَةٌ،ورِجالٌ أقْزامٌ وقُزامَى وقُزُمٌ،وقد قَزِمَ، كفرِحَ،فهو قَزْمٌ
              وككتِفٍ وعُنُقٍ وجَبَلٍ، وهي: بهاءٍ، وأرْدَأُ المال. وككِتابٍ: اللئامُ. وكغُرابٍ: الذي لا يَغْلِبُه أحدٌ، والمَوْت
              الوَحِيُّ. وككتِفٍ وجَبَلٍ: الصَّغيرُ الجُثَّةِ اللئيمُ لا غَناءَ عندَهُج: كعُنُقٍ وأصحابٍ.ورجلٌ وامرأةٌ قَزَمَةٌ،
              محرَّكةً: قَصيرةٌ،والاسمُ: القَزَمُ.وقَزَمَهُ: عابَه.وقُزْمانُ، بالضم: ابن الحَارِثِ العَبْسِيُّ المُنافِقُ
              الذي قال فيه رسولُ الله، صلى الله عليه وسلم: "إنَّ الله لَيُؤَيِّدُ هذا الدينَ بالرَّجلِ الفاجِرِ".'
