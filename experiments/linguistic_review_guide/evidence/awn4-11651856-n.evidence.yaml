                (أتَوْا نارِي فَقُلْتُ مَنُونَ قالُوا ... سَرَاةُ الجِنِّ قُلْتُ عِمُوا ظَلاَمَا)
                وروي سُراةُ وقد تَقَدَّم في الياء ورَجُلٌ مَسْرَوانٌ وامرأةٌ مَسْرَوانَةٌ سَرِيّان عن أبي العَمَيْثَل الأعرابي وامرأةٌ سَرِيَّة من نِسْوَةٍ سَرِيّات وسَرَايَا وسَرَاةُ المالِ خِيارُه واسْتَرَيْتُ الشيءَ وأَسْتَرتُهُ الأخيرة على القَلْب اخْتَرْته قال الأعشى
                (فقد أَطَّبِي الكاعِبَ المُسْتَراةَ ... مِنْ خِدْرها وأُشِيعُ القِمَارَا)
                ومنه قولُ بعضِ سَجَعَةِ العرب وذَكَرَ ضُروبَ الأزْنادِ فقال ومن اقْتَدَح المَرْخَ والعَفارْ فقد اسْتَخارَ واسْتَارَ وتَسَرَّيتُه أخذت أَسْراه قال حُمَيدُ بن ثورٍ
                (لقد تَسَرَّيْت إذا الهَمُّ وَلَجْ ... واجْتَمعَ الهَمُّ هُمُوماً واعْتَلَجْ ... جُنَادِفَ المِرْفَقِ مَبْنِيَّ الثَّبَجْ)
                والسَّرِيُّ المُخْتار والسُّرْوَةُ والسِّرْوَةُ والسَّرْوَةُ الأخيرة عن كُراع سَهْمٌ صَغِيرٌ قصيرٌ وقيل سَهْمٌ عَرِيضُ النَّصْل طَوِيلُه وقيل هو المُدَوَّر المُدَمْلَك الذي لا عَرْضَ له فأما العَرِيضُ الطويلُ فهو المِعْبَلَة وقال ثعلب السِّرْوَةُ والسُّرْوَةُ أدَقُّ ما يكون من نصال السِّهَامِ يدخل في الدُّرُوع وقال أبو حَنِيفة السِّرْوَة نَصْلٌ كأنّه مِخْيَط أو مِسَلّة وقد تقدم في الياء لأن هذه الكلمة يائية وواوية وسَرَاةُ كل شيءٍ أعلاه وسَرَاةُ النَّهارِ وغيره ارتفاعُه وقيل وَسَطُه قال البُرَيْق الهذلي
                (مُقِيماً عِنْد قَبْرِ أبي سِبَاعٍ ... سَرَاةَ اللَّيْلِ عِنْدَكَ والنَّهارَا)
                فَجَعَل اللِّيْلَ سَرَاةً والجمع سَرَوات ولا يُكَسَّر وقوله
                (صَرِيفٌ ثُمَّ تَكْلِيفُ الفِيَافِي ... كأنَّ سَرَاةَ جِلَّتِها الشُّفُوفُ)
                أراد كأن سَرَواتهن الشفوفُ فَوَضَعَ الواحِدَ مَوْضِعَ الجَمْع ألا تَرَاه قال قبل هذا (وُقُوفٌ فَوْقَ عِيسٍ قد أُمِلَّت ... بَرَاهُنَّ الإِناخَةَ والوَجِيفُ)
