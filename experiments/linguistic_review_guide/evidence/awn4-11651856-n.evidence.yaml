              attribution: الأعشى
            - idx: 4
              type: poetry
              text: وَصِنْوُكَ لا أَنْسَى مُعاوِيةَ الذى له من سَرَاةِ الحَرَّتَيْن وفُودُها
              attribution: الخنساء
            - idx: 5
              type: poetry
              text: مَتَى تَأْتِهِمْ مِنْ حافَةٍ تَلْقَ سَيِّدًا غُلامًا مُبِينًا عِنْدَه السَّرْو أَو كَهْلَا
              attribution: ابن مقبل
            - idx: 6
