            definitions_text: 'سَرَا فُلانٌ: صار سَرِيًّا شريفًا سَرَا فُلانٌ: رَأَسَ قَوْمَه سَرَا فُلانٌ: جَمَع السَّخَاءَ
              وا لْمُرُوءَةَ ا لجرادةُ ونحوُ ها سَرْوًا : با ضَتْ. (وانظر: س ر أ). فهى سَرُوٌّ. (ج) سِرَاءٌ ا لجرادةُ ونحوُ
              ها: صَوَّتَت فلانٌ الشَّيْءَ: نَزَعَهُ وكشَفَ عنه فلانٌ الشَّيْءَ: نَزَ عَهُ وأَلْقَاهُ. ي قالُ: سَرا ثَوْ بَه
              أو قناعَه سَرا كُمَّهُ عن ذراعه: حَسَرَه سَرا الجِلَّ عن ظَ هْرِ الفرس : أَلْ قاه عنه'
