        - sense_index: 0
          text: بَيْضُ الجراد وما أَشْبَهَه
          is_raw: 0
        - sense_index: 1
          text: '(فى علم النبات): Cupressus: جنسُ شَجرٍ حَرَجِيٍّ للتزيين, ينتمى إلى الفصيلة السَّرْويَّة, من رتبة الصَّنَوْبرِيَّات,
            الواحدةُ سَرْوَةٌ. وتُسمّيه العربُ شجرةَ الحيَة'
          is_raw: 0
        - sense_index: 2
          text: 'سَرْوُ الجَرَادِ: صَوْتُهُ'
          is_raw: 0
        - sense_index: 3
          text: 'سَرْوُ المساقِى: تَنْقِيتُها وإزالَةُ ما فيها'
          is_raw: 0
        - sense_index: 4
          text: مَحَلَّةُ حِمْيَر ومنازِلُها بأَرْضِ اليمن, وهي عِدّةُ مواضع
          is_raw: 0
