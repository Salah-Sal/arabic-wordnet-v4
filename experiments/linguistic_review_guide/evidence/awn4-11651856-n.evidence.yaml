            definitions_text: 'قزم(القَزَمُ، مُحَرَّكَةً: الدَّنَاءَةُ والقَمَاءَةُ) كَمَا فِي الصِّحاحِ، وَفِي الحَدِيثِ:
              " كَانَ يَتَعَوَّذُ من القَزَم "، وَهُوَ اللُّؤْمُ والشُّحُّ، ويُرْوَى بالرَّاءِ وقَدْ تَقَدَّمَ.(أوْ صِغَرُ
              الجِسْمِ فِي المَاءِ وصِغَرُ الأخْلاقِ فِي النَّاسِ) .(و) أَيْضا (رُذَالُ النَّاسِ) وسَفِلَتْهُمْ، (للوَاحِدِ
              والجَمْعِ والذَّكَرِ والأُنْثَى) ؛ لأنَّه فِي الأصْلِ مَصْدَرٌ، وأنشَدَ الجَوْهَرِيّ لِزِيَادِ بنِ مُنْقِذٍ:(وَهُمْ
              إذَا الخَيْلُ جَالُوا فِي كَوَاثِبِهَا ... فَوَارِسُ الخَيْلِ لَا مِيلٌ وَلَا قَزَمُ)يُقالُ: رجلٌ قَزَمٌ وامْرَأَةٌ
              قَزَمٌ، وهُوَ ذُو قَزَمٍ (وقَدْ يُثَنَّى ويُجْمَعُ ويُؤَنَّثُ) فِي لُغَة أُخْرَى. (يُقَال: رَجُلٌ قَزَمٌ ورَجُلانِ
              قَزَمَان، وامْرَأَةٌ قَزَمَةٌ، ورِجَالٌ أَقْزَامٌ) وامرَأَتَانِ قَزَمَتَانِ ونِسَاءٌ قَزَمَاتٌ، وقِيلَ: الجَمْعُ:
              أَقْزَامٌ (وقُزَامى) كَسُكَارَى (وقُزُمٌ) بِضَمَّتَيْن. ومِنه حَدِيثِ عَليٍّ رَضِيَ الله تَعالَى عَنْه فِي ذَمِّ
              أَهْلِ الشَّامِ: " جُفَاةٌ طُغَامٌ عَبِيدٌ أَقْزَامٌ ".(وَقد قَزَمَ، كَفَرِحَ فَهو قَزْمٌ) ، بالفَتْح، (وكَكَتِفٍ،
              وعُنُقٍ، وجَبَلٍ وهْيَ بِهَاءٍ) فِي الكُلِّ.(والقَزَمُ: أَرْدَأُ المَالِ) وصِغَارُه، وَمِنْهُم مَنْ خَصَّهُ
              فَقَالَ: صِغَارُ الغَنَمِ، وَهِي الحَذَفُ.(و) القِزَامُ، (كَكِتَابٍ: اللِّئَامُ) ، وأنْشَدَ الجَوْهَرِيّ:(أَحْصَنُوا
              أُمَّهُمُ منْ عَبْدِهِمْ ... تِلْكَ أَفْعَالُ القِزَامِ الوَكَعَهْ) أَيْ: زَوَّجُوا.(و) القُزَامُ، (كَغُرَابٍ:
              الَّذِي لَا يَغْلِبهُ أَحَدٌ) .(و) أَيْضًا (المَوْتُ الوَحِيُّ) عَنْ كُرَاعٍ.(و) القَزِمُ، (كَكَتِفٍ، وجَبَلٍ:
              الصَّغِيرُ الجُثَّةِ اللَّئِيمُ) الدَّنِيءُ (لَا غَناءَ عِنْدَه ج: كعُنُقٍ، وأَصْحَابٍ) .(ورَجُلٌ وامْرَأَةٌ
              قَزَمةٌ، مُحَرَّكَةً) أَيْ: (قَصِيرَةٌ) وقَصِيرٌ، (والاسْمُ القَزَمُ) بِالتَّحْرِيكِ أَيْضا.(وقَزَمَه) قَزْمًا:
              (عَابَه) ، كقَرمَه.(وقُزْمَانُ، بالضَّمِّ ابنُ الحَارِثِ العَبْسِيُّ) وَفِي نُسْخَة العَنْسِيُّ: (المُنَافِقُ
              الَّذِي قَالَ فِيهِ رَسولُ اللهِ صَلَّى الله تَعالَى عَلَيه وسَلَّم: " إِنَّ الله لَيُؤَيِّدَ هَذَا الدِّينَ
              بِالرَّجُلِ الفَاجِر "، قُتِلَ يَوْمَ أُحُدٍ، فَقَالَ: مَا أُقَاتِلُ عَلَى دِينٍ، وذَكَرَهُ بعضٌ فِي الصَّحَابَةِ،
              وَهُوَ غَلَطٌ، والمُصَرَّحُ بِهِ فِي شَرْحِ المَوَاهِبِ أَنَّهُ أنْصَارِيُّ من بَنِي ظَفَرٍ. [] ومِمَّا يُسْتَدْرَك
              عَلَيْهِ:شاةٌ قَزَمَةٌ - بِالتَّحْرِيكِ -: رَدِيئَةٌ صَغِيرَةٌ.وغَنَمٌ أَقْزَامٌ: لَا خَيْرَ فِيهَا، وكذَلِك
              رُذَالُ الإِبِلِ.وسُودَدٌ أَقزَمُ: لَيْسَ بقَدِيم، قَالَ العَجَّاجُ:(والسُّودَدُ العَادِيُّ غَيرُ الأقْزَمِ ... )والتَّقَزُّم:
              اقْتِحَامُ الأمُورِ بِشِدَّةٍ.وقُزْمَانُ، بِالضَّمِّ: مَوْضِعٌ.'
