            definitions_text: 'سروالسرْوُ: سَخَاءٌ في مُرُوْءةٍ، سَرَا يَسْرو؛ فهو سَرِيٌّ وهُمْ سَرَاةٌ. والسرَاوَةُ: الفَضْلُ
              والزِّيَادَةُ. وما كانَ الرَّجُلُ سَرِيّاً، ولقد سَرَا وسَرُوَ وسَرِيَ يَسْرى سَرَاءً. وقَوْمٌ أسْرِيَاء وسُرَوَاء.
              وسَرَاةُ كُلِّ شَيْءٍ: ظَهْرُه، والجَميعُ السرَاوَاتُ.وسَرَاةُ النَهَارِ: ارْتِفَاعُه، والطرِيقِ: مُعْظَمُه.
              وسَرَاةُ العِشَاءِ: الوَقْتُ الأولُ من الليْلِ. وسَرَوْتُ الثَوْبَ عن الرجُلِ: إذا كَشَفْتَه.وُيقال: سَرّى وسَرَى
              - مُخَفَّفٌ ومُثَقلٌ -. ويقولون: سارَيْتُه أي كاشَفْته. وسارَيْتُه أمْري: أي خايَرْته.وسَرَوْتُ السَّيْفَ: أي
              اخْتَرَطْته.وظَل يَفْعَلُ كذا سَرَاةَ يَوْمِه: أي عامتَه. والسِّرْوَةُ: سَهْمٌ صَغِيرٌ قَصِيْرٌ، وكذلك السُّرْوَةُ،
              وجَمْعُها سرىً وسِرىً. وسِرَاءٌ - مَمْدوْدٌ -: دُوْدَةٌ في الأرْضِ، يقال: أرْضٌ مَسْرُوة، وقد سرِيَتْ. والسَّرْوُ:
              مَحَلَّةُ حِمْيَرَ. وما ارْتَفَعَ من الأرْضِ. واسْمُ شَجَرٍ مَعْرُوْفٍ.وأسْرى فلانٌ: صارَ إلى السرَاةِ من اليَمَنِ.
              والسَّرَاءُ: شَجَرٌ تُتخَذُ منه القِسِي العَرَبيَّةُ، الواحِدَةُ سَرَاءةٌ.وُيقال لليُسْرُوْعِ: السرْو. وسُرِيَتِ
              الأرْضُ: وَقَعَتْ فيها السِّرْوُ. وسَرْوُ الجَرَادِ: صَوْتُه - غَيْرُ مَهْمُوْزٍ -، إنَّه لَيَسْرُوْ سَرْوَ
              الجَرَادِ.وامْرَأةٌ سَرْوَاءُ: طَوِيْلَةٌ في قِلةِ لَحْمٍ.'
            translation_en: null
