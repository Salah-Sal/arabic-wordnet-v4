          - entry_id: 359558
            dictionary_id: 60
            headword: مسارات اجتماعية واقتصادية مشتركة
            headword_bare: مسارات اجتماعية واقتصادية مشتركة
            headword_norm: مسارات اجتماعية واقتصادية مشتركة
            root: سر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: حاليا، يتم تطوير فكرة المسارات الاجتماعية والاقتصادية المشتركة (ال SSPs) كأساس للانبعاثات الجديدة
              ولسيناريوهات اجتماعية واقتصادية. المسارات الاجتماعية والاقتصادية المشتركة هي جزء من مجموعة من المسارات التي
              تصف آفاق بديلة للتنمية الاجتماعية والاقتصادية في غياب تدخل السياسة المناخية. يمكن لمزيج من سيناريوهات الاجتماعية
              والاقتصادية المعتمدة على المسارات الاجتماعية والاقتصادية المشتركة والإسقاطات المناخية المستندة على مسارات تركيزات
              تمثيلية، أن يوفر إطار تكاملي مفيد لتأثير المناخ وتحليل السياسات.
