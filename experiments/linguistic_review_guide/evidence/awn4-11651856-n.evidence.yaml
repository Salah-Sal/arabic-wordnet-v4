            is_partial: 0
            definitions_text: مواصفات سيارة ركاب مصنوعة من مواد خفيفة للغاية، مع ديناميكية هوائية عالية (مقاومة هواء منخفضة)،
              وتستخدم نظام محرك هجين كهربائي. ويتم تنفيذ التصميم التجديدي (كما هو الحال في السيارات بالمحرك الهجين) والذي
              يحول طاقة الكبح (تضيع عادة) إلى كهرباء ويعيدها مرة أخرى إلى البطارية. إن كل واحدة من هذه الخصائص وحدها يمكن
              أن تعطي تحسين في الكفاءة، وعندما يتم الجمع بين كل هذه الخصائص، فإن الناتج يحقق 3 إلى 5 أضعاف التحسن في الاقتصاد
              في استهلاك الوقود، جنبا إلى جنب مع حفاظ أو تحسن في السلامة والأداء والقدرة على تحمل التكاليف، بالمقارنة مع سيارات
              الركاب التقليدية.
            translation_en: hypercar
            translation_fr: hypercar
            domain: Climate, Environment and Solid Waste management
