          - entry_id: 837990
            dictionary_id: 125
            headword: سرو
            headword_bare: سرو
            headword_norm: سرو
            root: سر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: "باب السين والراء و (وأ يء) معهما س ر و، س ور، ر س و، ور س، س ر ي، س ي ر، ي س ر، س رء، سء ر،\
              \ ء س ر، رء س، ء ر س مستعملات\nسرو: السَّرْوُ: سَخاء في مروءة. سَرُوَ يسرو، وسرا يسرو، وسَرِيَ يَسْرَى، فهو:\
              \ سَرِيٌّ من قومٍ سَراة، ولم يجىء على فَعَلةٍ غيرها. والسَّرِيُّ: النّهرُ فوقَ الجدول، ودونَ الجَعفر. والسّريّة:\
              \ خيل تبلغ أربع مائة أو نحوه. والسُّرْوَةُ: سَهْمٌ صغير قصير، وجمعه: سِراء قال أبو الدُّقَيْش: بل هو السّهم\
              \ ذو القُطْبة والقُطْبةُ: حديدةٌ في رأسِ السَّهم يُرْمى به الهَدَف، قال:\nوقد رمى بسُراهُ اليومَ معتمداً ... في\
              \ المَنكِبَيْنِ وفي السّاقين والرَّقَبه \nوقيل: السُّروةُ: النَّصْل الدّقيق الأَجْرد المدمج مثل المِسَلَّة،\
              \ وجمعه: سَرَوات. وسَرْوُ حِميَر: محلّة حِمْيَر. وسَراةُ كلّ شيء: ظهره، والجميعُ: سَرَوات. وسَراةُ النّهار:\
              \ ارتفاعُه. وسَرْو الأرض: ما انحدرَ من حُزُونة الجبل. وسَروْتُ عنه الثَّوبَ: أي: كَشَفْت، وسَرَّى عنه همَّه،\
              \ بالتّشديد: أي: ألقاه.\nسور: السَّوْرة في الرّأس: تناول الشّراب، والرأسُ يَسُور سَوْراً وسُؤوراً وسُؤراً. وساورتُ\
              \ فُلانا: تناولتُ رأسه. والمِسوَرةُ: مُتَّكأٌ من أَدَم، وجمعُها: المَساوِر. وفلانٌ ذو سَوْرةٍ في الحرب، أي:\
              \ ذو بَطْشٍ شديد. والسُّورُ: حائطُ المدينة، ونحوه. وتسوّرتُ الحائط، وسُرْتُه سَوْراً، قال العجّاج: \nسُرْتُ\
              \ إليه في أعالي السُّورِ\nوالسَّوّار من الكلاب: الذّي يأخُذُ بالرّأس. والسَّوّار: الرّجُلُ الذي يَسُورُ في رأسه\
              \ الشّراب، قال الأخطل: \nوشاربٍ مُرْبحٍ، بالكأس نادمَني ... لا بالحصور ولا فيها بسوار\nأي: بذي عَرْبَدة وخِفّة.\
              \ والسُّوَرُ: جَمْعُ السُّورة. والسِوُّار القلب: سوار المرأة والجميع: أَسوِرة وأساور، والكثير: سُور. والأُسْوار:\
              \ من أَساورة كِسْرَى، أي: قُوّاده.\nرسو: رَسَوْتُ لفلانٍ من هذا الأمر أو الحديث، أي: ذكرت له طَرَفاً منه. ورسوت\
              \ الحديثَ: أحكمته فيما بينَك وبينَ نفسك. ورسا الجبلُ يرسو، إذا ثبت أصله في الأرض. ورست السفينة: انتهت إلى قرار\
              \ الماء، فبقيت لا تسير. والمِرْساةُ: أَنْجَرٌ يُشَدُّ بالحِبال فيُرْسَلُ في البحر فيُمسِك بالسَّفينةَ ويُرسيها\
              \ فلا تَسِيرُ. وألقتِ السَّحابةُ مَراسيَها: ثَبَتَتْ في مَوْضعٍ وجادتْ بالمَطَر، قال سليمان:\nإذا قلت أَكْدَى\
              \ البرقُ أَلْقَى المَراسيا \nوالفَحْلُ من الإبل إذا تفرّق عنه شُوَّله فهَدَرَ بها وراغت إليه وسَكَنَتْ، قيل:\
              \ رسا بها. قال رؤبة: \nإذا اشمَعَلَّتْ سننا رسا بها\nوالمُرْسَى: مصدر من أَرْسَيْت السّفينة. ورَسَتْ قدماه في\
              \ الموقف والحرب، أي: ثبتت. وقِدْرٌ راسيةٌ: لا تَبْرحُ مكانَها، ولا يُستْطاعُ تحويلُها. ورس: الوَرْسَ: صِبغٌ،\
              \ وفِعلُهُ: التَّوْريس. والوارسُ: نَبْتٌ أَصفَرُ كأنّه لَطْخٌ يَخْرج على الرِّمْث بين آخِرِ الشِّتاء، إذ أصاب\
              \ الثَّوْبَ لَوَّنَهُ، وقد أَوْرَسَ الرِّمْثُ فهو مُورسٌ. والوَرْسيُّ من الأَقْداحِ النُّضار: من أجودها.\nسير:\
              \ السَّيْر: معروفٌ.. سار يَسِير سَيْراً ومَسيراً. وسيّرتُ الثّوبَ والسَّهم: جعلت فيهما خطوطاً. والسيراء: برود\
              \ يُخالطها حرير. والسِّيرُ: الشِّراك، والجَمْعُ: سُيُور.\nسري: السُّرَي: سير اللّيل، وكلُّ شيءٍ طرق ليلاً فهو\
              \ سارٍ. سَرَى يسري سُرىً وسَرْياً. والسّاريةُ من السَّحاب: التي تجيء بين الغادية والرّائحة ليلا، والعرب تؤنِّث\
              \ السُّرَى، قال:\nهنّ الغِياثُ إذا تَهَوّلتِ السُّرَى \nوسرى وأسرى، لغتان، وقرىء: سَرَى بعَبْدِهِ ليلاً  . وسَرَى\
              \ به وأَسرَى به سواء. والسّارية: أُسْطُوانة من حجارةٍ أو آجُرّ. وسَرَى عن فلان، أي: تجلّى عنه الغَضَبَ، أو غشيةٌ\
              \ عَرَضتْ له. وسَرَى عِرقُ الشَّجرة يسري في الأرض سَرْياً: دبّ دبيباً فيها ليلاً ونهاراً.\nسرا: سَرَأَتِ الجرادةُ،\
              \ أي: ألقت بَيْضَها. وَسِرْؤُها: بيضُها، وكذلك سِرْءُ السَّمَكة. وما أشبهَهُ من البَيْض فهي سَرُوءٌ، والواحدة\
              \ سِرْأة. وربّما قيل: سَرَأَتِ المرأةُ إذا كَثُر وِلادُها ووَلَدُها، وفي الشِّعْر أحسن. والسِّراءٌ: شًجًرٌ تٌتَّخَذُ\
              \ منه القِسِيُّ العَرَبيّة، الواحدة: سَراءةٌ، قال زُهَير: \nثلاثٌ كأَقْواسِ السَّراء وناشطٌ ... قد اخضرّ من\
              \ لَسِّ الغمير جحافلُهْ\nسار: السّأر من السُّؤْر، [تقول] : أسأر فلانٌ طعامه وشرابه، أي: أَبْقَى منه بقيّةً،\
              \ وبقية كلِّ شَيْءٍ: سؤْرُه، كقول طرفة:  ورأتني سؤر السيوف يقبضن ... يميناً ومَفْرقاً وشمالاً\nوأسأر الحاسب،\
              \ أي: حسب فأَفضَلَ من حِسابه شيئاً، وفي الشِّعْر أجود لقلّة استعماله، قال  :\nفي هجمةٍ يَسْأَر منها الفائض\n\
              أي: يفضلُ الفائض من حساب المائة، لأنّه إذا بلغ إلى تسعة وتسعين لم يقدر على قبض الفضل لتمام المائة. وأسأروا في\
              \ الحوض: [تركوا فيه] بقيّة، قال  :\nجرع الخصيّ سؤرة الثّمائل\nويقال للمرأة إذا جاوزت الشَّباب ولم يَعْدَمْها\
              \ الكِبَر: إنَّ فيها لَسُؤراً، أي: بقيّة، قال  :\n[إزاءُ مَعاشٍ لا يزالُ نِطاقُها] ... من الكَيس فيها سُؤرةٌ\
              \ وهي قاعدُ\nأسر: أَسَرَ فُلانٌ فُلاناً: شدّه وَثاقاً، وهو مأسورٌ. وأُسِرَ بالإِسار، أي: بالرِّباط، والإسِارُ:\
              \ مصدرٌ كالأَسْر. ودابّةٌ مأسورُ المفاصل، أي: شديدُ لامُها، والأَسرُ: قوّة المفاصل والأوصال. وشدّ الله أَسْرَ\
              \ فلان، أي: قوّة خلقه، قال الله عز وجل: وَشَدَدْنا أَسْرَهُمْ  ، وكلُّ شيئين مما يَبينُ طرفاهما فشددت أَحَدَهما\
              \ بالآخر بربِاطٍ واحد فقد أَسَرْتَهما كما يُؤْسَرُ طَرَفا عُرْقُوتَي القَتَب ونحوه، قال الأعشَى: \nوقيّدني الشِّعْرُ\
              \ في بيته ... كما قيّد الآسِراتُ الحِمارا\nوأسرتُ السَّرْج والرَّحلَ: ضَمَمْتَ بعضَه إلى بعضٍ بسُيُور، والسُّيُور\
              \ تسمى: تآسير.\nرأس: رأسُ كلِّ شيء: أعلاه، ثلاثة أرؤس، والجميع: الرؤوس. وفحلٌ أرأس: وهو الضّخم الرأس، وأنا رأسُهم\
              \ ورئيسُهم، وتَرَأَّسْت عليهم ورَأَّسوني على أَنْفُسهم. والرُّؤاس: عِظَم الرأس فوق قدره، وصاحِبُه: رؤاسيٌّ.\
              \ وكلبٌ رَؤوسٌ: يُساوِرُ رأسَ الصَّيد. ورجلٌ رئيسٌ مَرْؤوُس، رأَسه السِّرسام فأخذ برأسه. وسَحابةٌ رائسة: [التي]\
              \ تتقدّم السَّحاب. وبعضٌ يقول: إنّ السَّيْل يَرْأَسُ الغُثاء والقمام رأساً، وهو جمعه إيّاه ثمّ يحتمله، ويُقال:\
              \ أَعطني رأساً من ثُوم. والضَّب ربّما رأس الأَفعَى، وربّما ذَنَبَها، وذلك أنّ الأَفْعَى تأتي جُحْر الضّبِّ فتَحرِشُه\
              \ فيَخْرُجُ أحياناً مُسْتَقَبلَها براسه، فيقال: خَرَجَ مُرَئِّساً، ورُبّما احترشه الرّجل، فيجعل عُوداً في فم\
              \ جُحْره فيحسَبُه أفعَى، فيخرج مُرَئِّسا أو مُذَنِّبا. وفلانٌ يَرْأَسُ الضِّبابَ، أي: يأخذ رُؤوُسَها. ورَأَس\
              \ فلانٌ فلاناً: أصابه بضربةٍ على رأسه. ويقال للقوم، إذا كثروا وعزوا: هم رأس، قال عمرو بن كلثوم: \nبرأسٍ من بني\
              \ جُشَم بن بَكْرٍ ... نَدُقُّ به السُّهُولة والحُزُونا\nأرس:  أَرَسةُ بن مرّ: اسم جبل.\nيسر: يُقالُ: إنّه لَيَسْرٌ،\
              \ خفيف، ويَسَرٌ: أي: ليِّنُ الانقياد، سريع المُتابعة، يُوصَفُ به الإنسانُ والفرس، قال:\nإنّي على تَحَفُّظي ونزري ... أعسرُ\
              \ إن مارستني بعُسْرِ\nويَسَرٌ لمن أراد يسري \nويُقال: إنّ قوائم هذا الفرس ليَسَراتٌ خِفاف، إذا كُنَّ طَوْعَه.\
              \ الواحدةُ: يَسَرة. ورجلٌ أعسرُ يَسَرٌ، وامرأة عَسْراءُ يَسَرةٌ، أي: تعملُ بيديها معاً. واليَسَرةُ: فُرجةُ ما\
              \ بين الأَسِرَّة من أَسرار الرّاحة، يُتَيَمَّنُ بها، وهي من علامات السَّخاء. واليَسارُ: اليَدُ اليُسْرَى. والياسِرُ\
              \ كاليامِنِ، والمَيْسَرةُ كالميمنة، مجراها في التَّصريف واحد. والأَيسارُ: الذّين يجتمعون على الجَزُور في المَيْسِر،\
              \ الواحدُ: يَسَرٌ. واليَسَرُ أيضاً: ضَريبُ القِداح. واليُسْرُ: اليَسار، أي: الغِنَى والسَّعة. وقد يَسَّر فَرَسَه\
              \ فهو مُيَسَّر، أي: مصنوعٌ سَمينٌ. وفرسٌ حَسَنُ التَّيْسُور، أي: حَسَنُ السِّمَن، قال المرّار: \nقد بلوناه على\
              \ عِلاّته ... وعلى التَّيسُور منه والضُّمُرْ\nويقال: خذ ما تَيَسَّر واستَيْسر. وإذا سَهُلت ولادة المرأة قيل:\
              \ أَيْسرت، وأذكرت."
