            is_partial: 0
            definitions_text: |-
              (سَرُوَ) السِّينُ وَالرَّاءُ وَالْحَرْفُ الْمُعْتَلُّ بَابٌ مُتَفَاوِتٌ جِدًّا، لَا تَكَادُ كَلِمَتَانِ مِنْهُ تَجْتَمِعَانِ فِي قِيَاسٍ وَاحِدٍ. فَالسَّرْوُ: سَخَاءٌ فِي مُرُوءَةٍ ; يُقَالُ سَرِيٌّ وَقَدْ سَرُوَ. وَالسَّرْوُ: مَحَلَّةُ حِمْيَرَ. قَالَ ابْنُ مُقْبِلٍ:
              بِسَرْوِ حِمْيَرَ أَبْوَالُ الْبِغَالِ بِهِ ... أَنَّى تَسَدَّيْتِ وَهْنًا ذَلِكَ الْبِينَا
              وَالسَّرْوُ: كَشْفُ الشَّيْءِ عَنِ الشَّيْءِ. سَرَوْتُ عَنِّي الثَّوْبَ أَيْ كَشَفْتُهُ. وَفِي الْحَدِيثِ فِي الْحَسَاءِ: «يَسْرُو عَنْ فُؤَادِ السَّقِيمِ» أَيْ يَكْشِفُ. وَقَالَ ابْنُ هَرْمَةَ:
              سَرَى ثَوْبَهُ عَنْكَ الصِّبَا الْمُتَخَايِلُ ... وَقَرَّبَ لِلْبَيْنِ الْحَبِيبُ الْمُزَايِلُ
              وَلِذَلِكَ يُقَالُ سُرِّيَ عَنْهُ. وَالسِّرْوَةُ: دُوَيْبَّةٌ، يُقَالُ أَرْضٌ مَسْرُوَّةٌ، مِنَ السِّرْوَةِ إِذَا كَثُرَتْ بِالْأَرْضِ. وَالسَّارِيَةُ: الْأُسْطُوَانَةُ. وَالسُّرَى: سَيْرُ اللَّيْلِ، يُقَالُ سَرَيْتُ وَأَسْرَيْتُ. قَالَ:
              أَسْرَتْ إِلَيْكَ وَلَمْ تَكُنْ تَسْرِي وَالسَّرَاءُ: شَجَرٌ. وَسَرَاةُ الشَّيْءِ: ظَهْرُهُ. وَسَرَاةُ النَّهَارِ: ارْتِفَاعُهُ. وَهَذَا الَّذِي ذَكَرْنَاهُ بَعِيدٌ بَعْضُهُ مِنْ بَعْضٍ، فَلِذَلِكَ لَمْ نَحْمِلْهُ عَلَى الْقِيَاسِ.
              وَإِذَا هُمِزَ كَانَ أَبْعَدَ، يُقَالُ سَرَأَتِ الْجَرَادَةُ: أَلْقَتْ بَيْضَهَا. فَإِذَا حَانَ ذَلِكَ مِنْهَا قِيلَ: أَسْرَأَتْ.
