            definitions_text: '[قزم] فيه: كأن يتعود من «القزم»، هو اللؤم والشح، ويروى بالراء - وقد مر. ومنه ح ذم أهل الشام:
              جفاة طغام عبيد «أقزام»، هو جمع قزم، وهو في الأصل مصدر يستوي فيه الواحد وغيره.'
