          - entry_id: 373926
            dictionary_id: 52
            headword: مسار
            headword_bare: مسار
            headword_norm: مسار
            root: سر
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: المقدار الذي تزيد به المسافة بين عجلتي المحور الأمامي ('-'-المسار أو انفراج مقدمة العجلتين الأماميتين)
              عن المسافة بين عجلتي المحور الخلفي. ويُقاس المسار دائماً من حافة الجنط إلى حافة الجنط المُقابل على مستوى ارتفاع
              المحور. ويعمل المسار الإيجابي '+'، الذي يُقصد به (لمّ مقدمة العجلتين الأماميتين)، على منع تباعد العجلتين عن
              بعضهما البعض أثناء السير، وبالتالي تجنب حدوث [رفرفة](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=89615)
              و[بلى](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=89888) العجلات وبلى الإطارات بشكل زائد
              عن الحد، ومنع إجهاد [أعمدة التوجيه](http://www.arabterm.org/index.php?id=3&L=1&tx_3m5techdict_pi1[id]=89608)
              إلى درجة بالغة، وكذلك تجنّب حدوث صعوبات في عملية توجيه السيارة. وبفضل المسار الإيجابي تتوافر للعجلات حتى في
              حالة القيادة في خط مستقيم زاوية ميل وأيضاً قوى جانبية بشكل قصري. ويتم بيان مقدار المسار بمقياس الدقائق الزاوية
              وبالمّليمتر، حيث تتراوح قيم قياس المسار على مستوى القيم التقريبية من 0 إلى + 4 مم (0 حتى + 40°). وتتميز السيارات
              المُزودة بنظام الجر الأمامي بمسار يبلغ 0 في الغالب، وفي أحيان أخرى بمسار سلبي '-'.
            translation_en: toe
            translation_fr: parallélisme [m.], voie [f.]
            domain: Automotive Engineering
            external_id: arabterm:89620
