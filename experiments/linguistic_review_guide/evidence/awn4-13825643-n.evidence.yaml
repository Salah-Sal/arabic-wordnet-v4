                وعلوم الأوائل، ويدع ما يحتاج إليه في دينه من علم القرآن والسنة، وقيل: هو أن يتكلف العالم القول فيما لا يعلمه
                فيجهله ذلك. غ: وقيل: وكالكلام. نه ومنه: فيك "جاهلية" هي الحالة التي عليها العرب قبل الإسلام من الجهل بالله
                والشرائع والمفاخرة بالأنساب والكبر والتجبر ونحوها. ش: و"مجاهل" تضل فيه الأحلام، جمع مجهل أي مفاوز لا أعلام
                يتحير فيها أولو الأحلام.'
