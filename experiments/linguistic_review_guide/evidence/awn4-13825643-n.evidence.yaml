            definitions_text: |-
              تَجَاهَلَنيالجذر: ج هـ ل
              مثال: تَجَاهَلَني فلانالرأي: مرفوضةالسبب: لتعدّي الفعل بنفسه، مع أنه لازم. المعنى: أغفلني
              الصواب والرتبة: -تَجَاهَلَ فلانٌ [فصيحة]-تَجَاهَلَني فلانٌ [فصيحة] التعليق: يصح  استخدام الفعل «تجاهَلَ» لازمًا ومتعديًا، فقد جاء لازمًا في المعاجم بمعنى «أظهر الجهل وليس بجاهل»، وجاء متعديًا بمعنى «جهل» في خطاب لعمرو بن العاص (ض) إلى قائد جيش الروم وذلك قوله: «تجاهلت فضيلتي»، وفي ترجمة مجنون ليلى في الأغاني، كما ورد أيضًا في مجالس ثعلب، ومعجم الأدباء وغيرها.
