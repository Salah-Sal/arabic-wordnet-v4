            definitions_text: |-
              (جَهِلَ) الْجِيمُ وَالْهَاءُ وَاللَّامُ أَصْلَانِ: أَحَدُهُمَا خِلَافُ الْعِلْمِ، وَالْآخَرُ الْخِفَّةُ وَخِلَافُ الطُّمَأْنِينَةِ.
              فَالْأَوَّلُ الْجَهْلُ نَقِيضُ الْعِلْمِ. وَيُقَالُ لِلْمَفَازَةِ الَّتِي لَا عَلَمَ بِهَا مَجْهَلٌ.
              وَالثَّانِي قَوْلُهُمْ لِلْخَشَبَةِ الَّتِي يُحَرَّكُ بِهَا الْجَمْرُ مِجْهَلٌ. وَيُقَالُ اسْتَجْهَلَتِ الرِّيحُ الْغُصْنَ، إِذَا حَرَّكَتْهُ فَاضْطَرَبَ. وَمِنْهُ قَوْلُ النَّابِغَةِ: دَعَاكَ الْهَوَى وَاسْتَجْهَلَتْكَ الْمَنَازِلُ ... وَكَيْفَ تَصَابِي الْمَرْءِ وَالشَّيْبُ شَامِلُ
              وَهُوَ مِنَ الْبَابِ، لِأَنَّ مَعْنَاهُ اسْتَخَفَّتْكَ وَاسْتَفَزَّتْكَ. وَالْمَجْهَلَةُ: الْأَمْرُ الَّذِي يَحْمِلُكَ عَلَى الْجَهْلِ.
