          - entry_id: 818181
            dictionary_id: 118
            headword: تجاهل الْعَارِف
            headword_bare: تجاهل العارف
            headword_norm: تجاهل العارف
            root: جهل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              تجاهل الْعَارِف: وَسَماهُ السكاكي سوق الْمَعْلُوم مساق غَيره لنكتة. وَقَالَ لَا أحب تَسْمِيَته بالتجاهل لوروده فِي كَلَام الله تَعَالَى. وَتلك النُّكْتَة كالتوبيخ وَالْمُبَالغَة فِي الْمَدْح أَو الذَّم. وَالْأول كَمَا فِي قَول امْرَأَة خارجية اسْمهَا ليلى بنت طريف ترثي أخاها.(ايا شجر الخابور مَا لَك مورقا ... كَأَنَّك لم تجزع على ابْن طريف)
              أَي ايا شجر مَوضِع من ديار بكر مَا شَأْنك وَمَا تصنع حَال كونك ذَا ورق كَأَنَّك لَا تحزن على موت ابْن طريف أَي أخي فَهِيَ تعلم أَن الشّجر لم تجزع على ابْن طريف لَكِنَّهَا تجاهلت فاستعملت لفظ كَأَن الدَّال على الشَّك وَبِهَذَا يعلم إِن كَأَن قد لَا يَجِيء للتشبيه بل قد يسْتَعْمل فِي مقَام الشَّك فِي الحكم.
            translation_en: null
            translation_fr: null
            domain: null
