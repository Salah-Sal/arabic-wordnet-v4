                &c., (S,) [The time, or state, of ignorance, or paganism; or of intense ignorance;] the time of the فَتْرَة [or cessation of the mission of apostles, and of the effacement of the signs of their religion]. (JK.) One says, كَانَ ذٰلِكَ فِى الجَاهِلِيَّةِ الجَهْلَآءِ [That was in the time, or state, of paganism, or of intense ignorance]. (S.) مَجْهَلٌ An affair, or an event, or a case, and a land, and a habit, a property, a quality, a practice, or an action, that induces a man to believe a thing to be different from what it is. (Er-Rághib, TA.) A desert (مَفَازَةٌ) in which are no signs of the way. (S.) And أَرْضٌ مَجْهَلٌ A land in which are no signs of the way: (TA:) or in which one will not go aright (K, TA) unless by means of the [signs of the way called] آرَام: (TA:) pl. مَجَاهِلُ, which is the contr. of مَعَالِمُ: (TA:) accord. to the K, it has neither dual nor pl.; but it has both, as 'Iyád and others have affirmed. (MF, TA.) مِجْهَلٌ: see جَيْهَلَةٌ.
                مَجْهَلَةٌ [A cause of, or an incitement to, ignorant, silly, foolish, or wrong, conduct;] a thing that incites one to الجَهْل. (S, K.) Hence the saying, الوَلَدُ مَجْهَلَةٌ [Children are a cause of silly, or foolish, conduct]. (S.) مِجْهَلَةٌ: see جَيْهَلَةٌ.
                مِجْهَالٌ (tropical:)  A she-camel light, brisk, or agile, in her pace, or going. (TA.) مَجْهُولٌ [Unknown]. You say, رَكِبْتُ المَفَازَةٌ عَلَى مَجْهُولِهَا [I ventured upon traversing the desert notwithstanding its unknown character]. (S, TA.) b2:  [A man of unknown origin. A book of unknown authorship. b3:  In grammar, The passive voice.] b4:  نَاقَةٌ مَجْهُولَةٌ (tropical:)  A she-camel that has never been milked: or that has no brand upon her: (K, TA:) and (tropical:)  a she-camel that has never conceived. (Z, TA.) مُسْتَجْهِلٌ Making himself like the جَاهِل [or ignorant; feigning himself ignorant]: or reckoning, or esteeming, جَاهِل. (Har p. 572.)
