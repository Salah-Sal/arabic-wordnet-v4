    - entry_id: 820073
      dictionary_id: 119
      headword: الصّيغة
      headword_bare: الصيغة
      headword_norm: الصيغة
      root: صغ
      root_source: camel
      pos: null
      form: null
      is_partial: 0
      definitions_text: 'الصّيغة:[في الانكليزية] Grammatical form [ في الفرنسية] Forme grammaticale بالكسر عند أهل العربية
        هي الهيئة الحاصلة من ترتيب الحروف وحركاتها وسكناتها كما في شرح المطالع في بحث الألفاظ. وقيل هي واللغة مترادفان والأقرب
        أن يقال: الصّيغة هي الهيئة المذكورة واللغة هي اللفظ الموضوع كما في التلويح في تقسيم نظم القرآن وقد ورد في بعض كتب
        الصّرف أنّ الصيغة اسم بمعنى مصوغ. ومصوغ اسم مشتقّ من صياغ أو صوغ.وصوغ وصياغ بحسب اللغة هو إلقاء الذهب في البوتقة.
        والآن يطلق على كلّ شيء ملقى. ويقال لهذا منقول عرفا. وأمّا وجه إطلاق الصيغة على الأفعال فهو أنّه كلما صدر فعل من فاعل
        فحينئذ يقال: ذلك الفعل ملقى (صادر) من ذلك الفاعل، وهذا هو المراد عند أهل الصرف ضرب: ذلك الرجل في الزمن الماضي صيغة
        الواحد المذكر الغائب. يعني: هذا الضرب في الزمان الماضي فعل الفاعل. وأمّا في الاصطلاح: فهي الهيئة الحاصلة لكلّ لفظ
        من الحركات والسّكنات ومن عدد الحروف عند الوضع، والمقصود في هذا الفن أي فنّ الصّرف المنقول العرفي وليس المنقول الاصطلاحي.
        انتهى كلامهوصيغ الأداء عند المحدّثين صيغ يروى بها الحديث مثل حدّثنا وأخبرنا وقال ونحوها.'
