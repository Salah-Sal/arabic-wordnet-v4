            d.name_ar         AS dict_name_ar,
            ex.idx,
            ex.type,
            ex.text           AS example_text,
            ex.attribution
        FROM examples ex
        JOIN entries e ON ex.entry_id = e.id
        JOIN dictionaries d ON e.dictionary_id = d.id
        WHERE e.headword_norm IN (?1, ?2)
        ORDER BY
            CASE ex.type
                WHEN 'quran'   THEN 1
                WHEN 'hadith'  THEN 2
                WHEN 'poetry'  THEN 3
                WHEN 'prose'   THEN 4
                WHEN 'usage'   THEN 5
                ELSE 6
            END,
            ex.idx;
      query_params: *id001
      result_count: 0
      examples: []
