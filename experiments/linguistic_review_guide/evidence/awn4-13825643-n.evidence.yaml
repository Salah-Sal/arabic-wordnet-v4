        definitions_text: |-
          نوبنابَ1/ نابَ إلى يَنُوب، نُبْ، نَوْبًا، فهو نَائِب، والمفعول مَنُوب إليه• نابَ الشّيءُ: قَرُبَ "ناب فصلُ الرَّبيع".• ناب النَّحلُ إلى الخلايا: رجع إليها واعتادها.• ناب إلى الله: تاب ولزم طاعتَه. 
          نابَ2 يَنُوب، نُبْ، نَوْبًا ونَوْبَةً، فهو نَائِب، والمفعول مَنُوب• نابَه أمرٌ: أصابه، نزل به "نابه مكروهٌ- نَوْبة قلبيّة/ عصبيَّة- وإن ناب خَطْبٌ، أو ألمّت مصيبةٌ ... جعلتُ لهم نفسي وما ملكت فدًى". 
          نابَ عن يَنُوب، نُبْ، نِيابَةً، فهو نَائِب، والمفعول منوبٌ عنه• ناب الوكيلُ عن المدير: قام مقامه "ناب المرشّحُ عن منطقته- تسلّم جائزةً بالنِّيابة عن صاحبها: بالوكالة عنه- ناب عنه رسميًّا/ قانونيًّا". 
          أنابَ/ أنابَ إلى/ أنابَ عن يُنيب، أَنِبْ، إنابةً، فهو مُنِيب، والمفعول مُنَاب• أناب رجلاً/ أناب عنه رجلاً في المصنع: أقامه مقامه وجعله نائبًا عنه "أناب المديرُ العامُّ وكيلَه في المؤتمر- إنابات قضائيَّة".• أناب الشَّخصُ إلى النَّادي: رجع إليه مرّة بعد مرّة "أناب المهاجِرُ إلى وطنه".• أناب الشَّخصُ إلى الله: ناب إليه، تاب ورجع " {وَخَرَّ رَاكِعًا وَأَنَابَ} - {إِنَّ فِي ذَلِكَ لَآيَةً لِكُلِّ عَبْدٍ مُنِيبٍ}: راجع إلى ربِّه". 
          استنابَ يستنيب، اسْتَنِبْ، استِنابَةً، فهو مُستنيب، والمفعول مُستناب• استنابَ الرَّجلَ: أنابه؛ أقامه مقامه "استناب المديرُ أحدَ موظَّفيه لحضور الاجتماع مكانه". 
          انتابَ يَنتاب، انْتَبْ، انتيابًا، فهو مُنتاب، والمفعول مُنتاب• انتابه أمرٌ: أصابه وألمّ به "انتابه الفزعُ/ الاكتئابُ/ الضَّحكُ/ المرضُ".• انتاب صديقَه: قصده مرَّةً بعد مَرَّة "فلانٌ ينتابُنا- تنتاب السِّباعُ المنهلَ". 
          تناوبَ/ تناوبَ على يتناوب، تَناوُبًا، فهو مُتناوِب، والمفعول مُتناوَب• تناوب الأمرَ: قام به مرَّةً بعد مرَّة "تناوب زيارةَ صديقه- بشكل متناوب" ° بالتَّناوب: بالتبادل- سِباق التَّناوب: سباق بين فريقين أو أكثر حيث يركض كلُّ فرد من الفريق إلى مسافة معيّنة ثمّ يكمل فرد آخر السِّباق- طاقم التَّناوب: طاقم من العمال يُريحون طاقما آخر.• تناوب الجندُ حراسةَ الثُّكنة/ تناوب الجندُ على حراسة الثُّكنة: تداولوه بينهم وتقاسموه "تناوبوا الأمنَ في المنطقة البتروليّة".• تناوبته الهمومُ: أصابته، تعاقبت عليه "تناوبته المصائبُ". 
          ناوبَ يناوب، مناوبةً، فهو مُناوِب، والمفعول مُناوَب• ناوبه في الشّيء أو الأمر: قاسمه فيه وتداوله معه بالنَّوْبة "ناوبتِ المرأةُ زوجَها في مرافقة أطفالها إلى المدرسة". 
          نوَّبَ ينوِّب، تَنوِيبًا، فهو مُنوِّب، والمفعول مُنَوَّب• نوَّبه في الاجتماع: جعله نائبًا عنه "نوّبه في حراسة المصنع". 
          إنابَة [مفرد]:1 - مصدر أنابَ/ أنابَ إلى/ أنابَ عن.2 - (قن) قيام شخص بتنفيذ التزامٍ إزاءَ شخصٍ آخر بتفويضٍ من ثالث. 
          استنابة [مفرد]:1 - مصدر استنابَ.2 - (قن) تكليف سلطة قضائيّة مختصّة سلطةً إداريّة أو قضائيّة أخرى القيامَ ببعض الأعمال كالتّحقيق أو الاستماع إلى الشُّهود أو اليمين. 
          مَنَاب [مفرد]: مقامٌ "قام منابَ القاضي". 
          مُناوَبَة [مفرد]:1 - مصدر ناوبَ.2 - تتابع "مناوبة الرَّأي" ° بالمناوبة: بالدَّوْر، بالتَّتابع الواحد بعد الآخر- فرقة إطفاء النَّار بالمناوبة: صفّ من الأشخاص المشكَّلين لمحاربة النِّيران بتمرير دلاء الماء من مصدر ما إلى النِّيران لإطفائها.3 - فترة زمنيَّة تقسَّم خلالها مهامّ أفراد طاقم السَّفينة في الخدمة كلّ في فترته المحدّدة. 
          نائب [مفرد]: ج نائبون ونُوَّاب، مؤ نائبة، ج مؤ نائبات ونوائبُ (لغير العاقل):1 - اسم فاعل من نابَ عن ونابَ1/ نابَ إلى ونابَ2 ° النَّائب العامّ: مُمثِّل النِّيابة العامّة.2 - مَن يمثِّل الشّعبَ في السُّلطة التَّشريعيّة أو البرلمان "نائب في البرلمان- فلانة نائب/ نائبة في مجلس الشّعب" ° مجلس النُّوَّاب: مجلس الشّعب، البرلمان- مَجْلِس النوّاب الأدنى: واقع ما دون الآخرين.• نائب الفاعل: (نح) اسم صريح أو مُؤوَّل تقدَّمه فعل مبنيٌّ للمجهول وناب عن الفاعل بعد حذفه. 
          نائِبَة [مفرد]: ج نائبات ونوائبُ (لغير العاقل):1 - صيغة المؤنَّث لفاعل نابَ عن ونابَ1/ نابَ إلى ونابَ2: "نائبة في البرلمان".2 - مصيبة شديدة، ما ينزل بالمرء من الكوارث والحوادث المؤلمة "أخوك سيفُك إن نابتك نائِبَة [مثل]: للحثّ على المحافظة على الأخوّة والصَّداقة- لا تجزعنّ إذا نابتك نائبة ... واصبر ففي الصَّبر عند الضِّيق مُتَّسعُ" ° نوائب الدَّهر: ما ينزل بالناس من مصائب ومضرّات.• الحمّى النَّائبة: الحمّى التي تنوب الإنسانَ كلّ يوم. 
          نَوْب [مفرد]: مصدر نابَ1/ نابَ إلى ونابَ2. 
          نَوْبَة [مفرد]: ج نَوَبات (لغير المصدر {ونَوْبات} لغير المصدر) ونُوَب (لغير المصدر):1 - مصدر نابَ2.2 - اسم مرَّة من نابَ عن ونابَ1/ نابَ إلى ونابَ2 ° على نَوْبات: على دَفْعات.3 - وقتُ المناوبة "نوبةُ الحارس/ المطر" ° نوبة نهاريّة: مجموعة الموظفين أو العمّال الذين يقومون بالعمل في الفترة الصباحيّة.4 - نازلة، نوبة مفاجئة مثل شلل الأطفال أو ضربة الشّمس "اعترته نوبةٌ عصبيّة- نوبات الغضب: انفجاراته- نوبة جنون".5 - (طب) زمانُ أخذ الحُمّى "جاءته نوبتُه" ° أصبح لا نوبةَ له/ خسِر نوبتَه: فاتَتْه الفرصةُ.• نَوْبة قلبيَّة: (طب) الإصابة بالجلطة التي تسدُّ مجرى الشّرايين التي تغذِّي القلب بالدّم فتعجز عضلاتُ القلب عن العمل، وأعراضها آلامٌ في الصَّدر، وكثرة العرق، والقيء. 
          نُوبَة [مفرد]: ج نُوبات ونُوَب: نائبة، نازلة أو مصيبة "نُوَب الدهر". 
          نيابة [مفرد]:1 - مصدر نابَ عن ° بالنِّيابة عن فلان: باسم فلان.2 - مهنة النَّائب الذي يُنتخَب ممثِّلاً للشَّعب في السُّلطة التَّشريعيّة "دامت نيابتُه خمس سنوات في البرلمان".3 - (قن) هيئة تنوب عن المجتمع فتنطق بلسانه وتقيم الدَّعوى على متّهم ونحوه نيابةً عنه، ويمثّلها النّائب العام ووُكلاؤه "مرشّح للنِّيابة" ° رئيس النِّيابة.4 - اسم من المناوبة.5 - سلطة أو تفويض يمنحه النَّاخبون السِّياسيُّون إلى ممثِّليهم.• وكيل النِّيابة: (قن) المدَّعي العام؛ المحامي الذي يرافع بالقضايا نيابة عن الحكومة. 
