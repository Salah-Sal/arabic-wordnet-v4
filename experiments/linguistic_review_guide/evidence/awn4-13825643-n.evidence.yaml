          - entry_id: 857595
            dictionary_id: 130
            headword: جهل
            headword_bare: جهل
            headword_norm: جهل
            root: جهل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: |-
              جهـلجهِلَ/ جهِلَ بـ يَجهَل، جَهْلاً وجَهالةً، فهو جاهِل، والمفعول مجهول (للمتعدِّي)• جهِل الشَّخْصُ: جفا وتسافه وحمُق وأظهر الطيشَ "لا يستوي عالِمٌ وجهول- ألا لا يجهلَن أحَدٌ علينا ... فنجهل فوق جهل الجاهلينا- {قَالَ أَعُوذُ بِاللهِ أَنْ أَكُونَ مِنَ الْجَاهِلِينَ} " ° جهِلَ عليه: تصرَّف معه بحمق.• جهِل حقيقةَ الشَّيء/ جهِل بحقيقة الشَّيء: لم يعلم به، لم يعرفه "كثير من الناس يجهلون أمورَ دينهم- جهِل بمعرفة القانون- {فَتَبَيَّنُوا أَنْ تُصِيبُوا قَوْمًا بِجَهَالَةٍ} ". 
              استجهلَ يستجهل، استجهالاً، فهو مُستجهِل، والمفعول مُستجهَل• استجهل الشَّخصَ: عدّه أو وجده جاهلاً "كلُّ مَنْ استَخفّك فقد استجهلك". 
              تجاهلَ يتجاهل، تجاهلاً، فهو مُتجاهِل، والمفعول مُتجاهَل (للمتعدِّي)• تجاهل الشَّخْصُ: تظاهر بالجهل، أظهر أنّه جاهل وليس به "ألقى علىّ اللّومَ مُتجاهلاً- *تجاهلتُ حتى قيلَ إنِّي جاهل*".• تجاهل صديقَه في الحفل: أهمله، أغفله ولم يُعْطِه اهتمامًا "يُكثر اليهود من بناء المستوطنات متجاهلين حقوق الفلسطينيين". 
              جهَّلَ يجهِّل، تجهيلاً، فهو مجهِّل، والمفعول مجهَّل• جهَّل الشَّخْصَ:1 - نسبه إلى الجهل، أو رماه به "كان يجهِّل كلَّ من خالفه الرأيَ".2 - أوقعه في الجهل "قلّة تجاربه في الحياة جهَّلته بأمورها". 
              جاهِل [مفرد]: ج جاهلون وجُهَلاءُ وجَهَلة وجُهّال وجُهَّل، مؤ جاهلة، ج مؤ جاهلات وجواهلُ: اسم فاعل من جهِلَ/ جهِلَ بـ. 
              جاهليّ [مفرد]:1 - اسم منسوب إلى جاهِل: "مجتمع جاهليّ".2 - منسوب إلى عصر ما قبل الإسلام في تاريخ العرب "شاعر جاهليّ" ° الشِّعر الجاهليّ: الشِّعر العربيّ قبل الإسلام- العصر الجاهليّ: عصر ماقبل الإسلام. 
              جاهليَّة [مفرد]:1 - اسم مؤنَّث منسوب إلى جاهِل.2 - مصدر صناعيّ من جاهِل: ما كان عليه العرب قبل الإسلام من الجهالة والضَّلالة وتحكيم العصبيّة والوثنيّة " {إِذْ جَعَلَ الَّذِينَ كَفَرُوا فِي قُلُوبِهِمُ الْحَمِيَّةَ حَمِيَّةَ الْجَاهِلِيَّةِ} " ° جاهليّةٌ جَهْلاء: ممعنة في الجهالة والضلال. 
              جَهَالَة [مفرد]: مصدر جهِلَ/ جهِلَ بـ. 
              جَهْل [مفرد]:1 - مصدر جهِلَ/ جهِلَ بـ.2 - خلاف معرفة "لا يزال الجهل منتشرًا في كثير من قرى مصر".3 - (سف) اعتقاد الشَّيء على خلاف ما هو عليه ° جهل بسيط: تعبير أُطلق على من يسلِّم بجهله- جَهْلٌ مُركَّب: تعبير أطلق على من لا يسلِّم بجهله، ويدَّعي ما لا يعلم. 
              جَهول [مفرد]: ج جهولون وجُهُل وجُهَلاءُ: صيغة مبالغة من جهِلَ/ جهِلَ بـ: "*فليس سواءً عالمٌ وجَهُول*" ° لا يَنْتَصف حليمٌ من جهول [مثل]: يُضْرب في غلبة الجهول للحليم؛ لأنّ الجاهل يُزيد عليه في المهاترة والحليم يربَأ بنفسه عن مغالبته في السَّفاهة. 
              مَجاهِلُ [جمع]: مف مَجْهَل ومَجهلة: أرض يضلّ فيها الإنسان ولا يهتدي "تاه في مجاهل الأرض" ° أَرْضٌ مَجْهَل: لا يُهتدى فيها- مجاهل إفريقيا: مالم يكتشفْ من مناطقها. 
              مجهول [مفرد]: ج مجهولون ومجاهيلُ (لغير العاقل)، مؤ مجهولة، ج مؤ مجهولات ومجاهيلُ: اسم مفعول من جهِلَ/ جهِلَ بـ ° الجنديّ المجهول: جندي استُشهد ودُفن مجهول الهويّة يُستخدم قبره رمزًا لأمثاله من الجنود.• الفِعْل المَبْنِيّ للمجهول: (نح) الفعل الذي يحذف فاعلُه لغرض ما ويأتي المفعول به نائبًا عنه، ويضمّ أوّله ويكسر ما قبل آخره إذا كان ماضيًا، أو يضمّ أوّله ويفتح ما قبل آخره إن كان مضارعًا.
