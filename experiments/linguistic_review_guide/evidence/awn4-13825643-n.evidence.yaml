      - entry_id: 820188
        dictionary_id: 119
        headword: العدل
        headword_bare: العدل
        headword_norm: العدل
        root: عدل
        root_source: camel
        pos: null
        form: null
        is_partial: 0
        definitions_text: العدل:[في الانكليزية] Equity ،divine justice [ في الفرنسية] Equite ،justice divine بالفتح والسكون
          عند أهل الشرع نعت من العدالة ويسمّى عادلا أيضا، وقد عرفت العدالة.وعند الشيعة هو تنزيه البارئ تعالى عن فعل القبيح
          والإخلال بالواجب. قالوا هو يفعل لغرض لاستلزام نفي الغرض العبث وهو قبيح وهو منزّه عنه ويجب عليه اللّطف ويجب عليه
          عوض الآلام الصادرة عنه إذ عدم الوجوب يستلزم القبح على ما بيّن في كتبهم. وعند النحاة هو خروج الاسم عن صيغته الأصلية
          تحقيقا أو تقديرا إلى صيغة أخرى، كذا ذكر ابن الحاجب في الكافية. فالعدل مصدر مبني للمجهول أي كون الاسم معدولا، ولذا
          فسّر بالخروج دون الإخراج. والمراد بالخروج الخروج الحاصل بسبب الإخراج أي كونه مخرجا وبقيد الاسم خرج خروج الفعل إذ
          لا يسمّى عدلا. والمراد خروج مادة الاسم إذ لا يتصوّر خروج الكلّ أي الاسم الذي هو عبارة عن المادة والصيغة عن جزئه
          الذي هو الصيغة.والمراد بالصيغة الصورة حقيقة أو حكما بأن تكون لازمة للكلمة كالصورة، فإنّ أحد الأمور الثلاثة لازم
          لأفعل التفضيل، فكان اللازم بمنزلة الصورة للكلمة فلا يخرج نحو أخر فإنّه معدول عن الأخر أو أخر من بمعنى الجماعة، وكذا
          سحر فإنّه معدول عن السّحر لأنّ الألف واللام في المفرد الذي صار علما بالغلبة لازمة له بمنزلة الصورة، ولا يراد مطلق
          الصورة بل الصورة الأصلية أي التي يقتضي الأصل، والقاعدة أن يكون ذلك الاسم عليها. ثم المراد بالخروج الخروج النحوي
          أي ما يبحث عنه في النحو بدليل أنّ العدل من مصطلحات النحاة فخرج المشتقات كلها، ولا يرد المصدر الميمي أيضا بل خرج
          التغيرات التصريفية بأسرها قياسية أو شاذّة، لكنه بقي الترخيم والتقدير، ثم خرج الترخيم بقوله خروج مادة الاسم لأنّه
          تغيّر المادة لا خروجها عن الصيغة وخرج التقدير ونحوه لعدم دخول المقدّر في الصيغة فلا يصدق عليه خروجه عن صيغته الأصلية،
          أو المراد الخروج التصريفي لا لمعنى ولا لتخفيف، فلا يرد التغيّرات التصريفية بأسرها قياسية أو شاذة، وكذلك الترخيم
          والتصغير ونحوهما. وأما نحو يوم الجمعة في صمت يوم الجمعة فليس بمعدول لعدم كون في داخلة في الصيغة لجواز الفصل بالحرف
          الزائد، بخلاف لام التعريف، ولا متضمّن لأنّ معنى في يفهم بتقديرها لا بنفس قوله يوم الجمعة، ونحو لا رجل متضمّن للحرف
          لا معدول وأخر معدول لا متضمن وأمس معدول ومتضمن لدخول اللام في الصيغة، وبقاء معنى التعريف بعد العدل. فبين العدل والتضمّن
          عموم من وجه ثم إنّا نعلم قطعا أنّهم لما وجدوا ثلاث ومثلّث وأخر وجمع وعمر غير منصرفات ولم يجدوا فيها سببا ظاهرا غير
          الوصفية أو العلمية احتاجوا إلى اعتبار سبب آخر، ولم يصلح للاعتبار إلّا العدل فاعتبروه وجعلوها غير منصرفات للعدل وسبب
          آخر، ولكن لا بدّ في اعتبار العدل من أمرين:أحدهما وجود أصل الاسم المعدول وثانيهما اعتبار إخراجه عن ذلك الأصل إذ لا
          تتحقّق الفرعية بدون اعتبار ذلك الإخراج. ففي بعض تلك الأمثلة يوجد دليل غير منع الصّرف على وجود الأصل المعدول عنه
          فوجوده محقّق بلا شكّ، وفي بعضها لا دليل يوجد عليه إلّا منع الصّرف فيفرض له أصل ليتحقّق العدل بإخراجه عن ذلك الأصل،
          فانقسم العدل إلى التحقيقي والتقديري. فقوله تحقيقا معناه خروجا كائنا عن أصل محقّق يدلّ عليه دليل غير منع الصّرف.وقوله
          تقديرا معناه خروجا كائنا عن أصل مقدّر مفروض يكون الداعي إلى تقديره منع الصّرف لا غير. فأشار بهذا القول إلى تقسيم
          العدل إلى هذين القسمين، وليس هذا القول داخلا في التعريف، مثال التحقيقي ثلاث ومثلّث والدليل على أنّ أصلهما ثلاثة
          ثلاثة عدلا عنه هو أنّ في معناهما تكرارا دون لفظهما، والأصل أنّه إذا كان المعنى مكرّرا كان اللفظ أيضا مكرّرا كما
          في جاءني القوم ثلاثة ثلاثة. ومثال التقديري عمر وزفر عدلا عن عامر وزافر فإنّهما لمّا وجدا غير منصرفين ولم يوجد سبب
          منع صرفهما ظاهرا إلّا العلمية اعتبر العدل، ولما كان اعتباره موقوفا على وجود أصل ولم يكن فيهما دليل على وجوده غير
          منع الصّرف قدّر أنّ أصلهما عامر وزافر، هكذا يستفاد من شروح الكافية.
