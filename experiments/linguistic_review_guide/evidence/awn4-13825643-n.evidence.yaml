            definitions_text: '(جَهِلَ)(هـ) فِيهِ «إِنَّكُمْ لتُجَهِّلُون، وتُبَخِّلُون، وَتُجَبِّنُونَ» أَيْ تَحْمِلُون الْآبَاءَ
              عَلَى الجَهْل حفْظاً لقُلُوبِهم. وَقَدْ تَقَدَّمَ فِي حَرْفِ الْبَاءِ وَالْجِيمِ.(هـ) وَمِنْهُ الْحَدِيثُ «مَنِ
              اسْتَجْهَل مُؤمِنا فعَلَيْه إثْمُه» أَيْ مَنْ حَمَله عَلَى شَيْءٍ لَيْسَ مِنْ خُلُقِه فيغْضِبه فَإِنَّمَا إثْمه
              عَلَى مَنْ أحْوَجَه إِلَى ذَلِكَ.وَمِنْهُ حديث الإنك «ولكِن اجْتَهَلْته الْحَمِيَّةُ» أَيْ حَمَلَتْه الأنَفَة
              وَالْغَضَبُ عَلَى الجَهْل.هَكَذَا جَاءَ فِي رِوَايَةٍ.وَمِنْهُ الْحَدِيثُ «إِنَّ مِنَ العِلْم جَهْلًا» قِيلَ:
              هُوَ أَنْ يتَعَلَّم مَا لَا حَاجَةَ إِلَيْهِ كالنُّجوم وعُلُوم الْأَوَائِلِ، ويَدَع مَا يَحْتاج إِلَيْهِ فِي
              دِينه مِنْ عِلم الْقُرْآنِ والسُّنّة. وَقِيلَ: هُوَ أَنْ يَتَكَلّف العالمُ القَولَ فِيمَا لَا يَعْلَمه فيُجَهِّله
              ذلك. وَمِنْهُ الْحَدِيثُ «إِنَّكَ امْرُؤ فِيكَ جَاهِلِيَّة» قَدْ تَكَرَّرَ ذِكْرُهَا فِي الْحَدِيثِ، وَهِيَ
              الْحَالُ الَّتي كَانَتْ عَلَيْهَا الْعَرَبُ قَبْلَ الْإِسْلَامِ؛ مِنَ الجَهْل بِاللَّهِ ورَسُوله وَشَرَائِعِ
              الدِّين، والمفاخَرة بِالْأَنْسَابِ والكِبْرِ والتَّجَبُّر وَغَيْرِ ذَلِكَ.'
