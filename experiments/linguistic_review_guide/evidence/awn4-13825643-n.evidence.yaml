          - entry_id: 840033
            dictionary_id: 127
            headword: جهل
            headword_bare: جهل
            headword_norm: جهل
            root: جهل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'جهلالجهل على ثلاثة أضرب:- الأول: وهو خلوّ النفس من العلم، هذا هو الأصل، وقد جعل ذلك بعض المتكلمين
              معنى مقتضيا للأفعال الخارجة عن النظام، كما جعل العلم معنى مقتضيا للأفعال الجارية على النظام.- والثاني: اعتقاد
              الشيء بخلاف ما هو عليه.- والثالث: فعل الشيء بخلاف ما حقّه أن يفعل، سواء اعتقد فيه اعتقادا صحيحا أو فاسدا، كمن
              يترك الصلاة متعمدا، وعلى ذلك قوله تعالى: قالُوا: أَتَتَّخِذُنا هُزُواً؟ قالَ: أَعُوذُ بِاللَّهِ أَنْ أَكُونَ
              مِنَ الْجاهِلِينَ[البقرة/ 67] ، فجعل فعل الهزو جهلا، وقال عزّ وجلّ: فَتَبَيَّنُوا أَنْ تُصِيبُوا قَوْماً بِجَهالَةٍ[الحجرات/
              6] .والجاهل تارة يذكر على سبيل الذم، وهو الأكثر، وتارة لا على سبيل الذم، نحو:يَحْسَبُهُمُ الْجاهِلُ أَغْنِياءَ
              مِنَ التَّعَفُّفِ [البقرة/ 273] ، أي: من لا يعرف حالهم، وليس يعني المتخصص بالجهل المذموم، والمَجْهل: الأمر والأرض
              والخصلة التي تحمل الإنسان على الاعتقاد بالشيء خلاف ما هو عليه، واستجهلت الرّيح الغصن: حرّكته، كأنها حملته على
              تعاطي الجهل، وذلك استعارة حسنة.'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:31:269
