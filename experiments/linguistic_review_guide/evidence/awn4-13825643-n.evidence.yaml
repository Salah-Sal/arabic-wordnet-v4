            is_partial: 0
            definitions_text: 'جهـلجَهِلَه، كسَمِعَه، جَهْلاً وجَهالَةً: ضِدُّ عَلِمَهُ. وَقَالَ الحَرالِيّ: الجَهْلُ: التَّقدُّمُ
              فِي الأُمور المُنْبَهِمَةِ بِغَير عِلْمٍ. وَقَالَ الراغِبُ: الجَهْلُ علَى ثلاثَةِ أَضْرُبٍ: الأول: هُوَ خُلُوُّ
              النَّفْسِ مِن العِلْم، وَهَذَا هُوَ الأصلُ، وَقد جَعل ذَلِك بعضُ المُتكلِّمين معنى مُقتضِياً للأفعال الخارِجةِ
              عَن النِّظام، كَمَا جَعَل العِلْمَ معنى مقتضياً للأفعال الجارِية علَى النِّظام. وَالثَّانِي: اعتقادُ الشَّيْء
              بخِلافِ مَا هُوَ عَلَيْهِ.وَالثَّالِث: فِعْلُ الشَّيْء بِخِلَاف مَا حَقه أَن يُفْعَلَ، سواءٌ اعتُقِد فِيهِ اعتِقاداً
              صَحِيحا أم فاسِداً، كتارِكِ الصَّلاةِ عَمداً. وعَلى ذَلِك قولُه تَعَالَى: أَتتخِذُنَا هُزُواً قَالَ أَعُوذُ
              بِاللهِ أَنْ أَكُونَ مِنَ الْجَاهِلِينَ فجَعل فِعلَ الهُزُؤِ جَهلاً. وقولُه تَعَالَى: فَتَبيّنُوا أَنْ تُصِيبُوا
              قَوماً بِجَهَالَةٍ. والجاهِلُ يُذْكَر تارَةً على سَبيلِ الذّمِّ، وَهُوَ الأكثَرُ، وتارَةً لَا علَى سَبيلِه،
              نَحْو: يَحْسَبُهُمُ الْجَاهِلُ أَغْنِيَاءَ أَي مَن لَا يَعرِفُ حالَهم. انْتهى. قلت: والجَهْلُ عَلَى قِسمين:
              بَسِيطٍ ومُرَكَّب، فالبَسِيطُ: عَدَمُ العِلْمِ عمّا مِن شأنِه أَن يُعْلَمَ، والمُركَّب: اعتِقادٌ جازمٌ غيرُ
              مُطابِقٍ للواقِع، قَالَه ابنُ الكَمال. وَقَالَ العَضُد: أصحابُ الجَهلِ البَسِيطِ كالأَنْعام، لفَقْدِهم مَا بِهِ
              يمتازُ الإنسانُ عَنْهَا، بل هم أَضَلُّ لتَوجُّهِها نحوَ كمالاتِها، ويُعالَجُ بمُلازَمةِ العُلماء ليَظْهَر لَهُ
              نَقصُه عندَ مُحاوراتِهم. والجَهْلُ المُركَّبُ إِن قَبِلَ العِلَاجَ، فبمُلازَمَةِ الرياضاتِ، ليَطْعَمَ لَذَّةَ
              اليَقِين، ثمَّ التَّنبيهِ على مُقَدِّمةٍ مُقَدِّمةٍ بالتَّدْريج. وَقَالَ شَمِرٌ: المعروفُ مِن كَلام العَرَب:
              جَهِلْتُ الشَّيْء: إِذا لم تَعْرِفْه، تَقول: مِثْلِي لَا يَجْهَلُ مِثْلَك، وأمّا قولُه تَعَالَى: إِنِّي أَعِظُكَ
              أَنْ تَكُونَ مِنَ الْجَاهِلِينَ فَإِنَّهُ مِن قولِك: جَهِلَ فُلانٌ رأْيَه. جَهِل علَيه: أظْهَر الجَهْلَ، كتجَاهَلَ
              أَرَى مِن نَفسِه أَنه جاهِلٌ. وَهُوَ جاهِلٌ وجَهُولٌ، ج: جُهْلٌ بالضّمّ، وبضمَّتين، وكَرُكَّعٍ، وجُهّالٌ كرُمّانٍ.
              وجهَلاءُ، وَهُوَ جاهِلٌ مِنه: أَي جاهِلٌ بِه غيرُ مُخْتَبِرٍ لحالِهِ.المَجْهَلَةُ كمَرْحَلَةٍ: مَا يَحْمِلُكَ
              علَى الجَهْلِ من أَمْرٍ أَو أرْضٍ أَو خَصْلَةٍ، وَمِنْه الحَدِيث: الوَلَدُ مَبخَلَةٌ مَجْبَنَةٌ وَفِي رِوَايَة
              مَجْهَلَة. وجَهَّلَهُ تَجْهِيلاً: نَسَبه إِلَيْهِ وَقَالَ عُمر بنُ عبدِ الْعَزِيز: زَعَمَت المرأةُ الصالِحةُ
              خَوْلَةُ بنتُ حَكِيمٍ امرأةُ عُثمانَ بنِ مَظْعُونٍ، رَضِي الله تَعَالَى عَنْهُمَا: أنّ رسولَ الله صلَّى الله
              عَلَيْهِ وسلَّم خرجَ ذاتَ يومٍ وَهُوَ مُحْتَضِنٌ أحدَ ابْني ابنتِه وَهُوَ يَقُول: واللهِ إنّكُم لَتُجَبِّنُونَ
              وتُبَخِّلُونَ وتُجَهِّلُونَ وإنَّكُم لَمِنْ رَيْحانِ اللهِ أَي يُوقِعُه الوَلَدُ فِي الجَهْلِ، شُغْلاً بِهِ
              عَن طَلَبِ العِلْم. وأَرْضٌ مَجْهَلٌ كمَقْعَدٍ لَا أعلامَ فِيها لَا يُهْتَدَى فِيهَا إلّا بالآرامِ، قَالَ مُزاحِمٌ
              العُقَيلِيّ:)(غَدَتْ مِنْ عَلَيهِ بعدَما تَمَّ خِمْسُها ... تَصِلُّ وعَن قَيضٍ بِزَيْزاءَ مَجْهَلِ)والجَمْعُ:
              مَجاهِلُ، وَهِي خِلافُ المَعالِم. وَقَالَ الراغِبُ: المَجْهَلُ: الأَمرُ، والأرضُ، والخَصْلَةُ الَّتِي تَحْمِلُ
              الإنسانَ على الاعتقادِ بالشَّيْء خِلافَ مَا هُوَ عَلَيْهِ. لَا تُثَنَّى وَلَا تُجْمَعُ قَالَ شيخُنا: بل ثَنَّوْهُ
              وجَمعُوهُ. وَذكره عِياضٌ فِي خُطْبَةِ الشِّفاء، وأقَرَّه شُرّاحُه، وناهِيكَ بِهِ. واسْتَجْهَلَهُ: استَخَفَّهُ
              قَالَ النابِغَةُ الذُّبْيانيّ:(دَعاكَ الهَوَى واسْتَجْهَلَتْكَ المَنازِلُ ... وَكَيف تَصابى المَرْءِ والشَّيبُ
              شامِلُ)وَفِي المَثَل: نَزْوَ الفُرارِ اسْتَجْهَل الفُرارا أَي إِذا شَبَّ الفُرارُ أخذَ فِي النَّزَوانِ، فمَتى
              رَآهُ غيرُه نَزا لِنَزْوِه، يُضْرَبُ لِمَن تُتَّقَى مُصاحَبتُه. مِن المَجاز: استَجْهَلَتِ الريحُ الغصْنَ: أَي
              حَرَّكَتْه فاضطَرَبَ قَالَ الرَّاغِب: كَأَنَّهَا حَمَلَتْه على تَعاطِي الجَهْلِ، وَذَلِكَ استعارةٌ حَسَنةٌ.
              المِجْهَلُ كمِنْبَرٍ ومِكْنَسَةٍ وصَيقَلٍ وصَيقَلَةٍ: خَشَبَةٌ يُحرَّك بهَا الجَمْرُ لُغةٌ يَمانِيَةٌ، نقلَه
              ابنُ دُرَيْد، مَا عدا اللغةَ الثانيةَ. والجاهِلُ: الأَسَدُ الَّذِي يَخْرِقُ بالفَرِيسَةِ. قَالَ: أجْوَف جافٍ
              جاهِلٌ مُصَدَّرُ وجَيهَلُ اسمُ امرأةٍ. وصَفاةٌ جَيهَلٌ: أَي عَظِيمهٌّ. مِن المَجاز: ناقَةٌ مَجْهُولةٌ إِذا كَانَت
              لم تُحلبْ قَطُّ، أَو غُفْلٌ لَا سِمَةَ عَلَيْهَا. قولُهم: كَانَ ذَلِك فِي الجاهِلِيَّةِ الجَهْلاءِ: تَوكِيدٌ
              لَهَا، يُشَتَق لَهَا من اسمِه مَا يُؤكَّدُ بِهِ، كَمَا يُقَال: وَتِدٌ واتِدٌ، ويَومٌ أيْوَمُ، ولَيلَةٌ لَيلاءُ.وَمِمَّا
              يُسْتَدْرَك عَلَيْهِ: رَكِبتُ المَفازَةَ علَى مَجْهُولِها، قَالَ سُوَيْدٌ اليَشْكُرِيُّ:(فرَكِبناهَا علَى مَجْهُولِها ... بِصِلابِ
              الأَرْضِ فِيهنَّ شَجَعْ)وناقَةٌ مَجْهُولَةٌ: لم تَحْمِلْ قَط، عَن الزَّمخشريّ، وَهُوَ مَجازٌ. وَفِي الحَدِيث:
              إنَّ مِن العِلْمِ جَهْلاً هُوَ أَن يَتعلَّمَ مَا لَا يَحتاجُ ويدَعَ مَا يَحتاج إِلَيْهِ، أَو أَن يتكلَّفَ العالِمُ
              إِلَى عِلْمِ مَا لَا يَعْلَمُه فيُجَهِّلُه ذَلِك. وجَهِلَت القِدْرُ: اشتَدَّ غَلَيَانُها، نَقِيض تَحَلَّمَت،
              وَهُوَ مجازٌ، قَالَ ابنُ أحْمَرَ يَصِفُ قُدُوراً تَغْلِي:(ودُهْم تُصادِيها الوَلائدُ جِلَّةٍ ... إِذا جَهِلَتْ
              أَجْوافُها لم تَحلَّمِ)يَقُول: إِذا فارَتْ لم تَسْكُنْ. والجُهُولِيَّةُ: مَصْدرٌ، كالطُّفولِيّة. وَأَبُو جَهْلٍ:
              عمرُو بن هِشام المَخْزُوميّ، كَانَ يُكنَى فِي الجاهِليّة أَبَا الحَكَم. واسْتَجْهَلَه: عَدَّ جاهِلاً. وناقَةٌ
              مِجْهالٌ: تَخِفُّ فِي مَسيرِها، وَهُوَ مَجازٌ. والعَوَّامُ بنُ جُهَيلٍ، كزُبَيرٍ: سادِنُ يَغُوثَ، ثمَّ أسلم
              وصَحِبَ، وَله قِصَّةٌ، نقلَه الحافِظ فِي التبصير، وأهملَه أربابُ المَعاجِمِ.'
