          - entry_id: 819442
            dictionary_id: 119
            headword: الجهل
            headword_bare: الجهل
            headword_norm: الجهل
            root: جهل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'الجهل:[في الانكليزية] Ignorance [ في الفرنسية] Ignorance بالفتح وسكون الهاء في اللغة نادانستن
              وناداني على ما في المنتخب. وعند المتكلّمين يطلق بالاشتراك على معنيين. الأول الجهل البسيط وهو عدم العلم عمّا
              من شأنه أن يكون عالما فلا يكون ضدا للعلم، بل متقابلا له تقابل العدم والملكة. ويقرب منه السهو وكأنه جهل بسيط
              سببه عدم استثبات التصوّر حتى إذا نبّه الساهي أدنى تنبيه تنبّه. وكذا الغفلة والذهول والجهل البسيط بعد العلم يسمّى
              نسيانا. قال الآمدي إنّ الذهول والغفلة والنسيان عبارات مختلفة لكن يقرب أن تكون معانيها متحدة، وكلها مضادّة للعلم،
              بمعنى أنه يستحيل اجتماعها معه. قال والجهل البسيط يمتنع اجتماعه مع العلم لذاتيهما فيكون ضدا له وإن لم يكن صفة
              إثبات. وليس الجهل البسيط ضدا للجهل المركّب ولا الشكّ ولا الظنّ ولا النظر، بل يجامع كلا منها، لكنه يضاد النوم
              والغفلة والموت لأنه عدم [العلم] عمّا من شأنه أن يقوم به العلم وذلك غير متصوّر في حالة النوم وأخواته. وأما العلم
              فإنه يضاد جميع هذه الأمور المذكورة. والثاني الجهل المركّب وهو عبارة عن اعتقاد جازم غير مطابق سواء كان مستندا
              إلى شبهة أو تقليد، فليس الثبات معتبرا في الجهل المركّب كما هو المشهور في الكتب وإنما سمي مركّبا لأنه يعتقد الشيء
              على خلاف ما هو عليه فهذا جهل بذلك الشيء، ويعتقد أنه يعتقده على ما هو عليه فهذا جهل آخر قد تركّبا معا، وهو ضدّ
              للعلم لصدق حدّ الضدين عليهما. فإنّ الضدين معنيان وجوديان يستحيل اجتماعهما في محل واحد وبينهما غاية الخلاف أيضا.
              وقالت المعتزلة أي كثير منهم هو مماثل للعلم فامتناع الاجتماع بينهما للمماثلة لا للمضادة، كذا في شرح المواقف.
              وفي شرح التجريد في مبحث العلم: الجهل يطلق على معنيين: أحدهما يسمّى جهلا بسيطا وهو عدم العلم أو الاعتقاد عمّا
              من شأنه أن يكون عالما أو معتقدا، وبهذا المعنى يقابل العلم والاعتقاد مقابلة العدم والملكة. وثانيهما يسمّى جهلا
              مركّبا وهو اعتقاد الشيء على خلاف ما اعتقد عليه اعتقادا جازما سواء كان مستندا إلى شبهة أو تقليد وهو بهذا المعنى
              قسم من الاعتقاد بالمعنى الأعمّ.'
            translation_en: null
            translation_fr: null
            domain: null
