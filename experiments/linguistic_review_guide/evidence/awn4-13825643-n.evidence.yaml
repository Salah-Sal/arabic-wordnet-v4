            dict_author: null
            dict_death_year: null
            definitions:
            - sense_index: 0
              text: 'الْمَجْهُول: ضد الْمَعْلُوم. وَعند عُلَمَاء الصّرْف والنحو هُوَ الْفِعْل الَّذِي حذف فَاعله وَبني للْمَفْعُول
                بِأَن يضم أَوله وَكسر مَا قبل آخِره أَو يضم الثَّالِث مَعَ همزَة الْوَصْل أَو يضم الثَّانِي مَعَ التَّاء إِن
                كَانَ مَاضِيا وَإِن كَانَ مضارعا يضم حرف المضارعة وَيفتح مَا قبل آخِره.وَاعْلَم أَن المُرَاد بِالْمَجْهُولِ
                الَّذِي يُسمى شَيْئا فِي مُقَدمَات الْجَبْر والمقابلة غير الْوَاحِد لِأَنَّهُ لَو كَانَ وَاحِدًا فَلَا فَائِدَة
                فِي ضربه فِي نَفسه وَلَا حَاصِل فَافْهَم واحفظ.'
