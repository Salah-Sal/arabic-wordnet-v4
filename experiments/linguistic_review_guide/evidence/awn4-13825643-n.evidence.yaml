            definitions_text: 'ج هـ ل : (الْجَهْلُ) ضِدُّ الْعَلَمِ وَقَدْ (جَهِلَ) مِنْ بَابِ فَهِمَ وَسَلِمَ وَ (تَجَاهَلَ)
              أَرَى مِنْ نَفْسِهِ ذَلِكَ وَلَيْسَ بِهِ. وَ (اسْتَجْهَلَهُ) عَدَّهُ جَاهِلًا وَاسْتَخَفَّهُ أَيْضًا. وَ (التَّجْهِيلُ)
              النِّسْبَةُ إِلَى الْجَهْلِ. وَ (الْمَجْهَلَةُ) بِوَزْنِ الْمَرْحَلَةِ الْأَمْرُ الَّذِي يَحْمِلُ عَلَى الْجَهْلِ،
              وَمِنْهُ قَوْلُهُمْ: الْوَلَدُ مَجْهَلَةٌ. وَ (الْمَجْهَلُ) الْمَفَازَةُ لَا أَعْلَامَ فِيهَا.'
