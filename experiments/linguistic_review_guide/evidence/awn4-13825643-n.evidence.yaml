          - entry_id: 820551
            dictionary_id: 119
            headword: المبنى
            headword_bare: المبنى
            headword_norm: المبني
            root: بن
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: "المبنى:\n[فى الانكليزية] lndeclinable ،invariable \n[ في الفرنسية] Indeclinable ،invariable\
              \ بتشديد الياء كمرمي اسم مفعول مأخوذ من البناء المقصود منه القرار وعدم التغيّر كما في غاية التحقيق. وهو عند\
              \ النحاة ما لا يختلف آخره باختلاف العوامل لا لفظا ولا تقديرا، ويقابله المعرب وهو ما يختلف آخره باختلاف العوامل\
              \ لفظا أو تقديرا، هكذا ذكر الجمهور في تعريفهما. والمراد بما اللفظ وهو كالجنس شامل للمعرب والمبني. وقولهم لا\
              \ يختلف آخره يخرج المعرب. وإنّما قيد عدم الاختلاف بكونه بسبب اختلاف العوامل إذ قد يختلف آخر المبني لا لاختلاف\
              \ العوامل نحو من الرجل ومن امرأة ومن زيد. وبالجملة فحركة آخر المبني أو سكونه لا يكون بسبب عامل أوجب ذلك بل هو\
              \ مبني عليه. فالمبني هو ما لا يؤثّر فيه العامل أصلا لا لفظا ولا تقديرا بسبب مانع من تأثيره إذ تخلّف المعلول\
              \ عن العلّة لا يكون إلّا لوجود مانع وهو عدم اقتضاء الكلمة للمعاني المقتضية للإعراب حقيقة كما في مبنيات الأصل\
              \ أو حكما كما في ما ناسب مبني الأصل. وهو أي مبني الأصل الحروف بأسرها والماضي والأمر بغير اللام. وقيل الجملة\
              \ أيضا وذلك لأنّ المراد بمبني الأصل ما لا يحتاج إلى الإعراب من حيث إنّه لا يقع فاعلا ولا مفعولا ولا مضافا إليه\
              \ والجملة كذلك فإنّها بنفسها لا تحتاج إلى الإعراب لأنّها بذاتها لا تقع فاعلة ولا مفعولة ولا مضافا إليها. قلنا\
              \ كذلك لكنها تكتسي إعراب المفرد فخرجت عن كونها مبنية الأصل بهذا الاعتبار لأنّ ما هو مبني الأصل كالحرف والماضي\
              \ والأمر لا يكون له إعراب أصلا لا لفظا ولا تقديرا ولا محلا، فخرجت الجملة عنها ولم تخرج عن شبهها بها بل هي مبنية\
              \ قوية بالنسبة إلى غيرها من المبنيات. ثم المراد بالمناسبة المناسبة المعتبرة فخرجت المناسبة الغير المعتبرة لضعف\
              \ أو معارض. أمّا لمعارض ففي غير المنصرف فإنّه يناسب الفعل في الفرعيتين فمناسبة الماضي والأمر تقتضي البناء ومناسبة\
              \ المضارع تقتضي الإعراب. وأمّا لضعف ففي اسم الفاعل بمعنى الماضي فإنّه وإن ناسب الماضي لكن جريانه على المضارع\
              \ يضعف هذه المناسبة. وقد حصر صاحب المفصّل المناسبة بأنّها إمّا بتضمّن الاسم معنى مبني الأصل كأين فإنّه يتضمّن\
              \ معنى همزة الاستفهام، أو بشبهه له كالمبهمات فإنّها تشبه الحروف في الاحتياج إلى الصّلة أو الصّفة أو غيرهما،\
              \ أو وقوعه موقعه كنزال فإنّه واقع موقع انزل، أو مشاكلته للواقع موقعه كفجار، أو وقوعه موقع ما يشبهه كالمنادى\
              \ المضموم فإنّه واقع موقع كاف الخطاب المشبّهة بالحرف، أو إضافته إليه نحو يومئذ. هكذا يستفاد من شروح الكافية.\
              \ وعلم من هذا أنّ الاسم المبني ما لا يختلف آخره باختلاف العوامل لكونه مناسبا لمبني الأصل والاسم المعرب ما يختلف\
              \ آخره باختلاف العوامل لكونه غير مشابه لمبني الأصل فاندفع الدور من تعريف الجمهور. وتقرير الدور أنّ معرفة اختلاف\
              \ الآخر في المعرب متوقّف على العلم بكونه معربا، فلو أخذ الاختلاف في حدّ المعرب لتوقّف معرفة كونه معربا على معرفة\
              \ الاختلاف وذلك دور وكذا الحال في تعريف المبني. وتقرير الدفع ظاهر فلا حاجة إلى جعل الاختلاف وعدمه من أحكام المعرب\
              \ والمبني على ما اختاره ابن الحاجب. وقال الاسم المعرب المركّب الذي لم يشبه مبني الأصل، والمبني ما ناسب مبني\
              \ الأصل أو وقع غير مركّب ويجيء تحقيق التعريفين في لفظ المعرب."
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:24:1988
            dict_key: hawramani_24
            dict_name_ar: كشّاف اصطلاحات الفنون والعلوم للتهانوي
            dict_name_en: Al-Tahānawī, Kashshāf Iṣṭilāḥāt al-Funūn wa-l-ʿUlūm (d. 1777 CE)
            dict_source_type: hawramani
            dict_period: classical
            dict_author: null
            dict_death_year: 1777
            definitions:
            - sense_index: 0
              text: "المبنى:\n[فى الانكليزية] lndeclinable ،invariable \n[ في الفرنسية] Indeclinable ،invariable بتشديد الياء\
                \ كمرمي اسم مفعول مأخوذ من البناء المقصود منه القرار وعدم التغيّر كما في غاية التحقيق. وهو عند النحاة ما لا\
                \ يختلف آخره باختلاف العوامل لا لفظا ولا تقديرا، ويقابله المعرب وهو ما يختلف آخره باختلاف العوامل لفظا أو\
                \ تقديرا، هكذا ذكر الجمهور في تعريفهما. والمراد بما اللفظ وهو كالجنس شامل للمعرب والمبني. وقولهم لا يختلف\
                \ آخره يخرج المعرب. وإنّما قيد عدم الاختلاف بكونه بسبب اختلاف العوامل إذ قد يختلف آخر المبني لا لاختلاف العوامل\
                \ نحو من الرجل ومن امرأة ومن زيد. وبالجملة فحركة آخر المبني أو سكونه لا يكون بسبب عامل أوجب ذلك بل هو مبني\
                \ عليه. فالمبني هو ما لا يؤثّر فيه العامل أصلا لا لفظا ولا تقديرا بسبب مانع من تأثيره إذ تخلّف المعلول عن\
                \ العلّة لا يكون إلّا لوجود مانع وهو عدم اقتضاء الكلمة للمعاني المقتضية للإعراب حقيقة كما في مبنيات الأصل\
                \ أو حكما كما في ما ناسب مبني الأصل. وهو أي مبني الأصل الحروف بأسرها والماضي والأمر بغير اللام. وقيل الجملة\
                \ أيضا وذلك لأنّ المراد بمبني الأصل ما لا يحتاج إلى الإعراب من حيث إنّه لا يقع فاعلا ولا مفعولا ولا مضافا\
                \ إليه والجملة كذلك فإنّها بنفسها لا تحتاج إلى الإعراب لأنّها بذاتها لا تقع فاعلة ولا مفعولة ولا مضافا إليها.\
                \ قلنا كذلك لكنها تكتسي إعراب المفرد فخرجت عن كونها مبنية الأصل بهذا الاعتبار لأنّ ما هو مبني الأصل كالحرف\
                \ والماضي والأمر لا يكون له إعراب أصلا لا لفظا ولا تقديرا ولا محلا، فخرجت الجملة عنها ولم تخرج عن شبهها بها\
                \ بل هي مبنية قوية بالنسبة إلى غيرها من المبنيات. ثم المراد بالمناسبة المناسبة المعتبرة فخرجت المناسبة الغير\
                \ المعتبرة لضعف أو معارض. أمّا لمعارض ففي غير المنصرف فإنّه يناسب الفعل في الفرعيتين فمناسبة الماضي والأمر\
                \ تقتضي البناء ومناسبة المضارع تقتضي الإعراب. وأمّا لضعف ففي اسم الفاعل بمعنى الماضي فإنّه وإن ناسب الماضي\
                \ لكن جريانه على المضارع يضعف هذه المناسبة. وقد حصر صاحب المفصّل المناسبة بأنّها إمّا بتضمّن الاسم معنى مبني\
                \ الأصل كأين فإنّه يتضمّن معنى همزة الاستفهام، أو بشبهه له كالمبهمات فإنّها تشبه الحروف في الاحتياج إلى الصّلة\
                \ أو الصّفة أو غيرهما، أو وقوعه موقعه كنزال فإنّه واقع موقع انزل، أو مشاكلته للواقع موقعه كفجار، أو وقوعه\
                \ موقع ما يشبهه كالمنادى المضموم فإنّه واقع موقع كاف الخطاب المشبّهة بالحرف، أو إضافته إليه نحو يومئذ. هكذا\
                \ يستفاد من شروح الكافية. وعلم من هذا أنّ الاسم المبني ما لا يختلف آخره باختلاف العوامل لكونه مناسبا لمبني\
                \ الأصل والاسم المعرب ما يختلف آخره باختلاف العوامل لكونه غير مشابه لمبني الأصل فاندفع الدور من تعريف الجمهور.\
                \ وتقرير الدور أنّ معرفة اختلاف الآخر في المعرب متوقّف على العلم بكونه معربا، فلو أخذ الاختلاف في حدّ المعرب\
                \ لتوقّف معرفة كونه معربا على معرفة الاختلاف وذلك دور وكذا الحال في تعريف المبني. وتقرير الدفع ظاهر فلا حاجة\
                \ إلى جعل الاختلاف وعدمه من أحكام المعرب والمبني على ما اختاره ابن الحاجب. وقال الاسم المعرب المركّب الذي\
                \ لم يشبه مبني الأصل، والمبني ما ناسب مبني الأصل أو وقع غير مركّب ويجيء تحقيق التعريفين في لفظ المعرب."
