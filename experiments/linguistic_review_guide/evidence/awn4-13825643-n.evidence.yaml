            definitions_text: 'تجاهل العارف:[في الانكليزية] Apophasis ،dubitation [ في الفرنسية] Preterition ،dubitation هو
              عند أهل البديع من المحسّنات المعنوية. تعريفه كما سمّاه السّكاكي: سوق المعلوم مساق غيره لنكتة. قال السّكاكي لا
              أحبّ تسميته بالتجاهل لوروده في كلام الله تعالى. والنكتة كالتحقير في قوله تعالى حكاية عن الكفار هَلْ نَدُلُّكُمْ
              عَلى رَجُلٍ يُنَبِّئُكُمْ إِذا مُزِّقْتُمْ كُلَّ مُمَزَّقٍ الآية، يعنون محمدا صلى الله عليه وآله وسلم كأن لم
              يكونوا يعرفون منه إلّا أنه رجل ما، وهو عندهم أظهر من الشمس، وكالتعريض نحو وَإِنَّا أَوْ إِيَّاكُمْ لَعَلى هُدىً
              أَوْ فِي ضَلالٍ مُبِينٍ وكغير ذلك من الاعتبارات، كذا في المطول. ومثاله في الكلام الفارسي هذا البيت:الزمان المضطرب
              أكثر أو سالفتك أو عملي أقلّ من ذرّة أو فمك أو قلبي المملوء بالغم.'
