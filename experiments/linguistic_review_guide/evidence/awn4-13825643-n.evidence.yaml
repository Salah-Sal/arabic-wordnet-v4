              مثال: ساروا في مجاهل الأرضالرأي: مرفوضةالسبب: لجمع «مَجْهَل» على «مجاهل»، وهو غير وارد؛ لأن الكلمة لا تُثَنَّى ولا تُجْمَع. المعنى: جمع مَجْهَل، أي الصحراء لا علامات فيها
