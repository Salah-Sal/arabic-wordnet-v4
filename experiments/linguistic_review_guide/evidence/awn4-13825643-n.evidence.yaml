        definitions_text: |-
          أَزْهَى منالجذر: ز هـ
          مثال: فلان أزهى من الطاووس في مشيتهالرأي: مرفوضةالسبب: لمجيء أفعل التفضيل من فعل مبني للمجهول.
          الصواب والرتبة: -فلانٌ أزهى من الطاووس في مشيته [فصيحة] التعليق: أجاز مجمع اللغة المصري صياغة أفعل التفضيل من الفعل المبني للمجهول إذا أُمن اللبس، وهنا أمن اللبس. كما ورد الثلاثي المبني للمعلوم «زَها» في المعاجم، فيكون اشتقاق أفعل التفضيل منها قياسيًّا.
