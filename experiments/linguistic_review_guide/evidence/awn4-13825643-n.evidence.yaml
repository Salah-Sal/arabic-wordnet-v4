    - entry_id: 795046
      dictionary_id: 112
      headword: ركن
      headword_bare: ركن
      headword_norm: ركن
      root: ركن
      root_source: camel
      pos: null
      form: null
      is_partial: 0
      definitions_text: 'ركن الشيء: لغةً: جانبه القوي فيكون عينه، وفي الاصطلاح: ما يقوم به ذلك الشيء من التقوم؛ إذ قوام الشيء
        بركنه؛ لا من القيام؛ وإلا يلزم أن يكون الفاعل ركنًا للفعل، والجسم ركنًا للعرض، والموصوف للصفة. وقيل: ركن الشيء ما
        يتم به، وهو داخل فيه، بخلاف شرطه، وهو خارج عنه.'
