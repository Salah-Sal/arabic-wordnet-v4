            definitions_text: (جهلت)الْقدر جهلا اشْتَدَّ غليانها وَهُوَ نقيض تحلمت وَفُلَان على غَيره جهلا وجهالة جَفا وتسافه
              وَفِي التَّنْزِيل الْعَزِيز {قَالُوا أتتخذنا هزوا قَالَ أعوذ بِاللَّه أَن أكون من الْجَاهِلين} وَالشَّيْء وَبِه
              لم يعرفهُ وَفِي التَّنْزِيل الْعَزِيز {إِن جَاءَكُم فَاسق بِنَبَأٍ فَتَبَيَّنُوا أَن تصيبوا قوما بِجَهَالَة
              فتصبحوا على مَا فَعلْتُمْ نادمين} وَالْحق أضاعه فَهُوَ جَاهِل (ج) جهال وجهلة وَجَهل وجهلاء وَهُوَ جهول (ج) جهل
              وَالْمَفْعُول مَجْهُول
