                وأَرض مَجْهَل: لا يُهْتَدَى فيها، وأَرضانِ مَجْهَل؛ أَنشد سيبويه:
                فلم يَبْقَ إِلاَّ كُلُّ صَفْواءَ صَفْوَةٍ،
                بِصَحْراء تِيهٍ، بَيْنَ أَرْضَيْنِ مَجْهَلِ
                وأَرَضُونَ مَجْهَلٌ كذلك، وربما ثَنَّوا وجَمَعوا. وأَرض مَجْهولة: لا
                أَعلام بها ولا جِبال، وإِذا كان بها معارف أَعلام فليست بمجهولة. يقال:
                عَلَوْنا أَرضاً مَجْهولة ومَجْهَلاً سَواءً؛ وأَنشدنا:
                قُلْتُ لصَحْراءَ خَلاءٍ مَجْهَلِ:
                تَغَوَّلي ما شِئْتِ أَن تَغَوَّلي
                قال: ويقال مجهولة ومجهولات ومَجاهِيل. وناقة مجهولة: لم تُحْلَب قَطُّ.
                وناقة مجهولة إِذا كانت غُفْلة لا سِمَةَ عليها؛ وكل ما اسْتَخفَّكَ فقد
                استجهلك؛ قال النابغة:
                دَعاك الهَوى واسْتَجْهَلَتْك المَنَازِلُ،
                وكَيْفَ تَصابي المَرءِ، والشَّيْبُ شامِلُ؟
                واسْتَجْهَلَتِ الريحُ الغُصْنَ: حَرَّكته فاضطرب.
                والمِجْهَل والمِجْهَلة والجَيْهَل والجَيْهَلة: الخَشَبة التي يُحَرَّك
                بها الجَمْر والتَّنُّور في بعض اللغات. وصَفاة جَيْهَل: عظيمة؛ قال ابن
                الأَعرابي: جَيْهَلُ اسم امرأَة؛ وأَنشد:
                تقول ذاتُ الرَّبَلاتِ، جَيهَلُ
