            definitions_text: '[جهل] الجَهْلُ: خِلاف العلم. وقد جَهِلَ فلانٌ جَهْلاً وجَهالَةً. وتَجاهَلَ، أي أرى من نفسه
              ذلك وليس به. واسْتَجْهَلَهُ: عدَّهُ جاهِلاً، واستخفه أيضا. قال الشاعر: * نزو الفرار استجهل الفرارا * والتجهبل:
              أن تنسبه إلى الجهل.والمجهلة: الامر الذى يحملك على الجَهْلِ. ومنه قولهم: " الولد مَجْهَلَةٌ ". والمَجْهَلُ: المفازةُ
              لا أعلامَ فيها. يقال: ركبتها على مجهولها. قال الشاعر سويد بن أبى كاهل: فَرَكِبْناها عَلى مَجْهولِها بصِلابِ
              الأرضِ فيهن شجع وقولهم: كان ذلك في الجاهِلِيَّةِ الجَهْلاءِ، هو توكيد للأوّل يُشتَقُّ له من اسمه ما يؤكد به،
              كما يقال: وتدواتد، وهمج هامج، وليلة ليلاء ويوم أيوم.'
