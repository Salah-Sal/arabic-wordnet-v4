          - entry_id: 808820
            dictionary_id: 116
            headword: جهل
            headword_bare: جهل
            headword_norm: جهل
            root: جهل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: '[جهل] فيه: إنكم "لتجهلون"وتبخلون وتجبنون، أي تحملون الآباء على الجهل حفظاً لقلوبهم. غ: أي إذا
              كثر ولد الرجل جهل ما ينفعه وما يضره لتقسيم قلبه. "ويحسبهم الجاهل أغنياء" أي الجاهل بحالهم. نه ومنه ح: من "استجهل"
              مؤمناً فعليه إثمه، أي من حمله على شيء ليس من خلقه فيغضبه فإن إثمه على من أحوجه إلى ذلك. ومنه: لكن "اجتهلته"
              الحمية" أي حملته الأنفة والغضب على الجهل. ومنه ح: إن من العلم "جهلاً" قيل: أن يتعلم ما لا يحتاج إليه كالنجوم
              وعلوم الأوائل، ويدع ما يحتاج إليه في دينه من علم القرآن والسنة، وقيل: هو أن يتكلف العالم القول فيما لا يعلمه
              فيجهله ذلك. غ: وقيل: وكالكلام. نه ومنه: فيك "جاهلية" هي الحالة التي عليها العرب قبل الإسلام من الجهل بالله والشرائع
              والمفاخرة بالأنساب والكبر والتجبر ونحوها. ش: و"مجاهل" تضل فيه الأحلام، جمع مجهل أي مفاوز لا أعلام يتحير فيها
              أولو الأحلام.'
            translation_en: null
            translation_fr: null
            domain: null
            external_id: haw:21:818
