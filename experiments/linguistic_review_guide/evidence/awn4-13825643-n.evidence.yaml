          - entry_id: 813586
            dictionary_id: 117
            headword: الجهل البسيط
            headword_bare: الجهل البسيط
            headword_norm: الجهل البسيط
            root: جهل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'الجهل البسيط: عدم العلم عما من شأنه أن يعلم. والمركب: اعتقاد جازم غير مطابق للواقع، كذا لخصه
              ابن الكمال. وقال الراغب: الجهل ثلاثة: الأول، خلو النفس من العلم، هذا أصله، وقد جعله بعضهم معنى مقتضيا للأفعال
              الجارية على النظام، الثاني، اعتقاد الشيء بخلاف ما هو عليه. الثالث، فعل الشيء بخلاف ما حقه أن يفعل، هبه اعتقد
              فيه اعتقادا صحيحا أم فاسدا كتارك الصلاة عمدا. والجهل يذكر تارة للذم، وهو الأكثر، وتارة لا له نحو {يَحْسَبُهُمُ
              الْجَاهِلُ أَغْنِيَاءَ} أي من لا يعرف حالهم، إلى هنا كلامه. وقال العضد "الإبجي": والجهل البسيط أصحابه كالأنعام
              لفقدهم ما به يمتاز الإنسان عنها بل هم أضل لتوجهها نحو كمالاتها، ويعالج بملازمة العلماء ليظهر له نقصه عند محاوراتهم.
              والجهل المركب إن قبل العلاج فبملازمة الرياضات ليطعم لذة اليقين ثم التنبيه على مقدمة مقدمة بالتدريج.'
