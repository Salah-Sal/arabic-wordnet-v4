              الْجَهْل الْمركب: فِي الْجَهْل نعم النَّاظِم.(آنكس كه بداند وبداند كه نداند ... اسب طرب ازكنبد كردون بدواند)
              (وآنكس كه بداند وبداند كه بداند ... آن لاش خرخويش بمنزل برساند)
              (وآنكس كه نداند وبداند كه بداند ... در جهل مركب ابد الدَّهْر بماند)
              ويقابله الْجَهْل الْبَسِيط وَهُوَ مَا مر آنِفا فِي الْجَهْل أَيْضا.
