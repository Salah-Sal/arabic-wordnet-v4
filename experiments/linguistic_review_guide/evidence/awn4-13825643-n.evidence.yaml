              مثال: هُمْ جُهَلاءٌالرأي: مرفوضة عند بعضهمالسبب: لصرف هذه الكلمة، مع وجود ما يستوجب منعها من الصرف.
              الصواب والرتبة: -هم جُهَلاءُ [فصيحة] التعليق: تستحقّ كلمة «جُهَلاء» المنع من الصرف؛ لأنها منتهية بألف التأنيث الممدودة، وهي ليست من أصل الكلمة، وقد توهَّم من صَرَف هذه الكلمة أنها لا تحقّق شروط صيغة منتهى الجموع لوجود حرف واحد بعد ألِفها، والواضح أنَّ علَّة المنع من الصرف فيها هي وجود ألف التأنيث الممدودة؛ ولذا لا تنوَّن في المثال.
