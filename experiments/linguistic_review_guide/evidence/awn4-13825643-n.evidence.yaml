            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'جَهِلَهُ، كسمِعَهُ، جَهْلاً وجَهَالَةً: ضِدُّ عَلِمَهُ،وـ عليه: أظْهَرَ الجَهْلَ،كتجاهَلَ،
              وهو جاهِلٌ وجَهولٌ، ج: جُهْلٌ، بالضم، وبضمتينِ، وكرُكَّعٍ، وجُهَّالٌ وجُهَلاءُ.وهو جاهِلٌ منه، أي: جاهِلٌ به.
              وكمَرْحَلَةٍ: ما يَحْمِلُكَ على الجَهْلِ.وجَهَّلَهُ تَجْهيلاً: نَسَبَهُ إليه.وأرضٌ مَجْهَلٌ، كمَقْعَدٍ: لا يُهْتَدى
              فيها، لا تُثَنَّى ولا تُجْمَعُ.واسْتَجْهَلَهُ: اسْتَخَفَّهُ،وـ الريحُ الغُصْنَ: حَرَّكَتْهُ فاضْطَرَبَ. وكمِنْبَرٍ
              ومِكْنَسَةٍ وصَيْقَلٍ وصَيْقَلَةٍ: خَشَبَةٌ يُحَرَّكُ بها الجَمْرُ.والجاهِلُ: الأسَدُ.وجَيْهَلُ: امرأةٌ.وصَفاةٌ
              جَيْهَلٌ: عظيمةٌ.وناقةٌ مَجْهولَةٌ: لم تُحْلَبْ قَطُّ، أو لا سِمَةَ عليها.والجاهِلِيَّةُ الجَهْلاءُ: تَوْكيدٌ.'
