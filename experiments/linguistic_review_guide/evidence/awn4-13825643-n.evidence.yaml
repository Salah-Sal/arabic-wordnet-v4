            definitions_text: 'الْجَهْل: عدم الْعلم عَمَّا من شَأْنه أَن يكون عَالما وَهُوَ الْجَهْل الْبَسِيط وَأما الْعلم
              والاعتقاد بِمَا يُخَالف الْوَاقِع فجهل مركب لِأَنَّهُ جهل بِشَيْء مركب من جَهله لِأَن صَاحبه لَا يعلم بجهله
              بل يعلم أَنه عَالم فَهُوَ جَاهِل من جَهله. وَالْجهل الْبَسِيط يَزُول بِسُرْعَة وسهولة بالتعليم والتعريف. وَأما
              الْجَهْل الْمركب فَلَا يَزُول إِلَّا بصعوبة ومهلة بل الْمَشْهُور أَن الْجَهْل الْمركب لَا يقبل العلاج.'
