            definitions_text: 'في البرمجة: بنيةُ معطيات لها عددٌ من العُقد (يمكن أن يكون معدوماً) وعددٌ من الحافَات (يمكن
              أن يكون معدوماً) تَربطُ أزواجاً من العُقد. إذا أمكن ربْطُ أيّ عقدتين من المبيان بمسار، قيل عن المبيان إنه متصل.
              أما المبيان الجزئي subgraph فهو مجموعة جزئية من عُقد وحافَات المبيان. نقول عن المبيان إنه موجّه digraph إذا
              رَبطتْ كلُّ حافَةٍ عقدتين باتجاهٍ واحدٍ فقط. ونقول عن المبيان إنه موزون weighted إذا كان لكلّ حافَةٍ بعض القيم
              المرتبطة بها.'
