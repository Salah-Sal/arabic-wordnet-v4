              attribution: البقرة /٢٧٣
            - idx: 1
              type: quran
              text: ﴿ يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ جَاءَكُمْ فَاسِقٌ بِنَبَأٍ فَتَبَيَّنُوا أَنْ تُصِيبُوا قَوْمًا
                بِجَهَالَةٍ ﴾
              attribution: الحجرات /٦
            - idx: 2
              type: poetry
              text: 'مَنْ قال: لَسْتَ بخَيْرِ النَّاسِ كُلِّهِمُ ... فَجَهْلُهُ بكَ عِنْدَ النَّاسِ عَاذِرُهُ'
              attribution: المُتَنَبِّى
            - idx: 3
              type: usage
              text: 'يُقال: هو جاهلٌ منه, أى جاهلٌ به, غير مُخْتَبر لحاله'
              attribution: null
            - idx: 4
              type: poetry
              text: أَلَا يَجْهَلَنْ أَحَدٌ عَلَيْنَا ... فَنَجْهَلَ فَوْقَ جَهْلِ الجَاهِلِينا
              attribution: عَمْرو بن كُلْثُوم
            - idx: 5
              type: poetry
              text: وجاهل مَدَّه في جَهْلِهِ ضَحِكي ... حتى أَتَتْه يَدٌ فَرَّاسَةٌ وفَمُ
              attribution: المُتَنَبِّى
            - idx: 6
              type: quran
              text: ﴿ قَالُوا أَتَتَّخِذُنَا هُزُوًا قَالَ أَعُوذُ بِاللَّهِ أَنْ أَكُونَ مِنَ الجَاهِلِينَ ﴾
              attribution: البقرة /٦٧
            - idx: 7
              type: poetry
              text: 'وقال سعد بن كَعْب الغَنَوىّ : ...'
