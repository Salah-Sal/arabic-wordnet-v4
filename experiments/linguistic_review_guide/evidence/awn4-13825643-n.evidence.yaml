            استنابَ يستنيب، اسْتَنِبْ، استِنابَةً، فهو مُستنيب، والمفعول مُستناب• استنابَ الرَّجلَ: أنابه؛ أقامه مقامه "استناب المديرُ أحدَ موظَّفيه لحضور الاجتماع مكانه". 
            انتابَ يَنتاب، انْتَبْ، انتيابًا، فهو مُنتاب، والمفعول مُنتاب• انتابه أمرٌ: أصابه وألمّ به "انتابه الفزعُ/ الاكتئابُ/ الضَّحكُ/ المرضُ".• انتاب صديقَه: قصده مرَّةً بعد مَرَّة "فلانٌ ينتابُنا- تنتاب السِّباعُ المنهلَ". 
            تناوبَ/ تناوبَ على يتناوب، تَناوُبًا، فهو مُتناوِب، والمفعول مُتناوَب• تناوب الأمرَ: قام به مرَّةً بعد مرَّة "تناوب زيارةَ صديقه- بشكل متناوب" ° بالتَّناوب: بالتبادل- سِباق التَّناوب: سباق بين فريقين أو أكثر حيث يركض كلُّ فرد من الفريق إلى مسافة معيّنة ثمّ يكمل فرد آخر السِّباق- طاقم التَّناوب: طاقم من العمال يُريحون طاقما آخر.• تناوب الجندُ حراسةَ الثُّكنة/ تناوب الجندُ على حراسة الثُّكنة: تداولوه بينهم وتقاسموه "تناوبوا الأمنَ في المنطقة البتروليّة".• تناوبته الهمومُ: أصابته، تعاقبت عليه "تناوبته المصائبُ". 
            ناوبَ يناوب، مناوبةً، فهو مُناوِب، والمفعول مُناوَب• ناوبه في الشّيء أو الأمر: قاسمه فيه وتداوله معه بالنَّوْبة "ناوبتِ المرأةُ زوجَها في مرافقة أطفالها إلى المدرسة". 
            نوَّبَ ينوِّب، تَنوِيبًا، فهو مُنوِّب، والمفعول مُنَوَّب• نوَّبه في الاجتماع: جعله نائبًا عنه "نوّبه في حراسة المصنع". 
