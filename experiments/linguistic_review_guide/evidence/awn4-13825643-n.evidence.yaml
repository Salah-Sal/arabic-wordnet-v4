            definitions_text: 'ضِدُّ العِلْم الخِفَّةُ والسَّفَهُ ( في اصطلاح أَهْلِ الكلام ) : اعْتِقَادُ الشيء على خِلافِ
              ما هو عليه الجَهْلُ البَسِيطُ : عَدَمُ العِلْم بما من شأْنِه أن يكون عالماً به, وهو تَعْبِيرٌ يُطْلَقُ على من
              يُسَلِّم بجَهْلِه الجَهْلُ المُرَكَّبُ: اعتقادٌ جازم غير مطابق للواقع. وهو تَعْبِيرٌ يُطْلَقُ على من لا يُسَلِّم
              بجَهْلِه, ويَدَّعِي مالا يَعْلَم'
