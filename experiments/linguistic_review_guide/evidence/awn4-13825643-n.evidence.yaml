                فِي الجَهْلِ، شُغْلاً بِهِ عَن طَلَبِ العِلْم. وأَرْضٌ مَجْهَلٌ كمَقْعَدٍ لَا أعلامَ فِيها لَا يُهْتَدَى فِيهَا
                إلّا بالآرامِ، قَالَ مُزاحِمٌ العُقَيلِيّ:)(غَدَتْ مِنْ عَلَيهِ بعدَما تَمَّ خِمْسُها ... تَصِلُّ وعَن قَيضٍ
                بِزَيْزاءَ مَجْهَلِ)والجَمْعُ: مَجاهِلُ، وَهِي خِلافُ المَعالِم. وَقَالَ الراغِبُ: المَجْهَلُ: الأَمرُ، والأرضُ،
                والخَصْلَةُ الَّتِي تَحْمِلُ الإنسانَ على الاعتقادِ بالشَّيْء خِلافَ مَا هُوَ عَلَيْهِ. لَا تُثَنَّى وَلَا
                تُجْمَعُ قَالَ شيخُنا: بل ثَنَّوْهُ وجَمعُوهُ. وَذكره عِياضٌ فِي خُطْبَةِ الشِّفاء، وأقَرَّه شُرّاحُه، وناهِيكَ
                بِهِ. واسْتَجْهَلَهُ: استَخَفَّهُ قَالَ النابِغَةُ الذُّبْيانيّ:(دَعاكَ الهَوَى واسْتَجْهَلَتْكَ المَنازِلُ ... وَكَيف
                تَصابى المَرْءِ والشَّيبُ شامِلُ)وَفِي المَثَل: نَزْوَ الفُرارِ اسْتَجْهَل الفُرارا أَي إِذا شَبَّ الفُرارُ
                أخذَ فِي النَّزَوانِ، فمَتى رَآهُ غيرُه نَزا لِنَزْوِه، يُضْرَبُ لِمَن تُتَّقَى مُصاحَبتُه. مِن المَجاز: استَجْهَلَتِ
                الريحُ الغصْنَ: أَي حَرَّكَتْه فاضطَرَبَ قَالَ الرَّاغِب: كَأَنَّهَا حَمَلَتْه على تَعاطِي الجَهْلِ، وَذَلِكَ
                استعارةٌ حَسَنةٌ. المِجْهَلُ كمِنْبَرٍ ومِكْنَسَةٍ وصَيقَلٍ وصَيقَلَةٍ: خَشَبَةٌ يُحرَّك بهَا الجَمْرُ لُغةٌ
                يَمانِيَةٌ، نقلَه ابنُ دُرَيْد، مَا عدا اللغةَ الثانيةَ. والجاهِلُ: الأَسَدُ الَّذِي يَخْرِقُ بالفَرِيسَةِ.
                قَالَ: أجْوَف جافٍ جاهِلٌ مُصَدَّرُ وجَيهَلُ اسمُ امرأةٍ. وصَفاةٌ جَيهَلٌ: أَي عَظِيمهٌّ. مِن المَجاز: ناقَةٌ
                مَجْهُولةٌ إِذا كَانَت لم تُحلبْ قَطُّ، أَو غُفْلٌ لَا سِمَةَ عَلَيْهَا. قولُهم: كَانَ ذَلِك فِي الجاهِلِيَّةِ
                الجَهْلاءِ: تَوكِيدٌ لَهَا، يُشَتَق لَهَا من اسمِه مَا يُؤكَّدُ بِهِ، كَمَا يُقَال: وَتِدٌ واتِدٌ، ويَومٌ
                أيْوَمُ، ولَيلَةٌ لَيلاءُ.وَمِمَّا يُسْتَدْرَك عَلَيْهِ: رَكِبتُ المَفازَةَ علَى مَجْهُولِها، قَالَ سُوَيْدٌ
                اليَشْكُرِيُّ:(فرَكِبناهَا علَى مَجْهُولِها ... بِصِلابِ الأَرْضِ فِيهنَّ شَجَعْ)وناقَةٌ مَجْهُولَةٌ: لم تَحْمِلْ
                قَط، عَن الزَّمخشريّ، وَهُوَ مَجازٌ. وَفِي الحَدِيث: إنَّ مِن العِلْمِ جَهْلاً هُوَ أَن يَتعلَّمَ مَا لَا
                يَحتاجُ ويدَعَ مَا يَحتاج إِلَيْهِ، أَو أَن يتكلَّفَ العالِمُ إِلَى عِلْمِ مَا لَا يَعْلَمُه فيُجَهِّلُه ذَلِك.
                وجَهِلَت القِدْرُ: اشتَدَّ غَلَيَانُها، نَقِيض تَحَلَّمَت، وَهُوَ مجازٌ، قَالَ ابنُ أحْمَرَ يَصِفُ قُدُوراً
                تَغْلِي:(ودُهْم تُصادِيها الوَلائدُ جِلَّةٍ ... إِذا جَهِلَتْ أَجْوافُها لم تَحلَّمِ)يَقُول: إِذا فارَتْ لم
                تَسْكُنْ. والجُهُولِيَّةُ: مَصْدرٌ، كالطُّفولِيّة. وَأَبُو جَهْلٍ: عمرُو بن هِشام المَخْزُوميّ، كَانَ يُكنَى
                فِي الجاهِليّة أَبَا الحَكَم. واسْتَجْهَلَه: عَدَّ جاهِلاً. وناقَةٌ مِجْهالٌ: تَخِفُّ فِي مَسيرِها، وَهُوَ
                مَجازٌ. والعَوَّامُ بنُ جُهَيلٍ، كزُبَيرٍ: سادِنُ يَغُوثَ، ثمَّ أسلم وصَحِبَ، وَله قِصَّةٌ، نقلَه الحافِظ
                فِي التبصير، وأهملَه أربابُ المَعاجِمِ.'
