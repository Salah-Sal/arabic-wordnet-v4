            definitions_text: "جاهلٌ فيالجذر: ج هـ ل\nمثال: جَاهِلٌ في التاريخالرأي: مرفوضةالسبب: لاستعمال حرف الجر «في» بدلاً\
              \ من حرف الجر «الباء».\nالصواب والرتبة: -جاهلٌ بالتاريخ [فصيحة]-جاهلٌ في التاريخ [صحيحة] التعليق: ذكرت المعاجم\
              \ أن الفعل «جهل» يتعدى بالباء، وقد جاء في الوسيط: «جَهِل الشيءَ وبه: لم يعرفه»، ولكن أجاز اللغويون نيابة حروف\
              \ الجر بعضها عن بعض، كما أجازوا تضمين فعل معنى فعل آخر فيتعدى تعديته، وفي المصباح (طرح): «الفعل إذا تضمَّن معنى\
              \ فعل جاز أن يعمل عمله». وقد أقرَّ مجمع اللغة المصري هذا وذاك. وحلول «في» محل «الباء» كثير شائع في العديد من\
              \ الاستعمالات الفصيحة، فهما يتعاقبان كثيرًا، وليس استعمال أحدهما بمانع من استعمال الآخر، كقول صاحب التاج: «ارتاب\
              \ فيه \n.... وارتاب به»، كما أن حرف الجر «في» أتى في الاستعمال الفصيح مرادفًا للباء، كقول ابن سينا: «وتواروا\
              \ في الحشيش»، كما أنه يجوز نيابة «في» عن «الباء» على إرادة معنى الظرفية، أو بناء على تضمين الفعل المتعدي بـ\
              \ «الباء» معنى فعل آخر يتعدى بـ «في»."
