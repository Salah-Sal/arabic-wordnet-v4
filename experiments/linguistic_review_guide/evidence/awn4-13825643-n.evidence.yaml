              text: |-
                (ج هـ ل)
                الجَهْلُ: نقيض الْعلم، جَهِلَهُ جَهْلا وجَهالَةً.
                وجَهِلَ عَلَيْهِ، وتَجَاهَلَ: أظهر الجَهْل، عَن سِيبَوَيْهٍ. وَرجل جاهلٌ، وَالْجمع جُهْلٌ، وجُهُلٌ وجٌهَّلٌ، وجُهَّالٌ، وجُهَلاءُ، عَن سِيبَوَيْهٍ، قَالَ: شبهوه بفعيل، كَمَا شبهوا فَاعِلا بفعول. قَالَ ابْن جني: قَالُوا: جُهَلاء، كَمَا قَالُوا عُلَمَاء، حملا لَهُ على ضِدّه.
                وَرجل جَهُولٌ، كجاهِلٍ، وَالْجمع جُهَّلٌ وجُهْلٌ، أنْشد ابْن الْأَعرَابِي:
                جُهْلَ العَشِىّ رُجَّحا لِقَسْرِهِ
                قَوْله: جُهْلَ الْعشي، يَقُول: فِي أول النَّهَار تستن، وبالعشي يدعوها لينضم إِلَيْهِ مَا كَانَ مِنْهَا شاذا فَيَأْمَن عَلَيْهَا السبَاع وَاللَّيْل فيحوطها، فَإِذا فعل ذَلِك رجحن إِلَيْهِ مَخَافَة قسره لهيبتها إِيَّاه.
                والمَجْهَلَةُ: مَا يحملك على الجَهْل، وَفِي الحَدِيث: " الْوَلَد مَجْهَلَةٌ ".
                وَقَول مُضرس ابْن ربعي الفقعسي:
                إنَّا لنَصْفَحُ عَن مَجاهِلِ قَوْمِنا ... ونُقِيمُ سالِفَةَ العَدُوِّ الأصْيَدِ
                إِنَّمَا مَجاهِلُ فِيهِ جمع لَيْسَ لَهُ وَاحِد مكسر عَلَيْهِ إِلَّا قَوْلهم جَهْلٌ، وَفعل لَا يكسر على مفاعل، فمَجاهِلُ هُنَا من بَاب ملامح ومحاسن.
                والجاهِليَّة: زمن الفترة، وَقَالُوا: الجاهليَّةُ الجَهْلاءُ، فبالغوا.
                وَأَرْض مَجْهَلٌ: لَا يهتدى فِيهَا، وأرضان مَجْهَلٌ، أنْشد ثَعْلَب:
                فَلم يَبْقَ إِلَّا كلُّ صَغْوَاءَ صَغْوَةٍ ... بصَحْراءِ تِيهٍ بينَ أرْضَينِ مَجْهَلِ
