          - entry_id: 817609
            dictionary_id: 118
            headword: الْمَجْهُول الْمُطلق
            headword_bare: المجهول المطلق
            headword_norm: المجهول المطلق
            root: جهل
            root_source: camel
            pos: null
            form: null
            is_partial: 0
            definitions_text: 'الْمَجْهُول الْمُطلق: مَا لَا يكون مَعْلُوما بِوَجْه من الْوُجُوه. وَمن أَحْكَامه امْتنَاع
              الحكم عَلَيْهِ وَامْتِنَاع طلبه قيل إِن قَوْلك إِن الْمَجْهُول الْمُطلق يمْتَنع عَلَيْهِ الحكم قَضِيَّة مُوجبَة
              قد حكم فِيهَا على الْمَجْهُول الْمُطلق بامتناع الحكم فَهُوَ إِمَّا أَن يكون مَعْلُوما أَو مَجْهُولا. وعَلى كل
              تَقْدِير يلْزم كذبهَا - إِمَّا على الأول فلصدق قَوْلنَا الْمَحْكُوم عَلَيْهِ فِي هَذِه الْقَضِيَّة مَعْلُوم
              وكل مَعْلُوم لَا يمْتَنع عَلَيْهِ الحكم فَهَذَا لَا يمْتَنع عَلَيْهِ الحكم هَذَا خلف. وَإِمَّا على الثَّانِي
              فلصدق قَوْلنَا بعض الْمَجْهُول الْمُطلق مَحْكُوم عَلَيْهِ وَإِن كَانَ بالامتناع وكل مَحْكُوم عَلَيْهِ فَهُوَ
              مَعْلُوم بِوَجْه مَا وكل مَعْلُوم بِوَجْه مَا لَا يمْتَنع عَلَيْهِ الحكم ينْتج بعض الْمَجْهُول الْمُطلق لَا
              يمْتَنع عَلَيْهِ الحكم. هَذَا خلف فَيلْزم الحكم وسلبه مَعًا. وَالْجَوَاب أَن الْمَحْكُوم عَلَيْهِ فِي ذَلِك
              القَوْل بل فِي هَذِه القضايا الْمَذْكُورَة فِي تَقْرِير الِاعْتِرَاض مَعْلُوم وموجود بِالذَّاتِ أَي بِحَسب نفس
              الْأَمر بِاعْتِبَار حُصُوله فِي الذِّهْن وَمَا صدق عَلَيْهِ مَجْهُول ومعدوم مُطلق بِالْفَرْضِ بِاعْتِبَار اتصافه
              بِوَصْف المجهولية والمعدومية. فكونه مَحْكُومًا عَلَيْهِ بِالِاعْتِبَارِ الأول. وسلب الحكم عَنهُ بِالِاعْتِبَارِ
              الثَّانِي. وَزِيَادَة تَحْقِيق هَذَا الْمقَام سَيَأْتِي فِي الْمُوجبَة إِن شَاءَ الله تَعَالَى.'
