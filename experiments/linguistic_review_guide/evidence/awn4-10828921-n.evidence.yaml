      dict_death_year: null
      definitions:
      - sense_index: 0
        text: شبكة الغابات والتجارة العالمية (GFTN) هي مبادرة من الصندوق العالمي للحياة البرية (WWF) تهدف إلى القضاء على القطع
          غير المشروع للأشجار وتعزيز إدارة الغابات المسؤولة بيئيا واجتماعيا. الشبكة العالمية للغابة والتجارة - أمريكا الشمالية
          (GFTN-NA) تصل بين الشركات الرائدة في الولايات المتحدة وكندا لتحليل أصول الخشب والورق، وذلك لتقييم وتخفيف مخاطر سلسلة
          التوريد، والقضاء على المصادر غير المستدامة، والزيادة على مر الزمن تدريجيا في حجم المواد الحائزة على شهادة مجلس رعاية
          الغابات (FSC) والمواد المعاد تدويرها في سلاسل التوريد.
