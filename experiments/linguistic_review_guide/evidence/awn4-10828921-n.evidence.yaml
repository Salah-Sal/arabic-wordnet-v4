      definitions_text: 'تطلق على الجزء الجنوبي من قارة أمريكا الشمالية الواقع إلى الجنوب من المكسيك, والذي يمتد إلى شمالي
        كولومبيا بأمريكا الجنوبية. تبلغ مساحتها ٢٢٨,٥٧٨ ميلا مربعا. وتتكون من ست جمهوريات هي: جواتيمالا, وهندوراس, والسلفادور,
        ونيكاراجوا, وكوستاريكا, وبنما, ومستعمرة هندوراس البريطانية. يحدها المحيط الهادى من الجنوب الغربي, والبحر الكاريبى
        من الشمال الشرقي'
