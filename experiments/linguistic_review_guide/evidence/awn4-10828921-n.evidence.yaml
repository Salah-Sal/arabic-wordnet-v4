    - entry_id: 358991
      dictionary_id: 60
      headword: شبكة الغابات والتجارة العالمية (GFTN) - أمريكا الشمالية
      headword_bare: شبكة الغابات والتجارة العالمية (GFTN) - أمريكا الشمالية
      headword_norm: شبكة الغابات والتجارة العالمية (GFTN) - امريكا الشمالية
      root: شبك
      root_source: lane
      pos: null
      form: null
      is_partial: 0
      definitions_text: شبكة الغابات والتجارة العالمية (GFTN) هي مبادرة من الصندوق العالمي للحياة البرية (WWF) تهدف إلى القضاء
        على القطع غير المشروع للأشجار وتعزيز إدارة الغابات المسؤولة بيئيا واجتماعيا. الشبكة العالمية للغابة والتجارة - أمريكا
        الشمالية (GFTN-NA) تصل بين الشركات الرائدة في الولايات المتحدة وكندا لتحليل أصول الخشب والورق، وذلك لتقييم وتخفيف
        مخاطر سلسلة التوريد، والقضاء على المصادر غير المستدامة، والزيادة على مر الزمن تدريجيا في حجم المواد الحائزة على شهادة
        مجلس رعاية الغابات (FSC) والمواد المعاد تدويرها في سلاسل التوريد.
      translation_en: the global forest & trade network - north america
      translation_fr: réseau mondial forest & trade - amérique du nord
      domain: Climate, Environment and Solid Waste management
      external_id: arabterm:69982
