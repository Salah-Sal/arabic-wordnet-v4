      headword: 'الشّامانية: «أ» دينٌ بدائيّ من أديان شمالي آسيا وأوروبا يتميّز بالاعتقاد بوجود عالم محجوب، هو عالم الآلهة
        والشياطين وأرواح السّلَف، وبأن هذا العالم لا يستجيب إلّا للشّامان (را. المادة السابقة). «ب» دين مماثل وبخاصة عند بعض
        هنود أميركا الشمالية الحمر. shamanistic'
