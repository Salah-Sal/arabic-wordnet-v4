      definitions_text: إحدى قارتي نصف الكرة الغربي. وثالثة القارات مساحة, وتبلغ مساحتها (٨,٣٨٥,٠٠٠ ميل مربع), وعدد سكانها
        نحو (٢٥٠) مليون نسمة, ويحف بها المحيط القطبى الشمالي في الشمال, والمحيط الأطلسى في الشرق, والمحيط الهادى في الغرب.
        وتمتد بين دائرتي العرض ٩/١٥, ٣٩ / ٨٣ شمالا. وقد كشفت منذ نحو أربعة قرون ونصف, تنسب إلى "أمريجو فسبوتشى" بحار إيطالى.
        وهناك من يقول بأن العرب كانوا أول من كشفها
