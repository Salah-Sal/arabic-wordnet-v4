  assessment:
    decision: retain
    reason: "التعريف دقيق ومكتمل — يذكر العناصر الجوهرية الثلاثة للمفهوم (عربات معلّقة + كابلات + أبراج)، ويُحدّد الوظيفة (نقل الركاب والبضائع)، ويطابق الأدلة المعجمية لـ«تلفريك» و«معبر هوائي»"
  # authored_definitions محذوفة — القرار retain (DRY)
  # actions محذوفة — لا تغيير للتعريف (DRY)


