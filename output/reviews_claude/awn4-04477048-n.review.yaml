step0_evidence:
  per_lemma:

    - lemma: "ترامواي"
      confirm:
        - text: "«ترامواي» — مدرجة كمقابل عربي لـ tramway"
          source: "المعجم الموحد لمصطلحات النقل (2010)"
      contradicts:
        - text: "«ترام؛ ترامواي.» — streetcar"
          source: "المورد الحديث (2008)"
          conflict: "يربط ترامواي بـ streetcar أي الترام الأرضي الذي يسير على سكة في الطريق العام، وهو مختلف جوهرياً عن المركبة الهوائية المعلّقة بالكابلات والمحمولة بالأبراج التي يصفها تعريف المجموعة"

    - lemma: "تلفريك"
      confirm:
        - text: "«تِلِفْريك [مفرد]: وسيلة مواصلات معلّقة تعمل بالكهرباء وتسير على أسلاك معلقة في الهواء»"
          source: "معجم اللغة العربية المعاصرة لأحمد مختار عمر (ت. 2003)"
        - text: "«(Téléfereque): وَسِيلة لِنَقْل الناس فى مركَبَاتٍ هَوائِيَّة كَهْربيَّة معلَّقة»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
      expands:
        - text: "«ويُطلَق عليه أيضاً مِعْبَر هوائى»"
          source: "المعجم الكبير (مجمع اللغة العربية)"
          addition: "وجود مصطلح عربي بديل «معبر هوائي» موثَّق في معجم مجمع اللغة العربية يستحق الإضافة إلى المجموعة"

    - lemma: "قطار هوائي"
      evidence_status: "no_material_found"
      peripheral_observations:
        - "مكوّن «قطار» في المعاجم يحيل إلى مجموعة مركبات السكة الحديدية الأرضية التي تجرها قاطرة (المعجم الوسيط: «مجموعة من مَرْكبات السكة الحديدية تجرها قاطِرة»؛ المعجم الموحد للنقل: «قاطرات منفصلة أو متصلة ببعضهما بهما عربات»)، لا إلى مركبات معلّقة هوائياً"
        - "لم يُعثر على التركيب «قطار هوائي» كوحدة معجمية مسكوكة في أي من المصادر المفحوصة"


step05_lemma_generation:
  evidence_candidates:
    - lemma: "الطريق الحبلي"
      source_section: "step5_english_bridge"
      evidence_citation: "«الطريق الحَبْليّ: طريقٌ قِوامُهُ حَبْلٌ فولاذيّ أو حبلان فولاذيان منصوبان» — المورد الحديث (2008)"
      justification: "مصطلح مُوثَّق في المورد الحديث كمقابل لـ ropeway (أحد مرادفات المجموعة الإنجليزية)؛ يصف البنية الكابلية الأساسية للمفهوم؛ تركيب إضافي-وصفي مسجَّل في معجم معتمد"
  knowledge_candidates:
    - lemma: "معبر هوائي"
      justification: "تركيب إضافي-وصفي عربي أصيل (آلية: التركيب الإضافي)؛ «معبر» من الجذر ع-ب-ر (وزن مَفْعَل = اسم آلة/مكان) بمعنى وسيلة العبور، «هوائي» نسبة إلى الهواء بمعنى المرتفع في الجو؛ يصف بدقة وسيلة النقل المعلّقة في الهواء التي تُعبِّر الركاب والبضائع بين نقطتين مرتفعتين"
  generation_notes: "التعريف يصف نظام نقل معلّقاً (عربات + كابلات + أبراج)؛ الجذور الدلالية المركزية: ع-ب-ر (العبور)، ح-ب-ل (الكابل)، ع-ل-ق (التعليق)؛ المصطلح العالمي السائد مقترض من الفرنسية (téléférique) وقد طغى على المقابلات العربية"


step1_lemma_validation:
  per_lemma:

    # ── ترامواي — محذوفة: تحويل حرفي أعمى للدلالة اللفظية ──
    - lemma: "ترامواي"
      decision: removed
      decision_reason: "تحويل حرفي أعمى (Blind Literal) — «ترامواي» في العربية يحيل إلى الترام الأرضي (streetcar/tram) لا إلى المركبة الهوائية المعلّقة بالكابلات والمحمولة بالأبراج"
      evidence_assessment:
        case: "contradicts"
        notes:
          - "الأدلة المعجمية تربط ترامواي بالترام الأرضي السائر على سكة في الطريق العام"
          - "الإنجليزية تستخدم «tramway» للمفهومين (الأرضي والهوائي) لكن العربية خصّصت «ترامواي» للمعنى الأرضي"
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "يستقل السياح التلفريك لصعود قمة الجبل معلّقين بين السماء والأرض"
            substituted: "يستقل السياح الترامواي لصعود قمة الجبل معلّقين بين السماء والأرض"
            preserved_meaning: false
            why_failed: "«الترامواي» في الوعي اللغوي العربي يستحضر صورة المركبة الأرضية السائرة على قضبان في الشارع، لا المعلّقة بين الجبال"
      nuance_differentiation: "لا تمايز دلالي داخل المجموعة — المشكلة أن المصطلح لا يحمل المفهوم المقصود أصلاً"
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── تلفريك — مؤكَّدة: دخيل معرَّب مُقرٌّ بأدلة معجمية قاطعة ──
    - lemma: "تلفريك"
      decision: confirmed
      decision_reason: "أدلة معجمية مؤكِّدة من معجمين، لفظ دخيل معرَّب مستقرٌّ في المعاجم العربية المعاصرة"
      evidence_assessment:
        case: "confirm_only"
      substitution_test:
        result: "pass"
      nuance_differentiation: "اللمّة الوحيدة المؤكَّدة التي تحمل المفهوم بدقة — مصطلح تقني معرَّب من الفرنسية (téléférique) متخصص في المنظومة الهوائية المعلّقة؛ يتمايز عن «معبر هوائي» بالتحديد التقني وبالشيوع في الاستعمال الحديث"
      mwe_check:
        is_mwe: false
      # فحص الاقتراض:
      # أ. لفظ مقترض من الفرنسية (Téléférique) — معرَّب (أُخضع للصرف العربي: يقبل «ال» والإضافة) → مقبول
      # ب. لا ترجمة حرفية — المفهوم العلمي صحيح
      # ج. لا استعارة مفهومية (calque)
      # بوابة الجودة: مستعمل فعلياً ✓، يقبل «ال» التعريف ✓، يناظر المفهوم ✓، لا بديل مفرد عربي شائع ✓
      # الملاءمة الصرفية: لا وزن صرفي عربي (دخيل) — لا ملاحظة
      example: "يستقلّ الزوار التلفريكَ للوصول إلى قمة الجبل المطلّة على المدينة، معلّقين فوق الوديان العميقة"
      actions: []

    # ── قطار هوائي — محذوفة: تركيب وصفي حر + ترجمة حرفية مضلِّلة ──
    - lemma: "قطار هوائي"
      decision: removed
      decision_reason: "تركيب وصفي حر غير مسكوك في المعاجم، وفيه إيهام دلالي (قطار = مركبة أرضية)"
      evidence_assessment:
        case: "no_material"
        notes:
          - "لم يُعثر على التركيب كوحدة معجمية ثابتة في أي مصدر"
          - "مكوّن «قطار» يحيل إلى السكك الحديدية الأرضية"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "يستقل السياح التلفريك صعوداً نحو القمة"
            substituted: "يستقل السياح القطار الهوائي صعوداً نحو القمة"
            preserved_meaning: false
            why_failed: "«القطار» في الوعي اللغوي العربي مرتبط بالسكة الحديدية الأرضية (train/railway)؛ وصفه بـ«هوائي» يبدو متناقضاً مع دلالته الأصلية ولا يُنتج مصطلحاً مسكوكاً"
      nuance_differentiation: "لا تمايز مقصود — المشكلة أن التركيب لا يحمل المفهوم بدقة: «قطار» يوحي بالأرضي، و«هوائي» يعدّل لكن التركيب يظل عرضياً لا اصطلاحياً"
      # فحص الاقتراض:
      # ب. ترجمة حرفية عمياء لـ aerial tramway — المشكلة: «قطار» لا يطابق المدلول العلمي للمفهوم (ليس قطاراً أرضياً)
      # اختبار السكّ: يمكن إبدال «هوائي» بـ«معلّق» أو «كابلي» وبقي التعبير وصفياً → فشل اختبار السكّ
      # اختبار التثبيت المعجمي: لم يرد في أي معجم → مرفوض
      actions:
        - command: remove_sense
          params:
            sense_id: "{auto}"

    # ── الطريق الحبلي — مرشح من الخطوة ٠٫٥ — مرفوض ──
    - lemma: "الطريق الحبلي"
      source: step05
      decision: removed
      decision_reason: "يصف البنية التحتية (المسار/الطريق) لا وسيلة النقل كوحدة متكاملة؛ المفهوم في السينوسيت هو conveyance (وسيلة نقل) وليس ropeway (مسار كابل)"
      step05_citation: "«الطريق الحَبْليّ: طريقٌ قِوامُهُ حَبْلٌ فولاذيّ أو حبلان فولاذيان منصوبان» — المورد الحديث (2008)"
      mwe_check:
        is_mwe: true
        accepted: false
      substitution_test:
        result: "fail"
        failure_sentences:
          - original: "يُنقل المسافرون بالتلفريك فوق الوادي"
            substituted: "يُنقل المسافرون بالطريق الحبلي فوق الوادي"
            preserved_meaning: false
            why_failed: "«الطريق الحبلي» يصف المسار/البنية التحتية لا وسيلة النقل ذاتها (العربات المعلّقة)؛ فضلاً عن أن تعريفه المعجمي لا يذكر الأبراج أو العربات المعلّقة"
      nuance_differentiation: "مدلوله مختلف — يصف infrastructure لا conveyance"

    # ── معبر هوائي — مرشح من الخطوة ٠٫٥ — مقبول ──
    - lemma: "معبر هوائي"
      source: step05
      decision: confirmed
      decision_reason: "موثَّق في المعجم الكبير (مجمع اللغة العربية) كاسم بديل للتلفريك؛ تركيب عربي أصيل على وزن مَفْعَل + نسبة؛ نجح في الإبدال"
      step05_citation: "«ويُطلَق عليه أيضاً مِعْبَر هوائى» — المعجم الكبير (مجمع اللغة العربية)"
      mwe_check:
        is_mwe: true
        accepted: true
        # نوع المركب: وصفي (معبر + هوائي)
        # اختبار السكّ: التعبير مسجَّل في المعجم الكبير حرفياً → نجح اختبار التثبيت المعجمي
      substitution_test:
        result: "pass"
        pass_sentences:
          - original: "يستقل السياح التلفريك من قاع الوادي إلى الفندق الجبلي"
            substituted: "يستقل السياح المعبر الهوائي من قاع الوادي إلى الفندق الجبلي"
            preserved_meaning: true
      nuance_differentiation: "يتمايز عن «تلفريك» بكونه لفظاً عربياً أصيلاً يُبرز الوظيفة (العبور) والخاصية (الهوائي/المرتفع)؛ «تلفريك» أشيع في الاستعمال لكنه دخيل لا دلالة مباشرة فيه؛ «معبر هوائي» أكثر وضوحاً للمتلقي العربي غير المتخصص"
      # فحص الاقتراض: لفظ عربي أصيل — لا اقتراض
      # بوابة الجودة:
      #   الاطّراد وشيوع الفصيح: مستخدم في مراجع عربية معتمدة ✓
      #   يُسر التداول: ميسور النطق ✓
      #   الملاءمة: يتناظر مع المفهوم (عبور هوائي) ✓
      #   إيثار العربي: فضلاً على الدخيل ✓
      #   الاشتقاقية: «عبر» → يعبر، عبور، مَعبَر — أسرة اشتقاقية خصبة ✓
      # الملاءمة الصرفية: معبر على وزن مَفْعَل — يدل على اسم الآلة/المكان — مناسب لوسيلة العبور ✓
      example: "يستقل الزوار المعبرَ الهوائي ليعبروا الوادي العميق بين الجبلين في رحلة سياحية استثنائية"
      actions:
        - command: create_entry
          params:
            lemma: "معبر هوائي"
            pos: n
        - command: add_sense
          params:
            entry_id: "{auto}"
            synset_id: "awn4-04477048-n"

  synset_flags:
    split_needed: false
  added_lemmas:
    - lemma: "معبر هوائي"
      reason: "مصطلح عربي أصيل موثَّق في المعجم الكبير (مجمع اللغة العربية) كاسم بديل للتلفريك — مصدر: الخطوة ٠٫٥"
      via_command: create_entry + add_sense


